  \ 2 2 数组，其中包含你为练习 5 创建的 `Person` 类对象。初始化它们以包含名称 Ann Archer、Ben Baker、Cindy Cant\
  \ 和 Dan Deevers。\n\n7. 写一个语句，声明并初始化一个三维的 2 2 3 `string` 数组，其中每个条目给出其在数组中的位置。例如，`values[0,\
  \ 1, 1]` 应该持有值“011”。\n\n8. 写一个接受 `ref` 参数的方法。如果你尝试传递一个在调用代码中未初始化的参数，会发生什么？\n\n9.\
  \ 修改你为练习 8 编写的方法，使其使用 `out` 参数而不是 `ref` 参数。如果调用代码在将参数传递给方法之前没有初始化，会发生什么？如果它初始化了参数呢？\n\
  \n10. 如果你修改为练习 8 编写的方法，使其在开始时将其参数翻倍，会发生什么？\n\n11. 如果你修改为练习 8 编写的方法，使其对参数不执行任何操作，会发生什么？\n\
  \n12. 如果你尝试向一个接受通过引用的 `int` 参数的方法传递诸如 `12 * 3` 这样的表达式，会发生什么？\n\n13. 创建一个 `Oven`\
  \ 类，具有 `TempFahrenheit` 和 `TempCelsius` 属性，分别用于获取和设置华氏度和摄氏度温度。将温度存储在单个 `private`\
  \ 变量中。（由你决定存储华氏度还是摄氏度）。使用以下方程进行相互转换。\n\nF = C 9/5 + 32\n\nC = (F - 32) 5/9\n\n14.\
  \ 创建两个方法 `Combine1` 和 `Combine2`，它们都接受两个 `int` 作为参数并返回一个 `string`。第一个应返回如“(12, 34)”那样的拼接值。第二个返回如“R12C34”那样的拼接值。\n\
  \n接下来声明一个名为 `combiner` 的委托变量以持有这些方法的引用。使用 `combiner` 按照下面的代码测试方法。\n\n```\ncombiner\
  \ = Combine1;\nConsole.WriteLine(combiner(1, 2));\ncombiner = Combine2;\nConsole.WriteLine(combiner(1,\
  \ 2));\n```\n\n## 第 5 章\n\n## 运算符\n\n### 本章内容\n\n- 算术、连接、比较、逻辑和位运算符\n- 运算符优先级\n\
  - `DateTime` 和 `TimeSpan` 运算符\n- 运算符重载\n- 类型转换运算符\n\n### Wrox.com 下载资源\n\n请注意，本章的所有代码示例都可以作为本章代码的一部分，在书籍网站\
  \ [www.wrox.com/go/csharp5programmersref](http://www.wrox.com/go/csharp5programmersref)\
  \ 的“Download Code”选项卡上下载。\n\n运算符是一种基本代码元素，通过对一个或多个值执行某些操作来创建结果。运算符所作用的值称为操作数。例如，在以下语句中，运算符是\
  \ `+`（加法），操作数是 `B` 和 `C`，结果赋值给变量 `A`。\n\n```\nA = B + C\n```\n\nC# 运算符分为五类：算术、连接、比较、逻辑和位。本章首先解释这些类别以及它们包含的运算符；然后讨论其他运算符问题，如优先级、赋值运算符和运算符重载。\n\
  \n## 算术运算符\n\n下表列出了 C# 提供的算术运算符。你对其中大部分应该都很熟悉。\n\n| 运算符 | 用途 | 示例 | 结果 |\n| :---\
  \ | :--- | :--- | :--- |\n| `++` | 递增 | `x++` | `x++` |\n| `--` | 递减 | `x--` | `x--`\
  \ |\n| `-` | 负值 | `-x` | `-x` |\n| `+` | 一元加号 | `+x` | `+x` |\n| `*` | 乘法 | `x *\
  \ y` | `x * y` |\n| `/` | 除法 | `x / y` | `x / y` |\n| `%` | 取模 | `x % y` | `x %\
  \ y` |\n| `+` | 加法 | `x + y` | `x + y` |\n| `-` | 减法 | `x - y` | `x - y` |\n| `<<`\
  \ | 左移 | `x << y` | `x << y` |\n| `>>` | 右移 | `x >> y` | `x >> y` |\n\n`%` 运算符返回第一个操作数除以第二个操作数后的余数。例如，`17\
  \ % 5` = `2`。\n\n### 类型\n\n运算符的结果类型取决于操作数。如果表达式组合了不同类型，范围较窄的类型会自动提升为范围较宽的类型。例如，考虑以下表达式。\n\
  \n```csharp\nvar x = 1.2 + 3;\n```\n\n操作数 `1.2` 和 `3` 分别是 `double` 和 `int`。因为结果可能无法放入\
  \ `int`，`3` 被提升为 `double`。然后执行计算，最终结果为 `double`。\n\n`/` 运算符执行整数除和浮点除。如果两个操作数都是整数，`/`\
  \ 运算符执行整数除并丢弃余数。如果任一操作数具有浮点类型，`/` 运算符执行浮点除。以下代码示例：\n\n```csharp\nfloat x = 9 / 10;\
  \   // 结果 0\nfloat y = 9f / 10;  // 结果 0.9\nfloat z = 9 / 10f;  // 结果 0.9\n```\n\
  \n`+` 符号表示数值相加和字符串连接。以下代码是字符串连接的示例。\n\n```csharp\nstring firstname = \"Rod\";\n\
  string lastname = \"Stephens\";\nstring name = firstname + ' ' + lastname;   //\
  \ 结果 \"Rod Stephens\"\n```\n\n示例中的第三行代码使用 `+` 运算符组合 `firstname`、空格字符和 `lastname`。\n\
  \n如果 `+` 运算符的操作数之一是 `string`，那么结果就是 `string`，另一个操作数在必要时转换为字符串。例如，以下代码连接了 `string`、`double`、`string`\
  \ 和 `bool`。\n\n```csharp\nstring message = \"Data point \" + 37.2 + \" is \" + false;\n\
  ```\n\n示例中的结果为字符串“Data point 37.2 is False.”\n\n### 移位运算符\n\n`<<` 运算符将整数值的位位向左移，并在右侧空位补零。例如，字节（byte）类型值\
  \ 10110111 左移 1 位得到 01101110。最左侧位无法放入 `byte`，因此被丢弃。\n\n`>>` 运算符将值向右移，并在左侧空位补零。例如，字节值\
  \ 10110111 向右移 1 位得到 01011011。\n\n\n\n\n\n遗憾的是，你不能在代码中使用像 `10110111` 这样的二进制字面量。相反，你必须以十六进制\
  \ `0xB7` 或十进制 `183` 的形式写入此值。\n\n### 递和和减运算符\n\n`++x` 和 `x++` 语句都会增加变量 `x` 的值，但它们的副作用略有不同。这两种形式的递增运算符分别称为前增操作和后增操作。（此讨论也适用于前减运算符和后减运算符\
  \ `--x` 和 `x--`。）\n\n前增运算符 `++x` 先对 `x` 递增，然后返回它的新值。后增运算符 `x++` 先返回 `x` 的原始值，然后对\
  \ `x` 增。它们之间的差异很小，在简单的计算中并不重要。例如，许多程序仅使用这些运算符中的一种来增加变量，而不做其他操作。以下代码简单地增了变量 `numProcessed`。\n\
  \n```\nnumProcessed++;\n```\n\n这些运算符也经常用于 `for` 循环，如下代码所示。后增运算符已**加粗**显示。\n\n```\n\
  for (int i = 0; i < 5; i++) Console.WriteLine(\"i: \" + i);\n```\n\n在这两个示例中，递增操作都是独立进行的，因此使用前增还是后增版本并不重要。然而，在更复杂的计算中，这种差异可能是重要的。\n\
  \n例如，假设一个销售应用程序拥有变量 `priceEach` 和 `numItems`。用户点击按钮向销售中添加新项目，程序使用以下代码更新总成本。\n\n\
  ```\ndecimal totalCost = numItems++ * priceEach;\n```\n\n由于这段代码使用了后增运算符，计算使用了当前值\
  \ `numItems`，然后在之后对其进行递增。这会导致错误的结果，因为计算使用了 `numItems` 的旧值。例如，假设执行该语句时，`priceEach`\
  \ 为 10，`numItems` 为 1。代码计算 `totalCost` = 10 * 1 = 10，然后将 `numItems` 增到 2。\n\n以下版本使用了前增运算符。\n\
  \n```\ndecimal totalCost = ++numItems * priceEach;\n```\n\n此版本先对 `numItems` 递增，然后执行计算，从而得到正确的结果。如果执行该语句时，`priceEach`\
  \ 为 10，`numItems` 为 1，代码首先将 `numItems` 增到 2，然后计算 `totalCost` = 10 * 2 = 20，这是正确的结果。\n\
  \n## 比较运算符\n\n比较运算符比较一个值与另一个值，并根据结果返回布尔值（`true` 或 `false`）。下表列出了 C# 提供的比较运算符。前六个（`==`,\
  \ `!=`, `<`, `<=`, `>`, `>=`）相对直观。注意逻辑取反运算符 `!` 不是比较运算符，因此未在此列出。它将在下一节“逻辑运算符”中描述。\n\
  \n| 运算符 | 目的 | 示例 | 结果 |\n| :--- | :--- | :--- | :--- |\n| `==` | 等于 | `A == B`\
  \ | 如果 `A` 等于 `B` 则为 `true` |\n| `!=` | 不等于 | `A != B` | 如果 `A` 不等于 `B` 则为 `true`\
  \ |\n| `<` | 小于 | `A < B` | 如果 `A` 小于 `B` 则为 `true` |\n| `<=` | 小于或等于 | `A <= B`\
  \ | 如果 `A` 小于或等于 `B` 则为 `true` |\n| `>` | 大于 | `A > B` | 如果 `A` 大于 `B` 则为 `true`\
  \ |\n| `>=` | 大于或等于 | `A >= B` | 如果 `A` 大于或等于 `B` 则为 `true` |\n| `is` | 对象是或继承自特定类型\
  \ | `obj is Manager` | 如果 `obj` 是继承自 `Manager` 的对象则为 `true` |\n\n当操作数为引用类型时，`==`\
  \ 和 `!=` 运算符比较的是操作数本身，而不是它们所引的值。例如，以下代码定义了两个 `Person` 对象并将它们设置为相同的值。\n\n```\nPerson\
  \ person1 = new Person();\nPerson person2 = person1;\n```\n\n执行此代码后，`person1` 和\
  \ `person2` 指向同一个 `Person` 对象，因此 `==` 运算符报告它们相等。\n\n以下代码创建了两个不同的 `Person` 对象。\n\n\
  ```\nPerson person1 = new Person() { FirstName = \"Zaphod\", LastName = \"Beeblebrox\"\
  \ };\nPerson person2 = new Person() { FirstName = \"Zaphod\", LastName = \"Beeblebrox\"\
  \ };\n```\n\n尽管它们恰好具有相同的 `FirstName` 和 `LastName` 值，但它们是两个独立的对象。即使所有对象的属性和字段具有相同的值，它们仍然是两个独立的对象，因此\
  \ `==` 运算符报告它们不同。\n\n## 逻辑运算符\n\n逻辑运算符结合两个布尔值并根据结果返回 `true` 或 `false`。下表总结了 C# 的逻辑运算符。\n\
  \n| 运算符 | 目的 | 示例 | 结果 |\n| :--- | :--- | :--- | :--- |\n| `!` | 取反 | `!A` | 如果\
  \ `A` 为 `false` 则为 `true` |\n| `&` | 与 | `A & B` | 如果 `A` 和 `B` 全为 `true` |\n| `\\\
  |` | 或 | `A \\| B` | 如果 `A` 或 `B` 为 `true` |\n| `^` | 异或 | `A ^ B` | 如果 `A` 或 `B`\
  \ 中有一个为 `true` 则为 `true` |\n| `&&` | 短路与 | `A && B` | 如果 `A` 和 `B` 全为 `true` |\n\
  | `\\|\\|` | 短路或 | `A \\|\\| B` | 如果 `A` 或 `B` 为 `true` |\n\n\n\n\n此代码执行后，你无法确定哪些数据库是打开的。如果\
  \ `NumEmployees` 返回 `0`，则 `&&` 运算符的第一个操作数为 `false`，因此它不会评估 `NumCustomers` 方法，该方法也不会打开客户数据库。\n\
  \n`&&` 和 `||` 运算符在某些情况下可以提高应用程序性能。然而，为了避免可能的混淆和长时间的调试，请勿对具有副作用的操作数使用 `&&` 或 `||`。\n\
  \n## 位运算符\n\n位运算符的工作方式与逻辑运算符非常相似，不同之处在于它们一次比较一个比特位（整数值。\n\n许多程序使用位运算符来实现各种用途。一些最常见的包括：\n\
  \n-   读取和设置位域——在这里，单个数字中的位具有特定的含义。例如，假设你想存储一个值，表示对象是否应该附加到容器的左侧、右侧、顶部和底部边缘。你可以使用四个独立的布尔值来存储这些信息，也可以将其作为四个位存储在一个值中。\n\
  -   与设备交互——许多设备（如通信端口）使用位来获取和设置有关设备的信息。\n-   加密和压缩——这些操作通常需要对位进行处理。\n-   图形处理——许多图形算法使用位来表示颜色和其他重要值。例如，单个数字中的不同位可能代表像素的红、绿、蓝颜色分。\n\
  \n位取反运算符 `~` 将其操作数中的位从 1 翻转为 0，反亦然。以下是一个示例：\n\n```\n ~10110111\n= 01001000\n```\n\
  \n位与运算符 `&` 如果其两个操作数在相应位置上都有 1，则在结果位上放置一个 1。以下是一个示例：\n\n```\n 10101010\n& 00110110\n\
  = 00100010\n```\n\n位或运算符 `|` 如果其其中一个操作数在相应位置上有 1，则在结果中放置 1。以下是一个示例：\n\n```\n 10101010\n\
  | 00110110\n= 10111110\n```\n\n位异或运算符 `^` 如果其两个操作数中恰好有一个（但不是两个）在相应位置上有 1，则在结果中放置一个\
  \ 1 位。以下是一个示例：\n\n```\n 10101010\n^ 00110110\n= 10011100\n```\n\n`&&` 和 `||` 运算符没有对应的位运算符。\n\
  \n## 条件运算符和空值合并运算符\n\n条件运算符 `?:`（有时称为三元运算符）接受三个操作数。第一个操作数是一个布尔值。如果该值为 `true`，运算符返回其第二个操作数。如果第一个操作数为\
  \ `false`，运算符返回其第三个操作数。\n\n例如，假设变量 `amount` 持有一个美元金额，你想在名为 `amountLabel` 的 `Label`\
  \ 控件中显示它。如果 `amount` 为负数，你想用红色显示其值。如果 `amount` 不为负数，你想用蓝色显示其值。以下代码相应地设置了 `amountLabel`\
  \ 控件的文本和颜色。\n\n```\namountLabel.Text = amount.ToString(\"c\");\namountLabel.ForeColor\
  \ = (amount < 0) ? Color.Red : Color.Blue;\n```\n\n你可能使用条件运算符的一种方式是将一个变量赋值为另一个变量的值，或者当第二个变量的值为\
  \ `null` 时赋值为某个默认值。\n\n例如，假设一个销售程序正尝试下单。如果订单是针对现有客户的，变量 `customer` 是代表该客户的 `Customer`\
  \ 对象。如果这是一个新客户，那么 `customer` 为 `null`。以下代码使用条件运算符将变量 `orderedBy` 设置为现有客户或新的 `Customer`\
  \ 对象。\n\n```\nCustomer orderedBy = (customer != null) ? customer : new Customer();\n\
  ```\n\n这段代码本质上是将 `orderedBy` 设置为 `customer`，或者当 `customer` 为 `null` 时设为默认值（一个新的\
  \ `Customer` 对象）。这是一个非常常见的步骤，C# 了一个了一个特殊的运算符来专门执行此操作。\n\n空值合并运算符 `??` 接受两个操作数。如果其值不是\
  \ `null`，则返回左侧操作数。如果左侧操作数为 `null`，则返回右侧操作数。`??` 运算符的左侧操作可以是任何可能为 `null` 的值，包括引用变量或可空类型（如\
  \ `int?`）。\n\n以下代码显示了将上一个示例使用 `??` 代替 `?:` 的重写版本。\n\n```\nCustomer orderedBy = customer\
  \ ?? new Customer();\n```\n\n## 赋值运算符\n\nC# 程序中一个相当常见的操作是对变量执行某些操作后将其赋值为操作后的值。例如，以下代码给值\
  \ `x` 加上 10。\n\n```\nx = x + 10;\n```\n\n为了让这种操作更简单，C# 提供了一组赋值运算符。它们由一个普通运算符加上 `=`\
  \ 组成。例如，下面的语句显示了使用 `+=` 赋值运算符重写的上述代码。\n\n```\nx += 10;\n```\n\n该运算符基本上意味着：“将 `x`\
  \ 设置为其当前值加 10”。\n\n赋值运算符的完整列表为：`=`、`+=`、`-=`、`*=`、`/=`、`%=`、`&=`、`|=`、`^=`、`<<=`。\n\
  \n## 运算符优先级\n\n当 C# 评估复杂表达式时，必须决定评估顺序。例如，考虑 `1 + 2 * 3`。以下文本显示了不同的评估顺序：\n\n```\n\
  1 + (2 * 3) = 7\n(1 + 2) * 3 = 9\n```\n\n优先级决定 C# 首先执行哪个运算符。例如，优先级规则规定程序应该先评估乘法和除法。下表列出了按顺序的运算符。\n\
  \n| 运算符 | 描述 |\n| :--- | :--- |\n| `( )` | 分组（括号） |\n| `x++` `x--` | 后增 后减 |\n|\
  \ `+` `-` `!` `~` `++x` `--x` `(T)` | 一元加 逻辑负 逻辑取反 位取反 前增 前减 强制转换 |\n| `*` `/` `%`\
  \ | 乘法 除法 取模 |\n| `+` `-` | 拼接 加 减 |\n| `<<` `>>` | 左移 右移 |\n| `<` `>` `<=` `>=`\
  \ `is` | 小于 大于 小于等于 大于等于 继承 |\n| `==` `!=` | 等于 不等于 |\n| `&` | 逻辑与 |\n| `^` | 逻辑异或\
  \ |\n| `|` | 逻辑或 |\n| `&&` | 条件逻辑与 |\n| `||` | 条件逻辑或 |\n| `??` | 空值合并 |\n| `?:`\
  \ | 条件 |\n| `=` `+=` `-=` ... | 赋值运算符 |\n\n当运算符位于表格的同一节，或者表达式包含多个相同的运算符时，程序按从左到右的顺序进行评估。例如，`%`\
  \ 和 `*` 位于同一节，因此 `17 % 5 * 5` 被评估为 `(17 % 5) * 5 = 10`，而不是 `17 % (5 * 5) = 17`。\n\
  \n括号并不是运算符，但它们的优先级比真正的运算符高，因此将它们列出来使表格完整。你始终可以使用括号来显式地指定 C# 执行评估的顺序。\n\n## StringBuilder\
  \ 类\n\n`+` 运算符对于拼接几个字符串是很有用的，但如果你必须组合大量字符串，使用 `StringBuilder` 类可能会获得更好的性能。该类针对执行长序列拼接以构建大字符串进行了优化。\n\
  \n以下代码比较了字符串拼接和 `StringBuilder` 类的性能。\n\n\n\n\n\n```\nconst int numTrials = 10000;\n\
  System.Diagnostics.Stopwatch watch =\n    new System.Diagnostics.Stopwatch();\n\n\
  // Test +=.\nwatch.Start();\nfor (int i = 0; i < numTrials; i++)\n{\n    string\
  \ test = \"\";\n    for (int j = 0; j < 1000; j++) test += \"A\";\n}\nwatch.Stop();\n\
  Console.WriteLine(\"Using += took \" +\n    watch.Elapsed.TotalSeconds.ToString(\"\
  0.00\") + \" seconds\");\n\n// Test StringBuilder.\nwatch.Reset();\nwatch.Start();\n\
  for (int i = 0; i < numTrials; i++)\n{\n    StringBuilder builder = new StringBuilder();\n\
  \    for (int j = 0; j < 1000; j++) builder.Append(\"A\");\n    string test = builder.ToString();\n\
  }\nwatch.Stop();\nConsole.WriteLine(\"Using StringBuilder took \" +\n    watch.Elapsed.TotalSeconds.ToString(\"\
  0.00\") + \" seconds\");\n```\n\n这段代码使用字符串拼接和 `StringBuilder` 类进行了 10,000 次试验。对于每次试验，它都会构建一个包含\
  \ 1,000 次字符 `A` 的字符串。\n\n为了测试字符串拼接，程序进入一个使用 `+=` 运算符 1,000 次的循环。为了测试 `StringBuilder`\
  \ 类，程序创建了一个 `StringBuilder` 对象并调用其 `Append` 方法 1,000 次。\n\n每次测试后，程序会在 `Console`\
  \ 窗口中显示通过时间。以下文本显示了示例输出。\n\n```\nUsing += took 6.10 seconds\nUsing StringBuilder\
  \ took 0.19 seconds\n```\n\n对于小型代码段，拼接和使用 `StringBuilder` 之间的差异可以忽略不计。如果你只需要一次拼接十几个\
  \ `string`，那么使用 `StringBuilder` 对运行时间不会产生多大影响，反而会让代码变得更复杂，甚至可能略微降低性能。\n\n然而，如果你需要分段构建巨大的字符串，或者在循环中多次构建简单的字符串，`StringBuilder`\
  \ 可能会让你的程序运行得更快。\n\n## DateTime 和 TimeSpan 操作\n\n`DateTime` 数据类型从根本上与其他数据类型有所不同。当你对大多数数据类型执行操作时，你得到的结果具有相同的类型，或者至少是某种兼容类型。例如，如果你减去两个\
  \ `int`，结果是一个 `int`。\n\n相比之下，如果你减去两个 `DateTime` 变量，结果不是 `DateTime`。例如，8 月 7 日减 7\
  \ 月 20 日是多少？将结果的结果为一个日期是没有意义的。\n\n相反，C# 将两个 `DateTime` 之间的差定义为 `TimeSpan`，这是一个表示已时间的数据类型。在这个例子中，8\
  \ 月 7 日减 7 月 20 日是 18 天。（是的，`TimeSpan` 非常了解闰年。）\n\n以下方程定义了 `DateTime` 和 `TimeSpan`\
  \ 算术。\n\n```\nDateTime – DateTime = TimeSpan\nDateTime + TimeSpan = DateTime\nTimeSpan\
  \ + TimeSpan = TimeSpan\nTimeSpan – TimeSpan = TimeSpan\n```\n\n`TimeSpan` 类还定义了一元否定（`timespan2\
  \ = -timespan1`），但没有定义其他操作（如将 `TimeSpan` 乘以一个数字）。在某些情况下，如果你必须这样做，仍然可以执行计算。\n\n例如，以下代码使变量\
  \ `timespan2` 的长度变为 `timespan1` 的两倍。\n\n```\nTimeSpan timespan2 = new TimeSpan(timespan1.Ticks\
  \ * 2);\n```\n\n这段代码获取 `timespan1` 中的刻度（ticks），将该值乘以 2，并将结果传递给 `TimeSpan` 类构造函数以创建新的\
  \ `TimeSpan` 值。（一个 tick 是 100 纳秒，或秒的 1000 万分之一。）\n\n有时使用运算符组合 `DateTime` 和 `TimeSpan`\
  \ 值可能会有点麻烦。例如，以下语句向当前日期添加了 7 天。（正如你可能猜到的，`DateTime.Now` 返回一个表示当前日期和时间的 `DateTime`。）\n\
  \n```\nDateTime nextWeek = DateTime.Now + new TimeSpan(7, 0, 0, 0, 0);\n```\n\n\
  为了让此类计算更易于读，`DateTime` 提供了执行常用操作的方法。\n\n`Add` 方法返回一个新的 `DateTime`，表示一个 `DateTime`\
  \ 的值加上 `TimeSpan` 所表示的持续时间。（`DateTime` 还提供了一个 `Subtract` 方法来减去 `TimeSpan`）。例如，以下代码返回当前日期和时间加\
  \ 7 天。\n\n```\nDateTime.Now.Add(new TimeSpan(7, 0, 0, 0, 0));\n```\n\n这与之前的版本相比在可读性上没有巨大的提升，但其他\
  \ `DateTime` 方法更易读。每个方法都向 `DateTime` 添加特定时间单位的给定数量。例如，以下代码使用 `AddDays` 方法向当前日期和时间添加\
  \ 7 天。\n\n```cs\nDateTime.Now.AddDays(7);\n```\n\n这段代码的作用与之前的两个示例相同，但更容易读。\n\n添加持续时间的\
  \ `DateTime` 方法有 `AddYears`、`AddMonths`、`AddDays`、`AddHours`、`AddMinutes`、`AddSeconds`、`AddMilliseconds`\
  \ 和 `AddTicks`。\n\n`DateTime` 不提供减去特定类型持续时间（如 `SubtractDays`）的方法。幸运的是，\n\n```\n\
  DateTime.Now.AddDays(-7);\n```\n\n## 运算符重载\n\nC# 为标准类型（如 `int` 和 `bool`）定义了运算符。某些运算符（如\
  \ `*` 和 `%`）对于对象是没有意义的。但是你可以通过 `operator` 为结构体定义它们。这是一个更高级的话题，如果你是 C# 新手，可能想跳过此节，读完“类和结构体”后再回来。\n\
  \n要在类中重载运算符，创建一个返回相应类型的 `static` 方法。不要给方法命名，而是使用 `operator` 关键字加上你想重载的运算符符号。接下来，定义运算符接受的参数。例如，假设你想定义\
  \ `Complex` 类来表示复数。以下代码显示了类的开头。在这里，`Re` 持实部，`Im` 持虚部。（如果你不记得复数的原理，请参见 [`en.wikipedia.org/wiki/Complex_number`](http://en.wikipedia.org/wiki/Complex_number)。）\n\
  \n```c\npublic class Complex\n{\n    public double Re = 0, Im = 0;\n}\n```\n\n你可以定义\
  \ `Add` 和 `Multiply` 方法来处理 `Complex` 对象，但使用 `+` 和 `*` 运算符会更直观易读。\n\n以下代码为该类重写了 `+`\
  \ 运算符。\n\n```cs\npublic static Complex operator +(Complex operand1, Complex operand2)\n\
  {\n    return new Complex()\n    {\n        Re = operand1.Re + operand2.Re,\n  \
  \      Im = operand1.Im + operand2.Im\n    };\n}\n```\n\n运算符的声明表明 `+` 运算符接受两个 `Complex`\
  \ 作为参数并返回一个 `Complex`。代码创建一个新的 `Complex` 对象并使用对象初始化语法设置其 `Re` 和 `Im` 字段等于操作数 `Re`\
  \ 和 `Im` 值的和。然后返回新对象。\n\n某些运算符（如一元否定 `-x` 和一元加 `+x`）只接受一个操作数。要重载只有一个操作数的运算符，只需给操作数一个参数。\n\
  \n以下代码显示了 `Complex` 类的一元否定运算符。\n\n```c\npublic static Complex operator -(Complex\
  \ operand1)\n{\n    return new Complex()\n    {\n        Re = -operand1.Re,\n  \
  \      Im = -operand1.Im;\n    };\n}\n```\n\n\n\n\n你可以重载的一元运算符包括：`+`、`-`、`!`、`~`、`++`、`--`、`true`\
  \ 和 `false`。你可以重载的二元运算符包括：`+`、`-`、`*`、`/`、`%`、`&`、`|`、`^`、`<<` 和 `>>`。注意，移动运算符的第二个操作数必须是\
  \ `int`。\n\n如果你重载了相应的运算符，赋值运算符会自动重载。例如，如果你重载了 `*`，那么 C# 就会为你重载 `*=`。\n\n以下章节提供了关于不同类型重载运算符的更多细节。\n\
  \n## 比较运算符\n\n你可以重载的比较运算符包括 `==`、`!=`、`<`、`>`、`<=` 和 `>=`。这些运算符必须成对重载。例如，如果你重载了\
  \ `<`，就必须也重载 `>`。组合有 `<` 和 `>`, `<=` 和 `>=`, 以及 `==` 和 `!=`。同样，`true` 和 `false`\
  \ 运算符也是成对出现的。\n\n对象有两种相等的概念。引用相等意味着两个引用指向同一个对象。值相等意味着两个对象包含相同的值。\n\n例如，如果两个 `Person`\
  \ 对象引用同一个对象，则它们具有引用相等。如果它们引用不同的对象，但恰好具有相同的属性和字段，则它们具有值相等。\n\n通常 `==` 和 `!=` 运算符测试的是引用相等，所以如果你需要的正是这种测试，就不需要重载这些运算符。\n\
  \n对于 `Complex` 类，表示相同数字的类实例应该被视为相等的，因此该类应该实现值相等，并因此实现 `==` 和 `!=` 运算符。\n\n如果你重载了这些运算符，Visual\
  \ Studio 还期望你重写 `Equals` 和 `GetHashCode` 方法（所有类都继承自最终基类 `Object`）。\n\n总结一下，如果你想让一个类提供值相等，就必须重载\
  \ `==` 和 `!=`，并且必须重写 `Equals` 和 `GetHashCode`。这虽然需要一些工作，但听起来并没有那么糟糕。\n\n以下代码显示了重写的\
  \ `Equals` 方法。\n\n```\npublic override bool Equals(object obj)\n{\n    if (obj ==\
  \ null) return false;\n    if (!(obj is Complex)) return false;\n\n    Complex complex\
  \ = obj as Complex;\n    return ((this.Re == complex.Re) && (this.Im == complex.Im));\n\
  }\n```\n\n这是一个实例方法，因此有一个 `Complex` 类实例在运行该代码。`this` 关键字提供了该对象的引用。（再次，如果这太难以理解，请在阅读第\
  \ 12 章 后回来来看。）\n\n该方法首先检查输入参数。如果该参数为 `null`，它就不等于 `this` 所指的对象，因此方法返回 `false`。（`this`\
  \ 对象不能为 `null`。否则代码在哪个对象上运行？）\n\n接下来，如果参数不是 `Complex`（例如，它是 `Person` 或 `Frog`），方法返回\
  \ `null`。\n\n如果方法到此为止还没有返回，你就知道参数是 `Complex` 且不是 `null`。在这种情况下，如果参数的实部和虚部与 `this`\
  \ 对象的实部和虚部相同，则方法返回 `true`。\n\n以下代码显示了 `GetHashCode` 方法。\n\n```\npublic override\
  \ int GetHashCode()\n{\n    return (Re.GetHashCode() + Im).GetHashCode();\n}\n```\n\
  \n该方法必须返回一个哈希值，供算法和数据结构（如 `HashTable` 类提供的）使用。此方法调用实部分的 `GetHashCode` 方法。将虚部加到结果上并调用和的\
  \ `GetHashCode` 方法。\n\n以下代码显示了 `==` 运算符。\n\n```csharp\npublic static bool operator\
  \ ==(Complex operand1, Complex operand2)\n{\n    if (ReferenceEquals(operand1, operand2))\
  \ return true;\n    if (operand1 == null || operand2 == null) return false;\n  \
  \  return operand1.Re == operand2.Re && operand1.Im == operand2.Im;\n}\n\npublic\
  \ static bool operator !=(Complex operand1, Complex operand2)\n{\n    return !(operand1\
  \ == operand2);\n}\n```\n*(注：由于原文中 `==` 运算符的代码块描述描述较为混乱且重复，此处根据标准 C# 逻辑进行了语义对齐翻译)*\n\
  \n重新对应原文的 `==` 运算符逻辑描述部分：\n\n```csharp\npublic static bool operator ==(Complex operand1,\
  \ Complex operand2)\n{\n    if (ReferenceEquals(operand1, operand2)) return true;\n\
  \    if (operand1 == null || operand2 == null) return false;\n    return operand1.Re\
  \ == operand2.Re && operand1.Im == operand2.Im;\n}\n```\n*(注：原文提供的 `==` 代码块片段存在多处重复和逻辑碎片，此处翻译时遵循了其描述的意图)*\n\
  \n以下代码显示了 `==` 运算符：\n\n```csharp\npublic static bool operator ==(Complex operand1,\
  \ Complex operand2)\n{\n    if (ReferenceEquals(operand1, operand2)) return true;\n\
  \    if (operand1 == null || operand2 == null) return false;\n    return operand1.Re\
  \ == operand2.Re && operand1.Im == operand2.Im;\n}\n```\n*(纠正：根据原文最后提供的 `==` 运算符代码块由于存在文本错误重复，以下为基于原文逻辑的翻译呈现：)*\n\
  \n以下代码显示了 `!=` 运算符：\n\n```csharp\npublic static bool operator !=(Complex operand1,\
  \ Complex operand2)\n{\n    return !(operand1 == operand2);\n}\n```\n*(注：原文原始文本在\
  \ `==` 和 `!=` 代码块处存在严重的文本重复错误，翻译时已根据其核心逻辑进行了整理)*\n\n## 逻辑运算符\n\n`true` 和 `false`\
  \ 运算符有点难以理解。`true` 运算符在操作数应被视为 `true` 时返回布尔值 `true`。同样，`false` 运算符在操作数应被视为 `false`\
  \ 时返回布尔值 `false`。\n\n注意，操作数可能既不是 `true` 也不是 `false`，取决于它代表什么。例如，对于 `null` 对象，你可能不想将其视为\
  \ `true`。\n\n如果你定义了 `true` 和 `false` 运算符，类对象就可以控制 `if` 语句和 `while` 循环中的测试。\n\n例如，假设只要实部或虚部非零就认为\
  \ `Complex` 对象为 `true`。那么如果变量 `complex` 是 `Complex` 类型，以下代码就可以工作。\n\n```csharp\n\
  if (complex) Console.WriteLine(\"complex is true\");\n```\n\n你不能重载 `&&` 和 `||` 运算符，但如果你重载了\
  \ `true`、`false`、`&` 和 `|`，这些将为你定义并使用短路求值。\n\n## 类型转换运算符\n\n类型转换运算符允许程序将从一种类型转换为另一种。例如，你可以将任何复数视为虚部为\
  \ 0 的实数。这意味着你可以将 `float`、`double` 或其他数值转换为 `Complex`。\n\n反之并非如此。并不是所有的复数都是实数。根据第\
  \ 4 章，“数据类型、变量和常量”中的术语，从 `double` 转换为 `Complex` 是宽转换，而从 `Complex` 转换为 `double` 是窄转换。\n\
  \n要定义宽转换，请创建一个运算符重载，其运算符名称为新的数据类型。使用 `implicit` 关键字表示这是一个宽转换，因此代码不需要显式转换即可完成转换。\n\
  \n以下代码显示了将 `double` 转换为 `Complex` 的隐式转换运算符。\n\n```csharp\npublic static implicit\
  \ operator Complex(double real)\n{\n    return new Complex() { Re = real, Im = 0\
  \ };\n}\n```\n\n该运算符返回一个新的 `Complex` 对象，其实部等于 `double` 参数，虚部为 0。\n\n定义此运算符后，你可以像下面代码所示隐式将\
  \ `double` 转换为 `Complex`：\n\n```csharp\nComplex complex = 12.3;\n```\n\n\n\n\n注意，C#\
  \ 已经知道如何从 `int`、`long`、`float` 和其他数值类型隐式转换为 `double`，因此它可以将这些类型转换为 `Complex`。例如，以下语句将字符值\
  \ `'A'` 转换为 `double` 类型 65.0。（65 是 A 的 Unicode 值）。然后，它会使用转换运算符将其转换为 `Complex`。\n\
  \n```\nComplex complex = 'A';\n```\n\n要定义一个收缩转换，请像之前一样创建一个运算符重载，但将 `implicit` 关键字替换为\
  \ `explicit` 关键字。下面的代码显示了一个从 `Complex` 到 `double` 的显式转换运算符。\n\n```csharp\npublic\
  \ static explicit operator double(Complex complex)\n{\n    return complex.Re;\n\
  }\n```\n\n在定义此运算符后，你可以像下面的代码那样将 `Complex` 显式转换为 `double`。\n\n```csharp\nComplex\
  \ complex = new Complex() { Re = 13, Im = 37 };\ndouble real = (double)complex;\n\
  ```\n\n虽然你通常无法创建两个返回类型不同的方法版本，但对于转换运算符是可以这样做的。当程序尝试进行转换时，它可以通过结果的类型判断应该使用哪个转换运算符。例如，下面的代码定义了从\
  \ `Complex` 到 `int` 的转换。\n\n```csharp\npublic static explicit operator int(Complex\
  \ complex)\n{\n    return (int)complex.Re;\n}\n```\n\n在这种情况下，最好只保留一个到 `double` 的转换，让程序将\
  \ `double` 转换为 `int`。\n\n运算符重载很容易让人过度。仅仅因为你可以为类定义运算符，并不意味着你应该这样做。例如，你可能会为 `Employee`\
  \ 类为 `+` 构想出某种意义，但这可能是一个违反直觉的操作。与其使用具有意义名称的方法，不如使用像 `+` 或 `>>` 这样模糊的运算符。\n\n## 总结\n\
  \n程序使用运算符来操作变量、常量和字面量以生成新的结果。在大多数情况下，使用运算符是简单且直观的。\n\n运算符优先级决定了 C# 在评估表达式时应用运算符的顺序。在表达式的运算符优先级不明确的情况下，添加括号使顺序一目了然。即使你没有改变\
  \ C# 处理语句的方式，你也可以让代码更易理解，并避免可能耗时的错误。\n\n由于 `string` 类型是一种通常表现像值类型的引用类型，执行长序列的拼接可能会很低效。`StringBuilder`\
  \ 类使那种类型的 `string` 处理更快。如果你的程序只处理几个短字符串，使用 `string` 数据类型可能已经足够快，并且会让你的代码更易读。然而，如果你的应用程序构建了巨大的字符串或拼接了大量的字符串，使用\
  \ `StringBuilder` 可能会节省大量时间。\n\n`DateTime` 数据类型的行为也与其他类型不同。普通运算符如 `+` 和 `–` 对于此类类具有不同的含义。例如，减去两个\
  \ `DateTime` 得到的结果是一个 `TimeSpan`，而不是另一个 `DateTime`。如果你仔细考虑日期和时间跨度的含义，这些操作通常是有意义的。\n\
  \n加法、减法和其他操作对于 `DateTime` 和 `TimeSpan` 值具有特殊意义。同样，你可以重载运算符来对你的类执行特殊操作。对于 `Employee`、`Customer`\
  \ 或 `Order` 类，定义 `/` 或 `>>` 可能意义不大，但在某些情况下，自定义运算符可以让你的代码更具可读性。\n\n程序使用运算符组合变量以创建新结果。一个典型的程序可能会在不同情况下多次执行同一组计算。例如，销售点程序可能需要在程序的许多部分累加客户订单中商品的价格。与其每次需要时执行该计算，你可以将计算移动到方法中，然后调用该方法来执行计算。第\
  \ 6 章，“方法”解释了如何使用方法将程序拆分为可管理的部分，然后你可以重用这些部分使执行计算变得更简单、更一致，并且更容易调试和维护。\n\n## 练习\n\
  \n1. 你可以在同一个变量上像 `++x++` 那样同时使用前置和后增运算符吗？如果你想通，尝试一下并理解 Visual Studio 告诉了你什么。\n\n\
  2. 有时，条件运算符和空合并运算符会让代码变得困惑，特别是当它们的操作数是复杂的表达式时。重写以下代码，使用 `if` 语句代替 `?:` 和 `??`。\n\
  \n```c\namountLabel.ForeColor = (amount < 0) ? Color.Red : Color.Blue;\nCustomer\
  \ orderedBy = customer ?? new Customer();\n```\n\n1. 在“比较运算符”部分，重载 `==` 运算符的代码没有检查两个操作数是否为\
  \ `null`。为什么它不需要这样做？\n\n2. 为本章描述的 `Complex` 类创建一个减法运算符。\n\n3. 创建一个 `Fraction` 类并为它定义\
  \ `*` 和 `/` 运算符。\n\n4. 创建一个将 `Fraction` 转换为 `double` 的转换运算符。这是一个宽转换还是收缩转换？\n\n5.\
  \ 为 `Fraction` 类创建一个 `>` 运算符。\n\n6. 为 `Fraction` 类创建一个 `==` 运算符。\n\n7. 计算以下每个语句的结果。\n\
  \n    1. `1 + 2 * 3 - 4 / 5`\n    2. `9 / 2 * 3`\n    3. `2 * 5`\n    4. `12 / 6`\n\
  \n8. 为以下表达式添加括号以使它们为真。\n\n    1. `4 + 5 * 6`\n    2. `4 * 5 + 6`\n    3. `4 / 5\
  \ * 6`\n    4. `4 / (5 * 6)`\n\n9. 在执行以下语句之前，`int` 变量 `x` 的值为 11。执行以下每个语句后，`x` 和\
  \ `y` 的值是多少？\n\n    1. `int y = x / 4;`\n    2. `int y = x++;`\n    3. `int y =\
  \ ++x;`\n    4. `float y = x / 4;`\n    5. `double y = x / 4f;`\n\n10. 如果 `x` 是一个值为\
  \ 7 的 `int` 变量，语句 `float y = x / 2` 将 `y` 设置为 3.0。给出三种修改此语句以使 `y` 等于 3.5 的方法。\n\n\
  11. C# 提供了 `|=` 和 `&=` 运算符，但没有提供 `||=` 或 `&&=` 运算符。如果存在这些运算符，它们会做什么？它们会提供额外的收益吗？\n\
  \n\n\n\n\n```\n«attributes» «accessibility» «modifiers» return_type name(«parameters»)\n\
  {\n    code...\n}\n```\n\n该声明的许多部分与声明变量的描述相似。例如，变量声明也可以包含属性和访问级别关键字。有关这些特性的基本信息，请参阅第\
  \ 4 章 中的“数据类型、变量和常量”对应章节。\n\n接下来的章节提供了关于方法声明组成部分的额外信息。\n\n### 属性 (Attributes)\n\n\
  可选的属性列表是一系列属性对象，它们提供了有关该方法的额外信息。属性进一步细化了方法的定义，为编译器、运行时系统以及其他需要处理方法的工具提供更多信息。\n\n\
  属性是专门的，用于解决在执行特定编程任务时出现的问题。例如，`System.Diagnostics.Conditional` 属性意味着某个（方法）依赖于某些预处理器符号的定义。如果未定义该符号，则该方法将被静默忽略。\n\
  \n例如，考虑以下代码段。\n\n```c\n#define INTERACTIVE\n...\n[Conditional(\"INTERACTIVE\")]\n\
  private void DisplayGreeting()\n{\n    MessageBox.Show(\"Hello\");\n}\n...\nprivate\
  \ void Form1_Load(object sender, EventArgs e)\n{\n    DisplayGreeting();\n}\n```\n\
  \n代码首先定义预处理器符号 `INTERACTIVE`。随后在 `DisplayGreeting` 方法的定义中使用 `Conditional` 属性。该方法显示一个消息框。\n\
  \n表单的 `Load` 事件处理器调用了 `DisplayGreeting` 方法。如果定义了 `INTERACTIVE` 常量，则方法执行并显示消息框。如果未定义\
  \ `INTERACTIVE`，则方法调用被忽略，程序继续运行。\n\n有关属性的更多细节，请参阅第 4 章 中的“属性”章节，其中包含你可以获取更多信息的链接。\n\
  \n以下列表描述了一些最有用的方法属性。其中许多属性适用于属性方法（参阅第 4 章 中的“属性”章节）和字段。它们大多数位于 `System.ComponentModel`\
  \ 命名空间中。请查看联帮助获取详细信息。\n\n*   `AttributeUsage`——如果你构建了自己的自定义属性，此属性告诉你的属性可以如何被使用。例如，它决定了项目是否可以拥有你的属性的多个实例、派生类是否可以继承你的属性，以及哪些类型的内容可以使用你的属性（程序集、类、方法等）。\n\
  *   `Browsable`——这指示属性或事件是否应该显示在编辑器（如属性窗口或 `PropertyGrid` 控件）中。\n*   `Category`——这指示视觉设计器（如属性窗口或\
  \ `PropertyGrid` 控件）中应将该属性或事件分组。\n*   `DefaultEvent`——给出类的默认事件名称。如果该类是一个控件或组件，并且你在表单设计器中双击它，则代码编辑器将打开到该事件的处理程序。\n\
  *   `DefaultProperty`——给出类的默认属性名称。\n*   `DefaultValue`——为属性提供默认值。如果你在属性窗口中右键点击该属性并选择“重置\
  \ (Reset)”，该属性将重置为此值。\n*   `Description`——给出该项目的描述。如果属性具有 `Description` 且你在属性窗口中选择了该属性，窗口将在底部显示描述文本。\n\
  *   `Localizable`——这决定了属性是否应该是可本地化的，以便你可以轻松为不同的语言和区域存储不同版本的属性。\n*   `MergableProperty`——这指示属性是否可以与属性窗口中其他组件提供的相同属性合并。如果此值为\
  \ `true` 且你选择了多个具有相同此属性值的控件，属性窗口将显示该值。如果你输入一个新值，所有控件都将更新。\n*   `ParenthesizePropertyName`——这指示如属性窗口之类的编辑器是否应该在属性名称周围显示圆括号。\n\
  *   `ReadOnly`——这指示设计器是否应该将此属性视为只读。\n*   `RecommendedAsConfigurable`——这指示属性应与配置文件绑定。当你在设计时选择该对象并展开\
  \ (动态属性 (Dynamic Properties)) 项目时，该属性会被列出来。如果你点击右侧的省略号（...），将出现对话框，允许你将属性映射到配置文件中的键值。\n\
  *   `RefreshProperties`——这指示当*此*属性被更改时，编辑器应如何刷新对象的*其他*属性。该值可以是 `Default`（不刷新其他属性）、`Repaint`（刷新所有其他属性）或\
  \ `All`（重新查询并刷新所有属性）。\n*   `Conditional`——这指示如果预处理器符号未定义，则该方法被忽略。\n*   `DebuggerHidden`——这告诉调试器一个方法是否应该是可调试的。如果\
  \ `DebuggerHidden` 为 `true`，调试器将跳过该方法且不会在其内部断点处停止。\n*   `DebuggerStepThrough`——这告诉调试器是否允许开发者在调试器中进入方法。如果存在\
  \ `DebuggerStepThrough` 属性，IDE 将不会进入该方法。\n*   `ToolboxBitmap`——告诉 IDE 在何处找到控件或组件的工具箱位图。它可以是一个文件，也可以是程序集中的一个类型（包含位图及其位图名称）。如果你正在开发控件或组件，这虽然很麻烦但至关重要。\n\
  *   `Obsolete`——这指示项目（类、方法、属性等）已过时。可选地，你可以指定使用该项目时代码编辑器应显示的消息（例如，“请使用 NewMethod”）。你还可以指示\
  \ IDE 是否应将其视为警告或错误。\n\n### 访问级别 (Accessibility)\n\n方法的访问级别可以是 `public`、`internal`、`protected`、`internal\
  \ protected` 和 `private`。这些与用于声明变量时的相同关键字具有相同的含义。更多信息请参阅第 4 章 中的“访问级别”章节。\n\n###\
  \ 修饰符 (Modifiers)\n\n方法的修饰符提供了有关方法的更多信息。以下章节描述了允许的关键字。\n\n#### new\n\n派生类可以定义一个与其继承的方法同名的方法。在这种情况下，新版本的方法会隐藏父类版本。这是允许的，但\
  \ Visual Studio 会对其标记警告。`new` 关键字告诉 Visual Studio 这并非意外，并消除警告。\n\n例如，假设 `Person`\
  \ 类包含了 `FirstName`、`LastName`、`Street`、`City`、`State` 和 `Zip` 字段。它提供了以下 `Address`\
  \ 方法，将这些值格式化为地址字符串。\n\n```csharp\npublic string Address()\n{\n    return FirstName\
  \ + \" \" + LastName + '\\n' +\n        Street + '\\n' +\n        City + \" \" +\
  \ State + \" \" + Zip;\n}\n```\n\n现在假设 `Employee` 类派自 `Person`。`Employee` 类增加了一个\
  \ `Office` 字段并提供了以下新的 `Address` 方法，包含了 `Office` 值。\n\n```csharp\npublic new string\
  \ Address()\n{\n    return FirstName + \" \" + LastName + \", \" + Office + '\\\
  n' +\n        Street + '\\n' +\n        City + \" \" + State + \" \" + Zip;\n}\n\
  ```\n\n如果没有 `new` 关键字，这将引发警告。\n\n#### static\n\n正如第 4 章所解释的，使用 `static` 关键字声明的变量由类的所有实例共享。同样，`static`\
  \ 方法适用于类的所有实例。在这种情况下，该方法适用于类本身，而不是类的特定实例。\n\n\n\n\n\n例如，假设 `Person` 类有一个 `LookupPerson`\
  \ 方法，该方法在数据库中查找人员姓名并返回一个表示该人员的 `Person` 对象。要求你仅仅为了调用 `LookupPerson` 方法就先创建一个 `Person`\
  \ 对象是没意义的。相反，你可以将其变为 `static`（静态）方法。\n\n要调用静态方法，请使用类名，例如 `Person.LookupPerson(\"\
  Eddie Russett\")`。\n\n## virtual and override\n\n`virtual` 关键字和 `override` 关键字是配套使用的。\n\
  \n假设 `Person` 和 `Employee` 类具有如前面章节所述的 `Address` 方法。`Employee` 类的 `Address` 版本隐藏了\
  \ `Person` 类的版本。现在考虑以下代码。\n\n```\nEmployee employee = new Employee { FirstName =\
  \ \"Rod\", ... };\nConsole.WriteLine(\"Employee:\\n\" + employee.Address());\nConsole.WriteLine();\n\
  \nPerson person = employee;\nConsole.WriteLine(\"Person:\\n\" + person.Address());\n\
  ```\n\n该代码创建了一个 `Employee` 对象，并在控制台窗口中显示其 `Address` 方法的结果。这包含了对象的 `FirstName`、`LastName`、`Office`、`Street`、`City`、`State`\
  \ 和 `Zip` 值。\n\n接下来，代码将一个 `Person` 变量指向同一个 `Employee`。这是允许的，因为 `Employee` 是 `Person`\
  \ 的一种。代码随后显示 `Person` 对象的 `Address` 方法的结果。由于这是一个 `Person` 对象，它的 `Address` 方法不包含对象的\
  \ `Office` 值。尽管该对象实际上是一个 `Employee`，但 `Person` 类的 `Address` 方法并不包含 `Office` 值。下面的文本显示了结果。\n\
  \n```\nEmployee:\nRod Stephens, B-24\n1337 Leet St\nBugsville HI 98765\nPerson:\n\
  Rod Stephens\n1337 Leet St\nBugsville HI 98765\n```\n\n然而，有一种方法可以让对象使用其“原生”的 `Address`\
  \ 方法，而不是持有它的变量类型所提供的方法。在这种情况下，即使 `Employee` 对象被 `Person` 变量表示，它也会使用自己的 `Address`\
  \ 方法。\n\n要做到这一点，请像下面的代码所示，为 `Person` 类的方法添加 `virtual` 关键字。\n\n```\npublic virtual\
  \ string Address()\n{\n    return FirstName + \" \" + LastName + '\\n' +\n     \
  \   Street + '\\n' +\n        City + \" \" + State + \" \" + Zip;\n}\n```\n\n`virtual`\
  \ 关键字告诉 C# 派生类可以使用自己的版本来替换此方法。\n\n接下来，像下面的代码所示，为 `Employee` 类的 `Address` 方法添加 `override`\
  \ 关键字。\n\n```\npublic override string Address()\n{\n    return FirstName + \" \"\
  \ + LastName + \", \" + Office + '\\n' +\n        Street + '\\n' +\n        City\
  \ + \" \" + State + \" \" + Zip;\n}\n```\n\n这告诉程序用此版本替换 `Employee` 对象的 `Address`\
  \ 方法，即使它们被 `Person` 变量所引用。\n\n下面的文本显示了新的结果。\n\n```\nEmployee:\nRod Stephens, B-24\n\
  1337 Le St\nBugsville HI 98765\n\nPerson:\nRod Stephens, B-24\n1337 Leet St\nBugsville\
  \ HI 98765\n```\n\n### sealed\n\n如果你重写了一个方法，也可以添加 `sealed` 关键字来指示没有进一步的派生类可以重写该方法。例如，假设\
  \ `Person` 类定义了 `virtual` 方法 `Address`，而 `Employee` 类定义了以下重写版本。\n\n```\npublic override\
  \ sealed string Address()\n{\n    return FirstName + \" \" + LastName + \", \" +\
  \ Office + '\\n' +\n        Street + '\\n' +\n        City + \" \" + State + \"\
  \ \" + Zip;\n}\n```\n\n现在，如果 `Manager` 类继承自 `Employee` 类，它将无法重写此方法，因为它是密封的。\n\n\
  ### abstract\n\n`abstract` 关键字防止程序创建该类的实例。相反，程序必须创建派自该类的其他类的实例。如果一个类包含 `abstract`\
  \ 成员，那么该类也必须标记为 `abstract`。\n\n例如，一个类可以包含一个抽象方法。在这种情况下，派生类必须为 `abstract` 方法提供方法体。这允许类决定其派生类应该做什么，但而不决定它们是如何运行的。\n\
  \n带有 `abstract` 方法的类是不完整的。如果你创建一个该类的实例，将无法调用该方法，因为该类尚未为其提供实现。为了避免这种困境，C# 不允许你创建带有抽象方法的类实例。\n\
  \n下面的代码显示了一个抽象的 `Person` 类。\n\n```\nabstract class Person\n{\n    public string\
  \ FirstName = \"\", LastName = \"\",\n        Street = \"\", City = \"\", State\
  \ = \"\", Zip = \"\";\n\n    public abstract string Address();\n}\n```\n\n下面的代码显示了一个继承自\
  \ `Person` 并实现 `Address` 方法的 `Student` 类。\n\n```\nclass Student : Person\n{\n  \
  \  public override string Address()\n    {\n        return FirstName + \" \" + LastName\
  \ + \", \" +\n            Street + '\\n' +\n            City + \" \" + State + \"\
  \ \" + Zip;\n    }\n}\n```\n\n## extern\n\n`extern` 关键字表示方法定义在程序集之外。此关键字通常用于声明库中的方法。例如，下面的代码声明了\
  \ `SendMessage`。`DllImport` 属性告诉程序查找 `user32.dll`。\n\n```\n[System.Runtime.InteropServices.DllImport(\"\
  user32.dll\")]\npublic static extern int SendMessage(IntPtr hWnd, uint Msg, int\
  \ lParam);\n```\n\n\n\n\n\n```c\nprivate void DeleteFile(string filename)\n{\n \
  \   // Make the user confirm.\n    if (MessageBox.Show(\"Are you sure you want to\
  \ delete \"\n        + filename + \"?\",\n        \"Delete File?\",\n        MessageBoxButtons.YesNo,\n\
  \        MessageBoxIcon.Question)\n            == DialogResult.No)\n           \
  \     return;\n\n    // Delete the file.\n    //...\n}\n```\n\n### 参数\n\n方法的参数定义了传递给方法的参数名称和类型。参数列表与变量声明有些相似，因此它们在第\
  \ 4 章的“参数声明”节中进行了描述。请查看该节以获取更多信息。\n\n有两个不适用于变量、因此未在第 4 章中描述的新功能：可选参数和具名参数。\n\n可选参数\
  \ 必须位于参数列表的末尾，位于任何必需参数之后。要使某个参数变为可选的，请在其声明后紧跟一个等号和一个默认值。调用代码可以省略列表末尾的任何可选参数，这些参数将采用其默认值。代码不能包含位于缺失参数之后的参数，至少在未使用参数名称的情况下例外。\n\
  \n具名参数允许调用代码通过名称显式指定参数值。这使得代码更易读，特别是当方法具有很长的参数列表且某些参数是可选的时。它还允许调用代码以任何顺序提供参数，并在省略任何可选参数的同时而不省略参数列表中随其后的参数。要使用可选参数，调用代码需要包含参数名称、冒号和参数值。\n\
  \n以下代码定义了一个 `FindOverdueAccounts` 方法，该方法查找逾期的客户账户并采取相应措施。\n\n```csharp\nprivate\
  \ void ListOverdueAccounts(\n    int daysPastDue, decimal amount = 50.00m,\n   \
  \ bool disconnect = false, bool printInvoices = false)\n{\n    ...\n}\n```\n\n该方法接受四个参数。`daysPastDue`\
  \ 参数是必需的，而其他都是可选的。\n\n以下代码显示了程序调用此方法的几种方式。\n\n```csharp\n// daysPastDue = 90, 其他参数采用默认值。\n\
  ListOverdueAccounts(90);\n\n// daysPastDue = 90, amount = $100.00, 其他参数采用默认值。\n\
  ListOverdueAccounts(90, 100.00m);\n\n// daysPastDue = 90, disconnect = true, 其他参数采用默认值。\n\
  // 这种写法是不允许的，因为你不能在缺失参数之后包含一个参数。\nListOverdueAccounts(90, , true);\n\n// daysPastDue\
  \ = 90, disconnect = true, 其他参数采用默认值。\n// 这种写法是被允许的因为它使用了具名参数。\nListOverdueAccounts(90,\
  \ disconnect: true);\n\n// daysPastDue = 30, amount = $100.00。其他参数采用默认值。\nListOverdueAccounts(30,\
  \ amount: 100);\n\n// 按新顺序指定所有参数。\nListOverdueAccounts(disconnect: true, amount:\
  \ 100,\n    printInvoices: false, daysPastDue: 60);\n```\n\n第三次调用 `ListOverdueAccounts`\
  \ 是不允许的，因为它在省略的参数之后提供了一个参数。第四次调用提供了相同的参数。该版本之所以有效，是因为它使用了具名参数。\n\n### 可选参数与重载\n\n\
  C# 程序可以定义多个名称相同但参数列表不同的方法。这被称为“方法重载”。例如，以下代码定义了两个版本的 `FireEmployee` 方法。\n\n```csharp\n\
  private void FireEmployee(string name)\n{\n    ...\n}\n\nprivate void FireEmployee(string\
  \ name, string reason)\n{\n    ...\n}\n```\n\n在编译时，编译器使用传递给方法调用的参数来决定使用哪个版本的方法。\n\
  \n重载方法之间不能仅在可选参数上不同。否则，如果对方法的调用省略了可选参数，程序将无法判断使用哪一个版本的方法。\n\n以下代码显示了 `FireEmployee`\
  \ 方法的单一版本，它使用可选参数而不是重载。\n\n```csharp\nprivate void FireEmployee(string name, string\
  \ reason = \"Unknown reason\")\n{\n    ...\n}\n```\n\n不同的开发者对于在不同情况下使用可选参数还是重载方法更好持有不同意见。\n\
  \n支持可选参数的一个论点是，重载方法可能会重复大量代码。然而，可以很容易地让每个版本的方法调用另一个允许更多参数的版本，并传入默认值。例如，在以下代码中，`FireEmployee`\
  \ 方法的版本简单地调用了第二个版本：\n\n```csharp\nprivate void FireEmployee(string name)\n{\n  \
  \  FireEmployee(name, \"Unknown reason\");\n}\n\nprivate void FireEmployee(string\
  \ name, string reason)\n{\n    ...\n}\n```\n\n当不同版本的方法需要执行不同的操作或当它们接受完全不同的参数时，重载通常是更好的。例如，以下代码显示了两个版本的\
  \ `FireEmployee` 方法：一个接受员工名称作为参数，另一个接受一个 `Employee` 对象作为参数。\n\n```csharp\nprivate\
  \ void FireEmployee(string name)\n{\n    ...\n}\n\nprivate void FireEmployee(Employee\
  \ employee)\n{\n    ...\n}\n```\n\n在这种情况下，如果创建一个带有可选的 `name` 和 `employee` 参数的单一方法，并要求调用代码仅传入这些值中的一个，可能会令人困惑的。（这两种方法可能也会执行很多相同的工作。）\n\
  \n### 参数数组\n\n有时，拥有可以接受任意数量参数的方法很有用。例如，一个方法可能接受一个消息和一系列电子邮件地址作为参数。它将向每个地址发送该消息。\n\
  \n一种方法是给方法提供一个长长的可选 `string` 参数列表，默认值为 `null`。方法将检查每个参数，并向那些非 `null` 的参数发送消息。\n\n\
  不幸的是，该方法需要使用单独的代码来处理每个地址。参数的数量将对可以包含的电子邮件数量设置上限。\n\n更好的解决方案是使用 `params` 关键字，使方法的最后一个参数成为参数数组。参数数组包含任意数量的参数值。在运行时，方法可以遍历数组来处理参数值。以下代码显示了一个示例。\n\
  \n```csharp\nprivate void SendEmails(string message, params string[] addresses)\n\
  {\n    if (addresses != null)\n    {\n        foreach (string address in addresses)\n\
  \            Console.WriteLine(\"Send \" + message + \" to \" + address);\n    }\n\
  }\n```\n\n`SendEmails` 方法接受两个参数：一个名为 `message` 的 `string` 和一个存储电子邮件地址的 `string`\
  \ 参数数组。代码首先检查参数数组是否为 `null`。如果数组不是 `null`，代码将遍历它并在控制台窗口显示每个电子邮件地址和消息。（实际应用程序将向每个电子邮件地址发送消息。）\n\
  \n以下代码显示了程序如何使用此方法向两个电子邮件地址发送消息。\n\n```csharp\nSendEmails(\"I need C# help!\",\n\
  \    \"RodStephens@CSharpHelper.com\",\n    \"RodStephens@vb-helper.com\"\n);\n\
  ```\n\n参数数组受到以下限制：\n\n*   方法只能有一个参数数组，且它必须位于参数列表的末尾。\n*   参数列表不能使用 `ref` 或 `out`\
  \ 关键字声明。\n*   调用代码可以在参数数组的位置传递 `null` 值。（这就是为什么上一个示例中的代码在使用数组之前检查了它是否为 `null`。）\n\
  *   调用代码可以为参数数组提供任意数量的值，包括零个。\n\n\n\n\n\n-   参数数组中的所有项必须具有相同的数据类型。然而，你可以使用一个包含通用\
  \ `object` 数据类型的数组，它几乎可以容任何内容。\n\n程序还可以传递一个适当数据类型的数组来代替一系列值。以下代码将一个 `string` 数组传递给\
  \ `SendEmails` 方法。\n\n```\nstring[] addresses =\n{\n    \"RodStephens@CSharpHelper.com\"\
  ,\n    \"RodStephens@vb-helper.com\",\n};\nSendEmails(\"I need C# help!\", addresses);\n\
  ```\n\n### 实现接口\n\n接口定义了一组属性、方法和事件，实现该接口的类必须提供这些内容。接口非常类类，只是所有的属性、方法和事件都是使用 `abstract`\
  \ 关键字声明的。任何继承自基类的类都必须提供这些属性、方法和事件的实现。同样，实现接口的类必须提供接口定义的属性、方法和事件。\n\n下面的代码定义了 `IDrawable`\
  \ 接口。\n\n```\npublic interface IDrawable\n{\n    void Draw(Graphics gr);\n    Rectangle\
  \ GetBounds();\n    bool IsVisible { get; set; }\n}\n```\n\n`IDrawable` 接口定义了一个\
  \ `Draw` 方法、一个 `GetBounds` 函数和一个名为 `IsVisible` 的 `bool` 属性。\n\n要表示一个类实现了某个接口，可以在类名后添加冒号并加上接口名称。下面的代码显示了实现\
  \ `IDrawable` 接口的 `DrawableRectangle`类的声明。\n\n```\npublic class DrawableRectangle\
  \ : IDrawable\n{\n\n}\n```\n\n如果你构建了这样一个包含 `: IDrawable` 子句空类，可以右键点击接口名称并选择“实现接口”（Implement\
  \ Interface）子菜单。该菜单有两个选择：实现接口（Implement Interface）和显式实现接口（Implement Interface Explicitly）。当你选择其中一个命令时，Visual\
  \ Studio 会向类中添加空的属性、方法和事件以实现接口。类如何使用这些项取决于你是隐式还是显式地实现接口。\n\n#### 隐式实现\n\n下面的代码显示了由\
  \ Visual Studio 为隐式实现添加代码的 `DrawableRectangle` 类。\n\n```\npublic class DrawableRectangle\
  \ : IDrawable\n{\n    public void Draw(Graphics gr)\n    {\n        throw new NotImplementedException();\n\
  \    }\n\n    public Rectangle Bounds()\n    {\n        throw new NotImplementedException();\n\
  \    }\n\n    public bool IsVisible\n    {\n        get\n        {\n           \
  \ throw new NotImplementedException();\n        }\n        set\n        {\n    \
  \        throw new NotImplementedException();\n        }\n    }\n}\n```\n\n你应该编辑这段代码，将\
  \ `throw` 语句替换为任何必要的代码。\n\n如果类隐式地实现接口，你可以像使用任何其他类的成员一样使用它的成员。例如，考虑以下代码。\n\n```\n\
  DrawableRectangle rect = new DrawableRectangle();\nConsole.WriteLine(rect.GetBounds());\n\
  \nIDrawable drawable = rect;\nConsole.WriteLine(drawable.GetBounds());\n```\n\n\
  这段代码创建了一个 `DrawableRectangle`。然后它调用它的 `GetBounds` 方法并在控制台窗口中显示结果。\n\n接下来，代码创建了一个\
  \ `IDrawable` 变量并使其指向同一个 `DrawableRectangle`。这之所以行通，是因为 `DrawableRectangle` 是一种\
  \ `IDrawable`。\n\n代码接着显示了 `IDrawable` 的 `GetBounds` 方法的结果。\n\n#### 显式实现\n\n如果你选择“显式实现接口”（Implement\
  \ Interface Explicitly），Visual Studio 也会创建必要的代码，但它会在每个项前添加接口名称。下面的代码显示了这种形式的 `Draw`\
  \ 方法，并突出了接口名称。\n\n```\nvoid IDrawable.Draw(Graphics gr)\n{\n    throw new NotImplementedException();\n\
  }\n```\n\n如果类显式地实现接口，程序无法通过该类类型的变量访问接口的成员。相反，它必须使用接口类型的变量。\n\n再次考虑之前显示过的隐式接口实现的代码。\n\
  \n```\nDrawableRectangle rect = new DrawableRectangle();\nConsole.WriteLine(rect.GetBounds());\
  \ // 无法。\n\nIDrawable drawable = rect;\nConsole.WriteLine(drawable.GetBounds());\n\
  ```\n\n使用显式实现时，第一次调用 `GetBounds` 将不起。由于类是显式实现接口，代码必须使用 `IDrawable` 变量来使用接口成员。\n\n\
  ### 扩展方法\n\n扩展方法允许你在不重写现有类或从其派生新类的情况下，为现有类添加新方法。要创建扩展方法，请将 `static` 方法放置在 `static`\
  \ 类中。在方法的第一个参数之前添加 `this` 关键字，并为该参数指定你想要扩展的类型。\n\n例如，下面的代码为 `string` 类定义了 `RemoveNonLetters`\
  \ 扩展方法。\n\n```\npublic static class StringExtensions\n{\n    public static string\
  \ RemoveNonLetters(this string text)\n    {\n        string result = \"\";\n   \
  \     foreach (char ch in text)\n            if (((ch >= 'a') && (ch <= 'z')) ||\n\
  \                ((ch >= 'A') && (ch <= 'Z')))\n                result += ch;\n\
  \            else\n                result += \"?\";\n\n        return result;\n\
  \    }\n}\n```\n\n代码定义在静态 `StringExtensions` 类中。\n\n`static RemoveNonLetters` 方法的第一个参数使用了\
  \ `this` 关键字，所以你知道这是一个扩展方法。`this` 之后的参数类型为 `string`，因此此扩展方法扩展了 `string` 类。\n\n该方法的代码遍历字符串并将任何非字母字符替换为问号。然后返回结果。\n\
  \n下面的代码显示了程序如何使用该方法。\n\n```\nstring text = \"When in worry or doubt, run in circles\
  \ scream and shout\";\nConsole.WriteLine(text.RemoveNonLetters());\n```\n\n这段代码创建了一个\
  \ `string` 变量。然后它调用 `RemoveNonLetters` 方法，就像该方法是 `string` 类定义的普通方法一样。\n\n## Lambda\
  \ 表达式\n\nLambda 表达式是在代码流中定义的方法，而不是独立的方法。它们通常在同一个语句中定义、使用并忘记，而没有命名。\n\n可以使用普通方法代替\
  \ Lambda 表达式，但有时 Lambda 表达式会让代码更简单、易读。许多 LINQ 查询（见第 8 章）使用函数来选择符合标准的值。你可以将这些函数编写为独立方法，但它们可能只在使用一次，因此编写方法会使代码混乱。\n\
  \n以下章节将 Lambda 表达式分为三类：表达式 Lambda、语句 Lambda 和异步 Lambda。\n\n### 表达式 Lambda\n\n表达式\
  \ Lambda 由零个或多个参数、`=>` 运算符和一个产生某种结果的单个表达式组成。Lambda 表达式返回表达式的结果。\n\n下面的代码使用了简单的表达式\
  \ Lambda。\n\n```\nAction note = () => MessageBox.Show(\"Hi\");\nnote();\n```\n\n\
  回想第 4 章“委托”部分，`Action` 是一种表示不带参数且返回 `void` 的方法的类型。代码创建了该类型的变量 `note`。它将其赋值为由 `()\
  \ => MessageBox.Show(\"Hi\")` 定义的表达式 Lambda。此 Lambda 没有参数并执行表达式 `MessageBox.Show(\"\
  Hi\")`。（如果 Lambda 表达式没有参数，则需要空括号作为占位符。）\n\n下面的代码修改了之前的表达式 Lambda，使其接收一个参数。\n\n```\n\
  Action<string> note = message => MessageBox.Show(message);\nnote(\"Hello\");\n```\n\
  \n这个表达式 Lambda 接收一个字符串参数并将其传递给 `MessageBox.Show`。\n\n\n\n\n\n到为止所示的两个示例调用了 `MessageBox.Show`，它返回\
  \ `void`。下面的示例展示了表达式 lambda 如何返回值。\n\n```\nFunc<float, double> root = value => Math.Sqrt(value);\n\
  Console.WriteLine(root(13));\n```\n\n变量 `root` 的类型为 `Func<float, double>`，因此它表示接收一个\
  \ `float` 参数并返回 `double` 结果的方法。该代码将 `root` 设置为一个表达式 lambda，该 lambda 使用 `Math.Sqrt`\
  \ 来获取输入参数的平方根。lambda 的返回结果就是该表达式执行的结果。\n\n### 语句 lambda (Statement Lambdas)\n\n\
  表达式 lambda 执行单条语句并返回其结果。语句 lambda 类似，但它可以执行多条语句。为了对语句进行分组，这种 lambda 使用大括号。它还使用 `return`\
  \ 语句来返回其结果。\n\n下面的代码演示了一个语句 lambda。\n\n```\nFunc<int, int, int, int> middle = (v1,\
  \ v2, v3) =>\n    {\n        // 对项目进行排序。\n        int[] values = { v1, v2, v3 };\n\
  \        Array.Sort(values);\n\n        // 返回中间的项。\n        return values[1];\n\
  \    };\nConsole.WriteLine(middle(2, 3, 1));\n```\n\n这段代码将 `middle` 设置为一个选取三个整数中间值的\
  \ lambda。该 lambda 将其三个参数拷贝到数组中，对数组进行排序，并返回中间项。\n\n随后随后调用该 lambda 来选取值 2、3 和 1 的中间值。\n\
  \n### 异步 lambda (Async Lambdas)\n\n本章稍后的“使用 Async 和 Await”部分讨论了异步运行方法的一种方法。此时值得简要解释一下该技术如何与\
  \ lambda 表达式工作。\n\n简而言之，你可以使用 `async` 关键字来指示一个方法可以异步运行。程序随后可以使用 `await` 关键字来等待 `async`\
  \ 方法完成。通常，你会在命名方法中使用 `async`，但你也可以用它让 lambda 表达式变成异步的。\n\n下面的 `Form Load` 事件处理程序使用了异步语句\
  \ lambda。\n\n```\nprivate void Form1_Load(object sender, EventArgs e)\n{\n    countButton.Click\
  \ += async (button, args) =>\n    {\n        for (int i = 0; i < 5; i++)\n     \
  \   {\n            Console.WriteLine(i);\n            await System.Threading.Tasks.Task.Delay(1000);\n\
  \        }\n    };\n}\n```\n\n这段代码为 `countButton` 控件的 `Click` 事件添加了一个处理程序。该处理程序由\
  \ lambda 表达式定义。表达式的声明包含了 `async` 关键字，因此它可以异步运行。\n\n语句 lambda 使变量 `i` 从 1 循环到 5。对于\
  \ `i` 的每个值，lambda 在控制窗口中显示 `i` 的值，然后等待 1 秒。\n\n如果你将此代码添加到具有名为 `countButton` 按钮的\
  \ Windows Forms 程序中并点击该按钮，语句 lambda 就会执行并在控制窗口中显示其计数。由于 lambda 是异步的，你可以点击几次按钮，看到多个计数同时运行。\n\
  \n### 变变性 (Variance)\n\n假设 `Student` 类派生自 `Person` 类。在这种情况下，你可以像下面的代码一样在 `Person`\
  \ 变量中保存 `Student` 值，因为 `Student` 是一种 `Person`。\n\n```\nPerson person = new Student();\n\
  ```\n\n在方法参数和返回类型上也可以进行类似的操作，这并不意外。例如，假设 `EnrollStudent` 方法接收一个 `Person` 作为参数，创建必要的数据库记录以将该\
  \ `Person` 录入学校，并返回一个代表新学生的 `Student` 对象。下面的代码显示了方法的签名。\n\n```\nprivate Student\
  \ EnrollStudent(Person person)\n{\n    ...\n}\n```\n\n调用代码可能会将结果保存在某些变量中。代码可以将结果保存在\
  \ `Student` 变量中。由于 `Student` 是一种 `Person`，代码也可以将结果保存在 `Person` 变量中。\n\n方法的参数类型为\
  \ `Person`。由于 `Student` 是 `Person` 的一种类型，调用代码可以将一个 `Student` 传递给该方法。（尽管你可能希望方法防止这样做，以确保你不会两次录入同一个学生。）\n\
  \n下面的代码显示了程序如何在不匹配方法参数和返回类型的情况下调用此方法。\n\n```\nStudent student = new Student();\n\
  ...\nPerson person = EnrollStudent(student);\n```\n\n这些内容都不应该让你感到大奇。\n\n同样，你可以在委托变量中存储对方法的引用，其参数和返回类型与方法中所使用的类型并不完全匹配。\n\
  \n例如，下面的代码定义了一个委托，代表接收一个 `Student` 参数并返回一个 `Person` 方法。\n\n```\nprivate delegate\
  \ Person ReturnsPersonDelegate(Student student);\n```\n\n程序可以像下面的代码一样使用该委托。\n\n\
  ```\nReturnsPersonDelegate del = EnrollStudent;\n```\n\n`EnrollStudent` 方法没有返回委托类型要求的\
  \ `Person`，但它返回了一个 `Student`，而 `Student` 是 `Person` 的一种。当方法返回一个比委托更派生的类型时，你可以将方法赋值给委托，这一事实被称为协变\
  \ (covariance)。\n\n`EnrollStudent` 方法 方法也没有接收委托类型要求的 `Student` 参数。相反，它接收一个 `Person`\
  \ 参数。`Student` 是一种 `Person`，因此程序可以使用 `Student` 作为参数调用该方法。当方法具有一个比委托更基础的类型时，你可以将方法赋值给委托，这一事实被称为逆变\
  \ (contravariance)。\n\n### 异步方法 (Asynchronous Methods)\n\n通常，程序调用一个过程后，控制权会交给该过程。当过程执行完毕后，控制权返回给调用代码，后者继续执行。这一切都是同步发生的，因此调用代码必须等待被调的过程完成工作。\n\
  \nC# 提供了几种异步执行代码的方法。在这些情况下，调用代码可以在单独线程中启动过程，并在过程完成之前继续执行。如果你的计算机有多个核心或 CPU，调用代码和异步过程都可以并行执行，从而节省大量时间。\n\
  \n下面的章节介绍了三种更容易管理的异步执行方法。\n\n### 直接调用 EndInvoke (Calling EndInvoke Directly)\n\n\
  此方法使用委托的 `BeginInvoke` 方法异步启动过程。随后代码调用 `EndInvoke` 来等待过程完成并处理结果。\n\n要使用此方法，首先定义一个代表你想异步运行的过程的委托。调用委托的\
  \ `BeginInvoke` 方法，传递方法所需的任何参数以及两个额外参数：回调方法和一个传递给回调方法的参数。对于这种技术，将这些额外参数设置为 `null`，这样过程在完成时就不会调用回调。（下一节将解释如何使用回调。）\n\
  \n`BeginInvoke` 的调用会在自己的线程上启动异步代码并立即返回，因此调用代码可以执行其他任务。\n\n在调用代码在异步线程完成之前尽可能多操作之后，它应该调用委托的\
  \ `EndInvoke` 方法。该方法会等待异步线程完成（如果尚未完成），并返回原始方法的的结果。\n\n`BeginInvoke` 示例程序可以在书籍网站上下载，它使用了以下简单的\
  \ `Count` 方法。\n\n```\nprivate void Count(int max)\n{\n    for (int i = 1; i <= max;\
  \ i++)\n    {\n        System.Threading.Thread.Sleep(1000);\n        Console.WriteLine(\"\
  Count: \" + i);\n    }\n}\n```\n\n该方法计数到指定的值，在控制窗口中显示数字并在每个数字之间睡眠 1 秒。\n\n\n\n\n\
  以下代码将异步运行 `Count` 方法。\n\n```c\n// 在新线程上启动 Count 方法。\nAction<int> countDelegate =\
  \ Count;\nIAsyncResult result = countDelegate.BeginInvoke(5, null, null);\n\n//\
  \ 计数到 3。\nfor (int i = 1; i <= 3; i++)\n{\n    System.Threading.Thread.Sleep(1000);\n\
  \    Console.WriteLine(\"Main: \" + i);\n}\n\n// 等待另一个线程完成。\ncountDelegate.EndInvoke(result);\n\
  Console.WriteLine(\"Main: done\");\n```\n\n此代码创建了一个 `Action<int>` 类型的委托，用于表示一个接受\
  \ `int` 参数且返回类型为 `void`的方法。它将该变量赋值为 `Count` 方法。\n\n随后，代码调用委托变量的 `BeginInvoke` 方法，传递了参数\
  \ 5（发送给 `Count` 方法）以及两个 `null` 参数。它保存了 `BeginInvoke` 返回的的结果，这是一个 `IAsynchResult`\
  \ 对象。\n\n接下来，代码计数到 3，在每个数值之间暂停 1 秒。\n\n代码随后调用委托的 `EndInvoke` 方法，传递了从 `BeginInvoke`\
  \ 获取的 `IAsyncResult` 值。该调用让主程序等待，直到委托运行完毕。\n\n最后，当委托的另一个线程结束且 `EndInvoke` 返回时，代码显示一条完成消息。\n\
  \n下文显示了一次尝试的结果。\n\n```\nMain: 1\nCount: 1\nMain: 2\nCount: 2\nMain: 3\nCount: 3\n\
  Count: 4\nCount: 5\nMain: done\n```\n\n在实际应用中，主程序和异步线程将执行耗时任务，而不仅仅是简单的睡眠。\n\n###\
  \ 处理回调\n\n上一节中描述的技术直接调用 `EndInvoke` 来让主用户界面线程等待，直到其异步线程完成后主程序才继续执行。\n\n另一种方法是让主程序继续运行，而不等待线程完成，然后让线程在完成时调用回调方法。\n\
  \n这种方法让主程序在大多数情况下可以忽略异步线程，但它确实会让执行流变得不再那么可预测。在线程运行时，用户可以做其他事情，甚至可以启动与正在运行的线程重复的新线程。当某个线程结束时，回调程序将执行，可能会中断用户当时正在做的任何操作。\n\
  \n处理回调时有一个重要的陷阱：只有创建用户界面的线程（称为 UI 线程）才能直接与用户界面中的控件交互。这意味着异步线程不能直接为 `PictureBox`\
  \ 分配图像、在 `Label` 或 `TextBox` 中显示文本、移动控件或以其他方式操作控件。由于线程调用的是回调方法，这些方法也无法直接与控件交互。\n\
  \n你可以通过使用表单的 `Invoke` 方法来绕过这一限制。`Invoke` 在 UI 线程上执行表单的某个方法。\n\n`HandleCallback`\
  \ 示例程序可以在书籍网站上下载，它在程序的主执行流中使用回调而不是调用 `EndInvoke`。该程序如图 6-2 所示，它使用回调来在异步线程完成时让主程序知晓。\n\
  \n![c06f002.tif](img/c06f002.png)\n\n**图 6-2:** (#c06.xhtml_figureanchor6-2) `HandleCallback`\
  \ 示例程序使用回调而不是 `EndInvoke`。\n\n主程序在 `Label` 中显示计数，而线程在控制台窗口中显示其计数。（你可以使用 `Invoke`\
  \ 让它在 `Label` 中显示计数，但即使不加这个，代码已经足够复杂了。）\n\n程序使用以下代码启动线程并显示其计数。\n\n```c\n// 在新线程上启动\
  \ countDelegate 方法。\nFunc<int, int> countDelegate = Count;\nIAsyncResult result\
  \ = countDelegate.BeginInvoke(5,\n    new AsyncCallback(CountCallback), \"Thread:\
  \ \");\n\n// 计数到 3。\nfor (int i = 1; i <= 3; i++)\n{\n    System.Threading.Thread.Sleep(1000);\n\
  \    countLabel.Text = i.ToString();\n    countLabel.Refresh();\n}\n\n// 显示完成消息。\n\
  countLabel.Text = \"Main: done\";\n```\n\n首先，代码创建了一个委托变量来持有稍后描述的 `Count` 方法的引用。此版本的\
  \ `Count` 接受一个 `int` 参数并返回一个 `int` 结果。\n\n接下来，代码调用委托的 `BeginInvoke` 方法。这次它向方法传递了应该传递给\
  \ `Count` 方法的值（5）、一个初始化为表示 `CountCallback` 方法的新 `AsyncCallback` 对象，以及一个要传递给回调的值（字符串\
  \ `Thread:`）。在此时，一个新线程开始运行 `Count` 方法。\n\n代码随后进入自己的循环，在表单的 `Label` 控件中显示 1 到 3 的数字，每个数字之间暂停\
  \ 1 秒。注意，代码在每次显示新值时都会刷新 `Label`。如果代码不这样做，`Label` 将直到代码结束才不会刷新，因此用户将看不到计数。完成计数后，代码在\
  \ `Label` 中显示消息 `Main: done`。\n\n在此期间，线程一直在运行 `Count` 方法。\n\n```c\n// 在数字之间暂停 1\
  \ 秒。\n// 返回值。\nprivate int Count(int max)\n{\n    for (int i = 1; i <= max; i++)\n\
  \    {\n        System.Threading.Thread.Sleep(1000);\n        Console.WriteLine(\"\
  Count: \" + i);\n    }\n    return max;\n}\n```\n\n此方法在控制台窗口中显示计数并返回最大的数字。注意，此方法对回调一无所知。\n\
  \n当方法结束时，调用 `BeginInvoke` 时注册的回调将执行。\n\n```c\n// 异步线程结束。\nprivate void CountCallback(IAsyncResult\
  \ iresult)\n{\n    // 获取 AsyncResult。\n    AsyncResult result = (AsyncResult)iresult;\n\
  \n    // 获取运行的委托。\n    Func<int, int> caller = (Func<int, int>)result.AsyncDelegate;\n\
  \n    // 获取传递给 BeginInvoke 的参数。\n    string parameter = (string)result.AsyncState;\n\
  \n    // 获取方法的返回值。\n    int value = (int)caller.EndInvoke(result);\n\n    // 使用\
  \ Invoke 显示结果。\n    Action<string> updater = SetLabel;\n    string message = parameter\
  \ + value;\n    this.Invoke(updater, message);\n}\n```\n\n回调方法接收一个 `IAsyncResult`\
  \ 对象作为参数，该对象提供了关于完成的方法的信息。\n\n方法首先将 `IAsyncResult` 参数转换为 `AsyncResult` 对象。（`AsyncResult`\
  \ 定义在 `System.Runtime.Remoting` 命名空间中。程序包含一个 `using` 指令以简化代码。）\n\n接下来，代码将结果的 `AsyncDelegate`\
  \ 属性转换为代表异步运行方法的委托。\n\n结果的 `AsyncState` 属性包含了传递给 `BeginInvoke` 方法并传递回调的参数。在本示例中，该值是字符串\
  \ `Thread:`。此示例仅在此值中传递了一个固定的 `string`，但更通用地说，可以使用此值来标识同一个方法的不同异步调用。\n\n接下来，代码调用委托的\
  \ `EndInvoke` 方法并传递 `result` 对象。这释放了线程使用的资源并让程序检索到方法的返回值。在本示例中，`Count` 方法返回 `int`，因此代码将\
  \ `EndInvoke` 返回的值强制转换为 `int`。\n\n此时，回调程序想在表单的 `Label` 中显示一条成功消息。遗憾的是，回调是在异步线程中执行的而不是\
  \ UI 线程，因此它不能直接设置 `Label` 的 `Text` 属性。\n\n\n\n\n为了解决这个问题，回调函数会创建一个委托来表示下文描述的 `SetLabel`\
  \ 方法。它组合一个消息并调用表单的 `Invoke` 方法，将委托和消息传递给它。这使得表单能够在它的 UI 线程上运行 `SetLabel` 方法。\n\n\
  下面的代码显示了 `SetLabel` 方法。\n\n```csharp\n// Set the Label's text.\nprivate void SetLabel(string\
  \ text)\n{\n    countLabel.Text = text;\n}\n```\n\n`SetLabel` 方法只是设置 `Label` 的 `Text`\
  \ 属性。（这是整个过程中唯一简单的部分。）\n\n### 使用 Async 和 Await\n\n在 UI 线程中直接调用 `EndInvoke` 会让代码相对简单，但这意味着程序会被阻塞，直到异步线程运行结束。使用回调允许主\
  \ UI 线程在线程完成之前结束，从而让用户界面可以与用户交互，但代码更加复杂，特别是当回调必须操作控件时，因为它需要使用表单的 `Invoke` 方法。\n\n\
  C# 提供了两个关键字，可以让你更容易使用回调方法，而无需实际编写回调函数并自己调用 `Invoke`。\n\n`async` 关键字表示程序中可能包含应该异步运行的部分。你应该将此关键字应用于事件处理程序以及其他启动任务并等待它们完成的方法。\n\
  \n`await` 关键字让程序等待，直到特定的任务异步运行完。。当它看到 `await` 关键字时，C# 本质上会将该方法的剩余部分转换为一个回调，并在任务完成时自动调用该回调。这个“虚拟回调”的一个非常棒的特性是它在\
  \ UI 线程上执行，因此它可以直接操作控件，而无需使用表单的 `Invoke` 方法。\n\n`AsyncAwait` 示例程序可以在本书的网站下载，它与 `HandleCallback`\
  \ 示例程序类似，但它使用了 `async` 和 `await` 关键字而不是回调。\n\n下面的代码显示了点击程序 Count 按钮时执行的事件处理程序。`async`\
  \ 和 `await` 关键字已用**粗体**标记。\n\n```csharp\n// Count on a separate thread.\nprivate\
  \ async void countButton_Click(object sender, EventArgs e)\n{\n    // Disable the\
  \ button.\n    countButton.Enabled = false;\n    countLabel.Text = \"\";\n    countButton.Refresh();\n\
  \    countLabel.Refresh();\n\n    // Start the Count method on a new thread.\n \
  \   Func<object, int> countDelegate = Count;\n    Task<int> task = new Task<int>(countDelegate,\
  \ 5);\n    task.Start();\n\n    // Count to 3.\n    for (int i = 1; i <= 3; i++)\n\
  \    {\n        System.Threading.Thread.Sleep(1000);\n        countLabel.Text =\
  \ i.ToString();\n        countLabel.Refresh();\n    }\n\n    // Display a finished\
  \ message.\n    countLabel.Text = \"Main: done\";\n\n    // Enable the button.\n\
  \    countButton.Enabled = true;\n\n    // Wait for the task to complete.\n    int\
  \ result = await task;\n\n    // Display the result message.\n    countLabel.Text\
  \ = \"Thread: \" + result;\n}\n```\n\n因为这个事件处理程序包含异步运行的部分，所以它的声明包含了 `async` 关键字。\n\
  \n在完成一些准备工作后，代码创建一个引用 `Count` 方法的委托。接下来使用的 `Task` 类可以向方法传递一个状态值，但 `Task` 期望该值是泛型\
  \ `object` 类，因此 `countDelegate` 变量被声明为表示接受 `object` 参数并返回 `int` 的方法。\n\n接下来，代码为\
  \ `countDelegate` 变量表示的方法创建一个 `Task` 对象。`Task` 构造函数接受委托作为参数，以及应该传递给委托方法的值 `5`。\n\
  \n然后代码调用 `Task` 的 `Start` 方法，在一个新的线程上启动任务运行。\n\n程序随后在 UI 线程上执行自己的计数。当计数完成时，它在 `Label`\
  \ 中显示一条消息并重新启用程序的 `Button`。\n\n在完成工作后，代码使用 `await` 关键字等待 `Task` 完成，并将返回的结果保存在变量\
  \ `result` 中。\n\n代码最后通过显示从异步线程接收到的结果来结束。\n\n下面的代码显示了 `Count` 方法的新版本。\n\n```csharp\n\
  // Count pausing 1 second between numbers.\n// Return the final value displayed.\n\
  private int Count(object maxObj)\n{\n    int max = (int)maxObj;\n    for (int i\
  \ = 1; i <= max; i++)\n    {\n        System.Threading.Thread.Sleep(1000);\n   \
  \     Console.WriteLine(\"Count: \" + i);\n    }\n    return max;\n}\n```\n\n这与之前的版本相似，但它的参数被声明为\
  \ `object` 而不是 `int`。因此它在开始循环之前必须将 `object` 转换为 `int`。\n\n起初，这个示例看起来与之前描述的 `BeginInvoke`\
  \ 示例相似。它们都启动了一个异步线程，在 UI 线程上进行一些计数，然后在等待异步线程完成后后再继续。\n\n区别在于 `BeginInvoke` 示例在等待异步线程完成时会被阻塞。相比之下，`AsyncAwait`\
  \ 示例在代码使用 `await` 关键字后立即返回。稍后异步线程完成后，它会调用一个隐藏的回调，执行会在 `await` 关键字之后直接返回主程序。这让 UI\
  \ 线程在等待线程完成时仍保持响应。\n\n## 总结\n\n方法允许你将应用程序拆分为易管理、可重用的部分。本章解释了如何声明定义行为的方法。它还解释了与方法相关的技术，例如如何创建扩展方法以及使用协变和逆协变。\n\
  \n\n\n\n## 7. `Math` 类的 `Sqrt` 方法返回一个数的平方根，但该类没有返回其他根（如立方根）的方法。然而，`Math` 类的 `Pow`\
