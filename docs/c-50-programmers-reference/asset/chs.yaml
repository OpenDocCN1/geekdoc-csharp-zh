  \ true。\n// 如果文件不存在，此方法将抛出异常。\nprivate bool FileIsSorted(string filename)\n{\n \
  \   // 打开文件。\n    using (StreamReader reader = new StreamReader(filename))\n   \
  \ {\n        // 从小于任何字符串的行开始。\n        string previousLine = \"\";\n\n        //\
  \ 读取行。\n        while (!reader.EndOfStream)\n        {\n            string nextLine\
  \ = reader.ReadLine();\n            if (nextLine.CompareTo(previousLine) < 0) return\
  \ false;\n            previousLine = nextLine;\n        }\n    }\n\n    // 如果到达这里，说明文件是有排序的。\n\
  \    return true;\n}\n```\n\n7.  `StreamPrimes` 示例程序使用以下代码显示质数并将它们写入文本。修改后的代码已用**粗体**标记。\n\
