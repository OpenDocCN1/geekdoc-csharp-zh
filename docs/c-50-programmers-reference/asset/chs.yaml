  Name\").Value);\n\n    // 显示队伍的球员。\n    foreach (var player in team.Players)\n \
  \       Console.WriteLine(\"    \" +\n            player.Attribute(\"FirstName\"\
  ).Value + \" \" +\n            player.Attribute(\"LastName\").Value);\n}\n```\n\n\
  与之前的解决方案类似，此查询搜索位于 `Teams` 子树中的 `Team` 元素。它随后选择了这些 `Team` 以及它们的 `Player` 后代元素。代码遍历选中的对象，显示每个\
  \ `Team` 的名称及其 `Player`。\n\n示例程序 `VolleyballTeamsAndPlayers` 展示了这两种方法。（这两个解决方案使用了相似的循环来显示结果。第二个版本感觉更像\
  \ LINQ 风格，但第一个看起来更直观，所以我我更倾向于第一种解决方案。）\n\n4. 示例程序 `VolleyballTeamsAndScores` 执行了此操作。它使用以下代码来匹配相应的队伍和比赛分数记录。\n\
  \n```xml\n// 连接队伍和比赛结果。\nvar teamResults =\n    from team in root.Element(\"Teams\"\
  ).Descendants(\"Team\")\n    join result in root.Element(\"Matches\").Descendants(\"\
  Team\")\n        on team.Attribute(\"Name\").ToString()\n            equals result.Attribute(\"\
  Name\").ToString()\n    select new\n    {\n        Team = team.Attribute(\"Name\"\
  ).Value,\n        Score = int.Parse(result.Attribute(\"Score\").Value)\n    };\n\
  \nstring format = \"{0,-20}{1,10}\";\nConsole.WriteLine(string.Format(format, \"\
  Team\", \"Points\"));\nConsole.WriteLine(string.Format(format, \"====\", \"======\"\
  ));\nforeach (var obj in teamResults)\n{\n    Console.WriteLine(string.Format(format,\
  \ obj.Team, obj.Score));\n}\n```\n\n该查询匹配 `Teams` 子树内部的 `Team` 元素与 `Matches` 子树内部的\
  \ `Team` 元素。对于每一对选择项，查询选择了队伍的 `Name` 属性和比赛结果的 `Score` 属性。\n\n注意，代码在将队伍和比赛的 `Name`\
  \ 属性转换为字符串后进行了比较。属性本身是 `XAttribute` 对象。它们持有相同的值，但 `XAttribute` 对象是不同的，因此如果你比较这些对象，将永远无法找到任何匹配。\n\
  \n在选择相应的记录后，程序遍历查询结果并显示队伍名称和分数。\n\n5. 示例程序 `VolleyballTeamsAndTotals` 执行了此操作。它使用以下代码计算并显示队伍的总胜场数和积分。\n\
  \n```xml\n// 选择队伍及其结果。\n// 统计每个队伍的胜场数和积分。\nvar teamResults =\n    from team in root.Element(\"\
  Teams\").Descendants(\"Team\")\n    join result in root.Element(\"Matches\").Descendants(\"\
  Team\")\n        on team.Attribute(\"Name\").Value\n            equals result.Attribute(\"\
  Name\").Value\n    group result by team into teamMatches\n    orderby teamMatches.Count(r\
  \ => r.Attribute(\"Score\").Value == \"25\") descending,\n            teamMatches.Sum(r\
  \ => (int)r.Attribute(\"Score\")) descending\n    select new\n    {\n        Team\
  \ = teamMatches.Key.Attribute(\"Name\").Value,\n        Wins = teamMatches.Count(r\
  \ => r.Attribute(\"Score\").Value == \"25\"),\n        Points = teamMatches.Sum(r\
  \ => (int)r.Attribute(\"Score\"))\n    };\n\nstring format = \"{0,-20}{1,10}{2,10}\"\
  ;\nConsole.WriteLine(string.Format(format, \"Name\", \"Wins\", \"Points\"));\nConsole.WriteLine(string.Format(format,\
  \ \"====\", \"========\", \"======\"));\nforeach (var results in teamResults)\n\
  {\n    Console.WriteLine(string.Format(format, results.Team, results.Wins, results.Points));\n\
  }\n```\n\n与第 4 点的一样，此程序将队伍与比赛结果连接。它按队伍分组结果，并将组命名为 `teamMatches`。\n\n为了确定一个队伍赢得比赛次数，查询统计了\
  \ `Score` 属性值为 25 的比赛。\n\n为了确定队伍的总积分，查询对转换为整数的比赛值进行求和。\n\n查询根据胜场数和总积分对结果进行排序。最后，它选择了队伍名称以及胜场数和总积分。\n\
  \n接下来，程序遍历查询并显示结果。由于查询选择的是简单的字符串和整数值，显示结果非常容易。\n\n6. 示例程序 `CreateVolleyballDataSet`\
