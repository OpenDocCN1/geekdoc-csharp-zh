  \ 1、2 或 3 以外的数值，程序将忽略它们。\n\n## 6. 本章下载的 `ConsoleUnexpectedInputs` 示例程序使用以下代码处理意外输入。新行已用**粗体**标记。\n\
  \n```csharp\nstatic void Main(string[] args)\n{\n    // 安装处理程序。\n    AppDomain.CurrentDomain.UnhandledException\
  \ += UnhandledException;\n\n    // 无限循环。\n    for (; ; )\n    {\n        Console.WriteLine(\"\
  1 - Continue, 2 - Throw exception, 3 - Exit\");\n        Console.Write(\"> \");\n\
  \        string text = Console.ReadLine();\n\n        // 如果输入无法解析，则将选择设置为 0。\n \
  \       int choice;\n        if (!int.TryParse(text, out choice)) choice = 0;\n\n\
  \        switch (choice)\n        {\n            case 1:\n                // 继续。\n\
  \                Console.WriteLine(\"Continuing...\\n\");\n                break;\n\
  \n            case 2:\n                // 抛出异常。\n                Console.WriteLine(\"\
  Throwing exception...\\n\");\n                throw new ArgumentException();\n\n\
  \            case 3:\n                // 退出。\n                return;\n        \
  \    default:\n                // 处理其他输入。\n                Console.WriteLine(\"\
  Unexpected input: \" + text + \"\\n\");\n                break;\n        }\n   \
  \ }\n}\n```\n\n## 7. 本章下载的 `ConsoleTryCatch` 示例程序使用以下代码避免使用 `UnhandledException`\
  \ 事件处理程序。\n\n\n\n\n\n```csharp\nstatic void Main(string[] args)\n{\n    // Loop\
  \ forever.\n    for (; ; )\n    {\n        // Catch all exceptions.\n        try\n\
  \        {\n            Console.WriteLine(\"1 - Continue, 2 - Throw exception, 3\
  \ - Exit\");\n            Console.Write(\"> \");\n            string text = Console.ReadLine();\n\
  \            int choice = int.Parse(text);\n\n            switch (choice)\n    \
  \        {\n                case 1:\n                    // Continue.\n        \
  \            Console.WriteLine(\"Continuing...\\n\");\n                    break;\n\
  \n                case 2:\n                    // Throw an exception.\n        \
  \            Console.WriteLine(\"Throwing exception...\\n\");\n                \
  \    throw new ArgumentException();\n\n                case 3:\n               \
  \     // Exit.\n                    return;\n            }\n        }\n        catch\
  \ (Exception ex)\n        {\n            Console.WriteLine(\"Caught exception:\"\
  );\n            Console.WriteLine(ex.Message);\n            Console.WriteLine(\"\
  \\n\\n\");\n        }\n    }\n}\n```\n\n这种方法的一个优点是它可以防止程序关闭。而 `UnhandledException`\
  \ 事件处理程序无法做到这一点。\n\n这种方法的一个缺点是程序可能会陷入无限循环。这个示例没有这个问题（至少只要你写得正确的话），但程序可能会抛出一个异常，显示错误消息，然后在恢复主循环执行时再次抛出相同的异常。`UnhandledException`\
  \ 事件处理程序无法阻止程序结束，因此它没有这个问题。（尽管这有点像说：因为你的车被收了，所以你没有停车位的问题了。你之所以没问题是因为你遇到了更严重的问题。）\n\
  \n8. 主程序使用用户输入的值调用 `Factorial` 方法。`Debug.Assert` 语句和代码合约有助于在测试期间找出错误，但用户在发布版本中仍可能输入无效值。你可以使用这些方法来寻找错误，但程序在任何情况下都需要处理无效输入并正确运行，因此在\
  \ `try-catch` 块中处理问题会更有用。\n\n原始代码有两个地方可能会失败：在 `calculateButton_Click` 事件处理程序和 `Factorial`\
  \ 方法中。事件处理器可能无法解析用户的输入。`Factorial` 方法在输入为负数或太大时可能会失败。这些代码的每一个都应该自我保护。\n\n本章下载的 Factorial\
  \ 示例程序使用了以下代码来保护自己不受无效输入的影响。\n\n```csharp\n// Calculate 输入的数字阶乘。\nprivate void calculateButton_Click(object\
  \ sender, EventArgs e)\n{\n    try\n    {\n        // 如果我们失败了，清除结果标签。\n        resultLabel.Text\
  \ = \"\";\n\n        // 尝试解析用户输入的数字。\n        long number;\n        if (!long.TryParse(numberTextBox.Text,\
  \ out number))\n        {\n            MessageBox.Show(\"Please enter a number.\"\
  );\n            numberTextBox.Select(0, numberTextBox.Text.Length);\n          \
  \  numberTextBox.Focus();\n            return;\n        }\n\n        // 显示阶乘。\n\
  \        resultLabel.Text = Factorial(number).ToString();\n    }\n    catch (OverflowException)\n\
  \    {\n        MessageBox.Show(\"Please enter a number between 0 and 20.\");\n\
  \    }\n    catch (ArgumentOutOfRangeException)\n    {\n        MessageBox.Show(\"\
  Please enter a number between 0 and 20.\");\n    }\n    catch (Exception ex)\n \
  \   {\n        Console.WriteLine(\"Exception: \" + ex.GetType().Name);\n       \
  \ MessageBox.Show(ex.Message);\n    }\n}\n\n// Return number!\nprivate long Factorial(long\
  \ number)\n{\n    // 确保数字是非负的。\n    if (number < 0)\n        throw new ArgumentOutOfRangeException(\"\
  number\",\n            \"Argument number must be non-negative.\");\n\n    // 检查溢出。\n\
  \    checked\n    {\n        long result = 1;\n        for (long i = 2; i <= number;\
  \ i++) result *= i;\n        return result;\n    }\n}\n```\n\n按钮的事件处理器在 `try-catch`\
  \ 块内部完成所有工作。前两个 `catch` 部分显示了用户可以理解的消息。第三个 `catch` 部分处理意外异常。因为它不知道会遇到什么种的异常，所以它只是写入消息。\n\
  \n## 第 10 章\n\n1. 本书下载的 Traceial 示例程序使用了以下代码来编写适当的消息。注意 `return` 语句如何包含了结果，以便在返回之前将其显示出来。（参见\
  \ `checked` 块。）\n\n```csharp\nprivate long Factorial(long number)\n{\n    Debug.Indent();\n\
  \    long result;\n    if (number <= 1) result = 1;\n    else result = number *\
  \ Factorial(number - 1);\n\n    Debug.Unindent();\n    Debug.WriteLine(\"Result:\
  \ \" + result);\n    return result;\n}\n```\n\n2. Factorial 示例程序使用了以下代码。\n\n```csharp\n\
  private long Factorial(long number)\n{\n    long result;\n    if (number <= 1) result\
  \ = 1;\n    else result = number * Factorial(number - 1);\n\n    Debug.WriteLine(\"\
  Factorial(\" + number.ToString() + \") = \" + result);\n    return result;\n}\n\
  ```\n\n3. 仅凭 `Debug` 语句无法高效地做到这一点，因为每次对 `Factorial` 方法的调用都需要知道其结果，以便在调用自身之前显示它。但它需要递归调用自身来获取结果。\n\
  \n4. 一种解决方案是构建一个包含整个轨迹的字符串，然后在最后将其显示。Factorial 示例程序使用了以下版本的 `Factorial` 方法来解决第 4\
  \ 点。\n\n```csharp\nprivate long Factorial(long number, ref string trace)\n{\n  \
  \  long result;\n    if (number <= 1) result = 1;\n    else result = number * Factorial(number\
  \ - 1, ref trace);\n\n    // 在轨迹的开头添加我们的信息。\n    trace = \"Factorial(\" + number.ToString()\
  \ + \") = \" + result.ToString() + '\\n' + trace;\n\n    return result;\n}\n```\n\
  \n该方法接受第二个 `ref` 参数，其中包含包含方法 `trace` 的字符串。当方法被调用时，它通过递归调用自身来计算其值。递归调用将 `trace` 设置为递归调用轨迹（以及它进行的任何进一步递归调用）。\n\
  \n当递归调用返回时，当前方法将其信息添加到 `trace` 字符串的开头。\n\n程序使用以下代码调用 `Factorial` 方法。\n\n```csharp\n\
  string trace = \"\";\nresultLabel.Text = Factorial(number, ref trace).ToString();\n\
  \n// Display the trace.\nDebug.WriteLine(trace);\n```\n\n这段代码初始化了一个空的 `trace` 字符串，调用\
  \ `Factorial` 方法然后显示 `trace`。\n\n5. 本书下载的 DebugLevels 示例程序使用了以下代码来编写适当的消息。\n\n\n\
  \n\n\n```sharp\n// Display the message if the debug level is low enough.\nprivate\
  \ void PrintMessage(int level, string message)\n{\n#if DEBUG1\n    if (level <=\
  \ 1) Console.WriteLine(message);\n#elif DEBUG2\n    if (level <= 2) Console.WriteLine(message);\n\
  #elif DEBUG3\n    if (level <= 3) Console.WriteLine(message);\n#elif DEBUG4\n  \
  \  if (level <= 4) Console.WriteLine(message);\n#elif DEBUG5\n    if (level <= 5)\
  \ Console.WriteLine(message);\n#endif\n}\n```\n\n这种方法的明显优势是，它可以提供许多你需要的数量的调试级别，而不仅仅是\
  \ `Debug` 和 `Trace` 类所提供的两个。\n\n一个缺点是它要求你为每种可能的调试级别编写单独的代码行。它还不支持跟踪监听器（trace listeners），因此你无法像\
  \ `Debug` 和 `Trace` 类那样使用多个监听器将消息发送到多个位置。\n\n如果你使用变量而不是预处理器符号来确定程序的当前调试级别，就可以解决第一个问题。这还允许你以不同的方式加载值，这可能比重新编译更方便。例如，程序可以在运行时从文本文件、配置文件或注册表设置加载值。然后你就可以更改调试级别并重新运行程序，而无需重新编译。\n\
  \n如果你让该方法使用 `Trace` 类来显示其结果，你也可以利用跟踪监听器。\n\n以下代码显示了该方法的改进版本。\n\n```sharp\n// The\
  \ debug level. Load it from a text file, config file, registry setting, etc.\nprivate\
  \ int DebugLevel = 2;\n\n// Display the message if the debug level is low enough.\n\
  private void PrintMessage(int level, string message)\n{\n    if (level <= DebugLevel)\
  \ Trace.WriteLine(message);\n}\n```\n\n6. `MessageLog` 示例程序可以在本书下载，使用以下代码将消息写入消息文件中。\n\
  \n```csharp\nstatic void Main(string[] args)\n{\n    // 移除默认的 Debug 监听器并\n    //\
