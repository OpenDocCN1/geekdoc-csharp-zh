  * 第 27 章: 加密\n\n# 第 21 章\n\n正则表达式\n\n### 本章内容\n\n* 正则表达式语法\n* 使用正则表达式检测匹配、查找匹配并进行替换\n\
  * 使用正则表达式解析输入\n\n## 本章的 Wrox.com 下载资源\n\n请注意，本章的所有代码示例都可以作为本章代码下载的一部分，在书籍网站的 [www.wrox.com/go/csharp5programmersref](http://www.wrox.com/go/csharp5programmersref)\
  \ 上的“下载代码（Download Code）”选项卡获取。\n\n许多应用程序允许用户输入信息，但这些信息应该匹配某种模式。例如，字符串 `784-369`\
  \ 不是一个有效的电话号码，而 `Rod@Stephens@C#Helper.com` 不是一个有效的电子邮件地址。\n\n验证此类输入的一种方法是使用字符串方法。你可以使用\
  \ `string` 类的 `IndexOf`、`LastIndexOf`、`Substring` 和其他方法来拆分输入并查看这些部分是否合理。然而，对于除最简单的情况外，那将是一项巨大的工作。\n\
  \n正则表达式为验证用户输入是否匹配某种模式提供了另一种方法。正则表达式是一个包含定义模式的字符的字符串。例如，正则表达式 `^\\d{3}-\\d{4}$`\
  \ 代表一种匹配三个数字、后跟一个连字符、再跟四个数字的模式，如 `123-4567\\.`。（这不是一个匹配美国电话号码的理想模式，因为它允许许多无效的组合，如\
  \ 111-1111 和 000-0000。）\n\n`.NET` 框架包含了可以使用正则表达式来检查输入字符串是否匹配模式的类。它们还提供了在输入文本中定位模式以及进行复杂替换的方法。\n\
  \n本章提供了正则表达式的介绍。它解释了如何创建正则表达式以及如何使用它们来检查字符串是否匹配模式、查找匹配并进行替换。\n\n以下章节介绍了 `.NET` 使用的正则表达式语法。后续章节将如何判断字符串是否匹配模式。\n\
  \n## 构建正则表达式\n\n在编写代码检查输入字符串是否匹配模式之前，你需要了解如何构建正则表达式。\n\n正则表达式可以包含精确匹配输入的字面字符和具有特殊含义的字符。例如，序列\
  \ `[0-9]` 表示输入匹配单个数字。\n\n正则表达式还可以包含称为转义序列的特殊序列，用于匹配特定模式或控制正则表达式的行为。例如，`\\d` 就像 `[0-9]`\
  \ 一样匹配单个数字。\n\n如果你想在正则表达式中包含特殊字符 `\\` 或 `[` 而不产生其特殊含义，你可以将其“转义”为 `\\\\` 或 `\\[`。\n\
  \n构建正则表达式的工具分为六类：字符转义、字符类、锚点、分组构造、量词和交替构造。后续章节将描述这些类别。后续章节将描述一些匹配常见输入模式的正则表达式示例。\n\
  \n### 字符转义\n\n字符转义匹配无法直接输入字符串的特殊字符（如 Tab）。下表列出了最常用的字符转义。\n\n| 转义 | 含义 |\n| :---\
  \ | :--- |\n| `\\t` | 匹配制表符 |\n| `\\r` | 匹配回车符 |\n| `\\n` | 匹配换行符 |\n| `\\nnn` |\
  \ 由两个或三个八进制数字 `nnn` 指定的 ASCII 码 |\n| `\\xnn` | 由两个十六进制数字 `nn` 指定的 ASCII 码 |\n| `\\\
  unnnn` | 由由四个十六进制数字 `nnnn` 指定的 Unicode 表示 |\n\n例如，正则表达式 `\\u00A7` 匹配节符号 §（因为 00A7\
  \ 是该字符的十六进制值）。\n\n### 字符类\n\n字符类匹配字符集中的项。例如，`\\d` 匹配数字 0 到 9\\。下表列出了最常用的字符类构造。\n\
  \n| 构造 | 含义 |\n| :--- | :--- |\n| `[chars` `]` | 匹配括号内的字符之一。例如，`[aeiou]` 匹配单个小写元音。\
  \ |\n| `[^chars` `]` | 匹配不在括号内的字符。例如，`[^aeiouAEIOU]` 匹配单个非元音字符，如 `Q`、`?` 或 `3`。\
  \ |\n\n\n\n\n\n| 模式 | 说明 |\n| :--- | :--- |\n| `[first-last]` | 匹配字符 `first` 和字符\
  \ `last` 之间的字符。例如，`[a–z]` 匹配 `a` 到 `z` 之间的任何小写字母。你可以像 `[a-zA-Z]` 那样组合多个范围，它匹配大写或小写字母。\
  \ |\n| `.` | 这是一个通配符，匹配除 `\\n` 外的任何单个字符。（要匹配点，请使用转义序列 `\\.`。） |\n| `\\w` | 匹配单个“单词”字符。通常，它等同于\
  \ `[a-zA-Z_0-9]`，因此它匹配字母、下划线和数字。 |\n| `\\W` | 匹配单个非单词字符。通常，它等同于 `[^a-zA-Z_0-9]`。\
  \ |\n| `\\s` | 匹配单个空白字符。通常，它包括 `[Space]`、`[Form feed]`、`[Newline]`、`[Return]`、`[Tab]`\
  \ 和 `[Vertical tab]`。 |\n| `\\S` | 匹配单个非空白字符。通常，它匹配除 `[Space]`、`[Form feed]`、`[Newline]`、`[Return]`、`[Tab]`\
  \ 和 `[Vertical tab]` 之外的所有字符。 |\n| `\\d` | 匹配单个进制数字。通常，它等同于 `[0-9]`。 |\n| `\\D`\
  \ | 匹配单个非进制数字的字符。通常，它等同于 `[⁰-9]`。 |\n\n例如，正则表达式 `[A-Z]\\d[A-Z] \\d[A-Z]\\d` 匹配格式为\
  \ `A1A 1A1` 的加拿大邮政编码，其中 `A` 代表字母 `1` 代表数字。\n\n### 锚点 (Anchors)\n\n锚点（也称为原子零宽断言）表示输入字符串在特定某必须必须处的状态，以便实现匹配。锚点在字符串中具有位置，但不消耗字符。\n\
  \n例如，`^` 和 `$` 字符表示行或字符串的开始和结束，取决于你处理的是多行还是单行输入。\n\n下表列出了最常用的锚点。\n\n| 锚点 | 含义 |\n\
  | :--- | :--- |\n| `^` | 匹配行或字符串的开头 |\n| `$` | 匹配字符串的结尾，或行/字符串末尾 `\\n` 之前 |\n| `\\\
  A` | 匹配字符串的开头 |\n| `\\Z` | 匹配字符串的结尾，或字符串末尾 `\\n` 之前 |\n| `\\z` | 匹配字符串的结尾 |\n| `\\\
  G` | 匹配上次匹配结束的地方 |\n| `\\B` | 匹配非单词边界 |\n\n有关这些选项的更多信息，请参阅 [msdn.microsoft.com/library/yd1hzczs.aspx](http://msdn.microsoft.com/library/yd1hzczs.aspx)\
  \ 中的“正则表达式选项”。\n\n### 分组构造 (Grouping Constructs)\n\n分组构造允许你可以在字符串的匹配部分内定义捕获组。例如，在格式为\
  \ `123-45-6789` 的美国社会安全号码中，你可以定义组来保存 `123`、`45` 和 `6789` 部分。程序稍后可以使用 `C#` 代码或在同一个正则表达式的内部引用这些组。\n\
  \n括号创建组。例如，考虑表达式 `(\\w)\\1`。括号创建了一个数字组，在示例中它匹配一个单个单词字符。在表达式的后面，文本 `\\1` 引用第 1 组。这意味着该正则表达式匹配一个单词字符后紧跟一个相同的字符。如果字符串是“book”，那么此模式将匹配中间的“oo”。\n\
  \n有几种类型的组，其中一些相当特殊且容易引起困惑。最常见的两种是数字组和命名组。\n\n要创建数字组，只需如上一个示例所示，将子表达式包含在括号中。\n\n\
  要创建命名组，请使用语法 `(?<name>subexpression)`，其中 `name` 是你想分配给组的名称，`subexpression` 是子表达式。\n\
  \n在正则表达式中使用命名组，请使用语法 `\\k<name>`。\n\n例如，表达式 `(?<twice>\\w)\\k<twice>` 等于之前的表达式 `(\\\
  w)\\1`，区别在于该组被命名为 `twice`。\n\n### 量词符号 (Quantifiers)\n\n量词符号使正则表达式引擎匹配前一个元素的特定次数。例如，表达式\
  \ `\\d{3}` 精确匹配 3 次任何数字。下表描述了正则表达式量词符号。\n\n| 量词符号 | 含义 |\n| :--- | :--- |\n| `*`\
  \ | 匹配前一个元素 0 次或多次 |\n| `+` | 匹配前一个元素 1 次或多次 |\n| `?` | 匹配前一个元素 0 次或 1 次 |\n| `{n}`\
  \ | 匹配前一个元素刚好 `n` 次 |\n| `{n,}` | 匹配前一个元素 `n` 次或多次 |\n| `{n,m}` | 匹配前一个元素 `n` 到\
  \ `m` 次（包含边界） |\n\n如果你在这些符号之后紧跟 `?`，则模式将尽可能少地匹配前面的表达式。例如，模式 `BO+` 匹配 `B` 后跟 1 个或多个\
  \ `O`，因此它会匹配 `BO`。\n\n### 择择 (Alternation)\n\n选择择允许你匹配多个表达式中的任意一个。例如，表达式 `cat|dog`\
  \ 匹配 \"cat\" 或 \"dog\"。`|` 符号是选择择运算符。\n\n### 字符 (Classes)\n\n字符类允许你匹配指定集合中的任何字符。例如，`[abc]`\
  \ 匹配 'a'、'b' 或 'c' 中的任意一个字符。使用 `[^abc]` 匹配集合中*不在*的任何字符。\n\n\n\n\n该模式匹配一个 3 位的十六进制值，带有可选的符号\
  \ `+` 或 `–`，如 `+A1F`。\n\n```\n^(https?://)?([\\w-]+\\.)+[\\w-]+$\n```\n\n该模式匹配一个顶层\
  \ HTTP 网页地址，例如 [`www.csharphelper.com`](http://www.csharphelper.com)。\n\n模式 `(https?://)?`\
  \ 匹配 `http`，后面跟零次或 1 次 `s`，然后是 `://`。整个组后面跟着 `?`，所以整个组必须出现零次或 1 次。\n\n模式 `([\\w-]+\\\
  .)+` 匹配一次或多次单词字符（字母、数字或下划线）或连字符，后面跟一个句号。这整个组后面跟着 `+`，因此整个组必须出现一次或多次。\n\n最后一部分 `[\\\
  w-]+` 匹配一次或多次字母、数字、下划线或连字符。\n\n该模式并不是完美的。特别是它没有验证域名的最后部分，因此它会匹配 [www.something.whatever](http://www.something.whatever)。\n\
  \n```\n^(https?://)?([\\w-]+\\.)+[\\w-]+(/(([\\w-]+)(\\.[\\w-]+)*)*)*)*$\n```\n\n\
  该模式匹配一个 HTTP 网页 URI，例如 [`www.csharphelper.com/howto_index.html`](http://www.csharphelper.com/howto_index.html)。它以与前一个模式相同的代码开头。新新部分以**粗体**显示。\n\
  \n整个新部分被括号包围，并在后面跟着 `*`，所以整个部分可以出现零次或多次。\n\n新部分以 `/` 开头，因此文本必须以 `/` 字符开头。\n\n新部分的其余部分被括号包围并跟着\
  \ `*`，因此该部分可以出现零次或多次。这允许 URL 以 `/` 结尾。\n\n模式的其余部分是 `([\\w-]+)(\\.[\\w-]+)*)`。第一部分\
  \ `([\\w-]+)` 要求字符串包含一个或多个字母、数字、下划线或连字符。第二部分 `(\\.[\\w-]+)*)` 要求字符串包含一个句号，后面跟一个或多个字母、数字、下划线或连字符。这第二个部分后面跟着\
  \ `*`，所以它可以出现零次或多次。（基本上这部分意味着 URL 可以包含由句号分隔的字符，但不能以句号结尾。）\n\n再次，该模式并不是完美的，无法处理一些更高级\
  \ URL（例如包含 `=`、`?` 和 `#` 字符的 URL），但它可以处理许多典型的 URL。\n\n注意所有这些模式都以行首锚点 `^` 开头并行尾锚点\
  \ `$` 结尾，因此每个模式匹配整个字符串而不仅仅是其部分。例如，模式 `^\\d{5}(-\\d{4})?$` 匹配看起来像 ZIP 码（如 12345）的完整字符串。如果没有\
  \ `^` 和 `$`，该模式将匹配*包含*看起来像 ZIP 码字符串的字符串，例如 x12345x。\n\n## 使用正则表达式\n\n`Regex` 类提供了你可以使用它们来处理正则表达式的对象。下表总结了\
  \ `Regex` 类最有用的方法。\n\n| 方法 | 目的 |\n| :--- | :--- |\n| `IsMatch` | 如果字符串满足正则表达式，则返回\
  \ `true`。 |\n| `Match` | 在字符串中搜索满足正则表达式的第一部分。 |\n| `Matches` | 返回一个集合，提供关于字符串中满足正则表达式的所有部分的信息。\
  \ |\n| `Replace` | 将字符串中匹配正则表达式的部分或全部替换为新值。（这比 `string` 类的 `Replace` 方法强大得多。） |\n\
  | `Split` | 将字符串拆分为子字符串数组，由匹配正则表达式的字符串片段进行分隔。 |\n\n表中描述的许多方法都有多个重载版本。特别是，许多方法接受\
  \ `string` 作为参数，并可以可选地接受另一个提供正则表达式的参数。如果你不向方法传递正则表达式，则该方法将使用你传递给对象构造函数的表达式。\n\n\
  `Regex` 类还提供了这些方法的静态版本，它们同时接受 `string` 和一个正则表达式作为参数。例如，以下代码确定了 `inputTextBox` 中的文本是否满足\
  \ `patternTextBox` 中的正则表达式。\n\n```\nif (Regex.IsMatch(inputTextBox.Text, patternTextBox.Text))\n\
  \    resultLabel.Text = \"Match\";\nelse\n    resultLabel.Text = \"No match\";\n\
  ```\n\n静态方法使得简单的正则表达式测试变得容易。\n\n接下来的章节将解释如何使用 `Regex` 类来执行常见的正则表达式任务，例如查找匹配项、进行替换以及解析输入字符串。\n\
  \n### 匹配模式\n\n`Regex` 类的静态 `IsMatch` 方法为你提供了一种简单的方法来确定字符串是否满足正则表达式。MatchPattern\
  \ 示例程序可以下载，并在图 21-1 所示所示，使用该方法来确定字符串是否匹配模式。\n\n![c21f001.tif](img/c21f001.png)\n\
  \n图 21-1： MatchPattern 示例程序确定字符串是否满足正则表达式。\n\n当你修改正则表达式或字符串时，程序执行以下代码。\n\n```\n\
  // 检查是否匹配。\nprivate void CheckMatch()\n{\n    try\n    {\n        if (Regex.IsMatch(inputTextBox.Text,\
  \ patternTextBox.Text))\n            resultLabel.Text = \"Match\";\n        else\n\
  \            resultLabel.Text = \"No match\";\n    }\n    catch (Exception ex)\n\
  \    {\n        resultLabel.Text = ex.Message;\n    }\n}\n```\n\n代码向 `Regex.IsMatch`\
  \ 方法传递要验证的字符串和正则表达式。如果字符串满足表达式，该方法返回 `true`。程序在 `resultLabel` 中显示适当的消息。此示例使用 `try\
  \ catch` 块来保护自己不受错误的正则表达式。例如，假设你想使用表达式 `(.)\\1` 检测重复字符。在你输入时的某一点你输入了 `(`，这是有效的。\n\
  \n### 查找匹配项\n\n`Regex` 类的 `Matches` 方法可以提供关于字符串匹配表达式的信息。FindMatches 示例程序可以下载，并在图\
  \ 21-2 所示，显示匹配模式的部分。\n\n![c21f002.tif](img/c21f002.png)\n\n图 21-2： FindMatches 示例程序找到匹配模式的部分。\n\
  \nFindMatches 程序使用以下代码定位匹配项。\n\n```\n// 显示匹配项。\nprivate void FindMatches()\n{\n\
  \    try\n    {\n        // 创建正则对象。\n        Regex regex = new Regex(patternTextBox.Text);\n\
  \n        // 查找匹配项。\n        string matches = \"\";\n        foreach (Match match\
  \ in regex.Matches(inputTextBox.Text))\n        {\n            // 显示匹配项。\n     \
  \       matches += match.Value +\" \";\n        }\n        resultLabel.Text = matches;\n\
  \    }\n    catch (Exception ex)\n    {\n        resultLabel.Text = ex.Message;\n\
  \    }\n}\n```\n\n此代码创建一个 `Regex` 对象，向其构造函数传递正则表达式。然后它调用对象的 `Matches` 方法，传递输入字符串。它遍历返回的\
  \ `Match` 对象集合，并将每个匹配项的 `Value` 添加到结果字符串中。完成后，它将结果显示在 `resultLabel` 中。\n\n下表列出了\
  \ `Match` 类最有用的属性。\n\n\n\n\n\n| `Groups` | 返回一个表示由正则表达式捕获的任何组的对象集合。`Group` 类具有 `Index`、`Length`\
  \ 和 `Value` 属性，用于描述该组。 |\n| `Index` | 匹配项第一个字符的索引。 |\n| `Length` | 此匹配项所代表的文本长度。\
  \ |\n| `Value` | 此匹配项所代表的文本。 |\n\n### 替换\n\n`Regex` 类的静态 `Replace` 方法允许你将字符串中匹配模式的部分替换为新字符串。`MakeReplacements`\
  \ 示例程序（可以下载并在图 21-3 中所示）演示了将字符串中匹配模式的部分替换为新字符串。\n\n![c21f003.tif](img/c21f003.png)\n\
  \n图 21-3: `MakeReplacements` 示例程序将字符串的匹配部分替换为新值。\n\n以下代码展示了 `MakeReplacements` 程序如何执行替换。\n\
  \n```\n// Make the replacements.\nprivate void replaceButton_Click(object sender,\
  \ EventArgs e)\n{\n    resultTextBox.Text = Regex.Replace(\n        inputTextBox.Text,\n\
  \        patternTextBox.Text,\n        replaceWithTextBox.Text);\n}\n```\n\n此代码简单地调用了\
  \ `Replace` 方法，并了输入字符串、匹配模式和替换文本。\n\n### 解析输入\n\n在某些情况下，你可以使用 `Regex` 对象通过捕获组来解析输入字符串。在匹配字符串后，你可以遍历\
  \ `Regex` 对象的 `Matches` 集合，以找到字符串中匹配表达式的部分。然后，你可以使用每个 `Match` 的 `Groups` 集合（通过数字或名称——如果组已命名——进行索引）来获取组中的匹配片段。\n\
  \n`ParsePhoneNumber` 示例程序（可以下载并在图 21-4 中所示）使用 `Regex` 对象来查找 10 位电话号码的片段。\n\n![c21f004.tif](img/c21f004.png)\n\
  \n图 21-4: `ParsePhoneNumber` 示例程序解析电话号码的片段。\n\n`ParsePhoneNumber` 程序使用以下代码查找电话号码的片段。\n\
  \n```\n// Find matching groups.\nprivate void parseButton_Click(object sender, EventArgs\
  \ e)\n{\n    groupsListBox.Items.Clear();\n\n    Regex regex = new Regex(patternTextBox.Text);\n\
  \    foreach (Match match in regex.Matches(inputTextBox.Text))\n    {\n        groupsListBox.Items.Add(\"\
  NPA:  \" + match.Groups[\"NPA\"]);\n        groupsListBox.Items.Add(\"NXX:  \" +\
  \ match.Groups[\"NXX\"]);\n        groupsListBox.Items.Add(\"XXXX: \" + match.Groups[\"\
  XXXX\"]);\n    }\n}\n```\n\n此代码清空了 `ListBox`，然后创建一个 `Regex` 对象，并将构造函数传递了要匹配的模式。随后它调用\
  \ `Matches` 方法传递输入字符串，并遍历生成的匹配项集合。\n\n如果输入字符串包含单个电话号码，则 `Matches` 集合中只有一个匹配项。事实上，图\
  \ 21-4 中所示的模式最多包含一个匹配项。\n\n对于每个匹配项，代码使用 `Groups` 集合来获取命名组 `NPA`、`NXX` 和 `XXXX` 中的文本。它将找到的值添加到结果\
  \ `ListBox` 中。\n\n## 总结\n\n`string` 类提供了你可以使用的方法来检查字符串以查看其是否匹配特定模式。遗憾的是，如果模式很复杂，使用这些方法可能会非常麻烦。\n\
  \n`Regex` 类提供了另一种通常简单得的方法。与其拆分字符串来查看其是否匹配模式，`Regex` 类允许你定义一个正则表达式，然后查看字符串是否满足该表达式。该类的方法还允许你找到字符串中匹配表达式的部分、进行替换并解析字符串以找到匹配正则表达式部分的片段。\n\
  \n第 8 章“LINQ”描述了 PLINQ，它允许你并行执行多个 LINQ 查询。PLINQ 并不是程序同时执行多个任务的唯一方法。下一章将解释其他可以使用并行性来提高多\
  \ CPU 或多核系统上性能的方法。\n\n## 练习题\n\n1. 编写一个程序，接收输入字符串，删除前后的空白字符，并将多个空白字符序列替换为单个空格。例如，对于输入字符串“\
  \ This is a test. ”，程序应产生结果“This is a test.”。\n\n2. 编写一个使用 `Regex.Split` 列出字符串中单词的程序。\n\
  \n3. 修改图 21-2 所示的 `FindMatches` 示例程序，使其在 `ListBox` 中显示匹配项。然后使用正则表达式 `\\w*` 和输入字符串\
  \ `abc;def;;;ghi;;` 运行程序。为什么程序没有只显示 `abc`、`def`、`ghi` 这三个字符串？\n\n4. 图 21-4 所示的 `ParsePhoneNumber`\
  \ 示例程序无法匹配缺少区号的电话号码。你可以使用什么正则表达式来解析带有或不带区号的电话号码？如果号码缺少区号，程序会做什么？\n\n5. 修改 `ParsePhoneNumber`\
  \ 示例程序，使其能够解析多行字符串中的电话号码。在 `ListBox` 中每行显示一个电话号码，格式为 `NPA: 800, NXX: 555, XXXX:\
  \ 1337`。\n\n    提示：创建 `Regex` 对象时，使用 `Multiline` 选项。这使得 `^` 和 `$` 匹配行的开头和结尾，而不是整个字符串。另外注意\
  \ `TextBox` 使用 `[Return]` 来标记行结束。修改正则表达式使其能够根据需要移除 `[Return]` 字符。\n\n6. 编写一个匹配带数字分组整数的正则表达式，例如\
  \ –1,234 和 +91。使用图 21-1 所示的 `MatchPattern` 示例程序检查你的结果。\n\n7. 编写一个匹配浮点数的正则表达式，例如\
  \ –1234.56 和 +65.43。如果数字带有小数点，则要求在小数点后至少有一位数字。\n\n8. 编写一个匹配带数字分组的浮点数的正则表达式，例如 –1,234.5678。\n\
  \n9. 替换模式允许 `Regex.Replace` 方法在替换文本中使用组和匹配的其他部分。例如，在替换文本内部，你可以使用 `$1` 表示第一个匹配组中的文本。\n\
  \n    编写一个程序，允许你输入一系列 Ann Archer 格式的姓名。当你点击重排按钮时，让程序使用替换模式将姓名重写为 `Archer, Ann` 格式。\n\
  \n    提示：忘记移除每行末尾的 `[Return]` 字符。使用替换模式恢复它，以便每个姓名单独显示。\n\n\n\n\n另一种方法是在不同的处理器上运行程序的不同部分。现在某些计算机具有多个处理器，而且许多计算机还具有多个核心，即单个芯片上的多个独立中央处理器（`CPUs`）。如今双核系统已成常态，也可以提供四核、八核甚至更多核心的处理器。\n\
  \n为了在不同的 CPU 上执行命令，NET 应用程序创建多个线程。线程是操作系统分配 CPU 时间的最小代码单元。在多线程中，单个进程拥有多个执行线程。如果系统有多个\
  \ CPU，这些线程可以在不同的 CPU 上并行运行。\n\n.NET Framework 提供了多种多线程方法，包括以下几种：\n\n*   `PLINQ`——你已经在第\
  \ 8 章“LINQ”中见过它了。\n*   `BackgroundWorker`——此组件在单独的线程上执行代码。它使用事件与主用户界面线程（即 UI 线程）进行通信。\n\
  *   `Task Parallel Library (TPL)`——这些工具让你轻松地在不同线程中运行多个方法，或使用不同的参数运行同一方法的多个实例。\n\
  *   `Tasks`——`Task` 类允许你创建和运行线程。`Task` 类定义了一些方法，使某些典型操作变得更容易，例如在一步内创建并启动任务、等待一组任务完成，或等待一组任务中的任何一个任务完成。\n\
  *   `Threads`——`Thread` 类提供了对线程的低级访问。这些方法比使用其他方法更复杂，但它们提供了更大的控制能力。\n\n本章将解释你如何使用\
  \ `BackgroundWorker`、`TPL`、线程和任务来在多个线程上同时执行代码。（有关 PLINQ 的信息，请参阅第 8 章中的“PLINQ”章节。）\n\
  \n多进程处理是一个大话题，因此本章仅提供最常见的并行编程技术的概述。线程特别为复杂，因此本章不会对其进行详尽的介绍。PLINQ、`BackgroundWorker`\
  \ 组件、`TPL` 和 `Task` 类比线程简单得多，并且提供了许多相同的基础功能。\n\n然而，在学习如何使用这些工具之前，你需要了解一下线程如何与用户界面控件交互。接下来的章节将解释这些交互作用。随后的章节将描述\
  \ `BackgroundWorker`、`TPL` 和线程。\n\n## 与用户界面交互\n\nWindows Forms 控件不是线程安全的。这意味着它们只能由创建它们的线程（即\
  \ UI 线程）安全地操作。如果一个程序运行多个线程，只有 UI 线程可以安全地与控件交互。如果一个非 UI 线程尝试操作控件，它有时可能会成功，但通常会导致程序崩溃。\n\
  \n有时，线程可能需要与用户界面交互以向用户提供信息。例如，监控股票价格的线程可能需要显示新价格或绘制显示价格随时间变化的图表。\n\n非 UI 线程不能直接修改\
  \ UI 控件，但它可以间接地修改它们。要与 UI 控件交互，线程应该遵循以下步骤：\n\n1.  检查在 UI 线程中创建的控件的 `InvokeRequired`\
  \ 属性。如果控件是在调用 `InvokeRequired` 的线程或其他线程创建的，则该属性为 `true`。（通常线程会检查表单的 `InvokeRequired`\
  \ 属性，因此如果线程不是 UI 线程，则该属性为 `true`。）\n2.  如果 `InvokeRequired` 为 `true`，线程应该调用控件的 `Invoke`\
  \ 方法，并传递一个委托。`Invoke` 方法随后会在创建控件的线程上执行该委托。（同样，控件通常是表单，因此 `Invoke` 会在创建表单的 UI 线程上执行该委托。）\n\
  3.  委托在控件的线程上执行。由于它运行在控件的线程中，因此委托可以安全地与控件交互。（通常，控件是在 UI 线程中创建的，因此委托可以与所有 UI 控件交互。）\n\
  \n如果这看起来有点困惑，那是因为它确实如此。本书网站上提供的下载 `Invoke` 示例程序提供了一个简单的示例，使用两种技术来更新两个不同的标签。（遗憾的是，即使是这样简单的示例也可能相当困惑。）\n\
  \n此示例使用在设计时创建的 `Timer` 组件来更新标签以显示当前时间。在设计时，我将 `Timer` 的 `Enabled` 属性设置为 `true`，以便\
  \ `Timer` 自动开始运行。我还将它的 `Interval` 属性设置为 500，以便它每 500 毫秒（每半秒）触发一次 `Tick` 事件。\n\n\
  以下代码显示了 `Timer` 的 `Tick` 事件处理程序。\n\n```c\n// 更新第一个时钟。\nprivate void clock1Timer_Tick(object\
  \ sender, EventArgs e)\n{\n    clock1Label.Text = DateTime.Now.ToString(\"T\");\n\
  }\n```\n\n`Tick` 事件处理程序在 UI 线程中运行，因此它可以直接访问 `clock1Label` 控件。这使得变得非常简单。\n\n以下代码显示了程序如何创建并启动一个线程来更新第二个时钟标签。\n\
  \n```c\n// 启动一个线程来更新第二个时钟。\nprivate void Form1_Load(object sender, EventArgs e)\n\
  {\n    // 创建线程。\n    Thread thread = new Thread(UpdateClock2);\n\n    // 启动线程。\n\
  \    thread.Start();\n}\n```\n\n表单的 `Load` 事件处理程序声明并实例化了 `thread` 变量，向构造函数传递了线程应该执行的方法：`UpdateClock2`。\n\
  \n以下代码显示了线程执行的 `UpdateClock2` 方法。\n\n```c\n// 线程执行的方法。\nprivate void UpdateClock2()\n\
  {\n    // 无限循环。\n    for (;;)\n    {\n        // 这种方法无效。\n        clock2Label.Text\
  \ = DateTime.Now.ToString(\"T\");\n\n        // 这种方法可行的。\n        if (this.InvokeRequired)\n\
  \            this.Invoke(new Action(UpdateClock2));\n\n        // 等待半秒。\n      \
  \  Thread.Sleep(500);\n    }\n}\n```\n\n\n\n\n你也可以让 `Closing` 或 `Closed` 事件处理器调用\
  \ `Environment.Exit`。这将立即结束应用程序并停止所有线程。\n\n更好的解决方案是将线程的 `IsBackground` 属性设置为 `true`。当所有前景线程结束时，应用程序会停止任何后台线程并终止。初始状态，主窗的\
  \ UI 线程是唯一的前景线程。如果你不创建其他线程，那么当你关闭主窗时，其 UI 线程就会停止，应用程序随之停止。\n\n以下代码显示了 Invoke 示例程序中\
  \ `Load` 事件处理器的完整版本。设置 `IsBackground` 属性的代码已**加粗**显示。\n\n```csharp\n// Start a thread\
  \ to update the second clock.\nprivate void Form1_Load(object sender, EventArgs\
  \ e)\n{\n    // Create the thread.\n    Thread thread = new Thread(UpdateClock2);\n\
  thread.IsBackground = true;\n\n    // Start the thread.\n    thread.Start();\n}\n\
  ```\n\n## BackgroundWorker\n\n理解如何使用 `InvokeRequired` 和 `Invoke` 是使用线程较为困难的部分。与与其他线程访问\
  \ UI 控件相比，使用 `BackgroundWorker` 相对简单。\n\n`BackgroundWorker` 组件提供了一种运行独立执行线程的相对简单的方法。基本流程如下：\n\
  \n1. 创建一个 `BackgroundWorker`。因为这是一个组件，你可以在设计时将其放置在表单上。\n2. 要让工作器开始运行，调用其 `RunWorkerAsync`\
  \ 方法。这将启动一个新线程并在线程上触发工作器的 `DoWork` 事件处理器。\n3. 工作器必须捕获其 `DoWork` 事件。该事件处理器是工作器执行代码的地方。它运行在单独线程上，因此它和\
  \ UI 线程可能在不同的处理器上运行。\n\n如果你需要，`BackgroundWorker` 可以为主 UI 线程提供反馈。要实现这一点，在上述列表的基础上添加以下步骤：\n\
  \n1. 在启动 `BackgroundWorker` 之前，将其 `WorkerReportsProgress` 属性设置为 `true`。\n2. 捕获工作器的\
  \ `ProgressChanged` 事件。该事件处理器在 UI 线程中运行，因此它可以操作用户界面控件，而无需处理 `InvokeRequired` 和 `Invoke`。\n\
  \n如果你想让主程序停止工作器，请遵循以下步骤：\n\n1. 在启动 `BackgroundWorker` 之前，将其 `WorkerSupportsCancellation`\
  \ 属性设置为 `true`。\n2. 要停止工作器，调用其 `CancelAsync` 方法。\n3. 在 `DoWork` 事件处理器中，定期检查工作器的\
  \ `CancellationPending` 属性。如果该属性为 `true`，则事件处理器应该退出。如果你愿意，代码可以设置 `e.Cancel` 参数以指示工作已取消。\n\
  \n如果你在代码中声明 `BackgroundWorker` 而不是在设计时将其添加到表单，你必须在类级别保留它的引用，以便代码可以在第 2 步中调用其 `CancelAsync`\
  \ 方法。\n\n如果 `DoWork` 事件处理器结束、抛出异常或工作器通过调用 `CancelAsync` 方法停止，工作器将触发 `RunWorkerCompleted`\
  \ 事件。\n\n如果 `DoWork` 事件处理器退出，工作器将停止。事件处理器可以设置其 `e.Result` 参数以向 `RunWorkerCompleted`\
  \ 事件处理器返回值。\n\n## TPL\n\n`BackgroundWorker` 组件使用事件与 UI 线程交互，而避免了使用 `InvokeRequired`\
  \ 和 `Invoke` 的麻烦。由于它使用了事件处理器，它将代码拆分为无法按顺序轻易运行的片段。\n\n例如，假设你想执行几次复杂的计算并将结果显示给用户。你可以使用单独的\
  \ `BackgroundWorker` 来计算每个结果。遗憾的是，创建工作器的主方法随后需要结束。程序稍后会捕捉工作器的 `RunWorkerCompleted`\
  \ 事件。然后它需要确定所有工作器何时完成并显示合并后的结果。如果程序需要使用这些结果计算进一步的结果，整个过程可能会再次开始。完成的代码将充满事件处理器和协调它们的代码。\n\
  \nTPL 为在分离的线程上执行多次计算并等待它们全部完成提供了更好的方法。这些方法是 `Parallel.For`、`Parallel.ForEach` 和\
  \ `Parallel.Invoke`。\n\n### Parallel.For\n\n`Parallel.For` 方法接受起始值、结束值和一个委托作为参数。它会为起始值（包含该值）和结束值（不包含该值）之间的每个值调用一次委托。该方法会阻塞，直到对委托的所有调用完成，然后代码继续执行。\n\
  \nParallelFor 示例程序可以在本书的网站上下载，它使用以下代码计算斐波那契数。\n\n```csharp\n// Use recursion (the\
  \ slow way) to calculate Fibonacci(N).\nprivate long Fibonacci(long N)\n{\n    if\
  \ (N <= 1) return 1;\n    return Fibonacci(N - 1) + Fibonacci(N - 2);\n}\n```\n\n\
  这段代码仅实现了以下斐波那契数的递归定义：\n\n$F[0] = 1$\n$F[1] = 1$\n$F[N] = F[N-1] + F[N-2]$\n\n这不是计算斐波那契数最高效的方法。此示例使用它是因为它简单且足够慢，足以展示多线程的益处。\n\
  \n程序使用以下代码同时计算四个斐波那契数。\n\n```csharp\n// Arrays for holding N and results.\nlong[]\
  \ Numbers = new long[4];\nlong[] Results = new long[4];\n\n// Calculate a Fibonacci\
  \ number and save it in Results.\nvoid FindFibonacci(int index)\n{\n    Results[index]\
  \ = Fibonacci(Numbers[index]);\n}\n\n// Use Parallel.For to calculate Fibonacci\
  \ numbers in parallel.\nNumbers[0] = 0;\nNumbers[1] = 1;\nNumbers[2] = 2;\nNumbers[3]\
  \ = 3;\n\nParallel.For(0, 4, FindFibonacci);\n```\n\n\n\n\n\n`Parallel.For` 方法调用一个方法，并向其传递起始值和结束值之间的值。这类似于\
  \ `for` 循环的工作原理，假设该循环使用简单的整数作为循环变量。\n\n`Parallel.ForEach` 方法类似于 `foreach` 循环。它同样会在不同的线程中多次调用某个方法。`Parallel.ForEach`\
  \ 不是在每次调用时向方法传递不同的整数值，而是从某种对象组中向方法传递不同的项。\n\n`ParallelForEach` 示例程序可以在本书的网站下载，它使用这种技术来并行计算斐波那契数。\n\
  \n由于 `Parallel.ForEach` 将从集合中的项传递给方法，因此示例程序必须创建某种类型的项来存储斐波那契数计算的信息。此示例使用以下简单类来存储这些信息。\n\
  \n```\nprivate class FibInfo\n{\n    public long N, Result;\n}\n```\n\n`N` 字段存储要计算的斐波那契数的索引。当程序执行计算时，它将斐波那契数存储在对象的\
  \ `Result` 字段中。\n\n以下代码显示了示例中版本的 `FindFibonacci` 方法。\n\n```\nprivate void FindFibonacci(FibInfo\
  \ info)\n{\n    info.Result = Fibonacci(info.N);\n}\n```\n\n此方法接受一个 `FibInfo` 对象作为参数。它调用\
  \ `Fibonacci` 方法（该方法与 `ParallelFor` 示例程序使用的版本相同），并传递 `FibInfo` 对象的 `N` 字段。它将结果存储在对象的\
  \ `Result` 字段中。\n\n以下代码显示了程序中使用 `Parallel.ForEach` 的部分。\n\n```c\n// 保存数字 N。\nFibInfo[]\
  \ infos = new FibInfo[4];\nfor (int i = 0; i < OutputTextBoxes.Length; i++)\n{\n\
  \    infos[i] = new FibInfo() { N = long.Parse(InputTextBoxes[i].Text) };\n}\n\n\
  // 计算。\nParallel.ForEach(infos, FindFibonacci);\n\n// 显示结果。\nfor (int i = 0; i <\
  \ OutputTextBoxes.Length; i++)\n{\n    OutputTextBoxes[i].Text = infos[i].Result.ToString();\n\
  }\n```\n\n该代码创建一个 `FibInfo` 对象数组，并根据 `InputTextBoxes` 数组中 `TextBox` 的值设置其 `N` 字段。（该数组在程序启动时初始化。）\n\
  \n代码随后调用 `Parallel.ForEach`，并传递 `FibInfo` 对象数组以及它应该调用的 `FindFibonacci` 方法。\n\n代码随后在\
  \ `OutputTextBoxes` 数组的 `TextBox` 中显示结果（该数组同样在程序启动时初始化）。\n\n### Parallel.Invoke\n\
  \n`Parallel.For` 和 `Parallel.ForEach` 方法为不同的参数调用同一个委托。有时，你可能想要调用多个不同的方法。`Parallel.Invoke`\
  \ 方法允许你这样做。只需为该方法传递一个或多个要执行的操作委托（action delegates）即可。\n\n`ParallelInvoke` 示例程序可以在本书的网站下载，它使用以下代码并行计算四个斐波那契值。\n\
  \n```csharp\nParallel.Invoke(\n    FindFibonacci0,\n    FindFibonacci1,\n    FindFibonacci2,\n\
  \    FindFibonacci3\n);\n```\n\n以下代码显示了 `FindFibonacci0` 方法。\n\n```c\nprivate void\
  \ FindFibonacci0()\n{\n    Results[0] = Fibonacci(Numbers[0]);\n}\n```\n\n其他方法也类似。\n\
  \n### 任务\n\n`System.Threading.Tasks.Task` 类允许你创建线程并异步运行它们。如果系统有多个 CPU，那么 `Task`s\
  \ 可能会同时运行。\n\n下表总结了 `Task` 类最有用的属性。\n\n| **属性** | **用途** |\n| :--- | :--- |\n| `Exception`\
  \ | 返回一个 `AggregateException` 对象，包含任何导致 `Task` 提前结束的异常信息。 |\n| `Factory` | 提供对 `TaskFactory`\
  \ 类方法的访问权限，你可以使用这些方法来创建 `Task`。（稍后会详细解释。） |\n| `IsCanceled` | 如果 `Task` 被取消，则返回\
  \ `true`。 |\n| `IsCompleted` | 如果 `Task` 已完成处理，则返回 `true`。 |\n| `IsFaulted` | 如果\
  \ `Task` 因为未处理的异常而停止，则返回 `true`。 |\n| `Status` | 返回 `Task` 的状态。可以是 `Canceled`、`Created`、`Faulted`、`RanToCompletion`、`Running`、`WaitingForActivation`、`WaitingForChildrenToComplete`\
  \ 或 `WaitingToRun` 之一。 |\n\n下表列出了 `Task` 类最有用的方法。\n\n| **方法** | **用途** |\n| :---\
  \ | :--- |\n| `ConfigureAwait` | 配置一个“等待者”对象，你可以配合 `await` 关键字使用它等待 `Task` 完成。 |\n\
  | `ContinueWith` | 创建一个在目标 `Task` 完成时执行的延续 `Task`。 |\n| `Delay` | 创建一个在指定时间后完成的\
  \ `Task`。 |\n| `Run` | 此静态方法创建一个 `Task` 并将其排入队列开始运行。（这基本上是 `Task.Factory.StartNew`\
  \ 的简化版本，将在本节稍后部分进行描述。） |\n| `RunSynchronously` | 同步运行 `Task`。 |\n| `Start` | 启动之前创建的\
  \ `Task`。 |\n| `Wait` | 等待 `Task`。 |\n| `WaitAll` | 此静态方法等待集合中的所有 `Task` 完成。 |\n\
  | `WaitAny` | 此静态方法等待集合中的任意一个 `Task` 完成。 |\n| `WhenAll` | 创建一个在所有指定的 `Task` 完成后完成的\
  \ `Task`。 |\n| `WhenAny` | 创建一个在指定的任意一个 `Task` 完成后完成的 `Task`。 |\n\n有几种方法可以创建并启动\
  \ `Task`。首先，你可以使用 `Task` 构造函数创建一个 `Task`，然后调用它的 `Start` 方法来启动。\n\n其次，你可以使用 `TaskFactory`\
  \ 对象。`Task` 类的 `Factory` 方法返回一个 `TaskFactory` 对象，你可以用它创建不同类型的 `Task`。`StartNew`\
  \ 方法在一个步骤中创建并启动 `Task`。该方法有许多重载版本，允许你指定各种选项。\n\n第三，调用 `Run`。除了 `StartNew` 方法外，`TaskFactory`\
  \ 类还提供了两种创建在其他 `Task`完成后启动的延续 `Task` 方法。`ContinueAll` 方法创建一个在所有 `Task` 完成后启动的 `Task`。`ContinueAny`\
  \ 方法创建一个在任意一个 `Task` 完成后启动的 `Task`。\n\n`FiboTasks` 示例程序演示了使用 `Task` 的较为繁琐的方法。以下代码显示了程序如何创建四个任务并等待它们完成。\n\
  \n```csharp\n// 四个任务。\nTask task0 = new Task(Fibonacci, 0);\ntask0.Start();\nTask\
  \ task1 = new Task(Fibonacci, 1);\ntask1.Start();\nTask task2 = new Task(Fibonacci,\
  \ 2);\ntask2.Start();\nTask task3 = new Task(Fibonacci, 3);\ntask3.Start();\n\n\
  // 等待任务完成。\ntask0.Wait();\ntask1.Wait();\ntask2.Wait();\ntask3.Wait();\n```\n\n\
  程序的其余部分与早期章节“TPL”中描述的斐波那契示例相似。\n\n## 线程\n\n`System.Threading.Thread` 类比本章描述的其他技术提供了更多的线程控制权。然而，使用线程更为复杂，因此通常应该先尝试其他方法。在大多数情况下，`Task`\
  \ 对象是线程更好的选择。\n\n下表列出了 `Thread` 类最有用的属性。\n\n| **属性** | **含义** |\n| :--- | :--- |\n\
  | `IsAlive` | 如果线程已启动且未结束或终止，则返回 `true`。 |\n| `IsBackground` | 确定线程是否为后台线程。 |\n\n\
  \n\n\n\n| `Priority` | 决定线程的优先级。可以是 `Highest`、`AboveNormal`、`Normal`、`BelowNormal`\
  \ 或 `Lowest`。 |\n| `ThreadState` | 返回线程的状态。可以是值 `Aborted`、`AbortRequested`、`Background`、`Running`、`Stopped`、`StopRequested`、`Suspended`、`SuspendRequested`、`Unstarted`\
  \ 和 `WaitSleepJoin` 的组合。 |\n\n下表列出了 `Thread` 类常用的方法。\n\n| Method | Purpose |\n|\
  \ :--- | :--- |\n| `Abort` | 在线程上抛出 `ThreadAbortException` 以终止。 |\n| `Join` | 阻塞调用方法的线程直到该线程终止。（这是程序通常等待线程完成的方式。）\
  \ |\n| `ResetAbort` | 取消当前线程的 `Abort` 操作。 |\n| `Sleep` | 此静态方法使线程挂起指定的时间。 |\n| `Start`\
  \ | 启动线程。 |\n| `Yield` | 如果有就就绪绪，则让出执行权。 |\n\n使用简单线程通常涉及以下步骤：\n\n1. 创建 `Thread`\
  \ 对象。\n2. 调用 `Start` 方法启动线程。\n3. 要停止线程，调用其 `Abort` 方法。\n4. 要等待线程，调用其 `Join` 方法。\n\
  \n创建和管理 `Thread` 会产生一些开销，因此，只有当你有多个想要在多个 CPU 上运行的大型计算时，才应该使用 `Thread`。\n\n## 协调任务\n\
  \n本章目前为止的所有示例都是为了确保成功而编写的。并行运行的每个计算只处理自己的数据，并且绝不会尝试查看其他计算使用的数据。每个计算都使用 `InvokeRequired`\
  \ 和 `Invoke` 来安全地与 UI 线程交互。\n\n如果你能按照这种方式安排计算，使它们互不干扰，那么并发编程就相对简单。遗憾的是，在某些应用程序中，不同的计算必须访问相同的资源。在这种情况下可能会可能会多种冲突。其中最常见的两种是竞态条件和死锁。\n\
  \n### 竞态条件\n\n当两个并发计算尝试在近似的时间读取并更新同一个值时，就会发生竞态条件。例如，假设线程 A 和 B 分别执行随机搜索，试图为某个困难问题找到最佳解决方案。当它们完成计算时，必须检查变量\
  \ `BestSolution` 并在发现更好的解决方案（一个更大的整数）时更新它。\n\n以下代码显示了线程在 C# 中如何执行此操作。\n\n```\nif\
  \ (mySolution > BestSolution)\n{\n    BestSolution = mySolution;\n}\n```\n\n对于此示例，假设\
  \ `BestSolution` 初始值为 10，线程 A 找到了一个值为 15 的解决方案，线程 B 找到了一个值为 20 的解决方案。现在考虑下表所示的事件序列。\n\
  \n| Thread A Steps | Thread B Steps |\n| :--- | :--- |\n| 获取 `BestSolution` 值 (10)\
  \ | |\n| | 获取 `BestSolution` 值 (10) |\n| | 20 > 10，所以设置 `BestSolution` = 20 |\n\
  | 15 > 10，所以设置 `BestSolution` = 15 | |\n\n线程开始执行并获取 `BestSolution` 的值，初始值为 10。\n\
  \n系统随后将执行切换到线程 B。线程 B 获取 `BestSolution` 的值，此时仍为 10。线程 B 将其解决方案值 20 与 `BestSolution`\
  \ 进行比较。因为 20 > 10，线程 B 的解决方案是改进的，因此它保存了自己的解决方案并将 `BestSolution` 设置为 20。\n\n接下来，系统将执行切换回线程\
  \ A。线程 A 将其解决方案值 15 与它保存的 `BestSolution` 值（10）进行比较。因为 15 > 10，线程 A 认为它的解决方案是改进的，因此它将\
  \ `BestSolution` 更新为 15。\n\n在这个示例中，线程 B 拥有更好的解决方案，但线程 A 覆盖了线程 B 的解决方案。线程 A 通过后设置其值“赢”了竞态。\n\
  \n你可以通过确保关键步骤序列以原子方式执行来避免竞态条件。在这个示例中，如果每个线程都原子地读取和更新变量 `BestSolution`，另一个线程就无法干扰并导致竞态条件。\n\
  \n你可以使用 `lock` 语句来防止竞态条件。`lock` 语句将某个区域标记为关键区域，该区域不会被其他并发执行路径中断。\n\n`lock` 语句使用对象的实例来标记该区域。当线程进入该区域时，它获取该对象的排斥锁。在线程完成并释放锁之前，其他线程无法锁定该对象，因此它们无法进入类似的关键区域。\n\
  \n以下代码显示了你如何修改前面的代码以使用 `lock` 语句。\n\n```\n// 创建并初始化 BestSolution。\nprivate int BestSolution\
  \ = 10;\n\n// 创建锁对象。\nprivate object UpdateLock = new object();\n\n...\n\n// 线程\
  \ A 更新 BestSolution\nlock (UpdateLock)\n{\n    if (mySolution > BestSolution)\n\
  \    {\n        BestSolution = mySolution;\n    }\n}\n```\n\n### 死锁\n\n死发生在发生在或多个线程都在等待由其他线程持有的资源时。例如，假设线程\
  \ A 和 B 都需要访问 M 和 N。资源可能是线程需要锁定的文件、必须在关键区域访问的变量或其他任何必须排斥性访问的内容。\n\n现在假设线程 A 锁定了\
  \ M，线程 B 锁定了 N。线程 A 因为无法获取 N 而阻塞，线程 B 因为无法获取 M 而阻塞。两者陷入了死锁，无法继续。\n\n两个线程可以按相同的顺序尝试锁定资源。当它们都尝试锁定\
  \ M 时，一个成功了，另一个在等待。成功的那个随后可以锁定 N 并继续。当该线程完成后，它会释放锁，另一个线程就可以锁定两个资源并继续。\n\n如果可能，你应该构造代码以使死锁变得不可能。在示例中这很难。如果你有许多由不同程序员编写的线程尝试以不同的顺序更新一组对象，有时很难判断是否会发生死锁。\n\
  \n打破死锁的一种方法是对可能引起问题的操作使用超时。例如，`Monitor` 类的 `TryEnter` 方法尝试获取对象的排斥锁，就像 `lock` 语句做的那样，但\
  \ `TryEnter` 方法还允许你指定超时时间。如果方法获取了锁，它返回 `true`。如果方法超时，它返回 `false`。\n\n当线程完成关键区域时，应该调用\
  \ `Monitor` 类的 `Exit` 方法来释放对锁对象的锁。\n\n以下代码显示了线程如何尝试进入可能与其它线程导致死锁的关键代码段。\n\n```\n\
  // 创建锁对象。\nprivate object UpdateLock = new object();\n...\n// 尝试锁定锁对象。\nif (Monitor.TryEnter(UpdateLock,\
  \ 500))\n{\n    try\n    {\n        // 关键代码在此处 ...\n    }\n    finally\n    {\n\
  \        Monitor.Exit(UpdateLock);\n    }\n}\nelse\n{\n    // 如果超时则执行某些操作。\n}\n\
  ```\n\n\n\n\n代码像之前一样创建了锁对象 `UpdateLock`。随后，它使用 `Monitor.TryEnter` 尝试进入代码的关键区域。如果\
  \ `TryEnter` 成功，线程将进入临界区域并对资源执行任何所需的的操作。`try finally` 块中的 `finally` 部分确保代码在完成临界区域的操作后调用\
  \ `Monitor.Exit`。\n\n如果 `TryEnter` 调用返回 `false`，则表示线程超时且未能获取锁。在这种情况下，代码应该执行某些操作来恢复，可能尝试重新获取锁。\n\
  \n下表列出了最常用的 `Monitor` 类方法。\n\n| 方法 | 目的 |\n| :--- | :--- |\n| `Enter` | 获取对象的独排斥锁。\
  \ |\n| `Exit` | 释放对象的独排斥锁。 |\n| `IsEntered` | 如果当前线程拥有特定对象的锁，则返回 `true`。 |\n| `TryEnter`\
  \ | 尝试获取对象的独排斥锁。 |\n| `Wait` | 释放对象的锁，然后阻塞，直到重新获取对该对象的锁。如果线程需要允许另一个线程在继续之前执行某些操作，则这种方法非常有用。\
  \ |\n\n## 线程安全对象\n\n如果一个对象与该类或其他类的其他对象同时在不同的线程上运行是安全的，那么该对象就是线程安全的。例如，在之前描述的竞争条件示例中，在线程\
  \ A 和 B 中运行的对象不是线程安全的，因为它们试图以一种不安全的方式读取和更新同一个变量。\n\n如果一个类只访问自己的实例变量，且没有其他类访问这些变量，那么它就是线程安全的。\n\
  \n在某个时刻，大多数线程都需要以某种方式从主程序获取信息或向主程序发送结果。为了确保线程安全，你需要确保这些操作是安全执行的。如果每个线程仅通过分配给自己的变量与主程序进行交互，那么只要主程序不干涉这些变量，它们就是安全的。\n\
  \n如果多个线程（包括主程序的线程）需要操作相同的变量，你应该使用锁定机制来协调它们。\n\n如果你在编写类时足够小心，以确保对象在其他线程上运行时不会互相互干扰，那么编写自己的线程安全类并不困难。某些程序员忽略的一种情况是：他们的类使用了了另一个不是线程安全的类。\n\
  \n例如，`List<>` 类不是线程安全的。这意味着如果两个线程尝试在同一个 `List<>` 中共享信息，它们可能会导致竞争条件。\n\n`System.Collections.Concurrent`\
  \ 命名空间定义了几个线程安全的集合类。下表列出了这些并发类。\n\n| 集合 | 目的 |\n| :--- | :--- |\n| `BlockingCollection<T>`\
  \ | 线程安全的集合。 |\n| `ConcurrentDictionary<TKey,TValue>` | 线程安全的字典类。 |\n| `ConcurrentQueue`\
  \ | 线程安全的队列。 |\n| `ConcurrentStack` | 线程安全的栈。 |\n| `ConcurrentBag` | 线程安全的包（无序对象集合）。\
  \ |\n\n## 总结\n\n本章解释了几个用于执行不同并行任务的类。`BackgroundWorker` 组件执行任务并使用事件返回进度和完成信息。如果你将其\
  \ `WorkerSupportsCancellation` 属性设置为 `true`，程序可以在工作线程完成之前中断它。\n\nTPL 提供了许多方法让你轻松执行并行操作并等待它们完成。`Task`\
  \ 类允许你同时执行多个任务，比 `BackgroundWorker` 或 TPL 具有更大的灵活性。最后，`Thread` 类提供了更多的选项和灵活性；尽管它比\
  \ `Task` 类更复杂。\n\n这些类允许你编写独立执行操作的程序。将每个操作单独处理通常比你尝试在单段代码中处理每个操作使代码更简单。如果计算机有多个 CPU，这些类还允许你真正地并行运行代码段。\n\
  \n并行编程是一个巨大的课题，本章仅触山一角。关于并行编程的更多信息，请查找关于该主题的良书或搜索互联网。你可以从以下链接开始：\n\n*   “Parallel\
  \ Programming in the .NET Framework”位于 [`msdn.microsoft.com/library/dd460693.aspx`](http://msdn.microsoft.com/library/dd460693.aspx)\n\
  *   “Parallel Programming with .NET blog”位于 [`blogs.msdn.com/b/pfxteam`](http://blogs.msdn.com/b/pfxteam)\n\
  \n如果程序是 CPU 密集型的，并行编程有时可以让程序运行更快。将计算分布在多个 CPU 上可以提高性能。然而，如果程序受限于 CPU 算力以外的资源，这种方法将不起作用。\n\
  \n例如，如果程序大部分时间都花在读写磁盘上，多个执行线程可能不会显著提高性能。数据库应用程序通常在这方面受限于磁盘。程序大部分时间都花在等待用户输入或对数据库读写数据上。下一章将介绍\
  \ ADO.NET，这是你可以用 C# 编写数据库程序的工具之一。\n\n## 练习\n\n1.  `System.Threading.Timer` 类提供了一个类似于\
