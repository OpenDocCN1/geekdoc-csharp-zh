  3. 从 `TextBox` 获取文本并将其转换为小写。\n4. 使用正则表达式移除文本中的句号和逗号。\n5. 使用 `string.Split` 使用空格、`\\\
  r` 和 `\\n` 作为单词分隔符将文本拆分为单词，并移除空项。\n\n以下代码显示了你可以使用的两种创建随机植物名称和光照值的方法。\n\n```\n//\
