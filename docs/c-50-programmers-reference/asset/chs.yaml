  \        **图 23-10:** 选择你希望适配器用于访问数据库的方法。\n    3.  在向导的下一页（显示在图 23-11\n        **图\
  \ 23-11:** 输入 SQL 选择语句，或点击查询生成器并使用查询生成器创建选择语句。\n    4.  在输入 SQL 选择语句后，你可以点击“完成”来完成数据适配器的创建，或者点击“下一步”查看显示在图\
  \ 23-12 中的摘要。在这种情况下，摘要表示向导配置了适配器，为其提供了修改数据所需的工具。查看摘要后，点击“完成”创建数据适配器并关闭向导。\n    5.\
  \  使用属性窗口将新数据适配器的名称更改为`studentsDataAdapter`![c23f012.tif](img/c23f012.png)\n   \
  \     **图 23-12:** 数据适配器配置向导的摘要屏幕告诉向在创建数据适配器时将做什么。\n4.  重复之前的步骤，为 `TestScores` 表创建一个名为\
  \ `testScoresDataAdapter` 的数据适配器。\n5.  向表单添加一个 `DataSet`。\n    1.  展开工具箱的“数据”（Data）部分，双击\
  \ `DataSet` 工具。\n    2.  在显示在图 23-13 中的“添加数据集”对话框中，点击“类型化数据集”（Typed dataset）选项，选择你在创建原始数据源时创建的\
  \ `DataSet` 类型，并点击确定。![c23f013.tif](img/c23f013.png)\n        **图 23-13:** 使用添加数据集对话框创建\
  \ `DataSet` 实例。\n6.  创建 `DataGrid` 控件。\n    1.  在工具箱的“常规”部分，双击 `DataGrid` 控件。\n\
  \    2.  按照你的意安排控件，例如将其停靠以填充表单或设置其 `Anchor` 属性。\n    3.  在属性窗口中，选择 `DataGrid` 的\
  \ `DataSource` 属性并打开下拉列表，如图 23-14 所示。展开下拉选项直到找到 `DataSet` 并选择它。（这实际上是将 `DataSource`\
  \ 设置为 `DataSet` 的新绑定源，而不是 `DataSet` 本身。这只是控件与 `DataSet` 之间的另一层级。）![c23f014.tif](img/c23f014.png)\n\
  \        **图 23-14:** 使用属性窗口设置 `DataGrid` 的 `DataSource` 属性。\n7.  为表单提供 `Load` 事件处理器并为其添加以下代码。\n\
