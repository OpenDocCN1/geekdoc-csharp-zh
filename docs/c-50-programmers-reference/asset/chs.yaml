  \ 和 `File` 类提供了静态方法，你可以使用这些方法在不创建辅助对象实例的情况下操作文件系统。例如，`Directory` 类的 `Delete` 方法允许你删除目录而无需创建与目录关联的\
  \ `DirectoryInfo` 对象。\n\n接下来的章节描述了这些类以及 .NET Framework 提供的帮助你操作文件系统的其他类。\n\n###\
