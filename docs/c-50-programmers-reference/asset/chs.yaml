  \ `ListBox` 的 `DataSource` 属性设置为生成的数组。\n\n### 4. `CarList` 示例程序使用以下代码来创建和初始化它的列表。通过此代码查看它是如何工作的。\n\
  \n### 5. `ReverseList` 示例程序使用以下代码创建并初始化它的反转列表。\n\n```csharp\n// 。\nprivate void\
  \ Form1_Load(object sender, EventArgs e)\n{\n    // 原始列表。\n    List<char> original\
  \ = new List<char>() { 'A', 'B', 'C', 'D', 'E' };\n    originalListTextBox.Text\
  \ = new string(original.ToArray());\n\n    // LINQ。\n    var linq =\n        from\
  \ letter in original\n        orderby letter\n        select letter;\n    linqTextBox.Text\
  \ = new string(linq.ToArray());\n\n    // 反转。\n    List<char> reversed = new List<char>(original);\n\
  \    reversed.Reverse();\n    reverseTextBox.Text = new string(reversed.ToArray());\n\
  \n    // 栈。\n    Stack<char> stack = new Stack<char>();\n\n    // 将字符添加到栈中。\n  \
  \  foreach (char ch in original) stack.Push(ch);\n\n    // 从栈中移除字符。\n    List<char>\
  \ result = new List<char>();\n    while (stack.Count > 0) result.Add(stack.Pop());\n\
  \n    // 显示结果。\n    stackTextBox.Text = new string(result.ToArray());\n}\n```\n\n\
  ### 6. 返回集合的方法与迭代器类似，你可以使用 `foreach` 循环来枚举返回的项。\n\n区别在于，返回集合的方法需要在 `foreach` 循环开始之前生成所有项。相比之下，迭代器在需要时生成项。如果程序在停止之前不知道必须检查多少项，这可以节省一些工作。例如，假设程序必须遍历对象直到找到一个尚未在本周工作过的。它可以退出\
  \ `foreach` 循环。\n\n### 7. `ListPrimes` 示例程序执行此操作。它使用以下 `Primes` 迭代器。\n\n```csharp\n\
  // 在 startNumber 和 stopNumber 之间的质数。\npublic IEnumerable Primes(int startNumber,\
  \ int stopNumber)\n{\n    // 定义一个 lambda 方法来测试\n    // 至少为 3 的奇数的质数性。\n    Func<int,\
  \ bool> isPrime = x =>\n    {\n        for (int i = 3; i * i <= x; i += 2)\n   \
  \         if (x % i == 0) return false;\n        return true;\n    };\n\n    //\
  \ 如果 2 在 startNumber 和 stopNumber 之间，则返回 2。\n    if ((2 >= startNumber) && (2 <=\
  \ stopNumber)) yield return 2;\n\n    // 使 startNumber 为正数且奇数。\n    if (startNumber\
  \ < 3) startNumber = 3;\n    if (startNumber % 2 == 0) startNumber++;\n\n    //\
  \ 遍历范围内的奇数。\n    for (int i = startNumber; i <= stopNumber; i += 2)\n    {\n   \
  \     // 如果这个数字是质数，枚举它。\n        if (isPrime(i)) yield return i;\n    }\n}\n```\n\
  \n程序使用以下代码来显示质数。\n\n```csharp\n// 列出两个数字之间的质数。\nprivate void listPrimesButton_Click(object\
  \ sender, EventArgs e)\n{\n    int startNumber = int.Parse(startNumberTextBox.Text);\n\
  \    int stopNumber = int.Parse(stopNumberTextBox.Text);\n\n    primesListBox.Items.Clear();\n\
  \    foreach (int i in Primes(startNumber, stopNumber))\n        primesListBox.Items.Add(i);\n\
  }\n```\n\n### 8. `ListAllPrimes` 示例程序执行此操作。它使用以下 `AllPrimes` 迭代器。\n\n\n\n\n\n```cs\n\
  // 无限地枚举质数。\npublic IEnumerable AllPrimes()\n{\n    // 定义一个 lambda 方法来测试\n    //\
  \ 至少为 3 的奇数的质数性。\n    Func<int, bool> isPrime = x =>\n    {\n        for (int i\
  \ = 3; i * i <= x; i += 2)\n            if (x % i == 0) return false;\n        return\
  \ true;\n    };\n\n    // 返回 2。\n    yield return 2;\n\n    // 遍历奇数。\n    for (int\
  \ i = 3; ; i += 2)\n    {\n        // 如果这个数是质数，则枚举它。\n        if (isPrime(i)) yield\
  \ return i;\n    }\n}\n```\n\n主程序使用以下代码列出质数。\n\n```cs\n// 列出两个数字之间的质数。\nprivate\
