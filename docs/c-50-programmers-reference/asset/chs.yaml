  \ foreach (int i in AllPrimes())\n    {\n        if (i > stopNumber) break;\n  \
  \      primesListBox.Items.Add(i);\n    }\n}\n```\n\n# 第 15 章\n\n### 1. `PriorityQueue`\
  \ 示例程序执行这些操作。程序中最感兴趣的部分是下面的 `PriorityQueue` 类。\n\n```cs\npublic class PriorityQueue<TKey,\
  \ TValue>\n    where TKey : IComparable<TKey>\n{\n    // 用于保存键和值的列表。\n    List<KeyValuePair<TKey,\
  \ TValue>> List =\n        new List<KeyValuePair<TKey, TValue>>();\n\n    // 向队列中添加一个项。\n\
  \    public void Enqueue(TKey key, TValue value)\n    {\n        List.Add(new KeyValuePair<TKey,\
  \ TValue>(key, value));\n    }\n\n    // 从队列中移除一个项。\n    public void Dequeue(out\
  \ TKey key, out TValue value)\n    {\n        if (List.Count == 0)\n           \
  \ throw new InvalidOperationException(\"PriorityQueue is empty\");\n\n        //\
  \ 找到键值最低的项。\n        int bestIndex = 0;\n        TKey bestKey = List[0].Key;\n \
  \       for (int index = 1; index < List.Count; index++)\n        {\n          \
  \  // 检查此键是否小于之前的最佳键。\n            TKey testKey = List[index].Key;\n           \
  \ if (testKey.CompareTo(bestKey) < 0)\n            {\n                // 保存此键。\n\
  \                bestIndex = index;\n                bestKey = testKey;\n      \
  \      }\n        }\n\n        // 返回最佳对。\n        key = bestKey;\n        value\
  \ = List[bestIndex].Value;\n\n        // 移除我们正在返回的配对。\n        List.RemoveAt(bestIndex);\n\
  \    }\n\n    // 返回列表中项的数。\n    public int Count\n    {\n        get { return List.Count;\
  \ }\n    }\n}\n```\n\n该类的声明包含了程序将存储的键和值的泛型类型参数。为了找到值最低的键，类必须比较键，因此 `TKey` 类型必须实现\
  \ `IComparable<TKey>`。\n\n该类使用 `List<KeyValuePair<TKey, TValue>>` 来持有键和值。`Enqueue`\
  \ 方法简单地将新的 `KeyValuePair` 对象添加到列表中。\n\n`Dequeue` 方法遍历列表以找到键最低的配对。它设置了其返回值，然后从列表中移除了该配对。\n\
  \n`PriorityQueue` 类的 `Count` 属性返回列表中项的数。示例程序使用该属性来确定列表何时为空，因此 Dequeue 按钮应该是禁用的。\n\
  \n下载示例以查看其他细节。\n\n### 2. `IncreasingQueue` 示例程序执行这些操作。下面的代码显示了 `IncreasingQueue`\
  \ 类。\n\n```cs\npublic class IncreasingQueue<T>\n    where T : IComparable<T>\n{\n\
  \    // 持有项的队列。\n    private Queue<T> Items = new Queue<T>();\n\n    // 上一个添加的项。\n\
  \    private T LastValue;\n\n    // 构造函数。\n    public IncreasingQueue(T lowerBound)\n\
  \    {\n        LastValue = lowerBound;\n    }\n\n    // 入队。\n    public void Enqueue(T\
  \ value)\n    {\n        // 如果不是第一个项，确保\n        // 它比上一个值大。\n        if (value.CompareTo(LastValue)\
  \ <= 0)\n            throw new ArgumentOutOfRangeException(\"value\",\n        \
  \        \"New value was not larger than the previous value\");\n\n        // 添加项。\n\
  \        Items.Enqueue(value);\n\n        // 保存此值。\n        LastValue = value;\n\
  \    }\n\n    // 出队。\n    public T Dequeue()\n    {\n        return Items.Dequeue();\n\
  \    }\n\n    // 返回项的数。\n    public int Count\n    {\n        get { return Items.Count;\
  \ }\n    }\n}\n```\n\n该类接受一个泛型类型参数。与之前的示例一样，此程序需要比较项，因此类型 `T` 必须实现 `IComparable<T>`。\n\
  \n该类首先声明一个 `Queue<T>` 来持有队列的项。然后它声明了变量 `LastValue` 来跟踪最后添加到队列的值。\n\n该类的构造函数将 `LastValue`\
  \ 设置为接收到的下界值。\n\n`Enqueue` 方法执行大部分工作。它将新值与最后添加到队列的值进行比较，如果新值不大，则抛出异常。如果新值是正确的，则将其加入队列并更新\
  \ `LastValue`。\n\n类的其余部分将 `Dequeue` 方法和 `Count` 属性委托给内部队列。\n\n下载示例以查看其他细节。\n\n###\
  \ 3. 下面的代码显示了可能的 `BoundValues` 方法。\n\n```cs\npublic static class NumberMethods\n\
  {\n    // 确保所有值都在下界和上界之间。\n    public static void BoundValues<T>(T[] values, T lowerBound,\
  \ T upperBound)\n        where T : IComparable<T>\n    {\n        for (int i = 0;\
  \ i < values.Length; i++)\n        {\n            if (values[i].CompareTo(lowerBound)\
  \ < 0)\n                values[i] = lowerBound;\n            if (values[i].CompareTo(upperBound)\
  \ > 0)\n                values[i] = upperBound;\n        }\n    }\n}\n```\n\n注意\
  \ `NumberMethods` 类不是泛型的，但 `BoundValues` 方法是。该方法遍历数组，将超出范围的值设置为上界或下界。\n\n### 4.\
  \ 下面的代码显示了可能的 `BoundValues` 方法。\n\n```cs\npublic static class NumberMethods\n{\n\
  \    // 确保所有值都在下界和上界之间。\n    public static List<T> BoundValues<T>(IEnumerable<T>\
  \ values,\n        T lowerBound, T upperBound)\n        where T : IComparable<T>\n\
  \    {\n        List<T> result = new List<T>();\n        foreach (T value in values)\n\
  \        {\n            if (value.CompareTo(lowerBound) < 0)\n                result.Add(lowerBound);\n\
  \            else if (value.CompareTo(upperBound) > 0)\n                result.Add(upperBound);\n\
  \            else\n                result.Add(value);\n        }\n        return\
  \ result;\n    }\n}\n```\n\n这段代码创建了一个 `List<T>`。然后对于 `IEnumerable<T>` 中的每个项，它将项、下界或上界之一添加到结果列表中。在完成循环后，方法返回列表。\n\
