  \         Debug.Assert(value != null, \"Courses list must not be null\");\n    \
  \        _Courses = value;\n        }\n    }\n\n    // Constructor.\n    public\
  \ Student(string name)\n    {\n        Name = name;\n    }\n}\n```\n注意，构造函数不需要进行任何验证，因为它使用了\
  \ `Name` 属性来设置对象的名称，而该属性执行了验证。（你可以在本章下载的 `StudentTest` 示例程序中找到这段代码。）\n\n## 2. 以下代码显示了修改后的类。\n\
  \n```csharp\npublic class Student\n{\n    private string _Name;\n    public string\
  \ Name\n    {\n        get { return _Name; }\n        set\n        {\n         \
  \   Contract.Requires(value != null, \"Name must not be null\");\n            Contract.Requires(value.Length\
  \ > 0, \"Name must have non-zero length\");\n            Contract.Ensures(_Name\
  \ != null, \"Name must not be null\");\n            Contract.Ensures(_Name.Length\
  \ > 0, \"Name must have non-zero length\");\n            _Name = value;\n      \
  \  }\n    }\n\n    private List<Course> _Courses = new List<Course>();\n    public\
  \ List<Course> Courses\n    {\n        get { return _Courses; }\n        set\n \
  \       {\n            Contract.Requires(value != null, \"Courses list must not\
  \ be null\");\n            Contract.Ensures(_Courses != null, \"Courses list must\
  \ not be null\");\n            _Courses = value;\n        }\n    }\n\n    // Constructor.\n\
  \    public Student(string name)\n    {\n        Name = name;\n    }\n}\n```\n你可以移除后置条件吗？当然，可以。前置条件保证了后置条件的满足。这种思维恰会让开发者假设他们的代码是正确的，而实际上却并非。这也是为什么在编写方法之前先编写契约是好的。了解了这些\
  \ `set` 访问器的作用后，你就可以说服自己后置条件是不必要的。在非平凡的方法中，同样的压力可能会导致你忽略它们。注意，后置条件与前置条件并不完全相同。前置条件测试访问器的输入（如果访问器做出了某些假设，前置条件也会验证这些假设），而后置条件则检查想要的结果。（你可以在本章下载的\
  \ `StudentTest` 示例程序中找到这段代码。）\n\n## 3. 以下代码显示了修改后的类。\n\n```csharp\npublic class\
