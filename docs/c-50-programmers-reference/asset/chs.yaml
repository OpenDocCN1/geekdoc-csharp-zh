  \        testScoresDataAdapter.Update(schoolDataDataSet1.TestScores);\n    }\n \
  \   ```\n    此代码使数据适配器将 `DataSet` 中的任何更改保存回数据库。\n    图 23-15 显示了完成后的程序。你可以点击链接从\
  \ `Students` 记录导航到 `TestScores` 表中对应的记录。\n\n    ![c23f015.tif](img/c23f015.png)\n\
  \n\n\n\n\n在表单的 `Load` 事件处理器加载数据后，程序可以使用 `DataSet` 及其包含的表来检查数据。例如，你可以使用在第 8 章中描述的\
  \ LINQ to DataSet 技术从 `DataSet` 中选择数据并显示结果。\n\n`ListStudentNames` 程序可以在本书的网站上下载，它使用\
  \ `DataSet` 和数据适配器来加载 `SchoolData.accdb` 数据库中的 `Students` 表。它使用以下代码来加载并显示学生的姓名。\n\
  \n```csharp\nprivate void Form1_Load(object sender, EventArgs e)\n{\n    // 加载数据。\n\
  \    studentsDataAdapter.Fill(schoolDataDataSet1);\n\n    // 显示学生姓名。\n    ListStudents();\n\
  }\n\n// 列出学生。\nprivate void ListStudents()\n{\n    studentsListBox.Items.Clear();\n\
  \n    // 显示学生姓名。\n    foreach (DataRow row in schoolDataDataSet1.Students.Rows)\n\
  \    {\n        string name =\n            row.Field<string>(\"FirstName\") + \"\
  \ \" +\n            row.Field<string>(\"LastName\");\n        studentsListBox.Items.Add(name);\n\
  \    }\n}\n```\n\n代码首先调用数据适配器的 `Fill` 方法将数据加载到 `DataSet` 的 `Students` 表中。然后，它调用\
  \ `ListStudents` 方法来显示学生的姓名。\n\n`ListStudents` 方法遍历表的每一行。代码获取每行的 `FirstName` 和 `LastName`\
  \ 值，并将它们拼接成学生的姓名。然后，它将该姓名添加到 `studentsListBox` 控件中。\n\n使用类似的技术，你可以编写加载和操纵数据的程序。如果你需要保存更改，只需调用数据适配器的\
  \ `Update` 方法即可。\n\n`AddStudent` 示例程序在图 23-16 中显示，并可以在本书的网站上下载，它允许你向 `Students`\
  \ 表添加新学生。\n\n![c23f016.tif](img/c23f016.png)\n\n图 23-16： 此示例向 Students 表添加新学生。\n\
  \n当程序启动时，其 `Form_Load` 事件处理器会加载学生数据并显示学生姓名，就像 `ListStudentNames` 示例程序所做的那样。\n\n\
  如果你输入新的姓并点击“添加”（Add），将执行以下代码。\n\n```csharp\n// 添加新学生。\nprivate void addButton_Click(object\
  \ sender, EventArgs e)\n{\n    // 创建新行。\n    DataRow row = schoolDataDataSet1.Students.NewRow();\n\
  \    row.SetField<string>(\"FirstName\", firstNameTextBox.Text);\n    row.SetField<string>(\"\
  LastName\", lastNameTextBox.Text);\n\n    // 将新行添加到 Students 表。\n    schoolDataDataSet1.Students.Rows.Add(row);\n\
  \n    // 清空文本框。\n    firstNameTextBox.Clear();\n    lastNameTextBox.Clear();\n\n\
  \    // 重新显示数据。\n    ListStudents();\n}\n```\n\n此代码使用 `Students` 表的 `NewRow` 方法创建一个新的\
  \ `DataRow` 对象，该对象具有正确的字段，以便在该表中创建行。它设置了该行的 `FirstName` 和 `LastName` 值，并将新行添加到表的\
  \ `Rows` 集合中。\n\n代码最后通过清空 `TextBox` 并重新显示学生列表来结束。\n\n如果你点击“保存”（Save），以下代码会将任何新行保存到数据库。\n\
  \n```csharp\n// 保存数据。\nprivate void saveButton_Click(object sender, EventArgs e)\n\
  {\n    studentsDataAdapter.Update(schoolDataDataSet1);\n}\n```\n\n此代码通过调用数据适配器的\
  \ `Update` 方法保存更改。\n\n## 使用 ADO.NET\n\n到目前为止，示例使用了 `DataSet` 和数据适配器来创建、加载和保存数据。这些技术是\
  \ ADO.NET 的高级抽象。然而，某些情况下你可能需要更细粒度的控制，这时直接使用 ADO.NET。本章将介绍如何直接使用 ADO.NET。\n\n[/content]\
