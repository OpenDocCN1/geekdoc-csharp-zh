  \n图 A-8: `Customer` 类包含两个指向 `Address` 对象的引用和一个 `Order` 对象的数组。\n\n3. 因为 `Customer`\
  \ 是一个类，当传递该类的任何版本时，区别不大。按值传递时，程序向方法发送 `Customer` 对象引用的副本。按引用传递时，程序向方法发送指向原始 `Customer`\
  \ 对象引用的引用。无论哪种情况，方法收到的都是一个引用，因此程序不需要向方法发送大量数据。\n\n如果 `Customer` 是一个按引用传递的结构体，程序仍然只需要向方法传递一个引用，因此两个结构体之间几乎没有区别。\n\
  \n如果 `Customer` 是一个按值传递的结构体，程序需要复制 `Customer` 实例并将副本发送到方法。练习 1 中使用的 `Customer` 版本需要程序复制两个\
  \ `Address` 结构体和一个指向 `Orders` 数组的引用。练习 2 中使用的 `Customer` 版本只需要程序复制两个 `Address` 对象的引用和一个指向\
  \ `Orders` 数组的引用。如果 `Address` 结构体或类很大，那么练习 2 使用的版本将更有效，因为它只传递了 `Address` 对象的引用，而不是复制\
  \ `Address` 结构体。（然而，除非 `Address` 结构体或类*真的*非常大，否则实际差异将很小。在这种情况下，你应该选择逻辑上最合理的设计，而不是担心细微的性能差异。）\n\
  \n4. 如果你“调用”一个事件处理程序且没有注册对象接收它，程序将抛出 `System.NullReferenceException`。\n\n5. `BankAccount`\
  \ 示例程序就是此类。\n\n6. `OverdraftAccount` 示例程序就是此类。\n\n7. `OnOverdrawn` 示例程序就是此类。\n\n\
  \n\n\n\n### 8. `OverdraftAccount2` 示例程序就是这样操作的。当你运行修改后的程序并尝试将账户余额减少到低于 –$100.00\
  \ 的值时，程序不会显示消息框，但也不会更新余额。\n\n程序之所以这样运行，是因为此版本的 `OverdraftAccount` 类隐藏了 `Overdrawn`\
  \ 事件，但重写了 `Balance` 属性。\n\n主程序使用以下代码创建其账户对象：\n\n```\nprivate BankAccount Account\
  \ = new OverdraftAccount();\n```\n\n这段代码创建了一个 `OverdraftAccount` 对象，但将其保存在 `BankAccount`\
  \ 变量中。\n\n随后，程序使用以下代码注册接收 `Overdrawn` 事件：\n\n```\nAccount.Overdrawn += Account_Overdrawn;\n\
  ```\n\n由于变量 `Account` 的类型为 `BankAccount`，因此此操作注册了事件处理器以捕获 `BankAccount` 版本的 `Overdrawn`\
  \ 事件。（如果 `OverdraftAccount` 类重写了事件而不是隐藏它，那么该语句将注册事件处理器以捕获 `OverdraftAccount` 版本的事件。）\n\
  \n最后，`OverdraftAccount` 类重写了 `Balance` 属性。当程序尝试将账户余额设置为低于 –$100.00 的值时，`set` 访问器会引发\
  \ `Overdrawn` 事件并拒绝更新余额。但它引发的是 `OverdraftAccount` 版本的事件，而主程序注册的是接收 `BankAccount`\
  \ 版本。由于没有代码注册接收 `OverdraftAccount` 版本的事件，因此事件处理器不会执行。\n\n（此示例展示了隐藏和重写事件的区别。）\n\n\
