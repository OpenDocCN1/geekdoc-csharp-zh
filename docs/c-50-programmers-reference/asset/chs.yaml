  现在你已经创建了数据源，可以用它来构建简单的数据绑定用户界面。接下来的两个部分将解释如何使用拖放来构建`DataGridView`和详细信息界面。随后的部分描述了第三种方法，允许你在`DataGrid`中查看多个表。\n\
  \n### 创建 DataGridView 界面\n\n要显示`DataGridView`，请打开数据源窗口，右键点击你想显示的表，并选择`DataGridView`，如图\
  \ 23-6 所示。\n\n![c23f006.tif](img/c23f006.png)\n\n**图 23-6:** 数据源窗口可以为表创建`DataGridView`或`Details`视图。\n\
  \n现在将表拖到表单上，让 Visual Studio 自动向表单添加以下组件：\n\n*   一个用于显示和编辑数据的`DataGridView`。\n* \
  \  一个用于存储数据的`DataSet`。\n*   一个将`DataSet`绑定到`DataGridView`的`BindingSource`。\n*  \
  \ 一个在`DataSet`和数据库之间移动数据的`TableAdapter`。\n*   一个`TableAdapterManager`用于管理表适配器。\n\
  *   一个`BindingNavigator`提供允许对数据简单导航的用户界面。\n\n这些组件中的许多位于表单设计器下方的组件区。只有`DataGridView`控件和`BindingNavigator`在表单本身上可见。\n\
  \n这些组件共同创建了图 23-7 所示的用户界面。（我重新排列了`DataGridView`使其填充了整个表单。）你可以使用`DataGridView`修改数据。你可以使用`DataGridView`或表顶部的`BindingNavigator`来导航数据并添加或删除记录。点击`BindingNavigator`的`Save\
  \ Data`按钮（看起来像软磁盘）来保存更改。\n\n![c23f007.tif](img/c23f007.png)\n\n**图 23-7:** 你可以从数据源窗口将`BindingNavigator`拖到表单上，以构建一个网格化程序来编辑数据。\n\
  \n### 创建详细信息界面\n\n要创建一个详细视图界面，请按照之前的方法创建数据源。打开数据源窗口并右键点击你想显示的表。这次选择图 23-6 所示的`Details`选项。\n\
  \n现在像以前一样将表拖到表单上。Visual Studio 自动添加了与`DataGridView`相同的组件，但这次它包含了一系列`Label`和`TextBox`，而不是`DataGridView`控件。图\
  \ 23-8 显示了结果。\n\n![c23f008.tif](img/c23f008.png)\n\n**图 23-8:** 使用`BindingNavigator`导航详细视图中的记录。\n\
  \n\n\n\n\n前两种技术的缺点是它们让你一次只能查看一张表的数据。虽然有某些方法可以实现表单与多个表协作（本章稍后的“使用 ADO.NET”部分描述了一种方法），但那些工作量更大。\n\
  \n另一种有用的方法是在 `DataGrid` 控件中显示 `DataSet` 的数据。`DataGrid` 控件可以显示由数据库关系链接的多个表的数据。要使用此方法，请遵循以下步骤。\n\
