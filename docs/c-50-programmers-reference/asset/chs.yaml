  \ WHERE StudentId=1 ORDER BY TestNumber\n```\n\n该代码遵循以下步骤：\n\n1. 打开数据库连接。\n2. 创建一个命令在连接上执行查询。\n\
  3. 执行查询并获取一个读取器以提取返回的记录。\n4. 对于每条记录，在 `ListBox` 中显示该记录的数据。\n5. 关闭数据库连接。\n\n这种直接使用\
  \ ADO.NET 的技术比使用拖放来构建简单界面要工作得多。随着时间的推移，调试和维护工作也更多，但它带给你更多的控制力和灵活性。\n\n## 总结\n\n\
  由于数据库编程对许多企业来说都是非常重要的课题，因此有大量的工具、数据库和书籍可用。任何一本书，即使是专门针对数据库编程的书，也无法涵盖数据库和数据库编程的所有知识。本章仅仅触了皮毛。它没有包含足够让你成为专家的材料，但它解释了一些你可以使用的技术，用来构建一个快速界面以便你管理数据库。它还解释了你如何使用\
  \ ADO.NET 构建更复杂的数据库程序。你可以利用互联网和数据库编程书籍学习更多。\n\n本章使用的数据库是关系型数据库，它们将数据存储在包含行的表中，但还有其他类型的数据库。例如，层次级数据库存储按树形结构排列的数据（例如组织架构图）。\n\
  \nXML 文件也可以存储层次级数据。如 `XPath` 和 `XSL` 等相关技术提供了额外的数据库功能，例如搜索以及将 XML 数据转换为其他形式（如 `HTML`、文本文档或重新排列的\
  \ XML）的能力。下一章将介绍 XML，并解释你如何在 C# 程序中使用它来存储和操作 XML 数据。\n\n## 练习\n\n1. 编写一个类似于图 23-18\
