  \ 和 `Courses` 属性是自动实现的。因为 `set` 访问器无法在声明中初始化，所以构造函数在结束时初始化了这些属性。当构造函数结束时，这些属性不为\
  \ `null`。（你可以在本章下载的 `StudentTest` 示例程序中找到这段代码。）\n\n## 4. 以下代码显示了修改后的类。\n\n```csharp\n\
