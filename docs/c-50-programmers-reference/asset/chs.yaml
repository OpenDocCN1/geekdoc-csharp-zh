  \ 数组设置为创建 `Task` 的事件处理程序的局部变量。它在程序中的唯一作用是将值传递给 `StartNew` 方法。）\n\n由于 `StartNew`\
  \ 方法将委托作为参数传递，因此必须修改 `Fibonacci` 方法以接受一个对象作为参数。下面的代码显示了新方法。\n\n```csharp\nprivate\
  \ long Fibonacci(object data)\n{\n    long N = (long)data;\n\n    if (N <= 1) return\
  \ 1;\n    return Fibonacci(N - 1) + Fibonacci(N - 2);\n}\n```\n\n这个版本的程序稍微简单一些，因为它不需要\
  \ `FindFibonacci` 方法或 `Results` 数组，并且 `Numbers` 数组可以存储在创建 `Task` 的方法局部中。\n\n###\
  \ 8. FiboThreads 示例程序执行此操作。下面的代码显示了创建、启动和等待线程的关键代码。\n\n```csharp\n// 启动四个线程。\nThread\
  \ thread0 = new Thread((ParameterizedThreadStart)FindFibonacci);\nthread0.Start(0);\n\
  Thread thread1 = new Thread((ParameterizedThreadStart)FindFibonacci);\nthread1.Start(1);\n\
  Thread thread2 = new Thread((ParameterizedThreadStart)FindFibonacci);\nthread2.Start(2);\n\
  Thread thread3 = new Thread((ParameterizedThreadStart)FindFibonacci);\nthread3.Start(3);\n\
  \n// 等待线程完成。\nthread0.Join();\nthread1.Join();\nthread2.Join();\nthread3.Join();\n\
  ```\n\n此代码创建并启动了四个 `Thread`。它随后调用每个 `Thread` 的 `Join` 方法以等待线程完成。\n\n在我的测试中，`FiboTasks`\
  \ 和 `FiboThreads` 程序之间的性能没有显著差异。\n\n### 9. `Task` 处于死锁状态，因为每个任务都在等待一个被另一个 `Task`\
  \ 锁定的对象锁。发生这种情况是因为 `Task A` 锁定了 `LockObjectA` 然后睡眠，让 `Task B` 有机会运行。它锁定了 `LockObjectB`，导致\
  \ `Task A` 被阻塞。由于 `Task A` 已经锁定了 `LockObjectA`，所以 `Task B` 也被阻塞了。\n\nDeadUnlock\
  \ 示例程序对 `Task A` 使用以下代码。\n\n\n\n\n\n```csharp\n// Task A.\nprivate void TaskA()\n\
  {\n    for (int attempts = 0; attempts < 10; attempts++)\n    {\n        Console.WriteLine(\"\
  TaskA: Locking A\");\n        if (Monitor.TryEnter(LockObjectA))\n        {\n  \
  \          try\n            {\n                Thread.Sleep(1);\n              \
  \  Console.WriteLine(\"TaskA: Locking B\");\n                if (Monitor.TryEnter(LockObjectB))\n\
  \                {\n                    try\n                    {\n           \
  \             // Update the value.\n                        BestValue = ValueA;\n\
  \n                        // We're done. Break out of the retry loop.\n        \
  \                Console.WriteLine(\"Task A: Done\");\n                        return;\n\
  \                    }\n                    finally\n                    {\n   \
  \                     Console.WriteLine(\"Task A: Releasing lock B\");\n       \
  \                 Monitor.Exit(LockObjectB);\n                    }\n          \
  \      }\n                else\n                {\n                    Console.WriteLine(\"\
  Task A: Lock B failed\");\n                }\n            }\n            finally\n\
  \            {\n                Console.WriteLine(\"Task A: Releasing lock A\");\n\
  \                Monitor.Exit(LockObjectA);\n            }\n        }\n        else\n\
  \        {\n            Console.WriteLine(\"Task A: Lock A failed\");\n        }\n\
  \    }\n}\n```\n\n`Task` B 使用的代码类似，因此在此未列出。唯一的区别是 `Task` B 会先尝试锁定 `LockObjectB`，然后是锁定\
  \ `LockObjectA`。\n\n当你运行此程序时，`Task`s 仍然难以获取它们所需的锁。这两个 `Task` 几乎以同步的方式运行，因此它们经常会执行以下事件序列：\n\
  \n1. `Task` A 锁定了 `LockObjectA`。\n2. `Task` B 锁定了 `LockObjectB`。\n3. `Task` A 锁定\
  \ `LockObjectB` 失败。\n4. `Task` A 释放了对 `LockObjectA` 的锁。\n5. `Task` A 重新锁定 `LockObjectA`。\n\
  6. `Task` B 锁定 `LockObjectA` 失败。\n7. `Task` B 释放了对 `LockObjectB` 的锁。\n8. `Task`\
  \ B 重新锁定 `LockObjectB`。\n\n此时，每个对象都锁有一个资源，因此整个过程从第 3 步重复。\n\n这种任务执行的操作同步程度足够，以至于它们没有处于死锁状态，但仍然无法进展的情况被称为**活锁\
  \ (livelock)**。\n\n最终，`Task`s 会产生一点点不同步，因此一个任务可以在另一个 `Task` 释放和重新锁定它之间获取它的第二个资源。这时，活锁就被打破了。\n\
  \n防止活锁的一种方法是确保 `Task`s 无法几乎以同步的方式运行。在这个示例中，如果你让两个 `Task` 睡眠不同的时间，活锁会很快消失。\n\n在这个示例中，一个更有效的解决方案是让\
  \ `Task`s 在尝试获取第一个锁之前睡眠不同的时间。这样，睡眠时间较短的 `Task` 就可以在另一个 `Task` 开始之前快速获取获取两个锁。\n\n\
  一个更好的解决方案是让两个 `Task`s 按照练习 11 中解释的相同顺序尝试锁定它们的对象。\n\n10. 示例程序 `NoDeadlock` 就是这样做的。在这种情况下，无论哪个\
  \ `Task` 先锁定 `LockObjectA`，它随后就可以锁定对象 `LockObjectB` 并完成计算。另一个 `Task` 会阻塞直到第一个 `Task`\
  \ 完成。然后它就可以在不受干扰的情况下进行。（你也可以创建一个单一锁对象来代表同时锁定资源 A 和 B。这样每个 `Task` 只需要获取一个锁，因此它们不会发生死锁。）\n\
  \n11. 在这种情况，程序会抛出以下异常。\n\n*类型为“System.Threading.SynchronizationLockException”的异常发生在\
  \ `NoDeadlock.exe` 中，但未在用户代码中处理。*\n\n*附加信息：对象同步方法从未同步的代码块中调用。*\n\n*如果对此异常有处理器，程序可以安全地继续。*\n\
  \n12. 在那种情况下，对象将保持锁定状态。如果另一个 `Task` 需要锁定该对象，它将永远无法获得锁。\n\n## 第 23 章\n\n1. `LinqTestScores`\
