  \n除非用户拥有适当权限，否则程序无法执行任务。虽然这对所有应用程序都是如此，但对于处理文件的程序来说，这是一个特殊的问题。用户需要适当的权限来读取、写入、创建和删除文件及目录。\n\
  \n开发者常见的错误是从具有许多权限的账户构建并测试应用程序。程序在开发者账户下运行良好，但普通用户无法使用，因为他们没有必要的权限。\n\n为了确保用户可以使用该程序，你应该始终从具有典型用户权限的账户对其进行测试。\n\
