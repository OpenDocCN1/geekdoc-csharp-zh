  \ words)\n{\n    return\n        words[Rand.Next(0, words.Length)] + \" \" +\n \
  \       words[Rand.Next(0, words.Length)] + \" \" +\n        words[Rand.Next(0,\
  \ words.Length)];\n}\n\n// 返回一个随机的光照值。\nprivate string RandomLight()\n{\n    string[]\
  \ values =\n    {\n        \"Shade\", \"Partial Shade\", \"Partial Sun\", \"Full\
  \ Sun\"\n    };\n    return values[Rand.Next(0, values.Length)];\n}\n```\n\n程序应该将准备期间构建的单词数组传递给\
  \ `RandomName` 方法。\n\n2. 修改你为练习 1 编写的程序，使用 DOM 代替 `XmlTextWriter`。你更倾向于哪个版本的程序？是否存在某些情况下，一种方法比另一种更好？\n\
