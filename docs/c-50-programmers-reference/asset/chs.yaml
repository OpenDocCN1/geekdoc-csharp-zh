  \n```\n#region Region1\n// Code Block 1 ...\n#region Region2\n// Code Block 2 ...\n\
  #endregion Region1\n// Code Block 3 ...\n#endregion Region2\n    1. 如果折叠 `Region1`\
  \ 会发生什么？（根据你对区域的了解尝试推断。然后尝试一下以看看你是否正确。）\n    2. 如果折叠 `Region2` 会发生什么？\n\n\n\n\n\
  程序使用变量来存储和操作值。例如，如果某些变量存储数字，程序就可以对它们进行算术运算。如果变量存储字符串，程序就可以对它们使用字符串操作，例如拼接字符串、搜索特定的子字符串以及从中提取子字符串。\n\
  \n\n*   **数据类型**（Data type）决定了变量可以存储的数据种类（整数、字符、字符串等）。\n*   **作用域**（Scope）定义了可以访问变量的代码。例如，如果你在\
  \ `for` 循环内部声明变量，则只有循环内部的其他代码可以使用该变量。如果你在方法顶部声明变量，则只有方法中的代码可以使用该变量。\n*   **可访问性**（Accessibility）决定了其他模块中的哪些代码可以访问该变量。如果你在类的类级别（类中任何方法之外）声明变量并使用\
  \ `private` 关键字，则只有类（或派生类）中的代码可以使用该变量。相反，如果你使用 `public` 关键字声明变量，其他类代码也可以使用该变量。\n\
  *   **生命周期**（Lifetime）决定了变量值的有效时间。例如，在方法内部声明的变量在方法开始时创建，在退出时被销毁。如果方法再次运行，它会创建变量的新副本并重置其值。\n\
  \n可见性（Visibility）是一个结合了作用域、可访问性和生命周期的概念。它决定了特定代码是否可以使用变量。如果变量对代码是可见的、代码位于变量的作用域内，且变量在其生命周期内（已创建且尚未销毁），那么该变量对代码就是可见。\n\
  \n本章解释了 C# 中声明变量的语法。它解释了你如何使用不同的声明来确定变量的数据类型、作用域、可访问性和生命周期。它讨论了在选择声明类型时应该考虑的一些问题，并描述了一些可能会使变量声明变得复杂的概念，例如匿名类型和可空类型。本章还解释了快速、方便地初始化对象、数组和集合的方法。\n\
  \n常量、参数和属性的作用域和数据类型概念与变量相似，因此在这里也对它们进行了描述。\n\n\n计算机可以处理的最小数据单元是位（bit），可以是 0 或 1\
  \ 的单个值。（Bit 是二进制数字的缩写。）\n\n八个位组成一个字节（byte）。计算机通常使用千字节（1,024 字节）、兆字节（1,024 千字节）、吉字节（1,024\
  \ 兆字节）和太字节（1,024 吉字节）来测量磁盘空间和内存空间。\n\n多个字节组成字（words），根据计算机硬件，可能包含 2、4 或更多字节。如今大多数计算机使用\
  \ 4 字节（32 位）字，尽管 8 字节（64 位）计算机变得越来越常见。\n\nC# 还以不同方式组合字节以形成具有更大逻辑意义的数据类型。例如，它使用 4\
  \ 个字节创建一个整数，这是一种数值数据类型，可以存储 2,147,483,648 到 2,147,483,647 之间的值。\n\n\n| 名称 | 类型 |\
  \ 大小 | 值 |\n| :--- | :--- | :--- | :--- |\n| 布尔 | `bool` | 2 字节 | 真或假。 |\n| 字节 |\
  \ `byte` | 1 字节 | 0 到 255。 |\n| 字符 | `char` | 2 字节 | 0 到 65,535。 |\n| 短整数 | `short`\
  \ | 2 字节 | −32,768 到 32,767。 |\n| 无符号短整数 | `ushort` | 2 字节 | 0 到 65,535。 |\n| 整数\
  \ | `int` | 4 字节 | −2,147,483,648 到 2,147,483,647。 |\n| 无符号整数 | `uint` | 4 字节 |\
  \ 0 到 4,294,967,295。 |\n| 长整数 | `long` | 8 字节 | −9,223,372,036,854,775,808 到 9,223,372,036,854,775,807。\
  \ |\n| 无符号长整数 | `ulong` | 8 字节 | 0 到 18,446,744,073,709,551,615。 |\n| 小进制 | `decimal`\
  \ | 16 字节 | 0 到 +/−79,228,162,514,264,337,593,543,950,335（无小数点）；0 到 +/−7.9228162514264337593543950335（小数点后有\
  \ 28 位数字）。 |\n| 单精度浮点数 | `float` | 4 字节 | −3.4028235E+38 到 −1.401298E-45（负值）；1.401298E-45\
  \ 到 3.4028235E+38（正值）。 |\n| 字符串 | `string` | 动态 | 指向另一个内存。 |\n| 日期时间 | `DateTime`\
  \ | 8 字节 | 日期时间。 |\n| 对象 | `object` | 4 字节 | 指向内存。 |\n| 类 | `class` | 动态 | 指向内存。\
  \ |\n| 结构体 | `struct` | 动态 | 结构体成员。 |\n\n### 值类型与引用类型\n\nC# 中有两种变量：值类型和引用类型。\n\n\
  \n相反，引用类型变量包含一个指向另一个内存单元的引用，该内存实际包含变量的数据。例如，假设你定义了一个 `OrderItem` 类，它具有 `PartNumber`、`PriceEach`\
  \ 和 `Quantity` 属性。现在假设你的程序创建了一个名为 `item1` 的 `OrderItem` 对象，其属性 `PartNumber` = 3618，`PriceEach`\
  \ = 19.95，且 `Quantity` = 3。程序分配一段内存来存储这些属性值。还会创建另一个内存单元作为第一个内存单元的引用。\n\n\n\n\n**图\
  \ 4-1:** 值类型变量直接持有其值。引用类型变量持有指向其数据的引用。\n\n\n类和结构体数据类型持有多个相关值，因此，查看图 4-1，你可能会认为它们是引用类型。实际上，类是引用类型，但结构体是值类型。这是两者最大的区别之一。第\
  \ 12 章对类、结构体及其它们之间有更多的详细介绍。\n\n`DateTime` 数据类型是一个结构体，存储有关日期和时间的信息。与其他结构体一样，它是一个值类型。\n\
  \n关于值类型和引用类型最出人意料的事实可能是 `string` 类是一个引用类型。`string` 变量包含指向描述实际文本值的信息的引用。\n\n### `var`\
  \ 关键字\n\n`var` 关键字就像一种特殊的数据类型，它让 Visual Studio 根据赋值给变量的值来确定变量应该具有的数据类型。例如，下面的代码使用\
  \ `var` 关键字来声明变量 `numTypes`。\n```\nvar numTypes = 13;\n```\n\n这段代码将值 13 赋给变量 `numTypes`。由于\
  \ C# 将字面量 13 解释为 `int`，程序使 `numTypes` 成为 `int`。\n\n你只能在方法内部使用 `var` 关键字，并且在声明变量时必须赋值（这样\
  \ Visual Studio 才能确定它应该是什么类型）。\n\n`var` 关键字非常强大，因为它可以处理各种数据类型。例如，下面的代码使用 `var` 声明了一个\
  \ `int` 数组和一个具有匿名类型的对象。\n\nvar values = new[] { 1, 2, 3 };\nvar person = new { FirstName\
  \ = \"Rod\", LastName = \"Stephens\" };\n```\n\n有些程序员会大量使用 `var` 类型。遗憾的是，为了正确理解代码，你需要能够轻松判断出\
  \ Visual Studio 分配给变量的数据类型。例如，看看是否能快速确定分配给以下每个变量的数据类型。\n\n```\nvar value1 = 100;\n\
  var value3 = 10000000000;\nvar value4 = 1000000000000000000004;\nvar value5 = 1.23;\n\
  var value6 = new { Description= \"Pencils\", Quantity = 12, PriceEach = 0.25m };\n\
  ```\n\n前五个数据类型分别是 `int`、`int`、`long`（因为 `int` 太小）、语法错误（因为该值太大，无法放入 `long` 中，但 Visual\
  \ Studio 不会自动将其提升为 `float`）以及 `double`。\n\n\n```\nvar value7 = new { Description=\
  \ \"Notepad\", Quantity = \"6\", PriceEach = 1.15m };\n```\n\n这段代码与之前的代码相似，但这里的\
  \ `Quantity` 值是字符串而不是 `int`。如果你没有注意到这两个声明的格式略有不同，你就将不知道这两个变量具有不同的数据类型。\n\n为了避免可能的混淆，除非\
  \ `var` 是必须的，否则我通常使用显式数据类型。特别是由 LINQ 表达式创建的数据类型可能很奇异且难以发现，因此在 LINQ 中使用 `var` 是意义的。第\
  \ 8 章对 LINQ 有更多论述。\n\n\n在方法内部，声明变量的语法非常简单。\n\n```\n«const» type«[]» name «= value»;\n\
  ```\n\n该声明的组成部分为：\n\n* `type`—你希望变量拥有的数据类型。\n* `[]`—包含空方括号 `[]` 以创建一个数组。\n* `name`—你希望变量拥有的名称。\n\
  * `=` `value`—你希望变量初始时拥有的值。\n\n例如，下面的代码片段声明了两个变量：一个初始化为 13 的 `int` 和一个 `bool` 数组。\n\
  \n```\nint numPlayers = 13;\n```\n\n要创建多维数组，请包含逗号以指示维度。例如，下面的代码声明了一个二维数组。\n\n```\n\
  int[,] values;\n```\n\n你可以像下面的代码那样访问该数组中的值。\n```\nvalues[1, 2] = 1001;\n```\n\n\
  你可以根据需要包含任意数量的逗号来创建高维数组。\n\n在方法外部声明变量稍微复杂一些，因为声明可以包含属性、访问修饰符和其他修饰。下面的文本显示了在类内部但在任何方法之外声明变量的语法。\n\
  \n```\n«attributes» «accessibility»\ntype«[]» name «= value»\n```\n\n该声明的组成部分为：\n\
  \n* `attributes`—一个或多个指定额外额外属性。后文“属性”章节详细介绍了这一点。\n* `accessibility`—决定哪些代码可以访问。后文“访问权限”章节介绍了这一点。\n\
  * `const`—如果你包含此项，该变量将是一个常量，其值稍后无法更改。使用 `value` 给常量赋值。\n* `static`—该关键字指示该变量由所有实例共享。\n\
  * `volatile`—该关键字指示该变量可能会被运行的线程修改。\n* `type`—你希望变量拥有的数据类型。\n* `[]`—包含空方括号 `[]` 以创建一个数组。\n\
  * `name`—你希望变量拥有的名称。\n* `=` `value`—你希望变量初始时拥有的值。\n\n例如，下面的代码定义了一个公共可见的常量 `int`\
  \ 变量 `NumSquares` 并初始化为 8。\n\npublic const int NumSquares = 8;\n```\n\n本章后文的“静态、常量和\
  \ volatile”章节提供了 `static`、`const` 和 `volatile` 关键字的详细信息。\n\n你可以在语句中定义并初始化多个相同类型的变量。下面的语句声明了两个\
  \ `int` 变量。\n\n```\npublic int value1 = 10, value2 = 20;\n\n### 名称\n\n变量的 `name`\
  \ 必须是有效的 C#标识符。它应该以字母、下划线或 @ 符号开头。之后可以是字母、数字或下划线。如果名称以 @ 开头，则必须包含另一个字符。\n\n标识符名称不能包含特殊字符，如\
  \ &, %, 和 $。它们不能与 C# 关键字（如 `if`、`for` 和 `public`）相同。下面的表列了一些示例。\n\n| 名称 | 是否有效 |\n\
  | :--- | :--- |\n| numEmployees | 有效 |\n| num_employees | 有效 |\n| _manager | 有效（但不常见）\
  \ |\n| _ | 有效（但容易混淆） |\n| 1st_employee | 无效（未以字母、下划线或 @ 符号开头） |\n| #employees |\
  \ 无效（包含特殊字符 #） |\n| return | 无效（关键字） |\n\n@ 字符主要用于允许程序拥有与关键字同名的变量。例如，你可以定义名为 `@for`\
  \ 的变量。@ 符号告诉编译器这不是关键字。但在编译器在确定它不是关键字的开头后，会忽略 @ 符号。例如，如果你声明了一个名为 `@test` 的变量，那么程序认为\
  \ `test` 和 `@test` 是同一个名称。\n\n\n\n如果变量名不是关键字、不使用 `@` 符号，并且不是像 `_`、`____` 和 `_1_2_`\
  \ 这样的奇怪组合，就可以避免很多潜在的混乱。C# 关键字列表请 [`msdn.microsoft.com/library/x53a06bb.aspx`](http://msdn.microsoft.com/library/x53a06bb.aspx)。\n\
  \n### 属性\n\n可选的属性列表是一系列属性对象，提供了关于变量的额外信息。属性进一步细化了变量的定义，为编译器、运行时系统以及需要操作变量的工具提供更多信息。\n\
  \n属性具有很强的专业性，用于解决执行特定编程任务时出现的问题。例如，序列化是将对象转换为文本表示形式的过程。当你编写代码来序列化和反序列化数据时，可以使用序列化属性对该过程获得更多控制。\n\
  以下代码定义了 `OrderItem` 类。该类声明了三个公共变量：`ItemName`、`Price` 和 `Quantity`。它使用属性来指示 `ItemName`\
  \ 应该存储为文本，`Price` 应该存储为名为 `Cost` 的 XML 属性，而 `Quantity` 应该存储为默认名为 `Quantity` 的 XML\
  \ 属性。\n\n```\n[Serializable()]\npublic class OrderItem\n{\n    [XmlText()]\n   \
  \ public string ItemName;\n\n    public decimal Price;\n\n    [XmlAttribute()]\n\
  \    public int Quantity;\n}\n```\n\n（这些属性定义在 `System.Xml.Serialization` 命名空间中，因此程序使用了\
  \ `using System.Xml.Serialization` 语句，尽管此处未显示该语句。）\n以下代码显示了 `OrderItem` 对象的 XML\
  \ 序列化。\n\n```\n<OrderItem Cost=\"1.25\" Quantity=\"12\">Cookie</OrderItem>\n```\n\
  \n25 章，“序列化”提供了更多关于序列化的信息。由于属性非常专业，在这里没有详细描述。更多信息请参阅在线帮助中与你需要执行的任务相关的章节。有关属性的通用信息，请查看这些网页：\n\
  \n- 属性（C# 和 Visual Basic），[`msdn.microsoft.com/library/z0w1kczw.aspx`](http://msdn.microsoft.com/library/z0w1kczw.aspx)。\n\
  - 属性层次结构，[`msdn2.microsoft.com/2e39z096.aspx`](http://msdn2.microsoft.com/2e39z096.aspx)。\n\
  \n### 访问性\n\n变量声明的访问性子句可以以下值之一（按访问权限从高到低排序）：\n\n- `public`——表示变量对类内部或外部的所有代码可用。这允许对变量进行最大的访问权限。\n\
  - `internal`——表示变量仅对同一程序集内变量类内部或外部的所有代码可用。它与 `public` 的区别在于，`public` 允许其他程序集的代码访问该变量。`internal`\
  \ 关键字非常有用，例如，当你编写一个供其他程序集使用的库，并且希望库内部的某些变量仅对库内部可见时。\n- `protected`——表示变量仅对同类或派生类中的代码可用。即使类实例与包含变量的实例不同，变量对同类或派生类中的代码可用。例如，一个\
  \ `Employee` 对象可以访问另一个 `Employee` 对象内部的 `protected` 变量。\n- `internal protected`——这是\
  \ `internal` 和 `protected` 关键字的并集。它表示变量仅对同类或派生类中的代码可用，且仅限于同一程序集。\n\n如果你省略访问性，声明默认为\
  \ `private`。在以下代码中，两个变量 `value1` 和 `value2` 都是 `private`。\n\n```\nprivate int value1;\n\
  int value2;\n```\n\n\n变量声明可以包含以下任何关键字：\n\n- `const`\n- `readonly`\n- `static`\n\
  - `volatile`\n- `static volatile`\n\n`const` 关键字表示值在创建后无法更改。变量的声明必须包含初始化语句以给常量赋值。如果你没有包含初始化，或者代码尝试更改常量的值，Visual\
  \ Studio 会将该语句标记为错误。\n`readonly` 关键字使变量类似于常量，区别在于它的值可以在声明中或在类构造函数中设置。以下代码显示了如何创建一个带有\
  \ `readonly` `MilesPerGallon` 变量的 `Car` 类。\n\n```\nclass Car\n{\n    public readonly\
  \ float MilesPerGallon = 40f;\n\n    public Car()\n        MilesPerGallon = 20;\n\
  \    }\n    public Car(float milesGallon)\n    {\n        MilesPerGallon = milesGallon;\n\
  \    }\n}\n```\n\n该类开始声明 `MilesPerGallon`，并将其设置为 40。接下来，无参数构造函数将 `MilesPerGallon`\
  \ 设置为 20。第二个构造函数接收一个 `float` 值作为参数，并将该值赋予 `MilesPerGallon`。\n`static` 关键字表示该变量由类的所有实例共享。如果变量没有声明为\
  \ `static`，类的每个实例都拥有该变量的副本。例如，假设你构建了一个代表汽车群的 `Car` 类。每个 `Car` 对象都需要自己的 `Miles` 属性，因为每辆汽车行驶的里程可能不同。然而，如果所有汽车的每油里程相同，它们可以共享\
  \ `MilesPerGallon` 属性。以下代码显示了你可以如何创建它。\n\n```\nclass Car\n{\n    public static float\
  \ MilesPerGallon;\n    public float Miles;\n}\n```\n由于 `Car` 类的所有实例共享同一个 `MilesPerGallon`\
  \ 变量，如果任何实例的代码更改此值，所有实例都能看到新值。\n\n`volatile` 关键字表示变量可能会被同时运行的线程的代码修改。这防止编译器以阻止独立线程修改值的方式优化变量。有关此关键字的更多信息，请参阅\
  \ [`msdn.microsoft.com/library/x13ttww7.aspx`](http://msdn.microsoft.com/library/x13ttww7.aspx)。\n\
  \n## 初始化\n\n变量声明的最后部分（可选）是初始化它。\n\n如果你不初始化变量，它将获得取决于其数据类型的默认值。数值和 `char` 变量取值为 `0`，`bool`\
  \ 变量取值为 `false`。\n结构体也是值类型。当声明结构体时，其每个属性和字段都会获得其默认值。例如，如果结构体有一个 `int` 字段，它将被设置为\
  \ `0`。\n\n引用值（包括类变量和 `string`）获得特殊值 `null`，这意味着“此引用没有指向任何内容”。\n\n\n\n\n如果你不想让变量取其默认值，可以包含一个初始化。在变量名后跟着一个等号以及你希望它取的值。对于\
  \ `int` 和 `bool` 等简单类型，这种操作是非常直观的。例如，以下代码声明了 `bool` 变量 `ready` 并将其初始化为值 `false`。\n\
  ```\nbool ready = false;\n```\n\n对于类、结构体、数组和列表等更复杂的数据类型，初始化稍微复杂一些。后续章节将解释如何初始化这些类型的变量。\n\
  \n### 类和结构体\n\n初始化具有类或结构体类型的对象有两种方法。（类和结构体的步骤相同，因此下文假设你正在处理一个类。）\n首先，你可以使用 `new`\
  \ 语句创建一个新对象，并在其后跟一个属性或字段初始化器列表。每个初始化器由属性或字段的名称、一个等号以及它应该接收的值组成。\n\n例如，假设你定义了以下 `Person`\
  \ 类。\n\n```\nclass Person\n{ \n    public string FirstName, LastName;\n}\n```\n\
  现在，程序可以使用以下代码创建并初始化该类的实例。\n\n```\nPerson rod = new Person() { FirstName = \"Rod\"\
  , LastName = \"Stephens\" };\n```\n\n属性（或字段）不需要按照它们在类中定义的顺序列出。\n\n初始化类实例的另一种方法是为类提供一个构造函数，该构造函数接受可以初始化对象的参数。例如，考虑以下\
  \ `Person` 类。\n```\nclass Person\n{\n    public string FirstName, LastName;\n\n\
  \    public Person(string firstName, string lastName)\n    {\n        FirstName\
  \ = firstName;\n        LastName = lastName;\n}\n```\n\n这段代码使用 `firstName` 和 `lastName`\
  \ 参数来初始化对象的 `FirstName` 和 `LastName` 字段。\n\n现在，程序可以使用以下代码创建并初始化该类的实例。\n\n```\nPerson\
  \ rod = new Person(\"Rod\", \"Stephens\"); \n\n使用这种方法时，`new` 语句必须按照构造函数预顺序提供参数。\n\
  \n## 数组\n\n声明数组时，C# 程序不会创建数组。声明数组后有两种方法可以初始化它。\n\n首先，你可以在变量名后跟随等号、`new` 关键字、数组项的数据类型，以及用方括号括起来的想要包含的项目数量。以下代码使用此方法创建一个包含\
  \ 10 个 `decimal` 值的数组。\n\ndecimal[] salaries = new decimal[10];\n```\n\n所有数组索引从\
  \ 0 开始，因此这创建了一个包含 `salaries[0]` 到 `salaries[9]` 值的数组。\n\n初始数组项取默认值。例如，在前述代码中初始化的\
  \ `salaries` 数组将填充 10 个值 0 的副本。随后代码可以遍历数组并初始化每个项。\n\n与其单独初始化每个数组项，你可以使用第二种方法初始化数组。对于这种方法，在变量名后跟随等号和一个用大括号括起来的、逗号分隔的值列表。例如，以下代码声明了一个\
  \ `decimal` 数组并向其填充了四个值。\n\ndecimal[] salaries =\n{\n    32000m,\n    51700m,\n\
  \    17900m,\n    87300m,\n};\n```\n\n\n如果你正在初始化一个对象数组，大括号内的项将是相应类型的值。例如，以下代码声明并初始化了一个包含四个\
  \ `Person` 引用的数组，其中最后一个被初始化为 `null`。\n\n```\nPerson[] customers =\n{\n    new Person()\
  \ { FirstName=\"Ann\", LastName=\"Archer\"},\n    new Person() { FirstName=\"Ben\"\
  , LastName=\"Blather\"},\n    new Person() { FirstName=\"Cindy\", LastName=\"Carver\"\
  },\n};\n```\n\n要初始化多维数组，为每个项包含一个数组初始化器。例如，以下代码声明并初始化了一个二维数组。\n\n```\nint[,] values\
  \ =\n{\n    {1, 2, 3},\n};\n```\n\n注意，你必须为数组的每个维度提供相同数量的项目。例如，以下声明是无效的，因为数组的第一行包含三个元素，而第二行只包含两个元素。\n\
  \n```\nint[,] values =\n{\n    {1, 2, 3},\n};\n```\n\n要初始化一个数组数组，请创建一个数组初始化器，其中每个项都是一个新数组。以下代码声明并初始化了一个数组数组，其中包含的值与上述二维数组中的值相似。\n\
  \n```\nint[][] values2 =\n{\n    new int[] {1, 2, 3},\n};\n```\n\n### 集合\n\n提供 `Add`\
  \ 方法的集合类（如 `List`、`Dictionary` 和 `SortedDictionary`）有它们自己的初始化语法，类似于两种数组初始化器的结合。在变量名后，包含等号和一个新对象，就像你处理任何其他对象一样。例如，以下代码声明了一个\
  \ `List<string>`。\n\n```\nList<string> pies = new List<string>\n    \"Apple\", \"\
  Banana\", \"Cherry\", \"Coconut\"\n};\n```\n\n以下代码初始化了一个 `Dictionary<string, string>`。\n\
  \n``````\nDictionary<string, string> directory = new Dictionary<string, string>()\n\
  {\n    {\"Bill Bland\", \"940-2327\"},\n    {\"Carla Careful\", \"940-1983\"}\n\
  };\n```\n\n### 字面量字符\n\n如果你的代码包含字面量值（例如数字），C# 使用一套规则来解释该值。例如，值 2000000000 符合 `int`\
  \ 数据类型，因此当 C# 程序看到该值时，假设它是一个 `int`。\n\n\n当值看起来像整数时，程序尝试将其解释为至少与 `int` 一大的整数类型（因此它不会考虑\
  \ `byte`、`sbyte`、`short` 或 `ushort`）。当值包含小数点时，程序假设它是 `double`。对于较小的整数类型，如果可能，程序会自动转换整数值。例如，考虑以下语句。\n\
  \n```\nshort count = 15000;\n```\n\n通常这些都不需要你额外工作就能运行，但偶尔会引起问题。以下代码演示了其中最常见的问题之一。\n\
  \nfloat distance = 1.23;\n```\n\n\n\n\n\n此语句声明了一个名为 `distance` 的变量，类型为 `float`。程序将字面量值\
  \ `1.23` 视为 `double`。由于所有的 `double` 值并不一定能放入 `float` 中，程序在设计时将其标记为错误并显示此错误：\n\n\n\
  避免此问题的一种方法是使用字面量类型字符来告诉 C# 字面量应该是什么类型。下面的代码解决了上述代码的问题。字面量末尾的 `f` 告诉程序值 `1.23` 应被视为\
  \ `float` 而不是 `double`。\n\n```\nfloat distance = 1.23f;\n```\n\n下表列出了 C# 的字面量类型字符。\n\
  \n| :--- | :--- |\n| U | `uint` |\n| L | `long` |\n| UL, LU | `ulong` |\n| F | `float`\
  \ |\n| D | `double` |\n| M | `decimal` |\n\n你可以对字面量类型字符使用大写或小写。例如，`1.23f` 和 `1.23F`\
  \ 都会产生 `float` 结果。对于 UL 和 LU 字符，你甚至可以混合大小，如 `10uL`；尽管这可能会让代码比必要的更加复杂。\nC# 还允许在整数字面量前加上\
  \ `0x` 或 `0X`（两种情况下，第一个字符都是数字 0 而不是字母 O），以表示它是十六进制（16 进制）值。例如，以下两个语句将变量 `flags`\
  \ 设置为相同的值。第一个语句使用十进制值 `100`，第二个使用十六进制值 `0x64`。\n\n```\nflags = 100;   // 十进制 100.\n\
  flags = 0x64;  // 十六进制 0x64 = 6 * 16 + 4 = 100.\n```\n\n用双引号括围 `string` 字面量，用单引号括围\
  \ `char` 字面量，如下代码所示。\n\nstring name = \"Rod\";\nchar ch = 'a';\n```\n\n在 `string`\
  \ 或 `char` 字面量中，紧跟 `\\` 字符的字符具有特殊含义。例如，组合 `\\n` 表示换行。这些组合被称为转义序列。下表列出了 C# 的转义序列。\n\
  \n| 转义序列 | 字符 |\n| :--- | :--- |\n| \\’ | 单引号 |\n| \\\\ | 反斜杠 |\n| \\0 | 空字符 |\n\
  | \\a | 警报（蜂鸣） |\n| \\b | 退格 |\n| \\f | 换页 |\n| \\n | 换行 |\n| \\r | 回车 |\n| \\t\
  \ | 制表符 |\n| \\v | 垂直制表符 |\n例如，以下代码定义了一个包含四个制表符分隔列列值的字符串。\n\n```\nstring header\
  \ = \"Item\\tPrice Each\\tQuantity\\tTotal\";\n```\n\n如果 `string` 包含反斜杠但没有转义序列，那么用\
  \ `\\\\` 表示每个反斜杠可能会很麻烦。例如，Windows 文件路径如 `C:\\Temp\\Projects\\CurrentWork\\project.txt`\
  \ 可能包含许多反斜杠。下面的代码显示了如何将此值赋值给 `string` 变量。\n\n```\n```\n\n在 C# 中，你可以在字符串前面加上 `@`\
  \ 符号，使处理这种文本变得更容易。在这种情况下，`string` 会忽略所有的转义序列，并按原样包含引号之间的字符。\n\n```\nstring filename\
  \ = @\"C:\\Temp\\Projects\\CurrentWork\\project.txt\";\n```\n\n这种字符串一直持续到遇到结束引号\
  \ `\"`，甚至可以跨多行。\n如果你需要字符串包含 `\"` 字符，你不能简单地在文中输入它，因为程序会认为它代表字符串的结束。你不能使用 `\\\"`，因为这种字符串会忽略转义序列。\n\
  \n不要向字符串中添加 `\"` 字符，而是双写该字符。下面的代码初始化了一个 `string` 变量来存储一个包含双引号的双行字符串，然后在 `Console`\
  \ 窗口中显示它。\n\n```\nstring greeting = @\"Welcome to Project\n\"\"Do What I Meant\"\
  \"\";\nConsole.WriteLine(greeting);\n```\n以下文本显示了结果。\n\n```\nWelcome to Project\n\
  \"Do What I Meant\"\n```\n\n## 数据类型转换\n\n\n后续章节讨论了将数据从一种类型转换为另一种几种方法。这些方法包括\n\n\
  * 隐式转换\n* 强制转换 (Casting)\n* 使用 `as` 运算符\n* 解析 (Parsing)\n* 使用 `System.Convert`\n\
  * 使用 `System.BitConverter`\n### 隐式转换\n\n假设程序需要在变量中保存一个值。如果该变量可以存放程序可能需要的任何值，那么程序就可以安全地将该值存储在变量中。\n\
  \n例如，假设程序创建一个 `int` 变量并存入某个值。由于 `long` 变量可以存放 `int` 变量可以包含的任何值，因此这是保证成功的。将值存入一个可以包含该值的不同类型变量被称为宽转换。将\
  \ `int` 值存入 `long` 是宽转换的一个示例。（如果你把变量想象成信封或盒子，这样做是有意义的。）相反，窄转换是指源值不一定能放入目标变量。例如，假设程序有一个\
  \ `int` 变量并想要将其值复制到 `byte` 变量中。这取决于值，可能也可能失败。例如，如果值是 10，则会成功，因为 10 可以放入 `byte` 变量。然而，如果值是\
  \ 900，则会失败，因为 900 无法放入 `byte` 变量。\n\nC# 程序可以隐式地进行宽转换。例如，以下代码将 `int` 值存入 `long` 变量。\n\
  \n```\nlong theLong = theInt;\n```\n\nC# 程序不会执行隐式窄转换。例如，即使 `theLong` 中存储的值可以放入 `int`，以下代码也是允许的。\n\
  \n```\nlong theLong = 100;\nint theInt = theLong;\n```\n在这种情况下，Visual Studio 显示以下错误消息：\n\
  \n*无法将类型 ‘long’ 隐转换为 ‘int’。是否存在的强制转换？*\n\n如果你需要执行窄转换，则必须使用后续章节中描述的显式方法。这些方法中最常用的、错误消息建议的方法是强制转换。\n\
  \n### 强制转换 (Casting)\n\n强制转换运算符显式地告诉程序将值从一种类型转换为另一种。要将值强制转换为某种类型，将括号括的类型放在值前面。例如，下面的代码将\
  \ `long` 值强制转换为 `int` 变量。\n```\nlong theLong = 100;\nint theInt = (int)theLong;\n\
  ```\n\n后续章节提供了关于强制转换数字和转换对象的更多细节。\n\n### 强制转换数字\n\n\n\n\n\n你可以通过将代码封装在 `checked`\
  \ 块中来保护代码。如果整数转换在 `checked` 块内部发生溢出或欠溢，程序将抛出 `System.OverflowException`。（程序会抛出不同类型的异常对象来指示运行时错误。第\
  \ 9 章，“错误处理”部分对异常以及如何处理异常有更多详细介绍。）以下代码展示了将之前的示例使用 `checked` 块重写后的。\n\n```\nchecked\n\
  {\n    theInt = (int)theLong;\n}\n```\n\n现在，程序可以像第 9 章描述的那样捕获该异常。\n\n遗憾的是，如果程序尝试将\
  \ `double` 值转换为 `float` 且该值无法容纳，`checked` 块不会抛出异常。例如，以下代码尝试将值 `-1e200` 挤入 `float`\
  \ 类型的变量中。\n\n```\ndouble theDouble = -1e200;\n\ntheFloat = (float)theDouble;\n```\n\
  \n值 `-1e200` 太小，无法放入 `float` 中，因此此转换失败。程序不会抛出异常，`checked` 块也不会检测到此错误。\n\n如果该值太大或太小，程序会将变量的值设置为正无穷或负无穷大。`float`\
  \ 类提供了 `IsPositiveInfinity`、`IsNegativeInfinity` 和 `IsInfinity` 方法来确定变量是否持有这些特殊值之一。以下代码展示了将之前的示例重写后的版本，用于处理太大或太小无法放入\
  \ `float` 的值。\n\nfloat theFloat;\ndouble theDouble = -1e200;\n\ntheFloat = (float)theDouble;\n\
  if (float.IsInfinity(theFloat)) ... 对其进行某些处理 ...\n```\n\n### 对象的转换\n\n\n```\nStudent\
  \ student = new Student();\nPerson person;\n\nperson = student;\n```\n\n祖类类型的变量可以持有派生类的对象。例如，一个\
  \ `Person` 变量可以持有一个 `Student` 对象，因为 `Student` 是 `Person` 的一种。然而，并不是所有的 `Person`\
  \ 对象都是 `Student`。这意味着将 `Person` 转换为 `Student` 是一个窄化转换，其成功与否取决于该 `Person` 实际上是 `Student`还是其他类型（如\
  \ `Teacher` 或 `Janitor`）。\n以下代码演示了两个窄化对象转换。\n\n```\nPerson personA = new Student();\n\
  Person personB = new Janitor();\nStudent student;\n\nstudent = (Student)personA;\n\
  student = (Student)personB;\n\n第一次转换将 `personA` 转换为 `Student`。变量 `personA` 恰好持有一个\
  \ `Person` 对象，所以此转换成功了。\n\n第二次转换将 `personB` 转换为 `Student`。变量 `personB` 恰好持有一个 `Janitor`。`Janitor`\
  \ 并不是 `Student` 的一种，因此这在运行时失败并抛出 `System.InvalidCastException`。\n\n确定从一个对象类型到另一个对象的转换是否有效的方法之一是尝试转换，并在发生时捕获\
  \ `InvalidCastException`。另一种方法是使用 `is` 运算符。`is` 运算符判断对象是否与给定类型兼容。\n\n例如，假设变量 `person`\
  \ 持有一个可能可能是 `Student` 或 `Janitor` 的对象的引用。以下代码在执行转换之前测试该对象是否可以转换为 `Student`。\n\n\
  if (personB is Student)\n{\n    student = (Student)personB;\n\n    // 对 Student\
  \ 进行某些处理...\n}\n```\n\n### 使用 as 运算符\n`as` 运算符提供了将对象从一种类型转换为另一种类型转换的简写形式。以下代码将变量\
  \ `person` 中的值转换为 `Student` 并将其保存在变量 `student` 中。\n\n```\nstudent = person as Student;\n\
  ```\n\n如果变量 `person` 持有的值可以转换为 `Student`，则这与强制转换类似。如果该值无法转换为 `Student`（例如，如果它是 `Janitor`），则\
  \ `as` 运算符将返回特殊值 `null`。这会导致变量 `student` 不再引用任何对象。\n\n### 数组的转换\n转换允许你在基本类型和对象类型之间转换值。它还允许你对对象数组进行转换。\n\
  \n例如，在某种意义上，`Student` 对象的数组也是 `Person` 对象的数组，因为 `Student` 是 `Person` 的一种。这意味着 C#\
  \ 程序可以隐式地将 `Student` 数组转换为 `Person` 数组，也可以显式地将 `Person` 数组转换为 `Student` 数组。以下代码演示了这些隐式和显式转换。\n\
  \n```csharp\n// 创建一个 Student 数组。\nStudent[] students = new Student[10];\n\n// 隐式转换为\
  \ Person 数组。\nPerson[] persons = students;\n\n// 显式转换回 Student 数组。\nstudents = (Student[])persons;\n\
  ```\n\n### 解析\n\n每种基本数据类型（`string` 除外）都有一个 `Parse` 方法，尝试将字符串转换为该类型。例如，以下代码将值 1238\
  \ 保存到 `string` 变量中。\n```csharp\nstring text = \"1238\";\nint value = int.Parse(text);\n\
  ```\n\n某些解析方法可以接受额外的参数来控制转换。例如，数值方法可以接受格式字符串。\n\n如果传递给 `Parse` 的字符串无效，方法将抛出异常。程序可以像第\
  \ 9 章描述那样捕获异常。或者，代码可以使用相应的 `TryParse` 方法。与 `Parse` 不同，`TryParse` 通过输出参数返回解析后的值，并且在解析成功时返回\
  \ `true`。以下代码展示了程序如何使用 `TryParse`。\n\nstring text = \"1238\";\nint value;\nif (int.TryParse(text,\
  \ out value))\n{\n    // 使用 value\n}\n```\n\n### 使用 System.Convert\n`Convert` 类具有多种从一种类型转换为另一种类型的方法。例如，以下代码使用\
  \ `ToInt64` 方法将字符串“61”转换为 64 位整数。\n\n```csharp\nlong value = Convert.ToInt64(\"\
  61\");\n```\n\n这些方法易于理解，使得代码简单。遗憾的是，它们针对特定的数据大小（如 32 位或 64 位整数），而不是系统的默认整数大小，因此未来你可能需要更改代码。如果后来的版本的\
  \ C# 假设 `long` 意味着 128 位整数，你可能需要更新对 `Convert.ToInt64` 的调用。\n\n### 使用 System.BitConverter\n\
  `BitConverter` 类定义了在值和字节数组之间转换的方法。\n\n`GetBytes` 方法返回值的字节数组。`ToInt32` 和 `ToDouble`\
  \ 等方法将存储在字节数组中的值转换特定的数据类型。\n\n通常这些方法用于将 API 函数返回的值转换为用的类型。例如，API 函数可能会将两个 16 位整数值封装在单个\
  \ 32 位值的两个部分中。你可以使用这些方法将该 32 位值转换为 4 字节的数组，然后将每对字节转换为 16 位值。\n\n`BitConverter` 类的方法非常专门，因此在此处不再进一步描述。有关更多信息，请参阅\
  \ [msdn.microsoft.com/library/system.bitconverter.aspx](http://msdn.microsoft.com/library/system.bitconverter.aspx)\
  \ 中的“BitConverter 类”。\n\n### ToString\n\n\n\n`ToString` 方法非常有用，值得特别提到。每个对象都有一个 `ToString`\
  \ 方法，用于返回对象的字符串表示。例如，以下代码将 `decimal` 类型的值 `totalCost` 转换为字符串并将结果保存在变量 `totalString`\
  \ 中。\n\n```\nstring totalString = totalCost.ToString();\n```\n\n\n`ToString` 方法可以接受一个格式字符串作为参数，以更改方法格式化结果的方式。例如，以下代码显示\
  \ `decimal` 变量 `cost` 的值，并保留小数点后两位数字。\n\n```\nMessageBox.Show(cost.ToString(\"0.00\"\
  ));\n```\n\n附录 P，“日期和时间格式说明符”以及 附录 Q，“其他格式说明符”详细描述了格式说明符。\n\n\n变量的作用域决定了哪些代码部分可以访问它。例如，如果你在方法内部声明变量，则只有方法内部的代码可以访问该变量。三个可能的作用域级别（按作用域从小到大排列）：块、方法和类。\n\
  \n### 块作用域\n\n块是用花括号括起来的一系列语句。如果你在代码块内声明变量，该变量就具有块作用域，只有该块内的其他代码可以访问该变量。此外，只有出现在变量声明之后的代码才能看到该变量。\n\
  \n在块的起始语句中声明的变量也是块的一部分。注意，变量在变量作用域内的任何子块中都是可见的。\n\n\n```\nfor (int i = 1; i <= 5;\
  \ i++)\n{\n    int j = 3;\n    if (i == j)\n    {\n            int sum = i + j;\n\
  \            Console.WriteLine(\"Sum: \" + sum);\n    else\n    {\n            int\
  \ product = i * j;\n            Console.WriteLine(\"Product: \" + product);\n  \
  \  }\n\n    int k = 123;\n    Console.WriteLine(\"k: \" + k);\n}\n\n这段代码使用了 `for`\
  \ 循环，循环变量 `i` 在 `for` 语句中声明。变量 `i` 的作用域是由 `for` 循环定义的块。循环内部的代码可以看到变量 `i`，但循环外部的代码无法看到。\n\
  \n在循环内部，代码声明了变量 `j`。该变量的作用域也是 `for` 循环的块。\n\n如果 `i` 等于 `j`，程序声明了变量 `sum` 并使用它。该变量的作用域仅包含\
  \ `if` 和 `else` 语句之间的两行。\n\n如果 `i` 不等于 `j`，代码声明了变量 `product`。该变量的作用域仅包含 `if` 和 `else`\
  \ 语句之间的两行。\n\n\n\n参数的基本作用域是直观的（方法作用域），但参数具有一些特殊特性，这使得情况变得复杂。虽然这不完全是一个作用域问题，但它与作用域密切相关，因此这里介绍介绍。\n\
  \n你有三种方式可以将值传递到方法中：按值传递、按引用传递以及输出传递。\n\n### 按值传递 (By Value)\n\n默认情况下，参数的值是通过按值传递到方法的。这意味着方法接收的是参数值的一个*拷贝*。如果方法修改了参数，它只修改了拷贝，因此调用处代码中的值保持不变。\n\
  例如，考虑以下代码。\n\n```c\nprivate void DoubleTest()\n{\n    int value = 10;\n    DoubleIt(value);\n\
  \    Console.WriteLine(\"DoubleTest: \" + value.ToString());\n}\n\nprivate void\
  \ DoubleIt(int number)\n{\n    number *= 2;\n    Console.WriteLine(\"DoubleIt: \"\
  \ + number.ToString());\n}\n```\n\n`DoubleTest` 方法创建了变量 `value` 并将其初始化为 10。然后它调用了\
  \ `DoubleIt` 方法，并将 `value` 作为参数传递给它。（在调用代码中，传递给方法的值被称为参数。）\n\n`DoubleIt` 方法接收该值作为参数\
  \ `number`。（当方法接收一个值时，被称为参数。）注意，参数的名字不需要与参数相同。实际上，参数通常并不像本例中那样是一个变量。`DoubleTest`\
  \ 方法可以使用算术语句作为参数，例如 `DoubleIt(value / 3)`。\n\n`DoubleIt` 方法将其参数的值翻倍，并在控制台中显示结果。然后控制权返回到\
  \ `DoubleTest` 方法。\n\n由于参数是按值传递给 `DoubleIt` 方法的，因此 `DoubleTest` 方法中的原始变量值没有改变。\n\
  \n如果你运行此代码，控制台中将出现以下文本。\n\n```\nDoubleIt: 20\nDoDouble: 10\n```\n\n### 按引用传递 (By\
  \ Reference)\n\n按值传递值到方法的另一种替代方案是按引用传递。在这种情况下，方法接收的是参数值的引用，而不是该值的拷贝。这意味着如果方法更改了参数，调用处代码中的参数也会随之改变。\n\
  \n要按引用传递值，请在参数声明之前添加 `ref` 关键字。如果使用 `ref` 关键字声明参数，则调用代码中的参数也必须包含 `ref` 关键字，以明确表示你正在按引用传递值。这希望可以防止你在调用处代码修改参数值时感到意外。（实际上，除非你打算让方法修改它，否则你不会使用\
  \ `ref` 关键字声明参数。）\n\n以下代码显示了上一个示例，但方法的参数改为按引用传递。`ref` 关键字已加粗显示。\n\n```csharp\nprivate\
  \ void DoubleTest()\n{\n    int value = 10;\n    DoubleIt(ref value);\n    Console.WriteLine(\"\
  DoubleTest: \" + value.ToString());\n}\n\nprivate void DoubleIt(ref int number)\n\
  {\n    number *= 2;\n    Console.WriteLine(\"DoubleIt: \" + number.ToString());\n\
  }\n```\n\n现在运行该代码，控制台中将出现以下文本。\n\n```\nDoubleIt: 20\nDoDouble: 20\n```\n\n这一次，`DoubleIt`\
  \ 方法将其参数值翻倍，该更改反映在调用处代码的 `value` 参数中。\n\n### 输出传递 (For Output)\n\n将值传递到方法的最后一种方式是使用\
  \ `out` 关键字。该关键字意味着该参数旨在作为一个输出参数。参数按引用传递到方法，以便方法可以设置其值。方法不会假设在传递到方法之前值已经初始化，并且方法在返回之前会为参数分配一个值。\n\
  \n与 `ref` 关键字的情况一样，如果你在参数声明中添加了 `out` 关键字，则必须在参数中也包含它。以下代码显示了修改后使用 `out` 关键字的上一个示例。\n\
  \n```csharp\nprivate void DoubleTest()\n{\n    int value;\n    DoubleIt(out value);\n\
  \    Console.WriteLine(\"DoubleTest: \" + value.ToString());\n}\n\nprivate void\
  \ DoubleIt(out int number)\n{\n    number = 50;\n    Console.WriteLine(\"DoubleIt:\
  \ \" + number.ToString());\n}\n```\n\n由于 `DoubleIt` 方法不需要其参数初始化，因此 `DoubleTest`\
  \ 方法没有初始化其 `value` 变量。`DoubleIt` 方法设置了参数的值并显示。由于参数被声明为 `out`，值会返回到调用处，因此在 `DoubleTest`\
  \ 方法中 `value` 变成了 50。\n\n以下文本显示了结果。\n\n```\nDoubleIt: 50\nDoubleTest: 50\n```\n\n\
  ### 特殊情况与异常\n\n即使你知道如何按值、按引用和用于输出传递参数，仍然存在可能令人困惑的情况。记住，某些变量是值类型，而另一些是引用类型。当你按值传递一个值类型变量时，方法接收的是该值的拷贝，一切都如你预期。\n\
  \n如果你按值传递一个引用变量，方法接收的是引用的拷贝，而不是引用引用数据的拷贝。这意味着方法无法更改引用（因为它是按值传递的），但它可以更改与引用关联的数据。\n\
  \n例如，考虑以下方法。\n\n```csharp\nprivate void SetCity(Person person)\n{\n    person.City\
  \ = \"Bugsville\";\n    person.Zip = 12345;\n}\n```\n\n该方法接收一个按值传递的 `Person` 参数，更改了它的\
  \ `City` 和 `Zip` 值，然后结束。如果 `Person` 是一个类，它是引用类型，因此方法接收的是与调用代码相同的对象。在调用处代码中，`Person`\
  \ 对象没有改变，但它的属性改变了。\n\n现在考虑 `SetCity` 方法的以下版本。\n\n```csharp\nprivate void SetCity(Person\
  \ person)\n{\n    person = new Person { City = \"Programmeria\", Zip = 54321 };\n\
  }\n```\n\n此版本将 `person` 参数设置为一个新的 `Person` 对象。然而，由于参数是按值传递的，除非参数是 `ref` 或 `out`，否则调用处代码的\
  \ `Person` 对象不会改变。\n\n当你将数组传递到方法时，也会发生类似的现象。如果数组按按传递的，方法可以更改它的值，但如果它将参数设置为新数组，更改则不会返回到调用处。如果数组被声明为\
  \ `ref` 或 `out`，方法可以将参数设置为新数组，更改将返回到调用处。\n\n\n\n\n程序可以使用这些方法，就就像存在一个公共字段一样。例如，如果这段代码位于\
  \ `Employee` 类中，下面的代码显示了程序如何为名为 `emp` 的 `Employee` 对象设置并然后获取 `Name` 属性。\n\n```\n\
  emp.Name = \"Rod Stephens\";\nConsole.WriteLine(emp.Name);\n```\n\n出于几个原因，你可能希望使用属性而不是公共字段。首先，访问器允许你对程序如何存储和检索属性值进行更细的控制。例如，`set`\
  \ 访问器可以使用代码在将值保存到备用字段（backing field）之前对其进行验证。代码可以验证邮政编码或电话号码是否具有正确的格式，如果值格式不正确则抛出异常。\n\
  \n你还可以在属性方法中设置断点。假设你的程序正在崩溃，是因为某段代码错误地设置了一个值。崩溃并没有立即发生，因此该值可能在崩溃很早就被设置了。如果你使用属性来实现该值，你可以在\
  \ `set` 访问器中设置断点，并在程序设置该值时随时停止。\n\n属性还允许你以实际实际用于存储值之外的格式来设置和获取值。例如，下面的代码定义了一个 `Name`\
  \ 属性，它将全名保存在姓和名的变量中。\n\n```\nprivate string _FirstName, _LastName;\npublic string\
  \ Name\n{\n    get\n    {\n        return _FirstName + \" \" + _LastName;\n    }\n\
  \    set\n    {\n        _FirstName = value.Split(' ')[0];\n        _LastName =\
  \ value.Split(' ')[1];\n    }\n}\n```\n\n在这里，`get` 访问器返回 `_FirstName` 和 `_LastName`\
  \ 字段的拼接。`set` 访问器使用 `string` 类的 `Split` 方法将新值拆分为由空格分隔的两个部分。它将值的第一个部分保存在 `_FirstName`\
  \ 中，第二个部分保存在 `_LastName` 中。\n\n最后，你可以使用属性创建只读和只写的值。下面的代码显示了如何创建一个只读的 `NumEmployees`\
  \ 属性方法和一个只写的 `NumCustomers` 属性方法。（只写属性方法并不常见，但是是合法的。）\n\n```\n\nprivate int _NumEmployees;\n\
  public int NumEmployees\n{\n    get\n    {\n        return _NumEmployees;\n    }\n\
  }\n\nprivate int _NumCustomers;\npublic int NumCustomers\n{\n    set\n    {\n  \
  \      _NumCustomers = value;\n    }\n}\n```\n\n要使属性变为只读或只写，代码只需省略它不需要的访问器。属性的备用字段对类内部的代码仍然可见，因此代码可以根据需要获取和设置值。\n\
  \n备用字段并不是存储属性值的唯一方法。例如，你可以将值存储在数据库、文本文件或配置设置。尽管如此，备用字段非常流行。它们如此流行，以至于 C# 提供了在后台使用备用字段的自动实现属性。\n\
  \n要创建一个自动实现属性，只需像下面的示例一样省略访问器的体。\n\n```\npublic string Name { get; set; }\n```\n\
  \n自动实现属性的优点是你不需要编写大量的代码。缺点是你可以不能在访问器中设置断点。\n\n## 枚举\n\n枚举（也称为枚举类型或简单的 `enum`）是一组称为枚举器（enumerators）的特定值的离散列表。你定义枚举以及允许的值。稍后，你可以声明一个枚举类型的变量，使其只能取这些值。\n\
  \n例如，假设你构建了一个大型应用程序，用户可以拥有三种访问级别之一：职员（clerk）、主管（supervisor）和管理员（administrator）。你可以定义一个名为\
  \ `AccessLevels` 的枚举，包含 `Clerk`、`Supervisor` 和 `Administrator` 枚举器。现在，如果你声明一个变量类型为\
  \ `AccessLevels`，C# 允许变量只能取这些值。\n\n下面的代码显示了一个简单的示例。\n\n```\n// 定义访问级别值。\npublic\
  \ enum AccessLevels\n{\n    Clerk,\n    Supervisor,\n    Administrator,\n}\n\n//\
  \ 用户的访问级别。\nprivate AccessLevels Level;\n\n// 设置主管访问级别。\npublic void MakeSupervisor()\n\
  {\n    Level = AccessLevels.Supervisor;\n}\n```\n\n这段代码定义了 `AccessLevels` 类型并声明了该类型的变量\
  \ `Level`。稍后 `MakeSupervisor` 方法将 `Level` 设置为值 `AccessLevels.Supervisor`。（注意该值带有枚举类型名前缀。）\n\
  \n声明枚举类型的语法如下：\n\n```\n«attributes0» «accessibility» name\n«: type»\n{\n    «attributes1»\
  \ name1 «= value1»,\n    «attributes2» name2 «= value2»,\n    ...\n}\n```\n\n该声明的各个部分是：\n\
  \n- `attributes0`——指定枚举额外属性的属性。请参见本章较前的“属性”部分获取更多信息。\n- `accessibility`——这决定了哪些代码可以访问该变量。请参本章较前的“访问性”部分获取更多信息。\n\
  - `name`——你想给枚举起的名字。\n- `: type`——所有枚举在内部都存储为整数值。默认情况下，枚举的类型是 `int`。你可以使用声明的这部分将底层类型更改为\
  \ `byte`、`sbyte`、`short`、`ushort`、`int`、`uint`、`long` 或 `ulong`。\n- `attributes1`,\
  \ `attributes2`——指定枚举额外属性的属性。\n- `name1`, `name2`——枚举器的名称。\n- `value1`, `value2`——用于存储此枚举器的整数值。\n\
  \n下面的代码提供了一个更复杂的示例。\n\n```\npublic enum Meal : sbyte\n{\n    Breakfast = 1,\n  \
  \  Lunch = Breakfast * 10,\n    Dinner = 100,\n    Supper = Dinner,\n}\n```\n\n\
  这段代码定义了一个名为 `Meal` 的枚举，它使用 `sbyte` 类型存储其枚举器。枚举器 `Breakfast` 代表值 1，`Lunch` 代表 `Breakfast`\
  \ 的 10 倍，`Dinner` 代表 100。\n\n枚举器 `Supper` 定义为与 `Dinner` 相同。它们在内部都存储为值 100，因此程序无法区分这两个值。通常枚举的重要的是值是唯一的，因此你不需要更改类型或初始化值。\n\
  \n通常，程序应该将变量的值设置为允许枚举器之一，如语句 `Level = AccessLevels.Supervisor`。如果由于某些原因你需要将值设置为计算结果，你可以将结果转换为枚举类型。例如，下面的代码将\
  \ `Meal` 变量 `food` 设置为转换为 `Meal` 的值 1。\n\n[/content] 结束。\n\n你可以在类或命名空间内部声明枚举。\n\n\
  如果你在命名空间内部定义枚举，命名空间内的代码可以使用其名称来引用它。如果枚举的访问权限允许，命名空间外部的代码可以通过提供命名空间和枚举来引用它。例如，假设\
  \ `Meal` 枚举定义在 `FoodStuff` 命名空间中。那么其他命名空间中的代码可以像下面的代码一样使用枚举。\n\n```\nFoodStuff.Meal\
  \ meal = FoodStuff.Meal.Breakfast;\n```\n\n如果你在类内部定义枚举并且其访问权限允许，类外部的代码可以通过包含类名来引用枚举。如果代码在另一个命名空间中，它也应该添加该空间。\n\
  \n例如，假设 `FoodStuff` 命名空间包含 `Oven` 类，该类定义了 `Meal` 枚举。下面的代码显示了 `Oven` 类内部的方法如何使用该枚举。\n\
  \n```\nMeal meal = Meal.Breakfast;\n```\n[/content]\n\n*(抱歉，在之前的回复中出现了重复和格式逻辑混乱，以下是根据你的要求重新生成的正确翻译版本：)*\n\
