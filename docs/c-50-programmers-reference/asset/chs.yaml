  预处理器指令是给 C# 编译器的命令。它们告诉编译器诸如哪些代码段包含在编译中，以及代码编辑器应该如何分组代码行。\n\n以下章节描述了最有用的 C# 预处理器指令。\n\
  \n\n`#define` 指令定义一个预处理器符号，然后你可以将其用于后续描述的 `#if`、`#else`、`#elif` 和 `#endif` 指令。预处理器符号要么定义或未定义。它们不像代码内部的常量那样具有值。\n\
  \n\n`#define` 和 `#undef` 指令必须放在任何编程语句（包括 `using` 指令）之前。它们适用于包含它们的整个文件。\n\n\n图 3-5:\
  \ 生成属性页允许你定义条件编译符号。\n\nVisual Studio 为不同的生成生成配置定义了不同的编译符号集。两个标准配置是 Debug 和 Release。默认情况下，Visual\
  \ Studio 为 Debug 生成定义 `DEBUG` 和 `TRACE` 符号，并为 Release 生成仅定义 `TRACE` 符号。\n\n要更改这些值，请使用配置管理器（通过选择“生成”\
  \ ⇒“配置管理器”找到）来选择 Debug 或 Release 生成。然后使用生成属性页来确定定义了哪些符号。\n\n`DEBUG` 和 `TRACE` 符号在程序调试中起着特殊作用。`Debug`\
  \ 和 `Trace` 类提供了工具，让你更容易判断程序在运行时正在做什么。`Debug` 类的方法仅在定义了 `DEBUG` 符号时执行。同样，`Trace`\
  \ 类的方法仅在定义了 `TRACE` 符号时执行。通过定义或不定义这些符号，你可以轻松开启或关闭 `Debug` 和 `Trace` 方法。第 10 章“跟踪与调试”对这些类有更多详细介绍。\n\
  \n\n这些语句允许你使用编译符号来决定在编译程序时哪些代码被包含在程序中。\n\n例如，以下代码根据定义的哪些符号显示不同的消息框。\n\n private\
  \ void Form1_Load(object sender, EventArgs e)\n        {\n#if DEBUG_LEVEL1\n   \
  \         MessageBox.Show(\"Debug level is 1\");\n#elif DEBUG_LEVEL2\n#else\n  \
  \          MessageBox.Show(\"Debug level is undefined\");\n#endif\n\n          \
  \  ...\n        }\n```\n\n在此例中，如果定义了 `DEBUG_LEVEL1`，则显示第一个消息框。如果未定义但定义了 `DEBUG_LEVEL2`，则显示第二个消息框。如果这两个符号都未定义，则显示第三个消息框。\n\
  \nVisual Studio 在编写代码时会评估编译符号并变灰未包含的代码，这样你可以清楚地看到哪些代码会被使用。除了前面的简单测试外，`#if` 和 `#elseif`\
  \ 指令还可以包含括号以及 `!`、`&&` 和 `||` 布尔运算符。例如，如果定义了 `SKIP_DEBUG` 或者 `DEBUG_LEVEL1` 和 `DEBUG_LEVEL2`\
  \ 都未定义，则以下代码显示消息。\n\n```cs\n            MessageBox.Show(\"Don't display debugging\
  \ messages.\");\n#endif\n```\n\n你还可以使用 `!=` 和 `==` 运算符将符号与 `true` 和 `false` 值进行比较。例如，如果定义了符号\
  \ `SHOW_GREETING`，则以下代码将显示消息框。\n\n```cs\n```\n\n这种语法更简单且通常更易读，因此大多数开发者使用这种方法。\n\n\
  注意，被条件编译排除的代码将从可执行程序中完全移除。这意味着被排除的代码不占用可执行程序的空间。\n\n这也意味着 Visual Studio 不检查未包含代码的正确性。如果被排除的代码包含拼写错误和无效\
  \ C# 代码，Visual Studio 不会警告你。\n\n\n`#warning` 指令生成一个 级警告。它会被列在错误列表中，但不会停止程序编译。这样做的一个理由是标记过时代码，以便开发者知道他们正在使用旧代码，如下例。\n\
  \n```cs\n#if OLD_VERSION\n#warning you are using an old version of this library\n\
  #endif\n```\n\n`#error` 指令与 `#warning` 指令类似，只是生成生成错误而不是警告。错误会阻止 Visual Studio 编译程序。\n\
  \n`#line` 指令允许你控制报告目的的文件行号和名称。此指令可以采取下列表描述的三种形式之一。\n\n\n\n\n\n* `#line` `number`\
  \ `[`file`]`—这设置了后续行的行号，以及可选的文件名。如果在此指令之后跟的是 `#warning` 或 `#error` 指令，它将报告给定的行号和文件。如果包含了文件名，`file`\
  \ 必须包含在双引号中。\n* `#line hidden`—这会让调试器隐藏其后的代码行，直到遇到下一个 `#line` 指令。\n* `#line default`—这会将文件的行号和名称恢复为它们的真实值。\n\
  下面的示例演示了 `#line` 指令。\n\n```\n#if OLD_VERSION\n\n#line 10 \"Tools Module\"\n#warning\
  \ This code is deprecated.\n#endif\n\n#line hidden\n    ... lots of code omitted\
  \ ...\n#line default\n```\n\n如果定义了符号 `OLD_VERSION`，则此代码的第一个 `#line` 指令会将行号设置为 10，文件名设置为\
  \ `\"Tools Module\"`。然后，`#error` 指令会在“错误列表”显示一条消息，说明在 `Tools Module` 文件的第 10 行存在错误。\n\
  `#line hidden` 指令会让调试器隐藏被省略的代码。如果你尝试在调试器中单步执行代码，代码编辑器会跳过这些行。这些代码仍然会被执行，但你无法对其进行单步调试。\n\
  \n最后的 `#line default` 指令会将文件恢复为正常的行号、名称，并结束行隐藏。\n\n\n某些代码结构（如类和方法定义）定义了区域，你可以在 Visual\
  \ Studio Code 编辑器中折叠这些区域。仔细观察 `class` 语句，你会看到代码编辑器左侧有一个减号。如果你点击减号，编辑器会将该类折叠为单行，并将减号变为加号。点击加号可以再次展开该类。\n\
  \n在图 3-6 中，`Person` 类和 `Customer` 类中的 `PrintInvoice` 方法被折叠了。\n\n![c03f006.tif](img/c03f006.png)\n\
  \n**图 3-6：** 代码编辑器允许你展开和折叠如类和方法等代码块。\n\n`#region` 指令允许你定义其他代码段，你可以以类似的方式对其进行折叠和展开。该代码段一直延伸到对应的\
  \ `#endregion` 指令。\n\n`#region` 和 `#endregion` 指令后面可以跟一个用于标识它们的字符串。你可以使用该字符串来识别区域，从而确保指令是匹配的。然而，代码编辑器会完全忽略该字符串，因此如果\
  \ `#region` 指令的字符串与相应 `#endregion` 指令中的字符串不匹配，Visual Studio 并不会在意。\n\n例如，假设一个 `Employee`\
  \ 类包含了许多计算工资的代码。你可以将与工资相关的属性、方法和其他代码放在一个区域内。然后你可以隐藏该区域，这样在处理类中的其他代码时它就不会干扰到你。下面的代码片段显示了如何定义这种区域。\n\
  \npublic class Employee : Person\n{\n    #region PayrollCode\n\n    ... 此处是工资相关的代码\
  \ ...\n\n    #endregion PayrollCode\n\n}\n```\n\n有时，将相关的代码片段移动到单独的文件可能会更容易。例如，如果一个类变得非常大，难以在其中查找内容，那么将类的部分移动到单独的文件可能会更简单。本章后面“类定义”部分介绍的\
  \ `partial` 关键字允许你将类的部分放在不同的文件中。例如，你可以将 `Employee` 类中工资相关的代码移动到单独文件中 `Employee`\
  \ 类的 `partial` 部分中。\n\n\n`#pragma` 指令向编译器提供特殊信息。该指令有两种基本形式：`#pragma warning` 和 `#pragma\
  \ checksum`。\n\n`#pragma warning` 指令以如下列表所示两种形式出现。\n\n* `#pragma warning disable\
  \ [``warning_list``]`—这会禁用一组用逗号分隔的警告代码的警告。如果你省略警告代码，则将禁用所有警告。\n* `#pragma warning\
  \ restore [``warning_list``]`—这会重新启用一组用逗号分隔的警告代码的警告。如果你省略警告代码，则将重新启用所有警告。\n\n例如，假设你启用了\
  \ XML 文档功能（这在本章后面的“XML 注释”部分进行了描述）。在这种情况下，所有公共类及其所有公共成员都应该应该有描述它们的 XML 注释。如果缺少了任何一个注释，Visual\
  \ Studio 将显示一条错误消息。\n\n如果你启用了 XML 文档功能，你可能应该提供所有这些注释。但如果你想省略某个特定方法的注释，可以使用 `#pragma\
  \ warning disable` 来禁用该方法的警告。\n\n\n```cpp\n /// <summary>\n    /// 表示一个员工。\n   \
  \ /// </summary>\n    public class Employee\n#pragma warning disable 1591\n    \
  \    public void PrintTimesheet()\n        {\n        }\n#pragma warning restore\
  \ 1591\n\n        ...\n    }\n```\n\n该类以 XML 注释开头，因此它不会引起警告。`PrintTimesheet` 方法没有\
  \ XML 注释，如果不是使用 `#pragma warning disable`，它就会引起警告。\n\n在 `PrintTimesheet` 方法结束后，代码会恢复类的公共成员的警告。\n\
  \n\n```\n#pragma checksum \"file\" \"{guid}\"\n```\n\n该指令用于调试 ASP.NET 。它超出了本书的范围，因此在此不进行介绍。更多信息请参见\
  \ [msdn.microsoft.com/library/ms13226.aspx](http://msdn.microsoft.com/library/ms13226.aspx)。\n\
  \n\n下面的代码显示了名为 `WindowsApplication1` 的新建文件 `Form1.cs`。这是一个使用 Visual Studio Express\
  \ 2012 创建的 Windows Forms 程序。\n\n```csharp\nusing System;\nusing System.Collections.Generic;\n\
  using System.ComponentModel;\nusing System.Data;\nusing System.Drawing;\nusing System.Linq;\n\
  using System.Text;\nusing System.Threading.Tasks;\nusing System.Windows.Forms;\n\
  namespace WindowsApplication1\n{\n    public partial class Form1 : Form\n    {\n\
  \        public Form1()\n            InitializeComponent();\n        }\n    }\n\
  }\n```\n\n接下来的部分描述了该程序的三个关键部分，这些是 C# 程序中典型的：`using` 指令、`namespace` 语句和类定义。\n\n\n\
  \n\n`using` 指令也可以为命名空间或类型创建别名。例如，以下语句使别名 `d2d` 代表 `System.Drawing.Drawing2D` 命名空间。\n\
  \n```\nusing d2d = System.Drawing.Drawing2D;\n```\n\n\n```\nd2d.Matrix matrix;\n\
  ```\n\n通常 `using` 指令置于文件的开头，但你也可以将它们放置在 `namespace` 语句内部。如果你在 `namespace` 内部放置 `using`\
  \ 指令，它必须位于该命名空间中所有元素之前，并且仅适用于该命名空间的该特定实例。如果你有另一段代码定义了相同命名空间的部分（无论是在同一个文件中还是在另一个文件中），该\
  \ `using` 语句将不适用于该命名空间的另一部分。\n\n例如，以下代码包含了两个 `namespace` 语句，中间省略了部分代码。这两个声明语句都定义了继承自\
  \ `Form` 类的类，因此它们都包含了 `using System.Windows.Forms` 指令。\n```\nnamespace MyNamespace\n\
  {\n    using System.Windows.Forms;\n\n    class EmployeeForm : Form\n    {\n   \
  \     ...\n    }\n}\n\nnamespace MyNamespace\n{\n    using System.Windows.Forms;\n\
  \n    class CustomerForm : Form\n    {\n        ...\n    }\n}\n```\n\n\n你可以使用 `namespace`\
  \ 语句来创建自己的命名空间。你可以使用命名空间来分组相关的类和其他程序元素。通过将不同的类放在单独的命名空间中，允许代码仅包含它们实际正在使用的命名空间。这使得忽略代码未使用的类变得更容易。它还允许多个命名空间定义相同名称的项目。\n\
  \n例如，你可以定义一个 `Accounting` 命名空间，其中包含 `AccountsReceivable` 和 `AccountsPayable` 命名空间。其中每个命名空间都可能包含一个名为\
  \ `Invoice` 的类。程序可以通过使用 `Accounting.AccountsReceivable.Invoice` 或 `Accounting.AccountsPayable.Invoice`\
  \ 来选择其中一个版本。\n\n下面的示例定义了 `Accounting` 命名空间。该命名空间定义了 `CustomerType` 枚举以及两个类 `PayableItem`\
  \ 和 `ReceivableItem`。它还包含一个嵌套命名空间 `OrderEntry`，它定义了 `OrderEntryClerk` 类。所有的类和命名空间都可以定义其他项目。\n\
  \nnamespace Accounting\n{\n    public enum CustomerType\n    {\n        CashOnly,\n\
  \        Credit30,\n        Credit90\n    }\n\n    public class PayableItem\n  \
  \      ...\n    }\n\n    public class ReceivableItem\n    {\n        ...\n    }\n\
  \n    namespace OrderEntry\n    {\n        public class OrderEntryClerk\n      \
  \  {\n        }\n\n        ...\n    }\n}\n```\n\n如果文件包含 `using` 指令以表示它正在使用某个命名空间，则不需要显式识别命名空间来使用其定义的类和其他项目。只有当包含的多个命名空间定义了相同的项目时，你才需要显式使用命名空间。\n\
  \nC# 程序中的所有程序元素必须位于 `namespace` 内部。默认情况下，你创建的任何代码文件都会包含一个与最初创建的项目同名的命名空间。\n\n\n\
  注释可以帮助其他开发者（或日后的你）理解程序的目的、结构和方法。虽然程序不会执行注释，但它们可以使代码更易于理解。\n\nC# 提供了三种注释：行尾注释、多行注释和\
  \ XML 注释。\n\n\n行尾注释以两个字符 `//` 开始（这两个字符不在引号字符串内）。这种注释延伸到当前行的末尾。\n\n多行注释以 `/*` 开始并以\
  \ `*/` 结束。编译器忽略这些字符之间的所有内容。\n\n\n```\n/* 此类定义了一个学生。它包含了联系信息、\n * 账单信息、过去和现在的课程以及过去和\n\
  \ * 校内活动。\n */\npublic class Student\n{\n    // 学生的姓名。\n    public string FirstName\
  \ { get; set; }\n    public string LastName { get; set; }\n\n    public string Street\
  \ { get; set; }\n    public string City { get; set; }\n    public string State {\
  \ get; set; }\n    public string Zip { get; set; }         // ZIP+4.\n}\n```\n\n\
  \n\n虽然许多开发者在多行注释的每行开头使用星号，但并不是必须的，因此你可以使用多行注释来快速注释掉大段代码。例如，下面的代码显示了之前的示例，其中 `Student`\
  \ 类中的所有代码都用多行注释注释掉了。\n\n```\n/* 此类定义了一个学生。它包含了联系信息、\n * 账单信息、过去和现在的课程，以及过去和\n *\
  \ 现在的活动。\n */\npublic class Student\n{\n    /*\n    public string FirstName { get;\
  \ set; }\n    public string LastName { get; set; }\n\n    // 学生的联系信息。\n    public\
  \ string Street { get; set; }\n    public string City { get; set; }\n    public\
  \ string State { get; set; }\n    public string Zip { get; set; }         // ZIP+4.\n\
  \    */\n}\n```\n\nVisual Studio 的标准工具栏还包含注释和取消注释工具。点击并拖动选择代码行。然后点击注释工具在每个所选行的开头添加\
  \ `//` 字符。点击取消注释工具从每行的开头的移除 `//` 字符。（你也可以在 Edit ⇒ Advanced 菜单中找到这些命令。）\n\n使用注释使你的代码更加清晰。注释不会减慢执行程序的运行（某些迷信的开发者认为它们会减慢代码，因为它们会让文件变大），所以没有理由避免它们。\n\
  \n\n普通注释只是为试图阅读你代码的开发者提供信息的。XML 注释允许你为代码添加一些上下文信息。例如，你可以在方法之前添加一个简短的描述，说明该方法、参数以及返回结果的含义。\n\
  \n如果你需要，Visual Studio 可以自动提取 XML 注释以构建一个描述项目的 XML 文件。该文件显示了项目的层级结构，显示了项目命名空间、类和其他元素的注释。结果并不是特别易读，但你可以用它自动生成更有实用的文档，例如报告或网页。例如，第三方工具如\
  \ NDoc ([ndoc.sourceforge.net](http://ndoc.sourceforge.net)) 和 Sandcastle ([shfb.codeplex.com](http://shfb.codeplex.com))\
  \ 可以处理 XML 注释并生成文档。你也可以编写程序来处理 XML 注释，例如使用 第 24 节 “XML”中描述的 XSLT。\n你可以将 XML 注释块放置在不包含方法的代码元素之前。这些元素包括类、结构体、枚举、属性、方法和事件。\n\
  \n要开始注释块，将光标置于要描述的元素之前的行，并输入 `///`。Visual Studio 会自动插入相应的 XML 注释块模板。如果随后的元素带有参数，它将包含描述参数的区域，因此在创建\
  \ XML 注释块之前完全定义参数对你是有有利的（否则你以后需要手动添加相应的注释区域）。\n\n下面的代码显示了为 `CreateStudent` 方法创建的\
  \ XML 注释块。它包含一个 `summary` ，你可以在其中描述该方法，以及两个 `param` ，你可以在其中描述方法的参数。\n\n/// <summary>\n\
  /// \n/// </summary>\n/// <param name=\"firstName\"></param>\n/// <param name=\"\
  lastName\"></param>\npublic void CreateStudent(string firstName, string lastName)\n\
  {\n}\n```\n\n注意，XML 元素可以跨越多行，就像此示例中的 `summary` 元素。\n\n\n```\n/// <summary>\n///\
  \ 在数据库中创建新的学生记录。\n/// </summary>\n/// <param name=\"firstName\">学生的姓。</param>\n\
  /// <WrittenBy date=\"4/1/2020\">Rod Stephens</WrittenBy>\npublic void CreateStudent(string\
  \ firstName, string lastName)\n{\n}\n```\n\n为了允许 Visual Studio 从 XML 注释创建 XML 文档，选择\
  \ Project ⇒ Properties 并转到 Build 标签页。如果整个标签不可见，滚动到最后并勾选 XML Documentation File 复选框，如\
  \ 图 3-8 所示。如果你不想文档文件使用默认名称，也可以更改它。\n\n\n**图 3-8:** 勾选 XML Documentation File 复选框以创建\
  \ XML 文档。\n\n除了为你提供文档外，XML 注释还让 IntelliSense 提供有关你代码的额外信息。图 3-9 显示了 IntelliSense\
  \ 显示关于 `CreateStudent` 方法的信息。此时，我输入了方法调用的左括号，因此 IntelliSense 显示关于 `firstName` 参数的信息。\n\
  \n![c03f009.tif](img/c03f009.png)\n\n**图 3-9:** IntelliSense 使用 XML 注释来显示方法及其参数的信息。\n\
