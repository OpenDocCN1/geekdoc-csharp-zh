  \ 和意外情况\n- 使用断言（assertions）和代码契约来检测 bug\n- 使用 `try-catch-finally` 处理异常\n- 创建自定义异常类\n\
  \n### 本章的 Wrox.com 下载\n\n请注意，本章的所有代码示例均作为本章代码下载的一部分，可以在书籍网站的 [www.wrox.com/go/csharp5programmersref](http://www.wrox.com/go/csharp5programmersref)\
  \ 的“Download Code”选项卡中找到。\n\n尽管在理论上可以编写一个程序来完美预测它可能遇到的每种可能的情况，但在实践中，对于非平凡程序来说这是困难的。对于大型应用程序，几乎不可能为每一种可能性制定计划。程序设计和实现中的错误可能会引入产生意外结果的\
  \ bug。即使你正确预判了所有正常情况，用户、损坏的数据库和不可靠的网络通信也可能给应用程序提供它未期望的值。\n\n同样，随时间推移的需求变化可能会引入应用程序从未打算处理的数据。千年虫故障（Y2K\
  \ bug）就是一个很好的例子。当工程师们在 20 世纪 60 年代 70 年代编写会计、自动注册、财务、库存和其他系统时，他们从未梦想过自己的程序在 2000\
  \ 年仍在运行。当时，磁盘存储和内存相对昂贵，因此他们将年份以 2 字节值存储（例如，`89` 表示 1989 年）。当 2000 年来临时，应用程序就无法判断值\
  \ `01` 是指 1901 年还是 2001 年。在某个幽默的案例中，一个自动注册系统开始为新车颁发“无马车”牌照，因为它认为 `00` 年制造的汽车必须是古董。千年虫问题实际上并不是一个\
  \ bug。它是软件被用于并非其原始设计范围的数据的案例。\n\n本章解释了应用程序中可能出现的各种异常情况。这些情况从未计划的数据（如千年虫问题）到意外输入（如当用户在数字字段中输入“ten”时），再到代码完全错误的\
  \ bug。通过一些事先计划，你可以构建一个健壮的应用程序，即使在意外发生时也能保持优雅地运行。\n\n## Bug 与不理想的情况（Bugs Versus Undesirable\
  \ Conditions）\n\n几种不同类型的未计划情况可能会让原本高质量的应用程序偏离正道。你应该如何处理这些情况取决于它们的性质。\n\n就本文讨论而言，bug\
  \ 是应用程序代码中的错误。有些 bug 会立即显现并且容易修复。这些通常包括代码中简单的拼写错误，以及你误用对象的情况（例如，使用了错误的属性）。其他 bug\
  \ 则更为微妙，可能在它们发生很久之后才被检测到。例如，一个数据输入程序可能会在 `Customer` 对象中一个很少使用的字段中放入无效字符。只有在以后程序尝试访问该字段时，你才会发现问题。这种\
  \ bug 很难追踪，但你可以采取一些主动措施使其更容易被发现。\n\n不理想的情况是指你不希望发生、但明知可能会发生的某种可预测的情况。例如，简单的打印操作有许多失败方式。打印机可能未插电、与电脑断开连接、网络连接缺墨、缺纸、发生内存故障、卡纸或直接损坏。这些并不是\
  \ bug，因为应用程序软件没有错。必须解决的是程序控制之外的情况。另一种常见的不理想情况是用户输入无效数据。你可能希望用户在文本框中输入 1 到 10 之间的值，但用户可能会输入\
  \ `0`、`9999` 或“lunch”。你无法修复不理想的情况，但可以尝试让程序优雅地处理它们并产生意义的结果，而不是崩溃。\n\n### 检测 bug\n\
  \n根据定义，bug 是未计划的。没有合理的程序员会坐下来想：“也许我在这个变量里放一个 bug 吧。”\n\n由于 bug 是不可预测的，你无法预知 bug\
  \ 会在哪里。然而，你可以观察程序中的某些行为来判断可能存在 bug。例如，假设你有一个方法按成本对订单项目排序。如果该方法接收到一个包含 100,000 个项目的订单，可能出问题了。如果订单中的一个项目是价格为\
  \ 73 万亿美元的电脑键盘，可能出问题了。如果下单的客户不存在，可能出问题了。\n\n该方法可能会继续对这些价格从几美分到 73 万亿美元的 100,000\
  \ 个项目。随后，程序会尝试打印一份没有收货或账单地址的 5,000 页发票。只有在那里，开发者才会意识到存在问题。与其试图绕过异常数据并继续运行，如果程序能立即告诉开发者哪里错了（这样他们就可以开始寻找问题），会更好。bug\
  \ 越早被检测就越容易发现。如果由排序方法发现了它，这个 bug 就会更容易发现，而不是等到应用程序尝试打印无效发票。你的方法可以通过主动验证输入和输出，并向开发者报告任何可疑的内容，来保护自身以及整个程序。\n\
  \n\n\n\n一些开发者反对让方法花费大量时间去验证它们“知道”是正确的数据。毕竟，一个方法生成了这些数据并将其传递给另一个方法，所以你 `know` 它是正确的，因为第一个方法正确地完成了它的工作。只有当每个接触数据的方法都完美运行时，这才是真的。由于\
  \ Bug 的定义就是意外之外的情况，因此你不能安全地假设所有方法都是完美的，且数据保持未损坏。\n\n为了防止验证代码减慢应用程序运行速度，你可以使用 `System.Diagnostics.Debug`\
  \ 类的 `Assert` 方法来检查异常情况。其核心思想是该方法断言某个语句为真。\n\n`Debug.Assert` 方法有多个重载版本。最简单的形式接受两个参数：一个布尔表达式和一个字符串。如果布尔表达式的值为\
  \ `false`，则断言失败，该方法会显示错误消息。\n\n`Debug` 类的 `Fail` 方法与 `Assert` 方法类似，不同之处在于它总是显示错误消息。通常情况下，你会使用\
  \ C# 代码来决定何时调用此方法。例如，如果一个 `switch` 语句有 `case` 部分来处理枚举类型的所有可能值，你可以添加一个调用 `Debug.Fail`\
  \ 的 `default` 部分。这样如果出现了意外值，程序就会通知你。\n\n当意外值出现时，程序会告诉你。当你进行调试时，`Debug.Assert` 会告诉你。当你进行发布生成时，`Debug.Assert`\
  \ 和 `Debug.Fail` 代码会被移除。你还可以使用 `DEBUG` 预处理器符号来定义哪些代码被编译。\n\n### 合约与，the the the\
  \ the...\n\n当一个值值出现时，程序会告诉..当调试调试，`Debug.Assert` 会告诉你。当你进行发布生成时，`Debug.Assert` 和\
  \ `Debug.Fail` 代码会被移除。你还可以使用 `DEBUG` 预处理器符号来定义哪些代码被编译。\n\n### 前置合约\n\n,the. tells\
  \ you.. you.,`......................................................................................................\
  \ the the the you the debug build, the `Debug.Assert` starts with the............\
  \ the the the the the the the. \n\n\n\n\n如果 `Contract.Ensures` 方法调用了另一个方法（在此例中为\
  \ `OrderItemsAreSorted`），Visual Studio 将发出警告，除非该方法被标记了 `Pure` 特性。该属性表示方法在检查对象时不会修改任何对象。你需要编写代码使该方法具有此属性。（这是很有道理的。如果验证后置条件的方法正在修改它所验证的对象，那将是令人困惑的。）在本例中，`OrderItemsAreSorted`\
  \ 方法检查了对象的订单项，但它没有修改订单或其项目。\n\n## 使契约生效\n\n遗憾的是，即使你将所有这些代码放入程序中，契约也不会自动工作。\n\n正如\
  \ `Debug` 和 `Trace` 类在没有定义 `DEBUG` 和 `TRACE` 预处理器符号之前什么都不起作用一样，`Contract` 类的大多数方法在没有定义\
  \ `CONTRACTS_FULL` 预处理器符号之前，都不会做任何事情。\n\n如果你使用 `#define` 指令来定义该符号，`Contract` 类的方法将会工作，但它们无法正常工作。如果你思考后置条件是如何工作的，你就能理解部分问题。后置条件应该在方法退出之前进行验证，但上一个示例中的契约将\
  \ `Contract.Ensures` 调用放在方法代码主体之前。方法必须在退出之前验证后置条件，而不仅仅是在开始时。\n\n要将后置条件检查移动到正确的位置并准备好契约，你需要调用重写工具\
  \ `ccrewrite.exe`。该工具会重排 C# 编译器生成的 IL 代码，以便契约能够正常工作。如果你尝试在不使用重写器的情况下运行程序，第一次调用 `Contract`\
  \ 方法将会失败。幸运的是，有一种更容易的方法让契约生效。不要在代码中纠结 `CONTRACTS_FULL` 预处理器符号。相反，选择项目 ⇒ 属性来打开项目属性页。选择代码契约选项卡以查看图\
  \ 9-1 所示的页面。勾选“执行运行时契约检查”框以启用契约。这将为你定义 `CONTRACTS_FULL` 预处理器符号，并让 Visual Studio\
  \ 在编译程序后自动调用重写器。\n\n你可以探索代码契约属性页来更改验证契约的方式。例如，可以使用“执行运行时契约检查”框右侧的下拉列表来仅检查先条件和后置条件，或仅检查先条件。\n\
  \n现在，如果你在调试器中逐步执行程序代码，你可以看到它执行了 `Contract` 类的方法调用。代码首先逐步执行先条件，然后是方法体，最后是由 `Contract.Ensures`\
  \ 方法定义的后置条件。\n\n## 不变性 (Invariants)\n\n不变性是在对象的整个生命周期内应保持为真实的条件。要为类创建代码契约不变性，请为类提供一个检查各种不变性条件的方法，并用\
  \ `ContractInvariantMethod` 特性装饰该方法。\n\n![c09f001.tif](img/c09f001.png)\n\n**图 9-1:**\
  \ 使用代码契约属性页开启代码契约。\n\n现在每当程序从类外部执行公共方法时，它会在方法调用返回后检查不变性，以确保不变性属性仍然真实。\n\n例如，假设 `Order`\
  \ 类有一个 `Customer` 属性，并且该属性在 `Order` 对象的整个生命周期内都不应为 `null`。下面的代码显示了如何使用契约在 `Order`\
  \ 类中强制执行该条件。\n\n```\nclass Order\n{\n    public List<OrderItem> Items = new List<OrderItem>();\n\
  \n    public Customer Customer { get; set; }\n\n    public Order(Customer customer)\n\
  \    {\n        Customer = customer;\n    }\n    [ContractInvariantMethod]\n   \
  \ private void CustomerIsNotNull()\n    {\n        Contract.Invariant(this.Customer\
  \ != null);\n    }\n}\n```\n\n在这里，如果 `Customer` 属性不为 `null`，则 `CustomerIsNotNull`\
  \ 方法返回 `true`。现在，主程序每次调用 Order 类的公共方法时，代码契约都会调用 `CustomerIsNotNull` 来检查此不变性是否被违反。\n\
  \n使用不变性的基本过程非常简单，但有两个重要的细节。\n\n首先，代码契约只有在类外部代码调用类的方法之一时才会检查不变性。在本例中，`Order` 类可能有将\
  \ `Customer` 属性设置为 `null` 的方法，此时不变性不会被注意到。\n\n实际上，如果类的某个公共方法调用了类的第二个方法，则在调用第二个方法后不会验证不变性。其想法是，第二个方法可能需要临时违反不变性属性，而原始方法调用将在返回之前修复这些问题。换句话说，如果类外部代码调用了\
  \ Order 类的公共方法之一，只有在最外层调用完成后才会验证不变性属性。\n\n关于不变性的第二个重要细节是，它们仅适用于公共方法。在本例中，`Order`\
  \ 类的 `Customer` 值被实现为具有 `get` 和 `set` 访问器的属性。由于访问器是方法，代码契约系统可以在它们执行后验证不变性。\n\n如果\
  \ `Customer` 值被实现为公共字段，则代码契约系统将无法在值被更改后验证不变性。\n\n有关代码契约的更多信息，请参阅 `research.microsoft.com/projects/contracts/userdoc.pdf`\
  \ 代码契约手册。\n\n### 捕获不利状况\n\n尽管你不希望不利状况发生，但通过仔细思考，你通常可以预测哪里可能会发生。通常，这些情况出现在程序必须与代码外部项进行交互时。例如，当程序需要访问文件、打印机、网页、软磁盘或\
  \ CD-ROM 时，该项目可能是不可用的。同样，每当程序从用户获取输入时，用户可能会输入无效数据。\n\n注意这与前一节描述的错误有何不同。在充分测试后，你应该发现并修复了大多数错误。任何测试都无法消除这种不利状况的可能性。无论你使用什么代码，用户都可能在程序准备好之前拔掉优盘，或在程序使用打印机时拔掉插头。\n\
  \n每当你知道可能发生不利状况时，你就应该编写代码来保护程序。在执行可能失败的操作之前先测试这些条件，比简单尝试执行操作并在程序失败时捕获错误要好得多。\n\n\
  \n\n\n\n通常，通过编写验证方法可以使错误处理变得更加简单和统一。以下方法验证一个整数值。它接收的参数包括：用于存储结果的输出变量、持有文本的 `TextBox`、值的名称以及允许的最小值和最大值。\n\
  \n```csharp\nprivate bool IsValidInteger(out int result, TextBox txt, string name,\n\
  \    int min = int.MinValue, int max = int.MaxValue)\n{\n    // 给 result 一个初始值。\n\
  \    result = int.MinValue;\n\n    // 获取文本。\n    string text = txt.Text;\n\n   \
  \ // 如果有错误，构建错误消息。\n    string message = \"\";\n    if (text.Length == 0) message\
  \ = \"请输入 \" + name + \".\";\n    else if (!int.TryParse(text, out result))\n  \
  \      message = \"解析 \" + name + \" '\" + text + \"' 错误\";\n    else if ((result\
  \ < min) || (result > max))\n        message = name + \" 必须在 \" +\n            min.ToString()\
  \ + \" 和 \" + max.ToString() + \" 之间\";\n\n    // 检查是否有错误消息。\n    if (message.Length\
  \ > 0)\n    {\n        // 显示消息，选择 TextBox 的文本，\n        // 赋予焦点，并返回 false。\n   \
  \     MessageBox.Show(message, name + \" 错误\",\n            MessageBoxButtons.OK,\
  \ MessageBoxIcon.Error);\n        txt.Select(0, text.Length);\n        txt.Focus();\n\
  \        return false;\n    }\n\n    // 值是正确的。\n    return true;\n}\n```\n\n该方法将输出值初始化为最小可能的\
  \ `int` 值。然后，它获取 `TextBox` 中的文本。\n\n接下来，代码会测试文本以检查其是否有效。如果文本为空白、无法通过 `int.TryParse`\
  \ 解析，或者超出允许范围，该方法将组合相应的错误消息。\n\n在测试完成后，该方法会检查是否有非空错误消息。如果消息不为空，该方法将显示错误消息，选择 `TextBox`\
  \ 中的文本，为 `TextBox` 设置焦点，并返回 `false` 以告知调用代码该值无效。\n\n如果错误消息为空，该方法返回 `true` 以告知调用代码该值有效。\n\
  \n示例程序 `ValidateInteger` 所示 图 9-2，并可在书籍网站上下载，它使用 `IsValidInteger` 方法来验证三个 `TextBox`\
  \ 中的值。\n\n![c09f002.tif](img/c09f002.png)\n\n**图 9-2：** ValidateInteger 示例程序验证三个\
  \ TextBox 中的值。\n\n以下代码显示了 `ValidateInteger` 程序如何使用 `IsValidInteger` 方法。\n\n```csharp\n\
  // 验证值。\nprivate void validateButton_Click(object sender, EventArgs e)\n{\n    int\
  \ oneToTen, year, positive;\n\n    // 验证输入。\n    if (!IsValidInteger(out oneToTen,\
  \ oneToTenTextBox, \"Value\", 1, 10)) return;\n    if (!IsValidInteger(out year,\
  \ yearTextBox, \"Year\", 2000, 2020)) return;\n    if (!IsValidInteger(out positive,\
  \ positiveTextBox, \"Positive Value\", 1))\n        return;\n\n    // 在“真实”应用中，你在这里执行其他处理。\n\
  \    // ...\n\n    MessageBox.Show(\"OK\");\n}\n```\n\n此代码调用了 `IsValidInteger` 三次，如果其中任何一次调用返回\
  \ `false`，则返回。如果所有对 `IsValidInteger` 的调用都返回 `true`，则所有值都是有效的，程序继续处理它们。\n\n你可以编写类似的方法来验证其他类型的数据字段，例如电话号码、电子邮件、街道地址等。\n\
  \n### 全局异常处理\n\n通常，你应该尝试尽可能靠近错误发生的地方捕获错误。如果你在错误发生的方法中立即捕获它，修复起来最容易。\n\n然而， 往往出现在意想不到的地方。除非你为每个方法都编写了错误处理代码（这相当常见的策略），否则\
  \ bug 可能会出现在你未保护的代码中。\n\n当你编写全局异常处理器时，你可能不知道异常将在何处发生，因此很难确定如何保持程序有效运行。你可以在关闭程序之前记录错误、在必要时保存数据，并可能向用户显示消息。你可以让程序尝试忽略错误并继续运行，但实际上解决该问题可能会困难。\n\
  \n你如何安装全局错误处理器取决于你运行的程序类型。以下章节解释了如何为 Windows Forms、WPF 和控制台应用程序安装全局异常处理器。\n\n注意，全局异常处理器在\
  \ Visual Studio 内部不起作用。在这三类程序中，如果程序抛出未处理的异常，Visual Studio 会介入并捕获错误。要测试程序，你需要在 Visual\
  \ Studio 之外运行编译后的可执行程序。\n\n#### Windows Forms 应用程序\n\n要在 Windows Forms 应用程序中捕获未处理的异常，向\
  \ `Application` 对象的 `ThreadException` 事件添加事件处理程序。`WindowsFormsGlobalException`示例程序可在书籍网站下载，它使用以下代码来安装其事件处理程序。\n\
  \n```csharp\n// 安装全局异常处理器。\nprivate void Form1_Load(object sender, EventArgs e)\n\
  {\n    Application.ThreadException += ThreadException;\n}\n```\n\n以下代码显示了示例程序的 `ThreadException`\
  \ 事件处理程序。\n\n```csharp\n// 处理全局异常。\nprivate static void ThreadException(object sender,\
  \ ThreadExceptionEventArgs e)\n{\n    try\n    {\n        string message = e.Exception.Message\
  \ + '\\n' +\n            \"你想继续运行吗？\";\n        if (MessageBox.Show(message, \"\
  未处理异常\",\n            MessageBoxButton.YesNo, MessageBoxImage.Stop) == MessageBoxResult.No)\n\
  \        {\n            Application.Current.Shutdown();\n        }\n    }\n    catch\n\
  \    {\n        Application.Current.Shutdown();\n    }\n}\n```\n\n事件处理程序在 `try catch`\
  \ 块中执行所有工作。如果发生任何问题，代码将关闭应用程序。代码构建并显示描述异常的消息，并询问用户是否应该继续。（你可能还希望将错误以及堆栈跟踪记录到日志文件或系统日志中）。如果用户点击“否”，方法调用\
  \ `Application.Exit` 结束程序。\n\n如果用户点击“是”，程序继续运行。\n\n当你点击程序的异常按钮时，执行以下代码。\n\n```csharp\n\
  // 抛出异常。\nprivate void throwExceptionButton_Click(object sender, EventArgs e)\n\
  {\n    throw new ArgumentException();\n}\n```\n\n此代码简单的抛出一个 `ArgumentException`。由于代码没有使用\
  \ `try catch` 块，全局异常处理器将其捕获。\n\n#### WPF 应用程序要在 WPF 应用程序中捕获未处理的异常，向 `Application.Current`\
  \ 对象的 `DispatcherUnhandledException` 事件添加事件处理程序。`WpfGlobalException`示例程序可在书籍网站下载，它使用以下代码安装其事件处理程序。\n\
  \n```csharp\n// 安装全局异常处理器。\nprivate void Window_Loaded(object sender, RoutedEventArgs\
  \ e)\n{\n    Application.Current.DispatcherUnhandledException += UnhandledException;\n\
  }\n```\n\n以下代码显示了示例程序的 `UnhandledException` 事件处理程序。\n\n```csharp\n// 处理全局异常。\nprivate\
  \ void UnhandledException(object sender, DispatcherUnhandledExceptionEventArgs e)\n\
  {\n    try\n    {\n        string message = e.Exception.Message + '\\n' +\n    \
  \        \"你想继续运行吗？\";\n        if (MessageBox.Show(message, \"未处理异常\",\n      \
  \      MessageBoxButton.YesNo, MessageBoxImage.Stop) == MessageBoxResult.No)\n \
  \       {\n            Application.Current.Shutdown();\n        }\n        e.Handled\
  \ = true;\n    }\n    catch\n    {\n        Application.Current.Shutdown();\n  \
  \  }\n}\n```\n\n\n\n\n此事件处理程序与上一个示例使用的相似。大部分区别在于此版本执行与上一个版本相同任务时使用的常量和方法调用。\n\n\
  一个重要的区别是以下语句：\n\n```\ne.Handled = true;\n```\n\n该语句告诉程序事件已经处理，程序不需要关闭。在 `Windows\
  \ Forms` 应用程序中，继续执行是默认操作；在 `WPF` 应用程序中，关闭是默认操作。\n\n当你点击程序的 `Throw Exception`（抛出异常）按钮时，将执行以下代码：\n\
  \n```\n// Throw an exception.\nprivate void throwExceptionButton_Click(object sender,\
  \ RoutedEventArgs e)\n{\n    throw new ArgumentException();\n}\n```\n\n这与 Windows\
  \ Forms 示例中的代码相似。唯一的区别是，此版本的第二个参数接收的是一个 `RoutedEventArgs` 对象，而不是 `EventArgs` 对象。\n\
  \n### 控制台应用程序\n\n要捕获控制台应用程序中未处理的异常，请向 `AppDomain.CurrentDomain` 对象的 `UnhandledException`\
  \ 事件添加事件处理程序。可以在书籍网站下载的 `ConsoleGlobalException` 示例程序使用的 `Main` 方法安装了该事件处理程序，并进入了一个循环，直到程序结束。\n\
  \n```\nstatic void Main(string[] args)\n{\n    // Install the event handler.\n \
  \   AppDomain.CurrentDomain.UnhandledException += UnhandledException;\n\n    //\
  \ Loop forever.\n    for (; ; )\n    {\n        Console.WriteLine(\"1 - Continue,\
  \ 2 - Throw exception, 3 - Exit\");\n        Console.Write(\"> \");\n        string\
  \ text = Console.ReadLine();\n        int choice = int.Parse(text);\n\n        switch\
  \ (choice)\n        {\n            case 1:\n                // Continue.\n     \
  \           Console.WriteLine(\"Continuing...\\n\");\n                break;\n\n\
  \            case 2:\n                // Throw an exception.\n                Console.WriteLine(\"\
  Throwing exception...\\n\");\n                throw new ArgumentException();\n\n\
  \            case 3:\n                // Exit.\n                return;\n      \
  \  }\n    }\n}\n```\n\n该方法安装了程序的事件处理程序，然后进入无限循环。在每次循环中，该方法都会显示提示并等待用户输入。它解析输入并使用\
  \ `switch` 语句决定下一步做什么。\n\n如果用户输入 1，程序将显示消息并继续循环。如果用户输入 2，程序将抛出异常。如果用户输入 3，程序将退出\
  \ `Main` 方法并结束。\n\n以下代码显示了示例程序的 `UnhandledException` 事件处理程序。\n\n```\n// Handle an\
  \ exception.\nprivate static void UnhandledException(object sender,\n    UnhandledExceptionEventArgs\
  \ e)\n{\n    Console.WriteLine(\"Caught exception:\");\n    Exception exception\
  \ = (Exception)e.ExceptionObject;\n    Console.WriteLine(exception.Message);\n \
  \   Console.WriteLine(\"\\n\\n\\nPress Enter to close the application\");\n    Console.ReadLine();\n\
  }\n```\n\n此事件处理程序与之前的两个在两个主要方面不同。首先，这是一个控制台应用程序，因此它不是显示消息框，而是通过控制台窗口与用户通信。\n\n其次，此事件处理程序无法防止应用程序结束。（尽管你可以在\
  \ `Main` 方法中使用 `try catch` 块来捕获异常并尝试让程序继续运行。）\n\n`图 9-3` 显示了 `ConsoleGlobalException`\
  \ 示例程序在捕获异常后的状态。最初，事件处理程序显示了从 `Throwing Exception` 开始到以 `Press Enter to Close the\
  \ Application` 结束的信息。当你按下回车键时，系统会自动显示以下文本和 `ConsoleGlobalException Has Stopped Working`\
  \ 对话框。\n\n![c09f003.tif](img/c09f003.png)\n\n**图 9-3：** `UnhandledException` 事件处理程序无法阻止控制台应用程序关闭。\n\
  \n## try catch 块\n\n`try catch` 块为 C# 程序提供了结构化的错误处理。语法如下：\n\n```\ntry\n{\ntryStatements...\n\
  }\ncatch (exceptionType1 variable1)\n{\nexceptionStatements1...\n}\ncatch (exceptionType2\
  \ variable2)\n{\nexceptionStatements2...\n}\n...\ncatch\n{\nfinalExceptionStatements...\n\
  }\nfinally\n{\nfinallyStatements...\n}\n```\n\n程序执行 `tryStatements` 块中的代码。如果该代码的任何部分抛出异常，程序将跳转到第一个\
  \ `catch` 块。\n\n如果异常匹配 `exceptionType1`，程序将执行 `exceptionStatements1` 中的代码。异常类型可能与\
  \ `catch` 语句的异常类完全匹配，也可能是所列类的子类。\n\n例如，假设 `tryStatements` 块执行了一个除以零的整数计算。这会引发 `DivideByZeroException`。该类继承自\
  \ `ArithmeticException` 类，该类又继承自 `SystemException`，而该类又继承自 `Exception`。这意味着代码将停止在第一个寻找\
  \ `DivideByZeroException`、`ArithmeticException`、`SystemException` 或 `Exception`\
  \ 的 `catch` 语句。\n\n如果抛出的异常不匹配第一个异常类型，程序将检查下一个 `catch` 语句。程序将继续将异常与 `catch` 语句进行比较，直到找到适用的语句或用完所有\
  \ `catch` 语句。\n\n如果没有 `catch` 语句匹配异常，异常将“向上冒泡”到调用栈的下一层。\n\n\n\n\n\n一个 `try catch`\
  \ 块必须包含至少一个 `catch` 部分或一个 `finally` 部分；尽管这些部分并不需要包含任何代码。例如，下面的 `try catch` 块调用了\
  \ `DoSomething` 方法，并使用一个空的 `catch` 部分来忽略发生的任何错误。\n\n```\ntry\n{\n    DoSomething();\n\
  }\ncatch\n{\n}\n```\n\n### 异常对象\n\n当 `catch` 语句捕获异常时，其异常变量包含有关引发异常的错误的信息。\n\n不同的异常类可能提供不同的功能，但它们都提供了由其派生的\
  \ `Exception` 类定义的 set 功能。下表列出了最常用的 `Exception` 类属性和方法。\n\n| 项目 | 目的 |\n| :--- |\
  \ :--- |\n| `InnerException` | 引起当前异常的异常。例如，假设你编写了一个工具库，它捕获了一个异常，然后抛出一个新的自定义异常，用你的库术语描述问题。在抛出新异常之前，你应该将\
  \ `InnerException` 设置为你之前捕获的那个异常。 |\n| `Message` | 返回描述异常的简短消息。 |\n| `Source` |\
  \ 返回抛出异常的应用程序或对象的名称。 |\n| `StackTrace` | 返回包含堆栈跟踪的字符串，提供错误发生时程序的位置。 |\n| `TargetSite`\
  \ | 返回抛出异常的方法名称。 |\n| `ToString` | 返回一个描述异常并包含堆栈跟踪的字符串。 |\n\n\n\n示例程序 `ShowExceptionInfo`（可以在本书的网站下载）显示了异常的\
  \ `Message`、`StackTrace` 和 `ToString` 值。\n\n至少，程序应该记录或显示任何意外异常的 `Message` 值，以便你知道发生了什么异常。程序还可能记录\
  \ `StackTrace` 或 `ToString` 的结果，以便你可以看到异常发生的位置。\n\n`StackTrace` 和 `ToString` 值可以帮助开发者找到\
  \ bug，但这些值对终端用户来说可能是令人生畏的。即使是异常的 `Message` 属性使用的缩略格式通常对用户也没有什么用。当用户点击“查找未付发票”按钮时，“尝试除以零”这条消息实际上并不能告诉用户问题是什么，或者该如何处理。\n\
  \n当程序捕获异常时，一种良好的策略是在日志文件中记录完整的 `ToString` 消息，或通过电子邮件发送给开发者。然后显示一条用用户可以理解的术语重述错误消息。例如，程序可能会说：*无法计算未付发票总额。错误报告已发送给开发团队。*\n\
  \n程序随后应该尝试尽可能顺利地继续运行。它可能无法完成此计算，但不应该崩溃，并且应该允许用户可能继续处理其他任务。\n\n### 抛出异常\n\n除了捕获异常外，你的程序可能还需要生成自己的异常。由于处理异常被称为*捕获*（catching），因此引发异常被称为*抛出*（throwing）。（这只是一个幼稚的双关语。人们也会捕捉狮子和感冒，但我认为没多少人会扔它们。不过，这个词用起来也行。）\n\
  \n要抛出异常，程序会创建一个想要生成的异常类型的实例，，并向构造函数传递描述问题的额外信息。然后程序可以根据需要设置其他异常字段。例如，它可能会设置异常的 `Source`\
  \ 属性，告诉捕获错误的代码错误发生的源头。然后程序使用 `throw` 语句抛出异常。如果调用栈中的某处有一个激活的错误处理器，C# 将跳转到该点并由错误处理器处理异常。\n\
  \n示例程序 `DrawableRect`（可以在本书的网站下载）使用以下代码来显示 `DrawableRectangle` 类如何保护自己不受无效输入的影响。\n\
  \n```\nclass DrawableRectangle\n{\n    public DrawableRectangle(int x, int y, int\
  \ width, int height)\n    {\n        // 验证 new_width > 0.\n        if (width <=\
  \ 0)\n        {\n            throw new ArgumentException(\n                \"DrawableRectangle\
  \ width must be greater than zero\",\n                    \"width\");\n        }\n\
  \n        // 验证 new_height > 0.\n        if (height <= 0)\n        {\n         \
  \   throw new ArgumentException(\n                \"DrawableRectangle height must\
  \ be greater than zero\",\n                    \"height\");\n        }\n\n     \
  \   // 保存参数值。\n        //...\n    }\n\n    // 省略该类的代码。\n    //...\n}\n```\n\n类的构造函数接受四个参数：`X`\
  \ 和 `Y` 位置，以及宽度和高度。如果新对象的宽度小于或等于零，程序会创建一个新的 `ArgumentException` 对象。它向异常构造函数传递错误描述和无效参数的名称。在创建异常对象后，程序使用\
  \ `throw` 语句抛出异常。代码以类似的方式检查新对象的高度。\n\n下面的代码显示了程序如何使用 `try catch` 块在创建新的 `DrawableRectangle`\
  \ 对象时保护自己。\n\n```\ntry\n{\n    DrawableRectangle rect = new DrawableRectangle(10,\
  \ 20, 0, -100);\n}\ncatch (Exception ex)\n{\n    MessageBox.Show(ex.Message);\n\
  }\n```\n\n当你的应用程序需要抛出异常时，最简单的方法是使用现有的异常类。有几种方法获取异常类列表，以便你可以找到适合你应用程序的类。[附录 O15，“常用异常类”列出了一些更多的异常类。关于“Visual\
  \ Basic 中的异常处理”的在线帮助 [`msdn.microsoft.com/aa2905.aspx`](http://msdn.microsoft.com/aa2905.aspx)\
  \ 也有很好的列表。微软的网页 [`msdn.microsoft.com/system.exception_derivedpelist.aspx`](http://msdn.microsoft.com/system.exception_derivedpelist.aspx)\
  \ 提供了派自 `Exception` 类的异常长列表。\n\n寻找异常类的另一种方法是打开对象生成器（选择 View ⇒ Object Browser）并搜索\
  \ `Exception`。\n\n当你抛出异常时，必须对选择这些类进行判断。例如，当 C# 尝试将方法调用绑定对象方法并确定使用哪个重载方法时，会使用 `System.Reflection.AmbiguousMatchException`\
  \ 类。这发生在比你的程序更低的级别，因此你不会按照原始意图使用它，但抛出该异常仍然可能有用。例如，如果你的程序解析字符串并根据字符串无法决定采取什么行动，你可以使用该类来表示错误，尽管你不是按照最初的设计使用它。\n\
  \n尽可能使用最具体的异常类。使用更通用的类（如 `Exception`）会让开发者更难理解和定位错误。如果你找不到合适的特定异常，创建一个自定义异常，如本章后面“自定义异常”节所述。\n\
  \n### 重新抛出异常\n\n有时当你捕获异常时，无法完全处理问题。在这种情况下，重新抛出异常可能是合理的，以便调用栈中更高处的方法可以尝试处理。\n\n要按捕获错误时的重新抛出错误，只需使用\
  \ `throw` 关键字，如下例所示。\n\n```\ntry\n{\n    // 在此处执行一些困难的操作。\n    ...\n}\ncatch (ArithmeticException\
  \ ex)\n{\n    // 我们可以处理此异常。修复它。\n    ...\n}\ncatch\n{\n    // 我们不知道如何处理这一个。重新抛出它。\n\
  \    throw;\n}\n```\n\n\n\n\n如果你的代码可以大致判断出错误发生的原因，但无法修复它，有时将该错误重新抛出为不同的异常类型可能是一个好主意。例如，假设某些代码导致了\
  \ `ArithmeticException`，但该异常的根本原因是无效参数。在这种情况下，抛出 `ArgumentException` 而不是 `ArithmeticException`\
  \ 更好，因为这可以在调用栈的更高处提供更具体的信息。\n\n然而，同时你不希望丢失原始 `ArithmeticException` 中包含的信息。解决方案是抛一个新的\
  \ `ArgumentException`，但将原始的 `ArithmeticException` 放置在它的 `InnerException` 属性中，这样捕获新异常的代码就可以访问原始信息。\n\
  \n下面的代码演示了这种技术。\n\n```\ntry\n{\n    // 在此处执行某些困难的操作。\n    ...\n}\ncatch (ArithmeticException\
  \ ex)\n{\n    // 这是由无效参数引起的。\n    // 将其作为 ArgumentException 抛出。\n    throw new ArgumentException(\"\
  Invalid argument X in function Whatever. \", ex);\n}\ncatch\n{\n    // 我们不知道该如何处理这个。将其重新抛出。\n\
  \    throw;\n}\n```\n\n### 自定义异常\n\n当你的应用程序需要抛出异常时，使用现有的异常类是最简单的。重用现有的异常类可以让开发者更容易理解异常的含义。它还能防止异常泛滥，即开发者可能需要监控几十或上百种奇怪的异常类型。\n\
  \n然而，有时预定义的异常并不满足你的需求。例如，假设你构建了一个包含可能存在很长时间的数据。如果程序尝试使用一个很长时间未刷新数据的对象，你希望抛出某种“数据过期”异常。你可以将它强塞进\
  \ `System.TimeoutException` 类中，但该异常并不完全适用于这种用途。在这种情况下，你可以构建一个自定义异常类。\n\n构建自定义异常类非常简单。创建一个继承自\
  \ `System.Exception` 类的新类。然后，提供构造方法让程序创建该类的实例。仅此而已。\n\n按照惯例，异常类的名称应该以 `Exception`\
  \ 单词结尾。同样按照惯例，你应该提供至少三个重载的构造函数，供开发者在创建类的新实例时使用。（有关构造函数是什么以及如何定义它们的更多信息，请参阅第 12 章“类和结构”中的“构造函数”章节。）\n\
  \n第一个构造函数不带参数，并使用描述通用错误类型的默认消息来初始化异常。\n\n另外两个版本将错误消息作为参数，以及错误消息加上一个内部异常对象作为参数。这些构造函数将其参数传递给基类的构造函数，以适当地初始化对象。\n\
  \n为了完整起见，你也可以创建一个接受 `SerializationInfo` 对象和 `StreamingContext` 对象作为参数的构造函数。此版本也可以将其参数传递给基类构造函数以初始化异常对象，因此你不需要对参数进行任何特殊处理。（如果异常将被序列化和反序列化，则此构造函数有用。如果你不确定是否需要此构造函数，可能就不需要。但是如果你包含了它，你需要在异常类文件中导入\
  \ `System.Runtime.Serialization` 命名空间以定义 `SerializationInfo` 和 `StreamingContext`\
  \ 类。）\n\n示例程序 `CustomException`（可以在书籍网站下载）使用了以下代码来定义 `ObjectExpiredException` 类。\n\
  \n```\nclass ObjectExpiredException : Exception\n{\n    // 无参数。使用默认消息。\n    public\
  \ ObjectExpiredException()\n        : base(\"This object has expired\")\n    {\n\
  \    }\n\n    // 设置消息。\n    public ObjectExpiredException(string message)\n    \
  \    : base(message)\n    {\n    }\n\n    // 设置消息和内部异常。\n    public ObjectExpiredException(string\
  \ message, Exception innerException)\n        : base(message, innerException)\n\
  \    {\n    }\n\n    //  SerializationInfo 对象和 StreamingContext 对象。\n    public\
  \ ObjectExpiredException(SerializationInfo info,\n      StreamingContext context)\n\
  \        : base(info, context)\n    {\n    }\n}\n```\n\n定义异常类后，你就可以像抛出和捕获 C# 定义的任何异常类一样来处理它。例如，以下代码抛出了\
  \ `ObjectExpiredException`。\n\n```\nthrow new ObjectExpiredException(\"This Customer\
  \ object has expired.\");\n```\n\n父类 `System.Exception` 自动处理对象的 `Message`、`StackTrace`\
  \ 和 `ToString` 属性，因此你不需要自己实现它们。\n\n## 总结\n\n在实践中，要预测大型应用程序中可能发生的每一种是非常是非常的。你应该尝试预测尽可能错误的情况，但也应该为不可预见的错误做好计划。你应该编写错误检查代码，在错误发生时使其显而易见，并在可能的情况下从中恢复。你可能无法预见到每一个可能的\
  \ bug，但通过一点思考，你可以让程序检测并报告明显错误的值。\n\n你还应该寻找未计划的情况（例如，用户在社会安全号码字段中输入电话号码），并让程序优雅地做出反应。你的程序无法控制环境中的一切（例如，用户操作、打印机状态和网络连接），但它应该在情况不完全符合预期时做好工作准备。\n\
  \n你可能永远无法移除 100,000 行程序中的最后一个 bug，但你可以让任何剩余的 bug 变得无害，并且出现频率极低，以至于用户可以安全工作。\n\n\
  Visual Studio 提供了一套丰富的调试工具。使用开发环境，你可以在代码的不同行停止程序检查变量、更改变量值、查看调用栈并调用方法以执行应用程序的不同部分。你可以逐步执行程序，每次执行一条语句查看其操作。你甚至可以对源代码进行某些修改并让程序继续运行。第\
  \ 10 章“跟踪和调试”描述了你可以用于调试应用程序的工具和技术。\n\n## 练习题\n\n1.  考虑以下 `Student` 类。\n\n    ```\n\
  \    public class Student\n    {\n        public string Name;\n        public List<Course>\
  \ Courses = new List<Course>();\n\n        // 构造函数\n        public Student(string\
  \ name)\n        {\n            Name = name;\n        }\n    }\n    ```\n\n    在类中添加\
  \ `Debug.Assert` 语句以要求以下条件：\n\n    *   `Name` 属性必须至少包含 1 个字符。\n    *   `Courses`\
  \ 值永远不能为 `null`。（尽管列表可以为空。）\n\n2.  使用代码契约的前提条件和后条件代替 `Debug.Assert` 语句来重复练习 1。\n\
  \n3.  使用代码契约的不变性代替前提条件、后条件或 `Debug.Assert` 语句来重复练习 1。\n\n4.  假设你预判到主程序可能会尝试违反练习\
  \ 1 中列出的条件。与与其使用 `Debug.Assert` 或代码契约在测试期间捕获这些情况，你希望抛出异常并让主程序捕获它们。重复练习 1 以实现这一目标。\n\
  \n\n\n5. 本章前面的“控制台应用程序”节展示了一个控制台应用程序，当在控制台窗口中输入值 2 时，它会抛出一个异常。你能想到其他任何方法来让程序抛出异常吗？\n\
  \n6. 重写练习 5 中描述的程序，使其能够处理任何输入而不会抛出异常（输入 2 除外，输入 2 应该抛出异常）。\n\n7. 本章前面的“控制台应用程序”节中描述的程序使用\
  \ `UnhandledException` 事件处理器来捕获未处理的异常。然而，控制台应用程序中的所有代码都是直接或间接地从 `Main` 方法运行的。这意味着你可以在方法中放置一个\
  \ `try catch` 块，以捕获所有在其他地方未被处理的异常。\n\n    重写该节中展示的示例以使用这种技术。与使用 `UnhandledException`\
  \ 事件处理器相比，这种方法的优缺点分别什么？\n\n8. 假设 `Factorial` 程序使用了以下代码。\n\n```cpp\n// 计算输入的数字阶阶。\n\
  private void calculateButton_Click(object sender, EventArgs e)\n{\n    long number\
  \ = long.Parse(numberTextBox.Text);\n    resultLabel.Text = Factorial(number).ToString();\n\
  }\n\n// 返回 number!\nprivate long Factorial(long number)\n{\n    long result = 1;\n\
  \    for (long i = 2; i <= number; i++) result *= i;\n    return result;\n}\n```\n\
  \n在这个示例中，什么类型的错误处理语句比较合适？使用 `Debug.Assert` 有意义吗？代码合约（Code contracts）？为此代码添加适当的错误处理语句。\n\
  \n# 第 10 章：跟踪与调试\n\n### 本章内容\n* 断点\n* `Watches`（监视）和 `Autos` 窗口\n* 断点条件、命中计数和过滤器\n\
  * 启用和禁用断点\n* 调试和跟踪监听器\n\n## 本节的 Wrox.com 下载资源\n请注意，本节的所有代码示例都可以作为本节代码下载的一部分，在书籍网站的\
  \ [www.wrox.com/go/csharp5programmersref](http://www.wrox.com/go/csharp5programmersref)\
  \ 的“Download Code”选项卡中提供。\n\nVisual Studio 的代码编辑器包含了帮助你避免 bug 的工具。编辑器帮助你执行的一些操作包括：\n\
  * 提供 `IntelliSense` 以帮助你正确使用方法和参数\n* 识别在初始化之前使用的变量或已声明但从未使用的变量\n* 检测不可达的代码\n* 标记具有非\
  \ `void` 返回类型且在所有代码路径上都没有返回值的方法\n* 提供重命名工具，以便你可以轻松重命名对象而不会丢失引用\n\n然而，尽管有这些工具，编程中的\
  \ bug 就像死亡和税收一样是必然的。虽然从理论上讲，程序可能是没有 bug 的，但任何非平凡的程序都包含 bug 的概率很大。实际上，在某些测试策略中，程序包含\
  \ bug 是一个公理。目标不是修复每一个 bug，而是修复足够多的 bug，以至于剩下的 bug 极罕发生。\n\n尽管此书是关于 C# 语言而不是 Visual\
  \ Studio，但任何相当完整的 C# 书籍都应该对调试工具和技术进行一些介绍。本章简要描述了 Visual Studio 提供的一些帮助你跟踪和消除 bug\
  \ 的工具。它还解释了你可以使用的跟踪方法，以弄清楚程序正在做什么，并尽可能发现它哪里做错了。\n\n## 调试 (Debug) 菜单\n调试菜单包含了在调试程序时通常很有用的命令。它们包含了设置和清除断点的命令，这是\
  \ Visual Studio 最实用的功能之一。\n\n断点是代码中被标记为挂起执行的地方。当程序运行到标记有断点的行时，执行将暂停，以便你检查程序的状态。在执行暂停期间，你可以悬停在变量上查看它们的值，在\
  \ `Immediate`（立即）窗口中输入表达式以对其进行求值，并通过在 `Immediate` 窗口中为变量设置新值来更改值。你甚至可以在某种程度上编辑代码然后继续运行。\n\
  \n要设置断点，将光标置于代码编辑器中你想要暂停执行的行上。然后按 `F9` 或点击代码行左侧的边距来创建断点。要删除断点，将光标置于该行上，再次按 `F9`\
  \ 或再次点击边距。\n\n`Debug` 窗口中显示的命令取决于几个条件，例如你打开的文件类型、程序是否正在运行、光标所在的代码行以及该行是否包含断点。以下列表简要总结了在执行停止在断点时，调试菜单中提供的最重要的项目。\n\
  \n* **Windows**—此子菜单的命令显示其他与调试相关的窗口。下一节描述了该菜单最有用的命令。\n* **Continue** (F5)—此命令让程序继续执行，直到其完成或到达另一个断点。\n\
  * **Break All** (Ctrl+Break)—此命令暂停程序的执行。然后你可以检查程序的状态，检查并更改变量的值，并在恢复执行之前修改代码。\n*\
  \ **Stop Debugging** (Ctrl+Alt+Break)—此命令停止程序并结束其调试会话。注意，这会立即停止程序，因此它没有机会运行关闭事件处理程序以及它在正常停止时会运行的任何清理代码。\n\
  * **Step Into** (F8 或 F11)1—此命令让调试器执行当前行代码。如果该代码调用了一个方法，调试器将进入该方法。\n* **Step Over**\
  \ (Shift+F8 或 F10)—此命令让调试器执行当前行代码。如果该代码调用了一个方法，调试器将跳过该方法。（如果该方法包含断点，执行将暂停。）\n* **Step\
  \ Out** (Ctrl+Shift+F8)—此命令让调试器运行直到离开当前正在执行的方法（或到达断点）。当程序到达调用此方法的代码行时执行暂停。\n* **QuickWatch**\
  \ (Shift+F9)—此命令显示一个对话框，提供有关选取代码对象的信息。如果对象是变量，对话框允许你对其重新求值或更改其值。点击添加监视按钮将其添加到监视窗口。（有关监视窗口的更多信息，请参见下一节的\
  \ `Watch` 项。）\n* **Exceptions** (Ctrl+Alt+E)—此命令显示图 10-1 所示的对话框。使用该对话框在抛出或未处理特定异常时停止调试器。\n\
  * **Toggle Breakpoint** (F9)—切换当前代码行是否包含断点。\n* **New Breakpoint**—此子菜单的唯一命令 `Break\
  \ At Function` (`Ctrl+B`) 显示一个对话框，允许你指定一个函数以及该函数内程序应该中断的行。\n* **Delete All Breakpoints**\
  \ (Ctrl+Shift+F9)—此命令从整个解决方案中删除所有断点。\n* **Enable All Breakpoints**—启用所有禁用的断点。\n\
  * **Disable All Breakpoints**—此命令禁用所有断点，但将其保留在解决方案中，以便以后重新启用。（你可以通过右键点击断点边距并选择禁用断点来禁用单个断点。）\n\
  \n## 调试 ⇒ Windows 子菜单\n\n\n\n\n\n调试（Debug）菜单下的 Windows 子菜单包含显示调试相关窗口的命令。以下列表简要描述了这些窗口中最用的部分。接下来的章节将提供有关断点（Breakpoints）、命令（Command）和立即执行（Immediate）窗口的详细信息。\n\
  \n*   `Immediate` (Ctrl+G)—此窗口允许你检查变量并执行 C# 语句。本章后面的“立即执行窗口（The Immediate Window）”部分将详细介绍此窗口。\n\
  *   `Locals` (Ctrl+Alt+V, L)—此窗口显示在本地上下文中定义的变量的值。要更改值，请点击变量并输入新值。点击对象等复杂值左侧的加号和减号可以展开或折叠该值。\n\
  *   `Breakpoints` (Ctrl+Alt+B)—此窗口（如图图 10-2\n    **图 10-2:** 断点窗口帮助你管理断点。\n*   `Output`—此窗口显示由`Console`语句产生的输出。\n\
  *   `Autos` (Ctrl+Alt+V, A)—此窗口显示在当前和上一行代码中使用的本地和全局变量的值。\n*   `Call Stack` (Ctrl+L)—此窗口列出了调用其他方法以到达程序当前执行点的方法。双击某行可以跳转到程序调用栈中相应的代码。\n\
  *   `Watch`—监视（Watch）子菜单包含命令 `Watch 1`、`Watch 2`、`Watch 3` 和 `Watch 4`。这些命令显示四个不同的监视窗口，在程序暂停时显示变量和表达式的值。当你使用上一节描述的\
  \ `QuickWatch` 命令创建监视项时，新的监视项将放置在 `Watch 1` 中。你可以点击并拖动监视项从一个窗口到另一个窗口，从而在第二个窗口中创建该项的副本。\n\
  *   `Modules`—此窗口显示程序使用的 DLL 和 EXE 文件信息。它显示每个模块的文件名和路径；它是否经过优化；它是否是你的代码（而不是安装的库）；以及是否加载了调试符号。它还显示了每个模块的加载顺序（编号小的模块先加载）、版本和时间戳。\n\
  \n通常，让可见的调试窗口占据 IDE 底部同一区域的不同标签页是很有用的。这让你能够快速方便地在它们之间切换，而不会占用过多空间。\n\n## 断点窗口\n\n\
  断点窗口列出了所有断点。如果你双击列表中的断点，可以轻松跳转到包含该断点的代码。\n\n如图图 10-2 所示，断点左侧的图标提供了其属性的信息。以下列表描述了这些图标。\n\
  \n*   实心红圆圈—这表示一个普通断点。\n*   白色加号—这表示断点被条件、命中次数或过滤器修改过。下文描述了这些内容。\n*   菱形—这表示断点在到达时会执行某些特殊操作。通常情况下，该操作会在立即执行窗口中打印你指定的值。\n\
  *   空心圆圈或菱形—这表示断点已被禁用。\n\n右键点击断点并选择 `Condition`（条件），显示如图图 10-3 所示的对话框。默认情况下，断点每次到达时都会暂停执行。你可以使用此对话框添加附加条件，以决定断点在到达时是否暂停程序。在图\
  \ 10-3 中，当代码到达断点时，如果表达式 `(number < 10) && (i > 5)` 为 `true`，则断点将暂停执行。\n\n![c10f003.tif](img/c10f003.png)\n\
  \n**图 10-3:** 断点条件对话框允许你指定条件，以决定执行是否在断点处暂停。\n\n右键点击断点并选择 `Hit Count`（命中次数），显示断点命中次数对话框，如图图\
  \ 10-4 所示。代码每次到达断点时，断点的命中次数都会加 1。你可以使用此对话框让断点在达到特定次数、某些次数的倍数或至少达到某些次数时中断执行。\n\n\
  ![c10f004.tif](img/c10f004.png)\n\n**图 10-4:** 断点命中次数对话框允许你让断点中断执行。\n\n右键点击断点并选择\
  \ `Filter`（过滤器），显示如图图 10-5 所示的断点过滤器对话框。你可以输入一个表达式，让断点仅针对特定的机器、进程或线程暂停。\n\n![c10f005.tif](img/c10f005.png)\n\
  \n**图 10-5:** 断点过滤器对话框允许你让断点的激活取决于机器、进程或线程。\n\n右键点击断点并选择 `Hit Count`（命中次数），显示断点命中次数对话框，如图图\
  \ 10-6 所示。在这里你可以指定调试器在断点激活时采取的操作。勾选 `Print a Message`（打印消息）复框可以让程序显示消息。勾选 `Continue\
  \ Execution`（继续执行）框框可以让程序继续运行。\n\n![c10f006.tif](img/c10f006.png)\n\n**图 10-6:**\
  \ 断点命中次数对话框允许你让断点中断执行。\n\n## 立即执行窗口\n\n立即执行窗口允许你在程序调试器停止运行时评估表达式并执行命令。其中最有用的命令之一显示变量或表达式的值。只需输入变量或表达式并按回车即可查看其值。\n\
  \n你还可以在立即执行窗口设置变量的值。只需输入变量名、等号和新值。例如，语句 `Width = 300` 将 `Width` 设置为 300。如果代码在 Windows\
  \ Form 中运行且没有定义其他名为 `Width` 的变量，这将设置表单的宽度 300。\n\n除了查看和修改变量值外，立即执行窗口允许你执行方法以便轻松测试。例如，假设你写了一个\
  \ `CheckPrinter` 方法。那么你可以在立即执行窗口中输入 `CheckPrinter()` 来执行该方法。\n\n`Debug` 和 `Trace`\
  \ 类提供了许多方法，如 `Write` 和 `WriteLine`，用于显示输出。它们让你的程序能够显示其正在执行的信息。\n\n\n\n\n当你最初为 C#\
  \ 配置 Visual Studio 时，这些信息会被写入“立即窗口”（Immediate window）。你可以通过两种方式更改此行为。首先，你可以选择工具（Tools）⇒\
  \ 选项（Options），进入调试（Debugging），并选择常规（General）。如果你取消勾选“将所有输出窗口文本重定向到立即窗口”选项，`Debug`\
  \ 和 `Trace` 写入方法将输出发送到“输出”窗口而不是“立即窗口”（尽管该选项说它重定向所有输出，但实际上它只重定向 `Debug` 和 `Trace`\
  \ 输出，而不是由 `Console.WriteLine` 等 `Console` 方法生成的输出。）\n\n更改 `Debug` 和 `Trace` 输出去处的第二种方法是实现跟踪监听器（trace\
  \ listeners）。这是一项有用且足够复杂的技巧，将在下一节中进行描述。\n\n## 跟踪监听器 (Trace Listeners)\n\n前几节描述的断点对于弄程序正在做什么非常有帮助。它们允许你在代码执行时逐行通过，以查看程序执行了哪些步骤以及变量中包含哪些值。\n\
  \n然而，有时断点可能会干扰程序的运行，从而阻止你观察它的正常行为。例如，如果程序使用事件处理器来跟踪鼠标位置，断点会停止事件处理器，导致程序无法再次跟踪鼠标。\n\
  \n有时很难预测错误何时会发生。例如，如果一个程序在运行几小时后才遇到 bug，那么一直逐行执行代码直到错误发生可能是不实际的。\n\n在这种情况下，最好在事件发生时将其记录在日志或文本文件中，稍后查看记录。默认情况下，`Trace`\
  \ 和 `Debug` 类将其输出发送到立即窗口或控制台窗口。然而，这些类共享一个 `Listeners` 集合，该集合用于跟踪接收这些输出的监听器对象。\n\n\
  最初，该集合持有 `DefaultTraceListener` 对象，但你可以根据需要删除该对象或添加新的监听器。其他监听器可以将输出发送到其他位置，例如日志文件、系统事件日志或文本文件。\n\
  \n.NET Framework 提供了以下三种类型的跟踪监听器类。\n\n* `ConsoleTraceListener`—将输出发送到控制台窗口\n* `EventLogTraceListener`—将输出发送到事件日志\n\
  * `TextWriterTraceListener`—将输出发送到流，例如 `FileStream`\n\n在书籍网站上下载的 `TraceIntoTextFile`\
  \ 示例程序使用了以下代码来演示跟踪监听器。\n\n```c\nprivate void Form1_Load(object sender, EventArgs\
  \ e)\n{\n    // 创建跟踪输出文件。 \n    Stream stream = File.Create(\"DebugLog.txt\");\n\
  \n    // 为跟踪输出文件创建一个 TextWriterTraceListener。 \n    Debug.Listeners.Add(new TextWriterTraceListener(stream));\n\
  \n    // 向跟踪文件中写入启动备注。 \n    Debug.WriteLine(DateTime.Now.ToString() + \": Debugging\
  \ session started\");\n}\n\n// 创建并处理一个学生。\nprivate void processButton_Click(object\
  \ sender, EventArgs e)\n{\n    Student student = new Student()\n    {\n        FirstName\
  \ = firstNameTextBox.Text,\n        LastName = lastNameTextBox.Text,\n        Street\
  \ = streetTextBox.Text,\n        City = cityTextBox.Text,\n        State = stateTextBox.Text,\n\
  \        Zip = zipTextBox.Text\n    };\n    ProcessStudent(student);\n}\n\n// 处理一个学生。\n\
  private void ProcessStudent(Student student)\n{\n    Debug.WriteLine(\"ProcessStudent\"\
  );\n    Debug.Indent();\n    Debug.WriteLine(\"Name:    \" + student.FirstName +\
  \ \" \" + student.LastName);\n    Debug.WriteLine(\"Address: \" + student.Street);\n\
  \    Debug.WriteLine(\"         \" + student.City + \" \" + student.State + \" \"\
  \ +\n        student.Zip);\n    Debug.Unindent();\n\n    ///... 在此处处理学生...\n}\n\n\
  // 关闭 Debug 跟踪文件。\nprivate void Form1_FormClosing(object sender, FormClosingEventArgs\
  \ e)\n{\n    Debug.WriteLine(DateTime.Now.ToString() + \": Debugging session ended\"\
  );\n    Debug.Close();\n}\n```\n\n当表单加载时，程序会创建一个名为 `DebugLog.txt` 的文件。它使用该文件的流创建一个新的\
  \ `TextWriterTraceListener`，并将其添加到 `Debug` 对象的 `Listeners` 集合中。\n\n程序随后使用 `Debug.WriteLine`\
  \ 写入开始消息。由于 `Debug` 对象的 `Listeners` 集合中除了新的 `TextWriterTraceListener` 之外还包含默认监听器，因此该消息会显示在立即窗口并写入文件中。\n\
  \n如果你在表单的 `TextBox` 中输入关于学生的信息，然后点击 Process 按钮，就会执行 `processButton_Click` 事件处理器。它创建了一个新的\
  \ `Student` 对象并将其传递给 `ProcessStudent` 方法。\n\n`ProcessStudent` 方法使用 `Debug` 语句在立即窗口中显示\
  \ `Student` 信息并将其写入监听器文件。该方法使用 `Debug.Indent` 和 `Debug.Unindent` 对 `Student` 信息进行缩进。\n\
  \n当你之后关闭表单时，`Form1_FormClosing` 事件处理器使用 `Debug.WriteLine` 显示结束消息。然后调用 `Debug.Close`\
  \ 刷新尚未写入监听器文件的输出并关闭文件。如果你跳过这一步，某些输出可能会丢失。\n\n以下文本显示了写入监听器文件的示例输出。\n\n```\n4/1/2014\
  \ 3:06:25 PM: Debugging session started\nProcessStudent\n    Name:    Rod Stephens\n\
  \    Address: 1337 Leet St\n             Bugsville AZ 87654\n4/1/2014 3:06:27 PM:\
  \ Debugging session ended\n```\n\n你可以对之前的程序进行一些有用的更改。首先，你可以以追加模式打开监听器文件，而不是覆盖之前的内容。其次，你可以在打开文件时允许共享，这样\
  \ Word 和记事本等其他程序可以在程序运行时查看该文件。（如果你允许共享，你需要在每次写入时都刷新输出，或将 `AutoFlush` 设置为 `true`。否则，其他程序将无法看到写入文件的最新项目。）\n\
  \n以下代码显示了如何打开监听器文件并允许共享。\n\n```csharp\n// 打开跟踪输出文件。允许共享并使用 AutoFlush。\nStream stream\
  \ = File.Open(\"DebugLog.txt\",\n    FileMode.Append, FileAccess.Write, FileShare.Read);\n\
  Debug.AutoFlush = true;\n```\n\n## 总结\n\nC# 和 Visual Studio 无法为你调试程序，但它们确实提供了你自己完成所需的工具。断点特别有用。它们允许你在选定的代码行暂停执行，以便检查程序的变量并逐行执行代码，以查看程序正在做什么，并尽可能地发现它在哪里出了错。你可以为断点设置条件，以便它们仅在特定条件下停止程序，例如当断点达到特定次数或当变量包含特定值时。\n\
  \n`Debug` 和 `Trace` 类提供了程序可以使用的方法，在立即窗口中显示诊断信息。通过向这些类添加跟踪监听器，你可以将信息保存到事件日志或文本文件等其他位置，而不会中断程序。以后你可以分析这些信息以查看程序做了什么。\n\
  \n本书第二部分“C# 语言元素”中的章节关注小型编程问题。它们解释了如何创建变量、执行计算和重载运算符；如何使用 `if`、`switch`、`for` 和\
  \ `while` 等语句控制程序流；如何使用 LINQ 选择和排列数据；以及如何使用调试和跟踪工具理解程序正在做什么并寻找 bug。\n\n\n\n\n第三部分，“面向对象编程”中的章节将进入更高的层次，描述面向对象的概念。这些章节解释了关键的面向对象概念、如何构建结构和类、如何使用集合类，以及如何使用泛型使一个类能够处理许多数据类型。\n\
  \n## 练习\n\n1. 下面代码显示了 `Factorial` 函数的递归实现。（递归意味着它调用自己。）\n\n```\nprivate long Factorial(long\
  \ number)\n{\n    if (number <= 1) return 1;\n    return number * Factorial(number\
  \ - 1);\n}\n```\n\n使用 `Debug` 类的方法来跟踪该方法的执行。每次调用 `Factorial` 方法时都应该指示它被调用的时间以及所使用的参数。在返回之前，每次调用都应该显示其结果。使用缩进以便更容易匹配调用和结果。例如，下面的文本显示了计算\
  \ `Factorial(4)` 的输出。\n\n```\nFactorial(4)\n    Factorial(3)\n        Factorial(2)\n\
  \            Factorial(1)\n            Result: 1\n        Result: 2\n    Result:\
  \ 6\nResult: 24\n```\n\n2. 修改你为练习 1 编写的程序，使得每次调用 `Factorial` 方法都像下面所示显示其参数和结果。\n\
  \n```\nFactorial(1) = 1\nFactorial(2) = 2\nFactorial(3) = 6\nFactorial(4) = 24\n\
  ```\n\n3. 你能修改你为练习 2 编写的程序，高效地使用 `Debug` 语句按照调用的顺序显示每次调用及其结果吗？例如，你能够让程序在调用 `Factorial(4)`\
  \ 时显示以下跟踪信息吗？\n\n```\nFactorial(4) = 24\nFactorial(3) = 6\nFactorial(2) = 2\nFactorial(1)\
  \ = 1\n```\n\n4. 假设你的客户坚持要求你产生与练习 3 中描述的类似的输出。修改 `Factorial` 方法以产生这种显示。（提示：你可能需要对方法进行较大的更改，例如更改其参数列表或返回值。）\n\
  \n5. `Debug` 和 `Trace` 类允许程序根据是否定义了 `DEBUG` 和 `TRACE` 预处理器符号来提供不同级别的输出。创建一个 `PrintMessage`\
  \ 方法，它接受两个参数：一个调试级别和一个消息。如果调试级别小于或等于相应的预处理器符号，则在控制台窗口中显示消息。（例如，如果定义了符号 `DEBUG2`\
  \ 且方法的调试级别小于或等于 2，则显示该消息。）\n\n将此方法与 `Debug` 和 `Trace` 类进行比较。你可以如何改进此方法？\n\n6. 构建一个程序，将\
  \ `Debug` 和 `Trace` 消息写入文件 `Messages.txt`，而不是显示在控制台或立即窗口中。以追加模式打开文件，允许只读共享，自动刷新日志文件，并在每条消息中包含时间。使用\
  \ `Debug`、`Trace` 和 `Console` 写入消息。在程序关闭文件之前，用 Microsoft Word 和记事本打开文件以验证你可以这样做。\n\
  \n7. `Debug` 和 `Trace` 类的一个局限性是它们共享同一个 `Listeners` 集合，因此你无法将 `Debug` 输出发送到一个位置而将\
  \ `Trace` 输出发送到另一个位置。编写一个名为 `LogMessage` 的方法，它接受两个参数：文件名和消息。该方法应该将当前时间加消息追加到指定的文件中。（第\
  \ 19 章，“文件系统对象”关于读写文件有许多内容。目前只需使用 `System.IO.File.AppendAllText` 向文件添加文本。）然后重写你为练习\
  \ 6 编写的程序，使用该方法将消息写入文件 `DebugLog.txt` 和 `TraceLog.txt`。\n\n# 第三部分：面向对象编程\n\n* 第\
  \ 11 章: OOP 概念\n* 第 12 章: 类与结构\n* 第 13 章: 命名空间\n* 第 14 章: 集合类\n* 第 15 章: 泛型\n\n\
  # 第 11 章：OOP 概念\n\n##章内容\n\n* 属性、方法和事件\n* 继承、细化和抽象\n* 隐藏与重写\n* 封装、信息隐藏和多态\n\n##\
  \ Wrox.com 本章下载\n\n请注意，本章的所有代码示例都可以作为本章代码下载的一部分，在书籍网站的 [www.wrox.com/go/csharp5programmersref](http://www.wrox.com/go/csharp5programmersref)\
  \ 的 Download Code 选项卡下载。\n\n本章描述了面向对象编程（OOP）的基本概念。它解释了如何定义类以及如何从一个类派生另一个类。它还描述了\
  \ OOP 语言的三个基本特性：封装、继承和多态。它解释了 C# 如何提供这些特性以及正确使用它们可以获得什么好处。\n\n## 类\n\n类是一个封装数据和行为的编程实体。类的三个主要特征是属性、方法和事件。\n\
  \n* 属性是某种数据。它可能是一个简单值（如 `string` 或 `int`），也可能是一个复杂项（如包含自己的属性、方法和事件的数组、列表）。属性决定对象的某些特征。\n\
  * 方法是执行某些操作的例程。方法让类定义的对象执行某些操作。\n* 事件提供了对象发生了某事的通知。事件可以调用其他代码，告诉程序的其他部分对象发生了某事。\n\
  \n作为一个具体的例子，想象一个代表要执行的工作的 `Job` 类。该类可能具有以下属性：\n\n| 属性 | 目的 |\n| :--- | :--- |\n\
  | `JobDescription` | 描述工作的 `string`。 |\n| `EstimatedHours` | 最初估计工作的小时。 |\n| `ActualHours`\
  \ | 花在工作上的实际小时数。 |\n| `Status` | 状态的枚举（`New`、`Assigned`、`InProgress` 或 `Complete`）。\
  \ |\n| `ActionTaken` | 描述执行的工作、安装的部件等的 `string`。 |\n| `Customer` | `Customer` 类对象，描述执行工作的客户。（该类具有\
  \ `Name`、`Address`、`PhoneNumber` 和 `ContractNumber` 等属性。） |\n| `AssignedEmployee`\
  \ | `Employee` 类对象，描述分配给工作的员工。（该类具有 `Name`、`PhoneNumber`、`EmployeeId` 和 `SocialSecurityNumber`\
  \ 等属性。） |\n\n`JobDescription`、`EstimatedHours`、`ActualHours`、`Status` 和 `ActionTaken`\
  \ 属性是简单的 `string` 和数值。`Customer` 和 `AssignedEmployee` 属性本身是对象，拥有自己的属性、方法和事件。此 `Job`\
  \ 类可能提供以下方法：\n\n| 方法 | 目的 |\n| :--- | :--- |\n| `AssignJob` | 将 `Job` 分配给 `Employee`。\
  \ |\n| `PrintInvoice` | 在工作完成后为 `Customer` 打印发票。 |\n| `EstimatedCost` | 根据客户的服务类型和\
  \ `EstimatedHours` 计算并返回估算成本。 |\n\n\n\n\n\n该类可以提供下表所示的事件，以便主程序了解任务进度。\n\n| 事件 |\
  \ 目的 |\n| :--- | :--- |\n| `Created` | 当 `Job` 首次创建时发生 |\n| `Assigned` | 当 `Job`\
  \ 分配给 `Employee` 时发生 |\n| `Rejected` | 如果 `Employee` 拒绝执行任务时发生，可能是因为 `Employee`\
  \ 不具备完成工作所需的技能或设备 |\n| `Canceled` | 如果 `Customer` 在任务开始前取消任务时发生 |\n| `Finished`\
  \ | 当任务完成时发生 |\n\n该类封装了某些编程抽象的数据和行为，例如 `Job`、`Employee`、`Customer`、`Menu`、`SquashMatch`、`SoftwareProject`\
  \ 或任何你想作为单个实体进行操作的内容。\n\n在定义了一个类后，你可以根据需要创建任意数量的该类实例。类的实例是该类类型的对象。例如，`Job` 类代表泛指的任务。在定义\
  \ `Job` 类后，你可以创建该类的实例来代表特定的任务。你可以创建实例来代表砌砖墙、种树或修理电话交换机。创建类实例的过程被称为 `instantiation`。\n\
  \n有几种常见的类比来描述实例化。其中一种将类比为蓝图。在定义类后，你可以使用它来创建任意数量的该类实例，就像你可以使用蓝图制作许多相似的房屋（实例）一样。\n\
  \n不同的房屋有许多共同点。例如，蓝图定义了房屋房间的数量、大小和相对位置。这些类比于类定义的特征，这些特征适用于所有实例。（在 `Job` 类示例中，所有实例都有一个打印发票的\
  \ `PrintInvoice` 方法。尽管具体的打印内容取决于实例的属性。）\n\n这些房屋之间也可以存在差异，例如不同的颜色、前门和电器。这些对应于类的属性值。例如，`House`\
  \ 类可以定义 `ExteriorColor` 和 `ExteriorTrim` 属性，以决定该类每个实例的颜色。\n\n第二个类比将类定义比作饼干模具。创建好饼干模具后，你可以使用它制作任意数量的饼干（实例）。饼干模具（类）定义了饼干的大小和形状。特定的实例可能具有不同的属性，如厚度、面团类型（巧克力碎、糖霜、姜饼等）和糖霜类型（无、单色和花纹）。\n\
  \n由于所有类最终都继承自 `Object` 类，因此每个类的每个实例在某种意义上都是 `Object`，所以它们通常被简单地称为 `objects`。如果你不知道或不在乎某个项目的类，可以简单地将其称为对象。\n\
  \n接下来的章节提供了更多关于通用 OOP 语言特别是 C# 提供的更重要特详细信息。\n\n## 封装 (Encapsulation)\n\n类的公共接口是类外部可见的属性、方法和事件集。类还可能拥有私有的属性、方法和事件，用于执行其工作。例如，上一节描述的\
  \ `Job` 类提供了一个 `AssignJob` 方法。该方法可能会调用私有的 `FindQualifiedEmployee` 方法，通过遍历员工数据库寻找具有完成任务所需技能和设备的人。该例程在类外部不被使用，因此可以声明为私有。\n\
  \n`FindQualifiedEmployee` 方法应该声明为私有，以向类外部代码隐藏它。这使得接口更容易理解和使用。将 `FindQualifiedEmployee`\
  \ 设为公共会使接口（以及 IntelliSense）充斥着不必要的信息。\n\n类还可能包括私有属性和事件。这些隐藏的属性、方法和事件不是类公共接口的一部分。\n\
  \n类封装了它所代表的编程抽象（在这个持续的示例中为 `Job`）。它的公共接口决定了类外部应用程序可见的内容。它向其他世界隐藏了类实现的丑陋细节。由于类通过这种方式隐藏了其内部结构，封装有时称为\
  \ `information hiding`（信息隐藏）。\n\n通过向外部世界隐藏内部结构，类可以防止外部代码干扰这些内部。它减少了应用程序不同部分之间的依赖关系，只允许其公共接口显式允许的依赖。\n\
  \n移除不同代码段之间的依赖使得代码更容易修改和维护。如果你必须更改 `Job` 类将任务分配给员工的方式，可以相应地修改 `AssignJob` 方法。调用\
  \ `AssignJob` 例程的代码不需要知道细节已经发生了变化。它只需继续调用该方法，并将细节交给 `Job` 类处理。\n\n移除依赖还有助于将应用程序拆分为更小、更易管理的部分。调用\
  \ `AssignJob` 方法的开发者可以专注于当前的任务，而不是该方法的工作原理。这使得开发者的工作效率更高，在修改封装的代码时出错的概率更低。\n\n为了让类的使用尽可能简单且安全，你应该尽可能隐藏关于类内部结构的信息，同时仍允许外部代码执行其工作。如果外部代码不需要知道关于类工作的某些，它就不应该知道。\n\
  \n为了让公共属性、方法和事件易于使用，你应该使它们保持简单（至少从类外部看是如此）并且紧聚焦。一组每个执行单一简单任务的小方法，比一个根据其参数可以完成大量事情的单一方法更容易使用。\n\
  \n例如，`Graphics` 类提供了绘制和填充各种形状的方法。`DrawEllipse`、`DrawRectangle`、`DrawLine` 和 `DrawPolygon`\
  \ 方法勾勒了不同类型的形状。同样，`FillEllipse`、`FillRectangle`、`FillRegion` 和 `FillPolygon` 方法填充了不同类型的形状。\n\
  \n你可能可以将所有方法替换为单一的 `DrawShape` 方法，根据接收到的参数来绘制和勾勒或填充各种形状。这会让代码更难以理解，因为你必须仔细研究特定调用中的参数才能弄清楚它在做什么。通过使用独立的方法，类使代码一目了然。如果程序调用\
  \ `DrawRectangle`，它正在画一个矩形。\n\n## 继承 (Inheritance)\n\n继承允许你从父类派生子类。子类继承父类定义的所有属性、方法和事件。然后它可以对父类进行修改、添加或减少内容。让子类继承自父类也称为从父类派生子类，以及对父类进行子类化以形成子类。\n\
  \n\n\n\n\n例如，假设你定义了一个 `Person` 类，其中包含名为 `FirstName`、`LastName`、`Street`、`City`、`State`、`Zip`、`Phone`\
  \ 和 `Email` 的属性。它可能还包含一个 `PrintEnvelope` 方法，用于打印寄给 `Person` 对象代表的人的封。\n\n现在你可以从\
  \ `Person` 派生 `Employee` 类。`Employee` 类继承了 `FirstName`、`LastName`、`Street`、`City`、`State`、`Zip`、`Phone`\
  \ 和 `Email` 属性。然后它增加了新的 `EmployeeId`、`SocialSecurityNumber`、`OfficeNumber`、`Extension`\
  \ 和 `Salary` 属性。\n\n`Employee` 类可能会重写 `Person` 类的 `PrintEnvelope` 方法，将其地址改为办公室地址。\n\
  \n现在你可以从这些类派生其他类，创建一个完整的类层次结构。你可以从 `Employee` 类派生 `Manager` 类，并添加如 `Secretary` 等字段，该字段将指向代表经理秘书的另一个\
  \ `Employee` 对象。同样，你可以从 `Employee` 派生 `Secretary` 类，其中包含对 `Manager` 对象的引用。你可以从 `Manager`\
  \ 类派生 `ProjectManager`、`DepartmentManager` 和 `DivisionManager`；从 `Person` 类派生 `Customer`；以此类推，应用程序所需的其他类型的人。图\
  \ 11-1 显示了包含这些类的继承层次结构。\n\n![c11f001.eps](img/c11f001.png)\n\n图 11-1: 你可以从其他类派生类，以形成复杂的继承关系。\n\
  \n### 继承层次结构\n\n继承的一个主要用处是代码重用。当你从父类派生一个子类时，子类就可以重用你为父类编写的代码。例如，图 11-1 中提到的所有类都从\
  \ `Person` 类继承了 `FirstName`、`LastName`、`Street`、`City`、`State`、`Zip`、`Phone` 和 `Email`\
  \ 属性，因此它们不需要单独实现这些属性。\n\n`Consultant`、`Employee`、`Customer` 和 `PreferredCustomer`\
  \ 类也继承了 `Person` 类定义的 `PrintEnvelope` 方法。`Employee` 类重写了该方法，因此它无法重用 `Person` 类的版本。然而，新版本的行为与原始版本不同，因此你别无选择编写新代码。此外，继承自\
  \ `Employee` 的六个类可以重用这个新版本。\n\n代码重用不仅节省了你多次编写相同代码的精力，还节省了调试和维护的时间。例如，如果你在 `PrintEnvelope`\
  \ 方法中发现了一个 bug，你只需要在一个地方对其进行修复，而不需要在每个继承它的类中都进行修复。这节省了时间，并防止了你在某一个类中修复了 bug 却忘记在另一个类中修复。\n\
  \n代码重用还能帮助你进行修改。假设你决定更改 `Zip` 属性以存储 ZIP+4 格式的邮政编码，而不是原始的 5 位格式。在这种情况下，你只需要更改 `Person`\
  \ 类中的表示方式，所有其他类都会继承这一更改。\n\n当然，那时你可能还想更改 `PrintEnvelope` 方法以使用新的 `Zip` 格式。同样，你只需要在\
  \ `Person` 类中进行更改，其他类就会继承这一更改。\n\n同样，如果你需要添加、修改或删除属性或方法，你只需要在定义它的类中进行更改，而不是在所有继承它的类中进行。如果你想添加\
  \ `SendEmail` 方法，你只需要将其添加到 `Person` 类中。\n\n#### 细化与抽象\n\n你可以从自顶向下或自底向上的方式来考虑父类与其子类之间的关系。这两种观点导致了细化和抽象的概念。\n\
  \n#### 细化\n\n使用继承的自顶向下的视角，你可以将子类看作是对父类的“细化”。它们提供了额外的细节，以区分父类的不同类型。\n\n例如，假设你从一个涵盖宽泛类别（如\
  \ `Person`）的类开始。`Person` 类需要适用于所有人的通用字段，如 `FirstName`、`LastName`、`Address` 和 `PhoneNumber`。\n\
  \n某些类型的人可能需要不适用于所有人的额外字段。例如，学校的教师可能还需要 `Title`、`CoursesAssigned`、`Advisees`、`Office`\
  \ 和 `OfficeHours` 属性。学生可能需要 `StudentId`、`Year`、`CoursesTaken` 和 `GPA` 字段。\n\n你可以将所有这些字段添加到\
  \ `Person` 类中，但这将迫使该类扮演两个不同的角色。这将变得复杂且混乱。这也会有些浪费，因为作为教师的 `Person` 不使用任何学生属性，而作为学生的\
  \ `Person` 也不会使用任何教师属性。\n\n更好的解决方案是派生新的 `Instructor` 和 `Student` 类，细化 `Person` 类的定义并添加它们的新属性。现在，每个类都代表特定类型的人。\n\
  \n#### 抽象\n\n使用继承的自底向上的视角，你可以将父类看作是对其特征的抽象。父类聚集了子类的共同特征。由于父类比子类更通用（它包含一个更大的对象组），抽象有时被称为泛化。\n\
  \n例如，假设你正在开发一个图形应用程序，并定义了各种类来表示形状，如 `Circle`、`Rectangle`、`Ellipse` 和 `Polygon`。当你构建程序时，可能会发现这些类有很多共同点。例如，程序有时需要找到每个对象的边界矩形。你可能会发现对象具有共同的\
  \ `ForegroundColor` 和 `BackgroundColor` 属性。你可能希望每个类提供一个 `PointIsOver` 方法，如果给定点在形状上则返回\
  \ `true`。你可能还希望每个类在用户点击其形状时抛出一个 `Clicked` 事件。\n\n在意识到这些类有这么多共同点后，你可能决定提取这些共同特征并将它们移动到一个名为\
  \ `Drawable` 的公共父类中。该类将定义其他类实现所需的共同特征。例如，`Drawable` 类可以实现 `ForegroundColor` 和 `BackgroundColor`\
  \ 属性以供其他类继承。\n\n某些子类可能会重写 `Drawable` 类中的默认实现。`Drawable` 类甚至可能无法提供它定义的某些特征。例如，每种类型的形状都需要不同的\
  \ `PointIsOver` 方法，因为你需要不同的技术来判断点是否在矩形、圆形或多边形上。你可以给 `Drawable` 类提供一个默认实现，也许让它将其形状视为矩形，但这样做并不会让你获益良多。你仍然需要在除\
  \ `Rectangle` 之外的每个类中重写该方法。\n\n在这种情况下，可能最好是将该方法标记为 `abstract`且不提供方法体，这样子类就必须重写它。（有关\
  \ `abstract` 关键字的更多信息，请参阅第 6 章中的“abstract”节。）\n\n\n\n\n创建一个 `Drawable` 父类还允许程序将所有绘制对象统一地视为\
  \ `Drawable` 对象。例如，它可以创建一个名为 `AllDrawables` 的集合来存放当前图像的绘制对象。然后，当用户移动鼠标时，程序可以遍历集合并调用每个对象的\
  \ `PointIsOver` 方法，以判断鼠标是否悬停在某个对象上。本章稍后的“多态性”部分提供了更多细节。\n\n## 使用细化与抽象\n\n通常，程序的类是通过使用“细化”（refinement）来定义的。你已经知道程序所需的物品通用类别，如\
  \ `Person`（人员）、`Report`（报告）和 `Job`（工作）。随着项目需求的推进，你可以对这些类别进行细化，以创建程序所需的特定对象类型。`Person`\
  \ 变为 `Employee`（员工）、`Manager`（经理）、`Secretary`（秘书）、`Programmer`（程序员）、`Customer`（客户）和\
  \ `Contractor`（承包商）。`Report` 变为 `TimeSheet`（工单）、`JobRequirements`（职位需求）、`ProgressReport`（进度报告）和\
  \ `Invoice`（发票）。\n\n在项目设计阶段，类往往能自然地映射到需求上，因此想象它们之间的关系相对容易。\n\n抽象通常出现在开发过程中。当你定义并处理这些类时，可能会发现它们具有某些意想不到的共同点。例如，假设你正在处理\
  \ `Person` 类以及之前描述的派生类。一段时间后你发现 `Manager` 和 `Programmer` 是月薪职位，而 `Secretary` 是按小时计费的。你可以为\
  \ `Manager` 和 `Programmer` 添加 `Salary`（工资）属性，并为 `Secretary` 添加 `HourlyRate`（时薪）。遗憾的是，这将需要一个重复的\
  \ `Salary` 属性。这意味着你无法统一处理 `Manager` 和 `Programmer` 对象。\n\n解决方案是创建一个新的 `SalariedEmployee`\
  \ 类，作为 `Manager` 和 `Programmer` 类的新父类。图 11-2 显示了新的类层级结构。\n\n![c11f002.eps](img/c11f002.png)\n\
  \n图 11-2： 你可以从其他类派生类以形成复杂的继承关系。\n\n细化是构建继承层级结构的重要技术，但有时会导致不必要的细化或过度细化。例如，假设你定义了一个\
  \ `Vehicle`（车辆）类。然后通过创建 `Auto`（汽车）、`Truck`（卡车）和 `Boat`（船）类来细化该类。你将 `Auto` 类细化为 `Wagon`（旅行车）和\
  \ `Sedan`（轿车），并针对不同的驱动类型（四驱、自动变速箱等）进一步细化。如果你真的疯狂，你可以为特定的制造商、车身样式和颜色定义类。\n\n这种层级结构的问题在于它包含了比你需要的多得细节。如果你正在编写一个管理配送车队的程序，你可能需要知道车辆的容量，但可能不需要跟踪它的制造商、变速箱类型和颜色。你可能想跟踪某些信息以便正确识别每辆车辆，但你不需要为它们创建单独的类。\n\
  \n对于配送调度应用而言，颜色是无关的。创建许多不必要的类会让对象模型更难理解，并可能导致混乱和错误。\n\n只有当细化一个类能让你获取应用程序实际所需的新信息时，才进行细化，以避免不必要的细化。\n\
  \n就像你可以将细化推向荒端的极端，你也可以过度抽象。由于抽象是由代码而非直觉驱动的，有时会导致不符合直觉的继承层级结构。\n\n例如，假设你的应用程序需要向供应商发送采购订单向客户发送发票。如果\
  \ `PurchaseOrder`（采购订单）和 `Invoice`（发票）类有足够的共同点，你可能会决定创建一个更抽象的 `MailableItem`（可邮件项）类，包含向某人创建并发送文档所需的代码。\n\
  \n在某处你可能发现你还需要向供应商或客户发送电子邮件，因此你创建了 `EmailableItem`（可电项）类的概念。`MailableItem` 和 `EmailableItem`\
  \ 类可能共享一些共同特征，因为它们都代表向某人发送东西，所以你可能受到诱惑，创建一个更抽象的 `SendableItem`（可发送项）类。\n\n尽管这些从编码角度来看某种奇特的道理，但在直觉上并不合理。这意味着程序员需要花费额外时间来弄清楚类的用途以及如何使用它们。这也意味着程序员更有可能出错，从而减慢开发速度并产生恼人的漏洞。\n\
  \n你有时可以通过将共同特征移动到库而不是创建单独的类来表示它们，从而避免过度抽象。例如，你可以创建一个包含通过电子邮件或邮政发送项目的方法的库。然后程序可以根据需要调用这些方法。除非程序是某种消息跟踪系统，否则它可能不需要一个对象来代表电子邮件和信件。\n\
  \n过度细化和过度抽象有时会导致膨胀的继承层级结构。有时层级结构会变得长而窄。其他时候，设计可能包含许多独立但小的继承层级结构、只有一个子类的父类，或者一个从未被使用的类。\n\
  \n如果你的继承层级结构开始呈现这些奇怪的形式之一，你应该花时间重新评估你的类。确保每个类都为应用程序添加了有意义的内容，并确保关系是合理的直觉的。太多关系混乱的类可能会导致项目停滞，因为开发者在理解层级结构上花费的时间比编写代码的时间多。\n\
  \n如果你不确定是否应该添加新类，就先不要添加。如果你之后发现它确实是必要的，可以再添加。通常，添加一个新类比删除一个已经开始使用的不必要类要容易。\n\n###\
  \ Has-a 和 Is-a \n\n在细化中，你创建子类来区分不同类型的对象。在抽象中，你创建一个父类来表示两个多个子类之间的共同特征。这两种技术都在类之间创建了父子关系。\n\
  \n另一个有时伪装成父子关系的概念是包含（containment）。在包含中，一个对象作为属性包含另一个对象。\n\n继承和包含的概念有时被称为 is-a（是一个）和\
  \ has-a（有一个）关系。\n\n例如，`Student`（学生）是一个特定的 `Person`（人员）对象类型。is-a 关系自然地映射到继承层级结构中。因为\
  \ `Student` 是 `Person`，所以从 `Person` 类派生 `Student` 类是合理的。\n\n相反，一个 `Person` 对象拥有一个街道地址、城市、州和邮政编码。has-a\
  \ 关系最自然地映射到嵌入项。例如，你可以给 `Person` 类提供 `Street`（街道）、`City`（城市）、`State`（州）和 `Zip`（邮政编码）属性。\n\
  \n为了理解为什么 is-a 和 has-a 关系之间的差异很重要，假设你的程序处理 `Person` 和 `Student` 类。假设它还处理 `FinancialAidPayment`、`RegistrationFee`\
  \ 以及其他具有街道、城市、州和邮政编码信息的类。使用抽象，你可能会创建一个包含这些值的 `HasPostalAddress` 类。然后你可以将 `Person`、`FinancialAidPayment`\
  \ 和 `RegistrationFee` 类派生为 `HasPostalAddress` 的子类。遗憾的是，这形成了一个相当不符合直觉的继承层级结构。从同一个父类派生所有类还会让它们看起来关系紧密，而实际上它们只是偶然相关。\n\
  \n\n\n\n更好的解决方案是将邮政地址数据封装在自己的 `Address` 类中，然后将该类的实例包含在 `Person`、`FinancialAidPayment`\
  \ 和 `RegistrationFee` 类中。\n\n你通过抽象创建一个父类，部分程度上是为了避免代码重复。父类包含公共变量和代码的单一副本，因此子类就不需要拥有自己独立的版本，以便你进行调试和维护。在其他每个类中放置\
  \ `Address` 类的实例可以提供相同的好处，而不会使继承层次结构复杂化。\n\n有时你可以使用“是”（is-a）或“拥有”（has-a）来描述一种关系。例如，一个\
  \ `Person` 拥有（has-an）一个地址，但同时一个 `Person` 是（is-a）一个拥有地址的实体。在这种情况下，你需要根据常识和直觉来判断哪种方式更合理。一个提示是，描述某个“拥有地址”的东西很容易，但“是一个拥有地址的实体”这个短语听起来更别扭且定义模糊。\n\
  \n你还可以考虑这种关系可能会如何影响其他类。`Person`、`FinancialAidPayment` 和 `RegistrationFee` 类真的关系密切吗？还是它们仅仅共享了一些公共信息？\n\
  \n### 添加和修改类特征\n\n向子类中添加新的属性、方法和事件是简单的。你只需要像在任何其他类中那样声明它们。父类对它们一无所知，因此新项仅添加到子类中。\n\
  \n以下代码展示了你如何在 C# 中实现 `Person` 和 `Employee` 类。\n\n```cs\n// A general person.\npublic\
  \ class Person\n{\n    public string FirstName, LastName, Street, City, State, Zip,\
  \ Phone, Email;\n\n    // Dial the phone.\n    public void DialPhone()\n    {\n\
  \        // Dial the number Phone...\n    }\n}\n\n// An employee.\npublic class\
  \ Employee : Person\n{\n    public string EmployeeId, SocialSecurityNumber, OfficeNumber,\
  \ Extension;\n    public decimal Salary;\n\n    // Print a timesheet for the employee.\n\
  \    public void PrintTimesheet()\n    {\n        // Print the timesheet...\n  \
  \  }\n}\n```\n\n`Person` 类定义了姓名和地址值。为了简单起见，它们被实现为字段，但在实践中你可能希望将它们变为属性。该类还定义了一个 `DialPhone`\
  \ 方法，用于拨打个人的电话号码。\n\n`Employee` 类派自 `Person` 类。（这就是类声明末尾的 `: Person` 的含义。）此类添加了一些新值，并定义了一个新的\
  \ `PrintTimesheet` 方法。\n\n子类有两种方式可以修改在在其父类（或任何祖先类）中定义的方法的行为：隐藏（hiding）和重写（overriding）。\n\
  \n### 隐藏和重写\n\n首先，子类可以隐藏父类版本的方法。要做到这一点，请添加 `new` 关键字表示你想使用该方法的新版本。以下代码展示了 `Employee`\
  \ 类如何隐藏 `DialPhone` 方法以创建一个包含 `Employee` 分机号（Extension）的新版本。`new` 关键字已**加粗**显示。\n\
  \n```cs\n// Dial the phone + extension.\npublic new void DialPhone()\n{\n    //\
  \ Dial the number Phone + Extension...\n}\n```\n\n子类修改父类方法的另一种方法是重写它。\n\n这种方法需要父类的配合。父类必须用\
  \ `virtual` 或 `abstract` 关键字标记该方法。（父类也可能已经重写了该方法。在这种情况下，某个祖先类用 `virtual` 或 `abstract`\
  \ 关键字声明了原始方法。）\n\n以下代码展示了 `Person` 类 `DialPhone` 方法的新版本，其中 `virtual` 关键字已**加粗**显示。\n\
  \n```cs\n// Dial the phone.\npublic virtual void DialPhone()\n{\n    // Dial the\
  \ number Phone...\n}\n```\n\n`virtual` 关键字表示该方法可以被后代类重写。以下代码展示了 `Employee` 类如何重写\
  \ `DialPhone` 方法。\n\n```cs\n// Dial the phone + extension.\npublic override void\
  \ DialPhone()\n{\n    // Dial the number Phone + Extension...\n}\n```\n\n像这样重写方法是一种强大的技术。当你为一个对象调用重写的方法时，你将获得该对象真实类定义的版本，即使你正在使用祖先类的变量来引用该对象。\n\
  \n相比之下，当你隐藏一个方法时，只有当你使用定义新版本的类的变量时，才能获得该版本。\n\n这些是令人困惑的概念，因此这里有一个详细的示例。考虑以下简化的 `Person`\
  \ 和 `Employee` 类。\n\n```cs\npublic class Person\n{\n    public string Name;\n\n\
  \    public virtual void IsVirtual()\n    {\n        Console.WriteLine(Name + \"\
  : Person.IsVirtual\");\n    }\n\n    public void HideMe()\n    {\n        Console.WriteLine(Name\
  \ + \": Person.HideMe\");\n    }\n}\n\npublic class Employee : Person\n{\n    public\
  \ override void IsVirtual()\n    {\n        Console.WriteLine(Name + \": Employee.IsVirtual\"\
  );\n    }\n    public new void HideMe()\n    {\n        Console.WriteLine(Name +\
  \ \": Employee.HideMe\");\n    }\n}\n```\n\n`Person` 类定义了两个方法。`IsVirtual` 方法用 `virtual`\
  \ 关键字定义。`HideMe` 方法定义时没有使用 `virtual` 关键字。\n\n`Employee` 类重写了 `IsVirtual` 并隐藏了 `HideMe`。\n\
  \n现在考虑使用这些方法的代码。\n\n```cs\nPerson ann = new Person { Name = \"Ann\" };\nEmployee\
  \ bob = new Employee { Name = \"Bob\" };\nPerson person = bob;\n\nann.IsVirtual();\n\
  bob.IsVirtual();\nperson.IsVirtual();\nann.HideMe();\nbob.HideMe();\nperson.HideMe();\n\
  ```\n\n`ann` 对象是 `Person`，所以它调用 `Person` 的 `IsVirtual`。`bob` 对象是 `Employee`，所以它调用\
  \ `Employee` 的 `IsVirtual`。\n\n`person` 对象的类型是 `Person`，但它实际上指向 `Employee` 对象 `bob`。由于\
  \ `Employee` 类重写了该方法的定义，`person` 使用对象真实类（在此处为 `Employee`）定义版本。尽管看起来是在调用 `Person.IsVirtual`，但实际上调用的是\
  \ `Employee.IsVirtual`。\n\n`HideMe` 方法的情况简单得多。一样，`ann` 和 `bob` 对象调用各自类的版本。`person`\
  \ 对象类型为 `Person`。由于该方法在 `Employee` 类中被隐藏了，`Person` 类并不知道该版本。当代码调用 `Person` 对象的 `HideMe`\
  \ 方法时，获得的是 `Person` 类的版本。\n\n以下文本显示代码的输出。\n\n```\nAnn: Person.IsVirtual\nBob: Employee.IsVirtual\n\
  Bob: Employee.IsVirtual\nAnn: Person.HideMe\nBob: Employee.HideMe\nBob: Person.HideMe\n\
  ```\n\n`person` 对象调用了 `Employee` 类的 `IsVirtual` 版本（输出的第三行），但它调用了 `Person` 类的 `HideMe`\
  \ 版本（输出的最后一行）。还有两个影响重写的关键字：`abstract` 和 `sealed`。\n\n### abstract\n\n抽象方法是指没有方法体的方法。它定义了方法的名称、参数和返回类型，但不提供实现。（这类似于接口定义方法签名但不提供实现的方式。）\n\
  \n\n\n\n\n如果你给一个类提供了一个抽象方法，该类中就会有一个该方法的占位符。由于该占位符是空的，你无法创建该类的实例，因为它是不完全的。因此，如果一个类包含抽象方法，你必须也将该类标记为抽象的。\n\
  \n请注意，该类可以定义其他非抽象的属性、方法和事件。（某些人将非抽象方法、类或其他项称为“具体的”。）即使它只包含一个抽象方法，该类也必须是抽象的。\n\n\
  抽象方法也被视为虚方法，因此子类可以重写它以为其提供方法体。这样，子类就可以是具体的，你可以创建它的实例。\n\n例如，考虑以下代码。\n\n```\npublic\
  \ abstract class Report\n{\n    public abstract void GenerateReport();\n    public\
  \ abstract void DistributeReport();\n}\npublic abstract class PersonnelReport :\
  \ Report\n{\n    public override void DistributeReport()\n    {\n        // 将报告分发到人事部门的代码...\n\
  \    }\n}\npublic class Timesheet : PersonnelReport\n{\n    public override void\
  \ GenerateReport()\n    {\n        // 生成时间表的代码。\n    }\n}\n```\n\n这里的想法是 `Report`\
  \ 类定义了任何报告都应该提供的宽泛特征。该类定义的两个抽象方法：`GenerateReport` 和 `DistributeReport`。因为该类包含抽象方法，所以它也必须是抽象的。（在这种情况下这是可以的。`Report`\
  \ 类不代表特定类型的报告，因此创建它的实例本身没有意义。）\n\n派自 `Report` 的 `PersonnelReport` 类代表应该发送给人事部门每个人的报告。它重写了\
  \ `DistributeReport` 方法以将报告发送给部门的每个人。该类仍然包含一个抽象方法（`GenerateReport`），因此它必须被标记为抽象的。\n\
  \n派自 `PersonnelReport` 的 `Timesheet` 类重写了 `GenerateReport` 方法来实际创建报告。该类没有抽象方法，因此可以具体的类。\n\
  \n### sealed\n\n影响重写的最后一个关键字是 `sealed`。如果你在子类中将重写的方法标记为 `sealed`，那么更高级的后代类就不能重写该方法了。\n\
  \n`sealed` 方法有两个奇怪的特性。首先，你不能在定义方法的类中密封该方法，只能在重写它的类中密封。其次，你不能在后代类中重写密封方法，但你可以隐藏它，因此密封方法并不能完全保护它免受后来的篡改。\n\
  \n例如，考虑以下代码。\n\n```\npublic abstract class Animal\n{\n    public abstract string\
  \ FoodType();\n}\n\npublic class Herbivore : Animal\n{\n    public override sealed\
  \ string FoodType()\n    {\n        return \"Vegetation\";\n    }\n}\n\npublic class\
  \ Koala : Herbivore\n{\n    public new string FoodType()\n    {\n        return\
  \ \"Eucalyptus\";\n    }\n}\n```\n\n`Animal` 类定义了一个抽象的 `FoodType` 方法。\n\n派自 `Animal`\
  \ 的 `Herbivore` 类重写了 `FoodType` 以返回字符串 `\"Vegetation\"`。\n\n`Herbivore` 类将方法标记为\
  \ `sealed`，因此派自 `Herbivore` 的 `Koala` 类不能重写 `FoodType`。然而，它可以使用 `new` 关键字用新版本来隐藏\
  \ `Herbivore` 对该方法的实现。\n\n## 多态\n\n广义来说，多态是将一个对象视为不同类型对象的能力。在 OOP 术语中，这意味着你可以将一个类的对象视为来自其祖先类的对象。\n\
  \n例如，假设 `Employee` 和 `Customer` 都派自 `Person` 类。那么你就可以将 `Employee` 和 `Customer` 对象视为\
  \ `Person` 对象，因为在某种意义上，它们确实是 `Person`。它们是 `Person` 对象的特定类型。它们继承了 `Person` 对象的所有属性、方法和事件，所以它们应该表现得像\
  \ `Person` 对象。\n\nC# 允许你使用一个类的变量来引用派生类的对象。在这个示例中，你可以使用 `Person` 变量来持有对 `Employee`\
  \ 或 `Customer` 对象的引用，如下代码所示。\n\n```\nEmployee employee = new Employee();     //\
  \ 创建一个 Employee\nCustomer customer = new Customer();     // 创建一个 Customer\nPerson\
  \ person = new Person();           // 创建一个 Person。\n\nperson = employee;   // 允许，因为\
  \ Employee 是 Person 的类型。\nperson = customer;   // 允许，因为 Customer 是 Person 的类型。\n\
  employee = person;   // 不允许，因为 Person 不一定是 Employee。\n```\n\n使用多态的一个常见原因之一是以统一的方式处理对象集合，这在父类的语境下是合理的。例如，假设\
  \ `Person` 类定义了 `FirstName` 和 `LastName` 属性。程序可以定义一个名为 `AllPeople` 的集合，并添加 `Customer`\
  \ 和 `Employee` 对象的引用，代表程序需要管理的所有人员。代码可以遍历该集合，将每个对象视为 `Person` 处理，如下代码所示。\n\n```\n\
  foreach (Person person in AllPeople)\n{\n    Console.WriteLine(person.FirstName\
  \ + \" \" + person.LastName);\n}\n```\n\n当你多态地使用对象时，你只能访问由实际用于引用该对象的变量类型所定义的特征。例如，如果你使用\
  \ `Person` 变量来引用 `Employee` 对象，你只能使用由 `Person` 类定义的特征。\n\n如果你知道一个对象具有特定类型，可以在处理它之前将其转换为该类型。例如，以下代码遍历\
  \ `AllPeople` 列表，并对 `Employee` 对象执行特殊操作。\n\n```\nforeach (Person person in AllPeople)\n\
  {\n    if (person is Employee)\n    {\n        // 对 person 执行特定的 Employee 操作。\n\
  \        Employee employee = person as Employee;\n        ...\n    }\n}\n```\n\n\
  代码使用语句 `if (person is Employee)` 来判断 `person` 是否可以视为 `Employee`。需要注意的是，这并不意味着 `person`\
  \ 实际上是 `Employee`。这意味着 `person` 是 `Employee` 或派自 `Employee` 的类，因此它可以被视为 `Employee`。例如，如果\
  \ `Manager` 类派自 `Employee`，那么对于 `Manager` 对象，`person is Employee` 返回 `true`。\n\n\
  代码使用以下语句将循环变量 `Person` 转换为 `Employee` 变量。\n\n```\nEmployee employee = person as\
  \ Employee;\n```\n\n`as` 关键字可以将变量 `person` 转换为 `Employee`。如果 `person` 无法转换为 `Employee`，则\
  \ `as` 返回 `null`。（在本示例中，你知道 `person` 可以转换为 `Employee`，因为代码刚刚检查过了。）`as` 语句大致相当于以下代码。\n\
  \n```\nEmployee employee = null;\nif (person is Employee) employee = (Employee)person;\n\
  ```\n\n有时你可能想要基类的重写方法。例如，假设你重写了 `Person` 类的 `ToString` 方法，但你又想调用 `Person` 所派自的 `Object`\
  \ 类定义的版本。在这种情况下，你可以在 `Person` 类中添加以下 `BaseToString` 方法。\n\n```\npublic string BaseToString()\n\
  {\n    return base.ToString();\n}\n```\n\n在这里`base` 关键字告诉程序使用父类中定义的 `ToString` 版本。现在，程序可以通过调用\
  \ `BaseToString` 方法来使用 `Object` 类的 `ToString` 版本。\n\n\n\n\n\n`Person` 类内部的代码可以如此处所示调用父类版本的\
  \ `ToString`，但程序没有办法直接调用对象的被重写基类方法。如果你没有定义类似于 `BaseToString` 的方法，程序将无法调用 `Object`\
  \ 类版本的方法。\n\n另外请注意，没有办法调用继承链中更上层的方法。\n\n## 总结\n\n类是编程抽象，将数据和相关行为封装在紧密封装的包中。定义一个类后，你就可以创建该类的实例。\n\
  \n继承允许你从父类派生出子类，并可能添加、隐藏或覆盖父类的行为。`new`、`virtual`、`abstract`、`override` 和 `sealed`\
  \ 关键字让你对方法的继承和修改拥有了相当大的控制权。\n\n接口为你提供了另一种定义行为的方法，这种方法不遵循继承层次结构。与抽象类一样，接口允许你在不提供实现的情况下确定类的行为。由于接口不需要遵循派生层次结构，因此你可以使用它们来实现非层次化的关系，例如多重继承（接口继承）。\n\
  \n多态允许你将对象视为其祖先的类型。例如，下面的文本显示了 Windows Forms `PictureBox` 控件的继承层次结构。\n\n```\nSystem.Object\n\
  \  System.MarshalByRefObject\n    System.ComponentModel.Component\n      System.Windows.Forms.Control\n\
  \        System.Windows.Forms.PictureBox\n```\n\n这意味着你可以将 `PictureBox` 视为 `PictureBox`、`Control`、`Component`、`MarshalByRefObject`\
  \ 或 `Object`。\n\n本章描述了这些特性，并简要介绍了如何在 C# 中实现其中许多特性。下一章将更详细说明创建类和结构的语法。它还解释了两者之间的区别，以及如何决定何时使用类以及何时使用结构。\n\
  \n## 练习\n\n对于需要你构建继承层次结构的练习，请用虚线框绘制抽象类，用实线框绘制具体类。\n\n1. 考虑图 11-2 所示的继承层次结构。假设你决定还需要一个\
