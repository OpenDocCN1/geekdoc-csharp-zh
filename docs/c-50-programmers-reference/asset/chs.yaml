  \ 1 的 `ConsoleShowArgs` 程序包含在第 2 章的下载中。\n\n本附录展示了许多程序中最感兴趣的部分，但为了节省空间省略了一些不重要的细节。请下载示例以查看所有代码。\n\
  \n## 第 1 章\n\n1. 图 A-1 显示了当你编写 C# 程序并按 F5 运行时，Visual Studio 执行的主要步骤![bapp01f001.eps](img/bapp01f001.png)\n\
  \n    C# 编译器将 C# 代码转换为 IL 代码。然后 CLR 的 JIT 编译器将 IL 代码转换为机器码。JIT 编译器只在需要时才编译方法。\n\n\
  2. 在第一个应用程序中，会有短暂的延迟，因为每个方法在用户第一次选择工具时都会编译。延迟很短，所以用户可能察觉不到。\n\n    在第二个 程序中，所有的编译延迟都发生在程序启动时。这些延迟累加起来可能足够让用户察觉。\n\
  \n\n\n\n如果你预编译程序并将其安装在 GAC 中，它们的运行速度会快一点，因为这些方法在第一次使用时不需要被编译成机器代码。然而，这种差异可能很小。对于第一个应用程序来说，这可能不值得这样做，因为用户会将任何编译延迟视为点击按钮所需时间的一部分。对于第二个程序，是否值得花精力也值得怀疑。\n\
  \n3. 使用 `NGen` 和 GAC 对代码库和控制库最有用。它们的代码将经过预编译，并为任何使用这些库的应用程序准备好就绪。\n\n4. 在程序启动时调用所有方法将强迫\
  \ CLR 编译它们，这样它们在稍后再次调用时就可以直接运行。然而，这种技术会让代码变得更加复杂，而且目前还不清楚它节省的时间是否足以让用户察觉，因此最好不要这样做。\n\
  \n## 第 2 章\n\n1. `ConsoleShowArgs` 示例程序就是这样做的。\n\n   当你第一次运行程序时，会出现一个控制台窗口并显示文本\
  \ `Press Enter to continue`。当你按下回车键时，它就会关闭。\n\n   在输入命令行参数后运行程序，窗口将显示以下文本。\n\n \
  \  ```\n   Red\n   Green\n   Blue\n   Press Enter to continue.\n   ```\n\n2. 当从\
