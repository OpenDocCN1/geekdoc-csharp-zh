  \n    相比之下，如果你不释放内存流（memory stream），该流的内存将一直保持分配状态直到程序结束。\n\n    锁定的文件可能会影响其他程序，如果你尝试用\
  \ Windows 资源管理器读取或删除该文件，这会令人困恼。锁定的内存实际上不会影响其他程序，因此从某种意义上说，未能释放文件流比未能释放内存流糟糕。（不过，这都是粗糙的编程。）\n\
