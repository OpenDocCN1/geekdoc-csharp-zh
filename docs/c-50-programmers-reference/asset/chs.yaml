  \ As`框并点击`Next`。\n\n2. 现在，向导显示图 23-4 所示的屏幕，让你选择要包含在数据源中的数据库对象。勾选你想包含的表和视图（如果它们是由数据库定义的）。输入你想为新的`DataSet`命名的名称并点击`Finish`![c23f004.tif](img/c23f004.png)\n\
  \n**图 23-4:** 此屏幕让你选择将包含在数据源中的数据库对象。\n\n图 23-5 显示了我在为本章下载包含的`SchoolData.accdb`数据库创建数据源后的数据源窗口。`DataSet`显示了它包含的表，而表显示了它们包含的字段。\n\
