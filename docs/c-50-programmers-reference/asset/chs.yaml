  \ TABLE` 语句。这种工具应该只对理解 SQL 的受信任用户可用。\n\n\n\n\n### 本章内容\n\n- XML 语法\n- `XmlWriter`、`XmlReader`\
  \ 以及 DOM\n- XPath 和 XSLT\n\n## 本章的 Wrox.com 下载资源\n\n请注意，本章的所有代码示例均作为章节代码下载的一部分，可以在书籍网站\
  \ [www.wrox.com/go/csharp5programmersref](http://www.wrox.com/go/csharp5programmersref)\
  \ 的“Download Code”（下载代码）选项卡下载。\n\n关系型数据库引擎（如 SQL Server、Access 和 MySQL）允许你存储将记录分组为表的数据。它们使用索引允许你根据准则选择记录、连接多个表的记录并对结果进行排序。\n\
  \n有时，你可能不需要关系型数据库提供的功能。如果你只想存储一些数据，并且不需要对其进行搜索、连接或排序，那么关系型数据库就大材小用了。\n\n可扩展标记语言\
  \ (XML) 是一种数据存储语言，它使用分层的元素集合来表示数据。你可以将数据写入 XML 文件。稍后你可以读取该文件以恢复数据。由于这是一项行业标准语言，运行在不同操作系统上的其他程序也可以读取、写入和共享\
  \ XML 文件。\n\n正如本书此部分的所有主题一样，XML 是一个大课题。事实上，已经有整本书是关于它的了。（我甚至合著过一本：Rod Stephens 和\
  \ Brian Hochgurtel 的 *Visual Basic .NET and XML: Harness the Power of XML in VB.NET*，Wrox,\
  \ 2002。）\n\n本章没有空间涵盖 XML 的每一个细节，所以我不会尝试。本章将解释 XML 的基础知识，以便你在程序中使用它保存和恢复数据，并读取其他程序存储的数据。更多细节，请查阅关于这些语言的好书或在网上搜索。\n\
  \n下一节将解释 XML 语法。随后的章节将解释你如何在 C# 程序中使用 XML。\n\n### 基础 XML 语法\n\n每个元素由一个起始标签和一个相应的结束标签表示。起始标签包含在括号\
  \ `<` 和 `>` 之间。结束标签看起来像起始标签，但它们以 `</` 而不是简单的 `<` 开始。\n\n例如，以下 XML 代码存储了两个学生的信息。\n\
  \n```\n<Students>\n    <Student>\n        <FirstName>Larry</FirstName>\n       \
  \ <LastName>Liverpool</LastName>\n    </Student>\n    <Student>\n        <FirstName>Miranda</FirstName>\n\
  \        <LastName>McQuaid</LastName>\n    </Student>\n</Students>\n```\n\n元素有时被称为节点（nodes），特别是当你想要强调数据的分层树状结构时。\n\
  \n元素必须正确嵌套。例如，以下内容不是有效的 XML，因为 `FirstName` 和 `LastName` 元素重叠了。\n\n```\n<Student>\n\
  \    <FirstName>\n        Larry\n    <LastName>\n        Liverpool\n    </FirstName>\n\
  \    </LastName>\n<Student>\n```\n\n请注意，元素的名称完全由你决定。如果你喜欢，你可以在构建文件时动态定义它们。在示例中使用的\
  \ `Students`、`Student`、`FirstName` 和 `LastName` 元素并没有特殊之处。它们可以使用像示例中这样的帕斯卡命名法（Pascal\
  \ case），也可以全部用小写，或者使用你喜欢的任何大小写方案。\n\n元素的值是其起始和结束标签内的任何内容。除了值之外，元素还可以有属性（attributes）。属性提供了有关元素的额外信息。要创建属性，请在起始标签内插入它的名称、等号以及用引号括的值。\n\
  \n例如，考虑以下 XML。\n\n```\n<Students>\n    <Student StudentId=\"128977\">\n        <FirstName>Larry</FirstName>\n\
  \        <LastName>Liverpool</LastName>\n        <StudentId>3981</StudentId>\n \
  \   </Student>\n    <Student StudentId=\"348722\">\n        <FirstName>Miranda</FirstName>\n\
  \        <LastName>McQuaid</LastName>\n        <StudentId>2711</StudentId>\n   \
  \ </Student>\n</Students>\n```\n\n在此代码中，`Student` 元素包含了嵌套的 `FirstName` 和 `LastName`\
  \ 元素。`StudentId` 属性提供了每个 `Student` 的 ID 号。\n\n你可以按任何喜欢组合嵌套元素和属性，使 XML 代码更易阅读和处理。\n\
  \n如果元素不包含任何嵌套元素，如果你用 `/>` 代替通常的 `>` 结尾，就可以省略结束标签。例如，以下代码显示了一个没有嵌套子元素的 `Contact`\
  \ 元素。\n\n```\n<Contact Phone=\"800-555-1234\" />\n```\n\n你可以通过以 `<!--` 开始并以 `-->`\
  \ 结束在 XML 代码中包含注释，如下代码所示。\n\n```\n<!-- This is an XML comment -->\n```\n\n由于 XML\
  \ 是一种分层语言，XML 文件中的所有数据必须包含在一个没有父节点的单个顶级节点内，这被称为根节点（root node）。然而，该规则有一个重要的例外。许多\
  \ XML 文件以单个 XML 声明开头，提供关于文件本身的信息。该声明以 `<?` 开始并以 `?>` 结束。例如，以下代码显示了 C# 程序的 `App.config`\
  \ 文件。\n\n```\n<?xml version=\"1.0\" encoding=\"utf-8\" ?>\n<configuration>\n   \
  \ <startup> \n        <supportedRuntime version=\"v4.0\" sku=\".NETFramework,Version=v4.5\"\
  \ />\n    </startup>\n</configuration>\n```\n\n代码顶部的指令表示该文件使用 XML 版本 1.0 并包含来自 UTF-8\
  \ 编码的字符。\n\n就像有时你想在 C# 字符串中包含如 `\\n` 这样的特殊字符一样，你可能想在 XML 代码中包含特殊字符。XML 定义了下表列出的五个特殊字符。\n\
  \n| 字符 | 代码 |\n| :--- | :--- |\n| `<` | `<` |\n| `>` | `>` |\n| `&` | `&` |\n| `'`\
  \ | `'` |\n| `\"` | `\"` |\n\n例如，以下代码表示方程 17 < 21。\n\n```\n<equation>17 < 21</equation>\n\
  ```\n\n在 XML 代码中包含特殊字符的另一种方法：CDATA 区域。CDATA 区域以 `<![CDATA[` 开始，并包含之后的所有文本，直到遇到结束序列\
  \ `]]>`。CDATA 可以包含换行符、安培符号、引号和其他特殊字符。\n\n基础 XML 就是这些了。还有许多其他细节，其中一些将在以后解释，但这些足够让你保存和恢复数据了。\n\
  \n接下来的文本显示了一个演示到为止所描述功能的 XML 文件。\n\n```\n<?xml version=\"1.0\" encoding=\"utf-8\"\
  \ ?>\n<Students>\n  <Description>\n    <![CDATA[这是一段描述该 XML 文件的文本。\n这是一段多行描述。\n\
  < > \" &\n这是最后一行。]]>\n  </Description>\n  <!-- 这个学生的数据存储在子元素中。 -->\n  <Student>\n\
  \    <FirstName>Arthur</FirstName>\n    <LastName>Andrews</LastName>\n    <StudentId>83746</StudentId>\n\
  \  </Student>\n  <!-- 这个学生的数据存储在属性中。 -->\n  <Student FirstName=\"Bethany\" LastName=\"\
  Bechtold\" StudentId=\"12653\" />\n</Students>\n```\n\n代码相对直观，所以我不会逐行描述它。\n\n值得提到的一点是，CDATA\
  \ 元素包含了特殊字符和多行内容。内容紧接 `<![CDATA[` 之后开始。如果内容在下一行开始，它将包含 `<![CDATA[` 之后的初始换行符。\n\n\
  同样，CDATA 内容在 `]]>` 之前立即结束。如果 `]]>` 在下一行，则内容将包含一个最后的换行符。\n\n### 写入 XML 数据\n\n.NET\
  \ Framework 提供了写入 XML 数据的两种方法：`XmlWriter` 类和 XML 文档对象模型（DOM）。接下来的两个章节将描述这些方法。\n\n\
  ### XmlWriter\n\n\n\n\n\n`XmlWriter` 类提供了用于写入 XML 文件片段的方法。要使用 `XmlWriter` 将 XML\
  \ 数据写入文件，请调用该类的 `Create` 方法来创建文件。然后使用其他方法将 XML 文档的各个部分写入文件。例如，`WriteComment` 方法向文件中添加注释，而\
  \ `WriteStartElement` 方法向文件中写入元素的起始标签。\n\n下表列出了最实用的 `XmlWriter` 方法。\n\n| 方法 | 目的\
  \ | |\n| :--- | :--- |\n| `Close` | 关闭写入器的底层流。 |\n| `Create` | 创建与文件、流、`StringBuilder`\
  \ 或其他对象关联的 `XmlWriter`。 |\n| `Dispose` | 释放写入器的资源。（您可以使用 `using` 语句来确保写入器被释放。） |\n\
  | `Flush` | 将输出刷新到底层流。 |\n| `WriteAttributeString` | 写入具有指定名称和值的属性。 |\n| `WriteCData`\
  \ | 写入 CDATA。 |\n| `WriteComment` | 写入注释。 |\n| `WriteElementString` | 写入具有指定名称和文本值的元素。\
  \ |\n| `WriteEndAttribute` | 结束由 `WriteStartAttribute` 开始的属性。 |\n| `WriteEndDocument`\
  \ | 结束文档。 |\n| `WriteName` | 写入名称。 |\n| `WriteStartAttribute` | 开始一个属性。 |\n| `WriteStartDocument`\
  \ | 开始文档。 |\n| `WriteStartElement` | 开始一个元素。 |\n| `WriteString` | 写入字符串，并在必要时转义如\
  \ `<` 和 `>` 等特殊字符。 |\n| `WriteValue` | 写入如 `bool`、`int` 或 `double` 等值。 |\n\n`UseXmlWriter`\
  \ 示例程序（可以在本书的网站上下载）使用以下代码创建一个包含之前所示的学生数据的 XML 文件。\n\n```csharp\n // 创建写入器。\n   \
  \ using (XmlWriter writer = XmlWriter.Create(fileTextBox.Text))\n    {\n       \
  \ // 写入起始元素。\n        writer.WriteStartDocument();\n\n        writer.WriteStartElement(\"\
  Students\");       // <Students>\n        writer.WriteStartElement(\"Description\"\
  );    // <Description>\n\n        // 写入 Description 的内容。\n        string cdata =\
  \ @\"This is some text that describes the XML file.\nIt's a multi-line description.\n\
  < > ' \"\" &\nThis is its last line.\";\n        writer.WriteCData(cdata);\n\n \
  \       writer.WriteComment(\"This Student's data is stored in sub-elements.\");\n\
  \        writer.WriteStartElement(\"Student\");        // <Student>\n        writer.WriteElementString(\"\
  FirstName\", \"Arthur\");\n        writer.WriteElementString(\"LastName\", \"Andrews\"\
  );\n        writer.WriteElementString(\"StudentId\", \"83746\");\n        writer.WriteEndElement();\
  \                   // </Student>\n\n        writer.WriteComment(\"This Student's\
  \ data is stored in attributes.\");\n        writer.WriteStartElement(\"Student\"\
  );        // <Student>\n        writer.WriteAttributeString(\"FirstName\", \"Bethany\"\
  );\n        writer.WriteAttributeString(\"LastName\", \"Bechtold\");\n        writer.WriteAttributeString(\"\
  StudentId\", \"12653\");\n        writer.WriteEndElement();                   //\
  \ </Student>\n\n        writer.WriteEndElement();                   // </Description>\n\
  \        writer.WriteEndElement();                   // </Students>\n    }\n```\n\
  \n这段代码非常简单。唯一值得特别提到的是程序使用多行 `string` 来创建 CDATA 的方式。请记住，C# 字符串字面量以 `@\"` 开始，并包括包括换行在内的所有字符，直到结束引号字符。由于此示例需要在\
  \ CDATA 中包含一个 `\"` 字符，代码在字符串字面量中双写该字符，以便在字符串中放置单个字符实例。\n\n图 24-1 显示了 UseXmlWriter\
  \ 程序在 `TextBox` 中显示生成的 XML 文件。请注意，文件的文本全部连在一起，除了像 `Description` 元素的 CDATA 内容中包含的空白外，没有空格。其他程序可以顺利地读取该文件，但对人类来说很难阅读。\n\
  \n![c24f001.tif](img/c24f001.png)\n\n图 24-1 UseXmlWriter 示例程序构建并显示了一个 XML 文件。\n\n\
  `XmlTextWriter` 类继承自 `XmlWriter`，其工作方式与 `XmlWriter` 非常相似，但它可以产生良好缩进的输出。\n\n`FormatXml`\
  \ 示例程序（可以在本书的网站上下载）如图图 24-2\n\n图 24-2 FormatXml 示例程序使用 `XmlTextWriter` 对象来产生良好缩进的\
  \ XML 代码。\n\n为了生成缩进的 XML 代码，`FormatXml` 示例程序创建了 `XmlTextWriter` 而不是 `XmlWriter`。它将\
  \ `XmlTextWriter` 的 `Formatting` 属性设置为 `Indented`，然后按照之前的方式创建 XML 文件。\n\n以下代码显示了创建\
  \ `XmlTextWriter` 并设置其 `Formatting` 属性的语句。\n\n```csharp\n// 创建写入器。\nusing (XmlTextWriter\
  \ writer = new XmlTextWriter(fileTextBox.Text, null))\n{\n    // 使格式美化。\n    writer.Formatting\
  \ = Formatting.Indented;\n\n    // 按照之前的方法生成 XML 代码...\n}\n```\n\n`XmlWriter` 类是一个写入\
  \ XML 输出的快速工具。它以“仅向前”的方式工作，因此在写入某些内容后，您无法返回并更改它。\n\n它还是非缓存的，因此它不会记住过去写入的内容。写入器会跟踪到达当前位置所经过的路径，但仅此此。例如，它可能知道自己通过以下路径到达\
  \ `LastName` 元素。\n\n```xml\n<Students>\n    <Student>\n        <LastName>\n```\n\
  \n写入器不会记住在此途中可能写入的任何其他元素，例如其他 `Student` 元素或此 `Student` 元素内的其他元素。\n\n### 文档对象模型\n\
  \n构建 XML 文档的另一种方法是使用 XML 文档对象模型 (DOM)。DOM 使用对象来创建 XML 文档的内存模型。在构建了这样的模型后，您可以使用它的方法来操作该模型，并将结果保存到\
  \ XML 文件或字符串中。\n\n`WriteDom` 示例程序（可以在本书的网站上下载）使用以下代码创建一个包含之前所示学生数据的 XML 文件。\n\n\n\
  \n\n\n```sharp\n// Write a text file.\nprivate void writeButton_Click(object sender,\
  \ EventArgs e)\n{\n    // Create the document.\n    XDocument document = new XDocument();\n\
  \n    // Create the root element\n    XElement students = new XElement(\"Students\"\
  );           // <Students>\n    document.Add(students);\n\n    XElement description\
  \ = new XElement(\"Description\");     // <Description>\n    students.Add(description);\n\
  \n    // Write the Description's content.\n    string cdata = @\"This is some text\
  \ that describes the XML file.\nIt's a multi-line description.\n< > ' \"\" &\nThis\
  \ is its last line.\";\n    description.Add(new XCData(cdata));\n\n    students.Add(new\
  \ XComment(                              // Comment.\n        \"This Student's data\
  \ is stored in sub-elements.\"));\n\n    XElement student = new XElement(\"Student\"\
  );             // <Student>\n    students.Add(student);\n\n    student.SetElementValue(\"\
  FirstName\", \"Arthur\");         // <FirstName>\n    student.SetElementValue(\"\
  LastName\", \"Andrews\");         // <LastName>\n    student.SetElementValue(\"\
  StudentId\", \"83746\");          // <StudentId>\n\n    students.Add(new XComment(\
  \                              // Comment.\n        \"This Student's data is stored\
  \ in attributes.\"));\n\n    student = new XElement(\"Student\");              \
  \        // <Student>\n    students.Add(student);\n\n    student.SetAttributeValue(\"\
  FirstName\", \"Bethany\");      // FirstName\n    student.SetAttributeValue(\"LastName\"\
  , \"Bechtold\");      // LastName\n    student.SetAttributeValue(\"StudentId\",\
  \ \"12653\");        // StudentId\n    // Save the document in a file.\n    using\
  \ (XmlTextWriter writer = new XmlTextWriter(fileTextBox.Text, null))\n    {\n  \
  \      // Make it pretty.\n        writer.Formatting = Formatting.Indented;\n\n\
  \        document.WriteTo(writer);\n    }\n\n    // Display the file.\n    resultTextBox.Text\
  \ = File.ReadAllText(fileTextBox.Text);\n}\n```\n\n该代码首先创建一个 `XDocument` 对象来表示 XML\
  \ 代码。\n\n接下来，它创建了一个 `XElement` 对象来表示文件的 `Students` 元素，并使用文档的 `Add` 方法将其添加到文档的子集合中。\n\
  \n代码创建了另一个 `XElement` 来表示 `Description` 元素，并将其添加到 `Students` 元素中。然后添加了一个新的 `XCdata`\
  \ 对象来存储 `Description` 的数据。\n\n其余代码遵循类似的模式，创建新对象并将它们添加到应该包含它们的对象的子集合中。\n\n在完成文档构建后，程序创建了一个\
  \ `XmlTextWriter`，就像 `FormatXml` 示例程序所做的那样。它设置了写入器的 `Formatting` 属性，然后使用对象的 `WriteTo`\
  \ 方法使文档将其 XML 代码写入文件。\n\n程序最后通过显示生成的 XML 文件来结束。\n\n操作 DOM 时最重要的两个类类是 `XDocument`\
  \ 和 `XElement`。\n\n`XDocument` 类最实用的属性是 `Declaration`（用于获取或设置文档的 XML 声明）和 `Root`（用于返回文档的根元素）。下表列出了\
  \ `XDocument` 类最常用的方法。\n\n| 方法 | 用途 |\n| :--- | :--- |\n| `Add` | 向文档的子集合中添加一个项。（注意，你只能向文档添加一个子元素，即根元素。）\
  \ |\n| `DescendantNodes` | 返回文档后代 `XNode` 对象的集合。 |\n| `Descendants` | 返回文档后代 `XElement`\
  \ 对象的集合。如果指定了名称，该方法将仅返回该名称的元素。 |\n| `Load` | 从文件名、流或 `XmlReader` 加载文档。 |\n| `Parse`\
  \ | 从 XML 字符串创建新的 `XDocument`。 |\n| `Save` | 将文档保存到文件、流或写入器。 |\n| `ToString` | 返回文档的缩进\
  \ XML 代码。 |\n| `WriteTo` | 将文档写入 `XmlWriter`。 |\n\n下表列出了 `XElement` 类最常用的属性。\n\n\
  | 属性 | 用途 |\n| :--- | :--- |\n| `Document` | 返回包含该元素的 `XDocument`。 |\n| `FirstAttribute`\
  \ | 获取元素的第一个属性。 |\n| `FirstNode` | 获取元素的第一个子节点。 |\n| `HasAttributes` | 如果元素具有属性则返回\
  \ `true`。 |\n| `HasElements` | 如果元素具有子元素则返回 `true`。 |\n| `IsEmpty` | 如果元素不包含内容则返回\
  \ `true`。（它可能仍具有属性。） |\n| `LastAttribute` | 获取元素的最后一个属性。 |\n| `LastNode` | 获取元素的最后一个子节点。\
  \ |\n| `Name` | 获取或设置元素的名称。 |\n| `NextNode` | 返回元素父级子列表中的下一个节点。 |\n| `NodeType`\
  \ | 获取节点的类型。 |\n| `Parent` | 获取元素的父元素。 |\n| `PreviousNode` | 返回元素父级子列表中的上一个节点。 |\n\
  | `Value` | 获取或设置节点的文本内容。 |\n\n下表列出了 `XElement` 类最常用的方法。\n\n| 方法 | 用途 |\n| :---\
  \ | :--- |\n| `Add` | 在元素子集合的末尾添加一个项。 |\n| `AddAfterSelf` | 在此元素之后向父级子集合添加一个项。 |\n\
  | `AddBeforeSelf` | 在此元素之前向父级子集合添加一个项。 |\n| `AddFirst` | 在元素子集合的开头添加一个项。 |\n| `Ancestors`\
  \ | 返回元素的祖先 `XElement` 对象的集合。 |\n| `Attribute` | 返回具有特定名称的属性。 |\n| `Attributes`\
  \ | 返回包含此元素属性的集合。 |\n| `DescendantNodes` | 返回元素的后代 `XNode` 对象的集合。 |\n| `Descendants`\
  \ | 返回元素的后代 `XElement` 对象的集合。 |\n| `DescendantsAndSelf` | 返回包含此元素及其后代的 `XElement`\
  \ 对象集合。 |\n| `Element` | 返回具有指定名称的子元素。 |\n| `Elements` | 返回持有元素子元素的集合。 |\n| `ElementsAfterSelf`\
  \ | 返回位于此元素之后的兄弟元素集合。 |\n| `ElementsBeforeSelf` | 返回位于此元素之前的兄弟元素集合。 |\n| `IsAfter`\
  \ | 如果此节点在文档中另一个指定节点之后则返回 `true`。 |\n| `IsBefore` | 如果此节点在文档中另一个指定节点之前则返回 `true`。\
  \ |\n| `Load` | 从文件名、流或读取器加载元素。 |\n| `Nodes` | 返回持有此元素子节点的集合。 |\n| `NodesAfterSelf`\
  \ | 返回位于此节点之后的兄弟节点集合。 |\n| `NodesBeforeSelf` | 返回位于此节点之前的兄弟节点集合。 |\n| `Parse` |\
  \ 从 XML 字符串创建 `XElement`。 |\n| `Remove` | 从其父级移除此元素。 |\n| `RemoveAll` | 移除此元素的所有节点和属性。\
  \ |\n| `RemoveAttributes` | 移除此元素的属性。 |\n| `RemoveNodes` | 移除此元素的子节点。 |\n| `ReplaceAll`\
  \ | 使用指定的新项替换元素的所有子节点和属性。 |\n| `ReplaceAttributes` | 使用指定的新项替换元素的属性。 |\n| `ReplaceNodes`\
  \ | 使用指定的新项替换元素的子节点。 |\n| `ReplaceWith` | 使用指定的新内容替换此节点。 |\n| `Save` | 将元素保存到文件、流或写入器。\
  \ |\n\n\n\n\n\n| `SetAttributeValue` | 设置、添加或删除属性。 |\n| :--- | :--- |\n| `SetElementValue`\
  \ | 设置、添加或删除子元素。 |\n| `SetValue` | 设置元素的值。 |\n| `ToString` | 返回元素的缩进 XML 代码。 |\n\
  | `WriteTo` | 将元素写入 `XmlWriter` 中。 |\n\n如果你需要遍历结构以检查数据并进行更改，那么对象模型（object model）会非常方便，但\
  \ `XmlWriter` 类仍然有其用处。文档模型（document model）必须包含组成 XML 数据的所有元素。如果你正在构建一个巨大的模型，DOM\
  \ 结构将占用大量内存。\n\n相比之下，`XmlWriter` 不记住过去写过的内容，因此它可以编写巨大的 XML 文档而不会占用大量内存。然而，许多程序员发现\
  \ `XmlWriter` 比 DOM 更繁琐，因此他们更倾向于使用 DOM。\n\n### XML 字面量 (XML Literals)\n\n`XmlWriter`\
  \ 类和 DOM 均允许程序构建 XML 文档，但两者都需要大量的代码。如果你能够循环遍历包含对象的数组、列表或其他数据结构，并为这些对象生成 XML 数据，那么使用它们会简单得多。\n\
  \n然而，有时你可能只是想在程序内部创建一个 XML 对象层次结构。Visual Basic 允许你像下面的代码一样使用字符串字面量。\n\n```\nDim\
  \ arthur As XElement =\n    <Student>\n        <FirstName>Arthur</FirstName>\n \
  \       <LastName>Andrews</LastName>\n        <StudentID>83746</StudentID>\n   \
  \ </Student>\n```\n\nC# 支持 XML 字面量。（尽管如果有一天它支持了，我也不会意外。）幸运的是，C# 支持多行字符串字面量，其效果几乎一样。只需使用\
  \ `XElement.Parse` 方法来解析持有 XML 代码的多行字符串即可。下面的代码显示了一个示例。\n\n```\nXElement student\
  \ = XElement.Parse(\n    @\"<Student>\n        <FirstName>Arthur</FirstName>\n \
  \       <LastName>Andrews</LastName>\n        <StudentID>83746</StudentID>\n   \
  \ </Student>\");\n```\n\nXML 字符串可以包含任何数量的嵌套 XML 代码，因此你可以使用这种技术构建任意复杂性的 XML 文档。\n\
  \n## 读取 XML 数据\n\n之前的章节解释了如何使用 `XmlTextWriter` 和 DOM 类来创建 XML 文档。.NET Framework\
  \ 提供了相应的读取 XML 文档的技术。接两个章节解释了如何使用 `XmlTextReader` 类和文档对象模型来读取 XML 代码。\n\n### XmlTextReader\n\
  \n`XmlWriter` 类及其子类（如 `XmlTextWriter`）提供了快速、向前且非缓存的写入 XML 数据的方法。同样，`XmlTextReader`\
  \ 类提供了快速、向前且非缓存的读取 XML 数据的方法。它提供了逐个节点移动通过 XML 文件并检查每个节点提供的数据的方法。\n\n要使用 `XmlTextReader`，请使用该类的构造函数或\
  \ `XmlReader` 类的静态方法 `Create` 来创建一个与要读取的文件或输入流关联的对象。使用该对象的 `Read` 方法从 XML 数据中读取下一个节点。在读取节点后，您可以使用读取器的属性和方法来确定节点的名称、类型、属性、内容以及其他属性。\n\
  \n下表列出了最实用的 `XmlReader` 属性。\n\n| 属性 | 含义 |\n| :--- | :--- |\n| `AttributeCount`\
  \ | 返回节点拥有的属性数量。 |\n| `Depth` | 返回当前节点在 XML 层次结构中的深度。 |\n| `EOF` | 当读取器到达 XML 数据末尾时返回\
  \ `true`。 |\n| `HasAttributes` | 如果节点具有属性，返回 `true`。 |\n| `HasValue` | 如果节点可以拥有值，返回\
  \ `true`。 |\n| `IsEmptyElement` | 如果节点是空元素（如 `<Overdue />`），则返回 `true`。 |\n| `Item`\
  \ | 根据索引或名称获取节点属性。（这是类的索引器，因此您像使用 `reader[0]` 那样而不是显式调用 `Item` 属性。） |\n| `Name`\
  \ | 返回节点的名称。 |\n| `Value` | 返回当前节点的文本值。 |\n\n下表列出了 `XmlReader` 类最实用的方法。\n\n| 方法\
  \ | 用途 |\n| :--- | :--- |\n| `Create` | 创建一个与字符串、流、文件或其他数据源关联的新读取器。 |\n| `Dispose`\
  \ | 释放对象的资源。您可以包含 `using` 语句来自动调用 `Dispose`。 |\n| `GetAttribute` | 根据索引或名称获取当前节点的属性。（类似于\
  \ `Item` 属性。） |\n| `IsName` | 如果参数是有效的 XML 名称，返回 `true`。 |\n| `MoveToAttribute`\
  \ | 将读取器移动到由索引或名称指定的属性。 |\n| `MoveToContent` | 将读取器移动到当前节点的内容。 |\n| `MoveToElement`\
  \ | 将读取器移动到包含读取器当前位置元素。例如，如果您移动读取器检查元素的属性，该方法会将读取器移回元素节点。 |\n| `MoveToFirstAttribute`\
  \ | 将读取器移动到当前节点的第一个属性节点。 |\n| `MoveToNextAttribute` | 将读取器移动到当前节点的下一个属性节点。 |\n|\
  \ `Read` | 从 XML 数据中读取下一个节点。 |\n| `InnerXml` | 将当前节点的后代作为 XML 字符串返回。 |\n| `OuterXml`\
  \ | 将当前节点的子树（包括当前节点）作为 XML 字符串返回。 |\n| `ReadDescendant` | 将读取器移动到指定名称的子元素。 |\n|\
  \ `ReadNextSibling` | 将读取器跳过当前节点的剩余部分到其兄弟节点。 |\n| `Skip` | 跳过当前节点的子节点。 |\n\n可下载的\
  \ Read 示例使用以下代码读取 XML 文件。\n\n```\n// 读取 XML 数据。\nprivate void readButton_Click(object\
  \ sender, EventArgs e)\n{\n    string result = \"\";\n\n    // 为文件打开读取器。\n    using\
  \ (XmlReader reader = XmlReader.Create(fileTextBox.Text))\n    {\n        // 从文件中读取标签。\n\
  \        while (reader.Read())\n        {\n            switch (reader.NodeType)\n\
  \            {\n                case XmlNodeType.Element:\n                    result\
  \ += \"Element: \" + reader.Name + \"\\n\";\n                    if (reader.HasAttributes)\n\
  \                    {\n                        for (int i = 0; i < reader.AttributeCount;\
  \ i++)\n                            result += \"    Attribute: \" + reader[i] +\
  \ \"\\n\";\n                    }\n                    break;\n                case\
  \ XmlNodeType.EndElement:\n                    result += \"EndElement: \" + reader.Name\
  \ + \"\\n\";\n                    break;\n                case XmlNodeType.Text:\n\
  \                    result += \"Text: \" + reader.Value + \"\\n\";\n          \
  \          break;\n                case XmlNodeType.CDATA:\n                   \
  \ result += \"CDATA: [\" + reader.Value.Replace(\"\\n\",\"r\\n\") + \"]\\n\";\n\
  \                    break;\n                case XmlNodeType.Comment:\n       \
  \             result += \"Comment: \" + reader.Value + \"\\n\";\n              \
  \      break;\n            }\n        }\n    }\n    resultTextBox.Text = result;\n\
  }\n```\n\n\n\n\n最后，如果节点是注释，代码将显示其值。\n\n在处理完文件所有的节点后，程序会在 `TextBox` 中显示结果。\n\n图 24-3\
  \ 显示了 `UseXmlReader` 程序在读取了本章之前所示学生 XML 数据后的状态。如果你仔细观察，可以看到结果中的数据片段。\n\n![c24f003.tif](img/c24f003.png)\n\
  \n图 24-3: `UseXmlReader` 示例程序读取 XML 文件并显示其中包含的节点信息。\n\n### 文档对象模型 (DOM)\n\n`XmlReader`\
  \ 和 `XmlTextReader` 类速度很快，但有些笨拙，因为它们允许你只能向前移动数据。如果你知道数据的结构或正在寻找特定的节点，它们是高效的，但它们不能让你探索\
  \ XML 文件的结构。\n\n正如你可以使用 DOM 构建 XML 文件一样，也可以使用 DOM 来研究现有的 XML 文件。这样，你的程序就可以遍历其节点来检查其结构、查找值、复制子树，并使用文档的完整结构来研究和操作数据。\n\
  \n要从 XML 数据中加载对象模型，只需调用 `XDocument` 类的静态 `Load` 方法，并传递文件名、流或 `XmlReader` 即可。\n\n\
  `ReadDom` 示例程序可以在本书的网站下载，它使用以下代码读取并显示之前所示包含学生数据的 XML 文件。\n\n```\n// 将 XML 文件加载到\
  \ DOM 中。\nXDocument document = XDocument.Load(fileTextBox.Text);\n\n// 显示文档的 XML\
  \ 文本。\nresultTextBox.Text = document.ToString();\n```\n\n没有比这更简单的了！当然，在实际程序中，你将需要使用\
  \ `XDocument`对象的属性和方法来找到你想要的数据并对其进行处理。\n\n### 相关技术\n\nXML 文件本身只存储数据。它不会对数据进行选择、排序、重新编排或其他形式的操作。然而，这些操作通常有用，因此涌出了许多相关技术来处理\
  \ XML 数据。其中一些技术包括以下内容。\n\n*   **XSL (可扩展样式表语言)**——这指的是一组用于重新格式化 XML 数据的语言和工具。它包括以下内容：\n\
  \    *   **XSLT (XSL 转换)**——一种将 XML 数据转换为其他格式（如纯文本、HTML、重新排序的 XML 文档或 XSL FO）的语言。\n\
  \    *   **XSL FO (XSL 格式对象)**——一种用于为屏幕、PDF、打印机等输出 XML 数据的语言。\n    *   **XPath**——这是一种\
  \ XSL 和其他 XML 工具使用的查询语言，用于查找和识别 XML 数据中的项。\n*   **XQuery**——一种类似于 SQL 的查询 XML 语言。\n\
  *   **DTD (文档类型定义)**——一种 XML 数据文件验证语言。你使用 DTD 来定义 XML 文件所需的结构。然后你可以验证特定的 XML 文件以查看它是否满足这些要求。\n\
  *   **XSD (XML 架构定义)**——另一种 XML 数据文件验证语言。参见 DTD。\n*   **XLink**——一种用于在 XML 数据中定义超链接的语言。\n\
  *   **SOAP (简单对象访问协议)**——一种允许应用程序（通常运行在不同的计算机上）交换数据的协议。\n*   **WSDL (Web 服务定义语言)**——一种用于描述\
  \ Web 服务的语言。\n*   **RSS (实时简单摘要)**——一种用于 XML 新闻馈和发布新闻类项目网站的格式。\n\n这里没有空间涵盖所有这些技术，但我想至少对其中两个进行简要介绍：XPath\
  \ 和 XSLT。\n\n### XPath\n\nXPath 是一种用于识别 XML 数据中项的语言。例如，你可以使用 XPath 选择特定名称的节点、具有某些属性的节点以及与其他节点具有特定关系的节点。\n\
  \n在 C# 中使用 XPath，你首先定义一个 XPath 查询来识别你想要选择的元素。然后调用 `XDocument` 或 `XElement` 对象的 `XPathSelectElement`\
  \ 或 `XPathSelectElements` 方法来找到所需的元素。\n\nXPath 查询看起来有点像目录层次结构中的文件路径。查询还可以包含作为通配符运行的运算符、过滤结果并指定节点之间的关系。例如，以下语句选择了代表\
  \ `Student` 元素的 `XElement` 对象，这些元素的 `GradePointAverage` 属性值小于 2.5。\n\n```\nIEnumerable<XElement>\
  \ students =\n    document.XPathSelectElements(\"//Student[@GradePointAverage <\
  \ 2.5]\");\n```\n\n下表列出了你在 XPath 查询中最有用的运算符。\n\n| 运算符 | 含义 |\n| :--- | :--- |\n\
  | `/` | 选择直接子节点。 |\n| `//` | 选择后代。 |\n| `.` | 当前节点。 |\n| `..` | 当前节点的父节点。 |\n| `*`\
  \ | 匹配任意内容。 |\n| `@` | 匹配属性的属性缀。例如，`@Cost` 匹配名为 `Cost` 的属性。 |\n| `@*` | 选择所有属性。\
  \ |\n| `()` | 分组操作。 |\n| `[ ]` | 应用过滤器。例如，`//Planet[@Name=\"Earth\"]` 匹配 `Name`\
  \ 属性值为 `Earth` 的 `Planet` 元素。 |\n| `+` | 加法。 |\n| `-` | 减法。 |\n| `div` | 浮点除法。 |\n\
  | `*` | 乘法。 |\n| `mod` | 取模。 |\n| `and` | 逻辑与 |\n| `or` | 逻辑或 |\n| `not()` | 逻辑非\
  \ |\n| `=` | 等于 |\n| `!=` | 不等于 |\n| `<` | 小于 |\n| `<=` | 小于等于 |\n| `>` | 大于 |\n\
  | `>=` | 大于等于 |\n| `[ ]` | 用于访问集合中项的下标运算符。 |\n\n\n\n\n\n这段代码获取所选行星的名称，并使用它来构建如下格式的\
  \ XPath 查询。\n\n```\n//Planet[Name=\"Mercury\"]\n```\n\n该查询选择文档中任何深度的 `Planet` 元素，其中\
  \ `Planet` 的子元素 `Name` 的值为 `Mercury`（水星）。\n\n然后，程序调用 `XDocument` 对象的 `XPathSelectElement`\
  \ 方法获取满足查询的第一个（在本例中也是唯一的）元素。接着，代码遍历 `Planet` 元素的子元素，并将它们的名称和值添加到结果字符串中。完成后，程序显示结果。\n\
  \n图 24-4 显示了 `UseXPath` 示例程序显示了关于水星的信息。\n\n![c24f004.tif](img/c24f004.png)\n\n图\
  \ 24-4: `UseXPath` 示例程序使用 XPath 查询显示有关行星的信息。\n\n有关 XPath 的更多信息，请参阅以下链接。\n\n* [msdn.microsoft.com/library/ms256115.aspx](http://msdn.microsoft.com/library/ms256115.aspx)\
  \ 上的“XPath 引用”（XPath Reference） \n* [msdn.microsoft.com/library/ms256086.aspx](http://msdn.microsoft.com/library/ms256086.aspx)\
  \ 上的“XPath 示例”（XPath Examples）\n\n### XSLT\n\nXSLT 是一种你可以将 XML 数据转换为新格式的语言。它是一种相当复杂的语言，因此在这里没有空间深入介绍。要真正学习这种语言，请参阅以下链接。\n\
  \n* [www.w3schools.com/xsl/default.asp](http://www.w3schools.com/xsl/default.asp)\
  \ 上的“XSLT 教程”（XSLT Tutorial）\n* [www.w3schools.com/xsl/xsl_w3celementref.asp](http://www.w3schools.com/xsl/xsl_w3celementref.asp)\
  \ 上的“XSLT 元素引用”（XSLT Elements Reference）\n* [www.w3.org/TR/xslt](http://www.w3.org/TR/xslt)\
  \ 上的“XSL 转换 (XSLT) 版本 1.0”（XSL Transformations (XSLT) Version 1.0）\n\n本节其余部分并不是解释整个\
  \ XSLT 语言，而是解释了一个示例。`TransformPlanets` 示例程序使用 XSLT 将上一节描述的 `Planets.xml` 文件转换为 HTML\
  \ 文件。\n\n回想一下 `Planets.xml` 文件具有以下结构。\n\n```\n<SolarSystem>\n  <Planets>\n    <Planet>\n\
  \      <Name>Mercury</Name>\n      <Distance>57.91</Distance>\n      <Radius>2340</Radius>\n\
  \      <LengthOfYear>0.24085</LengthOfYear>\n      <Day>88</Day>\n      <Mass>0.054</Mass>\n\
  \    </Planet>\n\n    ... 省略其他行星 ...\n\n  </Planets>\n</SolarSystem>\n```\n\n以下代码显示了\
  \ XSLT 文件 `PlanetsToHtml.xslt`。\n\n```\n<?xml version=\"1.0\" encoding=\"utf-8\"\
  ?>\n<xsl:stylesheet version=\"1.0\"\n    xmlns:xsl=\"http://www.w3.org/1999/XSL/Transform\"\
  \n    xmlns:msxsl=\"urn:schemas-microsoft-com:xslt\"\n    exclude-result-prefixes=\"\
  msxsl\"\n>\n    <xsl:output method=\"html\" indent=\"yes\"/>\n\n    <xsl:template\
  \ match=\"Planets\">\n      <HTML>\n        <BODY>\n          <TABLE BORDER=\"2\"\
  >\n            <TR>\n              <TH>Planet</TH>\n              <TH>Distance to\
