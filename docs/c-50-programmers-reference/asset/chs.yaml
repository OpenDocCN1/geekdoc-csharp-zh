  \ (`System.Windows.Forms`) 和 `OleDbDataAdapter`。然后点击确定，将这些组件添加到工具箱。\n3.  为 `Students`\
  \ 表创建一个数据适配器。\n    1.  双击工具箱中的 `OleDbDataAdapter` 工具，启动显示在图 23-9 中的数据适配器配置向导。选择你之前创建的连接并点击“下一步”。![c23f009.tif](img/c23f009.png)\n\
