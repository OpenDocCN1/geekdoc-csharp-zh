  \ `Player` 类应该是包含种族的继承层级结构的一部分。它应该有一个是武器实例的属性。\n\n图 A-4 显示程序的继承层级结构。\n\n![bapp01f004.eps](img/bapp01f004.png)\n\
  \n**图 A-4：** 角色游戏需要两个继承层级结构，一个用于种族，一个用于武器。\n\n6. 这种情况有点棘，因为玩家既“是”种族“是”职业。例如，一个特定的玩家“是”`Dwarf`（矮人）且“是”`Chemist`（化学家）。这可能暗示你应该使用多继承（通过接口继承实现）。\n\
  \n这种方法的问题在于会导致大量的类来涵盖所有可能的组合：`Human`/`Fighter`（人类/战士）、`Human`/`MagicUser`（人类/法师）、`Dwarf`/`Illusionist`（矮人/幻术师）、`Elf`/`Witch`（精灵/巫师）等等。如果你有\
  \ N 种种族和 M 种职业及专长，你需要创建 N × M 类来涵盖每种可能的组合。对于目前为止的示例，会有 3 × 8 = 24 这样的组合。\n\n\n\n\
  \n更好的方法是认为玩家“拥有”（has-a）一个职业。然后你可以给 `Player` 类添加一个属性来存储玩家的职业。\n\n图 A-5 显示了 `Profession`\
