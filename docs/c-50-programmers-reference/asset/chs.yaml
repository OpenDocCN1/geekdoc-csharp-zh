  \n\n\n\n\n```cs\n// Task A.\nprivate void TaskA()\n{\n    Console.WriteLine(\"TaskA:\
  \ Locking A\");\n    lock (LockObjectA)\n    {\n        Thread.Sleep(500);\n   \
  \     Console.WriteLine(\"TaskA: Locking B\");\n        lock (LockObjectB)\n   \
  \     {\n            // Update the value.\n            BestValue = ValueA;\n   \
  \     }\n    }\n}\n\n// Task B.\nprivate void TaskB()\n{\n    Console.WriteLine(\"\
  TaskB: Locking B\");\n    lock (LockObjectB)\n    {\n        Thread.Sleep(500);\n\
