  \n\n\n\n\n1. 第一块代码使用了 `else` 语句，因此程序在找到匹配项后会跳过其之后的所有测试。例如，如果 `person.Type` 是 `Customer`，则它将跳过将\
  \ `person.Type` 与 `Employee` 和 `Manager` 进行比较的测试。\n\n第二块代码即使 `person.Type` 匹配了前面的某一项，也会执行所有三次比较。这使得第二块代码的效率比第一块略低。在这个示例中，由于条件是简单的比较，差异会微乎其微。如果测试调用了复杂的方法，那么速度上的差异可能会显著。\n\
  \n2. 下面代码使用了 `switch` 语句代替 `if` 语句。\n\n```c\nswitch (person.Type)\n{\n    case PersonType.Customer:\n\
  \        //...\n        break;\n    case PersonType.Employee:\n        //...\n \
  \       break;\n    case PersonType.Manager:\n        //...\n        break;\n}\n\
  ```\n\n3. 一系列的 `if-else` 语句会调用 `GetBirthMonth` 方法 12 次。而 `switch` 语句只会调用该方法一次。因为\
  \ `GetBirthMonth` 需要访问数据库，将其调用 12 次而不是 1 次是低效的，所以 `switch` 语句更好。\n\n4. 下面代码使用 `switch`\
  \ 语句来确定人的出生石。\n\n```csharp\nstring birthstone=\"\";\n\nswitch (person.GetBirthMonth())\n\
  {\n    case 1:\n        birthstone = \"Garnet\";\n        break;\n    case 2:\n\
  \        birthstone = \"Amethyst\";\n        break;\n    case 3:\n        birthstone\
  \ = \"Aquamarine\";\n        break;\n    case 4:\n        birthstone = \"Diamond\"\
  ;\n        break;\n    case 5:\n        birthstone = \"Emerald\";\n        break;\n\
  \    case 6:\n        birthstone = \"Alexandrite\";\n        break;\n    case 7:\n\
  \        birthstone = \"Ruby\";\n        break;\n    case 8:\n        birthstone\
  \ = \"Peridot\";\n        break;\n    case 9:\n        birthstone = \"Sapphire\"\
  ;\n        break;\n    case 10:\n        birthstone = \"Tourmaline\";\n        break;\n\
  \    case 11:\n        birthstone = \"Topaz\";\n        break;\n    case 12:\n \
  \       birthstone = \"Zircon\";\n        break;\n}\n```\n\n一系列 `if-else` 语句的问题在于，最直观的版本调用了\
  \ `GetBirthMonth` 方法 12 次，每个 `if` 语句调用一次。如果你只调用一次该方法并将结果保存起来以便在 `if` 语句中使用，就可以避免那些调用。接下来的代码展示了这一版本。\n\
  \n```csharp\nstring birthstone=\"\";\nint month = person.GetBirthMonth();\n\nif\
  \ (month == 1) birthstone = \"Garnet\";\nelse if (month == 2) birthstone = \"Amethyst\"\
  ;\nelse if (month == 3) birthstone = \"Aquamarine\";\nelse if (month == 4) birthstone\
  \ = \"Diamond\";\nelse if (month == 5) birthstone = \"Emerald\";\nelse if (month\
  \ == 6) birthstone = \"Alexandrite\";\nelse if (month == 7) birthstone = \"Ruby\"\
  ;\nelse if (month == 8) birthstone = \"Peridot\";\nelse if (month == 9) birthstone\
  \ = \"Sapphire\";\nelse if (month == 10) birthstone = \"Tourmaline\";\nelse if (month\
  \ == 11) birthstone = \"Topaz\";\nelse if (month == 12) birthstone = \"Zircon\"\
  ;\n```\n\n这个版本比 `switch` 语句更简洁且易于阅读。（实际上，你可以将 `case` 关键字、代码行和 `break` 关键字都放在同一行，以使\
  \ `switch` 版本更简洁。它看起来可能有点拥挤，但你更倾向于哪种版本主要取决于个人偏好。）\n\n5. 要要在 `switch` 语句中实现这一点，你需要\
  \ 100 个独立的 `case` 语句，每个可能的测试分数对应一个。如果你让 `default` 分支处理处理所有小于 60 的值（即 F 等级成绩），你就可以将该数量减少到\
  \ 40 个 `case` 语句。\n\n相比之下，`if` 语句可以评估布尔表达式，因此每个 `if` 语句可以处理一个范围的测试分数。这使其变得简洁得多。\n\
