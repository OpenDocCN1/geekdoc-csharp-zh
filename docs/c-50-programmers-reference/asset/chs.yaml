  \ `Invoice` 类。\n\n8. 最明显的改进是命名类以消除重复名称。也许你可以将 `Fulfillment` 命名空间中的 `Order` 类重名为\
  \ `Shipment` 或 `PackingList`（取决于该类的用途）。\n\n第二个改进是平坦化命名空间层次结构。这种结构实际上并不有助于保持代码分离。你可以通过将不同的代码段放在单独的模块中轻松实现。\n\
  \n命名空间层次结构的出现通常是因为应用程序的部分是在不同的库中实现的。这些库具有不同的命名空间以防止与其他库发生名称冲突。然而，在这个示例中，每个命名空间不太可能代表一个独立的库。例如，`Fulfillment`\
  \ 和 `Billing` 代码可能在没有 `Customer` 类的情况下运行，因此它们可能不是作为独立的库开发的。\n\n最后的简化方案是将两个 `Order`\
  \ 类合并为一个类。这是否比将它们保持为独立类更好，取决于它们的重叠程度。如果它们在实际上是相同的，那么合并它们将简化应用程序。如果它们服务于不同的用途，那么保持它们为独立类可能更好。\n\
  \n## 第 14 章\n\n1. `PalindromeChecker` 示例程序使用以下代码执行此操作。关键代码已加粗高亮。\n\n```\nprivate\
  \ void palindromeTextBox_TextChanged(object sender, EventArgs e)\n{\n    string\
  \ text = palindromeTextBox.Text.ToLower().Replace(\" \", \"\");\n    string reverse\
  \ = new string(text.Reverse().ToArray());\n    if (text == reverse)\n    {\n   \
  \     isAPindromeLabel.Text = \"is a palindrome\";\n        isAPindromeLabel.ForeColor\
  \ = Color.Green;\n    }\n    else\n    {\n        isAPindromeLabel.Text = \"is not\
  \ a palindrome\";\n        isAPindromeLabel.ForeColor = Color.Red;\n    }\n}\n```\n\
  \n高亮代码使用 `Reverse` 方法反转字符串的字符，并获取一个持有反转字符串字符的 `IEnumerable<char>`。接下来，它使用 `ToArray`\
  \ 将 `IEnumerable<char>` 转换为 `char[]`。然后它将 `char[]` 传递给 `string` 类的构造函数，以获取原始字符串反转后的字符串。\n\
  \n最后，程序比较原始字符串和反转后的字符串，并更新显示以指示它们是否相同。\n\n2. `BookLists` 示例程序使用以下代码创建并初始化其列表字典。\n\
  \n\n\n\n\n```csharp\n//书籍数据。\nprivate Dictionary<string, List<string>> Books =\n\
  \    new Dictionary<string, List<string>>()\n    {\n        {\"Stephen King\",\n\
