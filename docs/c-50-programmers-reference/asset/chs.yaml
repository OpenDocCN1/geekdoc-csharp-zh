  public class CircularQueue<T>\n{\n    // A list to hold items.\n    private List<T>\
  \ List = new List<T>();\n\n    // The index of the current item.\n    private int\
  \ CurrentItem = -1;\n\n    // Add an item to the queue.\n    public void Enqueue(T\
  \ value)\n    {\n        List.Add(value);\n    }\n\n    // Return the next item\
