  public Ful.Order order2;\n```\n\n6. 你可以像练习 5 那样为 `OrderTracker.CustomerTools.Fulfillment`\
  \ 类定义别名。代码可以在无需任何命名空间或别名的情况下使用另一个 `Order` 类。以下代码展示了 `Customer` 类如何定义这两种对象：\n\n```\n\
  public Order order1;\npublic Ful.Order order2;\n```\n\n7. `Billing` 命名空间没有定义任何在层次结构其他地方使用的类名，因此你可以添加以下\
