  \ 和 `FixedDocument` 进行 WPF 打印\n\n### 本章的 Wrox.com 下载\n\n请注意，本章的所有代码示例都可以作为本书代码下载的一部分，可以在书籍网站\
  \ [www.wrox.com/go/csharp5programmersref](http://www.wrox.com/go/csharp5programmersref)\
  \ 的 Download Code 标签页下载。\n\nWindows Forms 和 WPF 采用两种不同的打印方法。在 Windows Forms 中，程序启动打印过程，然后一个文档对象触发事件，询问程序应该在每个打印页面上绘制什么内容。WPF\
  \ 构建一个文档对象，该对象包含代表打印项的其他对象，如文本、图像和形状。\n\n本章的第一部分描述了 Windows Forms 中的打印。第二部分解释了如何在\
  \ WPF 应用中生成并打印文档。\n\n## Windows Forms 打印\n\n尽管 Windows Forms 应用程序有一些很好的打印工具，但对许多程序员来说，其基本过程似乎有些反传统。程序不是执行命令来告诉打印机对象打印什么，而是必须在文档对象询问应该打印什么时响应事件。\n\
  \n当你掌握了基本概念后，打印大部分情况下是学习如何绘制图形的问题。在 Windows Forms 应用程序中绘制图形，无论是在表单、`PictureBox`\
  \ 还是打印页面上绘制，实际上都是那样的。\n\n接下来的部分描述了基本过程。之后的章节解释了如何打印特定项，如文本、图像和形状。\n\n### 基础打印\n\n\
  Windows Forms 应用程序打印过程的核心是 `PrintDocument` 对象。正如其名称所示，它代表要打印的文档。\n\n你可能期望 `PrintDocument`\
  \ 类提供供你调用的在文档上绘制文本、图像和其他项的方法。过程实际上是反向的。程序创建一个 `PrintDocument` 对象，然后直接或间接地告诉该对象想要生成打印预览或实际打印件。随后\
  \ `PrintDocument` 触发事件，询问程序应该在每个页面上绘制什么。程序通过绘图命令来响应结果。\n\n当 `PrintDocument` 对象必须执行打印相关任务时，它会触发四个关键事件：\n\
  \n* `BeginPrint`: `PrintDocument` 在准备开始打印时触发 `BeginPrint` 事件。程序可以初始化数据结构、加载数据、连接数据库并进行其他打印准备。\n\
  * `QueryPageSettings`: 在打印页面之前，`PrintDocument` 对象触发此事件。程序可以捕获此事件并针对即将打印的页面进行特定的更改。例如，如果你正在打印小册，程序可以调整边距，为需要装钉的一侧留出额外空间。\n\
  * `PrintPage`: `PrintDocument` 对象触发 `PrintPage` 事件以生成页面。程序捕获此事件并使用 `Graphics` 参数生成输出。在完成页面打印后，程序应该将\
  \ `e.HasMorePages` 的值设为 `true` 或 `false`，告诉 `PrintDocument` 之后是否有更多页面需要打印。\n* `EndPrint`:\
  \ 打印完成后，`PrintDocument` 对象触发其 `EndPrint` 事件。程序可以捕获此事件以清理打印期间使用的任何资源。它可以释放数据结构，关闭数据文件和数据库连接，并执行任何其他必要的清理工作。\n\
  \n在创建 `PrintDocument` 并挂载你想要使用的事件处理程序后，你可以对其进行三项操作。首先，你可以调用对象的 `Print` 方法立即启动打印过程。`PrintDocument`\
  \ 对象根据需要触发其事件并将结果发送到当前选定的打印机。\n\n\n\n\n\n其次，你可以将 `PrintPreviewDialog` 控件的 `Document`\
  \ 属性设置为 `PrintDocument` 对象，然后调用对话框的 `ShowDialog` 方法。`PrintPreviewDialog` 会让 `PrintDocument`\
  \ 生成打印件，并在打印预览对话框中显示它，类似于图 16-1 所示所示。\n\n![c16f001.tif](img/c16f001.png)\n\n图 16-1:\
  \ `PrintPreviewDialog` 允许用户放大和缩小、查看打印件的不同页面，并将打印件发送到打印机。\n\n打印预览对话框左侧的打印按钮会将打印件发送到当前选定的打印机。放大镜按钮显示一个下拉列表，让你选择不同的比例。接下来的五个按钮允许用户同时显示打印件的一页、二、三、四或六页。关闭按钮关闭对话框，向上/向下箭头允许你在打印件的页面之间移动。\n\
  \n`PrintPreviewControl` 显示打印预览的方式与 `PrintPreviewDialog` 控件相似，但它位于你的表单上。它没有提供对话框的所有按钮，但它提供了让你实现类似功能的方法。例如，你的程序可以设置缩放级别和显示中的列数。\n\
  \n你可以对 `PrintDocument` 执行的第三件事是将其分配给 `PrintDialog` 对象的 `Document` 属性，然后调用对话框的 `ShowDialog`\
  \ 方法。这将显示一个对话框，让你选择打印机并设置其属性。例如，你可以设置打印机的横向或纵向。当你点击对话框的打印按钮时，对话框将使用 `PrintDocument`\
  \ 对象将打印件发送到打印机。\n\nPrintShapes 示例程序可以在本书的网站下载，它在 `PrintPreviewControl` 中显示预览，直接将打印件发送到打印机，并显示如图\
  \ 16-1 所示的打印预览对话框。在设计时，我在表单上添加了 `PrintPreviewControl`、`PrintDocument` 和 `PrintPreviewDialog`。我将预览控件和预览对话框的\
  \ `Document` 属性设置为 `PrintDocument` 对象。\n\n当程序启动时，`PrintPreviewControl` 会自动生成并显示其预览。\n\
  \n以下代码显示了程序如何将打印件发送到打印机。\n\n```c\n// 将打印件发送到当前选定的打印机。\nprivate void printButton_Click(object\
  \ sender, EventArgs e)\n{\n    samplePrintDocument.Print();\n}\n```\n\n以下代码显示了程序如何显示预览对话框。\n\
  \n```c\n// 显示打印预览。\nprivate void previewButton_Click(object sender, EventArgs e)\n\
  {\n    samplePrintPreviewDialog.ShowDialog();\n}\n```\n\n最后，以下代码显示了程序中最感兴趣的部分，其中\
  \ `PrintDocument` 生成了打印件。\n\n```c\n// 下一个要打印的页码。\nprivate int NextPage = 0;\n\n\
  // 从页码 0 开始。\nprivate void samplePrintDocument_BeginPrint(object sender,\n    System.Drawing.Printing.PrintEventArgs\
  \ e)\n{\n    NextPage = 0;\n}\n\n// 打印一页。\nprivate void samplePrintDocument_PrintPage(object\
  \ sender, \n    System.Drawing.Printing.PrintPageEventArgs e)\n{\n    e.Graphics.SmoothingMode\
  \ = SmoothingMode.AntiAlias;\n\n    // 绘制边距边界。\n    e.Graphics.DrawRectangle(Pens.Orange,\
  \ e.MarginBounds);\n\n    // 绘制一个形状。\n    int xmid = (e.MarginBounds.Left + e.MarginBounds.Right)\
  \ / 2;\n    int ymid = (e.MarginBounds.Top + e.MarginBounds.Bottom) / 2;\n    switch\
  \ (NextPage)\n    {\n        case 0:     // 三角形。\n            Point[] trianglePoints\
  \ =\n            {\n                new Point(xmid, e.MarginBounds.Top),\n     \
  \           new Point(e.MarginBounds.Right, e.MarginBounds.Bottom),\n          \
  \      new Point(e.MarginBounds.Left, e.MarginBounds.Bottom),\n            };\n\
  \            e.Graphics.DrawPolygon(Pens.Red, trianglePoints);\n            break;\n\
  \        case 1:     // 菱形。\n            Point[] diamondPoints =\n            {\n\
  \                new Point(xmid, e.MarginBounds.Top),\n                new Point(e.MarginBounds.Right,\
  \ ymid),\n                new Point(xmid, e.MarginBounds.Bottom),\n            \
  \    new Point(e.MarginBounds.Left, ymid),\n            };\n            e.Graphics.DrawPolygon(Pens.Green,\
  \ diamondPoints);\n            break;\n        case 2:     // 椭圆。\n            e.Graphics.DrawEllipse(Pens.Blue,\
  \ e.MarginBounds);\n            break;\n    }\n\n    // 第 2 页是最后一页。\n    e.HasMorePages\
  \ = (++NextPage <= 2);\n}\n```\n\n代码首先定义了 `NextPage` 变量，它用于跟踪正在打印哪一页。\n\n`BeginPrint`\
  \ 事件处理程序在 `PrintDocument` 开始生成打印件之前执行。在这个示例中，该事件处理程序将 `NextPage` 设置为 0。`PrintPage`\
  \ 事件处理程序处理每一页的实际绘制。\n\n### 绘制基础\n\n`Graphics` 对象表示绘制表面。你可以将其认为程序将绘制的画布或纸张。`Graphics`\
  \ 类提供了许多绘制线条、矩形、曲线和其他形状的方法。\n\n### Graphics 对象\n\n下表总结了这些方法。\n\n| **方法** | **描述**\
  \ |\n| :--- | :--- |\n| `DrawArc` | 绘制椭圆的弧。 |\n| `DrawBezier` | 绘制贝塞尔曲线。 |\n| `DrawBeziers`\
  \ | 绘制一系列贝塞尔曲线。 |\n| `DrawClosedCurve` | 绘制连接一系列点的平滑闭合曲线，将最后一个点连接到第一个点。 |\n| `DrawCurve`\
  \ | 绘制连接一系列点的平滑曲线，但不连接最后一个点到第一个点。 |\n| `DrawEllipse` | 绘制椭圆。（要画圆，请绘制宽高相等的椭圆。） |\n\
  | `DrawIcon` | 绘制图标。 |\n| `DrawIconUnstretched` | 不缩放地绘制图标。如果你知道不会调整图标大小，这比 `DrawIcon`\
  \ 快。 |\n| `DrawImage` | 绘制图像。`Bitmap` 是 `Image` 的子类，因此你可以使用此方法绘制 `Bitmap`。 |\n|\
  \ `DrawImageUnscaled` | 不缩放地绘制图像。如果你知道不会调整图像大小，这比 `DrawImage` 快。 |\n| `DrawLine`\
  \ | 绘制线条。 |\n| `DrawLines` | 绘制一系列连接的线条。这比重复使用 `DrawLine` 快得多。 |\n| `DrawPath` |\
  \ 绘制 `GraphicsPath` 对象。 |\n| `DrawPie` | 绘制从椭圆提取的饼形。 |\n| `DrawPolygon` | 绘制多边形。这与\
  \ `DrawLines` 相似，但它会将最后一个点连接到第一个点。 |\n| `DrawRectangle` | 绘制具有水平和垂直边的矩形。（也就是说，它不能绘制旋转的矩形。）\
  \ |\n\n\n\n\n\n| `DrawRectangles` | 绘制一系列矩形。这比反复使用 `DrawRectangle` 要快得多。 |\n| `DrawString`\
  \ | 绘制文本。 |\n\n上表列出的方法绘制线条、矩形或椭圆等对象的轮廓。`Graphics` 类提供了相应的方法来填充这些形状中的许多。例如，`DrawRectangle`\
  \ 方法绘制矩形的轮廓，而对应的 `FillRectangle` 方法则填充矩形。填充方法包括 `FillClosedCurve`、`FillEllipse`、`FillPath`、`FillPie`、`FillPolygon`、`FillRectangle`\
  \ 和 `FillRectangles`。\n\n`Draw` 方法接受画笔（pen）作为参数，并使用该画笔来确定如何绘制轮廓。相比之下，`Fill` 方法接受画刷（brush）作为参数，并使用该画刷来确定如何填充区域。\n\
  \n唯一的例外是 `DrawString` 方法，尽管它的名称以 `Draw` 开头，但它使用画刷来填充文本。\n\n本章稍后的“Pens（画笔）”和“Brushes（画刷）”节将更详细地描述画笔和画刷。\n\
  \n有关 `Graphics` 类绘制和填充方法的特定信息，请参阅联帮助。你可以在 `Graphics` 网页上找到描述这些方法的链接：[msdn.microsoft.com/library/system.drawing.graphics.](http://msdn.microsoft.com/library/system.drawing.graphics.)。\n\
  \n#### 获取 Graphics 对象\n\n程序有多种方法可以获取用于绘制的 `Graphics` 对象。你已经看到 `PrintDocument` 的\
  \ `PrintPage` 事件处理程序提供了一个 `e.Graphics` 参数。\n\n同样，`Form`、`PictureBox` 或控件也可以提供 `Paint`\
  \ 事件，该事件包含一个 `e.Graphics` 参数，程序可以在其上绘图。当控件需要重绘其部分或全部内容时，会触发 `Paint` 事件。\n\n请注意，`Paint`\
  \ 事件处理程序包含的 `Graphics` 对象可能会对其绘制方法进行裁剪，因此它只重绘控件实际上需要重绘的部分。这意味着在这些区域之外绘制的图形都会被忽略。你不需要执行任何特殊操作来让其工作。只需注意你的某些图形可能实际上并没有被绘制即可。\n\
  \n例如，如果你想重绘整个 `PictureBox` 并用随机圆覆盖它，你需要刷新整个 `PictureBox` 以确保你绘制的所有内容都出现。（可以通过调用其\
  \ `Refresh` 方法来刷新控件。）\n\n获取 `Graphics` 对象的最后常用方法是创建一个与 `Bitmap` 关联的对象。程序随后可以使用该\
  \ `Graphics` 对象在 `Bitmap` 上绘图。下面的代码演示了这种技术。\n\n```\nprivate void Form1_Load(object\
  \ sender, EventArgs e)\n{\n    // 创建一个 Bitmap。\n    Bitmap bitmap = new Bitmap(100,\
  \ 100);\n    using (Graphics graphics = Graphics.FromImage(bitmap))\n    {\n   \
  \     // 在上面绘制一个椭圆。\n        graphics.DrawEllipse(Pens.Brown, 0, 0, 99, 99);\n \
  \   }\n\n    // 在表单上显示它。\n    this.BackgroundImage = bitmap;\n}\n```\n\n此代码创建了一个\
  \ 100 × 100 像素的 `Bitmap`。（.NET 中所有图形的坐标都是像素。）然后它使用 `Graphics.FromImage` 方法创建一个与\
  \ `Bitmap` 关联的 `Graphics` 对象。`Graphics` 类提供了 `Dispose` 方法，因此程序包含一个 `using` 语句以确保在程序完成该对象时调用该方法。\n\
  \n接下来，代码使用 `Graphics` 对象的 `DrawEllipse` 方法在 `Bitmap` 上绘制一个棕色椭圆。代码通过将 `Bitmap` 显示在表单的\
  \ `BackgroundImage` 属性中结束执行。\n\n#### Pens（画笔）\n\n`Pen` 对象决定了线条的绘制方式。它决定了线条的颜色、厚度、虚线样式、连接样式和端点样式。\n\
  \n程序可以显式地创建 `Pen` 对象，但通常只需直接使用 `Pens` 类预定义的 280 多个标准画笔之一。例如，以下代码使用一条 1 像素宽的热粉色线条绘制了一个矩形。\n\
  \n```\ngr.DrawRectangle(Pens.HotPink, 10, 10, 50, 50)\n```\n\n下表总结了 `Pen` 类的构造函数。\n\
  \n| 构造函数 | 描述 |\n| :--- | :--- |\n| `Pen(brush)` | 使用指定的 `Brush` 创建一个厚度为 1 的画笔 |\n\
  | `Pen(color)` | 使用指定的颜色创建一个厚度为 1 的画笔 |\n| `Pen(brush, thickness)` | 使用 `Brush`\
  \ 创建一个具有指定厚度（`float`）的画笔 |\n| `Pen(color, thickness)` | 使用指定的颜色创建一个具有指定厚度（`float`）的画笔\
  \ |\n\n下表描述了 `Pen` 类一些最有用的属性和方法。\n\n| 属性或方法 | 目的 |\n| :--- | :--- |\n| `Brush` |\
  \ 决定用于填充线条的 `Brush`。 |\n| `Color` | 决定线条的颜色。 |\n| `CompoundArray` | 允许绘制纵向条纹的线条。\
  \ |\n| `CustomEndCap` | 决定线条的端点。 |\n| `CustomStartCap` | 决定线条的起点。 |\n| `DashCap`\
  \ | 决定在虚线末端绘制的边缘。可以是 `Flat`。 |\n| `DashOffset` | 决定距离虚线起始点的距离。 |\n| `DashPattern`\
  \ | 指定虚线模式的 `float` 数组。 |\n| `DashStyle` | 决定虚线样式。 |\n| `EndCap` | 决定线条末端使用的端点。\
  \ |\n| `LineJoin` | 决定线条之间是如何连接的。 |\n| `StartCap` | 决定线条起始处使用的端点。 |\n| `Width` |\
  \ 画笔的宽度。 |\n\n\n\n\n`Brush` 对象决定了当你使用 `Graphics` 方法（如 `FillClosedCurve`、`FillEllipse`\
  \ 和 `FillRectangle`）绘制形状时，形状是如何填充的。不同类型的 `Brush` 使用实色、阴影图案、颜色渐变和图像来填充区域。\n\n`Brush`\
  \ 类是一个抽象类，因此你无法创建 `Brush` 类本身的实例。相反，你必须创建派生类 `SolidBrush`、`TextureBrush`、`HatchBrush`、`LinearGradientBrush`\
  \ 和 `PathGradientBrush` 之一实例。下表简要描述了这些类。\n\n| 类 | 用途 |\n| :--- | :--- |\n| `SolidBrush`\
  \ | 用实色填充区域 |\n| `TextureBrush` | 用重复图像填充区域 |\n| `HatchBrush` | 用重复的阴影图案填充区域 |\n\
  | `LinearGradientBrush` | 使用两种或多种颜色的线性渐变填充区域 |\n| `PathGradientBrush` | 使用遵循路径的颜色渐变填充区域\
  \ |\n\n`BrushSamples` 示例程序可以在本书的网站下载，它使用以下代码演示了四种画刷。\n\n```\nprivate void Form1_Paint(object\
  \ sender, PaintEventArgs e)\n{\n    Rectangle rect = new Rectangle(10, 10, 120,\
  \ 120);\n    using (Brush solidBrush = new SolidBrush(Color.LightGray))\n    {\n\
  \        e.Graphics.FillRectangle(solidBrush, rect);\n    }\n\n    rect.Y += 130;\n\
  \    using (Brush gradientBrush = new LinearGradientBrush(\n        rect, Color.Black,\
  \ Color.White, 45.0f))\n    {\n        e.Graphics.FillRectangle(gradientBrush, rect);\n\
  \    }\n\n    rect = new Rectangle(140, 10, 120, 120);\n    using (Brush textureBrush\
  \ = new TextureBrush(Properties.Resources.Smiley))\n    {\n        e.Graphics.FillRectangle(textureBrush,\
  \ rect);\n    }\n\n    rect.Y += 130;\n    using (Brush hatchBrush = new HatchBrush(\n\
  \        HatchStyle.DiagonalBrick, Color.Black, Color.White))\n    {\n        e.Graphics.FillRectangle(hatchBrush,\
  \ rect);\n    }\n}\n```\n\n代码首先创建了一个浅灰色的实画刷并填充矩形。\n\n接下来，它将矩形向下移动 130 像素并创建一个线性渐变画刷。该画刷从黑色开始，平滑地过渡到白色来填充矩形。渐变的方向为\
  \ 45，因此颜色从左上角的黑色过渡到右下角的白色。创建画刷后，程序用它填充矩形。\n\n程序随后创建一个新的矩形。它制作了一个纹理画刷，通过画刷的构造函数传递存储在程序\
  \ `Properties.Resources.Smiley` 资源中的图像。（使用 Project ⇒ Properties 菜单，并选择 Resources\
  \ 页面添加图像资源。）当程序使用纹理画刷时，矩形将用重复的图像填充。\n\n最后，程序创建了一个 `HatchBrush`，它使用黑色前景和白色背景的对角线砖纹图案。最后用阴影画刷填充矩形结束。图\
  \ 16-3 显示了结果。\n\n![c16f003.tif](img/c16f003.png)\n\n**图 16-3:** `BrushSamples` 示例程序用四种不同的画刷填充了四个矩形。\n\
  \n你可以在 [msdn.microsoft.com/library/system.drawing.brush](http://msdn.microsoft.com/library/system.drawing.brush)\
  \ 更多关于画刷类的知识。\n\n### 绘制文本\n\n许多打印应用程序比任何内容都多绘制文本，因此 `DrawString` 方法特别重要。该方法有六重载版本。所有版本的前三个参数都是要绘制的字符串、用于绘制的字体以及确定文本外观的画刷。\n\
  \n不同版本允许你使用 X 和 Y `float` 坐标、`PointF`（包含 X 和 Y 坐标）或 `RectangleF`（包含顶、左、宽度和高度值，同样为\
  \ `float` 类型）来指定文本的位置。\n\n重载版本中的最终变化是，某些版本允许包含一个 `StringFormat` 对象来确定文本的布局方式。例如，`Alignment`\
  \ 和 `LineAlignment` 属性分别确定文本的水平和垂直对齐。\n\n`DrawText` 示例程序如图图 16-4 所示，可以在本书网站下载，它使用以下代码演示了\
  \ `DrawString` 的两个重载版本。\n\n![c16f004.tif](img/c16f004.png)\n\n**图 16-4:** `DrawText`\
  \ 示例程序在点处和矩形居中位置绘制文本。\n\n```\nprivate void Form1_Paint(object sender, PaintEventArgs\
  \ e)\n{\n    e.Graphics.SmoothingMode = SmoothingMode.AntiAlias;\n\n    // Make\
  \ a font.\n    using (Font font = new Font(\"Times New Roman\", 20))\n    {\n  \
  \      // Make a font. (Wait, the original text had duplicate comments here, keeping\
  \ logic)\n        // Actually, I will follow the provided text's logic.\n    }\n\
  }\n```\n\n\n\n代码首先将变量 `bm` 设置为名为 `GrandCanyon` 的图像资源。（使用 Project ⇒ Properties 菜单，并选择\
  \ Resources 页面来添加图像资源。）代码可以直接对图像进行操作。变量 `bm` 仅用于使代码更易读。\n\n接下来，程序定义了一个包含整个图像的源矩形。然后，它定义了一个目标矩形，其大小与图像相同，并在页边距内居中显示。\n\
  \n接着，代码使用 `DrawImage` 方法在目标矩形中绘制整个图像。最后通过将 `e.HasMorePages` 设置为 `false` 来结束。图 16-5\
  \ 显示程序的打印预览。\n\n![c16f005.tif](img/c16f005.png)\n\n图 16-5: PrintImage 示例程序在页边距范围内居中绘制绘制一张图像。\n\
  \n### 小册示例\n\n到目前为止，本章中的示例绘制的是简单的形状或文本样本。本节描述了一个更完整且可能很有用的示例，它可以打印一系列长段落，且每个段落可能使用不同的字体大小。\n\
  \nPrintBooklet 示例程序可以在本书的网站上下载，它将文本分成页面。它假设你将双面打印页面并将其装订成小册子。为了给装订钉留出额外空间，程序在每页钉钉一侧的边距处添加了装订位（gutter）。程序假设第一页位于小册的外部，因此在奇数页的左边距添加装订位，在偶数页的右边距添加装订位。最后，程序在相对于装订位的角显示页码。\n\
  \n除了演示了 `PrintDocument` 类事件的事件处理器外，该示例还展示了如何使用 `StringFormat` 对象来对齐文本并在单词边界换行、在目标矩形内折行文本，以及测量文本以查看目标矩形能容纳多少。\n\
  \n图 16-6 显示了 PrintBooklet 程序的打印预览对话框，以便你理解其目标。图片的大小不足以让你阅读文本。而且，文本（除标题外）本身就是乱码。它出现在那里只是让你看到文档的形状。\n\
  \n![c16f006.tif](img/c16f006.png)\n\n图 16-6: PrintBooklet 示例程序将文本跨页划分，在交替两侧放置装订位，并在装订位的相反侧绘制页码。\n\
  \n如果你仔细观察，可以发现装订位在奇偶页中是交替放置。你还可以看到页码位于没有装订位的一侧的顶角。\n\n程序使用以下 `ParagraphInfo` 结构来存储关于要打印文本的信息。\n\
  \n```csharp\n// 关于要打印段落的信息。\nprivate struct ParagraphInfo\n{\n    public int FontSize;\n\
  \    public string Text;\n    public ParagraphInfo(int fontSize, string text)\n\
  \    {\n        FontSize = fontSize;\n        Text = text;\n    }\n}\n```\n\n以下代码显示了程序如何准备要打印的文本。\n\
  \n```csharp\n// 段落。\nprivate List<ParagraphInfo> AllParagraphs, ParagraphsToPrint;\n\
  private int PagesPrinted;\n\n// 加载段落信息。\nprivate void Form1_Load(object sender,\
  \ EventArgs e)\n{\n    // 创建要打印的文本。\n    AllParagraphs = new List<ParagraphInfo>();\n\
  \    AllParagraphs.Add(new ParagraphInfo(45, \"Chapter 16: Printing\"));\n    AllParagraphs.Add(new\
  \ ParagraphInfo(16,\n        \"此示例使用了\\\"Lorem Ipsum\\\"文本。更多信息，\" +\n        \"\
  请参见 http://www.lipsum.com/\"));\n    ... 省略初始化其他 ParagraphInfo 结构的代码 ...\n}\n```\n\
  \n此代码声明了两个 `List<ParagraphInfo>` 对象。`AllParagraphs` 列表持有所有要打印的文本。`ParagraphsToPrint`\
  \ 列表持有程序打印过程中尚未打印的文本。\n\n`Form1_Load` 事件处理器创建 `AllParagraphs` 列表并用要打印的 `ParagraphInfo`\
  \ 结构填充它。\n\n在设计时，我像照常一样向程序表单添加了 `PrintDocument` 和 `PrintPreviewDialog`。当你点击程序的“打印预览”按钮时，程序调用对话框的\
  \ `ShowDialog` 方法来开始打印过程。当打印开始时，执行以下 `BeginPrint` 事件处理器。\n\n```csharp\n// 准备打印。\n\
  private void bookletPrintDocument_BeginPrint(object sender, PrintEventArgs e)\n\
  {\n    // 我们还没有打印任何页面。\n    PagesPrinted = 0;\n\n    // 复制要打印的文本副本。\n    ParagraphsToPrint\
  \ = AllParagraphs.ToList();\n}\n```\n\n此代码将 `PagesPrinted` 设置为 0，因为在这一轮打印中尚未打印任何页面。然后，它将\
  \ `AllParagraphs` 列表（持有所有数据）中的 `ParagraphInfo` 结构复制到 `ParagraphsToPrint` 列表（持有尚未打印的段落）。\n\
  \n在打印每一页之前，`PrintDocument` 对象会抛出其 `QueryPageSettings` 事件。程序使用以下代码捕获此事件并准备下一页。\n\n\
  ```csharp\n// 设置下一页的边距。\nprivate void bookletPrintDocument_QueryPageSettings(object\
  \ sender,\n    QuerySettingsEventArgs e)\n{\n    // 使用 1 英寸的装订位。（打印机单位是 1/10 英寸）。\n\
  \    const int gutter = 100;\n\n    // 检查下一页是第一页、奇数页还是偶数页。\n    if (PagesPrinted\
  \ == 0)\n    {\n        // 第一页。增加左边距。\n        e.PageSettings.Left += gutter;\n\
  \    }\n    else if ((PagesPrinted % 2) == 0)\n    {\n        // 奇数页。将边距右移。\n  \
  \      e.PageSettings.Left += gutter;\n        e.PageSettings.Right -= gutter;\n\
  \    }\n    else\n    {\n        // 偶数页。将边距左移。\n        e.PageSettings.Left -= gutter;\n\
  \        e.PageSettings.Right += gutter;\n    }\n}\n```\n\n此代码为新页定位装订位。如果是第一页，则页面的边距为默认值且不包含装订位。在这种情况下，代码增加左边距以添加装订位。\n\
  \n如果不是第一页，代码会判断是奇数页还是偶数页。如果是偶数页，则前一页是奇数页，因此装订位位于左。为了将装订位移动到页面右侧，代码将左边距增加 1 英寸并从右边距减少\
  \ 1 英寸。\n\n同样地，如果是偶数页，代码从左边距减少 1 英寸并在右边距增加 1 英寸。\n\n在 `QueryPageSettings` 事件完成后，`PrintDocument`\
  \ 对象抛出其 `PrintPage` 事件以生成下一页打印内容。程序的 `PrintPage` 事件处理器相当长，因此后续段落将分部分描述它。（下载示例可以一次性查看全部。）\n\
  \n以下代码显示了事件处理器是如何开始的。\n\n\n\n\n\n```csharp\nprivate void bookletPrintDocument_PrintPage(object\
  \ sender, PrintPageEventArgs e)\n{\n    // 增加页码。\n    PagesPrinted++;\n\n    //\
  \ 绘制页边距（用于调试）。\n    //e.Graphics.DrawRectangle(Pens.Red, e.MarginBounds);\n\n  \
  \  // 将页码右对齐打印\n    // 位于页装订线的上角，\n    // 在页边距之外。\n    int x;\n    using (StringFormat\
  \ sf = new StringFormat())\n    {\n        // 检查（这是奇数页还是偶数页）。\n        if ((PagesPrinted\
  \ % 2) == 0)\n        {\n            // 这是一个偶数页。\n            // 装订线在右侧，\n     \
  \       // 页码在左侧。\n            x = (e.MarginBounds.Left + e.PageBounds.Left) / 2;\n\
  \            sf.Alignment = StringAlignment.Near;\n        }\n        else\n   \
  \     {\n            // 这是一个奇数页。\n            // 装订线在左侧，\n            // 页码在右侧。\n\
  \            x = (e.MarginBounds.Right + e.PageBounds.Right) / 2;\n            sf.Alignment\
  \ = StringAlignment.Far;\n        }\n\n        // 打印页码。\n        using (Font font\
  \ = new Font(\"Times New Roman\", 20,\n            FontStyle.Regular, GraphicsUnit.Point))\n\
  \        {\n            e.Graphics.DrawString(PagesPrinted.ToString(),\n       \
  \         font, Brushes.Black, x,\n                (e.MarginBounds.Top + e.PageBounds.Top)\
  \ / 2,\n                sf);\n        }\n    }\n}\n```\n\n事件处理程序首先增加已打印页数的数量。接着它包含了一段被注释的代码，用于在页边距周围绘制一个矩形。绘制这个矩形通常会让打印例程的调试变得更容易，因为可以让你看到打印内容与页边距之间的关系。\n\
  \n接下来，代码准备打印页码。它首先创建一个 `StringFormat` 对象来对齐页码。它将对象的 `Alignment` 属性设置为：在左页边距内页码左对齐，在右页边距内页码右对齐。代码还计算了一个\
  \ X 坐标，将页码放置在边距与页面边界之间的中间位置。\n\n随后代码创建了用于页码的字体，并在计算出的 X 坐标以及页面顶部页边距与页面边界之间的中间位置处打印页码。根据对齐方式的不同，文本将安排在在该点的左侧或右侧。\n\
  \n以下代码显示了程序如何准备打印文本。\n\n```csharp\n // 绘制剩余文本并左对齐，\n        // 按单词换行，并且不绘制部分行。\n\
  \        sf.Alignment = StringAlignment.Near;\n        sf.FormatFlags = StringFormatFlags.LineLimit;\n\
  \        sf.Trimming = StringTrimming.Word;\n\n        // 绘制一些文本。\n        ParagraphInfo\
  \ paragraphInfo;\n        int ymin = e.MarginBounds.Top;\n        RectangleF layoutRect;\n\
  \        SizeF textSize;\n        int charsFitted, linesFilled;\n        while (ParagraphsToPrint.Count\
  \ > 0)\n        {\n            // 打印下一个段落。\n            paragraphInfo = ParagraphsToPrint[0];\n\
  \            ParagraphsToPrint.RemoveAt(0);\n\n            // 获取此段落的可用区域。\n    \
  \        layoutRect = new RectangleF(\n                e.MarginBounds.Left, ymin,\n\
  \                e.MarginBounds.Width,\n                e.MarginBounds.Bottom -\
  \ ymin);\n            // 解决 MeasureString 在高度 <= 0 时\n            // 认为字符可以容纳的 Bug。\n\
  \            if (layoutRect.Height < 1) layoutRect.Height = 1;\n\n            //\
  \ 查看文本会有多大以及\n            // 能容纳多少字符。\n            // 获取字体。\n            using (Font\
  \ font = new Font(\"Times New Roman\",\n                paragraphInfo.FontSize,\
  \ FontStyle.Regular, GraphicsUnit.Point))\n            {\n                textSize\
  \ = e.Graphics.MeasureString(\n                    paragraphInfo.Text, font,\n \
  \                   new SizeF(layoutRect.Width, layoutRect.Height),\n          \
  \          sf, out charsFitted, out linesFilled);\n```\n\n这段代码重置了 `StringFormat`\
  \ 对象的属性以左对齐方式绘制文本。将 `FormatFlags` 设置为 `LineLimit` 会使程序在整行文本无法放入格式化矩形时停止绘制。默认情况下，即使行的底部超出了矩形边界也会绘制该行。\n\
  \n将 `Trimming` 设置为 `Word` 会在一个完整单词无法放入某行时停止绘制。（其他设置允许你在最邻的字符处停止，并在有更多无法容纳的文本时在最后一个单词或字符后添加省略号。）\n\
  \n程序将 `ymin` 设置为页面的顶部 Y 坐标，然后进入循环，只要还有更多段落需要打印，循环就会运行。\n\n在循环内部，程序获取下一个要打印的段落，并将其从\
  \ `ParagraphsToPrint` 列表中移除。它随后创建一个布局矩形，包含剩余的可用打印空间。垂直方向上，该矩形从当前的 Y 坐标 `ymin` 开始，延伸到页面底部。水平方向上，矩形覆盖了页面的宽度。\n\
  \n接下来，代码为段落创建一个合适大小的字体。然后它调用了 `e.Graphics.MeasureString` 方法。程序使用的方法重载版本接受段落文本、字体、尺寸以及一个\
  \ `StringFormat` 对象作为输入。它通过输出参数返回指定大小内可以容纳的字符数和行数。程序使用这些信息来确定可用空间可以容纳多少文本。在确定格式化矩形内可以容纳多少后，程序使用以下代码进行打印。\n\
  \n```csharp\n                // 检查是否有字符可以容纳。\n                if (charsFitted >\
  \ 0)\n                {\n                    // 绘制文本。\n                    e.Graphics.DrawString(paragraphInfo.Text,\n\
  \                        font, Brushes.Black,\n                        layoutRect,\
  \ sf);\n\n                    // 调试：在文本周围绘制矩形。\n                    //e.Graphics.DrawRectangle(Pens.Green,\n\
  \                    //    layoutRect.Left,\n                    //    layoutRect.Top,\n\
  \                    //    textSize.Width,\n                    //    textSize.Height);\n\
  \n                    // 增加下一个文本\n                    // 开始的 Y 坐标。\n           \
  \         // 添加一些段落间距。\n                    ymin += (int)(textSize.Height +\n  \
  \                      e.Graphics.MeasureString(\"M\", font).Height / 2);\n    \
  \            }\n            } // 字体\n```\n\n如果任何字符可以容纳，程序将使用 `DrawString` 方法进行打印。被注释的代码允许你在文本周围绘制一个矩形，同样是为了调试目的。\n\
  \n随后，代码将 `ymin` 增加所打印文本的高度加上一个“M”字符高度的一半。\n\n此时，程序已经打印了可用空间内可以容纳的所有段落。当页面刚开始时，那通常是整个段落。只有在页面底部附近，可能只会打印部分段落。\n\
  \n以下代码显示了程序如何完成页面的打印。\n\n```csharp\n            // 检查（部分段落未容纳在页面上）。\n          \
  \  if (charsFitted < paragraphInfo.Text.Length)\n            {\n               \
  \ // 部分段落未容纳。\n                // 准备在下一页打印剩余部分。\n                paragraphInfo.Text\
  \ = paragraphInfo.Text.\n                    Substring(charsFitted);\n         \
  \       ParagraphsToPrint.Insert(0, paragraphInfo);\n\n                // 本页能容纳的内容到此为止。\n\
  \                break;\n            }\n        } // while\n    } // sf\n\n    //\
  \ 如果有更多段落，就有更多页面。\n    e.HasMorePages = (ParagraphsToPrint.Count > 0);\n}\n```\n\
  \n\n\n\n\n如果段落中的某些字符无法容纳，程序将重置 `ParagraphInfo` 结构的文本，使其保存所有未容纳的文本。然后，它会将 `ParagraphInfo`\
  \ 插入到 `ParagraphsToPrint` 列表的开头，以便在下一页上首先打印。随后，它将跳出 `while` 循环，停止在本页打印段落。\n\n如果段落的所有文本都能容纳，`while`\
  \ 循环将继续打印下一个段落。当 `while` 循环结束（是因为段落未完全容纳或所有段落已打印），当前页完成。如果 `ParagraphsToPrint` 列表中还有段落，代码会将\
  \ `e.HasMorePages` 设置为 `true`。\n\n当最后一页打印后，`PrintDocument` 对象会触发其 `EndPrint` 事件。下面的代码显示了\
  \ `EndPrint` 事件处理器。\n\n```\nprivate void bookletPrintDocument_EndPrint(object sender,\
  \ PrintEventArgs e)\n{\n    ParagraphsToPrint = null;\n}\n```\n\n在此程序中，`EndPrint`\
  \ 事件处理器简单地将 `ParagraphsToPrint` 列表设置为 `null`，以便垃圾回收器稍后回收其内存。在此程序中，该列表并不占用太大空间，因此释放它是一件小事。在分配了更复杂数据结构的程序中，在此事件处理器中进行清理更为重要。\n\
  \n## WPF 打印\n\nWPF 程序相比 Windows Forms 应用程序有一些巨大的优势。例如，WPF 控件是无限缩放的。这意味着无论你如何放大 WPF\
  \ 控件，结果都是平滑的且没有像素化的。\n\nWPF 的打印方法充分利用了这种无限缩放性。要创建打印输出，WPF 应用程序创建表示需要打印内容的对象的。程序可以根据需要缩放这些对象以适应打印输出，结果利用了打印机的性能。\n\
  \nWPF 应用程序有多种方法产生打印输出。以下章节描述了两种最有用的方法：使用分页器（paginator）和创建文档。\n\n### 使用分页器\n\n分页器是一个生成打印输出页的对象。要使用分页器创建打印输出，你需要从\
  \ `DocumentPaginator` 类派生新类，并重写其 `GetPage` 方法来创建文档页面。你还需要重写其他几个方法，让分页器知道它将产生多少页面。\n\
  \n可以在本书网站上下载的 WpfPrintShapes 示例程序使用分页器创建打印输出。图 16-7 显示了在 Microsoft Reader 中显示的程序三个页面。\n\
  \n![c16f007.tif](img/c16f007.png)\n\n图 16-7： WpfPrintShapes 示例程序打印了三页。\n\n当 WpfPrintShapes\
  \ 示例程序执行时，它会显示一个“打印”按钮。当你点击该按钮时，会执行以下代码。\n\n```\nprivate void printButton_Click(object\
  \ sender, RoutedEventArgs e)\n{\n    PrintDialog pd = new PrintDialog();\n    if\
  \ (pd.ShowDialog() == true)\n    {\n        // Print.\n        pd.PrintDocument(\n\
  \            new ShapesPaginator(\n                new Size(pd.PrintableAreaWidth,\
  \ pd.PrintableAreaHeight)),\n            \"Shapes\");\n    }\n}\n```\n\n此代码创建了一个\
  \ `PrintDialog` 对象并调用其 `ShowDialog` 方法来显示它。如果用户选择打印机并点击“打印”，`ShowDialog` 方法返回 `true`。在这种情况下，程序调用对话框的\
  \ `PrintDocument` 方法，传递一个新的新的 `ShapesPaginator` 对象和正在打印文档的描述。\n\n当程序创建 `ShapesPaginator`\
  \ 对象时，它向构造函数传递一个表示页面可打印区域的 `Size` 结构。\n\n`ShapesPaginator` 对象负责生成文档打印页的所有趣味工作。下面的代码显示了\
  \ `ShapesPaginator` 类，但稍后描述的 `GetPage` 方法。\n\n```go\npublic class ShapesPaginator\
  \ : DocumentPaginator\n{\n    // 打印区域。\n    private Size MyPageSize;\n\n    // 保存页面大小。\n\
  \    public ShapesPaginator(Size pageSize)\n    {\n        MyPageSize = pageSize;\n\
  \    }\n\n    // 创建并返回请求的页面。\n    public override DocumentPage GetPage(int pageNumber)\n\
  \    {\n        ...\n    }\n\n    // 如果正在进行分页且 PageCount 不是最终值，则返回 false。\n    //\
  \ 如果分页完成且 PageCount 是最终值，则返回 true。\n    // 在此示例中，没有需要进行的分页。\n    public override\
  \ bool IsPageCountValid\n    {\n        get { return true; }\n    }\n\n    // 到目前已分页的页数。\n\
  \    // 此示例恰好有 3 页。\n    public override int PageCount\n    {\n        get { return\
  \ 3; }\n    }\n\n    // 建议的页面大小。\n    public override Size PageSize\n    {\n   \
  \     get { return MyPageSize; }\n        set { MyPageSize = value; }\n    }\n\n\
  \    // 当前正在分页的元素。\n    public override IDocumentPaginatorSource Source\n    {\n\
  \        get { return null; }\n    }\n}\n```\n\n`ShapesPaginator` 类继承自 `DocumentPaginator`。该类开始声明一个私有变量\
  \ `MyPageSize` 来存储可用打印区域。类的构造函数接收 `Size` 参数并将其保存到 `MyPageSize` 中。\n\n为了产生打印输出，该类重写了以下四个属性：\n\
  \n*   `IsPageCountValid`——某些程序可能需要在最终 `PageCount` 值正确之前对打印输出的所有页面进行分页。在这种情况下，该属性在分页进行期间应返回\
  \ `false`，在 `PageCount` 设置为最终值后返回 `true`。\n*   `PageCount`——返回已格式化的页数。\n*   `PageSize`——获取或设置打印页建议的大小。\n\
  *   `Source`——返回正在分页的元素。\n\nWpfPrintShapes 示例只打印了三页，因此这些重写的属性相对简单。程序不需要格式化所有页面来确定有多少页，因此\
  \ `IsPageCountValid` 始终返回 `true`，`PageCount` 始终返回 3，`PageSize` 返回类构造函数保存的大小，而 `Source`\
  \ 返回 `null`。\n\n在 Windows Forms 应用程序中，`PrintDocument` 触发 `PrintPage` 事件来生成打印页面。同样，当\
  \ WPF 应用程序使用分页器时，它调用分页器的 `GetPage` 方法来获取表示打印面的对象。下面的代码显示了 `ShapesPaginator` 类使用的\
  \ `GetPage` 方法。\n\n\n\n\n```go\n// 创建并返回请求的页面。\npublic override DocumentPage GetPage(int\
  \ pageNumber)\n{\n    // 创建网格。\n    Grid grid = new Grid();\n    grid.Width = MyPageSize.Width;\n\
  \    grid.Height = MyPageSize.Height;\n    // 绘制绘制区域。\n    Rectangle rectangle =\
  \ new Rectangle();\n    rectangle.Width = MyPageSize.Width;\n    rectangle.Height\
  \ = MyPageSize.Height;\n    rectangle.Stroke = Brushes.Orange;\n    rectangle.StrokeThickness\
  \ = 10.0;\n    grid.Children.Add(rectangle);\n\n    // 显示页码。\n    TextBlock textBlock\
  \ = new TextBlock();\n    textBlock.Text = pageNumber.ToString();\n    textBlock.FontSize\
  \ = 300;\n    textBlock.HorizontalAlignment = HorizontalAlignment.Center;\n    textBlock.VerticalAlignment\
  \ = VerticalAlignment.Center;\n    grid.Children.Add(textBlock);\n\n    // 生成适当的页面。\
  \            \n    switch (pageNumber)\n    {\n        case 0:     // 三角形。\n   \
  \         Polygon triangle = new Polygon();\n            triangle.Stroke = Brushes.Red;\n\
  \            triangle.StrokeThickness = 10.0;\n\n            PointCollection triangle_pts\
  \ = new PointCollection();\n            triangle_pts.Add(new Point(MyPageSize.Width\
  \ / 2, 0));\n            triangle_pts.Add(new Point(MyPageSize.Width, MyPageSize.Height));\n\
  \            triangle_pts.Add(new Point(0, MyPageSize.Height));\n            triangle.Points\
  \ = triangle_pts;\n            grid.Children.Add(triangle);\n            break;\n\
  \n        case 1:     // 菱形。\n            Polygon diamond = new Polygon();\n   \
  \         diamond.Stroke = Brushes.Green;\n            diamond.StrokeThickness =\
  \ 10.0;\n\n            PointCollection diamond_pts = new PointCollection();\n  \
  \          diamond_pts.Add(new Point(MyPageSize.Width / 2, 0));\n            diamond_pts.Add(new\
  \ Point(MyPageSize.Width, MyPageSize.Height / 2));\n            diamond_pts.Add(new\
  \ Point(MyPageSize.Width / 2, MyPageSize.Height));\n            diamond_pts.Add(new\
  \ Point(0, MyPageSize.Height / 2));\n            diamond.Points = diamond_pts;\n\
  \            grid.Children.Add(diamond);\n            break;\n\n        case 2:\
  \     // 圆圆\n            Ellipse ellipse = new Ellipse();\n            ellipse.Stroke\
  \ = Brushes.Blue;\n            ellipse.StrokeThickness = 10.0;\n            ellipse.Width\
  \ = MyPageSize.Width;\n            ellipse.Height = MyPageSize.Height;\n       \
  \     grid.Children.Add(ellipse);\n            break;\n    }\n\n    // 让网格对其及其控件进行布局。\n\
  \    Rect rect = new Rect(new Point(0, 0), MyPageSize);\n    grid.Arrange(rect);\n\
  \n    // 将网格封装在 DocumentPage 中并返回。\n    return new DocumentPage(grid);\n}\n```\n\
  \n代码首先创建一个 `Grid` 控件并使其适应可用的打印区域。\n\n接下来，程序创建了一个 `Rectangle` 并让其适应可用区域。它设置 `Rectangle`\
  \ 的 `Stroke` 属性以绘制一个宽度为 10 像素的橙色轮廓，并将 `Rectangle` 添加到 `Grid` 的子元素中。\n\n代码随后创建了一个\
  \ `TextBlock` 来显示页码。它设置了对象的文本、字体大小和对齐方式。然后将 `TextBlock` 添加到 `Grid` 的子元素中。\n\n到这里，你可能已经看出这种模式了。代码创建一个新对象来表示某些输出，设置其属性，并将该对象添加到\
  \ `Grid` 的子元素中。\n\n现在，根据页码，代码会创建一个代表三角形的多边形、代表菱形的多边形或一个椭圆。\n\n在创建了内容控件后，该方法调用 `Grid`\
  \ 的 `Arrange` 方法使其控件进行布局。最后通过返回一个新的 `DocumentPage` 对象完成操作。它向 `DocumentPage` 构造函数传递了它应该包含的根视觉对象（在本例中为\
  \ `Grid`）。\n\n### 创建文档\n\n通过前一节描述的分页器对象，至少在理论上，你可以产生任何你喜欢的文档。在实践中，为复杂的多页打印输出创建布局（其中段落要在图片、表格和图表周围流式）将是一项巨大的工作。`FlowDocument`\
  \ 和 `FixedDocument` 类使得这种复杂的布局任务变得简单得多。\n\n#### FlowDocuments\n\n`FlowDocument`\
  \ 对象持有其他表示图形输出的对象，例如文本、图像和形状。它排列其对象，以充分利用任何可用空间，就像网络浏览器在调整大小时时重新排列其内容一样。\n\n这里没有空间完全涵盖\
  \ XAML 以及 `FlowDocument` 中可以包含的所有对象，但图 16-8 中显示的并可在本书网站下载的 WpfFlowDocument 程序可以作为一个小型的示例。\n\
  \n![c16f008.tif](img/c16f008.png)\n\n图 16-8：** `FlowDocument` 重新排列其内容的方式就像网络浏览器在调整大大时一样。\n\
  \n以下代码显示了 WpfFlowDocument 使用的 XAML。\n\n```xml\n<Window x:Class=\"WpfFlowDocument.MainWindow\"\
  \n        xmlns=\"http://schemas.microsoft.com/winfx/2006/xaml/presentation\"\n\
  \        xmlns:x=\"http://schemas.microsoft.com/winfx/2006/xaml\"\n        Title=\"\
  WpfFlowDocument\" Height=\"350\" Width=\"525\">\n    <Grid>\n        <Grid.RowDefinitions>\n\
  \            <RowDefinition Height=\"30\"/>\n            <RowDefinition Height=\"\
  *\"/>\n        </Grid.RowDefinitions>\n        <Button Grid.Row=\"0\" Content=\"\
  Print\" Click=\"printButton_Click\"\n            Width=\"100\" Height=\"30\"/>\n\
  \        <FlowDocumentReader Grid.Row=\"1\" VerticalAlignment=\"Top\">\n       \
  \     <FlowDocument Name=\"sampleFlowDocument\">\n                <Paragraph FontSize=\"\
  20\" FontWeight=\"Bold\">\n                    Chapter 1: Lorem Ipsum\n        \
  \        </Paragraph>\n\n                <Paragraph FontSize=\"16\" FontWeight=\"\
  Bold\">\n                    Dolor Sit Amet\n                </Paragraph>\n\n  \
  \              <Paragraph>\n                    <Floater HorizontalAlignment=\"\
  Right\">\n                        <Paragraph>\n                            <Grid\
  \ Width=\"100\" Height=\"100\">\n                                <Border BorderBrush=\"\
  Black\" BorderThickness=\"1\"/>\n                                <Polygon Points=\"\
  50,5 95,50 50,95 5,50\"\n                                    Stroke=\"Black\" StrokeThickness=\"\
  5\" />\n                            </Grid>\n                        </Paragraph>\n\
  \                    </Floater>\n                    Consectetur adipiscing elit\
  \ ...\n                </Paragraph>\n\n                <Paragraph>\n           \
  \         Nullam dapibus dapibus ...\n                </Paragraph>\n\n         \
  \       <Paragraph>\n                    Etiam lacus eros ...\n                </Paragraph>\n\
  \n            </FlowDocument>\n        </FlowDocumentReader>\n    </Grid>\n</Window>\n\
  ```\n\n\n\n\n\n3. 将 `FlowDocument` 强制转换为 `IDocumentPaginatorSource`。\n\n4. 使用 `XpsDocumentWriter`\
  \ 的 `Write` 方法写入打印队列。向该方法传递一个通过调用 `FlowDocument` 的 `DocumentPaginator` 属性获取的分页器。\n\
  \n以下代码显示了 WpfFlowDocument 示例如何进行打印。\n\n```\nprivate void printButton_Click(object\
  \ sender, RoutedEventArgs e)\n{\n    PrintDialog pd = new PrintDialog();\n    if\
  \ (pd.ShowDialog() == true)\n    {\n        // 为打印队列创建一个 XPS 文档写入器。\n        XpsDocumentWriter\
  \ xpsWriter =\n            PrintQueue.CreateXpsDocumentWriter(pd.PrintQueue);\n\n\
  \        // 将 FlowDocument 转换为 IDocumentPaginatorSource。\n        IDocumentPaginatorSource\
  \ paginatorSource =\n            (IDocumentPaginatorSource)sampleFlowDocument;\n\
  \n        // 使用文档分页器写入写入器。\n        xpsWriter.Write(paginatorSource.DocumentPaginator);\n\
  \    }\n}\n```\n\n### FixedDocuments（固定文档）\n\n与 `FlowDocument` 类似，`FixedDocument`\
  \ 也包含图形对象。`FixedDocument` 不会根据空间情况重新排列对象，而是始终将其对象放置在相同的位置。这与 PostScript 文档在固定位置显示项目的方式相似。\n\
  \nWpfFixedDocument 示例程序如 图 16-9 所示，并可以在本书的网站上下载，它显示并打印了一个 `FixedDocument`。\n\n![c16f009.tif](img/c16f009.png)\n\
  \n图 16-9： `FixedDocument` 将其内容放置在固定页面上的设定位置上。\n\n打印 `FixedDocument` 的代码与上一节中打印 `FlowDocument`\
  \ 的代码相似。\n\n要在 XAML 代码中显示 `FixedDocument`，请包含一个 `DocumentViewer` 来容载 `FixedDocument`。为\
  \ `FixedDocument` 提供一个或多个 `PageContent` 元素来表示打印的页面。其中每个元素都应该包含一个 `FixedPage` 元素，以为分页器生成内容。\n\
  \n以下代码显示了 WpfFixedDocument 示例程序用于显示其内容的 XAML 代码。\n\n```xml\n<DocumentViewer Grid.Row=\"\
  1\">\n    <FixedDocument Name=\"sampleFixedDocument\">\n        <PageContent Width=\"\
  850\" Height=\"1100\">\n            <FixedPage Width=\"850\" Height=\"1100\" Margin=\"\
  100\">\n                ... Page 1 content elements ...\n            </FixedPage>\n\
  \        </PageContent>\n        <PageContent Width=\"850\" Height=\"1100\">\n \
  \           <FixedPage Width=\"850\" Height=\"1100\" Margin=\"100\">\n         \
  \       ... Page 1 content elements ...\n            </FixedPage>\n        </PageContent>\n\
  \    </FixedDocument>\n</DocumentViewer>\n```\n\n关于程序如何生成内容的细节非常冗长且无趣，因此没有包含在这里。它们只是使用长序列的\
  \ `StackPanel`、`TextBlock`、`Grid` 和其他控件来创建输出。下载示例并查看代码以了解其工作原理。\n\n## 总结\n\nWindows\
  \ Forms 和 WPF 采取不同的不同的打印方法。在 Windows Forms 应用程序中，`PrintDocument` 对象代表打印输出。它引发如 `BeginPrint`\
  \ 和 `PrintPage` 等事件，让程序确定打印内容。在 `PrintPage` 事件处理器中，你使用 `Graphics`、`Pen` 和 `Brush`\
  \ 对象产生输出。\n\nWPF 应用程序更直接地使用对象表示要打印的项目。当你使用分页器时，你从 `DocumentPaginator` 派生一个类，并重写类的\
  \ `GetPage` 方法来产生输出。该输出以 `DocumentPage` 对象的形式存在，包含其他如 `TextBlock`、`Rectangle` 和\
  \ `Polygon` 等生成打印结果的对象。\n\n如果你喜欢使用 `FlowDocument` 或 `FixedDocument` 来产生输出，你同样使用\
  \ `TextBlock`、`Rectangle` 和 `Polygon` 对象来生成打印结果。如果你将 `FlowDocument` 或 `FixedDocument`\
  \ 放在 `FlowDocumentReader` 或 `DocumentViewer` 中，你甚至可以将它们作为输出打印内容的预览。\n\n在本章之前描述的程序只与用户交互。打印是程序与系统其他部分交互的一种方式。下一章将描述\
  \ C# 程序通过存储配置和资源值以供以后使用的其他交互方式。这些技术允许程序在运行之间存储和恢复信息。\n\n## 练习\n\n为了节省纸张，你可能希望让所有打印程序显示打印预览而不是直接打印。\n\
  \n1. 编写一个 Windows Forms 程序，使用 20 像素宽的蓝线在三个页面的中心绘制五角、七角和九角星，如 图 16-10 所示。\n\n   ![c16f010.tif](img/c16f010.png)\n\
  \n   图 16-10： 对于练习 1，编写一个打印五角、七角和九角星的程序。\n\n   等等，文字说是“对于练习 1，编写一个打印五角、七角和九角星的程序。”这里是代码逻辑：\n\
  \n```csharp\n   private List<PointF> StarPoints(float centerX, float centerY, float\
  \ radius, int numPoints)\n   {\n       // 计算点之间的角度差。\n       double dtheta = (2\
  \ * Math.PI / numPoints) * (int)(numPoints / 2);\n\n       // 生成点。\n       List<PointF>\
  \ points = new List<PointF>();\n       double theta = -Math.PI / 2;\n       for\
  \ (int i = 0; i < numPoints; i++)\n       {\n           double x = centerX + radius\
  \ * Math.Cos(theta);\n           double y = centerY + radius * Math.Sin(theta);\n\
  \           points.Add(new PointF((float)x, (float)y));\n           theta += dtheta;\n\
  \       }\n\n       return points;\n   }\n   ```\n\n2. 编写一个 Windows Forms 程序，在边距内尽可能放大绘制你的名字。（提示：使用\
  \ `Graphics` 对象的 `MeasureString` 方法查看特定字体下字符串有多大。尝试不同大小字体直到找到合适的。）\n\n3. 编写一个 Windows\
  \ Forms 程序，生成质数并以 12 点字体每行打印一个，直到到达页面底部。绘制边距边界以验证你的文本没有超出边界。（提示：使用 M 的高度的 1.2 倍作为行间距。生成质数时，使用你在第\
  \ 14 章“集合类”练习 8 中构建的 `AllPrimes` 迭代器。）\n\n4. 使用分页器的 WPF 程序重复练习 1。\n\n5. 使用 `FixedDocument`\
  \ 的 WPF 程序重复练习 1。提示：你不需要在 XAML 代码中设计时创建星形。当窗口加载时，使用代码将包含星形的页面添加到 `FixedDocument`\
  \ 中。（本书没有解释如何在代码中构建 WPF 界面，但你应该能够通过一些实验发现。如果你卡住了，请查看附录 A“练习答案”，并下载那里描述的程序。）\n\n\n\
  \n\n\n例如，应用程序可能会为不同类型的用户显示不同的数据。数据录入员、主管、经理和账单专家将看到同一个数据库的不同视图。同样地，你可能会为不同的支持级别配置应用程序。你可能为试用版、基础版、专业版和企业版准备不同的配置。\n\
  \n应用程序可能还需要在会话之间保存状态信息。它可能会记住上次运行的表单类型、它们的位置及其内容。当程序下次运行时，它可以恢复这些表单，以便用户能够尽可能快地回到工作中。\n\
  \n.NET Framework 提供了许多用于存储和使用应用程序配置及资源信息的工具。本章描述了这些工具中一些最实用的。它解释了应用程序如何使用环境变量变量、注册表、配置文件、资源文件以及\
  \ `Application` 对象来保存和恢复配置信息。\n\n## 环境变量\n\n环境变量提供了有关程序运行的操作系统环境的信息。它们存储了诸如计算机名称、用户登录名、系统临时目录的位置、系统拥有的处理器数量以及程序当前的工作目录等信息。你也可以将配置信息存储在环境变量中供你的程序使用。\n\
  \n环境变量有三种类型，分别适用于系统、用户和进程级别。系统级变量适用于系统上启动的所有进程；用户级变量适用于特定用户启动的进程；进程级变量适用于特定进程以及它启动的任何其他进程。\n\
  \n环境变量在进程启动时加载，并由初始进程启动的任何进程继承。程序开发期间，变量在你启动 Visual Studio 时被加载。当你启动正在编写的程序时，这些值会被该程序继承。如果你更改了系统的环境变量，则需要关闭并重新打开\
  \ Visual Studio，你的程序才能看到这些更改。\n\n程序还可以创建临时的进程级变量，这些变量会被你启动的任何进程继承。这些值在原始进程结束时就会消失。\n\
  \nC# 程序可以使用 `System.Environment` 类来读取和写入环境变量。然而，在学习如何使用该类之前，你应该先学习操作系统是如何设置环境变量值的。\n\
  \n### 设置环境变量\n\n环境变量通常在程序开始之前在系统范围内进行设置。在旧的操作系统中，如 `autoexec.bat` 等批处理文件设置这些值。较新的系统提供了控制面板工具来设置环境变量。\n\
  \n较新的系统还使用 `autoexec.nt` 文件来设置仅适用于命令行（控制台）应用程序的环境变量，因此它们不会影响 GUI 应用程序。有时，你可以利用这一点，为不同类型的应用程序提供不同的环境变量设置。\n\
  \n要在较新版本的 Windows 中设置环境变量，打开控制面板并搜索关键字 `environment`。在 Windows 8 中，打开搜索工具，并在“设置”类别中搜索\
  \ `environment`。此搜索应该产生两个匹配项。\n\n如果你点击“编辑系统环境变量”选项，你应该能看到系统属性工具的“高级”选项卡。现在点击“环境变量”按钮查看对话框，如图\
  \ 17-1 所示。\n\n![c17f001.tif](img/c17f001.png)\n\n图 17-1: 你可以使用系统工具设置环境变量。\n\n如果你点击“编辑账户环境变量”选项，你应该看到一个与图\
  \ 17-1 所示相似的对话框，但修改系统环境变量的底部控件被禁用了。\n\n当某个值适用于所有用户启动的所有进程时，请使用系统变量。当某个值适用于特定用户启动的所有进程时，请使用用户级变量。\n\
  \n### 使用 System.Environment\n\n`System.Environment` 类提供了获取和设置进程级环境变量的方法。它还提供了用于处理应用程序环境中许多其他项的属性和方法。下表描述了\
  \ `Environment` 对象最实用的属性。\n\n| 属性 | 目的 |\n| :--- | :--- |\n| `CommandLine` | 返回进程的命令行。\
  \ |\n| `CurrentDirectory` | 获取或设置当前目录的完全路径。 |\n| `ExitCode` | 获取或设置进程的退出代码。 |\n\
  | `HasShutdownStarted` | 如果通用语言运行时（CLR）正在关闭，则返回 `true`。 |\n| `Is64BitOperatingSystem`\
  \ | 如果是 64 位操作系统，则返回 `true`。 |\n| `Is64BitProcess` | 如果当前进程是 64 位进程，则返回 `true`。\
  \ |\n| `MachineName` | 返回计算机的 NetBIOS 名称。 |\n| `NewLine` | 返回环境定义的换行字符串。例如，可能是回车符后跟一个换行符。\
  \ |\n| `OSVersion` | 返回一个包含操作系统信息的 `OperatingSystem` 对象。该对象提供了属性 `ServicePack`（最近安装的服务包名称）、`Version`（包括\
  \ `Major`、`Minor`、`Build` 和 `Revision`；`ToString` 将它们全部合并）、`VersionString`（合并操作系统名称、版本和最近的服务包）以及\
  \ `Platform`，其可以是 UNIX、Win32NT（Windows NT 或更高版本）、Win32S（运行在 16 位 Windows 上以提供对 32\
  \ 位应用程序的支持）、Win32Windows（Windows 95 或更高版本）或 WinCE。 |\n| `ProcessorCount` | 返回计算机上的处理器数量。\
  \ |\n| `StackTrace` | 返回描述堆栈的字符串。 |\n| `SystemDirectory` | 返回系统目录的完全路径。 |\n| `TickCount`\
  \ | 返回系统启动经过的毫秒数。 |\n| `UserDomainName` | 返回当前用户的网络域。 |\n| `UserInteractive` | 如果进程是交互式的，则返回\
  \ `true`。如果应用程序是服务进程，则只返回 `false`。 |\n| `UserName` | 返回启动进程的用户名。 |\n| `Version`\
  \ | 返回一个描述通用语言运行时的 `Version` 对象。该对象提供了 `Major`、`Minor`、`Build` 和 `Revision`。其 `ToString`\
  \ 方法将它们全部合并。 |\n| `WorkingSet` | 返回映射到此进程的物理内存量（字节）。 |\n\n下表描述了 `System.Environment`\
  \ 对象最实用的方法。\n\n| 方法 | 目的 |\n| :--- | :--- |\n| `Exit` | 立即结束进程。`FormClosing` 和 `FormClosed`\
  \ 事件程序不会执行。 |\n| `ExpandEnvironmentVariables` | 将字符串中的环境变量名称替换为其值。例如，以下代码显示用户名和计算机名：`MessageBox.Show(Environment.ExpandEnvironmentVariables(\"\
  I am %username% on %computername%.\"))` |\n| `GetCommandLineArgs` | 返回包含应用程序参数的字符串数组。第一个项（索引\
  \ 0）是程序执行文件的名称。 |\n| `GetEnvironmentVariable` | 返回环境变量的值。 |\n| `GetEnvironmentVariables`\
  \ | 返回包含所有环境变量名称和值的 `IDictionary` 对象。可选参数允许你确定是否要列出机器、用户或进程定义的变量。 |\n\n\n\n\n\n\
  | `GetFolderPath` | 返回系统文件夹的路径。该方法的参数是一个 `SpecialFolder` 枚举值，例如 `Cookies`、`Desktop`、`SendTo`\
  \ 或 `Recent`。请参阅在线帮助获取可用文件夹的完整列表。 |\n| `GetLogicalDrives` | 返回一个包含当前计算机上逻辑驱动器名称的字符串数组。\
  \ |\n| `SetEnvironmentVariable` | 创建、修改或删除环境变量。 |\n\n`SetEnvironmentVariable` 方法允许您在系统、用户和进程级别上设置环境变量。如果您将一个变量的值设置为\
  \ `null`，则该方法将删除该变量。对于系统和用户值，它将相应更新注册表以设置这些值。有关关于 `SetEnvironmentVariable` 方法的更多信息，请参阅\
  \ [msdn.microsoft.com/library/96xafkes.aspx](http://msdn.microsoft.com/library/96xafkes.aspx)。\
  \ |\n\n## 注册表\n\n系统注册表是一个层次结构数据库，存储了系统中应用程序的值。该层次结构的根命名为 `Computer`，并被分为若干称为 `hives`（单元）的子树。哪些单元可用取决于您的操作系统。下表总结了最常用的单元。（每个名称中的“HKEY”部分代表“hive\
  \ key”）。 |\n\n| 注册表分支 | 包含 |\n| :--- | :--- |\n| HKEY_CLASSES_ROOT | 与这些类型相关的文档类型和属性定义。\
  \ |\n| HKEY_CURRENT_CONFIG | 关于系统当前硬件配置的信息。 |\n| HKEY_CURRENT_USER | 当前用户的偏好（例如环境变量设置、程序组信息、桌面设置、颜色、打印机、网络连接以及特定应用程序的偏好）。每个用户都有一个独立的\
  \ `HKEY_CURRENT_USER` 单元。 |\n| HKEY_DYN_DATA | Windows 95、98 和 Me 的性能数据。（是的，这有点过时了，但此单元仍然存在。）\
  \ |\n| HKEY_LOCAL_MACHINE | 关于计算机物理状态的信息，包括总线类型、系统内存、已安装的硬件和软件以及网络登录和安全信息。 |\n|\
  \ HKEY_USERS | 新用户的默认配置信息以及当前用户的配置。 |\n\n取决于您的操作系统，注册表可能还包含不支持的键 `HKEY_PERFORMANCE_DATA`、`HKEY_PERFORMANCE_NLSTEXT`\
  \ 和 `HKEY_PER_TEXT`。\n\n许多应用程序在注册表中存储信息。`HKEY_CURRENT_USER` 子树对于存储单个用户的偏好和其他配置信息特别有用。\n\
  \n最近，使用注册表保存配置信息的方法已经过时了。微软现在建议您将此类数据本地存储在用户的数据存储区域中。这样做是有意义的，因为它更容易复制设置（它们只是文件），有助于减少注册表中的杂项，并降低因错误损坏注册表的概率。（如果注册表损坏得严重，系统可能无法启动。）您不必使用注册表，可以将此信息存储在配置文件中（参阅本章节后后的“配置文件”部分）或\
  \ XML 文件中（参阅 第 24 章，“XML”）。 |\n\n操作注册表的键是 `Microsoft.Win32` 命名空间中的 `Registry` 和\
  \ `RegistryKey` 类。 |\n\n`Registry` 类提供了静态字段，返回表示注册表单元的 `RegistryKey` 对象。以下列表描述了\
  \ `Registry` 类的单元字段。 |\n\n| 字段 | HKEY 等效值 |\n| :--- | :--- |\n| `ClassesRoot` |\
  \ HKEY_CLASSES_ROOT |\n| `CurrentConfig` | HKEY_CURRENT_CONFIG |\n| `CurrentUser`\
  \ | HKEY_CURRENT_USER |\n| `DynData` | HKEY_DYN_DATA |\n| `LocalMachine` | HKEY_LOCAL_MACHINE\
  \ |\n| `PerformanceData` | HKEY_PERFORMANCE_DATA |\n| `Users` | HKEY_USERS |\n\n\
  每个注册表键都可以包含值、子键、两者兼具或两者都不包含。`RegistryKey` 类提供了可以使用操作键的值和子键的属性和方法。下表总结了最有用的 `RegistryKey`\
  \ 属性和方法。 |\n\n| 属性或方法 | 目的 |\n| :--- | :--- |\n| `Close` | 关闭键，如果已修改，则将其数据刷新到磁盘\
  \ |\n| `CreateSubKey` | 创建新的子键或打开现有的子键进行写入 |\n| `DeleteSubKey` | 删除子键 |\n| `DeleteSubKeyTree`\
  \ | 删除子键及其子树 |\n| `DeleteValue` | 删除键中的值 |\n| `Dispose` | 释放对象的资源 |\n| `Flush` |\
  \ 将键的数据写入磁盘 |\n| `GetAccessControl` | 返回键的访问控制安全信息 |\n| `GetSubKeyNames` | 返回一个包含键子键名称的数组\
  \ |\n| `GetValue` | 返回一个值 |\n| `GetValueKind` | 返回 `RegistryValueKind` 枚举，指示值的类型，如二进制、多重字符串或字符串\
  \ |\n| `GetValueNames` | 返回一个包含键的值名称的数组 |\n| `OpenSubKey` | 打开子键 |\n| `Name` | 返回键的名称\
  \ |\n| `SetAccessControl` | 更改键的访问控制安全设置 |\n| `SetValue` | 为键设置值 |\n| `SubKeyCount`\
  \ | 返回键的子键数量 |\n| `ValueCount` | 返回键的值数量 |\n\n每个注册表键都可以包含值、子键、两者兼具或两者都不包含。`RegistryKey`\
  \ 类提供了可以使用操作键的值和子键的属性和方法。 |\n\n\n\n\n\n```sharp\n// Get a registry value.\nprivate\
  \ T GetValue<T>(string name, T defaultValue)\n{\n    return RegistryTools.GetRegistryValue(Registry.CurrentUser,\n\
  \        @\"Software\\C# Projects\\SaveRegistrySettings\\Settings\",\n        name,\
  \ defaultValue);\n}\n\n// Save a registry value.\nprivate void SetValue<T>(string\
  \ name, T value)\n{\n    RegistryTools.SetRegistryValue(Registry.CurrentUser,\n\
  \        @\"Software\\C# Projects\\SaveRegistrySettings\\Settings\",\n        name,\
  \ value);\n}\n```\n\n这些方法简单地调用了 `RegistryTools` 类定义的方法，并向它们传递正确的配置键和子键路径。\n\n程序提供了两个按钮，允许您设置表单的前景色和背景颜色。当程序启动和停止时，它会获取并设置保存的颜色以及表单的大小和位置。下面的代码显示了程序在表单即将关闭时如何保存这些值。\n\
  \n```sharp\n// Save the current settings.\nprivate void Form1_FormClosing(object\
  \ sender,\n    System.Windows.Forms.FormClosingEventArgs e)\n{\n    SetValue(\"\
  Width\", this.Width);\n    SetValue(\"Height\", this.Height);\n    SetValue(\"Left\"\
  , this.Left);\n    SetValue(\"Top\", this.Top);\n    SetValue(\"BackColor\", this.BackColor.ToArgb());\n\
  \    SetValue(\"ForeColor\", this.ForeColor.ToArgb());\n}\n```\n\n下面的代码显示了程序在下次启动时如何恢复这些值。\n\
  \n```sharp\n// Restore saved settings.\nprivate void Form1_Load(object sender, EventArgs\
  \ e)\n{\n    // Allow the form to position itself.\n    this.StartPosition = FormStartPosition.Manual;\n\
  \n    this.Width = GetValue(\"Width\", this.Width);\n    this.Height = GetValue(\"\
  Height\", this.Height);\n    this.Left = GetValue(\"Left\", this.Left);\n    this.Top\
  \ = GetValue(\"Top\", this.Top);\n    this.BackColor = Color.FromArgb(\n       \
  \ GetValue(\"BackColor\", this.BackColor.ToArgb()));\n    this.ForeColor = Color.FromArgb(\n\
  \        GetValue(\"ForeColor\", this.ForeColor.ToArgb()));\n}\n```\n\n## 配置文件\n\
  \n配置文件存储了程序运行时使用的信息。你可以更改配置文件中的值并重启程序，使其使用新值。这让你可以在不需要重新编译可执行程序的情况下，修改应用程序的行为。\n\
  \n使用配置文件最简单的方法是通过动态属性。你的程序会在运行时自动从配置文件加载动态属性。\n\n要定义需要绑定到动态属性的设置，请使用 `Project ⇒\
  \ Properties`，并点击 `Settings` 选项卡查看如图 17-2 所示的属性页。使用此页面定义运行时加载的配置设置。\n\n如果你为设置指定了\
  \ `Application` 作用范围，则它的值将由所有用户共享。`User` 作用范围的设置为每个用户单独存储，因此不同的用户可以使用并修改他们自己的值。\n\
  \n定义设置后，向表单添加一个控件并选中它。在“属性”窗口中，展开顶部的 `ApplicationSettings` 条目，点击 `PropertyBinding`\
  \ 子项，并点击右侧的省略号显示控件属性列表。\n\n![c17f002.tif](img/c17f002.png)\n\n图 17-2： 使用设置页定义存储在配置文件中的值。\n\
  \n选择你想要动态加载的属性，并点击右侧的下拉箭头查看可能分配给该属性的已定义设置列表。图 17-3 显示了应用程序设置对话框，其中为控件的 `ForeColor`\
  \ 属性显示了此下拉列表。从列表中，选择你想要分配给该属性的设置。\n\n![c17f003.tif](img/c17f003.png)\n\n图 17-3：\
  \ 使用下拉列表将设置分配给动态属性。\n\nVisual Studio 会将该设置添加到程序的配置文件中。如果你打开“解决方案管理器”并双击 `app.config`\
  \ 条目，你就能看到动态属性。\n\n下文显示了 `App.config` 文件的设置部分。`userSettings` 部分定义了如图 17-2 所示的设置。\n\
  \n```xml\n<?xml version=\"1.0\" encoding=\"utf-8\" ?>\n<configuration>\n    <configSections>\n\
  \        ...\n    </configSections>\n    <startup>\n        <supportedRuntime version=\"\
  v4.0\" sku=\".NETFramework,Version=v4.5\" />\n    </startup>\n    <userSettings>\n\
  \        <DynamicSettings.Properties.Settings>\n            <setting name=\"GreetingText\"\
  \ serializeAs=\"String\">\n                <value>Welcome to the DynamicSettings\
  \ program!</value>\n            </setting>\n            <setting name=\"GreetingFont\"\
  \ serializeAs=\"String\">\n                <value>Comic Sans MS, 15.75pt, style=Bold</value>\n\
  \            </setting>\n            <setting name=\"GreetingForeColor\" serializeAs=\"\
  String\">\n                <value>Blue</value>\n            </setting>\n       \
  \     <setting name=\"GreetingBackColor\" serializeAs=\"String\">\n            \
  \    <value>255</value>\n            </setting>\n        </DynamicSettings.Properties.Settings>\n\
  \    </userSettings>\n</configuration>\n```\n\n构建程序时，Visual Studio 将 `App.config`\
  \ 复制到执行目录，并加上 `.config` 后缀。例如，本书中的 DynamicSettings 示例文件名为 `DynamicSettings.config`。当程序启动时，如果存在该，它会读取设置并将值赋值给相应的属性。\n\
  \n到目前，这只是设置控件属性值的一种迂回方法。这种方法的真正用处在于你想更改设置时。只需编辑执行目录中的配置文件并进行任何更改。现在当你运行程序时，它将使用新的设置。如果你将应用程序分发给大量用户，只需要给他们修改后的配置文件，而不是新的可执行文件。\n\
  \n程序还可以如下代码所示访问设置：\n\n```csharp\nMessageBox.Show(Properties.Settings.Default.GreetingText);\n\
  ```\n\n`Properties.Settings.Default` 对象提供了另外两个方法。首先，`Reload()` 方法从配置文件重新加载设置。如果程序修改了设置并想重新加载原始值，这将非常有用。\n\
  \n其次，`Save()` 方法将程序所做的更改保存到配置文件中。该方法仅可以保存具有 `User` 作用范围的设置。\n\n当程序关闭时，会自动保存对设置的任何更改。但是，如果程序崩溃，它没有机会保存任何更改。如果你想确保更改已保存，请在更改设置后调用\
  \ `Properties.Settings.Default.Save()`。\n\n## 资源文件\n\n与配置文件一样，资源文件包含了应用程序运行时加载的值。配置文件旨在让你微调一两个设置。资源文件的意图是让你能够轻松替换整组资源而无需重新编译。\n\
  \n资源文件最常见的用途之一是为不同的语言提供不同的资源。创建不同语言的安装包时，你只需提供执行文件和一个对应语言的资源文件。或者你可以分发支持的所有语言的资源文件，然后让应用程序根据用户的计算机设置在运行时选择合适的文件。\n\
  \n\n\n\n资源文件并非用于存储应用程序配置信息和设置。它们旨在存放你可能想要更改但频率很低的值。你应该将频繁更改的数据存储在配置文件或系统注册表中，而不是资源文件中。\n\
  \n这种区别很小，而且坦率地说，某种程度上是任意的。配置文件和资源文件存储的可以在不重新编译应用程序的情况下交换的数据。然而，重新生成资源文件可能会复杂一些，因此，由于配置和设置数据的更改频率更高，这种区分似乎是有道理的。\n\
  \n资源文件还可以嵌入到编译后的应用程序中。在这种情况下，你无法在不重新编译的情况下更换资源文件。虽然这使得嵌入资源文件在存储频繁更改的信息方面用处较小，但它们仍然为你在应用程序内提供了一个方便的资源数据分组。如果应用程序的多个部分必须使用相同的数据，这将特别有用。例如，如果每个表单都显示相同的背景图像，那么将图像存储在它们都可以使用的公共资源文件中是合理的。\n\
  \n接下来的章节介绍了三种常见的资源类型：应用程序资源、嵌入资源和本地资源。\n\n### 应用程序资源\n\n在 C# 中创建应用程序资源，请选择 `Project`\
  \ ⇒ `Properties`，并点击 `Resources` 选项卡。使用左侧的下拉菜单选择一个资源类别：`Strings`、`Images`、`Icons`、`Audio`、`Files`\
  \ 或 `Other`。图 17-4 显示了显示应用程序的 Resources 选项卡。\n\n要将现有文件添加到程序资源中，点击 `Add Resource`\
  \ 下拉列表并选择 `Add Existing File`。使用下拉菜单的 `Add New String`、`Add New Icon` 或 `Add New\
  \ Text File` 命令从头添加新项。下拉菜单中的 `New Image` 项目会打开一个级联菜单，允许你创建新的 PNG、BMP、GIF、JPEG 和\
  \ TIFF 图像。\n\n![c17f004.tif](img/c17f004.png)\n\n图 17-4: 使用 `Resources` 选项卡定义应用程序使用的图像和其他资源。\n\
  \n当你创建应用程序资源时，Visual Studio 会自动生成代码，为 `Properties.Resources` 类添加强类型资源属性。你的程序可以根据需要使用这些资源。例如，在本书网站上下载的\
  \ `ApplicationResources` 示例程序使用以下代码使其表单显示名为 `HalfJack2` 的图像资源。\n\n```\nprivate void\
  \ Form1_Load(object sender, EventArgs e)\n{\n    this.BackgroundImage = Properties.Resources.HalfJack2;\n\
  }\n```\n\n### 嵌入资源\n\n通常，当你向程序添加资源时，Visual Studio 将其存储在 `Resources.resx` 文件中。（如果你扩展\
  \ `Properties` 项，可以在项目资源管理器中看到该文件。双击该文件将打开 Resources 属性页。）\n\n你还可以向应用程序添加其他资源文件。选择\
  \ `Project` ⇒ `Add New Item`。选择 `Resources File` 模板，赋予文件一个有意义的名字，并点击 OK。\n\n向项目添加资源文件后，你可以在解决方案资源管理器中双击它以在资源编辑器中打开它。然后你就可以像处理应用程序资源文件一样向该文件添加资源了。\n\
  \n就像为应用程序资源生成强类型属性一样，Visual Studio 也会为其他嵌入资源文件生成类似的代码。你可以通过在资源文件名后添加资源文件的名称来访问这些属性。例如，要使用来自\
  \ `Images` 资源文件的名为 `Logo` 的图像资源，程序将使用 `Images.Logo`。\n\n### 本地资源\n\n发明资源文件的最重要的原因之一是允许本地化：为不同的语言和文化支持不同的文本、图像和其他项目。资源使得\
  \ Visual Studio .NET 中的本地化变得简单。\n\n首先，使用你日常通常使用的任何语言创建一个表单。对我来说，那是美国式英语。在表单设计器中打开表单，并添加你需要的任何控件。像照常一样设置表单和控件的属性。\n\
  \n接下来，将表单的 `Localizable` 属性设置为 `true`，并将表单的 `Language` 属性设置为除目前一直使用的默认语言之外想要支持的第一种语言。为新语言修改控件属性。\n\
  \n当你修改表单时，Visual Studio 将你所做的更改保存到附加到表单的新资源文件中。如果你打开解决方案资源管理器并扩展表单项，可以在表单文件下方看到这些资源文件。\n\
  \n示例程序 `Localized` 使用美国英语的默认设置。它还包含了通用德语的本地化（相对于瑞士、德国、列支敦士登或其他国家所通的德语）。如果你扩展解决方案资源管理器中的表单项，你会找到持有默认设置的\
  \ `Form1.resx` 文件和持有德语设置的 `Form1.de.resx` 文件。\n\n当你编译程序时，Visual Studio 会编译资源并将它们保存到以区域命名的目录下的\
  \ `Localized.resources.dll` 文件。（文件名中的“Localized”部分来自程序名称。）在运行时，应用程序会自动检查计算机的区域设置并选择最匹配的资源文件。\n\
  \n例如，假设你的计算机配置为德国/瑞士 (de-CH) 区域。程序首先在名为 `de-CH` 的子目录中查找 `Localized.resources.dll`。如果没有找到该\
  \ DLL，它会在子目录 `de`（通用德语代码）中查找通用德语资源 DLL。如果程序仍然找不到资源 DLL，它将使用包含在表单本身中的默认实现。\n\n以后，如果你需要修改某个区域的资源，可以重新编译应用程序，然后将新的\
  \ `Localized.resources.dll` 复制到相应的子目录。\n\n通常，你应该让应用程序自动选择资源文件，但为了测试目的，你可以显式选择资源文件。要这样做，请打开表单的代码文件并添加以下使用\
  \ 指令。\n\n```\nusing System.Threading;\nusing System.Globalization;\n```\n\n接下来，找到表单的构造函数并在下面的代码中添加**粗体行**。\n\
  \n```\npublic Form1()\n{\n    // 将 culture 和 UI culture 设置为德语。\n    Thread.CurrentThread.CurrentCulture\
  \ = new CultureInfo(\"de-DE\");\n    Thread.CurrentThread.CurrentUICulture = new\
  \ CultureInfo(\"de-DE\");\n\n    InitializeComponent();\n}\n```\n\n现在当表单创建时，它会加载德语\
  \ de-DE 本地的资源。（Localized 示例程序注释了这些行。取消注释以使程序加载德语本地化。）\n\n有关区域代码列表，请参见 [msdn.microsoft.com/library/ee25488.aspx](http://msdn.microsoft.com/library/ee25488.aspx)。\n\
  \n## 总结\n\nVisual Studio 提供了许多存储应用程序配置和资源信息的方法。其中最有用的方法包括环境变量、注册表、配置文件和资源文件。\n\n\
  注册表和配置文件通常持有经常更改的用户特定信息。你可以使用它们存储用户偏好和表单布局。\n\n\n\n如果你将以多种语言发布应用程序，本地化资源文件将使显示相应区域的资源变得更容易。如有必要，你可以更改配置和资源文件中存储的数据，并将其重新分发给用户，而无需重新生成整个应用程序。\n\
  \n使用所有这些技术，你可以让应用程序易于配置。你可以满足不同类型用户的需求，并在无需重新编译程序的情况下自定义应用程序。\n\n本章解释了程序如何使用注册表、环境变量和资源文件等工具保存配置和资源信息。通常，这类数据的大小相对较小。如果应用程序需要存储大量数据，可能应该使用数据库或文件。\n\
  \n下一章将解释 C# 应用程序可以用于处理通用流数据以及特别是文件数据的类。通过使用附加到文件的流，程序可以读取和写入大量数据，而不会弄乱注册表、环境变量或资源文件。\n\
  \n## 练习题\n\n1. 编写一个程序，列出机器、用户和进程层面的所有环境变量。\n\n2. 编写一个程序，显示它正在运行的 Visual Studio 版本。（提示：检查环境变量，直到找到所需的那个一个。）通过双击编译后的可执行文件来运行程序会发生什么？为什么会那样？\n\
  \n3. 如果你在命令提示符处输入程序名称，操作系统会检查 `PATH` 环境变量定义的路径以尝试查找程序。编写一个程序，显示 `PATH` 变量中列出的路径。\n\
  \n4. 编写一个程序，包含用于姓、名、街道、城市和邮政编码的 `TextBox`。还要给它一个用于选择州的 `ComboBox`。让程序在启动和停止时加载和保存控件的值。（提示：你不需要单独保存和恢复每个值。相反，遍历表单的\
  \ `Controls` 集合并保存和恢复 `TextBox` 和 `ComboBox` 的值。）\n\n5. 编写一个程序，显示从配置文件加载字体的标签。最初，使用\
  \ 20 点的 Times New Roman 并运行程序。然后手动编辑配置文件使用 30 点的 Comic Sans MS 并运行编译后的可执行文件。如果你再次从\
  \ Visual Studio 运行程序，会发生什么？如果你删除配置文件并运行编译后的可执行文件，会发生什么？如果你再次从 Visual Studio 运行程序，会发生什么？\n\
  \n6. 本地化允许你本地化控件属性，但你可以使用类似的技术来本地化未存储在控件属性中的资源。创建一个程序，添加一个名为 `MyStrings.resx` 的新资源文件，并给它一个名为\
  \ `Greeting` 值为“Hello.”的字符串资源。现在创建一个名为 `MyStrings.fr.resx` 的第二个资源文件，并给它一个名为 `Greeting`\
  \ 值为 Salut 的字符串资源。在表的 `Load` 事件处理程序中，在消息框中显示该值。当你的程序加载法语区域 (fr-FR) 时会发生什么？Visual\
  \ Studio 创建了哪些本地化目录和文件？\n\n7. 设置当前线程的文化不仅可以让程序加载正确的本地化资源。它还能让区域感知的方法（例如使用标准数字、货币和日期格式的方法）显示适用于该区域的结果。\n\
  \n编写一个程序，在以下每个区域显示区域设置、当前日期和货币金额 12,345.67：`fr-FR`、`de-DE`、`de-CH`、`es-MX`、`es-ES`、`en-US`\
  \ 和 `en-GB。（提示：如“本地化资源”节所示设置 `CurrentCulture`。使用 `ToShortDateString` 方法格式化日期。使用\
  \ `ToString(\"C\")` 格式化货币值。）\n\n# 第 18 章：流\n\n## 本章主要内容\n\n- `Stream`、`FileStream`\
  \ 和 `MemoryStream` 类\n- 流读取器和写入器\n- 打开文本文件\n- 特殊流类\n\n## Wrox.com 本章下载\n\n请注意，本章的所有代码示例都是本书章代码下载的一部分，可以在书籍网站\
  \ [www.wrox.com/go/csharp5programmersref](http://www.wrox.com/go/csharp5programmersref)\
  \ 的“Download Code”选项卡下载。\n\n在基础层，所有数据都只是字节的集合。计算机实际上并不存储发票、员工记录和食谱。在最基础的层，计算机存储的是信息的字节。（甚至是位，但计算机自然地将它们分组为字节。）只有当程序解释这些字节时，它们才会获得对用户有价值的更高层含义。\n\
  \n通常，将高层数据视为无区别的字节是没有帮助的，但在某些情况下，忽略数据的高层结构并将其视为一堆字节是有用的。\n\n考虑数据的一种重要方式是流，它是一系列有序的字节。文件、在网络中跨流动的数据、通过队列移动的消息、甚至数组中的内存都可以符合这一描述。\n\
  \n定义流的抽象概念让应用程序能够统一处理这些不同类型的对象。例如，加密算法可以处理流中的字节，而无需知道它们代表的是员工、处方信息还是图像。\n\nVisual\
  \ Studio 提供了几个类来操作不同类型的流。它还提供了更的类来处理表示特定类型数据的流。例如，它包含了用于处理文本文件的流的类。\n\n本章描述了你可以用于操作流的某些类。它解释了你可能极少使用的低级类，以及让你能够较容易读写字符串和文件的高级类。\n\
  \n下表总结了最有用的流类。\n\n| 类 | 用途 |\n| :--- | :--- |\n| `Stream` | 其他流类的基类。最通用的操作工具使用 `Stream`\
  \ 对象。 |\n| `FileStream` | 在文件中读取和写入字节。 |\n| `MemoryStream` | 在内存中读取和写入字节。 |\n| `BinaryReader`,\
  \ `BinaryWriter` | 在流中读取和写入特定数据类型。 |\n| `StringReader`, `StringWriter` | 在字符串中读取和写入文本或换行符。\
  \ |\n| `StreamReader`, `StreamWriter` | 在流（通常是文件）中读取和写入文本或换行符。 |\n\n后续章节将详细描述其中的某些类。\n\
  \n## Stream\n\n`Stream` 类定义了派生流类必须提供的属性和方法。这些允许程序对流执行通用的任务，例如确定流是否允许写入以及判断流何时到达结束。\n\
  \n下表描述了 `Stream` 类最有用的属性。\n\n| 属性 | 目的 |\n| :--- | :--- |\n| `CanRead` | 如果流支持读取。\
  \ |\n| `CanSeek` | 如果流支持跳转到特定的特定位置。 |\n| `CanTimeout` | 如果流支持读取和写入操作超时。 |\n| `CanWrite`\
  \ | 如果流支持写入。 |\n| `Length` | 流中的字节数。 |\n| `Position` | 流的当前位置。对于支持跳转的流，程序可以设置此值以移动到特定位置。\
  \ |\n| `ReadTimeout` | 读取操作超时前等待的毫秒数。 |\n| `WriteTimeout` | 写入操作超时前等待的毫秒数。 |\n\n\
  \n\n\n\n| `Dispose` | 释放流的资源。 |\n| `EndRead` | 等待异步读取完成。 |\n| `EndWrite` | 结束异步写入。\
  \ |\n| `Flush` | 将流缓冲区中的数据刷新到底层存储（如文件或内存块）。 |\n| `Read` | 从流中读取字节并将位置向前移动相应的字节数。\
  \ |\n| `ReadByte` | 从流中读取一个字节并将位置向前移动一个字节。 |\n| `Seek` | 如果流支持寻址，则设置流的位置。 |\n| `SetLength`\
  \ | 设置流的长度。如果当前流长度大于新长度，则对其进行截断；如果流小于新长度，则将其扩展。该方法需要流同时支持写入和寻址才能工作。 |\n| `Write`\
  \ | 向流中写入字节并将当前位置向前移动该字节数。 |\n| `WriteByte` | 向流中写入 1 个字节并将当前位置向前移动 1 个字节。 |\n\n\
  欲了解关于 `Stream` 类的更多信息，请参 [msdn.microsoft.com/system.io.stream.aspx](http://msdn.microsoft.com/system.io.stream.aspx)。\n\
  \n## FileStream\n\n`FileStream` 类表示与文件相关的流。其父类 `Stream` 定义了它的大部分属性和方法。请参见前述章节有关这些属性和方法的描述。\n\
  \n`FileStream` 为继承自 `Stream` 的增加了两个实用的新属性。首先，`IsAsync` 如果 `FileStream` 是异步打开的，则返回\
  \ `true`。其次，`Name` 属性返回传递对象构造函数的文件名。\n\n该类还为继承自 `Stream` 的增加了两个新的实用方法。`Lock` 方法锁定文件，使其他进程可以读取它但不能修改它。`Unlock`\
  \ 则移除之前的锁定。\n\n`FileStream` 类构造函数的重载版本允许你指定以下内容：\n\n* 文件名或文件句柄\n* 文件模式（`Append`、`Create`、`CreateNew`、`Open`、`OpenOrCreate`\
  \ 或 `Truncate`）\n* 访问模式（`Read`、`Write` 或 `ReadWrite`）\n* 文件共享（`Inheritable`，允许子进程继承文件句柄；`None`；`Read`；`Write`\
  \ 或 `ReadWrite`）\n* 缓冲区大小\n* 文件选项（`Asynchronous`、`DeleteOnClose`、`Encrypted`、`None`、`RandomAccess`、`SequentialScan`\
  \ 或 `WriteThrough`）\n\n示例程序 `WriteIntoFileStream` 可在本书的网站下载，它使用以下代码创建并写入文本文件。\n\n\
  ```c\nstring filename = filenameTextBox.Text;\nusing (FileStream filestream = new\
  \ FileStream(filename, FileMode.Create))\n{\n    byte[] bytes = new UTF8Encoding().GetBytes(textTextBox.Text);\n\
  \    filestream.Write(bytes, 0, bytes.Length);\n}\n```\n\n这段代码从 `filenameTextBox`\
  \ 获取文件名。它将名称和文件访问参数 `Create` 传递给 `FileStream` 构造函数。\n\n`UTF8Encoding` 对象表示 UTF-8\
  \ 编码的字符。代码创建了这样一个对象，并使用其 `GetBytes` 方法创建一个表示 `textTextBox` 中文本的字节数组。\n\n代码随后将字节写入文件流。`using`\
  \ 语句确保流被释放，并刷新和关闭流。\n\n正如此示例所示，`FileStream` 类仅提供了用于读写文件的低级方法。这些方法允许你读写字节，但不是整数、字符串或其他你可能想要使用的其他数据类型。\n\
  \n`BinaryReader` 和 `BinaryWriter` 类使得处理二进制数据变得更容易。同样，`StringReader` 和 `StringWriter`\
  \ 类使得处理字符串变得更容易。请参见本章节稍后的“`BinaryReader` 和 `BinaryWriter`”以及“`StringReader` 和 `StringWriter`”章节获取有关这些类的更多信息。\n\
  \n## MemoryStream\n\n`MemoryStream` 类表示数据存储在内存中的流。与 `FileStream` 类一样，它提供了相对原始的读写方法。通常，你可能希望将一个高级别的对象附加到\
  \ `MemoryStream` 以使其更容易使用。\n\n示例程序 `WriteIntoMemoryStream` 可在本书的网站下载，它使用以下代码对 `MemoryStream`\
  \ 对象进行写入和读取。\n\n```csharp\n// 创建流。\nMemoryStream stream = new MemoryStream();\n\n\
  // 写入流。\nBinaryWriter writer = new BinaryWriter(stream);\nwriter.Write(textTextBox.Text);\n\
  \n// 从流中读取。\nstream.Seek(0, SeekOrigin.Begin);\nBinaryReader reader = new BinaryReader(stream);\n\
  MessageBox.Show(reader.ReadString());\n\n// 清理。\nwriter.Dispose();\nreader.Dispose();\n\
  stream.Dispose();\n```\n\n代码首先创建一个 `MemoryStream`。然后它创建一个与流关联的 `BinaryWriter`，并使用其\
  \ `Write` 方法向其中写入字符串。\n\n接下来，代码使用 `Seek` 方法将流回滚到数据的开头。然后它创建一个与流关联的 `BinaryReader`，使用其\
  \ `ReadString` 方法从流中读取字符串，并在消息框中显示该字符串。\n\n代码通过释放其使用的对象来结束。这比通常情况稍微困惑一点，因为读取器和写入器。\n\
  \n## BinaryReader and BinaryWriter\n\n`BinaryReader` 和 `BinaryWriter` 类是处理流的辅助类。它们提供了一个使得读写数据更简单的接口。例如，`BinaryReader`\
  \ 类的 `ReadInt32` 方法从流读取 4 字节的有符号整数。同样，`ReadUInt16` 读取 16 位无符号整数。\n\n`BinaryReader`\
  \ 和 `BinaryWriter` 类都具有 `BaseStream` 属性，用于返回底层流的引用。注意它们的 `Close` 和 `Dispose` 方法会关闭流。\n\
  \n下表描述了 `BinaryReader` 类最常用的方法。\n\n| 方法 | 目的 |\n| `Close` | 关闭 `BinaryReader` 及其底层流。\
  \ |\n| `PeekChar` | 读取流的下一个字符但不移动读取器位置。 |\n| `Read` | 从流中读取字符并移动读取器位置。 |\n| `ReadBoolean`\
  \ | 从流读取一个 `bool`并将位置向前移动 1 字节。 |\n| `ReadByte` | 从流读取一个 `byte`并将位置向前移动 1 字节。 |\n\
  | `ReadBytes` | 从流读取指定数量的 `byte` 到字节数组，并将位置移动相应的字节数。 |\n| `ReadChar` | 从流读取一个 `char`\
  \ 并根据流的编码相应移动读取器位置。 |\n| `ReadChars` | 从流读取指定数量的 `char`，结果返回到 `char` 数组，并根据流的编码相应移动读取器位置。\
  \ |\n| `ReadDecimal` | 从流读取一个 `decimal` 值并将位置向前移动 16 字节。 |\n| `ReadDouble` | 从流读取一个\
  \ 8 字节的 `double`并将位置向前移动 8 字节。 |\n| `ReadInt16` | 从流读取一个 2 字节的 `short`并将位置向前移动 2\
  \ 字节。 |\n| `ReadInt32` | 从流读取一个 4 字节的 `int`并将位置向前移动 4 字节。 |\n\n\n\n\n\n| `ReadInt64`\
  \ | 从流中读取一个 8 字节的 `long` 并将读取器位置移动 8 字节。 |\n| `ReadSByte` | 从流中读取一个有符号的 `sbyte`\
  \ 并将读取器位置移动 1 字节。 |\n| `ReadSingle` | 从流中读取一个 4 字节的 `float` 并将读取器位置移动 4 字节。 |\n\
  | `ReadString` | 从当前流中读取一个 `string` 并让读取器跳过该字符串。 |\n| `ReadUInt16` | 从流中读取一个 2 字节的无符号\
  \ `ushort` 并将读取器位置移动 2 字节。 |\n| `ReadUInt32` | 从流中读取一个 4 字节的无符号 `uint` 并将读取器位置移动\
  \ 4 字节。 |\n| `ReadUInt64` | 从流中读取一个 8 字节的无符号 `ulong` 并将读取器位置移动 8 字节。 |\n\n下表描述了\
  \ `BinaryWriter` 类最常用的方法。\n\n| 方法 | 用途 |\n| `Close` | 关闭 `BinaryWriter` 及其底层流。 |\n\
  | `Flush` | 将任何缓冲区数据写入底层流。 |\n| `Seek` | 设置流中的位置。 |\n| `Write` | 将值写入流中。此方法有许多重载版本，用于向流写入\
  \ `char`、`char[]`、`int`、`string`、`ulong` 和其他数据类型。 |\n\n更多关于这些类的信息，请访问 [msdn.microsoft.com/system.io.binarywriter.aspx](http://msdn.microsoft.com/system.io.binarywriter.aspx)\
  \ 和 [msdn.microsoft.com/system.io.binaryreader.aspx](http://msdn.microsoft.com/system.io.binaryreader.aspx)。\n\
  \n# TextReader 和 TextWriter\n\n类似于 `BinaryReader` 和 `BinaryWriter` 类，`TextReader`\
  \ 和 `TextWriter` 类为底层流提供了接口。正如你可能从名称猜到的，这些类提供了处理文本的方法。\n\n`TextReader` 和 `TextWriter`\
  \ 是抽象类，因此你无法创建它们的实例。它们为你可以实例化的派生类定义了行为。\n\n例如，派生自 `TextWriter` 的 `StringWriter`\
  \ 和 `StreamWriter` 类分别允许程序将字符写入字符串或流中。\n\n通常情况下，你会使用这些派生类来读写文本，但你可能想使用 `TextReader`\
  \ 或 `TextWriter` 类来更通用地操作底层类。你可能还会发现 .NET Framework 方法需要 `TextReader` 或 `TextWriter`\
  \ 对象作为参数。在这种情况下，你可以向方法传递 `StringReader`/`StringWriter` 或 `StreamReader`/`StreamWriter`。（有关这些类的更多信息，请参阅本章稍后部分的“StringReader\
  \ 和 StringWriter”以及“StreamReader 和 StreamWriter”小节。）\n\n下表描述了 `TextReader` 类最常用的方法。\n\
  \n| 方法 | 用途 |\n| `Close` | 关闭读取器并释放其资源。 |\n| `Peek` | 从输入中读取下一个字符而不改变读取器的状态，以便其他方法以后可以读取该字符。\
  \ |\n| `Read` | 从输入中读取数据。此方法的重载版本读取单个 `char` 或长度指定长度的 `char` 数组。 |\n| `ReadBlock`\
  \ | 将数据从输入读取到 `char` 数组中。 |\n| `ReadLine` | 从输入中读取一行字符并以 `string` 形式返回数据。 |\n| `ReadToEnd`\
  \ | 读取输入中的任何剩余字符并以 `string` 形式返回。 |\n\n`TextWriter` 类三个实用的属性。`Encoding` 指定文本的编码（ASCII、UTF-8、Unicode\
  \ 等）。\n\n`FormatProvider` 属性返回一个控制格式化的对象。例如，你可以构建一个 `FormatProvider` 对象，它知道如何以不同的进制（如十六进制或八进制）显示数字。\n\
  \n`NewLine` 属性获取或设置写入器用于结束行的字符串。通常，此值类似于回车符或回车符加换行符。\n\n下表描述了 `TextWriter` 类最常用的方法。\n\
  \n| 方法 | 用途 |\n| `Close` | 关闭写入器并释放其资源。 |\n| `Flush` | 将任何缓冲区数据写入底层流。 |\n| `Write`\
  \ | 将值写入流中。此方法有许多重载版本，用于写入 `char`、`char[]`、`int`、`string`、`ulong` 和其他数据类型。 |\n|\
  \ `WriteLine` | 向输出写入数据并在后跟换行序列。 |\n\n更多关于 `TextWriter` 和 `TextReader` 类的信息，请访问\
  \ [msdn.microsoft.com/system.io.textwriter.aspx](http://msdn.microsoft.com/system.io.textwriter.aspx)\
  \ 和 [msdn.microsoft.com/system.io.textreader.aspx](http://msdn.microsoft.com/system.io.textreader.aspx)。\n\
  \n## StringReader 和 StringWriter\n\n`StringReader` 和 `StringWriter` 类允许程序在字符串中读写文本。\n\
  \n这些类派自 `TextReader` 和 `TextWriter`，因此它们继承了这些基类的大部分属性和方法。详情请参见上一节。\n\n`StringReader`\
  \ 类提供了从 `string` 中读取行、字符或字符块的方法。`StringReader` 类的构造函数接受它要处理的字符串作为参数。`ReadToEnd`\
  \ 方法返回字符串尚未读取的部分。\n\n`StringWriter` 类允许应用程序构建字符串。它提供了带或不带换行序列写入字符串的方法。`ToString`\
  \ 方法返回对象所表示的字符串。\n\n`StringWriter` 将其字符串存储在 `StringBuilder` 对象中。`StringBuilder`\
  \ 类的设计旨在比通过拼接一系列值来构建 `string` 变量高效。例如，如果应用程序需要通过拼接一系列子字符串来构建字符串，使用 `StringBuilder`\
  \ 可能更高效。`StringWriter` 为 `StringBuilder` 类提供了简单的接口。\n\n`StringWriter` 提供的由基类未定义的有用方法是\
  \ `GetStringBuilder`。此方法返回持有对象数据的 `StringBuilder` 对象的引用。\n\n示例程序 `StringWriterReader`\
  \ 可以在本书网站下载，它使用以下代码演示 `StringWriter` 和 `StringReader` 类。\n\n```\n// 使用 StringWriter\
  \ 写入字符串。\nusing (StringWriter writer = new StringWriter())\n{\n    // 写入用户输入的字符串。\n\
  \    writer.WriteLine(textBox1.Text);\n    writer.WriteLine(textBox2.Text);\n  \
  \  writer.WriteLine(textBox3.Text);\n\n    // 显示结果。\n    string result = writer.ToString();\n\
  \    MessageBox.Show(result);\n\n    // 使用 StringReader 读取结果。\n    using (StringReader\
  \ reader = new StringReader(result))\n    {\n        // 读取一行。\n        MessageBox.Show(reader.ReadLine());\n\
  \        // 读取剩余部分。\n        MessageBox.Show(reader.ReadToEnd());\n    }\n}\n```\n\
  \n[/content\n\n## StreamReader 和 StreamWriter\n\n`StreamReader` 和 `StreamWriter`\
  \ 类允许程序在流（通常是 `FileStream`）中读写数据。你可以将 `FileStream` 传递给这些类的构造函数，也可以传递文件名并由对象自动创建\
  \ `FileStream`。\n\n\n\n\n\n`StreamReader` 类提供了从流中读取行、字符或字符块的方法。它的 `ReadToEnd` 方法返回流中尚未被读取的任何部分。当\
  \ `StreamReader` 达到流的末尾时，`EndOfStream` 属性为 `true`。\n\n示例程序 `ReadLines` 可以在本书的网站下载，它使用以下代码片段从文件中读取并将其添加到\
  \ `ListBox` 控件中。\n\n```\nusing (StreamReader reader = new StreamReader(\"Animals.txt\"\
  ))\n{\n    // 持续读取直到到达文件末尾。\n    do\n    {\n        animalListBox.Items.Add(reader.ReadLine());\n\
  \    }\n    while (!reader.EndOfStream);\n}\n```\n\n`StreamWriter` 类提供了向流中写入文本的方法，可以带有或不带有换行符。\n\
  \n`StreamReader` 和 `StreamWriter` 派自 `TextReader` 和 `TextWriter` 类，并继承了这些类中的大多数属性和方法。请参阅本章前面的“`TextReader`\
  \ 和 `TextWriter`”部分以获取这些属性和方法的描述。\n\n`StreamWriter` 类增加了一个新的 `AutoFlush` 属性，用于确定写入器在每次写入后是否刷新其缓冲区。如果程序定期写入同一个文件且你希望确保内容已刷新，则这非常有用。例如，程序每隔几分钟写入一次日志文件。如果你将\
  \ `AutoFlush` 设置为 `true`，则输出将始终写入文件，你可以可以使用记事本或其他程序查看文件并查看最新条目。\n\n示例程序 `WriteLog`\
  \ 可以在本书的网站下载，它使用以下代码演示 `StreamWriter` 类的 `AutoFlush` 属性。\n\n```\n// 日志文件流。\nprivate\
  \ StreamWriter Writer;\n\n// 打开日志文件。\nprivate void Form1_Load(object sender, EventArgs\
  \ e)\n{\n    Writer = new StreamWriter(\"Log.txt\", true);\n    Writer.AutoFlush\
  \ = true;\n}\n\n// 向日志中写入条目。\nprivate void writeButton_Click(object sender, EventArgs\
  \ e)\n{\n    Writer.WriteLine(DateTime.Now.ToString() + \": \" + entryTextBox.Text);\n\
  \    entryTextBox.Clear();\n    entryTextBox.Focus();\n}\n\n// 关闭日志文件。\nprivate\
  \ void Form1_FormClosing(object sender, FormClosingEventArgs e)\n{\n    Writer.Dispose();\n\
  }\n```\n\n程序的 `Form_Load` 事件处理器打开日志文件并将 `StreamWriter` 的 `AutoFlush` 属性设置为 `true`。\n\
  \n当你点击其写入（Write）按钮时，程序会将当前时间以及你在 `TextBox` 中输入的文本添加到日志文件中。\n\n程序的 `FormClosing`\
  \ 事件处理器会释放 `StreamWriter`。\n\n在程序运行期间，使用记事本查看日志文件并查看最近的条目。注释掉将 `AutoFlush` 设置为 `true`\
  \ 的代码并再次运行程序，看看会发生什么。\n\n## Exists, OpenText, CreateText, 和 AppendText\n\n`System.IO.File`\
