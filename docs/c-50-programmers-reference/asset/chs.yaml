  \ \" +\n        \"WHERE StudentId=\" + studentId.ToString() + \" \" +\n        \"\
  ORDER BY TestNumber\";\n\n    // 打开连接。\n    Connection.Open();\n\n    // 执行命令。\n\
  \    using (OleDbCommand command = new OleDbCommand(query, Connection))\n    {\n\
  \        // 执行命令。\n        using (OleDbDataReader reader = command.ExecuteReader())\n\
  \        {\n            while (reader.Read())\n            {\n                int\
