  >\n            <summary>\n              对于使用此强类型资源类的所有资源查找，\n              覆盖当前线程的\
  \ CurrentUICulture 属性。\n            </summary>\n        </member>\n    </members>\n\
  </doc>\n```\n\n\nVisual Studio 解决方案包含项的层次级结构。在顶层，它包含一个或多个项目。每个项目包含定义表单、应用程序设置和资源等项的文件。本章解释了这些最常见类型文件的用途。\n\
  \n本章还解释了预处理器指令，例如 `#define`、`#if` 和 `#region`，你可以将它们包含在 C# 源文件中，以控制 Visual Studio\
  \ 和 C# 编译器管理文件的方式。它还解释了代码文件结构的基本元素，例如 `using` 和 `namespace` 语句、类声明以及各种类型的注释。\n\n\
  现在你已经了解了构成 C# 项目和代码文件的基本元素，可以开始学习这种语言本身了。书中下一部分的章节描述了 C# 编程语言的基本元素。第 4 章](#c04.xhtml)“数据类型、变量和常量”从解释程序在处理数据时存储信息的数据类型、变量和常量开始。\n\
  \n\n本章的练习实际上是你应该练习的内容，而不是测试你理解能力的的问题。花几分钟尝试一下。这些练习以及书的其他部分假设你使用的是 Windows Desktop\
  \ 版 Visual Studio 2012 Express。如果你倾向于使用其他版本的 Visual Studio，可能需要对练习及其解决方案进行某种调整。\n\
