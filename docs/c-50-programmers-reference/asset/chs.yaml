  \ |\n| `y` 或 `Y` | 年份和月份。 | August 2015 |\n\n## 自定义格式说明符\n\n自定义格式说明符描述了日期或时间的部分，你可以使用它们来构建自定义的格式。例如，说明符\
  \ `ddd` 表示缩写的星期几，如 Wed.。\n\n通常情况下，你只应该使用自定义日期和时间格式来构建代码内部使用的值。用户永远不应该看到它们。\n\n下表列出了你可以用于构建日期和时间字符串自定义格式的字符。\n\
