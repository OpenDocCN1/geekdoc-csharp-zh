  ## 11. (困难) 创建一个与图 6-3 所示类似的应用程序。（你无法从书中的图片中看出，但左上角的图像使用红色调，右上角的图像使用绿色调，左下角的图像使用蓝色调，右下角的图像使用灰色调。）\n\
  \n![c06f003.tif](img/c06f003.png)\n\n图 6-3: ColorizeBitmap 示例程序同步和异步地创建图像的红色、绿色、蓝色和灰色版本。\n\
  \nFile 有两个命令：Open（打开图像文件）和 Exit（退出程序）。Process 也有两个命令：Synchronously（同步处理图像）和 Asynchronously（异步处理图像）。\n\
  \n你可以使用以下枚举和 `ProcessBitmap` 方法。\n\n```\n// 着类型。\nprivate enum ColorizationType\n\
  {\n    Red,\n    Green,\n    Blue,\n    Gray,\n}\n\n// 处理 Bitmap。\nprivate void\
  \ ProcessBitmap(Bitmap bm, ColorizationType colorType)\n{\n    for (int y = 0; y\
  \ < bm.Height; y++)\n    {\n        for (int x = 0; x < bm.Width; x++)\n       \
  \ {\n            Color color = bm.GetPixel(x, y);\n            int average = (color.R\
  \ + color.G + color.B) / 3;\n            if (colorType == ColorizationType.Red)\n\
  \                bm.SetPixel(x, y, Color.FromArgb(average, 0, 0));\n           \
  \ else if (colorType == ColorizationType.Green)\n                bm.SetPixel(x,\
  \ y, Color.FromArgb(0, average, 0));\n            else if (colorType == ColorizationType.Blue)\n\
  \                bm.SetPixel(x, y, Color.FromArgb(0, 0, average));\n           \
  \ else\n                bm.SetPixel(x, y, Color.FromArgb(average, average, average));\n\
  \        }\n    }\n}\n```\n\n当用户选择 Synchronously 命令时，使用 `ProcessBitmap` 方法处理加载图像的四个副本并显示结果。\n\
  \n当用户选择 Asynchronously 命令时，使用 `BeginInvoke` 和 `EndInvoke` 异步执行相同的任务。\n\n使用 `System.Diagnostics.Stopwatch`\
  \ 类对这两种技术进行计时。\n\n## 12. 修改为练习 11 编写的程序以使用回调函数或 `async` 和 `await` 是否会有优势？\n\n# 第\
  \ 7 章\n\n程序控制语句\n\n### 本章内容\n\n*   `if-else` 和 `switch` 语句\n*   `?:` 和 `??` 运算符\n\
  *   `for`、`while`、`do` 和 `foreach` 循环\n*   枚举器\n*   `break` 和 `continue` 语句\n\n\
  ### 本章的 Wrox.com 下载\n\n请注意，本章的所有代码示例都可以作为本章代码从书籍网站 [www.wrox.com/go/csharp5programmersref](http://www.wrox.com/go/csharp5programmersref)\
  \ 下载。\n\n程序控制语句告诉程序在不同情况下执行哪些语句。主要分为决策语句（条件语句）和循环语句。下文将详细介绍。\n\n## 决策语句\n\n决策语句或条件语句表示程序中的分支。它标记了程序执行一组语句或另一组语句，取决于某些条件。这些包括多种\
  \ `if` 语句和 `switch` 语句。\n\n### if-else 语句\n\n`if-else` 语句具有以下语法：\n\n```\nif (condition1)\
  \ statement1;\nelse if (condition2) statement2;\nelse if (condition3) statement3;\n\
  ...\nelse statementElse;\n```\n\n条件是求值为 `true` 或 `false` 的逻辑表达式。语句是在相应条件为 `true`\
  \ 时执行的语句。\n\n程序评估每个条件，直到找到一个为 `true`。然后执行相应的语句并跳过剩余的 `else` 和 `if` 语句。\n\n如果所有条件为\
  \ `true`，程序执行 `statementElse`。\n\n例如，考虑以下代码：\n\n```\nstring greeting = \"\";\n\n\
  if (DateTime.Now.DayOfWeek == DayOfWeek.Monday)\n    greeting = \"Sorry, it's Monday.\"\
  ;\nelse if (DateTime.Now.DayOfWeek == DayOfWeek.Friday)\n    greeting = \"Finally,\
  \ it's Friday!\";\nelse\n    greeting = \"Welcome to \" + DateTime.Now.DayOfWeek.ToString();\n\
  \nMessageBox.Show(greeting);\n```\n\n代码首先创建字符串变量 `greeting` 并将其初始化为空字符串。然后开始一系列\
  \ `if-else` 语句。\n\n如果是星期一，程序将 `greeting` 设置为 `\"Sorry, it's Monday.\"`。如果不是星期一且是星期五，程序将\
  \ `greeting` 设置为 `\"Finally, it's Friday!\"`。如果既不是星期一也不是星期五，程序将 `greeting` 设置为 `\"\
  Welcome to \"` 加上当前的星期。\n\n在 `if-else` 语句之后，程序在消息框中显示 greeting。\n\n最后的 `else` 部分是可选的。如果不包含它且所有条件都不为\
  \ `true`，程序就不会执行任何相应的语句。\n\n所有的 `else if` 语句也是可选的。如果代码只包含一个 `if` 语句，程序执行随后的语句或不执行，取决于条件的值。\n\
  \n例如，以下代码使用单个 `if` 语句，仅在周一时显示消息框。\n\n```c\nif (DateTime.Now.DayOfWeek == DayOfWeek.Monday)\n\
  \    MessageBox.Show(\"Sorry, it's Monday.\");\n```\n\n\n\n\n\n当条件为 `true` 时，程序执行的“语句”实际上可以是一个由大括号括起来语句块。下面显示了其语法。\n\
  \n```\nif (condition1)\n{\nstatement1;\n}\nelse if (condition2)\n{\nstatement2;\n\
  }\nelse if (condition3)\n{\nstatement3;\n}\n...\nelse\n{\nstatementElse;\n}\n```\n\
  \n你可以在大括号之间放置任意数量的语句。\n\n### switch 语句\n\n`switch` 语句允许程序根据单个值执行几段代码中的某一段。其结果类似于一系列\
  \ `if-else` 语句，这些语句将单个值与系列其他值进行比较。\n\n基本语法如下：\n\n```\nswitch (value)\n{\n    case\
  \ expression1:\nstatements1;\n        break;\n    case expression2:\n        statements2;\n\
  \        break;\n    ...\n    «default:\nstatementsDefault\n        break;»\n}\n\
  ```\n\n在这里，程序将 `value` 与各个表达式进行比较，直到找到匹配项或用完所有待测试的表达式。这些表达式必须是常量语句，且不能重复。\n\n如果程序找到匹配项，它会执行对应的代码。如果程序用完了表达式，它将执行\
  \ `default` 部分中的语句（如果存在）。\n\n你可以将多个 `case` 语句放在一组中，使它们都执行相同的代码。然而，你不允许代码从一个 `case`\
  \ 部分直接穿透（fall through）到下一个部分。如果第一个部分包含代码行，则它在下一个 `case` 开始之前必须以一个 `break` 语句结束。\n\
  \n以下代码与之前检查星期几的代码类似，但此版本为周六和周日增加了额外的代码。\n\n```\nstring greeting = \"\";\n\nswitch\
  \ (DateTime.Now.DayOfWeek)\n{\n    case DayOfWeek.Monday:\n        greeting = \"\
  Sorry, it's Monday.\";\n        break;\n    case DayOfWeek.Friday:\n        greeting\
  \ = \"Finally, it's Friday!\";\n        break;\n    case DayOfWeek.Saturday:\n \
  \   case DayOfWeek.Sunday:\n        greeting = \"Yay! The weekend!\";\n        break;\n\
  \    default:\n        greeting = \"Welcome to \" + DateTime.Now.DayOfWeek.ToString();\n\
  \        break;\n}\n\nMessageBox.Show(greeting);\n```\n\n这段代码初始化了 `greeting` 变量，然后执行\
  \ `switch` 语句。根据 `DateTime.Now.DayOfWeek` 的值，程序执行相应 `case` 部分中的代码。\n\n`DayOfWeek.Monday`\
  \ 和 `DayOfWeek.Friday` 值有它们自己的部分。两个值 `DayOfWeek.Saturday` 和 `DayOfWeek.Sunday` 都执行将\
  \ `greeting` 设置为 `\"Yay! The weekend!\"` 的代码。\n\n如果 `DateTime.Now.DayOfWeek` 不是上述任何值，`default`\
  \ 部分将 `greeting` 设置为 `\"Welcome to\"` 后面跟上具体的星期几。\n\n### 枚举值\n\n`switch` 语句与离散值列表工作得很自然，因为每个\
  \ `case` 语句可以处理一个值。\n\n枚举类型也适用于离散值，因此它们与 `switch` 语句配合良好。枚举类型定义了值，而 `switch` 语句使用这些值，如下面的代码片段所示。\n\
  \n```\nprivate enum JobStates\n{\n    Pending,\n    Assigned,\n    InProgress,\n\
  \    ReadyToTest,\n    Tested,\n    Released,\n}\nprivate JobStates JobState;\n\
  ...\nswitch (JobState)\n{\n    case JobStates.Pending:\n        ...\n        break;\n\
  \    case JobStates.Assigned:\n        ...\n        break;\n    case JobStates.InProgress:\n\
  \        ...\n        break;\n    case JobStates.ReadyToTest:\n        ...\n   \
  \     break;\n    case JobStates.Tested:\n        ...\n        break;\n    case\
  \ JobStates.Released:\n        ...\n        break;\n}\n```\n\n为了在更改枚举类型时捕获错误，许多开发者会包含一个抛出异常的\
  \ `default` 部分。如果你以后向枚举类型中添加了新值，但忘记在 `switch` 语句中添加相应的代码，`default` 部分将抛出异常，以便你可以修复代码。\n\
  \n有关枚举类型的更多信息，请参阅 第 4 章 中的“枚举 (Enumerations)”章节。\n\n### 条件运算符与空合并运算符\n\n条件运算符或三元运算符\
  \ `?:` 评估一个布尔表达式，并根据表达式是 `true` 还是 `false` 返回两个值中的一个。例如，以下代码检查 `Employee` 对象的 `IsManager`\
  \ 属性。如果 `IsManager` 为 `true`，代码将员工的 `Salary` 设置为 `90,000`。如果 `IsManager` 为 `false`，代码将员工的\
  \ `Salary` 设置为 `10,000`。\n\n```\nemp.Salary = emp.IsManager ? 90000 : 10000;\n```\n\
  \n这等同于以下 `if-else` 语句。\n\n```\nif (emp.IsManager) emp.Salary = 90000;\nelse emp.Salary\
  \ = 10000;\n```\n\n空合并运算符 `??` 检查引用值。如果该值不是 `null`，则返回该值。如果第一个值为 `null`，则返回它的第二个参数。例如，如果\
  \ `customer` 不是 `null`，则代码将变量 `orderedBy` 设置为 `customer`。如果 `customer` 为 `null`，代码将\
  \ `orderedBy` 设置为 `default`。\n\n```\norderedBy = customer ?? default;\n```\n\n有关条件和空合并运算符的更多信息，请参阅条件运算符与空合并运算符。\n\
  \n## 循环语句\n\n循环语句让程序重复执行一系列语句。C# 四种循环：`for`、`while`、`do` 和 `foreach`。\n\n### for\
  \ 循环\n\n`for` 循环的语法如下：\n\n```\nfor (initialization; test; increment)\n```\n\n循环的各个如下：\n\
  \n- `initialization`: 这部分代码可以初始化循环；尽管你可以在这里放置其他代码。\n- `test`: 程序每次执行循环内部代码之前，都会评估此布尔表达式。如果结果为\
  \ `true`，循环继续。如果结果为 `false`，循环结束。\n- `increment`: 在程序执行完循环内部代码但在检查 `test` 之前，执行这段代码。通常这段代码会增加循环变量。\n\
  - `statement`: 只要 `test` 为 `true`，就会重复执行这段代码。你可以通过大括号让循环包含多个语句。\n\n以下代码显示了一个简单的\
  \ `for` 循环：\n\n```\nfor (int i = 1; i <= 10; i++)\n{\n    Console.WriteLine(i);\n\
  }\n```\n\n`for` 语句的 `initialization` 部分声明了整数变量 `i` 并将其设置为 `1`。循环的 `test` 部分确定 `i`\
  \ 小于或等于 `10`。循环的 `increment` 部分将 `i` 增加 1。综合来看，`for` 语句的这些部分使得循环为 `i` = 1、`i` =\
  \ 2、`i` = 3 直到 `i` = 10 运行。对于 `i` 的每个值，程序都会执行 `Console.WriteLine` 语句。\n\n通常循环的 `initialization`\
  \ 部分初始化单个值。如果循环变量已经声明，你可以留空此部分或仅初始化变量。例如，以下代码在循环之外声明了循环变量 `i`。\n\n```c\nint i;\n\
  for (i = 1; i < 10; i++)\n{\n    Console.WriteLine(i);\n}\n```\n\n`initialization`\
  \ 部分还可以声明并初始化相同类型的多个变量，`increment` 部分可以执行逗号分隔的多个命令。例如，以下代码显示了一个使用三个循环变量 `a`、`b`\
  \ 和 `c` 的 `for` 循环。\n\n```c\nfor (int a = 0, b = 1, c = 1; a < 1000; a = b, b =\
  \ c, c = a + b)\n{\n    Console.WriteLine(\"a: \" + a);\n}\n```\n\n\n\n\n在本示例中，`initialization`\
  \ 代码声明并初始化了三个循环变量，`test` 部分使得循环只要 `a` < `1000` 就会运行，而 `increment` 部分则会更新这三个变量。\n\
  \n如果你完全省略了 `test`，循环将无限运行。在这种情况下，循环代码通常包含一个 `return` 或语句来跳出循环。例如，以下代码进入了无限循环。在每次循环中，它都会执行某些操作，然后询问用户是否继续。如果用户点击“否”，循环的\
  \ `return` 语句将程序退出包含该循环的方法。\n\n```\nfor (; ; )\n{\n    // Do something ...\n\n \
  \   if (MessageBox.Show(\"Continue?\", \"Continue?\", MessageBoxButtons.YesNo)\n\
  \        == DialogResult.No) return;\n}\n```\n\n### 非整数 for 循环\n\n通常，`for` 循环的控制变量是整数数据类型，例如\
  \ `int` 或 `long`。由于你可以在 `for` 循环的初始化和增量部分执行各种奇怪的操作，因此你并不局限于整数循环变量。例如，以下代码使用 `float`\
  \ 变量来显示值 1.0、1.5、2.0、2.5 和 3.0。\n\n```\nfor (float x = 1f; x <= 3f; x += 0.5f)\n\
  \    Console.WriteLine(x.ToString(\"0.0\"));\n```\n\n由于浮点数无法精确表示每一个可能的值，这些数据类型受到舍入误差的影响，会导致\
  \ `for` 循环中出现意外的结果。前面的代码按照你预期的方式运行，至少在我的计算机上。然而，以下代码存在问题。理想情况下，这段代码应该显示 1 到 2 之间的值，每次递增\
  \ `1/7`。但是，由于舍入误差，在循环七次后，`x` 的值约为 `1.85714316`。程序在此基础上加上 `1/7` 得到 `2.00000024`。这大于停止值\
  \ `2`，因此程序退出循环，`Console.WriteLine` 语句在 `x` = `2` 时没有执行。\n\n```\nfor (float x = 1;\
  \ x <= 2; x += 1f / 7f)\n{\n    Console.WriteLine(x);\n}\n```\n\n解决此类问题的一种方案是将循环转换为使用整数控制变量的循环。整数变量没有浮点数那样的舍入误差问题，因此你对循环中使用的值有更精确的控制。\n\
  \n以下代码的作用与之前的代码大致相同。然而，这个版本使用了整数控制变量，因此该循环按预期精确执行了八次。程序在控制台中打印的最终值是 `2`。\n\n```\n\
  float x = 1;\nfor (int i = 1; i <= 8; i++, x += 1f / 7f)\n{\n    Console.WriteLine(x);\n\
  }\n```\n\n### while 循环\n\n`while` 循环具有以下语法。\n\n```\nwhile (test)\nstatement;\n```\n\
  \n只要 `test` 结果为 `true`，循环就会执行其语句。注意，这意味着如果循环开始时 `test` 为 `false`，则循环可能一次都不会执行。\n\
  \n你不能省略 `test`，但可以将其设置为 `true` 以使 `while` 循环无限重复。如果你想在循环内部执行多个语句，请将它们包含在大括号中。通常，循环内部的代码会改变某些值，最终使\
  \ `test` 结果为 `false` 并停止循环。\n\n这是一个 `while` 循环的简单示例，假设 `values` 是一个整数数组。以下代码使用 `while`\
  \ 循环在数组中搜索值 `37`。\n\n```\nint index = 0;\nwhile ((index < values.Length) && (values[index]\
  \ != 37))\n    index++;\n```\n\n代码将变量 `index` 初始化为 `0`。然后只要 `index` 是数组中的有效索引且 `values[index]`\
  \ 项不等于 `37`，循环就会增加 `index`。（在循环结束后，如果 `index` 等于数组的长度，则未找到该值。）\n\n### do 循环\n\n\
  `do` 循环具有以下语法。\n\n```\ndo\nstatement;\nwhile (test);\n```\n\n`do` 循环与 `while` 循环类似，但它是在循环执行之后进行测试，而不是在执行之前。这意味着\
  \ `do` 循环至少执行一次。\n\n以下代码展示了之前示例的 `do` 循环版本，用于在数组中搜索值 `37`。\n\n```\nint index = -1;\n\
  do\n    index++;\nwhile ((index < values.Length) && (values[index] != 37));\n```\n\
  \n与 `while` 循环一样，如果你想在 `do` 循环中执行多个语句，应该将它们包含在大括号中。\n\n### foreach 循环\n\n`foreach`\
  \ 循环遍历集合、数组或其他支持 `foreach` 循环的容器类中的项。`foreach` 循环具有以下语法。\n\n```\nforeach (variable\
  \ in group)\nstatement;\n```\n\n在这里，`group` 是一个集合、数组或其他支持 `foreach` 的对象。与 `for`\
  \ 循环一样，循环变量必须在循环内部或之前声明。\n\n以下代码展示了一个简单的 `foreach` 循环。\n\n```\nforeach (Employee\
  \ employee in employees)\n{\n    Console.WriteLine(employee.Name);\n}\n```\n\n\n\
  \n\n# 枚举器 (Enumerators)\n\n枚举器是一个允许你遍历某种容器类所包含的对象的对象。例如，集合（collections）、数组和哈希表都提供了枚举器。本节讨论了集合的枚举器，但相同的原理也适用于这些其他类。\n\
  \n你可以使用枚举器查看集合中的对象，但不能修改集合本身。你可以使用枚举器更改集合中的对象（例如，更改它们的属性），但通常你不能使用它来添加、删除或重新排列集合中的对象。\n\
  \n初始状态下，枚举器位于集合中第一个项目之前。你的代码应该使用枚举器的 `MoveNext` 方法移动到集合中的下一个对象。如果 `MoveNext` 成功移动到新对象，则返回\
  \ `true`；如果集合中没有更多对象，则返回 `false`。\n\n`Reset` 方法将枚举器恢复到第一个对象之前的原始位置，这样你就可以再次遍历集合。\n\
  \n`Current` 方法返回枚举器当前正在读取的对象。如果枚举器当前没有读取任何对象，则调用 `Current` 会抛出异常。这通常发生在枚举器位于第一个对象之前或最后一个对象之后时。\n\
  \n下面的示例使用枚举器循环遍历名为 `employees` 的列表中的项。\n\n```\nIEnumerator<Employee> enumerator\
  \ = employees.GetEnumerator();\nwhile (enumerator.MoveNext())\n{\n    Console.WriteLine(enumerator.Current.Name);\n\
  }\n```\n\n这段代码创建了一个枚举器来遍历 `Employee` 对象。然后进入一个 `while` 循环。如果 `enumerator.MoveNext`\
  \ 返回 `true`，则枚举器已成功移动到集合中的下一个对象。只要它读取了一个对象，程序就会使用 `enumerator.Current` 获取当前对象，并在控制窗口中显示该对象的\
  \ `Name` 属性。\n\n当到达 `employees` 列表末尾时，枚举器的 `MoveNext` 方法返回 `false`，循环结束。\n\n`foreach`\
  \ 循环提供的对容器类项的访问方式与枚举器大致相同。然而，在某些情况下，枚举器提供的比 `foreach` 循环更自然的方式来遍历容器类。例如，枚举器可以跳过若干几项而不对其进行详细检查。你还可以使用枚举器的\
  \ `Reset` 方法来重新开始枚举。要重新启动 `foreach` 循环，你需要从头开始循环。\n\n`IEnumerable` 接口定义了枚举器所需的特性，因此任何实现\
  \ `IEnumerable` 接口的类都提供了枚举器。任何支持 `foreach` 的类都必须实现 `IEnumerable` 接口，因此任何支持 `foreach`\
  \ 的类也支持枚举器。实现 `IEnumerable` 的类包括以下：\n\n| `Array` | `HybridDictionary` | `SqlDataReader`\
  \ |\n| :--- | :--- | :--- |\n| `ArrayList` | `ListDictionary` | `Stack` |\n| `Collection`\
  \ | `MessageQueue` | `String` |\n| `CollectionBase` | `OdbcDataReader` | `StringCollection`\
  \ |\n| `ControlCollection` | `OleDbDataReader` | `StringDictionary` |\n| `DataView`\
  \ | `OracleDataReader` | `TableCellCollection` |\n| `DictionaryBase` | `Queue` |\
  \ `TableRowCollection` |\n| `DictionaryEntries` | `ReadOnlyCollectionBase` | `XmlNode`\
  \ |\n| `Hashtable` | `SortedList` | `XmlNodeList` |\n\n## 迭代器 (Iterators)\n\n迭代器在概念上与枚举器相似。它也提供了方法，允许你遍历某种容器对象中的项。迭代器比枚举器更专门，并且与特定的类协同工作。\n\
  \n例如，`GraphicsPath` 对象代表一系列连接的线段和曲线。`GraphicsPathIterator` 对象可以遍历 `GraphicsPath`\
  \ 对象中包含的线条和曲线数据。\n\n迭代器比枚举器专门得多。你如何使用它们取决于你需要做什么以及迭代器的类型，因此在这里不进行详细描述。\n\n## break\
  \ 语句 (break Statements)\n\n每种类型的循环都有一个正常的终止条件。例如，只要 `while` 语句中的测试为 `true`，`while`\
  \ 循环就会继续执行。当测试变为 `false` 时，循环结束。\n\n除了循环的标准结束方法外，程序还有其他方式可以离开循环。\n\n提前跳出循环的一种方法是执行\
  \ `return` 语句。程序遇到 `return` 语句时，方法会立即退出，即使这意味着出了一个或多个循环。\n\n`break` 语句会立即停止包含该语句的最内循环，并将控制传递到循环的末尾。例如，假设\
  \ `Machine` 类代表车间中的机器。以下代码在数组 `machines` 中寻找空闲的 `machine`。\n\n```\nMachine idleMachine\
  \ = null;\nforeach (Machine machine in machines)\n{\n    if (machine.IsIdle)\n \
  \   {\n        idleMachine = machine;\n        break;\n    }\n}\n\nif (idleMachine\
  \ != null)\n{\n    // 为机器分配工作。\n}\n```\n\n首先，程序声明了变量 `idleMachine` 并将其初始化为 `null`。然后它遍历\
  \ `Machines` 数组。如果在数组中找到 `IsIdle` 属性为 `true` 的对象，它会将该机器保存在变量 `idleMachine` 中并使用\
  \ `break` 语句结束循环。\n\n循环完成后，代码检查 `idleMachine` 查看是否找到了空闲机器。\n\n如果循环遇到异常且没有包含处理异常的代码，循环也可以提前结束。在这种情况下，循环结束并将控制传递给封装的\
  \ `try catch finally` 块。如果循环没有封装在 `try catch finally` 块中，控制离开执行方法并向上调用栈传递给调用它的方法。如果在该层有活跃的\
  \ `try catch finally` 块，它将处理异常。如果还没有 `try catch finally` 块，控制将继续向上调用栈传递，直到异常被处理或控制弹出栈，在这种情况下程序将崩溃。（有关\
  \ `try catch finally` 块的更多信息，请参见第 9 章异常处理”）\n\n## continue 语句 (continue Statements)\n\
  \n`continue` 语句允许程序跳过循环的剩余部分并尽早开始下一次循环。\n\n例如，假设你需要处理 `Employee` 对象集合。如果员工不是免税人员，你需要对该员工进行某些加班计算。下面的代码显示了程序如何使用\
  \ `continue` 语句来实现。\n\n```\nforeach (Employee employee in employees)\n{\n    if\
  \ (employee.IsExempt) continue;\n\n    // 处理员工。\n    ...\n}\n```\n\n在循环内部，代码检查 `Employee`\
  \ 对象的 `IsExempt` 属性。如果 `IsExempt` 为 `true`，程序使用 `continue` 语句跳过循环剩余部分并处理下一个 `Employee`。\n\
  \n 总结 (Summary)\n\n控制语句是程序的核心。决策语句决定执行哪些命令，而循环语句决定执行命令的次数。\n\n`if` 和 `switch` 语句是\
  \ C# 中最常用的决策语句。`?:` 和 `??` 是作为决策语句的较常用运算符。\n\nC# 提供了 `for`、`while`、`do` 和 `foreach`\
  \ 循环语句。某些容器类还支持枚举器，允许你遍历容器中的项。枚举器提供了更大的灵活性，有时比 `foreach` 循环更自然。\n\n\n\n\n使用本章描述的循环语句，你可以对对象集合进行复杂的搜索。例如，你可以遍历数字数组以找到它们的最大值、最小值和平均值。下一章将解释如何使用类似数据库的查询语法更方便地执行类似的操作。它将介绍你如何使用\
  \ LINQ 对从列表、集合、数组和其他数据结构提取的数据进行选择、过滤和排序。\n\n## 练习\n\n1. 假设 `person` 是一个 `Person`\
