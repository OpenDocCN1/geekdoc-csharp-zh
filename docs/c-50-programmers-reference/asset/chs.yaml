  \ `ToFileSize` 方法来格式化文件大小。\n\n```csharp\npublic static string ToFileSize(long value)\n\
  {\n    string[] suffixes = { \"bytes\", \"KB\", \"MB\", \"GB\", \"TB\", \"PB\",\
  \ \"EB\", \"ZB\", \"YB\" };\n    for (int i = 0; i < suffixes.Length; i++)\n   \
  \ {\n        if (value <= Math.Pow(1024, i + 1))\n        {\n            return\
  \ ThreeZeroDigits(value / Math.Pow(1024, i)) + \" \" +\n                suffixes[i];\n\
  \        }\n    }\n\n    return ThreeZeroDigits(value / Math.Pow(1024, suffixes.Length\
  \ - 1)) + \" \" +\n        suffixes[suffixes.Length - 1];\n}\n```\n\n这段代码找到第一个满足\
  \ `value` ≤ `1024^(i+1)` 的 `i`。它将 `value` 除以 `1024^i` 并返回前三个数字以及相应的后缀：KB、GB 等。\n\
  \n例如，假设 `value` 为 `10,000,000`。那么 `1024³` = `1,073,741,824` 大于 `10,000,000`，因此代码将\
  \ `10,000,000` 除以 `1024²` = `1,048,576` 得到 `9.54`。该方法返回 `9.54 MB`。\n\n下面的代码显示了 `ThreeZeroDigits`\
  \ 方法，它返回数值的前三个数字。\n\n```csharp\nprivate static string ThreeZeroDigits(double value)\n\
  {\n    if (value >= 100)\n    {\n        // 小数后没有数字。\n        return value.ToString(\"\
  0,0\");\n    }\n    else if (value >= 10)\n    {\n        // 小数后有一个数字。\n       \
  \ return value.ToString(\"0.0\");\n    }\n    else\n    {\n        // 小数后有两个数字。\n\
  \        return value.ToString(\"0.00\");\n    }\n}\n```\n\n如果 `value` 至少为 100，它在小数点前有三个数字。在这种情况下，方法简单返回去掉小数点后所有数字的数值。\n\
  \n如果 `value` 小于 100 但至少为 10，方法返回带有小数点后一个数字格式化后的数值。\n\n如果 `value` 小于 10，方法返回带有小数点后两个数字格式化后的数值。\n\
