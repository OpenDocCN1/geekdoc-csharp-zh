  \n\n\n感谢 Bob Elliott、Adaobi Obi Tulton、John Mueller、San Dee Phillips、Daniel Scribner\
  \ 以及所有为本书的出版付出巨大努力的人。\n\n同时也感谢技术编辑 Brian Hochgurtel 为我提供宝贵的经验支持。\n\n# 引言\n\n谈到编程，浅尝辄止是一件危险的事情。如果你读了像\
  \ *C# 5.0 All-in-One for Dummies*（Bill Sempf 等人，2013， For Dummies）或我的书籍 *Stephens’\
  \ C# Programming with Visual Studio 2010 24-Hour Trainer*（Rod Stephens, 2010, Wrox），只需几周时间，你可能就会认为自己掌握了编程的所有知识。\n\
  \n我清楚地记得完成第一门编程课时的情。我们使用的语言是 UCSD Pascal，只上了一节课后，我就很熟悉它了。我知道如何使用这种语言，如何绘制简单的图形，以及如何读写文件。我深信，只要足够努力，我可以编写任何可以想象的程序。\n\
  \n从那时以后，我有很多机会意识到自己错得有多离。我在大约十种不同的编程语言中使用过项目，每种语言都有自己的优点和特殊之处。我工作过架构优雅的系统，添加新功能是轻而易举的；我也工作过设计糟糕、超过\
  \ 50,000 行的“巨兽”，在修改其中某行代码之前，你可能需要研究一周，因为担心破坏其他所有部分。从那以后我还学习了复杂度理论，并了解到实际上有成千上万个证明为困难的（NP\
  \ 完全）程序，你无法在合理的时间解决它们。（我在我的书籍 *Essential Algorithms: A Practical Approach to Computer\
  \ Algorithms*，Rod Stephens, 2013, Wiley 中讨论了其中一些。）\n\n即使本身，C# 也是一种复杂且强大的编程语言。它包含了你在任何高级语言中预期的语言特征，如结构和类、方法、复杂的错误处理（`try`、`catch`\
  \ 和 `finally`）、分支语句（`if`-`then` 和 `switch`）、几种循环（`for`、`foreach` 和 `while`）以及退出循环的几种方式（`break`\
  \ 和 `return`）。\n\n除了语言本身的复杂性，C# 还提供了许多辅助功能，使其变得更加强大、更加复杂。这些功能允许你对数组执行类似查询的操作、使用并行处理、序列化和反序列化对象，并允许程序检查代码片段以了解它正在使用的对象。\n\
  \n最后，包含 C# 的环境也带来了其自身的复杂性。.NET Framework 包含超过 10,000 个类，让你能够访问加密、表达式匹配、与操作系统交互、网络等库。\n\
  \n本书尽可能地描述了这些复杂性。它详细解释了 C# 语言的各个组成部分。它解释了构成 C# 的语法、数据类型和控制语句。本书还描述了 .NET Framework\
  \ 中某些对于构建复杂应用程序最有用的部分。\n\n本书没有涵盖所有与 C# 相关的可能主题，但它涵盖了开发者构建复杂应用程序所需的大多数技术。\n\n## 谁应该读这本书\n\
  \n本书 intended intended 已经使用过 C# 或其他语言编程的中级和高级程序员。本书详细地描述了 C#，但叙述速度较快，并假设你已经理解了基础编程概念。如果你是初学者，仍然可以使用这本书学习\
  \ C# 编程，但会稍微困难一些。如果你遇到困难，请随时发送邮件到 RodStephens@CSharpHelper.com 联系我，我会尝试引导你回到正轨。\n\
  \n本书假设你了解编程基础的一个主要原因是：由于很难找到一个简单的顺序来深入介绍这些主题。例如，声明和使用变量是编程中最基础的概念之一。（本书在第 4 章“数据类型、变量和常量”中早期涵盖了这一点。）然而，在\
  \ C# 中，变量声明取决于它们是否在类方法内部。（在某些语言中，方法也被称为过程、子过程、例程、子例程或函数。）如果你知道什么是方法，书籍就可以深入介绍变量。如果你不熟悉方法，书籍可能只能介绍变量声明的基础，然后介绍类，最后再回到变量主题。本书假设你已经了解如什么是变量和方法之类的基础知识，因此它可以快速跳过各个主题，而不会进行大量的重复和回溯。\n\
  \n如果你对变量声明、数据类型、类和数组等基础知识很熟悉，那么你在读本书时应该不会遇到问题。索引和参考附录对于帮助你记住执行各种 C# 任务（如创建类或创建泛型方法）的语法应该特别有用。\n\
  \n如果你不知道数据类型是什么、什么是 `for` 循环，以及 `if` 语句的作用，那么你可能会在学习的过程中学到这些内容，但在掌握技巧后，你可能需要回去重新读几章。\n\
  \n## 方法\n\n程序可以通过许多方式与用户进行交互。它可以在控制台窗口中读写文本。它可以使用 Windows Forms 和控件提供更具图形化的界面。程序可以使用\
  \ Windows Presentation Foundation (WPF) 控件来构建一个比 Windows Forms 界面更丰富图形化和交互性的界面。最近，Windows\
  \ Store 程序可以使用类似于 WPF 应用中使用的控件，在 Windows 8 操作系统上运行。某些程序不为用户提供界面，而是为其他程序在后台使用提供工具和服务。\n\
  \n使用这些不同方法构建应用程序需要大量工作。你构建 WPF 应用程序的步骤与你构建控制台应用程序的步骤不同。然而，无论你构建哪种应用程序，在用户界面背后都有一系列良好的\
  \ C# 代码。无论你是构建 Windows Forms 应用程序还是 WPF 应用程序，都使用相同的语法来创建类、循环、方法和变量。同样的 C# 语言允许你构建运行在控制台窗口、Windows\
  \ 桌面、Windows 8、浏览器甚至 Windows Phone 上的应用程序。\n\n本书侧重于 C# 编程语言，而不是用户界的设计和构建。第 2 章“编写第一个程序”解释了如何从不同类型的应用程序开始，以便你可以制作应用程序测试代码，但主要重点是用户界面背后的代码。\n\
  \n本书还描述了程序可以用来与其环境交互的方法。例如，程序用于创建打印输出或操作文件的技术和类实际上并不是 C# 语言的一部分，但它们对于许多应用程序是至关重要的。\n\
  \n最后，本书描述了一些在许多应用程序中有用的高级主题。这些包括使用正则表达式匹配模式、并行编程、XML 序列化、数据库和加密。\n\n## 你应该使用哪个版本的\
  \ Visual Studio？\n\nVisual Studio 是最常编写 C# 程序的集成开发环境。由于本书关注的是 C# 语言而不是用户界面问题，你可以使用任何版本的\
  \ Visual Studio。你可以使用免费的 Express 版本，也可以使用更完整的 Professional、Premium 或 Ultimate 版本。\n\
  \n\n\n本书的示例以及可以在本书网站下载的示例是使用适用于 Windows 桌面的 `Visual Studio Express 2012` 编写的，并在\
  \ `Windows 8\\.` 中进行了测试。我选择 Windows 桌面版是因为编写桌面应用程序通常比编写 Windows Store 或 Windows\
  \ Phone 应用程序容易。我选择 2012 版本是因为许多人已经安装了该版本。在 2012 版本中编写的程序也应该能够兼容 `Visual Studio 2013`，因此你应该能够在\
  \ 2013 版本中打开它们。如果你在打开项目时遇到困难，请告诉我。\n\n你可以使用其他版本的 `Visual Studio` 来学习 C# 编程。例如，你可以使用适用于\
  \ Windows 的 `Visual Studio Express 2013`，它可以构建 Windows Store 应用程序。如果你这样做了，你在后台编写的\
  \ C# 代码与你为 Windows 桌面编写的代码相同，但构建用户界面的方法会非常不同。\n\nC# 语言和 `.NET Framework` 会随时间变化，但基础知识保持不变。这意味着书中的很大一部分内容也适用于其他版本的\
  \ C# 以及不同版本的 `Visual Studio`。例如，`C# 4.0` 和 `C# 5.0` 之间存在一些差异，但这两个版本大部分是相同的。这意味着即使你安装了旧版本的\
  \ `Visual Studio`（例如 `Visual Studio 2010`），你仍然可以使用这本书，只要你理解某些功能可能无法工作即可（`async`\
  \ 和 `await` 关键字是最大的区别）。\n\n## 本书的结构\n\n本书分为五个部分加附录。\n\n### 第一部分：C# 生态系统\n\n第 1 到\
  \ 3 章解释了 C# 程序如何融入 `Visual Studio` 环境。它们解释了 C# 代码如何转换为计算机执行的代码，以及这种转换是如何发生的。它们还解释了\
  \ C# 应用程序包含哪些文件以及这些文件的内容。\n\n第 2 章简要介绍了你如何编写可以调用 C# 代码的简单控制台、Windows Forms 和 WPF\
  \ 应用程序。其余部分专注于这些代码，大部分忽略了用户界面问题。\n\n### 第二部分：C# 语言元素\n\n第 4 至 10 章解释了 C# 语言的大部分以及支持它的对象。它们解释了数据类型（`string`、`float`\
  \ 和数组）、运算符（`+`、`*` 和 `%`）、程序控制语句（`if`、`while` 和 `for`）以及错误处理。它们还解释了如何编辑和调试 C# 代码。\n\
  \n虽然语言集成查询 (`LINQ`) 不严格属于 C# 语言的一部分，但它与语言紧密相关，因此第 8 章“LINQ”涵盖了它。该章还涵盖了并行 LINQ (`PLINQ`)，它是\
  \ LINQ 的并行版本，可以在多核系统上提供改进的性能。\n\n# 第三部分：面向对象编程\n\n第 11 至 15 章解释了使用 C# 进行面向对象编程（OOP）的基本概念。它们解释了如何定义类和继承层次、使用集合类以及构建泛型类和方法。\n\
  \n# 第四部分：环境交互\n\n第 16 至 20 章解释了应用程序如何与其环境交互。它们展示了程序如何创建打印、使用配置文件、操作文件系统以及从互联网下载信息。\n\
  \n### 第五部分：高级主题\n\n第 21 至 27 章涵盖了在许多高级应用程序中非常有用的高级主题。它们包括如文本模式识别、并行编程、使用数据库、序列化、反射以及数据的加密和解密等主题。\n\
  \n### 第六部分：附录\n\n附录 A，“习题解答”提供了每章末尾习题的解答大纲。实现许多解答的程序可以在本书网站下载。此附录展示了许多程序中有趣的部分，但为了节省空间，我省略了一些不那么有趣的细节。请从\
  \ [www.wrox.com/go/csharp5programmersref](http://www.wrox.com/go/csharp5programmersref)\
  \ 下载示例以查看所有代码。\n\n本书的其他附录提供了 C# 语言的分类参考。你可以它们来快速回顾特定命令的语法，或刷新你对特定类能做什么的记忆。书中前面的章节提供了更多背景，解释了如何执行特定任务以及为什么一种方法可能比另一种更好。附录则提供了简要总结。\n\
  \n## 如何使用本书\n\n如果你是一名高级 C# 程序员，你可能想快速浏览书的前几部分涵盖的语言基础。你可能仍然发现一些新细节，所以你可能不想完全跳过这些章节，但大多数基础语言特征与之前的\
  \ C# 版本相同。\n\n每章结束时有一组习题，你可以用它们来测试对本章涵盖内容的理解。有时习题会指向书中不适合放入的更深入的话题。即使你是高级 C# 开发人员，可能也想读一下习题以确保你没有漏掉任何内容。\n\
  \n中级程序员和 C# 经验较少的人应该更慢地阅读这些章节。第三部分“面向对象编程”中的章节涵盖了特别棘手的主题。学习继承和接口的所有变可能会相当困惑。如果你熟悉这些主题，请计划在这些章节上花费额外时间。\n\
  \n特别是如果你有其他编程语言的经验但没有 C# 经验，你应该在最初的这 10 多章上花费额外时间，因为它们为后续内容奠定了基础。如果你不会被示例中理所当然的错误处理代码所困扰，那么你跟随文件管理或正则表达式的讨论将容易得多。\n\
  \n编程是一项通过实践学习得得好的技能。如果你愿意，可以拿起书快速读一遍（好吧，考虑到它的长度，只要是你能最快速度就行），但如果你打开 `Visual Studio`\
  \ 并尝试编写自己的程序，这些信息更有可能留在脑子里。\n\n在工作过程中，你可以参考附录获取有关特定类、控件和语法的信息。例如，你可以查看附录 R，“流”，快速找到用于操作文件和目录的类。如果你需要更多信息，可以返回第\
  \ 19 章“文件系统对象”或检查在线帮助。然而，如果你只需要刷新对基本类及其方法的记忆，扫描附录 R 会更快。\n\n## 必要的设备\n\n要构建 C# 程序，你需要一份\
  \ `Visual Studio`。要下载不同版本，请访问 [www.visualstudio.com/downloads/download-visual-studio-vs](http://www.visualstudio.com/downloads/download-visual-studio-vs)。\n\
  \n要运行 `Visual Studio`，你需要一台相当现代、快速且带有大量内存的计算机。具体要求取决于你正在使用的 `Visual Studio` 版本和版本。要获取详情，请参阅你想要使用的版本的下载页面。（我使用一个双核\
  \ 64 位 1.60 GHz Intel Core i5-4200U 系统，配备 8 GB 内存和 1 TB 硬盘空间，运行 `Windows 8\\.`。它的\
  \ Windows 体验指数为 5.6，处理 `Visual Studio` 没有任何问题。）\n\n\n\n\n\nC# 5 的大部分内容与早期版本的 C#\
  \ 兼容，因此如果你在使用较旧版本的 Visual Studio，你可能可以使本书中的大多数示例在你的系统中运行。然而，你无法直接将示例程序加载到你版本的 Visual\
  \ Studio 中。你需要在 WordPad 等编辑器中打开源代码文件，并将代码的重要部分复制并粘贴到你的程序中。\n\n## 约定\n\n为了帮助你从文本中获得最大收益并跟踪后续进展，我在全书中使用了多种约定。\n\
  \n对于正文中的样式：\n\n- 重要的词汇在首次引入时会使用*斜体*标记。\n- 键盘按键操作显示如下：`Ctrl+A`。\n- 文中的文件名、URL 和代码显示如下所示：`persistence.properties`。\n\
  - 代码以以下两种不同的方式呈现：\n\n```\n我为代码示例使用使用等宽字体类型。\n我使用粗体字体来强调当前语境下特别重要的代码。\n```\n\n##\
  \ 源代码\n\n在学习本书中的示例时，你可以选择手动输入所有代码，也可以使用随书附的源代码文件。文中的许多示例仅显示了与当前主题相关的代码，可能缺少一些使示例正常运行所需的额外细节。\n\
  \n本书中使用的所有源代码均可在以下地址下载：\n\n[www.wrox.com/go/csharp5programmersref](http://www.wrox.com/go/csharp5programmersref)\n\
  \n你也可以在 [www.wrox.com](http://www.wrox.com) 搜索本书以找到代码。进入网站后，只需通过书籍标题（使用搜索框或标题列表之一）定位书籍，然后点击书籍详情页上的\
  \ `Download Code` 链接即可获取本书的所有源代码。\n\n下载代码后，只需使用你喜欢的压缩工具对其进行解压即可。或者，你可以前往 Wrox 代码下载主页\
  \ [www.wrox.com/dynamic/books/download.aspx](http://www.wrox.com/dynamic/books/download.aspx%20)\
  \ 查看此本书以及所有其他 Wrox 书籍提供的代码。\n\n## 勘误表\n\n我们尽力确保文本或代码中没有错误。然而，没有人是完美的，错误在所难免。如果你在我的某本书中发现错误（例如拼写错误或错误的代码），我将非常感谢你的反馈。通过提交勘误，你可以节省其他读者的数小时痛苦时间，同时帮助我提供更高质量的信息。\n\
  \n要找到本书的勘误表页面，请访问 [www.wrox.com](http://www.wrox.com%20) 并使用搜索框或标题列表之一定位标题。然后，在书籍详情页上点击\
  \ `Book Errata` 链接。在该页面上，你可以查看 Wrox 编辑器提交并发布的针对本书的所有勘误信息。一个包含每本书勘误链接在内的完整书籍列表也可以在\
  \ [www.wrox.com/misc-pages/booklist.shtml](http://www.wrox.com/misc-pages/booklist.shtml)\
  \ 找到。\n\n如果你在 `Book Errata` 页面上没有发现“你的”错误，请访问 [www.wrox.com/contact/techsupport.shtml](http://www.wrox.com/contact/techsupport.shtml%20)\
  \ 并填写那里的表单向我们发送你发现的错误。我们将检查这些信息，并在适当的情况下在书籍的勘误页上发布消息，并在书籍的后续版本中修复问题。\n\n## p2p.wrox.com\n\
  \n如需作者和同行讨论，请加入 [p2p.wrox.com](http://p2p.wrox.com) 的 P2P 论坛。这些论坛是一个基于 Web 的系统，让你发布与\
  \ Wrox 书籍及相关技术的消息，并与其他读者和其他技术用户互动。论坛提供了订阅功能，当论坛发布新帖子时，会将你感兴趣的主题通过电子邮件发送给你。Wrox 的作者、编辑、其他行业专家以及你的读者都活跃在论坛中。\n\
  \n在 [p2p.wrox.com](http://p2p.wrox.com)你可以找到许多不同的论坛，它们不仅可以在你阅读本书时提供帮助，也可以在你开发自己的应用程序时提供帮助。要加入论坛，请遵循以下步骤：\n\
  \n1. 访问 [p2p.wrox.com](http://p2p.wrox.com) 并点击 `Register` 链接。\n2. 阅读使用条款并点击 `Agree`。\n\
  3. 完成加入所需的填写信息，以及你想提供的任何可选信息，并点击 `Submit`。\n4. 你将收到一封邮件，其中包含有关如何验证账户和完成加入流程的信息。\n\
  \n加入后，你可以发布新消息并回复其他用户发布的消息。你可以随时在网页上阅读消息。如果你想将特定论坛的新消息通过电子邮件发送给你，请点击论坛列表中论坛名称旁边的\
  \ `Subscribe to this Forum` 图标。\n\n关于如何使用 Wrox P2P 的更多信息，请务必阅读 P2P FAQ，以获得有关论坛软件如何工作的问题解答，以及许多针对\
  \ P2P 和 Wrox 书籍的常见问题解答。要阅读 FAQ，请点击任何 P2P 页面上的 `FAQ` 链接。\n\n使用 P2P 论坛可以让其他读者从你的问题以及由此产生的任何答案中获益。我会监控我书籍的论坛，并在任何可以提供帮助时进行回复。\n\
  \n如果你有其他不想在论坛上发布的评论、建议或问题，可以通过 `RodStephens@CSharpHelper.com` 电子邮件发送给我。我无法保证解决你的所有问题，但如果可以，我会尽力提供帮助。\n\
