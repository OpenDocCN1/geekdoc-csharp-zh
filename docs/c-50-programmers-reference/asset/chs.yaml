  * “使用 C# 在 .NET 中进行 Socket 编程入门” [www.codeproject.com/Articles/10649/An-Introduction-to-Socket-Programming-in-NET-using](http://www.codeproject.com/Articles/10649/An-Introduction-to-Socket-Programming-in-NET-using)\n\
  * “网络编程示例” [msdn.microsoft.com/library/vstudio/ee890485.aspx](http://msdn.microsoft.com/library/vstudio/ee890485.aspx)\n\
  \n## 网络类\n\n.NET Framework 定义了几个包含网络类的命名空间。其中大部分以及一些最实用的类都包含在 `System.Net` 命名空间中。\n\
  \n在较低层次上，`System.Net.Sockets` 命名空间提供了操作 Windows 套接字 (Winsock) 的类。这些类允许你创建和管理套接字，从而对网络提供较低层次的访问。套接字允许你接受传入的连接请求、连接到远程主机以及发送和接收数据报。\n\
  \n`HttpListener` 类允许你创建一个响应 HTTP 请求的监听器。通过使用监听器，你可以编写一个运行在服务器上并响应其他程序传入请求的程序。\n\n\
  `WebRequest` 和 `WebResponse` 类是抽象类，定义了获取 URI 的请求/响应模型。程序使用派生自 `WebRequest` 的类来请求\
  \ URL（例如，网页）。当文件从网络返回时，程序将接收一个完成该请求的 `WebResponse` 对象（如果没有发生错误）。派生自 `WebRequest`\
  \ 的类包括 `FileWebRequest`、`FtpWebRequest` 和 `HttpWebRequest`。同样，派生自 `WebResponse`\
  \ 的类包括 `FileWebResponse`、`FtpWebResponse` 和 `HttpWebResponse`。\n\n`WebClient` 类提供了与请求/响应类相似的一些功能，但层次更高。它没有那么灵活，但用起来简单得多。\n\
  \n`System.Net.Mail` 命名空间包含了用于将电子邮件发送到简单邮件传输协议 (SMTP) 服务器的类，以便它们可以转发给收件人。\n\n后续章节将解释如何使用这些类来下载和上传信息、获取远程文件和目录的信息以及发送电子邮件。\n\
  \n## 下载信息\n\n接下来的章节将解释如何使用 `WebClient` 和 `WebRequest` 类下载数据。使用 `WebClient` 更容易，因此我建议你先尝试这种方法。`WebRequest`\
  \ 类允许你对 Cookie、请求和响应头以及其他细节进行更多控制，而这些对于简单的文件上传和下载并不重要。\n\n### 使用 WebClient 下载\n\n\
  `WebClient` 类提供了四组方法，用于将数据从 URL 下载到本地文件、`string`、`byte` 数组或流。每组包含一个同步方法和两个异步方法。接下来的章节将描述这四组方法。\n\
  \n### 下载文件\n\n`WebClient` 类的第一组方法将 URL 处的数据下载到本地文件。其方法为 `DownloadFile`、`DownloadFileAsync`\
  \ 和 `DownloadFileTaskAsync`。同步方法 `DownloadFile` 非常易用。只需创建一个新对象并调用该方法，传递你想要下载的文件\
  \ URL 以及想要存放结果的文件名。以下代码显示了一个示例。\n\n```\nWebClient client = new WebClient();\nclient.DownloadFile(\n\
  \    \"http://www.csharphelper.com/howto_index.html\",\n    \"howto_index.html\"\
  );\n```\n\n这段代码下载了网页 `http://www.csharphelper.com/howto_index.html` 并将其存储在本地文件 `howto_index.html`\
  \ 中。新文件被放在程序的当前目录（默认情况下是程序的启动目录）。\n\n`DownloadFileAsync` 方法启动异步文件下载。你可以捕获 `WebClient`\
  \ 的 `DownloadProgressChanged` 事件来监控下载进度。捕获 `DownloadFileCompleted` 事件以获取下载结果。在下载过程中，可以通过调用\
  \ `WebClient` 的 `CancelAsync` 方法来取消下载。\n\n第二个异步文件下载方法是 `DownloadFileTaskAsync`。与\
  \ `DownloadFileAsync` 类似，该方法启动一个异步下载。区别在于该方法使用单独任务来启动下载，因此你可以使用 `await` 关键字来等待方法完成文件下载。代码异步运行，并在异步任务完成后在\
  \ `await` 关键字之后恢复执行。（有关关于 `await` 的更多信息，请参阅第 6 章中的“使用 `async` 和 `await`”）\n\n###\
  \ 下载字符串\n\n`WebClient` 的第二组下载方法与第一组相似，区别是将数据下载到 `string` 而不是文件。字符串下载方法为 `DownloadString`、`DownloadStringAsync`\
  \ 和 `DownloadStringTaskAsync`。\n\n与异步下载文件一样，你可以捕获 `DownloadProgressChanged` 事件来监控下载进度，并可以使用\
  \ `CancelAsync` 方法取消下载。捕获 `DownloadStringCompleted` 事件以获取下载的字符串。\n\n本书网站上提供了 `DownloadStringAsync`\
  \ 示例程序的下载，它使用类似于下面的代码将网页作为 `string` 下载。（代码并不完全相同，因为程序包含一些用户界面代码，使程序更容易使用。）\n\n```\n\
  // WebClient.（取消操作时需要。）\nprivate WebClient Client = null;\n\n// 开始下载。\nprivate void\
  \ downloadButton_Click(object sender, EventArgs e)\n{\n    // 创建一个 Uri。\n    Uri\
  \ uri = new Uri(urlTextBox.Text);\n\n    // 开始下载。\n    Client = new WebClient();\n\
  \    Client.DownloadProgressChanged += Client_DownloadProgressChanged;\n    Client.DownloadStringCompleted\
  \ += Client_DownloadStringCompleted;\n    Client.DownloadStringAsync(uri);\n}\n\n\
  // 报告下载进度。\nprivate void Client_DownloadProgressChanged(object sender,\n    DownloadProgressChangedEventArgs\
  \ e)\n{\n    downloadProgressBar.Value = e.ProgressPercentage;\n    downloadStatusLabel.Text\
  \ = e.ProgressPercentage.ToString() + \"%\";\n}\n\n// 下载完成。\nvoid Client_DownloadStringCompleted(object\
  \ sender,\n    DownloadStringCompletedEventArgs e)\n{\n    // 查看结果是什么。\n    if (e.Error\
  \ != null)\n    {\n        MessageBox.Show(e.Error.Message);\n    }\n    else if\
  \ (e.Cancelled)\n    {\n        MessageBox.Show(\"Canceled\");\n    }\n    else\n\
  \    {\n        // 显示下载的文件。\n        MessageBox.Show(e.Result);\n    }\n\n    Client.Dispose();\n\
  }\n\n// 取消下载。\nprivate void cancelButton_Click(object sender, EventArgs e)\n{\n\
  \    // 取消。\n    Client.CancelAsync();\n}\n```\n\n\n\n\n\n`DownloadProgressChanged`\
  \ 事件处理器会更新 `ToolStripProgressBar` 和 `ToolStripStatusLabel`，以便用户了解下载进度。`e.ProgressPercentage`\
  \ 参数是一个 `int` 类型，保存已完成下载的百分比。\n\n`DownloadStringCompleted` 事件处理器会检查结果，以判断是否存在错误或下载是否被取消。如果下载成功，结果字符串将存储在\
  \ `e.Result` 参数中。\n\n如果用户在下载完成之前点击了程序的取消（Cancel）按钮，`cancelButton_Click` 事件处理器将调用\
  \ `WebClient` 的 `CancelAsync` 方法。\n\n图 20-1 显示了 DownloadStringAsync 示例程序，它显示了来自\
  \ C# Helper 网站的网页。\n\n## 下载字节数组\n\n`WebClient` 类的第三组下载方法与前两个相似，不同在于它们将数据下载到 `byte`\
  \ 数组中。它的方法是 `DownloadData`、`DownloadDataAsync` 和 `DownloadDataTaskAsync`。\n\n与之前一样，当你异步下载数据时，可以捕获\
  \ `DownloadProgressChanged` 事件来监控下载进度，并可以使用 `CancelAsync` 方法来取消下载。捕获 `DownloadDataCompleted`\
  \ 事件以获取下载的字节。\n\n![c20f001.tif](img/c20f001.png)\n\n**图 20-1：** DownloadStringAsync\
  \ 示例程序允许你下载并查看网页。\n\n## 下载流\n\n`WebClient` 类的最后一组下载方法与其他方法相似，但这些方法以流（stream）的形式下载数据这导致了一些差异。该组的方法是\
  \ `OpenRead`、`OpenReadAsync` 和 `OpenReadTaskAsync`。\n\n异步方法不会触发 `DownloadProgressChanged`\
  \ 事件，因此你无法监控下载进度，但你仍然可以使用 `CancelAsync` 方法取消下载。\n\n捕获 `OpenReadCompleted` 事件来处理流。如果下载成功，`e.Result`\
  \ 参数包含该流。\n\n## 使用 WebRequest 下载\n\n要使用 `WebRequest` 对象下载数据，请使用 `WebRequest` 类的\
  \ `Create` 方法创建一个新对象。该方法接受 URL 或 `Uri` 对象作为参数。该方法检查其参数并返回一个继承自 `WebRequest` 的类的适当对象。例如，如果\
  \ URL 字符串以 `http://` 开头，`Create` 方法将返回 `HttpWebRequest` 对象。通常，你可以忽略具体的类，只需将结果视为\
  \ `WebRequest`。\n\n创建请求对象后，设置其 `Method` 属性以指示你想要执行的操作类型。`WebRequestMethods` 命名空间定义了\
  \ `Http`、`Ftp` 和 `File` 三个类，它们提供了定义可用方法的字符串。例如，`WebRequestMethods.Http.Get` 代表使用\
  \ HTTP 协议的下载命令。\n\n下表简要总结了 HTTP 方法，这些方法最容易引起。\n\n| 方法 | 用途 |\n| :--- | :--- |\n\
  | `Connect` | 代表用于代理的 HTTP `CONNECT` 命令。 |\n| `Get` | 代表一个 HTTP `GET` 命令，用于下载资源。\
  \ |\n| `Head` | 代表一个 HTTP `HEAD` 命令。这与 `GET` 命令类似，但它只返回头信息而不是实际资源。 |\n| `MkCol`\
  \ | 代表一个 HTTP `MKCOL` 命令，创建一个新的集合（例如，页面集合）。 |\n| `Post` | 代表一个 HTTP `POST` 命令，基本上是创建一个新资源。\
  \ |\n| `Put` | 代表一个 HTTP `PUT` 命令，可以创建或更新资源。 |\n\n`Ftp` 和 `File` 方法更加自言其懂。以下列表显示了\
  \ `Ftp` 方法。\n\n* `AppendFile`\n* `DeleteFile`\n* `DownloadFile`\n* `GetDateTimeStamp`\n\
  * `GetFileSize`\n* `ListDirectory`\n* `ListDirectoryDetails`\n* `MakeDirectory`\n\
  * `PrintWorkingDirectory`\n* `RemoveDirectory`\n* `Rename`\n* `UploadFile`\n* `UploadFileWithUniqueName`\n\
  \n`WebRequestMethods.File` 类仅定义了两个方法，两者的命名都自言其懂：`DownloadFile` 和 `UploadFile`。\n\
  \n创建 `WebRequest` 对象并设置其 `Method` 属性后，调用请求的 `GetResponse` 方法来获取 `WebResponse` 对象。\n\
  \n你可以检查响应的属性以获取有关响应的信息。例如，你可以查看 `ContentLength` 和 `ContentType` 属性来了解响应的内容。`IsFromCache`\
  \ 属性指示内容是从缓存还是从原始源加载的。\n\n响应的 `GetResponseStream` 方法返回一个包含请求内容的流（如果没有出现任何问题）。现在你可以编写代码使用此流来恰当地处理内容。\n\
  \n以下列表总结了使用 `WebRequest` 的步骤。\n\n1. 使用 `WebRequest.Create` 创建请求对象。\n2. 设置请求的 `Method`\
  \ 属性。\n3. 调用请求的 `GetResponse` 方法以获取 `WebResponse`。\n4. 调用响应的 `GetResponseStream`\
  \ 方法获取响应流。\n5. 处理流。\n\nWebRequestDownloadData 示例程序可以在本书的网站下载，它使用以下代码从 `http://`\
  \ URL 下载图像文件。\n\n```\ntry\n{\n    // 创建请求。\n    WebRequest request = WebRequest.Create(urlTextBox.Text);\n\
  \n    // 使用 Get 方法下载文件。\n    request.Method = WebRequestMethods.Http.Get;\n\n  \
  \  // 获取响应。\n    WebResponse response = request.GetResponse();\n\n    // 从响应获取图像。\n\
  \    // （你必须在完成后关闭流。）\n    using (Stream stream = response.GetResponseStream())\n\
  \    {\n        Bitmap bitmap = new Bitmap(stream);\n\n        // 显示结果。\n      \
  \  imagePictureBox.Image = bitmap;\n    }\n}\ncatch (Exception ex)\n{\n    MessageBox.Show(ex.Message);\n\
  }\n```\n\n上述代码大部分都遵循基本步骤。唯一的新部分是处理流的代码。在此示例中，程序将流传递给 `Bitmap` 类的构造函数以创建下载图像的副本。然后代码将\
  \ `Bitmap` 显示在 `PictureBox` 中。\n\n图 20-2 WebRequestDownloadData 示例程序显示了从互联网下载的。\n\
  \n### 上传信息\n\n你可以使用 `WebClient` 和 `WebRequest` 类上传数据，也可以下载数据。该过程与你下载资源的步骤非常相似，只是使用的方法有所不同。接下来的章节将解释如何使用\
  \ `WebClient` 和 `WebRequest` 类上传数据。\n\n### 使用 WebClient 上传\n\n使用 `WebClient` 上传文件与使用\
  \ `WebClient` 下载文件相似。然而，一个巨大的区别是安全性。\n\n大部分互联网材料都是免费下载的，但要上传任何内容，通常都需要目标服务器的用户名和密码。在大多数情况下，你可以通过将\
  \ `WebRequest` 的 `Credentials` 属性设置为 `NetworkCredential` 对象来提供这些信息。\n\n以下代码显示了程序如何使用\
  \ `WebClient` 上传文件。\n\n```\nWebClient client = new WebClient();\nclient.Credentials\
  \ = new NetworkCredential(username, password);\nclient.UploadFile(url, filename);\n\
  ```\n\n`WebClient` 类的 `UploadFile`、`UploadData` 和 `UploadString` 方法与相应的下载方法对应。它们也有异步版本\
  \ `UploadFileAsync`、`UploadDataAsync` 和 `UploadStringAsync`。\n\n\n\n\n\n`OpenWrite`\
  \ 和 `OpenWriteAsync` 方法打开程序可以向其写入数据的流。（这些方法对应于 `OpenRead` 和 `OpenReadAsync` 方法，后者用于打开用于读取下载数据的流。）\n\
  \n`UploadValues` 和 `UploadValuesAsync` 方法发送一个名称/值集合，供服务器以某种方式对其进行处理。\n\n### 使用 WebRequest\
  \ 上传\n\n当你使用 `WebRequest` 对象下载数据时，你会从 `WebResponse` 对象获取一个流，然后处理该流中的数据。要使用 `WebRequest`\
  \ 对象上传数据，你只需获取一个流并将数据写入其中。\n\n以下列表总结了使用 `WebRequest` 上传文件的步骤：\n\n1. 使用 `WebRequest`\
  \ 对象的 `Create` 方法创建一个 `WebRequest` 对象。\n2. 设置 `WebRequest` 的 `Method` 属性，以指明你想要执行的方法。\n\
  3. 设置 `WebRequest` 的 `Credentials` 属性，以指定你想要在服务器上使用的用户名和密码。\n4. 调用 `WebRequest`\
  \ 的 `GetRequestStream` 方法来获取流。\n5. 将数据写入流中。\n\n下面的代码显示了程序如何使用 `WebRequest` 对象上传一个字节数组（**已加粗显示**）。\n\
  \n```\n// Make the WebRequest.\nWebRequest request = WebRequest.Create(url);\n\n\
  // Use the UploadFile method.\nrequest.Method = WebRequestMethods.Ftp.UploadFile;\n\
  \n// Set network credentials.\nrequest.Credentials = new NetworkCredential(username,\
  \ password);\n\n// Write the bytes into the request stream.\nusing (Stream stream\
  \ = request.GetRequestStream())\n{\n    stream.Write(bytes, 0, bytes.Length);\n\
  }\n```\n\n从这里开始，你可以通过将 `string`、图像或其他数据转换为 `byte` 数组，然后使用类似的代码上传该数组。\n\n### 获取 FTP\
  \ 信息\n\n文件传输协议 (FTP) 定义了在传输控制协议 (TCP) 网络（如互联网）上将文件从一个主机机传输到另一个主机的协议。\n\n这些传输比典型互联网用户使用的浏览器更侧重于存储。用户通常使用网络浏览器请求文件，并由浏览器显示它。FTP\
  \ 传输通常用于移动文件，例如，在你的计算机和互联网上的某个主机之间。\n\nFTP 还允许你向服务器提问关于文件相关的问题。例如，它允许你询问服务器文件的大小或目录列表。\n\
  \n除了让你上传和下载文件外，`WebRequest` 类还允许你执行 FTP 查询。这些步骤与你下载文件时的步骤相似。\n\n1. 使用 `WebRequest.Create`\
  \ 创建请求对象。\n2. 设置请求的 `Method` 属性，在本例中设置为 FTP 方法。\n3. 设置对象的 `Credentials` 属性。\n4.\
  \ 调用请求的 `GetResponse` 方法来获取 `WebResponse`。\n5. 调用响应的 `GetResponseStream` 方法来获取响应流。\n\
  6. 处理流。\n\n`FtpGetFileInfo` 示例程序可以在本书的网站上下载，它使用以下代码获取文件的长度。\n\n```\n// Use FTP to\
  \ get a remote file's size.\nprivate long FtpGetFileSize(string url, string username,\
  \ string password)\n{\n    // Make a FtpRequest object.\n    WebRequest request\
  \ = WebRequest.Create(url);\n    request.Method = WebRequestMethods.Ftp.GetFileSize;\n\
  \n    // Set network credentials.\n    request.Credentials = new NetworkCredential(username,\
  \ password);\n\n    using (WebResponse response = request.GetResponse())\n    {\n\
  \        // Return the size.\n        return response.ContentLength;\n    }\n}\n\
  ```\n\n此代码简单地遵循了前面概述的步骤。\n\n程序使用以下代码获取文件的最后修改时间。\n\n```\n// Use FTP to get a remote\
  \ file's timestamp.\nprivate DateTime FtpGetFileTimestamp(string uri, string username,\
  \ string password)\n{\n    // Get the object used to communicate with the server.\n\
  \    WebRequest request = WebRequest.Create(uri);\n    request.Method = WebRequestMethods.Ftp.GetDateTimestamp;\n\
  \n    // Get network credentials.\n    request.Credentials = new NetworkCredential(username,\
  \ password);\n\n    // Return the last modification time.\n    using (FtpWebResponse\
  \ response = (FtpWebResponse)request.GetResponse())\n    {\n        return response.LastModified;\n\
  \    }\n}\n```\n\n此代码也遵循了之前描述的步骤，但有一处不同之处。`LastModified` 属性定义在 `FtpWebResponse`\
  \ 类中，而不是 `WebResponse` 父类中。这意味着代码必须将 `GetResponse` 方法返回的通用 `WebResponse` 强制转换为其真实身份：一个\
  \ `FtpWebResponse` 对象。\n\n图 20-3 显示了 `FtpGetFileInfo` 示例程序显示有关匿名 FTP 服务器上文件信息的情况。\n\
  \n![c20f003](img/c20f003.png)\n\n其他 FTP 命令如 `DeleteFile`、`ListDirectory` 和 `ListDirectoryDetails`\
  \ 的工作方式大体相同；尽管它们返回不同的结果。20-3 `FtpGetFileInfo` 示例程序显示匿名 FTP 服务器上的文件信息。\n\n### 发送电子邮件\n\
  \n`System.Net.Mail` 命名空间包含了允许你发送电子邮件的类。该过程非常直接，但有些复杂，因为邮件可以带有许多选项：\n\n* 主题\n* 发件人名称和电子邮件\n\
  * 多个 CC 和 BCC 收件人及其电子邮件\n* 邮件正文\n* 附件\n* 不同的优先级\n* 传递通知\n* 回复地址\n\n这些功能很容易使用。只需创建一个\
  \ `MailMessage` 对象并设置其属性以提供所有必要信息。`SendEmail` 示例程序可以在本书的网站上下载，它使用 `SendEmailMessage`\
  \ 方法发送简单的电子邮件消息。\n\n```\n// Send an email.\nprivate void SendEmailMessage(string\
  \ toName, string toEmail,\n    string fromName, string fromEmail,\n    string host,\
  \ int port, bool enableSsl, string password,\n    string subject, string body)\n\
  {\n    // Make the mail message.\n    MailAddress fromAddress = new MailAddress(fromEmail,\
  \ fromName);\n    MailAddress toAddress = new MailAddress(toEmail, toName);\n  \
  \  MailMessage message = new MailMessage(fromAddress, toAddress);\n    message.Subject\
  \ = subject;\n    message.Body = body;\n\n    // Get the SMTP client.\n    SmtpClient\
  \ client = new SmtpClient()\n    {\n        Host = host,\n        Port = port,\n\
  \        EnableSsl = enableSsl,\n        UseDefaultCredentials = false,\n      \
  \  Credentials = new NetworkCredential(fromAddress.Address, password),\n    };\n\
  \n    // Send the message.\n    client.Send(message);\n}\n```\n\n该方法首先创建两个 `MailAddress`\
  \ 对象，代表发件人的名称和电子邮件，以及收件人的名称和电子邮件。然后它使用这些对象创建一个 `MailMessage` 对象，代表从发件人到收件人的电子邮件。代码通过设置\
  \ `Subject` 和 `Body` 属性来完成 `MailMessage` 的准备。\n\n接下来，代码创建一个 `SmtpClient` 对象来发送消息。它设置对象的\
  \ `Host` 和 `Port` 属性以指明处理该消息的邮件服务器。\n\n代码设置 `SmtpClient` 的 `EnableSsl` 属性以启用或禁用安全套接层\
  \ (SSL) 对连接进行加密。示例程序启用了 SSL。\n\n为了防止坏人利用你的电子邮件帐户向北美所有人发送关于尼日利亚石油的垃圾邮件，你必须使用 `NetworkCredential`\
  \ 对象登录邮件服务器。程序使用发件人的电子邮件地址和示例程序表单上输入的密码来创建此对象。输入你访问电子邮件账户的密码。\n\n\n\n\n\n最后，当 `SmtpClient`\
  \ 对象了解了关于如何发送消息的所有细节后，代码只需调用其 `Send` 方法，并传递它应该发送的 `MailMessage` 对象。\n\n## 发送短信\n\
  \n当你已经知道如何编写一个发送电子邮件的程序时，编写一个发送 SMS 短信的程序并不困难。要发送 SMS 消息，只需向格式为 `number@gateway`\
  \ 的电子邮件地址发送邮件即可，其中：\n\n*   `number` 是接收者的电话号码，不包含 `-`、`(`、`))` 或 `+` 等特殊字符。\n* \
  \  `gateway` 是接收者电话运营商使用的 SMS 电子邮件网关。\n\n例如，假设该电话号码的运营商是 Air Fire Mobile，则以下电子邮件地址将向电话号码\
  \ 1-234-567-8901 发送短信。\n\n[12345678901@sms.airfiremobile.com](http://12345678901@sms.airfiremobile.com)\n\
  \n以下网页包含了电话运营商及其 SMS 电子邮件网关的完整列表。\n\n[`github.com/cubiclesoft/email_sms_mms_gateways/blob/master/sms_mms_gateways.txt`](https://github.com/cubiclesoft/email_sms_mms_gateways/blob/master/sms_mms_gateways.txt)\n\
  \n遗憾的是，这种方法仍然需要你知道接收者的电话运营商，以便查询 SMS 网关地址。（我不知道如何仅通过电话号码自动学习运营商。如果你发现了解决方法，请通过 `RodStephens@CSharpHelper.com`\
  \ 邮件邮件给我。如果能写个程序把这些信息发给我，我会给你加分。）\n\n就像处理任何电子邮件一样，你需要包含邮件主机和端口，以及发送者的电子邮件地址和密码。消息正文和主题定义了接收者收到的内容。在我的手机上，一条典型的消息可能如下：\n\
  \n> thesender@somemailserver.com / 这是主题 / 这是消息正文。\n\n## 总结\n\n`WebClient` 类使得文件的上传和下载变得相对简单。在\
  \ `WebClient` 类无法为你提供足够控制的情况下，你可以使用 `WebRequest` 和 `WebResponse` 类通过流（streams）在网络中移动数据。\n\
  \n`SmtpClient`、`MailMessage` 和 `MailAddress` 类让你能够非常方便地发送电子邮件。通过向正确的电子邮件地址发送消息，你可以向手机发送\
  \ SMS 短信。\n\n这些类共同为与互联网等网络的交互提供了一些强大的工具。\n\n除了描述这些类，本章还定义了一系列术语和缩写。下表汇总了这些定义。\n\n\
  | 术语 | 含义 |\n| :--- | :--- |\n| datagram (数据报) | 在数据分组交换网络上发送的基本数据单元。数据报可能会乱序到达到达。\
  \ |\n| HTTP (HyperText Transfer Protocol，超文本传输协议) | 定义消息格式和传输方式的协议。它位于套接（socket）和数据报通信的更高层次。\
  \ |\n| URL (Uniform Resource Location，统一资源定位) | 指定某些资源位置的地址。你用浏览器打开的典型网络地址都是 URL。\
  \ |\n| URN (Uniform Resource Name，统一资源名称) | 标识某物的名称，但不一定指向“物理”资源位置。 |\n| ISBN (International\
  \ Standard Book Number，国际标准书号) | 标识书籍的唯一值。由于 ISBN 不能告诉你在哪里找到某本书的特定副本，因此 ISBN 是一个\
  \ URN 但不是 URL。 |\n| URI (Uniform Resource Identifier，统一资源标识符) | 包含 URL 和 URN。 |\n\
  | TCP (Transmission Control Protocol，传输控制协议) | 互联网使用的协议之一，规定了如何将数据从网络中的一个点移动到另一个点。TCP\
  \ 按正确顺序可靠地交付数据。TCP 和 IP 配合使用频繁，因此通常被称为 TCP/IP。 |\n| IP (Internet Protocol，网协议) |\
  \ 互联网使用的协议之一，规定了如何将数据从网络中的一个点移动到另一个点。IP 确保根据地址方案交付数据。TCP 和 IP 配合使用频繁，因此通常被称为 TCP/IP。\
  \ |\n| FTP (File Transfer Protocol，文件传输协议) | 定义在互联网等 TCP 网络上将文件从一个主机传输到另一个主机的协议。\
  \ |\n| SMTP (Simple Mail Transfer Protocol，简单邮件传输协议) | 一种用于在 IP 网络上传输电子邮件消息的互联网协议。\
  \ |\n| SSL (Secure Sockets Layer，安全套接层) | 加密互联网位置之间的通信，例如电子邮件客户端和电子邮件服务器之间的通信。 |\n\
  | SMS (Short Message Service，短信服务) | 一种使用标准协议向手机发送短信的服务。 |\n\n当你的程序发送电子邮件或短信时，你可能想解析地址信息以查看其是否合理。例如，你不能向地址\
  \ `this@is@a@test.com` 发送邮件，也不能向电话号码 `1-111-111` 发送短信。\n\n根据你需要识别的模式，解析值可能会困难。下一章介绍了正则表达式，这是一种你可以让此类模式识别更简单的强大工具。\n\
