  \n## 序列化\n\n### 本章内容\n\n* 序列化与反序列化\n* XML、JSON 和二进制序列化\n* 使用特性控制序列化\n\n## Wrox.com\
  \ 本章下载\n\n请注意，本章的所有代码示例都可以作为书籍网站 [www.wrox.com/go/csharp5programmersref](http://www.wrox.com/go/csharp5programmersref)\
  \ “Download Code”选项卡上本章下载的一部分。\n\n序列化是将一个或多个对象转换为序列化的、类似流的格式（通常是文本）的过程。反序列化是相反的操作：从其序列化恢复对象。\n\
  \n与上一章描述的 XML 文件一样，序列化为你提供了一种可移植的数据存储方式。你可以序列化一个对象并将序列化发送到另一个程序，然后该程序可以反序列化该对象。\n\
  \n你还可以使用序列化允许程序保存并恢复其状态。例如，一个绘图程序可能会构建包含用户绘制的对象的复杂数据结构。为了保存绘图，程序可以将数据结构的序列化内容写入文件。稍后，它可以重新加载序列化内容并显示对象。\n\
  \n序列化的对象可以是相对简单的，例如 `Customer` 或 `Person` 对象，也可以是复杂的数据结构，包括包含其他对象引用的对象。例如，你可以序列化一个\
  \ `CustomerOrder` 对象，它包含一个 `Order` 对象数组，每个订单对象又包含一个 `OrderItem` 对象的列表。\n\n对于如此复杂的内容，在\
  \ .NET 中序列化出奇地简单。\n\n本章解释了序列化。它解释了如何序列化和反序列化对象。它还解释了你可以使用的特性来控制特定类的对象如何被序列化。\n\n\
  .NET Framework 提供了三种在序列化中存储数据的选择：XML 数据、JSON 数据或二进制数据。接下来的章节将解释如何使用这三种选择之一。\n\n\
  ## XML 序列化\n\n要以 XML 格式序列化和反序列化对象，你需要使用 `XmlSerializer` 类的 `Serialize` 和 `Deserialize`\
  \ 方法。这些方法适用于具有无参数构造函数的类（无论是默认构造函数还是你创建的构造函数）。它们仅适用于公共属性和字段。所有其他属性和字段都会被忽略。\n\n\n\
  \n\n\n`Serialize` 和 `Deserialize` 方法相当易用；尽管如此，你确实需要向它们传递稍微特殊的参数。例如，你可能期望 `Serialize`\
  \ 方法简单地返回一个序列化字符串。实际上，它需要一个流、`XmlWriter` 或 `TextWriter` 参数，在其中写入序列化内容。\n\n本节解释了对象序列化和反序列化的基本过程。随后的部分描述了你可以用于更改值序列化方式的一些。\n\
  \n### 执行序列化\n\n`SerializeCustomer` 示例程序可以在本书网站下载，它演示了 XML 序列化和反序列化。在查看代码之前，这里是该程序的概述。\n\
  \n该示例使用了三个类：`Customer`、`Order` 和 `OrderItem`。程序启动时，会创建一个 `Customer` 对象，该对象包含 `Order`\
  \ 对象，而 `Order` 对象又包含 `OrderItem` 对象。然后，程序显示 `Customer` 对象的数据。它将 `Customer` 对象序列化并显示序列化结果。最后，程序反序列化\
  \ XML 数据创建一个新对象，并显示该对象的数据。\n\n图 25-1 显示了程序显示 `Customer` 对象的数据和序列化结果。如果你仔细观察，可以发现左右两个\
  \ `TextBox` 中的数据是相同的，因此程序成功成功地序列化并反序列化了 `Customer` 对象。\n\n![c25f001.tif](img/c25f001.png)\n\
  \n**图 25-1：** `SerializeCustomer` 示例程序序列化并反序列化了一个 `Customer` 对象。\n\n以下代码显示了 `OrderItem`\
  \ 类。\n\n```csharp\npublic class OrderItem\n{\n    public string Description;\n \
  \   public int Quantity;\n    public decimal UnitPrice;\n\n    public OrderItem()\
  \ { }\n    public OrderItem(string description, int quantity, decimal unitPrice)\n\
  \    {\n        Description = description;\n        Quantity = quantity;\n     \
  \   UnitPrice = unitPrice;\n    }\n}\n```\n\n该类拥有 `Description`、`Quantity` 和 `UnitPrice`\
  \ 字段；一个无参数构造函数；以及一个初始化构造函数。\n\n以下代码显示了 `Order` 类。\n\n```csharp\npublic class Order\n\
  {\n    public DateTime OrderDate;\n    public OrderItem[] OrderItems;\n\n    public\
  \ Order() { }\n    public Order(DateTime orderDate, params OrderItem[] orderItems)\n\
  \    {\n        OrderDate = orderDate;\n        OrderItems = orderItems;\n    }\n\
  }\n```\n\n该类包含一个 `OrderDate` 字段和一个 `OrderItem` 对象的数组。它还有一个无参数构造函数和一个初始化构造函数。\n\n\
  以下代码显示了 `Person` 类。\n\n```csharp\n// Customer 及其相关类。\npublic class Customer\n{\n\
  \    public string FirstName, LastName;\n    public List<Order> Orders = new List<Order>();\n\
  \n    public Customer() { }\n    public Customer(string firstName, string lastName,\
  \ params Order[] orders)\n    {\n        FirstName = firstName;\n        LastName\
  \ = lastName;\n        foreach (Order order in orders) Orders.Add(order);\n    }\n\
  }\n```\n\n该类拥有 `FirstName` 和 `LastName` 字段。它在 `List<Order>` 中持有有关订单的信息。\n\n当程序启动时，它使用以下代码创建一个\
  \ `Customer` 对象并显示其数据。\n\n```csharp\n// 创建一些 OrderItems。\nOrderItem item1 = new\
  \ OrderItem(\"Pencil\", 12, 0.25m);\nOrderItem item2 = new OrderItem(\"Notepad\"\
  , 6, 1.00m);\nOrderItem item3 = new OrderItem(\"Binder\", 1, 3.50m);\nOrderItem\
  \ item4 = new OrderItem(\"Tape\", 12, 0.75m);\n// 创建一些 Orders。\nOrder order1 = new\
  \ Order(new DateTime(2014, 4, 4), item1, item2);\nOrder order2 = new Order(new DateTime(2014,\
  \ 4, 17), item3, item4);\n\n// 创建一个 Customer。\nCustomer customer = new Customer(\"\
  Rod\", \"Stephens\", order1, order2);\n\n// 显示 Customer。\nDisplayCustomer(originalTextBox,\
  \ customer);\n```\n\n这段代码只是创建了一些对象并设置它们的字段值。然后它调用 `DisplayCustomer` 方法在 `TextBox`\
  \ 中显示 `Customer` 对象的值。这并不十分意思，所以没有在这里显示。下载示例以查看它是如何工作的。\n\n接下来，程序使用以下代码序列化 `Customer`\
  \ 对象并显示序列化结果。\n\n```csharp\n// 创建一个适用于 Customer 类的序列化器。\nXmlSerializer serializer\
  \ = new XmlSerializer(typeof(Customer));\n\n// 创建一个 TextWriter 来持有序列化结果。\nstring\
  \ serialization;\nusing (TextWriter writer = new StringWriter())\n{\n    // 序列化\
  \ Customer。\n    serializer.Serialize(writer, customer);\n    serialization = writer.ToString();\n\
  }\n\n// 显示序列化结果。\nserializationTextBox.Text = serialization;\n```\n\n代码首先创建一个 `XmlSerializer`\
  \ 对象来执行序列化（以及后的反序列化）。它向 `XmlSerializer` 构造函数传递了它将序列化的类类型。在这个示例中，`serializer` 对象只知道如何序列化和反序列化\
  \ `Customer` 对象。\n\n序列化器只能序列化到流、`XmlWriter` 和 `TextWriter`，因此此示例创建了一个 `TextWriter`\
  \ 来持有序列化结果。它调用序列化器的 `Serialize` 方法，并传递要序列化的 `Customer` 对象。程序将序列化结果保存在字符串中，并在 `TextBox`\
  \ 中显示该字符串。\n\n以下代码显示了程序如何反序列化序列化结果。\n\n```csharp\n// 创建一个用于读取序列化的流。\nusing (TextReader\
  \ reader = new StringReader(serialization))\n{\n    // 反序列化。\n    Customer newCustomer\
  \ = (Customer)serializer.Deserialize(reader);\n\n    // 显示反序列化结果。\n    DisplayCustomer(deserializedTextBox,\
  \ newCustomer);\n}\n```\n\n反序列化器只能从流、`XmlReader` 和 `TextReader` 反序列化，因此程序创建了一个读取器从序列化字符串中读取。\n\
  \n程序随后调用 `Deserialize` 方法并将读取器传递给它。`Deserialize` 方法返回一个不特定的 `object`，因此程序将其强制转换为\
  \ `Customer` 对象。\n\n程序通过显示反序列化后的对象结束。\n\n以下代码显示了对象的序列化结果。\n\n```xml\n<?xml version=\"\
  1.0\" encoding=\"utf-16\"?>\n<Customer xmlns:xsi=\"http://www.w3.org/2001/XMLSchema-instance\"\
  \n          xmlns:xsd=\"http://www.w3.org/2001/XMLSchema\">\n  <FirstName>Rod</FirstName>\n\
  \  <LastName>Stephens</LastName>\n  <Orders>\n    <Order>\n      <OrderDate>2014-04-04T00:00:00</OrderDate>\n\
  \      <OrderItems>\n        <OrderItem>\n          <Description>Pencil</Description>\n\
  \          <Quantity>12</Quantity>\n          <UnitPrice>0.25</UnitPrice>\n    \
  \    </OrderItem>\n        <OrderItem>\n          <Description>Notepad</Description>\n\
  \          <Quantity>6</Quantity>\n          <UnitPrice>1.00</UnitPrice>\n     \
  \   </OrderItem>\n      </OrderItems>\n    </Order>\n    <Order>\n      <OrderDate>2014-04-17T00:00:00</OrderDate>\n\
  \      <OrderItems>\n        <OrderItem>\n          <Description>Binder</Description>\n\
  \          <Quantity>1</Quantity>\n          <UnitPrice>3.50</UnitPrice>\n     \
  \   </OrderItem>\n        <OrderItem>\n          <Description>Tape</Description>\n\
  \          <Quantity>12</Quantity>\n          <UnitPrice>0.75</UnitPrice>\n    \
  \    </OrderItem>\n      </OrderItems>\n    </Order>\n  </Orders>\n</Customer>\n\
  ```\n\n如果你观察序列化结果，它在直觉上非常合理。`Customer` 元素代表一个 `Customer` 对象。它包含 `FirstName` 和 `LastName`\
  \ 元素以持有它的简单数据值。`Orders` 元素持有一个 `Order` 元素的序列，代表 `Customer` 对象的 `List<Order>`。\n\n\
  每个 `Order` 元素持有包含程序 `Order` 对象信息的元素。`OrderItems` 元素持有一个 `OrderItem` 对象的序列，代表一个 `OrderItem`\
  \ 对象的 `OrderItems` 数组。\n\n\n\n\n\n前一节显示的序列化方法简单且相当直直觉，但有时你可能希望更改对象的序列化方式。\n\n例如，之前的序列化虽然易理解，但非常冗长。也许你更愿意存储这些数据：\n\
  \n```\n<OrderItem>\n  <Description>Tape</Description>\n  <Quantity>12</Quantity>\n\
  \  <UnitPrice>0.75</UnitPrice>\n</OrderItem>\n```\n\n像这样：\n\n```\n<OrderItem Description=\"\
  Tape\" Quantity=\"12\" UnitPrice=\"0.75\" />\n```\n\n结果更加简洁，并且可能更易读。\n\n另一个例子是，假设你的程序保存了客户的订单数据，并且你想在另一个程序中使用这些数据。遗憾的是，另一个程序将\
  \ `Customer` 对象的订单信息存储在一个名为 `CustomerOrders` 的 `Order[]` 中，而不是一个名为 `Orders` 的 `List<Order>`\
  \ 中。\n\n此时，你可能会意识到可以使用 XSLT 将你的序列化结果转换为另一个程序可以反序列化的格式。这确实可行（并且可以让你进行其他后续技术无法实现的转换），但这将会是额外的工作，并需要额外的处理步骤。\n\
  \n幸运的是，`System.Xml.Serialization` 命名空间定义了一些属性，你可以使用它们对序列化过程进行某些控制。你将这些属性添加到想要序列化的类或类的属性和字段上。它们可以指示某个值在序列化时应作为属性存储而不是元素。它们还可以更改序列化中值的名称，或者指示某个值应该被完全忽略。\n\
  \n例如，考虑以下 `Customer`、`Order` 和 `OrderItem` 类的各个版本。在这里，我删除了构造函数（与之前的版本相同）以节省空间。属性已**加粗**显示。\n\
  \n```\npublic class Customer\n{\n    [XmlAttribute]\n    public string FirstName,\
  \ LastName;\n    [XmlArray(\"CustomerOrders\")]\n    public List<Order> Orders =\
  \ new List<Order>();\n}\n\npublic class Order\n{\n    [XmlIgnore]\n    public DateTime\
  \ OrderDate;\n    [XmlArray(\"Items\")]\n    public OrderItem[] OrderItems;\n}\n\
  \npublic class OrderItem\n{\n    [XmlAttribute]\n    public string Description;\n\
  \    [XmlAttribute]\n    public int Quantity;\n    [XmlAttribute(\"PriceEach\")]\n\
  \    public decimal UnitPrice;\n}\n```\n\n在 `Customer` 类中，`XmlAttribute` 属性指示 `FirstName`\
  \ 和 `LastName` 字段应序列化为 XML 属性而不是元素。`XmlArray` 属性指示 `Customer` 类的 `Orders` 列表在序列化中应命名为\
  \ `CustomerOrders`。（列表和数组的序列化方式相同，因此 `XmlArray` 属性不会改变序列化方式，只是更改名称。）\n\n在 `Order`\
  \ 类中，`XmlIgnore` 属性指示 `OrderDate` 字段不被序列化。`XmlArray` 属性使 `OrderItems` 数组以 `Items`\
  \ 名称序列化。\n\n在 `OrderItem` 类中，三个 `XmlAttribute` 属性指示三个字段都应作为 XML 属性存储，且 `UnitPrice`\
  \ 字段在序列化中应存储为 `PriceEach`。\n\n`SerializeCustomerWithAttributes` 示例程序与 `SerializeCustomer`\
  \ 程序相同，只是使用了 `Customer`、`Order` 和 `OrderItem` 类的新定义。以下代码显示了生成的 XML 序列化结果。\n\n```\n\
  <?xml version=\"1.0\" encoding=\"utf-16\"?>\n<Customer xmlns:xsi=\"http://www.w3.org/2001/XMLSchema-instance\"\
  \n          xmlns:xsd=\"http://www.w3.org/2001/XMLSchema\"\n          FirstName=\"\
  Rod\" LastName=\"Stephens\">\n  <CustomerOrders>\n    <Order>\n      <Items>\n \
  \       <OrderItem Description=\"Pencil\" Quantity=\"12\" PriceEach=\"0.25\" />\n\
  \        <OrderItem Description=\"Notepad\" Quantity=\"6\" PriceEach=\"1.00\" />\n\
  \      </Items>\n    </Order>\n    <Order>\n      <Items>\n        <OrderItem Description=\"\
  Binder\" Quantity=\"1\" PriceEach=\"3.50\" />\n        <OrderItem Description=\"\
  Tape\" Quantity=\"12\" PriceEach=\"0.75\" />\n      </Items>\n    </Order>\n  </CustomerOrders>\n\
  </Customer>\n```\n\n这仍然相当直观，并且比之前的版本更简洁。\n\n下表列出了用于控制序列化的最有用属性。（实现这些属性的类都以 `Attribute`\
  \ 结尾。例如，`XmlArray` 属性由 `XmlArrayAttribute` 类实现。如果你想在线查找其中任何属性，请使用它们的完整类名。）\n\n|\
  \ Attribute | 目的 |\n| :--- | :--- |\n| `XmlArray` | 更改数组或列表序列化时的名称。 |\n| `XmlArrayItem`\
  \ | 指示可以于数组的类型。例如，假设 `People` 数组包含 `Person` 对象，其中某些对象可能来自 `Author` 子类。那么你将使用两次 `XmlArrayItem`\
  \ 来指示该数组可能包含 `Person` 和 `Author` 对象。 |\n| `XmlAttribute` | 将字段序列化为属性而不是元素。可选设置属性的名称。\
  \ |\n| `XmlElement` | 特别指示字段将作为序列化为 XML 元素。此属性允许你更改 XML 元素的名称。 |\n| `XmlEnum` |\
  \ 允许指定枚举序列化的名称。例如，假设枚举 `MealSize` 定义了 `Small`、`Medium` 和 `Large`。 |\n| `XmlIgnore`\
  \ | 在序列化时忽略字段。 |\n| `XmlRoot` | 控制根元素生成的名称和命名空间。例如，在 `Customer` 类前放置 `[XmlRoot(\"\
  Client\")]` 属性将使根名为 `Client`。这不会影响不是根元素的 `Customer` 对象。 |\n| `XmlText` | 使序列化器将值存储为\
  \ XML 文本。对象可以有一个文本值。（序列化器无法在对象的标签之间放置多个文本值。） |\n| `XmlType` | 控制类生成的元素名称和命名空间。例如，如果在\
  \ `OrderItem` 类前放置 `[XmlType(\"Item\")]` 属性，则所有 `OrderItem` 对象都将序列化为 `Item` 元素。\
  \ |\n\n`DataContractSerializer` 类也可以使用 XML 来序列化和反序列化对象。该过程与下一节描述的 `DataJsonSerializer`\
  \ 类类似。\n\n## JSON 序列化\n\n与 XML 类似，JSON（JavaScript 对象表示）是一种数据存储语言。JSON 比 XML 更为简单且通常更简洁。\n\
  \nJSON 数据主要由 `name:value` 对组成，其中名称是文本，值可以是以下数据类型之一：\n\n*   数字\n*   \n*   布尔值\n*\
  \   数组（由逗号分隔并封装在括号 `[ ]` 中的值序列）\n*   对象（由逗号分隔的 `key:value` 集合，整个集合由大括号 `{}` 包围）\n\
  *   `null`\n\n以下代码显示了一个包含两个 `Order` 对象的 `Customer`  JSON 表示；每个 `Order` 对象持有两个 `OrderItem`\
  \ 对象。\n\n```json\n{\n  \"FirstName\":\"Rod\",\n  \"LastName\":\"Stephens\",\n  \"\
  Orders\":\n  [\n    {\n      \"OrderDate\":\"\\/Date(1396591200000-0600)\\/\",\n\
  \      \"OrderItems\":\n        [\n          {\"Description\":\"Pencil\",\"Quantity\"\
  :12,\"UnitPrice\":0.25},\n          {\"Description\":\"Notepad\",\"Quantity\":6,\"\
  UnitPrice\":1.00}\n        ]\n    },\n    {\n      \"OrderDate\":\"\\/Date(1397714400000-0600)\\\
  /\",\n      \"OrderItems\":\n      [\n        {\"Description\":\"Binder\",\"Quantity\"\
  :1,\"UnitPrice\":3.50},\n        {\"Description\":\"Tape\",\"Quantity\":12,\"UnitPrice\"\
  :0.75}\n      ]\n    }\n  ]\n}\n```\n\n\n\n\n\n与 XML 序列化一样，你可以使用特性来控制 `DataContractJsonSerializer`\
  \ 类如何序列化类。接下来的部分将解释基本的 JSON 序列化和反序列化过程。随后的部分描述了你可以用于控制序列化的特性。\n\n### 执行序列化\n\n`DataContractJsonSerializer`\
  \ 类使用 JSON 格式对对象进行序列化和反序列化。该类的 `WriteObject` 方法序列化对象，其 `ReadObject` 方法反序列化对象。\n\n\
  `SerializeCustomerJson` 程序可以在本书的网站下载，它使用以下代码以 JSON 格式序列化和反序列化 `Customer` 对象。\n\n\
  ```\n// 创建一个与 Customer 类工作的序列器。\nDataContractJsonSerializer serializer =\n    new\
  \ DataContractJsonSerializer(typeof(Customer)); \n\n// 创建一个流来存储序列化结果。\nusing (MemoryStream\
  \ stream = new MemoryStream())\n{\n    // 序列化 Customer。\n    serializer.WriteObject(stream,\
  \ customer);\n\n    // 将流转换为字符串。\n    stream.Seek(0, SeekOrigin.Begin);\n    string\
  \ serialization;\n    using (StreamReader reader = new StreamReader(stream))\n \
  \   {\n        serialization = reader.ReadToEnd();\n\n        // 显示序列化结果。\n    \
  \    serializationTextBox.Text = serialization;\n\n        // 从流反序列化。\n        stream.Position\
  \ = 0;\n        Customer newCustomer = (Customer)serializer.ReadObject(stream);\n\
  \n        // 显示反序列化结果。\n        DisplayCustomer(deserializedTextBox, newCustomer);\n\
  \    }\n}\n```\n\n代码首先创建了一个 `DataContractJsonSerializer` 对象。\n\n该对象可以将序列化内容写入流、`XmlDictionaryWriter`\
  \ 或 `XmlWriter`。此示例创建了一个 `MemoryStream` 来存储序列化结果。然后代码调用序列器的 `WriteObject` 方法将 `Customer`\
  \ 对象的序列化内容写入流中。\n\n为了获取作为 `string` 格式的序列化结果，程序回溯流并创建一个与该流关联的 `StreamReader`。它使用该对象的\
  \ `ReadToEnd` 方法从流中获取文本，并将序列化结果显示在 `TextBox` 中。\n\n要反序列化 `Customer` 对象，程序使用了同一个\
  \ `MemoryStream`（因为其中已经包含了序列化内容）。代码回溯流并使用序列器的 `ReadObject` 方法从序列化内容中读取 `Customer`\
  \ 对象。\n\n代码最后调用 `DisplayCustomer` 方法（此处未显示）来显示对象的数据。\n\n## 控制序列化\n\n你可以使用特性来控制 JSON\
  \ 序列化，就像使用特性控制 XML 序列化一样。然而，JSON 是一种更简单的格式，因此可用的特性较少。例如，JSON 不允许你将值存储为元素属性（如 `<Customer\
  \ FirstName=\"Zaphod\">`），因此没有对应的这种特性。\n\n如果你不给类提供任何特性，序列器会尝试序列化它所有的公共属性和方法。\n\n\
  你可以使用 `XmlSerializable` 特性来显式地将类标记为可序列化的。如果你这样做了，序列器仍然尝试序列化它所有的公共属性和方法。\n\n在这两种情况下，当你不给类提供任何特性或给它提供\
  \ `XmlSerializable` 特性时，你可以给字段添加 `IgnoreDataMember` 特性，以指示该字段不被序列化。\n\n除了使用 `XmlSerializable`\
  \ 特性外，你还可以通过给类添加 `DataContract` 特性将其标记为可序列化。该特性的属性允许你更改在序列化中表示类的名称。\n\n如果你给类添加了\
  \ `DataContract` 特性，序列器的默认行为就会发生变化。序列器不再序列化所有未标记为 `IgnoreDataMember` 的公共字段和属性，而是只序列化标记了\
  \ `DataMember` 特性的公共字段和属性。`DataMember` 特性还允许你更改成员的名称或设置它包含在对象序列化中的顺序。\n\n以下代码显示了一个带有某些序列化控制特性的\
  \ `OrderItem` 类。\n\n```\n[DataContract(Name = \"Item\")]\npublic class OrderItem\n\
  {\n    [DataMember]\n    public string Description;\n\n    [DataMember]\n    public\
  \ int Quantity;\n\n    [DataMember(Name = \"PriceEach\")]\n    public decimal UnitPrice;\n\
  }\n```\n\n`DataContract` 特性表示该类是可序列化的，任何没有 `DataMember` 特性的字段或属性都将被忽略。它还让序列器在将 `OrderItem`\
  \ 写入序列化内容时使用 `Item` 作为名称。\n\n前两个 `DataMember` 特性表示 `Description` 和 `Quantity` 字段应该包含在序列化中。\n\
  \n最后一个 `DataMember` 特性表示 `PriceEach` 字段应该包含在序列化中，并且在序列化中应被称为 `PriceEach`。\n\n##\
  \ 二进制序列化\n\nXML 和 JSON 序列器非常易于使用，并能产生相当直观的结果。然而，它们有几个缺点。例如，它们无法序列化图像某些数据类型（练习 4\
  \ 解释了解决此问题的方法）。它们还无法序列化包含循环的数据结构。\n\n例如，假设你构建了一个组织模型，其中 `Department` 对象代表公司的部门，`Employee`\
  \ 对象代表员工。`Department` 类有一个 `Employees` 属性，其类型为 `List<Employee>`，包含了指向该部门员工的引用。`Employee`\
  \ 类有一个 `Department` 属性，指向该员工工作的部门的引用。\n\nXML 和 JSON 序列器无法序列化这种结构，因为 `Department`\
  \ 对象包含了对 `Employee` 对象的引用，而 `Employee` 对象又有对 `Department` 对象的引用。这些引用形成了一个循环，序列器不知道如何处理循环。\n\
  \n`BinaryFormatter` 类可以序列化和反序列化数据，并能处理图像和循环。\n\n`SerializeDepartment` 程序可以在本书的网站下载，它演示了\
  \ `BinaryFormatter`。它使用了以下 `Department` 和 `Employee` 类（省略了构造函数）。\n\n```\n[Serializable]\n\
  public class Department\n{\n    public Image Logo;\n    public string Name;\n  \
  \  public List<Employee> Employees = new List<Employee>();\n}\n\n[Serializable]\n\
  public class Employee\n{\n    public string Name;\n    public Department Department;\n\
  }\n```\n\n`BinaryFormatter` 只能与装饰有 `Serializable` 特性的类一起工作。\n\n示例程序使用以下代码序列化和反序列化\
  \ `Department` 对象。\n\n```\n// 创建一个 BinaryFormatter。\nIFormatter formatter = new\
  \ BinaryFormatter();\n\n// 创建一个流来存储序列化结果。\nusing (MemoryStream stream = new MemoryStream())\n\
  {\n    // 序列化。\n    formatter.Serialize(stream, department);\n\n    // 显示序列化结果的文本表示。\n\
  \    byte[] bytes = stream.ToArray();\n    string serialization = BitConverter.ToString(bytes).Replace(\"\
  -\", \" \");\n\n    // 显示序列化结果。\n    serializationTextBox.Text = serialization;\n\
  \n    // 反序列化。\n    stream.Seek(0, SeekOrigin.Begin);\n    Department newDepartment\
  \ = (Department)formatter.Deserialize(stream);\n\n    // 显示新 Department 的数据。\n \
  \   deserializedPictureBox.Image = newDepartment.Logo;\n    deserializedTextBox.Text\
  \ = DisplayDepartment(newDepartment);\n}\n```\n\n\n\n\n接下来，代码将序列化流转换为 `byte` 数组。它将该数组转换为字符串，显示序列化的十六进制内容，并在\
  \ `TextBox` 中显示结果。\n\n要反序列化该序列化内容，代码会将 `MemoryStream` 回退到起始位置，然后调用格式化器的 `Deserialize`\
  \ 方法。代码最后显示重构的 `Department` 对象的图标和员工数据。（`DisplayDepartment` 方法非常直观，且与序列化无关，因此在此处未显示。请下载示例以查看其工作原理。）\n\
  \n## 总结\n\n本章解释了你可以用于数据序列化和反序列化的技术。它解释了你如何使用 `XmlSerializer` 类来使用 XML 序列化，使用 `DataContractJsonSerializer`\
  \ 类使用 JSON 序列化，以及使用 `BinaryFormatter` 类进行二进制序列化。\n\n二进制序列化的缺点是你无法轻松地读取它们来查看其包含的内容。它们的优点是可以包含图像等其他序列化方式无法包含的数据类型。它们还可以序列化包含循环引用的数据。\n\
  \n你可以使用特性（attributes）来影响对象在 XML 和 JSON 序列化中的存储方式，但大部分过程是自动的。序列化器使用反射（reflection）来确定类中包含哪些数据。下一章将解释如何在程序中使用反射来获取有关类包含的属性、方法和事件的信息。\n\
