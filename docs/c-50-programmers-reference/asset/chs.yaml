  \n## 自定义流类\n\n.NET Framework 还提供了其他几个具有更专门用途的流类。\n\n`CryptoStream` 类对通过它的数据应用加密转换。例如，如果你将\
  \ `CryptoStream` 附加到文件，`CryptoStream` 可以在读取或写入文件时自动对数据进行加密或解密。（第 27 章，“加密学”部分对加密有更多介绍。）\n\
  \n`NetworkStream` 类表示基于网络连接的套接字流。你可以使用此类让不同的应用程序通过网络进行通信。有关关于类的类的更多信息，请参阅 [msdn.microsoft.com/library/system.net.sockets.networkstream.aspx](http://msdn.microsoft.com/library/system.net.sockets.networkstream.aspx)。\n\
  \n三个特殊的流代表程序的标准输入、标准输出和标准错误。控制台应用程序定义了这些流，用于在控制台上读写信息。应用程序还可以通过访问 `Console` 类的 `In`、`Out`\
  \ 和 `Error` 属性直接与这些流交互。程序可以通过调用 `Console` 类的 `SetIn`、`SetOut` 和 `SetError` 方法将这些流更改新的流对象（如\
  \ `StreamReader` 和 `StreamWriter`）。例如，程序可以将错误流重定向到文件。有关这些流的更多信息，请参阅 [msdn.microsoft.com/library/system.console.aspx](http://msdn.microsoft.com/library/system.console.aspx)。\n\
  \n## 总结\n\n流允许程序以统一的方式处理各种数据源。对于通用的方法（如加密算法或数据压缩程序）很有用，但在实践中，你通常希望使用专门的类来处理特定数据。例如，`StringReader`\
  \ 和 `StringWriter` 类读写字符串，而 `StreamReader` 和 `StreamWriter` 类读写流（通常是文件）。`File` 类的\
  \ `Exists`、`OpenText`、`CreateText` 和 `AppendText` 方法对于处理相关的 `StreamReader` 和 `StreamWriter`\
  \ 对象特别有用。\n\n流类允许程序与文件交互。下一章将介绍其他用于与文件系统交互的类。这些类允许程序检查、重命名、移动和删除文件及目录。\n\n## 练习\n\
