  3. 数据库的往返操作相对昂贵，特别是当数据库位于网络另一端时，因此最好一次性获取或保存所有所需的数据。这意味着使用数据适配器加载和保存更改到 `DataSet`s\
  \ 中，在通信成本方面是相当高效的。\n\n然而，如果数据库有多个并发用户，这种方法可能会导致问题。例如，假设两个用户启动程序并编辑同一条记录。后点击“保存”的用户将覆盖第一个用户所所的更改，导致第一个用户的更改丢失。\n\
  \n你可以尝试通过锁定记录来避免这个问题，从而让两个用户无法同时编辑它。如果你使用 ADO.NET 一时获取一条记录，这种效果很好，但如果你使用数据适配器加载整个表，效果则不佳。如果一个用户加载并锁定了整个表，另一个用户将无法进行任何操作。\n\
  \n如果数据库非常大，数据适配器还会产生问题。如果 `Students` 表包含数千条记录，程序加载的数据可能远超其需求。\n\n通常情况下，如果表不是太大，且只有一个用户或多个不会尝试编辑相同记录的用户，则使用数据适配器加载整个表的效果良好。对于非常大的表或可能频繁冲突的用户，通常最好分更有限的块获取数据。\n\
