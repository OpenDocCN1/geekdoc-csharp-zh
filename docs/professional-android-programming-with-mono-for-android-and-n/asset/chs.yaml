  ## 使用 REST 的 Web 服务\n\nREST（表述状态转移）是一种用于分布式系统的通用架构，例如万维网。REST 架构由客户端和服务器组成。服务器处理来自客户端的请求。客户端向服务器发送请求。从概念上讲，这些请求就是网络浏览器（客户端）的工作方式。\n\
  \n基于 REST 的 Web 服务运行在 HTTP 之上，实现了比 SOAP 更具可读性（且简单）的接口。使用 REST 不需要代理或其他让 SOAP 变得有些复杂的因素。\n\
  \n基于 REST 的 Web 服务通常具有以下三个特征：\n\n*   资源的可访问性。部分数据可以通过 URL 获取。\n*   数据通过不同的 HTTP\
  \ 动词发送，例如 `GET`、`POST`、`PUT` 和 `DELETE`。动词通常用法如下：\n    *   在 `GET` 操作中，输入数据通过 URL\
  \ 发。\n    *   在 `POST` 操作中，输入数据在请求体中发送。`POST` 用于添加/插入数据。\n    *   在 `PUT` 操作中，输入数据在请求体中发送。`PUT`\
  \ 用于更新数据。\n    *   在 `DELETE` 操作中，所有数据在请求体中发送。`DELETE` 用于删除数据。\n\n![note](img/note.gif)某些纯主义者可能会对此有异，但使用不同的\
  \ HTTP 动词执行 REST 风格的操作可能有充分的理由。此外，某些操作系统和设备不支持所有的 HTTP 动词。这里的示例使用了 `GET` 和 `POST`\
  \ 动词进行操作。\n\n***\n\n*   数据可以用各种格式编码发送，例如文本、`XML`、`JSON` 和任何其他有效数据类型。正式上，这被称为 MIME\
  \ 类型。\n\n## 使用 JavaScript 对象表示 (JSON)\n\n大多数开发者熟悉可扩展标记语言 (XML)，它用于数据交换。JSON 是一种类似的技术；它是基于\
  \ JavaScript 脚本语言的数据交换格式。JSON 格式使用了一系列大多数使用 C 家族语言的程序员熟悉的约定。JSON 构建在两个概念之上：\n\n\
  *   数据作为一系列键值对进行传输。值可以是单个值，也可以是一系列值（例如数组）。\n*   数据存储在可以被视为序列的结构中。\n\n由于这些概念被广泛接受，它们几乎适用于所有现代编程语言。结果是，几乎所有的编程语言都支持\
  \ JSON。在 .NET 中，微软在 2007 年发布的 ASP.NET 2 AJAX 库中引入了对 JSON 的支持。得益于 `System.Json`、`WCF`、流行的\
  \ `JSON.NET` 库以及其他各种库，现在程序员在 .NET 中有多种 JSON 选择。\n\n这是一个 JSON 数据包示例：\n\n```\n\"ld\"\
  :{\n      \"UserName\":\"tiger\",\n      \"PassWord\":\"scott\",\n      \"AppKey\"\
  :\"blah\"\n },\n \"TwitterId\":\"wbm\",\n \"PageIndex\":\"1\"\n```\n\n此示例包含三个参数：\n\
  \n*   `ld`：该对象包含三个属性：\n    *   `UserName` 的值为 `tiger`。\n    *   `PassWord` 的值为 `scott`。\n\
  \    *   `AppKey` 的值为 `blah`。\n*   `TwitterId`：该属性的值为 `wbm`。\n*   `PageIndex`：`PageIndex`\
  \ 属性的值为 `1`。\n\n现在，看一个调用基于 REST 服务的简短示例（参见代码列表 5.11）。该服务设置为接受 JSON 和 JSON 响应。此代码发送了一个复杂的请求以返回用户\
  \ Twitter 的朋友的时间线。该请求设置为异步请求。由于密码跨网络传输，应建立安全连接，并通过 `post` 发送数据。\n\n\n\n\n```csharp\n\
  void btnRESTJSON_Click(object sender, EventArgs e)\n{\n    string Url =\n      \"\
  http://www.twtmstr.com/webservices/remoteapi.svc/GetUserTimeLine\";\n      string\
