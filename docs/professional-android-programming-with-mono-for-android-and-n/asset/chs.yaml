  - `SupportedPreviewSizes`\n- `SupportedFocusModes`\n- `SupportedPreviewFrameRates`\n\
  - `SupportedFlashModes`\n- `SupportedPreviewFormats`\n- `SupportedColorEffects`\n\
  - `SupportedPictureSizes`\n- `SupportedAntibanding`\n\n可以在 `Camera.Properties` 对象上设置以下属性：|\n\
  \n- `Antibanding`\n- `MaxZoom`\n- `ColorEffect`\n- `MinExposureCompensation`\n-\
  \ `ExposureCompensation`\n- `PictureFormat`\n- `ExposureCompensationStep`\n- `PictureSize`\n\
  - `FlashMode`\n- `PreviewFormat`\n- `FocalLength`\n- `PreviewFrameRate`\n- `FocusMode`\n\
  - `PreviewSize`\n- `HorizontalViewAngle`\n- `SceneMode`\n- `JpegQuality`\n- `VerticalViewAngle`\n\
  - `JpegThumbnailQuality`\n- `WhiteBalance`\n- `JpegThumbnailSize`\n- `Zoom`\n- `MaxExposureCompensation`\n\
  - `ZoomRatios`\n\n注意的是，在调用带有更新属性对象的 `Camera.SetProperties` 之前，任何设置都不会生效。\n\n`Camera`\
  \ 对象还支持许多接口回调，以便在相机运行期间通知事件：\n\n- `Camera.IAutoFocusCallback`\n- `Camera.IPictureCallback`\n\
  - `Camera.IErrorCallback`\n- `Camera.IPreviewCallback`\n- `Camera.IOnZoomChangeListener`\n\
  - `Camera.IShutterCallback`\n\n接下来的两个部分将介绍如何使用回调来监控自动对焦和图像预览。\n\n### 监控自动对焦\n\n\
  监控相机的自动对焦非常简单。你在相应的 Activity 中实现 `IAutoFocusCallback` 接口即可接收自动对焦通知。下面的代码展示了如何实现：\n\
  \n![download](img/download.gif)\n\n```\n [Activity(Label = \"SimpleCamera\", MainLauncher\
  \ = true)]\n    public class SimpleCameraActivity : Activity,\n        Android.Hardware.Camera.IAutoFocusCallback,\n\
  \            Android.Hardware.Camera.IPictureCallback,\n            Android.Hardware.Camera.IPreviewCallback,\n\
  \            Android.Hardware.Camera.IShutterCallback,\n            ISurfaceHolderCallback\n\
  \    {\n        Android.Hardware.Camera camera;\n            String PICTURE_FILENAME\
  \ = \"picture.jpg\";\n\n        protected override void OnCreate(Bundle bundle)\n\
  \        {\n            base.OnCreate(bundle);\n\n            // 从 \"main\" 布局资源设置我们的视图\n\
  \            SetContentView(Resource.Layout.Main);\n\n            SurfaceView surface\
  \ = (SurfaceView)FindViewById(Resource.Id.Surface);\n            var holder = surface.Holder;\n\
  \            holder.AddCallback(this);\n            holder.SetType(Android.Views.SurfaceType.PushBuffers);\n\
  \            holder.SetFixedSize(300, 200);\n\n            // 从布局资源获取我们的按钮，\n  \
  \          // 并为其附加一个事件\n            Button button = FindViewById<Button>(Resource.Id.MyButton);\n\
  \            button.Click += delegate\n            {\n                Android.Hardware.Camera.Parameters\
  \ p = camera.GetParameters();\n                p.PictureFormat = (int)Format.Jpeg;\n\
  \                camera.SetParameters(p);\n                camera.TakePicture(this,this,this);\n\
  \            };\n\n        }\n\n        public void OnAutoFocus(bool focused, Android.Hardware.Camera\
  \ camera)\n        {\n            if (focused)\n            {\n                Toast.MakeText(this,\
  \ \"Focused\", ToastLength.Short);\n            }\n        }\n```\n\n此代码段的代码位于 `SimpleCamera`\
  \ 文件夹中。\n\n在此代码中，`SimpleCameraActivity` 实现了 `IAutoFocusCallback` 接口。相机打开后，会调用 `OnAutoFocus`。值得注意的是，如果设备上的相机没有自动对焦功能，调用\
  \ `OnAutoFocus` 时 `focused` 参数将设置为 `true`。\n\n### 使用相机预览\n\n使用相机预览是一个相当复杂的过程。在预览期间，一系列帧会被发送到回调函数。为了使其作用，它们需要像视频一样显示在表面上。因此，继续本章上一节使用的简单相机项目，你在主布局中添加一个表面视图：\n\
  \n![download](img/download.gif)\n\n```\n<SurfaceView\n    android:id=\"@+id/Surface\"\
  \n    android:layout_width=\"wrap_content\"\n    android:layout_height=\"wrap_content\"\
  \n    android:layout_gravity=\"center\" />\n```\n\n然后，你确保 `SimpleCameraActivity`\
  \ 同时实现了 `Camera.IPreviewCallback` 和 `ISurfaceHolderCallback`：\n\n```\npublic class\
  \ SimpleCameraActivity : Activity, Camera.IAutoFocusCallback,\n Camera.IPictureCallback,\
  \ Camera.IPreviewCallback, ISurfaceHolderCallback\n```\n\n接下来，在 `OnCreate` 函数中获取并初始化你添加到布局中的\
  \ `SurfaceView` 对象：\n\n``` SurfaceView surface = (SurfaceView)FindViewById(Resource.Id.Surface);\n\
  \            var holder = surface.Holder;\n            holder.AddCallback(this);\n\
  \            holder.SetType(Android.Views.SurfaceType.PushBuffers);\n          \
  \  holder.SetFixedSize(300, 200);\n```\n\n最后，实现了两个接口都所需的函数：\n\n```\n public void\
  \ SurfaceCreated(ISurfaceHolder holder)\n        {\n            try\n          \
  \  {\n                camera = Android.Hardware.Camera.Open();\n               \
  \ Android.Hardware.Camera.Parameters p = camera.GetParameters();\n             \
  \   p.PictureFormat = (int)Format.Jpeg;\n                camera.SetParameters(p);\n\
  \                camera.AutoFocus(this);\n                camera.SetPreviewCallback(this);\n\
  \                camera.Lock();\n                camera.SetPreviewDisplay(holder);\n\
  \                camera.StartPreview();\n            }\n            catch (IOException\
  \ e)\n            {\n                Android.Util.Log.Debug(\"SIMPLECAMERA\", e.Message);\n\
  \            }\n        }\n\n        public void SurfaceDestroyed(ISurfaceHolder\
  \ holder)\n        {\n            camera.Unlock();\n            camera.StopPreview();\n\
  \            camera.Release();\n        }\n\n        public void SurfaceChanged(ISurfaceHolder\
  \ holder, int i, int j, int k) { }\n\n        public void OnPreviewFrame(byte[]\
  \ data, Android.Hardware.Camera camera)\n        {\n            //TODO: Display\
  \ preview\n        }\n```\n\n本节代码段的代码位于 `SimpleCamera` 文件夹中。\n\n现在，一旦表面被创建，相机就会打开，预览帧将绑定到表面上。在每个预览帧上，都会调用\
  \ `OnPreviewFrame`。当表面销毁时，相机停止预览并释放相机资源。\n\n### 拍摄照片\n\n为了捕捉拍摄的照片，你需要实现 `IPictureCallback`\
  \ 接口：\n\n![download](img/download.gif)\n\n\n\n\n\n```java\n public void OnPictureTaken(byte[]\
  \ data, Android.Hardware.Camera camera)\n        {\n            // Save the image\
  \ JPEG data to the SD card\n            FileOutputStream outStream = null;\n   \
  \         File dataDir = Android.OS.Environment.ExternalStorageDirectory;\n\n  \
  \          if (data!=null)\n            {\n         try\n         {\n          \
  \   outStream = new FileOutputStream(dataDir + \"/\" + PICTURE_FILENAME);\n    \
  \         outStream.Write(data);\n             outStream.Close();\n         }\n\
  \         catch (FileNotFoundException e)\n         {\n             Android.Util.Log.Debug(\"\
  SIMPLECAMERA\", e.Message);\n         }\n         catch (IOException e)\n      \
  \   {\n             Android.Util.Log.Debug(\"SIMPLECAMERA\", e.Message);\n     \
  \    }\n\n             File file = new File(dataDir + \"/\" + PICTURE_FILENAME);\n\
  \             try {\n\n                    ExifInterface exif = new ExifInterface(file.CanonicalPath);\n\
  \                    // Read the camera model and location attributes\n        \
  \            exif.GetAttribute(ExifInterface.TagModel);\n                    float[]\
  \ latLng = new float[2];\n                    exif.GetLatLong(latLng);\n       \
  \             // Set the camera make\n                    exif.SetAttribute(ExifInterface.TagMake,\
  \ \"My Phone\");\n                    exif.SetAttribute(ExifInterface.TagDatetime,\
  \    \n                        System.DateTime.Now.ToString());\n              \
  \  }\n                catch (IOException e) {\n\n                    Android.Util.Log.Debug(\"\
  SIMPLECAMERA\", e.Message);\n                }\n            }\n            else\n\
  \            {\n                Toast.MakeText(this, \"No Image Captured\", ToastLength.Long);\n\
  \            }\n        }\n```\n\n此代码段的代码位于 `SimpleCamera` 文件夹中。\n\n此代码段包含 `OnPictureTaken`\
  \ 函数，该函数由 `IPictureCallback` 定义。当拍摄照片时，该函数会被调用，并将图像数据写入写入存储器。数据的格式由 `CameraProperties`\
  \ 对象中的 `ImageFormat` 属性控制。\n\n### 读取和写入 JPEG Exif 值\n\n现在你正在从相机拍摄图像，那么你如何向图像本身添加信息（例如照片的时间或位置）呢？如果图像是\
  \ JPEG 格式，则有一个接口可以精确执行此操作。\n\n`ExifInterface` 允许你更改 JPEG 图像上的 exif（可交换图像文件格式）数据。你可以设置多个元数据标签；完整列表请参阅文档。以下代码段展示了如何设置日期并获取拍摄照片的位置：\n\
  \n![download](img/download.gif)\n\n```java\nFile file = new File(dataDir + \"/\"\
  \ + PICTURE_FILENAME);\ntry {\n\n    ExifInterface exif = new ExifInterface(file.CanonicalPath);\n\
  \    // 读取相机型号和位置属性\n    exif.GetAttribute(ExifInterface.TagModel);\n    float[]\
  \ latLng = new float[2];\n    exif.GetLatLong(latLng);\n    // 设置相机品牌\n    exif.SetAttribute(ExifInterface.TagMake,\
  \ \"My Phone\");\n    exif.SetAttribute(ExifInterface.TagDatetime, System.DateTime.Now.ToString());\n\
  }\ncatch (IOException e) {\n\n    Android.Util.Log.Debug(\"SIMPLECAMERA\", e.Message)\n\
  }\n```\n\n在这个示例中，你通过 `ExifInterface` 能够了对相机生成的 JPEG 图像添加标签的能力。虽然此示例仅使用了 `TagMake`\
  \ 和 `TagDatetime`，但你可以尝试其他可用标签，例如经纬度标签。\n\n# 向媒体存储库添加新媒体\n\n本节将检查媒体库（media store）并查看如何向其中添加新内容。媒体库为设备内部和外部存储器上的所有可用媒体提供元数据。默认情况下，你的应用程序创建的任何媒体对其他应用程序都是不可访问的，因此将你的媒体放入存储库使其变为可用是一个好主意。\n\
  \n有两种方法可以将数据放入媒体库。第一种是让媒体扫描器自动分析你的文件并将其添加。另一种方法是手动向适当的内容提供（content provider）添加记录。\n\
  \n## 使用媒体扫描器\n\n媒体扫描器会扫描你的文件以确定其 MIME 类型并将其添加到媒体库。然而，你并不直接使用媒体扫描器；而是使用 `MediaScannerConnection`\
  \ 类获取其连接。\n\n以下代码段展示了如何通过调用 `Connect` 打开 `MediaScannerConnection`。然后通过调用 `ScanFile`\
  \ 对文件进行扫描。最后，扫描完成后，通过 `Disconnect` 关闭连接。\n\n![note](img/note.gif)对 `MediaScannerConnection`\
  \ 的调用都是异步的。因此，活动实现了 `IMediaScannerConnectionClient` 接口，以便在连接建立和扫描完成时进行通知。\n\n![download](img/download.gif)\n\
  \n```java\n[Activity(Label = \"MediaStoreExamples\", MainLauncher = true)]\npublic\
  \ class MediaStoreActivity : Activity,\n MediaScannerConnection.IMediaScannerConnectionClient\n\
  {\n    MediaScannerConnection msc;\n\n    protected override void OnCreate(Bundle\
  \ bundle)\n    {\n        base.OnCreate(bundle);\n\n        // 从“main”布局资源设置我们的视图\n\
  \        SetContentView(Resource.Layout.Main);\n        msc = new MediaScannerConnection(this,\
  \ this);\n\n        // 从布局资源获取我们的按钮，\n        // 并为其附加一个事件\n        Button button\
  \ = FindViewById<Button>(Resource.Id.ScanButton);\n        button.Click += delegate\
  \ {\n            msc.Connect();\n        };\n    }\n\n    public void OnMediaScannerConnected()\n\
  \    {\n        msc.ScanFile(Android.OS.Environment.ExternalStorageDirectory + \n\
  \            \"/outputfile.mp4\", null);\n    }\n    public void OnScanCompleted(string\
  \ path, Android.Net.Uri uri)\n    {\n        msc.Disconnect();\n    }\n}\n```\n\n\
  此代码段的代码位于 `MediaStoreExamples` 文件夹中。\n\n# 向存储添加新媒体\n\n如果你想添加更多元数据，或者不想依赖媒体扫描器，你可以自己将内容添加到适当的内容提供者中。\n\
  \n以下代码段来自 `MediaStoreExamples` 下载，展示了如何“手动”向存储添加媒体。\n\n```java\n Button addButton\
  \ = FindViewById<Button>(Resource.Id.AddButton);\n        addButton.Click += delegate\n\
  \        {\n            ContentValues values = new ContentValues();\n          \
  \  values.Put(MediaStore.MediaColumns.Title, \"Hiking Notes\");\n            values.Put(MediaStore.MediaColumns.Data,\
  \ \n                Android.OS.Environment.ExternalStorageDirectory + \n       \
  \             \"/outputfile.mp4\");\n            values.Put(MediaStore.Audio.Media.ContentType,\
  \ \"audio/amr\");\n\n            ContentResolver resolver = this.ContentResolver;\n\
  \            Android.Net.Uri uri = \n                resolver.Insert(MediaStore.Audio.Media.ExternalContentUri,\
  \ values);\n\n            this.SendBroadcast(new Intent(Intent.ActionMediaScannerScanFile,\
  \ uri));\n        };\n```\n\n在这里我们看到 `ContentValues` 对象被填充了与即将添加的 `mp4` 文件相关的数据。然后获取内容解析器并将值插入解析器中。最后，发送一个广播，通知任何潜在的接收者新添加的文件。\n\
  \n# 语音识别\n\n本节涵盖了如何将语音识别集成到应用程序中。自 Android 1.5（API 级别 3）以来，Android 就支持语音输入和语音识别。`RecognizerIntent`\
  \ 类提供了实现这一切的 API。在从语音识别系统获取输入之前，你需要启动一个新的活动来处理结果：\n\n![download](img/download.gif)\n\
  \n\n\n\n\n```cs\nint VOICE_RECOGNITION = 0;\n\nprotected override void OnCreate(Bundle\
  \ bundle)\n{\n    base.OnCreate(bundle);\n\n    // 从 \"main\" 布局资源设置我们的视图\n    SetContentView(Resource.Layout.Main);\n\
  \n    // 从布局资源获取我们的按钮，\n    // 并为其绑定一个事件\n    Button button = FindViewById<Button>(Resource.Id.MyButton);\n\
  \n    button.Click += new EventHandler(button_Click);\n}\n\nvoid button_Click(object\
  \ sender, EventArgs e)\n{\n    Intent intent = new Intent(RecognizerIntent.ActionRecognizeSpeech);\n\
  \n    // 指定自由格式输入\n    intent.PutExtra(RecognizerIntent.ExtraLanguageModel,\n  \
  \                  RecognizerIntent.LanguageModelFreeForm);\n    intent.PutExtra(RecognizerIntent.ExtraPrompt,\n\
  \                    \"查看一些酷酷的东西\");\n    intent.PutExtra(RecognizerIntent.ExtraMaxResults,\
  \ 1);\n    intent.PutExtra(RecognizerIntent.ExtraLanguage, Locale.English);\n\n\
  \    StartActivityForResult(intent, VOICE_RECOGNITION);\n}\n\nProtected override\
  \ void OnActivityResult (int requestCode, int resultCode,\n    Intent data) {\n\n\
  \    if (requestCode == VOICE_RECOGNITION)\n    {\n        if (resultCode == Result.Ok)\
  \ {\n\n            Toast.MakeText(this, data.Extras.ToString(), ToastLength.Long).Show();\n\
  \        }\n    }\n}\n```\n\n此代码段的代码位于 `SimpleVoiceRecognition` 文件夹中。\n\n除了创建类型为\
  \ `RecognizerIntent.ActionRecognizeSpeech` 的新 intent 之外，还向该 intent 添加了许多额外参数（extras）。\n\
  \n- `ExtraLanguage` 指定识别的语言区域。然而，识别引擎仅在部分语言区域上工作。\n- `ExtraMaxResults` 限制识别引擎返回的响应结果数量。\n\
  - `ExtraPrompt` 在语音提示屏幕上显示一些额外的文本。\n- `ExtraLanguageModel` 告诉识别引擎使用什么模型来解析口出的文本。目前有两种模型：一种是自由格式的（我们在这里使用的），另一种是用于网络搜索的。\n\
  \n# 总结\n\n在本章中，你学习了 Android 手机的多媒体特性以及如何控制多媒体系统。我们涵盖了如何播放音频和视频。我们展示了如何将音频作为原始资源的一部分封装在应用程序中。我们看到了如何使用\
  \ `SurfaceView` 和自定义视频表面来播放视频。\n\n我们还查看了录制音频和视频。首先，我们使用 intents 启动内置录制应用程序。然后我们研究了如何使用媒体录制器（media\
  \ recorder）来实现相同的目标。此外，我们查看了相机以及如何控制它。首先我们使用 intents 启动内置相机结果。然后我们看了如何使用 `Camera`\
  \ 对象直接控制相机硬件。在此过程中，我们查看了如何使用 `ExifInterface` 类检查或修改使用相机拍摄的 JPEG 图像上的 exif 数据。\n\n\
  还涵盖了如何使用媒体扫描程序或直接添加信息将你的应用程序创建的任何媒体添加到媒体库中。\n\n最后，我们简要查看了如何将语音识别作为应用程序的输入。\n\n在你的应用程序中包含多媒体通常能让它更有质感。超越简单的键盘输入并包含语音识别，或为笔记应用开启图片功能，将有助于为你的应用添异彩。希望本章能帮助你看到虚拟键盘之外的世界。\n\
  \n# 第 10 章\n\n# 与其他应用程序和库交互\n\n## 本章内容\n\n- 允许 Mono for Android 使用 intents 与其他应用程序通信\n\
  - 让你的应用程序与其他第三方应用程序集成\n- 访问 Android 通讯录\n\n本章讨论了你可以如何使用 Mono for Android 与 Android\
  \ 设备上的其他应用程序通信，包括设备内置的和从 Android 应用程序商店下载的。它还描述了如何访问设备联系人并插入和编辑联系人，而无需重建通用 UI。\n\
  \n与设备上的任何应用程序建立接口的秘密在于 `Intent` 方法。当你传递一个 `Intent` 以及一个 `Type` 或 `URI` 对象以便让方法知道如何处理该\
  \ intent 时，该方法会处理何时以及打开什么。当调用该方法时，应用会按正常方式挂起，并根据 传递的信息执行适当的操作。\n\n# Android 应用程序集成\n\
  \n本节向你如何将 Android 内置应用程序集成到你自己的应用程序中。\n\n## 打开浏览器\n\n在原生浏览器中打开网页是一个很好的起点。你关闭应用并打开浏览器的最可能的原因是你想要显示一个网站。用户可以使用设备的“返回”键返回到你的应用程序。与本节中的大多数示例一样，你可以通过启动一个新活动的\
  \ intent 来使用此功能。以下代码显示了一个网站：\n\n```csharp\nvar intent = new Intent(Intent.ActionView);\n\
  intent.SetData(Android.Net.Uri.Parse(\"http://wrox.com\"));\nStartActivity(intent);\n\
  ```\n\n![note](img/note.gif)你可以从本书的网站 [www.wrox.com](http://www.wrox.com) 下载本章的相关代码。`Chapter10Examples`\
  \ 项目包含了本章中的所有代码段，可以在本章代码下载的 `Chapter10Examples\\Chapter10Examples.sln` 找到。\n\n第一行实例化了一个新的\
  \ `Intent` 对象。你可以看到传递给构造函数的类型是 `View`。这基本上意味着显示为 intent 设置的任何数据。第二行设置了数据值。`data`\
  \ 属性的类型为 `Android.Net.Uri`。\n\n`Intent` 构造函数有一个重载，可以使用它传递 `Android.Net.Uri`，而无需手动设置数据。这使得代码如下：\n\
  \n```csharp\nvar intent = new Intent(Intent.ActionView,\n                      \
  \         Android.Net.Uri.Parse(\"http://wrox.com\"));\n```\n\n当这段代码运行时，你会发现你运行的应用程序已关闭。你被到了\
  \ Wrox 网站，如图 10.1 所示。\n\n图 10.1\n\n![10.1](img/c10f01.jpg)\n\n你可以通过使用 `Android.Webkit.WebView`\
  \ 类在你的应用程序中直接包含网站，而无需关闭应用。这样做，你可以在现有的布局中添加 `WebView` 标签。为了使示例更清晰，我们创建了一个名为 `WebActivity`\
  \ 的新活动来处理 `WebView` 代码，并使用了名为 `WebView` 的新布局。列表 10.1 显示了新的布局 `WebView.axml`。\n\n\
  ![download](img/download.gif) 列表 10.1: WebView.axml 的布局\n\n```xml\n<?xml version=\"\
  1.0\" encoding=\"utf-8\"?>\n\n<LinearLayout\n   xmlns:android=\"http://schemas.android.com/apk/res/android\"\
  \n   android:orientation=\"vertical\"\n   android:layout_width=\"fill_parent\"\n\
  \   android:layout_height=\"fill_parent\"\n   >\n\n   <WebView\n      android:id=\"\
  @+id/webView\"\n      android:layout_width=\"fill_parent\"\n      android:layout_height=\"\
  fill_parent\"\n   />\n\n</LinearLayout>\n```\n\n此代码包含 `Chapter10Examples\\Chapter10Examples\\\
  Resources\\layout\\WebView.xaml` 中。\n\n\n\n\n\n从这里开始，你可以将 `WebActivity.cs` 中的 `WebView`\
  \ 钩起到加载新的 URL。当你告诉 `WebView` 加载 URL 时，发生的情况之一是它会创建一个新的 `intent` 来执行此操作。由于你希望你的应用程序处理该\
  \ `WebView`，你需要实现一个 `WebViewClient` 来处理 `ShouldOverrideUrlLoading` 方法，通过重写其功能来阻止这种默认行为。当此事件触发时，你可以为视图运行相同的\
  \ `LoadUrl` 方法并返回 `true`，表示你已经自己处理了 `UrlLoading`。\n\n当 `WebView` 显示且你点击导航到不同页面时，当你点击返回按钮，`WebView`\
  \ 会消失并返回到上一个 `intent`。你可以重写 activity 中的 `OnKeyDown` 方法，并检查按下的按钮是否确实是返回键，以及 `WebView`\
  \ 是否可以返回到之前的页面。列表 10.2 显示了 `WebActivity` 的完整代码。\n\n![download](img/download.gif)\
  \ 列表 10.2: 处理 WebView 的 Activity\n\n```\n[Activity(Label = \"Web Activity\")]\n\
  public class WebActivity : Activity\n{\n\n   private WebView webView;\n\n   protected\
  \ override void OnCreate(Bundle bundle)\n   {\n\n      base.OnCreate(bundle);\n\n\
  \      // 从“main”布局资源设置我们的视图\n      SetContentView(Resource.Layout.WebView);\n\n\
  \      webView = FindViewById<WebView>(Resource.Id.webView);\n      webView.SetWebViewClient(new\
  \ MyWebViewClient());\n      webView.LoadUrl(\"http://www.wrox.com\");\n\n   }\n\
  \n   public override bool OnKeyDown(Keycode keyCode, KeyEvent e)\n   {\n\n     \
  \ if (keyCode == Keycode.Back && webView.CanGoBack())\n      {\n         webView.GoBack();\n\
  \         return true;\n      }\n      return base.OnKeyDown(keyCode, e);\n\n  \
  \ }\n\n   public class MyWebViewClient : WebViewClient\n   {\n\n      public override\
  \ bool ShouldOverrideUrlLoading(WebView view, string url)\n      {\n\n         view.LoadUrl(url);\n\
  \         return true;\n\n      }\n   }\n}\n```\n\n此代码包含在 `Chapter10Examples\\Chapter10Examples\\\
  WebActivity.cs` 中。\n\n## 打开电子邮件\n\n打开电子邮件的工作与你预期的非常相似；你使用 `mailto:` 协议。\n\n```\n\
  var intent = new Intent(Intent.ActionView,\n       Android.Net.Uri.Parse(\"mailto:chris@example.com\"\
  ));\nStartActivity(intent);\n```\n\n![note](img/warning.gif) 模拟器默认没有配置任何电子邮件账户。这导致在你使用此\
  \ intent 启动 activity 时，会显示“不支持的操作（Unsupported action），该操作目前不支持（That action is currently\
  \ not supported）”的回退消息。要测试此方法，你可以在模拟器中设置电子邮件账户。这让你能够继续测试基于电子邮件的活动。\n\n正如 `mailto:`\
  \ 协议所述，你还可以传入 `bcc`、`cc`、`subject` 和 `body` 命令。这会填充标准邮件模板中的必要字段。Android SDK 通常会忽略用于\
  \ `mailto:` 协议的 `from` 命令，因此它将不起作用。这里是使用额外命令的示例：\n\n```\nvar intent = new Intent(Intent.ActionView,\n\
  \     Android.Net.Uri.Parse(\"mailto:chris@example.com?cc=other@example.com\n  \
  \                          &subject=Wrox&body=Mono for Android \"));\nStartActivity(intent);\n\
  ```\n\n与浏览器示例一样，应用程序再次关闭，并显示电子邮件撰写消息框，如图图 10.2 所示。\n\n图 10.2\n\n![10.2](img/c10f002.jpg)\n\
  \n## 拨电话\n\n使用 `tel:` 协议，你可以通过下面的 `Intent` 示例使用 Android 设备的内置电话功能。此示例显示了数字中的连字符。如果你不输入任何连字符，Android\
  \ 设备在解析 URI 时会自动添加它们。\n\n```\nvar intent = new Intent(Intent.ActionDial,\n     \
  \                   Android.Net.Uri.Parse(\"tel:1-408-867-5309\"));\nStartActivity(intent);\n\
  ```\n\n通过使用这种方法，你只会提示用户拨打号码，如图图 10.3 所示。如果你愿意，可以将 intent action 设置为 `Intent.ActionCall`，它将立即拨打输入的号码。这随后将如图图\
  \ 10.4 所示显示给用户。\n\n```\nvar intent = new Intent(Intent.ActionCall,\n           \
  \             Android.Net.Uri.Parse(\"tel:1-408-867-5309\"));\nStartActivity(intent);\n\
  ```\n\n图 10.3\n\n![10.3](img/c10f002.jpg)\n\n图 10.4\n\n![10.4](img/c10.jpg)\n\n\
  由于这可能会导致用户产生通话费用，应用程序必须通过 `CALL_PHONE` 权限请求执行此任务。请确保你的应用程序已经在 `AndroidManifest.xml`\
  \ 中添加了以下内容：\n\n```\n<uses-permission android:name=\"android.permission.CALL_PHONE\"\
  \ />\n```\n\n## 发送短信/SMS\n\n`sms:` 协议允许你打开一条短信（SMS）消息。再次，你可以使用新的 intent 并传入你想发送的号码：\n\
  \n```\nvar intent = new Intent(Intent.ActionView,\n       Android.Net.Uri.Parse(\"\
  mailto:chris@example.com\"));\n```\n\n尽管 `sms:` 协议建议使用 `body` 传入文本，但 Android 并不使用它，而是使用\
  \ `sms_body` 来传递消息。图 10.5 在 intent 使用后显示消息。\n\n```\nvar intent = new Intent(Intent.ActionView,\n\
  \       Android.Net.Uri.Parse(\"sms:1-408-867-5309\"));\nintent.PutExtra(\"sms_body\"\
  , \"Message Body\");\nStartActivity(intent);\n```\n\n图 10.5\n\n![10.5](img/c10.jpg)\n\
  \n虽然你可以允许用户显式发送短信，但 Android 平台允许你从应用程序直接发送短信。这让你能够构建定制短信应用程序。\n\n要通过代码发送短信，你可以使用\
  \ `SMSManager` 类，它提供了发送短信/文本的有用方法。列表 10.3 显示了创建 `PendingIntent` 以在短信发送时获取事件的代码，以及启动发送短信的代码。名为\
  \ `SentSMS` 的 pending intent 需要被创建为广播接收器，因此列表 10.4 设置了该接收器。\n\n![download](img/download.gif)\
  \ 列表 10.3: 代码发送短信\n\n```\nPendingIntent sentPendingIntent = PendingIntent.GetBroadcast(this,\
  \ 300, new\n  Intent(this, typeof(SentSms)), 0);\n\nvar smsManager = SmsManager.Default;\n\
  \nsmsManager.SendTextMessage(\"ATelephoneNumber\", null, \"This is an automated\n\
  \  SMS\", sentPendingIntent, null);\n```\n\n![download](img/download.gif) 列表 10.4:\
  \ 创建 SentSMS 广播接收器\n\n\n\n\n\n```\n[BroadcastReceiver]\npublic class SentSms : BroadcastReceiver\n\
  {\n   public override void OnReceive (Context context, Intent intent)\n   {\n  \
  \    if(this.ResultCode == (int) Result.Ok)\n      {\n         Android.Util.Log.Debug(\"\
  Mono for Android\",\"Result OK\");\n      }\n      else if (this.ResultCode == (int)\
  \ SmsResultError.GenericFailure)\n      {\n         Android.Util.Log.Debug(\"Mono\
  \ for Android\", \"Generic Failure\");\n      }\n      else if (this.ResultCode\
  \ == (int) SmsResultError.NoService)\n      {\n         Android.Util.Log.Debug(\"\
  Mono for Android\", \"No Service\");\n      }\n      else if (this.ResultCode ==\
  \ (int) SmsResultError.NullPdu)\n      {\n         Android.Util.Log.Debug(\"Mono\
  \ for Android\", \"Null Pdu\");\n      }\n      else if (this.ResultCode == (int)\
  \ SmsResultError.RadioOff)\n      {\n         Android.Util.Log.Debug(\"Mono for\
  \ Android\", \"Radio Off\");\n      }\n   }\n}\n```\n\n这段代码包含在 `Chapter10Examples\\\
  Chapter10Examples\\Activity1.cs` 中\n\n![note](img/note.gif)通过程序发送短信需要显式权限，因为这可能会给运行应用程序的用户带来额外费用。要允许该权限，请确保在\
  \ `AndroidManifest.xml` 文件中添加以下行：<uses-permission android:name=”android.permission.SEND_SMS”/>：\n\
  \n***\n\n## 在地图应用程序中打开位置\n\n要从原生 Android 应用程序内部加载地图应用程序，你只需使用指向 Google Maps 的普通网页链接即可。在创建\
  \ Google Maps URL 时，你可以可以使用查询字符串参数，例如 `q` 用于搜索查询，`saddr` 和 `daddr` 分别用于源地址和目的地址。此示例加载了英国曼彻斯特的地图：\n\
  \n```\nvar intent = new Intent(Intent.ActionView,\n      Android.Net.Uri.Parse(\"\
  http://maps.google.com/maps?q=Manchester,UK\"));\nStartActivity(intent);\n```\n\n\
  如果你在带有 Google API 附加组件的模拟器上运行此代码，你将收到提示，可以在浏览器或地图应用程序中打开地图，如图 10.6 所示。这在安装了 Google\
  \ Maps 应用程序的设备上也是相同的。\n\n图 10.6\n\n![10.6](img/c10f006.jpg)\n\n在不关闭应用程序的情况下在自己的应用程序中使用地图的功能也可以通过\
  \ Google APIs 及其中的 Maps API 实现。你将在第 13 章学习如何使用它。\n\n## 打开 YouTube 视频\n\n正如你之前看到的地图示例所示，你只需使用普通\
  \ URL 来打开地图应用程序；当你想要播放 YouTube 视频时，这一原理是相同的。可以使用以下示例代码中的两个 YouTube URL 之一。你需要使用视频标识符来播放视频。以下代码段中的变量\
  \ `youTubeUrl` 是将打开 YouTube 视频的 URL 类型示例。与 Google Maps 示例一样，在模拟器中，链接会打开浏览器并播放视频，而在设备上它会打开\
  \ YouTube 应用程序。当然，必须安装 Google YouTube 应用程序。\n\n```\nvar videoId = \"QHy0nBYwIKM\"\
  ;\nvar youTubeUrl = String.Format(\"http://youtube.com/watch?v={0}\", videoId);\n\
  var url = Android.Net.Uri.Parse(youTubeUrl);\nvar intent = new Intent(Intent.ActionView,\
  \ url);\nStartActivity(intent);\n```\n\n## 打开市场\n\n推广你构建的应用程序的一种极方法是允许用户从你的一个应用程序直接链接到另一个应用程序。为了实现，可以使用\
  \ `market://` 协议，它允许你根据不同的标准搜索商店并获取有关应用程序的详细信息。\n\n要显示特定开发者的应用程序列表，可以使用以下代码示例打开\
  \ Android Market 应用程序并显示该开发者的应用程序列表：\n\n```\nvar publisher = \"Google Inc.\";\n\
  var url = Android.Net.Uri.Parse(\n                 String.Format(\"market://search?q=pub:{0}\"\
  , publisher)\n          );\nvar intent = new Intent(Intent.ActionView, url);\nStartActivity(intent);\n\
  ```\n\n发布者必须准确，因为搜索不会返回部分结果。\n\n![note](img/warning.gif)此示例需要 Android Market 应用程序，因为你正在使用\
  \ Android Market 的功能，示例代码在模拟器上无法运行。模拟器不包含 Android Market。\n\n你可以使用 `market://search?q=pname:`\
  \ 协议来搜索包名，这将显示精确匹配。这里是搜索 Earth 应用程序的示例：\n\n```\nvar packageName = \"com.google.earth\"\
  ;\nvar url = Android.Net.Uri.Parse(String.Format(\"market://search?q=pname:{0}\"\
  , packageName));\nvar intent = new Intent(Intent.ActionView, url);\nStartActivity(intent);\n\
  ```\n```\n\n如果你想通过市场搜索并允许部分匹配，可以使用 `market://search?q=` 协议。这里是搜索 Google 的示例：\n\n\
  ```\nvar searchTerm = \"Google\";\nvar url = Android.Net.Uri.Parse(String.Format(\"\
  market://search?q={0}\", searchTerm));\nvar intent = new Intent(Intent.ActionView,\
  \ url);\nStartActivity(intent);\n```\n\n``````\n\n如果你知道要显示的应用程序的完整包名，就可以直接从你的应用程序显示详情页。使用\
  \ `details` 而不是 `search`，并传入包名作为 id。这里有一个示例：\n\n```\nvar packageName = \"com.google.earth\"\
  ;\nvar url = Android.Net.Uri.Parse(String.Format(\"market://details?id={0}\", packageName));\n\
  var intent = new Intent(Intent.ActionView, url);\nStartActivity(intent);\n```\n\n\
  # 集成\n\n除了从自己的应用程序打开原生应用程序外，还可以打开由第三方编写的应用程序。这些第三方应用程序需要可选暴露协议以便与其他应用程序交互（此方法将在下一节介绍）。找到特定应用程序的网站并弄清楚如何实现协议可能是困难的。值得检查应用程序或开发者网站以查看有关如何与该应用程序集成的信息。一个很好的示例来自一个名为\
  \ HootSuite 的 Twitter 应用程序。\n\n## 与 HootSuite 及其他 Twitter 应用程序简单集成\n\nHootSuite\
  \ 是一款流行的 Android Twitter 和 Facebook 社交网络应用程序。因此，许多用户将其作为发送推文的方法。你可以花费大量时间在应用程序中构建\
  \ Twitter 集成，但更容易的方法是与用户熟悉的应用程序集成。\n\nHootSuite 提供了一个意图，可以将文本发送到该应用程序并发送推文。为此，你使用\
  \ `ActionSend` 意图动作和类型 `application/twitter`。然后将你想要发送的推文作为传入，并使用 `CreateChooser`\
  \ 方法启动活动。这允许你的应用程序选取未来支持 Twitter 的应用程序。以下代码显示了如何这样做：\n\n```\nvar intent = new Intent(Intent.ActionSend);\n\
  intent.PutExtra(Intent.ExtraText, \"Sending a tweet to another application\");\n\
  intent.SetType(\"application/twitter\");\nStartActivity(Intent.CreateChooser(intent,\
  \ \"Select Twitter application\"));\n```\n\n这段代码包含在 Tweet Sender 示例应用程序的 `TweetSender\\\
  TweetSender\\TweetSenderActivity.cs` 中。\n\n## 配置你的意图过滤器\n\n\n\n\n为了让你的应用程序——更具体地说，你的活动（activity）能够被其他应用程序打开，你需要配置意图过滤器（intent\
  \ filters）。它们允许其他应用程序使用意图来启动以这种方式暴露的活动。这与你在章节开头使用这些意图的方式类似。\n\n意图过滤器是你添加到活动中的一个属性，并对其设置了不同的属性。该属性随后会被转换为\
  \ XML，然后合并到 `AndroidManifest.xml` 文件中，传统上，该文件是你的应用程序中暴露意图过滤器的地方。\n\n在这个示例中，你想创建一个\
  \ Twitter 应用程序，它能够接收人们发送的推推文文本，然后将其发送到 Twitter。该应用程序在处理获取新推文方面的行为与 HootSuite 类似。首先，你想为应用程序的活动添加意图过滤器属性。由于你希望用户通过文本发送推文，因此你希望应用程序仅在这种情况下可用。你可以像这样添加该属性：\n\
  \n![download](img/download.gif)\n\n```cs\n[IntentFilter (new[]{Intent.ActionSend},\n\
  \                      Categories=new[]{Intent.CategoryDefault})]\n[Activity(Label\
  \ = \"Tweet Receiver\", MainLauncher = true)]\npublic class TweetReceiverActivity\
  \ : Activity {\n   // Application code.\n}\n```\n\n此代码包含在 Tweet Receiver 示例应用程序的\
  \ `TweetReceiver\\TweetReceiver\\TweetReceiverActivity.cs` 中。\n\n`IntentFilter`\
  \ 属性的构造函数接收一个数组，应用程序将像处理普通意图一样监听这些操作。由于你希望用户发送推文，因此此操作被设置为 `Intent.ActionSend`。当调用意图来匹配过滤器时，该意图必须匹配\
  \ `IntentFilter` 中设置的至少一个操作。类别也被设置为 `Default`；这是意图被调用时的类别。你还对意图过滤器上设置了 `Data` 属性以进一步过滤意图。\n\
  \n现在已经在发送操作上设置了意图过滤器，你需要设置一个可以调用该应用程序的应用程序。参考 HootSuite 示例，如下所示：\n\n![download](img/download.gif)\n\
  \n```cs\nvar intent = new Intent(Intent.ActionSend);\nintent.PutExtra(Intent.ExtraText,\
  \ \"Sending a tweet to another application\");\nStartActivity(Intent.CreateChooser(intent,\
  \ \"Select Twitter application\"));\n```\n\n此代码包含在 Tweet Sender 示例应用程序的 `TweetSender\\\
  TweetSender\\TweetSenderActivity.cs` 中。\n\n使用 `CreateChooser` 方法允许具有 `ActionSend`\
  \ 方法的其他应用程序进行匹配并可选地被选择。\n\n## 处理传入的意图请求\n\n有了意图过滤器后，你将需要在活动中处理来自这些意图的传入请求。由于你可以设置多个意图请求，因此你需要确保每个请求都被正确处理。当意图请求进来时，你可以直接检查意图的操作（action）是否匹配预期的操作。对于此应用程序，你可以检查操作是否匹配\
  \ `Intent.ActionSend`。\n\n如果匹配，意图将包含一个包（bundle），其中包含了随意图传递的额外信息，这些信息是可以被提取的。由于你应该收到了\
  \ `Intent.ExtraText` 值，你可以从包中获取字符串，然后以你想要的方式在应用程序中使用它。将所有这些信息整合在一起，你应该得到如下所示的内容：\n\
  \n![download](img/download.gif)\n\n```cs\nvar action = this.Intent.Action;\nif(Intent.ActionSend\
  \ == action)\n{\n   //We have text for a tweet.\n   var sentText = this.Intent.Extras.GetString(Intent.ExtraText);\n\
  \   Toast.MakeText(this, sentText, ToastLength.Long).Show();\n}\n```\n\n此代码包含在 Tweet\
  \ Receiver 示例应用程序的 `TweetReceiver\\TweetReceiver\\TweetReceiverActivity.cs` 中。\n\
  \n## 与联系人集成\n\n联系人是任何设备的关键部分，Android 设备也不如此。在你的应用程序中访问这些信息可能是很有用的。你可能希望允许用户看到他们的朋友列表，以便他们向你的应用程序发送链接等。\n\
  \n要获取访问联系人列表的权限，你需要使用 `ManagedQuery` 方法和 `ContactsContract.Contacts.ContentUri`\
  \ URI 来遍历设备上的每个联系人（参见 Listing 10.5）。从这里，你可以使用光标索引的 `GetString` 方法和 `GetColumnIndex`\
  \ 方法通过 `Log.Info` 方法显示用户的名称和 ID。\n\n![note](img/note.gif)你需要显式权限来读取联系人列表。要允许权限，请确保在\
  \ `AndroidManifest.xml` 文件中添加以下行：`<uses-permission android:name=“android.permission.READ_CONTACTS”/>`\n\
  \n* * *\n\n![download](img/download.gif) Listing 10.5: 访问联系人\n\n```cs\nvar uri =\
  \ ContactsContract.Contacts.ContentUri;\nvar cursor = ManagedQuery(uri, null, null,\
  \ null, null);\nif(cursor.Count > 0)\n{\n   while(cursor.MoveToNext())\n   {\n \
  \     Log.Info(\"Mono for Android\", \"Id = {0}\", cursor.GetString(\ncursor.GetColumnIndex(BaseColumns.Id)));\n\
  \      Log.Info(\"Mono for Android\", \"Name = {0}\",cursor.GetString(\ncursor.GetColumnIndex(ContactsContract.ContactsColumns.DisplayName)));\n\
  \      Log.Info(\"Mono for Android\", \"==============\");\n   }\n   cursor.Close();\n\
  }\n```\n\n此代码包含在 `ContactExample\\ContactExample\\Activity1.cs` 中。\n\n![note](img/note.gif)当你开始\
  \ Android 开发时，Android 模拟器中没有联系人。为了确保列表 10.5 正常工作，请向模拟器添加至少一个人。你可以通过点击应用程序列表中的联系人图标、点击菜单并选择“新建联系人”来实现。\n\
  \n* * *\n\n由于联系人 API 实际上是 SQLite 表的封装，你需要使用 `ColumnIndex` 从数据库获取列。由于用户可以有多个电话号码或电子邮件，这些信息存储在与主联系人表关联的表中。为了显示额外信息，可以使用可以使用的内容\
  \ URI 来获取它们，如 Listing 10.6 所示。由于你需要当前联系人的 ID，因此在现有光标遍历每个联系人时，会提取电话和电子邮件信息。\n\n\n\
  \n\n\n```\nvar uri = ContactsContract.Contacts.ContentUri;\nvar cursor = ManagedQuery(uri,\
  \ null, null, null, null);\nif(cursor.Count > 0)\n{\n   while(cursor.MoveToNext())\n\
  \   {\n      var contactId =\n            cursor.GetString(cursor.GetColumnIndex(BaseColumns.Id));\n\
  \      Log.Info(\"Mono for Android\", \"Id = {0}\", contactId);\n      Log.Info(\"\
  Mono for Android\", \"Name = {0}\", cursor.GetString(\ncursor.GetColumnIndex(ContactsContract.ContactsColumns.DisplayName)));\n\
  \n      if(cursor.GetInt(cursor.GetColumnIndex(\n         ContactsContract.ContactsColumns.HasPhoneNumber))\
  \ == 1)\n      {\n         var phoneCursor = ManagedQuery(\n                   \
  \  ContactsContract.CommonDataKinds.Phone.ContentUri,\n                     null,\n\
  \                     \"CONTACT_ID\" + \" = \" + contactId,\n                  \
  \   null,\n                     null);\n\n         while(phoneCursor.MoveToNext())\n\
  \         {\n            var number =  phoneCursor.GetString(\n                \
  \            phoneCursor.GetColumnIndex(\n                            ContactsContract.CommonDataKinds.Phone.Number));\n\
  \n            var type = (PhoneDataKind) phoneCursor.GetInt(\n                 \
  \           phoneCursor.GetColumnIndex(\"DATA2\"));\n\n            Log.Info(\"Mono\
  \ for Android\",\n                           \"Telephone: {0} - {1}\", number, type.ToString());\n\
  \         }\n         phoneCursor.Close();\n      }\n\n      var emailCursor = ManagedQuery(\n\
  \                         ContactsContract.CommonDataKinds.Email.ContentUri,\n \
  \                        null,\n                         \"CONTACT_ID\" + \" = \"\
  \ + contactId,\n                         null,\n                         null);\n\
  \n      while(emailCursor.MoveToNext())\n      {\n         var email =  emailCursor.GetString(\n\
  \                         emailCursor.GetColumnIndex(\"DATA1\"));\n\n         Log.Info(\"\
  Mono for Android\", \"E-mail: {0}\", email);\n      }\n      emailCursor.Close();\n\
  \      Log.Info(\"Mono for Android\", \"==============\");\n\n   }\n   cursor.Close();\n\
  }\nelse\n{\n   Toast.MakeText(this, \"No contacts found\", ToastLength.Long).Show();\n\
  }\n```\n\n这段代码包含 `ContactExample\\ContactExample\\Activity1.cs`。\n\n如果你想搜索特定名称的用户，可以使用\
  \ `ContactsContract.Contacts.ContentFilterUri` URI，并将你想要过滤的名称附加到搜索查询中。以下代码展示了如何使用它来搜索所有匹配部分名称\
  \ \"Fred\" 的联系人：\n\n![下载](img/download.gif)\n\n```\nvar filterUri = ContactsContract.Contacts.ContentFilterUri;\n\
  var uri = Android.Net.Uri.WithAppendedPath(filterUri, \"Fred\");\n\nvar cursor =\
  \ ManagedQuery(uri, null, null, null, null);\nToast.MakeText(this, \"Found \" +\
  \ cursor.Count + \" people with Fred in their\n  name\", ToastLength.Long).Show();\n\
  ```\n\n这段代码包含 `ContactExample\\ContactExample\\Activity1.cs`。\n\n通过编程访问联系人在大多数情况下是有用的，但当你真正想要用户对\
  \ Android 设备所预期的默认行为时，在此基础上手动构建 UI 组件将花费很长时间。幸运的是，你可以重用对意图的知识来操作和查看联系人信息。\n\n##\
  \ 显示联系人详情\n\n要从你的应用程序中显示联系人的详情，可以使用 `Intent` 类和 `ContactsContract` 类提供的内容 URI。当你知道一个人的\
  \ ID 时，显示该人员只需创建一个指向附加到内容 URI 上的 ID 的新意图即可。以下代码展示了如何创建此意图。图 10.7 显示了联系人的详情视图。请确保你的联系人中有一个\
  \ ID 为“1”的联系人，以便示例能够正常工作：\n\n![下载](img/download.gif)\n\n```\n// 显示 ID 1 的联系人详情\n\
  var contactUri = ContactsContract.Contacts.ContentUri;\nvar uri = Android.Net.Uri.WithAppendedPath(contactUri,\
  \ \"1\");\n\nvar intent = new Intent(Intent.ActionView, uri);\nStartActivity(intent);\n\
  ```\n\n这段代码包含 `ContactExample\\ContactExample\\Activity1.cs`。\n\n图 10.7\n\n![10.7](img/c10f007.jpg)\n\
  \n注意，你可以继续编辑此联系人，因为它显示的是原生 Android 设备的一部分，而不是你应用程序中的 Activity。\n\n## 选择联系人\n\n要允许用户从所有联系人列表中选择特定的联系人，你可以使用\
  \ `Intent.ActionPick` 意图类型。要让活动获取被选中的用户，请使用 `StartActivityForResult` 方法，并在获取结果时使用唯一的整数来解析结果。以下代码使用\
  \ 100 作为此唯一整数。当选择器加载时，你会看到一个所有用户的列表，类似于联系人应用程序中显示的列表（参见 图 10.8）。\n\n![下载](img/download.gif)\n\
  \n```\n// 显示联系人选择器\nvar intent = new Intent(Intent.ActionPick,\n               \
  \         ContactsContract.Contacts.ContentUri);\n```\n\n这段代码包含在 `ContactExample\\\
  ContactExample\\Activity1.cs`。\n\n图 10.8\n\n![10.8](img/c10f008.jpg)\n\n由于意图是通过\
  \ `StartActivityForResult` 发出的，你需要通过重写 `ActivityResult` 方法来处理它。为了这样做，你可以将意图的数据传递\
  \ `ManagedQuery` 以获取选中的联系人：\n\n```\nprotected override void OnActivityResult (int\
  \ requestCode, Result resultCode,\n Intent data)\n{\n   if(requestCode == 100)\n\
  \   {\n      if (data != null)\n      {\n         var cursor = ManagedQuery(data.Data,\
  \ null, null, null);\n         if(cursor.Count > 0)\n         {\n            cursor.MoveToFirst();\n\
  \            Toast.MakeText(this, \"Got contact \" +\n                         \
  \        cursor.GetString(\n                                 cursor.GetColumnIndex(\n\
  \                           ContactsContract.ContactsColumns.DisplayName)\n    \
  \                       ), ToastLength.Long).Show();\n         }\n      }\n    \
  \  else\n      {\n         Toast.MakeText(this, \"No contact picked\", ToastLength.Long).Show();\n\
  \      }\n   }\n}\n```\n\n这段代码包含 `ContactExample\\ContactExample\\Activity1.cs`。\n\
  \n## 创建新联系人\n\n在设备中添加新联系人与其他接入联系人功能的方式非常相似。此意图提供了你在联系人应用程序中将看到的相同界面（参见 图 10.9）。\n\
  \n图 10.9\n\n![10.9](img/c10f009.jpg)\n\n通过意图的 `PutExtra` 方法和 `ContactsContract.Intents.Insert`\
  \ 属性，你可以传递新联系人的已知额外信息（例如名称或电子邮件地址）。注意的是，你只能为联系人添加一个名字。由于 Android 的限制，你无法使用此方法设置姓和名。操作方法如下：\n\
  \n![下载](img/download.gif)\n\n```\n// 插入新联系人\nvar intent = new Intent(Intent.ActionInsert,\n\
  \                        ContactsContract.Contacts.ContentUri);\nintent.PutExtra(ContactsContract.Intents.Insert.Name,\
  \ \"Chris Hardy\");\nintent.PutExtra(ContactsContract.Intents.Insert.Phone, \"1-408-867-5309\"\
  );\nintent.PutExtra(ContactsContract.Intents.Insert.Email,\n                   \
  \                                chrisntr@gmail.com);\nthis.StartActivityForResult(intent,\
  \ 150);\n```\n\n这段代码包含 `ContactExample\\ContactExample\\Activity1.cs`。\n\n你使用 `StartActivityForResult`\
  \ 方法调用它是因为你只是向用户展示了一个创建新联系人的屏幕。用户可能会选择不添加新联系人，因此为了通过编程判断用户是否添加了新联系人，你需要使用 `resultCode`\
  \ 来查看用户是取消了活动还是活动结果返回了 OK。以下代码展示了这一操作：\n\n\n\n\n\n```cs\nprotected override void\
  \ OnActivityResult (int requestCode, Result resultCode,\n Intent data)\n{\n   if\
  \ (resultCode == Result.Ok)   \n{\n      // TODO: 处理成功添加联系人的逻辑。\n   }\n   else if\
  \ (resultCode == Result.Canceled)\n   {\n      // TODO: 处理未添加新联系人的逻辑。\n   }\n}\n\
  ```\n\n此代码包含在 `ContactExample\\ContactExample\\Activity1.cs`\n\n创建新联系人或添加到现有联系人\n\
  \n有时，你可能有一些信息想要与联系人列表中已存在的联系人关联。或者，你可能想用这些新信息创建一个新的联系人。你可以修改 `intent`，使其预期的类型为 `ContactsContract.Contacts.ContentItemType`，并将\
  \ intent 操作更改为 `ActionInsertOrEdit`。现在，当用户启动 `intent` 时，他或她会看到图 10.10 所示的屏幕。\n\n\
  图 10.10\n\n![10.10](img/c10f010.jpg)\n\n此屏幕允许用户创建一个新联系人，或者使用列表选择一个联系人以添加额外信息。如果用户选择顶部的新\
  \ `Contact` 按钮，其体验与之前所示创建新联系人的体验相同。如果用户选择了现有的联系人，你传递的信息将被添加或覆盖现有内容。用户随后可以保存或撤销（取消）此操作，并返回应用程序。\n\
  \n![download](img/download.gif)\n\n```cs\nvar intent = new Intent(Intent.ActionInsertOrEdit);\n\
  intent.SetType(ContactsContract.Contacts.ContentItemType);\n\nintent.PutExtra(ContactsContract.Intents.Insert.Name,\
  \ \"Chris Hardy\");\nintent.PutExtra(ContactsContract.Intents.Insert.Phone, \"1-408-867-5309\"\
  );\n\nintent.PutExtra(ContactsContract.Intents.Insert.Email,\n                 \
  \                                  \"chrisntr@gmail.com\");\nthis.StartActivityForResult(intent,\
  \ 150);\n```\n\n此代码包含在 `ContactExample\\ContactExample\\Activity1.cs`\n\n# 总结\n\n\
  允许原生 Android 应用程序相互通信是创建一致且直观的用户体验极极方法。访问用户的联系人列表可以开启独特的应用体验，帮助你的应用程序与用户建立更具个人化的联系，并让你访问手机的关键功能（如拨打电话或发送短信）——让你的应用程序脱颖而出。\n\
  \n# 第 11 章：开发后台服务和异步代码\n\n## 本章内容简介\n\n* 服务的生命周期\n* 使用线程完成任务\n* 使用服务和活动\n* 与 UI\
  \ 交互\n* 与通知通信\n* 设置闹钟\n* 云到设备消息 (C2DM)\n\n与某些其他移动操作系统不同，Android 允许甚至鼓励使用各种机制进行后台处理，以便独立于用户界面执行任务。这允许应用程序能够收听来自其他应用程序或服务的广播意图（broadcast\
  \ intents），保持位置数据的更新，甚至可以在互联网上与其他服务进行通信，而无需应用程序的用户界面处于运行状态。\n\n将用户界面与后台处理分离对于创建高效的应用程序至关重要。当你的应用程序只是在轮询\
  \ Web 服务时，没有必要为用户界面保留内存。\n\nAndroid 提供了几种后台处理机制。`Services` 并不总是需要运行。Android 可以根据预定的时间或间隔，或者当另一个线程或应用程序广播该\
  \ `service` 感兴趣的 `intent` 时，唤醒 `service` 以让其在后台进行处理。\n\n在本章中，你将学到关于服务以及在主应用程序线程之外运行代码的所有知识。你将发现如何通过通知将后台代码的更新传递给用户，以及如何与\
  \ `activity` 用户界面通信。你还探索了使用闹钟让后台服务进行间隔性轮询的高效方法。最后，你将介绍 Google 新的用于推送通知的云到设备消息架构。\n\
  \n# 服务的生命周期\n\n由于服务旨在作为一种无需用户交互即可执行代码的机制，因此它们被认为比当前不可见的用户界面活动更重要，这并不意外。当操作系统需要回收更多内存时，只有在最极端的情况下才会杀死服务。即便如此，如果服务需要被临时杀死，也可以请求操作系统重启你的服务。\n\
  \n一个服务可以启动多次，每对特定服务调用一次 `StartService` 就启动一次。每次启动服务时，它都会传递一个 `intent` 和一个用于启动调用的唯一\
  \ ID。\n\n## 创建你的第一个服务\n\n在本章中，你将处理不同实现的服务和 UI，这些程序会在 Twitter 上搜索包含标签 #MonoDroid\
  \ 的推文。列表 11.1 显示了你在处理的每个示例中将引用的简单 `Tweet` 和 `Search` 类。它们超出了本章的范围，但熟悉它们的基本工作原理并不困难。\n\
  \n![download](img/download.gif) 列表 11.1: 辅助类\n\n```cs\nusing System;\nusing System.Collections.Generic;\n\
  using System.Linq;\nusing System.Net;\nusing System.Json;\nusing System.Web;\n\n\
  namespace Chapter11.Twitter\n{\n    public class Tweet\n    {\n        public long\
  \ Id { get; set; }\n        public string ProfileImgUrl { get; set; }\n        public\
  \ string Text { get; set; }\n        public string FromUser { get; set; }\n    }\n\
  \n    public class Search\n    {\n        public static List<Tweet> SearchTweets(long\
  \ sinceId, params string[] terms)\n        {\n            var tweets = new List<Tweet>();\n\
  \n            var query = string.Format(\"{0}?q={1}&since_id={2}&lang=en\",\n  \
  \              \"http://search.twitter.com/search.json\",\n                HttpUtility.UrlEncode(string.Join(\"\
  \ OR \", terms)),\n                sinceId);\n\n            var data = (new WebClient()).DownloadString(query);\n\
  \n            var jsonObj = JsonObject.Parse(data) as JsonObject;\n            var\
  \ jsonResults = jsonObj[\"results\"] as JsonArray;\n\n            foreach (var jsonItem\
  \ in jsonResults)\n            {\n                tweets.Add(new Tweet()\n     \
  \           {\n                    Id = (long)jsonItem[\"id\"],\n              \
  \      ProfileImgUrl = jsonItem[\"profile_image_url\"].ToString(),\n           \
  \         Text = jsonItem[\"text\"].ToString(),\n                    FromUser =\
  \ jsonItem[\"from_user\"].ToString()\n                });\n            }\n\n   \
  \         return tweets;\n        }\n    }\n}\n```\n\n此代码包含在 `Chapter11.Twitter\\\
  Search.cs`\n\n对于你的第一个服务，你将创建一个简单的服务，每次启动时都会搜索推文。这是通过派生服务类来实现的，如列表 11.2 所示。\n\n\n\
  \n\n\n```\nusing System;\nusing System.Collections.Generic;\nusing System.Linq;\n\
  using System.Text;\nusing Android.App;\nusing Android.Content;\nusing Android.OS;\n\
  using Android.Runtime;\nusing Android.Views;\nusing Android.Widget;\nusing Chapter11.Twitter;\n\
  \nnamespace Chapter11.FirstService\n{\n    [Service]\n    public class FirstService\
  \ : Service\n    {\n        List<Tweet> tweets = new List<Tweet>();\n\n        public\
  \ override IBinder OnBind(Intent intent)\n        {\n            throw new NotImplementedException();\n\
  \        }\n\n        public override StartCommandResult OnStartCommand(Intent intent,\n\
  \            StartCommandFlags flags, int startId)\n        {\n            var startCmdResult\
  \ = base.OnStartCommand(intent, flags, startId);\n\n            tweets = Search.SearchTweets(0,\
  \ \"#MonoDroid\");\n\n            foreach (var tweet in tweets)\n              \
  \  Android.Util.Log.Info(\"CHAPTER-11\",\n                    string.Format(\"{0}\
  \ - {1}: {2}\", tweet.Id,\n                    tweet.FromUser, tweet.Text));\n \
  \           Toast.MakeText(this, \"Tweets Refreshed!\", ToastLength.Short).Show();\n\
  \n            return startCmdResult;\n        }\n    }\n}\n```\n\n这段代码包含在 `Chapter11a.FirstService\\\
  FirstService.cs` 中。\n\n![note](img/note.gif)在本章的代码示例中，你将看到引用了 Twitter 标签 #MonoDroid。Mono\
  \ for Android 最初在社区中被称为 MonoDroid。许多对它的引用仍在使用此名称，例如 IRC 频道、开源项目和推文。\n\n* * *\n\n\
  子类化服务类需要重写 `OnBind` 方法（你将在“与 UI 通信：使用 Binder 和服务连接方法”章节中学习它）。在此示例中，你不需要担心该方法的作用，但如果不重写该方法，你的代码将无法编译。对于一个什么都不做的服务来说，它将没有用处，所以你可以看到\
  \ `OnStartCommand` 也被重写了。这是你服务的程序入口点，是一个可能会被多次调的方法。参数包括导致启动服务的 `intent`（它可能包含相关的额外数据）、指示服务是否是由于失败尝试的重试（Retry）或重新投递（Redelivery）而启动的\
  \ `flag`，以及启动启动请求唯一的 `startId`。\n\n`OnStartCommand` 方法必须返回一个 `StartCommandResult`\
  \ 位掩码值。它告诉操作系统如何希望管理该服务——特别是服务在启动后是否会被操作系统杀死（例如，在低内存条件下）。有几种可能的枚举标记：\n\n*   `NotSticky`：服务被移出启动状态，如果被操作系统杀死，则不会重新投递意图（intent）。\n\
  *   `RedeliverIntent`：服务被计划重启，如果被操作系统杀死，则会重新投递意图。\n*   `Sticky`：服务应该保持在其启动状态，如果被操作系统杀死，则不会重新投递意图。\n\
  *   `StickyCompatible`：不保证如果服务被操作系统杀死，服务的启动方法是否会被再次调用。此标记的存在是为了与比 Level 5（Android\
  \ 2.0）更旧的 API 兼容。\n*   `ContinuationMask`：返回值的位掩码。此值对于返回 `StartCommandResult` 并不是必要的，而是为了从返回的值中读取不同的位掩码。你通常不需要使用它。\n\
  \n![note](img/note.gif)在 API Level 5 (Android 2.0) 之前，使用 `OnStart(Intent intent)`\
  \ 代替 `OnStartCommand`。如果你计划支持旧平台，应该重写这两个方法。\n\n* * *\n\n另一个需要注意的重要点是修饰类的 `[Service]`\
  \ 属性。如果你做过任何 Java Android 开发，你可能知道服务需要在清单文件（manifest）中声明。如果你使用 `[Service]` 属性来修饰你的服务类，Mono\
  \ for Android 会自动在清单文件中生成正确的服务定义。\n\n## 服务优先级排序\n\n你的服务希望继续运行；它具有惯性。服务的优先级始终高于对用户可见的活动（activities）。如果一个活动当前正在使用且对用户可见（前台活动），它具有最高优先级，并且永远不应该被终止。那么，服务就具有次高优先级。\n\
  \n有时，你可能希望你的服务保持比默认更高的优先级，这意味着它应该具有与前台活动同等的优先级。一个例子可能是 VoIP 应用程序或音乐播放器。你可以通过 `Service.StartForeground(int\
  \ id, Notification n)` 方法将服务启动在前台状态（或将正在运行的服务移动到前台）。该方法期望的参数是一个通知 `id`（在你的应用程序内唯一）和一个\
  \ `Notification` 对象（应该是一个持续运行的通知）。这会将你的服务提升到前台状态，并防止它在除极端的低内存条件下之外被杀死以释放内存。同样地，`Service.StopForeground(bool\
  \ removeNotification)` 方法用于将服务从前台状态移除，它期望一个 `bool` 参数，指示是否移除传递给 `StartForeground`\
  \ 调用的持续通知。列表 11.3 显示了如何对服务进行排序。\n\n![note](img/note.gif)在 API Level 5 (Android 2.0)\
  \ 之前，你需要使用 `SetForeground(bool isForeground)` 来更改服务的的前台状态。\n\n* * *\n\n![download](img/download.gif)\
  \ 列表 11.3: 服务优先级排序\n\n```\nvar notification = new Notification(\n  Android.Resource.Drawable.SymActionEmail,\n\
  \  \"Prioritized Service!\");\nnotification.Flags = NotificationFlags.ForegroundService;\n\
  \nvar pendingIntent = PendingIntent.GetActivity(this, 0,\n  new Intent(this, typeof(MainActivity)),\n\
  \  PendingIntentFlags.UpdateCurrent);\n\nnotification.SetLatestEventInfo(this, \"\
  Prioritized Service\",\n  \"Prioritized Service running\", pendingIntent);\n\nStartForeground(1,\
  \ notification);\nNotificationManager.FromContext(this).Notify(0, notification);\n\
  ```\n\n这段代码包含在 `Chapter11b.PrioritizingServices\\PriorityService.cs` 中。\n\n# 使用线程进行异步处理\n\
  \n这可能并不显而易见，但服务的运行并不意味着你的代码在后台运行。事实上，默认情况下，你重写的方法是在主应用程序线程上执行的。这意味着如果你在活动中调用 `StartService(...)`，服务的\
  \ `OnStartCommand(...)` 方法会被调用，但你的活动会阻塞在该方法的调用上。如果你不小心，在 `OnStartCommand` 中进行大量处理，可能会在启动服务时阻塞你的用户界面。因此，将任何耗时处理程序移动到不同的线程是重要的。在\
  \ Mono for Android 中完成此任务有几种方法：\n\n*   手动线程：使用 `System.Threading` 命名空间，你可以根据需要手动创建线程执行后台工作。\n\
  *   `System.Threading.Tasks`：Mono 提供了一个抽象线程的命名空间，用于异步执行并行执行。\n*   `IntentService`：这是一种特殊的服务子类，每当有新的意图到达时，它会在后台进行处理。它会根据需要启动和停止，并为你处理好异步管道工作。\n\
  \n\n\n\n[content]\n\n如果你熟悉 .NET 中的多线程，那么 Listing 11.4 中所示的代码应该让你感到非常熟悉。它展示了如何使用\
  \ `System.Threading.Thread` 对象在后台执行代码。该服务利用单一的 `Thread` 对象。每当服务启动时，都会检查线程实例以查看是否已创建或仍在运行。如果它没有运行或尚未创建，则会生成并启动一个新的线程实例。该线程会执行\
  \ `serviceWorker()` 方法。如果线程已经在运行，则不会创建新线程。\n\n![download](img/download.gif) Listing\
  \ 11.4: 使用手动多线程\n\n```\nusing System;\nusing System.Threading;\nusing Android.App;\n\
  using Android.Content;\nusing Android.OS;\nusing Android.Runtime;\nusing Android.Views;\n\
  using Android.Widget;\nusing Chapter11.Twitter;\n\nnamespace Chapter11.ManualThreading\n\
  {\n    [Service]\n    public class ThreadedService : Service\n    {\n        int\
  \ startCount = 0;\n        Thread worker = null;\n        Handler handler = new\
  \ Handler();\n\n        public override IBinder OnBind(Intent intent)\n        {\n\
  \            throw new NotImplementedException();\n        }\n\n        public override\
  \ StartCommandResult OnStartCommand(Intent intent,\n            StartCommandFlags\
  \ flags, int startId)\n        {\n            var startCmdResult = base.OnStartCommand(intent,\
  \ flags, startId);\n\n            startCount++;\n\n            if (worker == null\
  \ || !worker.IsAlive)\n            {\n                worker = new Thread(new ThreadStart(serviceWorker));\n\
  \                worker.Start();\n            }\n\n            return startCmdResult;\n\
  \        }\n\n        void serviceWorker()\n        {\n            while (startCount\
  \ > 0)\n            {\n                startCount--;\n\n                var tweets\
  \ = Search.SearchTweets(0, \"#MonoDroid\");\n\n                foreach (var tweet\
  \ in tweets)\n                    Android.Util.Log.Info(\"CHAPTER-11\",\n      \
  \                  \"{0} - {1}: {2}\", tweet.Id, tweet.FromUser, tweet.Text));\n\
  \n                handler.Post(() =>\n                {\n                    Toast.MakeText(this,\
  \ \"Tweets Refreshed!\",\n                        ToastLength.Short).Show();\n \
  \               });            }\n\n            this.StopSelf();\n        }\n  \
  \  }\n}\n```\n\n这段代码包含在 `Chapter11c.ManualThreading\\ThreadedService.cs` 中\n\n该服务有一个单一的工作线程，在\
  \ `OnStartCommand` 的重写方法中，增加 `startCount` 后，如果它尚未运行，就会启动它。工作线程在 `startCount` 大于\
  \ 0 时循环运行，并在每次迭代后将其递减。如果服务已经在运行，则会增加 `startCount`，以便循环运行的次数与请求启动该服务的次数一致。\n\n你可能已经注意到在\
  \ Listing 11.4 中使用了 `Handler` 来显示 `Toast`。由于 Toast 会导致 UI 变化，因此它需要在主应用程序线程上显示。`TaskService`\
  \ 使用 `Task`，它通过多线程来刷新推文，而不阻塞主应用程序线程。（请记住，服务运行在主应用程序线程上。）在 `Activity` 中，你通常会使用 `RunOnUiThread()`\
  \ 从另一个线程与 UI 交互。在服务中，没有这个方法，但可以使用 `Handler` 实例来 `Post()` 要在主应用程序线程上运行的代码。需要注意的是，`Handler`\
  \ 必须从主应用程序线程进行实例化。\n\n## 利用 System.Threading.Tasks\n\nMono 为 Android 带来的特性之一是 `System.Threading.Tasks`（以前称为\
  \ Parallel Extensions）命名空间。该命名空间旨在帮助异步和并行地执行代码。随着多核处理器的出现，这在个人电脑上变得变得重要。随着越来越多具有多核处理器的计算机发布，这种模式也同样适用于移动设备。使用此命名空间是让你的代码异步执行的简单方式，同时还可以利用设备的多核性能。\n\
  \nListing 11.5 展示了使用 Task 模式在服务中异步执行代码的示例。它还使用了 `Parallel.ForEach` 模式来遍历搜索返回的推文。如果运行代码的设备具有多个核心，则循环能够同时处理多个项目，而无需你编写额外的代码。\n\
  \n![download](img/download.gif) Listing 11.5: 实现 System.Threading.Tasks\n\n```\n\
  using System;\nusing System.Collections.Generic;\nusing System.Linq;\nusing System.Text;\n\
  using System.Threading.Tasks;\n\nusing Android.App;\nusing Android.Content;\nusing\
  \ Android.OS;\nusing Android.Runtime;\nusing Android.Views;\nusing Android.Widget;\n\
  \nusing Chapter11.Twitter;\n\nnamespace Chapter11.Tasks\n{\n    [Service]\n    public\
  \ class TaskService : Service\n    {\n        public override IBinder OnBind(Intent\
  \ intent)\n        {\n            return default(IBinder);\n        }\n\n      \
  \  public override StartCommandResult OnStartCommand(Intent intent,\n          \
  \  StartCommandFlags flags, int startId)\n        {\n            var result = base.OnStartCommand(intent,\
  \ flags, startId);\n\n            Task.Factory.StartNew(() =>\n            {\n \
  \               var tweets = Search.SearchTweets(0, \"#MonoDroid\");\n\n       \
  \         Parallel.ForEach<Tweet>(tweets, (tweet) =>\n                {\n      \
  \              Android.Util.Log.Info(\"CHAPTER-11\", string.Format(\n          \
  \              \"{0} - {1}: {2}\", tweet.Id, tweet.FromUser, tweet.Text));\n   \
  \             });\n\n                handler.Post(() =>\n                {\n   \
  \                 Toast.MakeText(this, \"Tweets Refreshed!\",\n                \
  \        ToastLength.Short).Show();\n                });\n            });\n\n  \
  \          return result;\n        }\n    }\n}\n```\n\n这段代码包含在 `Chapter11d.Tasks\\\
  TaskService.cs` 中\n\n## 使用 IntentService 的隐式多线程\n\nAndroid 有一个名为 `IntentService`\
  \ 的类与之前的列表非常相似。它是一种将处理转移另一个线程的特殊服务。它使用单一线程来处理来自 `OnStartCommand` 方法的所有 Intent。当\
  \ IntentService 没有更多要做（没有更多 Intent）时，它会停止自身，并等待下一次调用它启动。Listing 11.6 展示了如何实现 `IntentService`\
  \ 以完成与 Listing 11.5 中服务相同的工作。\n\n![download](img/download.gif) Listing 11.6: 实现\
  \ IntentService\n\n```\nusing System;\nusing System.Collections.Generic;\nusing\
  \ Android.App;\nusing Android.Content;\nusing Android.OS;\nusing Android.Runtime;\n\
  using Android.Views;\nusing Android.Widget;\nusing Chapter11.Twitter;\n\nnamespace\
  \ Chapter11.IntentServiceSample\n{\n    [Service]\n    public class IntentServiceSample\
  \ : IntentService\n    {\n        List<Tweet> tweets = new List<Tweet>();\n    \
  \    Handler handler = new Handler();\n\n        protected override void OnHandleIntent(Intent\
  \ intent)\n        {\n            tweets = Search.SearchTweets(0, \"#MonoDroid\"\
  );\n            foreach (var tweet in tweets)\n                Android.Util.Log.Info(\"\
  CHAPTER-11\", string.Format(\n                    \"{0} - {1}: {2}\", tweet.Id,\
  \ tweet.FromUser, tweet.Text));\n\n            handler.Post(() =>\n            {\n\
  \                Toast.MakeText(this, \"Tweets Refreshed!\", ToastLength.Short)\n\
  \                  .Show();\n            });\n        }\n    }\n}\n```\n\n这段代码包含在\
  \ `Chapter11e.IntentServiceSample\\IntentServiceSample.cs` 中\n\n[/content]\n\n\n\
  \n你可以看到，实现 `IntentService` 并不复杂，而且它承担了大量的繁重工作。这是一个非常棒的类，你应该尽可能使用它。\n\n# 与 UI 通信\n\
  \n在大多数应用程序中，如果服务不能与用户界面通信以告知其发生了变化或更新，那么它将毫无用处。在 Android 中，你应该考虑由用户界面负责与服务通信，因为在任何时刻，你的\
  \ activity 都可能不在前台。请考虑到你的服务可能正在运行，并且随时有新数据要与 activity 共享，但如果 activity 处于暂停状态或已被销毁，尝试更新它将浪费资源。可以使用多种方法与服务通信：\n\
  \n*   使用 `binder` 和服务连接进行绑定\n*   当 activity 处于激活状态时使用 `broadcast receiver`\n*  \
  \ 在 activity 中注册静态事件\n\n## 使用 Binder 和服务连接方法\n\nbinder 和服务连接方法是获取服务实际实例引用的标准 Android\
  \ 方式。有了服务的引用，你可以调用公共方法、更改属性并注册实例事件，以此作为从 activity 与服务通信的手段。要创建绑定，你的服务必须重写并实现 `OnBind`\
  \ 方法。它应该返回一个实现 `IBinder` 的类实例。在 Listing 11.7 中，你派生了 `Binder` 类，仅用于存储指向服务本身的强类型引用。\n\
  \n在 activity 侧，你需要创建一个实现 `IServiceConnection` 的类的实例，这需要 `OnServiceConnected` 和 `OnServiceDisconnected`\
  \ 方法的实现。在 Listing 11.7 中，你创建了一个实现，它暴露了一个 `Connected` 事件，并会传递 `binder` 实例。activity\
  \ 注册该连接事件，并在事件中对服务实例本身的实例事件进行连接。最后，activity 必须在 `OnResume` 重写中绑定到服务，并在 `OnPause`\
  \ 重写中解绑，这样它在不在前台时就不会维持与服务的连接。由于你使用了 `AutoCreate` 绑定标志，不需要显式地启动服务。如果服务尚未运行，系统会自动完成此操作。\n\
  \n![download](img/download.gif) Listing 11.7: 将服务绑定到活动\n\n```\nusing System;\nusing\
  \ System.Collections.Generic;\nusing System.Linq;\nusing System.Text;\nusing Android.App;\n\
  using Android.Content;\nusing Android.OS;\nusing Android.Runtime;\nusing Android.Views;\n\
  using Android.Widget;\n\nusing Chapter11.Twitter;\n\nnamespace Chapter11.UICommunication\n\
  {\n    [Service]\n    public class BindingTweetService : IntentService\n    {\n\
  \        public event Action NewTweetsFound;\n\n        public List<Tweet> Tweets\
  \ { get; set; }\n        public long LastSinceId { get; set; }\n\n        private\
  \ TweetServiceBinder binder;\n\n        public BindingTweetService()\n         \
  \   : base()\n            {\n        }\n\n        public override IBinder OnBind(Intent\
  \ intent)\n        {\n            return binder;\n        }\n    }\n\n    public\
  \ class TweetServiceBinder : Binder\n    {\n        public TweetServiceBinder(BindingService\
  \ service)\n        {\n            ServiceInstance = service;\n        }\n\n   \
  \     public BindingService ServiceInstance\n        {\n            get;\n     \
  \       set;\n        }\n    }\n\n    public class TweetServiceConnection : Java.Lang.Object,\
  \ IServiceConnection\n    {\n        public event Action<BindingService> Connected;\n\
  \n        public event Action Disconnected;\n\n        public void OnServiceConnected(ComponentName\
  \ className, IBinder serviceBinder)\n        {\n            if (Connected != null)\n\
  \            {\n                Connected((serviceBinder as BindingService));\n\
  \            }\n        }\n\n        public void OnServiceDisconnected(ComponentName\
  \ className)\n        {\n            if (Disconnected != null)\n            {\n\
  \                Disconnected();\n            }\n        }\n    }\n\n    [Activity(Label\
  \ = \"CH11 Binding Service\", MainLauncher=true, LaunchMode=Android.Content.LaunchMode.SingleTask)]\n\
  \    public class BindingActivity : Activity\n    {\n        TweetServiceConnection\
  \ serviceConnection;\n\n        protected override void OnCreate(Bundle bundle)\n\
  \        {\n            base.OnCreate(bundle);\n\n            SetContentView(Resource.Layout.Main);\n\
  \n            Button button = FindViewById<Button>(Resource.Id.myButton);\n    \
  \        button.Text = \"Check Tweets via Service\";\n\n            button.Click\
  \ += delegate\n            {\n                StartService(new Intent(this, typeof(BindingTweetService)));\n\
  \            };\n\n            serviceConnection = new TweetServiceConnection();\n\
  \            serviceConnection.Connected += (BindingService svc) =>\n          \
  \  {\n                Toast.MakeText(this, \"Bound to Service!\", ToastLength.Short).Show();\n\
  \n                svc.NewTweetsFound += () =>\n                {\n             \
  \       foreach (var tweet in svc.Tweets)\n                    {\n             \
  \           Android.Util.Log.Info(\"CHAPTER-11\", string.Format(\"{0} - {1}: {2}\"\
  , tweet.Id, tweet.FromUser, tweet.Text));\n                        RunOnUiThread(()\
  \ =>\n                        {\n                            Toast.MakeText(this,\
  \ \"Tweets Refreshed!\", ToastLength.Short).Show();\n                        });\n\
  \                    }\n                };\n            };\n        }\n\n      \
  \  protected override void OnResume()\n        {\n            base.OnResume();\n\
  \n            var serviceIntent = new Intent(this, typeof(BindingTweetService));\n\
  \            BindService(serviceIntent, serviceConnection, Bind.AutoCreate);\n \
  \       }\n\n        protected override void OnPause()\n        {\n            UnbindService(serviceConnection);\n\
  \n            base.OnPause();\n        }\n    }\n}\n```\n\n此代码包含在 Chapter11f.UICommunication\\\
  Binding.cs 中\n\n如你所示，这种与服务通信的方式相当繁琐，但它确实提供了最终控制权，因为你最终获取了服务实际强类型实例的引用。\n\n绑定服务的棘之处在于，你无法保证绑定何时完成。这就是为什么你在服务连接类中创建了\
  \ `Connected` 事件。通过 Lambda 和匿名方法，这种模式运行得非常好，因为服务实例变量在 `NewTweetsFound` 事件的匿名事件处理程序的作用域内。\n\
  \n\n\nAndroid 应用可以使用另一种涉及 `BroadcastReceiver` 的常用方法。在 C# 中，你可以通过派生 `BroadcastReceiver`\
  \ 子类并暴露一个 `Receive` 事件来利用这种机制。在 `BroadcastReceiver` 的 `OnReceive` 重写方法中，会触发 `Receive`\
  \ 事件。然后，activity 注册 `Receive` 事件，并在事件被触发时执行 UI 更新。Listing 11.8 展示了这种技术的应用。\n\n![download](img/download.gif)\
  \ Listing 11.8: 节点 中的 BroadcastReceiver\n\n```c\nusing System;\nusing Android.App;\n\
  using Android.Content;\nusing Android.OS;\nusing Android.Runtime;\nusing Android.Views;\n\
  using Android.Widget;\nusing Android.Content.PM;\n\nnamespace Chapter11.UICommunication\n\
  {\n    [Activity(Label = \"CH11 UI Broadcast Rec\", MainLauncher=true,\n       \
  \ LaunchMode=Android.Content.PM.LaunchMode.SingleTask)]\n    public class BroadcastActivity\
  \ : Activity\n    {\n        const string ACTION_NEW_TWEETS = \"action.NEW_TWEETS\"\
  ;\n\n        ActivityBroadcastReceiver broadcastReceiver;\n        Button buttonNewestId;\n\
  \n        protected override void OnCreate(Bundle bundle)\n        {\n         \
  \   base.OnCreate(bundle);\n\n            SetContentView(Resource.Layout.Main);\n\
  \n            buttonNewestId = FindViewById<Button>(Resource.Id.myButton);\n   \
  \         buttonNewestId.Click += delegate\n            {\n                StartService(new\
  \ Intent(this, typeof(BroadcastService)));\n            };\n            broadcastReceiver\
  \ = new ActivityBroadcastReceiver();\n            broadcastReceiver.Receive += (Context\
  \ context, Intent intent) =>\n            {\n                var lastSinceId = intent.GetLongExtra(\"\
  oldSinceId\", 0);\n                var tweets = Twitter.Search.SearchTweets(lastSinceId,\
  \ \n                    \"#MonoDroid\");\n\n                foreach (var tweet in\
  \ tweets)\n                    Android.Util.Log.Info(\"CHAPTER-11\", string.Format(\n\
  \                        \"{0} - {1}: {2}\", tweet.Id, tweet.FromUser, tweet.Text));\n\
  \                Toast.MakeText(this, \"Tweets Refreshed!\", ToastLength.Short)\n\
  \                    .Show();\n            };\n        }\n\n        protected override\
  \ void OnResume()\n        {\n            base.OnResume();\n\n            RegisterReceiver(broadcastReceiver,\n\
  \                new IntentFilter(ACTION_NEW_TWEETS));\n        }\n\n        protected\
  \ override void OnPause()\n        {\n            UnregisterReceiver(broadcastReceiver);\n\
  \n            base.OnPause();\n        }\n    }\n\n    public class ActivityBroadcastReceiver\
  \ : BroadcastReceiver\n    {\n        public event Action<Context, Intent> Receive;\n\
  \n        public override void OnReceive(Context context, Intent intent)\n     \
  \   {\n            if (this.Receive != null)\n                this.Receive(context,\
  \ intent);\n        }\n    }\n}\n```\n\n此代码包含在 `Chapter11f.UICommunication\\BroadcastActivity.cs`\
  \ 中。\n\n你会发现 activity 在 `OnResume` 重写方法中为广播接收器动态注册了 `IntentFilter`。它同样 `在 `OnPause`\
  \ 重写方法中取消了接收器的注册。这确保了 activity 在暂停后不会立即接收广播，避免浪费资源。\n\n在服务端，Listing 11.9 显示了如何通知广播接收器。要使此起作用，你需要定义一个通用的\
  \ action：即服务器可以广播且广播接收器可以监听的某个。\n\n![download](img/download.gif) Listing 11.9: 从服务发送广播\n\
  \n```c\nusing System;\nusing System.Linq;\nusing Android.App;\nusing Android.Content;\n\
  using Android.OS;\nusing Android.Runtime;\nusing Android.Views;\nusing Android.Widget;\n\
  using Chapter11.Twitter;\n\nnamespace Chapter11.UICommunication\n{\n    [Service]\n\
  \    public class BroadcastService : IntentService\n    {\n        public const\
  \ string ACTION_NEW_TWEETS = \"action.NEW_TWEETS\";\n\n        public long LastSinceId\
  \ { get; set; }\n\n        public BroadcastService() : base()\n        {\n     \
  \       this.LastSinceId = 0;\n        }\n\n        protected override void OnHandleIntent(Intent\
  \ intent)\n        {\n            var lastSinceId = this.LastSinceId;\n\n      \
  \      var tweets = Search.SearchTweets(lastSinceId, \"#MonoDroid\");\n\n      \
  \      this.LastSinceId = tweets.Max(t => t.Id);\n\n            if (tweets.Exists(t\
  \ => t.Id > lastSinceId))\n            {\n                var newTweetsIntent =\
  \ new Intent(ACTION_NEW_TWEETS);\n                newTweetsIntent.PutExtra(\"oldSinceId\"\
  , lastSinceId);\n\n                SendBroadcast(newTweetsIntent);\n           \
  \ }\n        }\n    }\n}\n```\n\n此代码包含在 `Chapter11f.UICommunication\\BroadcastService.cs`\
  \ 中。\n\n## 使用静态事件方法\n\n另一种通信方法是使用静态事件。这是一个非常 .NET 风格的方法。你只需要定义一个静态事件：服务器可以广播的、广播接收器可以监听的某个内容。这种方法可以很好地处理双向通信：从\
  \ activity 到服务，反之亦然，如 Listing 11.10 所示。\n\n```csharp\nusing System;\nusing System.Collections.Generic;\n\
  using System.Linq;\nusing System.Text;\nusing Android.App;\nusing Android.Content;\n\
  using Android.OS;\nusing Android.Runtime;\nusing Android.Views;\nusing Android.Widget;\n\
  using Chapter11.Twitter;\n\nnamespace Chapter11.UICommunication\n{\n    [Service]\n\
  \    public class StaticEventService : IntentService\n    {\n        public static\
  \ Action<List<Tweet>> NewTweetsFound;\n\n        public long LastSinceId { get;\
  \ set; }\n\n        public StaticEventService()\n            : base()\n        {\n\
  \            this.LastSinceId = 0;\n        }\n\n        protected override void\
  \ OnHandleIntent(Intent intent)\n        {\n            var lastSinceId = this.LastSinceId;\n\
  \n            var tweets = Search.SearchTweets(lastSinceId, \"#MonoDroid\");\n\n\
  \            this.LastSinceId = tweets.Max(t => t.Id);\n\n            var newTweets\
  \ = from t in tweets\n                            where t.Id > lastSinceId\n   \
  \                         select t;\n\n            if (newTweets != null && newTweets.Count()\
  \ > 0 && NewTweetsFound != null)\n                NewTweetsFound(newTweets.ToList());\n\
  \        }\n    }\n\n    [Activity(Label = \"CH11 Static Events\", MainLauncher=true,\n\
  \        LaunchMode=Android.Content.PM.LaunchMode.SingleTask)]\n    public class\
  \ StaticEventActivity : Activity\n    {\n        Action<List<Tweet>> newTweetsAction;\n\
  \n        protected override void OnCreate(Bundle bundle)\n        {\n         \
  \   base.OnCreate(bundle);\n\n            SetContentView(Resource.Layout.Main);\n\
  \n            var button = FindViewById<Button>(Resource.Id.myButton);\n       \
  \     button.Text = \"Refresh Tweets\";\n\n            button.Click += delegate\n\
  \            {\n                StartService(new Intent(this, typeof(StaticEventService)));\n\
  \            };\n\n            newTweetsAction = (List<Tweet> tweets) => {\n   \
  \             foreach (var tweet in tweets)\n                    Android.Util.Log.Info(\"\
  CHAPTER-11\", string.Format(\n                        \"{0} - {1}: {2}\", tweet.Id,\
  \ tweet.FromUser, tweet.Text));\n                RunOnUiThread(() =>\n         \
  \       {\n                    Toast.MakeText(this, \"Tweets Refreshed!\",\n   \
  \                     ToastLength.Short).Show();\n                });\n        \
  \    };\n        }\n\n        protected override void OnResume()\n        {\n  \
  \          base.OnResume();\n\n            StaticEventService.NewTweetsFound +=\
  \ newtweetsAction;\n        }\n\n        protected override void OnPause()\n   \
  \     {\n            StaticEventService.NewTweetsFound -= newtweetsAction;\n\n \
  \           base.OnPause();\n        }\n    }\n}\n```\n\n此代码包含在 `Chapter11f.UICommunication\\\
  StaticEvents.cs` 中。\n\n\n\n此代码示例包含一个服务（service）和一个活动（activity）。该服务是一个简单的 `IntentService`，暴露了一个名为\
  \ `NewTweetsFound` 的静态事件。每当调用 `OnHandleIntent` 时，该服务都会查找自上一次 ID 之后的新推文。如果发现了新推文，它就会触发\
  \ `NewTweetsFound` 事件。\n\n活动在 `OnCreate` 中定义了一个动作（action），用于在收到新推文通知时执行相应的操作。在这个示例中，它实际上并没有对这些信息进行任何处理，但你可以在这里编写代码来更新你的\
  \ `ListAdapter` 或显示最新的推文。该活动的重要部分位于 `OnResume` 和 `OnPause` 方法中。在 `OnResume` 中，来自服务的静态事件被绑定到你之前创建的\
  \ `Action` 上。在 `OnPause` 重写方法中，该事件会被取消注册。这可以防止活动在不在前台时接收到触发的事件。\n\n![note](img/note.gif)静态成员在整个应用程序生命周期内都会保留在内存中。在静态变量中存储引用或原始类型以外的任何内容都不是\
  \ get。\n\n***\n\n# 使用通知通知用户\n\n现在你已经学习了如何使用服务以及如何在 UI 与这些服务之间进行通信，但仍然缺少一部分。如果你的服务有新信息要与你的活动共享，但你的活动不是前台活动，会发生什么呢？\n\
  \n如果仅仅因为发现了新推文，就要求你的推文活动在用户没有请求的情况下显示出来，将是不礼貌的。这就是通知（Notifications）大显用场的地方。通知提供了一种平台标准的方法，在应用程序状态变化时不打扰地通知用户。用户可以选择何时处理这些通知，这样她就不会在违背其意愿的情况下被当前任务中断。\n\
  \n如果你不熟悉它们，通知就是你在展开的状态栏中能看到的内容（当你从设备屏幕顶部的状态栏向下滑动时）。你可以设置 `Notification` 的多个属性，包括以下属性：\n\
  \n*   `Sound`：当通知显示给用户时，希望在设备上播放的声音。\n*   `Vibrate`：一个 `long` 类型的数组，表示连续的振动长度。例如，`long[]\
  \ { 100, 100 }` 将振动两次，每次 100 毫秒。使用这需要在 `Android Manifest` 中声明 `Vibrate` 权限，该权限可以在项目属性的\
  \ Android Manifest 部分中选择。\n*   `CaptionTitle`：展开的状态栏视图中通知的标题文本。\n*   `CaptionDescription`：展开的状态栏视图中通知的描述文本。\n\
  *   `TickerText`：当你的通知首次出现时，以跑马灯样式在状态栏上显示的文本。\n*   `ContentIntent`：点击通知后运行的 `PendingIntent`。\n\
  *   `DeleteIntent`：当从展开的状态栏中清除通知后运行的 `PendingIntent`。\n*   `ContentView`：展开的状态栏中通知的视图。\n\
  *   `LedARGB`：如果设备支持，则在通知未被查看时显示的 LED 颜色。\n*   `LedOnMS`：LED 闪烁开启的持续时间（毫秒）。\n* \
  \  `LedOffMS`：LED 闪烁关闭的持续时间（毫秒）。\n*   `Icon`：通知的图标。\n*   `Number`：通知代表的事件数量。如果该数字大于\
  \ 1，则会将其叠加在图标上。\n*   `When`：通知应该显示的时间戳。默认情况下，时间戳是即时的。\n*   `Flags`：各种选项的位掩码，定义了通知显示的一些额外特征，以及用户点击通知时会发生的情况。\n\
  \    *   `AutoCancel`：当用户在展开的状态栏中点击通知时，通知会自动取消。\n    *   `ForegroundService`：表示该通知代表一个前台服务。当你使用\
  \ `StartForeground()` 时，此属性会自动设置设置。\n    *   `Insistent`：导致通知的音频重复，直到通知被取消或展开状态栏打开。\n\
  \    *   `NoClear`：如果设置，当用户点击展开的状态栏中的“清除”按钮时，通知不会被取消。\n    *   `OngoingEvent`：表示正在进行的事件，例如电话。\n\
  \    *   `OnlyAlertOnce`：使声音、LED 和振动仅发生一次。\n    *   `ShowLights`：表示应该使用 LED，这意味着你应该为\
  \ `LedOnMS` 和 `LedOffMS` 设置值。\n\n要创建一个通知，你需要创建一个 `Notification` 类的新实例。在构造函数中，你指定了\
  \ `Icon` 和 `TickerText`。每当你对通知进行更改时，都需要调用 `Notification` 对象的 `SetLatestEventInfo`\
  \ 方法，传入上下文、标题文本、描述以及在点击通知时使用的 `PendingIntent`。你应该在第一次显示它之前也调用 `SetLatestEventInfo`。\n\
  \n要显示通知，你需要使用 `NotificationManager`。你可以在任何拥有上下文的地方创建通知，例如活动或服务。列表 11.11 显示了如何显示一个简单的通知。\n\
  \n![download](img/download.gif) 列表 11.11 显示一个简单的通知\n\n\n\n\n\n* `ElapsedRealtime`\
  \ 是自系统启动后的毫秒数。这种类型的闹钟会等待直到设备下次唤醒时触发。\n* `ElapsedRealtimeWakeup` 是自系统启动后的毫秒数。它会让设备在闹钟触发时立即唤醒。\n\
  * `Rtc` 是 UTC 时间毫秒数。这种类型的闹钟会等待直到设备下次唤醒时触发。\n* `RtcWakeup` 是 UTC 时间毫秒数。它会让设备在闹钟触发时立即唤醒。\n\
  * `TriggerAtTime` 是根据 `AlarmType` 触发闹钟的时间。\n* `Interval` 仅用于重复闹钟。你可以指定精确的间隔，或使用\
  \ `AlarmManager` 中的以下常量之一：\n    * `IntervalDay`\n    * `IntervalHalfDay`\n    *\
  \ `IntervalFifteenMinutes`\n    * `IntervalHalfHour`\n    * `IntervalHour`\n* `PendingIntent`\
  \ 是闹钟触发时运行的等待执行意图。\n\n![note](img/note.gif) 如果你使用 `AlarmManager` 的其中一个间隔常量来调度不精确的重复闹钟，操作系统会将具有相似间隔的其他闹钟进行相位对齐，以减少设备唤醒的次数。如果你在\
  \ `SetInexactRepeating` 中没有使用间隔常量，则闹钟将像你调用了 `SetRepeating` 一样设置。\n\n***\n\n通常，你会使用闹钟为\
  \ `BroadcastReceiver` 或（在本例中）`IntentService` 调度一个 `PendingIntent`。Listing 11.12\
  \ 显示了如何设置不精确的重复闹钟。\n\n![download](img/download.gif) Listing 11.12: 创建不精确的重复闹钟\n\n\
  ```java\nvar alarmManager = context.GetSystemService(Context.AlarmService) as AlarmManager;\n\
  \nvar serviceIntent = new Intent(context, typeof(TweetSearchService));\n\nalarmManager.SetInexactRepeating(AlarmType.Rtc,\n\
  \  0, AlarmManager.IntervalFifteenMinutes,\n  PendingIntent.GetService(context,\n\
  \  0, serviceIntent, PendingIntent.CancelCurrent));\n```\n\n这段代码包含在 `Chapter11h.Alarms\\\
  MainActivity.cs` 中。\n\n`AlarmManager` 用于实时钟和 0 值（意味着闹钟应立即设置）设置不精确的重复闹钟。使用 `PendingIntent`\
  \ 是为了告诉闹钟在预期的 15 分钟间隔内运行 `TweetSearchService`。\n\n需要注意的是，调度的闹钟在设备重启时不会被持久化。若要在设备启动时调度闹钟，你应该注册一个具有操作\
  \ `android.intent.action.BOOT_COMPLETED` 对应的 `IntentFilter` 的 `BroadcastReceiver`。你的\
  \ `BroadcastReceiver` 可以在接收到此意图时直接设置闹钟，也可以将意图传递给服务，由服务来调度闹钟。\n\n## 使用云到设备消息 (C2DM)\
  \ 推送通知\n\n推送通知在 iOS 平台上是必须的，仅仅因为开发者没有运行后台服务的选项。然而，在 Android 上，从第一个 API 发布以来，后台服务一直是应用程序架构的重要部分。那么，为什么\
  \ Google 决定为 Froyo (API 8, Android 2.2) 创建推送通知服务呢？至少有几种场景可以使用推送通知来节省电量和系统内存：\n\n\
  * **VoIP/即时消息**：通常，这类应用程序必须持续运行一个服务以维持与远程服务器的 same 连接。通常这些应用程序作为前台服务运行，这意味着它们始终在内存中并始终运行，以避免丢失与互联网服务器的关键连接。这是非常昂代价的，因为服务一直在运行，会消耗更多的\
  \ CPU 周期和内存。\n* **轮询**：Twitter 客户端和 RSS 馈阅读器可能会使用轮询技术，其服务按定期间隔唤醒并联系服务器，检查是否有新数据需要处理。这意味着即使没有可处理的数据，应用程序也需要唤醒来寻找新数据。\n\
  \n如果你只运行一或两个这类应用程序，情况可能不会那么糟，但当你有更多此类应用程序时，你就能看到这种场景在扩展时是如何迅速失效的。\n\n相反，Google 设计了一种名为云到设备消息\
  \ (C2DM) 的服务来实现这一点。使用 C2DM 的用处是它为你的应用程序维持了一个单一的连接。但随着越来越多以互联网为中心的应用程序出现，你的用户将感谢你通过\
  \ C2DM 节省了电量和系统资源。\n\n![note](img/note.gif) 记住，你必须拥有兼容 Google Apps 的设备才有资格注册 C2DM。\n\
  \n***\n\n### 在应用程序中监听 C2DM\n\n为了接收 C2DM 消息，你需要在清单（manifest）中注册几个权限。目前，这些权限中的某些可以通过项目属性设置。但是，如果你还没有这样做，你需要通过向项目添加清单来设置自定义权限，然后手动添加这些行：\n\
  \n```xml\n<permission android:name=\"__PackageName__.permission.C2D_MESSAGE\"\n\
  \ android:protectionLevel=\"signature\" />\n<uses-permission android:name=\"__PackageName__.permission.C2D_MESSAGE\"\
  \ />\n```\n\n注意你需要使用应用程序的包名代替 `__PackageName__`。此列表演示了创建自定义权限并声明应用程序对其的使用，以便只有你的应用程序可以接收它的\
  \ C2DM 消息。\n\n要注册 C2DM，你必须带上它可以处理的意图启动 C2DM 服务：\n\n```java\n//创建我们的意图，带有一个指向我们应用程序广播的等待执行意图\n\
  Intent registrationIntent = new Intent(\"com.google.android.c2dm.intent.REGISTER\"\
  );\nregistrationIntent.PutExtra(\"app\", PendingIntent.GetBroadcast(context, 0,\n\
  \ new Intent(), 0));\nregistrationIntent.PutExtra(\"sender\", senderIdEmail);\n\n\
  //启动意图\ncontext.StartService(registrationIntent);\n```\n\n该意图使用了 C2DM 定义的特定操作并添加了指向应用程序\
  \ `PendingIntent` 的 app 参数。它还添加了一个 sender 字符串额外。这必须是在 Google C2DM 服务器上白白的发送者 ID\
  \ 电子邮件（或角色电子邮件）。你将在下一节中阅读更多内容）。\n\n注销 C2DM 更加简单。你创建一个带有特定操作和 app 参数的意图，就像你注册时一样：\n\
  \n\n\n\n\n```sharp\nIntent unregIntent = new Intent(\"com.google.android.c2dm.intent.UNREGISTER\"\
  );\nunregIntent.PutExtra(\"app\", PendingIntent.GetBroadcast(context, 0, new Intent(),\n\
  \ 0));\ncontext.StartService(unregIntent);\n```\n\n接下来，为了开始接收 C2DM 信息，你需要创建一个 `BroadcastReceiver`\
  \ 实现类。在列表 11.13 中，`BroadcastReceiver` 的实现注册了用于接收注册（Registration）和消息（Message）C2DM\
  \ 广播。然后它将它们传递给 `IntentService`，该服务根据意 的动作（action）和额外（extras）以不同的方式处理消息。\n\n![download](img/download.gif)\
  \ 列表 11.13: 接收 C2DM 事件\n\n```csharp\nusing System;\nusing Android.App;\nusing Android.Content;\n\
  using Android.OS;\nusing Android.Runtime;\n\nnamespace Chapter11.C2DM\n{\n    [BroadcastReceiver(Permission\
  \ = \"com.google.android.c2dm.permission.SEND\")]\n    [IntentFilter(new string[]\
  \ { \"com.google.android.c2dm.intent.RECEIVE\" },\n        Categories = new string[]\
  \ { \"chapter11i.c2dm\" })]\n    [IntentFilter(new string[] { \"com.google.android.c2dm.intent.REGISTRATION\"\
  \ },\n        Categories = new string[] { \"chapter11i.c2dm\" })]\n    public class\
  \ C2DMBroadcastReceiver : BroadcastReceiver\n    {\n        public override void\
  \ OnReceive(Context context, Intent intent)\n        {\n            var svcIntent\
  \ = new Intent(context, typeof(C2DMService));\n\n            svcIntent.PutExtras(intent.Extras);\n\
  \            svcIntent.PutExtra(\"c2dm_action\", intent.Action);\n\n           \
  \ context.StartService(svcIntent);\n        }\n    }\n\n    [Service]\n    public\
  \ class C2DMService : IntentService\n    {\n        Handler handler;\n\n       \
  \ public override void OnCreate()\n        {\n            base.OnCreate();\n   \
  \         handler = new Handler();\n        }\n\n        protected override void\
  \ OnHandleIntent(Intent intent)\n        {\n            var action = intent.GetStringExtra(\"\
  c2dm_action\");\n\n            if (action == \"com.google.android.c2dm.intent.REGISTRATION\"\
  )\n            {\n                var unregistered = intent.GetStringExtra(\"unregistered\"\
  );\n                var error = intent.GetStringExtra(\"error\");\n\n          \
  \      if (!string.IsNullOrEmpty(error))\n                    Error(intent.Extras);\n\
  \                else if (string.IsNullOrEmpty(unregistered))\n                \
  \    Registered(intent.GetStringExtra(\"registration_id\"));\n                else\n\
  \                    Unregistered();\n\n            }\n            else if (action\
  \ == \"com.google.android.c2dm.intent.RECEIVE\")\n            {\n              \
  \  Message(intent.Extras);\n            }\n        }\n\n        void Registered(string\
  \ registrationId)\n        {\n            //将注册 ID 发送到你的服务器...\n            handler.Post(()\
  \ =>\n            {\n                Toast.MakeText(this, \"C2DM - Registered -\
  \ \" + registrationId,\n                    ToastLength.Short).Show();\n       \
  \     });\n        }\n\n        void Unregistered()\n        {\n            //告诉服务器停止向此设备发送消息\n\
  \            handler.Post(() =>\n            {\n                Toast.MakeText(this,\
  \ \"C2DM - Unregistered\",\n                    ToastLength.Short).Show();\n   \
  \         });\n        }\n\n        void Message(Bundle extras)\n        {\n   \
  \         //创建一个通知来提醒用户\n            handler.Post(() =>\n            {\n       \
  \         Toast.MakeText(this, \"C2DM - Msg Received\",\n                    ToastLength.Short).Show();\n\
  \            });\n        }\n\n        void Error(Bundle extras)\n        {\n  \
  \          //确定错误并处理它\n            handler.Post(() =>\n            {\n         \
  \       Toast.MakeText(this, \"C2DM - Error\",\n                    ToastLength.Short).Show();\n\
  \            });\n        }\n    }\n}\n```\n\n此代码包含在 `Chapter11i.C2DM\\C2DMBroadcastReceiver.cs`\
  \ 中。\n\n当然，这个列表是不完整的，因为它没有执行任何处理传入意图的操作。当你收到注册 ID 时，你应该通知你负责发送 C2DM 消息的服务器关于此更新。此时，你可能想将注册\
  \ ID 存储在偏好或文件中以便日后参考。你可能还想将设备 ID 与注册 ID 一起发送到服务器。每当你收到此意图时，都应该做好此准备，因为 Google 可能会偶尔创建新的注册\
  \ ID 而无需显式请求！\n\n同样，当你发现发生了注销时，你应该告诉你的服务器停止使用该注册 ID 发送 C2DM 消息。\n\n注册过程中可能会发生几种错误。你可以检索\
  \ `error` 字符串额外信息来获取错误描述。以下是可能的错误：\n\n* `SERVICE_NOT_AVAILABLE`: 无法访问注册服务，因此你需要稍后重试。\n\
  * `ACCOUNT_MISSING`: 设备上没有设置 Google 账号。设备至少需要设置一个 Google 账号。此时你应该让用户设置一个。\n* `AUTHENTICATION_FAILED`:\
  \ 用户应该修复其 Google 账号信息，因为验证失败。\n* `TOO_MANY_REGISTRATIONS`: 设备注册的 C2DM 应用程序过多。这种情况应该少见，但你可能需要用户移除某些启用了\
  \ C2DM 的应用程序。\n* `INVALID_SENDER`: 你指定的发送者 邮箱无效或尚未被 Google 加入名单。\n* `PHONE_REGISTRATION_ERROR`:\
  \ 设备不支持 C2DM，例如 Android 2.2 或更高版本。\n\n### 从服务器发送 C2DM 消息\n\n现在你的应用程序已设置好接收来自 Google\
  \ C2DM 服务的消息，需要在服务器上设置一个发送消息的过程。你需要一些关键信息才能发送 C2DM 消息。\n\n首先，访问 Google 的 C2DM 注册网站\
  \ [`code.google.com/android/c2dm/signup.html`](http://code.google.com/android/c2dm/signup.html)，使你的应用程序可以使用\
  \ Google 服务器发送 C2DM 消息。该表单有两个你应该注意的关键信息：\n\n*  Android 应用名称或包名需要与 Android Manifest\
  \ 中的 `IntentFilter` 中使用的属性一致。\n* 角色邮箱是一个 Google 账号邮箱地址（例如 Gmail 账号），你将用它从服务器发送消息。建议为此创建一个新账号。\n\
  \n![note](img/note.gif)角色邮箱也称为发送者 ID。重要的是不要与你测试设备的“接收者”邮箱使用相同的邮箱，否则将接收不到消息。最稳妥的方法是专门为服务器创建一个。\n\
  \n***\n\n在 Google 注册后，你就可以开始向之前创建的应用程序发送 C2DM 消息了。\n\n在你的服务器上，你可以使用任何编程平台来发送消息，因为将这些消息传递到\
  \ Google 服务器的机制是简单的 HTTP 协议。\n\n向 Google 服务器发送 C2DM 消息需要几个步骤：\n\n1. 你需要对 [`www.google.com/accounts/ClientLogin`](http://www.google.com/accounts/ClientLogin)\
  \ URL 构建 HTTP POST。如果你在请求中发送了正确的数据，HTTP 响应体将包含包含 `AuthID` 的字符串。此请求应包含以下 POST 请求变量：\n\
  \n* `Email` 是加入 Google 名单的发送者邮箱。\n* `Passwd` 是登录发送者邮箱账号的 Google 账号密码。\n* `accountType`\
  \ 的值应该是 `GOOGLE_OR_HOSTED`。\n* `service` 的值应该是 `ac2dm`。\n* `source` 应该是你加入 Google\
  \ 名单的应用程序 ID 或包名。\n\n\n\n\n\n## 2. 使用你的 `AuthID`，你需要为你想要发送的每个 C2DM 消息构建另一个 HTTP\
  \ post 请求。此请求应包含以下几部分信息：\n\n### HTTP 请求头：\n\n* `ContentType` 为 `application/x-www-form-urlencoded`。\n\
  * `UserAgent` 是用于向 Google 唯一标识你的服务器应用程序的字符串。\n* `Authorization`: `GoogleLogin auth=<authID>`，其中\
  \ `<authid>` 是你在上一个 HTTP 请求响应中收到的 `AuthID`。\n\n### HTTP post 请求变量：\n\n* `registration_id`\
  \ 是你想要发送消息的设备的注册 ID。\n* `collapse_key` 是你可以使用的值，用于折叠具有相同键的的消息，以便只显示最新的一条。必须提供此值。\n\
  * `delay_while_idle` 如果为 `true`，则表示 `C2DM` 应仅在设备空闲时投递消息。\n* `data.<any_name>`，其中\
  \ `<any_name>` 指定键值对中的键，该键将作为额外数据传递到你的 `C2DM` Android 应用程序收到的 intent 中。这是从服务器向你的应用程序传递小段数据的方法。\n\
  \n你可以在 Google 的官方 C2DM 文档中找到关于 C2DM 服务器协议的更多信息：[`code.google.com/android/c2dm/index.html#server`](http://code.google.com/android/c2dm/index.html#server)。\n\
  \n![note](img/note.gif)一个名为 `C2DM-Sharp` 的开源项目 ([`github.com/Redth/C2DM-Sharp`](https://github.com/Redth/C2DM-Sharp))\
  \ 包含了用于从服务器发送 C2DM 消息以及在你的 Mono for Android 应用中接收消息的库。\n\n***\n\nListing 11.14 包含了一个如何使用\
  \ C# 代码通过 Google 服务器发送 C2DM 消息的完整代码示例。你可以从服务器或本地机器运行此示例；它不需要在 Android 设备上运行。这就是你如何从\
  \ Web 服务发送通知的方法。如果你使用此示例，请务必更改前四个变量以反映你自己的数据。特别是，确保你的 `registrationId` 是从你的 Android\
  \ 应用程序成功注册 C2DM 服务器返回的有效值。\n\n![download](img/download.gif) Listing 11.14: 发送 C2DM\
  \ 消息\n\n```csharp\nvar googleSender = \"sender@gmail.com\";\nvar googlePassword\
  \ = \"password\";\nvar registrationId = \"registrationid\";\nvar message = \"Hello\
  \ from C2DM!\";\n\nvar authUrl = @\"https://www.google.com/accounts/ClientLogin\"\
  ;\nvar c2dmUrl = @\"https://android.apis.google.com/c2dm/send\";\n\ntry\n{\n   \
  \ // 首先，让我们获取身份验证代码 - 需要 Google 凭据\n    var sb = new StringBuilder();\n    var kvp\
  \ = new NameValueCollection();\n    kvp.Add(\"accountType\", \"GOOGLE\");\n    kvp.Add(\"\
  Email\", googleSender);\n    kvp.Add(\"Passwd\", googlePassword);\n    kvp.Add(\"\
  service\", \"ac2dm\");\n    kvp.Add(\"source\", \"long2know.chapter11.c2dm\");\n\
  \n    foreach (string key in kvp.Keys)\n        sb.Append(string.Format(\"{0}={1}&\"\
  , key, kvp[key]));\n\n    var encoding = new ASCIIEncoding();\n    byte[] data =\
  \ encoding.GetBytes(sb.ToString());\n\n    var myRequest = (HttpWebRequest)WebRequest.Create(authUrl);\n\
  \    myRequest.Method = \"POST\";\n    myRequest.ContentType = \"application/x-www-form-urlencoded\"\
  ;\n    myRequest.ContentLength = data.Length;\n    Stream newStream = myRequest.GetRequestStream();\n\
  \    newStream.Write(data, 0, data.Length);\n    newStream.Close();\n\n    var sr\
  \ = new StreamReader(myRequest.GetResponse().GetResponseStream());\n    string readResponse\
  \ = sr.ReadToEnd();\n\n    // 解析身份验证\n    Regex regAuth = new Regex(@\"Auth=(.+)\"\
  , RegexOptions.IgnoreCase);\n\n    Match matchAuth = regAuth.Match(readResponse);\n\
  \n    string auth = string.Empty;\n\n    if (matchAuth.Success)\n        auth =\
  \ matchAuth.Groups[0].Value;\n    else\n    {\n        throw new WebException(\"\
  Could not authenticate.\",\n            new Exception(\"Failed to retrieve auth,\
  \ sid, or lsid\"));\n    }\n\n    // 在此阶段忽略 SSL 异常\n    ServicePointManager.ServerCertificateValidationCallback\
  \ +=\n        new RemoteCertificateValidationCallback((sender, cert, chain, policyErr)\
  \ =>\n        {\n            return true;\n        });\n\n  // 最后，让我们发送消息\n    sb\
  \ = new StringBuilder();\n    kvp = new NameValueCollection();\n    kvp.Add(\"registration_id\"\
  , HttpUtility.UrlEncode(registrationId));\n    kvp.Add(\"delay_while_idle\", \"\
  false\");\n    kvp.Add(\"collapse_key\", \"chapter11c2dm\");\n    kvp.Add(\"data.message\"\
  , HttpUtility.UrlEncode(message));\n\n    foreach (string key in kvp.Keys)\n   \
  \     sb.Append(string.Format(\"{0}={1}&\", key, kvp[key]));\n\n    var encoding\
  \ = new ASCIIEncoding();\n    byte[] data = encoding.GetBytes(sb.ToString());\n\n\
  \    var myRequest = (HttpWebRequest)WebRequest.Create(c2dmUrl);\n    myRequest.Headers.Add(HttpRequestHeader.Authorization,\n\
  \        string.Format(\"GoogleLogin {0}\", auth));\n    myRequest.Method = \"POST\"\
  ;\n    myRequest.ContentType = \"application/x-www-form-urlencoded\";\n    myRequest.ContentLength\
  \ = data.Length;\n    Stream newStream = myRequest.GetRequestStream();\n    newStream.Write(data,\
  \ 0, data.Length);\n    newStream.Close();\n\n    var sr = new StreamReader(myRequest.GetResponse().GetResponseStream());\n\
  \    string readResponse = sr.ReadToEnd();\n\n    string id = string.Empty;\n  \
  \  Regex regId = new Regex(@\"id=(.+)\", RegexOptions.IgnoreCase);\n    Match matchId\
  \ = regId.Match(readResponse);\n\n    if (matchId.Success)\n    {\n        id =\
  \ matchId.Groups[0].Value;\n\n        Console.WriteLine(string.Format(\"Received\
  \ response: {0}\", id));\n    }\n    else\n    {\n        Console.WriteLine(string.Format(\"\
  Invalid response: {0}\",\n            readResponse));\n    }\n\n}\ncatch (WebException\
  \ e)\n{\n    Console.WriteLine(string.Format(\"Web Exception: {0}\", e.InnerException));\n\
  }\n```\n此代码包含在 Chapter11j.C2DM.Sending\\Program.cs\n\n# 总结\n\n在本章中，你学习了服务的生命周期以及为什么服务对应用程序的架构至关重要。你学习了如何创建一个简单的服务，并看到它们并不是多线程的，而是类。你通过\
  \ `System.Threading` 和 `System.Threading.Tasks` 让你的服务支持多线程。学习如何实现 `IntentService`\
  \ 让你能够轻松地创建多线程服务，并处理来自 `BroadcastReceiver` 的 intent。\n\n你涵盖了如何创建通知与用户交互，并通过多种方法实现了服务之间的通信。你还涵盖了如何创建高效的的闹钟，以定期向你的\
  \ `BroadcastReceiver` 和服务发送意图。\n\n最后，你介绍了 `C2DM`。你了解了它为什么重要以及如何在你的应用程序中使用它。现在你应该对在自己的应用程序中使用服务充满信心。\n\
  \n# 第 12 章\n\n## Canvas 和 Drawable：构建自定义 Android 图形\n\n## 本章内容：\n\n* 使用 `Canvas`\
  \ 对象\n* 理解绘图过程和播放器\n* 创建、动画和变换自定义图形\n* 通过 `SurfaceView` 优化性能\n* 理解 drawable\n* 将\
  \ drawable 作为 XML 资源\n* 创建基本形状和颜色\n* 创建复合 drawable\n* 响应事件\n\n本章将深入探讨使用 Mono for\
  \ Android 创建自定义图形的过程。特别地，我们将不仅深入讨论用于创建自定义图形的各种工具，还将讨论何时以及为何使用它们。\n\n\n\n\n\n本章的重点是在你对\
  \ Android 平台基础理解的基础上，进一步实现更高级的效果，例如动态绘制图形、创建动画以及制作更具交互性的界面。特别地，本章将详细介绍 Android 中提供的\
  \ `drawable` 包的设计与实现。最后，我们将触及开发者在处理动画图形时经常遇到的几个不同但常见的高级任务。\n\n本章将帮助你对 Android 图形模型有一个清晰的理解。此外，本章还涵盖了完成单项任务的多种方法，并解释了为什么某些方法在性能、可维护性以及工具集的整体灵活性方面可能优于其他方法。\n\
  \n# 在 Mono for Android 中处理图形\n\n在 Mono for Android 中处理图形时，你有多种选择。与任何方法一样，每个选项都有其优缺点，并且在复杂性和灵活性上有所不同：\n\
  \n* 第一个选项是你可能已经熟悉的——与视图（view）对象和应用程序资源一起工作。`ImageView` 和 `Gallery` 等视图允许开发者在应用程序中快速利用图形资源，但是以牺牲灵活性为代价的。通常，这种方法涵盖了大多数应用程序用例，让你能够深入开发交互式且吸引人的应用程序过程。\n\
  \n* 下一个选项是 `canvas` 方法，它涉及到更深入研究视图对象，并开始自定义和扩展视图 `OnDraw()` 方法的底层逻辑。特别是，此选项要求开发者对利用\
  \ `canvas`、` bitmaps` 以及不同的图形原语（graphic primitives）有基本的理解。在某种意义上，你可以将其视为“低级”方法，因为你需要负责在图形传递给\
  \ UI 之前精确地定义它的每一个方面。诚然，有很多工具可以帮助你完成这一过程，但在创建或销毁图形资源时，对性能做出明智决策取决于开发者。不言而喻，当使用这种方法创建图形时，性能是一个很大的考虑因素。经验丰富的开发者可以创建出一些令人惊叹的设计，但一个不谨慎的开发者可能会导致巨大的性能问题，破坏图形的视觉效果。\n\
  \n* 最后一种利用图形的方法是通过通过 drawables 使用 Android 内置的自定义 2D 图形库。该库的目的是增加图形控制的灵活性，同时消除直接管理将图形写入到屏幕上逻辑的某些复杂性。\n\
  \n在使用 `canvas` 方法或使用系统级 drawables 时，你需要理解每种方法的优缺点。尽管它们在功能上有很大重叠，但它们的应用可能完全不同。例如，`canvas`\
  \ 方法通常是视频游戏设计师或对图形要求极高的应用程序的首选方法。通过控制各种资源的创建、生命周期和销毁，开发者可以将 Android 设备推向极限。\n\n\
  另一方面，drawables 贯穿于整个 Mono for Android 框架。它们不仅暴露了一组用于处理图形本身的方法，还被许多框架级的方法和过程所接受。这使得\
  \ drawables 成为在整个应用程序中传递图形指令的一种高效且方便的方式。\n\n![note](img/note.gif) 尽管图形是 Android\
  \ 库的一个核心方面，但关于这一主题的文档相当稀少。在不同版本之间，图形库进行了多次修改和添加，这进一步加剧了该问题。当然，处理这一问题的关键在于保持足够的耐心，并拥有一些出色的资源（例如这本书！）。此外，Android\
  \ 中的图形对象工作方式与 HTML5 中的对象非常相似，例如 HTML5 的 `canvas`。在这种情况下，你也可以参考文档来帮助理解这些对象在 Android\
  \ 中如何工作，因为 Android 遵循了许多相同的命名规范和通用功能。\n\n***\n\n## 使用 Canvas 对象\n\n在 Mono for Android\
  \ 中处理图形的主要选项之一是直接处理图形输出本身，而不是依赖抽象。这种方法在性能和可用性方面为你提供了极大的灵活性。此外，只要你对图形如何渲染有基本的理解，这种方法并没有过度复杂。通过遵循一些基本规则，你可以创建出色的应用程序和游戏。\n\
  \n使用 `Canvas` 对象来绘图取决于几个关键项的交互。这些项包含了以下内容：\n\n* 图形原语是描述绘图不同格式或指令的通用方式。`View` 对象作为请求应用程序触发的各种事件的容器。在自定义\
  \ `Canvas` 对象时，视图的 `OnDraw()` 方法作为绘图命令的重写。\n\n* `Canvas` 对象代表了你可以传递图形指令的接口。它包含了连接图形原语与\
  \ `Bitmap` 的工具。\n\n* `Paint` 对象代表了应用于大多数图形原语的抽象样式定义。这种效果包括颜色、边框和透明度。\n\n* `Bitmap`\
  \ 对象是 `canvas` 绘制的底层图像。在 `canvas` 完成工作后，`Bitmap` 对象将以合适的比例展示。\n\n理解这些项目之间的关系至关重要，因为它是\
  \ Mono for Android 中几乎所有图形工作的基础。图 12.1 描绘了这种关系。\n\n![12.1](img/c12f001.jpg)\n\n\
  ## 图形原语\n\n图形原语是描述绘图不同格式或指令的通用方式。这是一个定义较为松散的工具组，其目标统一为绘制。框架中有几种不同类型的基础原语。\n\n表 12.1\
  \ 列出了许多基础原语。虽然某些用途是显而易见的，但对每个可用选项都有工作知识是很有用的。你可能会发现项目之间存在功能重叠，例如 `path` 和 `shape`。你可以通过\
  \ `Path` 对象表示几乎任何形状，但这要量得多，而且你将失去 `shape` 对象拥有的所有额外变换方法的优势。\n\n\n\n\n\n| 形状对象 |\
  \ 形状对象包括椭圆、圆形和矩形等基础几何形状。这些形状可以使用 `Canvas` 对象定义，但不应将它们与 `Android.Graphics.Shapes`\
  \ 命名空间中的对象混淆，后者用于绘制资源（drawables）。 |\n| 颜色 | 在 Mono for Android 中，颜色有多种表示方式。在这种情况下，颜色原始类型通常通过\
  \ alpha、红、绿、蓝 (ARGB) 整数值表示。 |\n| 图像 | 当直接操作 `Canvas` 对象时，图像格式最终通过多功能的位图（bitmap）类来表达。使用\
  \ `BitmapFactory` 对象可以将 PNG 和 JPEG 等资源转换为相应的位图格式。 |\n| 路径、点、弧和线 | 路径、点、弧和线是根据底层坐标定义的对象。通过使用提供的点，框架可以渲染完整的形状，为您创建自定义的可缩放艺术品提供了极大的灵活性。\
  \ |\n| 文本 | 虽然文本看起来可能不是图形原语，但“文本艺术”是最常用的绘制任务之一。通过将文本作为图形原语，开发者可以以最小的精力自定义 Logo 和文本艺术，允许通过不同的渐变或倾斜过滤器进行独特的交互，从而创建独特的文本呈现。\
  \ |\n\n图形原语提供了编写整洁、高性能代码的最佳机会。实例化或启动图形原语的过程是非常昂贵的，因此应该始终谨慎处理。例如，将图形描述保留在内存中比在每次请求时重新创建它要便宜得多。\n\
  \n## Canvas 对象\n\n画布（Canvas）作为开发者向底层 `Bitmap` 对象传达图形意图的接口。尽管听起来可能是一个复杂的过程，但由于画布暴露了许多不同的绘制函数，每个函数都支持不同的图形原语，这大大简化了操作。\n\
  \n`Canvas` 对象命名为此并非偶然。原因在于它可以将此对象想象成艺术家的画布。每次调用 `drawX()`，平台都会在画布上创建另一层油漆，这些层最终将成为应用程序的背景。`draw`\
  \ 方法可以被调用多次并使用不同的原语。这提供了极大的灵活性，因为你不再限于使用单一原语来表达图形。画布工作原理的另一个良好类比是将其认为支持多个图层，类似于\
  \ GIMP、Paint.NET 和 Photoshop 等不同的绘画应用程序。\n\n`Canvas` 对象还有两个重要的函数：`Save()` 和 `Restore()`。这些函数的目的是创建当前画布状态的快照以便以后访问。本质上，可以保存一个完成了一组绘制的\
  \ `Canvas` 对象，然后对其尽可能进行修改，最后通过 `Restore()` 方法完全恢复到之前的保存状态。尽管这听起来可能是一个微小的成就，但在处理重复模式或颜色时，它是减少代码杂乱和增加可读性的极佳方法。最后，在正确的上下文中使用这些方法可以提高应用程序性能。\n\
  \n最后，`Canvas` 对象暴露了一些功能，允许开发者平、倾斜或调整图形的底层矩阵。通过使用画布的 `translate()` 和 `skew()` 方法，你可以重构和变形画布绘制，而无需承担创建\
  \ `Canvas` 对象或图形原语的开销成本。这很快后也将进行详细介绍。\n\n![note](img/note.gif)当在使用 `Canvas` 对象进行不同的高级策略时，你需要熟悉\
  \ `Matrix` 对象以及它如何与画布相关。`Matrix` 对象表示一个矩形数组或数字表格（对于 Mono for Android，它是一个 3x3 的矩阵维度）。矩阵可用于各种任务。它通过保持形状上点之间的相对距离和共线性，用于实现从一个对象到另一个对象的精确变换。这被称为仿射变换（affine\
  \ transformation）。使用这种技术，框架可以对单个图形应用许多变换，无论该变换是旋转、缩放、裁剪、反射还是倾斜。你可以在此处阅读更多关于矩阵和仿射变换的信息：\n\
  \n* 维基百科—变换矩阵：[`en.wikipedia.org/wiki/Transformation_matrix`](http://en.wikipedia.org/wiki/Transformation_matrix)\n\
  * 维基百科—仿射变换：[`en.wikipedia.org/wiki/Affine_transformation`](http://en.wikipedia.org/wiki/Affine_transformation)\n\
  \n即使你没有机会直接在画布中使用矩阵，对调用 `translate()`或其他变换方法时发生了什么有一个良好的理解也是好处。\n\n***\n\n## Paint\
  \ 对象\n\n`Paint` 对象代表可以应用于图形原语的样式效果。在某种意义上，“油漆”一词是对 `Paint` 类能做的一切内容的极大简化。在最基础的，`Paint`\
  \ 类可以表示颜色。在此基础上，油漆可用于表达如着色器（shaders）、透明度、笔触、抗锯齿、掩码、颜色过滤器以及许多其他效果等概念。\n\n当你在 `Canvas`\
  \ 对象结合使用 `Paint` 对象时，`Paint` 对象通常被视为与它将应用的 `Shape` 对象分离的资源。这是因为它允许显著的关注点分离。此外，单个\
  \ `Paint` 对象可以帮助定义无限不同的图形原语，无论它们是文本、图像还是路径。在 HTML 设计中，你可以将画布看作 HTML 标记，而将 `Paint`\
  \ 对象看作 CSS 布局。\n\n除了 `Paint` 对象的通用功能外，它还有几个处理与基于文本的原语相关的处理方法。`Paint` 对象通过提供许多协助文本绘制、测量和样式化的工具，极大地扩展了生成“文本艺术”的能力。\n\
  \n当你使用 `Paint` 对象时，最重要的选择之一是是否使用抗锯齿（antialiasing）。这是一个“欺骗”眼睛的过程，使其认为文本或图像边缘是平滑的，而不是由生硬的正方形边缘组成的。为了实现这一点，系统采用了许多技术，例如采样和混合，或使用轻微的颜色失真。虽然这极大地提高了图形的整体质量（对于文本则是可读性），但是以性能为代价的。在处理许多对象时，你应该谨慎使用抗锯齿，尽管文本图形通常是一个很好的目标。列表\
  \ 12.1 是如何使用 `Paint` 对象为文本段落绘制样式的基本示例。\n\n![download](img/download.gif) 列表 12.1:\
  \ 使用 `Paint` 对象\n\n```\nPaint p = new Paint()\n{\n     AntiAlias = true,\n     Color\
  \ = Color.CornflowerBlue,\n     TextSize = 20,\n     UnderlineText = true\n};\n\n\
  canvas.DrawText(\"Mono for Android is awesome!\", 10, 10, p);\n```\n\n## Bitmap\
  \ 对象\n\n如果说画布是通信图形的媒介，那么 `Bitmap` 对象就是从这种通信中产生的最终艺术品。当绘制方法完成后，是由 `Bitmap` 对象呈现给用户界面，因此呈现给终端用户的。在使用画布时，`Bitmap`\
  \ 对象始终是必须的。\n\n\n\n\n\n位图图形原元与 `Canvas` 对象在其上绘制的 `Bitmap` 对象之间的区别可能会让人感到困惑。事实上，它们之间并没有区别。`Bitmap`\
  \ 对象包含了向最终渲染图像中的每个像素写入数据所需的工具。因此，它本质上是所有图形类型之间的最小公约数。\n\n在大多数情况下，你可能不需要直接与 `Bitmap`\
  \ 对象进行工作。然而，如果确实有需求，也完全有工具来手动微调和配置画布的底层位图。这通过创建一个新的 `Bitmap` 对象，根据规范对其调整，然后将其作为原元传递给相应的\
  \ `Canvas` 对象来实现。此外，你也可以简单地创建一个新的 `Canvas` 对象，并将位图实例传递给它。\n\n位图允许你直接处理一些相当高级的话题，例如不同的压缩技术（`.png/.jpg`）、直接请求位图中的每个字节或像素、不同的缩放场景以及其他一些工具。正如你所想象的，这些工具非常强大，但它们的使用场景超出了本章的范畴。\n\
  \n## 整合一切\n\n现在你已经了解了这些基础参与者，我们可以看到它们是如何运行的。当然，理解 `Canvas` 对象及其相关组件的最佳方法是亲手操作。接下来的章节通过展示一个用例场景并引导完成构思、创建和完成自定义图形的整个过程来实现这一点。\n\
  \n## 路径（Path）入门\n\n在我们介绍创建自定义图形之前，你应该先熟悉 `Path` 对象。接下来的示例使用 `Path` 对象作为它们主要的图形原元。这样做不仅是为了展示一种较复杂的图形原元之一，还为了模拟在最底层创建图形原元的过程。如果你已经熟悉了\
  \ `Path`，可以随时跳到下一节。\n\n路径是简单的几何指令，通过定义一系列不同的点，然后指定从一个点到另一个点绘制线条或曲线来构建的。每个定义的点代表图形上的一个位置，当前线条或曲线的流在此改变。\n\
  \n在选择点之后，可以使用 `Path.LineTo(pointX, pointY)` 定义简单的路径，以指定绘制线的方向和距离。在列表 12.2 中，`Path`\
  \ 对象被用于构建一个简单的正方形。\n\n![download](img/download.gif) 列表 12.2: 使用 `Path` 对象创建基础形状\n\
  \n```\npublic class Square:View\n{\n     public Square(Context context) : base(context)\
  \ { }\n\n     protected override void OnDraw(Canvas canvas)\n     {\n          Path\
  \ SquarePath = new Path();\n\n          SquarePath.LineTo(50, 0);\n          SquarePath.LineTo(50,\
  \ 50);\n          SquarePath.LineTo(0, 50);\n\n          SquarePath.Close();\n\n\
  \          canvas.DrawPath(SquarePath, new Paint(){ Color = Color.CornflowerBlue});\n\
  \     }\n}\n```\n\n`Graphics_Canvas\\Graphics_Canvas\\Square.cs`\n\n这段代码中首先要注意一个继承自\
  \ `View`类的类。在视图内部，重写了 `OnDraw()` 方法来接管画布绘制方法。通常，这是在画布上直接绘制的典型技术。如果将此视图添加到应用程序并加载，你将看到一个小小的正方形。\n\
  \n观察 `Path` 对象，有几个命令指示移动，例如 `LineTo()`、`MoveTo()`、`QuadTo()`、`CubicTo()` 和 `ArcTo()`。这些动作每一个都代表从当前点到指定点的移动。除非发生更改，否则\
  \ `Path` 对象假设绘制的起始点位于画布的原点 `Point(0,0)`。\n\n`Path.Close()` 函数用于关闭当前轮廓。如果不在原点上调用\
  \ `Close()` 方法，则会在结束点和原点之间绘制一条线。\n\n![warning](img/warning.gif)在图形领域处理点时，千万不要犯将它们与代数中使用的笛卡尔平面点混淆的错误。当你处理图形时，y\
  \ 轴与笛卡尔平面是反向的。这意味着画布右下部分的 `(x,y)` 坐标是`(+)`，而左上部分的 `(x,y)` 坐标是`(-,-)`，如图图 12.2\n\n\
  ![12.2](img/c12f002.jpg)\n\n## 案例 1：创建自定义图形\n\n假设你最近被聘入 W3C（万维网联盟）开发团队。最近，许多人对即将推出的\
  \ HTML5 规范表现出兴趣。事实上，你在 W3C 的同事们创建了一个具有视觉吸引力的图形来代表 HTML5，以此作为帮助推广这一新领域的方式，如图 12.3\n\
  \n![12.3](img/c12f002.jpg)\n\n在一个新的 Android 项目中，添加一个名为 `HTML5Logo` 的新类。与之前的示例一样，`HTML5Logo`\
  \ 类需要继承自 `View` 以访问 Canvas。为了完成继承，请添加适当的构造函数并重写 `OnDraw()` 方法。完成后，该类应该看起来像列表 12.3。\n\
  \n![download](img/download.gif) 列表 12.3: 为 HTML5 创建自定义视图\n\n```c\npublic class HTML5Logo\
  \ : View\n{\n\n     protected Context _context;\n\n     public int Scale { get;\
  \ set; }\n\n     public HTML5Logo(Context context, int Scale) : base(context)\n\
  \     {\n          this._context = context;\n          this.Scale = Scale;\n   \
  \  }\n\n     protected override void OnDraw(Canvas canvas)\n     {\n\n     }\n}\n\
  ```\n\n`Graphics_Canvas\\Graphics_Canvas\\HTML5Logo.cs`\n\n除了默认结构外，还添加了 `Scale`\
