  \ Jennifer 的理解和鼓励。\n\n感谢 Wrox 团队让我为这本书贡献，感谢 `Mono` 团队通过 `Mono` for Android 创造了了的产品，感谢整个\
  \ `MonoTouch` 和 `Mono` for Android 社区如此出色！\n\n— Chris Hardy\n\n## 前言\n\n`Mono` for\
  \ Android 是两个迷人且极其有趣世界的结合：`C#` 语言和 `Android` 操作系统。我们设计 `Mono` for Android 是为了将这两个宇宙结合，我们通过利用在语言、API\
  \ 和绑定方面的多年经验实现了这一点。\n\n我们对 `Android` 操作系统的热情非常容易解释：和大家一样，我们被该平台的增长率、深思熟虑的设计以及强大的开发平台所吸引。这种组合难以拒绝。\n\
  \n我们对 `C#` 的喜爱可以追溯到 2000 年，当时微软向世界推出了他们的新语言。就像 `C#` 震撼了 Windows 世界一样，它也震撼了我们的世界。\n\
  \n\n\n\n我们当时在一个竞争激烈的领域中开发软件，我们需要更快地生产软件，并减少开发人员数量。一种方案是更加努力、增加工作时间。相反，我们选择了提升编程水平：我们将性能敏感的代码保留在\
  \ `C` 中，并为高级语言生成了供开发者利用的绑定（bindings）。\n\n当微软宣布 `C#` 和 `.NET` 框架时，这种语言成为了一种立即改进，提升了编程水平。`.NET`\
  \ 框架确保了我们的手不会受限于单一语言，同时也确保了我们可以继续重用任何我们用 `C` 或 `C++` 编写的现有代码。`C#` 让世界（包括我们自己）的生产力大大提高。\n\
  \n多年来，`Mono` 在所有可能的方向上成长。它迅速渗透到了最初的桌面舒适区之外，被应用于从嵌入式控制器到 MP3 播放器、服务器、视频游戏和工业控制的所有设备上。\n\
  \n`MonoTouch` 的诞生完全是为了用户的需求。在 2008 年和 2009 年间，我们的主邮箱地址被将 `Mono` 引入 iPhone 的请求淹扰，到\
  \ 2009 年夏天，我们已经有了一套全栈方案，并在该年秋季发布。到 2010 年初，我们收到了大量开发者的请求，要求扩展我们的工具包以在支持现有 `iOS`\
  \ 的之外也支持 `Android` 平台。仅仅一年后，我们就发布了针对 `Android` 的 `Mono`，配备了完整的尖端 API，并能够使用 `Visual\
  \ Studio 2010` 编写 Android 应用程序。在如此短的时间取得了如此遥远的进展，简直令人惊叹。\n\n本书的作者是 `Mono` for `Android`\
  \ 的早期 Beta 测试人员之一：他们在 `Mono` for `Android` 发布的第一几天就在现场，他们探索了原始的 API 设计，他们帮助我们塑造了最终产品，并且继续帮助我们在针对\
  \ `Android` 操作系统进行开发时优先考虑开发者最关心的事项。\n\n你可能已经认识其中一些作者：\n\n-   **Wally McClure** 因为对\
  \ `MonoTouch` 以及现在的 `Mono` for `Android` 感兴趣而成为 `Mono` 的新信徒。他以纪录的速度发布了第一本 `MonoTouch`\
  \ 电子书，并是第一本出版的 `MonoTouch` 书籍的主作者。这两本书都帮助数以千名的开发者在 `MonoTouch` 最初发布后的几个月内就在 iPhone\
  \ 上运行了应用程序。\n-   **Chris Hardy** 在 `Windows/ASP.NET` 领域闻名，同时也是 `MonoTouch` 和 `Mono`\
  \ for `Android` 社区中非常活跃的成员。他在 2011 年加入了 `Xamarin`，到目前为止已与大量开发者交流以帮助他们改进应用程序，并在 `Xamarin`\
  \ 邮件列表、论坛、`Stack Overflow` 和 IRC 上回答了无数问题。Chris 以只有曼彻斯特摇滚手才能表现出的热情投入到 `MonoTouch`\
  \ 和 `Mono` for `Android` 的工作中。他还为 Scott Hanselman 的播客“Hanselminutes”创建了开源的 `MonoTouch`\
  \ iPhone 应用程序，并广受好评。\n-   **Jon Dick** 是一位数据库管理员和软件开发人员，自 `.NET` 的 Beta 时代起就一直在工作。他现在专注于移动应用程序开发，并编写了多款\
  \ `MonoTouch` 应用程序。他目前维护着用于 `Apple iOS` 推送通知和 `Google Android` 云到设备消息（`APNS-Sharp`\
  \ 和 `C2DM-Sharp`）的开源 `.NET` 库，同时贡献于其他专注于移动端的项目，如 `MonoTouch.Dialog` 和 `MonoDroid.Dialog`。\n\
  -   **Nathan Blevins** 自 2004 年起从事 `ASP.NET` 和 `C#` 开发。在过去的几年里，Nathan 的工作包括 `Android`、`Blackberry`\
  \ 和 `Windows Phone 7` 等移动开发平台。\n-   **John Croft** 花了多年时间为大公司提供咨询，包括 `Coca-Cola`、`BellSouth`\
  \ 和 `MCI`，主要从事涉及 `C` 和 `C++` 编程以及面向对象的系统分析。随后 John 在自己的技术公司 `Computing Solutions`\
  \ 工作涵盖了从大型数据库、执行信息系统到碎石击仪控制和卫星遥测的所有领域。接着，`Computing Solutions` 与 `McClure Development`\
  \ 合并成为 `Scalable Development, Inc.`，John 的工作包括涉及 `Java`、`C#` 和 `.NET` 应用程序的项目。此外，John\
  \ 还合著了另外两本关于 `.NET` 编程的书。目前，John 是 `Turner Broadcasting Systems` 的高级技术经理。\n\n使用\
  \ `C#` 和 `Android` 操作系统构建应用程序真的是两者的兼得。你获得了一个强类型、类型安全、垃圾回收的语言，拥有用于移动应用程序最热门的 API，以及为\
  \ `Android` 以及 `.NET` 中的 `C#` 原生创建的最佳库。\n\n我将交给 Wally、Chris、Jon、Nathan 和 John 照顾。\n\
  \n— Miguel de Icaza\n首席技术官\n`Xamarin, Inc.`\n\n# 引言\n\n自 2008 年秋季引入以来，`Android`\
  \ 已经成长并成熟到目前成为全球出货量第一的智能手机平台。随着这种增长，人们对编写在设备上原生运行并利用设备功能（如摄像头和语音识别）的应用程序的兴趣日益增加。\n\
  \n自 2002 年 1 月发布 `.NET Framework` 以来，其增长令人印象。它是目前最流行的开发框架。在 `.NET Framework` 处于初始开发期间，就于\
  \ `Ximian` 的 Miguel de Icaza 创建了他自己的 `C#` 编译器，从此诞生了 `Mono` 框架。2003 年，`Novell` 收购了\
  \ `Ximian`。2011 年，`Attachmate` 收购了 `Novell`。2011 年后期，`Xamarin` 成立，所有与 `Mono`、`MonoTouch`、`Mono`\
  \ for `Android` 以及 `MonoDevelop` 相关的产品都转移到了 `Xamarin`。对于开发者来说，`Xamarin` 专注于 `Mono`\
  \ for `Android` 和 `MonoTouch`，并使其成为 `Android` 和 `iPhone` 开发的最佳产品。在此期间，`Mono` 框架已跨平台运行。最初，`Mono`\
  \ 设计为运行在 `Linux`。从那时起，`Mono` 扩展到了多个平台。2009 年夏天，发布了 `MonoTouch` 框架。允许开发者使用 `.NET\
  \ Framework` 并使用 `C#` 语言编写用于 iPhone 的应用程序。2010 年 2 月，de Icaza 在博客上确认 `Mono` 团队正在开发一个与\
  \ `MonoTouch` 概念相似的 `Mono` for `Android` 实现。\n\n\n\n\n为移动设备编写应用程序的一个困扰是，开发者需要为 iPhone\
  \ 编写 `ObjectiveC` 应用程序，为 Android 编写 `Java` 应用程序，为 Windows Phone 7 编写 `Silverlight/.NET`\
  \ 应用程序。开发这些平台的时间和成本是非常巨大的。如果一个团队决定为每个平台分别编写 `ObjectiveC`、`Java` 和 `Silverlight/.NET`\
  \ 应用程序，那么在这些平台之间共享代码将是不可能的。坦率地说，`Mono` 平台允许开发者在这些平台之间共享业务逻辑。想象一下，有一个与 Amazon Web\
  \ 服务的交互类库可以在所有平台上使用。当你在一个平台中添加某些新功能时，所有平台都会获得该功能。当某个平台修复了 bug 时，该修复将适用于所有平台。\n\n\
  `Mono` 平台允许你使用已经熟悉的语言来目标多个平台。这对于开发者和开发经理来说都是一件好事。为设备构建原生应用并在多个平台之间复用相同代码的想法非常有吸引力。这无疑将降低构建移动应用并将其推向多个市场的成本。哪个开发者、经理或企业会不喜欢此呢？\n\
  \n# 本书的适用读者\n\n本书适用于希望使用现有知识创建用 `.NET/C#` 编写的原生 Android 应用程序的 `.NET` 开发者。`.NET`\
  \ 开发者总是学习，但他们知道学习 `Java`、`Eclipse` 以及 Android 的细节可能会令人 overwhelming。对 `Mono for\
  \ Android` 感兴趣的开发者会意识到，使用他们熟悉的语言快速针对 Android 开发，其成本很容易抵消。\n\n本书面向目标为 Android 的 `.NET`\
  \ 开发者。它的设计目的是让你快速熟悉 Android，而不是教你 .NET Framework 或 C# 语言。\n\n第 1 章到第 4 章包含介绍性材料；你应该按顺序阅读。这些章节介绍了\
  \ `Mono for Android` 产品、使用 `Mono for Android` 开发的基础知识、`Visual Studio` 插件和 `MonoDevelop`，以及使用屏幕和数据控制向用户展示数据的基础知识，以及如何为\
  \ Android 开发用户界面。当你熟悉了这些概念后，可能可以在不同章节之间移动，而不一定非要按顺序阅读。\n\n# 本书涵盖的内容\n\n本书涵盖了使用 `Mono\
  \ for Android` 进行 `.NET/C#` 开发。`Mono for Android` 允许开发者针对运行版本 1.6 及更高版本的 Android\
  \ 设备。这包括基于 Android 的平板电脑。除非另有说明，所有的开发都面向 Android 2.3（又名 Gingerbread）。在本书编写期间，Android\
  \ 2.3 是该平台部署最广泛的版本。然而，技术世界变化非常快。最近，Google 发布了 `Honeycomb`（又名 Android 3.x），这是针对平板电脑的\
  \ Android 版本。Android 3.x 在 2011 年期间在不同厂商的各种平板设备上发布。\n\n2011 年底，Google 发布了 `Android\
  \ 4.0`（又名 Ice Cream Sandwich，ICS）。这个版本的 Android 将针对手机优化的 2.x 系列与针对平板优化的 3.x 系列统一。遗憾的是，在本书编写期间，我们还没有\
  \ Android 4.0 ICS 设备来测试我们的代码。此外，Android 市场倾向于不会快速升级其设备。\n\n# 本书的结构\n\n本书基本上分为两部分。第\
  \ 1 章到第 4 章组成第一部分，涵盖了 `Mono for Android` 的精要内容。当你熟悉这些概念后，就可以进入第二部分。\n\n# 使用本书所需的条件\n\
  \n要成功使用本书，你需要几样东西：\n\n*   一台 Android 设备\n*   `SDK`\n*   一个 IDE\n*   `Mono for Android`\n\
  \n# 惯例\n\n为了帮助你充分利用这些内容并跟踪进展情况，我们使用了一些惯例。\n\n*   我们在引入新术语和重要词汇时使用*斜体*。\n*   我们会显示键盘按键操作，如\
  \ `Ctrl+A`。\n*   我们在文本中显示文件名、URL 和代码，例如：`persistence.properties`。\n*   我们以两种不同的方式展示代码：\n\
  \n```\n对于大多数代码示例，我们使用无高亮的等宽字体。\n我们使用粗体来强调当前语境下特别重要的代码。\n```\n\n# 源代码\n\n在学习本书中的示例时，你可以手动输入所有代码，也可以使用随书附的源代码文件。书中使用的所有源代码均可在\
  \ `www.wrox.com` 下载。\n\n下载代码后，使用你最喜欢的压缩工具对其进行解压。或者，你可以访问 Wrox 代码下载主页 `www.wrox.com/dynamic/books/download.aspx`\
  \ 查看此本书以及所有其他 Wrox 书籍的代码。\n\n\n\n\n![note](img/note.gif)\n再次请注意，我们尝试将您下载的代码以 Android\
  \ 2.3 为基础平台目标，但我们也确保了代码在 Android 4.0 上同样运行。此外，如果您在代码方面遇到无法解释的问题，对解决方案进行 `Clean`（清理）和\
  \ `Full Rebuild`（全量重建）通常可以解决这些问题。如果您有疑问，我们建议您尝试这种方法。\n\n# 勘误 (Errata)\n\n我们尽力确保文本或代码中没有错误。然而，没有人是完美的，错误在所避免。如果您在我们的书籍中发现错误（例如拼写错误或错误的代码），我们将不胜感激您的反馈。通过提交勘误，您可以为其他读者节省数小时的困扰。同时，您也将帮助我们提供更高质量的信息。\n\
  \n要找到本书的勘误页面，请访问 [www.wrox.com](http://www.wrox.com) 并使用搜索框或标题列表找到书名。然后，在书籍详情页上点击\
  \ `Book Errata` 链接。在该页面上，您可以查看所有提交给本书并由 Wrox 编辑器发布的勘误。包含每本书勘误链接的完整列表也可以在 [www.wrox.com/misc-pages/booklist.shtml](http://www.wrox.com/misc-pages/booklist.shtml)\
