  \n如你从 `com.google.android.maps.MapView` 标签的最后一行所看到的，有一个 `apiKey` 属性。这里你需要输入之前创建的\
  \ API 密钥。点击运行，你将看到类似图 13.9 所示的内容。\n\nFigure 13.9\n\n![13.9](img/c13f009.jpg)\n\n\
  # 使用叠加层使用 MapView 控制器\n\n`MapView` 有一个 `Controller` 属性，允许通过编程方式设置地图的和平和缩放。要做到这一点，你有几种可以使用的方法，例如\
  \ `SetZoom`，它接受一个介于 1（最宽、缩小最小）和 21（最近、放大最大）之间的整数。可以通过调用以下方法来使用：\n\n```\nmapView.Controller.SetZoom(5);\n\
  ```\n\n除了控制缩放外，你可能还想关注地图上的特定区域；这可以通过两种不同的方式实现。\n\n*   你可以使用 `SetCenter` 方法，它接受一个\
  \ `GeoPoint` 参数，作为你想要将地图居中的的位置。\n*   或者，你可以使用 `AnimateTo` 方法，它同样接受一个 `GeoPoint`\
  \ 参数，但这将平滑地从当前位置“飞”到设置的 `GeoPoint`，而不是直接跳转到该位置。\n\n要在地图上显示项目，你将需要使用一个叠加层（overlay），它将覆盖在当前地图之上，在你的应用程序中显示有用信息。Google\
  \ Maps API 提供了 `MyLocationOverlay` 供你使用，它会将用户的当前位置放置在叠加层上。要使用此叠加层，你需要创建一个 `MyLocationOverlay`\
  \ 类的新实例。你可以在 Listing 13.9 中看到这一点。\n\n![download](img/download.gif) Listing 13.9:\
  \ MapOverlayExample 布局文件\n\n```sharp\nusing System;\n\nusing Android.App;\nusing\
  \ Android.Content;\nusing Android.Runtime;\nusing Android.Views;\nusing Android.Widget;\n\
  using Android.OS;\nusing Android.GoogleMaps;\n\nnamespace MapOverlayExample\n{\n\
  \   [Activity (Label = \"MapOverlayExample\", MainLauncher = true)]\n   public class\
  \ Activity1 : MapActivity\n   {\n      MapView mapView;\n      MyLocationOverlay\
  \ myLocationOverlay;\n\n      protected override void OnCreate (Bundle bundle)\n\
  \      {\n         base.OnCreate (bundle);\n\n         // Set our view from the\
  \ \"main\" layout resource\n         SetContentView (Resource.Layout.Main);\n\n\
  \         mapView = FindViewById<MapView>(Resource.Id.mapView);\n         mapView.Controller.SetZoom(19);\n\
  \n         myLocationOverlay = new MyLocationOverlay();\n         mapView.Overlays.Add(myLocationOverlay);\n\
  \         myLocationOverlay.RunFirstFix(() => {\n            mapView.Controller.AnimateTo(myLocationOverlay.Location);\n\
  \         });\n      }\n\n      protected override void OnResume ()\n      {\n \
  \        base.OnResume ();\n\n         myLocationOverlay.EnableMyLocation();\n \
  \     }\n\n      protected override void OnStop ()\n      {\n         base.OnStop\
  \ ();\n\n         myLocationOverlay.DisableMyLocation();\n      }\n\n      #region\
  \ implemented abstract members of Android.GoogleMaps.MapActivity\n      protected\
  \ override bool IsRouteDisplayed {\n         get {\n            return false;\n\
  \         }\n      }\n      #endregion\n   }\n}\n```\n\n`MapOverlayExample\\MapOverlayExample\\\
  Activity1.cs`\n\n\n\n\n\n# 国际化与本地化\n\n*   **国际化**（Internationalization）是指从全球范围内使应用程序处理多种文化设置的过程，而无需针对任何特定区域进行专门设计。\n\
  *   **本地化**（Localization）是指通过应用程序代码和设置调整，专门针对目标区域，设计应用程序以满足该特定区域需求的努力。\n\n通过国际化，你可以让你的应用程序处理许多不同的语言和文化场景。在许多方面，你可以将国际化视为在更全球的应用程序层面启用多语言支持。在\
  \ Android 版 `Mono` 的背景下，你可以很大程度上通过利用 `.NET Framework` 内部工具来实现这一点。国际化工作可能包括以下内容：\n\
  \n*   使列表存储对语言敏感\n*   遵循日期和时间等不同数据单位的本地特定格式\n*   针对货币和普通数字等项目的符号差异进行调整\n*   使用适当的单位表示温度、重量和距离等测量值\n\
  *   妥当地接收输入并显示地址、电话号码和政府身份标识\n*   正确接受多种文本编码格式作为输入\n\n通过本地化，你可以对应用程序进行微调，以针对特定的文化。结合\
  \ `.NET Framework`（以及 Android 版 `Mono`）中的工具，Android 架构的设计旨在降低这一过程的难度。本地化工作可能包括以下：\n\
  \n*   识别文本区域并用目标语言显示\n*   自定义你的布局和基于图片的文本显示以匹配目标区域\n*   调整工具提示和应用程序流程以匹配区域\n*  \
  \ 调整整个用户界面以迎合特定区域\n\n在泛泛论国际化和本地化时，人们经常使用**全球化**（globalization）这一术语。由于这两个概念经常重叠，使用这个术语通常更加简洁。事实上，`.NET\
  \ Framework` 通过其命名空间 `System.Globalization` 正是实现了这一点，该命名空间用于创建多语言应用程序。\n\n图 14.1\
  \ 显示了不同本地化设置下的 Android 手机主菜单。通过本章，你可以在应用程序中实现类似的结果，并增加你的应用程序在不断发展的 Android 市场上的曝光率！\n\
  \n图 14.1\n\n![14.1](img/c14f001.jpg)![note](img/note.gif)国际化和本地化的术语通常缩短为 **i18n**\
  \ 和 **L10n**。数字指的是每个单词第一个和最后一个字母之间的字符数量。\n\n# 选择本地化策略\n\n在开始对应用程序进行本地化之前，你应该考虑几个因素。在完美的世界里，我们会有时间和资源为每种文化和区域进行本地化。遗憾的是，事实并非如此。在许多情况下，我们在选择本地化目标时必须做出精确且明智的决策。本地化可以为你的应用程序带来更多曝光。然而，成功的本地化的关键在于支持尽可能多的用户与保持初始开发时间和整体开发开销较低之间维持平衡。\n\
  \n为了保持这种平衡，在开始投入本地化工作之前，你可能想问自己几个问题：\n\n*   你的目标受众的区域是什么？从应用程序开发过程之初，你就应该对目标客户是谁有一个大致的了解。他们是针对特定区域的吗？你理想客户的特定功能是否让你想要针对某个区域？\n\
  *   你期望应用程序获得什么样的曝光？除了 Android 市场中的指标外，你应该考虑你将用于推广应用程序的途径。此外，考虑你的广告合作伙伴支持的区域，以便你也能匹配这些区域，从而使你的广告活动最大化。\n\
  *   你的应用程序是否局限于特定区域？某些类型的应用程序并不迎合所有区域。通常由于文化、经济或政治原因，导致某个应用程序在某些地区比在其他地区更成功。在考虑要支持哪些区域时，请警惕应用程序的主题、成本以及对某种文化的特殊性。\n\
  *   你的应用程序的行为在不同区域之间如何变化？页面布局、文本方向，甚至界面行为的预期都会随文化而异。如果你打算完全支持另一个区域，请花时间理解这些差异，并相应地调整你的应用程序。\n\
  *   你可以利用哪些区域中立的资源？如果你正在开发一个具有许多你想支持的不同区域的应用程序，请努力使用区域中立的资源。简单的想法，例如避免带有静态文本的图像，从长远来看，当你支持多个区域时，可以节省大量的时间和精力。\n\
  *   你拥有哪些资源来提供本地化服务？在为你的应用程序提供全本地化服务时，很容易忘记一些细节，例如你并不流利地说你想要本地化的语言。与同时流通你的母语和目标语言的人员对接，不仅能确保你支持目标区域，还能确保你在这样做时听起来很专业。\n\
  *   当有人尝试从不支持的区域访问你的应用程序时，你的应用程序会做什么？兼顾所有可能性是不可能的。与其尝试不可能的事，不如接受你的程序会在某些点失败，并确保它能够优雅地失败。\n\
  \n最后，如果你不考虑 Android 操作系统的当前曝光率将是失职。尽管 Android 正在全球范围内获得关注，但目前它在多样性上还没有达到其他移动平台的竞争对手。了解\
  \ Android 操作系统的关键用户是谁对帮助你做出本地化决策非常有帮助。以下是关于手机使用统计和区域的一些良好资源：\n\n*   AdMob 移动：[`metrics.admob.com`](http://metrics.admob.com)\n\
  *   Nielsen 数据：[`blog.nielsen.com/nielsenwire`](http://blog.nielsen.com/nielsenwire)\n\
  \n## 更新语言和区域设置\n\n为了测试本地化，你需要熟悉更新设备语言和区域设置的过程。更新这些设置的步骤取决于你使用的是模拟设备还是在实际硬件设备上测试。\n\
  \n你可以通过访问**系统设置 ⇒语言和键盘**屏幕来更改物理 Android 设备的本地和区域设置。在此屏幕下，你可以通过`选择语言` 菜单设置语言和区域。在此屏幕上，语言名称显示在左侧，如果有选择区域，则显示在语言右侧括号内。\n\
  \n![note](img/note.gif)物理设备上还有许多适用于语言和区域设置的其他设置。此外，不同的功能和扩展在该方面的支持可能不同，包括字典和自定义键盘。\n\
  \n\n\n\n\n当你使用模拟器工作时，更新语言和区域设置的过程要简单得多。在模拟器的主屏幕上，你可以找到一个名为 `Custom Locale` 的应用程序。在此应用程序下，你会发现长长的不同语言和区域设置供选择，它们按区域代码列出。通过长按这些项目中的任何一个，你就可以更新设备的设置。`图\
  \ 14.2` 显示了更新模拟器的过程。\n\n![note](img/note.gif)请务必记住此应用程序在菜单中的位置，否则可能很难找回去。\n\n***\n\
  \n[图 14.2]\n\n![14.2](img/c14f002.jpg)\n\n通过更改这些设置，你将影响 `Android OS` 和 `.NET` 显示内容的方式以及某些数据类型的格式化方式。幸的是，两者都使用相同的语言和区域命名规范来区分这些选择。以下是更改这些设置所需的两个代码：\n\
  \n*   语言代码：双字母的 `ISO 639-1` 代码是识别语言的首选方法。常见示例包括英语的 `en`、日语的 `ja`、西班牙语的 `es`、法语的\
  \ `fr` 和德语的 `de`。\n*   区域代码：双字符的 `ISO 3166-1` 代码用于识别使用特定语言的区域或位置。例如英国的 `UK` 和美国的\
  \ `US`。\n\n这两个值结合在一起就形成了一个区域（locale）。虽然两个国家可能说同一种语言，但它们对常用单词的拼写或数据类型（如电话号码或地址）的格式可能有不同的处理方法。这就是为什么识别区域很重要。\n\
  \n除了通过语言和区域识别区域外，某些区域还使用自定义或特殊标签来标识它们。你可以在模拟器区域设置中定义自定义区域标签。\n\n![note](img/note.gif)区域标识符在\
  \ `.NET` 和 `Android platform` 之间有所不同。在 `.NET` 中，区域定义为 `<language>-<REGION>`，例如 `en-US`。在\
  \ `Android OS` 中，区域的格式化通常是 `<language>-r<REGION>`，例如 `en-rUS`。当考虑到 `Java` 时，这会变得稍微复杂，因为它倾向于使用下划线作为语言和区域之间的分隔符。此外，大多数区域遵循语言代码保持小写、区域使用大写的惯例。\n\
  \n***\n\n要了解更多关于区域标签和其他 `ISO 标准` 的用法，或查看代码列表，请访问国际标准组织网站：[www.iso.org](http://www.iso.org)。\n\
  \n# 理解 Android 本地化的机制\n\n在 `Android platform` 上，得益于采用了一种用于本地化目的的约定优设计（design by\
  \ convention），设置本地化的过程非常简单。这种设计允许你快速创建针对特定区域的资源设置。结合在应用程序中建立默认资源的过程，本地化过程是完全可扩展的，并且提供了相当多的安全性。\n\
  \n## 约定与配置\n\n如果你熟悉 `ASP.NET MVC`，那么你应该理解“约定优设计”的概念。它侧重于通过建立和维护已知约定或接受的标准来降低应用程序的复杂性，而不是使用复杂的配置技术。在\
  \ `ASP.NET MVC` 中，在处理 `Models`、`Views` 和 `Controllers` 时，是通过使用提供的文件夹结构和框架来实现的。`Android\
  \ operating system` 在资源处理上也使用了类似的方法。\n\n## 设置默认资源\n\n支持本地化的第一步是为应用程序设置默认资源。资源可以是字符串、图形、布局模式、声音，或你的应用程序所需的任何其他静态文件或数据。当一个资源位于该资源类型的非特定默认目录中时，它被视为默认资源。你也可以认为这些资源是区域中立的，因为从理想上讲，它们不包含任何特定区域的信息。\n\
  \n![note](img/note.gif)请记住，如果它是一个资源，你就可以对其进行本地化。这不仅适用于文本，也适用于图像、视图和其他资源类型。\n\n***\n\
  \n拥有默认资源至关重要，因为当 `Android operating system` 找不到其他替代方案时会使用默认资源。如果在给定场景下没有找到资源，`Android\
  \ operating system` 将抛出应用程序异常。考虑到其他 Android 设备创建的速度，这是提供某种安全保障的唯一方法，或者至少提供一种优雅的失败。\n\
  \n目前，`Android operating system` 有几个默认文件夹来包含资源。这些文件夹并不是都必须存在你的应用程序才能正常运行；它们应该根据需要添加。`表\
  \ 14.1` 描述了本地化最常用的默认文件夹。通过将资源置于这些默认文件夹中，你可以确保在请求不支持的区域时，`Android operating system`\
  \ 始终有该资源的源。。\n\n![note](img/note.gif)你可以访问 [`developer.android.com`](http://developer.android.com)\
  \ 获取更多关于文件夹惯例的信息。\n\n***\n\n表 14.1] Android 默认文件夹\n\n| 文件夹名称 | 一般用途 |\n| :--- |\
  \ :--- |\n| `drawable/` | 包含绘制在屏幕上的图像文件或 XML 文件。 |\n| `layout/` | 包含指定用户界面布局的配置文件。\
  \ |\n| `menu/` | 包含选项 菜单和子菜单定义的配置文件。 |\n| `values/` | 包含基本值的 XML 文件，如字符串值、颜色设置和通用样式。\
  \ |\n| `xml/` | 包含运行时读取的杂项 XML 文件。通常用于 |\n\n## 添加本地化支持\n\n在放置默认资源文件夹后，你可以开始添加对其他区域的支持。要针对特定设备设置资源，你需要创建一个与默认目录同名的目录并设置特定文本。用于目标设置的其他文本被称为配置限定符名称。为了本地化目的，Android\
  \ 使用 `<DirectoryName>-<Language>-r<region>` 命名惯例。\n\n在 `图 14.3` 中，布局目录有多个配置：一个默认\
  \ drawable 文件夹，一个针对英语（en）用户的特定 drawable 文件夹，以及一个不仅说法语而且居住在法国地区用户的 drawable 文件夹。\n\
  \n图 14.3]\n\n![14.3](img/c14f003.jpg)\n\n在这种情况下，如果应用程序请求 `icon.png`，Android 运行时将选择匹配设备当前配置的文件夹。假设你的\
  \ Android 设备设置为 `en-US`，你将从 `en` 目录获取 `icon.png`。如果你的区域设置为 `fr-rCA`，你将从默认 drawable\
  \ 目录获取 `icon.png`，因为区域不匹配你的设备设置。\n\n## 详细资源选择\n\n当 Android 应用程序运行时，Android 系统会尝试选择并加载最符合\
  \ Android 设备设置和当前配置的资源。这种方法简化了支持本地化的过程，还为开发过程增加了额外的灵活性，因为开发者在支持本地化时可以使用特定性系统。\n\n\
  \n\n\n\nAndroid 使用以下过程来确定正确的资源：\n\n1. 你在应用程序内部请求一个资源。\n2. Android 找到与该资源所有可能的匹配目录，并消除与设备配置冲突的任何内容。\n\
  3. 如果找到了多个可能的匹配项，Android 将从最特定的目录开始查找资源。然后，它会遍历所有可用目录，直到找到资源的第一个匹配项。\n4. 如果没有找到任何匹配项，Android\
  \ 将回退到默认资源。\n5. 如果没有找到默认资源，Android 将抛出异常。\n\n尽管文件夹命名约定简化了添加其他语言区域支持的过程，但其他几个配置限定符（qualifier）名称还针对不同的应用程序设置。这些设置可能包括不同的屏幕密度、屏幕方向和应用程序模式。对于你需要专门针对的每一个与默认资源的偏差，你都需要创建一个额外的目录以及相应的资源。正如你想象的，管理偏差的数量以及完全理解资源选择过程至关重要。\n\
  \n![note](img/note.gif) 尽管这个主题超出了本节的范围，但 Android 文档确实定义了限定符优先级。由于某些限定符的考虑权重高于其他限定符，在某些情况下，更具体的名称可能会被具有更高限定符的名称取代。更多信息请参见\
  \ [`developer.android.com`](http://developer.android.com)。使用目录名称作为识别正确资源的约定的一个主要缺点是，它极大地限制了你以任何其他组织资源的能力。此外，目前\
  \ Android 操作系统不支持在这些资源的子文件夹中使用子目录。\n\n# 支持多种语言\n\n通常，当开发者在不考虑本地化的情况下编写应用程序时，他们往往会在\
  \ UI 或应用程序代码中硬编码字符串值。对于某些应用程序来说，这是一种坏习惯，因为如果你必须本地化一个已经完成的代码库，可能会导致非常痛苦的重构。此外，开发者倾向于跳过本地化过程，因为它被认为是额外的工作或看起来更难维护。在本节中，你将发现本地化字符串的过程不仅简单，而且实际上还可以让你的开发过程更加顺畅。\n\
  \n## 利用 Strings.xml 文件\n\n为了支持文本值的轻松翻译，你可以使用位于 `/Resources/Values/Strings.xml` 的字符串配置文件。`strings.xml`\
  \ 文件允许你指定字符串的键值对。通过使用此文件，你可以将要显示的文本与实际的应用程序代码分离。这种方法让你能够在无需修改视图或应用程序代码的情况下，切换不同的所需的文本或语言。下面的代码片段是一个新\
  \ Mono for Android 应用程序中默认 `strings.xml`文件的示例：\n\n```xml\n<?xml version=\"1.0\"\
  \ encoding=\"utf-8\"?>\n<resources>\n    <string name=\"hello\">Hello World, Click\
  \ Me!</string>\n    <string name=\"app_name\">Test</string>\n</resources>\n```\n\
  \n`name` 属性充当字符串的键，`string` 标签之间的文本是实际的文本值。当你的应用程序编译时，字符串资源的键值将作为特殊 `Resources`\
  \ 类的属性被添加。这允许你以声明式的方式访问你的文本值，并为你提供现有键的编译时检查。\n\n尽管 `Strings.xml` 文件是一个简单的概念，但在添加值时，你应该记住几条规则：\n\
  \n* 当使用单引号或双引号作为给定字符串的值时，你必须正确地转义该字符。你可以通过使用反斜杠（`\\` `）作为转义字符，或者将整个文本值封装在与你尝试转义的引号字符类型不同的闭合引号中来实现。以下是使用这种转义方法的两个示例：\n\
  \n```xml\n<string name=\"Example1\">Android\\'s awesome!</string>\n<string name=\"\
  Example2\">\"Android's awesome!\"</string>\n```\n\n* `Strings.xml` 文件支持使用某些格式标签，如表\
  \ 14.2 所示。\n\n* `Strings.xml` 文件中也允许 HTML 风格的注释，例如 `<!-- This is a comment -->`。\n\
  \nTable 14.2 字符串值中的有效格式标签\n\n| 样式 | 示例 |\n| :--- | :--- |\n| 粗体文本 | `<b>This is\
  \ bold text!</b>` |\n| 斜体文本 | `<i>This is italic text!</i>` |\n| 下划线文本 | `<u>This\
  \ would be underlined!</u>` |\n\n## 翻译文本\n\n在本章的第一个示例中，我们将演示创建一个简单翻译场景的过程。从 Visual\
  \ Studio 中默认的 Mono for Android 项目开始，打开位于 `Resources/Values` 目录下的 `Strings.xml` 文件。修改此文件使其如下所示：\n\
  \n```xml\n<?xml version=\"1.0\" encoding=\"utf-8\"?>\n<resources>\n    <string name=\"\
  Hello\">Hello, Mono for Android!</string>\n    <string name=\"Goodbye\">Goodbye,\
  \ Mono for Android!</string>\n</resources>\n```\n\n接下来，通过添加两个按钮控件来修改 `Main.axml`。这些按钮将提供显示我们本地化字符串的机制。目前，给一个按钮设置文本值“Say\
  \ Hello”，给另一个按钮设置文本值“Say Goodbye”。完成后，你的代码应该像这样：\n\n![download](img/download.gif)\n\
  \n```xml\n<?xml version=\"1.0\" encoding=\"utf-8\"?>\n<LinearLayout xmlns:android=\"\
  http://schemas.android.com/apk/res/android\"\n    android:orientation=\"vertical\"\
  \n    android:layout_width=\"match_parent\"\n    android:layout_height=\"match_parent\"\
  >\n    <Button\n        android:id=\"@+id/HelloButton\"\n        android:layout_width=\"\
  wrap_content\"\n        android:layout_height=\"wrap_content\"\n        android:text=\"\
  Say Hello\"/>\n    <Button\n        android:id=\"@+id/GoodbyeButton\"\n        android:layout_width=\"\
  wrap_content\"\n        android:layout_height=\"wrap_content\"\n        android:text=\"\
  Say Goodbye\"/>\n</LinearLayout>\n```\n\n此示例的所有代码段都可以在 `Localization01` 中找到。\n\n\
  现在控件已到位，你可以编写应用程序代码来利用你定义的新字符串资源。在 `Activity1.cs` 文件中，用以下代码替换 `OnCreate` 函数：\n\n\
  ```csharp\nprotected override void OnCreate(Bundle bundle)\n{\n     base.OnCreate(bundle);\n\
  \n     // 从 \"Main\" 布局资源设置我们的视图\n     SetContentView(Resource.Layout.Main);\n\n\
  \     // 从布局资源获取我们的按钮，\n     // 并为其附加事件\n     Button HelloButton = FindViewById<Button>(Resource.Id.HelloButton);\n\
  \     HelloButton.Click += delegate {\n          Toast.MakeText(this, Resource.String.Hello,\
  \ ToastLength.Long).Show(); };\n\n     Button GoodbyeButton = FindViewById<Button>(Resource.Id.GoodbyeButton);\n\
  \     GoodbyeButton.Click += delegate {\n          Toast.MakeText(this, Resource.String.Goodbye,\n\
  \          ToastLength.Long).Show(); };\n}\n```\n\n当你为每个按钮的 `Click` 事件添加事件处理程序时，相应的字符串值可以在小\
  \ toast 窗口中显示。注意，你可以通过使用特殊 `Resource` 类指定相应的键来访问你的字符串值。\n\n当一切准备就绪后，运行示例。你应该能看到应用程序的默认区域，以及你创建的两个按钮。当你点击按钮时，你会看到图\
  \ 14.4 所示的屏幕。\n\n![14.4](img/c14f004.jpg)\n\n\n\n\n现在基准已经建立，你可以开始添加本地化支持。在 `Resources`\
  \ 目录内再次创建一个名为 `Values-es` 的目录。在此目录中，创建一个名为 `Strings.xml` 的文件，并将以下内容添加到该文件中。现在，你的应用程序将支持对语言设置设置为\
  \ `es`（西班牙语语言代码）的设备进行翻译：\n\n![download](img/download.gif)\n\n```xml\n<?xml version=\"\
  1.0\" encoding=\"utf-8\"?>\n<resources>\n     <!--  The keyboard shortcut for the\
  \ \"¡\" character is Alt+0161\\. -->\n     <string name=\"Hello\">¡Hola, Mono for\
  \ Android!</string>\n     <!--  The keyboard shortcut for the \"ó\" character is\
  \ Alt+0243\\. -->\n     <string name=\"Goodbye\">¡Adiós, Mono for Android!</string>\n\
  </resources>\n```\n\n现在，你可以将新应用程序加载到设备中。在打开应用程序之前，请通过之前讨论的适当方法将设备设置将西班牙语作为主要语言。然后打开你的应用程序，查看新的翻译后的值（参见图\
  \ 14.5）。\n\nFigure 14.5\n\n![14.5](img/c14f005.jpg)![note](img/note.gif)记住，当像本例一样添加通过\
  \ `Resource` 类访问资源时，务必将它们的生成操作（build action）更改为 `AndroidResource`，以便它们被正确添加到构建中。你可以通过右键点击目标资源、选择\
  \ `Properties` 并在配置屏幕上更改生成操作来实现。这样做将导致编译错误，或者在这种情况下使用默认资源而不是刚刚添加的资源。\n\n* *\n\n\
  此时，你已经为你的应用程序添加了翻译支持。通过使用之前提到的命名规范，你可以开始添加对其他语言和区域的支持。与其他资源一样，对字符串值的请求从最特定的目录开始，直到最通用的目录。如果某个键未位于特定目录，而是位于默认目录中，Android\
  \ 系统将加载默认键的值。这意味着，尽管你通过更具体的 `Strings.xml` 文件针对了不同的区域，但你不需要为每个文件的每个键提供翻译。\n\n## 翻译控件文本\n\
  \n现在我们已经建立了在应用程序代码中为简单的 toast 消息分配 `Strings.xml` 文件值的过程，现在让我们看看为不同控件添加本地化支持的过程。正如你所想象的，这个过程与我们在前面的示例中使用的非常相似。\n\
  \n你可以通过两种方式向控件添加本地化文本：\n\n*   通过应用程序代码将资源文本绑定到控件的适当属性上。这在上一节的示例中已经过。\n*   使用控件的\
  \ XML 布局为给属性定义匹配的字符串键。\n\n从 `Localization01` 示例开始，我们可以开始为控件添加本地化支持。在之前的示例中，我们引入了两个按钮控件，点击时它们会显示本地化的文本消息。然而，按钮上的文本是硬编码的，这要求我们的本地化用户在获取翻译文本之前必须知道这些按钮的英语含义。让我们修复这个错误。\n\
  \n对于此示例，请向 `Strings.xml` 文件中添加以下行。这些项将成为应用程序加载时显示的按钮文本的文本源：\n\n```\n<string name=\"\
  HelloButtonText\">Hello</string>\n<string name=\"GoodbyeButtonText\">Goodbye</string>\n\
  ```\n\n如果需要，我们可以在应用程序代码中设置控件的 `text` 属性。如果这样做，它看起来像这样：\n\n![download](img/download.gif)\n\
  \n```\nButton HelloButton = FindViewById<Button>(Resource.id.HelloButton);\nHelloButton.Text\
  \ = Resource.@string.HelloButtonText;\n```\n\n这种方法的问题是实现一个基本结果需要编写大量的代码。此外，当你开始向页面中添加更多控件时，你的行数会大幅增加，维护成本也是如此。\n\
  \n另一种方法是使用控件的 XML 配置来指定映射到给定属性的字符串键。这种绑定使用以下语法完成：\n\n```\n@[package_name:]<resource_type>/<resource_name>\n\
  ```\n\n在我们的情况下，包名是不必要的，因为资源与我们当前工作的包位于同一个包中。由于我们正在引用 `Strings.xml` 中的文本值，因此资源类型是\
  \ `String`。最后，资源名称是我们在 `Strings.xml` 文件中查找的字符串键。\n\n要本地化按钮文本，请修改 `Resources/Layout/Main.axml`\
  \ 文件中按钮的 XML 标记。在 XML 配置中，使用 `@string/key` 语法将控件 `text` 属性中的硬编码字符串值替换为适当的字符串键。完成后，你的代码应该像这样：\n\
  \n![download](img/download.gif)\n\n```\n<Button android:id=\"@+id/HelloButton\"\n\
  \     android:layout_width=\"fill_parent\"\n     android:layout_height=\"wrap_content\"\
  \n     android:text=\"@string/HelloButtonText\" />\n<Button android:id=\"@+id/GoodbyeButton\"\
  \n     android:layout_width=\"fill_parent\"\n     android:layout_height=\"wrap_content\"\
  \n     android:text=\"@string/GoodbyeButtonText\" />\n```\n\n\n\n\n```\n <string\
  \ name=\"RestaurantText\">El Restaurante</string>\n<string name=\"FlagText\">Bandera</string>\n\
  ```\n\n现在，是时候为应用程序添加控件了。基本上，你将添加两张图片以及一些描述性文本。为了方便布局，这些控件被包含在一个表格结构中。将以下代码添加到到 `Resources/Layout/Main.axml`：\n\
  \n![下载](img/download.gif)\n\n```xml\n<TableLayout xmlns:android=\"http://schemas.android.com/apk/res/android\"\
  \n     android:layout_width=\"fill_parent\"\n     android:layout_height=\"fill_parent\"\
  >\n     <TableRow>\n          <ImageView\n               android:layout_height=\"\
  wrap_content\"\n               android:layout_width=\"wrap_content\"\n         \
  \      android:layout_margin=\"5dip\"\n               android:src=\"@drawable/flag\"\
  \ />\n          <TextView android:id=\"@+id/tvFlag\"\n               android:layout_height=\"\
  fill_parent\"\n               android:layout_width=\"wrap_content\"\n          \
  \     android:text=\"@string/FlagText\"\n               android:gravity=\"center_vertical|center_horizontal\"\
  \n               android:padding=\"3dip\" />\n     </TableRow>\n     <TableRow>\n\
  \          <ImageView\n               android:layout_height=\"wrap_content\"\n \
  \              android:layout_width=\"wrap_content\"\n               android:layout_margin=\"\
  5dip\"\n               android:src=\"@drawable/restaurant\" />\n          <TextView\
  \ android:id=\"@+id/tvRestaurant\"\n               android:layout_height=\"fill_parent\"\
  \n               android:layout_width=\"wrap_content\"\n               android:text=\"\
  @string/RestaurantText\"\n               android:gravity=\"center_vertical|center_horizontal\"\
  \n               android:padding=\"3dip\" />\n     </TableRow>\n</TableLayout>\n\
  ```\n\n此示例的所有代码段都可以在 `Localization03` 中找到。\n\n如你所见，XML 配置包含了两个寻找名为 `flag` 和 `restaurant`\
  \ 的两个图片的控件。由于你的应用程序在没有这些资源的情况下无法运行，请在 `Resources/Drawable` 目录中添加两个名称相同的适当图片。\n\n\
  一切就绪后，在模拟器中运行你的应用程序。你应该能看到图 14.7 所示的屏幕。\n\n图 14.7\n\n![14.7](img/c14f007.jpg)\n\n\
  为了本示例，假设我们的目标读者不仅是西班牙语使用者，还包括住在西班牙的人。西班牙西班牙语地区的区域设置设置为 `es_ES`。在 `Resources` 目录下创建一个名为\
  \ `Drawable-es-rES` 的目录。最后，向该目录添加一张西班牙旗图片，确保图片的名称和类型与默认目录中的旗帜图片一致。\n\n![注意](img/note.gif)示例图片\
  \ `flag` 和 `restaurant` 以及西班牙旗图片的副本都可以在本章 `Localization03` 下载包中找到。\n\n***\n\n现在应用程序已经准备好测试了。运行应用程序并将你的区域更改为\
  \ `es-ES`。操作后，你应该能看到如图 14.8 左侧所示的屏幕。注意文本是西班牙语且屏幕显示了西班牙国旗。现在，如果你选择 `es` 作为你的语言并将区域设置留在默认位置（假设你的默认区域是美国），你最终将得到一个针对美国西班牙语者的应用程序。右侧的图片显示了这种配置的状况。注意美国国旗（我们的默认资源）被加载了，因为\
  \ `Drawable-es-rES` 目录中的旗帜配置与设备的默认区域相冲突。\n\n![注意](img/note.gif)在添加旗帜图片时，请确保将它们的内容类型设置为\
  \ Android 资源（Android Resource）。\n\n***\n\n图 14.8\n\n![14.8](img/c14f008.jpg)\n\n\
  此应用程序展示了当选择了未计划的区域设置时，你可以获得不同且可能意料之外的结果。此外，请记住，尽管我们专注于图像本地化，但任何资源都可以通过 Android 文件夹命名规范进行本地化。\n\
  \n## 本地化菜单图标和应用程序名称\n\n在 Android OS 中，菜单图标和应用程序名称就是当应用程序位于主屏幕时看到的内容。本地化该视图的过程非常简单。\n\
  \n首先，本地化图标遵循与本地化任何其他图像相同的模式。首先，向针对该区域的更具体的区域目录中添加一个名为 `Icon.png` 的不同图片。接下来，可以使用任何控件中使用的相同\
  \ `@string/key` 语法结合 `Activity` 属性对图标进行本地化。\n\n应用程序名称也可以在 `Activity` 属性中进行本地化。修改你的主活动类上的\
  \ `Activity` 属性，使其反映以下代码：\n\n```\n[Activity(Label = \"@string/app_name\", MainLauncher\
  \ = true, Icon=\"@drawable/icon\")]\n```\n\n`Icon` 值将在 Android 清单中设置适当的值，使用与任何其他\
  \ drawable 相同的本地化规则。此外，假设你在 `Strings.xml` 文件中有一个相应的键 `app_name`，你的应用程序名称现在已本地化。\n\
  \n# Strings.xml 的高级用法\n\n由于我们已经广泛地涵盖了 `Strings.xml` 的基本用法，你可以引入一些额外功能来使本地化过程变得简单。本节总结了这些特殊用法。\n\
  \n## 字符串数组\n\n在 `Strings.xml` 中，你可以指定一个字符串数组，用于绑定列表类型的控件。在大多数情况下，这种做法应该保留用于完全静态的数据。定义字符串数组的语法如下：\n\
  \n```xml\n<string-array name=\"NameArray\">\n      <item>Nathan</item>\n      <item>Crystal</item>\n\
  \      <item>Kitara</item>\n</string-array>\n```\n\n在你的应用程序代码中，可以通过特殊的 `Resources`\
  \ 类通过 `Resources.Array.NameArray` 访问该数组，并将其绑定到列表控件的适当属性上。\n\n\n\n\n\n```\n<plurals\
  \ name=\"BookSearchResults\">\n       <item quantity=\"one\">您的搜索只找到一本书。</item>\n\
  \       <item quantity=\"other\">您的搜索找到了许多书籍！太棒了！</item>\nplurals>\n```\n\n在这种情况下，`item`\
  \ 节点的 `quantity` 属性只有两个有效值。正如你可能猜到的那样，`one` 指的是当复数形式中只有一个项目时，而 `other` 指的是当有多个结果时。要在代码中使用此功能，你只需要结合\
  \ `Resources` 类的应用程序实例来访问特殊的 `Resource` 类。以下是其用法示例：\n\n```\nList<Book> BooksQuery\
  \ = GetAllBooksInDatabase();\nstring ResultsMessage = Resources.GetQuantityString\n\
  \  (Resource.plurals.BookSearchResults, BooksQuery.Count);\n```\n\n## 字符串替换\n\n\
  处理动态字符串（dynamic strings）是一项挑战，特别是在本地化场景下。在许多情况下，程序员发现自己必须在多个交织的字符串库之间权衡，以提供完整的动态支持。在这种情况下，最好的方法是利用框架的字符串替换函数来尽可能地为你完成工作。\n\
  \n想象你需要创建一个简单的、本地化的数字计数应用程序，该程序会返回一个本地化字符串以及特定数字的文本版本。在这种情况下，你只需要支持整数 1、2 和 3。\n\
  \n在 Mono for Android 应用程序中（或从 Localization03 之后），请向适当的 `Strings.xml` 文件添加以下值。这些值代表了你想要显示的动态数字文本的字符串值。\n\
  \n添加到 `/RESOURCES/VALUES/STRINGS.XML`：\n\n```\n <string-array name=\"NumberArray\"\
  >\n      <item>one</item>\n      <item>two</item>\n      <item>three</item>\n</string-array>\n\
  ```\n\n添加到 `/RESOURCES/VALUES-ES/STRINGS.XML`：\n\n```\n <string-array name=\"NumberArray\"\
  >\n      <item>una</item>\n      <item>dos</item>\n      <item>tres</item>\n</string-array>\n\
  ```\n\n有了这些字符串后，你可以在 `Strings.xml` 中创建一个响应字符串，该字符串预设为利用 .NET 的字符串替换工具。在 C# 中，你可以通过\
  \ `String.Format()` 静态字符串完成字符串替换。通过使用适当的索引语法（例如 `{0}`），你可以识别模板字符串中需要动态替换的位置。在显示本地化计数响应字符串的逻辑时，以下示例添加了将用于计数按钮本身的本地化文本。\n\
  \n添加到 `/RESOURCES/VALUES/STRINGS.XML`：\n\n```\n <string name=\"CountButtonText\"\
  >数到三...</string>\n<plurals name=\"CountingResponse\">\n     <item quantity=\"one\"\
  >你数了 {0} 次。</item>\n     <item quantity=\"other\">你已经数了 {0} 次!</item>\n</plurals>\n\
  ```\n\n添加到 `/RESOURCES/VALUES-ES/STRINGS.XML`：\n\n```\n <string name=\"CountButtonText\"\
  >Cuente hasta tres...</string>\n<plurals name=\"CountingResponse\">\n     <item\
  \ quantity=\"one\">Usted ha contado {0} vez.</item>\n     <item quantity=\"other\"\
  >Se han contado {0} veces!</item>\n</plurals>\n```\n\n如你所见，我们不仅增加了对动态字符串的支持，还利用复数形式（plurals）来本地化从单数到复数项的转换。使用与之前的复数示例类似的逻辑，我们可以通过少量的配置轻松支持多种本地化场景。\n\
  \n接下来，我们需要通过更新 `Resources/Layout/Main.axml` 来添加一个启动计数过程的按钮。在文件中，创建一个 ID 为 `@+id/btnNumberCounter`\
  \ 的按钮，然后将其文本值设置为适当的字符串资源。完成后，按钮文本应该看起来像下面的代码段所示：\n\n```\n<Button android:id=\"@+id/btnNumberCounter\"\
  \n     android:layout_width=\"fill_parent\"\n     android:layout_height=\"wrap_content\"\
  \n     android:text=\"@string/CountButtonText\"/>\n```\n\n最后，在按钮的 `CLICK` 事件中添加适当的逻辑以显示\
  \ `Toast` 消息，指示发生的点击次数。执行此操作的代码如下：\n\n![download](img/download.gif)\n\n```\nprotected\
  \ override void OnCreate(Bundle bundle)\n{\n     base.OnCreate(bundle);\n\n    \
  \ // 从 \"Main\" 布局资源设置我们的视图\n     SetContentView(Resource.Layout.Main);\n\n    \
  \ // 从布局资源获取我们的按钮，\n     // 并为其绑定事件\n     Button HelloButton = FindViewById<Button>(Resource.Id.HelloButton);\n\
  \     HelloButton.Click += delegate {\n        Toast.MakeText(this, Resource.String.Hello,\
  \ ToastLength.Long).Show(); };\n\n     Button GoodbyeButton = FindViewById<Button>(Resource.Id.GoodbyeButton);\n\
  \     GoodbyeButton.Click += delegate {\n        Toast.MakeText(this, Resource.String.Goodbye,\
  \ ToastLength.Long).Show(); };\n\n     Button NumberCounter = FindViewById<Button>(Resource.Id.btnNumberCounter);\n\
  \     NumberCounter.Click += delegate { DisplayNumberCounterToastMessage(); };\n\
  }\n\npublic int NumberOfPresses = 0;\n\npublic void DisplayNumberCounterToastMessage()\n\
  {\n     String[] NumberArray = Resources.GetStringArray(Resource.Array.NumberArray);\n\
  \     NumberOfPresses =\n          NumberOfPresses == NumberArray.Length ? 1 : NumberOfPresses\
  \ + 1;\n      string Message = string.Format(Resources.GetQuantityString(Resource.Plurals.CountingResponse,\
  \ NumberOfPresses - 1));\n\n     Toast.MakeText(this, Message, ToastLength.Short).Show();\n\
  }\n```\n\n\n\n\n在 .NET 中格式化数字和货币与格式化日的过程非常相似。由于 .NET 可以反映你 Android 设备的本地设置，你可以使用\
  \ `string` 对象的 `format` 函数来自动处理格式化问题。在下面的代码段中，给定的数字根据 Android 设备的区域设置进行了格式化：\n\n\
  ```c\ndouble BigNumber = 1234567890.11;\nstring FormattedNumber = String.Format(\"\
  {0:N}\", BigNumber);\n\n// 同样的格式化可以在对象的 ToString() 方法中实现。\nstring FormattedNumber\
  \ = BigNumber.ToString(\"N\")\n```\n\n根据你的区域设置，你将看到不同的结果。表 14.3 显示了在几种不同区域设置设置下的结果样式。\n\
  \n表 14.3 数字格式化结果\n\n| 区域设置 (Locale) | 结果 |\n| :--- | :--- |\n| en-US | 1,234,567,890.11\
  \ |\n| fr-FR | 1 234 567 890,11 |\n| es-ES | 1.234.567.890,11 |\n\n在代码示例中，我们通过使用基本数字格式指定符告诉框架我们想要的数字格式化类型。在这种情况下，我们使用了\
  \ `N` 指定符，这意味着我们希望数字显示为带有分隔符的通用数字。除了此指定符外，.NET 中的其他几个指定符也可以用于定义不同类型的数字格式。表 14.4\
  \ 显示了许多用于本地化目的的常用指定符。\n\n表 14.4 字符串数字指定符\n\n| 指定符 (Specifier) | 类型 |\n| :--- | :---\
  \ |\n| C | 货币 |\n| D | 小数 |\n| N | 带逗号的数字 |\n| E | 科学计数法 |\n| F | 固定点数 |\n| G |\
  \ 通用数字 |\n\n# 总结\n\nAndroid OS 已成为移动市场中的主要参与者之一。世界各地的人正将 Android 市场视为查看、购买和下载 Android\
  \ 程序的官方集中场所。因此，对于 Android 开发者来说，通过本地化来尽可能支持潜在客户是至关重要的。\n\n此外，本地化应用程序的过程可以让你实现关注点分离，使更新更容易管理，并且与任何其他方法一样简单。通过主动本地化你的应用程序，你将为更轻松的开发体验做好准备，同时能够目标更广泛的群体。\n\
  \n# 第 15 章\n\n## 在 Mono for Android、MonoTouch 和 Windows Phone 7 之间共享代码\n\n## 本章内容简介\n\
  \n* 理解移动平台\n* 在不同平台上使用类库\n* 一个类库统治一切\n* 构建共享代码的应用程序\n\n本章将引导你了解流行的移动平台，并向你展示如何利用\
  \ .NET 和 `C#` 技能为每个平台进行开发。你还将发现如何在这些平台之间共享代码，以及在所有三个平台上使用同一个程序集的可能性。\n\n完成本章后，你将创建一个可以在这些平台上运行的示例应用程序，并在过程中学习有趣的差异。\n\
  \n# 三个平台概述\n\n你可能为许多移动平台进行开发。我提到的三个平台是 iOS、Android 和 Windows Phone 7。为什么是这三个？你可以使用\
  \ `C#` 和 `.NET` 框架在这些平台上进行开发：iOS 使用 `MonoTouch`、Windows Phone 上的 `.NET`，以及 Android\
  \ 设备上的 `Mono for Android`。让我们深入研究这些平台。\n\n## Mono for Android\n\n`Mono for Android`\
  \ 的默认项目结构对你来说应该比较熟悉，因为你可能在整本书中一直在使用 `Mono for Android`。图 15.1 显示了默认项目结构。你可以看到默认包含了\
  \ `mscorlib`、`System`、`System.Core`、`System.Xml` 和 `System.Xml.Linq` 程序集。除了这些程序集，你还有一个\
  \ `Mono.Android` 程序集，它包含了所有对 Android API 的绑定。\n\n图 15.1\n\n![15.1](img/c15f001.jpg)\n\
  \n默认情况下，`Mono for Android` 项目结构还包含一个 `Assets` 文件夹和一个 `Resources` 文件夹。`Assets` 文件夹是你存储音频文件等应用程序文件的地方。`Resources`\
  \ 文件夹包含另外三个文件夹（`Drawable`、`Layout` 和 `Values`）以及一个 `Resource.designer.cs` 文件。读完这本书后，你应该已经熟悉这些不同的文件和文件夹。\n\
  \n通过这个默认项目结构，你还会获得一个 `Activity1.cs` 文件，它为你的应用程序设置了主启动 Activity。这意味着你不需要额外配置就可以直接运行项目。\n\
  \n## MonoTouch\n\n 2009 年，`MonoTouch` 发布，它是一套允许 .NET 开发者为 iPhone 和 iPod 开发的工具。`MonoTouch`\
  \ 通过直接调用 `iOS` SDK 工作。与 `Visual Studio` 相比，这稍微提高了入门门槛。`MonoTouch` 使用 `UIWindow`\
  \ 作为应用程序的第一个视图，然后在应用程序构建时将多个视图加载到窗口中。这就是为什么需要初始化 `UIWindow` `window` 属性。\n\n图 15.2\
  \ 显示了 `MonoTouch` 应用程序的默认项目结构。你可以看到，默认包含了 `System`、`System.Core` 和 `System.Xml`\
  \ 程序集。与图 15.1（`Mono for Android` 的默认项目结构）相比，你会发现这些是跨平台通用的。它们的不同在于 `MonoTouch` 包含了\
  \ `MonoTouch.dll` 引用，而 `Mono for Android` 包含了 `Mono.Android.dll` 引用。这两个程序集在项目中是不同的，因为\
  \ `MonoTouch.dll` 针对 `iOS` API，而 `Mono.Android.dll` 针对 `Android` API。\n\n图 15.2\n\
  \n![15.2](img/c15f002.jpg)\n\n图 15.2 还显示了 `Main.cs` 文件、`AppDelegate.cs` 文件（带有 `MonoTouchApp1ViewController.cs`）以及\
  \ `MonoTouchApp1ViewController.designer.cs` 和 `MonoTouchApp1ViewController.xib`\
  \ 文件。因为 `MonoTouch` 应用程序通过 `UIApplication` 调用，因此 `Main` 文件管理此过程，然后进入 `AppDelegate.cs`\
  \ 文件管理任何自定义的视图显示。`Mono for Android` 有 `Activity` 概念。处理应用程序加载被推给了 `Activity`，因此默认情况下，你的\
  \ `Activity1.cs` 文件管理此应用程序的启动（只要在 `Activity` 属性中将 `MainLauncher` 标记为 `true`）。\n\n\
  \n\n\n就像 Android 版 Mono 一样，MonoTouch 集成了使用 Objective-C 的开发者会用到的 iOS 工具。这允许开发者使用真实的\
  \ iPhone/iPad 模拟器获得相同的体验。这自然意味着当新平台（如 iPad 设备）出现时，MonoTouch 可以轻松集成，并能够继续使用原生工具。通过\
  \ MonoTouch，在 Visual Studio 中工作是可行的，但仅限于编写和编译代码。你无法通过 Visual Studio 运行你的 MonoTouch\
  \ ；这需要一台 Mac 和 iOS SDK 来配合工作。\n\n在进行 iOS 开发时，你可能需要解决某些通过提供的 iOS API 无法解决的问题。你会在\
  \ Stack Overflow 上提问，一个 Objective-C 开发者会回答你的 MonoTouch 问题。由于这两者联系得非常紧密，因此很容易将 Objective-C\
  \ 的答案翻译成 MonoTouch 的答案。\n\n`.NET` 端的核心库与 Android 版 Mono 提供的库相同。这意味着如果你在 MonoTouch\
  \ 应用程序中有任何业务逻辑代码，应该很容易地将这些代码迁移并重用到 Android 版的应用程序中。不过，这种方法也有一些注意事项，本章后续部分将进行进一步探讨。\n\
  \n## Windows Phone 7\n\nWindows Phone 7 是允许开发者使用 C# 和 `.NET` 框架进行开发的平台。由于该平台与 Silverlight、Visual\
  \ Studio 和 Expression Blend 紧密集成，开发者可以从熟悉的环境中轻松复用其现有的技能，特别是如果他们之前使用过 Silverlight\
  \ 工具集进行开发的话。\n\nWindows Phone 7 的默认项目如图 15.3 所示，包含了许多对程序集的引用，包括 `mscorlib`、`System`、`System.Core`\
  \ 和 `System.Xml`；这些与 Android 版 Mono 的引用相同。此外，你还会看到 `Microsoft.Phone` 和 `Microsoft.Phone.Interop`。这两个程序集是你在针对\
  \ Windows Phone 7 平台编程时可以使用的手机特定 API。应用程序中包含的另一个 Android 版 Mono 默认不包含的程序集是 `System.Windows`。由于\
  \ Windows Phone 7 大量使用 Silverlight API，因此这些 API 大多由该程序集涵盖。它们包含了 `Sliders`（滑块）、`Grids`（网格）、`Buttons`（按钮）以及其他非\
  \ UI 特定的类，如 `Observable Collections`（可观察集合）和 `Dispatcher`（调度器），用于处理多线程（类似于 Android\
  \ 版 Mono 中的 `RunOnUIThread` 方法）。\n\n图 15.3\n\n![15.3](img/c15f003.jpg)\n\nWindows\
  \ Phone 7 项目还包含三个默认图像，分别用于 `ApplicationIcon`（应用程序图标）、应用程序的 `Tile` 图标（当固定在主屏幕上）以及应用程序加载时显示的启动屏幕。另外两个文件是\
  \ `.xaml` 文件。`App.xaml` 是应用程序加载时第一个访问的文件，是初始化第一个页面设置的地方。默认情况下，它被设置为加载 `MainPage.xaml`\
  \ 文件，该文件是自动创建并设置了应用程序名称和页面名称的。默认情况下，应用程序名称没有设置为像 Android 版 Mono 那样可以在 `String.xml`\
  \ 文件中更改的字符串，而是直接被硬编码的。\n\n当你安装 Windows Phone 开发者工具时，程序会安装一个 Windows Phone 模拟器。与真实设备相比，它的功能有限，并且类似于\
  \ iPhone 模拟器。因为它是一个模拟器，其性能可能比在设备上运行时好得多，也差得多。\n\n由于 `.NET` 框架是 Windows Phone 操作系统的一部分，应用程序可以非常小——小到一个应用程序只有\
  \ `15KB` 左右。相比之下，一个压缩后的 MonoTouch 应用程序约为 `4MB`。在如今的 3G 速度和便捷的 WiFi 下，`4MB` 并不是什么问题。\n\
  \n# 使用类库分离代码\n\n类库的存在是为了让你创建可重用的代码，以供多个项目使用。在大多数情况下，这些库被用于相同类型的项目（例如 Web 应用程序项目）。由于我们正在讨论与多个设备共享，遗憾的是，这也意味着每个不同平台都存在一个对应的类库，因此\
  \ MonoTouch、Android 版 Mono 和 Windows Phone 7 分别需要不同的类库。\n\n是时候深入查看每个类库以及它们为每个平台提供了哪些功能了。\n\
  \n## 使用预处理指令\n\n预处理指令允许你根据该项目构建配置中的预定义常量，选择性地编译代码段。这通常会让你得到如下所示的代码：\n\n```\n#if\
  \ DEBUG\n    var email = \"debug@example.com\";\n#elif\n    var email = \"live@example.com\"\
  ;\n#endif\n```\n\n由于你有时需要包含特定平台的代码，当目标代码是在一个平台运行而在另一个平台不运行的代码时，这会非常有用。常量（称为条件编译符号）定义在\
  \ `.csproj` 文件的 `PropertyGroup` 中，位于 `DefineConstants` 标签下；接下来的章节将告诉对于每个平台你应该使用哪些常量以及如何使用它们。\n\
  \n## Android 版 Mono\n\n在 Android 版 Mono 类库中，`.csproj` 文件使用以下项目类型 GUID：\n\n```\n\
  <ProjectTypeGuids>{EFBA0AD7-5A72-4C68-AF49-8D33275F};\n                  {FAE04EC0-301F-11D3-BF4B-00C0F};\n\
  ```\n\n`EFBA0AD7-5A72-4C68-AF49-8D33275F` 是需要记住的 GUID。`FAE04EC0-301F-11D3-BF4B-00C0F`\
  \ 表示这是一个 Android 项目。\n\n同样导入以下行：\n\n```\n<Import Project=\"$(MSBuildPath)\\Novell\\\
  MonoDroid.targets\" />\n```\n\n以确保 Visual Studio 知道如何构建。\n\n虽然 Android 版 Mono 没有你应该使用的默认预处理指令，但假设\
  \ `MONOANDROID` 是可以。你可以将此添加到所有 `PropertyGroup` 中：\n\n```\n<DefineConstants>DEBUG;TRACE;MONOANDROID</DefineConstants>\n\
  ```\n\n或者你可以使用 GUI 设置条件编译符号。如图 15.4 所示。\n\n图 15.4\n\n![15.4](img/c15f004.jpg)\n\n\
  ## Windows Phone 7\n\n与 Android 版 Mono 类库类似，Windows Phone 7 类库有自己的项目类型 GUID：\n\n\
  ```\n<ProjectTypeGuids>{C089C8C0-30E0-4E22-80C0-CE093F11A43};\n{FAE04EC0-301F-11D3-BF4B-00C0F}</ProjectTypeGuids>\n\
  ```\n\n并且它使用了相同的 Windows C# 项目 GUID。\n\n与 Android 版项目类似，Windows Phone 7 类库导入了两个目标：\n\
  \n```\n<Import Project=\"$(MSBuildPath)\\Microsoft\\\nSilverlight for Phone\\$(TargetFrameworkVersion)\\\
  \nMicrosoft.Silverlight.$(TargetFrameworkProfile).Overrides.targets\" />\n\n<Import\
  \ Project=\"$(MSBuildPath)\\Microsoft\\\nSilverlight for Phone\\$(TargetFrameworkVersion)\\\
  Microsoft.Silverlight.CSharp.targets\" />\n```\n\n该类库使用 `SILVERLIGHT` 和 `WINDOWS_PHONE`\
  \ 作为默认条件编译符号。\n\n## MonoTouch\n\n与前两个类库一样，MonoTouch 有自己的 GUID。除此之外，Android 版 Mono\
  \ 和 MonoTouch 类库是相同的。\n\n```\n<ProjectTypeGuids>{6BC8ED88-2882-458C-8E55-DFD12B67127B};\n\
  {FAE04EC0-301F-11D3-BF4B-00C0F}</ProjectTypeGuids>\n```\n\nMonoTouch 类库包含以下行：\n\n\
  \n\n\n\n```\n<Import Project=\"$(MSBuildBinPath)\\Microsoft.CSharp.targets\" />\n\
  ```\n\n以便允许使用 `MSBuild` 构建这些内容。\n\n与 Mono for Android 类库一样，MonoTouch 库没有使用默认的条件编译符号，但将\
  \ `MONOTOUCH` 用作 MonoTouch 项目的条件编译符号已成为常态。\n\n现在你已经了解了这三个类库项目之间的细微差别，已经准备好深入查看它们提供的代码库了。\n\
  \n# 每个平台上可用的程序集\n\n表 15.1 列出了每个不同类库可用的默认程序集引用。这些程序集中的大部分是跨平台可用的，而另一些仅适用于 MonoTouch\
  \ 和 Mono for Android。例如，`System.Core` 和 `System.Xml` 在所有三个平台上都受支持。那么每个每个配置（profile）中提供的每个方法都可用吗？遗憾的是，事实并非如此。\n\
  \n表 15.1 移动平台的程序集可用性\n\n![images/c15tnt001](img/c15tnt001a.jpg) ![images/c15tnt001](img/c15tnt001b.jpg)\n\
  \n虽然某些程序集未包含在特定平台的配置中（例如 `System.Json`），但你仍然可以通过直接引用 Silverlight 程序集来使用该程序集。本章最后一部分有一个示例。\n\
  \n平台之间存在差异，是因为某些功能在目标平台上受到限制或根本不可用。如果你计划编写针对多个平台的代码，你需要意识到这一点。例如，让我们关注 `System.IO`\
  \ 命名空间中的 `File` 类，它是 `mscorlib` 程序集的一部分。\n\n在使用 .NET 进行文件访问时，可能会用到的常用方法是 `ReadAllText`\
  \ 方法。该方法接收文件的 `string path` 和一个可选的 `encoding` 类型。由于 MonoTouch 和 Mono for Android\
  \ 在这两个平台上使用相同的公共代码，我们可以假设该方法在两个平台上都存在。\n\n当你准备在 Windows Phone 7 上重用此代码时，你会很快发现该方法在该平台上并不存在。你可能会担心如何重新实现存在于\
  \ .NET 平台的代码——这并不是一项简单的任务。幸运的是，Mono 项目团队已经为你完成了工作——因此，Mono 框架允许了这一功能。你可以去 GitHub\
  \ 上的 Mono 代码仓库 [`github.com/mono/mono/blob/master/mcs/class/corlib/System.IO/File.cs`](http://github.com/mono/mono/blob/master/mcs/class/corlib/System.IO/File.cs%20)\
  \ 并导航到代码处来实现。\n\n列表 15.1 显示了缺失的 `ReadAllText` 方法的源代码。\n\n![download](img/download.gif)\
  \ 列表 15.1: `System.IO.File` 类显示了 `ReadAllText` 代码\n\n```\n//\n// System.IO.File.cs\n\
