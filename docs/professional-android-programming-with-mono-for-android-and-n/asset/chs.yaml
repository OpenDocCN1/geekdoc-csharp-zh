  ![4.10](img/c04f010.jpg)\n\n## 图像\n\n应用程序通常围绕用户吸收的信息。通常，这些信息以文本的形式呈现。然而，正如俗语所说，画胜千言。因此，恰当使用图像可以为用户提供巨大的价值。考虑到这一点，Android\
  \ 提供了几种图像控件。在处理图像时，请记住以下几点：\n\n- 图像可以是 `png`、`jpg`、`gif` 和 `bmp` 类型。\n- 图像应该放置在\
  \ `/Resources/drawable` 目录下。\n- 图像应该标记为 `AndroidResource`，如图 4.11 所示。这应该自动完成。\n\
  - 为图像提供了 IntelliSense 支持。只要图像的生成操作被设置为 `AndroidResource`，图像与其值之间的关联就会存储在 `ResourcesDesigner.cs`\
  \ 文件中。\n- 为图像提供的 IntelliSense 不包含文件扩展名。\n- 通过 WiFi 或无线网络加载图像比从本地加载图像消耗更多功率。除非绝对必要，否则不要从远程资源加载图像。\n\
  \n图 4.11\n\n![4.11](img/c04f011.jpg)\n\n### ImageView\n\n`ImageView` 类用于显示图像。图像可以从各种资源和内容提供程序加载。`ImageView`\
  \ 计算图像的测量。此外，它还支持缩放等多种选项。\n\n### ImageButton\n\n`ImageButton` 类在按钮中用图像代替文本。`ImageButton`\
  \ 看起来像普通的 `Button`。`ImageButton` 支持多种状态。图像可以与 `Button` 的状态关联，例如默认状态、聚焦和按下状态。\n\n\
  ### Gallery\n\n`Gallery` 是一种 `View`，用于在中心锁定的水平滚动列表中显示项目。代码列表 4.12 显示了图像的 XML 用户界面：\n\
  \n![download](img/download.gif) 代码列表 4.12: 图像 XML\n\n```xml\n<?xml version=\"1.0\"\
  \ encoding=\"utf-8\"?>\n<LinearLayout\nxmlns:android=\"http://schemas.android.com/apk/res/android\"\
  \n    android:orientation=\"vertical\"\n    android:layout_width=\"fill_parent\"\
  \n    android:layout_height=\"fill_parent\">\n  <ImageButton\n  android:id=\"@+id/ib\"\
  \n    android:layout_width=\"wrap_content\"\n    android:layout_height=\"wrap_content\"\
  />\n  <TextView\n  android:id=\"@+id/itv\"\n    android:layout_width=\"wrap_content\"\
  \n    android:layout_height=\"wrap_content\"/>\n  <Gallery\n  android:id=\"@+id/gal\"\
  \n    android:layout_width=\"wrap_content\"\n    android:layout_height=\"wrap_content\"\
  />\n  <TextView\n  android:id=\"@+id/dptv\"\n    android:layout_width=\"wrap_content\"\
  \n    android:layout_height=\"wrap_content\"/>\n  <ImageView\n  android:id=\"@+id/iv\"\
  \n    android:layout_width=\"wrap_content\"\n    android:layout_height=\"wrap_content\"\
  />\n  <Button\n  android:id=\"@+id/btnClose\"\n    android:layout_width=\"wrap_content\"\
  \n    android:layout_height=\"wrap_content\"\n    android:text=\"Close\"/>\n</LinearLayout>\n\
  ```\n\n此代码包含在 `UIControls\\Resources\\Layout\\images.axml` 中。\n\n代码列表 4.13 示例说明了显示图像的\
  \ `Activity`：\n\n![download](img/download.gif)\n\n\n\n\n\n```java\npublic class\
  \ ImageAdapter : BaseAdapter\n{\n    Context context;\n    Dictionary<int, ImageView>\
  \ dict;\n    public ImageAdapter(Context c)\n    {\n      context = c;\n      dict\
  \ = new Dictionary<int, ImageView>();\n    }\n\n    public override int Count {\
  \ get { return thumbIds.Length; } }\n\n    public override Java.Lang.Object GetItem(int\
  \ position){ return null; }\n\n    public override long GetItemId(int position){\
  \ return 0; }\n\n    // create a new ImageView for each item referenced by the Adapter\n\
  \    public override View GetView(int position, View convertView, ViewGroup parent)\n\
  \    {\n        bool bOut;\n        ImageView i;// = new ImageView(context);\n \
  \       bOut = dict.TryGetValue(position, out i);\n\n        if (bOut == false)\n\
  \        {\n            i = new ImageView(context);\n            i.SetImageResource(thumbIds[position]);\n\
  \            i.LayoutParameters = new Gallery.LayoutParams(150, 100);\n        \
  \    i.SetScaleType(ImageView.ScaleType.CenterInside);\n            dict.Add(position,\
  \ i);\n        }\n\n        return i;\n    }\n\n    // references to our images\n\
  \    int[] thumbIds = {\n        Resource.Drawable.chrysanthemum,\n        Resource.Drawable.desert,\n\
  \        Resource.Drawable.hydrangeas,\n        Resource.Drawable.jellyfish,\n \
  \       Resource.Drawable.koala,\n        Resource.Drawable.lighthouse\n    };\n\
  }\n```\n\n此代码包含在 `UIControls\\ImagesArray.cs` 中。\n\n关于自定义图像数组类，有以下几点需要注意：\n\n* 该类继承自\
  \ `BaseAdapter`。\n* 该类重写了 `Count` 属性。该计数返回图像数组类提供的项目总数。\n*   `GetItem` 方法返回一个项目。在这种情况下，不需要该值，因此返回\
  \ `null`。\n*   `GetItemId` 方法返回指定位置的项目的唯一标识符。在此示例中不需要它，因此返回值 `0`。\n*   `GetView`\
  \ 方法返回图像视图所需的 `View`。此代码将各种图像视图存储在 `dictionary` 中。当用户滚动图像时，如果图像视图存在于字典中，则从字典中提取。如果字典中不存在该视图，则创建该视图并将其存储在字典中。\n\
  \n图 4.12 显示了一个 `ImageButton`、`ImageView` 和 `Gallery`。\n\n图 4.12\n\n![4.12](img/c04f012.jpg)\n\
  \n## 虚拟键盘\n\n正如我们在书中多次提到的的那样，移动设备是有局限性的。这些包括对显示器和键盘的限制。因此，开发者需要为用户提供某种向应用程序中输入数据的帮助。Android\
  \ 通过控件上的一个名为 `inputType` 的属性提供了此功能，如列表 4.15 所示。\n\n![download](img/download.gif)\
