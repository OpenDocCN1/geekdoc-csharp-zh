  \ 12.4 显示了预期的最终结果。\n\n图 12.4\n\n![12.4](img/c12f004.jpg)\n\n## 案例 2：响应事件\n\n在你完成新的\
  \ `HTML5Logo` 视图后，你在 W3C 的同事们有了一个新请求。虽然它是一个位于你 Android 屏幕上很精美的图形，但他们希望能够对它进行某些操作。他们建议将该图形设为可拖拽的，这样你就可以用手指在屏幕上移动它。\n\
  \n在与上一个示例相同的同一个项目中，创建一个名为 `HTML5Logo_Draggable` 的新类。在这个类中，你将利用上一个示例的工作，继承自 `HTML5Logo`\
  \ 类（因此也继承了 `View` 类）。\n\n让自定义图形变得可拖拽的过程并不复杂。由于 `HTML5Logo_Draggable` 类已经继承了 `View`\
  \ 类，你可以利用 `View` 的 `OnTouchEvent` 方法来监听并响应任何触摸事件。\n\n`View` 类的 `OnTouchEvent` 方法监听在设备上注册的任何类型的触摸事件。作为确定触发事件的触摸类型的方法，`OnTouchEvent`\
  \ 会访问一个 `MotionEvent` 类型的参数。该类是处理触摸事件时的关键组件。\n\n`MotionEvent` 类暴露了几个成员，这些成员对于在 Android\
  \ 设备上响应触摸事件非常关键：\n\n*   `Action` 整数用于使用 `MotionEventAction` 枚举的值来描述发生的动作类型。通过使用此枚举，你可以快速判断这是初始按下、手指拖动等。\n\
  \n*   `GetX()` 和 `GetY()` 函数返回用户初始按下时的精确坐标。此外，还有 `x`、`y` 坐标值的其他几种变体，例如未调整的坐标或历史坐标。\n\
  \n*   `Downtime` 值返回自用户初始按下设备以来流逝的毫秒（ms）总时间。\n\n最后，你可能会发现 `OnTouchEvent` 是布尔值而不是一个简单的方法。此此是为了在当此处理器无法处理该事件时，允许其他处理器尝试响应此触摸事件。如果它返回\
  \ `true`，则没有其他处理器获得机会响应此触摸事件。\n\n除了使用 `OnTouchEvent` 之外，新类还需要几个跟踪变量来帮助确定 logo 当前在\
  \ Android 设备屏幕上的位置。在你的 `HTML5Logo_Draggable` 类中，添加四个名为 `Current_X`、`Current_Y`、`Previous_X`\
  \ 和 `Previous_Y` 的 float 字段。这些将用于跟踪位置。\n\n接下来，继续重写底层 `View` 类的 `OnTouchEvent`。在这个类中，你将检查\
  \ `MotionEvent` 对象以查看视图是如何被触摸的。列表 12.9 详细说明了实现此目的的代码。\n\n![download](img/download.gif)\
  \ 列表 12.9: 设置 HTML5Logo_Draggable 类\n\n```\npublic class HTML5Logo_Draggable : HTML5Logo\n\
  {\n     private float Current_X;\n     private float Current_Y;\n\n     private\
  \ float Previous_X;\n     private float Previous_Y;\n\n     public HTML5Logo_Draggable(Context\
  \ context, int Scale)\n          : base(context, Scale)\n     {\n          this.Scale\
  \ = Scale;\n     }\n\n     public override bool OnTouchEvent(MotionEvent e)\n  \
  \   {\n          int Action = (int)e.Action;\n          switch (Action)\n      \
  \    {\n               case (int)MotionEventActions.Down:\n                    Previous_X\
  \ = e.GetX();\n                    Previous_Y = e.GetY();\n                    break;\n\
  \               case (int)MotionEventActions.Move:\n                    Current_X\
  \ += e.GetX() - Previous_X;\n                    Current_Y += e.GetY() - Previous_Y;\n\
  \n                    Previous_X = e.GetX();\n                    Previous_Y = e.GetY();\n\
  \n                    Invalidate();\n                    break;\n          }\n\n\
  \     return true;\n     }\n}\n```\n\n`Graphics_Canvas\\Graphics_Canvas\\HTML5Logo_Draggable.cs`\n\
  \n使用 `MotionEvent` 类中的 `Action` 枚举，`OnTouchEvent` 方法监听两种特定的事件：\n\n*   `MotionEventActions.Down`\
  \ 在首次触摸视图时触法触发。它被用于跟踪屏幕被触摸的初始点。\n\n*   `MotionEventActions.Move` 用于表示触摸点已移动（即触摸的手指在设备表面上滑动）。\n\
  \n使用这两个事件，你可以建立一个第一次触摸发生的时间和位置与下次触摸事件发生位置之间的基准。\n\n使用 `MotionEvent` 类的 `GetX()`\
  \ 和 `GetY()` 函数，你可以开始根据用户的手指轨迹调整图形的位置。在第一个 `case` 语句中，你记录了初始位置。\n\n\n\n\n当新应用程序运行时，剧烈且快速地拖动标志。假设你正在一个分配了约\
  \ 512MB 内存的模拟器上运行，你可能会发现应用程序由于随机错误而迅速崩溃，通常发生在 `HTML5Logo` 类的构建方法期间。发生这种情况的原因是你在实现\
  \ `OnDraw()` 方法时做出了一个糟糕的性能决策。\n\n在当前的逻辑中，该应用程序在每次绘制该图形时都会重新创建 `HTML5Logo` 图形。虽然对于静态图形（如案例\
  \ 1 所示）这可能是可以的，但当 `OnDraw()` 被频繁调用时，它会产生严重的性能影响。问题出现的原因是 `OnDraw()` 事件绑定到了 `OnTouchEvent`\
  \ 方法。特别是，当你开始更快速、更无规律地拖动它时，设备必须进行更大的工作，为每次移动创建一个新的图形实例。由于 `HTML5Logo` 图形是静态的，如果保存单个图形实例而不是在每次请求时重新创建它，对系统的负担会更小。\n\
  \n要修复这个问题，你将修改当前类所继承的底层 `HTML5Logo` 类。在此类中，你添加一个名为 `HTML5Bitmap` 的属性，并赋予它 `Bitmap`\
  \ 类型。这将用于在图形首次创建后将其存储在内存中。\n\n接下来，创建一个名为 `CreateHTML5Bitmap` 的函数，并指定返回类型为 `Bitmap`。此函数将根据需要创建图形的实例。最后，你可以重构\
  \ `OnDraw()` 事件，使其检查 `HTML5Bitmap` 属性是否为 `null`并在并在时创建新的位图。列表 12.11 显示了这些调整。\n\n\
  ![download](img/download.gif) 列表 12.11: 在内存中保存 HTML5 Bitmap 对象以提高性能\n\n```\npublic\
  \ Bitmap HTML5Bitmap { get; set; }\n\nprotected override void OnDraw(Canvas canvas)\n\
  {\n    if (HTML5Bitmap == null) HTML5Bitmap = CreateHTML5Bitmap();\n\n     canvas.DrawBitmap(HTML5Bitmap,\
  \ 0, 0, null);\n}\n\nprotected Bitmap CreateHTML5Bitmap()\n{\n     var tempCanvas\
  \ = new Canvas();\n     var CurrentBitmap = Bitmap.CreateBitmap(Scale,\n       \
  \   (int)(Scale*1.115), Bitmap.Config.Argb8888);\n     tempCanvas.SetBitmap(CurrentBitmap);\n\
  \n     DrawHTML5Background(tempCanvas);\n     DrawHTML5InnerBackground(tempCanvas);\n\
  \     DrawHTML5Text(tempCanvas);\n\n     return CurrentBitmap;\n}\n```\n\n`Graphics_Canvas\\\
  Graphics_Canvas\\HTML5Logo.cs`\n\n在新的 `CreateHTML5Bitmap()` 方法中，使用 `Bitmap` 类的静态函数\
  \ `CreateBitmap()` 创建一个新的 `Bitmap` 对象。作为此调用的一部分，你必须包含新 `Bitmap` 的高度、宽度和配置设置，这些已经通过之前的努力确定了。与其他调用一样，高度和宽度根据\
  \ `Scale` 属性设置，以确保创建的 `Bitmap` 与目标图形大小相同。此外，使用 `Bitmap.Config` 设置指定屏幕的像素配置。\n\n\
  ![note](img/note.gif)`Argb8888` 的 `BitmapConfig`（也称为 `Argb32`）指的是特定图像的颜色和 Alpha\
  \ 通能力。名称中的每个 8 代表此配置用于表示颜色的 alpha、红、绿、蓝值的位数。支持的位数越高，支持的颜色变化就越多。\n\n* *\n\n此外，此方法还创建了一个新的\
  \ `Canvas` 对象。由于你想预画标志，一个新的 `Canvas` 对象可以确保你不会以任何方式更改实际的 `Canvas` 对象。通过使用新 `Canvas`\
