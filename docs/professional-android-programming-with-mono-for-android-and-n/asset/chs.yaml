  \n\n\n\n本章介绍了在构建 Android 用户界面时可以使用的一些思想、概念和控件。介绍的一些关键概念包括：\n\n* `Views`（视图）和 `ViewGroups`（视图组）\n\
  * 在 `Activity` 上放置控件的 `Layouts`（布局）\n* 用于构建用户界面的关键控件\n* 构建成功用户界面背后的核心思想\n\n本章完成了书中关于使用\
  \ Mono for Android 构建应用程序基础的第一部分。\n\n# 第 5 章：处理数据\n\n### 本章包含哪些内容？\n\n* 处理 `SQLite`\
  \ 数据库\n* 使用基于 SOAP 的 Web 服务处理远程数据\n* 使用 XML 和 JSON 处理 REST 风格的 Web 服务\n* 高效存储数据\n\
  * 直接连接并与设备外的数据库通信\n\n数据是公司及其为公共和私有消费构建的应用的命脉。应用程序可以是与 Twitter 交互的程序、即时消息应用，或者是你个人的地址簿录。本章将介绍与设备数据库、`SQLite`\
  \ 数据库引擎交互，以及通过 SOAP 和 REST 将数据存储在设备外中央服务器上的策略，且不会阻塞用户界面。\n\n# 使用 SQLite\n\n`SQLite`\
  \ 是一种运行在 Android 中的数据引擎，也是 Android 的原生数据库。它与客户端/服务器类型的数据库（如 `SQL Server`、`Oracle`\
  \ 和 `DB/2`）不同。在客户端/服务器型数据库中，查询或操作被发送到数据库引擎，执行后将结果返回给客户端。对于这类数据库引擎，数据库运行在独立的进程中，通常运行在另一台机器上。`SQLite`\
  \ 不运行在独立的机器上；它运行在同一台机器（Android）上，并在与应用程序相同的进程中运行。`SQLite` 嵌入在应用程序中，并在编译过程中与应用链接。对\
  \ `SQLite` 的调用不是通过网络进行的，而是留在物理设备上。`SQLite` 是一个免费的应用程序，使用 `SQL`（结构化查询语言）与之交互。\n\n\
  ![note](img/note.gif)本章的目的并不是介绍 SQL 语言、数据库、表、列、数据类型、外键、行或任何其他类型的数据库功能。预计你已经理解了这些概念。有关\
  \ `SQLite` 数据库的更多信息，请访问网站 [`sqlite.org/`](http://sqlite.org/)。有关 SQL 语言的更多信息，请查阅\
  \ Wrox 和 Wiley 出版的任何关于该主题的书。\n\n***\n\n`SQLite` 的数据提供程序包含在 `Mono.Data.Sqlite` 程序集中，它支持\
  \ `SQLite` 版本 3。该程序集适用于 `ADO.NET` 2.0，这对于编写 Mono for Android 应用程序并不是问题。\n\n![note](img/note.gif)`Mono.Data.Sqlite.dll`\
  \ 程序集和 Mono for Android 文件位于 Android 程序集的目录中。添加这些程序集的另一种方法是直接使用 Visual Studio 中的列表功能来添加引用。\n\
  \n***\n\n## 设置数据库\n\n让应用程序与 `SQLite` 协作的第一步是设置数据库。对于基于服务器的数据库，这通常由 DBA（数据库管理员）完成一次。对于\
  \ `SQLite`，必须在应用程序在设备上首次运行时创建数据库，并且必须在运行应用程序的每个设备上执行。由于应用程序必须运行在终端用户的设备上，因此数据库设置过程必须在没有用户干预的情况下运行，并且必须在设备的时间限制内运行。代码列表\
  \ 5.1 是创建数据库的代码。\n\n![note](img/note.gif)处理数据可能是一个耗时的过程。在应用程序中锁定主线程过久会导致 Android\
  \ 操作系统尝试停止应用程序。数据库操作是后台线程的良好选择。有时某些操作在设备上运行而非 Android 模拟器中运行。`SQLite` 的 `CreateFile`\
  \ 方法就是其中之一。在此在此遇到问题，请注意此问题。\n\n***\n\n![download](img/download.gif) 代码列表 5.1:在设备上创建数据库\n\
  \n```\nstring DatabaseName = \"UserData.db3\";\nstring documents =\n  System.Environment.GetFolderPath(System.Environment.SpecialFolder.Personal);\n\
  string db = Path.Combine(documents, DatabaseName);\nbool exists = File.Exists(db);\n\
  if (!exists)\n{\n        SqliteConnection.CreateFile(db);\n}\n```\n\n此代码包含在 `InternalNetworkData\\\
  InternalNetworkData\\Activity1.cs` 中\n\n以下是该代码中值得注意的情况：\n\n* 选择了一个数据库名称。这是存储表和其他数据对象的地方。\n\
  * 确定了个人目录。\n* 创建了数据库文件的完整路径。\n* 执行了测试以确定文件是否存在。如果不存在，则创建文件。\n\n## 设置表\n\n现在你的数据库已经创建，下一步是设置表、索引、触发器以及所需的任何其他特定数据库对象。代码列表\
  \ 5.2 显示了创建表、触发器和索引的代码。\n\n![download](img/download.gif) 代码列表 5.2:在数据库中创建表\n\n```\n\
  var conn = new SqliteConnection(\"Data Source=\" + db);\nvar commands = new[] {\n\
  \    \"CREATE TABLE IF NOT EXISTS STATE (STATEID INT PRIMARY KEY, STATENAME VARCHAR(50))\"\
