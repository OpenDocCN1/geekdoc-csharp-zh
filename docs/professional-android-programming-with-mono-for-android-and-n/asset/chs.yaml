  \n项目项目使用的所有图像必须存在于正确的 Resources 文件夹结构中，并且 `Build Action` 属性必须设置为 `AndroidResource`。图\
  \ 6.15 显示了图像的 Visual Studio 解决方案资源管理器布局。\n\n图 6.15\n\n![6.15](img/c06f015.jpg)\n\
  \n当你编译并运行项目时，你会看到一个如图 6.16 所示的 `GridView`。注意竖屏模式和横屏模式包含的列数不同。由于你没有在 XML 布局资源文件中指定列数，`GridView`\
  \ 会根据其宽度自动适应尽可能多的列。\n\n图 6.16\n\n![6.16](img/c06f016.jpg)\n\n# 总结\n\n正如在本章中所学的，Android\
  \ 中有很多不同的方法可以将数据绑定到控件上。首先，你学习了数据适配器（data adapters）及其与适配器视图之间的关系。你详细学习了适配器的内部工作原理，并探索了\
  \ Android 中提供的各种原生适配器。通过使用 `SQLite` 存储系统，你学习了如何利用游标（cursors）填充 `spinner`，以及如何处理来自\
  \ `Spinner` 的事件。你还使用游标和自定义的 `ImageAdapter`实现了一个画廊控件。\n\n在本章的后半部分，你紧密地使用了 `ListView`\
  \ 和 `ListActivity`。在使用自定义列表适配器创建项目并在 `ListView` 中显示 `Animal` 对象之前，你先构建了一个基础 `ListView`。通过\
  \ `ListView` 事件，你学习了如何使用嵌套导航创建一个应用程序。你还探索了 `PreferenceScreen` 以及不同类型的偏好元素，这些元素可以轻松地创建直观且时尚的用户输入驱动列表。接下来，你处理了\
  \ `SectionedAdapter` 以创建分组列表。最后，你使用 `GridView` 来显示图像网格。\n\n向用户显示数据是任何应用程序不可或缺的一部分。在\
  \ Android 中，显示数据通常遵循“适配器驱动视图”的模式。本章让你深入了解了以有意义的方式向用户呈现数据的各种技术。现在你距离使用 Mono 创建用的\
  \ Android 又近了一步。\n\n# 第 7 章\n\n## 与文件系统和应用程序偏好的交互\n\n### 本章内容简介？\n\n* 复习文件系统\n*\
  \ 读取和写入文件\n* 创建和读取应用程序共享偏好\n* 处理 XML 文件\n* 监听偏好变化\n\n本章涵盖了文件系统、向文件系统读/写文件，以及系统和应用程序偏好。对文件系统的复习涵盖了文件系统的类型和结构，并提供了从应用程序到文件系统读取和写入文本文件的示例。对于应用程序偏好，本章涵盖了用于共享偏好（shared\
  \ preferences）和私有偏好（private preferences）的 API 以及偏好变化通知。本章还展示了一个使用可用 `preferences`\
  \ 命名空间来显示标准用户偏好界面的程序。最后，它展示了使用 `preferences` 命名空间来处理 XML 的程序。用户偏好对于提供良好的用户体验至关重要。本章示例将帮助你完成这些任务。\n\
  \n# 与文件系统的交互\n\n正如提到的，本章涵盖了文件系统和文件/O。它从文件系统类型和结构开始，然后转向如何处理权限。接下来涵盖了文件访问，并以一个读取和写入程序结束。\n\
  \n## 文件系统类型和结构\n\nAndroid 的默认文件系统是 `YAFFS`（另一种文件系统）。YAFFS 目前是 2 版本。它运行在 Android\
  \ 的 Linux 之上，也适用于其他操作系统。YAFFS 提供了磨损均衡以延长闪存的使用寿命。它内置了错误修正以确保健壮性。它还提供了快速启动，使其成为 Android\
  \ 平台可靠的文件系统。\n\n![note](img/note.gif)如果你想对 `YAFFS` 进行深入回顾，请访问 [`yaffs.net`](http://yaffs.net)。在本章中，我们介绍介绍要点。\n\
  \n* * *\n\nLinux 操作系统支持权限来控制世界、组或所有者读取、写入、列出或执行文件。每个在 Linux 系统上运行的进程都具有一组特定的用户权限。在\
  \ Android 上运行的每个进程都是隔离的。这部分通过让每个进程运行其独特的用户权限来实现。\n\n\n\n\n```\nbyte[] content =\
  \ new byte[1024];\ntry\n{\nFileInputStream fis = OpenFileInput(QUICKEDIT_FILENAME);\n\
  fis.Read(content);\nfis.Close();\n}\ncatch (FileNotFoundException e)\n{\nLog.Error(QUICKEDIT_TAG,\
  \ e.Message);\n}\ncatch (IOException e)\n{\n        Log.Error(QUICKEDIT_TAG, e.Message);\n\
  }\n```\n\n文件访问函数定义在 `Java.IO` 命名空间中。表 7.1 列出了关键函数和异常。\n\n### 表 7.1](#9781118235812c07.xhtml_c07_tbl_anc_0001)\
  \ Java.IO 命名空间\n\n| 类型 | 描述 |\n| :--- | :--- |\n| `BufferedReader` | 提供缓冲文件输入。 |\n\
  | `BufferedWriter` | 提供缓冲文件输出。 |\n| `EOFException` | 当程序在输入操作期间遇到文件或流的结尾时会抛出此异常。\
  \ |\n| `File` | 这是一个抽象文件系统中文件的对象，可以是目录也可以是文件。请注意，尽管 Java 没有指定文件名的字符编码，但在 Android\
  \ Java 中，向操作系统发送文件名时，Java 字符串会被转换为 UTF-8 字节序列。操作系统返回的字节序列（通过各种列出方法）将通过将其解码为 UTF-8\
  \ 字节序列转换为 Java 字符串。 |\n| `FileInputStream` | 这是一个特殊的 `Java.IO.InputStream`，用于从文件系统流式读取文件。\
  \ |\n| `FileNotFoundException` | 当程序找不到程序指定的文件时，会抛出此异常。 |\n| `FileOutputStream`\
  \ | 这是一个特殊的 `Java.IO.OutputStream`，用于向文件系统流式写入文件。 |\n| `FilePermission` | 包含文件权限枚举的对象。请注意，在构造\
  \ `FilePermission` 时，所有路径名必须使用 `File.separatorChar`。 |\n| `InputStream` | 这是一个抽象类，许多特殊的输入流都继承自它，用于从文件或字节数组读取等目的。\
  \ |\n| `IOException` | 此异常表示通用的 I/O 相关错误。 |\n| `NotSerializableException` | 此异常表示已将不可序列化的对象传递给\
  \ `ObjectOutput.writeObject()` 方法。 |\n| `OutputStream` | 这是一个抽象类，许多特殊的输出流都继承自它，用于向文件或字节数组写入等目的。\
  \ |\n| `PrintStream` | 封装现有的 `Java.IO.OutputStream` 并提供以人类可读的格式写入常见数据类型的便利方法。 |\n\
  | `PrintWriter` | 封装现有的 `Java.IO.OutputStream` 或现有的 `Java.IO.Writer`，并提供以人类可读格式打印常见数据类型的便利方法。\
  \ |\n| `RandomAccessFile` | 允许以随机访问的方式对文件进行读取和写入。 |\n| `StringReader` | 这是一个特殊的\
  \ `Java.IO.Reader`，按顺序方式从 `String` 中读取字符。 |\n| `StringWriter` | 这是一个特殊的 `Java.IO.Writer`，按顺序从\
  \ `StringBuffer` 写入字符，并在过程中对其进行追加。 |\n| `UnsupportedEncodingException` | 当程序请求特定的不可用的字符转换器时，会抛出此异常。\
  \ |\n| `UTFDataFormatException` | 此异常表示遇到了编码不正确的 UTF-8 字符串，最可能是在读取 `DataInputStream`\
  \ 时。 |\n\n除了持久化文件外，你的应用程序可能还需要在文件中存储缓存数据。为了做到这一点，你会使用 `GetCacheDir()` 配合 `File`\
  \ 对象在缓存目录中打开文件。如果系统内部存储空间不足，Android 可能会删除这些缓存文件，但你不应该依赖系统来为你清理这些文件。如果你的应用程序被卸载，它拥有的缓存文件也会被删除。但是，作为一个良好的\
  \ Android 开发者（公民），你应该删除任何未使用的缓存文件。\n\n除了创建文件外，还会发生文件的放置。文件可以存放在内部存储或外部存储中。内部存储指的是设备内置的存储空间，外部存储指的是可以添加到设备中的媒体卡。这两个系统的访问方式略有不同。\n\
  \n#### 内部存储\n对于内部文件，使用以下函数：\n* `OpenFileInput(filename, operatingmode)`\n* `OpenFileOutput(filename,\
  \ operatingmode)`\n\n它们分别用于文件输入和输出。在每情况下，参数都是文件名和之前提到的某种操作上下文模式之一。\n\n#### 外部存储\n\
  对于外部存储，操作是不同的。首先，你必须检查是否有可用的外部存储。如果有，你必须检查它是否可写。在确认外部存储可用后，你使用 `GetExternalFilesDir()`\
  \ 配合标准的 `File()` 对象在外部存储介质上创建一个文件。\n\n所有这些都可以通过 `ExternalStorageState` 属性完成，如下代码段所示：\n\
  \n```\nif (Android.OS.Environment.ExternalStorageState == Android.OS.Environment\n\
  \  .MediaMounted)\n                {\n                    File dataDir = this.GetExternalFilesDir(Android.OS.Environment\n\
  \                      .DataDirectory.Path);\n                    FileOutputStream\
  \ fos = OpenFileOutput(dataDir + \n                      QUICKEDIT_FILENAME, FileCreationMode.Private);\n\
  \                    UTF8Encoding enc = new UTF8Encoding();\n                  \
  \  fos.Write(enc.GetBytes(content));\n                    fos.Close();\n       \
  \         }\n```\n\n在这个示例中，只有一个测试 `ExternalStorageState` 是否等于 `MediaMounted`。如果是，则外部存储可用且处于读写模式。如果不是，则有其他的媒体状态可以确定具体状态。\n\
  \n`GetExternalFilesDir` 接收一个字符串参数，表示上述常量之一，指示表 7.2 中所示任何文件类型的标准目录。\n\n### 表 7.2](#9781118235812c07.xhtml_c07_tbl_0001)\
