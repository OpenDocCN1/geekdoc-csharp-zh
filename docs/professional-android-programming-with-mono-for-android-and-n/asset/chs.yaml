  \ Listing 5.7。\n\n![download](img/download.gif) Listing 5.7: 调用 ASMX Web 服务\n\n\
  ```\nvoid btnCallASMX_Click(object sender, EventArgs e)\n{\n    com.w3schools.www.TempConvert\
