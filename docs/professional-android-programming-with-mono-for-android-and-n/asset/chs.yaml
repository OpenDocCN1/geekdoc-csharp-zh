- "# Android 高级编程：使用 Mono for Android 和 .NET/C#\n\n\n\n![](img/cover)\n\n![cover_image](img/cover_fmt.jpg)\n\
  \n附录 A\n\n序言\n\n引言\n\n广告\n\n第 1 章\n\nAndroid、移动设备与市场简介\n\n本章内容？\n\n\n\n\n\n# Mono\
  \ 简史及其与 .NET Framework 的关系\n* Mono for Android 如何为 .NET 开发者开启 Android 平台\n* 为什么\
  \ Mono for Android 对开发者如此有吸引力\n* Android 的及其心智份额\n* 探索跨平台替代方案\n\n过去几年中，智能手机的使用量经历了惊人的增长。《美国今日》最近报道了智能手机如何成为人们生活中不可或缺的一部分。随着增长和普及带来了竞争，而且与桌面电脑不同，没有单一供应商或平台主导移动设备市场；基于\
  \ Symbian、Research in Motion (黑莓)、Windows Mobile、Android 以及其他平台的设备均可用。此外，设备可能运行相同的操作系统，但以不同的形态呈现给用户。市场的这种碎片化对开发者来说是有问题的：他们如何利用自己已经熟悉并使用的开发框架或工具，并将这些知识应用于市场份额巨大且不断增长的设备中？\n\
  \n本章探讨了最大的开发者群体（`.NET/C#` 开发者）如何针对心智份额最高的智能手机（`Android`）。它还探讨了智能手机的市场增长速度如何快于任何其他设备。\n\
  \n# 产品比较\n\n本节快速回顾了 `.NET Framework`、`Mono` 和 `Mono for Android`。这些产品让最大的开发者群体能够针对\
  \ Android 移动设备家族——这是目前市场上增长最快的移动平台。\n\n## .NET Framework\n\n在过去的过去的十年里，`.NET Framework`\
  \ 的普及程度不断提高。20 世纪 90 年代后期，微软开始开发 `.NET Framework`。第一个版本于 2002 年发布。微软最近引入了 `.NET\
  \ Framework 4`。`.NET Framework` 有多个版本，包括 32 位、64 位、适用于 Xbox 游戏平台的版本，以及适用于微软移动设备的版本，称为\
  \ `Compact Framework` (`CF`)）。在您开始查看 `Mono` 框架时，请记住以下关于 `.NET Framework` 的几个关键事实：\n\
  \n* 微软随该框架发布了一个开发工具 `Visual Studio .NET`。该工具是 `.NET` 的集成开发环境。\n* 该框架基于一个虚拟机，用于执行为该框架编写的软件。这个虚拟机环境被称为\
  \ `Common Language Runtime` (`CLR`)，它负责安全、内存管理、程序执行和异常处理。\n* 使用 `.NET Framework`\
  \ 编写的应用最初从源代码（如 `Visual Basic` 或 `C#`）编译为中间语言，称为 `MSIL`。初始编译是通过调用特定语言的命令行编译器 `Visual\
  \ Studio` 或其他构建工具完成的。在执行应用时，通常会执行第二次编译。第二次编译获取中间语言并将其编译成可以在操作系统上运行的可执行代码。这种第二次编译被称为即时编译\
  \ (`JIT`) 编译。\n* 该框架是语言无关的，有许多语言可供使用。在 `Visual Studio` 中，微软发布了多种语言，包括 `Visual Basic`、`F#`、`C++`\
  \ 和 `C#`。\n* 该框架有一系列库，在各种语言中提供一致的功能。这些库被称为 `base class libraries`（基类库）。\n* 微软已将\
  \ `.NET Framework` 的各个部分部分提交给各种标准组织，包括 `C#` 语言、`Common Language Infrastructure`、`Common\
  \ Type System` (`CTS`)、`Common Language Specification` (`CLS`) 以及 `Virtual Execution\
  \ System` (`VES`)。\n* 在所有开发框架中，该框架的开发者最多。因此，比任何其他开发框架都有更多的开发者熟悉 `.NET Framework`。\n\
  * `.NET Framework` 的一个缺点是不支持非微软平台。\n\n这一切的意义在于，微软为 `.NET Framework` 创建了一个基于标准的环境。尽管大多数在微软平台上工作的开发者并不担心\
  \ `.NET Framework` 的标准合规性，但 `.NET Framework` 这一方面的重要性不容忽视。通过定义这些标准并将这些标准提交给合规委员会，微软创建了一个可以在相当低水平集成到\
  \ `.NET Framework` 中的开发者群体。在这个环境中，Miguel de Icaza 有了一个愿景，并起身创建了接下来讨论的 `Mono` 框架。\n\
  \n## Mono\n\n`Mono` 是一个开源项目，在非 Windows 操作系统上提供 `C#` 编译器和 `CLR`。`Mono` 目前根据 `GPL`\
  \ 版本 2、`LGPL` 版本 2、`MIT` 和双许可授权。`Mono` 运行在 Mac、Linux、`BSD` 和其他操作系统上。除了 `C#` 编译器外，其他语言运行在\
  \ `Mono` 上，包括 `F#`、`Java`、`Scala`、`Basic` 等。\n\n`Mono` 是 Miguel de Icaza 的结晶，于 2001\
  \ 年正式发布。1.0 版本于 2004 年发布，目前 `Mono` 处于 2.10 版本，尽管它正在不断升级，在您阅读本文时，它可能已经处于更高的版本。目前，`Mono`\
  \ 的许多功能与 `.NET 4` 相当。`Mono` 继续由 de Icaza 直接领导。最近，`Mono` 的管理已移交给 `Xamarin`。`Xamarin`\
  \ 引导 `Mono` 的方向。`Mono` 最初是 `C#` 编译器的开源实现。它从这个初始设计变成了目前的 `.NET` 开源实现。现在，培养 `Mono`\
  \ 是 `Xamarin` 的责任。`Xamarin` 负责 `Mono for Android`、`MonoTouch` 以及让这些产品为开发者运行的软件。鉴于\
  \ `Xamarin` 在移动领域专注于 `Mono`，我认为这些产品是可靠的。\n\n尽管人们渴望比肩上 `.NET Framework` 的功能，但这是不可能的，因为微软在开发这些功能方面拥有更多资源和起步优势。同时，`Mono`\
  \ 项目在许多 `.NET Framework` 功能上相当。`Xamarin` 最可能实现的最好结果，是在大多数 `APIs` 上略后于 `.NET Framework`。\n\
  \n与 `Mono` 一起还有名为 `MonoDevelop` 的开源 IDE，它最初是 `SharpDevelop` IDE 的移植版。`MonoDevelop`\
  \ 最初是一个允许在 Linux 上进行 `Mono` 开发的项目，但随着 `MonoDevelop 2.2` 的发布，使用 `Mono` 进行开发的能力扩展到了\
  \ Mac、`Windows` 和其他几个非 Linux 平台。\n\n尽管 `.NET Framework` 非常流行，但有两个问题使其不适合在 Android\
  \ 上运行：\n\n* 在某种程度上，`Google` 和 `Microsoft` 是竞争对手，可能对合作并不感兴趣。微软多年来拥有 `Windows Mobile`\
  \ 设备，它们与 `Google` 的 `Android` 操作系统直接竞争。\n* `.NET Framework` 从根本上说是 Android 设备核心\
  \ `Java Virtual Machine` 的主要对手。这个 Java VM 被称为 `Dalvik`。自 `.NET Framework` 最初发布以来，`.NET\
  \ Framework` 和 `Java` 一直是竞争。\n\n`.NET/Mono` 和 `Android` 的一个缺点是 `.NET/Mono` 开发者无法将他们的\
  \ `.NET/Mono/C#` 知识应用于 Android 平台。图 1.1 展示了这一概念。`.NET/Mono` 开发者无法针对 Android，因为它们是两个独立的实体。\n\
  \n图 1.1\n\n![1.1](img/c01f001.jpg)\n\n\n\n\n\n2009 年，Mono 团队宣布并发布了 `MonoTouch`，它是\
  \ `Mono for Android` 的前身。`MonoTouch` 允许熟悉 `C#` 的开发者针对 Apple iPhone 进行开发。基于构建 `MonoTouch`\
  \ 的经验，Mono 团队学会了如何有效且高效地构建构建在设备原生应用程序编程接口 (`API`) 之上的 `C#/Mono` 层。\n\n## Mono for\
  \ Android\n\n2010 年 4 月，Apple 通过更改其软件开发工具包 (`SDK`) 许可协议，为移动开发市场中引入了恐惧、不确定性和怀疑。这一变化导致许多开发者对为\
  \ iPhone 和 iOS 开发产生了怀疑。在那个时候，Mono 团队一直在尝试为 Android 创建一个与其 `MonoTouch` 产品相似的 `Mono`\
  \ 产品。由于 Apple `SDK` 的变化，Mono 团队宣布了 `Mono for Android` 产品并为其投入了大量资源。`Mono for Android`\
  \ 于 2011 年春季发布。虽然 Apple 最终撤销了其对 `SDK` 的限制，但在 `MonoTouch` 处于停滞状态的 5 个月里，Mono 团队得以投入大量资源开发\
  \ `Mono for Android`。结果是，如果 Apple 没有在 2010 年让 `MonoTouch` 停滞几个月，`Mono for Android`\
  \ 的进度将比现在更后。\n\n`Mono for Android` 允许 `.NET` 开发者创建运行在 Android 上的原生应用程序。这些应用程序看起来和感觉就像运行在\
  \ `Dalvik` 上的原生 Java 应用程序。通过 `Mono for Android`，应用程序被编译成运行在 Android 设备上的可执行代码。其重要性不应低估：.NET/Mono\
  \ 开发者可以通过 `Mono for Android` 针对 Android，如图 1.2 所示。\n\n图 1.2\n\n![1.2](img/c01f002.jpg)\n\
  \n`Mono for Android` 如何实现这一点的？它是否以某种方式允许 Windows Forms 应用程序被翻译或重新编译并部署到 Android\
  \ 上？`Mono for Android` 在 Android 操作系统上存在的原生编程层之上提供了一个 `.NET` 层。针对 `Dalvik` 的开发者将使用\
  \ Java 编写应用程序。`Mono for Android` 不提供交叉编译 Windows Forms 应用程序的机制，但它允许开发者构建在 Android\
  \ 上原生运行的应用程序。\n\n总的来说，`Mono for Android` 暴露的 `API` 是 `.NET 4 Framework` 核心功能、Silverlight\
  \ APIs 以及原生 `Dalvik Java VM` 的组合。`Mono for Android` 在 Android 原生 APIs 与 .NET 和 `C#`\
  \ 开发者熟悉的 APIs 之间提供了一个桥接（互操作）层。\n\n## 用于 Android 的 Mono for Android 组件\n\n`Mono for\
  \ Android` 由一组针对移动平台优化的程序集、命名空间和类组成。这些代码是 `.NET 4`、`Silverlight` 和 Windows Phone\
  \ 配置的组合，以及允许开发者利用 Android 平台的代码。\n\n### 命名空间和类\n\n`Mono for Android` 提供了丰富的命名空间和类，以支持为\
  \ iPhone 构建应用程序。以下是一些最常用的程序集以及它们提供的功能：\n\n* `Mono.Android.dll`: 该程序集提供了 Android\
  \ APIs 的 `C#` 绑定。这包含了支持 `Android.*` 命名空间。\n* `System.dll`: 该程序集为 `Mono for Android`\
  \ 提供了大量的 `.NET Framework` 功能。\n* `Mono.data.Sqlite.dll`: 该程序集是原生 `SQLite` 数据库的 `ADO.NET`\
  \ 提供程序。\n* `Mono.Data.Tds.dll`: 该程序集提供了对 `TDS` 协议的支持，该协议用于连接 SQL Server。\n* `OpenTK.dll`:\
  \ 该程序集支持 `OpenGL`。\n* `System.Json.dll`: 该程序集提供了对使用 `JSON`的支持。\n* `System.ServiceModel.dll`:\
  \ 该程序集提供了对 `WCF`的支持。\n* `System.Xml.dll`: 该程序集提供了对 `XML`的支持。\n* `System.Xml.Linq.dll`:\
  \ 该程序集提供了对 LINQ to XML 的支持。\n\n在这些程序集中，`Mono for Android` 还提供了对你可能重要的命名空间。这些：\n\n\
  * `Android`: `Android.*` 命名空间提供资源、类和应用程序权限支持。\n* `Android.Bluetooth`: 该命名空间提供对 `Bluetooth`的支持。\n\
  * `Android.Database`: 该命名空间提供对设备上 `SQLite` 数据库的支持。\n* `Android.Graphics`: 该命名空间提供对图形显示的支持。\n\
  * `Android.Hardware`: 该命名空间提供对 Android 设备上硬件（如相机）的支持。\n* `Android.Locations`: 该命名空间为位置提供必要的支持。\n\
  * `Android.Net`: 该命名空间提供对网络的支持，包括对 IP IP (`VoIP`) 和 WiFi 的支持。\n\n这些命名空间是 `Mono for\
  \ Android` 内部可用内容的一个小子集，且其功能非常自言易懂。此外，这些命名空间特定于 Android。使用这些命名空间编写的代码只会运行在基于 Android\
  \ 的设备上。\n\n## 开发工具\n\n无论你构建的是什么类型的项目，开发工具都是创建应用程序不可或缺的一部分。那些只有一堆文件、字符编辑器、用于调试的命令行输出以及将\
  \ make 作为构建应用程序的唯一方式的日子早已远去。\n\n在 `.NET Framework` 中工作的开发者熟悉 `Visual Studio`。`Visual\
  \ Studio` 是微软的开发工具。它支持解决方案、项目、视觉设计界面、数据库以及许多其他功能。\n\n同样，Mono 也有自己的开发工具；`MonoDevelop`\
  \ 是用于开发 `Mono` 的 IDE，它是 `SharpDevelop` IDE 的早期分支。最初 `MonoDevelop` 只在 Linux 上运行，但从\
  \ 2.2 版本开始，它可以在 Mac 和 Windows 上运行。`MonoDevelop` 允许你创建和管理项目以及调试和部署。\n\n感谢 Mono 团队制作了\
  \ `Mono for Android`，它可以跨 Visual Studio 和 `MonoDevelop` 工作。开发者可以自由选择这些开发 IDE 中的任何一个。目前，我个人发现\
  \ Windows 和 Mac 各自都有优势，包括：\n\n* 大多数 `Mono for Android` 开发者可能会在 Windows 上开始。\n* 在\
  \ Android 模拟器上调试效果非常好。\n\n# 移动开发\n\n在使用 `Mono for Android` 在 Android 上构建应用程序时，开发者需要记住几个关键点：\n\
  \n* Android 模拟器对于初始测试很有帮助，但对于所有测试并不一定准确。在模拟器中运行并不意味着它在所有 Android 设备上以相同的方式运行。最终测试应该在不同版本的\
  \ Android 设备上完成。\n\n![note](img/note.gif)根据编写本书时使用的 Android SDK，在设备上测试通常对于高级功能更准确。对于基础开发，模拟器更容易使用。得益于快照功能，处理起来通常更快。\n\
  \n* .NET 可执行文件相当较小，因为它们可以使用共享的框架副本。`Mono for Android` 有两种部署应用程序的方法。常见的方法是将应用程序和\
  \ `Mono for Android` 绑定。第二种方法是让应用程序共享 Mono 框架。这使得应用程序执行文件变小，但也意味着设备上必须安装 `Mono for\
  \ Android` 的 Mono 框架副本。\n\n![note](img/note.gif)在写作此时，建议将应用程序与 `Mono for Android`\
  \ 运行时绑定。这是目前构建发布版本（Release）时的做法。\n\n\n\n\n\n*   在设备上成为一个良好的“公民”是非常重要的。开发者需要不断思考如何实现那些作为良好公民的功能。\n\
  \n## 解决支持问题\n\n尽管 Mono for Android 是一项商业许可产品，但它仍在持续开发中，因此它可能不支持特定的命名空间或程序集。在这种情况下，你有两个选择：\n\
  \n1.  等待 Mono for Android 产品发布该程序集的实现。\n2.  在你的项目中拉取代码或引用必要的程序集。如果应用程序需要使用 `System.Web.*`\
  \ 命名空间中的代码，这种情况非常常见。例如，想象一个需要调用基于 REST 的 Web 服务并在发送之前对数据进行编码的应用程序。此时应该调用 `System.Web.HttpUtility.HtmlEncode()`。遗憾的是，`System.Web`\
  \ 命名空间默认并不是 Mono for Android 的一部分。你必须通过在应用程序中引用 `System.Web` 程序集来添加此命名空间。\n\n##\
  \ 设计问题\n\n除了为 Android 构建应用程序的性问题外，这里还有开发者应该注意的设计问题：\n\n*   不要为桌面环境设计应用程序，并认为它可以被缩小到\
  \ Android 或任何移动设备上。Android 没有桌面电脑那样的显示器、硬件或存储空间。Android 和移动设备应用程序适用于简单、用途有限的功能，但不应期望它们能完成桌面应用程序所做的一切工作。\n\
  \n*   Android 模拟器是一个很好的工具，但不要将你的测试限制在上面。模拟器仅仅是模拟器。由于模拟器主要运行在桌面端，因此键盘和鼠标与 Android\
  \ 模拟器相关。此外，要理解模拟器最终使用的是开发系统的 CPU。虽然设备的 CPU 对于设备本身来说没问题，但在性能方面，它真的无法与桌面电脑相比。桌面具有较高的点击速度、更大的内存，并且通常具有更高的速度和质量的互联网带宽。要真正测试一个复杂的设计，你必须在移动网络运行时，在\
  \ Android 移动设备上测试应用程序。\n\n*   在设备上进行测试时，尽管 WiFi 是移动网络，但你办公室或家中的 WiFi 通常比移动运营商的网络质量更高。通常，WiFi\
  \ 的延迟更低，带宽高于 3G（或更差）连接。应用程序必须在移动场景下进行测试。找一个同事开车带你到处转转来测试应用程序。\n\n# Android\n\n毫无疑问，Android\
  \ 设备在 2010 年上半年爆发式增长。尽管 Android 手机不是第一种图形手机，但它是第一个向手机设备制造商免费提供软件的产品，它易于使用，并提供了一个易于购买应用程序的市场。\n\
  \n## Android 历史\n\n2005 年 7 月，Google 收购了一家名为 Android, Inc. 的小公司，该公司涉及移动软件。通过这次收购，Google\
  \ 开始向移动设备方向发展。关于 Google 进入移动设备的传言在 2006 年 12 月开始激增。2007 年秋季，开放手持联盟（OHA）成立，目标是为移动设备创建一套标准。该联盟的核心是一个基于\
  \ `Linux Kernel` 版本 `2.6`（及更高版本）的移动设备架构，以及一个可以用于构建原生 Android 应用程序的 SDK。2008 年秋季，第一款\
  \ Android 手机上市了。\n\nAndroid 的首批产品在市场上的反响并不理想。它遭到了媒体和该平台首批用户的严重批评。然而，Android 与竞争平台相比有几个巨大的优势，而这些优势在当时显而易见。Android\
  \ 是一个开放平台。因此，制造商不仅在与其他移动设备制造商竞争，还在与开放手持联盟的其他成员竞争。这意味着硬件层面的创新速度非常显著，Android 平台与其它平台相比表现出了这一点。Android\
  \ 设备也不局限于某一个制造商或一个电信运营商。因此，电信运营商之间必须相互竞争。这两个因素以及其他因素导致 Android 和移动设备市场出现了大量的创新和进步。\n\
  \n在经历了一些初期的磨合后，Android SDK 已经成长了。（你可以在本章后面的部分找到关于 Android SDK 中可用工具的讨论——这些工具与 Mono\
  \ for Android 开发者相关。）在在 2007 年和 2008 年经过多次 Beta 发布后，SDK 的 1.0 版本于 2008 年 9 月发布。从那时起，已经推出了许多额外的\
  \ SDK 版本。\n\n2009 年秋季，OHA 引入了 Android 2.0 (Eclair) 操作系统。这对 Android 来说是一个里程碑式的事件。随着\
  \ Android 2.0 的发布，摩托罗发布了 Droid 手机，Verizon 开始对该产品进行大规模营销。从那起起，Android 在市场中迅速增长。\n\
  \n2010 年，OHA 发布了 Android 2.1。此外，HTC、摩托罗等公司还生产了一系列高端设备。这些产品的上市进一步加速了 Android 的增长和市场占有率。同时，许多制造商推出了基于\
  \ Android 的平板电脑设备。\n\n2011 年初，基于 Android 3.0（又名 Honeycomb）的设备上市。这个版本的 Android 针对平板电脑环境进行了优化。遗憾的是，这个版本的\
  \ Android 在市场上的反响并不理想。\n\n2011 年，Google 宣布并发布了 Android 4.0（又名 Ice Cream Sandwich）。Ice\
  \ Cream Sandwich 是统一了 Android 手机和平板电脑编程 API 的 Android 版本。\n\n增长一直是 Android 平台的标志。自\
  \ 2008 年首次可用以来，Android 的出货量显著增长。Gartner 集团预测，Android 到 2015 年将将看到巨大的增长。考虑到 2008\
  \ 年市场上 Android 设备如此之少，这种增长是令人震惊的。\n\n## 为 Android 编写 Web 应用程序\n\n为 Android 编写 Web\
  \ 应用程序相当简单。WebKit Web 浏览器是一个很好的工具；它很好地将 Web 应用程序缩放到 Android 屏幕上运行。它在运行高度依赖 JavaScript\
  \ 的应用程序方面表现良好。升级 Android Web 应用程序也只需在 Web 服务器上部署应用程序的新版本即可。许多应用程序都采用了这种方法。尽管 HTML5\
  \ 有许多很功能，但 Web 环境仍然存在一些固有的局限性。\n\n![note](img/note.gif)遗憾的是，Web 应用程序并不适用于所有的。需要某些后台处理和访问本地资源的应用程序在没有网络连接时也能工作，而且某些其他应用程序类型在这种模型下运行并不良好。\n\
  \n* * *\n\n所以，问题变成了如何编写一个适用于 Android 的原生应用程序。\n\n\n\n\n\n*   存在大量的外形态、屏幕尺寸和设备。一个应用程序在\
  \ HTC 设备上可能看起来很棒，但在稍旧的 Droid 设备上可能不是。开发者必须考虑设备之间的差异。例如，虽然 Android 版 Twitter 在 HTC\
  \ Android 设备上运行（如图 1.3 所示），但它在 Motorola Xoom Android 设备上运行时的外观肯定有所不同（如图 1.4 所示）（注意，为了保护隐私，这些插图中已删除了用户图片）。\n\
  \n*   开发者必须考虑到 Android 操作系统的各种版本。一些用户可能在运行 Android 2.0，而另一些用户则可能在运行 3.0。\n\n*  \
  \ 开发者对通过 Android 市场发布的应用程序销售数字必须保持理性。尽管 Android 经历了惊人的增长率，但这种兴奋必须冷静，因为与 Apple App\
  \ Store 相比，Android 市场上免费应用程序的比例更高。你的 Android 版本应用程序的销售数量可能更多，但 Android 上应用程序的平均销售价格低于\
  \ iPhone 设备的平均销售价格。\n\n图 1.3\n\n![1.3](img/c01f003.jpg)\n\n图 1.4\n\n![1.4](img/c01f004.jpg)\n\
  \n开发者需要意识到这些问题。在为 Android 构建应用程序时，这些问题可能要求你花费更多时间进行开发。\n\n## Android SDK 工具\n\n\
  Android SDK 包含许多工具，包括一组用于 Android 平台的库、一个调试器、模拟器以及各种文档。以下工具对于 Mono for Android 开发者来说是最重要的：\n\
  \n*   **库 (Libraries)**：Mono for Android 是现有基于 Dalvik 的 API 之上的层。因此，学习 Dalvik 库的\
  \ API 调用将帮助你学习 Mono for Android。\n\n*   **模拟器 (Simulator)**：模拟器是开发者测试应用程序时使用的第一个工具。它允许他们创建各种模拟的\
  \ Android 版本、屏幕分辨率、内存和其他硬件因素。\n\n开发者会发现缺失的一点（至少在 Mono for Android 的早期版本中）是设计界面面（design\
  \ surface）。当 Mono 团队交付 MonoTouch 时，它使用了 Interface Builder SDK 工具。遗憾的是，Android SDK\
  \ 没有设计界面面。此外，由于时间限制，Mono for Android 的初始版本也不包含设计界面面。\n\n幸运的是，开发者们并非一无所获。目前有两种方法可以为\
  \ Mono for Android 创建用户界面：\n\n1. 手动编辑用户界面 XML。显然，这种方法很容易出错。\n2. 通过第三方工具（如 DroidDraw）设计用户界面。DroidDraw\
  \ 是一个用于构建 Android 用户界面的独立设计界面面。DroidDraw 可以在图 1.5 中看到。\n\n图 1.5\n\n![1.5](img/c01f005.jpg)\n\
  \n## Android 开发成本\n\nSDK 是免费下载的。然而，要发布 Android 软件，开发者必须加入 Android 市场开发计划。目前在美国的费用为每年\
  \ 25 美元。加入费用因国家而异。向设备分发应用程序的能力取决于是否拥有必要的开发证书。在加入 Android 开发计划后，可以通过 Android 开发者网站获取这些证书。证书将在第\
  \ 16 章中进行更多讨论。\n\n# 跨平台替代方案\n\n选择跨平台开发工具（如 Mono for Android 或 MonoTouch）不是一个轻率的决定。尽管\
  \ Mono for Android 提供了原生开发与 .NET 栈集的卓越结合，并利用了 Visual Studio 的功能，但不仅要意识到原生与非原生开发工具之间的差异，还要理解各种跨平台选项之间的差异，这是重要的。\n\
  \n## 其他跨平台工具\n\n除了 Mono for Android，还有其他几个选项可以用于开发针对 Android 以及其他平台的移动应用程序。以下是其他跨平台移动开发工具的示例：\n\
  \n*   **PhoneGap** 是一种跨平台移动开发工具，侧重于使用基于标准的 Web 技术，包括 HTML5、jQuery Mobile 等。与 Mono\
  \ for Android 类似，PhoneGap 使用通用技术，允许开发者不仅为其目标移动设备编写应用程序，还可以直接访问设备的一些原生功能，例如指南针、摄像头或文件系统。\n\
  \n*   **Appcelerator Titanium** 是另一种跨平台工具，它允许开发者使用 HTML、JavaScript 以及他们自己的 API 库编写应用程序，该库允许访问移动设备的若干项功能。与\
  \ Mono for Android 类似，Titanium 可以被编译为原生语言，这意味着你可以提供与其他原生应用程序可能相同的体验。\n\n*   **RhoMobile\
  \ Rhodes** 是一个基于 Ruby 的框架，允许你构建跨平台应用程序。该工具允许你编译成原生应用程序，并访问设备的许多功能。这些工具是目前最流行的跨平台工具之一。因为需要以尽可能少的努力目标多个平台是一个共同问题，你有许多不同的解决方案可以考虑。\n\
  \n## 选择跨平台工具的考量\n\n在选择跨平台工具时，你必须考虑许多因素。在某些情况下，某些选项可能过于简单，维护可能会变得难以进行甚至不可能。其他工具可以提供许多原生功能，但在过程中引入了比原生方法可能更多的复杂性。因此，正确的工具选择至关重要。以下章节将讨论开发者应该对工具问自己的几个问题。\n\
  \n### 工具如何允许你编写应用程序？\n\n就跨平台工具而言，它们倾向于采取两种方法允许开发者编写应用程序。第一种方法是利用移动设备对网络浏览的原生支持，而第二种方法是开发一种手段，将通用语言（如\
  \ `C#` 或 `JavaScript`）转换为原生语言（如用于 Android 的 `Java` 或用于 iOS 的 `Objective-C`）。\n\n\
  利用移动设备对网络浏览的自然亲和力允许开发者主要使用 `HTML` 和 `JavaScript`，这使得大量潜在的移动开发者能够上手开发。此外，还有大量的开发工具和环境使开发过程流畅且无痛。这种方法的一个很好的例子就是\
  \ `PhoneGap`。\n\n然而，这种方法倾向于有几个缺陷。首先，这种方法产生的是带有原生功能的 Web 应用程序，而不是完整的原生应用程序。尽管 Web\
  \ 应用程序在过去几年取得了巨大进步，但它们与原生应用程序大不相同，有自己的特殊缺点。这种方法的第二个缺陷是，对原生功能的支持可能是有限的，某些情况下是不可能的。通常，对原生功能的访问是通过自定义的\
  \ `JavaScript API` 实现的。\n\n\n\n\n第二种方法——从通用语言翻译或编译为原生语言，允许使用户在利用应用程序原生速度和功能的同时，使用另一种更易于学习的语言进行编写。这种方法的巨大优势在于，你将获得原生应用程序的外观和体验，以及原生性能速度。`Mono\
  \ for Android` 就是这种方法的一个绝佳示例。\n\n这种方法的缺点是，这些解决方案通常需要稍微高级的技能组合。基于 浏览器的方法通常只需要对 `HTML`\
  \ 和浏览器页面请求生命周期有基础了解，而编译方法则要求对移动平台的底层架构和设计范式有理解。例如，`Mono for Android` 开发者在开始编写应用程序之前，至少需要对\
  \ `Android` 有基础的了解。最后，某些跨平台工具可能需要一些特定平台的代码来完全补充解决方案——特别是在处理 UI 逻辑时。\n\n### 该工具支持哪些设备功能？\n\
  \n在考虑要选择的工具时，你需要清楚作为应用程序开发人员，哪些功能对你最重要。如果你正在编写一个向用户显示某些数据的简单应用程序，你可能并不担心你的解决方案是否支持\
  \ `accelerometer`（加速度计）。然而，如果你正在开发一个简单的游戏，这可能是一个成败的关键功能。在大多数情况下，每个工具供应商都会明确列出其产品的局限性。\n\
  \n![note](img/note.gif)在使用诸如 `Mono for Android` 等跨平台工具时，开发者往往是为了简单和熟悉而牺牲了功能或灵活性。在选择跨平台工具之前，请确保你对正尝试创建的内容有一个通用的概念，并确保该工具支持你所需的功能。幸运的是，`Mono\
  \ for Android` 的限制非常少，并且在 [`docs.xamarin.com/android/about/limitations`](http://docs.xamarin.com/android/about/limitations)\
  \ 有清晰定义。\n\n### 该工具支持哪些平台？\n\n市上有许多跨平台工具，每种工具支持的平台数量不同，从大多数移动设备操作系统到各种桌面操作系统。在选择工具时，请考虑你计划在哪里部署应用程序，以及部署的应用程序的设计和使用模式是否符合目标平台。\n\
  \n例如，`Appcelerator Titanium` 自榜不仅可以部署到一些主要的移动平台，还可以部署到 `Windows`、`Linux` 和 `Mac`。另一方面，`Rhodes`\
  \ 专注于支持主要的移动平台——包括 `Windows Phone 7`、`RIM` 和 `Windows Mobile`。\n\n尽管我们讨论了功能支持的考虑，但请确保你所需的功能在你想要部署的所有平台上都得到了支持。例如，如果你的应用程序依赖于设备的\
  \ `compass`（指南针）功能，并且你想针对 `Android` 和 `WebOS`，那么 `PhoneGap` 就不适合你平台。\n\n### 该工具需要什么技能组合？\n\
  \n每种方法都提供某种用于开始应用程序开发的通用语言。无论该语言是 `HTML` 还是 `C#`，确保你内部拥有涵盖该工具开发所需的技能至关重要。此外，某些解决方案要求你对移动平台的框架有深入的了解，或者有时对工具的自定义\
  \ `APIs` 有深入了解。\n\n通过 `HTML` 方法，对 `HTML` 和 `JavaScript` 的深刻理解可以帮助开发者走得很远。另一方面，翻译/编译方法通常要求对目标平台框架有基本的了解——特别是在开发用户界面方面。\n\
  \n### 存在哪些工具支持开发？\n\n你的跨平台工具最重要的考虑因素之一是存在什么样的开发工具来支持编码过程。使用专用的专利工具与使用全功能开发环境（如 `Visual\
  \ Studio`）相比，解决方案的开发时间可能会有巨大差异。\n\n### 开发社区和支持渠道活跃吗？\n\n在考虑你选择的跨平台工具时，花些时间熟悉开发社区。是否有活跃的邮件列表或论坛？开发者响应用户请求的频率有多高？其他开发者互相回答问题的频率是多少？开发者支持不力或社区停滞的解决方案是不健康的信号。\n\
  \n### 该工具有哪些成功的应用程序部署案例？\n\n大多数跨平台工具供应商都会快速列出任何应用程序成功案例作为吹嘘他们解决方案的方式。花些时间下载这些应用程序，看看它们在你的目标移动设备上的交互和性能如何。如果有机会，花时间与应用程序开发者交流，询问他们使用此工具\
  \ set 的开发经验。\n\n如果你正在阅读这本书，你显然对 `Mono for Android` 作为一个解决方案感兴趣。考虑到这一点，讨论跨平台开发的替代方法似乎有些奇怪。采用这种方法的原因是帮助你对开发工具做出明智的决策，而不是偶然的决定。通过花时间了解其他解决方案的优缺点，希望你将能够为你的应用程序做出最佳选择。`Mono\
  \ for Android`（以及 `Mono Touch`）具有许多强大功能，使其能够适应几乎任何开发场景。\n\n为了回答我们之前的问题，`Mono for\
  \ Android` 脱颖而出成为一种优秀的跨平台开发工具有非常充分的理由：\n\n*   `Mono for Android` 让开发者能够访问 `Microsoft`\
  \ 提供的工具和开发者堆栈。考虑到 `Microsoft` 投入到 `Visual Studio` 的精力，这对开发者来说是一个巨大的收益。你可以继续在 `Visual\
  \ Studio` 中工作并使用现有的工具，如 `ReSharper`。\n*   `Mono for Android` 以原生方式运行，提供了几乎所有的原生能力。此外，通过支持特定平台的\
  \ UI 元素，它允许开发者重用大部分代码，而不牺牲匹配预期的性能和活性。\n*   `Mono for Android` 拥有大型且活跃的开发社区。`Mono\
  \ for Android` 开发者积极解决任何开发者的问题。\n\n# 总结\n\n本回顾了以下内容：\n\n*   `.NET Framework` 与 `Mono`\
  \ 的产品对比\n*   `Mono for Android`，允许 `.NET` 开发者针对 `Android`\n*   `Android` 平台、许可及其操作系统\n\
  *   开发 `Android` 应用程序的跨平台替代方案\n\n你现在应该理解使用 `.NET/C#` 构建 `Android` 应用程序所需的工具。下一章将探索使用\
  \ `Visual Studio` 和 `MonoDevelop` 构建 `Mono for Android` 应用程序的细节。\n\n# 第 2 章\n\n\
  ## Mono for Android 简介\n\n## 本章内容：\n\n*   `Mono` 和 `Mono for Android` 简介\n*   配置开发环境\n\
  *   适用于 `Visual Studio` 的 `Mono for Android` 工具\n*   调试与部署\n\n\n\n\n\n什么是 Mono for\
  \ Android？本章为 Mono for Android 开发提供了基础。它首先概述了 Mono，然后讨论了 Mono for Android、开发栈配置，以及如何开发和部署一个“Hello\
  \ Mono for Android”应用程序——首先部署到模拟器，然后部署到你的 Android 手机上。\n\n# 在开始开发之前\n\n在开始开发之前，你需要了解一些项目，这些项目将帮助你理解开发环境和涉及的工具。本节涵盖了\
  \ Mono 是什么以及它是如何实现的。然后，它讨论了什么是 Mono for Android 以及其优势和实现。最后，本节在进入开发之前讨论了开发栈。\n\n\
  ## 什么是 Mono？\n\nMono 是由 Xamarin 赞助的开源项目，旨在创建 .NET 通用语言基础设施 (`CLI`) 的 Ecma 标准实现、一个\
  \ C# 编译器和一个开源开发栈。Mono 项目由 Ximian 于 2001 年启动，并在 2004 年发布了 `1.0` 版本。\n\n### Mono 实现目标\n\
  \nMono 实现目前指向三个目标：\n\n* 开源的 `CLI`\n* 一个 C# 编译器\n* 开源开发栈\n\n`CLI` 为编译为公共中间语言 (`CIL`)\
  \ 的语言提供运行时环境。C# 编译器负责将 C# 代码编译为 `CIL` 以在运行时执行。开源开发栈促进了开发，并包含了 `MonoDevelop` 中的 IDE\
  \ 以及除核心库之外的多个库，以提供开源的跨平台开发。这些库包括用于图形用户界面开发的 `GTK#`、用于 UNIX/Linux 兼容性的 `POSIX` 库、`Gecko`\
  \ 库、数据库连接库以及通过 `RELAX NG` 支持 XML 语言。\n\n### Mono 标准\n\nMono 遵循 Ecma 标准。Ecma International\
  \ 成立于 1961 年，旨在支持信息和通信技术的标准化。2005 年，Ecma 批准了 C# 第 3 版和 `CLI` 作为 `Ecma 334` 和 `335`\
  \ 的更新。目前，`Ecma 335` `CLI` 的工作草案正在进行中。\n\nMono C# 编译器在 `2.6` 版本中已完全符合 C# 版本 `1`、`2`\
  \ 和 `3` 的 Ecma 标准。`2.6` 版本还包含了 C# `4` 的预览，而 C# `4` 的完全功能版本将在 `2.8`set 的主分支中可用。\n\
  \n## 什么是 Mono for Android？\n\nMono for Android 是一种运行时和开发栈，允许 .NET 开发者利用他们对 Visual\
  \ Studio 和 C# 的知识来为 Android 设备开发应用程序。\n\n* **运行时**：Mono for Android 运行时运行在 Android\
  \ 栈中 Linux 内核上的应用程序。它解释 Mono 字节码并处理与 `Dalvik` 时的通信，以调用原生 Android API。\n* **开发栈**：Mono\
  \ for Android 也是一个开发栈，提供了为 Android 设备创建和打包应用程序所需的工具。\n\n## 为什么我需要 Mono for Android？\n\
  \n鉴于 Android 平台有一个基于 Java 的开源开发栈，并以 `Eclipse` 作为视觉开发环境，询问为什么需要 Mono for Android\
  \ 是合理的。使用 Visual Studio 的 .NET 开发者有三个主要原因：熟悉的开发环境、熟悉的 API，以及结果就是快速启动。\n\n### 熟悉的开发环境\n\
  \n正如每位开发者所知，学习新的开发栈是非常耗时的且可能是痛苦的。Mono for Android 允许 .NET 开发者继续使用 .NET 开发的两个核心工具：Visual\
  \ Studio 和 C#。\n\n* **Visual Studio**：Visual Studio 是一个面向 .NET 的优秀且健壮的 IDE。通过使用\
  \ Visual Studio 的 Mono for Android 工具，你不需要更改 IDE 或你喜欢的设置。\n* **C#**：某些 .NET 开发者仅使用\
  \ Visual Basic .NET，但大多数 .NET 开发者都熟悉 C#。虽然 C# 和 Java 在结构上相似，但每种语言惯用法的许多差异使得编写更加流畅。尽管精通\
  \ C# 的开发者不需要花费大量时间学习 Java 惯用法，但如果他们可以坚持使用已经熟悉的语言，他们就不需要再花任何时间了。\n\n### 熟悉的 API 和库结构\n\
  \n留在 .NET 世界中允许你使用熟悉的 API 和库结构进行工作。表 2.1 显示了作为 Mono for Android `4.0.1` 的程序集。\n\n\
  表 2.1 Mono for Android 程序集\n\n![c02tnt001](img/c02tnt001.jpg) ![c02tnt001](img/c02tnt001a.jpg)\n\
  \n[`mono-android.net/documentation/assemblies`](http://mono-android.net/documentation/assemblies)\n\
  \n因此，利用你喜爱的开发环境以及熟悉的 API，你将实现 Android 开发的快速启动。\n\n## 使用 Mono for Android 的权衡是什么？\n\
  \n当你决定不使用原生 API 和开发栈时，权衡是必然的。它们需要与使用更舒适但抽象的层带来的优势进行权衡。\n\n### 等待改进\n\n虽然放弃原生 Java\
  \ 和 `Eclipse` 转而使用 Visual Studio 有上述的优点，但它也有一些缺点。第一个是，你通常必须等待最新的改进。也就是说，通常只要 Android\
  \ SDK 中出现了新功能或性能增强，你就必须等待 Mono for Android 的下一次发布。\n\n### 潜在的性能损失\n\n第二个权衡是性能。Mono\
  \ for Android 运行时必须与 `Dalvik` 运行时通信以完成许多工作。然而，这种开销通常是微不足道的，并且被提到的优势所抵消。\n\n安装了 Visual\
  \ Studio 的 Mono for Android 工具后，启动一个新的 Mono 项目就像 `File ⇒ New ⇒ Project ⇒ C# ⇒ Mono\
  \ for Android` 一样简单。我们将在接下来详细介绍。\n\n### 内存管理\n\nMono for Android 分配的许多对象是它们代表的 Java\
  \ 对象的封装。因此发生了以下情况：每当你分配一个封装相应 Java 类型的类型时，就会创建两个对象：\n\n1. Java 堆中的 Java 对象\n2. Mono\
  \ 堆中的 Mono `proxy` 代理对象\n\nMono for Android 做了一些工作来确保只要其中一个对象引用另一个，两个对象就能保持存活。也就是说，只要\
  \ Mono 垃圾收集器 (`GC`) 引用对象，Java 端的对象就会存活，反之亦然。这是通过构建时由 `mandroid.exe` 工具创建的代理对象实现的。\n\
  \n然而，垃圾回收本质上是惰性的，只在需要时才执行收集，而不是仅仅在对象超出范围时执行。这意味着跨虚拟机的垃圾将停留比平均时间更久，这是不可避免的。\n\n因此，在分配大量临时使用的对象时，显式地释放这些对象是值得的。这种方法的方便方法是对新对象使用\
  \ `using` 块，这将隐式地释放作为 `using` 子句的目标的新对象，从而释放 Mono 端的封装，允许 Java-VM 收集该对象，防止过多的临时对象停留太久。\n\
  \n![note](img/note.gif)有关垃圾回收的更多细节，您应该参考以下链接中的文档：[`mono-android.net/index.php?title=Documentation/GC&highlight=garbage+collection`](http://mono-android.net/index.php?title=Documentation/GC&highlight=garbage+collection)。\n\
  \n\n\n\n\n虽然 Mono for Android 的开发环境倾向于在 Visual Studio 中使用 C# 进行工作，但除此之外，还需要许多其他组件。\n\
  \n### Java SDK\n\n首先，你需要安装 `Java SDK`，你可以在 [`java.sun.com`](http://java.sun.com)\
  \ 找到它。你可能会奇怪，既然 Mono for Android 似乎是为了让你在 Visual Studio 中使用 C# 进行开发，为什么还需要 Java\
  \ 呢？Android SDK 是用 Java 开发的，因此运行 SDK 附带的所有工具都需要 Java。其中最重要的工具是 `Android emulator`（Android\
  \ 模拟器），它是用于部署到实际设备之前进行快速调试和测试所必需的。然而，你将会熟悉的其他工具也依赖于 Java。\n\n### Android SDK\n\n\
  安装 `Java SDK` 之后，就可以安装 `Android SDK`。你可以从 [`developer.android.com/sdk/index.html`](http://developer.android.com/sdk/index.html)\
  \ 下载 Android SDK，在里面你会找到下载 Windows 安装程序的链接。下载好 SDK 后，安装分为四个步骤。\n\n1. 第一步是运行 SDK\
  \ 安装。这正如听起来一样简单。运行 Windows 安装程序，就完成了。\n2. 第二步是下载你想要使用的 APIs。运行 `AVD Manager.exe`\
  \ 程序，选择左侧的“Available packages”（可用包）项。这允许你安装下一步中将使用的不同 Google APIs 和 SDK 平台。你可以安装所有需要的平台，但对于我们的目的，请确保至少安装了\
  \ Level 8 平台，它对应 Android 2.2。如果你安装了所有可用包，你应该能看到一个类似于图 2.1 的视图。\n3. 现在 SDK 已经完全设置好了，第三步是配置\
  \ Android 模拟器。在 Android SDK 和 `AVD Manager` 中，选择“Virtual devices”（虚拟设备），然后点击 Create（创建）按钮。你会看到图\
  \ 2.2 所示的窗口。在 `Name` 字段中，输入 `Android_22`。在 `Target` 下拉菜单中，选择 `Android 2.2 - API\
  \ Level 8`。在 `SD Card` 单选组中，选择 `Size` 并输入 `512`。现在点击 `Create AVD`。你会得到一个确认 `Android_22\
  \ AVD` 已成功创建的对话框。\n4. 第四步是启动你配置的模拟器。从列表中选择 `Android_22 AVD`，并点击 Start（启动）按钮。出现的对话框允许你更改一些启动设置。目前，默认设置就可以，所以点击\
  \ Launch（启动）按钮。过段时间后，你应该能看到一张类似于图 2.3 所示的图像。一两分钟后，你应该能看到熟悉的 Android 图标，但在模拟器完全启动之前可能需要几分钟，如图\
  \ 2.4 所示。\n\n图 2.1\n\n![2.1](img/c02f001.jpg)\n\n图 2.2\n\n![2.2](img/c02f002.jpg)\n\
  \n图 2.3\n\n![2.3](img/c02f003.jpg)\n\n图 2.4\n\n![2.4](img/c02f004.jpg)\n\n一旦模拟器运行，你可以让它保持运行，以便在“Hello\
  \ Android”开发过程中节省一些启动时间。\n\n### Visual Studio\n\n对于 Mono for Android 开发，你必须拥有 Visual\
  \ Studio 2010 专业版或更高版本才能运行 Mono for Android 插件。Visual Studio 2010 Express 版是不够的，因为它不支持插件。Visual\
  \ Studio 的安装过程不在本文的讨论范围内，但在继续之前，你需要确保已安装了 Visual Studio 2010。\n\n#### Mono Tools\
  \ for Visual Studio\n\nMono Tools for Visual Studio 是作为插件添加到 Visual Studio 中的工具，它们有助于为开源\
  \ Mono 开发堆栈提供 .NET 开发的跨平台兼容性。我们在这里要进行的操作不需要这些工具。但是，如果你对 Mono 开发广泛感兴趣，或者想将在 Windows\
  \ 上使用 Visual Studio 编写的代码部署到 Mono 支持的另一个平台，那么这些工具是非常值得的，而且现在安装也很方便。你可以在 [`mono-tools.com/download/`](http://mono-tools.com/download/)\
  \ 找到这些工具。\n\n#### 安装 Mono for Android 插件\n\n一旦所有准备工作就绪，你就可以为 Visual Studio 安装 Mono\
  \ for Android 插件。\n\n# 与 Android 的开发\n\n本章节涵盖了基于 Android 的基础应用程序。\n\n## Mono for\
  \ Android\n\n对于 Mono for Android 开发，你必须拥有 Visual Studio 2010 专业版或更高版本才能运行 Mono for\
