  \           }\n        }\n\n        public void OnLocationChanged(Location location)\n\
  \        {\n            lat = location.Latitude;\n            lon = location.Longitude;\n\
  \        }\n\n        public void OnProviderDisabled(string provider)\n        {\
  \ }\n\n        public void OnProviderEnabled(string provider)\n        { }\n\n \
  \       public void OnStatusChanged(string provider, Availability status, \n   \
  \          Bundle extras)\n        { }\n    }\n}\n```\n此代码位于 `MagneticSensors\\\
  MagneticSensors\\Activity1.cs`\n\n图 8.10 显示了从我在田纳西州诺克斯维办公室到亚特兰达的驾驶路线。\n\n你可能会担心如果手机听不懂地址怎么办。坦率地说，通过使用内置活动，这种情况已经解决了。内置地图活动为用户提供了可能作为目的地的地址选择，如图\
  \ 8.11 所示。\n\n# 总结\n\n本章探讨了与设备各种功能的集成。这些功能可以用于向用户展示周围环境，并以独特且非常有用的方式提供信息。希望开发者能够利用这些或其他功能创建吸引人的应用程序。我们演示的一些设备功能包括：\n\
  \n*   传感器帮助用户确定设备的加速度、航向、方向以及其他特定设备环境的信息。\n*   振动告诉用户设备上发生了事件。\n*   网络连接通过蓝牙和 WiFi\
  \ 实现。\n*   语音识别允许用户根据语音输入执行操作。这与传感器磁计结合使用，为用户提供导航路线。\n\n# 第 9 章 使用多媒体 — 音频、视频和相机\n\
  \n## 本章内容\n\n*   播放音频和视频\n*   SurfaceView 和视频播放\n*   录制音频和视频\n*   录制视频和拍照\n*   读取和修改图像\
  \ Exif 数据\n*   将媒体添加到媒体存储库\n*   使用语音识别\n\n\n多媒体通常包含所有有趣的非文本内容：图片、声音、视频等。本章将为你介绍如何在\
  \ Mono for Android 中处理这些内容。Android 将其开放理念引入多媒体领域，并且对媒体提供者没有偏见。这确保了对图像、音频和视频格式的广泛支持，这些格式可以从本地访问或流传输到设备。\n\
  \n本章侧重于使用可用 API 播放和录制音频视频。本章还了应用程序的语音输入。\n\n为了有效运行本章中的示例代码，你需要使用真实的 Android 设备，因为模拟器不支持摄像头，那些使用摄像头的示例将失败。\n\
  \n# Android 媒体类\n\n下表提供了 Mono for Android 封装的 Android 媒体类列表，用于实现本章中的操作。此外，你将在本章的示例中使用\
  \ `MediaPlayer`、`MediaRecorder` 以及 `ExifInterface`。\n\n表 9.1: Android 媒体类\n\n| 类\
  \ | 说明 |\n| :--- | :--- |\n| `AsyncPlayer` | 播放音频 URI，但加载和准备音频在后台线程中完成，以防止前景线程阻塞和运行缓慢。\
  \ |\n| `AudioFormat` | 提供对许多音频格式和通道配置常量的访问。 |\n| `AudioManager` | 提供对音量和铃声模式控制的访问。\
  \ |\n| `AudioRecord` | 管理 Java 应用程序的音频资源，从平台的音频输入硬件录制音频。 |\n| `AudioTrack` | 为 Java\
  \ 应用程序管理并播放单个音频资源。 |\n| `CamcorderProfile` | 获取摄像机应用程序的预定义摄像机配置文件。 |\n| `CameraProfile`\
  \ | 获取用于相机应用程序中低、中、高质量设置的预定义静态图像捕捉 (JPEG) 质量级别 (0 到 100)。 |\n| `ExifInterface` |\
  \ 读取和写入 JPEG 文件中的交换图像文件格式 (exif) 标签。 |\n| `FaceDetector` | 识别位图图形对象中的人脸。 |\n| `FaceDetector.Face`\
  \ | 包含识别位图中图中脸部位置的所有信息。 |\n| `JetPlayer` | 提供对 JET 内容播放和控制的访问。 |\n| `MediaMetadataRetriever`\
  \ | 提供统一的接口，用于从输入媒体文件中检索帧数据和元数据。 |\n| `MediaPlayer` | 控制音频/视频文件和流的播放。 |\n| `MediaRecorder`\
  \ | 录制音频和视频。 |\n| `MediaRecorder.AudioEncoder` | 定义 `MediaRecorder` 使用的音频编码。 |\n\
  | `MediaRecorder.AudioSource` | 定义 `MediaRecorder` 使用的音频源。 |\n| `MediaRecorder.OutputFormat`\
  \ | 定义 `MediaRecorder` 使用的输出格式。 |\n| `MediaRecorder.VideoEncoder` | 定义 `MediaRecorder`\
  \ 使用的视频编码。 |\n| `MediaRecorder.VideoSource` | 定义 `MediaRecorder` 使用的视频源。 |\n| `MediaScannerConnection`\
  \ | 提供应用程序将新创建或下载的媒体文件传递给媒体扫描服务的方法。 |\n| `Ringtone` | 提供播放铃声、通知或类似类型声音的快速方法。 |\n\
  | `RingtoneManager` | 提供对铃声、通知和其他类型声音的访问。 |\n| `SoundPool` | 为应用程序管理并播放音频资源。 |\n\
  | `ThumbnailUtils` | 为媒体提供者生成程序。 |\n| `ToneGenerator` | 提供播放 DTMF 拨调 (ITU-T 建议 Q.23)、呼叫监控调\
  \ (3GPP TS 22.001, CEPT) 和专用调 (3GPP TS 31.111) 的方法。 |\n\nAndroid 在线文档\n\n## 播放音频和视频\n\
  \n音频视频的播放由 `MediaPlayer` 对象处理。该对象方便地从开发者那里抽象了特定媒体类型的处理。本节研究媒体播放器、它支持的格式以及如何控制它。\n\
  \n## 媒体播放器支持的格式\n\n那么，什么是媒体播放器，你如何控制它？\n\n媒体播放器支持以下格式：\n\n* 音频\n    * AAC LC/LTP\n\
  \    * HE-AACv1 (AAC+)\n    * HE-AACv2 (Enhanced AAC+)\n    * AMR-NB\n    * AMR-WB\n\
  \    * MP3\n    * MIDI\n    * Ogg Vorbis\n    * PCM/WAVE\n    * FLAC (从 Android\
  \ 3.1 开始)\n* 视频\n    * H.263\n    * H.264 AVC\n    * MPEG-4 SP\n    * VP8\n\n使用\
  \ `MediaPlayer` 对象播放这些任何媒体都是一个五步骤的过程：\n\n1. 初始化一个 `MediaPlayer` 对象。\n2. 为播放媒体播放器做好准备。\n\
  3. 开始播放。\n4. 可选在完成前暂停或停止播放。\n5. 完成播放。\n\n![note](img/note.gif) 如需对 `MediaPlayer`\
  \ 对象进行更详细的审查，请参考 Android 文档：[`developer.android.com/reference/android/media/MediaPlayer.html`](http://developer.android.com/reference/android/media/MediaPlayer.html)。\n\
  \n***\n\n## 编写音频播放\n\n那么，你如何播放音频？如下代码段所示，有四种实例化新播放器对象的方法：\n\n```\nContext appContext\
  \ = this;\nMediaPlayer resourcePlayer = MediaPlayer.Create(appContext,\nResources.Raw.my_audio);\n\
  MediaPlayer filePlayer = MediaPlayer.Create(appContext,\nAndroid.Net.Uri.parse(\"\
  file://\"+ Android.OS.Environment.ExternalStorageDirectory\n  +\"/localfile.mp3\"\
  ));\nMediaPlayer urlPlayer = MediaPlayer.Create(appContext,\nAndroid.Net.Uri.parse(\"\
  http://site.com/audio/audio.mp3\"));\nMediaPlayer contentPlayer = MediaPlayer.Create(appContext,\n\
  Settings.System.DefaultRingtoneUri);\n```\n\n你可以从此代码段中看到实例化 `MediaPlayer` 对象的四种方法是使用静态函数\
  \ `Create`，并传入应用程序上下文以及以下附加参数之一：\n\n* 资源标识符 (`Resources.Raw.my_audio`)\n* 使用 `file://`\
  \ 方案指向本地文件的 URI (`\"file://\"`+`Android.OS.Environment.ExternalStorageDirectory`\
  \ ++\"/localfile.mp3\"`)\n* 作为 URL 的在线音频资源 URI (http://site.com/audio/audio.mp3)\n\
  * 指向本地内容提供者行的 URI (`Settings.System.DefaultRingtoneUri`)\n\n下面的程序说明了如何使用这四种技术分别播放音频。首先，使用\
  \ `SimpleAudioPlayback` 作为项目名称创建一个新的默认项目。创建新项目后，编辑字符串资源如下：\n\n![download](img/download.gif)\n\
  \n```xml\n<?xml version=\"1.0\" encoding=\"utf-8\"?>\n<resources>\n    <string name=\"\
  PlayFromId\">通过 ID 播放音乐</string>\n    <string name=\"PlayFromNet\">从互联网播放音乐</string>\n\
  \    <string name=\"PlayFromFile\">从文件播放音乐</string>\n    <string name=\"PlayFromProvider\"\
  >从内容提供者播放音乐</string>\n    <string name=\"ApplicationName\">SimpleAudioPlayback</string>\n\
  </resources>\n```\n\n`SimpleAudioPlayback` 程序代码位于 `SimpleAudioPlayback` 文件夹中。\n\n\
  编辑字符串后，打开 `main.axml` 将布局更改为：\n\n![download](img/download.gif)\n\n```xml\n<?xml\
  \ version=\"1.0\" encoding=\"utf-8\"?>\n<LinearLayout xmlns:android=\"http://schemas.android.com/apk/res/android\"\
  \n    android:orientation=\"vertical\"\n    android:layout_width=\"fill_parent\"\
  \n    android:layout_height=\"fill_parent\"\n    >\n<Button\n    android:id=\"@+id/PlayFromIdButton\"\
  \n    android:layout_width=\"fill_parent\"\n    android:layout_height=\"wrap_content\"\
  \n    android:text=\"@string/PlayFromId\"\n    />\n<Button\n    android:id=\"@+id/PlayFromNetButton\"\
  \n    android:layout_width=\"fill_parent\"\n    android:layout_height=\"wrap_content\"\
  \n    android:text=\"@string/PlayFromNet\"\n  />\n<Button\n    android:id=\"@+id/PlayFromFileButton\"\
  \n    android:layout_width=\"fill_parent\"\n    android:layout_height=\"wrap_content\"\
  \n    android:text=\"@string/PlayFromFile\"\n  />\n<Button\n    android:id=\"@+id/PlayFromProviderButton\"\
  \n    android:layout_width=\"fill_parent\"\n    android:layout_height=\"wrap_content\"\
  \n    android:text=\"@string/PlayFromProvider\"\n  />\n</LinearLayout>\n```\n\n\
  将 `Activity1` 的主体更改为如下：\n\n\n\n\n\n![download](img/download.gif)\n\n```sharp\nprotected\
  \ override void OnCreate(Bundle bundle)\n        {\n            base.OnCreate(bundle);\n\
  \n            // 从 \"main\" 布局资源设置我们的视图\n            SetContentView(Resource.Layout.Main);\n\
  \n            // 从布局资源获取我们的按钮，\n            // 并为它们绑定事件\n            Button playFromIdButton\
  \ = \n                FindViewById<Button>(Resource.Id.PlayFromIdButton);\n    \
  \        Button playFromNetButton = \n                FindViewById<Button>(Resource.Id.PlayFromNetButton);\n\
  \            Button playFromFileButton = \n                FindViewById<Button>(Resource.Id.PlayFromFileButton);\n\
  \            Button playFromProviderButton = \n                FindViewById<Button>(Resource.Id.PlayFromProviderButton);\n\
  \n            playFromIdButton.Click += delegate\n            {\n              \
  \  MediaPlayer idPlayer = new MediaPlayer();\n                if (idPlayer != null)\
  \ {\n                    idPlayer.SetDataSource(this.Resources.OpenRawResourceFd\n\
  \                        (Resource.Raw.monoforandroid).FileDescriptor);\n      \
  \              idPlayer.SetOnCompletionListener(this);\n                    idPlayer.Prepare();\n\
  \                    idPlayer.Start();\n                }\n            };\n\n  \
  \          playFromNetButton.Click += delegate\n            {\n                Android.Net.Uri\
  \ uri = Android.Net.Uri.Parse\n                (\"http://www.aspnetpodcast.com/PodcastFiles/MonoforAndroid.mp3\"\
  );\n                MediaPlayer netPlayer = new MediaPlayer();\n               \
  \ if (netPlayer != null) {\n                    netPlayer.SetDataSource(this, uri);\n\
  \                    netPlayer.SetOnCompletionListener(this);\n                \
  \    netPlayer.Prepare();\n                    netPlayer.Start();\n            \
  \    }\n            };\n\n            playFromFileButton.Click += delegate\n   \
  \         {\n                Android.Net.Uri uri = Android.Net.Uri.Parse(\"file://\"\
  \n                    + Android.OS.Environment.ExternalStorageDirectory\n      \
  \              + \"/monoforandroid.mp3\");\n                MediaPlayer filePlayer\
  \ = new MediaPlayer();\n                if (filePlayer != null) {\n            \
  \        filePlayer.SetDataSource(this, uri);\n                    filePlayer.SetOnCompletionListener(this);\n\
  \                    filePlayer.Prepare();\n                    filePlayer.Start();\n\
  \                }\n            };\n\n            playFromProviderButton.Click +=\
  \ delegate\n            {\n                MediaPlayer player = new MediaPlayer();\n\
  \                if (player != null ) {\nplayer.SetDataSource(this,Settings.System.DefaultRingtoneUri);\n\
  \                    player.SetOnCompletionListener(this);\n                   \
  \ player.Prepare();\n                    player.Start();\n                }\n  \
  \          };\n        }\npublic void OnCompletion ( MediaPlayer player )\n{\n \
  \   player.Stop();\n    player.Release();\n}\n```\n\n最后，将 `Activity1` 的声明更改为如下：\n\
  \n```csharp\n[Activity(Label = \"Simple Audio Playback\", MainLauncher = true)]\n\
  public class Activity1 : Activity, MediaPlayer.IOnCompletionListener\n```\n\n在这个简单的示例中，布局被更改为包含四个按钮，每种播放类型对应一个。`Activity1`\
  \ 实现了 `IOnCompletionListener`，这样当播放器完成任务时，会调用 `OnCompletion` 并释放播放器的资源。\n\n在执行此代码之前，有几点关于网络播放、文件播放和铃声播放需要注意。如果网络上的文件在指定的\
  \ URL 上不可用，则不会发生播放。在从文件播放的示例中，你必须将文件复制到 `/sdcard` 示例才能生效。在铃声播放示例中，某些手机可能会无限循环，导致\
  \ `OnCompletion` 回调永远不会被调用，这是一个很小的困扰。\n\n还有几点值得提到。之一是 `Prepare` 函数在媒体播放器准备内容时会发生阻塞。这对于本地内容可能不显著，但当从网络获取内容时可能会出现。\n\
  \n解决方案是使用 `PrepareAsync`，它会异步准备内容，并在内容就绪后调用 `Prepared` 事件处理器。该处理器随后可以在内容就绪后立即调用\
  \ `Start` 播放音频。以下代码片段说明了这一点：\n\n```sharp\nmediaPlayer.Prepared += new EventHandler(mediaPlayer_Prepared);\n\
  mediaPlayer.PrepareAsync();\n```\n\n然后在 `mediaPlayer_Prepared` 中，执行以下代码：\n\n```sharp\n\
  mediaPlayer.start();\n```\n\n另一个要点是，你不需要使用静态的 `MediaPlayer.Create` 函数来实例化媒体播放器，而是可以使用\
  \ `new` 运算符创建一个新的 `MediaPlayer` 对象，然后将相关值赋值给该 `MediaPlayer` 对象。下面的片段显示了这种方法：\n\n\
  ![download](img/download.gif)\n\n```sharp\nmediaPlayer = new MediaPlayer();\nmediaPlayer.SetDataSource(\"\
  http://site.com/androidaudio.mp3\");\nmediaPlayer.Prepare();\nmediaPlayer.Start();\n\
  ```\n\n使用哪种格式仅取决于个人喜好。\n\n## 编程视频播放\n\n显示视频比播放音频稍微复杂，因为视频需要一个显示表面。该显示表面通常通过 `SurfaceView`\
  \ 组件获取，但你也可以配置自定义表面并链接到自己的自定义控件来管理视频。在这里你将使用 `SurfaceView`。\n\n`SurfaceView` 对象是播放视频最简单的方法。实例化对象后，你调用一个函数来初始化播放：\n\
  \n```sharp\nmediaPlayer.SetDataSource(\"http://www.aspnetpodcast.com/VideoFiles/\n\
  VideoTestForMonoForAndroid.mp4\");\n```\n\n该函数接收一个 `URI`，它可以指向本地提供者或远程源。下面的程序演示了媒体播放器和\
  \ `SurfaceView` 组件如何协同工作显示视频。\n\n程序 `SimpleVideoPlayback` 之前一样从默认程序开始。然后你将字符串资源更改如下：\n\
  \n![download](img/download.gif)\n\n```xml\n<?xml version=\"1.0\" encoding=\"utf-8\"\
  ?>\n<resources>\n    <string name=\"PlayButton\">Play Video</string>\n    <string\
  \ name=\"ApplicationName\">SimpleVideoPlayback</string>\n</resources>\n```\n\n`SimpleVideoPlayback`\
  \ 程序代码片段位于 `SimpleVideoPlayback` 文件夹中。\n\n这次你启动启动包含视频布局的第二个活动，因此要在名为 `Video.axml`\
  \ 的文件中创建视频布局：\n\n![download](img/download.gif)\n\n```xml\n<?xml version=\"1.0\"\
  \ encoding=\"utf-8\"?>\n<LinearLayout xmlns:android=\"http://schemas.android.com/apk/res/android\"\
  \n    android:id=\"@+id/VideoLayout\"\n    android:orientation=\"vertical\"\n  \
  \  android:layout_width=\"fill_parent\"\n    android:layout_height=\"fill_parent\"\
  >\n\n  <Button\n    android:id=\"@+id/CloseButton\"\n    android:layout_width=\"\
  fill_parent\"\n    android:layout_height=\"wrap_content\"\n    android:text=\"Close\
  \ Window\"\n    />\n\n  <SurfaceView\n    android:id=\"@+id/VideoSurface\"\n   \
  \ android:layout_width=\"wrap_content\"\n    android:layout_height=\"wrap_content\"\
  \n    android:layout_gravity=\"center\"\n    />\n\n</LinearLayout>\n```\n\n这里有一个按钮和一个用于显示视频的\
  \ `SurfaceView` 的简单布局。这里是 `Main.axml` 布局：\n\n![download](img/download.gif)\n\n```xml\n\
  <?xml version=\"1.0\" encoding=\"utf-8\"?>\n<LinearLayout xmlns:android=\"http://schemas.android.com/apk/res/android\"\
  \n    android:orientation=\"vertical\"\n    android:layout_width=\"fill_parent\"\
  \n    android:layout_height=\"fill_parent\"\n    >\n<Button\n    android:id=\"@+id/PlayButton\"\
  \n    android:layout_width=\"fill_parent\"\n    android:layout_height=\"wrap_content\"\
  \n    android:text=\"@string/PlayButton\"\n    />\n</LinearLayout>\n```\n\n这也是一个简单的布局，仅包含一个用于启动你的视频活动的播放按钮，其代码在此处显示：\n\
  \n\n\n\n\n```csharp\n[Activity(Label = \"Video Activity\")]\npublic class VideoActivity\
  \ : Activity, ISurfaceHolderCallback\n{\n    MediaPlayer mediaPlayer;\n\n    protected\
  \ override void OnCreate(Bundle bundle)\n    {\n        base.OnCreate(bundle);\n\
  \n        // 在此处创建您的应用程序\n        SetContentView(Resource.Layout.Video);\n\n   \
  \     mediaPlayer = new Android.Media.MediaPlayer();\n        SurfaceView surface\
  \ = (SurfaceView)FindViewById(Resource.Id.VideoSurface);\n        var holder = surface.Holder;\n\
  \        holder.AddCallback(this);\n        holder.SetType(Android.Views.SurfaceType.PushBuffers);\n\
  \        holder.SetFixedSize(300, 200);\n        Button closeButton = FindViewById<Button>(Resource.Id.CloseButton);\n\
  \        closeButton.Click += new EventHandler(closeButton_Click);\n    }\n\n  \
  \  void closeButton_Click(object sender, EventArgs e)\n    {\n        this.Finish();\n\
  \    }\n\n    public void SurfaceCreated(ISurfaceHolder holder)\n    {\n       \
  \ try\n        {\n            mediaPlayer.SetDisplay(holder);\nmediaPlayer.SetDataSource(\"\
  http://www.aspnetpodcast.com/VideoFiles/\nVideoTestForMonoForAndroid.mp4\");\n \
  \           mediaPlayer.Prepared += new EventHandler(mediaPlayer_Prepared);\n  \
  \          mediaPlayer.PrepareAsync();\n        }\n        catch (System.Exception\
  \ e)\n        {\n            Android.Util.Log.Debug(\"MEDIA_PLAYER\", e.Message);\n\
  \            Toast.MakeText(this, e.Message, ToastLength.Short).Show();\n      \
  \  }\n    }\n\n    void mediaPlayer_Prepared(object sender, EventArgs e)\n    {\n\
  \        mediaPlayer.Start();\n    }\n\n    public void SurfaceDestroyed(ISurfaceHolder\
  \ holder)\n    {\n        mediaPlayer.Release();\n    }\n\n    public void SurfaceChanged(ISurfaceHolder\
  \ holder, int i, int j, int k) { }\n}\n```\n\n此处 activity 创建了视频布局并从该布局获取 `SurfaceView`。此外，activity\
  \ 实现了 `ISurfaceHolderCallback` 接口，允许你对表面的变化做出响应，并将这些更改与媒体播放器的行为绑定。因此，你可以看到一旦表面被创建，媒体播放器就会配置；当表面被销毁时，媒体播放器会被释放。\n\
  \n接下来，你对 `Activity1` 进行了一些更改，以便能够开始播放视频：\n\n![download](img/download.gif)\n\n```csharp\n\
  [Activity(Label = \"Simple Video Playback\", MainLauncher = true)]\npublic class\
  \ SimpleVideoActivity : Activity\n{\n    protected override void OnCreate(Bundle\
  \ bundle)\n    {\n        base.OnCreate(bundle);\n\n        // 从“main”布局资源设置我们的视图\n\
  \        SetContentView(Resource.Layout.Main);\n\n        // 从布局资源获取我们的按钮，\n   \
  \     // 并为其绑定事件\n        Button playButton = FindViewById<Button>(Resource.Id.PlayButton);\n\
  \        playButton.Click += new EventHandler(playButton_Click);\n    }\n\n    void\
  \ playButton_Click(object sender, EventArgs e)\n    {\n        Intent i = new Intent();\n\
  \        i.SetClass(this, typeof(VideoActivity));\n        i.AddFlags(ActivityFlags.NewTask);\n\
  \        StartActivity(i);\n    }\n}\n```\n\n这是一个简单的实现。`Activity1` 已重命名为 `SimpleVideoActivity`，在\
  \ `OnCreate` 函数中你 set 接了 `playButton_Click` 事件。随后 `playButton_Click` 会启动 `VideoActivity`。此时你已经准备好运行了。\n\
  \n## 控制播放\n\n一旦视频开始播放，你可以使用 `Start` 和 `Stop` 函数开始和停止视频，你也可以通过 `Pause` 和 `SeekTo`\
  \ 函数控制播放。\n\n`MediaPlayer` 提供了 `CurrentPosition` 和 `Duration` 属性，用于告知你播放进度以及媒体时长。\n\
  \n## 管理播放输出\n\n你有三种方法可以影响播放输出：\n\n-   **循环播放**：`Looping` 是一个 `bool` 类型，将决定 `MediaPlayer`\
  \ 在到达媒体结束时是否循环回到开头。\n-   **SetVolume**：`SetVolume` 接收 0 到 1 之间的 `float` 值来设置播放音量。将音量设置为\
  \ 0 将没有声音，而设置为 1 则为最大音量。\n-   **SetScreenOnWhilePlaying**：`SetScreenOnWhilePlaying`\
  \ 同样接收一个 `Boolean` 参数，并在媒体播放期间防止屏幕为了节电而自动关闭。\n\n## 录制音频和视频\n\n在本节中，你将学习如何录制音频和视频。我们将讨论使用意图录制视频，并查看如何使用媒体录制器。\n\
  \n捕捉音频和视频最简单的方法是使用意启动视频录制器。这种方法允许你在控制视频质量的同时控制存储位置，同时让原生应用程序处理视频的所有其他控制。\n\n当你需要更细粒度的控制时，`MediaRecorder`\
  \ 对象允许你控制录制过程的各个方面。\n\n在 Android 中录制任何媒体之前，必须在程序清单文件中添加以下使用权限：\n\n```xml\n<uses-permission\
  \ android:name=\"android.permission.RECORD_AUDIO\"/>\n<uses-permission android:name=\"\
  android.permission_RECORD_VIDEO\"/>\n```\n\n## 使用意图录制视频\n\n如前所述，使用意启动内置视频录制器是录制视频最简单的方法。如下一节所述，也可以使用媒体录制器。但如果你只是想捕捉一些动态画面，无需重复轮子。\n\
  \n以下示例扩展了 `SimpleVideoPlayback` 程序以录制视频。首先添加一个新的 `VideoRecordLayout`：\n\n![download](img/download.gif)\n\
  \n```xml\n<?xml version=\"1.0\" encoding=\"utf-8\"?>\n<LinearLayout xmlns:android=\"\
  http://schemas.android.com/apk/res/android\"\n    android:id=\"@+id/VideoRecordLayout\"\
  \n    android:orientation=\"vertical\"\n    android:layout_width=\"fill_parent\"\
  \n    android:layout_height=\"fill_parent\">\n\n  <Button\n    android:id=\"@+id/CloseButton\"\
  \n    android:layout_width=\"fill_parent\"\n    android:layout_height=\"wrap_content\"\
  \n    android:text=\"Close Window\"\n    />\n\n</LinearLayout>\n```\n\n录制示例的代码位于\
  \ `SimpleVideoPlayback` 文件夹。\n\n此外，你修改主布局以添加另一个按钮调用你新的 `VideoRecord` activity：\n\
  \n```xml\n<?xml version=\"1.0\" encoding=\"utf-8\"?>\n<LinearLayout xmlns:android=\"\
  http://schemas.android.com/apk/res/android\"\n    android:orientation=\"vertical\"\
  \n    android:layout_width=\"fill_parent\"\n    android:layout_height=\"fill_parent\"\
  \n    >\n<Button\n    android:id=\"@+id/PlayButton\"\n    android:layout_width=\"\
  fill_parent\"\n    android:layout_height=\"wrap_content\"\n    android:text=\"@string/PlayButton\"\
  \n    />\n<Button\n    android:id=\"@+id/RecordButton\"\n    android:layout_width=\"\
  fill_parent\"\n    android:layout_height=\"wrap_content\"\n    android:text=\"@string/RecordButton\"\
  \n  />\n</LinearLayout>\n```\n\n此外，你需要在 `Strings.xml` 中录制按钮添加字符串值：\n\n```xml\n<string\
  \ name=\"RecordButton\">Play Video</string>\n```\n\n\n\n\n\n```\n[Activity(Label\
  \ = \"Video Record Activity\")]\npublic class VideoRecordActivity : Activity\n{\n\
  \    private const int RECORDVIDEO = 1;\n    private const int HIGHVIDEOQUALITY\
  \ = 1;\n    private const int MMSVIDEOQUALITY = 0;\n\n    protected override void\
  \ OnCreate(Bundle bundle)\n    {\n        base.OnCreate(bundle);\n        SetContentView(Resource.Layout.VideoRecord);\n\
  \n        // Create your application here\n        Button closeButton = FindViewById<Button>(Resource.Id.CloseButton);\n\
  \        closeButton.Click += new EventHandler(closeButton_Click);\n        RecordVideo(null);\n\
  \    }\n\n    void closeButton_Click(object sender, EventArgs e)\n    {\n      \
  \  this.Finish();\n    }\n\n    private void RecordVideo(Uri outputpath)\n    {\n\
  \        Intent intent =\n new Intent(Android.Provider.MediaStore.IntentActionVideoCamera);\n\
  \        if (outputpath != null)\n            intent.PutExtra(Android.Provider.MediaStore.ExtraOutput,\n\
  \ outputpath.LocalPath);\n\n        intent.PutExtra(Android.Provider.MediaStore.ExtraVideoQuality,\n\
  \ HIGHVIDEOQUALITY);\n        StartActivityForResult(intent, RECORDVIDEO);\n   \
  \ }\n\n    protected override void OnActivityResult(int requestCode,\n        Result\
  \ resultCode, Intent data)\n    {\n        base.OnActivityResult(requestCode, resultCode,\
  \ data);\n        if (requestCode == RECORDVIDEO)\n        {\n            if ((data\
  \ != null) && (data.Data != null))\n            {\n                Android.Net.Uri\
  \ recordedVideo = data.Data;\n                // TODO Do something with the recorded\
  \ video\n            }\n        }\n    }\n}\n```\n\n![note](img/note.gif)在继续之前，我们应该注意，上述代码依赖于默认视频录制器具有一个用于指示完成的按钮。如果你必须使用返回键退出视频录制会话，`ResultCode`\
  \ 将为“Cancelled”（取消），且不会返回任何数据。\n\n最后，你需要将主 Activity 中的新按钮连接起来，以启动你的新 Activity：\n\
  \n![download](img/download.gif)\n\n```\n [Activity(Label = \"Simple Video Playback\"\
  , MainLauncher = true)]\npublic class SimpleVideoActivity : Activity\n{\n    protected\
  \ override void OnCreate(Bundle bundle)\n    {\n        base.OnCreate(bundle);\n\
  \n        // Set our view from the \"main\" layout resource\n        SetContentView(Resource.Layout.Main);\n\
  \n        // Get our button from the layout resource,\n        // and attach an\
  \ event to it\n        Button playButton = FindViewById<Button>(Resource.Id.PlayButton);\n\
  \        playButton.Click += new EventHandler(playButton_Click);\n\n        Button\
  \ recordButton = FindViewById<Button>(Resource.Id.RecordButton);\n        recordButton.Click\
  \ += new EventHandler(recordButton_Click);\n    }\n\n    void playButton_Click(object\
  \ sender, EventArgs e)\n    {\n        Intent i = new Intent();\n        i.SetClass(this,\
  \ typeof(VideoActivity));\n        i.AddFlags(ActivityFlags.NewTask);\n        StartActivity(i);\n\
  \    }\n\n    void recordButton_Click(object sender, EventArgs e)\n    {\n     \
  \   Intent i = new Intent();\n        i.SetClass(this, typeof(VideoRecordActivity));\n\
  \        i.AddFlags(ActivityFlags.NewTask);\n        StartActivity(i);\n    }\n\
  }\n```\n\n现在当你运行并选择录制按钮时，就会开始录制视频。\n\n## 使用 MediaRecorder\n\n本节将检查如何使用 `MediaRecorder`\
  \ 对象而不是 intent 来录制视频。\n\n## 配置视频录制\n\n以下代码片段来自 `SimpleMediaRecorder` 应用程序，你可以下载它。\n\
  \n```\n mediaRecorder = new MediaRecorder();\n\n        // Set input sources\n \
  \       mediaRecorder.SetAudioSource(AudioSource.Mic);\n        mediaRecorder.SetVideoSource(VideoSource.Camera);\n\
  \n        // Set output format\n        mediaRecorder.SetOutputFormat(OutputFormat.Default);\n\
  \n        // Set audio and video encoding\n        mediaRecorder.SetAudioEncoder(AudioEncoder.Default);\n\
  \        mediaRecorder.SetVideoEncoder(VideoEncoder.Default);\n\n        var outputFile\
  \ = System.IO.Path.Combine\n            (Android.OS.Environment.ExternalStorageDirectory.ToString(),\n\
  \             \"myvideooutputfile.mp4\");\n        if (System.IO.File.Exists(outputFile))\n\
  \            System.IO.File.Delete(outputFile);\n        System.IO.File.Create(outputFile);\n\
  \n        // Set the output file\n        mediaRecorder.SetOutputFile(outputFile);\n\
  \n        // Prepare\n        mediaRecorder.Prepare();\n```\n\n`MediaRecorder` 示例代码位于\
  \ `SimpleMediaRecorder` 文件夹中。\n\n如你所见，第一行实例化一个新的 `MediaRecorder`。然后你设置音频和视频源，在这里它们被设置为内置麦克风和摄像头。在这里，输出格式被设置为默认，同时设置了音频视频编码。\n\
  \n然后设置输出文件。在这里它是硬编码的，但在你的应用程序中，为用户提供文件名输入将很有用。最后，媒体录制器根据之前所有的设置准备就绪，并在调用 `start`\
  \ 开始录制。\n\n以下代码片段显示了如何终止录制并释放 `MediaRecorder` 资源。\n\n```\n // Stop\n           \
  \ mediaRecorder.Stop();\n\n            // Release resources\n            mediaRecorder.Release();\n\
  ```\n\n### 预览视频录制\n\n虽然之前的示例可以工作，但你可能注意到的一点是没有没有捕捉图像的运行预览。那么，你如何增强应用程序以显示捕获的帧呢？\n\
  \n首先，在 `main.axml` 布局中添加以下 `SurfaceView`。\n\n```\n<SurfaceView\n    android:id=\"\
  @+id/Surface\"\n    android:layout_width=\"wrap_content\"\n    android:layout_height=\"\
  wrap_content\"\n    android:layout_gravity=\"center\" />\n```\n\n然后在 `OnCreate`\
  \ 函数中添加以下代码来初始化 `SurfaceView`。\n\n```\n // Initialize the surface view\n       \
  \     SurfaceView surface = (SurfaceView)FindViewById(Resource.Id.Surface);\n  \
  \          var holder = surface.Holder;\n            holder.AddCallback(this);\n\
  \            holder.SetType(Android.Views.SurfaceType.PushBuffers);\n          \
  \  holder.SetFixedSize(300, 200);\n```\n\n注意 `AddCallback` 的调用。你需要如下将 `ISurfaceHolderCallback`\
  \ 接口添加到 `MediaRecorderActivity`：\n\n```\npublic class MediaRecorderActivity : Activity,\
  \ ISurfaceHolderCallback\n```\n\n你需要实现三个函数来完成 `ISurfaceHolderCallback` 的合约。\n\n\
  ```\n public void SurfaceCreated(ISurfaceHolder holder)\n        {\n           \
  \ if (mediaRecorder == null)\n            {\n                mediaRecorder = new\
  \ MediaRecorder();\n\n                // Set input sources\n                mediaRecorder.SetAudioSource(AudioSource.Mic);\n\
  \                mediaRecorder.SetVideoSource(VideoSource.Camera);\n\n         \
  \       // Set output format\n                mediaRecorder.SetOutputFormat(OutputFormat.Default);\n\
  \n                // Set audio and video encoding\n                mediaRecorder.SetAudioEncoder(AudioEncoder.Default);\n\
  \                mediaRecorder.SetVideoEncoder(VideoEncoder.Default);\n\n      \
  \          // Set the output file\n                mediaRecorder.SetOutputFile(Android.OS.Environment\n\
  \                      .ExternalStorageDirectory + \"/myoutputfile.mp4\");\n\n \
  \               // Set preview display\n                mediaRecorder.SetPreviewDisplay(holder.Surface);\n\
  \n                // Prepare\n                mediaRecorder.Prepare();\n       \
  \     }\n        }\n\n        public void SurfaceDestroyed(ISurfaceHolder holder)\n\
  \        {\n            mediaRecorder.Release();\n        }\n\n        public void\
  \ SurfaceChanged(ISurfaceHolder holder, int i, int j, int k) { }\n```\n\n最后，你需要更新按钮以允许开始和停止录制。\n\
  \n```\n button.Click += delegate { if (!recording) StartRecording(); else \n   \
  \             StopRecording(); };\n```\n\n其中 `StartRecording` 和 `StopRecording`\
  \ 定义如下：\n\n\n\n\n\n```java\n void StartRecording()\n    {\n        // Start\n  \
  \      mediaRecorder.Start();\n        recording = true;\n    }\n\n    void StopRecording()\n\
  \    {\n        // Stop\n        mediaRecorder.Stop();\n        recording = false;\n\
  \    }\n```\n\n通过这种方式，你可以带有预览窗口录制视频。\n\n### 音频录制\n\n虽然上一节的示例同时录制了音频和视频，但实际上你可以使用\
  \ `MediaRecorder` 分录制其中之一。因此，如果你设置了音频源而没有设置视频源，`MediaRecorder` 将录制音频。\n\n要播放录制的音频，你可以使用在\
  \ `MediaPlayer` 对象中演示的相同技术。\n\n# 图像和相机的使用\n\n本节研究了相机的使用和控制。它回顾了 Android 内置的图像支持。Android\
  \ 支持以下图像格式：\n\n- `JPEG`\n- `GIF`\n- `PNG`\n- `BMP`\n\n## 使用 Intent 拍照\n\n与视频一样，使用相机拍照最简单的方法是发送意图（intent）来启动默认相机活动。你将继续使用\
  \ `SimpleVideoPlayback` 程序作为示例来演示此功能。\n\n你首先开始添加一个新的 `Photo.axml` 布局：\n\n![下载](img/download.gif)\n\
