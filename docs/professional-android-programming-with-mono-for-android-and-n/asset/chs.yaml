  # 使用 Fragment 控制部分屏幕\n\n考虑运行在智能手机上的 Android 应用程序。通过它，你认为可以控制整个屏幕。整个屏幕通过 `activity`\
  \ 控制。这是因为 `activity` 的大小对于控制应用程序来说“恰好”。然而，平板电脑应用程序通常有更多的空间。Android 平板设备通常有大约 7 到\
  \ 10 英寸的空间来显示内容。由于这些额外的空间，你可以在应用程序中为用户提供更多的内容。\n\nAndroid 3.0 (SDK 11) 的发布了碎片（fragments），它们允许更灵活的\
  \ UI 设计。碎片 是 `activity` 的一部分。Android 系统会根据屏幕尺寸调整操作栏标签页。当屏幕空间足够时，操作栏标签页放置在普通操作区域。当屏幕空间不足时，标签将显示在一个独立的栏上，称为堆叠操作栏。\n\
  \nAndroid 3.0 (SDK 11) 的发布了碎片，它们允许更灵活的 UI 设计。碎片 是 `activity` 的一部分。该过程的步骤如下：\n\n\
  1. 将 `ViewGroup` 与标签关联。\n2. 实现 `ActionBar.ITabListener` 接口。这意味着代码将实现 `OnTabSelected`、`OnTabUnselected`\
  \ 和 `OnTabReselected`。当用户在标签之间导航时，会调用这些方法。\n3. 为添加的每个标签定义一个 `TabListener`。在这个特定的示例中，这由\
  \ `Activity` 类处理。\n4. 通过调用 `.AddTab` 将每个标签添加到操作栏。\n\n\n\n\n![download](img/download.gif)\
