  \ `System.IO.File` 类缺少 `WriteAllText`。同样，你需要获取代码并在你的 Windows Phone 7 项目以及 MonoTouch\
  \ 和 Mono for Android 项目中使用它。\n\n# 统治一切的类库\n\n难道不应该更简单吗？难道你不应该只需要编译一个程序集让它运行在到处吗？你可以做到——某种程度上。\n\
  \n便携库工具旨在允许重用程序集代码，但提供一组适用于多个平台的 API，无论这些是 .NET、Silverlight、Xbox 360 还是 Windows\
  \ Phone 7 项目。它通过提供 .NET 框架的一个子集来实现，该子集保证存在于上述每个平台上，并且最可能存在于 MonoTouch 和 Mono for\
  \ Android 等平台。\n\n![note](img/note.gif)你可以在此处找到便携库工具 [`bit.ly/portablelibrarytools`](http://bit.ly/portablelibrarytools)\n\
  \n* * *为了看到很好的示例，你可以查看一个将字母数字电话转换为普通电话的应用程序。例如，数字 `1-888-0CHRISNTR` 将转换为 `1-888-024747687`。要集成此库，首先创建一个新的便携库类项目。创建一个静态类，其中包含一个返回转换后数字字符串的单一公共方法。为了清晰起见，列表\
  \ 15.2 显示了你想在便携库中使用的类。\n\n![download](img/download.gif) 列表 15.2: 电话转换器类\n\n\n\n\n\
  \n```cs\nusing System.Text;\n\nnamespace TelephoneConverter\n{\n    public static\
  \ class TelephoneStringConverter\n    {\n        public static string ConvertEntryToNumber(string\
  \ rawTelephoneString)\n        {\n            var newNumber = new StringBuilder();\n\
  \            var trimmedAndReplacedTelephone =\nrawTelephoneString.Trim().ToUpperInvariant().Replace(\"\
  -\", \"\");\n            foreach (var c in trimmedAndReplacedTelephone)\n      \
  \      {\n                var result = ExtractNumberFromLetter(c);\n           \
  \     if (result == null)\n                    newNumber.Append(c);\n          \
  \      else\n                    newNumber.Append(result);\n            }\n    \
  \        return newNumber.ToString();\n        }\n\n        static int? ExtractNumberFromLetter(char\
  \ c)\n        {\n            if (c >= ‘A’ && c <= ‘C’)\n            {\n        \
  \        return 2;\n            }\n            else if (c >= ‘D’ && c <= ‘F’)\n\
  \            {\n                return 3;\n            }\n            else if (c\
  \ >= ‘G’ && c <= ‘I’)\n            {\n                return 4;\n            }\n\
  \            else if (c >= ‘J’ && c <= ‘L’)\n            {\n                return\
  \ 5;\n            }\n            else if (c >= ‘M’ && c <= ‘O’)\n            {\n\
  \                return 6;\n            }\n            else if (c >= ‘P’ && c <=\
  \ ‘S’)\n            {\n                return 7;\n            }\n            else\
  \ if (c >= ‘T’ && c <= ‘V’)\n            {\n                return 8;\n        \
  \    }\n            else if (c >= ‘W’ && c <= ‘Z’)\n            {\n            \
  \    return 9;\n            }\n            return null;\n        }\n    }\n}\n```\n\
  \n`TelephoneConverter\\TelephoneConverter\\TelephoneStringConverter.cs`\n\n逻辑的实现并不是该类的重要部分。重要的点在于，该实现仅依赖于\
  \ `System.Text` 中的 `StringBuilder` 类（以及 `mscorlib`）。当你现在构建项目时，你会在 `bin` 文件夹中看到 `TelephoneConverter.dll`。该程序集现在可以移动到特定平台的应用程序并作为程序集引用。\n\
  \n现在，你需要为每个平台构建 UI 特有的逻辑。为此，你只需要使用文本框和一个可点击的按钮，然后在警框中显示结果。\n\n## Mono for Android\n\
  \n在 Mono for Android 中，你使用 `Button` 和 `EditBox` 与可移植库项目进行交互。然后，你可以使用 `AlertDialog`\
  \ 和相关的 `builder` 向用户显示结果。大部分的 UI 工作在布局中声明。Listing 15.3 显示了调用共享代码的代码。\n\n![download](img/download.gif)\
  \ Listing 15.3: 在 Mono for Android 应用程序中实现的转换代码\n\n```cs\nButton button = FindViewById<Button>(Resource.Id.MyButton);\n\
  EditText textBox1 = FindViewById<EditText>(Resource.Id.TextBox1);\n\nbutton.Click\
  \ += delegate\n{\n   if (!String.IsNullOrEmpty(textBox1.Text.ToString()))\n   {\n\
  \      var result =\n         TelephoneConverter.TelephoneStringConverter.\n   \
  \      ConvertEntryToNumber(textBox1.Text.ToString());\n         new AlertDialog.Builder(this).\n\
  \             SetMessage(result).\n             SetNeutralButton(\"Ok\", delegate\
  \ {}).Show();\n   }\n   else\n   {\n      new AlertDialog.Builder(this).\n     \
  \     SetMessage(\"No number entered\").\n          SetNeutralButton(\"Ok\", delegate\
  \ { });\n   }\n};\n```\n\n`TelephoneConverter\\MonoDroidTelephone\\Activity1.cs`\n\
  \n大部分的 UI 工作可以在 `Main.axml` 文件中找到，因此请确保下载示例项目以查看此示例的完整运行。Figure 15.5 显示了模拟器上的结果。\n\
