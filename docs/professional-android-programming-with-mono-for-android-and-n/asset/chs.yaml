  \n操作视图（action view）是一个显示在操作栏（action bar）中的控件。它是操作项（action item）的替代方案。通过在菜单定义中添加以下\
  \ XML，操作栏中添加一个 `SearchView`。\n\n```xml\n <item android:id=\"@+id/menu_search\"\n\
  \     android:title=\"Search\"\n     android:showAsAction=\"ifRoom|withText\"\n\
  \     android:actionViewClass=\"android.widget.SearchView\" />\n```\n\n图 17.7 显示了此搜索选项。\n\
  \n图 17.7\n\n![17.7](img/c17f007.jpg)\n\n## 创建标签页界面\n\n除了在操作栏中创建菜单系统外，还可以基于操作栏创建标签页界面。这可以在不使用\
  \ `TabWidget` 的情况下创建。Android 系统会根据屏幕尺寸调整操作栏标签页。当屏幕空间足够时，操作栏标签页放置在普通操作区域。当屏幕空间不足时，标签将显示在一个独立的栏上，称为堆叠操作栏（stacked\
  \ action bar）。\n\n该过程的步骤如下：\n\n1. 将 `ViewGroup` 与标签关联。\n2. 实现 `ActionBar.ITabListener`\
  \ 接口。这意味着代码将实现 `OnTabSelected`、`OnTabUnselected` 和 `OnTabReselected`。当用户在标签之间导航时，会调用这些方法。\n\
  3. 为添加的每个标签定义一个 `TabListener`。在这个特定的示例中，这由 `Activity` 类处理。\n4. 通过调用 `.AddTab` 将每个标签添加到操作栏。\n\
  \n列表 17.5 显示了在平板电脑的 Android 3.0 上设置简单标签页界面的示例代码。\n\n![download](img/download.gif)\
  \ 列表 17.5: 标签页界面代码\n\n```csharp\n [Activity(Label = \"HCExampleTabbedInterface\"\
  , MainLauncher = true, Icon = \n        \"@drawable/icon\")]\n    public class Activity1\
  \ : Activity, ActionBar.ITabListener\n    {\n        protected override void OnCreate(Bundle\
  \ bundle)\n        {\n            base.OnCreate(bundle);\n\n            var bar\
  \ = ActionBar;\n\n            for (int i = 0; i < 3; i++)\n            {\n     \
  \           bar.AddTab(bar.NewTab().SetText(String.Format(\"Tab {0}\", i))\n   \
  \                 .SetTabListener(this));\n            }\n            bar.DisplayOptions\
  \ = ActionBarDisplayOptions.ShowCustom | \n                ActionBarDisplayOptions.UseLogo;\n\
  \            bar.NavigationMode = ActionBarNavigationMode.Tabs;\n            bar.SetDisplayShowHomeEnabled(true);\n\
  \       }\n\n        public void OnTabReselected(ActionBar.Tab tab, FragmentTransaction\
  \ ft)\n        {\n            Android.Util.Log.Info(\"tab\", String.Format(\"Tab\
  \ ReSelected: {0}\", tab\n                .Text));\n        }\n\n        public\
  \ void OnTabSelected(ActionBar.Tab tab, FragmentTransaction ft)\n        {\n   \
  \         Android.Util.Log.Info(\"tab\", String.Format(\"Tab Selected: {0}\", \n\
  \                tab.Text));\n        }\n\n        public void OnTabUnselected(ActionBar.Tab\
  \ tab, FragmentTransaction ft)\n        {\n            Android.Util.Log.Info(\"\
  tab\", String.Format(\"Tab UnSelected: {0}\", \n                tab.Text));\n  \
  \      }\n    }\n```\n\n`HCExampleTabbedInterface\\HCExampleTabbedInterface\\Activity1.cs`\n\
