  \ container, true);\n        return vw;\n    }\n    public override void OnPause()\n\
  \    {\n        base.OnPause();\n    }\n\n    void ProcessRestXmlLINQHttpResponse(IAsyncResult\
  \ iar)\n    {\n        try\n        {\n            HttpWebRequest request = (HttpWebRequest)iar.AsyncState;\n\
  \            HttpWebResponse response;\n            response = (HttpWebResponse)request.EndGetResponse(iar);\n\
  \            System.IO.StreamReader strm = new System.IO.StreamReader(\n       \
  \         response.GetResponseStream());\n            System.Xml.Linq.XDocument\
  \ xd = XDocument.Load(strm);\n            twt = (from x in xd.Root.Descendants(\"\
  status\")\n                        where x != null\n                        select\
