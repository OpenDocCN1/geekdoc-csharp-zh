  \ 15.5 显示了实现代码。\n\n```cs\nprivate void button1_Click(object sender, RoutedEventArgs\
  \ e)\n{\n   if(!String.IsNullOrEmpty(textBox1.Text))\n   {\n      var result = TelephoneConverter.TelephoneStringConverter.\n\
