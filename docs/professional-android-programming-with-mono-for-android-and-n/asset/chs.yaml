  \n`TelephoneConverter\\WP7Telephone\\MainPage.xaml.cs`\n\n当你向文本框输入文本并按下按钮时，号码会被转换，如\
  \ Figure 15.7 中的 Windows Phone 7 模拟器所示。\n\n![15.7](img/c15f008.jpg)![warning](img/warning.gif)在真实的\
  \ Windows Phone 7 应用程序中，绝不应该使用 `MessageBox`，因为它是一个阻塞方法并会导致你的应用程序关闭。\n\n\n\n\n深入研究可移植库工具（Portable\
  \ Library Tools），你会发现这些工具并不支持 `XmlDocument`、`System.Linq.Xml` 以及许多其他常用的 `.NET` 类。这样做是为了建立一个能够覆盖最广泛平台的内核基础，尽管这使得复用使用了这些不支持类的代码变得更加困难。\n\
  \n可移植库工具确实能让你的代码具有可移植性。但由于该库目前的局限性，很难用它来解决更复杂的代码复用问题，因此了解如何在这些平台之间共享源代码文件是有用的。随着项目迭代的不断进行，可移植库工具绝对值得持续关注。\n\
  \n# 整合一切：创建一个跨平台应用程序\n\n目前，使用可移植库工具在 Mono for Android、MonoTouch 和 Windows Phone\
  \ 7 之间创建可重用的代码可能对于许多任务来说无法实现，因为可移植库仅包含了功能有限的底层核心 `.NET` 程序集。因此，为了创建一个跨移动平台的应用程序，本节将介绍你需要执行的操作。\n\
  \n为了展示一个既共享代码又在本章开头提到的三个平台上运行的应用程序示例，我开发了一个相对简单的 Twitter 应用程序。当用户输入用户名时，应用程序会返回该用户的推文列表。\n\
  \n要启动应用程序，你只需创建一个新的 Windows Phone 7 应用程序。从那里，你可以创建一个 Windows Phone 7 类库，然后在不同的类库之间共享代码，并重写\
  \ UI 以在 Mono for Android 和 MonoTouch 上运行。\n\n在 Windows Phone 7 类库中，你创建一个泛型 `Tweet.cs`\
  \ 类，其中包含你的 Twitter 数据。你还创建一个 `TwitterReceiver.cs` 类，其中包含一个调用 Twitter API 的静态方法。然后解析\
  \ JSON 结果并将其传回给调用方法的任何地方。`Listing 15.6` 显示了每个应用程序中将复用的代码。\n\n`Listing 15.6` 显示了每个应用程序中将复用的代码。值得注意的是，这段代码使用了\
  \ Silverlight `System.Json` 程序集引用来解析 JSON 结果。\n\n![download](img/download.gif) `Listing\
  \ 15.6`: `GetTweetsForUser` 的实现\n\n```csharp\npublic static void GetTweetsForUser\n\
  \                     (string userName, Action<List<Tweet>> actionResult)\n{\n \
  \  var client = new WebClient();\n   client.DownloadStringCompleted += (s, e) =>\n\
  \   {\n      var listOfTweets = new List<Tweet>();\n      if (e.Error != null)\n\
  \      {\n         actionResult(listOfTweets);\n      }\n      else\n      {\n \
  \        var jsonResults = JsonValue.Parse(e.Result);\n         if (jsonResults\
  \ != null)\n         {\n            foreach (JsonValue item in jsonResults[\"results\"\
  ])\n            {\n               var text = HttpUtility.HtmlDecode(item[\"text\"\
  ]);\n               var user = HttpUtility.HtmlDecode(item[\"from_user\"]);\n  \
  \             var profileImage =\n                   HttpUtility.HtmlDecode(item[\"\
  profile_image_url\"]);\n               listOfTweets.Add(new Tweet() {\n        \
  \                    FromUser = user,\n                            ProfileImageUrl\
  \ = profileImage, Text = text\n                         }\n               );\n \
  \           }\n         }\n         actionResult(listOfTweets);\n      }\n    };\n\
  \    client.DownloadStringAsync(new\n                    Uri(String.Format(\"http://search.twitter.com/\n\
  \                                       search.json?q=from:{0}\", userName)));\n\
  }\n```\n\n`TwitterUser\\WindowsPhoneTwitter\\TwitterHelper\\TwitterReceiver.cs`\n\
  \n要在 Windows Phone 7 上为 Twitter 应用程序构建 UI，你可以使用简单的 XAML 代码添加绑定的 UI，然后使用后置代码（code-behind）收集数据进行显示。你可以使用\
  \ `ListBox` 配合数据模板来实现此功能，该模板使用 `stack panel` 来布局内容。XAML 所示所示 `Listing 15.7`。\n\n\
  ![download](img/download.gif) `Listing 15.7`: 在 Windows Phone 7 上布局 UI 的 XAML\n\n\
  ```xml\n<Button Content=\"Search\" Height=\"72\" HorizontalAlignment=\"Left\" Margin=\"\
  296,0,0,0\"\n Name=\"searchButton\"\nVerticalAlignment=\"Top\" Width=\"160\" Click=\"\
  SearchButtonClick\" />\n\n<TextBox Height=\"72\" HorizontalAlignment=\"Left\" Name=\"\
  userNameBox\" Text=\"chrisntr\"\nVerticalAlignment=\"Top\" Width=\"290\" />\n\n\
  <ListBox Name=\"listBox1\" Margin=\"0,78,0,0\" ItemsSource=\"{Binding}\"\nDataContext=\"\
  {Binding}\">\n   <ListBox.ItemTemplate>\n      <DataTemplate>\n         <StackPanel\
  \ Orientation=\"Horizontal\" Height=\"Auto\">\n            <Image Source=\"{Binding\
  \ ProfileImageUrl}\" Height=\"73\" Width=\"73\"\nVerticalAlignment=\"Top\" Margin=\"\
  0,10,8,0\"/>\n            <StackPanel Width=\"370\">\n               <TextBlock\
  \ Text=\"{Binding FromUser}\" Foreground=\"#FFC8AB14\"\nFontSize=\"28\" />\n   \
  \            <TextBlock Text=\"{Binding Text}\" TextWrapping=\"Wrap\"\nFontSize=\"\
  24\" />\n            </StackPanel>\n         </StackPanel>\n      </DataTemplate>\n\
  \   </ListBox.ItemTemplate>\n</ListBox>\n```\n\n`TwitterUser\\WindowsPhoneTwitter\\\
  MainPage.xaml`\n\n你可以使用 `ListBox` 并设置 `ItemsSource`。在后置代码中，你调用你的类并设置 `ItemsSource`。由于你将在后台线程运行下载，你需要使用\
  \ Dispatcher。\n\n```csharp\nprivate void SearchButtonClick(object sender, RoutedEventArgs\
  \ e)\n{\n   if(!String.IsNullOrEmpty(userNameBox.Text))\n   {\n      TwitterReceiver.GetTweetsForUser(userNameBox.Text,\
  \ tweets =>\n         Dispatcher.BeginInvoke(() => listBox1.ItemsSource = tweets));\n\
  \   }\n}\n```\n\n当你运行应用程序时，它看起来像 `Figure 15.8`。\n\n`Figure 15.8`\n\n![15.8](img/c15f008.jpg)\n\
  \n当你点击搜索时，你应该看到类似 `Figure 15.9`。\n\n`Figure 15.9`\n\n![note](img/note.gif) 再次，你可以从\
  \ [www.wrox.com](http://www.wrox.com) 作为书籍的一部分下载此示例。你可以在本章的 `TwitterUser` 文件夹中找到它，它包含了与\
  \ Mono for Android 和 MonoTouch 一起工作的两个项目。\n\n为了运行 Mono for Android 版本，你需要创建一个 Mono\
  \ for Android 项目。由于 Mono for Android 项目与 Windows Phone 7 项目不兼容，你将需要创建解决方案文件夹来划分这两类项目。你可以通过右键点击解决方案，选择添加，然后选择新建解决方案文件夹。重命名现有解决方案文件夹为相关名称（我建议为“Windows\
  \ Phone 7”），然后移动两个 Windows Phone 7 项目。为 Mono for Android 创建另一个解决方案文件夹，并添加新的 Mono\
  \ for Android 项目以及新的 Mono for Android 类库。这应该让你得到类似于 `Figure 15.10` 的结果。\n\n`Figure\
  \ 15.10`\n\n![15.10](img/c15f010.jpg)\n\n\n\n\n由于你希望 Mono for Android 项目使用你在 Windows\
  \ Phone 7 项目中使用的代码，请在你的 Mono for Android 类库中添加 `System.Json` 的引用，就像你在 Windows Phone\
  \ 7 项目中做的那样。然后，你需要为 Windows Phone 7 类库中使用的每个源文件添加 `Existing file…`（现有文件……）。当你将源文件作为现有文件添加时，需要确保通过\
  \ `Add As Link.`（添加链接添加）来添加它们。图 15.11 显示了这在 Visual Studio 2010 中的外观。这意味着它并没有在那个文件夹内创建文件，而是直接创建一个指向现有文件的链接。\n\
  \n图 15.11\n\n![15.11](img/c15f011.jpg)\n\n在构建新的 Mono for Android 项目时，你应该注意的第一点是它没有编译。这是因为\
  \ `HttpUtility.HtmlDecode` 被包含在 Windows Phone 7 的 `System.Windows` 程序集中。请记住，Mono\
  \ for Android 并没有对 `System.Windows` 的引用。要解决这个问题，你可以改为引用 `System.Web.Services`，这是\
  \ `System.Web.HttpUtility` 在 Mono for Android 上的位置。由于你不希望 Windows Phone 7 项目尝试解析\
  \ `System.Web` 命名空间，你希望用预处理器指令将其封装起来，以便成功编译应用程序。下面的代码片段显示了 `TwitterReceiver.cs`\
  \ 文件中 `using` 语句的形式。（注意你可以添加 `MONOTOUCH` 和 `MONOANDROID`，因为 `HttpUtility` 的位置在两个平台上是相同的。）\n\
  \n```csharp\nusing System;\nusing System.Collections.Generic;\nusing System.Json;\n\
  using System.Net;\n#if MONOANDROID || MONOTOUCH\nusing System.Web;\n#endif\n```\n\
  \n要设置 UI，你需要修改 `Main.axml` 文件以包含你的 `EditText` 框和一个带有用于显示推文的 `ListView` 的搜索 `Button`。你的代码应该类似于代码列表\
