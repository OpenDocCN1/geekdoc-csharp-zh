  \n4. 开始开始设置应用程序查询的数据源。在这种情况下，创建一个名为 `BookmarkCursor` 的属性。该属性将用于在请求时延迟加载 `ICursor`\
  \ 对象。对于实际查询，创建一个名为 `GetBookmarkCursor()` 的函数，并设置它返回一个 `ICursor` 对象。在此方法中，添加相应的逻辑以获取填充了浏览器书签的游标。\n\
  5. 最后，在你的属性的 `get` 方法中检查空值。如果发现，调用 `GetBookmarkCursor()` 函数，在此过程中设置私有的 `_BookmarkCursor`。列表\
  \ 6.3 阐明了这种设置。\n\n![download](img/download.gif) 列表 6.3: 设置浏览器书签游标\n\n```csharp\n\
  \ private ICursor _BookmarkCursor;\npublic ICursor BookmarkCursor\n{\n     get {\n\
  \          if (_BookmarkCursor == null)\n          {\n               _BookmarkCursor\
  \ = GetBookmarkCursor();\n          }\n          return _BookmarkCursor;\n     }\n\
  \     set { _BookmarkCursor = value; }\n}\n\npublic ICursor GetBookmarkCursor()\n\
  {\n     return ManagedQuery(Browser.BookmarksUri,\n          new String[] { Browser.BookmarkColumns.Title,\
  \ Browser.BookmarkColumns\n            .Url, Browser.BookmarkColumns.InterfaceConstants.ID\
  \ },\n          null, null, null);\n}\n```\n\n\n\n\n\n在 `GetBookmarkCursor()` 方法中，已经添加了请求浏览器书签的查询。由于内容提供者（content\
  \ providers）的使用已经在第 3 章中介绍，我们在这里不会进行过深探讨。但重要的是，你正在请求设备上的所有书签，并将它们的 `Url`、`ID` 和\
  \ `Title` 属性放入 `String` 投影中。完成后，`BookmarkCursor` 属性允许在活动内的任何一点通过 `ICursor` 对象进行访问。\n\
  \n最后，在开始使用 `ICursor` 对象之前，还需要最后一步。要从浏览器内容提供者进行查询，你需要在 Android 清单文件中添加相应的 `uses-permission`\
  \ 节点。可以使用 Visual Studio 工具轻松实现这一点：\n\n1. 在 `Solution Explorer`（解决方案资源管理器）中右键点击项目并选择\
  \ `Properties`（属性）。\n2. 选择 `Android Manifest` 选项，如图 6.4 所示。\n3. 在 `Required permissions`（所需的权限）框中，勾选\
  \ `READ_HISTORY_BOOKMARKS` 权限。\n\n图 6.4\n\n![6.4](img/c06f004.jpg)\n\n### 使用 Spinner\
  \ 适配器\n\n当项目设置妥且数据源准备就绪后，就可以实现 `CreateSpinner()` 方法。此项目内部有许多不同的对象在运行，但它们可以拆分为三个主要部分：\n\
  \n* 目标 Spinner 是使用 `FindViewByID()` 方法实现的。它是本节稍早添加到 `Main.axml` 文件中的 `Spinner` 控件的引用。\n\
  * `SpinnerCursorAdapter` 实例充当目标 Spinner 和我们游标之间的桥梁。\n* 在 Spinner 中重复的数据项视图源于 Android\
  \ 平台定义的默认布局之一。\n\n使用这三项，我们可以编写绑定我们的 spinner 所需的代码，如列表 6.4 所示。\n\n![download](img/download.gif)\
  \ 列表 6.4: 实现 `CreateSpinner()` 方法\n\n```\npublic void CreateSpinner()\n{\n     var\
  \ targetSpinner = FindViewById<Spinner>(Resource.Id.spinner);\n     SimpleCursorAdapter\
  \ SpinnerAdapter = new SimpleCursorAdapter(\n          this,\n          Android.Resource.Layout.SimpleSpinnerItem,\n\
  \          BookmarkCursor,\n          new string[] { Browser.BookmarkColumns.Title\
  \ },\n          new int[] { Android.Resource.Id.Text1 });\n\n     SpinnerAdapter.SetDropDownViewResource(\n\
  \          Android.Resource.Layout.SimpleSpinnerDropDownItem);\n     targetSpinner.Adapter\
  \ = SpinnerAdapter;\n     targetSpinner.Prompt = \"Select...\";\n}\n```\n\n`Databinding_SpinnerCursor\\\
  Databinding_Cursor\\SpinnerSample.cs`\n\n在此示例中，我们通过 `targetSpinner` 对象获取了 `Spinner`\
  \ 控件的引用。使用 `SimpleCursorAdapter` 的新实例，将 `BookmarkCursor` 对象绑定到适配器上。特别是，使用了默认的 Android\
  \ 视图 `Android.Resource.Layout.SimpleSpinnerItem` 作为数据项视图。要将 `BookmarkCursor` 中的\
  \ `Title` 列数据绑定到数据项视图，请使用其 ID 为 `Text1` 的子控件。\n\n最后，我们可以设置用于 spinner 下拉视图的目标资源。在我们将\
  \ spinner 的适配器设置为我们新创建的 `SpinnerAdapter` 引用后，数据绑定过程即完成。\n\n![note](img/note.gif)\
  \ 在查看此示例时，你可能会想我们是如何知道将数据值绑定到 `Android.Resource.Id.Text1` 控件的。当使用默认 Android 视图时，你需要在\
  \ Android 文档中确定它们包含哪些子控件，以及这些控件在 Android 中的 ID 是什么，以便将数据绑定到这些控件。`Android.Resource.Id`\
  \ 命名空间包含了关于原生布局中可能存在的子控件的提示。目前该过程可能涉及一些尝试，尽管许多运行的示例使用了这些默认视图。\n\n***\n\n所有代码就绪后，使用调试器启动应用程序。假设一切顺利，你应该能看到图\
  \ 6.5 所示的屏幕。\n\n图 6.5\n\n![6.5](img/c06f005.jpg)\n\n###为 Spinner 添加监听事件\n\n假设在运行示例后，你决定如果能够点击列出的书签之一并在\
  \ Android 浏览器中打开其 URL 将会很方便。你可以通过使用 spinner 的 `ItemSelected` 事件来实现这一点。\n\nSpinner\
  \ 是许多任务的很棒控件，但在某些情况下它们也是糟糕的控件。因此，在我们进入代码之前，需要注意两点：\n\n* 尽管它们可以被认为是一种下拉列表，但 spinner\
  \ 缺少下拉列表的一个大主要功能：它们没有未选中的状态。每当绑定一个 spinner 时，它会自动选择绑定集合中的第一个项目。这不仅意味着 spinner 总是显示一个选择，而且意味着\
  \ spinner 列表中的第一个项目无法被选中。\n\n\n\n\n\n3. 最后，添加一个名为 `SpinnerItemSelected()` 的方法作为目标事件处理器，接收一个\
  \ `object` 对象和 `ItemEventArgs` 作为参数。在此方法内部，我们检查是否选择了一个新项。如果是，我们就获取目标 spinner 项的\
  \ URL 并启动一个新的活动（activity）来打开浏览器窗口。这在 Listing 6.6 中完成。\n\n![download](img/download.gif)\
  \ Listing 6.6: 实现 `ItemSelected()` 事件\n\n```c\n public void SpinnerItemSelected(object\
  \ sender, ItemEventArgs e)\n{\n     var CurrentSpinner = ((Spinner)sender);\n  \
  \   var CurrentSelectedIndex = CurrentSpinner.SelectedItemPosition;\n\n     if (CurrentSelectedIndex\
  \ != LastSpinnerSelectedPosition)\n     {\n          //  spinner 中选中的项实际上是\n   \
  \       //  位置设置为相应索引的底层光标对象。\n          // 转换为 ICursor 以进行访问。\n          ICursor\
  \ selectedItem = (ICursor)CurrentSpinner.SelectedItem;\n\n          var URLColumnIndex\
  \ = selectedItem.GetColumnIndex(\n               Browser.BookmarkColumns.Url);\n\
  \          var URL = selectedItem.GetString(URLColumnIndex);\n\n          //  为了打开新浏览器，我们需要创建一个合适的\n\
  \          //  intent 并使用该 intent 启动新活动。\n          Intent BrowserIntent = new Intent(Intent.ActionView);\n\
  \          BrowserIntent.SetData(Android.Net.Uri.Parse(URL));\n\n          StartActivity(BrowserIntent);\n\
  \n          LastSpinnerSelectedPosition = CurrentSelectedIndex;\n     }\n}\n```\n\
  \nDatabinding_SpinnerCursor\\Databinding_Cursor\\SpinnerSample.cs\n\n在此方法中，首先检查确保\
  \ spinner 的状态与初始设置的状态不相同。这可以防止 `OnCreate()` 方法过早地触发选中项事件。接下来，使用 spinner 的 `SelectedItem`\
  \ 属性找到所选 spinner 项的 URL 值。此项代表了 `BookmarkCursor` 中与所选项对应的位置。\n\n最后，我们创建 `BrowserIntent`\
  \ 并将其数据设置为目标 URL。这允许我们创建一个新活动，该活动将打开我们的浏览器应用程序并跳转到正确的 URL。有了这些代码，你应该能够打开 spinner\
  \ 示例并观察其运行，如 Figure 6.6 所示。\n\nFigure 6.6\n\n![6.6](img/c06f006.jpg)\n\n## 在 Gallery\
