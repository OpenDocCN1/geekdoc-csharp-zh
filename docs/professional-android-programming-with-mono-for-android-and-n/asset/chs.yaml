  \n图 12.7\n\n![12.7](img/c12f007.jpg)\n\n### 案例 3：使用渐变可绘制资源\n\n看着第二个版本的机器人军队，你可以看到它们比版本\
  \ 1 有了巨大的改进。然而，你对最终结果并不完全满意。你决定，如果为每个机器人添加一个漂亮的渐变作为背景，它们看起来会更时尚，更像“机器人 2.0”。\n\n\
  通过渐变可绘制资源，你可以创建许多种渐变。在基于代码的场景中，渐变通常通过 `Shader` 类使用，它可以作为一种样式应用到 `Paint` 对象上。此代码示例中没有使用这种方法，但当你处理基于代码的可绘制资源时，请查看\
  \ `Shader` 和 `ShaderFactory` 类以获取更多关于显示渐变的信息。\n\n对于基于 XML 的场景，渐变通过使用 `<gradient>`\
  \ 节点表示为形状 XML 可绘制资源的子节点。当你使用渐变的 XML 声明时，你可以定义几个不同的属性，如表 12.2 所示。\n\n![note](img/note.gif)处理渐变时，你可能会遇到一种情况：渲染的渐变看起来不再平滑，而是像有环状或线条叠加在一起（取决于类型）。这种现象被称为断层（banding）。通常，当一种颜色在渐变中遇到另一种颜色时，如果过渡缺乏足够的“噪声”来使其看起来是混合在一起的。在\
  \ Android 设备上对抗断层的一种方法是对应用渐变的位图、`drawable` 或 `view` 开启抖动（dithering）。断层的另一种可能的原因是像素格式太低。\n\
  \n表 12.2 渐变属性\n\n| 属性名称 | 说明 |\n| :--- | :--- |\n| `angle` | 角度允许你指定绘制渐变的整体角度。以\
  \ 45 度为增量。 |\n| `centerColor` | 此可选值可创建三点渐变。 |\n| `centerX` 和 `centerY` | 这些浮点值指示渐变的中心。此值仅适用于具有“中心”概念的渐变类型。\
  \ |\n| `endColor` | 指定渐变结束的颜色值。 |\n| `gradientRadius` | 当使用径向渐变时，此值指示渐变的半径。 |\n\
  | `startColor` | 指定渐变开始的颜色值。 |\n| `type` | 指示渐变的类型。可选值为 linear、radial、sweep。 |\n\
  \n在 Resource 目录下创建一个新的 XML 文件，并命名为 `RobotBackground_Gradient`。在此文件中，粘贴之前的可绘制资源 `RobotBackground.xml`\
  \ 的内容。在新文件中，作为形状的子节点添加 `<gradient>` 节点。创建渐变时将其指定为线性渐变，并设置角度使其从顶部移动到底。最后，为中间、起始和结束颜色添加颜色值。列表\
  \ 12.21 显示了渐变声明可能的样子。\n\n![download](img/download.gif) 列表 12.21: 引入渐变可绘制资源\n\n```\n\
  <gradient\n     android:type=\"linear\"\n     android:startColor=\"#FFFFFF\"\n \
  \    android:centerColor=\"#30577F\"\n     android:endColor=\"#30577F\"\n     android:angle=\"\
  270\"/>\n```\n\n`Graphics_Drawables\\Graphics_Drawables\\Resources\\Drawable\\RobotBackground_Gradient.xml`\n\
  \n观察此声明，你可以看到添加的颜色旨在为机器人 ImageButton 营造一种“光泽”效果。按钮顶部有一种白色光泽效果，这种效果在按钮中间附近消失。通过将角度设置为\
  \ 270 度，你指示线性渐变将从上向下流动。\n\n\n\n\n切换到 `Main.axml` 文件，你就可以创建第 3 版本机器人军队的过程。与上一节一样，复制上一个\
