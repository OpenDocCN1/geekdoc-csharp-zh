  \ 示例程序\n\n图 7.3](#9781118235812c07.xhtml_c07_pgml_0002) 程序的运行情况\n\n## 监听偏好更改\n\n\
  偏好的一个重要方面是知道它们何时更改。本节将介绍如何处理由偏好更改产生的事件。\n\n有两个函数非常重要：一个用于注册更改，另一个用于取消注册：\n\n*  \
  \ `RegisterSharedPreferenceChangeListener` (`ISharedPreferences`)\n*   `UnregisterSharedPreferenceChangeListener`\
  \ (`ISharedPreferences`)\n\n以下代码片段展示了这些函数的用法：\n\n```csharp\n protected override\
  \ void OnResume()\n        {\n            base.OnResume();\n\n            this.GetPreferences(FileMode.Private)\n\
  \              .RegisterSharedPreferenceChangeListener(this);\n        }\n\n   \
  \     protected override OnPause()\n        {\n            base.OnPause();\n\n \
  \           this.GetPreferences(FileMode.Private)\n              .UnregisterSharedPreferenceChangeListener(this);\n\
  \        }\n\n        public void OnPreferenceChanged(ISharedPreferences prefs,\
  \ string key)\n        {\n            // 对 key 进行某些操作\n        }\n```\n\n在此示例中，监听器在\
  \ `OnResume` 期间注册，并在 `OnPause` 期间取消注册。当监听器处于激活状态时，每当偏好发生变化，就会调用 `OnPreferenceChanged`\
  \ 函数，允许活动对更改做出反应。\n\n## 处理 XML\n\nAndroid 三种不同的 XML 解析器：DOM 解析器、SAX 解析器和 XML Pull\
  \ 解析器。然而，这些还没有通过 Mono Android 接口暴露。不过，可以通过 Linq XML 命名空间进行 XML 处理。\n\n以下片段展示了来自\
  \ [freshmeat.net](http://freshmeat.net)（一个专注于开源软件的网站）的 Atom 馈是如何处理的：\n\n![download](img/download.gif)\n\
  \n```csharp\nprivate void getMeatFeed()\n{\n            WebClient client = new WebClient();\n\
  \            client.DownloadStringAsync(new\n            Uri(\"http://freshmeat.net/?format=atom\"\
  ));\n            client.DownloadStringCompleted += new\n            DownloadStringCompletedEventHandler(client_DownloadStringCompleted);\n\
  \        }\n\nprivate void client_DownloadStringCompleted(object sender,\n    DownloadStringCompletedEventArgs\
  \ e)\n        {\n            if (e.Error == null)\n            {\n             \
  \   XDocument xml = XDocument.Parse(e.Result);\n                XNamespace atomNS\
  \ = \"http://www.w3.org/2005/Atom\";\n\n                System.Collections.Generic.IEnumerable<AtomEntry>\
  \ list = (from \n                    entry in xml.Descendants(atomNS + \"entry\"\
  )\n                 select new AtomEntry()\n                 {\n               \
  \      ID = entry.Element(atomNS + \"id\").Value,\n                     Title =\
  \ entry.Element(atomNS + \"title\").Value,\n                     Content = entry.Element(atomNS\
  \ + \"content\").Value,\n                     Published = DateTime.Parse(entry.Element(atomNS\
  \ +\n                         \"published\").Value),\n                     Updated\
  \ = DateTime.Parse(entry.Element(atomNS +\n                         \"updated\"\
  ).Value)\n                 });\n\n                 ArrayList titles = new ArrayList();\n\
  \                 foreach (AtomEntry atomEntry in list) {\n                    \
  \ titles.Add(atomEntry.Title);\n                 }\n\n                 this.RunOnUiThread(()\
  \ =>\n                 {\n                     Java.Lang.Object[] test = list.ToArray();\n\
  \                     ArrayAdapter aao = new ArrayAdapter<Java.Lang.Object>(this,\
  \ \n    Android.Resource.Layout.SimpleListItem1,test);\n                  ((ListView)this.FindViewById(Resource.Id.FMListView)).Adapter\
  \ \n    = aao;\n                 });\n            }\n        }\n```\n\n此示例的代码可以在本章下载包的\
  \ FreshMeat2 文件夹中找到。\n\n\n\n\n在这里我们看到了一些正在发生。首先，在 `getFreshMeatFeed` 函数中，你创建了一个\
  \ `WebClient` 对象来对互联网上的馈源进行调用。当客户端下载完成后，会调用 `client_DownloadStringCompleted`。在检查了任何错误后，下载结果被解析为\
  \ `XDocument` 对象。然后，通过搜索“entry”后代并解析每个条目的的内容，创建一个 `AtomEntry` 对象列表。\n\n尽管这只是一个片段，但它代表了将\
  \ XML 处理为列表的常用模式。尽管这个 XML 来自互联网馈源，但它同样可能来自本地文件。一旦列表就绪，就可以对其进行迭代以显示信息，或者将其连接到 `ListAdapter`\
  \ 进行显示。\n\n# 总结\n\n本章从程序偏好设置开始。你看到活动（activity）可以拥有只有该活动可以访问的私有偏好，或者只要多个活动具有相同的进程\
  \ ID，它们就可以访问供多个活动可用的共享偏好。\n\n你还学习了如何在文件系统上创建、读取和写入文件。文件有三种不同的权限设置，导致它们变为私有的、全局可读或全局可写的。直接创建的文件可以是文本或二进制格式，并可以随机访问或以流模式访问。\n\
  \n最后，我们用两个额外的代码片段作为结束。其中一个演示了如何注册和注销共享偏好更改监听，并接收和响应这些事件。最后一个代码片段显示了如何使用 `Linq.xml`\
  \ 命名空间解析来自 FreshMeat 的 Atom 馈源中的 XML。\n\n现在你应该能够为你的用户创建偏好，为你的应用程序增加健壮性。展望未来，你的活动即使失去焦点也能保持状态，你的程序设置在用法之间将是持久的，数据可以存储在文件中供以后使用。\n\
  \n# 第 8 章：使用设备硬件编程\n\n## 本章内容？\n\n* 使用传感器 API\n* 针对加速度计、设备方向和距离检测支持进行编程\n* 支持网络\n\
  * 蓝牙编程\n\nAndroid 包含了大量令人兴奋的硬件。这些硬件本身对用户并没有吸引；兴奋发生在应用程序以用户能够理解的方式向他们呈现信息时。对于构建应用程序的开发者来说，这些硬件非常有趣，因为它允许应用程序基于此提供卓越的功能。本章将介绍传感器\
  \ API、加速度计、设备方向、距离检测、网络和蓝牙。以下是这些硬件的一些示例用法：\n\n* 程序可以测试是否可以通过任何连接（WiFi、3G 或 EDGE）访问网络。如果连接不存在，用户在尝试上传信息时看到的不是错误消息，而是被通知没有连接到服务。\n\
  * 加速度计可以用于从数据源中提取随机数据。当设备被摇动时，应用程序可以通过从数据源读取随机数据来响应。\n* 当用户将设备从竖屏切换到横屏模式时，应用程序可以更改向用户显示内容的方式。\n\
  \n# 使用传感器\n\nAndroid 设备带有各种类型的精彩功能，包括加速度计、指南针、麦克风、陀螺仪和其他巧妙硬件。这些硬件允许设备检测你周围发生的事情。通过设备中的硬件，应用程序和用户界面可以根据周围的环境更好地提供用户输入。\n\
  \nAndroid 的 `Sensor` 类抽象了每个设备上传感器的实际实现。可以使用 `Sensor` 类获取硬件传感器的属性，包括制造商、名称、准确度、范围和传感器类型。\n\
  \n## 引用传感器管理器\n\n使用传感器的第一步是使用 `Android Sensor Manager`。`Sensor Manager` 是你访问特定设备传感器的媒介。以下代码提供了对\
  \ Sensor Manager 的引用：\n\n```\nString service_name = Context.SensorService;\nsensManager\
  \ = (SensorManager)GetSystemService(service_name);\n```\n\n## 传感器支持\n\n`Sensor`\
  \ 类包含了一组常量，描述了 `Sensor` 对象正在使用的传感器类型。目前支持以下传感器类型，可以通过 `Android.Hardware.SensorType`\
  \ 枚举访问，并可以进行编程：\n\n* `Accelerometer` 返回 x、y、z 轴上的加速度信息，单位为每秒平方米。\n* `Gyroscope`\
  \ 以度返回设备在三个轴上的当前方向。\n* `Light` 是一个单值，表示勒克斯（lux）的照明强度。这种传感器类型可以根据可用光设置屏幕亮度。\n* `MagneticField`\
  \ 设备所处的磁场。磁场在三个轴上测量，并以特斯拉（microteslas）返回。\n* `Orientation` 以度确定设备在三个轴上的方向。\n* `Pressure`\
  \ 返回当前设备的压力，单位为百帕（hPa）。\n* `Proximity` 确定设备与目标物体之间的距离，单位为厘米。通常，距离传感器用于判断手机是否正贴在用户的耳朵。这允许设备监听语音命令或关闭屏幕，因为当屏幕贴着耳朵时不需要屏幕进行输入。目标对象的选择和支持的距离在很大程度上取决于距离传感器内部使用的硬件。\n\
  * `Temperature` 以摄氏度确定设备的温度。返回的温度类型取决于用于检测温度的硬件。\n* `All` 返回主机平台上的所有传感器。\n\n## 访问传感器\n\
  \n使用 `Sensor` 类获取传感器有两种方法。第一种是获取与给定传感器类型对应的默认传感器。通过调用以下代码实现：\n\n```\ndefSensor =\
  \ sensManager.GetDefaultSensor(SensorType.Accelerometer);\n```\n\n在这种情况下，代码返回加速度计的默认传感器。\n\
  \n另一种方法是获取与给定传感器类型相关的所有传感器。通过调用以下代码实现：\n\n```\nIList<Sensor> accSensors = sensorManager.GetSensorList(SensorType.Accelerometer);\n\
  ```\n\n结果是一个传感器类型列表，程序可以对其迭代。如果程序需要获取设备上的某种类型传感器并允许用户选择特定的，这可能非常有用。\n\n# 使用传感器\n\
  \n在你决定使用哪种传感器后，设置代码的过程涉及三个额外的步骤：\n\n* 注册：应用程序必须注册它正在监听硬件的更新。通过以下代码完成：\n\n```\nsensManager.RegisterListener(this,\
  \ defSensor, SensorDelay.Ui);\n```\n\n* 处理：必须实现 `ISensorEventListener` 接口以处理传感器值。\n\
  * 注销。\n\n\n\n\n监听传感器更新的类必须实现 `Android.Hardware.ISensorEventListener` 接口。在本章的示例中，该活动通过以下代码实现了该接口：\n\
  \n```c\npublic class Activity1 : Activity, Android.Hardware.ISensorEventListener\n\
  ```\n\n`ISensorEventListener` 接口要求实现 `OnSensorChanged` 和 `OnAccuracyChanged` 方法。列表\
  \ 8.1`实现了这两个方法。在 `OnSensorChanged` 方法中需要注意的一个关键点是对传感器类型进行检查。此检查允许一个类监听多个传感器的变化。\n\
  \n![download](img/download.gif) 列表 8.1: 使用加速度计处理传感器\n\n```c\npublic void ISensorEventListener.OnSensorChanged(SensorEvent\
  \ e)\n{\n    if ( e.Sensor.Type == SensorType.Accelerometer){\n    var calibrationValue\
  \ = SensorManager.StandardGravity;\n    var mVals = e.Values;\n    var x = mVals[0];\n\
  \    var y = mVals[1];\n    var z = mVals[2];\n    var SumOfSq = Math.Pow(x, 2)\
  \ + Math.Pow(y, 2) + Math.Pow(z, 2);\n        var mag = Math.Pow(SumOfSq, .5) -\
  \ calibrationValue;\n        RunOnUiThread(() =>\n            tv.Text = \"Acceleration\
  \ (g): \" + mag.ToString()\n        );\n    }\n}\npublic void ISensorEventListener.OnAccuracyChanged(Sensor\
  \ sensor, int accuracy)\n{\n    if (sensor.Type == Android.Hardware.SensorType.Accelerometer)\n\
  \    {\n        if (Android.Hardware.SensorStatus.AccuracyHigh ==\n (Android.Hardware.SensorStatus)accuracy)\n\
  \        {\n\n        }\n    }\n}\n```\n\n此代码包含在 `Acceleration\\Activity1.cs` 中\n\
  \n![note](img/note.gif)地球上的物体始终经历着加速度。幸运的是，Android 传感器管理器提供了一个代表地球标准重力的值。另一个需要记住的是，Visual\
  \ Studio 可以自动创建必要的接口方法。Visual Studio 会在方法中自动放入 `NotImplementedException`，因此你可能需要删除该异常。\n\
  \n* *\n\n`OnAccuracyChanged` 事件包含一个枚举，用于确定传感器的新精度。该枚举位于 `Android.Hardware.SensorStatus.Accuracy`\
  \ 中。其值如下：\n\n*   `AccuracyLow` 表示硬件传感器的精度较低，可能需要进行校准。\n*   `AccuracyMedium` 表示硬件传感器的精度中等。校准传感器可能有助于提高精度。\n\
  *   `AccuracyHigh` 表示硬件传感器的精度已达到其最佳状态。\n*   `Unreliable` 表示从硬件传感器返回的数据不可靠。这可能意味着返回的值是不可能的，或者必须对传感器进行校准。\n\
  \n最后要执行的操作是在应用程序不再需要接收更新时注销传感器监听。这是通过调用传感器管理器的 `UnregisterListener` 方法处理的：\n\n```c\n\
  sensManager.UnregisterListener(this, defSensor);\n```\n\n## 理解传感器类型值\n\n接下来的节描述了从监控的各种传感器类型返回的值。\n\
  \n*   `Accelerometer`: 加速度计返回三个值——以每秒平方为单位的沿三个轴的加速度：\n    *   `value[0]`: 侧向（x 方向）\n\
  \    *   `value[1]`: 纵向（z 方向）\n    *   `value[2]`: 垂直（y 方向）\n    *   传感器管理器包含一组形式为\
  \ `SensorManager.GRAVITY*` 的重力常量，代表太阳系中各个体的重力。这对于那些远距离旅行非常有帮助。\n\n![note](img/note.gif)由于在这个主题上一直存在困惑，这里值得提一下，设备只有在两个地方加速度为零：处于自由落体以及悬浮在零重力/外太空环境中。因此，程序需要使用标准重力常量来提取由于重力产生的恒加速度。\n\
  \n* *\n\n*   `Gyroscope`: 陀螺仪返回三个值——沿三个轴的角度设备的设备角度：\n    *   `value[0]`: 方位 (Azimuth)\n\
  \    *   `value[1]`: 俯仰 (Pitch)\n    *   `value[2]`: 翻滚 (Roll)\n    这在 Android 设备作为游戏控制器的游戏中非常有用。例如，可以旋转手机来模拟赛车游戏中方向盘的转向。\n\
  *   `Light`: 光传感器返回照度测量值。仅返回一个值。通过 `value[0]` 获取。照度以勒克斯（lux）测量。传感器管理器包含一组代表不同标准照度的常量，形式为\
  \ `SensorManager.LIGHT*`。\n*   `Magnetic Field`: 返回的磁场在三个方向上测量，单位为特斯拉（microteslas）：\n\
  \    *   `value[0]` : 侧向（x 方向）\n    *   `value[1]` : 纵向（z 方向）\n    *   `value[2]`\
  \ : 垂直（y 方向）\n传感器管理器包含了几个代表地球磁场最小值和最大值的值。\n在手机上检测磁场听起来极其无聊。除了电厂工作的工程师，谁会在意这个？然而，检测磁场强度确实有实际用途。假设你正坐在车里，想用手机获取驾驶路线。你将手机放在带有磁铁的支架上。当你的手机吸附在板上时，它检测到磁场强度显著增加并打开逐路路线指示。本章稍后的一个示例结合了磁场和语音识别。\n\
  *   `Orientation`: 根据以下值以沿三个轴的角度返回设备方向：\n    *   `value[0]`: 方位 (Azimuth)\n    *\
  \   `value[1]`: 翻滚 (Roll)\n    *   `value[2]`: 俯仰 (Pitch)\n*   `Pressure`: 压力返回在\
  \ `value[0]`。这在工程场景中非常有用。压力以百帕（hPa）测量。\n*   `Proximity`: 距离以厘米测量并返回在 `value[0]`\
  \ 中。\n*   `Temperature`: 温度以摄氏度测量并返回在 `value[0]`。这在天气场景中可能有用。想象一个应用程序为业余风暴追踪者跟踪温度。\n\
  \n## 响应加速度\n\n加速度计是 Android 最有趣的特性之一。从用户界面角度来看，它有很多用途。UrbanSpoon.com 应用是使用加速度返回随机餐厅数据的很好的示例。使用该应用，摇摇\
  \ Android 手机，应用就会为你找到附近的一家不错的餐厅。\n\n![note](img/note.gif)当你把手机给孩子消遣时，请务必告诉他们握好手机。如果他们没拿稳，手机可能会落在别人的桌子上。请从我的经验中吸训。\n\
  \n* *\n\n通常，加速度计测量相对于自由落体的设备加速度。Android 的加速度计检测 XYZ 轴的变化，允许程序确定设备的方向和运动。由于变化是在 XYZ\
  \ 轴上提供的，因此可以用向量的形式计算加速度。\n\nMono for Android 框架使得通过传感器 API 访问加速度计变得简单，正如我们之前讨论的那样。\n\
  \n## 使用 XYZ 坐标系\n\n理解数据如何从加速度计返回是有关重要的。可以使用多个坐标系。Android 实现了 XYZ 坐标系以提供加速度信息。图 8.1`\
  \ 显示了坐标系中的 Android 设备。\n\n\n\n\n\n图 8.1\n\n![8.1](img/c08f001.jpg)\n\n假设用户位于 z 轴方向，如果\
  \ Android 设备向用户或远离用户移动，加速度将沿 z 轴产生。如果 Android 向左或向右移动，加速度将沿 x 轴产生。如果 Android 向上或向下移动，加速度将沿\
  \ y 轴产生。可以确定每个轴上的加速度值。在已知每个轴上的值并在数学数学的帮助下，可以计算出加速度的总幅度，以及在任何时刻该加速度的方向。\n\n## 使用加速度计进行编码\n\
  \n加速度计允许程序读取 Android 是否正在移动，并返回有关设备移动的数据。这也可以用于让孩子们在餐厅保持娱乐，因为他们会竞争谁抖动设备比别人更快。列表\
  \ 8.2 展示了如何处理加速度事件并将该信息显示给用户。\n\n![download](img/download.gif) 列表 8.2: 处理加速度变化\n\
  \n```c\npublic void ISensorEventListener.OnSensorChanged(SensorEvent e)\n{\n   \
  \ if ( e.Sensor.Type == SensorType.Accelerometer){\n        var mVals = e.Values;\n\
  \        var x = mVals[0];\n        var y = mVals[1];\n        var z = mVals[2];\n\
  \        var SumOfSq = Math.Pow(x, 2) + Math.Pow(y, 2) + Math.Pow(z, 2);\n     \
  \   var mag = Math.Pow(SumOfSq, .5) - SensorManager.StandardGravity\n        if\
  \ (MaxAccel == 0.0)\n        {\n            MaxAccel = mag;\n        }\n       \
  \ if (mag > MaxAccel)\n        {\n            MaxAccel = mag;\n        }\n     \
  \   RunOnUiThread(() =>\n            tv.Text = \"Acceleration (m/sˆ2): \" + MaxAccel.ToString()\n\
  \        );\n    }\n}\n```\n\n此代码包含在 `Acceleration\\Activity1.cs` 中。\n\n图 8.2 显示抖动设备的结果。\n\
  \n图 8.2\n\n![8.2](img/c08f002.jpg)\n\n# 构建指南针\n\n位置和方向在移动设备中非常重要。本节将构建一个指南针，以便确定方向。使用传感器\
  \ API 来确定此方向。手机顶部是用于方向的朝向。\n\n第一步是用于 UI 的 XML (列表 8.3)。这段代码仅包含一个 LinearLayout 和一个\
  \ TextView。\n\n![download](img/download.gif) 列表 8.3: 指南针的 XML 布局\n\n```xml\n<?xml\
  \ version=\"1.0\" encoding=\"utf-8\"?>\n<LinearLayout xmlns:android=\"http://schemas.android.com/apk/res/android\"\
  \n android:orientation=\"vertical\"\n android:layout_width=\"fill_parent\"\n android:layout_height=\"\
  fill_parent\"\n android:id=\"@+id/ll\"\n >\n  <TextView\n   android:layout_width=\"\
  fill_parent\"\n   android:layout_height=\"wrap_content\"\n   android:text=\"@string/display\"\
  \n />\n</LinearLayout>\n```\n\n此代码包含在 `Compass\\Compass\\Resources\\Layout\\Main.axml`\
  \ 中。\n\n下一步是创建一个用作视图显示用户头部方向的类（参见 列表 8.4）。\n\n![download](img/download.gif) 列表 8.4:\
  \ 自定义视图\n\n```csharp\nusing System;\nusing System.Collections.Generic;\nusing System.Linq;\n\
  using System.Text;\nusing Android.App;\nusing Android.Content;\nusing Android.OS;\n\
  using Android.Runtime;\nusing Android.Util;\nusing Android.Views;\nusing Android.Widget;\n\
  using Android.Graphics;\nnamespace Compass\n{\n    public class CompassView : View\n\
  \    {\n        public CompassView(Context context)\n            : base(context)\n\
  \        {\n            Initialize();\n            init();\n        }\n        public\
  \ CompassView(Context context, IAttributeSet attrs) :\n            base(context,\
  \ attrs)\n        {\n            Initialize();\n            init();\n        }\n\
  \        public CompassView(Context context, IAttributeSet attrs, int defStyle)\
  \ :\n            base(context, attrs, defStyle)\n        {\n            Initialize();\n\
  \            init();\n        }\n\n        private void Initialize()\n        {\n\
  \            init();\n        }\n        private float direction = 0;\n        private\
  \ Android.Graphics.Paint paint = new Paint(PaintFlags.AntiAlias);\n        private\
  \ bool firstDraw;\n        private void init(){\n            paint.SetStyle(Paint.Style.Stroke);\n\
  \            paint.StrokeWidth = 3;\n            paint.Color = Color.White;\n  \
  \          paint.TextSize = 30;\n            firstDraw = true;\n        }\n    \
  \    protected override void OnMeasure(int widthMeasureSpec, int heightMeasureSpec)\
  \ {\n            SetMeasuredDimension(\n               MeasureSpec.GetSize(widthMeasureSpec),\n\
  \               MeasureSpec.GetSize(heightMeasureSpec));\n        }\n        protected\
  \ override void OnDraw(Canvas canvas) {\n            int cxCompass = MeasuredWidth/2;\n\
  \            int cyCompass = MeasuredHeight/2;\n            float radiusCompass;\n\
  \            if(cxCompass > cyCompass){\n             radiusCompass = (float) (cyCompass\
  \ * 0.9);\n            }\n            else{\n             radiusCompass = (float)\
  \ (cxCompass * 0.9);\n            }\n            canvas.DrawCircle(cxCompass, cyCompass,\
  \ radiusCompass, paint);\n            canvas.DrawRect(0, 0, MeasuredWidth, MeasuredHeight,\
  \ paint);\n\n            if(!firstDraw){\n\n             canvas.DrawLine(cxCompass,\
  \ cyCompass,\n               (float)(cxCompass + \n                      radiusCompass\
  \ * Math.Sin((double)(-direction) * 3.14/180)),\n               (float)(cyCompass\
  \ – \n                      radiusCompass * Math.Cos((double)(-direction) * 3.14/180)),\n\
  \               paint);\n             canvas.DrawText(direction.ToString(), cxCompass,\
  \ cyCompass, paint);\n            }\n        }\n        public void updateDirection(float\
  \ dir)\n        {\n            firstDraw = false;\n            direction = dir;\n\
  \            this.Invalidate();\n        }\n    }\n}\n```\n\n此代码包含在 `Compass\\Compass\\\
  CompassView.cs` 中。\n\n流程的最后一步是创建 Activity 并处理传感器事件 (列表 8.5)。该 Activity 实现了 `ISensorEventListener`\
  \ 接口。当 `Orientation SensorType` 发生变化时，更改将发送到 Activity，Activity 将通知控件新的方向是什么。当视图接收到该值时，它会对屏幕上的控件进行重绘。\n\
  \n![download](img/download.gif) 列表 8.5: 处理 Activity\n\n\n\n\n\n```c\nusing System;\n\
  using System.Collections.Generic;\nusing Android.App;\nusing Android.Content;\n\
  using Android.Hardware;\nusing Android.Runtime;\nusing Android.Views;\nusing Android.Widget;\n\
  using Android.OS;\nnamespace Compass\n{\n    [Activity(Label = \"Compass\", MainLauncher\
  \ = true, \n        Icon = \"@drawable/icon\",\n        ScreenOrientation=Android.Content.PM.ScreenOrientation.Portrait)]\n\
  \    public class Activity1 : Activity, ISensorEventListener\n    {\n        int\
  \ count = 1;\n        private Android.Hardware.SensorManager sm;\n        private\
  \ bool sersorrunning;\n        private CompassView compView;\n        private Sensor\
  \ s;\n\n        protected override void OnCreate(Bundle bundle)\n        {\n   \
  \         base.OnCreate(bundle);\n            SetContentView(Resource.Layout.Main);\n\
  \            var layout = FindViewById<LinearLayout>(Resource.Id.ll);\n        \
  \    var Params = new \n                 Android.Widget.LinearLayout.LayoutParams(ViewGroup.LayoutParams\n\
  \                 .FillParent, ViewGroup.LayoutParams.FillParent);\n           \
  \ compView = new CompassView(this, null);\n            layout.AddView(compView,\
  \ Params);\n            sm = (Android.Hardware.SensorManager)GetSystemService\n\
  \              (Context.SensorService);\n            IList<Sensor> mySensors = sm.GetSensorList(SensorType.Orientation);\n\
  \            if (mySensors.Count > 0)\n            {\n                s = mySensors[0];\n\
  \                sm.RegisterListener(this, mySensors[0], SensorDelay.Normal);\n\
  \                sersorrunning = true;\n                Toast.MakeText(this, \"\
  Start ORIENTATION Sensor\", \n                       ToastLength.Long).Show();\n\
  \            }\n            else\n            {\n                Toast.MakeText(this,\
  \ \"No ORIENTATION Sensor\", ToastLength.Long).Show();\n                sersorrunning\
  \ = false;\n                Finish();\n            }\n        }\n\n        public\
  \ void ISensorEventListener.OnAccuracyChanged(Sensor sensor, int accuracy)\n   \
  \     {\n        }\n\n        public void ISensorEventListener.OnSensorChanged(SensorEvent\
  \ e)\n        {\n            if (e.Sensor.Type == SensorType.Orientation)\n    \
  \        {\n                float dir = e.Values[0];\n                compView.updateDirection(dir);\n\
  \            }\n        }\n\n        protected override void OnPause()\n       \
  \ {\n            base.OnPause();\n            sm.UnregisterListener(this);\n   \
  \     }\n        protected override void OnResume()\n        {\n            base.OnResume();\n\
  \            sm.RegisterListener(this, s, SensorDelay.Normal);\n        }\n    \
  \    protected override void OnDestroy()\n        {\n            sm.UnregisterListener(this);\n\
  \        }\n    }\n}\n```\n\n此代码包含在 `Compass\\Compass\\Activity1.cs` 中\n\n图 8.3\
  \ 显示了罗盘的输出。\n\n图 8.3\n\n![8.3](img/c08f003.jpg)\n\n## 震动\n\n震动通常用于向用户提供反馈。例如，当用户在\
  \ HTC EVO 4G 上选择键盘元素时，手机会震动约 50 毫秒，告诉用户字母已被选中。震动的另一个用途是通知用户其设备上有任务需要处理。这种震动可能意味着邮件已到达、有人正在拨打用户电话或发生了类似的事件。\n\
  \nMono for Android 提供了 `Android.OS.Vibrator` 类，允许开发者访问设备的震动硬件。使用 `Vibrator` 类需要遵循以下两个步骤：\n\
  \n1. 首先，在 `AndroidManifest.xml` 中声明权限：\n   ```xml\n   <uses-permission name=\"android.permission.VIBRATE\"\
  \ />\n   ```\n2. 其次，实例化 `Vibrator` 类：\n   ```csharp\n   Vibrator vibrator = (Vibrator)GetSystemService(Context.VibratorService);\n\
  \   ```\n\n`Vibrate` 方法有两种重载形式：\n- `Vibrate(long milliseconds)`：震动指定的毫秒数。\n- `Vibrate(long[]\
  \ pattern, long repeat)`：根据模式震动。\n\n# 网络连接\n\n过去几年中，无线连接的发展非常迅速。Android 中的 `ConnectivityManager`\
  \ 是一个在后台运行的服务，用于监控网络状态并处理各种网络变化。\n\n访问 `ConnectivityManager` 需要执行以下步骤：\n\n1. 首先，在\
  \ `AndroidManifest.xml` 中添加相应的权限：\n```xml\n<uses-permission name=\"android.permission.ACCESS_NETWORK_STATE\"\
  \ />\n<uses-permission name=\"android.permission.CHANGE_NETWORK_STATE\" />\n```\n\
  2. 其次，通过 `GetSystemService` 获取引用：\n```csharp\nvar cmMgr = (ConnectivityManager)GetSystemService(Context.ConnectivityService);\n\
  ```\n\n## 用户偏设置\n\n获取 `ConnectivityManager` 引用后，下一步是检查用户是否允许后台数据通信。这种偏设置可以在“设置 ➔\
  \ 账户与同步”中进行，如图 8.4 所示。\n\n应用程序读取此值来决定是否执行后台处理。如果未检查此设置，应用程序则应仅在前台运行时进行通信。开发者可以通过以下代码检查后台数据设置：\n\
  \n```csharp\nbool bckgrnd = cmMgr.BackgroundDataSetting;\n```\n\n## 监听后台设置的变化\n\n\
  对于大多数情况，检查后台数据设置就足够了。然而，当用户更改该设置时该怎么办？应用程序应该检测到该值的变化并采取行动（参见示例 8.6 ）：\n\n```csharp\n\
  [BroadcastReceiver]\n[IntentFilter(new[] { Android.Net.ConnectivityManager.ActionBackgroundDataSettingChanged\
  \ },\n    Categories = new[] { Android.Content.Intent.CategoryDefault })]\npublic\
  \ class Receiver1 : BroadcastReceiver\n{\n    public override void OnReceive(Context\
  \ context, Intent intent)\n    {\n        if ((intent != null) &&\n            (intent.Action\
  \ == Android.Net.ConnectivityManager\n              .ActionBackgroundDataSettingChanged))\n\
  \        {\n\n            // 处理变化逻辑\n        }\n    }\n}\n```\n\n\n\n\n您可以通过创建一个\
  \ `BroadcastReceiver` 并监听 `ConnectivityManager.ActionBackgroundDataSettingChanged`\
  \ 意图来检查背景设置的更改。在收到发生更改的消息后，您的应用程序应该读取该更改并采取相应的行动。\n\n## 检查当前网络配置\n\n世界各地的客户具有不同程度的网络连接性。有些人只有本地\
  \ WiFi，有些人有无线网络，还有人只有电话线和听力罐。这一切都取决于您在特定时刻所在的位置。幸运的是，`ConnectivityManager` 让您找到当前的网络接口并设置您首选的网络接口。\n\
  \n## 创建网络连接通知\n\n`ConnectivityManager` 可以通知应用程序网络连接发生了变化。这是通过监听 `ConnectionManager.ConnectionAction`\
  \ 意图的广播接收器实现的。这些意图包含了有关网络连接状态的额外信息。可以通过调用 `.Extra(...)` 并传递参数来获取这些信息值。`ConnectivityManager`\
  \ 包含一组静态字符串值，用于获取这些值：\n\n* `ExtraIsFailover` 是一个布尔值。如果该值为 true，则当前网络是首选网络的备用网络（failover）。\n\
  * `ExtraNoConnectivity` 是一个布尔值。如果该值为 true，则设备当前未连接到网络。\n* `ExtraReason` 是一个字符串。如果意图代表连接失败，则会传回原因。\n\
  * `ExtraNetworkInfo` 是一个 `NetworkInfo` 对象。该对象包含关于当前意图所代表网络的额外信息。\n* `ExtraOtherNetworkInfo`\
  \ 是一个 `NetworkInfo` 对象。该对象代表备用网络连接的网络信息。\n* `ExtraExtraInfo` 包含额外的连接细节。\n\n应用程序可以使用这些网络信息来确定是否存在网络连接。如果是，应用程序就可以继续在远程服务器上处理操作；否则，可以将数据存储在本地，并在连接可用时将其发送到中央服务器。\n\
  \n## WifiManager\n\nAndroid 包含了 `WifiManager`。该类是 Android WiFi 连接服务的引用。`WifiManager`\
  \ 可用于：\n\n* 配置 WiFi 连接\n* 管理当前的 WiFi 连接\n* 扫描区域内的访问点\n* 监控设备 WiFi 连接的变化\n\n要访问并使用\
  \ `WifiManager`，第一步是在 `AndroidManifest.xml` 文件中通过以下设置请求权限：\n\n```\n<uses-permission\
  \ android:name=\"android.permission.ACCESS_WIFI_STATE\" />\n<uses-permission android:name=\"\
  android.permission.CHANGE_WIFI_STATE\" />\n```\n\n最后一步是扫描网络并输出结果（见图 8.5）。\n\n![download](img/download.gif)\
  \ [Listing 8.7]: 识别 WiFi 网络\n\n```c\nwifiMgr.StartScan(); // 这是一个异步启动调用\nvar wifiR\
  \ = wifiMgr.ScanResults;\nfor (int i = 0; i < wifiR.Count; i++)\n{\n    tv.Text\
  \ += wifiR[i].Ssid + System.Environment.NewLine;\n}\n```\n\n```csharp\nusing System;\n\
  using Android.App;\nusing Android.Content;\nusing Android.Runtime;\nusing Android.Views;\n\
  using Android.Widget;\nusing Android.OS;\nusing Android.Net.Wifi;\nusing Android.Net;\n\
  \nnamespace WifiManagement\n{\n    [Activity(Label = \"WifiManagement\", MainLauncher\
  \ = true)]\n    public class Activity1 : Activity\n    {\n        public TextView\
  \ _tv;\n        public Button _button;\n        WifiManager _wifiMgr;\n        ScanResultBroadcastReceiver\
  \ _scanResultBroadcastReceiver;\n\n        protected override void OnCreate(Bundle\
  \ bundle)\n        {\n            base.OnCreate(bundle);\n\n            // 从“main”布局资源设置我们的视图\n\
  \            SetContentView(Resource.Layout.Main);\n\n            // 从布局资源获取我们的按钮，并为它绑定事件\n\
  \            _button = FindViewById<Button>(Resource.Id.MyButton);\n           \
  \ _tv = FindViewById<TextView>(Resource.Id.tv);\n            _wifiMgr = (Android.Net.Wifi.WifiManager)GetSystemService(\n\
  \                     Context.WifiService);\n            _button.Text = String.Format(\"\
  wifi state: {0}\", _wifiMgr.WifiState);\n\n            // 在此处定义接收器，以便我们可以更新 UI\n\
