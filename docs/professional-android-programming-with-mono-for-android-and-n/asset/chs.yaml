  \n    android:text=\"Close Window\"\n    />\n\n</LinearLayout>\n```\n\n此拍照示例的代码位于\
  \ `SimpleCamera` 文件夹中。\n\n然后你添加了一个新的字符串值：\n\n```xml\n<string name=\"PhotoButton\"\
  >Photograph</string>\n```\n\n接着，你在 `Main.axml` 布局中添加了一个新按钮：\n\n```xml\n<Button\n\
  \    android:id=\"@+id/PhotoButton\"\n    android:layout_width=\"fill_parent\"\n\
