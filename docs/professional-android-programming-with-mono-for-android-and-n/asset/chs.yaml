  * `RadioButton` 是组中的一个双状态按钮。单选按钮组一次允许有一个项目被选中。所有 .NET 开发者应该对单选按钮列表（radio button\
  \ list）这一概念不陌生。\n* `Clock` 包含数字钟和模拟钟控件。它们是时间选择器控件，允许开发者获取或设置时间。\n* `TimePicker`\
  \ 与时钟控件相关联。时间选择器是一个带有按钮的上下滚动/切换控件。\n* `Image(s)` 是一系列用于处理图像的控件。这些控件包括单个图像、图像按钮和图像画廊。\n\
  * 虽然虚拟键盘在所有设备上都可用，但它是如 HTC 和摩托罗拉系列 Android 设备等触控设备上的一项功能。\n\n这些只是开发者可以使用的控件中的一部分。Android\
  \ 还提供了更多控件。它们包含在 `Android.Widget` 命名空间中。\n\n接下来的章节将检查这些控件的定义、它们支持的值以及控件本身。\n\n###\
  \ 熟悉的概念——XML、属性和值\nASP.NET 开发者会熟悉 Android 文件的 XML 布局概念。ASP.NET WebForms 将显示信息保留在前端的\
  \ `.aspx` 文件中，而后端逻辑包含在 `.cs` 和 `.vb` 文件中。Android 应用使用类似的概念。显示信息包含在 `Views` 中。可以通过调用\
  \ `SetContentView` 并传递布局资源 ID 或单个 `View` 实例来加载 `Activity` 的用户界面。因此，开发者实际上可以通过程序化的方式创建自己的用户界面。\n\
  \n## TextView\n\n`TextView` 是一个向用户显示文本的控件。默认情况下，`TextView` 类不允许编辑。对于 .NET 开发者来说，该控件在概念上类似于\
  \ WinForms 或 WebForms 中的标签（label）。让我们看看该类从可编程性角度暴露的几个成员：\n\n* `TextView` 的 `Text`\
  \ 属性允许程序获取/设置在 `TextView` 中显示的值。\n* `Width` 属性设置 `TextView` 的宽度。可以使用 `fill_parent`\
  \ 值或以整数形式的像素进行设置。\n\n## EditText\n\n`EditText` 是一个允许用户输入和编辑文本的子类。图 4.7 显示了 `EditText`\
  \ 的示例输出。\n\n图 4.7\n\n![4.7](img/c04f007.jpg)\n\n## AutoCompleteTextView\n\n`AutoCompleteTextView`\
  \ 是一个可编辑的 `TextView`，在用户输入时会显示建议。建议列表显示在下拉菜单中。随着用户的输入，可以选择可以选择项。如果选择了某项，文本将显示在文本视图中。显示给用户的建议列表由数据适配器（data\
  \ adapter）形成。\n\n## Spinner\n\n`spinner` 控件用于向用户呈现一组定义的数据，用户从中选择。`spinner` 控件中的数据从与\
  \ `spinner` 控件关联的 `Adapter` 加载。列表 4.6 显示了 `spinner` 活动的 XML UI：\n\n![download](img/download.gif)\
  \ 列表 4.6: Spinner XML\n\n```xml\n<?xml version=\"1.0\" encoding=\"utf-8\"?>\n<LinearLayout\n\
  android:id=\"@+id/widget28\"\nandroid:layout_width=\"fill_parent\"\nandroid:layout_height=\"\
  fill_parent\"\nandroid:orientation=\"vertical\"\nxmlns:android=\"http://schemas.android.com/apk/res/android\"\
  \n>\n  <Spinner\n  android:id=\"@+id/Sp\"\n  android:layout_width=\"fill_parent\"\
  \n  android:layout_height=\"wrap_content\"\n>\n  </Spinner>\n  <TextView\n  android:id=\"\
  @+id/tvSp\"\n  android:layout_width=\"193px\"\n  android:layout_height=\"35px\"\n\
  \  android:text=\"TextView\"\n>\n  </TextView>\n</LinearLayout>\n```\n\n此代码包含在 `UIControls\\\
  Resources\\Layout\\spinner.axml` 中。\n\n列表 4.7  `spinner` 控件的代码：\n\n![download](img/download.gif)\
  \ 列表 4.7: Spinner code\n\n```csharp\n Spinner state;\n        TextView tvSp;\n \
  \       ArrayAdapter<String> aas;\n\n        protected override void OnCreate(Bundle\
  \ bundle)\n        {\n            base.OnCreate(bundle);\n            SetContentView(Resource.Layout.spinner);\n\
  \n            state = FindViewById<Spinner>(Resource.Id.Sp);\n            tvSp =\
  \ FindViewById<TextView>(Resource.Id.tvSp);\n            aas = new ArrayAdapter<String>(this,\
  \ \n                 Android.Resource.Layout.SimpleDropDownItem);\n            state.Adapter\
  \ = aas;\n            aas.Add(String.Empty);\n            aas.Add(\"Alabama\");\n\
  \            aas.Add(\"Arizona\");\n            aas.Add(\"California\");\n     \
  \       aas.Add(\"Tennessee\");\n            aas.Add(\"Texas\");\n            aas.Add(\"\
  Washington\");\n            state.ItemSelected += new EventHandler<ItemEventArgs>(sp_ItemSelected);\n\
  \        }\n\n        void sp_ItemSelected(object sender, ItemEventArgs e)\n   \
  \     {\n            tvSp.Text = Convert.ToString(aas.GetItem(e.Position));\n  \
  \      }\n```\n\n此代码包含在 `UIControls\\cs` 中\n\n在此示例中，创建了 `String`  `ArrayAdapter`\
  \ 并与 `spinner` 控件关联。`ArrayAdapter` 添加了字符串，然后将这些字符串添加到 `spinner` 控件中。\n\n![note](img/note.gif)注意\
  \ `ArrayAdapter` 初始化中的第二个参数。这是当 `spinner` 控件打开时显示的布局类型。\n\n图 4.8 显示了 `spinner`。\n\
  \n## Button\n\n用户可以点击 `button` 控件来执行某种操作。该按钮是 WinForms 和 WebForms 中按钮的 Android 等物。它支持\
  \ `OnClick` 事件，开发者可以使用它在按钮点击时处理代码。\n\n## Check Box\n\n`check box` 是支持两种状态（已选中和未选中）的按钮控件。这对于\
  \ .NET 开发者来说类似于 WinForms/WebForms 中的复选框。它支持 `OnClick` 事件，开发者可以使用它在项目点击时处理代码。\n\n\
  ## Radio Buttons and Groups\n\n`radio button` 是一个支持两种状态（已选中和未选中）的按钮控件。然而，该控件与复选框略不同。一旦\
  \ `radio button` 被选中，就无法取消选中。\n\n`radio group` 是一个创建一组单选按钮的类。当 `radio group` 内的某个\
  \ `radio button` 被选中时，任何其他已选中的 `radio button` 都会取消选中。`radio group` 的初始状态为所有项目均未选中。`radio\
  \ group` 是协同工作的单选按钮的容器控件。在程序上，通过创建单个单选按钮并将其添加到 `radio group` 来创建 `radio group`。复选框、单选按钮和单选按钮组的简短\
  \ XML 示例。\n\n\n\n\n\n```xml\n<?xml version=\"1.0\" encoding=\"utf-8\"?>\n<LinearLayout\n\
  xmlns:android=\"http://schemas.android.com/apk/res/android\"\n    android:orientation=\"\
  vertical\"\n    android:layout_width=\"fill_parent\"\n    android:layout_height=\"\
