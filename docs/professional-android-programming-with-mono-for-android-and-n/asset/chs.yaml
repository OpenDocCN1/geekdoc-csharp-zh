  在此列表中，`OnDraw()` 方法在内部包含了几种不同的关键行为。正如你可能从上一个示例中识别到的那样，该函数首先检查底层图形是否已经绘制。与可拖动演示一样，让程序尽可能轻量地运行至关重要，这意味着你希望只产生一次这种性能损耗。\n\
  \n之后，一条快速的日志消息会将一些关键值写入 `Console` 窗口。由于在此次调用中有许多不同的变量在同时移动，这可以帮助你追踪图形的运动情况，以及你底层的条件逻辑。虽然我们的工作不是为了写\
  \ Bug，但如果确实出现了 Bug，这是一个追踪它们的好方法。\n\n在 `OnDraw()` 方法的下一部分，有两个带有 `X-Axis` 和 `Y-Axis`\
  \ 注释标签的代码块。这些部分用于追踪位图在水平和垂直方向上移动的当前方向。基本上，这些部分会检查图形是否在屏幕边界内。如果没有，则反转图形移动的方向，将图形带回屏幕边界。由于该图形的源点位于\
  \ (0,0)，一半的弹跳条件检查用于判断图形是否移动到了这些值以下。第二个弹跳条件是画布的总长度与图形缩放后长度之间的差。通过这种方式，一旦任何一点触碰到屏幕边缘，图形就会弹回，而不仅仅是原点处。\n\
  \n![note](img/note.gif)为了获取图形的高度和宽度，此函数使用了位图的 `GetScaledWidth()` 和 `GetScaledHeight()`\
  \ 函数。使用这些函数的目的是它们始终返回位图的真实尺寸，即使画布或其他方法对图形应用了缩放效果。在大多数情况下，几乎每个图形在传递到屏幕时都会接收某种程度的缩放效果。因此，使用缩放后的值是一个好主意。\n\
  \n***\n\n最后，方法的最后部分偏移了图形对应的位置，使用 `AxisDirection` 设置来决定是向正方向还是负方向移动它。在这些区域中，`Velocity`\
  \ 变量被用于确定移动图形的像素数。一旦 `CurrentPosition` 点已更新，就使用 `Translate()` 方法将画布移动到正确的位置。`View`\
  \ 对象现在应该已经准备就绪了。这完成了第一个任务。\n\n### 定期间隔重绘画布\n\n第二个任务是调整活动，使其以固定间隔调用视图的 `Invalidate()`\
  \ 函数。这可以通过多种方式实现，但核心是在活动的 `OnCreate()` 函数中创建一个单独的线程并调用一个循环函数。使用 `Thread.Sleep()`\
  \ 在适当的间隔更新 `View` 对象。列表 12.13 显示了这种实现。\n\n![download](img/download.gif) 列表 12.13:\
  \ 为 HTML5Logo_Bouncing 创建循环\n\n```c\n[Activity(Label = \"Graphics_Demo\", MainLauncher\
  \ = true)]\npublic class GraphicsSample : Activity\n{\n\n     protected override\
  \ void OnCreate(Bundle bundle)\n     {\n          base.OnCreate(bundle);\n     \
  \     var targetView = new HTML5Logo_Bouncing(this, 100);\n\n          SetContentView(targetView);\n\
  \          ThreadPool.QueueUserItem(o => RunLoop(targetView));\n     }\n\n     private\
  \ void RunLoop(View TargetView)\n     {\n          while (true)\n          {\n \
  \              Thread.Sleep(10);\n               RunOnUiThread(() => TargetView.Invalidate());\n\
  \          }\n     }\n}\n```\n\n`Graphics_Canvas\\Graphics_Canvas\\GraphicsDemo.cs`\n\
  \n在此列表中，创建了一个名为 `RunLoop()` 的方法。通过无限循环，该线程睡眠 10 毫秒并调用 `Invalidate()` 函数。使用 `RunOnUiThread()`\
  \ 调用 `Invalidate()` 函数是因为这是其运行的要求。\n\n现在，运行应用程序并查看结果。图 12.5 勾出了预期的路径。要调整移动的速度，请调整\
  \ `Thread.Sleep()` 值或 `HTML5Logo_Bouncing` 类中的 `Velocity` 变量。记住，`Invalidate()` 调用更多是一个重绘建议，而不是直接命令。因此，速度和速率设置可能并不完全准确，因为重绘取决于操作系统的启动。\n\
  \n![12.5](img/c12f005.jpg)\n\n此时你已经了一个功能完整的应用程序。尽管它按预期工作，但还需要最后一个任务。由于这是一个持续运行循环，你应该遵循一些步骤以确保在应用程序进入后台时停止运行。这通过添加一个名为\
  \ `IsRunning` 的布尔变量并重写 `OnPause()` 和 `OnResume()` 方法来实现。列表 12.14 显示了这种技术。\n\n\n\n\
  \n\n```csharp\npublic Boolean IsRunning = true;\n\nprotected override void OnPause()\n\
  {\n     IsRunning = false;\n     base.OnPause();\n}\n\nprotected override void OnResume()\n\
  {\n     IsRunning = true;\n     base.OnResume();\n}\n\nprivate void RunLoop(View\
  \ TargetView)\n{\n     while (IsRunning)\n     {\n          Thread.Sleep(10);\n\
  \          RunOnUiThread(() => TargetView.Invalidate());\n     }\n}\n```\n\n`Graphics_Canvas\\\
  Graphics_Canvas\\GraphicsCanvasDemo.cs`\n\n在这个示例中，应用程序仅需几行代码就获得了清理资源使用的能力。当应用程序进入后台和从后台时，会调用\
  \ `OnPause()` 和 `OnResume()` 函数。通过使用 `IsRunning` 布尔值，这两个函数让应用程序能够追踪自己何时处于运行状态。通过将\
  \ `while` 循环中的 `true` 条件替换为 `IsRunning`，应用程序在移动到后台时将不再尝试更新 `TargetView` 图形。\n\n\
  ## 案例 4：使用 SurfaceView 提高性能\n\n在设置好跳动的图像视图后，你觉得工作已经完成，并将其部署给你的测试人员。几天后，你开始收到投诉，因为应用程序似乎随机变得卡顿，特别是当用户与其他\
  \ UI 元素交互时。你必须找到一种更好的方法来显示此视图，以获得更快的性能。\n\n虽然使用自定义视图是在设备上绘制图形的极佳方法，但这种方法有一个主要的缺点。所有的典型视图都是使用\
  \ GUI 线程绘制的。尽管你可以在后台线程上处理大部分逻辑，但典型视图的最终绘制函数无法在 GUI 以外的任何线程上运行。这就是为什么上一个示例需要使用 `RunOnUiThread()`\
  \ 调用来启动视图的刷新过程。\n\n当你处于快速刷新（更新）自定义视图的情况时，这可能会开始导致 GUI 线程变得缓慢。此外，如果视图的 `OnDraw()`\
  \ 方法特别沉重或正在尝试渲染动画，这将极大地抑制 GUI 线程的性能。由于 GUI 线程用于所有的用户活动（手指按下、文本输入或加速度计响应），这种状况可能会导致糟糕的用户体验，因为你的图形可能会变得卡顿，或者可能会可能会结。\n\
  \n幸运的是，有一种极棒的方法可以解决这个问题。典型视图被迫强制在 UI 线程上渲染，而一种名为 `SurfaceView` 的特殊对象可以在后台线程进行更新。`SurfaceView`\
  \ 能够实现这一点，是因为它在视图层次结构中被分配了一个专用的表面。使用 `SurfaceView`，你可以完全实现动画和图形，而不影响整个应用程序界面的响应速度。\n\
  \n在使用 `SurfaceView` 时，你需要记住以下几个关键点：\n\n- `SurfaceView` 并不是完美的解决方案。使用 `SurfaceView`\
  \ 是有代价的——它需要额外的内存消耗来运行。因此，开发者在迁移到 `SurfaceView` 之前需要平衡成本与收益。\n- 有时，在迁移到 `SurfaceView`\
  \ 之前尝试自定义视图更好。由于 `SurfaceView` 的设置和功能与自定义视图相似，将自定义视图转换为 `SurfaceView` 是一件小事。这稍后会演示。\n\
  - 使用 `SurfaceView` 时，你完全进入了线程环境。确保任何变量或状态存储的访问都是线程安全的。\n- 与自定义视图相比，`SurfaceViews`\
  \ 对错误或内存泄漏的容忍度较低。非常小心地正确设置和清理 `SurfaceView` 实现，以免无意中让表面处于不可用的状态。\n\n`SurfaceView`\
  \ 类包含了创建自定义 `SurfaceView` 对象所需的所有方法和事件。此视图实际上继承自 `View` 类，但增加了一些额外的属性。此类中还包含控制 `SurfaceView`\
  \ 在视图层次结构中放置 z 序的方法。与你在 CSS 样式表中发现的类似，`SurfaceView` 中的 z 序允许开发者在渲染典型视图的实际窗口之上或下方叠加一个表面。最后，`SurfaceView`\
  \ 添加了一个属性来引用与此对象关联的底层 `ISurfaceHolder` 实例。\n\n可以在 `SurfaceView` 上实现 `ISurfaceHolderCallback`，以便开发者访问发生在表面上的事件和变化。该接口是创建稳定且功能的\
  \ `SurfaceView` 对象的关键。它暴露了以下主要事件：\n\n- `SurfaceCreated` 在表面创建后立即调用。此事件非常关键，因为它指示了绘制过程何时可以发生。在此事件发生之前尝试向表面绘图会导致严重的副作用，例如应用程序锁定或崩溃。\n\
  - `SurfaceDestroyed` 在 `SurfaceView` 销毁之前调用。同样，避免在表面不存在时尝试向其绘制任何内容至关重要。因此，这就是你想要放置任何停止处理逻辑的地方。\n\
  \ `SurfaceChanged` 在表面结构发生变化（例如表面宽度或高度差异）时调用。这让开发者有机会显示变化，例如从竖屏显示切换到横屏显示。\n\n通过对\
  \ `SurfaceView` 对象的新理解，你现在可以更新 HTML5 Logo，使其在后台平畅运行。在与上示例相同的项目中，添加一个名为 `HTML5Logo_SurfaceView.cs`\
  \ 的新类。在此类中，你需要继承自 `SurfaceView` 对象并实现 `ISurfaceHolderCallback`。\n\n为了让此新实现正常工作，你需要稍微修改在上一个案例中使用的相同代码示例。然而，你并没有简单继承\
  \ `HTML5Logo` 类的便利。[列表 12.15] 是 `SurfaceView` 类的完整实现。之前章节中涵盖的部分已标记了适当的注释。\n\n![下载](img/download.gif)\
  \ 列表 12.15: 设置 HTML5Logo SurfaceView\n\n\n\n\n\n```c\npublic class HTML5Logo_SurfaceView\
  \ : SurfaceView, ISurfaceHolderCallback\n{\n     public Bitmap HTML5Bitmap { get;\
  \ set; }\n     public int Scale = 100;\n     private int Velocity = 2;\n     private\
  \ Point CurrentPosition = new Point(1, 1);\n\n     public Boolean IsRunning = false;\n\
  \n     private enum AxisDirection { Positive = 0, Negative = 1 };\n\n     private\
  \ AxisDirection VerticalAxisDirection = AxisDirection.Positive;\n     private AxisDirection\
  \ HorizontalDirection = AxisDirection.Positive;\n\n     public HTML5Logo_SurfaceView(Context\
  \ context): base(context)\n     {\n          this.Holder.AddCallback(this);\n  \
  \   }\n\n     protected Bitmap CreateHTML5Bitmap()\n     {\n          //Same as\
  \ previous examples...\n     }\n\n     protected override void OnDraw(Canvas canvas)\n\
  \     {\n          canvas.DrawColor(Color.Black);\n          canvas.DrawBitmap(HTML5Bitmap,\
  \ CurrentPosition.X, CurrentPosition.Y,\n null);\n     }\n\n     protected void\
  \ UpdatePosition(Canvas canvas)\n     {\n          //Refactored from previous OnDraw()\
  \ examples.\n          //This will update the moving canvas's horizontal and vertical\n\
  \          //directions.\n     }\n\n     private void RunLoop()\n     {\n      \
  \    Canvas c = null;\n\n          while (IsRunning)\n          {\n            \
  \   try\n               {\n                    c = this.Holder.LockCanvas();\n\n\
  \                    UpdatePosition(c);\n                    this.OnDraw(c);\n \
  \              }\n               finally\n               {\n                   \
  \ if (c != null) this.Holder.UnlockCanvasAndPost(c);\n               }\n       \
  \   }\n     }\n\n     public void SurfaceCreated(ISurfaceHolder holder)\n     {\n\
  \          IsRunning = true;\n          ThreadPool.QueueUserWorkItem(o => RunLoop());\n\
  \     }\n\n     public void SurfaceDestroyed(ISurfaceHolder holder)\n     {\n  \
  \        IsRunning = false;\n     }\n\n     public void SurfaceChanged(ISurfaceHolder\
  \ holder,\n          int format, int width, int height)\n     {\n     }\n\n    \
  \ private void DrawHTML5Text(Canvas canvas)\n     {\n          //Same as previous\
  \ examples...\n     }\n\n     private void DrawHTML5InnerBackground(Canvas canvas)\n\
  \     {\n          //Same as previous examples...\n     }\n\n     private void DrawHTML5Background(Canvas\
  \ canvas)\n     {\n          //Same as previous examples...\n     }\n}\n```\n\n\
  `Graphics_Canvas\\Graphics_Canvas\\HTML5Logo_SurfaceView.cs`\n\n此列表中的几个部分应该看起来熟悉。事实上，上一个示例中的所有代码都移动到了这个\
  \ `SurfaceView` 实现中，并进行了细微修改。这包括：\n\n*   绘制 HTML5 位图的逻辑。\n*   在请求之间在内存中保持单个 HTML5\
  \ 位图实例的逻辑。\n*   更新移动位图位置的逻辑。这被稍微重构到 `UpdatePosition()` 方法中，以清理 `OnDraw()` 方法。\n\
  *   用于控制速度和缩放的跟踪变量。\n\n除了这些熟悉的方法外，一些少数的添加基于与上一个示例相同的概念，但位置略有不同：\n\n*   此类的构造函数向\
  \ `ISurfaceHolder` 对象添加了回调。这会将任何 `ISurfaceHolder` 事件连接到并在此类实例中进行触发。\n*   实现了 `ISurfaceHolder`\
  \ 类的 `SurfaceCreated` 回调。在此类中，你使用相同的 `IsRunning` 布尔值来指示系统可以开始运行绘制程序。如所述，这很重要，因为你需要确保不要尝试向空表面绘图。在将\
  \ `IsRunning` 设置为 true 后，你使用与上一个示例中类似的逻辑来队列一个新的后台线程以开始循环绘制更新。\n*   实现了 `ISurfaceHolder`\
  \ 的 `SurfaceDestroy` 回调。与创建方法一样，通过切换 `IsRunning` 变量的开关来停止绘制循环。\n\n此外，两个关键更新需要特别注意。`RunLoop()`\
  \ 方法表示用于创建 `HTML5Logo` 位图动画效果的绘制程序。在此方法内部，你创建了一个新的 `Canvas` 对象。然后启动一个 `while` 循环，检查\
  \ `IsRunning` 布尔值以确保你允许向 `SurfaceView` 写入。\n\n接下来，添加了 `try/catch` 块。此此块的原因是因为要在\
  \ `Canvas` 对象上绘图，需要锁定 `SurfaceHolder`。当调用 `Holder.LockCanvas()` 函数时，表面会被锁定以便进行更新。此外，此函数返回一个\
  \ `Canvas` 对象，以便可以更新位图并在画布上进行绘制，就像在之前的示例中所的那样。最后，使用 `finally` 块来确保即使发生错误，`SurfaceHolder`\
  \ 始终会被解锁。这非常重要，因为如果 `SurfaceHolder` 被锁定，视图将无法正常渲染。\n\n最后，`OnDraw()` 方法看起来与我们预期的相似。然而，初始绘制命令有点奇怪，因为在绘制渲染的位图之前必须绘制一个黑色画布似乎很反常。这样做的原因是\
  \ `Canvas` 对象在 `SurfaceView` 中的处理方式略有不同。当你接收它时，它并不是“空白”的，`SurfaceHolder` 返回的是之前绘制指令使用的\
  \ `Canvas` 对象。如果你不将其“清空”，你将在一个已经包含了之前所有形态的画布上绘制新的 `HTML5Logo` 位图。这可能会导致一个有趣的错误，即你的屏幕上会出现一条长长的、蛇形的\
  \ HTML5 Logo。\n\n代码示例已准备好测试。通过复制被省略的结果或下载此示例项目，完成对你的 `SurfaceView` 类的更新。然后，更新 `Activity`\
  \ 的 `OnCreate` 方法，将此类的实例处理为内容视图。\n\n## 选择最佳方法\n\n在之前的示例中，我们介绍了在与 `Canvas` 对象交互时使用动画技巧的各种用例。具体来说，我们概述了两种不同的方法：覆盖\
  \ `View` 对象或使用 `SurfaceView` 类。\n\n*   图形或动画效果有多复杂？典型的视图和自定义视图最适合简单的图形或动画效果。如果你正在处理一个非常小的一次性动画，或者如果你的效果是简单且线性的，自定义视图将提供一个简单而优雅的解决方案。\n\
  *   你的应用程序目前对 UI 线程的利用程度如何？自定义视图方法需要利用 UI 线程来重绘自己。如果你正在为需要 UI 线程用于其他用途的应用程序构建某种后台动画，这可能会让你的应用程序变得缓慢且无响应。在预计\
  \ UI 线程将用于其他用途的情况下，请使用 `SurfaceView`。\n\n\n\n\n\n*   精确度和时机对动画来说有多重要？正如前面提到的，你需要调用\
  \ `Invalidate()` 函数来请求 UI 线程重新绘制自定义视图的视图。这使得自定义视图成为那些依赖精度的应用程序（如动作游戏）的较差选择。在需要精确调整和绘制图形的情况下，请使用\
  \ `SurfaceView`。\n\n考虑到这些因素，你应该已经有了足够的信息来推测适用于你动画需求的最佳方法。尽管如此，随着你开始为绘制过程添加更多功能或提出更多要求，做出正确的选择有时可能是一个试错的过程。\n\
  \n# 2D 图形库\n\n在开发者不希望直接与 `Canvas` 对象进行交互的情况下，Android 提供了一个自定义的内置 2D 图形库。该库承担了大量的实质性工作，并扩展了底层类型的功能。事实上，在使用这些项目项时，你已经通过\
  \ `Resources` 类在使用该库了，该类利用了 2D 图形库。\n\n在 Mono for Android 平台上使用 2D 图形库时，你将主要处理一种名为\
  \ `drawable` 的特殊资源。正如你可能猜到的，`Drawable` 类包含了一组与绘图相关的工具和函数。这可以是通过程序描述或 XML 文件描述的自定义艺术，可以是设备上的物理图像资源，也可以是它们的结合。\n\
  \nDrawables 为开发者提供了极其丰富的能力。框架对这些类有几十种不同的实现，每种实现都满足特定的需求。\n\n# 使用 Drawables\n\nDrawables\
  \ 用于描述 Mono for Android 平台上可以绘制的任何内容。虽然此功能显然与使用图形原语和画布的功能重叠，但这两组功能之间存在一些区别：\n\n\
  *   与直接操作画布相比，使用 Drawables 引入了一些额外的开销。这一点已经提到过多次；但它是关键点。不要害怕使用 drawables——只需在使用它们何在使用以及如何使用它们即可。通过理解每个选项的优缺点，你可以对在何时以及如何使用它们做出明智的决策。\n\
  \n*   Drawables 可以在布局的 XML 语法中表示。通过这种方式，你可以在布局文件中声明你的 `Drawable` 对象，但仍然可以通过代码来维护它们。这可以极地简化编码过程，并将\
  \ drawables 封装成可重用的块。\n\nDrawables 在框架中起着重要作用。除了提供创建通用样式设置的机制外，drawables 还被用作一种通用方式，在你的代码与不同的框架工具集之间传递图形信息。\n\
  \n## 作为 XML 资源的 Drawables\n\n虽然通过代码定义 drawables 是完全可以的，但通常通过 XML 表达式使用。一旦通过 XML\
  \ 定义了 drawable，就可以像其他 drawable 资源一样被利用。这允许 drawables 具有通用定义，同时对系统的任何部分可见。当此功能被正确使用时，它可以使通用编辑变得简单。事实上，许多\
  \ drawables 用于辅助全局应用程序定义，就像使用 CSS 来实现网站 HTML 样式的通用一样。\n\n定义基于 XML 的 drawable 的过程非常简单。你通过在\
  \ `Resources/Drawable` 目录下添加 XML 文件并添加相应的语法来实现。添加此文件后，平台将其识别为 drawable 资源，并根据 XML\
  \ 文件名（不包括扩展名）对其命名。一旦识别出 XML drawable 为资源，就可以使用用于标准 drawable 类型的典型方法访问 drawable，如\
  \ Listing 12.16 所示。\n\n![download](img/download.gif) Listing 12.16: 通过 XML 和 C#\
  \ 声明 drawable\n\n```xml\n<!-- 通过布局中的 XML 语法  -->\n<Button android:id=\"@+id/SomeButton\"\
  \n     android:layout_width=\"fill_parent\"\n     android:layout_height=\"wrap_content\"\
  \n     android:background=\"@drawable/yourcustomdrawablename \"\n     android:text=\"\
  Click Me!\"/>\n\n// 通过代码声明：\nView SomeView = new View(this);\nSomeView.SetBackgroundDrawable(Resource.Drawable.YourCustomDrawableName);\n\
  ```\n\n注意，XML 语法中的资源引用是小写的。Android 要求所有 drawable 资源引用必须全小写。Mono for Android 在支持不同大小写的资源声明方面做了了大量工作，但在布局文件中例外。在\
  \ drawable XML 声明中使用大写名称将导致编译错误。\n\n通过将 drawable 作为 XML 资源使用，你可以轻松地创建统一的布局和背景，同时保持自定义图形的完全灵活性。\n\
  \n![note](img/note.gif)对于本节中的后续示例，XML 声明是表示 drawables 的优先方式。这并不意味着 XML 是处理 drawables\
  \ 的首选方式。相反，XML 语法是 drawables 的独特特性之一，使其成为一个方便的工具集。此外，通过代码实现 drawable 非常直观，而使用 XML\
  \ 则提供了一种变化。\n\n* * *\n\n## 简单和复合 Drawables\n\n框架有几十种 drawables。由于它们易于扩展和实现，修改后的实现整个框架以及其他几个第三方库中非常常见。因此，任何尝试分类或列出每种\
  \ drawable 类型都是困难的，并且远超本章的范围。\n\n尽管数量很多，drawables 倾向于属于两种不同的分类——简单 drawables（simple\
  \ drawables）和复合 drawables（compound drawables）。基本上，复合 drawables 可以在一个单元内合并多个 drawables，而简单\
  \ drawables 是提供单一功能的单体单元。除了包含多个单元外，复合 drawables 通常还提供可以应用于其底层单元的转换功能。当结合使用时，这两种\
  \ drawable 类型可以非常强大，并为开发者提供可扩展的、清晰的图形，且其内存占用不会与基于文件的资源相同。\n\n## Drawables 的实战\n\n\
  采取与本章画布部分类似的方法，接下来的章节将带你了解基于 XML 的 drawable 的几种用例场景。每个用例都会在前一个用例的基础课程基础上进行扩展，希望构建一个关于如何在应用程序中与\
  \ drawables 交互的完整故事。\n\n## 案例 1：使用默认 Drawables\n\n你决定创建一个简单的应用程序来帮助处理 Android drawables。在这个应用程序中，你决定显示几行\
  \ Android 机器人，开玩笑地称它们为你的“机器人军队”。除了制作精美、有风格的机器人外，你还想与每个机器人机器人添加一些交互。\n\n从开始，创建一个名为\
  \ `GraphicsDrawables_RobotArmy` 的新项目。接下来，你需要选择一个机器人作为你机器人军队的图形。为了简单起见，此示例使用了 Android\
  \ 机器人的副本。将其重命名为 `androidrobot`，并作为 drawable 资源添加到应用程序的 `Resources/Drawable` 文件夹中。\n\
  \n![note](img/note.gif)通过快速搜索，你会发现 Android 机器人有很多变体。此示例使用了 Google 品牌页面上的 Android\
  \ 机器人转换版本：[www.android.com/branding.html](http://www.android.com/branding.html)。尽管可以使用你选择的任何图像，但请确保它是\
  \ PNG 格式。此外，图像应该具有透明背景，因为涵盖的许多示例将被不透明背景所遮挡。\n\n\n\n\n\n一旦你为应用程序添加了机器人图像，就可以开始显示机器人列表的过程。打开该项目的\
