  \n### 案例 3：自定义图形的动画处理\n\n设置好这些值后，你需要重写 `OnDraw()` 函数以便处理标志的移动。除了控制视图渲染外，`OnDraw()`\
  \ 方法还用于根据速度移动对象并处理任何反弹情况。这样，外部调用只需要担心调用视图的 `Invalidate` 函数，而无需处理其他信息。\n\n为了完成此任务，需要调整两个不同的区域：\n\
  \n*   首先，HTML5 图形需要一种跟踪其位置的方法。这与上一节中跟踪用户拖动动作时完成的工作类似。\n*   第二个更改是 Activity 需要创建一个定时循环来系统地调用\
  \ `Invalidate()`。这种循环将类似于游戏应用程序所需的循环，游戏应用需要进行定时更新。\n\n## 跟踪图形的位置\n\n在之前使用的应用程序中，创建一个名为\
  \ `HTML5Logo_Bouncing` 的新类。在此类中，继承 `HTML5Logo` 类，以便利用上一个示例中实现的绘制优化。\n\n在此类中，添加几个属性来帮助移动标志：\n\
  \n*   一个名为 `CurrentPosition` 的 `Point` 对象：此字段将存储图形当前的位置。\n*   一个名为 `AxisDirection`\
  \ 的私有 `Enum`：在此枚举中，创建两个项 `Positive` 和 `Negative`。将 `Positive` 值设为 0，`Negative` 为\
  \ 1。虽然枚举不是必须的，但它是跟踪标志当前移动方向的一种很好的视觉方式。\n*   两个名为 `VerticalAxisDirection` 和 `HorizontalAxisDirection`\
  \ 的私有 `AxisDirection` 枚举：这些变量的作用是跟踪图形在每个轴上向正负方向移动。每当图形遇到“反弹条件”时，值就会反转，开始向相反方向移动。\n\
  *   一个名为 `Velocity` 的私有 `int`：推此这用于控制图形移动的速度。具体来说，它告诉图形在每次调用 `OnDraw()` 方法之间移动多远。\n\
  \n设置好这些值后，你需要重写 `OnDraw()` 函数以便处理标志的移动。除了控制视图渲染外，`OnDraw()` 方法还用于根据速度移动对象并处理任何反弹情况。\n\
  \n列表 12.12 显示了 `HTML5Logo_Bouncing` 类的所有适当调整，以及 `OnDraw()` 重写中反弹逻辑的实现。\n\n\n\n\n\
  \n![download](img/download.gif) 列表 12.12: 创建 HTML5Logo_Bouncing \n\n```c\npublic\
  \ class HTML5Logo_Bouncing : HTML5Logo\n{\n     private Point CurrentPosition =\
  \ new Point(1, 1);\n\n     private enum AxisDirection { Positive = 0, Negative =\
  \ 1 };\n\n     private AxisDirection VerticalAxisDirection = AxisDirection.Positive;\n\
  \     private AxisDirection HorizontalDirection = AxisDirection.Positive;\n    \
  \ private int Velocity = 2;\n\n     public HTML5Logo_Bouncing(Context context, int\
  \ Scale)\n          : base(context, Scale)\n     {\n          this.Scale = Scale;\n\
  \          this._context = context;\n     }\n\n     protected override void OnDraw(Canvas\
  \ canvas)\n     {\n          if (HTML5Bitmap == null) HTML5Bitmap = CreateHTML5Bitmap();\n\
  \n          //TODO:  不要包含在生产代码中!!\n          Console.WriteLine(String.Format(\n\
  \               \"Logging Message:  CanvasWidth: {0}, BitMapWidth: {1},\n      \
  \              Current X / Y: {2} / {3}\",\n          canvas.Width, HTML5Bitmap.Width,\
  \ CurrentPosition.X, CurrentPosition.Y));\n\n          //X-轴\n          if(CurrentPosition.X\
  \ >= this.Width - HTML5Bitmap.GetScaledWidth(canvas))\n          {\n           \
  \    HorizontalDirection = AxisDirection.Negative;\n          } else if (CurrentPosition.X\
  \ <= 0) {\n               HorizontalDirection = AxisDirection.Positive;\n      \
  \    }\n\n          if (HorizontalDirection == AxisDirection.Positive)\n       \
  \   {\n               CurrentPosition.X += Velocity;\n          } else {\n     \
  \          CurrentPosition.X -= Velocity;\n          }\n\n          //Y-轴\n    \
  \      if (CurrentPosition.Y >= this.Height -\n HTML5Bitmap.GetScaledHeight(canvas))\n\
  \          {\n               VerticalAxisDirection = AxisDirection.Negative;\n \
  \         }\n          else if (CurrentPosition.Y <= 0)\n          {\n         \
  \      VerticalAxisDirection = AxisDirection.Positive;\n          }\n\n        \
