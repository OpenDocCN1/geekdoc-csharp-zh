  \ `RunOnUIThread` 方法实现的。必须使用 `RunOnUIThread` 是因为 Web 服务的响应是在主线程不同的线程中处理的。要写入用户界面，命令必须在主线程上编写。\n\
  \n![note](img/note.gif)由于操作是异步执行的，工作在另一个线程中完成。要写回 UI，必须通过调用 `RunOnUIThread` 方法在主线程上执行。\n\
