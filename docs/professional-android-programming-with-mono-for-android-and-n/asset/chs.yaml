  \n* * *\n\n图 15.12\n\n![15.12](img/c15f012.jpg)\n\n图 15.13\n\n![15.13](img/c15f013.jpg)\n\
  \n要在 MonoTouch 中运行相同的代码，你需要在 Mac 上启动 MonoDevelop。与 Mono for Android 示例一样，你想要同时添加一个\
  \ MonoTouch Windows 窗口项目（这只是一个默认的 MonoTouch 项目）和一个 MonoTouch 库项目。由于 MonoDevelop\
  \ 不能有两个相同的项目名称（即使位于不同的解决方案），示例将 Twitter 助手 MonoTouch 库项目命名为 `MTTTwitterHelper`。对于布局，你可以使用\
  \ Interface Builder，这是 Apple 的一个工具，允许你通过拖放控件到 iPhone 布局中。在这里，你只需要添加你寻找的布局（使用表格视图列出数据、一个按钮和一个文本框）。图\
  \ 15.14 显示了该布局的样子。\n\n图 15.14\n\n![15.14](img/c15f014.jpg)\n\n与你在 Mono for Android\
  \ Twitter 用户应用程序中使用 `ArrayAdapter` 的方式类似，要在 MonoTouch 中将数据绑定到你的表格视图，你需要创建一个自定义的表格源（table\
  \ source）来处理这些数据的显示。你不需要像在 Mono for Android 适配器中拥有一个 `GetView`，而是有一个 `GetCell` 方法。你将在此处处理来自推文列表的数据绑定，并恰当地地显示它们。列表\
  \ 15.12 显示了 `TableViewSource` 类的实现。\n\n![download](img/download.gif) 列表 15.12：设置\
  \ `TableViewSource` 类\n\n```c\npublic class TweetTableViewSource : UITableViewSource\n\
  {\n   public AppDelegate _delegate { get; set; }\n\n   public TweetTableViewSource(AppDelegate\
  \ delegte)\n   {\n      _delegate = delegte;\n   }\n\n   public override int RowsInSection\
  \ (UITableView tableview, int section)\n   {\n      return _delegate._tweet.Count();\n\
  \   }\n   public override UITableViewCell GetCell \n                           \
  \        (UITableView tableView, NSIndexPath indexPath)\n   {    \n      var cell\
  \ = tableView.DequeueReusableCell(\"myCell\");\n      if(cell == null) \n      {\n\
  \         cell = new UITableViewCell(UITableViewCellStyle.Subtitle, \"myCell\");\
  \      }\n\n      cell.DetailTextLabel.Text = _delegate._tweet[indexPath.Row].FromUser;\n\
  \      cell.TextLabel.Text = _delegate._tweet[indexPath.Row].Text;\n\n      var\
  \ path = Environment.GetFolderPath (Environment.SpecialFolder.Personal);\n\n   \
  \   if (!Directory.Exists (string.Format (\"{0}/twitter-images\", path)))\n    \
  \     Directory.CreateDirectory (string.Format (\"{0}/twitter-images\", path));\n\
  \n      string file = string.Format (\"{0}/twitter-images/{1}\", path);\n\n    \
  \  return cell;\n   }\n}\n```\n\n`TwitterUser\\MonoTouch\\MonoTouch\\Main.cs`\n\n\
  现在你已经创建了 `TableViewSource` 类，你需要实现按钮的 `TouchUpInside` 方法来调用你的共享代码并刷新表格视图。在 MonoTouch\
  \ 中，你使用 `InvokeMainThread`，而在 Android 中你会使用 `OnUiThread`。无论哪种方式，这都会在 UI 线程上执行。列表\
  \ 15.13 显示了按钮和表格视图使用了列表 15.12 中创建的 `TableViewSource`。\n\n```c\npublic override bool\
  \ FinishedLaunching (UIApplication app, NSDictionary options)\n{\n   // 当按下返回键时，隐藏键盘\n\
  \   userNameBox.ShouldReturn = (tf) => {   \n      tf.ResignFirstResponder (); \
  \  \n      return true;   \n   };\n\n   _tweet = new List<Tweet>();\n\n   button.TouchUpInside\
  \ += (s,e) =>\n   {\n      var username = userNameBox.Text.ToString();\n      ThreadPool.QueueUserWorkItem(\
  \ o =>\n         TwitterReceiver.GetTweetsForUser(username, tweets =>\n        \
  \ {\n            InvokeOnMainThread(() =>\n            {\n               _tweet\
  \ = tweets;\n               tableView.ReloadData();\n            });\n         })\n\
  \      );\n   };\n\n   tableView.Source = new TweetTableViewSource(this);\n\n  \
  \ window.MakeKeyAndVisible ();\n\n   return true;\n}\n```\n\n\n\n\n使用这种技术来布局你的项目可以让你编写出在三个平台上都能运行的代码，同时仍然允许你使用前面提到的预处理器指令来编写特定平台的代码。这允许你抽象化复杂的操作，例如文件系统或访问联系人，而无需让应用程序担心如何实现这些操作。这是可移植库项目（portable\
  \ library project）永远无法让你做到的。\n\n# 总结\n\n在本章中，你学习了主要的不同的移动平台，以及你如何在每个平台上编写 C# 和 .NET\
  \ 代码。为每个平台编写代码可以重用熟悉的语言和通用框架。然而，在 `.NET` 框架哪些部分在这些平台和设备上可用，以及你在每个平台上可以使用和不能使用的部分之间，仍然存在脱节。\n\
  \n当可移植库工具（Portable Library Tools）大成并作为 1.0 版本发布后，希望库创建者将开始转向编写他们的库以与可移植库协同工作。这将允许许多人可以使用他们的库，并允许创建者只编写一次代码。\n\
  \n# 第 16 章：准备并将你的应用程序发布到市场\n\n## 本章包含什么？\n\n*   准备你的应用程序：最佳测试实践和工具\n*   创建最终构建\n\
  *   签名你的应用程序\n*   部署到 Android 市场\n\n在花费了大量辛苦的时间编写、设计、开发和测试你的应用程序之后，你终于准备好将应用程序推向市场。无论你发布的是免费还是付费应用程序，你都知道应用程序给潜在用户留下的第一印象对你的成功至关重要。本章的目标不仅是帮助你成功发布应用程序，而且帮助你确保你的应用程序获得成功。\n\
  \n尽管你已经为应用程序投入了大量工作，但在接近发布应用程序时，仍然有许多额外步骤需要采取。无论如何，花时间仔细且不走捷径是关重要的，因为片刻的不耐烦可能会导致惨淡的销量或下载量。考虑到这一点，本章分为两个部分，重点关注应用程序发布的两个不同方面：\n\
  \n*   “准备你的应用程序”侧重于让应用程序准备好上传到应用程序市场所需的步骤。除了包含典型的检查清单外，本节还建议了用于对应用程序进行最终测试的工具和流程。\n\
  *   “将应用程序发布到 Android 市场”涵盖了当前 Android 市场的工作原理。此外，本节还介绍了上传应用程序的过程，并描述了发布过程中常见的陷阱（gotchas）。\n\
  \n本章还提供了在整个发布过程中需要记住的重要提示。然而，不要将你的努力限制在本章列出的想法上。相反，要将本章作为基础构建一个自定义的发布和维护策略，以充分利用你的应用程序及其市场价值。\n\
  \n# 准备你的应用程序\n\n作为开发者，我们往往在应用程序接近完成时感到兴奋。事实上，我们对应用程序如此热情，以至于有时跳过关键步骤，而这些步骤的遗漏对应用程序在\
  \ Android 市场的成功可能是不利的。本节的目的是通过在你开始发布过程之前提供一些提示、技巧和需要考虑的事项，帮助控制这种热情。此外，本节还花了一些时间涵盖处理许可问题、准备最终部署以及避免常见陷阱的步骤。\n\
  \n## 测试你的应用程序\n\n测试是本章最重要的步骤。在发布之前对应用程序进行充分测试是至关重要且必要的。尽管你可能已经花了大量时间测试应用程序，但在将应用程序发布到市场之前，几个步骤仍然很重要。\n\
  \n我们为什么如此强调压力测试？除了显而易见的原因，将应用程序发布到应用程序市场与其它领域发布应用程序完全不同。手机应用程序市场是一个独特的领域，无论是从用户的反应方式，还是从你的应用程序将面临的硬件种类来说。广泛测试对于以下原因很重要：\n\
  \n*   用户对手机应用程序的宽容度比对桌面应用等应用程序低得多。在一个成千上万应用程序竞争用户时间的世界里，你的应用程序需要比周围的任何事物都更亮。简单的错误，如随机停止错误和缺失菜单项，会瞬间破坏与用户之间原本良好的关系。没有什么比看到图\
  \ 16.1 更糟糕的。\n*   应用程序有评论——用户对此非常重视。应用程序可能发生的最糟糕的情况是发布后获得糟糕的初始评分。用户非常看重应用程序评论，往往只是听从他人的意见，而不是自己去尝试应用程序。从糟糕的初始评价中恢复可能是困难的，因此最好避免获得它们。\n\
  *   Android 运行在各种平台上。从平板电脑到电视盒，再到 Kindle 以及各种手机，Android 正在迅速扩展许多不同的硬件平台。尽管你的应用程序可能不需要针对这些每一个硬件设备，但不仅要测试所有目标受众的设备，而且在不支持的模式下优雅地失败也是重要的。\n\
  \n图 16.1\n\n![16.1](img/c16f001.jpg)\n\n我们可能已经把测试的需求说得调调了，但它是一个重要的步骤，不能轻视。幸运的是，记住几个关键测试区域可以帮助你专注于完成工作，大量的工具和实用程序可以为你的测试工作提供帮助。\n\
  \n## 击中关键测试区域\n\n当你进行发布前的测试过程时，你的重点应该比仅仅调试应用程序中的错误要宽泛一些。虽然一般的应用程序稳定性很重要，但你应该考虑应用程序的其他几个关键方面：\n\
  \n*   `UI 线程性能`是导致用户不满意的首要祸首。在测试应用程序时，严格检查以确保你在 UI 线程上执行尽可能少的操作。对于新的 Android 开发者来说，这是一个常见的错误。UI\
  \ 线程往往过度工作，因为除非开发者专门处理，否则应用程序中的几乎每个过程都运行在 UI 线程上。审查最终产品是一个好主意，确保你在适当的地方使用 UI 线程，并在其他地方使用后台线程。过度使用\
  \ UI 线程的陷阱在第 12 章中有更深入的讨论。\n*   `屏幕方向变化`会对你的布局和设计产生奇怪的影响。因此，在横屏（Landscape）和竖屏（Portrait）模式下测试应用程序的每个视图是一个极好的主意。令人惊讶的是，有多少开发者会忽略这些项目。此外，如果你正在进行任何屏幕动画或任何计算屏幕尺寸的操作，请检测方向变化并相应更新任何计算。\n\
  *   Android 设备上的不同设备设置会导致你的应用程序产生意想不到的结果。事实上，在某些情况下，设备设置可能导致应用程序无法使用。了解你的应用程序在各种设置下的行为。特别是，务必尝试以下设置的不同值：\n\
  \n\n\n\n\n- **本地化**：你的应用程序在不同的语言和区域设置下表现如何？你正在通过这种方式支持预期的用户群体吗？你是否为每个资源都提供了默认选项？\n\
  - **输入法（键盘）**：你的系统在支持不同键盘类型时运行正常吗？如果键盘不可用怎么办？编辑文本后键盘会消失吗？键盘是辅助你的应用程序而不是阻塞输入字段？你是否应该将任何特殊键或键盘选项作为输入法的一部分包含？\n\
  - **不同的屏幕尺寸和密度**：这与其说是设备设置，不如说是设备的一个方面；然而，将其视为一种设置并在设备上测试不同的值是一个好主意。应用程序的资源是否反映了正确的密度级别？你的布局流在不同的屏幕尺寸下运行正常吗？\n\
  - **设备公民 (Device citizenship)**：设备公民是开发者经常错过重要测试机会的另一个领域。设备公民的困难之处在于它是一个广泛类别，因为它指的是你的设备与\
  \ `Android OS` 或设备上运行的其他应用程序之间的集成。幸运的是，你可以遵循成长过程中可能听过的几个基本规则：\n    - **物惜天荒 (Waste\
  \ not, want not)**：内存是移动设备的关键资源，因为它是一个许多不同应用程序都在竞争的稀缺资源。在典型的应用程序编程中，你可以变得有点懒惰，因为典型\
  \ PC 越越快的硬件为你编写次优代码提供了巨大的缓冲区。目前，移动世界是另一回事。因此，请专注于尽可能少地使用内存，且持续时间尽可能短。\n    此外，如果内存是关键资源，那么设备的电池电量也紧随其后。注意你的应用程序对整体电池寿命的影响。务必高效地使用\
  \ `GPS` 等系统资源。最后，如果你正在编写任何类型的服务，请花时间使用电池分析程序来了解你的服务随时间推移对总功耗的影响。过度耗电是许多用户的另一个痛点，将迅速导致你的应用程序从他们的设备中被移除。\n\
  \    - **事了善终 (Clean up after yourself)**：运行进程时，请花时间充分处理应用程序不再拥有焦点的情况。如果应用程序不再处于前台，没有理由维持动画。通过使用生命周期中正确的事件，你可以确保应用运行得更顺畅。\n\
  \    此外，在使用如 `camera` 等系统设备时要小心。在不使用它们时，尽快释放它们为其他应用程序释放资源。这是与其他应用程序保持良好公民关系的关键特征，因为通过不智地消耗系统资源，可能会影响系统中其他应用程序的性能。\n\
  \    清理另一个重要部分是在应用程序关闭或崩溃之前处理任何未保存的用户数据。无论你的应用程序是在后台运行了足够久可以被回收，还是你的应用程序遇到了意外错误，都请在应用程序关闭时尽力保存相关数据。这不仅可以避免用户带来麻烦，而且执行得当会非常令人印象深刻。\n\
  \    - **最后，检查你的应用程序对其他服务和资源的依赖关系**。更重要的是，检查当这些服务和资源不存在时，你的应用程序表现如何。这里是一些需要检查的内容：\n\
  \        - 你的应用程序在没有网络连接时表现如何？\n        - 如果缺少 `Bluetooth` 或 `GPS` 会怎样？\n      \
  \  - 当无法访问设备的 `camera` 时它表现如何？\n        - 你的设备如何处理不存在 `SD card` 的情况？\n\n优雅地处理这些失败是给你的应用程序用户留下良好印象的最快方法之一。相反，未能这样做可能会迅速导致负面反馈。\n\
  \n## 测试交易工具\n\n在开发 `Mono for Android` 应用程序时，你处于一个稀有的位置。你不仅可以利用 `Android/Java` 端的工具，还可以利用\
  \ `Visual Studio/.NET` 栈中发现许多工具。这让你有足够的力量以各种方式测试你的应用程序。\n\n你有很多工具集可供使用。为了尽可能引入许多工具，接下来的章节将对许多可用工具进行高级概述，以及如何在你的项目中利用它们。\n\
  \n### 单元测试\n\n在今天，如果不听过单元测试就深入进行编程工作，这已是罕见的。开发者可能对不同的单元测试程序持有不同观点，例如测试驱动开发 (`TDD`)\
  \ 或集成测试的优缺点。无论如何，单元测试都是辅助开发过程的极佳工具。尽管看起来可能已经是游戏的后期，但添加几个测试也永远不太晚。\n\n在 `Mono for\
  \ Android` 平台上进行单元测试仍然不是完全无缝的。目前没有用于 `Visual Studio` 的工具可以帮助任何类型的 UI 测试。尽管如此，请不要忘记\
  \ `Android` 的大部分内容是基于 `MVC` 模式构建的。这意味着你不应该难以将大部分逻辑隔离到独立的层或 `DLLs` 中，从而提供极佳的可测试性选项。\n\
  \n考虑到这一点，几乎任何与 `Visual Studio` 兼容（或尽管有 `Visual Studio` 也能运行）的单元测试框架都可以应用于 `Mono\
  \ for Android` 类库。此外，许多用作参数的类型都是接口。尽管你可能永远无法实现 100% 的覆盖，但在开发 `Mono for Android`\
  \ 时，单元测试是一个可行的方案。特别是，当你开始响应用户反馈、开始更新逻辑，或者在特殊情况下（如压力测试或防止 Bug 回归）时，单元测试会非常有用。\n\n\
  ### DDMS\n\nDalvik 调试监控服务器 (`DDMS`) 是由 Google 创建的专用调试工具，随 `Android SDK` 一安装。在本节提到的所有工具中，`DDMS`\
  \ 可能是最通用且实用的工具之一，用于跟踪有关运行应用程序的几乎任何信息。\n\n这个工具令人兴奋的地方在于，它通过直接连接到运行的模拟器来工作。这意味着它可以与\
  \ `Android` 和 `Mono for Android` 项目无缝衔接。此外，它不仅提供模拟器信息，还提供任何连接到计算机并以 `Debug` 模式运行的\
  \ Android 设备的信息，无论是实体手机还是平板电脑。因此，当你对应用程序进行最后的检查时，这个工具是一个极佳。\n\n在某种程度上，`DDMS` 的作用非常像\
  \ `Windows Task Manager` 或 `Linux` 上的 `activity monitor`，因为它可以提供内存分配、性能统计和其他与操作系统相关的信息。当然，这个工具的功能要多得多：\n\
  \n- `DDMS` 提供了跟踪任何给定进程堆使用情况的工具。这是获取内存堆使用快照的好地方。图 16.2 给出了第 12 章创建的 `SurfaceView`\
  \ 应用程序使用的堆统计数据。\n- `DDMS` 有一个功能可以让你跟踪对象到内存的分配。深入研究运行中的应用程序，评估你的类和线程如何为不同对象分配内存。该功能的唯一缺点是，由于\
  \ `Mono for Android` 为你“翻译”了应用程序，在 `Visual Studio` 中跟踪哪个对象是什么可能会稍微困难一点。当然，这可以通过少量的演绎推理来克服，使其成为跟踪内存消耗问题的最佳位置之一。\n\
  \n\n\n\n\n图 16.3 给出了第 12 章中使用的 `HTML5Logo_Bouncing` 应用在不同线程中使用对象的示例。\n\n- `DDMS`\
  \ 将 `LogCat` 嵌入为一个窗格。虽然该功能通过 `Visual Studio` 中的 `Android Device Logging` 屏幕提供，但它是\
  \ `DDMS` 中一个非常用的功能。与 `Visual Studio` 工具不同，嵌入的 `LogCat` 屏幕允许你切换消息详细程度、按类型（警告、调试、错误）快速过滤消息，或者简单地将选部分导出到\
  \ `.csv` 文件。图 16.4 显示了 `LogCat` 视图。\n\n图 16.2\n\n![16.2](img/c16f002.jpg)\n\n图 16.3\n\
  \n![16.3](img/c16f003.jpg)\n\n图 16.4\n\n![16.4](img/c16f004.jpg)\n\n除了这些关键特性外，`DDMS`\
  \ 还提供了许多出色的实用程序：伪造位置、通话和短信；调整设备状态（如网络连接、延迟和速度）；以及各种较小的任务，如截图、方法分析和提供性能统计的图形化布局。图\
  \ 16.5 显示了模拟器的运行内存占用情况。\n\n图 16.5\n\n![16.5](img/c16f005.jpg)\n\n当你考虑到 `DDMS` 的巨大潜力时，这个工具值得你花时间去研究。当你试图对应用程序的性能进行最后的润色时，它可以证明是至关重要的。\n\
  \n### 模拟器\n\n尽管你现在可能已经熟悉了模拟器工具，但它还有许多其他选项可以利用它们来测试各种手机状况。除了测试多种系统设置（如本地化）外，模拟器还有了一系列命令行开关，可以以不同的状态启动它。这些选项非常多样，从提供不同的屏幕密度到模拟不同的手机负载场景。表\
  \ 16.1 是一些可用手机配置开关的短列表。\n\n表 16.1 常用模拟器命令行开关\n\n| 选项名称 |  |\n| :--- | :--- |\n|\
  \ `-dpi/-scale` | 按照所需的缩放因子缩放模拟器屏幕大小。 |\n| `-netspeed` | 允许开发者指定目标网络速度设置，以模拟低速与高速连接。\
  \ |\n| `-netdelay` | 指定设备上的网络延迟。 |\n| `-cpu-delay` | 通过在模拟器请求上应用抽象延迟因子，可以模拟压力状态下的\
  \ CPU。 |\n\n这些只是模拟器可用的几个典型命令行开关。你可以在 `http://developer.android.com/guide/developing/tools/emulator.html`\
  \ 查看更详尽的列表。\n\n除了命令行开关外，模拟器还有各种可以用于测试的配置设置，例如添加/移除 SD 卡的访问。当你使用模拟器进行测试时，生成一组不同的模拟器镜像来代表不同的状态通常会有帮助。虽然维护起来有点麻烦，但它是确保你的应用程序在某些条件下行为一致的一种极佳方法。\n\
  \n最后，`DDMS` 和模拟器的测试能力在某些情况下是交叉的。通常，`DDMS` 是处理单个进程并测试其某一个方面的更快工具。模拟器提供了一种在整个环境中测试许多场景的方法，并具有保存测试场景的附加功能。\n\
  \n![note](img/note.gif)记住，模拟器和 `DDMS` 并不能取代在物理设备上测试应用程序的需求。使用这些选项进行初始测试，以及在你无法物理访问某种手机类型或重建手机状况的场景中使用它们。\n\
  \n***\n\n### Traceviews\n\n`Android SDK` 提供的另一个优秀工具是 `Traceview`，它允许你图形化地查看来自 Android\
  \ 设备的跟踪和执行数据。它是通过根据每个运行线程记录的调试消息的时间戳构建应用程序时间轴来实现的。在操作时间轴窗口时，你可以切分部分时间进行缩放并深度检查。这些切片精确到毫秒级，让你能够清晰地看到应用程序的每一步是如何运行的。图\
  \ 16.6 显示了 `Traceview` 工具的时间轴视图。\n\n图 16.6\n\n![16.6](img/c16f006.jpg)\n\n此图显示了几个运行线程的时间轴示例。该应用程序使用切换到后台线程（`Thread-12`）来执行重处理，然后将更新推送到主线程。注意你可以轻松地看到每个线程之间交错的执行，以及在每个“跳转”花费的总时间。\n\
  \n除了提供时间轴信息外，你还可以使用 `Traceview` 分析任何给定过程的开销和时间跨度。这可以通过选择时间轴上的某一点并点击该区域轻松实现。`Traceview`\
  \ 随后会在分析窗口中填充所选方法所花费的所有时间的摘要。此外，你可以在分析窗口中上下移动，了解每个单独方法或一组方法执行所需的时间。图 16.7 显示了一个绘制函数的分析图。\n\
  \n![16.7](img/c16f007.jpg)\n\n\n\n\nExerciser Monkey（压力测试猴），或简称 `Monkey`，是一个在模拟器上运行的应用程序，与你正在开发的应用程序同步运行。使用它的许多配置选项，`Monkey`\
  \ 可用于对应用程序进行压力测试，在 Android 设备上生成一系列点击、按下和事件。这些事件中的每一个都会以半随机的模式发生。\n\n`Monkey` 的强大之处在于它可以使用\
  \ `adb` 可执行文件内部的基本命令来执行。除了指定要生成的事件数量外，你还可以在其他三个领域配置 `Monkey`：\n\n*   限制条件（Constraints）：在命令行参数中，你可以限制\
  \ `Monkey` 仅在目标包上生成事件。此外，随机事件也可以锁定在某些特定类型的活动（activities）上。\n*   调试（Debugging）：你可以指定\
  \ `Monkey` 如何响应大量的事件、异常或超时。通常情况下，当 `Monkey` 遇到超时或应用程序错误等问题时，它会停止运行。通过命令行参数，你可以精细调整\
  \ `Monkey` 可以忽略哪些类型的情况。\n*   事件（Events）：此区域代表 `Monkey` 生成的事件类型，例如触摸事件、运动事件、轨迹球事件、导航事件、应用程序切换以及其他一些类型。使用命令行参数，你可以锁定这些随机事件的频率，以针对不同的压力场景类型。\n\
  \n不用说，`Monkey` 是对应用程序进行压力测试的极佳方法，可以确保你已充分处理了许多触摸场景和事件。它不仅是一个实手的工具，而且易于使用。在模拟器运行时，打开命令行窗口并导航到你的\
  \ Android SDK 默认安装目录。找到位于 `platform-tools` 目录下的 `adb` 可执行文件。一旦到达那里，就可以使用以下命令开始基础压力测试：\n\
  \n```\nadb shell monkey -v 100\n```\n\n使用此命令，`Monkey` 会在 Android 设备上安装的每个包上执行 100\
  \ 次随机事件。正如你所想象的，这可能是一个非常长的过程。然而，你可以使用 `Monkey` 的 `-p` 参数单独指定某个包。\n\n`Monkey` 是一个极的压力测试工具。花时间更多地了解它是值得的。有关更多信息以及所有可能的开关的完整列表，请参阅\
  \ Android 文档 `http://developer.android.com/guide/developing/tools/monkey.html`。\n\
  \n## 通过 Monkeyrunner 进行 UI 测试\n\n除了对你的应用程序运行压力测试外，你可能会发现你想要按照预设模式指定一系列点击和事件。虽然 `Monkey`\
  \ 工具可以生成一系列伪随机事件，但它无法执行任何脚本化任务。对于此类情况，你可以使用另一个工具 `Monkeyrunner`。\n\n`Monkeyrunner`\
  \ 是一个可以与运行中的 Android 模拟器交互的 API 接口。通过此 API，`Monkeyrunner` 可以完成许多不同的任务，例如部署应用程序、引发各种\
  \ UI/触摸事件、截屏等。使用此工具，你可以创建一套完整的 UI 测试功能，并以以单元测试风格的方法进行重复执行。\n\nC# 开发者在使用 `Monkeyrunner`\
  \ 时面临的最大挑战之一是，它的指令说明是使用 `Python` 编写的。因此，此选项并不适合初级开发者，但在你的构建中理解并使用它它是非常值得你花时间的。有关关于\
  \ `Monkeyrunner` 的更多信息，请访问 Android 文档 `http://developer.android.com/guide/developing/tools/monkeyrunner_concepts.html`。\n\
  \n尽管本节描述的每个工具都可以在并且应该在主开发过程中使用，但它们也为在发布前的场景下检查应用程序的整体健康状况和性能提供了一种很好的方法。此外，它们还可以用于快速找出许多困难的应用程序问题，例如内存泄漏、线程错误和重量级方法。\n\
  \n## 在测试过程中让同事和用户参与\n\n一旦你确定你的应用程序可以通过你自设的严苛测试，那么将部分测试负担分给你的同事或任何愿意使用设备的用户通常是一个好主意。这可以通过找出任何意外错误来极大地增加你应用程序的稳定性。这也是收集一些初始用户反馈并进行最后修改的绝佳方法。\n\
  \n在为你的应用程序选择 Beta 用户时，考虑几个不同的因素是重要的。虽然让好朋友或亲戚审查你的应用程序很好，但你面临着收到过度正面反馈或实际上没有针对目标受众进行测试的风险。以下列表为选择正确的\
  \ Beta 测试者提供了一些建议：\n\n*   考虑同时包含高级用户和普通用户。用户用户通常为了更大的功能多花步骤，但对常见错误的容忍度通常低得多。相反，普通用户通常欣赏直接、直观的界面，有时对流程中偶尔的小故障并不那么厌烦。\n\
  *   考虑你的 Beta 用户将使用的设备类型。在尽可能不同的硬件设备上测试你的应用程序至关重要。通过利用你的 Beta 用户群，你可以在不对比硬件进行巨额资金投入的情况下满足你的测试需求。\n\
  *   选择提供平衡反馈的人。极度挑剔或可能只提供正面反馈的人增加的价值很小。\n*   提供一些如何提供反馈的初始提示。大多数人不是提供反馈的专家。“这太棒了”或“这太糟糕了”并不是有价值的反馈。鼓励他们详细说明让他们产生了这种感觉，以及他们认为你的应用程序如何可以更好。\n\
  *   提供整洁、易于使用的反馈渠道。强制你的 Beta 用户填写长表单或通过多个屏幕登录将导致反馈减少。尊重他们的时间和精力。\n*   在反馈迭代中，要求对应用程序的某个特定方面进行关注是可以的。但是，要避免让用户过载关注问题；过度这样做会损害反馈的价值。\n\
  \n## 应用程序版本\n\n\n\n\n准备发布你的应用程序的第一步是为其分配适当的应用程序名称、包名、版本号和版本名称。这些值对你的应用程序至关重要，因为\
  \ Android 操作系统使用这些值来识别你的应用程序、跟踪任何依赖项，并确定 Android 市场（Android Market）是否有更高版本的可用。具体来说，版本控制是发布过程中的一个关键步骤，原因如下：\n\
  \n*   如果你打算在应用程序发布到 Android 市场后对其进行升级或维护，那么版本控制将非常有用。它充当简单且直观的提示，用于分配更新日志并告诉用户哪个版本包含哪些功能。\n\
  *   Android 使用你应用程序的版本号来自动通知用户你的应用程序可用更新。当然，这只会在用户在 Android 市场中检查更新时才会发生。任何其他更新通知或版本限制必须由开发者在应用程序内部处理。\n\
  *   版本被用于协助跟踪应用程序之间的依赖关系和兼容性。特别是，如果你的应用程序是一系列应用程序的一部分，可以利用应用程序的版本号来确保所有部分都使用正确的构建。\n\
  \n在 Android 中，应用程序的版本可以通过两个值表示。第一个值是 `Version Name`（版本名称）。将此字符串值视为典型的版本信息列表，使用 `MajorVersion.MinorVersion.PointVersion`\
  \ 模式。Android 操作系统在使用此值用于信息目的以外的任何地方。它为你的应用程序用户和其他跟踪应用程序更新的其他服务提供了视觉线索。\n\nAndroid\
  \ 用于版本控制的另一个值是 `Version Code`（版本代码）。Android 操作系统使用这个仅限整数的数字来判断应用程序的一个版本是否比另一个新。假设你的应用程序初始发布版本为\
  \ 1，则 Android 认为任何版本代码大于 1 的应用程序都为一次更新。由于这被视为一个“内部”值，因此此版本对用户是不可见的。\n\n从某种意义上说，Android\
  \ 中的版本控制系统是一种折中，允许开发者在定义自己的版本控制标准和风格的同时，能够保持一种简单、快速的方法来以程序化的方式确定升级和降级信息。\n\n在你的应用程序中添加版本信息是一项基础任务。在典型的\
  \ Android 开发中，你可以通过手动编辑 `Android Manifest` 文件来指定应用程序的版本号，该文件类似于 ASP.NET 编程中的 `web.config`\
  \ 文件。在 Mono for Android 中，开发者通过在应用程序的 `Properties` 窗口中添加 `Android Manifest` 菜单选项简化了这一过程。\n\
  \n在你的应用程序中，转到 `Properties` 窗口并选择 `Android Manifest` 选项卡。在此屏幕中，你可以编辑版本号的相应字段，以及其他几个值，如图\
  \ 16.8 所示。\n\n![note](img/note.gif)细心的读者可能注意到，图 16.8 显示 Visual Studio 属性中的字段名称为“Version\
  \ Name”而不是“Version Code”。这并不是错误。虽然 `Android Manifest` 期望一个 `Version Code` 元素，但 Visual\
  \ Studio 工具已将其重命名为更通用的术语 `Version Name`。\n\n* *\n\nFigure 16.8\n\n![16.8](img/c16f008.jpg)\n\
  \n## 创建最终构建\n\n准备你的应用程序的下一步是在 Visual Studio 中创建最终构建。与 Visual Studio 中的大多数应用程序一样，至少有两种两种不同类型的构建配置：`Debug`\
  \ 和 `Release`。在此之前，你很可能一直在 `Debug` 模式配置下运行。\n\n`Debug` 模式配置非常重要，因为它是一种配置设置，它倾向于为了测试而进行构建和调试应用程序的过程，但以牺牲优化或构建大小为代价。除了任何\
  \ Visual Studio 应用程序中常见的典型调试优势外，还有几个方面专门适用于 Mono for Android：\n\n*   `Debug` 构建使用\
  \ `Mono for Android` 共享运行时，而不是以单一包的形式存在于开发设备上。这意味着当应用程序首次部署到调试设备时，会安装两个应用程序：你正在编写的应用程序以及\
  \ `Mono for Android` 运行时。该运行时包含了 `Mono for Android` 的所有库。因此，在第一次发布时，它是一个相当大的安装。但对于后续的应用程序推送，它会小得多且更快，因为\
  \ `Mono for Android` 运行时只需要部署一次。\n*   在 `Debug` 配置下部署的应用程序将由 `Mono for Android`\
  \ 运行时自动签名。Android 系统要求所有应用程序都必须使用属于应用程序开发者的私钥进行数字签名。在调试应用程序的情况下，会生成一个调试密钥并与你的应用程序关联。\n\
  \n当应用程序准备好部署时，使用 `Release` 配置。在 Visual Studio 的文中，此配置针对最佳性能和大小进行了优化。此外，`Mono for\
  \ Android` 不再使用开发者密钥自动对你的构建进行签名。最后，运行时从 `Mono for Android` 框架中选择所需的包，将它们与你的应用程序打包，并创建一个以\
  \ `.apk` 文件形式存在的单一发布版本。\n\n考虑到这些，你可以开始创建最终构建的过程了。首先，将 Visual Studio 中的配置模式更改为 `Release`\
  \ 而不是 `Debug`。通常，这可以通过更改 Visual Studio 标准工具栏内相应下拉列表的值来实现。图 16.9 显示了这一操作。\n\nFigure\
  \ 16.9\n\n![16.9](img/c16f009.jpg)\n\n或者，你也可以右键单击 `Solution Explorer` 窗口中的解决方案，选择\
  \ `Properties` 来更改你的配置设置。\n\n当你将 Mono for Android 项目从 `Debug` 切换到 `Release` 时，应用程序的\
  \ `Mono Android Options` 会同步更新为不再使用共享运行时。要检查此过程（或删除此默认设置），请转到应用程序的 `Properties`\
  \ ⇒ `Mono Android Options`，并确保 `Use Shared Runtime` 选项为空，如图 16.10 所示。\n\nFigure\
  \ 16.10\n\n![16.10](img/c16f010.jpg)\n\n你的应用程序现在可以构建了。构建过程的最后一步是在 `Release` 配置下再次测试你的应用程序。\n\
  \n![note](img/note.gif)尽管你已经完全测试了应用程序，但移动到 Release 模式对你的底层应用程序发生了巨大的变化。因此，请再次部署一次你的应用程序，并确保其运行符合预期。\n\
  \n* *\n\n## 为你的应用程序签名\n\n有了最终构建，你就可以开始对你的应用程序进行签名。这样做的目的有两个：\n\n*   首先，它确保了应用程序在部署期间的安全。这很重要，因为签名的应用程序包含了验证发布者身份以及通过校验和验证下载的应用程序与实际应用程序匹配的方法。\n\
  *   第二个目的是 Google 使用签名机制来唯一标识应用程序的开发者（或开发团队），并确定他们是否有权限更新 Android 市场上的应用程序。\n\n\n\
  \n\n要对应用程序进行签名，你需要生成一个证书。该证书相当于应用程序的身份标识或许可证。在许多情况下，需要证书颁发机构来创建证书。证书颁发机构可能是一件好事；但它们也可能相当昂贵。因此，对于预算已经紧张的\
  \ Android 开发者来说，它们可能会成为一项额外的、不必要的支出。幸运的是，在 Android 中，Google 允许开发者生成自己的自签名证书。这不仅为你节省了费用，还让你完全有权根据自己的意愿管理应用程序的标识（ID）。\n\
  \n## 创建私钥\n\n自签名应用程序从生成私钥开始。私钥是你操作已签名应用程序的凭据。因此，保持你的私钥安全和稳固至关重要。由于私钥用于生成证书，这两个术语通常互换使用。\n\
  \n关于私钥和证书，有以下几点需要注意：\n\n*   私钥是生成应用程序证书的机制。这使得私钥类似于身份凭据或密码。然而，与密码不同，你无法“重置”私钥。如果丢失了密钥，你必须创建一个新的，这反迫使你创建一个新的证书。\n\
  *   证书（因此你的私钥）是你与客户的 Android 设备之间的某种约定。在发布更新时，设备必须从更新软件处接收匹配的证书。如果你不得不重新生成证书（由于丢失密钥或其他原因），应用程序将无法更新，而是作为一个新实例进行安装。\n\
  *   你的证书和密钥代表了你作为开发者或开发小组的身份。你作为开发者的信誉与此密钥绑定，这意味着如果它被盗窃并被恶意使用，也将是在你的凭据下进行的。\n* \
  \  证书和私钥可以用于多个应用程序。这也是两个应用程序可以在同一个系统进程中运行的唯一手段。这为你的应用程序增加了大量的模块化潜力，因为你可以将多个应用程序部分在单个证书下打包并分组。\n\
  *   你的私钥有效期应为 25 年或更长。目前，Android 市场期望应用程序的密钥有效期至 2033 年。\n\n为 Mono for Android 应用程序生成私钥非常简单。在随\
  \ Android SDK 一起安装的 Java SDK 中，有一个名为 `keytool` 的工具。使用这个命令行工具，你可以快速为你的应用程序创建一个密钥库（keystore）。密钥库基本上是一个存储私钥的数据库。表\
  \ 16.2 列出了生成密钥库时可以使用的不同开关选项。\n\n### 表 16.2 Keytool 命令行选项\n\n| 命令 | 说明 |\n| :---\
  \ | :--- |\n| `-genkey` | 命令工具生成新的公钥和私钥。 |\n| `-v` | 启用 `keytool` 的详细输出。 |\n| `-alias`\
  \ | 为生成的密钥指定一个最多八个字符的别名。 |\n| `-keyalg` | 允许开发者选择用于私钥的加密算法。目前支持 RSA 和 DSA。 |\n|\
  \ `-dname` | 描述创建此密钥者的区分名称（distinguished name）。在大多数情况下，这是你的名字或你所在公司的名称。如果指定了此值，它将被用于自签名证书的发行者（issuer）和主体（subject）字段。\
  \ |\n| `-keypass` | 允许你指定密钥密码。然而，如果不提供，`keytool` 会提示你输入密码。通常，等待提示是更安全的方法。 |\n| `-validity`\
  \ | 密钥有效的天数。推荐长度为 25 年或约 10,000 天。 |\n| `-keystore` | 用于包含密钥的密钥库名称。 |\n| `-storepass`\
  \ | 密钥库的密码。再次，如果没有添加此密码，`keytool` 会提示你提供。 |\n\n使用 `keytool`，你可以为你的应用程序生成私钥。打开命令窗口，导航到系统上\
  \ JDK 的安装目录，找到 `keytool.exe` 所在的目录。Windows 7 64 位机器上的默认路径为：\n\n```\nC:\\Program\
  \ Files (x86)\\Java\\jdk<version>\\bin\\\n```\n\n到达该后，使用 `keytool.exe` 和表 16.2 中列出的命令行参数生成你的私钥。以下是生成私钥的示例命令：\n\
  \n```\nkeytool -genkey -v -keystore <keystore-name>.keystore -alias <key-name> -keyalg\
  \ RSA -keysize 2048 -validity 10000\n```\n\n在你执行此命令时，会遇到一系列问题，要求提供有关此密钥所有者的身份信息。在回答所有问题后，你应该就拥有了自己的私钥和密钥库，如图\
  \ 16.11 所示。\n\n## 创建自签名证书\n\n创建私钥后，你就可以对应用程序进行签名。使用 JDK 包含的工具，你可以对应用程序进行签名。要完成此过程，你需要准备三样：\n\
  \n*   未签名的应用程序包。当你查看目录时，会发现两个版本，其中一个带有 `-Signed` 后缀。该版本用于本地部署。\n*   生成的私钥和密钥库。这些将用于用于创建自签名证书。\n\
  *   位于 JDK 中的 `jarsigner` 工具。配合 `keytool`，使用 `jarsigner` 将未签名的 `.apk` 和私钥组合成签名包。在\
  \ Windows 7 中，路径位于 `C:\\Program Files\\Java\\jdk<version>\\bin\\`。\n\n使用 `jarsigner`\
  \ 工具，只需通过命令行调用它并提供相应的参数。以下是使用 `jarsigner` 工具的示例：\n\n```\njarsigner -verbose -keystore\
  \ <keystore-name>.keystore <package.apk> <key-name>\n```\n\n运行此命令后，系统会提示输入密钥库的目标密码。你可以使用\
  \ `jarsigner` 工具的 `-verify` 验证应用程序签名是否成功：\n\n```\njarsigner -verify <package.apk>\n\
  ```\n\n恭喜。你现在已将自签名证书应用到应用程序中。\n\n## 对齐最终包\n\n执行完前面的步骤后，你获得了一个完全签名的包。然而，在过程完成之前还需要最后一步。Android\
  \ SDK 中有一个名为 `zipalign` 的工具。它是 Google 提供的用于确保你的应用程序尽可能流畅运行的简单工具。虽然从技术上你可以跳过这一步来部署应用程序，除非你有正当理由，否则这样做并不是一个好主意。\n\
  \n\n\n\n# Zipalign\n\n此工具的目的是对包内的未压缩字节进行对齐，以便更高效地读取和处理它们。在大多数情况下，理解 `zipalign` 执行此操作的过程并不是必须的——只要知道最终结果是你的应用程序在运行时会消耗更少的设备内存（RAM）。\n\
  \n你可以在 Android SDK 默认安装路径下的 `tools` 目录下找到 `zipalign`。运行它时，你基本上需要提供当前项目的名称和输出项目的名称。以下是\
  \ `zipalign` 工具命令的示例：\n\n```\nzipalign -v 4 <current unaligned project>.apk<output\
  \ project name>.apk\n```\n\n![note](img/note.gif)\n\n观察 `zipalign` 工具的命令，你会发现在详细模式开关（verbose\
  \ switch）之后有一个 `4`。在使用 `zipalign` 时，请始终包含该 `4`，永远不要包含其他数字。该命令指示了 `zipalign` 工具优化代码的字节边界。对于任何\
  \ Android 应用，内存地址大小均为 16 位，即 4 字节。如果你将代码中的适当项目对齐到 4 字节边界，Android 就可以使用 `mmap()`\
  \ 函数直接访问它们。这减少了运行你的应用程序所需的总内存。你可以通过以下链接了解更多关于 `zipalign`、`mmap` 和内存地址的信息：\n\n* \
  \  zipalign: [`developer.android.com/guide/developing/tools/zipalign.html`](http://developer.android.com/guide/developing/tools/zipalign.html)\n\
  *   mmap: [`en.wikipedia.org/wiki/Mmap`](http://en.wikipedia.org/wiki/Mmap)\n* \
  \  Memory addresses: [`en.wikipedia.org/wiki/Memory_address`](http://en.wikipedia.org/wiki/Memory_address)\n\
  \n***\n\n通过最后一步，你的应用程序现在已经签名、优化，并准备好发布到 Android Market！\n\n## 上传到 Android Market\n\
  \n将应用程序发布到 Android Market 通常是一个很快的过程。要发布，你和你的应用程序需要满足一些要求：\n\n*   你必须注册成为 Android\
  \ 开发者。这需要花费 25 美元，只需几分钟。要注册，请访问 [`market.android.com/publish`](http://market.android.com/publish)。\n\
  *   你需要一个最终构建、已签名且已对齐的应用程序。具体来说，你需要确保你的应用程序的许可证在 2033 年之前不会过期。\n*   你必须对应用程序进行适当的版本控制。\n\
  *   你的应用程序必须在它的定义中同时指定标签（label）和图标（icon）。\n\n假设这些内容都已经涵盖，你现在可以发布你的应用程序了！访问发布网站 [`market.android.com`](http://market.android.com)\
  \ 并使用你在注册开发者账户时指定的开发者凭据登录。\n\n登录后，你可以通过选择页面右下角的 `Upload Application`（上传应用程序）按钮来选择你的应用程序，如图\
  \ 16.13](#9781118235812c16.xhtml_c16_fig_0013）所示。\n\n图 16.13\n\n![16.13](img/c16f013.jpg)\n\
  \n在下一个屏幕上，添加关于你应用程序的相关信息。首先，你被要求上传应用程序的草稿版本。“草稿”（draft）这个术语有点困惑。基本上，这是一个阶段上传，直到你完成所有应用程序信息并选择页面底部的\
  \ `Publish`（发布）按钮。\n\n上传 `.apk` 文件后，尽可能完整和真实地填写表单的其他部分（参见图 16.14）。这些信息主要涉及当应用程序列在\
  \ Android Market 上时用户将看到的内容。花时间包含充分的截图、描述和其他信息，因为它们将是潜在用户看到你应用程序的首要。\n\n图 16.14\n\
  \n![16.14](img/c16f014.jpg)\n\n填写完必要信息后，选择 `Publish` 按钮。恭喜你！你现在已将应用程序发布到 Android\
  \ Market！\n\n# 总结\n\n部署你的应用程序对任何开发者来说都是一个巨大的里程碑。这是开发者从写下第一行代码起就努力的目标。在朝着这一目标努力的过程中，重要的是不要操之过急，因为发布过程中的许多不同步骤仍然需要你的充分考虑。\n\
  \n测试是发布过程中到为止最重要的步骤。缺乏测试可能会导致你的应用程序无法在 Android Market 中成功，从而浪费你的开发努力。幸运的是，有许多工具可以帮助你，从性能监控到\
  \ UI 测试再到应用程序测试。最后，使用一组 Beta 测试员是评估你的产品整体易用性的极佳方法，同时可以找出你可能忽略的最后几个 bug。\n\n在你的应用程序通过严格的测试流程后，它可以快速高效且安全地部署到\
  \ Android Market。\n\n# 第 17 章：Android 平板电脑\n\n### 本章包含内容\n\n*   设计平板电脑用户界面 (UI)\n\
  *   使用操作栏（action bar）有效利用额外空间\n*   使用碎片（fragments）划分屏幕并有效利用空间\n\nAndroid 3.0 (Honeycomb)\
  \ 自 2011 年以来可用。遗憾的是，基于 Android 3.x 的初始平板电脑并不受市场欢迎。Android 4.0 (Ice Cream Sandwich\
  \ (ICS)) 将手机和平板的特性以类似的方式整合在了一起。\n\n# 查看 Android 平板市场\n\n平板电脑市场经历了爆炸式增长。平板电脑在 Windows\
  \ 生态系统中已存在多年。我记得 90 年代初的笔 Windows。在 2000 年初，微软试图重新激活平板设备。遗憾的是，这些努力在少数几个领域取得了有限成功，从未获得巨大的消费者需求。这主要是由于硬件的笨拙、尺寸大且重，以及手笔容易丢失。\n\
  \n2010 年，Apple 发布了 iPad。这款设备——凭借与 iTunes、各种书籍零售商的结合、尺寸和重量——被被市场认可。消费者买不够。Apple 商店排队。在线下单需要几周时间。\n\
  \niPad 有许多优点，包括：\n\n*   **尺寸**：iPad 比笔记本电脑小，但比手机大，适合休闲使用。\n*   **重量**：iPad 方便随身携带或参加会议，无需将其及其周边设备放入包中。\n\
  *   **预置应用**：由于其操作系统基于 Apple iPhone 操作系统，iPad 提供了大量的预置应用。\n*   **触摸**：虽然可以使用手笔使用\
  \ iPad，但手指是默认的输入机制。我知道多年来我在各种平板电脑上丢失的四个手笔设备使得触摸式平板电脑非常有吸引力。\n\nAndroid 开发者开始进入这个市场，将\
  \ Android 引入平板世界。2011 年初，第一款 Android 平板电脑上市，即 Motorola Xoom。Xoom 搭载了 Android 3.0\
  \ (Honeycomb)。Honeycomb 是针对平板电脑使用优化的 Android 操作系统的代号。Android 3.0 是 Android 4.0 的平板专用版本，设备制造商未提供手机版本。\n\
  \n\n\n\nAndroid 3.0 已经过多次迭代，目前正在让位于 Android 的下一次重大更新，称为冰淇淋明治（Ice Cream Sandwich，ICS），也称为\
  \ Android 4.0 版本。Android 4.0 是为手机和平板电脑设计的 Android 版本，并为这些设备提供了通用的 API。从历史来看，Android\
  \ 4.0 在现有设备上可用可能还需要很一段时间，而且许多现有设备将不会升级到 Android 4.0。然而，这并不会阻止我们查看 Android 4.0 的一些重要功能，并为运行\
  \ Android 3.0 和 Android 4.0 的 Android 平板电脑创建应用程序。\n\n在构建针对 Android 平板电脑的应用程序时，有一点警告：许多平板电脑的外观尺寸在\
  \ 7 到 10 英寸之间。这些平板电脑看起来像平板电脑；然而，它们运行的操作系统是 Android 2.x。尽管这些设备在物理上符合平板电脑的规格，但它们的操作系统并不是\
  \ Android 3.0 或 Android 4.0。因此，你的 Android 3.0/4.0 应用程序无法在这些设备上运行。在应用程序开发过程中请注意此点。\n\
  \n# 设计平板电脑 UI\n\n在深入代码之前，考虑平板电脑应用程序成功的要素是关重要的。如果你考虑 Android 2.x 或手机应用程序，UI 是一系列活动（activities），用户根据需要导航通过每个单独的活动来完成工作。用户一次只能使用一个活动。用户在活动\
  \ A 中执行工作，转到活动 B，选择返回键回到活动 A，可能会进入活动 C，依此类推，直到他们的工作完成（请参见 图 17.1）。\n\n图 17.1\n\n\
  ![17.1](img/c17f001.jpg)\n\n如果用户需要从一个活动屏幕记住另一个屏幕的某些内容，这可能会让他们感到有些不适。在考虑你的平板电脑 UI\
  \ 时，请考虑如何将信息分组，以便用户能够顺利操作。例如，假设你有一个同时支持多个用户 ID 的 Twitter 客户端。在应用程序允许用户发布推文的部分，向他们显示这条推文将发送到哪个\
  \ Twitter ID 可能很有帮助。如果用户正在回复其他用户，让他们看到他们正在回复的内容以及他们登录的身份可能也会帮助。例如，UI 流程可以像图 17.2\
  \ 所示的那样。\n\n图 17.2\n\n![17.2](img/c17f002.jpg)\n\n在这个示例中，回复是针对 @migueldeicaza 的陈述。你可以看到你当前登录的身份，因此你知道这条内容将发布到哪个账户，并且知道你确切正在回复什么。这将为用户在编写回复时提供更多上下文。\n\
  \n# 使用操作栏（Action Bar）\n\n除了屏幕的不同部分外，你还需要考虑用户如何在应用程序内导航。Android 2.x 手机应用程序使用菜单系统，允许用户在应用程序内进行操作和导航。另一方面，Android\
  \ 3.0 和 Android 4.0 平板电脑应用程序提供了更多的屏幕空间供使用。Mac OS X 和 Windows 桌面应用程序也有对齐在屏幕顶部的菜单系统。这在\
  \ Windows 上的运行情况如图 17.3 所示。\n\n图 17.3\n\n![17.3](img/c17f003.jpg)\n\n那么，你如何在 Android\
  \ 3.0 和 Android 4.0 中实现这种导航呢？幸运的是，有一个此类功能的设施，被称为操作栏（action bar）。操作栏是一种用于活动的组件，取代了出现在屏幕顶部的\
  \ Android 标题栏。默认情况下，应用程序图标出现在屏幕左侧，随后是活动标题。最后，可用项目显示在操作栏内的选项菜单中。这些项目被称为操作项（action\
  \ items）。操作项提供了对重要用户操作的直接访问。未显示为操作项的菜单项被放在溢出菜单中，溢出菜单以下拉列表的形式显示在操作栏中。操作栏的其他功能还包括提供在碎片（fragments）之间导航的标签页、提供下拉列表导航支持以及提供操作视图（action\
  \ views）。\n\n操作栏默认包含在所有针对 SDK 级别 11 的活动中。具体来说，操作栏包含在所有使用“全息”（holographic）主题的 Android\
  \ 活动中。该主题包含任何针对 Android 3.0 的应用程序中。\n\n注意，当 Android 应用程序的 `android:minSdkVersion`\
  \ 或 `android:targetSdkVersion` 属性设置为 11 或更高时，它被设置为目标针对特定的 SDK 版本。这可以通过 `AndroidManifest.xml`\
  \ 文件进行更新，如图 17.4 所示。\n\n图 17.4\n\n![17.4](img/c17f004.jpg)\n\n## 操作栏\n\n你可以通过多种方法移除操作栏：\n\
  \n*   使用 `Theme.Holo.NoActionBar` Android 活动。\n*   如果应用程序使用了自定义 Android 主题，将 `android:windowActionBar`\
  \ 设置为 `false`。\n*   调用操作栏的 `.Hide()` 方法。`.Hide()` 方法是 `.Show()` 方法的配套。你可以使用 `.Show()`\
  \ 方法显示已隐藏的操作栏。如果操作栏被隐藏，Android 操作系统将更新活动，以填充整个屏幕空间。\n\n如果你使用主题移除操作栏，操作栏将完全不可用。获取\
  \ `.ActionBar` 属性的调用将返回 `null`。\n\n## 向操作栏添加项目\n\n默认情况下，操作项是一个菜单项。正如你在第四章中学习到的，你可以通过重写\
  \ `OnCreateOptionsMenu` 中的默认操作创建菜单。当用户按下菜单键时，会调用 `OnMenuItemSelected` 方法，程序将确定选择了哪个菜单项。[列表\
  \ 17.1 显示了如何在操作栏中设置菜单项。\n\n![download](img/download.gif) 列表 17.1: 加载操作栏\n\n\n\n\n\
  \n```sharp\n[Activity(Label = \"HCExample\", MainLauncher = true, Icon = \"@drawable/icon\"\
  )]\npublic class Activity1 : Activity\n{\n    ActionBar ab;\n\n    protected override\
  \ void OnCreate(Bundle bundle)\n    {\n        base.OnCreate(bundle);\n\n      \
  \  // 从“main”布局资源设置我们的视图\n        SetContentView(Resource.Layout.Main);\n\n    \
  \    // 从布局资源中获取按钮，\n        // 并为它绑定一个事件\n        Button button = FindViewById<Button>(Resource.Id.MyButton);\n\
  \        ab = this.ActionBar;\n\n        button.Click += delegate {\n          \
  \  if (ab.IsShowing)\n            {\n                ab.Hide();\n            }\n\
  \            else\n            {\n                ab.Show();\n            }\n  \
  \      };\n    }\n\n    public override bool OnCreateOptionsMenu(IMenu menu)\n \
  \   {\n        //return base.OnCreateOptionsMenu(menu);\n        MenuInflater inflater\
  \ = new Android.Views.MenuInflater(this);\n        inflater.Inflate(Resource.Layout.menu,\
  \ menu);\n        return true;\n    }\n\n    public override bool OnOptionsItemSelected(IMenuItem\
  \ item)\n    {\n        return base.OnOptionsItemSelected(item);\n    }\n\n    public\
  \ override bool OnMenuItemSelected(int featureId, IMenuItem item)\n    {\n     \
  \   var item1 = FindViewById(Resource.Id.item01);\n        var item2 = FindViewById(Resource.Id.item02);\n\
  \n        if (item1.Id == item.ItemId)\n        {\n            Android.Util.Log.Info(\"\
  ActionBar\",\n              String.Format(\"Item 1 selected. Item: {0}.\", item1.Id));\n\
  \        }\n        if (item2.Id == item.ItemId)\n        {\n            Android.Util.Log.Info(\"\
  ActionBar\",\n              String.Format(\"Item 2 selected. Item: {0}.\", item2.Id));\n\
  \        }\n        return base.OnMenuItemSelected(featureId, item);\n    }\n}\n\
  ```\n\n`HCExample/HCExample/Activity1.cs`\n\nListing 17.2 显示了定义的 XML 菜单代码，用于直接在\
  \ action bar 中创建菜单系统。在这种情况下，菜单系统展示了一个使用图标、子菜单项以及 `showAsAction` 属性的示例。图标和子菜单项已经在用户界面控件章节（第\
  \ 4 章）中讨论过。\n\n`showAsAction` 属性具有以下选项：\n\n* `ifRoom`：如果有足够的空间放置项，则将将其放置在 action\
  \ bar 中。\n* `withText`：项将包含 `android:title` 属性指定的文本。\n* `never`：该项将永远不会放置在 action\
  \ bar 中。\n* `always`：该项将始终放置在 action bar 中。请谨慎使用此值。如果你设置了太多带有 `always` 值的项目，可能会导致\
  \ action bar 中出现项目重叠和混乱。\n* `collapseActionView`：在 API 级别 14 中引入，此项将被标记为可折叠的。\n\n\
  ![download](img/download.gif) Listing 17.2: Action bar 菜单定义\n\n```xml\n<menu xmlns:android=\"\
  http://schemas.android.com/apk/res/android\"\nandroid:name=\"Embedded Resource -\
  \ Context Menu\">\n  <item\n  android:id=\"@+id/item01\"\n  android:icon=\"@drawable/jellyfishsmall\"\
  \n  android:title=\"Menu item 1\"\n  android:showAsAction=\"ifRoom|withText\">\n\
  \    <menu>\n      <item\n      android:id=\"@+id/item06\"\n      android:title=\"\
  Submenu item 1\">\n      </item>\n      <item\n      android:id=\"@+id/item07\"\n\
  \      android:title=\"Submenu item 2\">\n      </item>\n      <item\n      android:id=\"\
  @+id/item08\"\n      android:title=\"Submenu item 3\">\n      </item>\n      <item\n\
  \      android:id=\"@+id/item09\"\n      android:title=\"Submenu item 4\">\n   \
