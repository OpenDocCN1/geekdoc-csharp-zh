  Commands completed.\";\n```\n\n## 使用 SQL 语句\n\n\n\n\n创建、修改和删除数据库对象是有趣的。然而，CRUD（创建、查询、更新、删除）是数据库应用程序的命。通过\
  \ SQL 进行选择、插入、更新和删除数据的能力是应用程序的核心。以下章节将介绍一些常用的 SQL 语句。\n\n### 使用 Read/Select 读取数据\n\
  \n读取数据对于应用程序来说是一个非常重要的操作。从数据库表中读取数据是应用程序中执行最频繁的操作。.NET Framework 提供了数据读取器、连接以及一系列允许我们访问数据库表的对象。Mono\
  \ for Android 提供了这些 .NET 方法在 Android 上的实现。列表 5.3 显示了从表中读取数据的代码。\n\n![download](img/download.gif)\
  \ 列表 5.3: 读取数据\n\n```\nstring DatabaseName = \"UserData.db3\";\nstring documents\
  \ =\n  System.Environment.GetFolderPath(System.Environment.SpecialFolder.Personal);\n\
  string db = Path.Combine(documents, DatabaseName);\nvar conn = new SqliteConnection(\"\
  Data Source=\" + db);\nvar strSql = \"select Name from Customer where STATEID=@STATEID\"\
  ;\nvar cmd = new SqliteCommand(strSql, conn);\ncmd.CommandType = CommandType.Text;\n\
  cmd.Parameters.Add(new SqliteParameter(\"@STATEID\", 2));\n\ntry\n{\n    conn.Open();\n\
  \    SqliteDataReader sdr = cmd.ExecuteReader();\n    while (sdr.Read())\n    {\n\
  \        tv.Text = Convert.ToString(sdr[\"Name\"]);\n    }\n}\ncatch (System.Exception\
  \ sysExc)\n{\n    tv.Text = sysExc.Message;\n}\nfinally\n{\n    if (conn.State !=\
  \ ConnectionState.Closed)\n    {\n        conn.Close();\n    }\n    conn.Dispose();\n\
  }\n```\n\n这段代码包含在 `InternalNetworkData\\InternalNetworkData\\Activity1.cs` 中。\n\n\
  这段代码执行了以下操作：\n\n* 创建数据库连接。\n* 创建一个参数化的数据库查询。\n* 为参数添加值。\n* 打开数据库连接。\n* 通过返回数据读取器执行查询。\n\
  * 将值输出到 `TextView`。该表只有一个值，因此获取了最终值并显示给用户。\n\n如你所见，可以使用你熟悉并理解的对象。你可以创建一个连接对象，然后创建一个数据读取器。通过数据读取器，你可以遍历返回的记录并像在\
  \ .NET 应用程序中一样这些记录。\n\n![note](img/note.gif)另一种选项是使用 `using` 语句。当执行 `using` 语句时，它将为你调用\
  \ `Dispose()` 方法。我更倾向于使用写出来的 `try-catch-finally` 语法。两种情况在语法上都是正确的，可以根据开发者的意愿使用。\n\
  \n* *\n\n### 使用 SQL 语句插入数据\n\n现在你已经知道如何从数据库表中读取数据了，下一个明显的问题是如何将数据放入表中。你的第一步是获取一些数据。在这种情况下，使用\
  \ SQLite 命令对象向表中放入一些数据，如列表 5.4 所示。\n\n![download](img/download.gif) 列表 5.4: 写入数据\n\
  \n```\nvar conn = new SqliteConnection(\"Data Source=\" + db);\nSqliteCommand sqlc\
  \ = new SqliteCommand();\nsqlc.Connection = conn;\nconn.Open();\nstring strSql =\
  \ \"INSERT INTO CUSTOMER (NAME, CONTACTNAME, STATEID) \" +\n\"VALUES (@NAME, @CONTACTNAME,\
  \ @STATEID)\";\nsqlc.CommandText = strSql;\nsqlc.CommandType = CommandType.Text;\n\
  sqlc.Parameters.Add(new SqliteParameter(\"@NAME\", \"The Coca-Cola Company\"));\n\
  sqlc.Parameters.Add(new SqliteParameter(\"@CONTACTNAME\", \"John Johns\"));\nsqlc.Parameters.Add(new\
  \ SqliteParameter(\"@STATEID\", 1));\nsqlc.ExecuteNonQuery();\nif (conn.State !=\
  \ ConnectionState.Closed)\n{\n    conn.Close();\n}\nconn.Dispose();\n```\n\n这段代码包含在\
  \ `InternalNetworkData\\InternalNetworkData\\Activity1.cs` 中。\n\n在此方法中，使用 SQLite\
  \ 命令对象、参数和连接插入了一条记录。现在你就可以向表中插入数据了，处理其他操作也是相似的。更新和删除操作可以通过 SQLite 的命令对象轻松地处理。命令可以是直接的\
  \ SQL 语句，也可以是预编译语句。两者均可行。有一个警告：如果你选择使用简单的 SQL 语句，不要让代码暴露于 SQL 注入攻击。\n\n# 升级策略\n\n\
  Web 应用程序通常只有一个数据库实例需要管理。对于安装在 Android 上并使用 SQLite 的应用程序，数据库实例的数量与安装数量相同。你应用程序的新版本很可能具有新版本的数据库架构，以支持该升级应用程序中的新功能。本节讨论了可以插入应用程序以处理升级的策略。\n\
  \n### 原地升级\n\n对于现有的应用程序，一种策略是跟踪数据库版本。通过跟踪数据库版本，应用程序可以在启动时进行检查。如果版本不是当前的，可以通过执行 SQLite\
  \ 命令来升级架构。\n\n### 复制数据\n\n原地升级方案在启动时请求检查。如果架构不对，你可以创建一个新的实例并复制必要的数据。这种策略需要执行大量的命令，并可能移动大量数据。执行的命令越多、移动的数据越多，犯错的机会就越大。这些选项通常优于删除现有数据库及其数据。\n\
  \n# Android 特有选项\n\n如果你回顾本章之前的所有代码，你会发现它们在 iPhone 的 MonoTouch 上运行相同。这是一件好事。Mono\
  \ for Android 和 MonoTouch 的目标之一是尽可能代码在另一个平台上运行。然而，对于 SQLite 数据库有一些 Android 特有的选项。这两个选项是创建数据库及其表以及执行\
  \ CRUD 操作。正如本章之前所示，这两个操作完全可行。因此，在使用这些 Android 特有选项时应谨慎。如果应用程序使用了这些 Android 特有机制，会有几个问题：\n\
  \n* 熟悉 ADO.NET 的 .NET 开发者不熟悉这些特有功能。\n* 使用 Android 特有方法编写的应用程序部分无法在 iPhone 或 Mono\
  \ 支持的其他平台上运行。\n\n### SQLiteOpenHelper\n\nSQLiteOpenHelper 是一个辅助类。它旨在协助创建数据库以及数据库的版本管理。使用该类的过程如下：\n\
  \n* 继承并实现三个方法：`OnCreate`、`OnUpgrade` 和 `OnOpen`。这些方法可以根据特定应用程序的需求进行修改。\n\n列表 5.5\
  \ 显示了使用 `SQLiteOpenHelper` 打开数据库的示例：\n\n![download](img/download.gif) 列表 5.5: SQLiteOpenHelper\
  \ 用法\n\n\n\n\n```cs\nclass DBHelper : Android.Database.Sqlite.SQLiteOpenHelper\n\
  {\n    private const string DbName = \"GolfScore\";\n    private const int DbVersion\
  \ = 1;\n\n    public DBHelper(Context context) : base(context, DbName, null, DbVersion)\n\
  \    {    }\n    public override void OnCreate(Android.Database.Sqlite.SQLiteDatabase\
  \ db)\n    {\n        db.ExecSQL(@\"CREATE TABLE IF NOT EXISTS GolfScore \" +\n\"\
  (GolfID INTEGER PRIMARY KEY AUTOINCREMENT,\" +\n            \"ScoreDate varchar(30)\
  \ NOT NULL, ScoreNumber NOT NULL, \" +\n\"Rating double NOT NULL, Slope int not\
  \ null)\");\n    }\n    public override void OnUpgrade(Android.Database.Sqlite.SQLiteDatabase\
  \ db,\n       int oldVersion, int newVersion)\n    {\n        db.ExecSQL(\"DROP\
  \ TABLE IF EXISTS GolfScore\");\n        OnCreate(db);\n    }\n}\n```\n\n此代码包含 `SQLiteAndroidSpecific\\\
  SQLiteAndroidSpecific\\DBHelper.cs` 中。\n\n列表 5.6 展示了一个使用原生 Android 数据访问 API 执行常见数据库操作的示例。\n\
  \n![下载](img/download.gif) 列表 5.6: 使用 SQLiteOpenHelper \n\n```cs\nclass dbCommands\n\
  {\n    private DBHelper dbHelp;\n    public dbCommands(Context context)\n    {\n\
  \        dbHelp = new DBHelper(context);\n        dbHelp.OnCreate(dbHelp.WritableDatabase);\n\
  \    }\n\n    public IList<Score> GetAllScores()\n    {\n        Android.Database.ICursor\
  \ golfCursor = dbHelp.ReadableDatabase.\n        Query(\"GolfScore\", null, null,\
  \ null, null, null, null, null);\n        var scores = new List<Score>();\n    \
  \    while (golfCursor.MoveToNext())\n        {\n            Score scr = MapScores(golfCursor);\n\
  \            scores.Add(scr);\n        }\n        return scores;\n    }\n\n    public\
