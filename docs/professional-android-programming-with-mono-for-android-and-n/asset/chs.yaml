  \n### 案例 2：使用形状可绘制（Shape Drawable）进行润色\n\n虽然应用程序有一行交互式机器人，但它们仍然非常平淡无味。特别是 `ImageButton`\
  \ 的默认外观由于其方正的角和板岩灰色背景而不吸引人。你决定你的机器人的版本 2 在整体风格上可以有所改进。你想将方正的背景替换为更光滑、颜色更有品味的东西。\n\
  \n使用 `ImageButton` 的默认属性，你可以通过添加背景颜色、不同的间距设置等开始美化 `ImageButton` 类的最终结果。然而，这种方法有两个主要的缺点：\n\
  \n*   虽然 `ImageButton` 暴露了许多惊人的自定义选项，但它无法与使用自定义可绘制资源的灵活性相比。\n*   手动调整每个机器人的属性对于前四个来说是可以接受的。然而，随着你的机器人军队开始增长到\
  \ 8、12 和 16 个机器人，这将导致大量的重复代码。不仅生成的布局会变得大得多，更新所有机器人上的一个设置将是一场噩梦。\n\n与其采用这种方法，你可以为每个机器人使用通用定义。这可以使用自定义形状可绘制资源（shape\
  \ drawable）来实现。\n\n形状可绘制资源是在 Android 设备上绘制基本形状的一站式来源。它们可以被用于绘制各种形状，包括椭圆、矩形和弧形。基本上，`Android.Graphics.Shapes`\
  \ 类中定义的大多数形状都可以使用形状可绘制资源绘制。\n\n除了创建通用形状，形状可绘制资源还包含辅助应用其他样式的工具，例如最终形状对象的边框、颜色和间距。\n\
  \n与任何可绘制资源一样，形状可绘制资源可以通过代码或 XML 定义。如果你在这个示例中使用基于代码的形状可绘制资源，将被迭代地将可绘制资源应用到每个实例。这种方法仍然会很繁琐。而不是使用这种方法，你可以通过\
  \ XML 声明可绘制资源并指定使用位置。\n\n![注意](img/note.gif) 正如所述，可绘制资源可以通过 XML 或代码定义。在选择方法时，请考虑以下问题：\n\
  \n*   在什么情况下你会使用该可绘制资源？当你经常处理 XML 布局和其他可绘制资源时，使用 XML 的方法非常有用。它比基于代码的方法要简洁得多。\n*\
  \   你从可绘制资源中需要哪些功能？虽然基于 XML 和基于代码的方法提供了一些很棒的工具，但基于代码的方法更强大，因为它提供了更多选项。在许多情况下，这些额外选项并不是硬性需求，但有时你无法避免使用基于代码的方法。\n\
  *   最后注意，可绘制资源命名空间是 Android 可以极大改进的一个领域的绝佳示例。特别是，基于 XML 方法的一些高级用法需要大量的耐心和尝试才能得到结果。\n\
  \n***\n\n要开始，你在 `Resources/Drawable` 目录中创建一个新的 XML 文件，命名为 `RobotBackground.xml`。在此\
  \ XML 文件中，通过 `<shape>` 节点声明形状可绘制资源。因为形状对象是许多不同形状类型的通用容器，形状节点通过 `android:shape` 属性暴露了定义渲染何种形状的属性。在本示例中，你使用\
  \ `rectangle` 作为值。其他选项是 `oval`、`line` 和 `ring`。\n\n形状 XML 对象可以包含多个可选子节点。这些子节点是与形状关联的额外可绘制资源，或者是定义如何渲染形状的方式。此示例最初使用了形状对象的以下三个子节点：\n\
  \n*   `corners` 节点允许为形状对象创建圆角。该子节点具有多个属性，允许开发者设置整体角半径或专门针对单个角。正如你可能想到的，此节点并不适用于每种形状类型，但它为原本具有硬角的对象增添了美感。\n\
  *   `solid` 节点允许你指定与形状可绘制资源关联的颜色可绘制资源。此节点适用于任何形状类型，是建立对象基础颜色的简单方法。\n*   `stroke`\
  \ 节点允许你创建形状对象的轮廓。其他属性包括常见项目，如设置描边宽度和颜色。\n\n\n\n\n\n使用这些元素，创建一个适合作为每个机器人 `ImageButton`\
  \ 背景的形状规格。在使用这些元素时，请记住，此处创建的任何规格都会自动成型并缩放到其所应用的对象的合适大小。完成完成后，文件的最终版本应该类似于列表 12.19。\n\
  \n![download](img/download.gif) 列表 12.19: 创建机器人背景可绘制资源\n\n```xml\n<?xml version=\"\
  1.0\" encoding=\"utf-8\" ?>\n\n<shape xmlns:android=\"http://schemas.android.com/apk/res/android\"\
  \n     android:shape=\"rectangle\">\n     <corners android:radius=\"5dp\" />\n \
  \    <solid android:color=\"#30577F\"></solid>\n     <stroke android:width=\"1dp\"\
  \ android:color=\"#FFFFFF\" />\n</shape>\n```\n\n`Graphics_Drawables\\Graphics_Drawables\\\
  Resources\\Drawable\\RobotBackground.xml`\n\n在此代码中，形状被定义为具有蓝色背景的矩形。矩形的角被设置为略微圆角。最后，整个形状具有极细厚度的白色边框。\n\
  \n接下来，切换回 `Main.axml` 文件。与其更新“版本 1”的机器人军队，不如创建第二行机器人，以便在机器人军队的版本 1 和版本 2 之间创建一个对比点。\n\
  \n通过复制并粘贴布局中第一个 `TableRow` 的信息来创建第二个 `TableRow`。在第二行中，设置 `android:background` 属性，使其使用新的\
  \ `robotbackground` 可绘制资源作为其背景（不要忘记确保它是小写的）。最后，为每个单独的图像添加少量外边距（margin），为布局留出一些空间。列表\
  \ 12.20 显示了这一新行应该是什么样子。\n\n![download](img/download.gif) 列表 12.20: 在表格视图中定义机器人背景可绘制资源\n\
