  这段代码包含在 `WebServices\\WebServices\\Activity1.cs` 中。\n\n注意 Listing 5.7 中的以下几点：\n\n\
  *   在 `OnCreate` 方法中，创建按钮来处理用户界面操作，并分配了一个 `.Click` 事件处理程序。\n*   在事件处理程序内部，创建了一个代表\
  \ Web 服务的类，并进行了一个异步调用。异步 Web 服务调用的调用序列是分配 `.MethodCompletedEventHandler`，然后调用方法的异步代理方法。\n\
