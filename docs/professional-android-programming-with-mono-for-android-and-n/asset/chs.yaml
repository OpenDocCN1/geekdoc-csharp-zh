  ![6.7](img/c06f007.jpg)\n\n# 使用列表\n\n列表是几乎每个现代移动应用程序不可或缺的一部分。它们提供了一种方便的方法，向用户显示不同类型和数量的数据，并且易于交互。\n\
  \nAndroid 的 `ListView` 是一种基于行的数据显示控件，它对每行中的数据及其显示方式提供了极大的灵活性。你还将学习 `GridView`，它是一种基于行和列的数据显示控件。它处理所有列和行的布局。\n\
  \n在 Android 上，`ListView` 为你承担了大部分大量工作，包括带有惯性的滚动和在正确的时间显示相应的行。你只需要在被要求时为它提供每行的布局和数据即可。Android\
  \ 还会通过触发事件为你处理不同类型的用户交互。\n\n列表用于许多 Android 应用程序。最显著的用途之一是显示和编辑用户偏好。其他自然用途包括 RSS\
  \ 阅读器、Twitter 客户端和媒体播放器。图 6.8 展示了使用 `ListView` 的几个不同应用程序示例，说明了它的强大和灵活性。\n\n图 6.8\n\
  \n![6.8](img/c06f008.jpg)\n\n## 在列表中显示简单数据\n\n在最简单的形式下，Android 中显示数据列表的主要组件是 `ListActivity`。`Activity`\
  \ 是用户可以操作的单一聚焦屏幕，类似于 ASPX 页面或 WinForm。`ListActivity` 是一个普通的 `Activity`，它有一个 `ListView`\
  \ 填充了屏幕上 Activity View 的整个空间。如果你不想在 Activity 中显示任何其他视图，这是一个可以使用的快捷方式。它不需要你从 XML\
  \ 文件加载布局或通过代码构建布局。当然，如果你有兴趣，可以在 `OnCreate()` 覆盖方法中调用 `SetContentView()` 来加载并使用包含\
  \ `ListView` 的自定义布局。列表 6.14 显示了 `ListActivity` 的布局 XML 文件外观。该资源包含在 Android 框架中。\n\
  \n![download](img/download.gif) 列表 6.14: XML 布局资源\n\n```xml\n<?xml version=\"1.0\"\
  \ encoding=\"utf-8\"?>\n<LinearLayout\nandroid:id=\"@+id/widget28\"\nandroid:layout_width=\"\
  fill_parent\"\nandroid:layout_height=\"fill_parent\"\nandroid:orientation=\"vertical\"\
  \nxmlns:android=\"http://schemas.android.com/apk/res/android\"\n>\n    <ListView\n\
  \    android:id=\"@+id/listView\"\n    android:layout_width=\"fill_parent\"\n  \
  \  android:layout_height=\"fill_parent\"\n    >\n    </ListView>\n</LinearLayout>\n\
  ```\n\n`Lists01\\Resources\\layout\\ListActivity.axml`\n\n要创建第一个列表，你应该创建一个新的 activity，然后将其更改为继承自\
  \ `ListActivity` 而不是 `Activity`。基 `ListActivity` 会自动为你加载布局。使用列表 6.15 所示的代码示例来实现创建你第一个列表的这两个关键方面：\n\
  \n*   创建用于显示的数据源：这些数据可以来自任何源——`arrays.xml` 资源文件、硬编码的字符串数组、Web 服务调用或数据库。\n*   为 `ListActivity`\
  \ 属性实例化适配器：这可以是任何类型的适配器——`ArrayAdapter`、`BaseAdapter` 的子类。\n\n![download](img/download.gif)\
  \ 列表 6.15: 带有 `ListActivity` 的 `ListView`\n\n```csharp\nusing System;\nusing Android.App;\n\
  using Android.OS;\nusing Android.Widget;\n\nnamespace Lists01\n{\n    [Activity(MainLauncher\
  \ = true, Label = \"SimpleList\",\n            LaunchMode=LaunchMode.SingleTask)]\n\
  \    public class SimpleActivity : ListActivity\n    {\n        string[] items;\n\
  \n        protected override void OnCreate(Bundle bundle)\n        {\n         \
  \   base.OnCreate(bundle);\n\n            // 创建要显示的列表\n            items = new string[]\
  \ {\n                \"Item One\",\n                \"Second Item\",\n         \
  \       \"Number Three\",\n                \"Fourth Option\",\n                \"\
  Fifth One\",\n                \"Sixth Item\",\n                \"Number Seven\"\
  ,\n                \"Nine\",\n                \"Ten\"\n            };\n\n      \
  \      // 使用 SimpleListItem1 布局和我们的 items 创建适配器\n            this.ListAdapter =\
  \ new ArrayAdapter<string>(\n                this,\n                Android.Resource.Layout.SimpleListItem1,\n\
  \                items);\n        }\n    }\n}\n```\n\n`Lists01\\SimpleActivity.cs`\n\
  \n你会注意到在列表 6.15 所示所示中，`Android.Resource.Layout.SimpleListItem1` 布局是在 `ArrayAdapter`\
  \ 的构造函数中指定的。适配器负责返回每个项的视图。该布局是 Android 内置资源。列表 6.16 显示了 `Android.Resource.Layout.SimpleListItem1`\
  \ 的外观。\n\n```xml\n<?xml version=\"1.0\" encoding=\"utf-8\"?>\n<TextView xmlns:android=\"\
  http://schemas.android.com/apk/res/android\"\n    android:id=\"@android:id/text1\"\
  \n    android:layout_width=\"fill_parent\"\n    android:layout_height=\"wrap_content\"\
  \n    android:textAppearance=\"?android:attr/textAppearanceLarge\"\n    android:gravity=\"\
  center_vertical\"\n    android:paddingLeft=\"6dip\"\n    android:minHeight=\"?android:attr/listPreferredItemHeight\"\
  \n/>\n```\n\n`Lists01\\Resources\\layout\\SimpleListItem1.axml`\n\n如所示，`SimpleListItem1`\
  \ 的视图是一个简单的、填充行的单 `TextView`，并设置了一些其他属性。这并不是什么深奥的技术，但每当你想显示单行文本简单列表项时，不需要制作该布局是非常方便的。\n\
  \nAndroid 自带许多 XML 布局。包含这些布局是为了为所有应用程序提供统一的外观和感受。它们还让开发工作变得轻松，避免你不断创建相同的 XML 布局文件。意外的是，有一些布局专门设计用于与\
  \ Android 标准 `ListView` 项配合使用（参见图 6.9）：\n\n*   `SimpleListItem1` 是显示一行文本的 `TextView`。\n\
  *   `SimpleListItem2` 是一个 `TwoLineListItem` 视图，带有两个 `TextView`（`Android.Resource.Id.Text1`\
  \ 和 `Android.Resource.Id.Text2`），以标题/描述配置堆叠显示。\n*   `SimpleListItemChecked` 是单行\
  \ `TextView`，列表项右侧有一个复选框。\n\n\n\n\n\n*   `SimpleListItemMultipleChoice` 是一个单一 `TextView`，在列表项的右侧有一个多选风格的复选框。\n\
  *   `SimpleListItemSingleChoice` 是一个单一 `TextView`，在列表项的右侧有一个单选按钮风格的选择框。\n\n图 6.9\n\
  \n![6.9](img/c06f009.jpg)\n\n## 使用 Android 的 ListAdapter\n\n每一个强大的 `ListView` 背后都有一个强大的\
  \ `ListAdapter`。Android SDK 开箱提供了一些易于使用的适配器（Adapter）。\n\n`ArrayAdapter` 继承自 `BaseAdapter`，它期望一个可枚举的字符串集合，以及布局的资源标识符和一个可选的字段资源标识符。如果只提供布局的资源标识符，它必须是单个\
  \ `TextView`（例如 `SimpleListItem1`）。\n\n你可以通过使用其资源标识符指示每个列表项的父视图，并指定包含在该父视图某处的 `TextView`\
  \ 字段标识符，来为列表项指定更复杂的布局。无论哪种方式，`ArrayAdapter` 都允许你传递一个值数组，这些值将显示在每个列表项视图某处的 `TextView`\
  \ 中。这是一种通过少量精力以列表形式快速显示字符串集合的极佳方法。你可以考虑将此方法与 LINQ 查询结合，获取所有对象的名称列表进行显示。例如：\n\n```\n\
  var adapter = new ArrayAdapter<string>(this,\nAndroid.Resource.Layout.SimpleListItem1,\n\
  (from animal in this.Animals select animal.Name).ToArray());\n```\n\nListing 6.17\
  \ 所示的 `SimpleAdapter` 稍微高级一些。它需要一个 `Dictionary<string, object>` 的 `List<T>`，每个 `Dictionary<string,\
  \ object>` 代表一个列表项。`Dictionary` 必须一组代表各种数据字段的键值对。`SimpleAdapter` 还需要一个来自 `from`\
  \ 的 `string[]` 数组（它是 `Dictionary` 中的字段列表），以及一个来自 `to` 的 `int[]` 数组（它是对应于 `from`\
  \ 字段的资源标识符列表）。`to` 和 `from` 数组告诉 `SimpleAdapter` `Dictionary` 中的哪些字段位于布局中的哪些视图。\n\
  \n在 Listing 6.17 中使用了 Android SDK 内的 `SimpleListItem2`。这与 Listing 6.16 中的 `SimpleListItem1`\
  \ 非常相似，只是多了一个 `Id` 为 `Android.Resource.Id.Text2` 的 `TextView`。\n\n![download](img/download.gif)\
  \ Listing 6.17: SimpleAdapter 用法\n\n```\n //创建我们的示例数据\nvar items = new List<IDictionary<string,\
  \ object>>();\n\nvar item1 = new Dictionary<string, object>();\nitem1.Add(\"simpleAdapterTitle\"\
  , \"First Title\");\nitem1.Add(\"simpleAdapterDesc\", \"This is a Description\"\
  );\n\nvar item2 = new Dictionary<string, object>();\nitem2.Add(\"simpleAdapterTitle\"\
  , \"Second Title\");\nitem2.Add(\"simpleAdapterDesc\", \"Another Description\");\n\
  \nitems.Add(item1);\nitems.Add(item2);\n\n//从示例数据创建适配器\nvar a = new SimpleAdapter(this,\n\
  \    items,\n        Android.Resource.Layout.SimpleListItem2,\n    new string[]\n\
  \    {\n        \"simpleAdapterTitle\",\n        \"simpleAdapterDesc\"\n    },\n\
  \    new int[]\n    {\n            Android.Resource.Id.Text1,\n            Android.Resource.Id.Text2\n\
  \    });\n\nthis.ListAdapter = a;\n```\n\nLists01\\SimpleAdapterActivity.cs\n\n\
  `SimpleAdapter` 在你的布局以及每个列表项显示的数据方面提供了更多的灵活性。但由于它源自 .NET 世界，它仍然显得有些笨拙。在实际用例中，这意味着需要创建三个不同的数组对象仅仅为了将值从数据对象列表映射到列表项。\n\
  \n## 使用自定义 ListAdapter 自定义 ListView\n\n你已经见过了一些 Android SDK 内置的 ListView 项布局、创建列表适配器的类，以及用于显示\
  \ `ListView` 的 `ListActivity`。使用这些功能没有问题。但在某些时刻，你可能需要以不同于默认布局的方式在 ListView 中显示数据。或者你可能发现使用\
  \ `SimpleAdapter` 显示集合并不简单优雅。对于这些情况，可能自己创建一个子类 `BaseAdapter` 的自定义布局会更好。\n\n下一个示例使用了\
  \ `Animal` 对象的列表作为数据源。Listing 6.18 显示了一个显示动物名称、描述和图像的类![download](img/download.gif)\
  \ Listing 6.18: Animal 数据对象\n\n```\npublic class Animal\n{\n    public string Name\n\
  \    {\n        get;\n        set;\n    }\n\n    public string Description\n   \
  \ {\n        get;\n        set;\n    }\n\n    public int Image\n    {\n        get;\n\
  \        set;\n    }\n}\n```\n\nLists02\\Animal.cs\n\n接下来，每个 ListView 项需要一个布局。`ListView`\
  \ 项通常显示数据源中的单个对象的信息。Listing 6.19 所示的 XML 布局比 Android 内置的 `SimpleListItem1` 内容更多。一个水平\
  \ `LinearLayout` 包含一个用于图像的 `ImageView`，一个垂直 `LinearLayout` 包含两个 `TextView`：一个用于动物名称，另一个用于描述。这种布局使得图像出现在左侧。图像右侧是名称，在其下方是描述。\n\
  \n```xml\n<?xml version=\"1.0\" encoding=\"utf-8\"?>\n<LinearLayout xmlns:android=\"\
  http://schemas.android.com/apk/res/android\"\n    android:id=\"@+id/widget28\"\n\
  \    android:layout_width=\"fill_parent\"\n    android:layout_height=\"80px\">\n\
  \    <ImageView\n    android:id=\"@+id/imageItem\"\n    android:layout_width=\"\
  wrap_content\"\n    android:layout_height=\"wrap_content\"\n    android:layout_gravity=\"\
  center_vertical\">\n    </ImageView>\n    <LinearLayout\n    android:id=\"@+id/linearText\"\
  \n    android:layout_width=\"wrap_content\"\n    android:layout_height=\"fill_parent\"\
  \n    android:orientation=\"vertical\"\n    android:layout_marginLeft=\"10px\"\n\
  \    android:layout_marginTop=\"10px\">\n        <TextView\n        android:id=\"\
  @+id/textTop\"\n        android:layout_width=\"wrap_content\"\n        android:layout_height=\"\
  wrap_content\"\n        android:text=\"TextView\">\n        </TextView>\n      \
  \  <TextView\n        android:id=\"@+id/textBottom\"\n        android:layout_width=\"\
  wrap_content\"\n        android:layout_height=\"wrap_content\"\n        android:text=\"\
  TextView\">\n        </TextView>\n    </LinearLayout>\n</LinearLayout>\n```\n\n\
  Lists02\\Resources\\layout\\AnimalItem.axml\n\n\n\n\n\n请注意布局中各种视图的 ID，因为你可能需要通过程序为这些视图设置数据。在这种情况下，你应该记住\
  \ `ImageView` 以及两个 `TextView` 的 ID：`imageItem`、`textTop` 和 `textBottom`。Mono for\
  \ Android 会自动让这些 ID 可用，以便你可以在 `Resource.Id` 类中引用它们。在 Visual Studio 中，`Resource.Designer.cs`\
  \ 会根据 `Resources` 文件夹中生成操作（build action）设置为 `AndroidResource` 的文件自动生成。需要务必记住，`Resource.Id`\
  \ 类的成员只有在构建项目时才会重新生成，在 particular 之前它们不会显示在 Intellisense 提示中。\n\n假设你的数据源是某个可枚举的列表、数组或其他\
  \ `Animal` 对象的集合，那么构建一个 `ListView` 可以使用的自定义 `ListAdapter` 就非常简单。实现此点的方法是创建一个新类（命名为\
  \ `AnimalListAdapter`）并让它继承自 `BaseAdapter<T>` 类（参见列表 6.20）。\n\n继承自 `BaseAdapter<T>`\
  \ 需要实现一个方法和几个属性：\n\n*   `Count` 属性\n*   类型为 `T` 的 `Indexer` 属性\n*   `GetItemId`\
  \ 方法\n\n`Count` 属性显而易见。它简单地返回应该在列表中显示的项目数量。在大多数情况下，这就是数据源中的项目数量。\n\n`Indexer` 属性应该根据给定的索引返回数据源中的数据对象。在这种情况下，该属性应该根据传递给索引器的位置返回一个\
  \ `Animal` 类型对象。\n\n`GetItemId` 方法接收一个 `int` 类型的位置值并返回一个 `long` 类型的值。对于 Mono 而言，返回的实际数字不会被任何关键的底层\
  \ Android 代码使用。如果你要在代码的任何地方使用 `ItemId` 值，请务必处理好你返回的内容。然而，最佳实践是确保为传递给方法的每个不同位置值返回一个唯一值。处理此方法的一种简单方法是直接返回\
  \ `position` 参数。还需要注意的是，`ItemId` 值确实会传递给某些 `ListView` 事件（例如 `ItemClick` 事件），因此传递一个对于识别给定位置的实际数据源对象更有意义的值可能对你有所用。\n\
  \n![download](img/download.gif) 列表 6.20: AnimalListAdapter\n\n```csharp\nusing System;\n\
  using System.Collections.Generic;\nusing Android.App;\nusing Android.Views;\nusing\
  \ Android.Widget;\n\nnamespace Lists02\n{\n    public class AnimalListAdapter :\
  \ BaseAdapter<Animal>\n    {\n        Activity context;\n        public List<Animal>\
  \ Animals;\n\n        public AnimalListAdapter(Activity context, List<Animal> animals)\n\
  \            : base()\n        {\n            this.context = context;\n        \
  \    this.Animals = animals;\n    }\n\n        public override int Count\n     \
  \   {\n            get { return this.Animals.Count; }\n        }\n\n        public\
  \ override Animal this[int position]\n        {\n            get { return this.Animals[position];\
  \ }\n        }\n\n        public override View GetView(int position, View convertView,\
  \ ViewGroup \n          parent)\n        {\n            //Get our object for this\
  \ position\n            var item = this.Animals[position];\n\n            //Try\
  \ to reuse convertView if it's not null, otherwise inflate it from \n          \
  \    our item layout\n            // This gives us some performance gains by not\
  \ always inflating a new \n               view\n            // This will sound familiar\
  \ to MonoTouch developers with \n               UITableViewCell.DequeueReusableCell()\n\
  \            var view = convertView;\n\n            if (convertView == null || !(convertView\
  \ is LinearLayout))\n                view = context.LayoutInflater.Inflate(Resource.Layout.AnimalItem,\
  \ \n                  parent, false);\n\n            //Find references to each subview\
  \ in the list item's view\n            var imageItem = view.FindViewById(Resource.Id.imageItem)\
  \ as ImageView;\n            var textTop = view.FindViewById(Resource.Id.textTop)\
  \ as TextView;\n            var textBottom = view.FindViewById(Resource.Id.textBottom)\
  \ as TextView;\n\n            //Assign this item's values to the various subviews\n\
  \            imageItem.SetImageResource(item.Image);\n            textTop.SetText(item.Name,\
  \ TextView.BufferType.Normal);\n            textBottom.SetText(item.Description,\
  \ TextView.BufferType.Normal);\n\n            //Finally return the view\n      \
  \      return view;\n        }\n\n        public long GetItemId(int position)\n\
  \        {\n            return position;\n        }\n    }\n}\n```\n\n`Lists02\\\
  AnimalListAdapter.cs`\n\n你可能会注意到适配器的构造函数期望接收一个 `Activity`。适配器需要一个一个上下文（context）的引用，以便为\
  \ `ListView` 项目创建布局及其内部的所有视图。每当你创建视图对象时，都需要一个上下文，这一点也不例外。通常，你会向构造函数传递一个创建自定义 `ListAdapter`\
  \ 的 `Activity` 引用。\n\n列表适配器中的 `GetView` 方法负责返回一个作为 `ListView` 项目布局的 `View`。该示例的第一步是根据给定位置从数据源获取\
  \ `Animal` 对象（`List<Animal>` 属性）。\n\n![note](img/note.gif)如果你做过 iPhone 开发，你可能熟悉复用单元格来节省内存的概念。Android\
  \ 上的想法是相同的。即使你的列表可能有 500 个项目，但屏幕上只能显示其中一部分（例如 10 个）。与其为所有 500 个项目创建布局实例，不如为可以显示的\
  \ 10 个项目创建实例高效得多。这样当项目消失且新项目出现时，就可以进行复用（参见图 6.10）。\n\n图 6.10\n\n![6.10](img/c06f010.jpg)\n\
  \n这就是 `convertView` 参数用武的地方。如果没有可复用的 `ListView` 项目布局实例，该参数为 null。实际上，在前 10 次调用 `GetView`\
  \ 时，`convertView` 是 null。但在第 11 次（再次假设屏幕一次能容纳 10 个项目）调用 `GetView` 时，`convertView`\
  \ 包含了刚刚从屏幕消失的项目实例。注意的是，`convertView` 中任何 `TextView`、`ImageView` 或其他子视图的值将保持其最后设置的值不变。\n\
  \n如果 `convertView` 恰好为 null，则列表 6.20 中所示的代码将使用 `LayoutInflater` 从之前看到的布局中填充视图。否则，`convertView`\
  \ 可以复用，不需要重新填充布局。\n\n如果你为不同的列表项目处理多种布局或视图，你还应该在适配器中重写 `ViewTypeCount` 属性以及 `GetItemViewType(int\
  \ position)` 方法。`ListView` 会为每个列表项目调用 `GetItemViewType` 方法，以确保为 `GetView` 方法中的 `convertView`\
  \ 参数传递正确的递归 `View` 类型。这意味着你可能也想在 `GetView` 方法中使用 `GetItemViewType` 方法，以便知道你正在处理哪种类型。\n\
  \n\n\n\n\n此示例使用 `View` 对象来查找所有需要设置值的子视图，这些值将与显示的 `Animal` 实例相对应。视图的 `FindViewById`\
  \ 方法可以很好地找到对 `ImageView` 和两个 `TextView` 的引用。一旦获取了这些引用，就可以使用要显示的行的 `Animal` 实例为这些子视图设置值。完成所有这些操作后，该视图将返回并用于该行的显示。你可以将此方法视为\
  \ Android 版的 ASP.NET `Control.FindControl` 方法。\n\n你最后需要的是实际的 `Activity` 来显示你的 `ListView`。列表\
  \ 6.21 展示了如何使用 `ListActivity` 的简单用法，以配合自定义列表适配器显示 `ListView`。\n\n![下载](img/download.gif)\
  \ 列表 6.21: 显示 ListView 的 Activity\n\n```\nusing System.Collections.Generic;\nusing\
  \ Android.App;\nusing Android.OS;\n\nnamespace Lists02\n{\n    [Activity(Label =\
  \ \"Animal List\", MainLauncher = true)]\n    public class AnimalListActivity :\
  \ ListActivity\n    {\n        protected override void OnCreate(Bundle savedInstanceState)\n\
  \        {\n            base.OnCreate(savedInstanceState);\n\n            this.ListAdapter\
  \ = new AnimalListAdapter(this,\n                new List<Animal>() {\n        \
  \            new Animal() { Name = \"Elephant\",\n                        Description\
  \ = \"Big and Gray, but what the hey\",\n                        Image = Resource.Drawable.Elephant\
  \ },\n                    new Animal() { Name = \"Chinchilla\",\n              \
  \          Description = \"Little people of the andes\",\n                     \
  \   Image = Resource.Drawable.Chinchilla },\n                    new Animal() {\
  \ Name = \"Lion\",\n                        Description = \"Cowardly lion, anyone?\"\
  ,\n                        Image = Resource.Drawable.Lion },\n                 \
  \   new Animal() { Name = \"Skunk\",\n                        Description = \"Ello,\
  \ baby. I am ze locksmith...\",\n                        Image = Resource.Drawable.Skunk\
  \ },\n                    new Animal() { Name = \"Rhino\",\n                   \
  \     Description = \"Most live to about 60!\",\n                        Image =\
  \ Resource.Drawable.Rhino },\n                    new Animal() { Name = \"Zebra\"\
  ,\n                        Description = \"Stripes, not so great for hiding\"\n\
  \                        Image = Resource.Drawable.Zebra }\n\n            });\n\
  \        }\n    }\n}\n```\n\n`Lists02\\AnimalListActivity.cs`\n\n现在你已经拥有了显示自定义列表所需的所有组件。你首先使用多个视图为列表项创建了自定义布局，通过重写\
  \ `BaseAdapter` 类创建了自定义列表适配器，并创建了一个带有数据源的自定义 `ListActivity`，以显示连接到你适配器的 `ListView`。你的列表看起来应该像图\
  \ 6.11 一样。\n\n图 6.11\n\n![6.11](img/c06f011.jpg)\n\n现在你已经看到了一个使用非默认列表项布局创建自定义列表的可用示例。此示例还阐明了整合自己的自定义数据对象的重要现实用例。你已经通过子类\
  \ `BaseAdapter` 实现了最基础形式的列表适配器。从这里开始，一切皆是可能的！\n\n## 处理 ListView 事件\n\n除非用户能够与其交互，否则\
  \ `ListView` 并没有太大用处。`ListView` 会自动为你提供滚动功能，并知道何时向列表适配器请求正确的显示项。只要在你的适配器中实现一点知识，它甚至可以做到为你复用布局。幸运的是，`ListView`\
  \ 还暴露了许多用于各种类型交互的事件：\n\n*   `ItemClick` 在用户单击一次列表项时触发。这要求用户在短时间内触摸列表项，然后在仍停留在列表项区域时抬起手指。在某些设备上，点击\
  \ Enter（回车）键也可能触发此事件。\n\n*   `ItemLongClick` 在用户长按列表项较长时间的长时间时触发。在某些设备上，这也包括点击并按住\
  \ Enter 键。\n\n*   `ItemSelected` 在项被选中时发生。\n\n*   `ItemCleared` 是 `ItemSelected`\
  \ 的反面。当项的状态不再被选中时发生。\n\n*   `CreateContextMenuEvent` 在列表项上发生长按时触发。这是一种了解何时显示上下文菜单的方便方法，而不是在\
  \ `ItemLongClick` 事件中编写代码。\n\n*   `Touch` 是一个用于触摸的低级事件，你可以用它检测更复杂的触摸操作。\n\n*   `Recycler`\
  \ 当视图作为列表项被复用时，会触发并带有一个视图的实例。\n\n响应这些事件中的某一个与任何其他 `.NET` 事件没有区别，只是 Visual Studio\
  \ 中没有用于设计时的支持来连接事件。你可以为它连接一个委托，并在事件触发时执行其代码。与任何其他 `.NET` 事件一样，你可以使用匿名委托方法或 Lambda\
  \ 表达式来编写整洁的内联代码。列表 6.22 展示了几个连接 ListView 事件以实现简单功能的示例。\n\n![下载](img/download.gif)\
  \ 列表 6.22: 处理 ListView 事件\n\n```\nusing System;\nusing Android.App;\nusing Android.OS;\n\
  using Android.Widget;\nusing Android.Views;\n\nnamespace Lists02\n{\n    [Activity(Label\
  \ = \"Events List\", MainLauncher = true)]\n    public class EventsListActivity\
  \ : ListActivity\n    {\n        private string[] items;\n\n        protected override\
  \ void OnCreate(Bundle bundle)\n        {\n            base.OnCreate(bundle);\n\n\
  \            items = new string[] {\"Item 1\", \"Item 2\", \"Item 3\"};\n      \
  \      this.ListAdapter = new ArrayAdapter<string>(this,\n                Android.Resource.Layout.SimpleListItem1,\
  \ items);\n\n            // 使用 EventHandler\n            this.ListView.ItemClick\
  \ += new EventHandler<ItemEventArgs>(\n                ListView_ItemClick);\n\n\
  \            // 使用匿名方法\n            this.ListView.ItemLongClick += delegate(object\
  \ sender,\n                Android.Widget.AdapterView.ItemLongClickEventArgs e)\n\
  \            {\n                Toast.MakeText(this,\n                    \"Long\
  \ Click: \" +\n                    items[e.Position],\n                        ToastLength.Short).Show();\n\
  \            };\n\n            // 使用 Lambda 表达式\n            this.ListView.Recycler\
  \ += (object sender,\n                ListView.RecyclerEventArgs e) =>\n       \
  \     {\n                Toast.MakeText(this, \"Recycler!\",\n                 \
  \   ToastLength.Short).Show();\n            };\n        }\n\n        void ListView_ItemClick(object\
  \ sender, ItemEventArgs e)\n        {\n            Toast.MakeText(this, \"Click:\
  \ \" + items[e.Position],\n                ToastLength.Short).Show();\n        }\n\
  \    }\n}\n```\n\n`Lists02\\EventsListActivity.cs`\n\n## 选项界面\n\n你对列表的外观和功能有很多选择；但许多情况下你可能需要通过列表完成相同类型的任务。例如，偏好和设置通常使用相同类型的列表项来显示并允许用户配置数据。Android\
  \ 有一些内置功能，专门用于向用户显示偏好设置的任务。\n\n`PreferenceActivity` 是另一种类型的 `Activity`，专门设计用于以最少的精力显示特定的偏好列表项。大多数偏好列表项允许你定义一个用于访问值的键，以及显示给用户的标题和描述：\n\
  \n*   `CheckBoxPreference` 是一个简单的开启/关闭复选框控件。\n\n*   `EditTextPreference` 在用户点击列表项时，在对话框中显示用于编辑的文本框。\n\
  \n*   `ListPreference` 让用户从列表中选择项目。可以设置默认值。\n\n\n\n\n\n* `PreferenceCategory` 以列表项的形式显示类别标题。这是为了以逻辑清晰且符合审美的方式对\
  \ `Preference` 项进行分组。\n* `PreferenceScreen` 被用作占位符，用于导航到另一个偏设置列表。列表项是从布局文件中 `Preference`\
  \ 屏幕的内部 XML 获取的。你可以在同一个 XML 文件中嵌套多个层级的偏设置。\n* `RingtonePreference` 显示一个铃声列表，供用户选择。\n\
  * `PreferenceDialog` 是一个基类，你可以继承它以便在偏设置的对话框中显示你自己的 UI。\n\n该类的优点之一是，它可以自动从 `SharedPreference`\
  \ 中从中保存和加载偏设置。然后，你可以在稍后通过 `Preference Manager` 的 `DefaultSharedPreferences` 使用键来访问这些偏设置。`PreferenceActivity`\
  \ 通常是从 XML 布局资源文件构造的。列表 6.23 演示了一个使用了许多内置偏设置的布局。\n\n![download](img/download.gif)\
  \ 列表 6.23:  PreferenceActivity 布局\n\n```xml\n<?xml version=\"1.0\" encoding=\"utf-8\"\
  ?>\n<PreferenceScreen xmlns:android=\"http://schemas.android.com/apk/res/android\"\
  >\n    <PreferenceCategory android:title=\"First Category\">\n        <CheckBoxPreference\n\
  \            android:key=\"chooseFromList\"\n            android:title=\"CheckBox\
  \ Preference\"\n            android:defaultValue=\"true\"\n            android:summary=\"\
  Do you want to Choose from the List?\"\n            />\n        <ListPreference\n\
  \            android:title=\"List Preference\"\n            android:summary=\" Allows\
  \ you to select an array item\"\n            android:dependency=\"chooseFromList\"\
  \n            android:key=\"listChoice\"\n            android:defaultValue=\"1\"\
  \n            android:entries=\"@array/listChoiceEntries\"\n            android:entryValues=\"\
  @array/listChoiceEntryValues\"\n            />\n    </PreferenceCategory>\n    <PreferenceCategory\
  \ android:title=\"Second Category\">\n        <PreferenceScreen android:title=\"\
  Advanced Options\">\n            <CheckBoxPreference\n                android:key=\"\
  advancedOption\"\n                android:title=\"Advanced Option\"\n          \
  \      android:defaultValue=\"true\"\n                android:summary=\"This is\
  \ an Advanced Option\"\n                />\n        </PreferenceScreen>\n      \
  \  <EditTextPreference android:dialogTitle=\"EditTextTitle\"\n            android:dialogMessage=\"\
  Please enter your Text:\"\n            android:key=\"mainOption\"\n            android:title=\"\
  Some Title\"\n            android:summary=\"This is an EditText Preference\"\n \
  \           android:defaultValue=\"Test\"\n            />\n    </PreferenceCategory>\n\
  </PreferenceScreen>\n```\n\n`Lists04\\Resources\\layout\\Preferences.axml`\n\n图\
  \ 6.12 显示了列表 6.23 中的 XML 布局在加载（inflated）后的样子。你可以看到创建一套丰富的 ` `Preference` 屏幕是多么简单。注意\
  \ Second Category 包含一个 `CheckBoxPreference` 的 `PreferenceScreen`。像这样嵌套 `PreferenceScreen`\
  \ 会自动创建 `PreferenceScreens` 之间的导航。当用户点击 Advanced Options 列表项时，将显示一个带有 Advanced Option\
  \ 复选框的 `PreferenceScreen`。你可以这样轻松地嵌套多个层级的 `PreferenceScreen` 布局项，从而使用单个 `PreferenceActivity`\
  \ 创建多级可导航的偏设置。\n\n图 6.12\n\n![6.12](img/c06f012.jpg)\n\n你也可以通过编程方式创建 `PreferenceScreens`。有时你需要结合使用多种技术。通常，你会在\
  \ XML 布局文件中为 `ListPreference` 的 `entries` 和 `entryValues` 分配资源标识符。这些属性的资源标识符将是你\
  \ `Resources\\values\\strings.xml` 文件中的字符串数组。\n\n在实践中，有时你直到运行之前都不知道想在列表中使用哪些值。如果你在编译时不知道这些条目及其值，你可以在运行时通过编程将它们分配给你的\
  \ `PreferenceList` 项。列表 6.24 显示了实现此目标的方法。\n\n![download](img/download.gif) 列表 6.24:\
  \ 在运行时设置 ListPreference 项\n\n```csharp\nusing System;\nusing Android.App;\nusing\
  \ Android.Content;\nusing Android.OS;\nusing Android.Runtime;\nusing Android.Views;\n\
  using Android.Widget;\nusing Android.Preferences;\n\nnamespace Lists04\n{\n    [Activity(Label\
  \ = \"Prefs\", MainLauncher=true)]\n    public class Preferences : PreferenceActivity\n\
  \    {\n        protected override void OnCreate(Bundle bundle)\n        {\n   \
  \         base.OnCreate(bundle);\n\n            this.AddPreferencesFromResource(Resource.Layout.Preferences);\n\
  \            var listPref = (ListPreference)FindPreference(\"listChoice\");\n\n\
  \            listPref.SetEntries(new string[] { \"Choice #1\", \"Option 2\", \"\
  3\" });\n            listPref.SetEntryValues(new string[] { \"1\", \"2\", \"3\"\
  \ });\n        }\n    }\n}\n```\n\n`Lists04\\Preferences.cs`\n\n在这个示例中，`PreferenceActivity`\
  \ 通过调用 `AddPreferencesFromResource` 方法从 `preferences.xml` 布局进行加载。使用 `FindPreference`\
  \ 根据布局文件中指定的键定位 `ListPreference` 实例。一旦你有了 `ListPreference` 的引用，就可以调用 `SetEntries`\
  \ 和 `SetEntryValues` 方法来覆盖已分配的任何条目和值。如果你查看列表 6.23，你会发现如果你计划手动分配条目和值，则不需要在布局 XML\
  \ 中指定 `entries` 和 `entryValues` 属性。图 6.12 显示了 `ListPreference` 的样子。\n\n## 嵌套导航\n\
  \n列表通常用于在应用程序中导航。用户点击列表中的项，然后会出现另一个带有更多选项的列表。通过这种导航方式，用户可以深入对象的属性和子属性。\n\n在 Android\
  \ 中启用这种功能非常简单，并且使用了你在本章中学到的概念。你只需要连接 `ListView` 的 `ItemClick` 事件（参见列表 6.25）并在处理程序中启动新\
  \ Activity。Android 返回键将你带回之前的 `ListActivity`。\n\n![note](img/note.gif)不要忘记这里同样适用于\
  \ Activity 生命周期。你可能会返回到一个已经卸载的 Activity。你应该在适当的情况下按 Activity 划分和加载状态，以避免困扰用户并导致应用程序出错。有关\
  \ Activity 生命周期的更多信息，请参阅第三章。\n\n* * *\n\n![download](img/download.gif) 列表 6.25:\
  \ 启动嵌套 Activity\n\n```csharp\nthis.ListView.ItemClick += delegate\n{\n    StartActivity(typeof(SecondActivity));\n\
  };\n```\n\n`Lists05\\FirstActivity.cs`\n\n当处理嵌套列表或任何类型的嵌套 Activity 时，你可能需要将数据从一个\
  \ Activity 传递到下一个。Android 文档建议了两种实现此操作的方法。\n\n\n\n\n\n* `Intent.PutExtra`: 此方法要求你已经实例化了用于在新\
  \ Activity 中的 `Intent`，而不仅仅是使用如 `StartActivity(Type)` 类的快捷方法。通过 `Intent` 实例，调用 `PutExtra`\
  \ 允许你通过键名存储简单数据类型的值，并可以在新 Activity 中使用 `Intent.GetTypeExtra` 方法的变体来检索这些值。这对于简单数据类型和简单数据类型的数组（在某些情况下也复杂数据类型）非常有用：\n\
  \n    * `Bool`\n    * `Bool[]`\n    * `Bundle`: 另一个用于存储更多简单数据类型的键值对字典。`PutExtra`\
  \ 在根层级使用 `Bundle`，因此你可以通过这种方式在 `Bundle` 中存储 `Bundles`。\n    * `byte[]`\n    * `char`,\
  \ `char[]`\n    * `double`, `double[]`\n    * `float`, `float[]`\n    * `int`, `int[]`\n\
  \    * `sbyte`\n    * `short`, `short[]`\n    * `string`, `string[]`\n    * `Java.IO.Iserializable`:\
  \ 任何实现此接口的复杂数据类型都可以被存储。\n\n* `Static properties`: 创建静态属性或变量也是在 Activity 之间传递数据的接受方式。你可以在启动新\
  \ Activity 的 Activity 上或要启动的新 Activity 上创建静态属性。但请注意，如果你计划使用多个 Activity 实例，它们将都使用同一个静态实例，这可能会导致问题。\n\
  \nListing 6.26 显示了你如何修改代码，通过 `PutExtra` 方法从 `ItemClick` 事件传递所选的值来启动下一个 Activity。\n\
  \n![download](img/download.gif) Listing 6.26: 向嵌套 Activity 传递数据\n\n```\nthis.ListView.ItemLongClick\
  \ += (sender, e) => {\n    string sel = this.ListAdapter.GetItem(e.Position).ToString();\n\
  \    var secondIntent = new Android.Content.Intent(this, typeof(SecondActivity));\n\
  \    secondIntent.PutExtra(\"selected\", sel + \" was Selected!\");\n    StartActivity(secondIntent);\n\
  };\n```\n\n`Lists05\\FirstActivity.cs`\n\n## 分组列表\n\n有时你可能想对 `ListView` 中的项目进行分组。在\
  \ Preferences 示例中，你使用了 `PreferenceCategory` 项目以逻辑方式对不同的用户偏好进行分组。遗憾的是，Android 尚未提供默认方法在普通的\
  \ `ListView` 中进行这种分类分组。目前只有 `PreferenceScreen` 具有这种能力。\n\n考虑到 `ListView` 提供的极大灵活性，实现这种分组列表样式是完全可能的。实现此的一种常见方法是创建一个列表适配器，显示一组列表适配器的集合——每个组或每个部分一个。\n\
  \n在本示例中，你将创建一个名为 `SectionedAdapter` 的列表适配器。你将为列表项使用两种不同的布局。一种布局用于实际的列表项（在本示例中，你将为每个组使用\
  \ `ArrayAdapter` 实例），另一个用于组名分隔符项。为了简单起见，示例使用了 `SimpleListItem1` 布局来显示从 `ArrayAdapters`\
  \ 输出的列表项。Listing 6.27 展示了组名分隔符列表项的布局。该布局唯一异常之处是 `style` 属性。它的值为内置的 `listSeparatorTextViewStyle`，它会产生灰色背景和白色文字。\n\
  \n![download](img/download.gif) Listing 6.27: 组名分隔符列表项布局\n\n```\n<TextView\nxmlns:android=\"\
  http://schemas.android.com/apk/res/android\"\n    android:id=\"@+id/separator\"\n\
  \    android:layout_width=\"fill_parent\"\n    android:layout_height=\"wrap_content\"\
  \n    android:gravity=\"center\"\n    style=\"?android:attr/listSeparatorTextViewStyle\"\
  \ />\n```\n\n`Lists06\\Resources\\layout\\Separator.axml`\n\n`SectionedAdapter`\
  \ 负责管理所有包含要显示的 `Section` 属性实例的章节。`Section` 对象有一个 `Caption` 属性用于存储章节的可显示标题，以及 `BaseAdapter`\
  \ 属性用于保留对该章节列表适配器的引用。Listing 6.28 显示了创建 `SectionedAdapter` 所需的代码。\n\n```\nusing\
  \ System;\nusing System.Collections.Generic;\nusing System.Linq;\nusing System.Text;\n\
  using Android.App;\nusing Android.Content;\nusing Android.OS;\nusing Android.Runtime;\n\
  using Android.Views;\nusing Android.Widget;\n\nnamespace Lists06\n{\n    public\
  \ class SectionedAdapter : BaseAdapter<Section>\n    {\n        const int TYPE_SECTION_HEADER\
  \ = 0;\n\n        Context context;\n        LayoutInflater inflater;\n\n       \
  \ public SectionedAdapter(Context context)\n        {\n            this.context\
  \ = context;\n            this.inflater = LayoutInflater.From(context);\n      \
  \      this.Sections = new List<Section>();\n        }\n\n        public List<Section>\
  \ Sections\n        {\n            get;\n            set;\n        }\n\n       \
  \ public override int Count\n        {\n            get\n            {\n       \
  \         int count = 0;\n                foreach (var s in Sections)\n        \
  \        {\n                    count += s.Adapter.Count + 1;\n                }\n\
  \                return count;\n            }\n        }\n\n        public override\
  \ int ViewTypeCount\n        {\n            get\n            {\n               \
  \ int viewTypeCount = 1;\n                foreach (var s in Sections)\n        \
  \        {\n                    viewTypeCount += s.Adapter.ViewTypeCount;\n    \
  \            }\n                return viewTypeCount;\n            }\n        }\n\
  \n        public override Section this[int position]\n        {\n            get\
  \ { return this.Sections[position]; }\n        }\n\n        public override bool\
  \ AreAllItemsEnabled()\n        {\n            return false;\n        }\n\n    \
  \    public override int GetItemViewType(int position)\n        {\n            int\
  \ typeOffset = TYPE_SECTION_HEADER + 1;\n            foreach (var s in Sections)\n\
  \            {\n                if (position == 0)\n                    return (TYPE_SECTION_HEADER);\n\
  \                int size = s.Adapter.Count + 1;\n                if (position <\
  \ size)\n                    return (typeOffset + s.Adapter.GetItemViewType(position\
  \ - 1));\n                position -= size;\n                typeOffset += s.Adapter.ViewTypeCount;\n\
  \            }\n            return -1;\n        }\n\n        public override long\
  \ GetItemId(int position)\n        {\n            return position;\n        }\n\n\
  \        public void AddSection(string caption, BaseAdapter adapter)\n        {\n\
  \            this.Sections.Add(new Section() { Caption = caption, Adapter = adapter\
  \ });\n        }\n\n        public override View GetView(int position, View convertView,\
  \ ViewGroup parent)\n        {\n            int sectionIndex = 0;\n            foreach\
  \ (var s in Sections)\n            {\n                if (position == 0)\n     \
  \           {\n                    TextView separator = convertView as TextView;\n\
  \                    if (separator == null)\n                        separator =\
  \ inflater.Inflate(Resource.Layout.Separator, null) as TextView;\n             \
  \       separator.Text = s.Caption;\n                    return separator;\n   \
  \             }\n                int size = s.Adapter.Count + 1;\n             \
  \   if (position < size)\n                    return (s.Adapter.GetView(position\
  \ - 1, convertView, parent));\n                position -= size;\n             \
  \   sectionIndex++;\n            }\n            return null;\n        }\n    }\n\
  }\n```\n\n`Lists06\\SectionedAdapter.cs`\n\n\n\n\n\n`SectionedAdapter` 重写了 `BaseAdapter`\
  \ 派生的所有常用方法和属性。在 `Count` 属性的情况下，计数将变为每个 `Section` 适配器 `Count` 的 `Sum`（总和），加上每个 `Section`\
  \ 标题行的 1。同样，`ViewTypeCount` 是每个 `Section` 的 `ViewTypeCounts` 的 `Sum`（总和），再加上用于 `Separator`（分隔符）视图类型的\
  \ 1。\n\n`GetItemViewType` 遍历所有 `Sections` 以查找给定的位置属于哪种类型的视图。如果位置是 `Separator`，它将返回为\
  \ `0` 的常量 `VIEW_TYPE_HEADER`。否则，它会在包含指定位置项的 `Adapter` 上调用 `GetItemViewType`，直接从该\
  \ `Adapter` 获取其视图类型。然后将返回的视图类型与 `typeOffset` 值相加，以确保与其他适配器的视图类型不会发生冲突。\n\n`GetView`\
  \ 使用分隔符布局为分隔符的标题列表项构建 `View`。该方法会在问题项所在的 `Section` 适配器上进行调用，并使用适配器的 `GetView` 方法将\
  \ `View` 传递并返回对象。\n\n虽然你在 `SectionedAdapter` 示例中对两个部分都使用了 `ArrayAdapter`，但你可以使用\
  \ `SectionedAdapter` 显示任何你喜欢的列表适配器类型。你还可以在单个 `SectionedAdapter` 中混合不同的列表适配器。每个部分都可以有自己的列表适配器类型，只要它在某处派生自\
  \ `BaseAdapter` 即可。你的示例应该产生与 图 6.14 类似的内容。\n\n图 6.14\n\n![6.14](img/c06f014.jpg)\n\
  \n## 在网格中显示数据\n\n如果你想在应用程序中显示图片网格怎么办？你可以使用 `ListView`并将每行划分为列，由自己管理实际上是三个独立的项。这将具有挑战性，但你可以创建一个具有此功能的\
  \ `ListView` 子类，以便在需要时复用。\n\nAndroid 已经以 `GridView` 的形式为你完成了这项工作。`GridView` 派生自\
  \ `ListView`，但它不是每行显示一个列表项，而是在一个二维、可滚动的网格中按行和列显示列表项。你可以设置列数以及每列的宽度以显示不同数量的数据。\n\n\
  像 `ListActivity` 这样简单的 Activity 不能与 `GridView` 使用，因此你至少必须创建一个包含 `GridView` 的基础 XML\
  \ 布局文件。代码 6.29 显示了带有 `GridView` 的基础布局。除了你已经熟悉的 `ListView` 属性外，你还需要注意几个 `GridView`\
  \ 特有的属性：\n\n* `numColumns` 可以是一个显式数字或 `auto_fit`，后者会自动显示一行能够容纳的列。这在横屏模式下有用，在大多数设备上，横屏可以容纳比竖屏更多的列。\n\
  \n* `stretchMode` 决定如何处理行中未被占据的任何额外空间。\n\n```xml\n<?xml version=\"1.0\" encoding=\"\
  utf-8\"?>\n<GridView xmlns:android=\"http://schemas.android.com/apk/res/android\"\
  \n    android:id=\"@+id/grid\"\n    android:layout_width=\"match_parent\"\n    android:layout_height=\"\
  match_parent\"\n    android:numColumns=\"auto_fit\"\n    android:stretchMode=\"\
  stretch\" />\n```\n\n代码 6.29 显示了带有 `GridView` 的基础布局。\n\n\n\n\n\n```c\nusing System;\n\
  using Android.App;\nusing Android.Content;\nusing Android.Runtime;\nusing Android.Views;\n\
