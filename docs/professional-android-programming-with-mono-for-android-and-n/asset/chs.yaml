  \ Cursor\n\n在项目框架就绪后，我们可以开始专注于充实 `ImageAdapter` 类。该类的主要功能是将图片从 Android 设备传递到 Gallery\
  \ 控制器。为了实现这一点，需要通过对媒体内容提供者进行查询来生成数据集。一旦数据到位，我们就使用获取的信息创建新的图像视图，并在请求时将其传递给 Gallery。\n\
  \n由于此项目将与内容提供者建立接口，获取数据访问的模式将通过 `Cursor` 对象。使用 `Cursor` 对象在章的前面的部分已经介绍过。以下步骤概述了添加游\
  \ 的过程：\n\n1.  在 `ImageAdapter` 类中，创建一个名为 `GetImageCursor()` 的私有函数。该函数处理对媒体内容提供者的调用并返回\
  \ `ICursor` 的类型。\n2.  要创建 `ImageView`，使用游 获取 Android 设备上所有图片的 ID。具体来说，此示例使用了生成的图片缩略图的图像\
  \ ID。Listing 6.10 提供了此过程的示例。\n\n![download](img/download.gif) Listing 6.10: 查询媒体内容提供者\n\
  \n```c\n private ICursor GetImageCursor()\n{\n     string[] Projection = { MediaStore.Images.Thumbnails.ImageId\
  \ };\n\n     var ImageCursor = ((Activity)_Context).ManagedQuery(\n          MediaStore.Images.Thumbnails.ExternalContentUri,\n\
  \          Projection, null, null, null);\n\n     return ImageCursor;\n}\n```\n\n\
  `Databinding_GalleryView\\Databinding_GalleryView\\GalleryViewSample.cs`\n\n3. \
  \ 在此列表中，创建一个投影（projection），其中包含了查询需要返回所需的字段。为了方便管理游，使用 `_Context` 对象获取一个传递给调用活动的的实例。在将其强制转换回\
  \ `Activity` 类型后，此方法将能够利用调用活动类的 `ManagedQuery()` 函数，这允许调用类管理 `ICursor` 对象的生命周期。![note](img/note.gif)如果你从物理\
  \ Android 设备进行查询，你的设备上可能有很多图片。为了让返回结果集保持在可管理的水平，你可能想在此查询中指定选择参数（selection arguments）。或者，你可以在设置该适配器后，在\
  \ `GetView()` 方法中强制限制。\n\n4.  游查询就绪后，在 `ImageAdapter` 中创建一个名为 `ImageCursor` 的属性。这将用于管理\
  \ `ICursor` 实例，并使在整个类中使用游变得更容易。由于这不是你通常希望暴露给外部的内容，请将属性的保护级别改为 `protected`。Listing\
  \ 6.11 显示了一个示例。\n\n![download](img/download.gif) Listing 6.11: 管理 ImageCursor 实例\n\
  \n```csharp\n private ICursor _ImageCursor;\nprotected ICursor ImageCursor\n{\n\
  \     get {\n          if (_ImageCursor == null)\n          {\n               _ImageCursor\
  \ = GetImageCursor();\n          }\n\n          return _ImageCursor;\n     }\n \
  \    set { _ImageCursor = value; }\n}\n```\n\n`Databinding_GalleryView\\Databinding_GalleryView\\\
  GalleryViewSample.cs`\n\n`ImageAdapter` 现在有了一个完整的、在请求时懒加载的数据源。现在你可以继续完成设置此适配器的最后步骤了。\n\
  \n### 完成自定义适配器\n\n通过继承 `BaseAdapter` 类，我们必须重写几个方法以允许适配器的正常功能。从最简单的方法 `Count()` 和\
  \ `GetItemId()` 开始，让我们开始支持这些操作。\n\n1.  正如你想象的，`Count` 类用于返回游中的项目总数。\n2.  接下来，GetItemId()`\
  \ 的目的是提供实体的实际 ID。这两个方法都可以通过利用设置好的 `ImageAdapter` 属性来实现。Listing 6.12 展示了如何设置这些。\n\
  \n![download](img/download.gif) Listing 6.12: 支持 Count 和 GetItemID 方法\n\n```csharp\n\
  \ public override int Count\n{\n     get { return ImageCursor.Count; }\n}\n\npublic\
  \ override long GetItemId(int position)\n{\n     ImageCursor.MoveToPosition(position);\n\
  \     var ImageID = ImageCursor.GetString(0);\n\n     return position;\n}\n```\n\
  \n`Databinding_GalleryView\\Databinding_GalleryView\\GalleryViewSample.cs`\n\n![note](img/note.gif)你可能注意到此示例在以下行使用了硬编码的索引值：\n\
  \n```csharp\nImageCursor.GetString(0);\n```\n\n这种设置是为了让游只返回数据源的一个字段并保持示例简单。如果需要，更健壮的方法是在类中创建一个跟踪字段，为正确的值保留正确的索引。这通过使用游的\
  \ `GetColumnIndex()` 函数来实现：`ImageCursor.GetColumnIndex(MediaStore.Images.Thumbnails.ImageId)`\n\
  \n3.  下一步是设置 `GetItem()` 函数。对于这一个，只需返回 `null` 或返回传递给参数的相同位置整数。此函数的目的是允许开发者调用 Gallery\
  \ 控制器的 `GetItemAtPosition()` 函数。目前我们不想支持此函数。![note](img/note.gif)由你开发者决定 `GetItemAtPosition()`\
  \ 函数返回什么。在某些情况下，这可以返回数据集上相应实体的键。其他实现实际上返回包含所需值的复杂对象。这些方法的用用例取决于你的需求和你使用的数据源类型。请根据你的判断，并为此特定函数添加适当的文档。\n\
  \n4.  最后，设置 `GetView()` 函数。正如在本章前面提到的，此方法需要能够回收已填充的视图或按需要创建视图。为了实现这一点，我们可以利用 `convertView`\
  \ 变量并进行空检查。如果给视图为空，则根据 Gallery 提供的位置整数一个新的 `ImageView`。否则，返回之前使用的视图。Listing 6.13\
  \ 正是这样做的。\n\n\n\n\n\n![download](img/download.gif) 列表 6.13: `GetView` 函数\n\n```java\n\
  \ public override View GetView(int position, View convertView, ViewGroup parent)\n\
  {\n     if (convertView == null)\n     {\n          ImageView returnView = new ImageView(_Context);\n\
  \          ImageCursor.MoveToPosition(position);\n\n          var ImageID = ImageCursor.GetString(0);\n\
  \          returnView.SetImageURI(\n               Android.Net.Uri.WithAppendedPath(\n\
  \                    MediaStore.Images.Thumbnails.ExternalContentUri, ImageID));\n\
  \          returnView.SetScaleType(ImageView.ScaleType.CenterCrop);\n          return\
  \ returnView;\n     }\n     else\n     {\n          return (ImageView)convertView;\n\
  \     }\n}\n```\n\n`Databinding_GalleryView\\Databinding_GalleryView\\GalleryViewSample.cs`\n\
