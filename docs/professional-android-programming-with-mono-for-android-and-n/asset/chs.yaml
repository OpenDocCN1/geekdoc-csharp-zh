  \ = x.Element(\"created_at\").Value\n                        }).ToList<Tweet>();\n\
  \            var st = new List<String>();\n            foreach (Tweet t in twt)\n\
  \            {\n                st.Add(t.Status);\n            }\n\n           \
  \ var s = new ArrayAdapter<String>(Activity,\n              Android.Resource.Layout.SimpleListItem1,\
  \ st.ToArray());\n            Activity.RunOnUiThread(() =>\n                {\n\
  \                    this.ListAdapter = s;\n                }\n            );\n\
  \            Android.Util.Log.Debug(\"http response\", \"finished\");\n        }\n\
  \        catch (System.Exception sysExc)\n        {\n            Android.Util.Log.Error(\"\
  http response\", \"Exception Message: \" +\n              sysExc.Message);\n   \
  \         Android.Util.Log.Error(\"http response\", \"Exception Stack Trace: \"\
  \ +\n              sysExc.StackTrace);\n            var iExc = sysExc.InnerException;\n\
  \            while(iExc != null )\n            {\n                Android.Util.Log.Error(\"\
  http response\", \"Exception Message: \" +\n                    iExc.Message);\n\
  \                Android.Util.Log.Error(\"http response\", \"Exception Stack Trace:\
  \ \" +\n                    iExc.StackTrace);\n                iExc = iExc.InnerException;\n\
  \            }\n        }\n    }\n\n    public override void OnListItemClick(ListView\
  \ l, View v, int position, long id)\n    {\n        base.OnListItemClick(l, v, position,\
  \ id);\n        if (f2 == null)\n        {\n            f2 = FragmentManager.FindFragmentById<Frag2>(Resource.Id.viewer);\n\
  \        }\n        var thisTweet = twt[position];\n        f2.TId = thisTweet.UserName;\n\
  \        f2.TDate = thisTweet.StatusDate;\n        f2.TStatus = thisTweet.Status;\n\
  \        f2.TwitterImage = thisTweet.ProfileImage;\n    }\n}\n```\n\n`HCFragmentSearch\\\
  HCFragmentExample\\Frag1.cs`\n\n一旦 `ListView` 中的某项被选中，`Frag2` 中的多个属性将会更新。这些属性将更新\
  \ Fragment 2 中的视图。在下载图像时，使用了 `ThreadPool` 来下载文件。这提供了更好的用户体验，因为下载操作是在应用程序的主线程之外执行的。请参见列表\
  \ 17.18。\n\n![download](img/download.gif) 列表 17.18: Fragment 2 源代码\n\n```csharp\n\
  \ public class Frag2 : Fragment\n    {\n        public string TId\n        {\n \
  \           set { twitterId.Text = value; }\n        }\n        public string TStatus\n\
  \        {\n            set { twitterStatus.Text = value; }\n        }\n       \
  \ public string TDate\n        {\n            set { twitterDate.Text = value; }\n\
  \        }\n        public string TwitterImage\n        {\n            set\n   \
  \         {\n                var imgUrl = value;\n                string documents\
  \ = System.Environment.GetFolderPath(\n                    System.Environment.SpecialFolder.Personal);\n\
  \                string fileName = Guid.NewGuid().ToString();\n                string\
  \ file = System.IO.Path.Combine(documents, fileName);\n                this is a\
  \ synchronous download, so its bad.\n                var ptt = new PassToThread()\
  \ { FileName = file,\n                         imageV = twitterImg, UrlToDownload\
  \ = imgUrl };\n                System.Threading.ThreadPool.QueueUserWorkItem(\n\
  \                     System.Threading.WaitCallback(downloadImage), ptt);\n    \
  \        }\n        }\n        TextView twitterId;\n        TextView twitterStatus;\n\
  \        TextView twitterDate;\n        ImageView twitterImg;\n        public override\
  \ void OnCreate(Bundle bundle)\n        {\n            base.OnCreate(bundle);\n\
  \        }\n\n        public override View OnCreateView(LayoutInflater inflater,\n\
  \             ViewGroup container, Bundle savedInstanceState)\n        {\n     \
  \       base.OnCreateView(inflater, container, savedInstanceState);\n          \
  \  var vw = inflater.Inflate(Resource.Layout.frag2layout, container,\n         \
  \       true);\n            twitterId = vw.FindViewById<TextView>(Resource.Id.TwitterId);\n\
  \            twitterStatus = vw.FindViewById<TextView>(Resource.Id.status);\n  \
  \          twitterDate = vw.FindViewById<TextView>(Resource.Id.dateofstatus);\n\
  \            twitterImg = vw.FindViewById<ImageView>(Resource.Id.twitterImage);\n\
  \            return vw;\n        }\n\n        public override void OnPause()\n \
  \       {\n            base.OnPause();\n        }\n\n        private void downloadImage(Object\
  \ o)\n        {\n            try\n            {\n                var ptt = (PassToThread)o;\n\
  \                var wc = new System.Net.WebClient();\n                wc.DownloadFile(ptt.UrlToDownload,\
  \ ptt.FileName);\n                Activity.RunOnUiThread(() =>\n               \
  \     ptt.imageV.SetImageURI(Android.Net.Uri.Parse(\n                        ptt.FileName)));\n\
  \            }\n            catch (System.Net.WebException wec)\n            {\n\
  \                Android.Util.Log.Error(\"twitter timelines\", wec.Message);\n \
  \           }\n        }\n\n        private class PassToThread\n        {\n    \
  \        public string UrlToDownload { get; set; }\n            public string FileName\
  \ { get; set; }\n            public ImageView imageV { get; set; }\n        }\n\
  \    }\n```\n\n\n\n\n\n注意此代码中使用了 `OnUiThread`。这本身并不令人意外。需要注意的关键是，`OnUiThread` 来自片段（fragment）的\
  \ `.Activity` 属性。`.Activity` 属性提供了开发者在从 Android 2.x 手机设计转向 Android 3.x 及更高版本的平板电脑设计时常用的许多属性的访问。\n\
  \n图 17.11 显示了应用程序输出。\n\n图 17.11\n\n![17.11](img/c17f011.jpg)\n\n# 总结\n\n本章简要回顾了\
  \ Android 3.0 和 Android 4.0 中的 Android 平板电脑特性，包括：\n\n* 使用带有菜单项的操作栏（action bar）\n\
  * 使用操作栏创建搜索界面\n* 片段的基础知识以及如何划分屏幕空间以有效利用它\n* 在 Twitter 搜索应用中片段之间的通信\n\n# 附录 A\n\n\
  ## 开发人员提示以及 Mono 与 Android 的未来\n\n本附录包含哪些？\n\n* 回顾最佳实践、提示、技巧和坑（gotchas）\n* 介绍 Android\
  \ 3.0：Honeycomb 和 Android 4.0：Ice Cream Sandwich\n* 讨论对片段的支持\n* Mono for Android\
  \ 的未来\n\n每个平台都有其特殊之处，Android 也不例外。仅仅因为你可以用 C# 为 Android 开发，并不意味着你就能免于这些奇特性和异常。本书记录并解释了其中一些\
  \ Android 特性（Androidisms）。本附录描述了一些可能不适用于其他地方的最佳实践、技巧和坑。你还将熟悉 Android 3.0：Honeycomb\
  \ 和 Android 4.0：Ice Cream Sandwich。你将探索应用可以利用的新功能，同时学习如何与旧版本的 Android 保持兼容性。\n\n\
  最后，将讨论 Mono Android 的未来。你将获得有关该平台发展方向以及未来可以期待内容的内幕消息。\n\n# 最佳实践、提示、技巧和坑\n\n作为一名\
  \ Mono for Android 开发者，有一些你应该注意的提示、技巧和坑。以下信息有望通过防止你犯下常见错误来提高你的熟练度，并帮助你学习一些省时间的技巧：\n\
  \n* **从设备中删除旧版本**：当发布新版本的 Mono for Android 时，最佳实践是从设备或模拟器中删除所有已安装的 Mono for Android\
  \ 应用以及任何共享运行时或其他 Mono 相关的内容。尽管团队尝试让升级无缝化，但这个简单的做法可以避免很多麻烦！\n\n* **熟悉 ADB**：Mono\
  \ for Android 运行在 Android 工具集上。熟悉各种 ADB 命令行工具：\n    * `adb device` 显示当前连接的设备列表，包括所有正在中的模拟器会话。\n\
  \    * `adb kill-server` 将停止 PC 上正在运行的 ADB 服务器。\n    * `adb start-server` 将重新启动\
  \ ADB。\n\n* **尝试 DDMS**：这是一个不太熟悉的工具。它是一个图形化实用程序，列出所有连接设备和模拟器会话上运行的进程，以及 `adb logcat`\
  \ 输出的装饰视图，并能够创建过滤器。它允许你跟踪内存分配、堆使用和运行的线程。最后，你可以用它控制模拟器，模拟短信、电话和位置。\n\n* **用户软件可能会导致问题**：如\
  \ HTC Sync 等软件可能会给开发者带来问题。如果你遇到问题，请尝试从供应商处卸载此类软件。\n\n* **模拟器需要比默认更大的分区**：默认情况下，你创建的\
  \ Android 模拟器将以 64MB 的分区大小启动。这对于安装 Mono for Android 共享运行时以及用于调试的应用程序来说太小了。你应该通过\
  \ Mono for Android 工具创建并启动模拟器，或者在启动模拟器时通过命令行指定 `-partition-size 512` 或更大。\n\n* **虚拟键盘**：在某些模拟器版本中，你必须在模拟器属性中将键盘支持设置为\
  \ false，以便允许 Android 中的虚拟键盘显示和使用。\n\n* **在项目名称中使用点**：Android 要求包名至少包含一个点（`.`）。如果你创建一个名称中不包含点的项目，Mono\
  \ for Android 会自动创建一个包含点的名称。在很多情况下这运行良好，但如果你以后需要引用你的包名，可能会产生混淆。最佳实践是始终在项目名称中使用点，以避免任何此类混淆。\n\
  \n* **使用 .axml 文件代替 .xml 文件创建用户界面**：Mono for Android 将 `.axml` 识别为定义 Android XML\
  \ 布局文件的特殊文件类型。其内容与 `.xml` 文件无异，但使用此 `.axml` 扩展告诉 Mono 应以特定方式处理该文件。结果是你将在 Visual\
  \ Studio 中获得某些 IntelliSense 支持（参见图 A-1），并且当你遇到问题时将获得更好的错误信息。\n\n* **使用 DroidDraw\
  \ 创建和编辑用户界面**：你可以手动编辑布局文件，但使用如 DroidDraw 等免费工具可以减少标记语法出现错误的概率。\n\n![cd](img/cd.gif)\
  \ 你可以在 http://www.droiddraw.org/ 找到更多关于 DroidDraw 的信息。\n\n* **提高 MSBuild 输出详细程度**：如果你遇到一个毫无意义的错误，尝试进入\
  \ Visual Studio 选项，在 Projects and Solutions 下的 Build and Run，将输出详细程度设置为更高级别（参见图\
  \ A-2）。这应该输出更有意义的错误。\n\n* **在 Visual Studio 中查看 ADB logcat 输出**：Mono for Android\
  \ 包含一个位于 Visual Studio Other Windows 中的窗口，名为 Android Device Logging。当然，你可以在提示符中运行\
  \ `adb logcat` 命令来显示 logcat 输出（假设你已将 SDK 中的 platform-tools 文件夹添加到 PATH 中）。\n\n*\
  \ **物理设备上的调试需要 WiFi**：Mono 调试器需要在物理设备上启用 WiFi。它还要求设备与你要调试的机器处于同一网络。调试器通过 TCP/IP\
  \ 连接，因此没有它将无法工作！\n\n* **三星 Galaxy 设备需要 Android 2.2 或更高版本**：Android 2.1 内核中的一个 会导致所有三星\
  \ Galaxy 设备无法运行 Mono。你必须使用 2.2 或更高版本运行 Mono。\n\n* **注意更新 UI 的异步代码**：每当你想运行更新 UI\
  \ 代码时，都应该在 `RunOnThread()` 运行它，以确保在与 UI 相同的线程上运行。如果不这样做，将会发生意外行为。\n\n* **大型资源无法压缩**：出于某些原因，Android\
  \ 不压缩大小大于 1MB 的资源。解决方法是告诉 Android 不要压缩大于此大小的文件扩展名。遗憾的是，只能按扩展名排除文件，而不能针对单个文件。\n\n\
  * **字符串和字符序列**：在 Android 中，大多数文本显示属性并不是以简单的字符串类型提供的（即使在 Java 中也是如此）。这是因为 Android\
  \ 支持格式化文本（例如 SpannableString）。在 Mono 中，所有此类行为都包含了重载或属性，既针对简单的字符串类型，也针对 `ICharSequence`\
  \ 类型。对于 `TextView`，有一个 `Text` 属性（string）和一个 `TextFormatted` 属性（`ICharSequence`）。\n\
  \n\n\n\n\n*   **默认调试设备**：在 Visual Studio 选项中，Mono for Android 部分中，你可以选择一个调试时使用的默认设备，这样你就不必每次都从列表中选择设备（参见图\
  \ A-4）。\n\n*   **在部署之间保留用户数据**：在 Visual Studio 选项中，Mono for Android 部分，有一个复选框选项可以在应用程序部署之间保留数据/缓存。使用此选项可以确保在调试构建期间，你的设置和本地文件不会被删除。\n\
  \n*   **清理并重新生成**：在许多情况下，对解决方案进行清理（Clean）并全重新生成（Full Rebuild）可以解决无法解释的问题。如果不确定，建议尝试这种方法。\n\
  \n*   **提高模拟器性能**：尝试手动启动模拟器镜像，并指定参数 `-no-boot-anim -scale .75 -partition-size 512`。移除启动动画并更改比例可能会提高模拟器的速度。Mono\
  \ for Android 需要 `512` 的分区大小。\n\n图 A.1\n![A.1](img/bapp01f001.jpg)\n\n图 A.2\n![A.2](img/bapp01f002.jpg)\n\
  \n图 A.3\n![A.3](img/bapp01f003.jpg)\n\n图 A.4\n![A.4](img/bapp01f004.jpg)\n\n# Android\
  \ Honeycomb (3.0) 和 Ice Cream Sandwich (4.0)\n\niPad 启示并定义了平板电脑市场。对 iPad 的第一个真正响应——Motorola\
  \ Xoom——随着 Honeycomb (Android 3.0) 登场。这是一个从未用于手机的 Android 版本，因为它是专为平板电脑设计的。这一版本的为\
  \ Android 在平板电脑外型上的运行引入了许多优化，并有助于塑造 Ice Cream Sandwich (Android 4.0) 的发布，后者将 Android\
  \ 回到通用代码库，以同时针对手机和平板电脑外型。作为一名 Android 开发者，你应该意识到这些新 Android 版本中的许多新特性，其中某些专门与平板电脑有关：\n\
  \n*   **优化的主屏幕**：平板电脑的主屏幕（图 A-5）现在拥有更大的网格空间来放置小部件，并显示比较小手机屏幕能容纳得多的信息。\n\n*   **操作栏（Action\
  \ Bar）**：屏幕顶部始终显示操作栏。此栏的内容可以由应用程序直接控制，因此栏上的操作可以根据当前应用程序以及应用程序内的上下文进行更改。\n\n*   **系统栏（System\
  \ Bar）**：Android 3.0 通过将首页键（Home）和返回键（Back）作为触摸屏控件纳入系统栏，进一步推进软键的概念，而不是要求设备上的硬件按钮。此外，新的最近应用（Recent\
  \ Apps）按钮本质上是一个多任务按钮。它显示最近打开的应用程序的可滚动列表，并带有它们最新状态的快照。系统栏始终可见并随设备旋转，因此它始终位于屏幕的底部。\n\
  \n*   **重新定位菜单和搜索**：为 Android 3.0 和 Android 4.0 设计的新型应用程序可以利用操作栏将菜单选项移动到右上角（参见图\
  \ A-6）。这为开发者在选择哪些菜单选项始终可见方面提供了更大的灵活性。在之前的 Android 版本中，用户只需要知道要按下单个菜单按钮即可。为了支持旧版本，仍然需要菜单按钮的应用程序会在系统栏上显示一个菜单按钮。\n\
  \n*   **通知**：旧的下拉式通知栏消失了。取而代之的是新的类似告警（growl）或吐司（toast）的通知。通知在右下角显示几秒钟（参见图 A-7）；如果没有被点击，它们就会消失。点击系统栏右下角的时钟会导致未清除的通知再次显示，以防错过。\n\
  \n*   **双窗 UI（Two-pane UI）**：Gmail 应用已更新为使用双窗界面（参见图 A-8），类似于 iPad 上的 Mail 应用。这种\
  \ UI 可以通过新的 fragments API 用于其他应用程序。\n\n*   **加密**：Google 已经意识到加密的必要性，这对于许多业务用户来说非常重要。Android\
  \ 3.0 有一个使用 PIN 加密整个设备的选项。此过程需要一些时间，但是\n\n图 A.5\n![A.5](img/bapp01f005.jpg)\n\n\
  图 A.6\n![A.6](img/bapp01f006.jpg)\n\n图 A.7\n![A.7](img/bapp01f007.jpg)\n\n图 A.8\n\
  ![A.8](img/bapp01f008.jpg)\n\n图 A.9\n![A.9](img/bapp01f009.jpg)\n\n# Fragments 处处可用！\n\
  \nAndroid 3.0 Honeycomb 通过一个新的库实现了它的一些新特性。Fragments 允许你在单个活动（activity）中创建具有多个显示器的界面。\n\
  \n以 Gmail 应用为例：在 Android 手机上，Gmail 显示的电子邮件列表占据整个屏幕。当用户点击某封电子邮件时，会打开另一个带有详情的活动，从而从用户的视图中移除电子邮件列表。（等等，让我们重新检查特定流程的文本逻辑：“从用户的视图中移除电子邮件列表”）。由于平板电脑上有更大的屏幕可用空间，因此使用\
  \ fragments 同时显示电子邮件列表和所选电子邮件的详情是合理的。\n\nFragments 允许你作为开发者在屏幕上同时显示通常是两个活动的内容。图\
  \ A.9 说明了左侧传统的多个活动方式，以及右侧新的 fragments 使用方法。\n\n由于 fragments 是如此重要的新 UI 元素，Google\
  \ 决定将其功能整合到一个静态库中，一直兼容到 Android 1.6。这对于仍运行 Android 2.2 或 2.3 的平板设备尤为重要。\n\n![note](img/note.gif)截至\
  \ 4.0 版本，Mono for Android 仅支持 Android 3.0 及以上的 fragments。它尚未支持 fragments 兼容库。预计该库的绑定将在后期发布，因为\
  \ Mono for Android 团队正在开发一种工具来帮助将 .jar Android 库绑定到 .NET。在此期间，可以使用托管 Android 可调用封装器（Callable\
  \ Wrappers）编写自己的绑定，这允许你直接调用 Android 或 Java 代码。你可以在 Xamarin 创建的 Mono for Android\
  \ 支持网站 (http://support.xamarin.com/) 上了解更多。\n\n* * *\n\n# Android 版本与设备碎片\n\n在短短两年内，Android\
  \ 从 1.5 版本发展到了 3.0 版本，在平台运行方式和提供的功能方面发生了许多变化。从开发者的角度来看，Google 在维护 API 向后兼容方面做得很好。遗憾的是，某些\
  \ Android 版本包含旧版本不具备的新功能（例如 Cloud 2 设备消息）。这使得作为开发者，决定在应用程序何时何时新功能变得更加困难。你不想排除使用旧版本\
  \ Android 的用户；但你也想给使用新版本的用户提供最好的体验！\n\n\n\n\n\nAndroid 的开放性以及许多不同制造商和运营商在设备上使用 Android\
  \ 的事实，加剧了版本控制问题。由于 Google 并不生产自己的设备，他们无法控制制造商或运营商何时（如果会）选择为用户的设备提供更新。这意味着即使 Google\
  \ 已经发布了新版本，某些用户也无法在设备上获得最新版本的 Android。其他用户可能必须等待其设备制造商发布更新，这往往比 Google 发布最新 Android\
  \ 版本晚上几个月。\n\n![note](img/note.gif)Google 提供了每个操作系统版本的活跃 Android 设备百分比数据。你可以在 `http://developer.android.com/resources/dashboard/platform-versions.html`\
  \ (Android 开发者控制台资源/仪表板/平台版本) 找到这些信息。\n\n开发者面临的另一个问题是设备碎片化。同样，由于 Google 不控制 Android\
  \ 运行在哪些硬件上，许多制造商创建了许多不同的硬件组合。不同的处理器速度、内存大小、存储容量和屏幕分辨率意味着目标设备可能有无限的组合。\n\n如果你遵循 Android\
  \ 开发用户界面的最佳实践，在大多数情况下，你的应用程序应该能够缩放以适应任何屏幕分辨率。你还应该始终让应用程序尽可能高效。这将有助于确保你的应用程序无论设备性能强如何都能流畅运行。\n\
  \nGoogle 已经意识到这些碎片化问题，并正尝试通过几种方式解决它们：\n\n1. 将应用程序移出核心操作系统：Google 已将 `Gmail`、`Maps`\
  \ 以及其他一些应用程序移动到 `Market`（市场），而不是为了解决这些应用程序而向 Android 发布更新。这意味着他们可以专注于核心操作系统的更新，并希望发布更新的频率更低。\n\
  2. 以库的形式发布新 API：`fragments` 库向后兼容到 Android 1.6，这意味着开发者无论 Android 版本如何，都可以使用这些新功能。\n\
  3. 早期访问计划：Google 计划通过实施非碎片化政策作为制造商获得早期访问未来 Android 版本的条件，来加强对 Android 的控制。\n\n尽管\
  \ Google 试图限制碎片化，但对于你作为 Android 开发者来说，这是一个必须继续面对的现实。如果可能，请在各种设备和配置上测试你的应用程序，并根据最佳实践编写代码，这样碎片化问题就不会听起来那么可怕了！\n\
  \n# Mono for Android 的后续计划是什么？\n\nMono for Android 1.0 是一个巨大的里程碑，兼容了 OSX 上的 MonoDevelop\
  \ 和 Windows 上的 Visual Studio 2010。该版本的发布带有完整的模拟器和设备调试支持，以及与大多数 Java Android API\
  \ 的绑定（绑定允许我们从 `.NET` 代码中调用 Java Android API 方法）。1.2 版本带来了一些急需的稳定性改进和进一步的绑定。4.0 版本是迄为止最重大的发布，它包含了比之前版本的许多改进：\n\
  \n* Android 3.0 和 Android 4.0 的 API 支持\n* Google Map API 绑定\n* 启动性能提升——启动时间和部署大小约改进了\
  \ 50 百比\n* 垃圾回收修复和更快的调试部署\n* Java 7 的支持\n\nMono for Android 的首次发布只是开始，未来的版本中已经计划了几个新功能。以下是你可以在接下来的\
  \ Mono for Android 版本中预期的一些内容：\n\n* 更多的 Android 绑定：虽然大多数关键绑定已经包含在 Mono for Android\
  \ 中，但仍然有一些缺失。预计未来对 Java Android API 将有更完整的覆盖。\n* 更多面向 .NET 的 API：Java API 并不总是能很好地转换为最优的\
  \ .NET API。预计将在 Java Android API 中看到更多事件模式、原生 .NET 类型使用以及其他 .NET 模式。这在 4.0 版本中有了显著提高，对\
  \ .NET 风格事件的支持更好，并且与 Java 风格常量的兼容性使得 Java 代码更容易迁移，但团队继续努力以更符合 .NET 的方式暴露 Android\
  \ API。\n* 绑定生成工具：Mono for Android 开发者正在开发一种工具，允许开发者为任何 Java 库（`.jar`）生成 .NET 绑定。这意味着你将直接在\
  \ Mono for Android 中使用任何第三方 Android 或 Java 库！\n* Fragments 库：目前只有当你使用 4.0 版本并目标指向\
  \ Android Honeycomb (3.0) API 级别时，Mono for Android 中才有 fragments 库的绑定。希望未来的 Mono\
  \ for Android 版本也将支持 fragments 兼容库。\n* Bug 修复：他们正在不断工作以解决出现的 Bug。预计未来将会有更稳定、Bug\
  \ 更少的发布。\n* GUI 设计器：在写作时，Xamarin 已经开始为 Android XML 布局开发图形化设计器。这应该出现在 Mono for Android\
  \ 的下一个版本中。\n\n![note](img/note.gif)你可以在 [`bugzilla.xamarin.com/`](http://bugzilla.xamarin.com/)\
  \ 提交发现的 Bug。这是快速解决你问题的最佳方式！\n\n* 性能改进：Mono for Android 初期发布的主要重点是让功能运行起来。随着越来越多的\
  \ Bug 被修复，重点自然会转向提高 Mono for Android 应用程序的性能，包括更快的应用程序执行和启动时间、更低的内存占用以及更小的应用程序包。\n\
  \n## 使用 Xamarin.Mobile 实现跨平台移动功能\n\nXamarin 正在努力的新计划之一被称为 Xamarin.Mobile。通过 Mono\
  \ for Android、MonoTouch 和 Windows Phone 7，已经可以在三个移动平台之间共享一些公共 C# 代码。然而，对于用户界面、联系人和日历等\
  \ API，仍然需要编写特定平台的代码。这正是 Xamarin.Mobile 发挥用场的地方。它的目标为此类 API 创建一个通用库，以便你只需为位置服务等功能编写一次代码，即可在所有三个平台上运行运行。\n\
  \n在写作时，Xamarin.Mobile 只支持地理定位（Geolocation），但已经计划将其他几个功能整合到库中：\n\n* 联系人\n* 地理定位\n\
  * 指南针和加速度计\n* 视频和音频\n* 通知\n\nXamarin.Mobile 应该继续让使用 C# 开发跨平台移动应用程序变得轻而易举。即使你只针对\
  \ Android，这个库也应该简化在 Android 应用程序中使用其包含的功能。\n\nAndroid 席卷了移动世界，现在占据了移动领域的很大份额。它已经成为一个功能非常强大且强大的产品。得益于\
  \ Mono for Android，你可能为 Android 创建出出色的原生移动应用程序。有了前面的路线图，Mono for Android 开发者的前景看起来非常美好，而且未来只会变得更好！！Title\
