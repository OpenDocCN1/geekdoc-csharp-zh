  \n# 使用 LINQ 和 XML 获取数据\n\n本节介绍如何获取 XML 中的数据并使用 LINQ。在这个示例中，我们将使用 API 从 Twitter 返回数据。LINQ\
  \ 是一组方法、操作、规则和类型，允许在 Visual Basic 或 C# 等 .NET 语言中进行数据查询。LINQ 最初包含在 .NET 3.5 框架中发布，而\
  \ Mono 项目提供了对多种数据提供程序的 LINQ 支持。\n\nLINQ to XML 是一项技术，它允许 XML 文档转换为 `XElement` 对象，根据某些标准进行查询，并转换为对象集合。查询在本地执行引擎中执行。在\
  \ Listing 5.14 中，对 Twitter API 发起了一个异步请求，以返回特定用户的时间线——在本例中就是我自己的。\n\n![download](img/download.gif)\
  \ Listing 5.14: 使用 XML 和 LINQ 的 GET 操作\n\n```c\nvoid btnRESTXML_Click(object sender,\
  \ EventArgs e)\n{\n    string Url =\n\"http://api.twitter.com/1/statuses/user_timeline.xml?screen_name=wbm\"\
  ;\n    try\n    {\n        // Create the web request\n        HttpWebRequest request\
  \ = WebRequest.Create(Url) as HttpWebRequest;\n        request.Method = \"GET\"\
  ;\n        request.ContentType = \"application/xml\";\n        request.BeginGetResponse(new\n\
  \            AsyncCallback(ProcessRestXmlLINQHttpResponse),\n            request);\n\
  \    }\n    catch (WebException we)\n    {\n        tv.Text = we.Message;\n    \
  \    Android.Util.Log.E(\"http request\", \"Exception: \" + we.Message);\n    }\n\
  \    catch (System.Exception sysExc)\n    {\n        tv.Text = sysExc.Message;\n\
  \        Android.Util.Log.E(\"http request\", \"Exception: \" + sysExc.Message);\n\
  \    }\n}\n\nvoid ProcessRestXmlLINQHttpResponse(IAsyncResult iar)\n{\n    try\n\
  \    {\n        HttpWebRequest request = (HttpWebRequest)iar.AsyncState;\n     \
  \   HttpWebResponse response;\n        response = (HttpWebResponse)request.EndGetResponse(iar);\n\
  \        System.IO.StreamReader strm = new System.IO.StreamReader(\n           \
  \ response.GetResponseStream());\n        //string responseString = strm.ReadToEnd();\n\
  \        System.Xml.Linq.XDocument xd = XDocument.Load(strm);\n        var twt =\
  \ (from x in xd.Root.Descendants(\"status\") where x != null\n                 \
  \   select new Tweet\n                    {\n                        StatusId =\
  \ Convert.ToInt64(x.Element(\"id\").Value),\n                        UserName =\
  \ x.Element(\"user\").\n                            Element(\"screen_name\").Value,\n\
  \                        ProfileImage = x.Element(\"user\").\n                 \
  \           Element(\"profile_image_url\").Value,\n                        Status\
  \ = x.Element(\"text\").Value,\n                        StatusDate = x.Element(\"\
  created_at\").Value\n                    }).ToList<Tweet>();\n        Response.Close();\n\
  \        this.RunOnUiThread(() => tv.Text = \"records: \" + twt.Count.ToString());\n\
  \        Android.Util.Log.D(\"http response\", \"finished\");\n    }\n    catch\
  \ (System.Exception sysExc)\n    {\n        Android.Util.Log.E(\"http response\"\
  , \"Exception: \" + sysExc.Message);\n        this.RunOnUiThread(() => tv.Text =\
  \ \"Exception: \" + sysExc.Message);\n    }\n}\n```\n\n此代码包含在 `WebServices\\WebServices\\\
  Activity1.cs` 中。\n\n在此示例中，对 Twitter API 执行了查询以获取用户的时间线。程序化步骤如下：\n\n1. 对 Twitter\
  \ API 发起异步请求以获取用户的时间线。\n2. 当数据返回时，它从响应流被加载到 `XDocument` 中。\n3. 针对 `XDocument` 构建一个查询。当执行查询时，数据从\
  \ XML 格式转换为对象集合。\n4. 在枚举结果时执行 LINQ 查询。通过调用 `ToList()` 方法来触发数据检索。\n\n你可能已经注意到代码是以异步方式发起请求的。执行同步操作有一个负端：在无线网络上执行同步操作可能会冻结应用程序。解决此问题最简单的方法是异步异步执行该操作。\n\
  \n## 使用异步数据检索\n\n对 Web 服务进行异步调用是可能的。虽然 Android 的多任务处理能力有限，但通过 Mono 进行异步调用是可能的。另一个优点是，通过与\
  \ .NET 完全相同的 API 完成的。大多数开发者可能熟悉 .NET 的异步编程方法 `BeginXXX`/`EndXXX`。\n\n在 Listing 5.14\
  \ 中，代码对 API 发起了异步请求。\n\n以下是该代码的细节：\n\n1. 设置了调用的 URL。该 URL 是一个基于 REST 的 XML 服务。此方法返回一组用户状态和\
  \ ID 信息、图像以及可以从 XML 中提取的类似信息。\n2. 将 HTTP 请求设置为 XML MIME 类型。\n3. 异步发起 HTTP 请求。设置了回调，以便当数据从\
  \ Web 服务返回时，调用方法来处理数据。\n4. `ProcessRestXmlLINQHttpResponse` 方法获取服务返回的结果。\n5. 在 `ProcessRestXmlLINQHttpResponse`\
  \ 回调方法（Listing 5.14）中，有两点需要注意：\n\n* 使用 LINQ 将 XML 序列化为对象列表。\n* 在检索数据后，关闭 `HttpWebResponse`\
  \ 是重要的。\n\n# 负责任地使用 Web 服务\n\n现在你已经学习如何在 Mono for Android 中以各种形式使用 Web 服务，让我们来看一些问题。Web\
  \ 服务是执行以下任务 Excellent 工具：\n\n* 构建在互联网上运行的应用程序。由于它们运行在 80 端口，通信被阻塞的可能性非常小。\n* 保持信息的集中化。\n\
  * 轻松允许不同的系统之间进行通信。\n\n同时，无线网络上的 Web 服务也有一些缺点：\n\n\n\n\n*   Web 服务通常比较慢。通过文本格式（如\
  \ `JSON` 或 `XML`）发送信息可能比通过二进制/压缩协议发送相同信息要慢。\n*   无线通信通常是不可靠的。\n*   通过许多网络（互联网就是如此）发送数据往往是不可靠的。\n\
  \n因此，记住以一种负责任的方式使用 Web 服务至关重要：\n\n*   对于发送到 Web 服务以及返回到 Android 的数据量要保持高效。没有理由让\
  \ Android 或与 Web 服务的连接负载过重。\n*   Android 会等待 20 秒让用户代码执行完毕。20 秒后，正在执行的代码将终止。因此，异步或在另一个线程中调用\
  \ Web 服务是很有意义的。\n\n# 与远程 SQL Server 数据库交互\n\n企业生存在数据之上。许多公司将其数据保存在私有数据库中，存储在企业防火墙之后。公司最不希望的事情，最不希望的是其内部数据出现在移动设备上，或者以某种\
  \ Web 服务的形式暴露在互联网上。问题可能在于它们有安全顾量，或者不知道如何通过 Web 服务安全地暴露其数据。因此，让我们通过其他方式获取数据。\n\n\
  许多应用程序是企业内部的，被称为“业务线”（line of business）应用程序。这些应用程序通常很枯燥，且不在 Android 市场中销售，但它们对组织的日常运营至关重要。\n\
  \n驱动这些应用程序的数据并未暴露给外部世界。它们仅在企业防火墙后可用。这些数据可能是客户信息、制造环境中某产品的物料清单，或酒店住宿信息。这些信息对于向公众公开并不一定有意义，但对于公司来说却非常重要。对于\
  \ .NET 领域的开发者来说，这些信息存储在如 `SQL Server`、`Oracle`、`MySQL` 或其他基于服务器的数据库中。\n\n幸运的是，Mono\
  \ for Android 包含了 `Mono.Data.Tds.dll` 程序集。该程序集以及相关的命名空间支持通过表格数据流协议（tabular data\
  \ stream protocol）与数据库通信。这意味着你可以从 Mono for Android 应用连接到 `SQL Server` 数据库。这种通信是直接通过表格数据流（TDS）应用层协议完成的。该数据库包含了\
  \ .NET 开发者熟悉的连接、命令、数据适配器和数据集对象的支持。\n\n代码列表 5.15 显示了针对 Android 设备的 `SQL Server` 数据库进行查询的一些示例代码。\n\
  \n![下载](img/download.gif) 代码列表 5.15: 执行 `SqlClient` 命令\n\n```\nSystem.Data.SqlClient.SqlConnection\
  \ sqlCn =\n      new System.Data.SqlClient.SqlConnection();\nSystem.Data.SqlClient.SqlCommand\
  \ sqlCm =\n      new System.Data.SqlClient.SqlCommand();\nSystem.Data.SqlClient.SqlDataAdapter\
  \ sqlDa =\n      new System.Data.SqlClient.SqlDataAdapter();\nDataTable dt = new\
  \ DataTable();\nstring strSql = \"select * from table\";\nstring strCn = \"............\"\
  ;\nsqlCn.ConnectionString = strCn;\nsqlCm.CommandText = strSql;\nsqlCm.CommandType\
  \ = CommandType.Text;\nsqlCm.Connection = sqlCn;\nsqlDa.SelectCommand = sqlCm;\n\
  try\n{\n    sqlDa.Fill(dt);\n    tv.Text = \"Records returned: \" + dt.Rows.Count.ToString();\n\
  }\ncatch (System.Exception sysExc)\n{\n    Console.WriteLine(\"Exc: \" + sysExc.Message);\n\
  \    tv.Text = \"Exc: \" + sysExc.Message;\n}\nfinally\n{\n    if (sqlCn.State !=\
  \ ConnectionState.Closed)\n    {\n        sqlCn.Close();\n    }\n    sqlCn.Dispose();\n\
  \    sqlCm.Dispose();\n    sqlDa.Dispose();\n}\n```\n\n此代码包含在 `\\InternalNetworkData\\\
  InternalNetworkDataActivity1.cs` 中\n\n图 5.2 显示了来自数据库查询的一些输出。\n\n图 5.2\n\n![5.2](img/c05f002.jpg)\n\
  \n你应该意识到关于 Mono TDS 支持的几个重要点：\n\n*   目前，Mono for Android 对 TDS 协议的支持是实验性的。不要依赖它来实现过多的高级功能。\n\
  *   Mono TDS 支持仅在允许其运行的端口上工作。如果必要的端口被阻塞，连接将无法正常工作。虽然这在企业内网中很可能不是问题，但在公共互联网上这是一个主要问题，因为端口可能会被服务提供商阻塞。\n\
  *   极少数 Android 设备具有有线网络端口。它们通常通过 Wi-Fi 和移动（3G/4G）网络通信。为了与 `SQL Server` 工作而开放端口会增加攻击面。除非采取极其谨慎的态度并对可能出现的问题进行预见，否则这种端口开启通常会受到企业\
  \ IT 和安全部门的反对。\n\n# 总结\n\n本章查看了 Android 数据策略。通过这些技术，你可以在网络不可用时构建应用程序。你学习了：\n\n*\
  \   在 SQLite 中设置数据库\n*   针对 SQLite 执行命令\n*   使用基于 SOAP 的 Web 服务\n*   使用基于 REST 的\
  \ Web 服务\n\n当可以使用 Web 服务时，Android 开发者及其应用程序就可以与数据存储集成。这允许应用程序的用户与其他用户进行交互。\n\n#\
  \ 第 6 章将数据绑定到控件\n\n## 本章内容\n\n*   研究数据绑定如何在 Mono for Android 中工作\n*   理解适配器（adapter）\n\
  *   理解适配器视图（adapter view）\n*   探索原生适配器和视图\n*   处理游标（cursor）和列表\n*   使用选择器（spinner）和游标\n\
  *   使用 Gallery 控件\n*   处理嵌套导航\n*   处理分组列表\n*   使用 GridView 显示数据\n\n到为止，我们已经涵盖了创建\
  \ Android 应用的基础组件。我们从视图和生命周期开始，通过涵盖不同的数据访问方式完成了功能介绍。现在我们可以开始关注支持这些交互的不同方法。\n\n本章重点关注使用基础\
  \ Android 组件为应用程序构建数据驱动的界面。数据集与用户界面耦合的过程被称为数据绑定（databinding）或简单的绑定（binding）。尽管 Android\
  \ 的数据绑定机制与其他方法（特别是 ASP.NET）有所不同，但 Android 平台有一种优雅且简单的方法可以将丰富数据快速推送到视觉界面。\n\n在涵盖\
  \ Android 数据绑定基本概念的同时，我们将遍历几个不同的数据绑定场景。这是任何应用程序的常见活动，因此我们希望提供对 Mono for Android\
  \ 提供的不同工具的样化介绍，以帮助你开发应用程序。与任何编程语言一样，有许多方法可以实现数据绑定目标。因此，本章不仅将展示实现什么，还将在许多选项中说明哪种方法最合适。\n\
  \n\n\n\n本章假设你已经具备 Android 呈现机制的基础工作知识，例如 `views`、`viewgroups` 和 `layouts`。此外，本章使用了不同的数据源，例如不同的内容提供者。由于本章侧重于数据绑定，我们不会花费大量时间来回顾这些数据是如何生成的。关于这些主题的更多信息，请参阅之前的章节（如第\
  \ 5 章），或利用本章的代码下载来与代码示例中的数据查询部分进行交互。\n\n![note](img/note.gif)`databinding` 一词通常具有不同的含义，取决于你所的工作环境。它有时意味着\
  \ UI 与数据源之间的紧密集成，即所谓的双向绑定。在这种情况下，我们使用的是 `databinding` 的通用定义，它仅仅是数据到 UI 的单向绑定。\n\n\
  # Mono for Android 中的数据绑定\n\nMono for Android 中的数据绑定故事实际上简单。数据绑定主要通过使用三个不同的组件来实现：\n\
  \n- **基础视图 (A basic view)**：此视图作为绑定目标，其主要责任是承载所绑定数据集中单个数据实体的用户界面布局。在生成整个布局时，该视图会被重复多次。\n\
  - **数据适配器 (Data adapter)**：它充当管理数据集与适配器视图之间桥梁的控制器。数据适配器通过控制数据集中每个实体的基础数据项视图的生成来实现。\n\
  - **适配器视图 (Adapter view)**：这是一种 `viewgroup`，支持为绑定数据集包含的每个数据项动态生成子视图。此视图的作用与任何其他\
  \ `viewgroup` 一样，控制子控件的布局和流。然而，与 `viewgroup` 不同，你不能直接添加或删除视图。\n\n如果你熟悉其他数据绑定模式（例如\
  \ .NET 中的模式），你可能会发现这种模式过于复杂，因为数据适配器引入了新的复杂性。然而，正如你稍将看到的，这种额外的复杂性提供了一些很棒的功能，不仅让你的生活更轻松，还让你的应用程序更加稳定。\n\
  \n## 什么是数据适配器？\n\n正如刚才所述，数据适配器是数据绑定并传递到用户界面控件的通道。你可以将它们视为数据绑定操作的“中间人”。数据适配器的核心功能是获取请求的数据实体，将其绑定到适当的视图项，并将该视图传递给适配器视图。除了这些基础理解外，了解关于数据适配器的其他几个关键事实也是很有益的：\n\
  \n- 数据适配器负责生成属于适配器视图上下文的子视图。当你声明数据适配器时，你需要传入一个你想要作为重复项模板的视图引用。所传递的视图范围可以涵盖从大量的预定义\
  \ Android 视图列表、按钮或图像等控件，甚至是你自己自定义的布局。适配器支持的视图类型由适配器来决定。\n- 数据适配器是动态的。数据适配器不需要在绑定之前指定在屏幕上显示的项数，它们拥有一种机制，允许适配器视图确定需要多少个元素来填充其分配的空间。\n\
  - 数据适配器可以注册观察者来监控数据更新。为了处理绑定后绑定发生变化的情况，你可以注册观察者来监控这些变化，并在事件发生时采取适当的操作。并不是所有数据适配器都支持此功能。\n\
  \n## 什么是适配器视图？\n\n适配器视图是一种特殊的 `viewgroup`。与其他 `viewgroup` 类型一样，它的主要目的是成为一个包含子视图的视图。因此，适配器视图决定了其子视图布局的呈现。除了这项任务，适配器视图在这一关系中还扮演着其他特殊角色：\n\
  \n- 适配器视图控制屏幕上显示的项数。这是一个关键理解。虽然适配器负责交付供适配器显示的数据绑定视图，但必须由适配器视图来告诉适配器到底生成多少个视图。这一方面在数据绑定公式中至关重要，因为它允许适应各种屏幕尺寸并有助于内存管理。我们稍后会详细介绍。\n\
  - 适配器视图包含响应项目选择的事件，以及请求绑定数据实体的机制。在与适配器视图一起时，你可以根据用户交互轻松构建响应式布局。此外，获取对应的数据项是一件小事，无需通过极端手段寻找原始项。\n\
  - 适配器视图可以支持对其子项执行动画的逻辑。在处理水平或垂直滚动列表等项目时，能够引入平滑动画来提高用户体验是非常好的。这种处理继承自 `ViewGroup`\
  \ 类。\n\n## 这些项目是如何相互关联的？\n\n现在你已经对数据绑定场景中的参与者有了基本了解，请花些时间理解数据绑定组件是如何相互作用的。图 6.1\
  \ 显示了这三个组件之间的关系。\n\n图 6.1\n\n![6.1](img/c06f001.jpg)\n\n如你所示，数据绑定过程始于适配器视图。视图从数据适配器请求下一个数据项视图。数据适配器反过来使用绑定的数据存储来填充适当的数据视图，从而生成相应的视图。然后，数据适配器将数据项视图发送回适配器视图，以填充窗口空间中的下一个区域。这个过程不断迭代，直到可见区域被数据项视图填充。适配器视图足够智能，可以检测视图何时不再位于可见区域并停止从数据适配器请求新视图。\n\
  \n## 使用适配器视图和大型数据集工作\n\n在处理大型数据集时，开发者往往很难在管理数据集和提供快速、响应的 UI 之间找到完美平衡。即使是简单的日常屏幕，如联系人列表、浏览器书签和已安装应用程序，随着用户开始向这些项目添加越来越多的数据，也可能变得繁琐。\n\
  \n想象你正在创建一个书签编辑器应用程序。该书签编辑器使用存储在 Android 内容提供者中的书签数据。加载时，应用程序需要创建所有现有书签的列表。一旦加载了初始项目，用户可能需要上下滚动列表以查看每种可能性。根据你目前对适配器工作原理的理解，你可以对你的列表视图在这种情况下如何工作做出一些假设。特别是，考虑当用户开始快速上下滚动此列表时会发生什么。图\
  \ 6.2 显示了这种流程在 Android 中可能是如何工作的。\n\n![note](img/note.gif)这不是过程的工作方式；它仅仅代表了你可能认为过程将运作。此图的关键在于指出该模型中的缺陷。\n\
  \n图 6.2\n\n![6.2](img/c06f002.jpg)\n\n\n\n\n\n正如从这个示例所示，关于此应用程序工作方式的常见假设是：每当用户向上或向下滚动屏幕时，都需要创建一个新的视图。对于短列表或操作缓慢的用户来说这可能还好，但当你有\
  \ 50 个书签时会发生什么？100 个呢？当用户快速滑动屏幕时会发生什么？或者当他们快速返回时会发生什么？\n\n此外，随着屏幕的每次移动，你都在创建和销毁新视图。创建视图是非常昂贵的基本操作之一，特别是当你正在加载（infl）一个自定义布局时。\n\
  \n幸运的是，原生 Android 适配器（adapters）的行为并非如此。当你创建自己的自定义适配器时，也不应该这样指示这些适配器运行。与其在用户每次滚动屏幕时都经历创建新视图的过程，不如回收已经出屏幕的视图并将其用作新视图？图\
  \ 6.3 描述了这种模型。\n\n在图中，Android 运行时使用了被称为回收器（recycler）的东西。当你滚动列表视图时，一个列表项与下一个列表项之间最大的区别就是数据本身。因此，只要你关联了适当的数据，你所绑定的数据项视图是新生成的还是之前使用过的，区别并不大。\n\
  \n原生数据适配器具有回收超出可见区域视图对象的功能。当它们执行此操作时，旧视图通过推送新数据被“转换”为新视图。这避免了创建新视图对象的负担，极极提高你的适配器的性能！\n\
  \n![note](img/note.gif)想测试此功能吗？你可以轻松地做到。通过重写适配器的 `GetView()` 方法，你可以插入逻辑来记录视图被回收的时间与被创建的时间。此外，你甚至可以关闭回收以衡量性能差异。以下代码段包含了记录列表适配器回收过程的逻辑：\n\
  \n```\n public int NewViewIter = 0;\npublic int RecycledViewIter = 0;\n\npublic\
  \ override View GetView(int position, View convertView,\n  ViewGroup parent)\n{\n\
  \     if (convertView == null)\n     {\n          NewViewIter++;\n          Console.WriteLine(String.Format(\"\
  New View #{0}\",\n            NewViewIter));\n\n          var NewView = new View();\n\
  \          // TODO:  Add implementation code here!\n          return NewView;\n\
  \     }\n     else\n     {\n          RecycledViewIter++;\n          Console.WriteLine(String.Format(\"\
  Recycled View #{0}\",\n            RecycledViewIter));\n\n          return (View)convertView;\n\
  \     }\n```\n```\n\n* * *\n\nFigure 6.3\n\n![6.3](img/c06f003.jpg)\n\n## 深入探索适配器\n\
  \n从核心上说，适配器是非常基础工具。由于它们本质上是数据集和适配器视图之间的中间人，它们的大部分方法和函数都属于此用途。诸如 `GetCount()`、`GetItem()`\
  \ 和 `IsEmpty()` 等函数是为了确保详尽的通信通道。\n\n这些基础函数之外，适配器通常还实现了另外两个重要的函数/方法：\n\n*   `GetView()`\
  \ 是适配器最关键的部分之一。当适配器视图请求下一个视图时，会调用此方法。此外，这是适配器可以决定是否回收一个预存（但不可见）视图对象的地方。\n*   `RegisterDataSetObserver()`\
  \ 允许你的适配器响应其处理的数据集更新或失效的情况。\n\n## 使用原生适配器\n\n由于适配器在数据绑定故事中扮演着至关重要的角色，你会在许多不同的语境下使用它们。虽然你有自己编写自定义适配器的选项，但\
  \ Android 运行时有几个原生适配器，涵盖了许多不同的用例。表 6.1 原生 Android 适配器\n\n| 适配器 | 说明 |\n| :--- |\
  \ :--- |\n| Base adapter | 这是适配器的通用抽象类。它为某些原生适配器（如 `ListAdapter` 和 `SpinnerAdapter`）提供了框架。此外，在考虑创建自己的自定义适配器时，这是一个很好的起点。\
  \ |\n| Simple adapter | 此适配器的目的是允许在静态数据映射和 XML 文件中定义的视图之间进行轻松绑定。当你需要将复杂数据对象绑定到视图或将任何类型的数据绑定到复杂的数据项视图时，应考虑使用它。\
  \ |\n| Array adapter (generic) | 此适配器可将对象数组绑定到 `ListView`。通常，涉及此种关系的数据项视图是一个简单的文本视图。然而，你可以通过不同的构造函数直接将值映射到复杂视图内的目标\
  \ ID，从而使用更复杂的视图作为数据项。 |\n| Cursor adapter | 游标适配器有两种类型：`CursorAdapter` 和 `SimpleCursorAdapter`。游标适配器用于桥接游标和适配器视图（如\
  \ `ListView`）。游标返回的所有项都通过 ID 字段访问，该字段的作用类似于数据库中的主键。`SimpleCursorAdapter`可以将游标列映射到不同的视图类型，例如\
  \ `TextViews` 或 `ImageViews`。 |\n| Head view list adapter | 当你的 `ListView` 不仅包含数据视图还包含头部和页脚视图时，可以使用这种适配器。与其尝试管理复杂的\
  \ UI，可以使用这种适配器。 |\n| Resource cursor adapter | 这是一个用于直接将游标数据绑定到 XML 布局的简单适配器。 |\n\
  | Spinner adapter | 创建此适配器专门专门用于处理数据到 `Spinner` 的绑定。 |\n| Wrapper list adapter |\
  \ 用于需要嵌套 `Adapters` 的情况。`ListAdapter` 封装了另一个 `ListAdapter`，并包含了通过 `GetWrappedAdapter()`\
  \ 方法调用内部适配器的逻辑。 |\n\n## 深入探索适配器视图\n\n适配器视图是很有趣的对象。尽管它们在许多方面表现得像 `viewgroup`，但适配器视图内置了更多的智能性。它们的主要角色之一是让适配器知道适配器视图何时需要列表中的另一个项。适配器实现了几个函数来协助这一过程：\n\
  \n*   `GetFirstVisiblePosition()`\n*   `GetLastVisiblePosition()`\n\n这些自而易见的方法使适配器视图知道何时与适配器通信。特别是在你考虑回收视图时，它们是至关重要的。\n\
  \n尽管适配器视图继承自 `ViewGroup` 类，但需要注意的是它不支持许多常用的 `ViewGroup` 方法。特别是，`ViewGroup` 类中大多数向适配器添加或删除子视图的方法都会抛出\
  \ `UnsupportedOperationException`。通常，向 UI 添加数据项或视图的最好方法是在数据集级别添加，而不是在 `AdapterView`\
  \ 级别添加。在需要引入头部、页脚或换行符的情况下，请确保使用相应的原生适配器和视图，而不是尝试在 `AdapterView` 级别注入额外的列表项作为头部。\n\
  \n最后，适配器视图还有另一个方法，允许你在呈现视图数据项时对其进行操作。通过使用 `SetEmptyView()` 方法，你可以在绑定的适配器为空时指定一个要显示的视图。例如，如果你有一个列出搜索结果的\
  \ `AdapterView`，这为你提供了返回“未找到结果”消息的功能，而不是空白屏幕。\n\n\n\n\n\n# 使用原生适配器视图\n\n与适配器一样，Android\
  \ 平台暴露了多种不同的原生适配器视图。由于适配器视图的主要目的是定义其子视图的布局，因此大多数不同的适配器视图仅在这一点上有所不同。表 6.2 列出了常见的适配器视图并描述了它们的用途。\n\
  \n表 6.2 原生适配器视图\n\n| 适配器 | 描述 |\n| :--- | :--- |\n| `ListView` | 除了 `Spinner` 之外，这可能是最常用的适配器视图，因为它是最多性的之一。该适配器视图用于在垂直或水平列表中显示项目。\
  \ |\n| `Gallery` | 此视图的目的是在一个以中心为焦点的水平滚动列表中显示项目。正如其名所示，它是展示图像系列或基于视觉视图的绝佳工具。 |\n\
  | `GridView` | 你可以将此视图视为 `Gallery` 和 `ListView` 的混合体，因为它可以在水平和垂直方向上都包含重复的项目。 |\n\
  | `Spinner` | 是一种特殊的视图，用于模拟常见的下拉列表或选择框。虽然 `spinner` 有一些局限性，但它是为用户提供一组方便其从中进行选择的极佳方法。\
  \ |\n\n# 使用游标 (Cursors)\n\n在处理内容提供程序或任何使用 SQLite 存储系统的内容时，你需要处理游标（cursors）。在 Mono\
  \ for Android 中，游标对象由 `ICursor` 接口表示，该接口暴露了处理结果数据集所需的所有方法。这是对 Android 平台上 `Cursor`\
  \ 接口的直接适配。\n\n游标提供了对查询结果的访问，同时提供了许多不同的访问方式。通过将游标移动到适当的位置然后从适当的列索引请求数据类型，就可以访问数据。处理游标的过程在第\
  \ 3 章中已经介绍过，但重要的是，游标应该被视为敏感资源。在不再使用或通过 activity 的 `ManagedQuery()` 方法绑定到 activity\
  \ 的生命周期时，应当关闭它们。\n\n以下示例探索了在绑定到两种不同类型的适配器视图时使用游标的方法。\n\n## 使用游标填充 Spinner\n\n下一个示例查看了将游标绑定到简单\
  \ `spinner` 的过程。虽然这是一个非常显而易见的示例，但对与 `ICursor` 接口的操作有良好的基础理解是非常重要的。在编写本文时，Android\
  \ 中关于 `spinner` 和 `Cursor`（或 Mono for Android 中的 `ICursor`）的文档并不理想。希望这一部分能够增强或填补现有功能文档中的空白。\n\
  \n假设你被要求创建一个应用程序，允许用户查看设备上的所有当前书签。该应用程序只需要列出用户所有的书签，并允许他们从列表中选择其中一个。在考虑此任务后，决定尝试以下步骤来让你的应用程序运行：\n\
  \n1. 使用浏览器内容提供程序查询书签。该内容提供程序允许你访问设备的浏览器设置，例如历史记录和书签。\n2. 在你的 activity 中添加一个 `Spinner`\
  \ 控件来列出设备的书签。你通过通过 `SpinnerAdapter` 将浏览器查询数据链接到 `Spinner` 控件来实现这一点。\n\n### 设置 Spinner\
  \ 和数据源\n\n你可以通过完成以下步骤来设置此过程：\n\n1. 创建一个名为 `SpinnerExample` 的新 Mono for Android 项目。在该项目中，将默认\
  \ activity 的标签重命名为 `Spinner Example`。此外，将类重命名为 `SpinnerExample` 而不是通用的 `Activity1`\
  \ 会是一个好意。接下来，在主布局中添加 `Spinner` 控件的标记。在 `Layout` 目录下，打开 `Main.axml` 文件并添加 `Spinner`\
  \ 控件的标记。你可能还想添加一个 `TextView` 来描述你的 `Spinner` 控件用法。列表 6.1 显示了你的 `Main.axml` 文件应该是什么样的。\n\
