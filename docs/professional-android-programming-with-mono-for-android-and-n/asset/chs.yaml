  \ MonoTouch 解决方案，你再次可以在 Interface Builder（它是 `Xcode` 的一部分）中设置 UI。下载示例项目以查看 MonoTouch\
  \ 示例的运行代码。（你需要一台 Mac 来运行此示例以及 MonoTouch 的评估版本。）\n\nListing 15.4 显示了处理 `TouchUpInside`（在\
