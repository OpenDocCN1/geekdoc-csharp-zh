  \               Intent intent) =>\n            {\n                _button.Text =\
  \ String.Format(\"wifi state: {0}\", \n                     _wifiMgr.WifiState);\n\
  \                var wifiR = _wifiMgr.ScanResults;\n                _tv.Text = String.Empty;\n\
  \                for (int i = 0; i < wifiR.Count; i++)\n                {\n    \
