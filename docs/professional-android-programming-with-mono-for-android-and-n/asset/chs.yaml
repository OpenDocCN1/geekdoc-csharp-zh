  \n图 2.8\n\n![2.8](img/c02f008.jpg)\n\n## 日志\n\n为了跟踪程序的执行流，记录程序活动通常很有帮助。本节简要检查了你如何在\
  \ Mono for Android 中实现日志消息。`Log` 类位于 `android.util` 命名空间。你可以在你之前的代码中添加几行以获取以下源码：\n\
  \n```csharp\nusing System;\n\nusing Android.App;\nusing Android.Content;\nusing\
  \ Android.Runtime;\nusing Android.Views;\nusing Android.Widget;\nusing Android.OS;\n\
  using Android.Util;\n\nnamespace HelloAndroid\n{\n    [Activity(Label = \"Hello\
  \ Android\", MainLauncher = true)]\n    public class Activity1 : Activity\n    {\n\
  \        int count = 1;\n\n        protected override void OnCreate(Bundle bundle)\n\
  \        {\n            Log.I(\"HA\", \"Start OnCreate\");\n            base.OnCreate(bundle);\n\
  \n            // 从“main”布局资源设置我们的视图\n            SetContentView(Resource.layout.main);\n\
  \n            // 从布局资源获取我们的按钮，\n            // 并为其绑定一个事件\n            Button button\
  \ = FindViewById<Button>(Resource.id.myButton);\n            button.Click += delegate\
  \ { button.Text = string.Format(\"{0} clicks!\",\n count++); }\n\n            Log.I(\"\
  HA\", \"End OnCreate\");\n        }\n    }\n}\n```\n\n在这里，你可以看到添加的 `using Android.Util`，它提供了对\
  \ `Log`类的访问，该类包含了以下方便函数（以及其他）：\n\n*   `Log.I(string tag, string message)` 记录信息。\n\
  *   `Log.W(string tag, string message)` 记录警告。\n*   `Log.E(string tag, string message)`\
  \ 记录错误。\n\n`tag` 参数为日志消息提供上下文。在这种情况下，你可以为 `HelloAndroid` 使用 `HA` 标签。要在 Visual Studio\
  \ 中查看消息，请选择 `View ⇒ Other Windows ⇒ Android Device Logging`，所有消息都将可用。\n\n## 调试\n\
  \n在模拟器中成功执行应用程序后，你可以查看如何调试我们将引入的一个问题。如果你正在使用实体手机，需要转到手机上的应用程序页面并选择 `Settings`。然后选择\
  \ `Applications`、`Development` 并勾选 `USB Debugging`。之后，返回你的代码。\n\n更改以下行：\n\n```csharp\n\
  Button button = FindViewById<Button>(Resource.id.myButton);\n```\n\n改为如下内容：\n\n\
  ```csharp\nTextView button = FindViewById<TextView>(Resource.id.myButton);\n```\n\
  \n重新运行应用程序。这次应用程序将在启动时抛出错误，因为你正尝试将 `Button` 视为 `TextView`。虽然这个例子可能是人为设计的，但请看你可以如何调试应用程序。\n\
  \n在以下行上设置断点：\n\n```csharp\nbase.OnCreate(bundle);\n```\n\n现在，点击工具栏上的运行/调试按钮。这次，当应用程序启动时，软件将停在断点处。现在你可以逐步执行应用程序直到到达出错行。尝试跳过该指令将导致之前看到的错误，在这种情况下，修复它是轻而易见的。\n\
  \n## 测试\n\n仅仅通过使用测试软件的时代一去不复了。所有可靠构建的软件都依赖单元测试作为最佳实践，并使测试周期更短更可靠。那么，如何在 Mono for\
  \ Android 中构建单元测试呢？\n\n简单的答案是 `NUnit`，就像任何其他 Mono 应用程序一样。更长的答案涉及构造你的程序使其易于测试。也就是说，`NUnit`\
  \ 测试框架并不是面向 UI 测试的。\n\n# 使用 MonoDevelop 进行 Android 开发\n\n本节介绍了如何配合 MonoDevelop 的\
  \ Android 插件为你的 Android 设备开发基础的“Hello Android”应用程序。如果你因为使用 Mac 而跳过了 Visual Studio\
  \ 部分，或者无论如何都使用 MonoDevelop，我鼓励你阅读 Visual Studio 部分，因为它涵盖了一些通用的概念，但如果你想直接开始并在过程中赶上，那也没没问题。\n\
  \n## 通用设置\n\n在 Mac 上安装开发环境是直观的。该过程分为六个步骤：\n\n*   安装 Android SDK：可以在 [`developer.android.com/sdk/index.html`](http://developer.android.com/sdk/index.html)\
  \ 找到。它是基于 Java 的，并利用了 OSX 默认安装的 Java SDK。\n*   为 Mac 安装 `Mono`：可以在 [`www.go-mono.com/mono-downloads/download.html`](http://www.go-mono.com/mono-downloads/download.html)\
  \ 找到。它提供了 `Mono` 平台，这是也将安装的 Mono 开发工具的基础。\n*   为 Mac 安装 `MonoDevelop`：可以在 [`monodevelop.com/download`](http://monodevelop.com/download)\
  \ 找到。它为在 Mac 上开发 Mono 应用程序提供了 IDE。此外，它是必要的，因为 Mac 版的 Mono for Android 是作为此 IDE 的插件安装的。\n\
  *   为 Mac 安装 Mono for Android：可以在 [`mono-android.net/Store`](http://mono-android.net/Store)\
  \ 找到。在商店页面你也可以下载该软件的试用版。\n\n## 部署\n\n通过调试、日志和测试运行“Hello Android”之后，现在是时候部署应用程序到真实的\
  \ Android 设备上了。这个过程三个步骤：通过 USB 连接手机、将手机设置为开发模式以及部署应用程序。\n\n1. 第一步显而易见。\n2. 第二步你需要进入手机设置并选择\
  \ `Application Settings`。在 `Application Settings` 下，勾选 `Unknown Sources` 选项。这允许你安装所需的非\
  \ Android 市场应用。其次，在同一页面上选择 `Development`。这将带你带有三个选项的屏幕。选择 `USB Debugging` 和 `Stay\
  \ Awake`。\n3. 现在最后一步：点击工具栏上的 `Debug` 按钮。这次当 Running Devices 出现时，你的设备在列表中！选择你的设备。这次安装过程将通过\
  \ USB 运行到你的设备。\n\n完成后，尝试一下 Hello 应用。\n\n\n\n\n\n* 配置 Mono for Android MonoDevelop\
  \ 插件：一旦安装了插件，你需要进入 `MonoDevelop` ⇒ `Preferences`，这将显示偏好对话框。之后，选择 `Other` 类别并选择 `Mono\
  \ for Android SDKs`。这将允许你配置正在使用的 `Java` 和 `Android SDKs`。\n* 配置你的 Android 模拟器：最后，运行\
  \ `Android SDK` 安装程序并选择 `Virtual Devices`。创建一个新的虚拟设备。需要注意的是，你可能会发现，实际设备上进行开发比在模拟设备上开发要快一些。\n\
  \n如果你想更详细地了解这一过程，请参考以下链接：[`mono-android.net/Installation/Installation_for_Mac`](http://mono-android.net/Installation/Installation_for_Mac)。\n\
  \n![note](img/note.gif)此外，如果你在 `Mono for Windows` 环境下运行，你可能希望参考 [`mono-android.net/Installation/Windows`](http://mono-android.net/Installation/Windows)\
  \ 中的安装说明，因为设置上存在细微差异。\n\n***\n\n## 构建 Hello Android\n\n使用 `MonoDevelop` 和 `Android`\
  \ 运行一个程序非常简单。如果你读过 `Visual Studio` 部分，可能可以跳过此节并自行查找细节，但对于那些跳过了 `Visual Studio` 部分的人，现在可以运行一遍该过程。\n\
  \n进入 `File` ⇒ `New` ⇒ `Solution` 并选择如图 2.9 所示的 `Mono for Android` 模板。\n\n图 2.9\n\
  \n![2.9](img/c02f009.jpg)\n\n对于解决方案名称，输入 `HelloAndroid`。然后点击 `OK`。新应用程序将出现在窗口中。进入\
  \ `Run` 菜单并选择 `Run`。稍后将弹出一个窗口，提示选择运行应用程序的设备。如果你有一个正在运行的模拟器或连接的 Android 设备，它将列在其中。如果没有，选择“Start\
  \ an Emulator Image”，你将收到一个在你机器上配置的镜像列表，其中一个就是你在常规设置期间配置的模拟器。\n\n选择你希望应用程序运行的设备或模拟器，然后选择\
  \ `OK`。如果必须启动模拟器，可能需要一段时间。否则，将出现消息通知你它正在检查已安装的应用程序、在必要时安装 `Mono for Android`，最后运行应用程序，如图\
  \ 2.10 所示。\n\n图 2.10\n\n![2.10](img/c02f010.jpg)\n\n## 日志记录\n\n在 `MonoDevelop` 中记录日志与\
  \ `Visual Studio` 中相同，因为它是 `API` 的功能而不是 `IDE` 的功能。回顾一下，以防你跳过了 `Visual Studio` 部分，这里是日志函数：\n\
  \n* `Log.I(string tag, string message)` 记录信息。\n* `Log.W(string tag, string message)`\
  \ 记录警告。\n* `Log.E(string tag, string message)` 记录错误。\n\n`tag` 参数为日志消息提供上下文。例如，如果你在\
  \ `HelloAndroid` 应用程序中添加了一些日志记录，你可能在日志函数中使用“HA”作为标签。\n\n## 调试\n\n在模拟器中成功执行应用程序后，是时候查看如何调试我们将引入的问题了。如果你使用实体手机，你需要进入手机上的\
  \ `Applications` 页面并选择 `Settings`。然后选择 `Applications`、`Development` 并勾选 `USB Debugging`。之后，返回你的代码。\n\
  \n修改以下行：\n\n```\nButton button = FindViewById<Button>(Resource.id.myButton);\n```\n\
  \n修改为：\n\n```\nTextView button = FindViewById<TextView>(Resource.id.myButton);\n\
  ```\n\n重新运行应用程序。这次应用程序将在启动时抛出错误，因为你正尝试将一个 `Button` 视为 `TextView`。虽然这个例子可能是人为构造的，但请看如何调试应用程序。\n\
  \n在以下行上设置断点：\n\n```\nbase.OnCreate(bundle);\n```\n\n现在，点击工具栏上的 `Run/Debug` 按钮。这次，当应用程序启动时，软件将停在断点处。你现在可以单步执行应用程序直到到达出错的行。尝试跳过该指令将导致之前看到的错误，在这种情况下，修复它是轻而易举的。\n\
  \n## 测试\n\n仅仅通过使用来测试软件的时代已早已过去。所有可靠构建的软件都依赖单元测试作为最佳实践，并使测试周期更短、更可靠。那么，如何使用 `Mono\
  \ for Android` 构建单元测试呢？\n\n简短的答案是 `NUnit`，就像对于任何其他 `Mono` 应用程序一样。详细答案涉及构造你的程序使其易于测试。也就是说，`NUnit`\
  \ 测试框架并非面向 `UI` 测试，因此最好是将你的非 UI 代码隔离到单独的库中并设置针对该库的测试。\n\n## 部署\n\n将你的 `HelloAndroid`\
  \ 应用程序部署到设备非常简单。\n\n此过程三个步骤：通过 USB 连接手机、将手机设置为开发模式并部署应用程序。\n\n1. 第一步显而易见。\n2. 第二步需要进入手机设置并选择\
  \ `Application Settings`。在 `Application Settings` 下，勾选 `Unknown Sources` 选项。这允许你安装你想要的非\
  \ Android 商店应用。其次，在同一页面上选择 `Development` 选项。这将带你进入带有三个选项的屏幕。选择 `USB Debugging` 和\
  \ `Stay Awake`。\n3. 现在最后一步：点击工具栏上的 `Debug` 按钮。这次当运行设备列表出现时，你的设备在上面！选择你的设备。这次安装过程将通过\
  \ USB 运行你的设备。\n\n完成后，尝试一下 `HelloAndroid` 应用。\n\n# 总结\n\n在本章中，你涵盖了如何在 Windows 上使用\
  \ `Visual Studio 2010` 插件为 Android 安装开发环境，并涵盖了在 Mac 上使用 `MonoDevelop` 的开发环境。在每情况下，过程都是类似的：安装包括\
  \ `Java SDK`、`Android SDK` 和 `Mono SDK` 在内的软件栈。安装你的 IDE，无论是 `Visual Studio` 或 `MonoDevelop`。然后安装\
  \ `Mono for Android` 插件。如果你使用 `MonoDevelop`，请配置插件。然后，使用安装的平台创建一个默认的 `HelloAndroid`\
  \ 应用程序。\n\n此外，本章涵盖了日志记录、测试和部署应用程序。你看到日志记录只是在应用程序中添加三个日志调用之一的简单事情，而且这些日志可以在 `Visual\
  \ Studio` 或 `MonoDevelop` 的控制台中看到。测试始终被认为是最佳实践，以帮助在部署之前验证你的软件行为。部署是软件开发的核心。这些技能将在未来的所有章节中反复使用。\n\
  \n# 第 3 章 理解 Android/Mono for Android 应用程序\n\n## 本章包含什么？\n\n* Android 和 Mono for\
  \ Android 应用程序的组成\n* 解释 Android 核心组件\n* 描述 `intents` 的用途以及它们在 Android 平台内如何交互\n\
  * 探索 Android 清单文件及其关键特性\n\n开发 Mono for Android 应用程序，你需要对 Android 应用程序的关键组件有良好的理解。这种理解不仅使你能够构建功能丰富的应用程序，还将帮助你与\
  \ Android 设备上的其他应用程序和进程进行通信。\n\n\n\n\nMono for Android 的优点之一是它允许你使用特定的 .NET 语言编写\
  \ Android 应用程序。然而，这并不意味着你不需要对 Android 运行时以及底层的 Java 架构有基本的了解。要编写功能全应用程序，你必须能够与 Android\
  \ 的 Java API 接口，并可能与其他不一定是用 Mono for Android 编写的应用程序交互。此外，理解编写应用程序的“Android 方式”（Android\
  \ way）至关重要，因为 Mono for Android 运行时正是基于这种理解构建的，并在许多方面通过其架构反映了这些“Android 特性”。本章的总体目标是为这种理解提供基础。\n\
  \n为了实现这些目标，本章将让你对 Android 平台有一个广泛的理解，但在适用情况下会在 Mono for Android 的背景下进行。我们会特别指出 Mono\
  \ for Android 与 Android 之间所有的关键差异。本章介绍了 Android 栈的不同组件以及它们如何相互作用以形成一个应用程序。此外，本章还花费了一些时间回顾\
  \ Android 操作系统如何在优先级、内存使用、资源以及与其他生命周期相关的主题方面管理这些应用程序组件。如果你已经熟悉 Android，可以将本章视为复习，甚至跳过它。如果你是\
  \ Android 平台的新手，这里是获得系统广泛理解的好地方。无论如何，本章都将作为 Android 和 Mono for Android 运行时之间桥梁的良好介绍。\n\
  \n![note](img/note.gif) 虽然本章的大部分内容侧重于 Android 核心类的特定功能，但所有的代码示例和命名规范都呈现得你正在 Mono\
  \ for Android 环境中工作一样。大多数情况下，Mono for Android 的命名空间与 Android 的命名空间镜像。然而，大小写、非字母字符的使用以及名称有时会进行修改，以符合\
  \ C# 语言的建议实践。\n\n***\n\n# 什么是 Android 应用程序？\n\n大多数应用程序都有一个入口，开发者可以在那里定义启动程序、资源初始化和其他步骤。在\
  \ Windows 编程中，这以 `Main()` 函数为特征。尽管 Android 应用程序具有标识应用程序默认入口点的设置，但 Android 应用并不是你所认为的典型应用。当你观察一个\
  \ Android 应用程序时，没有一个单一函数可以单方面地实例化整个应用程序。这是因为 Android 应用程序的行为和交互方式更像一组相关的子应用程序，而不是一个单一的实体。\n\
  \nAndroid 应用程序是核心组件的关联，这些组件可以根据需要调用和实例化。事实上，这些组件可以独立工作，但通过松耦合和预设的通信手段仍然保持逻辑连贯性。此外，应用程序组件之间的交互不仅限于应用程序内部，还可能从其他\
  \ Android 应用程序访问。\n\n这种结构的原因是为了允许 Android 设备内不同应用程序、组件和功能之间尽可能的流动性。尽管这可能会增加组件之间进行通信的复杂性，但它为开发者共享数据、共享行为，甚至创建某种分布式应用程序提供了很多自由度。\n\
  \n例如，假设你需要创建一个应用程序，在人在购物时存储杂货数据。为了让该应用程序成功，你需要通过设备读取杂货背面的条形码来利用它。在大多数情况下，你可能需要下载条形码扫描库并将其作为应用程序构建的一部分。\n\
  \n除了应用程序架构之外，在开发任何 Mono for Android 或 Android 应用程序时，你应该记住其他几个关键点：\n\n- 每个 Android\
  \ 应用程序运行在自己的进程中。当 Android 应用程序启动时，Android 操作系统会启动单个 Linux 进程。这使得 Android 操作系统根据请求或系统需要额外资源时创建和销毁应用程序进程变得简单。\n\
  - Android 每个进程只启动一个线程。如果你忘记了本章的其他内容，请记住这个！当你处理 Android 应用程序中的不同应用程序组件时，很容易忘记除少数例外外，应用程序中的所有内容都运行在单线程中。虽然创建额外的线程来完成工作是一小事，但这取决于你作为开发者的决定。\n\
  - 每个应用程序都运行在自己的 Dalvik 虚拟机实例中。这种沙箱方法保护你的应用程序不被其他运行的应用程序损坏。一个设计不当的应用程序不会影响设备上其他应用程序的稳定性。\n\
  - 每个应用程序都受到保护，只有设备用户和应用程序本身可以访问应用程序的数据或资源。默认情况下，所有应用程序都存在于“孤岛”（silo）中，其他应用程序无法看到存储的或敏感的数据或用户操作。作为开发者，你可以根据意愿暴露尽可能多的功能或数据，但必须显式命名。此外，在应用程序安装或更新时，用户可以接受或拒绝安装的应用程序可能对其他应用程序提出的任何权限请求。\n\
  \n尽管这些是应用程序的默认规则设置，但你可以通过专门编写适当的代码或向设备用户请求适当的权限级别来改变这些规则。这些规则旨在通过让每个应用程序运行在自己的世界中来确保你的应用程序和\
  \ Android 设备的稳定性。此外，它们在保护你的应用程序数据免受恶意攻击方面起着巨大作用。\n\n## Android 应用程序的构建模块\n\nAndroid\
  \ 应用程序由四个构建模块组成，通常被称为 Android 组件（Android components）。这些组件封装了 Android 平台上的不同使用模式和行为。具体来说，它们可以定义为：\n\
  \n- Activity（Activities）\n- 服务（Services）\n- 内容提供者（Content providers）\n- 广播接收器（Broadcast\
  \ receivers）\n\nAndroid 应用程序可能拥有这些组件中的一个或多个。后续章节将介绍这些项目中每一个项，讨论它们的使用场景，并定义 Android\
  \ 平台中存在的这些项的原生版本。\n\n### Activity\n\nActivity 是一种用户界面组件，可用于完成单一任务。如果你是第一次接触 Mono\
  \ for Android 或 Android 应用程序，很有可能你开发的第一个应用程序组件将是一个 Activity。当你运行 Android 应用程序时，应用程序显示的每个屏幕或你交互的每个屏幕都是由一个或多个\
  \ Activity 启动的。广泛来说，Activity 构应用程序的表示层。它们处理向用户显示信息的逻辑、展示控件并收集数据，以及根据需要将用户引导到其他 Activity。\n\
  \n一个应用程序可能由一个或多个 Activity 组成。应用程序的数量取决于应用程序的复杂性和开发者的设计决定。由于 Android 应用程序的每个组件都预期能够独立运行，因此\
  \ Activity 可以通过在 Android 清单文件中标记为应用程序的启动 Activity，或由当前 Activity 直接启动新的 Activity\
  \ 来启动。\n\n\n\n\n![note](img/note.gif)在 Android 中，你可以通过向字符的意图过滤器（intent filter）添加适当的\
  \ action 来识别启动活动。这是在 Android 清单（manifest）完成的。这与 Mono for Android 有很大，Mono for Android\
  \ 允许你通过在活动类声明中使用以下属性来指定启动活动：\n\n```\n[Activity(Label = \"My Activity\", MainLauncher\
  \ = true)]\npublic class Activity1 : Activity\n{\n     //Activity class implementation...\n\
  }\n```\n\nAndroid 清单、意图过滤器和 action 将在本章后半部分以及第 11 章中介绍。\n\n活动程序可能是应用程序组件中最容易处理的一个了。在大多数情况下，你可以将活动\
  \ 认为具有两个基本运行部分：\n\n*   一个或多个视图（views）的集合：这些项目构成了可以展示给用户的不同界面。这可以从简单的 `Toast()` 消息到完整的、复杂的数据表到动画。视图将在后续章节中进行更详细的讨论。\n\
  *   `Activity` 类：它充当运行的控制器。根据用户交互，它处理额外布局和视图的启动、适当数据的获取和绑定，以及收集数据和委托收集的数据。\n\n如果你熟悉\
  \ MVC 模式，你将很快识别出活动的结构，因为 Android 活动和视图在开发时就考虑了这一点。`Activity` 类充当控制器。该类接收输入并对输入执行操作，调用适当的模型对象并展示各种视图。另一方面，Android\
  \ 视图负责知道如何展示传递给它们的模型对象。一个 Android 活动（控制器）可能会根据用户输入展示许多不同的视图。\n\n### 活动周期\n\nAndroid\
  \ 组件的生命周期从组件创建开始运行，直到被销毁为止。从宏观来看，组件生命周期是整个 Android 资源管理过程的一部分。通过判断不同组件在其生命周期模式中所处的位置，Android\
  \ 操作系统可以决定如何分配资源和管理内存需求。具体来说，活动的生命周期是一系列状态，从在 `OnCreate()` 中被创建开始，到在 `OnDestroy()`\
  \ 中被移除结束。活动基本上三种状态：活跃（active）、暂停（paused）和停止（stopped）：\n\n*   当活动在设备上运行并处于屏幕前部时，它是活跃的。当你在\
  \ Android 设备上使用应用程序时，你正在操作和查看的活动就处于活跃状态。\n*   当活动仍然可见但没有屏幕焦点时，它是暂停的。通常，这发生在另一个活动覆盖在当前活动之上时。尽管它没有焦点，但它仍然带有资源运行，就像处于活跃状态一样。\n\
  *   当活动被另一个活动遮挡时，它是停止的。它仍然可以携带信息，例如状态和成员信息，但它的窗口被隐藏了。当活动处于停止状态时，它是 Android 操作系统杀掉的理想目标，以释放资源。\n\
  \n通常，活动状态的变化是由于用户交互或 Android 操作系统的资源管理引起的。图 3.1 显示了用户与 Gmail 应用程序交互时的理论状态。在例例中，想象你正在\
  \ Android 设备上检查你的 Gmail 应用程序。\n\n当你首次启动应用程序时，一个活动会显示所有电子邮件的列表。Gmail 应用程序处于活跃状态，如图\
  \ 3.1 左侧所示。\n\n图 3.1\n\n![3.1](img/c03f001.jpg)\n\n假设当你开始处理电子邮件时，设备的电量开始变低，你收到了一条通知。通知屏幕覆盖在当前活跃的屏幕上以警告你，如图\
  \ 3.1 中间所示。你可以在后台看到你的 Gmail 应用程序，但它处于暂停状态。\n\n你清除警告消息并找到了正在寻找的电子邮件。你打开它并点击了其中的一个链接。这启动了浏览器程序，它完全覆盖了\
  \ Gmail 活动（图 3.1 右侧）。此时，Gmail 活动处于停止状态。尽管它可能仍在运行并可能包含某些实例值，但随着你的浏览或使用其它应用程序请求更多资源，Android\
  \ 操作系统可能会杀掉它。\n\n当活动从一个状态移动到另一个状态时，应用程序开发人员需要能够状态的变化。因此，`Activity` 类暴露了几个在活动状态更改时触发的事件。这些事件允许你恰当地响应状态变化，以保护你的应用程序数据并释放不资源。可用事件有\
  \ `OnCreate()`、`OnStart()`、`OnRestart()`、`OnResume()`、`OnPause()`、`OnStop()` 和 `OnDestroy()`。\n\
  \n虽然你可能会使用这些事件中的任何一个，`OnCreate()` 和 `OnPause()` 通常是最频繁运行的：\n\n*   `OnCreate()` 方法留用于定义应用程序可能需要的任何初始化活动。在此方法中，你通过使用\
  \ `Activity` 基类的 `ContentView()` 方法定义要展示给用户的第一个视图。此外，你可能选择请求访问系统资源。\n*   `OnPause()`\
  \ 方法是处理活动进入后台情况的关键工具。在活动的生命周期期间，当用户离开你的活动时，会调用此方法。此方法允许你通过关闭对系统资源的访问（如设备摄像头）或停止昂贵的任务（如动画）来清理应用程序的资源使用情况。\n\
  \n通过理解活动周期，你可以确保应用程序的稳定性，保护数据的完整性，并在资源不再需要时主动释放资源，从而提高系统性能。\n\n#### 活动与视图\n\n为了充分利用活动，你需要对视图是什么以及它们在\
  \ Mono for Android 和 Android 中如何使用有相当深入的理解。当活动运行时，Android 操作系统会为该活动分配一个窗口，活动可以在其中绘制它需要展示的任何内容。在该窗口空间内显示的内容通过视图进行通信。简而言之，视图是定义活动展示给用户交互的控件和布局的基本构建块。\n\
  \n每个活动都可以在其窗口空间内展示单个视图或视图层次结构。这是通过调用活动的 `ContentView()` 方法并提供要显示的适当视图项目来实现的。\n\n\
  Android 平台有多种不同的视图实现。每个视图类型都扩展 `View` 类，该类定义了基本的接口行为，如创建、布局、事件处理和绘制。你在应用程序中工作的更常见的视图包括如\
  \ `Button`、`ImageView` 和 `TextView` 等项目。由于继承自 `View` 类，所有这些都是视图的一种，尽管它们更常被称为控件或小部件。\n\
  \n\n\n\n\n一种名为“视图组”（view group）的特殊视图包含了它自己的视图集合或层级结构。视图组不仅执行与普通视图相同的所有功能，还处理其子视图的流向和布局。视图组是一个非常强大的工具，因为它们允许开发者创建一组可复用的复杂控件。此外，它们也是布局的基础。\n\
  \n布局（layout）是一种视图组，用于管理一组视图的流向或呈现方式。布局通常使用类似于 HTML 的基于 XML 的语法来定义。这使得开发者能够快速地在单个布局中放置多个视图，并为该布局中的每个视图单独设置属性值。\n\
  \n通常，视图（view）、控件（control）、组件（widget）和布局（layout）这些术语经常互换使用。这可能会导致一些困惑，因为这些术语的含义从通用到具体。此外，这些术语可能与\
  \ Android 其他功能（如应用程序部件 application widgets）混淆。为了帮助解决这种困惑，请考虑这段代码段：\n\n```xml\n<?xml\
  \ version=\"1.0\" encoding=\"utf-8\"?>\n     <LinearLayout xmlns:android=\"http://schemas.android.com/apk/res/android\"\
  \n          android:orientation=\"vertical\"\n          android:layout_width=\"\
  fill_parent\"\n          android:layout_height=\"fill_parent\">\n\n     <ImageView\
  \ android:layout_height=\"wrap_content\"\n          android:layout_width=\"wrap_content\"\
  \n          android:layout_margin=\"5dip\"\n          android:src=\"@drawable/icon\"\
  \ />\n\n     <TextView android:id=\"@+id/text\"\n          android:layout_width=\"\
  wrap_content\"\n          android:layout_height=\"wrap_content\"\n          android:text=\"\
  @string/welcomeText\" />\n\n     <Button android:id=\"@+id/helloButton\"\n     \
  \     android:layout_width=\"fill_parent\"\n          android:layout_height=\"wrap_content\"\
  \n          android:text=\"@string/hello\"/>\n</LinearLayout>\n```\n\n在这个示例中，XML\
  \ 语法定义了一组不同的用户界面组件并展示给用户。这是在调用 activity 的 `SetContentView()` 方法时加载的典型代码片段。该代码段的根节点是\
  \ `LinearLayout` 节点。`LinearLayout` 继承自 `View` 和 `Viewgroup`。因此，它是一个视图。由于它包含子视图，它也是一个视图组或布局。在这种情况下，`LinearLayout`\
  \ 将每个子视图放置在单列中。\n\n在 `LinearLayout` 内部有若干个 Android 框架中预定义的控件（或组件）。这些控件中的每一个——`Button`、`Image`\
  \ 和 `TextView`——都派自 `View` 基类。\n\n![note](img/note.gif)第 4 章将深入探讨视图的类型以及如何将它们与你的活动结合使用。\n\
  \n* *\n\n### 服务 (Services)\n\n服务（service）是开发者定义的一个工作单元，可以运行很长时间。与 activity 不同，服务没有视觉组件。此外，它们的运行不依赖于应用程序用户。它们可以被用于许多任务，例如从网络获取数据、在你在浏览其他应用程序时播放音乐，或者处理正在运行时间较长的任务。当你考虑\
  \ Android 设备上的任何种自动化或定时任务时，你最可能在想的是某个作为服务运行的内容。\n\n服务经常让那些以前没有工作过 Android 环境的人感到困惑。当开发者听到“服务”这个词时，他们通常会想到“后台服务”。虽然服务确实用于此目的，但开发者经常会犯一个错误，认为服务运行在与应用程序其他组件不同的线程上。事实并非如此。作为开发者，你有责任根据需要创建额外的线程。Android\
  \ 应用程序中的所有项目，除非由开发者专门处理，否则它们都在在同一个线程中运行。\n\n简而言之，服务是 Android 应用程序的劳动力。它们可以用于对一组待处理的任务进行排序，或者系统地检查网络资源的状态。此外，服务是一种向其他应用程序暴露任务的方法，允许它们与该特定工作进行交互。服务是处理重复或持续任务的好方法，即使你的应用程序的\
  \ activity 处于非活动或关闭状态。典型的 Android 服务包括邮件应用程序、定期检查更新的 RSS 阅读器、播客播放应用程序以及 Twitter\
  \ 客户端。\n\n服务既是一个宽泛又深入的话题，超出了本章的范围。第 11 章将深入研究服务的内部机制、服务生命周期的不同方面，以及如何在你的 Mono for\
  \ Android 应用中实现服务。\n\n* *\n\n![note](img/warning.gif)当应用程序最初被要求运行时，Android 会为它启动一个带有单线程的进程。该应用程序内的所有组件都运行在该单线程中。为了防止应用程序在执行服务时锁死，创建不同的线程或定义不同的进程来处理服务任务是至关重要的，同时还要允许用户享受响应式的界面。\n\
  \n* *\n\n### 内容提供者 (Content Providers)\n\n内容提供者是跨应用程序共享信息的首选方式。它们可以被视为一种社区数据存储，允许开发者暴露特定的数据集，供其他应用程序和进程查询甚至操纵。由于\
  \ Android 平台没有通用的数据存储机制，内容提供者为 Android 应用程序创建通用数据池的极佳方法。\n\n内容提供具有灵活性，允许你定义一个或多个针对数据不同子集的数据集。通过这种灵活性，你可以保护你只想在你的应用程序中存在的数据（例如个人用户数据），同时与符合你指定的安全标准的应用程序共享其他数据。此外，内容提供者可以为每个数据集实现不同的操作。这意味着与你的每个数据集的交互可以从只读到批量插入不等。\n\
  \n暴露这些数据类型的优势在于，用户对于管理数据的应用程序有了选择，而不是被强制使用原生播放器。而且，作为开发者，你有权编写自己的应用程序来提高性能。\n\n\
  ![note](img/note.gif)作为开发者，你可能会想要放弃使用内容提供者而使用只有你的应用程序可以访问的存储。然而，通过将内容提供者作为社区数据池，你是在为你自己和潜在客户提供便利。你可以在安装时直接获得预填充的数据池，用户不需要手动迁移数据。这是在\
  \ Android 设备上做一个良好公民的方式。\n\n* *\n\n#### 原生内容提供者 (Native Content Providers)\n\n理解内容提供者的最佳方法是查看\
  \ Android 平台中已有的提供者。这些原生提供者可以让你真实地感受到为什么要使用内容提供者，以及如何最好实现它们。\n\n有多个原生内容提供者。它们提供的内容范围从联系人和电话通话记录等基本数据类型，到更复杂的类型（如图像和视频）。表\
  \ 3.1 描述了几个最常用的原生内容提供者。\n\n| 提供者名称 | 说明 |\n| :--- | :--- |\n| `AlarmClock` | 访问系统闹钟应用程序，允许不同的应用程序设置闹钟模式和时间。\
  \ |\n| `Browser` | 暴露网络搜索、历史和书签等数据集，供查看或编辑。 |\n| `CallLog` | 提供拨出、接入和未接来电话的信息，包括电话号码、时间戳和时长。\
  \ |\n\n\n\n\n\n| `ContactsContract` | 用于查看或修改联系数据。对于早期的 Android 开发者来说，它取代了已弃用的 Contact\
  \ 提供者。 |\n| `MediaStore` | 提供对 Android 设备上媒体的通用访问，包括图像、视频和音频。此外，该提供者还会暴露设备上媒体的元数据，例如流派和艺术家。\
  \ |\n| `Settings` | 访问 Android 设备的全局系统设置和配置。查询的一些常用设置包括蓝牙、语言和网络设置。 |\n| `UserDictionary`\
  \ | 允许插入或查看用户定义的单词以用于预测文本。此外，该提供者还存储了这些单词的使用频率和区域信息。 |\n\n你可以在 Android 开发者文档中的 `android.provider`\
  \ 命名空间中找到可用的默认内容提供者列表。\n\n### 内容提供者的工作原理\n\n无论你是使用默认的内容提供者还是创建自己的，Android 都为你提供了一种通用的访问方式。然而，这并不是通过允许直接访问内容提供者来实现的；这是内容提供者非常重要的方面。Android\
  \ 平台并没有让数百个不同的内容提供者访问方法或方案，而是通过利用中介对象来统一所有当前和未来的访问。具体来说，`ContentResolver` 对象处理与内容提供者的所有交互。`ContentResolver`\
  \ 确保任何新的内容提供者都可以被其他应用程序通用访问，同时不会限制开发者想要存储其应用程序数据的方法。\n\n![note](img/note.gif)`ContentResolver`\
  \ 充当了数据存储的中介。这种方法不仅简化了从内容提供者获取数据，还确保了所有内容提供者都是平等的。这种交互是中者模式的绝佳示例。\n\n* * *\n\n内容解析器遵循两条基本规则。首先，所有内容存储都有唯一的\
  \ `URI`。这个 `URI` 与网络地址非常相似。它提供了一种定位你想要访问的内容提供者的唯一方式。此外，`URI` 可用于指定内容提供者内部的特定数据集，或指定键参数和值。\n\
  \n内容提供者的第二个规则是，`ContentProvider` 基类定义了在已实现的提供者上可以执行的所有操作。在编写自定义提供者时，由你来实现你所选择支持的任何方法的逻辑。这种方法的优势是，如果你知道如何连接到一个提供者，你就可以连接到任何提供者。当然，缺点是你没有权限编写自己的访问方法。幸运的是，`ContentResolver`\
  \ 恰好具有足够的简单活性来支持大多数数据需求。\n\nTable 3.2 列出了大多数提供者都以某种形式实现的 `ContentResolver` 函数。\n\
  \nTable 3.2 通用 Content Resolver 函数\n\n| 函数名称 | 说明 |\n| :--- | :--- |\n| `query()`\
  \ | 接收提供者 `URI`、选择字符串、选择参数和结果集排序的参数。用于返回一个包含目标结果集的游标（cursor）。 |\n| `update()` |\
  \ 接收提供者 `URI`、新字段值和用于定位特定更新行的过滤条件。这返回受更新语句影响的行数。 |\n| `insert()` | 接收提供者 `URI` 和要添加到数据存储中的键值对参数。这返回新插入项的\
  \ `URI`。 |\n| `delete()` | 接收提供者 `URI`、选择字符串和选择参数。用于从数据存储中删除一个或多个实体。返回受影响的行数。 |\n\
  | `getType()` | 接收提供者 `URI` 参数。返回存储在内容提供者内部的数据的文本 MIME 类型。 |\n\n在内容提供者内部插入、删除或更新项目是一个相当直接的过程。由于它们返回的是简单的数据类型，你可以直接与当前活动关联的\
  \ `ContentResolver` 实例进行工作。`Activity` 类的优势之一是它会自动初始化 `ContentResolver` 对象。通过直接调用方法，你可以执行工作而无需过多担心内存管理。但对于\
  \ `query()` 方法来说并非如此。\n\n当通过 `ContentResolver` 执行查询时，你会接收到一个游标对象（cursor object）。该对象可以用于遍历结果集并根据你的需要使用数据。当你使用\
  \ `ContentResolver` 对象上的 `query()` 操作时，由你来将该查询作为敏感资源管理其生命周期。换句话说，你必须确保适时地对游标对象调用\
  \ `close()`，以避免内存泄漏。\n\n幸运的是，如果你不需要直接管理查询游标，有一种更好的方法来查询内容提供者。每个活动都通过 `ManagedQuery()`\
  \ 函数提供了 `ContentResolver.query()` 方法的抽象。这也是 `Activity` 类的一个基本功能。该函数将查询游标与活动的生命周期相关联，处理在\
  \ `destroy()` 或 `pause()` 事件上关闭查询的细粒细节，并在应用程序重启时重新查询数据。除非你需要对查询进行更精细的控制，否则使用 `ManagedQuery()`\
  \ 方法是更好的做法。\n\n![note](img/note.gif)如果你发现自己直接使用 `ContentResolver.query()` 方法，你仍然可以在不使用\
  \ `ManagedQuery()` 方法的情况下允许你的应用程序管理游标。这通过调用当前活动的 `StartManagingCursor()` 方法并传递传递的游标实例来实现。\n\
  \n* * *\n\n最后，如果我们不考虑访问和共享应用程序数据的安全性影响，将是不负责的。虽然你可能想要暴露用户数据，但归根底由设备用户决定是否希望以这种方式使用其数据。访问内容提供者时，你可能需要请求某些应用程序权限。同样，你可以在有人访问你的自定义提供者之前说明所需的权限。所有这些配置都在\
  \ Android 清单文件中管理，该文件将在本章后部分介绍。\n\n### 广播接收器 (Broadcast Receiver)\n\n广播接收器是一种监听并响应事件的应用程序组件。广播接收器让你监听特定事件，并在需要时启动活动和服务作为响应。广播接收器构成了\
  \ Android 系统的核心事件处理系统。广播接收器与服务有许多相似之处。它们没有任何用户界面组件，用于完成某种工作。然而，接收器与服务的区别在于，它们仅存在于监听某种类型的消息并对该消息启动相应的响应。\n\
  \n#### 广播消息 (Broadcast Messages)\n\n在我们描述广播接收器的细节时，理解接收器所处理的消息源自是重要的。首先，许多不同的系统级事件会广播消息。这些事件可以是从来电、低电量警告到网络可用性的任何内容。此外，单个应用程序也可以广播消息。这些消息可能与新数据的可用或应用程序的状态更改有关。\n\
  \n\n\n\n每当消息被广播时，它被称为广播意图（broadcasting intent）。意图作为 Android 平台内不同组件之间的消息机制。本节涵盖了意图整体功能中的特定部分。下一节及后续章节将更深入地介绍意图。\n\
  \n与内容提供者（content providers）一样，某些意图在被广播接收器接收之前需要特殊的权限。这些权限必须在应用程序安装到设备期间，向设备用户请求。\n\
  \n表 3.3 列出了一些常见的广播消息。在阅读此列表时，请想象一下 Android 将如何对每个事件做出响应。正如你可能想到的，这些事件为开发者提供了大量的控制权，以确保其应用在各种情况下都能顺利运行。\n\
  \n表 3.3 常见广播事件\n\n| ACTION_TIME_TICK | ACTION_TIME_CHANGED |\n| :--- | :--- |\n\
  | ACTION_TIMEZONE_CHANGED | ACTION_BOOT_COMPLETED |\n| ACTION_PACKAGE_ADDED | ACTION_PACKAGE_CHANGED\
  \ |\n| ACTION_BATTERY_CHANGED | ACTION_POWER_CONNECTED |\n| ACTION_POWER_DISCONNECTED\
  \ | ACTION_POWER_DISCONNECTED |\n| ACTION_SHUTDOWN | ACTION_UID_REMOVED |\n\n###\
  \ 广播接收器生命周期\n广播接收器（broadcast receiver）是所有组件中生命周期最简单的。基本上，它只有一个回调方法`OnReceive()`。当接收到消息时，意图消息的数据会被传递给接收器。此时，接收器在处理消息并执行适当操作期间被认为是活动状态。一旦`OnReceive()`\
  \ 方法返回，接收器就会被认为处于非活动状态。\n\n任何具有活动接收器的进程都受到保护，不会被操作系统杀死。这是一个需要记住的重要点，因为可能会干扰系统释放所需资源的能力。因此，正如之前提到的，接收器有\
  \ 5 秒的执行限制。任何耗时较的工作都应该推送到不同的组件，例如服务（service）。\n\n![note](img/note.gif)有关用于 Android\
  \ 的 Mono 或 Android 应用程序基础构建模块的更多信息，请参阅官方 Android 文档中的应用程序基础部分 http://developer.android.com/guide/topics/fundamentals.html。\n\
  \n* * *\n\n## 组件间的通信：Android 意图\n现在你已经查看了 Android 应用程序的核心组件，你还需要开始理解这些应用程序部分是如何相互作用的。为了让\
  \ Android 平台的不同部分能够相互通信，Android 需要一个通用的消息系统。该消息系统必须在支持各种使用场景的同时，尊重应用程序组件的自主性。此外，该消息系统必须是一个通用的、被动的系统，可以被任何应用程序组件消费，无论源进程是否知道是谁在接收消息。这些概念导致了意图（intents）的产生。\n\
  \n意图构成了 Android 平台的消息系统。由于 Android 组件在所谓的“烟囱式”环境中运行，意图通过允许它们之间进行无缝通信提供了关键功能。特别是，意图可以用于执行以下操作：\n\
  \n*   通过请求活动（activity）启动新任务或启动新活动来与活动交互\n*   通过初始化新服务（service）或向正在运行的服务投递新的指令集来与服务交互\n\
  *   作为广播消息的媒介与广播接收器交互\n\n在某些方面，你可以将意图系统看作是将你的应用程序转换为更大的分布式应用程序的一部分的方式。这允许你通过利用另一个应用程序的功能为自己服务，从而节省大量时间。意图的一些常见使用场景包括播放下载的音乐、通知感兴趣的应用程序手机信号丢失，或将应用程序状态的变化传递给其他监听的应用程序。\n\
  \n![note](img/note.gif)Android 将意图作为核心设计原则。通过这个消息系统，Android 平台可以允许组件之间保持非常松的耦合，即使在同一个应用程序内也是如此。对发布/订阅模式（publish/subscribe\
  \ pattern）的遵循允许组件轻松地切换，而不会导致其他系统的巨大重构。\n\n* * *\n\n那么，意图是由什么组成的？在最基础的，意图是完成任务所需细节的抽象。意图对象中存储了若干条信息——要么是接收组件要执行的指令，要么是组件可能选择响应的某些数据。接收到意图后，如何响应并利用意图消息中存储的数据，取决于接收器本身。表\
  \ 3.4 描述了意图的核心部分。\n\n表 3.4 意图中的核心信息\n\n| 名称 | 描述 |\n| :--- | :--- |\n| Action |\
  \ 指定需要执行的操作。例如`ACTION_GET_CONTENT`、`ACTION_RUN`和`ACTION_SYNC`。 |\n| Data | 代表需要处理的数据。例如内容提供者某个特定记录的\
  \ URI。 |\n| Category | 用于提供有关要执行操作的更多信息。它可以用于指定操作方式的上下文，例如`CATEGORY_HOME`，甚至作为给定操作结果的过滤器。\
  \ |\n| Type | 允许覆盖自动解析并指定你自己的 MIME 类型。 |\n\n在本书的其余部分，你将遇到许多使用意图的场景。作为 Android 平台的消息系统，意图对于应用程序与设备功能之间的任何交互都是必要的。\n\
  \n# 组件绑定：Android Manifest\n到目前为止，本章讨论了 Android 应用程序的所有组件，特别讨论了每个组件在许多方面都是一个独立运行的自主实体。尽管这在重用性和设计方面是有益的，但需要某种绑定机制来保持应用程序的内聚性并存储访问的值。在\
  \ Android 中，这是通过 Android Manifest 实现的。\n\nAndroid Manifest 是位于应用程序根目录下的 XML 配置文件。该文件包含了\
  \ Android 系统创建应用程序进程所需的所有信息。此外，Android Manifest 还用于许多其他功能：\n\n*   包含应用程序元数据，例如唯一的包名、最小\
  \ SDK 级别、应用程序图标或应用程序主题。\n*   绑定应用程序组件。包括活动、服务、广播接收器和内容提供者的核心组件。\n*   通过说明哪些意图消息绑定到哪些应用程序组件，描述每个组件的能力。\n\
  *   声明应用程序运行所需的权限，以及其他应用程序利用其功能必须具备的权限。\n*   定义应用程序运行所需的其他代码库。\n\n## Android Manifest\
  \ 基础\n\n\n\n\n\nAndroid manifest 是一个结构化文档，支持许多不同的配置场景。初看之下，它可能显得有些复杂，维护起来甚至像是一场噩梦。尽管在维护方面它有时会让人头疼，但对\
  \ manifest 的底层规则和结构有基本的理解，对于消除神秘感并简化它大有帮助。\n\n首先，Android manifest 可使用的节点数量有限。作为开发者，你不能在\
  \ Android manifest 中定义新节点。基于此，下面的 XML 代码段显示了 Android manifest 中可能的主要节点以及通层级结构。\n\
  \n```xml\n<?xml version=\"1.0\" encoding=\"utf-8\" ?>\n<manifest>\n     <permission\
  \ />\n     <uses-permission />\n     <permission-tree />\n     <permission-group\
  \ />\n     <instrumentation />\n     <uses-sdk />\n     <uses-configuration />\n\
  \     <uses-feature />\n     <supports-screens />\n     <application>\n        \
  \  <activity />\n          <activity-alias />\n          <service />\n         \
  \ <receiver />\n          <provider />\n     </application>\n</manifest>\n```\n\n\
  虽然这定义了 Android manifest 的整体结构，但并不意味着同一层级的节点需要按照特定顺序出现。事实上，唯一对顺序有要求的节点是 `activity-alias`\
  \ 节点。该节点必须跟在其所别名的 activity 之后。\n\n现在你已经对 Android manifest 的通用结构有了大致了解，是时候审查每个可用节点的功能了。表\
  \ 3.5 列出了大多数可用节点并描述了它们的通用用途。通过与前述段所示的层级结构进行交叉引用，你可以很好地了解 manifest 的工作原理以及你可以使用的配置选项。此表并非详尽的，但它能让你掌握每个节点用途的实用知识，以便在在任何\
  \ Android 应用中看到它们时能够识别开发者的意图。\n\n![note](img/note.gif) 不要被可用的节点和属性的数量所震慑。尽管 manifest\
  \ 中有很多选项，但 Android 操作系统只需要 `manifest` 和 `application` 节点。其他节点用于定义细节，以及执行你在开发应用时将添加的操作所需的权限。\n\
  \n***\n\n### Android Manifest 元素 (表 3.5)\n\n| 元素 |  |\n| :--- | :--- |\n| `manifest`\
  \ | 任何 Android manifest 的根节点。这是一个节点节点。除了作为 Android manifest 的根节点外，它还可以包含定义包名、版本号和名称、Linux\
  \ 用户 ID 以及首选安装位置的属性。 |\n| `uses-permission` | 用于定义应用程序正确运行必须具备的权限。无论你请求哪些权限，在应用程序安装到设备之前，都会提交给用户批准。\
  \ |\n| `permission` | 允许开发者定义访问共享应用程序组件所需的权限。当另一个应用程序尝试使用你应用的功能时，它必须使用 `uses-permission`\
  \ 属性向你的应用程序请求指定的权限。 |\n| | 你可以使用预定义的字符串值（如“normal”和“dangerous”来来定义不同的保护级别，以暗示允许此类访问的潜在风险。\
  \ |\n| `permission-tree` | 作为应用程序可以动态添加权限的“占位符”。通过使用 `PackageManager` 类，应用程序可以根据请求确定添加哪些权限元素。\
  \ |\n| `permission-group` | 创建权限的逻辑分组。这允许 Android 操作系统在向应用用户展示验证时，在视觉上将这些权限分组。 |\n\
  | `instrumentation` | 为开发者提供测试和监控钩子，以检查应用程序如何与系统及其资源交互。为了实现这一点，`instrumentation`\
  \ 对象会在任何其他应用程序组件之前实例化。 |\n| `uses-sdk` | 允许你为应用程序设置兼容级别。你可以灵活地设置最小、最大和目标 SDK 级别。不要将\
  \ SDK 级别与 Android 系统的版本号混淆。 |\n| `uses-configuration` | 允许你指定应用程序可以使用或需要运行的硬件和软件输入功能。在此部分绑定的项目可以是硬件键盘、轨迹球、滚轮和触摸屏。这还用于当用户安装依赖于其设备不支持的功能的应用程序时对其发出警告。你也可以为每个功能定义多个项目。\
  \ |\n| `uses-feature` | 允许你确定应用程序将使用的单个软件或硬件功能。此外，你还可以说明该功能是必须的（意味着应用程序必须拥有它才能运行）还是仅为偏的。请求的硬件功能示例包括蓝牙、摄像头、位置和麦克风。\
  \ |\n| `supports-screens` | 定义你的应用程序将支持的屏幕尺寸。在有 Google TV 和 Android 平板的世界里，这个节点变得越来越重要，因为你可以定义希望应用程序运行在哪些屏幕上。默认情况下，除非另有说明，Android\
  \ 应用设置为支持所有屏幕尺寸。 |\n| `application` | 用于定义应用程序的元数据。以这种方式设置的值被视为所有应用程序组件的默认值。每个 manifest\
  \ 中只能有一个 `application` 节点。 |\n| | 除了元数据外，该节点还包含描述应用程序组件（服务、广播接收器、内容提供者）及其通信和配置的子节点。\
  \ |\n| `activity` | 作为 activity 组件的声明。在 Android 操作系统运行它们之前，所有 activity 都必须在 manifest\
  \ 中声明。此外，你还可以设置 activity 元数据和设置，如名称、标签和屏幕方向。 |\n| `activity-alias` | 将目标 activity\
  \ 作为独立实体呈现给 Android 操作系统。通过，你可以更改目标 activity 的原始属性，例如意图过滤器和属性。 |\n| `service` |\
  \ 声明服务组件。在 Android 操作系统运行它们之前，所有服务都必须在 manifest 中声明。 |\n| `receiver` | 声明广播接收器组件。这是创建广播接收器以监听事件两种方法之一。声明接收器的第二方法是通过调用\
  \ `Context.registerReceiver()` 方法。 |\n| `provider` | 指定你应用程序的每个内容提供者。如果你的应用程序正在创建一个自定义提供者，除非在\
  \ Android manifest 中声明，否则系统无法使用该内容提供者。 |\n| `intent-filter` | 指定给定应用程序组件可以响应的意图类型。它可以是\
  \ activity、service 和 receiver 节点的子节点。该节点允许你定义想要接收的意图类型，同时过滤所有其他类型的意图。 |\n| `meta-data`\
  \ | 包含额外的开发者定义的键值对数据，这些数据可以被所在的应用程序组件利用。它是 activity、service、provider 和 receiver\
  \ 节点的子节点。 |\n| `uses-library` | 允许你指定应用程序可能依赖的任何共享库。 |\n\n\n\n\n\nAndroid manifest\
  \ 是一项强大的工具，充当应用程序的“胶水”。它不仅为你的应用程序提供了身份和目的，还将应用程序中的所有各个组件整合在一起。最后，你可以使用 Android manifest\
  \ 在同一个位置对所有应用程序组件的权限和通用配置属性进行微调。\n\n关于 `AndroidManifest.xml` 或其任何组件的更多信息，请查看 Mono\
  \ for Android 文档或 Android 官方文档：\n\n*   Mono for Android: [`mono-android.net/Documentation/Guides/Working_with_AndroidManifest.xml`](http://mono-android.net/Documentation/Guides/Working_with_AndroidManifest.xml)\n\
  *   Official Android: [`developer.android.com/guide/topics/manifest/manifest-intro.html`](http://developer.android.com/guide/topics/manifest/manifest-intro.html)\n\
  \n# 如何通过 Visual Studio 为 Mono for Android 编辑 Manifest\n\n尽管许多“Android 特性”可以很好地迁移到\
  \ Mono for Android 世界，但某些领域仅适用于 Mono for Android。在这种情况下，编辑 `AndroidManifest.xml`\
  \ 的位置和所使用的工具 set 与典型的 Android 应用程序有很大不同。\n\n当创建一个新应用程序时，`AndroidManifest.xml` 并不是项目的一部分。正如你在上一章中所学的，Mono\
  \ for Android 之所以可能，是因为它在构建时会生成相应的 Java 和配置代码。因此，`AndroidManifest.xml` 并不是 Mono\
  \ for Android 应用程序的必要部分，因为在你发布应用程序时，它会自动为你生成一个 manifest。\n\n尽管 Mono for Android\
  \ 工具集会自动生成你的 manifest 文件，但这并不意味着你不需要编辑或理解 manifest 的内部工作机制。\n\n在 Visual Studio 中，你有三种主要方法来编辑\
  \ `AndroidManifest.xml`。在这三种方法中，有两种不需要使用物理 manifest 文件。\n\n*   Mono for Android\
  \ 允许你编辑 `AndroidManifest.xml` 的第一种方法是，为许多不同的 Android 组件创建大量的类属性（class attributes）。这些属性允许你在代码中定义配置选项。当应用程序编译时，运行时会读取这些属性并将适当的信息添加到生成的\
  \ manifest 文件中。其中一个例子就是我们在本章早些时候讨论的 `activity`。\n\n当你用 `Activity` 属性装饰一个类时，框架会自动向你的\
  \ `AndroidManifest.xml` 附加正确的 activity 节点。此外，设置属性的值将导致为该活动生成正确的子节点。考虑以下代码段：\n\n\
  ```\n[Activity(Label = \"Demo_Application\", MainLauncher = true,\nPermission =\
  \ \"READ_CONTACTS\",MultiProcess = false,\nScreenOrientation = Android.Content.PM.ScreenOrientation.Landscape)]\n\
  ```\n\n一旦你的应用程序编译完成，运行时会在 `AndroidManifest.xml` 中生成以下 XML：\n\n```xml\n<activity\
  \ android:label=\"Demo_Application\" android:multiprocess=\"false\"\n     android:permission=\"\
  READ_CONTACTS\" android:screenOrientation=\"landscape\"\n     android:name=\"testing_01.Activity1\"\
  >\n     <intent-filter>\n          <action android:name=\"android.intent.action.MAIN\"\
  \ />\n          <category android:name=\"android.intent.category.LAUNCHER\" />\n\
  \     </intent-filter>\n</activity>\n```\n\n你可以看到，生成的 XML 符合我们之前讨论的 `AndroidManifest.xml`\
  \ 的层次结构和规则。\n\n*   在 Visual Studio 中编辑 `AndroidManifest.xml` 文件的第二种方法是在 Visual Studio\
  \ 应用程序属性窗口中更改特定设置。为了方便起见，Mono for Android 在窗口中包含了全局配置工具，允许你快速添加和编辑 `AndroidManifest.xml`\
  \ 中的不同项目。图 3.2 显示了在 Visual Studio 中调整全局应用程序权限的配置窗口。\n\n*   最后，编辑 `AndroidManifest.xml`\
  \ 的第三种方法是在 Visual Studio 内部物理编辑 manifest XML。虽然它不是默认生成的，但 `AndroidManifest.xml`\
  \ 文件位于应用程序的 `Properties` 文件夹中。如果你在那里没有看到该文件，可以通过进入应用程序设置，并在 Application 选项卡下选择“No\
  \ AndroidManifest.xml found. Click to add one.”链接来强制系统为你生成一个 manifest，如 图 3.3 所示。\n\
  \n![note](img/warning.gif)虽然这是不而喻的，但在手动编辑 `AndroidManifest.xml` 时要加小心。尽管你可以手动编辑，但通常好的做法是使用正确的属性值让系统自动为你生成相应的节点。由于\
  \ Visual Studio 中 `AndroidManifest.xml` 的部分内容是代码生成的结果，manifest 中的某些手动编辑可能会在编译之间丢失。\n\
  \nFigure 3.2\n![3.2](img/c03f002.jpg)\n\nFigure 3.3\n![3.3](img/c03f003.jpg)\n\n\
  # 总结\n\nMono for Android 为 C# 和 .NET 开发者开发 Android 应用程序提供了极大的便利。由于它遵循了 Java API\
  \ 的通用意图和命名结构，使得开发体验感觉就像在使用原生 API 一样。\n\n然而，这并不意味着你不需要对 Android 平台良好的良好的。通过对意、内容提供者（content\
  \ providers）、服务（services）、广播接收器和活动有深入的理解，你可以开发出不仅能够充分利用设备功能，还能与其他应用程序交互的程序。\n\n\n\
  \n\n\n*   用户在使用设备时通常处于移动状态。想象一下，在机场穿行、在办公室走廊走动或在锻炼时访问应用程序的用户数量。应用程序的用户界面需要考虑到运动和震动的影响。例如，在列表视图（listview）中显示数据是很常见的。用户期望选择一个单元格并获取更详细的信息。单元格的大小应该使得在选择单元格时留有一定的容错空间。这将提高用户选择正确项目的能力。\n\
  \n*   由于移动设备的屏幕较小，呈现给用户的文本需要足够大，以便用户能够易地查看所展示的数据。\n\n*   在运行应用程序时，无法控制移动设备所在的位置。它可能直接处于阳光下，也可能在午夜的停车场里。应用程序在运行时需要易于易读。这可能涉及屏幕颜色或应用程序主题的组合。\n\
  \n![note](img/note.gif) 当然，这只是一些最常见的注意事项准则的简短列表。如需更多准则，我们建议您查看 Android 用户界面指南。您可以在\
  \ `http://developer.android.com/guide/practices/ui_guidelines/index.html` 找到各种文档。\n\
  \n***\n\n# 构建 Android UI\n\n在 Android 中构建用户界面的开发者会发现一些与他们现有 .NET 应用程序类似的概念。Android\
  \ 使用程序员熟悉的“控件”（controls）概念。以下是一些看起来很熟悉的控件的特征：\n\n*   可以设置属性来获取控件的值或更改控件的默认功能。\n\n\
  *   程序可以处理事件，例如按钮点击或值更改。\n\n*   控件可以分组在名为 `View` 或 `ViewGroup` 的层级结构中。\n\n*   可以对控件进行主题处理，从而可以改变一组控件的外观。\n\
  \n## Views\n\nAndroid 用户界面基于 `View` 和 `ViewGroup` 对象。`View` 类是小部件（widgets）的基础，如文本字段、旋转选择器（spinners）、按钮、时钟和日期选择器等\
  \ UI 对象。`ViewGroup` 是布局子类的基础。`Activity` 的用户界面由 `View` 和 `ViewGroup` 节点树树组成。树的顶端是一个\
  \ `ViewGroup`。要显示视图层次结构，`Activity` 调用 `SetContentView(Resource)` 来加载 `Resource`\
  \ 视图并开始绘制该树。\n\n## 设计表面\n\n使用 WebForms、WinForms 或其他应用程序构建用户界面的 .NET 开发者熟悉“设计表面”（design\
  \ surface）的概念。通过设计表面，您可以使用一组控件向用户显示数据。Android 开发者工具包含一个 Eclipse 插件，允许您创建用户界面。然而，这尚未集成到\
  \ Mono for Android 中，且不在 Visual Studio 中工作。在本文编写时，Mono for Android 还没有它自己的设计表面。它确实提供了\
  \ IntelliSense 用于手动创建用户界面。然而，鉴于手动创建用户界面容易出错，我们建议您寻找用于创建用户界面的层级工具，例如 `DroidDraw`。`DroidDraw`\
  \ 有一个可以使用来构建应用 UI 的网站，还有一个可下载的 Java 应用程序。关于 `DroidDraw` 的更多信息，请访问 `http://droiddraw.org`。\n\
  \n图 4.1 显示了 `DroidDraw`。左侧显示已定义的用户界面。右上部分显示了您可以设置的选项，允许您设置 UI 元素的属性。右下部分显示了为 UI\
  \ 生成的 XML。XML 不会自动更新；您必须点击 `Generate` 按钮来创建它。\n\n图 4.1\n\n![4.1](img/c04f001.jpg)\n\
  \n# 选择控件布局\n\nAndroid UI 有不同的布局可以使用可以使用。布局定义了其子控件在屏幕上的排列方式。Android 有五种标准布局：\n\n\
  *   `AbsoluteLayout` 将所有控件放置在定义的位置。该布局已弃用。建议改用 `FrameLayout` 或 `RelativeLayout`。\n\
  \n*   `FrameLayout` 显示单个项目，例如图像。\n\n*   `LinearLayout` 沿单行（水平或垂直）显示子控件。\n\n*   `RelativeLayout`\
  \ 将控件放置在相对于其他控件的位置。\n\n*   `TableLayout` 以行/列风格布局显示控件。\n\n## AbsoluteLayout\n\n\
  `AbsoluteLayout` 是允许开发者在定义的位置放置视图的布局。`AbsoluteLayout` 已弃用。建议改用 `FrameLayout` 或 `RelativeLayout`。尽管如此，如果您需要使用\
  \ `AbsoluteLayout`，列表 4.1 显示了必要的 XML。\n\n![download](img/download.gif) 列表 4.1: AbsoluteLayout\
  \ XML\n\n```xml\n<?xml version=\"1.0\" encoding=\"utf-8\"?>\n<AbsoluteLayout\nandroid:id=\"\
  @+id/widget31\"\nandroid:layout_width=\"fill_parent\"\nandroid:layout_height=\"\
  fill_parent\"\nxmlns:android=\"http://schemas.android.com/apk/res/android\">\n \
  \ <Spinner\n    android:id=\"@+id/widget27\"\n    android:layout_width=\"wrap_content\"\
  \n    android:layout_height=\"wrap_content\"\n    android:layout_x=\"10px\"\n  \
  \  android:layout_y=\"20px\"\n  />\n  <EditText\n    android:id=\"@+id/widget29\"\
  \n    android:layout_width=\"wrap_content\"\n    android:layout_height=\"wrap_content\"\
  \n    android:text=\"EditText\"\n    android:textSize=\"18sp\"\n    android:layout_x=\"\
  15px\"\n    android:layout_y=\"50px\"\n  />\n  <AnalogClock\n    android:id=\"@+id/widget30\"\
  \n    android:layout_width=\"wrap_content\"\n    android:layout_height=\"wrap_content\"\
  \n    android:layout_x=\"20px\"\n    android:layout_y=\"62px\"\n  />\n</AbsoluteLayout>\n\
  ```\n\n此代码包含在 `Layouts\\Layouts\\Resources\\Layout\\absolute.axml`\n\n图 4.2 显示了之前定义的\
  \ `AbsoluteLayout` 输出。\n\n![4.2](img/02.jpg)\n\n## FrameLayout\n\n`FrameLayout`\
  \ 是最简单的布局选项。它设计用于在屏幕上显示单个对象。`FrameLayout` 中的所有元素都固定在左上角。如果 `FrameLayout` 中有多个元素，它们将在相同的位置绘制并相互干扰。\n\
  \n## LinearLayout\n\n`LinearLayout` 将所有对象垂直或水平对齐。取决于 `orientation` 属性。所有元素一个接一个显示。如果\
