  \n如果你添加了一些文本并从菜单中选择 `Save`（保存），该文本将被保存，并在你每次重新进入程序时自动加载。为了改进该程序，你应该尝试几件事：增强 `OpenFile`\
  \ 函数，使其不受 1024 字节缓冲区的限制。此外，将 `SaveFile` 绑定到文本更改事件，这样用户就不需要记住保存自己的内容。\n\n# 使用应用程序设置\n\
  \n本节将介绍应用程序设置（Application Preferences）。首先将设置介绍类型，然后讨论设置 API，最后通过一个示例程序演示如何操作设置。\n\
  \n## 应用程序设置类型\n\n应用程序设置是键值对的简单映射。键值对通过一个键字符串以及一组特定的类型进行存储：\n\n- Boolean（布尔）\n- Float（浮点数）\n\
  - Int（整数）\n- Long（长整数）\n- String（字符串）\n\n设置有两种：私有和共享。私有设置适用于应用程序内部的活动。共享设置经过命名后可以打开。它们的调用方式如下：\n\
  \n- `GetPreferences(mode)`\n- `GetaredPreferences(name)`\n\n由于私有设置是私有的，其他活动无法访问，因此调用时不需要名称——只需要访问模式。实际上，该函数通过使用类名作为名称来调用第二个函数。\n\
  \n然而，`GetaredPreferences` 需要两个参数。第一个参数是设置文件的名称，第二个参数是文件访问模式。这些模式在上一节中提到过，但现在可用的模式限于：\n\
  \n- `FileCreationMode.Private`（私有）\n- `FileCreationMode.WorldReadable`（全局可读）\n-\
  \ `FileCreationMode.WorldWriteable`（全局可写）\n\n![note](img/note.gif)你可能会问：“既然可以使用私有模式的共享设置，私有设置有什么好处？”答案是简单的方便，这也是\
  \ Android 中的常见场景。鉴于 Android 活动并不控制自己的生命周期，且用户可能会随时离开，你经常需要保存活动状态。因此，调用 `GetPreferences(mode)`\
  \ 可以为你提供一个很好的对象，用于存储部分输入的文本或其他完成的设置。\n\n# 创建自己的应用程序设置\n\n如何创建自己的应用程序设置？有两种方法。首先，你将查看一些代码片段，演示如何手动创建私有共享设置。然后，你将查看一个使用标准设置屏幕创建设置值的示例程序。请考虑以下代码片段：\n\
  \n```\nISharedPreferences p = GetPreferences(FileCreationMode.Private);\nString\
  \ value = p.GetString(\"MyTextValue\", \"\");\n```\n\n\n\n\n第一行获取了私有的 `ISharedPreferences`\
  \ 对象。再次，重要的是，`GetPreferences()` 和 `GetSharedPreferences()` 返回的都是 `ISharedPreferences`\
  \ 类型的对象。然后，第二行检索存储在键“MyTextValue”下的值。如果没有该值，它将返回第二个参数作为默认值——在本例中是一个空字符串。共有六个访问器方法：\n\
  \n* `GetString`\n* `GetFloat`\n* `GetInt`\n* `GetLong`\n* `GetBoolean`\n* `GetAll`\n\
  \n前五个方法返回由函数指定的数据类型的单个值。最后一个函数返回一个包含系统中所有键和值的映射（map）。\n\n现在你已经了解了如何从 `ISharedPreferences`\
  \ 对象中读取值，那么如何更改此对象中的值呢？答案是使用 `SharedPreferences.Editor` 接口。你通过对 `ISharedPreferences`\
  \ 对象调用 `p.Edit()` 来访问此接口。以下代码段显示了获取、编辑和存储编辑后的值：\n\n```\nISharedPreferences p = GetPreferences(FileCreationMode.Private);\n\
  String value = p.GetString(\"MyTextValue\", \"\");\nvalue = \"New Value\";\nISharedPreferencesEditor\
  \ e = p.Edit();\ne.PutString(\"MyTextValue\",value);\ne.Commit();\n```\n\n在这里，你通过调用\
  \ `GetPreferences()` 获取 `ISharedPreferences`。然后，你检索存储在键“MyTextValue”下的任何字符串，如果没有值则返回\
  \ \"\"。然后将值字符串赋值为“New Value”。调用 `p.Edit()` 返回 `ISharedPreferencesEditor`，用于将字符串“New\
  \ Value”存储到键“MyTextValue”中。最后调用一次 `e.Commit()` 将更改写入磁盘。\n\n有五个函数用于在 `SharedPreferencesEditor`\
  \ 中存储值：\n\n* `PutString(string key, string value)`\n* `PutInt(string key, int value)`\n\
  * `PutLong(string key, long value)`\n* `PutFloat(string key, float value)`\n* `PutBoolean(string\
  \ key, boolean value)`\n\n有两个函数用于移除键：\n\n* `Remove(string key)`\n* `Clear()`\n\n\
  `Remove` 移除由键指定的键值对，而 `Clear` 移除所有键值对。\n\n然后需要注意的是，所有的更改都是批处理的，在调用以下函数之前不会被保存：\n\
  \n* `Boolean Commit();`\n\n`Commit()` 发起同步调用以立即写入存储，并为该调用提供 `Boolean` 结果。\n\n##\
  \ Preferences 程序\n\n本节向你展示如何在示例程序中创建一个设置屏幕以及如何使用该屏幕更新偏好值。在这个示例中，你将使用 preferences\
  \ 命名空间中的对象，这些对象在表 7.3 中描述。\n\n### 表 7.3 Preferences 命名空间\n\n| 类型 |  |\n| :--- |\
  \ :--- |\n| `CheckBoxPreference` | 此偏好在 `SharedPreferences` 中存储一个 `Boolean`。 |\n\
  | `DialogPreference` | 这是基于对话框的 `Android.Preferences.Preference` 对象的基类。 |\n| `EditTextPreference`\
  \ | 此偏好允许将可编辑字符串存储到偏好文件中。 |\n| `ListPreference` | 此偏好从可用字符串列表中在 `SharedPreferences`\
  \ 中存储一个字符串。 |\n| `Preference` | 此类包含一个键，该键将作为进入 `Android.Content.ISharedPreferences`\
  \ 的键。 |\n| `PreferenceActivity` | 为了方便起见，此活动实现了当前层次结构中任何偏好的点击监听器。 |\n| `PreferenceCategory`\
  \ | 用于分组 `Android.Preferences.Preference` 对象，并在组上方提供一个禁用的标题。 |\n| `PreferenceGroup`\
  \ | 多个 `Android.Preferences.Preference` 对象的容器。 |\n| `PreferenceScreen` | 用于将偏好分组到另一个屏幕上，这样当点击标题时，会打开一个带有分组偏好的新偏好屏幕。\
  \ |\n| `RingtonePreference` | 允许用户选择铃声。如果用户选择默认（Default）项，保存的字符串是 `Android.Provider.Settings.System.DefaultRingtoneUri`、`Android.Provider.Settings.System.DefaultNotificationUri`\
  \ 或 `Android.Provider.Settings.System.DefaultAlarmAlertUri` 之一。 |\n\n这些对象大多数不需要直接编码，但你将在\
  \ `PreferenceScreen` 布局中利用它们。现在让我们开始吧。第一步是创建一个新的 Android 程序。这次你将把它命名为 `MonoForAndroidPreferences`。\n\
