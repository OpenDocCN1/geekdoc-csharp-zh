  \   android:background=\"@drawable/robotbackground_gradient\" />\n</TableRow>\n\
  ```\n\n`Graphics_Drawables\\Graphics_Drawables\\Resources\\Layout\\Main.axml`\n\n\
  完成后，运行你的应用程序。当它加载时，你将看到机器人军队前三个版本的对比。假设一切顺利，设备的最终输出应该像图 12.8\n\n![12.8](img/c12f008.jpg)\n\
  \n### 案例 4：使用复合绘制资源\n\n在查看了第三版本的机器人军队后，你发现了一个问题。之前，你为每个代表机器人的 `ImageButton` 创建了渐变效果作为背景。虽然这种效果改进了之前的外观，但该效果的意图是在按钮顶部创建一个某种“光泽”效果，以为机器人显示增加深度和风格。查看结果，你可以发现你成功创建了一个具有风格感但扁平的图像。你决定需要采取措施为下一个版本的机器人添加更多深度。\n\
  \n在之前的几节中，你使用图像和形状的简单绘制资源（simple drawables）创建了机器人军队。利用框架，你多次添加了机器人图像绘制资源，创建了多行背景样式日益复杂的机器人。然后，通过使用形状\
  \ XML 资源，你快速高效地调整了这些多个机器人的外观。\n\n虽然使用单个绘制资源可以完成很多工作，但这种方法也有其局限性。如果你想在不同的绘制资源之间进行更高级的集成怎么办？如果你想创建叠加效果，从而为最终图像添加深度怎么办？如果你想用一种方法在组绘制资源上定义属性，同时保持它们的定义相互独立怎么办？当你到达这一点时，复合绘制资源（compound\
  \ drawables）可以将你的应用程序提升到层次。\n\n正如本章早期提到的，复合绘制资源是一种专门用于处理一组其他绘制资源的绘制资源。尽管许多绘制资源有它们自己的绘制操作，但它们擅长在一个绘制资源和另一个绘制资源之间创建交互点。因此，它们可以作为多个绘制声明之间的绑定力量，通常将它们合并成一个新的、更具交互性的绘制资源。\n\
  \n为了说明复合绘制资源的使用，我们将继续机器人军队示例。在最后一个版本中，渐变效果并不尽如人意。添加简单的渐变创建了一个看起来很好但扁平的机器人，而不是增加深度。要修复这个问题，你需要修改几点：\n\
  \n*   不要使用一个部分是渐变的单一背景，而是需要两个不同的背景。一个是你在第二个示例中使用的纯色、简单背景。另一个是代表渐变效果的叠加层（overlay）。\n\
  *   为了完成这种效果，叠加的背景需要看起来就像是它不属于另一个背景的一部分。如果你在叠加层上添加一点透明度，底层背景看起来就像具有曲率和深度。\n\n遗憾的是，这种交互通过简单绘制资源是不可能实现的。无论你多么巧妙（除非导入图像资源），生成的图像将是扁平的，或者整个层最终都会带有某种透明度。然而，这个挑战可以通过一种名为\
  \ `LayerDrawable` 的复合绘制资源轻松解决，它可以用于管理底层绘制资源的集合。使用基于列表的方法，`LayerDrawable` 内部的项目是逐个渲染的，从集合中的第一个项目到最后一个项目处理。在面向对象的理解中，你可以将\
  \ `LayerDrawable` 认为类似于数组。\n\n此外，`LayerDrawable` 有一个方面使其与 Mono for Android 中的许多其他列表控件区别开来。与\
  \ `LinearLayout` 等其他列表控件不同，`LayerDrawable` 中的项不会根据上一个项的结束位置来偏移它们的绘制位置。相反，`LayerDrawable`\
  \ 中的项从相同的起点开始绘制，除非另有指示。\n\n![警告](img/warning.gif)在处理 `LayerDrawable` 内绘制资源的放置时，如果你不打算让绘制资源完全重叠，通常会遇到意料之外的结果。这是因为绘制资源通常会缩放以填充分配给它们的空间，尽管给出了偏移值。某些绘制资源对于这个问题没有明确的解决方法。但有时是可以变通的。例如，当你处理如位图等基本绘制资源时，可以通过将位图的重力设置为居中来避免缩放问题。虽然这种情况在\
  \ Android 开发者文档中有相关记录，但该领域的整体文档少得令人沮丧。\n\nLayerDrawable 的 XML 声明通过`<layer-list>`\
  \ 节点实现。在该节点内，绘制资源的每个“层”都是使用`<item>` 子元素标签定义的。\n\n`item` 节点是一个灵活的容器，可以用以两种方式使用。首先，该项暴露了一个名为\
  \ `android:drawable` 的属性。你可以使用此属性来指定应该绘制的绘制资源，使用整个 Mono for Android 中相同的绘制资源语法 `@drawable\\\
  drawable_name`。第二个选项是在 `item` 节点内通过添加任何 XML 声明来定义自定义绘制资源。\n\n最后，`item` 节点暴露了几个属性，允许定义顶部、底部、左侧和右侧的自定义偏移。这为每个绘制资源到\
  \ `Canvas` 对象提供了灵活性。\n\n使用相同的 `GraphicsDrawable_RobotArmy` 项目，你可以开始制作机器人的下一个版本。在\
  \ `Resources/Drawable` 目录添加一个新的 XML 文件，命名为 `RobotBackground_GradientOverlay.xml`。\n\
  \n在此文件中，使用`<layer-list>` 的 XML 语法添加 LayerDrawable 的声明。在此绘制资源中，将添加两个 `item` 子节点来包含以下对象：\n\
  \n*   引用 `RobotBackground` 绘制资源可以为机器人 `ImageButton` 提供基础的纯色背景。由于你希望初始背景是纯色，这是使用的完美资源。此外，这是资源链的一个良好示例。\n\
  \n\n\n\n*   一个新的形状对象定义了覆盖层渐变。虽然此形状对象将与原始 `RobotBackground` 形状共享圆角和描边的值，但它将具有一个特殊的渐变以创建出叠加效果。接下来，为了创建透明效果，你向颜色十六进制字符串添加了\
  \ Alpha 混合（alpha blending）信息。在这种情况下，你希望从半透明白色过渡到完全透明的白色。\n\n考虑到这些点，将这两项添加到 `<layout-list>`\
  \ 节点中。完成后，结果应该看起来如列表 12.23 所示。\n\n![download](img/download.gif) 列表 12.23: 创建布局列表\n\
  \n```xml\n<?xml version=\"1.0\" encoding=\"utf-8\" ?>\n<layer-list xmlns:android=\"\
  http://schemas.android.com/apk/res/android\" >\n     <item android:drawable=\"@drawable/robotbackground\"\
  ></item>\n     <item>\n          <shape xmlns:android=\"http://schemas.android.com/apk/res/android\"\
  \n               android:shape=\"rectangle\">\n               <corners android:radius=\"\
  5dp\" />\n               <stroke android:width=\"1dp\" android:color=\"#FFFFFF\"\
  \ />\n               <gradient\n                    android:type=\"linear\"\n  \
  \                  android:startColor=\"#88FFFFFF\"\n                    android:centerColor=\"\
  #00FFFFFF\"\n                    android:endColor=\"#00FFFFFF\"\n              \
  \      android:angle=\"270\"/>\n          </shape>\n     </item>\n</layer-list>\n\
  ```\n\n`Graphics_Drawables\\Graphics_Drawables\\Resources\\Drawable\\RobotBackground_GradientOverlay.xml`\n\
  \n此列表与之前的示例没有太大区别，区别在于 `LayoutDrawable` 允许你在一个资源文件中定义两个简单的可绘制性（drawable）。关于新的形状可绘制性，请注意渐变的起始颜色、中间颜色和结束颜色。如你所见，这些颜色通过在十六进制字符串的开头添加两个额外的数字来指定\
  \ Alpha 透明度。由于值 `FF` 表示不透明而 `00` 表示透明，因此此示例使用中间值 `88` 作为起始，并在图像中间附近变为完全透明。\n\n现在新的可绘制性已经定义完成，进入\
  \ `Main.axml` 文件并复制表格布局中的最后一行。粘贴新的一行，并调整每个 `ImageButton` 的背景属性，以便它们使用新的可绘制性作为背景。列表\
  \ 12.24 显示了更新后的行值。\n\n![download](img/download.gif) 列表 12.24: 在表格视图中定义机器人背景的渐变叠加层\n\
  \n```xml\n<TableRow>\n     <ImageButton android:src=\"@drawable/androidrobot\" android:layout_margin=\"\
  2dp\"\n          android:background=\"@drawable/robotbackground_gradientoverlay\"\
  \ />\n     <ImageButton android:src=\"@drawable/androidrobot\" android:layout_margin=\"\
  2dp\"\n          android:background=\"@drawable/robotbackground_gradientoverlay\"\
  \ />\n     <ImageButton android:src=\"@drawable/androidrobot\" android:layout_margin=\"\
  2dp\"\n          android:background=\"@drawable/robotbackground_gradientoverlay\"\
  \ />\n     <ImageButton android:src=\"@drawable/androidrobot\" android:layout_margin=\"\
  2dp\"\n          android:background=\"@drawable/robotbackground_gradientoverlay\"\
  \ />\n</TableRow>\n```\n\n`Graphics_Drawables\\Graphics_Drawables\\Resources\\Layout\\\
  Main.axml`\n\n在添加这些项目后，运行应用程序并检查最终结果。你应该看到一个新版本的机器人，看起来很有设计感，仿佛具有深度（参见图 12.9）。\n\
  \n图 12.9\n\n![12.9](img/c12f009.jpg)\n\n### 案例 5：与自定义可绘制性交互\n\n最后，机器人军队的最新模型在视觉上是完美的。当你观察之前的迭代时，你会看到机器人的外观有了显著提升。现在是时候画点睛之笔了——赋予机器人生命，让它们能够与设备用户交互。\n\
  \n为了提高机器人的实用性，你希望它们对手指的触摸做出响应。具体来说，你希望它们通过更新相应机器人的背景颜色，给出已被按下的视觉提示。尽管你可以通过在 C# 中添加事件处理器来响应\
  \ `OnTouchEvent` 并使用代码的方法，但你可以通过 `StateList` 可绘制性以更简单且基于 XML 的方式来实现。\n\n`StateList`\
  \ 可绘制性类似于 `LayerDrawable`，用作其他可绘制性的容器。与 `LayerDrawable` 不同，`StateList` 不会始终绘制其中包含的所有可绘制性。相反，它包含了选择性绘制满足某些预定义条件的特定可绘制项目的逻辑。\n\
  \n![note](img/note.gif)与其说 LayerDrawable 像一个开关，而 StateList 使用 `<selector>` 标签定义。每个项目都可以具有任意数量的属性。此外，记住你还可以指定条件为真或为假时的行为。这为你提供了几近\
  \ 100 种不同的选项可以测试！\n\n| 条件 | 描述 |\n| :--- | :--- |\n| `state_pressed` | 切换项目已被按下\
  \ |\n| `state_focused` | 切换项目通过轨迹球或 D 键获得焦点 |\n| `state_selected` | 切换项目处于选中状态，如标签页或菜单\
  \ |\n| `state_checkable` | 切换项目是可选的 |\n| `state_checked` | 切换项目已被勾选 |\n| `state_enabled`\
  \ | 切换项目可以接收触摸事件 |\n| `state_window_focused` | 切换项目处于窗口前台 |\n\n\n\n\n在 `Resources/Drawable`\
  \ 目录下添加一个名为 `RobotBackground_StateAware.xml` 的最终绘制资源。在该文件中，创建两个 `item` 节点。第一个 `item`\
  \ 节点在没有被按下状态时激活，另一个在被按下时激活。在每个 `item` 中，为与其匹配的状态表示形式分配正确的背景 drawable 资源。代码列表 12.25\
  \ 显示了 `StateList` drawable 的正确声明。\n\n![下载](img/download.gif) 代码 列表 12.25: 创建一个状态列表\n\
  \n```xml\n<?xml version=\"1.0\" encoding=\"utf-8\" ?>\n<selector xmlns:android=\"\
  http://schemas.android.com/apk/res/android\" >\n     <item android:drawable=\"@drawable/robotbackground_gradientoverlay\"\
  \n          android:state_pressed=\"false\"/>\n     <item android:drawable=\"@drawable/robotbackground_gradientoverlay2\"\
  \n          android:state_pressed=\"true\"/>\n</selector>\n```\n\n`Graphics_Drawables\\\
  Graphics_Drawables\\Resources\\Drawable\\RobotBackground_StateAware.xml`\n\n如列表所示，第一个渐变叠加\
  \ drawable 是机器人 `ImageButton` 的默认状态。然而，当被按下时，第二个渐变叠加 drawable 变为激活状态，将机器人高亮为红色。\n\
  \n最后一步，更新 `Main.axml` 文件以包含一组新的机器人。复制上一行，并粘贴新行机器人，更新这些机器人的 `background` 属性以使用 `RobotBackground_StateAware`\
  \ drawable。完成后，代码应该看起来像 代码列表 12.26，所示它描绘了最后一行行的 XML 语法。\n\n![下载](img/download.gif)\
  \ 代码 列表 12.26: 在表格视图中定义机器人背景状态\n\n```xml\n<TableRow>\n     <ImageButton android:src=\"\
  @drawable/androidrobot\" android:layout_margin=\"2dp\"\n          android:background=\"\
  @drawable/robotbackground_stateaware\" />\n     <ImageButton android:src=\"@drawable/androidrobot\"\
  \ android:layout_margin=\"2dp\"\n          android:background=\"@drawable/robotbackground_\
  \ stateaware\" />\n     <ImageButton android:src=\"@drawable/androidrobot\" android:layout_margin=\"\
  2dp\"\n          android:background=\"@drawable/robotbackground_ stateaware\" />\n\
  \     <ImageButton android:src=\"@drawable/androidrobot\" android:layout_margin=\"\
  2dp\"\n          android:background=\"@drawable/robotbackground_ stateaware\" />\n\
  </TableRow>\n```\n\n`Graphics_Drawables\\Graphics_Drawables\\Resources\\Layout\\\
  Main.axml`\n\n最后，启动应用程序并测试结果。应用程序中的最后两行应该看起来完全相同。然而，当你按下最后一行中的任何单个机器人时，它会改变颜色以匹配第二个\
  \ drawable 的设置。图 12.10 显示了如果最后一行中的第二个机器人被按下时的预期结果。\n\n图 12.10\n\n![12.10](img/c12f010.jpg)\n\
  \n# 总结\n\nAndroid 平台上的图形具有灵活性，可以完成从简单（如添加着色器和叠加层）到复杂（如创建完全动画化的 2D 交互）的任务。尽管灵活性如此，Android\
  \ 的图形故事是非常统一的。在最基础的层面，在 Android 上处理图形本质意味着处理视图、资源和原始类型。所有其他更高级的交互都建立在这一坚实的基础上，构建了一个完整的故事。\n\
  \nAndroid 图形最大的优势之一是它们能够生成类似 CSS 的功能，使用 XML 声明作为生成独立的、功能性的图形单元的方法，这些单元可以轻松地应用于整个应用程序并引用。本章探索了许多不同的概念：\n\
  \n*   你学习了何时使用 `Canvas` 对象以及何时使用 Android drawables。\n*   你学习了在利用不同资源和各种保持内存占用低水平的方法时的性能考虑因素。\n\
  *   你学习了如何在 Android 设备上制作自定义动画，并学习了在许多游戏开发场景中使用的创建更新循环的各种知识。\n*   你学习了如何在 Android\
  \ 中处理不同的线程情况，以及使用你手中每种不同工具的适当时机。\n*   你学习了如何通过 XML 语法创建自定义 drawables。\n*   你学习了如何重用\
  \ drawable 声明并创建类似 CSS 的样式以全局应用于你的应用程序。\n*   你学习了如何使用复合 drawable 类型来快速处理状态、图像叠加层和其他复杂的\
  \ drawable 交互。\n\n最后，你学习了以真实且复杂的方式开始使用 Android 图形的基础。尽管图形通常是一个宏大的主题，但通过使用本章中找到的信息，你可以开始构建你的图形教育，包含许多此处未涵盖的主题，例如\
  \ 3D 动画、动画 drawables 和维护。\n\n\n\n\n*   设备可以使用基站三角定位法计算位置信息。使用基站三角定位法通常提供大致区域的响应；然而，它的功耗非常低。\n\
  *   某些设备内部带有专用的 GPS 硬件。专用 GPS 硬件提供的精度最高；然而，它消耗的电也最多。\n*   某些服务会根据 WiFi 和已知的地理位置进行查找。\n\
  \n这意味着大部分 Android OS 设备都具有某种你可以进行程序化调用的定位服务能力。\n\n由于 Android 使用不同的技术来确定设备的位置，数据的可用性和准确性可能会有很大差异。这些数据的准确性取决于设备中采用了什么技术。具有\
  \ GPS 能力的设备在合适的条件下（通常是视野开阔的户外）可以确定非常准确的纬度/经度位置。当没有 GPS 且使用基站或无线网络信息时，数据的准确性会低得多。每个不同的数据源都提供不同级别的精度，从几英尺到几英里不等。\n\
  \n启用定位功能的 Android 应用程序在执行定位查找时有选项。应用程序会考虑所接收数据的准确性，以确保不会提供误导性信息。幸运的是，Android 提供了一个\
  \ `Criteria` 类。该类允许系统根据应用程序的需求最佳地确定要使用的定位提供者。\n\n## 基于位置的数据中断\n\n有时，Android 因为若干原因无法提供数据：\n\
  \n*   无法获取 GPS 读数，因为用户在室内或处于 GPS 信号范围之外。\n*   无法访问其他定位提供者，例如基站或 WiFi 网络信息。\n*  \
  \ 用户阻止了设备向你的应用程序提供数据。为了防止应用程序在用户不知情的情况下访问其位置，应用程序在安装时会向用户请求权限，然后再向你的应用程序发送数据。此位置偏好存储在\
  \ `AndroidManifest.xml` 文件中。\n*   用户禁用了定位服务。出于隐私或省电考虑，可以在设置中关闭定位服务。在代码中使用定位数据之前，你应该始终检查定位服务是否可用，以及是否存在任何错误状况（包括用户拒绝访问）。可以确定定位服务是否可用。如果定位服务已关闭且你的应用程序尝试访问定位数据，将显示一条消息提示用户重新开启定位管理器。\n\
  \n## 使用基于位置的服务\n\n基于位置的服务（LBS）是一个通用术语，涵盖了所有与设备位置相关的技术。Android 提供了两个主要的 LBS 组件：\n\
  \n*   位置管理器（Location Manager）在处理 LBS 时提供选项。通常，开发者针对 `Location Manager` 编程，它与设备上安装的各种提供者通信。通过\
  \ `Location Manager`，开发者可以实现以下操作：\n    *   确定设备的当前位置。\n    *   跟踪设备的移动。\n    * \
  \  与设备上的各种 `Location Providers`（定位提供者）交互。\n    *   与距离警告交互。这包括检测设备进入和离开定义的接近范围。\n\
  *   定位提供者（Location Providers）代表不同的定位技术。\n\n## 在模拟器上配置基于位置的应用程序\n\n获取设备的位置取决于设备是否提供必要的支持。遗憾的是，Android\
  \ 模拟器没有这种硬件。幸运的是，模拟器提供了在没有设备硬件的情况下测试位置应用程序的能力。模拟器允许开发者使用模拟的 `Location Providers`\
  \ 工作，并允许开发者在没有物理设备的情况下测试应用程序。\n\n`DDMS` 是 Dalvik 调试监控服务。它由 Android SDK 提供并调试服务。`DDMS`\
  \ 提供的某些服务包括设备屏幕截屏、日志信息、线程和堆信息、位置伪造和其他调试服务。在本章中，我们关注 `DDMS` 的位置数据伪造功能。位置伪造可以在模拟器控制（Emulator\
  \ Control）选项卡中找到。\n\n图 13.2 显示了 `DDMS` 中的手动（Manual）选项卡，它允许开发者使用特定的经纬度坐标对。这就是位置数据伪造。\n\
  \n图 13.2\n\n![13.2](img/c13f002.jpg)\n\n还有其他配置 `DDMS` 的方法。图 13.3 显示了使用 Keyhole 标记语言（KML）选项卡进行的配置。一旦加载了点，选择一个点即可让模拟器模拟位于该位置。此外，还可以按顺序模拟一系列位置。\n\
  \n图 13.3\n\n![13.3](img/c13f003.jpg)\n\nKML 是一种用于描述地理数据的文件格式。这些数据可以用于 Google 的许多应用程序中。在这种情况下，KML\
  \ 数据被用于 Android 模拟器。KML 是一种由 XML 定义的格式。\n\n![note](img/note.gif)要查看本章下载内容的 KML 设置文件，请查看\
  \ `kml/test.kml` 文件。章节下载内容可以在 [www.wrox.com](http://www.wrox.com) 获取。\n\n***\n\n\
  # 选择定位提供者\n\n正如本章早期提到的，Android 设备可以使用多种技术来确定设备位置。这些技术随设备而异。每种技术在功耗、精度、设备方向、高度等项目方面功能不同。\n\
  \n要获取特定提供者的实例，调用 `LocationManager` 的 `.GetProvider` 方法并传入者名称将返回一个实例：\n\n```\nString\
  \ providerName = LocationManager.GpsProvider;\nLocationProvider gpsProvider;\nString\
  \ serviceString = Context.LocationService;\nlm = (LocationManager)GetSystemService(serviceString);\n\
  gpsProvider = (lm.GetProvider(providerName));\n```\n\n这对于获取给定提供者的功能非常有用。\n\n## 确定哪些提供者可用\n\
  \n`LocationManager` 类提供了常用定位提供者的静态字符串常量 `LocationManager.GpsProvider` 和 `LocationManager.NetworkProvider`。Android\
  \ 设备可能有任何提供者。要获取设备上所有启用的提供者列表，请调用：\n\n```\nIList<string> providers = lm.GetProviders(true);\n\
  ```\n\n## 使用 Criteria 查找定位提供者\n\n提供者在不同的 Android 设备上通常不同。因此，开发者可能会硬编码某个特定的提供者。更常见的方法是使用一组传递给\
  \ Android 的标准（Criteria），然后让 Android 决定使用最佳提供者。\n\n`Criteria` 类用于请求最符合应用程序要求的提供者。可以根据以下设置标准：\n\
  \n*   位置精度\n*   所需功率\n*   高度：提供者提供高度信息吗？\n*   方位航向：提供者提供方位航向信息吗？\n*   速度：提供者提供速度信息吗？\n\
  *   成本：是否有资金成本？\n\n代码 列表 13.1 创建了一个 `Criteria` 类，设置了它的值并使用它获取位置更新。\n\n![download](img/download.gif)\
  \ 列表 13.1: 根据标准查找定位提供者\n\n\n\n\n\n```\ncr = new Criteria();\ncr.Accuracy = Accuracy.Coarse;\n\
  cr.PowerRequirement = Power.Low;\ncr.AltitudeRequired = false;\ncr.BearingRequired\
  \ = false;\ncr.SpeedRequired = false;\ncr.CostAllowed = true;\nString serviceString\
  \ = Context.LocationService;\nlm = (LocationManager)GetSystemService(serviceString);\n\
  bestProvider = lm.GetBestProvider(cr, false);\nlm.RequestLocationUpdates(bestProvider,\
  \ 5000, 500f, this);\n```\n\n你可以在 `LocationListener` 项目中找到这段代码。\n\n在这种情况下，活动（activity）必须实现\
  \ `Android.Locations.ILocationListener`。代码列表 13.2 显示了活动实现的方法：\n\n![download](img/download.gif)\
  \ 代码列表 13.2: 实现 Android 定位\n\n```\npublic void OnLocationChanged(Location location)\n\
  {\n    this.RunOnUiThread(() => tvLat.Text = location.Latitude.ToString());\n  \
  \  this.RunOnUiThread(() => {\n        tvLon.Text = location.Longitude.ToString();\n\
  \        GetAddress(location.Latitude, location.Longitude);\n    });\n}\n\npublic\
  \ void OnProviderDisabled(string provider)\n{\n}\n\npublic void OnProviderEnabled(string\
  \ provider)\n{\n}\n\npublic void OnStatusChanged(string provider, Availability status,\
  \ Bundle extras)\n{\n}\n```\n\n你可以在 `LocationListener` 项目中找到这段代码。\n\n为了获取位置信息，应用程序需要访问位置权限。这可以通过选择项目\
  \ `Required Permissions` 接口中的条目来设置，如图 13.4 所示。该图显示了设置 `AssemblyManifest.xml` 的项目属性。\n\
  \n图 13.4\n\n![13.4](img/c13f004.jpg)\n\n此外，权限问题也可以直接在 `AndroidManifest.xml` 文件中设置：\n\
  \n```\n<uses-permission android:name=\"android.permission.ACCESS_FINE_LOCATION\"\
  \ />\n<uses-permission android:name=\"android.permission.ACCESS_COARSE_LOCATION\"\
  \ />\n```\n\n![note](img/note.gif)`ACCESS_FINE_LOCATION` 权限比 `ACCESS_COARSE_LOCATION`\
  \ 权限消耗更多电池。\n\n*\n\n如果需要停止监听位置，调用 `.RemoveUpdates()` 将停止位置更新：\n\n```\nlm.RemoveUpdates(this);\n\
  ```\n\n# 地理编码\n\n本节描述了两种类型的地理编码：\n\n*   正向地理编码是从地址获取经和纬度的过程。\n*   反向地理编码是从经和纬度获取地址的过程。\n\
  \n## 正向地理编码\n\n正向地理编码（也称为地理编码）允许将街道地址翻译为经纬度地图坐标对。这些信息可以用于基于地图的活动、服务以及其他基于位置的应用程序和活动。\n\
  \n![note](img/note.gif)地理编码查找是在互联网上进行的。由于由于，应用程序必须获取权限。这是通过在项目的 `AssemblyManifest.xml`\
  \ 文件中添加 `Internet` 权限来实现的。设置如下：\n\n```\n<uses-permission android:name=\"android.permission.INTERNET\"\
  />\n```\n\n代码列表 13.3 显示了一些执行正向地理编码的示例代码。用户必须提供一个地址。在这种情况下，用户将数据输入到 `EditView`。`Geocoder`\
  \ 类执行查找并从 `GetFromLocationName` 调用返回 `Address` 对象的列表。`GetFromLocationName` 返回一个包含最大数量地址对象的列表。返回的地址对象列表包含尽可能多的信息。这些信息可能包括纬度、经度以及\
  \ `Address` 对象中可能包含的其他信息。\n\n![download](img/download.gif) 代码列表 13.3: 正向地理编码\n\n\
  ```\n// 模拟器中有一个错误导致异常。\n// 这段代码在设备上运行正常。\nvar add = Convert.ToString(et.Text);\n\
  Geocoder geocoder = new Geocoder(this, Java.Util.Locale.Default);\nIList<Android.Locations.Address>\
  \ result = geocoder.GetFromLocationName(add, 10);\nif (result != null)\n{\n    tvLat.Text\
  \ = \"Latitude: \" + result[0].Latitude.ToString();\n    tvLon.Text = \"Longitude:\
  \ \" + result[0].Longitude.ToString();\n}\n```\n\n你可以在 `GeoCode` 项目中找到这段代码。\n\n\
  如果 `GetFromLocationName` 方法返回的数据为 `null`，则根据地址未找到任何数据。\n\n![note](img/note.gif)正向地理编码是同步执行的。因为它会阻塞调用线程。为了避免干扰用户，考虑在后台线程中执行。\n\
  \n*\n\n图 13.5 显示了地理编码的输出。\n\n```\nIList<Address> al;\nGeocoder geoc = new Geocoder(this,\
  \ Java.Util.Locale.Default);\nal = geoc.GetFromLocation(Lat, Lon, 10);\nAddresstv.Text\
  \ = String.Empty;\n\nif (al != null)\n{\n    for(int i = 0; i < al.Count; i++)\n\
  \    {\n        Addresstv.Text += String.Format(\"Location #{0}\" +\n          \
  \      System.NewLine, i + 1);\n        if (!String.IsNullOrEmpty(al[i].GetAddressLine(0)))\n\
  \                    Addresstv.Text += al[i].GetAddressLine(0) +\n             \
  \       System.NewLine;\n        if (!String.IsNullOrEmpty(al[i].GetAddressLine(1)))\n\
  \                    Addresstv.Text += al[i].GetAddressLine(1) +\n             \
  \       System.NewLine;\n        if (!String.IsNullOrEmpty(al[i].Locality))\n  \
  \                  Addresstv.Text += al[i].Locality + System.NewLine;\n        if\
  \ (!String.IsNullOrEmpty(al[i].PostalCode))\n                    Addresstv.Text\
  \ += al[i].PostalCode +\n                    System.NewLine;\n    }\n}\nelse\n{\n\
  \    Addresstv.Text = \"No addresses found.\";\n}\n```\n\nLocationListener\\LocationListener\\\
  Activity1.cs\n\n返回的地址列表填充了关于该位置的尽可能多的数据。返回了多个地址，每个地址具有不同程度的精确。例如，一个地址可能包含街道、城市、州和邮政编码。另一个可能只有城市、州和邮政编码。下一个可能只有城市。这一直持续到只返回国家，如图\
  \ 13.6 所示。\n\n图 13.6\n\n![13.6](img/c13f006.jpg)\n\n## 反向地理编码\n\n反向地理编码是从经纬度获取地址的过程。为了执行此操作，程序将经纬度传递给地理编码的\
  \ `GetFromLocation` 方法。这返回一个从精确到不精确的地址列表。代码列表 13.4 阐释了这一过程：\n\n![download](img/download.gif)\
  \ 代码列表 13.4: 反向地理编码\n\n# 构建距离警报\n\n应用程序通常需要知道用户或设备何时进入指定区域或通过某个距离阈值。因此，当用户进入或离开某个位置的通用区域时，应该触发警报以通知系统。\n\
  \n要设置距离警报需要以下内容：\n\n*   中心点的经纬度\n*   该点的半径\n*   警报的时间段\n\n当设备跨越由半径定义的边界并在指定的时间范围内时，警报将触发。\n\
  \n代码列表 13.5 设置了带有半径和永久时间范围的距离警报。\n\n\n\n\n\n![download](img/download.gif) 代码列表 13.5:\
  \ 配置接近告警\n\n```c\nprivate static String MYPROXIMITY = \"com.monodroid.alert\";\n\
  protected override void OnCreate(Bundle bundle)\n{\n    base.OnCreate(bundle);\n\
  \    SetContentView(Resource.Layout.Main);\n    Button button = FindViewById<Button>(Resource.Id.MyButton);\n\
  \    button.Click += delegate { SetProximityAlert(); };\n}\n\nprivate void SetProximityAlert()\
  \ {\n\n    String locService = Context.LocationService;\n    LocationManager locationManager;\n\
  \    locationManager = (LocationManager)GetSystemService(locService);\n    double\
  \ lat = 35.89988475;\n    double lng = -84.12312175;\n    float radius = 100f; //\
  \ meters\n    long expiration = -1; // do not expire\n\n    Intent intent = new\
  \ Intent(this, typeof(RecieveProximityMessages));\n    PendingIntent proximityIntent\
  \ = PendingIntent.GetBroadcast(this, -1,\n        intent, 0);\n    locationManager.AddProximityAlert(lat,\
  \ lng, radius, expiration,\n    proximityIntent);\n    IntentFilter filter = new\
  \ IntentFilter(MYPROXIMITY);\n    RegisterReceiver(new ReceiveProximityMessages(),\
  \ filter);\n}\n```\n\n`ProximityAlerts\\ProximityAlerts\\Activity1.cs`。\n\n当位置变化触发接近告警时，消息将发送到继承自\
  \ `BroadcastReceiver` 的类。该调用随后将处理消息。在这种情况下，会向 UI 发送一个 `Toast`。还可以执行许多其他操作；代码列表 13.6\
  \ 仅仅是一个示例：\n\n![download](img/download.gif) 代码列表 13.6: 接近告警 BroadcastReceiver\n\n\
  ```c\n[BroadcastReceiver(Name = \"com.monodroid.alert\")]\npublic class ReceiveProximityMessages\
  \ : BroadcastReceiver\n{\npublic override void OnReceive(Context context, Intent\
  \ intent)\n{\n    String locService = Context.LocationService;\n    LocationManager\
  \ locationManager;\n    locationManager = (LocationManager)context.GetSystemService(locService);\n\
  \    String key = LocationManager.KeyProximityEntering;\n    Boolean entering =\
  \ intent.GetBooleanExtra(key, false);\n    ShowToast(context, entering);\n}\nvoid\
  \ ShowToast(Context context, bool entering)\n{\n    var text = \"Entering: \" +\
  \ entering.ToString();\n    Toast.MakeText(context, text, ToastLength.Short).Show();\n\
  }\n}\n```\n\n`ProximityAlerts\\ProximityAlerts\\Receiver1.cs`。\n\n# 使用 Google Maps\n\
  \n要在你的应用程序中包含 Google Maps，你需要下载适用于 Android 的 Google APIs，并创建一个目标带有 Google APIs 的\
  \ Android 系统的虚拟设备。\n\n首先，导航到你的 Android SDK 所在，进入 Tools，并运行 Android 文件。这就是你过去使用过的\
  \ Android SDK 和 AVD Manager。选择 Available Packages，并针对你想要的目标 API 级别选择 Google Inc.\
  \ 提供的 Google APIs。示例见图 13.7。\n\n图 13.7\n\n![13.7](img/c13f007.jpg)\n\n一旦完成所有安装，请使用\
  \ Google API 作为目标创建一个虚拟设备，如图 13.8 所示。一旦设置好，你将一个 Google Maps API 密钥才能在此应用程序中使用地图。你可以从\
  \ Android 开发者网站 [`code.google.com/android/maps-api-signup.html`](http://code.google.com/android/maps-api-signup.html)\
  \ 下载它。\n\n图 13.8\n\n![13.8](img/c13f008.jpg)\n\n如果没有 API 密钥，地图视图将不会下载显示地图所需的瓦片。\n\
  \n要获取密钥，你需要指定用于签名应用程序的证书的 MD5 指纹。通常，你会使用两个证书对应用程序进行签名——一个默认调试证书和一个生产证书。接下来的章节将解释如何获取用于你应用程序的每个签名证书的\
  \ MD5 指纹。\n\n## 获取你的开发/调试 MD5 指纹\n\n使用 Mono for Android，每个应用程序都将使用与该应用程序唯一的默认调试证书进行签名。要在调试时查看地图瓦片，你需要获取通过调试证书的\
  \ MD5 指纹注册的 Maps API 密钥。\n\n通常，调试密钥库存储在以下位置：\n\n* Windows Vista/7: `C:\\Users\\\
  [USERNAME]\\AppData\\Local\\Xamarin\\Android\\debug.keystore`\n* OSX: `/Users/[USERNAME]/.local/share/Xamarin/Android/debug.keystore`\n\
  \n![note](img/note.gif)该位置在你首次部署任何 Android 时创建。要找到调试证书的 MD5 指纹，使用 `keytool` 命令：\n\
  \n```\nkeytool -list -alias androiddebug -keystore debug.keystore\n```\n\n## 获取你的生产/发布\
  \ MD5 指纹\n\n在发布应用程序之前，你需要使用 MD5 指纹获取 Maps API 密钥。使用以下命令创建证书（根据需要修改）。这将要求你提供有关证书的信息。\n\
  \n```\nkeytool -genkey -v -keystore my-release.keystore -alias my-release-alias\
  \ -keyalg RSA -keysize 2048 -validity 10000\n```\n\n指定 `-list` 参数和你使用的密钥库获取 MD5\
  \ 指纹：\n\n```\nkeytool -list -alias my-release-alias -keystore my-release.keystore\n\
  ```\n\n在返回 MD5 指纹之前，会被提示输入密钥库和别名密码。有关为 Android 签名的更多信息请参见第 16 章。\n\n## 创建地图 Activity\n\
  \nAndroid 地库包含在一个名为 `Mono.Android.GoogleMaps` 的程序集中。由于 Maps 需要 Internet 和 uses-library\
  \ 标签，这些技术细节已通过以下程序集属性为你处理：\n\n```csharp\n[assembly: UsesPermission (Name = \"android.permission.INTERNET\"\
  )]\n[assembly: UsesLibrary (Name = \"com.google.android.maps\")]\n```\n\n![note](img/note.gif)此处的\
  \ Maps 包不是标准 Android 开源项目的一部分。它是 Google 在 Android SDK 中提供的，并适用于大多数 Android 设备。\n\
  \n* *\n\n现在你想创建一个使用地图的 Activity。当在 Activity 中使用地图时，该 Activity 必须使用 `MapActivity`\
  \ 作为子类。该类将负责地图位置服务的启动和停止以及 Activity 的生命周期。每个进程只能运行一个地图 Activity，因为运行多个地图进程会导致意外问题。当你用\
  \ `MapActivity` 子类 Activity 时，你需要实现 `IsRouteDisplayed` 方法。这在代码列表 13.7 中所示。\n\n```csharp\n\
  public override bool IsRouteDisplayed()\n{\n    return false;\n}\n```\n\n\n\n\n\
  ```cs\nusing Android.App;\nusing Android.GoogleMaps;\nusing Android.OS;\n\nnamespace\
  \ MapExample\n{\n   [Activity (Label = \"MapExample\", MainLauncher = true)]\n \
  \  public class Activity1 : MapActivity\n   {\n\n      MapView mapView;\n\n    \
  \  protected override void OnCreate (Bundle bundle)\n      {\n         base.OnCreate\
  \ (bundle);\n\n         // Set our view from the \"main\" layout resource\n    \
  \     SetContentView (Resource.Layout.Main);\n\n         mapView = FindViewById<MapView>(Resource.Id.mapView);\n\
  \      }\n\n      #region implemented abstract members of Android.GoogleMaps.MapActivity\n\
  \      protected override bool IsRouteDisplayed {\n         get {\n            return\
  \ false;\n         }\n      }\n      #endregion\n   }\n}\n```\n\n`MapExample\\MapExample\\\
  Activity1.java`\n\n# 在布局文件中创建地图\n\n如果你运行上述代码，你会发现地图并没有显示。这是因为，虽然我们已经告诉活动（activity）它将包含一个地图，但实际上还没有添加地图。你可以更新\
  \ `Main.axml` 布局文件以包含你想显示的 `MapView`。这在 Listing 13.8 中所示。\n\n![download](img/download.gif)\
  \ Listing 13.8: Main.axml 布局文件\n\n```xml\n<?xml version=\"1.0\" encoding=\"utf-8\"\
