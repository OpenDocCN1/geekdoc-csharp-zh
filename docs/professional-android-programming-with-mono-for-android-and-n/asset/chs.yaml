  \ 显示了将嵌入菜单加载到显示器的输出。\n\nFigure 4.20 显示了将嵌入菜单加载到显示器的输出。\n\n# 分率无关 UI\n\n最初，为 Android\
  \ 设计 UI 是简单的。所有初始设备具有相同的屏幕尺寸和密度。遗憾的是，市场是一个变幻莫测的。正如俗所说，“一码通用”并不适用于你。从 2009 年 Android\
  \ 2.0 开始，市场设备数量剧增。这些设备似乎都有略微不同的屏幕尺寸和密度。在所有想要支持的设备上创建一个外观良好的 UI 并不困难，但需要一些思考。本节将介绍\
  \ Mono for Android（以及 Android）中的一些帮助开发者编写分辨率无关 UI 的功能。这些包括支持各种资源、支持屏幕尺寸以及根据最佳实践进行工作。\n\
  \n## 支持各种资源\n\n通常，处理屏幕的资源分为两个领域：屏幕尺寸和像素密度。\n\n### 支持屏幕尺寸\n\n有三种通用的屏幕尺寸。根据设备的屏幕尺寸，应用程序提供各种布局。目前支持的屏幕尺寸如下：\n\
  \n*   超大（Extra Large）：Android 中的超大屏幕比大屏幕更大的屏幕。\n*   大（Large）：大屏幕通常比标准尺寸手机的屏幕大得多。这通常是平板电脑——或笔记本尺寸或更大的屏幕。\n\
  *   中（Medium）：中等等同于手机的典型屏幕尺寸。\n*   小（Small）：小屏幕比标准的 3.2 英寸手机屏幕小。\n\n应用程序的屏幕尺寸支持可以放在\
  \ Android 应用程序属性文件夹下的 AndroidManifest.xml 文件中。支持通过以下 XML 设置：\n\n```\n<supports-screens\
  \ android:smallScreens=\"false\" android:normalScreens=\"true\"\n android:largeScreens=\"\
  true\" android:xlargeScreens=\"true\"\n android:anyDensity=\"true\" />\n```\n\n\
  这些属性具有以下含义：\n\n*   android:smallScreens 表示应用程序是否支持宽高比比传统 HVGA 屏幕小（比“正常”小）的屏幕规格。如果应用程序不支持小屏幕尺寸，则对小屏幕设备不可用。默认情况下，此值对于\
  \ API  4 及更高版本为 true，因此在 Mono for Android 中是 true。\n\n*   android:normalScreens\
  \ 表示是否支持正常尺寸的屏幕。默认情况下，此属性为 true。\n\n\n\n\n\n*   `android:largeScreens` 表示是否支持比标准尺寸（如平板电脑或笔记本电脑）更大的屏幕。默认情况下，API\
  \ 级别 4 及更高版本的此设置为 `true`，因此对于 Mono for Android 也是 `true`。\n*   `android:xlargeScreens`\
  \ 表示是否支持超大屏幕。默认情况下，API 级别 9 以下版本的此设置为 `false`。此属性要求 API 级别为 9 或更高。\n*   `android:anyDensity`\
  \ 表示应用程序是否可以支持任何屏幕密度。API 级别 4 及更高版本的此设置默认为 `true`，因此对于 Mono for Android 也是 `true`。\n\
  \n![note](img/note.gif)`true` 和 `false` 的值与开发者预想的略有不同。`false` 值并不意味着应用程序将不会在设备上运行。这意味着\
  \ Android 将尝试应用某些缩放功能并将应用程序适配到设备。`true` 值意味着应用程序已经经过了开发者的检查，应该支持该分辨率，并且不需要设备应用任何屏幕缩放魔术。\n\
  \n### 支持像素密度\n\n像素密度是应用程序中必须考虑的另一个问题。资源存储在 `drawable` 目录中，并根据屏幕分辨率存储在多个子目录中。Android\
  \ 有以下标准像素密度：\n\n*   `ldpi`: 低密度资源为屏幕像素密度为 100 到 140 dpi 的设备设计。这些资源存储在 `Resources/drawable-ldpi`\
  \ 文件夹中。\n*   `mdpi`: 中密度资源为屏幕像素密度为 140 到 190 dpi 的设备设计。这些资源存储在 `Resources/drawable-mdpi`\
  \ 文件夹中。\n*   `hdpi`: 高密度资源为屏幕像素密度为 190 dpi 及以上的设备设计。这些资源存储在 `Resources/drawable-hdpi`\
  \ 文件夹中。\n*   `xhdpi`: 超高密度资源为屏幕像素密度为 320 dpi 的设备设计。这些资源存储在 `Resources/drawable-xhdpi`\
  \ 文件夹中。\n\n在 Visual Studio 中运行的 Mono for Android 提供 `drawable` 文件夹。其他目录可以根据需要手动创建。在\
  \ Mac 的 MonoDevelop 中运行的 Mono for Android 提供 `drawable-hdpi`、`drawable-mdpi` 和 `drawable-ldpi`\
  \ 文件夹。这些是可选目录，作为一种约定，用于根据设备能力提供备用资源。使用哪种资源是在运行时确定的。确定资源的顺序为 `ldpi`、`mdpi`、`hdpi`、`xhdpi`\
  \ 和 `nodpi`。\n\n![note](img/note.gif)有关 Android 资源支持的最新信息，请查看 Android 开发者网站上的“提供资源”部分。URL\
  \ 为 `http://developer.android.com/guide/topics/resources/providing-resources.html`。\n\
  \n![note](img/note.gif)值得注意的是，Google 进行的一项调查发现，截至 2010 年 8 月 2 日，97% 的设备像素密度为 `mdpi`\
  \ 或 `hdpi`。开发者可以安全地假设设备至少为 `mdpi` 密度。\n\n## 使用 Android Market 支持\n\n除了应用程序对各种屏幕尺寸和像素密度的支持外，Android\
  \ Market 还使用了 `<support-screens />` 属性。指定这些值的应用程序将在市场中进行过滤，使用户只会看到适配当前连接到市场的设备的应用程序。如果一个应用程序不支持小屏，那么当小屏设备搜索\
  \ Android Market 时，该应用程序将不会列出其中。\n\n## 多屏幕分辨率最佳实践\n\n以下是构建支持多种屏幕分辨率的应用程序的最佳实践：\n\
  \n*   不应使用 `AbsoluteLayout`。`AbsoluteLayout` 使用控件特定位置的概念。虽然这在初始屏幕设计中有效，但当应用程序运行在具有不同屏幕分辨率的不同设备上时，可能会导致问题。建议开发者使用\
  \ `RelativeLayout` 和 `FrameLayout` 并在子控件中设置 `layout_margin` 属性。\n*   在 UI 属性中使用\
  \ `fill_parent`、`wrap_content` 和 `dip`（密度无关像素）单位，而不是像素（pixel）大小。\n*   避免直接在代码中放置入像素值。虽然\
  \ Android 框架出于性能考虑在代码中使用像素值，但建议在必要时使用 `dip` 进行计算和转换。可以使用 `Android.Util.DisplayMetrics`\
  \ 类来获取当前运行设备所需的屏幕尺寸。\n*   使用密度和特定图像的资源。\n*   在模拟器的各种配置下测试您的应用程序，并在多台设备上进行测试。\n\n\
  # 构建用户界面：手机和平板电脑示例\n\n使用这些标准控件组合应用程序的用户界面，并让应用程序运行在多种形态上，是任何 Android 应用程序的目标。在这个示例中，用户将看到一个用户注册界面。在注册过程中为用户提供帮助。此应用中提供的帮助如下：\n\
  \n*   通过 `ScrollView` 控件开启滚动。这允许应用程序的用户界面根据需要进行滚动。（对于平板电脑或更大屏幕的设备，这不是问题。）`ScrollView`\
  \ 使得控件可以滚动。\n*   在各种输入字段中使用虚拟键盘。例如，电子邮件字段提供了针对电子邮件优化的键盘布局，而电话号码字段提供了针对数字输入优化的键盘。\n\
  *   使用 `spinner` 提供州份列表。用户不需要输入州名，而是选择 `spinner`，导航到相应的州，然后选择该州。\n*   使用 `autocomplete`\
  \ 输入用户所在的国家。\n*   使用位置服务计算用户的当前位置。根据此位置将预填充用户的城市和邮编码。一旦确定了位置，将不再使用位置服务并将其关闭。\n\n\
