  Activity1.cs` 中。\n\n[图 8.5]\n\n![8.5](img/c08f005.jpg)\n\n## WiFi States\n\n现在你已经看了\
  \ `WifiManager`，在开发带有 WiFi 的应用程序时，有一些额外的项目可能非常重要：\n\n* `.IsWifiEnabled` 是一个 `Boolean`\
  \ 属性，允许程序确定设备上是否启用了 WiFi。\n* `.SetWifiEnabled(bool)` 是一个启用/禁用设备 WiFi 的方法。\n* `.WifiState`\
  \ 是一个返回当前 WiFi 状态的属性。\n\n除了这些属性和方法，`WifiManager` 的 `.WifiState` 可以与 `Android.Net.WifiState`\
  \ 枚举进行比较，以确定设备的当前 WiFi 状态。值如下：\n\n* `.Disabled` 表示 WiFi 当前处于禁用状态。\n* `.Disabling`\
  \ 表示 WiFi 正在禁用过程中。\n* `.Enabled` 表示 WiFi 当前处于启用状态。\n\n\n\n\n\n* .启用（Enabling）意味着\
  \ WiFi 正在启用过程中。\n* .未知（Unknown）意味着无法确定 WiFi 状态。\n\n开发者可能会发现这些信息对于某些类型的应用程序有用，这些应用需要比\
  \ 3G 更带宽或更稳定的连接。\n\n## WiFi \n\n当网络连接状态发生变化时，`WifiManager` 会广播意图（intents）。您的程序可以注册这些意图，然后进行相应的更改。如果程序需要根据设备遇到的\
  \ WiFi 网络变化以及 WiFi 状态的变化来更改其通信方式，那么这些信息可能非常有价值。例如，当应用程序只想在通过 WiFi 连接或特定的 WiFi 连接时提供功能时，可以使用此功能。\n\
  \n`WifiManager` 具有以下意图：\n\n* `ActionPickWifiNetwork` 是程序可以启动的意图。\n* `NetworkIdsChangedAction`\
  \ 表示已配置网络的网络 ID 可能已经发生了变化。\n* `NetworkStateChangedAction` 在 WiFi 连接状态发生变化时触发。`ExtraNetworkInfo`\
  \ 返回一个 `NetworkInfo` 对象，详细列出当前网络状态。`ExtraBssid` 返回设备已连接的接入点的 Bssid。\n* `RssiChangedAction`\
  \ 允许程序检查 WiFi 连接不断变化的信号强度。`ExtraNewRssi` 返回一个表示当前信号强度的整数。该整数可以传递给 `WifiManager`\
  \ 静态方法 `CalculateSignalLevel`。\n* `ScanResultsAvailableAction` 表示接入点扫描已完成。\n* `SupplicantConnectionChangeAction`\
  \ 具有额外键 `ExtraSupplicantConnected` 和 `ExtraSupplicantError`。`ExtraSupplicantConnected`\
  \ 返回一个 `Boolean`，表示 supplic 者（supplicant）连接是否获取或丢失。`ExtraSupplicantError` 返回 supplic\
  \ 者错误信息。\n* `SupplicantStateChangedAction` 是一个广播意图，报告与接入点的已连接状态已发生变化。`ExtraNewState`\
  \ 返回新的 supplic 者状态。如果报告了错误，`ExtraSupplicantError` 将返回错误。\n* `WifiStateChangedAction`\
  \ 具有额外键 `ExtraWifiState` 和 `ExtraPreviousWifiState`。`ExtraWifiState` 提供有关新 WiFi\
  \ 连接的信息。`ExtraPreviousWifiState` 提供有关之前的 WiFi 连接的信息。\n\n# 蓝牙管理器\n\n蓝牙是一种无线技术标准，用于在较短距离内连接设备。蓝牙由蓝牙特殊兴趣小组（Bluetooth\
  \ Special Interest Group）管理。手机中的蓝牙通常用于将手机与耳机连接，以实现手机的无线免手使用。\n\nAndroid 在 `Android.Bluetooth`\
  \ 命名空间中支持以下类别的蓝牙：\n\n* `BluetoothAdapter`：蓝牙适配器是运行有应用程序的 Android 设备。\n* `BluetoothDevice`：蓝牙设备是\
  \ Android 设备连接的远程设备。\n* `BluetoothSocket`：蓝牙套接字是与设备通信的机制。\n* `BluetoothServerSocket`：蓝牙服务器套接字是监听来自另一设备上蓝牙套接字的传入连接请求的机制。\n\
  \n访问蓝牙硬件的第一步是获取使用蓝牙硬件的权限。这是通过 `AndroidManifest.xml` 文件中的 `BLUETOOTH` 和 `BLUETOOTH_ADMIN`\
  \ 权限获得的：\n\n```\n <uses-permission android:name=\"android.permission.BLUETOOTH\"\
  \ />\n  <uses-permission android:name=\"android.permission.BLUETOOTH_ADMIN\" />\n\
  ```\n\n下一步获取主机设备上蓝牙适配器的引用：\n\n```\nBluetoothAdapter defaultAdapter = BluetoothAdapter.DefaultAdapter;\n\
  ```\n\n## 使用蓝牙状态\n\n`BluetoothAdapter` 提供了一系列方法和属性，用于与您的 Android 设备上的蓝牙交互。这些属性和方法允许应用程序开启蓝牙并与其交互。列表\
  \ 8.8 显示了应用程序查询有关蓝牙的信息：\n\n![download](img/download.gif) 列表 8.8: 获取与蓝牙绑定的设备\n\n\
  ```\nstring Output, AdapterAddress, AdapterName, AdapterBoundDevices = String.Empty;\n\
  BluetoothAdapter defaultAdapter = BluetoothAdapter.DefaultAdapter;\nAndroid.Bluetooth.State\
  \ AdapterState;\nif (defaultAdapter.IsEnabled)\n{\n    AdapterAddress = defaultAdapter.Address;\n\
  \    AdapterName = defaultAdapter.Name;\n    var bd = defaultAdapter.BondedDevices;\n\
  \    foreach (var dev in bd)\n    {\n        if (!String.IsNullOrEmpty(AdapterBoundDevices))\n\
  \        {\n            AdapterBoundDevices += \",\";\n        }\n        AdapterBoundDevices\
  \ += dev.Name;\n    }\n    AdapterState = defaultAdapter.State;\n    Output = String.Format(\"\
  {0}:{1}:{2}:State-{3}\", \n       AdapterName, AdapterAddress,\n       AdapterBoundDevices,\
  \ AdapterState);\n    Toast.MakeText(this, Output, ToastLength.Long).Show();\n}\n\
  ```\n\n此代码包含在 `BlueToothAdapter\\BlueTooth\\Activity1.cs`\n\n在此代码示例中，执行了检查以验证蓝牙适配器是否已启用。完成后，获取了设备名称、其地址以及当前绑定设备的名称。然后将这些信息通过\
  \ toast 发送给用户。输出显示在 图 8.6。\n\n图 8.6\n\n![8.6](img/c08f006.jpg)\n\n`BluetoothAdapter`\
  \ 的 `.State` 属性有四个可能的值，它们是 `Android.Bluetooth.State` 枚举的一部分：OFF、TURNINGOFF、ON 和\
  \ TURNINGON。\n\n如果需要开启蓝牙适配器，可以通过以下方式实现：\n\n```\nStartActivityForResult(new Intent(Android.Bluetooth.BluetoothAdapter.ActionRequestEnable),\
  \ 0);\n```\n\n此行代码向用户显示如 图 8.7 所示的消息，询问用户是否想在设备上开启蓝牙适配器。\n\n图 8.7\n\n![8.7](img/c08f007.jpg)\n\
  \n图 8.8 告诉用户正在开启蓝牙适配器。\n\n![8.8](img/c08f008.jpg)![note](img/note.gif)根据设备不同，这些消息可能会略有不同。\n\
  \n***\n\n# 在应用程序中启用语音识别\n\n谁不想直接对着手机说话让手机执行操作呢？这是通过被称为语音识别的技术实现的。在语音识别中，用户的声音进入麦克风并被翻译成一组类似于波形的比特。波形可以根据不同程度的准确翻译成字母、单词和短语。\n\
  \n从 Android 1.5 开始，Android 支持语音输入。第一步是查询设备以确定其是否可以执行语音识别。此查询并不一定测试是否具有必要的硬件。相反，查询是确定是否安装了必要的活动：\n\
  \n```\n// 检查是否存在识别活动\nPackageManager pm = PackageManager;\nIList<ResolveInfo> activities\
  \ = pm.QueryIntentActivities (new Intent\n (RecognizerIntent.ActionRecognizeSpeech),\
  \ 0);\n```\n\n如果存在一个或多个活动，程序可以允许用户进行语音识别：\n\n```\nIntent intent = new Intent (RecognizerIntent.ActionRecognizeSpeech);\n\
  intent.PutExtra (RecognizerIntent.ExtraLanguageModel,\n RecognizerIntent.LanguageModelFreeForm);\n\
  intent.PutExtra (RecognizerIntent.ExtraPrompt, \"语音识别演示\");\nStartActivityForResult\
  \ (intent, VOICE_RECOGNITION_REQUEST_CODE);\n```\n\n\n\n\n\n通过这段代码，创建了一个意（intent）并启动了一个活动（activity）。随后，用户被交给语音识别活动。当语音识别活动返回代码时，数据将通过`OnActivityResult`方法返回活动（Listing\
  \ 8.9）：\n\n![download](img/download.gif) Listing 8.9: 使用语音识别\n\n```c\nprotected\
  \ override void OnActivityResult (int requestCode, Result resultCode, \nIntent data)\n\
  {\n    base.OnActivityResult (requestCode, resultCode, data);\n    if ((requestCode\
  \ == VOICE_RECOGNITION_REQUEST_CODE) &&\n(resultCode == Result.Ok))\n{\n       \
  \ // 用识别器认为它可能听到的\n        // 字符串填充列表视图\n        IList<String> matches = data.GetStringArrayListExtra\
  \ \n          (RecognizerIntent.ExtraResults);\n        voice_list.Adapter = new\
  \ ArrayAdapter<String> (this, \n          Android.Resource.Layout.SimpleListItem1,\
  \ matches);\n}\n}\n```\n\n这段代码包含在 `VoiceRecognition\\VoiceRecognition\\VoiceRecognition.cs`\
  \ 中\n\n当语音识别返回时，数组适配器将被填充语音识别小程序返回的可能短语。在本示例中，这些内容通过列表视图呈现给用户。\n\n![note](img/note.gif)第\
  \ 9 章也讨论了如何将语音识别集成到你的应用程序中。如果你使用的是自定义的 ROM 且没有语音功能，你可能需要从 Android Market 安装 Google\
  \ Voice。\n\n***\n\n# 获取逐段导航路线\n\n我确信直到此时，你已经认为 Android 操作系统拥有非常棒的功能，并且准备好开始使用它们了。那么，让我们利用本介绍的两个功能——语音识别和传感器——来生成一组逐段的驾驶指令，或者从当前点开始导航。\n\
  \n移动设备的伟大特性之一是它们实际上是可移动的。这开启了无数可能。想象一下用户正在上车。你希望手机提供一组逐段的路线，但只有当设备放置在用户汽车磁吸板上时才提供。一旦设备放置在那个磁吸板上，用户就会看到从当前位置到目的地的驾驶路线。\n\
  \n![note](img/note.gif)如果你决定尝试这样做并导致车祸或到达了错误的地点，那是你的错，不是我的错。你需要确保测试系统上的位置服务是可用且运行正常的。\n\
  \n***\n\n第一步是通过启动语音识别意图（intent）来向用户呈现语音识别输入（Listing 8.10）。\n\n![download](img/download.gif)\
  \ Listing 8.10: 打开语音识别小程序\n\n```csharp\nprivate void SetupVoice()\n{\n    // 检查是否存在识别活动\n\
  \    PackageManager pm = PackageManager;\n    IList<ResolveInfo> activities = pm.QueryIntentActivities(new\n\
  \ Intent(RecognizerIntent.ActionRecognizeSpeech), 0);\n    if (activities.Count\
  \ > 0)\n    {\n        Intent intent = new Intent(RecognizerIntent.ActionRecognizeSpeech);\n\
  \        intent.PutExtra(RecognizerIntent.ExtraLanguageModel,\n RecognizerIntent.LanguageModelFreeForm);\n\
  \        intent.PutExtra(RecognizerIntent.ExtraPrompt, \"你想去哪里？\");\n        StartActivityForResult(intent,\
  \ VOICE_RECOGNITION_REQUEST_CODE);\n    }\n}\n```\n\n这段代码包含在 `MagneticSensors\\\
  MagneticSensors\\Activity1.cs` 中\n\n这段代码打开了语音识别活动，询问用户想去哪里，如图 Figure 8.9 所示。\n\n\
  Figure 8.9\n\n![8.9](img/c08f009.jpg)\n\n在程序知道用户想去哪里之后，下一步是让程序识别设备何时连接在磁吸板上。磁场传感器可以检测到设备周围磁场的变化或增加。传感器\
  \ API 将获得这些变化（Listing 8.11）。\n\n![download](img/download.gif) Listing 8.11: 检测磁场\n\
  \n```csharp\npublic void OnSensorChanged(SensorEvent e)\n{\n    if ((e.Sensor.Type\
  \ == SensorType.MagneticField) &&\n        (lat.HasValue) && (lon.HasValue))\n \
  \   {\n        var mVals = e.Values;\n        var x = mVals[0];\n        var y =\
  \ mVals[1];\n        var z = mVals[2];\n        var SumOfSq = Math.Pow(x, 2) + Math.Pow(y,\
  \ 2) + Math.Pow(z, 2);\n        var mag = Math.Pow(SumOfSq, .5);\n        if ((mag\
  \ > Threshold) && (!String.IsNullOrEmpty(dAddr)))\n        {\n            sensManager.UnregisterListener(this,\
  \ magSensor);\n            String url = String.Format(\"http://maps.google.com/maps?saddr={0},\n\
