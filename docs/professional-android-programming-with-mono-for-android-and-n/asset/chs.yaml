  2dp\"\n          android:background=\"@drawable/robotbackground\" />\n     <ImageButton\
  \ android:src=\"@drawable/androidrobot\" android:layout_margin=\"2dp\"\n       \
  \    android:background=\"@drawable/robotbackground\" />\n     <ImageButton android:src=\"\
  @drawable/androidrobot\" android:layout_margin=\"2dp\"\n          android:background=\"\
  @drawable/robotbackground\" />\n     <ImageButton android:src=\"@drawable/androidrobot\"\
  \ android:layout_margin=\"2dp\"\n          android:background=\"@drawable/robotbackground\"\
  \ />\n</TableRow>\n```\n\n`Graphics_Drawables\\Graphics_Drawables\\Resources\\Layout\\\
