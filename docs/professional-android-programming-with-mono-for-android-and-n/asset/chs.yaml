  \n***\n\n### 使用 Windows Communication Foundation (WCF)\n\n本节探讨了基于 WCF 的 Web 服务。WCF\
  \ 随 `.NET` 3.5 发布，并演进到了 `.NET` 4.0。它是一个用于构建面向服务的应用程序的 API。\n\n#### 手动创建自己的代理\n\n\
  Visual Studio 为开发者隐藏了许多基于 SOAP 的 Web 服务的复杂性。复杂性之一就是 Web 服务代理的创建和生成。这些代理允许开发者生成并使用这些\
  \ Web 服务，就像它们是计算机上的本地库一样。以下是手动创建应用程序代理并使其运行的步骤：\n\n1. 手动生成运行时代理。Silverlight 3 版本带有一个用于生成代理的工具。该工具在安装了\
  \ Silverlight 3 版本的 Windows 系统上可用，通过 `C:\\Program Files\\Microsoft SDKs\\Silverlight\\\
  v3.0\\Tools\\SlSvcUtil.exe/noConfig http://example.com/service.svc?wsdl` 调用。结果是一个可在\
  \ Mono for Android 应用程序使用的代理。\n2. 将代理添加到项目。\n3. 添加 `System.Runtime`、`System.ServiceModel`\
  \ 引用。\n4. WCF 服务应该使用 `BasicHttpBinding` 和 `EndpointAddress`。\n\n在 Mono for Android\
  \ 中通过手动代理调用 WCF 服务的代码如代码列表 5.8 所示：\n\nListing 5.8\n\n```\nvoid btnWSDL_Click(object\
  \ sender, EventArgs e)\n{\n    try\n    {\n        WebServiceSDLClient wsClient\
  \ = new WebServiceClient(\n             new BasicHttpBinding(),\n              \
  \ new EndpointAddress(\"http://example.com/webservicSDL.svc\"));\n        wsClient.LoginCompleted\
  \ += new EventHandler<LoginCompletedEventArgs>(wsClient_LoginCompleted);\n     \
  \   wsClient.LoginAsync(\"MonoDroid\", \"blah\");\n    }\n    catch (System.Exception\
  \ sysExc)\n    {\n        tv.Text = \"Exception: \" + sysExc.Message;\n    }\n}\n\
  \nvoid wsClient_LoginCompleted(object sender, LoginCompletedEventArgs e)\n{\n  \
  \  this.RunOnUiThread(() => tv.Text = gResult + e.Result);\n}\n```\n\n注意 Listing\
  \ 5.8 中的：\n\n*   在简单的按钮点击事件上，调用了代码。\n*   创建了 `WebServiceSDL` 类。在实例化该类时，传递了 `BasicHttpBinding`，并创建了\
  \ `EndpointAddress`。\n*   由于 WCF 服务是异步的，设置了完成事件。在这种情况下，它调用了一个定义的方法；然而，它可以轻松地调用一个委托。\n\
  *   在回调中，通过传入的事件参数接收结果。\n*   最后一步是对结果进行处理。在这种情况下，代码只需将数据显示给用户。结果是调用 `InvokeOnUIThread`\
  \ 将数据放回 UI。\n\n让我们查看调用 ASMX 服务。在 Listing 5.9 中，代码调用了一个我为个人项目使用的服务的登录方法。\n\n```\n\
