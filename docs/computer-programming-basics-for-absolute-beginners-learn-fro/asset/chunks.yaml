    ### Q44. Python 的内置类型有哪些？


    答：Python 中的内置类型如下——


    - 整数 (Integers)

    - 浮点数 (Floating-point)

    - 复数 (Complex numbers)

    - 字符串 (Strings)

    - 布尔值 (Boolean)


    内置函数


    相比（嵌套）Python 列表，：


    Python 的列表是高效的通用容器。它们支持（相当）高效的插入、删除、追加和拼接，而且 Python 的列表推导式使得它们易于构建和操作。


    它们也有某些局限性：它们不支持“向量化”操作（如元素级加法和乘法），因此它们包含不同类型对象的这一不可否认的事实意味着 Python 必须为每个元素存储类型信息，并在操作每个元素时执行类型分发代码。


    NumPy 不仅更高效，而且更方便。你可以免费获得大量的向量和矩阵操作，这有时允许人们避免不必要的工作，而且它们也是被高效实现的。


    NumPy 数组更快，而且你从 NumPy 中获得了大量内置功能，如 FFT、卷积、快速搜索、基础统计、、代数、直方图等。


    ### Q46. 向 Python 数组添加值的方法是？


    答：通常使用 `append()`、`extend()` 以及 `insert(i,x)` 函数向数组添加元素。


