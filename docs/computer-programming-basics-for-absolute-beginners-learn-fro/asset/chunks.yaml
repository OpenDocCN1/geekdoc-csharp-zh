    # Multiple Choice Questions (MCQ) – Python Interview Questions


    ### Q91. Which of the subsequent statements create a dictionary? (Multiple Correct
    Answers Possible)


    a) `d = {}`

    b) `d = {“john”:40, “peter”:45}`

    c) `d = {40:”john”, 45:”peter”}`

    d) `d = (40:”john”, 45:”50”)`


    **Answer:** b, c & d.


    Dictionaries are created by specifying keys and values.


    ### Q92. Which one among these is floor division?


    a) `/`

    b) `//`

    c) `%`

    d) None of the mentioned


    **Answer:** b) `//`


    When both of the operands are integer then python chops out the fraction part
    and provides you the round off value, to urge the accurate answer use floor division.
    For ex, `5/2 = 2.5` but both of the operands are integer so answer of this expression
    in python is `2\.` to urge the two .5 because the answer, use floor division using
    `//`. So, `5//2 = 2.5`


    ### Q93. what''s the utmost possible length of an identifier?


    a) 31 characters

    b) 63 characters

    c) 79 characters

    d) None of the above


    **Answer:** d) None of the above


    Identifiers are often of any length.


    ### Q94. Why are local variable names beginning with an underscore discouraged?


    a) they''re wont to indicate a personal variables of a category

    b) they confuse the interpreter

    c) they''re wont to indicate global variables

    d) they hamper execution


    **Answer:** a) they''re wont to indicate a personal variable of a category


    As Python has no concept of personal variables, leading underscores are wont to
    indicate variables that has got to not be accessed from outside the category .


    ### Q95. Which of the subsequent is an invalid statement?


    a) `abc = 1,000,000`

    b) `a b c = 1000 2000 3000`

    c) `a,b,c = 1000, 2000, 3000`

    d) `a_b_c = 1,000,000`


    **Answer:** b) `a b c = 1000 2000 3000`


    Spaces aren''t allowed in variable names.


    ### Q96. what''s the output of the following?


    ![](OEBPS/Image00056.jpg)


    a) someError has occured

    b) someError has not occured

    c) invalid code

    d) none of the above


    **Answer:** c) invalid code


    A new exception class must inherit from a `BaseException`. there''s no such inheritance
    here.


    ### Q97. Suppose list1 is [2, 33, 222, 14, 25], what''s list1[-1] ?


    a) Error

    b) None

    c) 25

    d) 2


    **Answer:** c) 25


    The index -1 corresponds to the last index within the list.


    ### Q98. To open a file c:scores.txt for writing, we use


    a) `outfile = open(“c:scores.txt”, “r”)`

    b) `outfile = open(“c:scores.txt”, “w”)`

    c) `outfile = open(file = “c:scores.txt”, “r”)`

    d) `outfile = open(file = “c:scores.txt”, “o”)`


    **Answer:** b) the situation contains double slashes ( ) and w is employed to
    point that file is being written to.


    ### Q99. what''s the output of the following?


    ![](OEBPS/Image00057.jpg)


    a) True

    b) False

    c) None

    d) Error


    **Answer:** a) True


    The `WITH` statement when used with open file guarantees that the file object
    is closed when the `with` block exits.


    ### Q100. When will the else part of try-except-else be executed?


    a) always

    b) when an exception occurs

    c) when no exception occurs

    d) when an exception occurs into except block


    **Answer:** c) when no exception occurs


    The `else` part is executed when no exception occurs.


    I hope this set of Python Interview Questions will assist you in preparing for
    your interviews. All the best!

