    答：首先，`xrange` 和 `range` 在功能上是完全相同的。它们都提供获取整数序列的方法供你任意使用。唯一的区别是 `range` 返回的是一个
    Python `list`（列表）对象，而 `xrange` 返回的是一个 `xrange` 对象。


    这意味着 `xrange` 并不会像 `range` 那样在运行时实际生成静态列表。它通过一种名为“产出”（yielding）的特殊技术按你的需要创建值。这种系统被应用于一种称为“生成器”（generators）的对象中。这意味着如果你有一个非常巨大的
