    答：类似于 2D 绘图，3D 图形超出了 NumPy 和 SciPy 的范围，但即使在 2D 的情况下，也存在与 NumPy 集成的包。Matplotlib
    在 `mplot3d` 子包中提供了基本的 3D 绘图，而 Mayavi 利用强大的 `VTK` 引擎提供了系列高质量的 3D 可视化功能。


    # 多选题 (MCQ) – Python 面题


    ### Q91. 下述哪些语句创建字典？（可能有多个正确答案）


    a) `d = {}`

    b) `d = {“john”:40, “peter”:45}`

    c) `d = {40:”john”, 45:”peter”}`

    d) `d = (40:”john”, 45:”50”)`


    **答案：** b, c & d.


    字典通过指定键和值来创建。


    ### Q92. 以下选项中哪一个是地板除法？


    a) `/`

    b) `//`

    c) `%`

    d) 以上均不是


    **答案：** b) `//`


    当两个操作数都是整数时，Python 会舍弃小数部分并提供舍整值；为了获得精确答案，请使用地板除法。例如，`5/2 = 2.5`，但如果两个操作数都是整数，该表达式在
    Python 中的答案是 `2\.`，为了得到去掉 .5 后的结果，请使用地板除法 `//`。因此，`5//2 = 2`（注：原文此处 2.5 为笔误，应为
    2）。


    ### Q93. 标识符的最大可能长度是多少？


    a) 31 个字符

    b) 63 个字符

    c) 79 个字符

    d) 以上都不是


    **答案：** d) 以上都不是


    标识符的长度可以是任意的。


    ### Q94. 为什么不建议使用下划线开头的局部变量名？


    a) 它们通常表示类的内部变量

    b) 它们会混淆解释器

    c) 它们通常表示全局变量

    d) 它们阻碍执行


    **答案：** a) 它们通常表示类的内部变量


    由于 Python 没有私有变量的概念，前导下划线通常表示不应该从类外部访问的变量。


    ### Q95. 下述哪是无效的语句？


    a) `abc = 1,000,000`

    b) `a b c = 1000 2000 3000`

    c) `a,b,c = 1000, 2000, 3000`

    d) `a_b_c = 1,000,000`


    **答案：** b) `a b c = 1000 2000 3000`


    变量名中不允许空格。


    ### Q96. 下列代码的输出是什么？


    ![](img/Image00056.jpg)


    a) 发生了某些错误 (someError has occured)

    b) 没有发生某些错误 (someError has not occured)

    c) 代码无效 (invalid code)

    d) 以上都不是


    **答案：** c) 代码无效


    新的异常类必须继承自 `BaseException`。这里没有这种继承关系。


    ### Q97. 假设 list1 为 [2, 33, 222, 14, 25]，那么 list1[-1] 是什么？


    a) 错误

    b) None

    c) 25

    d) 2


    **答案：** c) 25


    索引 -1 对应列表中的最后一个索引。


    ### Q98. 为了打开文件 c:scores.txt 进行写入，我们使用


    a) `outfile = open(“c:scores.txt”, “r”)`

    b) `outfile = open(“c:scores.txt”, “w”)`

    c) `outfile = open(file = “c:scores.txt”, “r”)`

    d) `outfile = open(file = “c:scores.txt”, “o”)`


    **答案：** b) 该情况包含双引号，且 w 用于表示该文件正在被写入。


    ### Q99. 下列代码的输出是什么？


    ![](img/Image00057.jpg)


    a) True

    b) False

    c) None

    d) 错误


    **答案：** a) True


    `WITH` 语句配合打开文件使用时，可以保证文件对象在 `with` 块退出时被关闭。


    ### Q100. try-except-else 中的 else 部分何时执行？


    a) 总是执行

    b) 发生异常时执行

    c) 未发生异常时执行

    d) 在 except 块发生异常时执行


    **答案：** c) 未发生异常


    当没有发生异常时，执行 `else` 部分。


    希望这套 Python 面题能帮助你准备面试。祝你好运！


