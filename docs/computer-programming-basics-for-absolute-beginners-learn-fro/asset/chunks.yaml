    **Q50\. How is Multithreading achieved in Python?**


    Ans:


    Python features a multi-threading package but if you would like to multi-thread
    to hurry your code up, then it’s usually not an honest idea to use it.


    Python features a construct called the worldwide Interpreter Lock (GIL). The GIL
    makes sure that just one of your ‘threads’ can execute at anybody time. A thread
    acquires the GIL, does a touch work, then passes the GIL onto subsequent thread.


    This happens very quickly so to the human eye it''s going to appear to be your
    threads are executing in parallel, but they''re really just taking turns using
    an equivalent CPU core.


    All this GIL passing adds overhead to execution. this suggests that if you would
    like to form your code run faster then using the threading package often isn’t
    an honest idea.


