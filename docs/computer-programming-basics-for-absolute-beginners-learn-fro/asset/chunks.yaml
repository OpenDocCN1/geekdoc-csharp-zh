    **Q49\. what''s the difference between deep and shallow copy?**


    Ans: Shallow copy is employed when a replacement instance type gets created and
    it keeps the values that are copied within the new instance. Shallow copy is employed
    to repeat the reference pointers a bit like it copies the values. These references
    point to the first objects and therefore the changes made in any member of the
    category also will affect the first copy of it. Shallow copy allows faster execution
    of the program and it depends on the dimensions of the info that''s used.


    Deep copy is employed to store the values that are already copied. Deep copy doesn’t
    copy the reference tips that could the objects. It makes the regard to an object
    and therefore the new object that''s pointed by another object gets stored. The
    changes made within the original copy won’t affect the other copy that uses the
