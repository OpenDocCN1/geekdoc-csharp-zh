    支持的不同继承类型：- 单继承——派生类获取超类的成员。- 多级继承——派生类 `d1` 继承 `base1`，`d2` 继承 `base2`。- 层级继承——从一个基类继承任意数量的子类。-
    多继承——派生类继承自多个基类。### Q56. 在 Python 中如何创建类？答：使用类别关键字创建类。示例：![](img/Image0040.jpg)


    输出：`abc`


    ### Q57. 什么是 Python 中的猴子补丁（monkey patching）？


    答：在 Python 中，猴子补丁仅指运行时对类别或模块的动态修改。


    考虑下面的示例：


