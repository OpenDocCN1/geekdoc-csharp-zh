    ### Q48. Python 有面向对象（OOPs）概念吗？


    答：Python 是一种面向对象的编程语言。这意味着任何程序通常都可以通过创建对象模型来解决。然而，Python 也被视为过程化和结构化语言。


    ### Q49. 深拷贝（deep copy）和浅拷贝（shallow copy）有什么区别？


    答：当创建替换实例类型时使用浅拷贝，它保留了在新实例内复制的值。浅拷贝被用于复制引用指针，就像复制了值一样。这些引用指向第一个对象，因此类别中任何成员所作的更改也会影响它的第一个拷贝。浅拷贝允许程序更快地执行，这取决于所用信息的维度。


    深拷贝用于存储已经复制的值。深拷贝不复制可能指向对象的引用。它相对于一个对象，因此被另一个对象指向的新对象会被存储。原始拷贝中执行的更改不会影响使用该对象的另一个拷贝。由于确保为每个被调用的对象进行拷贝，深拷贝使得程序执行变慢。


    ### Q50. Python 中如何实现多线程？


    答：


    Python 多线程包，但如果你想通过多线程来加速代码，那么使用它通常不是一个好主意。


    Python 有一个名为全局解释器锁（GIL）的结构。`GIL` 确保在任何时候只有一个你的“线程”可以执行。一个线程获取 `GIL`，完成少量工作，然后将
    `GIL` 传递给后续线程。


    这种情况发生非常快，所以从人类看来，你的线程似乎在并行执行，但它们实际上只是轮流使用等效的 CPU 核心。


    所有 `GIL` 的传递增加了执行开销。这意味着如果你想让代码运行得更快，使用 `threading` 包通常不是一个好主意。


    ### Q51. Python 中编译和链接的方法是什么？


    答：编译和链接允许新扩展被正确编译且无错误，因此链接通常在通过编译过程后进行。如果使用了动态加载，则取决于提供系统的设计。Python 解释器通常不会提供配置设置文件的动态加载，并且可以重新构建解释器。


    在此过程中需要的步骤如下：


    1. 创建一个任何名称且使用系统编译器支持的任何语言的文件。例如 `file.c` 或 `file.cpp`

    2. 将此文件放入正在使用的发行版的 `Modules/` 目录中。

    3. 在 `Modules/` 目录下的 `Setup.local` 文件中添加一行。

    4. 使用 `spam file.o` 运行文件。

    5. 成功运行后，使用顶部的 `make` 命令重新构建解释器。

    6. 如果修改了文件，使用 `make`。


    ### Q52. Python 库有哪些？举几个。


    答：Python 库是一组包。主要的库有 – Numpy, Pandas, Matplotlib, Scikit-learn


