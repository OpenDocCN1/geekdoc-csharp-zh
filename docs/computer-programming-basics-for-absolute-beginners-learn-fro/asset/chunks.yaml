    ### Q77. 解释你如何在 Django 中找到数据库。


    答：你将使用命令 `edit mysite/setting.py`，这是一个传统的 Python 模块，其中模块级代表 Django 设置。


    Django 默认使用 `SQLite`；对于 Django 用户来说，这非常简单，从本质上说它不需要其他类型的安装。如果你的数据库选择不同，你只需要调整
    `DATABASE` `default` 项下的后续键值，以匹配你的数据库连接设置。


    引擎（Engines）：你将通过 `django.db.backends.sqlite3`、`django.db.backeneds.mysql`、`django.db.backends.postgresql_psycopg2`、`django.db.backends.oracle`
    等来更改数据库。


    名称（Name）：你的数据库名称。如果你使用 `SQLite` 作为数据库，那么数据库将是你电脑上的一个文件，`Name` 应该是完整的绝对路径，包括该文件的文件名。


    如果你不选择 `SQLite` 作为数据库，则必须添加 `Password`（密码）、`Host`（主机）、`User`（用户）等设置。


    Django 使用 `SQLite` 作为默认数据库，它将数据存储为文件系统中的一个。如果你有数据库服务器——`PostgreSQL`、`MySQL`、`Oracle`、`MSSQL`
    并想用它代替 `SQLite`，请使用你的数据库管理工具为你的 Django 项目创建一个数据库。无论何种方式，配合你本地（空）数据库，仍然需要告诉 Django
    如何使用它。这通常是你的项目 `settings.py` 文件发挥作用的地方。


    我们在 `setting.py` 文件中添加以下代码行：


    ![](img/Image00050.jpg)


    ### Q78. 举例说明如何在 Django 中编写视图（VIEW）？


    答：这通常是我们 Django 中编写视图的方式：


    ```python

    1. from django.http import HttpResponse

    2. import datetime

    3. ......

    4. def Current_datetime(request):

    5. now = datetime.datetime.now()

    6. html = "&amp;lt;html&amp;gt;&amp;lt;body&amp;gt;It is now %s&amp;lt;/body&amp;gt;&amp;lt;/html&amp;gt;
    now known

    7. return HttpResponse(html)

    ```


    作为 HTML 文档返回当前的日期和时间。


    ### Q79.提到 Django 模板包含的内容。


    答：模板可以是简单的文档。它可以创建任何基于文本的格式，如 `XML`、`CSV`、`HTML` 等。模板包含变量（在模板求值时会被值替换）以及控制模板逻辑的标签（`%
    tag %`）。


    图：Python 面试题 – Django 模板


    ![](img/Image00051.jpg)


    ### Q80. 解释 Django 框架中会（session）的作用？


    答：Django 提供了一种会，允许你根据网站访问者存储和检索数据。Django 抽象了发送和接收 cookie 的方法，通过在客户端放置 `session
    ID` cookie，并将所有相关数据存储在服务器端。


    ![](img/Image00052.jpg)


    图：Python 面试题 – Django 框架


    因此数据本身并不存储在客户端。这从安全角度来看通常是有益的。


    ### Q81. 列出 Django 中的继承样式。


    答：在 Django 中有三种可能的继承样式：


    - **抽象基类（Abstract Base Classes）**：当你只想父类携带你不想在每个子模型中重复的信息时，使用这种样式。

    - **多表继承（Multi-table Inheritance）**：如果你对现有模型进行子类化并希望每个模型拥有自己的数据库表，使用这种样式。

    - **代理模型（Proxy models）**：如果你只想切换模型 Python 层面的行为而不改变模型的字段，则使用这种模型。


    网络爬虫 – Python 面试题


    ### Q82. 在已知图片 URL 地址的情况下如何使用 Python 将图片保存到本地？


    答：我们将使用以下代码从 URL 地址在本地保存大量图片。


