  ![](img/Image00053.jpg)\n\n### Q83. 如何获取任何 URL 或网页的 Google 缓存年龄？\n\n答：使用以下 URL 格式：\n\
  \n`http://webcache.googleusercontent.com/search?q=cache:URLGOESHERE`\n\n请确保将 `URLGOESHERE`\
  \ 替换为你想要检索并查看缓存时间的页面或网站的正确网页地址。例如，要查看 `edureka.co` 的 Google 缓存年龄，你将使用以下 URL：\n\n\
  `http://webcache.googleusercontent.com/search?q=cache:edureka.co`\n\n### Q84. 你需要从\
  \ IMDb Top 250 页面爬取数据。只需要电影名称、年份和评分。\n\n答：我们将使用以下代码：\n\n```python\n1. from bs4 import\
  \ BeautifulSoup\n2. import requests\n3. import sys\n4. url = 'http://www.imdb.com/chart/top'\n\
  5. response = requests.get(url)\n6. soup = BeautifulSoup(response.text)\n7. tr =\
  \ soup.findChildren(\"tr\")\n8. tr = iter(tr)\n9. next(tr)\n10. for movie in tr:\n\
  11. title = movie.find('td', {'class': 'titleColumn'} ).find('a').contents[0]\n\
  12. year = movie.find('td', {'class': 'titleColumn'} ).find('span', 'secondaryInfo'}).contents[0]\n\
  13. rating = movie.find('td', {'class': 'ratingColumn'} ).find('strong').contents[0]\n\
  14. row = title + ' - ' + year + ' ' + rating\n15. print(row)\n```\n\n\n\n\n\n答：类似于\
  \ 2D 绘图，3D 图形超出了 NumPy 和 SciPy 的范围，但即使在 2D 的情况下，也存在与 NumPy 集成的包。Matplotlib 在 `mplot3d`\
  \ 子包中提供了基本的 3D 绘图，而 Mayavi 利用强大的 `VTK` 引擎提供了系列高质量的 3D 可视化功能。\n\n# 多选题 (MCQ) – Python\
  \ 面题\n\n### Q91. 下述哪些语句创建字典？（可能有多个正确答案）\n\na) `d = {}`\nb) `d = {“john”:40, “peter”:45}`\n\
  c) `d = {40:”john”, 45:”peter”}`\nd) `d = (40:”john”, 45:”50”)`\n\n**答案：** b, c\
  \ & d.\n\n字典通过指定键和值来创建。\n\n### Q92. 以下选项中哪一个是地板除法？\n\na) `/`\nb) `//`\nc) `%`\n\
  d) 以上均不是\n\n**答案：** b) `//`\n\n当两个操作数都是整数时，Python 会舍弃小数部分并提供舍整值；为了获得精确答案，请使用地板除法。例如，`5/2\
  \ = 2.5`，但如果两个操作数都是整数，该表达式在 Python 中的答案是 `2\\.`，为了得到去掉 .5 后的结果，请使用地板除法 `//`。因此，`5//2\
  \ = 2`（注：原文此处 2.5 为笔误，应为 2）。\n\n### Q93. 标识符的最大可能长度是多少？\n\na) 31 个字符\nb) 63 个字符\n\
  c) 79 个字符\nd) 以上都不是\n\n**答案：** d) 以上都不是\n\n标识符的长度可以是任意的。\n\n### Q94. 为什么不建议使用下划线开头的局部变量名？\n\
  \na) 它们通常表示类的内部变量\nb) 它们会混淆解释器\nc) 它们通常表示全局变量\nd) 它们阻碍执行\n\n**答案：** a) 它们通常表示类的内部变量\n\
  \n由于 Python 没有私有变量的概念，前导下划线通常表示不应该从类外部访问的变量。\n\n### Q95. 下述哪是无效的语句？\n\na) `abc =\
  \ 1,000,000`\nb) `a b c = 1000 2000 3000`\nc) `a,b,c = 1000, 2000, 3000`\nd) `a_b_c\
  \ = 1,000,000`\n\n**答案：** b) `a b c = 1000 2000 3000`\n\n变量名中不允许空格。\n\n### Q96.\
  \ 下列代码的输出是什么？\n\n![](img/Image00056.jpg)\n\na) 发生了某些错误 (someError has occured)\n\
