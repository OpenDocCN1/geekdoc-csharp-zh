- "# 零基础计算机编程入门指南：从基础到进阶快速上手学习 Python、Php、C++、C#、Html 和 Css、Java、Javascript 以及 SQL\n\
  \n\n\n![](img/cover1.jpeg)\n\n\n![](img/Image00000.jpg)\n\n\n# 引言\n《高级 JAVA 与 PYTHON》一书专门介绍\
  \ Java 和 Python 的面试题。Java 是由 James Gosling 于 1991 年从太阳微系统公司（Sun）创建的编程语言。Java 的目标是编写一次程序，然后在多个操作系统上运行该程序。Java\
  \ 的第一个公开发版本（Java 1.0）于 1995 年发布……现在 Oracle 拥有 Java 的主导权。Python 是一种广泛使用的通用型高级编程语言。它由\
  \ Guido van Rossum 于 1991 年创建，并由 Python 软件基金进一步开发。它的设计强调代码的可读性，其语法允许程序员用更少的代码行表达他们的概念。\n\
  \n# Java\n我们实际上汇了一份最常问的 Java 面试题及答案，这有助于帮助你应对面试官在整个面试过程中可能提出的基础 Java 面试问题。在这些基础\
  \ Java 面试问题列表中，我们涵盖了所有常问的基础及创新型 Core Java 面试题，并附有详尽的解决方案以帮助你通过职位面试。\n\n以下清单包含了 100\
  \ 道面向初学者的重要 Core Java 面试题，以及面向资深程序员的 Java 面试题和答案，帮助他们准备面试。这份全面的 Java 编程面试题指南将帮助你顺利通过面试（2021\
  \ 年）。\n\n## 100 道 Java 面试题及答案\n### 面向新手和经验丰富的 Core Java 面试题及答案\n\n### Q1. 内部类（Inner\
  \ Class）与子类（Sub-Class）有什么区别？\n答：内部类嵌套嵌套另一个类中的类。内部类具有对其嵌套类的访问权限，并且可以访问外部类定义的所有方法和变量。\n\
  \n子类是继承自一个称为父类的类。子类可以访问其父类的所有受保护和公共的方法以及区域。\n\n### Q2. Java 类有哪些不同的访问修饰符？\n答：在 Java\
  \ 中，访问修饰符是类名之前的关键字，用于定义访问范围。类的访问修饰符类型有：\n\n1. `Public`（公共）：类、方法、字段可以从任何地方访问。\n2.\
  \ `Protected`（保护）：方法、区域可以从所属的同一个类或子类、以及相同包的类中访问，但不能从外部访问。\n3. `Default`（默认）：方法、字段、类只能从同一个包中访问，不能从其原生包外部访问。\n\
  4. `Private`（私有）：方法、区域只能从所属的同一个类中访问。\n\n### Q3. 静态方法（Fixed methods）和静态变量的作用是什么？\n\
  答：当需要在类的多个对象之间共享方法或变量，而不是为每个项目创建不同的副本时，我们使用 `static` 关键字使方法或变量对所有对象共享。\n\n### Q4.\
  \ 什么是数据封装？它有什么意义？\n答：封装是面向对象中的一个概念，将数据和方法整合到一个单一系统中。\n\n封装有助于开发者遵循软件开发的模块化方法，因为每个对象都有自己的方法和变量，并提供独立于其他对象的函数。封装还提供了信息隐藏的目标。\n\
  \n### Q5. 什么是单例类（singleton class）？请提供一个合理的示例。\n`java` 中的单例类只能有一个实例，因此它的所有变量和方法都来自这一个实例。单例原则适用于需要限制类实例数量的场景。\n\
  \n由于任何类型的许可问题，单例使用的最佳示例是由于某些驱动限制，限制只能有一个连接到数据库。\n\n### Q6. Java 中的循环（Loops）是什么？三种类型的循环是什么？\n\
  答：循环用于程序中重复执行一个声明或语句块。Java 中有 3 种循环：\n\n1) `For Loops`\nFor 循环在 Java 中用于给定的次数重复执行声明。当程序员知道执行声明的次数时，就会使用\
  \ For 循环。\n\n2) `While Loops`\n当某些语句需要重复执行直到满足某个条件时，使用 while 循环。在 while 循环中，在执行语句之前会检查条件。\n\
  \n3) `Do While Loops`\nDo While 循环与 While 循环相同，区别在于在执行声明块后才检查问题。因此，在 do while 循环情况下，至少会执行一次。\n\
  \n\n\n\n利用 `Math.random()`，你可以创建大于或等于 0.1 且小于 1.0 的随机数。\n\n利用 `java.util` 中的 `Random`\
  \ 类。\n\n### Q13. 什么是默认按钮实例？请提供一个实例。\n\n答：在 `switch` 语句中，当没有其他按钮问题匹配时，会执行 `default`\
  \ 分支。一旦所有其他不同的 `switch` 实例都已经被编写代码，`Default` 实例就是一个可选备用例。它只能被声明。\n\n在下例实例中，当 `score`\
  \ 不为 1 或 2 时，会使用 `default` 分支。\n\n![](img/Image00005.jpg)\n\n### Q14. Java 中所有类派生出的基类是什么？\n\
  \n答：`java.lang.object`。\n\n### Q15. Java 中的 `main()` 方法可以返回任何数据吗？\n\n答：在 java 中，`main()`\
  \ 方法不能返回任何信息，由于这个原因，它被声明为 `void` 返回类型。\n\n### Q16. 什么是 Java 包（Packages）？包（bundles）的意义是什么？\n\
  \n答：在 Java 中，`package` 是类和接口的集合，它们由于属于不同的其他类而被打包在一起。使用包（Bundles）有助于设计人员将代码模块化，并为了适当的复用对代码分组。一旦代码被打包在\
  \ `Bundles` 中，它就可以在其他不同的类中导入并使用。\n\n### Q17. 可以在没有任何抽象方法的情况下将一个类声明为抽象（Abstract）吗？\n\
  \n答：是的，我们可以通过在类名前使用 `abstract` 关键字来开发抽象类，即使它没有任何种类的抽象方法。然而，如果一个类包含一个抽象方法，它必须被声明为抽象，否则肯定会报错。\n\
  \n### Q18. Java 中抽象类（Abstract Course）和接口（Interface）有什么区别？\n\n答：抽象类和接口之间的主要区别在于，接口可以只有\
  \ `public static` 方法声明而没有具体的实现，而抽象类可以包含具有任何访问修饰符（`public`、`private` 等）的成员，并且可以包含具体的执行代码。\n\
  \n使用抽象类和接口的另一个关键区别是，实现接口的类必须执行接口的所有方法，而继承自抽象类的类则不需要应用其父类中的所有方法。\n\n一个类可以应用多个接口，但它只能继承一个抽象类。\n\
  \n### Q19. 接口相对于抽象类的效率方面有什么影响？\n\n答：与抽象类相比，接口的效率较低，因为接口需要额外的间接层支持。开发者需要考虑的另一个重要变量是，任何类型的类只能扩展一个抽象类，而一个类可以执行许多接口。\n\
  \n使用接口还给开发者增加了额外负担，因为在类中任何时候实现接口时，程序员都被迫要求实现该接口的每一个方法。\n\n### Q20. 在 Java 中导入一个包（bundle）会同时导入它的子包吗？\n\
  \n答：在 java 中，当导入一个包时，它的子包不会被导入，如果需要，设计人员需要独立地导入它们。\n\n如果设计人员导入通配符 `college.*`，名为\
  \ `college` 的包中的所有类都会被加载，但子包中的任何类都不会被加载。要加载子包中的类（例如 `department`），设计人员必须显式地导入，如下所示：\n\
  \n### Q21. 我们可以将类中的主要方法声明为私有（personal）吗？\n\n答：在 java 中， `main` 方法需要是 `public static`\
  \ 才能正确运行任何应用程序。如果主要方法被声明为 `private`，开发者不会得到任何类的编译错误，但它不会被执行，并且肯定会产生运行时错误。\n\n###\
  \ Q22. 我们究竟如何通过引用而不是按值向特征传递参数？\n\n答：在 java 中，我们只能通过值向函数传递参数，而不能通过引用。\n\n### Q23.\
  \ 对象在 Java 中是如何被序列化（serialized）的？\n\n答：在 java 中，为了通过序列化将项直接转换为字节流，类应用了名为 `Serializable`\
  \ 的接口。所有实现 `Serializable` 接口的类对象都会被序列化，其状态也会保存在字节流中。\n\n### Q24. 我们什么时候应该使用序列化？\n\
  \n答：当数据需要通过网络发送时就会使用序列化。利用序列化，对象的状态被保存并转换为字节流。字节流通过网络传输，并在位置处重建对象。\n\n### Q25. 在\
  \ Java 中，为了处理异常，Try 块是否必须与 Catch 块配合使用？\n\n答：`Try` 块要求与 `Catch` 块或 `Finally` 块或两者都配合。从代码块抛出的任何异常都需要在\
  \ `catch` 块中被捕获，否则在代码中止之前需要完成的任何工作将放在 `Finally` 块中。\n\n### Q26. 即使异常块中发生了异常，是否存在方法可以跳过\
  \ Finally 块？\n\n答：如果 `Try` 块发生异常，控制将传递给 `catch` 块（如果存在），否则传递到 `finally`。发生异常时该块总是会被执行，避免\
  \ `Finally` 块中任何类型声明的唯一方法是通过 `try` 块末尾编写符合的代码行强制终止代码：\n\n![](img/Image00006.jpg)\n\
  \n### Q27. 类的构造器（builder）什么时候被调用？\n\n答：每当创建一个新对象时，类的构造器就会被调用。例如，当创建两个对象时，构造器被调用\
  \ 2 次。\n\n![](img/Image00007.jpg)\n\n### Q28. 类可以有多个构造器吗？\n\n答：是的，类可以具有不同参数的多个构造器。构造器的使用取决于创建项时传递的参数。\n\
  \n### Q29. 我们可以重写（override）类的静态方法吗？\n\n答：我们不能重写静态方法。静态方法属于类而不是单个对象，并且在编译时处理。即使我们尝试重写它们，也不会得到编译错误，但在运行时不会产生影响。\n\
  \n### Q30. 在下例中，结果是什么？\n\n![](img/Image00008.jpg)\n\n答：结果将是：\n\n显示类。\n\n显示父类。\n\n\
  ### Q31. String 是 Java 中的一种数据类型吗？\n\n答：`String` 不是基本数据类型。在 java 中创建字符串时，它实际上是 `Java.Lang.String`\
  \ 类的实例。创建这些字符串对象后，可以在它们上使用 `String` 类所有的集成方法。\n\n\n\n\n答：数组分组了完全相同原始类型的数据，并且在本质上是静态的；而向量是动态的，并且还可以存储不同类型的数据。\n\
  \n### Q35. 什么是多线程？\n答：多线程是一种在单个程序内以同时方式运行多个任务的概念。线程共享相同的程序堆栈并并行运行。它有助于提高任何类型程序的效率。\n\
  \n### Q36. 为什么在 Java 中使用 Runnable 接口？\n答：Java 中利用 `Runnable` 接口来执行多线程应用程序。`Java.Lang.Runnable`\
  \ 接口被类类实现以支持多线程。\n\n### Q37. Java 中执行多线程的两种方式分别是什么？\n答：可以使用以下两种技术之一在 Java 中建立多线程应用程序：\n\
  \n1. 通过利用 `Java.Lang.Runnable` 接口。类执行此接口以启用多线程。该接口中应用了一个 `run()` 方法。\n2. 通过创建一个扩展\
  \ `Java.Lang.Thread` 类的类。\n\n### Q38. 当数据需要大量更改时，应该选择哪一个？String 还是 StringBuffer？\n\
  答：考虑到 `StringBuffer` 是动态的，而且我们可以像不可变的 `String` 一样转换 `StringBuffer` 对象的值，因此当信息频繁更改时，使用\
  \ `StringBuffer` 始终是一个很好的选择。对于每一次数据转换，都会产生一个新的 `String` 对象，如果在这种情况下使用 `String`，将会产生额外的开销。\n\
  \n### Q39. 在 switch 语句的每个实例中使用 Break 的作用是什么？\n答：`break` 使用在 switch 语句的每个 case 之后（最后一个除外），以便代码在执行合法\
  \ case 后中断，并且不会流到其他 case 实例中。如果每个情况执行后都不使用 `break`，则有效实例之后的所有实例都将执行，导致错误的结果。\n\n\
  ### Q40. Java 中是如何进行垃圾回收的？\n答：在 Java 中，当一个对象不再被引用时，就会发生垃圾回收，项目会被销毁。对于自动垃圾回收，Java\
  \ 调用 `System.gc()` 方法或 `Runtime.gc()` 技术。\n\n### Q41. 我们如何在主方法之前也执行任何类型的代码？\n答：如果我们想在类的大量对象创建之前执行任何类型的声明，可以使用类中的静态固定代码块。此静态代码块中的任何语句将在类加载时（通常在项创建之前）执行一次。\n\
  \n### Q42. 一个类可以同时是父类和子类吗？请举例。\n答：如果使用了继承的结构，一个类可以同时是另一个类的父类以及另外一个类的子类。在下面列出的示例中，`continent`\
  \ 类是 `world` 类的子类，同时也是 `country` 类的父类。\n\n![](img/Image00012.jpg)\n\n### Q43. 如果类中没有指定构造函数，类对象是如何创建的？\n\
  答：即使 Java 类中没有指定显式构造函数，由于隐式使用了默认构造函数来创建对象，对象也可以成功创建。这个构造函数没有参数。\n\n### Q44. 在多线程中，具体如何确保一个资源不会被多个线程同时使用？\n\
  答：在多线程中，可以通过同步原理来控制多个线程对共享资源的访问。通过使用 `synchronized` 关键字，我们可以确保一次只有一个线程可以使用共享资源，只有当资源真正从其他使用它的线程中释放后，其他线程才能获得资源的控制权。\n\
  \n### Q45. 可以在项目创建之后再次调用类的构造器吗？\n答：当我们使用 `new` 关键字创建对象时，构造器会被立即调用。它只在对象创建时被调用，因此我们无法在对象生产后再次创建它的构造器。\n\
  \n### Q46. 有两个类名为 classA 和 classB。两个类位于同一个包中。classA 的私有成员可以被 classB 的对象访问吗？\n答：类的私有成员在该类的范围之外无法，同一个包内的任何其他类也无法访问它们。\n\
  \n### Q47. 可以在一个类中有两个同名的方法吗？\n答：我们可以在一个类中指定两个同名但参数数量/类型不同的方法。调用哪种方法完全取决于传递的参数。在下面列出的类中，我们有两个同名的\
  \ `print` 方法，但参数不同。根据参数，无疑会调用对应的一个：\n\n![](img/Image00013.jpg)\n\n### Q48. 如何为 Java\
  \ 对象创建副本？\n答：我们可以利用克隆（cloning）的概念来产生对象的副本。使用 `clone`，我们创建具有对象真实状态的副本。`clone()` 是\
  \ `Cloneable` 接口的方法，因此，为了创建对象的副本，需要实现 `Cloneable` 接口。\n\n### Q49. 使用继承的好处是什么？\n\
  答：使用继承的主要好处是代码的可重用，因为继承允许子类重用父类的代码。多态（可扩展性）是另一个巨大的优势，允许在不影响现有类的情况下引入新功能。\n\n###\
  \ Q50. 类变量和方法的默认访问修饰符是什么？\n答：变量和方法的默认访问修饰符是对同一个包内的任何其他类可见。\n\n### Q51. 提供 Java 类中使用\
  \ final 的实例。\n答：Java 中没有 final。所以我们无法在 Java 中使用该技术。\n\n### Q52. 如何限制继承以确保一个类不能被继承？\n\
  答：如果我们希望一个类不被任何类扩展，可以在类名旁使用 `final` 关键字。\n\n![](img/Image00014.jpg)\n\n### Q53.\
  \ Protected 访问修饰符的作用范围是什么？\n答：当一个变量或方法使用 `protected` 访问修饰符时，它在同类、同一个包内的任何其他类以及子类中都是的。\n\
  \n### Q54. 栈（Stack）和队列（Queue）有什么区别？\n答：栈和队列都用作信息集合的位符。栈和队列的主要区别在于栈基于后进先出（LIFO）概念，而队列基于先入后出（FIFO）原则。\n\
  \n### Q55. 在 Java 中，具体如何如何阻止变量的序列化？\n答：如果我们希望类中的特定变量不被序列化，可以在声明它们时使用 `transient`\
  \ 关键字。下面列出的变量 `trans_var` 是临时变量，且不能被序列化：\n\n![](img/Image00015.jpg)\n\n### Q56.\
  \ 我们具体如何将原始数据类型作为对象使用？\n答：原始数据类型如 `int` 可以通过包装类作为对象处理。例如，`Integer` 是原始数据类型 `int`\
  \ 的包装类。我们可以对包装类应用各种方法，就像对待其他对象一样。\n\n### Q57. 编译时会捕获哪些类型的异常？\n\n\n\n\n\n答：受检的异常可以在程序编译时捕获。已检查的异常应该通过代码中的\
  \ `try catch` 块来处理，以便有效地组合代码。\n\n### Q58. 请解释线程的各种状态。\n\n答：Java 中的线程可以处于以下状态之一：\n\
  \n就绪（Ready）：当线程被创建时，它处于全就绪状态。\n\n运行（Running）：当前正在执行的线程处于运行状态。\n\n等待（Waiting）：等待另一个线程执行以释放特定资源的线程保持在等待状态。\n\
  \n死亡（Dead）：执行完毕后变为死亡的线程处于死亡状态。\n\n### Q59. 即使定义了特定的构造函数，我们还可以使用默认构造函数吗？\n\n答：如果在\
  \ Java 类中没有定义式构造函数，Java 提供一个默认的无参构造函数。但如果定义了特定的构造函数，则无法调用默认构造函数，设计者只能利用类中定义的那些构造函数。\n\
  \n### Q60. 我们可以使用完全相同的方法名但不同的返回类型来重写方法吗？\n\n答：方法重写的根本问题是，方法名、参数列表以及返回类型必须与被重写的方法完全一致。使用不同的返回类型并不能重写方法。\n\
  \n### Q61. 下面代码段的结果是什么？\n\n![](img/Image00016.jpg)\n\n答：在此实例中，使用了后置运算符 `++`，它首先返回值然后进行加\
  \ 1。由于这个原因，它的结果将是 4。\n\n### Q61. 有人声称他在没有主方法的情况下高效地编译了一个 Java 类。这可行吗？\n\n答：主方法是\
  \ Java 程序的入口点，对于程序的实现也是必不可少的；然而，即使没有主方法，类也可以被有效地编译。尽管它无法被运行。\n\n### Q62. 可以在静态方法内部调用非静态方法吗？\n\
  \n答：非静态方法属于类的实例，并且具有对象级的作用域。为了从静态块（例如从静态主方法）调用非静态方法，需要创建一个该类的对象。然后通过使用对象引用，就可以调用这些方法。\n\
