  \ .NET Core 应用程序，这需要使用 `dotnet.exe`（Linux 和 Mac 上为 `dotnet`）进程作为应用程序的托管进程。这就是为什么使用\
  \ `dotnet run` 命令执行程序的原因。尽管如此，有一种方法可以生成包含必要的运行时文件的独立执行文件，这样无需安装 dotnet 运行时——请参见“高级主题：发布独立执行文件”。\n\
