  \ += DirectoryCountLines(subdirectory);\n      }\n      return lineCount;\n  }\n\
  \n  private static int CountLines(string file)\n  {\n      // ...\n  }\n}\n```\n\
  \n在列表 5.20 中，带有单个参数的`DirectoryCountLines()`方法声明已被移除（注释掉了），但`Main()`中的调用（指定了一个参数）仍然保留。当调用未指定`extension`参数时，将使用声明中赋值给`extension`的值（在此情况下为`*.cs`）。这允许调用代码根据需要不指定值，并消除了原本可能需要的额外重载。请注意，可选参数必须出现在所有必需参数（即没有默认值的参数）之后。此外，默认值必须是常量（编译时解析的值），这一事实相当具有限制性。例如，你不能声明如下的方法：\n\
  \n点击此处查看代码图像\n\n```\nDirectoryCountLines(\n  string directory = Environment.CurrentDirectory,\n\
  \  string extension = \"*.cs\")\n```\n\n因为`Environment.CurrentDirectory` 不是一个常量。相比之下，由于\
  \ `\"*.cs\"` 是一个常量，C# 允许将其作为可选参数的默认值。\n\n第二个方法调用功能是使用`命名参数`.^(7) 使用命名参数，调用者可以显式地识别要为其赋值的参数名称，而不是仅仅依赖参数和参数的顺序来关联它们（参见列表\
  \ 5.21）。\n\n7. 在 C# 4.0 中引入。\n\n**列表 5.21: 通过名称指定参数**\n\n点击此处查看代码图像\n\n```\n#nullable\
  \ enable\n\nusing System.IO;\n\nclass Program\n{\n  static void Main()\n  {\n  \
  \    DisplayGreeting(                                                          \
  \                                            \n          firstName: \"Inigo\", lastName:\
  \ \"Montoya\");                        \n  }\n  public static void DisplayGreeting(\n\
  \      string firstName,\n      string? middleName = null,\n      string? lastName\
  \ = null\n  )\n  {\n      // ...\n  }\n}\n```\n\n在列表 5.21 中，从`Main()`内部调用`DisplayGreeting()`时通过名称为参数赋值。在两个可选参数（`middleName`和`lastName`）中，只有`lastName`被给出参数。对于方法具有大量参数且许多参数是可选的情况（在访问\
  \ Microsoft COM 库时很常见），使用命名参数语法确实是一种便利。然而，便利性也对方法接口的灵活性产生了影响。在过去，更改参数名称而不会导致调用该方法的\
  \ C# 代码无法编译。随着命名参数的引入，参数名称变成了接口的一部分，因为更改名称将导致使用命名参数的代码无法编译。\n\n`4.0`\n\n对于许多丰富的\
  \ C# 开发者来说，这是一个令他们惊讶的限制。然而，自 .NET 1.0 以来，该限制一直作为通用语言规范（CLS）的一部分被实施的。此外，Visual Basic\
  \ 一直支持使用命名参数调用方法。因此，库开发者应该已经在遵循不更改参数名称的实践，以便在不同版本之间与其他 .NET 语言成功地互操作。本质上，命名参数现在对更改参数名称施加了许多其他\
  \ .NET 语言已经要求的相同限制。\n\n考虑到方法重载、可选参数和命名参数的结合，解析调用哪个方法变得不再显而易见。如果所有参数都有对应一个对应的参数（通过名称或位置）类型兼容，则该调用与该方法是“适用”（兼容的），除非该参数是可选的（或参数数组）。尽管这限制了可能调用的方法数量，但它并不能确定一个唯一的方法。为了进一步区分将调用哪个特定方法，编译器仅使用调用者中显式标识的参数，忽略调用者未指定的所有可选参数。因此，如果两个方法都是适用的，因为其中一个有一个可选参数，编译器将解析为没有可选参数的方法。\n\
  \n`End 4.0`\n\n### 使用异常的基础错误处理\n\n本节研究了如何通过名为`异常处理`的机制处理错误报告。通过异常处理，方法能够将错误信息传递给调用方法，而无需使用返回值或显式提供任何参数来实现。列表\
  \ 5.22 对列表 1.16——来自第 1 章的`HeyYou`程序进行了轻微修改。它不是请求用户的姓氏，而是提示用户输入年龄。\n\n**列表 5.22:\
  \ 将 `string` 转换为 int**\n\n点击此处查看代码图像\n\n\n\n\n\n```assembly\nusing System;\n\nclass\
  \ ExceptionHandling\n{\n\n  static void Main()\n  {\n      string firstName;\n \
  \     string ageText;\n      int age;\n      Console.WriteLine(\"Hey you!\");\n\
  \      Console.Write(\"Enter your first name: \");\n      firstName = System.Console.ReadLine();\n\
  \      Console.Write(\"Enter your age: \");                                    \
  \    \n      ageText = Console.ReadLine();                                     \
  \        \n      age = int.Parse(ageText);                                     \
  \            \n      Console.WriteLine(                                        \
  \                \n          $\"Hi { firstName }!  You are { age*12 } months old.\"\
  );                \n  }\n}\n```\n\n输出 5.11 显示了列表 5.22 的结果。\n\n**输出 5.11**\n\n点击此处查看代码图像\n\
  \n```\nHey you!\n\nEnter your first name: Inigo\n\nEnter your age: 42\n\nHi Inigo!\
  \  You are 504 months old.\n```\n\n`System.Console.ReadLine()` 的返回值存储在名为 `ageText`\
  \ 的变量中，然后传递给数据类型为 `int` 的方法，即 `Parse()`。此方法负责获取表示数字的字符串值并将其转换为 `int` 类型。\n\n根据转换后的字符串，最后的\
  \ `System.Console.WriteLine()` 语句将通过将年龄乘以 12 来打印以月为单位的年龄。\n\n但如果用户没有输入有效的整数字符串会怎样？例如，如果用户输入“forty-two”（十二）会发生什么？`Parse()`\
  \ 方法无法处理此类转换。它期望用户输入只包含数字的字符串。如果向 `Parse()` 方法发送了无效值，它需要某种方式向调用者报告这一事实。\n\n### 捕获错误\n\
  \n为了指示调用方法参数无效，`int.Parse()` 将**抛出一个异常**（throw an exception）。抛出异常会停止当前控制流的后续执行，并跳转到调用栈中第一个处理该异常的代码块。\n\
  \n由于你尚未提供任何此类处理，程序会将异常作为**未处理的异常**（unhandled exception）报告给用户。假设系统上没有注册调试器，该错误将出现在控制台上，并带有如输出\
  \ 5.12 所示的消息。\n\n**输出 5.12**\n\n点击此处查看代码图像\n\n```\nHey you!\n\nEnter your first\
  \ name: Inigo\n\nEnter your age: forty-two\n\nUnhandled Exception: System.FormatException:\
  \ Input string was\n\n        not in a correct format.\n\n    at System.Number.ParseInt32(String\
  \ s, NumberStyles style,\n\n        NumberFormatInfo info)\n    at ExceptionHandling.Main()\n\
  ```\n\n显然，这样的错误并没有特别帮助。要修复这个问题，必须提供一种处理错误的机制，或许是向用户报告更有意义的错误消息。\n\n这个过程被称为**捕获异常**（catching\
  \ an exception）。语法在列表 5.23 中演示，输出出现在输出 5.13 中。\n\n**列表 5.23: 捕获异常**\n\n点击此处查看代码图像\n\
  \n```assembly\nusing System;\n\nclass ExceptionHandling\n{\n\n  static int Main()\n\
  \  {\n      string firstName;\n      string ageText;\n      int age;\n      int\
  \ result = 0;\n\n      Console.Write(\"Enter your first name: \");\n      firstName\
  \ = Console.ReadLine();\n\n      Console.Write(\"Enter your age: \");\n      ageText\
  \ = Console.ReadLine();\n\n      try\n      {\n          age = int.Parse(ageText);\n\
  \          Console.WriteLine(\n              $\"Hi { firstName }! You are { age*12\
  \ } months old.\");\n      }\n      catch (FormatException )\n      {\n        \
  \  Console.WriteLine(\n              $\"The age entered, { ageText }, is not valid.\"\
  );\n          result = 1;\n      }\n      catch(Exception exception)\n      {\n\
  \          Console.WriteLine(\n              $\"Unexpected error:  { exception.Message\
  \ }\");\n          result = 1;\n      }\n      finally\n      {\n          Console.WriteLine($\"\
  Goodbye { firstName }\");\n      }\n      return result;\n  }\n}\n```\n\n**输出 5.13**\n\
  \n点击此处查看代码图像\n\n```\nEnter your first name: Inigo\n\nEnter your age: forty-two\n\
  \nThe age entered, forty-two, is not valid.\n\nGoodbye Inigo\n```\n\n首先，将可能抛出异常的代码（`age\
  \ = int.Parse()`）包围在一个**try 块**（try block）中。该块以 `try` 关键字开始。它告诉编译器，开发者已经意识到块中的代码可能会抛出异常，而且如果真的抛出了异常，其中一个**catch\
  \ 块**（catch blocks）将尝试处理该异常。\n\n必须有一个或多个 catch 块（或 finally 块）紧紧跟在 try 块之后。catch\
  \ 块的头部（参见本章稍后的高级主题：通用 Catch）可选允许你指定异常的数据类型。\n\n只要数据类型匹配异常类型，catch 块就会执行。但是，如果没有适当的\
  \ catch 块，异常将穿透并变为未处理。相应的控制流如图 5.1 所示。\n\n![异常处理的机制]\n\n图 5.1: 异常处理控制流\n\n例如，假设用户在示例中为年龄输入了“forty-two”。在这种情况下，`int.Parse()`\
  \ 将抛出一个 `FormatException` 类型的异常，控制流将跳转到 catch 块。（FormatException 表示字符串格式不正确，无法解析。）由于第一个\
  \ catch 块匹配 `Parse()` 抛出的异常类型，此块的代码将执行。如果 try 块中的语句抛出了另一个异常，第二个 catch 块将执行，因为所有异常都是\
  \ `Exception` 类型。\n\n如果没有 `FormatException` catch 块，即使 `Parse` 抛出了 `FormatException`，`Exception`\
  \ catch 块也会执行。这是因为 `FormatException` 也是 `Exception` 类型。（`FormatException` 是通用异常\
  \ `Exception` 的更具体的实现。）\n\n你处理异常的顺序是非常重要的。catch 块必须从最具体的到不具体的出现。`Exception` 数据类型是最具体的，因此最后出现。`FormatException`\
  \ 先出现，因为它是列表 5.23 中处理的最具体的异常。\n\n无论控制流正常离开 try 块还是因为 try 块中的代码抛出异常，**finally 块**（finally\
  \ block）的代码都会在离开 try 保护区域后执行。finally 块的目的是提供一个位置，无论 try/catch 块是有异常还是无异常退出都会执行。finally\
  \ 块对于清理资源非常有用，无论是否抛出了异常。事实上，可以有一个带有 finally 块但没有 catch 块的 try 块。无论 try 块是否抛出异常或编写了处理异常的\
  \ catch 块，finally 块都会执行。列表 5.24 演示了 try/finally 块，输出 5.14 显示了结果。\n\n**列表 5.24: 没有\
  \ catch 块的 finally 块**\n\n点击此处查看代码图像\n\n\n\n\n\n```\nusing System;\n\nclass ExceptionHandling\n\
  \n{\n\n  static int Main()\n  {\n      string firstName;\n      string ageText;\n\
  \      int age;\n      int result = 0;\n      Console.Write(\"Enter your first name:\
  \ \");\n      firstName = Console.ReadLine();\n      Console.Write(\"Enter your\
  \ age: \");\n      ageText = Console.ReadLine();\n      try\n      {\n         \
  \ age = int.Parse(ageText);\n          Console.WriteLine(\n              $\"Hi {\
  \ firstName }! You are { age*12 } months old.\");\n      }\n      finally\n    \
  \  {\n          Console.WriteLine($\"Goodbye { firstName }\");\n      }\n      return\
  \ result;\n  }\n}\n```\n\n#### 输出 5.14\n\n点击此处查看代码图像\n\n```\nEnter your first name:\
  \ Inigo\n\nEnter your age: forty-two\n\nUnhandled Exception: System.FormatException:\
  \ Input string was not in a\n\ncorrect format.\n   at System.Number.StringToNumber(String\
  \ str, NumberStyles options,\n\nNumberBuffer& number, NumberFormatInfo info, Boolean\
  \ parseDecimal)\n   at System.Number.ParseInt32(String s, NumberStyles style,\n\n\
  NumberFormatInfo info)\n   at ExceptionHandling.Main()\nGoodbye Inigo\n```\n\n细心的读者会注意到这里有一个有趣的现象：运行时首先报告了未处理的异常，然后运行了\
  \ `finally` 块。这种异常行为该如何解释呢？\n\n首先，这种行为是合法的，因为当异常未被处理时，运行时的行为是由实现定义的——任何行为都是合法的！运行时选择这种特定的行为，是因为它在选择运行\
  \ `finally` 块之前，就已经知道异常将未被处理；运行时已经检查了调用堆栈上所有的激活帧，并确定其中没有一个帧与抛出的异常匹配的 `catch` 块相关联。\n\
  \n一旦运行时确定异常将未被处理，它就会检查机器上是否安装了调试器，因为你可能是正在分析此故障的软件人员。如果存在调试器，它将为用户提供在 `finally`\
  \ 块运行*之前*将调试器附加到进程的机会。如果没有安装调试器，或者用户拒绝调试该问题，默认行为是将未处理的异常打印到控制台上，然后查看是否有任何可以运行的 `finally`\
  \ 块。由于这种情况的“实现定义”性质，运行时并不要求在这种情况下运行 `finally` 块；实现可以可以选择运行，也可以不运行。\n\n一个方法可能会抛出许多类型的异常。表\
  \ 5.2 列出了框架中一些较常见的异常。\n\n| 异常类型 | 描述 |\n| --- | --- |\n| `System.Exception` | 所有其他异常都派生的“基类”异常。\
  \ |\n| `System.ArgumentException` | 表示传递给方法的参数之一无效。 |\n| `System.ArgumentNullException`\
  \ | 表示特定参数为 `null` 且该值不是该参数的有效值。 |\n| `System.ApplicationException` | 应避免。最初的想法是你可能希望对系统异常使用一种处理，对应用程序异常使用另一种，尽管这看起来可行，但在现实世界中效果并不好。\
  \ |\n| `System.FormatException` | 表示字符串格式无效，无法转换。 |\n| `System.IndexOutOfRangeException`\
  \ | 表示尝试访问不存在的数组或其他集合元素。 |\n| `System.InvalidCastException` | 表示尝试从一种数据类型转换为另一种数据类型的转换无效。\
  \ | |\n| `System.InvalidOperationException` | 表示发生了意外的情况，导致应用程序不再处于有效的操作状态。 |\n\
  | `System.NotImplementedException` | 表示尽管方法签名存在，但尚未完全实现。 |\n| `System.NullReferenceException`\
  \ | 当代码尝试查找引用为 `null` 的引用所指向的对象时抛出。 |\n| `System.ArithmeticException` | 表示无效的数学运算，不包括除以零。\
  \ |\n| `System.ArrayTypeMismatchException` | 当尝试向数组存储错误类型的元素时发生。 |\n| `System.StackOverflowException`\
  \ | 表示递归深度超乎预期。 |\n\n**表 5.2: 常见异常类型**\n\n#### 列表 5.25: 通用 catch 块\n\n点击此处查看代码图像\n\
  \n```\n// 之前的 catch 子句已经捕获了所有异常\n\n#pragma warning disable CS1058\n\n...\n\ntry\n\
  {\n    age = int.Parse(ageText);\n    System.Console.WriteLine(\n        $\"Hi {\
  \ firstName }!  You are { age*12 } months old.\");\n}\n\ncatch (System.FormatException\
  \ exception)\n{\n    System.Console.WriteLine(\n        $\"输入的年龄，{ ageText }, 是无效的.\"\
  );\n    result = 1;\n}\n\ncatch(System.Exception exception)\n{\n    System.Console.WriteLine(\n\
  \        $\"意外错误:  { exception.Message }\");\n    result = 1;\n}\n\ncatch\n{\n \
  \   System.Console.WriteLine(\"意外错误!\");\n    result = 1;\n}\n\nfinally\n{\n   \
  \ System.Console.WriteLine($\"Goodbye { firstName }\");\n}\n\n...\n```\n\n没有数据类型的\
  \ `catch` 块（称为通用 catch 块）等同于指定一个接收 `object` 的 `catch` 块。由于这个原因，会触发警告，提示 `catch`\
  \ 块已存在；通用 catch 块很少使用，因为没有方法捕获异常的信息。C# 不支持抛出类型异常的能力。\n\n#### 使用 `throw` 语句报告错误\n\
  \nC# 允许开发人员从代码中抛出异常，如列表 5.26](#ch05.xhtml_ch05ex26) 和输出 5.15](#ch05.xhtml_ch0515)\
  \ 所示。\n\n**列表 5.26: 抛出异常**\n\n点击此处查看代码图像\n\n```\n// 之前的 catch 子句已经捕获了所有异常\n\nusing\
  \ System;\n\npublic class ThrowingExceptions\n\n{\n  public static void Main()\n\
  \  {\n      try\n      {\n          Console.WriteLine(\"开始执行\");\n          Console.WriteLine(\"\
  抛出异常\");\n              throw new Exception(\"任意异常\");                         \
  \ \n          Console.WriteLine(\"执行结束\");\n      }\n\n      catch(FormatException\
  \ exception)\n      {\n         Console.WriteLine(\"抛出了 FormatException\");\n  \
  \    }\n\n      catch(Exception exception)\n      {\n        Console.WriteLine(\n\
  \            $\"意外错误: { exception.Message }\");\n      }\n\n      catch\n      {\n\
  \           Console.WriteLine(\"意外错误!\");\n      }\n\n      Console.WriteLine(\n\
  \          \"正在关闭...\");\n  }\n}\n```\n\n**输出 5.15**\n\n点击此处查看代码图像\n\n```\n开始执行\n\
  \n抛出异常...\n\n意外错误:  任意异常\n\n正在关闭...\n```\n\n如列表 5.26](#ch05.xhtml_ch05ex26) 中的箭头所示，抛出异常会导致执行从抛出异常的地方跳转到堆栈中与抛出异常类型兼容的第一个\
  \ `catch` 块。(9) 在这种情况下，第二个 `catch` 块处理了异常并输出错误消息。在列表 5.26](#ch05.xhtml_ch05ex26)\
  \ 中，没有 `finally` 块，因此执行将继续到 `try/catch` 块之后的 `System.Console.WriteLine()` 语句。\n\n\
  ⁹. 技术上讲，它也可以被兼容的 catch 过滤器捕获。\n\n\n\n\n\n要抛出异常，需要一个异常的实例。列表 5.26 使用关键字 `new` 后后跟异常类型来创建一个实例。大多数异常类型都允许在抛出异常时生成消息，这样当异常发生时，就可以检索到该消息。\n\
  \n有时，`catch` 块会捕获异常，但无法对其进行恰当或完全的处理。在这种情况下，`catch` 块可以使用 `throw` 语句重新抛出该异常，而无需指定任何特定的异常对象，如\
  \ 列表 5.27 所示。\n\n**列表 5.27：重新抛出异常**\n\n点击此处查看代码图像\n\n```\n...\n\n      catch(Exception\
  \ exception)\n\n      {\n\n          Console.WriteLine(\n              $@\"Rethrowing\
  \ unexpected error:  {\n                  exception.Message }\");\n\n          throw;\n\
  \n      }\n\n...\n```\n\n在 列表 5.27 中，`throw` 语句是“空”的，而不是指定抛出由 `exception` 变量引用的异常。这说明了一个微妙的区别：`throw;`\
  \ 保留了异常中的*调用栈*信息，而 `throw exception;` 则会用该信息替换为当前的调用栈信息。出于调试目的，通常知道原始调用栈会更好。\n\n\
  ### 避免使用异常处理处理预期情况\n\n开发者应该避免为预期的条件或正常的控制流抛出异常。例如，开发者不应期望用户在指定年龄时输入有效的文本。^(10) 因此，开发者不应该依赖异常来验证用户输入的数据，而应该在尝试转换之前提供一种检查数据的方法。（更好的做法是，从源上防止用户输入无效数据。）异常专门设计用于跟踪异常、意外和可能致命的情况。将它们用于预期情况等非预期用途，将导致你的代码变得难以阅读、理解和维护。\n\
  \n10. 一般来说，开发者应该预料用户会执行意外的操作；反之，他们应该编写防御性代码来处理“愚蠢用户的花招”。\n\n`开始 2.0`\n\n考虑例如，我们在\
  \ 第 2 章 中用于将字符串转换为整数的 `int.Parse()` 方法。在这种情况下，代码转换了用户输入，而输入并不总是数字。`Parse()` 方法的一个问题是，确定转换是否成功的唯一方法是尝试强制转换，如果不起通则捕获异常。由于抛出异常是一项相对昂贵的操作，最好在不使用异常处理的情况下尝试转换。为了这一目标，最好是使用\
  \ `TryParse()` 方法之一，例如 `int.TryParse()`。它要求使用 `out` 关键字，因为 `TryParse()` 函数的返回值是一个\
  \ `bool` 而不是转换后的值。列表 5.28 是一段演示如何使用 `int.TryParse()` 进行转换的代码片段。\n\n**列表 5.28：使用\
  \ `int.TryParse()` 进行转换**\n\n点击此处查看代码图像\n\n```\nif (int.TryParse(ageText, out int\
  \ age))\n{\n    Console.WriteLine(\n        $\"Hi { firstName }!  \"\n        +\
  \ $\"You are { age*12 } months old.\");\n}\n\nelse\n{\n    Console.WriteLine(\n\
  \        $\"The age entered, { ageText }, is not valid.\");\n}\n```\n\n`结束 2.0`\n\
  \n使用 `TryParse()` 方法，不再需要为了处理字符串到数字的转换而包含 try/catch 块。\n\n在预期场景中避免异常的另一个因素是性能。与大多数语言一样，C#\
  \ 在抛出异常时会有轻微的性能损失——与大多数操作所需的纳秒相比，需要微秒。这种延迟在人类时间内通常是察觉的——除非异常未被处理。例如，当执行 列表 5.22\
  \ 且用户输入无效年龄时，异常未被处理，运行时搜索环境以查看是否有调试器加载时会有明显的延迟。幸运的是，程序在关闭时的性能缓慢通常不是需要考虑的因素。\n\n\
  ### 总结\n\n本章讨论了声明和调用方法的细节，包括使用 `out` 和 `ref` 关键字传递和返回变量而不是其值。除了方法声明外，本章引入了异常处理。\n\
  \n方法是编写可读性代码的关键基本结构。与其编写包含大量语句的大方法，不如你应该使用方法在代码中创建大约 10 条或更少语句的“段落”。将大函数拆分为较小部分的过程是重构代码以使其更具可读性和维护性的方法之一。\n\
  \n下一章将考虑类结构，并描述了类如何将方法（行为）和字段（数据）封装到单个单元中。\n\n## 6. 类\n\n你在 第 1 章 中简要地看了如何声明一个新类。在\
  \ 第 2 章 和 第 3 章 中，你学习了 C# 内置类型。既然你已经学习了控制流和如何声明方法，是时候讨论定义自己的类型了。类型定义是任何 C# 程序的内核结构；对类以及从类创建的对象的支持使得\
  \ C# 成为一种面向对象的语言。\n\n![显示了 C# 中类的基本方面。](img/06mindmap.jpg)\n\n本章介绍了使用 C# 进行面向对象编程的基础。一个重点是如何定义类，类是对象本身的模板。\n\
  \n在前几章中结构化、基于控制流的编程的所有结构仍然适用于面向对象编程。然而，通过将这些结构封装在类中，你可以创建更大、更有组织性的程序，显著提高维护性。\n\n\
  面向对象编程的优势之一是，你不需要完全从头创建新程序，而是从之前的工作组合现有对象的集合，用新功能扩展类，添加更多类，并提供新功能。\n\n不熟悉面向对象编程的读者应该阅读“初学者主题”块以获取介绍。学者主题之外的正文重点关注使用\
  \ C# 进行面向对象编程，假设读者已经熟悉面向对象的概念。\n\n本章深入探讨 C# 如何通过类、属性和访问修饰符等结构支持封装；我们在 第 5 章涵盖了方法。第\
  \ 7 章 通过引入继承和面向对象编程允许的多态性在此基础上进一步构建。\n\n## 声明和实例化类\n\n定义类首先需要指定关键字 `class`，后跟一个标识符，如\
  \ 列表 6.1 所示。\n\n**列表 6.1：定义类**\n\n点击此处查看代码图像\n\n```\npublic class Employee\n{\n\n\
  }\n```\n\n所有属于类的代码将出现在类声明后的括号之间。虽然不是要求的，但通常你将每个类放在单独的文件中。这有助于找到特定类的代码，因为惯例使用类名命名文件。\n\
  \n\n\n\n\n一旦你定义了一个新类，就可以像使用框架内置类一样来使用该类。换句话说，你可以声明该类型的变量，或者定义一个接收新类类型参数的方法。列表 6.2\
  \ 演示了此类声明。\n\n#### 列表 6.2：声明类类型的变量\n\n点击此处查看代码图像\n\n```c\nclass Program\n\n{\n \
  \ static void Main()\n  {\n      Employee employee1, employee2;\n      // ...\n\
  \  }\n  static void IncreaseSalary(Employee employee)\n  {\n      // ...\n  }\n\
  }\n```\n\n现在你已经定义了一个新类类型，是时候实例化该类型的对象了。效仿其先前的用法，C# 使用 `new` 关键字来实例化对象（参见列表 6.3）。\n\
  \n#### 列表 6.3：实例化类\n\n点击此处查看代码图像\n\n```csharp\nclass Program\n\n{\n  static void\
  \ Main()\n  {\n      Employee employee1 = new Employee();                      \
  \                 \n      Employee employee2;\n      employee2 = new Employee();\
  \                                                \n      IncreaseSalary(employee1);\n\
  \      IncreaseSalary(employee2);\n  }\n}\n```\n\n并不意外的是，赋值可以在声明的同一语句中进行，也可以在单独的语句中进行。\n\
  \n与你目前为止接触过的原始类型不同，没有字面量方式来指定 `Employee`。相反，`new` 运算符向运行时提供一条指令，为 `Employee` 对象分配内存、初始化对象并返回该实例的引用。\n\
  \n虽然存在用于分配内存的显式运算符，但并没有用于释放内存的同类运算符。相反，运行时会在对象变得不可访问一段时间后自动回收内存。`垃圾回收器`（garbage\
  \ collector）负责自动释放内存。它确定哪些对象不再被其他活动对象引用，然后释放这些对象的内存。因此，不存在一个编译时确定的程序位置可以收集内存并将其恢复到系统。\n\
  \n在这个简单浅显的示例中，`Employee` 没有关联任何显式数据或方法，这使得该对象本质上毫无用处。下一节将重点讨论向对象添加数据。\n\n### 实例字段（Instance\
  \ Fields）\n\n面向对象设计的关键方面之一是对数据进行分组以提供结构。本节讨论如何向 `Employee` 类添加数据。类内部存储数据的变量的通用面向对象术语是`成员变量`member\
  \ variable。这个术语在 C# 中很容易理解，但更标准的术语——规范中使用的术语是`字段`field，它是与包含类型关联的命名存储单元。`实例字段`（Instance\
  \ fields）是在类级别声明的变量，用于存储与对象相关的数据。因此，`关联`（association）是字段类型与包含字段之间的关系。\n\n### 声明实例字段\n\
  \n在列表 6.4 中，`Employee` 类已修改为包含三个字段：`FirstName`、`LastName` 和 `Salary`（为了说明，此列表以及示例中的其他相关列表均未标记为\
  \ C# 8.0，尽管 `Salary` 被声明为 C# 8.0 可空引用类型）。\n\n#### 列表 6.4：声明字段\n\n点击此处查看代码图像\n\n\
  ```csharp\npublic class Employee\n{\n  public string FirstName;\n  public string\
  \ LastName;\n  public string? Salary;\n}\n```\n\n添加这些字段后，就可以为每个 `Employee` 实例存储一些基础数据。在这种情况下，我们在字段前加上了\
  \ `public` 修饰符。在字段上使用 `public` 表示字段内的数据可以从 `Employee` 类的类访问（参见本章后面的“访问修饰符”章节）。\n\
  \n与局部变量声明一样，字段声明包含了字段所引的数据类型。此外，可以在声明时为字段分配初始值，如列表 6.5 中的 `Salary` 字段所示。\n\n####\
  \ 列表 6.5：在声明时设置字段的初始值\n\n点击此处查看代码图像\n\n```csharp\n// 代码不完整时禁用非可空字段未初始警告\n#pragma\
  \ warning disable CS8618\npublic class Employee\n{\n  public string FirstName;\n\
  \  public string LastName;\n  public string? Salary = \"Not enough\";          \
  \                    \n}\n```\n\n我们将字段的命名和编码指南推到本章的晚些时候，即在介绍 C# 属性和构造函数之后。只需说明，在此之前，列表经常不遵循标准的编码准则。事实上，存在大量的以下警告：\n\
  \n*   “CS0649: 字段从未被赋值，将始终具有其默认值 null。”\n*   “CS8618: 非可空字段未初始化。考虑将其声明为可空。”\n\n\
  在这种情况下，由于 `FirstName` 和 `LastName` 未初始化，它们触发了 CS8618 警告。\n\n为了说明，这些警告被忽略了，并且实际上在附带的源代码中通过\
  \ `#pragma` 指令被禁用了。\n\n### 访问实例字段\n\n你可以设置并检索字段中的数据。然而，字段不包含 `static` 修饰符这一事实表明它是一个实例字段。你只能通过包含类的实例（对象）访问实例字段。你不能直接从类访问它（除非先创建实例）。\n\
  \n列表 6.6 展示了 `Program` 类及其对 `Employee` 类使用的更新视图，输出 6.1 显示了结果。\n\n#### 列表 6.6：访问字段\n\
  \n点击此处查看代码图像\n\n```csharp\nclass Program\n{\n  static void Main()\n  {\n      Employee\
  \ employee1 = new Employee();\n      Employee employee2;\n      employee2 = new\
  \ Employee();\n      employee1.FirstName = \"Inigo\";\n      employee1.LastName\
  \ = \"Montoya\";\n      employee1.Salary = \"Too Little\";\n      IncreaseSalary(employee1);\n\
  \      Console.WriteLine(\n          \"{0} {1}: {2}\",\n          employee1.FirstName,\n\
  \          employee1.LastName,\n          employee1.Salary);\n      // ...\n  }\n\
  \  static void IncreaseSalary(Employee employee)\n  {\n      employee.Salary = \"\
  Enough to survive on\";\n  }\n}\n```\n\n#### 输出 6.1\n\n点击此处查看代码图像\n\n```\nInigo\
  \ Montoya: Enough to survive on\n```\n\n列表 6.6 实例化两个 `Employee` 对象，正如你之前看到的。然后它设置了每个字段，调用\
  \ `IncreaseSalary()` 更改工资，并显示与 `employee1` 引用的对象相关的每个字段。\n\n注意，你必须先指定正在处理的 `Employee`\
  \ 实例。因此，在赋值和访问字段时，`employee1` 变量作为字段名的前缀出现。\n\n\n\n\n\n在 `Main()` 方法的 `WriteLine()`\
  \ 调用中对名称进行格式化的另一种方法，是在 `Employee` 类中提供一个方法来处理格式化。将此功能放在 `Employee` 类内部而不是 `Program`\
  \ 的成员中，符合类的封装原则。为什么不将与员工全名相关的方法与包含构成该名称数据的类放在一起呢？代码列表 6.7 展示了此类方法的创建。\n\n**代码列表\
  \ 6.7：从包含的类内部访问字段**\n\n点击此处查看代码图像\n\n```csharp\npublic class Employee\n{\n  public\
  \ string FirstName;\n  public string LastName;\n  public string? Salary;\n\n  public\
  \ string GetName()                                           \n  {             \
  \                                                    \n      return $\"{ FirstName\
  \ }   { LastName }\";                       \n  }                              \
  \                                   \n}\n```\n\n这个方法与你在第 5 章中学习到的内容相比，并没有什么特别之处，只是现在\
  \ `GetName()` 方法访问的是对象上的字段，而不仅仅是局部变量。此外，该方法的声明没有标记为 `static`。正如你在本章后面的部分将看到的，静态方法无法直接访问类中的实例字段。相反，必须获取类的实例才能调用任何实例成员（无论是方法还是字段）。\n\
  \n由于添加了 `GetName()` 方法，你可以更新 `Program.Main()` 来使用该方法，如代码列表 6.8 和输出 6.2 所示。\n\n**代码列表\
  \ 6.8：从包含的类外部访问字段**\n\n点击此处查看代码图像\n\n```csharp\nclass Program\n{\n  static void\
  \ Main()\n  {\n      Employee employee1 = new Employee();\n      Employee employee2;\n\
  \      employee2 = new Employee();\n      employee1.FirstName = \"Inigo\";\n   \
  \   employee1.LastName = \"Montoya\";\n      employee1.Salary = \"Too Little\";\n\
  \      IncreaseSalary(employee1);\n      Console.WriteLine(                    \
  \                            \n          $\"{ employee1.GetName() }: { employee1.Salary\
  \ }\");            \n      // ...\n  }\n  // ...\n}\n```\n\n**输出 6.2**\n\n点击此处查看代码图像\n\
  \n```\nInigo Montoya: Enough to survive on\n```\n\n### 使用 `this` 关键字\n\n你可以从属于该类的实例成员内部获取该类的引用。在\
  \ C# 中，为了显式指示所访问的字段或方法是包含类的实例成员，你可以使用 `this` 关键字。在调用任何实例成员时，`this` 的使用是隐式的，它返回对象本身的实例。\n\
  \n例如，考虑代码列表 6.9 所示的 `SetName()` 方法。\n\n**代码列表 6.9：使用 `this` 显式识别字段的所有者**\n\n点击此处查看代码图像\n\
  \n```csharp\npublic class Employee\n{\n  public string FirstName;\n  public string\
  \ LastName;\n  public string? Salary;\n\n  public string GetName()\n  {\n      return\
  \ $\"{ FirstName }  { LastName }\";\n  }\n  public void SetName(               \
  \                                \n      string newFirstName, string newLastName)\
  \                        \n  {                                                 \
  \                 \n      this.FirstName = newFirstName;                       \
  \          \n      this.LastName = newLastName;                                \
  \   \n  }                                                                  \n}\n\
  ```\n\n此示例使用 `this` 关键字来指示字段 `FirstName` 和 `LastName` 是类的实例成员。\n\n尽管 `this` 关键字可以作为任何及所有局部类成员引用的前缀，但通用的指南是在没有额外价值时不要让代码杂乱。因此，你应该避免使用\
  \ `this` 关键字，除非它是必需的。代码列表 6.12（在本章后后）是少数存在此类要求之一的示例。然而，代码列表 6.9 和 6.10 并不是好的例子。在代码列表\
  \ 6.9 中，完全可以省略 `this` 而不改变代码含义。而在代码列表 6.10（接下来介绍）中，通过更改字段的命名约定并遵循参数的命名约定，我们可以避免局部变量和字段之间的任何歧。\n\
  \n在代码列表 6.9 和 6.10 中，`GetName()` 方法没有使用 `this` 关键字——它是可选的。但是，如果局部变量或参数与字段具有相同的名称（参见代码列表\
  \ 6.10 中的 `SetName()` 方法），省略 `this` 将导致访问局部变量/参数。\n\n你也使用 `this` 关键字来访问类的方法。例如，在\
  \ `SetName()` 方法中使用 `this.GetName()` 是允许的，允许你打印出新赋值的名称（参见代码列表 6.11).\n\n**代码列表 6.11：在方法中使用\
  \ `this`**\n\n点击此处查看代码图像\n\n```csharp\npublic class Employee\n{\n  // ...\n  public\
  \ string GetName()\n  {\n      return $\"{ FirstName }  { LastName }\";\n  }\n \
  \ public void SetName(string newFirstName, string newLastName)\n  {\n      this.FirstName\
  \ = newFirstName;\n      this.LastName = newLastName;\n      Console.WriteLine(\
  \                                                    \n          $\"Name changed\
  \ to '{ this.GetName() }'\");                         \n  }\n}\n```\n\n```csharp\n\
  class Program\n{\n  static void Main()\n  {\n      Employee employee = new Employee();\n\
  \      employee.SetName(\"Inigo\", \"Montoya\");\n  }\n}\n```\n\n**输出 6.3**\n\n\
  点击此处查看代码图像\n\n```\nName changed to 'Inigo Montoya'\n```\n\n有时需要使用 `this` 来传递当前执行对象的引用。考虑代码列表\
  \ 6.12 中的 `Save()` 方法。\n\n**代码列表 6.12：在方法调用中传递 `this`**\n\n点击此处查看代码图像\n\n```csharp\n\
  public class Employee\n{\n  public string FirstName;\n  public string LastName;\n\
  \  public string? Salary;\n\n  public void Save()\n  {\n      DataStorage.Store(this);\
  \                                          \n  }\n}\n```\n\n```csharp\nclass DataStorage\n\
  {\n  // 将员工对象保存到文件\n  // 以员工名称命名\n  public static void Store(Employee employee)\n\
  \  {\n      // ...\n  }\n}\n```\n\n代码列表 6.12 中的 `Save()` 方法调用了 `DataStorage` 类的一个名为\
  \ `Store()` 方法。然而，`Store()` 方法需要传递需要持久化的 `Employee` 对象。这是通过使用 `this` 关键字实现的，它传递了调用\
  \ `Save()` 的 `Employee` 实例。\n\n#### 使用文件进行存储和加载\n\n\n\n\n\n`DataStorage` 中 `Store()`\
  \ 方法的实际实现涉及 `System.IO` 命名空间中的类，如列表 6.13 所示。在 `Store()` 内部，你首先实例化 `FileStream` 对象，并将其与员工全名对应的文件关联。`FileMode.Create`\
  \ 参数表示，如果不存在名为 `<firstname><lastname>.dat` 的文件，则将创建一个新文件；如果文件已存在，则它将被覆盖。接下来，你创建一个\
  \ `StreamWriter` 类，它负责向 `FileStream` 写入文本。你使用 `WriteLine()` 方法写入数据，就像向控制台写入数据一样。\n\
  \n### 列表 6.13：将数据持久化到文件\n\n点击此处查看代码图像\n\n```c\nusing System;\n\n// IO 命名空间\n\nusing\
  \ System.IO;\n\nclass DataStorage\n{\n  // 将员工对象保存到文件中\n  // 文件名为员工姓名命名。\n  // 未显示错误处理。\n\
  \  public static void Store(Employee employee)\n  {\n      // 使用 FirstNameLastName.dat\
  \ 作为文件名\n      // 实例化 FileStream。FileMode.Create 将强制\n      // 创建新文件或覆盖\n      //\
  \ 现有文件。\n      FileStream stream = new FileStream(\n          employee.FirstName\
  \ + employee.LastName + \".dat\",\n          FileMode.Create);1\n\n      // 创建一个\
  \ StreamWriter 对象用于向      // FileStream 写入文本\n      StreamWriter writer = new StreamWriter(stream);\n\
  \      // 写入与员工相关的所有数据\n      writer.WriteLine(employee.FirstName);\n      writer.WriteLine(employee.LastName);\n\
  \      writer.WriteLine(employee.Salary);\n      // 关闭 StreamWriter 及其流\n      writer.Dispose();//自动关闭流\n\
  \  }\n  // ...\n}\n```\n\n1. 这段代码可以使用 `using` 语句进行改进——这是一种我们一直避免使用的结构，因为它尚未被引入。\n\
  \n一旦完成写入操作，都需要关闭 `FileStream` 和 `StreamWriter`，以免它们在等待垃圾回收器运行期间一直保持打开状态。列表 6.13\
