  \ == 0);\n\n        return input;\n\n    };\n```\n\n#### 表达式 Lambda (Expression\
  \ Lambdas)\n\n语句表达式的语法已经比方法声明简洁得多了；正如我们所看到的，它不需要声明方法名、可访问性、返回类型或参数类型。然而，通过使用表达式\
  \ Lambda，我们可以变得更加简洁。此类 Lambda 的唯一信息是它返回的表达式。表达式 Lambda 完全不包含语句块。在列表 13.12、13.13\
  \ 和 13.14 中，我们看到的语句表达式由单个语句组成。如果我们消除周围的繁琐操作会怎样？列表 13.16 与列表 13.12 相同，只是使用的是表达式 Lambda\
  \ 而不是语句表达式。\n\n**列表 13.16：使用表达式 Lambda 传递委托**\n\n点击此处查看代码图像\n\n```csharp\n // ...\n\
  \n   BubbleSort(items, (first, second) => first < second );\n\n   // ...\n```\n\n\
  通常，你读取表达式 Lambda 中 Lambda 运算符 `=>` 的方式与读取语句 Lambda 相同：*go to* 或 *becomes*，但在委托是谓词的情况下，通常将\
  \ Lambda 运算符读作 *such that* 或 *where*（使得）。因此，你可能会将列表 13.16 中的 Lambda 读作`first` 和\
  \ `second` *使得* `first` 小于 `second`。”\n\n\n\n\n\n| Lambda 表达式本身没有类型。因此，没有可以从 Lambda\
