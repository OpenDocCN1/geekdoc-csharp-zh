  \n### `nowarn:<warn list>` 选项\n\n除了 `#pragma` 指令外，C# 编译器通常支持 `nowarn=<warn list>`\
  \ 选项。这与 `#pragma` 具有相同的效果，不同在于你不是将其添加到源代码中，而是作为编译器选项插入。`nowarn` 选项影响整个编译过程，而 `#pragma`\
  \ 选项仅影响其出现的文件。`nowarn` 选项影响整个编译过程，例如要禁用警告，如 输出 29 所示。\n\n\n\n\n根据你目前为止学到的 C# 编程，你应该能够编写出由语句列表组成的简单程序，类似于\
  \ 20 世纪 70 年代创建程序的方式。然而，自 70 年代以来，编程领域已经取得了长足进步；随着程序变得越来越复杂，出现了新的范式来管理这种复杂性。*过程化*或*结构化*编程提供了一种构造，通过这些构造可以将语句组合形成单元。此外，通过结构化编程，可以将数据传递给一组语句，并在语句执行后返回数据。\n\
  \n![图中展示了各种类型的方法和参数。](img/05mindmap.jpg)\n\n除了调用和定义方法的的基础知识外，本章还涵盖了一些稍微高级的概念——即递归、方法重载、可选参数和具名参数。到目前为止以及直到本章结束的所有方法调用都是静态的（第\
  \ 6 章的`HelloWorld` 程序中，你已经已经学习了如何定义方法。在那个示例中，你定义了 `Main()` 方法。在本章中，你将更详细地学习方法的创建，包括用于参数的特殊\
  \ C# 语法（`ref` 和 `out`），它们向方法传递变量而不是值。最后，我们将涉及一些基本的错误处理。\n\n### 调用方法\n\n首先，我们重新审视第\
  \ 1 章中的 `System.Console.Write()`、`System.Console.WriteLine()` 和 `System.Console.ReadLine()`。这一次，我们将它们视为普通方法调用的示例，而不是关注从控制台打印和检索数据的具体细节。列表\
  \ 5.2 显示了这三种方法的各种用法。\n\n**列表 5.2：简单的方法调用**\n\n点击此处查看代码图像\n\n```\nclass HeyYou\n\
  {\n  static void Main()\n  {\n      string firstName;\n      string lastName;\n\
  \      System.Console.WriteLine(\"Hey you!\");\n      System.Console.Write(\"Enter\
  \ your first name: \");\n      firstName = System.Console.ReadLine();\n      System.Console.Write(\"\
  Enter your last name: \");\n      lastName = System.Console.ReadLine();\n      System.Console.WriteLine(\n\
  \          $\"Your full name is { firstName } { lastName }.\");\n  }\n}\n```\n\n\
  方法调用的部分包括方法名、参数列表和返回值。完全限定的方法名包含命名空间、类型名和方法名；用点符分隔完全限定方法名的每个部分。正如我们所看到的，调用方法时通常只使用其完全限定名的部分部分。\n\
  \n### 命名空间\n\n命名空间是一种分类机制，用于将与特定功能区域相关的所有类型分组。命名空间是分层的，并且在层次结构中可以具有任意数量级，尽管超过六级的命名空间并不多见。通常，层次结构从公司名称开始，然后是产品名称，最后是功能区域。例如，在\
  \ `Microsoft.Win32.Networking` 中，最外命名空间是 `Microsoft`，它包含一个内部命名空间 `Win32`，后者又包含一个嵌套得更深的\
  \ `Networking` 命名空间。\n\n命名空间主要按功能区域组织类型，以便更容易找到和理解它们。然而，它们也可以用于避免类型名称冲突。例如，只要每个类型具有不同的命名空间，编译器就可以区分两个名为\
  \ `Button` 的类型。因此，你可以消除类型 `System.Web.UI.WebControls.Button` 和 `System.Windows.Controls.Button`\
  \ 的差异。\n\n在列表 5.2 中，`Console` 类型位于 `System` 命名空间中。`System` 命名空间包含了允许程序员执行许多基础编程活动的类型。几乎所有的\
  \ C# 程序都使用 `System` 命名空间中的类型。表 5.1 提供了其他常用命名空间的列表。\n\n`开始 4.0`\n\n| **命名空间** | **描述**\
  \ |\n| --- | --- |\n| `System` | 包含基本类型以及用于类型转换、数学计算、程序调用和环境管理的类型。 |\n| `System.Collections.Generics`\
  \ | 包含使用泛型的强类型集合。 |\n| `System.Data` | 包含用于处理数据库的类型。 |\n| `System.Drawing` | 包含用于显示设备绘图和处理图像的类型。\
  \ |\n| `System.IO` | 包含用于处理目录以及操作、加载和保存文件的类型。 |\n| `System.Linq` | 包含用于使用集成语言查询\
  \ (LINQ) 查询集合中数据的类和接口。 |\n| `System.Text` | 包含用于处理字符串、各种文本编码以及在这些编码之间转换的类型。 |\n\
  | `System.Text.RegularExpressions` | 包含用于处理正则表达式的类型。 |\n| `System.Threading` | 包含用于多线程编程的类型。\
  \ |\n| `System.Threading.Tasks` | 包含基于任务的异步处理类型。 |\n| `System.Web` | 包含允许浏览器到服务器通信（通常通过\
  \ HTTP）的类型。该命名空间内的功能用于支持 ASP.NET。 |\n| `System.Windows` | 包含从 .NET 3.0 开始创建丰富用户界面的类型，使用名为\
  \ Windows Presentation Framework (WPF) 的 UI 技术，利用可扩展应用程序标记语言 (XAML) 进行声明式设计。 |\n\
  | `System.Xml` | 包含基于标准的 XML 处理支持。 |\n\n**表 5.1：常用命名空间**\n\n`结束 4.0`\n\n在调用方法时，并不总是需要提供命名空间。例如，如果调用表达式出现在与方法相同的命名空间类型中，编译器可以推断出该命名空间。在本章的后半部分，你将看到\
  \ `using` 指令如何消除命名空间。\n\n### 类型名\n\n对静态方法的调用需要类型限定符，除非目标方法位于同一类型内^(1) 或基类中。（正如本章后部分讨论的，`using\
  \ static` 指令允许你省略类型名。）例如，在 `HelloWorld.Main()` 中对 `Console.WriteLine()` 调用需要指定类型\
  \ `Console`。然而，正如命名空间一样，当方法是调用所在类型的成员时，C# 允许在方法调用中省略类型名。（此类方法调用示例出现在列表 5.4 中。）在这种情况下，类型名是不必要的，因为编译器根据调用位置推断类型。如果编译器无法进行此类推断，则必须作为方法调用的一部分提供类型名。\n\
  \n从本质上说，类型是将方法及其关联数据分组的一种。例如，`Console` 是包含 `Write()`、`WriteLine()` 和 `ReadLine()`\
  \ 方法（以及其他方法）的类型。所有这些方法都在同一个组，因为它们属于 `Console` 类型。\n\n\n\n\n\n每个方法调用都包含一个方法名，正如我们所讨论过的，方法名可能带有命名空间和类型名称，也可能不带有。方法名之后是参数列表，这是一个括括的、逗号分隔的值列表，这些值对应于方法的参数。\n\
  \n## 参数与参数\n\n方法可以接受任意数量的参数，每个参数都具有特定的数据类型。调用者为参数提供的值称为 `arguments`（参数）；每个参数都必须对应一个特定的参数。例如，下面的方法调用具有三个参数：\n\
  \n点击此处查看代码图像\n\n```\nSystem.IO.File.Copy(\n    oldFileName, newFileName, false)\n\
  ```\n\n该方法位于 `File` 类中，该类位于 `System.IO` 命名空间中。它声明有三个参数，第一个和第二个参数是 `string` 类型，第三个是\
  \ `bool` 类型。在这个示例中，我们使用 `string` 类型的变量（`oldFileName` 和 `newFileName`）作为旧旧文件名，然后指定\
  \ `false` 以表示如果新文件名已存在，则拷贝将失败。\n\n## 方法返回值\n\n与 `System.Console.WriteLine()` 相，列表\
  \ 5.2 中的方法调用 `System.Console.ReadLine()` 没有任何参数，因为该方法声明为不接受参数。然而，此方法恰好有一个 `method\
  \ return value`（方法返回值）。返回值是将结果从被调用方法传回调用者的手段。由于 `System.Console.ReadLine()` 有返回值，因此可以将返回值赋值给变量\
  \ `firstName`。此外，还可以将此返回值本身作为参数传递给另一个方法调用，如 列表 5.3 所示。\n\n**列表 5.3：将方法返回值作为参数传递给另一个方法调用**\n\
  \n点击此处查看代码图像\n\n```\nclass Program\n{\n  static void Main()\n  {\n      System.Console.Write(\"\
  Enter your first name: \");\n      System.Console.WriteLine(\"Hello {0}!\",\n  \
  \        System.Console.ReadLine());\n  }\n}\n```\n\n而不是将返回值赋值给变量，然后将该变量作为调用 `System.Console.WriteLine()`\
  \ 的参数，列表 5.3 在调用 `System.Console.WriteLine()` 内部调用了 `System.Console.ReadLine()`\
  \ 方法。在执行时，`System.Console.ReadLine()` 方法首先执行，其返回值直接传递给 `System.Console.WriteLine()`\
  \ 方法，而不是传递变量。\n\n并不是所有方法都返回数据。`System.Console.Write()` 和 `System.Console.WriteLine()`\
  \ 的两个版本都是此类方法的示例。正如你很快看到的，这些方法指定的返回类型为 `void`，就像 `Main` 的 `HelloWorld` 声明返回 `void`\
  \ 一样。\n\n## 语句与方法调用\n\n列表 5.3 演示了语句与方法调用之间的区别。尽管 `System.Console.WriteLine(\"Hello\
  \ {0}!\", System.Console.ReadLine());` 是一条语句，但它包含了两个方法调用。语句通常包含一个或多个表达式，在这个示例中，这些表达式中的两个是方法调用。因此，方法调用构成了语句的一部分。\n\
  \n虽然在单个语句中编写多个方法调用通常可以减少代码量，但它并不一定增加可读性，而且很少提供显著的性能优势。开发者应该优先考虑可读性而不是简洁性。\n\n> 注意：通常情况下，开发者应该优先考虑可读性而不是简洁性。可读性对于编写自文档的代码至关重要，从而随着时间的推移更具维护性。\n\
