  \n\n\n大多数人期望输出将如输出 13.3 所示，且在 C# 5.0 中确实如此。然而，在 C# 的之前的版本中，输出是如输出 13.4 所示。\n\n###\
  \ 输出 13.3：C# 5.0 输出\n\n```\nMoe\n\nLarry\n\nCurly\n```\n\n### 输出 13.4：C# 4.0 输出\n\
  \n```\nCurly\n\nCurly\n\nCurly\n```\n\nLambda 表达式捕获变量并始终使用该变量的最新值；它不会捕获并保留变量在创建委托时所具有的值。这通常正是你想要的——毕竟，在列表\
  \ 13.20 中捕获 `comparisonCount` 的目的就是为了确保在对其递增时使用其最新值。循环变量也不例外；当你捕获一个循环变量时，每个委托都捕获同一个循环变量。当循环变量发生变化时，每个捕获了该变量的委托都能看到这种变化。因此，C#\
  \ 4.0 的行为是合理的——但几乎从不是代码作者想要的。\n\n`5.0`\n\n在 C# 5.0 中，C# 语言发生了变化，使得 `foreach` 循环的循环变量现在每次循环迭代时都被视为一个全新的变量；因此，每个委托的创建捕获的是不同的变量，而不是所有迭代共享同一个变量。然而，此更改并未应用于\
  \ `for` 循环：如果你使用 `for` 循环编写类似的代码，在 `for` 语句头部中声明的任何循环变量在被捕获时将被视为单一的外部变量。如果你需要编写在\
  \ C# 5.0 和之前的 C# 版本中运行均相同的代码，请使用列表 13.23 所示的模式。\n\n`3.0`\n\n#### 列表 13.23：C# 5.0\
  \ 之前的循环变量捕获变通方案\n\n点击此处查看代码图像\n\n```\nclass DoNotCaptureLoop\n{\n  static void Main()\n\
  \  {\n      var items = new string[] { \"Moe\", \"Larry\", \"Curly\" };\n      var\
  \ actions = new List<Action>();\n      foreach (string item in items)\n      {\n\
  \          string _item = item;                                               \n\
  \          actions.Add(\n              ()=> { Console.WriteLine(_item); } );\n \
  \     }\n      foreach (Action action in actions)\n      {\n          action();\n\
  \      }\n  }\n}\n```\n\n现在每个循环迭代显然都有一个新变量；每个委托相应地闭包了一个不同的变量。\n\n`结束 5.0`\n\n###\
  \ 表达式树\n\n到目前，我们看到 Lambda 表达式是声明“内联”方法的简洁语法，该方法可以转换为委托类型。表达式 Lambda（但不是语句 Lambda\
  \ 或匿名方法）也可以转换为树。委托是一种对象，允许你像传递任何其他对象一样传递方法，并在任何时候调用它。表达式树也是一种对象，允许你随处传递编译器对 Lambda\
  \ 表达式的分析。但你为什么需要这种能力呢？显然，编译器的分析在生成 CIL 时对编译器是有用的，但在执行期间，拥有一个表示该分析的对象对开发者来说有什么用呢？让我们来看一个例子。\n\
  \n#### 将 Lambda 表达式作为数据\n\n考虑以下代码中的 Lambda 表达式：\n\n点击此处查看代码图像\n\n```\npersons.Where(\n\
  \    person => person.Name.ToUpper() == \"INIGO MONTOYA\");\n```\n\n`3.0`\n\n假设\
  \ `persons` 是 `Persons` 数组，对应 Lambda 表达式参数的 `Where` 方法的形式参数为委托类型 `Func<Person, bool>`。编译器发射一个包含\
  \ Lambda 主体代码的方法。它生成代码创建一个指向该发射方法的委托，并将该委托传递给 `Where` 方法。`Where` 方法返回一个查询对象，该对象在执行时会将委托应用于数组的每个成员，以确定查询结果。\n\
  \n现在假设 `persons` 不是一个 `Persons` 数组，而是一个代表包含数百万人员数据的远程数据库表的对象。表中每行的信息可以从服务器流到客户端，然后客户端可以创建与该行对应的\
  \ `Person` 对象。对 `Where` 的调用返回一个表示查询的对象。当在客户端请求该查询的结果时，结果是如何确定的呢？\n\n一种技术是从服务器传输数百万行数据到客户端。你可以从每行创建一个\
  \ `Person` 对象，从 Lambda 创建一个委托，并在每个 `Person` 上执行该委托。这在概念上与数组场景没有区别，但其开销要大得多。\n\n\
  第二种好得的技术是以某种方式将 Lambda 的含义（“过滤掉所有名字不是 Inigo Montoya 的人员行”）发送到服务器。数据库服务器经过优化，可以快速执行这种过滤。服务器随后可以选择只向客户端流式极少数匹配的行。因此，客户端不再创建数百万个\
  \ `Person` 对象并拒绝几乎所有的对象，而是只创建那些由服务器确定的已经匹配的对象。这种场景是为语言添加树的动机。转换为树的 Lambda 表达式变成了表示数据而非编译代码的对象。由于表达式树表示数据而非编译代码，因此可以在执行时分析\
  \ Lambda 并使用该信息来构建查询。但 Lambda 的含义是如何到达服务器的呢？\n\n#### 表达式树是对象图\n\n在执行期间，转换为树的 Lambda\
  \ 变成包含 `System.Linq.Expressions` 命名空间对象的对象图。图中的根对象代表 Lambda 本身。该对象引用表示参数、返回类型和主体表达式的对象，如图\
  \ 13.3 所示。对象图包含了编译器推出的关于 Lambda 的所有信息。这些信息随后可以在执行期间用于创建查询。或者，根 Lambda 表达式有一个方法 `Compile`，它可以即时生成\
  \ CIL 并创建一个实现所描述 Lambda 的委托。\n\n\n\n\n\n一个 `UnaryExpression` 表示类似于 `–count` 的表达式。它有一个类型为\
  \ `Expression` 的单个子节点 `Operand`。一个 `BinaryExpression` 有两个子表达式：`Left` 和 `Right`。这两种类型都有一个\
  \ `NodeType` 属性，用于标识特定的操作符，并且都继承自基类 `Expression`。还有大约 30 种表达式类型，例如 `NewExpression`、`ParameterExpression`、`MethodCallExpression`\
  \ 和 `LoopExpression`，它们代表了 C# 和 Visual Basic 中（几乎）所有的表达式。\n\n## 3.0\n\n### 委托与表达式树\n\
  \nLambda 表达式的有效性在编译时通过完全的语义分析进行验证，无论它被转换为委托还是表达式树。转换为委托的 Lambda 会导致编译器将该 Lambda\
  \ 编译为一个方法，并在执行时生成代码来创建指向该方法的委托。转换为表达式树的 Lambda 则会导致编译器在执行时生成创建 `LambdaExpression`\
  \ 实例的代码。但在使用语言集成查询 (LINQ) API 时，编译器如何知道是要生成委托在本地执行查询，还是生成表达式树以便将查询信息发送到远程数据库服务器呢？\n\
  \n用于构建 LINQ 查询的方法（如 `Where()`）是扩展方法。扩展 `IEnumerable<T>` 接口的方法版本接收委托参数；扩展 `IQueryable<T>`\
  \ 接口的方法接收表达式树参数。因此，编译器可以根据被查询集合的类型，来决定是从作为参数提供的 Lambda 创建委托还是表达式树。\n\n例如，考虑以下代码中的\
  \ `Where()` 方法：\n\n点击此处查看代码图像\n\n```\npersons.Where( person => person.Name.ToUpper()\
  \ ==\n\n    \"INIGO MONTOYA\");\n```\n\n在 `System.Linq.Enumerable` 类中声明的扩展方法签名是\n\
  \n`3.0`\n\n点击此处查看代码图像\n\n```\npublic IEnumerable<TSource> Where<TSource>(\n\n  \
  \  this IEnumerable<TSource> collection,\n\n    Func<TSource, bool> predicate);\n\
  ```\n\n在 `System.Linq.Queryable` 类中声明的扩展方法签名是：\n\n点击此处查看代码图像\n\n```\npublic IQueryable<TSource>\
  \ Where<TSource>(\n\n    this IQueryable<TSource> collection,\n\n    Expression<Func<TSource,\
  \ bool>> predicate);\n```\n\n编译器根据 `persons` 的编译时类型决定使用哪种扩展方法；如果它是可以转换为 `IQueryable<Person>`\
  \ 的类型，则选择 `System.Linq.Queryable` 中的方法。它将 Lambda 转换为表达式树。在执行时，`persons` 所引的对象接收表达式树数据，并可能使用该数据构建\
  \ SQL 查询，从而在请求查询结果时将其传递给数据库。调用 `Where` 的结果是一个对象，它在请求查询结果时会将查询发送到数据库并产生结果。\n\n如果\
  \ `persons` 无法隐式转换为 `IQueryable<Person>`，但可以隐式转换为 `IEnumerable<Person>`，则选择 `System.Linq.Enumerable`\
  \ 中的方法，并将 Lambda 转换为委托。调用 `Where` 的结果是一个对象，它在请求查询结果时会将生成的委托作为谓词应用于集合的每个成员，并产生符合谓词的结果。\n\
  \n### 检查表达式树\n\n如前，将 Lambda 表达式转换为 `Expression<TDelegate>` 创建的是表达式树而非委托。在本章前面的部分，我们还探索了如何将类似\
  \ `(x,y)=>x>y` 的 Lambda 转换为委托类型（如 `Func<int, int, bool>`）。要将同一个 Lambda 转换为表达式树，我们只需将其转换为\
  \ `Expression<Func<int, int, bool>>`，如列表 13.25 所示。我们可以检查生成的对象并显示关于其结构的信息，以及更复杂的表达式树的信息。\n\
  \n`3.0`\n\n**列表 13.25: 检查表达式树**\n\n点击此处查看代码图像\n\n```\nusing System;\n\nusing System.Linq.Expressions;\n\
  \nusing static System.Linq.Expressions.ExpressionType;\n\npublic class Program\n\
  \n{\n\n    public static void Main()\n    {\n\n        Expression<Func<int, int,\
  \ bool>> expression;\n\n        expression = (x, y) => x > y;\n\n        Console.WriteLine(\"\
  ------------- {0} -------------\",\n\n            expression);\n\n        PrintNode(expression.Body,\
  \ 0);\n\n        Console.WriteLine();\n\n        Console.WriteLine();\n\n      \
  \  expression = (x, y) => x * y > x + y;\n\n        Console.WriteLine(\"-------------\
  \ {0} -------------\",\n\n            expression);\n\n        PrintNode(expression.Body,\
  \ 0);\n\n    }\n\n    public static void PrintNode(Expression expression,\n\n  \
  \      int indent)\n\n    {\n\n        if (expression is BinaryExpression binaryExpression)\n\
  \            PrintNode(binaryExpression, indent);\n\n        else\n            PrintSingle(expression,\
  \ indent);\n\n    }\n\n    private static void PrintNode(BinaryExpression expression,\n\
  \n      int indent)\n    {\n\n        PrintNode(expression.Left, indent);\n\n  \
  \      PrintSingle(expression, indent);\n\n        PrintNode(expression.Right, indent\
  \ + 1);\n\n    }\n\n    private static void PrintSingle(\n\n            Expression\
  \ expression, int indent) =>\n        Console.WriteLine(\"{0,\" + indent * 5 + \"\
  }{1}\",\n\n          \"\", NodeToString(expression));\n\n    private static string\
  \ NodeToString(Expression expression) =>\n        expression.NodeType switch\n\n\
  \        {\n\n            // using ExpressionType\n\n            Multiply => \"\
  *\",\n\n            Add => \"+\",\n            Divide => \"/\",\n            Subtract\
  \ => \"-\",\n            GreaterThan => \">\",\n            LessThan => \"<\",\n\
  \            _ => expression.ToString() +\n\n                \" (\" + expression.NodeType.ToString()\
  \ + \")\",\n\n        };\n\n}\n```\n\n注意，将表达式树的实例传递给 `Console.WriteLine()` 会自动将表达式转换为描述性字符串；为表达式树生成的对象都重写了\
  \ `ToString()`，因此你可以在调试时查看表达式树的内容。\n\n`3.0`\n\n在输出 13.5 中，我们看到 `Main()` 中的 `Console.WriteLine()`\
  \ 语句打印出了表达式树的主体。\n\n**输出 13.5**\n\n点击此处查看代码图像\n\n```\n------------- (x, y) => (x\
  \ > y) -------------\n\n     x (Parameter)\n\n>\n\n     y (Parameter)\n\n-------------\
  \ (x, y) => ((x * y) > (x + y)) -------------\n\n          x (Parameter)\n\n   \
  \  *\n\n          y (Parameter)\n\n>\n\n          x (Parameter)\n\n     +\n\n  \
  \        y (Parameter)\n```\n\n需要注意的重要点是，表达式树是一系列数据的集合，通过遍历这些数据，可以将数据转换为另一种格式。在本例中，我们将表达式树转换为描述性字符串，但它也可以转换为另一种查询语言的表达式。\n\
  \n通过递归，`PrintNode()` 函数证明了表达式树中的节点本身也是树，包含零或多个表达式树。代表 Lambda 的根树指向作为 Lambda 主体的表达式。每个表达式树节点包含一个类型为\
  \ `ExpressionType` 枚举类型的 `NodeType` 属性，描述它是哪种表达式。\n\n\n\n\n虽然表达式树库现在包含了表示 C# 和 Visual\
  \ Basic 大部分语句的对象，但这两种语言实际上都不支持将语句 lambda（statement lambdas）转换为表达式树。只有表达式 lambda（expression\
  \ lambdas）可以转换为表达式树。\n\n### 总结\n\n本章从委托（delegates）及其作为方法引用或回调的使用开始讨论。这一强大的概念允许你在编写指令时，将一组指令传递过去，以便在不同的位置调用，而不是立即执行。\n\
  \n`3.0`\n\nLambda 表达式的概念是一种语法，它取代了（但没有消除）C# 2.0 的匿名方法语法。这些结构允许程序员直接将一组指令赋值给变量，而无需定义一个包含这些指令的显式方法。这种结构为在方法内部动态编写指令提供了极大的灵活性——这一强大的概念极大地通过\
  \ `LINQ` API 简化了集合的编程。\n\n本章结束于对表达式树概念的讨论，并考虑了它们如何编译成代表 lambda 表达式语义分析的对象，而不是委托实现本身。这一重要特性支持了如\
  \ `Entity Framework` 和 `LINQ to XML` 等库——即那些解释表达式树并在匿名函数之外的其他上下文中使用它的库。\n\n`Lambda\
  \ expressions` 涵盖了 `statement lambda` 和 `expression lambda`。换句话说，语句 lambda 和表达式\
  \ lambda 都是 lambda 表达式的类型。\n\n本章提到但未详述的内容是多路委托（multicast delegates）。下一章将详细研究多路委托，并解释它们如何通过事件实现发布-订阅模式。\n\
  \n`End 3.0`\n\n## 14. 事件 (Events)\n\n在第 13 章中，你看到了如何使用委托类型的实例来引用方法，并通过委托调用该方法。委托是称为“发布-订阅”（publish–subscribe）或“观察者”（observer）的大模式的构建块。使用委托来实现发布-订阅模式是章的重点。本章描述几乎的所有内容都可以仅使用委托完成。然而，本章强调的事件结构提供了额外的封装，使得发布-订阅模式更容易实现且更不容易出错。\n\
  \n`Begin 2.0`\n\n在第 13 章中，所有委托都引用一个单一方法。更广泛地说，单个委托值可以引用整个方法集合以便按顺序调用；这种委托被称为 `multicast\
  \ delegate`（多路委托）。它的应用实现了可以将单个事件（例如对象状态的变化）的通知发布给多个订阅者的场景。\n\n![插图描述了事件的六个阶段：引入发布-订阅模式；为什么需要事件；事件声明；编码规范；泛型和委托；以及自定义事件实现。](img/14mindmap.jpg)\n\
  \n虽然事件在 C# 1.0 中就已经存在了，但 C# 2.0 中泛型的引入显著地改变了编码规范，因为使用泛型委托数据类型意味着不再需要为每个可能的事件签名声明委托。出于此原因，本章始终假设环境至少为\
  \ C# 2.0。仍然生活在 C# 1.0 世界的读者也可以使用事件，但他们将必须声明自己的委托数据类型（如在第 13 章中讨论过的）。\n\n### 使用多路委托编写发布-订阅模式\n\
  \n考虑一个温度控制系统，其中加热器和冷却器连接到同一个温度控器上。为了让每个单元相应地开启和关闭，你必须通知这些单元温度的变化。一个温度控器将温度变化发布给多个订阅者——加热单元和冷却单元。下一节将研究代码.^(1)\n\
  \n1.在本示例中，我们使用 `thermostat`（温度控器）一词，是因为人们通常在加热冷却系统的背景下考虑它。从技术上讲，`thermometer`（温度计）更为合适。\n\
  \n#### 定义订阅方法\n\n首先定义 `Heater` 和 `Cooler` 对象（参见列表 14.1）。\n\n**列表 14.1: Heater 和\
  \ Cooler 事件订阅者实现**\n\n点击此处查看代码图像\n\n```\nclass Cooler\n{\n  public Cooler(float\
  \ temperature)\n  {\n      Temperature = temperature;\n  }\n\n  // 当环境温度高于此值时，激活冷却器\n\
  \n  public float Temperature { get; set; }\n\n  // 通知此实例的温度发生了变化\n\n  public void\
  \ OnTemperatureChanged(float newTemperature)\n  {\n      if (newTemperature > Temperature)\n\
  \      {\n          System.Console.WriteLine(\"Cooler: On\");\n      }\n      else\n\
  \      {\n          System.Console.WriteLine(\"Cooler: Off\");\n      }\n  }\n}\n\
  \nclass Heater\n{\n  public Heater(float temperature)\n  {\n      Temperature =\
  \ temperature;\n  }\n  public float Temperature { get; set; }\n  public void OnTemperatureChanged(float\
  \ newTemperature)\n  {\n      if (newTemperature < Temperature)\n      {\n     \
  \     System.Console.WriteLine(\"Heater: On\");\n      }\n      else\n      {\n\
  \          System.Console.WriteLine(\"Heater: Off\");\n      }\n  }\n}\n```\n\n\
  这两个类除了温度比较外，基本上是完全相同的。（事实上，如果你在 `OnTemperatureChanged` 方法中使用一个指向比较方法的委托，你就可以消除其中一个类。）每个类都存储了单元应该开启的温度。此外，两个类都提供了一个\
  \ `OnTemperatureChanged()` 方法。调用 `OnTemperatureChanged()` 方法是向 `Heater` 和 `Cooler`\
  \ 类指示温度已变化的手段。方法实现使用 `newTemperature` 与存储的温度进行比较，以决定是否开启设备。\n\n`OnTemperatureChanged()`\
  \ 方法是订阅者（也称为监听器）方法。它们的参数和返回类型必须与 `Thermostat` 类中的委托匹配，我们将在下文中讨论该类。\n\n`2.0`\n\n\
  #### 定义发布者\n\n`Thermostat` 类负责向 `heater` 和 `cooler` 对象实例报告温度变化。`Thermostat` 类的代码出现在列表\
  \ 14.2 中。\n\n**列表 14.2: 定义事件发布者 `Thermostat`**\n\n点击此处查看代码图像\n\n```\npublic class\
  \ Thermostat\n{\n  // 定义事件发布者（初始不带发送者）\n\n  public Action<float>? OnTemperatureChange\
  \ { get; set; }\n\n  public float CurrentTemperature { get; set; }\n}\n```\n\n`Thermostat`\
  \ 包含一个名为 `OnTemperatureChange` 的属性，其类型为 `Action<float>` 委托。`OnTemperatureChange`\
  \ 存储了订阅者列表。注意，只需要一个委托属性即可存储所有订阅者。换句话说，`Cooler` 和 `Heater` 实例将从这个单一发布者接收温度变化的通知。\n\
  \n`Thermostat` 的最后一个成员是 `CurrentTemperature` 属性。该属性设置并检索 `Thermostat` 类报告的当前温度值。\n\
  \n#### 连接发布者和订阅者\n\n最后，我们在 `Main()` 方法中将所有部分组合在一起。列表 14.3 显示了 `Main()` 可能的样貌。\n\n\
  \n\n\n\n```cs\nclass Program\n{\n  public static void Main()\n  {\n      Thermostat\
  \ thermostat = new Thermostat();\n      Heater heater = new Heater(60);\n      Cooler\
  \ cooler = new Cooler(80);\n      string temperature;\n      thermostat.OnTemperatureChange\
  \ +=                             \n          heater.OnTemperatureChanged;      \
  \                        \n      thermostat.OnTemperatureChange +=             \
  \                \n          cooler.OnTemperatureChanged;                      \
  \        \n      Console.Write(\"Enter temperature: \");\n      temperature = Console.ReadLine();\n\
  \      thermostat.CurrentTemperature = int.Parse(temperature);\n  }\n}\n```\n\n\
  `2.0`\n\n此列表中的代码通过直接使用 `+=` 运算符，向 `OnTemperatureChange` 委托注册了两个订阅者（`heater.OnTemperatureChanged`\
  \ 和 `cooler.OnTemperatureChanged`）。\n\n通过获取用户输入的温度值作为输入，你可以设置 `thermostat` 的 `CurrentTemperature`。然而，你还没有编写任何代码来向订阅者发布温度变化事件。\n\
  \n### 运行委托\n\n每当 `Thermostat` 类中的 `CurrentTemperature` 属性发生变化时，你都希望`调用委托`来通知订阅者（`heater`\
  \ 和 `cooler`）温度的变化。为了实现这一目标，你必须修改 `CurrentTemperature` 属性以保存新值，并向每个订阅者发布通知。代码修改出现在列表\
  \ 14.4 中。\n\n**列表 14.4：在不检查 `null` 的情况下运行委托**\n\n点击此处代码图像\n\n```cs\npublic class\
  \ Thermostat\n{\n  ...\n\n  public float CurrentTemperature\n  {\n      get { return\
  \ _CurrentTemperature; }\n      set\n      {\n          if (value != CurrentTemperature)\
  \                      \n          {\n              _CurrentTemperature = value;\
  \                      \n              // 未完成：需要检查 null\n              // 调用订阅者\
  \                               \n              OnTemperatureChange(value);    \
  \                   \n          }\n      }\n  }\n  private float _CurrentTemperature;\n\
  }\n```\n\n现在，`CurrentTemperature` 的赋值包含了一些特殊逻辑，用于通知订阅者 `CurrentTemperature` 的变化。通知所有订阅者的调用仅仅是一个简单的\
  \ C# 语句：`OnTemperatureChange(value)`。这一个语句将温度变化同时发布给 `cooler` 和 `heater` 对象。在这里，你从实践中看到，使用单个调用通知多个订阅者的能力正是为什么委托被更具体地称为多路委托（multicast\
  \ delegates），这一点在本章稍后会进一步讨论。\n\n`2.0`开始 8.0`\n\n但在 C# 8.0 中，直接调用 `CurrentTemperature`\
  \ 委托将触发可空解引用警告，表示需要进行空检查。\n\n`结束 8.0`开始 6.0`\n\n### 检查 `null`\n\n事件发布代码中缺少了一个重要部分，见在列表\
  \ 14.4。如果没有订阅者注册接收通知，`OnTemperatureChange` 将为 `null`，执行 `OnTemperatureChange(value)`\
  \ 语句将抛出 `NullReferenceException`。为了避免这种情况，必须在触发事件之前检查是否为 `null`。列表 14.5 演示了如何使用\
  \ C# 6.0 的空条件运算符在调用 `Invoke()` 之前执行。\n\n**列表 14.5：运行委托**\n\n点击此处代码图像\n\n```cs\n\
  public class Thermostat\n{\n  // 定义事件发布者\n  public Action<float>? OnTemperatureChange\
  \ { get; set; }\n\n  public float CurrentTemperature\n  {\n      get { return _CurrentTemperature;\
  \ }\n      set\n      {\n          if (value != CurrentTemperature)\n          {\n\
  \              _CurrentTemperature = value;\n              // 如果有任何订阅者，\n      \
  \        // 通过调用这些订阅者\n              // 通知它们温度的变化\n              OnTemperatureChange?.Invoke(value);\
  \  // C# 6.0                         \n          }\n      }\n  }\n  private float\
  \ _CurrentTemperature;\n}\n```\n\n注意紧随空条件运算符之后的 `Invoke()` 方法调用。虽然可以使用仅通过点运算符来调用此方法，但这没什么意义，因为那等同于直接调用委托（参见列表\
  \ 14.4 中的 `OnTemperatureChange(value)`）。使用空条件运算符的一个重要优势在于其特殊逻辑，可以确保在检查 `null` 之后，不存在订阅者可能调用过时处理程序（即在检查\
  \ `null` 之后发生更改的处理程序）而导致委托再次变为 `null`。\n\n`2.0`结束 6.0`\n\n### 委托运算符\n\n为了在 `Thermostat`\
  \ 示例中合并两个订阅者，你使用了 `+=` 运算符。该运算符获取第一个委托并将第二个委托添加到链中。现在，在第一个委托的方法返回后，将调用第二个委托。要从委托链中移除委托，请使用\
  \ `-=` 运算符，如列表 14.7 所示。\n\n**列表 14.7：使用 `+=` 和 `-=` 委托运算符**\n\n点击此处代码图像\n\n```cs\n\
  // ...\nThermostat thermostat = new Thermostat();\nHeater heater = new Heater(60);\n\
  Cooler cooler = new Cooler(80);\nAction<float> delegate1;\nAction<float> delegate2;\n\
  Action<float>? delegate3;\ndelegate1 = heater.OnTemperatureChanged;\ndelegate2 =\
  \ cooler.OnTemperatureChanged;\nConsole.WriteLine(\"Invoke both delegates:\");\n\
  delegate3 = delegate1;\ndelegate3 += delegate2;\ndelegate3(90);\nConsole.WriteLine(\"\
  Invoke only delegate2\");\ndelegate3 -= delegate1;\ndelegate3(30);\n// ...\n```\n\
  \n列表 14.7 的结果出现在输出 14.1 中。\n\n**输出 14.1**\n\n```\nInvoke both delegates:\nHeater:\
  \ Off\nCooler: On\nInvoke only delegate2:\nCooler: Off\n```\n\n你也可以使用 `+` 和 `-`\
  \ 运算符来合并委托，如列表 14.8 所示。\n\n`开始 8.0`2.0`\n\n**列表 14.8：使用 `+` 和 `-` 委托运算符**\n\n点击此处代码图像\n\
  \n```cs\n// ...\nThermostat thermostat = new Thermostat();\nHeater heater = new\
  \ Heater(60);\nCooler cooler = new Cooler(80);\nAction<float> delegate1;\nAction<float>\
  \ delegate2;\nAction<float>? delegate3;\n// 注意：使用 new Action (cooler.OnTemperatureChanged)\n\
  // 用于 C# 1.0 语法\ndelegate1 = heater.OnTemperatureChanged;\ndelegate2 = cooler.OnTemperatureChanged;\n\
  Console.WriteLine(\"Combine delegates using + operator:\");\ndelegate3 = delegate1\
  \ + delegate2;\ndelegate3(60);\nConsole.WriteLine(\"Uncombine delegates using -\
  \ operator:\");\ndelegate3 = (delegate3 - delegate2)!;\ndelegate3(60);\n// ...\n\
  ```\n\n赋值运算符会清除所有之前的订阅者并允许你用新的订阅者替换它们。这是委托的一个令人遗憾的特性。人们很容易错误地编写赋值语句，而实际上应该使用 `+=`\
  \ 运算符。这种解决方案被称为*事件*（events），在本章稍后的“理解事件”部分中描述。\n\n\n\n\n\n`+` 和 `-` 运算符及其赋值等价形式\
  \ `+=` 和 `-=` 在内部分别通过使用静态方法 `System.Delegate.Combine()` 和 `System.Delegate.Remove()`\
  \ 实现。这些方法接收两个类型为 `delegate` 的参数。第一个方法 `Combine()` 将两个参数合并，使得第一个参数在委托列表中引用第二个参数。第二个方法\
  \ `Remove()` 则在第一个参数指定的委托链中进行搜索，然后移除第二个参数指定的委托。此外，由于 `Remove()` 方法可能会返回 `null`，我们使用了\
  \ C# 8.0 的 `null` 忽略运算符（null-forgiving operator）来告诉编译器假设仍存在一个有效的委托实例。\n\n`End 8.0`\n\
  \n关于 `Combine()` 方法一个值得注意的有趣点是，它的参数中可以有一个或两个都为 `null`。如果其中一个为 `null`，则 `Combine()`\
  \ 返回非 `null` 参数。如果两个均为 `null`，则 `Combine()` 返回 `null`。这解释了为什么你可能调用 `thermostat.OnTemperatureChange\
  \ += heater.OnTemperatureChanged;` 而不会抛出异常，即使 `thermostat.OnTemperatureChange` 的值仍然为\
  \ `null`。\n\n`2.0`\n\n#### 顺序调用\n\n图 14.1 强调了 `heater` 和 `cooler` 的顺序通知。\n\n![显示了委托操作的序列图。](img/14fig01.jpg)\n\
  \n**图 14.1：委托调用序列图**\n\n尽管你只编写了一次对 `OnTemperatureChange()` 的调用，但该调用广播给了两个订阅者。因此，只需调用一次，`cooler`\
  \ 和 `heater` 都会收到温度变化的通知。如果你添加了更多订阅者，他们也将收到 `OnTemperatureChange()` 的通知。\n\n虽然一次\
  \ `OnTemperatureChange()` 调用导致了每个订阅者的通知，但订阅者仍然是顺序调用的，而不是同时的，因为它们都在同一个执行线程上被调用。\n\
  \n`Begin 3.0`\n\n#### 错误处理\n\n错误处理使得感知顺序通知变得至关重要。如果一个订阅者抛出异常，后续的订阅者将无法接收通知。例如，考虑如果更改\
  \ `Heater` 的 `OnTemperatureChanged()` 方法使其抛出异常会发生什么，如 代码列表 14.9 所示所示\n\n**代码列表 14.9：`OnTemperatureChanged()`\
  \ 抛出异常**\n\n点击此处查看代码图像\n\n```csharp\nclass Program\n\n{\n\n  public static void\
  \ Main()\n  {\n\n      Thermostat thermostat = new Thermostat();\n\n      Heater\
  \ heater = new Heater(60);\n\n      Cooler cooler = new Cooler(80);\n\n      string\
  \ temperature;\n\n      thermostat.OnTemperatureChange +=\n\n          heater.OnTemperatureChanged;\n\
  \n      // 使用 C# 3.0\\. 改为匿名方法\n      // 如果使用 C# 2.0\n\n      thermostat.OnTemperatureChange\
  \ +=                                  \n          (newTemperature) =>          \
  \                                  \n              {                           \
  \                               \n                  throw new InvalidOperationException();\
  \                 \n              };                                           \
  \              \n\n      thermostat.OnTemperatureChange +=\n\n          cooler.OnTemperatureChanged;\n\
  \n      Console.Write(\"Enter temperature: \");\n\n      temperature = Console.ReadLine();\n\
  \n      thermostat.CurrentTemperature = int.Parse(temperature);\n\n  }\n}\n```\n\
  \n`2.0`\n\n图 14.3 显示了更新后的序列图。尽管 `cooler` 和 `heater` 订阅了接收消息，但 lambda 表达式异常终止了链，阻止了\
  \ `cooler` 对象接收通知。\n\n![显示了委托操作的序列图。](img/14fig03.jpg)\n\n**图 14.3：带异常的委托调用序列图**\n\
  \n`End 3.0`\n\n为了避免这个问题并确保无论之前的订阅者表现如何，所有订阅者都能接收通知，你必须手动枚举订阅者列表并单独调用。列表 14.10 显示了\
  \ `CurrentTemperature` 属性中所需的更新。结果出现在 输出 14.2 中。\n\n`2.0`\n\n**代码列表 14.10：处理来自订阅者的异常**\n\
  \n点击此处查看代码图像\n\n```csharp\npublic class Thermostat\n\n{\n\n  // 定义事件发布者\n  public\
  \ Action<float>? OnTemperatureChange;\n\n  public float CurrentTemperature\n  {\n\
  \      get { return _CurrentTemperature; }\n      set\n      {\n          if (value\
  \ != CurrentTemperature)\n          {\n              _CurrentTemperature = value;\n\
  \n              Action<float>? onTemperatureChange = OnTemperatureChange;\n\n  \
  \            if(onTemperatureChange != null)\n              {\n                \
  \  List<Exception> exceptionCollection =                           \n          \
  \            new List<Exception>();                                      \n    \
  \              foreach (                                                       \n\
  \                      Delegate handler in                                     \
  \    \n                      onTemperatureChange.GetInvocationList())          \
  \          \n                  {                                               \
  \                \n                      try                                   \
  \                      \n                      {                               \
  \                            \n                          ((Action<float>) handler)(value);\
  \                       \n                      }                              \
  \                             \n                      catch (Exception exception)\
  \                                 \n                      {                    \
  \                                       \n                          exceptionCollection.Add(exception);\
  \                     \n                      }                                \
  \                           \n                  }                              \
  \                                 \n                  if (exceptionCollection.Count\
  \ > 0)                              \n                  {                      \
  \                                         \n                      throw new AggregateException(\
  \                               \n                          \"There were exceptions\
  \ thrown by\nOnTemperatureChange subscribers.\",                               \
  \        \n                          exceptionCollection);                     \
  \              \n                  }                                           \
  \                    \n                }\n          }\n      }\n  }\n\n  private\
  \ float _CurrentTemperature;\n}\n```\n\n`2.0`\n\n**输出 14.2**\n\n```\nEnter temperature:\
  \ 45\n\nHeater: On\n\nError in the application\n\nCooler: Off\n```\n\n列表 14.10 展示了你可以从委托的\
  \ `GetInvocationList()` 方法获取订阅者列表。枚举此列表中的每一项会返回单独的订阅者。如果你将每个订阅者的调用都放在 try/catch\
  \ 块中，就可以可以在继续枚举循环之前处理任何错误情况。在这个示例中，尽管委托订阅者抛出了异常，`cooler` 仍然收到了温度变化的通知。在发送所有通知后，列表\
  \ 14.10 通过抛出 `AggregateException` 来报告任何异常，该异常封装了一个可以通过 `InnerExceptions` 属性访问的异常集合。通过这样，所有异常都将得到报告，同时所有订阅者都收到了通知。\n\
  \n#### 方法返回值和引用传递\n\n\n\n\n\n在另一种场景下，遍历委托调用列表比简单地直接调用委托用。这种场景涉及那些不返回 `void` 或是具有\
  \ `ref` 或 `out` 参数的委托。在温度控器的示例中，`OnTemperatureChange` 委托的类型为 `Action<float>`，它返回\
  \ `void` 且没有 `out` 或 `ref` 参数。因此，不会向发布者返回任何数据。这种考虑是非常重要的，因为委托的调用可能会触发对多个订阅者的通知。如果每个订阅者都返回一个值，那么将无法确定应该使用哪个订阅者的返回值。\n\
  \n如果你将 `OnTemperatureChange` 改为返回一个枚举值，用指示设备是否因为温度变化而开启，那么新的委托类型将是 `Func<float,\
  \ Status>`，其中 `Status` 是一个包含 `On` 和 `Off` 元素的枚举。所有订阅者方法都必须使用与委托相同的签名，因此每个方法都要求返回一个状态值。此外，由于\
  \ `OnTemperatureChange` 可能对应于委托链，有必要遵循你用于错误处理时使用的模式。换句话说，你必须使用 `GetInvocationList()`\
  \ 方法遍历每个委托调用列表，以获取每个单独的返回值。同样，使用 `ref` 和 `out` 参数的委托类型也需要特殊考虑。然而，尽管在特殊情况下可以使用这种方法，最好的建议是通过仅返回\
  \ `void` 来完全避免这种场景。\n\n`2.0`\n\n# 理解事件 (Events)\n\n对于你在本章中目前所使用的委托，存在两个关键问题。为了克服这些问题，C#\
  \ 使用了 `event` 关键字。在本节中，你将看到为什么要使用事件以及它们是如何工作的。\n\n## 为什么使用事件？\n\n本章和前一章涵盖了关于委托如何工作所需的所有知识。遗憾的是，委托结构的缺陷可能会无意中允许程序员引入\
  \ Bug。这些问题涉及订阅或发布事件都无法充分控制的封装。具体来说，使用事件限制了外部类只能通过 `+=` 运算符向发布者添加订阅方法，并通过 `-=` 运算符取消订阅。此外，它们还限制了包含类以外的其他类触发事件。\n\
  \n### 封装订阅\n\n如之前所示，可以使用赋值运算符将一个委托赋值给另一个。遗憾的是，这种能力引入了常见的 Bug 来源。考虑 Listing 14.11。\n\
  \n**Listing 14.11:使用赋值运算符 `=` 而不是 `+=`**\n\n点击此处查看代码图片\n\n```\nclass Program\n\n\
  {\n\n  public static void Main()\n  {\n\n      Thermostat thermostat = new Thermostat();\n\
  \n      Heater heater = new Heater(60);\n\n      Cooler cooler = new Cooler(80);\n\
  \n      string temperature;\n\n      // Note: Use new Action (cooler.OnTemperatureChanged)\n\
  \n      // if C# 1.0\n\n      thermostat.OnTemperatureChange =\n\n          heater.OnTemperatureChanged;\n\
  \n      // Bug: 赋值运算符覆盖了\n\n      // 之前的赋值\n\n      thermostat.OnTemperatureChange\
  \ =                                \n          cooler.OnTemperatureChanged;    \
  \                            \n\n      Console.Write(\"Enter temperature: \");\n\
  \n      temperature = Console.ReadLine();\n\n      thermostat.CurrentTemperature\
  \ = int.Parse(temperature);\n\n  }\n}\n```\n\n`2.0`\n\nListing 14.11 与 Listing 14.7\
  \ 几乎相同，区别在于没有使用 `+=` 运算符，而是使用了简单的赋值运算符。因此，当代码将 `cooler.OnTemperatureChanged` 赋值给\
  \ `OnTemperatureChange` 时，`heater.OnTemperatureChanged` 被清除了，因为一个全新的链被赋值替换了之前的链。在想要使用\
  \ `+=` 赋值时误用赋值运算符的可能性非常高，以至于在包含类内部之外的对象不支持赋值运算符反而更好。`event` 关键字提供了这种额外的封装，使得你不会无意中取消其他订阅者。\n\
  \n### 封装发布\n\n委托和事件之间的第二个重要区别是，事件确保只有包含类可以触发事件通知。考虑 Listing 14.12。\n\n**Listing\
  \ 14.12: 在事件容器外部触发事件**\n\n点击此处查看代码图片\n\n```\nclass Program\n\n{\n\n  public static\
  \ void Main()\n  {\n\n      Thermostat thermostat = new Thermostat();\n\n      Heater\
  \ heater = new Heater(60);\n\n      Cooler cooler = new Cooler(80);\n\n      string\
  \ temperature;\n\n      // Note: Use new Action (cooler.OnTemperatureChanged)\n\n\
  \      // if C# 1.0\n\n      thermostat.OnTemperatureChange +=\n\n          heater.OnTemperatureChanged;\n\
  \n      thermostat.OnTemperatureChange +=\n\n          cooler.OnTemperatureChanged;\n\
  \n        thermostat.OnTemperatureChange(42);                                 \n\
  \n    }\n\n}\n```\n\n`2.0`\n\n在 Listing 14.12 中，即使 `thermostat` 上的 `CurrentTemperature`\
  \ 没有变化，`Program` 也可以调用 `OnTemperatureChange` 委托。因此，`Program` 向所有 `thermostat` 订阅者触发了温度变化的通知，尽管\
  \ `thermostat` 的温度并没有变化。一样，委托的问题在于封装不足。`Thermostat` 应该防止任何其他类调用 `OnTemperatureChange`\
  \ 委托。\n\n### 定义事件\n\nC# 提供了 `event` 关键字来处理这两个问题。虽然看起来像字段修饰符，但 `event` 定义了一种新类型的成员（参见\
  \ Listing 14.13）。\n\n**Listing 14.13: 在事件编码模式中使用 `event` 关键字**\n\n点击此处查看代码图片\n\n\
  ```\npublic class Thermostat\n\n{\n\n    public class TemperatureArgs: System.EventArgs\
  \                          \n  {                                               \
  \                          \n\n      public TemperatureArgs( float newTemperature\
  \ )                        \n      {                                           \
  \                          \n\n          NewTemperature = newTemperature;      \
  \                            \n\n      }                                       \
  \                              \n\n      public float NewTemperature { get; set;\
  \ }                             \n\n  }                                        \
  \                                 \n\n  // 定义事件发布者                             \
  \                \n  public event EventHandler<TemperatureArgs> OnTemperatureChange\
  \ =          \n      delegate { };                                             \
  \            \n\n  public float CurrentTemperature\n\n  {\n\n      ...\n\n  }\n\n\
  \  private float _CurrentTemperature;\n}\n```\n\n\n\n\n\n新的 `Thermostat` 类相对于原始类有四处变化。首先，`OnTemperatureChange`\
  \ 属性被删除，取而代之的是 `OnTemperatureChange` 被声明为一个公共字段。这似乎与解决早期的封装问题理念背道而驰。更有意义的做法应该是增加封装性，而不是通过将字段公共化来减少它。然而，第二个变化是在字段声明之前立即添加了\
  \ `event` 关键字。这一简单的更改提供了所需的所有封装性。通过添加 `event` 关键字，你防止了在公共委托形字段上使用赋值运算符（例如，`thermostat.OnTemperatureChange\
  \ = cooler.OnTemperatureChanged`）。此外，只有包含类能够调用触发向所有订阅者发布发布委托（例如，不允许在类外部执行 `thermostat.OnTemperatureChange(42)`）。换句话说，`event`\
  \ 关键字提供了必要的封装性，防止任何外部类发布事件或取消订阅它未添加的先前的订阅者。这解决了之前提到的关于普通委托的两个问题，也是 C# 引入 `event`\
  \ 关键字的关键原因之一。\n\n普通委托的另一个潜在陷阱是，在调用委托之前，很容易忘记检查是否为 `null`（理想情况下在 C# 6.0 代码中使用空值条件运算符）。这种遗漏可能会导致意外的\
  \ `NullReferenceException`。幸运的是，`event` 关键字提供的封装在声明期间（或构造函数内部）提供了另一种可能性，如 Listing\
  \ 14.13)\n\n2. 虽然这种情况很少见，但请注意当事件包含在结构体内部时，这种模式不起作用。\n\n## 编码规范\n\n要获得所需的功能，你只需要将原始委托变量声明更改为字段，并添加\
  \ `event` 关键字。通过这两处更改，你提供了必要的封装性；所有其他功能保持不变。然而，在 Listing 14.13 代码的委托声明中发生了一次额外的更改。为了遵循标准的\
  \ C# 编码规范，你应该将 `Action<float>` 替换为新的委托类型：`EventHandler<TemperatureArgs>`，这是一个通用语言运行时（CLR）类型，其声明在\
  \ Listing 14.14 中所示。\n\n`2.0`\n\n**Listing 14.14: 通用事件处理器类型**\n\n点击此处查看代码图像\n\n\
  ```\npublic delegate void EventHandler<TEventArgs>(\n\n   object sender, TEventArgs\
  \ e);\n```\n\n结果是，`Action<TEventArgs>` 委托类型中的单个温度参数被两个新参数取代——一个用于发布者或“发送者”，第二个用于事件数据。这种更改不是\
  \ C# 编译器强制执行的，但对于意用于事件的委托，传递这些类型的两个参数是常规范。\n\n第一个参数 `sender` 包含了调用委托的类的实例。如果同一个订阅者方法注册了多个事件，这就会特别有帮助——例如，如果\
  \ `heater.OnTemperatureChanged` 事件订阅了两个不同的 `Thermostat` 实例。在这种情况下，任何一个 `Thermostat`\
  \ 实例都可以触发对 `heater.OnTemperatureChanged` 的调用。要确定是哪个 `Thermostat` 实例触发了事件，你可以在 `Heater.OnTemperatureChanged()`\
  \ 内部使用 `sender` 参数。如果事件是静态的，则此选项不可用，因此你需要为 `sender` 参数值传递 `null`。\n\n第二个参数 `TEventArgs\
  \ e` 被指定为类型 `Thermostat.TemperatureArgs`。`TemperatureArgs` 的重要之处，至少从编码规范的角度来看，是它继承自\
  \ `System.EventArgs`。（事实上，在 Microsoft .NET Framework 4.5 之前，框架通过泛型约束强制要求继承自 `System.EventArgs`。）`System.EventArgs`\
  \ 上唯一的显著属性是 `Empty`，用于指示没有事件数据。然而，当你从 `System.EventArgs` 派生 `TemperatureArgs` 时，添加了一个额外的属性\
  \ `NewTemperature`，用于将温度从温度计传递给订阅者。\n\n让我们总结一下事件的编码规范：第一个参数 `sender` 是 `object`\
  \ 类型，包含调用委托的对象的引用，或者如果事件是静态的则为 `null`。第二个参数是 `System.EventArgs` 类型或派自 `System.EventArgs`\
  \ 的类型，但包含有关事件的附加数据。你像以前一样完全调用委托，只是多了一些额外的参数。Listing 14.15 显示了一个示例。\n\n`2.0`\n\n\
  **Listing 14.15: 触发事件**\n\n点击此处查看代码图像\n\n```\npublic class Thermostat\n\n{\n  ...\n\
  \  public float CurrentTemperature\n\n  {\n      get{return _CurrentTemperature;}\n\
  \      set\n      {\n          if (value != CurrentTemperature)\n          {\n \
  \             _CurrentTemperature = value;\n              // 如果有任何订阅者\n        \
  \      // 通过调用这些订阅者通知\n              // 温度的变化\n              OnTemperatureChange?.Invoke(\
  \  // 使用 C# 6.0                 \n\n                      this, new TemperatureArgs(value)\
  \ );                   \n\n            }\n      }\n  }\n\n  private float _CurrentTemperature;\n\
  }\n```通常使用容器类（`this`）指定发送者，因为它是唯一可以调用委托的类。在此示例中，订阅者可以将 sender 参数转换为 `Thermostat`\
  \ 并以此访问温度，也可以通过 `TemperatureArgs` 实例访问。然而，`Thermostat` 实例上的当前温度可能会通过另一个线程更改。当事件由于状态变化发生时，传递新旧值是一种经常使用的模式，用于控制允许的状态转换。\n\
  \n`2.0`\n\n## 泛型与委托\n\n在前节定义事件类型的指南是使用 `EventHandler<TEventArgs>` 委托类型。理论上，可以使用任何委托类型，但按照惯，第一个参数\
  \ `sender` 是 `object` 类型，第二个参数 `e` 应该是派自 `System.EventArgs` 的类型。C# 1.0 中委托较繁琐的方面之一是，每当参数发生变化时，必须声明一个新的委托类型。每次创建新的派自\
  \ `System.EventArgs`（一种相当常见的情况）都需要声明一个使用新 `EventArgs`-派生类型的新委托数据类型。例如，为了在 Listing\
  \ 14.15 事件通知代码中使用 `TemperatureArgs`，需要声明一个具有 `TemperatureArgs` 作为参数的 `TemperatureChangeHandler`\
  \ 委托类型（参见 Listing 14.16）。\n\n\n\n\n\n# 列表 14.16: 使用自定义委托类型\n\n点击此处查看代码图像\n\n```cs\n\
  public class Thermostat\n\n{\n\n  public class TemperatureArgs: System.EventArgs\n\
  \n  {\n\n      public TemperatureArgs( float newTemperature )\n      {\n       \
  \   NewTemperature = newTemperature;\n      }\n      public float NewTemperature\
  \ { get; set; }\n\n  public delegate void TemperatureChangeHandler(            \
  \                           \n      object sender, TemperatureArgs newTemperature);\
  \                                  \n  public event TemperatureChangeHandler?  \
  \                                             \n      OnTemperatureChange;     \
  \                                                        \n\n  public float CurrentTemperature\n\
  \  {\n      ...\n  }\n\n  private float _CurrentTemperature;\n}\n```\n\n## 2.0\n\
  \n虽然通常情况下 `EventHandler<TEventArgs>` 优于创建如 `TemperatureChangeHandler` 的自定义委托类型，但后者类型有一个优势。具体来说，如果使用自定义类型，参数名称可以针对特定事件。例如，在\
  \ 列表 14.16 中，当调用委托来引发事件时，第二个参数名称将显示为 `newTemperature` 而不是简单的 `e`。\n\n使用自定义委托类型的另一个原因是涉及在\
  \ C# 2.0 之前定义的 CLR API 部分。在来自 CLR API 的事件中，遇到特定的委托类型而非泛型形式并不罕见。无论如何，在 C# 2.0 及更高版本中中使用事件的大多数情况下，没有必要声明自定义委托数据类型。\n\
  \n当 C# 编译器遇到 `event` 关键字时，它会生成与 列表 14.18 所示 C# 代码等价的 CIL 代码。\n\n# 列表 14.18: 编译器生成的事件\
  \ CIL 代码的 C# 概念等价\n\n点击此处查看代码图像\n\n```cs\npublic class Thermostat\n\n{\n\n  // ...\n\
  \n  // 声明委托字段以保存订阅者                                          \n  // 列表         \
  \                                                      \n  private EventHandler<TemperatureArgs>\
  \ _OnTemperatureChange;                          \n\n  public void add_OnTemperatureChange(\
  \                                                 \n      EventHandler<TemperatureArgs>\
  \ handler)                                           \n  {                     \
  \                                                               \n      System.Delegate.Combine(_OnTemperatureChange,\
  \ handler);                          \n  }                                     \
  \                                               \n  public void remove_OnTemperatureChange(\
  \                                              \n      EventHandler<TemperatureArgs>\
  \ handler)                                           \n  {                     \
  \                                                               \n      System.Delegate.Remove(_OnTemperatureChange,\
  \ handler);                           \n  }                                    \
  \                                                \n  public event EventHandler<TemperatureArgs>\
  \ OnTemperatureChange                       \n  {                              \
  \                                                      \n      add             \
  \                                                                 \n      {    \
  \                                                                            \n\
  \          add_OnTemperatureChange(value)                                      \
  \         \n      }                                                            \
  \                    \n      remove                                            \
  \                               \n      {                                      \
  \                                          \n          remove_OnTemperatureChange(value)\
  \                                            \n      }                         \
  \                                                       \n  }                  \
  \                                                                  \n}\n```\n\n\
  换句话说，列表 14.17 所示的代码是（概念上）编译器用于触发 列表 14.18 所示代码展开的 C# 简写。（需要“概念上”这一限定符是因为为了阐明，消除了某些关于线程同步的细节。）\n\
  \nC# 编译器首先获取原始事件定义，并在其位置定义一个私有委托变量。结果是该委托对任何外部类——即使是派生它的类都是不可用的。\n\n## 2.0\n\n接下来，C#\
  \ 编译器定义了两个方法 `add_OnTemperatureChange()` 和 `remove_OnTemperatureChange()`，其中 `OnTemperatureChange`\
  \ 后缀取自事件的原始名称。这些方法分别负责实现 `+=` 和 `-=` 运算符。如 列表 14.18 所示，这些方法是使用在本章前面讨论的静态 `System.Delegate.Combine()`\
  \ 和 `System.Delegate.Remove()` 方法实现的。传递给这些方法每个方法的第一个参数是私有的 `EventHandler<TemperatureArgs>`\
  \ 委托实例 `OnTemperatureChange`。\n\n从 `event` 关键字生成的代码中最奇特的部分可能是最后一段。该语法与属性的 getter\
  \ 和 setter 方法非常相似，只是方法分别命名为 `add` 和 `remove`。`add` 块通过将调用传递给 `add_OnTemperatureChange()`\
  \ 来处理事件上的 `+=` 运算符。同样，`remove` 块运算符通过将调用传递给 `remove_OnTemperatureChange` 来处理 `-=`\
  \ 运算符。\n\n注意此代码与为属性生成的代码之间的相似之处。回想 C# 属性的方法是创建 `get_<propertyname>` 和 `set_<propertyname>`，然后将对\
  \ `get` 和 `set` 块的调用传递给这些方法。显然，在这种情况下事件语法非常相似。\n\n关于生成的 CIL 代码需要注意的另一个重要特征是 `event`\
  \ 关键字的 CIL 等效项保留在 CIL 中。换句话说，事件是 CIL 代码显式识别的内容；它不仅仅是 C# 的构造结构。通过在 CIL 代码中保留等效的 `event`\
  \ 关键字，所有语言和编辑器都可以提供特殊功能，因为它们可以将事件识别为特殊的类成员。\n\n### 自定义事件实现\n\n你可以自定义为 `+=` 和 `-=`\
  \ 生成的代码。例如，更改 `OnTemperatureChange` 委托的作用范围，使其变为保护的而不是私有的。当然，这将允许派自 `Thermostat`\
  \ 的类直接访问委托，而不是受到与外部类相同的限制。为了启用这种行为，C# 允许与 列表 14.16 所示语法相同的属性。换句话说，C# 允许你定义自定义的 `add`\
  \ 和 `remove` 块，为事件封装的每个方面提供独特的实现。列表 14.19 提供了一个示例。\n\n## 2.0\n\n**列表 14.19: 自定义\
  \ `add` 和 `remove` 处理程序**\n\n点击此处查看代码图像\n\n\n\n\n\n```sharp\npublic class Thermostat\n\
  \n{\n\n  public class TemperatureArgs: System.EventArgs\n\n  {\n\n      ...\n\n\
  \  }\n    // Define the event publisher                                        \
  \              \n\n  public event EventHandler<TemperatureArgs> OnTemperatureChange\
  \                       \n\n  {                                                \
  \                                    \n\n      add                             \
  \                                                 \n\n      {                  \
  \                                                                             \n\
  \n          _OnTemperatureChange =                                             \
  \          \n              (TemperatureChangeHandler)                          \
  \                     \n                  System.Delegate.Combine(value, _OnTemperatureChange);\
  \                \n      }                                                     \
  \                                          \n\n      remove                    \
  \                                                       \n\n      {            \
  \                                                                              \
  \     \n\n          _OnTemperatureChange =                                     \
  \                  \n              (TemperatureChangeHandler?)                 \
  \                             \n                  System.Delegate.Remove(_OnTemperatureChange,\
  \ value);                 \n      }                                            \
  \                                                   \n  }                      \
  \                                                                             \n\
  \n  protected EventHandler<TemperatureArgs>? _OnTemperatureChange;             \
  \          \n\n  public float CurrentTemperature\n\n  {\n      ...\n  }\n\n  private\
  \ float _CurrentTemperature;\n}\n```\n\n在这里，存储每个订阅者的委托 `_OnTemperatureChange` 被更改为\
  \ `protected`。此外，`add` 块实现切换了委托的存储顺序，使得最后一个添加到链中的委托成为第一个接收通知的委托。然而，代码不应依赖此实现。\n\n\
  ### 总结\n\n`2.0`\n\n既然我们已经描述了事件，我们注意到通常情况下，方法引用是建议在事件上下文之外处理委托变量的唯一情况。换句话说，考虑到事件额外的封装功能以及在需要时自定义实现的能力，最佳实践始终是使用事件来实现发布-订阅模式。\n\
  \n你可能需要进行一些练习才能在不参考示例代码的情况下从零编写事件代码。但是，事件是本书后续章节中描述的异步、多线程编程的关键基础。\n\n`End 2.0`\n\
  \n## 15. 带有标准查询操作符的集合接口\n\nC# 3.0 添加的最显著特性是集合，这归功于一个名为语言集成查询（`LINQ`）的编程 API。通过一组扩展方法和\
  \ lambda 表达式，LINQ 为处理集合提供了一个远为优的 API。事实上，在本书的早期版本中，集合章节紧接泛型章节之后，并在委托章节之前。然而，lambda\
  \ 表达式对 LINQ 来说是如此基础，以至于如果不先介绍委托（lambda 表达式的基础），就不再可能涵盖集合。现在你已经通过前两个章节建立了 lambda\
  \ 表达式的坚实基础，我们可以深入集合的细节——这是一个跨越三个章节的话题。在本章中，重点从`标准查询操作符`开始——这通过直接调用扩展方法来利用 LINQ 的手段。\n\
  \n在介绍集合初始化器之后，本章涵盖了各种集合接口并探索了它们之间的关系。这是理解集合的基础，因此你应该认真学习这些内容。集合接口部分包含了 C# 3.0 中添加的\
  \ `IEnumerable<T>` 扩展方法，这些方法实现了标准查询操作符。\n\n![显示了集合接口中讨论的主题的思维图。](img/15mindmap.jpg)\n\
  \n集合相关的类和接口分为两类：支持泛型的不支持泛型的。本章主要讨论泛型集合接口。只有在你编写需要与早期版本的运行时进行互操作的组件时，才应该使用不支持泛型的集合类。这是因为在非泛型形式中可用的所有内容都有一个强类型的泛型替代品。尽管这些概念仍然适用于两种形式，但我们不再显式讨论非泛型版本。\n\
  \n1. 事实上，.NET Standards 和 .NET Core 甚至不包含非泛型集合。\n\n本章以对匿名类型的深入讨论结束——我们曾在[第 3 章]的几个高级主题章节中简要介绍过这些主题。匿名类型有趣的地方在于，它们已经被\
  \ C# 7.0 的元组所掩盖——我们将在本章末尾进一步讨论这一主题。\n\n### 集合初始化器\n\n`集合初始化器`允许程序员在实例化时以类似于数组声明的方式，构建一个具有初始成员集合的集合。在集合初始化可用之前，元素必须在集合实例化后显式地添加到集合中——使用诸如\
  \ `System.Collections.Generic.ICollection<T>` 的 `Add()` 方法。使用集合初始化后，`Add()` 调用由\
  \ C# 编译器生成，而不是由开发者显式编写代码。列表 15.1 展示了如何使用集合初始化器初始化集合。\n\n**列表 15.1: 集合初始化**\n\n点击此处查看代码图像\n\
  \n```sharp\nusing System;\n\nusing System.Collections.Generic;\nclass Program\n\n\
  {\n\n  static void Main()\n  {\n      List<string> sevenWorldBlunders;\n      sevenWorldBlunders\
  \ = new List<string>()\n      {\n          // 来自甘地的引言\n          \"Wealth without\
  \ work\",\n          \"Pleasure without conscience\",\n          \"Knowledge without\
  \ character\",\n          \"Commerce without morality\",\n          \"Science without\
  \ humanity\",\n          \"Worship without sacrifice\",\n          \"Politics without\
  \ principle\"\n      };\n\n      Print(sevenWorldBlunders);\n  }\n\n  private static\
  \ void Print<T>(IEnumerable<T> items)\n  {\n      foreach (T item in items)\n  \
  \    {\n          Console.WriteLine(item);\n      }\n\n  }\n\n}\n```\n\n该语法不仅与数组初始化相似，也与构造函数后带有大括号的对象初始化器相似。如果构造函数中没有传递参数，则数据类型后的括号是可选的（就像对象初始化器一样）。\n\
  \n`Begin 6.0`\n\n集合初始化器要成功编译需要一些基本要求。理想情况下，应用集合初始化器的集合类型应该是实现了 `System.Collections.Generic.ICollection<T>`\
  \ 的类型。这确保了集合包含编译器生成的代码可以调用的 `Add()` 方法。然而，也存在一种宽松的要求，仅要求存在一个或多个 `Add()` 方法，可以作为扩展方法（C#\
  \ 6.0），也可以作为实现了 `IEnumerable` 的类型的实例方法——即使该集合没有实现 `ICollection<T>`。`Add()` 方法需要采取与集合初始化器中指定的值兼容的参数。\n\
  \n对于字典来说，集合初始化器的语法要稍微复杂一些，因为字典中的每个元素都需要键和值。这种语法在列表 15.2 中所示。\n\n\n\n\n\n# 列表 15.2：使用集合初始化器初始化\
  \ `Dictionary<>`\n\n点击此处查看代码图像\n\n```assembly\nusing System;\n\nusing System.Collections.Generic;\n\
  \n#if !PRECSHARP6\n  // C# 6.0 或更高版本\n  Dictionary<string, ConsoleColor> colorMap\
  \ =\n      new Dictionary<string, ConsoleColor>\n      {\n          [\"Error\"]\
  \ = ConsoleColor.Red,\n          [\"Warning\"] = ConsoleColor.Yellow,\n        \
  \  [\"Information\"] = ConsoleColor.Green,\n          [\"Verbose\"] = ConsoleColor.White\n\
  \      };\n#else\n  // C# 6.0 之前\n  Dictionary<string, ConsoleColor> colorMap =\n\
  \      new Dictionary<string, ConsoleColor>\n      {\n          { \"Error\", ConsoleColor.Red\
  \ },\n          { \"Warning\", ConsoleColor.Yellow },\n          { \"Information\"\
  , ConsoleColor.Green },\n          { \"Verbose\", ConsoleColor.White}\n        };\n\
  #endif\n```\n\n列表 15.2 包含了两种不同的初始化方式。第一种演示了 C# 6.0 中引入的新语法，它通过允许赋值运算符指定哪个值与哪个键关联，从而表达键/值对的意图。第二种语法（在\
  \ C# 6.0 或更高版本中仍然有效）使用大括号将名称和值配对。\n\n`结束 6.0`\n\n允许在不支持 `ICollection<T>` 的集合上使用初始化器很重要，原因有两点：首先，大多数集合（实现\
  \ `IEnumerable<T>` 的类型）也没有实现 `ICollection<T>`，这显著降低了集合初始化器的实用性。其次，通过方法名匹配以及与集合初始化器项的签名兼容性，使得初始化到集合中的项具有更大的多样性。例如，只要有一个签名与\
  \ `a` 兼容的 `Add()` 方法，以及另一个签名与 `b, c` 兼容的 `Add()` 方法，初始化器现在就可以支持 `new DataStore(){\
  \ a, {b, c}}`。\n\n## 类类成为类：`IEnumerable`\n\n根据定义，.NET 中的集合是至少实现了 `IEnumerable` 的类。此接口至关重要，因为实现\
  \ `IEnumerable` 的方法是支持遍历集合的最小要求。\n\n第 4 章 展示了如何使用 `foreach` 语句来遍历元素数组。这种语法非常简单，并且避免了必须知道元素数量的复杂性。然而，运行时并不直接支持\
  \ `foreach` 语句。相反，C# 编译器按照本节描述的方式转换代码。\n\n#### 用于数组的 `foreach`\n\n列表 15.3 演示了一个简单的\
  \ `foreach` 循环，它遍历一个整数数组并将每个整数打印到控制台。\n\n#### 列表 15.3：用于数组的 `foreach`\n\n点击此处查看代码图像\n\
  \n```csharp\nint[] array = new int[]{1, 2, 3, 4, 5, 6};\n\nforeach (int item in\
  \ array)\n{\n    Console.WriteLine(item);\n}\n```\n\n从这段代码中，C# 编译器创建了 `for` 循环的\
  \ CIL 等效代码，如列表 15.4 所示。\n\n#### 列表 15.4：用于数组的 `foreach` 的编译实现\n\n点击此处查看代码图像\n\n\
  ```csharp\nint[] tempArray;\nint[] array = new int[]{1, 2, 3, 4, 5, 6};\n\ntempArray\
  \ = array;\n\nfor (int counter = 0; (counter < tempArray.Length); counter++)\n{\n\
  \  int item = tempArray[counter];\n  Console.WriteLine(item);\n}\n```\n\n在此示例中，注意\
  \ `foreach` 依赖于对 `Length` 属性和索引运算符（`[]`）的支持。通过 `Length` 属性，C# 编译器可以使用 `for` 语句遍历数组中的每个元素。\n\
  \n#### 用于 `IEnumerable<T>` 的 `foreach`\n\n列表 15.4 所示的代码在长度固定且始终支持索引运算符的数组上运行良好，但并非所有类型的集合都有知的元素数量。此外，许多集合类（包括\
  \ `Stack<T>`、`Queue<T>` 和 `Dictionary<TKey, TValue>` 类）不支持通过索引检索元素。因此，需要一种更通用的遍历元素集合的方法。迭代器模式提供了这种能力。假设你可以确定第一个和下一个元素，那么知道计数和支持通过索引检索元素就是必要的。\n\
  \n`System.Collections.Generic.IEnumerator<T>` 和非泛型的 `System.Collections.IEnumerator`\
  \ 接口设计用于通过迭代器模式遍历元素集合，而不是列表 15.4 中所示的长度-索引模式。它们关系的类图出现在图 15.1 中。\n\n![IEnumerator<T>\
  \ 的类图](img/15fig01.jpg)\n\n**图 15.1：IEnumerator<T> 和 IEnumerable<T> 接口**\n\n`IEnumerator`\
  \ 派生自它，包含三个成员。第一个是 `MoveNext()`。使用该方法可以从集合中的一个元素移动到下一个。第二个成员是只读属性 `Current`，返回当前处理的元素。`Current`\
  \ 在 `IEnumerator<T>` 中被重载，提供了特定类型的实现。通过这两个成员，可以使用 `while` 循环简单地遍历集合，如列表 15.5 所示。（`Reset()`\
  \ 方法通常抛出 `NotImplementedException`，因此不应调用它。如果你需要重新枚举，请创建一个新的迭代器。）\n\n#### 列表 15.5：使用\
  \ `while` 遍历集合\n\n点击此处查看代码图像\n\n```csharp\nSystem.Collections.Generic.Stack<int>\
  \ stack =\n  new System.Collections.Generic.Stack<int>();\n\nint number;\n\n// ...\n\
  \n// 此代码是概念性的，不是实际代码\nwhile (stack.MoveNext())\n{\n  number = stack.Current;\n \
  \ Console.WriteLine(number);\n}\n```\n\n在列表 15.5 中，当 `MoveNext()` 越过末尾时会返回 `false`。这取代了循环时计数的需要。\n\
  \n列表 15.5 使用 `System.Collections.Generic.Stack<T>` 作为集合类型。存在许多其他集合类型；这只是一个例子。`Stack<T>`\
  \ 的关键特征是其后进先出（LIFO）集合的设计。\n\n##### 状态共享\n\n列表 15.5 实现的问题是，如果两个此类循环相互交叉——一个 `foreach`\
  \ 嵌套另一个，且都使用同一个集合——集合必须维护当前元素的状态指示器，以便在调用 `MoveNext()` 时确定下一个元素。在这种情况下，一个交织循环会影响另一个。（对于由多个线程执行的循环同样如此。）\n\
  \n\n\n\n\n为了解决这个问题，集合类并不直接支持 `IEnumerator<T>` 和 `IEnumerator` 接口。相反，如图 15.1 所示，有一个名为\
  \ `IEnumerable<T>` 的接口，其唯一的方法是 `GetEnumerator()`。该方法的目的是返回一个支持 `IEnumerator<T>`\
  \ 的对象。并不是由集合类维护状态，而是由另一个类（通常是嵌套类，以便它可以访问集合的内部结构）来支持 `IEnumerator<T>` 接口并保持迭代循环的状态。枚举器就像序列中的“光标”或“书签”。你可以拥有多个书签，并且移动其中每一个都可以独立于其他对集合进行枚举。使用这种模式，C#\
  \ 中 `foreach` 循环的等效代码将如列表 15.6 所示所示。\n\n### 列表 15.6：迭代期间维护状态的独立枚举器\n\n点击此处查看代码图像\n\
  \n```\nSystem.Collections.Generic.Stack<int> stack =\n\n  new System.Collections.Generic.Stack<int>();\n\
  \nint number;\n\nSystem.Collections.Generic.Stack<int>.Enumerator\n\n  enumerator;\n\
  \n// ...\n\n// 如果显式实现了 IEnumerable<T>，\n\n// 则需要进行强制转换：\n// ((IEnumerable<int>)stack).GetEnumerator();\n\
  \nenumerator = stack.GetEnumerator();\n\nwhile (enumerator.MoveNext())\n\n{\n\n\
  \  number = enumerator.Current;\n  Console.WriteLine(number);\n}\n```\n\n### 在 `foreach`\
  \ 迭代期间不要修改集合\n\n第 4 章展示了编译器防止对 `foreach` 变量（`number`）赋值。如列表 15.7 所示，对 `number` 赋值不会改变集合元素本身，因此\
  \ C# 编译器完全阻止了此类赋值。\n\n此外，在 `foreach` 循环执行期间，集合内部的元素计数或项本身通常都无法修改。例如，如果你在 `foreach`\
  \ 循环内部调用了 `stack.Push(42)`，将无法确定 `iterator` 应该忽略还是包含对 `stack` 的更改——换句话说，`iterator`\
  \ 应该遍历新添加的项，还是忽略它并假设与实例化时相同的状态。\n\n由于这种不确定性，如果在 `foreach` 循环内修改了集合，在访问枚举器时通常会抛出\
  \ `System.InvalidOperationException` 异常。此异常报告集合在枚举器实例化后被修改了。\n\n`开始 3.0`\n\n###\
  \ 标准查询运算符\n\n除了 `System.Object` 上的方法外，任何实现 `IEnumerable<T>` 的类型都被要求仅实现另一个方法，即 `GetEnumerator()`。然而，这样做为所有实现\
  \ `IEnumerable<T>` 的类型提供了 50 多个方法（不包括任何重载），而且这是在不需要显式实现 `GetEnumerator()` 方法之外的任何方法的情况下实现的。额外的功能通过\
  \ C# 3.0 的扩展方法提供，并存在于 `System.Linq.Enumerable` 类中。因此，只需包含 `System.Linq` 的 `using`\
  \ 声明即可使这些方法可用。\n\n`IEnumerable<T>` 上的每个方法都是**标准查询运算符**；它为其在其操作的集合提供了查询能力。在接下来的章节中，我们将检查这些最著名的标准查询运算符。这些示例中的许多依赖于\
  \ `Inventor` 和/或 `Patent` 类，这两个类都定义在列表 15.9 中。\n\n`3.0`\n\n### 列表 15.9：用于标准查询运算符的示例类\n\
  \n点击此处查看代码图像\n\n```\nusing System;\n\nusing System.Collections.Generic;\n\nusing\
  \ System.Linq;\n\npublic class Patent\n{\n\n  // 已公布应用的标题\n  public string Title\
