  \n#### 创建项目\n\n无论使用 `dotnet` CLI 还是 Visual Studio，都会创建几个文件。虽然不是一定需要，但通常生成的源代码中会包含一个名为**项目文件**的配置文件。项目文件的内容会根据不同的应用程序类型和\
  \ .NET 框架而异。然而，至少它通常会标识要包含哪些文件、构建何种应用程序类型、支持哪个 .NET 框架，以及调试或启动应用程序所需的任何设置，以及代码可能依赖的其他依赖项。例如，在上节中创建的简单\
  \ .NET Core 应用程序项目文件出现在列表 1.2 中。\n\n**列表 1.2：示例 .NET Core 控制台项目文件**\n\n点击此处查看代码图像\n\
  \n```xml\n<Project Sdk=\"Microsoft.NET.Sdk\">\n\n  <PropertyGroup>\n    <OutputType>Exe</OutputType>\n\
