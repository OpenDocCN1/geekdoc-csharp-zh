  \n### 输出错误和警告 (`#error`, `#warning`)\n\n有时，你可能想要标记代码中的潜在问题。你通过插入 `#error` 和 `#warning`\
  \ 指令来分别发出错误或警告。代码列表 4.58 使用井井游戏示例来警告代码没有防止玩家多次输入相同的步法。\n\n**代码列表 4.58：使用 `#warning`\
