  \ initials);\n  }\n  static string GetUserInput(string prompt)\n  {\n      System.Console.Write(prompt);\n\
  \      return System.Console.ReadLine();\n  }\n\n  static string GetFullName(  //\
  \ C# 6.0 表达式体方法\n      string firstName, string lastName) =>\n          $\"{ firstName\
  \ } { lastName }\";\n\n  static void DisplayGreeting(string fullName, string initials)\n\
  \  {\n      System.Console.WriteLine(\n          $\"Hello { fullName }! Your initials\
  \ are { initials }\");\n      return;\n  }\n\n  static string GetInitials(string\
  \ firstName, string lastName)\n  {\n      return $\"{ firstName[0] }. { lastName\
  \ }.\";\n  }\n}\n```\n\n**输出 5.1**\n\n点击此处查看代码图像\n\n```\nHey you!\n\nEnter your\
  \ first name: Inigo\nEnter your last name: Montoya\nHello Inigo Montoya! Your initials\
  \ are I. M.\n```\n\n`结束 6.0`\n\n本节详细说明了声明方法的方法，包含了参数或返回类型。列表 5.4 包含了这些概念的示例，输出 5.1](#ch05.xhtml_ch05out01)\
  \ 显示了结果。\n\n\n\n\n\n类似于 `GetUserInput()` 和 `GetInitials()`，具有返回类型的方法几乎总是包含一个或多个\
  \ `return` 语句，将控制权返回给调用者。一个 `return` 语句由 `return` 关键字后跟一个计算方法要返回值的表达式组成。例如，`GetInitials()`\
  \ 方法的 `return` 语句为 `return $\"{ firstName[0] }. { lastName[0] }.\";`。`return` 关键字后面的表达式（在此情况下是一个插值字符串）必须与方法声明的返回类型兼容。\n\
  \n如果一个方法具有返回类型，那么组成方法体的语句块不能有“不可触及的终点”（unreachable end point）。也就是说，不能有任何方法让控制权在不返回值的情况下“滑出”方法的末尾。通常，确保这一条件的最简单方法是将方法的最后一条语句变为\
  \ `return` 语句。然而，`return` 语句可以出现在方法实现末尾的其他位置。例如，方法实现中的 `if` 或 `switch` 语句可以在内部包含一个\
  \ `return` 语句；请参见列表 5.5 中的示例。\n\n**列表 5.5：方法结束前的 `return` 语句**\n\n点击此处查看代码图像\n\n\
  ```\nclass Program\n\n{\n  static bool MyMethod()\n  {\n      string command = ObtainCommand();\n\
  \      switch(command)\n      {\n          case \"quit\":\n              return\
  \ false;\n          // ... 省略，其他情况\n\n          default:\n              return true;\n\
  \      }\n  }\n\n}\n```\n\n（注意，`return` 语句会将控制权移出 `switch`，因此不需要 `break` 语句来防止在以\
  \ `return` 语句结束的 `switch` 区域发生非法穿透。）\n\n在列表 5.5 中，方法的最后一条语句不是 `return` 语句；而是 `switch`\
  \ 语句。然而，编译器可以推导出通过方法的每可能的代码路径都会导致 `return`，因此方法的终点是不可触及的。因此，即使该方法没有以 `return` 语句结束，它也是合法的。\n\
  \n如果特定的代码路径在 `return` 之后包含不可触及的语句，编译器将发出警告，指示额外的语句将永远不会执行。\n\n尽管 C# 允许方法拥有多个 `return`\
  \ 语句，但如果方法只有一个出口位置，而不是在方法的各种代码路径中散布多个 `return`，代码通常会更具可读性且更容易维护。\n\n将 `void` 指定为返回类型表示该方法没有返回值。因此，对方法的调用可能无法赋值给变量，也无法在调用处作为参数类型使用。`void`\
  \ 方法的调用只能作为语句使用。此外，在方法体内部，`return` 语句是可选的，当指定它时，`return` 关键字后面不能有任何值。例如，列表 5.4 中\
  \ `Main()` 的返回值为 `void`，方法内部没有 `return` 语句。然而，`DisplayGreeting()` 包含了一个（可选的）`return`\
  \ 语句，其后面没有跟跟任何返回的结果。\n\n尽管从技术上说，一个方法只能有一个返回类型，但该返回类型可以是元组（tuple）。因此，从 C# 7.0 开始，可以使用\
  \ C# 元组语法返回被封装为元组的多个值。例如，你可以声明一个 `GetName()` 方法，如列表 5.6 所示。\n\n`开始于 7.0`\n\n**列表\
  \ 5.6：使用元组返回多个值**\n\n点击此处查看代码图像\n\n```\nclass Program\n\n{\n  static string GetUserInput(string\
  \ prompt)\n  {\n      System.Console.Write(prompt);\n      return System.Console.ReadLine();\n\
  \  }\n  static (string First, string Last) GetName()                           \
  \    \n  {\n      string firstName, lastName;\n      firstName = GetUserInput(\"\
  Enter your first name: \");\n      lastName = GetUserInput(\"Enter your last name:\
  \ \");\n      return (firstName, lastName);\n  }\n\n  static public void Main()\n\
  \  {\n      (string First, string Last) name = GetName();                      \
  \       \n      System.Console.WriteLine($\"Hello { name.First } { name.Last }!\"\
  );\n  }\n\n}\n```\n\n从技术上说，我们仍然只返回一个数据类型，即 `ValueTuple<string, string>`。然而，实际上，你可以返回任何你喜欢的（最好是合理的）数量。\n\
  \n`结束于 7.0` `开始于 6.0`\n\n### 表达式体方法\n\n为了支持不带方法体正式形式的最简单方法声明，C# 6.0 引入了表达式体方法（expression\
  \ bodied methods），它们使用表达式而不是完整的方法体来声明。列表 5.4 中的 `GetFullName()` 方法提供了一个表达式体方法的示例：\n\
  \n点击此处查看代码图像\n\n```\nstatic string GetFullName( string firstName, string lastName)\
  \ =>\n```\n\n表达式体方法没有使用方法体典型的大括号，而是使用“赋值”运算符（=>，在 13 中完全引入）。表达式体方法是方法体的语法快捷方式。\n\
  \n`结束于 6.0`\n\n### `using` 指令\n\n完全限定的命名空间可能会变得非常长且冗肿。然而，可以将一个或多个命名空间的所有类型导入到文件中，以便在使用时无需限定。为了实现这一点，C#\
  \ 程序员包含一个 `using` 指令，通常位于文件的顶部。例如，在列表 5.7 中，`Console` 没有以 `System` 前缀。\n\n**列表 5.7：`using`\
  \ 指令示例**\n\n点击此处查看代码图像\n\n```\n// using 指令将命名空间的所有类型导入到整个文件\nusing System;\n\nclass\
  \ HelloWorld\n\n{\n  static void Main()\n  {\n      // 无需限定限定 Console\n      //\
  \ 因为上面的 using 指令\n      Console.WriteLine(\"Hello, my name is Inigo\");\n  }\n\n\
  }\n```\n\n列表 5.7 的结果出现在输出 5.2 中。\n\n**输出 5.2**\n\n点击此处查看代码图像\n\n```\nHello, my name\
  \ is Inigo\n```\n\n像 `using System` 这样的 `using` 指令不能让你在子命名空间声明的类型中省略 `System`。例如，如果你的代码访问来自\
  \ `System.Text` 命名空间的 `StringBuilder` 类型，你必须包含一个额外的 `using System.Text;` 指令，或者完全限定类型为\
  \ `System.Text.StringBuilder`，而不仅仅是 `Text.StringBuilder`。简而言之，`using` 指令不会导入任何嵌套命名空间的类型。频繁使用特定命名空间中的类型意味着为该命名空间添加\
  \ `using` 指令是一个好主意，而不是完全限定命名空间内的所有类型。因此，几乎所有的 C# 文件在顶部都包含了 `using System` 指令。\n\n\
  \n\n\n\n`using System` 指令的一个有趣特性是，字符串数据类型可以使用不同的大小写来识别：`String` 或 `string`。前者依赖于\
  \ `using System` 指令，而后者则使用 `string` 关键字。两者都是对 `System.String` 数据类型的有效 C# 引用，并且生成的公共中间语言\
  \ (CIL) 代码不受选择何种版本的影响。\n\n我个人更倾向于使用 `string` 关键字，但无论程序员选择哪种表示形式，项目中的代码理想情况下应该保持一致。\n\
  \n`Begin 6.0`\n\n### `using static` 指令\n\n`using` 指令允许你通过省略名称中的命名空间部分来缩写类型名称——使得对于指定命名空间内的任何类型，只需指定类型名称。相比之下，`using\
  \ static` 指令允许你从指定类型的任何成员中省略命名空间和类型名。例如，`using static System.Console` 指令允许你指定 `WriteLine()`，而不是完全限定的方法名\
  \ `System.Console.WriteLine()`。继续使用此示例，我们可以更新[列表 5.2] 以利用 `using static System.Console`\
  \ 指令来创建[列表 5.9]。\n\n**列表 5.9: `using static` 指令**\n\n[点击此处查看代码图像]\n\n```\nusing\
  \ static System.Console;\n\nclass HeyYou\n{\n  static void Main()\n  {\n      string\
  \ firstName;\n      string lastName;\n      WriteLine(\"Hey you!\");\n\n      Write(\"\
  Enter your first name: \");\n      firstName = ReadLine();\n\n      Write(\"Enter\
  \ your last name: \");\n      lastName = ReadLine();\n\n      WriteLine(\n     \
  \     $\"Your full name is { firstName } { lastName }.\");\n  }\n}\n```\n\n在这种情况下，代码的可读性并没有受到损失：`WriteLine()`、`Write()`\
  \ 和 `ReadLine()` 都明确关联到控制台指令。事实上，人们可以认为生成的代码比以前更简单、因此更清晰。\n\n然而，有时并非如此。例如，如果你的代码使用了具有重叠行为名称的类，例如文件上的\
  \ `Exists()` 方法和目录上的 `Exists()` 方法，那么在调用 `Exists()` 时，`using static` 指令可能会降低清晰度。同样，如果你编写的类拥有自己具有重叠行为名称的成员——例如\
  \ `Display()` 和 `Write()`——那么读者的理解可能会受到干扰。\n\n编译器是不允许这种歧义的。如果存在两个签名相同的成员（通过 `using\
  \ static` 指令或单独声明的成员），对它们的任何产生歧义的调用都会导致编译错误。\n\n`End 6.0`\n\n## 别名 (Aliasing)\n\n\
  `using` 指令还允许对命名空间或类型创建别名。别名是在 `using` 指令所作用的范围内使用的替代名称。使用别名的两个常见理由是消除两个同名类型的歧义，以及缩短长名称。在[列表\
  \ 5.10]中，`CountDownTimer` 别名被声明为引用 `System.Timers.Timer` 类型的方法。仅仅添加 `using System.Timers`\
  \ 指令不足以让代码避免完全限定 `Timer` 类型。原原因是 `System.Threading` 也包含一个名为 `Timer` 的类型；因此，在代码中使用中使用\
  \ `Timer` 将产生歧义。\n\n**列表 5.10: 声明类型别名**\n\n[点击此处查看代码图像]\n\n```\nusing System;\n\n\
  using System.Threading;                                  \n\nusing CountDownTimer\
  \ = System.Timers.Timer;              \n\nclass HelloWorld\n{\n  static void Main()\n\
  \  {\n      CountDownTimer timer;                              \n      // ...\n\
  \  }\n}\n```\n\n[列表 5.10] 使用了一个完全全新的名称 `CountDownTimer` 作为别名。然而，也可以将别名指定为 `Timer`，如[列表\
  \ 5.11] 所示。\n\n**列表 5.11: 声明同名的类型别名**\n\n[点击此处查看代码图像]\n\n```\nusing System;\n\n\
  using System.Threading;\n\n// 声明别名 Timer 以引用 System.Timers.Timer 以             \
  \  \n// 避免与 System.Threading.Timer 的代码歧义                     \nusing Timer = System.Timers.Timer;\
  \                                      \n\nclass HelloWorld\n{\n  static void Main()\n\
  \  {\n      Timer timer;                                                      \n\
  \      // ...\n  }\n}\n```\n\n由于有了别名指令，“Timer”不再是一个歧义的引用。此外，要引用 `System.Threading.Timer`\
  \ 类型，你必须完全限定该类型或定义一个不同的别名。\n\n### `Main()` 的返回值和参数\n\n到目前为止，可执行程序的 `Main()` 方法的仍然是最简单的声明。你没有包含任何参数或非\
  \ `void` 返回类型。`Main()` 方法还返回 `int` 而不是 `void`。这对于 `Main()` 声明是可选的，但如果使用，程序可以向调用者（如脚本或批处理文件）返回状态码。\n\
  \n运行时使用单个 `string` 数组将命令行参数传递给 `Main()`。获取参数只需要访问该数组，如[列表 5.12] 所示：\n\n1. 如果参数没有两个，则显示一个错误，指示必须提供\
  \ URL 和文件名。\n2. 两个参数的存在表示用户已提供 URL 和目标文件名。\n\n**列表 5.12: 传递命令行参数****\n\n[点击此处查看代码图像]\n\
  \n```\nusing System;\nusing System.IO;\nusing System.Net;\n\nclass Program\n{\n\
  \  static int Main(string[] args)\n  {\n      int result;                      \
  \                               \n      switch (args.Length)                   \
  \                         \n      {\n          default:\n              // 必须指定两个参数；给出错误\n\
  \              Console.WriteLine(\n                  \"ERROR:  You must specify\
  \ the \"\n                  + \"URL and the file name\");\n              Console.WriteLine(\n\
  \                  \"Usage: Downloader.exe <URL> <TargetFileName>\");\n        \
  \      result = 1;\n              break;\n          case 2:\n              WebClient\
  \ webClient = new WebClient();\n              webClient.DownloadFile(args[0], args[1]);\
  \                \n              result = 0;\n              break;             \
  \                                      \n      }\n      return result;         \
  \                                          \n  }\n}\n```\n\n[列表 5.12] 的结果出现在[输出\
  \ 5.4]中。\n\n**输出 5.4**\n\n[点击此处查看代码图像]\n\n```\n>Downloader.exe\n\nERROR:  You must\
  \ specify the URL to be downloaded\n\nDownloader.exe <URL> <TargetFileName>\n```\n\
  \n\n\n\n\n虽然所有的命令行参数都可以通过字符串数组传递给 `Main()`，但有时在 `Main()`get 的方法内部访问参数会更加方便。`System.Environment.GetCommandLineArgs()`\
  \ 方法返回的命令行参数数组的形式与 `Main(string[] args)` 将参数传递给 `Main()` 的形式相同。\n\n### 高级方法参数\n\n\
  到目前为止，本章的示例都是通过方法的返回值返回数据。本节将演示方法如何通过其方法参数返回数据，以及方法如何接受变数量的参数。\n\n### 值参数\n\n方法调用的参数通常是**按值传递**的，这意味着参数表达式的值被复制到目标参数中。例如，在列表\
  \ 5.13 中，`Main()` 调用 `Combine()` 时使用的每个变量的值都将被复制到 `Combine()` 方法的参数中。输出 5.5 显示了该列表的结果。\n\
  \n**列表 5.13：按值传递变量**\n\n点击此处查看代码图像\n\n```\nclass Program\n\n{\n\n  static void Main()\n\
  \  {\n      // ...\n      string fullName;\n      string driveLetter = \"C:\";\n\
  \      string folderPath  = \"Data\";\n      string fileName    = \"index.html\"\
  ;\n      fullName = Combine(driveLetter, folderPath, fileName);\n      Console.WriteLine(fullName);\n\
  \      // ...\n  }\n  static string Combine(\n      string driveLetter, string folderPath,\
  \ string fileName)\n  {\n      string path;\n      path = string.Format(\"{1}{0}{2}{0}{3}\"\
  ,\n          System.IO.Path.DirectorySeparatorChar,\n          driveLetter, folderPath,\
  \ fileName);\n      return path;\n  }\n}\n```\n\n**输出 5.5**\n\n```\nC:\\Data\\index.html\n\
  ```\n\n即使 `Combine()` 方法在返回之前为 `driveLetter`、`folderPath` 和 `fileName` 赋值为 `null`，`Main()`\
  \ 中对应的变量仍然会保持其原始值，因为变量在调用方法时被复制了。当调用栈在调用结束时展开时，复制的数据会被丢弃。\n\n引用类型变量的值顾如其所示，是指向存储对象关联数据位置的引用。运行时如何选择表示引用类型变量的值是运行时的实现细节；通常，它被表示为存储对象数据的内存位置的地址，但并不一定如此。\n\
  \n如果按值传递引用类型变量，则引用本身将从调用者复制到方法参数。结果是，目标方法无法更新调用者变量的值，但它可以更新引用所指向的数据。\n\n或者，如果方法参数是值类型，则值本身被复制到参数中，在被调用方法中更改参数将不会影响原始调用者的变量。\n\
  \n### 引用参数 (`ref`)\n\n考虑列表 5.14，它调用一个函数来交换两个值，以及输出 5.6，它显示了结果。\n\n**列表 5.14：按引用传递变量**\n\
  \n点击此处查看代码图像\n\n```\nclass Program\n\n{\n  static void Main()\n  {\n      // ...\n\
  \      string first = \"hello\";\n      string second = \"goodbye\";\n      Swap(ref\
  \ first, ref second);                                       \n      Console.WriteLine(\n\
  \          $@\"first = \"\"{ first }\"\", second = \"\"{ second }\"\"\" );\n   \
  \   // ...\n  }\n  static void Swap(ref string x, ref string y)                \
  \           \n  {\n      string temp = x;\n      x = y;\n      y = temp;\n  }\n\
  }\n```\n\n**输出 5.6**\n\n点击此处查看代码图像\n\n```\nfirst = \"goodbye\", second = \"hello\"\
  \n```\n\n赋值给 `first` 和 `second` 的值被成功交换。为了实现这一点，变量是**按引用传递的**。`Swap()` 调用与列表 5.13\
  \ 中 `Combine()` 调用之间显而区别是在参数的数据类型前面包含了 `ref` 关键字。该关键字更改了调用方式，使得作为参数的变量按引用传递，因此被调用方法可以使用新值更新原始调用者的变量。\n\
  \n当被调用方法将参数指定为 `ref` 时，调用者必须提供一个变量而不是值作为参数，并在传递的变量前面放置 `ref`。通过这样做，调用者显式地意识到目标方法可能会重新赋值与其接收到的任何\
  \ `ref` 参数相关的变量的值。此外，有必要初始化任何作为 `ref` 传递的局部变量，因为目标方法可以在不先给它们赋值的情况下从 `ref` 参数中读取数据。例如，在列表\
  \ 5.14 中，`temp` 被赋值为 `first` 的值，假设传递的 `first` 变量已由调用者初始化。实际上，`ref` 参数是变量的别名，而不是创建一个新变量。\n\
  \n### 输出参数 (`out`)\n\n如前所述，用 `ref` 的变量在传递给被调用方法之前必须赋值，因为被调用方法可能会从该变量读取。之前提供的“交换”示例必须对变量进行读写操作。然而，通常方法的方法图是向变量写入数据而不是从中读取。为了实现这一点，需要用\
  \ `out` 装饰符饰参数类型。这在列表 5.15 中的 `TryGetButton()` 方法中得到了演示，该方法返回字符对应的手机按钮。\n\n**列表\
  \ 5.15：输出传递变量**\n\n点击此处查看代码图像\n\n```\nclass ConvertToPhoneNumber\n\n{\n  static\
  \ int Main(string[] args)\n  {\n      if(args.Length == 0)\n      {\n          Console.WriteLine(\n\
  \              \"ConvertToPhoneNumber.exe <phrase>\");\n          Console.WriteLine(\n\
  \              \"'_' indicates no phone button\");\n          return 1;\n      }\n\
  \      foreach(string word in args)\n      {\n          foreach(char character in\
  \ word)\n          {\n              if(TryGetButton(character, out char button))\n\
  \              {\n                  Console.Write(button);\n              }\n  \
  \            else\n              {\n                  Console.Write('_');\n    \
  \          }\n          }\n      }\n      Console.WriteLine();\n      return 0;\n\
  \  }\n  static bool TryGetButton(char character, out char button)\n  {\n      bool\
  \ success = true;\n      switch( char.ToLower(character) )\n      {\n          case\
  \ '1':\n              button = '1';\n              break;\n          case '2': case\
  \ 'a': case 'b': case 'c':\n              button = '2';\n              break;\n\
  \          // ...\n          case '-':\n              button = '-';\n          \
  \    break;\n          default:\n                // Set the button to indicate an\
  \ invalid value\n                button = '_';\n              success = false;\n\
  \              break;\n      }\n      return success;\n  }\n}\n```\n\n输出 5.7 显示了列表\
  \ 5.15 的结果。\n\n**输出 5.7**\n\n```\n>ConvertToPhoneNumber.exe CSharpIsGood\n\n274277474663\n\
  ```\n\n\n\n\n\n在此示例中，如果 `TryGetPhoneButton()` 方法能够成功确定 `character` 对应的手机按钮，它将返回\
  \ `true`。该函数还通过使用带有 `out` 修饰符的 `button` 参数返回相应的按钮。\n\n`out` 参数在功能上与 `ref` 参数相同；唯一的区别在于语言对读取和写入别名变量所施加的强制要求不同。每当参数被标记为\
  \ `out`，编译器就会检查在方法中所有正常返回的代码路径（即不会抛出异常的代码路径）中，该参数是否都已设置值。例如，如果代码在某些执行路径中没有给 `button`\
  \ 赋值，编译器将发出错误，指示代码未初始化 `button`。显示代码列表 5.15 将 `button` 赋值为下划线字符，因为即使无法确定正确的手机按钮，给它赋值仍然是必要的。\n\
  \n在使用 `out` 参数工作时，一个常见的编码错误是在使用该变量之前忘记声明 `out` 变量。从 C# 7.0 开始，可以在调用函数时内联声明 `out`\
  \ 变量。显示代码列表 5.15 使用语句 `TryGetPhoneButton(character, out char button)` 利用了这一特性，无需事先声明\
  \ `button` 变量。在 C# 7.0 之前，必须先声明 `button` 变量，然后使用 `TryGetPhoneButton(character, out\
  \ button)` 调用函数。\n\n另一个 C# 7.0 的特性是可以完全丢弃 `out` 参数的能力。例如，如果你只想知道某个字符是否是有效的手机按钮，而不需要实际返回数值，你可以使用下划线丢弃\
  \ `button` 参数：`TryGetPhoneButton(character, out _ )`。\n\n在 C# 7.0 的元组语法出现，方法的开发者可能会声明一个或多个\
  \ `out` 参数，以绕过“方法只能有一个返回类型”的限制；需要返回两个值的方法可以通过正常返回一个值（作为方法的返回值），并通过将第二个值写入作为 `out`\
  \ 参数传递的别名变量中来返回第二个值。虽然这种模式既常见又合法，但通常有更好的方法来实现该目标。例如，如果你正在考虑从方法返回两个或多个值，并且可以使用 C#\
  \ 7.0，那么可能优于使用 C# 7.0 元组语法。在此之前，考虑编写两个方法（每个值一个方法），或者仍然使用 `System.ValueTuple` 类型但不使用\
  \ C# 7.0 语法。\n\n### 7.0\n\n#### Note\n每一条正常代码路径必须导致所有 `out` 参数的赋值。\n\n`Begin 7.2`\n\
  \n#### 只读引用传递 (`in`)\n\n在 C# 7.2 中，增加了对以只读方式通过引用传递值类型的支持。与其将值类型传递给函数以便对其更改，不如引入了只读引用传递：它允许通过引用方式传递值类型，这样不仅会发生值类型的拷贝，而且被调用的方法无法更改它。例如，点击此处查看代码\n\
  \n```\nint Method(in number) { ... }\n```\n\n使用 `in` 修饰符后，任何对 `number` 重新赋值的尝试都将导致编译错误。\n\
  \n#### 7.2 引用返回\n\n另一个 C# 7.0 特性是返回引用的能力。考虑显示代码列表 5.16 中的以下示例，它返回了一个字段的引用：\n\n```c\n\
  class Thing {\n    string _Text = \"Inigo Montoya\";\n\n    ref string Text { get\
  \ { return ref _Text; } }\n}\n```\n\n通过返回引用，调用者能够更新变量，如显示代码列表 5.15 所示。\n\n```c\n\
  public class Example {\n    byte[] image = new byte[10];\n\n    for (int counter\
  \ = 0; counter < image.Length; counter++) {\n        if (image[counter] == 0) {\n\
  \            image[counter] = 1;\n        }\n    }\n\n    public ref byte[] GetImage()\
  \ {\n        return ref image;\n    }\n}\n```\n\n对引用返回有几个需要注意的限制：\n\n- 如果你返回的是引用，你显然必须返回它。这意味着在显示代码列表\
  \ 5.16 的示例中，即使不存在像素，你仍然需要返回一个引用。唯一的解决办法是抛出异常。相比之下，引用参数的方法允许你保持参数不变并返回一个表示成功的 `bool`\
  \ 值。\n\n- 对象生命周期限制：(1) 对象引用在仍被引用时不应被垃圾回收，(2) 它们在不再有引用时不应消耗内存。为了执行这些限制，你只能返回以下内容：\n\
  \    - 字段或数组元素\n    - 其他属性或函数\n    - 作为参数传递的引用\n\n例如，如果图像存储在字段中，你可以通过引用方式返回该字段：点击此处查看代码\n\
  \n```c\nbyte[] _Image;\n\npublic ref byte[] Image { get { return _Image; }\n```\n\
  \n此外，`ref` 局部变量被初始化为指向特定的变量，并且不能被修改为指向不同的变量。有几个需要注意的特征：\n\n- 在声明引用局部变量时，需要初始化。这涉及将其赋值为函数的\
  \ `ref` 返回值或变量的引用：\n  ```c\n  ref string text; // Error\n  ```\n\n- 尽管在 C# 7.0 中可以声明引用局部变量，但不允许声明\
  \ `ref` 类型的字段：\n  ```c\n  class Thing { ref string _Text; /* Error }\n  ```\n\n\
  - 你不能为自动实现的属性声明通过引用类型：\n  ```c\n  class Thing { ref string Text { get;set; } /*\
  \ Error }\n  ```\n\n- 返回引用的属性是允许的：\n  ```c\n  class Thing {\n      string _Text\
  \ = \"Inigo Montoya\";\n      ref string Text { get { return ref _Text; } }\n  }\n\
  \  ```\n\n- 引用局部变量不能用值（如 `null` 或常量）初始化。它必须从返回引用的成员或局部变量、字段或数组元素赋值。\n\n\n\n\n\n\
  ```\nref int number = 42;  // ERROR\n```\n\n`结束 7.0`\n\n### 参数数组 (`params`)\n\n\
  在之前的示例中，必须传递的参数数量是由目标方法声明中声明的参数数量固定的。然而，有时如果参数的数量可以是可变的，将会非常方便。请考虑一下列表 5.13 中的 `Combine()`\
  \ 方法。在该方法中，你传递了驱动器器、文件夹路径和文件名。如果路径包含多个文件夹，且调用者希望方法连接额外的文件夹以形成完整路径怎么办？也许最好的选择是传递一个字符串数组作为文件夹。然而，这将使调用代码变得稍微复杂，因为有必要构造一个数组来作为参数传递。\n\
  \n为了方便此类方法的调用者，C# 提供了一个关键字，允许在调用代码中更改参数的数量，而不是由目标方法来设置。在讨论方法声明之前，让我们先观察在 `Main()`\
  \ 中声明的调用代码，如列表 5.17 所示。\n\n**列表 5.17: 传递可变参数列表**\n\n点击此处查看代码图像\n\n```assembly\n\
  using System;\n\nusing System.IO;\n\nclass PathEx\n{\n\n  static void Main()\n \
  \ {\n\n      string fullName;\n      // ...\n\n      // 使用四个参数调用 Combine()     \
  \                          \n      fullName = Combine(                         \
  \                        \n          Directory.GetCurrentDirectory(),          \
  \                      \n          \"bin\", \"config\", \"index.html\");       \
  \                          \n\n      Console.WriteLine(fullName);\n\n      // ...\n\
  \n      // 仅使用三个参数调用 Combine()                          \n      fullName = Combine(\
  \                                                  \n          Environment.SystemDirectory,\
  \                                     \n          \"Temp\", \"index.html\");   \
  \                                        \n      Console.WriteLine(fullName);\n\n\
  \      // ...\n      // 使用数组调用 Combine()                                      \n\
  \      fullName = Combine(                                                  \n \
  \         new string[] {                                                   \n  \
  \            \"C:\\\\\", \"Data\",                                             \
  \ \n              \"HomeDir\", \"index.html\"} );                              \
  \    \n      Console.WriteLine(fullName);\n\n      // ...\n  }\n\n  static string\
  \ Combine(params string[] paths)                             \n  {\n      string\
  \ result = string.Empty;\n      foreach (string path in paths)\n      {\n      \
  \    result = Path.Combine(result, path);\n      }\n\n      return result;\n  }\n\
  \n}\n```\n\n输出 5.8 显示了列表 5.17 的结果。\n\n**输出 5.8**\n\n点击此处查看代码图像\n\n```\nC:\\Data\\\
  mark\\bin\\config\\index.html\n\nC:\\WINDOWS\\system32\\Temp\\index.html\n\nC:\\\
  Data\\HomeDir\\index.html\n```\n\n在第一次调用 `Combine()` 时，指定了四个参数。第二次调用仅包含三个参数。在最后一次调用中通过数组传递了单个参数。换句话说，`Combine()`\
  \ 方法接受变数量的参数——表现为用逗号分隔的任意数量的字符串参数，或者单个字符串数组。前者语法被称为方法调用的*展开*形式，而后者形式被称为*普通*形式。\n\
  \n为了允许使用任一形式调用，`Combine()` 方法执行了以下操作：\n\n1. 在方法声明中将 `params` 置于最后一个参数之前\n2. 将最后一个参数声明为数组\n\
  \n通过**参数数组**声明，可以作为 `params` 数组的成员来访问每个对应的参数。在 `Combine()` 方法的实现中，你遍历了 `paths` 数组的元素并调用\
  \ `System.IO.Path.Combine()`。该方法会自动组合路径的部分，并恰当地使用特定于平台的目录分隔符。注意，`PathEx.Combine()`\
  \ 与 `Path.Combine()` 相同，但 `PathEx.Combine()` 处理的是变数量的参数，而不是简单的两个。\n\n参数数组有几个值得注意的特征：\n\
  \n*   参数数组不是方法中的唯一参数。\n*   参数数组必须是方法声明中的最后一个参数。由于只有最后一个参数可以是参数数组，因此一个方法不能有多个参数数组。\n\
  *   调用者可以指定对应参数参数的零个参数，这将导致传递一个零个元素的数组作为参数数组。\n*   参数数组是类型安全的：给定的参数必须与参数数组的元素类型兼容。\n\
  *   调用者可以使用显式数组而不是逗号分隔的参数列表。生成的 CIL 代码是相同的。\n*   如果目标方法的实现需要最少数量的参数，这些参数应该显式出现在方法声明中，从而强制产生编译错误，而不是在缺少必要参数时依赖运行时错误处理。例如，如果你有一个需要一个或多个整数参数的方法，请将方法声明为\
  \ `int Max(int first, params int[] operands)` 而不是 `int Max(params int[] operands)`，以便确保至少向\
  \ `Max()` 传递一个值。\n\n使用参数数组，你可以向方法传递相同类型的变数量参数。本章稍后出现的“方法重载””部分讨论了支持不一定相同类型的变数量参数的方法。\n\
  \n顺便说，路径 `Combine()` 函数是一个人为的示例，因为实际上 `System.IO.Path.Combine()` 是一个已经重载以支持参数数组的现有函数。\n\
  \n### 递归\n\n**递归**调用方法或使用**递归**实现方法是指方法调用自身。递归有时是实现特定算法最简单的方法。列表 5.18 统计目录及其子目录中所有\
  \ C# 源文件 (`*.cs`) 的行数。\n\n**列表 5.18: 给定目录下统计 `*.cs` 文件的行数**\n\n点击此处查看代码图像\n\n\n\n\
  \n\n```cs\n#nullable enable\n\nusing System.IO;\n\npublic static class LineCounter\n\
  {\n\n  // 使用第一个参数作为要搜索的目录\n  // 或者默使用当前目录\n  public static void Main(string[] args)\n\
  \  {\n      int totalLineCount = 0;\n      string directory;\n      if (args.Length\
  \ > 0)\n      {\n          directory = args[0];\n      }\n      else\n      {\n\
  \          directory = Directory.GetCurrentDirectory();\n      }\n      totalLineCount\
  \ = DirectoryCountLines(directory);\n      System.Console.WriteLine(totalLineCount);\n\
  \    }\n  static int DirectoryCountLines(string directory)                     \
  \ \n  {\n      int lineCount = 0;\n      foreach (string file in\n          Directory.GetFiles(directory,\
  \ \"*.cs\"))\n      {\n            lineCount += CountLines(file);\n        }\n \
  \     foreach (string subdirectory in\n          Directory.GetDirectories(directory))\n\
  \      {\n          lineCount += DirectoryCountLines(subdirectory);            \
  \    \n      }\n      return lineCount;\n  }\n\n  private static int CountLines(string\
  \ file)\n  {\n      string? line;\n      int lineCount = 0;\n      FileStream stream\
  \ =\n          new FileStream(file, FileMode.Open);4\n      StreamReader reader\
  \ = new StreamReader(stream);\n      line = reader.ReadLine();\n       while(line\
  \ is object)\n       {\n           if (line.Trim() != \"\")\n           {\n    \
  \           lineCount++;\n           }\n           line = reader.ReadLine();\n \
  \      }\n      reader.Close();  // 自动关闭流\n      return lineCount;\n  }\n}\n```\n\
  \n4. 这段代码可以使用 `using` 语句进行改进——我避免使用这种构造是因为因为它还没有引入。\n\n输出 5.9 显示了列表 5.18 的结果。\n\n\
  **输出 5.9**\n\n```\n104\n```\n\n程序首先通过将第一个命令行参数传递给 `DirectoryCountLines()`，或者在未提供参数时使用当前目录。该方法首先遍历当前目录中的所有文件，并汇总每个文件的源代码行数。在处理完目录中的每个文件后，代码通过将子目录传回\
  \ `DirectoryCountLines()` 方法并使用该目录重新运行方法来处理每个子目录。相同的过程递归地通过每个子目录重复，直到没有更多目录需要处理。\n\
  \n不熟悉递归的读者起初可能会感到困惑。无论如何，这通常认为是最简单的代码模式，特别是对于像文件系统这样的分层类型数据而言。然而，尽管这可能是可读性最好的方法，但通常不是最快的实现。如果性能成为问题，开发者应该寻找递归实现的替代方案。这种选择通常取决于在可读性和性能之间取得平衡。\n\
  \n### 方法重载\n\n列表 5.18 调用了 `DirectoryCountLines()`，该方法统计了 `*.cs` 文件的行数。然而，如果你想统计\
  \ `*.h`/`*.cpp` 文件或 `*.vb` 文件中的代码，`DirectoryCountLines()` 将无法工作。相反，你需要一个可以接受文件扩展名的方法，但保留现有的方法定义，以便它默认处理\
  \ `*.cs` 文件。\n\n类中的所有方法都必须具有唯一的签名，C# 通过方法名、参数数据类型或参数数量的差异来定义唯一性。这不包括方法的返回数据类型；定义两个仅在返回数据类型上不同的方法会导致编译错误。即使返回类型是两个不同的元组也是如此。当一个类具有两个或多个同名方法且重载方法之间的参数数量和/或数据类型存在差异时，就会发生`方法重载`（Method\
  \ overloading）。\n\n#### 备注\n\n只要方法名、参数数据类型或参数数量存在差异，该方法就被认为是唯一的。\n\n方法重载是`操作多态`（operational\
  \ polymorphism）的一种。多态发生在相同的逻辑操作由于数据的不同而呈现出多种（“poly”）形式（“morphs”）时。例如，调用 `WriteLine()`\
  \ 并带上格式字符串以及一些参数的实现方式，与调用 `WriteLine()` 并指定整数的实现不同。然而，从逻辑上讲，对于调用者来说，方法负责写入数据，内部实现如何发生某种程度上并不重要。列表\
  \ 5.19 提供了一个示例，输出 5.10 显示了结果。\n\n**列表 5.19：使用重载统计 cs 文件内的行数**\n\n点击此此处查看代码图片\n\n\
  ```cs\n#nullable enable\n\nusing System.IO;\n\npublic static class LineCounter\n\
  {\n\n  public static void Main(string[] args)\n  {\n      int totalLineCount;\n\
  \      if (args.Length > 1)\n      {\n          totalLineCount =               \
  \                                       \n              DirectoryCountLines(args[0],\
  \ args[1]);                            \n      }\n      if (args.Length > 0)\n \
  \     {\n          totalLineCount = DirectoryCountLines(args[0]);              \
  \          \n      }\n      else\n      {\n          totalLineCount  = DirectoryCountLines();\
  \                              \n      }\n      System.Console.WriteLine(totalLineCount);\n\
  \  }\n  static int DirectoryCountLines()                                       \
  \       \n  {\n      return DirectoryCountLines(\n          Directory.GetCurrentDirectory());\n\
  \  }\n  static int DirectoryCountLines(string directory)                       \
  \       \n  {\n      return DirectoryCountLines(\n          directory, \"*.cs\"\
  );\n  }\n  static int DirectoryCountLines(                                     \
  \          \n      directory, string extension)\n  {\n      int lineCount = 0;\n\
  \      foreach (string file in\n          Directory.GetFiles(directory, extension))\n\
  \      {\n          lineCount += CountLines(file);\n      }\n      foreach (string\
  \ subdirectory in\n          Directory.GetDirectories(directory))\n      {\n   \
  \       lineCount += DirectoryCountLines(subdirectory);\n      }\n      return lineCount;\n\
  \  }\n\n  private static int CountLines(string file)\n  {\n      int lineCount =\
  \ 0;\n      string? line;\n      FileStream stream =\n          new FileStream(file,\
  \ FileMode.Open);5\n      StreamReader reader = new StreamReader(stream);\n    \
  \  line = reader.ReadLine();\n      while(line is object)\n      {\n          if\
  \ (line.Trim() != \"\")\n          {\n              lineCount++;\n          }\n\
  \          line = reader.ReadLine();\n      }\n      reader.Close();  // 自动关闭流\n\
  \      return lineCount;\n  }\n}\n```\n\n5. 这段代码可以使用 `using` 语句进行改进——我们避免使用这种构造是因为它还没有引入。\n\
  \n**输出 5.10**\n\n```\n>LineCounter.exe .\\ *.\n\n28\n```\n\n方法重载的效果为调用方法提供了可选的方式。正如在\
  \ `Main()` 内部所示，你可以传递或不传递搜索目录和文件扩展名来调用 `DirectoryCountLines()` 方法。\n\n注意，`DirectoryCountLines()`\
  \ 的无参数实现被更改为调用单参数版本 `int DirectoryCountLines (string directory)`。这是实现重载方法时的一种常见模式。其核心思想是开发者只在一个方法中实现核心逻辑，而所有其他重载方法都调用该单一方法。如果核心实现发生变化，只需要在一个位置进行修改，而不是在每个实现中进行修改。这种模式在通过方法重载来启用在编译时无法确定值的可选参数（因此无法通过可选参数来指定）时尤为流行。\n\
  \n#### 备注\n\n\n\n\n\n将核心功能放在单一方法中并让所有其他重载方法都调用它，这意味着你只需要在核心方法中更改实现，其他方法会自动采用这些更改。\n\
  \n`Begin 4.0`\n\n### 可选参数\n\nC# 语言设计人员还添加了对`可选参数`的支持.^(6) 通过在方法声明中允许参数与常量值关联，可以在调用方法时无需为该方法的每个参数都传递参数（参见列表\
  \ 5.20）。\n\n6. 在 C# 4.0 中引入。\n\n**列表 5.20: 带有可选参数的方法**\n\n点击此处查看代码图像\n\n```\n#nullable\
