  表 24.1：CLI 的实现\n表 24.2：常见的 C# 相关缩写\n\n# 前言\n\n欢迎来到 C# 书籍梦寐以求的最古老且受信任的系列之一，甚至可能远于此。Mark\
  \ Michaelis 的《Essential C#》一书一直一直是经典，但当我第一次认识 Mark 时，它还未面世。\n\n2005 年，当 `LINQ`（集成语言查询）发布时，我刚刚加入微软，并有幸参加了\
  \ PDC 大会的这一盛事。尽管我对这项技术几乎没有任何贡献，但我完全沉浸在那种氛围中。会议现场座无虚席，宣传单页像热火炉一样被抢购：对于 C# 和 .NET\
  \ 来说，那是重大的时刻。\n\n不过，在操作实验区域要安静得多，那里人们可以按照编写好的演示亲自尝试技术预览。在那里，我在那里遇到了 Mark。\n\n\n\n\
  \n\n这些正是让 Mark 成为如此优秀作者的特质。他直击本质，沟通极其诚实，不加修饰，并且实用价值和现实世界问题有着敏锐的眼光。Mark 在提供清晰度和说明方面非常有天赋，没有人比他更能帮助你掌握\
  \ C# 8.0 了。\n\n阅读愉快！\n\n—Mads Torgersen,\nC# 首席设计师，\nMicrosoft\n\n# 前言\n\n在整个软件工程史上，编写计算机程序的方法经历了几次范式转移，每一次转移都通过增加代码组织性和降低复杂性建立在之前的基础之上。本书将带你经历这些同样的范式转移。\n\
  \n起始章节将带你了解`顺序编程结构`，其中语句按照编写顺序执行。这种模型的问题在于，复杂度随着需求的增加而呈指数级增长。为了降低这种复杂性，代码块被移动到方法中，形成了`结构化编程模型`。这允许你在程序中的多个位置调用同一个代码块，而无需重复代码。然而，即使有了这种结构，程序很快就会变得难以管理，需要进一步的抽象。在第\
  \ 6 章中引入的面向对象编程正是这种回应。在随后的章节中，你将学习其他方法，例如基于接口的编程、LINQ（以及它对集合 API 的变换），以及最终通过属性在第\
  \ 18 章中实现的声明式编程的原始形式。\n\n本书有三个主要功能：\n\n*   它提供了对 C# 语言的全面覆盖，超越了教程范围，提供了一个让你能够开始进行有效软件开发项目的基础。\n\
  *   对于已经熟悉 C# 的读者，本书提供了对一些更复杂编程范式的见解，并对语言最新版本 C# 8.0 以及 `.NET Framework 4.8`/`.NET\
  \ Core 3.1` 中引入的特性进行了深度介绍。\n*   即使在你精通了该语言后，它也可以作为一份持久的参考书。\n\n成功学习 C# 的关键是尽早开始编码。不要等到你成为理论上的“专家”；立即开始编写软件。作为迭代开发的信者，我希望这本书能让即使是初学者也能在第\
  \ 2 章结束时开始编写基础的 C# 代码。\n\n本书没有涵盖许多主题。你不会在这里找到关于 ASP.NET、`Entity Framework`、`Xamarin`、智能客户端开发、分布式编程等主题的内容。尽管这些主题与\
  \ `.NET` 相关，但要充分介绍这些主题需要专门的书籍。幸运的是，Addison-Wesley 的 Microsoft Windows 开发系列提供了关于这些主题的丰富内容。《Essential\
  \ C# 8.0》专注于 C# 本以及基类库中的类型。阅读本书将使你准备好专注于并培养在该系列其他部分涵盖任何领域的专业知识。\n\n## 本书的目标读者\n\n\
  我在本书中面临的挑战是，如何在让高级开发者保持专注的同时，不通过使用 `assembly`、`link`、`chain`、`thread` 和 `fusion`\
  \ 等词汇而疏远初学者（尽管这些词汇听起来更适合铁匠而不是程序员）。本书的主要受众是希望在自己的武器库中增加另一种语言的经验丰富的开发者。然而，我精心编编写了这本书，旨在为各个水平的开发者提供重大价值。\n\
  \n*   **初学者：** 如果你是编程的新手，这本书将作为一份资源，帮助你从初级程序员过渡到一名 C# 开发者，能够轻松应对交给你的任何 C# 编程任务。这本书不仅教你语法，还训练你良好的编程习惯，这些习惯将贯穿你的整个编程生涯。\n\
  *   **结构化程序员：** 正就像通过沉浸来学习外语言最好一样，在了解所有细节之前开始使用计算机语言是最有效的。沿着这条思路，本书从一个教程开始，这对于熟悉结构化编程的人来说是很舒服的，到第\
  \ 5 章结束时，这一类别的开发者应该在编写基础控制流程序时感到自如。然而，C# 开发者卓越的关键不在于记忆语法。要从简单程序过渡到企业级开发，C# 开发者必须以对象及其关系上进行原生思考。为此，第\
  \ 6 章的“初学者主题”引入了类和面向对象开发。`C`、`COBOL` 和 `FORTRAN` 等历史性结构化语言的角色仍然意义重大，但正在萎缩，因此软件工程师熟悉面向对象开发是很有必要的。C#\
  \ 是进行这种转变的理想语言，因为它在设计时就将面向对象开发作为其核心原则之一。\n*   **基于对象和面向对象的开发者：** `C++`、`Java`、`Python`、`TypeScript`、`Visual\
  \ Basic` 和 `Java` 程序员属于这一类。你们中的许多已经完全习惯了分号和大括号。扫一眼第 1 章中的代码就会发现，C# 的核心与你熟悉的其他 `C-`\
  \ 和 `C++` 风格的语言相似。\n*   **C# 专业人士：** 对于已经精通 C# 的人，本书为不常用的语法提供了方便的参考。此外，它还对很少涉及的语言细节和微妙之处提供了见解。最重要的是，它提出了编写健壮且可维护代码的指南和模式。这本书还有助于向他人教授\
  \ C#。随着 C# 3.0 到 8.0 的出现，一些最显著的增强包括：\n    *   字符串插值（参见第 2 章)\n    *   隐式类型变量（参见第\
  \ 3 章)\n    *   元组（参见第 3 章)\n    *   可空引用类型（参见第 3 章)\n    *   模式匹配（参见第 4 章)\n  \
  \  *   扩展方法（参见第 6 章)\n    *   部分方法（参见第 6 章)\n    *   默认接口成员（参见第 8 章)\n    *   匿名类型（参见第\
  \ 12 章)\n    *   泛型（参见第 12 章)\n    *   Lambda 语句和表达式（参见第 13 章)\n    *   表达式树（参见第\
  \ 13 章)\n    *   标准查询运算符（参见第 15 章)\n    *   查询表达式（参见第 16 章)\n    *   使用任务并行库和 `async`\
  \ 进行多线程编程（参见第 20 章)\n    *   使用 PLINQ 进行并行查询处理（参见第 21 章)\n    *   并发集合（参见第 22 章)\n\
  \n\n\n\n\n*Essential C# 8.0* 中包含的一个较重要的改进是 C# 编码指南，如下节自第 17 章的示例所示：\n\n这些指南是区分了解语法的程序员与能够根据情况识别编写最有效代码的专家的关键。这种专家不仅能让代码通过，而且在遵循最佳实践的同时完成，最大限度地减少错误并确保在未来长时间内具有良好的可维护性。编码指南强调了读者希望确保纳入其开发中的一些核心原则。访问\
  \ [`IntelliTect.com/Guidelines`](https://IntelliTect.com/Guidelines) 获取所有指南的最新列表。\n\
