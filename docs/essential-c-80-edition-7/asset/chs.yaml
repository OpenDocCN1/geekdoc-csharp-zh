  \ 获取）默认配置为与 .NET Core 配合。\n\n### 注意事项\n\n在整书中，`.NET framework`（小写）泛指由 .NET 实现支持的框架。相比之下，`Microsoft\
  \ .NET Framework` 指仅运行在 Microsoft Windows 上的特定 .NET 框架实现，由微软于 2001 年*首次*发布。\n\n\
  ### 应用程序编程接口\n\n在如 `System.Console` 等数据类型上找到的所有方法（或更泛指的成员）都定义了 `System.Console`\
  \ 的应用程序编程接口 (**API**）。API 定义了软件程序如何与组件交互。因此，它不仅存在于单个数据类型中，而且更泛地存在；一组数据类型的所有 API\
  \ 的组合被认为创建了该组件集的 API。例如，在 .NET 中，程序集中的所有类型（以及这些类型中的成员）被认为组成了程序集的 API。同样，给定一组程序集（例如在\
  \ .NET Core 或 Microsoft .NET Framework 中找到的那些），程序集的集合形成了一个更大的 API。通常，这个较大的 API 组被称为**框架**（framework）——因此在引用\
  \ .NET Core 或 Microsoft .NET Framework 包含的所有程序集暴露的 API 时，使用了 .NET `framework` 术语。泛而言，API\
  \ 包含了针对一组组件编程的接口和协议（或指令）集合。事实上，在 .NET 中，协议本身就是 .NET 程序集执行的规则。\n\n### C# 和 .NET 版本控制\n\
  \n由于 .NET 框架的开发周期与 C# 语言的开发周期不同，底层 .NET 框架的版本与相应的 C# 语言版本最终会有不同的数字。这意味着，如果你使用 C#\
  \ 5.0 编译器进行编译，它默认将针对 Microsoft .NET Framework 4.6 版本编译，例如。表 1.4 是对 Microsoft .NET\
  \ Framework 和 .NET Core 的 C# 和 .NET 发布版本的简单概述。\n\n`Begin 2.0` `Begin 3.0` `Begin\
