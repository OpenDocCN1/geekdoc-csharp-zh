  \ bool> isFortyTwo =\n  x => 42 == (number = x);\n\nif (isFortyTwo(42))\n{\n   \
  \ // ERROR: Use of unassigned local variable\n\n    System.Console.Write(number);\n\
  }\n``` |\n\n**表 13.1: Lambda 表达式注意事项与示例**\n\n`3.0` `从 2.0 开始`\n\n### 匿名方法 (Anonymous\
  \ Methods)\n\nC# 2.0 不支持 Lambda 表达式。相反，C# 2.0 使用了一种名为`匿名方法`的语法。匿名方法类似于语句 Lambda，但缺少了许多使\
  \ Lambda 变得如此紧凑的特性。匿名方法必须显式地为每个参数指定类型，并且必须有一个语句块。匿名方法不是在参数列表和代码块之间使用 Lambda 运算符\
  \ `=>`，而是在参数列表之前放置关键字 `delegate`，以强调该匿名方法必须转换为委托类型。插列表 13.17 显示了将列表 13.7、13.12 和\
  \ 13.15 中的代码重写为使用匿名方法。\n\n**列表 13.17：在 C# 2.0 中传递匿名方法**\n\n点击此处查看代码图像\n\n```csharp\n\
  \ // ...\n\n   BubbleSort(items,                                               \
  \   \n       delegate(int first, int second)                                \n \
  \      {                                                              \n       \
  \   return first < second;                                      \n       }     \
  \                                                          \n   );             \
  \                                                    \n   // ...\n```\n\n遗憾的是，在\
  \ C# 3.0 及更高版本中，有两种非常相似的方法定义匿名函数。\n\n然而，匿名方法确实支持 Lambda 表达式不支持的一个小特性：在某些情况下，匿名方法可以完全省略其参数列表。\n\
  \n`结束 2.0` `从 4.0 开始` `3.0`\n\n### 委托不具有结构相等性 (Structural Equality)\n\n.NET 中的委托类型不表现出`结构相等性`。这意味着，你不能将一个委托类型的对象引用转换为不相关的委托类型，即使两个委托的正式参数和返回类型完全相同。例如，你不能将\
  \ `Comparer` 的引用赋值给类型为 `Func<int, int, bool>` 的变量，尽管这两个委托类型表示接受两个 `int` 参数并返回 `bool`\
  \ 的方法。\n\n在泛型委托类型上允许引用转换，是 C# 4.0 增加协变（covariant）和逆变（contravariant）转换的关键动机场景。（另一个是支持对\
  \ `IEnumerable<out T>` 的协变性。）\n\n许多人发现委托的逆变令人困惑。记住这一点可能有所帮助：一个可以处理每个对象的操作可以被用作处理任何字符串的操作。同样，对于\
  \ `Func<int, int, bool>`，你可以说 `f = c.Invoke`。\n\n列表 13.18 显示了委托协变和逆变的示例。\n\n**列表\
  \ 13.18：在委托中使用变性**\n\n点击此处查看代码图像\n\n```csharp\n// 逆变 (Contravariance)\n\nAction<object>\
  \ broadAction =\n  (object data) =>\n  {\n      Console.WriteLine(data);\n  };\n\
  \nAction<string> narrowAction = broadAction;\n\n// 协变 (Covariance)\n\nFunc<string>\
  \ narrowFunction =\n  () => Console.ReadLine();\n\nFunc<object> broadFunction =\
  \ narrowFunction;\n\n// 逆变与协变的结合\n\nFunc<object, string?> func1 =\n  (object data)\
  \ => data.ToString();\n\nFunc<string, object?> func2 = func1;\n```\n\n`3.0`\n\n\
  列表的最后部分将变变概念结合在一个示例中，展示了当同时涉及 `in` 和 `out` 类型参数时，它们如何同时发生。\n\n`结束 4.0`\n\n**列表 13.19：编译器为\
  \ Lambda 表达式生成的 CIL 等效 C# 代码**\n\n点击此处查看代码图像\n\n\n\n\n\n```cs\nclass DelegateSample\n\
  \n{\n\n  // ...\n\n  static void Main(string[] args)\n\n  {\n      int i;\n    \
  \  int[] items = new int[5];\n      for (i = 0; i<items.Length; i++)\n      {\n\
  \          Console.Write(\"Enter an integer:\");\n          items[i] = int.Parse(Console.ReadLine());\n\
  \      }\n      BubbleSort(items,                                              \
  \              \n          DelegateSample.__AnonymousMethod_00000000);         \
  \                     \n      for (i = 0; i < items.Length; i++)\n      {\n    \
  \      Console.WriteLine(items[i]);\n      }\n  }\n  private static bool __AnonymousMethod_00000000(\
  \                                  \n      int first, int second)              \
  \                                         \n  {                                \
  \                                                \n      return first < second;\
  \                                                       \n  }                  \
  \                                                              \n}\n```\n\n`3.0`\n\
  \n在此示例中，编译器将匿名函数转换为一个单独声明的静态方法，然后将该方法实例化为委托并作为参数传递。意料不用的是，编译器生成的代码看起来与列表 13.8 中的原始代码非常相似，而匿名函数语法的设计正是为了简化这种代码。然而，如果涉及到外部变量，编译器执行的代码转换可能会比仅仅将匿名函数重写为静态方法要复杂得多。\n\
  \n### 外部变量\n\n声明在 lambda 表达式之外的局部变量（包括包含方法的参数）被称为该 lambda 的`外部变量`。（尽管 `this` 引用在技术上不是一个变量，但也被视为外部变量。）当\
  \ lambda 体使用外部变量时，该变量被认为被 lambda “捕获”（`captured`）（或等效地被“闭包”（`closed over`）。在列表 13.20\
  \ 中，我们使用外部变量来计算 `BubbleSort()` 执行比较的次数。输出 13.2 显示了该列表的结果。\n\n**列表 13.20：在 Lambda\
  \ 表达式中使用外部变量**\n\n点击此处查看代码图像\n\n```cs\nclass DelegateSample\n\n{\n\n  // ...\n\n\
  \  static void Main(string[] args)\n  {\n      int i;\n      int[] items = new int[5];\n\
  \      int comparisonCount = 0;                                           \n   \
  \   for (i = 0; i<items.Length; i++)\n      {\n          Console.Write(\"Enter an\
  \ integer:\");\n          items[i] = int.Parse(Console.ReadLine());\n      }\n \
  \     BubbleSort(items,                                                   \n   \
  \       (int first, int second) =>                                      \n     \
  \     {                                                               \n       \
  \       comparisonCount++;                                          \n         \
  \     return first < second;                                      \n          }\
  \                                                               \n      );     \
  \                                                             \n      for (i = 0;\
  \ i < items.Length; i++)\n      {\n          Console.WriteLine(items[i]);\n    \
  \  }\n      Console.WriteLine(\"Items were compared {0} times.\",              \
  \   \n                        comparisonCount);                                \
  \ \n    }\n}\n```\n\n`3.0`\n\n**输出 13.2**\n\n点击此处查看代码图像\n\n```\nEnter an integer:5\n\
  Enter an integer:1\nEnter an integer:4\nEnter an integer:2\nEnter an integer:3\n\
  5\n4\n3\n2\n1\nItems were compared 10 times.\n```\n\n注意 `comparisonCount` 出现在 lambda\
  \ 表达式之外，并在内部递增。在调用 `BubbleSort()` 方法后，`comparisonCount` 被打印到控制台。\n\n通常情况下，局部变量的生命周期与其作用域绑定；当离开作用域时，与其关联的位置将失效。但捕获外部变量的委托生命周期可能比局部变量更长，因为委托在每次调用时都必须安全地访问该变量。因此，外部变量的生命周期被延长了（这是一个实现细节）。\n\
  \n`3.0`\n\nC# 编译器负责在匿名方法和声明它的方法之间共享 `comparisonCount`。\n\n**列表 13.21：编译器为外部变量生成的\
  \ CIL 代码**\n\n点击此处查看代码图像\n\n```cs\nclass DelegateSample\n\n{\n\n  // ...\n  private\
  \ sealed class __LocalsDisplayClass_00000001                                \n \
  \ {                                                                            \
  \     \n      public int comparisonCount;                                      \
  \             \n      public bool __AnonymousMethod_00000000(                  \
  \               \n          int first, int second)                             \
  \                       \n      {                                              \
  \                               \n              comparisonCount++;             \
  \                                       \n              return first < second; \
  \                                             \n      }                        \
  \                                                     \n  }\n  // ...\n  static\
  \ void Main(string[] args)\n  {\n      int i;\n      __LocalsDisplayClass_00000001\
  \ locals =                                        \n          new __LocalsDisplayClass_00000001();\
  \                                      \n      locals.comparisonCount=0;       \
  \                                              \n      int[] items = new int[5];\n\
  \      for (i = 0; i<items.Length; i++)\n      {\n          Console.Write(\"Enter\
  \ an integer:\");\n          items[i] = int.Parse(Console.ReadLine());\n      }\n\
  \      BubbleSort(items, locals.__AnonymousMethod_00000000);                   \
  \      \n      for (i = 0; i < items.Length; i++)\n      {\n          Console.WriteLine(items[i]);\n\
  \      }\n      Console.WriteLine(\"Items were compared {0} times.\",          \
  \                 \n                        locals.comparisonCount);           \
  \                         \n  }\n}\n```\n\n生成的类 `__LocalsDisplayClass` 是一个闭包（`closure`）——一种数据结构（C#\
  \ 中的类），包含一个表达式以及评估该表达式所需的变量（C# 中的公共字段）。\n\n`开始 5.0`\n\n**列表 13.22：C# 5.0 中捕获循环变量**\n\
  \n点击此处查看代码图像\n\n```cs\nclass CaptureLoop\n\n{\n  static void Main()\n  {\n     \
  \ var items = new string[] { \"Moe\", \"Larry\", \"Curly\" };\n      var actions\
  \ = new List<Action>();\n      foreach (string item in items)\n      {\n       \
  \   actions.Add( () => { Console.WriteLine(item); } );\n      }\n      foreach (Action\
