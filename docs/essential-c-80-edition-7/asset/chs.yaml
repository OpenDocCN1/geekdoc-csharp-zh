  />\n            此外还有\n            <seealso cref=\"T:System.IO.StreamWriter\"/>\n\
  \            </remarks>\n            <param name=\"employee\">\n            要持久化到文件的员工</param>\n\
  \            <date>2000 年 1 月 1 日</date>\n        </member>\n        <member name=\"\
