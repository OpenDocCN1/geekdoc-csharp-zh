  }\n\n  public override string ToString()\n  {\n      return $\"{ Title } ({ YearOfPublication\
  \ })\";\n  }\n}\n\npublic class Inventor\n{\n\n  public long Id { get; }\n  public\
  \ string Name { get; }\n  public string City { get; }\n  public string State { get;\
