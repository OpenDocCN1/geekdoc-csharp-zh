  \ in XAML 工具包（[`materialdesigninxaml.net/`](http://materialdesigninxaml.net/)）。他还喜欢棋游、极限飞和骑摩托车。\n\
  \n`Eric Lippert` 在 Facebook 开发开发工具；他是微软 `C#` 语言设计团队的前成员。不在 StackOverflow 上回答 `C#`\
  \ 问题或编辑编程书籍时，Eric 尽力保持他的小帆船。他和妻子 Leah 住在华盛顿州西雅图。\n\n# 1 介绍 C#\n\n`C#` 编程语言可用于构建运行在各种操作系统（平台）上的软件组件和应用程序——包括移动设备、游戏机、网络应用程序、物联网\
  \ (IoT)、微服务和桌面应用程序。此外，`C#` 是免费的；事实上，它是完全开源的，因此你可以查看、修改、重新发行并贡献你做的任何改进。作为一种语言，`C#`\
  \ 构建在其先的 C 风格语言（C、C++ 和 Java）的特征之上，这让许多资深程序员感到非常熟悉。^(1)\n\n1。第一次 C# 设计会议发生于 1998\
  \ 年。\n\n![一张思维导图显示了第 1 章的内容。](img/01mindmap.jpg)\n\n\n\n\n\n## 引言\n\n本章将通过传统的 `HelloWorld`\
  \ 程序介绍 C#。它将重点介绍 C# 语法基础，包括定义 C# 程序的入口点，这将让你熟悉 C# 的语法风格和结构，并使你能够编写出最简单的 C# 程序。在讨论\
  \ C# 语法基础之前，将对托管执行上下文进行总结，它解释了 C# 程序在运行时是如何执行的。本章最后将讨论变量声明、从控制台写入和和取数据，以及 C# 中代码注释的基础知识。\n\
  \n## Hello, World\n\n学习一门新编程语言的最佳方法是编写代码。第一个示例是经典的 `HelloWorld` 程序。在程序程序中，你将在屏幕上显示一些文本。\n\
  \n列表 1.1 显示了完整的 `HelloWorld` 程序；在接下来的章节中，你将编译并运行这些代码。\n\n**列表 1.1：C# 中的 `HelloWorld`^(2)**\n\
  \n点击此处查看代码图像\n\n```\nclass HelloWorld\n{\n  static void Main()\n  {\n    System.Console.WriteLine(\"\
  Hello. My name is Inigo Montoya.\");\n  }\n}\n```\n\n2。如果你对 Inigo Montoya 的引用感到困惑，请参考电影《公主新娘》（The\
  \ Princess Bride）。\n\n### 注意\nC# 是一种大小写敏感的语言：大小错误会导致代码无法成功编译。\n\n具有 Java、C 或 C++\
  \ 编程经验的人会立即发现相似之处。与 Java 一样，C# 的基本语法继承自 C 和 C++.^(3) 语法标点（如分号和大括号）、特性（如大小写敏感）和关键字（如\
  \ `class`、`public` 和 `void` 对于对于熟悉这些语言的程序员来说都是熟悉的。初学者和其他其他语言的程序员会很快发现这些结构是直观的。\n\
  \n3。在创建 C# 时，语言创建者审查了 C/C++ 的规范，字面上地删掉了他们不喜欢的特性，并列出了他们喜欢的特性列表。该小组还包括在其他语言方面具有深厚背景的设计师。\n\
  \n## 创建、编辑、编译和运行 C# 源代码\n\n一旦编写了 C# 代码，就是时候编译并运行它了。你可以选择使用哪种 .NET 实现——有时被称为 .NET\
  \ 框架（framework）。通常情况下，该实现被封装在**软件开发工具包 (SDK)** 中。SDK 包含了编译器、运行时执行引擎、运行时可以访问的实用可用功能框架（参见本章稍后的“应用程序编程接口”）以及可能与\
  \ SDK 捆绑的额外工具（例如用于自动化构建步骤的构建引擎）。鉴于 C# 自 2000 年以来已公开，有多个不同的 .NET 框架供选择（参见本章稍后的“多个\
  \ .NET 框架”）。\n\n对于每个 .NET 框架，安装说明取决于你正在哪个操作系统上开发以及你选择了哪个 .NET 框架。因此，我建议你访问 [`dotnet.microsoft.com/download`](https://dotnet.microsoft.com/download)\
  \ 获取下载和安装说明，必要时，首先选择 .NET 框架，然后根据你将要开发的操作系统选择下载包。虽然我可以在这里提供更多详细信息，但 .NET 下载网站为每个支持的组合提供了最新的说明。\n\
  \n如果你不确定使用哪种 .NET 框架，请默认选择 .NET Core。它可以在 Linux、macOS 和 Microsoft Windows 上运行，并且是\
  \ .NET 开发团队投入大部分投资的实现。此外，由于其跨平台能力，我将在章节正文中倾向于使用 .NET Core 指令。\n\n还有许多编辑源代码的方法，包括最原始的工具，如\
  \ Windows 上的记事本、Mac/macOS 上的 Text 或 Linux 上的 vi。然而，你可能想要更高级的工具，以便至少你的代码有颜色高亮。任何支持\
  \ C# 的编程编辑器都胜任。如果你还没有倾向的偏好，我建议你考虑开源编辑器 Visual Studio Code ([`code.visualstudio.com`](https://code.visualstudio.com))。为了优化在\
  \ Visual Studio Code 中进行 C# 工作，你需要像图 1.1 所示那样安装 C# 扩展。或者，如果你在 Windows 或 Mac 上工作，请考虑\
  \ Microsoft Visual Studio 2019（或更高版本）——访问 [`visualstudio.microsoft.com/vs/`](https://visualstudio.microsoft.com/vs/)。两者都是免费提供的。\n\
