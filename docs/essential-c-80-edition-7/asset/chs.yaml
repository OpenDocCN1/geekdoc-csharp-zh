  \n有时 C# 语法要求指定一个数据类型，但没有传递任何数据。例如，如果方法不需要返回值，C# 允许你将 `void` 指定为数据类型。`HelloWorld`\
  \ 程序中 `Main` 方法的声明（Listing 1.1）就是一个示例。将 `void` 作为返回类型表示该方法不返回任何数据，并告诉编译器不要期望有。`void`\
  \ 本身并不是一种数据类型，而是没有数据返回的指示。\n\n### 数据类型之间的转换\n\n考虑到 .NET 框架中预定义的数千种类型以及代码可以定义的无限类型，让类型在合理的情况下支持从一种类型到另一种类型的转换是非常重要的。导致转换的最常见操作是“强制类型转换”（`casting`）。\n\
  \n考虑两个数值类型之间的转换：从 `long` 类型的变量转换为 `int` 类型的变量。`long` 类型可以包含大达 9,223,372,036,854,775,808\
  \ 的值；然而，`int` 的最大大小为 2,147,483,647。因此，该转换可能会导致数据丢失——例如，如果 `long` 类型变量包含的值大于 `int`\
  \ 的最大值。任何可能导致数据丢失（如数量和/或精度）或由于转换失败而导致异常的转换都需要“显式强制转换”（`explicit cast`）。相反，无论操作数类型如何都不会丢失数量且不会抛出异常的转换操作是“隐式转换”（`implicit\
  \ conversion`）。\n\n### 显式强制转换\n\n在 C# 中，你使用“强制转换运算符”（`cast operator`）进行转换。通过在括号内指定你希望将变量转换的类型，你承认了如果发生显式强制转换，可能会导致精度和数据的丢失，或者可能会产生异常。Listing\
  \ 2.20 中的代码将 `long` 转换为 `int`，并显式地告诉系统尝试该操作。\n\n**Listing 2.20: 显式强制转换示例**\n\n![Images](img/lis2-20.jpg)\n\
  \n通过强制转换运算符，程序员本质上是对编译器说：“相信我，我知道我在做什么。我知道该值可以放入目标类型中。”做出这样的选择将导致编译器允许转换。然而，通过显式转换，如果数据没有成功转换，在执行期间仍有发生以异常形式错误的可能。因此，确保数据成功转换是程序员的责任，否则在转换失败时提供必要的错误处理代码。\n\
  \n你不能仅仅因为使用强制转换运算符显式地指定了转换，就将任何类型转换为任何其他类型。编译器仍然会检查该操作是否有效。例如，你不能将 `long` 转换为 `bool`。没有定义这样的转换，因此编译器不允许此类强制转换。\n\
  \n### 隐式转换\n\n在其他情况下，例如从 `int` 类型到 `long` 类型，没有精度的损失，类型的值也没有发生根本变化。在这些情况下，代码只需要指定赋值运算符；转换是隐式的（`implicit`）。换句话，，能够确定这种转换将正常工作。Listing\
  \ 2.24 中的代码通过简单地使用赋值运算符从 `int` 转换为 `long`。\n\n**Listing 2.24: 隐式转换未使用强制转换运算符**\n\
  \n点击此处查看代码图像\n\n```\nint intNumber = 31416;\n\nlong longNumber = intNumber;\n```\n\
  \n即使不需要显式的强制转换运算符（因为允许隐式转换），仍然可以包含强制转换运算符（参见 Listing 2.25）。\n\n**Listing 2.25: 在隐式强制转换中使用强制转换运算符**\n\
  \n点击此处查看代码图像\n\n```\nint intNumber = 31416;\n\nlong longNumber = (long) intNumber;\n\
  ```\n\n### 不带强制转换的转换\n\n没有定义从字符串到数值类型的转换，因此需要如 `Parse()` 等方法。每个数值数据类型都包含一个 `Parse()`\
  \ 函数，它允许从字符串转换为相应的数值类型。Listing 2.26 展示了此调用。\n\n**Listing 2.26: 使用 `float.Parse()`\
  \ 将 `string` 转换为数值数据类型**\n\n点击此处查看代码图像\n\n```\nstring text = \"3.14\";\nfloat kgMass\
  \ = float.Parse(text);\n```\n\n另一种特殊的类型可用于将一种类型转换为另一种。这种类型是 `System.Convert`，其使用示例出现在\
  \ Listing 2.27 中。\n\n**Listing 2.27: 使用 System.Convert 进行类型转换**\n\n点击此处查看代码图像\n\n\
  ```\nstring middleCText = \"26.62\";\n\ndouble middleC = System.Convert.ToDouble(middleCText);\n\
  \nbool boolean = System.Convert.ToBoolean(middleC);\n```\n\n`System.Convert` 只支持少数类型且不可扩展。它允许从\
  \ `bool`、`char`、`sbyte`、`short`、`int`、`long`、`ushort`、`uint`、`ulong`、`float`、`double`、`decimal`、`DateTime`\
  \ 和 `string` 转换为任何其他类型。\n\n此外，所有类型都支持一个 `ToString()` 方法，可以提供类型的字符串表示。Listing 2.28\
  \ 展示了如何使用它。结果输出显示在 Output 2.17。\n\n**Listing 2.28: 使用 `ToString()` 转换为字符串**\n\n\
  点击此处查看代码图像\n\n```\nbool boolean = true;\n\nstring text = boolean.ToString();\n\n\
  // 显示 \"True\"\n\nSystem.Console.WriteLine(text);\n```\n\n**Output 2.17**\n\n```\n\
  True\n```\n\n对于大多数类型，`ToString()` 方法返回的是数据类型的名称而不是数据的字符串表示。只有当类型显式实现了 `ToString()`\
  \ 时，才会返回字符串表示。最后一点观点是，可以编写自定义的转换方法，并且运行时类中有许多此类方法可用。\n\n\n\n\n\n即使对于经验丰富的程序员来说，C#\
  \ 也引入了若干种新的编程结构。例如，在数据类型的章节中，本章涵盖了 `decimal` 类型，它可以用于执行财务计算而不会产生浮点数异常。此外，章节还介绍了布尔类型\
  \ `bool` 不会在与整数类型之间进行隐式相互转换，从而防止了在条件表达式中误用赋值运算符。C# 的其他区别于其许多前身版本的特性还包括：`@` 字面量字符串限定符，它可以强制字符串忽略转义字符；通过将代码嵌入字符串来使代码更易读的字符串插值；以及\
  \ `string` 数据类型的不可变性。\n\n在第 3 章中，我们将继续讨论数据类型话题，详细阐述两种数据类型：值类型和引用类型。此外，我们还查看了如何将数据元素组合成元组和数组。\n\
  \n# 3 数据类型的更多用法\n\n在第 2 章中，我们涵盖了所有的 C# 预定义类型，并简单提到了引用类型与值类型的对比。在本章中，我们将继续对数据类型的讨论，并对类型分类进行进一步解释。\n\
  \n![一张思维图显示了第 3 章的内容，与数据类型相关。](img/03mindmap.jpg)\n\n此外，我们将深入研究数据元素组合成元组的细节——这是\
  \ C# 7.0 引入的特性——随后是将数据分组为 `arrays` 的集合。首先，让我们深入理解值类型和引用类型。\n\n### 类型分类\n\n所有类型都属于两类之一：`值类型`和`引用类型`。每类中类型之间的区别在于它们的复制方式：值类型数据始终通过值复制，而引用类型数据始终通过引用复制。\n\
  \n### 值类型\n\n除了 `string` 之外，书中目前为止的所有预定义类型都是值类型。值类型变量直接包含值。换句话说，变量指向存储该值的相同内存位置。正因如此，当给另一个变量分配相同的值时，原始变量值的副本会被创建到新变量所在的位置。相同值类型的第二个变量不能与第一个变量指向同一个内存位置。因此，如图\
  \ 3.1 所示，更改第一个变量的值不会影响第二个变量的值。在图中，`number1` 指向包含值 `42` 的内存位置。在将 `number1` 分配给 `number2`\
  \ 后，两个变量都将包含值 `42`。然而，修改任何一个变量的值都不会影响另一个。\n\n![图中代表了值类型包含的数据。](img/03fig01.jpg)\n\
  \n**图 3.1: 值类型直接包含数据**\n\n同样，将值类型传递给如 `Console.WriteLine()` 等方法会导致内存复制，方法内部对参数的任何更改都不会影响调用函数内部的原始值。由于值类型需要内存复制，它们通常应该被定义为消耗少量内存；值类型的大小几乎总是小于\
  \ 16 字节。\n\n### 引用类型\n\n相比之下，引用类型变量的值是指包含数据的存储位置的引用。引用类型存储数据所在位置的引用，而不是像值类型那样直接存储数据。因此，为了访问数据，运行时从变量中读取内存位置，然后“跳转”到包含数据的内存位置，这种操作被称为\
  \ `dereferencing`（解引用）。引用类型所指向数据的内存区域被称为 `heap`（堆）（参见图 3.2）。\n\n![了程序的典型的内存表示。](img/03fig02.jpg)\n\
  \n**图 3.2: 引用类型指向堆**\n\n引用类型不需要值类型那样对数据进行内存复制，这使得复制引用类型比复制大型值类型高效得多。当将一个引用类型变量的值分配给另一个引用类型变量时，只复制了引用，而不是所引用的数据。在实践中，引用的尺寸与处理器的“原生尺寸”相同——32\
  \ 位处理器将复制 32 位引用，64 位处理器将复制 64 位引用，依此类推。显然，将很小的引用复制到大块数据上比复制整个数据块（如值类型那样）要快得多。\n\
  \n由于引用类型复制的是指向数据的引用，因此两个不同的变量可以指向相同的数据。如果两个变量指向同一个对象，通过一个变量更改对象中的数据，会导致通过另一个变量访问相同数据时产生该影响。这在赋值和方法调用中都会发生。因此，方法可以影响引用类型的数据，并且当控制返回给调用者时可以观察到该更改。由于这个原因，在选择定义引用类型还是值类型时，一个关键因素是该对象在逻辑上像是一个固定大小的不可变值（因此可能是值类型），还是逻辑上是一个可以被引用的可变实体（因此可能是引用类型）。\n\
  \n除了 `string` 和任何如 `Program` 的自定义类外，目前讨论的所有类型都是值类型。然而，大多数类型都是引用类型。虽然可以定义自定义值类型，但与自定义引用类型的数量相比，这样做相对罕见。\n\
  \n### 定义允许 `null` 的类型\n\n通常，表示“缺失”的值是有理想的。例如，在指定 `count` 时，如果 `count` 未知或未分配，你存储什么？一种可能的解决方案是指定“魔术值”，例如\
  \ `-1` 或 `int.MaxValue`。然而，这些都是有效的整数，因此很难判断魔术值是普通的 `int` 还是意味着缺失值。一种更好的方法是分配 `null`\
  \ 来指示该值无效或未分配。分配 `null` 在数据库编程中特别有用。通常，数据库表中的列允许 `null` 值。检索此类列并将其分配给 C# 代码中的相应变量是有问题的，除非\
  \ C# 中的数据类型也能包含 `null`。\n\n你可以通过可空修饰符将类型声明为可空或不可可空。（从技术上讲，C# 仅在 2.0 版本中对值类型支持可空修饰符，在\
  \ 8.0 版本中支持引用类型。）要启用可空，只需在类型声明后紧跟一个可空修饰符——一个问号。例如，`int? number = null` 将声明一个可空的\
  \ `int` 类型变量并赋值为 `null` 值。遗憾的是，可空性包含一些陷阱，在启用可空性时需要使用特殊处理。\n\n### 解引用 `null` 引用\n\
  \n\n\n\n\n虽然为变量赋值 `null` 的支持是非常宝贵的（这里用了一个双关语），但它并非没有缺点。虽然将 `null` 值复制或传递给其他变量和方法是无关紧要的，但对\
  \ `null` 实例进行解引用（即调用其上的成员）将抛出 `System.NullReferenceException`——例如，当 `text` 的值为 `null`\
  \ 时调用 `text.GetType()`。每当生产代码抛出 `System.NullReferenceException` 时，它总是一个 bug。此异常表明编写代码的开发者在调用之前忘记了检查\
  \ `null`。更严重的问题是，检查 `null` 需要开发者意识到 `null` 值是有可能的，因此有必要采取显式操作。正因如此，声明可空变量（nullable\
  \ variable）需要显式地使用可空修饰符（nullable modifier）——而不是那种默认允许 `null` 的反向方法（请参见本节稍后介绍的“C#\
  \ 8.0 之前的引用类型可空性”）。换句话说，当程序员选择允许变量为 `null` 时，他或她就承担了额外的责任，即确保避免对值为 `null` 的变量进行解引用。\n\
  \n由于检查 `null` 需要使用我们还没有过的语句和/或运算符，有关如何检查 `null` 的细节出现在“高级主题：检查 `null`”中。然而，完整的解释出现在第\
  \ 4 章中。\n\n`2.0`\n\n### 可空值类型 (Nullable Value Types)\n\n由于值类型直接引用实际值，因此值类型本质上不能包含\
  \ `null`，因为根据定义，它们不能包含引用，包括指向“无”的引用。尽管如此，在调用值类型上的成员时，我们仍然使用“解引用值类型”（dereferencing\
  \ a value type）这一术语。换句话说，虽然技术上并不准确，但在调用成员时，无论其是否为值类型，使用“解引用”一词都是常见的.^(1)\n\n1。可空值类型是\
  \ C# 2.0 引入的。\n\n`2.0` `8.0`\n\n### 可空引用类型 (Nullable Reference Types)\n\n在 C# 8.0\
  \ 之前，所有引用类型都允许 `null`。遗憾，这导致了大量的 bug，因为避免 `null` 引用异常需要开发者意识到检查 `null` 的必要性，并进行防御性编程以避免对\
  \ `null` 值解引用。更严重的问题是，引用类型默认为空。如果没有为引用类型的变量赋值，该值将默认为 `null`。此外，如果你解引用了一个未赋值的引用类型局部变量，编译器会（恰当地地）发出错误\
  \ `\"Use of unassigned local variable 'text'\"`，对该错误最简单的纠正方法是在声明时简单地分配 `null`，而不是确保无论执行路径如何都分配一个更合适的值（请参见列表\
  \ 3.2）。换句话说，开发者会很容易掉入这样的陷阱：声明一个变量并分配一个 `null` 值作为该错误的最简单解决方案，并（可能错误地）期望代码在被解引用之前会重新赋值该变量。\n\
  \n**列表 3.2：解引用未赋值的变量**\n\n点击此处查看代码图像\n\n```\n#nullable enable\n\nstatic void Main()\n\
  {\n  string? text;\n   // ...\n  // 编译错误：Use of unassigned local variable 'text'\n\
  \n  System.Console.WriteLine(text.length);\n}\n```\n\n总结，引用类型默认的可空性是 `System.NullReferenceException`\
  \ 异常形式的缺陷的频繁来源，除非开发者采取显式行动来避免这一陷阱，否则编译器的行为会误导开发者。\n\n为了显著改善这种局面，C# 团队在 C# 8.0 中为引用类型引入了可空性概念——这一功能被称为**可空引用类型**（nullable\
  \ reference types，（当然，这意味着引用类型也可以是非空的）。可空引用类型使引用类型与值类型并驾齐，因为引用类型的声明可以带有也可以不带有可空修饰符。在\
  \ C# 8.0 中，声明变量时不带可空修饰符意味着意味着它不是可空的。\n\n遗憾的是，支持带有可空修饰符的引用类型声明，并将不带 `null` 修饰符的引用类型声明默认为不可空，对于从早期版本的\
  \ C# 升级而的代码具有重大影响。考虑到 C# 7.0 及之前的版本支持向所有引用类型声明分配 `null`（即 `string text = null`），难道所有代码在\
  \ C# 8.0 中都会编译失败吗？\n\n幸运的是，向后兼容对 C# 团队至关重要，因此默认未启用引用类型的可空性。相反，有两个选项可以启用它：`#nullable`\
  \ 指令和项目属性。\n\n首先，在本示例中通过 `#nullable` 指令激活了 `null` 引用类型功能：\n\n```\n#nullable enable\n\
  ```\n\n该指令支持 `enable`、`disable` 和 `restore` 值——最后一个会将可空上下文恢复到项目范围的设置。列表 3.2 提供了一个示例，通过使用\
  \ `nullable` 指令将 `nullable` 设置为 `enabled`。通过这样做，将 `text` 声明为 `string?` 被启用，且不再导致编译器警告。\n\
  \n或者，程序员可以使用项目属性来启用引用类型的可空性。默认情况下，项目文件（`*.csproj`）的项目范围设置是禁用的。要启用它，请添加值为 `enable`\
  \ 的 `Nullable` 项目属性，如列表 3.3 所示。\n\n**列表 3.3：在 `csproj` 文件中启用 `Nullable`**\n\n点击此处查看代码图像\n\
  \n```\n<Project Sdk=\"Microsoft.NET.Sdk\">\n  <PropertyGroup>\n    <OutputType>Exe</OutputType>\n\
  \    <TargetFramework>netcoreapp3.0</TargetFramework>\n    <Nullable>enable</Nullable>\n\
  \  </PropertyGroup>\n</Project>\n```\n\n本书的所有示例（可在 [`github.com/EssentialCSharp`](https://github.com/EssentialCSharp)\
  \ 获取）都在项目级别启用了 `nullable`。或者，你也可以在命令行中使用 `/p` 参数设置项目属性：\n\n点击此处查看代码图像\n\n```\ndotnet\
  \ build /p:Nullable=enable\n```\n\n在命令行上指定 `Nullable` 值将覆盖项目中的任何值。\n\n`结束 8.0` `开始\
  \ 3.0`\n\n### 隐式类型局部变量 (Implicitly Typed Local Variables)\n\nC# 3.0 添加了上下文关键字 `var`\
  \ 用于声明隐式类型局部变量。如果代码在声明时使用明确类型的表达式初始化变量，C# 3.0 及更高版本允许变量数据类型为推断而非陈述，如列表 3.4 所示。\n\
  \n**列表 3.4：处理字符串**\n\n点击此处查看代码图像\n\n```\nclass 3.2->3.Uppercase\n{\n  static void\
  \ Main()\n  {\n      System.Console.Write(\"Enter text: \");\n      var text = System.Console.ReadLine();\n\
  \      // 返回一个大写的新字符串\n      var uppercase = text.ToUpper();\n      System.Console.WriteLine(uppercase);\n\
  \  }\n}\n```\n\n此列表与列表 2.18 在两个方面有所不同。首先，声明时没有使用显式数据类型 `string`，列表 3.4 使用了 `var`。生成的\
  \ CIL 代码与显式使用 `string` 相同。然而，`var` 向编译器指示它应该从声明内部赋值的值（`System.Console.ReadLine()`）来确定数据类型。\n\
  \n\n\n\n其次，变量 `text` 和 `uppercase` 是通过它们的声明初始化的。如果不这样做会导致编译时出现错误。如前所述，编译器会确定初始化表达式的数据类型，并据此声明变量，就像程序员显式指定了类型一样。\n\
  \n虽然允许使用 `var` 而不是显式数据类型，但在数据类型显而易见时，请考虑避免这种用法——例如，在声明 `text` 和 `uppercase` 时使用\
  \ `string`。这不仅使代码更易于理解，还能允许编译器验证你的意图，即右侧表达式返回的数据类型是预期的类型。当使用用 `var` 声明的变量时，右侧的数据类型应该是显而易见的；如果不是，应避免使用\
  \ `var` 声明。\n\n`3.0```End 3.0``Begin 7.0`\n\n### 元组 (Tuples)\n\n有时情况下，你会发现将数据元素组合在一起很有用。例如，考虑一个国家的信息，比如\
  \ 2019 年世界上最贫的国家：南苏丹，首首是朱巴，人均 GDP 为 275.18 美元。考虑到我们目前建立的结构，我们可以将每个数据元素存储在单独的变量中，但结果数据元素之间没有关联。也就是说，$275.18\
  \ 与南苏丹之间没有关联，除非通过变量名中的共同后缀或前缀。另一个选项是将所有数据合并成单个字符串，但缺点是单独处理每个数据元素需要对其进行解析。\n\nC#\
  \ 7.0 提供了第三种选择：元组。元组允许你在单个语句中组合对每个变量的赋值，如下所示的国家数据所示：\n\n点击此处查看代码图像\n\n```\n(string\
  \ country, string capital, double gdpPerCapita) = (\"South Sudan\",\n\"Juba\", 275.18);\n\
  ```\n\n元组具有几种额外的语法可能性，如表 3.1 所示。\n\n在前四个示例中，尽管右侧表示一个元组，但左侧仍然表示使用 `tuple syntax`\
  \ 联合赋值的单独变量，该语法涉及两个或多个由逗号分隔的元素，并用括号关联在一起。（这里使用 `tuple syntax` 一术是因为编译器在左侧生成的底层数据类型在技术上并不是元组。）结果是，虽然我们从右侧组合为元组的值开始，但左侧的赋值将元组解构为它的组成部分。在示例\
  \ 2 中，左侧赋值是针对预先变量的。然而，在示例 1、3 和 4 中，变量是在元组语法内声明的。由于我们只是在声明变量，命名和大小写约定遵循我们在第 1 章中讨论的指南——例如，“对局部变量名必须使用\
  \ camelCase”。\n\n注意，尽管隐式类型（`var`）可以分布到元组语法内的每个变量声明中（如示例 4 所示），但你不能对显式类型（如 `string`）这样做。由于元组允许每个项目具有不同的数据类型，除非所有项目的数据类型相同，否则将显式类型名称分发到所有元素并不一定可行（即使如此，编译器也不允许）。\n\
  \n| **示例** | **描述** | **示例代码** |\n| --- | --- | --- |\n| 1. | 将元组分配给单独声明的变量。 | |\n\
  ```\n(string country, string capital, double gdpPerCapita) =\n    (\"South Sudan\"\
  , \"Juba\", 275.18);\n\nSystem.Console.WriteLine(\n    $@\"The poorest country in\
  \ the world in 2017 was {\n        country}, {capital}: {gdpPerCapita}\");\n```\
  \ | |\n| 2. | 将元组分配给预先声明的单独声明变量。 | |\n```\nstring country;\nstring capital;\ndouble\
  \ gdpPerCapita;\n\n(country, capital, gdpPerCapita) =\n    (\"South Sudan\", \"\
  Juba\", 275.18);\n\nSystem.Console.WriteLine(\n    $@\"The poorest country in the\
  \ world in 2017 was {\n        country}, {capital}: {gdpPerCapita}\");\n```\n |\n\
  | 3. | 将元组分配给单独声明且隐式类型化的变量。 | |\n```\n(var country, var capital, var gdpPerCapita)\
