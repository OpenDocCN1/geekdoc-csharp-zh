  ;\n            }\n        }\n        return success;\n    }\n}\n```\n\n### `System.AttributeUsageAttribute`\n\
  大多数属性旨在装饰特定的构造结构。例如，允许 `CommandLineOptionAttribute` 装饰类或程序集是没有意义的，因为该属性在这些语文中将毫无意义的。为了避免不当使用属性，可以对自定义属性使用\
  \ `System.AttributeUsageAttribute` 进行装饰（是的，一个属性正在装饰一个自定义属性声明）。列表 18.19（针对 `CommandLineOptionAttribute`）演示了如何这样做。\n\
  \n#### 列表 18.19：限制属性可以装饰的构造\n点击此处查看代码图像\n\n```csharp\n[AttributeUsage(AttributeTargets.Property)]\n\
  public class CommandLineSwitchAliasAttribute : Attribute\n{\n  // ...\n}\n```\n\n\
  如果不当使用该属性，如 列表 18.20 所示，它将导致编译错误，如 输出 18.6 所示。\n\n#### 列表 18.20：`AttributeUsageAttribute`\
  \ 限制属性的应用位置\n点击此处查看代码图像\n\n```csharp\n// ERROR: The attribute usage is restricted\
  \ to properties\n\n[CommandLineSwitchAlias(\"?\")]\nclass CommandLineInfo\n{\n\n\
  }\n```\n\n#### 输出 18.6\n点击此处查看代码图像\n\n```text\n...Program+CommandLineInfo.cs(24,17):\
  \ error CS0592: Attribute\n'CommandLineSwitchAlias' is not valid on this declaration\
  \ type. It is\nvalid on 'property, indexer' declarations only.\n```\n\n`AttributeUsageAttribute`\
  \ 的构造函数接受一个 `AttributeTargets` 标志。此枚举提供了运行时允许属性装饰的所有可能目标的列表。例如，如果你还允许在字段上使用 `CommandLineSwitchAliasAttribute`，你将更新\
  \ `AttributeUsageAttribute` 类，如 列表 18.21 所示。\n\n#### 列表 18.21：使用 `AttributeUsageAttribute`\
  \ 限制属性的使用\n点击此处查看代码图像\n\n```csharp\n// Restrict the attribute to properties and\
  \ methods\n\n[AttributeUsage(                                                  \
  \    \n  AttributeTargets.Field | AttributeTargets.Property)]                \n\
  public class CommandLineSwitchAliasAttribute : Attribute\n{\n  // ...\n}\n```\n\n\
  ### 命名参数\n除了限制属性可以装饰的内容外，`AttributeUsageAttribute` 还提供了一种机制，允许在单个构造上重复使用相同的属性。该语法出现在\
  \ 列表 18.22。\n\n#### 列表 18.22：使用命名参数\n点击此处查看代码图像\n\n```csharp\n[AttributeUsage(AttributeTargets.Property,\
  \ AllowMultiple=true)]\npublic class CommandLineSwitchAliasAttribute : Attribute\n\
  {\n  // ...\n}\n```\n\n这种语法与之前讨论的构造初始化语法不同。`AllowMultiple` 参数是一个命名参数，类似于用于可选方法参数的命名参数语法（C#\
  \ 4.0 引入）。命名参数提供了一种在属性构造调用中设置特定公共属性和字段的机制，即使构造没有相应的参数。命名属性是可选标记，但它们提供了在不提供构造参数的情况下设置额外实例数据的方法。在这种情况下，`AttributeUsageAttribute`\
  \ 包含一个名为 `AllowMultiple` 的公共成员；在使用属性时，可以使用命名参数赋值来设置该成员。分配命名参数必须作为构造函数的最后部分，位于任何显式声明的构造参数之后。\n\
  \n命名参数允许用于分配属性数据，而无需为指定的属性和未指定的属性的所有可能组合提供构造函数。由于属性的许多属性可能是可选的，因此在许多情况下这是一种非常有用的结构。\n\
  \n#### 列表 18.23：使用 `FlagsAttribute`\n点击此处查看代码图像\n\n\n\n\n\n```csharp\n// FileAttributes\
  \ defined in System.IO\n\n[Flags]  // Decorating an enum with FlagsAttribute   \
  \                                      \n\npublic enum FileAttributes\n{\n  ReadOnly\
  \ =          1<<0,      // 000000000000001\n  Hidden =            1<<1,      //\
  \ 000000000000010\n  // ...\n}\n\nusing System;\nusing System.Diagnostics;\nusing\
  \ System.IO;\n\nclass Program\n{\n  public static void Main()\n  {\n      // ...\n\
  \      string fileName = @\"enumtest.txt\";\n      FileInfo file = new FileInfo(fileName);\n\
  \      file.Attributes = FileAttributes.Hidden |\n          FileAttributes.ReadOnly;\n\
  \      Console.WriteLine(\"{0} as {1}\",\n          file.Attributes.ToString().Replace(\"\
  ,\", \" |\"),\n          file.Attributes);\n      FileAttributes attributes =\n\
  \          (FileAttributes)Enum.Parse(typeof(FileAttributes),\n          file.Attributes.ToString());\n\
  \      Console.WriteLine(attributes);\n       // ...\n  }\n}\n```\n\n`Output 18.7`\
  \ 显示了 `Listing 18.23` 的结果。\n\n**Output 18.7**\n```\n\"ReadOnly | Hidden\" outputs\
  \ as \"ReadOnly, Hidden\"\n```\n\n`FlagsAttribute` 标记指示枚举值可以被组合。此外，它更改了 `ToString()`\
  \ 和 `Parse()` 方法的行为。例如，对修饰了 `FlagsAttribute` 的枚举调用 `ToString()`，会为每个设置的枚举标志位输出字符串。在\
  \ `Listing 18.23` 中，`file.Attributes.ToString()` 返回的是 `\"ReadOnly, Hidden\"`，而不是在没有\
  \ `FlagsAttribute` 标记时本应返回的结果。如果两个枚举值相同，`ToString()` 调用将返回第一个。然而，如前提到的，在依赖此结果时应要小心，因为它是不可本地化的。从字符串解析值到枚举也是可行的，前提是每个枚举值之间都用逗号分隔。请注意，`FlagsAttribute`\
  \ 不会自动分配或检查标记是否具有唯一值；每个项目必须显式分配。\n\n### 预定义属性\n\n`AttributeUsageAttribute` 属性具有一种特殊特性，你在之前创建的自定义属性中尚未见过。该属性会影响编译器的行为，使其有时报告错误。与你之前为\
  \ `CommandLineRequiredAttribute` 和 `CommandLineSwitchAttribute` 编写的反射代码不同，`AttributeUsageAttribute`\
  \ 没有运行时代码；相反，它具有内置的编译器支持。\n\n`AttributeUsageAttribute` 是一个预定义属性。此类属性不仅为其装饰的结构提供额外的元数据，运行时和编译器也会以不同的方式来辅助这些属性。如\
  \ `AttributeUsageAttribute`、`ObsoleteAttribute` 和 `ConditionalAttribute` 等属性都是预定义属性的示例。它们实现了只有\
  \ CLI 提供程序或编译器才能提供的特殊行为，因为额外的属性没有扩展扩展点。相比之下，自定义属性是完全被动的。`Listing 18.23` 包含了几个预定义属性；第\
  \ 19 章包含了更多几个。\n\n### `System.ConditionalAttribute`\n\n在单个程序集内部，`System.Diagnostics.ConditionalAttribute`\
  \ 属性的行为有点类似于 `#if`/#endif` 预处理器标识。然而，它并不是从程序集中消除 CIL 代码，`System.Diagnostics.ConditionalAttribute`\
  \ 会选择性地导致调用行为类似于一个 `no-op`（无操作），即一个什么都不做的指令。`Listing 18.24` 展示了这一概念，`Output 18.8`\
  \ 显示了结果。\n\n**Listing 18.24: 使用 `ConditionalAttribute` 消除调用**\n\n```csharp\n#define\
  \ CONDITION_A\n\nusing System;\nusing System.Diagnostics;\n\npublic class Program\n\
  {\n  public static void Main()\n  {\n      Console.WriteLine(\"Begin...\");\n  \
  \    MethodA();\n      MethodB();\n      Console.WriteLine(\"End...\");\n  }\n \
  \ [Conditional(\"CONDITION_A\")]\n  static void MethodA()\n  {\n      Console.WriteLine(\"\
  MethodA() executing...\");\n  }\n  [Conditional(\"CONDITION_B\")]\n  static void\
  \ MethodB()\n  {\n      Console.WriteLine(\"MethodB() executing...\");\n  }\n}\n\
  ```\n\n**Output 18.8**\n```\nBegin...\nMethodA() executing...\nEnd...\n```\n\n此示例定义了\
  \ `CONDITION_A`，因此 `MethodA()` 正常执行。然而，`CONDITION_B` 既没有通过 `#define` 定义，也没有通过 `csc.exe\
  \ /Define` 选项定义。因此，从此程序集内部对 `Program.MethodB()` 的所有调用将什么都不做。\n\n从功能上讲，`ConditionalAttribute`\
  \ 类似于在方法调用周围放置 `#if`/#endif`。然而，语法更简洁，因为开发者通过向目标方法添加 `ConditionalAttribute` 属性来创建效果，而无需对调用者本身进行任何更改。\n\
  \nC# 编译器在编译期间会注意到被调用方法上的属性；假设预处理器标识存在，它随后会消除任何对该方法的调用。然而，`ConditionalAttribute`\
  \ 不会影响目标方法本身的编译后 CIL 代码（除了添加属性元数据之外）。相反，它在编译期间通过移除调用来影响调用点。这进一步区分了 `ConditionalAttribute`\
  \ 与跨程序集调用时 `#if`/#endif` 的区别。由于被修饰的方法仍然被编译并包含在目标程序集中，因此是否调用方法的判断不是基于*被调用者*程序集中的预处理器标识，而是基于*调用者*程序集。换句话说，如果你创建一个定义了\
  \ `CONDITION_B` 的第二个程序集，那么从第二个程序集对 `Program.MethodB()` 的任何调用都将执行。这在许多跟踪和测试场景中是一个非常有用的特性。事实上，对\
  \ `System.Diagnostics.Trace` 和 `System.Diagnostics.Debug` 的调用在 `TRACE` 和 `DEBUG`\
  \ 预处理器标识上使用了带有 `ConditionalAttribute` 的特性。\n\n由于方法在预处理器标识未定义时不会执行，`ConditionalAttribute`\
  \ 可能不能用于包含 `out` 参数或指定除 `void` 以外返回类型的方法。这样做会导致编译错误。这是合理的，因为被修饰方法内的代码可能一个都不会执行，因此不知道向调用者返回什么。同样，属性不能用\
  \ `ConditionalAttribute` 修饰。`ConditionalAttribute` 的 `AttributeUsage`（参见本章稍前的“AttributeUsageAttribute”节）被修饰为\
  \ `AttributeTargets.Class` 和 `AttributeTargets.Method`，这允许该属性分别用于方法或类。然而，类上的用法是特殊的，因为\
  \ `ConditionalAttribute` 仅允许用于 `System.Attribute` 的派生类。\n\n##### `System.ObsoleteAttribute`\n\
  \n\n\n\n\n如前所述，预定义属性会影响编译器和/或运行时的行为。`ObsoleteAttribute` 提供了另一个影响编译器行为的属性示例。它的目的是通过提供一种方式告知调用者某个成员或类型不再是当前的，从而帮助代码的版本控制。列表\
  \ 18.25 提供了 `ObsoleteAttribute` 用法的示例。如输出 18.9 所示，任何调用标记有 `ObsoleteAttribute` 成员的代码的调用者都会导致编译时警告，并可选地导致错误。\n\
  \n### 列表 18.25：使用 `ObsoleteAttribute`\n\n点击此处查看代码图像\n\n```cs\nclass Program\n\n\
  {\n  public static void Main()\n  {\n      ObsoleteMethod();\n  }\n  [Obsolete]\n\
  \  public static void ObsoleteMethod()\n  {\n  }\n}\n```\n\n### 输出 18.9\n\n点击此处查看代码图像\n\
  \n```text\nc:\\SampleCode\\ObsoleteAttributeTest.cs(24,17): warning CS0612:\n\n\
  Program.ObsoleteMethod()' is obsolete\n```\n\n在这种情况下，`ObsoleteAttribute` 仅显示一个警告。然而，该属性还有两个额外的构造函数。第一个构造函数\
  \ `ObsoleteAttribute(string message)` 将额外的消息参数附加到编译器的弃用消息之后。此消息的最佳实践是提供关于什么可以弃用代码的指导。第二个构造函数是一个\
  \ `bool error` 参数，它强制将警告记录为错误。\n\n`ObsoleteAttribute` 允许第三方通知开发者已弃的 API。警告（而非错误）允许原始\
  \ API 在能够更新调用代码之前继续工作。\n\n## 开始 4.0\n\n## 使用动态对象进行编程\n\nC# 4.0 中引入的动态对象简化了许多编程场景，并实现了若干以前无法的新场景。其核心是，使用动态对象进行编程允许开发者使用动态分发机制来编写操作，该机制将在运行时执行时解析，而不是由编译器在编译时进行验证和绑定。\n\
  \n为什么呢？很多时候，对象本质上不是静态类型的。示例包括从 XML/CSV 文件、数据库表、Internet Explorer DOM 或 COM 的 `IDispatch`\
  \ 接口加载数据，或者调用动态语言（如 IronPython 对象）中的代码。C# 4.0 对 `Dynamic` 对象的支持为与不一定具有编译时定义结构的运行时环境通信提供了一种解决方案。在\
  \ C# 4.0 动态对象的初始实现中，提供了四种绑定方法：\n\n1. 针对底层 CLR 类型使用反射\n2. 调用自定义的 `IDynamicMetaObjectProvider`\
  \ 以获取 `DynamicMetaObject`\n3. 通过 COM 的 `IUnknown` 和 `IDispatch` 接口调用\n4. 调用由 IronPython\
  \ 等动态语言定义的类型\n\n在这四种方法中，我们将深入研究前两种。它们底层的原理可以无缝地应用到其余情况中——COM 互操作性和动态语言互操作性。\n\n\
  ### 使用 `dynamic` 调用反射\n\n反射的关键功能之一是能够根据执行时识别的成员名称或其他特征（例如属性），动态地查找并调用类型上的成员（参见列表\
  \ 18.3）。然而，C# 4.0 添加的动态对象提供了一种更简单的通过反射调用成员的方法，前提是可以在编译时知道成员的签名。重申一下，此限制说明在编译时，我们需要知道成员名称以及签名（参数的数量以及指定参数是否与签名类型兼容）。列表\
  \ 18.26（配合输出 18.10）提供了一个示例。\n\n## 4.0\n\n### 列表 18.26：使用反射进行动态编程\n\n点击此处查看代码图像\n\
  \n```cs\nusing System;\n\n// ...\n\ndynamic data =\n  \"Hello!  My name is Inigo\
  \ Montoya\";\n\nConsole.WriteLine(data);\n\ndata = (double)data.Length;\n\ndata\
  \ = data * 3.5 + 28.6;\n\nif(data == 2.4 + 112 + 26.2)3\n{\n  Console.WriteLine(\n\
  \      $\"{ data } makes for a long triathlon.\");\n}\nelse\n{\n  data.NonExistentMethodCallStillCompiles();\n\
  }\n\n// ...\n```\n\n3。分别是铁人三项锦标赛中游泳、自行车和跑步阶段的距离（英里）。\n\n### 输出 18.10\n\n点击此处查看代码图像\n\
  \n```text\nHello!  My name is Inigo Montoya\n\n140.6 makes for a long triathlon.\n\
  ```\n\n在这个示例中，没有显式代码来确定对象类型、查找特定的 `MemberInfo` 实例然后调用它。相反，`data` 被声明为 `dynamic`\
  \ 类型，并在上面调用方法。在编译时，不会检查成员是否存在。然而，类型安全性并没有被放弃。对于标准的 CLR 类型（如列表 18.26 中的类型），在编译时使用的相同类型检查器改为在运行时调用。在执行时，如果没有此类成员，调用将导致\
  \ `Microsoft.CSharp.RuntimeBinder.RuntimeBinderException`。\n\n注意，这种能力的灵活性远不如之前描述的反射，尽管\
  \ API 无疑更简单。使用动态对象的关键区别在于，需要在运行时而不是编译时（正如我们解析参数时那样）识别签名。\n\n## dynamic 原理与行为\n\n\
  列表 18.26 及其说明文字揭示了 `dynamic` 类型的若干特征：\n\n* `dynamic` 是一个编译器生成代码的指令。\n  `dynamic`\
  \ 涉及一种拦截机制，以便当运行时遇到动态调用时，它可以将请求编译为 CIL，然后调用新编译的调用。（更多信息请参见本章稍后的“高级主题：揭秘 `dynamic`”。）\n\
  \  当类型赋值给 `dynamic` 时，其原理是在概念上“包装”原始类型，以便不发生编译时验证。此外，当在运行时调用成员时，包装器会拦截调用并进行适当的分发。在\
  \ `dynamic` 对象上调用 `GetType()` 会揭示动态实例的底层类型——它不会返回 `dynamic`。\n\n* 任何类型 (4) 都会转换为\
  \ `dynamic`。\n  在列表 18.26 中，我们成功地将值类型 (`double`) 和引用类型 (`string`) 强制转换为 `dynamic`。事实上，所有类型都可以成功转换为\
  \ `dynamic` 对象。从任何引用类型到 `dynamic` 有隐式转换，从值类型到 `dynamic` 有隐式转换（装箱转换），从 `dynamic`\
  \ 到 `dynamic` 也有隐式转换。这可能是显而易见的，但使用 `dynamic`，这个过程比简单地从一个位置拷贝“指针”（地址）要复杂。\n  技术上，它被限制任何可以转换为对象的类型——这排除了安全指针、Lambda\
  \ 表达式和方法组。\n\n* 从 `dynamic` 转换为替代类型的成功取决于底层类型的支持。\n\n\n\n\n从 `dynamic` 对象转换为标准的\
  \ CLR 类型是显式类型转换（例如，`(double)data.Length`）。意不意外的是，如果目标类型是值类型，则需要进行拆箱（unboxing）转换。如果底层类型支持转换为目标类型，则从\
  \ `dynamic` 的转换也将成功。\n\n-   `dynamic` 类型的底层类型可以从一次赋值变为下一次。\n\n与隐式类型变量（`var`）不同，后者不能重新赋值为不同的类型，而\
  \ `dynamic` 在执行底层类型代码之前包含一个编译拦截机制。因此，可以将底层类型实例成功地切换为完全不同的类型。这将导致另一个拦截调用点，该调用点在调用之前需要编译。\n\
  \n-   对底层类型上是否存在指定签的验证直到运行时才会发生——但它确实会发生。\n\n编译器对 `dynamic` 类型的操作的操作几乎不进行任何验证，如对\
  \ `data.NonExistentMethodCallStillCompiles()` 的方法调用所示。这一步完全留给代码执行时的运行时处理。此外，如果代码从未执行（即使周围的代码正在执行，如\
  \ `data.NonExistentMethodCallStillCompiles()`），则永远不会发生对成员的验证和绑定。\n\n-   任何 `dynamic`\
  \ 成员调用的结果的编译时类型均为 `dynamic`。\n\n对 `dynamic` 对象的任何成员的调用将返回一个 `dynamic` 对象。因此，如 `data.ToString()`\
  \ 的调用将返回一个 `dynamic` 对象，而不是底层 `string` 类型。然而，在执行时，当对 `dynamic` 对象调用 `GetType()`\
  \ 时，返回的是表示运行时类型的对象。\n\n-   如果指定的成员在运行时不存在，运行时将抛出 `Microsoft.CSharp.RuntimeBinder.RuntimeBinderException`\
  \ 异常。\n\n`4.0`\n\n如果在执行时确实尝试调用成员，运行时将验证该成员调用是否真实有效（例如，在反射的情况下，签名是否类型上兼容）。如果方法签名不兼容，运行时将抛出\
  \ `Microsoft.CSharp.RuntimeBinder.RuntimeBinderException`。\n\n-   带有反射的 `dynamic`\
  \ 不支持扩展方法。\n\n与使用 `System.Type` 进行反射一样，使用 `dynamic` 进行反射也不支持扩展方法。扩展方法的调用在实现类型（例如\
  \ `System.Linq.Enumerable`）上仍然可用，只是不能直接在 `dynamic` 类型上使用。\n\n-   从核心上讲，`dynamic`\
  \ 是一个 `System.Object`。\n\n由于任何对象成功转换为 `dynamic`，并且 `dynamic` 可以显式转换为不同的对象类型，因此 `dynamic`\
  \ 的行为就像 `System.Object`。像 `System.Object` 一样，它的默认值（`default(dynamic)`）甚至返回 `null`，表示它是一个引用类型。`dynamic`区别于\
  \ `System.Object` 的特殊动态行为只在编译时出现。\n\n## 为什么使用动态绑定？\n\n除了反射，我们还可以定义动态调用的自定义类型。例如，我们可能考虑使用动态调用来获取\
  \ XML 元素的值。与其使用列表 18.27 中的强类型语法，不如使用动态调用来调用 `person.FirstName` 和 `person.LastName`。\n\
  \n**列表 18.27：不使用 `dynamic` 到 XML 元素的运行时绑定**\n\n点击此处查看代码图像\n\n```\nusing System;\n\
  \nusing System.Xml.Linq;\n\n// ...\n\nXElement person = XElement.Parse(\n\n   @\"\
  <Person>\n\n     <FirstName>Inigo</FirstName>\n\n     <LastName>Montoya</LastName>\n\
  \n</Person>\");\n\nConsole.WriteLine(\"{0} {1}\",\n\n  person.Descendants(\"FirstName\"\
  ).FirstOrDefault().Value,\n\n  person.Descendants(\"LastName\").FirstOrDefault().Value);\n\
  \n// ...\n```\n\n`4.0`\n\n虽然列表 18.27 中的代码并不复杂，但请将其与列表 18.28 进行比较——这是使用动态类型对象的替代方法。\n\
  \n**列表 18.28：使用 `dynamic` 到 XML 元素的运行时绑定**\n\n点击此处查看代码图像\n\n```\nusing System;\n\
  \n// ...\n\n// 动态 Xml 列表请参见列表 13.32。\n\ndynamic person = DynamicXml.Parse(\n  @\"\
  <Person>\n\n      <FirstName>Inigo</FirstName>\n      <LastName>Montoya</LastName>\n\
  \n  </Person>\");\n\nConsole.WriteLine(\n      $\"{ person.FirstName } { person.LastName\
  \ }\");\n\n// ...\n```\n\n优势是显而易见的，但这是否意味着动态编程优于静态编译？\n\n## 静态编译与动态编程\n\n在列表 18.28\
  \ 中，我们拥有与列表 18.27 相同的功能，尽管有一个非常重要的区别：列表 18.27 完全是静态类型的。因此，在编译时，所有类型及其成员签名都经过了验证。\n\
  \n\n\n总而言之，在某些情况下，类型安全无法——可能无法——进行某些检查。在这些情况下，执行动态调用（仅在运行时验证，而不是在编译时也验证）的代码更具可读性且更简洁。显然，如果可以进行编译时验证，则优先选择静态类型编程，因为可以伴随其易读且简洁的\
  \ API。然而，在编译时验证无效的情况下，C# 4.0 的动态功能允许程序员编写更简单的代码，而不是强调类型安全的纯洁性。\n\n### 实现自定义动态对象\n\
  \nListing 18.28 包含对 `DynamicXml.Parse(...)` 的方法调用，该调用本质上是 `DynamicXml` 的工厂方法调用——它是一个自定义类型，而不是\
  \ CLR 框架内置的类型。然而，`DynamicXml` 并没有实现 `FirstName` 或 `LastName` 属性。这样做会破坏在执行时从 XML\
  \ 文件检索数据的动态支持，而不是促进基于编译时的 XML 元素实现。换句话说，`DynamicXml` 不使用反射来访问其成员，而是根据 XML 内容动态绑定到值。\n\
  \n定义自定义动态类型的关键是实现 `System.Dynamic.IDynamicMetaObjectProvider` 接口。然而，与其从头实现该接口，首选的方法是从\
  \ `System.Dynamic.DynamicObject` 派生自定义动态类型。这为许多成员提供了默认实现，并允许你覆盖不符合要求的成员。Listing\
  \ 18.29 显示了完整的实现。\n\n`4.0`\n\n**Listing 18.29: 实现自定义动态对象**\n\n点击此处查看代码图像\n\n```csharp\n\
  using System;\n\nusing System.Dynamic;\n\nusing System.Xml.Linq;\n\npublic class\
  \ DynamicXml : DynamicObject\n\n{\n\n  private XElement Element { get; set; }\n\n\
  \  public DynamicXml(System.Xml.Linq.XElement element)\n  {\n\n      Element = element;\n\
  \n  }\n\n  public static DynamicXml Parse(string text)\n  {\n\n      return new\
  \ DynamicXml(XElement.Parse(text));\n\n  }\n\n  public override bool TryGetMember(\n\
  \n      GetMemberBinder binder, out object? result)\n  {\n\n      bool success =\
  \ false;\n\n      result = null;\n\n      XElement firstDescendant =\n\n       \
  \   Element.Descendants(binder.Name).FirstOrDefault();\n\n      if (firstDescendant\
  \ != null)\n      {\n\n          if (firstDescendant.Descendants().Any())\n    \
  \      {\n\n              result = new DynamicXml(firstDescendant);\n\n        \
  \  }\n          else\n          {\n\n              result = firstDescendant.Value;\n\
  \          }\n\n          success = true;\n      }\n\n      return success;\n  }\n\
  \n  public override bool TrySetMember(\n\n      SetMemberBinder binder, object value)\n\
  \  {\n\n      bool success = false;\n\n      XElement firstDescendant =\n\n    \
  \      Element.Descendants(binder.Name).FirstOrDefault();\n\n      if (firstDescendant\
  \ != null)\n      {\n\n          if (value.GetType() == typeof(XElement))\n    \
  \      {\n\n              firstDescendant.ReplaceWith(value);\n          }\n   \
  \       else\n          {\n              firstDescendant.Value = value.ToString();\n\
  \          }\n\n          success = true;\n      }\n\n      return success;\n  }\n\
  }\n```\n\n`4.0`\n\n此用例的关键动态实现方法是 `TryGetMember()` 和 `TrySetMember()`（假设你也想分配元素）。只需要这两种方法的实现即可支持动态获取器和设置器属性的调用。此外，这些实现非常直观。首先，它们检查包含的\
  \ `XElement`，寻找与 `binder.Name`（即被调用的成员名称）相同的元素。如果存在相应的 XML 元素，则检索（或设置）值。如果元素存在，则返回值设置为\
  \ `true`，如果不存在则设置为 `false`。返回 `false` 将立即导致运行时在动态成员调用的调用处抛出 `Microsoft.CSharp.RuntimeBinder.RuntimeBinderException`。\n\
  \n如果需要更多的动态调用，`System.Dynamic.DynamicObject` 支持额外的虚拟方法。Listing 18.30 生成了所有可重写成员的列表。\n\
  \n`4.0`\n\n**Listing 18.30: System.Dynamic.DynamicObject 上的可重写成员**\n\n点击此处查看代码图像\n\
  \n```csharp\nusing System.Dynamic;\n\npublic class DynamicObject : IDynamicMetaObjectProvider\n\
  \n{\n\n  protected DynamicObject();\n\n  public virtual IEnumerable<string> GetDynamicMemberNames();\n\
  \n  public virtual DynamicMetaObject GetMetaObject(\n      Expression parameter);\n\
  \n  public virtual bool TryBinaryOperation(\n      BinaryOperationBinder binder,\
  \ object arg,\n\n          out object result);\n\n  public virtual bool TryConvert(\n\
  \      ConvertBinder binder, out object result);\n\n  public virtual bool TryCreateInstance(\n\
  \      CreateInstanceBinder binder, object[] args,\n\n            out object result);\n\
  \n  public virtual bool TryDeleteIndex(\n      DeleteIndexBinder binder, object[]\
  \ indexes);\n\n  public virtual bool TryDeleteMember(\n      DeleteMemberBinder\
  \ binder);\n\n  public virtual bool TryGetIndex(\n      GetIndexBinder binder, object[]\
  \ indexes,\n\n            out object result);\n\n  public virtual bool TryGetMember(\n\
  \      GetMemberBinder binder, out object result);\n\n  public virtual bool TryInvoke(\n\
  \      InvokeBinder binder, object[] args,\n\n            out object result);\n\n\
  \  public virtual bool TryInvokeMember(\n      InvokeMemberBinder binder, object[]\
  \ args,\n\n            out object result);\n\n  public virtual bool TrySetIndex(\n\
  \      SetIndexBinder binder, object[] indexes,保护 object value);\n\n  public virtual\
  \ bool TrySetMember(\n      SetMemberBinder binder, object value);\n\n  public virtual\
  \ bool TryUnaryOperation(\n      UnaryOperationBinder binder, out object result);\n\
  \n}\n```\n\n如 Listing 18.30 所示，所有内容都有成员实现——从类型转换、各种操作到索引调用。此外，还有一个方法用于检索所有可能的名称：`GetDynamicMemberNames()`。\n\
  \n`End 4.0`\n\n### 总结\n\n本章讨论了如何使用反射来读取编译到 CIL 中的元数据。使用反射可以提供延迟绑定，其中调用的代码是在运行时定义的，而不是在编译时。尽管反射对于部署动态系统是完全可行的，但它的执行速度比静态链接（编译时）定义的代码慢得多。这使得它在对性能可能不那么的开发工具中更为常见和有用。反射还允许以属性（attributes）的形式检索各种构造的额外元数据。通常，使用反射来查找自定义属性。你可以定义自己的自定义属性，将你选择的额外元数据插入\
  \ CIL 中。在运行时，你可以检索这些元数据并将其用于编程逻辑。许多程序员将属性视为“面向切面编程”概念的前身，在那种编程中，你通过属性等构造来添加功能，而不是在需要的地方手动实现功能。可能还需要一段时间你才能在\
  \ C# 中看到真正的切面（如果会有的话）；但属性为该方向提供了一个清晰的脚石，而不会对语言的稳定性产生重大风险。最后，本章探讨了 C# 4.0 引入的一个特性——使用新的\
  \ `dynamic` 类型进行动态编程。\n\n下一章将多线程，其中属性被用于同步。\n\n\n\n\n过去十年的两个重大趋势对软件开发领域产生了巨大影响。首先，计算成本的持续下降不再是由时钟频率和晶体管密度的增加驱动的，如图\
  \ 19.1 所示。计算成本现在的下降是因为制造包含多个 CPU 的硬件已变得经济高效。\n\n![散点图描述了从 1970 年到 2020 年微处理器速度的增长。](img/19fig01.jpg)\n\
  \n**图 19.1：随时间变化的时钟频率**\n\n其次，现在的计算通常涉及巨大的 `latency`（延迟）。简单来说，延迟就是获取所需结果需要的时间。延迟有两个主要原因。当计算任务复杂时，会发生`Processor-bound\
  \ latency`（处理器型延迟）；如果一次计算需要执行 120 亿次算术运算，而可用总处理能力仅为每秒 60 亿次，那么在请求结果到获取结果之间至少会产生\
  \ 2 秒的处理器型延迟。相比之下，`I/O-bound latency`（I/O 型延迟）是指需要从磁盘驱动器、Web 服务器等外部源获取数据而产生的延迟。任何需要从物理位置距离客户端机器很远的\
  \ Web 服务器获取数据的计算，都将产生等于数百万个处理器周期的延迟。\n\n这两个趋势共同为现代软件开发人员带来了巨大的挑战。鉴于机器的计算能力比以往任何时候都强，我们该如何有效利用这些力量快速向用户交付结果，同时又不损害用户体验？我们该如何避免创建出在高延迟操作触发时会卡死的令人沮丧的用户界面？此外，我们该如何将\
  \ CPU 密集型工作分配给多个处理器，以缩短计算所需的时间？\n\n保持用户界面响应和高 CPU 利用率的软件工程标准技术是编写`multithreaded`（多线程）程序，并行执行多次计算。遗憾的是，多线程逻辑以难以正确著称；我们在接下来的四个章节中探索导致多线程变得困难的原因，并学习如何使用高级别的抽象和新语言特性来减轻这种负担。\n\
  \n第一个高级别的抽象是 Parallel Extensions（并行扩展）库，它随 `.NET 4.0` 发布。它包含了在本章中讨论的 `Task Parallel\
  \ Library (TPL)`（任务并行库），以及在第 21 章中讨论的 `Parallel LINQ (PLINQ)`。第二个高级别的抽象是 `Task-based\
  \ Asynchronous Pattern (TAP)`（基于任务的异步模式）及其在 `C# 5.0` 及更高版本中的语言支持。\n\n尽管我强烈建议你使用这些高级抽象，但在本章末尾也介绍了\
  \ `.NET` 运行时以前版本的某些低级线程 API。`C# 5.0` 之前的其他多线程模式可以在 [`IntelliTect.com/EssentialCSharp`](http://IntelliTect.com/EssentialCSharp)\
  \ 下载，连同 *Essential C# 3.0* 的章节。因此，如果你想在没有后期功能的情况下完全理解多线程编程资源，你仍然可以访问这些材料。\n\n我将从几个初级主题开始本章，以防你是是多线程的新手。\n\
  \n![思维图描述了多线程引言中讨论的主题。这包括(1) 多线程基础，(2) 异步任务，(3) 任务取消和(4) 系统线程。](img/19mindmap.jpg)\n\
  \n### 多线程基础\n\n然而，上下文切换不是免费的；必须将 CPU 当前的内部状态保存到内存中，并加载与新线程关联的状态。同样，如果 `thread A`\
  \ 正在一段内存进行大量操作，而 `thread B` 对另一段内存进行大量工作，它们之间的上下文切换可能意味着从 `thread A` 加载到缓存的所有数据都将被\
  \ `thread B` 的数据替换（反之亦然）。如果线程太多，切换开销可能会开始影响性能。增加线程可能会进一步降低性能，直到处理器花费在在一个线程和另一个线程之间切换的时间超过了完成每个线程工作的时间。\n\
  \n即使我们忽略上下文切换的成本，时间分片（time slicing）本身也会对性能产生巨大影响。例如，假设有两个处理器型的高延迟任务，每个任务都在计算两个各包含\
  \ 10 亿数字的列表的平均值。假设处理器每秒可以执行 10 亿次操作。如果这两个任务各关联一个线程，且两个线程都有自己的核心，显然我们可以在 1 秒内获得两个结果。\n\
  \n然而，如果这两个线程共享一个处理器，时间分片将在一个线程上执行几十万次操作，然后切换到另一个线程，然后再回来，依此类推。每个任务将总共消耗 1 秒的处理器时间，因此两个结果将在\
  \ 2 秒后可用，导致平均完成时间为 2 秒。（再次，我们忽略了上下文切换的成本。）\n\n如果我们将这两个任务分配给单个线程，由它执行第一个任务，并在第一个任务完成后甚至不启动第二个任务，那么第一个任务的结果将在\
  \ 1 秒内获得，后续任务的结果将在 1 秒后获得，导致平均时间为 1.5 秒（任务在 1 秒或 2 秒内完成任一个，因此平均在 1.5 秒内完成）。\n\n\
  #### 大多数操作不是原子的\n\n原子操作（atomic operation）是指始终被观察为：未开始或已完成的操作。它的状态永远不会对外显示为“进行中”。例如，考虑以下代码片段：\n\
  \n点击此处查看代码\n\n```\nif (bankAccounts.Checking.Balance >= 1000.00m)\n{\n  bankAccounts.Checking.Balance\
  \ -= 1000.00m;\n  bankAccounts.Savings.Balance += 1000.00m;\n}\n```\n\n这种操作——检查可用资金，然后扣除一个账户并增加另一个账户——需要是原子的。换句话说，为了使其正确执行，我们必须确保永远不存在某个时刻该操作被观察为已部分完成。例如，假设有两个线程并发运行此代码。可能两个线程都验证了账户中有足够的资金，然后两个线程都进行了资金转账，即使账户中的资金仅足够进行一次转账。事实上，情况要糟糕得多：这段代码片段中*没有任何*操作是原子的！即使是复合加/减法或读取和写入\
  \ decimal 类型的属性，在 `C#` 中都是非原子操作。因此，在多线程场景下，它们所有都可能被观察为“部分完成”——仅被部分增加或减少。这种由于部分完成的非原子操作导致的状态不一致观察是一个更广泛的问题的特例，称为\
  \ `race condition`（竞态条件）。\n\n#### 竞态条件引起的不确定性\n\n\n\n\n正如我们之前讨论过的，并发通常通过时间分片来实现。在没有特殊线程同步的情况下（我们将在第\
  \ 22 章中详细讨论），操作系统可以在它选择的任何时间在任何两个线程之间切换上下文。因此，当两个线程访问同一个对象时，哪个线程赢得竞争并先运行是不可预测的。例如，如果在之前给出的代码段中有两个线程在运行，可能一个线程会赢得竞争并在第二个线程获得运行机会之前一直运行到末尾。也可能上下文切换发生在第一个线程完成余额检查之后，然后第二个线程可能会赢得竞争并先运行到末尾。\n\
  \n包含竞态条件的代码行为取决于上下文切换的时机。这种依赖关系引入了程序执行的不确定性。一个指令相对于另一个线程中指令的执行顺序是未知的。最糟糕的是，包含竞态条件的代码在\
  \ 99.9% 的情况下表现都是正确的，但在每千次中的某一次，由于时机的巧合另一个另一个会赢得竞争。这种不可预测性正是多线程编程变得如此困难的原因。\n\n由于这种竞态条件在实验室中很难复制，多线程代码的很大质量保证取决于长时间的压力测试、专门设计的代码分析工具，以及专家对代码分析和代码审查的大量投入。也许比这些任何一点都更重要的是保持事物尽可能简单的纪律。通常，为了假设的性能，开发者会尝试避免使用锁（lock）这种简单的方法，转而追求更底层的原语，例如原子操作（interlocked\
  \ operations）和易变变量（volat），这增加了代码出错的可能性。“保持简单”可能是良好的多线程编程最重要的准则之一。\n\n第 22 章 是关于处理竞态条件的技术。\n\
  \n## 内存模型是复杂的\n\n竞态条件的存在（即两个控制点以不可预测且不一致的速度“竞争”通过一段代码）已经很糟糕了，但情况变得更糟。考虑运行在两个不同处理器上但正在访问某个对象相同字段的两个线程。现代处理器并没有在每次使用变量时都实际访问主内存。相反，它们会在处理器的特殊缓存内存中创建本地副本；这些缓存会定期与主内存进行同步。这意味着在两个不同处理器上读取和写入同一位置的两个线程实际上可能无法观察到彼此对该内存的更新，或者观察到不一致的结果。本质上，我们在这里遇到的是取决于处理器何时选择同步其缓存的竞态条件。\n\
  \n## 锁会导致死锁\n\n显然，必须存在机制将非原子操作变为原子操作，指示操作系统调度线程以避免竞态，并确保在必要时同步处理器缓存。在 C# 程序中解决所有这些问题的主要机制是\
  \ `lock` 语句。该语句允许开发者将一段代码识别为“关键”代码，一次只能有一个线程处于该代码中；如果多个线程尝试进入关键区域，操作系统将挂起^(2)除一个之外的所有线程。操作系统还确保在遇到锁时正确同步处理器缓存。\n\
  \n2。通过让线程睡眠、自旋线程（spinning），或在将其放回睡眠模式之前自旋并重复。\n\n然而，锁也会引入自身的问题（以及性能开销）。最重要的是，如果线程之间获取锁的顺序发生变化，可能会发生死锁，导致线程冻结，每个线程都在等待对方释放锁。\n\
  \n例如，考虑图 19.2。\n\n![一张表格显示了线程 A 和 B 的死锁时间线。](img/19fig02.jpg)\n\n**图 19.2：死锁时间线**\n\
  \n此时，每个线程在继续之前都在等待另一个线程，因此每个线程都被阻塞，导致该代码执行的整体死锁。\n\n我们将在第 22 章中详细讨论各种锁定技术。\n\n`Begin\
  \ 4.0`\n\n### 异步任务\n\n多线程编程包括以下复杂性：\n\n1. *监控异步操作状态以等待完成：* 这包括确定异步操作何时完成，最好不是通过轮询线程状态或通过阻塞等待来实现。\n\
  2. *线程池：* 这避免了启动和销毁线程的巨大代价。此外，线程池避免了创建过多的线程，导致系统在切换线程上花费的时间多于运行线程。\n3. *避免死锁：* 这涉及在尝试保护数据不受两个不同线程同时访问的同时，防止死锁的发生。\n\
  4. *跨操作提供原子性并同步数据访问：* 在一组操作周围添加同步，可以确保操作作为单个单元执行，并且它们被另一个线程恰当地中断。提供锁是为了防止两个不同的线程同时访问数据。\n\
  \n此外，任何方法运行时间很长时，可能都需要多线程编程——即异步调用该长时间运行的方法。遗憾的是，C# 5.0 之前的多线程编程需要使用相对低级的 `System.Threading.Thread`\
  \ 类，该类几乎没有模式可以避免这些这些复杂性。\n\n然而，随着开发者编写越来越多的多线程代码，出现了一组处理这些场景的常见场景和编程模式。而且，为了简化编程模型，C#\
  \ 5.0 将这些模式法典化，引入了新的线程类型 `System.Threading.Tasks.Task`，通过利用 .NET 4.0 的 TPL^(4) 并使用新结构增强\
  \ C# 语言以支持它，极大地增强了其中一种模式——TAP^(3) 的可编程性。本节和接下来的章节将深入探讨 TPL 本身的细节，然后是带有 `async`/`await`\
  \ 上下文关键字的简化 TAP 编程的 TPL。\n\n`4.0`\n\n3。提醒一下，TAP = Task-based Asynchronous Pattern（基于任务的异步模式）。\n\
  4。提醒一下，TPL = Task Parallel Library（任务并行库）。\n\n### 为什么用 TPL？\n\n创建一个线程是一个昂贵的操作，每个线程都会消耗大量的虚拟内存（例如在\
  \ Windows 上默认为 1 MB）。使用线程池在需要时分配线程、将异步工作分配给线程、运行工作直到完成，然后重用该线程处理后续异步工作，可能比在工作完成后销毁线程稍后创建新线程要高效得多。\n\
  \n\n\n在 .NET Framework 4 及更高版本中，TPL 不再在每次启动异步工作时都创建一个操作系统线程，而是创建一个 `Task` 并告诉 `task\
  \ scheduler`（任务调度器）有异步工作需要执行。任务调度器可能会使用许多不同的策略来实现这一目的，但默认情况下，它会从线程池请求一个工作线程。线程池可能认为稍后在某些当前正在执行的任务完成后后再运行该任务会更有效，或者它可能决定将任务的工作线程调度在特定的处理器上。线程池会决定创建一个完全全新的线程还是重用之前已执行完毕的现有线程更有效。\n\
  \n通过将异步工作的概念抽象为 `Task` 对象，TPL 提供了一个表示异步工作的对象，并提供了一个用于与该工作交互的面向对象的 API。此外，通过提供一个表示工作单元的对象，TPL\
  \ 允许通过将小任务组合成大任务来程序化地构建工作流，正如我们将看到那样。\n\n任务（Task）是一个封装了异步执行的工作的对象。这听起来很熟悉：`delegate`（委托）也是一个表示代码的对象。任务和委托之间的区别在于，委托是`synchronous`（同步的），而任务是`asynchronous`（异步的）。执行一个委托——例如一个\
  \ `Action`——会立即将当前线程的控制权转移到委托的代码；在委托完成之前，控制权不会返回给调用者。相比之下，启动任务几乎立即就会控制权返回给调用者，无论任务必须执行多少工作。任务以异步方式执行，通常在另一个线程上执行（尽管正如我们在第\
  \ 20 章中所示，仅用一个线程异步执行任务是可能的甚至是有益的）。任务本质上是将委托从同步执行模式转换为异步执行模式。\n\n`4.0`\n\n### 引入异步任务\n\
  \n你知道委托何时时在当前线程上执行完毕，因为在委托完成之前，调用者无法做任何事情。但你如何知道任务何时完成，以及如果有结果，你又如何获取结果呢？考虑将同步委托转换为异步任务的示例。工作线程将向控制台写入点，而主线程将写入连字符。\n\
  \n启动任务会从线程池获取一个线程，创建第二个控制点，并在该线程上执行委托。如列表 19.1 所示，在调用启动任务（`Task.Run()`）之后，主线程上的控制点继续正常运行。\n\
  \n**列表 19.1: 调用异步任务**\n\n点击此处查看代码图像\n\n```\nusing System;\n\nusing System.Threading.Tasks;\
  \                                   \n\npublic class Program\n\n{\n\n  public static\
  \ void Main()\n  {\n\n      const int repetitions = 10000;\n\n      // 使用 Task.Factory.StartNew<string>()\
  \ 用于\n\n      // .NET 4.5 之前的 TPL\n\n      Task task = Task.Run(() =>\n\n      \
  \    {\n\n              for(int count = 0;\n\n                  count < repetitions;\
  \ count++)\n              {\n\n                  Console.Write('-');\n         \
  \     }\n\n          });\n\n      for(int count = 0; count < repetitions; count++)\n\
  \      {\n          Console.Write('+');\n      }\n\n      // 等待 Task 完成\n\n    \
  \  task.Wait();\n  }\n\n}\n```\n\n`4.0`\n\n即要在新线程中运行的代码定义在传递给 `Task.Run()` 方法的委托（在此例中类型为\
  \ `Action`）中。该委托（表达式的形式）反复向控制台打印横线。启动任务后的循环几乎完全相同，区别在于它显示加号。\n\n注意，在调用 `Task.Run()`\
  \ 之后，作为参数传递的 `Action` 立即开始执行。该 `Task` 被称为“热”的（hot），意味着它已经被触发开始执行——与“冷”的（cold）任务相反，后者在异步工作开始之前需要显式启动。\n\
  \n尽管可以通过 `Task` 构造函数在冷状态下实例化 `Task`，但这样做通常只适用于 API 内部的实现细节，即返回一个已经在运行的（热的）`Task`，该任务是由调用\
  \ `Task.Start()` 触发的。\n\n注意，紧接调用 `Run()` 之后，热任务的确切状态是不确定的。其行为由操作系统、其负载以及相应的任务库共同决定。这种组合决定了\
  \ `Run()` 是选择立即执行任务的工作线程，还是推迟到可用额外资源。事实上，可能当调用线程的代码再次获得执行机会时，热任务已经完成了。对 `Wait()`\
  \ 的调用强制主线程等待，直到分配给任务的所有工作执行完毕。\n\n在这种场景下，我们有一个任务，但也可能许多任务正在异步运行。通常情况下，有一组任务，你想等待其中所有任务都完成，或者等待其中任何一个任务完成，然后再继续当前线程的执行。`Task.WaitAll()`\
  \ 和 `Task.WaitAny()` 方法正是为此设计的。\n\n到目前为止，我们已经看到任务如何获取一个 `Action` 并异步地运行它。但如果任务中执行的工作返回结果呢？我们可以使用\
  \ `Task<T>` 类型来异步运行 `Func<T>`。当同步地执行委托时，我们知道在结果可用之前控制权不会返回。当异步地执行 `Task<T>` 时，我们可以从一个线程对其进行轮询以检查它是否完成，并在完成时获取结果。(5)\
  \ 列表 19.2 演示了如何在控制台应用程序中这样做。注意，此示例使用了 `PiCalculator.Calculate()` 方法，我们将在第 21 章中的“并行执行循环迭代”节中进一步探讨。\n\
  \n`4.0`\n\n5. 使用这种轮询技术时要格外小心。当我们从委托创建任务时（如我们这里所示），任务将被调度在线程池的工作线程上运行。结果是，当前线程将循环，直到工作线程上的工作完成。这种技术是有效的，但它可能会不必要地消耗\
  \ CPU 资源。如果你不是将任务调度在工作线程上运行，而是将其调度在未来在当前线程上执行，那么这种轮询技术就是危险的。因为当前线程正在循环轮询任务，它将导致死循环，因为在当前线程退出循环之前，任务不会完成。\n\
  \n\n\n\n\n```cs\nusing System;\n\nusing System.Threading.Tasks;\n\npublic class\
  \ Program\n{\n\n  public static void Main()\n  {\n\n      // Use Task.Factory.StartNew<string>()\
  \ for\n\n      // TPL prior to .NET 4.5\n      Task<string> task =\n          Task.Run<string>(\n\
  \              () => PiCalculator.Calculate(100));\n\n      foreach(\n         \
  \ char busySymbol in Utility.BusySymbols())\n      {\n          if(task.IsCompleted)\n\
  \          {\n              Console.Write('\\b');\n              break;\n      \
  \    }\n          Console.Write(busySymbol);\n      }\n      Console.WriteLine();\n\
  \      Console.WriteLine(task.Result);\n      System.Diagnostics.Trace.Assert(\n\
  \          task.IsCompleted);\n  }\n}\n\npublic class PiCalculator\n{\n\n  public\
  \ static string Calculate(int digits = 100)\n  {\n      // ...\n  }\n}\n\npublic\
  \ class Utility\n{\n\n  public static IEnumerable<char> BusySymbols()\n  {\n   \
  \   string busySymbols = @\"-\\|/-\\|/\";\n      int next = 0;\n      while(true)\n\
  \      {\n          yield return busySymbols[next];\n          next = (next + 1)\
  \ % busySymbols.Length;\n          yield return '\\b';\n      }\n  }\n}\n```\n\n\
  `4.0`\n此列表显示任务的数据类型为 `Task<string>`。该泛型类型包含一个 `Result` 属性，可以通过该属性获取 `Task<string>`\
  \ 执行的 `Func<string>` 返回的值。\n\n请注意，Listing 19.2 并没有调用 `Wait()`。相反，从 `Result` 属性读取会导致当前线程阻塞，直到结果可用（如果它尚未可用的话）；在这种情况下，我们知道在获取结果时它已经完成了。\n\
  \n除了 `Task<T>` 上的 `IsCompleted` 和 `Result` 属性外，还有几个属性也值得注意：\n\n- `IsCompleted` 属性在任务完成时被设置为\
  \ `true`，无论任务是正常完成还是发生故障（即：任务因为抛出异常而结束）。通过读取 `Status` 属性可以获取有关任务状态的更详细信息，该属性返回一个\
  \ `TaskStatus` 类型的值。可能的值有 `Created`、`WaitingForActivation`、`WaitingToRun`、`Running`、`WaitingForChildrenToComplete`、`RanToCompletion`、`Canceled`\
  \ 和 `Faulted`。当 `Status` 为 `RanToCompletion`、`Canceled` 或 `Faulted` 时，`IsCompleted`\
  \ 为 `true`。当然，如果任务在另一个线程上运行而你读取到的状态为运行，那么状态可能会任何时间变为完成，包括在你读取属性值之后立即。许多其他状态也是如此——即使是\
  \ `Created` 也可能在另一个线程启动它时发生变化。只有 `RanToCompletion`、`Canceled` 和 `Faulted` 可以被认为不再发生转换的最终状态。\n\
  \n- 可以 `Id` 属性的值唯一标识一个任务。静态 `Task.CurrentId` 属性提供当前执行的 `Task` 的标识符（即正在执行 `Task.CurrentId`\
  \ 调用的任务）。这些属性在调试时特别有用。\n\n- 你可以使用 `AsyncState` 将附加数据与任务关联。例如，想象有一个 `List<T>`，其值将由各种任务计算。每个任务都可以包含\
  \ `AsyncState` 属性中值的索引。这样，当任务完成时，代码就可以使用 `AsyncState` 索引访问列表（首先将其转换为 `int`）。\n\n\
  6。当使用任务异步变异集合时要小心。任务可能运行在工作线程上，而集合可能不是线程安全的。在任务完成后，从主线程填充集合会更安全一些。\n\n`4.0`\n我们将在本章后半部分在“取消取消任务””下讨论其他有用的属性。\n\
  \n#### 任务延续 (Task Continuation)\n\n我们已经多次谈过程序的控制流，但从未说过控制流的最根本本质是什么：控制流决定了接下来会发生什么。当你有一个简单的控制流，如\
  \ `Console.WriteLine(x.ToString());` 时，控制流告诉你，当 `ToString` 正常完成时，接下来发生的事情将是调用 `WriteLine`\
  \ 并将返回的值作为参数。“接下来会发生什么”的概念被称为**延续（continuation）**；控制流中的每个点都有一个延续。在我们的示例中，`ToString`\
  \ 的延续是 `WriteLine`（而 `WriteLine` 的延续是后续语句中运行的任何代码）。延续的概念对于 C# 编程来说是如此基础，以至于大多数程序员甚至不会考虑到它；它是他们呼吸的无形空气的一部分。C#\
  \ 编程的行为就是在延续之上不断构建延续，直到整个程序的控制流完成完毕。\n\n请注意，在普通的 C# 程序中，给定代码段的延续将在该代码完成后立即执行。当 `ToString()`\
  \ 返回时，当前线程上的控制点会立即对 `WriteLine` 进行同步调用。同时注意，给定代码段实际上有两种可能的延续：正常延续和当当前代码段抛出异常时将执行的异常延续。\n\
  \n`4.0`\n异步方法调用（例如启动一个 `Task`）为控制流增加了一个额外的维度。通过异步 `Task` 调用，控制流会立即跳转到 `Task.Start()`\
  \ 之后的语句，与此同时，它也开始在 `Task` 的体内部执行。换句话说，当异步是多维的时，接下来会发生什么。与异常不同（异常延续只是另一条路径），延续是一条额外的、并行的路径。\n\
  \n异步任务还允许通过描述异步延续来将小任务组合成大任务。就像普通流一样，任务可以有不同的延续来处理错误情况，任务可以通过它们的延续融合在一起。实现这一点的有多种技术，其中最显式的是\
  \ `ContinueWith()` 方法（参见 Listing 19.3 及其对应的输出 Output 19.1）。\n\n\n\n\n\n`ContinueWith()`\
  \ 方法允许将两个任务“链”在一起，使得当前一个任务——**前置任务（antecedent task）**——完成时，第二个任务——**延续任务（continuation\
  \ task）**——会自动异步启动。例如，在列表 19.3 中，`Console.WriteLine(\"Starting...\")` 是前置任务的主体，而\
  \ `Console.WriteLine(\"Continuing A...\")` 是它的延续任务主体。延续任务接受一个 `Task` 作为其参数（`antecedent`），从而允许延续任务的代码访问前置任务的完成状态。当前置任务完成后，延续任务会自动启动，异步执行第二个委托程序，并将刚刚完成的前置任务作为参数传递给该委托程序。此外，由于\
  \ `ContinueWith()` 方法也会返回一个 `Task`，该 `Task` 可以用作另一个 `Task` 的前置任务，依此类推，形成一个可以任意长度的\
  \ `Task` 延续链。\n\n如果你在同一个前置任务上调用两次 `ContinueWith()`（如列表 19.3 所示，`taskB` 和 `taskC`\
  \ 代表 `taskA` 的延续任务），则前置任务（`taskA`）有两个延续任务，当前置任务完成后，两个延续任务都将异步执行。请注意，来自单个前置任务的延续任务的执行顺序在编译时是不确定的。输出\
  \ 19.1 恰好显示 `taskC` 在 `taskB` 之前执行，但在程序的第二次执行中，顺序可能会反过来。然而，`taskA` 始终会在 `taskB`\
  \ 和 `taskC` 之前执行，因为后者是 `taskA` 的延续任务，因此它们无法在 `taskA` 完成之前启动。同样，`Console.WriteLine(\"\
  Starting...\")` 委托始终会在 `taskA`（`Console.WriteLine(\"Continuing A...\")`）之前执行完毕，因为后者是前者的延续任务。此外，`Finished!`\
  \ 总是最后出现，因为调用了 `Task.WaitAll(taskB, taskC)`，这会阻塞控制流，直到 `taskB` 和 `taskC` 都完成。\n\n\
  `ContinueWith()` 有许多不同的重载版本，其中一些接受 `TaskContinuationOptions` 值来微调延续链的行为。这些值是标志位，因此可以使用逻辑或操作符（`|`）进行组合。一些可能的标志值的简要描述出现在表\
  \ 19.1 中；更多详情请参阅在线文档^(7)。\n\n7. Microsoft .NET Docs, [`docs.microsoft.com/dotnet/api/system.threading.tasks.taskcontinuationoptions`](https://docs.microsoft.com/dotnet/api/system.threading.tasks.taskcontinuationoptions)。\n\
  \n`4.0`\n\n| **枚举** | **描述** |\n| --- | --- |\n| `None` | 这是默认行为。无论前置任务的状态如何，在前置任务完成后都会执行延续任务。\
  \ |\n| `PreferFairness` | 如果两个任务都是异步启动的，且一个在另一个之前，无法保证先启动的任务实际上一定先运行。此标志请求任务调度器尝试增加先启动的任务成为先执行任务的概率——当你描述的两个任务由不同的线程池线程创建时，这一点尤为相关。\
  \ |\n| `LongRunning` | 这告诉任务调度器任务可能是一个 I/O 密集型高延迟任务。调度器随后可以处理其他队列工作，而不会因为长时间运行的任务导致饥饿。此选项应谨慎使用。\
  \ |\n| `AttachedToParent` | 指定指定任务应尝试附加到任务层次结构中的父任务上。 |\n| `DenyChildAttach` (.NET\
  \ 4.5) | 如果尝试创建子任务，将抛出异常。如果延续任务中的代码尝试使用 `AttachedToParent`，其行为将像没有父任务一样。 |\n| `NotOnRanToCompletion`\
  \ | 指定如果前置任务运行完成，则不调度延续任务。此选项对于多任务延续无效。 |\n| `NotOnFaulted` | 明如果前置任务抛出未处理的异常，则不调度延续任务。此选项对于多任务延续无效。\
  \ |\n| `OnlyOnCanceled` | 指定只有在前置任务被取消时，才调度延续任务。此选项对于多任务延续无效。 |\n| `NotOnCanceled`\
  \ | 指定如果前置任务被取消，则不调度延续任务。此选项对于多任务延续无效。 |\n| `OnlyOnFaulted` | 指定只有在前置任务抛出未处理的异常时，才调度延续任务。此选项对于多任务延续无效。\
  \ |\n| `OnlyOnRanToCompletion` | 指定只有在前置任务运行完成时，才调度延续任务。此选项对于多任务延续无效。 |\n| `ExecuteSynchronously`\
  \ | 指定延续任务应以同步方式执行。指定此选项后，延续任务尝试执行工作的线程是导致前置任务转换到最终状态的同一个线程。如果创建延续任务时前置任务已经完成，则延续任务将在创建它的线程上运行。\
  \ |\n| `HideScheduler` (.NET 4.5) | 防止环境调度器在创建的任务中被视为当前调度器。这意味着在创建的任务中执行的 `Run`/`StartNew`\
  \ 和 `ContinueWith` 操作将看到 `TaskScheduler.Default` (`null`) 作为当前调度器。当延续需要在特定调度器上运行，但延续本身调用了不应在该调度器上调度工作的代码时，这非常有用。\
  \ |\n| `LazyCancellation` (.NET 4.5) | 这导致延续任务在前置任务完成之前延迟监控提供的取消令牌。考虑任务 t1、t2 和\
  \ t3，后者是前者的延续任务。如果 t2 在 t1 完成之前被取消，则 t3 可能在 t1 完成之前启动。设置 `LazyCancellation` 可以避免这种情况。\
  \ |\n| `RunContinuationsAsynchronously` (.NET 4.6) | 当使用 `RunContinuationsAsynchronously`\
  \ 选项创建任务时，它告诉任务应强制其延续异步执行。即使该任务本身是延续任务，此选项也不会影响该任务的运行——只影响其延续任务的运行。延续任务可以同时使用 `TaskContinuationOptions\
  \ .ExecuteSynchronously` 和 `TaskContinuationOptions .RunContinuationsAsynchronously`。前者导致延续在前置任务完成后同步执行，并导致该延续的延续异步执行。\
  \ |\n\n|  |\n\n**表 19.1: 可用 `TaskContinuationOptions` 枚举列表**\n\n\n\n\n\n```cs\n\
  using System;\n\nusing System.Threading.Tasks;\n\nusing System.Diagnostics;\n\n\
  using AddisonWesley.Michaelis.EssentialCSharp.Shared;\n\npublic class Program\n\
  {\n  public static void Main()\n  {\n      // Use Task.Factory.StartNew<string>()\
  \ for\n      // TPL prior to .NET 4.5\n      Task<string> task =\n          Task.Run<string>(\n\
  \              () => PiCalculator.Calculate(10));\n\n      Task faultedTask = task.ContinueWith(\n\
  \          (antecedentTask) =>\n          {\n              Trace.Assert(antecedentTask.IsFaulted);\n\
  \              Console.WriteLine(\n                  \"Task State: Faulted\");\n\
  \          },\n          TaskContinuationOptions.OnlyOnFaulted);\n\n      Task canceledTask\
  \ = task.ContinueWith(\n          (antecedentTask) =>\n          {\n           \
  \   Trace.Assert(antecedentTask.IsCanceled);\n              Console.WriteLine(\n\
  \                  \"Task State: Canceled\");\n          },\n          TaskContinuationOptions.OnlyOnCanceled);\n\
  \      Task completedTask = task.ContinueWith(\n          (antecedentTask) =>\n\
  \          {\n              Trace.Assert(antecedentTask.IsCompleted);\n        \
  \      Console.WriteLine(\n                  \"Task State: Completed\");\n     \
  \     },  TaskContinuationOptions.\n                  OnlyOnRanToCompletion);\n\
  \      completedTask.Wait();\n  }\n}\n```\n\n`4.0`\n\n在此列表中，我们实际上为前置任务的 `events`（事件）注册了\
  \ `listeners`（监听器），这样当任务正常或异常完成时，特定的“监听”任务将将开始执行。这是一项强大的功能，特别是当原始任务是一个“触发后遗忘”（fire-and-forget）类型的任务时——即一个我们启动它、挂载了延续任务、然后再也不引用过它的任务。\n\
  \n在 Listing 19.4 中，请注意最后的 `Wait()` 调用是针对 `completedTask` 的，而不是 `task`——即使用 `Task.Run()`\
  \ 创建的原始前置任务。虽然每个委托的 `antecedentTask` 都是前置任务（`task`）的引用，但从委托监听器的外部，我们可以有效地丢弃对原始 `task`\
  \ 的引用。然后我们可以完全依赖于异步开始执行的延续任务，而无需任何后续代码来检查原始 `task` 的状态。\n\n在这种情况下，我们调用了 `completedTask.Wait()`，以便主线程在完成的输出出现之前退出程序（参见\
  \ Output 19.2）。\n\n**Output 19.2**\n\n```\nTask State: Completed.\n```\n\n在这种情况下，调用\
  \ `completedTask.Wait()` 显得有些生硬，因为我们知道原始任务将成功完成。然而，在 `canceledTask` 或 `faultedTask`\
  \ 上调用 `Wait()` 将导致异常。这些延续任务只有在前置任务被取消或抛出异常时才会运行；鉴于此程序中不会发生这种情况，这些任务永远不会被调度运行，等待它们完成将抛出异常。Listing\
  \ 19.1 中的延续选项恰好是互斥的，因此，当前置任务运行完成且与 `completedTask` 关联的任务执行时，任务调度器会自动取消与 `canceledTask`\
  \ 和 `faultedTask` 关联的任务。被取消的任务其状态被设置为 `Canceled`。因此，在这些任务的任一个上调用 `Wait()`（或任何会导致当前线程等待任务完成的调用）都将抛出异常，指示它们已取消。一种不那么生硬的方法可能是调用\
  \ `Task.WaitAny(completedTask, canceledTask, faultedTask)`，它将抛出一个 `AggregateException`，然后需要对其进行处理。\n\
  \n`4.0`\n\n#### 使用 `AggregateException` 对任务上的未处理异常进行处理\n\n当同步调用方法时，我们可以将其封装在带有 `catch`\
  \ 句的 `try` 块中，以告诉编译器在发生异常时我们想要执行哪些代码。然而，这在异步调用中行不可通。我们不能简单地在调用 `Start()` 时包裹一个 `try`\
  \ 块来捕获异常，因为控制权会在调用后立即返回，随后将离开 `try` 块，可能在工作线程发生异常很久之前就离开了。一种解决方案是将任务委托的主体封装在 `try/catch`\
  \ 块中。在工作线程上抛出并被捕获的异常因此不会产生问题，因为 `try` 块在工作线程上会正常工作。然而，对于未处理异常——那些工作线程未捕获的异常——情况并非如此。\n\
  \n通常（从 CLR 版本 2.0^(8) 开始），任何线程上的未处理异常都被视为致命的，触发操作系统的错误报告对话框，并导致应用程序异常终止。所有线程上的异常都必须被捕获；如果没有，则不允许应用程序继续运行。（有关处理未处理异常的某些高级技术，请参见后续的高级主题：处理线程上的未处理异常。）幸运的是，对于异步运行任务中的未处理异常情况并非如此。在这种情况下，任务调度器会在委托周围插入一个全捕获异常处理器，这样如果任务抛出了其他未处理的异常，全捕获处理器将捕获它并在任务中记录异常详细信息，从而避免触发\
  \ CLR 自动终止进程。\n\n8。在 CLR 的 1.0 版本中，工作线程上的未处理异常会终止线程而不是应用程序。结果是，一个错误的程序可能所有线程都死亡，但主线程仍继续运行，尽管程序已不再工作。对于用户来说，这是一个令人困惑的情况；最好向用户指示应用程序状态异常并终止它，以免造成更大的伤害。\n\
  \n正如我们在 Listing 19.4 中看到的，处理故障任务的技术之一是显式创建一个作为该任务处理器的延续任务；当任务调度器检测到前置任务抛出未处理异常时，会自动调度该延续。然而，如果没有此类处理器并在故障任务上执行\
  \ `Wait()`（或尝试获取 `Result`），将抛出 `AggregateException`（参见 Listing 19.5 和 Output 19.3）。\n\
  \n`4.0`\n\n**Listing 19.5: 处理任务的未处理异常**\n\n点击此处查看代码图像\n\n```cs\nusing System;\n\n\
  using System.Threading.Tasks;\n\npublic class Program\n{\n  public static void Main()\n\
  \  {\n      // Use Task.Factory.StartNew<string>() for\n      // TPL prior to .NET\
  \ 4.5\n      Task task = Task.Run(() =>\n      {\n          throw new InvalidOperationException();\n\
  \      });\n\n      try\n      {\n          task.Wait();\n      }\n      catch(AggregateException\
  \ exception)\n      {\n          exception.Handle(eachException =>\n           \
  \ {\n                Console.WriteLine(\n                    $\"ERROR: { eachException.Message\
  \ }\");\n                return true;\n            });\n      }\n  }\n\n}\n```\n\
  \n**Output 19.3**\n\n点击此处查看代码图像\n\n```\nERROR: Operation is not valid due to the\
  \ current state of the object.\n```\n\n\n\n聚合异常（aggregate exception）之所以被称为聚合，因为它可能包含从一个或多个故障任务（faulted\
  \ tasks）中收集的多个异常。例如，假设异步执行十个任务，其中五个任务抛出了异常。为了报告所有五个异常并在单个 catch 块中处理它们，框架使用了 `AggregateException`\
  \ 作为收集异常并将其作为单个异常报告的手段。此外，由于在编译时无法确定工作任务会抛出一个异常还是多个异常，因此未处理的故障任务始终会抛出 `AggregateException`。代码列表\
  \ 19.5 和 输出 19.3 展示了这种行为。即使在工作线程上抛出的未处理异常类型为 `InvalidOperationException`，在主线程上捕获的异常类型仍然是\
  \ `AggregateException`。同样，正如预期，捕获该异常需要一个 `AggregateException` catch 块。\n\n可以通过 `InnerExceptions`\
  \ 属性获取 `AggregateException` 中包含的异常列表。因此，你可以遍历此属性以检查每个异常并确定适当的行动方案。或者，如代码列表 19.5\
  \ 所示，你可以使用 `AggregateException.Handle()` 方法，指定针对 `AggregateException` 中包含的每个单独异常执行的表达式。然而，需要考虑的\
  \ `Handle()` 方法的重要特性是它是一个谓词（predicate）。因此，对于 `Handle()` 委托成功处理的任何异常，谓词应返回 `true`。如果任何异常处理调用对某个异常返回\
  \ `false`，则 `Handle()` 方法将抛出一个新的 `AggregateException`，其中包含此类相应异常的复合列表。\n\n你也可以通过查看任务的\
  \ `Exception` 属性来观察故障任务的状态，而不会导致异常在当前线程上重新抛出。列表 19.6 展示了这种方法：等待我们知道会抛出异常的任务的故障延续（^(9)）完成。\n\
  \n`4.0`\n\n9。正如我们之前讨论过的，等待故障延续完成是一件很奇怪的事，因为大多数情况下它根本不会被调度运行。这段代码仅用于说明之目的。\n\n**列表\
  \ 19.6: 使用 `ContinueWith()` 观察任务上未处理的异常**\n\n点击此处查看代码图像\n\n```\nusing System;\n\n\
  using System.Diagnostics;\n\nusing System.Threading.Tasks;\n\npublic class Program\n\
  \n{\n\n  public static void Main()\n  {\n\n      bool parentTaskFaulted = false;\n\
  \n      Task task = new Task(() =>\n\n          {\n\n              throw new InvalidOperationException();\n\
  \          });\n\n      Task continuationTask = task.ContinueWith(\n          (antecedentTask)\
  \ =>\n          {\n\n              parentTaskFaulted =\n                  antecedentTask.IsFaulted;\n\
  \          }, TaskContinuationOptions.OnlyOnFaulted);\n\n      task.Start();\n\n\
  \      continuationTask.Wait();\n\n      Trace.Assert(parentTaskFaulted);\n\n  \
  \    Trace.Assert(task.IsFaulted);\n\n      task.Exception!.Handle(eachException\
  \ =>\n      {\n\n          Console.WriteLine(\n              $\"ERROR: { eachException.Message\
  \ }\");\n\n          return true;\n      });\n\n  }\n}\n```\n\n注意，为了检索原始任务上的未处理异常，我们使用了\
  \ `Exception` 属性（并使用空值忽略运算符进行解引用，因为我们知道该值不会为 `null`）。输出结果结果与输出 19.3 相同。\n\n如果任务内部发生的异常完全没有被观察到——即：(1)\
  \ 它没有在任务内部被捕获；(2) 从未通过 `Wait()`、`Result` 或访问 `Exception` 属性等方式观察到任务的完成；以及 (c) 故障的\
  \ `ContinueWith()` 从未被观察到——那么该异常可能会完全未被处理，导致整个进程范围的未处理异常。在 .NET 4.0 中，此类故障任务将由终结器线程重新抛出并导致进程崩溃。相比之下，在\
  \ .NET 4.5 中，崩溃行为被抑制了（尽管如果需要，可以配置 CLR 的崩溃行为）。\n\n在何种情况下，你都可以通过 `TaskScheduler.UnobservedTaskException`\
  \ 事件注册未处理的任务异常。\n\n`4.0` `4.0`\n\n### 取消任务\n\n在本章前面的部分，我们描述了为什么粗暴地终止线程以取消该线程正在执行的任务是一个坏主意。TPL\
  \ 使用协作式取消，这是一种更加礼、健壮且可靠的技术，用于安全地取消不再需要的任务。支持取消的任务通过监控 `CancellationToken` 对象（位于\
  \ `System.Threading` 命名空间中）并定期轮询它来检查是否已发出了取消请求。列表 19.8 展示了取消请求以及对该请求的响应。输出 19.5\
  \ 显示了结果。\n\n**列表 19.8: 使用 `CancellationToken` 取消任务**\n\n点击此处查看代码图像\n\n```\nusing\
  \ System;\n\nusing System.Threading;\n\nusing System.Threading.Tasks;\nusing AddisonWesley.Michael;\n\
  public class Program\n\n{\n  public static void Main()\n\n  {\n\n      string stars\
  \ =\n          \"*\".PadRight(Console.WindowWidth-1, '*');\n      Console.WriteLine(\"\
  Push ENTER to exit.\");\n      CancellationTokenSource cancellationSource=\n   \
  \       new CancellationTokenSource();\n      // 使用 Task.Factory.StartNew<string>()\n\
  \      // .NET 4.5 之前的 TPL\n      Task task = Task.Run(\n          () =>\n     \
  \         WritePi(cancellationSource.Token),\n                  cancellationTokenSource.Token);\n\
  \n      // 等待用户输入\n      Console.ReadLine();\n      cancellationSource.Cancel();\n\
  \      Console.WriteLine(stars);\n      task.Wait();\n  }\n\n  private static void\
  \ WritePi(\n      CancellationToken cancellationToken)\n  {\n\n      const int batchSize\
  \ = 1;\n      string piSection = string.Empty;\n      int i = 0;\n\n      while(!cancellationToken.IsCancellationRequested\n\
  \          || i == int.MaxValue)\n\n      {\n\n          piSection = PiCalculator.Calculate(\n\
  \              batchSize, (i++) * batchSize);\n          Console.Write(piSection);\n\
  \      }\n\n  }\n}\n```\n\n`4.0`\n\n**输出 19.5**\n\n点击此处查看代码图像\n\n```\nPush ENTER\
  \ to exit.\n\n3.141592653589793238462643383279502884197169399375105820974944592307816\n\
  40628620899862803482534211706798214808651328230664709384460955058223172\n5359408128481117450\n\
  ```\n\n\n\n任务开始后，`Console.Read()` 会阻塞主线程。与此同时，任务继续执行，计算圆周率的下一位并将其打印出来。当用户按下回车键时，执行将遇到对\
  \ `CancellationTokenSource.Cancel()` 的调用。在列表 19.8 中，我们将 `task.Cancel()` 的调用与 `task.Wait()`\
  \ 的调用分开，并在之间打印了一行星号。这一步的目的是为了说明在取消令牌被观察到之前可能会发生一次额外的迭代——因此在输出 19.5 中星号后面多了一个 `2`。`2`\
  \ 的出现是因为 `CancellationTokenSource.Cancel()` 并不会粗暴地停止任务的执行。任务会继续运行，直到它检查令牌，并在发现令牌所有者正在请求取消任务时，才会礼貌地关闭。\n\
  \n`Cancel()` 调用有效地设置了所有从 `CancellationTokenSource.Token` 复制的取消令牌上的 `IsCancellationRequested`\
  \ 属性。然而，有几点需要注意：\n\n`4.0`\n\n*   传递给异步任务的是 `CancellationToken`而不是 `CancellationTokenSource`。`CancellationToken`\
  \ 允许对取消请求进行轮询；`CancellationTokenSource` 提供令牌并在取消时对其发出信号（参见图 19.3）。通过传递 `CancellationToken`\
  \ 而不是 `CancellationTokenSource`，我们不需要担心 `CancellationTokenSource` 上的线程同步问题，因为后者仅对原始线程可见。\n\
  \n    ![取消令牌源和取消令牌类的插图。](img/19fig03.jpg)\n\n    **图 19.3：`CancellationTokenSource`\
  \ 和 `CancellationToken` 类图**\n\n*   `CancellationToken` 是一个结构体（struct），因此它是按值复制的。`CancellationTokenSource.Token`\
  \ 返回的值产生令牌的副本。由于 `CancellationToken` 是一个值类型且创建了副本，这确保了对 `CancellationTokenSource.Token`\
  \ 的访问是线程安全的——它仅在 `WritePi()` 方法内部可用。\n\n为了监控 `IsCancellationRequested` 属性，将 `CancellationToken`\
  \ 的副本（从 `CancellationTokenSource.Token` 获取）传递给任务。在列表 19.7 中，我们偶尔会检查 `CancellationToken`\
  \ 参数上的 `IsCancellationRequested` 属性；在这种情况下，我们在每次计算数字位后进行检查。如果 `IsCancellationRequested`\
  \ 返回 `true`，则 `while` 循环退出。与在随机点抛出异常的线程中止（abort）不同，我们使用正常的控制流退出循环。通过频繁轮询，我们保证了代码对取消请求的响应能力。\n\
  \n`4.0`\n\n关于 `CancellationToken` 的另一个需要注意的点是重载的 `Register()` 方法。通过此方法，你可以注册一个在令牌被取消时将调用的操作。换句话说，调用\
  \ `Register()` 方法相当于在相应的 `CancellationTokenSource` 的 `Cancel()` 方法上订阅了一个监听器委托。\n\
  \n鉴于在完成任务之前进行取消是该程序的预期行为，列表 19.7 中的代码并没有抛出 `System.Threading.Tasks.TaskCanceledException`。结果是，`task.Status`\
  \ 将返回 `TaskStatus.RanToCompletion`——这没有指示任务工作实际上被取消了。在这个示例中，不需要这种指示；但 TPL（任务并行库）确实包含了此功能。如果取消调用在某种程度上具有破坏性——例如阻止有效结果的返回——那么抛出\
  \ `TaskCanceledException`（继承自 `System.OperationCanceledException`）将是 TPL 报告此类错误的模式。与其显式抛出异常，`CancellationToken`\
  \ 包含一个 `ThrowIfCancellationRequested()` 方法以便更轻松地报告异常，前提是存在一个 `CancellationToken`\
  \ 实例。\n\n如果你尝试对一个抛出 `TaskCanceledException` 的任务调用 `Wait()`（或获取 `Result`），其行为与任务中抛出任何其他异常相同：该调用将抛出一个\
  \ `AggregateException`。该异常是用于通信任务之后执行状态可能不完全的手段。与所有预期工作都成功执行的已完成任务不同，被取消的任务可能只有部分工作完成——工作状态是不可信的。\n\
  \n此示例演示了长时间运行的 CPU 密集型操作（几乎无限地计算圆周率）如何监控取消请求并在发生时做出响应。然而，在某些情况下，取消可以在目标任务内部没有显式编写代码的情况下发生。例如，第\
  \ 21 章中讨论的 `Parallel` 类默认提供了这种行为。\n\n`4.0`开始 `5.0`\n\n### `Task.Run()`：`Task.Factory.StartNew()`\
  \ 的快捷与简化\n\n在 .NET 4.0 中，获取任务的通用做法是调用 `Task.Factory.StartNew()`。在 .NET 4.5 中，`Task.Run()`\
  \ 提供了一个更简单的调用结构。类似于 `Task.Run()`，`Task.Factory.StartNew()` 可用于 C# 4.0 场景中调用需要创建额外线程的\
  \ CPU 密集型方法。\n\n鉴于 .NET 4.5，除非证明不足，否则应默认使用 `Task.Run()`。例如，如果你需要使用 `TaskCreationOptions`\
  \ 控制任务、需要指定备用调度器，或者出于性能考虑想要传递对象状态，你应该考虑使用 `Task.Factory.StartNew()`。\n\n列表 19.9\
  \ 提供了使用 `Task.Factory.StartNew()` 的示例。\n\n**列表 19.9：使用 `Task.Factory.StartNew()`**\n\
  \n点击此处查看代码图像\n\n```\npublic Task<string> CalculatePiAsync(int digits)\n{\n  return\
  \ Task.Factory.StartNew<string>(\n      () => CalculatePi(digits));\n}\n\nprivate\
  \ string CalculatePi(int digits)\n{\n    // ...\n}\n```\n\n结束\n\n### 长运行任务\n\n线程池假设工作项是处理器密集型且短寿命的；它通过这些假设来有效限制创建线程的数量。这防止了昂线程资源的过度分配以及处理器的过度订阅（后者会导致大量的上下文切换和时间分片）。\n\
  \n`4.0`\n\n但如果开发者知道某个任务将长时间运行，并长时间占用底层线程资源呢？在这种情况下，开发者可以通知调度器该任务短期内无法完成。这有两个影响。首先，它提示调度器可能为此任务创建一个专用线程，而不是尝试从线程池中使用线程。其次，它提示调度器现在可能是允许调度比处理器数量更多的任务的时机。这将导致更多时间分片的产生，这是一件好事。我们不希望一个长运行任务占用整个处理器，并阻止短运行任务使用它。短运行任务将利用其时间片完成大部分工作，而长运行任务不太可能察觉由于与其他任务共享处理器而造成的轻微延迟。要实现这一点，在调用\
  \ `StartNew()` 时使用 `TaskCreationOptions.LongRunning` 选项，如列表 19.10 所示。（`Task.Run()`\
  \ 不支持 `TaskCreationOptions` 参数。）\n\n**列表 19.10：协作执行长运行任务**\n\n\n\n\n\n## Tasks 是可释放的\n\
  \n请注意 `Task` 也支持 `IDisposable`。这是必要的，因为 `Task` 在等待其完成时可能会分配一个 `WaitHandle`；由于 `WaitHandle`\
  \ 支持 `IDisposable`，根据最佳实践，`Task` 也支持 `IDisposable`。然而，请注意，之前的代码示例并没有包含 `Dispose()`\
  \ 调用，也没有通过 `using` 语句隐式地依赖此类调用。相反，这些列表依赖于程序退出时自动调用的 `WaitHandle` 终结器。\n\n`4.0`\n\
  \n这种方法导致了两个显着的结果。首先，句柄的生命周期更长，因此比本该消耗了更多资源。其次，垃圾回收器的效率略低，因为已终化的对象会存活到下一代。然而，在 `Task`\
  \ 的案例中，除非有极大量的任务正在被终结，否则这两个问题都是无关紧要的。因此，尽管从技术上讲，所有代码都应该释放任务，但除非性能指标要求且这样做很容易，否则你不需要特意去这么做——也就是说，如果你确定\
  \ `Task` 已经完成且没有其他代码在使用它们，就不必费心。\n\n### 使用 `System.Threading`\n\n`开始 5.0`\n\n并行扩展库（Parallel\
  \ Extensions library）极其有用，因为它允许你操作更高级的抽象——任务（task），而不是直接处理线程工作。然而，有时你可能需要处理为在 TPL\
  \ 和 PLINQ 出现之前（.NET 4.0 之前）编写的代码，或者你可能遇到了一个它们没有直接解决的编程问题。为了实现这一点，你可以利用 `System.Threading`\
  \ 中的 `Thread` 类和相关 API。`System.Threading.Thread` 代表程序中的一个控制点，封装了操作系统线程，而该命名空间提供了额外的托管\
  \ API 来管理这些线程。\n\n`Thread` 中的一个常用方法是 `Sleep()`；然而，尽管它很方便，但应该避免使用它。`Thread.Sleep()`\
  \ 让当前线程进入睡眠，本质上是告诉操作系统在（至少）给定的时间过去之前，不要为该线程调度任何时间片。这听起来像是一件明智的事，但它是一个“坏代码气味（bad\
  \ code smell）”，表明程序的设计可能可以更好。让线程睡眠是一种糟糕的编程实践，因为分配线程这样昂贵资源的意义在于从该资源中获得工作。（你不会付钱让员工睡觉；同样，你不应该付出分配昂贵线程的代价，只为了让它睡眠数百万或数十亿个处理器周期。）尽管如此，也有几个有效的用用例。\n\
  \n`4.0`\n\n第一个用例是让线程带有零延迟进入睡眠，以告诉操作系统“当前线程正在礼貌地将其剩余的时间片让给其他线程（如果有可以使用它的线程的话）”。礼貌的线程随后会被正常调度，没有任何进一步的延迟。第二个用例是在测试代码中，模拟一个正在处理某些高延迟操作的线程，但无需实际上通过消耗处理器执行某些无意义的算术运算。生产代码中的其他用途应仔细审查，以确保没有更好的方法可以获得所需的效果。\n\
  \n`System.Threading` 中的另一种类型是 `ThreadPool`，它旨在限制可能对性能产生负面影响的过度线程。线程是昂贵的资源，线程上下文切换不是免费的，通过时间分片模拟并行运行两个作业可能比一个接一个运行它们要慢得多。虽然线程池工作良好，但它没有提供处理长时间运行任务或需要与主线程或它们彼此进行同步的任务的服务。我们真正需要做的是构建一个更高级抽象，可以将线程和线程池作为实现细节。由于\
  \ TPL 正好提供了这种抽象，`ThreadPool` 基本上可以完全弃用，转而使用基于 TPL 的 API。\n\n有关在 .NET 4 之前常用的管理工作线程的其他技术的更多详细信息，请参见\
  \ [`IntelliTect.com/EssentialCSharp`](https://IntelliTect.com/EssentialCSharp) 中的\
  \ *Essential C# 3.0* 多线程章节。\n\n有关 `System.Threading.ThreadPool` 和 `System.Threading.Thread`\
  \ 的 `Sleep()` 方法的更多信息，请参阅 [`IntelliTect.com/legacy-system-threading`](https://IntelliTect.com/legacy-system-threading)。\n\
  \n### 总结\n\n在本章开始，我们简要介绍了开发者在编写多线程程序时经常面临的一些困难问题：原子性问题、死锁以及其他为多线程程序引入不确定性和不良行为的竞态条件。然后，我们深入研究了任务并行库（TPL）及其及其基于任务的异步模式（TAP），这是一种用于创建和调度由\
  \ `Task` 对象表示的工作单元的新 API，我们看到了它们如何通过允许你自动重写程序来管理由小任务组成大任务的延续“接线”，从而简化了多线程编程。在第 20\
  \ 章和第 21 章中，我们引入了额外的高级抽象，涵盖更多的场景并进一步简化了 TAP。\n\n在第 22 章中，我们将转向讨论如何在不引入死锁的情况下通过同步访问共享资源来避免原子性问题。\n\
  \n## 20. 基于任务的异步模式\n\n`开始 4.0` `开始 5.0`\n\n正如我们在第 19 章中所看到的，任务提供了异步操作的抽象。任务被自动调度到适当的线程上，大任务可以通过组合小任务来完成。\n\
  \n### 同步调用高延迟操作\n\n在列表 20.1 中，代码使用 `WebClient` 下载网页并搜索某些文本出现的次数。输出 20.1 显示了结果。\n\
  \n\n\n\n\n```c\nusing System;\nusing System.IO;\nusing System.Net;\n\npublic class\
  \ Program\n{\n  public const string DefaultUrl =\n      \"https://IntelliTect.com\"\
  ;\n  public static void Main(string[] args)\n  {\n      if (args.Length == 0)\n\
  \      {\n          Console.WriteLine(\"ERROR: No findText argument specified.\"\
  );\n          return;\n      }\n      string findText = args[0];\n      string url\
  \ = DefaultUrl;\n      if (args.Length > 1)\n      {\n          url = args[1];\n\
  \          // Ignore additional parameters\n      }\n      Console.Write(\n    \
  \      $\"Searching for '{findText}' at URL '{url}'.\");\n      Console.WriteLine(\"\
  Downloading....\");\n      using WebClient webClient = new WebClient();\n      byte[]\
  \ downloadData =\n          webClient.DownloadData(url);\n      Console.WriteLine(\"\
  Searching....\");\n      int textOccurrenceCount = CountOccurrences(\n         \
  \ downloadData, findText);\n      Console.WriteLine(\n          @$\"{Environment.NewLine}'{findText}'\
  \ appears {\n              textOccurrenceCount} times at URL '{url}'.\");\n  }\n\
  \  private static int CountOccurrences(byte[] downloadData, string findText)\n \
  \ {\n      int textOccurrenceCount = 0;\n      using MemoryStream stream = new MemoryStream(downloadData);\n\
  \      using StreamReader reader = new StreamReader(stream);\n      int findIndex\
  \ = 0;\n      int length = 0;\n      do\n      {\n          char[] data = new char[reader.BaseStream.Length];\n\
  \          length = reader.Read(data);\n          for (int i = 0; i < length; i++)\n\
  \          {\n              if (findText[findIndex] == data[i])\n              {\n\
  \                  findIndex++;\n                  if (findIndex == findText.Length)\n\
  \                  {\n                      // Text was found\n                \
  \      textOccurrenceCount++;\n                      findIndex = 0;\n          \
  \        }\n              }\n              else\n              {\n             \
  \     findIndex = 0;\n              }\n          }\n      }\n      while (length\
  \ != 0);\n      return textOccurrenceCount;\n  }\n}\n```\n\n`5.0``4.0`\n\n输出 20.1\n\
  \n点击此处查看代码图片\n\n```\nSearching for 'IntelliTect'...\nhttp://www.IntelliTect.com\n\
  Downloading...\nSearching...\n'IntelliTect' appears 35 times at URL 'http://www.IntelliTect.com'.\n\
  ```\n\n列表 20.1 中的逻辑非常直接——使用了常用的 C# 惯用法。在确定了 `url` 和 `findText` 的值后，`Main()` 调用 `CountOccurrences()`，实例化\
  \ `WebClient`，并调用同步方法 `DownloadData()` 下载内容。获取下载的数据后，它将其传递给 `CountOccurrences()`，该方法将其加载到\
  \ `MemoryStream` 中，并利用 `StreamReader` 的 `Read()` 方法检索数据块并在其中搜索 `findText` 值。（我们使用\
  \ `DownloadData()` 方法而不是更简单的 `DownloadString()` 方法，是为了以便在演示从列表 20.2 和 20.3 从流中读取数据时额外的异步调用。）\n\
  \n这种方法的问题在于，调用者线程在 I/O 操作完成之前一直被阻塞；这浪费了一个在操作执行期间可以执行有用工作的线程。由于这个原因，例如，我们无法执行任何其他代码，例如异步指示进度的代码。换句话说，“下载……”和“正在搜索……”是在相应操作*之前*调用的，而不是在操作*期间*调用的。虽然这样做在这里并无关紧要，但想象一下我们想要并发执行额外工作，或者至少提供一个动画忙碌指示。\n\
  \n`5.0`\n\n### 使用 TPL 异步调用高延迟操作\n\n为了解决这种并行执行其他工作的问题，列表 20.2 采用了类似的方法，但改用基于任务的 TPL\
  \ 异步处理。\n\n`4.0`\n\n列表 20.2：一个异步网络请求\n\n点击此处查看代码图片\n\n```c\nusing System;\nusing\
  \ System.IO;\nusing System.Net;\nusing System.Threading.Tasks;\nusing System.Runtime.ExceptionServices;\n\
  \npublic class Program\n{\n  public const string DefaultUrl =\n      \"https://IntelliTect.com\"\
  ;\n  public static void Main(string[] args)\n  {\n      if (args.Length == 0)\n\
  \      {\n          Console.WriteLine(\"ERROR: No findText argument specified.\"\
  );\n          return;\n      }\n      string findText = args[0];\n      string url\
  \ = DefaultUrl;\n      if (args.Length > 1)\n      {\n          url = args[1];\n\
  \          // Ignore additional parameters\n      }\n      Console.Write(\n    \
  \      $\"Searching for '{findText}' at URL '{url}'.\");\n      using WebClient\
  \ webClient = new WebClient();\n      Console.Write(\"\\nDownloading...\");\n  \
  \    Task task = webClient.DownloadDataTaskAsync(url)\n          .ContinueWith(antecedent\
  \ =>\n          {\n              byte[] downloadData = antecedent.Result;\n    \
  \          Console.Write(\"\\nSearching...\");\n              return CountOccurrencesAsync(\n\
  \                  downloadData, findText);\n          })\n          .Unwrap()\n\
  \          .ContinueWith(antecedent =>\n          {\n              int textOccurrenceCount\
  \ = antecedent.Result;\n              Console.WriteLine(\n                  @$\"\
  {Environment.NewLine}'{findText}' appears {\n                      textOccurrenceCount}\
  \ times at URL '{url}'.\");\n          });\n      try\n      {\n          while(!task.Wait(100))\n\
  \          {\n              Console.Write(\".\");\n          }\n      }\n      catch(AggregateException\
  \ exception)\n      {\n          exception = exception.Flatten();\n          try\n\
  \          {\n              exception.Handle(innerException =>\n              {\n\
  \                  // Rethrow rather than using\n                  // if the type\n\
  \                  ExceptionDispatchInfo.Capture(\n                      innerException)\n\
  \                      .Throw();\n                  return true;\n             \
  \ });\n          }\n          catch(WebException)\n          {\n              //\
  \ ...\n          }\n          catch(IOException)\n          {\n              //\
  \ ...\n          }\n          catch(NotSupportedException)\n          {\n      \
  \        // ...\n          }\n      }\n  }\n  private static Task<int> CountOccurrencesAsync(\n\
  \        byte[] downloadData, string findText)\n  {\n      // ...\n  }\n}\n```\n\
  \n`5.0``4.0`\n\n相关的输出基本上与输出 20.1 相同，只是在“下载……”和“正在搜索……”之后会有额外的点，取决于这些操作持续的时间。\n\n\
  `5.0`\n\n当列表 20.2 执行时，它会在下载页面时向控制台打印带有点的“下载……”；“正在搜索……”也是如此。\n\n遗憾的是，这种异步是以复杂性为代价的。代码中穿插着与\
  \ TPL 相关的代码中断了执行流。与其简单地在 `WebClient.DownloadDataTaskAsync(url)` 调用后跟随计数次数的语句（调用\
  \ `CountOccurrences()` 的异步版本），异步版本的代码需要 `ContinueWith()` 语句、`Unwrap()` 调用以及复杂的 try/catch\
  \ 处理系统。详细信息见“高级主题：使用 TPL 进行异步请求的复杂性”。简单来说，你将感谢 C# 5.0 引入的基于任务的异步模式（`async`/`await`）。\n\
  \n\n\n\n\n为了解决复杂性问题，列表 20.3 提供了异步执行，但使用的是基于任务的异步，它利用了 C# 5.0 引入的 `async`/`await`\
  \ 特性。通过 `async`/`await`，编译器会处理复杂性，让开发者专注于业务逻辑。与其担心处理链式调用 `ContinueWith()` 语句、获取\
  \ `antecedents.Result`、调用 `Unwrap()`、复杂的错误处理等，`async`/`await` 允许你仅使用简单的语法来装饰代码，从而告知编译器它应该处理这些复杂性。此外，当任务完成且需要执行额外代码时，编译器会自动处理在适当的线程上调用剩余代码。例如，你不能让两个不同的线程与单线程\
  \ UI 平台进行交互，而 `async`/`await` 解决了这个问题。（参见本章节稍后关于在 Windows UI 中使用 `async`/`await`\
  \ 特性的节章节。）\n\n换句话说，`async`/`await` 语法告诉编译器在编译时重组代码，尽管代码写得相对简单，但它会处理开发者本必须显式考虑的无数复杂性——参见列表\
  \ 20.3。\n\n`7.0` `5.0` `4.0`\n\n### 列表 20.3：使用基于任务的异步模式的高延迟调用\n\n点击此处查看代码图像\n\n\
  ```csharp\nusing System;\n\nusing System.IO;\n\nusing System.Net;\n\nusing System.Threading.Tasks;\n\
  \npublic class Program\n{\n\n  public const string DefaultUrl =\n      \"https://IntelliTect.com\"\
  ;\n\n  public static async Task Main(string[] args)\n  {\n      if (args.Length\
  \ == 0)\n      {\n          Console.WriteLine(\"ERROR: No findText argument specified.\"\
  );\n          return;\n      }\n\n      string findText = args[0];\n      string\
  \ url = DefaultUrl;\n\n      if (args.Length > 1)\n      {\n          url = args[1];\n\
  \          // Ignore additional parameters\n      }\n\n      Console.Write(\n  \
  \        $\"Searching for '{findText}' at URL '{url}'.\");\n\n      using WebClient\
  \ webClient = new WebClient();\n\n      Task<byte[]> taskDownload =\n          webClient.DownloadDataTaskAsync(url);\n\
  \n      Console.WriteLine(\"Downloading...\");\n\n      byte[] downloadData = await\
  \ taskDownload;\n\n      Task<int> taskSearch = CountOccurrencesAsync(\n       \
  \   downloadData, findText);\n\n      Console.WriteLine(\"Searching...\");\n\n \
  \     int textOccurrenceCount = await taskSearch;\n\n      Console.WriteLine(\n\
  \          @$\"{Environment.NewLine}'{findText}' appears {\n              textOccurrenceCount}\
  \ times at URL '{url}'.\");\n  }\n\n  private static async Task<int> CountOccurrencesAsync(\n\
  \      byte[] downloadData, string findText)\n  {\n      int textOccurrenceCount\
  \ = 0;\n      using MemoryStream stream = new MemoryStream(downloadData);\n    \
  \  using StreamReader reader = new StreamReader(stream);\n      int findIndex =\
  \ 0;\n      int length = 0;\n\n      do\n      {\n          char[] data = new char[reader.BaseStream.Length];\n\
  \          length = await reader.ReadAsync(data);\n          for (int i = 0; i <\
  \ length; i++)\n          {\n              if (findText[findIndex] == data[i])\n\
  \              {\n                  findIndex++;\n                  if (findIndex\
  \ == findText.Length)\n                  {\n                      // Text was found\n\
  \                      textOccurrenceCount++;\n                      findIndex =\
  \ 0;\n                  }\n              }\n              else\n              {\n\
  \                  findIndex = 0;\n              }\n          }\n      }\n     \
  \ while (length != 0);\n      return textOccurrenceCount;\n  }\n}\n```\n\n`7.0`\
