  \ (*n*）标识该上下文关键字在哪个版本中添加。\n\n\n\n\n\n在 C# 1.0 之后，C# 没有引入新的 `reserved keywords`（保留关键字）。然而，后续版本中的某些构造使用了\
  \ `contextual keywords`（上下文关键字），它们仅在特定位置具有意义。在这些指定位置之外，上下文关键字没有特殊含义。通过这种方法，大多数 C#\
  \ 1.0 代码都能与后来的标准兼容。\n\n例如，在 C# 2.0 设计的早期，语言设计人员将 `yield` 指定为关键字，并且微软向数千名开发者发布了 C#\
  \ 2.0 编译器的 alpha 版本，在其中 `yield` 都是一个已指定的关键字。然而，语言设计人员最终确定，通过使用 `yield return` 而不是\
  \ `yield`，他们最终可以避免将 `yield` 添加为关键字，因为在靠近 `return` 的地方之外，它没有特殊意义。\n\n存在一些极罕见且不幸的不兼容性情况，例如：\n\
  \n* C# 2.0 要求使用 `using` 语句来实现 `IDisposable`接口，而不是简单地使用 `Dispose()` 方法。\n* 某些罕见的泛型表达式在版本之间是不同的。例如，`F(G<A,B>(7))`\
  \ 在 C# 1.0 中意味着 `F( (G<A), (B>7) )`，但在 C# 2.0 中，它意味着调用泛型方法 `G<A,B>` 并传入参数 7，并将结果传递给\
  \ `F`。\n\n`Begin 2.0` `End 2.0`\n\n## Identifiers 标识符\n\n与其他语言一样，C# 包含了 `identifiers`（标识符）来标识程序员编写的构造。在\
  \ [Listing 1.1] 中，`HelloWorld` 和 `Main` 是标识符的示例。分配给构造的标识符用于以后引用该构造，因此开发者分配的名称具有意义而非随机是非常重要的。\n\
  \n选择简洁且指示性名称的敏锐能力是优秀程序员的重要特征，因为这意味着生成的代码将更容易理解和重用。清晰性与一致性的重要性使得[框架设计指南](http://bit.ly/dotnetguidelines)\
  \ 建议不要在标识符名称中使用缩写或收缩形式，甚至建议避免未广泛接受的缩写词。如果一个缩写已经足够流行（例如 `HTML`），你应该一致地使用它。避免在某些情况下写出接受的缩写，而在另一些情况下不写。通常，增加将所有缩写词包含在术语表中的约束，为缩写的使用增加了足够的成本，使其不会被草率使用。最终，请选择清晰的、甚至是冗长的名称——特别是当在团队工作或开发他人将对其编程的库时。\n\
  \n标识符有两种基本的数字大小写格式。`Pascal case`（下简称 `PascalCase`，.NET 框架创建者因其在 Pascal 编程语言中的流行而这样命名）将标识符名称中每个单词的首字母大写；示例包括\
  \ `ComponentModel`、`Configuration` 和 `HttpFileCollection`。正如 `HttpFileCollection`\
  \ 中的 `HTTP` 所示，当使用超过两个字母的缩写词时，仅首字母大写。第二种格式 `camel case`（下简称 `camelCase`）遵循相同的约定，但首字母是小写的；示例包括\
  \ `quotient`、`firstName`、`httpFileCollection`、`ioStream` 和 `theDreadPirateRoberts`。\n\
  \n注意，尽管下划线是合法的，但通常标识符名称中没有下划线、连字符或其他非字母数字字符。此外，C# 没有遵循其前身，即不使用匈牙利命名（在名称前加上数据类型的缩写）。这种约定避免了当数据类型更改时必须重命名变量，也避免了在使用匈牙利命名时因未调整数据类型前缀而导致的不一致。\n\
  \n在少数情况下，某些标识符（如 `Main`）在 C# 语言中具有特殊含义。\n\n## Type Definition 类型定义\n\nC# 中的所有可执行代码都出现在类型定义中，最常见的类型定义以关键字\
  \ `class` 开始。`class definition`（类定义）通常以 `class identifier { ... }` 开始的代码段，如 [Listing\
  \ 1.3] 所示。\n\n**Listing 1.3: Basic Class Declaration**\n\n[点击此处查看代码图像]\n\n```\n\
  class HelloWorld\n\n{\n  //...\n\n}\n```\n\n用于类型的名称（在此例中为 `HelloWorld`）可以变化，但根据惯例，它必须\
  \ PascalCase 命名。因此，对于此示例，其他可能的名称有 `Greetings`、`HelloInigoMontoya`、`Hello` 或简单的 `Program`。（当类包含后续描述的\
  \ `Main()` 方法时，`Program` 是一个很好的遵循规范。）\n\n通常，程序包含多个类型，每个类型包含多个方法。\n\n## Main Method\
  \ 主方法\n\nC# 程序开始执行的位置是 `Main` 方法，它以 `static void Main()` 开始。当你通过控制台输入 `dotnet run`\
  \ 执行程序时，程序启动、解析 `Main` 的位置，并开始执行在 [Listing 1.4] 中标识的第一条语句。\n\n**Listing 1.4: Breaking\
  \ Apart `HelloWorld`**\n\n![Image](img/lis1-4.jpg)\n\n虽然 `Main` 方法的声明可以在某种程度上变化，但程序始终\
  \ `static` 和方法名 `Main` 是必须的。\n\n**Listing 1.5: The `Main` Method with Parameters\
  \ and a Return**\n\n[点击此处查看代码图像]\n\n```\nstatic int Main(string[] args)\n\n{\n \
  \   //...\n\n}\n```\n\n### Note 注意\n\n**All Lowercase 全小写**\n\n与其 C 风格的前身不同，C# 对\
  \ `Main` 方法使用大写的 *M*，以与 C# 的 PascalCase 命名约定保持一致。\n\n将 `Main` 方法指定为 `static` 表示其他方法可以直接从类定义调用它。如果没有\
  \ `static` 标记，启动程序的控制台需要在调用方法之前执行额外工作（称为“实例化”）。（第 6 章有一个专门介绍静态成员的章节。）\n\n在 `Main()`\
  \ 之前放置 `void` 表示此方法不返回任何数据。（在第 2 章中进一步解释。）\n\nC# 遵循的一个独特的 C/C++ 征是使用大括号作为构造体，例如类或方法。例如，`Main`\
  \ 方法包含其实现的大括号；在这种情况下，方法只有一个语句。\n\n## Statements and Statement Delimiters 语句与分隔符\n\
  \n`Main` 方法包含单个语句 `System.Console.WriteLine()`，用于向控制台写入一行文本。C# 通常使用分号表示 `statement`（语句）的结束，语句由代码将执行的一个或多个操作组成。声明变量、控制程序流和调用方法是语句的典型用途。由于换行并不分隔语句，你可以将多个语句放在同一行，C#\
  \ 编译器会将该行解释为多条指令。例如，[Listing 1.6] 在同一行内包含两个语句，它们结合起来在两个不同的行上显示 `Up` 和 `Down`。\n\n\
  **Listing 1.6: Multiple Statements on One Line**\n\n[点击此处查看代码图像]\n\n```\nSystem.Console.WriteLine(\"\
  Up\");System.Console.WriteLine(\"Down\");\n```\n\nC# 还允许将一个语句跨越多行。再次，C# 编译器寻找分号来表示语句的结束。例如，在\
  \ [Listing 1.7] 中，`HelloWorld` 程序中的原始 `WriteLine()` 语句被跨越多行分割。\n\n**Listing 1.7:\
  \ Splitting a Single Statement across Multiple Lines**\n\n\n\n\n\n点击此处查看代码图像\n\n\
  ```\nSystem.Console.WriteLine(\n  Hello. My name is Inigo Montoya.\");\n```\n\n\
  ## 空格符\n\n分号使得 C# 编译器忽略代码中的空格成为可能。除了少数例外情况外，C# 允许开发者在代码的任何位置插入空格，而不会改变其语义含义。在代码列表\
  \ 1.6 和 1.7 中，在语句内部插入换行符、在语句之间插入换行符或完全消除换行符并不重要，这样做对编译器生成的最终可执行文件没有影响。\n\n程序员经常使用空格对代码进行缩进，以提高可读性。请考虑代码列表\
  \ 1.8 和 1.9 中所示的 `HelloWorld` 的两种变体。虽然这两个示例看起来与原始程序有显著不同，但 C# 编译器认为它们在语义上是等价的。\n\
  \n### 代码列表 1.8：无缩进格式\n\n点击此处查看代码图像\n\n```\nclass HelloWorld\n{\n  static void Main()\n\
  \  {\n    System.Console.WriteLine(\"Hello Inigo Montoya\");\n  }\n}\n```\n\n###\
  \ 代码列表 1.9：移除空格\n\n点击此处查看代码图像\n\n```\nclass HelloWorld{static void Main()\n{System.Console.WriteLine(\"\
  Hello Inigo Montoya\");}}\n```\n\n## 变量操作\n\n现在你已经接触了最基础的 C# 程序，是时候声明局部变量了。一旦声明了变量，你就可以给它赋值，用一个新值替换该值，并将其用于计算、输出等。然而，你不能更改变量的数据数类型。在代码列表\
  \ 1.10 中，`string max` 是一个变量声明。\n\n### 代码列表 1.10：声明和赋值变量\n\n![图像](img/lis1-10.jpg)\n\
  \n声明变量即定义变量，你可以通过以下方式实现：\n\n*   指定变量将包含的数据类型\n*   为其分配一个标识符（名称）\n\n### 数据类型\n\n\
  代码列表 1.10 声明了一个数据类型为 `string` 的变量。本章使用的其他常用数据类型是 `int` 和 `char`。\n\n*   `int` 是\
  \ C# 中整数类型的别名，大小为 32 位。\n*   `char` 用于字符类型。它是 16 位的，足够存储（非代理的）Unicode 字符。\n\n下一章将详细介绍这些以及其他常用数据类型。\n\
  \n### 声明变量\n\n在代码列表 1.10 中，`string max` 是一个字符串类型的变量声明，其名称为 `max`。可以通过一次指定数据类型并用逗号分隔每个标识符，从而在同一条语句中声明多个变量。代码列表\
  \ 1.11 演示了这样的声明。\n\n### 代码列表 1.11：在一条语句中声明两个变量\n\n点击此处查看代码图像\n\n```\nstring message1,\
  \ message2;\n```\n\n由于多变量声明语句允许开发者在声明中仅提供一次数据类型，所有变量将具有相同类型。\n\n在 C# 中，变量名可以是任何字母或下划线（`_`）开头，随后是任意数量的字母、数字和下划线。根据约定，局部变量名使用驼命名法（每个单词的首字母大写，第一个单词除外），并且不包含下划线。\n\
  \n### 变量赋值\n\n在声明局部变量后，必须在使用之前对其赋值。一种方法是使用 `=` 运算符，也称为简单赋值运算符。运算符是用于标识代码要执行函数的符号。代码列表\
  \ 1.12 演示了如何使用赋值运算符为变量 `miracleMax` 和 `valerie` 指定指向的字符串值。\n\n### 代码列表 1.12：更改变量值\n\
  \n点击此处查看代码图像\n\n```\nclass StormingTheCastle\n{\n  static void Main()\n  {\n   \
  \   string valerie;\n      string miracleMax = \"Have fun storming the castle!\"\
  ;                        \n      valerie = \"Think it will work?\";            \
  \                                \n      System.Console.WriteLine(miracleMax);\n\
  \      System.Console.WriteLine(valerie);\n      miracleMax = \"It would take a\
  \ miracle.\";                                    \n      System.Console.WriteLine(miracleMax);\n\
  \  }\n}\n```\n\n从此列表中观察到，可以在变量声明的一部分进行赋值（如 `miracleMax` 所示），也可以在随后的单独语句中进行赋值（如变量\
  \ `valerie`）。赋值的值必须始终位于声明的右侧。\n\n运行编译后的程序会产生输出 1.3 所示的内容。\n\n### 输出 1.3\n\n点击此处查看代码图像\n\
  \n```\ndotnet run\n\nHave fun storming the castle!\n\nThink it will work?\n\nIt\
  \ would take a miracle.\n```\n\n在此输出中，我们显式显示了 `dotnet run` 命令。在未来的输出中，我们会省略此行，除非有特殊情况。C#\
  \ 要求在读取局部变量之前对其进行“确定赋值”，正如代码列表 1.13 中所示。\n\n### 代码列表 1.13：返回可再次赋值的值\n\n点击此处查看代码图像\n\
  \n```\nclass StormingTheCastle\n{\n  static void Main()\n  {\n    // ...\n    string\
  \ requirements, miracleMax;\n    requirements = \"It would take a miracle.\";\n\
  \    // ...\n  }\n}\n```\n\n### 使用变量\n\n赋值的结果是你可以使用变量标识符引用该值。因此，当你在 `System.Console.WriteLine(miracleMax)`\
  \ 语句中使用 `miracleMax` 时，程序会在控制台显示“Have fun storming the castle!”，即 `miracleMax` 的值。更改\
  \ `miracleMax` 的值并执行相同的 `System.Console.WriteLine(miracleMax)` 会显示新的 `miracleMax`\
  \ 值——“It would take a miracle.”。\n\n## 控制台输入输出\n\n本章已经反复使用 `System.Console.WriteLine`\
  \ 向控制台输出文本。除了能够输出数据外，程序还需要能够接受用户的数据。\n\n### 从控制台获取输入\n\n从控制台检索输入的方法是使用 `System.Console.ReadLine()`。该方法会停止程序执行，让用户输入字符。当用户按下回车键产生换行时，程序继续运行。`System.Console.ReadLine()`\
  \ 方法的输出（也称为返回值）是输入的字符串。考虑代码列表 1.14 以及输出 1.4 中所示相应的输出。\n\n### 代码列表 1.14：使用 `System.Console.ReadLine()`\n\
  \n点击此处查看代码图像\n\n```\nclass HeyYou\n{\n  static void Main()\n  {\n      string firstName;\n\
  \      string lastName;\n      System.Console.WriteLine(\"Hey you!\");\n      System.Console.Write(\"\
  Enter your first name: \");\n      firstName = System.Console.ReadLine();\n    \
  \  System.Console.Write(\"Enter your last name: \");\n      lastName = System.Console.ReadLine();\n\
  \  }\n}\n```\n\n### 输出 1.4\n\n```\nHey you!\n\nEnter your first name: Inigo\n\n\
  Enter your last name: Montoya\n```\n\n\n\n\n\n在每个提示符之后，此程序使用 `System.Console.ReadLine()`\
  \ 方法来获取用户输入的文本并将其赋值给相应的变量。当第二次 `System.Console.ReadLine()` 赋值完成时，`firstName` 指向值\
  \ `Inigo`，`lastName` 指向值 `Montoya`。\n\n**列表 1.15：使用 `System.Console.Read()`**\n\n\
  点击此处查看代码\n\n```\nint readValue;\n\nchar character;\n\nreadValue = System.Console.Read();\n\
  \ncharacter = (char) readValue;\n\nSystem.Console.Write(character);\n```\n\n`System.Console.Read()`\
  \ 方法在用户按下 Enter 键之前不会返回输入；即使用户在按下 Enter 键之前输入了多个字符，也不会开始处理字符。\n\n`Begin 2.0`\n\n\
  在 C# 2.0 及更高版本中，你可以使用 `System.Console.ReadKey()`，与 `System.Console.Read()` 不同，它在单个按键后就会返回输入。它允许开发者拦截按键并执行操作，例如按键验证、将字符限制为数字。\n\
  \n`End 2.0`\n\n### 向控制台写入输出\n\n在列表 1.14 中，你使用 `System.Console.Write()` 方法而不是 `System.Console.WriteLine()`\
  \ 来提示用户输入姓和名。`System.Console.Write()` 方法在显示文本后不会放置换行符，而是将当前位置保留在同一行。这样一来，用户输入的任何文本都将与输入提示符处于同一行。来自列表\
  \ 1.14 的输出展示了 `System.Console.Write()` 的效果。\n\n`Begin 6.0`\n\n下一步是将使用 `System.Console.ReadLine()`\
  \ 获取到的值写回控制台。在列表 1.16 中，程序输出了用户的全名。然而，此代码没有像以前那样使用 `System.Console.WriteLine()`，而是使用了一种稍微的变体，利用了\
  \ C# 6.0 中称为**字符串插值**（string interpolation）的特性。注意 `Console.WriteLine` 调用中字符串面字量前的美元符号；它表示将使用字符串插值。输出\
  \ 1.5 显示了相应的输出。\n\n**列表 1.16：使用字符串插值进行格式化**\n\n点击此处查看代码图像\n\n```csharp\nclass HeyYou\n\
  \n{\n  static void Main()\n  {\n      string firstName;\n      string lastName;\n\
  \      System.Console.WriteLine(\"Hey you!\");\n      System.Console.Write(\"Enter\
  \ your first name: \");\n      firstName = System.Console.ReadLine();\n      System.Console.Write(\"\
  Enter your last name: \");\n      lastName = System.Console.ReadLine();\n      System.Console.WriteLine(\n\
  \        $\"Your full name is { firstName } { lastName }.\");\n  }\n}\n```\n\n**输出\
  \ 1.5**\n\n点击此处查看代码图像\n\n```\nHey you!\n\nEnter your first name: Inigo\n\nEnter\
  \ your last name: Montoya\n\nYour full name is Inigo Montoya.\n```\n\n与其写出“Your\
  \ full name is”后跟另一个用于 `firstName` 的 `Write` 语句、用于空格的第三 `Write` 语句，最后用于 `lastName`\
  \ 的 `WriteLine` 语句，列表 1.16 使用 C# 6.0 的字符串插值输出了整个输出。通过字符串插值，编译器会将字符串内部大括号内的内容解释为可以在其中嵌入代码（表达式）的区域，编译器将评估这些表达式并将其转换为字符串。与其逐个执行大量代码并在最后将结果组合成字符串，字符串插值允许你通过单个步骤完成此操作。这使得代码更易理解。\n\
  \n`End 6.0`\n\n在 C# 6.0 之前，C# 使用的是不同的方法：复合格式化（composite formatting）。使用复合格式化时，代码首先提供一个`格式化字符串`来定义输出格式——参见列表\
  \ 1.17。\n\n**列表 1.17：使用 `System.Console.WriteLine()` 的复合格式化进行格式化**\n\n点击此处查看代码图像\n\
  \n```csharp\nclass HeyYou\n{\n  static void Main()\n  {\n      string firstName;\n\
  \      string lastName;\n      System.Console.WriteLine(\"Hey you!\");\n      System.Console.Write(\"\
  Enter your first name: \");\n      firstName = System.Console.ReadLine();\n    \
  \  System.Console.Write(\"Enter your last name: \"); \n      lastName = System.Console.ReadLine();\n\
  \      System.Console.WriteLine(\n        \"Your full name is {0} {1}.\", firstName,\
  \ lastName);\n  }\n}\n```\n\n在这个示例中，格式字符串 `Your full name is {0} {1}.` 识别了字符串中用于插入数据的两个占位符。每个占位符对应于出现在格式字符串之后的参数的顺序。注意索引值从零开始。每个插入的参数（称为`格式项`）都对应一个位置。\n\
  \n\n\n\n| 类型 | 说明 | 示例 |\n| :--- | :--- | :--- |\n| 定界符注释 | 一个正斜杠后跟一个星号 `/*` 标识定界符注释的开始。要结束注释，使用星号后跟一个正斜杠：`*/`。这种形式的注释可以在代码文件中跨越多行，也可以嵌入在单行代码中。出现在行首但定界符内部的星号仅用于格式化。\
  \ | `/*comment*/` |\n| 单行注释 | 注释可以使用由两个连续的正斜杠字符组成的定界符 `//` 来声明。编译器将从定界符到行尾的所有文本视为注释。这种形式的注释被视为单行。然而，可以将连续的单行注释一个接一个地放置，如列表\
  \ 1.19 中的最后一条注释所示。 | `//comment` |\n| XML 定界符注释 | 以 `/**` 开始并以 `**/` 结束的注释称为 XML\
  \ 定界符注释。它们与普通定界符注释具有相同的特性，不同之处在于不是完全忽略 XML 注释，编译器可以将它们放入单独的文本文件中。* | `/**comment**/`\
  \ |\n| XML 单行注释 | XML 单行注释以 `///` 开始并持续到行尾。此外，可以将单行注释与 XML 定界符注释一起保存到单独的文件。 | `///comment`\
  \ |\n\n### **表 1.2：C# 注释类型**\n\nXML 定界符注释仅在 C# 2.0 中显式添加，但其语法与 C# 1.0 兼容。\n\n`2.0\
  \ 结束`\n\n关于 XML 注释以及如何利用它们生成 API 文档的更全面讨论请见第 10 章，在那里进一步讨论了各种 XML 标签。\n\n在编程历史上曾有一段时间，大量的注释意味着程序员是一个有纪律且经验丰富的程序员。现在情况不再如此了。相反，没有注释也易读的代码比需要注释来解释其功能的代码更有价值。如果开发者发现有必要输入注释来澄清代码块的作用，他们应该倾向于重写出更清晰的代码，而不是对其进行注释。编写仅仅重复代码已显示内容的注释只会使代码杂乱，降低其可读性，并增加由于代码更改而注释未同步更新导致注释过时的概率。\n\
  \n### 托管执行与通用语言体系\n\n处理器无法直接解释程序集。程序集主要由被称为**通用中间语言（Common Intermediate Language，CIL）**或简称\
  \ **IL** 的二级语言组成。(11)。C# 编译器将 C# 源文件转换为这种中间语言。还需要一个额外的步骤（通常在执行时完成）将 CIL 代码转换为处理器可以理解的**机器码**。这涉及到\
  \ C# 程序执行中的一个重要元素：**虚拟执行系统（Virtual Execution System，VES）**。VES 也被称为**运行时（runtime）），它根据需要编译\
  \ CIL 代码（此过程被称为**即时编译**或 **jitting**）。在运行时等代理的上下文中执行的代码被称为**托管代码（managed code）**，而在运行时控制下执行的过程被称为**托管执行（managed\
  \ execution）**。代码之所以是“托管的”，是因为运行时通过管理内存分配、安全性和即时编译等方面，控制了程序行为的很大一部分。不需要运行时执行的代码被称为**原生代码（native\
  \ code）**（或**未托管代码**）。\n\n11。CIL 的第三种术语是 Microsoft IL (MSIL)。此本书使用 CIL 术语是因为它是 CLI\
  \ 标准所采用的术语。在编写 C# 代码的人的对话中，IL 非常流行，因为他们假设 IL 指 CIL 而非其他类型的中间语言。\n\n运行时的规范包含在一个更广泛的规范中，称为**通用语言体系（Common\
  \ Language Infrastructure，CLI）**规范。(12)。作为一个国际标准，CLI 包含了以下内容的规范：\n\n12。Miller, J.,\
  \ and S. Ragsdale. 2004\\. *The Common Language Infrastructure Annotated Standard*.\
  \ Boston: Addison-Wesley.\n\n*   VES 或运行时\n*   CIL\n*   支持语言操作性的类型系统，被称为**通用类型系统（Common\
  \ Type System，CTS）**\n*   关于如何编写从 CLI 兼容语言可以访问的库的指南（在**通用语言规范（Common Language Specification，CLS）**中可用）\n\
  *   启用 CLI 标识的许多服务的元数据（包括程序集布局或文件格式的规范）\n\n**注意**\n\n*runtime（运行时）* 一词可以指执行时间，也可以指\
  \ VES。为了帮助澄清意图，本书使用 *execution time（执行时间）* 一词表示程序正在执行的时间，而在讨论负责管理 C# 程序执行的代理时，使用\
  \ *runtime（运行时）* 一词。\n\n在运行时执行引擎的上下文中运行可以支持程序员不需要直接编写代码的若干服务和功能，包括以下：\n\n*   *语言互操作性：*\
  \ 不同源语言之间的互操作性。这是可能的，因为语言编译器将每种源语言转换为相同的中间语言（CIL）。\n*   *类型安全：* 检查类型之间的转换，确保只有兼容类型之间才会发生转换。这有助于防止溢出的发生，溢出是安全漏洞的主要原因。\n\
  *   *代码访问安全：* 验证程序集开发者代码在计算机上执行的权限。\n*   *垃圾回收：* 自动释放由运行时分配的内存内存管理。\n*   *平台移植性：*\
  \ 支持在各种操作系统上运行相同的程序集。一个明显的限制是使用了平台相关的库；因此平台特异性需要单独处理。\n*   *基类库（Base Class Library，BCL）：*\
  \ 提供开发者可以依赖的基础代码（在所有 .NET 框架中），这样他们就不需要自己开发。\n\n**注意**\n\n本节提供了 CLI 的简要摘要，以让你熟悉\
  \ C# 程序执行的上下文。它还提供了书中出现的一些术语的总结。第 24 章](#ch24.xhtml_ch24）专门讨论 CLI 及其对 C# 开发者的重要性。尽管该章位于书的最后，但它不依赖于之前的章节，因此如果你急于熟悉\
  \ CLI，可以随时跳转。\n\n### 通用中间语言与 ILDASM\n\n正如本节引言所述，C# 编译器将 C# 代码转换为 CIL 代码而不是机器码。处理器可以直接理解机器码；因此，在处理器执行之前，需要转换\
  \ CIL 代码。给定一个程序集，可以使用 CIL 反汇器工具查看 CIL 代码，将程序集解构为其 CIL 表示。（该 CIL 反汇器被亲切地称为其 Microsoft\
  \ .NET Framework 特定的文件名 `ILDASM`，代表 IL 反汇器。）`ILDASM` 将反汇编程序集并提取 C# 编译器生成的 CIL 到文本。\n\
  \n\n\n\n\n反汇编 .NET 程序集后产生的输出比机器码要容易理解得多。对于许多开发者来说，这可能会引发担忧，因为程序更容易被反编译，且在不显式重新发布源代码的情况下就能理解算法。与任何程序一样（无论是否基于\
  \ CLI），防止反汇编的唯一万无一失的方法是完全禁止对编译后的程序进行访问（例如，仅将程序托管在网站上，而不是分发到用户的机器）。然而，如果只需要降低源代码的可访问性，则有几种混淆器可用。混淆器读取\
  \ IL 代码并对其进行转换，使其执行相同的功能，但方式要晦涩得多。这种技术可以防止普通开发者访问代码，并创建出反编译为可理解代码要困难且繁琐得多的程序集。除非程序对算法安全性有很高要求，否则混淆器通常足够了。\n\
  \n从此类列表中你可能获得的最有趣的一可能是，与尝试阅读和理解机器码（汇编语言）相比，跟踪程序的操作是相对容易的。在列表中，出现了对 `System.Console.WriteLine()`\
  \ 的显式引用。CIL 代码列表中有很多外围信息，但如果开发者想在没有原始源代码的情况下理解 C# 程序集（或任何基于 CLI 的程序）的内部机制，除非使用了混淆器，否则相对容易。事实上，有几个免费工具（如\
  \ Red Gate 的 Reflector、ILSpy、JustDecompile、dotPeek 和 CodeReflect）可以自动从 CIL 反编译为\
  \ C#。\n\n## 多 .NET 框架\n\n正如章节开头简要提到的，存在多个 .NET 框架。之所以提供这么多，主要是由于希望在多个操作系统（甚至可能是不同的硬件平台）上提供\
  \ .NET 实现。表 1.3 显示了那些主流的框架。\n\n| 注释类型 |  |\n| :--- | :--- |\n| .NET Core | 一种真正的跨平台且开源的\
  \ .NET 框架，为服务器和命令行应用程序提供高度模块化的 API 集合。 |\n| Microsoft .NET Framework | .NET 框架的第一个——正在逐渐被\
  \ .NET Core 取代。 |\n| Xamarin | .NET 的移动平台实现，同时适用于 iOS 和 Android，并允许从单一代码库开发移动应用程序，同时仍能够访问原生平台\
  \ API。 |\n| Mono | 最早的 .NET 开源实现，它是 Xamarin 和 Unity 构建的基础。对于新开发，Mono 已被 .NET Core\
