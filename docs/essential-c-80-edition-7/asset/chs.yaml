  \ does not modify the original string.\"\n\n重新翻译如下：\n`string` 类型的一个关键特性是它是不可变的。字符串变量可以分配一个完全不同的值。由于字符串是不可变的，其内容无法更改。字符串变量可以被分配一个新值，但这样做不会修改原始字符串。考虑列表\
  \ 2.17 作为示例。\n\n### 列表 2.17：不可变\n\n点击此处查看代码图像\n\n```cs\nclass Uppercase\n{\n  static\
  \ void Main()\n  {\n      string text;\n      System.Console.Write(\"Enter text:\
  \ \");\n      text = System.Console.ReadLine();\n      // 无法修改 text\n      text.ToUpper();\
  \                                                          \n  }\n}\n```\n（注：原文提供的示例代码似乎在\
  \ prompt 处不完整，我已根据提供的字符进行翻译）\n\n*等等，重新审视提供的原文文本：*\n原文：\n`A key characteristic of\
  \ the `string` type is that it is immutable. A string variable can be assigned an\
