  \ 是一家位于华盛顿州斯波卡尔的高端软件架构和开发咨询公司。公司聘用最优秀、最才明的工程师，提供架构咨询、全生命周期软件开发和培训，使客户能够解决最具挑战性的问题。IntelliTect\
  \ 拥有专攻最新微软技术的首席和高级工程师——包括云计算、大数据和人工智能、Microsoft .NET、Azure DevOps、Office365/SharePoint、企业应用集成和\
  \ BizTalk。\n\nIntelliTect 使用最佳应用程序生命周期管理，按时、按范围和预算交付高质量软件解决方案。IntelliTect 专长以下服务：\n\
  \n* 使用先进平台（包括 `C#`、`.NET`、`TypeScript`、`SQL Server`、`Oracle`、`Azure DevOps` 以及 `Azure`、`Amazon\
  \ Web Services` 和 Google Cloud Platform 等云服务）进行软件开发咨询、实施和培训。\n* 根据客户需求进行软件架构研讨会。合作涵盖战略设计、架构路线图、技术选择、安全评估、范围定义和解决方案蓝图。\n\
  * 与公司高效协作，在 `Office365/SharePoint` 上提供企业内容管理 (ECM) 服务，包括咨询、培训、部署、内部门户和自定义应用程序开发。\n\
  * 开发云、`BizTalk` 和 `SQL Server Integration Services (SSIS)` 解决方案，或集成并迁移大型企业应用和对对交易。\n\
