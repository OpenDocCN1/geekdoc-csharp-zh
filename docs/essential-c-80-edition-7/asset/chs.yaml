  点击此处查看代码图像\n\n```\n________\nFirstName: Sherlock\nLastName: Holmes\nAddress: 221B\
  \ Baker Street, London, England\n\n________\nSubject: Soccer tournament\nStart:\
  \ 7/18/2008 12:00:00 AM\nEnd: 7/19/2008 12:00:00 AM\nLocation: Estádio da Machava\n\
  \n________\nFirstName: Hercule\nLastName: Poirot\nAddress: Apt 56B, Whitehaven Mansions,\
  \ Sandhurst Sq, London\n```\n\n通过这种方式，你可以在基类上调用方法，但实现是特定派生类的。Output 7.5 显示了 Listing\
  \ 7.17 中的 `List()` 方法能够成功显示所有 `Contact` 和 `Address`，并以它们各自定制的方式进行显示。抽象 `GetSummary()`\
  \ 方法的调用实际上调用了特定特定的重写方法。\n\n### 所有类都派自 `System.Object`\n\n对于任何类，无论是自定义类还是系统内置类，Table\
  \ 7.2 所示的方法都是定义的。\n\n| **方法名** | **描述** |\n| --- | --- |\n|  \n```csharp\npublic\
  \ virtual bool Equals(object o)\n```\n | 如果作为参数提供的对象与实例在*值*上相等（但不一定是引用相等），则返回 `true`。\
  \ |\n|  \n```csharp\npublic virtual int GetHashCode()\n```\n\n\n\n\n\n-   返回一个与均匀分布哈希码对应的整数。这对于\
  \ `HashTable` 等集合非常有用。\n\n```\npublic Type GetType()\n```\n-   返回一个与对象实例类型对应的 `System.Type`\
  \ 类型对象。\n\n```cs\npublic static bool ReferenceEquals(\n    object a, object b)\n\
  ```\n-   如果提供的两个参数指向同一个对象，则返回 `true`。\n\n```cs\npublic virtual string ToString()\n\
  ```\n-   返回对象实例的字符串表示。\n\n```cs\npublic virtual void Finalize()\n```\n-   析构函数的别名；通知对象准备终止。C#\
  \ 允许你直接调用此方法。\n\n```cs\nprotected object MemberwiseClone()\n```\n-   通过执行浅拷贝来克隆对象；会复制引用，但不会复制被引用类型内部的数据。\n\
  \n## 表 7.2：`System.Object` 的成员\n\n表 7.2 中列出的所有方法都通过继承出现在所有对象上；所有类都（无论是直接还是通过继承链）派自\
  \ `object`。甚至字面量也包含这些方法，使得能够编写如下看起来有些奇怪的代码：\n\n点击此处查看代码图像\n\n```cs\nConsole.WriteLine(\
  \ 42.ToString() );\n```\n\n即使是没有任何显式派自 `object` 的类定义，最终也会派自 `object`。因此，列表 7.18\
  \ 中对 `PdaItem` 的两个声明将产生完全相同的 CIL。\n\n### 列表 7.18：当未显式指定派生时隐含的对 `System.Object` 的派生\n\
  \n点击此处查看代码图像\n\n```cs\npublic class PdaItem\n{\n  // ...\n}\n\npublic class PdaItem\
  \ : object\n{\n  // ...\n}\n```\n\n当 `object` 的默认实现无法满足时，程序员可以重写三个虚拟方法中的一个或多个。第\
  \ 10 章 描述了实现此类操作的细节。\n\n### 使用 `is` 运算符进行模式匹配\n\n虽然 C# 从 C# 1.0 开始就有了 `is` 运算符，但\
  \ C# 7.0 和 C# 8.0 都对模式匹配的支持提供了显著改进。但请注意，正如我们在下一节中讨论的，除非在 `switch` 语句或表达式中使用，否则这些功能中的许多是是微不足道的。\n\
  \n#### 使用 `is` 运算符验证底层类型\n\n由于 C# 允许沿继承链向下转型，因此有时在尝试转换之前确定底层类型是有意义的。此外，对于未实现多态的特定类型操作，检查类型也可能是必要的。为了确定底层类型，C#\
  \ 从 C# 1.0 起就包含了 `is` 运算符（参见列表 7.19）。\n\n### 列表 7.19：使用 `is` 运算符确定底层类型\n\n点击此处查看代码图像\n\
  \n```cs\npublic static void Save(object data)\n{\n  if (data is string)\n  {\n \
  \     string text = (string)data;\n      if (text.Length > 0)\n      {\n       \
  \   data = Encrypt(text);\n          // ...\n      }\n  }\n  else if (data is null)\n\
  \  {\n      // ...\n  }\n  // ...\n}\n```\n\n列表 7.19 如果底层类型是 `string` 则对数据进行加密。这与加密任何成功转换为\
  \ `string` 的数据类型显著不同，因为某些类型支持转换为 `string`，但它们的底层类型并不是 `string`。\n\n虽然在方法开始检查 `null`\
  \ 可能更清晰，但在这种情况下，我们在稍晚进行检查。我们的意图是证明即使目标是 `null`，`is` 运算符也会返回 `false`，因此 `null` 检查仍然会执行。\n\
  \n`开始 7.0`\n\n使用显式转换时，程序员有责任充分理解代码逻辑以避免发生无效转换异常。如果可能发生无效转换，最好利用 `is` 运算符并完全避免异常。优点是，`is`\
  \ 运算符为显式转换可能失败的情况提供了一条代码路径，而无需处理异常的代价。此外，在 C# 7.0 及更高版本中，`is` 运算符会在检查数据类型的同时进行赋值。\n\
  \n#### 类型、Var 和常量模式匹配\n\n从 C# 7.0 开始，`is` 运算符得到了改进以支持模式匹配。正如本章前述描述的那样，`is` 运算符的问题在于，在检查数据确实为\
  \ `string` 之后，我们仍然必须将数据强制转换为 `string`（假设我们希望作为 `string` 访问它）。一种更好的方法是既进行检查，又在检查为真时将结果赋值给一个新变量。随着\
  \ C# 7.0 引入**模式匹配**，通过使用类型、`var` 和 `const` 模式匹配，这变得可能。C# 8.0 在此基础上添加了元组、位置、属性和递归模式匹配。所有这些选项都可以替换更基础的选项。表\
  \ 7.3 提供了 C# 7.0 每种 `is` 运算符模式匹配的示例。\n\n| 描述 | 方法名 |\n| :--- | :--- |\n| **类型模式匹配**\
  \ | `GetObjectById(id)` 的结果被与 `Employee` 类型检查并赋值给变量 `employee`。如果 `GetObjectById(id)`\
  \ 为 `null` 或不是 `Employee`，则产生 `false` 并执行 `else` 子句。 | <```cs\n // ...\nstring id\
  \ = \"92e8a67-d453-4998-8d85-f430fa026c7\";\nif(GetObjectById(id) is Employee employee)\n\
  {\n  Display(employee);\n}\nelse\n{\n  ReportError($\"Employee {id} is invalid.\"\
  );\n}\n``` |\n| **常量模式匹配** | 在第 4 章 中，我们使用 `is` 运算符检查 `null`（即 `data null`）演示了常量匹配。相同的检查适用于任何常量。例如，你可以与空字符串比较\
  \ `data`。然而，该比较必须针对常量。`data is string.Empty` 是属性而非常量，是无效的。 | <```cs\npublic static\
  \ void Save(object data)\n{\n  // ...\n  else if (data is \"\")\n  {\n      return;\n\
  \      // ...\n  }\n}\n``` |\n| **与 var 的模式匹配** | 与类型模式匹配不同，你可以使用 `var` 作为数据类型来捕任何值，包括\
  \ `null`。当然，这种方法的益处不如简单的赋值 `var result = GetObjectById(id)`，因为它总是成功的。然而，`is` 更有用的地方是在\
  \ `switch` 语句，它可以作为带有声明的通配情况。 | <```cs\n // ...\nelse (GetObjectById(id) is var\
  \ result)\n{\n    // ...\n}\n``` |\n\n`结束 7.0``开始 8.0`\n\n模式匹配在 C# 8.0 中变得稍微复杂，因为语言包含了对元组、位置、属性和递归模式匹配的支持。\n\
  \n#### 元组模式匹配\n\n通过元组模式匹配，你可以检查元组内的常量值或将元组项赋值给变量（参见列表 7.20）。\n\n### 列表 7.20：使用 `is`\
  \ 运算符的元组模式匹配\n\n点击此处查看代码图像\n\n\n\n\n\n```sharp\npublic class Program\n{\n    const\
  \ int Action = 0;\n\n    const int FileName = 1;\n\n    public const string DataFile\
  \ = \"data.dat\";\n\n    static public void Main(params string[] args)\n    {\n\
  \        // ...\n        if ((args.Length, args[Action]) is (1, \"show\"))     \
  \                               \n        {\n            Console.WriteLine(File.ReadAllText(DataFile));\n\
  \        }\n        else if ((args.Length, args[Action].ToLower(), args[FileName])\
  \ is                  \n            (2, \"encrypt\", string fileName))         \
  \                                      \n        {\n            string data = File.ReadAllText(DataFile);\n\
  \            File.WriteAllText(fileName, Encrypt(data).ToString());\n        }\n\
  \        // ...\n    }\n}\n```\n\n在例示例中，我们对一个填充了 `args` 长度和元素的元组进行模式匹配。在第一个 `if`\
  \ 条件中，我们检查是否有一个参数且操作是否为 `\"show\"`。在第二个 `if` 条件中，我们评估数组中的第一个项是否等于 `\"encrypt\"`，如果是，则将元组中的第三个元素赋值给变量\
  \ `fileName`。每个元素匹配可以是常量也可以是变量。由于元组在 `is` 运算符执行之前就已经实例化，因此我们不能先使用 `\"encrypt\"`\
  \ 情况，因为如果请求的是 `\"show\"` 操作，`args[FileName]` 将不是一个有效的索引。\n\n### 位置模式匹配 (Positional\
  \ Pattern Matching)\n\n基于 C# 7.0 引入的解构构造（参见第 6 章），C# 8.0 允许使用位置模式匹配，其语法与元组模式匹配非常相似（参见列表\
  \ 7.21）。\n\n**列表 7.21：使用 `is` 运算符进行位置模式匹配**\n\n点击此处查看代码图片\n\n```sharp\npublic class\
  \ Person\n{\n  // ...\n  public void Deconstruct(out string firstName, out string\
  \ lastName) =>                               \n      (firstName, lastName) = (FirstName,\
  \ LastName);                                                  \n}\n\npublic class\
  \ Program\n{\n  static public void Main(string[] args)\n  {\n      Person person\
  \ = new Person(\"Inigo\", \"Montoya\");\n      // 位置模式匹配\n      if(person is (string\
  \ firstName, string lastName))                                                \n\
  \      {\n          Console.WriteLine($\"{firstName} {lastName}\");\n      }\n \
  \ }\n}\n```\n\n在这个例示例中，没有 `const` 元素。相反，解构构造中的所有项都区赋值给新构建的元组中的变量。允许在元组内检查常量值。\n\n\
  ### 属性模式匹配 (Property Pattern Matching)\n\n通过属性模式，你可以根据 `switch` 表达式中标识的数据类型的属性名和值来切换\
  \ `switch` 表达式，如列表 7.22 所示。\n\n**列表 7.22：使用 `is` 运算符进行属性模式匹配**\n\n点击此处查看代码图片\n\n\
  ```csharp\n// ...\nPerson person = new Person(\"\", \"\");\n\n// 位置模式匹配\nif(person\
  \ is {FirstName: string firstName, LastName: string lastName })          \n{\n \
  \   Console.WriteLine($\"{firstName} {lastName}\");\n}\n// ...\n```\n\n乍一看，列表 7.22\
  \ 看起来与列表 7.21 几乎相同，并且看起来与位置模式匹配相似。然而，它有两个重要的区别。首先，属性模式匹配使用大括号而不是用于识别匹配对象的圆括号。其次，参数的位置（这对于位置匹配和元组匹配都很重要）在属性模式匹配中是无关的，因为属性名被用于映射匹配表达式。还要注意，当使用\
  \ `is { }` 检查非 `null` 时也会使用属性模式匹配。\n\n`8.0 结束`\n\n### 递归模式匹配 (Recursive Pattern\
  \ Matching)\n\n如前面提到的，属性匹配的大部分威力直到在 `switch` 语句或表达式内部利用时才会真正发挥出来。然而，唯一的例外可能是递归地使用模式匹配时。诚然，列表\
  \ 7.23 是没有意义的；它提供了一个在递归应用模式时潜在复杂性的示例。\n\n**列表 7.23：使用 `is` 运算符进行递归模式匹配**\n\n点击此处查看代码图片\n\
  \n```csharp\n// ...\nPerson inigo = new Person(\"Inigo\", \"Montoya\");\n\nvar buttercup\
  \ =\n    (FirstName: \"Princess\", LastName: \"Buttercup\");\n\n(Person inigo, (string\
  \ FirstName, string LastName) buttercup) couple =\n  (inigo, buttercup);\n\nif (couple\
  \ is\n    ( // 元组\n        ( // 位置\n            { // 属性\n                Length:\
  \ int inigoLength1 },\n            _ // 丢弃\n        ),\n    { // 属性\n        FirstName:\
  \ string buttercupFirstName }))\n{\n    Console.WriteLine($\"({inigoFirstNameLength},\
  \ {buttercupFirstName})\");\n}\nelse\n{\n  // ...\n}\n// ...\n```\n\n在这个例示例中，`couple`\
  \ 的类型如下：\n\n点击此处查看代码图片\n\n```csharp\n(Person inigo, (string FirstName, string LastName))\n\
  ```\n\n如此，第一次匹配发生在外部元组 `(inigo, buttercup)` 上。接下来，使用位置模式匹配 `inigo`，利用 `Person` 解构。这选择了一个\
  \ `(FirstName, LastName)` 元组，通过属性模式匹配提取 `Length`。位置模式匹配部分被丢弃。最后，使用属性模式匹配 `buttercup.LastName`。\n\
  \nC# 8.0 的属性匹配构造是一种选择数据的强大手段，但并非没有限制。与第 4 章中描述的 `switch` 语句以及包含 `when` 子句不同，你无法对谓词表达式进行匹配，例如检查\
  \ `FirstName` 和 `LastName` 是否大于零。此外，请注意可读性。即使在列表 7.23 中有注释，理解这些代码可能具有挑战性。如下：\n\n\
  点击此处查看代码图片\n\n```csharp\nif (couple is { Length: int inigoLength }, _ ),\n   { FirstName:\
  \ string buttercupFirstName }))\n```\n\n尽管如此，模式匹配真正证明有用的地方是在 `switch` 语句和表达式。\n\n\
  `7.0 开始`\n\n### `switch` 表达式中的模式匹配\n\n列表 7.23 是一个 `if-else` 语句，但你可以想象一个类似的示例，其中我们检查的不仅仅是字符串。而且，虽然\
  \ `if` 语句可行，但带有匹配表达式（或语句）的 `switch` 语句（其中匹配表达式与基类型工作）可以提供更好的可读性。列表 7.24 提供了一个以各种格式格式日期的示例。\n\
  \n**列表 7.24：`switch` 表达式中的模式匹配**\n\n点击此处查看代码图片\n\n```csharp\npublic static string?\
  \ CompositeFormatDate(\n        object input, string compositFormatString) =>\n\
  \    input switch\n    {\n        DateTime { Year: int year, Month: int month, Day:\
  \ int day }\n            => (year, month, day),\n        DateTimeOffset\n      \
  \  { Year: int year, Month: int month, Day: int day }\n                => (year,\
  \ month, day),\n        string dateText => DateTime.TryParse(\n            dateText,\
  \ out DateTime dateTime) ?\n                (dateTime.Year, dateTime.Month, dateTime.Day)\
  \ :\n                default((int Year, int Month, int Day)?),\n        _ => null\n\
  \n    } is { } date ? string.Format(\n        compositFormatString, date.Year, date.Month,\
  \ date.Day) : null;\n```\n\n\n\n\n`switch` 表达式第一个用例使用类型模式匹配（C# 7.0）来检查输入是否为 `DateTime`\
  \ 类型。如果结果为 `true`，并将结果传递给属性模式匹配，以声明并赋值值 `year`、`month` 和 `day`；然后它在元组表达式中使用这些变量，并返回元组\
  \ `(year, month, day)`。`DateTimeOffset` 分例的工作方式也是同样的。\n\n`string` 分例没有使用递归模式匹配，也没有使用默认的\
  \ `(_)`。请注意，对于 `string`，如果 `TryParse()` 失败，我们返回一个 `default((int Year, int Month,\
  \ int Day)?)`，其评估结果为 `null`。无法直接返回 `null`，因为 `(int Year, int Month, int Day)`（其他用例返回的类型）和\
  \ `null` 之间没有隐式转换。相反，需要指定一个可空元组以准确确定 `switch` 表达式的类型。（使用默认运算符的替代方案是强制类型转换：`((int\
  \ Year, int Month, int Day)?) null`。）此外，可空性非常重要，这样当解析失败时，`input switch {} is { }\
  \ date` 就不会返回 `true`。\n\n更多信息请参阅第 12 章。\n\n请注意列表 7.24 不包含任何带有谓词表达式的进一步限制匹配的 `when`\
  \ 子句。例如如下子句\n\n点击此处查看代码图像\n\n```\nDateTime\n\n  { Year: int year, Month: int month,\
  \ Day: int day } tempDate\n\n      when tempDate < DateTime.Now => (year, month,\
  \ day)\n```\n\n（该句限制日期必须在未来）是完全支持的。\n\n### 在可以使用多态时避免模式匹配\n\n尽管模式匹配能力很重要，但在使用 `is`\
  \ 运算符之前，您应该考虑与多态相关的问题。多态支持将行为扩展到其他数据类型，而无需修改定义行为的实现。例如，将 `Name` 等成员放在基类 `PdaItem`\
  \ 中，然后处理源自 `PdaItem` 的值，比对每个类型使用带有 case 语句的模式匹配要好。前者允许添加派生自 `PdaItem` 的额外类型（可能甚至在不同的程序集中）而无需重新编译。相比之下，后者需要额外修改模式匹配代码以处理新引入的类型。无论如何，多态并不总是可行的。\n\
  \n`End 7.0` `End 8.0`\n\n多态失效的一种场景是没有任何对象层次结构符合您的目标——例如，您正在处理属于不相关系统的类。此外，假设需要多态的代码不受您的控制且无法修改。在列表\
  \ 7.24 中处理日期的情况就是其中一个例子。第二种场景是，您正在添加的功能不是这些类的核心抽象的一部分。例如，车辆在收费道路上行驶时，不同类型的车辆通行费不同，但通行费并不是车辆的核心功能。\n\
  \n### 总结\n\n本章讨论了如何通过派生类并添加额外的方法和属性来特化类。这些内容涵盖了对控制封装级别的 `private` 和 `protected`\
  \ 访问修饰符的讨论。\n\n本章还研究了重写基类实现的细节，或者另一种方式是使用 `new` 修饰符隐藏它。为了控制重写，C# 提供了 `virtual` 修饰符，它告知派生类开发者哪些成员是打算用于派生的。为了防止任何派生，可以在类上使用\
  \ `sealed` 修饰符。同样，在成员上放置 `sealed` 修饰符可以防止子类的进一步重写。\n\n本章简要讨论了所有类型都派自 `object`。第\
  \ 10 章 所示），还通过接口实现。与抽象类不同，接口不能包含任何实现——直到 C# 8.0。（但即使在 C# 8.0 中，是否应该在“版本控制”之外使用这种能力也是值得商的。）然而，与抽象类一样，接口定义了一组调用者可以依赖这些成员已实现的成员。\n\
  \n![图像显示了接口涉及的各种主题。列表如下：多态、接口实现、接口继承、接口的扩展方法和版本控制。接口实现包括显性和隐式。](img/08mindmap.jpg)\n\
  \n通过实现接口，类型定义了它的能力。接口实现关系是一种“能够”的关系。该类型可以执行接口要求它执行。接口定义了实现接口的类型与使用接口的代码之间的约。实现接口的类型必须声明与所实现接口中声明的方法相同的方法。本章讨论了接口的实现和使用。最后以接口上的默认实现成员以及该功能引入的一系列范式（和复杂性）结束。\n\
  \n### 介绍接口\n\n列表 8.1 所示的 `IFileCompression` 接口是接口实现的示例。按照惯例——一种强大到通用的惯例——接口名称使用\
  \ PascalCase 且带有大字母“I”前缀。\n\n**列表 8.1：定义接口**\n\n点击此处查看代码图像\n\n```\ninterface IFileCompression\n\
  \n{\n\n  void Compress(string targetFileName, string[] fileList);\n\n  void Uncompress(string\
  \ compressedFileName, string expandDirectoryName);\n\n}\n```\n\n`IFileCompression`\
  \ 定义了类型必须实现的方法，以便与其他压缩相关的类以相同的方式使用。接口的威力在于它们允许调用者在不修改调用代码的情况下在不同实现之间切换。\n\n`Begin\
  \ 8.0`\n\n在 C# 8.0 之前，接口的一个关键特征是它没有实现，也没有数据。接口中的方法声明始终在声明后使用单个分号来代替大括号。属性虽然看起来像自动实现的属性，但没有后备字段。事实上，字段（数据）也不能出现在接口声明中。\n\
  \n\n\n\n在 `C#` 8.0 中，这些规则许多都被放宽，目的是允许接口在发布后进行某种程度的受限更改。然而，在本章的“C# 8.0 或更高版本的接口版本控制”章节之前，我们将忽略这些新功能，并为了建立多态性而讨论接口。这才是接口真正的威力所在，在开启这些新功能并描述创建异常的场景之前，在该语境下讨论它们会更容易。因此，让我们坚持这种简化的观点，即接口不能包含任何实现（甚至不提及\
  \ `C#` 8.0），并推迟移除该限制，直到我们探索 `C#` 8.0 的功能为止。\n\n接口的声明成员描述了实现类型必须可以访问的成员。非公共（nonpublic）成员的目的是让这些成员对其他代码不可。因此，`C#`\
  \ 不允许对接口成员使用访问修饰符；相反，它会自动将它们定义为公共（public）。\n\n`8.0 结束`\n\n### 通过接口实现多态\n\n考虑另一个示例，如列表\
  \ 8.2 所示：`IListable` 定义了 `ConsoleListControl` 类要显示类时需要支持的成员。因此，任何实现 `IListable`\
  \ 的类都可以使用 `ConsoleListControl` 来显示自己。`IListable` 接口要求一个只读属性 `CellValues`。\n\n**列表\
  \ 8.2：接口的实现与使用**\n\n点击此处查看代码\n\n```\ninterface IListable\n\n{\n\n  // 返回行中每个单元格的值\n\
  \n    string?[] CellValues { get; }                                            \
  \        \n}\n\npublic abstract class PdaItem\n\n{\n\n  public PdaItem(string name)\n\
  \n  {f\n\n      Name = name;\n\n  }\n\n  public virtual string Name{get;set;}\n\n\
  }\n\nclass Contact : PdaItem, IListable\n\n{\n  public Contact(string firstName,\
  \ string lastName,\n\n      string address, string phone) :\n\n      base(GetName(firstName,\
  \ lastName))\n\n  {\n\n      FirstName = firstName;\n\n      LastName = lastName;\n\
  \n      Address = address;\n\n      Phone = phone;\n\n  }\n\n  protected string\
  \ LastName {  get; }\n\n  // ...\n\n  protected string FirstName {  get; }\n\n \
  \ public string? Address { get; }\n\n  public string? Phone { get; }\n\n  public\
  \ static string GetName(string firstName, string lastName)\n\n    => $\"{ firstName\
  \ } { lastName }\";\n\n  public string?[] CellValues                           \
  \                     \n  {                                                    \
  \                      \n      get                                             \
  \                       \n      {                                              \
  \                        \n          return new string?[]                      \
  \                         \n          {                                        \
