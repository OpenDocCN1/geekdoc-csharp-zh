  }\n\nclass Program\n{\n  static void Main()\n  {\n    IEnumerable<Patent> patents\
  \ = PatentData.Patents;\n    Print(patents);\n    Console.WriteLine();\n    IEnumerable<Inventor>\
  \ inventors = PatentData.Inventors;\n    Print(inventors);\n  }\n\n  private static\
  \ void Print<T>(IEnumerable<T> items)\n  {\n      foreach (T item in items)\n  \
  \    {\n          Console.WriteLine(item);\n      }\n  }\n}\n\npublic static class\
  \ PatentData\n{\n  public static readonly Inventor[] Inventors = new Inventor[]\n\
  \      {\n          new Inventor(\n              \"Benjamin Franklin\", \"Philadelphia\"\
  ,\n              \"PA\", \"USA\", 1),\n          new Inventor(\n              \"\
  Orville Wright\", \"Kitty Hawk\",\n              \"NC\", \"USA\", 2),\n        \
  \  new Inventor(\n              \"Wilbur Wright\", \"Kitty Hawk\",\n           \
  \   \"NC\", \"USA\", 3),\n          new Inventor(\n              \"Samuel Morse\"\
  , \"New York\",\n              \"NY\", \"USA\", 4),\n          new Inventor(\n \
  \             \"George Stephenson\", \"Wylam\",\n              \"Northumberland\"\
  , \"UK\", 5),\n          new Inventor(\n              \"John Michaelis\", \"Chicago\"\
  ,\n              \"IL\", \"USA\", 6),\n          new Inventor(\n              \"\
  Mary Phelps Jacob\", \"New York\",\n              \"NY\", \"USA\", 7)\n      };\n\
  \n  public static readonly Patent[] Patents = new Patent[]\n             {\n   \
  \       new Patent(\"Bifocals\",\"1784\",\n              inventorIds: new long[]\
  \ { 1 }),\n          new Patent(\"Phonograph\", \"1877\",\n              inventorIds:\
  \ new long[] { 1 }),\n          new Patent(\"Kinetoscope\", \"1888\",\n        \
  \      inventorIds: new long[] { 1 }),\n          new Patent(\"Electrical Telegraph\"\
  , \"1837\",\n              inventorIds: new long[] { 4 }),\n          new Patent(\"\
  Flying Machine\", \"1903\",\n              inventorIds: new long[] { 2, 3 }),\n\
  \          new Patent(\"Steam Locomotive\", \"1815\",\n              inventorIds:\
  \ new long[] { 5 }),\n          new Patent(\"Droplet Deposition Apparatus\", \"\
  1989\",\n              inventorIds: new long[] { 6 }),\n          new Patent(\"\
