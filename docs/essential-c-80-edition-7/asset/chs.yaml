  \ 不是两个球员数组，而是合并每个被选择的数组并产生包含所有项的单个集合。\n\n`结束 7.0`\n\n### 更多标准查询运算符\n\n`3.0`\n\n\
  列表 15.25 显示了使用 `Enumerable` 启用的一些简单 API 的代码；输出 15.12 显示了结果。\n\n**列表 15.25：更多的 `System.Linq.Enumerable`\
  \ 方法调用**\n\n点击此处查看代码图像\n\n```\nusing System;\n\nusing System.Collections.Generic;\n\
  \nusing System.Linq;\n\nusing System.Text;\nclass Program\n{\n  static void Main()\n\
  \  {\n      IEnumerable<object> stuff =\n        new object[] { new object[] { new\
  \ int[] { 1, 3, 5, 7 },\n\n      new int[] { 2, 4, 6, 8 } };\n\n      Console.WriteLine(\"\
  Stuff: \" + string.Join(\", \", stuff));\n      Console.WriteLine(\"Even integers:\
  \ \" + string.Join(\", \", stuff.SelectMany(o => (int[])o).Where(i => i % 2 == 0)));\n\
