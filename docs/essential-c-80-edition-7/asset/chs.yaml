  \ void Action<in T1, in T2, in T3>(\n\n    T1 arg1, T2 arg2, T3 arg3)\n\npublic\
  \ delegate void Action<in T1, in T2, in T3, in T4(\n\n    T1 arg1, T2 arg2, T3 arg3,\
  \ T4 arg4)\n\n...\n\npublic delegate void Action<\n\n    in T1, in T2, in T3, in\
  \ T4, in T5, in T6, in T7, in T8,\n\n    in T9, in T10, in T11, in T12, in T13,\
  \ in T14, in T16(\n\n        T1 arg1, T2 arg2, T3 arg3, T4 arg4,\n\n        T5 arg5,\
  \ T6 arg6, T7 arg7, T8 arg8,\n\n        T9 arg9, T10 arg10, T11 arg11, T12 arg12,\n\
  \n        T13 arg13, T14 arg14, T15 arg15, T16 arg16)\n\npublic delegate TResult\
  \ Func<out TResult>();\n\npublic delegate TResult Func<in T, out TResult>(T arg)\n\
  \npublic delegate TResult Func<in T1, in T2, out TResult>(\n\n    in T1 arg1, in\
  \ T2 arg2)\n\npublic delegate TResult Func<in T1, in T2, in T3, out TResult>(\n\n\
  \    T1 arg1, T2 arg2, T3 arg3)\n\npublic delegate TResult Func<in T1, in T2, in\
  \ T3, in T4,\n\n    out TResult>(T1 arg1, T2 arg2, T3 arg3, T4 arg4)\n\n...\n\n\
  public delegate TResult Func<\n\n    in T1, in T2, in T3, in T4, in T5, in T6, in\
  \ T7, in T8,\n\n    in T9, in T10, in T11, in T12, in T13, in T14, in T16,\n\n \
  \   out TResult>(\n\n        T1 arg1, T2 arg2, T3 arg3, T4 arg4,\n\n        T5 arg5,\
  \ T6 arg6, T7 arg7, T8 arg8,\n\n        T9 arg9, T10 arg10, T11 arg11, T12 arg12,\n\
  \n        T13 arg13, T14 arg14, T15 arg15, T16 arg16)\n\npublic delegate bool Predicate<in\
  \ T>( T obj)\n```\n\n由于 Listing 13.4 中描述的委托定义是泛型的，你可以使用它们而不是定义自己的自定义委托。\n\n\n\n\n\
  ```csharp\nclass DelegateSample\n{\n  public static void BubbleSort(\n      int[]\
  \ items, Func<int, int, bool> compare)\n  {\n       // ...\n  }\n  public static\
  \ bool GreaterThan(int first, int second)              \n  {\n      return first\
  \ > second;\n  }\n  static void Main()\n  {\n      int i;\n      int[] items = new\
  \ int[5];\n      for (i=0; i < items.Length; i++)\n      {\n          Console.Write(\"\
  Enter an integer: \");\n          items[i] = int.Parse(Console.ReadLine());\n  \
  \    }\n      BubbleSort(items, GreaterThan);                                \n\
  \      for (i = 0; i < items.Length; i++)\n      {\n          Console.WriteLine(items[i]);\n\
  \      }\n  }\n}\n```\n\n请注意，委托是引用类型，但你并不一定使用 `new` 来实例化它们。从 `method group`（即命名方法的表达式）到委托类型的转换在\
  \ C# 2.0 及更高版本中会自动创建一个新的委托对象。\n\n`3.0`\n\n**列表 13.9: 在 C# 1.0 中将委托作为参数传递**\n\n点击此处查看代码\n\
  \n```csharp\nBubbleSort(items,\n    new Comparer(GreaterThan));\n```\n\n在这种情况下，我们使用\
  \ `Comparer` 而不是 `Func<int, int, bool>`，因为后者在 C# 1.0 中尚不可用。\n\n后续版本支持两种语法；在本书的剩余部分，我们将仅展示现代、简洁的语法。\n\
  \n![委托类型对象模型表示。](img/13fig01.jpg)\n\n**图 13.1: 委托类型对象模型**\n\n`3.0`\n\n第一个属性的类型为\
  \ `System.Reflection.MethodInfo`。`MethodInfo` 描述了方法的签名，包括它的名称、参数和返回类型。除了 `MethodInfo`\
  \ 外，委托还需要包含该方法的对象实例来调用。这就是第二个属性 `Target` 的目的。对于静态方法，`Target` 为 `null`。关于 `MulticastDelegate`\
  \ 类的目的将在第 14 章中讨论。\n\n请注意，所有委托都是不可变的；也就是说，一旦创建了委托，你就无法更改它。如果你有一个包含委托引用的变量，并且想让它引用不同的方法，你必须创建一个新委托并赋值给该变量。\n\
  \n尽管所有委托类型都间接派自 `System.Delegate`，但 C# 编译器不允许你声明直接或间接派自 `System.Delegate` 或 `System.MulticastDelegate`\
  \ 的类。因此，列表 13.10 中所示的代码是无效的。\n\n**列表 13.10: `System.Delegate` 不能显式作为基类**\n\n点击此处查看代码\n\
  \n```csharp\n// ERROR: Func<T1, T2, TResult> cannot\n\n// 继承自特殊类 System.Delegate\n\
  \npublic class Func<T1, T2, TResult>: System.Delegate\n{\n  // ...\n}\n```\n\n传递委托来指定排序顺序是一种比本章开头描述的方法要灵活得多的策略。通过传递委托，你只需要在比较部分添加一个将整数转换为字符串的替代委托，即可将排序顺序更改为字母顺序。列表\
  \ 13.11 显示了一个演示字母排序的完整列表，输出 13.1 显示了结果。\n\n`3.0`\n\n**列表 13.11: 使用不同的 `Func<int,\
  \ int, bool>` 兼容方法**\n\n点击此处查看代码\n\n```csharp\nusing System;\n\nclass DelegateSample\n\
  {\n  public static void BubbleSort(\n      int[] items, Func<int, int, bool> compare)\n\
  \  {\n      int i;\n      int j;\n      int temp;\n      for (i = items.Length -\
  \ 1; i >= 0; i--)\n      {\n          for (j = 1; j <= i; j++)\n          {\n  \
  \            if (compare(items[j - 1], items[j]))\n              {\n           \
  \       temp = items[j - 1];\n                  items[j - 1] = items[j];\n     \
  \             items[j] = temp;\n              }\n          }\n      }\n  }\n  public\
  \ static bool GreaterThan(int first, int second)\n  {\n      return first > second;\n\
  \  }\n  public static bool AlphabeticalGreaterThan(                            \
  \         \n      int first, int second)                                       \
  \               \n  {                                                          \
  \                     \n      int comparison;                                  \
  \                           \n      comparison = (first.ToString().CompareTo(  \
  \                                 \n          second.ToString()));             \
  \                                       \n      return comparison > 0;         \
  \                                             \n  }                            \
  \                                                   \n  static void Main(string[]\
  \ args)\n  {\n      int i;\n      int[] items = new int[5];\n      for (i=0; i<items.Length;\
  \ i++)\n      {\n          Console.Write(\"Enter an integer: \");\n          items[i]\
  \ = int.Parse(Console.ReadLine());\n      }\n      BubbleSort(items, AlphabeticalGreaterThan);\
  \                                \n      for (i = 0; i < items.Length; i++)\n  \
  \    {\n          Console.WriteLine(items[i]);\n      }\n  }\n}\n```\n\n`3.0`\n\n\
