  \ `AlphabeticalGreaterThan` 方法，然后将该方法传递给 `BubbleSort()`。\n\n### Lambda 表达式\n\n在列表\
  \ 13.7 和 13.11 中，我们看到可以将 `GreaterThan` 和 `AlphabeticalGreaterThan` 转换为与方法的参数类型和返回类型兼容的委托类型。Lambda\
  \ 表达式的目的是当从非常简单的方法创建委托时，消除声明整个新成员的麻烦。存在多种形式的 Lambda 表达式。例如，语句 Lambda 由形式化参数列表、Lambda\
  \ 运算符 `=>` 以及一个代码块组成。\n\n\n\n\n\n列表 13.12 显示的功能与列表 13.8 中的 `BubbleSort` 调用等效，不同之处在于列表\
  \ 13.12 使用了语句表达式（statement lambda）来表示比较方法，而不是创建一个 `GreaterThan` 方法。如你所见，原本在 `GreaterThan`\
  \ 方法声明中出现的许多信息现在都包含在语句表达式中；形式参数声明和代码块是相同的，但缺少方法名及其修饰符。\n\n`3.0`\n\n**列表 13.12：使用语句表达式创建委托**\n\
  \n点击此处查看代码图像\n\n```c\n// ...\n\n    BubbleSort(items,                          \
  \                          \n\n        (int first, int second) =>              \
  \                         \n\n        {                                        \
  \                        \n\n            return first < second;                \
  \                       \n\n        }                                          \
  \                      \n\n    );                                              \
  \                     \n\n// ...\n```\n\n在阅读包含 Lambda 运算符的代码时，你可以将 Lambda 运算符替换为单词\
  \ *go to*/*goes to*（返回）。例如，在列表 13.12 中，你会将第二个 `BubbleSort()` 参数读作：“整数 `first` 和\
  \ `second` *返回* `first` 小于 `second` 的结果。”\n\n注意列表 13.12 中的语法几乎与列表 13.8 中的语法相同，区别在于比较方法现在在词法上位于其转换为委托类型的地方，而不是在其他地方被找到并通过名称查找。方法名缺失了，这解释了为什么此类方法被称为*匿名函数*。返回类型缺失了，但编译器可以看到\
  \ Lambda 表达式正在被转换为一个签名要求返回类型 `bool` 的委托。编译器会验证语句表达式代码块中每个 `return` 语句的表达式在返回 `bool`\
  \ 的方法中是合法的。缺少了 `public` 修饰符；鉴于该方法不再是所属类的可访问成员，因此没有必要描述其可访问性。同样，`static` 修饰符也不再需要。方法周围的繁琐操作已经大大减少。\n\
  \n然而，这种语法仍然多余地冗长。我们从委托类型推断出 Lambda 表达式必须返回 `bool`；同样地，我们可以推断出两个参数都必须是 `int` 类型，如列表\
  \ 13.13 所示。\n\n**列表 13.13：在语句表达式中省略参数类型**\n\n点击此处查看代码图像\n\n```csharp\n// ...\n\n\
  \    BubbleSort(items,                                                    \n\n \
  \       (first, second) =>                                               \n\n  \
  \      {                                                                \n\n   \
  \         return first < second;                                      \n\n     \
  \   }                                                                \n\n    );\
  \                                                                   \n\n// ...\n\
  ```\n\n`3.0`\n\n通常情况下，如果编译器可以从 Lambda 表达式转换到的委托中推断出类型，则在所有 Lambda 表达式中显式声明参数类型都是可选的。然而，对于指定类型可以使代码更具读性的情况，C#\
  \ 允许你这样做。在无法进行推断的情况下，C# 语言要求显式说明 Lambda 参数类型。如果显式指定了一个 Lambda 参数类型，那么所有类型都必须显式指定，并且它们必须与委托参数类型完全匹配。\n\
  \n还有另一种减少语法的方法，如列表 13.14 所示：如果 Lambda 表达式恰好有一个类型可以推断的参数，则可以省略参数列表周围的括号。如果有零参数或多个参数，或者单个参数是显式类型，则\
  \ Lambda 必须在参数列表周围带有括号。\n\n**列表 13.14：带有单个输入参数的语句表达式**\n\n点击此处查看代码图像\n\n```csharp\n\
