  \ 返回了 `Task`。通过返回任务，调用者可以访问异步调用的状态以及在完成时的结果（`int`）。接下来，按照惯例，方法名后加上了“Async”后缀，以表示可以使用\
  \ `await` 方法进行调用。最后，在 `CountOccurrencesAsync()` 内部我们需要异步等待异步方法的任务的所有地方，我们都包含了 `await`\
  \ 运算符。在这种情况下，这只发生在调用 `reader.ReadAsync()` 时。与 `CountOccurrencesAsync()` 一样，`StreamReader.ReadAsync()`\
  \ 是具有相同特征的 `async` 方法。\n\n`7.0`\n\n1。从技术上讲，你也可以返回任何实现了 `GetAwaiter()` 方法的类型。参见章节稍后的“高级主题：有效的异步返回类型扩展”。\n\
  \n### `结束 8.0` `5.0`\n\n回到 `Main()` 中，发生了类似的差异。当我们调用新的 `CountOccurencesAsync()`\
