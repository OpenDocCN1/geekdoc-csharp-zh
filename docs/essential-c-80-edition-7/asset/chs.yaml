  \ C# 6.0 同时添加的最重要的框架特性就是：跨平台编译。换句话说，Microsoft .NET Framework 不仅可以在 Windows 上运行，Microsoft\
  \ 还提供了可以在 Linux 和 macOS 上的运行的 .NET Core 实现。虽然 .NET Core 的功能集并不等同于完整的 Microsoft .NET\
  \ Framework，但它包含了足够的功能，使得整个（ASP.NET）网站都可以托管在 Windows 及其 Internet 信息服务器 (IIS) 之外的操作系统上。这意味着通过相同的代码库，可以编译并执行运行在多个平台上的应用程序。.NET\
  \ Core 是一个完整的 SDK，包含了所有内容，从 .NET 编译器平台（“Roslyn”，其本身运行在 Linux 和 macOS 上）到 .NET Core\
  \ 运行时，以及如 `dotnet` 命令行实用程序、`dotnet CLI`（大约在 C# 7.0 左右引入）等工具。.NET Core 和 `dotnet\
  \ CLI` 持续成熟，并随着 C# 8.0 和 .NET Core 3.0 的发布成为主流。\n\n`End 6.0` `End 7.0` `End 8.0`\n\
  \n### .NET Standard\n\n由于 .NET 有如此许多不同的实现，包括每个单独 .NET 框架的多个版本，框架变得分化，因为每个实现都支持一组只有细微重叠的\
  \ API。因此，编写可以在多个 .NET 框架之间复复用的代码变得非常困难，因为必须在代码中充斥条件检查，以判断特定的 API 是否可用。为了减少这种复杂性，.NET\
  \ Standard 应运生，作为定义哪些版本的标准支持哪些 API 的手段。`.NET Standard` 定义了 .NET 框架需要支持哪些内容以符合每个\
  \ .NET Standard 版本号。然而，由于许多实现已经发布，确定哪个 API 属于哪个标准的决策树在某种程度上是基于现有实现，以及这些现有实现与 .NET\
  \ Standard 版本号的关联。\n\n编写本文时，最新的 .NET Standard 版本是 2.1。遗憾的是，最新的 Microsoft .NET Framework\
  \ 版本——4.8——将保持在 .NET Standard 2.0，导致缺乏对 C# 8.0 的范围/索引（ranges/indices）和异步流（async\
  \ streams）特性的支持。排除这些之后，所有基础框架都实现了 .NET Standard 2.0；因此，它代表了每个框架旧版本中分化的 API 的重新统一，并允许针对每个\
  \ .NET 框架实现的最新版本进行交叉编译。\n\nMicrosoft 的愿景是，未来分化的 .NET 框架源代码将合并到一个代码库中，形成 .NET 5.0——这是\
  \ .NET Framework、.NET Core 和 Xamarin/Mono 的重新统一。随着这种合并的出现，.NET Standard 将变得不再重要——也就是说，如果所有的\
  \ .NET 框架都从同一个代码库创建，它们的 API 将自动成为统一的 API，因此不需要一个它们必须遵循的标准。欲了解更多信息，请访问 [`itl.tc/net5unification`](http://itl.tc/net5unification)。\n\
  \n### 总结\n\n本章作为 C# 的初级介绍。它提供了一种让你熟悉基础 C# 语法的方法。由于 C# 与 C++ 风格的语言，本章的大部分内容对你来说可能不是新材料。然而，C#\
  \ 和托管代码确实有一些独特的特征，例如编译为 CIL。虽然这并不独特，但 C# 的另一个关键特征是对面向对象编程的全支持。即使是如向控制台读写数据的任务也是面向对象的。面向对象是\
  \ C# 的基础，正如你将在本书中所看到的。。\n\n下一章将检查 C# 语言组成的基础数据类型，并讨论你如何使用这些数据类型与操作数结合形成表达式。\n\n\
  # 2. 数据类型\n\n从第 1 章的 `HelloWorld` 程序中，你对 C# 语言、其结构、基本语法特征以及如何编写最简单的程序有了感觉。本章将通过研究基础\
  \ C# 类型继续讨论 C# 基础知识。\n\n![一张思维图显示了第 2 章的内容，与数据类型相关。](img/02mindmap.jpg)\n\n到为止，你只处理过少数内置数据类型，且几乎没有解释。在\
  \ C# 中存在着数千种类型，你可以组合类型来创建新类型。然而，C# 中的某些类型相对简单，被认为是所有其他类型的构建基石。这些类型是`预定义类型`（predefined\
  \ types）。C# 语言的预定义类型包括八种整数类型、两种用于科学计算的二进制浮点类型、一种用于财务计算的十进制浮点类型（decimal）、一个布尔类型和一个字符类型。本章将研究这些类型，并更仔细地观察\
  \ `string` 类型。\n\n## 基础数值类型\n\nC# 中的基本数值类型有与之相关的关键字。这些类型包括整数类型、浮点类型以及一种名为 `decimal`\
  \ 的特殊浮点类型，用于存储没有表示误差的大数。\n\n### 整数类型\n\n有八种 C# 整数类型，如表 2.1 所示。这种多样性允许你选择足够容纳其预期值范围的数据类型，而不浪费资源。\n\
  \n| 类型 | 大小 | 范围（包含） | BCL 名称 | 符号位 | 字面量后缀 |\n| :--- | :--- | :--- | :--- | :---\
  \ | :--- |\n| `sbyte` | 8 字节 | –128 到 127 | System.SByte | 是 | |\n| `byte` | 8 字节\
  \ | 0 到 255 | System.Byte | 否 | |\n| `short` | 16 字节 | –32,768 到 32,767 | System.Int16\
  \ | 是 | |\n| `ushort` | 16 字节 | 0 到 65,535 | System.UInt16 | 否 | |\n| `int` | 32\
  \ 字节 | –2,147,483,648 到 2,147,483,647 | System.Int32 | 是 | |\n| `uint` | 32 字节 |\
  \ 0 到 4,294,967,295 | System.UInt32 | 否 | U 或 u |\n| `long` | 64 字节 | –9,223,372,036,854,775,808\
  \ 到 9,223,372,036,854,775,807 | System.Int64 | 是 | L 或 l |\n| `ulong` | 64 字节 |\
  \ 0 到 18,446,744,073,709,551,615 | System.UInt64 | 否 | UL 或 ul |\n\n**表 2.1: 整数类型**\n\
  \n在表 2.1 中（以及表 2.2 和 2.3）包含了每个类型的全称列；我们将在本章稍后讨论字面量后缀。\n\n\n\n\n\n保持一致性的选择往往可能与其他指南发生冲突。例如，根据使用\
  \ C# 关键字代替 BCL 名称的指南，你可能会发现自己正在维护一个采用相反风格的文件（或文件库）。在这种情况下，与之前的风格保持一致会更好，这比强硬地在命名约定中引入新风格和不一致性要好。尽管如此，如果这种“风格”是一种可能导致\
  \ Bug 并阻碍成功维护的糟糕编码实践，请务必彻地纠正该问题。\n\n`Begin 8.0`\n\n### 浮点类型 (`float`, `double`)\n\
  \n浮点数具有不同程度的精度，二进制浮点类型只有在当分母为 `2` 的幂次的分式时，才能精确地表示数字。如果你将一个浮点变量的值设置为 `0.1`，它很容易被表示为\
  \ `0.0999999999999999` 或 `0.10000000000000001` 或其他非常接近 `0.1` 的数字。同样，将变量设置为诸如阿伏加德常数\
  \ `6.02 × 10²³` 这样的大数字可能会导致大约 `10⁸` 的表示误差，而这毕竟只是该数字的一个极小部分。浮点数的精度与其所表示的数字的大小成正比。浮点数精确到特定数量的有效数字，而不是\
  \ `±0.01` 这样的固定值。从 .NET Core 3.0 开始，`double` 最多有 17 位有效数字，`float` 最有 9 位有效数字（假设该数字不是如“高级章节：深度解析浮点类型”所述从字符串转换来的）。\n\
  \n[1]。在 .NET Core 3.0 之前，位数（二进制位）可以转换为 15 位十进制，余数贡献第 16 位十进制，如表 2.2 所示。具体而言，位于 `1.7\
  \ × 10³⁰⁷` 到小于 `1 × 10³⁰⁸` 的数字只有 15 位有效数字。然而，从 `1 × 10³⁰⁸` 到 `1.7 × 10³⁰⁸` 的数字将具有\
  \ 16 位有效数字。`decimal` 类型也存在类似的有效数字范围。\n\nC# 支持表 2.2 中列出的两种二进制浮点数类型。为了人类可读性，二进制数以十进制数的形式出现。\n\
  \n| 类型 | 大小 | 范围（包含） | BCL 名称 | 有效数字 | 字面量后缀 |\n| :--- | :--- | :--- | :--- | :---\
  \ | :--- |\n| `float` | 32 bits | ±1.5 × 10^(−45) 到 ±3.4 × 10³⁸ | `System.Single`\
  \ | 7 | `F` 或 `f` |\n| `double` | 64 bits | ±5.0 × 10^(−324) 到 ±1.7 × 10³⁰⁸ | `System.Double`\
  \ | 15–16 | `D` 或 `d` |\n\n**表 2.2: 浮点类型**\n\n`End 8.0`\n\n`decimal` 由 `±N * 10`^k`\
  \ 表示，其中满足以下条件：\n\n*   `N`，尾数，是一个正的 96 位整数。\n*   `k`，指数，由 `-28 <= k <= 0` 给出。\n\n\
  相比之下，二进制浮点数是任何满足以下条件的 `±N * 2`^k` 数字：\n\n*   `N` 是正的 24 位（对于 `float`）或 53 位（对于 `double`）整数。\n\
  *   `k` 是一个整数，`float` 范围从 `-149` 到 `+104`，`double` 范围从 `-1074` 到 `+970`。\n\n###\
  \ Decimal 类型\n\nC# 还提供了一种具有 128 位精度的十进制浮点类型（见表 2.3）。该类型适用于财务计算。\n\n| 类型 | 大小 | 范围（包含）\
  \ | BCL 名称 | 有效数字 | 字面量后缀 |\n| :--- | :--- | :--- | :--- | :--- | :--- |\n| `decimal`\
  \ | 128 bits | 1.0 × 10^(−28) 到大约 7.9 × 10²⁸ | `System.Decimal` | 28–29 | `M` 或\
  \ `m` |\n\n**表 2.3: Decimal 类型**\n\n与二进制浮点数不同，`decimal` 类型在其范围内的所有十进制数均保持精确。因此，使用\
  \ `decimal` 类型时，`0.1` 的值精确等于 `0.1`。然而，虽然 `decimal` 类型的精度高于浮点类型，但它的范围较小。因此，从浮点类型到\
  \ `decimal` 类型的转换可能会溢出错误。此外，使用 `decimal` 进行计算的速度较慢。\n\n\n\n\n\n偶尔，数字可能会变得非常大且难以阅读。为了解决可读性问题，`C#\
  \ 7.0` 在表示数字字面量时增加了对**数字分隔符**（即下划线 `_`）的支持，如列表 2.4 所示。\n\n**列表 2.4：指定数字分隔符**\n\n\
  点击此处查看代码图像\n\n```\nSystem.Console.WriteLine(9_814_072_356);\n```\n\n在这种情况下，我们将数字分成了千位（每三位一组），但\
  \ `C#` 并不强制要求这样做。你可以使用数字分隔符创建任何你喜欢的分组，只要下划线出现在第一个和最后一个数字之间即可。事实上，你甚至可以让多个下划线并列——它们之间没有任何数字。\n\
  \n`结束 7.0`\n\n此外，你可能希望使用指数计数法，而不是在小数点前或后写出多个零（无论是否使用数字分隔符）。要使用指数计数法，请提供 `e` 或 `E`\
  \ 间符，在该间符后跟一个正或负整数，并用适当的数据类型后缀完成字面量。例如，你可以以 `float` 类型打印出阿伏加罗数，如列表 2.5 和输出 2.4 所示。\n\
  \n**列表 2.5：指数计数法**\n\n点击此处查看代码图像\n\n```\nSystem.Console.WriteLine(6.023E23F);\n\
  ```\n\n**输出 2.4**\n\n```\n6.023E+23\n```\n\n在目前为止对字面量数值值的讨论中，我们只涵盖了十进制类型值。`C#` 也支持指定十六进制值。要指定十六进制值，请在值名前加缀\
  \ `0x`，然后使用任何十六进制数字序列，如列表 2.6 所示。\n\n**列表 2.6：十六进制字面量值**\n\n点击此处查看代码图像\n\n```\n\
  // 使用十六进制字面量显示值 42\n\nSystem.Console.WriteLine(0x002A);\n```\n\n输出 2.5 显示了列表 2.6\
  \ 的结果。请注意，这段代码显示的仍然 `42`，而不是 `0x002A`。\n\n**输出 2.5**\n\n```\n42\n```\n\n`开始 7.0`\n\
  \n从 `C# 7.0` 开始，你还可以将数字表示为二进制（参见列表 2.7）。\n\n**列表 2.7：二进制字面量值**\n\n点击此处查看代码图像\n\n\
  ```\n// 使用二进制字面量显示值 42\n\nSystem.Console.WriteLine(0b101010);\n```\n\n该语法与十六进制语法相似，但使用\
  \ `0b` 作为前缀（也允许大写的 `B`）。参见第 4 章中的入门主题：位与字节，以了解二进制表示以及二进制与进制之间的转换。\n\n请注意，从 `C# 7.2`\
  \ 开始，你可以将数字分隔符放在十六进制字面量的 `x` 之后或二进制字面量的 `b` 之后。\n\n`结束 7.0`\n\n### 基本类型\n\n目前讨论的基本类型是数值类型。`C#`\
  \ 还包含一些额外类型：`bool`、`char` 和 `string`。\n\n### 布尔类型 (`bool`)\n\n另一个 `C#` 原生类型是布尔类型\
  \ `bool`，它在条件语句和表达式中表示真或假。允许的值是关键字 `true` 和 `false`。`bool` 的 BCL 名称是 `System.Boolean`。例如，为了以不区分大小的情况下比较两个字符串，你可以调用\
  \ `string.Compare()` 方法并传递布尔字面量 `true`（参见列表 2.10）。\n\n**列表 2.10：两个字符串的区分区分大小的比较**\n\
  \n点击此处查看代码图像\n\n```\nstring option;\n\n...\n\nint comparison = string.Compare(option,\
  \ \"/Help\", true);\n```\n\n在这种情况下，你对变量 `option` 的内容与字面量 `/Help` 进行不区分大小的比较，并将结果赋值给\
  \ `comparison`。\n\n虽然从理论上一个位可以存储布尔值，但 `bool` 的大小是 1 字节。\n\n### 字符类型 (`char`)\n\n\
  `char` 类型表示 16 位字符，其可能值的集合取自 Unicode 字符集的 UTF-16 编码。`char` 的大小与 16 位无符号整数 (`ushort`)\
  \ 相同，后者表示 0 到 65,535 之间的值。然而，`char` 是 `C#` 中的一种特殊类型，代码应当将其视为特殊类型。\n\n`char` 的 BCL\
  \ 名称是 `System.Char`。要构造 `char`，请使用单引号 (`'`)），例如 `'A'`。表 2.4 显示了转义序列。某些字符不能直接放入代码中；相反，使用反斜杠\
  \ (`\\`) 来表示它们。Unicode 字符由其后的十六进制值表示。\n\n**表 2.4：转义字符**\n\n| 转义序列 | 字符名称 | Unicode\
  \ 编码 |\n| :--- | :--- | :--- |\n| `\\'` | 单引号 | `\\u027` |\n| `\\\"` | 双引号 | `\\\
  u022` |\n| `\\\\` | 反斜杠 | `\\u05C` |\n| `\\0` | 空字符 | `\\u000` |\n| `\\a` | 警报（系统蜂声）\
  \ | `\\u007` |\n| `\\b` | 退格 | `\\u008` |\n| `\\f` | 换符 | `\\u00C` |\n| `\\n` |\
  \ 行符（有时称为换行） | `\\u00A` |\n| `\\r` | 回车 | `\\u00D` |\n| `\\t` | 水平制符 | `\\u009`\
  \ |\n| `\\v` | 垂直制符 | `\\u00B` |\n| `\\uxxxx` | 十六进制 Unicode Unicode | `\\u3A` |\n\
  | `\\x[n][n][n]n` | 十六进制 Unicode Unicode（前三个占位符可选）；`\\uxxxx` 的变长版本 | `\\D` |\n|\
  \ `\\Uxxxxxxxx` | 创建代理对的 Unicode 转义序列 | `\\UD840DC1` |\n\n### 字符串\n\n零或多个字符的有限序列被称为**字符串**。`C#`\
  \ 中的字符串类型是 `string`，其 BCL 名称为 `System.String`。字符串类型包含一些令熟悉其他编程语言的开发者感到意外的特性。除了在第\
  \ 1 章 中中讨论的字符串字面量格式外，字符串还包括前缀为 `@` 的“逐字字面量”、使用 `$` 前缀字符支持字符串插值，以及字符串是不可变的这一令人惊讶的事实。\n\
  \n### 字面量\n\n你可以通过将文本放在双引号 (`\"`) 中在代码中输入字面量，正如你在 `HelloWorld` 程序中所看到的那样。字符串由字符组成，因此字符转义序列可以嵌入字符串中。\n\
  \n\n\n\n例如，在列表 2.13 中，显示了两行文本。然而，代码列表并没有使用 `System.Console.WriteLine()`，而是使用了带有换行符\
  \ `\\n` 的 `System.Console.Write()`。输出 2.9 显示了结果。\n\n#### 列表 2.13：使用 `\\n` 字符插入换行\n\
  \n点击此处查看代码图像\n\n```csharp\nclass DuelOfWits\n{\n  static void Main()\n  {\n    \
  \  System.Console.Write(\n          \"\\\"Truly, you have a dizzying intellect.\\\
  \"\");\n      System.Console.Write(\"\\n\\\"Wait 'til I get going!\\\"\\n\");\n\
  \  }\n}\n```\n\n#### 输出 2.9\n\n点击此处查看代码图像\n\n```\n\"Truly, you have a dizzying intellect.\"\
  \n\"Wait 'til I get going!\"\n```\n\n双引号的转义序列将打印出的双引号与定义字符串开始和结束的双引号区分开来。\n\n在 C#\
  \ 中，你可以在字符串前面使用 `@` 符号表示反斜杠不应被解释为转义序列的开头。生成的`逐字字符串字面量`（verbatim string literal）不会重新解释反斜杠字符。使用\
  \ `@` 字符串语法时，空白字符也被原样处理。例如，在列表 2.14 中的三角形在控制台中显示的内容与输入完全一致，包括反斜杠、换行和缩进。输出 2.10 显示了结果。\n\
  \n#### 列表 2.14：使用逐字字符串字面量显示三角形\n\n点击此处查看代码图像\n\n```csharp\nclass Triangle\n{\n \
  \ static void Main()\n  {\n      System.Console.Write(@\"begin\n\n             /\\\
  \\\n\n            /  \\\\\n\n           /    \\\\\n\n          /      \\\\\n\n \
  \        /________\\\\\n\nend\");\n  }\n}\n```\n\n#### 输出 2.10\n\n```\nbegin\n\n\
  \             /\\\n            /  \\\n           /    \\\n          /      \\\n\
  \         /________\\\nend\n```\n\n如果没有 `@` 字符，这段代码甚至无法编译。事实上，即使你将形状改为正方形并消除了反斜杠，代码仍然无法编译，因为在没有以\
  \ `@` 符号前头的字符串内部无法放置换行符。\n\n逐字字符串支持唯一转义序列是 `\"\"`，它表示双引号且不会终止字符串。\n\n如果同一个字符串字面量在程序集中出现多次，编译器将在程序集中只定义一次该字符串，所有变量将引用同一个字符串。这样，如果将一个包含数千个字符的相同字符串字面量多次放置在代码中，生成的程序集大小将仅反映其中一个的大小。\n\
  \n`开始 6.0`\n\n### 字符串插值\n\n如第 1 章 所述，从 C# 6.0 开始，当使用字符串插值格式时，字符串可以支持嵌入表达式。字符串插值语法在逐字字符串字面量前加上一个美元符号\
  \ `$`，然后在大括号内嵌入表达式。以下是一个示例：\n\n点击此处查看代码图像\n\n```csharp\nSystem.Console.WriteLine($\"\
  Your full name is {firstName} {lastName}.\");\n```\n\n其中 `firstName` 和 `lastName`\
  \ 是引用变量的简单表达式。\n\n`开始 8.0`\n\n注意，逐字字符串字面量可以通过在 `@` 符号之前指定 `$`（或从 C# 8.0 开始使用 `@$...\"\
  `）来与字符串插值结合，如下例所示：\n\n点击此处查看代码图像\n\n```csharp\nSystem.Console.WriteLine($@\"Your\
  \ full name is:\n\n    { firstName } { lastName }\");\n```\n\n`结束 8.0`\n\n由于这是一个逐字字符串字面量，文本是分两行输出的。然而，你可以通过如下方式将换行符放在大括号内，在代码中产生类似的换行，而不会在输出中产生换行：\n\
  \n点击此处查看代码图像\n\n```csharp\nSystem.Console.WriteLine($@\"Your full name is: {\n\n\
  \    firstName } { lastName }\");\n```\n\n注意，即使只在大括号内放置换行符，`@` 符号仍然是必需。\n\n`结束 6.0`\n\
  \n### 字符串方法\n\n`string` 类型与 `System.Console` 类型一样，包含了几个方法。例如，有用于格式化、拼接和比较字符串的方法。\n\
  \n表 2.5 中的 `Format()` 方法行为与 `Console.Write()` 和 `Console.WriteLine()` 方法类似，不同在于它不是在控制窗口中显示结果，而是`string.Format()`\
  \ 将结果返回给调用者。当然，使用字符串插值后，`string.Format()` 的需求显著减少（本地化支持除外）。但在底层，`string.Format()`\
  \ 仍然将结果返回给调用者。\n\n\n\n\n无论你是使用 `string.Format()` 还是 C# 6.0 的字符串插值功能来构建复杂的格式化字符串，都有一套丰富且复杂的复合格式化模式可显示数字、日期、时间、时间跨等。例如，如果\
  \ `price` 是 `decimal` 类型的变量，那么 `string.Format(\"{0,20:C2}\", price)` 和等价的插值 `$\"\
  {price,20:C2}\"` 都会使用默认的货币格式规则将小数值转换为字符串，保留小数点后两位，并在宽度为 20 字符的字符串中右对齐。由于空间限制，无法详细讨论所有可能的格式化字符串；请参考关于复合格式化的\
  \ MSDN 文档（[`itl.tc/CompositeFormatting`](http://itl.tc/CompositeFormatting)）获取所有可能的完整列表。\n\
  \n如果你想在插值字符串或格式化字符串内部实际使用左或右大括号，可以使用双大括号来表示它不是引入模式。例如，插值字符串 `$\"{{ {price:C2} }}\"\
  ` 可能产生字符串 `\"{ $1,234.56 }\"`。\n\n## 换行 (Newline)\n\n在编写换行符时，换行的精确字符取决于你执行代码的操作系统。在\
  \ Microsoft Windows 操作系统上，换行是回车符（`\\r`）和换行符（`\\n`）的组合，而 UNIX 使用单个换行符。克服操作系统之间差异的一种方法是直接使用\
  \ `System.Console.WriteLine()` 输出一个空行。另一种方法（对于在多个操作系统上处理同一代码库的换行符至关重要）是使用 `System.Environment.NewLine`。换句话说，`System.Console.WriteLine(\"\
  Hello World\")` 和 `System.Console.Write($\"Hello World{System.Environment.NewLine}\"\
  )` 是等价的。然而，在 Windows 上，`System.WriteLine()` 和 `System.Console.Write(System.Environment.NewLine)`\
  \ 等于 `System.Console.Write(\"\\r\\n\")`——而不是 `System.Console.Write(\"\\n\")`。总之，请依赖\
  \ `System.WriteLine()` 和 `System.Environment.NewLine` 而不是 `\\n`，以便让在 Linux 和 iOS\
  \ 上运行相同的代码能够适应 Windows 特有的操作系统特性。\n\n## 字符串长度 (String Length)\n\n要确定字符串的长度，你使用一个名为\
  \ `Length` 的字符串成员。这个特定成员被称为`只读属性`。因此，它不能被设置，且调用它不需要任何参数。代码列表 2.16 演示了如何使用 `Length`\
  \ 属性，而输出 2.11 显示了结果。\n\n#### 列表 2.16：使用 `string` 的 `Length` 成员\n\n点击此处查看代码图像\n\n\
  ```cs\nclass PalindromeLength\n{\n  static void Main()\n  {\n      string palindrome;\n\
  \      System.Console.Write(\"Enter a palindrome: \");\n      palindrome = System.Console.ReadLine();\n\
  \      System.Console.WriteLine(\n          $\"The palindrome \\\"{palindrome}\\\
  \" is\"\n          + $\" {palindrome.Length} characters.\");\n  }\n}\n```\n\n###\
  \ 输出 2.11\n\n点击此处查看代码图像\n\n```\nEnter a palindrome: Never odd or even\nThe palindrome\
  \ \"Never odd or even\" is 17 characters.\n```\n\n字符串的长度不能直接设置；它是根据字符串中的字符数计算出来的。此外，字符串的长度不能改变，因为字符串是`不可变`的。\n\
  \n## 字符串是不可变的 (Strings Are Immutable)\n\n`string` 类型的一个关键特性是它是不可变的。字符串变量可以分配一个完全不同的值。由于字符串是不可变的，因此无法修改其内容。字符串变量可以分配一个新值，但不会修改原始字符串。考虑列表\
  \ 2.17 作为示例。\n\n### 列表 2.17：不可变\n\n点击此处查看代码图像\n\n```cs\nclass Uppercase\n{\n  static\
  \ void Main()\n  {\n      string text;\n      System.Console.Write(\"Enter text:\
  \ \");\n      text = System.Console.ReadLine();\n      // 无法修改 text\n      text.ToUpper();\
  \                                                          \n  }\n}\n```\n（注：此处根据上下文逻辑微调，原文示例代码可能存在截断或逻辑描述，翻译保持原意）\n\
  \n*修正翻译逻辑：*\n`string` 类型的一个关键特性是它是不可变的。字符串变量可以分配一个完全不同的值。由于字符串是不可变的，因此无法修改其内容。等等，重新看原文。原文是：\n\
  \"A key characteristic of the `string` type is that it is immutable. A string variable\
  \ can be assigned an entirely different value. Because a string is immutable, its\
