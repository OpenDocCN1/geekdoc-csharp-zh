  ## 有用笔记\n\n根据你的经验水平，特殊功能将帮助你阅读本文。\n\n*   初学者主题（Beginner Topics）提供专门针对初级程序员的定义或解释。\n\
  *   高级主题（Advanced Topics）让经验丰富的开发者能够关注与他们最相关的材料。\n*   注记提示（Callout notes）在框框中强调关键原则，以便读者轻松识别其重要性。\n\
  *   语言对比（Language Contrast）侧边栏识别 C# 与其前身之间的关键差异，以帮助熟悉其他语言的人。\n\n## 本书结构\n\n从高层次上说，软件工程关于管理复杂性，为了这一目标，我组织了\
  \ *Essential C# 8.0*。第 1 章–第 5 章介绍了结构化编程，使你能够立即开始编写简单的功能代码。第 6 章–第 10 章介绍了 C# 的面向对象结构。初级读者在继续学习本书部分的更高级的主题之前，应该专注于完全理解这一部分。第\
  \ 12 章–第 14 章引入了几乎现代程序所需的额外降复杂结构。书以第 24 章关于通用语言的内容结束，该章节在开发背景下描述了 C#。这一章之所以出现在最后，因为它不是\
  \ C# 特有的，并且与书中部分的语法和编程风格有所不同。然而，这一章适合在任何时候阅读，可能在第 1 章之后阅读最为合适。\n\n以下是每章的描述（在此列表中，以**粗体**显示的章节编号表示包含\
  \ C# 7.0-8.0 内容）。\n\n*   第 1 章，介绍 C#：在展示了 C# 的 `HelloWorld` 程序后，本章将对其进行剖析。这应该让读者熟悉\
  \ C# 程序的的外和感觉，并提供如何编译和调试自己程序的详细信息。它还触及了 C# 程序执行的上下文及其中间语言。\n*   第 2 章，数据类型：运行的程序操纵数据，本章介绍了\
  \ C# 的原始数据类型。\n*   ***第 3 章****，深入数据类型：本章涵盖了两种类型类别，值类型和引用类型。从那里开始，深入探讨了隐式类型局部变量、元组、可空修饰以及\
  \ C# 8.0 引入的可空引用类型。它以对原始数组结构的深入观察结束。\n*   第 4 章，运算符和控制流：为了利用计算机的迭代能力，你需要在程序中包含循环和条件逻辑。本章还涵盖了\
  \ C# 运算符、数据转换和预指令。\n*   第 5 章，方法和参数：本章研究了方法及其参数的细节。它包括按值传递、引用传递以及通过 `out` 参数返回数据。C#\
  \ 4.0 增加了对默认参数的支持，本章解释了如何使用默认参数。\n\n\n\n\n\n# 第 6 章：类 (`ch06.xhtml_ch06`)\n在掌握了类的基本构建块之后，本章将这些构造组合形成功能完整的类型。类通过定义对象的模板，构成了面向对象技术的核心。本章还包含了\
  \ C# 8.0 中新引入的可空属性。\n\n# 第 7 章：继承 (`ch07.xhtml_ch07`)\n虽然继承是许多开发者的编程基础，但 C# 提供了一些独特的构造结构，例如\
  \ `new` 修饰符。本章将讨论继承语法的细节，包括重写（overriding）。\n\n# 第 8 章：接口 (`ch08.xhtml_ch08`)\n本章演示了如何使用接口来定义类之间可版本的交互契约。C#\
  \ 包含了显式和隐式接口成员实现，实现了大多数其他语言都不支持的额外封装级别。随着默认接口成员的引入，C# 8.0 中新增了关于接口版本控制的新章节。\n\n\
  # 第 9 章：值类型 (`ch09.xhtml_ch09`)\n虽然不像定义引用类型那样常见，但有时需要定义行为与 C# 内置原始类型相似的值类型。本章描述了如何定义结构体（structures），同时解释了它们可能引入的特性。\n\
  \n# 第 10 章：良好的类型 (`ch10.xhtml_ch10`)\n本章讨论了更高级的类型定义。它解释了如何实现运算符（如 `+`）和转换，并描述了如何将多个类封装到单个库中。此外，本章演示了命名空间和\
  \ XML 注释的定义，并讨论了如何为垃圾收集设计类。\n\n# 第 11 章：异常处理 (`ch11.xhtml_ch11`)\n本章扩展了第 5 章 (`ch05.xhtml_ch05`)\
  \ 中异常处理的介绍，描述了异常如何遵循层次结构以便创建自定义异常。它还包含了一些关于异常处理的最佳实践。\n\n# 第 12 章：泛型 (`ch12.xhtml_ch12`)\n\
  泛型也许是 C# 1.0 缺失的核心特性。本章全面涵盖了这一 2.0 特性。此外，C# 4.0 增加了对协变（covariance）和逆变（contravariance）的支持——这些内容在本章的泛型上下文中进行了讨论。\n\
  \n# 第 13 章：委托与 Lambda 表达式 (`ch13.xhtml_ch13`)\n委托通过定义代码中处理事件的模式，开始清晰地将 C# 与其前身区分开来。这几乎消除了编写轮询程序的需要。Lambda\
  \ 表达式是使 C# 3.0 LINQ 的关键概念。本章解释了 Lambda 表达式如何通过提供更优雅、简洁的语法在委托构造的基础上进行构建。本章为接下来的集合\
  \ API 奠定了基础。\n\n# 第 14 章：事件 (`ch14.xhtml_ch14`)\n封装的委托被称为事件，是公共语言运行时（CLR）的核心构造。另一个\
  \ C# 2.0 特性——匿名方法也在此处介绍。\n\n# 第 15 章：带有标准查询操作符的集合接口 (`ch15.xhtml_ch15`)\nC# 3.0\
  \ 引入的简单而又强大的变化在本章开始大放异彩，我们将查看 `Enumerable` 类的扩展方法。该类提供了名为标准查询操作符的集合 API，本文将对其进行详细讨论。\n\
  \n# 第 16 章：带有查询表达式的 LINQ (`ch16.xhtml_ch16`)\n仅使用标准查询操作符会导致某些难以理解的长语句。然而，查询表达式提供了一种与\
  \ SQL 紧密匹配的替代语法，正如本章所描述的那样。\n\n# 第 17 章：构建自定义集合 (`ch17.xhtml_ch17`)\n在构建针对业务对象的自定义\
  \ API 时，有时需要创建自定义集合。本章详细介绍了如何实现这一点，并在过程中引入了让构建自定义集合变得更容易的上下文关键字（contextual keywords）。\n\
  \n# 第 18 章：反射、属性与动态编程 (`ch18.xhtml_ch18`)\n面向对象编程在 20 世纪 80 年代后期形成了程序结构范式转移的基础。同样，属性（attributes）促进了声明式编程和嵌入式元数据，开启了一种新范式。本章查看了属性，并讨论了如何通过反射（reflection）检索它们。它还涵盖了通过基类类库（Base\
  \ Class Library）中的序列化框架进行文件输入和输出的内容。在 C# 4.0 中，语言添加了一个新关键字 `dynamic`。这消除了运行时的所有类型检查，显著扩展了\
  \ C# 的功能范围。\n\n# 第 19 章：引入多线程 (`ch19.xhtml_ch19`)\n大多数现代程序都需要使用线程来执行耗时任务。随着程序变得越来越复杂，它们必须采取额外的措施来保护数据。本章介绍了如何处理任务（tasks）、如何包含它们，以及如何处理在这些环境中执行的异常。\n\
  \n# 第 20 章：基于任务的异步编程 (`ch20.xhtml_ch20`)\n本章深入研究了基于任务的异步模式及其相应的 `async`/`await`\
  \ 语法。它为多线程编程提供了一种显著简化的方法。此外，还包含了 C# 8.0 的异步流概念。\n\n# 第 21 章：并行迭代 (`ch21.xhtml_ch21`)\n\
  引入性能改进的一种简单方法是使用 `Parallel` 对象或 Parallel LINQ 库并行迭代数据。\n\n# 第 22 章：线程同步 (`ch22.xhtml_ch22`)\n\
  多线程应用程序是复杂的。在上一章的基础上，本章演示了某些内置的线程模式支持，可以简化多线程代码的显式控制。\n\n# 第 23 章：平台互操作性与不安全代码 (`ch23.xhtml_ch23`)\n\
  由于 C# 是一种相对年轻的语言，用其他语言编写的代码远比 C# 多。为了利用这些现有代码，C# 通过 P/Invoke 支持互操作性（即调用非托管代码）。此外，C#\
  \ 还允许使用指针和直接内存操作。虽然带有指针的代码需要特殊权限才能运行，但它提供了与传统的 C 语言应用程序接口完全互操作的能力。\n\n# 第 24 章：公共语言基础设施\
  \ (`ch24.xhtml_ch24`)\n从根本上说，C# 是设计在底层公共语言基础设施（CLI）之上的最有效编程语言。本章深入探讨了 C# 程序与底层运行时及其规范的关系。\n\
  \n## C# 6.0, 7.0 和 8.0 索引\n这些索引为 C# 6.0 到 8.0 中添加的功能提供了快速参考。它们专门设计用于帮助程序员快速将他们的语言技能更新到较新的版本。\n\
  \n我希望这本书能成为你建立 C# 专业知识的极佳资源，并且在你精通 C# 很久之后，仍然参考它来处理那些你不经常使用的领域。\n\n—Mark Michaelis\n\
