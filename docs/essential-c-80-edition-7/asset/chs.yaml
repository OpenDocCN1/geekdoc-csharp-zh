  飞行器 (1903)\n蒸汽机车 (1815)\n滴液沉积装置 (1989)\n无背胸罩 (1914)\n本杰明·富兰克林（宾夕法尼亚州，费城）\n奥维尔·莱特（北卡罗来纳州，基蒂霍克）\n\
  威尔伯·莱特（北卡罗来纳州，基蒂霍克）\n塞缪尔·摩斯（纽约州，纽约）\n乔治·斯蒂芬森（诺德兰郡，威尔姆）\n约翰·迈克利斯（伊利诺伊州，芝加哥）\n玛丽·菲尔斯·雅各布（纽约州，纽约）\n\
  ```\n\n### 使用 `Where()` 进行过滤\n\n为了从集合中过滤数据，我们需要提供一个返回 `true` 或 `false` 的过滤方法，用指示是否包含某个特定元素。接收参数并返回布尔值的委托表达式称为“谓词”（`predicate`），集合的\
  \ `Where()` 方法依赖谓词来识别过滤标准，如列表 15.10 所示。（从技术上讲，`Where()` 方法的结果是一个 `object`，它封装了使用给定谓词过滤给定序列的操作。）结果显示在输出\
  \ 15.2 中。\n\n**列表 15.10：使用 `System.Linq.Enumerable.Where()` 进行过滤**\n\n点击此处查看代码图像\n\
  \n```c\nusing System;\nusing System.Collections.Generic;\nusing System.Linq;\nclass\
  \ Program\n{\n  static void Main()\n  {\n      IEnumerable<Patent> patents = PatentData.Patents;\n\
  \n      patents = patents.Where(                                 \n          patent\
  \ => patent.YearOfPublication.StartsWith(\"18\"));\n\n      Print(patents);\n  }\n\
  \  // ...\n}\n```\n\n**输出 15.2**\n\n```\nPhonograph (1877)\nKinetoscope (1888)\n\
  Electrical Telegraph (1837)\nSteam Locomotive (1815)\n```\n\n注意代码将 `Where()` 调用的输出赋值回\
  \ `IEnumerable<T>`。换句话说，`IEnumerable<T>.Where()` 的输出是一个新的 `IEnumerable<T>` 集合。在列表\
  \ 15.10 中，它是 `IEnumerable<Patent>`。\n\n`3.0`\n\n不那么明显的是，`Where()` 表达式参数并不一定在赋值时已经执行。这对于许多标准查询操作符都是如此。以\
  \ `Where()` 为例，表达式被传递到集合并被“保存”，但并没有被执行。相反，表达式的执行只有在需要开始迭代集合中的项时才会发生。例如，一个 `foreach`\
  \ 循环（如 `Print()` 方法中的循环，见列表 15.9）可以触发对集合中每个项求值。至少从概念上来说，`Where()` 方法应该被理解为指定关于集合中出现内容的查询手段，而不是迭代项以产生一个可能项更少的新集合所涉及的实际工作。\n\
  \n### 使用 `Select()` 进行投影\n\n由于 `IEnumerable<T>.Where()` 方法的输出是一个新的 `IEnumerable<T>`\
  \ 集合，因此可以再次对同一个集合调用标准查询操作符。例如，我们不仅可以过滤原始集合中的数据，还可以对数据进行转换（见列表 15.11）。\n\n**列表 15.11：使用\
  \ `System.Linq.Enumerable.Select()` 进行投影**\n\n点击此处查看代码图像\n\n```csharp\nusing System;\n\
  using System.Collections.Generic;\nusing System.Linq;\nclass Program\n{\n  static\
  \ void Main()\n  {\n      IEnumerable<Patent> patents = PatentData.Patents;\n\n\
  \      IEnumerable<Patent> patentsOf1800 = patents.Where(\n          patent => patent.YearOfPublication.StartsWith(\"\
  18\"));\n\n      IEnumerable<string> items = patentsOf1800.Select(             \
  \           \n          patent => patent.ToString());                          \
  \              \n\n      Print(items);\n  }\n  // ...\n}\n```\n\n在列表 15.11 中，我们创建了一个新的\
  \ `IEnumerable<string>` 集合。在这种情况下，恰好添加 `Select()` 调用并没有改变输出——但这仅仅是因为 `Print()` 的\
  \ `Console.WriteLine()` 调用本身已经使用了 `ToString()`。显然，每个项仍然发生了从原始集合的 `Patent` 类型到 `items`\
  \ 集合的 `string` 类型的转换。\n\n考虑列表 15.12 中使用 `System.IO.FileInfo` 的示例。\n\n**列表 15.12：使用\
  \ `System.Linq.Enumerable.Select()` 和 new 进行投影**\n\n点击此处查看代码图像\n\n```csharp\n//\
  \ ...\n\nIEnumerable<string> fileList = Directory.GetFiles(\n    rootDirectory,\
  \ searchPattern);\n\nIEnumerable<FileInfo> files = fileList.Select(\n    file =>\
  \ new FileInfo(file)); // ...\n```\n*(注：列表 15.12 的源代码被截断/碎片化；我根据提供的文本重建了逻辑).*\n\n\
  在列表 15.12 中，`fileList` 的类型是 `IEnumerable<string>`。然而，通过 `Select` 提供的投影，我们可以集合中的每个项转换为\
  \ `FileInfo`。最后，利用元组，我们可以创建一个 `IEnumerable<T>`，其中 `T` 是一个元组（见列表 15.13 和输出 15.3）。\n\
  \n**列表 15.13：投影到元组**\n\n点击此处查看代码图像\n\n```csharp\n// ...\n\nIEnumerable<string> fileList\
  \ = Directory.GetFiles(\n    rootDirectory, searchPattern);\n\nIEnumerable<(string\
  \ FileName, long Size)> items = fileList.Select(\n    file => new\n    {\n     \
  \   FileName = file.Name,\n        Size = file.Length\n    });\n\n// ...\n```\n\n\
  **输出 15.3**\n\n点击此处查看代码图像\n\n```\nFileName = AssemblyInfo.cs, Size = 1704\nFileName\
  \ = CodeAnalysisRules.xml, Size = 735\nFileName = CustomDictionary.xml, Size = 199\n\
  FileName = EssentialCSharp.sln, Size = 40415\nFileName = EssentialCSharp.suo, Size\
  \ = 454656\nFileName = EssentialCSharp.vmdi, Size = 499\nFileName = EssentialCSharp.vssscc,\
  \ Size = 256\nFileName = intelliTechture.ConsoleTester.dll, Size = 24576\nFileName\
  \ = intelliTechture.ConsoleTester.pdb, Size = 30208\n```\n\n匿名类型的输出会自动显示属性名称及其值，作为与匿名类型关联的生成的\
  \ `ToString()` 方法的一部分。\n\n`3.0`\n\n### 使用 `Count()` 计算元素\n\n在项集合上经常执行的另一种查询是获取计数。为了支持这种查询，LINQ\
  \ 包含了 `Count()` 扩展方法。\n\n列表 15.15 演示了 `Count()` 有重载，可以简单的计算所有元素（无参数），也可以接收一个谓词来仅计算由谓词表达式识别的项。\n\
  \n\n\n\n\n```csharp\nusing System;\nusing System.Collections.Generic;\nusing System.Linq;\n\
  \nclass Program\n{\n  static void Main()\n  {\n      IEnumerable<Patent> patents\
  \ = PatentData.Patents;\n      Console.WriteLine($\"Patent Count: { patents.Count()\
  \ }\");\n      Console.WriteLine($@\"Patent Count in 1800s: {\n          patents.Count(patent\
  \ =>\n              patent.YearOfPublication.StartsWith(\"18\"))\n      }\");\n\
  \  }\n  // ...\n}\n```\n\n`3.0`\n\n尽管 `Count()` 语句看起来非常简单，但 `IEnumerable<T>` 并没有改变，因此执行的代码仍然会遍历集合中的所有项。每当集合上直接可用\
  \ `Count` 属性时，最好使用该属性而不是 LINQ 的 `Count()` 方法（这是一个细微的区别）。幸运的是，`ICollection<T>` 包含了\
  \ `Count` 属性，因此在支持 `ICollection<T>` 的集合上调用 `Count()` 方法的代码将对集合进行类型转换并直接调用 `Count`。然而，如果不支持\
  \ `ICollection<T>`，则 `Enumerable.Count()` 将继续枚举集合中的所有项，而不是调用内置的 `Count` 机制。如果检查数量只是为了查看它是否大于零（`if(patents.Count()\
  \ > 0){...}`），优选的方法是使用 `Any()` 运算符（`if(patents.Any()){...}`）。`Any()` 尝试只遍历集合中的一个项以返回真值结果，而不是遍历整个序列。\n\
  \n### 延迟执行\n\n使用 LINQ 时需要记住的最重要概念之一是延迟执行。考虑列表 15.16 中的代码以及输出 15.4 中对应的输出。\n\n`3.0`\n\
  \n**列表 15.16: 使用 `System.Linq.Enumerable.Where()` 进行过滤**\n\n点击此处查看代码图像\n\n```csharp\n\
  using System;\nusing System.Collections.Generic;\nusing System.Linq;\n// ...\n \
  \     IEnumerable<Patent> patents = PatentData.Patents;\n      bool result;\n  \
  \    patents = patents.Where(\n          patent =>\n          {\n              if\
  \ (result =\n                  patent.YearOfPublication.StartsWith(\"18\"))\n  \
  \            {\n                  // 谓词中的此类副作用\n                  // 在这里用于演示一个原理\n\
  \                  // 通常应该被避免\n                  Console.WriteLine(\"\\t\" + patent);\n\
  \              }\n              return result;\n          });\n      Console.WriteLine(\"\
  1\\. 1900 年之前的专利有：\");\n      foreach (Patent patent in patents)\n      {\n    \
  \  }\n      Console.WriteLine();\n      Console.WriteLine(\n          \"2\\. 1900\
  \ 年之前的专利的第二次列表：\");\n      Console.WriteLine(\n          $@\"   There are { patents.Count()\n\
  \              } patents prior to 1900.\");\n      Console.WriteLine();\n      Console.WriteLine(\n\
  \          \"3\\. 1900 年之前的专利的第三次列表：\");\n      patents = patents.ToArray();\n \
  \     Console.Write(\"   There are \");\n      Console.WriteLine(\n          $\"\
  { patents.Count() } patents prior to 1900.\");\n// ...\n```\n\n**输出 15.4**\n\n点击此处查看代码图像\n\
  \n```text\n1\\. 1900 年之前的专利有：\n        Phonograph (1877)\n        Kinetoscope (1888)\n\
  \        Electrical Telegraph (1837)\n        Steam Locomotive (1815)\n2\\. 1900\
  \ 年之前的专利的第二次列表：\n        Phonograph (1877)\n        Kinetoscope (1888)\n       \
  \ Electrical Telegraph (1837)\n        Steam Locomotive (1815)\n   There are 4 patents\
  \ prior to 1900.\n3\\. 1900 年之前的专利的第三次列表：\n        Phonograph (1877)\n        Kinetoscope\
  \ (1888)\n        Electrical Telegraph (1837)\n        Steam Locomotive (1815)\n\
  \   There are 4 patents prior to 1900.\n```\n\n`3.0`\n\n注意 `Console.WriteLine(\"\
  1\\. Patents prior...)` 在 lambda 表达式之前执行。识别这一特性非常重要，因为对于那些不知道其重要性的人来说，这并不显而易见。通常情况下，谓词应该只做一件事——评估条件——并且不应该有任何副作用（即使像本例那样打印到控制台）。\n\
  \n为了理解发生了什么，请记住 lambda 表达式是委托——方法的引用——是可以传递的。在 LINQ 和标准查询操作符的范围内，每个 lambda 表达式都构成了要执行查询的一部分。\n\
  \n在声明时，lambda 表达式并不执行。事实上，只有当调用 lambda 表达式时，其内部的代码才会开始执行。图 15.2 显示了操作序列。\n\n正如图\
  \ 15.2 显示的操作序列所示，标准查询操作符的延迟执行可能导致标准查询操作符极其微妙的触发；因此，开发者应该谨慎并寻求避免意外调用。查询对象代表查询本身，而不是结果。\n\
  \n\n\n\n为了避免此类重复执行，你必须缓存由执行的查询所检索的数据。要做到这一点，可以使用“To”集合方法之一将数据分配给一个本地集合。在调用“To”方法的赋值调用期间，查询显然会执行。然而，在此之后对分配的集合进行迭代将将不再涉及该查询表达式。通常情况下，如果你希望获得内存集合快照的行为，最佳实践是将查询表达式分配给缓存的集合，以避免不必要的迭代。\n\
  \n### 使用 `OrderBy()` 和 `ThenBy()` 进行排序\n\n对集合的另一个常见操作是对其进行排序。排序涉及对 `System.Linq.Enumerable`\
  \ 中 `OrderBy()` 的调用，如列表 15.17 和输出 15.5 所示。\n\n`3.0`\n\n**列表 15.17：使用 `System.Linq.Enumerable.OrderBy()/ThenBy()`\
  \ 排序**\n\n点击此处查看代码图像\n\n```\nusing System;\n\nusing System.Collections.Generic;\n\
  \nusing System.Linq;\n\n// ...\n\n      IEnumerable<Patent> items;\n\n      Patent[]\
  \ patents = PatentData.Patents;\n\n      items = patents.OrderBy(\n\n          patent\
  \ => patent.YearOfPublication).ThenBy(\n\n          patent => patent.Title);\n\n\
  \      Print(items);\n\n      Console.WriteLine();\n\n      items = patents.OrderByDescending(\n\
  \          patent => patent.YearOfPublication).ThenByDescending(\n\n          patent\
  \ => patent.Title);\n\n      Print(items);\n\n// ...\n```\n\n**输出 15.5**\n\n点击此处查看代码图像\n\
  \n```\nBifocals (1784)\n\nSteam Locomotive (1815)\n\nElectrical Telegraph (1837)\n\
  \nPhonograph (1877)\n\nKinetoscope (1888)\n\nFlying Machine (1903)\n\nBackless Brassiere\
  \ (1914)\n\nDroplet Deposition Apparatus (1989)\n\nDroplet Deposition Apparatus\
  \ (1989)\n\nBackless Brassiere (1914)\n\nFlying Machine (1903)\n\nKinetoscope (1888)\n\
  \nPhonograph (1877)\n\nElectrical Telegraph (1837)\n\nSteam Locomotive (1815)\n\n\
  Bifocals (1784)\n```\n\n`OrderBy()` 调用接受一个 lambda 表达式，该表达式标识用于排序的键。在列表 15.17 中，初始排序使用专利出版的年份。\n\
  \n注意，`OrderBy()` 调用仅接受一个用于排序的参数 `keySelector`。若要按第二列进行排序，则需要使用不同的方法：`ThenBy()`。同样，代码将使用\
  \ `ThenBy()` 进行任何额外的排序。\n\n`OrderBy()` 返回一个 `IOrderedEnumerable<T>` 接口，而不是 `IEnumerable<T>`。此外，`IOrderedEnumerable<T>`\
  \ 派生自 `IEnumerable<T>`，因此所有标准查询操作符（包括 `OrderBy()`）在 `OrderBy()` 的返回值上可用。然而，重复调用\
  \ `OrderBy()` 会撤消之前调用的工作，导致最终结果仅按最后一个 `OrderBy()` 调用中的 `keySelector` 排序。出于此原因，你应该小心不要在之前的\
  \ `OrderBy()` 调用上再次调用 `OrderBy()`。\n\n`3.0`\n\n相反，你应该使用 `ThenBy()` 指定额外的排序标准。虽然\
  \ `ThenBy()` 是一个扩展方法，但它不是 `IEnumerable<T>` 的扩展，而是 `IOrderedEnumerable<T>` 的扩展。该方法也定义在\
  \ `System.Linq.Extensions.Enumerable` 中，声明如下：\n\n点击此处查看代码图像\n\n```\npublic static\
  \ IOrderedEnumerable<TSource>\n\n  ThenBy<TSource, TKey>(\n    this IOrderedEnumerable<TSource>\
  \ source,\n    Func<TSource, TKey> keySelector)\n```\n\n总结来说，先使用 `OrderBy()`，然后跟上零次或多次\
  \ `ThenBy()` 调用，以提供额外的排序“列”。方法 `OrderByDescending()` 和 `ThenByDescending()` 提供相同的功能，只是它们按降序排列项目。混合使用升序和降序方法没有问题，但如果需要对项目进行进一步排序，将使用\
  \ `ThenBy()` 调用（无论是升序还是降序）。\n\n关于排序还有两个重要的注意点。首先，实际的排序直到你开始访问集合中的成员时才会发生，此时整个查询才会被处理。除非你拥有所有待排序的项目，否则你无法排序，因为你无法确定是否拥有第一个项目。排序被推迟到开始访问成员的原因是延迟执行，正如本章前面描述的那样。其次，每个后续的排序数据调用（例如，接接\
  \ `OrderBy()` 然后是 `ThenBy()` 然后是 `ThenByDescending()`）确实涉及对早期排序调用 `keySelector`\
  \ lambda 表达式的额外调用。换句话说，调用 `OrderBy()` 会在你遍历集合时调用其相应的 `keySelector` lambda 表达式。此外，后续的\
  \ `ThenBy()` 将再次调用 `OrderBy()` 的 `keySelector`。\n\n`3.0`\n\n**输出 15.6**\n\n点击此处查看代码图像\n\
  \n```\nBifocals (1784)\n\nSteam Locomotive (1815)\n\nElectrical Telegraph (1837)\n\
  \nPhonograph (1877)\n\nKinetoscope (1888)\n\nFlying Machine (1903)\n\nBackless Brassiere\
  \ (1914)\n\nDroplet Deposition Apparatus (1989)\n\nDroplet Deposition Apparatus\
  \ (1989)\n\nBackless Brassiere (1914)\n\nFlying Machine (1903)\n\nKinetoscope (1888)\n\
  \nPhonograph (1877)\n\nElectrical Telegraph (1837)\n\nSteam Locomotive (1815)\n\n\
  Bifocals (1784)\n```\n\n我们将在下节中使用这些数据。\n\n`7.0`\n\n### 使用 `Join()` 执行内连接\n\n在客户端的对象世界中，对象之间的关系已经建立。例如，文件与它们所在的目录之间的关系通过\
  \ `DirectoryInfo.GetFiles()` 和 `FileInfo` 方法预先建立。然而，从非加载的数据并非如此。相反，需要将数据连接起来，以便从一种类型导航到到类型。\n\
  \n考虑员工和部门的示例。在列表 15.19 中，我们将每个员工与其部门连接，然后列出每个员工及其对应的部门。由于每个员工仅属于一个（且恰好）部门，列表中的项目总数等于员工总数——每个员工只出现一次（员工被认为是规范化的）。输出\
  \ 15.7 显示了结果。\n\n`3.0`\n\n**列表 15.19：使用 `System.Linq.Enumerable.Join()` 的内连接**\n\
  \n点击此处查看代码图像\n\n```\nusing System;\n\nusing System.Linq;\n\n// ...\n\n      Department[]\
  \ departments = CorporateData.Departments;\n\n      Employee[] employees = CorporateData.Employees;\n\
  \n      IEnumerable<(int Id, string Name, string Title,\n\n              Department\
  \ Department)> items =\n\n          employees.Join(\n              departments,\n\
  \              employee => employee.DepartmentId,\n              department => department.Id,\n\
  \              (employee, department) => (\n                  employee.Id,\n   \
  \               employee.Name,\n                  employee.Title,\n            \
  \      department\n              ));\n\n      foreach (var item in items)\n\n  \
  \    {\n\n          Console.WriteLinae\n\n              $\"{ item.Name } ({ item.Title\
  \ })\");\n\n          Console.WriteLine(\"\\t\" + item.Department);\n\n      }\n\
  \n// ...\n```\n\n`7.0`\n\n**输出 15.7**\n\n点击此处查看代码图像\n\n```\nMark Michaelis (Chief\
  \ Computer Nerd)\n\n        Corporate\n\nMichael Stokesbary (Senior Computer Wizard)\n\
  \n        Engineering\n\nBrian Jones (Enterprise Integration Guru)\n\n        Engineering\n\
  \nAnne Beard (HR Director)\n\n        Human Resources\n\nPat Dever (Enterprise Architect)\n\
  \n        Information Technology\n\nKevin Bost (Programmer Extraordinaire)\n\n \
  \       Engineering\n\nThomas Heavey (Software Architect)\n\n        Engineering\n\
  \nEric Edmonds (Philanthropy Coordinator)\n\n        Philanthropy\n```\n\n\n\n`Join()`\
  \ 的第一个参数名为 `inner`。它指定了 `employees` 要连接的集合 `departments`。接下来两个参数是 lambda 表达式，指定了两个集合如何连接。`employee\
  \ => employee.DepartmentId`（参数名为 `outerKeySelector`）标识了在每个 `employee` 上，键将是 `DepartmentId`。下一个\
  \ lambda 表达式（`department => department.Id`）指定 `Department` 的 `Id` 属性作为键——换句话说，对于每个员工，连接\
  \ `employee.DepartmentId` 等于 `department.Id` 的部门。最后一个参数是所选的生成项。在这种情况下，它是一个包含 `Employee`\
  \ 的 `Id`、`Name` 和 `Title` 以及一个带有已连接 `department` 对象的 `Department` 属性的元组。\n\n注意输出中\
  \ `Engineering` 多次——`CorporateData` 中的每个员工出现一次。在这种情况下，`Join()` 调用在所有部门和所有员工之间产生了`笛卡尔积`，使得当两个集合中都存在记录且指定的部门\
  \ ID 相同同时，就会创建一个新记录。这种类型的连接是内连接（inner join）。\n\n`7.0`\n\n数据也可以反向连接，使得 `department`\
  \ 连接到每个 `employee`，以列出每个部门到员工的匹配项。注意输出包含的记录比部门数量多：每个部门有多个员工，输出为每个匹配项生成一条记录。正如我们之前看到的，Engineering\
  \ 部门出现了多次，每个员工出现一次。\n\nListing 15.20 中的代码（产生 Output 15.8）与 Listing 15.19 中的代码相似，只是对象\
  \ `Department` 和 `Employee` 的顺序反过了。`Join()` 的第一个参数是 `employees`，指示 `departments`\
  \ 连接的对象。接下来的两个参数是 lambda 表达式，指定了两个集合如何连接：用于 `departments` 的 `department => department.Id`\
  \ 和用于 `employees` 的 `employee => employee.DepartmentId`。与之前一样，每当 `department.Id`\
  \ 等于 `employee.EmployeeId` 时就会发生连接。最后的元组参数指定了一个带有 `int Id`、`string Name` 和 `Employee\
  \ Employee` 项的类。（在表达式中指定名称是可选的，但为了清晰在此使用了。）\n\n`3.0`\n\n**Listing 15.20: 使用 `System.Linq.Enumerable.Join()`\
  \ 的另一个内连接**\n\n点击此处查看代码图片\n\n```\nusing System;\n\nusing System.Linq;\n\n// ...\n\
  \n      Department[] departments = CorporateData.Departments;\n\n      Employee[]\
  \ employees = CorporateData.Employees;\n\n      IEnumerable<(long Id, string Name,\
  \ Employee Employee)> items =\n\n          departments.Join(\n              employees,\n\
  \              department => department.Id,\n              employee => employee.DepartmentId,\n\
  \              (department, employee) => (\n                  department.Id,\n \
  \                 department.Name,\n                  Employee: employee)\n    \
  \      );\n\n      foreach (var item in items)\n      {\n          Console.WriteLine(item.Name);\n\
  \          Console.WriteLine(\"\\t\" + item.Employee);\n\n      }\n// ...\n```\n\
  \n`7.0`\n\n**Output 15.8**\n\n点击此处查看代码图片\n\n```\nCorporate\n        Mark Michaelis\
  \ (Chief Computer Nerd)\n\nHuman Resources\n        Anne Beard (HR Director)\n\n\
  Engineering\n        Michael Stokesbary (Senior Computer Wizard)\n\nEngineering\n\
  \        Brian Jones (Enterprise Integration Guru)\n\nEngineering\n        Kevin\
  \ Bost (Programmer Extraordinaire)\n\nEngineering\n        Thomas Heavey (Software\
  \ Architect)\n\nInformation Technology\n        Pat Dever (Enterprise Architect)\n\
  \nPhilanthropy\n        Eric Edmonds (Philanthropy Coordinator)\n```\n\n除了对对象集合进行排序和连接外，你可能希望对具有相似特征的对象进行分组。对于员工数据，你可能想按部门、地区、职位等对员工进行分组。Listing\
  \ 15.21 展示了如何使用`GroupBy()` 标准查询操作符执行此操作（参见 Output 15.9 结果）。\n\n`3.0`\n\n**Listing\
  \ 15.21: 使用 `System.Linq.Enumerable.GroupBy()` 分组项**\n\n点击此处查看代码图片\n\n```\nusing\
  \ System;\n\nusing System.Linq;\n\n// ...\n\n      IEnumerable<Employee> employees\
  \ = CorporateData.Employees;\n\n      IEnumerable<IGrouping<int, Employee>> groupedEmployees\
  \ =\n        employees.GroupBy((employee) => employee.DepartmentId);\n\n      foreach(IGrouping<int,\
  \ Employee> employeeGroup in\n          groupedEmployees)\n      {\n          Console.WriteLine();\n\
  \          foreach(Employee employee in employeeGroup)\n          {\n          \
  \    Console.WriteLine(\"\\t\" + employee);\n          }\n          Console.WriteLine(\n\
  \            \"\\tCount: \" + employeeGroup.Count());\n      }\n// ...\n```\n\n\
  `7.0`\n\n**Output 15.9**\n\n点击此处查看代码图片\n\n```\nMark Michaelis (Chief Computer Nerd)\n\
  \    Count: 1\n\nMichael Stokesbary (Senior Computer Wizard)\n\nBrian Jones (Enterprise\
  \ Integration Guru)\n\nKevin Bost (Programmer Extraordinaire)\n\nThomas Heavey (Software\
  \ Architect)\n    Count: 4\n\nAnne Beard (HR Director)\n    Count: 1\n\nPat Dever\
  \ (Enterprise Architect)\n    Count: 1\n\nEric Edmonds (Philanthropy Coordinator)\n\
  \    Count: 1\n```\n\n注意，`GroupBy()` 调用输出的项类型为 `IGrouping<TKey, TElement>`，它具有一个查询分组的键属性（`employee.DepartmentId`）。然而，它没有表示组内项的属性。相反，`IGrouping<TKey,\
  \ TElement>` 派生自 `IEnumerable<T>`，允许使用 `foreach` 语句对组内的项进行枚举，或将数据聚合为诸如项计数（`employeeGroup.Count()`）。\n\
  \n#### 使用 `GroupJoin()` 实现一对多关系\n\nListings 15.19 和 15.20 几乎相同。通过更改元组定义，任何 `Join()`\
  \ 调用都可以产生相同的输出。在尝试创建员工列表时，Listing 15.19 提供了正确的结果。`Department` 最终成为两个代表连接员工的元组的项。然而，Listing\
  \ 15.20 并不理想。考虑到对集合的支持，部门更优的表示方式应该是员工集合，而不是为每个部门-员工关系使用单个元组。Listing 15.22 展示了此类子集合的创建；Output\
  \ 15.10 显示了首选输出。\n\n`7.0`\n\n**Listing 15.22: 使用 `System.Linq.Enumerable.GroupJoin()`\
  \ 创建子集合**\n\n点击此处查看代码图片\n\n```\nusing System;\n\nusing System.Linq;\n\n// ...\n\n\
  \      Department[] departments = CorporateData.Departments;\n\n      Employee[]\
  \ employees = CorporateData.Employees;\n\n      IEnumerable<(long Id, string Name,\
  \ IEnumerable<Employee> Employees)> items =\n          departments.GroupJoin(\n\
  \              employees,\n              department => department.Id,\n        \
  \      employee => employee.DepartmentId,\n              (department, departmentEmployees)\
  \ => (\n                  department.Id,\n                  department.Name,\n \
  \                 departmentEmployees)\n          ));\n\n      foreach (\n     \
  \     (_, string name, IEnumerable<Employee> employeeCollection) in items)\n   \
  \   {\n          Console.WriteLine(name);\n          foreach (Employee employee\
  \ in employeeCollection)\n          {\n              Console.WriteLine(\"\\t\" +\
  \ employee);\n          }\n\n      }\n\n// ...\n```\n\n`3.0`\n\n**Output 15.10**\n\
  \n点击此处查看代码图片\n\n\n\n\n```\nCorporate\n\n        Mark Michaelis (首席电脑极客)\n\n    \
  \    Human Resources\n\n        Anne Beard (人力资源总监)\n\n        Engineering\n\n \
  \       Michael Stokesbary (高级计算机奇才)\n        Brian Jones (企业集成大师)\n        Kevin\
  \ Bost (卓越程序员)\n        Thomas Heavey (软件架构师)\n\n        Information Technology\n\
  \n        Pat Dever (企业架构师)\n\n        Philanthropy\n\n        Eric Edmonds (慈善协调员)\n\
  ```\n\n为了获得预期的结果，我们使用 `System.Linq.Enumerable` 的 `GroupJoin()` 方法。其参数与列表 15.19 中的相同，但最后选择的元组不同。在列表\
  \ 15.19 中，lambda 表达式的类型为 `Func<Department, IEnumerable<Employee>, (long Id, string\
  \ Name, IEnumerable<Employee> Employees)>`。注意，我们使用第二个类型参数（`IEnumerable<Employee>`）将每个部门的员工集合投影到结果部门元组中；因此，结果集合中的每个部门都包含一个员工列表。\n\
  \n`7.0`\n\n(熟悉 SQL 的读者会注意到，与 `Join()` 不同，`GroupJoin()` 没有对应的 SQL 实现，因为 SQL 返回的数据是基于记录的，而不是层次结构的。)\n\
  \n`3.0`\n\n### 调用 `SelectMany()`\n\n有时，你可能会拥有集合的集合。列表 15.24 提供了此类场景的示例。`teams` 数组包含两个球队，每个球队都包含一个球员字符串数组。\n\
