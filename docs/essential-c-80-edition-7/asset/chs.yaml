  \n### 排除和包含代码 (`#if`, `#elif`, `#else`, `#endif`)\n\n或许预处理器指令最常见的用途是控制代码何时以及如何被包含。例如，为了编写既能被\
  \ C# 2.0 及更高版本的编译器编译，又能被之前的 1.0 版本编译器编译的代码，你将使用预处理器指令在用版本 1.0 编译器编译时排除 C# 2.0 特有的代码。你可以在井井游戏示例以及代码列表\
  \ 4.55 中看到这一点。\n\n**代码列表 4.55：从 C# 1.x 编译器中排除 C# 2.0 代码**\n\n点击此处查看代码图像\n\n```csharp\n\
