  \ `CS` 字母作为前缀，该前缀在 `#pragma` 指令中是可选的。此类数字对应于在没有预处理器命令时编译器发出的警告错误编号。\n\n要重新启用警告，`#pragma`\
  \ 支持在警告后使用 `restore` 选项，如 列表 4.60 所示。\n\n**列表 4.60：使用预处理器 `#pragma` 指令恢复警告**\n\n\
