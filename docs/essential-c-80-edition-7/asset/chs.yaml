  \  downloadData, findText);\n```\n\n这个示例展示了 `await` 特性的魔力：它从任务中解包并直接返回结果。如果你希望在异步操作执行执行代码，可以推迟\
  \ `await` 调用，直到并行工作（写入控制台）完成。调用 `CountOccurrencesAsync()` 之前的代码同样调用 `webClient.DownloadDataTaskAsync(url)`。与其分配\
  \ `byte[]` 并利用 `await` 运算符，`await` 调用在并行写入控制台期间也被推迟了。\n\n点击此处查看代码图像\n\n```csharp\n\
  using WebClient webClient = new WebClient();\n\nTask<byte[]> taskDownload =\n  webClient.DownloadDataTaskAsync(url);\n\
