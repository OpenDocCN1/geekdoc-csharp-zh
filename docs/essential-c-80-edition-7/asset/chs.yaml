  \ => (int[])o)));\n      Write(\"Odd integers \");\n      Print(stuff.SelectMany(o\
  \ => (int[])o).Where(i => i % 2 != 0));\n  }\n  private static void Print<T>(IEnumerable<T>\
  \ items)\n  {\n      Console.WriteLine(string.Join(\", \", items));\n  }\n}\n```\n\
  ```\n\n**输出 15.12**\n\n```\nStuff: {[1, 3, 5, 7], [2, 4, 6, 8]}\nEven integers:\
  \ 2, 4, 6, 8\nAll integers: 1, 2, 3, 4, 5, 6, 7, 8\nOdd integers: 1, 3, 5, 7\n```\n\
  \n`3.0`\n\n列表 15.25 中的 API 调用中， `Enumerable` 启用的一些简单 API 不需要 lambda 表达式。表 15.1 和\
  \ 15.2 描述了每个方法并提供了示例。`Enumerable` 中还包含一组聚合函数，这些函数会枚举集合并计算结果（见表 15.2）。`Count` 是文中已经出现的一个聚合函数示例。\n\
  \n注意，表 15.1 和 15.2 中列出的方法都会触发延迟执行。\n\n| 注释类型 | 描述 |\n| --- | --- |\n| `OfType<T>()`\
  \ | 对集合进行查询，仅返回特定类型的项，该类型在 `OfType<T>()` 方法调用的类型参数中指定。 |\n| `Union()` | 合并两个集合以形成两个集合中所有项的并集。即使相同项存在于两个集合中，最终集合也不会包含重复项。\
  \ |\n\n\n\n\n\n| `Concat()` | 合并两个集合以形成这两个集合的并集。结果集合中不会移除重复项。`Concat()` 将保留顺序。也就是说，将\
  \ `{A, B}` 与 `{C, D}` 合并将产生 `{A, B, C, D}`。 |\n| `Intersect()` | 提取在两个原始集合中都存在的项集合。\
  \ |\n| `Distinct()` | 从集合中过滤掉重复项，使得结果集合中的每个项都是唯一的。 |\n| `SequenceEquals()` | 比较两个集合并返回一个布尔值，表示这些集合是否相同，包括集合中项的顺序。（这在测试预期结果时是一个非常有用的消息。））\
  \ |\n| `Reverse()` | 反转集合中的项，以便它们在遍历集合时以反向顺序出现。 |\n\n### 表 15.1：更简单的标准查询运算符\n\n\
  | 注释类型 | 描述 |\n| :--- | :--- |\n| `Count()` | 提供集合中项目总数的计数 |\n| `Average()` | 计算数值集合的平均值\
  \ |\n| `Sum()` | 计算数值集合中的和值 |\n| `Max()` | 确定数值集合中的最大值 |\n| `Min()` | 确定数值集合中的最小值\
  \ |\n\n### 表 15.2：`System.Linq.Enumerable` 上的聚合函数\n\n`3.0`\n\n### 带有 LINQ 的匿名类型\n\
  \nC# 3.0 显著改进了对使用 LINQ 处理项集合的支持。令人惊讶的是，为了支持这种高级 API，仅引入了八项新的语言增强——但这些增强是 C# 3.0\
  \ 能够成为该语言如此奇妙改进的关键。这些增强中的两个是匿名类型和隐式局部变量。尽管如此，自 C# 7.0 以来，匿名类型基本上已被 C# 元组句语法的引入所掩盖了。事实上，随着本书的第六版的发布，之前所有利用匿名类型的\
  \ LINQ 示例都已更新为使用元组。\n\n但如果你无法使用 C# 7.0（或更高版本），或者你正正在处理在 C# 7.0 之前编写的代码怎么办？本章的剩余部分将涵盖匿名类型主题，以便你仍然能够理解匿名类型语言特性。（但是，如果你认为自己不会在\
  \ C# 6.0 或更早的世界中编程，你可能考虑完全跳过此节。）\n\n#### 匿名类型\n\n匿名类型是由编译器声明的数据类型，而不是通过第 6 章中引入的显式类定义。与匿名函数一样，当编译器看到匿名类型时，它会为你创建该类，然后让你使用它，就像你显式声明了它一样。列表\
  \ 15.26 显示了这样的声明。\n\n`3.0`\n\n#### 列表 15.26：带有匿名类型的隐式局部变量\n\n点击此处查看代码图像\n\n```csharp\n\
  using System;\n\nclass Program\n{\n  static void Main()\n  {\n      var patent1\
  \ =                                                      \n          new       \
  \                                                     \n          {            \
  \                                                  \n              Title = \"Bifocals\"\
  ,                                        \n              YearOfPublication = \"\
  1784\"                                 \n          };                          \
  \                                   \n      var patent2 =                      \
  \                                \n          new                               \
  \                             \n          {                                    \
  \                          \n              Title = \"Phonograph\",             \
  \                         \n              YearOfPublication = \"1877\"         \
  \                        \n          };                                        \
  \                     \n      var patent3 =                                    \
  \                  \n          new                                             \
  \               \n          {                                                  \
  \            \n              patent1.Title,                                    \
  \         \n              // 重命名以显示属性命名。                        \n             \
  \ Year = patent1.YearOfPublication                           \n          };    \
  \                                                         \n      Console.WriteLine(\n\
  \          $\"{ patent1.Title } ({ patent1.YearOfPublication })\");\n      Console.WriteLine(\n\
  \          $\"{ patent2.Title } ({ patent2.YearOfPublication })\");\n      Console.WriteLine();\n\
  \      Console.WriteLine(patent1);\n      Console.WriteLine(patent2);\n      Console.WriteLine();\n\
  \      Console.WriteLine(patent3);\n  }\n}\n```\n\n`3.0`\n\n相应的输出显示在输出 15.13 中。\n\
  \n#### 输出 15.13\n\n点击此处查看代码图像\n\n```text\nBifocals (1784)\nPhonograph (1784)\n{\
  \ Title = Bifocals, YearOfPublication = 1784 }\n{ Title = Phonograph, YearOfPublication\
  \ = 1877 }\n{ Title = Bifocals, Year = 1784 }\n```\n\n匿名类型纯粹是 C# 的特性，而不是运行时中的新类型类型。当编译器遇到匿名类型语法时，它会生成一个\
  \ CIL 类，其属性与匿名类型声明中的命名值和数据类型相对应。\n\n#### 使用 LINQ 选择到匿名类型\n\n最后，利用匿名类型，我们可以创建一个 `IEnumerable<T>`\
  \ 集合，其中 `T` 是匿名类型（参见列表 15.27）。\n\n#### 列表 15.27：投影到匿名类型\n\n点击此处查看代码图像\n\n```csharp\n\
  // ...\n\nIEnumerable<string> fileList = Directory.EnumerateFiles(\n    rootDirectory,\
  \ searchPattern);\n\nvar items = fileList.Select(                         \n   \
  \ file =>                                          \n    {                     \
  \                           \n        FileInfo fileInfo = new FileInfo(file);  \
  \                                   \n        return new                       \
  \                                           \n        {                        \
  \                                                   \n            FileName = fileInfo.Name,\
  \                                               \n            Size = fileInfo.Length\
  \                                                  \n        };                \
  \                                                          \n    });\n\n// ...\n\
  ```\n\n`3.0`\n\n#### 输出 15.14\n\n点击此处查看代码图像\n\n```text\n{ FileName = AssemblyInfo.cs,\
  \ Size = 1704 }\n{ FileName = CodeAnalysisRules.xml, Size = 735 }\n{ FileName =\
  \ CustomDictionary.xml, Size = 199 }\n{ FileName = EssentialCSharp.sln, Size = 40415\
  \ }\n{ FileName = EssentialCSharp.suo, Size = 454656 }\n{ FileName = EssentialCSharp.vsmdi,\
  \ Size = 499 }\n{ FileName = EssentialCSharp.vssscc, Size = 256 }\n{ FileName =\
  \ intelliTechture.ConsoleTester.dll, Size = 24576 }\n{ FileName = intelliTechture.ConsoleTester.pdb,\
  \ Size = 30208 }\n```\n\n匿名类型的输出会自动显示属性名称及其值，这是作为与匿名类型关联的生成的 `ToString()` 方法的一部分。\n\
  \n\n\n\n使用 `Select()` 方法进行投影是非常强大的。我们已经看到了如何使用 `Where()` 标准查询操作符对集合进行垂直过滤（减少集合中的项目数量）。现在，通过使用\
  \ `Select()` 标准查询操作符，我们还可以从水平上收缩集合（减少列的数）或完全转换数据。通过增加对匿名类型的支持，我们可以 `Select()` 出一个任意的“对象”，只需提取原始集合中当前算法所需的部分，而无需声明一个类来包含这些部分。\n\
  \n### 更多关于匿名类型和隐式局部变量\n\n在列表 15.26 中，匿名类型的成员名通过将值赋值给 `patent1` 和 `patent2` 的名称来显式识别（explicitly\
  \ identified）（例如，`Title = \"Phonograph\"`）。但是，如果赋值的值是属性或字段调用，则名称可能默认为字段或属性的名称，而不是显式指定值。例如，`patent3`\
  \ 是使用名为 `Title` 的属性定义的，而不是赋值给显式名称。如输出 15.13 所示，结果属性名由编译器确定，以与获取值时的属性相匹配。\n\n`patent1`\
  \ 和 `patent2` 具有相同的属性名和相同的数据类型。因此，C# 编译器为这两个匿名声明仅生成一种数据类型。相比之下，`patent3` 强制编译器创建第二个匿名类型，因为专利年份的属性名与\
  \ `patent1` 和 `patent2` 中的不同。此外，如果 `patent1` 和 `patent2` 之间的属性顺序发生交换，这两个匿名类型将是不类型兼容的。换句话说，在同一个程序集内，两个匿名类型类型兼容的要求是：属性名、数据类型和属性顺序必须匹配。如果满足了这些标准，即使它们出现在不同的方法或类中，这些类型也是兼容的。列表\
  \ 15.28 演示了类型不兼容的情况。\n\n`3.0`\n\n**列表 15.28：匿名类型的类型安全与不可变性**\n\n点击点击此处查看代码图像\n\n\
  ```\nclass Program\n\n{\n\n  static void Main()\n\n  {\n\n      var patent1 =\n\n\
  \          new\n\n          {\n\n              Title = \"Bifocals\",           \
  \     \n\n              YearOfPublication = \"1784\"         \n\n              YearOfPublication\
  \ = \"1877\",        \n\n              Title = \"Phonograph\"               \n \
  \             Year = patent1.YearOfPublication   \n\n      var worldCup2006Finalists\
  \ = new[]          \n      {                                          \n       \
  \   };\n\n      var patent2 =\n          new\n\n          {\n          };\n\n  \
  \    var patent3 =\n          new\n\n          {\n              patent1.Title,\n\
  \          };\n\n      // ERROR: 隐式转换类型\n      //        'AnonymousType#1' 到 'AnonymousType#2'\n\
  \      patent1 = patent2;\n\n      // ERROR: 隐式转换类型\n      //        'AnonymousType#3'\
  \ 到 'AnonymousType#2'\n      patent1 = patent3;\n\n      // ERROR: 属性或索引器 'AnonymousType#1.Title'\n\
  \      //        不能赋值 -- 它是只的\n      patent1.Title = \"Swiss Cheese\";\n\n  }\n\n\
  }\n```\n\n`3.0`\n\n前两个编译时错误断言类型是不兼容的，因此它们无法成功地从一个转换为另一个。第三个编译时错误是由 `Title` 属性的重新赋值引起的。匿名类型是不可变的（immutable），因此一旦实例化了匿名类型，更改其属性将导致编译时错误。\n\
  \n虽然在列表 15.28 中没有显示，但无法声明带有隐式数据类型参数（`var`）的方法。因此，匿名类型的实例只有两种方式传递到创建它们的方法之外。第一，如果方法参数类型为\
  \ `object`，则匿名类型实例可以传递到方法外部，因为匿名类型将进行隐式转换。第二种方法是使用类型推断，将匿名类型实例作为方法类型参数传递，编译器可以成功推断它。因此，使用\
  \ `Function(patent1)` 调用 `void Method<T>(T parameter)` 将成功，尽管在 `Function()` 内部对\
  \ `parameter` 的可用操作仅限于 `object` 支持的操作。\n\n尽管 C# 允许像列表 15.26 所示的匿名类型，但通常不建议以这种方式定义它们。匿名类型为\
  \ C# 3.0 的投影提供了关键功能，例如集合的连接/关联，正如我们在本章后半部分将讨论的那样。尽管如此，你通常应该将匿名类型的定义保留给需要它们的情况，例如从多个类型中聚合数据。\n\
  \n`开始 7.0`\n\n在匿名类型引入时，它们是一项突破，解决了一个重要问题：即时声明临时类型，而无需经过声明完整类型的繁琐步骤。尽管如此，它们仍然具有前面阐述的几个缺点。幸运的是，C#\
  \ 7.0 元组（tuples）避免了这些缺点，事实上，它们基本上消灭了使用匿名类型的类型。具体而言，元组相比匿名类型具有以下优势：\n\n*   提供了一个可以在任何可以使用类型的地方使用的命名类型\n\
  *   在实例化它们的方法之外可用\n*   避免了极少使用的类型导致的“污染”\n\n`3.0 结束 7.0`\n\n元组与匿名类型的一种区别是，匿名类型是引用类型，而元组是值类型。这种差异对哪种方法有利取决于所需的性能特征。如果元组类型被频繁复制且内存占用超过\
  \ 128 位，则引用类型可能更优。否则，使用元组可能具有更高的性能。\n\n### 总结\n\n本章描述了 `foreach` 循环工作的内部原理，并解释了执行它所需的接口。此外，开发者经常过滤集合以减少项目数量，并投影集合以使项目采取不同的形式。为此，本章讨论了如何使用标准查询操作符（LINQ\
  \ 在 `System.Linq.Enumerable` 类引入了集合扩展方法）执行集合操作的细节。\n\n列表 15.23 出现在高级主题章节，是因为连续调用多个标准查询操作符具有复杂性。\n\
  \n\n\n\n本章以对匿名类型的详细介绍结束，并解释了为什么如果你使用的是 C# 7.0 或更高版本，元组（tuples）实际上是更优的方法。\n\n`3.0`\n\
  \n# 16. 使用查询表达式 LINQ\n\n第 15 章 的末尾展示了使用标准查询运算符进行 `GroupJoin()`、`SelectMany()` 和\
  \ `Distinct()` 的查询。其结果是一个跨越多行的语句，并且比通常只使用早期 C# 版本特性编写的语句更复杂且难以理解。处理丰富数据集的现代程序通常需要此类复杂的查询；因此，如果语言让这些查询更易读将是非常有利的。像\
  \ SQL 这样的特定领域查询语言使得查询变得更容易阅读和理解，但缺乏 C# 语言的全功能。这就是为什么 C# 语言设计人员在 C# 3.0 中添加了查询表达式（query\
  \ expressions）语法。通过查询表达式，许多标准查询运算符表达式被转换为更具读性的代码，就像 SQL 一样。\n\n![思维导图描述了带查询表达式 LINQ\
  \ 的章节。包括以下内容：(1) 投影，(2) 过滤，(3) 排序，(4) 分组，以及(5) 将查询表达式与标准查询运算符结合](img/16mindmap.jpg)\
  \ `3.0`\n\n在本章中，我们将介绍查询表达式，并使用它们来表达第 15 章 中的许多查询。\n\n## 引入查询表达式\n\n开发者最频繁执行的两个操作是对集合进行过滤（filtering）以消除不需要的项目，以及对集合进行投影（projecting）以便项目采取不同的形式。例如，给定一个文件集合，我们可以过滤它创建一个仅包含\
  \ `.cs` 扩展文件的新集合，或者仅包含大于 100 万字节的文件的新集合。我们还可以投影文件集合，创建一个包含文件所在目录路径及相应目录大小的新集合。查询表达式为这两种常见操作都提供了直接的语法。列表\
  \ 16.1 显示了一个过滤字符串集合的查询表达式；输出 16.1 显示了结果。\n\n**列表 16.1：简单查询表达式**\n\n此处此处代码图像\n\n\
  ```sharp\nstatic public class CSharp\n{\n\n  static public readonly string[] Keywords\
  \ =\n      ReadOnlyCollection<string> Keywords = new ReadOnlyCollection<string>(\n\
  \n  new string[]\n  {\n      \"abstract\", \"add*\", \"alias*\", \"as\", \"ascending*\"\
  ,\n      \"async*\", \"await*\", \"base\",\"bool\", \"break\",\n      \"by*\", \"\
  byte\", \"case\", \"catch\", \"char\", \"checked\",\n      \"class\", \"const\"\
  , \"continue\", \"decimal\", \"default\",\n      \"delegate\", \"descending*\",\
  \ \"do\", \"double\",\n      \"dynamic*\", \"else\", \"enum\", \"event\", \"equals*\"\
  ,\n      \"explicit\", \"extern\", \"false\", \"finally\", \"fixed\",\n      \"\
  from*\", \"float\", \"for\", \"foreach\", \"get*\", \"global*\",\n      \"group*\"\
  , \"goto\", \"if\", \"implicit\", \"in\", \"int\",\n      \"into*\", \"interface\"\
  , \"internal\", \"is\", \"lock\", \"long\",\n      \"join*\", \"let*\", \"nameof*\"\
  , \"namespace\", \"new\", \"nonnull*\",\n      \"null\", \"object\", \"on*\", \"\
  operator\", \"orderby*\", \"out\",\n      \"override\", \"params\", \"partial*\"\
  , \"private\", \"protected\",\n      \"public\", \"readonly\", \"ref\", \"remove*\"\
  , \"return\", \"sbyte\",\n      \"sealed\", \"select*\", \"set*\", \"short\", \"\
  sizeof\",\n      \"stackalloc\", \"static\", \"string\", \"struct\", \"switch\"\
  ,\n      \"this\", \"throw\", \"true\", \"try\", \"typeof\", \"uint\", \"ulong\"\
  ,\n      \"unsafe\", \"ushort\", \"using\", \"value*\", \"var*\", \"virtual\",\n\
  \      \"unchecked\", \"void\", \"volatile\", \"where*\", \"while\", \"yield*\"\n\
  \  });\n\n}\n\nusing System;\nusing System.Collections.Generic;\nusing System.Linq;\n\
  \n// ...\n\n  private static void ShowContextualKeywords1()\n  {\n      IEnumerable<string>\
  \ selection =                                                  \n          from\
  \ word in CSharp.Keywords                                                 \n   \
  \           where !word.Contains('*')                                          \
  \      \n              select word;                                            \
  \                 \n      foreach (string keyword in selection)\n      {\n     \
  \     Console.Write(keyword + \" \");\n      }\n  }\n// ...\n```\n\n`3.0`\n\n**输出\
  \ 16.1**\n\n此处此处代码图像\n\n```text\nabstract as base bool break byte case catch char\
  \ checked class const\ncontinue decimal default delegate do double else enum event\
  \ explicit\nextern false finally fixed float for foreach goto if implicit in int\n\
  interface internal is lock long namespace new null object operator out\noverride\
  \ params private protected public readonly ref return sbyte\nsealed short sizeof\
  \ stackalloc static string struct switch this throw\ntrue try typeof uint ulong\
  \ unchecked unsafe ushort using virtual void\nvolatile while\n```\n\n在这一查询表达式中，`selection`\
  \ 被赋值为 C# 保留关键字的集合。此示例中的查询表达式包含一个 `where` 子句，用于过滤掉非上下文关键字。\n\n查询表达式始终从 `from` 子句开始，并以\
  \ `select` 子句结束。\n\n熟悉 SQL 的开发者会注意到查询表达式的语法与 SQL 相似。这种设计是刻意的——意在让已经知道 SQL 的程序员能够轻松学习。然而，它们之间存在一些明显的区别。大多数\
  \ SQL 丰富的开发者注意到的第一个区别是，这里显示的 C# 查询子顺序如下：`from`，然后是 `where`，最后是 `select`。相应的 SQL\
  \ 查询将 `SELECT` 子句放在第一个，然后是 `FROM` 子句，最后是 `WHERE` 子句。\n\n这种顺序变化的原因之一是为了能够使用 IntelliSense。这是\
  \ IDE 的一项功能，编辑器会产生实用的用户界面元素，例如描述给定对象成员的下拉列表。由于 `from` 最先出现并标识字符串数组 `Keywords` 为数据源，代码编辑器可以推断出范围变量\
  \ `word` 的类型为 `string`。当你向编辑器中输入代码并到达 `word` 后的点时，编辑器将仅显示 `string` 的成员。\n\n如果 `from`\
  \ 子句像在 SQL 中那样出现在 `select` 之后，那么在你输入查询语句时，编辑器将不知道 `word` 的数据类型是什么，因此它无法显示 `word`\
  \ 的成员列表。例如，在列表 16.1 中，无法预测 `Contains()` 是 `word` 的一个可能成员。\n\n查询表达式的顺序也更贴近逻辑执行操作的顺序。在评估查询时，我们首先识别集合（由\
  \ `from` 子句描述），然后过滤掉不需要的项目（使用 `where` 子句），最后描述所需的结果（使用 `select` 子句）。\n\n最后，C# 查询表达式的顺序确保了“where”（范围）变量的作用域规则与局部变量的作用域规则基本保持一致。例如，（范围）变量必须在子句（通常是\
  \ `from` 子句）声明之前才能使用，这就像局部变量必须在使用之前声明的一样。\n\n\n\n\n查询表达式的结果是一个类型为 `IEnumerable<T>`\
  \ 或 `IQueryable<T>` 的集合。实际类型 `T` 根据 `select` 或 `group by` 子句推断得出。例如，在列表 16.1 中，编译器知道\
  \ `Keywords` 的类型为 `string[]`，它可以转换为 `IEnumerable<string>`，因此推断出 `word` 的类型为 `string`。查询以\
  \ `select word` 结束，这意味着查询表达式的结果必须是一个字符串集合，因此查询表达式的类型为 `IEnumerable<string>`。\n\n\
  1. 在实际操作中，查询表达式的结果几乎总是 `IEnumerable<T>` 或者是其派生类型。虽然这种做法在逻辑上可能有些违背直觉，但创建一个创建一个返回其他类型的查询方法实现是合法的；语言并没有要求查询表达式的结果必须转换为\
  \ `IEnumerable<T>`。\n\n`3.0`\n\n在这种情况下，查询的“输入”和“输出”都是字符串集合。然而，如果 `select` 子句中的表达式是完全不同的类型，那么输出类型可能与输入类型大不相同。考虑列表\
  \ 16.2 中的查询表达式及其在输出 16.2 中对应的输出。\n\n**列表 16.2：使用查询表达式进行投影**\n\n点击此处查看代码图像\n\n```\n\
  using System;\n\nusing System.Collections.Generic;\n\nusing System.Linq;\n\nusing\
  \ System.IO;\n\n// ...\n\n  static void List1(string rootDirectory, string searchPattern)\n\
  \n  {\n\n      IEnumerable<string> fileNames = Directory.GetFiles(             \
  \                           \n          rootDirectory, searchPattern);         \
  \                                                \n      IEnumerable<FileInfo> fileInfos\
  \ =                                                          \n          from fileName\
  \ in fileNames                                                             \n  \
  \        select new FileInfo(fileName);                                        \
  \                 \n      foreach (FileInfo fileInfo in fileInfos)\n      {\n  \
  \          Console.WriteLine(\n                $@\".{ fileInfo.Name } ({\n\n   \
  \                 fileInfo.LastWriteTime })\");\n      }\n  }\n\n// ...\n```\n\n\
  **输出 16.2**\n\n点击此处查看代码图像\n\n```\nAccount.cs (11/22/2011 11:56:11 AM)\n\nBill.cs\
  \ (8/10/2011 9:33:55 PM)\n\nContact.cs (8/19/2011 11:40:30 PM)\n\nCustomer.cs (11/17/2011\
  \ 2:02:52 AM)\n\nEmployee.cs (8/17/2011 1:33:22 AM)\n\nPerson.cs (10/22/2011 10:00:03\
  \ PM)\n```\n\n`3.0`\n\n此查询表达式产生的是 `IEnumerable<FileInfo>`，而不是 `Directory.GetFiles()`\
  \ 返回的 `IEnumerable<string>` 数据类型。查询表达式的 `select` 子句可能会投影出一个与 `from` 子句表达式收集的不同的数据类型。\n\
  \n在这个示例中，选择 `FileInfo` 类型是因为它包含了所需输出的两个相关字段：文件名和最后写入时间。如果你需要 `FileInfo` 对象中未捕获的其他信息，可能就没有这样方便的类型了。元组（在\
  \ C# 7.0 之前为匿名类型）提供了一种方便且简洁的方法来投影你所需的精确数据，而无需查找或创建显式类型。列表 16.3 提供了与列表 16.2 相似的输出，但它使用了元组语法而不是\
  \ `FileInfo`。\n\n**列表 16.3：查询表达式中的元组**\n\n点击此处查看代码图像\n\n```\nusing System;\n\nusing\
  \ System.Collections.Generic;\n\nusing System.Linq;\n\nusing System.IO;\n\n// ...\n\
  \n  static void List2(string rootDirectory, string searchPattern)\n\n  {\n\n   \
  \     var fileNames =Directory.EnumerateFiles(                             \n  \
  \          rootDirectory, searchPattern)                                    \n \
  \       var fileResults =                                                    \n\
  \            from fileName in fileNames                                       \n\
  \            select                                                           \n\
  \            (                                                                \n\
  \                Name: fileName,                                              \n\
  \                LastWriteTime: File.GetLastWriteTime(fileName)               \n\
  \            );                                                               \n\
  \        foreach (var fileResult in fileResults)\n        {\n            Console.WriteLine(\n\
  \                $@\"{ fileResult.Name } ({                                    \n\
  \                    fileResult.LastWriteTime })\");                           \n\
  \        }\n  }\n\n// ...\n```\n\n`3.0`\n\n在这个示例中，查询仅投影了文件名及其最后文件写入时间。像列表 16.3 中这样的投影在处理像\
  \ `FileInfo` 这样较小的对象时区别不大。然而，当数据量巨大且检索数据（可能通过互联网从另一台计算机）开销很大时，过滤集合中每个项关联数据量的“水平”投影是极其强大的。与其在查询执行时检索所有数据，不如使用元组（C#\
  \ 7.0 之前为匿名类型）来实现仅将所需数据存储到集合中的功能。\n\n想象，一个拥有 30 列或更多列的大型数据库。如果没有元组，开发者将不得不使用包含不需要信息的对象，或者定义仅用于存储特定数据的微类型类。相反，元组允许由编译器定义类型——这些类型仅包含当前场景所需的数据。其他场景可以对其所需的属性进行不同的投影。\n\
  \n在列表 16.5 中，`where` 子句的谓词表达式和 `select` 子句的投影表达式被编译器转换为 Lambda 表达式，然后 Lambda 表达式转换为委托创建。查询表达式的结果是一个持有这些委托的引用。只有在遍历查询结果时，查询对象才会执行委托。\n\
  \n### 过滤\n\n在列表 16.1 中，`where` 子句过滤掉了保留关键字，而不是上下文关键字。该子句对集合进行“垂直”过滤：如果你认为集合是一个垂直列表，`where`\
  \ 子句会使该垂直列表变短，从而使包含更少的项。过滤标准通过谓词表示——即返回 `bool` 的 Lambda 表达式，例如 `word.Contains()`（如列表\
  \ 16.1 所示）或 `File.GetLastWriteTime(file) < DateTime.Now.AddMonths(-1)`。后者在列表 16.6\
  \ 中所示，其输出出现在输出 16.5 中。\n\n`3.0`\n\n**列表 16.6：使用 `where` 进行查询表达式过滤**\n\n点击此处查看代码图像\n\
  \n\n\n\n```c\nusing System;\n\nusing System.Collections.Generic;\n\nusing System.Linq;\n\
  \nusing System.IO;\n\n// ...\n\n  static void FindMonthOldFiles(\n      string rootDirectory,\
  \ string searchPattern)\n  {\n      IEnumerable<FileInfo> files =\n          from\
  \ fileName in Directory.EnumerateFiles(\n              rootDirectory, searchPattern)\n\
  \          where File.GetLastWriteTime(fileName) <                           \n\
  \              DateTime.Now.AddMonths(-1)                                    \n\
  \          select new FileInfo(fileName);\n\n      foreach (FileInfo file in files)\n\
  \      {\n          //  为了简化起见，假设当前目录\n          //  是 rootDirectory 的一个子目录\n  \
  \        string relativePath = file.FullName.Substring(\n                  Environment.CurrentDirectory.Length);\n\
  \          Console.WriteLine(\n              $\".{ relativePath } ({ file.LastWriteTime\
  \ })\");\n      }\n  }\n// ...\n```\n\n## 输出 16.5\n\n点击此处查看代码图像\n\n```\n.\\TestData\\\
  Bill.cs (8/10/2011 9:33:55 PM)\n.\\TestData\\Contact.cs (8/19/2011 11:40:30 PM)\n\
  .\\TestData\\Employee.cs (8/17/2011 1:33:22 AM)\n.\\TestData\\Person.cs (10/22/2011\
  \ 10:00:03 PM)\n```\n\n## 排序\n\n要使用查询表达式对项目进行排序，你可以使用 `orderby` 子句，如列表 16.7 所示。\n\
  \n### 列表 16.7：使用 `orderby` 子句通过查询表达式排序\n\n点击此处查看代码图像\n\n```c\nusing System;\n\n\
  using System.Collections.Generic;\nusing System.Linq;\nusing System.IO;\n\n// ...\n\
  \n  static void ListByFileSize1(\n      string rootDirectory, string searchPattern)\n\
  \  {\n      IEnumerable<string> fileNames =\n          from fileName in Directory.EnumerateFiles(\n\
  \              rootDirectory, searchPattern)\n          orderby (new FileInfo(fileName)).Length\
  \ descending,                              \n              fileName            \
  \                                                         \n          select fileName;\n\
  \n      foreach (string fileName in fileNames)\n      {\n          Console.WriteLine(fileName);\n\
  \      }\n  }\n// ...\n```\n\n列表 16.7 使用 `orderby` 子句对 `Directory.GetFiles()` 返回的文件首先先按文件大小降序排序，然后按文件名升序排序。多个排序标准用逗号隔开，例如首先按大小对项目进行排序，如果大小相同，则按文件名排序。`ascending`\
  \ 和 `descending` 是指示排序方向的上下文关键字。指定顺序为升序或降序是可选的；如果省略了方向（在此处 `filename` 处省略了），默认为\
  \ `ascending`。\n\n## `let` 子句\n\n列表 16.8 包含一个与列表 16.7 中的查询非常相似的查询，但 `IEnumerable<T>`\
  \ 的类型参数是 `FileInfo`。然而，这个查询存在一个问题：我们必须在 `orderby` 子句和 `select` 子句中冗余地创建两次 `FileInfo`。\n\
  \n### 列表 16.8：投影 `FileInfo` 集合并按文件大小排序\n\n点击此处查看代码图像\n\n```c\nusing System;\n\n\
  using System.Collections.Generic;\nusing System.Linq;\nusing System.IO;\n\n// ...\n\
  \n  static void ListByFileSize2(\n      string rootDirectory, string searchPattern)\n\
  \  {\n      IEnumerable<FileInfo> files =\n          from fileName in Directory.EnumerateFiles(\n\
  \              rootDirectory, searchPattern)\n          orderby new FileInfo(fileName).Length,\
  \ fileName\n          select new FileInfo(fileName);\n\n      foreach (FileInfo\
  \ file in files)\n      {\n          //  为了简化起见，假设当前目录\n          //  是 rootDirectory\
  \ 的一个子目录\n          string relativePath = file.FullName.Substring(\n           \
  \   Environment.CurrentDirectory.Length);\n          Console.WriteLine(\n      \
  \        $\".{ relativePath }({ file.Length })\");\n      }\n  }\n// ...\n```\n\n\
  ### 3.0\n\n遗憾的是，尽管结果是正确的，列表 16.8 最终为源集合中的每个项目实例化了两次 `FileInfo` 对象，这是浪费且没有必要的。为了避免这种不必要的且可能昂昂的开销，你可以使用\
  \ `let` 子句，如列表 16.9 所示。\n\n### 列表 16.9：在查询表达式中对结果进行排序\n\n点击此处查看代码图像\n\n```c\n//\
  \ ...\n\nIEnumerable<FileInfo> files =\n    from fileName in Directory.EnumerateFiles(\n\
  \        rootDirectory, searchPattern)\n    let file = new FileInfo(fileName)\n\
  \    orderby file.Length, fileName                                   \n    select\
  \ file;\n\n// ...\n```\n\n`let` 子句引入了一个新变量，可以存储表达式的值，该变量用于查询的剩余部分。你可以添加任意数量的 `let`\
  \ 子句；只需在第一个 `from` 子句之后、最后的 `select` 子句之前插入。\n\n## 分组\n\n常见的数据处理场景是相关项目的分组。在 SQL\
  \ 中，这通常涉及聚合项目以产生摘要或总计。然而，LINQ 的表达力更高。LINQ 表达式允许将单独的项目组成系列子集合，然后这些组可以与被查询的项目关联。例如，列表\
  \ 16.10 和输出 16.6 演示了如何对上下文关键字和普通关键字进行分组。\n\n### 3.0\n\n### 列表 16.10：对查询结果分组\n\n\
  点击此处查看代码图像\n\n```c\nusing System;\n\nusing System.Collections.Generic;\nusing System.Linq;\n\
  \n// ...\n\n  private static void GroupKeywords1()\n  {\n      IEnumerable<IGrouping<bool,\
  \ string>> selection =\n          from word in CSharp.Keywords\n          group\
  \ word by word.Contains('*');\n\n      foreach (IGrouping<bool, string> wordGroup\n\
  \          in selection)\n      {\n          Console.WriteLine(Environment.NewLine\
  \ + \"{0}:\",\n              wordGroup.Key ?\n                  \"Contextual Keywords\"\
  \ : \"Keywords\");\n          foreach (string keyword in wordGroup)\n          {\n\
  \              Console.Write(\" \" +\n                  (wordGroup.Key ?\n     \
  \                 keyword.Replace(\"*\", null) : keyword));\n          }\n     \
  \ }\n  }\n// ...\n```\n\n### 输出 16.6\n\n点击此处查看代码图像\n\n```\nKeywords:\nabstract as\
  \ base break byte case catch checked class\nconst continue decimal default do enum\
  \ event\nexplicit external false finally fixed float for foreach goto\nimplicit\
  \ in int interface internal is lock long namespace new\nnull operator in in out\
  \ override object params private protected public\nreadonly ref return sbyte sealed\
  \ short sizeof stackalloc static\nstring struct this throw true try typeof uint\
  \ ulong\nunsafe ushort using virtual unchecked void volatile while\nwhile\n\nContextual\
  \ Keywords:\nadd alias ascending async await by descending dynamic equals\nfrom\n\
  get global group by into join let nonnull on orderby partial remove\nselect value\
  \ var where yield\n```\n\n\n\n\n\n在 Listing 16.10 中有几点需要注意。首先，查询结果是类型为 `IGrouping<bool,\
  \ string>` 的元素序列。第一个类型参数表示 `by` 之后的“分组键”表达式的类型为 `bool`，第二个类型参数表示 `group` 之后的“分组元素”表达式的类型为\
  \ `string`。也就是说，查询产生了一个组序列，其中每个组内每个 `string` 的布尔键都是相同的。\n\n### 3.0\n\n由于带有 `group\
  \ by` 子句的查询会产生一个集合序列，因此遍历结果的常用模式是创建嵌套的 `foreach` 循环。在 Listing 16.10 中，外层循环遍历分组并将关键字类型作为标题打印出来。嵌套的\
  \ `foreach` 循环将组中的每个关键字作为标题下方的项目打印出来。\n\n此查询表达式的结果本身是一个序列，你可以像查询任何其他序列一样对它进行查询。Listing\
  \ 16.11 和 Output 16.7 展示了如何创建一个额外的查询，在产生组序列的查询之上添加一个投影。（下一节关于查询延续的章节将展示一种用于为完整查询添加更多查询子句的更愉悦的语法。）\n\
  \n**Listing 16.11: 在 `group` 子句后选择元组**\n\n点击此处查看代码图像\n\n```csharp\nusing System;\n\
  \nusing System.Collections.Generic;\n\nusing System.Linq;\n\n// ...\n\n  private\
  \ static void GroupKeywords1()\n\n  {\n\n      IEnumerable<IGrouping<bool, string>>\
  \ keywordGroups =                  \n          from word in CSharp.Keywords    \
  \                                  \n          group word by word.Contains('*');\
  \                                 \n      IEnumerable<(bool IsContextualKeyword,\
  \ IGrouping<bool, string> Items)>\nselection =                                 \
  \                                \n          from groups in keywordGroups      \
  \                                \n          select                            \
  \                                \n          (                                 \
  \                                \n              IsContextualKeyword: groups.Key,\
  \                              \n              Items: groups                   \
  \                              \n          );                                  \
  \                              \n      foreach (\n          (bool isContextualKeyword,\
  \ IGrouping<bool, string> items) in\ninselection)\n      {\n          Console.WriteLine(Environment.NewLine\
  \ + \"{0}:\",\n              isContextualKeyword ?\n                  \"Contextual\
  \ Keywords\" : \"Keywords\");\n          foreach (string keyword in items)\n   \
  \       {\n              Console.Write(\" \" +\n                  keyword.Replace(\"\
  *\", null));\n          }\n      }\n  }\n\n// ...\n```\n\n### 3.0\n\n**Output 16.7**\n\
  \n点击此处查看代码图像\n\n```text\nKeywords:\n\n abstract as base bool break byte case catch\
  \ char checked class\nconst continue default delegate do double else enum\nevent\
  \ explicit extern false finally fixed float for foreach goto if\nimplicit in int\
  \ interface internal is lock long namespace new null\noperator out override object\
  \ params private protected public\nreadonly ref return sbyte sealed short sizeof\
  \ stackalloc static\nstring struct switch this throw true try typeof uint ulong\
  \ unsafe\nushort using virtual unchecked void volatile while\nContextual Keywords:\n\
  \n add alias ascending async await by descending dynamic equals from\nget global\
  \ group into join let nameof nonnull on orderby partial remove\nselect set value\
  \ var where yield\n```\n\n`group` 子句导致一个产生 `IGrouping<TKey, TElement>` 对象集合的查询——就像\
  \ `GroupBy()` 标准查询运算符所的那样（参见第 15 章）。后续查询中的 `select` 子句使用元组有效地将 `IGrouping<TKey,\
  \ TElement>.Key` 重命名为 `IsContextualKeyword`，并将子集合属性命名为 `Items`。通过此更改，嵌套的 `foreach`\
  \ 循环使用 `wordGroup.Items` 而不是直接使用 `wordGroup`，如 Listing 16.10 所示。元组的另一个潜在项目可以是子集合内项目的计数。然而，此功能已经通过\
  \ LINQ 的 `wordGroup.Items.Count()` 方法可用，因此直接将其添加到匿名类型中的好处尚存疑虑。\n\n#### 使用 `into`\
  \ 的查询延续\n\n### 3.0\n\n正如我们在 Listing 16.11 中看到的，你可以使用现有查询作为第二个查询的输入。然而，当你想将一个查询的结果作为另一个查询的输入时，没有必要编写一个完全新的查询表达式。你可以使用上下文关键字\
  \ `into` 通过**查询延续子句**（query continuation clause）来扩展任何查询。查询延续仅仅是创建两个查询并将第一个作为第二个查询的输入的语法糖。由\
  \ `into` 子句引入的范围变量（Listing 16.11 中的 `groups`）成为查询剩余部分的范围变量；任何先前的范围变量在逻辑上都属于较早的查询，不能在查询延续中使用。Listing\
  \ 16.12 重写了 Listing 16.11 的代码以使用查询延续。\n\n**Listing 16.12: 不使用查询延续的选择**\n\n点击此处查看代码图像\n\
  \n```csharp\nusing System;\n\nusing System.Collections.Generic;\n\nusing System.Linq;\n\
  \n// ...\n\n  private static void GroupKeywords1()\n\n  {\n      IEnumerable<(bool\
  \ IsContextualKeyword, IGrouping<bool, string> Items)>\nselection =\n\n        \
  \  from word in CSharp.Keywords\n          group word by word.Contains('*')    \
  \                               \n          into groups                        \
  \                                \n              select                        \
  \                                 \n              (                            \
  \                                     \n                  IsContextualKeyword: groups.Key,\
  \                              \n                  Items: groups               \
  \                               \n              );                             \
  \                                \n      // ...\n\n  }\n// ...\n```\n\n使用 `into`\
  \ 在现有查询的结果上运行额外查询的能力并不是以 `group` 子句结尾的查询所特有的，而是适用于所有的查询表达式。查询延续仅仅是编写消耗其他查询表达式结果的查询表达式的简写。你可以将\
  \ `into` 视为一个“管道操作符”，因为它将第一个查询的结果“输”到第二个查询中。你可以以这种方式任意地链接许多查询。\n\n### 3.0\n\n####\
  \ 使用多个 `from` 子句平坦化序列\n\n通常希望将序列序列“平坦化”为单个序列。例如，客户序列中的每个成员可能有一个关联的订单序列，或者目录序列中的每个成员可能有一个关联的文件序列。`SelectMany`\
  \ 序列运算符（在第 15 章中讨论）连接所有的子序列；使用查询表达式语法实现相同操作，可以使用多个 `from` 子句，如 Listing 16.13 所示。\n\
  \n**Listing 16.13: 多重选择**\n\n点击此处查看代码图像\n\n```csharp\nvar selection =\n\n    from\
  \ word in CSharp.Keywords\n    from character in word                          \
  \                      \n    select character;\n```\n\n上述查询将产生字符序列 `a`, `b`, `s`,\
  \ `t`, `r`, `a`, `c`, `t`, `a`, `d`, `d`, `*`, `a, l`, `i`, `a`, ….\n\n\n\n\n\n\
  多个 `from` 子句也可以用于生成`笛卡尔积`（Cartesian product），即多个序列所有可能的组合的集合——如列表 16.14 所示。\n\n\
  **列表 16.14：笛卡尔积**\n\n点击此处查看代码图片\n\n```\nvar numbers = new[] { 1, 2, 3 };\n\nIEnumerable<(string\
  \ Word, int Number)> product =\n\n    from word in CSharp.Keywords\n\n    from number\
  \ in numbers                                                \n\n    select (word,\
  \ number);\n```\n\n此查询将产生一个对序列：(`abstract`, `1`), (`abstract`, `2`), (`abstract`,\
  \ `3`), (`as`, `1`), (`as`, `2`)……\n\n在例例中，`typeof(Enumerable).GetMembers()` 返回\
  \ `System.Linq.Enumerable` 的所有成员（方法、属性等）的列表。然而，这些成员中的许多是重载的，有时甚至重载了多次。为了避免多次显示同一个成员，我们在查询表达式中调用了\
  \ `Distinct()`。这消除了列表中重复的名称。（我们将在第 18 章中介绍 `typeof()` 和反射的细节，[在反射中像 `GetMembers()`\
  \ 这样的方法是可用的]。）\n\n`3.0`\n\n### 查询表达式本质就是方法调用\n\n令人有些惊讶的是，在 C# 3.0 中添加查询表达式不需要更改公共语言运行时\
  \ (CLR) 或公共中间语言 (CIL)。相反，C# 编译器简单地将查询表达式翻译为一系列方法调用。例如，考虑来自列表 16.1 的查询表达式，其部分内容出现在列表\
  \ 16.16 中。\n\n**列表 16.16：简单查询表达式**\n\n点击此处查看代码图片\n\n```\nprivate static void ShowContextualKeywords1()\n\
  \n{\n    IEnumerable<string> selection =                                       \
  \          \n        from word in CSharp.Keywords                              \
  \                  \n            where word.Contains('*')                      \
  \                          \n            select word;                          \
  \                                  \n    // ...\n}\n```\n\n编译后，来自列表 16.16 的表达式被转换为来自\
  \ `System.Linq.Enumerable` 的 `IEnumerable<T>` 扩展方法调用，如列表 16.17 所示。\n\n**列表 16.17：翻译为标准查询操作符语法的查询表达式**\n\
  \n点击此处查看代码图片\n\n```\nprivate static void ShowContextualKeywords3()\n\n{\n    IEnumerable<string>\
  \ selection =                                                \n        CSharp.Keywords.Where(word\
  \ => word.Contains('*'));                         \n    // ...\n}\n```\n\n正如第 15\
  \ 章所示，lambda 表达式随后由编译器翻译，以生成一个具有 lambda 主体的方法，其使用涉及为该方法分配一个委托。\n\n每个查询表达式都可以（并且必须）翻译成方法调用，但并不是每个方法调用序列都对应一个查询表达式。例如，扩展方法\
  \ `TakeWhile<T>(Func<T, bool> predicate)` 没有等效的查询表达式，它在谓词返回 `true` 期间会不断从集合中返回项。\n\
  \n对于那些既有方法调用形式又有查询表达式形式的查询，哪种更好？这是一个主观判断。某些查询更适合使用查询表达式，而另一些作为方法调用则更具可读性。\n\n`3.0`\n\
  \n### 总结\n\n本章引入了一种新语法——即查询表达式。熟悉 SQL 的读者会立即发现查询表达式与 SQL 之间的相似之处。然而，查询表达式还引入了额外的功能，例如分组为层次化的新对象集合，这在\
  \ SQL 中是无法实现的。查询表达式的所有功能已经通过标准查询操作符可用，但查询表达式通常为表达此类查询提供了更简单的语法。然而，无论使用标准查询操作符还是使用查询表达式语法，最终结果都是开发者针对集合\
  \ API 编写代码的方式有了显著改进——这种改进最终为面向对象的语言与关系型数据库交互的方式带来了范式上的转变。\n\n在下一章中，我们将继续通过研究一些 .NET\
  \ 框架集合类型并探索如何定义自定义集合来继续讨论集合。\n\n`End 3.0`\n\n## 17. 构建自定义集合\n\n`Begin 2.0`\n\n第\
  \ 15 章 涵盖了标准查询操作符——即 `IEnumerable<T>` 上的提供所有集合通用方法的扩展方法。然而，这些操作符并没有让所有集合都适用于所有任务；仍然需要不同的集合类型。某些集合更适合通过键进行搜索，而另一些更适合通过位置访问项。某些集合像队列：先进入的元素先出。另一些更像栈：先进入的元素最后出。有些则完全没有顺序。\n\
  \n![一张思维导图描述了构建自定义集合。](img/17mindmap.jpg)\n\n.NET 框架提供了大量的集合类型，适用于需要集合的许多场景。本章介绍了其中一些集合类型及其实现的接口。它还描述了如何创建支持索引等标准的自定义集合。此外，它探索了使用\
  \ `yield return` 语句创建实现 `IEnumerable<T>` 的类。这一 C# 2.0 特性极大简化了可以使用 `foreach` 语句枚举的集合的实现。\n\
  \n许多非泛型集合类和接口在 .NET Framework 中可用，但通常情况下，这些存在是为了与泛型出现之前的代码兼容。泛型集合类型更快（因为避免了装箱费用），而且比非泛型集合更类型安全。因此，新代码几乎总是使用泛型集合类型。在本书中，我们假设你使用的是泛型集合类型。\n\
  \n### 更多集合接口\n\n我们已经见过集合如何实现 `IEnumerable<T>`，遍历集合元素的主要接口。许多额外的接口由更复杂的集合实现。图 17.1\
  \ 显示了集合类实现的接口层次结构。\n\n这些接口为执行常见任务（如迭代、索引和计数元素）提供了标准方法。本节将检查这些接口（至少是所有泛型接口），从图 17.1\
  \ 的底部开始向上移动。\n\n#### `IList<T>` 与 `IDictionary<TKey, TValue>`\n\n英语字典可以被看作是定义的集合。可以通过查找关联的“键”（即被定义的单词）来快速访问特定的定义。字典集合类同样是值的集合，每个值都可以通过其关联的唯一键快速访问。请注意，语言字典通常按键字母顺序存储定义；字典类可能会选择这样做，但通常并不这样做。\n\
  \n\n\n\n字典集合最好被视为键及其关联值的无序列表，除非文档中特别说明了它们是有序的。同样，人们通常不会考虑查找“字典中的第六个定义”；字典类通常只提供通过键进行索引，而不是通过位置。\n\
  \n相比之下，列表（List）按特定顺序存储值并通过其位置访问它们。从某种意义上说，列表只是字典的特殊情况，其中“键”始终是一个整数，而“键集”始终是一个从零开始的连续非负整数集合。尽管如此，这种差异已经足够大，以至于有必要使用一种完全不同的类型来表示它。\n\
  \n因此，在选择集合类来解决某些数据存储或检索问题时，首先要寻找的两个接口是 `IList<T>` 和 `IDictionary<TKey, TValue>`。这些接口指示了集合类型侧重于在给定位置索引时检索值，还是在给定关联键时检索值。\n\
  \n这两个接口都要求实现它们的类必须提供一个索引器（indexer）。在 `IList<T>` 的情况下，索引器的操作数对应于所检索元素的位置：索引器接收一个整数，并允许你访问列表中的第\
  \ *n* 个元素。在 `IDictionary<TKey, TValue>` 接口的情况下，索引器的操作数对应于与值相关的键，并允许你访问该值。\n\n###\
  \ `ICollection<T>`\n\n`IList<T>` 和 `IDictionary<TKey, TValue>` 都实现了 `ICollection<T>`。一个既没有实现\
  \ `IList<T>`也没有实现 `IDictionary<TKey, TValue>` 的集合很可能实现了 `ICollection<T>`（尽管不一定，因为集合也可以实现要求更低的\
  \ `IEnumerable` 或 `IEnumerable<T>`）。`ICollection<T>` 派生自 `IEnumerable<T>`，并包含两个成员：`Count`\
  \ 和 `CopyTo()`。\n\n#### 2.0\n\n*   `Count` 属性返回集合中的元素总数。起初，这似乎足够使用 `for` 循环遍历集合中的每个元素，但实际上，该集合还需要支持通过索引进行检索，而\
  \ `ICollection<T>` 接口并不包含此功能（尽管 `IList<T>` 包含了它）。\n*   `CopyTo()` 方法提供了将集合转换为数组的能力。该方法包含一个\
  \ `index` 参数，因此你可以指定在目标数组中插入元素的位置。要使用该方法，你必须初始化目标数组具有足够的容量（从 `index` 开始），以容纳 `ICollection<T>`\
  \ 中的所有元素。\n\n### 主要集合类\n\n存在五类关键的集合类，它们在数据插入、存储和检索方面相互不同。每个泛型类都位于 `System.Collections.Generic`\
  \ 命名空间，它们的非泛型等效类位于 `System.Collections` 命名空间。\n\n#### 列表集合：`List<T>`\n\n`List<T>`\
  \ 类具有类似于数组的属性。区别在于这些类随着元素数量的增加自动扩展。（相比之下，数组的大小是固定的。）此外，列表可以通过显式调用 `TrimToSize()`\
  \ 或 `Capacity` 来收缩（参见图 17.2）。\n\n这些类被分类为列表集合，其区别功能是每个元素都可以像数组一样通过索引单独访问。因此，你可以使用索引运算符在列表集合类中设置和访问元素，其中索引参数值对应于元素在集合中的位置。列表\
  \ 17.1 显示了一个示例，输出 17.1 显示了结果。\n\n`2.0`![List<> 类的插图](img/17fig02.jpg)\n\n**图 17.2：`List<>`\
  \ 类图**\n\n**列表 17.1：使用 `List<T>`**\n\n点击此处查看代码图像\n\n```\nusing System;\n\nusing\
  \ System.Collections.Generic;\n\nclass Program\n{\n  static void Main()\n  {\n \
  \     List<string> list = new List<string>()\n      { \"Sneezy\", \"Happy\", \"\
  Dopey\",  \"Doc\", \"Sleepy\", \"Bashful\",  \"Grumpy\"};\n\n      list.Sort();\n\
  \n      Console.WriteLine(\n          $\"In alphabetical order { list[0] } is the\
  \ \"\n          + $\"first dwarf while { list[6] } is the last.\");\n\n      list.Remove(\"\
  Grumpy\");\n  }\n}\n```\n\n**输出 17.1**\n\n点击此处查看代码图像\n\n```\nIn alphabetical order\
  \ Bashful is the first dwarf while Sneezy is the last.\n```\n\nC# 是基于零索引的；因此，列表\
  \ 17.1 中的索引 0 对应第一个元素，索引 6 表示第七个元素。通过索引检索元素不涉及搜索。相反，它涉及到内存某处的快速且简单的“跳转”操作。\n\n`List<T>`\
  \ 是一个有序集合；`Add()` 方法将给定项目附加到列表末尾。在列表 17.1 调用 `Sort()` 之前，按照字母顺序，\"Sneezy\" 是第一个而\
  \ \"Grumpy\" 是最后一个；调用后，列表按字母顺序排序。某些集合在添加元素时会自动排序，但 `List<T>` 不是其中之一；需要显式调用 `Sort()`。要删除元素，你分别使用\
  \ `Remove()` 或 `RemoveAt()` 方法删除给定元素或特定索引处的元素。\n\n`2.0`\n\n#### 全序\n\n`2.0`\n\n\
  在实现 `IComparable<T>` 或 `IComparer<T>` 时，你需要产生全序。你的 `CompareTo` 实现必须为任何可能的项目对提供完全一致的排序。这种排序具有若干基本特征。例如，每个元素都被要求与自身相等。如果元素\
  \ X 被认为等于 Y，且 Y 被认为等于 Z，那么这三个元素 X、Y 和 Z 必须相互相等。如果元素 X 被认为大于 Y，则 Y 必须小于 X。而且不存在“传递性悖论”——也就是说，你不能出现\
  \ X 大于 Y、Z 大于 X 的情况。如果你没有提供全序，排序算法的行为是未定义的；它可能会产生奇怪的排序、可能会崩溃、可能会进入无限循环等等。\n\n注意，例如列表\
  \ 17.2 中的比较器是如何确保全序的，即使参数是 `null` 引用。例如，说“如果任何元素为 `null`，则返回零”是不允许的，因为两个非空对象可能等于\
  \ `null` 但它们之间并不相等。\n\n#### 搜索 `List<T>`\n\n要在 `List<T>` 中搜索特定元素，你使用 `Contains()`、`IndexOf()`、`LastIndexOf()`\
  \ 和 `BinarySearch()` 方法。前三种方法遍历数组，从第一个元素开始（对于 `LastIndexOf()` 则从最后一个元素开始），检查每个元素，直到找到所需的元素为止。这些算法的执行时间与命中之前搜索的元素数量成正比。（请注意，集合类并不要求集合中的所有元素都是唯一的。如果集合中有两个或多个相同的元素，`IndexOf()`\
  \ 返回第一个索引，`LastIndexOf()` 返回最后一个索引。）\n\n\n\n`BinarySearch()` 使用了快得多的二分查找算法，但要求元素必须经过排序。`BinarySearch()`\
  \ 方法的一个有用特性是，如果未找到元素，则会返回一个负整数。该值的按位取反（`~`）是比查找元素大的下一个元素的索引；如果没有更大的值，则返回元素的总数。这为在列表特定位置插入新值以保持排序提供了一种方便的方法。代码列表\
  \ 17.3 提供了一个示例。\n\n`2.0`\n\n**代码列表 17.3：使用 `BinarySearch()` 结果的按位取反值**\n\n点击此处查看代码图像\n\
  \n```\nusing System;\n\nusing System.Collections.Generic;\n\nclass Program\n{\n\n\
  \  static void Main()\n  {\n      List<string> list = new List<string>();\n\n  \
  \    int search;\n\n      list.Add(\"public\");\n      list.Add(\"protected\");\n\
  \      list.Add(\"private\");\n      list.Sort();\n\n      search = list.BinarySearch(\"\
  protected internal\");\n\n      if (search < 0)\n      {\n        list.Insert(~search,\
  \ \"protected internal\");\n      }\n\n      foreach (string accessModifier in list)\n\
  \      {\n          Console.WriteLine(accessModifier);\n      }\n  }\n}\n```\n\n\
  注意，如果列表没有先进行排序，此代码并不一定能找到元素，即使该元素在列表中。代码列表 17.3 的结果出现在输出 17.2 中。\n\n**输出 17.2**\n\
  \n```\nprivate\n\nprotected\n\nprotected internal\n\npublic\n```\n\n### 字典集合：`Dictionary<TKey,\
  \ TValue>`\n\n集合集合类是字典类——特别是 `Dictionary<TKey, TValue>`（参见图 17.3）。与列表集合不同，字典类存储的是键/值对。名称充当唯一键，可以类似于使用主键访问数据库中的记录，来查找相应的元素。这增加了访问字典元素的复杂性，但由于通过查找是高效的操作，因此这是一个非常有用的集合。注意，键可以是任何数据类型，而不仅仅是字符串或数值。\n\
  \n`2.0`![Dictionary<> 类的插图](img/17fig03.jpg)\n\n**图 17.3：`Dictionary` 类图**\n\n`2.0`\n\
  \n向字典中插入元素的方法之一是使用 `Add()` 方法，将键和值作为参数传递，如代码列表 17.5 所示。\n\n**代码列表 17.5：向 `Dictionary<TKey,\
  \ TValue>` 添加项**\n\n点击此处查看代码图像\n\n```\nusing System;\n\nusing System.Collections.Generic;\n\
  \nclass Program\n{\n  static void Main()\n  {\n      // C# 6.0 (pre-C# 6.0 使用 {\"\
  Error\", ConsoleColor.Red})\n      var colorMap = new Dictionary<string, ConsoleColor>\n\
  \          {\n              [\"Error\"] = ConsoleColor.Red,\n              [\"Warning\"\
  ] = ConsoleColor.Yellow,\n              [\"Information\"] = ConsoleColor.Green\n\
  \          };\n      colorMap.Add(\"Verbose\", ConsoleColor.White);            \
  \                   \n      // ...\n  }\n}\n```\n\n在使用 C# 6.0 字典初始化器初始化字典（参见第 15\
  \ 章””节），代码列表 17.5 为键 \"Verbose\" 插入字符串 `白色的 ConsoleColor`。如果已添加了相同键的元素，则会抛出异常。\n\
  \n添加元素的另一种方法是使用索引器，如代码列表 17.6 所示。\n\n**代码列表 17.6：使用索引操作符在 `Dictionary<TKey, TValue>`\
  \ 中插入项**\n\n点击此处查看代码图像\n\n```\nusing System;\n\nusing System.Collections.Generic;\n\
  \nclass Program\n{\n  static void Main()\n  {\n      // C# 6.0 (pre-C# 6.0 使用 {\"\
  Error\", ConsoleColor.Red})\n      var colorMap = new Dictionary<string, ConsoleColor>\n\
  \          {\n              [\"Error\"] = ConsoleColor.Red,\n              [\"Warning\"\
  ] = ConsoleColor.Yellow,\n              [\"Information\"] = ConsoleColor.Green\n\
  \          };\n      colorMap[\"Verbose\"] = ConsoleColor.White;               \
  \                 \n      colorMap[\"Error\"] = ConsoleColor.Cyan;             \
  \                      \n      // ...\n  }\n}\n```\n\n`2.0`\n\n在代码列表 17.6 中首先观察到的点是，索引操作符不需要整数。（注：此处原文文本似乎存在乱码，已根据上下文进行处理）。\n\
  \n\n\n\n# 2.0\n\n如果你只想处理字典类中的键或元素元素，可以分别通过 `Keys` 和 `Values` 属性进行访问。这些属性返回的数据类型为\
  \ `ICollection<T>`。这些属性返回的数据是原始字典集合中内部数据的引用，而不是副本；字典中的更改会自动反映在 `Keys` 和 `Values`\
  \ 属性返回的集合中。\n\n# 2.0\n\n**列表 17.8：实现 `IEqualityComparer<T>`**\n\n点击此处查看代码图像\n\n\
  ```csharp\nusing System;\n\nusing System.Collections.Generic;\n\nclass ContactEquality\
  \ : IEqualityComparer<Contact>\n{\n\n  public bool Equals(Contact? x, Contact? y)\n\
  \  {\n\n      if (Object.ReferenceEquals(x, y))\n          return true;\n\n    \
  \  if (x == null || y == null)\n          return false;\n\n      return x.LastName\
  \ == y.LastName &&\n          x.FirstName == y.FirstName;\n\n  }\n\n  public int\
  \ GetHashCode(Contact x)\n  {\n\n      if (x is null)\n          return 0;\n\n \
  \     int h1 = x.FirstName == null ? 0 : x.FirstName.GetHashCode();\n      int h2\
  \ = x.LastName == null ? 0 : x.LastName.GetHashCode();\n\n      return h1 * 23 +\
  \ h2;\n\n  }\n\n}\n```\n\n要创建一个使用此等相等性比较器的字典，可以使用构造函数 `new Dictionary<Contact, string>(new\
  \ ContactEquality)`。\n\n## 排序集合：`SortedDictionary<TKey, TValue>` 和 `SortedList<T>`\n\
  \n排序集合类（参见图 17.4）按键对 `SortedDictionary<TKey, TValue>` 元素，按值对 `SortedList<T>` 元素进行排序。如果我们把列表\
  \ 17.7 中的代码更改为使用 `SortedDictionary<string, string>` 代替 `Dictionary<string, string>`，程序的输出将如输出\
  \ 17.4 所示。\n\n**输出 17.4**\n\n```\nError\n\nInformation\n\nVerbose\n\nWarning\n```\n\
  \n# 2.0\n\n注意，元素是按键排序的，而不是按值排序。\n\n由于排序集合必须执行额外工作来维护元素的排序顺序，因此插入和删除操作通常比无序字典中的插入和删除操作要慢一点。\n\
  \n由于排序集合必须按照特定顺序存储项，因此既可以通过键也可以通过索引访问值。若要在排序列表中通过索引访问键或值，请使用 `Keys` 和 `Values` 属性。它们分别返回\
  \ `IList<TKey>` 和 `IList<TValue>` 实例；结果集合可以像任何其他列表一样被索引。\n\n![排序列表和排序字典类的类的插图。](img/17fig04.jpg)\n\
  \n**图 17.4：排序集合**\n\n# 2.0\n\n## 栈集合：`Stack<T>`\n\n第 12 章讨论了栈集合类（参见图 17.5）。栈集合类被设计为后进先出（LIFO）集合。两个关键方法是\
  \ `Push()` 和 `Pop()`。\n\n*   `Push()` 将元素插入到集合中。元素不需要是唯一的。\n*   `Pop()` 按照添加元素的相反顺序移除元素。\n\
  \n![Stack 类的插图。](img/17fig05.jpg)\n\n**图 17.5：`Stack<T>` 类图**\n\n若想在不修改栈的情况下访问栈上的元素，请使用\
  \ `Peek()` 和 `Contains()` 方法。`Peek()` 方法返回 `Pop()` 将检索的下一个元素。\n\n# 2.0\n\n与大多数集合类一样，你使用\
  \ `Contains()` 方法来确定元素是否存在于栈的任何位置。与所有集合一样，也可以使用 `foreach` 循环来遍历栈中的元素。这允许你从栈的任何地方访问值。但注意，通过\
  \ `foreach` 循环访问值不会将其从栈中移除——只有 `Pop()` 提供了此功能。\n\n## 队列集合：`Queue<T>`\n\n队列集合类（所示图\
  \ 17.6）与栈集合类相同，只是它们遵循先入出（FIFO）的排序模式。它们不使用 `Pop()` 和 `Push()` 方法，而是分别使用 `Enqueue()`\
  \ 和 `Dequeue()` 方法。队列的行为像一根管子：你使用 `Enqueue()` 方法将对象放入队列的一端，并使用 `Dequeue()` 方法从另一端将其取出。与栈集合类一样，对象不需要是唯一的，并且队列集合类根据需要自动增加大小。当队列缩小时，它不一定收回以前使用的存储空间，因为这可能会使插入新元素的成本更高。然而，如果你知道队列将在很长时间内保持相同的大小，你可以使用\
  \ `TrimToSize()` 方法提示它你想要回收存储空间。\n\n![Queue 类的插图。](img/17fig06.jpg)\n\n**图 17.6：`Queue<T>`\
  \ 类**\n\n# 2.0\n\n## 链表：`LinkedList<T>`\n\n`System.Collections.Generic` 还支持一种可以正向和反向遍历的链表。图\
  \ 17.7 显示了类图。（没有对应的非泛类型。）\n\n![链表的插图。](img/17fig07.jpg)\n\n**图 17.7：`LinkedList<T>`\
  \ 和 `LinkedListNode<T>` 类图**\n\n# 2.0\n\n### 提供索引器\n\n数组、字典和列表都提供**索引器**，以便根据键方便地获取或设置成员。正如我们所见，要使用索引器，只需在集合名后加上方括号。可以定义自己的索引器；列表\
  \ 17.9 显示了一个使用 `Pair<T>` 的示例。\n\n```csharp\ninterface IPair<T>\n{\n  T First { get;\
  \ }\n  T Second { get; }\n  T this[PairItem index] { get; }                    \
  \           \n}\n\npublic enum PairItem\n{\n    First,\n    Second\n}\n\npublic\
  \ struct Pair<T> : IPair<T>\n{\n  public Pair(T first, T second)\n  {\n      First\
  \ = first;\n      Second = second;\n  }\n\n  public T First { get; } // C# 6.0 只读自动属性\n\
  \  public T Second { get; } // C# 6.0 只读自动属性\n\n  public T this[PairItem index]\
  \                                           \n  {\n      get                   \
  \                                                \n          switch (index)\n\n\
  \          {\n              case PairItem.First:\n                  return First;\n\
  \              case PairItem.Second:\n                  return Second;\n       \
  \       default :\n                  throw new NotImplementedException(\n      \
  \                $\"The enum { index.ToString() } has not been implemented\");\n\
  \n          }\n\n      }\n  }\n}\n```\n\n\n\nC# 编译器从索引操作符创建的公共中间语言 (CIL) 代码是一个名为\
  \ `Item` 的特殊属性，它接收一个参数。在 C# 中不能显式创建接受参数的属性，因此 `Item` 属性在这方面是唯一的。任何标识符为 `Item` 的额外成员，即使其签名完全不同，也会与编译器创建的成员冲突，因此是不允许的。\n\
  \n`2.0`\n\n列表 17.11：使用可变参数定义索引运算符\n\n点击此处查看代码图像\n\n```csharp\nusing System;\n\n\
  public class BinaryTree<T>\n{\n\n  // ...\n\n  public BinaryTree<T> this[params\
  \ PairItem[] ?branches]\n\n  {\n      get\n      {\n          BinaryTree<T> currentNode\
  \ = this;\n          // 允许空数组或 null\n          // 指向根节点\n          int totalLevels\
  \ = branches?.Length ?? 0;\n          int currentLevel = 0;\n          while (currentLevel\
  \ < totalLevels)\n          {\n              System.Diagnostics.Debug.Assert(branches\
  \ != null,\n                  $\"{ nameof(branches) } != null\");\n            \
  \  currentNode = currentNode.SubItems[\n                  branches[currentLevel]];\n\
  \              if (currentNode == null)\n              {\n                  // 此处的二叉树为空\n\
  \                  throw new IndexOutOfRangeException();\n              }\n    \
  \          currentLevel++;\n          }\n          return currentNode;\n      }\n\
  \  }\n\n}\n```\n\n`2.0`\n\n`branches` 中的每个项目都是 `PairItem`，指示在二叉树中向下导航到哪个分支。例如，\n\
  \n点击此处查看代码图像\n\n```csharp\ntree[PairItem.Second, PairItem.First].Value\n```\n\n\
  将检索位于第一个分支中的第二个项目的值，随后是该分支中的第一个分支的值。\n\n### 返回 `null` 或空集合\n\n在返回数组或集合时，你必须通过返回\
  \ `null` 或不包含项的集合实例来指示有零项目。通常情况下更好的选择是返回一个不包含项的集合实例。这样做，你可以避免强制调用者在迭代集合中的项之前检查 `null`。例如，给定一个大小为零的\
  \ `IEnumerable<T>` 集合，调用者可以立即安全地对集合使用 `foreach` 循环，而不必担心生成的 `GetEnumerator()` 调用会抛出\
  \ `NullReferenceException`。考虑使用 `Enumerable.Empty<T>()` 方法来轻松生成给定类型的空集合。\n\n偏离这一准则的少数情况之一是当\
  \ `null` 刻意表示与零项目不同的含义时。例如，一个网站的用户名集合可能是 `null`，表示由于某些原因无法获取最新的集合；这在语义上与空集合不同。\n\
  \n### 迭代器\n\n第 15 章 详细讨论了 `foreach` 循环的内部机制。本节讨论了如何使用迭代器来为自定义集合创建 `IEnumerator<T>`、`IEnumerable<T>`\
  \ 以及相应的非泛型接口的自定义实现。迭代器为指定如何迭代集合类中的数据提供了了一种整洁的语法，特别是使用 `foreach` 循环时。迭代器允许集合的终端用户在不了解该结构的情况下导航其内部结构。\n\
  \n`2.0`\n\n如果类想要支持使用 `foreach` 循环结构进行迭代，它们必须实现枚举器模式。如第 15 章所述，在 C# 中，`foreach` 循环结构由编译器展开为基于从\
  \ `IEnumerable<T>` 接口获取的 `IEnumerator<T>` 接口的 `while` 循环结构。\n\n枚举模式的问题在于手动实现可能麻烦，因为它必须维护描述集合中当前位置所需的状态。对于列表集合类型类，这种内部状态可能是简单的；当前位置的索引通常足够。相比之下，对于需要递归遍历的数据结构（例如二叉树），状态可能会非常复杂。为了减轻实现此模式带来的挑战，C#\
  \ 2.0 包含了一种结构，使得类更容易规定 `foreach` 循环如何迭代其内容。\n\n### 定义迭代器\n\n迭代器是实现类方法的一种手段，它们是更复杂的枚举器模式的语法快捷方式。当\
  \ C# 编译器遇到迭代器时，它会将其内容展开为实现枚举器模式的 CIL 代码。因此，实现迭代器没有运行时依赖。由于 C# 编译器通过生成 CIL 代码处理实现，因此使用迭代器并没有真正的运行时性能收益。然而，通过选择迭代器而非手动实现枚举器模式，可能会获得巨大的程序员生产力提升。要理解这种改进是如何产生的，我们必须首先考虑代码中定义迭代器。\n\
  \n`2.0`\n\n### 迭代器语法\n\n迭代器提供了迭代器接口的快捷实现，即 `IEnumerable<T>` 和 `IEnumerator<T>` 接口的组合。列表\
  \ 17.12 通过创建一个 `GetEnumerator()` 方法为泛型类型 `BinaryTree<T>` 声明了一个迭代器。接下来你将添加对迭代器接口的支持。\n\
  \n列表 17.12：枚举器接口模式\n\n点击此处查看代码图像\n\n```csharp\nusing System;\nusing System.Collections.Generic;\n\
  \npublic class BinaryTree<T>:\n    IEnumerable<T>                              \
  \                   \n\n{\n  public BinaryTree ( T value)\n\n  {\n      Value =\
  \ value;\n  }\n\n  #region IEnumerable<T>\n\n  public IEnumerator<T> GetEnumerator()\
  \                            \n\n  {\n      //...\n  }\n\n  #endregion IEnumerable<T>\n\
  \n  public T Value { get; }  // C# 6.0 只读的自动属性\n\n  public Pair<BinaryTree<T>> SubItems\
  \ { get; set; }\n}\n\npublic struct Pair<T>\n\n{\n  public Pair(T first, T second)\
  \ : this()\n\n  {\n      First = first;\n      Second = second;\n  }\n\n  public\
  \ T First { get; }  // C# 6.0 只读的自动属性\n\n  public T Second { get; } // C# 6.0 只读的自动属性\n\
  }\n```\n\n如列表 17.12 所示，我们需要为 `GetEnumerator()` 方法提供实现。\n\n`2.0`\n\n#### 从迭代器产出值\n\
  \n迭代器类似于函数，但它们不是返回单个值，而是逐个产生（yield）一个值序列。在 `BinaryTree<T>` 的情况下，迭代器产生提供的类型参数 `T`\
  \ 的值序列。如果使用非泛型的 `IEnumerator`，产出的值将转变为 `object` 类型。\n\n要正确实现枚举器模式，你需要维护一些内部状态，以跟踪迭代集合时所处的位置。在\
  \ `BinaryTree<T>` 的情况下，你跟踪树中哪些元素已经枚举过，哪些仍待枚举。迭代器被编译器转换为一个“状态机”，用于跟踪当前位置并知道如何“移动自身”到下一个位置。\n\
  \n\n\n\n\n`yield return` 语句在迭代器每次遇到它时都会产生一个值；控制权立即返回给请求该项目的调用者。（这里有一个有趣的点，控制权确实是*立即*返回的，讽刺的是，这与\
  \ `return` 语句不同。`return` 语句会在执行过程中运行 `finally` 块；而 `yield return` 则不会。）当调用者请求下一个项目时，代码将从上一次执行的\
  \ `yield return` 语句之后开始执行。在列表 17.13 中，你顺序返回了 C# 内置数据类型关键字。\n\n`2.0`\n\n**列表 17.13:\
  \ 顺序产生某些 C# 关键字**\n\n点击此处查看代码图像\n\n```\nusing System;\n\nusing System.Collections.Generic;\n\
  \npublic class CSharpBuiltInTypes: IEnumerable<string>\n\n{\n\n  public IEnumerator<string>\
  \ GetEnumerator()\n  {\n\n      yield return \"object\";\n      yield return \"\
  byte\";\n      yield return \"uint\";\n      yield return \"ulong\";\n      yield\
  \ return \"float\";\n      yield return \"char\";\n      yield return \"bool\";\n\
  \      yield return \"ushort\";\n      yield return \"decimal\";\n      yield return\
  \ \"int\";\n      yield return \"sbyte\";\n      yield return \"short\";\n     \
  \ yield return \"long\";\n      yield return \"void\";\n      yield return \"double\"\
  ;\n      yield return \"string\";\n\n  }\n      // The IEnumerable.GetEnumerator\
  \ method is also required\n      // because IEnumerable<T> derives from IEnumerable\n\
  \n  System.Collections.IEnumerator\n      System.Collections.IEnumerable.GetEnumerator()\n\
  \  {\n\n      // Invoke IEnumerator<string> GetEnumerator() above\n\n      return\
  \ GetEnumerator();\n\n  }\n\n}\n\npublic class Program\n{\n\n  static void Main()\n\
  \  {\n\n      var keywords = new CSharpBuiltInTypes();\n      foreach (string keyword\
  \ in keywords)\n      {\n\n          Console.WriteLine(keyword);\n\n      }\n  }\n\
  }\n```\n\n列表 17.13 的结果出现在输出 17.5 中。\n\n**输出 17.5**\n\n```\nobject\nbyte\nuint\n\
  ulong\nfloat\nchar\nbool\nushort\ndecimal\nint\nsbyte\nshort\nlong\nvoid\ndouble\n\
  string\n```\n\n此列表的输出是 C# 内置类型的列表。\n\n`2.0`\n\n### 迭代器与状态\n\n当在 `foreach` 语句第一次调用\
  \ `GetEnumerator()` 时（例如列表 17.13 中的 `foreach (string keyword in keywords)`），它会创建一个迭代器对象，并将其状态初始化为特殊的“开始”状态，该状态表示迭代器中尚未执行任何代码，因此尚未产生任何值。只要调用处的\
  \ `foreach` 语句继续执行，迭代器就会保持其状态。每当循环请求下一个值时，控制权就会进入迭代器，并从上一次循环停止的地方继续执行；存储在迭代器对象中的状态信息被用于确定控制权必须从何处恢复。当调用处的\
  \ `foreach` 语句终止时，迭代器的状态将不再保存。\n\n再次调用 `GetEnumerator()` 总是安全的；在需要时会创建“新的”迭代器对象。\n\
  \n图 17.8 显示了发生过程的高级序列图。请记住 `MoveNext()` 方法出现在 `IEnumerator<T>` 接口上。\n\n![带有 Move\
  \ Next 命令和 yield return 的分级序列图](img/17fig08.jpg)\n\n**图 17.8: 应用 `yield return`\
  \ 的序列图**\n\n`2.0`\n\n在列表 17.13 中，调用处的 `foreach` 语句启动对名为 `keywords` 的 `CSharpBuiltInTypes`\
  \ 实例的 `GetEnumerator()` 调用。给定迭代器实例（由 `iterator` 引用），`foreach` 通过调用 `MoveNext()`\
  \ 开始每次每次迭代。在迭代器内部，你将一个值返回给调用处的 `foreach` 语句。在 `yield return` 语句之后，`GetEnumerator()`\
  \ 方法似乎挂起了，直到下一次 `MoveNext()` 请求。回到循环体中，`foreach` 语句在屏幕上显示产生的值。然后它再次循环，并再次对迭代器调用\
  \ `MoveNext()`。注意第二次，控制权从第二个 `yield return` 语句处接上。再次，`foreach` 在屏幕上显示 `CSharpBuiltInTypes`\
  \ 产生的内容并重新循环。这个过程一直持续，直到迭代器中没有更多的 `yield return` 语句为止。此时，调用处的 `foreach` 循环终止，因为\
  \ `MoveNext()` 返回了 `false`。\n\n### 更多迭代器示例\n\n在修改 `BinaryTree<T>` 之前，你必须修改 `Pair<T>`\
  \ 以使用迭代器支持 `IEnumerable<T>` 接口。列表 17.14 是一个产生 `Pair<T>` 中每个元素的示例。\n\n**列表 17.14:\
  \ 使用 `yield` 实现 `BinaryTree<T>`**\n\n点击此处查看代码图像\n\n```\npublic struct Pair<T>: IPair<T>,\n\
  \    IEnumerable<T>\n{\n  public Pair(T first, T second) : this()\n  {\n      First\
  \ = first;\n      Second = second;\n  }\n\n  public T First { get; } // C# 6.0 Getter-only\
  \ Autperty\n  public T Second { get; } // C# 6.0 Getter-only Autperty\n\n  #region\
  \ IEnumerable<T>\n  public IEnumerator<T> GetEnumerator()\n  {\n      yield return\
  \ First;\n      yield return Second;\n  }\n  #endregion IEnumerable<T>\n\n  #region\
  \ IEnumerable Members\n  System.Collections.IEnumerator\n      System.Collections.IEnumerable.GetEnumerator()\n\
  \  {\n      return GetEnumerator();\n  }\n  #endregion\n}\n```\n\n在列表 17.14 中，对\
  \ `Pair<T>` 类型的迭代循环两次：首先通过 `yield return First`，然后通过 `yield return Second`。每当遇到\
  \ `GetEnumerator()` 内的 `yield return` 语句时，状态就会被保存，执行似乎“跳”出 `GetEnumerator()` 方法并进入循环体。\n\
  \n`System.Collections.Generic.IEnumerable<T>` 继承自 `System.Collections.IEnumerable`。因此，在实现\
  \ `IEnumerable<T>` 时，也需要实现 `IEnumerable`。在列表 17.14 中，你显式地执行了，实现仅涉及对 `IEnumerable<T>`\
  \ 的 `GetEnumerator()` 的调用。从 `IEnumerable.GetEnumerator()` 到 `IEnumerable<T>.GetEnumerator()`\
  \ 的调用由于 `IEnumerable<T>` 和 `IEnumerable` 之间的类型兼容性（通过继承）始终有效。由于两个版本的 `GetEnumerator()`\
  \ 签名相同（返回类型不区分签名），一个或两个实现都必须是显式的。考虑到 `IEnumerable<T>` 版本提供的额外类型安全，你显式地实现了 `IEnumerable`\
  \ 的实现。\n\n列表 17.15 使用 `Pair<T>.GetEnumerator()` 方法，并在连续两行上显示 `\"Inigo\"` 和 `\"Montoya\"\
  `。\n\n\n\n\n\n点击此处查看代码图像\n\n```\nvar fullname = new Pair<string>(\"Inigo\", \"Montoya\"\
  );\n\nforeach (string name in fullname)\n{\n    Console.WriteLine(name);\n}\n```\n\
  \n注意，`foreach` 循环内部对 `GetEnumerator()` 的调用是隐式的。\n\n`2.0`\n\n### 在循环中放置 `yield return`\n\
  \n没有必要硬编码每个 `yield return` 语句，就像你在 `CSharpPrimitiveTypes` 和 `Pair<T>` 中做的那样。通过使用\
  \ `yield return` 语句，你可以从循环结构内部返回值。列表 17.16 使用了 `foreach` 循环。每当 `GetEnumerator()`\
  \ 内部的 `foreach` 执行一次时，它就会返回下一个值。\n\n**列表 17.16：在循环中放置 `yield return` 语句**\n\n点击此处查看代码图像\n\
  \n```\npublic class BinaryTree<T>: IEnumerable<T>\n{\n  // ...\n  #region IEnumerable<T>\n\
  \n  public IEnumerator<T> GetEnumerator()\n  {\n      // 返回此节点上的项\n      yield return\
  \ Value;\n\n      // 遍历对中的每个元素\n      foreach (BinaryTree<T>? tree in SubItems)\
  \                                  \n      {                                   \
  \                                       \n          if (tree != null)          \
  \                                            \n          {                     \
  \                                                 \n              // 因为对中的每个元素都是树，\
  \                       \n              // 遍历树并产生每个元素                        \n\
  \              foreach (T item in tree)                                        \
  \   \n              {                                                          \
  \        \n                  yield return item;                                \
  \             \n              }                                                \
  \                  \n          }                                               \
  \                       \n      }                                              \
  \                            \n  }\n  #endregion IEnumerable<T>\n\n  #region IEnumerable\
  \ Members\n\n  System.Collections.IEnumerator\n      System.Collections.IEnumerable.GetEnumerator()\n\
  \  {\n      return GetEnumerator();\n  }\n  #endregion\n}\n```\n\n在列表 17.16 中，第一次迭代返回二叉树中的根元素。在第二次迭代期间，你遍历了子元素对。如果子元素对包含非\
  \ `null` 值，你将进入该子节点并产生它的元素。注意，`foreach (T item in tree)` 是对子节点的递归调用。\n\n`2.0`\n\n\
  正如在 `CSharpBuiltInTypes` 和 `Pair<T>` 中观察到的那样，你现在可以使用 `foreach` 循环遍历 `BinaryTree<T>`。列表\
  \ 17.17\n\n```\n// JFK\n\nvar jfkFamilyTree = new BinaryTree<string>(\n    \"John\
  \ Fitzgerald Kennedy\")\n{\n    SubItems = new Pair<BinaryTree<string>>(\n     \
  \   new BinaryTree<string>(\"Joseph Patrick Kennedy\")\n        {\n            //\
  \ 祖父母（父系）\n            SubItems = new Pair<BinaryTree<string>>(\n              \
  \  new BinaryTree<string>(\"Patrick Joseph Kennedy\"),\n                new BinaryTree<string>(\"\
  Mary Augusta Hickey\"))\n        },\n        new BinaryTree<string>(\"Rose Elizabeth\
  \ Fitzgerald\")\n        {\n            // 祖父母（母系）\n            SubItems = new Pair<BinaryTree<string>>(\n\
  \                new BinaryTree<string>(\"John Francis Fitzgerald\"),\n        \
  \        new BinaryTree<string>(\"Mary Josephine Hannon\"))\n        })\n};\n\n\
  foreach (string name in jfkFamilyTree)                                   \n{   \
  \                                                                     \n    Console.WriteLine(name);\
  \                                             \n} \n```\n\n**输出 17.6**\n\n点击此处查看代码图像\n\
  \n```\nJohn Fitzgerald Kennedy\nJoseph Patrick Kennedy\nPatrick Joseph Kennedy\n\
  Mary Augusta Hickey\nRose Elizabeth Fitzgerald\nJohn Francis Fitzgerald\nMary Josephine\
  \ Hannon\n```\n\n`2.0`\n\n点击此处查看代码图像\n\n```\njfkFamilyTree.SubItems.First =\n  new\
  \ BinaryTree<string>(\n      \"Joseph Patrick Kennedy\");\n```\n\n问题在于 `SubItems`\
  \ 是类型为 `Pair<T>` 的属性，它是一个 `struct`。因此，当属性返回值时，会创建 `SubItems` 的副本，在语句结束时立即丢失的副本上赋值\
  \ `First` 是具有误导性的。幸运的是，C# 编译器阻止了这种错误。\n\n要解决这个问题，请不要赋值 `First`（参见列表 17.17 中的方法），为\
  \ `Pair<T>` 使用 `class` 而不是 `struct`，不要创建 `SubItems` 属性而改为使用字段，或者在 `BinaryTree<T>`\
  \ 中提供可以直接访问 `SubItems` 成员的属性。\n\n### 取消后续迭代：`yield break`\n\n有时你可能想要取消后续迭代。你可以通过包含一个\
  \ `if` 语句使得不再执行后续语句来实现。然而，你也可以使用 `yield break` 使 `MoveNext()` 返回 `false`，并将控制权返回给调用者并结束循环。列表\
  \ 17.18 展示了此类方法的示例。\n\n`2.0`\n\n**列表 17.18：通过 `yield break` 退出迭代**\n\n点击此处查看代码图像\n\
  \n```\npublic System.Collections.Generic.IEnumerable<T>\n    GetNotNullEnumerator()\n\
  {\n  if((First == null) || (Second == null))                                   \n\
  \  {                                                                         \n\
  \      yield break;                                                          \n\
  \  }                                                                         \n\
  \  yield return Second;\n\n  yield return First;\n}\n```\n\n如果 `Pair<T>` 类中的任一元素为\
  \ `null`，则该方法将取消迭代。`yield break` 语句类似于在确定没有工作要做时，在函数顶部放置 `return` 语句。它是一种在不将所有剩余代码包裹在\
  \ `if` 块中的情况下退出后续迭代的方法。因此，它允许多次退出。请谨慎使用它，因为粗读代码可能会忽略早退的情况。\n\n### 在单个类中创建多个迭代器\n\
  \n之前的迭代器示例实现了 `IEnumerable<T>.GetEnumerator()`，这是 `foreach` 隐式查找的方法。有时你可能需要不同的迭代序列，例如反向迭代、过滤结果或对默认对象投影进行迭代。你可以通过封装在返回\
  \ `IEnumerable<T>` 的属性或方法中在类中声明额外的迭代器。例如，如果你想反向遍历 `Pair<T>` 的元素，你可以提供一个 `GetReverseEnumerator()`\
  \ 方法，如列表 17.20 所示。\n\n\n\n\n\n注意你返回的是 `IEnumerable<T>`，而不是 `IEnumerator<T>`。这与 `IEnumerable<T>.GetEnumerator()`\
  \ 不同，后者返回的是 `IEnumerator<T>`。`Main()` 中的代码演示了如何使用 `foreach` 循环调用 `GetReverseEnumerator()`。\n\
  \n## `yield` 语句的要求\n\n你只能在返回 `IEnumerator<T>` 或 `IEnumerable<T>` 类型（或其非泛型等价类型）的成员中使用\
  \ `yield return` 语句。包含 `yield return` 语句的成员不能有简单的 `return`。如果成员使用了 `yield return`\
  \ 语句，C# 编译器会生成必要的代码来维护迭代器的状态。相比之下，如果成员使用 `return` 语句代替 `yield return`，则程序员需要负责维护自己的状态机，并返回迭代器接口的一个实例。此外，就就像具有返回类型的方法中的所有代码路径必须包含一个带有值的\
  \ `return` 语句（假设它们没有抛出异常）一样，迭代器中的所有代码路径如果要返回任何数据，必须包含一个 `yield return` 语句。\n\n`2.0`\n\
  \n如果违反以下对 `yield` 语句的附加限制，将导致编译器错误：\n\n- `yield` 语句只能出现在方法、用户定义的操作符、或者索引器或属性的 `get`\
  \ 访问器内部。该成员不能带有任何 `ref` 或 `out` 参数。\n- `yield` 语句不能出现在匿名方法或 lambda 表达式的任何地方（参见第\
  \ 13 章）。\n- `yield` 语句不能出现在 `try` 语句的 `catch` 和 `finally` 中。此外，只有在没有 `catch` 块的情况下`yield`\
  \ 语句才能出现在 `try` 中。\n\n### 总结\n\n在本章中，我们回顾了关键集合类，并考虑了它们根据其支持的接口如何分类。每个类都侧重于向集合插入项和从集合中检索项，例如通过键、索引或先进先出（FIFO）或后进先出（LIFO）等机制。我们还探索了如何遍历集合。此外，本章还解释了如何通过自定义迭代器来定义自定义集合，以便遍历集合中的项目。（迭代器涉及一个上下文相关的关键字\
  \ `yield`，C# 使用它来生成实现迭代器模式的底层 CIL 代码。）\n\n在第 18 章中，我们将探索反射，这是一个之前简要提到过的主题，尽管几乎或完全没有进行解释。反射允许我们在运行时检查\
  \ CIL 代码中类型的结构。\n\n` 2.0 结束`\n\n## 18. 反射、属性与动态编程\n\n属性（Attributes）是向程序集中插入额外元数据的一种手段，并将这些元数据与类、方法或属性等编程构造关联起来。本章研究了框架中内置属性的细节，并描述了如何定义自定义属性。为了利用自定义属性的优势，必须识别它们。这是通过反射来实现的。本章将从反射开始，包括你如何使用它根据编译时通过名称（或元数据）对成员的调用，在执行时进行动态绑定。反射经常被用于代码生成器等工具中。此外，当调用目标未知时，会在运行时使用反射。\n\
  \n![一张思维导图表示了反射、属性和动态编程下讨论的话题。](img/18mindmap.jpg)\n\n本章以讨论动态编程结束，这是 C# 4.0 引入的一项功能，极大地简化了处理动态数据以及需要运行时而非编译时绑定的数据的工作。\n\
  \n### 反射\n\n使用反射可以实现以下操作：\n\n- 访问程序内部类型的元数据。这包括完整类型名、成员名称以及修饰该构造的任何属性等构造。\n- 使用元数据在运行时动态调用类型的成员，而不是使用编译时定义的绑定。\n\
  \n反射（Reflection）是检查程序集内部元数据的过程。传统上，当代码编译为机器语言时，关于代码的所有元数据（如类型和方法名）都会被弃。相比之下，当 C#\
  \ 编译为公共中间语言（CIL）时，它保留了关于代码的大部分元数据。此外，使用反射可以遍历程序集中的所有类型，并搜索符合某些标准的类型。你通过 `System.Type`\
  \ 的实例访问类型的元数据，该对象包含了枚举类型实例成员的方法。此外，还可以在被检查的类型的对象上调用这些成员。\n\n反射机制使得许多原本无法实现的新范式成为可能。例如，反射允许你遍历程序集中的所有类型及其成员，并在过程中为程序集\
  \ API 文档创建存根。要创建 API 文档，你可以将从反射获取的元数据与从 XML 注释创建的 XML 文档（使用 `/doc` 选项）相结合。同样，程序员可以使用反射元数据生成将业务对象持久化（序列化）到数据库的代码。它也可以用于显示对象集合的列表控件。给定集合，列表控件可以使用反射遍历集合中对象的所有属性，并为每个属性在列表中定义一列。此外，通过调用每个对象上的每个属性，列表控件可以使用对象中包含的数据填充每一行每一列，即使对象的数据类型在编译时是未知的。\n\
  \n`XmlSerializer`、`ValueType` 和 Microsoft .NET Framework 的 `DataBinder` 是框架中一些使用反射来实现部分实现的类。\n\
  \n### 使用 System.Type 访问元数据\n\n读取类型元数据的关键是获取代表目标类型的 `System.Type` 实例。`System.Type`\
  \ 提供了获取类型信息的方法。你可以使用它回答以下问题：\n\n- 类型名称是什么（`Type.Name`）？\n- 类型是公共的吗（`Type.IsPublic`）？\n\
  - 基类型是什么（`Type.BaseType`）？\n- 类型支持哪些接口（`Type.GetInterfaces()`）？\n- 在哪个程序集中定义（`Type.Assembly`）？\n\
  - 类型的属性、方法、字段等（`Type.GetProperties()`、`Type.GetMethods()`、`Type.GetFields()` 等）？\n\
  - 哪些属性修饰了类型（`Type.GetCustomAttributes()`）？\n\n还有此类成员，但它们都提供了关于特定类型的信息。关键是获取类型 `Type`\
  \ 对象的引用，两种主要方法是通过 `object.GetType()` 和 `typeof()`。\n\n注意 `GetMethods()` 调用不返回扩展方法。这些方法仅作为实现类型的静态成员可用。\n\
  \n##### GetType()\n\n`object` 包含一个 `GetType()` 成员，因此所有类型都包含此函数。你调用 `GetType()` 来获取与原始对象对应的\
  \ `System.Type` 实例。列表 18.1 演示了这一过程，使用了 `DateTime` 的 `Type` 实例。输出 18.1 显示了结果。\n\n\
  **列表 18.1：使用 Type.GetProperties() 获取对象的公共属性**\n\n点击此处查看代码图像\n\n\n\n\n\n```\nDateTime\
  \ dateTime = new DateTime();\n\nType type = dateTime.GetType();\n\nforeach (\n\n\
  \    System.Reflection.PropertyInfo property in\n\n        type.GetProperties())\n\
  \n{\n\n    Console.WriteLine(property.Name);\n}\n```\n\n**输出 18.1**\n\n```\nDate\n\
  \nDay\n\nDayOfWeek\n\nDayOfYear\n\nHour\n\nKind\n\nMillisecond\n\nMinute\n\nMonth\n\
  \nNow\n\nUtcNow\n\nSecond\n\nTicks\n\nTimeOfDay\n\nToday\n\nYear\n```\n\n在调用 `GetType()`\
  \ 后，你遍历了 `Type.GetProperties()` 返回的每个 `System.Reflection.PropertyInfo` 实例并显示了属性名称。调用\
  \ `GetType()` 的关键在于你必须有一个对象实例。然而，有时无法获得此类实例。例如，静态类无法被实例化，因此没有办法对它们调用 `GetType()`。\n\
  \n### `typeof()`\n\n获取 `Type` 对象的另一种方法是使用 `typeof` 表达式。`typeof` 在编译时绑定到特定的 `Type`\
  \ 实例，并直接将类型作为参数。异常情况是泛型类型上的类型参数，因为它在运行时才被确定。列表 18.2 展示了在 `Enum.Parse()` 使用 `typeof`。\n\
  \n**列表 18.2：使用 `typeof()` 创建 `System.Type` 实例**\n\n点击此处查看代码图片\n\n```\nusing System.Diagnostics;\n\
  \n// ...\n\n    ThreadPriorityLevel priority;\n\n    priority = (ThreadPriorityLevel)Enum.Parse(\n\
  \n            typeof(ThreadPriorityLevel), \"Idle\");\n\n// ...\n```\n\n在此列表中，`Enum.Parse()`\
  \ 接收一个标识枚举的 `Type` 对象，然后将字符串转换为特定的枚举值。在这种情况下，它将 `\"Idle\"` 转换为 `System.Diagnostics.ThreadPriorityLevel.Idle`。\n\
  \n同样，下一节中的列表 18.3 在 `CompareTo(object obj)` 方法内部使用了 `typeof` 表达式，以验证 `obj` 参数的类型确实是所预期的：\n\
  \n点击此处查看代码图片\n\n```\nif(obj.GetType() != typeof(Contact)) { ... }\n```\n\n`typeof`\
  \ 表达式在编译时解析，因此类型比较——例如比较调用 `GetType()` 返回的类型——可以判断一个对象是否为特定类型。\n\n### 成员调用\n\n反射的可能性并不仅于获取元数据。你还可以获取元数据并动态调用它所标识的成员。考虑定义一个类来表示应用程序的命令行的情况^(1)\
  \ 像这样的 `CommandLineInfo` 类的困难之处在于用启动应用程序的实际命令行数据来填充该类。然而，通过反射，你可以将命令行选项映射到属性名称，然后在运行时动态设置这些属性。列表\
  \ 18.3 展示了这一过程。\n\n1。.NET Standard 1.6 增加了 `CommandLineUtils NuGet` 包，该包也提供了一种命令行解析机制。有关更多信息，请参阅我在该主题上的\
  \ [`itl.tc/sept2016`](http://itl.tc/sept2016) 的 MSDN 文章。\n\n**列表 18.3：动态调用成员**\n\
  \n点击此处查看代码图片\n\n\n\n\n```csharp\nusing System;\n\nusing System.Diagnostics;\n\n\
  public partial class Program\n{\n\npublic static void Main(string[] args)\n  {\n\
  \      CommandLineInfo commandLine = new CommandLineInfo();\n      if (!CommandLineHandler.TryParse(\n\
  \          args, commandLine, out string? errorMessage))\n      {\n          Console.WriteLine(errorMessage);\n\
  \          DisplayHelp();\n      }\n      if (commandLine.Help)\n      {\n     \
  \     DisplayHelp();\n      }\n      else\n      {\n          if (commandLine.Priority\
  \ !=\n              ProcessPriorityClass.Normal)\n          {\n              //\
  \ Change thread priority\n          }\n      }\n      // ...\n  }\n  private static\
  \ void DisplayHelp()\n  {\n      // Display the command-line help\n      Console.WriteLine(\n\
  \                \"Compress.exe /Out:<filename> /Help \\n\"\n                + \"\
  /Priority:RealTime|High|\"\n                + \"AboveNormal|Normal|BelowNormal|Idle\"\
  );\n  }\n}\n\nusing System;\n\nusing System.Diagnostics;\npublic partial class Program\n\
  {\n  private class CommandLineInfo\n  {\n      public bool Help { get; set; }\n\
  \      public string? Out { get; set; }\n      public ProcessPriorityClass Priority\
  \ { get; set; }\n          = ProcessPriorityClass.Normal;\n  }\n}\n\nusing System;\n\
  \nusing System.Diagnostics;\nusing System.IO;\nusing System.Reflection;\npublic\
  \ class CommandLineHandler\n{\n  public static void Parse(string[] args, object\
  \ commandLine)\n  {\n      if (!TryParse(args, commandLine, out string? errorMessage))\n\
  \      {\n          throw new InvalidOperationException(errorMessage);\n      }\n\
  \  }\n  public static bool TryParse(string[] args, object commandLine,\n      out\
  \ string? errorMessage)\n  {\n      bool success = false;\n      errorMessage =\
  \ null;\n      foreach (string arg in args)\n      {\n          string option;\n\
  \          if (arg[0] == '/' || arg[0] == '-')\n          {\n              string[]\
  \ optionParts = arg.Split(\n                  new char[] { ':' }, 2);\n        \
  \      // Remove the slash|dash\n              option = optionParts[0].Remove(0,\
  \ 1);\n              PropertyInfo? property =                                  \
  \       \n                  commandLine.GetType().GetProperty(option,          \
  \          \n                      BindingFlags.IgnoreCase |                   \
  \             \n                      BindingFlags.Instance |                  \
  \                \n                      BindingFlags.Public);                 \
  \                   \n              if (property != null)                      \
  \                      \n              {                                       \
  \                         \n                  if (property.PropertyType == typeof(bool))\
  \                   \n                  {                                      \
  \                      \n                      // Last parameters for handling indexers\
  \                 \n                      property.SetValue(                   \
  \                    \n                          commandLine, true, null);     \
  \                       \n                      success = true;                \
  \                          \n                  }                               \
  \                             \n                  else if (                    \
  \                                \n                      property.PropertyType ==\
  \ typeof(string))                 \n                  {                        \
  \                                    \n                      property.SetValue(\
  \                                       \n                          commandLine,\
  \ optionParts[1], null);                  \n                      success = true;\
  \                                          \n                  }               \
  \                                             \n                  else if (    \
  \                                                \n                      // property.PropertyType.IsEnum\
  \ also available           \n                      property.PropertyType ==    \
  \                             \n                          typeof(ProcessPriorityClass))\
  \                        \n                  {                                 \
  \                           \n                      try                        \
  \                              \n                      {                       \
  \                                 \n                          property.SetValue(commandLine,\
  \                       \n                              Enum.Parse(            \
  \                          \n                                  typeof(ProcessPriorityClass),\
  \                \n                                  optionParts[1], true),    \
  \                   \n                              null);                     \
  \                      \n                          success = true;             \
  \                         \n                      }                            \
  \                            \n                      catch (ArgumentException )\n\
  \                      {\n                          success = false;\n         \
  \                 errorMessage =\n                                errorMessage =\n\
  \                                    $@\"The option '{\n                       \
  \                 optionParts[1]\n                                        }' is\
  \ invalid for '{\n                                        option }'\";\n       \
  \               }\n                  }\n                  else\n               \
  \   {\n                      success = false;\n                            errorMessage\
  \ =\n                                $@\"Data type '{\n                        \
  \            property.PropertyType\n                                    }' on {\n\
  \                                    commandLine.GetType()\n                   \
  \                 } is not supported.\"\n                  }\n              }\n\
  \              else\n              {\n                  success = false;\n     \
  \                   errorMessage =\n                           $\"Option '{ option\
  \ }' is not supported.\";\n              }\n          }\n      }\n      return success;\n\
  \  }\n}\n```\n\n虽然列表 18.3 篇幅很长，但代码相对简单。`Main()` 从实例化 `CommandLineInfo` 类开始。该类型专门定义，用于包含此程序的命令行数据。每个属性对应于程序的一个命令行选项，其中命令行格式如输出\
  \ 18.2 所示。\n\n**输出 18.2**\n\n点击此处查看代码图像\n\n```\nCompress.exe /Out:<file name> /Help\n\
  \n/Priority:RealTime|High|AboveNormal|Normal|BelowNormal|Idle\n```\n\n`CommandLineInfo`\
  \ 对象被传递给 `CommandLineHandler` 的 `TryParse()` 方法。该方法首先遍历每个选项并分离出选项名称（例如 `Help` 或\
  \ `Out`）。一旦确定了名称，代码就会对 `CommandLineInfo` 对象进行反射，寻找具有相同名称的实例属性。如果找到了该属性，它将调用 `SetValue()`\
  \ 为该属性赋值，并指定与属性类型对应的数据。（对于参数，此调用接收要设置值的对象、新值，以及一个额外的 `index` 参数，除非该属性是索引器，否则该参数为\
  \ `null`。）此列表处理了三种属性类型：布尔、字符串和枚举。在枚举的情况下，你解析选项值并将文本对应的枚举等值分配给属性。假设 `TryParse()`\
  \ 调用成功，方法退出，`CommandLineInfo` 对象将使用命令行数据完成初始化。\n\n\n\n\n\n有趣的是，尽管 `CommandLineInfo`\
  \ 是嵌套在 `Program` 内部的私有类，但 `CommandLineHandler` 在对其进行反射时并没有困难，甚至可以调用它的成员。换句话说，只要建立了适当的权限，反射就可以绕过访问性规则。例如，如果\
  \ `Out` 是私有的，`TryParse()` 方法仍然可以给它赋值。正因如此，可以将 `CommandLineHandler` 移动到单独的程序集中多个程序之间共享，每个程序都有它们自己的\
  \ `CommandLineInfo` 类。\n\n在例例中，你使用 `PropertyInfo.SetValue()` 调用了 `CommandLineInfo`\
  \ 上的一个成员。意料不足的是，`PropertyInfo` 也包含一个 `GetValue()` 方法用于从属性检索数据。然而，对于方法，有一个 `MethodInfo`\
  \ 类带有 `Invoke()` 成员。`MethodInfo` 和 `PropertyInfo` 都派生自 `MemberInfo`（尽管是间接的），如图 18.1\n\
  \n**图 18.1：`MemberInfo` 派生类**\n\n#### 泛型类型的反射\n\n`开始 2.0`\n\n通用语言运行时 (CLR) 2.0 版本中泛型类型的引入使得额外的反射特性变得必要。泛型的运行时反射决定类或方法是否包含泛型类型以及它可能包含的任何类型参数或参数。\n\
  \n##### 确定类型参数的类型\n\n就像你可以对非泛型类型使用 `typeof` 运算符来获取 `System.Type` 实例一样，你也可以对泛型类型或泛型方法中的类型参数使用\
  \ `typeof` 运算符。列表 18.4 将 `typeof` 运算符应用于 `Stack` 类中 `Add` 方法的类型参数。\n\n**列表 18.4：声明\
  \ `Stack<T>` 类**\n\n点击此处查看代码图像\n\n```\npublic class Stack<T>\n{\n    // ...\n  \
  \  public void Add(T i)\n    {\n        // ...\n        Type t = typeof(T);\n  \
  \      // ...\n    }\n    // ...\n}\n```\n\n一旦你拥有类型参数的 `Type` 对象实例，你就可以对类型参数本身进行反射，以确定其行为并更有效地为特定类型定制\
  \ `Add` 方法。\n\n##### 确定类或方法是否支持泛型\n\n在 CLR 2.0 版本的 `System.Type` 类中，增加了一些用于确定给定类型是否支持泛型参数参数的方法。泛型参数是在实例化泛型类时提供的类型参数。你可以通过查询\
  \ `Type.ContainsGenericParameters` 属性来确定类或方法是否包含尚未设置的泛型参数，如列表 18.5 所示。\n\n**列表 18.5：使用泛型的反射**\n\
  \n点击此处查看代码图像\n\n```\nusing System;\n\npublic class Program\n{\n  static void Main()\n\
  \  {\n      Type type = typeof(System.Nullable<>);\n      Console.WriteLine(type.ContainsGenericParameters);\n\
  \      Console.WriteLine(type.IsGenericType);\n      type = typeof(System.Nullable<DateTime>);\n\
  \      Console.WriteLine(type.ContainsGenericParameters);\n      Console.WriteLine(type.IsGenericType);\n\
  \  }\n}\n```\n\n输出 18.3 显示了列表 18.5 的结果。\n\n**输出 18.3**\n\n```\nTrue\nTrue\nFalse\n\
  True\n```\n\n`Type.IsGenericType` 是一个布尔属性，用于评估一个类型是否为泛型。\n\n##### 获取泛型类或方法的类型参数\n\
  \n你可以通过调用 `GetGenericArguments()` 方法从泛型类获取泛型参数或类型参数的列表。结果是 `System.Type` 实例数组，对应于它们作为泛型类类型参数时声明的顺序。列表\
  \ 18.6 对泛型类型进行反射并获取每个类型参数；输出 18.4 显示了结果。\n\n`2.0`\n\n**列表 18.6：使用泛型使用反射**\n\n点击此处查看代码图像\n\
  \n```\nusing System;\nusing System.Collections.Generic;\npublic partial class Program\n\
  {\n  public static void Main()\n  {\n      Stack<int> s = new Stack<int>();\n  \
  \    Type t = s.GetType();\n      foreach(Type type in t.GetGenericArguments())\n\
  \      {\n          System.Console.WriteLine(\n              \"Type parameter: \"\
  \ + type.FullName);\n      }\n      // ...\n  }\n}\n```\n\n**输出 18.4**\n\n```\n\
  Type parameter: System.Int32\n```\n\n`结束 2.0` `开始 6.0`\n\n### `nameof` 运算符\n\n我们在第\
  \ 11 章中简要提到过 `nameof` 运算符。这个 C# 6.0 引入的关键字会产生一个包含指定程序元素未限定名称的常量字符串。在这种情况下，`nameof(textDigit)`\
  \ 返回“textDigit”。\n\n你可能会问，使用 `nameof(textDigit)` 相比于直接使用 `\"textDigit\"` 有什么优势（特别是考虑到后者似乎可能更容易用）。优势有两点：\n\
  \n-   C# 编译器确保 `nameof` 的参数确实是一个有效的程序元素。这防止了当程序元素名称更改时发生错误，防止了拼写错误等。\n-   IDE 工具对\
  \ `nameof` 的工作效果比对字面量字符串更好。例如，“查找所有引用”工具将找到在 `nameof` 中提到但在字面量字符串中未提到的程序元素。自动重命名重构也有效，等等等。\n\
  \n在之前给出的代码段中，`nameof(textDigit)` 生成了参数名称。实际上，`nameof` 运算符适用于任何程序元素。例如，列表 18.7 使用\
  \ `nameof` 将属性名称传递给 `INotifyPropertyChanged.PropertyChanged`。\n\n**列表 18.7：动态调用成员**\n\
  \n点击此处查看代码图像\n\n```\nusing System;\nusing System.ComponentModel;\n\npublic class\
  \ Person : INotifyPropertyChanged\n{\n    public event PropertyChangedEventHandler\
  \ PropertyChanged;\n\n    public Person(string name)\n    {\n        Name = name;\n\
  \    }\n\n    private string _Name = string.Empty;\n    public string Name\n   \
  \ {\n        get { return _Name; }\n        set\n        {\n            if (_Name\
  \ != value)\n            {\n                _Name = value;\n                // 使用\
  \ C# 6.0 条件空引用\n                PropertyChanged?.Invoke(\n                    this,\n\
  \                    new PropertyChangedEventArgs(                       \n    \
  \                    nameof(Name)));                                 \n        \
  \    }\n        }\n    }\n    // ...\n}\n```\n\n无论只提供未限定的“Name”（因为它在作用范围内）还是使用完全（或部分）限定名称如\
  \ `Person.Name`，结果都是最后的标识符（点点名称中的最后一个元素）。你仍然可以使用 C# 5.0 的 `CallerMemberName` 参数属性来获取属性名称；请参阅示例\
  \ [`itl.tc/CallerMemberName`](http://itl.tc/CallerMemberName)。\n\n`结束 6.0`\n\n###\
  \ 特性\n\n\n\n\n\n在深入探讨如何编写属性的细节之前，我们应该考虑一个展示它们用处的用例。在列表 18.3 中的 `CommandLineHandler`\
  \ 示例中，你根据与属性名匹配的命令行选项动态地设置类的属性。然而，当命令行选项是一个无效的属性名时，这种方法就不够用了。例如，无法支持命令行选项 `/?`。此外，这种机制没有提供任何方法识别哪些选项是必选的、哪些是真正可选的。\n\
  \n与其依赖选项名称与属性名之间的精确匹配，你也可以使用属性来识别有关被装饰构造体的额外元数据——在此情况下，即被属性装饰的选项。通过属性，你可以将一个属性标记为\
  \ `Required`，并提供一个 `/?` 选项别名。换句话说，属性是将附加数据与属性（以及其他构造体）关联的手段。\n\n属性出现在其被装饰的构造体之前的方括号中。例如，你可以修改\
  \ `CommandLineInfo` 类以包含属性，如列表 18.8 所示。\n\n#### 列表 18.8：使用属性装饰属性\n\n点击此处查看代码图像\n\
  \n```\nclass CommandLineInfo\n{\n  [CommandLineSwitchAlias(\"?\")]             \
  \                  \n  public bool Help { get; set; }\n\n  [CommandLineSwitchRequired]\
  \                                 \n  public string? Out { get; set; }\n\n  public\
  \ System.Diagnostics.ProcessPriorityClass Priority\n      { get; set; } =\n    \
  \      System.Diagnostics.ProcessPriorityClass.Normal;\n}\n```\n\n在列表 18.8 中，`Help`\
  \ 和 `Out` 属性被属性装饰。这些属性有两个用途：它们允许为 `/Help` 提供 `/?` 别名，并且指示 `/Out` 是必选参数。其核心思想是在 `CommandLineHandler.TryParse()`\
  \ 方法内部，你启用对选项别名的支持，并在假设解析成功的情况下，检查所有必选开关都已指定。\n\n属性可以以两种方式与同一个构造体关联。首先，你可以在同一个方括号内用逗号分隔多个属性。或者，你可以将每个属性放在它自己的方括号内。列表\
  \ 18.9 提供了示例。\n\n#### 列表 18.9：使用多个属性装饰属性\n\n点击此处查看代码图像\n\n```\n [CommandLineSwitchRequired]\n\
  \  [CommandLineSwitchAlias(\"FileName\")]\n  public string? Out { get; set; }\n\n\
  \  [CommandLineSwitchRequired,\n  CommandLineSwitchAlias(\"FileName\")]\n  public\
  \ string Out { get; set; }\n```\n\n除了装饰属性外，开发者还可以使用属性来装饰程序集、类、构造函数、委托、枚举、事件、字段、泛型参数、接口、方法、模块、参数、属性、返回值和结构体。对于这些大多数情况，应用属性涉及与列表\
  \ 18.9 所示相同的方括号语法。然而，这种语法对于返回集、程序集和模块并不适用。\n\n程序集属性用于添加有关程序集的元数据。例如，Visual Studio\
  \ 用于 .NET Framework 项目的项目向导（但不适用于 .NET Core 生成的项目）会生成一个 `AssemblyInfo.cs` 文件，其中包含许多关于程序集的属性。列表\
  \ 18.10 是此类文件的示例。\n\n#### 列表 18.10：`AssemblyInfo.cs` 中的程序集属性\n\n点击此处查看代码图像\n\n```\n\
  using System.Reflection;\nusing System.Runtime.CompilerServices;\nusing System.Runtime.InteropServices;\n\
  \n// 程序集的一用信息通过\n// 以下属性集控制。更改这些\n// 属性值以修改与\n// 程序集相关的信息\n[assembly: AssemblyTitle(\"\
  CompressionLibrary\")]\n[assembly: AssemblyDescription(\"\")]\n[assembly: AssemblyConfiguration(\"\
  \")]\n[assembly: AssemblyCompany(\"IntelliTect\")]\n[assembly: AssemblyProduct(\"\
  Compression Library\")]\n[assembly: AssemblyCopyright(\"Copyright© IntelliTect 2006-2018\"\
  )]\n[assembly: AssemblyTrademark(\"\")]\n[assembly: AssemblyCulture(\"\")]\n\n//\
  \ 将 ComVisible 设置为 false 会使此\n// 程序集中的类型对 COM 组件不可见。如果你需要\n// 从 COM 访问此程序集中的类型，请将该\n\
  // 类型上的 ComVisible 属性设置为 true。\n[assembly: ComVisible(false)]\n// 以下 GUID 用于类型库的\
  \ ID，\n// 如果此项目暴露给 COM\n[assembly: Guid(\"417a9609-24ae-4323-b1d6-cef0f87a42c3\"\
  )]\n// 程序集的版本信息由\n// 以下四个值组成：\n//\n//      主版本号\n//      次要版本号\n//      生成版本号\n\
  //      修订号\n//\n// 你可以指定所有值，也可以\n// 使用下方的 '*' 将修订号和\n// 生成版本号设为默认值，如下所示：\n// [assembly:\
  \ AssemblyVersion(\"1.0.*\")]\n[assembly: AssemblyVersion(\"1.0.0.0\")]\n```\n\n\
  `assembly` 属性定义了公司、产品和版本号等内容。基于 .NET Core 的项目不再生成 `AssemblyInfo.cs` 文件，而是允许在 `*.csproj`\
  \ 文件中指定程序集信息。例如，列表 18.12 在编译时向程序集注入相应的程序集属性。\n\n除了 `assembly:` 和 `return:` 之外，C#\
  \ 允许对显式目标标识 `module:`、`class:` 和 `method:`，分别对应装饰模块、类和方法的属性。然而，如前所述，`class:` 和 `method:`\
  \ 是可选的。\n\n使用属性的一个便利之处是语言考虑了属性的命名规范，该规范要求在名称末尾出现 `Attribute`。然而，在之前所有的属性使用中，都没有出现这种后缀，尽管每个属性都遵循了命名规范。这是因为在应用属性时可以使用全名（如\
  \ `DescriptionAttribute`、`AssemblyVersionAttribute` 等），但 C# 使该后缀变为可选。通常，在应用属性时不会出现这种后缀；只有在定义属性或内联使用（例如\
  \ `typeof(DescriptionAttribute)`）时才会出现。\n\n返回值属性（如列表 18.11 所示）出现在方法声明之前，但使用了相同的类型结构。\n\
  \n#### 列表 18.11：指定返回值属性\n\n点击此处查看代码图像\n\n```\n[return: Description(\n    \"如果对象处于有效状态，则返回\
  \ true.\")]\npublic bool IsValid()\n{\n  // ...\n  return true;\n}\n```\n\n\n\n\n\
  \n这些内容会被转换为生成的 CIL，如输出 18.5 所示。\n\n## 输出 18.5\n\n点击此处查看代码图像\n\n```\n[assembly: AssemblyCompany(\"\
  Addison Wesley\")]\n\n[assembly: AssemblyCopyright(\"Copyright © Addison Wesley\
  \ 2020\")]\n\n[assembly: AssemblyFileVersion(\"8.0.0.0\")]\n\n[assembly: AssemblyInformationalVersion(\"\
  8.0\")]\n\n[assembly: AssemblyProduct(\"Essential C# 8.0\")]\n\n[assembly: AssemblyVersion(\"\
  8.0.0.0\")]\n```\n\n### 自定义属性\n\n定义自定义属性相对简单。属性是对象；因此，要定义一个属性，你需要定义一个类。将普通类转换为属性的特征是它派生自\
  \ `System.Attribute`。因此，你可以创建一个 `CommandLineSwitchRequiredAttribute` 类，如列表 18.13\
  \ 所示。\n\n#### 列表 18.13: 定义自定义属性\n\n点击此处查看代码图像\n\n```c\npublic class CommandLineSwitchRequiredAttribute\
  \ : Attribute\n\n{\n\n}\n```\n\n有了这个简单的定义，你现在就可以像列表 18.8 所示那样使用该属性。到目前为止，还没有代码对该属性做出响应；因此，包含该属性的\
  \ `Out` 属性对命令行解析没有影响。\n\n#### 查找属性\n\n除了为反射类型成员提供属性外，`Type` 还包含了用于检索修饰该类型的 `Attribute`\
  \ 的方法。同样，所有的反射类型（例如 `PropertyInfo` 和 `MethodInfo`）都包含了用于检索修饰类型属性列表的成员。列表 18.14 定义了一个方法，返回命令行中缺失的必要开关列表。\n\
  \n#### 列表 18.14: 获取自定义属性\n\n点击此处查看代码图像\n\n```c\nusing System;\n\nusing System.Collections.Specialized;\n\
  \nusing System.Reflection;\n\npublic class CommandLineSwitchRequiredAttribute :\
  \ Attribute\n\n{\n\n  public static string[] GetMissingRequiredOptions(\n\n    \
  \  object commandLine)\n\n  {\n      List<string> missingOptions = new List<string>();\n\
  \n      PropertyInfo[] properties =\n\n          commandLine.GetType().GetProperties();\n\
  \n      foreach (PropertyInfo property in properties)\n      {\n\n          Attribute[]\
  \ attributes =\n\n               (Attribute[])property.GetCustomAttributes(\n  \
  \                typeof(CommandLineSwitchRequiredAttribute),\n                 \
  \ false);\n          if (attributes.Length > 0 &&\n              property.GetValue(commandLine,\
  \ null) == null)\n          {\n\n              missingOptions.Add(property.Name);\n\
  \          }\n\n      }\n\n      return missingOptions.ToArray();\n  }\n}\n```\n\
  \n检查属性的代码相对简单。给定一个 `PropertyInfo` 对象（通过反射获取），你调用 `GetCustomAttributes()` 并指定要查找的属性，然后指示是否检查任何重载方法。（另一种方法是，你可以调用不带属性类型的\
  \ `GetCustomAttributes()` 方法来返回所有属性。）\n\n虽然可以直接在 `CommandLineHandler` 的代码中放置查找 `CommandLineSwitchRequiredAttribute`\
  \ 属性的代码，但将代码放在 `CommandLineSwitchRequiredAttribute` 类本身会实现更好的对象封装。这通常是自定义属性的模式。将查找属性的代码放在属性类的静态方法中，还有比这儿更好的位置呢？\n\
  \n### 通过构造函数初始化属性\n\n对 `GetCustomAttributes()` 的调用返回一个对象数组，该数组可以转换为 `Attribute`\
  \ 数组。由于我们示例中的属性没有任何实例成员，因此它在返回的属性中提供的唯一元数据信息是它是否出现。然而，属性也可以封装数据。列表 18.15 定义了一个 `CommandLineAliasAttribute`\
  \ 属性——这是一种提供别名命令行选项的自定义属性。例如，你可以为 `/Help` 或 `/?` 提供简写形式的命令行支持。同样，`/S` 可以作为 `/Subfolders`\
  \ 的别名，指示命令应该遍历所有子目录。\n\n#### 列表 18.15: 提供属性构造函数\n\n点击此处查看代码图像\n\n```c\npublic class\
  \ CommandLineSwitchAliasAttribute : Attribute\n\n{\n\n  public CommandLineSwitchAliasAttribute(string\
  \ alias)          \n  {                                                        \
  \       \n      Alias = alias;                                              \n \
  \ }                                                               \n  public string\
  \ Alias { get; }\n}\n\nclass CommandLineInfo\n\n{\n\n  [CommandLineSwitchAlias(\"\
  ?\")]                                   \n  public bool Help { get; set; }\n\n \
  \ // ...\n}\n```\n\n为了支持此功能，你需要为属性提供构造函数。具体来说，对于别名，你需要一个接受字符串参数的构造函数。（同样，如果你想允许多个别名，你需要定义一个具有\
  \ `params string` 数组参数的属性。）\n\n在将属性应用于结构时，只允许常量值和 `typeof()` 表达式作为参数。需要这一约束是为了将它们序列化到生成的\
  \ CIL 中。这意味着属性构造函数需要适当的类型；创建一个接受 `System.DateTime` 参数的构造函数是没有意义，因为 C# 中没有 `System.DateTime`\
  \ 常量。从 `PropertyInfo.GetCustomAttributes()` 返回的对象将使用指定的构造函数进行初始化，如列表 18.16 所示。\n\
  \n#### 列表 18.16: 获取特定属性并检查其初始化\n\n点击此处查看代码图像\n\n```c\nPropertyInfo property =\n\
  \    typeof(CommandLineInfo).GetProperty(\"Help\");\n\nCommandLineSwitchAliasAttribute\
  \ attribute =\n    (CommandLineSwitchAliasAttribute)\n        property.GetCustomAttribute(\n\
  \        typeof(CommandLineSwitchAliasAttribute), false);\n\nif(attribute?.Alias\
  \ == \"?\")\n{\n  Console.WriteLine(\"Help(?)\");\n}\n```\n\n此外，如列表 18.17 和 18 所示，可以在\
  \ `CommandLineAliasAttribute` 的 `GetSwitches()` 方法中使用类似的代码，返回一个包含所有开关（包括属性名称）的字典集合，并将每个名称与命令行对象上的对应属性关联。\n\
  \n\n\n\n\n# 列表 18.18：更新 `CommandLineHandler.TryParse()` 以处理别名\n\n点击此处查看代码图像\n\n\
