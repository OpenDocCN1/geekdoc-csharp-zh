  \ 8)\n```\n\n`5.0`\n\n列表 20.9 中的代码在 `OnEvent()` 内部的 `await Task.Run()` 调用之前是按过程执行的。完成后，控制权传递给\
  \ `AsyncSynchronizationContext` 中的 `Post()` 方法。在 `Post()` 调执行并完成后，`Console.WriteLine(\"\
  throw Exception...\")` 方法执行，然后抛出一个异常。该异常被 `AsyncSynchronizationContext.Post()` 方法捕获。\n\
  \n在现实世界中，如 第 22 章 所示，`ResetEventSlim` 将是首选方法。\n\n### 异步 Lambda 表达式和本地函数\n\n正如转换为委托的\
  \ Lambda 表达式可以作为声明普通方法的简洁语法，C# 5.0（及更高版本）也允许包含 `await` 表达式的 Lambda 转换为委托。要这样做，只需在\
  \ Lambda 表达式之前加上 `async` 关键字即可。在 列表 20.10 中，我们首先将一个 `async` Lambda 赋值给变量 `Func<string,\
  \ Task> writeWebRequestAsync`。然后我们使用 `await` 运算符来调用它。\n\n#### 列表 20.10：作为 Lambda\
  \ 表达式的异步客户端服务器交互\n\n点击此处查看代码图像\n\n```\nusing System;\n\nusing System.IO;\n\nusing\
  \ System.Net;\nusing System.Linq;\nusing System.Threading.Tasks;\n\npublic class\
  \ Program\n\n{\n  public static void Main(string[] args)\n  {\n      string url\
  \ = \"http://www.IntelliT.com\";\n      if(args.Length > 0)\n      {\n         \
  \ url = args[0];\n      }\n      Console.Write(url);\n      Func<string, Task> writeWebRequestAsync\
  \ =\n          async (string webRequestUrl) =>\n          {\n              // 为了阐明省略了错误处理\n\
  \              WebRequest webRequest =\n                  WebRequest.Create(url);\n\
  \              WebResponse response =\n                  await webRequest.GetResponseAsync();\n\
  \              // 显式计数而不是调用\n              // webRequest.ContentLength 以演示\n   \
  \           // 多个 await 运算符\n              using(StreamReader reader =\n       \
  \           new StreamReader(\n                      response.GetResponseStream()))\n\
  \              {\n                  string text =\n                      (await\
  \ reader.ReadToEndAsync());\n                  Console.WriteLine(\n            \
  \          FormatBytes(text.Length));\n              }\n          };\n\n      Task\
  \ task = writeWebRequestAsync(url);                      \n      while (!task.Wait(100))\n\
  \      {\n          Console.Write(\".\");\n      }\n  }\n\n  // ...\n}\n```\n\n\
  `5.0` `4.0`\n\n同样，在 C# 7.0 或更高版本中可以使用本地函数实现相同的效果。例如，在 列表 20.10 中，你可以将 Lambda 表达式头部（直到并包括\
  \ `=>` 运算符的所有内容）更改为点击此处查看代码图像\n\n```\nasync Task WriteWebRequestSizeAsync(string\
  \ webRequestUrl)\n```\n\n保持体内的所有内容（包括大括号）不变。\n\n\n\n\n注意 `async` lambda 表达式与具名 `async`\
  \ 方法具有相同的限制：\n\n*   `async` lambda 表达式必须转换为委托程序，其返回类型必须是有效的异步返回类型。\n*   lambda 表达式会被重写，使得\
  \ `return` 语句变为一种信号，表示 lambda 返回的任务已使用给定的结果完成。\n*   lambda 表达式内部的执行是同步进行的，直到在对未完成的可等待对象上执行了第一个\
  \ `await` 为止。\n*   `await` 之后的所有指令将在调用的异步方法返回时作为延续任务（continuations）执行（或者如果可等待对象已完成，则将直接同步执行，而不是作为延续任务）。\n\
  *   `async` lambda 表达式可以使用 `await` 算符进行调用（在 Listing 20.10 中未显示）。\n\n`End 7.0` `5.0`\
  \ `5.0` `4.0`\n\n要准确理解 `async` 方法中发生的运作可能很困难，但这比试图弄懂使用显式延续体在 lambda 中编写的异步代码在做什么要容易得多。需要记住的关键点如下：\n\
  \n*   当控制权到达 `await` 关键字时，紧随其后的表达式会产生一个任务。(6) 控制权随后返回给调用者，以便在任务异步完成时（假设它尚未完成），调用者可以继续工作。\n\
  \    6。从技术上讲，它是一个可等待类型，正如“高级主题：有效的异步返回类型扩展”中所述。\n*   在任务完成一段时间后，控制权将在 `await` 之后的点恢复。如果等待的任务产生了结果，则获取该结果。如果它发生故障，则会抛出异常。\n\
  *   `async` 方法中的 `return` 语句会导致与方法调用关联的任务变为完成；如果 `return` 语句有值，则返回的值将成为任务的结果。\n\n\
  `5.0`\n\n### 任务调度器与同步上下文（Synchronization Context）\n\n本章偶尔会提到任务调度器及其在决定如何高效将工作分配给线程方面的作用。在程序设计上，任务调度器是\
  \ `System.Threading.Tasks.TaskScheduler` 的一个实例。该类默认使用线程池来恰当地调度任务，决定如何安全且高效地执行它们——何时重用它们、销毁它们或创建额外的任务。\n\
  \n你可以通过从 `TaskScheduler` 类派生出新类型，创建自己的任务调度器，并对如何调度任务做出不同的选择。你可以使用静态方法 `FromCurrentSynchronizationContext()`。(7)\
  \ 获取一个将任务调度到当前线程（或更准确地说，调度到与当前线程关联的 `synchronization context`）而不是不同工作线程的 `TaskScheduler`。\n\
  \n`4.0`\n\n7。示例，请参阅 *C# 5.0 之前的多线程模式* 中的 Listing C.8，可用地址为 [`IntelliTect.com/EssentialCSharp5`](https://IntelliTect.com/EssentialCSharp5)。\n\
  \n任务执行的同步上下文以及随后的延续任务执行的同步上下文是重要的，因为等待等待的任务会查询同步上下文（假设存在），以便任务能够高效且安全地执行。Listing\
  \ 20.13（以及 Output 20.3）与 Listing 19.3 类似，但它在显示消息时还会打印线程 ID。\n\n`5.0`\n\n**Listing\
  \ 20.13: 调用 `Task.ContinueWith()`**\n\n点击此处查看代码图像\n\n```\nusing System;\n\nusing\
  \ System.Threading;\n\nusing System.Threading.Tasks;\n\npublic class Program\n{\n\
  \n  public static void Main()\n  {\n      DisplayStatus(\"Before\");\n\n      Task\
  \ taskA =\n\n          Task.Run(() =>\n\n               DisplayStatus(\"Starting...\"\
  ))\n          .ContinueWith( antecedent =>\n\n               DisplayStatus(\"Continuing\
  \ A...\"));\n\n      Task taskB = taskA.ContinueWith( antecedent =>\n          DisplayStatus(\"\
  Continuing B...\"));\n\n      Task taskC = taskA.ContinueWith( antecedent =>\n \
  \         DisplayStatus(\"Continuing C...\"));\n\n      Task.WaitAll(taskB, taskC);\n\
  \n      DisplayStatus(\"Finished!\");\n\n  }\n\n  private static void DisplayStatus(string\
  \ message)\n  {\n      string text = string.Format(\n              $@\"{ Thread.CurrentThread.ManagedThreadId\n\
  \                  }: { message }\");\n      Console.WriteLine(text);\n  }\n\n}\n\
  ```\n\n`4.0`\n\n**Output 20.3**\n\n```\n1: Before\n\n3: Starting...\n\n4: Continuing\
  \ A...\n\n3: Continuing C...\n\n4: Continuing B...\n\n1: Finished!\n```\n\n此输出值得注意的是，线程\
  \ ID 有时会变化，而在其他时候会重复。在这种简单的控制台应用程序中，同步上下文（通过 `SynchronizationContext.Current` 访问）为空空——默认的同步上下文会导致线程池处理线程分配。这解释了为什么线程\
  \ ID 在任务之间会变化：有时线程池认为使用新线程是高效的。\n\n\n\n\n\n## 列表 20.14：WPF 中的同步高延迟调用\n\n点击此处查看代码图像\n\
  \n```c\nusing System;\n\nprivate void PingButton_Click(\n  object sender, RoutedEventArgs\
  \ e)\n{\n  StatusLabel.Content = \"Pinging...\";\n  UpdateLayout();\n  Ping ping\
  \ = new Ping();\n  PingReply pingReply =\n      ping.Send(\"www.IntelliTect.com\"\
  );\n  StatusLabel.Text = pingReply.Status.ToString();\n}\n```\n\n`4.0`\n\n考虑到 `StatusLabel`\
  \ 是一个 WPF `System.Windows.Controls.TextBlock` 控件，并且我们在 `PingButton_Click()` 事件订阅者中已经更新了两次\
  \ `Content` 属性，一个合理的假设是：首先显示的“Pinging...”将一直显示，直到 `Ping.Send()` 返回，然后标签将更新为 `Send()`\
  \ 复的状态。正如熟悉 Windows UI 框架的开发者所知到的，事实并非如此。相反，一条消息被发送到 Windows 消息泵（message pump）以用“Pinging...”更新内容，但由于\
  \ UI 线程正忙执行 `PingButton_Click()` 方法，Windows 消息泵没有被处理。等到 UI 线程释放并可以查看 Windows 消息泵时，第二个\
  \ `Text` 属性更新请求已经入队，用户能够观察到的唯一消息是最终状态。\n\n要使用 TAP 修复此问题，我们更改列表 20.15 中高亮的代码。\n\n\
  ## 列表 20.15：使用 `await` 在 WPF 中的同步高延迟调用\n\n点击此处查看代码图像\n\n```csharp\nusing System;\n\
  \nasync private void PingButton_Click(\n  object sender, RoutedEventArgs e)\n{\n\
  \  StatusLabel.Content = \"Pinging...\";\n  UpdateLayout();\n  Ping ping = new Ping();\n\
  \  PingReply pingReply =\n      await ping.SendPingAsync(\"www.IntelliTect.com\"\
  );                            \n  StatusLabel.Text = pingReply.Status.ToString();\n\
  }\n```\n\n`5.0`\n\n这一更改具有两个优点。首先，ping 调异步异步释放了调用者线程，使其返回 Windows 消息泵调用者的同步上下文，并处理对\
  \ `StatusLabel.Content` 的更新，使得“Pinging...”能够显示给用户。其次，当等待 `ping.SendTaskAsync()`\
  \ 完成时，它将始终在与调用者相同的同步上下文中执行。此外，由于该同步上下文专门适用于 Windows UI，它是单线程的；因此，返回将始终回到同一个线程——即\
  \ UI 线程。换句话说，TPL 并不是立即执行延续任务，而是咨询同步上下文，后者转而向消息泵发送一条关于延续工作的消息。接下来，由于 UI 线程监控着消息泵，在拾取到延续工作消息后，它会调用\
  \ `await` 之后的代码。（因此，延续代码的调用是在处理消息泵的调用者相同的线程上进行的。）\n\n`4.0`\n\n一个关键的代码可读性特性内置在 TAP\
  \ 语言模式中。注意列表 20.15 中，返回 `pingReply.Status` 的调用似乎在 `await` 语句之后自然流动，提供了一个清晰的指示，表明它将在上一行之后立即执行。然而，由于多个原因，从头开始编写实际发生的情况将要难理解得多。\n\
  \n`4.0` `Begin 8.0`\n\n### 总结\n\n本章大部分内容集中在 C# 5.0 引入的基于任务的异步模式（TAP），该模式采用了 `async`/`await`\
  \ 语法。它提供了详细的示例，展示了利用 TAP 比仅依赖 TPL 要简单得多，特别是在将同步代码转换为异步实现时。这样做，它详细说明了 `async` 方法返回类型的要求。总之，`async`/`await`\
  \ 特性使得管理复杂的 `Task` 对象工作流变得更加简单。接下来，章节关注了 C# 8.0 引入的 `IAsyncEnumerable<T>` 流，考虑了如何利用这些迭代器以及如何使用\
  \ `async foreach` 语句消费它们。`8.0`\n\n到此为止，读者应该已经掌握了如何编写异步代码的基础，第 21 章](#ch21.xhtml）将涵盖……\n\
  \n## 21. 并行迭代\n\n在第 19 章](#ch19.xhtml)中，我们提到了异步的成本，第 21 章](#ch21.xhtml）将涵盖……\n\n\
  ## 21. 并行执行\n\n考虑列表 21.1 中的 `for` 语句以及对应的 21.1 输出，这种计算的有趣之处在于它是可并行的，并且可以非常容易地拆分为\
  \ 100 万位数字。## 列表 21.1：同步循环\n\n点击此处查看代码图像\n\n```csharp\nusing System;\n\nclass Program\n\
  {\n  const int TotalDigits = 100;\n  const int BatchSize = 10;\n\n  static void\
  \ Main()\n  {\n      string pi = \"\";\n      int iterations = TotalDigits / BatchSize;\n\
  \      for (int i = 0; i < iterations; i++)\n      {\n          pi += PiCalculator.Calculate(BatchSize,\
  \ i);\n      }\n      Console.WriteLine(pi);\n  }\n}\n\nusing System;\n\nclass PiCalculator\n\
  {\n  public static string Calculate(int digits, int startingAt)\n  {\n     // ...\n\
  \  }\n}\n```\n\n`4.0`\n\n## 21.1 输出\n\n点击此处查看代码图像\n\n```text\n3.\n\
  ```\n\n\n\n\n\n`for` 循环同步且按顺序执行每次迭代。然而，由于圆周率算法将圆周率计算分成了若干独立的部分，只要结果按正确的顺序追加，就没有必要按顺序计算这些部分。想象一下，如果可以让此循环的所有迭代并发运行，会发生什么：每个处理器可以获取单次迭代，并与其执行其他迭代的处理器并行执行。鉴于迭代是同时执行的，我们可以根据处理器的数量不断缩短执行时间。\n\
  \n任务并行库（TPL）提供了一个方便的方法 `Parallel.For()`，它恰恰可以实现这一目标。列表 21.2 显示了如何修改列表 21.1 中的顺序单线程程序，以使用该辅助方法。\n\
  \n### 列表 21.2：分段并行 `For` 循环计算圆周率\n\n点击此处查看代码图像\n\n```c\nusing System;\n\nusing System.Threading.Tasks;\
  \                                                       \n\nusing AddisonWesley.Michaelis.EssentialCSharp.Shared;\n\
  \n// ...\n\nclass Program\n\n{\n\n  static void Main()\n  {\n        string pi =\
  \ \"\";\n\n        const int iterations = TotalDigits / BatchSize;\n\n        string[]\
  \ sections = new string[iterations];\n\n        Parallel.For(0, iterations, i =>\
  \                                              \n\n        {                   \
  \                                                          \n\n            sections[i]\
  \ = PiCalculator.Calculate(                                     \n\n           \
  \     BatchSize, i * BatchSize);                                            \n\n\
  \        });                                                                   \
  \        \n\n        pi = string.Join(\"\", sections);\n\n        Console.WriteLine(pi);\n\
  \n}\n```\n```\n\n`4.0`\n\n列表 21.2 的输出与输出 21.1 相同；然而，如果你有多个 CPU，执行时间将显著加快（如果没有，可能会变慢）。`Parallel.For()`\
  \ API 的设计看起来与标准的 `for` 循环相似。第一个参数是 `fromInclusive` 值，第二个参数是 `toExclusive` 值，最后一个是作为循环体执行的\
  \ `Action<int>`。当使用表达式 lambda 作为操作时，代码看起来与 `for` 语句相似，但现在每次迭代都可能并行执行。与 `for` 循环一样，`Parallel.For()`\
  \ 的调用在所有迭代完成之前不会结束。换句话说，当执行到 `string.Join()` 语句时，圆周率的所有部分都计算完毕。\n\n请注意，合并圆周率不同部分的代码不再出现在列表\
  \ 21.2 的迭代（`action`）内部。由于圆周率计算部分很可能不会按顺序完成，因此每次迭代完成时追加部分可能会导致它们顺序错乱。即使顺序不是问题，仍然存在潜在的竞态条件，因为列表\
  \ 21.1 中的 `+=` 运算符不是原子的。为了解决这两个问题，圆周率的每个部分都存储在数组中，没有两个或多个迭代同时访问数组中的单个元素。只有在计算完所有圆周率后，`string.Join()`\
  \ 才会将它们合并。换句话说，我们将部分的合并操作推迟到了 `Parallel.For()` 循环完成后。这避免了由于部分尚未计算或部分合并顺序错误而引起的任何竞态条件。\n\
  \nTPL 使用与任务调度中相同的线程池技术，以确保并行循环的良好性能：它将尝试确保 CPU 不被过度调度等。\n\n`4.0`\n\nTPL 还提供了 `foreach`\
  \ 语句的类似并行版本，如列表 21.3 所示。\n\n### 列表 21.3：`foreach` 循环的并行执行\n\n点击此处查看代码图像\n\n```csharp\n\
  using System;\n\nusing System.Collections.Generic;\n\nusing System.IO;\n\nusing\
  \ System.Threading.Tasks;                                                     \n\
  \nclass Program\n\n{\n\n  // ...\n\n  static void EncryptFiles(\n      string directoryPath,\
  \ string searchPattern)\n  {\n      IEnumerable<string> files = Directory.EnumerateFiles(\n\
  \          directoryPath, searchPattern,\n          SearchOption.AllDirectories);\n\
  \      Parallel.ForEach(files, fileName =>                                     \
  \  \n      {                                                                   \
  \      \n          Encrypt(fileName);                                          \
  \          \n      });                                                         \
  \              \n  }\n  // ...\n\n}\n```\n```\n\n在此示例中，我们调用了一个加密 `files` 集合中每个文件的方法。它是并行执行的，执行线程的数量由\
  \ TPL 确定的最高效率决定。\n\n`4.0`\n\n#### 取消并行循环\n\n与任务不同，任务如果需要阻塞直到完成则需要显式调用，而并行循环并行执行迭代，但其本身在整个并行循环完成之前不会返回。因此，取消并行循环通常涉及从执行并行循环的线程之外调用取消请求。在列表\
  \ 21.5 中，我们使用 `Task.Run()` 调用了 `Parallel.ForEach<T>()`。通过这种方式，查询不仅并行并行执行，而且是异步执行，允许代码提示用户“按任意键退出”。\n\
  \n`4.0`\n\n### 列表 21.5：取消并行循环\n\n点击此处查看代码图像\n\n```csharp\nusing System;\n\nusing\
  \ System.Collections.Generic;\n\nusing System.IO;\n\nusing System.Threading;\nusing\
  \ System.Threading.Tasks;\n\npublic class Program\n\n{\n  // ...\n\n  static void\
  \ EncryptFiles(\n      string directoryPath, string searchPattern)\n  {\n      string\
  \ stars =\n          \"*\".PadRight(Console.WindowWidth-1, '*');\n\n      IEnumerable<string>\
  \ files = Directory.GetFiles(\n         directoryPath, searchPattern,\n        \
  \ SearchOption.AllDirectories);\n\n      CancellationTokenSource cts =         \
  \                                          \n          new CancellationTokenSource();\
  \                                              \n      ParallelOptions parallelOptions\
  \ =                                               \n          new ParallelOptions\
  \                                                         \n              { CancellationToken\
  \ = cts.Token };                                      \n\n      cts.Token.Register(\
  \                                                             \n          () =>\
  \ Console.WriteLine(\"Canceling...\"));                                   \n\n \
  \     Console.WriteLine(\"按任意键退出.\");\n\n      Task task = Task.Run(() =>\n    \
  \      {\n              try\n              {\n                  Parallel.ForEach(\n\
  \                      files, parallelOptions,\n                      (fileName,\
  \ loopState) =>\n                          {\n                              Encrypt(fileName);\n\
  \                          });\n              }\n              catch(OperationCanceledException){}\n\
  \          });\n\n      // 等待用户输入\n      Console.Read();\n\n      // 取消查询\n    \
  \  cts.Cancel();                                                               \
  \   \n      Console.Write(stars);\n\n      task.Wait();\n\n  }\n\n}\n```\n```\n\n\
  并行循环使用与任务相同的取消令牌模式。通过调用具有 `ParallelOptions` 类型参数的 `ForEach()` 方法重载，可以将从 `CancellationTokenSource`\
  \ 获取的令牌与并行循环关联。该对象包含了取消令牌。\n\n\n\n\n\n注意，如果你取消了并行循环操作，程序将通过检查 `IsCancellationRequested`\
  \ 属性防止尚未启动的迭代启动。正在执行的迭代将运行到各自的终止点。此外，即使在所有迭代都完成后调用 `Cancel()`，仍然会触发注册的取消事件（通过 `cts.Token.Register()`\
  \ 注册）。\n\n`ForEach()` 方法能够确认循环已取消的唯一手段是通过 `OperationCanceledException` 异常。由于鉴于此示例中的取消是预料中的，该异常被捕获并忽略，允许应用程序显示“正在取消……”，然后在退出前显示一行星号。\n\
  \n`4.0`\n\n### 在并行环境中运行 LINQ 查询\n\n正如可以使用 `Parallel.For()` 在并行环境下执行循环一样，也可以使用并行\
  \ LINQ API（简称 PLINQ）来在并行环境下执行 LINQ 查询。其中一个简单的非并行 LINQ 表达式示例可以在列表 21.6 看到；在列表 21.7\
  \ 中，我们对其进行了修改以进行并行运行。\n\n**列表 21.6: LINQ `Select()`**\n\n点击此处查看代码\n\n```\nusing\
  \ System.Collections.Generic;\n\nusing System.Linq;\n\nclass Cryptographer\n{\n\n\
  \  // ...\n\n  public List<string>\n    Encrypt(IEnumerable<string> data)\n  {\n\
  \      return data.Select(\n          item => Encrypt(item)).ToList();\n  }\n\n\
  \  // ...\n\n}\n```\n\n在列表 21.6 中，LINQ 查询使用 `Select()` 标准查询操作符对字符串序列中的每个字符串进行加密，并将生成的序列转换为列表。这看起来像是一个“尴尬地并行”的操作；每个加密操作可能是一个高延迟的\
  \ CPU 密集型操作，可以分配到另一个 CPU 上的工作线程执行。\n\n列表 21.7 展示了如何修改列表 21.6，使得加密字符串的代码以并行方式执行。\n\
  \n`4.0`\n\n**列表 21.7: 并行 LINQ Select()**\n\n点击此处查看代码\n\n```\nusing System.Linq;\n\
  \nclass Cryptographer\n{\n\n  // ...\n\n  public List<string> Encrypt (IEnumerable<string>\
  \ data)\n  {\n      return data.AsParallel().Select(\n          item => Encrypt(item)).ToList();\n\
  \  }\n\n  // ...\n\n}\n```\n\n如列表 21.7 所示，启用并行支持的更改非常小！它涉及的只是一个标准查询操作符 `AsParallel()`，它可以在静态类\
  \ `System.Linq.ParallelEnumerable` 中找到。这个简单的扩展方法告诉运行时，它可以以并行方式执行查询。结果是，在具有多个可用 CPU\
  \ 的机器上，执行查询的总时间可以显著缩短。\n\n`System.Linq.ParallelEnumerable` 是 Microsoft .NET Framework\
  \ 4.0 中引入的用于启用 PLINQ 的引擎，它包含了 `System.Linq.Enumerable` 上可用查询操作符的超集。因此，它为所有常用的查询操作符提供了可能改进性能的\
  \ API，包括用于排序、过滤（`Where()`）、投影（`Select()`）、连接、分组和聚合的操作符。列表 21.8 展示了如何进行并行排序。\n\n\
  **列表 21.8: 带有标准查询操作符的并行 LINQ**\n\n点击此处查看代码\n\n```\n// ...\n\n      OrderedParallelQuery<string>\
  \ parallelGroups =\n          data.AsParallel().OrderBy(item => item);\n\n     \
  \ // 显示剩余项目的总计数\n      // 是否匹配原始计数\n      System.Diagnostics.Trace.Assert(\n   \
  \       data.Count == parallelGroups.Sum(\n              item => item.Count()));\n\
  // ...\n```\n\n如列表 21.8 所示，调用并行版本只需调用一次 `AsParallel()` 扩展方法。注意，并行标准查询操作符返回的结果类型为\
  \ `ParallelQuery<T>` 或 `OrderedParallelQuery<T>`；两者都通知编译器它应该继续使用可用的标准查询操作的并行版本。\n\
  \n鉴于查询表达式仅仅是列表 21.5 和 21.6 中查询方法调用形式的语法糖，你同样很容易在表达式形式下使用 `AsParallel()`。列表 21.9\
  \ 展示了使用查询表达式语法并行执行分组操作的示例。\n\n`4.0`\n\n**列表 21.9: 带有查询表达式的并行 LINQ**\n\n点击此处查看代码\n\
  \n```\n// ...\n\n      ParallelQuery<IGrouping<char, string>> parallelGroups;\n\
  \      parallelGroups =\n          from text in data.AsParallel()\n            orderby\
  \ text\n            group text by text[0];\n\n      // 显示剩余项目的总计数\n      // 是否匹配原始计数\n\
  \      System.Diagnostics.Trace.Assert(\n          data.Count == parallelGroups.Sum(\n\
  \              item => item.Count()));\n// ...\n```\n\n如你在之前的示例所示，将查询或循环转换为并行执行是非常简单的。然而，有一个重要的警告：正如我们在第\
  \ 22 章中深入讨论的，你必须小心防止多个线程不当地访问和修改同一内存。这样做会导致竞态条件。\n\n\n\n\n\n```csharp\nusing System;\n\
  using System.Collections.Generic;\nusing System.Linq;\nusing System.Threading;\n\
  using System.Threading.Tasks;\n\npublic static class Program\n{\n  public static\
  \ List<string> ParallelEncrypt(\n      List<string> data,\n      CancellationToken\
  \ cancellationToken)\n  {\n      int govener = 0;\n      return data.AsParallel().WithCancellation(\n\
  \          cancellationToken).Select(\n              (item) =>\n              {\n\
  \                  if (Interlocked.CompareExchange(\n                      ref govener,\
  \ 0, 100) % 100 == 0)\n                  {\n                      Console.Write('.');\n\
  \                  }\n                  Interlocked.Increment(ref govener);\n  \
  \                return Encrypt(item);\n              }).ToList();\n  }\n  public\
  \ static async Task Main()\n  {\n      ConsoleColor originalColor = Console.ForegroundColor;\n\
  \      List<string> data = Utility.GetData(100000).ToList();\n      using CancellationTokenSource\
  \ cts =\n          new CancellationTokenSource();\n      Task task = Task.Run(()\
  \ =>\n      {\n          data = ParallelEncrypt(data, cts.Token);\n      }, cts.Token);\n\
  \      Console.WriteLine(\"Press any key to Exit.\");\n      Task<int> cancelTask\
  \ = ConsoleReadAsync(cts.Token);\n      try\n      {\n          Task.WaitAny(task,\
  \ cancelTask);\n          // Cancel whichever task has not finished.\n         \
  \ cts.Cancel();\n          await task;\n          Console.ForegroundColor = ConsoleColor.Green;\n\
  \          Console.WriteLine(\"\\nCompleted successfully\");\n      }\n      catch\
  \ (OperationCanceledException taskCanceledException)\n      {\n          Console.ForegroundColor\
  \ = ConsoleColor.Red;\n          Console.WriteLine(\n              $\"\\nCancelled:\
  \ { taskCanceledException.Message }\");\n      }\n      finally\n      {\n     \
  \     Console.ForegroundColor = originalColor;\n      }\n  }\n  private static async\
  \ Task<int> ConsoleReadAsync(\n      CancellationToken cancellationToken = default)\n\
  \  {\n      return await Task.Run(async () =>\n      {\n          const int maxDelay\
  \ = 1025;\n          int delay = 0;\n          while (!cancellationToken.IsCancellationRequested)\n\
  \          {\n              if (Console.KeyAvailable)\n              {\n       \
  \           return Console.Read();\n              }\n              else\n      \
  \        {\n                  await Task.Delay(delay,cancellationToken);\n     \
  \             if (delay < maxDelay) delay *= 2 + 1;\n              }\n         \
  \ }\n          cancellationToken.ThrowIfCancellationRequested();\n          throw\
  \ new InvalidOperationException(\n              \"Previous line should throw preventing\
  \ this from ever\n  executing\");\n      }, cancellationToken);\n  }\n  private\
  \ static string Encrypt(string item)\n  {\n      Cryptographer cryptographer = new\
  \ Cryptographer();\n      return System.Text.Encoding.UTF8.GetString(cryptographer.\n\
  \      Encrypt(item));\n  }\n}\n```\n\n`4.0`\n\n**输出 21.3**\n\n点击此处查看代码图像\n\n```\n\
  Press any key to Exit.\n..........................................................................\n\
  ..........................................................................\n.............................................................\n\
  ...................................\nCancelled: The query has been canceled via\
  \ the token supplied to\nWithCancellation.\n```\n\n与并行循环或任务一样，取消 PLINQ 查询需要一个 `CancellationToken`，该令牌可以通过\
  \ `CancellationTokenSource` 获取。然而，并不是为每个 PLINQ 查询重载以支持取消令牌，`IEnumerable.AsParallel()`\
  \ 方法返回的 `ParallelQuery<T>` 对象包含一个 `WithCancellation()` 扩展方法，该方法只需接收 `CancellationToken`。因此，在\
  \ `CancellationTokenSource` 对象上调用 `Cancel()` 将请求并行查询取消——因为它会检查 `CancellationToken`\
  \ 上的 `IsCancellationRequested` 属性。\n\n所述，取消 PLINQ 查询将抛出异常而不是返回完整结果。处理可能被取消的 PLINQ\
  \ 查询的一种常用技术是将查询封装在 `try` 块中并捕获 `OperationCanceledException`。另一种常用技术（如列表 21.10` 并作为\
  \ `Run()` 的第二个参数。这将导致 `task.Wait()` 抛出 `AggregateException`，其 `InnerException` 属性将设置为\
  \ `TaskCanceledException`。随后可以像捕获任何其他并行操作的异常一样来捕获该聚合异常。\n\n`结束 4.0`\n\n### 总结\n\n\
  在本章中，我们讨论了如何使用 TPL `Parallel` 类进行 `for` 和 `foreach` 类型的迭代。此外，通过 `System.Linq` 中包含的\
  \ `AsParallel()` 扩展方法，我们演示了如何并行执行 LINQ 查询。实现这一点的易性应该让你意识到，并行迭代是引入并行执行最简单的方法之一。尽管仍然需要注意态态和死锁，但如果你不在并行循环的迭代中共享数据，这些问题发生的概率比直接处理任务要低得多。剩下的就是识别可以从并行执行中受益的\
  \ CPU 密集型代码块。\n\n## 22. 线程同步\n\n在第 21 章中，我们讨论了使用任务并行库 (TPL) 和并行 LINQ (PLINQ) 进行多线程编程的细节。然而，我们特意避开的一个主题是线程同步，并在避免死锁的同时防止竞态条件。线程同步是本章的主题。\n\
  \n我们将从一个没有线程同步的多线程示例开始——这会导致竞态条件。该讨论将作为为什么我们需要线程同步的引言。随后是对实现它的各种机制的介绍。\n\n![思维图描绘了线程同步中讨论的各种概念。它们是(1)线程同步的需求\
  \ (2)monitor (3)lock (4)volatile (5)System.Threading.Interlocked (6)System.Threading.Mutex\
  \ (7)事件以及 (8)线程本地存储。](img/22mindmap.jpg)\n\n本书的版本包含了关于附加多线程模式以及计时器回调机制的重要章节。然而，随着\
  \ `async/await` 模式的引入，这些方法已基本被取代，除非你使用的是 C# 5.0/.NET 4.5 之前的框架进行编程。不过，可以在本书的网站获取之前的\
  \ C# 5.0 资料：[`IntelliTect.com/EssentialCSharp`](http://IntelliTect.com/EssentialCSharp)。\n\
  \n整个章节都使用 TPL，因此无法在 Microsoft .NET Framework 4 之前的框架上编译。除非明确是 Microsoft .NET Framework\
  \ 4 API，否则 Microsoft .NET Framework 4 的限制唯一原因是使用了 `System.Threading.Tasks.Task`\
  \ 类来执行异步操作。修改代码以实例化 `System.Threading.Thread` 并使用 `Thread.Join()` 等待线程执行，将允许大多数示例在较早的框架上编译。\n\
  \n尽管如此，本章中启动任务的特定 API 是 .NET 4.5（或更高版本）的 `System.Threading.Tasks.Task.Run()`。正如我们在第\
  \ 19 章中所讨论的，该方法优于 `System.Threading.Tasks.Task.Factory.StartNew()`，因为它更简单且适用于大多数场景。如果你受限于\
  \ .NET 4，可以将 `Task.Run()` 替换为 `Task.Factory.StartNew()` 而无需任何额外修改。\n\n\n\n\n\n###\
  \ 为什么需要同步？\n\n运行新线程是一个相对简单的编程任务。然而，多线程编程的困难之处在于要识别哪些数据可以被多个线程安全地同时访问。程序必须对此类数据进行同步以防止同时访问，从而创建“安全性”。请考虑列表\
  \ 22.1。\n\n**列表 22.1：未同步状态**\n\n点击此处查看代码图像\n\n```assembly\nusing System;\n\nusing\
  \ System.Threading.Tasks;\n\npublic class Program\n{\n    const int _Total = int.MaxValue;\n\
  \n    static long _Count = 0;\n\n    public static void Main()\n    {\n        //\
  \ Use Task.Factory.StartNew for .NET 4.0\n\n        Task task = Task.Run(() => Decrement());\n\
  \n        // Increment\n        for(int i = 0; i < _Total; i++)\n        {\n   \
  \         _Count++;\n        }\n\n        task.Wait();\n\n        Console.WriteLine(\"\
  Count = {0}\", _Count);\n    }\n\n    static void Decrement()\n    {\n        //\
  \ Decrement\n        for(int i = 0; i < _Total; i++)\n        {\n            _Count--;\n\
  \        }\n    }\n}\n```\n\n列表 22.1 的一种可能结果出现在输出 22.1 中。\n\n**输出 22.1**\n\n```\n\
  Count = 113449949\n```\n\n关于列表 22.1 需要注意的重要点是，输出不是 `0`。如果直接（顺序地）调用 `Decrement()`，结果应该是\
  \ `0`。然而，当异步调用 `Decrement()` 时，会发生竞态条件，因为 `_Count++` 和 `_Count--` 语句中的各个步骤交织在一起了。（正如第\
  \ 19 章的入门主题：多线程术语中讨论过的，C# 中的单条语句可能涉及多个步骤。）请考虑表 22.1 中的示例执行。\n\n**表 22.1：示例伪代码执行**\n\
  \n| **主线程** | **递减线程** | **Count** |\n| :--- | :--- | :--- |\n| 从 `_Count` 复制值 `0`。\
  \ | | 0 |\n| 增加复制的值 (`0`)，得到 `1`。 | | 0 |\n| 将结果值 (`1`) 复制到 `_Count`。 | | 1 |\n\
  | 从 `_Count` 复制值 `1`。 | | 1 |\n| | 从 `_Count` 复制值 `1`。 | 1 |\n| 增加复制的值 (`1`)，得到\
  \ `2`。 | | 1 |\n| 将结果值 (`2`) 复制到 `_Count`。 | | 2 |\n| | 递减复制的值 (`1`)，得到 `0`。 | 2\
  \ |\n| | 将结果值 (`0`) 复制到 `_Count`。 | 0 |\n| ... | ... | ... |\n| | | |\n\n表 22.1\
  \ 通过指令从一列到另一列的转换显示了并行执行（或线程上下文切换）。特定行完成后 `_Count` 的值出现在最后一列。在这个示例中，`_Count++` 执行了两次，`_Count--`\
  \ 发生一次。然而，结果 `_Count` 值是 `0` 而不是 `1`。将结果写回 `_Count` 实际上会抹除自同一线程读取 `_Count` 之后发生的所有任何\
  \ `_Count` 值变化。\n\n列表 22.1 中的问题是竞态条件，多个线程同时访问相同的数据元素。正如此示例执行所示，允许多个线程访问相同的数据元素可能会破坏数据完整性，即使在单处理器计算机上也是如此。为了解决这个潜在问题，需要对数据进行同步。为了多线程同时访问而同步的代码或数据是**线程安全的\
  \ (thread safe)**。\n\n`开始 4.0`\n\n### 使用 `Monitor` 进行同步\n\n为了同步多个线程，使其它们无法同时执行特定的代码段，你可以使用\
  \ `monitor` 来阻塞第二个线程在第一个线程退出该段落之前进入受保护的代码段。monitor 功能是名为 `System.Threading.Monitor`\
  \ 类的一部分，受保护代码段的开始和结束分别用静态方法 `Monitor.Enter()` 和 `Monitor.Exit()` 标记。\n\n列表 22.3\
  \ 演示了使用 `Monitor` 类进行同步。如列表所示，将 `Monitor.Enter()` 和 `Monitor.Exit()` 之间的所有代码由 `try/finally`\
  \ 块包裹是非常重要的。如果没有这个块，受保护区域可能会发生异常，并且 `Monitor.Exit()` 可能永远不会被调用，从而阻塞其他线程。\n\n**列表\
  \ 22.3：显式使用 Monitor 同步**\n\n点击此处查看代码图像\n\n```assembly\nusing System;\n\nusing System.Threading;\n\
  using System.Threading.Tasks;\n\npublic class Program\n{\n    readonly static object\
  \ _Sync = new object();\n\n    const int _Total = int.MaxValue;\n\n    static long\
  \ _Count = 0;\n\n    public static void Main()\n    {\n        // Use Task.Factory.StartNew\
  \ for .NET 4.0\n\n        Task task = Task.Run(() => Decrement());\n\n        //\
  \ Increment\n        for(int i = 0; i < _Total; i++)\n        {\n            bool\
  \ lockTaken = false;\n            try\n            {\n                Monitor.Enter(_Sync,\
  \ ref lockTaken);\n                _Count++;\n            }\n            finally\n\
  \            {\n                if (lockTaken)\n                {\n            \
  \        Monitor.Exit(_Sync);\n                }\n            }\n        }\n\n \
  \       task.Wait();\n\n        Console.WriteLine($\"Count = {_Count}\");\n    }\n\
  \n    static void Decrement()\n    {\n        for(int i = 0; i < _Total; i++)\n\
  \        {\n            bool lockTaken = false;\n            try\n            {\n\
  \                Monitor.Enter(_Sync, ref lockTaken);\n                _Count--;\n\
  \            }\n            finally\n            {\n                if(lockTaken)\n\
  \                {\n                    Monitor.Exit(_Sync);\n                }\n\
  \            }\n        }\n    }\n}\n```\n\n\n\n\n请注意，`Monitor.Enter()` 和 `Monitor.Exit()`\
  \ 的调用通过共享作为参数传递的对象引用（在本例中为 `_Sync`）相关联。带有 `lockTaken` 参数的 `Monitor.Enter()` 重载方法直到\
  \ .NET 4.0 才被添加到框架中。在此之前，没有这种 `lockTaken` 参数，并且无法可靠地捕获发生在 `Monitor.Enter()` 和 `try`\
  \ 块之间的异常。在发布版代码中，将 `try` 块紧跟在 `Monitor.Enter()` 调用之后是可靠的，因为即时编译器（JIT）防止了此类异步异常的溜入。然而，紧跟在\
  \ `Monitor.Enter()` 之后的 `try` 块以外的任何内容（包括编译器可能在调试代码中注入的任何指令）都可能阻止 JIT 可靠地返回 `try`\
  \ 块内执行。因此，如果发生了异常，它将导致锁泄漏（锁仍保持获取状态），而不是执行 `finally` 块并释放它——这可能会在另一个线程尝试获取锁时导致死锁。总之，在\
  \ .NET 4.0 之前的框架版本中，您应该始终在 `Monitor.Enter()` 之后跟随 `try/finally {Monitor.Exit(_Sync)}`\
  \ 块。\n\n`Monitor` 还支持 `Pulse()` 方法，允许线程进入`就绪队列`，表示它是下一个执行的任务。这是同步生产者-消费者模式的常用手段，以确保在没有“生产”之前不会发生“消费”。拥有监视器的生产者线程（通过调用\
  \ `Monitor.Enter()`）调用 `Monitor.Pulse()` 来信号消费者线程（其可能已经调用了 `Monitor.Enter()`）有一个项目可供消费，并且它应该准备就绪。对于单个\
  \ `Pulse()` 调用，只有一个线程（在本例中为消费者线程）可以进入就绪队列。当生产者线程调用 `Monitor.Exit()` 时，消费者线程获取锁（`Monitor.Enter()`\
  \ 完成）并进入临界区开始消费项目。一旦消费者处理了等待中的项目，它就会调用 `Exit()`，从而允许生产者（当前阻塞在 `Monitor.Enter()`\
  \ 处）再次进行生产。在这个示例中，一次只有一个线程可以进入就绪队列，确保了没有生产就不会有消费，反之亦然。\n\n`结束 4.0`\n\n## 使用 `lock`\
  \ 关键字\n\n由于在多线程代码中频繁需要使用 `Monitor` 进行同步，而且由于 `try/finally` 块很容易被忘记，C# 提供了一个特殊的关键字来处理这种锁同步模式。。[列表\
  \ 22.4 演示了 `lock` 关键字的使用，输出 22.3 显示了结果。\n\n**列表 22.4：使用 `lock` 关键字进行同步**\n\n点击此处查看代码图像\n\
  \n```\nusing System;\n\nusing System.Threading;\n\nusing System.Threading.Tasks;\n\
  \npublic class Program\n{\n\n    readonly static object _Sync = new object();  \
  \                       \n\n    const int _Total = int.MaxValue;\n\n    static long\
  \ _Count = 0;\n\n    public static void Main()\n    {\n\n        // .NET 4.0 使用\
  \ Task.Factory.StartNew\n\n        Task task = Task.Run(() => Decrement());\n\n\
  \        // 递增\n\n        for(int i = 0; i < _Total; i++)\n        {\n\n       \
  \     lock(_Sync)                                                 \n           \
  \ {                                                           \n               \
  \ _Count++;                                               \n            }      \
  \                                                     \n        }\n\n        task.Wait();\n\
  \n        Console.WriteLine($\"Count = {_Count}\");\n    }\n\n    static void Decrement()\n\
  \    {\n\n        for(int i = 0; i < _Total; i++)\n        {\n\n            lock(_Sync)\
  \                                                 \n            {              \
  \                                             \n                _Count--;      \
  \                                         \n            }                      \
  \                                     \n        }\n    }\n\n}\n```\n\n**输出 22.3**\n\
  \n```\nCount = 0\n```\n\n通过锁定访问 `_Count` 的代码段（使用 `lock` 或 `Monitor`），您使得 `Main()`\
  \ 和 `Decrement()` 方法是线程安全的，这意味着它们可以安全地从多个线程同时被调用。（在 C# 4.0 之前，该概念是相同的，但编译器生成的代码依赖于不带\
  \ `lockTaken` 的 `Monitor.Enter()` 方法，且调用的 `Monitor.Enter()` 是在 `try` 块之前生成的。）\n\n\
  同步的代价是性能的降低。例如，列表 22.4 的执行时间比 列表 22.1 长一个数量级，这证明了 `lock` 与增加和减少计数的执行相比，执行速度相对较慢。\n\
  \n即使 `lock` 与其同步的工作相比是微不足道的，程序员也应该避免无目的同步，以避免死锁的可能性，以及在多处理器计算机上进行不必要的同步（而这些计算机本可以并行执行代码）。对象设计的通用最佳实践是同步\
  \ `mutable static`（可变静态）状态，而不是任何实例数据。（没有必要对从改变的内容进行同步。）允许多个线程访问特定对象的程序员必须为该对象提供同步。任何显式处理线程的类都可能希望在某种程度上使实例是线程安全的。\n\
  \n`开始 7.1`\n\n## 初学者主题：无 `await` 的 `Task` 返回\n\n在 列表 22.1 中，虽然 `Task.Run(() => Decrement())`\
  \ 返回一个 `Task`，但没有使用 `await` 运算符。这是因为在 C# 7.1 之前，`Main()` 不支持 `async`。然而，有了 C# 7.1，代码可以重构为使用\
  \ `async/await` 模式，如 列表 22.5 所示。\n\n**列表 22.5：使用 C# 7.1 的 `async Main()`**\n\n点击此处查看代码图像\n\
  \n```\nusing System;\n\nusing System.Threading.Tasks;\n\npublic class Program\n\
  {\n\n    readonly static object _Sync = new object();\n\n    const int _Total =\
  \ int.MaxValue;\n\n    static long _Count = 0;\n\n    public static async Task Main()\
  \                               \n    {\n\n        // .NET 4.0 使用 Task.Factory.StartNew\n\
  \n        Task task = Task.Run(() => Decrement());\n\n        // 递增\n\n        for(int\
  \ i = 0; i < _Total; i++)\n        {\n\n            lock(_Sync)                \
  \                                 \n            {                              \
  \                             \n                _Count++;                      \
  \                         \n            }                                      \
  \                     \n        }\n\n        await task;                       \
  \                           \n\n        Console.WriteLine($\"Count = {_Count}\"\
  );\n    }\n\n    static void Decrement()\n    {\n\n        for(int i = 0; i < _Total;\
  \ i++)\n        {\n\n            lock(_Sync)                                   \
  \              \n            {                                                 \
  \          \n                _Count--;                                         \
  \      \n            }                                                         \
  \  \n        }\n    }\n\n}\n```\n\n`结束 7.1`\n\n## 选择 `lock` 对象\n\n无论是否显式使用 `lock`\
  \ 关键字或 `Monitor` 类，程序员仔细选择锁对象都是至关重要的。\n\n在之前的示例中，同步变量 `_Sync` 被声明为私有且只读。将其声明为只读是为了确保在调用\
  \ `Monitor.Enter()` 和 `Monitor.Exit()` 之间值不会改变。这允许了进入和退出同步块之间的关联。同样，代码将 `_Sync`\
  \ 声明为私有，这样类外部任何同步块都不会同步同一个对象实例，从而导致代码阻塞。\n\n\n\n\n如果数据是公开的，同步对象可以是公开的，以便其他类可以使用相同的对象实例进行同步。然而，这使得规避死锁变得更加困难。幸运的是，这种模式并不多见。对于公开数据，更好的做法是将同步完全留在类之外，允许调用代码使用其自己的同步对象来获取锁。\n\
  \n同步对象不应该是值类型，这一点至关重要。如果在值类型上使用 `lock` 关键字，编译器将报告错误。（在显式访问 `System.Threading.Monitor`\
  \ 类的情况下[**不是通过 `lock`**]，在编译时不会发生此类错误。相反，代码在调用 `Monitor.Exit()` 时将抛出异常，表明没有没有的 `Monitor.Enter()`\
  \ 调用。）问题在于，当使用值类型时，运行时会创建该值的副本，将其放置在堆中（发生装箱），并把装箱后的值传递给 `Monitor.Enter()`。同样，`Monitor.Exit()`\
  \ 接收的是原始变量的装箱副本。结果是 `Monitor.Enter()` 和 `Monitor.Exit()` 接收到了不同的同步对象实例，导致这两个调用之间没有产生关联。\n\
  \n### 为什么要避免在 `this`、`typeof(type)` 和 `string` 上锁定\n\n一种看似合理的模式是针对类中的实例数据对 `this`\
  \ 关键字进行锁定，并对从 `typeof(type)` 获取的类型实例（例如 `typeof(MyType)`）对静态数据进行锁定。这种模式在运行 `this`\
  \ 时，为与特定对象实例相关的所有状态提供了一个同步目标；在运行 `typeof(type)` 时，为该类型的所有静态数据提供了一个同步目标。问题在于，`this`（或\
  \ `typeof(type)`）指向的同步目标可能会参与另一个在不相关的代码块中创建的完全不同的同步块的同步目标。换句话说，虽然只有实例内部的代码可以使用 `this`\
  \ 关键字进行阻塞，但创建该实例的调用者可以将该实例传递给一个同步锁。\n\n结果是，同步两个完全不同数据集的两个同步块可能会互相阻塞。尽管可能不太可能，但共享同一个同步目标可能会产生意料之外的性能影响，在极端情况下，甚至可能导致死锁。与其在\
  \ `this` 甚至 `typeof(type)` 上锁定，不如定义一个私有的只读字段，除了访问该字段的类之外，没人会在该字段上进行阻塞。\n\n另一种需要避免的锁类型是\
  \ `string`，因为存在与字符串内部（string interning）相关的风险。如果同一个 `string` 常量出现在多个位置，所有位置很可能会引用同一个实例，导致锁的范围比预想的要得多。\n\
  \n总结，你应该使用 `object` 类型的每个同步上下文实例作为锁目标。\n\n### 避免使用 `MethodImplAttribute` 进行同步\n\n\
  .NET 1.0 引入的一种同步机制是 `MethodImplAttribute`。该属性与 `MethodImplOptions.Synchronized`\
  \ 方法结合使用，将方法标记为同步的，以便在同一时间只有一个线程可以执行该方法。为了实现这一点，JIT 实际上将该方法处理为被 `lock(this)` 环绕，或者在静态方法的情况下，对类型进行锁定。这种实现意味着，实际上，该方法以及同一类中所有其他装饰有相同属性和枚举参数的其他方法都是同步的——而不是每个方法相对于自身是同步的。换句话说，给定同一类中两个或多个装饰有该属性的方法，只有其中一个方法可以在同一时间执行，而正在执行的方法将阻塞其他线程对自身或对类中具有相同装饰的任何其他方法的调用。此外，由于同步是基于\
  \ `this`（甚至更糟，基于类型），它遭受了前一节讨论的 `lock(this)`（对于静态情况更糟）的相同缺陷。因此，最佳实践是完全避免使用 `MethodImplAttribute`。\n\
  \n### 将字段声明为 `volatile`\n\n有时，编译器或 CPU 可能会优化代码，导致指令的执行顺序与代码编写顺序不完全一致，或者某些指令被优化掉。当代码在单线程上执行时，这些优化是无害的。然而，在多线程环境下，这些优化可能会意想不到的后果，因为优化可能会更改字段的读写操作相对于另一个线程访问同一字段的执行顺序。\n\
  \n稳定这种行为的一种方法是使用 `volatile` 关键字声明字段。该关键字强制所有对 `volatile` 字段的读和写操作在代码所确定的精确位置发生，而不是在优化产生的其他位置发生。`volatile`\
  \ 修饰符表示该字段可能会被硬件、操作系统或另一个线程修改。因此，数据是“易变的（volatile）”，该关键字指示编译器和运行时更精确地处理它。（更多细节请参阅\
  \ [`bit.ly/CSharpReorderingOptimizations`](http://bit.ly/CSharpReorderingOptimizations)）\n\
  \n通常，使用 `volatile` 修饰符非常罕见，且充满了复杂性，可能会导致错误的用法。除非你绝对确定 `volatile` 的用法，否则优先使用 `lock`\
  \ 而非 `volatile` 修饰符。\n\n### 使用 `System.Threading.Interlocked` 类\n\n到目前描述的互斥模式为处理进程内（应用程序域）的同步提供了最基本的工具集。然而，使用\
  \ `System.Threading.Monitor` 进行同步是一项昂贵的操作，而处理器直接支持的替代方案针对特定的同步模式。\n\n列表 22.6 只要前一个值为\
  \ `null`，就将 `_Data` 设置为新值。\n\n``` 只要前一个值为 `null`，就将 `_Data` 设置为新值。如方法名所示，这种模式是比较/交换模式。与其手动在等效比较和交换代码周围放置锁，`Interlocked.CompareExchange()`\
  \ 方法提供了一个内置方法，执行相同的检查（对于 `null`）并更新第一个参数。表 22.2 显示了 `Interlocked` 支持的其他同步方法。\n\n\
  **列表 22.6: 使用 System.Threading.Interlocked**\n\n点击此处查看代码图像\n\n```\npublic class\
  \ SynchronizationUsingInterlocked\n\n{\n\n    private static object? _Data;\n\n\
  \    // 如果尚未赋值则初始化\n\n    static void Initialize(object newValue)\n\n    {\n\n \
  \       // 如果 _Data 为 null，则将其设置为 newValue\n        Interlocked.CompareExchange(\n\
  \            ref _Data, newValue, null);\n    }\n\n    // ...\n\n}\n```\n\n\n\n\n\
  \n```\npublic static int Add(\n  ref int location,\n  int value\n);\n```\n将 `value`\
  \ 加到 `location` 上并将结果赋值给 `location`。它等同于 `+=` 运算符。\n\n```go\npublic static long\
  \ Read(\n  ref long location\n);\n```\n单次原子操作返回一个 64 位值。\n\n**表 22.2：`Interlocked`\
  \ 的同步相关方法**\n\n### 结束 2.0\n\n这些方法大部分具有附加数据类型签名的重载，例如对 `long` 的支持。表 22.2 提供了通用的签名和描述。\n\
  \n请注意，可以使用 `Increment()` 和 `Decrement()` 代替列表 22.5 中的同步 `++` 和 `--` 运算符，这样做会获得更好的性能。另外请注意，如果另一个线程使用非互锁方法访问\
  \ `_Count`，则这两个访问将无法正确同步。\n\n### 多线程中的事件通知\n\n开发者经常忽略同步的一个领域是触发事件。发布事件的不安全线程代码与列表\
  \ 22.7 类似。\n\n**列表 22.7：触发事件通知**\n\n点击此处查看代码图像\n\n```go\n// 非线程安全\n\nif(OnTemperatureChanged\
  \ != null)                                           \n  // 调用订阅者\n\n  OnTemperatureChanged(\n\
  \      this, new TemperatureEventArgs(value) );\n}\n```\n\n只要此方法与事件订阅者之间没有产生竞态条件，该代码就是有效的。然而，该代码不是原子的，因此多个线程可能会引入竞态条件。在检查\
  \ `OnTemperatureChange` 是否为 `null` 与实际触发事件之间，`OnTemperatureChange` 可能会被设置为 `null`，从而抛出\
  \ `NullReferenceException`。换句话说，如果多个线程可能同时访问委托，则有必要对委托的赋值和触发进行同步。\n\nC# 6.0 解决这一困境的方案显而易见。只需要使用空条件运算符即可：\n\
  \n点击此处查看代码图像\n\n```go\nOnTemperature?.Invoke(\n    this, new TemperatureEventArgs(\
  \ value ) );\n```\n\n空条件运算符专门设计为原子性，因此这种对委托的调用实际上是原子的。关键点——显然——在于记住使用空条件运算符。\n\n\
  尽管这需要更多的代码，但在 C# 6.0 之前的线程安全委托调用并不特别困难。这种方法之所以有效，是因为添加和移除监听器的运算符是线程安全且静态的（运算符重载是通过静态方法完成的）。要纠正列表\
  \ 22.7 并使其线程安全，请赋值一个副本，检查副本是否为 `null`，并触发副本（参见列表 22.8）。\n\n**列表 22.8：线程安全的事件通知**\n\
  \n点击此处查看代码图像\n\n```go\n// ...\n\nTemperatureChangedHandler localOnChange =\n   \
  \ OnTemperatureChanged;\n\nif(localOnChanged != null)\n{\n  // 调用订阅者\n  localOnChanged(\n\
  \      this, new TemperatureEventArgs(value) );\n}\n\n// ...\n```\n\n由于委托是引用类型，赋值一个局部变量并使用该局部变量触发就足以使\
  \ `null` 检查变为线程安全，这可能令人惊讶。由于 `localOnChange` 指向与 `OnTemperatureChange` 相同的位置，你可能认为\
  \ `OnTemperatureChange` 的任何变化也会反映在 `localOnChange` 中。\n\n事实上，情况*并非*是的：任何对 `OnTemperatureChange\
  \ += <listener>` 的调用都不会向 `OnTemperatureChange` 添加新委托，而是会为其分配一个完全新的多路委托，而对 `localOnChange`\
  \ 同时指向的原始多路委托产生任何影响。这使得代码是线程安全的，因为只有一个线程会访问 `localOnChange` 实例，而且如果添加或删除监听器，`OnTemperatureChange`\
  \ 将是一个完全新的实例。\n\n### 同步设计最佳实践\n\n随着多线程编程复杂性的出现，还有几种处理这些复杂性的最佳实践。\n\n#### 避免死锁\n\n\
  同步的引入带来了死锁的可能。当两个或多个线程等待对方释放同步锁时，就会发生死锁。例如，假设线程 1 请求 `_Sync1` 的锁，稍后在释放 `_Sync1`\
  \ 锁之前请求 `_Sync2` 的锁。同时，线程 2 请求 `_Sync2` 的锁，随后在释放 `_Sync2` 锁之前请求 `_Sync1` 的锁。这为死锁埋下了伏。如果线程\
  \ 1 和线程 2 在获取第二个锁之前都成功获取了它们的初始锁（分别为 `_Sync1` 和 `_Sync2`），则会发生死锁。\n\n死锁的发生，必须满足四个基本条件：\n\
  \n1. *互斥性*：一个线程（`Thread A`）独占一个资源，使得其他任何线程（`Thread B`）无法获取相同的资源。\n2. *持有并等待*：一个持有互斥线程（`Thread\
  \ A`）正在等待另一个线程（`Thread B`）持有的资源。\n3. *不可剥夺性*：线程（`Thread A`）持有的资源不能被强制移除。\n4. *循环等待*：两个或多个线程形成环形链，每个线程都在等待链中下一个线程持有的资源。\n\
  \n移除这些条件中的任何一个都可以防止死锁。\n\n一种可能导致死锁的场景是两个或多个线程请求同一个或多个同步目标（资源）的所有权，且锁的顺序不同。当开发者仔细确保多次锁获取始终以相同的顺序发生时，就可以避免这种情况。另一个死锁的潜在原因是锁不是**重入的**。当来自一个线程的锁阻塞该线程本身——即当它重新请求相同的锁时——该锁就不是重入的。例如，如果\
  \ `Thread A` 获取了锁，然后重新请求相同的锁，但由于该锁已被占用（由它自己）而被阻塞，则该锁不是重入的。\n\n`lock` 关键字生成的代码（使用底层的\
  \ `Monitor` 类）是重入的。然而，正如我们将在“更多同步类型”节看到的，某些锁类型不是重入的。\n\n#### 何时提供同步\n\n\n\n\n\n\
  在不损害数据完整性的前提下，程序员应尽可能避免不必要的同步。例如，您应该在线程之间使用不可变类型，这样就不需要任何同步操作（这种方法在 `F#` 等函数式编程语言中被证明是非常价值的）。同样，您应该避免对线程安全的操作加锁，例如小于原生（指针大小）整数的数值进行简单读写，因为此类操作是自动原子的。\n\
  \n## 更多同步类型\n\n除了 `System.Threading.Monitor` 和 `System.Threading.Interlocked` 之外，还有其他同步技术可用。\n\
  \n### 使用 `System.Threading.Mutex`\n\n`Begin 2.0`\n\n`System.Threading.Mutex` 在概念上与\
  \ `System.Threading.Monitor` 类相似（不支持 `Pulse()` 方法），不同之处在于 `lock` 关键字没有使用它，并且 `Mutex`\
  \ 可以被命名，以便支持跨进程的同步。通过使用 `Mutex` 类，你可以同步对文件或其他某些跨进程资源的访问。由于 `Mutex` 是跨进程资源，.NET 2.0\
  \ 增加了相关支持，允许通过 `System.Security.AccessControl.MutexSecurity` 对象设置访问控制。`Mutex` 类的一个用途是限制应用程序使其无法同时运行多次，如\
  \ 列表 22.9 所示。\n\n**列表 22.9：创建单实例应用程序**\n\n点击此处查看代码图像\n\n```\nusing System;\n\nusing\
  \ System.Threading;\n\nusing System.Reflection;\n\npublic class Program\n{\n\n \
  \ public static void Main()\n  {\n\n      // 从完整的程序集名称获取互斥名称\n\n      string mutexName\
  \ =\n          Assembly.GetEntryAssembly()!.FullName!;\n\n      // firstApplicationInstance\
  \ 表示这是否是第一个\n      // 应用程序实例\n      using Mutex mutex = new Mutex(false, mutexName,\n\
  \          out bool firstApplicationInstance);\n\n      if(!firstApplicationInstance)\n\
  \      {\n          Console.WriteLine(\n              \"This application is already\
  \ running.\");\n      }\n      else\n      {\n          Console.WriteLine(\"ENTER\
  \ to shut down\");\n          Console.ReadLine();\n      }\n  }\n}\n```\n\n运行应用程序第一个实例的结果显示在\
  \ 输出 22.4 中。\n\n**输出 22.4**\n\n```\nENTER to shut down\n```\n\n在第一个实例仍在运行时运行应用程序第二个实例的结果显示在\
  \ 输出 22.5 中。\n\n**输出 22.5**\n\n点击此处查看代码图像\n\n```\nThis application is already running.\n\
  ```\n\n在这种情况下，应用程序在机器上只能运行一次，即使是由不同的用户启动。要将实例限制为每个用户运行一次，可以在分配 `mutexName` 时将 `System.Environment.UserName`（这需要\
  \ Microsoft .NET Framework 或 .NET Standard 2.0）作为后缀。\n\n`Mutex` 继承自 `System.Threading.WaitHandle`，因此它包含了\
  \ `WaitAll()`、`WaitAny()` 和 `SignalAndWait()` 方法。这些方法允许它自动获取多个锁——这是 `Monitor` 不支持的。\n\
  \n`End 2.0`\n\n### `WaitHandle`\n\n`Mutex` 的基类是 `System.Threading.WaitHandle`。它是\
  \ `Mutex`、`EventWaitHandle` 和 `Semaphore` 同步类使用的基础同步类。`WaitHandle` 上的关键方法是 `WaitOne()`\
  \ 方法，它会阻塞执行，直到 `WaitHandle` 实例被信号或设置。`WaitOne()` 方法包含多个重载，允许无限等待：`void WaitOne()`、毫秒级等待；`bool\
  \ WaitOne(int milliseconds)`；以及 `bool WaitOne(TimeSpan timeout)`（基于 `TimeSpan` 的等待）。返回布尔值的版本将在\
  \ `WaitHandle` 在超时之前发出信号时将返回 `true` 值。\n\n除了 `WaitHandle` 实例方法外，还有两个关键的静态成员：`WaitAll()`\
  \ 和 `WaitAny()`。与它们的实例成员类似，这些静态成员也支持超时。此外，它们接收一个数组形式的 `WaitHandle` 集合，以便它们能够响应来自集合内部的信号。\n\
  \n注意，`WaitHandle` 包含一个实现了 `IDisposable` 的句柄（类型为 `SafeWaitHandle`）。因此，需要确保在 `WaitHandle`\
  \ 不再需要时对其释放（dispose）。\n\n`Begin 4.0`\n\n### 重置事件：`ManualResetEvent` 和 `ManualResetEventSlim`\n\
  \n控制线程中特定指令相对于另一个线程指令执行时间的不确定性的一种方法是使用重置事件（reset events）。尽管使用了*事件（events）*一词，但重置事件与\
  \ C# 委托和事件没有关系。相反，重置事件是一种强制代码等待另一个线程执行，直到该线程发出信号的方法。它们对于测试多线程代码特别有用，因为可以在验证结果之前等待特定的状态。\n\
  \n重置事件的类型有 `System.Threading.ManualResetEvent` 和 Microsoft .NET Framework 4 添加的轻量级版本\
  \ `System.Threading.ManualResetEventSlim`。（正如在接下来的高级主题：优先使用 ManualResetEvent 和信号量而非\
  \ AutoResetEvent 中讨论的，还有第三种类型 `System.Threading.AutoResetEvent`，但程序员应该为了前两种而避免它。）重置事件上的关键方法是\
  \ `Set()` 和 `Wait()`（调用为 `WaitOne()`）。调用 `Wait()` 方法会导致线程阻塞，直到另一个线程调用 `Set()` 或等待超时。列表\
  \ 22.10 展示了它是如何工作的，输出 22.6 显示了结果。\n\n\n\n\n\n```c\nConsole.WriteLine(\n    \"Application\
  \ started....\");\n```\n\n`Task task = new Task(DoWork);`\n\n```c\nConsole.WriteLine(\n\
  \    \"Starting thread....\");\n```\n\n`task.Start();`\n`_DoWorkSignaledResetEvent.Wait();`\n\
  \n```c\nConsole.WriteLine(\n    \"DoWork() started....\");\n```\n\n`_DoWorkSignaledResetEvent.Set();`\n\
  \n```c\nConsole.WriteLine(\n    \"Thread executing...\");\n```\n\n`_MainSignaledResetEvent.Wait();`\n\
  `_MainSignaledResetEvent.Set();`\n`task.Wait();`\n\n```c\nConsole.WriteLine(\n \
  \   \"DoWork() ending....\");\n```\n\n```c\nConsole.WriteLine(\n    \"Thread completed\"\
  )\n```\n\n```c\nConsole.WriteLine(\n    \"Application exiting....\");\n```\n\n4.0\n\
  \n调用重置事件的 `Wait()` 方法（对于 `ManualResetEvent`，该方法被称为 `WaitOne()`）会阻塞调用线程，直到另一个线程发出信号并允许被阻塞的线程继续。`Wait()`/`WaitOne()`\
  \ 包含一个参数（以毫秒为单位或作为 `TimeSpan` 对象），用于指定阻塞的最大时间。当指定了超时时间时，如果在重置事件发出信号之前发生了超时，则 `WaitOne()`\
  \ 的返回值将为 `false`。`ManualResetEvent.Wait()` 还包含一个接受取消令牌的版本，允许像第 19 章中讨论的那样取消请求。\n\
  \n`ManualResetEventSlim` 和 `ManualResetEvent` 的区别在于，后者默认使用内核同步，而前者经过优化，避免了访问内核（除非是作为最后的手段）。因此，`ManualResetEventSlim`\
  \ 的性能更好，尽管它可能会消耗更多的 CPU 周期。出于这个原因，除非需要等待多个事件或跨进程等待，否则你通常应该使用 `ManualResetEventSlim`。\n\
  \n请注意重置事件实现了 `IDisposable`，因此它们在不再需要时应该被释放（dispose）。在列表 22.10 中，我们通过 `using` 语句实现了这一点。（`CancellationTokenSource`\
  \ 包含一个 `ManualResetEvent`，这就是为什么它也实现了 `IDisposable`。）\n\n尽管并不完全相同，但 `System.Threading.Monitor`\
  \ 的 `Wait()` 和 `Pulse()` 方法在某些情况下提供了与重置事件类似的功能。\n\n4.0\n\n### `Semaphore`/`SemaphoreSlim`\
  \ 和 `CountdownEvent`\n\n`Semaphore` 和 `SemaphoreSlim` 的性能差异分别与 `ManualResetEvent`\
  \ 和 `ManualResetEventSlim` 相同。与 `ManualResetEvent`/ManualResetEventSlim` 不同（后者提供一个可以打开或关闭的锁，类似于大门），信号量（semaphore）仅限制\
  \ *N* 次调用同时通过临界区域。信号量本质上维护了一个资源池的计数。当此计数达到零时，它会阻塞对资源池的进一步访问，直到其中一个资源被返回，供队列中的下一个被阻塞请求使用。\n\
  \n`CountdownEvent` 的行为类似于信号量，但它实现的是相反的同步。也就是说，它不是防止对已耗尽资源池的进一步访问，而是 `CountdownEvent`\
  \ 仅在计数达到零时允许访问。例如，考虑一个下载大量股票报价的并行操作。只有当所有报价都下载完成后，特定的搜索算法才能执行。`CountdownEvent` 可用于同步搜索算法，在每个股票下载时时递减计数，然后在计数达到零时释放搜索以开始。\n\
  \n开始 5.0 结束 5.0\n\n注意 `SemaphoreSlim` 和 `CountdownEvent` 是随着 Microsoft .NET Framework\
  \ 4 引入的。在 .NET 4.5 中，前者包含一个 `SemaphoreSlim.WaitAsync()` 方法，以便在等待进入信号量时可以使用基于任务的异步模式\
  \ (TAP)。\n\n### 并发集合类 (Concurrent Collection Classes)\n\n另一组随 Microsoft .NET Framework\
  \ 4 引入的类是并发集合类。这些类经过专门设计，包含了内置的同步代码，以便支持多个线程的并发访问，而无需担心竞态条件。表 22.4 描述了这些并发集合类。\n\
  \n4.0\n\n| 集合类 | 描述 |\n| --- | --- |\n| `BlockingCollection<T>` | 提供一种阻塞集合，允许生产者/消费者场景，其中生产者向集合写入数据，而消费者读取数据。该类提供了一种泛型集合类型，可以同步添加和删除操作，而无需担心后端存储（无论是队列、栈、列表还是其他）。`BlockingCollection<T>`\
  \ 为实现 `IProducerConsumerCollection<T>` 接口的集合提供了阻塞和边界支持。 |\n| `ConcurrentBag<T>`*](#ch22.xhtml_ch22tab04_fn1a)\
  \ | 一种 `T` 类型对象的线程安全无序集合。 |\n| `ConcurrentDictionary<TKey,TValue>` | 一种线程安全的字典；键值对集合。\
  \ |\n| `ConcurrentQueue<T>`*](#ch22.xhtml_ch22tab04_fn1a) | 一种支持 `T` 类型对象先进先出 (FIFO)\
  \ 语义的线程安全队列。 |\n| `ConcurrentStack<T>`*](#ch22.xhtml_ch22tab04_fn1a) | 一种支持 `T`\
  \ 类型对象后进先出 (FILO) 语义的线程安全栈。 |\n\n**表 22.4: 并发集合类**](#ch22.xhtml_ch22tab04_fn1) 实现\
  \ `IProducerConsumerCollection<T>` 的集合类。并发集合的一种常见模式是支持生产者和消费者的安全访问。实现 `IProducerConsumerCollection<T>`\
  \ 的类允许一个或多个类向集合注入数据，同时另一组类读取数据。数据添加和删除的顺序由具体的集合类决定。\n\n尽管 .NET Core 没有内置，但可以通过 NuGet\
  \ 包获取额外的不可变集合库，名为 `System.Collections.Immutable`。不可变集合的优势在于可以在线程之间自由传递，无需担心死锁或中间更新。由于不可变集合不可修改，不会发生中间更新；因此此类集合是线程安全的（无需锁定访问）。\n\
  \n4.0\n\n#### 线程本地存储 (Thread Local Storage)\n\n在某些情况下，使用同步锁会导致不可接受的性能和扩展性限制。在其他实例，对特定数据元素提供同步可能太复杂，特别是是在编码完成后添加的。\n\
  \n同步的另一种解决方案是隔离，而实现隔离的方法是线程本地存储。通过线程本地存储，每个线程都有自己的专用变量实例。在这种情况下，不需要同步，因为同步数据没有意义。线程本地存储实现的两个示例是\
  \ `ThreadLocal<T>` 和 `ThreadAttribute`。\n\n###### `ThreadLocal<T>`\n\n在 Microsoft\
  \ .NET Framework 4 或更高版本中使用线程本地存储涉及声明一个类型为 `ThreadLocal<T>` 的字段（在编译器闭包的情况下为变量）。结果是每个线程都有该字段的不同实例，如列表\
  \ 22.11 和输出 22.7 所示。注意，即使字段是静态的，也存在不同的实例。\n\n4.0\n\n**列表 22.11: 使用 `ThreadLocal<T>`\
  \ 实现线程本地存储**\n\n点击此处查看代码图像\n\n\n\n\n\n```cs\nusing System;\n\nusing System.Threading;\n\
  \npublic class Program\n{\n\n  static ThreadLocal<double> _Count =             \
  \                    \n      new ThreadLocal<double>(() => 0.01134);           \
  \              \n\n  public static double Count\n  {\n      get { return _Count.Value;\
  \ }\n      set { _Count.Value = value; }\n  }\n\n  public static void Main()\n \
  \ {\n      Thread thread = new Thread(Decrement);\n      thread.Start();\n\n   \
  \   // Increment\n      for(double i = 0; i < short.MaxValue; i++)\n      {\n  \
  \        Count++;\n      }\n\n      thread.Join();\n\n      Console.WriteLine(\"\
  Main Count = {0}\", Count);\n  }\n\n  static void Decrement()\n  {\n      Count\
  \ = -Count;\n      for (double i = 0; i < short.MaxValue; i++)\n      {\n\n    \
  \      Count--;\n      }\n\n      Console.WriteLine(\n          \"Decrement Count\
  \ = {0}\", Count);\n  }\n\n}\n```\n\n**输出 22.7**\n\n点击此处查看代码图像\n\n```\nDecrement\
  \ Count = -32767.01134\n\nMain Count = 32767.01134\n```\n\n如输出 22.7 所示，执行 `Main()`\
  \ 的线程的 `Count` 值永远不会被执行 `Decrement()` 的线程递减。对于执行 `Main()` 的线程，初始值为 `0.01134`，最终值为\
  \ `32767.01134`。`Decrement()` 具有相似的值，只是它们是负数。由于 `Count` 是基于 `ThreadLocal<T>` 类型的静态字段，运行\
  \ `Main()` 的线程和运行 `Decrement()` 的线程在 `_Count.Value` 中存储有独立的值。\n\n`结束 4.0`\n\n##\
  \ 使用 `ThreadStaticAttribute` 的线程本地存储\n\n如列表 22.12 所示，通过在静态字段上标记 `ThreadStaticAttribute`\
  \ 是将静态变量指定为每个线程实例的第二种方法。这种技术相对于 `ThreadLocal<T>` 有一些注意事项，但它的优点是它在 Microsoft .NET\
  \ Framework 4 之前就可用。（此外，由于 `ThreadLocal<T>` 基于 `ThreadStaticAttribute`，在足够频繁的小循环迭代中，它会消耗更少的内存并提供略微的性能优势）。\n\
  \n**列表 22.12：使用 `ThreadStaticAttribute` 进行线程本地存储**\n\n点击此处查看代码图像\n\n```cs\nusing\
  \ System;\n\nusing System.Threading;\n\npublic class Program\n{\n\n    [ThreadStatic]\n\
  \    static double _Count = 0.01134;\n\n    public static double Count\n    {\n\
  \        get { return Program._Count; }\n        set { Program._Count = value; }\n\
  \    }\n\n    public static void Main()\n    {\n        Thread thread = new Thread(Decrement);\n\
  \        thread.Start();\n\n        // Increment\n        for(int i = 0; i < short.MaxValue;\
  \ i++)\n        {\n            Count++;\n        }\n\n        thread.Join();\n\n\
  \        Console.WriteLine(\"Main Count = {0}\", Count);\n    }\n\n    static void\
  \ Decrement()\n    {\n        for(int i = 0; i < short.MaxValue; i++)\n        {\n\
  \            Count--;\n        }\n\n        Console.WriteLine(\"Decrement Count\
  \ = {0}\", Count);\n    }\n\n}\n```\n\n列表 22.12 的结果出现在输出 22.8 中。\n\n**输出 22.8**\n\
  \n点击此处查看代码图像\n\n```\nDecrement Count = -32767\n\nMain Count = 32767.01134\n```\n\
  \n如列表 22.11 所示，执行 `Main()` 的线程的 `Count` 值永远不会被执行 `Decrement()` 的线程递减。对于执行 `Main()`\
  \ 的线程，初始值为负的 `_Total`，最终值为 `0`。换句话说，使用 `ThreadStaticAttribute`，每个线程的 `Count` 值都是特定于线程的，无法跨线程访问。\n\
  \n请注意，与列表 22.11 不同，递减计数显示的值没有小数数字，这表明它从未被初始化为 `0.01134`。虽然 `_Count` 的值在声明期间被赋值了——在此示例中为\
  \ `private double _Count = 0.01134`——但只有与运行静态构造函数的线程相关的线程静态实例才会被初始化。在列表 22.12 中，只有执行\
  \ `Main()` 的线程会将其线程本地存储变量初始化为 `0.01134`。`Decrement()` 递减的 `_Count` 值将始终被初始化为 `0`（因为它是\
  \ `default(double)`）。\n\n`开始 5.0`\n\n### 计时器\n\n在某些情况下，需要延迟代码执行一段特定时间，或者在特定时间后注册通知。示例包括在数据频繁变化时，按间隔刷新屏幕而不是立即刷新。实现计时器的一种方法是利用\
  \ C# 5.0 提供的 `async/await` 模式以及 .NET 4.5 添加的 `Task.Delay()` 方法。正如我们在第 19 章中指出的，TAP\
  \ 的核心特性是 `async` 调用后执行的代码将在支持的线程上下继续，从而避免任何 UI 跨线程问题。列表 22.13 提供了如何使用 `Task.Delay()`\
  \ 方法的示例。\n\n```cs\nusing System;\n\nusing System.Threading.Tasks;\n\npublic class\
  \ Pomodoro\n{\n  // ...\n\n  private static async Task TickAsync(\n      System.Threading.CancellationToken\
  \ token)\n  {\n      for(int minute = 0; minute < 25; minute++)\n      {\n     \
  \     DisplayMinuteTicker(minute);\n          for(int second = 0; second < 60; second++)\n\
  \          {\n              await Task.Delay(1000);\n              if(token.IsCancellationRequested)\
  \ break;\n              DisplaySecondTicker();\n          }\n          if(token.IsCancellationRequested)\
  \ break;\n      }\n  }\n\n}\n```\n\n对 `Task.Delay(1000)` 的调用将设置一个倒计时计时器，该计时器将在 1\
  \ 秒后触发并执行其后的后续代码。\n\n\n\n\n\n幸运的是，在 `C# 5.0` 中，`TAP` 对同步上下文的使用专门解决了 UI 相关代码专门在 UI\
  \ 线程上执行的问题。在此之前，必须使用特定的 UI 线程安全的（或可以配置为此类）计时器类。例如 `System.Windows.Forms.Timer`、`System.Windows.Threading.DispatcherTimer`\
  \ 和 `System.Timers.Timer`（如果配置恰当）都是 UI 线程友好的。其他的，如 `System.Threading.Timer`，则是针对性能优化的。\n\
  \n`结束 5.0`\n\n### 总结\n\n在本章中，我们查看了各种同步机制，并看到可以使用各种类来防止竞态条件。内容涵盖了 `lock` 关键字，它在底层利用了\
  \ `System.Threading.Monitor`。其他同步类包括 `System.Threading.Interlocked`、`System.Threading.Mutext`、`System.Threading.WaitHandle`、可重置事件、信号量以及并发集合类。\n\
  \n尽管从 `.NET` 早期版本到今天在改进多线程编程方面取得了巨大进展，但多线程编程的同步仍然复杂，有许多陷阱等待着疏忽的开发者。为了避免这些沙阱，已经确定了一些最佳实践，包括始终以相同的顺序获取同步目标，以及用同步逻辑封装静态成员。\n\
  \n在结束本章之前，我们考虑了 `Task.Delay()` 方法，这是 `.NET 4.5` 引入的用于实现基于 `TAP` 计时器的 API。\n\n下一章将研究另一种复杂的\
  \ `.NET` 技术：使用 `P/Invoke` 将调用从 `.NET` 导出并进入非托管代码。此外，它还引入了名为 `unsafe code` 的概念，`C#`\
  \ 使用它来直接访问内存指针，就像非托管代码那样（例如 `C++`）。\n\n## 23 平台互操作性与不安全代码\n\n`C#` 具有强大的能力，特别是考虑到底层框架完全是托管的时。然而，有时你需要逃离\
  \ `C#` 提供的所有安全性，回到内存地址和指针的世界。`C#` 通过两种主要方式支持此操作。第一种选择是通过平台调用 (`P/Invoke`) 并调用由非托管动态链接库（DLLs）暴露的\
  \ API。第二种方法是通过 `unsafe code`，它允许访问内存指针和地址。\n\n![一张图描述了平台互操作性和不安全编码方法。](img/23mindmap.jpg)\n\
  \n本章大部分讨论了与非托管代码的互操作性以及 `unsafe code` 的使用。这些讨论以一个确定计算机处理器 ID 的程序结束。该代码要求你执行以下操作：\n\
  \n1. 调用操作系统 DLL 并请求分配部分内存用于执行指令。\n2. 将一些汇编指令写入分配的区域。\n3. 在汇编指令中注入一个地址位置。\n4. 执行汇编代码。\n\
  \n除了此处涵盖的 `P/Invoke` 和 `unsafe` 结构外，完整的列表展示了 `C#` 的完整威力，以及非托管代码的能力仍然可以从 `C#` 和托管代码访问。\n\
  \n### 平台调用\n\n无论开发者是尝试调用现有的非托管代码库、访问操作系统中未在任何托管 API 中暴露的非托管代码，还是试图通过避免类型检查和垃圾回收的运行时开销为算法实现最高性能，在某一点必须存在对非托管代码的调用。通用语言基础\
  \ (`CLI`) 通过 `P/Invoke` 提供了这种能力。通过 `P/Invoke`，你可以对非托管 DLL 导出的函数进行 API 调用。\n\n在本节中调用的\
  \ API 是 Windows API。虽然相同的 API 在其他平台上不可用，但开发者仍然可以使用 `P/Invoke` 调用其操作系统原生的 API，或调用他们自己的\
  \ DLL。指南和语法是相同的。\n\n#### 声明外部函数\n\n一旦确定了目标函数，`P/Invoke` 的下一步就是用托管代码声明该函数。就像所有属于某个类的普通方法一样，你需要在类的上下文中声明目标\
  \ API，但要使用 `extern` 修饰符。列表 23.1 展示了如何进行操作。\n\n**列表 23.1: 声明外部方法**\n\n点击此处查看代码图像\n\
  \n```\nusing System;\n\nusing System.Runtime.InteropServices;\n\nclass VirtualMemoryManager\n\
  {\n  [DllImport(\"kernel32.dll\", EntryPoint=\"GetCurrentProcess\")]\n  internal\
  \ static extern IntPtr GetCurrentProcessHandle();\n}\n```\n\n在这种情况下，类是 `VirtualMemoryManager`，因为它将包含与内存管理相关的函数。（此特定函数可以直接从\
  \ `System.Diagnostics.Processor` 类获取，因此无需在实际代码中声明它。）注意，该方法返回 `IntPtr`；该类型将在下一节中解释。\n\
  \n`extern` 方法从不包含任何体，并且（几乎）总是静态的。相反，方法体是伴随方法声明的 `DllImport` 属性指向实现部分。至少，该属性需要定义函数的\
  \ DLL 名称。运行时会根据方法名确定函数名，尽管你可以通过使用 `EntryPoint` 命名参数提供函数名来覆盖此默认值。（`.NET` 框架将自动尝试调用\
  \ Unicode [`...W`] 或 ASCII [`...A`] 的 API 版本。）\n\n在这种情况下，外部函数 `GetCurrentProcess()`\
  \ 获取当前进程的伪句柄（pseudohandle），你将在内存分配的调用中使用它。这里是非托管声明：\n\n```\nHANDLE GetCurrentProcess();\n\
  ```\n\n#### 参数类型\n\n假设开发者已确定了目标 DLL 和导出函数，最困难的一步是识别或创建与外部函数中的非托管类型对应的托管数据类型。列表 23.2\
  \ 显示了一个更复杂的 API。\n\n声明 Win32 API 时一个非常有用的资源是 [`www.pinvoke.net`](http://www.pinvoke.net)。它为许多\
  \ API 提供了一个很好的起点，帮助你避免从零编写外部 API 调用时可能出现的一些问题。\n\n**列表 23.2: `VirtualAllocEx()`\
  \ API**\n\n点击此处查看代码图像\n\n```\nLPVOID VirtualAllocEx(\n    HANDLE hProcess,     \
  \   // 进程的句柄。函数\n                            // 在此进程的虚拟地址空间\n                  \
  \          // 内分配内存。\n    LPVOID lpAddress,       // 指向想要分配的页\n                \
  \            // 区域所需的起始地址的指针。\n                            // 如果 lpAddress 为 NULL，函数决定\n\
  \                            // 在何分配区域。\n    SIZE_T dwSize,          // 要分配的内存区域的大小，\n\
  \                            // 单位为字节。如果 lpAddress\n                           \
  \ // 为 NULL，函数会将 dwSize 向上\n                            // 圆整到页边界。\n    DWORD flAllocationType,\
  \ // 内存分配类型\n    DWORD flProtect);       // 内存保护类型\n);\n```\n\n\n\n\n\n`VirtualAllocEx()`\
  \ 分配操作系统专门指定用于执行或数据的虚拟内存。要调用它，你需要在托管代码中为每个数据类型提供相应的定义；虽然这些在 Win32 编程中很常见，但 `HANDLE`、`LPVOID`、`SIZE_T`\
  \ 和 `DWORD` 在 CLI 托管代码中并未定义。因此，C# 中 `VirtualAllocEx()` 的声明如列表 23.3 所示。\n\n**列表 23.3：在\
  \ C# 中声明 `VirtualAllocEx()` API**\n\n点击此处查看代码图像\n\n```c\nusing System;\n\nusing\
  \ System.Runtime.InteropServices;\n\nclass VirtualMemoryManager\n{\n  [DllImport(\"\
  kernel32.dll\")]\n  internal static extern IntPtr GetCurrentProcess();\n\n  [DllImport(\"\
  kernel32.dll\", SetLastError = true)]\n  private static extern IntPtr VirtualAllocEx(\n\
  \      IntPtr hProcess,\n      IntPtr lpAddress,\n      IntPtr dwSize,\n      AllocationType\
  \ flAllocationType,\n      uint flProtect);\n}\n```\n\n托管代码的一个显著特征是原始数据类型（如 `int`）不会根据处理器改变其大小。无论处理器是\
  \ 16 位、32 位还是 64 位，`int` 始终是 32 位。然而，在非托管代码中，内存指针会根据处理器而变化。因此，不需要将 `HANDLE` 和 `LPVOID`\
  \ 等类型简单映射为 `int`，而是需要映射到 `System.IntPtr`，其大小将根据处理器内存布局而变化。此示例还使用了 `AllocationType`\
  \ 枚举，我们将在本章稍后的“使用封装器简化 API 调用”节中讨论它。\n\n关于列表 23.3 一个值得注意的点是，`IntPtr` 不仅用于指针——也就是说，它也用于数量其他其他。`IntPtr`\
  \ 并不仅仅意味着“存储在整数中的指针”，它意味着“大小与指针相同的整数”。`IntPtr` 不一定包含指针，只需要包含一个与指针大小的内容。很多事物的大小与指针相同，但它们实际上并不是指针。\n\
  \n### 使用 `ref` 而非指针\n\n非托管代码经常使用指针作为引用传递参数。在这些情况下，P/Invoke 并不要求你将数据类型映射到托管代码中的指针。相反，你将相应的参数映射到\
  \ `ref`（或 `out`，取决于参数是 `in`/`out` 还是仅 `out`）。在列表 23.4 中，`lpflOldProtect` 的数据类型为\
  \ `PDWORD`，它返回“指向变量的指针，该变量接收指定页区域中第一页之前的访问保护属性”。^(2)\n\n2。MSDN 文档。\n\n**列表 23.4：使用\
  \ `ref` 和 `out` 而非指针**\n\n点击此处查看代码图像\n\n```csharp\nclass VirtualMemoryManager\n\
  {\n  // ...\n\n  [DllImport(\"kernel32.dll\", SetLastError = true)]\n  static extern\
  \ bool VirtualProtectEx(\n      IntPtr hProcess, IntPtr lpAddress,\n      IntPtr\
  \ dwSize, uint flNewProtect,\n      ref uint lpflOldProtect);\n}\n```\n\n尽管 `lpflOldProtect`\
  \ 被记录为 `[out]`（尽管签名并未强制要求），但描述也提到该参数必须指向有效变量而不能为 `NULL`。这种不一致性令人困惑，但很常见。指南是针对 P/Invoke\
  \ 类型参数使用 `ref` 而不是 `out`，因为调用者始终可以忽略通过 `ref` 传递的数据，但反之则不一定成功。\n\n其他参数与 `VirtualAllocEx()`\
  \ 几乎相同，不同在于 `lpAddress` 是从 `VirtualAllocEx()` 返回的地址。此外，`flNewProtect` 指定了精确的内存保护类型：页执行、页只读等。\n\
  \n### 使用 `StructLayoutAttribute` 进行顺序布局\n\n某些 API 涉及没有对应托管类型的类型。调用这些类型需要在一个托管代码中重新声明该类型。例如，你可以在托管代码中声明非托管的\
  \ `COLORREF` 结构体（参见列表 23.5）。\n\n**列表 23.5：从非托管结构体声明类型**\n\n点击此处查看代码图像\n\n```csharp\n\
  [StructLayout(LayoutKind.Sequential)]\nstruct ColorRef\n{\n  public byte Red;\n\
  \  public byte Green;\n  public byte Blue;\n\n  // 关闭关于未访问 Unused 的警告\n  #pragma\
  \ warning disable 414\n  private byte Unused;\n  #pragma warning restore 414\n\n\
  \  public ColorRef(byte red, byte green, byte blue)\n  {\n      Blue = blue;\n \
  \     Green = green;\n      Red = red;\n      Unused = 0;\n  }\n}\n```\n\n各种 Microsoft\
  \ Windows API 使用 `COLORREF` 来表示 RGB 颜色（即红色、绿色和蓝色）。\n\n列表 23.5 声明的关键是 `StructLayoutAttribute`。默认情况下，托管代码可以优化内存布局，因此字段之间的布局可能不是顺序的。为了强制顺序布局，以便类型可以在托管代码和非托管代码之间直接进行逐位拷贝（blitted），你需要添加带有\
  \ `LayoutKind.Sequential` 枚举值的 `StructLayoutAttribute`。（这在从文件流写入和读取预期顺序布局的数据时有用。）\n\
  \n由于非托管 (C++) 的 `struct` 定义没有映射到 C# 定义，因此没有非托管结构体到托管结构体的直接映射。相反，开发者应该遵循关于类型应该是值类型还是引用类型的\
  \ C# 惯例，以及大小是否较小（约小于 16 字节）。\n\n### 错误处理\n\nWin32 API 编程的一个不利之处在于 API 经常以不一致的方式报告错误。例如，某些\
  \ API 返回值（`0`、`1`、`false` 等）来指示错误，而其他 API 则以某种方式设置 `out` 参数。此外，错误的细节需要额外调用 `GetLastError()`\
  \ API，然后再次调用 `FormatMessage()` 来获取与错误对应的消息。总之，非托管代码中的错误报告很少通过异常发生。\n\n幸运的是，P/Invoke\
  \ 设计者提供了一种错误处理机制。要启用它，如果 `DllImport` 属性的命名参数 `SetLastError` 为 `true`，则可以在 P/Invoke\
  \ 调用后立即实例化 `System.ComponentModel.Win32Exception()`，该异常将使用 Win32 错误数据自动初始化（参见列表\
  \ 23.6）。\n\n**列表 23.6：Win32 错误处理**\n\n点击此处查看代码图像\n\n\n\n\n\n```c\nclass VirtualMemoryManager\n\
  {\n  [DllImport(\"kernel32.dll\", \", SetLastError = true)]\n  private static extern\
  \ IntPtr VirtualAllocEx(\n      IntPtr hProcess,\n      IntPtr lpAddress,\n    \
  \  IntPtr dwSize,\n      AllocationType flAllocationType,\n      uint flProtect);\n\
  \  // ...\n  [DllImport(\"kernel32.dll\", SetLastError = true)]\n  static extern\
  \ bool VirtualProtectEx(\n      IntPtr hProcess, IntPtr lpAddress,\n      IntPtr\
  \ dwSize, uint flNewProtect,\n      ref uint lpflOldProtect);\n\n  [Flags]\n  private\
  \ enum AllocationType : uint\n  {\n      // ...\n  }\n\n  [Flags]\n  private enum\
  \ ProtectionOptions\n  {\n      // ...\n  }\n\n  [Flags]\n  private enum MemoryFreeType\n\
  \  {\n      // ...\n  }\n\n  public static IntPtr AllocExecutionBlock(\n      int\
  \ size, IntPtr hProcess)\n  {\n      IntPtr codeBytesPtr;\n      codeBytesPtr =\
  \ VirtualAllocEx(\n          hProcess, IntPtr.Zero,\n          (IntPtr)size,\n \
  \         AllocationType.Reserve | AllocationType.Commit,\n          (uint)ProtectionOptions.PageExecuteReadWrite);\n\
  \      if (codeBytesPtr == IntPtr.Zero)\n      {\n          throw new System.ComponentModel.Win32Exception();\n\
  \      }\n      uint lpflOldProtect = 0;\n      if (!VirtualProtectEx(\n       \
  \   hProcess, codeBytesPtr,\n          (IntPtr)size,\n          (uint)ProtectionOptions.PageExecuteReadWrite,\n\
  \          ref lpflOldProtect))\n      {\n          throw new System.ComponentModel.Win32Exception();\n\
  \      }\n      return codeBytesPtr;\n  }\n\n  public static IntPtr AllocExecutionBlock(int\
  \ size)\n  {\n      return AllocExecutionBlock(\n          size, GetCurrentProcessHandle());\n\
  \  }\n}\n```\n\n这段代码允许开发者为每个 API 提供自定义的错误检查，同时仍能以标准方式报告错误。\n\n代码列表 23.1 和 23.3 将\
  \ P/Invoke 方法声明为内部或私有。除了最简单的 API 之外，使用公共包装器封装方法以减少 P/Invoke API 调用的复杂性是一个良好的准则，它增加了\
  \ API 的易用性并向面向对象的类型结构迈进。代码列表 23.6 中的 `AllocExecutionBlock()` 声明提供了这种方法的良好示例。\n\n\
  ### 使用 `SafeHandle`\n\n通常，P/Invoke 涉及某种资源（例如句柄），代码在使用后需要清理它。与其要求开发者记住这一步骤是必要的并在每次手动编写代码，不如提供一个实现\
  \ `IDisposable` 和析构函数的类会有帮助。例如，在代码列表 23.7 中，`VirtualAllocEx()` 和 `VirtualProtectEx()`\
  \ 返回的地址需要后续调用 `VirtualFreeEx()`。为为此过程提供内置支持，你定义了一个派自 `System.Runtime.InteropServices.SafeHandle`\
  \ 的 `VirtualMemoryPtr` 类。\n\n`开始 2.0`\n\n**代码列表 23.7：使用 `SafeHandle` 的托管资源**\n\n\
  点击此处查看代码图像\n\n```c\npublic class VirtualMemoryPtr :\n  System.Runtime.InteropServices.SafeHandle\n\
  {\n  public VirtualMemoryPtr(int memorySize) :\n      base(IntPtr.Zero, true)\n\
  \  {\n      _ProcessHandle =\n          VirtualMemoryManager.GetCurrentProcessHandle();\n\
  \      _MemorySize = (IntPtr)memorySize;\n      _AllocatedPointer =\n          VirtualMemoryManager.AllocExecutionBlock(\n\
  \          memorySize, ProcessHandle);\n      _Disposed = false;\n  }\n  public\
  \ readonly IntPtr _AllocatedPointer;\n  readonly IntPtr _ProcessHandle;\n  readonly\
  \ IntPtr _MemorySize;\n  bool _Disposed;\n  public static implicit operator IntPtr(\n\
  \      VirtualMemoryPtr virtualMemoryPointer)\n  {\n      return virtualMemoryPointer.AllocatedPointer;\n\
  \  }\n  // SafeHandle 抽象成员\n  public override bool IsInvalid\n  {\n      get\n \
  \     {\n          return _Disposed;\n      }\n  }\n  // SafeHandle 抽象成员\n  protected\
  \ override bool ReleaseHandle()\n  {\n      if (!_Disposed)\n      {\n         \
  \ _Disposed = true;\n          GC.SuppressFinalize(this);\n          VirtualMemoryManager.VirtualFreeEx(_ProcessHandle,\n\
  \              _AllocatedPointer, _MemorySize);\n      }\n      return true;\n \
  \ }\n}\n```\n\n`System.Runtime.InteropServices.SafeHandle` 包含了抽象成员 `IsInvalid` 和\
  \ `ReleaseHandle()`。你将清理代码放在后者中；前者指示此代码是否已经执行。\n\n通过 `VirtualMemoryPtr`，你只需通过实例化该类型并指定所需的内存分配即可分配内存。\n\
  \n`结束 2.0`\n\n### 调用外部函数\n\n一旦声明了 P/Invoke 函数，你就可以像调用其他类成员一样调用它们。然而，关键在于导入的 DLL\
  \ 必须在路径中（包括可执行文件目录），以便能够成功加载。代码列表 23.6 和 23.7 演示了这种方法。但是，它们依赖于某些常量。\n\n由于 `flAllocationType`\
  \ 和 `flProtect` 是标志位，因此为每个标志位提供常量或枚举是一个良好的实践。与其期望调用者定义这些常量或枚举，封装性建议你将其作为 API 声明的一部分提供出来，如[代码列表\
  \ 23.8](#ch23.xhtml_ch23ex08）所示。\n\n\n\n\n\n```cs\nclass VirtualMemoryManager\n\
  {\n  // ...\n\n  /// <summary>\n  /// 内存分配的类型。此参数必须\n  /// 包含以下值之一。\n  /// </summary>\n\
  \  [Flags]\n  private enum AllocationType : uint\n  {\n      /// <summary>\n   \
  \   /// 为指定的预留内存页在内存或磁盘上的分页文件\n      /// 中分配物理存储。该函数将内存初始化为零。\n      /// </summary>\n\
  \      Commit = 0x1000,\n      /// <summary>\n      /// 预留进程虚拟地址空间的一个范围，而不\n   \
  \   /// 在内存或磁盘上的分页文件中分配任何实际的物理存储。\n      /// </summary>\n      Reserve = 0x2000,\n\
  \      /// <summary>\n      /// 表示由 lpAddress 和 dwSize 指定的内存范围内的数据\n      /// 不再需要。这些页不应从分页文件读取或写入。\n\
  \      /// 然而，该内存块稍后会被再次使用，因此\n      /// 不应取消提交（decommitted）。此值不能与任何其他值一起使用。\n \
  \     /// </summary>\n      Reset = 0x80000,\n      /// <summary>\n      /// 分配具有读写访问权限的物理内存。\n\
  \      /// 此值专门用于地址窗口扩展\n      /// (AWE) 内存。\n      /// </summary>\n      Physical\
  \ = 0x400000,\n      /// <summary>\n      /// 在可能的最高地址分配内存。\n      /// </summary>\n\
  \      TopDown = 0x100000,\n  }\n\n  /// <summary>\n  /// 待分配页区域的内存保护选项。\n  ///\
  \ </summary>\n  [Flags]\n  private enum ProtectionOptions : uint\n  {\n      ///\
  \ <summary>\n      /// 允许对提交的区域进行执行访问。\n      /// 尝试读取或写入提交区域将导致访问冲突（access violation）。\n\
  \      /// </summary>\n      Execute = 0x10,\n      /// <summary>\n      /// 允许对提交的区域进行执行和读取访问。\n\
  \      /// 尝试写入提交区域将导致访问冲突（access violation）。\n      /// </summary>\n      PageExecuteRead\
  \ = 0x20,\n      /// <summary>\n      /// 允许对提交的区域进行执行、读取和写入访问。\n      /// </summary>\n\
  \      PageExecuteReadWrite = 0x40,\n      // ...\n  }\n\n  /// <summary>\n  ///\
  \ 释放操作的类型。\n  /// </summary>\n  [Flags]\n  private enum MemoryFreeType : uint\n\
  \  {\n      /// <summary>\n      /// 取消指定提交页的提交。\n      /// 在操作之后，页处于预留状态（reserved）。\n\
  \      /// </summary>\n      Decommit = 0x4000,\n      /// <summary>\n      ///\
  \ 释放指定的页区域。在此操作之后，\n      /// 页处于释放状态（free）。\n      /// </summary>\n      Release\
  \ = 0x8000\n  }\n  // ...\n}\n```\n\n枚举（enums）的优点是它们将各种值组合在一起。此外，它们可以将范围限制在这些值之外的任何地方。\n\
  \n### 使用包装器简化 API 调用\n\n无论侧重于错误处理、结构体还是常量值，有效的 API 开发人员的一个目标是提供一个简化的托管 API 来封装底层的\
  \ Win32 API。例如，列表 23.9 重载了 `VirtualFreeEx()`，并提供了简化调用的公共版本。\n\n**列表 23.9：封装底层 API**\n\
  \n点击此处查看代码图像\n\n```cs\nclass VirtualMemoryManager\n{\n  // ...\n\n  [DllImport(\"\
  kernel32.dll\", SetLastError = true)]\n  static extern bool VirtualFreeEx(\n   \
  \   IntPtr hProcess, IntPtr lpAddress,\n      IntPtr dwSize, IntPtr dwFreeType);\n\
  \  public static bool VirtualFreeEx(\n      IntPtr hProcess, IntPtr lpAddress,\n\
  \      IntPtr dwSize)\n  {\n      bool result = VirtualFreeEx(\n          hProcess,\
  \ lpAddress, dwSize,\n          (IntPtr)MemoryFreeType.Decommit);\n      if (!result)\n\
  \      {\n          throw new System.ComponentModel.Win32Exception();\n      }\n\
  \      return result;\n  }\n  public static bool VirtualFreeEx(\n      IntPtr lpAddress,\
  \ IntPtr dwSize)\n  {\n      return VirtualFreeEx(\n          GetCurrentProcessHandle(),\
  \ lpAddress, dwSize);\n  }\n  [DllImport(\"kernel32\", SetLastError = true)]\n \
  \ static extern IntPtr VirtualAllocEx(\n      IntPtr hProcess,\n      IntPtr lpAddress,\n\
  \      IntPtr dwSize,\n      AllocationType flAllocationType,\n      uint flProtect);\n\
  \  // ...\n}\n```\n\n### 函数指针映射到委托\n\n与 P/Invoke 相关的最后一个关键点是，非托管代码中的函数指针映射到托管代码中的委托（delegates）。例如，设置定时器时，你需要提供一个函数指针，定时器在到期后回调该指针。具体来说，你将传递一个与签名匹配的委托实例。\n\
  \n#### 指南\n\n考虑到 P/Invoke 的特殊性，有一些准则可以帮助编写此类代码。\n\n##### 指针和地址\n\n有时，开发者可能需要访问并操作内存。例如，对于某些系统交互或某些类型。此时\
  \ C# 需要使用 `unsafe` 关键字。\n\n##### 不安全代码\n\nC# 的一个伟大特性是它是强类型的，并在运行期间支持类型检查。该特性特别有用的地方在于它可以绕过这些限制并直接操作内存。你会在处理内存映射设备或实现关键算法时这样做。为了支持这一点，将代码部分标记为\
  \ `unsafe`，如列表 23.10 所示。`unsafe` 修饰符对生成的 CIL 没有影响，而是允许编译器在 unsafe 块内允许指针操作指令。此外，unsafe\
  \ 并不意味着非托管。\n\n**列表 23.10：为方法标记不安全**\n\n点击此处查看代码图像\n\n```cs\nclass Program\n{\n\
  \  unsafe static int Main(string[] args)\n  {\n      // ...\n  }\n}\n```\n\n你可以将\
  \ `unsafe` 作为修饰符用于类型或类型内的成员。此外，C# 允许将 `unsafe` 作为语句，标记代码块以允许不安全代码（参见列表 23.11）。\n\
  \n**列表 23.11：为代码块标记不安全**\n\n点击此处查看代码图像\n\n```cs\nclass Program\n{\n  static int\
  \ Main(string[] args)\n  {\n      unsafe\n      {\n          // ...\n      }\n \
  \ }\n}\n```\n\n`unsafe` 块中的代码可以包含指针等不安全结构。\n\n> 注意：有必要显式指示编译器支持不安全代码。\n\n当你编写不安全代码时，你的代码可能会受到缓冲区溢出及类似结果的影响，可能会导致安全漏洞。因此，有必要显式通知编译器存在不安全代码。为了实现这一点，在\
  \ CSPROJ 文件中将 `AllowUnsafeBlocks` 设置为 `true`，如列表 23.12 所示。\n\n**列表 23.12：无效引用类型示例**\n\
  \n\n\n\n\n```xml\n<Project Sdk=\"Microsoft.NET.Sdk\">\n  <PropertyGroup>\n    <OutputType>Exe</OutputType>\n\
  \    <TargetFramework>netcoreapp1.0</TargetFramework>\n    <ProductName>Chapter20</ProductName>\n\
  \    <WarningLevel>2</WarningLevel>\n    <AllowUnsafeBlocks>True</AllowUnsafeBlocks>\
  \                               \n  </PropertyGroup>\n  <Import Project=\"..\\Versioning.targets\"\
  \ />\n  <ItemGroup>\n    <ProjectReference Include=\"..\\SharedCode\\SharedCode.csproj\"\
  \ />\n  </ItemGroup>\n</Project>\n```\n\n或者，你也可以在运行 `dotnet build` 时通过命令行传递该属性（参见输出\
  \ 23.1）。\n\n**输出 23.1**\n\n点击此处查看代码图像\n\n```bash\ndotnet build /property:AllowUnsafeBlocks=True\n\
  ```\n\n或者，如果直接调用 C# 编译器，你则需要 `/unsafe` 切换开关（参见输出 23.2）。\n\n**输出 23.2**\n\n```bash\n\
  csc.exe /unsafe Program.cs\n```\n\n在 Visual Studio 中，你可以通过勾选 `Build` 选项中的 `Allow\
  \ Unsafe Code` 复选框来启用此功能。`/unsafe` 切换允许你直接操作内存并执行非托管指令。要求使用 `/unsafe` 使此类代码可能引入的安全漏洞暴露显式化。能力越大，责任越大。\n\
  \n### 指针声明\n\n现在你已经将代码块标记为不安全，是时候查看如何编写不安全代码了。首先，不安全代码允许声明指针。考虑以下示例：\n\n```csharp\n\
  byte* pData;\n```\n\n假设 `pData` 不 `null`，它的值指向一个包含一个或多个 `byte` 的位置；`pData` 的值代表内存地址。如图\
  \ 23.1（Images/23fig1）所示，该图说明了栈中指针变量地址的内存分配。这里考虑了两个声明：`byte* pData` 和 `byte[] data`。这里的\
  \ `pData` 是一个指针，指向从 `0x0338EEC` 到 `0x2338EEC` 的地址，顺序存储并保留在引用者中。`*` 之前指定的类型是引用类型——即指针值所指向位置的类型。在这个示例中，`pData`\
  \ 是指针，`byte` 是引用类型。\n\n**图 23.1：指针包含数据的地址**\n\n由于指针仅仅是恰好引用内存地址的整数，因此它们不受垃圾回收的影响。C#\
  \ 不允许使用除`非托管类型`（`unmanaged types`）以外的引用类型，非托管类型是指既不是引用类型、不是泛型、且不包含引用类型的类型。因此，以下命令无效的：\n\
  \n```csharp\nstring* pMessage;\n```\n\n同样，此命令也是无效的：\n\n```csharp\nServiceStatus*\
  \ pStatus;\n```\n\n其中 `ServiceStatus` 的定义如列表 23.13 所示。问题再次在于，`ServiceStatus` 包含一个\
  \ `string` 字段。\n\n**列表 23.13：无效的引用类型**\n\n点击此处查看代码图像\n\n```csharp\nstruct ServiceStatus\n\
  {\n  int State;\n  string Description; // Description 是引用类型\n}\n```\n\n除了仅包含非托管类型的自定义结构体外，有效的引用类型还包括值类型（`sbyte`,\
  \ `byte`, `short`, `ushort`, `int`, `uint`, `long`, `ulong`, `char`, `float`, `double`,\
  \ `decimal`, `bool`）和指针类型（例如 `byte**`）。最后，有效的语法还包括 `void*` 指针，它代表未知类型的指针。\n\n###\
  \ 指针赋值\n\n一旦代码定义了指针，在访问它之前需要为其分配一个值。就像引用类型一样，指针可以持有值 `null`，这是它们的默认值。指针存储的值是位置的地址。因此，要分配指针，你必须先获取数据的地址。\n\
  \n你可以显式地将 `int` 或 `long` 强制转换为指针，但在没有运行时确定特定数据值地址的方法的情况下，这种情况很少发生。相反，你需要使用地址操作符（`&`）来获取值类型的地址：\n\
  \n点击此处查看代码图像\n\n```csharp\nbyte* pData = &bytes[0]; // 编译错误\n```\n\n问题在于在托管环境中，数据可能会移动，从而导致地址失效。生成的错误信息将是“你只能对固定语句初始化器内部的未固定的表达式取地址。”在这种情况下，所引用的字节出现在数组中，而数组是一种引用类型（一种可移动类型）。引用类型出现在堆上，并受垃圾回收或重定位的影响。当引用移动类型上的值类型字段时也会发生类似的问题：\n\
  \n```csharp\nint* a = &\"message\".Length;\n```\n\n无论何种，分配某些数据的地址都需要满足以下标准：\n\n\
  *   数据必须被分类为变量。\n*   数据必须是非托管类型。\n*   变量需要被分类为固定的（fixed），而不是可移动的。\n\n如果数据是非托管变量类型但不是固定的，请使用\
  \ `fixed` 语句来固定可移动变量。\n\n#### 固定数据\n\n为了获取移动数据项的地址，有必要固定（或钉住）数据，如列表 23.14 所示。\n\n\
  **列表 23.14：fixed 语句**\n\n点击此处查看代码图像\n\n```csharp\nbyte[] bytes = new byte[24];\n\
  \nfixed (byte* pData = &bytes[0]) // 允许 pData = bytes\n{\n  // ...\n}\n```\n\n在\
  \ `fixed` 语句的代码块内，分配的数据不会移动。在这个示例中，`bytes` 将保持原地址，至少直到 `fixed` 语句结束。\n\n\n\n\n根据执行的频率和所需的时间，`fixed`\
  \ 语句可能会导致堆内存产生碎片化，因为垃圾回收器无法紧凑固定的对象。为了减少这个问题，最佳实践是在执行期间尽早固定（pin）内存块，并且固定较少的大型块而不是许多许多型块。遗憾的是，这种偏好必须通过“在尽可能短的时间固定尽可能少”的实践来平衡，以最大限度地减少在数据固定期间发生垃圾回收的概率。在某种程度上，.NET\
  \ 2.0 通过包含一些额外的感知碎片的代码减少了这个问题。\n\n你可能需要在一个方法体中就位固定一个对象，并让它保持固定状态，直到另一个方法被调用；这通过\
  \ `fixed` 语句是不可能的。如果你处于这种不幸的境地，可以使用 `GCHandle` 对象上的方法无限期地固定一个对象。然而，你应该在绝对必要时才这样做；因为长时间固定一个对象会导致垃圾回收器极可能无法高效地紧凑内存。\n\
  \n### 在栈上分配内存\n\n你应该对数组使用 `fixed` 语句以防止垃圾回收器移动数据。然而，另一种方法是在调用栈上分配数组。栈上分配的数据不受垃圾回收的影响，也不受随之而来的终结器模式的影响。与引用类型类似，要求是\
  \ `stackalloc` 数据必须是非托管类型的数组。例如，与其在堆上分配字节数组，不如你可以将其放置在调用栈上，如 列表 23.16 所示。\n\n**列表\
  \ 23.16：在调用栈上分配数据**\n\n点击此处查看代码图像\n\n```\nbyte* bytes = stackalloc byte[42];\n```\n\
  \n由于数据类型是非托管类型的数组，运行时可以为该数组分配一个固定大小的缓冲区，并在指针超出范围后恢复该缓冲区。具体而言，它分配了 `sizeof(T) * E`，其中\
  \ `E` 是数组大小，`T` 是引用类型。考虑到仅将 `stackalloc` 使用在非托管类型数组上的限制，运行时通过简单地回溯栈将缓冲区还原给系统，从而消除了遍历\
  \ f-可达队列（f-reachable queue）的复杂性（参见“垃圾回收”部分和第 10 章中对终性的讨论）以及紧凑可达数据。因此，没有办法显式释放 `stackalloc`\
  \ 数据。\n\n栈是宝贵的资源。虽然它很小，但栈空间不足将产生巨大影响——即程序崩溃。由于这个原因，你应该尽力避免耗尽栈空间。如果程序确实耗尽了栈空间，最好的结果就是程序立即关闭/崩溃。通常情况下，程序的栈空间小于\
  \ 1MB（甚至可能少得多）。因此，请务必小心避免在栈上分配任意大小的缓冲区。\n\n### 指针解引用\n\n访问存储在指针所指类型变量中的数据，需要对指针进行解引用，在表达式之前放置间接运算符。例如，`byte\
  \ data = *pData;` 解引用 `pData` 所指的 `byte` 位置，并产生一个 `byte` 类型的变量。该变量提供了对该位置单个 `byte`\
  \ 的读写访问。\n\n在不安全代码中使用此原理可以实现修改“不可变”字符串的非正规行为，如 列表 23.17 所示。绝不推荐这种策略，尽管它确实暴露了低级内存操作的潜力。\n\
  \n**列表 23.17：修改不可变字符串**\n\n点击此处查看代码图像\n\n```\nstring text = \"S5280ft\";\n\nConsole.Write(\"\
  {0} = \", text);\n\nunsafe  // 需要 /unsafe switch\n\n{\n\n  fixed (char* pText =\
  \ text)\n  {\n      char* p = pText;\n      *++p = 'm';\n      *++p = 'i';\n   \
  \   *++p = 'l';\n      *++p = 'e';\n      *++p = ' ';\n      *++p = ' ';\n  }\n\n\
  }\n\nConsole.WriteLine(text);\n```\n\n列表 23.17 的结果出现在 输出 23.3 中。\n\n**输出 23.3**\n\
  \n```\nS5280ft = Smile\n```\n\n在这种情况下，你获取原始地址并使用预自增运算符按引用类型的大小（`sizeof(char)`）对其增加。接下来，你使用间接运算符解引用地址，然后用不同的字符赋值该位置。同样，在指针上使用\
  \ `+` 和 `–` 运算符通过 `* sizeof(T)` 操作数更改地址，其中 `T` 是引用类型。\n\n比较运算符（`==`, `!=`, `<`,\
  \ `>`, `<=`, 和 `>=`）也可以用于比较指针。因此，它们的使用等同于对地址值的比较。\n\n解引用运算符的一个限制是无法对 `void*` 进行解引用。`void*`\
  \ 表示指向未知类型的指针。要访问由 `void*` 引用的数据，你必须先将其转换为另一种类型。你可以如 列表 23.17 所示，通过索引运算符而不是间接运算符来实现与\
  \ 列表 23.18 相同的行为。\n\n**列表 23.18：在不安全代码中使用索引运算符修改不可变字符串**\n\n点击此处查看代码图像\n\n```\n\
  string text = \"S5280ft\";\n\nConsole.Write(\"{0} = \", text);\n\nunsafe  // 需要\
  \ /unsafe switch\n\n{\n\n  fixed (char* pText = text)\n  {\n      pText[1] = 'm';\n\
  \      pText[2] = 'i';\n      pText[3] = 'l';\n      pText[4] = 'e';\n      pText[5]\
  \ = ' ';\n      pText[6] = ' ';\n  }\n\n}\n\nConsole.WriteLine(text);\n```\n\n列表\
  \ 23.18 的结果出现在 输出 23.4 中。\n\n**输出 23.4**\n\n```\nS5280ft = Smile\n```\n\n如 列表 23.17\
  \ 和 23.18 中的修改可能会导致意想不到的行为。例如，如果你在 `Console.WriteLine()` 语句之后将 `text` 重新赋值为 `\"\
  S5280ft\"` 然后显示 `text`，输出将仍然 `Smile`，因为相等字符串字面量的地址被优化到了同一个字符串字面量。尽管在 列表 23.17 中使用了不安全代码，但由于是地址赋值，`text`\
  \ 从未被设置为预期的值。\n\n```\ntext = \"S5280ft\";\n```\n\n### 访问引用类型的成员\n\n解引用指针会产生一个指针底层类型的变量。然后你可以使用常用的成员访问运算符访问该底层类型的成员。然而，运算符优先级规则要求\
  \ `*x.y` 意味着 `*(x.y)`，这可能不是你想要的结果。如果 `x` 是一个指针，正确的代码是 `(*x).y`，这种语法非常糟糕。为了方便访问解引用指针的成员，C#\
  \ 提供了一个特殊的成员访问运算符：`x->y` 是 `(*x).y` 的简写，如 列表 23.19 所示。\n\n**列表 23.19：直接访问引用类型的成员**\n\
  \n点击此处查看代码图像\n\n```\nunsafe\n\n{\n  Angle angle = new Angle(30, 18, 0);\n  Angle*\
  \ pAngle = &angle;\n  System.Console.WriteLine(\"{0}° {1}' {2}\\\"\",\n      pAngle->Hours,\
  \ pAngle->Minutes, pAngle->Seconds);\n}\n```\n\n列表 23.19 的结果出现在 输出 23.5 中。\n\n**输出\
  \ 23.5**\n\n```\n30° 18' 0\n```\n\n\n\n\n### 通过委托执行不安全代码\n\n正如本章开头承诺的，我们将通过一个完整的示例来结束结束，这可能是你在\
  \ C# 中可以做的最“不安全”的操作：获取内存块的指针，用机器码字节填充它，创建一个引用新代码的委托，并执行它。在这个示例中，我们使用汇编代码来确定处理器 ID。如果在\
  \ Windows 机器上运行，它将打印处理器 ID。列表 23.20 展示了如何实现这一点。\n\n**列表 23.20：为不安全代码指定块**\n\n点击此处查看代码图像\n\
  \n```c\nusing System;\n\nusing System.Runtime.InteropServices;\n\nusing System.Text;\n\
  class Program\n{\n\n  public unsafe delegate void MethodInvoker(byte* buffer);\n\
  \n  public unsafe static int ChapterMain()\n  {\n      if (RuntimeInformation.IsOSPlatform(OSPlatform.Windows))\n\
  \      {\n          unsafe\n          {\n              byte[] codeBytes = new byte[]\
  \ {\n              0x49, 0x89, 0xd8,       // mov    %rbx,%r8\n              0x49,\
  \ 0x89, 0xc9,       // mov    %rcx,%r9\n              0x48, 0x31, 0xc0,       //\
  \ xor    %rax,%rax\n              0x0f, 0xa2,             // cpuid\n           \
  \   0x4c, 0x89, 0xc8,       // mov    %r9,%rax\n              0x89, 0x18,      \
  \       // mov    %ebx,0x0(%rax)\n              0x89, 0x50, 0x04,       // mov \
  \   %edx,0x4(%rax)\n              0x89, 0x48, 0x08,       // mov    %ecx,0x8(%rax)\n\
  \              0x4c, 0x89, 0xc3,       // mov    %r8,%rbx\n              0xc3  \
  \                  // retq\n          };\n\n              byte[] buffer = new byte[12];\n\
  \n              using (VirtualMemoryPtr codeBytesPtr =\n                  new VirtualMemoryPtr(codeBytes.Length))\n\
  \              {\n                  Marshal.Copy(\n                      codeBytes,\
  \ 0,\n                      codeBytesPtr, codeBytes.Length);\n                 \
  \ MethodInvoker method = Marshal.GetDelegateForFunctionPointer<MethodInvoker>(codeBytesPtr);\n\
  \n                  fixed (byte* newBuffer = &buffer[0])\n                  {\n\
  \                      method(newBuffer);\n                  }\n              }\n\
  \              Console.Write(\"Processor Id: \");\n              Console.WriteLine(ASCIIEncoding.ASCII.GetChars(buffer));\n\
  \          } // unsafe\n\n      }\n      else\n      {\n          Console.WriteLine(\"\
  This sample is only valid for Windows\");\n      }\n      return 0;\n  }\n}\n```\n\
  \n列表 23.20 的结果出现在输出 23.6 中。\n\n**输出 23.6**\n\n点击此处查看代码图像\n\n```\nProcessor Id: GenuineIntel\n\
  ```\n\n### 总结\n\n正如本书全文所示，C# 提供了强大的功能、灵活性、一致性以及一种极佳的结构。本章强调了 C# 程序执行非常底层的机器码操作的能力。\n\
  \n在我们结束本书之前，第 24 章 简要描述了底层执行框架，并将重点从 C# 语言转移到 C# 程序执行的更广泛的背景。\n\n## 24. 公用语言基础设施\n\
  \nC# 程序员在语法之外遇到的第一个要点之一，是 C# 程序执行的上下文。本章将讨论 C# 如何处理内存分配和释放、类型检查、与其他语言的互操作性、跨平台执行以及对编程元数据支持的基础知识。换句话说，本章研究了\
  \ C# 在编译时和运行时都赖的通用语言基础设施（Common Language Infrastructure）。它涵盖了在运行时管理 C# 程序运行的执行引擎，并考虑了\
  \ C# 如何融入由同一执行引擎管理的更广泛的语言集合中。由于 C# 与该基础设施有紧密联系，该基础设施自带的大多数功能都提供给 C# 使用。\n\n![图像显示了通用语言基础设施中包含的各种类型。](img/24mindmap.jpg)\n\
  \n### 定义通用语言基础设施\n\nC# 编译器不是生成处理器可以直接解释的指令，而是生成一种中间语言的指令，即通用中间语言（Common Intermediate\
  \ Language，`CIL`）。随后会发生第二个编译步骤（通常在执行时），将 `CIL` 转换为处理器可以理解的机器码。然而，转换为机器码对于代码执行仍然是不够的。C#\
  \ 程序还需要在代理环境中执行。负责 C# 程序执行的代理是虚拟执行系统（Virtual Execution System，`VES`），通常俗称为运行时。（注意，此处的运行时不是指特定的时间，例如执行时间；相反，运行时——`VES`\
  \ 是负责管理 C# 程序执行的代理。）运行时负责加载和运行程序并在程序执行时为其提供额外的服务（安全、垃圾回收等）。\n\n`CIL` 和运行时的规范包含在一个名为通用语言基础设施（Common\
  \ Language Infrastructure，`CLI`）的国际标准中.^(1) `CLI` 是理解 C# 程序执行上下文以及它如何与其他程序无缝交互（即使它们是用其他语言编写的）的关键规范。注意，`CLI`\
  \ 并没有规定标准的实现，而是确定了 `CLI` 框架在符合标准后应该如何行为的要求。这为 `CLI` 实现者提供了在必要时创新的灵活性，同时提供了足够的结构，使得由一个\
  \ `CLI` 创建的程序可以在不同的实现上甚至在不同的操作系统上执行。\n\n[1] 在整个章节中，`CLI` 指的是通用语言基础设施（Common Language\
  \ Infrastructure），而不是 `Dotnet CLI` 中的命令行界面。\n\n注意\n\n注意 `CIL` 和 `CLI` 缩写及其所代表的名称之间的相似性。现在区分它们将有助于你避免混淆。\n\
  \n`CLI` 标准中包含了以下内容的规范：\n\n*   虚拟执行系统\n*   通用中间语言\n*   通用类型系统\n*   通用语言规范\n*   元数据\n\
  *   框架\n\n本章扩展了你对 C# 的视角，包含了 `CLI`，这对于 C# 程序如何运行以及与操作系统交互关重要。\n\n### CLI 实现\n\n\
  今天 `CLI` 的主要实现是 `.NET Core`，它运行在 Windows 以及 UNIX/Linux 和 Mac OS 上；用于 Windows 的 `.NET\
  \ Framework`；以及作为通用的跨平台解决方案的 Xamarin（包括 iOS、macOS 和 Android 应用）。每个 `CLI` 实现都包含一个\
  \ C# 编译器和框架类库。每个实现支持的 C# 版本以及库中具体的类集合差异很大，且许多实现现在仅具有历史意义。表 24.1 描述了这些实现方案。\n\n**表\
  \ 24.1：CLI 的实现**\n\n| **编译器** | **描述** |\n| --- | --- |\n| Microsoft .NET Framework\
  \ | 这是 `CLR` 的传统（第一个）版本，用于创建在 Windows 上运行的应用程序。它包含了对 Windows Presentation Foundation\
  \ (WPF)、Windows Forms 和 ASP.NET 的支持。它使用 .NET Framework 基类库 (BCL)。 |\n\n\n\n\n\n\
  | .NET Core/CoreCLR | 正如其名，`.NET Core` 项目包含了所有新 .NET 实现中通用的核心功能。它是对 `.NET Framework`\
  \ 的开源且跨平台移植的重写，专为高性能应用设计。`CoreCLR` 是该项目的 `CLR` 的实现。在本书编写期间，`.NET Core 3.1` 已针对 Windows、macOS、Linux、FreeBSD\
  \ 和 NetBSD 发布。然而，某些 API（例如 `WPF`）仅支持在 Windows 上运行。更多信息请参见 [`github.com/dotnet/coreclr`](https://github.com/dotnet/coreclr)。\
  \ |\n| Xamarin | 一套开发工具和跨平台 `.NET` 库，以及 `CLR` 的一种实现，它可以帮助开发者创建运行在 Microsoft Windows、iOS、macOS\
  \ 和 Android 上的应用程序，并具有极高的代码复用率。Xamarin 使用 `Mono BCL`。 |\n| Microsoft Silverlight\
  \ | 一个旧的跨平台 `CLI` 实现，旨在创建基于浏览器的 Web 客户端应用程序。微软已于 2013 年停止了 `Silverlight` 的开发。 |\n\
  | .NET Compact Framework | 一个旧的精简版 `.NET Framework` 实现，设计用于在 PDA、手机和 Xbox 360 上运行。开发\
  \ Xbox 360 应用程序的 `XNA` 库和工具基于 `Compact Framework 2.0`；微软已于 2013 年停止了 `XNA` 的开发。\
  \ |\n| .NET Micro Framework | 微软的开源 `CLI` 实现，适用于资源受限到无法运行精简框架的设备。 |\n| Mono | 一种开源的跨平台\
  \ `CLI` 实现，适用于许多基于 UNIX 的操作系统、Android 等移动操作系统，以及 PlayStation 和 Xbox 等游戏机。 |\n| DotGNU\
  \ Portable.NET | 这一创建跨平台 `CLI` 实现的尝试已于 2012 年废弃。 |\n| Shared Source CLI (Rotor)\
  \ | 在 2001 年到 2006 年间，微软发布了允许非商业用途的 `CLI` 共享源代码参考实现。 |\n| | |\n\n考虑到实现 `CLI` 所需的工作，虽然列表很长，但后续只有三个框架对未来最为相关。\n\
  \n### Microsoft .NET Framework\n\n`Microsoft .NET Framework` 是第一个 `.NET CLI` 实现（于\
  \ 2000 年 2 月发布）。因此，它是最成熟的框架，拥有最大的 API 集合。它支持构建 Web、控制台和 Microsoft Windows 客户端应用程序。`.NET\
  \ Framework` 的最大局限性是它只能在 Microsoft Windows 上运行——事实上，它是与 Microsoft Windows 绑的。`Microsoft\
  \ .NET Framework` 包含了许多子框架；这里描述了最著名的几个：\n\n*   `.NET Framework Base Class Library\
  \ (BCL)`：提供代表内置 `CLI` 数据类型的类型，包括对文件 I/O、基础集合类、自定义属性、字符串操作等的支持。`BCL` 为每个 `C#` 原生类型（如\
  \ `int` 和 `string`）提供了定义。\n\n*   `ASP.NET`：用于构建网站和基于 Web 的 API。该框架自 2002 年发布以来一直是基于微软的网站的基石，但正逐渐被其替代者\
  \ `ASP.NET Core` 取代，后者提供了操作系统的可移植性，并显著提升了性能，提供了具有更高模式一致性的更新 API。\n\n*   `Windows\
  \ Presentation Foundation (WPF)`：一种用于构建运行在 Microsoft Windows 上的丰富 UI 应用程序的图形用户界面框架。`WPF`\
  \ 不仅提供了一 UI 组件，还提供了一种名为 `eXtended Application Markup Language (XAML)` 的声明语言，允许对应用程序的用户界面进行层次定义。\n\
  \n你会经常听到将 `Microsoft .NET Framework` 简单称为 `.NET Framework`。注意大写的 F，这区分了它与通用的 `CLI`\
  \ 实现以及术语 `.NET framework`。\n\n### .NET Core\n\n`.NET Core` 是未来 `.NET CLI` 的跨平台实现。此外，`.NET\
  \ Core` 是 `.NET Framework` 的开源重写，侧重于高性能和跨平台兼容性。\n\n`.NET Core` 由 `.NET Core Runtime\
  \ (Core CLR)`、`.NET Core` 框架库以及一组 `Dotnet` 命令行工具组成，这些工具用于创建和构建所有可用的应用场景。这些组件的组合包含\
  \ `.NET Core SDK` 中。如果你一直跟着本书的示例，你已经使用过 `.NET Core` 和 `Dotnet` 工具。\n\n`.NET Core\
  \ API` 通过 `.NET Standard` 与现有的 `.NET Framework`、`Xamarin` 和 `Mono` 实现兼容，这一点将在本章稍后详细讨论。\n\
  \n`.NET Core` 目前的重点是构建高性能且移植的控制台应用程序，并作为 `ASP.NET Core` 和 Windows 10 通用平台 (UWP)\
  \ 应用程序的 `.NET Foundation`。随着支持的操作系统越来越多，越来越多的框架正从 `.NET Core` 中诞生。\n\n### Xamarin\n\
  \n这种跨平台开发工具包含了针对 Android、macOS 和 iOS 的应用 UI 开发支持，以及（随着 `.NET Standard 2.0` 的发布）构建通用\
  \ Windows 应用的能力，可以在 Windows 10、Xbox One 和 HoloLens 上运行。Xamarin 特别强大之处在于，相同的代码库可以在所支持的每个操作系统上产生平台原生外观的用户界面。\n\
  \n### .NET Standard\n\n在历史上，要编写一个可以在多个操作系统甚至不同 `.NET` 框架上使用的 `C#` 库是非常困难的。问题在于每个框架上的\
  \ API 类各不相同。`.NET Standard` 通过定义一组通用的 `.NET` API 解决了这个问题，每个框架必须实现这些 API 以符合特定的 `.NET\
  \ Standard` 版本。这种统一性确保了开发者在目标 `.NET` 框架中可以使用一致的 API。如果你希望编写一次核心应用程序逻辑并确保其可以在任何现代\
  \ .NET 实现中使用，最简单的方法是创建一个 `.NET Standard` 库项目（在 Visual Studio 2017 及以上版本或通过 `Dotnet\
  \ CLI` 可）。`.NET Core` 编译器将确保库中的任何代码仅引用目标 `.NET Standard` 版本可 API。\n\n类库作者在选择支持哪个标准时应仔细考虑。目标\
  \ `.NET Standard` 版本越高，就越不需要担心为自己实现在低版本 `.NET Standard` 中缺失的 API。然而，目标高版本 `.NET\
  \ Standard` 的缺点是它在不同 `.NET` 框架之间的移植性较差。例如，如果你希望你的库与 `.NET Core 1.0` 工作，那么你需要目标 `.NET\
  \ Standard 1.6`，因此无法访问 Microsoft `.NET Framework` 中的所有反射 API。总结这种分类：如果你很懒，就目标较高的\
  \ `.NET Standard` 版本；如果移植性比减少工作量更重要，就目标较低的版本。\n\n更多信息，包括 `.NET` 框架实现及其版本到相应 `.NET\
  \ Standard` 版本的映射，请参见 [`itl.tc/NETStandard`](http://itl.tc/NETStandard)。\n\n\n\n\
  \n\n除了提供供 `CIL` 代码执行的运行时环境外，CLI 还定义了一组程序可能使用的核心类库，称为基类库（Base Class Library）。`BCL`\
  \ 中包含类库提供了基础类型和 API，允许程序以一致的方式与运行时以及底层操作系统进行交互。`BCL` 包含了对集合、简单文件访问、某些安全性、基本数据类型（如\
  \ string 等）、流等的支持。\n\n同样，一个名为 `Framework Class Library (FCL)` 的微软 特有库还包含了对富客户端用户界面、Web\
  \ 用户界面、数据库访问、分布式通信等内容的支持。\n\n### C# 编译为机器码\n\n第一章 中的 `HelloWorld` 程序列表显然是 C# 代码，并且你使用\
  \ C# 编译器对其进行了编译以执行。然而，处理器仍然无法直接解释编译后的 C# 代码。还需要一个额外的编译步骤来将 C# 编译结果转换为机器码。此外，执行还需要一个代理的参与，该代理为\
  \ C# 程序添加了更多服务——这些服务是不需要显式编写代码来实现的。\n\n所有的计算机语言都为编程定义了语法和语义。由于 C 和 C++ 等语言编译为机器码，这些语言的平台是底层操作系统和机器指令集，无论是\
  \ Microsoft Windows、Linux、macOS 还是其他。相比之下，对于 C# 等语言，底层上下文是运行时（或 `VES`）。\n\n`CIL`\
  \ 是 C# 编译器编译后产生的。它被称为 `common intermediate language`（通用中间语言），因为需要额外的步骤将 `CIL` 转换为处理器可以理解的内容。图\
  \ 24.1 显示了这一过程。\n\n![插图显示了 c sharp 代码编译为机器码涉及的阶段。](img/24fig01.jpg)\n\n**图 24.1：将\
  \ C# 编译为机器码**\n\n换句话说，C# 编译需要两个步骤：\n\n1. 通过 C# 编译器从 C# 转换为 `CIL`\n2. 从 `CIL` 转换为处理器可以执行的指令\n\
  \n运行时理解 `CIL` 并将其编译为机器码。通常，运行时内部的 `component` 负责从 `CIL` 到机器码的编译。该组件是 `just-in-time\
  \ (JIT) compiler`（即时编译器），`jitting`（即时编译）可以在程序安装或执行时发生。大多数 CLI 实现都是在执行时对 `CIL` 进行编译，但\
  \ CLI 并没有规定编译何时发生。事实上，CLI 甚至允许对 `CIL` 进行解释而非编译，就像许多脚本语言的工作方式一样。此外，.NET 包含一个名为 `NGEN`\
  \ 的工具，可以在运行程序之前将其编译为机器码。这种预执行时间编译需要在程序将执行的计算机上进行，因为它在努力生成更高效代码的过程中，需要评估机器的特性（处理器、内存等）。在安装时（或执行前的任何时候）使用\
  \ `NGEN` 的优势在于，你可以减少启动时对运行 jitter（编译器）的依赖，从而缩短启动时间。\n\n从 Visual Studio 2015 及更高版本开始，C#\
  \ 编译器还支持 .NET 原生编译，即在创建部署的应用程序版本时，将 C# 代码编译为原生机器码，就像使用 `NGEN` 工具一样。通用 Windows （Universal\
  \ Windows Applications）利用了这一特性。\n\n### 运行时\n\n即使在运行时将 `CIL` 代码转换为机器码并开始执行后，它继续保持对执行的控制。在运行时等代理上下文中执行的代码是托管代码（managed\
  \ code），而在运行时控制下执行的过程是托管执行（managed execution）。执行控制权交给了数据；这使得数据成为托管数据，因为数据的内存由运行时自动分配和释放。\n\
  \n在某种不一致的情况下，`Common Language Runtime`（通用语言运行时）术语在技术上并不是属于 CLI 的通用术语。相反，`CLR` 是针对\
  \ .NET 框架的微软特有的运行时实现。无论如何，`CLR` 常被用作 `runtime`（运行时）的通用术语，而技术上准确的术语 `Virtual Execution\
  \ System`（虚拟执行系统）在 CLI 规范之外很少被使用。\n\n由于有代理控制程序执行，因此向程序中注入额外的服务是可能的程序员没有显式地为这些服务编写代码。因此，托管代码提供了信息以允许这些服务被挂载。除其他项目外，托管代码还实现了关于类型成员的元数据定位、异常处理、安全信息的访问以及回溯堆栈的能力。本节的其余部分将描述了通过运行时和托管执行提供的某些额外服务。CLI\
  \ 并没有显式要求所有这些服务，但已有的 CLI 框架对每种服务都有实现。\n\n#### 垃圾回收\n\n垃圾回收根据程序需要自动释放内存的过程。对于没有自动化系统来执行此类清理的语言来说，这代表了一个巨大的编程问题。如果没有垃圾回收器，程序员必须记住始终释放他们所做的任何内存分配。忘记这样做，或对同一内存分配重复这样做，可能会在程序中引入内存泄漏或损坏——这在\
  \ Web 服务器等长时间运行的程序中会被加剧。由于运行时对垃圾回收有内置支持，针对运行时执行的程序员可以专注于添加程序功能，而不是与内存管理相关的“水管”工作。\n\
  \n垃圾回收器只负责处理内存管理；也就是说，它不提供管理与内存无关资源的自动化系统。因此，如果需要显式操作来释放资源（内存以外的），使用该资源的程序员应该利用特殊的\
  \ CLI 兼容编程模式，以有助于清理这些资源（参见第 10 章）。\n\n#### 平台移植性\n\nC# 程序具有平台移植性，支持跨不同操作系统执行（跨平台支持）——也就是说，C#\
  \ 程序能够在多个操作系统上运行并在不同的 CLI 实现上执行。在此语境下，移植性不仅限于为每个平台重新编译源代码，而是为某个框架编译的单个 CLI 模块可以在任何兼容\
  \ CLI 的框架上运行，无需重新编译。这种移植性的实现是因为移植代码的工作在运行时实现手中而不是应用程序开发者手中（得益于 .NET Standard）。限制当然是，跨平台代码不能使用特定平台的\
  \ API。在开发跨平台应用程序时，开发者可以将公共代码打包或重构为跨平台兼容的库，然后从特定平台的代码调用这些库，以减少支持跨平台应用程序所需的总代码量。\n\
  \n#### 性能\n\n\n\n\n\n许多习惯于编写非托管代码的程序员会正确地指出，无论应用程序多么简单，托管环境都会给应用带来开销。权衡在于托管代码的提高开发效率和减少\
  \ Bug，与运行时性能之间的取舍。这种二元对立在编程语言从汇编语言演变为 C 等高级语言，以及从结构化编程演变为面向对象开发时也曾出现。在大多数情况下，开发效率更胜一筹，特别是当硬件速度的提升和价格的下降超过应用需求时。在架构设计上花费的时间往往比低级开发的复杂性更能带来巨大的性能收益。在缓冲区溢出导致安全漏洞频发的背景下，托管执行变得更具吸引力。\n\
  \n毫无疑问，某些开发场景（例如设备驱动程序）可能尚未适用于托管执行。然而，随着托管执行能力和复杂程度的提高，这些许多性能考虑因素可能会消失。届时，非托管执行将仅留给那些认为需要精确控制或绕过运行时的开发场景。\n\
  \n3. 事实上，微软已经表示，托管开发将成为其 Windows 平台编写应用程序的主要手段，即使对于那些与操作系统集成的应用程序也是如此。\n\n此外，运行时引入了几个可以提高相对于原生编译性能的因素。例如，由于到机器码的翻译是在目标机器上进行的，生成的编译代码与该机器的处理器和内存布局匹配，从而获得了非\
  \ JIT（即时编译）语言通常无法利用的性能。此外，运行时能够响应直接编译到机器码很少考虑的执行条件。例如，如果箱体内存内存比需要的多，非托管语言仍会在代码中确定的、编译时定义的执行点释放内存。相反，JIT\
  \ 编译语言仅在内存不足或程序关机时才需要释放内存。尽管 JIT 编译会为执行过程增加一个编译步骤，但 JIT 插入的代码效率可能会带来与直接编译为机器码的程序相当的性能提升。最终，CLI\
  \ 程序并不一定比非 CLI 程序快，但它们的性能具有竞争力的。\n\n## 程序集、程序清单与模块\n\nCLI 包含了源语言编译器生成的 CIL 输出规范，这通常是一个程序集。除了\
  \ CIL 指令本身外，程序集还包含一个程序清单（manifest），它由以下组件组成：\n\n* 程序集定义和导入的类型\n* 关于程序集本身的版本信息\n\
  * 程序集依赖的附加文件\n* 程序集的安全权限\n\n程序清单本质上是程序集的头文件，提供了关于程序集组成部分的所有信息，以及唯一标识它的信息。\n\n程序集可以是类库，也可以是执行文件本身，且一个程序集可以引用其他程序集（这些程序集反过来也可以引用更多程序集），从而建立起由许多组件组成的应用程序，而不是作为一个大型的单体程序存在。这是现代编程框架理所当然的一个重要特性，因为它显著提高了了可维护性，并允许单个组件在多个程序之间共享。\n\
  \n除了程序清单外，程序集还包含在一个或多个模块中的 CIL 代码。通常，程序集和程序清单被合并为一个文件，如第 1 章中的 `HelloWorld.exe`。然而，也可以将模块放在单独的文件中，然后使用程序集链接器（`al.exe`）创建一个引用每个模块清单的程序集文件。这种方法不仅提供了将程序拆分为组件的另一种手段，还允许使用多种源语言开发一个程序集。\n\
  \n4. 这部分是因为主要的 CLI IDE 之一——Visual Studio .NET 缺乏处理由多个模块组成的程序集的功能。Visual Studio .NET\
  \ 的实现没有用于构建多模块程序集的集成工具，当它们使用此类程序集时，IntelliSense 无法完全运行。\n\n在通常，`module`（模块）和 `assembly`（程序集）这两个术语是可以互用的。但在谈论\
  \ CLI 兼容程序或库时，`assembly` 一词占主导。图 24.2 展示了各种组件术语。\n\n![带有模块的程序集示意图](img/24fig02.jpg)\n\
  \n**图 24.2：带有模块及其文件的程序集**\n\n注意，程序集和模块也可以引用针对特定语言本地化的资源文件等。虽然罕见，但两个不同的程序集可以引用同一个模块或文件。\n\
  \n尽管程序集可以包含多个模块和文件，但整个文件组只有一个版本号，该版本位于程序集清单中。因此，应用程序中最小的可版本组件是程序集，即使该程序集由多个文件组成。如果你更改了任何引用的文件（即使是为了发布补丁）而不更新程序集清单，你将违反清单以及整个程序集的完整性。因此，程序集构成了组件或部署单元的逻辑结构。\n\
  \n**注意**\n程序集——而不是构成它的单个模块——构成了可以进行版本控制和安装的最小单元。尽管一个程序集（逻辑结构）可以包含多个模块，但大多数程序集只包含一个。此外，微软现在提供了一个\
  \ `ILMerge.exe` 工具，可以将多个模块及其清单合并到单个文件程序集中。\n\n由于程序清单包含了程序集依赖的所有文件的引用，因此可以使用程序清单来确定程序集的依赖关系。此外，在运行时，运行时只需要检查清单来确定它需要的文件。只有分发多个应用程序共享库的工具供应商（例如微软）才需要在部署时注册这些文件。这使得部署变得简单得多。通常，基于\
  \ CLI 的应用程序部署被称为 `xcopy 部署`，源自只需将文件复制到所选目的地的 Windows `xcopy` 命令。\n\n 通用中间语言\n\n\n\
  \n\n\n与其“通用语言基础设施”（Common Language Infrastructure）相相，`CIL` 和 `CLI` 的另一个重要特性是支持同一个应用程序内多种语言的交互（而不是源代码在多个操作系统之间的可移植性）。因此，`CIL`\
  \ 不仅是 `C#` 的中间语言，也是许多其他语言的中间语言，包括 Visual Basic .NET、类 Java 语言 J#、Smalltalk 的某些变体、C++\
  \ 以及其他许多语言（写作时已有 20 多种，包括 COBOL 和 FORTRAN 的版本）。编译为 `CIL` 的语言被称为源语言，每种源语言都有一个自定义编译器，将源语言转换为\
  \ `CIL`。一旦编译为 `CIL`，源语言就不重要了。这一强大功能使得来自不同组织的不同开发小组能够开发库，而无需担心特定小组的语言选择。因此，`CIL`\
  \ 实现了编程语言的互操作性，也实现了操作系统的可移植性。\n\n### 注意事项\n\n`CLI` 的一个强大特性是它对多种语言的支持。这种支持使得可以使用多种语言创建程序，并允许用不同语言编写的代码访问另一种语言编写的库。\n\
  \n## 通用类型系统\n\n无论使用什么编程语言，生成的程序在内部都基于数据类型运行；因此，`CLI` 包含了通用类型系统（`CTS`）。`CTS` 定义了类型在内存中的结构和布局，以及围绕类型的概念和行为。它包含了类型操作指令，以及关于存储在类型内部的数据信息。`CTS`\
  \ 标准适用于类型在语言外部边界的出现方式和行为，因为 `CTS` 的目的是实现语言之间的互操作性。在执行时，由运行时强制执行 `CTS` 建立的契约。\n\n\
  在 `CTS` 内部，类型被分为两类：\n\n- `Values`（值）是用于表示基本类型的位模式，如整数和字符，以及结构形式的更复杂数据。每个值类型都对应一个独立的类型标记，该标记并不存储在位本身中。独立的类型标记指向类型定义，该定义提供了值中每个位位的含义以及该值支持的操作。\n\
  - `Objects`（对象）内部包含对象的类型标记。（这有助于实现类型检查。）对象具有身份，使得每个实例都是唯一的。此外，对象拥有可以存储其他类型（值或对象引用）的槽。与值不同，更改槽的内容不会改变对象的身份。\n\
  \n这两类类型直接对应到 `C#` 语法，提供了声明每种类型的手段。\n\n## 通用语言规范\n\n由于 `CTS` 提供的语言集成优势通常大于其实现成本，大多数源语言都支持\
  \ `CTS`。然而，还有一个 `CTS` 语言合规性的子集称为通用语言规范（`CLS`），其侧重点是库的实现。`CLS` 面向库开发者，为他们提供标准，用于编写可以从大多数源语言访问的库，无论使用该库的源语言是否符合\
  \ `CTS`。它被称为通用语言规范，是因为它旨在鼓励 `CLI` 语言提供创建互操作库的方法，或可以从其他语言访问的库。\n\n例如，尽管语言提供无符号整数支持是完全合理的，但此类类型并未包含在\
  \ `CLS` 中。因此，实现类库的开发者不应在外部暴露无符号整数，因为会导致库对于不支持无符号整数的符合 `CLS` 的源语言访问降低。理想情况下，任何需要从多种语言访问的库都应该符合\
  \ `CLS`。请注意，`CLS` 不关注未暴露到程序集外部的类型。\n\n另外注意，当你创建一个不符合 `CLS` 的 API 时，编译器可以发出警告。要实现这一点，你可以使用程序集属性\
  \ `System.CLSCompliant` 并将参数指定为 `true`。\n\n### 元数据\n\n除了执行指令外，`CIL` 代码还包含了关于程序中类型和文件的元数据。元数据包括以下项目：\n\
  \n- 程序或类库中每种类型的描述\n- 包含程序本身数据及其所依赖的库的清单（manifest）信息\n- 嵌入在代码中的自定义属性，提供了有关属性所装饰的构造的附加信息\n\
  \n元数据不是 `CIL` 一个草率的、非本质的补充，而是 `CLI` 实现的一个核心组件。它提供了关于类型的表示信息和行为信息，并包含了关于哪个程序集包含特定类型定义的位置信息。它在保存编译器数据并使其在执行时供调试器和运行时可访问方面起着关键作用。这些数据不仅在\
  \ `CIL` 代码可用，在机器码执行期间也是可用的，以便运行时继续进行任何必要的类型检查。\n\n元数据为运行时提供了一种处理原生代码和托管代码混合执行的机制。此外，它增加了代码和执行的健壮性，因为它平滑了从一个库版本到下一个版本的迁移，将编译时定义的绑定替换为加载时实现。\n\
  \n关于库及其依赖项的所有头部信息都在元数据中称为清单（manifest）的部分中。因此，元数据的清单部分允许开发者确定模块的依赖关系，包括关于依赖项特定版本的信息以及指示创建该模块的签名。在执行时，运行时使用清单来确定加载哪些依赖库、库或主程序是否被篡改，以及是否缺少了程序集。\n\
  \n元数据还包含可能装饰代码的`custom attributes`（自定义属性）。属性提供了关于 `CIL` 指令的附加元数据，这些数据可以在程序在执行时访问。\n\
  \n元数据通过称为反射（reflection）机制在执行时可用。通过反射，可以在执行时查找类型或其成员，然后调用该成员或确定某个构造是否被特定属性所装饰。这提供了“晚绑定”（late\
  \ binding），系统在执行时而不是编译时确定要执行哪些代码。反射甚至可以通过遍历元数据并将其复制到某种帮助文档中来生成文档（参见第 18 章）。\n\n\
  ## .NET Native 和 提前编译\n\n.NET Native 特性（由 `.NET Core` 和最近的 `.NET Framework` 实现支持）创建一个特定平台的可执行文件。这被称为提前编译（`AOT`）。\n\
  \n\n\n\n\n`.NET Native` 允许程序员继续使用 `C#` 编写代码，同时通过消除 JIT 编译代码的需求，实现原生代码性能和更快的启动速度。当\
  \ `.NET Native` 编译应用程序时，`.NET FCL` 会被静态链接到应用程序中；此外还包含了针对静态预编译优化的 `.NET Framework`\
  \ 运行时组件。这些专门构建的组件针对 `.NET Native` 进行了优化，并提供了比标准 `.NET` 运行时更好的性能。编译步骤不会以任何方式更改你的应用程序。你可以自由使用\
  \ `.NET` 的所有构造和 API，并依赖托管内存和内存清理，因为 `.NET Native` 将 `.NET Framework` 的所有组件包含在你的可执行文件中。\n\
  \n### 总结\n\n本章描述了许多对于理解 `C#` 程序运行环境的重要新术语和缩写。大量的三字母缩写可能会令人困惑，因此表 24.2 总结了属于 `CLI`\
  \ 的术语和缩写。\n\n| 缩写 | 定义 | 描述 |\n| --- | --- | --- |\n| .NET | 无 | Microsoft 对整个 `CLI`\
  \ 栈的实现。包含 `CLR`、`CIL` 和各种语言，所有这些都符合 `CLS` 标准。 |\n| BCL | 基类库 | `CLI` 规范的一部分，定义了构建几乎所有程序所需的集合、线程、控制台和其他基类。\
  \ |\n| C# | 无 | 一种编程语言。与 `CLI` 标准独立的是 `C#` 语言规范，该规范也由 ECMA 和 ISO 标准机构批准。 |\n| CIL\
  \ (IL) | 通用中间语言 | `CLI` 规范的语言，定义了在 `CLI` 实现上可执行代码的指令。它有时也被称为 `IL` 或 `Microsoft IL`\
  \ (`MSIL`)，以与其他中间语言区分来。（为了表示它是一个比 Microsoft 更广泛的标准，优先使用 `CIL` 而非 `MSIL` 甚至 `IL`。）\
  \ |\n| CLI | 通用语言体系 | 定义中间语言、基类和行为特征的规范，它使实现者能够创建虚拟执行系统和编译器，使得源语言在通用执行环境之上具有互操作性。\
  \ |\n| CLR | 通用语言运行时 | Microsoft 对 `CLI` 规范中定义的运行时的实现。 |\n| CLS | 通用语言规范 | `CLI`\
  \ 规范的一部分，定义了源语言必须支持的核心功能集，以便在根据 `CLI` 规范实现的运行时上执行。 |\n| CTS | 通用类型系统 | 通常由符合 `CLI`\
  \ 标准的语言实现的标准，定义了语言在模块外部可见暴露的类型表示和行为。它包含了关于类型如何组合以形成新类型的概念。 |\n| FCL | .NET Framework\
  \ 类库 | 构成 Microsoft `.NET Framework` 的类库。它包含了 Microsoft 对 `BCL` 的实现，以及用于 Web 开发、分布式通信、数据库访问和富客户端用户界面开发等领域的大量类库。\
  \ |\n| VES (runtime) | 虚拟执行系统 | 管理为 `CLI` 编译的程序执行的代理程序。 |\n\n**表 24.2: 常用 C# 相关缩写**\n\
