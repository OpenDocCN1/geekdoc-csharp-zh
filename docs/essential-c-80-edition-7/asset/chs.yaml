  \ await taskDownload;\n```\n\n除了解包 `Task` 之外，`await` 运算符还会告诉 C# 编译器生成代码，确保 `await`\
  \ 调用之后的代码在适当的线程上执行。这是一个关键优势，避免了难以发现的缺陷。\n\n`结束 7.0`\n\n\n\n\n\n为了更好地解释控制流，图 20.1\
  \ 显示了每个任务的独立列，以及在每个任务上发生的执行操作。\n\n有几个重要的误区是图 20.1 帮助消除的：\n\n`5.0` `4.0`\n\n*   **误区\
  \ #1：使用 `async` 关键字装饰的方法在被调用时会自动在工作线程上执行。** 这完全不是真的；该方法会在调用线程上正常执行，如果实现中没有 `await`\
  \ 任何未完成的可等待任务，它将在同一线程上同步完成。方法的实现负责启动任何异步工作。仅仅使用 `async` 关键字并不会改变方法代码在哪个线程上执行。此外，从调用者的角度来看，调用\
  \ `async` 方法并没有特别之处；它只是一个类型被定义为返回某种有效异步返回类型之一的方法，并且是正常调用的。例如，在 `Main()` 中，`CountOccurrencesAsync()`\
  \ 的返回值被赋值为 `Task<int>`，就像对于非异步方法一样。然后我们 `await` 该任务。\n\n*   **误区 #2：`await` 关键字会导致当前线程阻塞直到所等待的任务完成。**\
  \ 这也完全不是真的。如果你除了当前线程阻塞直到任务完成外没有选择，请调用 `Wait()` 方法（同时注意避免死锁），正如我们在第 19 章中描述的那样。`await`\
  \ 关键字评估随其后的表达式（一个有效的 `async` 返回类型，如 `Task`、`Task<T>` 或 `ValueTask<T>`）；为生成的任务添加一个延续；然后*立即*将控制权返回给调用者。任务的创建已经启动了异步工作；`await`\
  \ 关键字意味着开发者希望方法的调用者在处理异步工作时在此线程上继续执行其工作。在该异步工作完成后的某个时刻，执行将在 `await` 表达式之后的控制点恢复。\n\
  \n![显示了一个包含主方法、下载数据任务异步任务和读取异步任务的控制流图。](img/20fig01.jpg)\n\n**图 20.1：每个任务内部的控制流**\n\
  \n`5.0` `4.0`\n\n事实上，`async` 关键字存在的首要原因有两个。首先，它让代码阅读者非常清楚地知道，编译器将自动重写随其后的方法。其次，它通知编译器方法中对\
  \ `await` 上文关键字的使用应被视为异步控制流，而不是普通的标识符。\n\n`5.0` `开始 7.1`\n\n从 C# 7.1 开始，可以拥有 `async\
  \ Main` 方法。因此，代码列表 20.3 的 `Main` 签名是 `public static async Task Main(string[] args)`。这允许\
  \ `await` 算符的用户调用异步方法。如果没有 `async Main()` 方法，我们必须不得不依赖于显式地处理有效的异步返回类型，并在退出程序之前显式地等待任务完成，以避免意料之外的行为。\n\
  \n顺带提一下，C# 5.0 和 6.0 都包含一项限制，即 `await` 运算符不能出现在异常处理的 `catch` 或 `finally` 语句中。然而，这一限制从\
  \ C# 7.0 开始被移除。考虑到你可能想要从调用堆栈中最外层的异常处理程序中记录异常——日志记录是一项相对开销较大的操作，以至于使用异步 `await` 这样做是有价值的。\n\
  \n`4.0`\n\n### 引入 `ValueTask<T>` 的异步返回\n\n我们使用异步方法用于长时间运行、高延迟的操作。而且（显然），由于返回的是 `Task`/`Task<T>`，我们总是需要获取这些对象之一的实例来返回。另一种方案是返回\
  \ `null`，这将迫使调用者在访问 `Task` 之前始终检查 `null`——从易用性角度来看，这是一个不合理且令人沮丧的 API。通常，创建一个 `Task`/`Task<T>`\
  \ 的成本与长时间运行、高延迟的操作相比是微不足道的。\n\n`7.1`\n\n但是，如果操作可以短路并立即返回结果会发生什么呢？例如，压缩一个缓冲区。如果数据量很大，异步执行操作是有意义的。然而，如果数据长度为零，则操作可以立即返回，此时获取（缓存的或新的实例）`Task`/`Task<T>`\
  \ 是没有意义的，因为当操作立即完成时不需要任务。需要的是一种可以管理异步的类任务对象，但在不需要时不需要花费完整 `Task`/`Task<T>` 的开销。虽然在\
  \ C# 5.0 引入 `async`/`await` 时还没有这样的替代方案，但 C# 7.0 增加了对额外有效异步返回类型的支持——即支持 `GetAwaiter()`\
  \ 方法的类型，如“高级主题：扩展的有效异步返回类型”详细所示。\n\n`5.0`\n\n例如，与 C# 7.0 相关的 .NET 包含了 `ValueTask<T>`，这是一种值类型，当长时间运行的操作可以短路时它可以缩小以支持轻量级实例化，否则可以转换为完整的\
  \ `Task`。代码列表 20.4 提供了文件压缩的示例，但如果压缩可以短路，则通过 `ValueTask<T>` 逸。\n\n`4.0`\n\n**代码列表\
  \ 20.4：从 `async` 方法返回 `ValueTask<T>`**\n\n```\nusing System.IO;\nusing System.Text;\n\
  using System.Threading.Tasks;\n\npublic static class Program\n{\n      private static\
  \ async ValueTask<byte[]> CompressAsync(byte[] buffer)\n      {\n          if (buffer.Length\
  \ == 0)\n          {\n              return buffer;\n          }\n\n          using\
  \ MemoryStream memoryStream = new MemoryStream();\n          using System.IO.Compression.GZipStream\
  \ gZipStream =\n              new System.IO.Compression.GZipStream(\n          \
  \        memoryStream,\n                     System.IO.Compression.CompressionMode.Compress);\n\
  \n          await gZipStream.WriteAsync(buffer, 0, buffer.Length);\n\n         \
  \ return memoryStream.ToArray();\n      }\n\n  // ...\n}\n```\n\n`7.1`\n\n注意，尽管异步方法（如\
  \ `GZipStream.WriteAsync()`）可能返回 `Task<T>`，`await` 实现在返回 `ValueTask<T>` 的方法中仍然有效。例如，在代码列表\
  \ 20.4 中，将返回从 `ValueTask<T>` 更改为 `Task<T>` 不涉及其他代码更改。\n\n`5.0`\n\n`ValueTask<T>`\
  \ 的出现提出了何时使用它与 `Task`/`Task<T>` 的问题。如果你的操作不返回值，直接使用 `Task`（没有非泛型的 `ValueTask`，因为它没有收益）。同样，如果你的操作可能异步完成，或者无法为常见结果缓存任务，则优先选择\
  \ `Task<T>`。例如，返回 `ValueTask<bool>` 而不是 `Task<bool>` 通常没有收益，因为你可以轻松地为 `true` 和 `false`\
  \ 值缓存 `Task<bool>`——事实上，`async` 基础设施会自动这样做。也就是说，当返回一个同步完成的异步 `Task<bool>` 方法时，无论如何都会返回缓存的\
  \ `Task<bool>`。然而，如果操作可能同步完成且你无法合理缓存所有常见的返回值，`ValueTask<T>` 可能是合适的。\n\n`4.0` `5.0`\n\
  \n### 异步流\n\n\n\n\n\nC# 8.0 引入了编写 `async streams`（异步流）的能力，本质上允许迭代器利用异步模式的能力。正如第\
  \ 15 章中讨论的，C# 中的集合都是构建在 `IEnumerable<T>` 和 `IEnumerator<T>` 之上的，前者具有单个 `GetEnumerator<T>()`\
  \ 函数，返回一个可以进行迭代的 `IEnumerator<T>`。而且，当使用 `yield return` 构建迭代器时，方法需要返回 `IEnumerable<T>`\
  \ 或 `IEnumerator<T>`。相比之下，有效的异步返回类型必须支持 `GetAwaiter()` 方法，就像 `Task`、`Task<T>` 和\
  \ `ValueTask<T>` 那样。因此，冲突点在于，你无法同时拥有一个 `async` 方法和一个迭代器。例如，在遍历集合时调用 `async` 方法，你无法在所有预期的迭代完成之前，将结果\
  \ `yield` 给调用函数。\n\n2。或者返回 void。\n\n`4.0`\n\n为了解决这些问题，C# 团队在 C# 8.0 中添加了异步流（async\
  \ streams）支持。此功能专门设计用于启用异步迭代，以及使用 `yield return` 构建异步集合和可枚举类型方法。\n\n例如，想象使用 `async`\
  \ 方法 `EncryptFilesAsync()` 对内容进行加密，并给定一个目录（默认当前目录）。列表 20.6 提供了相应的代码。\n\n#### 列表\
  \ 20.6：异步流\n\n点击此处查看代码图像\n\n```\nusing System.IO;\n\nusing System.Linq;\n\nusing\
  \ System.Threading.Tasks;\n\nusing System.Collections.Generic;\n\nusing System.Threading;\n\
  \nusing System.Runtime.CompilerServices;\n\nusing AddisonWesley.Michaelis.EssentialCSharp.Shared;\n\
  \npublic static class Program\n\n{\n\n  public static async void Main(params string[]\
  \ args)\n  {\n\n      string directoryPath = Directory.GetCurrentDirectory();\n\n\
  \      const string searchPattern = \"*\";\n\n  // ...\n\n      using Cryptographer\
  \ cryptographer = new Cryptographer();\n\n      IEnumerable<string> files = Directory.EnumerateFiles(\n\
  \n          directoryPath, searchPattern);\n\n      // 创建取消令牌源，以便在操作\n      //超过一分钟时取消。\n\
  \n      using CancellationTokenSource cancellationTokenSource =\n\n          new\
  \ CancellationTokenSource(1000*60);\n\n      await foreach ((string fileName, string\
  \ encryptedFileName)               \n          in EncryptFilesAsync(files, cryptographer)\
  \                          \n          .Zip(files.ToAsyncEnumerable())         \
  \                            \n          .WithCancellation(cancellationTokenSource.Token))\
  \                   \n      {\n\n          Console.WriteLine($\"{fileName}=>{encryptedFileName}\"\
  );\n\n      }\n  }\n\n  public static async IAsyncEnumerable<string> EncryptFilesAsync(\
  \               \n      IEnumerable<string> files, Cryptographer cryptographer,\
  \                   \n      [EnumeratorCancellation] CancellationToken cancellationToken\
  \ = default)  \n  {\n\n      foreach (string fileName in files)\n      {\n\n   \
  \       yield return await EncryptFileAsync(fileName, cryptographer);        \n\n\
  \          cancellationToken.ThrowIfCancellationRequested();\n\n      }\n  }\n\n\
  \  private static async Task<string> EncryptFileAsync(                     \n  \
  \    string fileName, Cryptographer cryptographer)                             \
  \ \n  {\n\n      string encryptedFileName = $\"{fileName}.encrypt\";\n      await\
  \ using FileStream outputFileStream =                                    \n    \
  \      new FileStream(encryptedFileName, FileMode.Create);                     \
  \ \n      string data = await File.ReadAllTextAsync(fileName);                 \
  \        \n      await cryptographer.EncryptAsync(data, outputFileStream);     \
  \               \n      return encryptedFileName;\n\n  }\n}\n```\n\n`8.0``5.0``4.0``8.0`\
  \ 列表 20.6 从一个 `Main()` 方法开始，其中包含 C# 8.0 引入的 `async foreach` 语句，该语句遍历一个异步方法 `EncryptFilesAsync()`。（我们稍后会讨论\
  \ `WithCancellation()` 的调用。）`EncryptFilesAsync()` 方法使用 `foreach` 循环遍历每个指定的文件。在 `foreach`\
  \ 循环内部有两个 `async` 方法调用。第一个是调用 `File.ReadAllTextAsync()`，它读取文件的所有内容。一旦内容在内存中可用，代码就会调用\
  \ `EncryptAsync()` 方法对其进行加密，然后通过 `yield return` 语句将加密后的文件名返回给调用者。因此，该方法提供了一个需要向调用者提供异步迭代器的示例。实现这一点的关键是\
  \ `EncryptFilesAsync()` 装饰了 `async` 并且它返回了 `IAsyncEnumerable<T>`（在此情况下 `T` 是字符串）。\n\
  \n`5.0`\n\n给定一个返回 `IAsyncEnumerable<T>` 的方法，你可以使用 `await foreach` 语句来消费它，如列表 20.6\
  \ 中的 `Main` 方法所示。因此，此列表既产生又消费了异步流。\n\n`GetAsyncEnumerator()` 的签名包含一个 `CancellationToken`\
  \ 参数。由于 `await foreach` 循环生成调用 `GetAsyncEnumerator()` 的代码，因此注入取消令牌并提供取消的方法是通过 `WithCancellation()`\
  \ 扩展方法（如图 20.2 所示，`IAsyncEnumerable<T>` 上有 `WithCancellation()` 方法）。为了在异步流方法中支持取消，请如\
  \ `EncryptFilesAsync` 所示添加可选的 `CancellationToken`：\n\n`4.0`\n\n```\nstatic public\
  \ async IAsyncEnumerable<string>\n    EncryptFilesAsync(\n        string directoryPath\
  \ = null,\n        string searchPattern = \"*\",\n        [EnumeratorCancellation]\
  \ CancellationToken\n            cancellationToken = default)\n\n{ ... }\n```\n\n\
  ![IAsyncEnumerable 类图](img/20fig02.jpg)\n\n**图 20.2：IAsyncEnumerable<T> 和相关接口**\n\
  \n`8.0``5.0`\n\n在列表 20.6 中，你提供了一个返回 `IAsyncEnumerable<T>` 的异步流方法。然而，与异步迭代器一样，你也可以通过\
  \ `GetAsyncEnumerator()` 方法实现 `IAsyncEnumerable<T>` 接口。当然，任何实现该接口的类都可以使用 `await\
  \ foreach` 语句进行迭代，如列表 20.7 所示。\n\n#### 列表 20.7：使用 await foreach 调用异步流\n\n点击此处查看代码图像\n\
  \n```\nclass AsyncEncryptionCollection : IAsyncEnumerable<string?>\n\n{\n\n  public\
  \ async IAsyncEnumerator<string> GetAsyncEnumerator(\n      CancellationToken cancellationToken\
  \ = default)\n  {\n\n      // ...\n  }\n\n  static public async void Main()\n  {\n\
  \n      AsyncEncryptionCollection collection =\n          new AsyncEncryptionCollection();\n\
  \n      // ...\n\n      await foreach (string fileName in collection)\n      {\n\
  \n          Console.WriteLine(fileName);\n\n      }\n\n  }\n\n}\n```\n\n\n\n\n`IAsyncEnumerable<T>`\
  \ 接口及其伴侣 `IAsyncEnumerator<T>` 是 C# 8.0 新增的内容，如图 20.2 所示，它们与对应的同步版本匹配。请注意，`IAsyncDisposable.DisposeAsync()`\
  \ 和 `IAsyncEnumerator<T>.MoveNextAsync()` 方法都是 `IEnumerator<T>` 等效方法的异步版本。`Current`\
  \ 属性不是异步的。（同时，异步实现中没有 `Reset()` 方法。）\n\n`4.0`\n\n### `IAsyncDisposable` 与 `await\
  \ using` 声明与语句\n\n`IAsyncDisposable` 是 `IDisposable` 的异步等类型，因此可以使用 C# 8.0 的新 `await\
  \ using` 语句或 `await using` 声明来调用。在列表 20.6 中，我们在声明 `outputFileStream` 时使用了后者，因为与\
  \ `IAsyncEnumerable<T>` 一样，`FileStream` 也实现了 `IAsyncDisposable`。与 `using` 声明一样，你不能为使用\
  \ `async using` 声明的变量赋值。\n\n并不意外的是，`await using` 语句的语法与常用的 `using` 语句相同：\n\n点击此处查看代码图像\n\
  \n```\nawait using FileStream outputFileStream =\n\n    new FileStream(encryptedFileName,\
  \ FileMode.Create);\n\n{ ... }\n```\n\n只要类型实现了 `IAsyncDisposable` 或简单地具有 `DisposeAsync()`\
  \ 方法，就可以随时使用这两种者。结果是 C# 编译器会在声明周围以及在变量超出作用域之前注入一个 `try/finally` 块，然后在 `finally`\
  \ 块中调用 `await DisposeAsync()`^(3)。这种方法确保了所有资源都能被清理。\n\n[3].](#ch20.xhtml_ch20fn3a)\
  \ 在 `finally` 块中使用 `await` 是在 C# 6.0 中添加的。\n\n`8.0`\n\n注意，`IAsyncDisposable` 和 `IDisposable`\
  \ 之间没有通过继承关系关联。因此，它们的实现也不相互依赖：可以在不实现另一个的情况下实现一个。\n\n### 在 `IAsyncEnumerable` 中使用\
  \ LINQ\n\n在列表 20.6 的 `await foreach` 语句中，我们调用了 LINQ 的 `AsyncEnumerable.Zip()` 方法，将原始文件名与加密后的文件名配对。\n\
  \n点击此处查看代码图像\n\n```\nawait foreach (\n\n    (string fileName, string encryptedFileName)\
  \ in\n\n        EncryptFilesAsync(files)\n            .Zip(files.ToAsyncEnumerable()))\n\
  \n{\n\n    Console.WriteLine($\"{fileName}=>{encryptedFileName}\");\n}\n```\n\n\
  `5.0`\n\n`AsyncEnumerable` 为 `IAsyncEnumerable<T>`提供了 LINQ 功能，正如你所期的那样。然而，该库在 BCL（基础类库）中并不可用。相反，^(4)为了访问异步\
  \ LINQ 能力，你需要添加对 `System.Linq.Async` NuGet 包的引用。\n\n`4.0`\n\n[4].](#ch20.xhtml_ch20fn4a)\
  \ 至少在本文编写时——根据 .NET Core 3.0 和 3.1。\n\n`AsyncEnumerable` 定义在 `System.Linq` 中（而不是具有\
  \ `async` 功能的不同唯一命名空间）。并不意外，它包含了标准 LINQ 操作符的异步版本，如 `Where()`、`Select()` 以及在上述列表中使用的\
  \ `Zip()` 方法。它们被视为“异步版本”，是因为它们是 `IAsyncEnumerable` 的扩展方法，而不是 `IEnumerable<T>`。此外，`AsyncEnumerable`\
  \ 包含了一系列 `Async()`、`AwaitAsync()` 和 `AwaitWithCancellationAsync()` 方法。这些方法的每个 `Select*()`\
  \ 版本显示在列表 20.8 中。\n\n**列表 20.8：`AsyncEnumerable Select*()` 方法的签名^(5)**\n\n[5].](#ch20.xhtml_ch20fn5a)\
  \ 排除除了 `SelectMany()` 类别的方法。\n\n点击此处查看代码图像\n\n```\nnamespace System.Linq\n\n{\n\n\
  \  public static class AsyncEnumerable\n\n  {\n\n      // ...\n\n      public static\
  \ IAsyncEnumerable<TResult> Select<TSource?, TResult?>(\n          this IAsyncEnumerable<TSource>\
  \ source,\n          Func<TSource, TResult> selector);\n      public static IAsyncEnumerable<TResult>\
  \ SelectAwait<TSource?, TResult?>(\n          this IAsyncEnumerable<TSource> source,\n\
  \          Func<TSource, ValueTask<TResult>>? selector);\n      public static\n\n\
  \          IAsyncEnumerable<TResult> SelectAwaitWithCancellation<\n            \
  \  TSource?, TResult?>(\n                  this IAsyncEnumerable<TSource> source,\n\
  \                      Func<TSource, CancellationToken,\n                      \
  \    ValueTask<TResult>> selector);\n      // ...\n\n  }\n}\n```\n\n`8.0`\n\n与 `Enumerable`\
  \ 等效方法匹配的方法名（在此例中为 `Select()`）具有相似的“实例”签名，但 `TResult` 和 `TSource` 是不同的。两个带有“Await”的签名都如下，例如，在列表\
  \ 20.6 中，你可以使用 `await` 将返回值视为 double 而不是 `ValueTask<double>`：\n\n`5.0`\n\n点击此处查看代码图像\n\
  \n```\nIAsyncEnumerable<string> items = files.ToAsyncEnumerable();\n\nitems.SelectAwait((text)\
  \ => EncryptFileAsync(text));\n```\n\n`4.0`\n\n注意的是，方法返回 `ValueTask<T>`，这是 `Await()`\
  \ 和 `AwaitWithCancellation()` 所需要的。后者还允许取消令牌。\n\n另一个值得提及的异步 LINQ 方法是列表 20.6 中使用的\
  \ `ToAsyncEnumerable()`。由于异步 LINQ 方法适用于 `IAsyncEnumerable<T>`，`ToAsyncEnumerable()`\
  \ 将 `IEnumerable<T>` 转换为 `IAsyncEnumerable<T>`。同样，标准 LINQ 方法的异步版本匹配 `Await()`、`AwaitAsync()`\
  \ 和 `AwaitWithCancellation()` 集合。区别在于它们都返回 `ValueTask<T>`。以下片段提供了使用 `AverageAsync()`\
  \ 方法的示例：\n\n点击此处查看代码图像\n\n```\ndouble average = await AsyncEnumerable.Range(\n \
  \ 0, 999).AverageAsync();\n```\n\n###8.0\n\n### 从异步方法返回 `void`\n\n我们已经查看了多种有效的异步返回类型，`Task`、`Task<T>`、`ValueTask<T>`\
  \ 以及现在的 `IAsyncEnumerable<T>`，它们都支持 `GetAwaiter()` 方法。有一个允许的返回类型（或非类型）不支持 `GetAwaiter()`。这种适用于\
  \ `async` 方法的返回选项是 `void` —— 从此称为 **async void 方法**。在大多数情况下，应该避免使用 `async void`\
  \ 方法，它们可能更准确地被视为非选项。与返回支持 `GetAwaiter()` 的类型不同，当返回 `void` 时，无法确定方法何时执行完毕。如果发生异常，返回\
  \ `void` 意味着没有这样的容器来报告异常。在这种情况下，`async void` 方法上抛出的任何异常都可能出现在 UI `SynchronizationContext`\
  \ 上——实际上变成未处理的异常（参见第 19 章中的[线程上的未处理异常处理]高级主题）。\n\n`5.0`\n\n如果 `async void` 方法应该被普遍避免，为什么最初是是允许的？这是因为\
  \ `async void` 方法可以启用 `async` 事件处理程序。正如第 14 章所示，事件应该声明为 `EventHandler<T>`，其中 `EventHandler<T>`\
  \ 具有如下签名：\n\n点击此处查看代码图像\n\n\n\n\n```\n\nvoid EventHandler<TEventArgs>(object sender,\
  \ TEventArgs e)\n```\n\n因此，为了符合匹配 `EventHandler<T>` 的事件约定，`async` 事件需要返回 `void`。人们可能会建议更改约定，但（如\
  \ 第 14 章 所示），可能有多个订阅者，而从多个订阅者处获取返回值是不直观且繁琐的。出于此原因，指南是避免使用 `async void` 方法，除非它们是事件处理程序的订阅者——在这种情况下，它们不应该抛出异常。或者，您应该提供一个同步上下文来接收同步事件的通知，例如工作调度（例如\
  \ `Task.Run()`）以及可能更重要的未处理异常。列表 20.9 和附带的输出 20.2 提供了如何执行此操作的示例。\n\n`5.0` `4.0`\n\
  \n#### 列表 20.9：从 `async void` 方法中捕获异常\n\n点击此处查看代码图像\n\n```\nusing System;\n\nusing\
  \ System.Threading;\n\nusing System.Threading.Tasks;\n\npublic class AsyncSynchronizationContext\
  \ : SynchronizationContext\n\n{\n\n  public Exception? Exception { get; set; }\n\
  \n  public ManualResetEventSlim ResetEvent { get;} = new ManualResetEventSlim();\n\
  \n  public override void Send(SendOrPostCallback callback, object? state)\n  {\n\
  \      try\n      {\n          Console.WriteLine($@\"Send notification invoked...(Thread\
  \ ID: {\n\n              Thread.CurrentThread.ManagedThreadId})\");\n\n        \
  \  callback(state);\n      }\n      catch (Exception exception)\n      {\n     \
  \     Exception = exception;\n\n#if !WithOutUsingResetEvent\n\n          ResetEvent.Set();\n\
  \n#endif\n      }\n  }\n\n  public override void Post(SendOrPostCallback callback,\
  \ object? state)\n  {\n      try\n      {\n          Console.WriteLine($@\"Post\
  \ notification invoked...(Thread ID: {\n              Thread.CurrentThread.ManagedThreadId})\"\
  );\n\n          callback(state);\n      }\n      catch (Exception exception)\n \
  \     {\n          Exception = exception;\n\n#if !WithOutUsingResetEvent\n\n   \
  \       ResetEvent.Set();\n\n#endif\n      }\n  }\n}\n\npublic static class Program\n\
  \n{\n\n  static bool EventTriggered { get; set; }\n\n  public const string ExpectedExceptionMessage\
  \ = \"Expected Exception\";\n\n  public static void Main()\n  {\n      SynchronizationContext?\
  \ originalSynchronizationContext =\n          SynchronizationContext.Current;\n\
  \      try\n      {\n          AsyncSynchronizationContext synchronizationContext\
  \ =\n              new AsyncSynchronizationContext();\n          SynchronizationContext.SetSynchronizationContext(\n\
  \              synchronizationContex t);\n\n          await OnEvent(typeof(Program),\
  \ EventArgs.Empty);\n\n#if WithOutUsingResetEvent\n          Task.Delay(1000).Wait();\
  \  //\n\n#else\n          synchronizationContext.ResetEvent.Wait();\n\n#endif\n\
  \          if(synchronizationContext.Exception != null)\n          {\n         \
  \     Console.WriteLine($@\"Throwing expected exception....(Thread\n           \
  \   ID: {\n              Thread.CurrentThread.ManagedThreadId})\");\n\n        \
  \      System.Runtime.ExceptionServices.ExceptionDispatchInfo.\nCapture(\n     \
  \             synchronizationContext.Exception).Throw();\n          }\n      }\n\
  \      catch(Exception exception)\n      {\n          Console.WriteLine($@\"{exception}\
  \ thrown as expected.(Thread ID: {\n              Thread.CurrentThread.ManagedThreadId})\"\
  );\n      }\n      finally\n      {\n          SynchronizationContext.SetSynchronizationContext(\n\
  \              originalSynchronizationContext);\n      }\n  }\n\n  private static\
  \ async void OnEvent(object sender, EventArgs eventArgs)\n  {\n      Console.WriteLine($@\"\
  Invoking Task.Run...(Thread ID: {\n              Thread.CurrentThread.ManagedThreadId})\"\
  );\n      await Task.Run(()=>\n      {\n            {\n          EventTriggered\
  \ = true;\n          Console.WriteLine($@\"Running task... (Thread ID: {\n     \
  \         Thread.CurrentThread.ManagedThreadId})\");\n          throw new Exception(ExpectedExceptionMessage);\n\
  \      });\n  }\n}\n```\n\n`5.0` `4.0`\n\n#### 输出 20.2\n\n点击此处查看代码图像\n\n```\nInvoking\
  \ Task.Run...(Thread ID: 8)\n\nRunning task... (Thread ID: 9)\n\nPost notification\
  \ invoked...(Thread ID: 8)\n\nPost notification invoked...(Thread ID: 8)\n\nThrowing\
  \ expected exception....(Thread ID: 8)\n\nSystem.Exception: Expected Exception\n\
  \  at AddisonWesley.Michaelis.EssentialCSharp.Chapter20.Listing20_09.\nProgram.Main()\
