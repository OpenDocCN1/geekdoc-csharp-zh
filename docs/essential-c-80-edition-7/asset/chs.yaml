  <DocumentationFile>$(OutputPath)\\$(TargetFramework)\\$(AssemblyName).xml\n\n</DocumentationFile>\n\
  ```\n\n该元素会导致在构建期间向输出目录生成 XML 文件，并使用 `<assemblyname>.xml` 作为文件名。使用之前列出的 `CommentSamples`\
  \ 类和此处列出的编译器选项，生成的 `CommentSamples.XML` 文件如 Listing 10.18 所示。\n\n**Listing 10.18:\
  \ `Comments.xml`**\n\n点击此处查看代码图像\n\n```xml\n<?xml version=\"1.0\"?>\n\n<doc>\n \
