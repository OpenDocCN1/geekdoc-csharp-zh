  \ $@\"The poorest country in the world in 2017 was {\n        country}, {capital}:\
  \ {gdpPerCapita}\");\n```\n |\n| 4. | 将元组分配给使用分发语法的单独声明的隐式类型变量。 | |\n```\nvar (country,\
  \ capital, gdpPerCapita) =\n    (\"South Sudan\", \"Juba\", 275.18);\n\nSystem.Console.WriteLine(\n\
  \    $@\"The poorest country in the world in 2017 was {\n        country}, {capital}:\
