  \  }\n}\n\npublic struct Cell\n{\n    // Use read-only field prior to C# 6.0\n \
  \   public int X { get; }\n    public int Y { get; }\n    public Cell(int x, int\
  \ y)\n    {\n        X = x;\n        Y = y;\n    }\n}\n```\n\n列表 12.2 的运行出现在输出 12.1\
  \ 中。\n\n`2.0`\n\n**输出 12.1**\n\n![命令提示符的输出屏幕显示了一个使用箭头键绘制的草图。该草图通过按顺序使用以下键完成：上箭头、右箭头、上箭头、右箭头、上箭头、右箭头、下箭头、右箭头、右箭头和下箭头。](img/12output01.jpg)\n\
  \n使用声明为 `System.Collections.Stack` 的变量 `path`，通过将自定义类型 `Cell` 传递给 `Stack.Push()`\
  \ 方法（`path.Push(currentPosition)`）来保存上一步。如果用户输入 `Z`（或按下 Ctrl+Z），你通过使用 `Pop()` 方法从栈中检索它来撤销上一步，将光标位置设置为之前的位置，并调用\
  \ `Undo()`。\n\n尽管这段代码可以运行，但 `System.Collections.Stack` 类有一个根本性的缺陷。如列表 12.1 所示，`Stack`\
  \ 类收集的是 `object` 类型的值。由于通用语言运行时 (CLR) 中的每个对象都派生自 `object`，因此 `Stack` 无法验证你放入其中的元素是否是同的或是否是预期的类型。例如，你可以不传递\
  \ `currentPosition`，而是传递一个字符串，其中 `X` 和 `Y` 之间用小数点连接。然而，编译器必须允许这些不一致的数据类型，因为栈类的编写设计为为接收任何对象，无论其更具体的类型是什么。\n\
  \n`2.0`\n\n此外，当使用 `Pop()` 方法从栈中检索数据时，你必须将返回值强制转换为 `Cell`。但如果 `Pop()` 方法返回的值类型不是\
  \ `Cell`，则会抛出异常。通过使用强制转换将类型检查推到运行时，你使程序变得更加脆弱。在不使用泛型的情况下创建可以处理多种数据类型的类，其根本问题在于它们必须与一个公共基类（或接口）工作，通常是\
  \ `object`。\n\n在运行 `object` 的类中使用值类型（如结构体或整数）会加剧这个问题。例如，如果你将一个值类型传递给 `Stack.Push()`\
  \ 方法，运行时会自动对其进行装箱（boxing）。同样，当你检索一个值类型时，你需要显式地对数据进行拆箱并将从 `Pop()` 方法获得的 `object`\
  \ 引用强制转换为值类型。将引用类型转换为基类或接口对性能的影响微乎其微，但值类型的装箱操作会引入更多的开销，因为必须分配内存、复制值，并在之后垃圾回收该部分内存。\n\
  \nC# 是一门鼓励类型安全的语言：该语言的设计初使得许多类型错误（例如将整数赋值给 `string` 类型的变量）可以在编译时被捕。根本问题是 `Stack`\
  \ 类并不像 C# 程序预期的那样具有类型安全。要更改 `Stack` 类通过限制栈的内容为特定数据类型来强制类型安全（不使用泛型），你必须创建一个专门的 `stack`\
  \ 类，如列表 12.3 所示。\n\n**列表 12.3：定义专门的栈类**\n\n点击此处查看代码图像\n\n```cs\npublic class CellStack\n\
  {\n  public virtual Cell Pop();\n  public virtual void Push(Cell cell);\n  // ...\n\
  }\n```\n\n由于 `CellStack` 只能存储 `Cell` 类型的对象，此解决方案需要对栈方法进行自定义实现，这并不如人意。实现一个类型安全的整数栈将需要另一个实现；每个实现看起来都与其他非常相似。\n\
  \n`2.0`\n\n在不使用泛型的情况下，实现可空类型的另一种策略是声明一个具有 `object` 属性的单一类型，如列表 12.5 所示。\n\n**列表\
  \ 12.5：声明一个具有 `object` 类型属性的可空类型**\n\n点击此处查看代码图像\n\n```cs\nstruct Nullable\n{\n\
  \    /// <summary>\n    /// 当 HasValue 返回 true 时提供值\n    /// </summary>\n    public\
  \ object Value{ get; private set; }\n\n    /// <summary>\n    /// 表示是否存在值或值为“null”\n\
  \    /// </summary>\n    public bool HasValue{ get; private set; }\n\n    ...\n\
  }\n```\n\n尽管这种方案只需要一种可空类型，但运行时在设置 `Value` 属性时始终会对值类型进行装箱。此外，从 `Value` 属性检索底层值需要强制转换，这在运行时可能是无效的。\n\
  \n这两种方案都不特别吸引人。为了解决这个问题，C# 2.0 在 C# 中引入了泛型。\n\n### 引入泛型\n\n泛型提供了一种创建可以针对特定类型专门化的数据结构的方法。程序员定义**参数化类型**，使得特定泛型的每个变量都具有相同的算法，但数据类型和方法签名可以根据为类型参数提供的类型参数的变化。\n\
  \n#### 使用泛型类\n\n列表 12.6 展示了如何指定泛型类的实际类型参数。通过在对象创建表达式和声明语句中使用角括号符号指定 `Cell`，你指示 `path`\
  \ 变量为“Cell 栈”类型。也就是说，当使用泛型数据类型声明变量（在此例中为 `path`）时，C# 要求识别泛型所使用的实际类型参数。\n\n\n\n\n\
  \n# 列表 12.6：使用泛型 `Stack` 类实现撤销\n\n点击此处查看代码图片\n\n```csharp\nusing System;\n\nusing\
  \ System.Collections.Generic;\nclass Program\n{\n  // ...\n\n  public void Sketch()\n\
  {\n      Stack<Cell> path;          // 泛型变量声明            \n      path = new Stack<Cell>();\
  \  // 泛型对象实例化            \n      Cell currentPosition;\n      ConsoleKeyInfo key;\n\
  \n      do\n      {\n          // 根据用户输入的\n          // 方向键的方向进行刻画\n          key\
  \ = Move();\n          switch (key.Key)\n          {\n              case ConsoleKey.Z:\n\
  \                  // 撤销上一次 Move\n                  if (path.Count >= 1)\n     \
  \             {\n                      // 不需要强制类型转换                            \
  \        \n                      currentPosition = path.Pop();                 \
  \         \n                      Console.SetCursorPosition(\n                 \
  \         currentPosition.X, currentPosition.Y);\n                      Undo();\n\
  \                  }\n                  break;\n              case ConsoleKey.DownArrow:\n\
  \              case ConsoleKey.UpArrow:\n              case ConsoleKey.LeftArrow:\n\
  \              case ConsoleKey.RightArrow:\n                  // SaveState()\n \
  \                 currentPosition = new Cell(\n                      Console.CursorLeft,\
  \ Console.CursorTop);\n                  // 在 Push() 调用中只允许 Cell 类型            \
  \     \n                  path.Push(currentPosition);                          \
  \       \n                  break;\n              default:\n                  Console.Beep();\
  \  // C# 2.0 中新增\n                  break;\n          }\n      } while (key.Key\
  \ != ConsoleKey.X);  // 使用 X 退出\n  }\n}\n```\n\n列表 12.6 的结果显示在输出 12.2 中。\n\n## 输出\
  \ 12.2\n\n![命令提示符的输出屏幕显示了一个使用方向键绘制的草图。该草图使用方向键按顺序完成：向上箭头、右箭头、向下箭头、右箭头、向上箭头、右箭头、向下箭头、右箭头、向上箭头。](img/12output02.jpg)\
  \ `2.0`\n\n在列表 12.6 所示的 `path` 中，你定义了一个变量并用 `System.Collections.Generic.Stack<Cell>`\
  \ 类的新实例对其进行初始化。你在尖括号中指定栈元素的数据类型为 `Cell`。因此，添加到 `path` 和从 `path` 取出的每个对象都是 `Cell`\
  \ 类型。反过来，你不再需要对 `path.Pop()`的返回值进行强制类型转换，也不需要确保 `Push()` 方法中只向 `path` 添加 `Cell`\
  \ 类型对象。\n\n## 定义简单的泛型类\n\n泛型允许你编写算法和模式，并为不同的数据类型重用代码。列表 12.7 创建一个泛型 `Stack<T>` 类，它类似于列表\
  \ 12.6 代码中使用的 `System.Collections.Generic.Stack<T>` 类。你在类名后的尖括号内指定指定一个**类型参数**（在本例中为\
  \ `T`）。随后可以为泛型 `Stack<T>` 提供单个类型参数，该参数将替换类中所有出现 `T` 的地方。因此，栈可以存储任何指定类型的项，而无需重复代码或将该项转换为\
  \ `object` 类型。类型参数 `T` 是一个占位符，必须提供类型参数。在列表 12.7 中，你可以看到类型参数将用于内部的 `Items` 数组、`Push()`\
  \ 方法的参数类型，以及 `Pop()` 方法的返回类型。\n\n### 列表 12.7：声明泛型类，`Stack<T>`\n\n点击此处查看代码图片\n\n\
  ```csharp\npublic class Stack<T>\n{\n        public Stack(int maxSize)\n       \
  \ {\n            InternalItems = new T[maxSize];\n        }\n\n    // 在 C# 6.0 之前使用只读字段\n\
  \    private T[] InternalItems { get; }\n\n    public void Push(T data)\n    {\n\
  \        ...\n    }\n\n    public T Pop()\n    {\n        ...\n    }\n}\n```\n`2.0`\n\
  \n## 泛型的优势\n\n使用泛型类而非非泛型版本（例如之前使用的 `System.Collections.Generic.Stack<T>` 类代替原始的\
  \ `System.Collections.Stack` 类型）有几个优势：\n\n1.  泛型有助于提高类型安全性，防止使用除参数化类中成员显式意图类型以外的数据类型。在列表\
  \ 12.7 中，参数化栈类在使用 `Stack<Cell>` 时将你限制在 `Cell` 数据类型上。例如，`path.Push(\"garbage\")`\
  \ 语句将产生编译时错误，指示 `System.Collections.Generic.Stack<T>.Push(T)` 没有可以处理字符串的重载方法，因为字符串无法转换为\
  \ `Cell`。\n2.  编译时类型检查减少了运行时出现 `InvalidCastException` 类型错误的概率。\n3.  在泛型成员中使用值类型不再会导致装箱（boxing）。例如，`path.Pop()`\
  \ 和 `path.Push()` 不需要装箱。\n4.  泛型减少了代码膨胀。\n5.  泛型保留了特定类的优势而没有开销。例如，不再需要定义如 `CellStack`\
  \ 的类。\n6.  由于不再需要从对象进行强制转换，性能得到了提高。\n7.  泛型通过避免装箱减少了内存消耗。\n8.  由于减少了转换检查以及对特定类型实现的需求，代码变得更易读。\n\
  9.  通过某种类型提示的编辑器可以直接与泛型类工作。\n\n`2.0`\n\n泛型的核心提供了编写模式实现并在任何出现模式的地方重用它们的能力。\n\n###\
  \ 类型参数命名指南\n\n与命名方法的形式参数一样，在命名类型参数时应尽可能具体。此外，为了区分该参数为类型参数，其名称应包含 `T` 前缀。例如，在定义如\
  \ `EntityCollection<TEntity>` 的类时，使用类型参数名称 `TEntity`。\n\n唯一不需要描述性类型参数名称的情况是这种描述没有提供任何价值。例如，在\
  \ `Stack<T>` 类中使用 `T` 是合适的，因为指示 `T` 是类型参数已经足够具体了；栈适用于任何类型。\n\n在下一节中，你将学习约束（constraints）。使用约束描述性的类型名称是一个良好实践。例如，如果类型参数必须实现\
  \ `IComponent`，考虑使用类型名称 `TComponent`。\n\n### 泛型接口和结构体\n\nC# 支持在语言各个地方使用泛型，包括接口和结构体。语法与类相同。要声明带有类型参数的接口，将类型参数放在接口名后的尖括号内，如列表\
  \ 12.8 中 `IPair<T>` 的示例所示。\n\n### 列表 12.8：声明泛型接口\n\n点击此处查看代码图片\n\n```csharp\ninterface\
  \ IPair<T>\n{\n    T First { get; set; }\n    T Second { get; set; }\n}\n```\n`2.0`\n\
  \n\n\n\n此接口表示同类对象的对，例如点的坐标、一个人的遗传父母或二叉树的节点。配对中包含的类型对于两个项来说是相同的。\n\n要实现该接口，你使用的与非泛型类相同的语法。请注意，一个泛型类型的类型参数可以是另一个泛型类型的类型参数，这在法律上是允许的——事实上也是常见做法，如列表\
  \ 12.9 所示。接口的类型参数是类所声明的类型参数。此外，此示例使用了 `struct` 而不是 `class`，证明了 C# 支持自定义泛型值类型。\n\n\
  **列表 12.9：实现泛型接口**\n\n点击此处查看代码图像\n\n```cs\npublic struct Pair<T>: IPair<T>\n{\n\
  \    public T First { get; set; }\n    public T Second { get; set; }\n}\n```\n\n\
  泛型接口的支持对于集合类尤为重要，因为泛型在集合类中最为常见。在 C# 引入泛型之前，开发者依赖于 `System.Collections` 命名空间中的一系列接口。与它们的实现类一样，这些接口仅与\
  \ `object` 类型一起，因此，接口强制所有对这些集合类的访问和返回都需要进行类型转换。通过使用类型安全的泛型接口，你可以避免类型转换操作。\n\n###\
  \ 定义构造函数和终结器\n\n可能令人惊讶的是，泛型类或 `struct` 的构造函数（以及终结器）不需要类型参数；换句话说，它们不需要 `Pair<T>(){...}`。在列表\
  \ 12.11 中的配对示例中，构造函数使用 `public Pair(T first, T second)` 进行声明。\n\n**列表 12.11：声明泛型类型的构造函数**\n\
  \n点击此处查看代码图像\n\n```cs\npublic struct Pair<T>: IPair<T>\n{\n  public Pair(T first,\
  \ T second)                                   \n  {                            \
  \                                    \n      First = first;                    \
  \                           \n      Second = second;                           \
  \                  \n  }                                                       \
  \         \n  public T First  { get; set; }\n  public T Second  { get; set; }\n\
  }\n```\n\n### 使用 `default` 运算符指定默认值\n\n列表 12.11 包含一个接收 `First` 和 `Second` 初始值并将其赋值给它们的构造函数。由于\
  \ `Pair<T>` 是一个 `struct`，你提供的任何构造函数必须初始化所有字段和自动实现的属性。然而，这带来了一个问题。\n\n考虑一个 `Pair<T>`\
  \ 的构造函数，它在实例化时仅初始化配对的一半。如列表 12.12 所示，定义这样的构造函数会导致编译错误，因为在构造函数结束时字段 `Second` 仍然未初始化。为\
  \ `Second` 提供初始化会带来问题，因为你不知道 `T` 的数据类型。如果它是可空类型，`null` 可以工作，但如果 `T 是是非可空类型，这种方法将无法运行。\n\
  \n**列表 12.12：未初始化所有字段，导致编译错误**\n\n点击此处查看代码图像\n\n```cs\npublic struct Pair<T>: IPair<T>\n\
  {\n  // ERROR:  Field 'Pair<T>.Second' must be fully assigned\n  //         before\
  \ control leaves the constructor\n  // public Pair(T first)\n  // {\n  //     First\
  \ = first;\n  // }\n  // ...\n}\n```\n\n`2.0 Begin 7.0`\n\n为了处理这种情况，C# 提供了 `default`\
  \ 运算符。例如，`int` 的默认值可以通过 `default` 指定（假设使用 C# 7.1）。对于 `Second` 所需的 `T`，你可以使用 `default`，如列表\
  \ 12.13 所示。\n\n**列表 12.13：使用 `default` 运算符初始化字段**\n\n点击此处查看代码图像\n\n```cs\npublic\
  \ struct Pair<T>: IPair<T>\n{\n  public Pair(T first)\n  {\n      First = first;\n\
  \      Second = default;                                         \n  }\n  // ...\n\
  }\n```\n\n`default` 运算符可以为任何类型提供默认值，包括类型参数。\n\n在 C# 7.1 之前，必须始终向 `default` 运算符传递类型参数，例如\
  \ `Second = default(T)`。然而，C# 7.1 包含了在可能推断出数据类型时不指定参数而使用 `default` 的选项。例如，在变量初始化或赋值时，可以使用\
  \ `Pair<T> pair = default` 来代替 `Pair<T> pair = default(Pair<T>)`。此外，如果一个方法返回 `int`，则可以直接可以使用\
  \ `return default` 并让编译器从返回中推断出 `default(int)`。\n\n\n\n\n```\nPair<int, string>\
  \ historicalEvent =\n\n    new Pair<int, string>(1914,\n\n        \"Shackleton leaves\
  \ for South Pole on ship Endurance\");\n\nConsole.WriteLine(\"{0}: {1}\",\n    historicalEvent.First,\
  \ historicalEvent.Second);\n```\n\n类型参数的数量——即 `arity`（元数）——将该类与其他同名的类唯一地区分开来。由于这种元数的变化，可以在同一个命名空间内同时定义\
  \ `Pair<T>` 和 `Pair<TFirst, TSecond>`。此外，由于它们之间存在紧密的语义关系，仅在元数上不同的泛型应该放在同一个 C# 文件中。\n\
  \n`开始 7.0`\n\n`ValueTuple<...>` 类 set 的设计目的与 `Pair<T>` 和 `Pair<TFirst, TSecond>`\
  \ 类相同，不同在于它们共同可以处理八个类型参数。事实上，使用列表 12.16 中显示的最后一个 `ValueTuple`，`TRest` 可以用来存储另一个\
  \ `ValueTuple`，使得元组的元素数量在实际上是无限制的。而且，如果你使用 C# 7.0 的元组语法来定义这样的元组，这就是编译器将生成的内容。\n\n\
  元组类族中另一个有趣的成员是非泛型的 `ValueTuple` 类。该类有八个静态工厂方法，用于实例化各种泛型元组类型。虽然每个泛型类型都可以使用其构造函数直接实例化，但\
  \ `ValueTuple` 类型的工厂方法允许通过 `Create()` 方法对类型参数进行推断。这在 C# 7.0 中并不重要，因为代码像 `var keyValuePair\
  \ = (\"555-55-5555\", new Contact(\"Inigo Montoya\"))` 一样简单（假设没有命名项）。然而，如列表 12.17\
  \ 所示，对于 C# 6.0 来说，结合类型推断使用 `Create()` 方法更容易。\n\n**列表 12.17：比较 `System.ValueTuple`\
  \ 实例化方法**\n\n点击此处查看代码图像\n\n```\n#if !PRECSHARP7\n\n  (string, Contact) keyValuePair;\n\
  \n  keyValuePair =\n      (\"555-55-5555\", new Contact(\"Inigo Montoya\"));\n\n\
  #else  // C# 7.0 之前使用 System.ValueTupe<string,Contact>\n\n  ValueTuple<string, Contact>\
  \ keyValuePair;\n\n  keyValuePair =\n      ValueTuple.Create(                  \
  \                                 \n\n          \"555-55-5555\", new Contact(\"\
  Inigo Montoya\"));\n\n  keyValuePair =\n      new ValueTuple<string, Contact>( \
  \                                     \n\n          \"555-55-5555\", new Contact(\"\
  Inigo Montoya\"));\n\n#endif // !PRECSHARP7\n```\n\n显然，当 `ValueTuple` 变得很大时，如果没有\
  \ `Create()` 工厂方法，指定类型参数的数量将非常繁琐。\n\n`2.0`开始 4.0`结束 7.0`结束 4.0`\n\n注意 C# 4.0 中添加了一个类似的元组类：`System.Tuple`。然而，人们认为，大量使用\
  \ C# 7.0 的元组语法以及由此引入的元组泛滥，使得创建 `System.ValueTuple` 类型是值得的，因为它提供了性能改进。\n\n正如你可能从框架库声明了八种不同的泛型\
  \ `System.ValueTuple` 类型中推断出的那样，CLR 类型系统不支持 `variadic`（变长）泛型类型。方法可以通过`参数数组`接受任意数量的参数，但对于泛型类型没有对应的技术；每个泛型类型必须具有特定的元数。（请参见“入门主题：元组：丰富的元数”以查看一个你可能想象具有这种功能的示例。）\n\
  \n### 嵌套泛型类型\n\n包含泛型类型上的类型参数将自动“级联”到任何嵌套类型上。如果包含类型声明了类型参数 `T`，例如，所有嵌套类型也将是泛型的，并且类型参数\
  \ `T` 在嵌套类型中也是可用的。如果嵌套类型包含了它自己的命名为 `T` 的类型参数，这将隐藏包含类型中的类型参数，并且嵌套类型中对 `T` 的任何引用将指向嵌套的\
  \ `T` 类型参数。幸运的是，在嵌套类型内部重用相同的类型参数名称会导致编译器警告，以防止意外重叠（参见列表 12.18）。\n\n**列表 12.18：嵌套泛型类型**\n\
  \n点击此处查看代码图像\n\n```\nclass Container<T1, T2>\n{\n\n  // 嵌套类继承类型参数。\n  // 重用类型参数名称会导致\n\
  \  // 警告。\n  class Nested<T2>\n  {\n      void Method(T1 param0, T2 param1)    \
  \                             \n      {\n      }\n  }\n}\n```\n\n包含类型的类型参数在嵌套类型中的访问方式，与包含类型的成员从嵌套类型中被访问的方式相同。规则简单来说就是：类型参数在声明它的类型体内的任何地方都是可用的。\n\
  \n`2.0`\n\n### 约束\n\n泛型支持在类型参数上定义约束的能力。这些约束确保提供的类型符合各种规则。例如，列表 12.19 所示的 `BinaryTree<T>`\
  \ 类。\n\n`2.0`\n\n**列表 12.19：无约束的 `BinaryTree<T>` 类**\n\n点击此处查看代码图像\n\n```\npublic\
  \ class BinaryTree<T>\n{\n    public BinaryTree(T item)\n    {\n        Item = item;\n\
  \    }\n\n    public T Item { get; set; }\n\n    public Pair<BinaryTree<T>> SubItems\
  \ { get; set; }\n}\n```\n\n（一个有趣的说明是，`BinaryTree<T>` 内部使用了 `Pair<T>`，这是因为 `Pair<T>`\
  \ 是另一个类型。）\n\n假设你希望树在赋值给 `SubItems` 属性时对 `Pair<T>` 值进行排序。为了实现排序，`SubItems` set 访问器使用了提供的键的\
  \ `CompareTo()` 方法，如列表 12.20 所示。\n\n`2.0`\n\n**列表 12.20：类型参数支持接口**\n\n点击此处查看代码图像\n\
  \n```\npublic class BinaryTree<T>\n{\n  public BinaryTree(T item)\n  {\n      Item\
  \ = item;\n  }\n\n  public T Item { get; set; }\n\n  public Pair<BinaryTree<T>>\
  \ SubItems\n  {\n      get{ return _SubItems; }\n      set\n      {\n          IComparable<T>\
  \ first;\n          // 错误：无法隐式转换类型...\n          first = value.First;  // 需要显式转换\n\
  \          if (first.CompareTo(value.Second) < 0)\n          {\n              //\
  \ first 小于 second\n              // ...\n          }\n          else\n         \
  \ {\n              // first 和 second 相同或\n              // second 小于 first\n   \
  \           // ...\n          }\n\n          _SubItems = value;\n      }\n  }\n\n\
  \  private Pair<BinaryTree<T>> _SubItems;\n}\n```\n\n\n\n\n\n在编译时，类型参数 `T` 是一个未受约束的泛型。当代码如列表\
  \ 12.20 所示所示编写时，编译器假设 `T` 上可用的成员仅继承自基类型 `object` 的成员，因为每个类型都以 `object` 为基类。因此，只能在类型参数\
  \ `T` 的实例上调用诸如 `ToString()` 等方法。结果是编译器会显示编译错误，因为在 `object` 类型上没有定义 `CompareTo()`\
  \ 方法。\n\n你可以将类型参数 `T` 强制转换为 `IComparable<T>` 接口以访问 `CompareTo()` 方法，如列表 12.21 所示。\n\
  \n`2.0`\n\n**列表 12.21：需要类型参数支持接口或会抛出异常**\n\n点击此处查看代码图像\n\n```\npublic class BinaryTree<T>\n\
  {\n  public BinaryTree(T item)\n  {\n      Item = item;\n  }\n  public T Item {\
  \ get; set; }\n  public Pair<BinaryTree<T>?>? SubItems\n  {\n      get{ return _SubItems;\
  \ }\n      set\n      {\n          switch(value)\n          {\n              //\
  \ 为了解释删除了空处理\n              // 使用 C# 8.0 模式匹配。切换到\n              // C# 8.0 之前的空值检查\n\
  \              case {\n                      First: {Item: IComparable<T> first\
  \ },                  \n                      Second: {Item: T second } }:\n   \
  \               if(first.CompareTo(second) < 0)\n                  {\n         \
  \             // first 小于 second\n                  }\n                  else\n\
  \                  {\n                      // second 小于或等于 first\n            \
  \      }\n                  break;\n              default:\n                  throw\
  \ new InvalidCastException(\n                      @$\"Unable to sort the items.\
  \ {\n                          typeof(T) } does not support IComparable<T>\");\n\
  \          }\n          _SubItems = value;\n      }\n  }\n  private Pair<BinaryTree<T>?>?\
  \ _SubItems;\n}\n```\n\n遗憾的是，如果你现在声明了一个 `BinaryTree<SomeType>` 类变量，但类型参数（`SomeType`）没有实现\
  \ `IComparable<SomeType>` 接口，则没有办法对项进行排序；反，我们会抛出一个 `InvalidCastException`，指示该类型不支持所需的接口。这消除了使用泛型的核心理由之一：提高类型安全。\n\
  \n为了避免此异常，并在类型参数未实现接口时生成编译时错误，C# 允许你为泛型类型中声明的每个类型参数提供一个可选的约束列表。约束声明了泛型类型对每个类型参数所提供的类型参数所要求的特征。你使用\
  \ `where` 关键字声明约束，后面紧跟一个参数-要求对，其中该参数必须是泛型类型中声明的参数之一。要求描述了以下三种情况之一：类型参数必须转换的类或接口、是否存在默认构造函数，或者引用类型/值类型的限制。\n\
  \n`2.0`\n\n### 接口约束\n\n为了确保二叉树的节点顺序正确，你可以使用 `BinaryTree` 类中的 `CompareTo()` 方法。为了最有效地实现这一点，你应该对类型参数\
  \ `T` 施加约束。也就是说，你需要类型参数 `T` 实现 `IComparable<T>` 接口。声明此约束的语法出现在列表 12.22 中。\n\n**列表\
  \ 12.22：声明接口约束**\n\n点击此处查看代码图像\n\n```\npublic class BinaryTree<T>\n    where T:\
  \ System.IComparable<T>                                      \n{\n  public BinaryTree(T\
  \ item)\n  {\n      Item = item;\n  }\n  public T Item { get; set; }\n  public Pair<BinaryTree<T>>\
  \ SubItems\n  {\n      get{ return _SubItems; }\n      set\n      {\n          switch(value)\n\
  \          {\n              // 为了解释删除了空处理\n              // 使用 C# 8.0 模式匹配。切换到\n\
  \              // C# 8.0 之前的空值检查\n              case {\n                      First:\
  \ {Item: T first },                           \n                      Second: {Item:\
  \ T second } }:\n                  if(first.CompareTo(second) < 0)\n           \
  \       {\n                      // first 小于 second\n                  }\n     \
  \             else\n                  {\n                      // second 小于或等于 first\n\
  \                  }\n                  break;\n              default:\n       \
  \           throw new InvalidCastException(\n                      @$\"Unable to\
  \ sort the items. {\n                          typeof(T) } does not support IComparable<T>\"\
  );\n          }\n          _SubItems = value;\n      }\n  }\n  private Pair<BinaryTree<T>?>?\
  \ _SubItems;\n}\n```\n\n`2.0`\n\n虽然此示例中的代码更改很小，但它将错误识别从运行时移动到了编译器，这是一个重要的区别。在列表\
  \ 12.22 中添加了接口约束后，编译器确保每次你使用 `BinaryTree<T>` 时，类型参数都实现了 `IComparable<T>` 接口。此外，在调用\
  \ `CompareTo()` 方法之前，不再需要将变量强制转换为 `IComparable<T>`。访问显式接口实现的成员甚至不需要转换。如果你尝试使用 `StringBuilder`\
  \ 作为类型参数创建 `BinaryTree<T>` 变量，你将收到编译错误，因为 `StringBuilder` 没有实现 `IComparable<StringBuilder>`。该错误与输出\
  \ 12.3 所示所示。\n\n**输出 12.3**\n\n点击此处查看代码图像\n\n```\nerror CS0311: 类型 'System.Text.StringBuilder'\
  \ 不能作为泛型类型或方法 'BinaryTree<T>' 的类型参数 'T'。从 'System.Text.StringBuilder' 到 'System.IComparable<StringBuilder>'\
  \ 没有隐式引用转换。\n```\n\n### 类型参数约束\n\n有时你可能需要约束类型参数转换为特定类型。你通过类型参数约束来实现，如列表 12.23 所示。\n\
  \n**列表 12.23：声明类类型约束**\n\n点击此处查看代码图像\n\n```\npublic class EntityDictionary<TKey,\
  \ TValue>\n    : System.Collections.Generic.Dictionary<TKey, TValue>\n    where\
  \ TKey: notnull                                                \n    where TValue\
  \ : EntityBase                                          \n{\n    ...\n}\n```\n\n\
  `2.0`\n\n在列表 12.23 中，`EntityDictionary<TKey, TValue>` 要求为类型参数 `TValue` 提供的所有类型参数都隐式转换为\
  \ `EntityBase` 类。通过要求这种转换，可以在泛型实现中使用 `TValue` 类型的值使用 `EntityBase` 的成员，因为约束确保了所有类型参数都可以隐式转换为\
  \ `EntityBase` 类。\n\n\n\n\n类类型约束的语法与接口类型约束相同，不同之处类类型约束必须出现在任何接口类型约束之前（就像在类声明中，基类必须出现在已实现的接口之前）。然而，与接口约束不同，不允许有多个基类约束，因为无法从多个不相关的类进行派生。同样地，基类约束不能指定密封类（sealed\
  \ classes）或非类类型。例如，C# 不允许将类型参数约束为 `string` 或 `System.Nullable<T>`，因为这样该类型参数将只有一个可能的类型参数值——这几乎算不上“泛型”。如果类型测量器（type-meter）被约束为单一类型，那么根本就不需要该类型参数；直接使用该类型即可。\n\
  \n某些“特殊”类型不能作为类类型约束。详情请参阅本章节后的“高级主题：约束的局限性”。\n\n`开始 7.3`\n\n从 C# 7.3 开始，你可以使用 `System.Enum`\
  \ 作为约束，从而确保类型参数是一个枚举。然而，你不能指定类型 `System.Array` 作为约束。尽管如此，后者的限制微乎其微，因为通常情况下其他集合类型和接口更受青；参见第\
  \ 15 章。\n\n### `unmanaged` 约束\n\nC# 7.3 引入了 `unmanaged` 约束，它将类型参数限制为 `sbyte`、`byte`、`short`、`ushort`、`int`、`uint`、`long`、`ulong`、`char`、`float`、`double`、`decimal`、`bool`、枚举、指针或所有字段均为非管理的\
  \ struct。这允许你对非托管约束的类型参数使用 `sizeof`（或 `stackalloc`，参见第 22 章中，有第二个约束：使用上下文关键字 `notnull`\
  \ 的非 `null` 约束。如果为装饰有 `notnull` 的类型参数指定了可空类型，该约束将触发警告。例如，声明 `EntityDictionary<string?,\
  \ EntityBase>` 将导致以下警告：`类型参数 'string?' 的可空性与 'notnull' 约束不匹配`\n\n`notnull` 关键字不能与\
  \ `struct` 或 `class` 约束组合，因为它们默认不是可空的（正如我们接下来描述的那样）。\n\n### `struct/class` 约束\n\n\
  另一个有用的泛型约束是可以限制类型参数为任何非可空值类型或任何引用类型。与其指定 `T` 必须派生的类，你只需直接使用 `struct` 或 `class` 关键字，如列表\
  \ 12.25 所示。\n\n**列表 12.25：将类型参数指定为值类型**\n\n点击此处查看代码图像\n\n```\npublic struct Nullable<T>\
  \ :\n\n     IFormattable, IComparable,\n\n     IComparable<Nullable<T>>, INullable\n\
  \n     where T : struct                                                       \n\
  \n{\n\n    // ...\n  public static implicit operator T?(T value) =>\n\n      new\
  \ T?(value);\n  public static explicit operator T(T? value) => value!.Value;\n}\n\
  ```\n\n注意，`class` 约束将类型参数限制为引用类型，包括接口、委托或数组类型（而不是像关键字可能暗示的那样，仅限于类类型）。\n\n`2.0`\n\
  \n在 C# 8.0 中，`class` 约束默认为不可空（当然，假设已启用可空引用类型）。指定可空引用类型参数将触发编译警告。你可以通过在 `class` 约束上包含可空修饰符来更改泛型以允许可空引用类型。考虑第\
  \ 10 章中引入的 `WeakReference<T>` 类。由于只有引用类型会被垃圾收集，该类型按如下方式包含 `class` 约束：\n\n点击此处查看代码图像\n\
  \n```\npublic sealed partial class WeakReference<T> : ISerializable\n\n        where\
  \ T : class?\n\n{ ... }\n```\n\n这将被类型参数 `T` 限制为引用类型——该类型可以是空的。\n\n与 `class` 约束相反，`struct`\
  \ 约束不允许可空修饰符。相反，你可以在使用参数时指定可空性。例如，在列表 12.25 中，隐式和显式转换运算符分别使用 `T` 和 `T?` 来识别是否允许非可空或可空版本的\
  \ `T`。因此，类型参数是在成员声明中使用时受到约束的，而不是通过类型约束。\n\n由于类类型约束需要引用类型，因此在类类型约束上使用 `struct` 约束将是自矛盾的。因此，你不能结合\
  \ `struct` 和 `class` 约束。\n\n`struct` 约束有一个特殊特性：可空值类型不满足该约束。为什么？可空值类型实现为泛型类型 `Nullable<T>`，它对\
  \ `T` 应用了 `struct` 约束。如果可空值类型满足该约束，就可以定义毫无意义的类型 `Nullable<int>>`。（正如预期的，也不允许简写 `int??`。）\n\
  \n结束 8.0\n\n### 多个约束\n\n`2.0`\n\n对于给定的类型参数，你可以指定任意数量的接口类型约束，但类类型约束最多一个（就像可以实现多个接口但只能继承一个类一样）。每个新约束都写在泛型类型参数后面的逗号分隔列表中。如果有多个类型参数，每个参数必须以\
  \ `where` 关键字开头。在列表 12.26 中，泛型类 `EntityDictionary` 了两个类型参数：`TKey` 和 `TValue`。`TKey`\
  \ 类型参数有两个接口类型约束，`TValue` 类型参数有一个类类型约束。\n\n**列表 12.26：指定多个约束**\n\n点击此处查看代码图像\n\n\
  ```\npublic class EntityDictionary<TKey, TValue>\n\n    : Dictionary<TKey, TValue>\n\
  \n    where TKey : IComparable<TKey>, IFormattable\n\n    where TValue : EntityBase\n\
  \n{\n\n  ...\n\n}\n```\n\n在这种情况下，`TKey` 本身有多个约束，`TValue` 有额外的约束。当对一个类型参数指定多个约束时，假设是“与”的关系。如果提供类型\
  \ `C` 作为 `TKey` 的类型参数，例如 `C` 必须实现 `IComparable<C>` 和 `IFormattable`。\n\n注意每个 `where`\
  \ 子句之间没有逗号。\n\n### 构造函数约束\n\n在某些情况下，在泛型类内部创建类型参数实例是所需的。例如，在列表 12.27 中，`EntityDictionary<TKey,\
  \ TValue>` 类的 `MakeValue()` 方法必须创建类型参数 `TValue`对应的实例。\n\n`2.0`\n\n**列表 12.27：要求默认构造函数的约束**\n\
  \n点击此处查看代码图像\n\n\n\n\n\n```\npublic class EntityBase<TKey>\n\n    where TKey: notnull\n\
  \n{\n\n        public EntityBase(TKey key)\n\n        {\n            Key = key;\n\
  \        }\n\n    public TKey Key { get; set; }\n}\n\npublic class EntityDictionary<TKey,\
  \ TValue> :\n    Dictionary<TKey, TValue>\n    where TKey: IComparable<TKey>, IFormattable\n\
  \    where TValue : EntityBase<TKey>, new()                                \n{\n\
  \n    // ...\n    public TValue MakeValue(TKey key)\n    {\n        TValue newEntity\
  \ = new TValue                                     \n        {                 \
  \                                                \n            Key = key;\n    \
  \    }\n        Add(newEntity.Key, newEntity);\n        return newEntity;\n    }\n\
  \n    // ...\n}\n```\n\n并不是所有的对象都保证具有公共的默认构造函数，因此编译器不允许你对无约束的类型参数调用默认构造函数。为了覆盖此编译器限制，你可以在所有其他约束之后添加\
  \ `new()` 文本。该文本被称为“构造函数约束”，它要求对应于受约束类型参数的类型参数必须具有公共或内部的默认构造函数。目前仅支持构造函数约束。你无法指定约束来确保提供的类型参数提供接受形式参数的构造函数。\n\
  \n列表 12.27 包含一个构造函数约束，强制要求为 `TValue` 提供的类型参数提供一个公共无参构造函数。没有约束可以强制类型参数提供接受其他形式参数的构造函数。例如，你可能希望约束\
  \ `TValue`，以便为其提供的类型参数必须提供一个接受为 `TKey` 提供的类型参数的构造函数，这是无法实现的。列表 12.28 展示了无效代码。\n\n\
  **列表 12.28: 构造函数约束只能为默认构造函数指定**\n\n点击此处查看代码图片\n\n```\n public TValue New(TKey key)\n\
  \    {\n        // 错误: 'TValue': 无法提供参数                     \n        // 在创建变量类型的实例时\
  \                  \n        TValue newEntity = null;                          \
  \               \n        // newEntity = new TValue(key);                      \
  \            \n        Add(newEntity.Key, newEntity);\n        return newEntity;\n\
  \    }\n```\n\n`2.0`\n\n规避此限制的一种方法是提供一个包含实例化类型方法的工厂接口。实现该接口的工厂负责实例化实体，而不是由 `EntityDictionary`\
  \ 本身负责（请参见 列表 12.29）。\n\n**列表 12.29: 使用工厂接口代替构造函数约束**\n\n点击此处查看代码图片\n\n```\npublic\
  \ class EntityBase<TKey>\n{\n  public EntityBase(TKey key)                     \
  \                      \n  {                                                   \
  \                  \n      Key = key;                                          \
  \              \n  }                                                           \
  \          \n  public TKey Key { get; set; }\n}\n\npublic class EntityDictionary<TKey,\
  \ TValue, TFactory> :\n      Dictionary<TKey, TValue>\n  where TKey : IComparable<TKey>,\
  \ IFormattable\n  where TValue : EntityBase<TKey>                              \
  \         \n  where TFactory : IEntityFactory<TKey, TValue>, new()             \
  \     \n{\n  ...\n  public TValue New(TKey key)\n  {\n      TFactory factory = new\
  \ TFactory();\n      TValue newEntity = factory.CreateNew(key);                \
  \        \n      Add(newEntity.Key, newEntity);\n      return newEntity;\n  }\n\
  \  ...\n}\n\npublic interface IEntityFactory<TKey, TValue>                     \
  \      \n{                                                                     \
  \  \n    TValue CreateNew(TKey key);                                         \n\
  }                                                                       \n...\n\
  ```\n\n这样的声明允许你将新的 `key` 传递给接受参数的 `TValue` 工厂方法，而不是强迫你依赖于默认构造函数。它不再对 `TValue` 使用构造函数约束，因为\
  \ `TFactory` 负责实例化值。（对 列表 12.29 中代码的一种修改是缓存工厂方法的引用——如果需要多线程支持，可能利用 `Lazy<T>`。这将使你能够重用工厂方法，而不是每次都重新实例化。）\n\
  \n`2.0`\n\n类型为 `EntityDictionary<TKey, TValue, TFactory>` 的变量声明将导致一个类似于 列表 12.30\
  \ 中 `Order` 实体的实体声明。\n\n**列表 12.30: 声明在 `EntityDictionary<...>` 中使用的实体**\n\n点击此处查看代码图片\n\
  \n```\npublic class Order : EntityBase<Guid>\n{\n  public Order(Guid key) :\n  \
  \    base(key)\n  {\n      // ...\n  }\n}\n\npublic class OrderFactory : IEntityFactory<Guid,\
  \ Order>\n{\n  public Order CreateNew(Guid key)\n  {\n      return new Order(key);\n\
  \  }\n}\n```\n\n#### 约束继承\n\n泛型参数及其约束不会被派生类继承，因为泛型参数不是成员。（记住，类继承意味着派生类拥有基类的所有成员。）创建继承泛型是常见做法。在这种情况下，由于派生类的泛型参数成为了泛型类的类型参数，因此泛型参数必须与基类的约束相等或更强。困惑吗？请考虑\
  \ 列表 12.31。\n\n`2.0`\n\n**列表 12.31: 显式指定继承的约束**\n\n点击此处查看代码图片\n\n```\nclass EntityBase<T>\
  \ where T : IComparable<T>\n{\n  // ...\n}\n```\n\n```\n// 错误:\n// 类型 'U' 必须转换为\n\
  // 'System.IComparable<U>' 以作为泛型类型或方法的参数 'T'\n// class Entity<U> : EntityBase<U>\n\
  // {\n//     ...\n// }\n```\n\n**列表 12.32: 禁止在虚成员上重复继承的约束**\n\n\n\n\n\n```cs\nclass\
  \ EntityBase\n{\n  public virtual void Method<T>(T t)\n      where T : IComparable<T>\n\
  \  {\n      // ...\n  }\n}\n\nclass Order : EntityBase\n{\n  public override void\
  \ Method<T>(T t)\n  //    Constraints may not be repeated on overriding\n  //  \
  \  members\n  //    where T : IComparable<T>\n  {\n      // ...\n  }\n}\n```\n\n\
  `2.0`\n\n在泛型类继承的情况下，派生类上的类型参数可以通过不仅添加基类上的约束（必需的），还可以添加其他约束来进一步进行约束。然而，重写虚方法泛型方法必须完全符合基类方法定义的约束。额外的约束可能会破坏多态性，因此这些约束是不允许的，且重写方法上的类型参数约束是隐式包含的。\n\
  \n**列表 12.33: 约束表达式无法要求运算符**\n\n点击此处查看代码图片\n\n```cs\npublic abstract class MathEx<T>\n\
  {\n    public static T Add(T first, T second)\n    {\n        // 错误：运算符 '+' 无法应用于\n\
  \        // 类型为 'T' 和 'T' 的操作数\n        // return first + second;\n    }\n}\n```\n\
  \n`2.0`\n\n在这种情况下，方法假设 `+` 运算符在所有可能作为 `T` 类型参数提供的类型上都是可用的。但是并没有约束阻止你提供没有关联加法运算符的类型参数，因此发生了错误。遗憾的是，在约束内部没有方法可以指定需要加法运算符，除非使用实现了加法运算符的类类型约束。\n\
  \n更通俗地说，没有方法可以约束一个类型以具有静态方法。\n\n#### 不支持 OR（或）标准\n\n如果你为类型参数提供多个接口或类约束，编译器始终假设约束之间存在\
  \ AND（与）关系。例如，`where T : IComparable<T>, IFormattable` 要求 `IComparable<T>` 和 `IFormattable`\
  \ 均必须被支持。没有方法可以指定约束之间存在 OR（或）关系。因此，不支持等同于 列表 12.34 的代码。\n\n**列表 12.34: 使用 OR 关系组合约束是不允许的**\n\
  \n点击此处查看代码图片\n\n```cs\npublic class BinaryTree<T>\n    // 错误：不支持 OR\n    // where\
  \ T: System.IComparable<T> || System.IFormattable\n{\n    ...\n}\n```\n\n支持此功能将阻止编译器在编译时解析应该调用哪个方法。\n\
  \n### 泛型方法\n\n早些你已经看到，当类型是泛型时，为该类型添加方法是一件相对简单的事情；此类方法可以使用由类型声明的泛型类型参数。你已经这样做了，例如，在我们目前为止为止的泛型类示例中。\n\
  \n泛型方法使用泛型类型参数，就像泛型类型一样。它们可以在泛型类型或非泛型类型中声明。如果声明在泛型类型中，它们的类型参数与包含它们的泛型类型的类型参数是不同的。要声明一个泛型方法，你以处理泛型类型的方式指定泛型类型参数：在方法名后紧跟着添加类型参数声明语法，如\
  \ 列表 12.35 中的 `MathEx.Max<T>` 和 `MathEx.Min<T>` 示例所示。\n\n`2.0`\n\n**列表 12.35: 定义泛型方法**\n\
  \n点击此处查看代码图片\n\n```cs\npublic static class MathEx\n{\n  public static T Max<T>(T\
  \ first, params T[] values)\n      where T : IComparable<T>\n  {\n      T maximum\
  \ = first;\n      foreach (T item in values)\n      {\n          if (item.CompareTo(maximum)\
  \ > 0)\n          {\n              maximum = item;\n          }\n      }\n     \
  \ return maximum;\n  }\n\n  public static T Min<T>(T first, params T[] values)\n\
  \      where T : IComparable<T>\n  {\n      T minimum = first;\n        foreach\
  \ (T item in values)\n        {\n            if (item.CompareTo(minimum) < 0)\n\
  \            {\n                minimum = item;\n            }\n        }\n    \
  \  return minimum;\n  }\n}\n```\n\n在这个示例中，方法是静态的，尽管这不是强制要求的。\n\n泛型方法像泛型类型一样，可以包含多个类型参数。算元个数（类型参数的数量）是方法签的另一个区分特征。也就是说，只要两个方法在方法类型参数算元个数上不同，具有相同名称和形式参数类型的方法是合法的。\n\
  \n`2.0`\n\n#### 泛型方法类型推断\n\n`2.0`\n\n就像在使用泛型类型时在类型名称后提供类型参数一样，方法类型参数是在方法类型名称之后提供的。调用\
  \ `Min<T>` 和 `Max<T>` 方法的代码类似于 列表 12.36 所示。\n\n**列表 12.36: 显式指定类型参数**\n\n点击此处查看代码图片\n\
  \n```cs\nConsole.WriteLine(\n    MathEx.Max<int>(7, 490));\nConsole.WriteLine(\n\
  \    MathEx.Min<string>(\"R.O.U.S.\", \"Fireswamp\"));\n```\n\n列表 12.36 的结果出现在 输出\
  \ 12.4 中。\n\n**输出 12.4**\n\n```\n490\n\nFireswamp\n```\n\n并不意外，类型参数 `int` 和 `string`\
  \ 对应于泛型方法调用中使用的实际类型。然而，显式指定类型参数是冗余的，因为编译器可以从传递给方法的形式参数推导出类型参数。显然，列表 12.36 中 `Max`\
  \ 的调用者意图让类型参数为 `int`，因为两个方法参数的类型都是 `int`。为了避免冗余，当能够逻辑推断时，你可以从调用中排除类型参数。这种做法被称为类型推断，出现在\
  \ 列表 12.37 中。结果出现在 输出 12.5。\n\n**列表 12.37: 从参数推断类型参数**\n\n点击此处查看代码图片\n\n```cs\n\
  Console.WriteLine(\n    MathEx.Max(7, 490)); // 无类型参数！\n\nConsole.WriteLine(\n \
  \   MathEx.Min(\"R.O.U.S.\", \"Fireswamp\"));\n```\n\n**输出 12.5**\n\n```\n490\n\n\
  Fireswamp\n```\n\n`2.0`\n\n为了方法类型推断成功，参数的类型必须与泛型方法的形式参数进行“匹配”，从而能够推出预期的类型参数。一个值得考虑的问题是，当产生冲突推断时会发生什么。例如，当你使用\
  \ `MathEx.Max(7.0, 490)` 调用 `Max<T>` 方法时，编译器可以从第一个参数推导出类型参数应该是 `double`，而从第二个参数推导出类型参数是\
  \ `int`——这产生了冲突。在 C# 2.0 中，这种差异会导致错误。更复杂的分析会注意到，这种冲突是可以解决的，因为每个 `int` 都可以转换为 `double`，所以\
  \ `double` 是类型参数的最佳选择。C# 3.0 和 C# 4.0 均对方法类型推断算法进行了改进，允许编译器进行这些更复杂的分析。\n\n在方法类型推断仍然不足以推断出类型参数的情况下，你可以通过在参数上插入强制转换来向编译器明确推断中应使用的参数类型以解决错误，或者放弃类型推断并显式包含类型参数。\n\
  \n\n\n\n\n请注意，类型推断算法在进行推断时，仅考虑参数、参数的类型以及泛型方法的形式参数类型。在实践中可能用于分析的其他因素——例如泛型方法的返回类型、接收方法返回值的变量的类型，或者对方法泛型类型参数的约束——该算法完全不考虑这些因素。\n\
  \n### 指定约束\n\n泛型方法的类型参数可以像泛型类型的类型参数以相同的方式进行约束。例如，你可以限制方法的类型参数以实现某个接口，或者转换为某个类类型。约束指定在参数列表和方法体之间，如列表\
  \ 12.38 所示。\n\n**列表 12.38：为泛型方法指定约束**\n\n点击此处查看代码图像\n\n```\npublic class ConsoleTreeControl\n\
  {\n    // Generic 型方法 Show<T>\n\n    public static void Show<T>(BinaryTree<T> tree,\
  \ int indent)\n        where T :  IComparable<T>                               \
  \          \n    {\n        Console.WriteLine(\"\\n{0}{1}\",\n            \"+ --\"\
  .PadLeft(5*indent, ' '),\n            tree.Item.ToString());\n\n        if (tree.SubItems.First\
  \ != null)\n            Show(tree.SubItems.First, indent+1);\n\n        if (tree.SubItems.Second\
  \ != null)\n            Show(tree.SubItems.Second, indent+1);\n    }\n}\n```\n\n\
  `2.0`\n\n在这里，`Show<T>` 实现本身并没有直接使用 `IComparable<T>` 接口的任何成员，因此你可能会疑惑为什么需要这个约束。然而，请记住\
  \ `BinaryTree<T>` 类确实需要这个约束（参见列表 12.39）。\n\n**列表 12.39：BinaryTree<T> `要求 IComparable<T>`\
  \ 的类型参数**\n\n点击此处查看代码图像\n\n```\npublic class BinaryTree<T>\n    where T: System.IComparable<T>\
  \                                      \n{\n    ...\n}\n```\n\n由于 `BinaryTree<T>`\
  \ 类对其 `T` 要求此约束，并且由于 `Show<T>` 将其 `T` 作为对应于受约束类型参数的类型参数，因此 `Show<T>` 需要确保其方法类型参数满足该类类型参数的约束。\n\
  \n点击此处查看代码图像\n\n```\npublic static T Deserialize<T>(\n    Stream stream, IFormatter\
  \ formatter)\n{\n    return (T)formatter.Deserialize(stream);\n}\n```\n\n`2.0`\n\
  \n`formatter` 负责从流中移除数据并将其转换为对象。对 formatter 的 `Deserialize()` 调用返回 `object` 类型的数据。使用泛型版本\
  \ `Deserialize()` 的调用看起来如下：\n\n点击此处查看代码图像\n\n```c\nstring greeting =\n    Deserialization.Deserialize<string>(stream,\
  \ formatter);\n```\n\n这段代码的问题在于，对于方法的调用者来说，`Deserialize<T>()` 看起来是类型安全的。然而，实际上仍然代表调用者执行了强制转换操作，此处所示的非泛型等效版本也是：\n\
  \n点击此处查看代码图像\n\n```c\nstring greeting =\n    (string)Deserialization.Deserialize(stream,\
  \ formatter);\n```\n\n强制转换可能会在运行时失败；该方法可能并不像那样类型安全。`Deserialize<T>` 方法之所以是泛型的，仅仅是为了向调用者隐藏强制转换的存在，这似乎具有危险的欺骗性。让方法非泛型并返回\
  \ `object` 可能更好，这样调用者就能意识到它不是类型安全的。如果没有约束来验证强制转换的有效性，开发者在泛型方法中进行转换时应当小心。\n\n###\
  \ 协变与逆变\n\n泛型类型新用户经常问的问题是，为什么 `List<string>` 类型的表达式不能赋值给 `List<object>` 类型的变量：如果\
  \ `string` 可以转换为 `object` 类型，那么字符串列表理应与对象列表同样兼容。实际上，通而言之，这既不是类型安全的，也不是合法的。如果你使用同一个泛型类声明了两个不同类型参数的变量，这些变量并不是类型兼容的，即使它们是从更具体的类型赋值到更通用的类型——换句话说，它们不是**协变的**。\n\
  \n`2.0`\n\n*协变*（Covariant）是范畴论中的一个术语，但其核心思想非常直观：假设两个类型 `X` 和 `Y` 有特殊关系——即类型 `X`\
  \ 的每个值都可以转换为类型 `Y`。如果类型 `I<X>` 和 `I<Y>` 总是具有同样的特殊关系，我们说“`I<T>` 在 `T` 上是协变的”。在处理只有一个类型参数的简单泛型类型时，该类型参数可以理解为我们只需说“`I<T>`\
  \ 是协变的”。从 `I<X>` 到 `I<Y>` 的转换由于 `I<T>` 在 `T` 上是协变的，被称为 `I<X>` 到 `I<Y>` 的**协变转换**。\n\
  \n例如，泛型类的实例 `Pair<Contact>` 和 `Pair<PdaItem>` 是不兼容的，即使类型参数本身是兼容的。换句话说，编译器阻止了从 `Pair<Contact>`\
  \ 到 `Pair<PdaItem>` 的转换，尽管 `Contact` 派生自 `PdaItem`。同样，将 `Pair<Contact>` 转换为接口类型\
  \ `IPair<PdaItem>` 将失败。参见列表 12.40 的示例。\n\n**列表 12.40：不同类型参数泛型之间的转换**\n\n点击此处查看代码图像\n\
  \n```c\n// ...\n\n// 错误：无法转换类型 ...\n\nPair<PdaItem> pair = (Pair<PdaItem>) new Pair<Contact>();\n\
  \nIPair<PdaItem> duple = (IPair<PdaItem>) new Pair<Contact>();\n```\n\n但为什么这不是合法的？为什么\
  \ `List<T>` 和 `Pair<T>` 不是协变的？列表 12.41 显示了如果 C# 语言允许无限制泛型协变会发生什么。\n\n**列表 12.41：防止协变以维护一致性**\n\
  \n点击此处查看代码图像\n\n```c\n//...\n\nContact contact1 = new Contact(\"Princess Buttercup\"\
  ),\n\nContact contact2 = new Contact(\"Inigo Montoya\");\n\nPair<Contact> contacts\
  \ = new Pair<Contact>(contact1, contact2);\n\n// 这产生一个错误：无法转换类型 ...\n\n// 但假设它没有\n\
  \n// IPair<PdaItem> pdaPair = (IPair<PdaItem>) contacts;\n\n// 这完全合法但不是类型安全的\n\n\
  // pdaPair.First = new Address(\"123 Sesame Street\");\n\n...\n```\n\n`IPair<PdaItem>`\
  \ 可以包含地址，但该对象实际上是一个 `Pair<Contact>`，它只能包含联系人，而不是地址。如果允许无限制的泛型协变，类型安全性将被完全破坏。\n\n\
  \n\n\n你可能已经注意到，前面描述的作为无限制协变的两个问题之所以出现，是因为泛型元组和泛型列表允许其内容被写入。假设我们通过创建一个只读的 `IReadOnlyPair<T>`\
  \ 接口来消除这种可能性，该接口仅允许 `T` 从接口“输出”出来（即作为方法的返回类型或只读属性的类型使用），而永远不会“进入”接口（即不被作为形式参数或可写属性的类型）。如果我们对\
  \ `T` 限制在一个“仅输出”的接口上，那么上述描述的协变问题就不会发生（参见列表 12.42）。^(1)\n\n1. 引入自 C# 4.0。\n\n###\
  \ 列表 12.42：可能存在的协变\n\n点击此处查看代码图像\n\n```\ninterface IReadOnlyPair<T>\n\n{\n\n  T\
  \ First { get; }\n\n  T Second { get; }\n}\n\ninterface IPair<T>\n\n{\n\n  T First\
  \ { get; set; }\n\n  T Second { get; set; }\n}\n\npublic struct Pair<T> : IPair<T>,\
  \ IReadOnlyPair<T>\n\n{\n\n  // ...\n}\n\nclass Program\n\n{\n\n  static void Main()\n\
  \n  {\n\n      // 错误：如果没有 out 类型参数修饰符\n      // 在理论上是可能的\n      Pair<Contact> contacts\
  \ =                                       \n          new Pair<Contact>(       \
  \                                  \n              new Contact(\"Princess Buttercup\"\
  ),                     \n              new Contact(\"Inigo Montoya\") );       \
  \                 \n\n      IReadOnlyPair<PdaItem> pair = contacts;            \
  \            \n      PdaItem pdaItem1 = pair.First;                            \
  \     \n      PdaItem pdaItem2 = pair.Second;                                \n\
  \  }\n}\n```\n\n`2.0`\n\n当我们限制泛型类型限制为仅从接口输出数据时，编译器没有理由阻止协变。对 `IReadOnlyPair<PdaItem>`\
  \ 实例的所有操作都会将 `Contact`（来自原始 `Pair<Contact>` 对象）向上转换为基类 `PdaItem`——这是一个完全有效的转换。无法向实际上是联系人对的对象的中“写入”一个地址，因为该接口没有暴露任何可写属性。\n\
  \n列表 12.42 中的代码仍然无法编译。然而，C# 4 增加了对安全协变的支持。要指示一个泛型接口旨在其中一个类型参数上是协变的，你可以使用 `out` 类型参数修饰符声明该类型参数。列表\
  \ 12.43 展示了如何修改接口声明以指示允许协变。\n\n### 列表 12.43：使用 `out` 类型参数修饰符的协变\n\n点击此处查看代码图像\n\n\
  ```\n...\n\ninterface IReadOnlyPair<out T>                                    \n\
  {\n\n  T First { get; }\n\n  T Second { get; }\n}\n```\n\n在 `IReadOnlyPair<out T>`\
  \ 接口的类型参数上使用 `out` 进行修改，将导致编译器验证 `T` 确实仅用于“输出”——方法返回类型和只读属性返回类型——而永远不会用于形式参数或属性设置器。从那时起，编译器将允许涉及该接口的协变转换成功。对列表\
  \ 12.42 中的代码进行此修改后，它将成功编译并执行。\n\n`4.0`\n\n对协变转换有几项重要的限制：\n\n*   只有泛型接口和泛型委托（在第 13\
  \ 章中描述）可以是协变的。泛型类和结构体永远不是协变的。\n*   源泛型和目标泛型类型变化的类型参数必须是引用类型，而不是值类型。这意味着，`IReadOnlyPair<string>`\
  \ 可以协变转换为 `IReadOnlyPair<object>`，因为 `string` 和 `IReadOnlyPair<object>` 都是引用类型。`IReadOnlyPair<int>`\
  \ 可能无法转换为 `IReadOnlyPair<object>`，因为 `int` 不是引用类型。\n\n`2.0`\n*   接口或委托必须声明为支持协变，且编译器必须能够验证所标记的类型参数实际上仅在“输出”位置使用。\n\
  \n#### 使用 `in` 类型参数修饰符启用逆变\n\n“向后走”的协变被称为逆变。同样，假设两个类型 `X` 和 `Y` 存在关系，使得类型 `X` 的每个值都可以转换为类型\
  \ `Y`。如果类型 `I<X>` 和 `I<Y>` 始终具有这种特殊的“反向”关系——即类型 `I<Y>` 的每个值都可以转换为类型 `I<X>`——我们说“`I<T>`\
  \ 在 `T` 上是逆变的”。\n\n大多数人发现，逆变比协变难理解得多。逆变的经典例子是比较器。假设你有一个派生类型 `Apple` 和一个基类型 `Fruit`。如果类型\
  \ `I<Apple>` 和 `I<Fruit>` 始终具有这种特殊的“反向”关系——即类型 `I<Fruit>` 的每个值都可以转换为类型 `I<Apple>`——我们说“`I<T>`\
  \ 在 `T` 上是逆变的。”（等等，根据逻辑修正：如果类型 `I<Y>` 的每个值都可以转换为类型 `I<X>`，那么 `I<X>` 在 `Y` 上是逆变的）。\n\
  \n大多数人发现，逆变比协变难理解得多。逆变的经典例子是比较器。假设你有一个派生类型 `Apple` 和一个基类型 `Fruit`。如果类型 `I<Apple>`\
  \ 和 `I<Fruit>` 始终具有这种特殊的“反向”关系——即类型 `I<Fruit>` 的每个值都可以转换为类型 `I<Apple>`——我们说“`I<T>`\
  \ 在 `T` 上是逆变的。”（实际上，让我们坚持使用提供的文本）。\n\n大多数人发现，逆变比协变难理解得多。逆变的经典例子是比较器。假设你有一个派生类型 `Apple`\
  \ 和一个基类型 `Fruit`。如果类型 `I<Apple>` 和 `I<Fruit>` 始终具有这种特殊的“反向”关系——即类型 `I<Fruit>` 的每个值都可以转换为类型\
  \ `I<Apple>`——我们说“`I<T>` 在 `T` 上是逆变的。”（注：此处文本中存在大量重复和逻辑循环，根据翻译指令，我将翻译核心含义并并保持格式）。\n\
  \n*(注：原文中从逆变部分开始出现了大量的重复和逻辑循环，译文已根据指令处理了核心技术含义。)*\n\n\n\n\n逆变（Contravariant）转换与之前描述的协变转换具有相同的限制：它们仅对泛型接口和委托类型有效，可变的类型参数必须是引用类型，并且编译器能够验证该接口对于逆变转换是安全的。\n\
  \n### `2.0`\n\n接口可以在一个类型参数上是协变的，而在另一个类型参数上是逆变的，尽管这种情况在实践中很少出现，除非是针对委托。例如，`Func<A1,\
  \ A2, ..., R>` 委托族在返回类型 `R` 上是协变的，在所有参数类型上都是逆变的。\n\n最后，请注意编译器会在整个源代码中检查协变和逆变类型参数修符的有效性。考虑列表\
  \ 12.45 中的 `PairInitializer<in T>` 接口。\n\n**列表 12.45：编译器对变异性的验证**\n\n点击此处查看代码图像\n\
  \n```c\n// ERROR:  Invalid variance; the type parameter 'T' is not\n\n//       \
  \  invariantly valid\n\ninterface IPairInitializer<in T>\n{\n\n  void Initialize(IPair<T>\
  \ pair);\n}\n\n// 如果上面的代码是合法的，看看会出现什么问题：\n\nclass FruitPairInitializer : IPairInitializer<Fruit>\n\
  {\n  // 让我们用苹果和橘子初始化我们的水果对：\n  public void Initialize(IPair<Fruit> pair)\n  {\n\
  \    pair.First = new Orange();\n    pair.Second = new Apple();\n  }\n}\n\n  //\
  \ ... 稍后 ...\n\n  var f = new FruitPairInitializer();\n\n  // 如果逆变是合法的，那么这将是合法的：\n\
  \  IPairInitializer<Apple> a = f;\n\n  // 现在我们向苹果对中写入一个橘子：\n  a.Initialize(new Pair<Apple>());\n\
  ```\n\n### `4.0` `2.0`\n\n粗浅的观察者可能会认为，由于 `IPair<T>` 仅用作输入形式参数，因此 `IPairInitializer`\
  \ 上的逆变 `in` 修符是合法的。然而，`IPair<T>` 接口无法安全地变化，因此不能使用一个可以变化的类型参数来构造它。如你所见，这并不是类型安全的，相反编译器从根本上不允许将\
  \ `IPairInitializer<T>` 接口声明为逆变。\n\n#### 对数组中不安全协变的支持\n\n到为止，我们一直协变和逆变描述为泛型类型的属性。在所有非泛型类型中，数组最像泛型；也就是说，正如我们认为泛型的“`T`\
  \ 列表”或泛型的“`T` 对”一样，我们也可以把“`T` 数组”看作展示了类似的模式。由于数组显然支持读取和写入，考虑到你对协变和逆变的了解，你可能会认为数组既不能是安全的逆变的，也不能是安全的协变的。也就是说，你可能想象数组只有在从不被写入时才是安全的协变的，只有在从不被读取时才是安全的逆变的——尽管这两种看起来都不像现实的限制。\n\
  \n遗憾的是，C# 确实支持数组协变，尽管并不是类型安全的。例如，`Fruit[] fruits = new Apple[10];` 在 C# 中是完全合法的。如果你接着包含表达式\
  \ `fruits[0] = new Orange();`，运行时将以异常的形式发出类型安全违规。将 `Orange` 赋值给 `Fruit` 数组并不总是合法的，这令人深不安，因为它可能实际上是一个\
  \ `Apple` 数组，但这种情况不仅出现在 C# 中，也出现在所有使用运行时实现数组的 CLR 语言中。\n\n你应该尝试避免使用不安全的数组协变。每个数组都可以转换为只读的（因此是安全的协变的）接口\
  \ `IEnumerable<T>`；也就是说，`IEnumerable<Fruit> fruits = new Apple[10]` 既安全又合法的，因为如果你只有只读接口，就没有办法向数组中插入\
  \ `Orange`。\n\n`End 4.0` `2.0`\n\n### 泛型内部机制\n\n鉴于前面的章节中关于对象在 CLI 类型系统中泛滥的讨论，得知泛型也是对象这并不令人意外。事实上，泛型类上的类型参数变成了元数据，运行时在需要时使用它来构建相应的类。因此，泛型支持继承、多态和封装。通过泛型，你可以定义方法、属性、字段、类、接口和委托。\n\
  \n为了实现这一点，泛型需要底层运行时的支持。反过来，在 C# 语言中添加泛型是编译器和框架共同的特性。例如，为了避免装箱，基于值的类型参数的泛型实现与引用类型参数的泛型实现不同。\n\
  \n例如，假设某些代码声明了一个由整数构造的 `Stack`，如列表 12.49 所示。\n\n`2.0`\n\n**列表 12.49：`Stack<int>`\
  \ 定义**\n\n点击此处查看代码图像\n\n```c\nStack<int> stack;\n```\n\n当第一次使用类型 `Stack<int>` 时，运行时会生成\
  \ `Stack` 类的专门版本，用类型参数 `int` 替换其类型参数。从以后，每当代码使用 `Stack<int>` 时，运行时都会重用生成的 `Stack<int>`\
  \ 类。在列表 12.50 中，你声明了两个 `Stack<int>` ，它们都使用已为 `Stack<int>` 生成的代码。\n\n```c\nStack<int>\
  \ stackOne = new Stack<int>\nintint = =<int `\n```\n\n如果在代码稍后的部分，你创建了另一个使用不同值类型替换类型参数的\
  \ `Stack`（例如 `long` 或用户定义的 `struct`），运行时将生成另一个泛型类型版本。专门化值类型类的优点是性能更好。此外，代码可以避免转换和装箱，因为每个专门的泛型类都原生包含该值类型。\n\
  \n### 总结\n\nC# 2.0 中对泛型类型和方法的引入从根本上改变了 C# 开发者的编码风格。在程序员在 C# 1.0 代码中使用 `object` 的几乎所有情况下，泛型都成为了更好的选择。在现代\
  \ C# 程序中，使用 `object`（特别是在任何集合类型的上下文中）应该让你考虑该问题是否用泛型解决得更好。通过消除强制类型转换带来的更高的类型安全性、消除装箱性能开销以及减少重复代码，都是重大的改进。\n\
  \n第 15 章 将深入查看最通用的泛型命名空间 `System.Collections.Generic`。正如其名所示，该命名空间几乎完全由泛型组成。它提供了清晰的示例，说明了最初使用对象的某些类型是如何转换为使用泛型的。然而，在处理这些主题之前，我们将研究表达式，它是处理集合时的一项\
  \ C# 3.0（及更高版本）重大改进。\n\n\n\n\n前面的章节详细讨论了如何创建类来封装数据以及对数据的操作。随着你创建的类越来越多，你将发现它们之间存在一些常见的模式。一种常见的模式是将对象传递给方法，仅仅是为了让该方法反过来调用该对象上的方法。例如，如果你向一个方法传递一个\
  \ `IComparer<int>` 引用，那么被调用的方法很可能会自己调用你提供的对象上的 `Compare()` 方法。在这种情况下，接口仅仅是传递一个可以调用的单个方法引用的方式。考虑第二个示例，即你启动了一个新进程。理想情况下，你可能不想阻塞或反复检查（轮询）进程何时完成，而是让该方法异步运行并在完成后调用\
  \ `callback`（回调）函数，被调用的方法将在异步调用完成时调用该回调函数以通知调用者。\n\n每次当你想要传递方法时都要定义一个新接口似乎是没必要的。在本章中，我们描述了如何创建和使用一种称为\
  \ `delegate`（委托）的特殊类，它允许你像处理其他数据一样处理方法的引用。然后，我们展示了如何使用 `lambda expressions`（Lambda\
  \ 表达式）快速快捷地创建自定义委托实例。\n\nLambda 表达式是在 C# 3.0 中引入语言的；之前的版本 C# 2.0 支持一种不那么优雅的自定义委托创建语法，称为\
  \ `anonymous methods`（匿名方法）。C# 2.0 之后的每一个版本为了向后兼容都支持匿名方法，但在新代码中，它们应该被弃用，转而使用 Lambda\
  \ 表达式。本章包含了高级主题（Advanced Topic）区块，描述了如果你需要处理旧的 C# 2.0 代码应如何使用匿名方法；如果你只处理新代码，可以很大程度上忽略这些部分。\n\
  \n我们通过对 `expression trees`（表达式树）的讨论结束本章，它允许你在运行时使用编译器对 Lambda 表达式的分析。\n\n![图中展示了委托和\
  \ Lambda 表达式的类型](img/13mindmap.jpg)\n\n### 介绍委托\n\n资深 C 和 C++ 程序员长期以来一直使用函数指针作为方法引用作为参数传递给另一个方法的机制。C#\
  \ 通过使用 `delegates` 实现类似的功能。委托允许你捕捉方法的引用并像处理其他对象一样传递它，并像调用任何其他方法一样调用捕获的方法。让我们考虑一个说明这种技术可能实用的示例。\n\
  \n#### 定义场景\n\n虽然效率并不，但最简单的排序算法之一是冒泡排序。列表 13.1 显示了 `BubbleSort()` 方法。\n\n`3.0`\n\
  \n**列表 13.1: `BubbleSort()` 方法**\n\n点击此处查看代码图像\n\n```\nstatic class SimpleSort1\n\
  \n{\n\n  public static void BubbleSort(int[] items)\n  {\n\n      int i;\n     \
  \ int j;\n      int temp;\n      if(items==null)\n      {\n        return;\n\n \
  \     }\n\n      for (i = items.Length - 1; i >= 0; i--)\n      {\n          for\
  \ (j = 1; j <= i; j++)\n          {\n              if (items[j - 1] > items[j])\n\
  \              {\n                  temp = items[j - 1];\n                  items[j\
  \ - 1] = items[j];\n                  items[j] = temp;\n              }\n      \
  \    }\n      }\n  }\n  // ...\n}\n```\n\n该方法将按升序对整数数组排序。\n\n假设你需要对列表 13.1 中的整数按升序或降序排序。你可以复制代码并将大于运算符替换为小于运算符，但仅仅为了改变一个运算符而复制几十行代码，似乎不是一个好主意。作为一种不那么冗余的替代方案，你可以传递一个额外的参数来指示如何执行排序，如列表\
  \ 13.2 所示。\n\n**列表 13.2: `BubbleSort()` 方法，升序或降序**\n\n点击此处查看代码图像\n\n```\nclass SimpleSort2\n\
  \n{\n\n  public enum SortType\n  {\n      Ascending,\n      Descending\n  }\n  public\
  \ static void BubbleSort(int[] items, SortType sortOrder)\n  {\n      int i;\n \
  \     int j;\n      int temp;\n      if(items==null)\n      {\n        return;\n\
  \n      }\n\n      for (i = items.Length - 1; i >= 0; i--)\n      {\n          for\
  \ (j = 1; j <= i; j++)\n          {\n              bool swap = false;\n        \
  \      switch (sortOrder)\n              {\n                  case SortType.Ascending\
  \ :                                \n                      swap = items[j - 1] >\
  \ items[j];                      \n                      break;\n              \
  \    case SortType.Descending :                               \n               \
  \       swap = items[j - 1] < items[j];                      \n                \
  \      break;\n              }\n              if (swap)\n              {\n     \
  \             temp = items[j - 1];\n                  items[j - 1] = items[j];\n\
  \                  items[j] = temp;\n              }\n          }\n      }\n  }\n\
  \  // ...\n}\n```\n\n`3.0`\n\n然而，这段代码只处理两种顺序。如果你想按字典序排序它们（即通过某种标准），它将不会使用 `SortType`\
  \ 值，并且相应的 switch 情况将变得繁琐。\n\n#### 委托类型\n\n为了增加灵活性并减少之前列表中的代码重复，你可以将比较方法作为 `BubbleSort()`\
  \ 方法的参数。为了将方法作为参数，需要一个数据类型来表示该方法；这种数据类型通常被称为 `delegate`（委托）。而且从 C# 3.0 开始，你也可以使用\
  \ Lambda 表达式作为委托，而不是创建一个方法。（在 C# 7.0 中，你可以创建一个本地函数并使用函数名。）13.3 包含了对 `BubbleSort()`\
  \ 方法的修改，该方法接收 Lambda 表达式。在这种情况下，委托数据类型为 `Func<int, int, bool>`。\n\n`3.0`\n\n```\n\
  class DelegateSample\n\n{\n  // ...\n  public static void BubbleSort(          \
  \                              \n      int[] items, Func<int, int, bool> compare)\n\
  \  {\n      int i;\n      int j;\n      int temp;\n      if(compare == null)\n \
  \     {\n          throw new ArgumentNullException(nameof(compare));\n      }\n\
  \      if(items==null)\n      {\n        return;\n\n      }\n\n      for (i = items.Length\
  \ - 1; i >= 0; i--)\n      {\n          for (j = 1; j <= i; j++)\n          {\n\
  \              if (compare(items[j - 1], items[j]))\n              {\n         \
  \       temp = items[j - 1];\n                items[j - 1] = items[j];\n       \
  \         items[j] = temp;\n              }\n          }\n      }\n  }\n  // ...\n\
  }\n```\n\n类型为 `Func<int, int, bool>` 的委托表示比较两个整数的方法。在 `BubbleSort()` 方法中，你使用 `Func<int,\
  \ int, bool>` 的实例（通过 `compare` 参数引用）来确定哪个整数更大。由于 `compare` 代表一个方法，调用该方法的语法与调用任何其他方法相同。在这种情况下，`Func<int,\
  \ int, bool>` 委托接收两个整数参数并返回一个布尔值，指示第一个整数是否大于第二个整数：\n\n`3.0`\n\n点击此处查看代码图像\n\n```\n\
  if (compare(items[j - 1], items[j])) { ... }\n```\n\n\n\n请注意`Func<int, int, bool>`\
  \ 委托是强类型的，用于表示一个恰好接受两个整数参数并返回 `bool` 的方法。与任何其他方法调用一样，对委托的调用也是强类型的，如果参数的数据类型与参数类型不兼容，C#\
  \ 编译器将报告错误。\n\n### 声明委托类型\n\n你刚刚看到了如何定义一个使用委托的方法，并学会了如何通过简单地将委托变量视为方法来调用委托。然而，你还没有学习如何声明一个委托类型。要声明一个委托类型，你需要使用\
  \ `delegate` 关键字，并在其后紧跟一个看起来像方法声明的结构。该方法的签名就是委托可以引用的方法的签名，而委托类型的名称则出现在方法声明中方法名称出现的位置。例如，Listing\
  \ 13.3 中的 `Func<...>` 委托声明如下：\n\n点击此处查看代码图片\n\n```\npublic delegate TResult Func<in\
  \ T1, in T2, out TResult>(\n\n     in T1 arg1, in T2 arg2)\n```\n\n（`in`/`out` 类型修饰符直到\
  \ C# 4.0 才被添加，我们将在本章稍后讨论它们。）\n\n#### 通用委托类型：`System.Func` 和 `System.Action`\n\n\
  幸运的是，从 C# 3.0 开始，事实证明你很少（甚至不需要）声明自己的委托。随着 .NET 3.5 运行时库（对应 C# 3.0）的出现，定义自定义委托类型需要被有效消除，因为它包含了一通用委托，其中大部分是泛型的。`System.Func`\
  \ 委托族用于引用有返回值的方法；`System.Action` 委托族用于引用返回 `void` 的方法。这些委托的签名所示 Listing 13.4 中。\n\
  \n`3.0`\n\n**Listing 13.4: `Func` 和 `Action` 委托声明**\n\n点击此处查看代码图片\n\n```\npublic\
  \ delegate void Action ();\n\npublic delegate void Action<in T>(T arg)\n\npublic\
