  \ `private` 关键字来封装密码，防止从类外部访问。然而，这种类型的封装通常过于严格。例如，有时你可能需要定义一些字段，外部类只能读取，但你可以在内部更改其值。或者，你可能想允许向类中写入某些数据，但你需要能够对数据所所的更改进行验证。在另一种场景中，你可能需要动态构建数据。传统上，语言通过将字段标记为\
  \ `private`，然后提供访问和修改数据的获取器（getter）和设置器（setter）方法来实现这些示例中的功能。Listing 6.16 中的代码将\
  \ `FirstName` 和 `LastName` 都改为私有字段。每个字段的公共获取器和设置方法允许其值被访问和更改。\n\n**Listing 6.16:\
  \ 声明获取器和设置方法**\n\n点击此处查看代码图像\n\n```csharp\npublic class Employee\n{\n  private string\
  \ FirstName;\n  // FirstName 获取器\n  public string GetFirstName()\n  {\n      return\
  \ FirstName;\n  }\n  // FirstName 设置器\n  public void SetFirstName(string newFirstName)\n\
  \  {\n      if(newFirstName != null && newFirstName != \"\")\n      {\n        \
  \  FirstName = newFirstName;\n      }\n  }\n  private string LastName;\n  // LastName\
  \ 获取器\n  public string GetLastName()\n  {\n      return LastName;\n  }\n  // LastName\
  \ 设置器\n  public void SetLastName(string newLastName)\n  {\n      if(newLastName\
  \ != null && newLastName != \"\")\n      {\n          LastName = newLastName;\n\
  \      }\n  }\n  // ...\n}\n```\n\n遗憾的是，这种更改影响了 `Employee` 类的编程性。你不再可以使用赋值运算符在类内部设置数据，也无法在不调用方法的情况下访问数据。\n\
  \n### 声明属性\n\n考虑到这种模式的频繁使用，C# 设计者为其提供了显式的语法。这种语法被称为**属性**（请参见 Listing 6.17 和 Output\
  \ 6.5）。\n\n**Listing 6.17: 定义属性**\n\n点击此处查看代码图像\n\n```csharp\nclass Program\n{\n\
  \  static void Main()\n  {\n      Employee employee = new Employee();\n      //\
  \ 调用 FirstName 属性设置器\n      employee.FirstName = \"Inigo\";\n      // 调用 FirstName\
  \ 属性的获取器\n      System.Console.WriteLine(employee.FirstName);\n  }\n}\n```\n\n```csharp\n\
  public class Employee\n{\n  // FirstName 属性                                 \n \
  \ public string FirstName\n  {                                                 \
  \    \n      get                                               \n      {       \
  \                                          \n          return _FirstName;      \
  \                      \n      }                                               \
  \  \n      set                                               \n      {         \
  \                                        \n          _FirstName = value;       \
  \                    \n      }                                                 \n\
  \  }                                                     \n  private string _FirstName;\
  \                            \n  // ...\n}\n```\n\n**Output 6.5**\n\n```\nInigo\n\
  ```\n\n在 Listing 6.17 中首先注意到的不是属性代码本身，而是 `Program` 类中的代码。虽然你不再拥有具有 `FirstName` 和\
  \ `LastName` 标识符的字段，但通过查看 `Program` 类无法发现这一点。访问员工姓和名的语法完全没有变化。仍然可以使用简单的赋值运算符来为名称部分赋值——例如\
  \ `employee.FirstName = \"Inigo\"`。\n\n关键特性是属性提供了一种在程序上看起来像字段的语法。实际上，并不这样的字段。属性声明看起来和字段声明完全一样，但后面跟着大括号，在其中放置属性实现。两个可选部分构成了属性实现。`get`\
  \ 部分定义了属性的获取部分。它直接对应于 Listing 6.16 中定义的 `GetFirstName()` 和 `GetLastName()` 函数。要访问\
  \ `FirstName` 属性，你调用 `employee.FirstName`。同样，设置器（实现的 `set` 部分）允许字段赋值的调用语法：\n\n```csharp\n\
  employee.FirstName = \"Inigo\";\n```\n\n因此，当 `Program.Main()` 调用 `employee.FirstName\
  \ = \"Inigo\"` 时，`value` 在设置器内部被设置为 `\"Inigo\"`，并可用于赋值给 `_FirstName`。Listing 6.17\
  \ 的属性实现是最常用的。当调用获取器时（例如在 `Console.WriteLine(employee.FirstName)` 中），将从字段（`_FirstName`）获取的值值并写入控制台。\n\
  \n\n\n\n\n```cs\npublic class Employee\n{\n  // FirstName property\n  public string\
  \ FirstName\n  {\n      get\n      {\n          return _FirstName;\n      }\n  \
  \    set\n      {\n          _FirstName = value;\n      }\n  }\n  private string\
  \ _FirstName;                                                         \n  // LastName\
  \ property                                                                     \
  \                                       \n  public string LastName             \
  \                                                \n  {                         \
  \                                                        \n      get => _LastName;\
  \                                                             \n      set => _LastName\
  \ = value;                                                     \n  }           \
  \                                                                      \n  private\
  \ string _LastName;                                                         \n \
  \ // ...\n}\n```\n\n`End 7.0`\n\n`Listing 6.18` 使用了两种不同的语法来实现相同的属性。在实际世界代码中，你应该尝试在选择语法时保持一致性。\n\
  \n`Begin 3.0`\n\n### 自动实现属性\n\n在 `C# 3.0` 中，属性语法包含了另一种快捷方式。由于具有单个后备字段且通过 `get` 和\
  \ `set` 访问器进行赋值和检索的属性是非常简单且常见的（参见 `FirstName` 和 `LastName` 的实现），`C# 3.0`（以及更高版本）编译器允许在不包含任何访问器实现或后备字段声明的情况下声明属性。`Listing\
  \ 6.19` 展示了 `Title` 和 `Manager` 属性的语法，`Output 6.6` 显示了结果。\n\n**Listing 6.19: 自动实现属性**\n\
  \n`点击此处查看代码图像`\n\n```cs\nclass Program\n{\n  static void Main()\n  {\n        Employee\
  \ employee1 =\n            new Employee();\n        Employee employee2 =\n     \
  \       new Employee();\n        // 调用 FirstName 属性的 setter\n        employee1.FirstName\
  \ = \"Inigo\";\n        // 调用 FirstName 属性的 getter\n        System.Console.WriteLine(employee1.FirstName);\n\
  \        // 为自动实现的的赋值\n        employee2.Title = \"Computer Nerd\";\n        employee1.Manager\
  \ = employee2;\n\n        // 打印 employee1 经理的标题\n        System.Console.WriteLine(employee1.Manager.Title);\n\
  \  }\n}\n```\n\n```cs\npublic class Employee\n{\n  // FirstName property\n  public\
  \ string FirstName\n  {\n      get\n      {\n          return _FirstName;\n    \
  \  }\n      set\n      {\n          _FirstName = value;\n      }\n  }\n  private\
  \ string _FirstName;\n  // LastName property\n  public string LastName\n  {\n  \
  \    get => _LastName;\n      set => _LastName = value;\n  }\n  private string _LastName;\n\
  \  public string? Title { get; set; }                                        \n\
  \  public Employee? Manager { get; set; }                                    \n\
  \  public string? Salary { get; set; } = \"Not Enough\";                       \n\
  \  // ...\n}\n```\n\n**Output 6.6**\n\n```\nInigo\nComputer Nerd\n```\n\n自动实现属性除了读取属性外，还提供了一种更简单的编写属性的方法。此外，当需要向\
  \ `setter` 添加如验证等内容时，任何调用该属性的现有代码都无需更改，尽管属性声明已经更改以包含一个实现。\n\n`End 3.0`Begin 6.0`\n\
  \n在本书的剩余部分，我们经常使用这种 `C# 3.0` 或更高版本的语法，而不指示它是 `C# 3.0` 引入的特性。\n\n关于自动声明属性的最后一点需要注意的是是，在\
  \ `C# 6.0` 中，可以像 `Listing 6.19` 对 `Salary` 那样初始化它们：\n\n`点击此处查看代码图像`\n\n```cs\npublic\
  \ string? Salary { get; set; } = \"Not Enough\";\n```\n\n在 `C# 6.0` 之前，属性初始化只能通过方法（包括我们在本章稍后部分讨论的构造函数）进行。然而，通过\
  \ `C# 6.0`，你可以使用非常类似于字段初始化的语法，在声明时初始化自动实现的属性。\n\n`End 6.0`\n\n### 属性和字段指南\n\n考虑到可以编写显式的\
  \ setter 和 getter 方法而不是属性，有时可能会出现使用属性还是方法更好的问题。通用指南是方法应该代表操作，而属性应该代表数据。属性旨在为通过简单计算访问简单数据提供简单访问。预期是调用属性的开销不会显著高于访问字段的销。\n\
  \n在命名方面，注意在 `Listing 6.19` 中属性名称是 `FirstName`，而字段名称从之前的列表更改为 `_FirstName`——即带有下划线前缀的\
  \ PascalCase（大驼峰命名法）。支持属性的私有字段的其他常见命名约定还有 `_firstName` 以及有时使用的 `camelCase`（小驼峰式）约定，就像局部变量一样.^(3)`。然而，应该避免使用\
  \ `camelCase`。用于属性名称的 `camelCase` 与局部变量和参数的命名约定相同，这意味着名称冲突变得非常可能。此外，为了尊重封装原则，字段不应声明为\
  \ `public` 或 `protected`。\n\n`3.` 我倾向于 `_FirstName`，因为与下划线相比，名字前面的 m 是没有必要的。此外，通过使用属性相同的大小写，在\
  \ Visual Studio 代码模板工具中只需要一个字符串，而不是属性名称和字段名称各一个。\n\n无论你对私有字段使用何种命名模式，属性的编码标准都是 PascalCase。因此，属性应该使用\
  \ `LastName` 和 `FirstName` 模式，并代表名词、名词短语或形容词。事实上，属性名称与类型名称相同的情况并不常见。例如，Person 对象上有一个类型为\
  \ `Address` 的 `Address` 属性。\n\n### 使用验证的属性\n\n在 `Listing 6.20` 中，`Employee` 的 `Initialize()`\
  \ 方法也使用属性而不是字段进行赋值。虽然这不是强制要求的，但结果是属性 setter 中的任何验证都将在类内部外部被调用。例如，如果你更改 `LastName`\
  \ 属性，以便在赋值给 `_LastName` 之前检查 `value` 是否为空或空字符串，会发生什么。（记住，这一步骤是必要的，因为即使数据类型是非空字符串，调用者可能禁用了可空引用类型，或者该方法是从\
  \ C# 7.0 或更早版本调用的——在存在可空引用类型之前。）\n\n**Listing 6.20: 提供属性验证**\n\n`点击此处查看代码图像`\n\n\
