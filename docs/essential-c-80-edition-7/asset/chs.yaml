  \ 预处理器是在编译期间调用的。预处理器命令是发送给 C# 编译器的指令，用于指定要编译的代码段，或标识如何处理代码中的特定错误和警告。C# 预处理器命令还可以为\
  \ C# 编辑器提供有关代码组织的直接指令。\n\n每个预处理器指令都以哈希符号（`#`）开头，且所有预处理器指令必须出现在单行中。使用换行符而不是分号来表示指令的结束。\n\
