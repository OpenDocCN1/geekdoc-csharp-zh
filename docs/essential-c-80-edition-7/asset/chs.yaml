  \ 和开源项目 NDoc^(6) 等工具可以生成文档。\n\n5. 访问 [`submain.com/`](http://submain.com/) 更多关于\
  \ GhostDoc 的信息。\n\n6. 访问 [`ndoc.sourceforge.net`](http://ndoc.sourceforge.net) 了解更多关于\
  \ NDoc 的信息。\n\n## 垃圾回收\n\n垃圾回收显然是运行时的核心功能。其目的是恢复由不再引用的对象所消耗的内存。该陈述的重点是内存和引用：垃圾回收器负责恢复内存；它不处理其他资源，例如数据库连接、句柄（文件、窗口等）、网络端口和串端口等硬件设备。此外，垃圾回收器根据是否仍有引用来决定清理什么。隐式意味着，这意味着垃圾回收器与引用对象工作，并且仅恢复堆上的内存。此外，这意味着维持对对象的引用将延迟垃圾回收器重用该对象消耗的内存。\n\
  \n### 弱引用\n\n到目前为止的所有引用都是**强引用**，因为它们保持了对象的可访问性，并防止垃圾回收器清理对象消耗的内存。框架还支持**弱引用**的概念。弱引用不会阻止对对象进行垃圾回收，但它们保持了引用，以便如果垃圾回收器未清理对象，则仍可以使用。\n\
  \n\n\n\n\n大部分逻辑体现在 `GetData()` 方法中。该方法的目的是始终返回一个数据实例——无论来自缓存还是通过重新加载。`GetData()`\
  \ 开始时会检查 `Data` 属性是否为 `null`。如果是，则加载数据并将其赋值给名为 `target` 的局部变量。这创建了对数据的引用，使得垃圾回收器不会清理它。接下来，我们实例化一个\
  \ `WeakReference` 并传递已加载数据的引用，这样 `WeakReference` 对象就拥有了数据的句柄（其目标）；然后，如果按照需要，就可以返回该实例。不要将没有本地引用的实例传递给\
  \ `WeakReference`，因为它可能在你有机会返回它之前就被清理了（即：不要调用 `new WeakReference<byte[]>(LoadData())`）。\n\
  \n如果 `Data` 属性已经有一个 `WeakReference` 实例，则代码会调用 `TryGetTarget()`，如果存在实例，则将其赋值给 `target`，从而创建一个引用，使得垃圾回收器不再清理该数据。\n\
  \n最后，如果 `WeakReference` 的 `TryGetTarget()` 方法返回 `false`，我们加载数据，通过调用 `SetTarget()`\
  \ 赋值引用，并返回新实例化的对象。\n\n### 资源清理\n\n垃圾回收是运行时的核心职责。尽管如此，重要的是要意识到垃圾回收过程集中在代码的内存利用上。它并不涉及文件句柄、数据库连接字符串、端口或其他有限资源的清理。\n\
  \n### 终结器 (Finalizers)\n\n终结器允许开发者编写清理类资源的代码。与使用 `new` 运算符显式调用的构造函数不同，终结器无法从代码内部显式调用。没有等于\
  \ `new` 的运算符（如 `delete` 运算符）。相反，垃圾回收器负责调用对象实例的终结器。因此，开发者无法在编译时确定终结器具体何时执行。他们只知道，终结器将在对象最后一次使用之后和通常应用程序正常关闭之间的某个时间运行。通过使用“通常（Generally）”一词刻意地引入不确定性，强调了终结器可能不会执行的事实。当你考虑到进程可能会异常终止时，这种可能性是显而易见的。例如，计算机关机或强制终止进程（例如调试进程时）等事件将阻止终结器的运行。然而，在\
  \ .NET Core 中，即使在正常情况下，终结器也可能在应用程序关闭之前未被处理。正如我们在下一节将看到的，因此可能需要采取额外行动，与其他机制注册终结器活动。\n\
  \n**注意**\n\n你无法在编译时确定终结器具体何时执行。\n\n终结器的声明与 C# 前身——即 C++ 的析构函数语法相同。如列表 10.20 所示，终结器声明在类名前以前缀一个波浪号（~）。\n\
  \n**列表 10.20：定义终结器**\n\n点击此处查看代码图像\n\n```c\nusing System.IO;\n\npublic class TemporaryFileStream\n\
  {\n\n  public TemporaryFileStream(string fileName)\n  {\n      File = new FileInfo(fileName);\n\
  \n      // 优选解决方案请使用 FileOptions.DeleteOnClose。\n\n      Stream = new FileStream(\n\
  \          File.FullName, FileMode.OpenOrCreate,\n          FileAccess.ReadWrite);\n\
  \  }\n\n  public TemporaryFileStream()\n      : this(Path.GetTempFileName()) { }\n\
  \n  // 终结器                                                      \n  ~TemporaryFileStream()\
  \                                            \n  {                             \
  \                                    \n      try                               \
  \                            \n      {                                         \
  \                    \n          Close();                                      \
  \            \n      }                                                         \
  \    \n      catch(Exception exception)                                    \n  \
  \    {                                                             \n          //\
  \ 将事件写入日志或 UI                              \n          // ...                  \
  \                                  \n      }                                   \
  \                           \n  }                                              \
  \                   \n\n  public FileStream? Stream { get; private set; }\n\n  public\
  \ FileInfo? File { get; private set; }\n\n  public void Close()\n  {\n      Stream?.Dispose();\n\
  \      try\n      {\n          File?.Delete();\n      }\n      catch(IOException\
  \ exception)\n      {\n          Console.WriteLine(exception);\n      }\n      Stream\
  \ = null;\n      File = null;\n  }\n}\n```\n\n终结器不允许传递任何参数，因此不能重载。此外，终结器不能被显式调用——这意味着只有垃圾回收器可以调用终结器。因此，终结器的访问修饰符没有意义，也不支持。基类中的终结器将作为对象终结调用的一部分自动被触发。\n\
  \n**注意**\n\n终结器不能被显式调用；只有垃圾回收器可以调用终结器。\n\n由于垃圾回收器处理所有的内存管理，因此终结器不负责释放内存。相反，它们负责释放如数据库连接和文件句柄等资源——这些资源需要垃圾回收器并不感知的显式操作。\n\
  \n在列表 10.20 所示的终结器中，我们首先释放了 `FileStream`。这一步是可选的，因为 `FileStream` 有它自己的终结器，提供了与 `Dispose()`\
  \ 相同的功能。现在调用 `Dispose()` 的目的是为了确保它在 `TemporaryFileStream` 终结时被清理，因为后者负责实例化前者。如果没有显式调用\
  \ `Stream?.Dispose()`，一旦 `TemporaryFileStream` 对象被垃圾回收并释放了对 `FileStream` 对象的引用，垃圾回收器将独立地清理它。尽管如此，如果我们根本就不需要终结器来清理资源，那么为了调用\
  \ `FileStream.Dispose()` 而定义一个终结器是没有意义的。事实上，将终结器的需求限制在那些运行时无法感知的资源清理（即没有终结器的资源）对象上，是一项重要的指南，它显著减少了需要实现终结器的场景。\n\
  \n在列表 10.20 中，终结器的目的是删除文件^([8])——在在这种情况下这是一个未托管资源。因此我们有了对 `File?.Delete()` 的调用。现在，当终结器执行时，文件将被清理。\n\
  \n8. 列表 10.20 是一个有些刻意的例子，因为在实例化 `FileStream` 时有一个 `FileOptions.DeleteOnClose` 选项，它会在\
  \ `FileStream` 关闭时触发文件的删除。\n\n\n\n\n终结器在未指定的线程上执行，这使得它们的执行确定性更低。这种不确定性使得终结器内部未处理的异常（在调试器之外）可能会导致应用程序崩溃——而且问题的根源很难诊断，因为导致异常发生的情况并不清楚。从用户的角度来看，未处理的异常将相对随机地抛出，且几乎不考虑用户正在执行的任何操作。因此，你应该小心避免在终结器内部出现异常。相反，你应该使用防御性编程技术，例如检查是否为\
  \ `null`（请参阅列表 10.20 中空值条件运算符的使用）。事实上，建议在终结器中捕获所有异常，并通过其他手段（如日志记录或通过用户界面）报告它们，而不是将它们保持为未处理的异常。这一准则导致了在\
  \ `Delete()` 调用的周围环绕了一个 `try/catch` 块。\n\n另一个强制终结器执行的潜在选项是调用 `System.GC.WaitForPendingFinalizers()`。当调用此方法时，当前线程将挂起，直到所有不再被引用的对象的终结器执行完毕。\n\
  \n### 使用 `using` 语句实现确定性终结\n\n终结器本身的问题在于它们不支持确定性终结（即知道终结器何时何时运行的能力）。相反，终结器起着作为备份机制的重要作用，如果使用某个类的开发者忽略了显式调用必要的清理代码，则它们可以负责清理资源。\n\
  \n例如，考虑 `TemporaryFileStream`，它不仅包含一个终结器，还包含一个 `Close()` 方法。该类使用文件资源，可能会消耗大量的磁盘空间。使用\
  \ `TemporaryFileStream` 的开发者可以显式调用 `Close()` 来恢复磁盘空间。\n\n提供一种确定性终结的方法是非常重要的，因为它消除了对终结器不确定时机行为的依赖。即使开发者未能显式调用\
  \ `Close()`，终结器也会处理该调用。在这种情况下，终结器的运行时间将比显式调用时要晚。\n\n由于确定性终结的重要性，基类库包含一个用于该模式的特定接口，并且\
  \ C# 将该模式集成到了语言中。`IDisposable` 接口通过一个名为 `Dispose()` 的方法定义了该模式的细节，开发者在资源类上调用该方法以“销毁”已消耗的资源。列表\
  \ 10.21 展示了 `IDisposable` 接口以及调用它的代码。\n\n**列表 10.21：使用 `IDisposable` 进行资源清理**\n\n\
  点击此处查看代码图像\n\n```csharp\nusing System;\n\nusing System.IO;\n\nstatic class Program\n\
  {\n\n  // ...\n\n  static void Search()\n  {\n      TemporaryFileStream fileStream\
  \ =\n          new TemporaryFileStream();\n      // Use temporary file stream\n\
  \      // ...\n      fileStream.Dispose();                                     \
  \          \n      // ...\n  }\n\n}\n\nclass TemporaryFileStream : IDisposable\n\
  \n{\n\n  public TemporaryFileStream(string fileName)\n  {\n      File = new FileInfo(fileName);\n\
  \      Stream = new FileStream(\n          File.FullName, FileMode.OpenOrCreate,\n\
  \          FileAccess.ReadWrite);\n  }\n  public TemporaryFileStream()\n      :\
  \ this(Path.GetTempFileName()) { }\n  ~TemporaryFileStream()\n  {\n      Dispose(false);\
  \                                                      \n  }\n  public FileStream?\
  \ Stream { get; private set; }\n  public FileInfo? File { get; private set; }\n\n\
  \  #region IDisposable Members                                               \n\
  \  public void Dispose()                                                     \n\
  \  {                                                                         \n\
  \      Dispose(true);                                                        \n\
  \      // Unregister from the finalization queue.                            \n\
  \      System.GC.SuppressFinalize(this);                                     \n\
  \  }                                                                         \n\
  \  #endregion                                                                \n\
  \  public void Dispose(bool disposing)                                       \n\
  \  {                                                                         \n\
  \      // Do not dispose of an owned managed object (one with              \n  \
  \    // finalizer) if called by member finalize,                           \n  \
  \    // as the owned managed objects finalize method                       \n  \
  \    // will be (or has been) called by finalization queue                 \n  \
  \    // processing already                                                 \n  \
  \    if (disposing)                                                        \n  \
  \    {                                                                     \n  \
  \        Stream?.Close();                                                  \n  \
  \    }                                                                     \n  \
  \    try                                                  \n      {            \
  \                                                         \n          File?.Delete();\
  \                                                   \n      }                  \
  \                                                   \n      catch(IOException exception)\n\
  \      {                                                                     \n\
  \          Console.WriteLine(exception);                                     \n\
  \      }                                                                     \n\
  \      Stream = null;\n      File = null;\n  }                                 \
  \                                        \n}\n```\n\n`开始 8.0`\n\n在 `Program.Search()`\
  \ 中，在使用 `TemporaryFileStream` 之后有一个显式的 `Dispose()` 调用。`Dispose()` 是负责清理与内存不相关的资源（在本例中为文件）的方法，这些资源由垃圾收集器隐式清理。然而，这里的执行包含一个可能阻止\
  \ `Dispose()` 执行的漏洞——即在 `TemporaryFileStream` 实例化到调用 `Dispose()` 之间可能发生异常的可能性。如果发生这种情况，`Dispose()`\
  \ 将不会被调用，资源清理将不得不依赖终结器。为了避免这个问题，调用者需要实现一个 `try/finally` 块。C# 并没有要求程序员显式编写这样的块，而是提供了一个专门用于此目的的\
  \ `using` 语句（参见列表 10.22）。\n\n`8.0`\n\n**列表 10.22：调用 `using` 语句**\n\n点击此处查看代码图像\n\
  \n```csharp\nstatic class Program\n\n{\n  // ...\n\n  static void Search()\n  {\n\
  \      using (TemporaryFileStream fileStream2 =                       \n       \
  \   new TemporaryFileStream(),                                 \n          fileStream3\
  \ = new TemporaryFileStream())                   \n      {\n          // Use temporary\
  \ file stream\n      }\n      // C# 8.0 or later                               \
  \              \n      using TemporaryFileStream fileStream1 =                 \
  \       \n          new TemporaryFileStream();                                 \n\
  \  }\n\n}\n```\n\n在第一个高亮的代码片段中，生成的 CIL 代码与程序员显式指定 try/finally 块时创建的代码相同，在 `finally`\
  \ 块中调用了 `fileStream.Dispose()`。然而，`using` 语句为 `try/finally` 块提供了语法快捷方式。\n\n\n\n\n\
  在此 `using` 语句中，你可以通过逗号将每个变量与其他隔离开来实例化多个变量。关键考虑因素是：所有变量必须是相同类型、该类型必须实现 `IDisposable`，并且初始化在声明时完成。为了强制使用相同类型，数据类型只需指定一次，而不是在每个变量声明之前都指定。\n\
  \nC# 8.0 针对资源清理引入了一种潜在的简化。如示例 10.22 中的第二个高亮代码片段所示，你可以直接用 `using` 关键字为可释放资源（实现了 `IDisposable`\
  \ 的资源）的声明添加前缀。与 `using` 语句一样，这将生成 `try/finally` 行为，其中 `finally` 块放置在变量超出作用域之前（在本例中，在\
  \ `Search()` 方法的右大括号之前）。`using` 声明的一个额外限制是变量是只读的，因此它不能被赋予不同的值。\n\n`End 8.0`\n\n\
  ### 垃圾回收、终结与 `IDisposable`\n\n在示例 10.21 中还有几点值得注意的额外事项。首先，`IDisposable.Dispose()`\
  \ 方法包含对 `System.GC.SuppressFinalize()` 的重要调用。其目的是将 `TemporaryFileStream` 类实例从“终结（f-reachable）队列”中移除。这是因为所有清理工作都在\
  \ `Dispose()` 方法中完成的，而不是等待终结器执行。\n\n如果没有调用 `SuppressFinalize()`，对象实例将包含在 f-reachable\
  \ 队列中——这是一个大多数准备好进行垃圾回收的对象的列表，但它们也有终结器实现。在它们的终结方法被调用之前，运行时无法回收带有终结器的对象。然而，垃圾回收本身并不会调用终结方法。相反，指向终结对象的引用会被添加到\
  \ f-reachable 队列中，并根据执行上下文认为合适的时间由额外的线程进行处理。讽刺的是，这种方法延迟了托管资源的垃圾回收——而这恰恰是这些资源最可能需要尽早清理的时候。延迟的原因是\
  \ f-reachable 队列是一个“引用”列表；因此，在调用终结方法并将对象引用从 f-reachable 队列中移除之前，这些对象不被视为垃圾。\n\n\
  ### 注意\n\n未显式释放的带有终结器的对象将导致对象生命周期延长。即使在所有显式引用都超出作用域后，f-reachable 队列仍会有引用，使对象一直存活直到\
  \ f-reachable 队列处理完成。\n\n出于如此，`Dispose()` 调用了 `System.GC.SuppressFinalize`。调用此方法通知运行时不要将此对象添加到终结队列中，而是让垃圾回收器在对象不再有任何引用（包括任何\
  \ f-reachable 引用）时释放该对象。\n\n其次，`Dispose()` 调用了参数为 `true` 的 `Dispose(bool disposing)`。结果是调用了\
  \ `Stream`  `Dispose()` 方法（清理其资源并抑制其终结）。接下来，临时文件本身在调用 `Dispose()` 后立即被删除。这一重要调用消除了在清理可能昂贵的资源之前等待终结队列被处理的需要。\n\
  \n第三，终结器现在不再调用 `Close()`，而是调用参数为 `false` 的 `Dispose(bool disposing)`。结果是即使文件已被删除，`Stream`\
  \ 也没有被关闭（释放）。关闭 `Stream` 的条件确保了如果从终结器调用 `Dispose(bool disposing)`，`Stream` 实例本身也将会被队列等待终结处理（或者取决于顺序可能已经运行）。因此，在执行终结器时，不应清理托管资源拥有的对象，因为此操作将由终结队列负责。\n\
  \n第四，在同时创建 `Close()` 类型的方法和 `Dispose()` 方法时应格外谨慎。仅通过 API 无法确定 `Close()` 是否调用了 `Dispose()`，因此开发者将疑惑是否需要显式调用\
  \ `Close()` 和 `Dispose()`。\n\n第五，为了增加即使在 .NET Core 中，终结器中定义的功能在进程关闭之前执行的概率，你应该通过\
  \ `AppDomain.CurrentDomain.ProcessExit` 事件处理程序注册代码。任何注册在此事件程序中的终结代码都将执行调用，除非发生异常进程终止（将在下一节讨论）。\n\
  \n`Begin 7.0`\n\n### 懒性初始化\n\n`Begin 4.0`\n\n在节一节中，我们讨论了如何使用 `using` 语句确定性地释放对象，以及在没有使用确定性方法的情况下，终结队列如何释放资源。\n\
  \n一种相关的模式被称为懒性初始化或懒性加载。使用懒性初始化，你可以在需要时创建（或获取）对象，而不是预先——当这些对象从未被使用时，后者可能是一个特别棘手的情况。考虑示例\
  \ 10.24 中的 `FileStream` 属性。\n\n**示例 10.24: 懒性加载属性**\n\n点击此处查看代码图像\n\n```c\nusing\
  \ System.IO;\n\nclass DataCache\n{\n\n  // ...\n\n        public TemporaryFileStream\
  \ FileStream =>\n\n            InternalFileStream??(InternalFileStream =\n\n   \
  \             new TemporaryFileStream());\n\n        private TemporaryFileStream?\
  \ InternalFileStream\n\n            { get; set; } = null;\n\n  // ...\n\n}\n```\n\
  \n在 `FileStream` 表达式体属性中，我们在直接返回值之前检查 `InternalFileStream` 是否为 `null`。如果 `InternalFileStream`\
  \ 为 `null`，我们先实例化 `TemporaryFileStream` 对象并将其赋值给 `InternalFileStream`，然后返回新实例。因此，`FileStream`\
  \ 属性所需的 `TemporaryFileStream` 只有在调用访问器时才会被创建。如果访问器从未被调用，`TemporaryFileStream` 就不会被实例化，从而节省了实例化可能消耗的执行时间。\n\
  \n\n\n\n\n第 5 章 讨论了使用 `try/catch/finally` 块进行标准异常处理。在该章中，catch 块始终捕获类型为 `System.Exception`\
  \ 的异常。本章定义了异常处理的一些额外细节——特别是关于附加异常类型、定义自定义异常以及用于处理每种类型的多个 catch 块的细节。本章还由于异常对继承的依赖性，详细介绍了这些异常。\n\
  \n![异常处理包含四类：多种异常类型、捕获经验、通用 catch 块和指南。](img/11mindmap.jpg)\n\n## 多种异常类型\n\n列表 11.1\
  \ 抛出了 `System.ArgumentException`，而不是 第 5 章 中演示的 `System.Exception` 类型。C# 允许代码抛出任何（可能间接））派自\
  \ `System.Exception` 的类型。要抛出异常，你只需在异常实例前加上 `throw` 关键字即可。使用的异常类型显然是最能描述引起异常的错误情况的类型。例如，考虑\
  \ 列表 11.1 中的 `TextNumberParser.Parse()` 方法。\n\n`Begin 6.0` `Begin 7.0`\n\n**列表 11.1:\
  \ 抛出异常**\n\n点击此处查看代码图片\n\n```cs\npublic sealed class TextNumberParser\n{\n\n  public\
  \ static int Parse(string textDigit)\n  {\n      string[] digitTexts =\n       \
  \   { \"zero\", \"one\", \"two\", \"three\", \"four\",\n              \"five\",\
  \ \"six\", \"seven\", \"eight\", \"nine\" };\n      int result = Array.IndexOf(\n\
  \          digitTexts,\n            // 利用 C# 2.0 的空合并合并运算符\n\n          (textDigit??\n\
  \            // 利用 C# 7.0 的 throw 表达式\n\n            throw new ArgumentNullException(nameof(textDigit))\n\
  \          ).ToLower());\n      if (result < 0)\n      {\n          // 利用 C# 6.0\
  \ 的 nameof 运算符\n          throw new ArgumentException(              \n         \
  \     \"The argument did not represent a digit\",             \n              nameof(textDigit));\
  \                                   \n      }\n      return result;\n  }\n}\n```\n\
  \n`End 7.0`\n\n在调用 `Array.IndexOf()` 时，当 `textDigit` 参数为 `null`，我们利用了 C# 7.0 的 `throw`\
  \ 表达式。在 C# 7.0 之前，不允许使用 `throw` 表达式；只允许 `throw` 语句。因此，需要两个独立的语句：一个检查 `null`，另一个抛出异常。例如，你不能将\
  \ `throw` 与空合并运算符嵌入在同一个语句中。\n\n与其抛出 `System.Exception`，不如抛出 `ArgumentException`\
  \ 合适，因为该类型本身就指示了发生了什么问题，并包含了用于识别哪个参数有问题的特殊参数。\n\n两个相似的异常是 `ArgumentNullException`\
  \ 和 `NullReferenceException`。当不当传递传递 `null` 参数时，应该抛出 `ArgumentNullException`。这是无效参数异常的一个特例，在更一般的情况下（当不为\
  \ `null` 时），它会作为 `ArgumentException` 或 `ArgumentOutOfRangeException` 抛出。`NullReferenceException`\
  \ 通常是底层运行时仅在尝试解引用 `null` 值时才会抛出的异常——即尝试对一个值为 `null` 的对象调用成员。程序员不应该触发抛出 `NullReferenceException`，而应该在访问参数之前检查参数是否为\
  \ `null`，然后抛出 `ArgumentNullException`，这可以提供更多的上下文信息，例如参数名。如果即使参数为 `null` 也有某种无害的方法继续执行，请务必在解引用时使用\
  \ C# 6.0 的空条件运算符，以避免运行时抛出 `NullReferenceException`。\n\n`6.0`\n\n参数异常类型（包括 `ArgumentException`、`ArgumentNullException`\
  \ 和 `ArgumentOutOfRangeException`）的一个重要特性是，每个类型都拥有一个构造函数参数，允许以字符串形式识别参数名称。在 C# 6.0\
  \ 之前，这意味着需要硬编码一个魔术字符串（例如“textDigit”）来识别参数名。这种方法的问题在于，如果参数名发生变化，开发者必须记住更新这个魔术字符串。幸运的是，C#\
  \ 6.0 及更高版本提供了 `nameof` 运算符，它获取参数名标识符并在编译时生成参数名字符串（参见 列表 11.1 中的 `nameof(textDigit)`）。这种方法的优点是，现在\
  \ IDE 可以重构工具（如自动重命名）更改所有这些标识符，包括它作为 `nameof` 运算符的参数使用时。此外，如果参数名发生变化（不使用重构工具），如果传递给\
  \ `nameof` 运算符的标识符不再，编译器将生成错误。今后，在 C# 6.0 及更高版本中，通用指南是对于参数异常类型的参数名，始终使用 `nameof`\
  \ 运算符。第 18 章 对 `nameof` 运算符提供了完整的解释。在此之前，只需理解 `nameof` 仅返回所识别的参数的名称即可。\n\n其他几个异常仅供运行时使用，并（有时间接）派生自\
  \ `System.SystemException`。它们包括 `System.StackOverflowException`、`System.OutOfMemoryException`、`System.Runtime.InteropServices.COMException`、`System.ExecutionEngineException`\
  \ 和 `System.Runtime.InteropServices.SEHException`。不要抛出这些类型的异常。同样，您应该避免抛出 `System.Exception`\
  \ 或 `System.ApplicationException`，因为这些异常太通用，无法无法指示问题的原因或解决方案。相反，应抛出符合场景的最派生异常。显然，开发者应该避免创建可能导致系统故障的\
  \ API。然而，如果执行代码达到了某种继续执行是不安全或不可恢复的状态，应调用 `System.Environment.FailFast()`。这会在向标准错误写入消息（并在\
  \ Microsoft Windows 上写入 Windows 事件日志）后立即终止进程。\n\n`End 6.0`\n\n## 捕获异常\n\n抛出特定的异常类型使得捕获者可以使用异常类型本身来识别问题。换句话说，没有必要捕获异常并在异常消息使用\
  \ `switch` 语句来根据异常情况采取行动。相反，C# 允许使用多个 catch 块，每个块针对特定的异常类型，如 列表 11.2 所示。\n\n**列表\
  \ 11.2: 捕获不同的异常类型**\n\n点击此处查看代码图片\n\n\n\n\n\n```cs\nusing System;\n\npublic sealed\
  \ class Program\n{\n  public static void Main(string[] args)\n  {\n      try\n \
  \     {\n              // ...\n              throw new InvalidOperationException(\n\
  \                  \"Arbitrary exception\");\n              // ...\n      }\n  \
  \    catch(Win32Exception exception)\n          when(exception.NativeErrorCode ==\
  \ 42)\n      {\n          // Handle Win32Exception where\n          // ErrorCode\
  \ is 42\n      }\n      catch (ArgumentException exception)\n      {\n         \
  \ // Handle ArgumentException\n      }\n      catch (InvalidOperationException exception)\n\
  \      {\n         bool exceptionHandled=false;\n          // Handle InvalidOperationException\n\
  \         // ...\n          if(!exceptionHandled)\n          {\n               throw;\n\
  \          }\n       }\n      catch (Exception exception)\n      {\n          //\
  \ Handle Exception\n      }\n      finally\n      {\n          // Handle any cleanup\
  \ code here as it runs\n          // regardless of whether there is an exception\n\
  \      }\n  }\n}\n```\n\n列表 11.2 包含了五个 `catch` 块，每个块处理不同类型的异常。当发生异常时，执行将将跳转到与异常类型匹配最紧密的\
  \ `catch` 块。匹配的紧密程度由继承链决定。例如，尽管抛出的异常类型为 `System.Exception`，但这种“是一个”的关系是通过继承建立的，因为\
  \ `System.InvalidOperationException` 最终派生自 `System.Exception`。由于异常类型 `InvalidOperationException`\
  \ 与抛出的异常最匹配，因此 `catch(InvalidOperationException...)` 块将捕获该异常，而不是由 `catch(Exception...)`\
  \ 块。\n\n`开始 6.0`\n\n从 C# 6.0 开始，`catch` 块可以使用一个额外的条件表达式。不再仅仅根据异常类型是否匹配来限制 `catch`\
  \ 块的匹配，还增加了一个条件子句。此 `when` 子句允许你提供一个布尔表达式；只有当条件为真时，`catch` 块才会处理该异常。在列表 11.2 中，这是一个等值比较运算符。对于更复杂的逻辑，你可以通过调用方法来检查条件。\n\
  \n当然，你也可以简单地将条件检查作为 `if` 块放置在 `catch` 体中。然而，这样做会导致 `catch` 块在检查条件之前就成为该异常的处理器。在条件不满足的情况下，编写能够让另一个\
  \ `catch` 块处理该异常的代码是困难的。但是，通过 `exception condition`，现在可以在不捕获并重新抛出异常的情况下，检查程序状态（包括异常本身）。\n\
  \n使用条件子句时要加小心：如果条件表达式本身抛出异常，则该新异常将被忽略，且条件将被视为为假。由于此原因，你应该避免在异常条件表达式中抛出异常。\n\n`结束\
  \ 6.0`\n\n`catch` 块必须按照从最特定到通用的顺序出现，以避免编译错误。例如，将 `catch(Exception...)` 块移动到任何其他异常块之前将导致编译错误，因为之前的所有异常在它们的继承链的某处都派生自\
  \ `System.Exception`。\n\n如 `catch (SystemException){ }` 块所示，`catch` 块不需要命名参数。事实上，允许甚至没有类型参数的最终\
  \ `catch` 块，正如你将在下一节看到的那样。\n\n### 重新抛出现有异常\n\n在 `InvalidOperationException` `catch`\
  \ 块中出现了一个没有指定要抛出异常的 `throw` 语句（`throw` 独立存在），尽管 `catch` 块作用域内出现了一个可以重新抛出的异常实例（`exception`）。抛出特定异常将更新所有栈信息以匹配新的抛出位置。结果是，指示异常原始发生调用点的所有栈信息将丢失，使得诊断问题变得困难得多。由于此原因，只要发生在\
  \ `catch` 块内部，C# 支持不带显式异常引用的 `throw` 语句或表达式（C# 7.0 或更高）。通过这种方式，代码可以检查异常以确定是否可能完全处理它，如果不能，则重新抛出异常（即使没有显式指定），就像它从未被捕获过一样，且不会替换任何栈信息。\n\
  \n`开始 5.0`\n\n通过 `ExceptionDispatchInfo.Throw()` 方法，编译器不会像处理普通的 `throw` 语句那样将代码视为返回语句。例如，如果方法签名返回一个值，但带有\
  \ `ExceptionDispatchInfo.Throw()` 的路径没有返回值，编译器将发出一个指示未返回值的错误。因此，在偶尔，开发者可能被迫在 `ExceptionDispatchInfo.Throw()`\
  \ 之后跟随一个返回语句，尽管该语句在运行时永远不会执行——相反，异常会被先抛出。\n\n`结束 5.0`\n\n### 通用 catch 块\n\n`开始 2.0`\n\
  \nC# 要求代码抛出的任何对象必须派生自 `System.Exception`。然而，这一要求并不适用于所有语言。例如，C++ 允许抛出任何对象类型，包括不派生自\
  \ `System.Exception` 的托管异常。所有异常（见 1）无论是否派生自 `System.Exception`，都会作为派生自 `System.Exception`\
  \ 的异常传播到 C# 程序集中。结果是 `System.Exception` `catch` 块将捕获之前块未捕获的所有异常。\n\n1. 从 C# 2.0\
  \ 开始。\n\nC# 还支持通用 catch 块（`catch{}`），它的行为与 `catch(Exception exception)` 块完全相同，只是没有类型或变量名。此外，通用\
  \ catch 块必须最后出现。由于通用 catch 块必须最后出现，如果在同一个 `try/catch` 中存在两者，编译器会发出警告，因为通用 catch\
  \ 块永远不会被调用。\n\n`结束 2.0`\n\n### 异常处理指南\n\n异常处理为之前的错误处理机制提供了所需的结构。然而，如果使用不当，它可能导致某些难以处理的结果。以下指南提供了异常处理的一些最佳实践。\n\
  \n*   *仅捕获你能处理的异常。*\n\n    通常可以处理某些类型的异常但不能处理其他类型。例如，为了独占读写打开文件可能会抛出 `System.IO.IOException`，因为文件已被使用。在捕获此类异常时，代码可以向用户报告文件正在使用中，并允许用户取消操作或重试。只有对于有已知操作的异常才应该被捕获。其他异常类型应留给栈高处的调用者。\n\
  \n\n\n\n\n`Begin 4.0`\n\n几乎所有的异常都派自 `System.Exception`。然而，处理某些 `System.Exception`\
  \ 的最佳方法是让它们保持未处理状态，或者尽早地关闭应用程序，而不是拖迟。这些异常包括如 `System.OutOfMemoryException` 和 `System.StackOverflowException`\
  \ 等情况。坦率地说，此类异常默认处于不可恢复的状态，以至于即使捕获了它们但不重新抛出，CLR 最终也会将它们重新抛出。这些异常是开发者无法编写代码来恢复的运行时异常。因此，最佳行动方案是关闭应用程序——这是由运行时强制执行的。\n\
  \n2.  从通用语言运行时 (CLR) 4 开始。在 CLR 4 之前，代码捕获此类异常仅是为了在关闭应用程序或使用 `throw;` 重新抛出异常之前运行清理工作或应急代码（例如保存任何易失数据）。\n\
  \n`End 4.0`\n\n### 避免在调用栈的低层报告异常或记录日志。\n\n通常，程序员往往倾向于在调用栈中尽可能早的位置记录异常或向用户报告异常。然而，这些位置通常无法完全处理异常；相反，它们会选择重新抛出异常。此类\
  \ catch 块不应在调用栈的深处记录异常或将其报告给用户。如果异常被记录并重新抛出，调用栈中高处的调用者可能也会这样做，导致异常产生重复的日志条目。更糟糕的是，向用户显示异常可能不适用于该类型的应用程序。（例如，在\
  \ Windows 应用程序中使用 `System.Console.WriteLine()` 用户将永远无法看到，而在无人值的命令行进程中显示对话框可能不会被注意到并导致应用程序冻结。）与日志记录和异常相关的用户界面应该留到调用栈中更高的地方使用。\n\
  \n### 在 catch 块内部使用 `throw;` 而不是 `throw <exception object>`。\n\n在 catch 块内部重新抛出异常是可能的。例如，`catch(ArgumentNullException\
  \ exception)` 的实现可能包含对 `throw exception` 的调用。然而，这样重新抛出异常将把堆栈跟踪重置为重新抛出调用的位置，而不是重用原始抛出点的位置。因此，除非你使用不同的异常类型重新抛出异常，或者刻意隐藏原始调用堆栈，否则请使用\
  \ `throw;` 让相同的异常沿调用栈向上传播。\n\n### 优先使用异常条件以避免在 catch 块内部重新抛出异常。\n\n`Begin 6.0`\n\
  \n当发现自己捕获了一个实际上无法妥善处理并需要重新抛出的异常时，优先使用异常条件来避免捕获该异常。\n\n### 避免从异常过滤器中抛出异常。\n\n在提供异常过滤器时，避免编写抛出异常的代码。从异常过滤器中抛出异常将导致假条件，且异常的发生将被忽略。由于如此，你应该考虑将复杂的条件检查放在单独的方法中，并用显式处理异常的\
  \ try/catch 块封装。\n\n### 避免可能随时间变化的异常条件。\n\n如果异常过滤器评估的是可能随本地化或消息更改而变化的异常消息，预期的异常条件将无法被捕获，从而意外改变业务逻辑。由于如此，你应该确保异常条件在长时间范围内是有效的。\n\
  \n`End 6.0`\n\n### 重新抛出不同异常时要小心。\n\n从 catch 块内部重新抛出不同的异常不仅会重置调用栈，还会隐藏原始异常。为了保留原始异常，请设置新异常的\
  \ `InnerException` 属性（通常可以通过构造函数赋值）。重新抛出不同的异常应保留用于以下情况：\n\n1. **更改异常类型可以明确问题**。\n\
  \n   例如，在调用 `Logon(User user)` 时，当用户列表文件不可访问时，重新抛出不同的异常类型可能比传播 `System.IO.IOException`\
  \ 更合适。\n\n2. **私有数据是原始异常的一部分**。\n\n   在上述场景中，如果原始 `System.IO.IOException` 包含了路径，从而暴露了关于系统的私有安全信息，则应该对异常进行封装。这当然假设\
  \ `InnerException` 没有被设置为原始异常。（有趣的是，CLR 版本 1 的非常早期版本[甚至是 alpha 版]曾有一个异常显示类似于“安全异常：你没有权限确定\
  \ `c:\\temp\\foo.txt` 的路径”的内容。）\n\n3. **异常类型过于特定，导致调用者无法妥善处理**。\n\n   例如，与其抛出一个针对特定数据库系统的异常，不如使用更通用的异常，这样就可以避免在调用栈高处编写特定数据库的代码。\n\
  \n### 定义自定义异常\n\n一旦抛出异常成为最佳行动方案，最好使用框架异常，因为它们是经过完善且广为人知的。例如，与其抛出一个自定义的无效参数异常，不如使用\
  \ `System.ArgumentException` 类型。然而，如果使用特定 API 的开发者将采取特殊行动——例如，异常处理逻辑将变为处理自定义异常类型——那么定义自定义异常是合适的。例如，如果映射\
  \ API 接收到的邮政编码无效的地址，与其抛出 `System.ArgumentException`，不如抛出一个自定义的 `InvalidAddressException`。关键在于调用者是否可能编写特定的\
  \ `InvalidAddressException` catch 块，而不是仅仅通用的 `System.ArgumentException` catch 块。\n\
  \n定义自定义异常仅涉及派自 `System.Exception` 或某些异常类型。列表 11.4 提供了一个示例。\n\n**列表 11.4：创建自定义异常**\n\
  \n```csharp\nclass DatabaseException : System.Exception\n{\n  public DatabaseException(\n\
  \      string? message,\n      System.Data.SqlClient.SQLException? exception)\n\
  \      : base(message, innerException: exception)\n  {\n      // ...\n  }\n\n  public\
  \ DatabaseException(\n      string? message,\n      System.Data.OracleClient.OracleException?\
  \ exception)\n      : base(message, innerException: exception)\n  {\n      // ...\n\
  \  }\n\n  public DatabaseException()\n  {\n      // ...\n  }\n\n  public DatabaseException(string\
  \ message)\n  {\n    // ...\n  }\n\n  public DatabaseException(\n      string? message,\n\
  \      Exception? exception)\n      : base(message, innerException: exception)\n\
  \  {\n      // ...\n  }\n}\n```\n\n\n\n\n\n- 所有异常都应该使用“Exception”后缀。这样，从名称就能轻松确定它们的用途。\n\
  - 通常情况下，所有异常都应该包含一个无参数的构造函数、一个带字符串参数的构造函数，以及一个由字符串和内部异常组成的参数集构造函数。此外，由于异常通常在抛出它的同一个语句中构造，因此任何额外的异常数据都应该作为构造函数的一部分。（创建所有这些构造函数的明显例外是：如果需要某些数据且构造函数规避了这些需求时。）\n\
  - 继承链应保持相对较浅（少于大约五层）。\n\n当重新抛出一个与捕获到的异常不同的异常时，内部异常起着重要的作用。例如，如果由数据库调用抛出了 `System.Data.SqlClient.SqlException`，但在数据访问层中捕获并将其作为\
  \ `DatabaseException` 抛出，那么接收 `SqlException`（或内部异常）的 `DatabaseException` 构造函数会将原始的\
  \ `SqlException` 保存在 `InnerException` 属性中。这样，如果开发者需要关于原始异常的更多详细信息，就可以从 `InnerException`\
  \ 属性检索异常（例如 `exception.InnerException`）。\n\n### 重新抛出封装的异常\n\n有时，在堆栈较低层抛出的异常在较高层被捕获时可能不再具有意义。例如，考虑一个由于服务器磁盘空间不足而发生的\
  \ `System.IO.IOException`。捕获此类异常的客户端并不一定能理解为什么会有 I/O 活动的上下文。同样，考虑一个地理坐标请求 API，它抛出了一个\
  \ `System.UnauthorizedAccessException`（该异常与所调用的 API 完全无关）。在第二个例子中，调用者没有上下文来理解 API\
  \ 调用与安全之间有什么关系。从调用 API 的代码的角度来看，这些异常带来的诊断帮助少于它们引发的困惑。与其向客户端暴露此类异常，不如先捕获该异常然后抛出另一个异常，例如\
  \ `InvalidOperationException`（甚至是自定义异常），以此作为传达系统处于无效状态的手段。在这些情况下，请务必为包装的异常设置 `InnerException`\
  \ 属性（通常通过通过构造函数调用，如 `new InvalidOperationException(string, Exception)`），这样就有额外的上下文，可以供更接近被调用框架的人员用于诊断目的之用。\n\
  \n在考虑是否要封装并重新抛出异常时，需要记住的一个重要细节是：原始堆栈跟踪（它提供了异常抛出处的上下文）将被包装异常抛出处的新堆栈跟踪替换（假设没有使用 `ExceptionDispatchInfo`）。幸运的是，当原始异常嵌入到包装异常中时，原始堆栈跟踪仍然可用。\n\
  \n最终，异常的预想接收者是编写调用你 API 代码的程序员——他们可能写错了代码。因此，你应该为他们提供尽可能多的信息，指示程序员哪里做错了，以及（可能更重要的是）如何修复。异常类型是通信机制的关键部分，因此你必须明智地选择。\n\
  \n### 总结\n\n抛出异常会产生巨大的性能影响。单个异常会导致大量的运行时堆栈信息被加载和处理——这些数据在其他情况下不会加载——而且处理它们需要大量的时间。正如第\
  \ 5 章 中所示，你应该只使用异常来处理异常情况；API 应该提供机制来检查是否会抛出异常，而不是强制调用特定的 API 来确定是否会抛出异常。\n\n下一章介绍了泛型——这是\
  \ C# 2.0 的一项功能，显著增强了用 C# 1.0 编写的代码。事实上，它基本上废弃了对 `System.Collections` 命名空间的所有使用，该命名空间以前几乎用于每个项目。\n\
  \n## 12. 泛型\n\n`开始 2.0`\n\n随着项目变得越来越复杂，你需要一种更好的方法来重用和自定义现有软件。为了促进代码重用，特别是算法的重用，C#\
  \ 包含了一项称为 `generics` 的功能。\n\n泛型在语法上类似于 Java 的泛型和 C++ 的模板。在所有三种语言中，这些功能都允许实现一次算法和模式，而不需要为算法或模式操作的每种类型编写单独的实现。然而，C#泛型在实现细节以及对各自语言类型系统的影响上，与\
  \ Java 泛型和 C++ 模板都非常不同。正方法之所以强大是因为它们可以接受参数，接收类型参数的方法和类型也具有多得的功能。\n\n![图中展示了各种泛型类型。](img/12mindmap.jpg)\n\
  \n泛型是在 2.0 版本中添加到运行时和 C# 中的。\n\n### 不使用泛型的 C#\n\n我们通过检查一个不使用泛型的类来开始泛型的讨论。该类 `System.Collections.Stack`\
  \ 表示一个对象集合，其中最后添加到集合的项是从集合中检索的第一项（后进先出 [LIFO]）。`Stack` 类的两个方法 `Push()` 和 `Pop()`\
  \ 分别将项添加到堆栈中并从堆栈中移除。`Stack` 类方法的声明出现在列表 12.1 中。\n\n**列表 12.1：`System.Collections.Stack`\
  \ 方法签名**\n\n点击此处查看代码图像\n\n```\npublic class Stack\n\n{\n\n   public virtual object\
  \ Pop() { ... }\n\n   public virtual void Push(object obj) { ... }\n\n   // ...\n\
  \n}\n```\n\n程序频繁使用堆栈类型集合来方便多次撤销操作。例如，列表 12.2 使用 `System.Collections.Stack` 类在一个模拟沙画玩具的程序中执行撤销操作。\n\
  \n`2.0`\n\n**列表 12.2：在类似于沙画玩具的程序中支持撤销**\n\n点击此处查看代码图像\n\n\n\n\n\n```cs\nusing System.Collections;\n\
  \nclass Program\n{\n\n  // ...\n\n  public void Sketch()\n  {\n      Stack path\
  \ = new Stack();\n      Cell currentPosition;\n      ConsoleKeyInfo key;  // Added\
  \ in C# 2.0\n      do\n      {\n          // Etch in the direction indicated by\
  \ the\n          // arrow keys that the user enters\n          key = Move();\n \
  \         switch (key.Key)\n          {\n              case ConsoleKey.Z:\n    \
  \              // Undo the previous Move\n                  if (path.Count >= 1)\n\
  \                  {\n                      currentPosition = (Cell)path.Pop();\
  \                    \n                      Console.SetCursorPosition(\n      \
  \                    currentPosition.X, currentPosition.Y);\n                  \
  \    Undo();\n                  }\n                  break;\n              case\
  \ ConsoleKey.DownArrow:\n              case ConsoleKey.UpArrow:\n              case\
  \ ConsoleKey.LeftArrow:\n              case ConsoleKey.RightArrow:\n           \
  \       // SaveState()\n                  currentPosition = new Cell(\n        \
  \              Console.CursorLeft, Console.CursorTop);\n                  path.Push(currentPosition);\
  \                                \n                  break;\n              default:\n\
  \                  Console.Beep();  // Added in C# 2.0\n                  break;\n\
