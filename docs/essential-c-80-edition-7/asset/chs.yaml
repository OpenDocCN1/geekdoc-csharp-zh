  \ `out` 参数。如果需要返回值，可以使用 `ref` 参数。\n\n`End 3.0`\n\n总结来说，部分方法允许生成代码调用不一定已实现的方法。此外，如果没有为部分方法提供实现，则\
  \ CIL 中不会出现该部分方法的痕迹。这有助于在保持高灵活性的同时保持代码体积较小。\n\n### 总结\n\n本章解释了 C# 中用于类和面向对象的构造结构。其范围包括了对声明字段以及如何在类实例上访问字段的讨论。\n\
  \n本章还讨论了是按实例存储数据还是跨类型的所有实例存储数据的关键决策。静态数据与类关联，而实例数据存储在每个对象上。\n\n此外，本章探讨了在方法和数据的访问修饰符背景下的封装。引入了\
  \ C# 的属性构造结构，你了解了如何使用它来封装私有字段。\n\n下一章重点关注如何通过继承将类相互关联，并探索了这种面向对象构造结构带来的益处。\n\n##\
  \ 7. 继承\n\n第 6 章 讨论了一个类如何通过字段和属性引用其他类。本章讨论了如何使用类之间的继承关系来构建形成“是一个”（is a）关系的类层次结构。\n\
  \n![继承提供了五种属性属性：派生；重写；抽象类；system.object；模式匹配。派生包括类型转换、protected、单继承和密封类。重写包括 virtual、new\
  \ 和 sealed。](img/07mindmap.jpg)\n\n### 派生\n\n通常想要扩展给定的类型以添加功能，例如行为和数据。继承的目的恰恰是这样。给定一个\
  \ `Person` 类，你创建一个 `Employee` 类，该类额外包含了 `EmployeeId` 和 `Department` 属性。反向方法也可以应用。例如，给定个人数字助器\
  \ (PDA) 中的一个 `Contact` 类，你可能决定添加日历支持。为了这一目标，你创建了一个 `Appointment` 类。然而，而不是重新定义两个类共有的方法和属性，你可能会选择\
  \ `refactor`（重构）`Contact` 类。具体来说，你可以将 `Contact` 的公共方法和属性移动到名为 `PdaItem` 的基类中，`Contact`\
  \ 和 `Appointment` 均从中派生，如图 7.1 所示。\n\n（注：输入文本包含了多次重复，我将根据提供的完整文本进行处理。）\n\n（等等，我将直接提供输出，元注释。）\n\
  \n**最终输出：**\n\n[content]\n```cs\n// File: Person.Designer.cs\n\npublic partial class\
  \ Person\n{\n    #region Extensibility Method Definitions\n\n    partial void OnLastNameChanging(string\
  \ value);                                    \n    partial void OnFirstNameChanging(string\
  \ value);                                   \n    #endregion\n\n    // ...\n\n \
  \   public string LastName\n    {\n        get\n        {\n            return _LastName;\n\
  \        }\n        set\n        {\n            if (_LastName != value)\n      \
  \      {\n                OnLastNameChanging(value);                           \
  \                 \n                _LastName = value;\n            }\n        }\n\
  \    }\n\n    private string _LastName;\n\n    // ...\n\n    public string FirstName\n\
  \    {\n        get\n        {\n            return _FirstName;\n        }\n    \
  \    set\n        {\n            if (_FirstName != value)\n            {\n     \
  \           OnFirstNameChanging(value);                                        \
  \      \n                _FirstName = value;\n            }\n        }\n    }\n\n\
  \    private string _FirstName;\n}\n\n// File: Person.cs\n\npartial class Person\n\
  {\n  partial void OnLastNameChanging(string value)\n  {\n      if (value is null)\n\
  \      {\n          throw new ArgumentNullException(nameof(value));\n      }\n \
  \     if(value.Trim().Length == 0)\n      {\n          throw new ArgumentException(\n\
  \              \"LastName cannot be empty.\",\n              nameof(value));\n \
  \     }\n  }\n}\n```\n\n\n\n\n除非指定了备用基类，否则所有类默认派生自 `object`。\n\n### 基类与派生类型之间的转换\n\
  \n如列表 7.4 所示，由于派生形成了“是一个”的关系，因此派生类型的值始终可以直接赋值给基类类型变量。\n\n**列表 7.4：隐式基类型转换**\n\n\
  点击此处查看代码图像\n\n```c\npublic class Program\n\n{\n  public static void Main()\n  {\n\
  \      // 派生类型可以隐式转换为\n      // 基类类型\n      Contact contact = new Contact();\n \
  \     PdaItem item = contact;                                       \n      // 基类类型必须显式转换为派生类型\n\
  \      contact = (Contact)item;                                      \n      //\
  \ ...\n  }\n}\n```\n\n派生类型 `Contact` 是一个 `PdaItem`，可以直接赋值给类型为 `PdaItem` 的变量。这被称为**隐式转换**，因为不需要转换操作符，且原则上转换将总是成功；也就是说，它不会抛出异常。\n\
  \n然而，反过来则不然。`PdaItem` 不一定是 `Contact`；它可能是 `Appointment` 或其他派生类型。因此，从基类类型到派生类型的转换需要**显式转换**，这在运行时可能会失败。要执行显式转换，你需要在原始引用之前的括号内指定目标类型，如列表\
  \ 7.4 所示所示。\n\n通过显式转换，程序员本质上是在告诉编译器信任她——她知道自己在做什么——如果目标类型确实派生自原始类型，C# 编译器就会允许转换进行。尽管\
  \ C# 编译器允许在编译时对潜在兼容的类型之间进行显式转换，但公共语言运行时 (CLR) 仍然会在运行时验证显式转换，如果对象实例实际上不是目标类型，则会抛出异常。\n\
  \n即使类型层次结构允许隐式转换，C# 编译器也允许使用转换操作符。例如，从 `contact` 到 `item` 的赋值可以使用如下转换操作符：\n\n```csharp\n\
  item = (PdaItem)contact;\n```\n\n或者在不需要转换的情况下：\n\n```csharp\ncontact = (Contact)contact;\n\
  ```\n\n注意\n\n派生对象可以隐式转换为其基类。相比之下，从基类转换为派生类需要显式转换操作符，因为转换可能会失败。尽管编译器在显式转换可能有效时会允许显式转换，但运行时仍然会在执行时通过抛出异常来防止无效转换。\n\
  \n列表 7.5 显示了隐式转换操作符签名的示例。\n\n**列表 7.5：定义转换操作符**\n\n点击此处查看代码图像\n\n```csharp\nclass\
  \ GPSCoordinates\n\n{\n  // ...\n  public static implicit operator UTMCoordinates(\n\
  \      GPSCoordinates coordinates)\n  {\n      // ...\n  }\n}\n```\n\n在这种情况下，你有一个从\
  \ `GPSCoordinates` 到 `UTMCoordinates` 的隐式转换。可以编写类似的转换来反转这一过程。注意，通过将 `implicit` 替换为\
  \ `explicit` 编写显式转换。\n\n### `private` 访问修饰符\n\n基类的所有成员（构造函数和析构函数外）都会被派生类继承。然而，仅仅因为一个成员被继承，并不意味着它是可访问的。例如，在列表\
  \ 7.6 中，`private` 字段 `_Name` 在 `Contact` 中是不可用的，因为私有成员仅在声明它们的类型内部的代码位置上是访问的。\n\n\
  **列表 7.6：私有成员被继承但不可访问**\n\n点击此处查看代码图像\n\n```csharp\npublic class PdaItem\n{\n  private\
  \ string _Name;\n  public string Name\n  {\n      get { return _Name; }\n      set\
  \ { _Name = value; }\n  }\n  // ...\n}\n\npublic class Contact : PdaItem\n{\n  //\
  \ ...\n}\n\npublic class Program\n{\n  public static void Main()\n  {\n      Contact\
  \ contact = new Contact();\n      // 错误：'PdaItem._Name' 不可访问                   \
  \                         \n      // 由于其保护级别                         \n      contact._Name\
  \ = \"Inigo Montoya\";                                                      \n \
  \ }\n}\n```\n\n作为尊重封装原则的一部分，派生类无法访问声明为 `private` 的成员。这迫使基类开发者做出显式选择，决定派生类是否获得某个成员的访问权限。在这种情况下，基类定义了一个\
  \ API，其中 `_Name` 只能通过 `Name` 属性进行更改。这样，如果添加了验证逻辑，派生类将自动获得验证的好处，因为从一开始它就无法直接访问 `_Name`。\n\
  \n1. 特殊情况除外，即派生类也是基类的嵌套类。\n\n注意\n\n派生类无法访问基类中声明为 `private` 的成员。\n\n### `protected`\
  \ 访问修饰符\n\n然而，封装的粒度比仅仅的 `public` 或 `private` 更细。在基类中定义只有派生类才能访问的成员是可能的。例如，考虑列表 7.7\
  \ 所示的 `ObjectKey` 属性。\n\n**列表 7.7：`protected` 成员仅从派生类访问**\n\n点击此处查看代码图像\n\n```csharp\n\
  using System.IO;\n\npublic class PdaItem\n{\n    public PdaItem(Guid objectKey)\
  \ => ObjectKey = objectKey;\n    protected Guid ObjectKey { get; }             \
  \                  \n}\n\npublic class Contact : PdaItem\n{\n  public Contact(Guid\
  \ objectKey)\n      : base(objectKey) { }\n  public void Save()\n  {\n      // 使用\
  \ <ObjectKey>.dat 作为文件名\n      // 实例化 FileStream\n      using FileStream stream\
  \ = File.OpenWrite(                               \n          ObjectKey + \".dat\"\
  );                                                       \n      // ...\n      stream.Dispose();\n\
  \  }\n  static public Contact Copy(Contact contact) =>\n      new Contact(contact.ObjectKey);\
  \                                                \n  static public Contact Copy(PdaItem\
  \ pdaItem) =>\n      // 错误：无法访问保护成员 PdaItem.ObjectKey.                    \n   \
  \   new Contact(pdaItem.ObjectKey);                                            \
  \    \n}\n\npublic class Program\n{\n    public static void Main()\n    {\n    \
  \    Contact contact = new Contact(Guid.NewGuid());\n        // 错误：'PdaItem.ObjectKey'\
  \ 不可访问                                \n        Console.WriteLine(contact.ObjectKey);\
  \                                         \n    }\n}\n```\n\n`ObjectKey` 使用 `protected`\
  \ 访问修饰符定义。结果是它在 `PdaItem` 外部可访问，但仅限于派生自 `PdaItem` 的类的成员。因为 `Contact` 派生自 `PdaItem`，因此\
  \ `Contact` 的所有成员（即 `Save()`）都可以访问 `ObjectKey`。相反，`Program` 没有派生自 `PdaItem`，因此在\
  \ `Program` 中使用 `ObjectKey` 属性会导致编译错误。\n\n注意\n\n基类中的保护成员仅对基类本身以及派生链中的其他类可访问。\n\n\
  \n\n\n\n静态 `Contact.Copy(PdaItempdaItem)` 方法中展示的一个重要细节值得注意。开发者通常会惊讶，尽管 `Contact`\
  \ 继承自 `PdaItem`，但在 `Contact` 内部代码中无法访问 `PdaItem` 受保护的 `ObjectKey`。这是因为 `PdaItem`\
  \ 可能是一个 `Address`，而 `Contact` 不应该能够访问 `Address` 的受保护成员。因此，封装机制防止了 `Contact` 可能修改\
  \ `Address` 的 `ObjectKey`。将 `PdaItem` 成功强制转换为 `Contact`（例如 `((Contact)pdaItem).ObjectKey`）或访问\
  \ `contact.ObjectKey` 都会绕过这一限制。基本规则是：从派生类访问受保护成员要求在编译时确定该受保护成员是该派生类的实例。\n\n```\n\
  Begin 3.0\n```\n\n### 扩展方法\n\n从技术上讲，扩展方法并不是它们所扩展的类型的成员，因此不会被继承。然而，由于每个派生类都可以作为其任何基类的实例使用，因此某个类型的扩展方法也会扩展到每个派生类型。换句话说，如果我们扩展了像\
  \ `PdaItem` 这样的基类，所有的扩展方法在派生类中也可用。然而，与所有扩展方法一样，实例方法的优先级更高。如果在继承链中的任何地方出现兼容的签名，它的优先级将高于于扩展方法。\n\
  \n对基类型要求扩展方法的情况非常罕见。与通用的扩展方法一样，如果基类型的代码可用，那么直接修改基类型是更好的选择。即使在基类型代码不可用的情况下，程序员也应该考虑是否应为基类型或单个派生类型所实现的接口添加扩展方法。我们将在第\
  \ 8 章中介绍接口及其与扩展方法的使用。\n\n```\nEnd 3.0\n```\n\n### 单继承\n\n在理论上，你可以在继承树中放置无限数量的类。例如，`Customer`\
  \ 继承自 `Contact`，`Contact` 继承自 `PdaItem`，`PdaItem` 继承自 `object`。然而，C# 是一种单继承编程语言（C#\
  \ 编译到的公共中间语言 [CIL] 也是如此）。因此，一个类不能直接继承两个类。例如，无法让 `Contact` 同时继承自 `PdaItem` 和 `Person`。\n\
  \n对于需要多重继承类结构的罕见情况，一种解决方案是使用聚合；与其让一个类继承另一个类，不如让一个类包含另一个类的实例。C# 8.0 提供了实现此点的额外结构，因此我们将聚合实现的细节推迟到第\
  \ 8 章。\n\n### 密封类\n\n正确地设计一个类以便他人通过派生来扩展它，是一项复杂的任务，需要通过示例进行测试以验证派生是否能成功。列表 7.8 显示了如何通过将类标记为密封（sealed）来避免意外的派生场景和问题。\n\
  \n**列表 7.8：使用密封类防止派生**\n\n点击此处代码图像\n\n```\npublic sealed class CommandLineParser\n\
  \n{\n\n  // ...\n\n}\n\n// ERROR:  密封类不能被派生\n\npublic sealed class DerivedCommandLineParser\
  \ :\n\n  CommandLineParser\n{\n\n  // ...\n}\n```\n\n密封类包含 `sealed` 修饰符，因此它们不能被派生。`string`\
  \ 类型是一个使用 `sealed` 修饰符来防止派生的类型示例。\n\n### 重写基类\n\n基类的所有成员在派生类中都会继承，构造函数和析构函数除外。然而，有时基类没有对特定成员的最优实现。例如\
  \ `PdaItem` 上的 `Name` 属性。当被 `Appointment` 类继承时，该实现可能是可以的。但对于 `Contact` 类，`Name`\
  \ 属性应该返回组合后的 `FirstName` 和 `LastName` 属性。同样，当给 `Name` 赋值时，应该拆分到 `FirstName` 和 `LastName`。换句话说，基类的属性声明对于派生类是合适的，但实现并不总是有效的。需要一种机制来在派生类中使用自定义实现来覆盖基类的实现。\n\
  \n### `virtual` 修饰符\n\nC# 支持实例方法和属性的重写，但不支持字段或任何静态成员。这要求在基类和派生类中都必须有显式操作。基类必须将其允许重写的每个成员标记为\
  \ `virtual`。如果 `public` 或 `protected` 成员没有包含 `virtual` 修饰符，子类将无法重写这些成员。\n\n列表 7.9\
  \ 显示了属性重写的示例。\n\n**列表 7.9：重写属性**\n\n点击此处代码图像\n\n```\npublic class PdaItem\n\n{\n\
  \n    public virtual string Name { get; set; }                            \n\n \
  \   // ...\n\n}\n\npublic class Contact : PdaItem\n\n{\n\n    public override string\
  \ Name                                         \n\n    {\n\n        get\n      \
  \  {\n            return $\"{ FirstName } { LastName }\";\n\n        }\n\n     \
  \   set\n        {\n            string[] names = value.Split(' ');\n           \
  \ // 未显示的错误处理\n\n            FirstName = names[0];\n\n            LastName = names[1];\n\
  \        }\n    }\n    public string FirstName { get; set; }\n\n    public string\
  \ LastName { get; set; }\n\n    // ...\n}\n```\n\n\n\n这一步同样重要，因为将一个方法从虚方法转换为非虚方法可能会破坏覆盖了该方法的派生类。一旦发布了虚成员，如果你想避免破坏性更改（breaking\
  \ change），它应该保持为虚成员。因此，在引入虚成员时要小心——例如可以将其设置为 `private protected`。\n\n最后，只有实例成员可以是\
  \ `virtual` 的。CLR 使用实例化时指定的具体类型来决定何时分发 `virtual` 方法调用；因此，`static virtual` 方法是没有意义的，且编译器禁止了它们的使用。\n\
  \n## `new` 修饰符\n\n当重写方法没有使用 `override` 时，编译器会发出的与输出 7.2 或输出 7.3 所示相似的警告。\n\n**输出\
  \ 7.2**\n\n点击此处查看代码图片\n\n```\nwarning CS0114: '<derived method name>' hides inherited\
  \ member\n\n'<base method name>'. To make the current member override that\n\nimplementation,\
  \ add the override keyword. Otherwise add the new\n\nkeyword.\n```\n\n**输出 7.3**\n\
  \n点击此处查看代码图片\n\n```\nwarning CS0108: The keyword new is required on '<derived property\n\
  \nname>' because it hides inherited member '<base property name>'\n```\n\n显而见的解决方案是添加\
  \ `override` 修饰符（假设基成员是虚的）。然而，正如警告所示，`new` 修饰符也是一种选择。考虑一下表 7.1 所示的场景——这是一个更通用情况的特定示例，被称为**脆弱（brittle）**或**脆弱基类（fragile\
  \ base class）**问题。\n\n| **活动** | **代码** |\n| --- | --- |\n| 程序员 A 定义了类 `Person`，其中包含属性\
  \ `FirstName` 和 `LastName`。 |  \n\n```cs\n public class Person\n{\n  public string\
  \ FirstName { get; set; }\n  public string LastName { get; set; }\n}\n``` |\n\n\
  | 程序员 B 继承自 `Person` 并定义了带有额外属性 `Name` 的 `Contact`。此外，他还定义了 `Program` 类，其 `Main()`\
  \ 方法实例化 `Contact`，分配 `Name`，然后打印出该名称。 |  \n\n```cs\n public class Contact : Person\n\
  {\n  public string Name\n  {\n      get\n      {\n          return FirstName + \"\
  \ \" + LastName;\n      }\n      set\n      {\n          string[] names = value.Split('\
  \ ');\n          // 未显示错误处理\n          FirstName = names[0];\n          LastName\
  \ = names[1];\n      }\n  }\n}\n``` |\n\n| 后来，程序员 A 添加了 `Name` 属性，但她没有将 getter 实现为\
  \ `FirstName + \" \" + LastName`，而是实现为 `LastName + \", \" + FirstName`。此外，她没有将该属性定义为\
  \ `virtual`，并且在 `DisplayName()` 方法使用了该属性。 |  \n\n```cs\n // ...\npublic class Person\n\
  {\n  public string Name\n  {\n      get\n      {\n          return LastName + \"\
  , \" + FirstName;\n      }\n      set\n      {\n          string[] names = value.Split(\"\
  , \");\n          LastName = names[0];\n          FirstName = names[1];\n      }\n\
  \  }\n  public static void Display(Person person)\n  {\n      // 显示 <LastName>,\
  \ <FirstName>\n      Console.WriteLine( person.Name );\n  }\n}\n``` |\n\n| |  |\n\
  \n**表 7.1: 为什么使用 new 修饰符？**\n\n由于 `Person.Name` 不是 `virtual` 的，程序员 A 期望 `Display()`\
  \ 使用 `Person` 的实现，即使传递了 `Person` 的派生数据类型 `Contact`。然而，程序员 B 期望在变量数据类型为 `Contact`\
  \ 的所有情况下都使用 `Contact.Name`。（程序员 B 没有编写使用 `Person.Name` 的代码，因为最初不存在 `Person.Name`\
  \ 属性。）为了允许在添加 `Person.Name` 的同时不破坏任何一个程序员的预期行为，你不能假设开发者的意图是使用 `virtual`。此外，由于 C#\
  \ 要求重写成员必须显式使用 `override` 修饰符，因此必须假设另一种语义，而不是允许在基类中添加成员导致派生类无法编译。\n\n这种语义就是 `new`\
  \ 修饰符，它隐藏了派生类中重新声明的基类成员。基类成员并不是调用最派生的成员，而是调用继承链中在带有 `new` 修饰符的成员之前的最派生成员。如果继承链中只有两个类，则基类中的成员的行为将像派生类上没有声明该方法一样（如果派生实现覆盖了基类成员）。尽管编译器会报告如输出\
  \ 7.2 或输出 7.3 所示的警告，但如果既没有指定 `override` 也没有指定 `new`，则会被假设 `new`，从而维持所需的版本安全性。\n\n\
  以示例 7.11 为例。它的输出出现在输出 7.4 中。\n\n**示例 7.11：`override` 与 `new` 修饰符**\n\n点击此处查看代码图片\n\
  \n```cs\npublic class Program\n{\n  public class BaseClass\n  {\n      public virtual\
  \ void DisplayName()\n      {\n          Console.WriteLine(\"BaseClass\");\n   \
  \   }\n  }\n  public class DerivedClass : BaseClass\n  {\n    // 编译器警告：DisplayName()\
  \ 隐藏了继承的\n    // 成员。如果意图隐藏，请使用 new 关键字。\n    public virtual void DisplayName()\n\
  \    {\n        Console.WriteLine(\"DerivedClass\");\n    }\n  }\n  public class\
  \ SubDerivedClass : DerivedClass\n  {\n      public override void DisplayName()\n\
  \      {\n          Console.WriteLine(\"SubDerivedClass\");\n      }\n  }\n  public\
  \ class SuperDerivedClass : SubDerivedClass\n  {\n      public new void DisplayName()\n\
  \      {\n          Console.WriteLine(\"SuperDerivedClass\");\n      }\n  }\n  public\
  \ static void Main()\n  {\n      SuperDerivedClass superDerivedClass = new SuperDerivedClass();\n\
  \      SubDerivedClass subDerivedClass = superDerivedClass;\n      DerivedClass\
  \ derivedClass = superDerivedClass;\n      BaseClass baseClass = superDerivedClass;\n\
  \n      superDerivedClass.DisplayName();\n      subDerivedClass.DisplayName();\n\
  \      derivedClass.DisplayName();\n      baseClass.DisplayName();\n  }\n}\n```\n\
  \n**输出 7.4**\n\n```\nSuperDerivedClass\nSubDerivedClass\nDerivedClass\nBaseClass\n\
  ```\n\n这些结果出现的原因如下：\n\n*   `SuperDerivedClass`：`SuperDerivedClass.DisplayName()`\
  \ 显示 `SuperDerivedClass` 是因为没有派生类，因此没有覆盖。\n*   `SubDerivedClass`：`SubDerivedClass.DisplayName()`\
  \ 是覆盖基类虚成员的最派生成员。`SuperDerivedClass.DisplayName()` 因为 `new` 修饰符而被隐藏。\n*   `DerivedClass`：`DerivedClass.DisplayName()`\
  \ 是虚的，`SubDerivedClass.DisplayName()` 是覆盖它的最派生成员。如前一样，`SuperDerivedClass.DisplayName()`\
  \ 因为 `new` 修饰符而被隐藏。\n*   `BaseClass`：`BaseClass.DisplayName()` 没有重新声明任何基类成员且不是虚的；因此，它是被直接调用的。\n\
  \n对于 CIL 来说，`new` 修饰符对编译器生成的哪些语句没有影响。然而，“新”方法会导致在该方法上生成 `newslot` 元数据属性。从 C# 的角度来看，它唯一的作用是消除本会显示的编译器警告。\n\
  \n#### `sealed` 修饰符\n\n正如可以使用 `sealed` 修饰符对类防止继承一样，虚成员也可以被 `sealed`（参见示例 7.12）。这种方法可以防止派生类覆盖在继承链中更高处定义为\
  \ `virtual` 的基类成员。\n\n\n\n\n\n# 列表 7.12: 密封成员\n\n点击此处查看代码图像\n\n```csharp\nclass\
  \ A\n{\n  public virtual void Method()\n  {\n  }\n}\n\nclass B : A\n{\n  public\
  \ override sealed void Method()\n  {\n  }\n}\n\nclass C : B\n{\n  // ERROR:  无法重写密封成员\n\
  \  // public override void Method()\n  // {\n  // }\n}\n```\n\n在此示例中，在类 `B` 的 `Method()`\
  \ 声明中使用 `sealed` 修饰符，阻止了类 `C` 重写 `Method()`。\n\n通常情况下，将类标记为 `sealed` 是很少做的，而且应该只适用于那些有充分理由支持这种限制的。。事实上，随着单元测试变得越来越重要，保持类型为非密封（unsealed）状态已变得越来越理想，因为需要支持\
  \ mock（测试双胞）对象的创建以替代真实的实现。密封一个类的可能合理场景是：当密封单个虚拟成员的成本超过了保持类非密封状态带来的收益时。然而，对单个成员进行更具针对性的密封——可能是因为基类实现中某些对于正确行为所需的依赖——可能会是更好的选择。\n\
  \n## base 成员 \n\n在选择重写成员时，开发者通常想要调用基类上的成员（参见列表 7.13）。\n\n### 列表 7.13: 访问基成员\n\n\
  点击此处查看代码图像\n\n```csharp\nusing static System.Environment;\n\npublic class Address\n\
  {\n    public string StreetAddress;\n    public string City;\n    public string\
  \ State;\n    public string Zip;\n\n    public override string ToString()\n    {\n\
  \        return $\"{ StreetAddress + NewLine }\"\n            + $\"{ City }, { State\
  \ }  { Zip }\";\n    }\n}\n\npublic class InternationalAddress : Address\n{\n  \
  \  public string Country;\n    public override string ToString()\n    {\n      \
  \  return base.ToString() +\n            NewLine + Country;\n    }\n}\n```\n\n在列表\
  \ 7.13 中，`InternationalAddress` 继承自 `Address` 并实现了 `ToString()`。要调用父类的实现，你使用 `base`\
  \ 关键字。该语法与使用 `this` 关键字几乎完全相同，包括支持将 `base` 作为构造函数的一部分（稍后将讨论）。\n\n顺带一提，在 `Address.ToString()`\
  \ 的实现中，你需要使用 `override` 是因为 `ToString()` 也是 `object` 的成员。任何装饰有 `override` 的成员都会被自动指定为虚拟，因此额外的子类可以进一步特化该实现。\n\
  \n**注意**\n\n任何装饰有 `override` 的方法都是虚拟的。基类方法只有在它是虚拟的时才能被重写，因此重写的方法也是虚拟的。\n\n## 调用基类构造函数\n\
  \n在实例化派生类时，运行时首先调用基类的构造函数，以确保不会过基类的初始化。然而，如果基类上没有可访问的（非私）默认构造函数，则不清楚如何构造基类；此时 C#\
  \ 编译器会报告错误。\n\n为了避免缺少可访问的默认构造函数引起的错误，程序员需要在派生类的构造函数头部显式指定要运行哪个基构造函数（参见列表 7.14）。\n\
  \n### 列表 7.14: 指定要调用哪个基构造函数\n\n点击此处查看代码图像\n\n```csharp\npublic class PdaItem\n{\n\
  \  public PdaItem(string name)\n  {\n      Name = name;\n  }\n  public virtual string\
  \ Name { get; set; }\n  // ...\n}\n\npublic class Contact : PdaItem\n{\n  // 禁用警告，因为\
  \ FirstName&LastName 通过 Name 属性设置\n  #pragma warning disable CS8618 // 可空字段未初始化。\n\
  \  public Contact(string name) :                                   \n      base(name)\
  \                                                  \n  {\n  }\n  #pragma warning\
  \ restore CS8618\n  public override string Name\n  {\n      get\n      {\n     \
  \     return $\"{ FirstName } { LastName }\";\n      }\n      set\n      {\n   \
  \       string[] names = value.Split(' ');\n          // 未显示错误处理\n          FirstName\
  \ = names[0];\n          LastName = names[1];\n      }\n  }\n  [NotNull][DisallowNull]\n\
  \  public string FirstName { get; set; }\n  [NotNull][DisallowNull]\n  public string\
  \ LastName { get; set; }\n  // ...\n}\n\npublic class Appointment : PdaItem\n{\n\
  \  public Appointment(string name,\n      string location, DateTime startDateTime,\
  \ DateTime endDateTime) :\n      base(name)\n  {\n      Location = location;\n \
  \     StartDateTime = startDateTime;\n      EndDateTime = endDateTime;\n  }\n  public\
  \ DateTime StartDateTime { get; set; }\n  public DateTime EndDateTime { get; set;\
  \ }\n  public string Location { get; set; }\n  // ...\n}\n```\n\n## 抽象类\n\n到目前为止的许多继承示例都定义了一个\
  \ `PdaItem` 类，它定义了 `Contact`、`Appointment` 等共有的方法和属性，这些都是派生自它的类型对象。然而，`PdaItem`\
  \ 并不是为了实例化而设计的。`PdaItem` 实例只有在被用作基类（以共享默认实现）时才有意义。这些特征表明 `PdaItem` 应该是抽象类而不是具体类。抽象类专为派生而设计。无法实例化抽象类。不是抽象且可以直接实例化的类是具体类。\n\
  \n\n\n\n\n```csharp\n// 定义一个抽象类\n\npublic abstract class PdaItem\n{\n  public PdaItem(string\
  \ name)\n  {\n      Name = name;\n  }\n  public virtual string Name { get; set;\
  \ }\n  public abstract string GetSummary();                                  \n\
  }\n\nusing static System.Environment;\n\npublic class Contact : PdaItem\n{\n  public\
  \ override string Name\n  {\n      get\n      {\n          return $\"{ FirstName\
  \ } { LastName }\";\n      }\n      set\n      {\n          string[] names = value.Split('\
  \ ');\n          // 未显示错误处理\n          FirstName = names[0];\n          LastName\
  \ = names[1];\n      }\n  }\n  public string FirstName                         \
  \                                \n  {                                         \
  \                                      \n      get                             \
  \                                            \n      {                         \
  \                                                  \n          return _FirstName!;\
  \                                                     \n      }                \
  \                                                           \n      set        \
  \                                                                 \n      {    \
  \                                                                       \n     \
  \     _FirstName = value ??                                                   \n\
  \            throw new ArgumentNullException(nameof(value));                   \
  \    \n      }                                                                 \
  \          \n  }                                                               \
  \                \n  private string? _FirstName;                               \
  \                      \n  public string LastName                              \
  \                            \n  {                                             \
  \                                  \n      get                                 \
  \                                        \n      {                             \
  \                                              \n          return _LastName!;  \
  \                                                    \n      }                 \
  \                                                          \n      set         \
  \                                                                \n      {     \
  \                                                                      \n      \
  \    _LastName = value ??                                                    \n\
  \            throw new ArgumentNullException(nameof(value));                   \
  \    \n      }                                                                 \
  \          \n  }                                                               \
  \                \n  private string? _LastName;                                \
  \                      \n  public string? Address { get; set; }\n  public override\
  \ string GetSummary()                                             \n  {        \
  \                                                                       \n     \
  \ return @\"FirstName: { FirstName + NewLine }\"                               \
  \   \n          + $\"LastName: { LastName + NewLine }\"                        \
  \           \n          + $\"Address: { Address + NewLine }\";                 \
  \                   \n  }                                                      \
  \                         \n  // ...\n)\n\npublic class Appointment : PdaItem\n\
  {\n  public Appointment(string name) : base(name)\n  {\n      Location = location;\n\
  \      StartDateTime = startDateTime;\n      EndDateTime = endDateTime;\n  }\n \
  \ public DateTime StartDateTime  { get; set; }\n  public DateTime EndDateTime  {\
  \ get; set; }\n  public string Location  { get; set; }\n  // ...\n  public override\
  \ string GetSummary()\n  {\n        return $\"Subject: { Name + NewLine }\"\n  \
  \          + $\"Start: { StartDateTime + NewLine }\"\n            + $\"End: { EndDateTime\
  \ + NewLine }\"\n            + $\"Location: { Location }\";\n  }\n}\n```\n\nListing\
  \ 7.16 将 `GetSummary()` 成员定义为 `abstract`，因此它不包含任何实现。代码随后在 `Contact` 中重写了该成员并提供了实现。由于抽象成员理应被重写，因此此类成员自动是虚拟的，不能被显式地声明。此外，抽象成员不能是私有的，因为派生类将无法看到它们。\n\
  \n开发一个设计良好的对象层次结构异常地困难。出于这个原因，在编写抽象类型时，你应该确保实现至少一个（最好是多个）派生自抽象类型的具体类型，以验证设计。\n\n\
  如果你没有在 `Contact` 中提供 `GetSummary()` 的实现，编译器将报告错误。\n\n### 注意\n抽象成员必须被重写，因此它们自动是虚拟的，不能被显式地声明。\n\
  \n### 注意\n通过声明抽象成员，抽象类的程序员表示，要在具体类和抽象基类之间建立“是一个（is）”（is a）关系（即 `PdaItem`），有必要实现这些抽象成员，因为抽象类无法为这些成员提供适当默认实现。\n\
  \n抽象成员旨在作为实现多态的一种方式。基类指定了方法的签名，而派生类提供实现（参见 Listing 7.17）。\n\n**Listing 7.17: 使用多态列出\
  \ `PdaItem`s**\n\n点击此处查看代码图像\n\n```csharp\npublic class Program\n{\n  public static\
  \ void Main()\n  {\n      PdaItem[] pda = new PdaItem[3];\n      Contact contact\
  \ = new Contact(\"Sherlock Holmes\");\n      {\n          Address = \"221B Baker\
