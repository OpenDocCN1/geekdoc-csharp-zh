  \ Name, string capital, double gdpPerCapita) = (\"South Sudan\",\n\"Juba\", 275.18);\n\
  \nSystem.Console.WriteLine(\n    $@\"The poorest country in the world in 2017 was\
  \ {\n        country}, {capital}: {gdpPerCapita}\");\n```\n |\n| 6. | 声明一个命名项元组并分配元组值，然后通过名称访问元组项。\
  \ | |\n```\n(string Name, string capital, double gdpPerCapita) = (\"South Sudan\"\
  ,\n\"Juba\", 275.18);\n\nSystem.Console.WriteLine(\n    $@\"The poorest country\
  \ in the world in 2017 was {\n        country}, {capital}: {gdpPerCapita}\");\n\
  ```\n | |\n| 7. | 声明一个命名项元组并分配元组值，然后通过名称访问元组项。 | |\n```\nvar (country = \"South\
  \ Sudan\", capital = \"Juba\", gdpPerCapita = 275.18);\n\nSystem.Console.WriteLine(\n\
  \    $@\"The poorest country in the world in 2017 was {\n        country}, {capital}:\
  \ {gdpPerCapita}\");\n```\n | |\n\n\n\n\n如前所述，使用元组语法定义的变量会使用 `camelCase`。然而，元组项名称的约定并没有明确定义。建议包括：当元组的行为类似于参数时，使用参数命名规范——例如在返回多个值时，而这在使用元组语法之前通常会使用输出参数。另一种方法是使用\
  \ `PascalCase`，遵循类型成员（属性、函数和公共字段）的命名约定，正如第 5 章和第 6 章所示。我强烈倾向于后者的 `PascalCase` 方法，这与\
  \ `C#` 和 `.NET` 中所有成员标识符的大小写规范一致。尽管如此，由于该约定尚未达成共识，我在指南中使用 `CONSIDER` 而非 `DO`，即“考虑对所有元组项名称使用\
  \ `PascalCasing`”。\n\n示例 6 提供了与示例 5 相同的功能，尽管它在右侧元组值上使用了命名元组项，并在左侧使用了隐式类型声明。然而，这些项的名称保留在隐式类型变量中，因此它们仍然可用于\
  \ `WriteLine` 语句。当然，这开启了你为左侧项命名与右侧使用的名称不同的名称的可能性。虽然 `C#` 编译器允许这样做，但它会发出警告，指出右侧的项名称将被忽略，因为左侧的名称具有优先权。\n\
  \n如果没有指定项名称，仍然可以赋值的元组变量获取各个元素。然而，它们的名称为 `Item1`、`Item2`、`...`，如示例 7 所示。事实上，即使提供了自定义名称，元组上的\
  \ `ItemX` 名称也始终可用（参见示例 8）。但是，当使用集成开发环境（IDE）工具（如最近版本的 `Visual Studio`，支持 `C#` 7.0\
  \ 的版本）时，`ItemX` 属性不会出现在 IntelliSense 下拉列表中——这是一件好事，因为提供的名称显然更优的。如示例 9 所示，可以使用下划线丢弃元组赋值的部分——这被称为\
  \ `discard`（丢弃）。\n\n如示例 10 所示的推断元组项名称的能力直到 `C#` 7.1 才引入。正如示例所示，元组内部的项名称可以从变量名称甚至属性名称中推断出来。\n\
  \n元组是一种将数据封装到单个对象中的轻量级解决方案，就像袋子捕捉你从商店买回的各种杂物品一样。与数组（我们接下来讨论）不同，元组包含的项目数据类型可以无限制地变化，^2，只是它们由代码识别且在运行时无法更改。此外，与数组不同，元组内项的数量在编译时是硬编码的。最后，你不能为元组添加自定义行为（扩展方法除外）。如果你需要与封装数据相关的行为，那么利用面向对象编程并定义\
  \ `class` 是首选方法——我们在第 6 章中开始深入探索这一概念。\n\n2。技术上讲，它们不能是指针——我们在第 23 章中介绍了这个主题。\n\n\
  `Begin 8.0`\n\n### 数组\n\n数组的一个特殊方面是它们是零索引的，这意味着第一个元素位于索引 0。\n\n数组的一个特殊方面是它们可以用多种方式初始化。例如，你可以使用数组初始化器在声明时赋值：\n\
  \n```csharpint[] numbers = { 1, 2, 3, 4, 5 };\n```\n\n或者，你可以使用 `new` 关键字来初始化数组：\n\
  \n```csharp\nint[] numbers = new int[] { 1, 2, 3, 4, 5 };\n```\n\n数组也可以是多维的，通过多组括号表示：\n\
  \n```csharp\nint[,] matrix = {\n    { 1, 2, 3 },\n    { 4, 5, 6 }\n};\n```\n\n\n\
  \n\n显然，数组的第一部分标识了数组内元素的数据类型。声明中的方括号标识了数组的 `rank`（秩），即维的数量；在这种情况下，它是一个秩为 1 的数组。这部分部分构成了变量\
  \ `languages` 的数据类型。\n\n代码列表 3.7 定义了一个秩为 1 的数组。方括号内的逗号定义了额外的维度。例如，代码列表 3.8](#ch03.xhtml_ch03ex08)\
  \ 定义了一个用于国际象棋或井字游戏的二维单元格数组。\n\n**代码列表 3.8: 声明一个二维数组**\n\n点击此处查看代码图片\n\n```\n// \
  \   /   /\n\n// ---+---+---\n\n//    /   /\n\n// ---+---+---\n\n//    /   /\n\n\
  int[,] cells;\n```\n\n在 代码列表 3.8 中，数组的秩为 2。第一个维度可以对应横向的单元格，第二个维度对应纵向的单元格。通过额外的逗号添加更多维度，总秩比逗号的数量多一。请注意，特定维度上出现的项目数量不属于变量声明的一部分。这是在创建（实例化）数组并为每个元素分配空间时指定的。\n\
  \n### 实例化与赋值数组\n\n一旦声明了数组，你就可以使用包含在一对大括号内的逗号分隔的项列表立即填充其值。 代码列表 3.9 声明了一个字符串数组，并在大括号内分配了九种语言名称。\n\
  \n**代码列表 3.9: 带有赋值的数组声明**\n\n点击此处查看代码图片\n\n```\nstring[] languages = { \"C#\", \"\
  COBOL\", \"Java\",\n\n    \"C++\", \"TypeScript\", \"Visual Basic\",\n\n    \"Python\"\
  , \"Lisp\", \"JavaScript\"};\n```\n\n逗号分隔列表中的第一个项成为数组中的第一个项，列表中的第二个项成为数组中的第二个项，依此类推。大括号是定义数组字面量的符号。\n\
  \n在 代码列表 3.9 中所示的赋值语法仅在一条语句内声明并赋值时可用。若要在声明后赋值，则需要使用关键字 `new`，如 代码列表 3.10 所示。\n\n\
  **代码列表 3.10: 声明后的数组赋值**\n\n点击此处查看代码图片\n\n```\nstring[] languages;\n\nlanguages =\
  \ new string[]{\"C#\", \"COBOL\", \"Java\",\n\n    \"C++\", \"TypeScript\", \"Visual\
  \ Basic\",\n\n    \"Python\", \"Lisp\", \"JavaScript\" };\n```\n\n### 3.0 开始\n\n\
  从 C# 3.0 开始，在 `new` 之后指定数组的数据类型（`string`）是可选的，只要编译器能够从数组初始化器中元素的类型推断出数组元素的类型即可。方括号仍然是必需的。\n\
  \n### 3.0 结束\n\nC# 还允许将 `new` 关键字作为声明语句的一部分，因此它允许 代码列表 3.11 所示的赋值和声明。\n\n**代码列表\
  \ 3.11: 声明期间使用 `new` 进行数组赋值**\n\n点击此处查看代码图片\n\n```\nstring[] languages = new string[]{\n\
  \n    \"C#\", \"COBOL\", \"Java\",\n\n    \"C++\", \"TypeScript\", \"Visual Basic\"\
  ,\n\n    \"Python\", \"Lisp\", \"JavaScript\"};\n```\n\n使用 `new` 关键字告诉运行时为该数据类型分配内存。它指示运行时实例化该数据类型——在本例中是数组。\n\
  \n每当你使用 `new` 关键字作为数组赋值的一部分时，你可以在方括号内指定数组的大小。代码列表 3.12 展示了这种语法。\n\n**代码列表 3.12:\
  \ 使用 `new` 关键字的声明与赋值**\n\n点击此处查看代码图片\n\n```\nstring[] languages = new string[9]{\n\
  \n    \"C#\", \"COBOL\", \"Java\",\n\n    \"C++\", \"TypeScript\", \"Visual Basic\"\
  ,\n\n    \"Python\", \"Lisp\", \"JavaScript\"};\n```\n\n初始化语句中的数组大小与大括号内包含的元素数量匹配。此外，可以分配数组但不指定数组的初始值，如\
  \ 代码列表 3.13 所示。\n\n**代码列表 3.13: 未使用字面量值的赋值**\n\n点击此处查看代码图片\n\n```\nstring[] languages\
  \ = new string[9];\n```\n\n\n\n\n\n```\nbool[,,] cells;\n\ncells = new bool[2,3,3]\n\
  \n  {\n\n     // Player 1 moves                //  X |   |\n\n     {   {true, false,\
  \ false},        // ---+---+---\n         {true, false, false},        //  X | \
  \  |\n         {true, false, true} },       // ---+---+---\n\n                 \
  \                     //  X |   | X\n\n     // Player 2 moves                //\
  \    |   | O\n     {   {false, false, true},        // ---+---+---\n         {false,\
  \ true, false},        //    | O |\n         {false, true, false} }        // ---+---+---\n\
  \n                                      //    | O |\n  };\n```\n\n在这个示例中，初始化了数组，并显式标识了每一级的大小。除了在\
  \ `new` 表达式中标识大小外，还提供了数组的字面量值。类型 `bool[,,]` 的字面量值被拆分为两个类型为 `bool[,]` 的数组，大小为 3 ×\
  \ 3。每个二维数组由三个大小为 3 的 `bool` 数组组成。\n\n如前所述，多维数组中的每个维度必须具有一致的大小。然而，也可以定义交错数组（jagged\
  \ array），即数组的数组。交错数组的语法与多维数组略有不同；此外，交错数组不需要一致的大小。因此，可以如列表 3.19 所示初始化交错数组。\n\n###\
  \ 列表 3.19：初始化交错数组\n\n点击此处查看代码图像\n\n```\nint[][] cells = {\n\n    new int[]{1, 0,\
  \ 2, 0},\n    new int[]{1, 2, 0},\n    new int[]{1, 2},\n    new int[]{1}\n};\n\
  ```\n\n交错数组不使用逗号来标识新维度。相反，它定义了一个数组的数组。在列表 3.19 中，`[]` 放置在数据类型 `int[]` 之后，从而声明了一个类型为\
  \ `int[]` 的数组。\n\n注意，交错数组的每个内部数组都需要一个数组实例（或 `null`）。在之前的述示例中，你使用 `new` 来实例化交错数组的内部元素。省略实例化会导致编译错误。\n\
  \n`从 8.0 开始`\n\n### 使用数组\n\n你使用方括号符号（称为数组访问器）来访问数组中的特定项。要从数组中检索第一个项，请将索引指定为 0。在列表\
  \ 3.20 中，`languages` 变量中第五个项（使用索引 4，因为第一个项索引为 0）的值被存储在变量 `language` 中。\n\n### 列表\
  \ 3.20：声明和访问数组\n\n点击此处查看代码图像\n\n```\nstring[] languages = new string[9]{\n    \"\
  C#\", \"COBOL\", \"Java\",\n    \"C++\", \"TypeScript\", \"Visual Basic\",\n   \
  \ \"Python\", \"Lisp\", \"JavaScript\"};\n// 获取 languages 数组中的第五个项 (TypeScript)\n\
  string language = languages[4];\n// 写入 \"TypeScript\"\nConsole.WriteLine(language);\n\
  // 获取从末尾开始的第三个项 (Python)\nlanguage = languages[³];\n// 写入 \"Python\"\nConsole.WriteLine(language);\n\
  ```\n\n从 C# 8.0 开始，还可以使用索引索引运算符（index from end operator）相对于数组末尾来访问项，该运算符也称为 `^`（脱字符）运算符。例如，使用\
  \ `¹` 进行索引可以检索数组中的最后一项，而使用末尾索引运算符访问第一个元素将是 `⁹`（其中 9 是数组中项的数量）。在列表 3.20 中，`³` 指定将\
  \ `languages` 变量中从末尾开始的第三个项（\"Python\"）存储的值赋值给 `language`。\n\n由于项 `¹` 是最后一个元素，项\
  \ `⁰` 对应于列表末尾之后的元素。当然，不存在这样的元素，因此你无法使用 `⁰` 成功索引数组。同样，使用数组的长度（在本例中为 9）是指数组末尾的元素。此外，在索引数组时不能使用负值。\n\
  \n在从数组开始使用正整数进行索引，与使用 `^` 整数值（或返回整数值的表达式）从数组末尾进行索引之间，似乎存在差异。前者从 0 开始计数以访问第一个元素，而后者从\
  \ `¹` 开始计数以访问最后一个元素。C# 设计团队选择从开始使用 0 进行索引，以与 C# 所基于的其他语言（例如 C、C++ 和 Java）保持一致。在从末尾进行索引时，C#\
  \ 遵循了 Python 的优先级（因为基于 C 的语言不支持从末尾索引运算符），并同样从末尾开始从 1 开始计数。然而，与 Python 不同，C# 团队选择了\
  \ `^` 运算符（而不是负运算符）。\n\n\n\n\n数组具有固定长度；它们被绑定，使得在不重新创建数组的情况下无法更改长度。此外，越界数组的 `bounds`（或长度）会导致运行时报告错误。当你尝试使用数组中不存在任何元素的索引来访问（无论是检索还是赋值）数组时，就会发生这种错误。当你将数组长度作为数组的索引时，经常会发生此类错误，如\
  \ 列表 3.25 所示。\n\n### 列表 3.25：访问数组边界之外抛出异常\n\n点击此处查看代码图像\n\n```\nstring languages\
  \ = new string[9];\n\n...\n\n// 运行时错误：索引越界 – 最后一个元素\n// 应该是 8\n\nlanguages[4] =\
  \ languages[9];\n```\n\n### Note 备注\n\n`Length` 成员返回数组中项的数量，而不是最大的索引。变量 `languages`\
  \ 的 `Length` 成员为 `9`，但 `languages` 变量允许的最大运行时索引为 `8`，因为这是从开始计算的距离。\n\n在 C# 8.0 中，访问\
  \ `⁰` 项时也会发生相同的问题：由于 `¹` 是最后一项，因此 `⁰` 是数组末尾之后——而且并没有这样的项。\n\n为了避免在访问最后一个元素时越界数组边界，请使用长度检查来验证数组长度大于\
  \ 0，并在访问数组的最后一项时，使用 `¹`（从 C# 8.0 开始）或 `Length – 1` 代替硬编码的值。要将 `Length` 作为索引，必须减去\
  \ 1 以避免越界错误（参见 列表 3.26）。\n\n### 列表 3.26：在数组索引中使用 `Length - 1`\n\n点击此处查看代码图像\n\n\
  ```\nstring languages = new string[9];\n\n...\n\nlanguages[4] = languages[languages.Length\
  \ - 1];\n```\n\n（当然，如果在访问数组之前，应先检查是否为 `null`，因为可能根本根没有数组实例。）\n\n`Length` 返回数组中元素的总数。因此，如果你有一个大小为\
  \ 2 × 3 × 3 的多维数组 `bool cells[,,]`，`Length` 将返回元素的总数 18。\n\n对于交错数组（jagged array），`Length`\
  \ 返回第一个数组中的元素数量。因为交错数组是数组的数组，所以 `Length` 只评估外部的包含数组并返回其元素计数，无论内部数组内部是什么。\n\n###\
  \ 范围 (Ranges)\n\nC# 8.0 添加的另一个与索引相关的特性是支持数组切片——即将数组的一个切片提取到新数组中。指定范围的语法是 `..`，即范围运算符，它可以选择性地放置在索引之间（包括从末尾开始的索引）。列表\
  \ 3.27 示例。\n\n`8.0`\n\n### 列表 3.27：范围运算符的示例\n\n点击此处查看代码图像\n\n```\nstring[] languages\
  \ = new string[]{\n\n    \"C#\", \"COBOL\", \"Java\",\n\n    \"C++\", \"TypeScript\"\
  , \"Visual Basic\",\n\n    \"Python\", \"Lisp\", \"JavaScript\"};\nSystem.Console.WriteLine($@\"\
  \  0..3: {\n\n    string.Join(\", \", languages[0..3])  // C#, COBOL, Java\n\n \
  \   }\");\n\nSystem.Console.WriteLine($@\"³..⁰: {\n\n    string.Join(\", \", languages[³..⁰])\
  \ // Python, Lisp, JavaScript\n\n    }\");\n\nSystem.Console.WriteLine($@\" 3..³:\
  \ {\n\n    string.Join(\", \", languages[3..³]) // C++, TypeScript, Visual Basic\n\
  \n    }\");\n\nSystem.Console.WriteLine($@\"  ..⁶: {\n\n    string.Join(\", \",\
  \ languages[..⁶])  // C#, COBOL, Java\n\n    }\");\n\nSystem.Console.WriteLine($@\"\
  \   6..: {\n\n    string.Join(\", \", languages[6..])  // Python, Lisp, JavaScript\n\
  \n    }\");\n\nSystem.Console.WriteLine($@\"    ..: {\n\n    // C#, COBOL, Java,\
  \ C++, TypeScript, Visual Basic, Python, Lisp, JavaScript\n    string.Join(\", \"\
  , languages[..])\n\n    }\");\n```\n\n关于范围运算符需要注意的重要点是，它通过指定从第一个（包含）到结束（不包含）来标识项。因此，在\
  \ 列表 3.27 的 `0..3` 示例中，`0` 指定的切片包含了从第一个项到第四个项但*但不包括*第四个项的所有内容（使用 `3` 用来标识第四个项，因为正向索引从\
  \ 0 开始计数）。因此在示例 2 中，指定 `³..⁰` 获取了最后三项。`⁰` 不会因为尝试访问数组之外项而导致错误，因为范围末尾的索引不包含被标识的项。\n\
  \n指定起始索引或“直到”（结束）索引（从末尾开始的索引）是可选的，正如其完全等同于指定 `⁰` 所示。\n\n`8.0`\n\n最后，请注意索引和范围在 .NET\
  \ 中是类等类型。\n\n### 更多数组方法\n\n数组提供了操作数组内元素的方法，例如 `Sort()`、`BinarySearch()`、`Reverse()`\
  \ 和 `Clear()`（参见 列表 3.28）。\n\n### 列表 3.28：更多数组方法\n\n点击此处查看代码图像\n\n```\nclass ProgrammingLanguages\n\
  \n{\n\n  static void Main()\n\n  {\n      string[] languages = new string[]{\n \
  \         \"C#\", \"COBOL\", \"Java\",\n          \"C++\", \"TypeScript\", \"Visual\
  \ Basic\",\n          \"Python\", \"Lisp\", \"JavaScript\"};\n\n      System.Array.Sort(languages);\n\
  \      string searchString = \"COBOL\";\n      int index = System.Array.BinarySearch(languages,\
  \ searchString);\n      System.Console.WriteLine(\n          \"The wave of the future,\
  \ \"\n          + searchString + \" is at index \" + index + \".\");\n      System.Console.WriteLine();\n\
  \      System.Console.WriteLine($\"{ \"First Element\",20 }\\t{ \"Last Element\"\
  ,20 }\");\n      System.Console.WriteLine($\"{ \"-------------\",20 }\\t{ \"------------\"\
  ,20 }\");\n      System.Console.WriteLine($\"{ languages[0],20 }\\t{ languages[¹],20\
  \ }\");\n      System.Array.Reverse(languages);\n      System.Console.WriteLine($\"\
  { languages[0],20 }\\t{ languages[¹],20 }\");\n      // 注意这并不是移除数组中的所有项。\n     \
  \ // 反反，它是将每个项设置为默认值。\n      System.Array.Clear(languages, 0, languages.Length);\n\
  \      System.Console.WriteLine($\"{ languages[0],20 }\\t{ languages[¹],20 }\");\n\
  \      System.Console.WriteLine(\n          $\"After clearing, the array size is:\
  \ { languages.Length }\");\n\n  }\n\n}\n```\n\n列表 3.28 的结果如 输出 3.2 所示。\n\n**输出 3.2**\n\
  \n点击此处查看代码图像\n\n```\nThe wave of the future, COBOL, is at index 2.\n\nFirst Element\
  \           Last Element\n\n-------------           ------------\n\nC#         \
  \             TypeScript\n\nTypeScript            C#\n\nAfter clearing, the array\
  \ size is: 9\n```\n\n这些方法通过 `System.Array` 类获取。大多数情况下，使用这些方法是非常容易理解的，有两个值得注意的项目：\n\
  \n*   在使用 `BinarySearch()` 方法之前，必须先对数组进行排序。如果值不是递增排序的，可能会返回错误的索引。如果搜索元素不存在，返回的值为负数。（使用补码运算符\
  \ `~index` 返回大于搜索值的第一个索引，如果有的话）。）\n\n\n\n\n-   `Clear()` 方法不会移除数组中的元素，也不会将长度设置为零。数组的大小是固定的，无法进行修改。因此，`Clear()`\
  \ 方法会将数组中的每个元素都设置为其默认值（`null`、`0` 或 `false`）。这解释了为什么在调用 `Clear()` 之后使用 `Console.WriteLine()`\
  \ 输出数组时会创建一个空行。\n\n`End 8.0`\n\n## 数组实例成员\n\n与字符串一样，数组拥有实例成员，这些成员不是通过数据类型而是直接从变量访问的。`Length`\
  \ 就是实例成员的示例，因为对 `Length` 的访问是通过数组变量进行的，而不是类。其他重要的实例成员是 `GetLength()`、`Rank` 和 `Clone()`。\n\
  \n获取特定维度的长度不需要 `Length` 属性。要获取特定秩的大小，数组包含一个 `GetLength()` 实例方法。调用此方法时，必须指定要返回其长度的秩（参见列表\
  \ 3.29）。\n\n### 列表 3.29：获取特定维度的大小\n\n点击此处查看代码图像\n\n```c\nbool[,,] cells;\n\ncells\
  \ = new bool[2,3,3];\n\nSystem.Console.WriteLine(cells.GetLength(0));   // 显示 2\n\
  \nSystem.Console.WriteLine(cells.Rank);   // 显示 3\n```\n\n列表 3.29 的结果显示在输出 3.3 中。\n\
  \n**输出 3.3**\n\n```\n2\n```\n\n列表 3.29 显示 `2` 是因为这是第一维度中的元素数量。\n\n也可以通过访问数组的 `Rank`\
  \ 成员来获取整个数组的秩，例如 `cells.Rank` 将返回 `3`（参见列表 3.29）。\n\n默认情况下，将一个数组变量赋值给另一个变量只会复制数组的引用，而不是数组的单个元素。要创建数组的完全副本，请使用数组的\
  \ `Clone()` 方法。`Clone()` 方法将返回数组的副本；更改此新数组的任何成员都不会影响原始数组的成员。\n\n## 字符串作为数组\n\n`string`\
  \ 类型的变量可以像字符数组一样访问。例如，要获取名为 `palindrome` 的字符串的第四个字符，可以调用 `palindrome[3]`。但请注意，由于字符串是不可变的，因此无法为字符串中的特定字符赋值。因此，C#\
  \ 不允许 `palindrome[3]='a'`（其中 `palindrome` 声明为字符串）。列表 3.30 使用数组访问器来确定命令行上的参数是否为选项，其中选项以破折字符作为第一个字符来标识。\n\
  \n### 列表 3.30：查找命令行选项\n\n点击此处查看代码图像\n\n```csharp\nstring[] args;\n\n...\n\nif(args[0][0]\
  \ == '-')\n{\n    // 此参数是一个选项\n}\n```\n\n这段代码使用了 `if` 语句，该语句在第 4 章中介绍。此外，它还展示了一个有趣的例子，因为你使用数组访问器来获取字符串数组\
  \ `args` 中的第一个元素。在第一个数组访问器之后是第二个访问器，它用于获取字符串的第一个字符。因此，该代码等同于列表 3.31 所示所示。\n\n###\
  \ 列表 3.31：查找命令行选项（简化版）\n\n点击此处查看代码图像\n\n```csharp\nstring[] args;\n\n...\n\nstring\
  \ arg = args[0];\n\nif(arg[0] == '-')\n{\n    // 此参数是一个选项\n}\n```\n\n不仅可以使用数组访问器单独访问字符串字符，还可以使用字符串的\
  \ `ToCharArray()` 方法将整个字符串作为字符数组进行检索。使用这种方法，你可以使用 `System.Array.Reverse()` 方法反转字符串，如列表\
  \ 3.32 所示，该方法用于判断一个字符串是否为回文。\n\n### 列表 3.32：反转字符串\n\n点击此处查看代码图像\n\n```csharp\nclass\
  \ Palindrome\n{\n  static void Main()\n  {\n      string reverse, palindrome;\n\
  \      char[] temp;\n\n      System.Console.Write(\"Enter a palindrome: \");\n \
  \     palindrome = System.Console.ReadLine();\n\n      // 移除空格并转换为小写\n      reverse\
  \ = palindrome.Replace(\" \", \"\");\n      reverse = reverse.ToLower();\n\n   \
  \   // 转换为数组                                   \n      temp = reverse.ToCharArray();\
  \                            \n\n      // 反转数组                                 \
  \    \n      System.Array.Reverse(temp);                              \n\n     \
  \ // 将数组转换回字符串并...\n  }\n}\n```\n\n## 常见错误\n\n本节介绍了三种数组：一维数组、多维数组和交数组。它指出了一些常见错误，表格\
  \ 3.3 有助于验证你的语法。\n\n\n\n\n\n| 与之前的错误相同：需要从 `Length` 中减去 1 以访问最后一个元素。（注意这是一个运行时错误，而不是编译时错误。）\
  \ |\n\n```cs\nint[] numbers =\n\n  new int[3];\n\nnumbers[numbers.Length-1] =\n\n\
  \  42;\n```\n\n```cs\nint[] numbers;\n\nConsole.WriteLine(\n\n  numbers[0]);\n```\n\
  \n```\nnumbers 尚未被赋值实例化数组，因此无法访问。\n```\n\n```cs\nint[] numbers = {42, 84};\n\nConsole.WriteLine(\n\
  \n  numbers[0]);\n```\n\n```cs\nint[,] numbers =\n\n  { {42},\n\n    {84, 42} };\n\
  ```\n| 多维数组必须保持结构上的一致性。 |\n\n```cs\nint[,] numbers =\n\n  { {42, 168},\n\n    {84,\
  \ 42} };\n```\n\n```cs\nint[][] numbers =\n\n  { {42, 84},\n\n    {84, 42} };\n\
  ```\n| 锯齿数组需要为数组内的数组指定实例化的数组。 |\n\n```cs\nint[][] numbers =\n\n  { new int[]{42,\
  \ 84},\n\n    new int[]{84, 42} };\n```\n\n**表 3.3：常见的数组编码错误**\n\n### 总结\n\n我们在本章开头讨论了两类不同的类型：值类型和引用类型。这些基本概念对于\
  \ C# 程序员来说非常重要，因为它们改变了类型行为的底层方式，尽管在阅读代码时这并不显而易见。\n\n在讨论数组之前，我们查看了两种最初并不是 C# 一部分的语言结构。首先，我们引入了可空修饰符（`?`），值类型在\
  \ C# 2.0 中支持，引用类型在 C# 8.0 中支持。可空修饰符允许声明可空性。（从技术上讲，它允许值类型存储 `null`，并允许引用类型显式指定是否存储\
  \ `null` 的意图）。其次，我们引入了元组以及一种随 C# 7.0 引入的新语法，该语法为处理元组提供了语言支持，而无需显式地处理底层数据类型。\n\n\
  本章以 C# 数组语法以及操作数组的各种方法作为结束。对于许多开发者来说，这种语法初看起来可能非常令畏，因此本节包含了一个与数组编码相关的常见错误列表。\n\n\
  下一章将介绍表达式和控制流语句。在本章最后出现几次的 `if` 语句也将将被讨论。\n\n## 4. 运算符与流程控制\n\n在本章中，你将学习运算符、控制流语句和\
  \ C# 预处理器。**运算符**为对计算中的操作数执行不同的不同的计算或操作提供了语法支持。**控制流语句**提供了程序内条件逻辑或多次对部分代码进行循环的手段。在引入了\
  \ `if` 控制流语句后，本章还讨论了布尔表达式的概念，这些表达式嵌入在许多控制流语句中。文中还提到整数无法（即使是显式地）转换为 `bool`，以及这种限制的优势。本章以讨论\
  \ C# 预处理器指令作为结束。\n\n![插图展示了各种类型的运算符和控制流。](img/04mindmap.jpg)\n\n## 运算符\n\n现在你已经熟悉了预定义数据类型（请参考第\
  \ 2 章），你可以开始学习如何将这些数据类型与运算符结合起来计算。例如，你可以对已定义的变量进行计算。\n\n运算符通常分为三类——一元、二元和三元，分别对应操作数的数量（分别为一个、两个和三个）。此外，虽然某些运算符用如\
  \ `+`、`-`、`?.` 和 `??` 等符号表示，但其他运算符以关键字的形式存在，例如 `default` 和 `is`。本节涵盖了一些最基础的一元和二元运算符。三元运算符出现在本章的后部分。\n\
  \n#### 一元加/减运算符 (`+`, `-`)\n\n有时你可能想要更改数值的符号。在这种情况下，一元减运算符（`-`）就派上用场。例如，列表 4.2 将美国总债务更改为负值，以表示这是一笔欠款金额。\n\
  \n**列表 4.2：指定负值^(1)**\n\n1。根据 [www.treasurydirect.gov](http://www.treasurydirect.gov)，截至\
  \ 2020 年 7 月 1 日。\n\n点击此处查看代码图像\n\n```cs\n// 精确到分的债务\n\ndecimal debt = -26457079712930.80M;\n\
  ```\n\n使用减运算符*等同于从零减去操作数。*\n\n一元加运算符（`+`）很少^(2) 对值产生任何影响。它是 C# 语言中一个多余的添加，为了对称性而包含进来。\n\
  \n2。一元 + 运算符定义为接收类型为 `int, uint, long, ulong, float, double` 和 `decimal`（以及这些类型的可空版本）的操作数。在其他数值类型上使用它时无效。\n\
  \n#### 二元算术运算符 (`+`, `-`, `*`, `%`)\n\n二元运算符需要两个操作数。C# 使用中置法对于二元运算符：运算符位于左、右操作数之间。\n\
  \n列表 4.3 演示了算术运算符的使用——更具体地说，是赋值。算术运算符包括乘法（`*`）、除法（`/`）和取余（`%` [有时称为模运算符]）。\n\n**列表\
  \ 4.3：使用二元运算符**\n\n点击此处查看代码图像\n\n```cs\nclass Division\n\n{\n  static void Main()\n\
  \  {\n      int numerator;\n\n      int denominator;\n\n      int quotient;\n\n\
  \      int remainder;\n\n      System.Console.Write(\"Enter the numerator: \");\n\
  \n      numerator = int.Parse(Console.ReadLine());\n\n      System.Console.Write(\"\
  Enter the denominator: \");\n\n      denominator = int.Parse(Console.ReadLine());\n\
  \n      quotient = numerator / denominator;\n\n      remainder = numerator % denominator;\n\
  \n      System.Console.WriteLine(\n          $\"{numerator} / {denominator} = {quotient}\
  \ with remainder\n\n{remainder}\");\n  }\n}\n```\n\n输出 4.1 显示了列表 4.3 的结果。\n\n**输出\
  \ 4.1**\n\n点击此处查看代码图像\n\n```\nEnter the numerator: 23\n\nEnter the denominator:\
  \ 3\n\n23 / 3 = 7 with remainder 2\n```\n\n在这些赋值语句中，除法和取余操作先于赋值。运算符的执行顺序由它们的**优先级**和**结合性**决定。目前为止使用的运算符优先级如下：\n\
  \n1.  `*`、`/` 和 `%` 优先级最高。\n\n2.  `+` 和 `-` 优先级较低。\n\n3.  `=` 在这六个运算符中优先级最低。\n\n\
  因此，你可以语句按预期执行，除法和取余运算符先执行。\n\n如果你忘记为这些二元运算符的结果赋值，你将收到如输出 4.2 所示的编译错误。\n\n**输出 4.2**\n\
  \n点击此处查看代码图像\n\n```\n... 错误 CS0201: 只有赋值、调用、增、递减和新对象表达式可以作为语句\n```\n\n##### 与字符串使用加法运算符\n\
  \n\n\n\n运算符也可以与非数字操作数一起工作。例如，可以使用加法运算符来连接两个或多个字符串，如列表 4.4 所示。\n\n**列表 4.4：在非数字类型上使用二进制运算符**\n\
  \n点击此处查看代码图像\n\n```cpp\nclass FortyTwo\n\n{\n\n  static void Main()\n\n  {\n   \
  \   short windSpeed = 42;\n      System.Console.WriteLine(\n          \"The original\
  \ Tacoma Bridge in Washington\\nwas \"\n          + \"brought down by a \"\n   \
  \       + windSpeed + \" mile/hour wind.\");\n  }\n}\n```\n\n输出 4.3 显示了列表 4.4 的结果。\n\
  \n**输出 4.3**\n\n点击此处查看代码图像\n\n```\nThe original Tacoma Bridge in Washington\n\n\
  was brought down by a 42 mile/hour wind.\n```\n\n由于不同文化背景下的语言句式结构有所异，开发者应该小心不要在可能需要本地化的字符串上使用加法运算符。同样，尽管我们可以使用\
  \ C# `6.0` 的字符串插值在字符串中嵌入表达式，但对其他语言的本地化仍然需要将字符串移动到资源文件中，这会导致字符串插值失效。出于此原因，你应该谨慎使用加法运算符，在可能需要本地化时优先使用复合格式化。\n\
  \n### 在算术运算中使用字符\n\n在第 2 章中引入 `char` 类型时，我们提到尽管 `char` 存储的是字符而不是数字，但 `char` 类型是一种`integral`\
  \ 类型（`integral` 意味着它是基于整数的）。它可以与其他整数类型参与算术运算。然而，对 `char` 类型值的解释不是基于其存储的字符，而是基于其底层值。例如，数字\
  \ `3` 由 Unicode 值 `0x33`（十六进制）表示，这在十进制中为 `51`。数字 `4` 由 Unicode 值 `0x34` 表示，十进制中为\
  \ `52`。在列表 4.5 中将 `3` 和 `4` 相加得到十六进制值 `0x67`，或十进制的 `103`，这是字母 `g` 的 Unicode 值。\n\
  \n**列表 4.5：在 `char` 数据类型上使用加运算符**\n\n点击此处查看代码图像\n\n```cpp\nint n = '3' + '4';\n\n\
  char c = (char)n;\n\nSystem.Console.WriteLine(c);  // 写出 g\n```\n\n输出 4.4 显示了列表\
  \ 4.5 的结果。\n\n**输出 4.4**\n\n```\ng\n```\n\n你可以利用字符类型的这种特性来确定两个字符之间的距离。例如，字母 `f`\
  \ 与字母 `c` 相隔三个字符。你可以通过从字母 `f` 中减去字母 `c` 来确定这个值，如列表 4.6 所示。\n\n**列表 4.6：确定两个字符之间的字符差**\n\
  \n点击此处查看代码图像\n\n```cpp\nint distance = 'f' – 'c';\n\nSystem.Console.WriteLine(distance);\n\
  ```\n\n输出 4.5 显示了列表 4.6 的结果。\n\n**输出 4.5**\n\n```\n3\n```\n\n### 特殊浮点特性\n\n二进制浮点类型\
  \ `float` 和 `double` 有一些特殊特性，例如它们处理精度的方式。本节将介绍一些特定示例，以及一些独特的浮点类型特性。\n\n`float` 具有七位小数精度，可以存储值\
  \ 1,234,567 和 0.1234567。然而，如果你将这两个 `float` 相加，结果将被舍入为 1,234,567，因为精确结果所需的精度超过了 `float`\
  \ 所能提供的七位有效数字。舍入到七位引入的误差与计算值相比可能会变得很大，特别是在重复计算时。（另参见本节稍后部分的“高级主题：浮点类型的意外不等性”。）\n\
  \n在内部，二进制浮点类型实际上存储的是二进制分数，而不是小数。因此，简单的赋值可能会出现“表示误差”不准确的情况，例如 `double number = 140.6F`。140.6\
  \ 的精确值是分数 703/5，但该分的分母不是 2 的幂，因此无法用二进制浮点数精确表示。实际表示的值是分母为 2 的幂且能放入 16 位中的最接近分数。\n\
  \n\n\n\n在此项任务中，你首先计算 `x + 2` 的值，然后将计算出的值赋值回 `x`。由于这种操作执行得相对频繁，因此存在一种赋值运算符，可以用一个运算符同时处理计算和赋值。`+=`\
  \ 运算符会将运算符右侧的值加到运算符左侧变量上，如列表 4.11 所示。\n\n**列表 4.11：使用 `+=` 运算符**\n\n点击此处查看代码图像\n\
  \n```\nint x = 123;\n\nx += 2;\n```\n\n因此，这段代码等同于列表 4.10。\n\n还有许多其他复合赋值运算符可以提供类似的功能。你还可以结合减法、乘法、除法和取余运算符一起使用赋值运算符（如列表\
  \ 4.12 所示）。\n\n**列表 4.12：其他赋值运算符示例**\n\n点击此处查看代码图像\n\n```\nx -= 2;\n\nx /= 2;\n\n\
  x *= 2;\n\nx %= 2;\n```\n\n### 递增和递减运算符 (`++`, `--`)\n\nC# 包含了特殊的单元运算符用于计数器的递增和递减。**递增运算符**\
  \ `++` 每次使用时都会将变量加 1。换句话说，列表 4.13 中显示的所有代码行都是等价。\n\n**列表 4.13：递增运算符**\n\n点击此处查看代码图像\n\
  \n```\nspaceCount = spaceCount + 1;\n\nspaceCount += 1;\n\nspaceCount++;\n```\n\n\
  同样，你也可以使用**递减运算符** `--` 将变量减 1。因此，列表 4.14 中显示的所有代码行也是等价。\n\n**列表 4.14：递减运算符**\n\n\
  点击此处查看代码图像\n\n```\nlines = lines - 1;\n\nlines -= 1;\n\nlines--;\n```\n\n我们已经看到赋值运算符首先计算要赋值的值，然后执行赋值。赋值运算符的结果是被赋值的值。递增和递减运算符也类似：它们计算要赋值的值，执行赋值，并产生一个值。因此，可以将赋值运算符与递增或递减运算符结合使用，尽管不小心可能会非常困惑。示例请参阅列表\
  \ 4.16。\n\n**列表 4.16：使用后递增运算符**\n\n点击此处查看代码图像\n\n```\nint count = 123;\n\nint result;\n\
  \nresult = count++;                                             \n\nSystem.Console.WriteLine(\n\
  \n  $\"result = {result} and count = {count}\");\n```\n\n**输出 4.10**\n\n```\nresult\
  \ = 123 and count = 124\n```\n\n你可能会惊讶于 `result` 被赋值的值是 `count` 在递增之前的值。你放置递增或递减运算符的位置决定了赋值的值应该是操作数计算之前的值还是计算之后的值。如果你希望\
  \ `result` 的值是赋值给 `count` 的值，你需要将运算符放置于被递增的变量之前，如列表 4.17 所示。\n\n**列表 4.17：使用前递增运算符**\n\
  \n点击此处查看代码图像\n\n```\n int count = 123;\n\n   int result;\n\n   result = ++count;\
  \                                          \n\n   System.Console.WriteLine(\n\n\
  \     $\"result = {result} and count = {count}\");\n```\n\n输出 4.11 显示了列表 4.17 的结果。\n\
  \n**输出 4.11**\n\n```\nresult = 124 and count = 124\n```\n\n在这个示例中，递增运算符出现在操作数之前，因此表达式的结果是递增后赋值给变量的值。如果\
  \ `count` 是 `123`，`++count` 将 `124` 赋值给 `count` 并产生结果 `124`。相比之下，后递增运算符 `count++`\
  \ 将 `124` 赋值给 `count` 并产生 `count` 在递增之前持的值：`123`。无论运算符是后置还是前置，变量 `count` 都会在产生值之前递增；唯一的区别在于产生了哪个值。前置和后置行为的区别在列表\
  \ 4.18 中所示。结果输出见输出 4.12。\n\n**列表 4.18：比较前置和后置递增运算符**\n\n点击此处查看代码图像\n\n```\nclass\
  \ IncrementExample\n\n{\n\n  static void Main()\n\n  {\n\n      int x = 123;\n \
  \     // Displays 123, 124, 125\n\n      System.Console.WriteLine($\"{x++}, {x++},\
  \ {x}\");\n\n      // x now contains the value 125\n\n      // Displays 126, 127,\
  \ 127\n\n      System.Console.WriteLine($\"{++x}, {++x}, {x}\");\n\n      // x now\
  \ contains the value 127\n\n  }\n}\n```\n\n**输出 4.12**\n\n```\n123, 124, 125\n\n\
  126, 127, 127\n```\n\n\n\n\n\n表 4.1 中的每个 C# 控制流语句都出现在井字游戏^(3)程序中，并可以在第 4 章源代码中的`TicTacToe.cs`\
  \ 文件中找到（参见 [`itl.tc/EssentialCSharpSCC`](http://itl.tc/EssentialCSharpSCC)）。该程序显示井字棋盘，提示每位玩家并在每次移动时进行更新。\n\
