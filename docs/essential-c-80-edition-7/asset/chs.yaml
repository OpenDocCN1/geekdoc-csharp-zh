  \n##### Getter 和 Setter 上的访问修饰符\n\n如之前提到的，外部访问字段并不是良好的做法，因为这样做会绕过可能插入的任何验证或额外逻辑。访问修饰符出现在属性实现的\
  \ `get` 或 `set` 部分（6 而不是两者），从而覆盖在属性声明时指定的访问修饰符。列表 6.23 展示了如何这样做。\n\n6 在 C# 2.0 中引入。C#\
  \ 1.0 不允许属性的 getter 和 setter 部分之间存在不同的封装。因此，无法创建一个公共 getter 和私有 setter，以便外部类只读访问属性。\n\
  \n###### 列表 6.23：在 Setter 上放置访问修饰符\n\n点击此处查看代码图片\n\n```cs\nclass Program\n{\n  static\
  \ void Main()\n  {\n      Employee employee1 = new Employee();\n      employee1.Initialize(42);\n\
  \      // 错误：无法在此上下文使用属性或索引器 'Employee.Id'\n      // 因为 set 访问器不可访问\n      // employee1.Id\
  \ = \"49\";\n  }\n}\n```\n\n```cs\npublic class Employee\n{\n  public void Initialize(int\
  \ id)\n  {\n      // 设置 Id 属性\n      Id = id.ToString();\n  }\n  // ...\n  // Id\
  \ 属性声明\n  public string Id\n  {\n      get => _Id;\n      // 仅在 C# 2.0 及更高版本中支持访问修饰符\n\
  \      private set => _Id = value;\n  }\n  private string _Id;\n}\n```\n\n通过在 setter\
  \ 上使用 `private`，属性对于 `Employee` 外的其他类是只读的。在 `Employee` 内部，属性是可读写的，因此你可以在类内部分配属性。在\
  \ getter 或 setter 上指定访问修饰符时，请确保访问修饰符比属性整体的访问修饰符严格。例如，将属性声明为 `private` 而将 setter\
  \ 为 `public` 是编译错误。\n\n`结束 2.0`\n\n##### 属性和方法调用不允许作为 `ref` 或 `out` 参数值\n\nC# 允许像字段一样使用属性，但将其作为\
  \ `ref` 或 `out` 参数值传递除外。`ref` 和 `out` 参数值内部通过向目标方法传递内存地址来实现。然而，由于属性可以是没有底层字段的虚拟字段或者是只读或只写的，因此无法传递底层存储的地址。结果是你不能将属性作为\
  \ `ref` 或 `out` 参数值传递。方法调用也是如此。相反，当代码需要将属性或方法调用作为 `ref` 或 `out` 参数值传递时，代码必须先将值复制到变量，然后传递变量。一旦方法调用完成，代码必须将变量赋值回属性。\n\
  \n### 构造函数\n\n现在你已经为类添加了字段并可以存储数据，你需要考虑这些数据的有效性。正如你在 列表 6.3 中看到的，使用 `new` 运算符实例化对象是可能的。然而，结果是创建了一个包含无效数据的对象。\n\
  \n\n\n\n```csharp\npublic class Employee\n{\n  // Employee constructor         \
  \                                    \n  public Employee(string firstName, string\
  \ lastName)                  \n  {                                             \
  \                      \n    FirstName = firstName;                            \
  \                \n    LastName = lastName;                                    \
  \          \n  }                                                               \
  \    \n  public string FirstName{ get; set; }\n\n  public string LastName{ get;\
  \ set; }\n  public string? Salary{ get; set; } = \"Not Enough\";\n\n  // ...\n}\n\
  ```\n\n如所示，要定义一个构造函数，你需要创建一个没有返回类型的方法，该方法名必须与类名相同。构造函数是运行时调用以初始化对象实例的方法。在这种情况下，构造函数接受名字和姓氏作为参数，允许程序员人员在实例化\
  \ `Employee` 对象时指定这些名称。列表 6.27 是一个关于如何调用构造函数的示例。\n\n### 列表 6.27: 调用构造函数\n\n点击此处查看代码图像\n\
  \n```csharp\nclass Program\n{\n  static void Main()\n  {\n      Employee employee;\n\
  \      employee = new Employee(\"Inigo\", \"Montoya\");                        \
  \         \n      employee.Salary = \"Too Little\";\n      System.Console.WriteLine(\n\
  \          \"{0} {1}: {2}\",\n          employee.FirstName,\n          employee.LastName,\n\
  \          employee.Salary);\n  }\n  // ...\n}\n```\n\n注意，`new` 运算符返回了正在实例化的对象的类型（即使在构造函数的声明或实现中没有显式指定返回类型或返回语句）。此外，你删除了名字和姓氏的初始化代码，因为初始化是在构造函数内部进行的。在这个示例中，你没有在构造函数内部初始化\
  \ `Salary`，因此赋值薪水的代码仍然存在。\n\n开发者在同时使用声明时赋值和构造函数内部赋值时应格外小心。构造函数内部赋值将发生在字段声明时所做的任何赋值之后（例如\
  \ 列表 6.5 中的 `string Salary = \"Not enough\"`）。因此，构造函数内部的赋值将覆盖声明时分配的任何值。这种细微之处可能导致偶然读者对代码产生误解，他们可能假设实例化后的值是字段声明中分配的值。因此，考虑一种不在同一个类中混合使用声明赋值和构造函数赋值的编码风格是值得的。\n\
  \n### 默认构造函数\n\n当你显式添加构造函数时，你将无法在 `Main()` 内部不指定名字和姓氏的情况下实例化 `Employee`。因此，列表 6.28\
  \ 所示的代码将无法编译。\n\n### 列表 6.28: 默认构造函数不再可用\n\n点击此处查看代码图像\n\n```csharp\nclass Program\n\
  {\n  static void Main()\n  {\n      Employee employee;\n      // 错误：没有重载，因为方法 'Employee'\
  \                   \n      // 接受 '0' 参数                                       \
  \     \n      employee = new Employee();                                       \
  \ \n      // ...\n  }\n}\n```\n\n如果类没有显式定义的构造函数，C# 编译器会在编译期间添加一个。此构造函数不接受任何参数，因此根据定义，它是`默认构造函数`。一旦你向类添加了显式构造函数，C#\
  \ 编译器就不再提供默认构造函数。因此，由于定义了 `Employee(string firstName, string lastName)`，编译器就不会添加默认构造函数\
  \ `Employee()`。你可以手动添加这样的构造函数，但这样你就会再次允许在不指定员工名称的情况下构造 `Employee`。\n\n没有必要依赖于编译器定义的默认构造函数。也就是说，程序员可以显式定义一个默认构造函数——也许是一个将某些字段初始化为特定值的构造函数。定义默认构造函数只需声明一个不接受参数的构造函数。\n\
  \n`开始 3.0`\n\n### 对象初始化器\n\n从 C# 3.0 开始，C# 语言团队增加了初始化对象可访问字段和属性的功能。为了实现这一点，你可以使用`对象初始化器`的概念——这是一组在创建对象的构造函数调用之后、用大括号括起来的成员初始化器。每个成员初始化器都是将可访问的字段或属性名赋一个值（参见\
  \ 列表 6.29）。\n\n### 列表 6.29: 使用显式成员赋值调用对象初始化器\n\n点击此处查看代码图像\n\n```csharp\nclass Program\n\
  {\n  static void Main()\n  {\n        Employee employee1 = new Employee(\"Inigo\"\
  , \"Montoya\")\n            { Title = \"Computer Nerd\", Salary = \"Not enough\"\
  };\n      // ...\n  }\n}\n```\n\n注意，即使在使用对象初始化器时，相同的构造函数规则也适用。事实上，生成的 CIL（公共中间语言）与在构造函数调用之后的后续独立语句中为字段或属性赋值的结果完全相同。C#\
  \ 中成员初始化器的顺序提供了 CIL 中构造函数调用之后语句中属性和字段赋值的序列。\n\n通常情况下，在构造函数退出时，所有属性都应该初始化为合理的默认值。此外，通过在`setter`（Setter）上使用验证逻辑，可以限制向属性分配无效数据。有时，一个或多个属性的值可能会导致同一对象的其他属性包含无效值。当发生这种情况时，无效状态的异常应推迟到相关的属性值变得相关后再处理。\n\
  \n`3.0`\n\n### 列表 6.30: 调用对象初始化器\n\n点击此处查看代码图像\n\n```csharp\nclass Program\n{\n\
  \  static void Main()\n  {\n      List<Employee> employees = new List<Employee>()\n\
  \         {\n            new Employee(\"Inigo\", \"Montoya\"),\n            new\
  \ Employee(\"Kevin\", \"Bost\")\n         };\n      // ...\n  }\n}\n```\n\n`结束 3.0`\n\
  \n在分配新集合实例之后，编译器生成的代码按顺序实例化每个对象并通过`Add()` 方法将其添加到集合中。\n\n### 构造函数重载\n\n构造函数是可以重载的——只要参数的数量或类型不同，你就可以多个构造函数。例如，如\
  \ 列表 6.31 所示，你可以提供一个带有名字和姓氏的员工 ID 的构造函数，甚至可以只有员工 ID 的。\n\n### 列表 6.31: 重载构造函数\n\n\
  点击此处查看代码图像\n\n\n\n\n\n```cs\npublic class Employee\n\n{\n  public Employee(string\
  \ firstName, string lastName)\n  {\n      FirstName = firstName;\n      LastName\
  \ = lastName;\n  }\n  public Employee(                                 \n      int\
  \ id, string firstName, string lastName )                                  \n  {\
  \                                                                              \
  \ \n      Id = id;                                                             \
  \       \n      FirstName = firstName;                                         \
  \             \n      LastName = lastName;                                     \
  \                   \n  }                                                      \
  \                         \n\n// FirstName&LastName set inside Id property setter.\
  \                              \n\n#pragma warning disable CS8618              \
  \                                      \n\npublic Employee(int id) => Id = id; \
  \                                              \n\n#pragma warning restore CS8618\
  \                                                    \n\n  public int Id       \
  \                                                            \n  {             \
  \                                                                  \n      get =>\
  \ Id;                                                                  \n      private\
  \ set                                                                 \n      {\
  \                                                                           \n \
  \         // Look up employee name...                                          \
  \   \n          // ...                                                         \
  \         \n      }                                                            \
  \               \n  }                                                          \
  \                     \n\n  public string FirstName { get; set; }\n\n  public string\
  \ LastName { get; set; }\n\n  public string? Salary { get; set; } = \"Not Enough\"\
  ;\n\n  // ...\n}\n```\n\n这种方法允许 `Program.Main()` 通过仅传递员工 ID 或同时传递姓名和 ID，根据姓和名来实例化员工。当在系统中创建新员工时，你将使用同时包含姓名和\
  \ ID 的构造函数。当你从文件或数据库中加载员工数据时，你将使用仅包含 ID 的构造函数。\n\n与方法重载的情况一样，使用多个构造函数是为了支持使用少量参数的简单场景以及带有额外参数的复杂场景。可以考虑使用可选参数来代替重载，这样“已设置默认值”属性的默认值在\
  \ API 中是可见的。例如，`Person(string firstName, string lastName, int? age = null)` 构造函数签名提供了签名文档：如果未指定\
  \ `Person` 的 `Age`，它将默认为 `null`。\n\n`Begin 7.0``Begin 8.0`\n\n请注意，从 C# 7.0 开始，可以对构造函数使用表达式主体的成员实现，如下所示：\n\
  \n点击此处查看代码图像\n\n```cs\n// FirstName&LastName set inside Id property setter.\n\n\
  #pragma warning disable CS8618\n\npublic Employee(int id) => Id = id;\n```\n\n`End\
  \ 7.0``End 8.0`\n\n在这种情况下，我们调用 `Id` 属性来为 `FirstName` 和 `LastName`。遗憾的是，编译器没有检测到该赋值，并且从\
  \ C# 8.0 开始，会发出警告，考虑将这些属性标记为可空。由于我们实际上确实设置了它们，因此禁用了该警告。\n\n### 构造函数链：使用 `this` 调用另一个构造函数\n\
  \n在列表 6.31 中，`Employee` 对象的初始化代码现在重复于多个处，因此也必须在多个处进行维护。虽然代码量很小，但可以通过从一个构造函数调用另一个构造函数来消除重复——这种做法被称为**构造函数链**——这通过**构造函数初始化器**来实现。构造函数初始化器会在执行当前构造函数的实现之前确定要调用哪个构造函数（参见列表\
  \ 6.32）。\n\n**列表 6.32：从一个构造函数调用另一个构造函数**\n\n点击此处查看代码图像\n\n```cs\npublic class Employee\n\
  \n{\n  public Employee(string firstName, string lastName)\n  {\n      FirstName\
  \ = firstName;\n      LastName = lastName;\n  }\n\n  public Employee(          \
  \                                                    \n      int id, string firstName,\
  \ string lastName )                                \n      : this(firstName, lastName)\
  \                                               \n  {\n      Id = id;\n  }\n\n \
  \ // FirstName&LastName set inside Id property setter.\n\n  #pragma warning disable\
  \ CS8618\n  public Employee(int id)\n  {\n      Id = id;\n      // Look up employee\
  \ name...\n      // ...\n      // NOTE: Member constructors cannot be          \
  \                            \n      // called explicitly inline               \
  \                                  \n      // this(id, firstName, lastName);   \
  \                                        \n  }\n\n  #pragma warning restore CS8618\n\
  \n  public int Id { get; private set; }\n\n  public string FirstName { get; set;\
  \ }\n\n  public string LastName { get; set; }\n\n  public string? Salary { get;\
  \ set; } = \"Not Enough\";\n\n  // ...\n}\n```\n\n要在同一个类中（针对同一个对象实例）调用另一个构造函数，C#\
  \ 使用冒号后跟 `this` 关键字，然后是被调用构造函数声明中的参数列表。在这种情况下，接收三个参数的构造函数调用了接收两个参数的构造函数。通常，这种调用模式是反过来的——即参数最少的构造函数调用参数参数的构造函数，并为未知的参数传递默认值。\n\
  \n`Begin 8.0`\n\n### 带有构造函数的非可空引用类型属性\n\n在本章中，我们一贯禁用了 C# 的可空警告：\n\n点击此处查看代码图像\n\n\
  ```text\nCS8618: Non-nullable field/property is uninitialized. Consider declaring\
  \ as\nnullable.\n```\n\n当你声明引用类型（1）非可空字段或（2）非可空自动实现属性时，显而易见这些字段和属性在对象完全实例化之前需要初始化。如果不这样做将导致这些字段和属性具有默认\
  \ `null` 值——因此它们不应被声明为非可空。\n\n问题在于，非可空字段和属性经常被间接初始化，位于构造函数的直接范围之外，因此超出了编译器的代码分析范围，即使它们实际上通过构造函数调用的方法或属性进行了初始化。（参见\
  \ 7）。以下是这种做法的一些示例：\n\n*   带有验证的简单属性检查赋值给字段的值是否为 `null`，然后赋值给编译器报告未初始化的字段（参见列表 6.20）。\n\
  *   计算出的 `Name` 属性（如列表 6.22）设置了类中的其他非可空属性或字段。\n*   集中初始化以列表 6.32 和 6.33 所示的方式进行。\n\
  *   公共属性由外部代理初始化，这些代理触发实例化，然后初始化属性。（参见 8）。\n\n8. 示例包括 MSTest 中的 `TestContext` 属性或通过依赖注入初始化的对象。\n\
  \n\n\n\n\n在大多数情况下，非空引用类型字段或非空自动实现属性（在本节中统称为“非空字段/属性”——此处隐含了“引用类型”）是通过构造函数调用的属性或方法进行间接赋值的。遗憾的是，C#\
  \ 编译器无法识别这种对非空字段/属性的间接赋值。\n\n此外，所有非空字段/属性都必须确保它们不会被赋值为 `null`。对于字段，它们需要被封装在带有设置器（setter）验证的属性中，以确保不会分配\
  \ `null` 值。（请记住，字段验证依赖于一项准则：我们不在封装该字段的属性之外访问该字段。）结果是，非空的可读写完全实现的引用类型属性应该具有防止 `null`\
  \ 赋值的验证逻辑。\n\n非空自动实现属性需要限制为只读封装，任何在实例化期间分配的值都应在赋值之前被验证为不为 `null`。应该避免使用可读写的非空引用类型自动实现属性，尤其是带有公共设置器的属性，因为防止\
  \ `null` 赋值是有困难的。虽然通过从构造函数为属性赋值可以避免“未初始化的非空属性”编译器警告，但这还够的：该属性是可读写的，因此在实例化后可能会被赋值为\
  \ `null`，从而违背了你将其设非空的意图。\n\n### 读/写非空引用类型属性\n\nListing 6.34 展示了如何告知编译器并避免“非空字段/属性未初始化”的虚假警告。最终目标是允许程序员告知编译器这些属性/字段是非空的，以便编译器能够告知调用者这些属性/字段的（可）空性。\n\
  \n**Listing 6.34：为非空属性提供验证**\n\n点击此处查看代码图像\n\n```csharp\npublic class Employee\n\
  {\n  public Employee(string name)\n  {\n      Name = name;                     \
  \                                       \n  }\n  public string Name\n  {\n     \
  \ get => _Name!;\n      set => _Name =\n          value ?? throw new ArgumentNullException(nameof(value));\
  \             \n  }\n  private string? _Name;\n  // ...\n}\n```\n\n处理未由构造函数直接初始化的非空属性/字段的代码段具有几个重要特性（此处不按特定顺序排列）：\n\
  \n1. 属性设置器包含对 `null` 的检查，该检查在设置非空字段的值之前进行。在 Listing 6.34 中，这是通过使用空合并运算符并在新值为为 `null`\
  \ 时抛出 `ArgumentNullException` 实现的。\n2. 构造函数调用了间接赋值非空字段的方法或属性，但编译器未能识别出该字段已初始化为一个除\
  \ `null` 以外的值。\n3. 后备字段被声明为可空，以避免编译器产生该字段未初始化的警告。\n4. 获取器（getter）使用空忽略运算符（null-forgiving\
  \ operator）返回字段——声明得益于设置器的验证，它不是 `null`。\n\n对于非空属性，将后备字段声明为可空似乎是不合逻辑的。然而，这是必要的，因为编译器忽略构造函数之外的非空字段/属性赋值。幸运的是，在这种情况下，你作为程序员，在返回字段时使用空忽略运算符是合理的，因为设置器中的\
  \ `null` 检查确保了字段永远不会为 `null`。\n\n### 只读自动实现引用类型属性\n\n如本节前面所述，非空自动实现引用类型属性需要是只读的，以避免无效的\
  \ `null` 。然而，你仍然需要验证在实例化期间可能分配的任何参数，如 Listing 6.35\n\n```csharp\npublic class Employee\n\
  {\n  public Employee(string name)\n  {\n      Name = name?? throw new ArgumentNullException(nameof(name));\
  \                         \n  }\n  public string Name { get; }                 \
  \                              \n}\n```\n\n人们可能会争论是否允许非空自动实现引用类型属性具有私有设置器。虽然可行，但更合适的问题是你的类是否会错误地给属性分配\
  \ `null`。如果你没有在设置器中通过验证来封装字段，你能确定自己不会误分配一个 `null` 值吗？虽然编译器会在实例化期间验证你的意图，但开发者是否总是能记得对进入类的本应非空的值进行\
  \ `null` 检查是有问题的——正如在 Listing 6.35）。共有七种不同的可空属性，分别定义在 `System.Diagnostics.CodeAnalysis`\
  \ 命名空间中，并识别为前提条件（pre-conditions）或后置条件（post-conditions）（Table 6.1）。\n\n此类属性是有帮助的，因为有时数据类型的空性是不够的。你可以通过装饰方法的输入数据（以前条件可空属性）或输出数据（后置条件可空属性）的属性克服这种不足。以前条件告知调用者指定的值是否意图为\
  \ `null`，而后置条件则告知调用者输出数据的空性。例如，考虑 [Listing 6.36](#ch06.xhtml_ch06ex36）所示的 try-get\
  \ 模式的方法。\n\n**Table 6.1：可空属性**\n\n| **属性** | **类别** | **描述** |\n| --- | --- | ---\
  \ |\n| `AllowNull` | 前提条件 | 非空输入参数可以为 `null`。 |\n| `DisallowNull` | 前提条件 | 可空输入参数不应为\
  \ `null`。 |\n| `MaybeNull` | 后置条件 | 非空返回值可能为 `null`。 |\n| `NotNull` | 后置条件 | 可空返回值不会为\
  \ `null`。 |\n| `MaybeNullWhen` | 后置条件 | 当方法返回指定的 `bool` 值时，非空输入参数可能为 `null`。 |\n\
  | `NotNullWhen` | 后置条件 | 当方法返回指定的 `bool` 值时，可空输入参数不会为 `null`。 |\n| `NotNullIfNotNull`\
  \ | 后置条件 | 如果指定参数的值不是 `null`，则返回值不是 `null`。 |\n\n\n\n\n```c\nusing System.Diagnostics.CodeAnalysis;\n\
  \n// ...\n\nstatic bool TryGetDigitAsText(\n\n  char number, [NotNullWhen(true)]out\
  \ string? text) =>\n\n      (text = number switch\n      {\n          '1' => \"\
  one\",\n          '2' => \"two\",\n          // ...\n          '9' => \"nine\",\n\
  \          _ => null\n      }) is string;\n\n[return: NotNullIfNotNull(\"text\"\
  )]\n\nstatic public string? TryGetDigitsAsText(string? text)\n{\n    if (text is\
  \ null) return null;\n    string result = \"\";\n    foreach (char character in\
  \ text)\n    {\n        if (TryGetDigitAsText(character, out string? digitText))\n\
  \        {\n            if (result != \"\") result += '-';\n\n            result\
  \ += digitText.ToLower();\n        }\n    }\n    return result;\n}\n```\n\n注意，`TryGetDigitsAsText()`\
  \ 对 `digitText.ToLower()` 的调用没有使用空合并运算符，尽管 `text` 被声明为可空，但也不会发出警告。这是因为 `TryGetDigitAsText()`\
  \ 中的 `text` 参数装饰了 `NotNullWhen(true)` 属性，该属性告诉编译器，如果方法返回 true（`NotNullWhen` 属性指定的值），那么你的意图是\
  \ `digitText` 不为 `null`。`NotNullWhen` 属性是一个后置条件声明，告知调用者如果方法返回 `true`，则输出 (`text`)\
  \ 不为 `null`。\n\n同样，对于 `TryGetDigitsAsText()`，如果为 `text` 参数的值不是 `null`，则返回值将不会是 `null`。这是因为前置条件可空属性\
  \ `NotNullIfNotNull` 根据 `text` 参数输入值是否为 `null` 来决定返回值是否可能为 `null`。\n\n### 解构构造函数\n\
  \n构造函数允许你接收多个参数并将它们全部封装到单个对象中。在 C# 7.0 之前，还没有显式的结构来实现反向操作——即将封装的项拆解为它的组成部分。当然，你可以手动将每个属性赋值给变量；但是，如果有大量这样的变量，将需要许多单独语句。通过\
  \ C# 7.0 的元组语法，这变得简单得了。例如，你可以声明一个类似于 列表 6.38 所示的 `Deconstruct()` 方法。\n\n**列表 6.38：定义和使用解构构造函数**\n\
  \n点击此处查看代码\n\n```csharp\npublic class Employee\n{\n   public void Deconstruct(\n\
  \       out int id, out string firstName,\n       out string lastName, out string\
  \ salary)\n  {\n       (id, firstName, lastName, salary) =\n            (Id, FirstName,\
  \ LastName, Salary);\n  }\n  // ...\n}\n```\n\n```csharp\nclass Program\n{\n  static\
  \ void Main()\n  {\n      Employee employee;\n      employee = new Employee(\"Inigo\"\
  , \"Montoya\");\n      employee.Salary = \"Too Little\";\n      employee.Deconstruct(out\
  \ _, out string firstName,                       \n         out string lastName,\
  \ out string salary)                              \n      System.Console.WriteLine(\n\
  \          \"{0} {1}: {2}\",\n          firstName, lastName, salary);\n  }\n}\n\
  ```\n\n这种方法可以像在 第 5 章 中预期的那样，通过内联声明 `out` 参数来直接调用。\n\n从 C# 7.0 开始，可以通过直接将对象实例赋值给元组来隐式地调用\
  \ `Deconstruct()` 方法——即**解构构造函数**（这里这里我们假设被赋值的变量已经声明）：\n\n点击此处查看代码\n\n```csharp\n\
  (_, firstName, lastName, salary) = employee;\n```\n\n该语法产生的 CIL 代码与 列表 6.38 中高亮的代码相同——它只是一种更简单的语法（并且没有那么直观地表明调用了\
  \ `Deconstruct()` 方法）。请注意，该语法允许使用元组语法进行匹配 `out` 参数赋值的变量。它也不允许为元组类型赋值：\n\n点击此处查看代码\n\
  \n```csharp\n(int, string, string, string) tuple = employee;\n```\n\n或者像下面这样带有命名项：\n\
  \n点击此处查看代码\n\n```csharp\n(int id, string firstName, string lastName, string salary)\
  \ tuple = employee\n```\n\n`7.0 结束`\n\n要声明解构构造函数，方法名必须是 `Deconstruct`，且签名必须返回 `void`\
  \ 并仅接受两个或多个 `out` 参数。并且，给定这样的签名，可以将对象实例直接赋值给元组，而无需显式方法调用。\n\n### 静态成员\n\n第 1 章 中的\
  \ `HelloWorld` 示例简要提到了 `static` 关键字。本节更完整地定义了 `static` 关键字。\n\n首先，让我们考虑一个示例。假设每个员工的\
  \ `Id` 值需要是唯一的。实现这一点的一种方法是存储一个计数器来跟踪每个员工 ID。（此处由于原文中重复的描述，已根据要求提取核心逻辑）。\n\n####\
  \ 静态字段\n\n要定义跨实例可用的数据，使用 `static` 关键字，如 列表 6.39 所示。\n\n**列表 6.39：声明静态字段**\n\n点击此处查看代码\n\
  \n```csharp\npublic class Employee\n{\n  public Employee(string firstName, string\
  \ lastName)\n  {\n      FirstName = firstName;\n      LastName = lastName;\n   \
  \   Id = NextId;\n\n      NextId++;\n  }\n\n  // ...\n\n  public static int NextId;\n\
  \n  public int Id { get; set; }\n\n  public string FirstName { get; set; }\n\n \
  \ public string LastName { get; set; }\n\n  public string? Salary = \"Enough\";\n\
  ```\n\n在此示例中，`NextId` 字段声明包含了 `static` 修饰符，因此被称为**静态字段**。与 `Id` 不同，`NextId` 的存储位置由所有\
  \ `Employee` 实例共享。在 `Employee` 构造函数内部，在递增 `Id` 之前，将新对象的 `Id` 赋值为 `NextId` 的值。当创建另一个\
  \ `Employee` 类时，`NextId` 将递增，并且新 `Employee` 对象的 `Id` 字段将持有不同的值。\n\n就像**实例字段**（非静态字段）可以在声明时初始化一样，静态字段也可以，如\
  \ 列表 6.40 所示。\n\n**列表 6.40：在声明时为静态字段**\n\n点击此处查看代码\n\n```csharp\npublic class Employee\n\
  {\n  // ...\n\n  public static int NextId = 42;\n\n  // ...\n}\n```\n\n与实例字段不同，如果未为静态字段初始化，静态字段将自动分配其默认值（`0`、`null`、`false`\
  \ 等）——即 `default(T)`，其中 `T` 是类型的名称。因此，即使在 C# 代码中从未显式赋值，也可以访问该静态字段。\n\n\n\n\n非静态字段（或称为实例字段）为所属的每个对象提供了一个新的存储位置。相比之下，静态字段不属于实例，而是属于类本身。因此，你通过类名从类外部访问静态字段。请考虑在列表\
  \ 6.41 中所示的新 `Program` 类（使用了来自列表 6.39 的 `Employee` 类）。\n\n### 列表 6.41：访问静态字段\n\n\
  点击此处查看代码图像\n\n```csharp\nusing System;\n\nclass Program\n{\n  static void Main()\n\
  \  {\n      Employee.NextId = 1000000;                                         \
  \               \n      Employee employee1 = new Employee(\n          \"Inigo\"\
  , \"Montoya\");\n      Employee employee2 = new Employee(\n          \"Princess\"\
  , \"Buttercup\");\n      Console.WriteLine(\n          \"{0} {1} ({2})\",\n    \
  \      employee1.FirstName,\n          employee1.LastName,\n          employee1.Id);\n\
  \      Console.WriteLine(\n          \"{0} {1} ({2})\",\n          employee2.FirstName,\n\
  \          employee2.LastName,\n          employee2.Id);\n      Console.WriteLine(\
  \                                                                 \n          $\"\
  NextId = { Employee.NextId }\");                                              \n\
  \  }\n  // ...\n}\n```\n\n输出 6.8 显示了列表 6.41 的运行。\n\n### 输出 6.8\n\n点击此处查看代码图像\n\n\
  ```\nInigo Montoya (1000000)\nPrincess Buttercup (1000001)\nNextId = 1000002\n```\n\
  \n要设置和检索 `NextId` 静态字段的初始值，你使用类名 `Employee`，而不是该类型的实例的引用。唯一可以省略类名的地方是类内部（或派生类内部）。换句话说，`Employee(...)`\
  \ 构造函数不需要使用 `Employee.NextId`，因为代码出现在 `Employee` 类本身的语文中，因此，该语境已经被自动理解了。变量的作用域是可以通过其未限定名称引用的程序文本；静态字段的作用域是该类（以及任何派生类）的文本。\n\
  \n尽管你访问静态字段的方式与访问实例字段的方式略有不同，但在同一个类中无法定义同名的静态字段和实例字段。由于误引用错误字段的可能性很高，因此 C# 的设计者决定防止此类代码的出现。因此，名称重叠会在声明空间内引入冲突。\n\
  \n### 静态方法\n\n与静态字段一样，你直接通过类名访问静态方法——例如，通过 `Console.ReadLine()`。此外，不需要实例即可访问该方法。\n\
  \n列表 6.42 提供了另一个关于如何声明和调用静态方法的示例。\n\n### 列表 6.42：在 `DirectoryInfoExtension` 上定义静态方法\n\
  \n点击此处查看代码图像\n\n```csharp\npublic static class DirectoryInfoExtension\n{\n  public\
  \ static void CopyTo(                                                          \n\
  \      DirectoryInfo sourceDirectory, string target,                           \
  \        \n      SearchOption option, string searchPattern)                    \
  \                  \n  {\n      if (target[target.Length - 1] !=\n            Path.DirectorySeparatorChar)\n\
  \      {\n          target += Path.DirectorySeparatorChar;\n      }\n      if (!Directory.Exists(target))\n\
  \      {\n          Directory.CreateDirectory(target);\n      }\n      for (int\
  \ i = 0; i < searchPattern.Length; i++)\n      {\n          foreach (string file\
  \ in\n              Directory.GetFiles(\n                  sourceDirectory.FullName,\
  \ searchPattern))\n          {\n              File.Copy(file,\n                \
  \  target + Path.GetFileName(file), true);\n          }\n      }\n      // 拷贝子目录（递归）\n\
  \      if (option == SearchOption.AllDirectories)\n      {\n          foreach(string\
  \ element in\n              Directory.GetDirectories(\n                  sourceDirectory.FullName))\n\
  \          {\n              Copy(element,\n                  target + Path.GetFileName(element),\n\
  \                  searchPattern);\n          }\n      }\n  }\n}\n  // ...\n  DirectoryInfo\
  \ directory = new DirectoryInfo(\".\\\\Source\");\n  directory.MoveTo(\".\\\\Root\"\
  );\n  DirectoryInfoExtension.CopyTo(                                           \
  \  \n      directory, \".\\\\Target\",                                         \
  \       \n      SearchOption.AllDirectories, \"*\");                           \
  \          \n  // ...\n```\n\n在列表 6.42 中，`DirectoryInfoExtension.CopyTo()` 方法接收一个\
  \ `DirectoryInfo` 对象并将底层目录结构拷贝到新位置。\n\n由于静态方法不是通过特定实例引用的，因此 `this` 关键字在静态方法内部是无效的。此外，在没有特定实例引用的情况下，无法从静态方法内部直接访问实例字段或实例方法。\n\
  \n### 静态构造函数\n\n除了静态字段和方法外，C# 还支持静态构造函数。静态构造函数用于初始化类本身而不是类的实例。静态构造函数不会被显式调用；相反，运行时会在首次访问类（通过调用普通构造函数或访问静态方法或字段）时自动调用静态构造函数。由于静态构造函数无法显式调用，因此不允许带有参数。\n\
  \n你使用静态构造函数将类中的静态数据初始化为特定值，通常当初始值比声明时的简单赋值更复杂时。请考虑列表 6.43。\n\n### 列表 6.43：声明静态构造函数\n\
  \n点击此处查看代码图像\n\n```csharp\npublic class Employee\n{\n  static Employee()\n  {\n\
  \      Random randomGenerator = new Random();\n      NextId = randomGenerator.Next(101,\
  \ 999);\n  }\n  // ...\n  public static int NextId = 42;\n  // ...\n}\n```\n\n列表\
  \ 6.43 将 `NextId` 的初始值赋值为 100 到 999 之间的随机整数。由于初始值涉及方法调用，`NextId` 的初始化代码出现在静态构造函数中，而不是声明的一部分。\n\
  \n如果 `NextId` 的赋值同时在静态构造函数和声明中发生，那么初始化完成后值是不言而易见的。C# 编译器会生成 CIL，将声明赋值移动到静态构造函数内的第一个语句。因此，`NextId`\
  \ 将包含 `randomGenerator.Next(101, 999)` 返回的值，而不是声明期间赋值的值。因此，静态构造函数中的赋值将优先于字段声明部分的赋值，这与实例字段的情况相同。注意，不支持定义静态终结器。\n\
  \n\n\n\n\n注意不要在静态构造函数中抛出异常，因为会导致该类型在应用程序的生命周期内变得无法使用。\n\n[9.] 技术上讲，应用程序域的生命周期——即公共语言运行时（CLR）中等同于操作系统的进程。\n\
  \n`Begin 2.0`\n\n### 静态属性\n\n你也可以将属性声明为静态。例如，列表 6.44 将下一个 ID 的数据封装在一个属性中。\n\n**列表\
  \ 6.44：声明静态属性**\n\n点击此处查看代码图像\n\n```cc\npublic class Employee\n\n{\n  // ...\n\n\
  \  public static int NextId                                                   \n\
  \  {                                                                          \n\
  \      get                                                                    \n\
  \      {                                                                      \n\
  \          return _NextId;                                                    \n\
  \      }                                                                      \n\
  \      private set                                                            \n\
  \      {                                                                      \n\
  \          _NextId = value;                                                   \n\
  \      }                                                                      \n\
  \  }                                                                          \n\
  \  public static int _NextId = 42;                                            \n\
  \  // ...\n}\n```\n\n使用静态属性比使用公共静态字段几乎总是更好的，因为公共静态字段可以从任何地方被调用，而静态属性至少提供了某种程度的封装。\n\
  \n`Begin 6.0`\n\n在 C# 6.0 中，整个 `NextId` 实现——包括一个不可访问的备用字段——可以简化为带有初始化器的自动实现属性：\n\
  \n`End 6.0`\n\n点击此处查看代码图像\n\n```csharp\npublic static int NextId { get; private\
  \ set; } = 42;\n```\n\n### 静态类\n\n某些类不包含任何实例字段。例如，考虑一个 `Math` 类，它拥有对应于数学操作 `Max()`\
  \ 和 `Min()` 的函数，如列表 6.45 所示。\n\n**列表 6.45：声明静态类**\n\n点击此处查看代码图像\n\n```csharp\n//\
  \ 静态类在 C# 2.0 中引入\n\npublic static class SimpleMath       \n{\n  // params 允许参数数量变化\n\
  \  public static int Max(params int[] numbers)\n  {\n      // 检查 numbers 中是否至少有一个项\n\
  \      if(numbers.Length == 0)\n      {\n          throw new ArgumentException(\n\
  \              \"numbers cannot be empty\", \"numbers\");\n      }\n      int result;\n\
  \      result = numbers[0];\n      foreach (int number in numbers)\n      {\n  \
  \        if(number > result)\n          {\n              result = number;\n    \
  \      }\n      }\n      return result;\n  }\n  // params 允许参数数量变化\n  public static\
  \ int Min(params int[] numbers)\n  {\n      // 检查 numbers 中是否至少有一个项\n      if(numbers.Length\
  \ == 0)\n      {\n          throw new ArgumentException(\n              \"numbers\
  \ cannot be empty\", \"numbers\");\n      }\n      int result;\n      result = numbers[0];\n\
  \      foreach (int number in numbers)\n      {\n          if(number < result)\n\
  \          {\n              result = number;\n          }\n      }\n      return\
  \ result;\n  }\n}\n\npublic class Program\n{\n  public static void Main(string[]\
  \ args)\n  {\n      int[] numbers = new int[args.Length];\n      for (int count\
  \ = 0; count < args.Length; count++)\n      {\n          numbers[count] = args[count].Length;\n\
  \      }\n      Console.WriteLine(\n          $@\"Longest argument length = {\n\
  \              SimpleMath.Max(numbers) }\");\n      Console.WriteLine(\n       \
  \   $@\"Shortest argument length = {\n              SimpleMath.Min(numbers) }\"\
  );\n  }\n}\n```\n\n`End 2.0`\n\n此类没有包含任何实例字段（或方法），因此创建这样的类是没有意义的。因此，该类使用了 `static`\
  \ 关键字。类上的 `static` 关键字有两个好处。首先，它防止程序员编写实例化 `SimpleMath` 类的代码。其次，它防止在类内部声明任何实例字段或方法。因为类无法被实例化，实例成员将是徒的。之前列表中的\
  \ `Program` 类也是静态类的另一个良好候选，因为它也只包含静态成员。\n\n静态类的另一个不同特征是 C# 编译器会自动在 CIL 中将其标记为 `abstract`\
  \ 和 `sealed`。这把该类指定为**不可扩展的**；换句话说，没有类可以从该类派生，甚至无法实例化它。\n\n`Begin 3.0`Begin 6.0`\n\
  \n在第 5 章中，我们看到 `using static` 指令可用于 `SimpleMath` 等静态类。例如，在列表 6.45 顶部添加 `using static\
  \ SimpleMath;` 声明将允许你在没有 `SimpleMath` 前缀的情况下调用 `Max`：\n\n点击此处查看代码图像\n\n```csharp\n\
  Console.WriteLine(\n          $@\"Longest argument length = { Max(numbers) }\");\n\
  ```\n\n`End 6.0`\n\n### 扩展方法\n\n考虑 `System.IO.DirectoryInfo` 类，它用于操作目录。该类支持列出文件和子目录的功能（`DirectoryInfo.GetFiles()`），以及移动目录的能力（`DirectoryInfo.Move()`）。它不直接支持的一个功能是复制功能。如果你需要这样的方法，就必须手动实现，如之前在列表\
  \ 6.42 中所示。\n\n`DirectoryInfoExtension.CopyTo()` 方法是一个标准的静态方法。但注意，调用此 `CopyTo()`\
  \ 方法与调用 `DirectoryInfo.Move()` 方法不同。这很遗憾。理想情况下，我们希望为 `DirectoryInfo` 添加一个方法，这样给定一个实例，我们可以作为实例方法调用\
  \ `CopyTo()`：`directory.CopyTo()`。\n\nC#3.0 通过**扩展方法**模拟了在不同类上创建实例方法。要做到这一点，我们只需更改静态方法的签名，使得第一个参数——即我们正在扩展的数据类型——以前\
  \ `this` 关键字缀（参见列表 6.46）。\n\n**列表 6.46：DirectoryInfoExtension 的静态复制方法**\n\n点击此处查看代码图像\n\
  \n```csharp\npublic static class DirectoryInfoExtension\n{\n  public static void\
  \ CopyTo(\n      this DirectoryInfo sourceDirectory, string target,\n      SearchOption\
  \ option, string searchPattern)\n  {\n      // ...\n  }\n}\n\n  // ...\n\n     \
  \ DirectoryInfo directory = new DirectoryInfo(\".\\\\Source\");\n\n      directory.CopyTo(\"\
  .\\\\Target\",                                           \n          SearchOption.AllDirectories,\
  \ \"*\");                                  \n```\n\n通过扩展方法现在可以为任何类添加“实例方法”，包括程序集外的类。然而，生成的\
  \ CIL 代码与编译器作为普通静态方法调用扩展方法时创建的代码是相同的。\n\n扩展方法的要求如下：\n\n*   第一个参数对应于要扩展或在其上的类型。\n\
  *   要指定扩展方法，要在第一个参数前加上 `this` 修饰符。\n\n\n\n\n\n- 若要以扩展方法的形式访问该方法，请通过 `using` 指令导入扩展类型的命名空间（或将扩展类置于调用代码相同的命名空间中）。\n\
  \n如果扩展方法的签名与被扩展类型上已有的签名相匹配（例如，如果 `DirectoryInfo` 上已经存在 `CopyTo()`），则该扩展方法将永远不会被调用，除非作为普通的静态方法被调用。\n\
  \n请注意，通过继承来特化类型（在第 7 章中有详细介绍）通常比使用扩展方法更优。扩展方法没有提供整洁的版本控制机制，因为在扩展类型中添加匹配的签名将优先于扩展方法，且不会对此类更改发出警告。对于那些你无法控制源代码的扩展类来说，这种行为的细微之处会更加明显。另一个次要的一点是，尽管开发\
  \ IDE 支持扩展方法的 IntelliSense，但仅通过阅读调用代码并不能一眼看出某个方法是扩展方法。\n\n总的来说，你应该节制地使用扩展方法。例如，不要在\
  \ `object` 类型上定义它们。第 8 章讨论了如何结合接口来使用扩展方法。在没有此类关联的情况下，定义扩展方法是非常少见的。\n\n`结束 3.0`\n\
  \n### 封装数据\n\n除了在本节早期检查的属性和访问修饰符外，还有其他几种特殊方式可以封装类中的数据。例如，还有两种字段修饰符。第一个是 `const`\
  \ 修饰符，你在声明局部变量时遇到过它。第二个是将字段定义为只读的能力。\n\n#### `const`\n\n与 `const` 值一样，`const` 字段包含一个编译时确定的值，该值在运行时无法更改。像\
  \ `pi` 这样的值是常量字段定义的良好候选。列表 6.47 显示了声明 `const` 字段的示例。\n\n**列表 6.47：声明常量字段**\n\n点击此处代码图像\n\
  \n```\nclass ConvertUnits\n{\n\n   public const float CentimetersPerInch = 2.54F;\n\
  \n   public const int CupsPerGallon = 16;\n\n   // ...\n\n}\n```\n\n常量字段自动是静态的，因为每个对象实例都不需要新的字段实例。显式地将常量字段声明为\
  \ `static` 将导致编译错误。此外，常量字段通常只为具有字面量值的类型声明（例如 `string`、`int` 和 `double`）。`Program`\
  \ 或 `System.Guid` 等类型不能用于常量字段。\n\n`public` 常量表达式中使用的值类型在时间上是永久的，这一点非常重要。像 `pi`、`阿伏加德常数`和地球周长都是很好的例子。然而，可能随时间改变的值则不是。例如，人口数量、最贫穷的国家和汇率都是作为常量的糟糕选择。\n\
  \n#### `readonly`\n\n与 `const` 不同，`readonly` 修饰符仅适用于字段（不适用于局部变量）。它声明字段值仅能从构造函数内部或通过声明期间的初始化器进行修改。列表\
  \ 6.48 演示了如何声明只读字段。\n\n**列表 6.48：将字段声明为 `readonly`**\n\n点击此处代码图像\n\n```\npublic\
  \ class Employee\n{\n  public Employee(int id)\n  {\n      _Id = id;\n  }\n\n  //\
  \ ...\n\n  public readonly int _Id;                                            \n\
  \n  public int Id\n  {\n      get { return _Id; }\n  }\n\n  // Error：只读字段不能被赋值（除非\n\
  \n  // 在构造函数或变量初始化器中）\n\n  // public void SetId(int id) =>\n  //          _Id =\
  \ id;\n\n  // ...\n\n}\n```\n\n与常量字段不同，被 `readonly` 修饰的字段可以在不同实例之间发生变化。事实上，只读字段的值可以在构造函数内发生变化。此外，只读字段以实例字段或静态字段的形式存在。另一个关键区别是，你可以在运行时给只读字段赋值，而不仅仅是在编译时赋值。鉴于只读字段必须在构造函数或初始化器中设置，此类字段是编译器要求从相应属性之外的代码中访问字段的唯一情况。除了这一个异常，你应该避免从其包装属性的任何地方访问备份字段。\n\
  \n另一个优于 `const` 字段的 `readonly` 修饰字段的属性特性是，只读字段不仅限于具有字面量值的类型。例如，可以声明一个 `readonly\
  \ System.Guid` 实例字段：\n\n点击此处代码图像\n\n```\npublic static readonly Guid ComIUnknownGuid\
  \ =\n      new Guid(\"00000000-0000-0000-C000-000000000046\");\n```\n\n相比之下，使用常量是不可能的，因为\
  \ C# 中没有 GUID 的字面量表示。\n\n`开始 6.0`\n\n根据“字段不应从其包装属性外部访问”的准则，在 C# 6.0（或更高版本）世界中编程的人将发现，几乎从不需要使用\
  \ `readonly` 修饰符。相反，更优的方法像在本节早些讨论的那样，使用只读自动实现属性。\n\n列表 6.49 显示了另一个只读示例。\n\n**列表\
  \ 6.49：声明只读自动实现属性**\n\n点击此处代码图像\n\n```\nclass TicTacToeBoard\n{\n   // 将两个玩家的移动都设为\
  \ false（空白）\n   //    |   |\n   // ---+---+---\n   //    |   |\n   // ---+---+---\n\
  \   //    |   |\n      public bool[,,] Cells { get; } = new bool[2, 3, 3];     \
  \                         \n   // Error：属性 Cells 不能\n   // 被赋值，因为它是只读的\n   // public\
  \ void SetCells(bool[,,] value) =>\n   //          Cells = new bool[2, 3, 3];\n\
  \  // ...\n\n}\n```\n\n无论是使用 C# 6.0 只读自动实现属性还是对字段使用 `readonly` 修饰符，确保数组的不可变性都是非常有用的防御性编码技术。它确保数组实例保持不变，同时允许数组内的元素发生变化。如果没有只读约束，很容易错误地将新数组赋值给成员，从而丢弃了现有数组而不是更新单个数组元素。换句话说，对数组使用只读方法并没有冻结数组的内容。相反，它冻结了数组实例（因此冻结了数组元素），因为无法重新赋值新实例。数组的元素仍然是可写的。\n\
  \n`结束 6.0`\n\n### 嵌套类……（继续）……当一个类在其包含类的上下文中意义不大时，你就使用嵌套类。\n\n考虑一个处理程序命令行选项的类。此类类通常对每个程序都是唯一的，因此没有理由让包含\
  \ `Main()` 的类的外部访问 `CommandLine` 类。列表 6.50 演示了这样一个嵌套类。\n\n**列表 6.50：定义嵌套类**\n\n\
  点击此处代码图像\n\n\n\n\n\n```cs\n// CommandLine is nested within Program\n\nclass Program\
  \                                                                              \
  \             \n\n{                                                            \
  \                                           \n  // Define a nested class for processing\
  \ the command line                                              \n  private class\
  \ CommandLine                                                                  \
  \           \n  {                                                              \
  \                                       \n      public CommandLine(string[] arguments)\n\
  \      {\n          for(int argumentCounter=0;\n              argumentCounter<arguments.Length;\n\
  \              argumentCounter++)\n          {\n              switch (argumentCounter)\n\
  \              {\n                  case 0:\n                      Action = arguments[0].ToLower();\n\
  \                      break;\n                  case 1:\n                     \
  \ Id = arguments[1];\n                      break;\n                  case 2:\n\
  \                      FirstName = arguments[2];\n                      break;\n\
  \                  case 3:\n                      LastName = arguments[3];\n   \
  \                   break;\n              }\n          }\n      }\n      public\
  \ string? Action { get; };\n      public string? Id { get; };\n      public string?\
  \ FirstName { get; };\n      public string? LastName { get; };\n  }\n  static void\
  \ Main(string[] args)\n  {\n    CommandLine commandLine = new CommandLine(args);\
  \                                                          \n    switch (commandLine.Action)\n\
  \    {\n        case \"new\":\n            // Create a new employee\n          \
  \  // ...\n            break;\n        case \"update\":\n            // Update an\
  \ existing employee's data\n            // ...\n            break;\n        case\
  \ \"delete\":\n            // Remove an existing employee's file\n            //\
  \ ...\n            break;\n        default:\n            Console.WriteLine(\n  \
  \              \"Employee.exe \" +\n         \"new|update|delete <id> [firstname]\
  \ [lastname]\");\n            break;\n    }\n  }\n}\n```\n\n此示例中的嵌套类是 `Program.CommandLine`。与所有类成员一样，在包含类内部不需要指定包含类的标识符，因此你可以简单地将其引用为\
  \ `CommandLine`。\n\n嵌套类的一个独特特性是允许将 `private` 指定为类本身的访问修饰符。由于该类的目的是解析命令行并将每个参数存放在单独字段中，`Program.CommandLine`\
  \ 在此应用程序中仅与 `Program` 类相关。使用 `private` 访问修饰符定义了类预期的访问权限，并防止了从类外部访问。只有当类是嵌套类时才能这样操作。\n\
  \n嵌套类内部的 `this` 成员指向嵌套类的实例，而不是包含类的实例。嵌套类访问包含类实例的一种方法是显式地传递包含类实例，例如通过构造函数或方法参数。\n\
  \n嵌套类的另一个有趣特性是，它们可以访问包含类上的任何成员，包括私有成员。然而，反过来则不成立：包含类无法访问嵌套类的私有成员。\n\n嵌套类非常罕见。如果嵌套类可能在包含类型之外被引用，则不应该定义它们。此外，对待\
  \ `public` 嵌套类要保持谨慎态度；它们可能表明代码质量不佳，可能会导致混淆且难以发现。\n\n`开始 2.0`\n\n### 部分类 (Partial\
  \ Classes)\n\n`部分类`^(10) 是类的一个部分，编译器可以将它们组合成一个完整的类。虽然你可以在同一个文件中定义两个或多个部分类，但部分类的通用用途是允许将类定义拆分到多个文件中。这主要对于生成或修改代码的工具特别有用。通过部分类，工具可以在与开发者手动编写的代码不同的文件中进行工作。\n\
  \n10. 在 C# 2.0 中引入。\n\n#### 定义部分类\n\nC# 允许通过在 `class` 之前直接加上上下文关键字 `partial` 来声明部分类，如\
  \ 列表 6.51 所示。\n\n**列表 6.51：定义部分类**\n\n点击此处查看代码图像\n\n```cs\n// File: Program1.cs\n\
  \npartial class Program\n\n{\n\n}\n\n// File: Program2.cs\n\npartial class Program\n\
  \n{\n\n}\n```\n\n在这种情况下，`Program` 的每个部分都被放置在单独的文件中，如注释所示。\n\n除了与代码生成器配合外，部分类的另一个常见用途是将任何嵌套类置于它们自己的文件中。这符合将每个类定义置于单独文件中的编码规范。例如，列表\
  \ 6.52 将 `Program.CommandLine` 类置于与核心 `Program` 成员不同的文件中。\n\n**列表 6.52：在单独的部分类中定义嵌套类**\n\
  \n点击此处查看代码图像\n\n```cs\n// File: Program.cs\n\npartial class Program\n\n{\n\n  static\
  \ void Main(string[] args)\n  {\n    CommandLine commandLine = new CommandLine(args);\n\
  \n    switch (commandLine.Action)\n    {\n       // ...\n    }\n  }\n}\n\n// File:\
  \ Program+CommandLine.cs\n\npartial class Program\n\n{\n  // 定义一个嵌套类来处理命令行\n\n \
  \ private class CommandLine\n\n  {\n     // ...\n  }\n}\n```\n\n`结束 2.0`\n\n部分类不允许扩展已编译的类或其他程序集中的类。它们仅仅是在同一个程序集内跨多个文件拆分类实现的一种。\n\
  \n`开始 3.0`\n\n#### 部分方法 (Partial Methods)\n\n部分类概念的扩展是`部分方法`^(11)，它们只在部分类内部允许。与部分类一样，其主要目的是为了适应代码生成。\n\
  \n11. 在 C# 3.0 中引入。\n\n考虑一种代码生成工具，根据数据库中的 `Person` 表为 `Person` 类生成 `Person.Designer.cs`\
  \ 文件。该工具检查表并为表的每列创建属性。然而，问题在于，通常无法生成可能所需的验证逻辑，因为这些逻辑基于未嵌入数据库表的业务规则。为了克服这一困难，`Person`\
  \ 类的开发者需要添加验证逻辑。直接修改 `Person.Designer.cs` 是不可取的，因为如果重新生成文件（例如为了适应额外的列），更改将会丢失。相反，需要将\
  \ `Person` 的代码结构分离，以便生成的代码出现在一个文件中，而自定义代码（带有业务规则）被放在另一个单独的文件，不受重新生成的影响。正如我们在上一节中看到的，部分类非常适合将类拆分到多个文件的任务，但它们并不总是足够。许多情况下，我们还需要部分方法。\n\
  \n部分方法允许声明方法而不需要实现。然而，如果包含了可选实现，可以在一个部分类定义中找到——通常在单独的文件中。列表 6.53 显示了 `Person` 类的部分方法声明及其实现。\n\
  \n**列表 6.53：定义部分方法以访问其实现**\n\n点击此处查看代码图像\n\n\n\n\n```cs\n// File: Person.Designer.cs\n\
  \npublic partial class Person\n{\n    #region Extensibility Method Definitions\n\
  \n    partial void OnLastNameChanging(string value);                           \
  \         \n    partial void OnFirstNameChanging(string value);                \
  \                   \n    #endregion\n\n    // ...\n\n    public string LastName\n\
  \    {\n        get\n        {\n            return _LastName;\n        }\n     \
  \   set\n        {\n            if (_LastName != value)\n            {\n       \
  \         OnLastNameChanging(value);                                           \
  \ \n                _LastName = value;\n            }\n        }\n    }\n\n    private\
  \ string _LastName;\n\n    // ...\n\n    public string FirstName\n    {\n      \
  \  get\n        {\n            return _FirstName;\n        }\n        set\n    \
  \    {\n            if (_FirstName != value)\n            {\n                OnFirstNameChanging(value);\
  \                                              \n                _FirstName = value;\n\
  \            }\n        }\n    }\n\n    private string _FirstName;\n}\n\n// File:\
  \ Person.cs\n\npartial class Person\n{\n  partial void OnLastNameChanging(string\
  \ value)\n  {\n      if (value is null)\n      {\n          throw new ArgumentNullException(nameof(value));\n\
  \      }\n      if(value.Trim().Length == 0)\n      {\n          throw new ArgumentException(\n\
  \              \"LastName cannot be empty.\",\n              nameof(value));\n \
  \     }\n  }\n}\n```\n\n在 `Person.Designer.cs` 列表中，包含了 `OnLastNameChanging()` 和\
  \ `OnFirstNameChanging()` 方法的声明。此外，姓和名的属性会调用它们对应的更改方法。尽管这些更改方法的声明没有包含实现，这段代码也能成功编译。关键在于，方法声明的前缀带有上下文关键字\
  \ `partial`，此外，包含这些方法的类也是如此。\n\n在 列表 6.53 中，只实现了 `OnLastNameChanging()` 方法。在这种情况下，实现部分会检查建议的新\
  \ `LastName` 值，如果无效则抛出异常。注意，两个位置的 `OnLastNameChanging()` 签名是匹配的。\n\n部分方法必须返回 `void`。如果方法没有返回\
  \ `void` 且没有提供实现，那么调用未实现方法的预期返回是什么？为了避免对返回进行任何无效假设，C# 设计者决定禁止除 `void` 以外的返回方法。同样，部分方法不允许\
  \ `out` 参数。如果需要返回值，可以使用 `ref` 参数。\n\n`End 3.0`\n\n总结来说，部分方法允许生成代码调用不一定已实现的方法。此外，如果没有为部分方法提供实现，则\
  \ CIL 中不会出现该部分方法的痕迹。这有助于在保持高灵活性的同时保持代码体积较小。\n\n### 总结\n\n本章解释了 C# 中用于类和面向对象的构造结构。其范围包括了对声明字段以及如何在类实例上访问字段的讨论。\n\
  \n本章还讨论了是按实例存储数据还是跨类型的所有实例存储数据的关键决策。静态数据与类关联，而实例数据存储在每个对象上。\n\n此外，本章探讨了在方法和数据的访问修饰符背景下的封装。引入了\
  \ C# 的属性构造结构，你了解了如何使用它来封装私有字段。\n\n下一章重点关注如何通过继承将类相互关联，并探索了这种面向对象构造结构带来的益处。\n\n##\
  \ 7. 继承\n\n第 6 章 讨论了一个类如何通过字段和属性引用其他类。本章讨论了如何使用类之间的继承关系来构建形成“是一个”（is a）关系的类层次结构。\n\
  \n![继承提供了五种属性属性：派生；重写；抽象类；system.object；模式匹配。派生包括类型转换、protected、单继承和密封类。重写包括 virtual、new\
  \ 和 sealed。](img/07mindmap.jpg)\n\n### 派生\n\n通常我们想要扩展给定的类型以添加功能，例如行为和数据。继承的目的恰恰是这样。给定一个\
  \ `Person` 类，你创建一个 `Employee` 类，该类额外包含了 `EmployeeId` 和 `Department` 属性。反向方法也可以应用。例如，给定个人数字助器\
  \ (PDA) 中的一个 `Contact` 类，你可能决定添加日历支持。为了这一目标，你创建了一个 `Appointment` 类。然而，而不是重新定义两个类共有的方法和属性，你可能会选择\
  \ `refactor`（重构）`Contact` 类。具体来说，你可以将 `Contact` 的公共方法和属性移动到名为 `PdaItem` 的基类中，`Contact`\
  \ 和 `Appointment` 均从中派生，如图 7.1 所示。\n\n![继承提供了五种属性属性：派生；重写；抽象类；system.object；模式匹配。派生包括类型转换、protected、单继承和密封类。重写包括\
