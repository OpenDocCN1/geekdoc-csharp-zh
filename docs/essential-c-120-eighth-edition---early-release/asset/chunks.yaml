    \ followed by `ThenBy()` followed by `ThenByDescending()`) does involve additional\
    \ calls to the `keySelector` lambda expression of the earlier sorting calls. In\
    \ other words, a call to `OrderBy()` will call its corresponding `keySelector`\
    \ lambda expression once you iterate over the collection. Furthermore, a subsequent\
    \ call to `ThenBy()` will again make calls to `OrderBy()`’s `keySelector`.\n\n\
    **Guidelines**\n\n**DO NOT call an `OrderBy()` following a prior `OrderBy()` method\
    \ call. Use `ThenBy()` to sequence items by more than one value.**\n\n**Beginner\
    \ Topic: Join Operations**\n\nConsider two collections of objects as shown in\
    \ the Venn diagram in [FIGURE 15.3](#ch15.html_ch15fig03). The left circle in\
    \ the diagram includes all inventors, and the right circle contains all patents.\
    \ The intersection includes both inventors and patents, and a line is formed for\
    \ each case where there is a match of inventors to patents. As the diagram shows,\
    \ each inventor may have multiple patents and each patent can have one or more\
    \ inventors. Each patent has an inventor, but in some cases, inventors do not\
    \ yet have patents.\n\n![Images](graphics/15fig03.jpg)\n\n**FIGURE 15.3: Venn\
    \ diagram of inventor and patent collections**\n\nMatching up inventors within\
    \ the intersection to patents is an **inner join**. The result is a collection\
    \ of inventor/patent pairs in which both patents and inventions exist for a pair.\
    \ A **left outer join** includes all the items within the left circle regardless\
    \ of whether they have a corresponding patent. In this particular example, a **right\
    \ outer join** would be the same as an inner join because there are no patents\
    \ without inventors. Furthermore, the designation of left versus right is arbitrary,\
    \ so there is really no distinction between left and outer joins. A **full outer\
    \ join**, however, would include records from both outer sides; it is relatively\
    \ rare to perform a full outer join.\n\nAnother important characteristic in the\
    \ relationship between inventors and patents is that it is a **many-to-many**\
    \ relationship. Each individual patent can have one or more inventors (e.g., the\
    \ flying machine’s invention by both Orville and Wilbur Wright). Furthermore,\
    \ each inventor can have one or more patents (e.g., Benjamin Franklin’s invention\
    \ of both bifocals and the phonograph).\n\nAnother common relationship is a **one-to-many**\
    \ relationship. For example, a company department may have many employees. However,\
    \ each employee can belong to only one department at a time. (However, as is common\
    \ with one-to-many relationships, adding the factor of time can transform them\
    \ into many-to-many relationships. A particular employee may move from one department\
    \ to another so that, over time, she could potentially be associated with multiple\
    \ departments, making another many-to-many relationship.)\n\n[LISTING 15.18](#ch15.html_list15_18)\
    \ provides a sample listing of employee and department data, and [OUTPUT 15.6](#ch15.html_op15_6)\
    \ shows the results.\n\n**LISTING 15.18: Sample Employee and Department Data**\n\
    \n```\npublic class Program\n{\n    public static void Main()\n    {\n       \
    \ IEnumerable<Department> departments =\n            CorporateData.Departments;\n\
    \        Print(departments);\n\n        Console.WriteLine();\n\n        IEnumerable<Employee>\
    \ employees =\n            CorporateData.Employees;\n        Print(employees);\n\
    \    }\n\n    private static void Print<T>(IEnumerable<T> items)\n    {\n    \
    \    foreach(T item in items)\n        {\n            Console.WriteLine(item);\n\
    \        }\n    }\n}\n```\n\n**OUTPUT 15.6**\n\n```\nCorporate\nHuman Resources\n\
    Engineering\nInformation Technology\nPhilanthropy\nMarketing\n\nMark Michaelis\
    \ (Chief Computer Nerd)\nMichael Stokesbary (Senior Computer Wizard)\nBrian Jones\
    \ (Enterprise Integration Guru)\nAnne Beard (HR Director)\nPat Dever (Enterprise\
    \ Architect)\nKevin Bost (Programmer Extraordinaire)\nThomas Heavey (Software\
    \ Architect)\nEric Edmonds (Philanthropy Coordinator)\n```\n\nWe use this data\
    \ in the example in the following section on joining data.\n\n#### Performing\
    \ an Inner Join with `Join()`\n\nIn the world of objects on the client side, relationships\
    \ between objects are generally already set up. For example, the relationship\
    \ between files and the directories in which they reside are preestablished with\
    \ the `DirectoryInfo.GetFiles()` method and the `FileInfo.Directory` method, respectively.\
    \ Frequently, however, this is not the case with data being loaded from nonobject\
    \ stores. Instead, the data needs to be joined together so that you can navigate\
    \ from one type of object to the next in a way that makes sense for the data.\n\
    \nConsider the example of employees and company departments. In [LISTING 15.19](#ch15.html_list15_19),\
    \ we join each employee to his or her department and then list each employee with\
    \ his or her corresponding department. Since each employee belongs to only one\
    \ (and exactly one) department, the total number of items in the list is equal\
    \ to the total number of employees—each employee appears only once (each employee\
    \ is said to be **normalized**). [OUTPUT 15.7](#ch15.html_op15_7) shows the results.\n\
    \n**LISTING 15.19: An Inner Join Using `System.Linq.Enumerable.Join()`**\n\n```\n\
    using System;\nusing System.Collections.Generic;\nusing System.Linq;\n// ...\n\
    \        Department[] departments = CorporateData.Departments;\n        Employee[]\
    \ employees = CorporateData.Employees;\n\n        IEnumerable<(int Id, string\
    \ Name, string Title,\n            Department Department)> items =\n         \
    \   employees.Join(\n                departments,\n                employee =>\
    \ employee.DepartmentId,\n                department => department.Id,\n     \
    \           (employee, department) => (\n                    employee.Id,\n  \
    \                  employee.Name,\n                    employee.Title,\n     \
    \               department\n                ));\n\n        foreach ((int Id, string\
    \ Name, string Title, Department Departmen\nt) item in items)\n        {\n   \
    \         Console.WriteLine(\n                $\"{item.Name} ({item.Title})\"\
    );\n            Console.WriteLine(\"\\t\" + item.Department);\n        }\n   \
    \ }\n    //...\n```\n\n**OUTPUT 15.7**"
