    \ in the iterator object is used to determine where control must resume. When\
    \ the `foreach` statement at the call site terminates, the iterator’s state is\
    \ no longer saved.\n\nIt is always safe to call `GetEnumerator()` again; “fresh”\
    \ enumerator objects will be created when necessary.\n\n[FIGURE 17.8](#ch17.html_ch17fig08)\
    \ shows a high-level sequence diagram of what takes place. Remember that the `MoveNext()`\
    \ method appears on the `IEnumerator<T>` interface.\n\n![Images](graphics/17fig08.jpg)\n\
    \n**FIGURE 17.8: Sequence diagram with `yield return` application**"
