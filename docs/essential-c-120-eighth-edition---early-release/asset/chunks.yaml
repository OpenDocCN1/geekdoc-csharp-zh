  trans: "\n\n熟悉 SQL 的开发者会注意到，查询表达式的语法与 SQL 相似。这种设计是刻意为之——旨在让熟悉 SQL 的程序员能够轻松学习 LINQ。然而，它们之间存在明显的区别。大多数\
    \ SQL 丰富的开发者会注意到的第一个区别是，这里显示的 C# 查询表达式子句顺序如下：`from`、然后是 `where`、最后是 `select`。相应的\
    \ SQL 查询将 `SELECT` 子句放在第一个，随后是 `FROM` 子句，最后是 `WHERE` 子句。\n\n这种顺序变化的原因之一是为了启用 IntelliSense。这是\
    \ IDE 的一项功能，编辑器可以生成实用的用户界面元素，例如描述给定对象成员的下拉列表。由于 `from` 最先出现并将字符串数组 `Keywords`\
    \ 标识为数据源，代码编辑器可以推断出范围变量 `word` 的类型为 `string`。当你向编辑器中输入代码并输入 `word` 后面的点时，编辑器将只显示\
    \ `string` 的成员。\n\n如果 `from` 子句像 SQL 中那样出现在 `select` 之后，那么在你输入查询语句时，编辑器将不知道 `word`\
    \ 的数据类型是什么，因此无法显示 `word` 成员列表。例如，在 LISTING 16.1 中，无法预测 `Contains()` 是 `word` 的可能成员。\n\
    \nC# 查询表达式的顺序也更贴近逻辑执行操作的顺序。在评估查询时，你首先识别集合（由 `from` 子句描述），然后过滤掉不需要的项目（使用 `where`\
    \ 子句），最后描述所需的结果（使用 `select` 子句）。\n\n最后，C# 查询表达式的顺序确保了“where”（范围）变量的作用域规则在大多数情况下与局部变量的作用域规则保持一致。例如，（范围）变量必须在使用之前由某个子句（通常是\
    \ `from` 子句）声明，这就像局部变量在使用之前必须先声明一样。\n\n### 投影\n\n查询表达式的结果类型为 `IEnumerable<T>`\
    \ 或 `IQueryable<T>` 的集合。^(2) 实际类型 `T` 是从 `select` 或 `group by` 子句推断出的。在 LISTING\
    \ 16.1 中，编译器知道 `Keywords` 的类型为 `string[]`，它可以转换为 `IEnumerable<string>`，因此推断出 `word`\
    \ 的类型为 `string`。查询以 `select word` 结束，这意味着查询表达式的结果必须是字符串集合，因此查询表达式的类型是 `IEnumerable<string>`。\n\
    \n2. 从实际问题来说，查询表达式的结果几乎总是 `IEnumerable<T>` 或其派生类型。虽然有些反常，但创建一个返回其他类型的查询方法的实现是合法的；语言并没有要求查询表达式的结果必须转换为\
    \ `IEnumerable<T>`。\n\n在这种情况下，查询的“输入”和“输出”都是字符串集合。然而，如果 `select` 子句中的表达式是完全不同的类型，输出类型可能与输入类型完全不同。考虑\
    \ LISTING 16.2 中的查询表达式及其在 OUTPUT 16.2 中对应的输出。\n\n**LISTING 16.2: 使用查询表达式进行投影**\n\
    \n```\nusing System;\nusing System.Collections.Generic;\nusing System.IO;\nusing\
    \ System.Linq;\n// ...\n    public static void List1\n        (string rootDirectory,\
    \ string searchPattern)\n    {\n        IEnumerable<string> fileNames = Directory.GetFiles(\
    \           \n            rootDirectory, searchPattern);                     \
    \       \n\n        IEnumerable<FileInfo> fileInfos =                        \
    \     \n            from fileName in fileNames                               \
    \ \n            select new FileInfo(fileName);                            \n\n\
    \        foreach (FileInfo fileInfo in fileInfos)\n        {\n            Console.WriteLine(\n\
    \                $@\".{ fileInfo.Name } ({\n                    fileInfo.LastWriteTime\
    \ })\");\n        }\n    }\n    //...\n```\n\n**OUTPUT 16.2**\n\n```\nAccount.cs\
    \ (11/22/2011 11:56:11 AM)\nBill.cs (8/10/2011 9:33:55 PM)\nContact.cs (8/19/2011\
    \ 11:40:30 PM)\nCustomer.cs (11/17/2011 2:02:52 AM)\nEmployee.cs (8/17/2011 1:33:22\
    \ AM)\nPerson.cs (10/22/2011 10:00:03 PM)\n```\n\n该查询表达式的结果是一个 `IEnumerable<FileInfo>`，而不是\
    \ `Directory.GetFiles()` 返回的 `IEnumerable<string>` 数据类型。查询表达式的 `select` 子句可能会投影出一个与\
    \ `from` 子句表达式收集的不同的数据类型。\n\n在这个示例中，选择 `FileInfo` 类型是因为它包含了所需输出的两个相关字段：文件名和最后写入时间。如果你需要其他信息，可能没有这样方便的类型。元组^(3)\
    \ 提供了一种投影你所需的精确数据的方便方法，而无需创建显式类型。LISTING 16.3 提供了与 LISTING 16.2 类似的输出，但使用的是元组语法而非\
    \ `FileInfo`。\n\n3. C# 7.0 之前使用的匿名类型。\n\n**LISTING 16.3: 查询表达式中的元组**\n\n```\n\
    using System;\nusing System.IO;\nusing System.Linq;\n// ...\n    public static\
    \ void List2\n        (string rootDirectory, string searchPattern)\n    {\n  \
    \      var fileNames = Directory.EnumerateFiles(                           \n\
    \            rootDirectory, searchPattern);                                  \n\
    \        var fileResults =                                                   \n\
    \            from fileName in fileNames                                      \n\
    \            select                                                          \n\
    \            (                                                               \n\
    \                Name: fileName,                                             \n\
    \                LastWriteTime: File.GetLastWriteTime(fileName)              \n\
    \            );                                                              \n\
    \n        foreach (var fileResult in fileResults)\n        {\n            Console.WriteLine(\n\
    \                $@\"{ fileResult.Name } ({                                  \
    \ \n                    fileResult.LastWriteTime })\");                      \
    \    \n        }\n    }\n    //...\n```\n\n### 学者主题：查询表达式的延迟执行\n\n"
- fmt: "\nQueries written using query expression notation exhibit deferred execution,\
    \ just as the queries written in [Chapter 15](#ch15.html_ch15) did. Consider again\
    \ the assignment of a query object to variable `selection` in [LISTING 16.1](#ch16.html_list16_1).\
    \ The creation of the query and the assignment to the variable do not execute\
    \ the query; rather, they simply build an object that represents the query. The\
    \ method `word.Contains(\"*\")` is not called when the query object is created.\
    \ Instead, the query expression saves the selection criteria to be used when iterating\
    \ over the collection identified by the `selection` variable.\n\nTo demonstrate\
    \ this point, consider [LISTING 16.4](#ch16.html_list16_4) and the corresponding\
    \ output ([OUTPUT 16.3](#ch16.html_op16_3)).\n\n**LISTING 16.4: Deferred Execution\
    \ and Query Expressions (Example 1)**\n\n```\nusing System;\nusing System.Collections.Generic;\n\
    using System.Linq;\n// ...\n    private static void ShowContextualKeywords2()\n\
    \    {\n        IEnumerable<string> selection = from word in CSharp.Keywords\n\
    \                                        where IsKeyword(word)\n             \
    \                           select word;\n        Console.WriteLine(\"Query created.\"\
    );\n        foreach(string keyword in selection)\n        {\n            // No\
    \ space output here\n            Console.Write(keyword);\n        }\n    }\n\n\
    \    // The side effect of console output is included\n    // in the predicate\
    \ to demonstrate deferred execution;\n    // predicates with side effects are\
    \ a poor practice in\n    // production code\n    private static bool IsKeyword(string\
    \ word)\n    {\n        if(word.Contains('*'))\n        {\n            Console.Write(\"\
    \ \");\n            return true;\n        }\n        else\n        {\n       \
    \     return false;\n        }\n    }\n    //...\n```\n\n**OUTPUT 16.3**\n\n```\n\
    Query created.\n add* alias* ascending* async* await* by* descending* dynamic*\n\
    equals* from* get* global* group* into* join* let* nameof* nonnull*\non* orderby*\
    \ partial* remove* select* set* value* var* where* when* yiel\nd*\n```\n\nIn [LISTING\
    \ 16.4](#ch16.html_list16_4), no space is output within the `foreach` loop. The\
    \ side effect of printing a space when the predicate `IsKeyword()` is executed\
    \ happens when the query is iterated over—not when the query is created. Thus,\
    \ although `selection` is a collection (it is of type `IEnumerable<T>`, after\
    \ all), at the time of assignment everything following the `from` clause serves\
    \ as the selection criteria. Not until we begin to iterate over `selection` are\
    \ the criteria applied.\n\nNow consider a second example (see [LISTING 16.5](#ch16.html_list16_5)\
    \ and [OUTPUT 16.4](#ch16.html_op16_4)).\n\n**LISTING 16.5: Deferred Execution\
    \ and Query Expressions (Example 2)**\n\n```\nusing System;\nusing System.Collections.Generic;\n\
    using System.Linq;\n// ...\n    private static void CountContextualKeywords()\n\
    \    {\n        int delegateInvocations = 0;\n        string func(string text)\n\
    \        {\n            delegateInvocations++;\n            return text;\n   \
    \     }\n\n        IEnumerable<string> selection =\n            from keyword in\
    \ CSharp.Keywords\n            where keyword.Contains('*')\n            select\
    \ func(keyword);\n\n        Console.WriteLine(\n            $\"1\\. delegateInvocations={\
    \ delegateInvocations }\");\n\n        // Executing count should invoke func once\
    \ for\n        // each item selected\n        Console.WriteLine(\n           \
    \ $\"2\\. Contextual keyword count={ selection.Count() }\");\n\n        Console.WriteLine(\n\
    \            $\"3\\. delegateInvocations={ delegateInvocations }\");\n\n     \
    \   // Executing count should invoke func once for\n        // each item selected\n\
    \        Console.WriteLine(\n            $\"4\\. Contextual keyword count={ selection.Count()\
    \ }\");\n\n        Console.WriteLine(\n            $\"5\\. delegateInvocations={\
    \ delegateInvocations }\");\n\n        // Cache the value so future counts will\
    \ not trigger\n        // another invocation of the query\n        List<string>\
    \ selectionCache = selection.ToList();\n\n        Console.WriteLine(\n       \
    \     $\"6\\. delegateInvocations={ delegateInvocations }\");\n\n        // Retrieve\
    \ the count from the cached collection\n        Console.WriteLine(\n         \
    \   $\"7\\. selectionCache count={ selectionCache.Count }\");\n\n        Console.WriteLine(\n\
    \            $\"8\\. delegateInvocations={ delegateInvocations }\");\n    }\n\
    \    //...\n```\n\n**OUTPUT 16.4**\n\n```\n1\\. delegateInvocations=0\n2\\. Contextual\
    \ keyword count=28\n3\\. delegateInvocations=28\n4\\. Contextual keyword count=28\n\
    5\\. delegateInvocations=56\n6\\. delegateInvocations=84\n7\\. selectionCache\
    \ count=28\n8\\. delegateInvocations=84\n```\n\nRather than defining a separate\
    \ method, [LISTING 16.5](#ch16.html_list16_5) uses a statement lambda that counts\
    \ the number of times the method is called.\n\nTwo things in the output are remarkable.\
    \ First, after `selection` is assigned, `DelegateInvocations` remains at zero.\
    \ At the time of assignment to `selection`, no iteration over `Keywords` is performed.\
    \ If `Keywords` were a property, the property call would run at the time of assignment—in\
    \ other words, the `from` clause executes at the time of assignment. However,\
    \ neither the projection, nor the filtering, nor anything after the `from` clause\
    \ will execute until the code iterates the values within `selection`. It is as\
    \ though at the time of assignment, `selection` would more appropriately be called\
    \ “query.”\n\nOnce we call `ToList()`, however, a term such as `selection` or\
    \ `Items` or something that indicates a container is appropriate because we begin\
    \ to count the items within. In other words, the variable `selection` serves the\
    \ dual purpose of saving the query information and acting like a container from\
    \ which the data is retrieved.\n\nA second important characteristic of [OUTPUT\
    \ 16.4](#ch16.html_op16_4) is that calling `Count()` a second time causes `func`\
    \ to again be invoked on each item selected. Given that `selection` behaves both\
    \ as a query and as a collection, requesting the count requires that the query\
    \ be executed again by iterating over the `IEnumerable<string>` collection that\
    \ `selection` refers to. The C# compiler does not know whether anyone has modified\
    \ the strings in the array such that the count would now be different, so the\
    \ counting has to happen anew every time to ensure that the answer is correct\
    \ and up-to-date. Similarly, a `foreach` loop over `selection` would trigger `func`\
    \ to be called again for each item. The same is true of all the other extension\
    \ methods provided via `System.Linq.Enumerable`.\n\n### Advanced Topic: Implementing\
    \ Deferred Execution\n\nDeferred execution is implemented by using delegates and\
    \ expression trees. A delegate provides the ability to create and manipulate a\
    \ reference to a method that contains an expression that can be invoked later.\
    \ An expression tree similarly provides the ability to create and manipulate information\
    \ about an expression that can be examined and manipulated later.\n\nIn [LISTING\
    \ 16.5](#ch16.html_list16_5), the predicate expressions of the `where` clauses\
    \ and the projection expressions of the `select` clauses are transformed by the\
    \ compiler into expression lambdas, and then the lambdas are transformed into\
    \ delegate creations. The result of the query expression is an object that holds\
    \ references to these delegates. Only when the query results are iterated over\
    \ does the query object actually execute the delegates.\n\n#### Filtering\n"
