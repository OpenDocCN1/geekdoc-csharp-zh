  trans: "\n但如果元素类型没有实现 `IComparable<T>`，或者比较两个事物的默认逻辑不满足你的需求怎么办？要指定非默认的排序，你可以调用 `List<T>.Sort()`\
    \ 的重载方法，它接受一个 `IComparer<T>` 作为参数。\n\n`IComparable<T>` 和 `IComparer<T>` 之间的区别细微但很重要。第一个接口意味着：“我知道如何将*我自己*与同类型的另一个实例进行比较。”后者意味着：“我如何如何比较给定类型的*两个事物*。”\n\
    \n当对一个数据类型有许多不同的可能排序方式，且没有一种明显是最佳方式时，通常使用 `IComparer<T>` 接口。例如，你可能有一个 `Contact`\
    \ 对象的集合，有时你想按名称、位置、生日、地理区域或任何其他可能对其进行排序。与其选择一种排序策略并让 `Contact` 类实现 `IComparable<Contact>`，不如创建几个实现\
    \ `IComparer<Contact>` 的不同类可能更明智。LISTING 17.2 显示了 `LastName` 和 `FirstName` 比较的示例实现。\n\
    \n**LISTING 17.2: 实现 `IComparer<T>`**\n\n```csharp\nusing System;\nusing System.Collections.Generic;\n\
    // ...\npublic class Contact\n{\n    public string FirstName { get; private set;\
    \ }\n    public string LastName { get; private set; }\n\n    public Contact(string\
    \ firstName, string lastName)\n    {\n        this.FirstName = firstName;\n  \
    \      this.LastName = lastName;\n    }\n}\npublic class NameComparison : IComparer<Contact>\n\
    {\n    public int Compare(Contact? x, Contact? y)\n    {\n        if(Object.ReferenceEquals(x,\
    \ y))\n            return 0;\n        if(x == null)\n            return 1;\n \
    \       if(y == null)\n            return -1;\n        int result = StringCompare(x.LastName,\
    \ y.LastName);\n        if(result == 0)\n            result = StringCompare(x.FirstName,\
    \ y.FirstName);\n        return result;\n    }\n\n    private static int StringCompare(string?\
    \ x, string? y)\n    {\n        if(Object.ReferenceEquals(x, y))\n           \
    \ return 0;\n        if(x == null)\n            return 1;\n        if(y == null)\n\
    \            return -1;\n        return x.CompareTo(y);\n    }\n}\n```\n\n要按姓后后按名排序\
    \ `List<Contact>`，你可以调用 `contactList.Sort(new NameComparer())`。\n\n### 全序 (Total\
    \ Ordering)\n\n在实现 `IComparable<T>` 或 `IComparer<T>` 时，你需要产生一个**全序**（total order）。你对\
    \ `CompareTo` 的实现必须为任何可能的项对提供完全一致的顺序。这种排序要求具有一些基本特征。例如，每个元素都被要求认为与自己相等。如果元素 `X`\
    \ 被认为等于元素 `Y`，且元素 `Y` 被认为等于元素 `Z`，那么这三个元素 `X`、`Y` 和 `Z` 必须被认为相互相等。如果元素 `X` 被认为大于\
    \ `Y`，则 `Y` 必须认为小于 `X`。并且不能出现“传递性悖论”——也就是说，你不能出现 `X` 大于 `Y`、`Y` 大于 `Z` 且 `Z` 大于\
    \ `X` 的情况。如果你未能提供全序，排序算法的操作将未定义；它可能会产生疯狂的顺序，可能会导致崩溃，可能会进入无限循环等。\n\n注意，例如，LISTING\
    \ 17.2 中的比较器是如何确保全序的，即使参数是 `null` 引用。例如，说“如果任一元素为 `null`，则返回零”是不合法的，因为这样两个非空事物可能等于\
    \ `null` 但不互相相等。\n\n#### 指南\n\n**必须确保自定义比较逻辑产生一致的“全序”。**\n\n### 搜索 `List<T>`\n\
    \n为了在 `List<T>` 中搜索特定元素，你使用 `Contains()`、`IndexOf()`、`LastIndexOf()` 和 `BinarySearch()`\
    \ 方法。前三个方法从第一个元素（对于 `LastIndexOf()` 是最后一个元素）开始遍历数组，并检查每个元素直到找到所需的元素。这些算法的执行时间与在命中之前搜索的元素数量成正比。（注意，集合类并不要求集合内的所有元素都是唯一的。如果集合中的两个或多个元素相同，`IndexOf()`\
    \ 返回第一个索引，`LastIndexOf()` 返回最后一个索引。）\n\n`BinarySearch()` 使用快得多的二分查找算法，但要求元素是排序的。`BinarySearch()`\
    \ 方法的一个有用特性是，如果未找到元素，则返回一个负整数。该值的按位取反（`~`）是比搜索元素大的下一个元素的索引，如果没有更大的值，则为元素总数。这为在特定位置向列表插入新值以保持排序提供了一种方便的方法。LISTING\
    \ 17.3 提供了一个示例。\n\n**LISTING 17.3: 使用 `BinarySearch()` 结果的按位取反值**\n\n```csharp\n\
    using System;\nusing System.Collections.Generic;\n\npublic class Program\n{\n\
    \    public static void Main()\n    {\n        List<string> list = new List<string>();\n\
    \        list.Add(\"public\");\n        list.Add(\"protected\");\n        list.Add(\"\
    private\");\n\n        list.Sort();\n\n        int search = list.BinarySearch(\"\
    protected internal\");\n        if(search < 0)\n        {\n            list.Insert(~search,\
    \ \"protected internal\");\n        }\n\n        foreach (string item in list)\n\
    \        {\n            Console.WriteLine(item);\n        }\n    }\n}\n```\n\n\
    注意，如果列表没有经过排序，此代码将无法找到元素，即使它在列表中。LISTING 17.3 的结果出现在 OUTPUT 17.2。\n\n**OUTPUT\
    \ 17.2**\n\n```\nprivate\nprotected\npublic\n```\n\n### 高级主题：使用 `FindAll()` 查找多个项\n\
    \n有时你必须在列表中查找多个项，并且搜索标准比仅仅查找特定值复杂。为了支持这一点，`System.Collections.Generic.List<T>`\
    \ 包含一个 `FindAll()` 方法。`FindAll()` 接受 `Predicate<T>` 参数，这是一个方法的委托。LISTING 17.4\
    \ 显示了如何使用 `FindAll()` 方法。\n\n**LISTING 17.4: 演示 `FindAll()` 及其 Predicate 参数**\n\
    \n```csharp\nusing System;\nusing System.Collections.Generic;\n\npublic class\
    \ Program\n{\n    public static void Main()\n    {\n        List<int> list = new\
    \ List<int>();\n        list.Add(1);\n        list.Add(2);\n        list.Add(3);\n\
    \        list.Add(2);\n\n        List<int> results = list.FindAll(Even);     \
    \               \n\n        foreach (int number in results)                  \
    \          \n        {\n            Console.WriteLine(number);\n        }\n  \
    \  }\n    public static bool Even(int value) =>\n        (value % 2) == 0;\n}\n\
    ```\n\n在 LISTING 17.4 的 `FindAll()` 调用中，你传递了一个委托实例 `Even()`。该方法在整数参数值为偶数时返回 `true`。`FindAll()`\
    \ 接受该委托实例并对列表中的每个项调用 `Even()`。每当返回 `true` 时，它将其添加到一个新的 `List<T>` 实例中，并在检查列表中的每个项后返回该实例。关于委托的完整讨论出现在第\
    \ 13 章。\n\n2。此列表使用了 C# 2.0 的委托类型推断。\n\n#### 字典集合：`Dictionary<TKey, TValue>`\n"
- fmt: "\nAnother category of collection classes is the dictionary classes—specifically,\
    \ `Dictionary<TKey, TValue>` (see [FIGURE 17.3](#ch17.html_ch17fig03)). Unlike\
    \ the list collections, dictionary classes store name/value pairs. The name functions\
    \ as a unique key that can be used to look up the corresponding element in a manner\
    \ similar to that of using a primary key to access a record in a database. This\
    \ adds some complexity to the access of dictionary elements, but because lookups\
    \ by key are efficient operations, this is a useful collection. Note that the\
    \ key may be any data type, not just a string or a numeric value.\n\n![Images](graphics/17fig03.jpg)\n\
    \n**FIGURE 17.3: `Dictionary` class diagrams**\n\n## Inserting Elements\n\nOne\
    \ option for inserting elements into a dictionary is to use the `Add()` method,\
    \ passing both the key and the value as arguments, as shown in [LISTING 17.5](#ch17.html_list17_5).\n\
    \n**LISTING 17.5: Adding Items to a `Dictionary<TKey, TValue>`**\n\n```c\nusing\
    \ System;\nusing System.Collections.Generic;\n\npublic class Program\n{\n    public\
    \ static void Main()\n    {\n        var colorMap = new Dictionary<string, ConsoleColor>\n\
    \        {\n            [\"Error\"] = ConsoleColor.Red,\n            [\"Warning\"\
    ] = ConsoleColor.Yellow,\n            [\"Information\"] = ConsoleColor.Green\n\
    \        };\n        colorMap.Add(\"Verbose\", ConsoleColor.White);          \
    \            \n        // ...\n    }\n}\n```\n\nAfter initializing the dictionary\
    \ with a dictionary initializer^([3](#ch17.html_fn17_3)) (see the section “Collection\
    \ Initializers” in [Chapter 15](#ch15.html_ch15)), [LISTING 17.5](#ch17.html_list17_5)\
    \ inserts the string `a` `ConsoleColor of white for the key of \"Verbose\"`. If\
    \ an element with the same key has already been added, an exception is thrown.\n\
    \n[3](#ch17.html_fn17_3a). Starting with C# 6.0.\n\nAn alternative for adding\
    \ elements is to use the indexer, as shown in [LISTING 17.6](#ch17.html_list17_6).\n\
    \n**LISTING 17.6: Inserting Items in a `Dictionary<TKey, TValue>` Using the Index\
    \ Operator**\n\n```csharp\nusing System;\nusing System.Collections.Generic;\n\n\
    public class Program\n{\n    public static void Main()\n    {\n        var colorMap\
    \ = new Dictionary<string, ConsoleColor>\n            {\n                [\"Error\"\
    ] = ConsoleColor.Red,\n                [\"Warning\"] = ConsoleColor.Yellow,\n\
    \                [\"Information\"] = ConsoleColor.Green\n            };\n\n  \
    \      colorMap[\"Verbose\"] = ConsoleColor.White;                        \n \
    \       colorMap[\"Error\"] = ConsoleColor.Cyan;                           \n\n\
    \        // ...\n    }\n}\n```\n\nThe first thing to observe in [LISTING 17.6](#ch17.html_list17_6)\
    \ is that the index operator does not require an integer. Instead, the index operand\
    \ type is specified by the first type argument (`string`), and the type of the\
    \ value that is set or retrieved by the indexer is specified by the second type\
    \ argument (`ConsoleColor`).\n\nThe second thing to notice in [LISTING 17.6](#ch17.html_list17_6)\
    \ is that the same key (`\"Error\"`) is used twice. In the first assignment, no\
    \ dictionary value corresponds to the given key. When this happens, the dictionary\
    \ collection classes insert a new value with the supplied key. In the second assignment,\
    \ an element with the specified key already exists. Instead of inserting an additional\
    \ element, the prior `ConsoleColor` value for the `\"Error\"` key is replaced\
    \ with `ConsoleColor.Cyan`.\n\n## Accessing and Searching\n\nAttempting to read\
    \ a value from a dictionary with a nonexistent key throws a `KeyNotFoundException`.\
    \ The `ContainsKey()` method allows you to check whether a particular key is used\
    \ before accessing its value, thereby avoiding the exception.\n\nThe `Dictionary<TKey,\
    \ TValue>` is implemented as a hash table; this data structure provides extremely\
    \ fast access when searching by key, regardless of the number of values stored\
    \ in the dictionary. By contrast, checking whether there is a particular value\
    \ in the dictionary collections is a time-consuming operation with linear performance\
    \ characteristics, much like searching an unsorted list. To do this, you use the\
    \ `ContainsValue()` method, which searches sequentially through each element in\
    \ the collection.\n\nYou remove a dictionary element using the `Remove()` method,\
    \ passing the key, not the element value, as the argument.\n\n## Iterating over\
    \ Dictionary\n\nBecause both the key and the value are required to add a value\
    \ to the dictionary, the loop variable of a `foreach` loop that enumerates elements\
    \ of a dictionary must be `KeyValuePair<TKey, TValue>`. [LISTING 17.7](#ch17.html_list17_7)\
    \ shows a snippet of code demonstrating the use of a `foreach` loop to enumerate\
    \ the keys and values in a dictionary. The output appears in [OUTPUT 17.3](#ch17.html_op17_3).\n\
    \n**LISTING 17.7: Iterating over `Dictionary<TKey, TValue>` with `foreach`**\n\
    \n```csharp\nusing System;\nusing System.Collections.Generic;\n\npublic class\
    \ Program\n{\n    public static void Main()\n    {\n        var colorMap = new\
    \ Dictionary<string, ConsoleColor>\n            {\n                [\"Error\"\
    ] = ConsoleColor.Red,\n                [\"Warning\"] = ConsoleColor.Yellow,\n\
    \                [\"Information\"] = ConsoleColor.Green,\n                [\"\
    Verbose\"] = ConsoleColor.White\n            };\n\n        Print(colorMap);\n\
    \  }\n\n    private static void Print(\n      IEnumerable<KeyValuePair<string,\
    \ ConsoleColor>> items)\n    {\n        foreach (KeyValuePair<string, ConsoleColor>\
    \ item in items)\n        {\n            Console.ForegroundColor = item.Value;\n\
    \          Console.WriteLine(item.Key);\n      }\n    }\n}\n```\n\n**OUTPUT 17.3**\n\
    \n```\nError\nWarning\nInformation\nVerbose\n```\n\nNote that the order of the\
    \ items shown here is the order in which they were added, just as they had been\
    \ added to a list. Implementations of dictionaries will often enumerate the keys\
    \ and values in the order in which they were added, but this feature is neither\
    \ required nor documented, so you should not rely on it.\n\n## Guidelines\n\n\
    **DO NOT make any unwarranted assumptions about the order in which elements of\
    \ a collection will be enumerated. If the collection is not documented as enumerating\
    \ its elements in a particular order, it is not guaranteed to produce elements\
    \ in any particular.**\n\nIf you want to deal only with keys or only with elements\
    \ within a dictionary, they are available via the `Keys` and `Values` properties,\
    \ respectively. The data type returned from these properties is of `ICollection<T>`.\
    \ The data returned by these properties is a reference to the data within the\
    \ original dictionary rather than a copy; changes within the dictionary are automatically\
    \ reflected in the collection returned by the `Keys` and `Values` properties.\n\
    \n## Advanced Topic: Customizing Dictionary Equality\n\nTo determine whether a\
    \ given key matches any existing key in the dictionary, the dictionary must be\
    \ able to compare two keys for equality. This is analogous to the way that lists\
    \ must be able to compare two items to determine their order. (For an example,\
    \ see Advanced Topic: Customizing Collection Sorting earlier in this chapter.)\
    \ By default, two instances of a value type are compared by checking whether they\
    \ contain exactly the same data, and two instances of a reference type are compared\
    \ to see whether both reference the same object. However, it is occasionally necessary\
    \ to be able to compare two instances as equal even if they are not exactly the\
    \ same value or exactly the same reference.\n"
  raw: "Another category of collection classes is the dictionary classes—specifically,\
    \ `Dictionary<TKey, TValue>` (see [FIGURE 17.3](#ch17.html_ch17fig03)). Unlike\
    \ the list collections, dictionary classes store name/value pairs. The name functions\
    \ as a unique key that can be used to look up the corresponding element in a manner\
    \ similar to that of using a primary key to access a record in a database. This\
    \ adds some complexity to the access of dictionary elements, but because lookups\
    \ by key are efficient operations, this is a useful collection. Note that the\
    \ key may be any data type, not just a string or a numeric value.\n\n![Images](graphics/17fig03.jpg)\n\
    \n**FIGURE 17.3: `Dictionary` class diagrams**\n\nOne option for inserting elements\
    \ into a dictionary is to use the `Add()` method, passing both the key and the\
    \ value as arguments, as shown in [LISTING 17.5](#ch17.html_list17_5).\n\n**LISTING\
    \ 17.5: Adding Items to a `Dictionary<TKey, TValue>`**\n\n```\nusing System;\n\
    using System.Collections.Generic;\n\npublic class Program\n{\n    public static\
    \ void Main()\n    {\n        var colorMap = new Dictionary<string, ConsoleColor>\n\
    \        {\n            [\"Error\"] = ConsoleColor.Red,\n            [\"Warning\"\
    ] = ConsoleColor.Yellow,\n            [\"Information\"] = ConsoleColor.Green\n\
    \        };\n        colorMap.Add(\"Verbose\", ConsoleColor.White);          \
    \            \n        // ...\n    }\n}\n```\n\nAfter initializing the dictionary\
    \ with a dictionary initializer^([3](#ch17.html_fn17_3)) (see the section “Collection\
    \ Initializers” in [Chapter 15](#ch15.html_ch15)), [LISTING 17.5](#ch17.html_list17_5)\
    \ inserts the string `a` `ConsoleColor of white for the key of \"Verbose\"`. If\
    \ an element with the same key has already been added, an exception is thrown.\n\
    \n[3](#ch17.html_fn17_3a). Starting with C# 6.0.\n\nAn alternative for adding\
    \ elements is to use the indexer, as shown in [LISTING 17.6](#ch17.html_list17_6).\n\
    \n**LISTING 17.6: Inserting Items in a `Dictionary<TKey, TValue>` Using the Index\
    \ Operator**\n\n```\nusing System;\nusing System.Collections.Generic;\n\npublic\
    \ class Program\n{\n    public static void Main()\n    {\n        var colorMap\
    \ = new Dictionary<string, ConsoleColor>\n            {\n                [\"Error\"\
    ] = ConsoleColor.Red,\n                [\"Warning\"] = ConsoleColor.Yellow,\n\
    \                [\"Information\"] = ConsoleColor.Green\n            };\n\n  \
    \      colorMap[\"Verbose\"] = ConsoleColor.White;                        \n \
    \       colorMap[\"Error\"] = ConsoleColor.Cyan;                           \n\n\
    \        // ...\n    }\n}\n```\n\nThe first thing to observe in [LISTING 17.6](#ch17.html_list17_6)\
    \ is that the index operator does not require an integer. Instead, the index operand\
    \ type is specified by the first type argument (`string`), and the type of the\
    \ value that is set or retrieved by the indexer is specified by the second type\
    \ argument (`ConsoleColor`).\n\nThe second thing to notice in [LISTING 17.6](#ch17.html_list17_6)\
    \ is that the same key (`\"Error\"`) is used twice. In the first assignment, no\
    \ dictionary value corresponds to the given key. When this happens, the dictionary\
    \ collection classes insert a new value with the supplied key. In the second assignment,\
    \ an element with the specified key already exists. Instead of inserting an additional\
    \ element, the prior `ConsoleColor` value for the `\"Error\"` key is replaced\
    \ with `ConsoleColor.Cyan`.\n\nAttempting to read a value from a dictionary with\
    \ a nonexistent key throws a `KeyNotFoundException`. The `ContainsKey()` method\
    \ allows you to check whether a particular key is used before accessing its value,\
    \ thereby avoiding the exception.\n\nThe `Dictionary<TKey, TValue>` is implemented\
    \ as a *hash table*; this data structure provides extremely fast access when searching\
    \ by key, regardless of the number of values stored in the dictionary. By contrast,\
    \ checking whether there is a particular value in the dictionary collections is\
    \ a time-consuming operation with linear performance characteristics, much like\
    \ searching an unsorted list. To do this, you use the `ContainsValue()` method,\
    \ which searches sequentially through each element in the collection.\n\nYou remove\
    \ a dictionary element using the `Remove()` method, passing the key, not the element\
    \ value, as the argument.\n\nBecause both the key and the value are required to\
    \ add a value to the dictionary, the loop variable of a `foreach` loop that enumerates\
    \ elements of a dictionary must be `KeyValuePair<TKey, TValue>`. [LISTING 17.7](#ch17.html_list17_7)\
    \ shows a snippet of code demonstrating the use of a `foreach` loop to enumerate\
    \ the keys and values in a dictionary. The output appears in [OUTPUT 17.3](#ch17.html_op17_3).\n\
    \n**LISTING 17.7: Iterating over `Dictionary<TKey, TValue>` with `foreach`**\n\
    \n```\nusing System;\nusing System.Collections.Generic;\n\npublic class Program\n\
    {\n    public static void Main()\n    {\n        var colorMap = new Dictionary<string,\
    \ ConsoleColor>\n            {\n                [\"Error\"] = ConsoleColor.Red,\n\
    \                [\"Warning\"] = ConsoleColor.Yellow,\n                [\"Information\"\
    ] = ConsoleColor.Green,\n                [\"Verbose\"] = ConsoleColor.White\n\
    \            };\n\n        Print(colorMap);\n  }\n\n    private static void Print(\
    \                                            \n      IEnumerable<KeyValuePair<string,\
    \ ConsoleColor>> items)              \n    {\n        foreach (KeyValuePair<string,\
    \ ConsoleColor> item in items)        \n        {\n            Console.ForegroundColor\
    \ = item.Value;\n          Console.WriteLine(item.Key);\n      }\n    }\n}\n```\n\
    \n**OUTPUT 17.3**\n\n```\nError\nWarning\nInformation\nVerbose\n```\n\nNote that\
    \ the order of the items shown here is the order in which the items were added\
    \ to the dictionary, just as if they had been added to a list. Implementations\
    \ of dictionaries will often enumerate the keys and values in the order in which\
    \ they were added to the dictionary, but this feature is neither required nor\
    \ documented, so you should not rely on it.\n\n**Guidelines**\n\n**DO NOT make\
    \ any unwarranted assumptions about the order in which elements of a collection\
    \ will be enumerated. If the collection is not documented as enumerating its elements\
    \ in a particular order, it is not guaranteed to produce elements in any particular\
    \ order.**\n\nIf you want to deal only with keys or only with elements within\
    \ a dictionary class, they are available via the `Keys` and `Values` properties,\
    \ respectively. The data type returned from these properties is of type `ICollection<T>`.\
    \ The data returned by these properties is a reference to the data within the\
    \ original dictionary collection rather than a copy; changes within the dictionary\
    \ are automatically reflected in the collection returned by the `Keys` and `Values`\
    \ properties.\n\n**Advanced Topic: Customizing Dictionary Equality**\n\nTo determine\
    \ whether a given key matches any existing key in the dictionary, the dictionary\
    \ must be able to compare two keys for equality. This is analogous to the way\
    \ that lists must be able to compare two items to determine their order. (For\
    \ an example, see Advanced Topic: Customizing Collection Sorting earlier in this\
    \ chapter.) By default, two instances of a value type are compared by checking\
    \ whether they contain exactly the same data, and two instances of a reference\
    \ type are compared to see whether both reference the same object. However, it\
    \ is occasionally necessary to be able to compare two instances as equal even\
    \ if they are not exactly the same value or exactly the same reference."
