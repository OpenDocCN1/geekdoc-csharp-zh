  trans: "\n```csharp\nusing System;\nusing System.Collections.Generic;\n\npublic\
    \ class Program\n{\n    public static void Main()\n    {\n        var worldCup2006Finalists\
    \ = new[]\n        {\n            new\n            {\n                TeamName\
    \ = \"France\",\n                Players = new string[]\n                {\n \
    \                   \"Fabien Barthez\", \"Gregory Coupet\",\n                \
    \    \"Mickael Landreau\", \"Eric Abidal\",\n                    // ...\n    \
    \            }\n            },\n            new\n            {\n             \
    \   TeamName = \"Italy\",\n                Players = new string[]\n          \
    \      {\n                    \"Gianluigi Buffon\", \"Angelo Peruzzi\",\n    \
    \                \"Marco Amelia\", \"Cristian Zaccardo\",\n                  \
    \  // ...\n                }\n            }\n        };\n\n        Print(worldCup2006Finalists);\n\
    \    }\n\n    private static void Print<T>(IEnumerable<T> items)\n    {\n    \
    \    foreach(T item in items)\n        {\n            Console.WriteLine(item);\n\
    \        }\n    }\n}\n```\n\n结果变量是一个匿名类型 `items` 的数组，由于它是一个数组，因此它必须是同质的。\n\n###\
    \ 总结\n\n本章描述了 `foreach` 循环工作的内部机制，并解释了执行它所需的接口。此外，开发者经常对集合进行过滤以减少项目，并投影集合以使项目采用不同的形式。为了这一目的，本章讨论了如何使用标准查询操作——`LINQ`\
    \ 在 `System.Linq.Enumerable` 类上引入了集合扩展方法——来执行集合操作的细节。\n\n在标准查询操作的介绍中，我们详细介绍了延迟执行的原理，并强调了开发者应该如何小心，避免通过枚举集合内容的细微调用来无意中重新执行表达式。标准查询操作的延迟执行和随之而来的隐式执行是代码效率的一项重要因素，特别是当查询执行的开销很大时。程序员\
    \ 应该将查询对象视为查询对象，而不是结果，并且应该预期查询即使已经执行过，仍会完全执行。查询对象并结果将与之前执行时的结果相同。\n\n`LISTING\
    \ 15.23` 出现在“高级主题”部分，是因为连续调用多个标准查询操作具有复杂性。虽然类似的执行需求可能很常见，但没有必要直接依赖标准查询操作。在下一章中将展示查询表达式，`^(13)`\
    \ 这种类似于 SQL 的语法，用于操作集合，这种方式通常更易于编写代码和阅读。\n\n`13`。从 C# 3.0 开始。\n\n本章以对匿名类型的详细查看结束，并解释了为什么如果你有\
    \ C# 7.0 或更高版本，元组（tuples）实际上是一种更优的方法。\n\n## 16. 使用查询表达式的 LINQ\n\n`第 15 章` 的结尾显示了一个使用标准查询操作进行\
    \ `GroupJoin()`、`SelectMany()` 和 `Distinct()` 的查询。结果是一个跨越多行的语句，比通常只使用早期 C# 版本特性编写的语句更为复杂且难以理解。处理丰富数据数据集的现代程序通常需要此类复杂的查询；因此，如果语言让它们变得更容易读，将是有益的。像\
    \ SQL 这样的领域特定查询语言使得查询的阅读和理解变得容易得多，但缺乏 C# 语言的完整威力。这就是为什么 C# 语言设计人员增加了`query expressions`语法`^(1)`。通过查询表达式，许多标准查询操作表达式被转换为更可读的代码，就像\
    \ SQL 一样。\n\n`1`。从 C# 3.0 开始。\n\n![Images](img/16fig00.jpg)\n\n在本章中，我们引入了查询表达式并使用它们来表达\
    \ `第 15 章` 中的许多查询。\n\n### 引入查询表达式\n\n开发者最频繁执行的两个操作是`过滤`集合以消除不需要的项目，以及`投影`集合使项目采用不同的形式。例如，给定一个文件集合，我们可以过滤它以创建一个仅包含\
    \ `.cs` 扩展文件的的新集合，或者仅包含大于 100 万字节的文件集合。我们还可以投影文件集合，创建一个指向文件所在目录路径及相应目录大小的新集合。查询表达式为这两种常见操作提供了简单直观的语法。`LISTING\
    \ 16.1` 显示了一个过滤字符串集合的查询表达式；`OUTPUT 16.1` 显示了结果。\n\n**LISTING 16.1: 简单查询表达式**\n\
    \n```csharp\npublic static class CSharp\n{\n    public static readonly ReadOnlyCollection<string>\
    \ Keywords = new(\n        new string[]\n        {\n            \"abstract\",\"\
    add*\",\"alias*\",\"as\",\"ascending*\",\n            \"async*\",\"await*\",\"\
    base\",\"bool\",\"break\",\n            \"by*\",\"byte\",\"case\",\"catch\",\"\
    char\",\"checked\",\n            \"class\",\"const\",\"continue\",\"decimal\"\
    ,\"default\",\n            \"delegate\",\"descending*\",\"do\",\"double\",\"dynamic*\"\
    ,\n            \"else\",\"enum\",\"equals*\",\"event\",\"explicit\",\"extern\"\
    ,\n            \"false\",\"finally\",\"fixed\",\"float\",\"for\",\"foreach\",\n\
    \            \"from\",\"get*\n```\n"
- fmt: "\nDevelopers familiar with SQL will notice that query expressions have a syntax\
    \ that is similar to that of SQL. This design was deliberate—it was intended that\
    \ programmers who already know SQL should find it easy to learn LINQ. However,\
    \ there are some obvious differences. The first difference that most SQL-experienced\
    \ developers will notice is that the C# query expression shown here has the clauses\
    \ in the following order: `from`, then `where`, then `select`. The equivalent\
    \ SQL query puts the `SELECT` clause first, followed by the `FROM` clause, and\
    \ finally the `WHERE` clause.\n\nOne reason for this change in sequence is to\
    \ enable use of IntelliSense, the feature of the IDE whereby the editor produces\
    \ helpful user interface elements such as drop-down lists that describe the members\
    \ of a given object. Because `from` appears first and identifies the string array\
    \ `Keywords` as the data source, the code editor can deduce that the range variable\
    \ `word` is of type `string`. When you are entering the code into the editor and\
    \ reach the dot following `word`, the editor will display only the members of\
    \ `string`.\n\nIf the `from` clause appeared after the `select`, like it does\
    \ in SQL, as you were typing in the query the editor would not know what the data\
    \ type of `word` was, so it would not be able to display a list of `word`’s members.\
    \ In [LISTING 16.1](#ch16.html_list16_1), for example, it wouldn’t be possible\
    \ to predict that `Contains()` is a possible member of `word`.\n\nThe C# query\
    \ expression order also more closely matches the order in which operations are\
    \ logically performed. When evaluating the query, you begin by identifying the\
    \ collection (described by the `from` clause), then filter out the unwanted items\
    \ (with the `where` clause), and finally describe the desired result (with the\
    \ `select` clause).\n\nFinally, the C# query expression order ensures that the\
    \ rules for “where” (range) variables are in scope are mostly consistent with\
    \ the scoping rules for local variables. For example, a (range) variable must\
    \ be declared by a clause (typically a `from` clause) before the variable can\
    \ be used, much as a local variable must always be declared before it can be used.\n\
    \n### Projection\n\nThe result of a query expression is a collection of type `IEnumerable<T>`\
    \ or `IQueryable<T>`.^([2](#ch16.html_fn16_2)) The actual type `T` is inferred\
    \ from the `select` or `group by` clause. In [LISTING 16.1](#ch16.html_list16_1),\
    \ for example, the compiler knows that `Keywords` is of type `string[]`, which\
    \ is convertible to `IEnumerable<string>`, and it deduces that `word` is therefore\
    \ of type `string`. The query ends with `select word`, which means the result\
    \ of the query expression must be a collection of strings, so the type of the\
    \ query expression is `IEnumerable<string>`.\n\n[2](#ch16.html_fn16_2a). The result\
    \ of a query expression is, as a practical matter, almost always `IEnumerable<T>`\
    \ or a type derived from it. It is legal, though somewhat perverse, to create\
    \ an implementation of the query methods that return other types; there is no\
    \ requirement in the language that the result of a query expression be convertible\
    \ to `IEnumerable<T>`.\n\nIn this case, the “input” and the “output” of the query\
    \ are both a collection of strings. However, the output type can be quite different\
    \ from the input type if the expression in the `select` clause is of an entirely\
    \ different type. Consider the query expression in [LISTING 16.2](#ch16.html_list16_2)\
    \ and its corresponding output in [OUTPUT 16.2](#ch16.html_op16_2).\n\n**LISTING\
    \ 16.2: Projection Using Query Expressions**\n\n```\nusing System;\nusing System.Collections.Generic;\n\
    using System.IO;\nusing System.Linq;\n// ...\n    public static void List1\n \
    \       (string rootDirectory, string searchPattern)\n    {\n        IEnumerable<string>\
    \ fileNames = Directory.GetFiles(           \n            rootDirectory, searchPattern);\
    \                            \n\n        IEnumerable<FileInfo> fileInfos =   \
    \                          \n            from fileName in fileNames          \
    \                      \n            select new FileInfo(fileName);          \
    \                  \n\n        foreach (FileInfo fileInfo in fileInfos)\n    \
    \    {\n            Console.WriteLine(\n                $@\".{ fileInfo.Name }\
    \ ({\n                    fileInfo.LastWriteTime })\");\n        }\n    }\n  \
    \  //...\n```\n\n**OUTPUT 16.2**\n\n```\nAccount.cs (11/22/2011 11:56:11 AM)\n\
    Bill.cs (8/10/2011 9:33:55 PM)\nContact.cs (8/19/2011 11:40:30 PM)\nCustomer.cs\
    \ (11/17/2011 2:02:52 AM)\nEmployee.cs (8/17/2011 1:33:22 AM)\nPerson.cs (10/22/2011\
    \ 10:00:03 PM)\n```\n\nThis query expression results in an `IEnumerable<FileInfo>`\
    \ rather than the `IEnumerable<string>` data type returned by `Directory.GetFiles()`.\
    \ The `select` clause of the query expression can potentially project out a data\
    \ type that differs from that collected by the `from` clause expression.\n\nIn\
    \ this example, the type `FileInfo` was chosen because it has the two relevant\
    \ fields needed for the desired output: the filename and the last write time.\
    \ There might not be such a convenient type if you needed other information. Tuples^([3](#ch16.html_fn16_3))\
    \ provide a convenient way to project the exact data you need without having to\
    \ create an explicit type. [LISTING 16.3](#ch16.html_list16_3) provides output\
    \ similar to [LISTING 16.2](#ch16.html_list16_2), but uses tuple syntax rather\
    \ than `FileInfo`.\n\n[3](#ch16.html_fn16_3a). Anonymous types used prior to C#\
    \ 7.0.\n\n**LISTING 16.3: Tuples within Query Expressions**\n\n```\nusing System;\n\
    using System.IO;\nusing System.Linq;\n// ...\n    public static void List2\n \
    \       (string rootDirectory, string searchPattern)\n    {\n        var fileNames\
    \ = Directory.EnumerateFiles(                           \n            rootDirectory,\
    \ searchPattern);                                  \n        var fileResults =\
    \                                                   \n            from fileName\
    \ in fileNames                                      \n            select     \
    \                                                     \n            (        \
    \                                                       \n                Name:\
    \ fileName,                                             \n                LastWriteTime:\
    \ File.GetLastWriteTime(fileName)              \n            );              \
    \                                                \n\n        foreach (var fileResult\
    \ in fileResults)\n        {\n            Console.WriteLine(\n               \
    \ $@\"{ fileResult.Name } ({                                   \n            \
    \        fileResult.LastWriteTime })\");                          \n        }\n\
    \    }\n    //...\n```\n\n### Beginner Topic: Deferred Execution with Query Expressions\n"
