  trans: "\n\n如果类想要支持使用 `foreach` 循环结构进行迭代，它们必须实现枚举器模式。如第 15 章 所述，在 C# 中，`foreach`\
    \ 循环结构会被编译器展开为基于从 `IEnumerable<T>` 接口获取的 `IEnumerator<T>` 接口的 `while` 循环结构。\n\n\
    手动实现枚举模式可能会繁琐，因为它必须维护描述集合中当前位置的所有状态。对于列表集合类型的类，这种内部状态可能很简单；当前位置的索引通常足够了。相比之下，对于需要递归遍历的数据结构（如二叉树），状态可能会非常复杂。^(4)\n\
    \nC# 2.0 引入了一种结构，使得类更容易控制 `foreach` 循环如何在其内容上迭代。\n\n### 定义迭代器\n\n迭代器（Iterators）是实现类方法的一种手段，它们是更复杂的枚举器模式的语法快捷方式。当\
    \ C# 编译器遇到迭代器时，它将其内容展开为实现枚举器模式的 CIL 代码。因此，实现迭代器没有运行时依赖。由于 C# 编译器通过 CIL 代码生成处理实现，使用迭代器并没有真正的运行时性能收益。然而，通过选择迭代器而不是手动实现枚举模式，可能会实现程序员生产效率的巨大提升。要理解这种改进是如何产生的，我们必须首先考虑迭代器在代码中是如何定义的。\n\
    \n### 迭代器语法\n\n迭代器提供了迭代器接口的简写实现，即 `IEnumerable<T>` 和 `IEnumerator<T>` 接口的组合。列表\
    \ 17.12 通过创建一个 `GetEnumerator()` 方法，为泛型 `BinaryTree<T>` 类型声明了一个迭代器。接下来，你将添加对迭代器接口的支持。\n\
    \n**列表 17.12：迭代器接口模式**\n\n```\nusing System.Collections;\nusing System.Collections.Generic;\n\
    \npublic class BinaryTree<T> :\nIEnumerable<T>                               \
    \                     \n{\n    public BinaryTree(T value)\n    {\n        Value\
    \ = value;\n    }\n\n    #region IEnumerable<T>\n    public IEnumerator<T> GetEnumerator()\
    \                         \n    {\n        // ...\n    }\n    #endregion IEnumerable<T>\n\
    \n    public T Value { get; }\n    public Pair<BinaryTree<T>> SubItems { get;\
    \ set; }\n}\n\npublic struct Pair<T>\n{\n    public Pair(T first, T second) :\
    \ this()\n    {\n        First = first;\n        Second = second;\n    }\n   \
    \ public T First { get; }\n    public T Second { get; }\n}\n```\n\n如列表 17.12 所示，我们需要为\
    \ `GetEnumerator()` 方法提供实现。\n\n### 从迭代器中产生值\n\n迭代器像函数，但它们返回的不是单个值，而是*产生*（yield）一个值序列，每次产生一个。在\
    \ `BinaryTree<T>` 的情况下，迭代器产生一个类型为提供的 `T` 类型参数值的序列。如果使用了非泛型的 `IEnumerator`，则产生的值将是\
    \ `object` 类型。\n\n要正确实现迭代器模式，你需要维护一些内部状态，以便在枚举集合时跟踪你所在的位置。在 `BinaryTree<T>` 的案例中，你跟踪树中哪些元素已经被枚举过，哪些仍待处理。迭代器会被编译器转换为一个“状态机”，该状态机跟踪当前位置并知道如何“移动自身”到下一个位置。\n\
    \n`yield return` 语句在迭代器每次遇到它时都会产生一个值；控制权立即返回给请求该项目的调用者。（这里有一个有趣的点是，控制确实是*立即*返回的，讽刺的是这不像\
    \ `return` 语句。`return` 语句会在沿路执行 finally 块；`yield return` 则不会。）当调用者请求下一个项目时，代码将立即从之前执行的\
    \ `yield return` 语句之后开始执行。在列表 17.13 中，你顺序返回 C# 内置数据类型关键字。结果显示在输出 17.5 中。\n\n**列表\
    \ 17.13：顺序产生某些 C# 关键字**\n\n```\nusing System;\nusing System.Collections.Generic;\n\
    \npublic class CSharpBuiltInTypes : IEnumerable<string>\n{\n    public IEnumerator<string>\
    \ GetEnumerator()\n    {\n        yield return \"object\";\n        yield return\
    \ \"byte\";\n        yield return \"uint\";\n        yield return \"ulong\";\n\
    \        yield return \"float\";\n        yield return \"char\";\n        yield\
    \ return \"bool\";\n        yield return \"ushort\";\n        yield return \"\
    decimal\";\n        yield return \"int\";\n        yield return \"sbyte\";\n \
    \       yield return \"short\";\n        yield return \"long\";\n        yield\
    \ return \"void\";\n        yield return \"double\";\n        yield return \"\
    string\";\n    }\n\n    // 同样需要 IEnumerable.GetEnumerator 方法\n    // 因为 IEnumerable<T>\
    \ 继承自 IEnumerable\n    System.Collections.IEnumerator\n        System.Collections.IEnumerable.GetEnumerator()\n\
    \    {\n        // 调用上方的 IEnumerator<string> GetEnumerator()\n        return GetEnumerator();\n\
    \    }\n}\npublic class Program\n{\n    public static void Main()\n    {\n   \
    \     var keywords = new CSharpBuiltInTypes();\n        foreach (string keyword\
    \ in keywords)\n        {\n            Console.WriteLine(keyword);\n        }\n\
    \    }\n}\n```\n\n**输出 17.5**\n\n```\nobject\nbyte\nuint\nulong\nfloat\nchar\n\
    bool\nushort\ndecimal\nint\nsbyte\nshort\nlong\nvoid\ndouble\nstring\n```\n\n\
    此列表的输出是 C# 内置类型的列表。\n\n### 迭代器与状态\n\n当 `foreach` 语句第一次调用 `GetEnumerator()` 时（例如列表\
    \ 17.13 中的 `foreach (string keyword in keywords)`），会创建一个迭代器对象并将其初始化为特殊的“开始”状态，该状态表示尚未器迭代器，因此尚未产生任何值。只要调用处的\
    \ `foreach` 语句继续执行，迭代器就会保持其状态。每次当循环请求下一个值时，控制进入迭代器并从上次循环的地方继续；存储在迭代器对象中的状态信息用于确定控制必须恢复的位置。当调用处的\
    \ `foreach` 语句终止时，迭代器的状态不再保存。\n\n再次调用 `GetEnumerator()` 总是安全的；必要时将创建“新的”枚举器对象。\n\
    \n图 17.8 显示了发生过程的高层序列图。记住 `MoveNext()` 方法出现在 `IEnumerator<T>` 接口上。\n\n![Images](img/17fig08.jpg)\n\
    \n**图 17.8：带有 `yield return` 应用序列图**\n\n"
- fmt: "\nIn [LISTING 17.13](#ch17.html_list17_13), the `foreach` statement at the\
    \ call site initiates a call to `GetEnumerator()` on the `CSharpBuiltInTypes`\
    \ instance called `keywords`. Given the iterator instance (referenced by `iterator`),\
    \ `foreach` begins each iteration with a call to `MoveNext()`. Within the iterator,\
    \ you yield a value back to the `foreach` statement at the call site. After the\
    \ `yield return` statement, the `GetEnumerator()` method seemingly pauses until\
    \ the next `MoveNext()` request. Back at the loop body, the `foreach` statement\
    \ displays the yielded value on the screen. It then loops back around and calls\
    \ `MoveNext()` on the iterator again. Notice that the second time, control picks\
    \ up at the second `yield return` statement. Once again, the `foreach` displays\
    \ on the screen what `CSharpBuiltInTypes` yielded and starts the loop again. This\
    \ process continues until there are no more `yield return` statements within the\
    \ iterator. At that point, the `foreach` loop at the call site terminates because\
    \ `MoveNext()` returns `false`.\n\n### More Iterator Examples\n\nBefore you modify\
    \ `BinaryTree<T>`, you must modify `Pair<T>` to support the `IEnumerable<T>` interface\
    \ using an iterator. [LISTING 17.14](#ch17.html_list17_14) is an example that\
    \ yields each element in `Pair<T>`.\n\n**LISTING 17.14: Using `yield` to Implement\
    \ `BinaryTree<T>`**\n\n```sharp\npublic struct Pair<T> : IPair<T>,\nIEnumerable<T>\
    \                                                      \n{\n    public Pair(T\
    \ first, T second) : this()\n    {\n        First = first;\n        Second = second;\n\
    \    }\n    public T First { get; }\n    public T Second { get; }\n    // ...\n\
    \    #region IEnumerable<T>                                           \n    public\
    \ IEnumerator<T> GetEnumerator()                            \n    {          \
    \                                                      \n        yield return\
    \ First;                                          \n        yield return Second;\
    \                                         \n    }                            \
    \                                    \n    #endregion IEnumerable<T>         \
    \                               \n\n    #region IEnumerable Members          \
    \                            \n    System.Collections.IEnumerator            \
    \                       \n        System.Collections.IEnumerable.GetEnumerator()\
    \               \n    {                                                      \
    \          \n        return GetEnumerator();                                 \
    \     \n    }                                                                \n\
    \    #endregion IEnumerable Members                                   \n}\n```\n\
    \n`public struct Pair<T> : IPair<T>, IEnumerable<T> { public Pair(T first, T second)\
    \ : this() { First = first; Second = second; } public T First { get; } public\
    \ T Second { get; }` `// ...` `#region IEnumerable<T> public IEnumerator<T> GetEnumerator()\
    \ { yield return First; yield return Second; } #endregion IEnumerable<T> #region\
    \ IEnumerable Members System.Collections.IEnumerator System.Collections.IEnumerable.GetEnumerator()\
    \ { return GetEnumerator(); } #endregion IEnumerable Members }`\n\nIn [LISTING\
    \ 17.14](#ch17.html_list17_14), the iteration over the `Pair<T>` data type loops\
    \ twice: first through `yield return First` and then through `yield return Second`.\
    \ Each time the `yield return` statement within `GetEnumerator()` is encountered,\
    \ the state is saved and execution appears to “jump” out of the `GetEnumerator()`\
    \ method context and into the loop body. When the second iteration starts, `GetEnumerator()`\
    \ begins to execute again with the `yield return Second` statement.\n\n`System.Collections.Generic.IEnumerable<T>`\
    \ inherits from `System.Collections.IEnumerable`. Therefore, when implementing\
    \ `IEnumerable<T>`, it is also necessary to implement `IEnumerable`. In [LISTING\
    \ 17.14](#ch17.html_list17_14), you do so explicitly, and the implementation simply\
    \ involves a call to `IEnumerable<T>`’s `GetEnumerator()` implementation. This\
    \ call from `IEnumerable.GetEnumerator()` to `IEnumerable<T>.GetEnumerator()`\
    \ will always work because of the type compatibility (via inheritance) between\
    \ `IEnumerable<T>` and `IEnumerable`. Since the signatures for both versions of\
    \ `GetEnumerator()` are identical (the return type does not distinguish a signature),\
    \ one or both implementations must be explicit. Given the additional type safety\
    \ offered by `IEnumerable<T>`’s version, you implement `IEnumerable`’s implementation\
    \ explicitly.\n\n[LISTING 17.15](#ch17.html_list17_15) uses the `Pair<T>.GetEnumerator()`\
    \ method and displays `\"Inigo\"` and `\"Montoya\"` on two consecutive lines.\n\
    \n**LISTING 17.15: Using `Pair<T>.GetEnumerator()` via `foreach`**\n\n```sharp\n\
    var fullname = new Pair<string>(\"Inigo\", \"Montoya\");\nforeach(string name\
    \ in fullname)\n{\n    Console.WriteLine(name);\n}\n```\n\nNotice that the call\
    \ to `GetEnumerator()` is implicit within the `foreach` loop.\n\n### Placing a\
    \ `yield return` within a Loop\n\nIt is not necessary to hardcode each `yield\
    \ return` statement, as you did in both `CSharpBuiltInTypes` and `Pair<T>`. Using\
    \ the `yield return` statement, you can return values from inside a loop construct.\
    \ [LISTING 17.16](#ch17.html_list17_16) uses a `foreach` loop. Each time the `foreach`\
    \ within `GetEnumerator()` executes, it returns the next value.\n\n**LISTING 17.16:\
    \ Placing `yield return` Statements within a Loop**\n\n```sharp\npublic class\
    \ BinaryTree<T> :\n  IEnumerable<T>\n{\n    // ...\n    #region IEnumerable<T>\n\
    \    public IEnumerator<T> GetEnumerator()\n    {\n        // Return the item\
    \ at this node\n        yield return Value;\n\n        // Iterate through each\
    \ of the elements in the pair\n        foreach (BinaryTree<T>? tree in SubItems)\n\
    \        {\n            if(tree != null)\n            {\n                // Since\
    \ each element in the pair is a tree,\n                // traverse the tree and\
    \ yield each\n                // element\n                foreach(T item in tree)\n\
    \                {\n                    yield return item;\n                }\n\
    \            }\n        }\n    }\n    #endregion IEnumerable<T>\n\n    #region\
    \ IEnumerable Members\n    System.Collections.IEnumerator\n        System.Collections.IEnumerable.GetEnumerator()\n\
    \    {\n        return GetEnumerator();\n    }\n    #endregion\n    // ...\n}\n\
    ```\n\nIn [LISTING 17.16](#ch17.html_list17_16), the first iteration returns the\
    \ root element within the binary tree. During the second iteration, you traverse\
    \ the pair of subelements. If the subelement pair contains a non-`null` value,\
    \ you traverse into that child node and yield its elements. Note that `foreach\
    \ (T item in tree)` is a recursive call to a child node.\n\nAs observed with `CSharpBuiltInTypes`\
    \ and `Pair<T>`, you can now iterate over `BinaryTree<T>` using a `foreach` loop.\
    \ [LISTING 17.17](#ch17.html_list17_17) demonstrates this process, and [OUTPUT\
    \ 17.6](#ch17.html_op17_6) shows the results.\n\n**LISTING 17.17: Using `foreach`\
    \ with `BinaryTree<string>`**\n"
