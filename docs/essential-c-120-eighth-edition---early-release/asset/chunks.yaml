  trans: "\n\n正如预期的，取消请求模式也适用于 PLINQ 查询。列表 21.10（带有输出 21.3）提供了一个示例。与并行循环一样，取消的 PLINQ\
    \ 查询将抛出 `System.OperationCanceledException`。同样与并行循环一样，执行 PLINQ 查询是在调用线程上的同步操作。因此，一种常用的技术是将并行查询封装在另一个线程上运行的任务中，以便当前线程在必要时取消它——这在列表\
    \ 21.5 中使用了相同的解决方案。\n\n### 列表 21.10: 取消 PLINQ 查询\n\n```csharp\nusing System;\n\
    using System.Collections.Generic;\nusing System.Linq;\nusing System.Threading;\n\
    using System.Threading.Tasks;\n\npublic static class Program\n{\n    public static\
    \ List<string> ParallelEncrypt(\n        List<string> data,\n        CancellationToken\
    \ cancellationToken)\n    {\n        int govener = 0;\n        return data.AsParallel().WithCancellation(\n\
    \            cancellationToken).Select(\n                (item) =>\n         \
    \       {\n                    if (Interlocked.CompareExchange(\n            \
    \            ref govener, 0, 100) % 100 == 0)\n                    {\n       \
    \                 Console.Write('.');\n                    }\n               \
    \     Interlocked.Increment(ref govener);\n                    return Encrypt(item);\n\
    \                }).ToList();\n    }\n\n    public static async Task Main()\n\
    \    {\n        ConsoleColor originalColor = Console.ForegroundColor;\n      \
    \  List<string> data = Utility.GetData(100000).ToList();\n\n        using CancellationTokenSource\
    \ cts =\n            new CancellationTokenSource();\n\n        Task task = Task.Run(()\
    \ =>\n        {\n            data = ParallelEncrypt(data, cts.Token);\n      \
    \  }, cts.Token);\n\n        Console.WriteLine(\"Press any key to Exit.\");\n\
    \        Task<int> cancelTask = ConsoleReadAsync(cts.Token);\n\n        try\n\
    \        {\n            Task.WaitAny(task, cancelTask);\n            // 取消尚未完成的任务。\n\
    \            cts.Cancel();\n            await task;\n\n            Console.ForegroundColor\
    \ = ConsoleColor.Green;\n            Console.WriteLine(\"\\nCompleted successfully\"\
    );\n\n        }\n        catch (OperationCanceledException taskCanceledException)\n\
    \        {\n            Console.ForegroundColor = ConsoleColor.Red;\n        \
    \    Console.WriteLine(\n                $\"\\nCancelled: { taskCanceledException.Message\
    \ }\");\n        }\n        finally\n        {\n            Console.ForegroundColor\
    \ = originalColor;\n        }\n    }\n\n    private static async Task<int> ConsoleReadAsync(\n\
    \        CancellationToken cancellationToken = default)\n    {\n        return\
    \ await Task.Run(async () =>\n        {\n            const int maxDelay = 1025;\n\
    \            int delay = 0;\n            while (!cancellationToken.IsCancellationRequested)\n\
    \            {\n                if (Console.KeyAvailable)\n                {\n\
    \                    return Console.Read();\n                }\n             \
    \   else\n                {\n                    await Task.Delay(delay, cancellationToken);\n\
    \                    if (delay < maxDelay) delay *= 2 + 1;\n                }\n\
    \            }\n            cancellationToken.ThrowIfCancellationRequested();\n\
    \            throw new InvalidOperationException(\n                \"Previous\
    \ line should throw preventing this from ever executing\");\n        }, cancellationToken);\n\
    \    }\n\n    private static string Encrypt(string item)\n    {\n        Cryptographer\
    \ cryptographer = new Cryptographer();\n        return System.Text.Encoding.UTF8.GetString(cryptographer.Encrypt(item));\n\
    \    }\n}\n```\n\n### 输出 21.3\n\n```\nPress any key to Exit.\n........................................................................\n\
    ........................................................................\n.............................................................\n\
    .....................................\nCancelled: The query has been canceled\
    \ via the token supplied to WithCancellation.\n```\n\n与并行循环或任务一样，取消 PLINQ 查询需要一个\
    \ `CancellationToken`，该令牌可以通过 `CancellationTokenSource` 获取。然而，并不是重载每个 PLINQ 查询来支持取消令牌，`IEnumerable.AsParallel()`\
    \ 方法返回的 `ParallelQuery<T>` 对象包含一个 `WithCancellation()` 扩展方法，该方法只需接收一个 `CancellationToken`。因此，在\
    \ `CancellationTokenSource` 对象上调用 `Cancel()` 将请求并行查询取消——因为它检查了 `CancellationToken`\
    \ 上的 `IsCancellationRequested` 属性。\n\n如所述，取消 PLINQ 查询将抛出异常而不是返回完整结果。处理可能取消的 PLINQ\
    \ 查询的一种常用技术是将查询封装在 `try` 块中并捕获 `OperationCanceledException`。另一种常用技术（在列表 21.10\
    \ 中使用）是将 `CancellationToken` 同时传递给 `ParallelEncrypt()` 并作为 `Run()` 的第二个参数。这将导致\
    \ `task.Wait()` 抛出一个 `AggregateException`，其 `InnerException` 属性将设置为 `TaskCanceledException`。然后可以像捕获任何其他并行操作的异常一样，捕获该聚合异常。\n\
    \n### 总结\n\n在本章中，我们讨论了如何使用 TPL `Parallel` 类进行 `for` 和 `foreach` 类型的迭代。此外，通过 `System.Linq`\
    \ 中包含的 `AsParallel()` 扩展方法，我们演示了如何并行执行 LINQ 查询。实现此点的易用性有助于你意识到，并行迭代是引入并行执行的最简单的方法之一。尽管仍然需要注意竞态条件和死锁，但如果你不在并行循环的迭代内部共享数据，这些问题发生的概率要远低于直接处理任务。剩下的工作就是识别出可以从并行执行中受益的\
    \ CPU 密集型代码块。\n\n"
