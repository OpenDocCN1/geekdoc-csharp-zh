    \ so this workaround successfully allows for the creation of a collection of anonymous\
    \ types.\n\nAnother approach to initializing a collection of anonymous types is\
    \ to use an array initializer. As it is not possible to specify the data type\
    \ in the constructor, array initialization syntax allows for anonymous array initializers\
