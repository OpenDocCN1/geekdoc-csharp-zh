  trans: "\n在 LISTING 17.13 中，调用处的 `foreach` 语句会对名为 `keywords` 的 `CSharpBuiltInTypes`\
    \ 实例调用 `GetEnumerator()`。根据该迭代器实例（由 `iterator` 引用），`foreach` 的每次迭代通过调用 `MoveNext()`\
    \ 开始。在迭代器内部，你向调用处的 `foreach` 语句返回一个值。在 `yield return` 语句之后，`GetEnumerator()` 方法似乎会暂停，直到下一次\
    \ `MoveNext()` 请求。回到循环体中，`foreach` 语句将产生的值显示在屏幕上。然后它会返回循环，并再次对迭代器调用 `MoveNext()`。注意，第二次时，控制从第二个\
    \ `yield return` 语句处继续。再次，`foreach` 在屏幕上显示 `CSharpBuiltInTypes` 产生的内容并重新开始循环。此过程一直持续，直到迭代器内部没有更多的\
    \ `yield return` 语句。此时，调用处的 `foreach` 循环终止，因为 `MoveNext()` 返回了 `false`。\n\n###\
    \ 更多迭代器示例\n\n在修改 `BinaryTree<T>` 之前，你必须修改 `Pair<T>` 以使用迭代器支持 `IEnumerable<T>`\
    \ 接口。LISTING 17.14 是一个产生 `Pair<T>` 中每个元素的示例。\n\n**LISTING 17.14: 使用 `yield` 实现\
    \ `BinaryTree<T>`**\n\n```sharp\npublic struct Pair<T> : IPair<T>,\nIEnumerable<T>\
    \                                                      \n{\n    public Pair(T\
    \ first, T second) : this()\n    {\n        First = first;\n        Second = second;\n\
    \    }\n    public T First { get; }\n    public T Second { get; }\n    // ...\n\
    \    #region IEnumerable<T>                                           \n    public\
    \ IEnumerator<T> GetEnumerator()                            \n    {          \
    \                                                      \n        yield return\
    \ First;                                          \n        yield return Second;\
    \                                         \n    }                            \
    \                                    \n    #endregion IEnumerable<T>         \
    \                               \n\n    #region IEnumerable Members          \
    \                            \n    System.Collections.IEnumerator            \
    \                       \n        System.Collections.IEnumerable.GetEnumerator()\
    \               \n    {                                                      \
    \          \n        return GetEnumerator();                                 \
    \     \n    }                                                                \n\
    \    #endregion IEnumerable Members                                   \n}\n```\n\
    \n`public struct Pair<T> : IPair<T>, IEnumerable<T> { public Pair(T first, T second)\
    \ : this() { First = first; Second = second; } public T First { get; } public\
    \ T Second { get; }` `// ...` `#region IEnumerable<T> public IEnumerator<T> GetEnumerator()\
    \ { yield return First; yield return Second; } #endregion IEnumerable<T> #region\
    \ IEnumerable Members System.Collections.IEnumerator System.Collections.IEnumerable.GetEnumerator()\
    \ { return GetEnumerator(); } #endregion IEnumerable Members }`\n\n在 LISTING 17.14\
    \ 中，对 `Pair<T>` 类型的迭代循环了两次：首先通过 `yield return First`，然后通过 `yield return Second`。每次遇到\
    \ `GetEnumerator()` 内部的 `yield return` 语句时，状态会被保存，执行似乎似乎“跳出” `GetEnumerator()`\
    \ 方法上下文并进入循环体。当第二次迭代开始时，`GetEnumerator()` 再次执行并到达 `yield return Second` 语句。\n\n\
    `System.Collections.Generic.IEnumerable<T>` 继承自 `System.Collections.IEnumerable`。因此，在实现\
    \ `IEnumerable<T>` 时，也有必要实现 `IEnumerable`。在 LISTING 17.14 中，你显式地这样做，实现仅涉及调用 `IEnumerable<T>`\
    \ 的 `GetEnumerator()` 实现。这种从 `IEnumerable.GetEnumerator()` 到 `IEnumerable<T>.GetEnumerator()`\
    \ 的调用由于 `IEnumerable<T>` 和 `IEnumerable` 之间的类型兼容性（通过继承）而始终有效。由于两个版本的 `GetEnumerator()`\
    \ 签名相同（返回类型不区分签名），其中一个或两个实现都必须是显式的。鉴于 `IEnumerable<T>` 版本提供的额外类型安全，你显式地实现了 `IEnumerable`\
    \ 的实现。\n\nLISTING 17.15 使用了 `Pair<T>.GetEnumerator()` 方法并在连续的两行中显示 `\"Inigo\"\
    ` 和 `\"Montoya\"`。\n\n**LISTING 17.15: 通过 `foreach` 使用 `Pair<T>.GetEnumerator()`**\n\
    \n```sharp\nvar fullname = new Pair<string>(\"Inigo\", \"Montoya\");\nforeach(string\
    \ name in fullname)\n{\n    Console.WriteLine(name);\n}\n```\n\n注意 `foreach` 循环内部对\
    \ `GetEnumerator()` 的调用是隐式的。\n\n### 在循环内部放置 `yield return`\n\n没有必要硬编码每个 `yield\
    \ return` 语句，就像你在 `CSharpBuiltInTypes` 和 `Pair<T>` 中做的那样。使用 `yield return` 语句，你可以从循环结构内部返回值。LISTING\
    \ 17.16 使用了 `foreach` 循环。每次 `GetEnumerator()` 内部的 `foreach` 执行时，它都会返回下一个值。\n\n\
    **LISTING 17.16: 在循环内部放置 `yield return` 语句**\n\n```sharp\npublic class BinaryTree<T>\
    \ :\n  IEnumerable<T>\n{\n    // ...\n    #region IEnumerable<T>\n    public IEnumerator<T>\
    \ GetEnumerator()\n    {\n        // 返回此节点上的项\n        yield return Value;\n\n\
    \        // 遍历配对中的每个元素\n        foreach (BinaryTree<T>? tree in SubItems)\n  \
    \      {\n            if(tree != null)\n            {\n                // 因为配对中的每个元素都是树，\n\
    \                // 遍历树并产生每个\n                // 元素\n                foreach(T\
    \ item in tree)\n                {\n                    yield return item;\n \
    \               }\n            }\n        }\n    }\n    #endregion IEnumerable<T>\n\
    \n    #region IEnumerable Members\n    System.Collections.IEnumerator\n      \
    \  System.Collections.IEnumerable.GetEnumerator()\n    {\n        return GetEnumerator();\n\
    \    }\n    #endregion\n    // ...\n}\n```\n\n在 LISTING 17.16 中，第一次迭代返回二叉树内的根元素。在第二次迭代期间，你遍历了子元素对。如果子元素对包含包含非\
    \ `null` 值，你将进入该子节点并产生它的元素。注意 `foreach (T item in tree)` 是对子节点的递归调用。\n\n正如在 `CSharpBuiltInTypes`\
    \ 和 `Pair<T>` 中观察到的那样，你现在可以使用 `foreach` 循环遍历 `BinaryTree<T>`。LISTING 17.17 演示了这一过程，OUTPUT\
    \ 17.6 显示了结果。\n\n**LISTING 17.17: 使用 `foreach` 使用 `BinaryTree<string>`**\n\n"
- fmt: "\n```sharp\n// JFK\nvar jfkFamilyTree = new BinaryTree<string>(\n    \"John\
    \ Fitzgerald Kennedy\")\n{\n    SubItems = new Pair<BinaryTree<string>>(\n   \
    \     new BinaryTree<string>(\"Joseph Patrick Kennedy\")\n        {\n        \
    \    // Grandparents (Father's side)\n            SubItems = new Pair<BinaryTree<string>>(\n\
    \                new BinaryTree<string>(\"Patrick Joseph Kennedy\"),\n       \
    \         new BinaryTree<string>(\"Mary Augusta Hickey\"))\n        },\n     \
    \   new BinaryTree<string>(\"Rose Elizabeth Fitzgerald\")\n        {\n       \
    \     // Grandparents (Mother's side)\n            SubItems = new Pair<BinaryTree<string>>(\n\
    \                new BinaryTree<string>(\"John Francis Fitzgerald\"),\n      \
    \          new BinaryTree<string>(\"Mary Josephine Hannon\"))\n        })\n};\n\
    \nforeach (string name in jfkFamilyTree)                                 \n{ \
    \                                                                    \n    Console.WriteLine(name);\
    \                                          \n} \n```\n\n**OUTPUT 17.6**\n\n```\n\
    John Fitzgerald Kennedy\nJoseph Patrick Kennedy\nPatrick Joseph Kennedy\nMary\
    \ Augusta Hickey\nRose Elizabeth Fitzgerald\nJohn Francis Fitzgerald\nMary Josephine\
    \ Hannon\n```\n\n### Advanced Topic: The Dangers of Recursive Iterators\n\nThe\
    \ code in `[LISTING 17.16](#ch17.html_list17_16)` creates new “nested” iterators\
    \ as it traverses the binary tree. As a consequence, when the value is yielded\
    \ by a node, the value is yielded by the node’s iterator, and then yielded by\
    \ its parent’s iterator, and then yielded by its parent’s iterator, and so on,\
    \ until it is finally yielded to the original loop by the root’s iterator. A value\
    \ that is *n* levels deep must actually pass its value up a chain of *n* iterators.\
    \ If the binary tree is relatively shallow, this is not typically a problem; however,\
    \ an imbalanced binary tree can be extremely deep and therefore expensive to iterate\
    \ recursively.\n\n### Guidelines\n\n**CONSIDER using nonrecursive algorithms when\
    \ iterating over potentially deep data structures.**\n\n### Advanced/Beginner\
    \ Topic: `struct` versus `class`\n\nAn interesting side effect of defining `Pair<T>`\
    \ as a `struct` rather than as a `class` is that `SubItems.First` and `SubItems.Second`\
    \ cannot be assigned directly, even if the setter were public. If you modify the\
    \ setter to be public, the following code will produce a compile error indicating\
    \ that `SubItems` cannot be modified “because it is not a variable”:\n\n```sharp\n\
    jfkFamilyTree.SubItems.First =\nnew BinaryTree<string>(\n\"Joseph Patrick Kennedy\"\
    );\n```\n\nThe issue is that `SubItems` is a property of type `Pair<T>`, a `struct`.\
    \ Therefore, when the property returns the value, a copy of `SubItems` is made,\
    \ and assigning `First` on a copy that is promptly lost at the end of the statement\
    \ would be misleading. Fortunately, the C# compiler prevents this error.\n\nTo\
    \ overcome the issue, don’t assign `First` (see the approach in `[LISTING 17.17](#ch17.html_list17_17)`),\
    \ use `class` rather than `struct` for `Pair<T>`, don’t create a `SubItems` property\
    \ and instead use a field, or provide properties in `BinaryTree<T>` that give\
    \ direct access to `SubItems` members.\n\n#### Canceling Further Iteration: `yield\
    \ break`\n\nSometimes you might want to cancel further iteration. You can do so\
    \ by including an `if` statement so that no further statements within the code\
    \ are executed. However, you can also use `yield break` to cause `MoveNext()`\
    \ to return `false` and control to return immediately to the caller and end the\
    \ loop. `[LISTING 17.18](#ch17.html_list17_18)` shows an example of such a method.\n\
    \n**LISTING 17.18: Escaping Iteration via `yield break`**\n\n```sharp\npublic\
    \ System.Collections.Generic.IEnumerable<T> GetNotNullEnumerator()\n{\n    if\
    \ ((First == null) || (Second == null))                             \n    {  \
    \                                                                  \n        yield\
    \ break;                                                     \n    }         \
    \                                                           \n    yield return\
    \ Second;\n    yield return First;\n}\n```\n\nThis method cancels the iteration\
    \ if either of the elements in the `Pair<T>` class is `null`.\n\nA `yield break`\
    \ statement is similar to placing a `return` statement at the top of a function\
    \ when it is determined that there is no work to do. It is a way to exit from\
    \ further iterations without surrounding all remaining code with an `if` block.\
    \ As such, it allows multiple exits. Use it with caution, because a casual reading\
    \ of the code may overlook the early exit.\n\n### Advanced Topic: How Iterators\
    \ Work\n\nWhen the C# compiler encounters an iterator, it expands the code into\
    \ the appropriate CIL for the corresponding enumerator design pattern. In the\
    \ generated code, the C# compiler first creates a nested private class to implement\
    \ the `IEnumerator<T>` interface, along with its `Current` property and a `MoveNext()`\
    \ method. The `Current` property returns a type corresponding to the return type\
    \ of the iterator. In `[LISTING 17.14](#ch17.html_list17_14)` of `Pair<T>`, an\
    \ iterator returns a `T` type. The C# compiler examines the code contained within\
    \ the iterator and creates the necessary code within the `MoveNext` method and\
    \ the `Current` property to mimic its behavior. For the `Pair<T>` iterator, the\
    \ C# compiler generates roughly equivalent code (see `[LISTING 17.19](#ch17.html_list17_19)`).\n\
    \n**LISTING 17.19: C# Equivalent of Compiler-Generated Code**\n\n```sharp\nusing\
    \ System;\nusing System.Collections;\nusing System.Collections.Generic;\n// ...\n\
    \    [NullableContext(1)]\n    [Nullable(0)]\n    public struct Pair<T> : IPair<T>,\
    \ IEnumerable<T>, IEnmerrable\n    {\n        public Pair(T first, T second)\n\
    \        {\n            First = first;\n            Second = second;\n       \
    \ }\n\n        public T First { get; }\n\n        public T Second { get; }\n\n\
    \        public T this[PairItem index]\n        {\n            get\n         \
    \   {\n                PairItem pairItem = index;\n                PairItem pairItem2\
    \ = pairItem;\n                T result;\n                if (pairItem2 != PairItem.First)\n\
    \                {\n                    if (pairItem2 != PairItem.Second)\n  \
    \                  {\n                        throw new NotImplementedException(\n\
    \                            string.Format(\n                                \"\
    The enum {0} has not been implemented\", \n                                index.ToString()));\n\
    \                    }\n                    result = Second;\n               \
    \ }\n                else\n                {\n                    result = First;\n\
    \                }\n                return result;\n            }\n        }\n\
    \n        public IEnumerator<T> GetEnumerator()\n        {\n            yield\
    \ return First;\n            yield return Second;\n            yield break;\n\
    \        }\n\n        IEnumerator IEnumerable.GetEnumerator()\n        {\n   \
    \         return GetEnumerator();\n        }\n    }\n}\n```\n\nBecause the compiler\
    \ takes the `yield return` statement and generates classes that correspond to\
    \ what you probably would have written manually, iterators in C# exhibit the same\
    \ performance characteristics as classes that implement the enumerator design\
    \ pattern manually. Although there is no performance improvement, the gains in\
    \ programmer productivity are significant.\n\n### Advanced Topic: Contextual Keywords\n\
    \nMany C# keywords are “reserved” and cannot be used as identifiers unless preceded\
    \ with an `@` sign. The `yield` keyword is a contextual keyword, not a reserved\
    \ keyword; thus, it is legal (though confusing) to declare a local variable called\
    \ `yield`. In fact, all the keywords added to C# after version 1.0 have been contextual\
    \ keywords; this helps prevent accidental breakages when upgrading existing programs\
    \ to use new versions of the language.\n"
