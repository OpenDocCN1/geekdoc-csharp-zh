  trans: "\n\n```c\nusing System;\nusing System.Collections.Generic;\nusing System.Linq;\n\
    // ...\n        IEnumerable<Patent> patents = PatentData.Patents;\n        bool\
    \ result;\n        patents = patents.Where(\n            patent =>\n         \
    \   {\n                if(result =\n                    patent.YearOfPublication.StartsWith(\"\
    18\"))\n                {\n                    // 谓词中的此类副作用\n                \
    \    // 在此处被用于演示一个\n                    // 原则，通常应该\n                    // 避免\n\
    \                    Console.WriteLine(\"\\t\" + patent);\n                }\n\
    \                return result;\n            });\n\n        Console.WriteLine(\"\
    1\\. 1900 年以前的专利有:\");\n        foreach(Patent patent in patents)\n        {\n\
    \        }\n\n        Console.WriteLine();\n        Console.WriteLine(\n     \
    \       \"2\\. 1900 年以前专利的第二次列表：\");\n        Console.WriteLine(\n           \
    \ $@\"   有 { patents.Count()\n                } 个 1900 年以前的专利。\");\n\n       \
    \ Console.WriteLine();\n        Console.WriteLine(\n            \"3\\. 1900 年以前专利的第三次列表：\"\
    );\n        patents = patents.ToArray();\n        Console.Write(\"   有 \");\n\
    \        Console.WriteLine(\n            $\"{ patents.Count() } 个 1900 年以前的专利。\"\
    );\n\n        //...\n```\n\n**输出 15.4**\n\n```\n1\\. 1900 年以前的专利有：\n        Phonograph\
    \ (1877)\n        Kinetoscope (1888)\n        Electrical Telegraph (1837)\n  \
    \      Steam Locomotive (1815)\n\n2\\. 1900 年以前专利的第二次列表：\n        Phonograph (1877)\n\
    \        Kinetoscope (1888)\n        Electrical Telegraph (1837)\n        Steam\
    \ Locomotive (1815)\n   有 4 个 1900 年以前的专利。\n\n3\\. 1900 年以前专利的第三次列表：\n       \
    \ Phonograph (1877)\n        Kinetoscope (1888)\n        Electrical Telegraph\
    \ (1837)\n        Steam Locomotive (1815)\n   有 4 个 1900 年以前的专利。\n```\n\n注意 `Console.WriteLine(\"\
    1\\. Patents prior...)` 是在 lambda 表达式之前执行的。识别这一特性非常重要，因为对于那些不知道其重要性的人来说，这并不明显。通常情况下，谓词应该只做一件事——评估条件——并且不应该有任何副作用（即使像示例那样打印到控制台）。\n\
    \n为了理解正在发生什么，请记住 lambda 表达式是委托——方法的引用——是可以传递的。在 `LINQ` 和标准查询操作符的范围内，每个 lambda\
    \ 表达式都构成了待执行整体查询的一部分。\n\n在声明时，lambda 表达式并不会执行。事实上，直到 lambda 表达式被调用，其内部的代码才会开始执行。图\
    \ 15.2 显示了操作序列。\n\n![Images](img/15fig02.jpg)\n\n**图 15.2：调用 lambda 表达式的操作序列**\n\
    \n如图 15.2 所示，列表 15.14 中的三次调用触发了 lambda 表达式，而且每次执行都是相当隐式的。如果 lambda 表达式的开销很大（例如调用数据库），那么减少\
    \ lambda 表达式的执行就会变得非常重要。\n\n首先，执行是在 `foreach` 循环内部触发的。正如章节早期描述，`foreach` 循环被分解为\
    \ `MoveNext()` 调用，每次调用都会导致原始集合中的每个项执行 lambda 表达式。在迭代期间，运行时会为每个项调用 lambda 表达式，以确定该项是否满足谓词。\n\
    \n其次，对 `Enumerable` 的 `Count()`（函数）的调用再次触发每个项的 lambda 表达式。同样，这是一种微妙的行为，因为 `Count`（属性）在未使用标准查询操作符查询的集合上非常常见。\n\
    \n第三，对 `ToArray()`（或 `ToList()`、`ToDictionary()` 或 `ToLookup()`）的调用会评估每个项的 lambda\
    \ 表达式。然而，使用这些“To”方法之一转换集合是非常有帮助的。这样做返回一个标准查询操作符已经执行完毕的集合。在列表 15.14 中，转换为数组意味着当在最后的\
    \ `Console.WriteLine()` 中调用 `Length` 时，`patents` 指向的底层对象实际上是一个数组（它显然实现了 `IEnumerable<T>`）；反，调用的是\
    \ `System.Array` 的 `Length` 实现而不是 `System.Linq.Enumerable` 的实现。因此，在转换为由“To”方法返回的集合类型之后，通常处理该集合是安全的（直到调用另一个标准查询操作符为止）。但是，请注意这会将整个结果集加载到内存中（在此步骤之前，它可能由数据库或文件支持）。此外，“To”方法将获取底层数据的快照，因此在重新查询“To”方法的结果时，将不会返回新的结果。\n\
    \n我们强烈建议你查看序列图。\n"
- fmt: "\n`OrderBy()` returns an `IOrderedEnumerable<T>` interface, not an `IEnumerable<T>`.\
    \ Furthermore, `IOrderedEnumerable<T>` derives from `IEnumerable<T>`, so all the\
    \ standard query operators (including `OrderBy()`) are available on the `OrderBy()`\
    \ return. However, repeated calls to `OrderBy()` would undo the work of the previous\
    \ call such that the end result would sort by only the `keySelector` in the final\
    \ `OrderBy()` call. For this reason, you should be careful not to call `OrderBy()`\
    \ on a previous `OrderBy()` call.\n\nInstead, you should specify additional sorting\
    \ criteria using `ThenBy()`. Although `ThenBy()` is an extension method, it is\
    \ not an extension of `IEnumerable<T>` but rather of `IOrderedEnumerable<T>`.\
    \ The method, also defined on `System.Linq.Extensions.Enumerable`, is declared\
    \ as follows:\n\n```cs\n public static IOrderedEnumerable<TSource>\nThenBy<TSource,\
    \ TKey>(\nthis IOrderedEnumerable<TSource> source,\n   Func<TSource, TKey> keySelector)\n\
    ```\n\nIn summary, use `OrderBy()` first, followed by zero or more calls to `ThenBy()`\
    \ to provide additional sorting “columns.” The methods `OrderByDescending()` and\
    \ `ThenByDescending()` provide the same functionality except that they sort items\
    \ in descending order. Mixing and matching ascending and descending methods is\
    \ not a problem, but if sorting items further, you would use a `ThenBy()` call\
    \ (either ascending or descending).\n\nTwo more important notes about sorting\
    \ are warranted. First, the actual sort doesn’t occur until you begin to access\
    \ the members in the collection, at which point the entire query is processed.\
    \ You can’t sort unless you have all the items to sort, because you can’t determine\
    \ whether you have the first item. The fact that sorting is delayed until you\
    \ begin to access the members is due to deferred execution, as described earlier\
    \ in this chapter. Second, each subsequent call to sort the data (e.g., `Orderby()`\
    \ followed by `ThenBy()` followed by `ThenByDescending()`) does involve additional\
    \ calls to the `keySelector` lambda expression of the earlier sorting calls. In\
    \ other words, a call to `OrderBy()` will call its corresponding `keySelector`\
    \ lambda expression once you iterate over the collection. Furthermore, a subsequent\
    \ call to `ThenBy()` will again make calls to `OrderBy()`’s `keySelector`.\n\n\
    ## Guidelines\n\n**DO NOT call an `OrderBy()` following a prior `OrderBy()` method\
    \ call. Use `ThenBy()` to sequence items by more than one value.**\n\n## Beginner\
    \ Topic: Join Operations\n\nConsider two collections of objects as shown in the\
    \ Venn diagram in [FIGURE 15.3](#ch15.html_ch15fig03). The left circle in the\
    \ diagram includes all inventors, and the right circle contains all patents. The\
    \ intersection includes both inventors and patents, and a line is formed for each\
    \ case where there is a match of inventors to patents. As the diagram shows, each\
    \ inventor may have multiple patents and each patent can have one or more inventors.\
    \ Each patent has an inventor, but in some cases, inventors do not yet have patents.\n\
    \n![Images](graphics/15fig03.jpg)\n\n**FIGURE 15.3: Venn diagram of inventor and\
    \ patent collections**\n\nMatching up inventors within the intersection to patents\
    \ is an **inner join**. The result is a collection of inventor/patent pairs in\
    \ which both patents and inventions exist for a pair. A **left outer join** includes\
    \ all the items within the left circle regardless of whether they have a corresponding\
    \ patent. In this particular example, a **right outer join** would be the same\
    \ as an inner join because there are no patents without inventors. Furthermore,\
    \ the designation of left versus right is arbitrary, so there is really no distinction\
    \ between left and outer joins. A **full outer join**, however, would include\
    \ records from both outer sides; it is relatively rare to perform a full outer\
    \ join.\n\nAnother important characteristic in the relationship between inventors\
    \ and patents is that it is a **many-to-many** relationship. Each individual patent\
    \ can have one or more inventors (e.g., the flying machine’s invention by both\
    \ Orville and Wilbur Wright). Furthermore, each inventor can have one or more\
    \ patents (e.g., Benjamin Franklin’s invention of both bifocals and the phonograph).\n\
    \nAnother common relationship is a **one-to-many** relationship. For example,\
    \ a company department may have many employees. However, each employee can belong\
    \ to only one department at a time. (However, as is common with one-to-many relationships,\
    \ adding the factor of time can transform them into many-to-many relationships.\
    \ A particular employee may move from one department to another so that, over\
    \ time, she could potentially be associated with multiple departments, making\
    \ another many-to-many relationship.)\n\n[LISTING 15.18](#ch15.html_list15_18)\
    \ provides a sample listing of employee and department data, and [OUTPUT 15.6](#ch15.html_op15_6)\
    \ shows the results.\n\n**LISTING 15.18: Sample Employee and Department Data**\n\
    \n```cs\npublic class Program\n{\n    public static void Main()\n    {\n     \
    \   IEnumerable<Department> departments =\n            CorporateData.Departments;\n\
    \        Print(departments);\n\n        Console.WriteLine();\n\n        IEnumerable<Employee>\
    \ employees =\n            CorporateData.Employees;\n        Print(employees);\n\
    \    }\n\n    private static void Print<T>(IEnumerable<T> items)\n    {\n    \
    \    foreach(T item in items)\n        {\n            Console.WriteLine(item);\n\
    \        }\n    }\n}\n```\n\n**OUTPUT 15.6**\n\n```\nCorporate\nHuman Resources\n\
    Engineering\nInformation Technology\nPhilanthropy\nMarketing\n\nMark Michaelis\
    \ (Chief Nerd)\nMichael Stokes (Senior Wizard)\nBrian Jones (Enterprise Guru)\n\
    Anne Beard (HR Director)\nPat Dever (Enterprise Architect)\nKevin Bost (Programmer\
    \ Extraordinaire)\nThomas Heavey (Software Architect)\nEric Edmonds (Philanthropy\
    \ Coordinator)\n```\n\nWe use this data in the example in the following section\
    \ on joining.\n\n### Performing an Inner Join with `Join()`\n\nIn the world of\
    \ objects on the client side, relationships between objects are already set up.\
    \ For example, the relationship between files and the directories in which they\
    \ reside are preestablished with the `DirectoryInfo.GetFiles()` method and the\
    \ `FileInfo.Directory` method, respectively. Frequently, however, this is not\
    \ the case with data being loaded from nonobject stores. Instead, the data needs\
    \ to be joined together so that you can navigate from one type of object to the\
    \ next in a way that makes sense for the data.\n\nConsider the example of employees\
    \ and company departments. In [LISTING 15.19](#ch15.html_list15_19), we join each\
    \ employee to his her department and then list each employee with his or her department.\
    \ Since each employee belongs to only one (and exactly one) department, the total\
    \ number of items in the list is equal to the total number of employees—each employee\
    \ appears only once (each employee is said to be **normalized**). [OUTPUT 15.7](#ch15.html_op15_7)\
    \ shows the results.\n\n**LISTING 15.19: An Inner Join Using `System.Linq.Enumerable.Join()`**\n\
    \n```cs\nusing System;\nusing System.Collections.Generic;\nusing System.Linq;\n\
    // ...\n        Department[] departments = CorporateData.Departments;\n      \
    \  Employee[] employees = CorporateData.Employees;\n\n        IEnumerable<(int\
    \ Id, string Name, string Title,\n            Department Department)> items =\n\
    \            employees.Join(\n                departments,\n                employee\
    \ => employee.DepartmentId,\n                department => department.Id,\n  \
    \              (employee, department) => (\n                    employee.Id,\n\
    \                    employee.Name,\n                    employee.Title,\n   \
    \                 department\n                ));\n\n        foreach ((int Id,\
    \ string Name, string Title, Department Department) item in items)\n        {\n\
    \            Console.WriteLine(\n                $\"{item.Name} ({item.Title})\"\
    );\n            Console.WriteLine(\"\\t\" + item.Department);\n        }\n   \
    \ }\n    //...\n```\n\n**OUTPUT 15.7**\n"
