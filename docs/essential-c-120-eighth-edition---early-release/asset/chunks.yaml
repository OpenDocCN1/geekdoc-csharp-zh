  trans: "\n\n在 LISTING 16.1 中，`where` 子句过滤掉保留关键字，但不过滤上下文关键字。该子句对集合进行“垂直”过滤：如果你将集合视为一个垂直的项列表，`where`\
    \ 子句会使该垂直列表变短，从而集合包含更少的项。过滤标准通过 `predicate`（谓词）表示——这是一个返回 `bool` 的 lambda 表达式，例如\
    \ `word.Contains()`（如 LISTING 16.1 所示）或 `File.GetLastWriteTime(fileName) < DateTime.Now.AddMonths(-1)`。后者在\
    \ LISTING 16.6 所示，其输出显示在 OUTPUT 16.5 中。\n\n#### LISTING 16.6: 使用 `where` 的查询表达式过滤\n\
    \n```csharp\nusing System;\nusing System.Collections.Generic;\nusing System.IO;\n\
    using System.Linq;\n// ...\n    public static void FindMonthOldFiles(\n      \
    \  string rootDirectory, string searchPattern)\n    {\n        IEnumerable<FileInfo>\
    \ files =\n            from fileName in Directory.EnumerateFiles(\n          \
    \      rootDirectory, searchPattern)\n            where File.GetLastWriteTime(fileName)\
    \ <                    \n                DateTime.Now.AddMonths(-1)          \
    \                   \n            select new FileInfo(fileName);\n\n        foreach(FileInfo\
    \ file in files)\n        {\n            //  为了简化，假设当前目录\n            //  是 rootDirectory\
    \ 的子目录\n            string relativePath = file.FullName.Substring(\n         \
    \       Directory.GetCurrentDirectory().Length);\n            Console.WriteLine(\n\
    \                $\".{ relativePath } ({ file.LastWriteTime })\");\n        }\n\
    \    }\n    //...\n```\n\n#### OUTPUT 16.5\n\n```\n.\\TestData\\Bill.cs (8/10/2011\
    \ 9:33:55 PM)\n.\\TestData\\Contact.cs (8/19/2011 11:40:30 PM)\n.\\TestData\\\
    Employee.cs (8/17/2011 1:33:22 AM)\n.\\TestData\\Person.cs (10/22/2011 10:00:03\
    \ PM)\n```\n\n#### 排序\n\n要使用查询表达式对项进行排序，可以使用 `orderby` 子句，如 LISTING 16.7 所示。\n\
    \n#### LISTING 16.7: 使用 `orderby` 子句的查询表达式排序\n\n```csharp\nusing System;\nusing\
    \ System.Collections.Generic;\nusing System.Linq;\nusing System.IO;\n// ...\n\
    \    public static void ListByFileSize1(\n        string rootDirectory, string\
    \ searchPattern)\n    {\n        IEnumerable<string> fileNames =\n           \
    \ from fileName in Directory.EnumerateFiles(\n                rootDirectory, searchPattern)\n\
    \            orderby (new FileInfo(fileName)).Length descending,           \n\
    \                fileName                                                   \n\
    \            select fileName;\n\n        foreach(string fileName in fileNames)\n\
    \        {\n            Console.WriteLine(fileName);\n        }\n    }\n    //...\n\
    ```\n\nLISTING 16.7 使用 `orderby` 子句对 `Directory.GetFiles()` 返回的文件首先按文件大小降序排序，然后按文件名升序排序。多个排序标准用逗号隔开，以便项先按大小排序，如果大小相同，则再按文件名排序。`ascending`\
    \ 和 `descending` 是指示排序方向的上下文关键字。指定顺序为升序或降序是可选的；如果省略了方向（在此处 `filename` 上被省略），则默认为\
    \ `ascending`。\n\n#### `let` 子句\n\nLISTING 16.8 包含一个与 LISTING 16.7 非常相似的查询，区别在于\
    \ `IEnumerable<T>` 的类型参数是 `FileInfo`。然而，这个查询存在一个问题：我们必须冗余地创建两次 `FileInfo`，分别在\
    \ `orderby` 子句和 `select` 子句中。\n\n#### LISTING 16.8: 投影 `FileInfo` 集合并按文件大小排序\n\
    \n```csharp\nusing System;\nusing System.Collections.Generic;\nusing System.Linq;\n\
    using System.IO;\n// ...\n    public static void ListByFileSize2(\n        string\
    \ rootDirectory, string searchPattern)\n    {\n        IEnumerable<FileInfo> files\
    \ =\n            from fileName in Directory.EnumerateFiles(\n                rootDirectory,\
    \ searchPattern)\n            orderby new FileInfo(fileName).Length, fileName\
    \              \n            select new FileInfo(fileName);                  \
    \             \n\n        foreach (FileInfo file in files) \n        {\n     \
    \       //  为了简化，假设当前目录\n            //  是 rootDirectory 的子目录\n            string\
    \ relativePath = file.FullName.Substring(\n                Directory.GetCurrentDirectory().Length);\n\
    \            Console.WriteLine(\n                $\".{ relativePath }({ file.Length\
    \ })\");\n        }\n    }\n    //...\n```\n\n遗憾的是，尽管结果是正确的，但 LISTING 16.8 最终为集合中的每个项实例化了两次\
    \ `FileInfo` 对象。为了避免这种不开销，可以使用 `let` 子句，如 LISTING 16.9 所示。\n\n#### LISTING 16.9:\
    \ 查询表达式中的结果排序\n\n```csharp\n//...\nIEnumerable<FileInfo> files =\n    from fileName\
    \ in Directory.EnumerateFiles(\n        rootDirectory, searchPattern)\n    let\
    \ file = new FileInfo(fileName)\n    orderby file.Length, fileName           \
    \                    \n    select file;\n//...\n```\n\n`let` 子句引入了一个新变量，用于存储查询剩余部分使用的表达式值。你可以根据需要添加任意多个\
    \ `let` 子句；只需将其插入到第一个 `from` 子句之后、最终的 `select` 子句之前。\n\n#### 分组\n\n一种常见的数据处理场景是相关项的分组。在\
    \ SQL 中，这通常涉及聚合项以产生摘要或总计。然而，LINQ 的表达能力明显更高。LINQ 表达式允许将项分组为系列子集合，然后这些组可以与查询中的项关联。例如，LISTING\
    \ 16.10 和 OUTPUT 16.6 展示了如何将上下文关键字和普通关键字分组在一起。\n\n#### LISTING 16.10: 将查询结果分组在一起\n\
    \n```csharp\nusing System;\nusing System.Collections.Generic;\nusing System.Linq;\n\
    // ...\n    private static void GroupKeywords()\n    {\n        IEnumerable<IGrouping<bool,\
    \ string>> selection =\n            from word in CSharp.Keywords\n           \
    \ group word by word.Contains('*');\n\n        foreach(IGrouping<bool, string>\
    \ wordGroup\n            in selection)\n        {\n            Console.WriteLine(Environment.NewLine\
    \ + \"{0}:\",\n                wordGroup.Key ?\n                    \"Contextual\
    \ Keywords\" : \"Keywords\");\n            foreach(string keyword in wordGroup)\n\
    \            {\n                Console.Write(\" \" +\n                    (wordGroup.Key\
    \ ?\n                        keyword.Replace(\"*\", null) : keyword));\n     \
    \       }\n        }\n    }\n    //...\n```\n"
- fmt: "\nThere are several things to note in [LISTING 16.10](#ch16.html_list16_10).\
    \ First, the query result is a sequence of elements of type `IGrouping<bool, string>`.\
    \ The first type argument indicates that the “group key” expression following\
    \ `by` was of type `bool`, and the second type argument indicates that the “group\
    \ element” expression following `group` was of type `string`. That is, the query\
    \ produces a sequence of groups where the Boolean key is the same for each `string`\
    \ in the group.\n\nBecause a query with a `group by` clause produces a sequence\
    \ of collections, the common pattern for iterating over the results is to create\
    \ nested `foreach` loops. In [LISTING 16.10](#ch16.html_list16_10), the outer\
    \ loop iterates over the groupings and prints out the type of keyword as a header.\
    \ The nested `foreach` loop prints each keyword in the group as an item below\
    \ the header.\n\nThe result of this query expression is itself a sequence, which\
    \ you can then query like any other sequence. [LISTING 16.11](#ch16.html_list16_11)\
    \ and [OUTPUT 16.7](#ch16.html_op16_7) show how to create an additional query\
    \ that adds a projection onto a query that produces a sequence of groups. (The\
    \ next section, on query continuations, shows a more pleasant syntax for adding\
    \ more query clauses to a complete query.)\n\n#### LISTING 16.11: Selecting a\
    \ Tuple Following the `group` Clause\n\n```c\nusing System;\nusing System.Collections.Generic;\n\
    using System.Linq;\n// ...\n    private static void GroupKeywords1()\n    {\n\
    \        IEnumerable<IGrouping<bool, string>> keywordGroups =              \n\
    \            from word in CSharp.Keywords                                  \n\
    \            group word by word.Contains('*');                             \n\n\
    \        IEnumerable<(bool IsContextualKeyword,                            \n\
    \            IGrouping<bool, string> Items)> selection =                   \n\
    \            from groups in keywordGroups                                  \n\
    \            select                                                        \n\
    \            (                                                             \n\
    \                IsContextualKeyword: groups.Key,                          \n\
    \                Items: groups                                             \n\
    \            );                                                            \n\n\
    \        foreach (\n            (bool isContextualKeyword, IGrouping<bool, string>\
    \ items)\n                in selection)\n        {\n\n            Console.WriteLine(Environment.NewLine\
    \ + \"{0}:\",\n                isContextualKeyword ?\n                    \"Contextual\
    \ Keywords\" : \"Keywords\");\n            foreach (string keyword in items) \
    \                            \n            {\n                Console.Write(\"\
    \ \" + keyword.Replace(\"*\", null));\n            }\n        }\n    }\n    //...\n\
    ```\n\n#### OUTPUT 16.7\n\n```\nKeywords:\n abstract as base bool break byte case\
    \ catch char checked class\nconst continue decimal default delegate do double\
    \ else enum\nevent explicit extern false finally fixed float for foreach goto\
    \ if\nimplicit in int interface internal is lock long namespace new null\noperator\
    \ out override object params private protected public\nreadonly ref return sbyte\
    \ sealed short sizeof stackalloc static\nstring struct switch this throw true\
    \ try typeof uint ulong unsafe\nushort using virtual unchecked void volatile while\n\
    Contextual Keywords:\n add alias ascending async await by descending dynamic equals\
    \ from\nget global group into join let nameof nonnull on orderby partial remove\n\
    select set value var where yield\n```\n\nThe `group` clause results in a query\
    \ that produces a collection of `IGrouping<TKey, TElement>` objects—just as the\
    \ `GroupBy()` standard query operator did (see [Chapter 15](#ch15.html_ch15)).\
    \ The `select` clause in the subsequent query uses a tuple to effectively rename\
    \ `IGrouping<TKey, TElement>.Key` to `IsContextualKeyword` and to name the subcollection\
    \ property `Items`. With this change, the nested `foreach` loop uses `wordGroup.Items`\
    \ rather than `wordGroup` directly, as shown in [LISTING 16.10](#ch16.html_list16_10).\
    \ Another potential item to add to the tuple would be a count of the items within\
    \ the subcollection. This functionality is already available through LINQ’s `wordGroup.Items.Count()`\
    \ method, however, so the benefit of adding it to the anonymous type directly\
    \ is questionable.\n\n#### Query Continuation with `into`\n\nAs we saw in [LISTING\
    \ 16.11](#ch16.html_list16_11), you can use an existing query as the input to\
    \ a second query. However, it is not necessary to write an entirely new query\
    \ expression when you want to use the results of one query as the input to another.\
    \ You can extend any query with a **query continuation clause** using the contextual\
    \ keyword `into`. A query continuation is nothing more than syntactic sugar for\
    \ creating two queries and using the first as the input to the second. The range\
    \ variable introduced by the `into` clause (`groups` in [LISTING 16.11](#ch16.html_list16_11))\
    \ becomes the range variable for the remainder of the query; any previous range\
    \ variables are logically a part of the earlier query and cannot be used in the\
    \ query continuation. [LISTING 16.12](#ch16.html_list16_12) rewrites the code\
    \ of [LISTING 16.11](#ch16.html_list16_11) to use a query continuation instead\
    \ of two queries.\n\n#### LISTING 16.12: Selecting without the Query Continuation\n\
    \n```csharp\nusing System;\nusing System.Collections.Generic;\nusing System.Linq;\n\
    // ...\n    private static void GroupKeywords1()\n    {\n        IEnumerable<(bool\
    \ IsContextualKeyword, \n            IGrouping<bool, string> Items)> selection\
    \ =\n            from word in CSharp.Keywords\n            group word by word.Contains('*')\
    \                           \n                into groups                    \
    \                        \n                select                            \
    \                     \n                (                                    \
    \                  \n                    IsContextualKeyword: groups.Key,    \
    \               \n                    Items: groups                          \
    \            \n                );                                            \
    \         \n        // ...\n    }\n    //...\n```\n\nThe ability to run additional\
    \ queries on the results of an existing query using `into` is not specific to\
    \ queries ending with `group` clauses, but rather can be applied to all query\
    \ expressions. Query continuation is simply a shorthand for writing query expressions\
    \ that consume the results of other query expressions. You can think of `into`\
    \ as a “pipeline operator,” because it “pipes” the results of the first query\
    \ into the second query. You can arbitrarily chain together many queries in this\
    \ way.\n\n#### Flattening Sequences of Sequences with Multiple `from` Clauses\n\
    \nIt is often desirable to “flatten” a sequence of sequences into a single sequence.\
    \ For example, each member of a sequence of customers might have an associated\
    \ sequence of orders, or each member of a sequence of directories might have an\
    \ associated sequence of files. The `SelectMany` sequence operator (discussed\
    \ in [Chapter 15](#ch15.html_ch15)) concatenates together all the subsequences;\
    \ to do the same thing with query expression syntax, you can use multiple `from`\
    \ clauses, as shown in [LISTING 16.13](#ch16.html_list16_13).\n\n#### LISTING\
    \ 16.13: Multiple Selection\n\n```csharp\nvar selection =\n    from word in CSharp.Keywords\n\
    \    from character in word                                            \n    select\
    \ character;\n```\n\nThe preceding query will produce the sequence of characters\
    \ `a`, `b`, `s`, `t`, `r`, `a`, `c`, `t`, `a`, `d`, d, *, `a, l`, i, ….\n\nMultiple\
    \ `from` clauses can also be used to produce a **Cartesian product**—the set of\
    \ all possible combinations of several sequences—as shown in [LISTING 16.14](#ch16.html_list16_14).\n\
    \n#### LISTING 16.14: Cartesian Product\n"
