    \ is called and not `System.Linq.Enumerable`’s implementation. Consequently, following\
    \ a conversion to one of the collection types returned by a “To” method, it is\
    \ generally safe to work with the collection (until another standard query operator\
    \ is called). However, be aware that this will bring the entire result set into\
