  trans: "\n\n```cs\nusing System;\n\npublic class Program\n{\n    public static void\
    \ Main()\n    {\n        var patent1 =                                       \
    \        \n            new                                                   \
    \  \n            {                                                       \n  \
    \              Title = \"Bifocals\",                                 \n      \
    \          YearOfPublication = \"1784\"                          \n          \
    \  };                                                      \n        var patent2\
    \ =                                               \n            new          \
    \                                           \n            {                  \
    \                                     \n                Title = \"Phonograph\"\
    ,                               \n                YearOfPublication = \"1877\"\
    \                          \n            };                                  \
    \                    \n        var patent3 =                                 \
    \              \n            new                                             \
    \        \n            {                                                     \
    \  \n                patent1.Title,                                      \n  \
    \              // Renamed to show property naming                  \n        \
    \        Year = patent1.YearOfPublication                    \n            };\
    \                                                      \n\n        Console.WriteLine(\n\
    \            $\"{ patent1.Title } ({ patent1.YearOfPublication })\");\n      \
    \  Console.WriteLine(\n            $\"{ patent2.Title } ({ patent2.YearOfPublication\
    \ })\");\n\n        Console.WriteLine();\n        Console.WriteLine(patent1);\n\
    \        Console.WriteLine(patent2);\n\n        Console.WriteLine();\n       \
    \ Console.WriteLine(patent3);\n    }\n}\n```\n\n**输出 15.13**\n\n```\nBifocals\
    \ (1784)\nPhonograph (1784)\n\n{ Title = Bifocals, YearOfPublication = 1784 }\n\
    { Title = Phonograph, YearOfPublication = 1877 }\n\n{ Title = Bifocals, Year =\
    \ 1784 }\n```\n\n匿名类型完全是 C# 的特性，而不是运行时中的一种新类型。当编译器遇到匿名类型语法时，它会生成一个 `CIL` 类，其属性与匿名类型声明中的具名值和数据类型相对应。\n\
    \n### 初学者主题：回顾隐式类型局部变量 (`var`)\n\n\n\n由于匿名类型没有名称，因此无法将局部变量显式地声明为匿名类型。相反，局部变量的类型被替换为\
    \ `var`。然而，这绝不意味着隐式类型变量是无类型的。相反，它们被完全类型化为其被赋值的值的数据类型。如果给隐式类型变量赋值一个匿名类型，则该局部变量声明的底层\
    \ `CIL` 代码将是编译器生成的类型。同样，如果给隐式类型变量赋值一个 `string`，其在底层 `CIL` 中的数据类型将是 `string`。事实上，对于赋值值不是匿名类型（例如\
    \ `string`）的隐式类型变量与使用显式类型声明的变量，其生成的 `CIL` 代码没有区别。如果声明语句是 `string text = \"This\
    \ is a test of the...\"`，生成的 `CIL` 代码将与隐式声明 `var text = \"This is a test of the...\"\
    ` 相同。\n\n编译器从赋值的表达式确定隐式类型变量的数据类型。在带有初始化器的显式类型局部变量（`string s = \"hello\";`）中，编译器首先根据左侧的声明类型确定\
    \ `s` 的类型，然后分析右侧并验证右侧表达式可以赋值该类型。在隐式类型局部变量中，这个过程在某种程度上是反向的。首先分析右侧以确定其类型，然后逻辑上将\
    \ `var` 替换为该类型。\n\n尽管 C# 没有为匿名类型包含名称，但它也是强类型的。例如，该类型的属性是可以完全访问的。在`代码列表 15.26`\
    \ 中，`patent1.Title` 和 `patent2.YearOfPublication` 在 `Console.WriteLine` 语句中被调用。任何调用不存在成员的尝试都会导致编译错误。即使是像\
    \ `Visual Studio` 等 IDE 中的智能感知（IntelliSense）也能处理匿名类型。\n\n你应该节节地使用隐式类型变量声明。显然，对于匿名类型，无法指定数据类型，必须使用\
    \ `var`。然而，如果数据类型不是匿名类型，通常使用显式数据类型是更好的选择。\n\n通常情况下，你应该关注如何提高代码语义的可读性，同时利用编译器来验证结果变量是否是你所预期的类型。要通过隐式类型局部变量实现这一点，请仅当赋值给隐式类型变量的类型完全显而易见时才使用它们。例如，在\
    \ `var items = new Dictionary<string, List<Account>>();` 中，生成的代码更加简洁易读。相比之下，当类型不明显时（例如赋值为方法的返回值），开发者应该倾向于使用显式的变量类型声明，如下：\n\
    \n```cs\nDictionary<string, List<Account>> dictionary = GetAccounts();\n```\n\n\
    #### 使用 LINQ 投影到匿名类型\n\n最后，利用匿名类型，我们可以创建一个 `IEnumerable<T>` 集合，其中 `T` 是匿名类型（参见`代码列表\
    \ 15.27` 和`输出 15.14`）。\n\n**代码列表 15.27：投影到匿名类型**\n\n```cs\n//...\nIEnumerable<string>\
    \ fileList = Directory.EnumerateFiles(\n    rootDirectory, searchPattern);\nvar\
    \ items = fileList.Select(                                           \n    file\
    \ =>                                                            \n    {      \
    \                                                            \n        FileInfo\
    \ fileInfo = new FileInfo(file);                        \n        return new \
    \                                                    \n        {             \
    \                                                  \n            FileName = fileInfo.Name,\
    \                                  \n            Size = fileInfo.Length      \
    \                               \n        };                                 \
    \                            \n    });                                       \
    \                       \n//...\n```\n\n**输出 15.14**\n\n```\n{ FileName = AssemblyInfo.cs,\
    \ Size = 1704 }\n{ FileName = CodeAnalysisRules.xml, Size = 735 }\n{ FileName\
    \ = CustomDictionary.xml, Size = 199 }\n{ FileName = EssentialCSharp.sln, Size\
    \ = 40415 }\n{ FileName = EssentialCSharp.suo, Size = 454656 }\n{ FileName = EssentialCSharp.vsmdi,\
    \ Size = 499 }\n{ FileName = EssentialCSharp.vssscc, Size = 256 }\n{ FileName\
    \ = intelliTechture.ConsoleTester.dll, Size = 24576 }\n{ FileName = intelliTechture.ConsoleTester.pdb,\
    \ Size = 30208 }\n```\n\n匿名类型的输出会自动将属性名及其值作为与该匿名类型相关的生成的 `ToString()` 方法的一部分显示出来。\n\
    \n使用 `Select()` 方法投影是非常强大的。我们已经看到过如何使用 `Where()` 标准查询操作符对集合进行垂直过滤（减少集合中的项数量）。现在，通过使用\
    \ `Select()` 标准查询操作符，我们还可以水平方向收缩小集合（产生更少的列）或完全转换数据。通过增加对匿名类型的支持，我们可以通过 `Select()`\
    \ 提取出任意的“对象”，仅提取原始集合中当前算法所需的部分，而无需声明一个来包含这些内容的类。\n\n#### 关于匿名类型和隐式局部变量的更多信息\n\n"
- fmt: "\nIn [LISTING 15.26](#ch15.html_list15_26), member names for the anonymous\
    \ types are explicitly identified using the assignment of the value to the name\
    \ for `patent1` and `patent2` (e.g., `Title = \"Phonograph\"`). However, if the\
    \ value assigned is a property or field call, the name may default to the name\
    \ of the field or property rather than explicitly specifying the value. For example,\
    \ `patent3` is defined using a property named `Title` rather than an assignment\
    \ to an explicit name. As [OUTPUT 15.13](#ch15.html_op15_13) shows, the resultant\
    \ property name is determined, by the compiler, to match the property from where\
    \ the value was retrieved.\n\nBoth `patent1` and `patent2` have the same property\
    \ names with the same data types. Therefore, the C# compiler generates only one\
    \ data type for these two anonymous declarations. In contrast, `patent3` forces\
    \ the compiler to create a second anonymous type because the property name for\
    \ the patent year is different from that in `patent1` and `patent2`. Furthermore,\
    \ if the order of the properties were switched between `patent1` and `patent2`,\
    \ these two anonymous types would not be type-compatible. In other words, the\
    \ requirements for two anonymous types to be type-compatible within the same assembly\
    \ are a match in property names, data types, and order of properties. If these\
    \ criteria are met, the types are compatible, even if they appear in different\
    \ methods or classes. [LISTING 15.28](#ch15.html_list15_28) demonstrates the type\
    \ incompatibilities.\n\n### LISTING 15.28: Type Safety and Immutability of Anonymous\
    \ Types\n\n```c\npublic class Program\n{\n    public static void Main()\n    {\n\
    \        var patent1 =\n            new\n            {\n                Title\
    \ = \"Bifocals\",\n                YearOfPublication = \"1784\"\n            };\n\
    \n        var patent2 =\n            new\n            {\n                YearOfPublication\
    \ = \"1877\",\n                Title = \"Phonograph\"\n            };\n\n    \
    \    var patent3 =\n            new\n            {\n                patent1.Title,\n\
    \                Year = patent1.YearOfPublication\n            };\n\n        //\
    \ ERROR: Cannot implicitly convert type\n        //        'AnonymousType#1' to\
    \ 'AnonymousType#2'\n        //patent1 = patent2; //won't compile if uncommented\n\
    \        // ERROR: Cannot implicitly convert type\n        //        'AnonymousType#1'\
    \ to 'AnonymousType#3'\n        //patent1 = patent3; //won't compile if uncommented\n\
    \n        // ERROR: Property or indexer 'AnonymousType#1.Title'\n        //  \
    \      cannot be assigned to -- it is read-only'\n        //patent1.Title = \"\
    Swiss Cheese\";\n            //won't compile if uncommented\n    }\n}\n```\n\n\
    The first two compile-time errors assert that the types are not compatible, so\
    \ they will not successfully convert from one to the other. The third compile-time\
    \ error is caused by the reassignment of the `Title` property. Anonymous types\
    \ are immutable, so it is a compile-time error to change a property on an anonymous\
    \ type once it has been instantiated.\n\nAlthough not shown in [LISTING 15.28](#ch15.html_list15_28),\
    \ it is not possible to declare a method with an implicit data type parameter\
    \ (`var`). Therefore, instances of anonymous types can be passed outside the method\
    \ in which they are created in only two ways. First, if the method parameter is\
    \ of type `object`, the anonymous type instance may be passed outside the method\
    \ because the anonymous type will convert implicitly. A second way is to use method\
    \ type inference, whereby the anonymous type instance is passed as a method type\
    \ parameter that the compiler can successfully infer. Thus, calling `void Method<T>(T\
    \ parameter)` using `Function(patent1)` would succeed, although the available\
    \ operations on `parameter` within `Function()` are limited to those supported\
    \ by `object`.\n\nAlthough C# allows anonymous types such as the ones shown in\
    \ [LISTING 15.26](#ch15.html_list15_26), it is generally not recommended that\
    \ you define them in this way. Anonymous types provide critical functionality\
    \ with support for projections^([11](#ch15.html_fn15_11)) such as joining/associating\
    \ collections, as we discuss later in the chapter. Nevertheless, you should generally\
    \ reserve anonymous type definitions for circumstances where they are required,\
    \ such as aggregation of data from multiple types.\n\n[11](#ch15.html_fn15_11a).\
    \ Starting in C# 3.0.\n\nAt the time that anonymous types were introduced, they\
    \ were a breakthrough that solved an important problem: declaring a temporary\
    \ type on the fly without the ceremony of having to declare a full type. Even\
    \ so, they have several drawbacks, as detailed earlier. Fortunately, tuples^([12](#ch15.html_fn15_12))\
    \ avoid these drawbacks and, in fact, essentially obviate the need for using anonymous\
    \ types altogether. Specifically, tuples have the following advantages over anonymous\
    \ types:\n\n[12](#ch15.html_fn15_12a). Starting in C# 7.0.\n\n- Provide a named\
    \ type that can be used anywhere a type can be used, including declarations and\
    \ type parameters\n- Available outside the method in which they are instantiated\n\
    - Avoid type “pollution” with types that are generated but rarely used\n\nOne\
    \ way in which tuples differ from anonymous types is that anonymous types are\
    \ reference types and tuples are value types. Whether this difference is advantageous\
    \ to one approach or other depends on the performance characteristics. If the\
    \ memory footprint is more than 128 bits, a reference type is likely. Otherwise,\
    \ using a tuple will most likely be better.\n\n### Advanced Topic: Anonymous Type\
    \ Generation\n\nEven though `Console.WriteLine()`’s implementation is to call\
    \ `ToString()`, notice in [LISTING 15.26](#ch15.html_list15_26) that the output\
    \ from `Console.WriteLine()` is not the fully qualified data type name. Rather,\
    \ the output is a list of `PropertyName = value` pairs, one for each property\
    \ on the anonymous type. This occurs because the compiler overrides `ToString()`\
    \ in the anonymous type, so as to format the `ToString()` output as shown. Similarly,\
    \ the generated type includes overriding implementations for `Equals()` and `GetHashCode()`.\n\
    \nThe implementation of `ToString()` on its own is an important reason that variation\
    \ in the order of properties causes a new data type to be generated. If two separate\
    \ anonymous types, possibly in entirely separate types and even in separate namespaces,\
    \ were unified and then the order of properties changed, changes in the order\
    \ of properties on one implementation would have noticeable and possibly unacceptable\
    \ effects on the other’s `ToString()` results. Furthermore, at execution time,\
    \ it is possible to reflect back on a type and examine the members of a type—even\
    \ to call one of these members dynamically (determining at runtime which member\
    \ to call). A variation in the order of members of seemingly identical types could\
    \ then trigger unexpected results. To avoid this problem, the C# designers decided\
    \ to generate two different types.\n\n### Advanced Topic: Collection Initializers\
    \ with Anonymous Types\n\nYou cannot have a collection initializer for an anonymous\
    \ type, since the collection initializer requires a constructor call, and it is\
    \ impossible to name the constructor. The workaround is to define a method such\
    \ as `static List<T> CreateList<T>(T t) { return new List<T>(); }`. Method type\
    \ inference allows the type parameter to be implied rather than specified explicitly,\
    \ so this workaround successfully allows for the creation of a collection of anonymous\
    \ types.\n\nAnother approach to initializing a collection of anonymous types is\
    \ to use an array initializer. As it is not possible to specify the data type\
    \ in the constructor, array initialization syntax allows for anonymous array initializers\
    \ using `new[]` (see [LISTING 15.29](#ch15.html_list15_29)).\n\n**LISTING 15.29:\
    \ Initializing Anonymous Type Arrays**\n"
