    \ PairItem.First:\n                    return First;\n                case PairItem.Second:\n\
    \                    return Second;\n                default:\n              \
    \      throw new NotImplementedException(\n                        $\"The enum\
    \ { index.ToString() } has not been imple\nmented\");\n\n            }\n     \
    \   }\n        // ...\n    }                                                 \
    \             \n}\n```\n\nAn indexer is declared much as a property is declared,\
    \ except that instead of the name of the property, you use the keyword `this`\
    \ followed by a parameter list in square brackets. The body is also like a property,\
    \ with `get` and `set` blocks. As [LISTING 17.9](#ch17.html_list17_9) shows, the\
    \ parameter does not have to be an `int`. In fact, the index can take multiple\
    \ parameters and can even be overloaded. This example uses an `enum` to reduce\
    \ the likelihood that callers will supply an index for a nonexistent item.\n\n\
    The Common Intermediate Language (CIL) code that the C# compiler creates from\
    \ an index operator is a special property called `Item` that takes an argument.\
    \ Properties that accept arguments cannot be created explicitly in C#, so the\
    \ `Item` property is unique in this aspect. Any additional member with the identifier\
    \ `Item`, even if it has an entirely different signature, will conflict with the\
    \ compiler-created member, so it will not be allowed.\n\n**Advanced Topic: Assigning\
    \ the Indexer Property Name Using `IndexerName`**\n\nAs indicated earlier, the\
    \ CIL property name for an indexer defaults to `Item`. Using the `IndexerNameAttibute`,\
    \ you can specify a different name, however. [LISTING 17.10](#ch17.html_list17_10),\
    \ for example, changes the name to `\"Entry\"`.\n\n**LISTING 17.10: Changing the\
    \ Indexer’s Default Name**\n\n```\n[System.Runtime.CompilerServices.IndexerName(\"\
    Entry\")]\npublic T this[PairItem index]\n{\n    // ...\n}\n```\n\nThis makes\
    \ no difference to C# callers of the index, but it specifies the name for languages\
    \ that do not support indexers directly.\n\nThe `IndexerNameAttibute` is merely\
    \ an instruction to the compiler to use a different name for the indexer; the\
    \ attribute is not actually emitted into metadata by the compiler, so it is not\
    \ available via reflection.\n\n**Advanced Topic: Defining an Index Operator with\
    \ Variable Parameters**\n\nAn index operator can also take a variable parameter\
    \ list. For example, [LISTING 17.11](#ch17.html_list17_11) defines an index operator\
    \ for `BinaryTree<T>`, discussed in [Chapter 12](#ch12.html_ch12) (and again in\
    \ the next section).\n\n**LISTING 17.11: Defining an Index Operator with Variable\
    \ Parameters**\n\n```\nusing System;\n\npublic class BinaryTree<T> \n{\n    //\
    \ ...\n    public BinaryTree<T> this[params PairItem[]? branches]\n    {\n   \
    \     get\n        {\n            BinaryTree<T> currentNode = this;\n\n      \
    \      // Allow either an empty array or null\n            // to refer to the\
    \ root node\n            int totalLevels = branches?.Length ?? 0;\n          \
    \  int currentLevel = 0;\n\n            while (currentLevel < totalLevels)\n \
    \           {\n                System.Diagnostics.Debug.Assert(branches != null,\n\
    \                    $\"{ nameof(branches) } != null\");\n\n                currentNode\
    \ = currentNode.SubItems[\n                    branches[currentLevel]];\n    \
    \            if (currentNode == null)\n                {\n                   \
    \ // The binary tree at this location is null\n                    throw new IndexOutOfRangeException();\n\
    \                }\n                currentLevel++;\n            }\n         \
    \   return currentNode;\n        }\n    }\n    // ...\n}\n```\n\nEach item within\
    \ `branches` is a `PairItem` and indicates which branch to navigate down in the\
    \ binary tree. For example,\n\n```\ntree[PairItem.Second, PairItem.First].Value\n\
    ```\n\nwill retrieve the value located at the second item in the first branch,\
    \ followed by the first branch within that branch.\n\n### Returning `null` or\
    \ an Empty Collection\n\nWhen returning an array or collection, you must indicate\
    \ that there are zero items by returning either `null` or a collection instance\
    \ with no items. The better choice, in general, is to return a collection instance\
    \ with no items. In so doing, you avoid forcing the caller to check for `null`\
    \ before iterating over the items in the collection. For example, given a zero-size\
    \ `IEnumerable<T>` collection, the caller can immediately and safely use a `foreach`\
    \ loop over the collection without concern that the generated call to `GetEnumerator()`\
    \ will throw a `NullReferenceException`. Consider using the `Enumerable.Empty<T>()`\
    \ method to easily generate an empty collection of a given type.\n\nOne of the\
    \ few times to deviate from this guideline is when `null` is intentionally indicating\
    \ something different from zero items. For example, a collection of user names\
    \ for a website might be `null` to indicate that an up-to-date collection could\
    \ not be obtained for some reason; that is semantically different from an empty\
    \ collection.\n\n**Guidelines**\n\n**DO NOT represent an empty collection with\
    \ a `null` reference.**\n\n**CONSIDER using the `Enumerable.Empty<T>()` method\
    \ instead.**\n\n### Iterators\n\n[Chapter 15](#ch15.html_ch15) went into detail\
    \ on the internals of the `foreach` loop. This section discusses how to use **iterators**\
    \ to create your own implementation of the `IEnumerator<T>`, `IEnumerable<T>`,\
    \ and corresponding nongeneric interfaces for custom collections. Iterators provide\
    \ clean syntax for specifying how to iterate over data in collection classes,\
    \ especially using the `foreach` loop. The iterator allows end users of a collection\
    \ to navigate its internal structure without knowledge of that structure.\n\n\
    **Advanced Topic: Origin of Iterators**\n\nIn 1972, Barbara Liskov and a team\
    \ of scientists at MIT began researching programming methodologies, focusing on\
    \ user-defined data abstractions. To prove much of their work, they created a\
    \ language called CLU that had a concept called “clusters” (*CLU* being the first\
    \ three letters of this term). Clusters were predecessors to the primary data\
    \ abstraction that programmers use today: objects.\n\nDuring their research, the\
    \ team realized that although they were able to use the CLU language to abstract\
    \ some data representation away from end users of their types, they consistently\
    \ found themselves having to reveal the inner structure of their data to allow\
    \ others to intelligently consume it. The result of their consternation was the\
    \ creation of a language construct called an *iterator*. (The CLU language offered\
    \ many insights into what would eventually be popularized as object-oriented programming.)"
