  trans: "\n\n在 LISTING 15.26 中，匿名类型的成员名通过为 `patent1` 和 `patent2` 的名称赋值值来显式标识（例如 `Title\
    \ = \"Phonograph\"`）。然而，如果赋值的值是属性或字段调用，则名称可能默认为字段或属性的名称，而不是显式指定值。例如，`patent3`\
    \ 是使用一个名为 `Title` 的属性定义的，而不是赋值给显式名称。如 OUTPUT 15.13 所示，结果属性名由编译器确定，以与获取值处的属性相匹配。\n\
    \n`patent1` 和 `patent2` 具有相同的属性名和相同的数据类型。因此，C# 编译器仅为这两个匿名声明生成一个数据类型。相比之下，`patent3`\
    \ 强制编译器创建第二个匿名类型，因为专利年份的属性名与 `patent1` 和 `patent2` 中的不同。此外，如果交换 `patent1` 和 `patent2`\
    \ 之间的属性顺序，这两个匿名类型将不具有类型兼容性。换句话说，两个匿名类型在同一程序集中具有类型兼容性的要求是：属性名、数据类型和属性顺序必须匹配。如果满足这些标准，类型就是兼容的，即使它们出现在不同的方法或类中。LISTING\
    \ 15.28 展示了这些类型不兼容的情况。\n\n### LISTING 15.28: 匿名类型的类型安全与不可变性\n\n```csharp\npublic\
    \ class Program\n{\n    public static void Main()\n    {\n        var patent1\
    \ =\n            new\n            {\n                Title = \"Bifocals\",\n \
    \               YearOfPublication = \"1784\"\n            };\n\n        var patent2\
    \ =\n            new\n            {\n                YearOfPublication = \"1877\"\
    ,\n                Title = \"Phonograph\"\n            };\n\n        var patent3\
    \ =\n            new\n            {\n                patent1.Title,\n        \
    \        Year = patent1.YearOfPublication\n            };\n\n        // ERROR:\
    \ Cannot implicitly convert type\n        //        'AnonymousType#1' to 'AnonymousType#2'\n\
    \        //patent1 = patent2; //won't compile if uncommented\n        // ERROR:\
    \ Cannot implicitly convert type\n        //        'AnonymousType#1' to 'AnonymousType#3'\n\
    \        //patent1 = patent3; //won't compile if uncommented\n\n        // ERROR:\
    \ Property or indexer 'AnonymousType#1.Title'\n        //        cannot be assigned\
    \ to -- it is read-only'\n        //patent1.Title = \"Swiss Cheese\";\n      \
    \      //won't compile if uncommented\n    }\n}\n```\n\n前两个编译时错误断言类型是不兼容的，因此它们无法成功地从一个转换为另一个。第三个编译时错误是由重新赋值\
    \ `Title` 属性引起的。匿名类型是不可变的，因此，一旦实例化了匿名类型，更改其属性就是编译时错误。\n\n虽然在 LISTING 15.28 中未显示，但无法声明带有隐式数据类型参数（`var`）的方法。因此，匿名类型的实例只有通过两种方式可以传递到创建它的方法之外。首先，如果方法参数类型为\
    \ `object`，则匿名类型实例可以传递到方法之外，因为匿名类型将隐式转换。第二方法是使用方法类型推断，将匿名类型实例作为方法类型参数传递，编译器可以成功推断。因此，使用\
    \ `Function(patent1)` 调用 `void Method<T>(T parameter)` 将成功，尽管在 `Function()` 内部对\
    \ `parameter` 的可用操作限于 `object` 支持的操作。\n\n尽管 C# 允许像 LISTING 15.26 所示的匿名类型，但通常不建议以这种方式定义它们。匿名类型提供了关键功能，并支持投影^(11)，例如集合的连接/关联，正如我们在章节后面部分讨论的。尽管如此，你通常应该将匿名类型的定义留给需要它们的情况，例如从多个类型中聚合数据。\n\
    \n11。从 C# 3.0 开始。\n\n在匿名类型引入时，它们是一项解决重要问题的突破：即时声明临时类型，而无需声明完整类型的繁琐过程。尽管如此，正如前面详细描述的，它们有几个缺点。幸运的是，元组^(12)\
    \ 避免了这些缺点，实际上基本上消除了对使用匿名类型的需要。具体而言，元组相比匿名类型具有以下优势：\n\n12。从 C# 7.0 开始。\n\n- 提供了命名的类型，可以在任何可以使用类型的地方使用，包括声明和类型参数\n\
    - 在其实化的方法之外可用\n- 避免了由于生成但很少使用的类型导致的类型“污染”\n\n元组与匿名类型的不同之处是，匿名类型是引用类型，而元组是值类型。这种差异对某一种方法还是另一种方法有利，取决于性能特征。如果内存占用超过\
    \ 128 位，则可能是引用类型。否则，使用元组可能更好。\n\n### 高级主题：匿名类型的生成\n\n尽管 `Console.WriteLine()`\
    \ 的实现是调用 `ToString()`，但在 LISTING 15.26 中注意，输出并不是完全限定的数据类型名称。相反，输出是 `属性名 = 值` 的列表，对应匿名类型上的每个属性。这种现象是因为编译器在匿名类型中重写了\
    \ `ToString()`，以便格式化输出所示。同样，生成的类型还包含 `Equals()` 和 `GetHashCode()` 的重写实现。\n\n`ToString()`\
    \ 方法本身是导致属性顺序变化产生新数据类型的重要原因。如果两个独立的匿名类型（可能在完全不同的类型甚至命名空间中）被统一，然后更改属性顺序，会对另一个实现的\
    \ `ToString()` 产生明显且可能不可接受的影响。此外，在执行期间，可以对类型进行反射并检查成员——甚至是动态调用这些成员之一（在运行时确定调用哪个成员）。相同类型的成员顺序变化可能会触发意外的结果。为了避免这个问题，C#\
    \ 设计者决定生成不同的类型。\n\n### 高级主题：匿名类型的集合初始化器\n\n你无法为匿名类型使用集合初始化器，因为集合初始化器需要调用构造函数，而构造函数无法命名。解决方法是定义一个如\
    \ `static List<T> CreateList<T>(T t) { return new List<T>(); }` 的方法。方法类型推断允许类型参数被隐含而不是显式指定，因此这种变通方法成功允许创建匿名类型的集合。\n\
    \n另一种初始化匿名类型集合的方法是使用数组初始化器。由于无法在构造函数指定数据类型，数组初始化语法允许使用 `new[]` 初始化匿名数组（参见 LISTING\
    \ 15.29）。\n\n**LISTING 15.29: 初始化匿名类型数组**\n\n"
- fmt: "\n```\nusing System;\nusing System.Collections.Generic;\n\npublic class Program\n\
    {\n    public static void Main()\n    {\n        var worldCup2006Finalists = new[]\n\
    \        {\n            new\n            {\n                TeamName = \"France\"\
    ,\n                Players = new string[]\n                {\n               \
    \     \"Fabien Barthez\", \"Gregory Coupet\",\n                    \"Mickael Landreau\"\
    , \"Eric Abidal\",\n                    // ...\n                }\n          \
    \  },\n            new\n            {\n                TeamName = \"Italy\",\n\
    \                Players = new string[]\n                {\n                 \
    \   \"Gianluigi Buffon\", \"Angelo Peruzzi\",\n                    \"Marco Amelia\"\
    , \"Cristian Zaccardo\",\n                    // ...\n                }\n    \
    \        }\n        };\n\n        Print(worldCup2006Finalists);\n    }\n\n   \
    \ private static void Print<T>(IEnumerable<T> items)\n    {\n        foreach(T\
    \ item in items)\n        {\n            Console.WriteLine(item);\n        }\n\
    \    }\n}\n```\n\nThe resultant variable is an array of the anonymous type `items`,\
    \ which must be homogeneous because it is an array.\n\n### Summary\n\nThis chapter\
    \ described the internals of how the `foreach` loop works and explained which\
    \ interfaces are required for its execution. In addition, developers frequently\
    \ filter a collection so that there are fewer items and project the collection\
    \ so that the items take a different form. Toward that end, this chapter discussed\
    \ the details of how to use the standard query operators—`LINQ` introduced collection\
    \ extension methods on the `System.Linq.Enumerable` class—to perform collection\
    \ manipulation.\n\nIn the introduction to standard query operators, we detailed\
    \ the process of deferred execution and emphasized how developers should take\
    \ care to avoid unintentionally re-executing an expression via a subtle call that\
    \ enumerates over the collection contents. The deferred execution and resultant\
