    \            \n    }\n\n    private static void Print<T>(\n            string\
    \ format, IEnumerable<T> items)\n            where T : notnull =>\n        Console.WriteLine(format,\
    \ string.Join(\n            \", \", items));\n    // ...\n}\n```\n\n# OUTPUT 15.12\n\
    \n```\nStuff: System.Object, 1, 3, 5, 7, 9, \"thing\"\n24c24a41-ee05-41b9-958e-50dd12e3981e\n\
    Even integers: 0, 2, 4, 6, 8\nOdd integers: 1, 3, 5, 7, 9\nUnion of odd and even:\
    \ 0, 2, 4, 6, 8, 1, 3, 5, 7, 9\nUnion with even: 0, 2, 4, 6, 8, 1, 3, 5, 7, 9\n\
    Concat with odd: 0, 2, 4, 6, 8, 1, 3, 5, 7, 9, 1, 3, 5, 7, 9\nIntersection with\
    \ even: 0, 2, 4, 6, 8\nDistinct: 0, 2, 4, 6, 8, 1, 3, 5, 7, 9\nCollection \"SequenceEquals\"\
    \ numbers.Concat(odd).Distinct())\nReverse: 9, 7, 5, 3, 1, 8, 6, 4, 2, 0\nAverage:\
    \ 4.5\nSum: 45\nMax: 9\nMin: 0\n```\n\nLISTING 15.25 中的任何 API 调用都不需要 lambda 表达式。TABLE\
    \ 15.1 和 TABLE 15.2 描述了每个方法并并了示例。`System.Linq.Enumerable` 中包含了一组聚合函数，这些函数会枚举集合并计算出一个结果（如\
    \ TABLE 15.2 所示）。`Count` 是章节中已经过的聚合函数的一个示例。\n\n# TABLE 15.1: 更简单的标准查询运算符\n\n![Images](img/15tab01.jpg)\n\
    \n# TABLE 15.2: `System.Linq.Enumerable` 上的聚合函数\n\n![Images](img/15tab02.jpg)\n\
    \n注意 TABLE 15.1 和 TABLE 15.2 中列出的每个方法都会触发延迟执行。\n\n## 高级主题：针对 `IQueryable<T>` 的\
    \ `Queryable` 扩展\n\n与 `IEnumerable<T>` 几乎相同的接口是 `IQueryable<T>`。由于 `IQueryable<T>`\
    \ 派自 `IEnumerable<T>`，它拥有所有直接声明的 `IEnumerable<T>` 成员（例如 `GetEnumerator()`）。然而，扩展方法是不被继承的，因此\
    \ `IQueryable<T>` 没有 `Enumerable` 扩展方法。尽管如此，它有一个类似的扩展类 `System.Linq.Enumerable`。\n\
    \n### 使用 LINQ 的匿名类型\n\n为了支持 LINQ 这一高级 API，语言仅进行了八种新的增强。(9) 这些增强中的两种是匿名类型和隐式局部变量。尽管如此，匿名类型已被\
    \ C# 元组语法的引入所掩盖。(10) 事实上，在本书第六版中，所有利用匿名类型的 LINQ 示例已更新为使用元组。\n\n本章剩余部分将涵盖匿名类型主题，以便在处理\
    \ C# 7.0 之前的代码时仍能理解匿名类型语言功能。\n\n#### 匿名类型\n\n匿名类型是由编译器声明的数据类型，而不是通过 第 6 章 的显式类定义的。与匿名函数一样，当编译器看到匿名类型时，它会完成该类的创建并让你像显式声明的那样使用它。LISTING\
    \ 15.26 显示了这样的声明。相应的输出如 OUTPUT 15.13 所示。\n\n# LISTING 15.26: 使用匿名类型的隐式局部变量\n\n"
- fmt: "\n```cs\nusing System;\n\npublic class Program\n{\n    public static void\
    \ Main()\n    {\n        var patent1 =                                       \
    \        \n            new                                                   \
    \  \n            {                                                       \n  \
    \              Title = \"Bifocals\",                                 \n      \
    \          YearOfPublication = \"1784\"                          \n          \
    \  };                                                      \n        var patent2\
    \ =                                               \n            new          \
    \                                           \n            {                  \
    \                                     \n                Title = \"Phonograph\"\
    ,                               \n                YearOfPublication = \"1877\"\
    \                          \n            };                                  \
    \                    \n        var patent3 =                                 \
    \              \n            new                                             \
    \        \n            {                                                     \
    \  \n                patent1.Title,                                      \n  \
    \              // Renamed to show property naming                  \n        \
    \        Year = patent1.YearOfPublication                    \n            };\
    \                                                      \n\n        Console.WriteLine(\n\
    \            $\"{ patent1.Title } ({ patent1.YearOfPublication })\");\n      \
    \  Console.WriteLine(\n            $\"{ patent2.Title } ({ patent2.YearOfPublication\
    \ })\");\n\n        Console.WriteLine();\n        Console.WriteLine(patent1);\n\
    \        Console.WriteLine(patent2);\n\n        Console.WriteLine();\n       \
    \ Console.WriteLine(patent3);\n    }\n}\n```\n\n**OUTPUT 15.13**\n\n```\nBifocals\
    \ (1784)\nPhonograph (1784)\n\n{ Title = Bifocals, YearOfPublication = 1784 }\n\
    { Title = Phonograph, YearOfPublication = 1877 }\n\n{ Title = Bifocals, Year =\
    \ 1784 }\n```\n\nAnonymous types are purely a C# feature, not a new kind of type\
    \ in the runtime. When the compiler encounters the anonymous type syntax, it generates\
    \ a `CIL` class with properties corresponding to the named values and data types\
    \ in the anonymous type declaration.\n\n### Beginner Topic: Implicitly Typed Local\
    \ Variables Reviewed (`var`)\n\nBecause an anonymous type has no name, it is not\
    \ possible to declare a local variable as explicitly being of an anonymous type.\
    \ Rather, the local variable’s type is replaced with `var`. However, by no means\
    \ does this indicate that implicitly typed variables are untyped. On the contrary,\
    \ they are fully typed to the data type of the value they are assigned. If an\
    \ implicitly typed variable is assigned an anonymous type, the underlying `CIL`\
    \ code for the local variable declaration will be of the type generated by the\
    \ compiler. Similarly, if the implicitly typed variable is assigned a `string`,\
    \ its data type in the underlying `CIL` will be a `string`. In fact, there is\
    \ no difference in the resultant `CIL` code for implicitly typed variables whose\
    \ assignment is not an anonymous type (such as `string`) and those that are declared\
    \ with an explicit type. If the declaration statement is `string text = \"This\
    \ is a test of the...\"`, the resultant `CIL` code will be identical to an implicitly\
    \ typed declaration, `var text = \"This is a test of the...\"`.\n\nThe compiler\
    \ determines the data type of the implicitly typed variable from the expression\
    \ assigned. In an explicitly typed local variable with an initializer (`string\
    \ s = \"hello\";`), the compiler first determines the type of `s` from the declared\
    \ type on the left-hand side, then analyzes the right-hand side and verifies that\
    \ the expression on the right-hand side is assignable to that type. In an implicitly\
    \ typed local variable, the process is in some sense reversed. First, the right-hand\
    \ side is analyzed to determine its type, and then the `var` is logically replaced\
    \ with that type.\n\nAlthough C# does not include a name for the anonymous type,\
    \ it is strongly typed as well. For example, the properties of the type are fully\
    \ accessible. In `LISTING 15.26`, `patent1.Title` and `patent2.YearOfPublication`\
    \ are called within the `Console.WriteLine` statement. Any attempts to call nonexistent\
    \ members will result in compile-time errors. Even IntelliSense in IDEs such as\
    \ `Visual Studio` works with the anonymous type.\n\nYou should use implicitly\
    \ typed variable declarations sparingly. Obviously, for anonymous types, it is\
    \ not possible to specify the data type, and the use of `var` is required. However,\
    \ if the data type is not an anonymous type, it is frequently preferable to use\
    \ the explicit data type.\n\nAs is the case generally, you should focus on making\
    \ the semantics of the code more readable while also using the compiler to verify\
    \ that the resultant variable is of the type you expect. To accomplish this with\
    \ implicitly typed local variables, use them only when the type assigned to the\
    \ implicitly typed variable is entirely obvious. For example, in `var items =\
    \ new Dictionary<string, List<Account>>();`, the resultant code is more succinct\
    \ and readable. In contrast, when the type is not obvious, such as when a method\
    \ return is assigned, developers should favor an explicit variable type declaration\
    \ such as the following:\n\n```cs\nDictionary<string, List<Account>> dictionary\
    \ = GetAccounts();\n```\n\n#### Selecting into Anonymous Types with LINQ\n\nLastly,\
    \ capitalizing on anonymous types, we could create an `IEnumerable<T>` collection\
    \ where `T` is an anonymous type (see `LISTING 15.27` and `OUTPUT 15.14`).\n\n\
    **LISTING 15.27: Projection to an Anonymous Type**\n\n```cs\n//...\nIEnumerable<string>\
    \ fileList = Directory.EnumerateFiles(\n    rootDirectory, searchPattern);\nvar\
    \ items = fileList.Select(                                           \n    file\
    \ =>                                                            \n    {      \
    \                                                            \n        FileInfo\
    \ fileInfo = new FileInfo(file);                        \n        return new \
    \                                                    \n        {             \
    \                                                  \n            FileName = fileInfo.Name,\
    \                                  \n            Size = fileInfo.Length      \
    \                               \n        };                                 \
    \                            \n    });                                       \
    \                       \n//...\n```\n\n**OUTPUT 15.14**\n\n```\n{ FileName =\
    \ AssemblyInfo.cs, Size = 1704 }\n{ FileName = CodeAnalysisRules.xml, Size = 735\
    \ }\n{ FileName = CustomDictionary.xml, Size = 199 }\n{ FileName = EssentialCSharp.sln,\
    \ Size = 40415 }\n{ FileName = EssentialCSharp.suo, Size = 454656 }\n{ FileName\
    \ = EssentialCSharp.vsmdi, Size = 499 }\n{ FileName = EssentialCSharp.vssscc,\
    \ Size = 256 }\n{ FileName = intelliTechture.ConsoleTester.dll, Size = 24576 }\n\
    { FileName = intelliTechture.ConsoleTester.pdb, Size = 30208 }\n```\n\nThe output\
    \ of an anonymous type automatically shows the property names and their values\
    \ as part of the generated `ToString()` method associated with the anonymous type.\n\
    \nProjection using the `Select()` method is very powerful. We already saw how\
    \ to filter a collection vertically (reducing the number of items in the collection)\
    \ using the `Where()` standard query operator. Now, by using the `Select()` standard\
    \ query operator, we can also reduce the collection horizontally (making fewer\
    \ columns) or transform the data entirely. By adding support of anonymous types,\
    \ we can `Select()` an arbitrary “object” by extracting only those pieces of the\
    \ original collection that are desirable for the current algorithm but without\
    \ having to declare a class to contain them.\n\n#### More about Anonymous Types\
    \ and Implicit Local Variables\n"
