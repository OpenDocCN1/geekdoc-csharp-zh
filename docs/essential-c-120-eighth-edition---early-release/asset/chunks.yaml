  trans: "\n\n`for` 循环同步且顺序地执行每次迭代。然而，由于圆周率计算算法将圆周率计算分为相互独立的部分，只要结果按正确的顺序追加，就没有必要按顺序计算这些部分。想象一下，如果能够让此循环的所有迭代并发运行会发生什么呢：每个处理器可以获取单次迭代，并与其执行其他迭代的处理器并行执行任务。鉴于迭代的并行执行，我们可以根据处理器的数量不断缩短执行时间。\n\
    \n任务并行库（TPL）提供了一个方便的方法 `Parallel.For()`，它恰恰可以实现这一点。代码列表 21.2 显示了如何修改 代码列表 21.1\
    \ 中的顺序单线程程序，以使用该辅助方法。\n\n### 代码列表 21.2：分段并行使用 `For` 循环计算圆周率\n\n```\nusing System;\n\
    using System.Threading.Tasks;                                            \nusing\
    \ AddisonWesley.Michaelis.EssentialCSharp.Shared;\n\n//...\n\npublic class Program\n\
    {\n    const int TotalDigits = 100;\n    const int BatchSize = 10;\n\n    public\
    \ static void Main()\n    {\n        string pi = \"\";\n        const int iterations\
    \ = TotalDigits / BatchSize;\n        string[] sections = new string[iterations];\n\
    \        Parallel.For(0, iterations, i =>                                 \n \
    \       {                                                                \n  \
    \          sections[i] = PiCalculator.Calculate(                        \n   \
    \             BatchSize, i * BatchSize);                               \n    \
    \    });                                                               \n\n  \
    \      pi = string.Join(\"\", sections);\n        Console.WriteLine(pi);\n   \
    \ }\n}\n```\n\n代码列表 21.2 的输出与 输出 21.2 相同；然而，如果你有多个 CPU，其执行时间将显著加快（如果没有则可能会变慢）。`Parallel.For()`\
    \ API 设计得与标准的 `for` 循环相似。第一个参数是 `fromInclusive` 值，第二个是 `toExclusive` 值，最后一个是作为循环体执行的\
    \ `Action<int>`。当使用表达式 Lambda 表达式执行操作时，代码看起来类似于 `for` 语句，不同之处现在每次迭代可能会并行执行。与 `for`\
    \ 循环一样，`Parallel.For()` 的调用在所有迭代完成之前不会结束。换句话说，当执行到达 `string.Join()` 语句时，圆周率的所有部分都计算完毕。\n\
    \n注意，合并圆周率各个部分的代码不再出现在 代码列表 21.2 的迭代（`action`）内部。由于圆周率计算部分很可能不会按顺序完成，每次迭代完成后就追加部分可能会导致顺序错乱。即使顺序不是问题，仍然存在潜在的竞态条件，因为\
    \ 代码列表 21.1 中的 `+=` 操作不是原子的。为了解决这两个问题，圆周率的每个部分都存储在数组中，没有两个或多个迭代会同时数组中的同一个元素。只有当所有圆周率部分计算完成后，`string.Join()`\
    \ 才会将它们合并。换句话说，我们将合并部分推迟到 `Parallel.For()` 循环完成之后。这避免了由于部分尚未计算或部分合并顺序错误而引起的任何竞态条件。\n\
    \nTPL 使用与任务调度中相同的线程池技术，以确保并行循环的良好性能：它会尝试确保 CPU 不被过度调度等。\n\n### 指南\n\n**当所执行的计算可以很容易拆分为许多相互独立的、处理器密集型计算，且可以在任何线程上按任何顺序执行时，请务使用并行循环。**\n\
    \nTPL 还提供了 `foreach` 语句的类似并行版本，如 代码列表 21.3 所示。\n\n### 代码列表 21.3：`foreach` 循环的并行执行\n\
    \n```\nusing System;\nusing System.Collections.Generic;\nusing System.IO;\nusing\
    \ System.Threading.Tasks;                                               \n\npublic\
    \ class Program\n{\n    // ...\n    public static void EncryptFiles(\n       \
    \ string directoryPath, string searchPattern)\n\n    {\n        IEnumerable<string>\
    \ files = Directory.EnumerateFiles(\n            directoryPath, searchPattern,\n\
    \            SearchOption.AllDirectories);\n\n        Parallel.ForEach(files,\
    \ fileName =>                                \n        {                     \
    \                                             \n            Encrypt(fileName);\
    \                                             \n        });                  \
    \                                              \n    }\n    // ...\n}\n```\n\n\
    在这个示例中，我们调用了一个加密 `files` 集合中每个文件的方法。它是并行执行的，执行次数取决于 TPL 认为最高效的线程数量。\n\n### 高级主题：TPL\
    \ 如何调优自身性能\n\nTPL 内部的默认调度器针对线程池，产生了一多种启发式方法，尝试确保任何时刻都有正确数量的线程在执行。它使用的两种启发式方法是**山爬（hill\
    \ climbing）**和**工作窃取（work stealing）**。\n\n山爬算法涉及创建线程来运行任务，然后监控这些任务的性能，以实验性的确定增加更多线程开始导致性能变差的点。一旦达到该点，线程数量就可以减少到产生最佳性能的数量。\n\
    \nTPL 不会将等待执行的顶层任务与任何特定线程关联。然而，如果在线程上运行的任务本身创建了另一个任务，则新创建的任务会自动与该线程关联。当新的子任务最终调度运行时，它通常在创建它的任务的同一线程上运行。工作窃取算法识别出待处理工作异常多或异常少的线程；关联任务过少的线程有时会从等待运行任务过线程中“窃取”任务。\n\
    \n这些算法的关键特性是它们使 TPL 能够动态调优自身性能，以缓解处理器过度调度或调度不足，并在处理器之间平衡工作。\n\nTPL 通常在调优自身性能方面做得很好，但通过提供关于最佳操作方案的提示，你可以帮助做得更好。在第\
    \ 19 章“长时间任务”节中描述的 TPL `TaskCreationOptions.LongRunning` 选项就是此类提示的示例。你还可以显式地告诉任务调度器你认为最适合并行循环的线程数量；更多信息请参见本章后面的。\n\
    \n### 初学者主题：使用 `AggregateException` 处理并行循环异常\n\nTPL 将任务相关的异常保存在 `AggregateException`\
    \ 中，因为给定的任务可能会从其子任务中获取多个异常。并行执行循环也是如此：每次迭代都可能产生异常，因此需要将异常收集到一个聚合异常中。考虑 代码列表 21.4\
    \ 中的示例及其在 输出 21.2 中的结果。\n\n**代码列表 21.4：并行迭代的未处理异常处理**\n\n"
- fmt: "\n```assembly\nusing System;\nusing System.Collections.Generic;\nusing System.IO;\n\
    using System.Threading.Tasks;                                        \n\npublic\
    \ static class Program\n{\n    // ...\n    static void EncryptFiles(\n       \
    \ string directoryPath, string searchPattern)\n    {\n        IEnumerable<string>\
    \ files = Directory.EnumerateFiles(\n            directoryPath, searchPattern,\n\
    \            SearchOption.AllDirectories);\n        try\n        {\n         \
    \   Parallel.ForEach(files, fileName =>\n            {\n                Encrypt(fileName);\n\
    \            });\n        }\n        catch (AggregateException exception)    \
    \                     \n        {\n            Console.WriteLine(\n          \
    \      \"ERROR: {0}:\",\n                exception.GetType().Name);\n        \
    \    foreach(Exception item in\n                exception.InnerExceptions)   \
    \                        \n            {\n                Console.WriteLine(\"\
    \  {0} - {1}\",\n                    item.GetType().Name, item.Message);\n   \
    \         }\n        }\n    }\n    // ...\n}\n```\n\nOUTPUT 21.2\n\n```\nERROR:\
    \ AggregateException:\n  UnauthorizedAccessException - Attempted to perform an\
    \ unauthorized\noperation.\n  UnauthorizedAccessException - Attempted to perform\
    \ an unauthorized\noperation.\n  UnauthorizedAccessException - Attempted to perform\
    \ an unauthorized\noperation.\n```\n\n[`OUTPUT 21.2](#ch21.html_op21_2)` shows\
    \ that three exceptions occurred while executing the `Parallel.ForEach<T>(...)`\
    \ loop. However, the code shows only one catch, of type `System.AggregateException`.\
    \ The `UnauthorizedAccessException`s were retrieved from the `InnerExceptions`\
    \ property on the `AggregateException`. With a `Parallel.ForEach<T>()` loop, each\
    \ iteration could potentially throw an exception, so the `System.AggregateException`\
    \ thrown by the method call will contain each of those exceptions within its `InnerExceptions`\
    \ property.\n\n### Canceling a Parallel Loop\n\nUnlike a task, which requires\
    \ an explicit call if it is to block until it completes, a parallel loop executes\
    \ iterations in parallel but does not itself return until the entire parallel\
    \ loop completes. Canceling a parallel loop, therefore, generally involves the\
    \ invocation of the cancellation request from a thread other than the one executing\
    \ the parallel loop. In [LISTING 21.5](#ch21.html_list21_5), we invoke `Parallel.ForEach<T>()`\
    \ using `Task.Run()`. In this manner, not only does the query execute in parallel,\
    \ but it also executes asynchronously, allowing the code to prompt the user to\
    \ “Press any key to exit.”\n\nLISTING 21.5: Canceling a Parallel Loop\n\n```assembly\n\
    using System;\nusing System.Collections.Generic;\nusing System.IO;\nusing System.Threading;\n\
    using System.Threading.Tasks;\n\npublic class Program\n{\n    // ...\n\n    static\
    \ void EncryptFiles(\n        string directoryPath, string searchPattern)\n  \
    \  {\n\n        string stars =\n            \"*\".PadRight(Console.WindowWidth\
    \ - 1, '*');\n\n        IEnumerable<string> files = Directory.GetFiles(\n    \
    \       directoryPath, searchPattern,\n           SearchOption.AllDirectories);\n\
    \n        CancellationTokenSource cts =                                    \n\
    \            new CancellationTokenSource();                               \n \
    \       ParallelOptions parallelOptions =                                \n  \
    \          new ParallelOptions { CancellationToken = cts.Token };       \n   \
    \     cts.Token.Register(                                              \n    \
    \        () => Console.WriteLine(\"Canceling...\"));                    \n\n \
    \       Console.WriteLine(\"Press ENTER to exit.\");\n\n        Task task = Task.Run(()\
    \ =>\n            {\n                try\n                {\n                \
    \    Parallel.ForEach(\n                        files, parallelOptions,      \
    \                    \n                        (fileName, loopState) =>\n    \
    \                    {\n                            Encrypt(fileName);\n     \
    \                   });\n                }\n                catch(OperationCanceledException)\
    \ { }\n            });\n\n        // Wait for the user's input\n        Console.ReadLine();\n\
    \n        // Cancel the query\n        cts.Cancel();                         \
    \                           \n        Console.Write(stars);\n        task.Wait();\n\
    \    }\n    // ...\n}\n```\n\nThe parallel loops use the same cancellation token\
    \ pattern that tasks use. The token obtained from a `CancellationTokenSource`\
    \ is associated with the parallel loop by calling an overload of the `ForEach()`\
    \ method that has a parameter of type `ParallelOptions`. This object contains\
    \ the cancellation token.\n\nNote that if you cancel a parallel loop operation,\
    \ any iterations that have not started yet are prevented from starting by checking\
    \ the `IsCancellationRequested` property. Existing executing iterations will run\
    \ to their respective termination points. Furthermore, calling `Cancel()` even\
    \ after all iterations have completed will still cause the registered cancel event\
    \ (via `cts.Token.Register()`) to execute.\n\nThe only means by which the `ForEach()`\
    \ method is able to acknowledge that the loop has been canceled is via the `OperationCanceledException`.\
    \ Given that cancellation in this example is expected, the exception is caught\
    \ and ignored, allowing the application to display “Canceling…”, followed by a\
    \ line of stars before exiting.\n\n### Advanced Topic: Parallel Loop Options\n\
    \nAlthough not generally necessary, it is possible to control the maximum degree\
    \ of parallelism (i.e., the number of threads that are scheduled to run at the\
    \ same time) via the `ParallelOptions` parameter on overloads of both the `Parallel.For()`\
    \ and `Parallel.ForEach<T>()` loops. In some specific cases, the developer may\
    \ know more about the particular algorithm or circumstance such that changing\
    \ the maximum degree of parallelism makes sense. These circumstances include the\
    \ following:\n\n- Scenarios where you want to disable parallelism to make debugging\
    \ or analysis easier. Setting the maximum degree of parallelism to 1 ensures that\
    \ the loop iterations do not run concurrently.\n- Scenarios where you know ahead\
    \ of time that the degree of parallelism will be gated on an external factor such\
    \ as a hardware constraint. For example, if your parallel operation involves using\
    \ multiple USB ports, there might be no point in creating more threads than there\
    \ are available ports.\n- Scenarios with really-running loop iterations (e.g.,\
    \ minutes or hours). The thread pool can’t distinguish long-running iterations\
    \ from blocked operations, so it could end up introducing many new threads, all\
    \ of which will be consumed by the `for` loop. This can result in incremental\
    \ thread growth over time, resulting in a huge number of threads in the process.\n\
    \nAnd so on. To control the maximum degree of parallelism, use the `MaxDegreeOfParallelism`\
    \ property on the `ParallelOptions` object.\n\nYou can also use the `ParallelOptions`\
    \ object’s `TaskScheduler` property to specify a custom task scheduler to use\
    \ when scheduling the tasks associated with each iteration. For example, you might\
    \ have an asynchronous event handler that responds to the user’s click of a Next\
    \ button. If the user clicks the button several times, you might want to use a\
    \ custom task scheduler that prioritizes the most recently created task rather\
    \ than prioritizing the task that has waited the longest. The task scheduler provides\
    \ a means of specifying how the tasks will execute in relation to one another.\n\
    \nThe `ParallelOptions` object also has a `CancellationToken` property that provides\
    \ a mechanism to communicate to the loop that no further iterations should start.\
    \ Additionally, the body of an iteration can watch the cancellation token to determine\
    \ if an early exit from the iteration is in order.\n"
