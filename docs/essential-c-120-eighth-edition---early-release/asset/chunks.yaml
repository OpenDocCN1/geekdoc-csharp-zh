    \ of patents prior to the 1900s:\n        Phonograph (1877)\n        Kinetoscope\
    \ (1888)\n        Electrical Telegraph (1837)\n        Steam Locomotive (1815)\n\
    \   There are 4 patents prior to 1900.\n```\n\nNotice that `Console.WriteLine(\"\
    1\\. Patents prior...)` executes before the lambda expression. This characteristic\
    \ is very important to recognize because it is not obvious to those who are unaware\
    \ of its importance. In general, predicates should do exactly one thing—evaluate\
    \ a condition—and should not have any side effects (even printing to the console,\
    \ as in this example).\n\nTo understand what is happening, recall that lambda\
    \ expressions are delegates— references to methods—that can be passed around.\
    \ In the context of LINQ and standard query operators, each lambda expression\
    \ forms part of the overall query to be executed.\n\nAt the time of declaration,\
    \ lambda expressions are not executed. In fact, it isn’t until the lambda expressions\
    \ are invoked that the code within them begins to execute. [FIGURE 15.2](#ch15.html_ch15fig02)\
    \ shows the sequence of operations.\n\n![Images](graphics/15fig02.jpg)\n\n**FIGURE\
    \ 15.2: Sequence of operations invoking lambda expressions**\n\nAs [FIGURE 15.2](#ch15.html_ch15fig02)\
    \ shows, three calls in [LISTING 15.14](#ch15.html_list15_14) trigger the lambda\
    \ expression, and each time it is fairly implicit. If the lambda expression were\
    \ expensive (such as a call to a database), it would therefore be important to\
    \ minimize the lambda expression’s execution.\n\nFirst, the execution is triggered\
    \ within the `foreach` loop. As described earlier in the chapter, the `foreach`\
    \ loop breaks down into a `MoveNext()` call, and each call results in the lambda\
    \ expression’s execution for each item in the original collection. While iterating,\
    \ the runtime invokes the lambda expression for each item to determine whether\
    \ the item satisfies the predicate.\n\nSecond, a call to `Enumerable`’s `Count()`\
    \ (the function) triggers the lambda expression for each item once more. Again,\
    \ this is subtle behavior because `Count` (the property) is very common on collections\
    \ that have not been queried with a standard query operator.\n\nThird, the call\
    \ to `ToArray()` (or `ToList()`, `ToDictionary()`, or `ToLookup()`) evaluates\
    \ the lambda expression for each item. However, converting the collection with\
    \ one of these “To” methods is extremely helpful. Doing so returns a collection\
    \ on which the standard query operator has already executed. In [LISTING 15.14](#ch15.html_list15_14),\
    \ the conversion to an array means that when `Length` is called in the final `Console.WriteLine()`,\
    \ the underlying object pointed to by `patents` is, in fact, an array (which obviously\
    \ implements `IEnumerable<T>`); in turn, `System.Array`’s implementation of `Length`\
    \ is called and not `System.Linq.Enumerable`’s implementation. Consequently, following\
    \ a conversion to one of the collection types returned by a “To” method, it is\
    \ generally safe to work with the collection (until another standard query operator\
    \ is called). However, be aware that this will bring the entire result set into\
    \ memory (it may have been backed by a database or file prior to this step). Furthermore,\
    \ the “To” method will take a snapshot of the underlying data, so that no fresh\
    \ results will be returned upon requerying the “To” method result.\n\nWe strongly\
    \ encourage you to review the sequence diagram in [FIGURE 15.2](#ch15.html_ch15fig02)\
    \ along with the corresponding code and recognize that the deferred execution\
    \ of standard query operators can result in extremely subtle triggering of the\
    \ standard query operators; therefore, developers should use caution and seek\
    \ to avoid unexpected calls. The query object represents the query, not the results.\
    \ When you ask the query for the results, the whole query executes (perhaps even\
    \ again) because the query object doesn’t know that the results will be the same\
    \ as they were during a previous execution (if one existed).\n\n**Note**\n\nTo\
    \ avoid such repeated execution, you must cache the data retrieved by the executed\
    \ query. To do so, assign the data to a local collection using one of the “To”\
    \ collection methods. During the assignment call of a “To” method, the query obviously\
    \ executes. However, iterating over the assigned collection after that point will\
    \ not involve the query expression any further. In general, if you want the behavior\
    \ of an in-memory collection snapshot, it is a best practice to assign a query\
    \ expression to a cached collection to avoid unnecessary iterations.\n\n#### Sorting\
    \ with `OrderBy()` and `ThenBy()`\n\nAnother common operation on a collection\
    \ is to sort it. Sorting involves a call to `System.Linq.Enumerable`’s `OrderBy()`,\
    \ as shown in [LISTING 15.17](#ch15.html_list15_17) and [OUTPUT 15.5](#ch15.html_op15_5).\n\
    \n**LISTING 15.17: Ordering with `System.Linq.Enumerable.OrderBy()`/`ThenBy()`**\n\
    \n```\nusing System;\nusing System.Collections.Generic;\nusing System.Linq;\n\
    // ...\n        IEnumerable<Patent> items;\n        Patent[] patents = PatentData.Patents;\n\
    \        items = patents.OrderBy(\n                patent => patent.YearOfPublication)\n\
    \            .ThenBy(\n                patent => patent.Title);\n        Print(items);\n\
    \        Console.WriteLine();\n\n        items = patents.OrderByDescending(\n\
    \                patent => patent.YearOfPublication)\n            .ThenByDescending(\n\
    \                patent => patent.Title);\n        Print(items);\n\n        //...\n\
    ```\n\n**OUTPUT 15.5**\n\n```\nBifocals (1784)\nSteam Locomotive (1815)\nElectrical\
    \ Telegraph (1837)\nPhonograph (1877)\nKinetoscope (1888)\nFlying Machine (1903)\n\
    Backless Brassiere (1914)\nDroplet Deposition Apparatus (1989)\n\nDroplet Deposition\
    \ Apparatus (1989)\nBackless Brassiere (1914)\nFlying Machine (1903)\nKinetoscope\
    \ (1888)\nPhonograph (1877)\nElectrical Telegraph (1837)\nSteam Locomotive (1815)\n\
    Bifocals (1784)\n```\n\nThe `OrderBy()` call takes a lambda expression that identifies\
    \ the key on which to sort. In [LISTING 15.17](#ch15.html_list15_17), the initial\
    \ sort uses the year in which the patent was published.\n\nNotice that the `OrderBy()`\
    \ call takes only a single parameter, `keySelector`, to sort on. To sort on a\
    \ second column, it is necessary to use a different method: `ThenBy()`. Similarly,\
    \ code would use `ThenBy()` for any additional sorting."
