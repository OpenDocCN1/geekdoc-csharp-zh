  trans: "\n\n在介绍了集合初始化器后，本章将涵盖各种集合接口，并探索它们之间的相互关系。这是理解集合的基础，因此你应该勤奋地学习这些材料。集合接口部分包含了实现标准查询操作符的\
    \ `IEnumerable<T>` 扩展方法^(2)。\n\n2. 在 C# 3.0 中引入。\n\n集合相关的类和接口分为两类：支持泛型的和不支持泛型的。本章主要讨论泛型集合接口。只有当你编写需要与早期版本的运行时（runtime）进行互操作的组件时，才应该使用不支持泛型的集合类。这是因为非泛型形式中可用的所有内容都有一个强类型的泛型替代品。尽管这些概念仍然适用于两种形式，但我们不会显式地讨论非泛型版本^(3)。\n\
    \n3. 实际上，NET Standards 和 .NET Core 甚至不包含非泛型集合。\n\n![Images](img/15fig00.jpg)\n\
    \n本章以对匿名类型的深入讨论结束——这是我们在第 3 章 的几个高级主题章节中简要提到过的。匿名类型有趣的地方在于，它们已经被元组（tuples）^(4)\
    \ 所取代——我们将在章末进一步讨论这个主题。\n\n4. 从 C# 7.0 开始。\n\n### 集合初始化器\n\n`集合初始化器`允许程序员在实例化时，以类似于数组声明的方式构造一个具有初始成员集合的集合。在集合初始化可用之前，必须在集合实例化后显式地向集合添加元素——使用类似\
    \ `System.Collections.Generic.ICollection<T>` 的 `Add()` 方法。通过集合初始化，`Add()` 调用由\
    \ C# 编译器生成，而不是由开发者显式编写代码。LISTING 15.1 显示了如何使用集合初始化器初始化集合。\n\n**列表 15.1: 集合初始化**\n\
    \n```\nusing System;\nusing System.Collections.Generic;\n\npublic class Program\n\
    {\n    public static void Main()\n    {\n        List<string> sevenWorldBlunders;\n\
    \        sevenWorldBlunders = new List<string>()\n        {\n            // 来自甘地的语言\n\
    \            \"Wealth without work\",\n            \"Pleasure without conscience\"\
    ,\n            \"Knowledge without character\",\n            \"Commerce without\
    \ morality\",\n            \"Science without humanity\",\n            \"Worship\
    \ without sacrifice\",\n            \"Politics without principle\"\n        };\n\
    \n        Print(sevenWorldBlunders);\n    }\n\n    private static void Print<T>(IEnumerable<T>\
    \ items)\n    {\n        foreach(T item in items)\n        {\n            Console.WriteLine(item);\n\
    \        }\n    }\n}\n```\n\n这种语法不仅与数组初始化相似，也与构造函数后面紧跟大括号的对象初始化器相似。如果构造函数中没有传递参数，则数据类型后面的括号是可选的（就像对象初始化器一样）。\n\
    \n集合初始化器要成功编译需要一些基本要求。理想情况下，应用集合初始化器的集合类型应该是实现了 `System.Collections.Generic.ICollection<T>`\
    \ 的类型。这确保了集合包含一个编译器生成的代码可以调用的 `Add()` 方法。然而，也存在一种宽松的要求，只需要求存在一个或多个 `Add()` 方法，可以作为扩展方法^(5)\
    \ 或作为实现 `IEnumerable` 的类型的实例方法存在——即使集合没有实现 `ICollection<T>`。`Add()` 方法接收的参数需要与集合初始化器中指定的值兼容。\n\
    \n5. 从 C# 6.0 开始。\n\n对于字典，集合初始化器的语法稍微复杂一些，因为字典中的每个元素都需要键（key）和值（value）。这种语法在列表\
    \ 15.2 中所示。\n\n**列表 15.2: 使用集合初始化器初始化 `Dictionary<>`**\n\n```\nusing System;\n\
    using System.Collections.Generic;\n// ...\n#if !PRECSHARP6\n        Dictionary<string,\
    \ ConsoleColor> colorMap =\n            new Dictionary<string, ConsoleColor>\n\
    \            {\n                [\"Error\"] = ConsoleColor.Red,\n            \
    \    [\"Warning\"] = ConsoleColor.Yellow,\n                [\"Information\"] =\
    \ ConsoleColor.Green,\n                [\"Verbose\"] = ConsoleColor.White\n  \
    \          };\n#else\n        Dictionary<string, ConsoleColor> colorMap =\n  \
    \          new Dictionary<string, ConsoleColor>\n            {\n             \
    \   {\"Error\", ConsoleColor.Red },\n                {\"Warning\", ConsoleColor.Yellow\
    \ },\n                {\"Information\", ConsoleColor.Green },\n              \
    \  {\"Verbose\", ConsoleColor.White}\n            };\n#endif\n```\n\n列表 15.2 包含了两种不同版本的初始化。第一种演示了一种新语法，^(6)\
    \ 它表达了字典的意图。第二种语法^(7) 使用大括号将名称和值配对。\n\n6. 在 C# 6.0 中引入。\n\n7. 在 C# 及后续版本中有效。\n\
    \n### 什么是类集合：`IEnumerable`\n\n根据定义，.NET 中的集合是一个至少实现了 `IEnumerable` 的类。这个接口至关重要，因为实现\
    \ `IEnumerable` 是支持遍历集合的最小需求。\n\n第 4 章 显示了如何使用 `foreach` 语句遍历数组。这种语法非常简单，并且避免了需要知道元素个数的复杂性。然而，运行时并不直接支持\
    \ `foreach` 语句。相反，C# 编译器按照本节描述的方式转换代码。\n\n#### 数组的 `foreach`\n\n列表 15.3 演示了一个简单的\
    \ `foreach` 循环，遍历整数数组，然后将每个整数打印到控制台。\n\n**列表 15.3: 数组的 `foreach`**\n\n```\nint[]\
    \ array = new int[] { 1, 2, 3, 4, 5, 6 };\n\nforeach(int item in array)\n{\n \
    \   Console.WriteLine(item);\n}\n```\n\n从这段代码中，C# 编译器创建了 `for` 循环的 CIL 等效代码，如列表\
    \ 15.4 所示。\n\n**列表 15.4: 数组的 `foreach` 编译实现**\n\n```\nint[] tempArray;\nint[]\
    \ array = new int[] { 1, 2, 3, 4, 5, 6 };\n\ntempArray = array;\nfor(int counter\
    \ = 0; (counter < tempArray.Length); counter++)\n{\n    int item = tempArray[counter];\n\
    \n    Console.WriteLine(item);\n}\n```\n\n在这个示例中，注意 `foreach` 依赖于对 `Length` 属性和索引操作符（`[]`）的支持。通过\
    \ `Length` 属性，C# 编译器可以使用 `for` 遍历数组中的每个元素。\n\n"
- fmt: "\n### `foreach` with `IEnumerable<T>`\n\nAlthough the code shown in [LISTING\
    \ 15.4](#ch15.html_list15_4) works well on arrays where the length is fixed and\
    \ the index operator is always supported, not all types of collections have a\
    \ known number of elements. Furthermore, many of the collection classes, including\
    \ the `Stack<T>`, `Queue<T>`, and `Dictionary<TKey, TValue>` classes, do not support\
    \ retrieving elements by index. Therefore, a more general approach of iterating\
    \ over collections of elements is needed. The iterator pattern provides this capability.\
    \ Assuming you can determine the first and next elements, knowing the count and\
    \ supporting retrieval of elements by index are unnecessary.\n\nThe `System.Collections.Generic.IEnumerator<T>`\
    \ and nongeneric `System.Collections.IEnumerator` interfaces are designed to enable\
    \ the iterator pattern for iterating over collections of elements, rather than\
    \ the length–index pattern shown in [LISTING 15.4](#ch15.html_list15_4). A class\
    \ diagram of their relationships appears in [FIGURE 15.1](#ch15.html_ch15fig01).\n\
    \n![Images](graphics/15fig01.jpg)\n\n**FIGURE 15.1: A class diagram of the `IEnumerator<T>`\
    \ and `IEnumerator` interfaces**\n\n`IEnumerator`, which `IEnumerator<T>` derives\
    \ from, includes three members. The first is `bool MoveNext()`. Using this method,\
    \ you can move from one element within the collection to the next, while at the\
    \ same time detecting when you have enumerated through every item. The second\
    \ member, a read-only property called `Current`, returns the element currently\
    \ in process. `Current` is overloaded in `IEnumerator<T>`, providing a type-specific\
    \ implementation of it. With these two members of the collection class, it is\
    \ possible to iterate over the collection by simply using a `while` loop, as demonstrated\
    \ in [LISTING 15.5](#ch15.html_list15_5). (The `Reset()` method usually throws\
    \ a `NotImplementedException`, so it should never be called. If you need to restart\
    \ an enumeration, just create a fresh enumerator.)\n\n**LISTING 15.5: Iterating\
    \ over a Collection Using `while`**\n\n```\nSystem.Collections.Generic.Stack<int>\
    \ stack =\n    new System.Collections.Generic.Stack<int>();\nint number;\n// ...\n\
    \n// This code is conceptual, not the actual code\n#if ConceptualCode\nwhile(stack.MoveNext())\n\
    {   \n    number = stack.Current();\n    Console.WriteLine(number);\n}\n#endif\
    \ // ConceptualCode\n```\n\nIn [LISTING 15.5](#ch15.html_list15_5), the `MoveNext()`\
    \ method returns `false` when it moves past the end of the collection. This replaces\
    \ the need to count elements while looping.\n\n[LISTING 15.5](#ch15.html_list15_5)\
    \ uses a `System.Collections.Generic.Stack<T>` as the collection type. Numerous\
    \ other collection types exist; this is just one example. The key trait of `Stack<T>`\
    \ is its design as a last in, first out (LIFO) collection. Notice that the type\
    \ parameter `T` identifies the type of all items within the collection. Collecting\
    \ one type of object within a collection is a key characteristic of a generic\
    \ collection. The programmer must know the data type within the collection when\
    \ adding, removing, or accessing items within the collection.\n\nThe preceding\
    \ example shows the gist of the C# compiler output, but it doesn’t actually compile\
    \ that way because it omits two important details concerning the implementation:\
    \ interleaving and error handling.\n\n#### State Is Shared\n\nThe problem with\
    \ an implementation such as [LISTING 15.5](#ch15.html_list15_5) is that if two\
    \ such loops interleaved each other—one `foreach` inside another, both using the\
    \ same collection —the collection must maintain a state indicator of the current\
    \ element so that when `MoveNext()` is called, the next element can be determined.\
    \ In such a case, one interleaving loop can affect the other. (The same is true\
    \ of loops executed by multiple threads.)\n\nTo overcome this problem, the collection\
    \ classes do not support `IEnumerator<T>` and `IEnumerator` interfaces directly.\
    \ Instead, as shown in [FIGURE 15.1](#ch15.html_ch15fig01), there is a second\
    \ interface, called `IEnumerable<T>`, whose only method is `GetEnumerator()`.\
    \ The purpose of this method is to return an object that supports `IEnumerator<T>`.\
    \ Instead of the collection class maintaining the state, a different class—usually\
    \ a nested class, so that it has access to the internals of the collection— will\
    \ support the `IEnumerator<T>` interface and will keep the state of the iteration\
    \ loop. The enumerator is like a “cursor” or a “bookmark” in the sequence. You\
    \ can have multiple bookmarks, and moving each of them enumerates over the collection\
    \ independently of the others. Using this pattern, the C# equivalent of a `foreach`\
    \ loop will look like the code shown in [LISTING 15.6](#ch15.html_list15_6).\n\
    \n**LISTING 15.6: A Separate Enumerator Maintaining State during an Iteration**\n\
    \n```\nSystem.Collections.Generic.Stack<int> stack =\n    new System.Collections.Generic.Stack<int>();\n\
    int number;\nSystem.Collections.Generic.Stack<int>.Enumerator\n  enumerator;\n\
    \n// ...\n\n// If IEnumerable<T> is implemented explicitly,\n// then a cast is\
    \ required\n// ((IEnumerable<int>)stack).GetEnumerator();\nenumerator = stack.GetEnumerator();\n\
    while(enumerator.MoveNext())\n{\n    number = enumerator.Current;\n    Console.WriteLine(number);\n\
    }\n```\n\n#### Advanced/Beginner Topic: Cleaning Up Following Iteration\n\nGiven\
    \ that the classes that implement the `IEnumerator<T>` interface maintain the\
    \ state, sometimes you need to clean up the state after it exits the loop (because\
    \ either all iterations have completed or an exception is thrown). To achieve\
    \ this, the `IEnumerator<T>` interface derives from `IDisposable`. Enumerators\
    \ that implement `IEnumerator` do not necessarily implement `IDisposable`, but\
    \ if they do, `Dispose()` will be called as well. This means that `Dispose()`\
    \ can be called after the `foreach` loop exits. The C# equivalent of the final\
    \ Common Intermediate Language (CIL) code, therefore, looks like [LISTING 15.7](#ch15.html_list15_7).\n\
    \n**LISTING 15.7: Compiled Result of `foreach` on Collections**\n\n```\nSystem.Collections.Generic.Stack<int>\
    \ stack =\n    new System.Collections.Generic.Stack<int>();\nSystem.Collections.Generic.Stack<int>.Enumerator\
    \ enumerator;\nIDisposable disposable;\n\nenumerator = stack.GetEnumerator();\n\
    try\n{\n    int number;\n    while(enumerator.MoveNext())\n    {\n        number\
    \ = enumerator.Current;\n        Console.WriteLine(number);\n    }\n}\nfinally\n\
    {\n    // Explicit cast used for IEnumerator<T>\n    disposable = (IDisposable)enumerator;\n\
    \    disposable.Dispose();\n\n    // IEnumerator will use the as operator unless\
    \ IDisposable\n    // support is known at compile time\n    // disposable = (enumerator\
    \ as IDisposable);\n    // if (disposable != null)\n    //     disposable.Dispose();\n\
    \    // }\n}\n```\n\nNotice that because the `IDisposable` interface is supported\
    \ by `IEnumerator<T>`, the `using` statement can simplify the code in [LISTING\
    \ 15.7](#ch15.html_list15_7) to that shown in [LISTING 15.8](#ch15.html_list15_8).\n\
    \n**LISTING 15.8: Error Handling and Resource Cleanup with `using`**\n\n```\n\
    System.Collections.Generic.Stack<int> stack =\n    new System.Collections.Generic.Stack<int>();\n\
    int number;\n\nusing (\n    System.Collections.Generic.Stack<int>.Enumerator\n\
    \        enumerator = stack.GetEnumerator())                         \n{\n   \
    \ while (enumerator.MoveNext())\n    {\n        number = enumerator.Current;\n\
    \        Console.WriteLine(number);\n    }\n}\n```\n\nHowever, recall that the\
    \ CIL does not directly support the `using` keyword. For this reason, the code\
    \ in [LISTING 15.7](#ch15.html_list15_7) is actually a more accurate C# representation\
    \ of the `foreach` CIL code.\n\n**Advanced Topic: `foreach` without `IEnumerable`**\n"
  raw: "#### `foreach` with `IEnumerable<T>`\n\nAlthough the code shown in [LISTING\
    \ 15.4](#ch15.html_list15_4) works well on arrays where the length is fixed and\
    \ the index operator is always supported, not all types of collections have a\
    \ known number of elements. Furthermore, many of the collection classes, including\
    \ the `Stack<T>`, `Queue<T>`, and `Dictionary<TKey, TValue>` classes, do not support\
    \ retrieving elements by index. Therefore, a more general approach of iterating\
    \ over collections of elements is needed. The iterator pattern provides this capability.\
    \ Assuming you can determine the first and next elements, knowing the count and\
    \ supporting retrieval of elements by index are unnecessary.\n\nThe `System.Collections.Generic.IEnumerator<T>`\
    \ and nongeneric `System.Collections.IEnumerator` interfaces are designed to enable\
    \ the iterator pattern for iterating over collections of elements, rather than\
    \ the length–index pattern shown in [LISTING 15.4](#ch15.html_list15_4). A class\
    \ diagram of their relationships appears in [FIGURE 15.1](#ch15.html_ch15fig01).\n\
    \n![Images](graphics/15fig01.jpg)\n\n**FIGURE 15.1: A class diagram of the `IEnumerator<T>`\
    \ and `IEnumerator` interfaces**\n\n`IEnumerator`, which `IEnumerator<T>` derives\
    \ from, includes three members. The first is `bool MoveNext()`. Using this method,\
    \ you can move from one element within the collection to the next, while at the\
    \ same time detecting when you have enumerated through every item. The second\
    \ member, a read-only property called `Current`, returns the element currently\
    \ in process. `Current` is overloaded in `IEnumerator<T>`, providing a type-specific\
    \ implementation of it. With these two members of the collection class, it is\
    \ possible to iterate over the collection by simply using a `while` loop, as demonstrated\
    \ in [LISTING 15.5](#ch15.html_list15_5). (The `Reset()` method usually throws\
    \ a `NotImplementedException`, so it should never be called. If you need to restart\
    \ an enumeration, just create a fresh enumerator.)\n\n**LISTING 15.5: Iterating\
    \ over a Collection Using `while`**\n\n```\nSystem.Collections.Generic.Stack<int>\
    \ stack =\n    new System.Collections.Generic.Stack<int>();\nint number;\n// ...\n\
    \n// This code is conceptual, not the actual code\n#if ConceptualCode\nwhile(stack.MoveNext())\n\
    {   \n    number = stack.Current();\n    Console.WriteLine(number);\n}\n#endif\
    \ // ConceptualCode\n```\n\nIn [LISTING 15.5](#ch15.html_list15_5), the `MoveNext()`\
    \ method returns `false` when it moves past the end of the collection. This replaces\
    \ the need to count elements while looping.\n\n[LISTING 15.5](#ch15.html_list15_5)\
    \ uses a `System.Collections.Generic.Stack<T>` as the collection type. Numerous\
    \ other collection types exist; this is just one example. The key trait of `Stack<T>`\
    \ is its design as a last in, first out (LIFO) collection. Notice that the type\
    \ parameter `T` identifies the type of all items within the collection. Collecting\
    \ one type of object within a collection is a key characteristic of a generic\
    \ collection. The programmer must know the data type within the collection when\
    \ adding, removing, or accessing items within the collection.\n\nThe preceding\
    \ example shows the gist of the C# compiler output, but it doesn’t actually compile\
    \ that way because it omits two important details concerning the implementation:\
    \ interleaving and error handling.\n\n##### State Is Shared\n\nThe problem with\
    \ an implementation such as [LISTING 15.5](#ch15.html_list15_5) is that if two\
    \ such loops interleaved each other—one `foreach` inside another, both using the\
    \ same collection —the collection must maintain a state indicator of the current\
    \ element so that when `MoveNext()` is called, the next element can be determined.\
    \ In such a case, one interleaving loop can affect the other. (The same is true\
    \ of loops executed by multiple threads.)\n\nTo overcome this problem, the collection\
    \ classes do not support `IEnumerator<T>` and `IEnumerator` interfaces directly.\
    \ Instead, as shown in [FIGURE 15.1](#ch15.html_ch15fig01), there is a second\
    \ interface, called `IEnumerable<T>`, whose only method is `GetEnumerator()`.\
    \ The purpose of this method is to return an object that supports `IEnumerator<T>`.\
    \ Instead of the collection class maintaining the state, a different class—usually\
    \ a nested class, so that it has access to the internals of the collection— will\
    \ support the `IEnumerator<T>` interface and will keep the state of the iteration\
    \ loop. The enumerator is like a “cursor” or a “bookmark” in the sequence. You\
    \ can have multiple bookmarks, and moving each of them enumerates over the collection\
    \ independently of the others. Using this pattern, the C# equivalent of a `foreach`\
    \ loop will look like the code shown in [LISTING 15.6](#ch15.html_list15_6).\n\
    \n**LISTING 15.6: A Separate Enumerator Maintaining State during an Iteration**\n\
    \n```\nSystem.Collections.Generic.Stack<int> stack =\n    new System.Collections.Generic.Stack<int>();\n\
    int number;\nSystem.Collections.Generic.Stack<int>.Enumerator\n  enumerator;\n\
    \n// ...\n\n// If IEnumerable<T> is implemented explicitly,\n// then a cast is\
    \ required\n// ((IEnumerable<int>)stack).GetEnumerator();\nenumerator = stack.GetEnumerator();\n\
    while(enumerator.MoveNext())\n{\n    number = enumerator.Current;\n    Console.WriteLine(number);\n\
    }\n```\n\n**Advanced/Beginner Topic: Cleaning Up Following Iteration**\n\nGiven\
    \ that the classes that implement the `IEnumerator<T>` interface maintain the\
    \ state, sometimes you need to clean up the state after it exits the loop (because\
    \ either all iterations have completed or an exception is thrown). To achieve\
    \ this, the `IEnumerator<T>` interface derives from `IDisposable`. Enumerators\
    \ that implement `IEnumerator` do not necessarily implement `IDisposable`, but\
    \ if they do, `Dispose()` will be called as well. This means that `Dispose()`\
    \ can be called after the `foreach` loop exits. The C# equivalent of the final\
    \ Common Intermediate Language (CIL) code, therefore, looks like [LISTING 15.7](#ch15.html_list15_7).\n\
    \n**LISTING 15.7: Compiled Result of `foreach` on Collections**\n\n```\nSystem.Collections.Generic.Stack<int>\
    \ stack =\n    new System.Collections.Generic.Stack<int>();\nSystem.Collections.Generic.Stack<int>.Enumerator\
    \ enumerator;\nIDisposable disposable;\n\nenumerator = stack.GetEnumerator();\n\
    try\n{\n    int number;\n    while(enumerator.MoveNext())\n    {\n        number\
    \ = enumerator.Current;\n        Console.WriteLine(number);\n    }\n}\nfinally\n\
    {\n    // Explicit cast used for IEnumerator<T>\n    disposable = (IDisposable)enumerator;\n\
    \    disposable.Dispose();\n\n    // IEnumerator will use the as operator unless\
    \ IDisposable\n    // support is known at compile time\n    // disposable = (enumerator\
    \ as IDisposable);\n    // if (disposable != null)\n    // {\n    //     disposable.Dispose();\n\
    \    // }\n}\n```\n\nNotice that because the `IDisposable` interface is supported\
    \ by `IEnumerator<T>`, the `using` statement can simplify the code in [LISTING\
    \ 15.7](#ch15.html_list15_7) to that shown in [LISTING 15.8](#ch15.html_list15_8).\n\
    \n**LISTING 15.8: Error Handling and Resource Cleanup with `using`**\n\n```\n\
    System.Collections.Generic.Stack<int> stack =\n    new System.Collections.Generic.Stack<int>();\n\
    int number;\n\nusing (                                                       \
    \      \n    System.Collections.Generic.Stack<int>.Enumerator                \n\
    \        enumerator = stack.GetEnumerator())                         \n{\n   \
    \ while (enumerator.MoveNext())\n    {\n        number = enumerator.Current;\n\
    \        Console.WriteLine(number);\n    }\n}\n```\n\nHowever, recall that the\
    \ CIL does not directly support the `using` keyword. For this reason, the code\
    \ in [LISTING 15.7](#ch15.html_list15_7) is actually a more accurate C# representation\
    \ of the `foreach` CIL code.\n\n**Advanced Topic: `foreach` without `IEnumerable`**"
