  trans: "\n\n`OrderBy()` 返回一个 `IOrderedEnumerable<T>` 接口，而不是 `IEnumerable<T>`。此外，`IOrderedEnumerable<T>`\
    \ 继承自 `IEnumerable<T>`，因此所有标准查询操作符（包括 `OrderBy()`）都可以用于 `OrderBy()` 的返回值上。然而，重复调用\
    \ `OrderBy()` 会撤消上一次调用的工作，导致最终结果仅按最后一个 `OrderBy()` 调用中的 `keySelector` 进行排序。出于此原因，你应该小心不要在之前的\
    \ `OrderBy()` 调用之后再次调用 `OrderBy()`。\n\n相反，你应该使用 `ThenBy()` 指定额外的排序标准。虽然 `ThenBy()`\
    \ 是一个扩展方法，但它不是 `IEnumerable<T>` 的扩展，而是 `IOrderedEnumerable<T>` 的扩展。该方法也定义在 `System.Linq.Extensions.Enumerable`\
    \ 中，声明如下：\n\n```cs\n public static IOrderedEnumerable<TSource>\nThenBy<TSource,\
    \ TKey>(\nthis IOrderedEnumerable<TSource> source,\n   Func<TSource, TKey> keySelector)\n\
    ```\n\n总之，首先使用 `OrderBy()`，随后进行零或多次 `ThenBy()` 调用以提供额外的“排序列”。`OrderByDescending()`\
    \ 和 `ThenByDescending()` 方法提供相同的功能，只是它们按降序排列项目。混合使用升序和降序方法没有问题，但如果需要对项目进行进一步排序，你应该使用\
    \ `ThenBy()` 调用（无论是升序还是降序）。\n\n关于排序还有两个重要的点需要说明。首先，实际排序直到你开始访问集合中的成员时才会发生，此时整个查询才会被处理。除非你拥有所有待排序的项，否则无法进行排序，因为你无法确定是否拥有第一个项目。排序被推迟到开始访问成员是因为本章早些部分描述的**延迟执行**。其次，后续每次对数据的排序调用（例如\
    \ `OrderBy()` 后面接 `ThenBy()` 然后是 `ThenByDescending()`）确实涉及对早期排序调用 `keySelector`\
    \  的额外调用。换句话说，当你遍历集合时，`OrderBy()` 调用会调用其相应的 `keySelector` 表达式。此外，随后的 `ThenBy()`\
    \ 调用将再次调用 `OrderBy()` 的 `keySelector`。\n\n## 指南\n\n**不要在之前的 `OrderBy()` 方法调用之后调用\
    \ `OrderBy()`。请使用 `ThenBy()` 根据多个值对项目进行排序。**\n\n## 初学者主题：连接操作\n\n考虑如图 15.3 中的维恩图所示的两个对象集合。图中的左圆包含所有发明者，右圆包含所有专利。交集包含了发明者和专利，对于每种发明者与专利匹配的情况，都会形成一条线。如图所示，每位发明者可能有多个专利，而每个专利可以有一个或多个发明者。每个专利都有一个发明者，但在某些情况下，发明者还没有专利。\n\
    \n![Images](img/15fig03.jpg)\n\n**图 15.3：发明者和专利集合的维恩图**\n\n将交集内的发明者与专利进行匹配是**内连接\
    \ (inner join)**。结果是一个发明者/专利对集合，其中每一对都存在专利和发明。左外连接 (left outer join）包含了左圆内的所有项，无论它们是否有对应的专利。在这个特定的例子中，右外连接与内连接相同，因为没有不对应发明者的专利。此外，左与右的指定是任意的，因此左连接和外连接之间实际上没有区别。然而，全外连接\
    \ (full outer join) 将包含两个外侧的记录；执行全外连接相对罕见。\n\n发明者与专利之间关系的另一个重要特征是它们是**多对多**关系。每个单独的专利可以有一个或多个发明者（例如，奥维尔和威尔伯·莱特共同发明的飞行器）。此外，每位发明者可以拥有一个或多个专利（例如，本明·富兰克林发明的双光眼镜和留声机）。\n\
    \n另一种常见的关系是**一对多**关系。例如，一个公司部门可能有许多员工。然而，每位员工在此时只能属于一个部门。（但是，正如一对多关系常见的那样，引入时间因素可以将其转换为多对多关系。特定员工可能会从一个部门移动到另一个部门，随着时间的推移，她可能与多个部门关联，形成另一个多对多关系。）\n\
    \n列表 15.18 提供了员工和部门数据的示例列表，输出 15.6 显示了结果。\n\n**列表 15.18：示例员工和部门数据**\n\n```cs\n\
    public class Program\n{\n    public static void Main()\n    {\n        IEnumerable<Department>\
    \ departments =\n            CorporateData.Departments;\n        Print(departments);\n\
    \n        Console.WriteLine();\n\n        IEnumerable<Employee> employees =\n\
    \            CorporateData.Employees;\n        Print(employees);\n    }\n\n  \
    \  private static void Print<T>(IEnumerable<T> items)\n    {\n        foreach(T\
    \ item in items)\n        {\n            Console.WriteLine(item);\n        }\n\
    \    }\n}\n```\n\n**OUTPUT 15.6**\n\n```\nCorporate\nHuman Resources\nEngineering\n\
    Information Technology\nPhilanthropy\nMarketing\n\nMark Michaelis (Chief Nerd)\n\
    Michael Stokes (Senior Wizard)\nBrian Jones (Enterprise Guru)\nAnne Beard (HR\
    \ Director)\nPat Dever (Enterprise Architect)\nKevin Bost (Programmer Extraordinaire)\n\
    Thomas Heavey (Software Architect)\nEric Edmonds (Philanthropy Coordinator)\n\
    ```\n\n我们将在下一节关于连接的示例中使用这些数据。\n\n### 使用 `Join()` 执行内连接\n\n在客户端的对象世界中，对象之间的关系已经建立。例如，文件与它们所在的目录之间的关系已通过\
    \ `DirectoryInfo.GetFiles()` 方法和 `FileInfo.Directory` 方法预先建立。然而，对于从非对象存储器加载的数据，情况通常并非如此。相反，需要将数据连接在一起，以便能够以符合数据逻辑的方式从一种对象类型导航到另一种类型。\n\
    \n考虑员工和公司部门的示例。在列表 15.19 中，我们将每个员工与其所属的部门连接，然后列出每个员工及其所属部门。由于每位员工只属于一个（且恰好是一个）部门，列表中的项目总数等于员工总数——每个员工只出现一次（每个员工可以说是**归一化**的）。输出\
    \ 15.7 显示了结果。\n\n**列表 15.19：使用 `System.Linq.Enumerable.Join()` 的内连接**\n\n```cs\n\
    using System;\nusing System.Collections.Generic;\nusing System.Linq;\n// ...\n\
    \        Department[] departments = CorporateData.Departments;\n        Employee[]\
    \ employees = CorporateData.Employees;\n\n        IEnumerable<(int Id, string\
    \ Name, string Title,\n            Department Department)> items =\n         \
    \   employees.Join(\n                departments,\n                employee =>\
    \ employee.DepartmentId,\n                department => department.Id,\n     \
    \           (employee, department) => (\n                    employee.Id,\n  \
    \                  employee.Name,\n                    employee.Title,\n     \
    \               department\n                ));\n\n        foreach ((int Id, string\
    \ Name, string Title, Department Department) item in items)\n        {\n     \
    \       Console.WriteLine(\n                $\"{item.Name} ({item.Title})\");\n\
    \            Console.WriteLine(\"\\t\" + item.Department);\n        }\n    }\n\
    \    //...\n```\n\n**OUTPUT 15.7**\n\n"
- fmt: "\n```\nMark Michaelis (Chief Computer Nerd)\n        Corporate\nMichael Stokesbary\
    \ (Senior Computer Wizard)\n        Engineering\nBrian Jones (Enterprise Integration\
    \ Guru)\n        Engineering\nAnne Beard (HR Director)\n        Human Resources\n\
    Pat Dever (Enterprise Architect)\n        Information Technology\nKevin Bost (Programmer\
    \ Extraordinaire)\n        Engineering\nThomas Heavey (Software Architect)\n \
    \       Engineering\nEric Edmonds (Philanthropy Coordinator)\n        Philanthropy\n\
    ```\n\nThe first parameter for `Join()` has the name `inner`. It specifies the\
    \ collection, `departments`, that `employees` joins to. The next two parameters\
    \ are lambda expressions that specify how the two collections will connect. `employee\
    \ => employee.DepartmentId` (with a parameter name of `outerKeySelector`) identifies\
    \ that on each `employee`, the key will be `DepartmentId`. The next lambda expression\
    \ (`department => department.Id`) specifies the `Department`’s `Id` property as\
    \ the key—in other words, for each employee, join a department where `employee.DepartmentId`\
    \ equals `department.Id`. The last parameter is the resultant item that is selected.\
    \ In this case, it is a tuple with `Employee`’s `Id`, `Name`, and `Title`, as\
    \ well as a `Department` property with the joined `department` object.\n\nNotice\
    \ in the output that `Engineering` appears multiple times—once for each employee\
    \ in `CorporateData`. In this case, the `Join()` call produces a **Cartesian product**\
    \ between all the departments and all the employees, such that a new record is\
    \ created for every case where a record exists in both collections and the specified\
    \ department IDs are the same. This type of join is an inner join.\n\nThe data\
    \ could also be joined in reverse, such that `department` joins to each `employee`\
    \ to list each department-to-employee match. Notice that the output includes more\
    \ records than there are departments: There are multiple employees for each department,\
    \ and the output is a record for each match. As we saw before, the Engineering\
    \ department appears multiple times, once for each employee.\n\nThe code in [LISTING\
    \ 15.20](#ch15.html_list15_20) (which produces [OUTPUT 15.8](#ch15.html_op15_8))\
    \ is similar to that in [LISTING 15.19](#ch15.html_list15_19), except that the\
    \ objects, `Department`s and `Employee`s, are reversed. The first parameter to\
    \ `Join()` is `employees`, indicating what `departments` joins to. The next two\
    \ parameters are lambda expressions that specify how the two collections will\
    \ connect: `department => department.Id` for `departments` and `employee => employee.DepartmentId`\
    \ for `employees`. As before, a join occurs whenever `department.Id` equals `employee.EmployeeId`.\
    \ The final tuple parameter specifies a class with `int Id`, `string Name`, and\
    \ `Employee Employee` items. (Specifying the names in the expression is optional\
    \ but used here for clarity.)\n\n**LISTING 15.20: Another Inner Join with `System.Linq.Enumerable.Join()`**\n\
    \n```\nusing System;\nusing System.Collections.Generic;\nusing System.Linq;\n\
    // ...\n        Department[] departments = CorporateData.Departments;\n      \
    \  Employee[] employees = CorporateData.Employees;\n\n        IEnumerable<(long\
    \ Id, string Name, Employee Employee)> items =\n            departments.Join(\n\
    \                employees,\n                department => department.Id,\n  \
    \              employee => employee.DepartmentId,\n                (department,\
    \ employee) => (\n                    department.Id, \n                    department.Name,\
    \ \n                    Employee: employee)\n                );\n\n        foreach\
    \ ((long Id, string Name, Employee Employee) item in items)\n        {\n     \
    \       Console.WriteLine(item.Name);\n            Console.WriteLine(\"\\t\" +\
    \ item.Employee);\n        }\n        //...\n```\n\n**OUTPUT 15.8**\n\n```\nCorporate\n\
    \        Mark Michaelis (Chief Computer Nerd)\nHuman Resources\n        Anne Beard\
    \ (HR Director)\nEngineering\n        Michael Stokesbary (Senior Computer Wizard)\n\
    Engineering\n        Brian Jones (Enterprise Integration Guru)\nEngineering\n\
    \        Kevin Bost (Programmer Extraordinaire)\nEngineering\n        Thomas Heavey\
    \ (Software Architect)\nInformation Technology\n        Pat Dever (Enterprise\
    \ Architect)\nPhilanthropy\n        Eric Edmonds (Philanthropy Coordinator)\n\
    ```\n\nIn addition to ordering and joining a collection of objects, you might\
    \ want to group objects with like characteristics. For the employee data, you\
    \ might want to group employees by department, region, job title, and so forth.\
    \ [LISTING 15.21](#ch15.html_list15_21) shows an example of how to do this with\
    \ the `GroupBy()` standard query operator (see [OUTPUT 15.9](#ch15.html_op15_9)\
    \ to view the results).\n\n**LISTING 15.21: Grouping Items Using `System.Linq.Enumerable.GroupBy()`**\n\
    \n```c\nusing System;\nusing System.Collections.Generic;\nusing System.Linq;\n\
    // ...\n        IEnumerable<Employee> employees = CorporateData.Employees;\n\n\
    \        IEnumerable<IGrouping<int, Employee>> groupedEmployees =\n          \
    \  employees.GroupBy((employee) => employee.DepartmentId);\n\n        foreach(IGrouping<int,\
    \ Employee> employeeGroup in\n            groupedEmployees)\n        {\n     \
    \       Console.WriteLine();\n            foreach(Employee employee in employeeGroup)\n\
    \            {\n                Console.WriteLine(employee);\n            }\n\
    \            Console.WriteLine(\n              \"\\tCount: \" + employeeGroup.Count());\n\
    \        }\n        //...\n```\n\n**OUTPUT 15.9**\n\n```\nMark Michaelis (Chief\
    \ Computer Nerd)\n    Count: 1\n\nMichael Stokesbary (Senior Computer Wizard)\n\
    Brian Jones (Enterprise Integration Guru)\nKevin Bost (Programmer Extraordinaire)\n\
    Thomas Heavey (Software Architect)\n    Count: 4\n\nAnne Beard (HR Director)\n\
    \    Count: 1\n\nPat Dever (Enterprise Architect)\n    Count: 1\n\nEric Edmonds\
    \ (Philanthropy Coordinator)\n    Count: 1\n```\n\nNote that the items output\
    \ from a `GroupBy()` call are of type `IGrouping<TKey, TElement>`, which has a\
    \ property for the key that the query is grouping on (`employee.DepartmentId`).\
    \ However, it does not have a property for the items within the group. Rather,\
    \ `IGrouping<TKey, TElement>` derives from `IEnumerable<T>`, allowing for enumeration\
    \ of the items within the group using a `foreach` statement or for aggregating\
    \ the data into something such as a count of items (`employeeGroup.Count()`).\n\
    \n Implementing a One-to-Many Relationship with `GroupJoin()`\n\n[LISTING 15.19](#ch15.html_list15_19)\
    \ and [LISTING 15.20](#ch15.html_list15_20) are virtually identical. Either `Join()`\
    \ call could have produced the same output just by changing the tuple definition.\
    \ When trying to create a list of employees, [LISTING 15.19](#ch15.html_list15_19)\
    \ provides the correct result. `Department` ends up as an item of both tuples\
    \ representing the joined employee. However, [LISTING 15.20](#ch15.html_list15_20)\
    \ is not ideal. Given support for collections, a more preferable representation\
    \ of a department would have a collection of employees rather than a single tuple\
    \ for each department–employee relationship. [LISTING 15.22](#ch15.html_list15_22)\
    \ demonstrates the creation of such a child collection; [OUTPUT 15.10](#ch15.html_op15_10)\
    \ shows the preferred output.\n\n**LISTING 15.22: Creating a Child Collection\
    \ with `System.Linq.Enumerable.GroupJoin()`**\n"
