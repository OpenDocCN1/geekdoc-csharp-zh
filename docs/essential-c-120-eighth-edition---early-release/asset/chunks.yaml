    \ query operators, including those used for sorting, filtering (`Where()`), projecting\
    \ (`Select()`), joining, grouping, and aggregating. [LISTING 21.8](#ch21.html_list21_8)\
    \ shows how to do a parallel sort.\n\n**LISTING 21.8: Parallel LINQ with Standard\
    \ Query Operators**\n\n```\n//...\nOrderedParallelQuery<string> parallelGroups\
    \ =                             \n    data.AsParallel().OrderBy(item => item);\
    \                              \n\n// Show the total count of items still\n//\
    \ matches the original count\nif (data.Count() != parallelGroups.Sum(\n      \
    \  item => item.Length))\n{\n    throw new Exception(\"data.Count() != parallelGroups.Sum(item\
    \ => item.C\nount()\");\n}\n// ...\n```\n\nAs [LISTING 21.8](#ch21.html_list21_8)\
    \ shows, invoking the parallel version simply involves a call to the `AsParallel()`\
    \ extension method. Notice that the type of the result returned by the parallel\
    \ standard query operators is either `ParallelQuery<T>` or `OrderedParallelQuery<T>`;\
    \ both inform the compiler that it should continue to use the parallel versions\
    \ of the standard query operations that are available.\n\nGiven that query expressions\
    \ are simply a syntactic sugar for the method call form of the query used in [LISTING\
    \ 21.5](#ch21.html_list21_5) and [LISTING 21.6](#ch21.html_list21_6), you can\
    \ just as easily use `AsParallel()` with the expression form. [LISTING 21.9](#ch21.html_list21_9)\
    \ shows an example of executing a grouping operation in parallel using query expression\
    \ syntax.\n\nAs you saw in the previous examples, converting a query or iteration\
    \ loop to execute in parallel is simple. There is one significant caveat, however:\
    \ As we will discuss in depth in [Chapter 22](#ch22.html_ch22), you must take\
    \ care not to allow multiple threads to inappropriately access and modify the\
    \ same memory simultaneously. Doing so will cause a race condition.\n\n**LISTING\
    \ 21.9: Parallel LINQ with Query Expressions**\n\n```\n//...\nParallelQuery<IGrouping<char,\
    \ string>> parallelGroups;\nparallelGroups =\n    from text in data.AsParallel()\
    \                                         \n    orderby text                 \
    \                                          \n    group text by text[0];      \
    \                                           \n\n// Show the total count of items\
    \ still\n// matches the original count\nif (data.Count() != parallelGroups.Sum(\n\
    \        item => item.Count()))\n{\n    throw new Exception(\"data.Count() !=\
    \ parallelGroups.Sum(item => item.C\nount()\");\n}\n//...\n```\n\nAs we saw earlier\
    \ in this chapter, the `Parallel.For()` and `Parallel.ForEach<T>` methods will\
    \ gather up any exceptions thrown during the parallel iterations and then throw\
    \ one aggregating exception containing all of the original exceptions. PLINQ operations\
    \ are no different. That is, they also have the potential of returning multiple\
    \ exceptions for exactly the same reason: When the query logic is run on each\
    \ element in parallel, the code executing on each element can independently throw\
    \ an exception. Unsurprisingly, PLINQ deals with this situation in exactly the\
    \ same way as do parallel loops and the TPL: Exceptions thrown during parallel\
    \ queries are accessible via the `InnerExceptions` property of the `AggregateException`.\
    \ Therefore, wrapping a PLINQ query in a try/catch block with the exception type\
    \ of `System.AggregateException` will successfully handle any exceptions within\
    \ each iteration that were unhandled.\n\n#### Canceling a PLINQ Query"
