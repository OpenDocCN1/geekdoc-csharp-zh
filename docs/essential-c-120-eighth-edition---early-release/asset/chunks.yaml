    \ private static void Print<T>(IEnumerable<T> items)\n    {\n        foreach(T\
    \ item in items)\n        {\n            Console.WriteLine(item);\n        }\n\
    \    }\n}\n```\n\nThe resultant variable is an array of the anonymous type items,\
    \ which must be homogeneous because it is an array.\n\n### Summary\n\nThis chapter\
    \ described the internals of how the `foreach` loop works and explained which\
    \ interfaces are required for its execution. In addition, developers frequently\
    \ filter a collection so that there are fewer items and project the collection\
    \ so that the items take a different form. Toward that end, this chapter discussed\
    \ the details of how to use the standard query operators—LINQ introduced collection\
    \ extension methods on the `System.Linq.Enumerable` class—to perform collection\
    \ manipulation.\n\nIn the introduction to standard query operators, we detailed\
    \ the process of deferred execution and emphasized how developers should take\
    \ care to avoid unintentionally re-executing an expression via a subtle call that\
    \ enumerates over the collection contents. The deferred execution and resultant\
    \ implicit execution of standard query operators is a significant factor in code\
    \ efficiency, especially when the query execution is expensive. Programmers should\
    \ treat the query object as the query object, not the results, and should expect\
    \ the query to execute fully even if it executed already. The query object doesn’t\
    \ know that the results will be the same as they were during a previous execution.\n\
    \n[LISTING 15.23](#ch15.html_list15_23) appeared in an Advanced Topic section\
    \ because of the complexity of calling multiple standard query operators one after\
    \ the other. Although requirements for similar execution may be commonplace, it\
    \ is not necessary to rely on standard query operators directly. Query expressions,^([13](#ch15.html_fn15_13))\
    \ a SQL-like syntax for manipulating collections in a way that is frequently easier\
    \ to code and read, are shown in the next chapter.\n\n[13](#ch15.html_fn15_13a).\
    \ Starting in C# 3.0.\n\nThe chapter ended with a detailed look at anonymous types\
    \ and explained why tuples are, in fact, a preferable approach if you have C#\
    \ 7.0 or later.\n\n## 16\\. LINQ with Query Expressions\n\nThe end of [Chapter\
    \ 15](#ch15.html_ch15) showed a query using standard query operators for `GroupJoin()`,\
    \ `SelectMany()`, and `Distinct()`. The result was a statement that spanned multiple\
    \ lines and was rather more complex and difficult to comprehend than statements\
    \ typically written using only features of earlier versions of C#. Modern programs,\
    \ which manipulate rich data sets, often require such complex queries; it would\
    \ therefore be advantageous if the language made them easier to read. Domain-specific\
    \ query languages such as SQL make it much easier to read and understand a query\
    \ but lack the full power of the C# language. That is why the C# language designers\
    \ added **query expressions** syntax.^([1](#ch16.html_fn16_1)) With query expressions,\
    \ many standard query operator expressions are transformed into more readable\
    \ code, much like SQL.\n\n[1](#ch16.html_fn16_1a). Starting in C# 3.0.\n\n![Images](graphics/16fig00.jpg)\n\
    \nIn this chapter, we introduce query expressions and use them to express many\
    \ of the queries from [Chapter 15](#ch15.html_ch15).\n\n### Introducing Query\
    \ Expressions\n\nTwo of the operations that developers most frequently perform\
    \ are **filtering** the collection to eliminate unwanted items and **projecting**\
    \ the collection so that the items take a different form. For example, given a\
    \ collection of files, we could filter it to create a new collection of only the\
    \ files with a `.cs` extension or only the files larger than 1 million bytes.\
    \ We could also project the file collection to create a new collection of paths\
    \ to the directories where the files are located and the corresponding directory\
    \ size. Query expressions provide straightforward syntaxes for both of these common\
    \ operations. [LISTING 16.1](#ch16.html_list16_1) shows a query expression that\
    \ filters a collection of strings; [OUTPUT 16.1](#ch16.html_op16_1) shows the\
    \ results.\n\n**LISTING 16.1: Simple Query Expression**\n\n```\npublic static\
    \ class CSharp\n{\n    public static readonly ReadOnlyCollection<string> Keywords\
    \ = new(\n        new string[]\n        {\n            \"abstract\",\"add*\",\"\
    alias*\",\"as\",\"ascending*\",\n            \"async*\",\"await*\",\"base\",\"\
    bool\",\"break\",\n            \"by*\",\"byte\",\"case\",\"catch\",\"char\",\"\
    checked\",\n            \"class\",\"const\",\"continue\",\"decimal\",\"default\"\
    ,\n            \"delegate\",\"descending*\",\"do\",\"double\",\"dynamic*\",\n\
    \            \"else\",\"enum\",\"equals*\",\"event\",\"explicit\",\"extern\",\n\
    \            \"false\",\"finally\",\"fixed\",\"float\",\"for\",\"foreach\",\n\
    \            \"from*\",\"get*\",\"global*\",\"goto\",\"group*\",\"if\",\"implicit\"\
    ,\n            \"in\",\"int\",\"interface\",\"internal\",\"into*\",\"is\",\"join*\"\
    ,\n            \"let*\",\"lock\",\"long\", \"nameof*\", \"namespace\",\"new\"\
    ,\n            \"nonnull*\",\"null\",\"object\",\"on*\",\"operator\",\"orderby*\"\
    ,\n            \"out\",\"override\",\"params\",\"partial*\",\"private\",\n   \
    \         \"protected\",\"public\",\"readonly\",\"ref\",\"remove*\",\"return\"\
    ,\n            \"sbyte\",\"sealed\",\"select*\",\"set*\",\"short\",\"sizeof\"\
    ,\n            \"stackalloc\",\"static\",\"string\",\"struct\",\"switch\",\"this\"\
    ,\n            \"throw\",\"true\",\"try\",\"typeof\",\"uint\",\"ulong\",\"unchecked\"\
    ,\n            \"unsafe\",\"ushort\",\"using\",\"value*\",\"var*\",\"virtual\"\
    ,\n            \"void\",\"volatile\",\"when*\",\"where*\",\"while\",\"yield*\"\
    \n        });\n}\n// ...\nusing System;\nusing System.Collections.Generic;\nusing\
    \ System.Linq;\n// ...\n    private static void ShowContextualKeywords()\n   \
    \ {\n        IEnumerable<string> selection =                                 \n\
    \            from word in CSharp.Keywords                                \n  \
    \          where !word.Contains('*')                                   \n    \
    \        select word;                                                \n\n    \
    \    foreach (string keyword in selection)\n        {\n            Console.Write(keyword\
    \ + \" \");\n        }\n    }\n    //...\n```\n\n**OUTPUT 16.1**\n\n```\nabstract\
    \ as base bool break byte case catch char checked class const\ncontinue decimal\
    \ default delegate do double else enum event explicit\nextern false finally fixed\
    \ float for foreach goto if implicit in int\ninterface internal is lock long namespace\
    \ new null object operator out\noverride params private protected public readonly\
    \ ref return sbyte\nsealed short sizeof stackalloc static string struct switch\
    \ this throw\ntrue try typeof uint ulong unchecked unsafe ushort using virtual\
    \ void\nvolatile while\n```\n\nIn this query expression, `selection` is assigned\
    \ the collection of C# reserved keywords. The query expression in this example\
    \ includes a `where` clause that filters out the noncontextual keywords.\n\nQuery\
    \ expressions always begin with a `from` clause and end with a `select` clause\
    \ or a `group` clause, identified by the `from`, `select`, or `group` contextual\
    \ keyword, respectively. The identifier `word` in the `from` clause is called\
    \ a **range variable**; it represents each item in the collection, much as the\
    \ loop variable in a `foreach` loop represents each item in a collection."
