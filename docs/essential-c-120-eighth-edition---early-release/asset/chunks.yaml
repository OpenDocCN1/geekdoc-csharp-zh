    \n## 14. Events\nThis content is currently in development.\n\n## 15. Collection\
    \ Interfaces with Standard Query Operators\n\nThrough a set of extension methods\
    \ and lambda expressions, the programming API called **Language Integrated Query**\
    \ (**LINQ**) provides a far superior API for working with collections.^([1](#ch15.html_fn15_1))\
    \ In fact, in earlier editions of this book, the chapter on collections came immediately\
    \ after the chapter on generics and just before the one on delegates. However,\
    \ lambda expressions were so fundamental to LINQ that it is no longer possible\
    \ to cover collections without first covering delegates (the basis of lambda expressions).\
    \ Now that you have a solid foundation in lambda expressions from the preceding\
    \ two chapters, we can delve into the details of collections—a topic that spans\
    \ three chapters. In this chapter, the focus begins with **standard query operators**—a\
    \ means of leveraging LINQ via direct invocation of extension methods.\n\n[1](#ch15.html_fn15_1a).\
    \ Significant features added in C# 3.0 in collections attributable to LINQ.\n"
