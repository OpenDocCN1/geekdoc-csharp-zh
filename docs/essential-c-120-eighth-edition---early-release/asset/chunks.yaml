    \ to the 1900s:\");\n        patents = patents.ToArray();\n        Console.Write(\"\
    \   There are \");\n        Console.WriteLine(\n            $\"{ patents.Count()\
    \ } patents prior to 1900.\");\n\n        //...\n```\n\n**OUTPUT 15.4**\n\n```\n\
    1\\. Patents prior to the 1900s are:\n        Phonograph (1877)\n        Kinetoscope\
    \ (1888)\n        Electrical Telegraph (1837)\n        Steam Locomotive (1815)\n\
    \n2\\. A second listing of patents prior to the 1900s:\n        Phonograph (1877)\n\
    \        Kinetoscope (1888)\n        Electrical Telegraph (1837)\n        Steam\
