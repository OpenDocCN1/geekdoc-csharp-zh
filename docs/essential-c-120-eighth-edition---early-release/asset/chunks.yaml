    \n## 12. 泛型\n该内容正在开发中。\n\n## 13. 委托与 Lambda 表达式\n该内容正在开发中。\n\n## 14. 事件\n该内容正在开发中。\n\
    \n## 15. 带有标准查询运算符的集合接口\n\n通过一组扩展方法和 Lambda 表达式，被称为 **语言集成查询** (**LINQ**) 的编程\
    \ API 为处理集合提供了远优的 API。(1)事实上，在本书的早期版本中，集合章节紧接在泛型之后，并在委托章节之前。然而，Lambda 表达式对于 LINQ\
    \ 来说是核心，以至于在不先介绍委托（Lambda 表达式的基础）的情况下无法涵盖集合。现在你已经在前面的两个章节中掌握了 Lambda 表达式的基础，我们可以深入探讨集合——这是一个跨越三个章节的话题。在本章中重点是**标准查询运算符**——一种通过直接调用扩展方法来利用\
    \ LINQ 的手段。\n\n1。C# 3.0 在集合中引入的属于 LINQ 的重大功能。\n\n"
- fmt: "\nAfter introducing collection initializers, this chapter covers the various\
    \ collection interfaces and explores how they relate to one another. This is the\
    \ basis for understanding collections, so you should cover the material with diligence.\
    \ The section on collection interfaces includes coverage of the `IEnumerable<T>`\
    \ extension methods^([2](#ch15.html_fn15_2)) that implement the standard query\
    \ operators.\n\n[2](#ch15.html_fn15_2a). Added in C# 3.0.\n\nThere are two categories\
    \ of collection-related classes and interfaces: those that support generics and\
    \ those that don’t. This chapter primarily discusses the generic collection interfaces.\
    \ You should use collection classes that don’t support generics only when you\
    \ are writing components that need to interoperate with earlier versions of the\
    \ runtime. This is because everything that was available in the nongeneric form\
    \ has a generic replacement that is strongly typed. Although the concepts still\
    \ apply to both forms, we do not explicitly discuss the nongeneric versions.^([3](#ch15.html_fn15_3))\n\
    \n[3](#ch15.html_fn15_3a). In fact, .NET Standards and .NET Core don’t even include\
    \ the nongeneric collections.\n\n![Images](graphics/15fig00.jpg)\n\nThe chapter\
    \ concludes with an in-depth discussion of anonymous types—topics that we covered\
    \ only briefly in a few Advanced Topic sections in [Chapter 3](#ch03.html_ch03).\
    \ The interesting thing about anonymous types is that they have been eclipsed\
    \ by tuples^([4](#ch15.html_fn15_4))—a topic we discuss further at the end of\
    \ the chapter.\n\n[4](#ch15.html_fn15_4a). Starting in C# 7.0.\n\n### Collection\
    \ Initializers\n\nA `collection initializer` allows programmers to construct a\
    \ collection with an initial set of members at instantiation time in a manner\
    \ similar to array declaration. Before collection initialization was available,\
    \ elements had to be explicitly added to a collection after the collection was\
    \ instantiated—using something like `System.Collections.Generic.ICollection<T>`’s\
    \ `Add()` method. With collection initialization, the `Add()` calls are generated\
    \ by the C# compiler rather than explicitly coded by the developer. [LISTING 15.1](#ch15.html_list15_1)\
    \ shows how to initialize the collection using a collection initializer.\n\n**LISTING\
    \ 15.1: Collection Initialization**\n\n```\nusing System;\nusing System.Collections.Generic;\n\
    \npublic class Program\n{\n    public static void Main()\n    {\n        List<string>\
    \ sevenWorldBlunders;\n        sevenWorldBlunders = new List<string>()\n     \
    \   {\n            // Quotes from Gandhi\n            \"Wealth without work\"\
    ,\n            \"Pleasure without conscience\",\n            \"Knowledge without\
    \ character\",\n            \"Commerce without morality\",\n            \"Science\
    \ without humanity\",\n            \"Worship without sacrifice\",\n          \
    \  \"Politics without principle\"\n        };\n\n        Print(sevenWorldBlunders);\n\
    \    }\n\n    private static void Print<T>(IEnumerable<T> items)\n    {\n    \
    \    foreach(T item in items)\n        {\n            Console.WriteLine(item);\n\
    \        }\n    }\n}\n```\n\nThe syntax is similar not only to the array initialization\
    \ but also to an object initializer with the curly braces following the constructor.\
    \ If no parameters are passed in the constructor, the parentheses following the\
    \ data type are optional (as they are with object initializers).\n\nA few basic\
    \ requirements are needed for a collection initializer to compile successfully.\
    \ Ideally, the collection type to which a collection initializer is applied would\
    \ be of a type that implements `System.Collections.Generic.ICollection<T>`. This\
    \ ensures that the collection includes an `Add()` method that the compiler-generated\
    \ code can invoke. However, a relaxed version of the requirement also exists that\
    \ simply demands one or more `Add()` methods exist either as an extension method^([5](#ch15.html_fn15_5))\
    \ or as an instance method on a type that implements `IEnumerable`—even if the\
    \ collection doesn’t implement `ICollection<T>`. The `Add()` methods need to take\
    \ parameters that are compatible with the values specified in the collection initializer.\n\
    \n[5](#ch15.html_fn15_5a). Starting in C# 6.0.\n\nFor dictionaries, the collection\
    \ initializer syntax is slightly more complex, because each element in the dictionary\
    \ requires both the key and the value. This syntax is shown in [LISTING 15.2](#ch15.html_list15_2).\n\
    \n**LISTING 15.2: Initializing a `Dictionary<>` with a Collection Initializer**\n\
    \n```\nusing System;\nusing System.Collections.Generic;\n// ...\n#if !PRECSHARP6\n\
    \        Dictionary<string, ConsoleColor> colorMap =\n            new Dictionary<string,\
    \ ConsoleColor>\n            {\n                [\"Error\"] = ConsoleColor.Red,\n\
    \                [\"Warning\"] = ConsoleColor.Yellow,\n                [\"Information\"\
    ] = ConsoleColor.Green,\n                [\"Verbose\"] = ConsoleColor.White\n\
    \            };\n#else\n        Dictionary<string, ConsoleColor> colorMap =\n\
    \            new Dictionary<string, ConsoleColor>\n            {\n           \
    \     {\"Error\", ConsoleColor.Red },\n                {\"Warning\", ConsoleColor.Yellow\
    \ },\n                {\"Information\", ConsoleColor.Green },\n              \
    \  {\"Verbose\", ConsoleColor.White}\n            };\n#endif\n```\n\n[LISTING\
    \ 15.2](#ch15.html_list15_2) includes two different versions of the initialization.\
    \ The first demonstrates a new syntax,^([6](#ch15.html_fn15_6)) which expresses\
    \ the intent of the dictionary. The second syntax^([7](#ch15.html_fn15_7)) pairs\
    \ the name and value together using curly brackets.\n\n[6](#ch15.html_fn15_6).\
    \ Introduced in C# 6.0.\n\n[7](#ch15.html_fn15_7). Works in C# and later.\n\n\
    ### What Makes a Class a Collection: `IEnumerable`\n\nBy definition, a collection\
    \ within .NET is a class that, at a minimum, implements `IEnumerable`. This interface\
    \ is critical because implementing `IEnumerable` is the minimum needed to support\
    \ iterating over the collection.\n\n[Chapter 4](#ch04.html_ch04) showed how to\
    \ use a `foreach` statement to iterate over an array. This syntax is simple and\
    \ avoids the complication of having to know how many elements there are. The runtime\
    \ does not directly support the `foreach` statement, however. Instead, the C#\
    \ compiler transforms the code as described in this section.\n\n#### `foreach`\
    \ with Arrays\n\n[LISTING 15.3](#ch15.html_list15_3) demonstrates a simple `foreach`\
    \ loop iterating over an array of integers and then printing out each integer\
    \ to the console.\n\n**LISTING 15.3: `foreach` with Arrays**\n\n```\nint[] array\
    \ = new int[] { 1, 2, 3, 4, 5, 6 };\n\nforeach(int item in array)\n{\n    Console.WriteLine(item);\n\
    }\n```\n\nFrom this code, the C# compiler creates a CIL equivalent of the `for`\
    \ loop, as shown in [LISTING 15.4](#ch15.html_list15_4).\n\n**LISTING 15.4: Compiled\
    \ Implementation of `foreach` with Arrays**\n\n```\nint[] tempArray;\nint[] array\
    \ = new int[] { 1, 2, 3, 4, 5, 6 };\n\ntempArray = array;\nfor(int counter = 0;\
    \ (counter < tempArray.Length); counter++)\n{\n    int item = tempArray[counter];\n\
    \n    Console.WriteLine(item);\n}\n```\n\nIn this example, note that `foreach`\
    \ relies on support for the `Length` property and the index operator (`[]`). With\
    \ the `Length` property, the C# compiler can use the `for` statement to iterate\
    \ through each element in the array.\n"
  raw: "After introducing collection initializers, this chapter covers the various\
    \ collection interfaces and explores how they relate to one another. This is the\
    \ basis for understanding collections, so you should cover the material with diligence.\
    \ The section on collection interfaces includes coverage of the `IEnumerable<T>`\
    \ extension methods^([2](#ch15.html_fn15_2)) that implement the standard query\
    \ operators.\n\n[2](#ch15.html_fn15_2a). Added in C# 3.0.\n\nThere are two categories\
    \ of collection-related classes and interfaces: those that support generics and\
    \ those that don’t. This chapter primarily discusses the generic collection interfaces.\
    \ You should use collection classes that don’t support generics only when you\
    \ are writing components that need to interoperate with earlier versions of the\
    \ runtime. This is because everything that was available in the nongeneric form\
    \ has a generic replacement that is strongly typed. Although the concepts still\
    \ apply to both forms, we do not explicitly discuss the nongeneric versions.^([3](#ch15.html_fn15_3))\n\
    \n[3](#ch15.html_fn15_3a). In fact, .NET Standards and .NET Core don’t even include\
    \ the nongeneric collections.\n\n![Images](graphics/15fig00.jpg)\n\nThe chapter\
    \ concludes with an in-depth discussion of anonymous types—topics that we covered\
    \ only briefly in a few Advanced Topic sections in [Chapter 3](#ch03.html_ch03).\
    \ The interesting thing about anonymous types is that they have been eclipsed\
    \ by tuples^([4](#ch15.html_fn15_4))—a topic we discuss further at the end of\
    \ the chapter.\n\n[4](#ch15.html_fn15_4a). Starting in C# 7.0.\n\n### Collection\
    \ Initializers\n\nA **collection initializer** allows programmers to construct\
    \ a collection with an initial set of members at instantiation time in a manner\
    \ similar to array declaration. Before collection initialization was available,\
    \ elements had to be explicitly added to a collection after the collection was\
    \ instantiated—using something like `System.Collections.Generic.ICollection<T>`’s\
    \ `Add()` method. With collection initialization, the `Add()` calls are generated\
    \ by the C# compiler rather than explicitly coded by the developer. [LISTING 15.1](#ch15.html_list15_1)\
    \ shows how to initialize the collection using a collection initializer.\n\n**LISTING\
    \ 15.1: Collection Initialization**\n\n```\nusing System;\nusing System.Collections.Generic;\n\
    \npublic class Program\n{\n    public static void Main()\n    {\n        List<string>\
    \ sevenWorldBlunders;\n        sevenWorldBlunders = new List<string>()\n     \
    \   {\n            // Quotes from Gandhi\n            \"Wealth without work\"\
    ,\n            \"Pleasure without conscience\",\n            \"Knowledge without\
    \ character\",\n            \"Commerce without morality\",\n            \"Science\
    \ without humanity\",\n            \"Worship without sacrifice\",\n          \
    \  \"Politics without principle\"\n        };\n\n        Print(sevenWorldBlunders);\n\
    \    }\n\n    private static void Print<T>(IEnumerable<T> items)\n    {\n    \
    \    foreach(T item in items)\n        {\n            Console.WriteLine(item);\n\
    \        }\n    }\n}\n```\n\nThe syntax is similar not only to the array initialization\
    \ but also to an object initializer with the curly braces following the constructor.\
    \ If no parameters are passed in the constructor, the parentheses following the\
    \ data type are optional (as they are with object initializers).\n\nA few basic\
    \ requirements are needed for a collection initializer to compile successfully.\
    \ Ideally, the collection type to which a collection initializer is applied would\
    \ be of a type that implements `System.Collections.Generic.ICollection<T>`. This\
    \ ensures that the collection includes an `Add()` method that the compiler-generated\
    \ code can invoke. However, a relaxed version of the requirement also exists that\
    \ simply demands one or more `Add()` methods exist either as an extension method^([5](#ch15.html_fn15_5))\
    \ or as an instance method on a type that implements `IEnumerable`—even if the\
    \ collection doesn’t implement `ICollection<T>`. The `Add()` methods need to take\
    \ parameters that are compatible with the values specified in the collection initializer.\n\
    \n[5](#ch15.html_fn15_5a). Starting in C# 6.0.\n\nFor dictionaries, the collection\
    \ initializer syntax is slightly more complex, because each element in the dictionary\
    \ requires both the key and the value. This syntax is shown in [LISTING 15.2](#ch15.html_list15_2).\n\
    \n**LISTING 15.2: Initializing a `Dictionary<>` with a Collection Initializer**\n\
    \n```\nusing System;\nusing System.Collections.Generic;\n// ...\n#if !PRECSHARP6\n\
    \        Dictionary<string, ConsoleColor> colorMap =\n            new Dictionary<string,\
    \ ConsoleColor>\n            {\n                [\"Error\"] = ConsoleColor.Red,\n\
    \                [\"Warning\"] = ConsoleColor.Yellow,\n                [\"Information\"\
    ] = ConsoleColor.Green,\n                [\"Verbose\"] = ConsoleColor.White\n\
    \            };\n#else\n        Dictionary<string, ConsoleColor> colorMap =\n\
    \            new Dictionary<string, ConsoleColor>\n            {\n           \
    \     {\"Error\", ConsoleColor.Red },\n                {\"Warning\", ConsoleColor.Yellow\
    \ },\n                {\"Information\", ConsoleColor.Green },\n              \
    \  {\"Verbose\", ConsoleColor.White}\n            };\n#endif\n```\n\n[LISTING\
    \ 15.2](#ch15.html_list15_2) includes two different versions of the initialization.\
    \ The first demonstrates a new syntax,^([6](#ch15.html_fn15_6)) which expresses\
    \ the intent of a name/value pair by allowing the assignment operator to express\
    \ which value is associated with which key. The second syntax^([7](#ch15.html_fn15_7))\
    \ pairs the name and the value together using curly brackets.\n\n[6](#ch15.html_fn15_6a).\
    \ Introduced in C# 6.0.\n\n[7](#ch15.html_fn15_7a). Works in C# 6.0 and later.\n\
    \nAllowing initializers on collections that don’t support `ICollection<T>` was\
    \ important for two reasons. First, most collections (types that implement `IEnumerable<T>`)\
    \ do not also implement `ICollection<T>`, which significantly reduces the usefulness\
    \ of collection initializers. Second, matching on the method name and signature\
    \ compatibility with the collection initializer items enables greater diversity\
    \ in the items initialized into the collection. For example, the initializer now\
    \ can support `new DataStore(){ a, {b, c}}` as long as there is one `Add()` method\
    \ whose signature is compatible with `a` and a second `Add()` method whose signature\
    \ is compatible with `b, c`.\n\n### What Makes a Class a Collection: `IEnumerable`\n\
    \nBy definition, a collection within .NET is a class that, at a minimum, implements\
    \ `IEnumerable`. This interface is critical because implementing the methods of\
    \ `IEnumerable` is the minimum needed to support iterating over the collection.\n\
    \n[Chapter 4](#ch04.html_ch04) showed how to use a `foreach` statement to iterate\
    \ over an array of elements. This syntax is simple and avoids the complication\
    \ of having to know how many elements there are. The runtime does not directly\
    \ support the `foreach` statement, however. Instead, the C# compiler transforms\
    \ the code as described in this section.\n\n#### `foreach` with Arrays\n\n[LISTING\
    \ 15.3](#ch15.html_list15_3) demonstrates a simple `foreach` loop iterating over\
    \ an array of integers and then printing out each integer to the console.\n\n\
    **LISTING 15.3: `foreach` with Arrays**\n\n```\nint[] array = new int[] { 1, 2,\
    \ 3, 4, 5, 6 };\n\nforeach(int item in array)\n{\n    Console.WriteLine(item);\n\
    }\n```\n\nFrom this code, the C# compiler creates a CIL equivalent of the `for`\
    \ loop, as shown in [LISTING 15.4](#ch15.html_list15_4).\n\n**LISTING 15.4: Compiled\
    \ Implementation of `foreach` with Arrays**\n\n```\nint[] tempArray;\nint[] array\
    \ = new int[] { 1, 2, 3, 4, 5, 6 };\n\ntempArray = array;\nfor(int counter = 0;\
    \ (counter < tempArray.Length); counter++)\n{\n    int item = tempArray[counter];\n\
    \n    Console.WriteLine(item);\n}\n```\n\nIn this example, note that `foreach`\
    \ relies on support for the `Length` property and the index operator (`[]`). With\
    \ the `Length` property, the C# compiler can use the `for` statement to iterate\
    \ through each element in the array."
