  trans: "\n\n```\nMark Michaelis (Chief Computer Nerd)\n        Corporate\nMichael\
    \ Stokesbary (Senior Computer Wizard)\n        Engineering\nBrian Jones (Enterprise\
    \ Integration Guru)\n        Engineering\nAnne Beard (HR Director)\n        Human\
    \ Resources\nPat Dever (Enterprise Architect)\n        Information Technology\n\
    Kevin Bost (Programmer Extraordinaire)\n        Engineering\nThomas Heavey (Software\
    \ Architect)\n        Engineering\nEric Edmonds (Philanthropy Coordinator)\n \
    \       Philanthropy\n```\n\n`Join()` 的第一个参数名称为 `inner`。它指定了 `employees` 要连接的集合\
    \ `departments`。接下来两个参数是 lambda 表达式，指定了两个集合如何连接。`employee => employee.DepartmentId`（参数名称为\
    \ `outerKeySelector`）标识了在每个 `employee` 上，键将是 `DepartmentId`。下一个 lambda 表达式（`department\
    \ => department.Id`）将 `Department` 的 `Id` 属性指定为键——换句话说，对于每个员工，连接一个 `employee.DepartmentId`\
    \ 等于 `department.Id` 的部门。最后一个参数是所选定的结果项。在这种情况下，它是一个包含 `Employee` 的 `Id`、`Name`\
    \ 和 `Title`，以及一个带有连接的 `department` 对象的 `Department` 属性的元组。\n\n注意输出中 `Engineering`\
    \ 出现了多次——CorporateData 中的每个员工一次。在这种情况下，`Join()` 调用在所有部门和所有员工之间产生了**笛卡尔积**，使得每当两个集合中都存在记录且指定的部门\
    \ ID 相同时，就会创建一个新记录。这种类型的连接是内连接。\n\n数据也可以反向进行连接，使 `department` 连接到每个 `employee`，以列出每个部门到员工的匹配。注意，输出包含的记录比部门的数量要多：每个部门都有多个员工，且输出为每个匹配有一条记录。正如我们之前看到的，Engineering\
    \ 部门出现了多次，每个员工出现一次。\n\nLISTING 15.20 中的代码（产生 OUTPUT 15.8）与 LISTING 15.19 中的代码类似，只是对象\
    \ `Department` 和 `Employee` 的顺序反过来了。`Join()` 的第一个参数是 `employees`，表示 `departments`\
    \ 连接的对象。接下来的两个参数是 lambda 表达式，指定了两个集合如何连接：针对 `departments` 的 `department => department.Id`\
    \ 和针对 `employees` 的 `employee => employee.DepartmentId`。与之前，只要 `department.Id`\
    \ 等于 `employee.EmployeeId`，就会发生连接。最后的元组参数指定了一个具有 `int Id`、`string Name` 和 `Employee\
    \ Employee` 项目的类。（在表达式中指定名称是可选的，但为了清晰起见在此使用了。）\n\n**LISTING 15.20: 使用 System.Linq.Enumerable.Join()\
    \ 的另一个内连接**\n\n```\nusing System;\nusing System.Collections.Generic;\nusing System.Linq;\n\
    // ...\n        Department[] departments = CorporateData.Departments;\n      \
    \  Employee[] employees = CorporateData.Employees;\n\n        IEnumerable<(long\
    \ Id, string Name, Employee Employee)> items =\n            departments.Join(\n\
    \                employees,\n                department => department.Id,\n  \
    \              employee => employee.DepartmentId,\n                (department,\
    \ employee) => (\n                    department.Id, \n                    department.Name,\
    \ \n                    Employee: employee)\n                );\n\n        foreach\
    \ ((long Id, string Name, Employee Employee) item in items)\n        {\n     \
    \       Console.WriteLine(item.Name);\n            Console.WriteLine(\"\\t\" +\
    \ item.Employee);\n        }\n        //...\n```\n\n**OUTPUT 15.8**\n\n```\nCorporate\n\
    \        Mark Michaelis (Chief Computer Nerd)\nHuman Resources\n        Anne Beard\
    \ (HR Director)\nEngineering\n        Michael Stokesbary (Senior Computer Wizard)\n\
    Engineering\n        Brian Jones (Enterprise Integration Guru)\nEngineering\n\
    \        Kevin Bost (Programmer Extraordinaire)\nEngineering\n        Thomas Heavey\
    \ (Software Architect)\nInformation Technology\n        Pat Dever (Enterprise\
    \ Architect)\nPhilanthropy\n        Eric Edmonds (Philanthropy Coordinator)\n\
    ```\n\n除了排序和连接对象集合外，你可能希望对具有相似特征的对象进行分组。对于员工数据，你可能想按部门、地区、职位名称等对员工进行分组。LISTING\
    \ 15.21 展示了如何使用 `GroupBy()` 标准查询操作符来实现这一点（查看 OUTPUT 15.9 查看结果）。\n\n**LISTING 15.21:\
    \ 使用 System.Linq.Enumerable.GroupBy() 分组项**\n\n```csharp\nusing System;\nusing\
    \ System.Collections.Generic;\nusing System.Linq;\n// ...\n        IEnumerable<Employee>\
    \ employees = CorporateData.Employees;\n\n        IEnumerable<IGrouping<int, Employee>>\
    \ groupedEmployees =\n            employees.GroupBy((employee) => employee.DepartmentId);\n\
    \n        foreach(IGrouping<int, Employee> employeeGroup in\n            groupedEmployees)\n\
    \        {\n            Console.WriteLine();\n            foreach(Employee employee\
    \ in employeeGroup)\n            {\n                Console.WriteLine(employee);\n\
    \            }\n            Console.WriteLine(\n              \"\\tCount: \" +\
    \ employeeGroup.Count());\n        }\n        //...\n```\n\n**OUTPUT 15.9**\n\n\
    ```\nMark Michaelis (Chief Computer Nerd)\n    Count: 1\n\nMichael Stokesbary\
    \ (Senior Computer Wizard)\nBrian Jones (Enterprise Integration Guru)\nKevin Bost\
    \ (Programmer Extraordinaire)\nThomas Heavey (Software Architect)\n    Count:\
    \ 4\n\nAnne Beard (HR Director)\n    Count: 1\n\nPat Dever (Enterprise Architect)\n\
    \    Count: 1\n\nEric Edmonds (Philanthropy Coordinator)\n    Count: 1\n```\n\n\
    注意，`GroupBy()` 输出的项类型为 `IGrouping<TKey, TElement>`，它包含分组依据的键属性（`employee.DepartmentId`）。但它没有组项的属性。相反，`IGrouping<TKey,\
    \ TElement>` 派自 `IEnumerable<T>`，允许对组内进行枚举，或将数据聚合为某些值（如 `employeeGroup.Count()`）。\n\
    \n 使用 GroupJoin() 实现一对多关系\n\n"
- fmt: "\n```c\nusing System;\nusing System.Collections.Generic;\nusing System.Linq;\n\
    // ...\n        Department[] departments = CorporateData.Departments;\n      \
    \  Employee[] employees = CorporateData.Employees;\n\n        IEnumerable<(long\
    \ Id, string Name, IEnumerable<Employee> Employees)> items =\n            departments.GroupJoin(\n\
    \                employees,\n                department => department.Id,\n  \
    \              employee => employee.DepartmentId,\n                (department,\
    \ departmentEmployees) => (\n                    department.Id,\n            \
    \        department.Name,\n                    departmentEmployees\n         \
    \       ));\n\n        foreach (\n            (_, string name, IEnumerable<Employee>\
    \ employeeCollection) i in items)\n        {\n            Console.WriteLine(name);\n\
    \            foreach (Employee employee in employeeCollection)\n            {\n\
    \                Console.WriteLine(\"\\t\" + employee);\n            }\n     \
    \   }\n        //...\n```\n\nOUTPUT 15.10\n\n```c\nCorporate\n        Mark Michaelis\
    \ (Chief Computer Nerd)\nHuman Resources\n        Anne Beard (HR Director)\nEngineering\n\
    \        Michael Stokesbary (Senior Computer Wizard)\n        Brian Jones (Enterprise\
    \ Integration Guru)\n        Kevin Bost (Programmer Extraordinaire)\n        Thomas\
    \ Heavey (Software Architect)\nInformation Technology\n        Pat Dever (Enterprise\
    \ Architect)\nPhilanthropy\n        Eric Edmonds (Philanthropy Coordinator)\n\
    ```\n\nTo achieve the preferred result, we use `System.Linq.Enumerable`’s `GroupJoin()`\
    \ method. The parameters are the same as those in [LISTING 15.19](#ch15.html_list15_19),\
    \ except for the final tuple selected. In [LISTING 15.19](#ch15.html_list15_19),\
    \ the lambda expression is of type `Func<Department, IEnumerable<Employee>, (long\
    \ Id, string Name, IEnumerable<Employee> Employees)>``(long Id, string Name, IEnumerable<Employee>\
    \ Employees)`. Notice that we use the second type argument (`IEnumerable<Employee>`)\
    \ to project the collection of employees for each department onto the resultant\
    \ department tuple; thus each department in the resulting collection includes\
    \ a list of the employees.\n\n(Readers familiar with SQL will notice that, unlike\
    \ `Join()`, `GroupJoin()` doesn’t have a SQL equivalent because the data returned\
    \ by SQL is record based, not hierarchical.)\n\n### Advanced Topic: Implementing\
    \ an Outer Join with `GroupJoin()`\n\nThe earlier inner joins are *equi-joins*\
    \ because they are based on an equivalent evaluation of the keys. Records appear\
    \ in the resultant collection only if there are objects in both collections. On\
    \ occasion, however, you might want to create a record even if the corresponding\
    \ object doesn’t exist. For example, rather than leaving the Marketing department\
    \ out from the final department list simply because it doesn’t have any employees,\
    \ it would be preferable if we included it with an empty employee list. To accomplish\
    \ this, we perform a left outer join using a combination of both `GroupJoin()`\
    \ and `SelectMany()`, along with `DefaultIfEmpty()`. This is demonstrated in [LISTING\
    \ 15.23](#ch15.html_list15_23) and [OUTPUT 15.11](#ch15.html_op15_11).\n\n###\
    \ LISTING 15.23: Implementing an Outer Join Using `GroupJoin()` with `SelectMany()`\n\
    \n```c\nusing System;\nusing System.Linq;\n// ...\n        Department[] departments\
    \ = CorporateData.Departments;\n        Employee[] employees = CorporateData.Employees;\n\
    \n        var items = departments.GroupJoin(\n            employees,\n       \
    \     department => department.Id,\n            employee => employee.DepartmentId,\n\
    \            (department, departmentEmployees) => new\n            {\n       \
    \         department.Id,\n                department.Name,\n                Employees\
    \ = departmentEmployees\n            }).SelectMany(\n                departmentRecord\
    \ =>\n                    departmentRecord.Employees.DefaultIfEmpty(),\n     \
    \           (departmentRecord, employee) => new\n                {\n         \
    \           departmentRecord.Id,\n                    departmentRecord.Name,\n\
    \                    departmentRecord.Employees\n                }).Distinct();\n\
    \n        foreach (var item in items)\n        {\n            Console.WriteLine(item.Name);\n\
    \            foreach (Employee employee in item.Employees)\n            {\n  \
    \              Console.WriteLine(\"\\t\" + employee);\n            }\n       \
    \ }\n        //...\n```\n\nOUTPUT 15.11\n\n```c\nCorporate\n        Mark Michaelis\
    \ (Chief Computer Nerd)\nHuman Resources\n        Anne Beard (HR Director)\nEngineering\n\
    \        Michael Stokesbary (Senior Computer Wizard)\n        Brian Jones (Enterprise\
    \ Integration Guru)\n        Kevin Bost (Programmer Extraordinaire)\n        Thomas\
    \ Heavey (Software Architect)\nInformation Technology\n        Pat Dever (Enterprise\
    \ Architect)\nPhilanthropy\n        Eric Edmonds (Philanthropy Coordinator)\n\
    Marketing\n```\n\n#### Calling `SelectMany()`\n\nOn occasion, you may have collections\
    \ of collections. [LISTING 15.24](#ch15.html_list15_24) provides an example of\
    \ such a scenario. The `teams` array contains two teams, each with a string array\
    \ of players.\n\n### LISTING 15.24: Calling `SelectMany()`\n\n```c\nusing System;\n\
    using System.Collections.Generic;\nusing System.Linq;\n// ...\n        (string\
    \ Team, string[] Players)\n            [] worldCup2006Finalists = new[]\n    \
    \    {\n            (\n                TeamName: \"France\",\n               \
    \ Players: new string[]\n                {\n                    \"Fabien Barthez\"\
    , \"Gregory Coupet\",\n                    \"Mickael Landreau\", \"Eric Abidal\"\
    ,\n                    \"Jean-Alain Boumsong\", \"Pascal Chimbonda\",\n      \
    \              \"William Gallas\", \"Gael Givet\",\n                    \"Willy\
    \ Sagnol\", \"Mikael Silvestre\",\n                    \"Lilian Thuram\", \"Djibril\
    \ Dhoras\",\n                    \"Alou Diarra\", \"Claude Makelele\",\n     \
    \               \"Zinedine Zidane\", \"Patrick Vieira\",\n                   \
    \ \"Thierry Henry\", \"Franck Ribery\",\n                    \"Louis Saha\", \"\
    David Trezegu\",\n                    \"Sylvain Wiltord\",\n                }\n\
    \            ),\n            (\n                TeamName: \"Italy\",\n       \
    \         Players: new string[]\n                {\n                    \"Gianluigi\
    \ Buffon\", \"Angelo Peruzzi\",\n                    \"Marco Amelia\", \"Cristian\
    \ Zaccardo\",\n                    \"Alessandro Nesta\", \"Gianluca Zambrotta\"\
    ,\n                    \"Fabio Cannavaro\", \"Marco Materazzi\",\n           \
    \         \"Fabio Grosso\", \"Massimo Oddo\",\n                    \"Andrea Barzagli\"\
    , \"Andrea Pirlo\",\n                    \"Gennaro Gattuso\", \"Daniele De Rossi\"\
    ,\n                    \"Mauro Camoranesi\", \"Simone Perrotta\",\n          \
    \          \"Simone Barone\", \"Luca Toni\",\n                    \"Alessandro\
    \ Del Piero\", \"Francesco Totti\",\n                    \"Alberto Gilardino\"\
    , \"Filippo Inzaghi\",\n                    \"Vincenzo Iaquinta\",\n         \
    \       }\n            )\n        };\n\n        IEnumerable<string> players =\n\
    \            worldCup2006Finalists.SelectMany(\n                team => team.Players);\n\
    \n        Print(players);\n        //...\n```\n\nThe output from this listing\
    \ has each player’s name displayed on its own line in the order in which it appears\
    \ in the code. The difference between `Select()` and `SelectMany()` is that `Select()`\
    \ would return two items, one corresponding to each item in the original collection.\
    \ `Select()` may project out a transform from the original type, but the number\
    \ of items would not change. For example, `teams.Select(team => team.Players)`\
    \ will return an `IEnumerable<string[]>`.\n\nIn contrast, `SelectMany()` iterates\
    \ across each item identified by the lambda expression (the array selected by\
    \ `Select()` earlier) and hoists out each item into a new collection that includes\
    \ a union of all items within the child collection. Instead of two arrays of players,\
    \ `SelectMany()` combines each array selected and produces a single collection\
    \ of all items.\n\n#### More Standard Query Operators\n\n[LISTING 15.25](#ch15.html_list15_25)\
    \ shows code that uses some of the simpler APIs enabled by `Enumerable`; [OUTPUT\
    \ 15.12](#ch15.html_op15_12) shows the results.\n"
