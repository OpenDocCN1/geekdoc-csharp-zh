    \n**LISTING 16.16: Simple Query Expression**\n\n```\nprivate static void ShowContextualKeywords1()\n\
    {\n    IEnumerable<string> selection =\n        from word in CSharp.Keywords\n\
    \        where !word.Contains('*')\n        select word;\n    // ...\n}\n```\n\
    \nAfter compilation, the expression from [LISTING 16.16](#ch16.html_list16_16)\
    \ is converted to an `IEnumerable<T>` extension method call from `System.Linq.Enumerable`,\
    \ as shown in [LISTING 16.17](#ch16.html_list16_17).\n\n**LISTING 16.17: Query\
    \ Expression Translated to Standard Query Operator Syntax**\n\n```\nprivate static\
    \ void ShowContextualKeywords2()\n{\n    IEnumerable<string> selection =     \
    \                                \n        CSharp.Keywords.Where(word => !word.Contains('*'));\
    \             \n    // ...\n}\n```\n\nAs discussed in [Chapter 15](#ch15.html_ch15),\
    \ the lambda expression is then itself translated by the compiler to emit a method\
    \ with the body of the lambda, and its usage entails allocation of a delegate\
