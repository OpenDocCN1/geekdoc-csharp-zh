  trans: "\n数组、`dictionaries`（字典）和列表都提供了一个 `indexer`（索引器），作为根据键或索引获取或设置集合成员的方便方式。正如我们所看到的，要使用索引器，你只需在集合名称后的方括号中放入索引（或多个索引）即可。你可以定义自己的索引器；代码\
    \ 17.9 展示了一个使用 `Pair<T>` 的示例。\n\n### 代码 17.9：定义索引器\n\n```cs\ninterface IPair<T>\n\
    {\n    T First { get; }\n    T Second { get; }\n    T this[PairItem index] { get;\
    \ }                                \n}\n\npublic enum PairItem\n{\n    First,\n\
    \    Second\n}\n\npublic struct Pair<T> : IPair<T>\n{\n    public Pair(T first,\
    \ T second)\n    {\n        First = first;\n        Second = second;\n    }\n\n\
    \    public T First { get; }\n    public T Second { get; }\n\n    public T this[PairItem\
    \ index]                                  \n    {                            \
    \                                  \n        get                             \
    \  \n        {                                                          \n   \
    \         switch (index)\n            {\n                case PairItem.First:\n\
    \                    return First;\n                case PairItem.Second:\n  \
    \                  return Second;\n                default:\n                \
    \    throw new NotImplementedException(\n                        $\"The enum {\
    \ index.ToString() } has not been implemented\");\n\n            }\n        }\n\
    \        // ...\n    }                                                       \
    \       \n}\n```\n\n索引器的声明方式与属性非常相似，不同在于你不是使用属性名称，而是使用关键字 `this` 后跟一个方括号内的参数列表。其体也像属性一样，包含\
    \ `get` 和 `set` 块。如 代码 17.9 所示，参数不需要是 `int`。事实上，索引可以接受多个参数，甚至可以进行重载。此示例使用 `enum`\
    \ 来减少调用者为不存在的项提供索引的概率。\n\nC# 编译器从索引操作符创建的公共中间语言 (CIL) 代码是一个名为 `Item` 的特殊属性，它接收一个参数。在\
    \ C# 中无法显式创建接受参数的属性，因此 `Item` 属性在这方面是唯一的。任何标识符为 `Item` 的额外成员，即使其签名完全不同，也会与编译器创建的成员冲突，因此是不允许的。\n\
    \n### 高级主题：使用 `IndexerName` 分配索引器属性名称\n\n如前所述，索引器的 CIL 属性名称默认为 `Item`。然而，使用 `IndexerNameAttibute`\
    \ 属性，你可以指定不同的名称。例如，代码 17.10 将名称更改为 `\"Entry\"`。\n\n### 代码 17.10：更改索引器的默认名称\n\n\
    ```cs\n[System.Runtime.CompilerServices.IndexerName(\"Entry\")]\npublic T this[PairItem\
    \ index]\n{\n    // ...\n}\n```\n\n这对于 C# 的索引调用者没有影响，但它为那些直接支持索引器的语言指定了名称。\n\n\
    `IndexerNameAttibute` 仅仅是编译器为索引器使用不同名称的指令；该属性实际上并不会被编译器发布到元数据中，因此无法通过反射访问。\n\n\
    ### 高级主题：使用变长参数定义索引操作符\n\n索引操作符也可以接受变长参数列表。例如，代码 17.11 为 `BinaryTree<T>` 定义了一个索引操作符，这在\
    \ 第 12 章 中讨论过（并在下一节中也会再次讨论）。\n\n### 代码 17.11：使用变长参数定义索引操作符\n\n```cs\nusing System;\n\
    \npublic class BinaryTree<T> \n{\n    // ...\n    public BinaryTree<T> this[params\
    \ PairItem[]? branches]\n    {\n        get\n        {\n            BinaryTree<T>\
    \ currentNode = this;\n\n            // 允许空数组或 null\n            // 指向根节点\n  \
    \          int totalLevels = branches?.Length ?? 0;\n            int currentLevel\
    \ = 0;\n\n            while (currentLevel < totalLevels)\n            {\n    \
    \            System.Diagnostics.Debug.Assert(branches != null,\n             \
    \       $\"{ nameof(branches) } != null\");\n\n                currentNode = currentNode.SubItems[\n\
    \                    branches[currentLevel]];\n                if (currentNode\
    \ == null)\n                {\n                    // 此位置的二叉树为 null\n        \
    \            throw new IndexOutOfRangeException();\n                }\n      \
    \          currentLevel++;\n            }\n            return currentNode;\n \
    \       }\n    }\n    // ...\n}\n```\n\n`branches` 中的每个项都是一个 `PairItem`，指示在二叉树中向下导航到哪个分支。例如，\n\
    \n```cs\ntree[PairItem.Second, PairItem.First].Value\n```\n\n将检索位于第一个分支中的第二个项、紧接着是该分支中的第一个分支的值。\n\
    \n### 返回 `null` 或空集合\n\n在返回数组或集合时，你必须通过返回 `null` 或一个没有项的集合实例来指示有零项。通常情况下，更好的选择是返回一个没有项的集合实例。通过这样做，你可以避免强制调用者在遍历集合之前检查\
    \ `null`。\n"
- fmt: "\nIf classes want to support iteration using the `foreach` loop construct,\
    \ they must implement the enumerator pattern. As [Chapter 15](#ch15.html_ch15)\
    \ describes, in C# the `foreach` loop construct is expanded by the compiler into\
    \ the `while` loop construct based on the `IEnumerator<T>` interface that is retrieved\
    \ from the `IEnumerable<T>` interface.\n\nThe problem with the enumeration pattern\
    \ is that it can be cumbersome to implement manually, because it must maintain\
    \ all the state necessary to describe the current position in the collection.\
    \ This internal state may be simple for a list collection type class; the index\
    \ of the current position usually suffices. In contrast, for data structures that\
    \ require recursive traversal, such as binary trees, the state can be quite complicated.^([4](#ch17.html_fn17_4))\n\
    \nC# 2.0 included a construct that makes it easier for a class to dictate how\
    \ the `foreach` loop iterates over its contents.\n\n### Defining an Iterator\n\
    \nIterators are a means to implement methods of a class, and they are syntactic\
    \ shortcuts for the more complex enumerator pattern. When the C# compiler encounters\
    \ an iterator, it expands its contents into CIL code that implements the enumerator\
    \ pattern. As such, there are no runtime dependencies for implementing iterators.\
    \ Because the C# compiler handles implementation through CIL code generation,\
    \ there is no real runtime performance benefit from using iterators. However,\
    \ a substantial programmer productivity gain may be realized by choosing iterators\
    \ over the manual implementation of the enumerator pattern. To understand how\
    \ this improvement arises, we must first consider how an iterator is defined in\
    \ code.\n\n### Iterator Syntax\n\nAn iterator provides a shorthand implementation\
    \ of iterator interfaces, the combination of the `IEnumerable<T>` and `IEnumerator<T>`\
    \ interfaces. [LISTING 17.12](#ch17.html_list17_12) declares an iterator for the\
    \ generic `BinaryTree<T>` type by creating a `GetEnumerator()` method. Next, you\
    \ will add support for the iterator interfaces.\n\n**LISTING 17.12: Iterator Interfaces\
    \ Pattern**\n\n```\nusing System.Collections;\nusing System.Collections.Generic;\n\
    \npublic class BinaryTree<T> :\nIEnumerable<T>                               \
    \                     \n{\n    public BinaryTree(T value)\n    {\n        Value\
    \ = value;\n    }\n\n    #region IEnumerable<T>\n    public IEnumerator<T> GetEnumerator()\
    \                         \n    {\n        // ...\n    }\n    #endregion IEnumerable<T>\n\
    \n    public T Value { get; }\n    public Pair<BinaryTree<T>> SubItems { get;\
    \ set; }\n}\n\npublic struct Pair<T>\n{\n    public Pair(T first, T second) :\
    \ this()\n    {\n        First = first;\n        Second = second;\n    }\n   \
    \ public T First { get; }\n    public T Second { get; }\n}\n```\n\nAs [LISTING\
    \ 17.12](#ch17.html_list17_12) shows, we need to provide an implementation for\
    \ the `GetEnumerator()` method.\n\n### Yielding Values from an Iterator\n\nIterators\
    \ are like functions, but instead of returning a single value, they *yield* a\
    \ sequence of values, one at a time. In the case of `BinaryTree<T>`, the iterator\
    \ yields a sequence of values of the type argument provided for `T`. If the nongeneric\
    \ version of `IEnumerator` is used, the yielded values will instead be of type\
    \ `object`.\n\nTo correctly implement the iterator pattern, you need to maintain\
    \ some internal state to keep track of where you are while enumerating the collection.\
    \ In the `BinaryTree<T>` case, you track which elements within the tree have already\
    \ been enumerated and which are still to come. Iterators are transformed by the\
    \ compiler into a “state machine” that keeps track of the current position and\
    \ knows how to “move itself” to the next position.\n\nThe `yield return` statement\
    \ yields a value each time an iterator encounters it; control immediately returns\
    \ to the caller that requested the item. (An interesting point here is that control\
    \ really does *immediately* return, unlike, ironically, the `return` statement.\
    \ A `return` statement will run finally blocks along the way; `yield return` does\
    \ not.) When the caller requests the next item, the code begins to execute immediately\
    \ following the previously executed `yield return` statement. In [LISTING 17.13](#ch17.html_list17_13),\
    \ you return the C# built-in data type keywords sequentially. Results are shown\
    \ in [OUTPUT 17.5](#ch17.html_op17_5).\n\n**LISTING 17.13: Yielding Some C# Keywords\
    \ Sequentially**\n\n```\nusing System;\nusing System.Collections.Generic;\n\n\
    public class CSharpBuiltInTypes : IEnumerable<string>\n{\n    public IEnumerator<string>\
    \ GetEnumerator()\n    {\n        yield return \"object\";\n        yield return\
    \ \"byte\";\n        yield return \"uint\";\n        yield return \"ulong\";\n\
    \        yield return \"float\";\n        yield return \"char\";\n        yield\
    \ return \"bool\";\n        yield return \"ushort\";\n        yield return \"\
    decimal\";\n        yield return \"int\";\n        yield return \"sbyte\";\n \
    \       yield return \"short\";\n        yield return \"long\";\n        yield\
    \ return \"void\";\n        yield return \"double\";\n        yield return \"\
    string\";\n    }\n\n    // The IEnumerable.GetEnumerator method is also required\n\
    \    // because IEnumerable<T> derives from IEnumerable\n    System.Collections.IEnumerator\n\
    \        System.Collections.IEnumerable.GetEnumerator()\n    {\n        // Invoke\
    \ IEnumerator<string> GetEnumerator() above\n        return GetEnumerator();\n\
    \    }\n}\npublic class Program\n{\n    public static void Main()\n    {\n   \
    \     var keywords = new CSharpBuiltInTypes();\n        foreach (string keyword\
    \ in keywords)\n        {\n            Console.WriteLine(keyword);\n        }\n\
    \    }\n}\n```\n\n**OUTPUT 17.5**\n\n```\nobject\nbyte\nuint\nulong\nfloat\nchar\n\
    bool\nushort\ndecimal\nint\nsbyte\nshort\nlong\nvoid\ndouble\nstring\n```\n\n\
    The output from this listing is a listing of the C# built-in types.\n\n### Iterators\
    \ and State\n\nWhen `GetEnumerator()` is first called in a `foreach` statement,\
    \ such as `foreach (string keyword in keywords)` in [LISTING 17.13](#ch17.html_list17_13),\
    \ an iterator object is created and its state is initialized to a special “start”\
    \ state that represents the fact that no code has executed in the iterator and,\
    \ therefore, no values have been yielded yet. The iterator maintains its state\
    \ as long as the `foreach` statement at the call site continues to execute. Every\
    \ time the loop requests the next value, control enters the iterator and continues\
    \ where it left off the previous time around the loop; the state information stored\
    \ in the iterator object is used to determine where control must resume. When\
    \ the `foreach` statement at the call site terminates, the iterator’s state is\
    \ no longer saved.\n\nIt is always safe to call `GetEnumerator()` again; “fresh”\
    \ enumerator objects will be created when necessary.\n\n[FIGURE 17.8](#ch17.html_ch17fig08)\
    \ shows a high-level sequence diagram of what takes place. Remember that the `MoveNext()`\
    \ method appears on the `IEnumerator<T>` interface.\n\n![Images](graphics/17fig08.jpg)\n\
    \n**FIGURE 17.8: Sequence diagram with `yield return` application**\n"
