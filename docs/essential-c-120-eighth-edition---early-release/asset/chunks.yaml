  trans: "\n\n最后，利用元组（tuples），我们可以创建一个 `IEnumerable<T>` 集合，其中 `T` 是一个元组（参见 列表 15.13\
    \ 和 输出 15.3）。\n\n### 列表 15.12：使用 `System.Linq.Enumerable.Select()` 和 `new` 进行投影\n\
    \n```cs\n//...\nIEnumerable<string> fileList = Directory.EnumerateFiles(\n   \
    \ rootDirectory, searchPattern);\nIEnumerable<FileInfo> files = fileList.Select(\n\
    \    file => new FileInfo(file));\n//...\n```\n\n### 列表 15.13：投影到元组\n\n```cs\n\
    //...\nIEnumerable<string> fileList = Directory.EnumerateFiles(\nrootDirectory,\
    \ searchPattern);\nIEnumerable<(string FileName, long Size)> items = fileList.Select(\
    \         \n    file =>                                                      \
    \          \n    {                                                           \
    \           \n        FileInfo fileInfo = new FileInfo(file);                \
    \            \n        return (                                              \
    \             \n            FileName: fileInfo.Name,                         \
    \              \n            Size: fileInfo.Length                           \
    \               \n        );                                                 \
    \                \n    });                                                   \
    \                 \n//...\n```\n\n### 输出 15.3\n\n```\nFileName = AssemblyInfo.cs,\
    \ Size = 1704\nFileName = CodeAnalysisRules.xml, Size = 735\nFileName = CustomDictionary.xml,\
    \ Size = 199\nFileName = EssentialCSharp.sln, Size = 40415\nFileName = EssentialCSharp.suo,\
    \ Size = 454656\nFileName = EssentialCSharp.vsmdi, Size = 499\nFileName = EssentialCSharp.vssscc,\
    \ Size = 256\nFileName = intelliTechture.ConsoleTester.dll, Size = 24576\nFileName\
    \ = intelliTechture.ConsoleTester.pdb, Size = 30208\n```\n\n匿名类型的输出会自动显示属性名及其值，这些是通过与匿名类型关联的生成的\
    \ `ToString()` 方法来实现的。\n\n使用 `Select()` 方法进行投影是非常强大的。我们已经看到如何使用 `Where()` 标准查询操作符对集合进行垂直过滤（减少集合中的项目数量）。现在，通过\
    \ `Select()` 标准查询操作符，我们还可以水平地缩小集合（减少列的数）或完全转换数据。`Where()` 和 `Select()` 结合使用提供了一种仅提取原始集合中当前算法所需的各个部分的方法。仅这两种方法就提供了一个强大的集合操作\
    \ API，而如果没有它们，代码将变得冗余得多，且可读性更差。\n\n### 进阶主题：并行运行 LINQ 查询\n\n随着具有多个处理器以及这些处理器内部具有多个核心的计算机的普及，轻松利用额外处理能力的能力变得更加重要。为了实现这一点，程序需要支持多线程，以便工作可以在计算机内不同的\
    \ CPU 上同时进行。列表 15.14 演示了使用并行 LINQ (PLINQ) 实现此点的一种方法。\n\n### 列表 15.14：并行执行 LINQ\
    \ 查询\n\n```cs\n//...\nIEnumerable<string> fileList = Directory.EnumerateFiles(\n\
    \    rootDirectory, searchPattern);\nvar items = fileList.AsParallel().Select(\
    \                                 \n    file =>\n    {\n        FileInfo fileInfo\
    \ = new FileInfo(file);\n        return new\n        {\n            FileName =\
    \ fileInfo.Name,\n            Size = fileInfo.Length\n        };\n    });\n//...\n\
    ```\n\n如 列表 15.14 所示，对代码进行极小的更改即可启用并行支持。此示例中使用的仅是 Microsoft .NET Framework 4 引入的标准查询操作符\
    \ `AsParallel()`，它作用于静态类 `System.Linq.ParallelEnumerable`。通过使用这个简单的扩展方法，运行时开始并行执行\
    \ `fileList` 集合中的项目，并并行返回结果对象。在这种情况下，每个并行操作本身并不特别昂贵（尽管相对于正在执行的其他操作而言），但请考虑加密或压缩等\
    \ CPU 密集型操作带来的负担。在多个 CPU 上并行运行查询可以将执行时间缩短到与 CPU 核心数相应的倍数。\n\n一个需要注意的重要警示（这也是为什么\
    \ `AsParallel()` 出现为进阶主题而不是标准正文原因）是，并行执行可能会引入竞态条件，导致一个线程上的操作与另一个线程上的操作交织，从而导致数据损坏。为了避免这个问题，对于从多个线程共享访问的数据，需要同步机制来强制在必要时使操作具有原子性。然而，同步本身可能会导致冻结执行的死锁，使有效的并行编程更加复杂。\n\
    \n关于此以及其他多线程主题的更多细节请参阅第 19 章 至第 22 章。\n\n#### 使用 `Count()` 计算元素\n\n对项目集合经常执行的另一个查询是获取计数。为了支持这种查询，LINQ\
    \ 包含了 `Count()` 扩展方法。\n\n列表 15.15 演示了 `Count()` 被重载，可以简单的计算所有元素（无参数），或接受一个谓词来仅计算由谓词表达式识别的项目。\n\
    \n### 列表 15.15：使用 `Count()` 计数项目\n\n```cs\nusing System;\nusing System.Collections.Generic;\n\
    using System.Linq;\n\npublic class Program\n{\n    public static void Main()\n\
    \    {\n        IEnumerable<Patent> patents = PatentData.Patents;\n        Console.WriteLine($\"\
    Patent Count: { patents.Count() }\");\n        Console.WriteLine($@\"Patent Count\
    \ in 1800s: {\n            patents.Count(patient =>\n                patient.YearOfPublication.StartsWith(\"\
    18\"))}\");\n    }\n}\n```\n\n尽管 `Count()` 语句看起来简单，但 `IEnumerable<T>` 没有变化，因此执行的代码仍然遍历集合中的所有项目。当集合上直接可用\
    \ `Count` 属性时，使用该属性比使用 LINQ 的 `Count()` 方法更好（微妙的区别）。幸运的是，`ICollection<T>` 包含了\
    \ `Count` 属性，因此调用 `Count()` 方法的代码将转换集合并直接调用 `Count`。然而，如果不支持 `ICollection<T>`，`Enumerable.Count()`\
    \ 将遍历所有项目而不是调用内置的 `Count` 机制。如果检查数的目的只是查看它是否大于零（`if(patents.Count() > 0){...}`），更优的方法是使用\
    \ `Any()`（`if(patents.Any()){...}`）。`Any()` 尝试迭代集合中的一个项目以返回真结果，而不是遍历整个序列。\n\n\
    ##### 指南\n\n- **当检查是否存在大于零的项目时，请使用 `System.Linq.Enumerable.Any()` 而不是调用 `patents.Count()`。**\n\
    - **当集合上有 `Count` 属性时，请使用它而不是调用 `System.Linq.Enumerable.Count()` 方法。**\n\n####\
    \ 延迟执行\n\n使用 LINQ 时要记住最重要的概念之一是延迟执行。考虑 列表 15.16 中的代码以及对应的输出 输出 15.4。\n\n### 列表\
    \ 15.16：使用 `System.Linq.Enumerable.Where()` 进行过滤\n\n"
