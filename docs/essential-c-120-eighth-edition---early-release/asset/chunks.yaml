    \ item.Employee);\n        }\n        //...\n```\n\n**OUTPUT 15.8**\n\n```\nCorporate\n\
    \        Mark Michaelis (Chief Computer Nerd)\nHuman Resources\n        Anne Beard\
    \ (HR Director)\nEngineering\n        Michael Stokesbary (Senior Computer Wizard)\n\
    Engineering\n        Brian Jones (Enterprise Integration Guru)\nEngineering\n\
    \        Kevin Bost (Programmer Extraordinaire)\nEngineering\n        Thomas Heavey\
    \ (Software Architect)\nInformation Technology\n        Pat Dever (Enterprise\
    \ Architect)\nPhilanthropy\n        Eric Edmonds (Philanthropy Coordinator)\n\
    ```\n\nIn addition to ordering and joining a collection of objects, you might\
    \ want to group objects with like characteristics. For the employee data, you\
    \ might want to group employees by department, region, job title, and so forth.\
    \ [LISTING 15.21](#ch15.html_list15_21) shows an example of how to do this with\
    \ the `GroupBy()` standard query operator (see [OUTPUT 15.9](#ch15.html_op15_9)\
    \ to view the results).\n\n**LISTING 15.21: Grouping Items Using `System.Linq.Enumerable.GroupBy()`**\n\
    \n```\nusing System;\nusing System.Collections.Generic;\nusing System.Linq;\n\
    // ...\n        IEnumerable<Employee> employees = CorporateData.Employees;\n\n\
    \        IEnumerable<IGrouping<int, Employee>> groupedEmployees =\n          \
    \  employees.GroupBy((employee) => employee.DepartmentId);\n\n        foreach(IGrouping<int,\
    \ Employee> employeeGroup in\n            groupedEmployees)\n        {\n     \
    \       Console.WriteLine();\n            foreach(Employee employee in employeeGroup)\n\
    \            {\n                Console.WriteLine(employee);\n            }\n\
    \            Console.WriteLine(\n              \"\\tCount: \" + employeeGroup.Count());\n\
    \        }\n        //...\n```\n\n**OUTPUT 15.9**\n\n```\nMark Michaelis (Chief\
    \ Computer Nerd)\n    Count: 1\n\nMichael Stokesbary (Senior Computer Wizard)\n\
    Brian Jones (Enterprise Integration Guru)\nKevin Bost (Programmer Extraordinaire)\n\
    Thomas Heavey (Software Architect)\n    Count: 4\n\nAnne Beard (HR Director)\n\
    \    Count: 1\n\nPat Dever (Enterprise Architect)\n    Count: 1\n\nEric Edmonds\
    \ (Philanthropy Coordinator)\n    Count: 1\n```\n\nNote that the items output\
    \ from a `GroupBy()` call are of type `IGrouping<TKey, TElement>`, which has a\
    \ property for the key that the query is grouping on (`employee.DepartmentId`).\
    \ However, it does not have a property for the items within the group. Rather,\
    \ `IGrouping<TKey, TElement>` derives from `IEnumerable<T>`, allowing for enumeration\
    \ of the items within the group using a `foreach` statement or for aggregating\
    \ the data into something such as a count of items (`employeeGroup.Count()`).\n\
    \n#### Implementing a One-to-Many Relationship with `GroupJoin()`\n\n[LISTING\
    \ 15.19](#ch15.html_list15_19) and [LISTING 15.20](#ch15.html_list15_20) are virtually\
    \ identical. Either `Join()` call could have produced the same output just by\
    \ changing the tuple definition. When trying to create a list of employees, [LISTING\
    \ 15.19](#ch15.html_list15_19) provides the correct result. `Department` ends\
    \ up as an item of both tuples representing the joined employee. However, [LISTING\
    \ 15.20](#ch15.html_list15_20) is not ideal. Given support for collections, a\
    \ more preferable representation of a department would have a collection of employees\
    \ rather than a single tuple for each department–employee relationship. [LISTING\
    \ 15.22](#ch15.html_list15_22) demonstrates the creation of such a child collection;\
    \ [OUTPUT 15.10](#ch15.html_op15_10) shows the preferred output.\n\n**LISTING\
    \ 15.22: Creating a Child Collection with `System.Linq.Enumerable.GroupJoin()`**"
