  trans: "\n\n```cs\nvar numbers = new[] { 1, 2, 3 };\nIEnumerable<(string Word, int\
    \ Number)> product =\n     from word in CSharp.Keywords\n     from number in numbers\
    \                                           \n     select (word, number);\n```\n\
    \n此查询将产生一个元组序列：(`abstract`, `1`), (`abstract`, `2`), (`abstract`, `3`), (`as`,\
    \ `1`), (`as`, `2`)……\n\n### 初学者主题：去重成员（Distinct Members）\n\n通常情况下，我们希望从集合中只返回唯一的（即不同的）项，丢弃任何重复项。查询表达式没有去重成员的显式语法，但可以通过查询运算符\
    \ `Distinct()` 来实现该功能，该运算符是在第 15 章中引入的。要将查询运算符应用于查询表达式，必须将表达式括在括号中，这样编译器才不会认为\
    \ `Distinct()` 的调用是 `select` 子句的一部分。列表 16.15 提供了一个示例；输出 16.8 显示了结果。\n\n#### 列表\
    \ 16.15：从查询表达式获取去重成员\n\n```cs\nusing System;\nusing System.Linq;\nusing System.Collections.Generic;\n\
    // ...\n    public static void ListMemberNames()\n    {\n        IEnumerable<string>\
    \ enumerableMethodNames = (\n            from method in typeof(Enumerable).GetMembers(\n\
    \                System.Reflection.BindingFlags.Static |\n                System.Reflection.BindingFlags.Public)\n\
    \                orderby method.Name\n                select method.Name).Distinct();\n\
    \        foreach(string method in enumerableMethodNames)\n        {\n        \
    \    Console.Write($\"{ method }, \");\n        }\n    }\n    //...\n```\n\n####\
    \ 输出 16.8\n\n```\nAggregate, All, Any, Append, AsEnumerable, Average, Cast, Chunk,\n\
    Concat, Contains, Count, DefaultIfEmpty, Distinct, DistinctBy, ElementAt\n, ElementAtOrDefault,\
    \ Empty, Except, ExceptBy, First, FirstOrDefault, Gr\noupBy, GroupJoin, Intersect,\
    \ IntersectBy, Join, Last, LastOrDefault, Lon\ngCount, Max, MaxBy, Min, MinBy,\
    \ OfType, Order, OrderBy, OrderByDescendin\ng, OrderDescending, Prepend, Range,\
    \ Repeat, Reverse, Select, SelectMany,\nSequenceEqual, Single, SingleOrDefault,\
    \ Skip, SkipLast, SkipWhile, Sum,\nTake, TakeLast, TakeWhile, ThenBy, ThenByDescending,\
    \ ToArray, ToDiction\nary, ToHashSet, ToList, ToLookup, TryGetNonEnumeratedCount,\
    \ Union,\nUnionBy, Where, Zip,\n```\n\n在这个示例中，`typeof(Enumerable).GetMembers()`\
    \ 返回 `System.Linq.Enumerable` 的所有成员（方法、属性等）的列表。然而，这些成员中有许多是重载的，甚至是多次。与其多次显示同一个成员，不如从查询表达式中调用\
    \ `Distinct()`。这消除了列表中的重复名称。（我们在第 18 章中详细介绍了 `typeof()` 和反射[可以使用 `GetMembers()`\
    \ 等方法的地方]。）\n\n### 查询表达式本质就是方法调用\n\n令人惊讶的是，添加查询表达式^(4)并不需要更改通用语言运行时 (CLR) 或通用中间语言\
    \ (CIL)。相反，C# 编译器仅将查询表达式翻译为一系列方法调用。例如，考虑列表 16.1 中的查询表达式，其部分内容出现在列表 16.16 中。\n\n\
    4。从 C# 3.0 开始。\n\n#### 列表 16.16：简单查询表达式\n\n```cs\nprivate static void ShowContextualKeywords1()\n\
    {\n    IEnumerable<string> selection =\n        from word in CSharp.Keywords\n\
    \        where !word.Contains('*')\n        select word;\n    // ...\n}\n```\n\
    \n编译后，列表 16.16 中的表达式被转换为来自 `System.Linq.Enumerable` 的 `IEnumerable<T>` 扩展方法调用，如列表\
    \ 16.17 所示。\n\n#### 列表 16.17：查询表达式翻译为标准查询运算符语法\n\n```cs\nprivate static void ShowContextualKeywords2()\n\
    {\n    IEnumerable<string> selection =                                     \n\
    \        CSharp.Keywords.Where(word => !word.Contains('*'));             \n  \
    \  // ...\n}\n```\n\n如第 15 章讨论的那样，lambda 表达式随后会由编译器自身翻译，生成一个带有 lambda 主体的方法，且其使用涉及为该方法分配一个委托。\n\
    \n每个查询表达式都可以（并且必须）翻译为方法调用，但并不是每个方法调用序列都有对应的查询表达式。例如，扩展方法 `TakeWhile<T>(Func<T,\
    \ bool> predicate)` 没有等价的查询表达式，该方法只要谓词返回 `true`，就会不断地从集合中返回项。\n\n对于那些既有方法调用形式又有查询表达式的查询，哪种更好呢？这取决于主观判断。\n\
    \n#### 指南\n\n- 使用查询语法来使查询更易读，特别是当涉及 `from`、`let`、`join` 或 `group` 子句时。\n- 如果查询涉及没有查询表达式语法的操作（如\
    \ `Count()`、`TakeWhile()` 或 `Distinct()`），请考虑使用查询运算符（方法调用形式）。\n\n### 总结\n\n本章引入了一种语法——查询表达式。熟悉\
    \ SQL 的读者会立即发现查询表达式与 SQL 的相似之处。然而，查询表达式还引入了额外的功能，例如分组为层次对象，这在 SQL 中是不可能的。查询表达式的所有功能可以通过查询运算符实现，但查询表达式通常为此类查询提供了更简单的语法。无论使用标准运算符还是查询表达式，结果都是对集合\
    \ API 使用方式的重要改进——这种改进最终为面向对象的语言与关系数据库交互的方式提供了范式转变。\n\n在下一章中，我们将通过研究 .NET 框架集合类型并探索如何定义自定义集合来继续讨论集合。\n\
    \n## 17. 构建自定义集合\n\n第 15 章涵盖了标准查询运算符——即 `IEnumerable<T>` 上提供通用方法的扩展方法。然而，这些运算符并没有让所有集合都适用于所有任务；仍然需要不同的集合类型。某些集合更适合通过键搜索，而另一些更适合通过位置访问项。某些集合像队列：先进先出；另一些像栈：后进先出；还有一些完全没有顺序。\n\
    \n.NET 框架提供了大量的集合类型，适用于许多需要集合的场景。本介绍了其中一些集合类型以及它们实现的接口。它还描述了如何创建支持标准功能（如索引）的自定义集合。此外，它探索了使用\
    \ `yield return` 语句来创建实现 `IEnumerable<T>` 的类和方法。这一特性^(1) 极大简化了可以使用 `foreach` 语句枚举的集合的实现。\n\
    \n"
- fmt: "\nMany nongeneric collection classes and interfaces are available in the Microsoft\
    \ .NET Framework, but in general, these exist today only for backward compatibility\
    \ with code written before generics came into use. The generic collection types\
    \ are both faster, because they avoid boxing costs, and more type-safe than the\
    \ nongeneric collections. Thus, new code should almost always use the generic\
    \ collection types exclusively. Throughout this book, we assume that you are primarily\
    \ using generic collection types.\n\n![Images](graphics/17fig00.jpg)\n\n# More\
    \ Collection Interfaces\n\nWe’ve already seen how collections implement `IEnumerable<T>`,\
    \ the primary interface that enables iteration over the elements of a collection.\
    \ Many additional interfaces exist that are implemented by more complex collections.\
    \ [FIGURE 17.1](#ch17.html_ch17fig01) shows the hierarchy of interfaces implemented\
    \ by collection classes.\n\nThese interfaces provide a standard way to perform\
    \ common tasks such as iterating, indexing, and counting elements in a collection.\
    \ This section examines these interfaces (at least all of the generic ones), starting\
    \ at the bottom of [FIGURE 17.1](#ch17.html_ch17fig01) and moving upward.\n\n\
    ![Images](graphics/17fig01.jpg)\n\n**FIGURE 17.1: Collection class hierarchy**\n\
    \n## `IList<T>` versus `IDictionary<TKey, TValue>`\n\nAn English-language dictionary\
    \ can be thought of as a collection of definitions. A specific definition can\
    \ be rapidly accessed by looking up its associated “key”—that is, the word being\
    \ defined. A dictionary collection class is similarly a collection of values,\
    \ in which each value can be rapidly accessed by using its associated unique key.\
    \ Note, however, that a language dictionary typically stores the definitions sorted\
    \ alphabetically by key; a dictionary class might choose to do so but typically\
    \ does not. Dictionary collections are best thought of as an unordered list of\
    \ keys and associated values unless specifically documented as being ordered.\
    \ Similarly, one does not normally think of looking up “the sixth definition in\
    \ the dictionary”; dictionary classes usually provide indexing only by key, not\
    \ by position.\n\nA list, by contrast, stores values in a specific order and accesses\
    \ them by their position. In a sense, lists are just the special case of dictionaries\
    \ where the “key” is always an integer and the “key set” is always a contiguous\
    \ set of non-negative integers starting with zero. Nevertheless, that is a strong\
    \ enough difference that it is worth having an entirely different type to represent\
    \ it.\n\nThus, when selecting a collection class to solve some data storage or\
    \ retrieval problem, the first two interfaces to look for are `IList<T>` and `IDictionary<TKey,\
    \ TValue>`. These interfaces indicate whether the collection type is focused on\
    \ retrieval of a value when given its positional index or retrieval of a value\
    \ when given its associated key.\n\nBoth of these interfaces require that a class\
    \ that implements them provide an indexer. In the case of `IList<T>`, the operand\
    \ of the indexer corresponds to the position of the element being retrieved: The\
    \ indexer takes an integer and gives you access to the *n*th element in the list.\
    \ In the case of the `IDictionary<TKey, TValue>` interface, the operand of the\
    \ indexer corresponds to the key associated with a value and gives you access\
    \ to that value.\n\n## `ICollection<T>`\n\nBoth `IList<T>` and `IDictionary<TKey,\
    \ TValue>` implement `ICollection<T>`. A collection that does not implement either\
    \ `IList<T>` or `IDictionary<TKey, TValue>` will more than likely implement `ICollection<T>`\
    \ (although not necessarily, because collections could implement the lesser requirement\
    \ of `IEnumerable` or `IEnumerable<T>`). `ICollection<T>` is derived from `IEnumerable<T>`\
    \ and includes two members: `Count` and `CopyTo()`.\n\n- The `Count` property\
    \ returns the total number of elements in the collection. Initially, it might\
    \ appear that this would be sufficient to iterate through each element in the\
    \ collection using a `for` loop, but, in fact, the collection would also need\
    \ to support retrieval by index, which the `ICollection<T>` interface does not\
    \ include (although `IList<T>` does include it).\n- The `CopyTo()` method provides\
    \ the ability to convert the collection into an array. This method includes an\
    \ `index` parameter so that you can specify where to insert elements in the target\
    \ array. To use the method, you must initialize the array target with sufficient\
    \ capacity, starting at the `index`, to contain all the elements in `ICollection<T>`.\n\
    \n# Primary Collection Classes\n\nFive key categories of collection classes exist,\
    \ and they differ from one another in terms of how data is inserted, stored, and\
    \ retrieved. Each generic class is located in the `System.Collections.Generic`\
    \ namespace, and their nongeneric equivalents are found in the `System.Collections`\
    \ namespace.\n\n## List Collections: `List<T>`\n\nThe `List<T>` class has properties\
    \ similar to an array. The key difference is that these classes automatically\
    \ expand as the number of elements increases. (In contrast, an array size is constant.)\
    \ Furthermore, lists can shrink via explicit calls to `TrimToSize()` or `Capacity`\
    \ (see [FIGURE 17.2](#ch17.html_ch17fig02)).\n\n![Images](graphics/17fig02.jpg)\n\
    \n**FIGURE 17.2: `List<>` class diagrams**\n\nThese classes are categorized as\
    \ list collections whose distinguishing functionality is that each element can\
    \ be individually accessed by index, just like an array. Therefore, you can set\
    \ and access elements in the list collection classes using the index operator,\
    \ where the index parameter value corresponds to the position of an element in\
    \ the collection. [LISTING 17.1](#ch17.html_list17_1) shows an example, and [OUTPUT\
    \ 17.1](#ch17.html_op17_1) shows the results.\n\n**LISTING 17.1: Using `List<T>`**\n\
    \n```\nusing System;\nusing System.Collections.Generic;\n\npublic class Program\n\
    {\n    public static void Main()\n    {\n        List<string> list = new List<string>\n\
    \        { \"Sneezy\", \"Happy\", \"Dopey\", \"Doc\", \"Sleepy\", \"Bashful\"\
    , \"Grumpy\" };\n\n        list.Sort();\n        Console.WriteLine($\"In alphabetical\
    \ order {list[0]} is the first dwarf while {list[^1]} is the last.\");\n\n   \
    \     list.Remove(\"Grumpy\");\n    }\n}\n```\n\n**OUTPUT 17.1**\n\n```\nIn alphabetical\
    \ order Bashful is the first dwarf while Sneezy is the last.\n```\n\nC# is zero-index\
    \ based; therefore, index 0 in [LISTING 17.1](#ch17.html_list17_1) corresponds\
    \ to the first element and index 6 indicates the seventh element. Retrieving elements\
    \ by index does not involve a search. Rather, it entails a quick and simple “jump”\
    \ operation to a location in memory.\n\nA `List<T>` is an ordered collection;\
    \ the `Add()` method appends the given item to the end of the list. Before the\
    \ call to `Sort()` in [LISTING 17.1](#ch17.html_list17_1), `\"Sneezy\"` is first\
    \ and `\"Grumpy\"` is last; after the call, the list is sorted into alphabetical\
    \ order rather than the order in which items were added. Some collections automatically\
    \ sort elements as they are added, but `List<T>` is not one of them; an explicit\
    \ call to `Sort()` is required for the elements to be sorted.\n\nTo remove an\
    \ element, you use the `Remove()` or `RemoveAt()` method to either remove a given\
    \ element or remove whatever element is at a particular index, respectively.\n\
    \n## Advanced Topic: Customizing Collection Sorting\n\nYou might have wondered\
    \ how the `List<T>.Sort()` method in [LISTING 17.1](#ch17.html_list17_1) knew\
    \ how to sort the elements of the list into alphabetical order. The `string` type\
    \ implements the `IComparable<string>` interface, which has one method, `CompareTo()`.\
    \ It returns an integer indicating whether the element passed is greater than,\
    \ less than, or equal to the current element. If the element type implements the\
    \ generic `IComparable<T>` interface (or the nongeneric `IComparable` interface),\
    \ the sorting algorithm will, by default, use it to determine the sorted order.\n"
