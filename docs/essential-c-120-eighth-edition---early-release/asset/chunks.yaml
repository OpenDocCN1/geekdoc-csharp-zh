    \ 21.1 所示的 `for` 循环语句和相关代码。考虑 21.1 所示的 `for` 循环语句和相关代码。考虑 21.1 所示的 `for` 循环语句和相关代码。考虑\
    \ 21.1 所示的 `for` 循环语句和相关代码。考虑 21.1 所示的 `for` 循环语句和相关代码。（等等，原文是重复的）。考虑 21.1 所示的\
    \ `for` 循环语句和相关代码。考虑 21.1 所示的 `for` 循环语句和相关代码。考虑 21.1 所示的 `for` 循环语句和相关代码。（实际上，按照提供的文本逻辑）。考虑\
    \ 21.1 所示的 `for` 循环语句和相关代码。考虑 21.1 所示的 `for` 循环语句和相关代码。\n\n...参数是起始的位数。实际计算与讨论无关。此计算的有趣之处在于它是“极易并行的”（embarrassingly\
    \ parallelizable）；也就是说，非常容易将一个大任务（例如 100 万位数字）分成任意数量的可以并行运行的小任务。\n\n### 列表 21.1：同步计算周率的\
    \ for 循环\n\n```csharp\nusing System;\nusing CSharp;\n\npublic class Program\n\
    {\n    const int TotalDigits = 100;\n    const int BatchSize = 10;\n\n    public\
    \ static void Main()\n    {\n        string pi = \"\";\n        const int iterations\
    \ = TotalDigits / BatchSize;\n        for(int i = 0; i < iterations; i++)\n  \
    \      {\n            pi += PiCalculator.Calculate(BatchSize, i * BatchSize);\n\
    \        }\n        Console.WriteLine(pi);\n    }\n}\n\nusing System;\n\npublic\
    \ static class PiCalculator\n{\n    public static string Calculate(int digits,\
    \ int startingAt)\n    {\n        // ...\n    }\n}\n```\n\n### 输出 21.1\n\n```\n\
    3.141592653589793238462643383279502884197169399375105820974944592307816\n406286208998628034825342117067982148086513282306647093844609550582231725\n\
    35940812848111745028410270193852110555964462294895493038196442881097565\n933446128475648233786783165271201909145648566923460348610454326648213393\n\
    607260249141273724587006606315588174881520920962829254091715364367892590\n36011133053054882046651138414691194111109433055777336579591195309216111\n\
    \n\n3111179310511854807446237996274956735188575272489122793818301194912\n```\n"
- fmt: "\nThe `for` loop executes each iteration synchronously and sequentially. However,\
    \ because the pi calculation algorithm splits the pi calculation into independent\
    \ pieces, it is not necessary to compute the pieces sequentially providing the\
    \ results are appended in the right order. Imagine what would happen if you could\
    \ have all the iterations of this loop run concurrently: Each processor could\
    \ take a single iteration and execute it in parallel with other processors executing\
    \ other iterations. Given the simultaneous execution of iterations, we could decrease\
    \ the execution time more and more based on the number of processors.\n\nThe Task\
    \ Parallel Library (TPL) provides a convenient method, `Parallel.For()`, which\
    \ does precisely that. [LISTING 21.2](#ch21.html_list21_2) shows how to modify\
    \ the sequential, single-threaded program in [LISTING 21.1](#ch21.html_list21_1)\
    \ to use the helper method.\n\n### LISTING 21.2: `For` Loop Calculating Pi in\
    \ Sections in Parallel\n\n```\nusing System;\nusing System.Threading.Tasks;  \
    \                                          \nusing AddisonWesley.Michaelis.EssentialCSharp.Shared;\n\
    \n//...\n\npublic class Program\n{\n    const int TotalDigits = 100;\n    const\
    \ int BatchSize = 10;\n\n    public static void Main()\n    {\n        string\
    \ pi = \"\";\n        const int iterations = TotalDigits / BatchSize;\n      \
    \  string[] sections = new string[iterations];\n        Parallel.For(0, iterations,\
    \ i =>                                 \n        {                           \
    \                                     \n            sections[i] = PiCalculator.Calculate(\
    \                        \n                BatchSize, i * BatchSize);        \
    \                       \n        });                                        \
    \                       \n\n        pi = string.Join(\"\", sections);\n      \
    \  Console.WriteLine(pi);\n    }\n}\n```\n\nThe output for [LISTING 21.2](#ch21.html_list21_2)\
    \ is identical to [OUTPUT 21.2](#ch21.html_op21_2); however, the execution time\
    \ is significantly faster if you have multiple CPUs (and possibly slower if you\
    \ do not). The `Parallel.For()` API is designed to look similar to a standard\
    \ `for` loop. The first parameter is the `fromInclusive` value, the second is\
    \ the `toExclusive` value, and the last is the `Action<int>` to perform as the\
    \ loop body. When using an expression lambda for the action, the code looks similar\
    \ to a `for` loop statement except that now each iteration may execute in parallel.\
    \ As with the `for` loop, the call to `Parallel.For()` will not complete until\
    \ all iterations are complete. In other words, by the time execution reaches the\
    \ `string.Join()` statement, all sections of pi will have been calculated.\n\n\
    Note that the code for combining the various sections of pi no longer occurs inside\
    \ the iteration (`action`) in [LISTING 21.2](#ch21.html_list21_2). As sections\
    \ of the pi calculation will very likely not complete sequentially, appending\
    \ a section whenever an iteration completes will likely append them out of order.\
    \ Even if sequence was not a problem, there is still a potential race condition\
    \ because the `+=` operator in [LISTING 21.1](#ch21.html_list21_1) is not atomic.\
    \ To address both problems, each section of pi is stored into an array, and no\
    \ two or more iterations will access a single element within the array simultaneously.\
    \ Only once all sections of pi are calculated does `string.Join()` combine them.\
    \ In other words, we postpone concatenating the sections until after the `Parallel.For()`\
    \ loop has completed. This avoids any race condition caused by sections not yet\
    \ calculated or sections concatenating out of order.\n\nThe TPL uses the same\
    \ sorts of thread pooling techniques that it uses for task scheduling to ensure\
    \ good performance of the parallel loop: It will try to ensure that CPUs are not\
    \ overscheduled and so on.\n\n### Guidelines\n\n**DO use parallel loops when the\
    \ computations performed can be easily split up into many mutually independent\
    \ processor-bound computations that can be executed in any order on any thread.**\n\
    \nThe TPL also provides a similar parallel version of the `foreach` statement,\
    \ as shown in [LISTING 21.3](#ch21.html_list21_3).\n\n### LISTING 21.3: Parallel\
    \ Execution of a `foreach` Loop\n\n```\nusing System;\nusing System.Collections.Generic;\n\
    using System.IO;\nusing System.Threading.Tasks;                              \
    \                 \n\npublic class Program\n{\n    // ...\n    public static void\
    \ EncryptFiles(\n        string directoryPath, string searchPattern)\n\n    {\n\
    \        IEnumerable<string> files = Directory.EnumerateFiles(\n            directoryPath,\
    \ searchPattern,\n            SearchOption.AllDirectories);\n\n        Parallel.ForEach(files,\
    \ fileName =>                                \n        {                     \
    \                                             \n            Encrypt(fileName);\
    \                                             \n        });                  \
    \                                              \n    }\n    // ...\n}\n```\n\n\
    In this example, we call a method that encrypts each file within the `files` collection.\
    \ It does so in parallel, executing as many threads as the TPL determines is efficient.\n\
    \n### Advanced Topic: How the TPL Tunes Its Own Performance\n\nThe default scheduler\
    \ within the TPL targets the thread pool, resulting in a variety of heuristics\
    \ that try to ensure the right number of threads are executing at any one time.\
    \ Two of the heuristics it uses are **hill climbing** and **work stealing**.\n\
    \nThe hill-climbing algorithm involves creating threads to run tasks, and then\
    \ monitoring the performance of those tasks to experimentally determine the point\
    \ at which adding more threads begins making performance worse. Once that point\
    \ is reached, the number of threads can then be decreased back to the number that\
    \ produced the best performance.\n\nThe TPL does not associate top-level tasks\
    \ that are waiting to be executed with any particular thread. If, however, a task\
    \ running on a thread itself creates another task, the newly created task is associated\
    \ with that thread automatically. When the new child task is eventually scheduled\
    \ to run, it usually runs on the same thread as the task that created it. The\
    \ work-stealing algorithm identifies threads that have an unusually large or unusually\
    \ small amount of pending work; a thread that has too few tasks associated with\
    \ it will sometimes “steal” not-yet-executed tasks from threads that have too\
    \ many tasks waiting to run.\n\nThe key feature of these algorithms is that they\
    \ enable the TPL to dynamically tune its own performance to mitigate processor\
    \ overscheduling and underscheduling and to balance the work among the available\
    \ processors.\n\nThe TPL generally does a good job of tuning its own performance,\
    \ but you can help it do a better job by providing hints about the best course\
    \ of action. Specifying the TPL `TaskCreationOptions.LongRunning` option described\
    \ in the section “Long-Running Tasks” in [Chapter 19](#ch19.html_ch19) is an example\
    \ of such a hint. You can also explicitly tell the task scheduler how many threads\
    \ you think would be best to service a parallel loop; see Advanced Topic: Parallel\
    \ Loop Options later in this chapter for more details.\n\n### Beginner Topic:\
    \ Parallel Loop Exception Handling with `AggregateException`\n\nThe TPL catches\
    \ and saves exceptions associated with tasks in an `AggregateException`, because\
    \ a given task might have several exceptions obtained from its subtasks. This\
    \ is also the case with parallel execution of loops: Each iteration could have\
    \ produced an exception, so the exceptions need to be gathered up into one aggregating\
    \ exception. Consider the example in [LISTING 21.4](#ch21.html_list21_4) and its\
    \ results in [OUTPUT 21.2](#ch21.html_op21_2).\n\n**LISTING 21.4: Unhandled Exception\
    \ Handling for Parallel Iterations**\n"
