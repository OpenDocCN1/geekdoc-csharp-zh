    \ \"Vincenzo Iaquinta\",\n                }\n            )\n        };\n\n   \
    \     IEnumerable<string> players =\n            worldCup2006Finalists.SelectMany(\n\
    \                team => team.Players);\n\n        Print(players);\n        //...\n\
    ```\n\nThe output from this listing has each player’s name displayed on its own\
    \ line in the order in which it appears in the code. The difference between `Select()`\
    \ and `SelectMany()` is that `Select()` would return two items, one corresponding\
    \ to each item in the original collection. `Select()` may project out a transform\
    \ from the original type, but the number of items would not change. For example,\
    \ `teams.Select(team => team.Players)` will return an `IEnumerable<string[]>`.\n\
    \nIn contrast, `SelectMany()` iterates across each item identified by the lambda\
    \ expression (the array selected by `Select()` earlier) and hoists out each item\
    \ into a new collection that includes a union of all items within the child collection.\
    \ Instead of two arrays of players, `SelectMany()` combines each array selected\
    \ and produces a single collection of all items.\n\n#### More Standard Query Operators\n\
    \n[LISTING 15.25](#ch15.html_list15_25) shows code that uses some of the simpler\
    \ APIs enabled by `Enumerable`; [OUTPUT 15.12](#ch15.html_op15_12) shows the results."
