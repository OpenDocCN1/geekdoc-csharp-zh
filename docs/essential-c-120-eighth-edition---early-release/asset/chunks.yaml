    \ of its importance. In general, predicates should do exactly one thing—evaluate\
    \ a condition—and should not have any side effects (even printing to the console,\
    \ as in this example).\n\nTo understand what is happening, recall that lambda\
    \ expressions are delegates— references to methods—that can be passed around.\
    \ In the context of `LINQ` and standard query operators, each lambda expression\
    \ forms part of the overall query to be executed.\n\nAt the time of declaration,\
    \ lambda expressions are not executed. In fact, it isn’t until the lambda expressions\
    \ are invoked that the code within them begins to execute. [FIGURE 15.2](#ch15.html_ch15fig02)\
    \ shows the sequence of operations.\n\n![Images](graphics/15fig02.jpg)\n\n**FIGURE\
    \ 15.2: Sequence of operations invoking lambda expressions**\n\nAs [FIGURE 15.2](#ch15.html_ch15fig02)\
    \ shows, three calls in [LISTING 15.14](#ch15.html_list15_14) trigger the lambda\
    \ expression, and each time it is fairly implicit. If the lambda expression were\
    \ expensive (such as a call to a database), it would therefore be important to\
    \ minimize the lambda expression’s execution.\n\nFirst, the execution is triggered\
    \ within the `foreach` loop. As described earlier in the chapter, the `foreach`\
    \ loop breaks down into a `MoveNext()` call, and each call results in the lambda\
    \ expression’s execution for each item in the original collection. While iterating,\
    \ the runtime invokes the lambda expression for each item to determine whether\
    \ the item satisfies the predicate.\n\nSecond, a call to `Enumerable`’s `Count()`\
    \ (the function) triggers the lambda expression for each item once more. Again,\
    \ this is subtle behavior because `Count` (the property) is very common on collections\
    \ that have not been queried with a standard query operator.\n\nThird, the call\
