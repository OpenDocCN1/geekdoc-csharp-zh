    \ 15.2](#ch15.html_ch15tab02) describe each method and provide an example. Included\
    \ in `System.Linq.Enumerable` is a collection of aggregate functions that enumerate\
    \ the collection and calculate a result (shown in [TABLE 15.2](#ch15.html_ch15tab02)).\
    \ `Count` is one example of an aggregate function already shown in the chapter.\n\
    \n**TABLE 15.1: Simpler Standard Query Operators**\n\n![Images](graphics/15tab01.jpg)\n\
    \n**TABLE 15.2: Aggregate Functions on `System.Linq.Enumerable`**\n\n![Images](graphics/15tab02.jpg)\n\
    \nNote that each method listed in [TABLE 15.1](#ch15.html_ch15tab01) and [TABLE\
    \ 15.2](#ch15.html_ch15tab02) will trigger deferred execution.\n\nAdvanced Topic:\
    \ `Queryable` Extensions for `IQueryable<T>`\n\nOne virtually identical interface\
    \ to `IEnumerable<T>` is `IQueryable<T>`. Because `IQueryable<T>` derives from\
    \ `IEnumerable<T>`, it has all the members of `IEnumerable<T>` that are declared\
    \ directly (e.g., `GetEnumerator()`). Extension methods are not inherited, however,\
    \ so `IQueryable<T>` doesn’t have any of the `Enumerable` extension methods. Nevertheless,\
    \ it does have a similar extending class called `System.Linq.Queryable` that adds\
    \ to `IQueryable<T>` almost all of the same methods that `Enumerable` added to\
    \ `IEnumerable<T>`. Therefore, it provides a very similar programming interface.\n\
    \nWhat makes `IQueryable<T>` unique is that it enables custom LINQ providers.\
    \ A LINQ provider subdivides expressions into their constituent parts. Once divided,\
    \ the expression can be translated into another language, serialized for remote\
    \ execution, injected with an asynchronous execution pattern, and much more. Essentially,\
    \ LINQ providers allow for an interception mechanism into a standard collection\
    \ API; behavior relating to the queries and collection can be injected via this\
    \ seemingly limitless functionality.\n\nFor example, LINQ providers allow for\
    \ the translation of a query expression from C# into SQL that is then executed\
    \ on a remote database. In so doing, the C# programmer can remain in her primary\
    \ object-oriented language and leave the translation to SQL to the underlying\
    \ LINQ provider. Through this type of expression, programming languages can span\
    \ the impedance mismatch between the object-oriented world and the relational\
    \ database.\n\nIn the case of `IQueryable<T>`, vigilance regarding deferred execution\
    \ is even more critical. Imagine, for example, a LINQ provider that returns data\
    \ from a database. Rather than retrieving the data from a database regardless\
    \ of the selection criteria, the lambda expression would provide an implementation\
    \ of `IQueryable<T>` that possibly includes context information such as the connection\
    \ string, but not the data itself. The data retrieval wouldn’t occur until the\
    \ call to `GetEnumerator()` or even `MoveNext()`. However, the `GetEnumerator()`\
    \ call is generally implicit, such as when iterating over the collection with\
    \ `foreach` or calling an `Enumerable` method such as `Count<T>()` or `Cast<T>()`.\
    \ Obviously, cases such as this require developers to be wary of the subtle and\
    \ repeated calls to any expensive operation that deferred execution might involve.\
    \ For example, if calling `GetEnumerator()` involves a distributed call over the\
    \ network to a database, it would be wise to avoid unintentional duplicate calls\
    \ to iterations with `Count()` or `foreach`.\n\n### Anonymous Types with LINQ\n\
    \nTo support LINQ, an advanced API, only eight new language enhancements were\
    \ made.^([9](#ch15.html_fn15_9)) Two of these enhancements were anonymous types\
    \ and implicit local variables. Even so, anonymous types have essentially been\
    \ eclipsed by the introduction of C# tuple syntax.^([10](#ch15.html_fn15_10))\
    \ In fact, with the sixth edition of this book, all the LINQ examples that previously\
    \ leveraged anonymous types were updated to use tuples instead.\n\n[9](#ch15.html_fn15_9a).\
    \ Starting in C# 3.0.\n\n[10](#ch15.html_fn15_10a). Starting in C# 7.0.\n\nThe\
    \ remainder of the chapter covers the topic of anonymous types so that you can\
    \ still make sense of the anonymous type language feature if you are working with\
    \ code written prior to C# 7.0.\n\n#### Anonymous Types\n\nAnonymous types are\
    \ data types that are declared by the compiler rather than through the explicit\
    \ class definitions introduced in [Chapter 6](#ch06.html_ch06). As with anonymous\
    \ functions, when the compiler sees an anonymous type, it does the work to make\
    \ that class for you and then lets you use it as though you had declared it explicitly.\
    \ [LISTING 15.26](#ch15.html_list15_26) shows such a declaration. The corresponding\
    \ output is shown in [OUTPUT 15.13](#ch15.html_op15_13).\n\n**LISTING 15.26: Implicit\
    \ Local Variables with Anonymous Types**"
