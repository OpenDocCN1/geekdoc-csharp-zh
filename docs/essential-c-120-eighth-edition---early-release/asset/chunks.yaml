  trans: "\n\nC# 并不要求实现 `IEnumerable`/`IEnumerable<T>` 即可使用 `foreach` 遍历某种数据类型。相反，编译器使用一种名为**鸭子类型**（duck\
    \ typing）的概念：它会寻找一个 `GetEnumerator()` 方法，该方法返回的类型具有 `Current` 属性和 `MoveNext()`\
    \ 方法。鸭子类型通过名称进行搜索，而不是依赖接口或对方法的显式调用。（“鸭子类型”这一说法源于一个奇特的想法：如果一个对象要被视为鸭子，它只需要实现一个\
    \ `Quack()` 方法；而不需要实现 `IDuck` 接口。）如果鸭子类型未能找到枚举模式的合适实现，编译器将检查该集合是否实现了相应的接口。\n\n\
    ## 在 `foreach` 迭代期间修改集合\n\n第 4 章 展示了编译器如何防止对 `foreach` 变量（`number`）进行赋值。如列表 15.7\
    \ 所示，对 `number` 赋值不会改变集合元素本身，因此 C# 编译器完全阻止了此类赋值。\n\n此外，在 `foreach` 循环执行期间，集合内的元素计数或项目本身通常都无法修改。例如，如果你在\
    \ `foreach` 循环内部调用了 `stack.Push(42)`，将无法确定 `iterator` 应该忽略还是包含对 `stack` 的更改——换句话说，`iterator`\
    \ 应该是遍历新添加的项，还是忽略它并假设状态与实例化时相同。\n\n由于这种歧义，如果在 `foreach` 循环中修改了集合，在访问枚举器时通常会抛出\
    \ `System.InvalidOperationException` 类型的异常。该异常报告集合在枚举器实例化后被修改了。\n\n## 标准查询运算符\n\
    \n除了 `System.Object` 的方法外，任何实现 `IEnumerable<T>` 的类型仅需实现另外一个方法，即 `GetEnumerator()`。然而，这样做使得所有实现\
    \ `IEnumerable<T>` 的类型都可以使用 50 多个方法（不包括任何重载），而且这是在不需要显式实现 `GetEnumerator()` 方法之外的任何方法的情况下实现的。额外的功能通过扩展方法^(8)\
    \ 提供，并存在于 `System.Linq.Enumerable` 类中。因此，包含 `System.Linq` 的 `using` 声明即可使这些方法可用。\n\
    \n8。从 C# 3.0 开始。\n\n`IEnumerable<T>` 上的每个方法都是**标准查询运算符**；它为在其操作的集合提供了查询能力。在接下来的章节中，我们将检查这些标准查询运算符中最著名的几个。这些示例中的许多将依赖\
    \ `Inventor` 和/或 `Patent` 类，这两个类都定义在列表 15.9 中，并有输出 15.1。\n\n**列表 15.9: 用于标准查询运算符的示例类**\n\
    \n```\nusing System;\nusing System.Collections.Generic;\n\npublic class Program\n\
    {\n    public static void Main()\n    {\n        IEnumerable<Patent> patents =\
    \ PatentData.Patents;\n        Print(patents);\n\n        Console.WriteLine();\n\
    \n        IEnumerable<Inventor> inventors = PatentData.Inventors;\n        Print(inventors);\n\
    \    }\n\n    private static void Print<T>(IEnumerable<T> items)\n    {\n    \
    \    foreach(T item in items)\n        {\n            Console.WriteLine(item);\n\
    \        }\n    }\n}\n```\n\n**输出 15.1**\n\n```\nBifocals (1784)\nPhonograph (1877)\n\
    Kinetoscope (1888)\nElectrical Telegraph (1837)\nFlying Machine (1903)\nSteam\
    \ Locomotive (1815)\nDroplet Deposition Apparatus (1989)\nBackless Brassiere (1914)\n\
    \nBenjamin Franklin (Philadelphia, PA)\nOrville Wright (Kitty Hawk, NC)\nWilbur\
    \ Wright (Kitty Hawk, NC)\nSamuel Morse (New York, NY)\nGeorge Stephenson (Wylam,\
    \ Northumberland)\nJohn Michaelis (Chicago, IL)\nMary Phelps Jacob (New York,\
    \ NY)\n```\n\n## 使用 `Where()` 进行过滤\n\n为了从集合中过滤数据，我们需要提供一个返回 `true` 或 `false` 的过滤方法，用于指示是否包含某个特定元素。接收参数并返回布尔值的委托表达式被称为**谓词**（predicate），集合的\
    \ `Where()` 方法依赖谓词来识别过滤标准，如列表 15.10 所示。（从技术上讲，`Where()` 方法的结果是一个封装了使用给定谓词对给定序列进行过滤操作的**对象**。）结果出现在输出\
    \ 15.2 中。\n\n**列表 15.10: 使用 `System.Linq.Enumerable.Where()` 进行过滤**\n\n```\nusing\
    \ System;\nusing System.Collections.Generic;\nusing System.Linq;\n\npublic class\
    \ Program\n{\n    public static void Main()\n    {\n        IEnumerable<Patent>\
    \ patents = PatentData.Patents;\n        patents = patents.Where(            \
    \                              \n            patent => patent.YearOfPublication.StartsWith(\"\
    18\"));         \n        Print(patents);\n    }\n}\n```\n\n**输出 15.2**\n\n```\n\
    Phonograph (1877)\nKinetoscope (1888)\nElectrical Telegraph (1837)\nSteam Locomotive\
    \ (1815)\n```\n\n注意，代码将 `Where()` 的输出赋值回 `IEnumerable<T>`。换句话说，`Where()` 是一个 `IEnumerable<T>`\
    \ 集合。在列表 15.10 中，它是 `IEnumerable<Patent>`。\n\n不太明显的是，`Where()` 方法在赋值时并没有执行。对于许多标准查询运算符都是如此。以\
    \ `Where()` 为例，表达式被传递到集合中并保存但没有执行。相反，表达式的执行仅在需要遍历项目时发生。\n\n## 使用 `Select()` 进行投影\n\
    \n由于 `IEnumerable<T>.Where()` 方法的输出是一个新的 `IEnumerable<T>` 集合，因此再次对该集合调用标准查询运算符。例如，我们不仅可以过滤原始数据，还可以对数据进行转换（参见列表\
    \ 15.11）。\n\n**列表 15.11: 使用 `System.Linq.Enumerable.Select()` 进行投影**\n\n```\n\
    using System;\nusing System.Collections.Generic;\nusing System.Linq;\n\npublic\
    \ class Program\n{\n    public static void Main()\n    {\n        IEnumerable<Patent>\
    \ patents = PatentData.Patents;\n        IEnumerable<Patent> patentsOf1800 = patents.Where(\n\
    \            patent => patent.YearOfPublication.StartsWith(\"18\"));\n       \
    \ IEnumerable<string> items = patentsOf1800.Select(                  \n      \
    \      patent => patent.ToString());                                  \n\n   \
    \     Print(items);\n    }\n}\n```\n\n在列表 15.11 中，我们创建了一个 `IEnumerable<string>`\
    \ 集合。在这种情况下，添加 `Select()` 调用恰没有改变输出——但这仅仅是因为 `Print()` 中的 `Console.WriteLine()`\
    \ 调用本身就使用了 `ToString()`。显然，每个项目从原始集合的 `Patent` 类型到 `items` 集合的 `string` 类型仍然发生了转换。\n\
    \n考虑列表 15.12 中使用 `System.IO.FileInfo` 的示例。\n\n这里 `fileList` 的类型是 `IEnumerable<string>`。然而，通过\
    \ `Select` 提供的投影，我们可以将集合中的每个项目转换为 `System.IO.FileInfo` 对象。\n\n"
- fmt: "\nLastly, capitalizing on tuples, we can create an `IEnumerable<T>` collection\
    \ where `T` is a tuple (see [LISTING 15.13](#ch15.html_list15_13) and [OUTPUT\
    \ 15.3](#ch15.html_op15_3)).\n\n### LISTING 15.12: Projection with `System.Linq.Enumerable.Select()`\
    \ and `new`\n\n```cs\n//...\nIEnumerable<string> fileList = Directory.EnumerateFiles(\n\
    \    rootDirectory, searchPattern);\nIEnumerable<FileInfo> files = fileList.Select(\n\
    \    file => new FileInfo(file));\n//...\n```\n\n### LISTING 15.13: Projection\
    \ to Tuple\n\n```cs\n//...\nIEnumerable<string> fileList = Directory.EnumerateFiles(\n\
    rootDirectory, searchPattern);\nIEnumerable<(string FileName, long Size)> items\
    \ = fileList.Select(         \n    file =>                                   \
    \                             \n    {                                        \
    \                              \n        FileInfo fileInfo = new FileInfo(file);\
    \                            \n        return (                              \
    \                             \n            FileName: fileInfo.Name,         \
    \                              \n            Size: fileInfo.Length           \
    \                               \n        );                                 \
    \                                \n    });                                   \
    \                                 \n//...\n```\n\n### OUTPUT 15.3\n\n```\nFileName\
    \ = AssemblyInfo.cs, Size = 1704\nFileName = CodeAnalysisRules.xml, Size = 735\n\
    FileName = CustomDictionary.xml, Size = 199\nFileName = EssentialCSharp.sln, Size\
    \ = 40415\nFileName = EssentialCSharp.suo, Size = 454656\nFileName = EssentialCSharp.vsmdi,\
    \ Size = 499\nFileName = EssentialCSharp.vssscc, Size = 256\nFileName = intelliTechture.ConsoleTester.dll,\
    \ Size = 24576\nFileName = intelliTechture.ConsoleTester.pdb, Size = 30208\n```\n\
    \nThe output of an anonymous type automatically shows the property names and their\
    \ values as part of the generated `ToString()` method associated with the anonymous\
    \ type.\n\nProjection using the `Select()` method is very powerful. We already\
    \ saw how to filter a collection vertically (reducing the number of items in the\
    \ collection) using the `Where()` standard query operator. Now, via the `Select()`\
    \ standard query operator, we can also reduce the collection horizontally (making\
    \ fewer columns) or transform the data entirely. In combination, `Where()` and\
    \ `Select()` provide a means of extracting only those pieces of the original collection\
    \ that are desirable for the current algorithm. These two methods alone provide\
    \ a powerful collection manipulation API that would otherwise result in significantly\
    \ more—and less readable—code.\n\n### Advanced Topic: Running LINQ Queries in\
    \ Parallel\n\nWith the widespread availability of computers having multiple processors\
    \ and multiple cores within those processors, the ability to easily take advantage\
    \ of the additional processing power becomes far more important. To do so, programs\
    \ need to support multiple threads so that work can happen simultaneously on different\
    \ CPUs within the computer. [LISTING 15.14](#ch15.html_list15_14) demonstrates\
    \ one way to do this using Parallel LINQ (PLINQ).\n\n### LISTING 15.14: Executing\
    \ LINQ Queries in Parallel\n\n```cs\n//...\nIEnumerable<string> fileList = Directory.EnumerateFiles(\n\
    \    rootDirectory, searchPattern);\nvar items = fileList.AsParallel().Select(\
    \                                 \n    file =>\n    {\n        FileInfo fileInfo\
    \ = new FileInfo(file);\n        return new\n        {\n            FileName =\
    \ fileInfo.Name,\n            Size = fileInfo.Length\n        };\n    });\n//...\n\
    ```\n\nAs [LISTING 15.14](#ch15.html_list15_14) shows, only a minimal change in\
    \ code is needed to enable parallel support. All that this example uses is a Microsoft\
    \ .NET Framework 4–introduced standard query operator, `AsParallel()`, on the\
    \ static class `System.Linq.ParallelEnumerable`. Using this simple extension method,\
    \ the runtime begins executing over the items within the `fileList` collection\
    \ and returning the resultant objects in parallel. Each parallel operation in\
    \ this case isn’t particularly expensive (although it is relative to the other\
    \ execution taking place), but consider the burden imposed by CPU-intensive operations\
    \ such as encryption or compression. Running the query in parallel across multiple\
    \ CPUs can decrease execution time by a factor corresponding to the number of\
    \ CPU cores.\n\nAn important caveat to be aware of (and the reason why `AsParallel()`\
    \ appears as an Advanced Topic rather than in the standard text) is that parallel\
    \ execution can introduce race conditions, such that an operation on one thread\
    \ can be intermingled with an operation on a different thread, causing data corruption.\
    \ To avoid this problem, synchronization mechanisms are required on data with\
    \ shared access from multiple threads to force the operations to be atomic where\
    \ necessary. Synchronization itself, however, can introduce deadlocks that freeze\
    \ the execution, further complicating the effective parallel programming.\n\n\
    More details on this and additional multithreading topics are provided in [Chapters\
    \ 19](#ch19.html_ch19) through [22](#ch22.html_ch22).\n\n#### Counting Elements\
    \ with `Count()`\n\nAnother query frequently performed on a collection of items\
    \ is to retrieve the count. To support this type of query, LINQ includes the `Count()`\
    \ extension method.\n\n[LISTING 15.15](#ch15.html_list15_15) demonstrates that\
    \ `Count()` is overloaded to simply count all elements (no parameters) or to take\
    \ a predicate that counts only items identified by the predicate expression.\n\
    \n### LISTING 15.15: Counting Items with `Count()`\n\n```cs\nusing System;\nusing\
    \ System.Collections.Generic;\nusing System.Linq;\n\npublic class Program\n{\n\
    \    public static void Main()\n    {\n        IEnumerable<Patent> patents = PatentData.Patents;\n\
    \        Console.WriteLine($\"Patent Count: { patents.Count() }\");          \
    \  \n        Console.WriteLine($@\"Patent Count in 1800s: {\n            patents.Count(patient\
    \ =>\n                patient.YearOfPublication.StartsWith(\"18\"))}\");\n   \
    \ }\n}\n```\n\nIn spite of the apparent simplicity of the `Count()` statement,\
    \ `IEnumerable<T>` has not changed, so the executed code still iterates over all\
    \ the items in the collection. Whenever a `Count` property is directly available\
    \ on the collection, it is preferable to use that rather than LINQ’s `Count()`\
    \ method (a subtle difference). Fortunately, `ICollection<T>` includes the `Count`\
    \ property, so code that calls the `Count()` method on a collection that supports\
    \ `ICollection<` will cast the collection and call `Count` directly. However,\
    \ if `ICollection<T>` is not supported, `Enumerable.Count()` will proceed to enumerate\
    \ all the items in the collection rather than call the built-in `Count` mechanism.\
    \ If the purpose of checking the count is just to see whether it is greater than\
    \ zero (`if(patents.Count() > 0){...}`), the preferred approach would be to use\
    \ the `Any()` operator (`if(patents.Any()){...}`). `Any()` attempts to iterate\
    \ over only one of the items in the collection to return a true result, rather\
    \ than iterating over the entire sequence.\n\n##### Guidelines\n\n- **DO use `System.Linq.Enumerable.Any()`\
    \ rather than calling `patents.Count()` when checking whether there are more than\
    \ zero items.**\n- **DO use a collection’s `Count` property (if available) instead\
    \ of calling the `System.Linq.Enumerable.Count()` method.**\n\n#### Deferred Execution\n\
    \nOne of the most important concepts to remember when using LINQ is deferred execution.\
    \ Consider the code in [LISTING 15.16](#ch15.html_list15_16) and the corresponding\
    \ output in [OUTPUT 15.4](#ch15.html_op15_4).\n\n### LISTING 15.16: Filtering\
    \ with `System.Linq.Enumerable.Where()`\n"
  raw: "Lastly, capitalizing on tuples, we can create an `IEnumerable<T>` collection\
    \ where `T` is a tuple (see [LISTING 15.13](#ch15.html_list15_13) and [OUTPUT\
    \ 15.3](#ch15.html_op15_3)).\n\n**LISTING 15.12: Projection with `System.Linq.Enumerable.Select()`\
    \ and `new`**\n\n```\n//...\nIEnumerable<string> fileList = Directory.EnumerateFiles(\n\
    \    rootDirectory, searchPattern);\nIEnumerable<FileInfo> files = fileList.Select(\n\
    \    file => new FileInfo(file));\n//...\n```\n\n**LISTING 15.13: Projection to\
    \ Tuple**\n\n```\n//...\nIEnumerable<string> fileList = Directory.EnumerateFiles(\n\
    rootDirectory, searchPattern);\nIEnumerable<(string FileName, long Size)> items\
    \ = fileList.Select(         \n    file =>                                   \
    \                             \n    {                                        \
    \                              \n        FileInfo fileInfo = new FileInfo(file);\
    \                            \n        return (                              \
    \                             \n            FileName: fileInfo.Name,         \
    \                              \n            Size: fileInfo.Length           \
    \                               \n        );                                 \
    \                                \n    });                                   \
    \                                 \n//...\n```\n\n**OUTPUT 15.3**\n\n```\nFileName\
    \ = AssemblyInfo.cs, Size = 1704\nFileName = CodeAnalysisRules.xml, Size = 735\n\
    FileName = CustomDictionary.xml, Size = 199\nFileName = EssentialCSharp.sln, Size\
    \ = 40415\nFileName = EssentialCSharp.suo, Size = 454656\nFileName = EssentialCSharp.vsmdi,\
    \ Size = 499\nFileName = EssentialCSharp.vssscc, Size = 256\nFileName = intelliTechture.ConsoleTester.dll,\
    \ Size = 24576\nFileName = intelliTechture.ConsoleTester.pdb, Size = 30208\n```\n\
    \nThe output of an anonymous type automatically shows the property names and their\
    \ values as part of the generated `ToString()` method associated with the anonymous\
    \ type.\n\nProjection using the `Select()` method is very powerful. We already\
    \ saw how to filter a collection vertically (reducing the number of items in the\
    \ collection) using the `Where()` standard query operator. Now, via the `Select()`\
    \ standard query operator, we can also reduce the collection horizontally (making\
    \ fewer columns) or transform the data entirely. In combination, `Where()` and\
    \ `Select()` provide a means for extracting only those pieces of the original\
    \ collection that are desirable for the current algorithm. These two methods alone\
    \ provide a powerful collection manipulation API that would otherwise result in\
    \ significantly more—and less readable—code.\n\n**Advanced Topic: Running LINQ\
    \ Queries in Parallel**\n\nWith the widespread availability of computers having\
    \ multiple processors and multiple cores within those processors, the ability\
    \ to easily take advantage of the additional processing power becomes far more\
    \ important. To do so, programs need to support multiple threads so that work\
    \ can happen simultaneously on different CPUs within the computer. [LISTING 15.14](#ch15.html_list15_14)\
    \ demonstrates one way to do this using Parallel LINQ (PLINQ).\n\n**LISTING 15.14:\
    \ Executing LINQ Queries in Parallel**\n\n```\n//...\nIEnumerable<string> fileList\
    \ = Directory.EnumerateFiles(\n    rootDirectory, searchPattern);\nvar items =\
    \ fileList.AsParallel().Select(                                 \n    file =>\n\
    \    {\n        FileInfo fileInfo = new FileInfo(file);\n        return new\n\
    \        {\n            FileName = fileInfo.Name,\n            Size = fileInfo.Length\n\
    \        };\n    });\n//...\n```\n\nAs [LISTING 15.14](#ch15.html_list15_14) shows,\
    \ only a minimal change in code is needed to enable parallel support. All that\
    \ this example uses is a Microsoft .NET Framework 4–introduced standard query\
    \ operator, `AsParallel()`, on the static class `System.Linq.ParallelEnumerable`.\
    \ Using this simple extension method, the runtime begins executing over the items\
    \ within the `fileList` collection and returning the resultant objects in parallel.\
    \ Each parallel operation in this case isn’t particularly expensive (although\
    \ it is relative to the other execution taking place), but consider the burden\
    \ imposed by CPU-intensive operations such as encryption or compression. Running\
    \ the query in parallel across multiple CPUs can decrease execution time by a\
    \ factor corresponding to the number of CPU cores.\n\nAn important caveat to be\
    \ aware of (and the reason why `AsParallel()` appears as an Advanced Topic rather\
    \ than in the standard text) is that parallel execution can introduce race conditions,\
    \ such that an operation on one thread can be intermingled with an operation on\
    \ a different thread, causing data corruption. To avoid this problem, synchronization\
    \ mechanisms are required on data with shared access from multiple threads to\
    \ force the operations to be atomic where necessary. Synchronization itself, however,\
    \ can introduce deadlocks that freeze the execution, further complicating the\
    \ effective parallel programming.\n\nMore details on this and additional multithreading\
    \ topics are provided in [Chapters 19](#ch19.html_ch19) through [22](#ch22.html_ch22).\n\
    \n#### Counting Elements with `Count()`\n\nAnother query frequently performed\
    \ on a collection of items is to retrieve the count. To support this type of query,\
    \ LINQ includes the `Count()` extension method.\n\n[LISTING 15.15](#ch15.html_list15_15)\
    \ demonstrates that `Count()` is overloaded to simply count all elements (no parameters)\
    \ or to take a predicate that counts only items identified by the predicate expression.\n\
    \n**LISTING 15.15: Counting Items with `Count()`**\n\n```\nusing System;\nusing\
    \ System.Collections.Generic;\nusing System.Linq;\n\npublic class Program\n{\n\
    \    public static void Main()\n    {\n        IEnumerable<Patent> patents = PatentData.Patents;\n\
    \        Console.WriteLine($\"Patent Count: { patents.Count() }\");          \
    \  \n        Console.WriteLine($@\"Patent Count in 1800s: {\n            patents.Count(patent\
    \ =>\n                patent.YearOfPublication.StartsWith(\"18\"))}\");\n```\n\
    \nIn spite of the apparent simplicity of the `Count()` statement, `IEnumerable<T>`\
    \ has not changed, so the executed code still iterates over all the items in the\
    \ collection. Whenever a `Count` property is directly available on the collection,\
    \ it is preferable to use that rather than LINQ’s `Count()` method (a subtle difference).\
    \ Fortunately, `ICollection<T>` includes the `Count` property, so code that calls\
    \ the `Count()` method on a collection that supports `ICollection<T>` will cast\
    \ the collection and call `Count` directly. However, if `ICollection<T>` is not\
    \ supported, `Enumerable.Count()` will proceed to enumerate all the items in the\
    \ collection rather than call the built-in `Count` mechanism. If the purpose of\
    \ checking the count is just to see whether it is greater than zero (`if(patents.Count()\
    \ > 0){...}`), the preferred approach would be to use the `Any()` operator (`if(patents.Any()){...}`).\
    \ `Any()` attempts to iterate over only one of the items in the collection to\
    \ return a true result, rather than iterating over the entire sequence.\n\n**Guidelines**\n\
    \n**DO use `System.Linq.Enumerable.Any()` rather than calling `patents.Count()`\
    \ when checking whether there are more than zero items.**\n\n**DO use a collection’s\
    \ `Count` property (if available) instead of calling the `System.Linq.Enumerable.Count()`\
    \ method.**\n\n#### Deferred Execution\n\nOne of the most important concepts to\
    \ remember when using LINQ is deferred execution. Consider the code in [LISTING\
    \ 15.16](#ch15.html_list15_16) and the corresponding output in [OUTPUT 15.4](#ch15.html_op15_4).\n\
    \n**LISTING 15.16: Filtering with `System.Linq.Enumerable.Where()`**"
