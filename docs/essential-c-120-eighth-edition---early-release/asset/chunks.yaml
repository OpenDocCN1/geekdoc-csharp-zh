  trans: "\n与标准的 `for` 循环一样，`Parallel.For()` 循环支持“中断”（breaking）概念以退出循环并取消任何后续迭代。然而，在并行\
    \ `for` 执行的上下文中，`break` 表示在中断迭代之后不应启动任何*新*迭代。但是，所有正在执行的迭代都将运行完毕。\n\n要中断并行循环，你可以提供一个取消标记（cancellation\
    \ token）并在另一个线程上取消它，如前面的“高级主题：并行循环选项”所述。你还可以使用 `Parallel.For()` 方法的重载版本，其循环体委托接受两个参数：索引和一个\
    \ `ParallelLoopState` 对象。希望中断循环的迭代可以调用传递给委托的循环状态对象上的 `Break()` 或 `Stop()` 方法。`Break()`\
    \ 方法表示不需要执行索引值大于当前值的更多迭代；`Stop()` 方法表示不再需要运行任何迭代。\n\n例如，假设你有一个并行执行十次迭代的 `Parallel.For()`\
    \ 循环。其中某些迭代的运行速度可能比其他迭代快，且任务调度器不保证它们按任何特定顺序运行。假设第一次迭代已经完成；迭代 3、5、7 和 9 正在“执行中”，被调度到四个不同的线程；而迭代\
    \ 5 和 7 都调用了 `Break()`。在这种情况下，迭代 6 和 8 将永远不会开始，但迭代 2 和 4 仍会被调度运行。迭代 3 和 9 将运行完毕，因为它们在中断发生时已经启动了。\n\
    \n`Parallel.For()` 和 `Parallel.ForEach<T>()` 方法返回 `ParallelLoopResult` 对象的引用，该对象包含了循环期间发生情况的有用信息。此结果对象具有以下属性：\n\
    \n* `IsCompleted` 返回一个布尔值，指示所有迭代是否已启动。\n* `LowestBreakIteration` 标识执行了 break 的最低迭代。其值类型为\
    \ `long?`，值为 `null` 表示没有遇到 break 语句。\n\n回到十次迭代的示例，`IsCompleted` 属性将返回 `false`，而\
    \ `LowestBreakIteration` 将返回值 `5`。\n\n### 并行运行 LINQ 查询\n\n就像可以使用 `Parallel.For()`\
    \ 并行执行循环一样，也可以使用并行 LINQ API（简称为 PLINQ）并行执行 LINQ 查询。一个简单的非并行 LINQ 表达式示例在 LISTING\
    \ 21.6 中；在 LISTING 21.7 中，我们将其修改为并行运行。\n\n**LISTING 21.6: LINQ `Select()`**\n\n\
    ```csharp\nusing System.Collections.Generic;\nusing System.Linq;\npublic class\
    \ Program\n{\n    // ...\n    public static List<string>\n      Encrypt(IEnumerable<string>\
    \ data)\n    {\n        return data.Select(\n            item => Encrypt(item)).ToList();\n\
    \    }\n    // ...\n}\n```\n\n在 LISTING 21.6 中，LINQ 查询使用 `Select()` 标准查询运算符加密字符串序列中的每个字符串，并将生成的序列转换为列表。这看起来像是一个“尴尬并行”的操作；每个加密操作可能是一个高延迟的\
    \ CPU 密集型操作，可以分配到另一个 CPU 上的工作线程上。\n\nLISTING 21.7 显示了如何修改 LISTING 21.6 以使加密字符串的代码并行执行。\n\
    \n**LISTING 21.7: 并行 LINQ `Select()`**\n\n```csharp\nusing System.Linq;\n\npublic\
    \ class Program\n{\n    // ...\n    public static List<string>\n      Encrypt(IEnumerable<string>\
    \ data)\n    {\n        return data.AsParallel().Select(                     \
    \               \n            item => Encrypt(item)).ToList();\n    }\n    //\
    \ ...\n}\n```\n\n如 LISTING 21.7 所示，启用并行支持的变化非常小！它涉及的只是一个标准查询运算符 `AsParallel()`，可以在静态类\
    \ `System.Linq.ParallelEnumerable` 中找到。这个简单的扩展方法告诉运行时它可以并行执行查询。结果是，在具有多个可用 CPU\
    \ 的机器上，执行查询的总时间可以显著缩短。\n\n`System.Linq.ParallelEnumerable` 是为了在 .NET Framework\
    \ 4.0 中启用 PLINQ 而引入的引擎，它包含了 `System.Linq.Enumerable` 中可用查询运算符的超集。因此，它为所有常见的查询运算符提供了可能性能改进的\
    \ API，包括用于排序、过滤 (`Where()`）、投影 (`Select()`）、连接、分组和聚合的运算符。LISTING 21.8 显示了如何进行并行排序。\n\
    \n**LISTING 21.8: 使用标准查询运算符的并行 LINQ**\n\n```csharp\n//...\nOrderedParallelQuery<string>\
    \ parallelGroups =                             \n    data.AsParallel().OrderBy(item\
    \ => item);                              \n\n// 显示剩余项的总计数\n// 确保与原始计数匹配\nif (data.Count()\
    \ != parallelGroups.Sum(\n        item => item.Length))\n{\n    throw new Exception(\"\
    data.Count() != parallelGroups.Sum(item => item.Length)\");\n}\n// ...\n```\n\n\
    `Parallel.For()` 和 `Parallel.ForEach<T>()` 方法返回 `ParallelLoopResult` 对象的引用，该对象包含了循环期间发生情况的有用信息。此结果对象具有以下属性：\n\
    \n* `IsCompleted` 返回一个布尔值，指示所有迭代是否已启动。\n* `LowestBreakIteration` 标识执行了 break 的最低迭代。其值类型为\
    \ `long?`，值为 `null` 表示没有遇到 break 语句。\n\n（注：原文后续部分存在大量重复段落，此处已根据要求不进行重复输出）\n"
- fmt: "\nAs expected, the cancellation request pattern is also available on PLINQ\
    \ queries. [LISTING 21.10](#ch21.html_list21_10) (with [OUTPUT 21.3](#ch21.html_op21_3))\
    \ provides an example. Like the parallel loops, canceled PLINQ queries will throw\
    \ a `System.OperationCanceledException`. Also like the parallel loops, executing\
    \ a PLINQ query is a synchronous operation on the invoking thread. Thus, a common\
    \ technique is to wrap the parallel query in a task that runs on another thread\
    \ so that the current thread can cancel it if necessary—the same solution used\
    \ in [LISTING 21.5](#ch21.html_list21_5).\n\n### LISTING 21.10: Canceling a PLINQ\
    \ Query\n\n```csharp\nusing System;\nusing System.Collections.Generic;\nusing\
    \ System.Linq;\nusing System.Threading;\nusing System.Threading.Tasks;\n\npublic\
    \ static class Program\n{\n    public static List<string> ParallelEncrypt(\n \
    \       List<string> data,\n        CancellationToken cancellationToken)\n   \
    \ {\n        int govener = 0;\n        return data.AsParallel().WithCancellation(\n\
    \            cancellationToken).Select(\n                (item) =>\n         \
    \       {\n                    if (Interlocked.CompareExchange(\n            \
    \            ref govener, 0, 100) % 100 == 0)\n                    {\n       \
    \                 Console.Write('.');\n                    }\n               \
    \     Interlocked.Increment(ref govener);\n                    return Encrypt(item);\n\
    \                }).ToList();\n    }\n\n    public static async Task Main()\n\
    \    {\n        ConsoleColor originalColor = Console.ForegroundColor;\n      \
    \  List<string> data = Utility.GetData(100000).ToList();\n\n        using CancellationTokenSource\
    \ cts =\n            new CancellationTokenSource();\n\n        Task task = Task.Run(()\
    \ =>\n        {\n            data = ParallelEncrypt(data, cts.Token);\n      \
    \  }, cts.Token);\n\n        Console.WriteLine(\"Press any key to Exit.\");\n\
    \        Task<int> cancelTask = ConsoleReadAsync(cts.Token);\n\n        try\n\
    \        {\n            Task.WaitAny(task, cancelTask);\n            // Cancel\
    \ whichever task has not finished.\n            cts.Cancel();\n            await\
    \ task;\n\n            Console.ForegroundColor = ConsoleColor.Green;\n       \
    \     Console.WriteLine(\"\\nCompleted successfully\");\n\n        }\n       \
    \ catch (OperationCanceledException taskCanceledException)\n        {\n      \
    \      Console.ForegroundColor = ConsoleColor.Red;\n            Console.WriteLine(\n\
    \                $\"\\nCancelled: { taskCanceledException.Message }\");\n    \
    \    }\n        finally\n        {\n            Console.ForegroundColor = originalColor;\n\
    \        }\n    }\n\n    private static async Task<int> ConsoleReadAsync(\n  \
    \      CancellationToken cancellationToken = default)\n    {\n        return await\
    \ Task.Run(async () =>\n        {\n            const int maxDelay = 1025;\n  \
    \          int delay = 0;\n            while (!cancellationToken.IsCancellationRequested)\n\
    \            {\n                if (Console.KeyAvailable)\n                {\n\
    \                    return Console.Read();\n                }\n             \
    \   else\n                {\n                    await Task.Delay(delay, cancellationToken);\n\
    \                    if (delay < maxDelay) delay *= 2 + 1;\n                }\n\
    \            }\n            cancellationToken.ThrowIfCancellationRequested();\n\
    \            throw new InvalidOperationException(\n                \"Previous\
    \ line should throw preventing this from ever executing\");\n        }, cancellationToken);\n\
    \    }\n\n    private static string Encrypt(string item)\n    {\n        Cryptographer\
    \ cryptographer = new Cryptographer();\n        return System.Text.Encoding.UTF8.GetString(cryptographer.Encrypt(item));\n\
    \    }\n}\n```\n\n### OUTPUT 21.3\n\n```\nPress any key to Exit.\n........................................................................\n\
    ........................................................................\n.............................................................\n\
    .....................................\nCancelled: The query has been canceled\
    \ via the token supplied to WithCancellation.\n```\n\nAs with a parallel loop\
    \ or task, canceling a PLINQ query requires a `CancellationToken`, which is available\
    \ from a `CancellationTokenSource`. However, rather than overloading every PLINQ\
    \ query to support the cancellation token, the `ParallelQuery<T>` object returned\
    \ by `IEnumerable`’s `AsParallel()` method includes a `WithCancellation()` extension\
    \ method that simply takes a `CancellationToken`. As a result, calling `Cancel()`\
    \ on the `CancellationTokenSource` object will request the parallel query to cancel—\
    \ because it checks the `IsCancellationRequested` property on the `CancellationToken`.\n\
    \nAs mentioned, canceling a PLINQ query will throw an exception in place of returning\
    \ the complete result. One common technique for dealing with a possibly canceled\
    \ PLINQ query is to wrap the query in a `try` block and catch the `OperationCanceledException`.\
    \ A second common technique, used in [LISTING 21.10](#ch21.html_list21_10), is\
    \ to pass the `CancellationToken` both to `ParallelEncrypt()` and as a second\
    \ parameter on `Run()`. This will cause `task.Wait()` to throw an `AggregateException`\
    \ whose `InnerException` property will be set to a `TaskCanceledException`. The\
    \ aggregating exception can then be caught, just as you would catch any other\
    \ exception from a parallel operation.\n\n### Summary\n\nIn this chapter, we discussed\
    \ how to use the TPL `Parallel` class for both `for` and `foreach` type iterations.\
    \ In addition, via the `AsParallel()` extension method included in `System.Linq`,\
    \ we demonstrated how to execute LINQ queries in parallel. The ease with which\
    \ this is accomplished should help you recognize that parallel iteration is one\
    \ of the easiest ways to introduce parallel execution. Although it is still necessary\
    \ to be aware of race conditions and deadlocks, these issues are far less likely\
    \ to occur if you do not share data within the iterations of a parallel loop than\
    \ if you work with tasks directly. All that remains is identifying the CPU-intensive\
    \ code blocks that can benefit from parallel execution.\n"
