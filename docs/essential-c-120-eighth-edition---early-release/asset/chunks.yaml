  trans: "\n\n### 使用 `IEnumerable<T>` 配合 `foreach`\n\n尽管 LISTING 15.4 所示的代码在长度固定且始终支持索引操作符的数组上运行良好，但并非所有类型的集合都有已知的元素数量。此外，许多集合类（包括\
    \ `Stack<T>`、`Queue<T>` 和 `Dictionary<TKey, TValue>` 类）并不支持通过索引检索元素。因此，需要一种更通用的方法来对元素集合进行迭代。迭代器模式（iterator\
    \ pattern）提供了这种能力。假设你可以确定第一个元素和下一个元素，那么知道计数和支持通过索引检索元素就是必要的。\n\n`System.Collections.Generic.IEnumerator<T>`\
    \ 和非泛型的 `System.Collections.IEnumerator` 接口的设计是为了通过迭代器模式来遍历元素集合，而不是 LISTING 15.4\
    \ 所示的长度-索引模式。它们的关系类图出现在 FIGURE 15.1 中。\n\n![Images](img/15fig01.jpg)\n\n**图 15.1：`IEnumerator<T>`\
    \ 和 `IEnumerator` 接口的类图**\n\n`IEnumerator<T>` 继承自 `IEnumerator`，三个成员。第一个是 `bool\
    \ MoveNext()`。使用此方法，你可以从集合中的一个元素移动到下一个元素，同时检测何时已遍历完所有项目。第二个成员是一个名为 `Current` 的只读属性，它返回当前处理的元素。`Current`\
    \ 在 `IEnumerator<T>` 中被重载，提供了其特定类型的实现。通过集合类中的这两个成员，可以简单地使用 `while` 循环对集合进行迭代，如\
    \ LISTING 15.5 所示。（`Reset()` 方法通常会抛出 `NotImplementedException`，因此永远不被调用。如果你需要重新开始枚举，只需创建一个新的迭代器。）\n\
    \n**LISTING 15.5：使用 `while` 遍历集合**\n\n```\nSystem.Collections.Generic.Stack<int>\
    \ stack =\n    new System.Collections.Generic.Stack<int>();\nint number;\n// ...\n\
    \n// 这段代码是概念性的，不是实际代码\n#if ConceptualCode\nwhile(stack.MoveNext())\n{   \n   \
    \ number = stack.Current();\n    Console.WriteLine(number);\n}\n#endif // ConceptualCode\n\
    ```\n\n在 LISTING 15.5 中，`MoveNext()` 方法在移动到集合末之后返回 `false`。这消除了在循环时计数元素的需求。\n\n\
    LISTING 15.5 使用 `System.Collections.Generic.Stack<T>` 作为集合类型。存在许多其他集合类型；这只是一个示例。`Stack<T>`\
    \ 的关键特征是其设计为后进先出（LIFO）集合。注意类型参数 `T` 标识集合中所有项目的类型。在集合中收集一种类型的对象是泛型集合的一个关键特征。程序员在向集合中添加、删除或访问项目时，必须知道集合中的数据类型。\n\
    \n上一个示例展示了 C# 编译器输出的大致，但它实际上并没有以那种方式编译，因为它遗漏了关于实现的两个重要细节：交错执行和错误处理。\n\n#### 状态共享\n\
    \n\n\n如 LISTING 15.5 这样的实现的问题是，如果两个这样的循环交错执行——一个 `foreach` 在另一个内部，且都使用同一个集合——集合必须维护当前元素的状态指示器，以便在调用\
    \ `MoveNext()` 时，可以确定下一个元素。在这种情况下，一个交错循环可能会影响另一个。（由多个线程执行的循环也是如此。）\n\n为了解决这个问题，集合类并不直接支持\
    \ `IEnumerator<T>` 和 `IEnumerator` 接口。相反，如 FIGURE 15.1 所示，有一个第二个接口称为 `IEnumerable<T>`，其唯一的方法是\
    \ `GetEnumerator()`。该方法的目的是返回一个支持 `IEnumerator<T>` 的对象。集合类不再维护状态，而是由另一个类（通常是嵌套类，以便它可以访问集合的内部结构）来支持\
    \ `IEnumerator<T>` 接口并保持迭代循环的状态。迭代器就像序列中的“光标”或“书签”。你可以有多个书签，移动其中每一个都可以独立于其他书签遍历集合。使用这种模式，C#\
    \ 相当于 `foreach` 循环的代码看起来像 LISTING 15.6 所示的代码。\n\n**LISTING 15.6：在迭代期间维护状态的独立迭代器**\n\
    \n```\nSystem.Collections.Generic.Stack<int> stack =\n    new System.Collections.Generic.Stack<int>();\n\
    int number;\nSystem.Collections.Generic.Stack<int>.Enumerator\n  enumerator;\n\
    \n// ...\n\n// 如果显式实现 IEnumerable<T>，\n// 则需要进行强制类型转换\n// ((IEnumerable<int>)stack).GetEnumerator();\n\
    enumerator = stack.GetEnumerator();\nwhile(enumerator.MoveNext())\n{\n    number\
    \ = enumerator.Current;\n}\n```\n\n#### 进阶主题：迭代后的清理\n\n由于实现 `IEnumerator<T>` 接口的类维护状态，有时你需要在循环结束后清理状态（无论所有迭代完成还是抛出了异常）。为了实现这一点，`IEnumerator<T>`\
    \ 继承自 `IDisposable`。`IEnumerator` 并不一定实现 `IDisposable`，但如果实现了，`Dispose()` 也会被调用。这意味着在\
    \ `foreach` 循环结束后可以调用 `Dispose()`。因此，C# 对应的公共中间语言（CIL）代码像 LISTING 15.7。\n\n**LISTING\
    \ 15.7：对集合执行 foreach 的编译结果**\n\n```\nSystem.Collections.Generic.Stack<int> stack\
    \ =\n    new System.Collections.Generic.Stack<int>();\nSystem.Collections.Generic.Stack<int>.Enumerator\
    \ enumerator;\nIDisposable disposable;\n\nenumerator = stack.GetEnumerator();\n\
    try\n{\n    int number;\n    while(enumerator.MoveNext())\n    {\n        number\
    \ = enumerator.Current;\n        Console.WriteLine(number);\n    }\n}\nfinally\n\
    {\n    // 对于 IEnumerator<T> 使用显式转换\n    disposable = (IDisposable)enumerator;\n\
    \    disposable.Dispose();\n\n    // IEnumerator 使用 as 运算符，除非编译时已知 IDisposable\
    \ 支持\n    // disposable = (enumerator as IDisposable);\n    // if (disposable\
    \ != null)\n    //     disposable.Dispose();\n    // }\n}\n```\n\n注意，由于 `IDisposable`\
    \ 接口支持 `Enumerator<T>`，`using` 语句可以将 LISTING 15.7 中的代码简化为 LISTING 15.8 所示。\n\n\
    **LISTING 15.8：使用 using 进行错误处理和资源清理**\n\n```\nSystem.Collections.Generic.Stack<int>\
    \ stack =\n    new System.Collections.Generic.Stack<int>();\nint number;\n\nusing\
    \ (\n    System.Collections.Generic.Stack<int>.Enumerator\n        enumerator\
    \ = stack.GetEnumerator())                         \n{\n    while (enumerator.MoveNext())\n\
    \    {\n        number = enumerator.Current;\n        Console.WriteLine(number);\n\
    \    }\n}\n```\n\n然而，记住 CIL 不直接支持 `using` 关键字。因此，LISTING 15.7 中的代码实际上是 `foreach`\
    \ CIL 代码更准确的 C# 表示。\n\n"
- fmt: "\nC# doesn’t require that `IEnumerable`/`IEnumerable<T>` be implemented to\
    \ iterate over a data type using `foreach`. Rather, the compiler uses a concept\
    \ known as **duck typing**: It looks for a `GetEnumerator()` method that returns\
    \ a type with a `Current` property and a `MoveNext()` method. Duck typing involves\
    \ searching by name rather than relying on an interface or explicit method call\
    \ to the method. (The name “duck typing” comes from the whimsical idea that to\
    \ be treated as a duck, the object must merely implement a `Quack()` method; it\
    \ need not implement an `IDuck` interface.) If duck typing fails to find a suitable\
    \ implementation of the enumerable pattern, the compiler checks whether the collection\
    \ implements the interfaces.\n\n## Do Not Modify Collections during `foreach`\
    \ Iteration\n\n[Chapter 4](#ch04.html_ch04) showed that the compiler prevents\
    \ assignment of the `foreach` variable (`number`). As is demonstrated in [LISTING\
    \ 15.7](#ch15.html_list15_7), an assignment to `number` would not change the collection\
    \ element itself, so the C# compiler prevents such an assignment altogether.\n\
    \nIn addition, neither the element count within a collection nor the items themselves\
    \ can generally be modified during the execution of a `foreach` loop. If, for\
    \ example, you called `stack.Push(42)` inside the `foreach` loop, it would be\
    \ ambiguous whether the `iterator` should ignore or incorporate the change to\
    \ `stack` —in other words, whether `iterator` should iterate over the newly added\
    \ item or ignore it and assume the same state as when it was instantiated.\n\n\
    Because of this ambiguity, an exception of type `System.InvalidOperationException`\
    \ is generally thrown upon accessing the enumerator if the collection is modified\
    \ within a `foreach` loop. This exception reports that the collection was modified\
    \ after the enumerator was instantiated.\n\n## Standard Query Operators\n\nBesides\
    \ the methods on `System.Object`, any type that implements `IEnumerable<T>` is\
    \ required to implement only one other method, `GetEnumerator()`. Yet, doing so\
    \ makes more than 50 methods available to all types implementing `IEnumerable<T>`,\
    \ not including any overloading—and this happens without needing to explicitly\
    \ implement any method except the `GetEnumerator()` method. The additional functionality\
    \ is provided through extension methods^([8](#ch15.html_fn15_8)) and resides in\
    \ the class `System.Linq.Enumerable`. Therefore, including the `using` declarative\
    \ for `System.Linq` is all it takes to make these methods available.\n\n[8](#ch15.html_fn15_8a).\
    \ Starting in C# 3.0.\n\nEach method on `IEnumerable<T>` is a **standard query\
    \ operator**; it provides querying capability over the collection on which it\
    \ operates. In the following sections, we examine some of the most prominent of\
    \ these standard query operators. Many of these examples will depend on an `Inventor`\
    \ and/or `Patent` class, both of which are defined in [LISTING 15.9](#ch15.html_list15_9)\
    \ with [OUTPUT 15.1](#ch15.html_op15_1).\n\n**LISTING 15.9: Sample Classes for\
    \ Use with Standard Query Operators**\n\n```\nusing System;\nusing System.Collections.Generic;\n\
    \npublic class Program\n{\n    public static void Main()\n    {\n        IEnumerable<Patent>\
    \ patents = PatentData.Patents;\n        Print(patents);\n\n        Console.WriteLine();\n\
    \n        IEnumerable<Inventor> inventors = PatentData.Inventors;\n        Print(inventors);\n\
    \    }\n\n    private static void Print<T>(IEnumerable<T> items)\n    {\n    \
    \    foreach(T item in items)\n        {\n            Console.WriteLine(item);\n\
    \        }\n    }\n}\n```\n\n**OUTPUT 15.1**\n\n```\nBifocals (1784)\nPhonograph\
    \ (1877)\nKinetoscope (1888)\nElectrical Telegraph (1837)\nFlying Machine (1903)\n\
    Steam Locomotive (1815)\nDroplet Deposition Apparatus (1989)\nBackless Brassiere\
    \ (1914)\n\nBenjamin Franklin (Philadelphia, PA)\nOrville Wright (Kitty Hawk,\
    \ NC)\nWilbur Wright (Kitty Hawk, NC)\nSamuel Morse (New York, NY)\nGeorge Stephenson\
    \ (Wylam, Northumberland)\nJohn Michaelis (Chicago, IL)\nMary Phelps Jacob (New\
    \ York, NY)\n```\n\n## Filtering with `Where()`\n\nTo filter out data from a collection,\
    \ we need to provide a filter method that returns `true` or `false`, indicating\
    \ whether or not a particular element should be included. A delegate expression\
    \ that takes an argument and returns a Boolean value is called a **predicate**,\
    \ and a collection’s `Where()` method depends on predicates for identifying filter\
    \ criteria, as shown in [LISTING 15.10](#ch15.html_list15_10). (Technically, the\
    \ result of the `Where()` method is an **object** that encapsulates the operation\
    \ of filtering a given sequence with a given predicate.) The results appear in\
    \ [OUTPUT 15.2](#ch15.html_op15_2).\n\n**LISTING 15.10: Filtering with `System.Linq.Enumerable.Where()`**\n\
    \n```\nusing System;\nusing System.Collections.Generic;\nusing System.Linq;\n\n\
    public class Program\n{\n    public static void Main()\n    {\n        IEnumerable<Patent>\
    \ patents = PatentData.Patents;\n        patents = patents.Where(            \
    \                              \n            patent => patent.YearOfPublication.StartsWith(\"\
    18\"));         \n        Print(patents);\n    }\n}\n```\n\n**OUTPUT 15.2**\n\n\
    ```\nPhonograph (1877)\nKinetoscope (1888)\nElectrical Telegraph (1837)\nSteam\
    \ Locomotive (1815)\n```\n\nNotice that the code assigns the output of `Where()`\
    \ back to `IEnumerable<T>`. In other words, `Where()` is a `IEnumerable<T>` collection.\
    \ In [LISTING 15.10](#ch15.html_list15_10), it is `IEnumerable<Patent>`.\n\nLess\
    \ obvious is that the `Where()` expression has not necessarily been executed at\
    \ assignment time. This is true for many of the standard query operators. In the\
    \ case of `Where()`, for example, the expression is passed into the collection\
    \ and “saved” but not executed. Instead, execution of the expression occurs only\
    \ when it is necessary to iterate over the items.\n\n## Projecting with `Select()`\n\
    \nSince the output from `IEnumerable<T>.Where()` method is a new `IEnumerable<T>`\
    \ collection, it is possible to again call a standard query operator on the same\
    \ collection. For example, rather than just filtering the data from the original\
    \ collection, we could transform the data (see [LISTING 15.11](#ch15.html_list15_11)).\n\
    \n**LISTING 15.11: Projection with `System.Linq.Enumerable.Select()`**\n\n```\n\
    using System;\nusing System.Collections.Generic;\nusing System.Linq;\n\npublic\
    \ class Program\n{\n    public static void Main()\n    {\n        IEnumerable<Patent>\
    \ patents = PatentData.Patents;\n        IEnumerable<Patent> patentsOf1800 = patents.Where(\n\
    \            patent => patent.YearOfPublication.StartsWith(\"18\"));\n       \
    \ IEnumerable<string> items = patentsOf1800.Select(                  \n      \
    \      patent => patent.ToString());                                  \n\n   \
    \     Print(items);\n    }\n}\n```\n\nIn [LISTING 15.11](#ch15.html_list15_11),\
    \ we create a new `IEnumerable<string>` collection. In this case, it just so happens\
    \ that adding the `Select()` call doesn’t change the output—but only because `Print()`’s\
    \ `Console.WriteLine()` call used `ToString()` anyway. Obviously, a transform\
    \ still occurred on each item from the `Patent` type of the original collection\
    \ to the `string` type of the `items` collection.\n\nConsider the example using\
    \ `System.IO.FileInfo` in [LISTING 15.12](#ch15.html_list15_12).\n\nHere `fileList`\
    \ is of type `IEnumerable<string>`. However, using the projection offered by `Select`,\
    \ we can transform each item in the collection to a `System.IO.FileInfo` object.\n"
  raw: "C# doesn’t require that `IEnumerable`/`IEnumerable<T>` be implemented to iterate\
    \ over a data type using `foreach`. Rather, the compiler uses a concept known\
    \ as **duck typing**: It looks for a `GetEnumerator()` method that returns a type\
    \ with a `Current` property and a `MoveNext()` method. Duck typing involves searching\
    \ by name rather than relying on an interface or explicit method call to the method.\
    \ (The name “duck typing” comes from the whimsical idea that to be treated as\
    \ a duck, the object must merely implement a `Quack()` method; it need not implement\
    \ an `IDuck` interface.) If duck typing fails to find a suitable implementation\
    \ of the enumerable pattern, the compiler checks whether the collection implements\
    \ the interfaces.\n\n#### Do Not Modify Collections during `foreach` Iteration\n\
    \n[Chapter 4](#ch04.html_ch04) showed that the compiler prevents assignment of\
    \ the `foreach` variable (`number`). As is demonstrated in [LISTING 15.7](#ch15.html_list15_7),\
    \ an assignment to `number` would not change the collection element itself, so\
    \ the C# compiler prevents such an assignment altogether.\n\nIn addition, neither\
    \ the element count within a collection nor the items themselves can generally\
    \ be modified during the execution of a `foreach` loop. If, for example, you called\
    \ `stack.Push(42)` inside the `foreach` loop, it would be ambiguous whether the\
    \ `iterator` should ignore or incorporate the change to `stack` —in other words,\
    \ whether `iterator` should iterate over the newly added item or ignore it and\
    \ assume the same state as when it was instantiated.\n\nBecause of this ambiguity,\
    \ an exception of type `System.InvalidOperationException` is generally thrown\
    \ upon accessing the enumerator if the collection is modified within a `foreach`\
    \ loop. This exception reports that the collection was modified after the enumerator\
    \ was instantiated.\n\n### Standard Query Operators\n\nBesides the methods on\
    \ `System.Object`, any type that implements `IEnumerable<T>` is required to implement\
    \ only one other method, `GetEnumerator()`. Yet, doing so makes more than 50 methods\
    \ available to all types implementing `IEnumerable<T>`, not including any overloading—and\
    \ this happens without needing to explicitly implement any method except the `GetEnumerator()`\
    \ method. The additional functionality is provided through extension methods^([8](#ch15.html_fn15_8))\
    \ and resides in the class `System.Linq.Enumerable`. Therefore, including the\
    \ `using` declarative for `System.Linq` is all it takes to make these methods\
    \ available.\n\n[8](#ch15.html_fn15_8a). Starting in C# 3.0.\n\nEach method on\
    \ `IEnumerable<T>` is a **standard query operator**; it provides querying capability\
    \ over the collection on which it operates. In the following sections, we examine\
    \ some of the most prominent of these standard query operators. Many of these\
    \ examples will depend on an `Inventor` and/or `Patent` class, both of which are\
    \ defined in [LISTING 15.9](#ch15.html_list15_9) with [OUTPUT 15.1](#ch15.html_op15_1).\n\
    \n**LISTING 15.9: Sample Classes for Use with Standard Query Operators**\n\n```\n\
    using System;\nusing System.Collections.Generic;\n\npublic class Program\n{\n\
    \    public static void Main()\n    {\n        IEnumerable<Patent> patents = PatentData.Patents;\n\
    \        Print(patents);\n\n        Console.WriteLine();\n\n        IEnumerable<Inventor>\
    \ inventors = PatentData.Inventors;\n        Print(inventors);\n    }\n\n    private\
    \ static void Print<T>(IEnumerable<T> items)\n    {\n        foreach(T item in\
    \ items)\n        {\n            Console.WriteLine(item);\n        }\n    }\n\
    }\n```\n\n**OUTPUT 15.1**\n\n```\nBifocals (1784)\nPhonograph (1877)\nKinetoscope\
    \ (1888)\nElectrical Telegraph (1837)\nFlying Machine (1903)\nSteam Locomotive\
    \ (1815)\nDroplet Deposition Apparatus (1989)\nBackless Brassiere (1914)\n\nBenjamin\
    \ Franklin (Philadelphia, PA)\nOrville Wright (Kitty Hawk, NC)\nWilbur Wright\
    \ (Kitty Hawk, NC)\nSamuel Morse (New York, NY)\nGeorge Stephenson (Wylam, Northumberland)\n\
    John Michaelis (Chicago, IL)\nMary Phelps Jacob (New York, NY)\n```\n\n#### Filtering\
    \ with `Where()`\n\nTo filter out data from a collection, we need to provide a\
    \ filter method that returns `true` or `false`, indicating whether or not a particular\
    \ element should be included. A delegate expression that takes an argument and\
    \ returns a Boolean value is called a **predicate**, and a collection’s `Where()`\
    \ method depends on predicates for identifying filter criteria, as shown in [LISTING\
    \ 15.10](#ch15.html_list15_10). (Technically, the result of the `Where()` method\
    \ is an **object** that encapsulates the operation of filtering a given sequence\
    \ with a given predicate.) The results appear in [OUTPUT 15.2](#ch15.html_op15_2).\n\
    \n**LISTING 15.10: Filtering with `System.Linq.Enumerable.Where()`**\n\n```\n\
    using System;\nusing System.Collections.Generic;\nusing System.Linq;\n\npublic\
    \ class Program\n{\n    public static void Main()\n    {\n        IEnumerable<Patent>\
    \ patents = PatentData.Patents;\n        patents = patents.Where(            \
    \                              \n            patent => patent.YearOfPublication.StartsWith(\"\
    18\"));         \n        Print(patents);\n    }\n    // ...\n}\n```\n\n**OUTPUT\
    \ 15.2**\n\n```\nPhonograph (1877)\nKinetoscope (1888)\nElectrical Telegraph (1837)\n\
    Steam Locomotive (1815)\n```\n\nNotice that the code assigns the output of the\
    \ `Where()` call back to `IEnumerable<T>`. In other words, the output of `IEnumerable<T>.Where()`\
    \ is a new `IEnumerable<T>` collection. In [LISTING 15.10](#ch15.html_list15_10),\
    \ it is `IEnumerable<Patent>`.\n\nLess obvious is that the `Where()` expression\
    \ argument has not necessarily been executed at assignment time. This is true\
    \ for many of the standard query operators. In the case of `Where()`, for example,\
    \ the expression is passed into the collection and “saved” but not executed. Instead,\
    \ execution of the expression occurs only when it is necessary to begin iterating\
    \ over the items within the collection. For example, a `foreach` loop, such as\
    \ the one in `Print()` (in [LISTING 15.9](#ch15.html_list15_9)), can trigger the\
    \ expression to be evaluated for each item within the collection. At least conceptually,\
    \ the `Where()` method should be understood as a means of specifying the query\
    \ regarding what appears in the collection, not the actual work involved with\
    \ iterating over the items to produce a new collection with potentially fewer\
    \ items.\n\n#### Projecting with `Select()`\n\nSince the output from the `IEnumerable<T>.Where()`\
    \ method is a new `IEnumerable<T>` collection, it is possible to again call a\
    \ standard query operator on the same collection. For example, rather than just\
    \ filtering the data from the original collection, we could transform the data\
    \ (see [LISTING 15.11](#ch15.html_list15_11)).\n\n**LISTING 15.11: Projection\
    \ with `System.Linq.Enumerable.Select()`**\n\n```\nusing System;\nusing System.Collections.Generic;\n\
    using System.Linq;\n\npublic class Program\n{\n    public static void Main()\n\
    \    {\n        IEnumerable<Patent> patents = PatentData.Patents;\n        IEnumerable<Patent>\
    \ patentsOf1800 = patents.Where(\n            patent => patent.YearOfPublication.StartsWith(\"\
    18\"));\n        IEnumerable<string> items = patentsOf1800.Select(           \
    \       \n            patent => patent.ToString());                          \
    \        \n\n        Print(items);\n    }\n    // ...\n}\n```\n\nIn [LISTING 15.11](#ch15.html_list15_11),\
    \ we create a new `IEnumerable<string>` collection. In this case, it just so happens\
    \ that adding the `Select()` call doesn’t change the output—but only because `Print()`’s\
    \ `Console.WriteLine()` call used `ToString()` anyway. Obviously, a transform\
    \ still occurred on each item from the `Patent` type of the original collection\
    \ to the `string` type of the `items` collection.\n\nConsider the example using\
    \ `System.IO.FileInfo` in [LISTING 15.12](#ch15.html_list15_12).\n\nHere `fileList`\
    \ is of type `IEnumerable<string>`. However, using the projection offered by `Select`,\
    \ we can transform each item in the collection to a `System.IO.FileInfo` object."
