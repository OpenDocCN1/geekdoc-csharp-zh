    \ syntax rather than `FileInfo`.\n\n[3](#ch16.html_fn16_3a). Anonymous types used\
    \ prior to C# 7.0.\n\n**LISTING 16.3: Tuples within Query Expressions**\n\n```\n\
    using System;\nusing System.IO;\nusing System.Linq;\n// ...\n    public static\
    \ void List2\n        (string rootDirectory, string searchPattern)\n    {\n  \
    \      var fileNames = Directory.EnumerateFiles(                           \n\
    \            rootDirectory, searchPattern);                                  \n\
    \        var fileResults =                                                   \n\
    \            from fileName in fileNames                                      \n\
    \            select                                                          \n\
    \            (                                                               \n\
    \                Name: fileName,                                             \n\
    \                LastWriteTime: File.GetLastWriteTime(fileName)              \n\
    \            );                                                              \n\
    \n        foreach (var fileResult in fileResults)\n        {\n            Console.WriteLine(\n\
    \                $@\"{ fileResult.Name } ({                                  \
    \ \n                    fileResult.LastWriteTime })\");                      \
    \    \n        }\n    }\n    //...\n```\n\nIn this example, the query projects\
    \ out only the filename and its last file write time. A projection such as the\
    \ one in [LISTING 16.3](#ch16.html_list16_3) makes little difference when working\
    \ with something small, such as `FileInfo`. However, “horizontal” projection that\
    \ filters down the amount of data associated with each item in the collection\
    \ is extremely powerful when the amount of data is significant and retrieving\
    \ it (perhaps from a different computer over the Internet) is expensive. Rather\
    \ than retrieving all the data when a query executes, the use of a tuple enables\
    \ the capability of storing and retrieving only the required data into the collection.\n\
    \nImagine, for example, a large database that has tables with 30 or more columns.\
    \ If there were no tuples, developers would be required either to use objects\
    \ containing unnecessary information or to define small, specialized classes useful\
    \ only for storing the specific data required. Instead, tuples enable support\
    \ for types to be defined by the compiler—types that contain only the data needed\
    \ for their immediate scenario. Other scenarios can have a different projection\
    \ of only the properties needed for that scenario.\n\n**Beginner Topic: Deferred\
    \ Execution with Query Expressions**"
