  trans: "\n\n```c\nusing System;\nusing System.Collections.Generic;\nusing System.Linq;\n\
    // ...\n        Department[] departments = CorporateData.Departments;\n      \
    \  Employee[] employees = CorporateData.Employees;\n\n        IEnumerable<(long\
    \ Id, string Name, IEnumerable<Employee> Employees)> items =\n            departments.GroupJoin(\n\
    \                employees,\n                department => department.Id,\n  \
    \              employee => employee.DepartmentId,\n                (department,\
    \ departmentEmployees) => (\n                    department.Id,\n            \
    \        department.Name,\n                    departmentEmployees\n         \
    \       ));\n\n        foreach (\n            (_, string name, IEnumerable<Employee>\
    \ employeeCollection) i in items)\n        {\n            Console.WriteLine(name);\n\
    \            foreach (Employee employee in employeeCollection)\n            {\n\
    \                Console.WriteLine(\"\\t\" + employee);\n            }\n     \
    \   }\n        //...\n```\n\nOUTPUT 15.10\n\n```c\nCorporate\n        Mark Michaelis\
    \ (Chief Computer Nerd)\nHuman Resources\n        Anne Beard (HR Director)\nEngineering\n\
    \        Michael Stokesbary (Senior Computer Wizard)\n        Brian Jones (Enterprise\
    \ Integration Guru)\n        Kevin Bost (Programmer Extraordinaire)\n        Thomas\
    \ Heavey (Software Architect)\nInformation Technology\n        Pat Dever (Enterprise\
    \ Architect)\nPhilanthropy\n        Eric Edmonds (Philanthropy Coordinator)\n\
    ```\n\n为了达到所需的结果，我们使用了 `System.Linq.Enumerable` 的 `GroupJoin()` 方法。其参数与 LISTING\
    \ 15.19 中的相同，除了最后选择的元组外。在 LISTING 15.19 中，Lambda 表达式的类型为 `Func<Department, IEnumerable<Employee>,\
    \ (long Id, string Name, IEnumerable<Employee> Employees)(long Id, string Name,\
    \ IEnumerable<Employee> Employees)`。注意，我们使用第二个类型参数（`IEnumerable<Employee>`）来将每个部门的员工集合投影到结果部门元组中；因此，结果集合中的每个部门都包含一个员工列表。\n\
    \n（熟悉 SQL 的读者会注意到，与 `Join()` 不同，`GroupJoin()` 没有对应的 SQL 等价项，因为 SQL 返回的数据是基于记录的，而不是层次结构的。）\n\
    \n### 进阶主题：使用 `GroupJoin()` 实现外连接\n\n早前的内连接是*等值连接*（equi-joins），因为它们基于对键的等值评估。只有当两个集合中都存在对象时，记录才会出现在结果集合中。然而，有时即使相应的对象不存在，你可能也创建一个记录。例如，与其仅仅因为营销部门没有员工而将其从最终部门列表中排除，不如将其包含在内并附带一个空的员工列表。为了实现这一点，我们通过结合使用\
    \ `GroupJoin()`、`SelectMany()` 以及 `DefaultIfEmpty()` 来执行左外连接。这在 LISTING 15.23\
    \ 和 OUTPUT 15.11 中得到了演示。\n\n### LISTING 15.23：使用 `GroupJoin()` 和 `SelectMany()`\
    \ 实现外连接\n\n```c\nusing System;\nusing System.Linq;\n// ...\n        Department[]\
    \ departments = CorporateData.Departments;\n        Employee[] employees = CorporateData.Employees;\n\
    \n        var items = departments.GroupJoin(\n            employees,\n       \
    \     department => department.Id,\n            employee => employee.DepartmentId,\n\
    \            (department, departmentEmployees) => new\n            {\n       \
    \         department.Id,\n                department.Name,\n                Employees\
    \ = departmentEmployees\n            }).SelectMany(\n                departmentRecord\
    \ =>\n                    departmentRecord.Employees.DefaultIfEmpty(),\n     \
    \           (departmentRecord, employee) => new\n                {\n         \
    \           departmentRecord.Id,\n                    departmentRecord.Name,\n\
    \                    departmentRecord.Employees\n                }).Distinct();\n\
    \n        foreach (var item in items)\n        {\n            Console.WriteLine(item.Name);\n\
    \            foreach (Employee employee in item.Employees)\n            {\n  \
    \              Console.WriteLine(\"\\t\" + employee);\n            }\n       \
    \ }\n        //...\n```\n\nOUTPUT 15.11\n\n```c\nCorporate\n        Mark Michaelis\
    \ (Chief Computer Nerd)\nHuman Resources\n        Anne Beard (HR Director)\nEngineering\n\
    \        Michael Stokesbary (Senior Computer Wizard)\n        Brian Jones (Enterprise\
    \ Integration Guru)\n        Kevin Bost (Programmer Extraordinaire)\n        Thomas\
    \ Heavey (Software Architect)\nInformation Technology\n        Pat Dever (Enterprise\
    \ Architect)\nPhilanthropy\n        Eric Edmonds (Philanthropy Coordinator)\n\
    Marketing\n```\n\n#### 调用 `SelectMany()`\n\n在有时，你可能会拥有集合的集合。LISTING 15.24 提供了此类场景的示例。`teams`\
    \ 数组包含两个团队，每个团队都有一个球员字符串数组。\n\n### LISTING 15.24：调用 `SelectMany()`\n\n```c\nusing\
    \ System;\nusing System.Collections.Generic;\nusing System.Linq;\n// ...\n   \
    \     (string Team, string[] Players)\n            [] worldCup2006Finalists =\
    \ new[]\n        {\n            (\n                TeamName: \"France\",\n   \
    \             Players: new string[]\n                {\n                    \"\
    Fabien Barthez\", \"Gregory Coupet\",\n                    \"Mickael Landreau\"\
    , \"Eric Abidal\",\n                    \"Jean-Alain Boumsong\", \"Pascal Chimbonda\"\
    ,\n                    \"William Gallas\", \"Gael Givet\",\n                 \
    \   \"Willy Sagnol\", \"Mikael Silvestre\",\n                    \"Lilian Thuram\"\
    , \"Djibril Dhoras\",\n                    \"Alou Diarra\", \"Claude Makelele\"\
    ,\n                    \"Zinedine Zidane\", \"Patrick Vieira\",\n            \
    \        \"Thierry Henry\", \"Franck Ribery\",\n                    \"Louis Saha\"\
    , \"Trezegu\",\n                    \"Sylvain Wiltord\",\n                }\n\
    \            ),\n            (\n                TeamName: \"Italy\",\n       \
    \         Players: new string[]\n                {\n                    \"Gianluigi\
    \ Buffon\", \"Angelo Peruzzi\",\n                    \"Marco Amelia\", \"Cristian\
    \ Zaccardo\",\n                    \"Alessandro Nesta\", \"Gianluca Zambrotta\"\
    ,\n                    \"Fabio Cannavaro\", \"Marco Materazzi\",\n           \
    \         \"Fabio Grosso\", \"Massimo Oddo\",\n                    \"Andrea Barzagli\"\
    , \"Andrea Pirlo\",\n                    \"Gennaro Gattuso\", \"Daniele De Rossi\"\
    ,\n                    \"Mauro Camoranesi\", \"Simone Perrotta\",\n          \
    \          \"Simone Barone\", \"Luca Toni\",\n                    \"Alessandro\
    \ Del Piero\", \"Francesco Totti\",\n                    \"Alberto Gilardino\"\
    , \"Filippo Inzaghi\",\n                    \"Vincenzo Iaquinta\",\n         \
    \       }\n            )\n        };\n\n        IEnumerable<string> players =\n\
    \            worldCup2006Finalists.SelectMany(\n                team => team.Players);\n\
    \n        Print(players);\n        //...\n```\n\n此列表的输出将每个球员的名字按照它们在代码中的顺序逐行显示。`Select()`\
    \ 和 `SelectMany()` 的区别在于，`Select()` 将返回两个项，对应于原始集合中的每个项。`Select()` 可能会从原始类型投影转换，但项目数量不会改变。例如，`teams.Select(team\
    \ => team.Players)` 将返回一个 `IEnumerable<string[]>`。\n\n相比之下，`SelectMany()` 会遍历\
    \ Lambda 表达式识别的每个项（之前由 `Select()` 选择的数组），并将每个项提取到一个新集合，该集合包含了子集合中所有元素的并。与其返回两个球员数组，`SelectMany()`\
    \ 合并每个选择的数组产生所有元素的单个集合。\n\n#### 更常用的查询运算符\n\nLISTING 15.25 显示了使用 `Enumerable`\
    \ 启用的一些简单 API 代码；OUTPUT 15.12 显示了结果。\n\n"
- fmt: "\n# LISTING 15.25: More `System.Linq.Enumerable` Method Calls\n\n```c\nusing\
    \ System;\nusing System.Collections.Generic;\nusing System.Linq;\n\npublic class\
    \ Program\n{\n    public static void Main()\n    {\n        IEnumerable<object>\
    \ stuff =\n            new object[] { new object(), 1, 3, 5, 7, 9,\n         \
    \       \"\\\"thing\\\"\", Guid.NewGuid() };\n        Print(\"Stuff: {0}\", stuff);\n\
    \n        IEnumerable<int> even = new int[] { 0, 2, 4, 6, 8 };\n        Print(\"\
    Even integers: {0}\", even);\n\n        IEnumerable<int> odd = stuff.OfType<int>();\
    \                     \n        Print(\"Odd integers: {0}\", odd);\n\n       \
    \ IEnumerable<int> numbers = even.Union(odd);                     \n        Print(\"\
    Union of odd and even: {0}\", numbers);                   \n\n        Print(\"\
    Union with even: {0}\", numbers.Union(even));             \n        Print(\"Concat\
    \ with odd: {0}\", numbers.Concat(odd));             \n        Print(\"Intersection\
    \ with even: {0}\",\n            numbers.Intersect(even));                   \
    \                \n        Print(\"Distinct: {0}\", numbers.Concat(odd).Distinct());\
    \         \n\n        if (!numbers.SequenceEqual(                            \
    \         \n            numbers.Concat(odd).Distinct()))                     \
    \       \n        {\n            throw new Exception(\"Unexpectedly unequal\"\
    );\n        }\n        else\n        {\n            Console.WriteLine(\n     \
    \           @\"Collection \"\"SequenceEquals\"\"\" +\n                $\" {nameof(numbers)}.Concat(odd).Distinct())\"\
    );\n        }\n        Print(\"Reverse: {0}\", numbers.Reverse());           \
    \            \n        Print(\"Average: {0}\", numbers.Average());           \
    \            \n        Print(\"Sum: {0}\", numbers.Sum());                   \
    \            \n        Print(\"Max: {0}\", numbers.Max());                   \
    \            \n        Print(\"Min: {0}\", numbers.Min());                   \
    \            \n    }\n\n    private static void Print<T>(\n            string\
    \ format, IEnumerable<T> items)\n            where T : notnull =>\n        Console.WriteLine(format,\
    \ string.Join(\n            \", \", items));\n    // ...\n}\n```\n\n# OUTPUT 15.12\n\
    \n```\nStuff: System.Object, 1, 3, 5, 7, 9, \"thing\"\n24c24a41-ee05-41b9-958e-50dd12e3981e\n\
    Even integers: 0, 2, 4, 6, 8\nOdd integers: 1, 3, 5, 7, 9\nUnion of odd and even:\
    \ 0, 2, 4, 6, 8, 1, 3, 5, 7, 9\nUnion with even: 0, 2, 4, 6, 8, 1, 3, 5, 7, 9\n\
    Concat with odd: 0, 2, 4, 6, 8, 1, 3, 5, 7, 9, 1, 3, 5, 7, 9\nIntersection with\
    \ even: 0, 2, 4, 6, 8\nDistinct: 0, 2, 4, 6, 8, 1, 3, 5, 7, 9\nCollection \"SequenceEquals\"\
    \ numbers.Concat(odd).Distinct())\nReverse: 9, 7, 5, 3, 1, 8, 6, 4, 2, 0\nAverage:\
    \ 4.5\nSum: 45\nMax: 9\nMin: 0\n```\n\nNone of the API calls in [LISTING 15.25](#ch15.html_list15_25)\
    \ requires a lambda expression. [TABLE 15.1](#ch15.html_ch15tab01) and [TABLE\
    \ 15.2](#ch15.html_ch15tab02) describe each method and provide an example. Included\
    \ in `System.Linq.Enumerable` is a collection of aggregate functions that enumerate\
    \ the collection and calculate a result (shown in [TABLE 15.2](#ch15.html_ch15tab02)).\
    \ `Count` is one example of an aggregate function already shown in the chapter.\n\
    \n# TABLE 15.1: Simpler Standard Query Operators\n\n![Images](graphics/15tab01.jpg)\n\
    \n# TABLE 15.2: Aggregate Functions on `System.Linq.Enumerable`\n\n![Images](graphics/15tab02.jpg)\n\
    \nNote that each method listed in [TABLE 15.1](#ch15.html_ch15tab01) and [TABLE\
    \ 15.2](#ch15.html_ch15tab02) will trigger deferred execution.\n\n## Advanced\
    \ Topic: `Queryable` Extensions for `IQueryable<T>`\n\nOne virtually identical\
    \ interface to `IEnumerable<T>` is `IQueryable<T>`. Because `IQueryable<T>` derives\
    \ from `IEnumerable<T>`, it has all the members of `IEnumerable<T>` that are declared\
    \ directly (e.g., `GetEnumerator()`). Extension methods are not inherited, however,\
    \ so `IQueryable<T>` doesn’t have any of the `Enumerable` extension methods. Nevertheless,\
    \ it does have a similar extending class called `System.Linq.Enumerable`.\n\n\
    ### Anonymous Types with LINQ\n\nTo support LINQ, an advanced API, only eight\
    \ new language enhancements were made.([9](#ch15.html_fn15_9)) Two of these enhancements\
    \ were anonymous types and implicit local variables. Even so, anonymous types\
    \ have essentially been eclipsed by the introduction of C# tuple syntax.([10](#ch15.html_fn15_10))\
    \ In fact, with the sixth edition of this book, all the LINQ examples that previously\
    \ leveraged anonymous types were updated to use tuples instead.\n\n(Note: Remaining\
    \ text continues with similar logic...)\n\nThe remainder of the chapter covers\
    \ the topic of anonymous types so that you can still make sense of the anonymous\
    \ type language feature if you are working with code prior to C# 7.0.\n\n####\
    \ Anonymous Types\n\nAnonymous types are data types that are declared by the compiler\
    \ rather than through the explicit class definitions introduced in [Chapter 6](#ch06.html_ch06).\
    \ As with anonymous functions, when the compiler sees an anonymous type, it does\
    \ the work to make that class for you and then lets you use it as though you had\
    \ declared it explicitly. [LISTING 15.26](#ch15.html_list15_26) shows such a declaration.\
    \ The corresponding output is shown in [OUTPUT 15.13](#ch15.html_op15_13).\n\n\
    # LISTING 15.26: Implicit Local Variables with Anonymous Types\n"
