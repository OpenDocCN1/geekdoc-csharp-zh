    18\"))\n                {\n                    // Side effects like this in a\
    \ predicate\n                    // are used here to demonstrate a\n         \
    \           // principle and should generally be\n                    // avoided\n\
    \                    Console.WriteLine(\"\\t\" + patent);\n                }\n\
    \                return result;\n            });\n\n        Console.WriteLine(\"\
    1\\. Patents prior to the 1900s are:\");\n        foreach(Patent patent in patents)\n\
    \        {\n        }\n\n        Console.WriteLine();\n        Console.WriteLine(\n\
    \            \"2\\. A second listing of patents prior to the 1900s:\");\n    \
    \    Console.WriteLine(\n            $@\"   There are { patents.Count()\n    \
    \            } patents prior to 1900.\");\n\n        Console.WriteLine();\n  \
    \      Console.WriteLine(\n            \"3\\. A third listing of patents prior\
    \ to the 1900s:\");\n        patents = patents.ToArray();\n        Console.Write(\"\
    \   There are \");\n        Console.WriteLine(\n            $\"{ patents.Count()\
    \ } patents prior to 1900.\");\n\n        //...\n```\n\n**OUTPUT 15.4**\n\n```\n\
