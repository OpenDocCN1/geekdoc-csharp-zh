  trans: "\n\nMicrosoft .NET Framework 提供了许多非泛型集合类和接口，但通常情况下，这些内容的存在仅仅是为了与泛型引入之前编写的代码兼容。泛型集合类型比非泛型集合更快，因为它们避免了装箱（boxing）开销，而且具有更高的类型安全性。因此，新代码几乎应该始终专门地使用泛型集合类型。在本书中，我们假设你主要使用泛型集合类型。\n\
    \n![Images](img/17fig00.jpg)\n\n# 更多集合接口\n\n我们已经看到集合是如何实现 `IEnumerable<T>` 的，这是允许对集合元素进行迭代的主要接口。还存在许多额外的接口由更复杂的集合实现。图\
    \ 17.1 显示了集合类实现的接口层级结构。\n\n这些接口提供了一种标准方法来执行常见任务，例如遍历、索引和计数集合中的元素。本节将检查这些接口（至少是所有的泛型接口），从图\
    \ 17.1 的底部开始向上进行。\n\n![Images](img/17fig01.jpg)\n\n**图 17.1：集合类层级结构**\n\n## `IList<T>`\
    \ 与 `IDictionary<TKey, TValue>`\n\n英语字典可以被看作是定义的集合。特定的定义可以通过查找其关联的“键”（key）即被定义的单词来快速访问。字典集合类同样是值的集合，其中每个值都可以通过使用其关联的唯一键来快速访问。然而，请注意，语言字典通常按键的字母顺序存储定义；字典类可能会选择这样做，但通常不会。字典集合最好被看作是键和关联值的*无序列表*，除非文档中专门说明它是有序的。同样，人们通常不会考虑查找“字典中的第六个定义”；字典类通常通过键提供索引，而不通过位置提供。\n\
    \n相比之下，列表按特定顺序存储值并通过位置访问它们。在某种意义上，列表只是字典的一种特例，其中“键”始终是一个整数，且“键集”始终是从零开始的连续非负整数集。尽管如此，这种差异足够大，值得拥有完全不同的类型来表示它。\n\
    \n因此，在选择集合类来解决某些数据存储或检索问题时，要查找的前两个接口是 `IList<T>` 和 `IDictionary<TKey, TValue>`。这些接口指示了集合类型是侧重于给定位置索引时检索值，还是侧重于给定关联键时检索值。\n\
    \n这两个接口都要求实现它们的类必须提供一个索引器（indexer）。在 `IList<T>` 的情况下，索引器的操作数对应于所检索元素的位置：索引器接收一个整数，并允许你访问列表中的第\
    \ *n* 个元素。在 `IDictionary<TKey, TValue>` 接口的情况下，索引器的操作数对应于与值相关的键，并允许你访问该值。\n\n\
    ## `ICollection<T>`\n\n`IList<T>` 和 `IDictionary<TKey, TValue>` 都实现了 `ICollection<T>`。一个既没有实现\
    \ `IList<T>` 没有实现 `IDictionary<TKey, TValue>` 的集合极可能实现 `ICollection<T>`（尽管不一定，因为集合也可以实现要求更低的\
    \ `IEnumerable` 或 `IEnumerable<T>`）。`ICollection<T>` 派自 `IEnumerable<T>` 并包含两个成员：`Count`\
    \ 和 `CopyTo()`。\n\n- `Count` 属性返回集合中的元素总数。起初，这似乎足够使用 `for` 循环遍历集合中的每个元素，但实际上，集合还需要支持通过索引进行检索，而\
    \ `ICollection<T>` 接口并不包含此（尽管 `IList<T>` 包含了）。\n- `CopyTo()` 方法提供了将集合转换为数组的能力。该方法包含一个\
    \ `index` 参数，以便你可以指定在目标数组中插入元素的位置。要使用该方法，你必须初始化目标数组具有足够的容量（从 `index` 开始），以容纳 `ICollection<T>`\
    \ 中的所有元素。\n\n# 主要集合类\n\n存在五类主要的集合类，它们在数据插入、存储和检索方式方面相互不同。每个泛型类都位于 `System.Collections.Generic`\
    \ 命名空间，而它们的非泛型等价类位于 `System.Collections` 命名空间。\n\n## 列表集合：`List<T>`\n\n`List<T>`\
    \ 类具有与数组类似的属性。区别在于这些类会随着元素数量的而自动扩展。（相比之下，数组的大小是固定的。）此外，列表可以通过显式调用 `TrimToSize()`\
    \ 或 `Capacity` 来收缩（参见图 17.2）。\n\n![Images](img/17fig02.jpg)\n\n**图 17.2：`List<>`\
    \ 类图**\n\n这些类被归为列表集合，其区别功能是每个元素都可以像数组一样通过索引单独访问。因此，你可以使用索引运算符在列表集合类中设置和访问元素，其中索引参数的值对应于元素在集合中的位置。代码\
    \ 17.1 显示了一个示例，输出 17.1 显示了结果。\n\n**代码 17.1：使用 `List<T>`**\n\n```\nusing System;\n\
    using System.Collections.Generic;\n\npublic class Program\n{\n    public static\
    \ void Main()\n    {\n        List<string> list = new List<string>\n        {\
    \ \"Sneezy\", \"Happy\", \"Dopey\", \"Doc\", \"Sleepy\", \"Bashful\", \"Grumpy\"\
    \ };\n\n        list.Sort();\n        Console.WriteLine($\"In alphabetical order\
    \ {list[0]} is the first dwarf while {list[¹]} is the last.\");\n\n        list.Remove(\"\
    Grumpy\");\n    }\n}\n```\n\n**输出 17.1**\n\n```\nIn alphabetical order Bashful\
    \ is the first dwarf while Sneezy is the last.\n```\n\nC# 是基于零索引的；因此，代码 17.1 中的索引\
    \ 0 对应于第一个元素，索引 6 表示第七个元素。通过索引检索元素不涉及搜索。相反，它涉及到到内存某个位置的快速且简单的“跳转”操作。\n\n`List<T>`\
    \ 是有序集合；`Add()` 方法将给定项目添加到列表末尾。在代码 17.1 调用 `Sort()` 之前，`\"Sneezy\"` 是第一个而`\"Grumpy\"\
    ` 是最后一个；调用之后，列表按字母顺序排序，而不是按照添加项的顺序排序。某些集合会在添加元素时自动排序，但 `List<T>` 并不是其中之一；为了对元素进行排序，需要显式调用\
    \ `Sort()`。\n\n要移除元素，你可以使用 `Remove()` 或 `RemoveAt()` 方法分别移除给定的元素或移除特定索引处的元素。\n\
    \n## 进阶主题：自定义集合排序\n\n你可能奇奇过代码 17.1 中的 `List<T>.Sort()` 方法是如何知道将列表元素按字母顺序排序的。`string`\
    \ 类型实现了 `IComparable<string>` 接口，该接口有一个方法 `CompareTo()`。它返回一个整数，指示传递的元素大于、小于还是等于当前元素。如果元素类型实现了泛型\
    \ `IComparable<T>` 接口（或非泛型的 `IComparable` 接口），排序算法默认将使用它来确定排序顺序。\n\n"
- fmt: "\nBut what if either the element type does not implement `IComparable<T>`\
    \ or the default logic for comparing two things does not meet your needs? To specify\
    \ a nondefault sort order, you can call the overload of `List<T>.Sort()`, which\
    \ takes `IComparer<T>` as an argument.\n\nThe difference between `IComparable<T>`\
    \ and `IComparer<T>` is subtle but important. The first interface means, “I know\
    \ how to compare *myself* to another instance of my type.” The latter means, “I\
    \ know how to compare *two things* of a given type.”\n\nThe `IComparer<T>` interface\
    \ is typically used when there are many different possible ways of sorting a data\
    \ type and none is obviously the best. For example, you might have a collection\
    \ of `Contact` objects that you sometimes want to sort by name, by location, by\
    \ birthday, by geographic region, or by any number of other possibilities. Rather\
    \ than choosing a sorting strategy and making the `Contact` class implement `IComparable<Contact>`,\
    \ it might be wiser to create several different classes that implement `IComparer<Contact>`.\
    \ [LISTING 17.2](#ch17.html_list17_2) shows a sample implementation of a `LastName`,\
    \ `FirstName` comparison.\n\n**LISTING 17.2: Implementing `IComparer<T>`**\n\n\
    ```c\nusing System;\nusing System.Collections.Generic;\n// ...\npublic class Contact\n\
    {\n    public string FirstName { get; private set; }\n    public string LastName\
    \ { get; private set; }\n\n    public Contact(string firstName, string lastName)\n\
    \    {\n        this.FirstName = firstName;\n        this.LastName = lastName;\n\
    \    }\n}\npublic class NameComparison : IComparer<Contact>\n{\n    public int\
    \ Compare(Contact? x, Contact? y)\n    {\n        if(Object.ReferenceEquals(x,\
    \ y))\n            return 0;\n        if(x == null)\n            return 1;\n \
    \       if(y == null)\n            return -1;\n        int result = StringCompare(x.LastName,\
    \ y.LastName);\n        if(result == 0)\n            result = StringCompare(x.FirstName,\
    \ y.FirstName);\n        return result;\n    }\n\n    private static int StringCompare(string?\
    \ x, string? y)\n    {\n        if(Object.ReferenceEquals(x, y))\n           \
    \ return 0;\n        if(x == null)\n            return 1;\n        if(y == null)\n\
    \            return -1;\n        return x.CompareTo(y);\n    }\n}\n```\n\nTo sort\
    \ a `List<Contact>` by last name and then first name, you can call `contactList.Sort(new\
    \ NameComparer())`.\n\n### Total Ordering\n\nYou are required to produce a **total\
    \ order** when implementing `IComparable<T>` or `IComparer<T>`. Your implementation\
    \ of `CompareTo` must provide a fully consistent ordering for any possible pair\
    \ of items. This ordering is required to have a number of basic characteristics.\
    \ For example, every element is required to be considered equal to itself. If\
    \ an element `X` is considered to be equal to element `Y`, and element `Y` is\
    \ considered to be equal to element `Z`, then all three elements `X`, `Y`, and\
    \ `Z` must be considered equal to one another. If an element `X` is considered\
    \ to be greater than `Y`, `Y` must be considered to be less than `X`. And there\
    \ must be no “transitivity paradoxes”—that is, you cannot have `X` greater than\
    \ `Y`, `Y` greater than `Z`, and `Z` greater than `X`. If you fail to provide\
    \ a total ordering, the action of the sort algorithm is undefined; it may produce\
    \ a crazy ordering, it may crash, it may go into an infinite loop, and so on.\n\
    \nNotice, for example, how the comparer in [LISTING 17.2](#ch17.html_list17_2)\
    \ ensures a total order, even if the arguments are `null` references. It would\
    \ not be legal to say, “If either element is `null`, then return zero,” for example,\
    \ because then two non-`null` things could be equal to `null` but not equal to\
    \ each other.\n\n#### Guidelines\n\n**DO ensure that custom comparison logic produces\
    \ a consistent “total order.”**\n\n### Searching a `List<T>`\n\nTo search `List<T>`\
    \ for a particular element, you use the `Contains()`, `IndexOf()`, `LastIndexOf()`,\
    \ and `BinarySearch()` methods. The first three methods search through the array,\
    \ starting at the first element (or the last element for `LastIndexOf()`), and\
    \ examine each element until the desired one is found. The execution time for\
    \ these algorithms is proportional to the number of elements searched before a\
    \ hit occurs. (Be aware that the collection classes do not require that all the\
    \ elements within the collection are unique. If two or more elements in the collection\
    \ are the same, `IndexOf()` returns the first index and `LastIndexOf()` returns\
    \ the last index.)\n\n`BinarySearch()` uses a much faster binary search algorithm\
    \ but requires that the elements be sorted. A useful feature of the `BinarySearch()`\
    \ method is that if the element is not found, a negative integer is returned.\
    \ The bitwise complement (`~`) of this value is the index of the next element\
    \ larger than the element being sought, or the total element count if there is\
    \ no greater value. This provides a convenient means to insert new values into\
    \ the list at the specific location so as to maintain sorting. [LISTING 17.3](#ch17.html_list17_3)\
    \ provides an example.\n\n**LISTING 17.3: Using the Bitwise Complement of the\
    \ `BinarySearch()` Result**\n\n```csharp\nusing System;\nusing System.Collections.Generic;\n\
    \npublic class Program\n{\n    public static void Main()\n    {\n        List<string>\
    \ list = new List<string>();\n        int search;\n\n        list.Add(\"public\"\
    );\n        list.Add(\"protected\");\n        list.Add(\"private\");\n\n     \
    \   list.Sort();\n\n        search = list.BinarySearch(\"protected internal\"\
    );\n        if(search < 0)\n        {\n            list.Insert(~search, \"protected\
    \ internal\");\n        }\n\n        foreach(string accessModifier in list)\n\
    \        {\n            Console.WriteLine(accessModifier);\n        }\n    }\n\
    }\n```\n\nBeware that if the list is not first sorted, this code will not necessarily\
    \ find an element, even if it is in the list. The results of [LISTING 17.3](#ch17.html_list17_3)\
    \ appear in [OUTPUT 17.2](#ch17.html_op17_2).\n\n**OUTPUT 17.2**\n\n```\nprivate\n\
    protected\nprotected internal\npublic\n```\n\n### Advanced Topic: Finding Multiple\
    \ Items with `FindAll()`\n\nSometimes you must find multiple items within a list,\
    \ and your search criteria are more complex than merely looking for specific values.\
    \ To support this, `System.Collections.Generic.List<T>` includes a `FindAll()`\
    \ method. `FindAll()` takes a parameter of `Predicate<T>`, which is a delegate\
    \ (a reference to a method). [LISTING 17.4](#ch17.html_list17_4) demonstrates\
    \ how to use the `FindAll()` method.\n\n**LISTING 17.4: Demonstrating `FindAll()`\
    \ and Its Predicate Parameter**\n\n```csharp\nusing System;\nusing System.Collections.Generic;\n\
    \npublic class Program\n{\n    public static void Main()\n    {\n        List<int>\
    \ list = new List<int>();\n        list.Add(1);\n        list.Add(2);\n      \
    \  list.Add(3);\n        list.Add(2);\n\n        List<int> results = list.FindAll(Even);\
    \                    \n\n        foreach (int number in results)             \
    \               \n        {\n            Console.WriteLine(number);\n        }\n\
    \    }\n    public static bool Even(int value) =>\n        (value % 2) == 0;\n\
    }\n```\n\nIn [LISTING 17.4](#ch17.html_list17_4)’s call to `FindAll()`, you pass\
    \ a delegate instance, `Even()`. This method returns `true` when the integer argument\
    \ value is even. `FindAll()` takes the delegate instance and calls into `Even()`\
    \ for each item within the list. Each time the return value is `true`, it adds\
    \ it to a new `List<T>` instance and then returns this instance once it has checked\
    \ each item within `list`. A complete discussion of delegates occurs in [Chapter\
    \ 13](#ch13.html_ch13).\n\n[2](#ch17.html_fn17_2a). This listing uses C# 2.0’s\
    \ delegate type inferencing.\n\n#### Dictionary Collections: `Dictionary<TKey,\
    \ TValue>`\n"
  raw: "But what if either the element type does not implement `IComparable<T>` or\
    \ the default logic for comparing two things does not meet your needs? To specify\
    \ a nondefault sort order, you can call the overload of `List<T>.Sort()`, which\
    \ takes `IComparer<T>` as an argument.\n\nThe difference between `IComparable<T>`\
    \ and `IComparer<T>` is subtle but important. The first interface means, “I know\
    \ how to compare *myself* to another instance of my type.” The latter means, “I\
    \ know how to compare *two things* of a given type.”\n\nThe `IComparer<T>` interface\
    \ is typically used when there are many different possible ways of sorting a data\
    \ type and none is obviously the best. For example, you might have a collection\
    \ of `Contact` objects that you sometimes want to sort by name, by location, by\
    \ birthday, by geographic region, or by any number of other possibilities. Rather\
    \ than choosing a sorting strategy and making the `Contact` class implement `IComparable<Contact>`,\
    \ it might be wiser to create several different classes that implement `IComparer<Contact>`.\
    \ [LISTING 17.2](#ch17.html_list17_2) shows a sample implementation of a `LastName`,\
    \ `FirstName` comparison.\n\n**LISTING 17.2: Implementing `IComparer<T>`**\n\n\
    ```\nusing System;\nusing System.Collections.Generic;\n// ...\npublic class Contact\n\
    {\n    public string FirstName { get; private set; }\n    public string LastName\
    \ { get; private set; }\n\n    public Contact(string firstName, string lastName)\n\
    \    {\n        this.FirstName = firstName;\n        this.LastName = lastName;\n\
    \    }\n}\npublic class NameComparison : IComparer<Contact>\n{\n    public int\
    \ Compare(Contact? x, Contact? y)\n    {\n        if(Object.ReferenceEquals(x,\
    \ y))\n            return 0;\n        if(x == null)\n            return 1;\n \
    \       if(y == null)\n            return -1;\n        int result = StringCompare(x.LastName,\
    \ y.LastName);\n        if(result == 0)\n            result = StringCompare(x.FirstName,\
    \ y.FirstName);\n        return result;\n    }\n\n    private static int StringCompare(string?\
    \ x, string? y)\n    {\n        if(Object.ReferenceEquals(x, y))\n           \
    \ return 0;\n        if(x == null)\n            return 1;\n        if(y == null)\n\
    \            return -1;\n        return x.CompareTo(y);\n    }\n}\n```\n\nTo sort\
    \ a `List<Contact>` by last name and then first name, you can call `contactList.Sort(new\
    \ NameComparer())`.\n\n#### Total Ordering\n\nYou are required to produce a **total\
    \ order** when implementing `IComparable<T>` or `IComparer<T>`. Your implementation\
    \ of `CompareTo` must provide a fully consistent ordering for any possible pair\
    \ of items. This ordering is required to have a number of basic characteristics.\
    \ For example, every element is required to be considered equal to itself. If\
    \ an element X is considered to be equal to element Y, and element Y is considered\
    \ to be equal to element Z, then all three elements X, Y, and Z must be considered\
    \ equal to one another. If an element X is considered to be greater than Y, Y\
    \ must be considered to be less than X. And there must be no “transitivity paradoxes”—that\
    \ is, you cannot have X greater than Y, Y greater than Z, and Z greater than X.\
    \ If you fail to provide a total ordering, the action of the sort algorithm is\
    \ undefined; it may produce a crazy ordering, it may crash, it may go into an\
    \ infinite loop, and so on.\n\nNotice, for example, how the comparer in [LISTING\
    \ 17.2](#ch17.html_list17_2) ensures a total order, even if the arguments are\
    \ `null` references. It would not be legal to say, “If either element is `null`,\
    \ then return zero,” for example, because then two non-`null` things could be\
    \ equal to `null` but not equal to each other.\n\n**Guidelines**\n\n**DO ensure\
    \ that custom comparison logic produces a consistent “total order.”**\n\n####\
    \ Searching a `List<T>`\n\nTo search `List<T>` for a particular element, you use\
    \ the `Contains()`, `IndexOf()`, `LastIndexOf()`, and `BinarySearch()` methods.\
    \ The first three methods search through the array, starting at the first element\
    \ (or the last element for `LastIndexOf()`), and examine each element until the\
    \ desired one is found. The execution time for these algorithms is proportional\
    \ to the number of elements searched before a hit occurs. (Be aware that the collection\
    \ classes do not require that all the elements within the collection are unique.\
    \ If two or more elements in the collection are the same, `IndexOf()` returns\
    \ the first index and `LastIndexOf()` returns the last index.)\n\n`BinarySearch()`\
    \ uses a much faster binary search algorithm but requires that the elements be\
    \ sorted. A useful feature of the `BinarySearch()` method is that if the element\
    \ is not found, a negative integer is returned. The bitwise complement (`~`) of\
    \ this value is the index of the next element larger than the element being sought,\
    \ or the total element count if there is no greater value. This provides a convenient\
    \ means to insert new values into the list at the specific location so as to maintain\
    \ sorting. [LISTING 17.3](#ch17.html_list17_3) provides an example.\n\n**LISTING\
    \ 17.3: Using the Bitwise Complement of the `BinarySearch()` Result**\n\n```\n\
    using System;\nusing System.Collections.Generic;\n\npublic class Program\n{\n\
    \    public static void Main()\n    {\n        List<string> list = new List<string>();\n\
    \        int search;\n\n        list.Add(\"public\");\n        list.Add(\"protected\"\
    );\n        list.Add(\"private\");\n\n        list.Sort();\n\n        search =\
    \ list.BinarySearch(\"protected internal\");\n        if(search < 0)\n       \
    \ {\n            list.Insert(~search, \"protected internal\");\n        }\n\n\
    \        foreach(string accessModifier in list)\n        {\n            Console.WriteLine(accessModifier);\n\
    \        }\n    }\n}\n```\n\nBeware that if the list is not first sorted, this\
    \ code will not necessarily find an element, even if it is in the list. The results\
    \ of [LISTING 17.3](#ch17.html_list17_3) appear in [OUTPUT 17.2](#ch17.html_op17_2).\n\
    \n**OUTPUT 17.2**\n\n```\nprivate\nprotected\nprotected internal\npublic\n```\n\
    \n**Advanced Topic: Finding Multiple Items with `FindAll()`**\n\nSometimes you\
    \ must find multiple items within a list, and your search criteria are more complex\
    \ than merely looking for specific values. To support this scenario, `System.Collections.Generic.List<T>`\
    \ includes a `FindAll()` method. `FindAll()` takes a parameter of type `Predicate<T>`,\
    \ which is a delegate (a reference to a method). [LISTING 17.4](#ch17.html_list17_4)\
    \ demonstrates how to use the `FindAll()` method.\n\n**LISTING 17.4: Demonstrating\
    \ `FindAll()` and Its Predicate Parameter**\n\n```\nusing System;\nusing System.Collections.Generic;\n\
    \npublic class Program\n{\n    public static void Main()\n    {\n        List<int>\
    \ list = new List<int>();\n        list.Add(1);\n        list.Add(2);\n      \
    \  list.Add(3);\n        list.Add(2);\n\n        List<int> results = list.FindAll(Even);\
    \                    \n\n        foreach (int number in results)             \
    \               \n        {\n            Console.WriteLine(number);\n        }\n\
    \    }\n    public static bool Even(int value) =>\n        (value % 2) == 0;\n\
    }\n```\n\nIn [LISTING 17.4](#ch17.html_list17_4)’s call to `FindAll()`, you pass\
    \ a delegate instance, `Even()`. This method returns `true` when the integer argument\
    \ value is even. `FindAll()` takes the delegate instance and calls into `Even()`\
    \ for each item within the list.^([2](#ch17.html_fn17_2)) Each time the return\
    \ value is `true`, it adds it to a new `List<T>` instance and then returns this\
    \ instance once it has checked each item within `list`. A complete discussion\
    \ of delegates occurs in [Chapter 13](#ch13.html_ch13).\n\n[2](#ch17.html_fn17_2a).\
    \ This listing uses C# 2.0’s delegate type inferencing.\n\n#### Dictionary Collections:\
    \ `Dictionary<TKey, TValue>`"
