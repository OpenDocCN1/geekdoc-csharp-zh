  trans: "\n\n```sharp\n// JFK\nvar jfkFamilyTree = new BinaryTree<string>(\n    \"\
    John Fitzgerald Kennedy\")\n{\n    SubItems = new Pair<BinaryTree<string>>(\n\
    \        new BinaryTree<string>(\"Joseph Patrick Kennedy\")\n        {\n     \
    \       // Grandparents (Father's side)\n            SubItems = new Pair<BinaryTree<string>>(\n\
    \                new BinaryTree<string>(\"Patrick Joseph Kennedy\"),\n       \
    \         new BinaryTree<string>(\"Mary Augusta Hickey\"))\n        },\n     \
    \   new BinaryTree<string>(\"Rose Elizabeth Fitzgerald\")\n        {\n       \
    \     // Grandparents (Mother's side)\n            SubItems = new Pair<BinaryTree<string>>(\n\
    \                new BinaryTree<string>(\"John Francis Fitzgerald\"),\n      \
    \          new BinaryTree<string>(\"Mary Josephine Hannon\"))\n        })\n};\n\
    \nforeach (string name in jfkFamilyTree)                                 \n{ \
    \                                                                    \n    Console.WriteLine(name);\
    \                                          \n} \n```\n\n**输出输出 17.6**\n\n```\n\
    John Fitzgerald Kennedy\nJoseph Patrick Kennedy\nPatrick Joseph Kennedy\nMary\
    \ Augusta Hickey\nRose Elizabeth Fitzgerald\nJohn Francis Fitzgerald\nMary Josephine\
    \ Hannon\n```\n\n### 进阶主题：递归迭代器的危险\n\n`代码列表 17.16` 中的代码在遍历二叉树时会创建新的“嵌套”迭代器。因此，当值由某个节点产生时，该值由该节点的迭代器产生，然后由其父节点的迭代器产生，再由其父节点的迭代器产生，以此此类推，直到最终由根节点的迭代器产生给原始循环。深度为\
    \ *n* 级的值实际上必须通过 *n* 个迭代器的链向上传递其值。如果二叉树相对浅，这通常不是问题；然而，不平衡的二叉树可能非常深，因此递归迭代的开销很大。\n\
    \n### 指南\n\n**在遍历可能存在深层的数据结构时，考虑使用非递归算法。**\n\n### 进阶/初学者主题：`struct` 对比 `class`\n\
    \n将 `Pair<T>` 定义为 `struct` 而不是 `class` 的一个有趣副作用是：`SubItems.First` 和 `SubItems.Second`\
    \ 无法直接赋值，即使设置器（setter）是公共的也是如此。如果你将设置器修改为公共，以下代码将产生编译错误，指示 `SubItems` 无法修改，“因为它不是一个变量”：\n\
    \n```sharp\njfkFamilyTree.SubItems.First =\nnew BinaryTree<string>(\n\"Joseph\
    \ Patrick Kennedy\");\n```\n\n问题在于 `SubItems` 是一个类型为 `Pair<T>` 的属性，这是一个 `struct`。因此，当属性返回值时，会创建一个\
    \ `SubItems` 的副本，在语句结束时立即丢失的副本上分配 `First` 将具有误导性。幸运的是，C# 编译器阻止了这种错误。\n\n为了解决这个问题，不要为\
    \ `First` 赋值（参见 `代码列表 17.17` 中的方法），为 `Pair<T>` 使用 `class` 而不是 `struct`，不要创建 `SubItems`\
    \ 属性而是使用字段，或者在 `BinaryTree<T>` 中提供直接访问 `SubItems` 成员的属性。\n\n#### 取消后续迭代：`yield\
    \ break`\n\n有时，你可能想要取消后续迭代。你可以通过包含一个 `if` 语句来实现，使得代码中的后续语句不再执行。然而，你也可以使用 `yield\
    \ break` 来使 `MoveNext()` 返回 `false`，让控制权立即返回调用者并结束循环。`代码列表 17.18` 展示了此类方法的示例。\n\
    \n**代码列表 17.18：通过 `yield break` 退出迭代**\n\n```sharp\npublic System.Collections.Generic.IEnumerable<T>\
    \ GetNotNullEnumerator()\n{\n    if ((First == null) || (Second == null))    \
    \                         \n    {                                            \
    \                        \n        yield break;                              \
    \                       \n    }                                              \
    \                      \n    yield return Second;\n    yield return First;\n}\n\
    ```\n\n如果 `Pair<T>` 类中的元素任为 `null`，则该方法会取消迭代。\n\n`yield break` 语句类似于在确定没有工作要做时在函数顶部放置\
    \ `return` 语句。这是一种在不将所有剩余代码包裹在 `if` 块中的情况下退出后续迭代的方法。因此，它允许多次退出。请谨慎使用，因为对代码的随意阅读可能会忽略早退的情况。\n\
    \n### 进阶主题：迭代器的工作原理\n\n当 C# 编译器遇到迭代器时，它会将代码展开为对应枚举器设计模式的适当 CIL。在生成的代码中，C# 编译器首先创建一个嵌套私有类来实现实现\
    \ `IEnumerator<T>` 接口，以及它的 `Current` 属性和 `MoveNext()` 方法。`Current` 属性返回与迭代器返回类型对应的类型。在\
    \ `Pair<T>` 的 `代码列表 17.14` 中，迭代器返回 `T` 类型。C# 编译器检查迭代器内部包含的代码，并在 `MoveNext` 方法和\
    \ `Current` 属性内部创建必要的代码以模拟其行为。对于 `Pair<T>` 迭代器，C# 编译器生成大致等效的代码（参见 `代码列表 17.19`）。\n\
    \n**代码列表 17.19：编译器生成的 C# 等效代码**\n\n```sharp\nusing System;\nusing System.Collections;\n\
    using System.Collections.Generic;\n// ...\n    [NullableContext(1)]\n    [Nullable(0)]\n\
    \    public struct Pair<T> : IPair<T>, IEnumerable<T>\n    {\n        public Pair(T\
    \ first, T second)\n        {\n            First = first;\n            Second\
    \ = second;\n        }\n\n        public T First { get; }\n\n        public T\
    \ Second { get; }\n\n        public T this[PairItem index]\n        {\n      \
    \      get\n            {\n                PairItem pairItem = index;\n      \
    \          PairItem pairItem2 = pairItem;\n                T result;\n       \
    \         if (pairItem2 != PairItem.First)\n                {\n              \
    \      if (pairItem2 != PairItem.Second)\n                    {\n            \
    \            throw new NotImplementedException(\n                            string.Format(\n\
    \                                \"The enum {0} has not been implemented\", \n\
    \                                index.ToString()));\n                    }\n\
    \                    result = Second;\n                }\n                else\n\
    \                {\n                    result = First;\n                }\n \
    \               return result;\n            }\n        }\n\n        public IEnumerator<T>\
    \ GetEnumerator()\n        {\n            yield return First;\n            yield\
    \ return Second;\n            yield break;\n        }\n\n        IEnumerator IEnumerable.GetEnumerator()\n\
    \        {\n            return GetEnumerator();\n        }\n    }\n}\n```\n\n\
    由于编译器获取 `yield return` 语句并生成类似于你可能会手动编写的类，因此 C# 中的迭代器表现出与手动实现枚举器设计模式的类相同的性能特性。虽然性能没有提升，但程序员生产效率的提高是巨大的。\n\
    \n### 进阶主题：上下文关键字\n\n许多 C# 关键字是“保留”的，除非带有 `@` 符号，否则不能作为标识符。`yield` 关键字是一个上下文关键字，而不是保留关键字；因此，声明一个名为\
    \ `yield` 的局部变量是合法的（尽管这令人困惑）。事实上，在 C# 1.0 版本之后添加的所有关键字都是上下文关键字；这有助于防止在升级现有程序以用新版本时发生意外破坏。\n\
    \n"
- fmt: "\nHad the C# designers chosen to use `yield value;` instead of `yield return\
    \ value;` as the syntax for an iterator to yield, a possible ambiguity would have\
    \ been introduced: `yield(1+2);` now might be yielding a value, or it might be\
    \ passing the value as an argument to a method called `yield`.\n\nSince it was\
    \ previously never legal to have the identifier `yield` appear immediately before\
    \ `return` or `break`, the C# compiler knows that such a usage of `yield` must\
    \ be as a keyword, not an identifier.\n\n## Creating Multiple Iterators in a Single\
    \ Class\n\nPrevious iterator examples implemented `IEnumerable<T>.GetEnumerator()`,\
    \ the method that `foreach` seeks implicitly. Sometimes you might want different\
    \ iteration sequences, such as iterating in reverse, filtering the results, or\
    \ iterating over an object projection other than the default. You can declare\
    \ additional iterators in the class by encapsulating them within properties or\
    \ methods that return `IEnumerable<T>` or `IEnumerable`. If you want to iterate\
    \ over the elements of `Pair<T>` in reverse, for example, you could provide a\
    \ `GetReverseEnumerator()` method, as shown in [LISTING 17.20](#ch17.html_list17_20).\n\
    \n### LISTING 17.20: Using `yield return` in a Method That Returns `IEnumerable<T>`\n\
    \n```c\npublic struct Pair<T> : IPair<T>, IEnumerable<T>\n{\n    // ...\n    public\
    \ IEnumerable<T> GetReverseEnumerator()                        \n    {\n     \
    \   yield return Second;\n        yield return First;\n    }\n    // ...\n   \
    \ public static void Main()\n    {\n        var game = new Pair<string>(\"Redskins\"\
    , \"Eagles\");\n        foreach (string name in game.GetReverseEnumerator()) \
    \           \n        {\n            Console.WriteLine(name);\n        }\n   \
    \ }\n}\n```\n\nNote that you return `IEnumerable<T>`, not `IEnumerator<T>`. This\
    \ is different from `IEnumerable<T>.GetEnumerator()`, which returns `IEnumerator<T>`.\
    \ The code in `Main()` demonstrates how to call `GetReverseEnumerator()` using\
    \ a `foreach` loop.\n\n## yield Statement Requirements\n\nYou can use the `yield\
    \ return` statement only in members that return an `IEnumerator<T>` or `IEnumerable<T>`\
    \ type, or their nongeneric equivalents. Members whose bodies include a `yield\
    \ return` statement may not have a simple `return`. If the member uses the `yield\
    \ return` statement, the C# compiler generates the necessary code to maintain\
    \ the state of the iterator. In contrast, if the member uses the `return` statement\
    \ instead of `yield return`, the programmer is responsible for maintaining his\
    \ own state machine and returning an instance of one of the iterator interfaces.\
    \ Further, just as all code paths in a method with a return type must contain\
    \ a `return` statement accompanied by a value (assuming they don’t throw an exception),\
    \ so all code paths in an iterator must contain a `yield return` statement if\
    \ they are to return any data.\n\nThe following additional restrictions on the\
    \ `yield` statement result in compiler errors if they are violated:\n\n- The `yield`\
    \ statement may appear only inside a method, a user-defined operator, or the `get`\
    \ accessor of an indexer or property. The member must not take any `ref` or `out`\
    \ parameter.\n- The `yield` statement may not appear anywhere inside an anonymous\
    \ method or lambda expression (see [Chapter 13](#ch13.html_ch13)).\n- The `yield`\
    \ statement may not appear inside the `catch` and `finally` clauses of the `try`\
    \ statement. Furthermore, a `yield` statement may appear in a try block only if\
    \ there is no catch block.\n\n## Summary\n\nIn this chapter, we reviewed the key\
    \ collection classes and considered how they fit into categories according to\
    \ the interfaces that they support. Each class focuses on inserting items into\
    \ and retrieving items from the collection, using mechanisms such as by key, by\
    \ index, or by FIFO or LIFO, to name a few examples. We also explored how to iterate\
    \ over the collection. In addition, the chapter explained how to define custom\
    \ collections with custom iterators for enumerating through items within the collection\
    \ (Iterators involve a contextual keyword, `yield`, that C# uses to generate the\
    \ underlying CIL code that implements the iterator pattern used by the `foreach`\
    \ loop.)\n\nIn [Chapter 18](#ch18.html_ch18), we explore reflection, a topic briefly\
    \ touched on earlier, albeit with little to no explanation. Reflection allows\
    \ us to examine the structure of a type within CIL code at runtime.\n\n## 18.\
    \ Reflection, Attributes, and Dynamic Programming [This content is currently in\
    \ development.]\n\n**This content is currently in development.**\n\n## 19. Introducing\
    \ Multithreading [This content is currently in development.]\n\n**This content\
    \ is currently in development.**\n\n## 20. Programming the Task Based Asynchronous\
    \ Pattern [This content is currently in development.]\n\n**This content is currently\
    \ in development.**\n\n## 21. Iterating in Parallel\n\nIn [Chapter 19](#ch19.html_ch19),\
    \ we mentioned how the cost of computation is falling, resulting in computers\
    \ with faster CPUs, an increased number of CPUs, and an increased number of cores\
    \ in each CPU. Collectively, these trends are making it increasingly more economical\
    \ to boost the execution parallelization to take advantage of the increased computing\
    \ power. In this chapter, we look at executing loops in parallel, which is one\
    \ of the easiest ways to take advantage of the increased computing capability.\
    \ Much of the chapter consists of Beginner and Advanced Topic blocks.\n\n![Images](graphics/21fig00.jpg)\n\
