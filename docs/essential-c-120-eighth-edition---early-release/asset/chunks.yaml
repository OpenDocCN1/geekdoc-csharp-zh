    \ 17.9](#ch17.html_list17_9) shows an example using `Pair<T>`.\n\n**LISTING 17.9:\
    \ Defining an Indexer**\n\n```\ninterface IPair<T>\n{\n    T First { get; }\n\
    \    T Second { get; }\n    T this[PairItem index] { get; }                  \
    \              \n}\n\npublic enum PairItem\n{\n    First,\n    Second\n}\n\npublic\
    \ struct Pair<T> : IPair<T>\n{\n    public Pair(T first, T second)\n    {\n  \
    \      First = first;\n        Second = second;\n    }\n\n    public T First {\
    \ get; }\n    public T Second { get; }\n\n    public T this[PairItem index]  \
