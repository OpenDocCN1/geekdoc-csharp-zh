  trans: "\n使用查询表达式符号编写的查询表现出延迟执行特性，就像第 15 章中编写的查询一样。再次考虑列表 16.1 中将查询对象赋值给变量 `selection`\
    \ 的操作。查询的创建和对变量的赋值并没有执行查询；它们仅仅是构建了一个表示该查询的对象。在创建查询对象时，并没有调用 `word.Contains(\"\
    *\")` 方法。相反，查询表达式保存了选择标准，以便在遍历由 `selection` 变量所标识的集合时使用。\n\n为了演示这一点，请考虑列表 16.4\
    \ 和相应的输出(输出 16.3)。\n\n**列表 16.4: 延迟执行与查询表达式（示例 1）**\n\n```c\nusing System;\nusing\
    \ System.Collections.Generic;\nusing System.Linq;\n// ...\n    private static\
    \ void ShowContextualKeywords2()\n    {\n        IEnumerable<string> selection\
    \ = from word in CSharp.Keywords\n                                        where\
    \ IsKeyword(word)\n                                        select word;\n    \
    \    Console.WriteLine(\"Query created.\");\n        foreach(string keyword in\
    \ selection)\n        {\n            // 这里没有输出空格\n            Console.Write(keyword);\n\
    \        }\n    }\n\n    // 控制台输出的副作用包含\n    // 在谓词中以演示延迟执行；\n    // 带有副作用的谓词在生产环境\n\
    \    // 代码中是糟糕的做法\n    private static bool IsKeyword(string word)\n    {\n   \
    \     if(word.Contains('*'))\n        {\n            Console.Write(\" \");\n \
    \           return true;\n        }\n        else\n        {\n            return\
    \ false;\n        }\n    }\n    //...\n```\n\n**输出 16.3**\n\n```\nQuery created.\n\
    \ add* alias* ascending* async* await* by* descending* dynamic*\nequals* from*\
    \ get* global* group* into* join* let* nameof* nonnull*\non* orderby* partial*\
    \ remove* select* set* value* var* where* when* yiel\nd*\n```\n\n在列表 16.4 中，`foreach`\
    \ 循环内部没有输出空格。执行谓词 `IsKeyword()` 时打印空格的副作用发生在查询被迭代时——而不是在查询被创建时。因此，尽管 `selection`\
    \ 是一个集合（毕竟它的类型是 `IEnumerable<T>`），但在赋值时刻，`from` 子句之后的所有内容都仅作为选择标准。直到我们开始遍历 `selection`，这些标准才被应用。\n\
    \n现在考虑第二个示例（参见列表 16.5 和输出 16.4）。\n\n**列表 16.5: 延迟执行与查询表达式（示例 2）**\n\n```csharp\n\
    using System;\nusing System.Collections.Generic;\nusing System.Linq;\n// ...\n\
    \    private static void CountContextualKeywords()\n    {\n        int delegateInvocations\
    \ = 0;\n        string func(string text)\n        {\n            delegateInvocations++;\n\
    \            return text;\n        }\n\n        IEnumerable<string> selection\
    \ =\n            from keyword in CSharp.Keywords\n            where keyword.Contains('*')\n\
    \            select func(keyword);\n\n        Console.WriteLine(\n           \
    \ $\"1\\. delegateInvocations={ delegateInvocations }\");\n\n        // 执行计数应该为每个选定的项目\n\
    \        // 调用一次 func\n        Console.WriteLine(\n            $\"2\\. Contextual\
    \ keyword count={ selection.Count() }\");\n\n        Console.WriteLine(\n    \
    \        $\"3\\. delegateInvocations={ delegateInvocations }\");\n\n        //\
    \ 执行计数应该为每个选定的项\n        // 调用一次 func\n        Console.WriteLine(\n          \
    \  $\"4\\. Contextual keyword count={ selection.Count() }\");\n\n        Console.WriteLine(\n\
    \            $\"5\\. delegateInvocations={ delegateInvocations }\");\n\n     \
    \   // 缓存该值以便未来的计数不会触发\n        // 查询的再次调用\n        List<string> selectionCache\
    \ = selection.ToList();\n\n        Console.WriteLine(\n            $\"6\\. delegateInvocations={\
    \ delegateInvocations }\");\n\n        // 从缓存的集合中检索计数\n        Console.WriteLine(\n\
    \            $\"7\\. selectionCache count={ selectionCache.Count }\");\n\n   \
    \     Console.WriteLine(\n            $\"8\\. delegateInvocations={ delegateInvocations\
    \ }\");\n    }\n    //...\n```\n\n**输出 16.4**\n\n```\n1\\. delegateInvocations=0\n\
    2\\. Contextual keyword count=28\n3\\. delegateInvocations=28\n4\\. Contextual\
    \ keyword count=28\n5\\. delegateInvocations=56\n6\\. delegateInvocations=84\n\
    7\\. selectionCache count=28\n8\\. delegateInvocations=84\n```\n\n列表 16.5 并没有定义单独的方法，而是使用\
    \ Lambda 表达式来计算方法被调用的次数。\n\n输出中有两点非常引显著。首先，在 `selection` 被赋值后，`DelegateInvocations`\
    \ 保持为零。在赋值给 `selection` 时，并没有执行对 `Keywords` 的迭代。如果 `Keywords` 是一个属性，则该属性调用将在赋值运行时。因此，尽管\
    \ `selection` 是一个集合（毕竟它的类型是 `IEnumerable<T>`），但在赋值时，`from` 子句之后的所有内容都仅作为选择标准。直到我们开始遍历\
    \ `selection`，这些标准才被应用。然而，一旦我们调用了 `ToList()`，`selection` 或 `Items` 等指示容器的术语就更为合适，因为我们开始计算内部的项了。换句话说，`selection`\
    \ 变量承担了双重目的：保存查询信息并作为检索数据的容器。\n\n输出 16.4 的另一个重要特性是，再次调用 `Count()` 会导致每个选定的项目再次调用\
    \ `func`。由于 `selection` 同时作为查询和集合，请求计数需要通过遍历 `selection` 引用的 `IEnumerable<string>`\
    \ 集合来重新执行查询。C# 编译器不知道是否有人修改了数组中的字符串导致计数发生变化，因此每次都必须重新计数以确保答案是正确且最新的。同样，对 `selection`\
    \ 执行 `foreach` 循环也会再次触发 `func`。`System.Linq.Enumerable` 提供的其他扩展方法也是如此。\n\n###\
    \ 高级主题：实现延迟执行\n\n延迟执行是通过使用委托和表达式树来实现的。委托提供了创建和操作指向包含可执行表达式的方法引用的能力。表达式树同样提供了创建和操作有关表达式信息的能力，这些信息可以在之后进行检查和操作。\n\
    \n在列表 16.5 中，`where` 子句的谓词表达式和 `select` 子句的投影表达式被编译器转换为表达式 Lambda 表达式，然后这些 Lambda\
    \ 表达式被转换为委托创建。查询表达式的结果是一个持有这些委托引用的对象。只有当查询结果被迭代时，查询对象才会实际执行委托。\n\n#### 过滤\n"
- fmt: "\nIn [LISTING 16.1](#ch16.html_list16_1), a `where` clause filters out reserved\
    \ keywords but not contextual keywords. This clause filters the collection “vertically”:\
    \ If you think of the collection as a vertical list of items, the `where` clause\
    \ makes that vertical list shorter so that the collection holds fewer items. The\
    \ filter criteria are expressed with a `predicate`—a lambda expression that returns\
    \ a `bool` such as `word.Contains()` (as in [LISTING 16.1](#ch16.html_list16_1))\
    \ or `File.GetLastWriteTime(fileName) < DateTime.Now.AddMonths(-1)`. The latter\
    \ is shown in [LISTING 16.6](#ch16.html_list16_6), whose output appears in [OUTPUT\
    \ 16.5](#ch16.html_op16_5).\n\n#### LISTING 16.6: Query Expression Filtering Using\
    \ `where`\n\n```c\nusing System;\nusing System.Collections.Generic;\nusing System.IO;\n\
    using System.Linq;\n// ...\n    public static void FindMonthOldFiles(\n      \
    \  string rootDirectory, string searchPattern)\n    {\n        IEnumerable<FileInfo>\
    \ files =\n            from fileName in Directory.EnumerateFiles(\n          \
    \      rootDirectory, searchPattern)\n            where File.GetLastWriteTime(fileName)\
    \ <                    \n                DateTime.Now.AddMonths(-1)          \
    \                   \n            select new FileInfo(fileName);\n\n        foreach(FileInfo\
    \ file in files)\n        {\n            //  As a simplification, the current\
    \ directory is\n            //  assumed to be a subdirectory of\n            //\
    \  rootDirectory\n            string relativePath = file.FullName.Substring(\n\
    \                Directory.GetCurrentDirectory().Length);\n            Console.WriteLine(\n\
    \                $\".{ relativePath } ({ file.LastWriteTime })\");\n        }\n\
    \    }\n    //...\n```\n\n#### OUTPUT 16.5\n\n```\n.\\TestData\\Bill.cs (8/10/2011\
    \ 9:33:55 PM)\n.\\TestData\\Contact.cs (8/19/2011 11:40:30 PM)\n.\\TestData\\\
    Employee.cs (8/17/2011 1:33:22 AM)\n.\\TestData\\Person.cs (10/22/2011 10:00:03\
    \ PM)\n```\n\n#### Sorting\n\nTo order the items using a query expression, you\
    \ can use the `orderby` clause, as shown in [LISTING 16.7](#ch16.html_list16_7).\n\
    \n#### LISTING 16.7: Sorting Using a Query Expression with an `orderby` Clause\n\
    \n```csharp\nusing System;\nusing System.Collections.Generic;\nusing System.Linq;\n\
    using System.IO;\n// ...\n    public static void ListByFileSize1(\n        string\
    \ rootDirectory, string searchPattern)\n    {\n        IEnumerable<string> fileNames\
    \ =\n            from fileName in Directory.EnumerateFiles(\n                rootDirectory,\
    \ searchPattern)\n            orderby (new FileInfo(fileName)).Length descending,\
    \           \n                fileName                                       \
    \            \n            select fileName;\n\n        foreach(string fileName\
    \ in fileNames)\n        {\n            Console.WriteLine(fileName);\n       \
    \ }\n    }\n    //...\n```\n\n[LISTING 16.7](#ch16.html_list16_7) uses the `orderby`\
    \ clause to sort the files returned by `Directory.GetFiles()` first by file size\
    \ in descending order, and then by filename in ascending order. Multiple sort\
    \ criteria are separated by commas, such that first the items are ordered by size,\
    \ and then, if the size is the same, they are ordered by filename. `ascending`\
    \ and `descending` are contextual keywords indicating the sort order direction.\
    \ Specifying the order as ascending or descending is optional; if the direction\
    \ is omitted (as it is here on `filename`), the default is `ascending`.\n\n####\
    \ The `let` Clause\n\n[LISTING 16.8](#ch16.html_list16_8) includes a query that\
    \ is very similar to the query in [LISTING 16.7](#ch16.html_list16_7), except\
    \ that the type argument of `IEnumerable<T>` is `FileInfo`. This query has a problem,\
    \ however: We have to redundantly create a `FileInfo` twice, in both the `orderby`\
    \ clause and the `select` clause.\n\n#### LISTING 16.8: Projecting a `FileInfo`\
    \ Collection and Sorting by File Size\n\n```csharp\nusing System;\nusing System.Collections.Generic;\n\
    using System.Linq;\nusing System.IO;\n// ...\n    public static void ListByFileSize2(\n\
    \        string rootDirectory, string searchPattern)\n    {\n        IEnumerable<FileInfo>\
    \ files =\n            from fileName in Directory.EnumerateFiles(\n          \
    \      rootDirectory, searchPattern)\n            orderby new FileInfo(fileName).Length,\
    \ fileName              \n            select new FileInfo(fileName);         \
    \                      \n\n        foreach (FileInfo file in files) \n       \
    \ {\n            //  As a simplification, the current directory\n            //\
    \  is assumed to be a subdirectory of\n            //  rootDirectory\n       \
    \     string relativePath = file.FullName.Substring(\n                Directory.GetCurrentDirectory().Length);\n\
    \            Console.WriteLine(\n                $\".{ relativePath }({ file.Length\
    \ })\");\n        }\n    }\n    //...\n```\n\nUnfortunately, although the end\
    \ result is correct, [LISTING 16.8](#ch16.html_list16_8) ends up instantiating\
    \ a `FileInfo` object twice for each item in the collection, which is wasteful.\
    \ To avoid this unnecessary overhead, you can use a `let` clause, as demonstrated\
    \ in [LISTING 16.9](#ch16.html_list16_9).\n\n#### LISTING 16.9: Ordering the Results\
    \ in Query Expression\n\n```csharp\n//...\nIEnumerable<FileInfo> files =\n   \
    \ from fileName in Directory.EnumerateFiles(\n        rootDirectory, searchPattern)\n\
    \    let file = new FileInfo(fileName)\n    orderby file.Length, fileName    \
    \                           \n    select file;\n//...\n```\n\nThe `let` clause\
    \ introduces a new variable that can hold the value of an expression that is used\
    \ throughout the remainder of the query. You can add as many `let` clauses as\
    \ you like; simply insert each as an additional clause to the query after the\
    \ first `from` clause but before the final `select`/group by` clause.\n\n####\
    \ Grouping\n\nA common data manipulation scenario is the grouping of related items.\
    \ In SQL, this generally involves aggregating the items to produce a summary or\
    \ total or some aggregate value. LINQ, however, is notably more expressive. LINQ\
    \ expressions allow for individual items to be grouped into a series of subcollections,\
    \ and those groups can then be associated with items in the query. For example,\
    \ [LISTING 16.10](#ch16.html_list16_10) and [OUTPUT 16.6](#ch16.html_op16_6) demonstrate\
    \ how to group together the contextual keywords and the regular keywords.\n\n\
    #### LISTING 16.10: Grouping Together Query Results\n\n```csharp\nusing System;\n\
    using System.Collections.Generic;\nusing System.Linq;\n// ...\n    private static\
    \ void GroupKeywords1()\n    {\n        IEnumerable<IGrouping<bool, string>> selection\
    \ =\n            from word in CSharp.Keywords\n            group word by word.Contains('*');\n\
    \n        foreach(IGrouping<bool, string> wordGroup\n            in selection)\n\
    \        {\n            Console.WriteLine(Environment.NewLine + \"{0}:\",\n  \
    \              wordGroup.Key ?\n                    \"Contextual Keywords\" :\
    \ \"Keywords\");\n            foreach(string keyword in wordGroup)\n         \
    \   {\n                Console.Write(\" \" +\n                    (wordGroup.Key\
    \ ?\n                        keyword.Replace(\"*\", null) : keyword));\n     \
    \       }\n        }\n    }\n    //...\n```\n\n#### OUTPUT 16.6\n\n```\nKeywords:\n\
    abstract as base bool break case catch checked class\nconst continue decimal default\
    \ delegate do else enum event\nexplicit external false finally float for foreach\
    \ goto if\nimplicit in int interface internal is lock long namespace new null\n\
    operator out override object params private protected public \nreadonly ref return\
    \ sbyte sealed short sizeof stackalloc static\nstring struct switch this throw\
    \ true try typeof uint ulong unsafe\nushort using virtual unchecked void volatile\
    \ while\nContextual Keywords:\nadd alias ascending async await by descending dynamic\
    \ equals\nfrom get group into join let nameof nonnull on orderby partial remove\n\
    select set value var where yield\n```\n"
