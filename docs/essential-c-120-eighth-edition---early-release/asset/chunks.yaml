  trans: "\n\n如果 C# 设计者选择使用 `yield value;` 而不是 `yield return value;` 作为迭代器产出值的语法，可能会引入一种可能的歧义：`yield(1+2);`\
    \ 现在可能是在产生一个值，也可能是将该值作为参数传递给名为 `yield` 的方法。\n\n由于以前绝不允许标识符 `yield` 紧现在 `return`\
    \ 或 `break` 之前，因此 C# 编译器知道这种对 `yield` 的用法必须是作为关键字，而不是标识符。\n\n## 在单个类中创建多个迭代器\n\
    \n之前的迭代器示例实现了 `IEnumerable<T>.GetEnumerator()`，这是 `foreach` 隐式查找的方法。有时你可能需要不同的迭代序列，例如反向迭代、过滤结果，或对除默认值之外的对象投影进行迭代。你可以通过将迭代器封装在返回\
    \ `IEnumerable<T>` 或 `IEnumerable` 的属性或方法中，在类中声明额外的迭代器。例如，如果你想反向遍历 `Pair<T>` 的元素，可以提供一个\
    \ `GetReverseEnumerator()` 方法，如列表 17.20 所示。\n\n### 列表 17.20：在返回 IEnumerable<T>\
    \ 的方法中使用 `yield return`\n\n```csharp\npublic struct Pair<T> : IPair<T>, IEnumerable<T>\n\
    {\n    // ...\n    public IEnumerable<T> GetReverseEnumerator()              \
    \          \n    {\n        yield return Second;\n        yield return First;\n\
    \    }\n    // ...\n    public static void Main()\n    {\n        var game = new\
    \ Pair<string>(\"Redskins\", \"Eagles\");\n        foreach (string name in game.GetReverseEnumerator())\
    \            \n        {\n            Console.WriteLine(name);\n        }\n  \
    \  }\n}\n```\n\n注意你返回的是 `IEnumerable<T>`，而不是 `IEnumerator<T>`。这与返回 `IEnumerator<T>`\
    \ 的 `IEnumerable<T>.GetEnumerator()` 不同。`Main()` 方法中的代码演示了如何使用 `foreach` 循环调用\
    \ `GetReverseEnumerator()`。\n\n## yield 语句要求\n\n你只能在返回 `IEnumerator<T>` 或 `IEnumerable<T>`\
    \ 类型（或其非泛型等价物）的成员中使用 `yield return` 语句。正体包含 `yield return` 语句的成员不能有简单的 `return`。如果成员使用了\
    \ `yield return` 语句，C# 编译器会生成必要的代码来维护迭代器的状态。相比之下，如果成员使用 `return` 语句代替 `yield return`，则程序员负责维护自己的状态机并返回一个迭代器接口的实例。此外，就就像具有返回类型的方法中的所有代码路径必须包含一个带值的\
    \ `return` 语句（假设它们没有抛出异常）一样，迭代器中的所有代码路径如果要返回任何数据，必须包含 `yield return` 语句。\n\n以下是对\
    \ `yield` 语句的额外限制，如果违反这些限制将会导致编译器错误：\n\n- `yield` 语句只能出现在方法、用户定义的操作符、或索引器或属性的\
    \ `get` 访问器内部。该成员不能接受任何 `ref` 或 `out` 参数。\n- `yield` 语句不能出现在匿名方法或 Lambda 表达式的任何位置（请参见第\
    \ 13 章）。\n- `yield` 语句不能出现在 `try` 语句的 `catch` 和 `finally` 子句中。此外，只有在没有 `catch`\
    \ 块的情况下，`yield` 语句才能出现在 `try` 块中。\n\n## 总结\n\n在本章中，我们回顾了关键集合类，并考虑了如何根据它们支持的接口进行分类。每个类都侧重于通过键、索引或\
    \ FIFO 或 LIFO 等机制向集合中插入项和检索项。我们还探索了如何遍历集合。此外，本章解释了如何定义带有自定义迭代器的自定义集合，用于对集合中的项进行（迭代器涉及一个上下文关键字\
    \ `yield`，C# 使用它来生成实现 `foreach` 循环所用迭代器模式的底层 CIL 代码）。\n\n在第 18 章中，我们将探索反射，这是一个之前提到过的话题，尽管几乎没有或完全没有解释。反射允许我们在运行时检查\
    \ CIL 代码中类型的结构。\n\n## 18. 反射、特性与动态编程 [此内容正在开发中。]\n\n**此内容正在开发中。**\n\n## 19. 引入多线程\
    \ [此内容正在开发中。]\n\n**此内容正在开发中。**\n\n## 20. 基于任务的异步模式编程 [此内容正在开发中。]\n\n**此内容正在开发中。**\n\
    \n## 21 并行迭代\n\n在第 19 章中，我们提到了计算成本正在下降，导致计算机具有更快的 CPU、更多的 CPU 以及每个 CPU 中更多核心数量的增加。这些趋势共同使得提高执行并行化以利用增加的计算能力变得越来越经济。在本章中，我们查看并行执行循环，这是利用增加的计算能力最简单的方法之一。本章的大部分由初学者和高级主题块组成。\n\
    \n![图像](img/21fig00.jpg)\n\n### 并行执行循环迭代\n\n考虑列表 21.1 所示的 `for` 循环语句和相关代码。考虑 21.1\
    \ 所示的 `for` 循环语句和相关代码。考虑 21.1 所示的 `for` 循环语句和相关代码。考虑 21.1 所示的 `for` 循环语句和相关代码。考虑\
    \ 21.1 所示的 `for` 循环语句和相关代码。考虑 21.1 所示的 `for` 循环语句和相关代码。考虑 21.1 所示的 `for` 循环语句和相关代码。考虑\
