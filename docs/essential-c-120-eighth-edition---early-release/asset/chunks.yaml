  trans: "\n\n在 LISTING 16.10 中有几点需要注意。首先，查询结果是一个类型为 `IGrouping<bool, string>` 的元素序列。第一个类型参数表示\
    \ `by` 之后的“分组键”表达式类型为 `bool`，第二个类型参数表示 `group` 之后的“分组元素”表达式类型为 `string`。也就是说，该查询产生了一个组的序列，其中组内的每个\
    \ `string` 对应的布尔键值都是相同的。\n\n由于带有 `group by` 子句的查询会产生一个集合序列，因此遍历结果的常用模式是创建嵌套的 `foreach`\
    \ 循环。在 LISTING 16.10 中，外层循环遍历分组，并将关键字类型作为标题打印出来。嵌套的 `foreach` 循环将组中的每个关键字作为项目打印在标题下方。\n\
    \n此查询表达式的结果本身也是一个序列，你可以像查询其他序列一样对其进行查询。LISTING 16.11 和 OUTPUT 16.7 展示了如何创建一个额外的查询，在产生组序列的查询上添加投影。（下一节关于查询延续，将展示一种更愉悦的语法，用于为完整查询添加更多查询子句。）\n\
    \n#### LISTING 16.11: 在 `group` 子句后选择元组\n\n```csharp\nusing System;\nusing System.Collections.Generic;\n\
    using System.Linq;\n// ...\n    private static void GroupKeywords1()\n    {\n\
    \        IEnumerable<IGrouping<bool, string>> keywordGroups =              \n\
    \            from word in CSharp.Keywords                                  \n\
    \            group word by word.Contains('*');                             \n\n\
    \        IEnumerable<(bool IsContextualKeyword,                            \n\
    \            IGrouping<bool, string> Items)> selection =                   \n\
    \            from groups in keywordGroups                                  \n\
    \            select                                                        \n\
    \            (                                                             \n\
    \                IsContextualKeyword: groups.Key,                          \n\
    \                Items: groups                                             \n\
    \            );                                                            \n\n\
    \        foreach (\n            (bool isContextualKeyword, IGrouping<bool, string>\
    \ items)\n                in selection)\n        {\n\n            Console.WriteLine(Environment.NewLine\
    \ + \"{0}:\",\n                isContextualKeyword ?\n                    \"Contextual\
    \ Keywords\" : \"Keywords\");\n            foreach (string keyword in items) \
    \                            \n            {\n                Console.Write(\"\
    \ \" + keyword.Replace(\"*\", null));\n            }\n        }\n    }\n    //...\n\
    ```\n\n#### OUTPUT 16.7\n\n```\nKeywords:\n abstract as base bool break byte case\
    \ catch char checked class\nconst continue decimal default delegate do double\
    \ else enum\nevent explicit extern false finally fixed float for foreach goto\
    \ if\nimplicit in int interface internal is lock long namespace new null\noperator\
    \ out override object params private protected public\nreadonly ref return sbyte\
    \ sealed short sizeof stackalloc static\nstring struct switch this throw true\
    \ try typeof uint ulong unsafe\nushort using virtual unchecked void volatile while\n\
    Contextual Keywords:\n add alias ascending async await by descending dynamic equals\
    \ from\nget global group into join let nameof nonnull on orderby partial remove\n\
    select set value var where yield\n```\n\n`group` 子句的结果会产生一个产生 `IGrouping<TKey,\
    \ TElement>` 对象集合的查询——正如同 `GroupBy()` 标准查询操作符所做的那样（参见 第 15 章）。后续查询中的 `select`\
    \ 子句使用元组有效地将 `IGrouping<TKey, TElement>.Key` 重命名为 `IsContextualKeyword`，并将子集合属性命名为\
    \ `Items`。通过此更改，嵌套的 `foreach` 循环使用了 `wordGroup.Items` 而不是直接使用 `wordGroup`，如 LISTING\
    \ 16.10 所示。元组中可以添加的另一个项目可能是子集合中项目的计数。然而，此功能已经通过 LINQ 的 `wordGroup.Items.Count()`\
    \ 方法可用，因此直接在匿名类型中添加该内容的益处尚存疑。\n\n#### 使用 `into` 的查询延续\n\n正如我们在 LISTING 16.11 中看到的，你可以将现有的查询作为第二个查询的输入。然而，当你想要将一个查询的结果作为另一个查询的输入时，并没有必要编写一个完全新的查询表达式。你可以使用上下文关键字\
    \ `into` 通过**查询延续子句**来扩展任何查询。查询延续只不过是创建两个查询并将第一个作为第二个的输入的语法糖。由 `into` 子句引入的范围变量（LISTING\
    \ 16.11 中的 `groups`）将成为查询剩余部分的范围变量；任何之前的之前的范围变量在逻辑上都是较早查询的一部分，不能在查询延续中使用。LISTING\
    \ 16.12 重写了 LISTING 16.11 的代码，使用查询延续代替两个查询。\n\n#### LISTING 16.12: 不使用查询延续进行选择\n\
    \n```csharp\nusing System;\nusing System.Collections.Generic;\nusing System.Linq;\n\
    // ...\n    private static void GroupKeywords1()\n    {\n        IEnumerable<(bool\
    \ IsContextualKeyword, \n            IGrouping<bool, string> Items)> selection\
    \ =\n            from word in CSharp.Keywords\n            group word by word.Contains('*')\
    \                           \n                into groups                    \
    \                        \n                select                            \
    \                     \n                (                                    \
    \                  \n                    IsContextualKeyword: groups.Key,    \
    \               \n                    Items: groups                          \
    \            \n                );                                            \
    \         \n        // ...\n    }\n    //...\n```\n\n使用 `into` 在现有查询上运行附加查询的能力并不特定于以\
    \ `group` 子句结尾，而是适用于所有查询表达式。查询延续只是编写消耗其他查询结果表达式的简写。你可以将 `into` 视为“管道操作符”，因为它将第一个查询的结果“管道”到第二个查询中。你可以以这种方式任意地链接多个查询。\n\
    \n#### 使用多个 `from` 子句扁平化序列\n\n通常需要将序列序列“扁平化”为单个序列。例如，客户序列的每个成员可能都有相关的订单序列，或者目录序列的每个成员可能都有相关的文件序列。`SelectMany`\
    \ 序列符（在第 15 章 中讨论）连接了所有子序列；使用查询表达式语法实现相同操作，可以使用多个 `from` 子句，如 LISTING 16.13 所示。\n\
    \n#### LISTING 16.13: 多重选择\n\n```csharp\nvar selection =\n    from word in CSharp.Keywords\n\
    \    from character in word                                            \n    select\
    \ character;\n```\n\n上述查询将产生字符序列 `a`, `b`, `s`, `t`, `r`, `a`, `c`, `t`, `a`,\
    \ `d`, d, *, `a, l`, i, ….\n\n多个 `from` 子句还可以用于产生**笛卡尔积**——多个序列的所有可能的组合集合——如 LISTING\
    \ 16.14 所示。\n\n#### LISTING 16.14: 笛卡尔积\n\n"
- fmt: "\n```cs\nvar numbers = new[] { 1, 2, 3 };\nIEnumerable<(string Word, int Number)>\
    \ product =\n     from word in CSharp.Keywords\n     from number in numbers  \
    \                                         \n     select (word, number);\n```\n\
    \nThis query would produce a sequence of pairs (`abstract`, `1`), (`abstract`,\
    \ `2`), (`abstract`, `3`), (`as`, `1`), (`as`, `2`), ….\n\n### Beginner Topic:\
    \ Distinct Members\n\nOften, it is desirable to return only distinct (i.e., unique)\
    \ items from within a collection, discarding any duplicates. Query expressions\
    \ do not have an explicit syntax for distinct members, but such functionality\
    \ is available via the query operator `Distinct()`, which was introduced in [Chapter\
    \ 15](#ch15.html_ch15). To apply a query operator to a query expression, the expression\
    \ must be enclosed in parentheses so that the compiler does not think that the\
    \ call to `Distinct()` is a part of the `select` clause. [LISTING 16.15](#ch16.html_list16_15)\
    \ gives an example; [OUTPUT 16.8](#ch16.html_op16_8) shows the results.\n\n####\
    \ LISTING 16.15: Obtaining Distinct Members from a Query Expression\n\n```cs\n\
    using System;\nusing System.Linq;\nusing System.Collections.Generic;\n// ...\n\
    \    public static void ListMemberNames()\n    {\n        IEnumerable<string>\
    \ enumerableMethodNames = (\n            from method in typeof(Enumerable).GetMembers(\n\
    \                System.Reflection.BindingFlags.Static |\n                System.Reflection.BindingFlags.Public)\n\
    \                orderby method.Name\n                select method.Name).Distinct();\n\
    \        foreach(string method in enumerableMethodNames)\n        {\n        \
    \    Console.Write($\"{ method }, \");\n        }\n    }\n    //...\n```\n\n####\
    \ OUTPUT 16.8\n\n```\nAggregate, All, Any, Append, AsEnumerable, Average, Cast,\
    \ Chunk,\nConcat, Contains, Count, DefaultIfEmpty, Distinct, DistinctBy, ElementAt\n\
    , ElementAtOrDefault, Empty, Except, ExceptBy, First, FirstOrDefault, Gr\noupBy,\
    \ GroupJoin, Intersect, IntersectBy, Join, Last, LastOrDefault, Lon\ngCount, Max,\
    \ MaxBy, Min, MinBy, OfType, Order, OrderBy, OrderByDescendin\ng, OrderDescending,\
    \ Prepend, Range, Repeat, Reverse, Select, SelectMany,\nSequenceEqual, Single,\
    \ SingleOrDefault, Skip, SkipLast, SkipWhile, Sum,\nTake, TakeLast, TakeWhile,\
    \ ThenBy, ThenByDescending, ToArray, ToDiction\nary, ToHashSet, ToList, ToLookup,\
    \ TryGetNonEnumeratedCount, Union,\nUnionBy, Where, Zip,\n```\n\nIn this example,\
    \ `typeof(Enumerable).GetMembers()` returns a list of all the members (methods,\
    \ properties, and so on) for `System.Linq.Enumerable`. However, many of these\
    \ members are overloaded, sometimes more than once. Rather than displaying the\
    \ same member multiple times, `Distinct()` is called from the query expression.\
    \ This eliminates the duplicate names from the list. (We cover the details of\
    \ `typeof()` and reflection [where methods like `GetMembers()` are available]\
    \ in [Chapter 18](#ch18.html_ch18).)\n\n### Query Expressions Are Just Method\
    \ Invocations\n\nSomewhat surprisingly, adding query expressions^([4](#ch16.html_fn16_4))\
    \ required no changes to the Common Language Runtime (CLR) or to the Common Intermediate\
    \ Language (CIL). Rather, the C# compiler simply translates query expressions\
    \ into a series of method calls. Consider, for example, the query expression from\
    \ [LISTING 16.1](#ch16.html_list16_1), a portion of which appears in [LISTING\
    \ 16.16](#ch16.html_list16_16).\n\n[4](#ch16.html_fn16_4a). Starting in C# 3.0.\n\
    \n#### LISTING 16.16: Simple Query Expression\n\n```cs\nprivate static void ShowContextualKeywords1()\n\
    {\n    IEnumerable<string> selection =\n        from word in CSharp.Keywords\n\
    \        where !word.Contains('*')\n        select word;\n    // ...\n}\n```\n\
    \nAfter compilation, the expression from [LISTING 16.16](#ch16.html_list16_16)\
    \ is converted to an `IEnumerable<T>` extension method call from `System.Linq.Enumerable`,\
    \ as shown in [LISTING 16.17](#ch16.html_list16_17).\n\n#### LISTING 16.17: Query\
    \ Expression Translated to Standard Query Operator Syntax\n\n```cs\nprivate static\
    \ void ShowContextualKeywords2()\n{\n    IEnumerable<string> selection =     \
    \                                \n        CSharp.Keywords.Where(word => !word.Contains('*'));\
    \             \n    // ...\n}\n```\n\nAs discussed in [Chapter 15](#ch15.html_ch15),\
    \ the lambda expression is then itself translated by the compiler to emit a method\
    \ with the body of the lambda, and its usage entails allocation of a delegate\
    \ to that method.\n\nEvery query expression can (and must) be translated into\
    \ method calls, but not every sequence of method calls has a corresponding query\
    \ expression. For example, there is no query expression equivalent for the extension\
    \ method `TakeWhile<T>(Func<T, bool> predicate)`, which repeatedly returns items\
    \ from the collection as long as the predicate returns `true`.\n\nFor those queries\
    \ that do have both a method call form and a query expression, which is better?\
    \ This is a judgment call.\n\n#### Guidelines\n\n- DO use query syntax to make\
    \ queries easier to read, particularly if they involve `from`, `let`, `join`,\
    \ or `group` clauses.\n- CONSIDER using the query operators (method call form)\
    \ if the query involves operations that do not have query expression syntax, such\
    \ as `Count()`, `TakeWhile()`, or `Distinct()`.\n\n### Summary\n\nThis chapter\
    \ introduced a new syntax—namely, query expressions. Readers familiar with SQL\
    \ will immediately see the similarities between query expressions and SQL. However,\
    \ query expressions also introduce additional functionality, such as grouping\
    \ into a hierarchical set of new objects, which is unavailable with SQL. All of\
    \ the functionality of query expressions was already available via query operators,\
    \ but query expressions frequently provide a simpler syntax for such a query.\
    \ Whether standard operators or query expression syntax is used, however, the\
    \ end result is a significant improvement in the way developers can code against\
    \ collection APIs—an improvement that ultimately provides a paradigm shift in\
    \ the way object-oriented languages are able to interface with relational databases.\n\
    \nIn the next chapter, we continue our discussion of collections by investigating\
    \ some of the .NET framework collection types and exploring how to define custom\
    \ collections.\n\n## 17. Building Custom Collections\n\n[Chapter 15](#ch15.html_ch15)\
    \ covered the standard query operators—that is, the extension methods on `IEnumerable<T>`\
    \ that provide methods common to all collections. However, these operators do\
    \ not make all collections equally suited for all tasks; there is still a need\
    \ for different collection types. Some collections are better suited to searching\
    \ by key, whereas others are better suited to accessing items by position. Some\
    \ collections act like queues: The first element in is the first out. Others are\
    \ like stacks: The first element in is the last out. Others are not ordered at\
    \ all.\n\nThe .NET frameworks provide a plethora of collection types suited to\
    \ many of the scenarios in which collections are needed. This chapter introduces\
    \ some of these collection types and the interfaces they implement. It also describes\
    \ how to create custom-built collections that support standard functionality,\
    \ such as indexing. In addition, it explores the use of the `yield return` statement\
    \ to create classes and methods that implement `IEnumerable<T>`. This feature^([1](#ch17.html_fn17_1))\
    \ greatly simplifies implementation of collections that can be enumerated with\
    \ the `foreach` statement.\n"
