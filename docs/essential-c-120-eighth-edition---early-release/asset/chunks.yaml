  trans: "\n\n```assembly\nusing System;\nusing System.Collections.Generic;\nusing\
    \ System.IO;\nusing System.Threading.Tasks;                                  \
    \      \n\npublic static class Program\n{\n    // ...\n    static void EncryptFiles(\n\
    \        string directoryPath, string searchPattern)\n    {\n        IEnumerable<string>\
    \ files = Directory.EnumerateFiles(\n            directoryPath, searchPattern,\n\
    \            SearchOption.AllDirectories);\n        try\n        {\n         \
    \   Parallel.ForEach(files, fileName =>\n            {\n                Encrypt(fileName);\n\
    \            });\n        }\n        catch (AggregateException exception)    \
    \                     \n        {\n            Console.WriteLine(\n          \
    \      \"ERROR: {0}:\",\n                exception.GetType().Name);\n        \
    \    foreach(Exception item in\n                exception.InnerExceptions)   \
    \                        \n            {\n                Console.WriteLine(\"\
    \  {0} - {1}\",\n                    item.GetType().Name, item.Message);\n   \
    \         }\n        }\n    }\n    // ...\n}\n```\n\n输出 21.2\n\n```\nERROR: AggregateException:\n\
    \  UnauthorizedAccessException - Attempted to perform an unauthorized\noperation.\n\
    \  UnauthorizedAccessException - Attempted to perform an unauthorized\noperation.\n\
    \  UnauthorizedAccessException - Attempted to perform an unauthorized\noperation.\n\
    ```\n\n`输出 21.2` 显示在执行 `Parallel.ForEach<T>(...)` 循环时发生了三个异常。然而，代码只显示了一个类型为 `System.AggregateException`\
    \ 的 catch。这些 `UnauthorizedAccessException` 是从 `AggregateException` 的 `InnerExceptions`\
    \ 属性获取的。使用 `Parallel.ForEach<T>()` 循环时，每次迭代都可能抛出异常，因此方法调用抛出的 `System.AggregateException`\
    \ 将在其 `InnerExceptions` 属性中包含其中的每一个异常。\n\n### 取消并行循环\n\n与任务不同，任务如果需要阻塞直到完成，则需要显式调用；而并行循环虽然并行执行迭代，但其本身在整个并行循环完成之前不会返回。因此，取消并行循环通常涉及从执行并行循环的线程以外线程调用取消请求。在代码列表\
    \ 21.5 中，我们使用 `Task.Run()` 调用了 `Parallel.ForEach<T>()`。通过这种方式，查询不仅并行并行执行，而且是异步执行，允许代码提示用户“按任意键退出”。\n\
    \n代码列表 21.5: 取消并行循环\n\n```assembly\nusing System;\nusing System.Collections.Generic;\n\
    using System.IO;\nusing System.Threading;\nusing System.Threading.Tasks;\n\npublic\
    \ class Program\n{\n    // ...\n\n    static void EncryptFiles(\n        string\
    \ directoryPath, string searchPattern)\n    {\n\n        string stars =\n    \
    \        \"*\".PadRight(Console.WindowWidth - 1, '*');\n\n        IEnumerable<string>\
    \ files = Directory.GetFiles(\n           directoryPath, searchPattern,\n    \
    \       SearchOption.AllDirectories);\n\n        CancellationTokenSource cts =\
    \                                    \n            new CancellationTokenSource();\
    \                               \n        ParallelOptions parallelOptions =  \
    \                              \n            new ParallelOptions { CancellationToken\
    \ = cts.Token };       \n        cts.Token.Register(                         \
    \                     \n            () => Console.WriteLine(\"Canceling...\"));\
    \                    \n\n        Console.WriteLine(\"Press ENTER to exit.\");\n\
    \n        Task task = Task.Run(() =>\n            {\n                try\n   \
    \             {\n                    Parallel.ForEach(\n                     \
    \   files, parallelOptions,                          \n                      \
    \  (fileName, loopState) =>\n                        {\n                     \
    \       Encrypt(fileName);\n                        });\n                }\n \
    \               catch(OperationCanceledException) { }\n            });\n\n   \
    \     // 等待用户输入\n        Console.ReadLine();\n\n        // 取消查询\n        cts.Cancel();\
    \                                                    \n        Console.Write(stars);\n\
    \        task.Wait();\n    }\n    // ...\n}\n```\n\n并行循环使用了与任务相同的取消令牌模式。通过调用具有类型\
    \ `ParallelOptions` 类型参数的 `ForEach()` 方法重载，可以将从 `CancellationTokenSource` 获取的令牌与并行循环关联。该对象包含了取消令牌。\n\
    \n请注意，如果你取消了并行循环操作，将通过检查 `IsCancellationRequested` 属性防止任何尚未启动的迭代启动。正在执行的迭代将运行到各自的终止点。此外，即使在所有迭代完成后调用\
    \ `Cancel()`，仍然会引起注册的取消事件（通过 `cts.Token.Register()`）执行。\n\n`ForEach()` 方法能够确认循环已取消的唯一手段是通过\
    \ `OperationCanceledException`。鉴于此示例中的取消操作是预期的，该异常被捕获并忽略，允许应用程序显示“Canceling…”，随后输出一行星号后退出。\n\
    \n### 高级主题：并行循环选项\n\n虽然通常没有必要，但通过 `Parallel.For()` 和 `Parallel.ForEach<T>()` 循环重载中的\
    \ `ParallelOptions` 参数，可以控制最大并行度（即同时调度运行的线程数）。在某些特定情况下，开发者可能更了解特定的算法或情况，使得更改最大并行度是有意义的。这些情况包括：\n\
    \n- 希望禁用并行化以便于调试或分析的场景。将最大并行度设置为 1 可确保循环迭代不会并发运行。\n- 提前知道并行度将受外部因素（如硬件限制）限制的情况。例如，如果你的并行操作涉及使用多个\
    \ USB 端口，创建比可用端口更多的线程可能没有意义。\n- 具有长时间运行迭代的场景（例如分钟或几小时）。线程池无法区分长时间运行迭代和阻塞操作，因此可能会引入许多新线程，而所有线程都会被\
    \ `for` 循环消耗。这会导致线程随时间增量增长，导致进程中出现大量的线程。\n\n以此此类等。要控制最大并行度，请使用 `ParallelOptions`\
    \ 对象的 `MaxDegreeOfParallelism` 属性。\n\n你还可以使用 `ParallelOptions` 对象的 `TaskScheduler`\
    \ 属性指定在调度与迭代关联的任务时使用的自定义任务调度器。例如，你可能有一个异步事件处理程序来响应用户点击“下一步”按钮。如果用户多次点击该按钮，你可能希望使用自定义任务调度器，优先考虑最近创建的任务，而不是优先考虑等待最长的任务。任务调度器提供了一种指定任务之间如何相互执行的方法。\n\
    \n"
- fmt: "\nLike a standard `for` loop, the `Parallel.For()` loop supports the concept\
    \ of “breaking” to exit the loop and canceling any further iterations. In the\
    \ context of parallel `for` execution, however, a `break` signifies that no *new*\
    \ iterations following the breaking iteration should start. All currently executing\
    \ iterations, however, will run to completion.\n\nTo break a parallel loop, you\
    \ can provide a cancellation token and cancel it on another thread, as described\
    \ in the preceding Advanced Topic: Parallel Loop Options. You can also use an\
    \ overload of the `Parallel.For()` method whose body delegate takes two parameters:\
    \ the index and a `ParallelLoopState` object. An iteration that wishes to break\
    \ the loop can call the `Break()` or `Stop()` method on the loop state object\
    \ passed to the delegate. The `Break()` method indicates that no more iterations\
    \ with index values higher than the current value need to execute; the `Stop()`\
    \ method indicates that no more iterations need to run at all.\n\nFor example,\
    \ suppose you have a `Parallel.For()` loop that is performing ten iterations in\
    \ parallel. Some of those iterations might run faster than others, and the task\
    \ scheduler does not guarantee that they will run in any particular order. Suppose\
    \ the first iteration has completed; iterations 3, 5, 7, and 9 are “in flight,”\
    \ scheduled to four different threads; and iterations 5 and 7 both call `Break()`.\
    \ In this scenario, iterations 6 and 8 will never start, but iterations 2 and\
    \ 4 will still be scheduled to run. Iterations 3 and 9 will run to completion\
    \ because they had already started when the break happened.\n\nThe `Parallel.For()`\
    \ and `Parallel.ForEach<T>()` methods return a reference to a `ParallelLoopResult`\
    \ object that contains useful information about what happened during the loop.\
    \ This result object has the following properties:\n\n* `IsCompleted` returns\
    \ a Boolean indicating whether all iterations started.\n* `LowestBreakIteration`\
    \ identifies the lowest iteration that executed a break. The value is of type\
    \ `long?`, where a value of `null` indicates no break statement was encountered.\n\
    \nReturning to the ten-iteration example, the `IsCompleted` property will return\
    \ `false` and the `LowestBreakIteration` will return a value of `5`.\n\n### Running\
    \ LINQ Queries in Parallel\n\nJust as it is possible to execute a loop in parallel\
    \ using `Parallel.For()`, so it is also possible to execute LINQ queries in parallel\
    \ using the Parallel LINQ API (PLINQ, for short). An example of a simple nonparallel\
    \ LINQ expression is shown in [LISTING 21.6](#ch21.html_list21_6); in [LISTING\
    \ 21.7](#ch21.html_list21_7), we modify it to run in parallel.\n\n**LISTING 21.6:\
    \ LINQ `Select()`**\n\n```c\nusing System.Collections.Generic;\nusing System.Linq;\n\
    public class Program\n{\n    // ...\n    public static List<string>\n      Encrypt(IEnumerable<string>\
    \ data)\n    {\n        return data.Select(\n            item => Encrypt(item)).ToList();\n\
    \    }\n    // ...\n}\n```\n\nIn [LISTING 21.6](#ch21.html_list21_6), a LINQ query\
    \ uses the `Select()` standard query operator to encrypt each string within a\
