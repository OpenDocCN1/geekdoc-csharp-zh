  trans: "\n另一类集合类是字典类——具体来说 `Dictionary<TKey, TValue>`（参见图 17.3）。与列表集合不同，字典类存储的是键/值对。名称充当唯一键，类似于在数据库中通过主键访问记录的方式，用于查找相应的元素。这增加了访问字典元素时的一些复杂性，但由于通过键查找是极效的操作，因此这是一种非常有用的集合。请注意，键可以是任何数据类型，而不仅仅是字符串或数值。\n\
    \n![Images](img/17fig03.jpg)\n\n**图 17.3：`Dictionary` 类图**\n\n## 插入元素\n\n向字典中插入元素的一种方法是使用\
    \ `Add()` 方法，将键和值都作为参数传递，如列表 17.5 所示。\n\n**列表 17.5：向 `Dictionary<TKey, TValue>`\
    \ 添加项**\n\n```csharp\nusing System;\nusing System.Collections.Generic;\n\npublic\
    \ class Program\n{\n    public static void Main()\n    {\n        var colorMap\
    \ = new Dictionary<string, ConsoleColor>\n        {\n            [\"Error\"] =\
    \ ConsoleColor.Red,\n            [\"Warning\"] = ConsoleColor.Yellow,\n      \
    \      [\"Information\"] = ConsoleColor.Green\n        };\n        colorMap.Add(\"\
    Verbose\", ConsoleColor.White);                      \n        // ...\n    }\n\
    }\n```\n\n在使用字典初始化器^(3) 初始化字典后（参见第 15 章中的“集合初始化器”节），列表 17.5 插入了字符串 `a` 对应键 \"\
    Verbose\" 的白色 `ConsoleColor`。如果已经添加了相同键的元素，则会抛出异常。\n\n3。从 C# 6.0 开始。\n\n添加元素的另一种方法是使用索引器，如列表\
    \ 17.6 所示。\n\n**列表 17.6：使用索引运算符在 `Dictionary<TKey, TValue>` 中插入项**\n\n```csharp\n\
    using System;\nusing System.Collections.Generic;\n\npublic class Program\n{\n\
    \    public static void Main()\n    {\n        var colorMap = new Dictionary<string,\
    \ ConsoleColor>\n            {\n                [\"Error\"] = ConsoleColor.Red,\n\
    \                [\"Warning\"] = ConsoleColor.Yellow,\n                [\"Information\"\
    ] = ConsoleColor.Green\n            };\n\n        colorMap[\"Verbose\"] = ConsoleColor.White;\
    \                        \n        colorMap[\"Error\"] = ConsoleColor.Cyan;  \
    \                         \n\n        // ...\n    }\n}\n```\n\n在列表 17.6 中观察到的第一点是，索引操作符不需要整数。相反，索引操作数的类型由第一个类型参数（`string`）指定，而通过索引器设置或检索的值的类型由第二个类型参数（`ConsoleColor`）指定。\n\
    \n在列表 17.6 中需要注意的第二点是使用了两次相同的键（`\"Error\"`）。在第一次赋值中，没有字典值对应给定的键。当发生这种情况时，字典集合类会使用提供的键插入一个新值。在第二次赋值中，已经存在指定键的元素。它没有插入额外的元素，而是将\
    \ `\"Error\"` 键之前的 `ConsoleColor` 值替换为 `ConsoleColor.Cyan`。\n\n## 访问与搜索\n\n尝试从具有不存在的键的字典读取值将抛出\
    \ `KeyNotFoundException`。`ContainsKey()` 方法允许你在访问值之前检查特定键是否被使用，从而避免异常。\n\n`Dictionary<TKey,\
    \ TValue>` 实现为哈希表；无论字典中存储了多少值，该数据结构在通过键搜索时都能提供极快的访问。相比之下，检查字典集合中是否存在特定值是一个具有线性性能特征的耗时操作，类似于在未排序的列表中搜索。要执行此操作，你使用\
    \ `ContainsValue()` 方法，它会顺序遍历集合中的每个元素。\n\n你使用 `Remove()` 方法删除字典元素，将键而不是元素值作为参数传递。\n\
    \n## 遍历字典\n\n因为向字典添加值时同时需要键和值，因此枚举字典元素的 `foreach` 循环变量必须是 `KeyValuePair<TKey,\
    \ TValue>`。列表 17.7 显示了使用 `foreach` 循环枚举字典中的键和值的代码片段。输出出现在输出 17.3 中。\n\n**列表 17.7：使用\
    \ `foreach` 遍历 `Dictionary<TKey, TValue>`**\n\n```csharp\nusing System;\nusing\
    \ System.Collections.Generic;\n\npublic class Program\n{\n    public static void\
    \ Main()\n    {\n        var colorMap = new Dictionary<string, ConsoleColor>\n\
    \            {\n                [\"Error\"] = ConsoleColor.Red,\n            \
    \    [\"Warning\"] = ConsoleColor.Yellow,\n                [\"Information\"] =\
    \ ConsoleColor.Green,\n                [\"Verbose\"] = ConsoleColor.White\n  \
    \          };\n\n        Print(colorMap);\n  }\n\n    private static void Print(\n\
    \      IEnumerable<KeyValuePair<string, ConsoleColor>> items)\n    {\n       \
    \ foreach (KeyValuePair<string, ConsoleColor> item in items)\n        {\n    \
    \        Console.ForegroundColor = item.Value;\n          Console.WriteLine(item.Key);\n\
    \      }\n    }\n}\n```\n\n**输出 17.3**\n\n```\nError\nWarning\nInformation\nVerbose\n\
    ```\n\n请注意，这里显示的项顺序是它们被添加的顺序，就像它们添加到列表中一样。字典的实现通常按照添加顺序进行枚举，但这一特性并不是强制要求的，因此你不应该依赖它。\n\
    \n## 指南\n\n**不要对集合的枚举顺序做任何无根据的假设。如果集合没有说明按特定顺序进行枚举，则无法保证以任何特定顺序输出。**\n\n如果你只想处理字典的键或只处理元素，可以通过\
    \ `Keys` 和 `Values` 属性分别获取。这些属性返回的数据类型为 `ICollection<T>`。这些属性返回的数据是原始字典内部数据的引用而非副本；字典内部的变化会自动反映在\
    \ `Keys` 和 `Values` 属性返回的集合中。\n"
- fmt: "\nFor example, suppose you wish to create a `Dictionary<Contact, string>`\
    \ using the `Contact` type from [LISTING 17.2](#ch17.html_list17_2). However,\
    \ you want any two `Contact` objects to compare as equal if they have the same\
    \ first and last names, regardless of whether the two objects are reference equal.\
    \ Much as you can provide an implementation of `IComparer<T>` to sort a list,\
    \ so you can provide an implementation of `IEqualityComparer<T>` to determine\
    \ if two keys are to be considered equal. This interface requires two methods:\
    \ one that returns whether two items are equal and one that returns a “hash code”\
    \ that the dictionary can use to facilitate fast indexing. [LISTING 17.8](#ch17.html_list17_8)\
    \ shows an example.\n\n**LISTING 17.8: Implementing `IEqualityComparer<T>`**\n\
    \n```c\nusing System.Collections.Generic;\n\npublic class ContactEquality : IEqualityComparer<Contact>\n\
    {\n    public bool Equals(Contact? x, Contact? y)\n    {\n        if(object.ReferenceEquals(x,\
    \ y))\n            return true;\n        if(x == null || y == null)\n        \
    \    return false;\n        return x.LastName == y.LastName &&\n            x.FirstName\
    \ == y.FirstName;\n    }\n\n    public int GetHashCode(Contact x)\n    {\n   \
    \     if(x is null)\n            return 0;\n\n        int h1 = x.FirstName ==\
    \ null ? 0 : x.FirstName.GetHashCode();\n        int h2 = x.LastName == null ?\
    \ 0 : x.LastName.GetHashCode();\n        return h1 * 23 + h2;\n    }\n}\n```\n\
    \nTo create a dictionary that uses this equality comparer, you can use the constructor\
    \ `new Dictionary<Contact, string>(new ContactEquality)`.\n\n#### Beginner Topic:\
    \ Requirements of Equality Comparisons\n\nAs discussed in [Chapter 10](#ch10.html_ch10),\
    \ several important rules apply to the equality and hash code algorithms. Conformance\
    \ to these rules is critical in the context of collections. Just as correctly\
    \ sorting a list requires a custom ordering comparison to provide a total order,\
    \ so, too, does a hash table require certain guarantees to be met by a custom\
    \ equality comparison. The most important requirement is that if `Equals()` returns\
    \ `true` for two objects, `GetHashCode()` must return the same value for those\
    \ two objects. Note that the converse is not true: Two unequal items may have\
    \ the same hash code. (Indeed, there *must* be two unequal items that have the\
    \ same hash code because there are only 2^(32) possible hash codes but many more\
    \ than that number of unequal objects!)\n\nThe second-most important requirement\
    \ is that two calls to `GetHashCode()` on the same item must produce the same\
    \ result for at least as long as the item is in the hash table. Note, however,\
    \ that two objects that “look equal” are not required to give the same hash code\
    \ in two separate runs of a program. For example, it is perfectly legal for a\
    \ given contact to be assigned one hash code today and, two weeks later when you\
    \ run the program a second time, for “the same” contact to be given a different\
    \ hash code. Do not persist hash codes into a database and expect them to remain\
    \ stable across different runs of a program.\n\nIdeally, the result of `GetHashCode()`\
    \ should appear to be random. That is, small changes to the input should cause\
    \ large changes to the output, and the result should be distributed roughly evenly\
    \ across all possible integer values. It is difficult, however, to devise a hash\
    \ algorithm that is extremely fast and produces extremely well-distributed output;\
    \ try to find a good middle ground.\n\nFinally, `GetHashCode()` and `Equals()`\
    \ must not throw exceptions. Notice how the code in [LISTING 17.8](#ch17.html_list17_8)\
    \ is careful to never dereference a `null` reference, for example.\n\nTo summarize,\
    \ here are the key principles:\n\n- Equal objects must have equal hash codes.\n\
    - The hash code of an object should not change for the life of the instance (at\
    \ least while it is in the hash table).\n- The hashing algorithm should quickly\
    \ produce a well-distributed hash.\n- The hashing algorithm should avoid throwing\
    \ exceptions in all possible object states.\n\n#### Sorted Collections: `SortedDictionary<TKey,\
    \ TValue>` and `SortedList<T>`\n\nThe sorted collection classes (see [FIGURE 17.4](#ch17.html_ch17fig04))\
    \ store their elements sorted by key for `SortedDictionary<TKey, TValue>` and\
    \ by value for `SortedList<T>`. If we change the code in [LISTING 17.7](#ch17.html_list17_7)\
    \ to use a `SortedDictionary<string, string>` instead of a `Dictionary<string,\
    \ string>`, the output of the program is as appears in [OUTPUT 17.4](#ch17.html_op17_4).\n\
    \n![Images](graphics/17fig04.jpg)\n\n**FIGURE 17.4: Sorted Collections**\n\n**OUTPUT\
    \ 17.4**\n\n```\nError\nInformation\nVerbose\nWarning\n```\n\nNote that the elements\
    \ are sorted into order by key, not by value.\n\nBecause sorted collections must\
    \ do extra work to maintain the sorted order of their elements, insertion and\
    \ removal are typically slightly slower than insertion and removal of values in\
    \ an unordered dictionary.\n\nBecause sorted collections must store their items\
    \ in a particular order, it is possible to access values both by key and by index.\
    \ To access a key or value by its index in the sorted list, use the `Keys` and\
    \ `Values` properties. They return `IList<TKey>` and `IList<TValue>` instances,\
    \ respectively; the resultant collection can be indexed like any list.\n\n####\
    \ Stack Collections: `Stack<T>`\n\n[Chapter 12](#ch12.html_ch12) discussed the\
    \ stack collection (see [FIGURE 17.5](#ch17.html_fig175)). The stack collection\
    \ classes are designed as last in, first out (LIFO) collections. The two key methods\
    \ are `Push()` and `Pop()`.\n\n![Images](graphics/17fig05.jpg)\n\n**FIGURE 17.5:\
    \ `Stack<T>` class diagram**\n\n- `Push()` inserts elements into the collection.\
    \ The elements do not have to be unique.\n- `Pop()` removes elements in the reverse\
    \ order in which they were added.\n\nTo access the elements on the stack without\
    \ modifying the stack, use the `Peek()` and `Contains()` methods. The `Peek()`\
    \ method returns the next element that `Pop()` will retrieve.\n\nAs with most\
    \ collections, you use the `Contains()` method to determine whether an element\
    \ exists anywhere in the stack. As with all collections, it is also possible to\
    \ use a `foreach` loop to iterate over the elements in a stack. This allows you\
    \ to access values from anywhere in the stack. Note, however, that accessing a\
    \ value via the `foreach` loop does not remove it from the stack—only `Pop()`\
    \ provides this functionality.\n\n#### Queue Collections: `Queue<T>`\n\nQueue\
    \ collection classes, shown in [FIGURE 17.6](#ch17.html_ch176), are identical\
    \ to stack collection classes, except that they follow the ordering pattern of\
    \ first in, first out (FIFO). Instead of the `Pop()` and `Push()` methods, they\
    \ use the `Enqueue()` and `Dequeue()` methods, respectively. The queue collection\
    \ behaves like a pipe: You place objects into the queue at one end using the `Enqueue()`\
    \ method and remove them from the other end using the `Dequeue()` method. As with\
    \ stack collection classes, the objects do not have to be unique, and queue collection\
    \ classes automatically increase in size as required. As a queue shrinks, it does\
    \ not necessarily reclaim the storage space previously used, because that would\
    \ make inserting a new element potentially more expensive. If you happen to know\
    \ that a queue will remain the same size for a long time, however, you can hint\
    \ to it that you would like to reclaim storage space by using the `TrimToSize()`\
    \ method.\n\n![Images](graphics/17fig06.jpg)\n\n**FIGURE 17.6: `Queue<T>` class\
    \ diagram**\n\n#### Linked Lists: `LinkedList<T>`\n\n`System.Collections.Generic`\
    \ also supports a linked list collection that enables both forward and reverse\
    \ traversal. [FIGURE 17.7](#ch17.html_ch17fig7) shows the class diagram. (There\
    \ is no corresponding nongeneric type.)\n\n![Images](graphics/17fig07.jpg)\n\n\
    **FIGURE 17.7: `LinkedList<T>` and `LinkedListNode<T>` class diagrams**\n"
  raw: "For example, suppose you wish to create a `Dictionary<Contact, string>` using\
    \ the `Contact` type from [LISTING 17.2](#ch17.html_list17_2). However, you want\
    \ any two `Contact` objects to compare as equal if they have the same first and\
    \ last names, regardless of whether the two objects are reference equal. Much\
    \ as you can provide an implementation of `IComparer<T>` to sort a list, so you\
    \ can provide an implementation of `IEqualityComparer<T>` to determine if two\
    \ keys are to be considered equal. This interface requires two methods: one that\
    \ returns whether two items are equal and one that returns a “hash code” that\
    \ the dictionary can use to facilitate fast indexing. [LISTING 17.8](#ch17.html_list17_8)\
    \ shows an example.\n\n**LISTING 17.8: Implementing `IEqualityComparer<T>`**\n\
    \n```\nusing System.Collections.Generic;\n\npublic class ContactEquality : IEqualityComparer<Contact>\n\
    {\n    public bool Equals(Contact? x, Contact? y)\n    {\n        if(object.ReferenceEquals(x,\
    \ y))\n            return true;\n        if(x == null || y == null)\n        \
    \    return false;\n        return x.LastName == y.LastName &&\n            x.FirstName\
    \ == y.FirstName;\n    }\n\n    public int GetHashCode(Contact x)\n    {\n   \
    \     if(x is null)\n            return 0;\n\n        int h1 = x.FirstName ==\
    \ null ? 0 : x.FirstName.GetHashCode();\n        int h2 = x.LastName == null ?\
    \ 0 : x.LastName.GetHashCode();\n        return h1 * 23 + h2;\n    }\n}\n```\n\
    \nTo create a dictionary that uses this equality comparer, you can use the constructor\
    \ `new Dictionary<Contact, string>(new ContactEquality)`.\n\n**Beginner Topic:\
    \ Requirements of Equality Comparisons**\n\nAs discussed in [Chapter 10](#ch10.html_ch10),\
    \ several important rules apply to the equality and hash code algorithms. Conformance\
    \ to these rules is critical in the context of collections. Just as correctly\
    \ sorting a list requires a custom ordering comparison to provide a total order,\
    \ so, too, does a hash table require certain guarantees to be met by a custom\
    \ equality comparison. The most important requirement is that if `Equals()` returns\
    \ `true` for two objects, `GetHashCode()` must return the same value for those\
    \ two objects. Note that the converse is not true: Two unequal items may have\
    \ the same hash code. (Indeed, there *must* be two unequal items that have the\
    \ same hash code because there are only 2^(32) possible hash codes but many more\
    \ than that number of unequal objects!)\n\nThe second-most important requirement\
    \ is that two calls to `GetHashCode()` on the same item must produce the same\
    \ result for at least as long as the item is in the hash table. Note, however,\
    \ that two objects that “look equal” are not required to give the same hash code\
    \ in two separate runs of a program. For example, it is perfectly legal for a\
    \ given contact to be assigned one hash code today and, two weeks later when you\
    \ run the program a second time, for “the same” contact to be given a different\
    \ hash code. Do not persist hash codes into a database and expect them to remain\
    \ stable across different runs of a program.\n\nIdeally, the result of `GetHashCode()`\
    \ should appear to be random. That is, small changes to the input should cause\
    \ large changes to the output, and the result should be distributed roughly evenly\
    \ across all possible integer values. It is difficult, however, to devise a hash\
    \ algorithm that is extremely fast and produces extremely well-distributed output;\
    \ try to find a good middle ground.\n\nFinally, `GetHashCode()` and `Equals()`\
    \ must not throw exceptions. Notice how the code in [LISTING 17.8](#ch17.html_list17_8)\
    \ is careful to never dereference a `null` reference, for example.\n\nTo summarize,\
    \ here are the key principles:\n\n• Equal objects must have equal hash codes.\n\
    \n• The hash code of an object should not change for the life of the instance\
    \ (at least while it is in the hash table).\n\n• The hashing algorithm should\
    \ quickly produce a well-distributed hash.\n\nThe hashing algorithm should avoid\
    \ throwing exceptions in all possible object states.\n\n#### Sorted Collections:\
    \ `SortedDictionary<TKey, TValue>` and `SortedList<T>`\n\nThe sorted collection\
    \ classes (see [FIGURE 17.4](#ch17.html_ch17fig04)) store their elements sorted\
    \ by key for `SortedDictionary<TKey,` `TValue>` and by value for `SortedList<T>`.\
    \ If we change the code in [LISTING 17.7](#ch17.html_list17_7) to use a `SortedDictionary<string,`\
    \ `string>` instead of a `Dictionary<string`, `string>`, the output of the program\
    \ is as appears in [OUTPUT 17.4](#ch17.html_op17_4).\n\n![Images](graphics/17fig04.jpg)\n\
    \n**FIGURE 17.4: Sorted Collections**\n\n**OUTPUT 17.4**\n\n```\nError\nInformation\n\
    Verbose\nWarning\n```\n\nNote that the elements are sorted into order by key,\
    \ not by value.\n\nBecause sorted collections must do extra work to maintain the\
    \ sorted order of their elements, insertion and removal are typically slightly\
    \ slower than insertion and removal of values in an unordered dictionary.\n\n\
    Because sorted collections must store their items in a particular order, it is\
    \ possible to access values both by key and by index. To access a key or value\
    \ by its index in the sorted list, use the `Keys` and `Values` properties. They\
    \ return `IList<TKey>` and `IList<TValue>` instances, respectively; the resultant\
    \ collection can be indexed like any other list.\n\n#### Stack Collections: `Stack<T>`\n\
    \n[Chapter 12](#ch12.html_ch12) discussed the stack collection classes (see [FIGURE\
    \ 17.5](#ch17.html_ch17fig05)). The stack collection classes are designed as last\
    \ in, first out (LIFO) collections. The two key methods are `Push()` and `Pop()`.\n\
    \n![Images](graphics/17fig05.jpg)\n\n**FIGURE 17.5: `Stack<T>` class diagram**\n\
    \n• `Push()` inserts elements into the collection. The elements do not have to\
    \ be unique.\n\n• `Pop()` removes elements in the reverse order in which they\
    \ were added.\n\nTo access the elements on the stack without modifying the stack,\
    \ you use the `Peek()` and `Contains()` methods. The `Peek()` method returns the\
    \ next element that `Pop()` will retrieve.\n\nAs with most collection classes,\
    \ you use the `Contains()` method to determine whether an element exists anywhere\
    \ in the stack. As with all collections, it is also possible to use a `foreach`\
    \ loop to iterate over the elements in a stack. This allows you to access values\
    \ from anywhere in the stack. Note, however, that accessing a value via the `foreach`\
    \ loop does not remove it from the stack—only `Pop()` provides this functionality.\n\
    \n#### Queue Collections: `Queue<T>`\n\nQueue collection classes, shown in [FIGURE\
    \ 17.6](#ch17.html_ch17fig06), are identical to stack collection classes, except\
    \ that they follow the ordering pattern of first in, first out (FIFO). Instead\
    \ of the `Pop()` and `Push()` methods, they use the `Enqueue()` and `Dequeue()`\
    \ methods, respectively. The queue collection behaves like a pipe: You place objects\
    \ into the queue at one end using the `Enqueue()` method and remove them from\
    \ the other end using the `Dequeue()` method. As with stack collection classes,\
    \ the objects do not have to be unique, and queue collection classes automatically\
    \ increase in size as required. As a queue shrinks, it does not necessarily reclaim\
    \ the storage space previously used, because that would make inserting a new element\
    \ potentially more expensive. If you happen to know that a queue will remain the\
    \ same size for a long time, however, you can hint to it that you would like to\
    \ reclaim storage space by using the `TrimToSize()` method.\n\n![Images](graphics/17fig06.jpg)\n\
    \n**FIGURE 17.6: `Queue<T>` class diagram**\n\n#### Linked Lists: `LinkedList<T>`\n\
    \n`System.Collections.Generic` also supports a linked list collection that enables\
    \ both forward and reverse traversal. [FIGURE 17.7](#ch17.html_ch17fig07) shows\
    \ the class diagram. (There is no corresponding nongeneric type.)\n\n![Images](graphics/17fig07.jpg)\n\
    \n**FIGURE 17.7: `LinkedList<T>` and `LinkedListNode<T>` class diagrams**\n\n\
    ### Providing an Indexer"
