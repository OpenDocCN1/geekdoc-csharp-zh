  trans: "\n\n例如，假设你希望使用 LISTING 17.2 中的 `Contact` 类型创建一个 `Dictionary<Contact, string>`。然而，你希望任何两个\
    \ `Contact` 对象只要它们的姓和名相同，就被认为是相等的，而不论这两个对象是否为引用相等。就像你可以提供 `IComparer<T>` 的实现来对列表进行排序，你也可以提供\
    \ `IEqualityComparer<T>` 的实现来确定两个键是否被视为相等。此接口需要两个方法：一个返回两个项目是否相等，另一个返回字典可用于快速索引的“哈希码”（hash\
    \ code）。LISTING 17.8 显示了一个示例。\n\n**LISTING 17.8: 实现 `IEqualityComparer<T>`**\n\
    \n```csharp\nusing System.Collections.Generic;\n\npublic class ContactEquality\
    \ : IEqualityComparer<Contact>\n{\n    public bool Equals(Contact? x, Contact?\
    \ y)\n    {\n        if(object.ReferenceEquals(x, y))\n            return true;\n\
    \        if(x == null || y == null)\n            return false;\n        return\
    \ x.LastName == y.LastName &&\n            x.FirstName == y.FirstName;\n    }\n\
    \n    public int GetHashCode(Contact x)\n    {\n        if(x is null)\n      \
    \      return 0;\n\n        int h1 = x.FirstName == null ? 0 : x.FirstName.GetHashCode();\n\
    \        int h2 = x.LastName == null ? 0 : x.LastName.GetHashCode();\n       \
    \ return h1 * 23 + h2;\n    }\n}\n```\n\n要创建一个使用此相等性比较器的字典，你可以使用构造函数 `new Dictionary<Contact,\
    \ string>(new ContactEquality)`。\n\n#### 初学者主题：相等性比较的要求\n\n正如 第 10 章 中讨论的，几条重要的规则适用于相等性和哈希码算法。在集合的语境下，遵守这些规则至关重要。正如正确排序列表需要自定义排序比较来提供全序，同样，哈希表也需要自定义相等性比较满足某些保证。最重要的要求是：如果\
    \ `Equals()` 对两个对象返回 `true`，则 `GetHashCode()` 必须对这两个对象返回相同的值。注意，反之是不成立的：两个不相等的项目可能有相同的哈希码。（事实上，*必须*存在两个具有相同哈希码的不相等项目，因为只有\
    \ 2³² 种可能的哈希码，而不相等对象的数量远多于这个数字！）\n\n第二次重要的要求是：对同一个项目两次调用 `GetHashCode()` 在该项目位于哈希表期间必须产生相同的结果。然而，请注意，两个“看起来相等”的对象并不要求在程序的两次独立运行中给出相同的哈希码。例如，今天给给定的联系人分配一个哈希码，而在两周后你第二次运行程序时，给“同一个”联系人分配不同的哈希码是完全合法的。不要将哈希码持久化到数据库中并期望它们在程序的不同运行中保持稳定。\n\
    \n理想情况下，`GetHashCode()` 的结果看起来应该是随机的。也就是说，输入的微小变化应该导致输出巨大变化，且结果应该大致均匀地分布在所有可能的整数范围内。然而，设计一种既极快又能产生极佳分布输出的哈希算法是很的；尝试找到一个良好的折中点。\n\
    \n最后，`GetHashCode()` 和 `Equals()` 不得抛出异常。注意 LISTING 17.8 中的代码是如何谨慎地从不解引用 `null`\
    \ 引用的，例如。\n\n总结一下，这里是核心原则：\n\n- 相等的对象必须具有相同的哈希码。\n- 对象的哈希码在其实例生命周期内不应更改（至少在它位于哈希表期间）。\n\
    - 哈希算法应该快速产生分布良好的哈希值。\n- 哈希算法应避免在所有可能的对象状态下抛出异常。\n\n#### 排序集合：`SortedDictionary<TKey,\
    \ TValue>` 和 `SortedList<T>`\n\n排序集合类（参见 图 17.4）按键存储元素 `SortedDictionary<TKey,\
    \ TValue>`，按值存储元素 `SortedList<T>`。如果我们将 LISTING 17.7 中的代码更改为使用 `SortedDictionary<string,\
    \ string>` 而不是 `Dictionary<string, string>`，则程序的输出将如 输出 17.4 所示。\n\n![Images](img/17fig04.jpg)\n\
    \n**图 17.4：排序集合**\n\n**输出 17.4**\n\n```\nError\nInformation\nVerbose\nWarning\n\
    ```\n\n注意，元素是按键排序的，而不是按值排序。\n\n由于排序集合必须执行额外工作来维护元素的排序顺序，因此插入和删除操作通常比无序字典中的值插入和删除稍慢。\n\
    \n由于排序集合必须以特定顺序存储项目，因此可以通过键也可以通过索引访问值。要通过其在排序列表中的索引访问键或值，请使用 `Keys` 和 `Values`\
    \ 属性。它们分别返回 `IList<TKey>` 和 `IList<TValue>` 实例；结果集合可以像任何列表一样被索引。\n\n#### 栈集合：`Stack<T>`\n\
    \n第 12 章讨论了栈集合（参见 图 17.5）。栈集合类被设计为后进先出（LIFO）集合。两个关键方法是 `Push()` 和 `Pop()`。\n\n\
    ![Images](img/17fig05.jpg)\n\n**图 17.5：`Stack<T>` 类图**\n\n- `Push()` 将元素插入集合中。元素不需要是唯一的。\n\
    - `Pop()` 按照元素添加的相反顺序移除元素。\n\n要在不修改栈的情况下访问栈上的元素，请使用 `Peek()` 和 `Contains()` 方法。`Peek()`\
    \ 方法返回 `Pop()` 将检索的下一个元素。\n\n与大多数集合一样，你使用 `Contains()` 方法来确定元素是否存在于栈的任何位置。与所有集合一样，也可能使用\
    \ `foreach` 循环遍历栈中的元素。这允许你访问栈中任何位置的值。但请注意，通过 `foreach` 循环访问值不会将其从栈中移除——只有 `Pop()`\
    \ 提供此功能。\n\n#### 队列集合：`Queue<T>`\n\n图 17.6 所示的队列集合类与栈集合类相同，不同之处它们遵循先入先行（FIFO）的排序模式。它们分别使用\
    \ `Enqueue()` 和 `Dequeue()` 方法代替 `Pop()` 和 `Push()` 方法。队列集合的行为像水管：你使用 `Enqueue()`\
    \ 方法将对象放入队列的一端，并通过 `Dequeue()` 方法从另一端移除。与栈集合类一样，对象不需要是唯一的，队列集合类根据需要自动增大大小。当队列缩小时，它并不一定会收回之前使用的存储空间，因为这将增加插入新元素的成本。然而，如果你知道队列将在很长时间内保持相同的大小，可以使用\
    \ `TrimToSize()` 方法提示它收回存储空间。\n\n![Images](img/17fig06.jpg)\n\n**图 17.6：`Queue<T>`\
    \ 类图**\n\n#### 链表：`LinkedList<T>`\n\n`System.Collections.Generic` 还支持一种允许正向和反向遍历的链表集合。图\
    \ 17.7 显示了类图。（没有对应的非泛型类型。）\n\n![Images](img/17fig07.jpg)\n\n**图 17.7：`LinkedList<T>`\
    \ 和 `LinkedListNode<T>` 类图**\n\n"
- fmt: "\nArrays, `dictionaries`, and lists all provide an `indexer` as a convenient\
    \ way to get or set a member of a collection based on a key or index. As we’ve\
    \ seen, to use the indexer, you simply put the index (or indices) in square brackets\
    \ after the collection name. It is possible to define your own indexer; [LISTING\
    \ 17.9](#ch17.html_list17_9) shows an example using `Pair<T>`.\n\n### LISTING\
    \ 17.9: Defining an Indexer\n\n```cs\ninterface IPair<T>\n{\n    T First { get;\
    \ }\n    T Second { get; }\n    T this[PairItem index] { get; }              \
    \                  \n}\n\npublic enum PairItem\n{\n    First,\n    Second\n}\n\
    \npublic struct Pair<T> : IPair<T>\n{\n    public Pair(T first, T second)\n  \
    \  {\n        First = first;\n        Second = second;\n    }\n\n    public T\
    \ First { get; }\n    public T Second { get; }\n\n    public T this[PairItem index]\
    \                                  \n    {                                   \
    \                           \n        get                               \n   \
    \     {                                                          \n          \
    \  switch (index)\n            {\n                case PairItem.First:\n     \
    \               return First;\n                case PairItem.Second:\n       \
    \             return Second;\n                default:\n                    throw\
    \ new NotImplementedException(\n                        $\"The enum { index.ToString()\
    \ } has not been implemented\");\n\n            }\n        }\n        // ...\n\
    \    }                                                              \n}\n```\n\
    \nAn indexer is declared much as a property is declared, except that instead of\
    \ the name of the property, you use the keyword `this` followed by a parameter\
    \ list in square brackets. The body is also like a property, with `get` and `set`\
    \ blocks. As [LISTING 17.9](#ch17.html_list17_9) shows, the parameter does not\
    \ have to be an `int`. In fact, the index can take multiple parameters and can\
    \ even be overloaded. This example uses an `enum` to reduce the likelihood that\
    \ callers will supply an index for a nonexistent item.\n\nThe Common Intermediate\
    \ Language (CIL) code that the C# compiler creates from an index operator is a\
    \ special property called `Item` that takes an argument. Properties that accept\
    \ arguments cannot be created explicitly in C#, so the `Item` property is unique\
    \ in this aspect. Any additional member with the identifier `Item`, even if it\
    \ has an entirely different signature, will conflict with the compiler-created\
    \ member, so it will not be allowed.\n\n### Advanced Topic: Assigning the Indexer\
    \ Property Name Using `IndexerName`\n\nAs indicated earlier, the CIL property\
    \ name for an indexer defaults to `Item`. Using the `IndexerNameAttibute`, you\
    \ can specify a different name, however. [LISTING 17.10](#ch17.html_list17_10),\
    \ for example, changes the name to `\"Entry\"`.\n\n### LISTING 17.10: Changing\
    \ the Indexer’s Default Name\n\n```cs\n[System.Runtime.CompilerServices.IndexerName(\"\
    Entry\")]\npublic T this[PairItem index]\n{\n    // ...\n}\n```\n\nThis makes\
    \ no difference to C# callers of the index, but it specifies the name for languages\
    \ that do not support indexers directly.\n\nThe `IndexerNameAttibute` is merely\
    \ an instruction to the compiler to use a different name for the indexer; the\
    \ attribute is not actually emitted into metadata by the compiler, so it is not\
    \ available via reflection.\n\n### Advanced Topic: Defining an Index Operator\
    \ with Variable Parameters\n\nAn index operator can also take a variable parameter\
    \ list. For example, [LISTING 17.11](#ch17.html_list17_11) defines an index operator\
    \ for `BinaryTree<T>`, discussed in [Chapter 12](#ch12.html_ch12) (and again in\
    \ the next section).\n\n### LISTING 17.11: Defining an Index Operator with Variable\
    \ Parameters\n\n```cs\nusing System;\n\npublic class BinaryTree<T> \n{\n    //\
    \ ...\n    public BinaryTree<T> this[params PairItem[]? branches]\n    {\n   \
    \     get\n        {\n            BinaryTree<T> currentNode = this;\n\n      \
    \      // Allow either an empty array or null\n            // to refer to the\
    \ root node\n            int totalLevels = branches?.Length ?? 0;\n          \
    \  int currentLevel = 0;\n\n            while (currentLevel < totalLevels)\n \
    \           {\n                System.Diagnostics.Debug.Assert(branches != null,\n\
    \                    $\"{ nameof(branches) } != null\");\n\n                currentNode\
    \ = currentNode.SubItems[\n                    branches[currentLevel]];\n    \
    \            if (currentNode == null)\n                {\n                   \
    \ // The binary tree at this location is null\n                    throw new IndexOutOfRangeException();\n\
    \                }\n                currentLevel++;\n            }\n         \
    \   return currentNode;\n        }\n    }\n    // ...\n}\n```\n\nEach item within\
    \ `branches` is a `PairItem` and indicates which branch to navigate down in the\
    \ binary tree. For example,\n\n```cs\ntree[PairItem.Second, PairItem.First].Value\n\
    ```\n\nwill retrieve the value located at the second item in the first branch,\
    \ followed by the first branch within that branch.\n\n### Returning `null` or\
    \ an Empty Collection\n\nWhen returning an array or collection, you must indicate\
    \ that there are zero items by returning either `null` or a collection instance\
    \ with no items. The better choice, in general, is to return a collection instance\
    \ with no items. In so doing, you avoid forcing the caller to check for `null`\
    \ before iterating over the collection.\n"
