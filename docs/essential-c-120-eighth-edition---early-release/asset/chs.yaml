  \ 循环语句和相关代码。考虑 21.1 所示的 `for` 循环语句和相关代码。考虑 21.1 所示的 `for` 循环语句和相关代码。（实际上，按照提供的文本逻辑）。考虑\
  \ 21.1 所示的 `for` 循环语句和相关代码。考虑 21.1 所示的 `for` 循环语句和相关代码。\n\n...参数是起始的位数。实际计算与讨论无关。此计算的有趣之处在于它是“极易并行的”（embarrassingly\
  \ parallelizable）；也就是说，非常容易将一个大任务（例如 100 万位数字）分成任意数量的可以并行运行的小任务。\n\n### 列表 21.1：同步计算周率的\
  \ for 循环\n\n```csharp\nusing System;\nusing CSharp;\n\npublic class Program\n{\n\
  \    const int TotalDigits = 100;\n    const int BatchSize = 10;\n\n    public static\
  \ void Main()\n    {\n        string pi = \"\";\n        const int iterations =\
  \ TotalDigits / BatchSize;\n        for(int i = 0; i < iterations; i++)\n      \
  \  {\n            pi += PiCalculator.Calculate(BatchSize, i * BatchSize);\n    \
  \    }\n        Console.WriteLine(pi);\n    }\n}\n\nusing System;\n\npublic static\
  \ class PiCalculator\n{\n    public static string Calculate(int digits, int startingAt)\n\
  \    {\n        // ...\n    }\n}\n```\n\n### 输出 21.1\n\n```\n3.141592653589793238462643383279502884197169399375105820974944592307816\n\
  406286208998628034825342117067982148086513282306647093844609550582231725\n35940812848111745028410270193852110555964462294895493038196442881097565\n\
  933446128475648233786783165271201909145648566923460348610454326648213393\n607260249141273724587006606315588174881520920962829254091715364367892590\n\
  36011133053054882046651138414691194111109433055777336579591195309216111\n\n\n3111179310511854807446237996274956735188575272489122793818301194912\n\
  ```\n\n\n\n\n`for` 循环同步且顺序地执行每次迭代。然而，由于圆周率计算算法将圆周率计算分为相互独立的部分，只要结果按正确的顺序追加，就没有必要按顺序计算这些部分。想象一下，如果能够让此循环的所有迭代并发运行会发生什么呢：每个处理器可以获取单次迭代，并与其执行其他迭代的处理器并行执行任务。鉴于迭代的并行执行，我们可以根据处理器的数量不断缩短执行时间。\n\
  \n任务并行库（TPL）提供了一个方便的方法 `Parallel.For()`，它恰恰可以实现这一点。代码列表 21.2 显示了如何修改 代码列表 21.1 中的顺序单线程程序，以使用该辅助方法。\n\
  \n### 代码列表 21.2：分段并行使用 `For` 循环计算圆周率\n\n```\nusing System;\nusing System.Threading.Tasks;\
  \                                            \nusing AddisonWesley.Michaelis.EssentialCSharp.Shared;\n\
  \n//...\n\npublic class Program\n{\n    const int TotalDigits = 100;\n    const\
  \ int BatchSize = 10;\n\n    public static void Main()\n    {\n        string pi\
  \ = \"\";\n        const int iterations = TotalDigits / BatchSize;\n        string[]\
  \ sections = new string[iterations];\n        Parallel.For(0, iterations, i => \
  \                                \n        {                                   \
  \                             \n            sections[i] = PiCalculator.Calculate(\
  \                        \n                BatchSize, i * BatchSize);          \
  \                     \n        });                                            \
  \                   \n\n        pi = string.Join(\"\", sections);\n        Console.WriteLine(pi);\n\
  \    }\n}\n```\n\n代码列表 21.2 的输出与 输出 21.2 相同；然而，如果你有多个 CPU，其执行时间将显著加快（如果没有则可能会变慢）。`Parallel.For()`\
  \ API 设计得与标准的 `for` 循环相似。第一个参数是 `fromInclusive` 值，第二个是 `toExclusive` 值，最后一个是作为循环体执行的\
  \ `Action<int>`。当使用表达式 Lambda 表达式执行操作时，代码看起来类似于 `for` 语句，不同之处现在每次迭代可能会并行执行。与 `for`\
  \ 循环一样，`Parallel.For()` 的调用在所有迭代完成之前不会结束。换句话说，当执行到达 `string.Join()` 语句时，圆周率的所有部分都计算完毕。\n\
  \n注意，合并圆周率各个部分的代码不再出现在 代码列表 21.2 的迭代（`action`）内部。由于圆周率计算部分很可能不会按顺序完成，每次迭代完成后就追加部分可能会导致顺序错乱。即使顺序不是问题，仍然存在潜在的竞态条件，因为\
  \ 代码列表 21.1 中的 `+=` 操作不是原子的。为了解决这两个问题，圆周率的每个部分都存储在数组中，没有两个或多个迭代会同时数组中的同一个元素。只有当所有圆周率部分计算完成后，`string.Join()`\
  \ 才会将它们合并。换句话说，我们将合并部分推迟到 `Parallel.For()` 循环完成之后。这避免了由于部分尚未计算或部分合并顺序错误而引起的任何竞态条件。\n\
  \nTPL 使用与任务调度中相同的线程池技术，以确保并行循环的良好性能：它会尝试确保 CPU 不被过度调度等。\n\n### 指南\n\n**当所执行的计算可以很容易拆分为许多相互独立的、处理器密集型计算，且可以在任何线程上按任何顺序执行时，请务使用并行循环。**\n\
  \nTPL 还提供了 `foreach` 语句的类似并行版本，如 代码列表 21.3 所示。\n\n### 代码列表 21.3：`foreach` 循环的并行执行\n\
  \n```\nusing System;\nusing System.Collections.Generic;\nusing System.IO;\nusing\
  \ System.Threading.Tasks;                                               \n\npublic\
  \ class Program\n{\n    // ...\n    public static void EncryptFiles(\n        string\
  \ directoryPath, string searchPattern)\n\n    {\n        IEnumerable<string> files\
  \ = Directory.EnumerateFiles(\n            directoryPath, searchPattern,\n     \
  \       SearchOption.AllDirectories);\n\n        Parallel.ForEach(files, fileName\
  \ =>                                \n        {                                \
  \                                  \n            Encrypt(fileName);            \
  \                                 \n        });                                \
  \                                \n    }\n    // ...\n}\n```\n\n在这个示例中，我们调用了一个加密\
  \ `files` 集合中每个文件的方法。它是并行执行的，执行次数取决于 TPL 认为最高效的线程数量。\n\n### 高级主题：TPL 如何调优自身性能\n\n\
  TPL 内部的默认调度器针对线程池，产生了一多种启发式方法，尝试确保任何时刻都有正确数量的线程在执行。它使用的两种启发式方法是**山爬（hill climbing）**和**工作窃取（work\
  \ stealing）**。\n\n山爬算法涉及创建线程来运行任务，然后监控这些任务的性能，以实验性的确定增加更多线程开始导致性能变差的点。一旦达到该点，线程数量就可以减少到产生最佳性能的数量。\n\
  \nTPL 不会将等待执行的顶层任务与任何特定线程关联。然而，如果在线程上运行的任务本身创建了另一个任务，则新创建的任务会自动与该线程关联。当新的子任务最终调度运行时，它通常在创建它的任务的同一线程上运行。工作窃取算法识别出待处理工作异常多或异常少的线程；关联任务过少的线程有时会从等待运行任务过线程中“窃取”任务。\n\
  \n这些算法的关键特性是它们使 TPL 能够动态调优自身性能，以缓解处理器过度调度或调度不足，并在处理器之间平衡工作。\n\nTPL 通常在调优自身性能方面做得很好，但通过提供关于最佳操作方案的提示，你可以帮助做得更好。在第\
  \ 19 章“长时间任务”节中描述的 TPL `TaskCreationOptions.LongRunning` 选项就是此类提示的示例。你还可以显式地告诉任务调度器你认为最适合并行循环的线程数量；更多信息请参见本章后面的。\n\
  \n### 初学者主题：使用 `AggregateException` 处理并行循环异常\n\nTPL 将任务相关的异常保存在 `AggregateException`\
  \ 中，因为给定的任务可能会从其子任务中获取多个异常。并行执行循环也是如此：每次迭代都可能产生异常，因此需要将异常收集到一个聚合异常中。考虑 代码列表 21.4\
  \ 中的示例及其在 输出 21.2 中的结果。\n\n**代码列表 21.4：并行迭代的未处理异常处理**\n\n\n\n\n\n```assembly\nusing\
  \ System;\nusing System.Collections.Generic;\nusing System.IO;\nusing System.Threading.Tasks;\
  \                                        \n\npublic static class Program\n{\n  \
  \  // ...\n    static void EncryptFiles(\n        string directoryPath, string searchPattern)\n\
  \    {\n        IEnumerable<string> files = Directory.EnumerateFiles(\n        \
  \    directoryPath, searchPattern,\n            SearchOption.AllDirectories);\n\
  \        try\n        {\n            Parallel.ForEach(files, fileName =>\n     \
  \       {\n                Encrypt(fileName);\n            });\n        }\n    \
  \    catch (AggregateException exception)                         \n        {\n\
  \            Console.WriteLine(\n                \"ERROR: {0}:\",\n            \
  \    exception.GetType().Name);\n            foreach(Exception item in\n       \
  \         exception.InnerExceptions)                           \n            {\n\
  \                Console.WriteLine(\"  {0} - {1}\",\n                    item.GetType().Name,\
  \ item.Message);\n            }\n        }\n    }\n    // ...\n}\n```\n\n输出 21.2\n\
  \n```\nERROR: AggregateException:\n  UnauthorizedAccessException - Attempted to\
  \ perform an unauthorized\noperation.\n  UnauthorizedAccessException - Attempted\
  \ to perform an unauthorized\noperation.\n  UnauthorizedAccessException - Attempted\
  \ to perform an unauthorized\noperation.\n```\n\n`输出 21.2` 显示在执行 `Parallel.ForEach<T>(...)`\
  \ 循环时发生了三个异常。然而，代码只显示了一个类型为 `System.AggregateException` 的 catch。这些 `UnauthorizedAccessException`\
  \ 是从 `AggregateException` 的 `InnerExceptions` 属性获取的。使用 `Parallel.ForEach<T>()` 循环时，每次迭代都可能抛出异常，因此方法调用抛出的\
  \ `System.AggregateException` 将在其 `InnerExceptions` 属性中包含其中的每一个异常。\n\n### 取消并行循环\n\
  \n与任务不同，任务如果需要阻塞直到完成，则需要显式调用；而并行循环虽然并行执行迭代，但其本身在整个并行循环完成之前不会返回。因此，取消并行循环通常涉及从执行并行循环的线程以外线程调用取消请求。在代码列表\
  \ 21.5 中，我们使用 `Task.Run()` 调用了 `Parallel.ForEach<T>()`。通过这种方式，查询不仅并行并行执行，而且是异步执行，允许代码提示用户“按任意键退出”。\n\
  \n代码列表 21.5: 取消并行循环\n\n```assembly\nusing System;\nusing System.Collections.Generic;\n\
  using System.IO;\nusing System.Threading;\nusing System.Threading.Tasks;\n\npublic\
  \ class Program\n{\n    // ...\n\n    static void EncryptFiles(\n        string\
  \ directoryPath, string searchPattern)\n    {\n\n        string stars =\n      \
  \      \"*\".PadRight(Console.WindowWidth - 1, '*');\n\n        IEnumerable<string>\
  \ files = Directory.GetFiles(\n           directoryPath, searchPattern,\n      \
  \     SearchOption.AllDirectories);\n\n        CancellationTokenSource cts =   \
  \                                 \n            new CancellationTokenSource(); \
  \                              \n        ParallelOptions parallelOptions =     \
  \                           \n            new ParallelOptions { CancellationToken\
  \ = cts.Token };       \n        cts.Token.Register(                           \
  \                   \n            () => Console.WriteLine(\"Canceling...\"));  \
  \                  \n\n        Console.WriteLine(\"Press ENTER to exit.\");\n\n\
  \        Task task = Task.Run(() =>\n            {\n                try\n      \
  \          {\n                    Parallel.ForEach(\n                        files,\
  \ parallelOptions,                          \n                        (fileName,\
  \ loopState) =>\n                        {\n                            Encrypt(fileName);\n\
  \                        });\n                }\n                catch(OperationCanceledException)\
  \ { }\n            });\n\n        // 等待用户输入\n        Console.ReadLine();\n\n   \
  \     // 取消查询\n        cts.Cancel();                                           \
  \         \n        Console.Write(stars);\n        task.Wait();\n    }\n    // ...\n\
  }\n```\n\n并行循环使用了与任务相同的取消令牌模式。通过调用具有类型 `ParallelOptions` 类型参数的 `ForEach()` 方法重载，可以将从\
  \ `CancellationTokenSource` 获取的令牌与并行循环关联。该对象包含了取消令牌。\n\n请注意，如果你取消了并行循环操作，将通过检查 `IsCancellationRequested`\
  \ 属性防止任何尚未启动的迭代启动。正在执行的迭代将运行到各自的终止点。此外，即使在所有迭代完成后调用 `Cancel()`，仍然会引起注册的取消事件（通过 `cts.Token.Register()`）执行。\n\
  \n`ForEach()` 方法能够确认循环已取消的唯一手段是通过 `OperationCanceledException`。鉴于此示例中的取消操作是预期的，该异常被捕获并忽略，允许应用程序显示“Canceling…”，随后输出一行星号后退出。\n\
  \n### 高级主题：并行循环选项\n\n虽然通常没有必要，但通过 `Parallel.For()` 和 `Parallel.ForEach<T>()` 循环重载中的\
  \ `ParallelOptions` 参数，可以控制最大并行度（即同时调度运行的线程数）。在某些特定情况下，开发者可能更了解特定的算法或情况，使得更改最大并行度是有意义的。这些情况包括：\n\
  \n- 希望禁用并行化以便于调试或分析的场景。将最大并行度设置为 1 可确保循环迭代不会并发运行。\n- 提前知道并行度将受外部因素（如硬件限制）限制的情况。例如，如果你的并行操作涉及使用多个\
  \ USB 端口，创建比可用端口更多的线程可能没有意义。\n- 具有长时间运行迭代的场景（例如分钟或几小时）。线程池无法区分长时间运行迭代和阻塞操作，因此可能会引入许多新线程，而所有线程都会被\
  \ `for` 循环消耗。这会导致线程随时间增量增长，导致进程中出现大量的线程。\n\n以此此类等。要控制最大并行度，请使用 `ParallelOptions`\
  \ 对象的 `MaxDegreeOfParallelism` 属性。\n\n你还可以使用 `ParallelOptions` 对象的 `TaskScheduler`\
  \ 属性指定在调度与迭代关联的任务时使用的自定义任务调度器。例如，你可能有一个异步事件处理程序来响应用户点击“下一步”按钮。如果用户多次点击该按钮，你可能希望使用自定义任务调度器，优先考虑最近创建的任务，而不是优先考虑等待最长的任务。任务调度器提供了一种指定任务之间如何相互执行的方法。\n\
  \n\n\n\n与标准的 `for` 循环一样，`Parallel.For()` 循环支持“中断”（breaking）概念以退出循环并取消任何后续迭代。然而，在并行\
  \ `for` 执行的上下文中，`break` 表示在中断迭代之后不应启动任何*新*迭代。但是，所有正在执行的迭代都将运行完毕。\n\n要中断并行循环，你可以提供一个取消标记（cancellation\
  \ token）并在另一个线程上取消它，如前面的“高级主题：并行循环选项”所述。你还可以使用 `Parallel.For()` 方法的重载版本，其循环体委托接受两个参数：索引和一个\
  \ `ParallelLoopState` 对象。希望中断循环的迭代可以调用传递给委托的循环状态对象上的 `Break()` 或 `Stop()` 方法。`Break()`\
  \ 方法表示不需要执行索引值大于当前值的更多迭代；`Stop()` 方法表示不再需要运行任何迭代。\n\n例如，假设你有一个并行执行十次迭代的 `Parallel.For()`\
  \ 循环。其中某些迭代的运行速度可能比其他迭代快，且任务调度器不保证它们按任何特定顺序运行。假设第一次迭代已经完成；迭代 3、5、7 和 9 正在“执行中”，被调度到四个不同的线程；而迭代\
  \ 5 和 7 都调用了 `Break()`。在这种情况下，迭代 6 和 8 将永远不会开始，但迭代 2 和 4 仍会被调度运行。迭代 3 和 9 将运行完毕，因为它们在中断发生时已经启动了。\n\
  \n`Parallel.For()` 和 `Parallel.ForEach<T>()` 方法返回 `ParallelLoopResult` 对象的引用，该对象包含了循环期间发生情况的有用信息。此结果对象具有以下属性：\n\
  \n* `IsCompleted` 返回一个布尔值，指示所有迭代是否已启动。\n* `LowestBreakIteration` 标识执行了 break 的最低迭代。其值类型为\
  \ `long?`，值为 `null` 表示没有遇到 break 语句。\n\n回到十次迭代的示例，`IsCompleted` 属性将返回 `false`，而\
  \ `LowestBreakIteration` 将返回值 `5`。\n\n### 并行运行 LINQ 查询\n\n就像可以使用 `Parallel.For()`\
  \ 并行执行循环一样，也可以使用并行 LINQ API（简称为 PLINQ）并行执行 LINQ 查询。一个简单的非并行 LINQ 表达式示例在 LISTING\
  \ 21.6 中；在 LISTING 21.7 中，我们将其修改为并行运行。\n\n**LISTING 21.6: LINQ `Select()`**\n\n\
  ```csharp\nusing System.Collections.Generic;\nusing System.Linq;\npublic class Program\n\
  {\n    // ...\n    public static List<string>\n      Encrypt(IEnumerable<string>\
  \ data)\n    {\n        return data.Select(\n            item => Encrypt(item)).ToList();\n\
  \    }\n    // ...\n}\n```\n\n在 LISTING 21.6 中，LINQ 查询使用 `Select()` 标准查询运算符加密字符串序列中的每个字符串，并将生成的序列转换为列表。这看起来像是一个“尴尬并行”的操作；每个加密操作可能是一个高延迟的\
  \ CPU 密集型操作，可以分配到另一个 CPU 上的工作线程上。\n\nLISTING 21.7 显示了如何修改 LISTING 21.6 以使加密字符串的代码并行执行。\n\
  \n**LISTING 21.7: 并行 LINQ `Select()`**\n\n```csharp\nusing System.Linq;\n\npublic\
  \ class Program\n{\n    // ...\n    public static List<string>\n      Encrypt(IEnumerable<string>\
  \ data)\n    {\n        return data.AsParallel().Select(                       \
  \             \n            item => Encrypt(item)).ToList();\n    }\n    // ...\n\
  }\n```\n\n如 LISTING 21.7 所示，启用并行支持的变化非常小！它涉及的只是一个标准查询运算符 `AsParallel()`，可以在静态类 `System.Linq.ParallelEnumerable`\
  \ 中找到。这个简单的扩展方法告诉运行时它可以并行执行查询。结果是，在具有多个可用 CPU 的机器上，执行查询的总时间可以显著缩短。\n\n`System.Linq.ParallelEnumerable`\
  \ 是为了在 .NET Framework 4.0 中启用 PLINQ 而引入的引擎，它包含了 `System.Linq.Enumerable` 中可用查询运算符的超集。因此，它为所有常见的查询运算符提供了可能性能改进的\
  \ API，包括用于排序、过滤 (`Where()`）、投影 (`Select()`）、连接、分组和聚合的运算符。LISTING 21.8 显示了如何进行并行排序。\n\
  \n**LISTING 21.8: 使用标准查询运算符的并行 LINQ**\n\n```csharp\n//...\nOrderedParallelQuery<string>\
  \ parallelGroups =                             \n    data.AsParallel().OrderBy(item\
  \ => item);                              \n\n// 显示剩余项的总计数\n// 确保与原始计数匹配\nif (data.Count()\
  \ != parallelGroups.Sum(\n        item => item.Length))\n{\n    throw new Exception(\"\
  data.Count() != parallelGroups.Sum(item => item.Length)\");\n}\n// ...\n```\n\n\
  `Parallel.For()` 和 `Parallel.ForEach<T>()` 方法返回 `ParallelLoopResult` 对象的引用，该对象包含了循环期间发生情况的有用信息。此结果对象具有以下属性：\n\
  \n* `IsCompleted` 返回一个布尔值，指示所有迭代是否已启动。\n* `LowestBreakIteration` 标识执行了 break 的最低迭代。其值类型为\
  \ `long?`，值为 `null` 表示没有遇到 break 语句。\n\n（注：原文后续部分存在大量重复段落，此处已根据要求不进行重复输出）\n\n\n\n\
  \n正如预期的，取消请求模式也适用于 PLINQ 查询。列表 21.10（带有输出 21.3）提供了一个示例。与并行循环一样，取消的 PLINQ 查询将抛出 `System.OperationCanceledException`。同样与并行循环一样，执行\
  \ PLINQ 查询是在调用线程上的同步操作。因此，一种常用的技术是将并行查询封装在另一个线程上运行的任务中，以便当前线程在必要时取消它——这在列表 21.5\
  \ 中使用了相同的解决方案。\n\n### 列表 21.10: 取消 PLINQ 查询\n\n```csharp\nusing System;\nusing System.Collections.Generic;\n\
  using System.Linq;\nusing System.Threading;\nusing System.Threading.Tasks;\n\npublic\
  \ static class Program\n{\n    public static List<string> ParallelEncrypt(\n   \
  \     List<string> data,\n        CancellationToken cancellationToken)\n    {\n\
  \        int govener = 0;\n        return data.AsParallel().WithCancellation(\n\
  \            cancellationToken).Select(\n                (item) =>\n           \
  \     {\n                    if (Interlocked.CompareExchange(\n                \
  \        ref govener, 0, 100) % 100 == 0)\n                    {\n             \
  \           Console.Write('.');\n                    }\n                    Interlocked.Increment(ref\
  \ govener);\n                    return Encrypt(item);\n                }).ToList();\n\
  \    }\n\n    public static async Task Main()\n    {\n        ConsoleColor originalColor\
  \ = Console.ForegroundColor;\n        List<string> data = Utility.GetData(100000).ToList();\n\
  \n        using CancellationTokenSource cts =\n            new CancellationTokenSource();\n\
  \n        Task task = Task.Run(() =>\n        {\n            data = ParallelEncrypt(data,\
  \ cts.Token);\n        }, cts.Token);\n\n        Console.WriteLine(\"Press any key\
  \ to Exit.\");\n        Task<int> cancelTask = ConsoleReadAsync(cts.Token);\n\n\
  \        try\n        {\n            Task.WaitAny(task, cancelTask);\n         \
  \   // 取消尚未完成的任务。\n            cts.Cancel();\n            await task;\n\n      \
  \      Console.ForegroundColor = ConsoleColor.Green;\n            Console.WriteLine(\"\
  \\nCompleted successfully\");\n\n        }\n        catch (OperationCanceledException\
  \ taskCanceledException)\n        {\n            Console.ForegroundColor = ConsoleColor.Red;\n\
  \            Console.WriteLine(\n                $\"\\nCancelled: { taskCanceledException.Message\
  \ }\");\n        }\n        finally\n        {\n            Console.ForegroundColor\
  \ = originalColor;\n        }\n    }\n\n    private static async Task<int> ConsoleReadAsync(\n\
  \        CancellationToken cancellationToken = default)\n    {\n        return await\
  \ Task.Run(async () =>\n        {\n            const int maxDelay = 1025;\n    \
  \        int delay = 0;\n            while (!cancellationToken.IsCancellationRequested)\n\
  \            {\n                if (Console.KeyAvailable)\n                {\n \
  \                   return Console.Read();\n                }\n                else\n\
  \                {\n                    await Task.Delay(delay, cancellationToken);\n\
  \                    if (delay < maxDelay) delay *= 2 + 1;\n                }\n\
  \            }\n            cancellationToken.ThrowIfCancellationRequested();\n\
  \            throw new InvalidOperationException(\n                \"Previous line\
  \ should throw preventing this from ever executing\");\n        }, cancellationToken);\n\
  \    }\n\n    private static string Encrypt(string item)\n    {\n        Cryptographer\
  \ cryptographer = new Cryptographer();\n        return System.Text.Encoding.UTF8.GetString(cryptographer.Encrypt(item));\n\
  \    }\n}\n```\n\n### 输出 21.3\n\n```\nPress any key to Exit.\n........................................................................\n\
  ........................................................................\n.............................................................\n\
  .....................................\nCancelled: The query has been canceled via\
  \ the token supplied to WithCancellation.\n```\n\n与并行循环或任务一样，取消 PLINQ 查询需要一个 `CancellationToken`，该令牌可以通过\
  \ `CancellationTokenSource` 获取。然而，并不是重载每个 PLINQ 查询来支持取消令牌，`IEnumerable.AsParallel()`\
  \ 方法返回的 `ParallelQuery<T>` 对象包含一个 `WithCancellation()` 扩展方法，该方法只需接收一个 `CancellationToken`。因此，在\
  \ `CancellationTokenSource` 对象上调用 `Cancel()` 将请求并行查询取消——因为它检查了 `CancellationToken`\
  \ 上的 `IsCancellationRequested` 属性。\n\n如所述，取消 PLINQ 查询将抛出异常而不是返回完整结果。处理可能取消的 PLINQ\
  \ 查询的一种常用技术是将查询封装在 `try` 块中并捕获 `OperationCanceledException`。另一种常用技术（在列表 21.10 中使用）是将\
  \ `CancellationToken` 同时传递给 `ParallelEncrypt()` 并作为 `Run()` 的第二个参数。这将导致 `task.Wait()`\
  \ 抛出一个 `AggregateException`，其 `InnerException` 属性将设置为 `TaskCanceledException`。然后可以像捕获任何其他并行操作的异常一样，捕获该聚合异常。\n\
  \n## 总结\n\n在本章中，我们讨论了如何使用 TPL `Parallel` 类进行 `for` 和 `foreach` 类型的迭代。此外，通过 `System.Linq`\
  \ 中包含的 `AsParallel()` 扩展方法，我们演示了如何并行执行 LINQ 查询。实现此点的易用性有助于你意识到，并行迭代是引入并行执行的最简单的方法之一。尽管仍然需要注意竞态条件和死锁，但如果你不在并行循环的迭代内部共享数据，这些问题发生的概率要远低于直接处理任务。剩下的工作就是识别出可以从并行执行中受益的\
  \ CPU 密集型代码块。\n\n"
