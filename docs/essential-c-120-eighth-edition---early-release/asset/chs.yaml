  \ 委托与 Lambda 表达式\n该内容正在开发中。\n\n## 14. 事件\n该内容正在开发中。\n\n## 15. 带有标准查询运算符的集合接口\n\n\
  通过一组扩展方法和 Lambda 表达式，被称为 **语言集成查询** (**LINQ**) 的编程 API 为处理集合提供了远优的 API。(1)事实上，在本书的早期版本中，集合章节紧接在泛型之后，并在委托章节之前。然而，Lambda\
  \ 表达式对于 LINQ 来说是核心，以至于在不先介绍委托（Lambda 表达式的基础）的情况下无法涵盖集合。现在你已经在前面的两个章节中掌握了 Lambda\
  \ 表达式的基础，我们可以深入探讨集合——这是一个跨越三个章节的话题。在本章中重点是**标准查询运算符**——一种通过直接调用扩展方法来利用 LINQ 的手段。\n\
  \n1。C# 3.0 在集合中引入的属于 LINQ 的重大功能。\n\n\n\n\n\n在介绍了集合初始化器后，本章将涵盖各种集合接口，并探索它们之间的相互关系。这是理解集合的基础，因此你应该勤奋地学习这些材料。集合接口部分包含了实现标准查询操作符的\
  \ `IEnumerable<T>` 扩展方法^(2)。\n\n2. 在 C# 3.0 中引入。\n\n集合相关的类和接口分为两类：支持泛型的和不支持泛型的。本章主要讨论泛型集合接口。只有当你编写需要与早期版本的运行时（runtime）进行互操作的组件时，才应该使用不支持泛型的集合类。这是因为非泛型形式中可用的所有内容都有一个强类型的泛型替代品。尽管这些概念仍然适用于两种形式，但我们不会显式地讨论非泛型版本^(3)。\n\
  \n3. 实际上，NET Standards 和 .NET Core 甚至不包含非泛型集合。\n\n![Images](img/15fig00.jpg)\n\n\
  本章以对匿名类型的深入讨论结束——这是我们在第 3 章 的几个高级主题章节中简要提到过的。匿名类型有趣的地方在于，它们已经被元组（tuples）^(4) 所取代——我们将在章末进一步讨论这个主题。\n\
  \n4. 从 C# 7.0 开始。\n\n### 集合初始化器\n\n`集合初始化器`允许程序员在实例化时，以类似于数组声明的方式构造一个具有初始成员集合的集合。在集合初始化可用之前，必须在集合实例化后显式地向集合添加元素——使用类似\
  \ `System.Collections.Generic.ICollection<T>` 的 `Add()` 方法。通过集合初始化，`Add()` 调用由 C#\
  \ 编译器生成，而不是由开发者显式编写代码。LISTING 15.1 显示了如何使用集合初始化器初始化集合。\n\n**列表 15.1: 集合初始化**\n\n\
  ```\nusing System;\nusing System.Collections.Generic;\n\npublic class Program\n\
  {\n    public static void Main()\n    {\n        List<string> sevenWorldBlunders;\n\
  \        sevenWorldBlunders = new List<string>()\n        {\n            // 来自甘地的语言\n\
  \            \"Wealth without work\",\n            \"Pleasure without conscience\"\
  ,\n            \"Knowledge without character\",\n            \"Commerce without\
  \ morality\",\n            \"Science without humanity\",\n            \"Worship\
  \ without sacrifice\",\n            \"Politics without principle\"\n        };\n\
  \n        Print(sevenWorldBlunders);\n    }\n\n    private static void Print<T>(IEnumerable<T>\
  \ items)\n    {\n        foreach(T item in items)\n        {\n            Console.WriteLine(item);\n\
  \        }\n    }\n}\n```\n\n这种语法不仅与数组初始化相似，也与构造函数后面紧跟大括号的对象初始化器相似。如果构造函数中没有传递参数，则数据类型后面的括号是可选的（就像对象初始化器一样）。\n\
  \n集合初始化器要成功编译需要一些基本要求。理想情况下，应用集合初始化器的集合类型应该是实现了 `System.Collections.Generic.ICollection<T>`\
  \ 的类型。这确保了集合包含一个编译器生成的代码可以调用的 `Add()` 方法。然而，也存在一种宽松的要求，只需要求存在一个或多个 `Add()` 方法，可以作为扩展方法^(5)\
  \ 或作为实现 `IEnumerable` 的类型的实例方法存在——即使集合没有实现 `ICollection<T>`。`Add()` 方法接收的参数需要与集合初始化器中指定的值兼容。\n\
  \n5. 从 C# 6.0 开始。\n\n对于字典，集合初始化器的语法稍微复杂一些，因为字典中的每个元素都需要键（key）和值（value）。这种语法在列表 15.2\
  \ 中所示。\n\n**列表 15.2: 使用集合初始化器初始化 `Dictionary<>`**\n\n```\nusing System;\nusing System.Collections.Generic;\n\
  // ...\n#if !PRECSHARP6\n        Dictionary<string, ConsoleColor> colorMap =\n \
  \           new Dictionary<string, ConsoleColor>\n            {\n              \
  \  [\"Error\"] = ConsoleColor.Red,\n                [\"Warning\"] = ConsoleColor.Yellow,\n\
  \                [\"Information\"] = ConsoleColor.Green,\n                [\"Verbose\"\
  ] = ConsoleColor.White\n            };\n#else\n        Dictionary<string, ConsoleColor>\
  \ colorMap =\n            new Dictionary<string, ConsoleColor>\n            {\n\
  \                {\"Error\", ConsoleColor.Red },\n                {\"Warning\",\
  \ ConsoleColor.Yellow },\n                {\"Information\", ConsoleColor.Green },\n\
  \                {\"Verbose\", ConsoleColor.White}\n            };\n#endif\n```\n\
  \n列表 15.2 包含了两种不同版本的初始化。第一种演示了一种新语法，^(6) 它表达了字典的意图。第二种语法^(7) 使用大括号将名称和值配对。\n\n6.\
  \ 在 C# 6.0 中引入。\n\n7. 在 C# 及后续版本中有效。\n\n### 什么是类集合：`IEnumerable`\n\n根据定义，.NET 中的集合是一个至少实现了\
  \ `IEnumerable` 的类。这个接口至关重要，因为实现 `IEnumerable` 是支持遍历集合的最小需求。\n\n第 4 章 显示了如何使用 `foreach`\
  \ 语句遍历数组。这种语法非常简单，并且避免了需要知道元素个数的复杂性。然而，运行时并不直接支持 `foreach` 语句。相反，C# 编译器按照本节描述的方式转换代码。\n\
  \n#### 数组的 `foreach`\n\n列表 15.3 演示了一个简单的 `foreach` 循环，遍历整数数组，然后将每个整数打印到控制台。\n\n\
  **列表 15.3: 数组的 `foreach`**\n\n```\nint[] array = new int[] { 1, 2, 3, 4, 5, 6 };\n\
  \nforeach(int item in array)\n{\n    Console.WriteLine(item);\n}\n```\n\n从这段代码中，C#\
  \ 编译器创建了 `for` 循环的 CIL 等效代码，如列表 15.4 所示。\n\n**列表 15.4: 数组的 `foreach` 编译实现**\n\n\
  ```\nint[] tempArray;\nint[] array = new int[] { 1, 2, 3, 4, 5, 6 };\n\ntempArray\
  \ = array;\nfor(int counter = 0; (counter < tempArray.Length); counter++)\n{\n \
  \   int item = tempArray[counter];\n\n    Console.WriteLine(item);\n}\n```\n\n在这个示例中，注意\
  \ `foreach` 依赖于对 `Length` 属性和索引操作符（`[]`）的支持。通过 `Length` 属性，C# 编译器可以使用 `for` 遍历数组中的每个元素。\n\
  \n\n\n\n\n### 使用 `IEnumerable<T>` 配合 `foreach`\n\n尽管 LISTING 15.4 所示的代码在长度固定且始终支持索引操作符的数组上运行良好，但并非所有类型的集合都有已知的元素数量。此外，许多集合类（包括\
  \ `Stack<T>`、`Queue<T>` 和 `Dictionary<TKey, TValue>` 类）并不支持通过索引检索元素。因此，需要一种更通用的方法来对元素集合进行迭代。迭代器模式（iterator\
  \ pattern）提供了这种能力。假设你可以确定第一个元素和下一个元素，那么知道计数和支持通过索引检索元素就是必要的。\n\n`System.Collections.Generic.IEnumerator<T>`\
  \ 和非泛型的 `System.Collections.IEnumerator` 接口的设计是为了通过迭代器模式来遍历元素集合，而不是 LISTING 15.4\
  \ 所示的长度-索引模式。它们的关系类图出现在 FIGURE 15.1 中。\n\n![Images](img/15fig01.jpg)\n\n**图 15.1：`IEnumerator<T>`\
  \ 和 `IEnumerator` 接口的类图**\n\n`IEnumerator<T>` 继承自 `IEnumerator`，三个成员。第一个是 `bool\
  \ MoveNext()`。使用此方法，你可以从集合中的一个元素移动到下一个元素，同时检测何时已遍历完所有项目。第二个成员是一个名为 `Current` 的只读属性，它返回当前处理的元素。`Current`\
  \ 在 `IEnumerator<T>` 中被重载，提供了其特定类型的实现。通过集合类中的这两个成员，可以简单地使用 `while` 循环对集合进行迭代，如 LISTING\
  \ 15.5 所示。（`Reset()` 方法通常会抛出 `NotImplementedException`，因此永远不被调用。如果你需要重新开始枚举，只需创建一个新的迭代器。）\n\
  \n**LISTING 15.5：使用 `while` 遍历集合**\n\n```\nSystem.Collections.Generic.Stack<int>\
  \ stack =\n    new System.Collections.Generic.Stack<int>();\nint number;\n// ...\n\
  \n// 这段代码是概念性的，不是实际代码\n#if ConceptualCode\nwhile(stack.MoveNext())\n{   \n    number\
  \ = stack.Current();\n    Console.WriteLine(number);\n}\n#endif // ConceptualCode\n\
  ```\n\n在 LISTING 15.5 中，`MoveNext()` 方法在移动到集合末之后返回 `false`。这消除了在循环时计数元素的需求。\n\n\
  LISTING 15.5 使用 `System.Collections.Generic.Stack<T>` 作为集合类型。存在许多其他集合类型；这只是一个示例。`Stack<T>`\
  \ 的关键特征是其设计为后进先出（LIFO）集合。注意类型参数 `T` 标识集合中所有项目的类型。在集合中收集一种类型的对象是泛型集合的一个关键特征。程序员在向集合中添加、删除或访问项目时，必须知道集合中的数据类型。\n\
  \n上一个示例展示了 C# 编译器输出的大致，但它实际上并没有以那种方式编译，因为它遗漏了关于实现的两个重要细节：交错执行和错误处理。\n\n#### 状态共享\n\
  \n\n\n如 LISTING 15.5 这样的实现的问题是，如果两个这样的循环交错执行——一个 `foreach` 在另一个内部，且都使用同一个集合——集合必须维护当前元素的状态指示器，以便在调用\
  \ `MoveNext()` 时，可以确定下一个元素。在这种情况下，一个交错循环可能会影响另一个。（由多个线程执行的循环也是如此。）\n\n为了解决这个问题，集合类并不直接支持\
  \ `IEnumerator<T>` 和 `IEnumerator` 接口。相反，如 FIGURE 15.1 所示，有一个第二个接口称为 `IEnumerable<T>`，其唯一的方法是\
  \ `GetEnumerator()`。该方法的目的是返回一个支持 `IEnumerator<T>` 的对象。集合类不再维护状态，而是由另一个类（通常是嵌套类，以便它可以访问集合的内部结构）来支持\
  \ `IEnumerator<T>` 接口并保持迭代循环的状态。迭代器就像序列中的“光标”或“书签”。你可以有多个书签，移动其中每一个都可以独立于其他书签遍历集合。使用这种模式，C#\
  \ 相当于 `foreach` 循环的代码看起来像 LISTING 15.6 所示的代码。\n\n**LISTING 15.6：在迭代期间维护状态的独立迭代器**\n\
  \n```\nSystem.Collections.Generic.Stack<int> stack =\n    new System.Collections.Generic.Stack<int>();\n\
  int number;\nSystem.Collections.Generic.Stack<int>.Enumerator\n  enumerator;\n\n\
  // ...\n\n// 如果显式实现 IEnumerable<T>，\n// 则需要进行强制类型转换\n// ((IEnumerable<int>)stack).GetEnumerator();\n\
  enumerator = stack.GetEnumerator();\nwhile(enumerator.MoveNext())\n{\n    number\
  \ = enumerator.Current;\n}\n```\n\n#### 进阶主题：迭代后的清理\n\n由于实现 `IEnumerator<T>` 接口的类维护状态，有时你需要在循环结束后清理状态（无论所有迭代完成还是抛出了异常）。为了实现这一点，`IEnumerator<T>`\
  \ 继承自 `IDisposable`。`IEnumerator` 并不一定实现 `IDisposable`，但如果实现了，`Dispose()` 也会被调用。这意味着在\
  \ `foreach` 循环结束后可以调用 `Dispose()`。因此，C# 对应的公共中间语言（CIL）代码像 LISTING 15.7。\n\n**LISTING\
  \ 15.7：对集合执行 foreach 的编译结果**\n\n```\nSystem.Collections.Generic.Stack<int> stack\
  \ =\n    new System.Collections.Generic.Stack<int>();\nSystem.Collections.Generic.Stack<int>.Enumerator\
  \ enumerator;\nIDisposable disposable;\n\nenumerator = stack.GetEnumerator();\n\
  try\n{\n    int number;\n    while(enumerator.MoveNext())\n    {\n        number\
  \ = enumerator.Current;\n        Console.WriteLine(number);\n    }\n}\nfinally\n\
  {\n    // 对于 IEnumerator<T> 使用显式转换\n    disposable = (IDisposable)enumerator;\n\
  \    disposable.Dispose();\n\n    // IEnumerator 使用 as 运算符，除非编译时已知 IDisposable 支持\n\
  \    // disposable = (enumerator as IDisposable);\n    // if (disposable != null)\n\
  \    //     disposable.Dispose();\n    // }\n}\n```\n\n注意，由于 `IDisposable` 接口支持\
  \ `Enumerator<T>`，`using` 语句可以将 LISTING 15.7 中的代码简化为 LISTING 15.8 所示。\n\n**LISTING\
  \ 15.8：使用 using 进行错误处理和资源清理**\n\n```\nSystem.Collections.Generic.Stack<int> stack\
  \ =\n    new System.Collections.Generic.Stack<int>();\nint number;\n\nusing (\n\
  \    System.Collections.Generic.Stack<int>.Enumerator\n        enumerator = stack.GetEnumerator())\
  \                         \n{\n    while (enumerator.MoveNext())\n    {\n      \
  \  number = enumerator.Current;\n        Console.WriteLine(number);\n    }\n}\n\
  ```\n\n然而，记住 CIL 不直接支持 `using` 关键字。因此，LISTING 15.7 中的代码实际上是 `foreach` CIL 代码更准确的\
  \ C# 表示。\n\n\n\n\n\nC# 并不要求实现 `IEnumerable`/`IEnumerable<T>` 即可使用 `foreach` 遍历某种数据类型。相反，编译器使用一种名为**鸭子类型**（duck\
  \ typing）的概念：它会寻找一个 `GetEnumerator()` 方法，该方法返回的类型具有 `Current` 属性和 `MoveNext()` 方法。鸭子类型通过名称进行搜索，而不是依赖接口或对方法的显式调用。（“鸭子类型”这一说法源于一个奇特的想法：如果一个对象要被视为鸭子，它只需要实现一个\
  \ `Quack()` 方法；而不需要实现 `IDuck` 接口。）如果鸭子类型未能找到枚举模式的合适实现，编译器将检查该集合是否实现了相应的接口。\n\n##\
  \ 在 `foreach` 迭代期间修改集合\n\n第 4 章 展示了编译器如何防止对 `foreach` 变量（`number`）进行赋值。如列表 15.7\
  \ 所示，对 `number` 赋值不会改变集合元素本身，因此 C# 编译器完全阻止了此类赋值。\n\n此外，在 `foreach` 循环执行期间，集合内的元素计数或项目本身通常都无法修改。例如，如果你在\
  \ `foreach` 循环内部调用了 `stack.Push(42)`，将无法确定 `iterator` 应该忽略还是包含对 `stack` 的更改——换句话说，`iterator`\
  \ 应该是遍历新添加的项，还是忽略它并假设状态与实例化时相同。\n\n由于这种歧义，如果在 `foreach` 循环中修改了集合，在访问枚举器时通常会抛出 `System.InvalidOperationException`\
  \ 类型的异常。该异常报告集合在枚举器实例化后被修改了。\n\n## 标准查询运算符\n\n除了 `System.Object` 的方法外，任何实现 `IEnumerable<T>`\
  \ 的类型仅需实现另外一个方法，即 `GetEnumerator()`。然而，这样做使得所有实现 `IEnumerable<T>` 的类型都可以使用 50 多个方法（不包括任何重载），而且这是在不需要显式实现\
  \ `GetEnumerator()` 方法之外的任何方法的情况下实现的。额外的功能通过扩展方法^(8) 提供，并存在于 `System.Linq.Enumerable`\
  \ 类中。因此，包含 `System.Linq` 的 `using` 声明即可使这些方法可用。\n\n8。从 C# 3.0 开始。\n\n`IEnumerable<T>`\
  \ 上的每个方法都是**标准查询运算符**；它为在其操作的集合提供了查询能力。在接下来的章节中，我们将检查这些标准查询运算符中最著名的几个。这些示例中的许多将依赖\
  \ `Inventor` 和/或 `Patent` 类，这两个类都定义在列表 15.9 中，并有输出 15.1。\n\n**列表 15.9: 用于标准查询运算符的示例类**\n\
  \n```\nusing System;\nusing System.Collections.Generic;\n\npublic class Program\n\
  {\n    public static void Main()\n    {\n        IEnumerable<Patent> patents = PatentData.Patents;\n\
  \        Print(patents);\n\n        Console.WriteLine();\n\n        IEnumerable<Inventor>\
  \ inventors = PatentData.Inventors;\n        Print(inventors);\n    }\n\n    private\
  \ static void Print<T>(IEnumerable<T> items)\n    {\n        foreach(T item in items)\n\
  \        {\n            Console.WriteLine(item);\n        }\n    }\n}\n```\n\n**输出\
  \ 15.1**\n\n```\nBifocals (1784)\nPhonograph (1877)\nKinetoscope (1888)\nElectrical\
  \ Telegraph (1837)\nFlying Machine (1903)\nSteam Locomotive (1815)\nDroplet Deposition\
  \ Apparatus (1989)\nBackless Brassiere (1914)\n\nBenjamin Franklin (Philadelphia,\
  \ PA)\nOrville Wright (Kitty Hawk, NC)\nWilbur Wright (Kitty Hawk, NC)\nSamuel Morse\
  \ (New York, NY)\nGeorge Stephenson (Wylam, Northumberland)\nJohn Michaelis (Chicago,\
  \ IL)\nMary Phelps Jacob (New York, NY)\n```\n\n## 使用 `Where()` 进行过滤\n\n为了从集合中过滤数据，我们需要提供一个返回\
  \ `true` 或 `false` 的过滤方法，用于指示是否包含某个特定元素。接收参数并返回布尔值的委托表达式被称为**谓词**（predicate），集合的\
  \ `Where()` 方法依赖谓词来识别过滤标准，如列表 15.10 所示。（从技术上讲，`Where()` 方法的结果是一个封装了使用给定谓词对给定序列进行过滤操作的**对象**。）结果出现在输出\
  \ 15.2 中。\n\n**列表 15.10: 使用 `System.Linq.Enumerable.Where()` 进行过滤**\n\n```\nusing\
  \ System;\nusing System.Collections.Generic;\nusing System.Linq;\n\npublic class\
  \ Program\n{\n    public static void Main()\n    {\n        IEnumerable<Patent>\
  \ patents = PatentData.Patents;\n        patents = patents.Where(              \
  \                            \n            patent => patent.YearOfPublication.StartsWith(\"\
  18\"));         \n        Print(patents);\n    }\n}\n```\n\n**输出 15.2**\n\n```\n\
  Phonograph (1877)\nKinetoscope (1888)\nElectrical Telegraph (1837)\nSteam Locomotive\
  \ (1815)\n```\n\n注意，代码将 `Where()` 的输出赋值回 `IEnumerable<T>`。换句话说，`Where()` 是一个 `IEnumerable<T>`\
  \ 集合。在列表 15.10 中，它是 `IEnumerable<Patent>`。\n\n不太明显的是，`Where()` 方法在赋值时并没有执行。对于许多标准查询运算符都是如此。以\
  \ `Where()` 为例，表达式被传递到集合中并保存但没有执行。相反，表达式的执行仅在需要遍历项目时发生。\n\n## 使用 `Select()` 进行投影\n\
  \n由于 `IEnumerable<T>.Where()` 方法的输出是一个新的 `IEnumerable<T>` 集合，因此再次对该集合调用标准查询运算符。例如，我们不仅可以过滤原始数据，还可以对数据进行转换（参见列表\
  \ 15.11）。\n\n**列表 15.11: 使用 `System.Linq.Enumerable.Select()` 进行投影**\n\n```\nusing\
  \ System;\nusing System.Collections.Generic;\nusing System.Linq;\n\npublic class\
  \ Program\n{\n    public static void Main()\n    {\n        IEnumerable<Patent>\
  \ patents = PatentData.Patents;\n        IEnumerable<Patent> patentsOf1800 = patents.Where(\n\
  \            patent => patent.YearOfPublication.StartsWith(\"18\"));\n        IEnumerable<string>\
  \ items = patentsOf1800.Select(                  \n            patent => patent.ToString());\
  \                                  \n\n        Print(items);\n    }\n}\n```\n\n\
  在列表 15.11 中，我们创建了一个 `IEnumerable<string>` 集合。在这种情况下，添加 `Select()` 调用恰没有改变输出——但这仅仅是因为\
  \ `Print()` 中的 `Console.WriteLine()` 调用本身就使用了 `ToString()`。显然，每个项目从原始集合的 `Patent`\
  \ 类型到 `items` 集合的 `string` 类型仍然发生了转换。\n\n考虑列表 15.12 中使用 `System.IO.FileInfo` 的示例。\n\
  \n这里 `fileList` 的类型是 `IEnumerable<string>`。然而，通过 `Select` 提供的投影，我们可以将集合中的每个项目转换为\
  \ `System.IO.FileInfo` 对象。\n\n\n\n\n\n最后，利用元组（tuples），我们可以创建一个 `IEnumerable<T>`\
  \ 集合，其中 `T` 是一个元组（参见 列表 15.13 和 输出 15.3）。\n\n### 列表 15.12：使用 `System.Linq.Enumerable.Select()`\
  \ 和 `new` 进行投影\n\n```cs\n//...\nIEnumerable<string> fileList = Directory.EnumerateFiles(\n\
  \    rootDirectory, searchPattern);\nIEnumerable<FileInfo> files = fileList.Select(\n\
  \    file => new FileInfo(file));\n//...\n```\n\n### 列表 15.13：投影到元组\n\n```cs\n//...\n\
  IEnumerable<string> fileList = Directory.EnumerateFiles(\nrootDirectory, searchPattern);\n\
  IEnumerable<(string FileName, long Size)> items = fileList.Select(         \n  \
  \  file =>                                                                \n   \
  \ {                                                                      \n    \
  \    FileInfo fileInfo = new FileInfo(file);                            \n     \
  \   return (                                                           \n      \
  \      FileName: fileInfo.Name,                                       \n       \
  \     Size: fileInfo.Length                                          \n        );\
  \                                                                 \n    });    \
  \                                                                \n//...\n```\n\n\
  ### 输出 15.3\n\n```\nFileName = AssemblyInfo.cs, Size = 1704\nFileName = CodeAnalysisRules.xml,\
  \ Size = 735\nFileName = CustomDictionary.xml, Size = 199\nFileName = EssentialCSharp.sln,\
  \ Size = 40415\nFileName = EssentialCSharp.suo, Size = 454656\nFileName = EssentialCSharp.vsmdi,\
  \ Size = 499\nFileName = EssentialCSharp.vssscc, Size = 256\nFileName = intelliTechture.ConsoleTester.dll,\
  \ Size = 24576\nFileName = intelliTechture.ConsoleTester.pdb, Size = 30208\n```\n\
  \n匿名类型的输出会自动显示属性名及其值，这些是通过与匿名类型关联的生成的 `ToString()` 方法来实现的。\n\n使用 `Select()` 方法进行投影是非常强大的。我们已经看到如何使用\
  \ `Where()` 标准查询操作符对集合进行垂直过滤（减少集合中的项目数量）。现在，通过 `Select()` 标准查询操作符，我们还可以水平地缩小集合（减少列的数）或完全转换数据。`Where()`\
  \ 和 `Select()` 结合使用提供了一种仅提取原始集合中当前算法所需的各个部分的方法。仅这两种方法就提供了一个强大的集合操作 API，而如果没有它们，代码将变得冗余得多，且可读性更差。\n\
  \n### 进阶主题：并行运行 LINQ 查询\n\n随着具有多个处理器以及这些处理器内部具有多个核心的计算机的普及，轻松利用额外处理能力的能力变得更加重要。为了实现这一点，程序需要支持多线程，以便工作可以在计算机内不同的\
  \ CPU 上同时进行。列表 15.14 演示了使用并行 LINQ (PLINQ) 实现此点的一种方法。\n\n### 列表 15.14：并行执行 LINQ 查询\n\
  \n```cs\n//...\nIEnumerable<string> fileList = Directory.EnumerateFiles(\n    rootDirectory,\
  \ searchPattern);\nvar items = fileList.AsParallel().Select(                   \
  \              \n    file =>\n    {\n        FileInfo fileInfo = new FileInfo(file);\n\
  \        return new\n        {\n            FileName = fileInfo.Name,\n        \
  \    Size = fileInfo.Length\n        };\n    });\n//...\n```\n\n如 列表 15.14 所示，对代码进行极小的更改即可启用并行支持。此示例中使用的仅是\
  \ Microsoft .NET Framework 4 引入的标准查询操作符 `AsParallel()`，它作用于静态类 `System.Linq.ParallelEnumerable`。通过使用这个简单的扩展方法，运行时开始并行执行\
  \ `fileList` 集合中的项目，并并行返回结果对象。在这种情况下，每个并行操作本身并不特别昂贵（尽管相对于正在执行的其他操作而言），但请考虑加密或压缩等\
  \ CPU 密集型操作带来的负担。在多个 CPU 上并行运行查询可以将执行时间缩短到与 CPU 核心数相应的倍数。\n\n一个需要注意的重要警示（这也是为什么\
  \ `AsParallel()` 出现为进阶主题而不是标准正文原因）是，并行执行可能会引入竞态条件，导致一个线程上的操作与另一个线程上的操作交织，从而导致数据损坏。为了避免这个问题，对于从多个线程共享访问的数据，需要同步机制来强制在必要时使操作具有原子性。然而，同步本身可能会导致冻结执行的死锁，使有效的并行编程更加复杂。\n\
  \n关于此以及其他多线程主题的更多细节请参阅第 19 章 至第 22 章。\n\n#### 使用 `Count()` 计算元素\n\n对项目集合经常执行的另一个查询是获取计数。为了支持这种查询，LINQ\
  \ 包含了 `Count()` 扩展方法。\n\n列表 15.15 演示了 `Count()` 被重载，可以简单的计算所有元素（无参数），或接受一个谓词来仅计算由谓词表达式识别的项目。\n\
  \n### 列表 15.15：使用 `Count()` 计数项目\n\n```cs\nusing System;\nusing System.Collections.Generic;\n\
  using System.Linq;\n\npublic class Program\n{\n    public static void Main()\n \
  \   {\n        IEnumerable<Patent> patents = PatentData.Patents;\n        Console.WriteLine($\"\
  Patent Count: { patents.Count() }\");\n        Console.WriteLine($@\"Patent Count\
  \ in 1800s: {\n            patents.Count(patient =>\n                patient.YearOfPublication.StartsWith(\"\
  18\"))}\");\n    }\n}\n```\n\n尽管 `Count()` 语句看起来简单，但 `IEnumerable<T>` 没有变化，因此执行的代码仍然遍历集合中的所有项目。当集合上直接可用\
  \ `Count` 属性时，使用该属性比使用 LINQ 的 `Count()` 方法更好（微妙的区别）。幸运的是，`ICollection<T>` 包含了 `Count`\
  \ 属性，因此调用 `Count()` 方法的代码将转换集合并直接调用 `Count`。然而，如果不支持 `ICollection<T>`，`Enumerable.Count()`\
  \ 将遍历所有项目而不是调用内置的 `Count` 机制。如果检查数的目的只是查看它是否大于零（`if(patents.Count() > 0){...}`），更优的方法是使用\
  \ `Any()`（`if(patents.Any()){...}`）。`Any()` 尝试迭代集合中的一个项目以返回真结果，而不是遍历整个序列。\n\n#####\
  \ 指南\n\n- **当检查是否存在大于零的项目时，请使用 `System.Linq.Enumerable.Any()` 而不是调用 `patents.Count()`。**\n\
  - **当集合上有 `Count` 属性时，请使用它而不是调用 `System.Linq.Enumerable.Count()` 方法。**\n\n#### 延迟执行\n\
  \n使用 LINQ 时要记住最重要的概念之一是延迟执行。考虑 列表 15.16 中的代码以及对应的输出 输出 15.4。\n\n### 列表 15.16：使用\
  \ `System.Linq.Enumerable.Where()` 进行过滤\n\n\n\n\n\n```c\nusing System;\nusing System.Collections.Generic;\n\
  using System.Linq;\n// ...\n        IEnumerable<Patent> patents = PatentData.Patents;\n\
  \        bool result;\n        patents = patents.Where(\n            patent =>\n\
  \            {\n                if(result =\n                    patent.YearOfPublication.StartsWith(\"\
  18\"))\n                {\n                    // 谓词中的此类副作用\n                  \
  \  // 在此处被用于演示一个\n                    // 原则，通常应该\n                    // 避免\n  \
  \                  Console.WriteLine(\"\\t\" + patent);\n                }\n   \
  \             return result;\n            });\n\n        Console.WriteLine(\"1\\\
  . 1900 年以前的专利有:\");\n        foreach(Patent patent in patents)\n        {\n    \
  \    }\n\n        Console.WriteLine();\n        Console.WriteLine(\n           \
  \ \"2\\. 1900 年以前专利的第二次列表：\");\n        Console.WriteLine(\n            $@\"   有\
  \ { patents.Count()\n                } 个 1900 年以前的专利。\");\n\n        Console.WriteLine();\n\
  \        Console.WriteLine(\n            \"3\\. 1900 年以前专利的第三次列表：\");\n        patents\
  \ = patents.ToArray();\n        Console.Write(\"   有 \");\n        Console.WriteLine(\n\
  \            $\"{ patents.Count() } 个 1900 年以前的专利。\");\n\n        //...\n```\n\n\
  **输出 15.4**\n\n```\n1\\. 1900 年以前的专利有：\n        Phonograph (1877)\n        Kinetoscope\
  \ (1888)\n        Electrical Telegraph (1837)\n        Steam Locomotive (1815)\n\
  \n2\\. 1900 年以前专利的第二次列表：\n        Phonograph (1877)\n        Kinetoscope (1888)\n\
  \        Electrical Telegraph (1837)\n        Steam Locomotive (1815)\n   有 4 个\
  \ 1900 年以前的专利。\n\n3\\. 1900 年以前专利的第三次列表：\n        Phonograph (1877)\n        Kinetoscope\
  \ (1888)\n        Electrical Telegraph (1837)\n        Steam Locomotive (1815)\n\
  \   有 4 个 1900 年以前的专利。\n```\n\n注意 `Console.WriteLine(\"1\\. Patents prior...)` 是在\
  \ lambda 表达式之前执行的。识别这一特性非常重要，因为对于那些不知道其重要性的人来说，这并不明显。通常情况下，谓词应该只做一件事——评估条件——并且不应该有任何副作用（即使像示例那样打印到控制台）。\n\
  \n为了理解正在发生什么，请记住 lambda 表达式是委托——方法的引用——是可以传递的。在 `LINQ` 和标准查询操作符的范围内，每个 lambda 表达式都构成了待执行整体查询的一部分。\n\
  \n在声明时，lambda 表达式并不会执行。事实上，直到 lambda 表达式被调用，其内部的代码才会开始执行。图 15.2 显示了操作序列。\n\n![Images](img/15fig02.jpg)\n\
  \n**图 15.2：调用 lambda 表达式的操作序列**\n\n如图 15.2 所示，列表 15.14 中的三次调用触发了 lambda 表达式，而且每次执行都是相当隐式的。如果\
  \ lambda 表达式的开销很大（例如调用数据库），那么减少 lambda 表达式的执行就会变得非常重要。\n\n首先，执行是在 `foreach` 循环内部触发的。正如章节早期描述，`foreach`\
  \ 循环被分解为 `MoveNext()` 调用，每次调用都会导致原始集合中的每个项执行 lambda 表达式。在迭代期间，运行时会为每个项调用 lambda\
  \ 表达式，以确定该项是否满足谓词。\n\n其次，对 `Enumerable` 的 `Count()`（函数）的调用再次触发每个项的 lambda 表达式。同样，这是一种微妙的行为，因为\
  \ `Count`（属性）在未使用标准查询操作符查询的集合上非常常见。\n\n第三，对 `ToArray()`（或 `ToList()`、`ToDictionary()`\
  \ 或 `ToLookup()`）的调用会评估每个项的 lambda 表达式。然而，使用这些“To”方法之一转换集合是非常有帮助的。这样做返回一个标准查询操作符已经执行完毕的集合。在列表\
  \ 15.14 中，转换为数组意味着当在最后的 `Console.WriteLine()` 中调用 `Length` 时，`patents` 指向的底层对象实际上是一个数组（它显然实现了\
  \ `IEnumerable<T>`）；反，调用的是 `System.Array` 的 `Length` 实现而不是 `System.Linq.Enumerable`\
  \ 的实现。因此，在转换为由“To”方法返回的集合类型之后，通常处理该集合是安全的（直到调用另一个标准查询操作符为止）。但是，请注意这会将整个结果集加载到内存中（在此步骤之前，它可能由数据库或文件支持）。此外，“To”方法将获取底层数据的快照，因此在重新查询“To”方法的结果时，将不会返回新的结果。\n\
  \n我们强烈建议你查看序列图。\n\n\n\n\n`OrderBy()` 返回一个 `IOrderedEnumerable<T>` 接口，而不是 `IEnumerable<T>`。此外，`IOrderedEnumerable<T>`\
  \ 继承自 `IEnumerable<T>`，因此所有标准查询操作符（包括 `OrderBy()`）都可以用于 `OrderBy()` 的返回值上。然而，重复调用\
  \ `OrderBy()` 会撤消上一次调用的工作，导致最终结果仅按最后一个 `OrderBy()` 调用中的 `keySelector` 进行排序。出于此原因，你应该小心不要在之前的\
  \ `OrderBy()` 调用之后再次调用 `OrderBy()`。\n\n相反，你应该使用 `ThenBy()` 指定额外的排序标准。虽然 `ThenBy()`\
  \ 是一个扩展方法，但它不是 `IEnumerable<T>` 的扩展，而是 `IOrderedEnumerable<T>` 的扩展。该方法也定义在 `System.Linq.Extensions.Enumerable`\
  \ 中，声明如下：\n\n```cs\n public static IOrderedEnumerable<TSource>\nThenBy<TSource,\
  \ TKey>(\nthis IOrderedEnumerable<TSource> source,\n   Func<TSource, TKey> keySelector)\n\
  ```\n\n总之，首先使用 `OrderBy()`，随后进行零或多次 `ThenBy()` 调用以提供额外的“排序列”。`OrderByDescending()`\
  \ 和 `ThenByDescending()` 方法提供相同的功能，只是它们按降序排列项目。混合使用升序和降序方法没有问题，但如果需要对项目进行进一步排序，你应该使用\
  \ `ThenBy()` 调用（无论是升序还是降序）。\n\n关于排序还有两个重要的点需要说明。首先，实际排序直到你开始访问集合中的成员时才会发生，此时整个查询才会被处理。除非你拥有所有待排序的项，否则无法进行排序，因为你无法确定是否拥有第一个项目。排序被推迟到开始访问成员是因为本章早些部分描述的**延迟执行**。其次，后续每次对数据的排序调用（例如\
  \ `OrderBy()` 后面接 `ThenBy()` 然后是 `ThenByDescending()`）确实涉及对早期排序调用 `keySelector`\
  \  的额外调用。换句话说，当你遍历集合时，`OrderBy()` 调用会调用其相应的 `keySelector` 表达式。此外，随后的 `ThenBy()`\
  \ 调用将再次调用 `OrderBy()` 的 `keySelector`。\n\n## 指南\n\n**不要在之前的 `OrderBy()` 方法调用之后调用\
  \ `OrderBy()`。请使用 `ThenBy()` 根据多个值对项目进行排序。**\n\n## 初学者主题：连接操作\n\n考虑如图 15.3 中的维恩图所示的两个对象集合。图中的左圆包含所有发明者，右圆包含所有专利。交集包含了发明者和专利，对于每种发明者与专利匹配的情况，都会形成一条线。如图所示，每位发明者可能有多个专利，而每个专利可以有一个或多个发明者。每个专利都有一个发明者，但在某些情况下，发明者还没有专利。\n\
  \n![Images](img/15fig03.jpg)\n\n**图 15.3：发明者和专利集合的维恩图**\n\n将交集内的发明者与专利进行匹配是**内连接\
  \ (inner join)**。结果是一个发明者/专利对集合，其中每一对都存在专利和发明。左外连接 (left outer join）包含了左圆内的所有项，无论它们是否有对应的专利。在这个特定的例子中，右外连接与内连接相同，因为没有不对应发明者的专利。此外，左与右的指定是任意的，因此左连接和外连接之间实际上没有区别。然而，全外连接\
  \ (full outer join) 将包含两个外侧的记录；执行全外连接相对罕见。\n\n发明者与专利之间关系的另一个重要特征是它们是**多对多**关系。每个单独的专利可以有一个或多个发明者（例如，奥维尔和威尔伯·莱特共同发明的飞行器）。此外，每位发明者可以拥有一个或多个专利（例如，本明·富兰克林发明的双光眼镜和留声机）。\n\
  \n另一种常见的关系是**一对多**关系。例如，一个公司部门可能有许多员工。然而，每位员工在此时只能属于一个部门。（但是，正如一对多关系常见的那样，引入时间因素可以将其转换为多对多关系。特定员工可能会从一个部门移动到另一个部门，随着时间的推移，她可能与多个部门关联，形成另一个多对多关系。）\n\
  \n列表 15.18 提供了员工和部门数据的示例列表，输出 15.6 显示了结果。\n\n**列表 15.18：示例员工和部门数据**\n\n```cs\npublic\
  \ class Program\n{\n    public static void Main()\n    {\n        IEnumerable<Department>\
  \ departments =\n            CorporateData.Departments;\n        Print(departments);\n\
  \n        Console.WriteLine();\n\n        IEnumerable<Employee> employees =\n  \
  \          CorporateData.Employees;\n        Print(employees);\n    }\n\n    private\
  \ static void Print<T>(IEnumerable<T> items)\n    {\n        foreach(T item in items)\n\
  \        {\n            Console.WriteLine(item);\n        }\n    }\n}\n```\n\n**OUTPUT\
  \ 15.6**\n\n```\nCorporate\nHuman Resources\nEngineering\nInformation Technology\n\
  Philanthropy\nMarketing\n\nMark Michaelis (Chief Nerd)\nMichael Stokes (Senior Wizard)\n\
  Brian Jones (Enterprise Guru)\nAnne Beard (HR Director)\nPat Dever (Enterprise Architect)\n\
  Kevin Bost (Programmer Extraordinaire)\nThomas Heavey (Software Architect)\nEric\
  \ Edmonds (Philanthropy Coordinator)\n```\n\n我们将在下一节关于连接的示例中使用这些数据。\n\n### 使用 `Join()`\
  \ 执行内连接\n\n在客户端的对象世界中，对象之间的关系已经建立。例如，文件与它们所在的目录之间的关系已通过 `DirectoryInfo.GetFiles()`\
  \ 方法和 `FileInfo.Directory` 方法预先建立。然而，对于从非对象存储器加载的数据，情况通常并非如此。相反，需要将数据连接在一起，以便能够以符合数据逻辑的方式从一种对象类型导航到另一种类型。\n\
  \n考虑员工和公司部门的示例。在列表 15.19 中，我们将每个员工与其所属的部门连接，然后列出每个员工及其所属部门。由于每位员工只属于一个（且恰好是一个）部门，列表中的项目总数等于员工总数——每个员工只出现一次（每个员工可以说是**归一化**的）。输出\
  \ 15.7 显示了结果。\n\n**列表 15.19：使用 `System.Linq.Enumerable.Join()` 的内连接**\n\n```cs\n\
  using System;\nusing System.Collections.Generic;\nusing System.Linq;\n// ...\n \
  \       Department[] departments = CorporateData.Departments;\n        Employee[]\
  \ employees = CorporateData.Employees;\n\n        IEnumerable<(int Id, string Name,\
  \ string Title,\n            Department Department)> items =\n            employees.Join(\n\
  \                departments,\n                employee => employee.DepartmentId,\n\
  \                department => department.Id,\n                (employee, department)\
  \ => (\n                    employee.Id,\n                    employee.Name,\n \
  \                   employee.Title,\n                    department\n          \
  \      ));\n\n        foreach ((int Id, string Name, string Title, Department Department)\
  \ item in items)\n        {\n            Console.WriteLine(\n                $\"\
  {item.Name} ({item.Title})\");\n            Console.WriteLine(\"\\t\" + item.Department);\n\
  \        }\n    }\n    //...\n```\n\n**OUTPUT 15.7**\n\n\n\n\n\n```\nMark Michaelis\
  \ (Chief Computer Nerd)\n        Corporate\nMichael Stokesbary (Senior Computer\
  \ Wizard)\n        Engineering\nBrian Jones (Enterprise Integration Guru)\n    \
  \    Engineering\nAnne Beard (HR Director)\n        Human Resources\nPat Dever (Enterprise\
  \ Architect)\n        Information Technology\nKevin Bost (Programmer Extraordinaire)\n\
  \        Engineering\nThomas Heavey (Software Architect)\n        Engineering\n\
  Eric Edmonds (Philanthropy Coordinator)\n        Philanthropy\n```\n\n`Join()` 的第一个参数名称为\
  \ `inner`。它指定了 `employees` 要连接的集合 `departments`。接下来两个参数是 lambda 表达式，指定了两个集合如何连接。`employee\
  \ => employee.DepartmentId`（参数名称为 `outerKeySelector`）标识了在每个 `employee` 上，键将是 `DepartmentId`。下一个\
  \ lambda 表达式（`department => department.Id`）将 `Department` 的 `Id` 属性指定为键——换句话说，对于每个员工，连接一个\
  \ `employee.DepartmentId` 等于 `department.Id` 的部门。最后一个参数是所选定的结果项。在这种情况下，它是一个包含 `Employee`\
  \ 的 `Id`、`Name` 和 `Title`，以及一个带有连接的 `department` 对象的 `Department` 属性的元组。\n\n注意输出中\
  \ `Engineering` 出现了多次——CorporateData 中的每个员工一次。在这种情况下，`Join()` 调用在所有部门和所有员工之间产生了**笛卡尔积**，使得每当两个集合中都存在记录且指定的部门\
  \ ID 相同时，就会创建一个新记录。这种类型的连接是内连接。\n\n数据也可以反向进行连接，使 `department` 连接到每个 `employee`，以列出每个部门到员工的匹配。注意，输出包含的记录比部门的数量要多：每个部门都有多个员工，且输出为每个匹配有一条记录。正如我们之前看到的，Engineering\
  \ 部门出现了多次，每个员工出现一次。\n\nLISTING 15.20 中的代码（产生 OUTPUT 15.8）与 LISTING 15.19 中的代码类似，只是对象\
  \ `Department` 和 `Employee` 的顺序反过来了。`Join()` 的第一个参数是 `employees`，表示 `departments`\
  \ 连接的对象。接下来的两个参数是 lambda 表达式，指定了两个集合如何连接：针对 `departments` 的 `department => department.Id`\
  \ 和针对 `employees` 的 `employee => employee.DepartmentId`。与之前，只要 `department.Id` 等于\
  \ `employee.EmployeeId`，就会发生连接。最后的元组参数指定了一个具有 `int Id`、`string Name` 和 `Employee\
  \ Employee` 项目的类。（在表达式中指定名称是可选的，但为了清晰起见在此使用了。）\n\n**LISTING 15.20: 使用 System.Linq.Enumerable.Join()\
  \ 的另一个内连接**\n\n```\nusing System;\nusing System.Collections.Generic;\nusing System.Linq;\n\
  // ...\n        Department[] departments = CorporateData.Departments;\n        Employee[]\
  \ employees = CorporateData.Employees;\n\n        IEnumerable<(long Id, string Name,\
  \ Employee Employee)> items =\n            departments.Join(\n                employees,\n\
  \                department => department.Id,\n                employee => employee.DepartmentId,\n\
  \                (department, employee) => (\n                    department.Id,\
  \ \n                    department.Name, \n                    Employee: employee)\n\
  \                );\n\n        foreach ((long Id, string Name, Employee Employee)\
  \ item in items)\n        {\n            Console.WriteLine(item.Name);\n       \
  \     Console.WriteLine(\"\\t\" + item.Employee);\n        }\n        //...\n```\n\
  \n**OUTPUT 15.8**\n\n```\nCorporate\n        Mark Michaelis (Chief Computer Nerd)\n\
  Human Resources\n        Anne Beard (HR Director)\nEngineering\n        Michael\
  \ Stokesbary (Senior Computer Wizard)\nEngineering\n        Brian Jones (Enterprise\
  \ Integration Guru)\nEngineering\n        Kevin Bost (Programmer Extraordinaire)\n\
  Engineering\n        Thomas Heavey (Software Architect)\nInformation Technology\n\
  \        Pat Dever (Enterprise Architect)\nPhilanthropy\n        Eric Edmonds (Philanthropy\
  \ Coordinator)\n```\n\n除了排序和连接对象集合外，你可能希望对具有相似特征的对象进行分组。对于员工数据，你可能想按部门、地区、职位名称等对员工进行分组。LISTING\
  \ 15.21 展示了如何使用 `GroupBy()` 标准查询操作符来实现这一点（查看 OUTPUT 15.9 查看结果）。\n\n**LISTING 15.21:\
  \ 使用 System.Linq.Enumerable.GroupBy() 分组项**\n\n```csharp\nusing System;\nusing System.Collections.Generic;\n\
  using System.Linq;\n// ...\n        IEnumerable<Employee> employees = CorporateData.Employees;\n\
  \n        IEnumerable<IGrouping<int, Employee>> groupedEmployees =\n           \
  \ employees.GroupBy((employee) => employee.DepartmentId);\n\n        foreach(IGrouping<int,\
  \ Employee> employeeGroup in\n            groupedEmployees)\n        {\n       \
  \     Console.WriteLine();\n            foreach(Employee employee in employeeGroup)\n\
  \            {\n                Console.WriteLine(employee);\n            }\n  \
  \          Console.WriteLine(\n              \"\\tCount: \" + employeeGroup.Count());\n\
  \        }\n        //...\n```\n\n**OUTPUT 15.9**\n\n```\nMark Michaelis (Chief\
  \ Computer Nerd)\n    Count: 1\n\nMichael Stokesbary (Senior Computer Wizard)\n\
  Brian Jones (Enterprise Integration Guru)\nKevin Bost (Programmer Extraordinaire)\n\
  Thomas Heavey (Software Architect)\n    Count: 4\n\nAnne Beard (HR Director)\n \
  \   Count: 1\n\nPat Dever (Enterprise Architect)\n    Count: 1\n\nEric Edmonds (Philanthropy\
  \ Coordinator)\n    Count: 1\n```\n\n注意，`GroupBy()` 输出的项类型为 `IGrouping<TKey, TElement>`，它包含分组依据的键属性（`employee.DepartmentId`）。但它没有组项的属性。相反，`IGrouping<TKey,\
  \ TElement>` 派自 `IEnumerable<T>`，允许对组内进行枚举，或将数据聚合为某些值（如 `employeeGroup.Count()`）。\n\
  \n 使用 GroupJoin() 实现一对多关系\n\n\n\n\n\n```c\nusing System;\nusing System.Collections.Generic;\n\
  using System.Linq;\n// ...\n        Department[] departments = CorporateData.Departments;\n\
  \        Employee[] employees = CorporateData.Employees;\n\n        IEnumerable<(long\
  \ Id, string Name, IEnumerable<Employee> Employees)> items =\n            departments.GroupJoin(\n\
  \                employees,\n                department => department.Id,\n    \
