  \ 将返回两个项，对应于原始集合中的每个项。`Select()` 可能会从原始类型投影转换，但项目数量不会改变。例如，`teams.Select(team =>\
  \ team.Players)` 将返回一个 `IEnumerable<string[]>`。\n\n相比之下，`SelectMany()` 会遍历 Lambda\
  \ 表达式识别的每个项（之前由 `Select()` 选择的数组），并将每个项提取到一个新集合，该集合包含了子集合中所有元素的并。与其返回两个球员数组，`SelectMany()`\
  \ 合并每个选择的数组产生所有元素的单个集合。\n\n#### 更常用的查询运算符\n\nLISTING 15.25 显示了使用 `Enumerable` 启用的一些简单\
