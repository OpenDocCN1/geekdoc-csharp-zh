  \   Players: new string[]\n                {\n                    \"Fabien Barthez\"\
  , \"Gregory Coupet\",\n                    \"Mickael Landreau\", \"Eric Abidal\"\
  ,\n                    \"Jean-Alain Boumsong\", \"Pascal Chimbonda\",\n        \
  \            \"William Gallas\", \"Gael Givet\",\n                    \"Willy Sagnol\"\
  , \"Mikael Silvestre\",\n                    \"Lilian Thuram\", \"Djibril Dhoras\"\
  ,\n                    \"Alou Diarra\", \"Claude Makelele\",\n                 \
  \   \"Zinedine Zidane\", \"Patrick Vieira\",\n                    \"Thierry Henry\"\
  , \"Franck Ribery\",\n                    \"Louis Saha\", \"Trezegu\",\n       \
  \             \"Sylvain Wiltord\",\n                }\n            ),\n        \
  \    (\n                TeamName: \"Italy\",\n                Players: new string[]\n\
  \                {\n                    \"Gianluigi Buffon\", \"Angelo Peruzzi\"\
  ,\n                    \"Marco Amelia\", \"Cristian Zaccardo\",\n              \
  \      \"Alessandro Nesta\", \"Gianluca Zambrotta\",\n                    \"Fabio\
  \ Cannavaro\", \"Marco Materazzi\",\n                    \"Fabio Grosso\", \"Massimo\
  \ Oddo\",\n                    \"Andrea Barzagli\", \"Andrea Pirlo\",\n        \
