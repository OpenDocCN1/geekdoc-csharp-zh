  \n# TABLE 15.2: `System.Linq.Enumerable` 上的聚合函数\n\n![Images](img/15tab02.jpg)\n\n\
  注意 TABLE 15.1 和 TABLE 15.2 中列出的每个方法都会触发延迟执行。\n\n## 高级主题：针对 `IQueryable<T>` 的 `Queryable`\
  \ 扩展\n\n与 `IEnumerable<T>` 几乎相同的接口是 `IQueryable<T>`。由于 `IQueryable<T>` 派自 `IEnumerable<T>`，它拥有所有直接声明的\
  \ `IEnumerable<T>` 成员（例如 `GetEnumerator()`）。然而，扩展方法是不被继承的，因此 `IQueryable<T>` 没有\
  \ `Enumerable` 扩展方法。尽管如此，它有一个类似的扩展类 `System.Linq.Enumerable`。\n\n### 使用 LINQ 的匿名类型\n\
  \n为了支持 LINQ 这一高级 API，语言仅进行了八种新的增强。(9) 这些增强中的两种是匿名类型和隐式局部变量。尽管如此，匿名类型已被 C# 元组语法的引入所掩盖。(10)\
  \ 事实上，在本书第六版中，所有利用匿名类型的 LINQ 示例已更新为使用元组。\n\n本章剩余部分将涵盖匿名类型主题，以便在处理 C# 7.0 之前的代码时仍能理解匿名类型语言功能。\n\
  \n#### 匿名类型\n\n匿名类型是由编译器声明的数据类型，而不是通过 第 6 章 的显式类定义的。与匿名函数一样，当编译器看到匿名类型时，它会完成该类的创建并让你像显式声明的那样使用它。LISTING\
  \ 15.26 显示了这样的声明。相应的输出如 OUTPUT 15.13 所示。\n\n# LISTING 15.26: 使用匿名类型的隐式局部变量\n\n\n\
  \n\n\n```cs\nusing System;\n\npublic class Program\n{\n    public static void Main()\n\
  \    {\n        var patent1 =                                               \n \
  \           new                                                     \n         \
  \   {                                                       \n                Title\
  \ = \"Bifocals\",                                 \n                YearOfPublication\
  \ = \"1784\"                          \n            };                         \
  \                             \n        var patent2 =                          \
  \                     \n            new                                        \
  \             \n            {                                                  \
  \     \n                Title = \"Phonograph\",                               \n\
  \                YearOfPublication = \"1877\"                          \n      \
  \      };                                                      \n        var patent3\
  \ =                                               \n            new            \
  \                                         \n            {                      \
  \                                 \n                patent1.Title,             \
  \                         \n                // Renamed to show property naming \
  \                 \n                Year = patent1.YearOfPublication           \
  \         \n            };                                                     \
  \ \n\n        Console.WriteLine(\n            $\"{ patent1.Title } ({ patent1.YearOfPublication\
  \ })\");\n        Console.WriteLine(\n            $\"{ patent2.Title } ({ patent2.YearOfPublication\
  \ })\");\n\n        Console.WriteLine();\n        Console.WriteLine(patent1);\n\
  \        Console.WriteLine(patent2);\n\n        Console.WriteLine();\n        Console.WriteLine(patent3);\n\
  \    }\n}\n```\n\n**输出 15.13**\n\n```\nBifocals (1784)\nPhonograph (1784)\n\n{ Title\
  \ = Bifocals, YearOfPublication = 1784 }\n{ Title = Phonograph, YearOfPublication\
  \ = 1877 }\n\n{ Title = Bifocals, Year = 1784 }\n```\n\n匿名类型完全是 C# 的特性，而不是运行时中的一种新类型。当编译器遇到匿名类型语法时，它会生成一个\
  \ `CIL` 类，其属性与匿名类型声明中的具名值和数据类型相对应。\n\n### 初学者主题：回顾隐式类型局部变量 (`var`)\n\n\n\n由于匿名类型没有名称，因此无法将局部变量显式地声明为匿名类型。相反，局部变量的类型被替换为\
  \ `var`。然而，这绝不意味着隐式类型变量是无类型的。相反，它们被完全类型化为其被赋值的值的数据类型。如果给隐式类型变量赋值一个匿名类型，则该局部变量声明的底层\
  \ `CIL` 代码将是编译器生成的类型。同样，如果给隐式类型变量赋值一个 `string`，其在底层 `CIL` 中的数据类型将是 `string`。事实上，对于赋值值不是匿名类型（例如\
  \ `string`）的隐式类型变量与使用显式类型声明的变量，其生成的 `CIL` 代码没有区别。如果声明语句是 `string text = \"This is\
  \ a test of the...\"`，生成的 `CIL` 代码将与隐式声明 `var text = \"This is a test of the...\"\
  ` 相同。\n\n编译器从赋值的表达式确定隐式类型变量的数据类型。在带有初始化器的显式类型局部变量（`string s = \"hello\";`）中，编译器首先根据左侧的声明类型确定\
  \ `s` 的类型，然后分析右侧并验证右侧表达式可以赋值该类型。在隐式类型局部变量中，这个过程在某种程度上是反向的。首先分析右侧以确定其类型，然后逻辑上将 `var`\
  \ 替换为该类型。\n\n尽管 C# 没有为匿名类型包含名称，但它也是强类型的。例如，该类型的属性是可以完全访问的。在`代码列表 15.26` 中，`patent1.Title`\
  \ 和 `patent2.YearOfPublication` 在 `Console.WriteLine` 语句中被调用。任何调用不存在成员的尝试都会导致编译错误。即使是像\
  \ `Visual Studio` 等 IDE 中的智能感知（IntelliSense）也能处理匿名类型。\n\n你应该节节地使用隐式类型变量声明。显然，对于匿名类型，无法指定数据类型，必须使用\
  \ `var`。然而，如果数据类型不是匿名类型，通常使用显式数据类型是更好的选择。\n\n通常情况下，你应该关注如何提高代码语义的可读性，同时利用编译器来验证结果变量是否是你所预期的类型。要通过隐式类型局部变量实现这一点，请仅当赋值给隐式类型变量的类型完全显而易见时才使用它们。例如，在\
  \ `var items = new Dictionary<string, List<Account>>();` 中，生成的代码更加简洁易读。相比之下，当类型不明显时（例如赋值为方法的返回值），开发者应该倾向于使用显式的变量类型声明，如下：\n\
  \n```cs\nDictionary<string, List<Account>> dictionary = GetAccounts();\n```\n\n\
  #### 使用 LINQ 投影到匿名类型\n\n最后，利用匿名类型，我们可以创建一个 `IEnumerable<T>` 集合，其中 `T` 是匿名类型（参见`代码列表\
  \ 15.27` 和`输出 15.14`）。\n\n**代码列表 15.27：投影到匿名类型**\n\n```cs\n//...\nIEnumerable<string>\
  \ fileList = Directory.EnumerateFiles(\n    rootDirectory, searchPattern);\nvar\
  \ items = fileList.Select(                                           \n    file\
  \ =>                                                            \n    {        \
  \                                                          \n        FileInfo fileInfo\
  \ = new FileInfo(file);                        \n        return new            \
  \                                         \n        {                          \
  \                                     \n            FileName = fileInfo.Name,  \
  \                                \n            Size = fileInfo.Length          \
  \                           \n        };                                       \
  \                      \n    });                                               \
  \               \n//...\n```\n\n**输出 15.14**\n\n```\n{ FileName = AssemblyInfo.cs,\
  \ Size = 1704 }\n{ FileName = CodeAnalysisRules.xml, Size = 735 }\n{ FileName =\
  \ CustomDictionary.xml, Size = 199 }\n{ FileName = EssentialCSharp.sln, Size = 40415\
  \ }\n{ FileName = EssentialCSharp.suo, Size = 454656 }\n{ FileName = EssentialCSharp.vsmdi,\
  \ Size = 499 }\n{ FileName = EssentialCSharp.vssscc, Size = 256 }\n{ FileName =\
  \ intelliTechture.ConsoleTester.dll, Size = 24576 }\n{ FileName = intelliTechture.ConsoleTester.pdb,\
  \ Size = 30208 }\n```\n\n匿名类型的输出会自动将属性名及其值作为与该匿名类型相关的生成的 `ToString()` 方法的一部分显示出来。\n\
  \n使用 `Select()` 方法投影是非常强大的。我们已经看到过如何使用 `Where()` 标准查询操作符对集合进行垂直过滤（减少集合中的项数量）。现在，通过使用\
  \ `Select()` 标准查询操作符，我们还可以水平方向收缩小集合（产生更少的列）或完全转换数据。通过增加对匿名类型的支持，我们可以通过 `Select()`\
  \ 提取出任意的“对象”，仅提取原始集合中当前算法所需的部分，而无需声明一个来包含这些内容的类。\n\n#### 关于匿名类型和隐式局部变量的更多信息\n\n\n\
  \n\n\n在 LISTING 15.26 中，匿名类型的成员名通过为 `patent1` 和 `patent2` 的名称赋值值来显式标识（例如 `Title\
  \ = \"Phonograph\"`）。然而，如果赋值的值是属性或字段调用，则名称可能默认为字段或属性的名称，而不是显式指定值。例如，`patent3` 是使用一个名为\
  \ `Title` 的属性定义的，而不是赋值给显式名称。如 OUTPUT 15.13 所示，结果属性名由编译器确定，以与获取值处的属性相匹配。\n\n`patent1`\
  \ 和 `patent2` 具有相同的属性名和相同的数据类型。因此，C# 编译器仅为这两个匿名声明生成一个数据类型。相比之下，`patent3` 强制编译器创建第二个匿名类型，因为专利年份的属性名与\
  \ `patent1` 和 `patent2` 中的不同。此外，如果交换 `patent1` 和 `patent2` 之间的属性顺序，这两个匿名类型将不具有类型兼容性。换句话说，两个匿名类型在同一程序集中具有类型兼容性的要求是：属性名、数据类型和属性顺序必须匹配。如果满足这些标准，类型就是兼容的，即使它们出现在不同的方法或类中。LISTING\
  \ 15.28 展示了这些类型不兼容的情况。\n\n### LISTING 15.28: 匿名类型的类型安全与不可变性\n\n```csharp\npublic\
  \ class Program\n{\n    public static void Main()\n    {\n        var patent1 =\n\
  \            new\n            {\n                Title = \"Bifocals\",\n       \
  \         YearOfPublication = \"1784\"\n            };\n\n        var patent2 =\n\
  \            new\n            {\n                YearOfPublication = \"1877\",\n\
  \                Title = \"Phonograph\"\n            };\n\n        var patent3 =\n\
  \            new\n            {\n                patent1.Title,\n              \
  \  Year = patent1.YearOfPublication\n            };\n\n        // ERROR: Cannot\
  \ implicitly convert type\n        //        'AnonymousType#1' to 'AnonymousType#2'\n\
  \        //patent1 = patent2; //won't compile if uncommented\n        // ERROR:\
  \ Cannot implicitly convert type\n        //        'AnonymousType#1' to 'AnonymousType#3'\n\
  \        //patent1 = patent3; //won't compile if uncommented\n\n        // ERROR:\
  \ Property or indexer 'AnonymousType#1.Title'\n        //        cannot be assigned\
  \ to -- it is read-only'\n        //patent1.Title = \"Swiss Cheese\";\n        \
  \    //won't compile if uncommented\n    }\n}\n```\n\n前两个编译时错误断言类型是不兼容的，因此它们无法成功地从一个转换为另一个。第三个编译时错误是由重新赋值\
  \ `Title` 属性引起的。匿名类型是不可变的，因此，一旦实例化了匿名类型，更改其属性就是编译时错误。\n\n虽然在 LISTING 15.28 中未显示，但无法声明带有隐式数据类型参数（`var`）的方法。因此，匿名类型的实例只有通过两种方式可以传递到创建它的方法之外。首先，如果方法参数类型为\
  \ `object`，则匿名类型实例可以传递到方法之外，因为匿名类型将隐式转换。第二方法是使用方法类型推断，将匿名类型实例作为方法类型参数传递，编译器可以成功推断。因此，使用\
  \ `Function(patent1)` 调用 `void Method<T>(T parameter)` 将成功，尽管在 `Function()` 内部对\
  \ `parameter` 的可用操作限于 `object` 支持的操作。\n\n尽管 C# 允许像 LISTING 15.26 所示的匿名类型，但通常不建议以这种方式定义它们。匿名类型提供了关键功能，并支持投影^(11)，例如集合的连接/关联，正如我们在章节后面部分讨论的。尽管如此，你通常应该将匿名类型的定义留给需要它们的情况，例如从多个类型中聚合数据。\n\
  \n11。从 C# 3.0 开始。\n\n在匿名类型引入时，它们是一项解决重要问题的突破：即时声明临时类型，而无需声明完整类型的繁琐过程。尽管如此，正如前面详细描述的，它们有几个缺点。幸运的是，元组^(12)\
  \ 避免了这些缺点，实际上基本上消除了对使用匿名类型的需要。具体而言，元组相比匿名类型具有以下优势：\n\n12。从 C# 7.0 开始。\n\n- 提供了命名的类型，可以在任何可以使用类型的地方使用，包括声明和类型参数\n\
  - 在其实化的方法之外可用\n- 避免了由于生成但很少使用的类型导致的类型“污染”\n\n元组与匿名类型的不同之处是，匿名类型是引用类型，而元组是值类型。这种差异对某一种方法还是另一种方法有利，取决于性能特征。如果内存占用超过\
  \ 128 位，则可能是引用类型。否则，使用元组可能更好。\n\n### 高级主题：匿名类型的生成\n\n尽管 `Console.WriteLine()` 的实现是调用\
  \ `ToString()`，但在 LISTING 15.26 中注意，输出并不是完全限定的数据类型名称。相反，输出是 `属性名 = 值` 的列表，对应匿名类型上的每个属性。这种现象是因为编译器在匿名类型中重写了\
  \ `ToString()`，以便格式化输出所示。同样，生成的类型还包含 `Equals()` 和 `GetHashCode()` 的重写实现。\n\n`ToString()`\
  \ 方法本身是导致属性顺序变化产生新数据类型的重要原因。如果两个独立的匿名类型（可能在完全不同的类型甚至命名空间中）被统一，然后更改属性顺序，会对另一个实现的\
  \ `ToString()` 产生明显且可能不可接受的影响。此外，在执行期间，可以对类型进行反射并检查成员——甚至是动态调用这些成员之一（在运行时确定调用哪个成员）。相同类型的成员顺序变化可能会触发意外的结果。为了避免这个问题，C#\
  \ 设计者决定生成不同的类型。\n\n### 高级主题：匿名类型的集合初始化器\n\n你无法为匿名类型使用集合初始化器，因为集合初始化器需要调用构造函数，而构造函数无法命名。解决方法是定义一个如\
  \ `static List<T> CreateList<T>(T t) { return new List<T>(); }` 的方法。方法类型推断允许类型参数被隐含而不是显式指定，因此这种变通方法成功允许创建匿名类型的集合。\n\
  \n另一种初始化匿名类型集合的方法是使用数组初始化器。由于无法在构造函数指定数据类型，数组初始化语法允许使用 `new[]` 初始化匿名数组（参见 LISTING\
  \ 15.29）。\n\n**LISTING 15.29: 初始化匿名类型数组**\n\n\n\n\n```csharp\nusing System;\nusing\
  \ System.Collections.Generic;\n\npublic class Program\n{\n    public static void\
  \ Main()\n    {\n        var worldCup2006Finalists = new[]\n        {\n        \
  \    new\n            {\n                TeamName = \"France\",\n              \
  \  Players = new string[]\n                {\n                    \"Fabien Barthez\"\
  , \"Gregory Coupet\",\n                    \"Mickael Landreau\", \"Eric Abidal\"\
  ,\n                    // ...\n                }\n            },\n            new\n\
  \            {\n                TeamName = \"Italy\",\n                Players =\
  \ new string[]\n                {\n                    \"Gianluigi Buffon\", \"\
  Angelo Peruzzi\",\n                    \"Marco Amelia\", \"Cristian Zaccardo\",\n\
  \                    // ...\n                }\n            }\n        };\n\n  \
  \      Print(worldCup2006Finalists);\n    }\n\n    private static void Print<T>(IEnumerable<T>\
  \ items)\n    {\n        foreach(T item in items)\n        {\n            Console.WriteLine(item);\n\
  \        }\n    }\n}\n```\n\n结果变量是一个匿名类型 `items` 的数组，由于它是一个数组，因此它必须是同质的。\n\n## 总结\n\
  \n本章描述了 `foreach` 循环工作的内部机制，并解释了执行它所需的接口。此外，开发者经常对集合进行过滤以减少项目，并投影集合以使项目采用不同的形式。为了这一目的，本章讨论了如何使用标准查询操作——`LINQ`\
  \ 在 `System.Linq.Enumerable` 类上引入了集合扩展方法——来执行集合操作的细节。\n\n在标准查询操作的介绍中，我们详细介绍了延迟执行的原理，并强调了开发者应该如何小心，避免通过枚举集合内容的细微调用来无意中重新执行表达式。标准查询操作的延迟执行和随之而来的隐式执行是代码效率的一项重要因素，特别是当查询执行的开销很大时。程序员\
  \ 应该将查询对象视为查询对象，而不是结果，并且应该预期查询即使已经执行过，仍会完全执行。查询对象并结果将与之前执行时的结果相同。\n\n`LISTING 15.23`\
  \ 出现在“高级主题”部分，是因为连续调用多个标准查询操作具有复杂性。虽然类似的执行需求可能很常见，但没有必要直接依赖标准查询操作。在下一章中将展示查询表达式，`^(13)`\
  \ 这种类似于 SQL 的语法，用于操作集合，这种方式通常更易于编写代码和阅读。\n\n`13`。从 C# 3.0 开始。\n\n本章以对匿名类型的详细查看结束，并解释了为什么如果你有\
  \ C# 7.0 或更高版本，元组（tuples）实际上是一种更优的方法。\n\n## 16. 使用查询表达式的 LINQ\n\n`第 15 章` 的结尾显示了一个使用标准查询操作进行\
  \ `GroupJoin()`、`SelectMany()` 和 `Distinct()` 的查询。结果是一个跨越多行的语句，比通常只使用早期 C# 版本特性编写的语句更为复杂且难以理解。处理丰富数据数据集的现代程序通常需要此类复杂的查询；因此，如果语言让它们变得更容易读，将是有益的。像\
  \ SQL 这样的领域特定查询语言使得查询的阅读和理解变得容易得多，但缺乏 C# 语言的完整威力。这就是为什么 C# 语言设计人员增加了`query expressions`语法`^(1)`。通过查询表达式，许多标准查询操作表达式被转换为更可读的代码，就像\
  \ SQL 一样。\n\n`1`。从 C# 3.0 开始。\n\n![Images](img/16fig00.jpg)\n\n在本章中，我们引入了查询表达式并使用它们来表达\
  \ `第 15 章` 中的许多查询。\n\n### 引入查询表达式\n\n开发者最频繁执行的两个操作是`过滤`集合以消除不需要的项目，以及`投影`集合使项目采用不同的形式。例如，给定一个文件集合，我们可以过滤它以创建一个仅包含\
  \ `.cs` 扩展文件的的新集合，或者仅包含大于 100 万字节的文件集合。我们还可以投影文件集合，创建一个指向文件所在目录路径及相应目录大小的新集合。查询表达式为这两种常见操作提供了简单直观的语法。`LISTING\
  \ 16.1` 显示了一个过滤字符串集合的查询表达式；`OUTPUT 16.1` 显示了结果。\n\n**LISTING 16.1: 简单查询表达式**\n\n\
  ```csharp\npublic static class CSharp\n{\n    public static readonly ReadOnlyCollection<string>\
  \ Keywords = new(\n        new string[]\n        {\n            \"abstract\",\"\
  add*\",\"alias*\",\"as\",\"ascending*\",\n            \"async*\",\"await*\",\"base\"\
  ,\"bool\",\"break\",\n            \"by*\",\"byte\",\"case\",\"catch\",\"char\",\"\
  checked\",\n            \"class\",\"const\",\"continue\",\"decimal\",\"default\"\
  ,\n            \"delegate\",\"descending*\",\"do\",\"double\",\"dynamic*\",\n  \
  \          \"else\",\"enum\",\"equals*\",\"event\",\"explicit\",\"extern\",\n  \
  \          \"false\",\"finally\",\"fixed\",\"float\",\"for\",\"foreach\",\n    \
  \        \"from\",\"get*\n```\n\n\n\n\n熟悉 SQL 的开发者会注意到，查询表达式的语法与 SQL 相似。这种设计是刻意为之——旨在让熟悉\
  \ SQL 的程序员能够轻松学习 LINQ。然而，它们之间存在明显的区别。大多数 SQL 丰富的开发者会注意到的第一个区别是，这里显示的 C# 查询表达式子句顺序如下：`from`、然后是\
  \ `where`、最后是 `select`。相应的 SQL 查询将 `SELECT` 子句放在第一个，随后是 `FROM` 子句，最后是 `WHERE` 子句。\n\
  \n这种顺序变化的原因之一是为了启用 IntelliSense。这是 IDE 的一项功能，编辑器可以生成实用的用户界面元素，例如描述给定对象成员的下拉列表。由于\
  \ `from` 最先出现并将字符串数组 `Keywords` 标识为数据源，代码编辑器可以推断出范围变量 `word` 的类型为 `string`。当你向编辑器中输入代码并输入\
  \ `word` 后面的点时，编辑器将只显示 `string` 的成员。\n\n如果 `from` 子句像 SQL 中那样出现在 `select` 之后，那么在你输入查询语句时，编辑器将不知道\
  \ `word` 的数据类型是什么，因此无法显示 `word` 成员列表。例如，在 LISTING 16.1 中，无法预测 `Contains()` 是 `word`\
  \ 的可能成员。\n\nC# 查询表达式的顺序也更贴近逻辑执行操作的顺序。在评估查询时，你首先识别集合（由 `from` 子句描述），然后过滤掉不需要的项目（使用\
  \ `where` 子句），最后描述所需的结果（使用 `select` 子句）。\n\n最后，C# 查询表达式的顺序确保了“where”（范围）变量的作用域规则在大多数情况下与局部变量的作用域规则保持一致。例如，（范围）变量必须在使用之前由某个子句（通常是\
  \ `from` 子句）声明，这就像局部变量在使用之前必须先声明一样。\n\n### 投影\n\n查询表达式的结果类型为 `IEnumerable<T>` 或\
  \ `IQueryable<T>` 的集合。^(2) 实际类型 `T` 是从 `select` 或 `group by` 子句推断出的。在 LISTING 16.1\
  \ 中，编译器知道 `Keywords` 的类型为 `string[]`，它可以转换为 `IEnumerable<string>`，因此推断出 `word` 的类型为\
  \ `string`。查询以 `select word` 结束，这意味着查询表达式的结果必须是字符串集合，因此查询表达式的类型是 `IEnumerable<string>`。\n\
  \n2. 从实际问题来说，查询表达式的结果几乎总是 `IEnumerable<T>` 或其派生类型。虽然有些反常，但创建一个返回其他类型的查询方法的实现是合法的；语言并没有要求查询表达式的结果必须转换为\
  \ `IEnumerable<T>`。\n\n在这种情况下，查询的“输入”和“输出”都是字符串集合。然而，如果 `select` 子句中的表达式是完全不同的类型，输出类型可能与输入类型完全不同。考虑\
  \ LISTING 16.2 中的查询表达式及其在 OUTPUT 16.2 中对应的输出。\n\n**LISTING 16.2: 使用查询表达式进行投影**\n\
  \n```\nusing System;\nusing System.Collections.Generic;\nusing System.IO;\nusing\
  \ System.Linq;\n// ...\n    public static void List1\n        (string rootDirectory,\
  \ string searchPattern)\n    {\n        IEnumerable<string> fileNames = Directory.GetFiles(\
  \           \n            rootDirectory, searchPattern);                       \
  \     \n\n        IEnumerable<FileInfo> fileInfos =                            \
  \ \n            from fileName in fileNames                                \n   \
  \         select new FileInfo(fileName);                            \n\n       \
  \ foreach (FileInfo fileInfo in fileInfos)\n        {\n            Console.WriteLine(\n\
  \                $@\".{ fileInfo.Name } ({\n                    fileInfo.LastWriteTime\
  \ })\");\n        }\n    }\n    //...\n```\n\n**OUTPUT 16.2**\n\n```\nAccount.cs\
  \ (11/22/2011 11:56:11 AM)\nBill.cs (8/10/2011 9:33:55 PM)\nContact.cs (8/19/2011\
  \ 11:40:30 PM)\nCustomer.cs (11/17/2011 2:02:52 AM)\nEmployee.cs (8/17/2011 1:33:22\
  \ AM)\nPerson.cs (10/22/2011 10:00:03 PM)\n```\n\n该查询表达式的结果是一个 `IEnumerable<FileInfo>`，而不是\
  \ `Directory.GetFiles()` 返回的 `IEnumerable<string>` 数据类型。查询表达式的 `select` 子句可能会投影出一个与\
  \ `from` 子句表达式收集的不同的数据类型。\n\n在这个示例中，选择 `FileInfo` 类型是因为它包含了所需输出的两个相关字段：文件名和最后写入时间。如果你需要其他信息，可能没有这样方便的类型。元组^(3)\
  \ 提供了一种投影你所需的精确数据的方便方法，而无需创建显式类型。LISTING 16.3 提供了与 LISTING 16.2 类似的输出，但使用的是元组语法而非\
  \ `FileInfo`。\n\n3. C# 7.0 之前使用的匿名类型。\n\n**LISTING 16.3: 查询表达式中的元组**\n\n```\nusing\
  \ System;\nusing System.IO;\nusing System.Linq;\n// ...\n    public static void\
  \ List2\n        (string rootDirectory, string searchPattern)\n    {\n        var\
  \ fileNames = Directory.EnumerateFiles(                           \n           \
  \ rootDirectory, searchPattern);                                  \n        var\
  \ fileResults =                                                   \n           \
  \ from fileName in fileNames                                      \n           \
  \ select                                                          \n           \
  \ (                                                               \n           \
  \     Name: fileName,                                             \n           \
  \     LastWriteTime: File.GetLastWriteTime(fileName)              \n           \
  \ );                                                              \n\n        foreach\
  \ (var fileResult in fileResults)\n        {\n            Console.WriteLine(\n \
  \               $@\"{ fileResult.Name } ({                                   \n\
  \                    fileResult.LastWriteTime })\");                          \n\
  \        }\n    }\n    //...\n```\n\n### 学者主题：查询表达式的延迟执行\n\n\n\n\n使用查询表达式符号编写的查询表现出延迟执行特性，就像第\
  \ 15 章中编写的查询一样。再次考虑列表 16.1 中将查询对象赋值给变量 `selection` 的操作。查询的创建和对变量的赋值并没有执行查询；它们仅仅是构建了一个表示该查询的对象。在创建查询对象时，并没有调用\
  \ `word.Contains(\"*\")` 方法。相反，查询表达式保存了选择标准，以便在遍历由 `selection` 变量所标识的集合时使用。\n\n\
  为了演示这一点，请考虑列表 16.4 和相应的输出(输出 16.3)。\n\n**列表 16.4: 延迟执行与查询表达式（示例 1）**\n\n```c\nusing\
  \ System;\nusing System.Collections.Generic;\nusing System.Linq;\n// ...\n    private\
  \ static void ShowContextualKeywords2()\n    {\n        IEnumerable<string> selection\
  \ = from word in CSharp.Keywords\n                                        where\
  \ IsKeyword(word)\n                                        select word;\n      \
  \  Console.WriteLine(\"Query created.\");\n        foreach(string keyword in selection)\n\
  \        {\n            // 这里没有输出空格\n            Console.Write(keyword);\n     \
  \   }\n    }\n\n    // 控制台输出的副作用包含\n    // 在谓词中以演示延迟执行；\n    // 带有副作用的谓词在生产环境\n\
  \    // 代码中是糟糕的做法\n    private static bool IsKeyword(string word)\n    {\n     \
  \   if(word.Contains('*'))\n        {\n            Console.Write(\" \");\n     \
  \       return true;\n        }\n        else\n        {\n            return false;\n\
  \        }\n    }\n    //...\n```\n\n**输出 16.3**\n\n```\nQuery created.\n add* alias*\
  \ ascending* async* await* by* descending* dynamic*\nequals* from* get* global*\
  \ group* into* join* let* nameof* nonnull*\non* orderby* partial* remove* select*\
  \ set* value* var* where* when* yiel\nd*\n```\n\n在列表 16.4 中，`foreach` 循环内部没有输出空格。执行谓词\
  \ `IsKeyword()` 时打印空格的副作用发生在查询被迭代时——而不是在查询被创建时。因此，尽管 `selection` 是一个集合（毕竟它的类型是 `IEnumerable<T>`），但在赋值时刻，`from`\
  \ 子句之后的所有内容都仅作为选择标准。直到我们开始遍历 `selection`，这些标准才被应用。\n\n现在考虑第二个示例（参见列表 16.5 和输出 16.4）。\n\
  \n**列表 16.5: 延迟执行与查询表达式（示例 2）**\n\n```csharp\nusing System;\nusing System.Collections.Generic;\n\
  using System.Linq;\n// ...\n    private static void CountContextualKeywords()\n\
  \    {\n        int delegateInvocations = 0;\n        string func(string text)\n\
  \        {\n            delegateInvocations++;\n            return text;\n     \
  \   }\n\n        IEnumerable<string> selection =\n            from keyword in CSharp.Keywords\n\
  \            where keyword.Contains('*')\n            select func(keyword);\n\n\
  \        Console.WriteLine(\n            $\"1\\. delegateInvocations={ delegateInvocations\
  \ }\");\n\n        // 执行计数应该为每个选定的项目\n        // 调用一次 func\n        Console.WriteLine(\n\
  \            $\"2\\. Contextual keyword count={ selection.Count() }\");\n\n    \
  \    Console.WriteLine(\n            $\"3\\. delegateInvocations={ delegateInvocations\
  \ }\");\n\n        // 执行计数应该为每个选定的项\n        // 调用一次 func\n        Console.WriteLine(\n\
  \            $\"4\\. Contextual keyword count={ selection.Count() }\");\n\n    \
  \    Console.WriteLine(\n            $\"5\\. delegateInvocations={ delegateInvocations\
  \ }\");\n\n        // 缓存该值以便未来的计数不会触发\n        // 查询的再次调用\n        List<string>\
  \ selectionCache = selection.ToList();\n\n        Console.WriteLine(\n         \
  \   $\"6\\. delegateInvocations={ delegateInvocations }\");\n\n        // 从缓存的集合中检索计数\n\
  \        Console.WriteLine(\n            $\"7\\. selectionCache count={ selectionCache.Count\
  \ }\");\n\n        Console.WriteLine(\n            $\"8\\. delegateInvocations={\
  \ delegateInvocations }\");\n    }\n    //...\n```\n\n**输出 16.4**\n\n```\n1\\. delegateInvocations=0\n\
  2\\. Contextual keyword count=28\n3\\. delegateInvocations=28\n4\\. Contextual keyword\
  \ count=28\n5\\. delegateInvocations=56\n6\\. delegateInvocations=84\n7\\. selectionCache\
  \ count=28\n8\\. delegateInvocations=84\n```\n\n列表 16.5 并没有定义单独的方法，而是使用 Lambda 表达式来计算方法被调用的次数。\n\
  \n输出中有两点非常引显著。首先，在 `selection` 被赋值后，`DelegateInvocations` 保持为零。在赋值给 `selection`\
  \ 时，并没有执行对 `Keywords` 的迭代。如果 `Keywords` 是一个属性，则该属性调用将在赋值运行时。因此，尽管 `selection` 是一个集合（毕竟它的类型是\
  \ `IEnumerable<T>`），但在赋值时，`from` 子句之后的所有内容都仅作为选择标准。直到我们开始遍历 `selection`，这些标准才被应用。然而，一旦我们调用了\
  \ `ToList()`，`selection` 或 `Items` 等指示容器的术语就更为合适，因为我们开始计算内部的项了。换句话说，`selection`\
  \ 变量承担了双重目的：保存查询信息并作为检索数据的容器。\n\n输出 16.4 的另一个重要特性是，再次调用 `Count()` 会导致每个选定的项目再次调用\
  \ `func`。由于 `selection` 同时作为查询和集合，请求计数需要通过遍历 `selection` 引用的 `IEnumerable<string>`\
  \ 集合来重新执行查询。C# 编译器不知道是否有人修改了数组中的字符串导致计数发生变化，因此每次都必须重新计数以确保答案是正确且最新的。同样，对 `selection`\
  \ 执行 `foreach` 循环也会再次触发 `func`。`System.Linq.Enumerable` 提供的其他扩展方法也是如此。\n\n### 高级主题：实现延迟执行\n\
  \n延迟执行是通过使用委托和表达式树来实现的。委托提供了创建和操作指向包含可执行表达式的方法引用的能力。表达式树同样提供了创建和操作有关表达式信息的能力，这些信息可以在之后进行检查和操作。\n\
  \n在列表 16.5 中，`where` 子句的谓词表达式和 `select` 子句的投影表达式被编译器转换为表达式 Lambda 表达式，然后这些 Lambda\
  \ 表达式被转换为委托创建。查询表达式的结果是一个持有这些委托引用的对象。只有当查询结果被迭代时，查询对象才会实际执行委托。\n\n#### 过滤\n\n\n\n\
  \n在 LISTING 16.1 中，`where` 子句过滤掉保留关键字，但不过滤上下文关键字。该子句对集合进行“垂直”过滤：如果你将集合视为一个垂直的项列表，`where`\
  \ 子句会使该垂直列表变短，从而集合包含更少的项。过滤标准通过 `predicate`（谓词）表示——这是一个返回 `bool` 的 lambda 表达式，例如\
  \ `word.Contains()`（如 LISTING 16.1 所示）或 `File.GetLastWriteTime(fileName) < DateTime.Now.AddMonths(-1)`。后者在\
  \ LISTING 16.6 所示，其输出显示在 OUTPUT 16.5 中。\n\n#### LISTING 16.6: 使用 `where` 的查询表达式过滤\n\
  \n```csharp\nusing System;\nusing System.Collections.Generic;\nusing System.IO;\n\
  using System.Linq;\n// ...\n    public static void FindMonthOldFiles(\n        string\
  \ rootDirectory, string searchPattern)\n    {\n        IEnumerable<FileInfo> files\
  \ =\n            from fileName in Directory.EnumerateFiles(\n                rootDirectory,\
  \ searchPattern)\n            where File.GetLastWriteTime(fileName) <          \
  \          \n                DateTime.Now.AddMonths(-1)                        \
  \     \n            select new FileInfo(fileName);\n\n        foreach(FileInfo file\
  \ in files)\n        {\n            //  为了简化，假设当前目录\n            //  是 rootDirectory\
  \ 的子目录\n            string relativePath = file.FullName.Substring(\n           \
  \     Directory.GetCurrentDirectory().Length);\n            Console.WriteLine(\n\
  \                $\".{ relativePath } ({ file.LastWriteTime })\");\n        }\n\
  \    }\n    //...\n```\n\n#### OUTPUT 16.5\n\n```\n.\\TestData\\Bill.cs (8/10/2011\
  \ 9:33:55 PM)\n.\\TestData\\Contact.cs (8/19/2011 11:40:30 PM)\n.\\TestData\\Employee.cs\
  \ (8/17/2011 1:33:22 AM)\n.\\TestData\\Person.cs (10/22/2011 10:00:03 PM)\n```\n\
  \n#### 排序\n\n要使用查询表达式对项进行排序，可以使用 `orderby` 子句，如 LISTING 16.7 所示。\n\n#### LISTING\
  \ 16.7: 使用 `orderby` 子句的查询表达式排序\n\n```csharp\nusing System;\nusing System.Collections.Generic;\n\
  using System.Linq;\nusing System.IO;\n// ...\n    public static void ListByFileSize1(\n\
  \        string rootDirectory, string searchPattern)\n    {\n        IEnumerable<string>\
  \ fileNames =\n            from fileName in Directory.EnumerateFiles(\n        \
  \        rootDirectory, searchPattern)\n            orderby (new FileInfo(fileName)).Length\
  \ descending,           \n                fileName                             \
  \                      \n            select fileName;\n\n        foreach(string\
  \ fileName in fileNames)\n        {\n            Console.WriteLine(fileName);\n\
  \        }\n    }\n    //...\n```\n\nLISTING 16.7 使用 `orderby` 子句对 `Directory.GetFiles()`\
  \ 返回的文件首先按文件大小降序排序，然后按文件名升序排序。多个排序标准用逗号隔开，以便项先按大小排序，如果大小相同，则再按文件名排序。`ascending`\
  \ 和 `descending` 是指示排序方向的上下文关键字。指定顺序为升序或降序是可选的；如果省略了方向（在此处 `filename` 上被省略），则默认为\
  \ `ascending`。\n\n#### `let` 子句\n\nLISTING 16.8 包含一个与 LISTING 16.7 非常相似的查询，区别在于\
  \ `IEnumerable<T>` 的类型参数是 `FileInfo`。然而，这个查询存在一个问题：我们必须冗余地创建两次 `FileInfo`，分别在 `orderby`\
  \ 子句和 `select` 子句中。\n\n#### LISTING 16.8: 投影 `FileInfo` 集合并按文件大小排序\n\n```csharp\n\
  using System;\nusing System.Collections.Generic;\nusing System.Linq;\nusing System.IO;\n\
  // ...\n    public static void ListByFileSize2(\n        string rootDirectory, string\
  \ searchPattern)\n    {\n        IEnumerable<FileInfo> files =\n            from\
  \ fileName in Directory.EnumerateFiles(\n                rootDirectory, searchPattern)\n\
  \            orderby new FileInfo(fileName).Length, fileName              \n   \
  \         select new FileInfo(fileName);                               \n\n    \
  \    foreach (FileInfo file in files) \n        {\n            //  为了简化，假设当前目录\n\
  \            //  是 rootDirectory 的子目录\n            string relativePath = file.FullName.Substring(\n\
  \                Directory.GetCurrentDirectory().Length);\n            Console.WriteLine(\n\
  \                $\".{ relativePath }({ file.Length })\");\n        }\n    }\n \
  \   //...\n```\n\n遗憾的是，尽管结果是正确的，但 LISTING 16.8 最终为集合中的每个项实例化了两次 `FileInfo` 对象。为了避免这种不开销，可以使用\
  \ `let` 子句，如 LISTING 16.9 所示。\n\n#### LISTING 16.9: 查询表达式中的结果排序\n\n```csharp\n//...\n\
  IEnumerable<FileInfo> files =\n    from fileName in Directory.EnumerateFiles(\n\
  \        rootDirectory, searchPattern)\n    let file = new FileInfo(fileName)\n\
  \    orderby file.Length, fileName                               \n    select file;\n\
  //...\n```\n\n`let` 子句引入了一个新变量，用于存储查询剩余部分使用的表达式值。你可以根据需要添加任意多个 `let` 子句；只需将其插入到第一个\
  \ `from` 子句之后、最终的 `select` 子句之前。\n\n#### 分组\n\n一种常见的数据处理场景是相关项的分组。在 SQL 中，这通常涉及聚合项以产生摘要或总计。然而，LINQ\
  \ 的表达能力明显更高。LINQ 表达式允许将项分组为系列子集合，然后这些组可以与查询中的项关联。例如，LISTING 16.10 和 OUTPUT 16.6\
  \ 展示了如何将上下文关键字和普通关键字分组在一起。\n\n#### LISTING 16.10: 将查询结果分组在一起\n\n```csharp\nusing\
  \ System;\nusing System.Collections.Generic;\nusing System.Linq;\n// ...\n    private\
  \ static void GroupKeywords()\n    {\n        IEnumerable<IGrouping<bool, string>>\
  \ selection =\n            from word in CSharp.Keywords\n            group word\
  \ by word.Contains('*');\n\n        foreach(IGrouping<bool, string> wordGroup\n\
  \            in selection)\n        {\n            Console.WriteLine(Environment.NewLine\
  \ + \"{0}:\",\n                wordGroup.Key ?\n                    \"Contextual\
  \ Keywords\" : \"Keywords\");\n            foreach(string keyword in wordGroup)\n\
  \            {\n                Console.Write(\" \" +\n                    (wordGroup.Key\
  \ ?\n                        keyword.Replace(\"*\", null) : keyword));\n       \
  \     }\n        }\n    }\n    //...\n```\n\n\n\n\n在 LISTING 16.10 中有几点需要注意。首先，查询结果是一个类型为\
  \ `IGrouping<bool, string>` 的元素序列。第一个类型参数表示 `by` 之后的“分组键”表达式类型为 `bool`，第二个类型参数表示\
  \ `group` 之后的“分组元素”表达式类型为 `string`。也就是说，该查询产生了一个组的序列，其中组内的每个 `string` 对应的布尔键值都是相同的。\n\
  \n由于带有 `group by` 子句的查询会产生一个集合序列，因此遍历结果的常用模式是创建嵌套的 `foreach` 循环。在 LISTING 16.10\
  \ 中，外层循环遍历分组，并将关键字类型作为标题打印出来。嵌套的 `foreach` 循环将组中的每个关键字作为项目打印在标题下方。\n\n此查询表达式的结果本身也是一个序列，你可以像查询其他序列一样对其进行查询。LISTING\
  \ 16.11 和 OUTPUT 16.7 展示了如何创建一个额外的查询，在产生组序列的查询上添加投影。（下一节关于查询延续，将展示一种更愉悦的语法，用于为完整查询添加更多查询子句。）\n\
  \n#### LISTING 16.11: 在 `group` 子句后选择元组\n\n```csharp\nusing System;\nusing System.Collections.Generic;\n\
  using System.Linq;\n// ...\n    private static void GroupKeywords1()\n    {\n  \
  \      IEnumerable<IGrouping<bool, string>> keywordGroups =              \n    \
  \        from word in CSharp.Keywords                                  \n      \
  \      group word by word.Contains('*');                             \n\n      \
  \  IEnumerable<(bool IsContextualKeyword,                            \n        \
  \    IGrouping<bool, string> Items)> selection =                   \n          \
  \  from groups in keywordGroups                                  \n            select\
  \                                                        \n            (       \
  \                                                      \n                IsContextualKeyword:\
  \ groups.Key,                          \n                Items: groups         \
  \                                    \n            );                          \
  \                                  \n\n        foreach (\n            (bool isContextualKeyword,\
  \ IGrouping<bool, string> items)\n                in selection)\n        {\n\n \
  \           Console.WriteLine(Environment.NewLine + \"{0}:\",\n                isContextualKeyword\
  \ ?\n                    \"Contextual Keywords\" : \"Keywords\");\n            foreach\
  \ (string keyword in items)                             \n            {\n      \
  \          Console.Write(\" \" + keyword.Replace(\"*\", null));\n            }\n\
  \        }\n    }\n    //...\n```\n\n#### OUTPUT 16.7\n\n```\nKeywords:\n abstract\
  \ as base bool break byte case catch char checked class\nconst continue decimal\
  \ default delegate do double else enum\nevent explicit extern false finally fixed\
  \ float for foreach goto if\nimplicit in int interface internal is lock long namespace\
  \ new null\noperator out override object params private protected public\nreadonly\
  \ ref return sbyte sealed short sizeof stackalloc static\nstring struct switch this\
  \ throw true try typeof uint ulong unsafe\nushort using virtual unchecked void volatile\
  \ while\nContextual Keywords:\n add alias ascending async await by descending dynamic\
  \ equals from\nget global group into join let nameof nonnull on orderby partial\
  \ remove\nselect set value var where yield\n```\n\n`group` 子句的结果会产生一个产生 `IGrouping<TKey,\
  \ TElement>` 对象集合的查询——正如同 `GroupBy()` 标准查询操作符所做的那样（参见 第 15 章）。后续查询中的 `select` 子句使用元组有效地将\
  \ `IGrouping<TKey, TElement>.Key` 重命名为 `IsContextualKeyword`，并将子集合属性命名为 `Items`。通过此更改，嵌套的\
  \ `foreach` 循环使用了 `wordGroup.Items` 而不是直接使用 `wordGroup`，如 LISTING 16.10 所示。元组中可以添加的另一个项目可能是子集合中项目的计数。然而，此功能已经通过\
  \ LINQ 的 `wordGroup.Items.Count()` 方法可用，因此直接在匿名类型中添加该内容的益处尚存疑。\n\n#### 使用 `into`\
  \ 的查询延续\n\n正如我们在 LISTING 16.11 中看到的，你可以将现有的查询作为第二个查询的输入。然而，当你想要将一个查询的结果作为另一个查询的输入时，并没有必要编写一个完全新的查询表达式。你可以使用上下文关键字\
  \ `into` 通过**查询延续子句**来扩展任何查询。查询延续只不过是创建两个查询并将第一个作为第二个的输入的语法糖。由 `into` 子句引入的范围变量（LISTING\
  \ 16.11 中的 `groups`）将成为查询剩余部分的范围变量；任何之前的之前的范围变量在逻辑上都是较早查询的一部分，不能在查询延续中使用。LISTING\
  \ 16.12 重写了 LISTING 16.11 的代码，使用查询延续代替两个查询。\n\n#### LISTING 16.12: 不使用查询延续进行选择\n\
  \n```csharp\nusing System;\nusing System.Collections.Generic;\nusing System.Linq;\n\
  // ...\n    private static void GroupKeywords1()\n    {\n        IEnumerable<(bool\
  \ IsContextualKeyword, \n            IGrouping<bool, string> Items)> selection =\n\
  \            from word in CSharp.Keywords\n            group word by word.Contains('*')\
  \                           \n                into groups                      \
  \                      \n                select                                \
  \                 \n                (                                          \
  \            \n                    IsContextualKeyword: groups.Key,            \
  \       \n                    Items: groups                                    \
  \  \n                );                                                     \n \
  \       // ...\n    }\n    //...\n```\n\n使用 `into` 在现有查询上运行附加查询的能力并不特定于以 `group`\
  \ 子句结尾，而是适用于所有查询表达式。查询延续只是编写消耗其他查询结果表达式的简写。你可以将 `into` 视为“管道操作符”，因为它将第一个查询的结果“管道”到第二个查询中。你可以以这种方式任意地链接多个查询。\n\
  \n#### 使用多个 `from` 子句扁平化序列\n\n通常需要将序列序列“扁平化”为单个序列。例如，客户序列的每个成员可能都有相关的订单序列，或者目录序列的每个成员可能都有相关的文件序列。`SelectMany`\
  \ 序列符（在第 15 章 中讨论）连接了所有子序列；使用查询表达式语法实现相同操作，可以使用多个 `from` 子句，如 LISTING 16.13 所示。\n\
  \n#### LISTING 16.13: 多重选择\n\n```csharp\nvar selection =\n    from word in CSharp.Keywords\n\
  \    from character in word                                            \n    select\
  \ character;\n```\n\n上述查询将产生字符序列 `a`, `b`, `s`, `t`, `r`, `a`, `c`, `t`, `a`, `d`,\
  \ d, *, `a, l`, i, ….\n\n多个 `from` 子句还可以用于产生**笛卡尔积**——多个序列的所有可能的组合集合——如 LISTING\
  \ 16.14 所示。\n\n#### LISTING 16.14: 笛卡尔积\n\n\n\n\n\n```cs\nvar numbers = new[] {\
  \ 1, 2, 3 };\nIEnumerable<(string Word, int Number)> product =\n     from word in\
  \ CSharp.Keywords\n     from number in numbers                                 \
  \          \n     select (word, number);\n```\n\n此查询将产生一个元组序列：(`abstract`, `1`),\
  \ (`abstract`, `2`), (`abstract`, `3`), (`as`, `1`), (`as`, `2`)……\n\n### 初学者主题：去重成员（Distinct\
  \ Members）\n\n通常情况下，我们希望从集合中只返回唯一的（即不同的）项，丢弃任何重复项。查询表达式没有去重成员的显式语法，但可以通过查询运算符 `Distinct()`\
  \ 来实现该功能，该运算符是在第 15 章中引入的。要将查询运算符应用于查询表达式，必须将表达式括在括号中，这样编译器才不会认为 `Distinct()` 的调用是\
  \ `select` 子句的一部分。列表 16.15 提供了一个示例；输出 16.8 显示了结果。\n\n#### 列表 16.15：从查询表达式获取去重成员\n\
  \n```cs\nusing System;\nusing System.Linq;\nusing System.Collections.Generic;\n\
  // ...\n    public static void ListMemberNames()\n    {\n        IEnumerable<string>\
  \ enumerableMethodNames = (\n            from method in typeof(Enumerable).GetMembers(\n\
  \                System.Reflection.BindingFlags.Static |\n                System.Reflection.BindingFlags.Public)\n\
  \                orderby method.Name\n                select method.Name).Distinct();\n\
  \        foreach(string method in enumerableMethodNames)\n        {\n          \
  \  Console.Write($\"{ method }, \");\n        }\n    }\n    //...\n```\n\n#### 输出\
  \ 16.8\n\n```\nAggregate, All, Any, Append, AsEnumerable, Average, Cast, Chunk,\n\
  Concat, Contains, Count, DefaultIfEmpty, Distinct, DistinctBy, ElementAt\n, ElementAtOrDefault,\
  \ Empty, Except, ExceptBy, First, FirstOrDefault, Gr\noupBy, GroupJoin, Intersect,\
  \ IntersectBy, Join, Last, LastOrDefault, Lon\ngCount, Max, MaxBy, Min, MinBy, OfType,\
  \ Order, OrderBy, OrderByDescendin\ng, OrderDescending, Prepend, Range, Repeat,\
  \ Reverse, Select, SelectMany,\nSequenceEqual, Single, SingleOrDefault, Skip, SkipLast,\
  \ SkipWhile, Sum,\nTake, TakeLast, TakeWhile, ThenBy, ThenByDescending, ToArray,\
  \ ToDiction\nary, ToHashSet, ToList, ToLookup, TryGetNonEnumeratedCount, Union,\n\
  UnionBy, Where, Zip,\n```\n\n在这个示例中，`typeof(Enumerable).GetMembers()` 返回 `System.Linq.Enumerable`\
  \ 的所有成员（方法、属性等）的列表。然而，这些成员中有许多是重载的，甚至是多次。与其多次显示同一个成员，不如从查询表达式中调用 `Distinct()`。这消除了列表中的重复名称。（我们在第\
  \ 18 章中详细介绍了 `typeof()` 和反射[可以使用 `GetMembers()` 等方法的地方]。）\n\n### 查询表达式本质就是方法调用\n\
  \n令人惊讶的是，添加查询表达式^(4)并不需要更改通用语言运行时 (CLR) 或通用中间语言 (CIL)。相反，C# 编译器仅将查询表达式翻译为一系列方法调用。例如，考虑列表\
  \ 16.1 中的查询表达式，其部分内容出现在列表 16.16 中。\n\n4。从 C# 3.0 开始。\n\n#### 列表 16.16：简单查询表达式\n\n\
  ```cs\nprivate static void ShowContextualKeywords1()\n{\n    IEnumerable<string>\
  \ selection =\n        from word in CSharp.Keywords\n        where !word.Contains('*')\n\
  \        select word;\n    // ...\n}\n```\n\n编译后，列表 16.16 中的表达式被转换为来自 `System.Linq.Enumerable`\
  \ 的 `IEnumerable<T>` 扩展方法调用，如列表 16.17 所示。\n\n#### 列表 16.17：查询表达式翻译为标准查询运算符语法\n\n\
  ```cs\nprivate static void ShowContextualKeywords2()\n{\n    IEnumerable<string>\
  \ selection =                                     \n        CSharp.Keywords.Where(word\
  \ => !word.Contains('*'));             \n    // ...\n}\n```\n\n如第 15 章讨论的那样，lambda\
  \ 表达式随后会由编译器自身翻译，生成一个带有 lambda 主体的方法，且其使用涉及为该方法分配一个委托。\n\n每个查询表达式都可以（并且必须）翻译为方法调用，但并不是每个方法调用序列都有对应的查询表达式。例如，扩展方法\
  \ `TakeWhile<T>(Func<T, bool> predicate)` 没有等价的查询表达式，该方法只要谓词返回 `true`，就会不断地从集合中返回项。\n\
  \n对于那些既有方法调用形式又有查询表达式的查询，哪种更好呢？这取决于主观判断。\n\n#### 指南\n\n- 使用查询语法来使查询更易读，特别是当涉及 `from`、`let`、`join`\
  \ 或 `group` 子句时。\n- 如果查询涉及没有查询表达式语法的操作（如 `Count()`、`TakeWhile()` 或 `Distinct()`），请考虑使用查询运算符（方法调用形式）。\n\
  \n## 总结\n\n本章引入了一种语法——查询表达式。熟悉 SQL 的读者会立即发现查询表达式与 SQL 的相似之处。然而，查询表达式还引入了额外的功能，例如分组为层次对象，这在\
  \ SQL 中是不可能的。查询表达式的所有功能可以通过查询运算符实现，但查询表达式通常为此类查询提供了更简单的语法。无论使用标准运算符还是查询表达式，结果都是对集合\
  \ API 使用方式的重要改进——这种改进最终为面向对象的语言与关系数据库交互的方式提供了范式转变。\n\n在下一章中，我们将通过研究 .NET 框架集合类型并探索如何定义自定义集合来继续讨论集合。\n\
  \n## 17. 构建自定义集合\n\n第 15 章涵盖了标准查询运算符——即 `IEnumerable<T>` 上提供通用方法的扩展方法。然而，这些运算符并没有让所有集合都适用于所有任务；仍然需要不同的集合类型。某些集合更适合通过键搜索，而另一些更适合通过位置访问项。某些集合像队列：先进先出；另一些像栈：后进先出；还有一些完全没有顺序。\n\
  \n.NET 框架提供了大量的集合类型，适用于许多需要集合的场景。本介绍了其中一些集合类型以及它们实现的接口。它还描述了如何创建支持标准功能（如索引）的自定义集合。此外，它探索了使用\
  \ `yield return` 语句来创建实现 `IEnumerable<T>` 的类和方法。这一特性^(1) 极大简化了可以使用 `foreach` 语句枚举的集合的实现。\n\
  \n\n\n\n\nMicrosoft .NET Framework 提供了许多非泛型集合类和接口，但通常情况下，这些内容的存在仅仅是为了与泛型引入之前编写的代码兼容。泛型集合类型比非泛型集合更快，因为它们避免了装箱（boxing）开销，而且具有更高的类型安全性。因此，新代码几乎应该始终专门地使用泛型集合类型。在本书中，我们假设你主要使用泛型集合类型。\n\
  \n![Images](img/17fig00.jpg)\n\n## 更多集合接口\n\n我们已经看到集合是如何实现 `IEnumerable<T>` 的，这是允许对集合元素进行迭代的主要接口。还存在许多额外的接口由更复杂的集合实现。图\
  \ 17.1 显示了集合类实现的接口层级结构。\n\n这些接口提供了一种标准方法来执行常见任务，例如遍历、索引和计数集合中的元素。本节将检查这些接口（至少是所有的泛型接口），从图\
  \ 17.1 的底部开始向上进行。\n\n![Images](img/17fig01.jpg)\n\n**图 17.1：集合类层级结构**\n\n## `IList<T>`\
  \ 与 `IDictionary<TKey, TValue>`\n\n英语字典可以被看作是定义的集合。特定的定义可以通过查找其关联的“键”（key）即被定义的单词来快速访问。字典集合类同样是值的集合，其中每个值都可以通过使用其关联的唯一键来快速访问。然而，请注意，语言字典通常按键的字母顺序存储定义；字典类可能会选择这样做，但通常不会。字典集合最好被看作是键和关联值的*无序列表*，除非文档中专门说明它是有序的。同样，人们通常不会考虑查找“字典中的第六个定义”；字典类通常通过键提供索引，而不通过位置提供。\n\
  \n相比之下，列表按特定顺序存储值并通过位置访问它们。在某种意义上，列表只是字典的一种特例，其中“键”始终是一个整数，且“键集”始终是从零开始的连续非负整数集。尽管如此，这种差异足够大，值得拥有完全不同的类型来表示它。\n\
  \n因此，在选择集合类来解决某些数据存储或检索问题时，要查找的前两个接口是 `IList<T>` 和 `IDictionary<TKey, TValue>`。这些接口指示了集合类型是侧重于给定位置索引时检索值，还是侧重于给定关联键时检索值。\n\
  \n这两个接口都要求实现它们的类必须提供一个索引器（indexer）。在 `IList<T>` 的情况下，索引器的操作数对应于所检索元素的位置：索引器接收一个整数，并允许你访问列表中的第\
  \ *n* 个元素。在 `IDictionary<TKey, TValue>` 接口的情况下，索引器的操作数对应于与值相关的键，并允许你访问该值。\n\n##\
  \ `ICollection<T>`\n\n`IList<T>` 和 `IDictionary<TKey, TValue>` 都实现了 `ICollection<T>`。一个既没有实现\
  \ `IList<T>` 没有实现 `IDictionary<TKey, TValue>` 的集合极可能实现 `ICollection<T>`（尽管不一定，因为集合也可以实现要求更低的\
  \ `IEnumerable` 或 `IEnumerable<T>`）。`ICollection<T>` 派自 `IEnumerable<T>` 并包含两个成员：`Count`\
  \ 和 `CopyTo()`。\n\n- `Count` 属性返回集合中的元素总数。起初，这似乎足够使用 `for` 循环遍历集合中的每个元素，但实际上，集合还需要支持通过索引进行检索，而\
  \ `ICollection<T>` 接口并不包含此（尽管 `IList<T>` 包含了）。\n- `CopyTo()` 方法提供了将集合转换为数组的能力。该方法包含一个\
  \ `index` 参数，以便你可以指定在目标数组中插入元素的位置。要使用该方法，你必须初始化目标数组具有足够的容量（从 `index` 开始），以容纳 `ICollection<T>`\
  \ 中的所有元素。\n\n## 主要集合类\n\n存在五类主要的集合类，它们在数据插入、存储和检索方式方面相互不同。每个泛型类都位于 `System.Collections.Generic`\
  \ 命名空间，而它们的非泛型等价类位于 `System.Collections` 命名空间。\n\n## 列表集合：`List<T>`\n\n`List<T>`\
  \ 类具有与数组类似的属性。区别在于这些类会随着元素数量的而自动扩展。（相比之下，数组的大小是固定的。）此外，列表可以通过显式调用 `TrimToSize()`\
  \ 或 `Capacity` 来收缩（参见图 17.2）。\n\n![Images](img/17fig02.jpg)\n\n**图 17.2：`List<>`\
  \ 类图**\n\n这些类被归为列表集合，其区别功能是每个元素都可以像数组一样通过索引单独访问。因此，你可以使用索引运算符在列表集合类中设置和访问元素，其中索引参数的值对应于元素在集合中的位置。代码\
  \ 17.1 显示了一个示例，输出 17.1 显示了结果。\n\n**代码 17.1：使用 `List<T>`**\n\n```\nusing System;\n\
  using System.Collections.Generic;\n\npublic class Program\n{\n    public static\
  \ void Main()\n    {\n        List<string> list = new List<string>\n        { \"\
  Sneezy\", \"Happy\", \"Dopey\", \"Doc\", \"Sleepy\", \"Bashful\", \"Grumpy\" };\n\
  \n        list.Sort();\n        Console.WriteLine($\"In alphabetical order {list[0]}\
  \ is the first dwarf while {list[¹]} is the last.\");\n\n        list.Remove(\"\
  Grumpy\");\n    }\n}\n```\n\n**输出 17.1**\n\n```\nIn alphabetical order Bashful is\
  \ the first dwarf while Sneezy is the last.\n```\n\nC# 是基于零索引的；因此，代码 17.1 中的索引 0\
  \ 对应于第一个元素，索引 6 表示第七个元素。通过索引检索元素不涉及搜索。相反，它涉及到到内存某个位置的快速且简单的“跳转”操作。\n\n`List<T>`\
  \ 是有序集合；`Add()` 方法将给定项目添加到列表末尾。在代码 17.1 调用 `Sort()` 之前，`\"Sneezy\"` 是第一个而`\"Grumpy\"\
  ` 是最后一个；调用之后，列表按字母顺序排序，而不是按照添加项的顺序排序。某些集合会在添加元素时自动排序，但 `List<T>` 并不是其中之一；为了对元素进行排序，需要显式调用\
  \ `Sort()`。\n\n要移除元素，你可以使用 `Remove()` 或 `RemoveAt()` 方法分别移除给定的元素或移除特定索引处的元素。\n\n\
  ## 进阶主题：自定义集合排序\n\n你可能奇奇过代码 17.1 中的 `List<T>.Sort()` 方法是如何知道将列表元素按字母顺序排序的。`string`\
  \ 类型实现了 `IComparable<string>` 接口，该接口有一个方法 `CompareTo()`。它返回一个整数，指示传递的元素大于、小于还是等于当前元素。如果元素类型实现了泛型\
  \ `IComparable<T>` 接口（或非泛型的 `IComparable` 接口），排序算法默认将使用它来确定排序顺序。\n\n\n\n\n但如果元素类型没有实现\
  \ `IComparable<T>`，或者比较两个事物的默认逻辑不满足你的需求怎么办？要指定非默认的排序，你可以调用 `List<T>.Sort()` 的重载方法，它接受一个\
  \ `IComparer<T>` 作为参数。\n\n`IComparable<T>` 和 `IComparer<T>` 之间的区别细微但很重要。第一个接口意味着：“我知道如何将*我自己*与同类型的另一个实例进行比较。”后者意味着：“我如何如何比较给定类型的*两个事物*。”\n\
  \n当对一个数据类型有许多不同的可能排序方式，且没有一种明显是最佳方式时，通常使用 `IComparer<T>` 接口。例如，你可能有一个 `Contact`\
  \ 对象的集合，有时你想按名称、位置、生日、地理区域或任何其他可能对其进行排序。与其选择一种排序策略并让 `Contact` 类实现 `IComparable<Contact>`，不如创建几个实现\
  \ `IComparer<Contact>` 的不同类可能更明智。LISTING 17.2 显示了 `LastName` 和 `FirstName` 比较的示例实现。\n\
  \n**LISTING 17.2: 实现 `IComparer<T>`**\n\n```csharp\nusing System;\nusing System.Collections.Generic;\n\
  // ...\npublic class Contact\n{\n    public string FirstName { get; private set;\
  \ }\n    public string LastName { get; private set; }\n\n    public Contact(string\
  \ firstName, string lastName)\n    {\n        this.FirstName = firstName;\n    \
  \    this.LastName = lastName;\n    }\n}\npublic class NameComparison : IComparer<Contact>\n\
  {\n    public int Compare(Contact? x, Contact? y)\n    {\n        if(Object.ReferenceEquals(x,\
  \ y))\n            return 0;\n        if(x == null)\n            return 1;\n   \
  \     if(y == null)\n            return -1;\n        int result = StringCompare(x.LastName,\
  \ y.LastName);\n        if(result == 0)\n            result = StringCompare(x.FirstName,\
  \ y.FirstName);\n        return result;\n    }\n\n    private static int StringCompare(string?\
  \ x, string? y)\n    {\n        if(Object.ReferenceEquals(x, y))\n            return\
  \ 0;\n        if(x == null)\n            return 1;\n        if(y == null)\n    \
  \        return -1;\n        return x.CompareTo(y);\n    }\n}\n```\n\n要按姓后后按名排序\
  \ `List<Contact>`，你可以调用 `contactList.Sort(new NameComparer())`。\n\n### 全序 (Total\
  \ Ordering)\n\n在实现 `IComparable<T>` 或 `IComparer<T>` 时，你需要产生一个**全序**（total order）。你对\
  \ `CompareTo` 的实现必须为任何可能的项对提供完全一致的顺序。这种排序要求具有一些基本特征。例如，每个元素都被要求认为与自己相等。如果元素 `X`\
  \ 被认为等于元素 `Y`，且元素 `Y` 被认为等于元素 `Z`，那么这三个元素 `X`、`Y` 和 `Z` 必须被认为相互相等。如果元素 `X` 被认为大于\
  \ `Y`，则 `Y` 必须认为小于 `X`。并且不能出现“传递性悖论”——也就是说，你不能出现 `X` 大于 `Y`、`Y` 大于 `Z` 且 `Z` 大于\
  \ `X` 的情况。如果你未能提供全序，排序算法的操作将未定义；它可能会产生疯狂的顺序，可能会导致崩溃，可能会进入无限循环等。\n\n注意，例如，LISTING\
  \ 17.2 中的比较器是如何确保全序的，即使参数是 `null` 引用。例如，说“如果任一元素为 `null`，则返回零”是不合法的，因为这样两个非空事物可能等于\
  \ `null` 但不互相相等。\n\n#### 指南\n\n**必须确保自定义比较逻辑产生一致的“全序”。**\n\n### 搜索 `List<T>`\n\n\
  为了在 `List<T>` 中搜索特定元素，你使用 `Contains()`、`IndexOf()`、`LastIndexOf()` 和 `BinarySearch()`\
  \ 方法。前三个方法从第一个元素（对于 `LastIndexOf()` 是最后一个元素）开始遍历数组，并检查每个元素直到找到所需的元素。这些算法的执行时间与在命中之前搜索的元素数量成正比。（注意，集合类并不要求集合内的所有元素都是唯一的。如果集合中的两个或多个元素相同，`IndexOf()`\
  \ 返回第一个索引，`LastIndexOf()` 返回最后一个索引。）\n\n`BinarySearch()` 使用快得多的二分查找算法，但要求元素是排序的。`BinarySearch()`\
  \ 方法的一个有用特性是，如果未找到元素，则返回一个负整数。该值的按位取反（`~`）是比搜索元素大的下一个元素的索引，如果没有更大的值，则为元素总数。这为在特定位置向列表插入新值以保持排序提供了一种方便的方法。LISTING\
  \ 17.3 提供了一个示例。\n\n**LISTING 17.3: 使用 `BinarySearch()` 结果的按位取反值**\n\n```csharp\n\
  using System;\nusing System.Collections.Generic;\n\npublic class Program\n{\n  \
  \  public static void Main()\n    {\n        List<string> list = new List<string>();\n\
  \        list.Add(\"public\");\n        list.Add(\"protected\");\n        list.Add(\"\
  private\");\n\n        list.Sort();\n\n        int search = list.BinarySearch(\"\
  protected internal\");\n        if(search < 0)\n        {\n            list.Insert(~search,\
  \ \"protected internal\");\n        }\n\n        foreach (string item in list)\n\
  \        {\n            Console.WriteLine(item);\n        }\n    }\n}\n```\n\n注意，如果列表没有经过排序，此代码将无法找到元素，即使它在列表中。LISTING\
  \ 17.3 的结果出现在 OUTPUT 17.2。\n\n**OUTPUT 17.2**\n\n```\nprivate\nprotected\npublic\n\
  ```\n\n### 高级主题：使用 `FindAll()` 查找多个项\n\n有时你必须在列表中查找多个项，并且搜索标准比仅仅查找特定值复杂。为了支持这一点，`System.Collections.Generic.List<T>`\
  \ 包含一个 `FindAll()` 方法。`FindAll()` 接受 `Predicate<T>` 参数，这是一个方法的委托。LISTING 17.4 显示了如何使用\
  \ `FindAll()` 方法。\n\n**LISTING 17.4: 演示 `FindAll()` 及其 Predicate 参数**\n\n```csharp\n\
  using System;\nusing System.Collections.Generic;\n\npublic class Program\n{\n  \
  \  public static void Main()\n    {\n        List<int> list = new List<int>();\n\
  \        list.Add(1);\n        list.Add(2);\n        list.Add(3);\n        list.Add(2);\n\
  \n        List<int> results = list.FindAll(Even);                    \n\n      \
  \  foreach (int number in results)                            \n        {\n    \
  \        Console.WriteLine(number);\n        }\n    }\n    public static bool Even(int\
  \ value) =>\n        (value % 2) == 0;\n}\n```\n\n在 LISTING 17.4 的 `FindAll()` 调用中，你传递了一个委托实例\
  \ `Even()`。该方法在整数参数值为偶数时返回 `true`。`FindAll()` 接受该委托实例并对列表中的每个项调用 `Even()`。每当返回 `true`\
  \ 时，它将其添加到一个新的 `List<T>` 实例中，并在检查列表中的每个项后返回该实例。关于委托的完整讨论出现在第 13 章。\n\n2。此列表使用了 C#\
  \ 2.0 的委托类型推断。\n\n#### 字典集合：`Dictionary<TKey, TValue>`\n\n\n\n另一类集合类是字典类——具体来说 `Dictionary<TKey,\
  \ TValue>`（参见图 17.3）。与列表集合不同，字典类存储的是键/值对。名称充当唯一键，类似于在数据库中通过主键访问记录的方式，用于查找相应的元素。这增加了访问字典元素时的一些复杂性，但由于通过键查找是极效的操作，因此这是一种非常有用的集合。请注意，键可以是任何数据类型，而不仅仅是字符串或数值。\n\
  \n![Images](img/17fig03.jpg)\n\n**图 17.3：`Dictionary` 类图**\n\n## 插入元素\n\n向字典中插入元素的一种方法是使用\
  \ `Add()` 方法，将键和值都作为参数传递，如列表 17.5 所示。\n\n**列表 17.5：向 `Dictionary<TKey, TValue>`\
  \ 添加项**\n\n```csharp\nusing System;\nusing System.Collections.Generic;\n\npublic\
  \ class Program\n{\n    public static void Main()\n    {\n        var colorMap =\
  \ new Dictionary<string, ConsoleColor>\n        {\n            [\"Error\"] = ConsoleColor.Red,\n\
  \            [\"Warning\"] = ConsoleColor.Yellow,\n            [\"Information\"\
  ] = ConsoleColor.Green\n        };\n        colorMap.Add(\"Verbose\", ConsoleColor.White);\
  \                      \n        // ...\n    }\n}\n```\n\n在使用字典初始化器^(3) 初始化字典后（参见第\
  \ 15 章中的“集合初始化器”节），列表 17.5 插入了字符串 `a` 对应键 \"Verbose\" 的白色 `ConsoleColor`。如果已经添加了相同键的元素，则会抛出异常。\n\
  \n3。从 C# 6.0 开始。\n\n添加元素的另一种方法是使用索引器，如列表 17.6 所示。\n\n**列表 17.6：使用索引运算符在 `Dictionary<TKey,\
  \ TValue>` 中插入项**\n\n```csharp\nusing System;\nusing System.Collections.Generic;\n\
  \npublic class Program\n{\n    public static void Main()\n    {\n        var colorMap\
  \ = new Dictionary<string, ConsoleColor>\n            {\n                [\"Error\"\
  ] = ConsoleColor.Red,\n                [\"Warning\"] = ConsoleColor.Yellow,\n  \
  \              [\"Information\"] = ConsoleColor.Green\n            };\n\n      \
  \  colorMap[\"Verbose\"] = ConsoleColor.White;                        \n       \
  \ colorMap[\"Error\"] = ConsoleColor.Cyan;                           \n\n      \
  \  // ...\n    }\n}\n```\n\n在列表 17.6 中观察到的第一点是，索引操作符不需要整数。相反，索引操作数的类型由第一个类型参数（`string`）指定，而通过索引器设置或检索的值的类型由第二个类型参数（`ConsoleColor`）指定。\n\
  \n在列表 17.6 中需要注意的第二点是使用了两次相同的键（`\"Error\"`）。在第一次赋值中，没有字典值对应给定的键。当发生这种情况时，字典集合类会使用提供的键插入一个新值。在第二次赋值中，已经存在指定键的元素。它没有插入额外的元素，而是将\
  \ `\"Error\"` 键之前的 `ConsoleColor` 值替换为 `ConsoleColor.Cyan`。\n\n## 访问与搜索\n\n尝试从具有不存在的键的字典读取值将抛出\
  \ `KeyNotFoundException`。`ContainsKey()` 方法允许你在访问值之前检查特定键是否被使用，从而避免异常。\n\n`Dictionary<TKey,\
  \ TValue>` 实现为哈希表；无论字典中存储了多少值，该数据结构在通过键搜索时都能提供极快的访问。相比之下，检查字典集合中是否存在特定值是一个具有线性性能特征的耗时操作，类似于在未排序的列表中搜索。要执行此操作，你使用\
  \ `ContainsValue()` 方法，它会顺序遍历集合中的每个元素。\n\n你使用 `Remove()` 方法删除字典元素，将键而不是元素值作为参数传递。\n\
  \n## 遍历字典\n\n因为向字典添加值时同时需要键和值，因此枚举字典元素的 `foreach` 循环变量必须是 `KeyValuePair<TKey, TValue>`。列表\
  \ 17.7 显示了使用 `foreach` 循环枚举字典中的键和值的代码片段。输出出现在输出 17.3 中。\n\n**列表 17.7：使用 `foreach`\
  \ 遍历 `Dictionary<TKey, TValue>`**\n\n```csharp\nusing System;\nusing System.Collections.Generic;\n\
  \npublic class Program\n{\n    public static void Main()\n    {\n        var colorMap\
  \ = new Dictionary<string, ConsoleColor>\n            {\n                [\"Error\"\
  ] = ConsoleColor.Red,\n                [\"Warning\"] = ConsoleColor.Yellow,\n  \
  \              [\"Information\"] = ConsoleColor.Green,\n                [\"Verbose\"\
  ] = ConsoleColor.White\n            };\n\n        Print(colorMap);\n  }\n\n    private\
  \ static void Print(\n      IEnumerable<KeyValuePair<string, ConsoleColor>> items)\n\
  \    {\n        foreach (KeyValuePair<string, ConsoleColor> item in items)\n   \
  \     {\n            Console.ForegroundColor = item.Value;\n          Console.WriteLine(item.Key);\n\
  \      }\n    }\n}\n```\n\n**输出 17.3**\n\n```\nError\nWarning\nInformation\nVerbose\n\
  ```\n\n请注意，这里显示的项顺序是它们被添加的顺序，就像它们添加到列表中一样。字典的实现通常按照添加顺序进行枚举，但这一特性并不是强制要求的，因此你不应该依赖它。\n\
  \n## 指南\n\n**不要对集合的枚举顺序做任何无根据的假设。如果集合没有说明按特定顺序进行枚举，则无法保证以任何特定顺序输出。**\n\n如果你只想处理字典的键或只处理元素，可以通过\
  \ `Keys` 和 `Values` 属性分别获取。这些属性返回的数据类型为 `ICollection<T>`。这些属性返回的数据是原始字典内部数据的引用而非副本；字典内部的变化会自动反映在\
  \ `Keys` 和 `Values` 属性返回的集合中。\n\n\n\n\n例如，假设你希望使用 LISTING 17.2 中的 `Contact` 类型创建一个\
  \ `Dictionary<Contact, string>`。然而，你希望任何两个 `Contact` 对象只要它们的姓和名相同，就被认为是相等的，而不论这两个对象是否为引用相等。就像你可以提供\
  \ `IComparer<T>` 的实现来对列表进行排序，你也可以提供 `IEqualityComparer<T>` 的实现来确定两个键是否被视为相等。此接口需要两个方法：一个返回两个项目是否相等，另一个返回字典可用于快速索引的“哈希码”（hash\
  \ code）。LISTING 17.8 显示了一个示例。\n\n**LISTING 17.8: 实现 `IEqualityComparer<T>`**\n\n\
  ```csharp\nusing System.Collections.Generic;\n\npublic class ContactEquality : IEqualityComparer<Contact>\n\
  {\n    public bool Equals(Contact? x, Contact? y)\n    {\n        if(object.ReferenceEquals(x,\
  \ y))\n            return true;\n        if(x == null || y == null)\n          \
  \  return false;\n        return x.LastName == y.LastName &&\n            x.FirstName\
  \ == y.FirstName;\n    }\n\n    public int GetHashCode(Contact x)\n    {\n     \
  \   if(x is null)\n            return 0;\n\n        int h1 = x.FirstName == null\
  \ ? 0 : x.FirstName.GetHashCode();\n        int h2 = x.LastName == null ? 0 : x.LastName.GetHashCode();\n\
  \        return h1 * 23 + h2;\n    }\n}\n```\n\n要创建一个使用此相等性比较器的字典，你可以使用构造函数 `new\
  \ Dictionary<Contact, string>(new ContactEquality)`。\n\n#### 初学者主题：相等性比较的要求\n\n\
  正如 第 10 章 中讨论的，几条重要的规则适用于相等性和哈希码算法。在集合的语境下，遵守这些规则至关重要。正如正确排序列表需要自定义排序比较来提供全序，同样，哈希表也需要自定义相等性比较满足某些保证。最重要的要求是：如果\
  \ `Equals()` 对两个对象返回 `true`，则 `GetHashCode()` 必须对这两个对象返回相同的值。注意，反之是不成立的：两个不相等的项目可能有相同的哈希码。（事实上，*必须*存在两个具有相同哈希码的不相等项目，因为只有\
  \ 2³² 种可能的哈希码，而不相等对象的数量远多于这个数字！）\n\n第二次重要的要求是：对同一个项目两次调用 `GetHashCode()` 在该项目位于哈希表期间必须产生相同的结果。然而，请注意，两个“看起来相等”的对象并不要求在程序的两次独立运行中给出相同的哈希码。例如，今天给给定的联系人分配一个哈希码，而在两周后你第二次运行程序时，给“同一个”联系人分配不同的哈希码是完全合法的。不要将哈希码持久化到数据库中并期望它们在程序的不同运行中保持稳定。\n\
  \n理想情况下，`GetHashCode()` 的结果看起来应该是随机的。也就是说，输入的微小变化应该导致输出巨大变化，且结果应该大致均匀地分布在所有可能的整数范围内。然而，设计一种既极快又能产生极佳分布输出的哈希算法是很的；尝试找到一个良好的折中点。\n\
  \n最后，`GetHashCode()` 和 `Equals()` 不得抛出异常。注意 LISTING 17.8 中的代码是如何谨慎地从不解引用 `null`\
  \ 引用的，例如。\n\n总结一下，这里是核心原则：\n\n- 相等的对象必须具有相同的哈希码。\n- 对象的哈希码在其实例生命周期内不应更改（至少在它位于哈希表期间）。\n\
  - 哈希算法应该快速产生分布良好的哈希值。\n- 哈希算法应避免在所有可能的对象状态下抛出异常。\n\n#### 排序集合：`SortedDictionary<TKey,\
  \ TValue>` 和 `SortedList<T>`\n\n排序集合类（参见 图 17.4）按键存储元素 `SortedDictionary<TKey, TValue>`，按值存储元素\
  \ `SortedList<T>`。如果我们将 LISTING 17.7 中的代码更改为使用 `SortedDictionary<string, string>`\
  \ 而不是 `Dictionary<string, string>`，则程序的输出将如 输出 17.4 所示。\n\n![Images](img/17fig04.jpg)\n\
  \n**图 17.4：排序集合**\n\n**输出 17.4**\n\n```\nError\nInformation\nVerbose\nWarning\n\
  ```\n\n注意，元素是按键排序的，而不是按值排序。\n\n由于排序集合必须执行额外工作来维护元素的排序顺序，因此插入和删除操作通常比无序字典中的值插入和删除稍慢。\n\
  \n由于排序集合必须以特定顺序存储项目，因此可以通过键也可以通过索引访问值。要通过其在排序列表中的索引访问键或值，请使用 `Keys` 和 `Values` 属性。它们分别返回\
  \ `IList<TKey>` 和 `IList<TValue>` 实例；结果集合可以像任何列表一样被索引。\n\n#### 栈集合：`Stack<T>`\n\n\
  第 12 章讨论了栈集合（参见 图 17.5）。栈集合类被设计为后进先出（LIFO）集合。两个关键方法是 `Push()` 和 `Pop()`。\n\n![Images](img/17fig05.jpg)\n\
  \n**图 17.5：`Stack<T>` 类图**\n\n- `Push()` 将元素插入集合中。元素不需要是唯一的。\n- `Pop()` 按照元素添加的相反顺序移除元素。\n\
  \n要在不修改栈的情况下访问栈上的元素，请使用 `Peek()` 和 `Contains()` 方法。`Peek()` 方法返回 `Pop()` 将检索的下一个元素。\n\
  \n与大多数集合一样，你使用 `Contains()` 方法来确定元素是否存在于栈的任何位置。与所有集合一样，也可能使用 `foreach` 循环遍历栈中的元素。这允许你访问栈中任何位置的值。但请注意，通过\
  \ `foreach` 循环访问值不会将其从栈中移除——只有 `Pop()` 提供此功能。\n\n#### 队列集合：`Queue<T>`\n\n图 17.6\
  \ 所示的队列集合类与栈集合类相同，不同之处它们遵循先入先行（FIFO）的排序模式。它们分别使用 `Enqueue()` 和 `Dequeue()` 方法代替\
  \ `Pop()` 和 `Push()` 方法。队列集合的行为像水管：你使用 `Enqueue()` 方法将对象放入队列的一端，并通过 `Dequeue()`\
  \ 方法从另一端移除。与栈集合类一样，对象不需要是唯一的，队列集合类根据需要自动增大大小。当队列缩小时，它并不一定会收回之前使用的存储空间，因为这将增加插入新元素的成本。然而，如果你知道队列将在很长时间内保持相同的大小，可以使用\
  \ `TrimToSize()` 方法提示它收回存储空间。\n\n![Images](img/17fig06.jpg)\n\n**图 17.6：`Queue<T>`\
  \ 类图**\n\n#### 链表：`LinkedList<T>`\n\n`System.Collections.Generic` 还支持一种允许正向和反向遍历的链表集合。图\
  \ 17.7 显示了类图。（没有对应的非泛型类型。）\n\n![Images](img/17fig07.jpg)\n\n**图 17.7：`LinkedList<T>`\
  \ 和 `LinkedListNode<T>` 类图**\n\n\n\n\n数组、`dictionaries`（字典）和列表都提供了一个 `indexer`（索引器），作为根据键或索引获取或设置集合成员的方便方式。正如我们所看到的，要使用索引器，你只需在集合名称后的方括号中放入索引（或多个索引）即可。你可以定义自己的索引器；代码\
  \ 17.9 展示了一个使用 `Pair<T>` 的示例。\n\n### 代码 17.9：定义索引器\n\n```cs\ninterface IPair<T>\n\
  {\n    T First { get; }\n    T Second { get; }\n    T this[PairItem index] { get;\
  \ }                                \n}\n\npublic enum PairItem\n{\n    First,\n\
  \    Second\n}\n\npublic struct Pair<T> : IPair<T>\n{\n    public Pair(T first,\
  \ T second)\n    {\n        First = first;\n        Second = second;\n    }\n\n\
  \    public T First { get; }\n    public T Second { get; }\n\n    public T this[PairItem\
  \ index]                                  \n    {                              \
  \                                \n        get                               \n\
  \        {                                                          \n         \
  \   switch (index)\n            {\n                case PairItem.First:\n      \
  \              return First;\n                case PairItem.Second:\n          \
  \          return Second;\n                default:\n                    throw new\
  \ NotImplementedException(\n                        $\"The enum { index.ToString()\
  \ } has not been implemented\");\n\n            }\n        }\n        // ...\n \
  \   }                                                              \n}\n```\n\n\
  索引器的声明方式与属性非常相似，不同在于你不是使用属性名称，而是使用关键字 `this` 后跟一个方括号内的参数列表。其体也像属性一样，包含 `get` 和 `set`\
  \ 块。如 代码 17.9 所示，参数不需要是 `int`。事实上，索引可以接受多个参数，甚至可以进行重载。此示例使用 `enum` 来减少调用者为不存在的项提供索引的概率。\n\
  \nC# 编译器从索引操作符创建的公共中间语言 (CIL) 代码是一个名为 `Item` 的特殊属性，它接收一个参数。在 C# 中无法显式创建接受参数的属性，因此\
  \ `Item` 属性在这方面是唯一的。任何标识符为 `Item` 的额外成员，即使其签名完全不同，也会与编译器创建的成员冲突，因此是不允许的。\n\n###\
  \ 高级主题：使用 `IndexerName` 分配索引器属性名称\n\n如前所述，索引器的 CIL 属性名称默认为 `Item`。然而，使用 `IndexerNameAttibute`\
  \ 属性，你可以指定不同的名称。例如，代码 17.10 将名称更改为 `\"Entry\"`。\n\n### 代码 17.10：更改索引器的默认名称\n\n```cs\n\
  [System.Runtime.CompilerServices.IndexerName(\"Entry\")]\npublic T this[PairItem\
  \ index]\n{\n    // ...\n}\n```\n\n这对于 C# 的索引调用者没有影响，但它为那些直接支持索引器的语言指定了名称。\n\n`IndexerNameAttibute`\
  \ 仅仅是编译器为索引器使用不同名称的指令；该属性实际上并不会被编译器发布到元数据中，因此无法通过反射访问。\n\n### 高级主题：使用变长参数定义索引操作符\n\
  \n索引操作符也可以接受变长参数列表。例如，代码 17.11 为 `BinaryTree<T>` 定义了一个索引操作符，这在 第 12 章 中讨论过（并在下一节中也会再次讨论）。\n\
  \n### 代码 17.11：使用变长参数定义索引操作符\n\n```cs\nusing System;\n\npublic class BinaryTree<T>\
  \ \n{\n    // ...\n    public BinaryTree<T> this[params PairItem[]? branches]\n\
  \    {\n        get\n        {\n            BinaryTree<T> currentNode = this;\n\n\
  \            // 允许空数组或 null\n            // 指向根节点\n            int totalLevels =\
  \ branches?.Length ?? 0;\n            int currentLevel = 0;\n\n            while\
  \ (currentLevel < totalLevels)\n            {\n                System.Diagnostics.Debug.Assert(branches\
  \ != null,\n                    $\"{ nameof(branches) } != null\");\n\n        \
  \        currentNode = currentNode.SubItems[\n                    branches[currentLevel]];\n\
  \                if (currentNode == null)\n                {\n                 \
  \   // 此位置的二叉树为 null\n                    throw new IndexOutOfRangeException();\n\
  \                }\n                currentLevel++;\n            }\n           \
  \ return currentNode;\n        }\n    }\n    // ...\n}\n```\n\n`branches` 中的每个项都是一个\
  \ `PairItem`，指示在二叉树中向下导航到哪个分支。例如，\n\n```cs\ntree[PairItem.Second, PairItem.First].Value\n\
  ```\n\n将检索位于第一个分支中的第二个项、紧接着是该分支中的第一个分支的值。\n\n### 返回 `null` 或空集合\n\n在返回数组或集合时，你必须通过返回\
  \ `null` 或一个没有项的集合实例来指示有零项。通常情况下，更好的选择是返回一个没有项的集合实例。通过这样做，你可以避免强制调用者在遍历集合之前检查 `null`。\n\
  \n\n\n\n如果类想要支持使用 `foreach` 循环结构进行迭代，它们必须实现枚举器模式。如第 15 章 所述，在 C# 中，`foreach` 循环结构会被编译器展开为基于从\
  \ `IEnumerable<T>` 接口获取的 `IEnumerator<T>` 接口的 `while` 循环结构。\n\n手动实现枚举模式可能会繁琐，因为它必须维护描述集合中当前位置的所有状态。对于列表集合类型的类，这种内部状态可能很简单；当前位置的索引通常足够了。相比之下，对于需要递归遍历的数据结构（如二叉树），状态可能会非常复杂。^(4)\n\
  \nC# 2.0 引入了一种结构，使得类更容易控制 `foreach` 循环如何在其内容上迭代。\n\n### 定义迭代器\n\n迭代器（Iterators）是实现类方法的一种手段，它们是更复杂的枚举器模式的语法快捷方式。当\
  \ C# 编译器遇到迭代器时，它将其内容展开为实现枚举器模式的 CIL 代码。因此，实现迭代器没有运行时依赖。由于 C# 编译器通过 CIL 代码生成处理实现，使用迭代器并没有真正的运行时性能收益。然而，通过选择迭代器而不是手动实现枚举模式，可能会实现程序员生产效率的巨大提升。要理解这种改进是如何产生的，我们必须首先考虑迭代器在代码中是如何定义的。\n\
  \n### 迭代器语法\n\n迭代器提供了迭代器接口的简写实现，即 `IEnumerable<T>` 和 `IEnumerator<T>` 接口的组合。列表 17.12\
  \ 通过创建一个 `GetEnumerator()` 方法，为泛型 `BinaryTree<T>` 类型声明了一个迭代器。接下来，你将添加对迭代器接口的支持。\n\
  \n**列表 17.12：迭代器接口模式**\n\n```\nusing System.Collections;\nusing System.Collections.Generic;\n\
  \npublic class BinaryTree<T> :\nIEnumerable<T>                                 \
  \                   \n{\n    public BinaryTree(T value)\n    {\n        Value =\
  \ value;\n    }\n\n    #region IEnumerable<T>\n    public IEnumerator<T> GetEnumerator()\
  \                         \n    {\n        // ...\n    }\n    #endregion IEnumerable<T>\n\
  \n    public T Value { get; }\n    public Pair<BinaryTree<T>> SubItems { get; set;\
  \ }\n}\n\npublic struct Pair<T>\n{\n    public Pair(T first, T second) : this()\n\
  \    {\n        First = first;\n        Second = second;\n    }\n    public T First\
  \ { get; }\n    public T Second { get; }\n}\n```\n\n如列表 17.12 所示，我们需要为 `GetEnumerator()`\
  \ 方法提供实现。\n\n### 从迭代器中产生值\n\n迭代器像函数，但它们返回的不是单个值，而是*产生*（yield）一个值序列，每次产生一个。在 `BinaryTree<T>`\
  \ 的情况下，迭代器产生一个类型为提供的 `T` 类型参数值的序列。如果使用了非泛型的 `IEnumerator`，则产生的值将是 `object` 类型。\n\
  \n要正确实现迭代器模式，你需要维护一些内部状态，以便在枚举集合时跟踪你所在的位置。在 `BinaryTree<T>` 的案例中，你跟踪树中哪些元素已经被枚举过，哪些仍待处理。迭代器会被编译器转换为一个“状态机”，该状态机跟踪当前位置并知道如何“移动自身”到下一个位置。\n\
  \n`yield return` 语句在迭代器每次遇到它时都会产生一个值；控制权立即返回给请求该项目的调用者。（这里有一个有趣的点是，控制确实是*立即*返回的，讽刺的是这不像\
  \ `return` 语句。`return` 语句会在沿路执行 finally 块；`yield return` 则不会。）当调用者请求下一个项目时，代码将立即从之前执行的\
  \ `yield return` 语句之后开始执行。在列表 17.13 中，你顺序返回 C# 内置数据类型关键字。结果显示在输出 17.5 中。\n\n**列表\
  \ 17.13：顺序产生某些 C# 关键字**\n\n```\nusing System;\nusing System.Collections.Generic;\n\
  \npublic class CSharpBuiltInTypes : IEnumerable<string>\n{\n    public IEnumerator<string>\
  \ GetEnumerator()\n    {\n        yield return \"object\";\n        yield return\
  \ \"byte\";\n        yield return \"uint\";\n        yield return \"ulong\";\n \
  \       yield return \"float\";\n        yield return \"char\";\n        yield return\
  \ \"bool\";\n        yield return \"ushort\";\n        yield return \"decimal\"\
  ;\n        yield return \"int\";\n        yield return \"sbyte\";\n        yield\
  \ return \"short\";\n        yield return \"long\";\n        yield return \"void\"\
  ;\n        yield return \"double\";\n        yield return \"string\";\n    }\n\n\
  \    // 同样需要 IEnumerable.GetEnumerator 方法\n    // 因为 IEnumerable<T> 继承自 IEnumerable\n\
  \    System.Collections.IEnumerator\n        System.Collections.IEnumerable.GetEnumerator()\n\
  \    {\n        // 调用上方的 IEnumerator<string> GetEnumerator()\n        return GetEnumerator();\n\
  \    }\n}\npublic class Program\n{\n    public static void Main()\n    {\n     \
  \   var keywords = new CSharpBuiltInTypes();\n        foreach (string keyword in\
  \ keywords)\n        {\n            Console.WriteLine(keyword);\n        }\n   \
  \ }\n}\n```\n\n**输出 17.5**\n\n```\nobject\nbyte\nuint\nulong\nfloat\nchar\nbool\n\
  ushort\ndecimal\nint\nsbyte\nshort\nlong\nvoid\ndouble\nstring\n```\n\n此列表的输出是 C#\
  \ 内置类型的列表。\n\n### 迭代器与状态\n\n当 `foreach` 语句第一次调用 `GetEnumerator()` 时（例如列表 17.13 中的\
  \ `foreach (string keyword in keywords)`），会创建一个迭代器对象并将其初始化为特殊的“开始”状态，该状态表示尚未器迭代器，因此尚未产生任何值。只要调用处的\
  \ `foreach` 语句继续执行，迭代器就会保持其状态。每次当循环请求下一个值时，控制进入迭代器并从上次循环的地方继续；存储在迭代器对象中的状态信息用于确定控制必须恢复的位置。当调用处的\
  \ `foreach` 语句终止时，迭代器的状态不再保存。\n\n再次调用 `GetEnumerator()` 总是安全的；必要时将创建“新的”枚举器对象。\n\
  \n图 17.8 显示了发生过程的高层序列图。记住 `MoveNext()` 方法出现在 `IEnumerator<T>` 接口上。\n\n![Images](img/17fig08.jpg)\n\
  \n**图 17.8：带有 `yield return` 应用序列图**\n\n\n\n\n在 LISTING 17.13 中，调用处的 `foreach` 语句会对名为\
  \ `keywords` 的 `CSharpBuiltInTypes` 实例调用 `GetEnumerator()`。根据该迭代器实例（由 `iterator`\
  \ 引用），`foreach` 的每次迭代通过调用 `MoveNext()` 开始。在迭代器内部，你向调用处的 `foreach` 语句返回一个值。在 `yield\
  \ return` 语句之后，`GetEnumerator()` 方法似乎会暂停，直到下一次 `MoveNext()` 请求。回到循环体中，`foreach`\
  \ 语句将产生的值显示在屏幕上。然后它会返回循环，并再次对迭代器调用 `MoveNext()`。注意，第二次时，控制从第二个 `yield return` 语句处继续。再次，`foreach`\
  \ 在屏幕上显示 `CSharpBuiltInTypes` 产生的内容并重新开始循环。此过程一直持续，直到迭代器内部没有更多的 `yield return` 语句。此时，调用处的\
  \ `foreach` 循环终止，因为 `MoveNext()` 返回了 `false`。\n\n### 更多迭代器示例\n\n在修改 `BinaryTree<T>`\
  \ 之前，你必须修改 `Pair<T>` 以使用迭代器支持 `IEnumerable<T>` 接口。LISTING 17.14 是一个产生 `Pair<T>`\
  \ 中每个元素的示例。\n\n**LISTING 17.14: 使用 `yield` 实现 `BinaryTree<T>`**\n\n```sharp\npublic\
  \ struct Pair<T> : IPair<T>,\nIEnumerable<T>                                   \
  \                   \n{\n    public Pair(T first, T second) : this()\n    {\n  \
  \      First = first;\n        Second = second;\n    }\n    public T First { get;\
  \ }\n    public T Second { get; }\n    // ...\n    #region IEnumerable<T>      \
  \                                     \n    public IEnumerator<T> GetEnumerator()\
  \                            \n    {                                           \
  \                     \n        yield return First;                            \
  \              \n        yield return Second;                                  \
  \       \n    }                                                                \n\
  \    #endregion IEnumerable<T>                                        \n\n    #region\
  \ IEnumerable Members                                      \n    System.Collections.IEnumerator\
  \                                   \n        System.Collections.IEnumerable.GetEnumerator()\
  \               \n    {                                                        \
  \        \n        return GetEnumerator();                                     \
  \ \n    }                                                                \n    #endregion\
  \ IEnumerable Members                                   \n}\n```\n\n`public struct\
  \ Pair<T> : IPair<T>, IEnumerable<T> { public Pair(T first, T second) : this() {\
  \ First = first; Second = second; } public T First { get; } public T Second { get;\
  \ }` `// ...` `#region IEnumerable<T> public IEnumerator<T> GetEnumerator() { yield\
  \ return First; yield return Second; } #endregion IEnumerable<T> #region IEnumerable\
  \ Members System.Collections.IEnumerator System.Collections.IEnumerable.GetEnumerator()\
  \ { return GetEnumerator(); } #endregion IEnumerable Members }`\n\n在 LISTING 17.14\
  \ 中，对 `Pair<T>` 类型的迭代循环了两次：首先通过 `yield return First`，然后通过 `yield return Second`。每次遇到\
  \ `GetEnumerator()` 内部的 `yield return` 语句时，状态会被保存，执行似乎似乎“跳出” `GetEnumerator()` 方法上下文并进入循环体。当第二次迭代开始时，`GetEnumerator()`\
  \ 再次执行并到达 `yield return Second` 语句。\n\n`System.Collections.Generic.IEnumerable<T>`\
  \ 继承自 `System.Collections.IEnumerable`。因此，在实现 `IEnumerable<T>` 时，也有必要实现 `IEnumerable`。在\
  \ LISTING 17.14 中，你显式地这样做，实现仅涉及调用 `IEnumerable<T>` 的 `GetEnumerator()` 实现。这种从 `IEnumerable.GetEnumerator()`\
  \ 到 `IEnumerable<T>.GetEnumerator()` 的调用由于 `IEnumerable<T>` 和 `IEnumerable` 之间的类型兼容性（通过继承）而始终有效。由于两个版本的\
  \ `GetEnumerator()` 签名相同（返回类型不区分签名），其中一个或两个实现都必须是显式的。鉴于 `IEnumerable<T>` 版本提供的额外类型安全，你显式地实现了\
  \ `IEnumerable` 的实现。\n\nLISTING 17.15 使用了 `Pair<T>.GetEnumerator()` 方法并在连续的两行中显示\
  \ `\"Inigo\"` 和 `\"Montoya\"`。\n\n**LISTING 17.15: 通过 `foreach` 使用 `Pair<T>.GetEnumerator()`**\n\
  \n```sharp\nvar fullname = new Pair<string>(\"Inigo\", \"Montoya\");\nforeach(string\
  \ name in fullname)\n{\n    Console.WriteLine(name);\n}\n```\n\n注意 `foreach` 循环内部对\
  \ `GetEnumerator()` 的调用是隐式的。\n\n### 在循环内部放置 `yield return`\n\n没有必要硬编码每个 `yield return`\
  \ 语句，就像你在 `CSharpBuiltInTypes` 和 `Pair<T>` 中做的那样。使用 `yield return` 语句，你可以从循环结构内部返回值。LISTING\
  \ 17.16 使用了 `foreach` 循环。每次 `GetEnumerator()` 内部的 `foreach` 执行时，它都会返回下一个值。\n\n**LISTING\
  \ 17.16: 在循环内部放置 `yield return` 语句**\n\n```sharp\npublic class BinaryTree<T> :\n\
  \  IEnumerable<T>\n{\n    // ...\n    #region IEnumerable<T>\n    public IEnumerator<T>\
  \ GetEnumerator()\n    {\n        // 返回此节点上的项\n        yield return Value;\n\n \
  \       // 遍历配对中的每个元素\n        foreach (BinaryTree<T>? tree in SubItems)\n     \
  \   {\n            if(tree != null)\n            {\n                // 因为配对中的每个元素都是树，\n\
  \                // 遍历树并产生每个\n                // 元素\n                foreach(T item\
  \ in tree)\n                {\n                    yield return item;\n        \
  \        }\n            }\n        }\n    }\n    #endregion IEnumerable<T>\n\n \
  \   #region IEnumerable Members\n    System.Collections.IEnumerator\n        System.Collections.IEnumerable.GetEnumerator()\n\
  \    {\n        return GetEnumerator();\n    }\n    #endregion\n    // ...\n}\n\
  ```\n\n在 LISTING 17.16 中，第一次迭代返回二叉树内的根元素。在第二次迭代期间，你遍历了子元素对。如果子元素对包含包含非 `null` 值，你将进入该子节点并产生它的元素。注意\
  \ `foreach (T item in tree)` 是对子节点的递归调用。\n\n正如在 `CSharpBuiltInTypes` 和 `Pair<T>`\
  \ 中观察到的那样，你现在可以使用 `foreach` 循环遍历 `BinaryTree<T>`。LISTING 17.17 演示了这一过程，OUTPUT 17.6\
  \ 显示了结果。\n\n**LISTING 17.17: 使用 `foreach` 使用 `BinaryTree<string>`**\n\n\n\n\n\n\
  ```sharp\n// JFK\nvar jfkFamilyTree = new BinaryTree<string>(\n    \"John Fitzgerald\
  \ Kennedy\")\n{\n    SubItems = new Pair<BinaryTree<string>>(\n        new BinaryTree<string>(\"\
  Joseph Patrick Kennedy\")\n        {\n            // Grandparents (Father's side)\n\
  \            SubItems = new Pair<BinaryTree<string>>(\n                new BinaryTree<string>(\"\
  Patrick Joseph Kennedy\"),\n                new BinaryTree<string>(\"Mary Augusta\
  \ Hickey\"))\n        },\n        new BinaryTree<string>(\"Rose Elizabeth Fitzgerald\"\
  )\n        {\n            // Grandparents (Mother's side)\n            SubItems\
  \ = new Pair<BinaryTree<string>>(\n                new BinaryTree<string>(\"John\
  \ Francis Fitzgerald\"),\n                new BinaryTree<string>(\"Mary Josephine\
  \ Hannon\"))\n        })\n};\n\nforeach (string name in jfkFamilyTree)         \
  \                        \n{                                                   \
  \                  \n    Console.WriteLine(name);                              \
  \            \n} \n```\n\n**输出输出 17.6**\n\n```\nJohn Fitzgerald Kennedy\nJoseph\
  \ Patrick Kennedy\nPatrick Joseph Kennedy\nMary Augusta Hickey\nRose Elizabeth Fitzgerald\n\
  John Francis Fitzgerald\nMary Josephine Hannon\n```\n\n### 进阶主题：递归迭代器的危险\n\n`代码列表\
  \ 17.16` 中的代码在遍历二叉树时会创建新的“嵌套”迭代器。因此，当值由某个节点产生时，该值由该节点的迭代器产生，然后由其父节点的迭代器产生，再由其父节点的迭代器产生，以此此类推，直到最终由根节点的迭代器产生给原始循环。深度为\
  \ *n* 级的值实际上必须通过 *n* 个迭代器的链向上传递其值。如果二叉树相对浅，这通常不是问题；然而，不平衡的二叉树可能非常深，因此递归迭代的开销很大。\n\
  \n### 指南\n\n**在遍历可能存在深层的数据结构时，考虑使用非递归算法。**\n\n### 进阶/初学者主题：`struct` 对比 `class`\n\
  \n将 `Pair<T>` 定义为 `struct` 而不是 `class` 的一个有趣副作用是：`SubItems.First` 和 `SubItems.Second`\
  \ 无法直接赋值，即使设置器（setter）是公共的也是如此。如果你将设置器修改为公共，以下代码将产生编译错误，指示 `SubItems` 无法修改，“因为它不是一个变量”：\n\
  \n```sharp\njfkFamilyTree.SubItems.First =\nnew BinaryTree<string>(\n\"Joseph Patrick\
  \ Kennedy\");\n```\n\n问题在于 `SubItems` 是一个类型为 `Pair<T>` 的属性，这是一个 `struct`。因此，当属性返回值时，会创建一个\
  \ `SubItems` 的副本，在语句结束时立即丢失的副本上分配 `First` 将具有误导性。幸运的是，C# 编译器阻止了这种错误。\n\n为了解决这个问题，不要为\
  \ `First` 赋值（参见 `代码列表 17.17` 中的方法），为 `Pair<T>` 使用 `class` 而不是 `struct`，不要创建 `SubItems`\
  \ 属性而是使用字段，或者在 `BinaryTree<T>` 中提供直接访问 `SubItems` 成员的属性。\n\n#### 取消后续迭代：`yield break`\n\
  \n有时，你可能想要取消后续迭代。你可以通过包含一个 `if` 语句来实现，使得代码中的后续语句不再执行。然而，你也可以使用 `yield break` 来使\
  \ `MoveNext()` 返回 `false`，让控制权立即返回调用者并结束循环。`代码列表 17.18` 展示了此类方法的示例。\n\n**代码列表 17.18：通过\
  \ `yield break` 退出迭代**\n\n```sharp\npublic System.Collections.Generic.IEnumerable<T>\
  \ GetNotNullEnumerator()\n{\n    if ((First == null) || (Second == null))      \
  \                       \n    {                                                \
  \                    \n        yield break;                                    \
  \                 \n    }                                                      \
  \              \n    yield return Second;\n    yield return First;\n}\n```\n\n如果\
  \ `Pair<T>` 类中的元素任为 `null`，则该方法会取消迭代。\n\n`yield break` 语句类似于在确定没有工作要做时在函数顶部放置 `return`\
  \ 语句。这是一种在不将所有剩余代码包裹在 `if` 块中的情况下退出后续迭代的方法。因此，它允许多次退出。请谨慎使用，因为对代码的随意阅读可能会忽略早退的情况。\n\
  \n### 进阶主题：迭代器的工作原理\n\n当 C# 编译器遇到迭代器时，它会将代码展开为对应枚举器设计模式的适当 CIL。在生成的代码中，C# 编译器首先创建一个嵌套私有类来实现实现\
  \ `IEnumerator<T>` 接口，以及它的 `Current` 属性和 `MoveNext()` 方法。`Current` 属性返回与迭代器返回类型对应的类型。在\
  \ `Pair<T>` 的 `代码列表 17.14` 中，迭代器返回 `T` 类型。C# 编译器检查迭代器内部包含的代码，并在 `MoveNext` 方法和 `Current`\
  \ 属性内部创建必要的代码以模拟其行为。对于 `Pair<T>` 迭代器，C# 编译器生成大致等效的代码（参见 `代码列表 17.19`）。\n\n**代码列表\
  \ 17.19：编译器生成的 C# 等效代码**\n\n```sharp\nusing System;\nusing System.Collections;\n\
  using System.Collections.Generic;\n// ...\n    [NullableContext(1)]\n    [Nullable(0)]\n\
  \    public struct Pair<T> : IPair<T>, IEnumerable<T>\n    {\n        public Pair(T\
  \ first, T second)\n        {\n            First = first;\n            Second =\
  \ second;\n        }\n\n        public T First { get; }\n\n        public T Second\
  \ { get; }\n\n        public T this[PairItem index]\n        {\n            get\n\
  \            {\n                PairItem pairItem = index;\n                PairItem\
  \ pairItem2 = pairItem;\n                T result;\n                if (pairItem2\
  \ != PairItem.First)\n                {\n                    if (pairItem2 != PairItem.Second)\n\
  \                    {\n                        throw new NotImplementedException(\n\
  \                            string.Format(\n                                \"\
  The enum {0} has not been implemented\", \n                                index.ToString()));\n\
  \                    }\n                    result = Second;\n                }\n\
  \                else\n                {\n                    result = First;\n\
  \                }\n                return result;\n            }\n        }\n\n\
  \        public IEnumerator<T> GetEnumerator()\n        {\n            yield return\
  \ First;\n            yield return Second;\n            yield break;\n        }\n\
  \n        IEnumerator IEnumerable.GetEnumerator()\n        {\n            return\
  \ GetEnumerator();\n        }\n    }\n}\n```\n\n由于编译器获取 `yield return` 语句并生成类似于你可能会手动编写的类，因此\
  \ C# 中的迭代器表现出与手动实现枚举器设计模式的类相同的性能特性。虽然性能没有提升，但程序员生产效率的提高是巨大的。\n\n### 进阶主题：上下文关键字\n\
  \n许多 C# 关键字是“保留”的，除非带有 `@` 符号，否则不能作为标识符。`yield` 关键字是一个上下文关键字，而不是保留关键字；因此，声明一个名为\
  \ `yield` 的局部变量是合法的（尽管这令人困惑）。事实上，在 C# 1.0 版本之后添加的所有关键字都是上下文关键字；这有助于防止在升级现有程序以用新版本时发生意外破坏。\n\
  \n\n\n\n\n如果 C# 设计者选择使用 `yield value;` 而不是 `yield return value;` 作为迭代器产出值的语法，可能会引入一种可能的歧义：`yield(1+2);`\
  \ 现在可能是在产生一个值，也可能是将该值作为参数传递给名为 `yield` 的方法。\n\n由于以前绝不允许标识符 `yield` 紧现在 `return`\
  \ 或 `break` 之前，因此 C# 编译器知道这种对 `yield` 的用法必须是作为关键字，而不是标识符。\n\n## 在单个类中创建多个迭代器\n\n\
  之前的迭代器示例实现了 `IEnumerable<T>.GetEnumerator()`，这是 `foreach` 隐式查找的方法。有时你可能需要不同的迭代序列，例如反向迭代、过滤结果，或对除默认值之外的对象投影进行迭代。你可以通过将迭代器封装在返回\
  \ `IEnumerable<T>` 或 `IEnumerable` 的属性或方法中，在类中声明额外的迭代器。例如，如果你想反向遍历 `Pair<T>` 的元素，可以提供一个\
  \ `GetReverseEnumerator()` 方法，如列表 17.20 所示。\n\n### 列表 17.20：在返回 IEnumerable<T> 的方法中使用\
  \ `yield return`\n\n```csharp\npublic struct Pair<T> : IPair<T>, IEnumerable<T>\n\
  {\n    // ...\n    public IEnumerable<T> GetReverseEnumerator()                \
  \        \n    {\n        yield return Second;\n        yield return First;\n  \
  \  }\n    // ...\n    public static void Main()\n    {\n        var game = new Pair<string>(\"\
  Redskins\", \"Eagles\");\n        foreach (string name in game.GetReverseEnumerator())\
  \            \n        {\n            Console.WriteLine(name);\n        }\n    }\n\
  }\n```\n\n注意你返回的是 `IEnumerable<T>`，而不是 `IEnumerator<T>`。这与返回 `IEnumerator<T>` 的\
  \ `IEnumerable<T>.GetEnumerator()` 不同。`Main()` 方法中的代码演示了如何使用 `foreach` 循环调用 `GetReverseEnumerator()`。\n\
  \n## yield 语句要求\n\n你只能在返回 `IEnumerator<T>` 或 `IEnumerable<T>` 类型（或其非泛型等价物）的成员中使用\
  \ `yield return` 语句。正体包含 `yield return` 语句的成员不能有简单的 `return`。如果成员使用了 `yield return`\
  \ 语句，C# 编译器会生成必要的代码来维护迭代器的状态。相比之下，如果成员使用 `return` 语句代替 `yield return`，则程序员负责维护自己的状态机并返回一个迭代器接口的实例。此外，就就像具有返回类型的方法中的所有代码路径必须包含一个带值的\
  \ `return` 语句（假设它们没有抛出异常）一样，迭代器中的所有代码路径如果要返回任何数据，必须包含 `yield return` 语句。\n\n以下是对\
  \ `yield` 语句的额外限制，如果违反这些限制将会导致编译器错误：\n\n- `yield` 语句只能出现在方法、用户定义的操作符、或索引器或属性的 `get`\
  \ 访问器内部。该成员不能接受任何 `ref` 或 `out` 参数。\n- `yield` 语句不能出现在匿名方法或 Lambda 表达式的任何位置（请参见第\
  \ 13 章）。\n- `yield` 语句不能出现在 `try` 语句的 `catch` 和 `finally` 子句中。此外，只有在没有 `catch` 块的情况下，`yield`\
  \ 语句才能出现在 `try` 块中。\n\n## 总结\n\n在本章中，我们回顾了关键集合类，并考虑了如何根据它们支持的接口进行分类。每个类都侧重于通过键、索引或\
  \ FIFO 或 LIFO 等机制向集合中插入项和检索项。我们还探索了如何遍历集合。此外，本章解释了如何定义带有自定义迭代器的自定义集合，用于对集合中的项进行（迭代器涉及一个上下文关键字\
  \ `yield`，C# 使用它来生成实现 `foreach` 循环所用迭代器模式的底层 CIL 代码）。\n\n在第 18 章中，我们将探索反射，这是一个之前提到过的话题，尽管几乎没有或完全没有解释。反射允许我们在运行时检查\
  \ CIL 代码中类型的结构。\n\n## 18. 反射、特性与动态编程 [此内容正在开发中。]\n\n**此内容正在开发中。**\n\n## 19. 引入多线程\
