  \                    departmentEmployees\n                ));\n\n        foreach\
  \ (\n            (_, string name, IEnumerable<Employee> employeeCollection) i in\
  \ items)\n        {\n            Console.WriteLine(name);\n            foreach (Employee\
  \ employee in employeeCollection)\n            {\n                Console.WriteLine(\"\
  \\t\" + employee);\n            }\n        }\n        //...\n```\n\nOUTPUT 15.10\n\
  \n```c\nCorporate\n        Mark Michaelis (Chief Computer Nerd)\nHuman Resources\n\
  \        Anne Beard (HR Director)\nEngineering\n        Michael Stokesbary (Senior\
  \ Computer Wizard)\n        Brian Jones (Enterprise Integration Guru)\n        Kevin\
  \ Bost (Programmer Extraordinaire)\n        Thomas Heavey (Software Architect)\n\
  Information Technology\n        Pat Dever (Enterprise Architect)\nPhilanthropy\n\
  \        Eric Edmonds (Philanthropy Coordinator)\n```\n\n为了达到所需的结果，我们使用了 `System.Linq.Enumerable`\
  \ 的 `GroupJoin()` 方法。其参数与 LISTING 15.19 中的相同，除了最后选择的元组外。在 LISTING 15.19 中，Lambda\
  \ 表达式的类型为 `Func<Department, IEnumerable<Employee>, (long Id, string Name, IEnumerable<Employee>\
  \ Employees)(long Id, string Name, IEnumerable<Employee> Employees)`。注意，我们使用第二个类型参数（`IEnumerable<Employee>`）来将每个部门的员工集合投影到结果部门元组中；因此，结果集合中的每个部门都包含一个员工列表。\n\
  \n（熟悉 SQL 的读者会注意到，与 `Join()` 不同，`GroupJoin()` 没有对应的 SQL 等价项，因为 SQL 返回的数据是基于记录的，而不是层次结构的。）\n\
  \n### 进阶主题：使用 `GroupJoin()` 实现外连接\n\n早前的内连接是*等值连接*（equi-joins），因为它们基于对键的等值评估。只有当两个集合中都存在对象时，记录才会出现在结果集合中。然而，有时即使相应的对象不存在，你可能也创建一个记录。例如，与其仅仅因为营销部门没有员工而将其从最终部门列表中排除，不如将其包含在内并附带一个空的员工列表。为了实现这一点，我们通过结合使用\
  \ `GroupJoin()`、`SelectMany()` 以及 `DefaultIfEmpty()` 来执行左外连接。这在 LISTING 15.23 和\
  \ OUTPUT 15.11 中得到了演示。\n\n### LISTING 15.23：使用 `GroupJoin()` 和 `SelectMany()` 实现外连接\n\
  \n```c\nusing System;\nusing System.Linq;\n// ...\n        Department[] departments\
  \ = CorporateData.Departments;\n        Employee[] employees = CorporateData.Employees;\n\
  \n        var items = departments.GroupJoin(\n            employees,\n         \
  \   department => department.Id,\n            employee => employee.DepartmentId,\n\
  \            (department, departmentEmployees) => new\n            {\n         \
  \       department.Id,\n                department.Name,\n                Employees\
  \ = departmentEmployees\n            }).SelectMany(\n                departmentRecord\
  \ =>\n                    departmentRecord.Employees.DefaultIfEmpty(),\n       \
  \         (departmentRecord, employee) => new\n                {\n             \
  \       departmentRecord.Id,\n                    departmentRecord.Name,\n     \
  \               departmentRecord.Employees\n                }).Distinct();\n\n \
  \       foreach (var item in items)\n        {\n            Console.WriteLine(item.Name);\n\
  \            foreach (Employee employee in item.Employees)\n            {\n    \
  \            Console.WriteLine(\"\\t\" + employee);\n            }\n        }\n\
  \        //...\n```\n\nOUTPUT 15.11\n\n```c\nCorporate\n        Mark Michaelis (Chief\
  \ Computer Nerd)\nHuman Resources\n        Anne Beard (HR Director)\nEngineering\n\
  \        Michael Stokesbary (Senior Computer Wizard)\n        Brian Jones (Enterprise\
  \ Integration Guru)\n        Kevin Bost (Programmer Extraordinaire)\n        Thomas\
  \ Heavey (Software Architect)\nInformation Technology\n        Pat Dever (Enterprise\
  \ Architect)\nPhilanthropy\n        Eric Edmonds (Philanthropy Coordinator)\nMarketing\n\
  ```\n\n#### 调用 `SelectMany()`\n\n在有时，你可能会拥有集合的集合。LISTING 15.24 提供了此类场景的示例。`teams`\
  \ 数组包含两个团队，每个团队都有一个球员字符串数组。\n\n### LISTING 15.24：调用 `SelectMany()`\n\n```c\nusing\
