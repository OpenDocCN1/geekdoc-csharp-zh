  \        \n        Print(\"Sum: {0}\", numbers.Sum());                         \
  \      \n        Print(\"Max: {0}\", numbers.Max());                           \
  \    \n        Print(\"Min: {0}\", numbers.Min());                             \
  \  \n    }\n\n    private static void Print<T>(\n            string format, IEnumerable<T>\
