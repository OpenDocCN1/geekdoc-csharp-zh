  \n你还可以在表单上放置“Read Active” 和“Read All”单选按钮，以让用户对读取数据有更多控制权。\n\n## 练习 2 答案\n\n显然你可以这样做，否则我不会问这个问题了。在列表\
  \ 13-6 的 `getRecordCount()` 方法中，删除该行：\n\n```cpp\n records = myFile.Seek(0, SeekOrigin.End);\
  \ // Position file pointer\n```\n\n并将其替换为：\n\n```cpp\n FileInfo myInfo = new FileInfo(fileName);\n\
  \    records = myInfo.Length;\n```\n\n这个练习仅仅证实了完成给定任务几乎总是有多种方法。成为一名丰富程序员的道路之一，就是学习这些替代方案是什么，以及哪一种能为当前任务提供最佳解决方案。\n\
  \n## 练习 3 答案\n\n人们在学习了如何使用随机访问文件后，往往会丢弃顺序文件。你不应该丢弃任何编程工具。顺序文件通常用于持久化非事务型信息。非事务型指的是那些不需要更新和编辑的数据集。顺序文件的密度使其成为非常完美的对应类型数据存储。然而，当数据可能需要更新或进行其他编辑时，随机访问文件通常是更好的选择。\n\
  \n## 练习 4 答案\n\n这是一个某种带有陷阱的问题，因为没有“正确”的答案。在没有过多刻意努力的情况下，我倾向于使用序列化技术将对象的状态传递给需要它进行处理任务的其他应用程序。因此，看起来我将一个对象写入文件，将其传递给其他程序，然后该程序将它还给我关于对象状态的额外（或更改后的）信息。也许这只是我以及我从事的编程类型，但大多数情况下我使用序列化进行临时存储。\n\
  \n如果我知道对象将相当永久地存在（例如客户端文件），我倾向于使用标准的读/写代码。因此，正确的答案是，“取决于……”。\n\n## 练习 5 答案\n\n“关于”（About）对话框通常位于\
  \ MDI 应用程序最右侧的菜单选项下。习惯是将 MDI 应用程序的最右侧菜单选项设置为“帮助”。通常，“帮助”主题提供了一种让你提供有关如何使用程序信息的方法。“帮助”下的最后一个子菜单项是“关于”。因此，你可能首先需要实现的“关于”对话框是一个实现实现\
  \ MDI 接口的应用程序。\n\n接下来，你需要创建一个新的菜单选项，可能命名为 `mnuAbout`。最后，你需要向项目添加新表单（`frmAbout`），并添加标签来传递你认为用户需要的任何信息。最后，添加代码：\n\
  \n```cpp\nprivate void mnuAbout_Click(object sender, EventArgs e)\n{\n    frmAbout\
  \ frm = new frmAbout();\n    frm.ShowDialog();\n}\n```\n\n并重新编译程序。\n\n# 第 14 章\n\
  \n## 练习 1 答案\n\n这两个命令是\n\n```sql\nSELECT COUNT * FROM Friends WHERE status = 1\n\
  ```\n\n以及\n\n```sql\nSELECT SUM(status) FROM Friends\n```\n\n聚合 函数之所以有效是因为给活跃成员赋值了\
  \ 1，给非活跃成员赋值了 0。因此，SUM 也能产生活跃成员的数量。第二种形式用处较小，因为它依赖于 status 的值。\n\n## 练习 2 答案\n\n\
  SELECT 语句可以写为：\n\n```sql\nSELECT * FROM Friends WHERE status = 1 AND ADDR2 <> ''\
  \ AND State = 'IN'\n```\n\n注意 WHERE 谓字的中间表达式是两个单引号，而不是双引号。\n\n## 练习 3 答案\n\n有几种方法可以实现此目标。首先，你可以创建一个新的静态类（例如\
  \ `clsGlobalFriendData`），并赋予它与 Friends 数据结构匹配的属性，使用属性 get 和 set 方法使数据对 `clsDB` 可。这将可行，因为静态数据项在加载时实例化，所以始终有一个（且只有一个）类实例。你可以将数据从\
  \ `frmAddFriend` 拷贝到静态类对象，让 `clsDB` 获取它。虽然这种方法可行，但这意味着即使你可能不需要它，总有一个对象的副本在附近消耗资源。此外，那种方法给人的感觉就是“杂乱”……就像用原子弹杀蚂蚁一样。\n\
  \n一种不那么“原子弹”的方法是将每个文本框的内容复制到字符串数组，并将该字符串数组传递给新的 `InsertFriend()` 方法。需要第二个并行数组来跟踪字符串变量代表的是字符串还是数值值。假设\
  \ `str` 存储数据而 `type` 存储数据类型，你在 `InsertFriend()` 方法中可能会有如下代码：\n\n\n\n\n\n```\npublic\
  \ string InsertData(string[] str, int[] type, string sqlCommand)\n{\n    int i;\n\
  \    for (i = 0; i < str.Length; i++)\n    {\n        switch (type[i])\n       \
  \ {\n            case 0:           // 数字型数据\n                sqlCommand += str[i]\
  \ + “,”;\n                break;\n            case 1:           // 字符串数据\n     \
  \           sqlCommand += “’” + str[i] + “',”;\n                break;\n       \
  \     default:\n                break;\n        }\n    }\n    i = sqlCommand.LastIndexOf(',');\
  \    // 去掉最后一个逗号\n    sqlCommand = sqlCommand.Substring(0, i) + “)”;\n    return\
  \ str;\n}\n```\n\n假设 `INSERT` 命令的第一部分已经构建，只需要将文本框的信息添加到 `sqlCommand` 字符串中。\n\n##\
