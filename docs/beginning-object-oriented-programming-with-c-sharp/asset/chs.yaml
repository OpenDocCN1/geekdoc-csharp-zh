  \ (in inches) - 108\nMale = 4.0 * height (in inches) - 128\n```\n编写一个程序，让用户输入起始和结束身高，计算男性女性的理想体重表格，并将结果存储在数组中。程序随后应在列表框或\
  \ `ListView` 对象中显示表格。\n\n2. 对象数组与值类型数组有何不同？\n\n3. 编写一个程序，在 `int` 数组中存储 100 个随机值，然后在列表框中显示这些值。设置一个\
  \ `Sort` 按钮，点击时对这些值进行排序并在列表框中重新显示。\n\n4. 修改你为练习 3 编写的程序，为数据显示条形图，如图图 8.13 所示。\n\n\
