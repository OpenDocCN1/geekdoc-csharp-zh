  \ Windows 程序使用 MDI 界面来为一组程序提供熟悉的视觉和感受。Microsoft Office 只是其中的例子。尝试为程序添加一些额外的菜单选项，例如一个显示朋友数据文件内容的表单。\n\
  \n*** 总结\n\n在本章中我们涵盖了大量内容。你应该能够熟练地以顺序访问或随机访问格式使用文本和二进制文件。你还知道如何将对象序列化和反序列化到磁盘。你学习了如何创建\
  \ MDI 程序和菜单系统。最后，你看到了在不同的程序中重用 Windows 表单对象是多么简单。事实上，你甚至没有做任何修改就重用了 `clsRandomAccess`\
  \ 类！但这正是面向对象编程（OOP）的精髓所在。\n\n# 练习\n\n**1.** 你可以如何修改示例 13-5 中的代码，使其不显示非活动记录？** **2.**\
  \ 查看表 13.5 中的信息，你是否可以在示例 13-6 中的`getRecordCount()` 方法中使用 `FileInfo` 类的任何属性或方法？**3.**\
  \ 如果你设计了一个必须持久化特定信息的程序，你将如何决定使用顺序访问还是随机访问文件？**4.** 你会使用哪种方法将对象的状态持久化到磁盘：序列化还是你自己设计的标准读写方法？**5.**\
  \ 许多程序使用“关于”框来传达有关软件的信息（版本号、公司名称等）。你将如何为你的程序添加“关于”框？\n\n\n\n\n从 Visual Studio 2008\
  \ 开始，C# 语言支持了一种名为 LINQ 的新语言特性，它为数据操作提供了一些有趣的功能。C# Express 版本仅直接支持在 Microsoft SQL\
  \ Server 数据库上使用 LINQ。（下一章将详细讨论 LINQ）。C# 专业版也支持其他商用 DBMS。\n\n## 数据库的结构\n\n关系数据库通常由两个或多个数据库表组成。\n\
  \n### 数据库表、字段和记录\n\n数据库 `table` 由按行和列排列的数据组成。数据库表中的每一行被称为 `record`。数据库表中的每一列被称为\
  \ `field`。数据库表可以有零或多行。如果表有零行，则该数据库表被认为是 `empty` 的，不包含任何有用信息。数据库表几乎总是包含两个或多个字段。\n\
  \n你可以将数据库字段想象成类的属性。每个字段都用于存储特定数据项的值。例如，在第 13 章中，你的电子电话簿程序拥有朋友的名字、中间名首字母、姓氏、地址、城市、州、邮政编码等属性。这些属性中的每一个都可以用于构建数据库表中的一个字段。因此，数据库表中的每一行将成为电话簿数据库中其中一个朋友的记录。同样应该明确的是，表中的每一行必须至少有一个与表中其他行不同的字段。如果不是这样，你会有两行完全相同的信息，那是冗余的。图\
  \ 14.1 总结了这些关系。\n\n图 14.1 数据库是如何构建的\n\n![image](img/c14f001.jpg)\n\n在图 14.1 中，显示你命名为\
  \ Cards 的数据库包含名为 Friends 和 CardsExchanged 的两个表。如果数据库是 SQL Server DBMS 数据库，它可能被命名为\
  \ `Cards.mdf`。如果你使用 Microsoft Access 创建相同的数据库，它将被命名为 `Cards.mdb`。（备文件名通常暗示了使用哪个\
  \ DBMS 创建了数据库。）你假设 Friends 表的构建用于存储类似于第 13 章中 `clsRandomAccess` 类的信息（列表 13-6）。正如你所期的，Friends\
  \ 表中的每个字段都可以被视为 `clsRandomAccess` 类中的一个属性。（为了保持讨论的简单，你在数据库示例中省略了一些属性。）你可能希望让 Friends\
  \ 数据表跟踪哪些朋友给你发过卡片，以及何时发送的。你可能还想跟踪他们的地址，以便你想给他们发送卡片。\n\n## 为数据库表设计字段\n\nCardsExchanged\
  \ 表可能是你添加到数据库中的一个表，用于跟踪你给哪些朋友发了生日卡片以及哪些朋友给你发了生日卡片。你考虑了需要存储在表中的信息，并为表设计了以下字段：\n\n\
  *   `firstName`: 朋友的名字\n*   `lastName`: 朋友的姓氏\n*   `dateSent`: 你给朋友发送生日卡片的日期\n*\
  \   `dateReceived`: 你收到朋友卡片的日期\n\n你向后坐下，欣赏了一会儿你的工作，然后你突然意识到：这是解决问题的一种 RDC 方法。你现在有两个表（Friends\
  \ 和 CardsExchanged），它们存储了相同的信息。也就是说，两个表都存储了所考虑朋友的名字和姓氏。这不好。\n\n### 数据规范化\n\n`Data\
  \ normalization`（数据规范化）是一个旨在从数据库中删除重复或冗余数据的过程。由于当前的设计在两个表中都存储了朋友的名字，因此数据库设计没有规范化。有一些规则定义了数据库规范化的顺序。当前的设计甚至没有遵循第一个规则（即删除冗余数据），因此当前的数据库设计甚至不是\
  \ `first normal form`（第一规范范式）。虽然这里没有空间详细讨论数据库规范化的规则，但大多数程序员如果能满足数据库设计的“第三规范范式”就会很乐意了。规范化程度越高，你必须花费更多时间在设计数据库上。（如果你发现自己关在监狱里有大量空时间，就在你的设计中追求第七规范范式吧。这能帮你打发时间！）\n\
  \n### 主键\n\n你需要重新设计数据库以消除重复数据。如果你能找到一种方法，将 CardsExchanged 表中的信息与 Friends 表关联起来并形成唯一的关系，你就可以做到这一点。最简单的方法是在\
  \ Friends 表中创建一个新字段，将其与表中的唯一朋友联系起来。\n\n表中持有唯一值的字段被称为 `primary key`（主键）字段。如果一个记录的某个字段中具有唯一值，你可以说表中的每个记录都因为主键字段而是唯一的。你可以在不同的表（例如\
  \ CardsExchanged 表）中使用此主键字段值来引用该表中的信息。\n\n\n\n\n最后一列决定了字段是否可以不填写数据。换句话说，就是该字段的值为\
  \ `null` 是否可以。请注意 `Addr2` 字段显示为 Yes（是），这意味着在没有提供二级地址的情况下，将此朋友存储在数据库表中是可以的。\n\n`nvarchar()`\
  \ 条目是字段中最常用的数据类型。括号中的数字表示字段中可以存储的最大字符数。SQL Server 还允许你使用 `varchar()` 数据类型。那么它们的区别是什么？你应该使用哪一个呢？显然，`nvarchar()`\
  \ 是更好的选择，因为 `nvarchar()` 以 Unicode 格式存储所有字符数据，可以容纳任何语言的所有字符集。`varchar()` 数据类型只能使用\
  \ ASCII 字符集，因此限制性大一些。这种灵活性的代价是，使用 `nvarchar()` 时，每个字符占用 2 字节存储，而 `varchar()` 仅占用\
  \ 1 字节。考虑到大量的磁盘空间成本仅需一分钱，在这种情况下你可以尽管使用。\n\n现在假设你在 4 月 30 日收到了 Jane 的一张卡片，并在 5 月\
  \ 5 日也寄给她一张同类型的卡片。假设 Jane 在 `Friends` 表中的唯一标识符是 1。（也就是说，她是表中的第一个人）。如果你在 `CardsExchanged`\
  \ 表中记录这些信息，记录可能类似于表 14.2 所示。\n\n表 14.2 CardsExchanged 数据示例\n\n![image](img/c14tnt002.jpg)\n\
  \n第一条记录详细说明你从 Jane 那里收到的卡片，而第二条记录显示了你寄给 Jane 的卡片类型以及发送时间。`CardsExchanged` 表中的 `ID`\
  \ 字段值告诉你 `Friends` 表中的哪位朋友与你交换了卡片。（Jane 的数据必须存储在 `Friends` 表的第 1 行。）也就是说，`CardsExchanged`\
  \ 表中的信息现在与 `Friends` 表中存储的朋友相关联，但你不再在两个表中都重复存储这些信息。这就是为什么此类数据库被称为*关系型数据库*：表之间通常存在对于数据库中存储的数据的关系。\n\
  \n多年来，你和 Jane 可能交换过很多次生日卡片。这在 `Friends` 和 `CardsExchanged` 表之间形成了一个*一对多的数据库*关系。也就是说，一个朋友（`Friends`\
  \ 表中的 Jane）向你寄送了许多卡片（记录在 `CardsExchanged` 表中）。可能存在许多种此类潜在的数据库关系（一对一、一对多、多对多等）。\n\
  \n## 增强功能\n\n虽然表格设计（参考表 14.1）满足了你的目标，但 `CardsExchanged` 表中的第二个字段 `TypeOfCard` 是干什么的呢？想一想。你在邮件中收到什么类型的卡片？仅仅是生日卡片吗？我不这么认为。由于朋友们可以交换各种类型的卡片，为什么要将此数据库限制在交换生日卡片上呢？如果你在数据库中添加第三张表来存储收到的卡片类型信息，你可以显著提高数据库的实用性。第三张表\
  \ `CardTypes` 只需要两个字段：1) 存储为 `int` 的卡片类型字段（不允许为 `null`），2) 包含该卡片类型描述的 `nvarchar(20)`\
  \ 字段（不允许为 `null`）。表 14.3 显示了 `CardTypes` 表填充数据后的样子。\n\n表 14.3 CardTypes 数据\n\n|\
  \ **CardType (卡片类型)** | **Description (描述)** |\n| :--- | :--- |\n| 1 | “父亲节” |\n\
  | 2 | “周年庆” |\n| 3 | “慰问” |\n| 4 | “生日” |\n| 5 | “母亲节” |\n| 6 | “圣诞节” |\n| 7 | “树节”\
  \ |\n| 8 | “火盆节” |\n| 9 | “Jack Purdum 的生日” |\n\n在表 14.2 中，`TypeOfCard` 字段显示这两条记录向与\
  \ `Friends` 表中记录 1 关联的朋友交换了类型 4 的卡片。如果 Jane 是 `Friends` 表中的第 1 条记录，那么你在 4 月 30 日从她那里收到一张类型\
  \ 4 的卡片，然后在 5 月 5 日寄给她一张类型 4 的卡片。查看 `CardTypes` 表，你可以看到表 14.2 中显示的类型 4 卡片关联于表 14.3\
  \ 中的生日卡片。\n\n通过通过化数据库设计并添加第三张表（CardTypes），你获得了什么？首先，在原始设计中，你假设只想跟踪生日卡片。通过在 `CardsExchanged`\
  \ 表中添加 `TypeOfCard` 字段并与 `CardTypes` 表关联，你增强了数据库的功能。其次，当前的设计允许你通过简单地向 `CardTypes`\
  \ 表添加另一个记录来扩展类型（参考表 14.3）。例如，你可以添加毕业、晋升或愚人节。`CardTypes` 表提供了根据特定需求定制数据库的活性。最后，通过在\
  \ `CardsExchanged` 表中添加两个日期字段，你可以跟踪是否回回了收到的卡片。\n\n一个合理的问题是，既然 SQL Server 提供了日期类型，为什么对日期使用\
  \ `nvarchar()` 数据类型？原因是存储在该字段中的数据很可能只是显示在屏幕或打印机上，这将需要转换为字符串。如果你想使用日期类型，尽管可以这样做。\n\
  \n`CardTypes` 表的主键字段将是 `CardType` 字段的值，它将与 `CardsExchanged` 表形成一种*多对一的关系*。（也就是说，CardsExchanged\
  \ 表可以有很多种卡片类型，但它必须关联 CardTypes 表中的一种卡片。）\n\n## 外键\n\n在图 14.2 中，字段 `ID` 充当 `Friends`\
  \ 表的主键，但它也被用于第二个表（`CardsExchanged`），将 `CardsExchanged` 表中的信息关联回 `Friends` 表中的朋友。因此，`CardsExchanged`\
  \ 表中的 `ID` 字段充当了*外键*，告诉这张卡片与谁关联。由此推断，在一个表中充当外键的字段必须与另一个表有建立的关系。`Friends` 和 `CardsExchanged`\
  \ 表之间的关系是一对多多的。这仅仅是一种极客的说法，表示一个朋友可以发送多张卡片。\n\n\n\n\n有很多不同类型的商业数据库可供选择。一些流行的包括微软的\
  \ SQL Server、IBM 的 DB2、MySQL（开源）、Oracle，以及可能还有其他几十种。你可以使用 `C#` 与其中任何一种数据库进行通信。然而，在本节中，你将使用微软的\
  \ SQL Server 数据库来演示如何将 `C#` 与商业数据库配合使用。这样做有几个原因。首先（也是最主要的），你不需要购买额外的软件就可以运行本章中的后续程序。如果你遵循了第\
  \ 1 章的说明，你应该已经安装了微软的 SQL Server。（这个版本不是 SQL Server 的完整版 DBMS，但 Express 版本可以满足除最苛刻之外的所有数据库需求。）其次，如果你需要，可以随时升级到\
  \ SQL Server 的完整版，而且为 Express 版编写的软件仍然有效。\n\n虽然你可以使用 `C#` 和 SQL 来创建和管理数据库，但与其重复造，不如使用\
  \ SQL Server Management Studio（SQL Server 管理工具）会更有意义。该工具让你在这些数据库中创建新的数据库和表变得轻而易举。\n\
  \n## 使用 SQL Server Management Studio\n\n启动微软的 SQL Server Management Studio (SSMS)。文件的具体位置取决于你安装\
