  \n好了，现在你知道如何格式化参数了，但是——参数*在哪里*呢？在带引号格式化字符串（`\"{0, 5}{1, 20}\"`）结束的双引号之后，是一个逗号，后面跟着一个参数列表。选项字符串表示有两个参数。选项字符串之后是两个参数：`i`\
  \ 和 `i * i`。因此，第一个参数是变量 `i` 的值，第二个参数是 `i * i` 的值，或 `i` 的平方。这两部分数据随后由 `Format()`\
  \ 方法进行格式化，并放置在字符串变量 `buff` 中。\n\n额外的 `Format()` 方法选项显示在表 7.1 中。你可以使用 Visual Studio\
