  \n# 目录\n\n当我想探索 C# 的新领域时，我第一件事就是找出涉及哪些命名空间。因为你将学习文件输入和输出 (I/O)，我只是在程序顶部输入了 `System.`\
  \ 并开始寻找可能应用的命名空间。\n\n果真弹出了 `System.IO`。只需突出 `IO` 并按 F1 键，你就会获得关于 `IO` 命名空间的信息。各种有趣的事情都出现了，但请先关注处理目录和驱动器信息的类。\n\
  \n## DriveInfo 类\n\n正如 Ed McMahon 在 Johnny Carson Show 中说的那样，“你对磁盘驱动器想知道的一切……，都在\
  \ `DriveInfo` 类中。”一些更有用的方法和属性在表 13.1 中给出。\n\n**表 13.1** DriveInfo 类\n\n| 方法或属性 |\
  \ 描述 |\n| :--- | :--- |\n| `GetDrives()` | 返回计算机逻辑驱动器的数组 |\n| `AvailableFreeSpace`\
  \ | 驱动器上的可用磁盘空间（字节） |\n| `DriveFormat` | 返回驱动器格式（如 NTFS 或 FAT32） |\n| `DriveType`\
  \ | 返回驱动器类型（如固定、可移动、RAM 等） |\n| `Name` | 给出驱动器的名称 |\n| `TotalFreeSpace` | 驱动器上的未使用空间总量\
  \ |\n| `TotalSize` | 给出驱动器的容量 |\n\n\n\n\n\n如果你查看 `IO` 命名空间，还会发现其中有名为 `Directory`\
  \ 和 `DirectoryInfo` 的类。这两个类提供了相关但**不相同**的信息。\n\n## Directory 类\n\n`Table 13.2` 列出了\
  \ `Directory` 类中包含的方法的部分列表。（你可以随时使用该类的在线帮助来获取更完整的信息。）\n\n### `Table 13.2` `Directory`\
  \ 类\n\n| 方法 | 描述 |\n| :--- | :--- |\n| `CreateDirectory()` | 为指定的路径名创建目录 |\n| `Delete()`\
  \ | 删除指定的目录 |\n| `Exists()` | 确定指定的目录是否存在 |\n| `GetCreationTime()` | 返回包含目录创建时间的\
  \ `DateTime` 类型 |\n| `GetCurrentDirectory()` | 获取应用程序的当前工作目录 |\n| `GetFiles()` |\
  \ 返回指定目录中的文件名 |\n| `GetLastAccessTime()` | 返回目录最后访问的日期和时间 |\n| `GetLastWriteTime()`\
  \ | 返回目录最后写入的数据和时间 |\n| `GetParent()` | 返回给定路径名的父目录 |\n| `Move()` | 将文件或目录移动到新位置\
  \ |\n| `SetCreationTime()` | 设置文件或目录的创建时间 |\n| `SetLastWriteTime()` | 设置文件或目录最后写入的日期和时间\
  \ |\n\n## DirectoryInfo 类\n\n最后，`Table 13.3` 出了 `DirectoryInfo` 类的方法和属性。`DirectoryInfo`\
  \ 类实现了 `FileSystemInfo` 接口。这意味着你还应该检查 `FileSystemInfo` 接口，以查看该接口所需的属性和方法。\n\n###\
  \ `Table 13.3` `DirectoryInfo` 类\n\n| 方法或属性 | 描述 |\n| :--- | :--- |\n| `Create()`\
  \ | 创建目录。 |\n| `CreateSubdirectory()` | 创建子目录。 |\n| `Delete()` | 删除指定的目录。 |\n| `Equals()`\
