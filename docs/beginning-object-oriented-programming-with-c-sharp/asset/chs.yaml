  \ 15 章\n\n# 使用 LINQ\n\n**你将在本章学习：**\n\n* 什么是 LINQ\n* 如何使用 LINQ 查询数据对象\n* `var` 关键字的含义\n\
  * 所需的 LINQ 命名空间\n* 使用 LINQ 查询数据对象的优势\n\n[wrox.com](http://wrox.com) 本章代码下载\n\n你可以在本书的\
  \ [wrox.com](http://wrox.com) 网页上的“Download Code”选项卡处找到 [www.wrox.com/remtitle.cgi?isbn=9781118336922](http://www.wrox.com/remtitle.cgi?isbn=9781118336922)\
  \ 下载本章代码。`Chapter15` 文件夹中的代码根据章节中的名称进行了单独命名。\n\nSQL 使用起来如此简单；如果能将其简单性应用于数据库以外的数据结构，不是很好吗？这正是微软\
  \ LINQ 的设计初衷。LINQ 代表 *Language INtegrated Query*（集成查询语言），是 Visual Studio 2008 发布时的一项功能。\n\
  \n# 使用 LINQ\n\n尽管你可以对关系数据库对象使用 SQL，但 LINQ 也可以查询数据源不是数据库的对象类型。除了关系数据库外，你还可以使用 LINQ\
  \ 查询包括数组、类对象和 XML 在内的对象类型。Visual Studio 直接整合了 LINQ 查询引擎，但也定义了扩展定义，允许第三方数据源通过翻译器连接到引擎。就像\
  \ SQL 查询产生存储在内存中的数据集一样，LINQ 返回的是一组基于内存的对象。\n\n## 查询关键字\n\nSQL 在查询语句中有特定的关键字，LINQ\
  \ 提供了 set 类似的关键字。开始理解 LINQ 最简单的方法可能是尝试以下简单示例 16471c15.xhtml_c15-fig-0001。\n\n***\n\
  \n**尝试一下：一个 LINQ 程序示例 (Chapter15ProgramLINQTest.zip)**\n在此示例中，程序生成 `MAXNUM`（例如 100）个随机数并在列表框对象中显示它们。然后程序使用\
  \ LINQ 查询该数据列表，查找落在指定范围内的值。图 15.1 显示了程序的运行示例。\n\n1. 以常规方式创建一个新项目。\n2. 在本书的 [wrox.com](http://wrox.com)\
  \ 网页上下载 `Chapter15ProgramLINQTest.zip` 文件中的代码。\n3. 以 图 15.1 为模型，创建一个包含两个列表框、五个标签、两个文本框和按钮对象的用户界面。\n\
  \n**图 15.1** 运行示例\n\n![image](img/c15f001.jpg)\n用户为从左侧列表框显示的随机值列表中提取的值输入上限和下限（不包含）边界。指定范围由两个文本框对象中的指定值设置。查询结果显示在图\
  \ 15.1](#9781118416471c15.xhtml_c15-fig-0001) 中的右侧列表框对象中。\n\n***工作原理***\n程序的代码显示在\
  \ 列表 15-1。\n\n列表 15-1: 使用 LINQ 的程序 (frmMain.cs)\n\n\n\n\n\n```cs\nusing System;\n\
  using System.Collections.Generic;\nusing System.Linq;\nusing System.Windows.Forms;\n\
  \npublic class frmMain : Form\n{\n    private const int MAXNUM = 100;          \
  \   // 最大随机数数量\n    static List<int> numbers = new List<int>(); //静态列表\n\n    private\
  \ Button btnClose;\n    private ListBox lstOutput;\n    private ListBox lstFull;\n\
  \    private TextBox txtLow;\n    private Label label1;\n    private Label label2;\n\
  \    private TextBox txtHi;\n    private Label label3;\n    private Label label4;\n\
  \    private Label label5;\n    private Button btnCalc;\n\n    #region Windows 代码\n\
  \n    //========================== 构造函数 ============================\n    public\
  \ frmMain()\n    {\n        InitializeComponent();\n        GenerateRandomValues();\n\
  \    }\n\n    //=========================== 程序入口 =========================\n   \
  \ public static void Main()\n    {\n        frmMain main = new frmMain();\n    \
  \    Application.Run(main);\n    }\n\n    //========================= 辅助方法 ===========================\n\
  \    private void btnCalc_Click(object sender, EventArgs e)\n    {\n        int\
  \ lo;\n        int hi;\n\n        lstOutput.Items.Clear();\n\n        SetTheLimits(out\
  \ lo, out hi);\n        DoLINQQuery(lo, hi);\n    }\n\n    /**\n     * Purpose:\
  \ 生成包含 MAXNUM 数量的随机整数序列\n     *\n     * 参数列表:\n     *  int lo          查询的下限\n \
  \    *  int hi          查询的上限\n     *\n     * 返回值:\n     *  void\n     *\n     ****/\n\
  \    private void DoLINQQuery(int lo, int hi)\n    {\n        var query = from p\
  \ in numbers               // “查询”\n                    where p > lo && p < hi\n\
  \                    select p;\n        foreach (var val in query)             \
  \     // 显示结果\n        {\n            lstOutput.Items.Add(val.ToString());\n   \
  \     }\n\n    }\n\n    /****\n     * Purpose: 设置查询的上限和下限\n     *\n     * 参数列表:\n\
  \     *  out int lo          下限的引用\n     *  out int hi          上限的引用\n     *\n\
  \     * 返回值:\n     *  void\n     *\n     ******/\n    private void SetTheLimits(out\
  \ int lo, out int hi)\n    {\n        bool flag = int.TryParse(txtLow.Text, out\
  \ lo);   // 输入验证\n        if (flag == false)\n        {\n            MessageBox.Show(\"\
  只能输入数字，0 到 100\", \"输入错误\");\n            txtLow.Focus();\n        }\n        flag\
  \ = int.TryParse(txtHi.Text, out hi);\n        if (flag == false)\n        {\n \
  \           MessageBox.Show(\"只能输入数字，0 到 100\", \"输入错误\");\n            txtHi.Focus();\n\
  \        }\n    }\n\n    /****\n     * Purpose: 生成包含 MAXNUM 数量的随机整数序列\n     *\n\
  \     * 参数列表:\n     *  void\n     *\n     * 返回值:\n     *  void\n     *\n     *****/\n\
  \    private void GenerateRandomValues()\n    {\n        int temp;\n        DateTime\
  \ current = DateTime.Now;\n        Random rnd = new Random((int)current.Ticks);\n\
  \n        for (int i = 0; i < MAXNUM; i++)            // 随机值\n        {\n      \
  \      temp = rnd.Next(MAXNUM);\n            numbers.Add(temp);                \
  \      //拷贝到列表\n            lstFull.Items.Add(temp.ToString());\n        }\n   \
  \ }\n\n    private void btnClose_Click(object sender, EventArgs e)\n    {\n    \
  \    Close();\n    }\n\n}\n```\n\n## LINQ 的命名空间和引用\n\n在此示例中，你使用了一个泛型 `List` 对象，因此你需要在程序中包含\
  \ `collections-generic` 命名空间。示例程序中所需的 `using` 语句如下：\n\n```\nusing System;\nusing\
  \ System.Collections.Generic;\nusing System.Linq;\nusing System.Windows.Forms;\n\
  ```\n\n为了使适当引用可用，你需要向标准列表添加几个新引用。你的引用列表应该包含这些：\n\n```\nSystem\nSystem.Core\nSystem.Data\n\
  System.Data.DataSetExtensions\nSystem.Data.Linq\nSystem.Drawing\nSystem.Windows.Forms\n\
  ```\n\n新引用提供了使用 LINQ 所需的库。（这些引用没有出现在代码列表中，但它们位于项目的引用部分。）`btnCalc_Click()` 事件代码执行了所有工作。你首先开始验证由名为\
  \ `rnd` 的 `Random` 类对象生成的随机数范围的上限和下限。记住，语句，\n\n```\nList<int> numbers = new List<int>();\n\
  ```\n\n它定义了一个可以存储 `int` 数据列表的对象（`numbers`）。第一个 `for` 循环简单地定义了一个 0 到 `MAXNUM` 之间的随机数，并将其设置为\
  \ `numbers` List 对象，同时将该值拷贝到 `lstFull` 列表框对象。`MAXNUM` 发挥双重作用，既控制随机数的上限，又控制生成的随机值数量。这属于\
  \ SDC（有点笨的代码），因为让一个符号常量兼顾两个用途通常不是好主意。如果这让你感到困，可以添加一个你自己选择的新常量。\n\n## var 关键字\n\n\
  以下语句说明了 LINQ 查询的语法。查询语句定义了一个名为 `query` 的变量，其类型为 `var`：\n\n```\nvar query = from\
  \ p in numbers               // “查询”\n            where p > lo && p < hi\n     \
  \       select p;\n```\n\n由于 `numbers` 被泛型定义为 `int` 类型数据的列表，`query` 假设类型为 `int`。该语句的作用类似于\
  \ SQL 中的 `FROM-WHERE` 子句，检查 `numbers` 数据集并提取落在 `lo` 和 `hi` 之间（不包含边界）的值。想象落在指定范围内的值变成了一个名为\
  \ `p` 的临时数据集，然后被赋值给 `query`。该语句，\n\n```\nforeach (var val in query)            \
  \      // 显示结果\n    lstOutput.Items.Add(val.ToString());\n```\n\n\n\n\n定义了一个名为 `val`\
  \ 的第二个变量类型，由于其定义的初始化上下文，它假定与查询包含相同的数据类型。`foreach` 循环简单地遍历查询集合，并将 `query` 中的值添加到\
  \ `lstOutput` 列表框对象中。虽然 LINQ 没有为你提供任何即使不使用它也能自己编写的功能，但 LINQ 确实让这一切变得更加简单。额外的好处是它的语法模仿\
  \ SQL，如果你已经熟悉 SQL，使用起来会更方便。在接下来的“尝试一下”中，你将重写程序以使用 LINQ 和字符串数据而不是整数数据。基础部分大相同，如你在列表\
  \ 15-2 中所示。\n\n# 尝试一下：另一个使用字符串数据的 LINQ 示例 (Chapter15ProgramLINQExample02.zip)\n\n\
  现在尝试另一个 LINQ 示例。在这个示例中，假设数据是姓名，后面跟着该人员所在的州。用户从左侧列表框对象显示的项中输入她想要检查的州缩写，然后点击“计算”按钮。右侧列表框对象将显示与所选州缩写匹配的项目。图\
  \ 15.2 显示了程序的示例运行。\n\n图 15.2 使用字符串数据的 LINQ 示例运行\n\n![image](img/c15f002.jpg)\n\n\
  以下步骤详细说明了如何设置示例项目。\n**1.** 按通常方式创建一个新项目。\n**2.** 从文件 `Chapter15ProgramLINQExample02.zip`\
  \ 下载项目源代码。\n**3.** 创建一个与图 15.2 所示相似的用户界面。\n\n## 工作原理\n\n程序的代码在列表 15-2 中显示。代码与列表\
  \ 15-10 中的代码相似，因此我将注释限制在不同的不同的部分。首先，注意我在列表顶部定义了两个静态变量（`passes` 和 `count`）。我使用静态修符是因为我希望这些变量在程序加载的瞬间就可用。在\
  \ `frmMain()` 构造函数在内存中构建表单图像并初始化其数据后，左侧列表框对象通过调用 `ShowAll()` 进行填充。\n\n列表 15-2: 使用字符串数据使用\
  \ LINQ (frmMain.cs)\n\n```csharp\nusing System;\nusing System.Linq;\nusing System.Windows.Forms;\n\
  \npublic class frmMain : Form\n{\n    static int passes = 0;\n    static int count;\n\
  \n    private Button btnClose;\n    private ListBox lstOutput;\n    private ListBox\
  \ lstFull;\n    private Label label1;\n    private TextBox txtState;\n    private\
  \ Button btnCalc;\n\n    #region Windows code\n\n    public frmMain()\n    {\n \
  \       InitializeComponent();\n        ShowAll();\n    }\n\n    public static void\
  \ Main()\n    {\n        frmMain main = new frmMain();\n        Application.Run(main);\n\
  \    }\n\n    private void btnCalc_Click(object sender, EventArgs e)\n    {\n  \
  \      ShowAll();\n    }\n\n    private void ShowAll()\n    {\n        int i;\n\
  \        var friends = new[] {\n            new {name = \"Tom\", state = \"IN\"\
  },\n            new {name = \"Terry\", state = \"MT\"},\n            new {name =\
  \ \"Tammy\", state = \"IN\"},\n            new {name = \"Jane\", state = \"OH\"\
  },\n            new {name = \"Don\", state = \"IN\"},\n            new {name = \"\
  John\", state = \"IN\"},\n            new {name = \"Linda\", state = \"FL\"},\n\
  \        };\n\n        if (passes == 0)\n        {\n            count = friends.GetUpperBound(0);\n\
  \            i = 0;\n            for (i = 0; i <= count; i++)\n            {\n \
  \               lstFull.Items.Add(friends[i].name + \"  \" + friends[i].state);\n\
  \            }\n            passes++;\n        }\n        else\n        {\n    \
  \        lstOutput.Items.Clear();\n\n            var query = from p in friends \
  \              // “查询”\n                        where p.state == txtState.Text.ToUpper()\n\
  \                        select p;\n\n            foreach (var val in query)   \
  \               // 显示结果\n                lstOutput.Items.Add(val.name + \"  \" +\
  \ val.state);\n        }\n    }\n\n    private void btnClose_Click(object sender,\
  \ EventArgs e)\n    {\n        Close();\n    }\n}\n```\n\n`ShowAll()` 方法使用 `var`\
  \ 类型构建了一个测试数据集并将其命名为 `friends`。（如果能将 `friends` 定义为具有类作用域的静态数据就很好，但 `var` 类型只能假设局部作用域，记得吗？）如果\
  \ `passes` 为 0，调用来自构造函数，所以代码将 `friends` 数据移动到左侧列表框对象（`lstFull`）并增加 `passes`。当在点击事件后再次调用\
  \ `ShowAll()` 时，由于 `passes` 不再为 0，跳过了填充 `lstFull`。在这种情况下，执行 `else` 语句。右侧列表框对象（`lstOutput`）清空并处理。下面的查询语句使用\
  \ LINQ `where` 谓词将查询结果限制为用户选择的州：\n\n```csharp\nvar query = from p in friends   \
  \  // “查询”\n            where p.state == txtState.Text.ToUpper()\n            select\
  \ p;\n\nforeach (var val in query)        // 显示结果\n    lstOutput.Items.Add(val.name\
  \ + val.state);\n```\n\n`foreach` 语句随后遍历查询的结果（存储在 `query` 中），并将相关信息显示在右侧列表框（`lstOutput`）中。，测试数据集可以是更复杂的对象。例如，你可以扩展集合为类似\n\
  \n```csharp\nvar friends = new[] {\n    new {name = \"Tom\", state = \"IN\", age\
  \ = 25},\n    new {name = \"Terry\", state = \"MT\", age = 30},\n    new {name =\
  \ \"Tammy\", state = \"IN\", age = 22},\n    new {name = \"Jane\", state = \"OH\"\
  , age = 28},\n    new {name = \"Don\", state = \"IN\", age = 40},\n    new {name\
  \ = \"John\", state = \"IN\", age = 35},\n    new {name = \"Linda\", state = \"\
  FL\", age = 29},\n};\n```\n\n并将查询更改为\n\n```csharp\nvar query = from p in friends\
  \     // “查询”\n            where p.age < age\n            select p;\n```\n\n再次，任何你可以用\
  \ LINQ 完成的任务，选择代码更少的路径几乎总是更好的选择。其他类似 SQL 的关键字和运算符在 LINQ 中也可用。虽然由于对 SQL 查看有限，我不准备讨论所有它们，但表\
  \ 15.1 为你提供了一些重要的关键字和运算符的列表。\n\n\n\n\n\n| `union`, `intersect`, `except` | 用于对两个序列执行专门的操作。\
  \ |\n| `equalall` | 检查两个集合中的所有元素是否相等。 |\n| `first`, `firstordefault`, `last`, `lastordefault`\
  \ | 使用谓词返回第一个使谓词逻辑为 True 的元素。如果在集合中未找到匹配项，则会抛出异常。`firstordefault` 类似于 `first`，但在未找到匹配项时会返回集合中的第一个项（即不抛出异常）。`last`\
  \ 的工作方式类似，但它会在集合中寻找最后一个匹配项。 |\n| `single` | 使用谓词查找匹配项，但如果没有找到，则会抛出异常。 |\n| `elementat`\
  \ | 返回集合中指定索引处的元素。 |\n| `any`, `all`, `contains` | 使用谓词检查是否存在匹配项（返回逻辑 True 或 False）、是否所有项都匹配，或者集合是否包含匹配项（返回逻辑\
  \ True 或 False）。 |\n| `count`, `sum`, `min`, `max`, `average`, `aggregate` | 类似于\
  \ SQL 中的聚合函数。 |\n\n表 15.1 并不是详尽的，但它可以帮助你入门。（需要更多信息，可以在此处找到一个简短的总结：[`www.ezineasp.net/post/List-of-LINQ-Query-Keywords.aspx`](http://www.ezineasp.net/post/List-of-LINQ-Query-Keywords.aspx)。）如果你想查看使用\
  \ LINQ 的示例代码，请查看 [`code.msdn.microsoft.com/101-LINQ-Samples-3fb9811b`](http://code.msdn.microsoft.com/101-LINQ-Samples-3fb9811b)。LINQ\
  \ 是 C# 的一个重要扩展，可以使某些编程任务的开发变得容易得多。你可以尝试尝试表 15.1](#9781118416471c15.xhtml_c15-tbl-0001)\
  \ 中的一些操作符，并以列表 15-1](#9781118416471c15.xhtml_c15-pgml-0001) 中的代码作为起点。\n\n# 总结\n\n\
