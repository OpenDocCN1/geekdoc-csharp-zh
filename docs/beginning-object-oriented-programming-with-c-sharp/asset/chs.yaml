  \n* * *\n\n# 布尔型数据类型\n\n在数值和文本这两种基本数据类型中，到目前你只学习了数值数据类型。（你可以在第 6 章中读到更多关于文本数据类型的内容。）布尔型数据类型是那些既不完全符合数值数据类型也不符合文本数据类型的灰色地带之一。虽然它并不完全匹配，但你与数值数据类型一起学习了\
  \ `bool` 数据类型，因为它被用于反映一段数据的状态，而不是该数据的某种文本表示。\n\n计算机的一个基本特征是它可以根据其处理的数据做出决策。你已经在示例程序中看到了这种决策能力。例如，在你之前编写的整数除法程序中，你有以下程序语句：\n\
