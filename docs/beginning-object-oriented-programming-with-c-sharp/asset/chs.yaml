  \ 15 章\n\n## 练习 1 答案\n\n要将 SQL 查询修改为使用 LINQ，请将代码更改如下如下：\n\n```\nprivate void DoQuery()\n\
  {\n    string buff;\n    try\n    {\n        ds = new DataSet();     // 实例化 DataSet\
  \ 对象\n        conn.Open();\n        command.CommandText = txtQuery.Text;\n     \
