  \        // 从这里开始新内容...\n        DataTable buddies = ds.Tables[0];\n        IEnumerable<DataRow>\
  \ query =\n            from buddy in buddies.AsEnumerable()\n            select\
  \ buddy;\n                                                // 输出...\n        foreach\
  \ (DataRow myRow in query)\n        {\n            buff = myRow.Field<string>(”LastName”)\
  \ + “ “ + \n                   myRow.Field<string>(”Zip”);\n        }\n    }\n \
