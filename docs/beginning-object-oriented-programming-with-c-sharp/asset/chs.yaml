  ## 载载方法\n\n在本章稍早之前，你读到构造函数用于在在使用对象之前需要执行的任何初始化任务。通常，“执行初始化任务”意味着将对象属性的状态设置为某些非默认值。当你创建\
  \ `myTime` 对象时，你没有为构造函数使用任何参数。这是因为你对 `DateTime` 属性的默认值（即 0 或 null）感到满意。图 5.12 使用相同的点运算符技术来获取\
  \ `DateTime` 对象可用的属性和方法列表。\n\n图 5.12 DateTime 对象属性和方法\n\n![image](img/c05f012.jpg)\n\
  \n正如你在列表框所示，其中一个属性名为 `Day`。显然，当 `myTime` 实例化时，你对为 `Day` 赋值 0 是满意的。如果你滚动查看图 5.12\
  \ 所示的列表框，你会发现还有 `Month` 和 `Year` 属性。这些属性也为 `myTime` 对象初始化为默认值 0。如果你不初始化 `DateTime`\
  \ 对象的任何属性，它将显示 0001 年 1 月 1 日星期一凌晨 12:00 的日期和时间，这是刻度（ticks）为零时的起始日期！\n\n假设你回退并输入语句\n\
  \n```c\n DateTime newYears = new DateTime(\n```\n\n以观察你在屏幕上看到的内容。你应该看到类似于图 5.13\
  \ 的内容。\n\n图 5.13 DateTime 方法\n\n![image](img/c05f013.jpg)\n\n你的屏幕上实际上显示了一个小框，写着\
  \ 1 of 12 `DateTime.DateTime()`，并在消息的 1 of 12 部分周围环有上下箭头。IntelliSense 告诉你有 12 种“变体”\
  \ `DateTime()` 构造函数方法可供选择。图 5-13 显示你想使用第四种将年、月、日传递给构造函数的变体。它还告诉你这些参数每一个应该是整数值。在你的代码中，你使用了带有三个整数参数的构造函数：\n\
  \n```c\n DateTime newYears = new DateTime(myTime.Year, 12, 31);\n```\n\n\n\n第一条语句导致\
  \ Visual Studio 调用没有传递参数的构造函数。第三条语句导致 Visual Studio 调用期望三个整数变量的构造函数。这引出了一个关于重载方法的重要规则：`Methods`\
  \ 只要没有两个重载方法具有相同的签名，就可以进行重载。这意味着只能有一个重载方法可以传递零参数。同样，只能有一个重载方法可以传递三个整数。一个重载方法可以传递另外三个变量，但这三个变量不能全是整数。例如，你可以拥有一个名为\
  \ `countThis()` 的重载方法，其具有以下签名：\n\n```cpp\npublic int countThis(int val);\npublic\
  \ int countThis(long val);\n```\n\n这些是完全可以的，因为它们的签名是不同的。诚然，这两种形式都接受一个参数，但该参数的数据类型是不同的；因此，签名是不同的。如果你浏览\
  \ `DateTime` 类型的 12 个构造函数，你会发现这 12 个构造函数传递的参数都是不同的。\n\n当你需要编写在接收到不同信息时表现出不同行为的方法时，重载方法是非常有用的。你将在随后的章节中看到重载方法的其他示例。\n\
