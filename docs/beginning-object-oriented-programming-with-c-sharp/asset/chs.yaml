  \ e)\n    {\n        Close();\n    }\n\n    private void btnClear_Click(object sender,\
  \ EventArgs e)\n    {\n        lstDeck.Clear();\n    }\n}\n```\n\n和往常一样，所有的操作都在\
  \ `btnShuffle_Click` 方法中。代码定义了一个 `clsCardDeck` 对象，然后调用 `ShuffleDeck()` 方法来洗牌。变量\
  \ `passes` 被赋值为洗牌次数。这些信息显示在 `lblPassCounter` 对象中。\n\n语句 `deckSize = myDeck.DeckSize;`\
  \ 使用 `DeckSize` 属性方法确定牌中有多少张牌。属性方法的返回值用于控制负责显示牌的 for 循环。\n\n嵌套的 for 循环实际上显示了牌：\n\
  \n```\n for (cardIndex = 1; cardIndex < deckSize + 1; )\n        {\n           \
  \ buff = \"\";\n            for (j = 0; j < 13; j++)    // 每行 13 张牌\n          \
  \  {\n                temp = myDeck.getCardPip(cardIndex);\n                if (temp.Length\
  \ == 0)\n                {\n                    MessageBox.Show(\"Error reading\
  \ deck.\", \"Processing Error\");\n                    return;\n               \
  \ }\n                buff += temp + \" \";\n                cardIndex++;\n     \
  \       }\n            lstDeck.Items.Add(buff);\n        }\n```\n\n外层 for 循环由名为\
  \ `cardIndex` 的变量控制。注意它在 for 循环的第一个表达式中被初始化为 1。for 循环的第二个表达式仅仅暗示显示牌组中的所有的牌。for 循环的第三个表达式……不存在！什么？\n\
  \n\n\n虽然你可以省略内部的 for 循环，但你选择在 listbox 对象以每行 13 张牌的格式显示卡牌。因此，代码在内层 `j` 循环中简单的调用了\
  \ 13 次 `getOneCard()` 方法，将每张牌的点数表示连接到名为 `buff` 的字符串变量上。但注意，代码在每次遍历内层 `j` 循环时都需要递增\
  \ `cardIndex` 以获取下一张牌。由于 `cardIndex` 的递增必须在内层 `j` 循环中完成，因此通常位于外层 for 循环第三表达式中的递增操作被省略了。\n\
  \n当内层 `j` 循环从牌组中读取 13 张牌后，`buff` 包含这 13 张牌的字符串表示。外层循环的最后一条使用 `Add()` 方法将该行卡牌添加到\
  \ listbox 对象中。使用标准牌组，将显示四行，程序运行完成。\n\n### clsCardDeck 代码\n\n`clsCardDeck` 的代码所示\
  \ Listing 10-6。\n\nListing 10-6: `clsCardDeck` 的源代码 (`clsCardDeck.cs`)\n\n```\n\
  \ using System;\n\nclass clsCardDeck\n{\n    // =============== 符号常量 ==================\n\
  \    private const int DECKSIZE = 52;  // 牌组中的牌数\n    // =============== 静态成员 ======================\n\
  \    private static string[] pips = {\"\",\n \"AS\",\"2S\",\"3S\",\"4S\",\"5S\"\
  ,\"6s\",\"7S\",\"8S\",\"9S\",\"TS\",\"JS\",\"QS\",\"KS\",\n \"AH\",\"2H\",\"3H\"\
  ,\"4H\",\"5H\",\"6H\",\"7H\",\"8H\",\"9H\",\"TH\",\"JH\",\"QH\",\"KH\",\n \"AD\"\
  ,\"2D\",\"3D\",\"4D\",\"5D\",\"6D\",\"7D\",\"8D\",\"9D\",\"TD\",\"JD\",\"QD\",\"\
  KD\",\n \"AC\",\"2C\",\"3C\",\"4C\",\"5C\",\"6C\",\"7C\",\"8C\",\"9C\",\"TC\",\"\
  JC\",\"QC\",\"KC\"\n                                   };\n\n    // ===============\
  \ 实例成员 =====================\n    private int nextCard;       // 从牌组中分发的下一张牌\n \
  \   private int[] deck = new int[DECKSIZE + 1];   // 牌组。\n    private int passCount;\
  \      // 用于计算洗牌时循环遍历的次数\n\n    // =============== 构造函数 ======================\n\
  \    public clsCardDeck()\n    {\n        nextCard = 1;\n    }\n\n    // ===============\
  \ 属性方法 =====================\n    public int DeckSize\n    {\n        get\n    \
  \    {\n            return DECKSIZE;  // 牌组中有多少张牌\n        }\n        // 因为是只读属性，所以没有\
  \ setter 方法\n    }\n\n    public int NextCard\n    {\n        get\n        {\n \
  \           return nextCard;\n        }\n        set\n        {\n            if\
  \ (value > 0 && value <= deck.Length)\n            {\n                nextCard =\
  \ value;\n            }\n        }\n    }\n\n    public int PassCount\n    {\n \
  \       get\n        {\n            return passCount;\n        }\n    }\n    //\
  \ =============== 辅助方法 =======================\n\n    // =============== 普通方法 ======================\n\
  \    /**\n    * 目的：洗牌\n    *\n    * 参数列表:\n    *      N/A\n    * 返回值:\n    *   \
  \   int     洗牌的循环遍历次数\n    */\n    public int ShuffleDeck()\n    {\n        int\
  \ index;\n        int val;\n        Random rnd = new Random();\n\n        passCount\
  \ = 0; // 计算 while 循环执行了多少次\n        index = 1;\n        Array.Clear(deck, 0, deck.Length);\
  \  // 初始化数组为 0\n\n        while (index < deck.Length)\n        {   // 为从 0 开始的数组偏移\
  \ 1\n            val = rnd.Next(DECKSIZE) + 1;   // 生成 1 到 52 的值\n            if\
  \ (deck[val] == 0)\n            {           // 这张牌在牌组中的位置是“未使用”的吗？\n           \
  \     deck[val] = index;      // 是的，所以分配一个牌位\n                index++;         \
  \       // 准备处理下一张牌\n            }\n            passCount++;\n        }\n      \
  \  nextCard = 1;                   // 准备发出第一张牌\n        return passCount;\n    }\n\
  \n    /**\n    * 目的：显示牌组中的某张牌。\n    *\n    * 参数列表:\n    *      int         找到卡牌的位置索引\n\
  \    * 返回值:\n    *      string      卡牌的点数，错误时返回空字符串\n    */\n    public string getOneCard(int\
  \ index)\n    {\n        if (index > 0 && index <= deck.Length && nextCard <= deck.Length)\n\
  \        {\n            nextCard++;\n            return pips[deck[index]];\n   \
  \     }\n        else\n        {\n            return \"\";      // 错误\n        }\n\
  \    }\n\n    /**\n    * 目的：显示牌组中某张牌使用的缩写。\n    *\n    * 参数列表:\n    *      index\
  \       牌组中索引位置整数\n    *\n    * 返回值:\n    *      string      卡牌的点数，错误时返回空字符串\n \
  \   */\n    public string getOneCard(int index)\n    {\n        if (index > 0 &&\
  \ index <= deck.Length && nextCard <= deck.Length)\n        {\n            nextCard++;\n\
  \            return pips[deck[index]];\n        }\n        else\n        {\n   \
  \         return \"\";      // 错误\n        }\n    }\n}\n```\n\n\n\n使用 Visual Studio\
  \ 的 `Random` 类定义了一个名为 `rnd` 的对象。在 `while` 循环中使用 `Random` 类的 `Next()` 方法，语法如下：\n\n\
  ```\nval = rnd.Next(DECKSIZE) + 1;   // 生成 1 到 52 的值\n```\n\n`Next()` 方法设计用于生成一系列落在\
  \ 0 到 `DECKSIZE` 之间的伪随机数。假设 `DECKSIZE` 为 52，这意味着 `Next()` 产生的随机数落在 0 到 52 之间。`Next()`\
  \ 生成的值集跨越了从 0 到——*不包含* 52 的范围。然而，由于你定义 `pips` 数组的方式，你需要范围范围从 1 到 53（包含 53）。如果你在\
  \ `Next()` 方法生成的每个随机数上加 1，就可以生成该范围的数值。在前面的语句中，`val` 具有存储 1 到 53 值的潜力……这正是你所需要的。\n\
  \n在第 8 章中，你学习了语句\n\n```\nArray.Clear(deck, 0, deck.Length);  // 将数组初始化为 0\n```\n\
  \n使用 `Array` 类的 `Clear()` 方法将 `deck` 数组中的所有元素初始化为 0。现在来看看你的算法是如何运作的。\n\n## 洗牌算法的实现\n\
  \n在列表 10-6 中所示的程序循环代码在此重复：\n\n```\nwhile (index < deck.Length)  // 为从 0 开始的数组偏移\
  \ 1\n{\n    val = rnd.Next(DECKSIZE) + 1;   // 生成 1 52 的值\n    if (deck[val] ==\
  \ 0)\n    {           // 牌组中的这个位置是否是“未使用”的？\n        deck[val] = index;      //\
  \ 是的，为其分配一个位置\n        index++;                // 准备处理下一张牌\n    }\n    passCount++;\n\
  }\n```\n\n在 `while` 循环开始时，`deck` 数组看起来所示图 10.3。该图显示没有任何元素被赋值。也就是说，图 10.3 中显示的每个空空元素的值都是\
  \ 0。\n\n**图 10.3** 开始洗牌前的牌数组状态\n\n![image](img/c10f003.jpg)\n\n为了理解正在发生什么，假设程序控制已进入\
  \ `while` 循环，第一个分配给 `val` 的随机数是 5。`if` 语句检查元素 `deck[5]` 是否为 0。因为这是第一次循环，`deck[5]`\
  \ 是“空的”（也就是说，它的值为 0），因此将 `index` 的值赋给数组的第五个元素。由于变量 `index` 已经初始化为 1，`deck` 数组现在看起来所示图\
  \ 10.4。\n\n**图 10.4** 添加第一张牌后的状态\n\n![image](img/c10f004.jpg)\n\n如果你回想之前讨论过的 `pips`\
  \ 数组，你应该能推断出牌组中的第五张牌现在是黑桃 A。（仔细思考一下。）在将 `index` 赋值给数组的 `deck[val]` 元素后，`index` 递增。由于\
  \ `index` 的值现在等于 2，且小于数组元素计数的大小（在此例中为 53），因此会再次进行循环。\n\n在循环的第二次通过中，假设下一个随机数是 51。因为元素\
  \ 51 是 0（即“空的”），`if` 语句将值 2 分配给 `deck[51]`。你现在知道黑桃 2 是牌组中的倒数第二张牌。此时牌组的状态如所示图 10.5。\n\
  \n**图 10.5** 向牌组中添加第二张牌\n\n![image](img/c10f005.jpg)\n\n在每次每次循环中，代码都会尝试使用 `val`\
  \ 作为索引，将 `index` 的当前值分配给 `deck` 数组中的空元素。如果你仔细考虑，随着数组逐渐填满，寻找空数组元素会变得越来越困难。这就是为什么可能需要数百次循环才能用随机牌值填满数组。变量\
  \ `passCount` 维护了在 `deck` 数组填满之前循环执行的次数。通常 `deck` 数组是\n\n\n\n\n\n如果你退后一步观察整片森林而非仅仅是几棵树，你的游戏类似于许多数据库应用程序中常见的客户端-服务器架构。客户端是玩家，而服务器是\
  \ `clsCardDeck`，它负责“提供”牌牌以进行游戏。简单的客户端-服务器架构通常被称为`二层架构`，因为该设计包含两个活动元素：客户端和服务器。然而，由于游戏有规则限制，你需要在程序中引入一个中间介，以确保游戏规则得到执行。你可以为这个游戏画出这种设计，如图\
  \ 10.7 所示。\n\n图 10.7 中间层架构\n\n![image](img/c10f007.jpg)\n\n在图 10.7 中，一个名为 `clsInBetweenRules`\
  \ 的类被插入到客户端(`frmMain`)和服务器(`clsCardDeck`)之间。由于你又标准二层架构之上引入了另一层，因此图 10.7 中的设计是`三层架构`。（有时程序员会将二层架构以上的任何东西简单称为`N\
  \ 层架构`。请坚持使用`三层`术语，因为它更具描述性。）\n\n### 横向细化 (Sideways Refinement)\n\n之前讨论过使用 UML 类图作为程序设计的起点。另一种不那么正式的设计方法就是我所说的`横向细化`。通过横向细化，你可以在纸张的左侧列出“五个程序步骤”。然后你在每个程序步骤的右侧写下程序中每个元素必须处理的任务。例如，表\
  \ 10.1 显示了不同的步骤、要执行的任务以及它们在架构中的处理位置：\n\n表 10.1 中间层程序的横向细化\n\n| **步骤** | **动作** |\
  \ **责任** |\n| :--- | :--- | :--- |\n| 1\\. 初始化 | 构建并显示表单 (`frmMain`)。 | 设置表单和所有后台数据。\
  \ |\n| 2\\. 输入 | 请求新牌 (`frmMain`)。 | |\n| | 获取赌注金额 (`frmMain`)。 | |\n| | 询问下注 (`frmMain`)。\
  \ | |\n| 3\\. 处理 | 发牌 (`rules`)。 | 牌组中剩余足够的牌 (`clsCardDeck`)。 |\n| | | 洗牌 (`clsCardDeck`)。\
  \ |\n| | | 获取三张牌 (`clsCardDeck`)。 |\n| | | 确定胜者 (`clsCardDeck`)。 |\n| | | 调整玩家余额\
  \ (`rules`)。 |\n| 4\\. 显示 | 显示两张牌 (`frmMain`)。 | |\n| | 显示第三张牌 (`frmMain`)。 | |\n\
  | 5\\. 终止 | 关闭。 | |\n\n横向细化比 UML 类图要正式得多，但它可以作为程序设计的良好起点。（你始终可以在横向细化之后使用更正式的 UML\
  \ 类图。）如之前指出的，除了“处理”步骤外，所有操作通常都是作为用户交互程序的一部分执行。对于你到为止编写的程序，`frmMain` 是为程序提供用户界面的类。\n\
  \n设置游戏规则的类承担处理责任。也就是说，游戏假设有足够的牌来发牌。如果没有，牌组就需要洗牌。然后规则会请求三张牌。虽然你也可以以不同的方式设计规则管理的机制，但作者决定在请求前两张牌时确定胜者（或败者）。也就是说，当游戏显示两张牌并询问玩家是否想要下注时，第三张牌已经在等待显示，并且规则类在第三张牌显示之前就已经知道玩家是否获胜。一旦用户点击“下注”按钮，第三张牌就会显示，玩家的游戏余额也会随之调整。\n\
  \n横向细化并不一定显示程序的执行顺序。相反，它旨在展示每个类相对于“五个程序步骤”所承担的责任。\n\n现在你已经知道如何设计这个游戏，在接下来的“动手尝试”中，你将在\
  \ [wrox.com](http://wrox.com) 创建本章节提供的代码版本。\n\n* *\n\n### 动手尝试：中间层牌牌 (Chapter10ProgramInBetween.zip)\n\
