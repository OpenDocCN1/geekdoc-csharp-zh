  \ = new string[100];\nstring[] temp;\n\nstr1[0] = \"Hailey\";\n// 更多代码\ntemp = str1;\n\
  ```\n`temp` 的右值等于什么？\n\n### 你在本章中学到的知识\n\n| 主题 | 关键点 |\n| :--- | :--- |\n| 数组 |\
  \ 什么是数组，以及值类型数组与引用类型数组的区别。 |\n| 数组索引与数组元素 | 为什么这两项不同，以及为什么这种差异很重要。 |\n| 数组阶 | 数组有多少维。\
