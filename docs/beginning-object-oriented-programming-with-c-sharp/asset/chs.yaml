  \n```cs\n const string TESTDATAFILE = \"Friends.bin\";\n\n    long recs;\n    long\
  \ currentRecord = 1;\n    clsRandomAccess myData = new clsRandomAccess(TESTDATAFILE);\n\
  ```\n\n这些变量具有类作用域，因此对 `frmMain` 中的所有方法都可用。正如 `TESTDATAFILE` 文件名所示，程序使用二进制文件来存储每个朋友的信息。尽管你知道文件记录是从记录\
  \ 0 开始的，但你将 `currentRecord` 变量初始化为 1（再次遵循 N – 1 原则），这样用户可以将第一条记录视为 1 号记录。由你来管理实际的记录编号。\n\
  \n**测试技巧**\n如果你在输入此程序的代码时，可以更改每个文本框的 `Text` 属性，为该变量提供一个示例测试值。这样可以避免在每次测试程序时都为每个文本框输入数据。要添加一个新的人，你可以查看最后一个人，在她的姓氏后加上\
  \ 01，然后点击 `Save` 按钮。（不要点击 `Add New` 按钮，因为它会清空所有文本框对象。）每次运行时，只需将值加 1 以与其他记录区分来。当有大量输入信息需要测试程序时，可以随时使用此类测试值。\n\
  \n在相应的文本框对象中输入所需信息，然后点击 `Save` 按钮。`btnSave_Click()` 事件代码调用 `CopyData()` 方法将文本框的内容复制到名为\
  \ `myData` 的 `clsRandomAccess` 对象的成员中：\n\n```cs\n private void btnSave_Click(object\
  \ sender, EventArgs e)\n    {\n        CopyData();\n        if (myData.Open(TESTDATAFILE)\
  \ == 1)\n        {\n            recs = myData.getRecordCount();\n            myData.WriteOneRecord(recs);\n\
  \            myData.Close();\n        }\n        else\n        {\n            MessageBox.Show(\"\
  Could not open file \" + TESTDATAFILE,\n                            \"File Error\"\
  );\n            return;\n        }\n    }\n```\n\n程序随后打开数据文件，如果没有打开文件的错误，则调用 `clsRandomAccess`\
  \ 类的 `getRecordCount()` 方法。该方法仅决定新记录应该放置在文件的哪个。调用 `WriteOneRecord()` 将新数据写入文件，然后关闭文件。（与其显示\
  \ `MessageBox.Show()` 消息，你可以使用在本章之前讨论的错误日志程序来记录错误信息。）\n\n字体 导航记录\n导航按钮允许用户在文件中存储的记录之间来回。提供此功能的代码非常简单。例如，如果用户点击\
  \ `First` 按钮，代码会将 `currentRecord` 变量设置为 1，并调用 `ReadAndShowRecord()` 在相应的文本框对象中读取并显示信息：\n\
  \n```cs\n private void btnFirst_Click(object sender, EventArgs e)\n    {\n     \
  \   int flag;\n\n        currentRecord = 1;\n        flag = ReadAndShowRecord();\n\
  \    }\n\n    private void btnNext_Click(object sender, EventArgs e)\n    {\n  \
  \      int flag;\n\n        currentRecord++;\n        flag = ReadAndShowRecord();\n\
  \        if (flag == 0)\n        {\n            currentRecord--;\n        }\n  \
  \  }\n```\n\n`Next` 按钮类似，但它在调用 `ReadAndShowRecord()` 之前增加了 `currentRecord`。如果用户尝试在文件的最后记录上使用\
  \ `Next` 按钮，将显示相应的错误消息。`Previous` 按钮也进行了类似的检查。\n\n删除 删除记录\n提所谓“删除”记录是有误导性的，因为记录并没有被实际删除。相反，将\
  \ `clsRandomAccess` 成员的状态成员改为 0，从而将其标记为非活动记录。为什么不直接从文件中删除该记录呢？\n\n不删除记录有几个原因。首先，问问自己为什么要删除这条记录。这个人不再是朋友了吗？还是发生了一场争吵，几天后一切都会原谅，而你现在只是出于冲动这么做？换句话说，删除记录的原因是什么？大多数人会说是为了释放磁盘空间。哎，得吧！每\
  \ MB 0.02 美元，你*真的*在担心 300 字节吗？每个成员的成本为 0.0000006 美元，你付得起存储几个非活动成员。\n\n其次，删除任何信息都不是一个好主意……无论。例如，你可能会将\
  \ `clsRandomAccess` 代码作为会员计划的一部分。可能你有一个第二个文件记录会费缴纳情况，它使用会员俱乐部记录编号将缴费与成员关联起来。如果你从会员文件中删除了他，你现在会在会费文件中获得一个*孤儿记录*，它无法再链接回成员（无论活动与否）。\n\
  \n此外，你可以打赌，只要你删除了这样一条记录，你的运气可能让美国税务局（IRS）第二天就来想要审计你的会费记录。现在该怎么办？如果你使用状态变量而不是物理删除记录，此类请求将很容易满足。基于事务的程序很少删除此类信息，因为没有了它，即使在最理想的情况下构建完整的审计追踪也是困难的。\n\
  \n最后，完全删除记录将要求在删除后重写整个文件，这让我们又回到了顺序文件的缺点。将记录标记为已删除要简单得多。\n\n我建议你始终使用 `int` 变量来记录客户的状态。不要将状态变量设为\
  \ `bool`。客户记录通常只有活动或非活动状态，但其他状态比你想象的要常见。例如，我做过编程的一个高尔夫俱乐部有以下会员状态：1) 非活动，2) 活跃，3)\
  \ 财务休假和 4) 医疗假。如果我选择使用二状态的 `bool`，将无法记录所有的会员状态数据。作为一个一般原则，`bool` 不应用于记录数据；它只适用于二尔状态（真、假）。如果你在程序中删除了一条记录，当你使用导航按钮浏览文件时，仍然可以看到该记录。然而，状态复选框对象会根据所查看朋友的状态标志改变其状态。如果你不想防止非活动朋友，对\
  \ `ReadAndShowRecord()` 方法进行微调即可。（参见本章末尾的练习题。）\n\n### clsRandomAccess\n现在看一下 `clsRandomAccess`\
