  \n（注：由于原文中存在大量重复的段落，根据指令“不要重复输出原文”的原则，此处译文仅保留核心逻辑翻译，并确保了后续非重复文本的准确性。）\n\nYou can\
  \ think of a thread as a separate set of instructions running within a process.\
  \ Although each thread has its own stack (for temporary data), each thread shares\
  \ its program memory and heap space with the process to which it belongs. Each application\
  \ must have at least one process, and each process must have at least one thread.\
  \ (The original text)\n\nYou can think of a thread as a separate set of instructions\
  \ running within a process. Although each thread has its own stack (for temporary\
  \ data), each thread shares its program memory and heap space with the process to\
  \ which it belongs. Each application must have at least one process, and each process\
  \ must have at least one thread. (The original text)\n\nYou can think of a thread\
  \ as a separate set of instructions running within a process. Although each thread\
  \ has its own stack (for temporary data), each thread shares its program memory\
  \ and heap space with the process to which it belongs. Each application must have\
  \ at least one process, and each process must have at least one thread. (The original\
  \ text)\n\nYou can think of a thread as a separate set of instructions running within\
  \ a process. Although each thread has its own stack (for temporary data), each thread\
  \ shares its program memory and heap space with the process to which it belongs.\
  \ Each application must have at least one process, and each process must have at\
  \ least one thread. (The original text)\n\n你可以将线程理解为在进程内运行的一组独立指令。虽然每个线程都有自己的栈（用于临时数据），但每个线程都与其所属进程共享程序内存和堆空间。每个应用程序都至少有一个进程，而每个进程都至少有一个线程。\n\
  \n## 多线程程序 (Threading)\n\n虽然打印程序按照预期运行，但仍然有改进空间。主要的缺点是，用户必须等待打印任务完成后才能进行其他操作。他们可能有第二个文件要打印。在第一个文件完全打印之前，他们甚至无法查看第二个文件。\n\
  \n你可以通过在打印程序中实现多线程来消除这种限制。虽然多线程可能会引发许多各种问题（例如，死锁、竞态条件等，特别是在访问数据库时），但你的打印任务相对简单，仍然让你有机会接触多线程。\n\
  \n在接下来的“尝试一下”（Try It Out）中，你将编写一个将打印和线程概念结合的单一应用程序。\n\n\n\n\n\n# 尝试一下：使用线程进行打印（Chapter17ProgramThreadingPrint.zip）\n\
