  \n# 编程语言的基本构建块\n\n尽管编程语言的特定规则之间有所不同，但构建所有语言的基础是类似的。存在所有语言遵循的层次结构：\n\n程序 → 语句 → 表达式\
  \ → 操作数和运算符\n\n你可以这样口述这种层次结构：“程序由一个或多个语句组成。语句由一个或多个表达式组成。表达式由一个或多个操作数组成。”因此，在底层，编写程序必须理解操作数和运算符。\n\
  \n## 操作数和运算符\n\n在第 3 章中，你编写了一个程序，使用两个变量来存储用户输入的信息。该程序设计为将第一个数字除以第二个数字。在第 3 章程序的示例中，用户为第一个数字输入\
  \ 10，为第二个数字输入 6。你从小学就开始做这种数学计算了。你可以将 10 除以 6 的过程写为：\n\n```\n10 / 6\n```\n\n这个简单的数学过程涉及将\
  \ 10 除以 6。在这个例子，10 和 6 被称为操作数。然而，为了让第 3 章的程序更灵活，你创建了变量来存储用户输入的值。在该程序中，你定义了两个名为 `operand1`\
  \ 和 `operand2` 的变量。如果 `operand1` 的值为 10 而 `operand2` 的值为 6，你可以这样写相同的过程：\n\n```\n\
  operand1 / operand2\n```\n\n\n\n\n两个操作数之间夹着除法符号 (`/`)，它告诉你要对这两个操作数执行什么操作。除法符号就是运算符。`operator`\
  \ 指定了应对操作数应执行的操作。在这个示例中，你只是想将 `operand1` 除以 `operand2`。这得出了数学过程的以下泛化表示：\n\n```\n\
  operandOne operator operandTwo\n```\n\n对于所有的数学运算（加、减、乘、除和取模），数学运算符（`+`、`-`、`*`、`/`\
  \ 和 `%`）都需要两个操作数来执行其功能。因为这些数学运算符需要两个操作数，所以它们被称为 `binary operators`。事实上，任何需要两个操作数完成任务的运算符都是二元运算符。如果运算符只需要一个操作数，它就是\
  \ `unary operator`。否定运算符 (`!`) 是一元数学运算符。最后，如果一个运算符需要三个操作数，它就是 `ternary operator`。大多数\
  \ C# 运算符都是二元运算符。\n\n## Expressions\n\n`expression` 简单来说是一个或多个操作数及其关联运算符被视为单一整体。例如，在第\
  \ 3 章的整数除法程序中，你写了下面这一行：\n\n```\nanswer = operand1 / operand2;\n```\n\n这一行使用了两个操作数和除法运算符来计算\
  \ `operand1` 除以 `operand2` 的结果。因为表达式只是被视为单元的一个或多个操作数和运算符，你可以将此程序语句可视化为：\n\n```\n\
  answer = expression1;\n```\n\n并理解 `expression1` 由 `operand1` 除以 `operand2` 组成。但是，如果你对语句进行泛化：\n\
  \n```\nanswer = expression1;\n```\n\n它可以被重写为：\n\n```\noperand4 = operand3;\n```\n\
  \n其中 `answer` 被替换为 `operand4`，`expression1` 被替换为 `operand3`。唯一不同的是运算符变为了赋值运算符 (`=`)。从此，你也可以得出赋值运算符是一个二元运算符。\n\
  \n假设 `operand1` 等于 10，`operand2` 等于 5。注意处理程序行时遵循的序列：\n\n```\nanswer = operand1 /\
  \ operand2;\nanswer = 10 / 5;\noperand4 = 10 / 5;\noperand4 = 2;\n2;\n```\n\n计算除法结果的过程仅仅是使用每个运算符及其操作数来生成适当的结果。当这一系列事件结束时，`operand4`\
  \ 保留了除法的结果。\n\n## Statements\n\n在 C# 中，`program statement` 是以分号终止的一个或多个表达式。然而，由于表达式是由操作数和运算符组成的，因此以下内容是一个程序语句：\n\
  \n```\nanswer = operand1 / operand2;\n```\n\n这个程序语句实际上包含了两个运算符（除法运算符和赋值运算符）和三个操作数（`answer`、`operand1`\
  \ 和 `operand2`），并以分号结尾。\n\n你可以让程序语句变得随你复杂，只要它们以分号结尾即可。例如，你可以选取以下程序行：\n\n```\npart1\
  \ = v + w;\npart2 = x + y;\nsolution = part1 * part2;\n```\n\n并将它们写成单条语句：\n\n```\n\
  solution = v + w * x + y;\n```\n\n现在为前述语句中的变量应用一些值。假设 `v` = 2，`w` = 3，`x` = 4，且\
  \ `y` = 5。你可以将程序语句视为：\n\n```\nsolution = 2 + 3 * 4 + 5;\n```\n\n问题是，“`solution`\
  \ 等于多少？”答案是 25 还是 19？如果你回看原始的三条程序语句，`part1` 在其语句被处理后等于 5，而 `part2` 解析为 9。第三条语句将\
  \ `part1` 乘以 `part2` 并将结果赋值给 `solution`。因为 `part1` 解析为 5 且 `part2` 解析为 9，`solution`\
  \ 的结果是 45，而不是 25 或 19。发生了什么？为什么你折叠合并后的语句版本产生了错误的答案？\n\n## Operator Precedence\n\n\
  每当程序语句涉及多个运算符时（如你刚刚看到的那个），必须有一组规则让你能够正确地处理表达式中的运算符和操作数。表 4.1 展示了运算符处理的优先级（或顺序）。\n\
  \n表 4.1 运算符优先级\n\n| ORDER | TYPE | SYMBOL |\n| :--- | :--- | :--- |\n| 1 | 否定 |\
  \ `!` |\n| 2 | 乘、除、取模 | `*`, `/`, `%` |\n| 3 | 加、减 | `+`, `–` |\n| 4 | 赋值 | `=`\
  \ |\n\n表 4.1 显示，在执行任何加法或减法操作之前，应该执行乘法、除法和取模操作。根据表 4.1](#9781118416471c04.xhtml_c04-tbl-0001)\
  \ 中的信息，程序语句的处理顺序如下：\n\n```\nsolution = 2 + 3 * 4 + 5;\n```\n（注：原文文本后半部分存在大量重复和乱码描述，已根据高级文档工程师逻辑进行去重处理，确保核心逻辑准确。）\n\
  \n\n\n```\nanswer = operand1 / operand2;\n```\n\n改为\n\n```\nanswer = 2 + operand1\
  \ * operand2 + 5;\n```\n\n3. 重新编译并运行程序，为 `operand1` 输入值 `3`，为 `operand2` 输入 `4`。如果你运行程序，显示的结果为\
  \ 19。\n4. 现在将程序语句改为：\n\n```\nanswer = (2 + operand1) * (operand2 + 5);\n```\n\n\
  当你第二次运行程序时，你可以看到答案已经发生了变化。\n\n### 工作原理\n\n在添加乘法运算符的第一次修改后运行程序并输入适当的值，得到答案 19。这是因为乘法运算符（`*`）的优先级高于加法运算符（`+`）。因此，程序使用以下语句的第一次测试：\n\
  \n``````\nanswer = 2 + operand1 * operand2 + 5;\n```\n\n解析为\n\n```\nanswer = 2 +\
  \ 3 * 4 + 5;\nanswer = 2 + 12 + 5;\nanswer = 19;\n```\n\n现在将语句改为第二种变体，使用使用强制执行不同的表达式评估顺序。现在语句解析为：\n\
  \n```\nanswer = (2 + operand1) * (operand2 + 5);\nanswer = (2 + 3) * (4 + 5);\n\
  answer = 5 * 9;\nanswer = 45;\n```\n\n因为任何被括号括的表达式都在优先级较低的表达式之前求值，所以括号的使用改变了添加括号之前生效的表达式求值。最终结果是，即使语句中使用了相同的值，你也会得到完全不同的结果。\n\
  \n# 定义变量\n\n一些程序员看到类似这样的语句：\n\n```\nint val;\n```\n\n并认为程序正在定义或声明一个名为 `val` 的变量。许多程序员经常混用*定义*（define）和*声明*（declare）这两个词。定义变量与声明变量是不同的。这两个术实际上区别很大。\n\
  \n## 从编译器的角度定义变量\n\n假设你在程序中写了语句：\n\n```\nint i;\n```\n\n在你的脑海中，你只是在告诉程序你想创建一个名为\
  \ `i` 的整数变量供程序使用。然而，对于 Visual Studio 来说，事情并不那么简单。考虑一下 Visual Studio 仅处理这条简单语句需要做什么。\n\
  \n### 步骤 1：初步语法检查\n\n首先，Visual Studio 必须检查语句是否存在语法错误。当你编写不符合 C# 语法规则的程序语句时，就会发生*语法错误*。例如，你知道变量名不能以数字字符开头，也不能包含标点字符。如果你尝试创建符合任一这些条件的变量，Visual\
  \ Studio 会发出错误消息。你在第 3 章中学到，如果你在程序语句中犯了语法错误，IntelliSense 会在该语句下方画一条波浪线。由于你知道程序语句的语法是正确的，因此没有波浪线，Visual\
  \ Studio 移动到下一步。\n\n### 步骤 2：符号表检查\n\n仅仅你的语句语法是正确的并不意味着没有其他问题。因此，Visual Studio 做的下一件事是检查它的符号表，查看你是否已经定义了一个名为\
  \ `i` 的变量。*符号表*（symbol table）是 Visual Studio 内部的一个表，它用于跟踪你想在程序中使用的数据。表 4.2 显示了一个假设的符号表。（尽管一个“真实”表可能有几十列，但表\
  \ 4.2 中显示的简化的符号表就能很好地满足你的需求。）\n\n表 4.2 假设的符号表\n\n![image](img/c04tnt002.jpg)\n\n\
  在表 4.2 中，假设第一列（ID）显示已定义的变量名称。（变量名通常被称为*标识符*（identifiers），因此列标题名为 ID。）符号表的第二列告诉 Visual\
  \ Studio 变量的数据类型。你很快就会学到第三列“作用域”（Scope）的含义。第四列 lvalue 是每个变量在内存中的所在位置。也就是说，`hatSize`\
  \ 的 lvalue 是 650,000。简单来说，如果 Visual Studio 需要使用与 `hatSize` 关联的值，它必须访问内存地址 650,000\
  \ 来找到它的值。\n\n在这一步中，Visual Studio 扫描 ID 列查看你是否已经定义了名为 `i` 的变量。因为符号表中 ID 为 `i` 的变量，Visual\
  \ Studio 继续执行步骤 3。如果你已经定义了一个名为 `i` 的变量（在同一作用域级别），你会收到类似这样的错误消息：\n\n```\nA local\
  \ variable named 'i' is already defined in this scope\n```\n\n如果 Visual Studio 允许你在同一作用域级别定义另一个名为\
  \ `i` 的变量，那么当你尝试在其他表达式中使用该变量时，它将不知道使用哪一个 `i`。这种特定的错误消息被称为*重复定义错误*（duplicate definition\
  \ error）消息，它告诉了你这一点。\n\n\n\n\n**注意**：在 C 和 C++ 等某些语言中，你可以通过对标识符使用取地址运算符（`&`）来观察变量的左值，例如\
  \ `&myHatSize`。你可以使用间接运算符（`*`）来观察右值，例如 `myHatSize`。然而，C# 仅在使用 `unsafe` 关键字定义的代码块中启用这些操作。由于微软使用\
  \ `unsafe` 关键字是有原因的，本书将不会讨论这些运算符。\n\n***\n\n### 第 3 ：定义变量\n\n由于表 4.2 中没有另一个名为 `i`\
  \ 的变量，IntelliSense 对该语句的语法通过了健康检查。Visual Studio 现在准备好在符号表中将内存地址与变量 `i` 关联。\n\n然而，将内存地址分配给特定变量并不是\
  \ Visual Studio 的工作。为变量寻找足够的内存是操作系统的责任。因此，Visual Studio 向操作系统（假设是 Windows 操作系统）发送了一条消息并说：“嘿，Windows！我是……Visual\
  \ Studio。我的程序员想为程序定义一个整数变量。你能为我找到 4 字节的空内存吗？”\n\n回想第 3 章，每个整数变量都需要 4 字节（32 位）的存储。接收到\
  \ Visual Studio 的消息后，Windows 将消息路由到 Windows 内存管理器，因为内存管理器负责满足内存请求。\n\n你可能会问：“为什么\
  \ Visual Studio 不能自己分配内存呢？”“是因为 Windows 允许同时执行多个程序。由于 Visual Studio 不会花精力跟踪其他应用程序在做什么，如果由它分配内存，就会面临踩踏其他应用程序数据的风险。然而，Windows\
  \ 内存管理器负责跟踪当前在计算机上运行的每个应用程序的内存使用情况。\n\nWindows 内存管理器扫描其空闲内存列表，可能找到了所需的 4 字节。你可以假设\
  \ Windows 内存管理器为从内存地址 `900,000` 开始的整数找到了这 4 字节。在找到请求的内存后，Windows 内存管理器向 Visual Studio\
  \ 发回了条消息：“嘿，Visual Studio！我是……Windows 内存管理器。我为变量 `i` 找到了 4 字节的空内存，起始内存地址为 `900,000`。”Visual\
  \ Studio 接收到消息，立即将该内存地址放入变量 `i` 的符号表中。符号表现在如表 4.4 所示。\n\n表 4.4 新内存分配后的符号表\n\n![image](img/c04tnt004.jpg)\n\
  \n注意符号表中的左值记录了名为 `i` 的变量在内存中所处的内存地址。你可以在图 4.2 中反映这一变化。\n\n图 4.2 内存分配后的左值\n\n![image](img/c04f002.jpg)\n\
  \n右值保持不变，但左值反映了变量 `i` 存储在内存地址 `900,000` 开始的位置。\n\n你现在可以说你已经定义了变量 `i`。（你会在书后的部分看到数据声明的示例。）每当你说一个变量被定义时，意味着该变量出现在符号表中，并且与之关联了一个有效的内存地址（左值）。\n\
  \n***\n\n**注意**：当且仅当符号表中该变量的左值列被分配了内存地址时，变量才算被定义。当你声明一个变量时，符号表中该变量的左值列不包含有效的内存地址。`null`\
  \ 值是符号表中已声明变量的左值，因为 `null` 不是一个有效的内存地址。定义一个变量的充分必要条件是符号表必须包含该变量有效的（即非空的）内存地址。如果一个变量带有\
  \ `null` 左值出现在符号表中，则该变量只是被声明了，而没有被定义。\n\n***\n\n# 在程序中使用变量\n\n现在你已经理解了什么是符号表以及它包含的信息，请检查\
  \ Visual Studio 是如何处理像赋值语句这样简单的内容的。假设你已经定义了一个名为 `i` 的整数变量，假设你写了以下语句：\n\n```\ni =\
  \ 10;\n```\n\n该程序语句看起来足够简单，但现在请检查 Visual Studio 处理该语句必须执行的步骤。\n\n1. **语法检查**：与之前一样，Visual\
  \ Studio 必须确保程序语句遵守 C# 语言的语法规则。由于 IntelliSense 在语句的语法上没有发现任何错误，Visual Studio Proceed\
  \ 到下一步。\n\n2. **符号表检查**：由于该语句想要将值 10 赋值给名为 `i` 的变量，Visual Studio 需要验证变量 `i` 是否之前已经定义。这一步可能会出现两个问题。首先，程序员可能忘记定义名为\
  \ `i` 的变量。如果你忘记定义变量 `i`，Visual Studio 会发出以下错误信息：\n\n```\n在当前上下文中不存在名称 'i'\n```\n\
  \n第二种可能的问题是名为 `i` 的变量已定义，但处于当前无法触及的作用范围内。在不详细讨论的情况下，变量的作用域指的是在程序中的可见性。正如第 3 章提到的，隐藏数据是封装的基本原则，也是面向对象编程的基石。变量不在作用域在很多情况下是件好事，因为这意味着你无法无意中更改该变量。必须在作用域内才能修改其值。如果变量\
  \ `i` 不在作用域内，你将得到与未定义时相同的错误信息。由于你的变量在当前作用域内已定义，IntelliSense 非常满意，没有出现波浪线。\n\n3.\
  \ **获取变量 i 的左值**：由于语句想要将值 10 赋值给变量 `i`，Visual Studio 需要知道存储 10。（记住，赋值运算符右侧的表达式会被复制到左侧。这意味着你正在改变变量的状态。）你已经知道符号表中变量\
  \ `i` 的左值告诉了你应该在内存的何处存储。Visual Studio 尽职地创建了值 10 的二进制表示（即 0000000000000000000000000001010），并将该值移动到从内存地址\
  \ `900,000` 开始的 4 字节内存中。图 4.3 显示了变量 `i` 的值的变化。\n\n[图 4.3] 变量的右值\n\n变量 `i` 的右值已经从图\
  \ 4.2 所示的问号变成了值 10。由于右值发生了变化，你也可以说赋值语句改变了变量 `i` 的状态。\n\n# 桶类比\n\n桶类比可以帮助你记住左值和右值的含义，并加强你对什么是数据定义的理解。假设你写了以下语句\n\
  \n```\nint val;\n```\n\n\n\n\n回想，Visual Studio 会检查此语句的语法，然后搜索符号表以确保 `val` 在当前作用域内尚未定义。假设这些检查已通过且\
  \ IntelliSense 运行正常，Visual Studio 会向 Windows 内存管理器发送消息，为你想要定义的 `int` 请求 4 字节空闲内存。假设一切顺利，Windows\
  \ 内存管理器将返回存储 `val` 的内存内存地址。现在假设 `val` 的内存地址为 `750,000`。然后，该内存地址会被输入符号表中的 `lvalue`\
  \ 列。\n\n“水桶类比”假设你周围有一堆空桶。这些桶的大小不相同。有的大到可以容纳 1 字节数据，有些可以容纳 2 字节，有些桶大到可以容纳 16 字节。因为你想定义一个\
  \ `int` 数据类型，所以你选择了一个足够容纳 `int` 数据类型的桶。正如你在第 3 章中学到的，一个 `int` 占用 4 字节内存，所以你拿了一个\
  \ 4 字节的桶。\n\n现在，将示例中的变量名 `val` 画在桶的侧面，这样你就能将其与内存中可能存储的其他桶区分开来。现在，想象你可以物理地将电脑内的桶拿出来，并放在内存地址\
  \ `750,000` 处。完成后，你可能会看到类似图 4.4 所示的内容。\n\n图 4.4 带有桶的内存映射\n\n![image](img/c04f004.jpg)\n\
  \n“水桶类比”与数据定义之间的关系如下：\n\n1. 桶的 `lvalue` 告诉你在内存的哪里找到这个桶。\n2. 桶的 `rvalue` 告诉桶内部存储了什么。\n\
  3. 项目的数据类型（如 `int`）告诉桶有多大（在本例中为 4 字节）。\n\n“水桶类比”在第 5 章将再次使用，帮助解释与数据定义相关的额外概念以及数据在程序中的使用方式。现在，只需记住“水桶类比”的三个主要点即可。这些点将帮助你理解后续章节的内容，并让你更容易检测、隔离和修复程序错误。\n\
  \n# 程序错误的类型\n\n程序错误主要有三种基本类型。显然，你的目标是编写完全没有程序错误的程序。程序错误也被称为程序 *bugs*（漏洞）。（“bug”一词的起源是因为最早的程序错误之一涉及到一只飞蛾飞进电脑并短路了电子设备。消除程序错误的过程被称为\
  \ *debugging*（调试）。）\n\n消除程序 bug 最简单的方法是编写完美的代码，从而从源头上没有 bug。尽管这个目标值得赞赞，但每一位程序员，无论经验多丰富，编写的程序都会包含错误。然而，熟练的程序员可以比技术不熟的程序员更快地检测、隔离和纠正程序错误。此外，经验丰富的程序员仅仅因为经验犯的编程错误确实更少。这里的教训是，在开始阶段预计会犯很多程序错误……每个新手程序员都是如此。\n\
  \n在开始阶段，你会遇到“平头脑型”的程序错误。这类错误就是当你发现它们时，会用手掌击击额头，一边嘟囔一边：“我怎么会犯这么愚蠢的错误？”放松点。我们都犯过那些错误……而且仍然如此！关键在于不要气馁。将每个程序错误视为一次挑战并从经验中学习。遗憾的是，随着你编程技能的提高，你犯的错误类型也会随之。虽然随着经验的增加，错误会减少，但你所犯的错误往往会变得更加复杂，难以隔离和修复。现在快速概述这三种程序错误。在后面的章节中，你会学更多关于错误和调试的知识。但现在，只需对错误类型进行分类即可。\n\
  \n## 语法错误\n\n第一种错误是语法错误。你已经知道，当你遵守所用编程语言的语法规则时就会产生*语法错误*。初期可能会犯的常见语法规则错误是忘记用分号结束每个程序语句。\n\
  \nIntelliSense 在捕获语法错误方面做得非常好。尽管你可能讨厌 IntelliSense 显示的波浪线，但让 IntelliSense 检测和隔离语法错误比你自己来得容易得多。\n\
  \n## 语义错误\n\n当你遵守语言的语法规则但在语境不对的情况下使用语句时，就会发生*语义错误*。例如，一个英语句子预计要有一个名词和一个动词。考虑这句话：“The\
  \ dog meowed.”狗喵喵了。）这句话符合具有名词和动词的语法规则，但句子的语境是错误的。狗不会喵喵；因此，语句的语境是不正确的。\n\n你之前看到的错误信息，\n\
  \n```\n The name ‘i’ does not exist in the current context\n```\n\n指的是一种语义错误。程序某处可能定义了一个名为\
  \ `i` 的变量，但它目前不在作用域内。也就是说，当你在 `i` 超出作用域时尝试使用它。IntelliSense 在检测语义错误方面做得很好。然而，语义错误比简单的语法错误稍微复杂一些。\n\
  \n## 逻辑错误\n\n*逻辑错误*是在删除了所有语义和语法错误后剩余的错误。通常，当程序产生的结果与你的测试数据预期的结果不符时，就会体现出来。大多数情况下，逻辑错误出现在处理步骤。但是，也可能是输入步骤获取了错误的值并将其传递给处理步骤。（这就是\
  \ GIGO 问题：垃圾进，垃圾出。）逻辑错误通常发生在你错误地实现解决问题的算法时。\n\n修复逻辑错误的关键是能够重现该错误。一个可重复的逻辑错误比随机出现的错误更容易跟踪和修复。（在第\
  \ 5 章中，你将学习使用 Visual Studio 提供的某些检测程序 bug 的工具。）\n\n# Visual Studio 调试器\n\nVisual\
  \ Studio 提供了许多工具来帮助检测程序中的错误。IntelliSense 是这些工具之一，它在你源窗口输入代码时在后台仔细检查你的程序代码。IntelliSense\
  \ 在发现语法和语义错误方面表现出色，但在发现逻辑错误方面帮助较小。因为计算机本身没有智能，它会盲目执行你给给它的任何指令，即使这些指令是错误的。在你确保程序的语法和语义正确后，如果程序产生了错误结果，你还需要另一组工具来帮助。修复程序错误的第二道防线是\
  \ Visual Studio 调试器。\n\n## 调试过程\n\n*调试器*是一种旨在帮助你定位、隔离和修复程序错误的编程工具。Visual Studio\
  \ 内置了强大的程序调试器。消除程序错误的过程被称为调试（debugging*）。以下是调试过程的四个步骤：\n\n\n\n\n\n## 1. 检测 (Detection)\n\
  显然，要纠正程序错误，你必须知道程序中包含错误。检测要求你拥有一组可以用于测试程序运行是否正常的数据。通常，测试数据集是手动生成的，或者是已知能产生正确结果的输入数据集。我的公司生产了一个统计包，多年来，其逐步多元回归（Stepwise\
  \ Multiple Regression）测试对数万用户来说运行得完美无缺。有一天，一个用户向测试传递了美国国内生产总值数据（以美元计）。由于算法使用了数据集中值的平方和，该特定变量最终大到\
  \ `double` 类型无法容纳，导致程序在用户面前惨死掉。这个故事的道理是：仅仅因为程序运行了多年都没有错误，并不意味着它没有 bug。\n\n## 2.\
  \ 稳定 (Stabilize)\n当你怀疑存在程序错误时，下一个任务是让错误稳定。稳定错误意味着你可以一致地重现该错误。当一组一致的输入数据产生一致的错误结果时，就会发生`稳定错误`。最糟糕的程序错误是随机运行的错误——即某些程序运行产生正确结果，而另一些运行则显示错误。\n\
  \n## 3. 隔离 (Isolation)\n当程序 bug 首次出现时，你可能觉得不知道从程序的哪个位置开始寻找它。如果你使用“程序五步法”设计程序，请从`Initialization`（初始化）步骤开始测试每一步。大多数情况下，你会在`Input`（输入）和`Process`（处理）步骤发现\
  \ bug。显然，你需要检查数据以确保其正确，然后观察这些数据在`Process`步骤期间是如何转换的。`Visual Studio` 调试器让这一步比其他时候要容易得多。\n\
  \n## 4. 纠正 (Correction)\n在隔离 bug 并知道其产生原因后，通常只需要几分钟就能完成纠正。在纠正之前，确保你理解了该 bug。有许多学生采取“让我们修改这条语句并希望它能修复\
  \ bug”的态度。这就是`散弹式调试法（shotgun approach to debugging）`，很少成功，并且实际上可能会引入新的 bug。偶然撞到导致\
  \ bug 的精确程序行，然后盲目地输入该语句的精确形式来修复 bug，这种概率等同于中彩。研究这个 bug 并理解它为什么会给你产生错误的结果。只有这样，你才能真正修复它。\n\
  \n## 让重复调试变得更容易\n如果你的程序有一个特别棘手的 bug，你可能必须多次重新运行程序。通常，这种重复还要求你在每次重新运行程序时输入相同的数据集。在每次运行程序时向文本框中重新输入数据在匆忙时会非常乏味。如果你觉得纠正\
  \ bug 将需要多次运行程序，你可能考虑使用`Properties`（属性）窗口将每个输入文本框对象的`Text`属性设置为其关联的测试值。这可以避免你每次重新运行程序时重新输入输入数据。修复\
  \ bug 后，请确保从每个文本框对象的 `Text` 属性中移除测试数据。\n\n让我们在接下来的“尝试一下看（Try It Out）”中使用你之前编写的程序练习一下调试器。\n\
  \n***\n\n### 尝试一下看：使用调试器 (Chapter03IntegerDivision.zip)\n每当你在 IDE 中运行程序时，`Visual\
  \ Studio` 调试器就会变为激活。要学习如何使用调试器：\n\n1. **加载你在第 3 章中编写的整数除法程序。**\n2. **在按钮点击事件代码中，在`operand1`\
  \ 定义的前放置一个注释符号（`//`，将在本章稍后的部分解释）并运行程序。你收到了什么错误消息？**\n3. **在程序的某处，从语句中删除分号（`;`），并记录你收到的错误消息。**\n\
  4. **在按钮点击事件代码中，从一个语句中删除`.ToString()` 代码，并记录你收到的错误消息。**\n5. **在`operand1` 定义前面放置数字字符（即\
  \ `int 3operand1`），并记录错误消息。** 虽然该程序非常简单，没什么出错的，但你可以用它来说明`Visual Studio` 调试器的某些功能。加载程序后，打开`Source\
  \ Code Window`（源代码窗口），这样你就可以检查源代码并使用调试器了。\n\n#### 工作原理\n当你使用注释字符（`//`）注释掉一个数据定义时，本质上是你是将该变量从程序中移除了。当程序尝试访问该变量时，它发现该变量不在符号表中，因此必须发出错误消息告诉你该变量未定义。（`Visual\
  \ Studio` 通常会说类似“名称 `operand1` 在当前上下文中不存在”。这是 `Visual Studio` 告知变量未定义的方式）。\n\n如果你在语句中漏掉分号，`IntelliSense`会在它期望看到分号的地方画一条红色的波浪线。如果你尝试运行程序（也许你没看到红线），错误消息通常是“`;\
  \ Expected.””。因为遗忘分号是一个语法错误，调试器通常会准确标记出源代码中需要放置分号的位置。\n\n如果你忘记使用`ToString()` 方法，你可能不会收到错误消息。有时\
  \ `Visual Studio` 足够智能，即使你的源代码不完全正确，它也能生成正确的代码。在这个程序中，程序执行时没有发出错误消息。然而，如果 `Visual\
  \ Studio` 无法确定正确的上下文，不同的上下文可能会导致调试器产生错误消息。\n\n如果你在`operand1` 处放置数字字符（即 `3operand1`），`IntelliSense`\
  \ 会显示红色波浪线，但会给出错误消息：“`; Expected。”奇怪。为什么会给出这个消息？因为 `Visual Studio` 试图理解你写的内容，假设你想把\
  \ `3` 赋值给一个数字类型，但忘记了变量名。\n\n\n\n\n设置断点有两种方法。首先，您可以将光标置于您想要暂停运行程序代码行上，然后按下 `F9` 键。这将导致调试器用红色高亮该行，并在\
  \ `Source` 窗口的最左侧边栏放置一个红点，如图图 4.5 所示。\n\n图 4.5 设置断点\n\n![image](img/c04f005.jpg)\n\
  \n设置断点的第二方法是当鼠标位于 `Source` 窗口的最左侧边栏时点击鼠标，即使鼠标位于您想要暂停程序代码行对应的位置也可以。（最左侧边栏就是图图 4.5\
  \ 中红点出现的位置。）\n\n要移除断点，请将光标移动到要移除的断点红行上，再次按下 `F9` 键。您可以使用 `F9` 键来切换特定行断点的开启或关闭。同样，您也可以再次点击最左侧边栏来移除断点。\n\
  \n### 使用断点检查变量\n\n设置断点后，运行程序直到它在何处停止。当到达断点时，Visual Studio 会切换到 `Source` 窗口并显示设置断点的代码行。图\
  \ 4.6 显示了在设置断点时 Visual Studio 的状态。\n\n图 4.6 打开本地 (Locals) 窗口\n\n![image](img/c04f006.jpg)\n\
  \n虽然在图 4.6 中没有显示，但断点行的背景颜色已从红色变为黄色。请注意，现在红点内部有一个箭头，指向设置断点的行。\n\n要检查程序中该点的变量，请使用\
  \ `Debug` 窗口中的 `Locals` 菜单序列来激活 `Locals` 窗口。Visual Studio 的外观应该类似于图图 4.7 所示。\n\n\
  图 4.7 使用本地 (Locals) 窗口\n\n![image](img/c04f007.jpg)\n\n`Locals` 窗口出现在图图 4.7 的底部，并显示具有局部作用域的变量。具有局部作用域的变量是在当前语句块可见的变量。在图\
  \ 4.7 中，程序暂停在 `btnCalc_Click()` 方法中。因此，`Locals` 窗口允许您检查相对于 `btnCalc_Click()` 方法的局部作用域变量。\n\
  \n图 4.8 展示了图图 4.7 中所示断点的 `Locals` 窗口放大视图。\n\n图 4.8 本 (Locals) 窗口\n\n![image](img/c04f008.jpg)\n\
  \n在图 4.8 中，C# 关键字 `this` 指向当前活动对象。在当前程序，`frmMain` 是当前活动对象。如果您点击 `Locals` 窗口 `this`\
  \ 条目左侧边栏显示的加号，可以看到与 `frmMain` 关联的其他对象。当点击加号时，窗口会显示该条目的详细信息，并在原本加号的位置显示减号。如果您点击减号，图像将恢复到之前的状态。因此，在\
  \ `Locals` 窗口中点击加号会展开窗口以提供更多信息，而点击减号则会恢复窗口之前的（折叠）状态。\n\n图 4.8 中的接两行分别显示了关于 `sender`\
  \ 和 `e` 参数的信息。这两个变量提供了导致程序执行 `btnCalc_Click()` 方法的事件信息。（记住 Windows 是事件驱动的操作系统，因此会有事件信息）\n\
  \n\n\n\n`program comment`（程序注释）简单来说就是你留在程序中的一条信息，用于帮助读者理解代码。使用注释是一门艺术。注释太少会迫使读者花费更多时间来理解程序在做什么。注释过多实际上会因为增加不必要的杂乱而干扰对代码的理解。对程序中的每一行编写注释几乎没有必要。在另一个极端，代码可能非常复杂，以放入参考书的名称和页码比解释它要容易得多。\n\
  \n尝试对那些执行异常操作或对数据处理至关重要的语句使用注释。简单来说，注释应该让读者更容易理解你的代码，而不是阻碍这种理解。\n\n程序注释有两种类型：单行注释和多行注释。始终要记住，编译器会忽略注释，因此它们对程序的性能没有影响。（这又为“在程序中不写注释”提供了一个借口！）。\n\
  \n## 单行注释\n\n你以前见过过单行注释。这些注释是用一对斜杠（`//`）后跟注释内容引入的。注释必须位于行内，例如：\n\n```\nanswer =\
  \ operand1 / operand2;     // 这是 Process 步骤\n```\n\n这一行使用注释来标识该语句执行了程序中的 Process\
  \ 步骤。（在现实生活中，这样的注释可能对理解程序的帮助不大，完全可以不写。）\n\n一个问题是应该像前一个示例那样放置注释，还是像这里这样将注释放在该行之前：\n\
  \n```\n // 这是 Process 步骤\n    answer = operand1 / operand2;\n```\n\n如果你在一家一家编写商业代码的公司工作，可能会有公司政策规定所使用的注释风格。否则，选择哪一种取决于个人喜好。\n\
  \n**注意**：我的选择取决于注释本身。如果注释可以放在行尾，而不需要读者滚动“源窗口（Source window）”来阅读它，我更倾向于将注释放在程序语句的末尾。这意味着与另一种风格相比，我可以在源窗口中多看到一行源代码。如果注释相当长，需要滚动才能阅读，我把注释放在程序语句上方。如果注释仍然太长，无法在不滚动的情况下放入单行，我会将注释拆分，并将剩余部分放在第一行注释正下方的新行上。如果仍然太长，我将使用多行注释。无论哪种方式，记住双斜杠字符对（`//`）之后行上的所有内容都会被编译器忽略。\n\
  \n## 多行注释\n\n多行注释是用反斜杠-星号字符组合引入的，并以星号-反斜杠结束，例如：\n\n```\n /* Purpose: The btnCalc-Click()\
  \ event method is used to\n   * calculate the result of dividing two integer values.\n\
  \   */\n  private void btnCalc_Click(object sender, EventArgs e)\n```\n\n出现在 `/*`\
  \ 和 `*/` 对之间的任何内容都会被视为注释并被编译器忽略。注释第二行开头的星号是由 Visual Studio 自动提供的。星号有助于注释行在代码中脱颖而出。多行注释最显而易见的用法是需要在代码中放置长段注释时。根据原则，你应该让每行都足够短，以至于阅读它时不需要水平滚动。\n\
  \n## 将多行注释作为调试辅助\n\n然而，你通过多行注释可以做的事情比在程序中添加长篇注释要多得多。有时，你有一段代码给你带来了问题，并且你想尝试另一种算法。因为你不确定新算法是否有效，且不想在更改失败时重写原始代码，因此从程序中移除代码但仍保留其可用性的简单方法是使用多行注释将其括起来，例如：\n\
  \n```\n /*    这是原始代码\n     * x = y * .33  (m * g);\n     * z = x % 2 + sigma;\n\
  \     */\n    // 开始新代码…\n    x = y * .45  (m * g);\n    z = x % 3.2 + sigma;\n \
  \   // 结束新代码\n```\n\n在这个示例中，多行注释通过用多行注释对括起来达到了移除原始两行代码的效果。我的风格是在测试代码之前用一个单行注释标记新代码的开始，然后是新的测试代码，最后是第二个单行注释标记测试代码的结束。如果测试代码运行不正常，可以通过删除测试代码并取消原始代码的注释轻松将程序恢复到原始状态。\n\
  \n程序注释对于记录代码在做什么以及尝试替代性代码非常有用。因为注释对程序性能没有影响，并让其他人更容易阅读和理解你的代码，你应该经常使用它们。\n\n## 使用有意义的变量名\n\
  \n仅仅你遵循了 C# 的规则来创建变量名，并不意味着你实现了一个良好的变量名。一个良好的变量名具有两个特征：\n\n* 变量名反映了数据在程序中的目的或用途。如果你编写一个将华氏温度转换为摄氏度的程序，变量名\
  \ `t1` 和 `t2` 实际上对你代码的读者没有帮助。选择能帮助读者理解代码的变量名。\n* 变量名必须足够长以指示其用途，但又要短到让你不会觉得厌烦。虽然\
  \ `t1` 和 `t2` 太短而没有帮助，但将它们改为 `currentFahrenheitTemperature` 和 `convertedCelsiusTemperature`\
  \ 可能过度了。\n\n尝试在足够有用和输入过于乏味的名称之间取得平衡。在这种情况下，`tempCelsius` 和 `tempFahrenheit` 就可以。\n\
  \n## 避免魔数\n\n初学者经常在程序中使用字面量，我称之为*魔数*，因为它们通常在没有任何说明的情况下使用。假设你在程序中读到以下行：\n\n```\n\
  f = 125 + (sl) * 10;\n```\n\n可能需要费一番筋才能明白该语句的意思。现在将该语句与此进行对比：\n\n```\nspeedingFine\
  \ = MINIMUMSPEEDINGFINE + (postedSpeedLimit) *\n                   DOLLARSPMILELIMIT;\n\
  ```\n\n新的语句更有意义了，因为你使用了更好的变量名，并将魔数替换为了符号常量。\n\n### 符号常量\n\n*常量*简单来说就是在程序运行时无法更改的变量。*符号常量*是一个名称反映该常量在程序中功能的常量。惯例上符号常量以全大写形式呈现；尽管这并不是语言强制要求的。\n\
  \n符号常量通常定义在它们所属的类的顶部，例如：\n\n```csharp\npublic class frmMain : Form\n{\n  const decimal\
  \ MINIMUMSPEEDINGFINE = 125M;\n  const decimal DOLLARSPMIOVERLIMIT = 10M;\n  //\
  \ 类的其余代码出现在下方…\n}\n```\n\n在数据类型前面的 C# 关键字 `const` 意味着你正在定义该数据类型的常量。因为是常量，你必须在定义常量时对其进行初始化，如前面的代码所示。这些值一旦初始化后，在程序运行时无法更改。\n\
  \n\n\n\n使用符号常量你又获得了另一个优势。假设你没有使用 `MINIMUMSPEEDINGFINE` 来表示最低罚款。相反，假设你在整个程序中都使用了数字\
  \ 125 这个“魔术数字”。进一步假设，该值同样也是超载卡车和未戴头盔的摩托车手对应的最低罚款。最后，假设这三个金额散落在程序中的几十处。现在，某位政客决定将汽车的最低超速罚款提高到\
  \ 150 美元。卡车和头盔罚款保持不变。你的老板现在把程序交给你，并说：“修复它！”\n\n你不能简单地在程序中全局搜索并替换 `125`。那样也会改变卡车和头盔的罚款。你被迫找到程序中每个\
  \ `125` 出现的位置，解读代码以查看 `125` 是否与超速罚款有关，然后要么修改，要么保持该行不变。这是一个缓慢的过程，简直是在等着发生事故。\n\n\
  相反，假设你最初是这样写写程序的：\n\n```cpp\n const decimal MINIMUMSPEEDINGFINE = 125M;\n  const\
  \ decimal TRUCKOVERWEIGHTFINE = 125M;\n  const decimal NOHELMETFINE = 125M;\n```\n\
  \n通过这种方式，你避免了在代码中使用魔术数字。这不仅让你的代码更易读，只需将程序中的其中一行改为\n\n```cpp\n const decimal MINIMUMSPEEDINGFINE\
  \ = 150M;\n```\n\n并重新编译程序，即可自动对程序进行所有必要的更改。使用符号常量允许你在几秒钟内完成必要的程序更改，并且仍然绝对确定下次运行程序时使用了正确的值。\n\
  \n符号常量让你的程序在需要时更易阅读和修改。在代码中避免使用魔术数字并经常使用符号常量。从长远来看，它们可以为你节省时间。\n\n## 使用一致的编码风格\n\
  \n如果你只是为了自己写代码，你最终会发展出自己的编码风格。也就是说，你会在每个 C# 关键字的相同位置放置语句块大括号。你会在方法的相同位置定义变量。你会以一致的方式创建对象（例如\
  \ `clsPort`、`txtName`、`btnExit`、`lblResult` 等）和变量名（例如 `myHat`、`yourAddress`、`herName`\
  \ 等）。这种风格的一致性使你更容易阅读和调试你的代码。\n\n如果你在商业开发环境中工作，其他人（可能是公司政策指南）可能会设定编码风格。显然，你必须遵循那种风格，除非你有足够的权威来改变它。尽管你可能对必须遵循一种你认为没有你自己的风格“好”的公司风格感到不悦，但请感谢你的公司*有*编码风格政策。你会惊讶地发现，当\
  \ 30 个程序员使用 30 种不同的编码风格时，开发工作竟会变得多么缓慢。\n\n无论你的编码环境如何，请选择一种编码风格并坚持下去。从长远来看，它可以为你节省时间。\n\
  \n## 休息一下\n\n如果你有一个特别棘手的 bug 导致你追寻了好几个小时，是时候站起来去别的地方呆几分钟了。长时间不休息的会议往往会让你看到你想看到的东西，而不是实际发生的情况。只是离开座位去喝杯咖啡就能帮助你对代码产生全新的视角。\n\
  \n## 使用第二双眼睛\n\n盯着同一页代码看几个小时也会让你看到你预期的内容，而不是实际存在的内容。你会有这样的时候，告诉自己代码不可能执行它正在执行的操作。嗯，它*确实*在执行代码所说的操作，但你正遭受着“见木不见林”症。\n\
  \n很多时候，让同事看看代码是有用的。比我愿意承认的要多的是，同事几秒钟内就能发现错误，尽管我已经盯着它看了一个小时。就像那些讨厌问路的人们一样，程序员也讨厌请求调试帮助。这种态度是适得其反的。如果有帮助可用，就用它吧。\n\
  \n# 总结\n\n在这一章中，你学习了为了定义一个供程序使用的变量需要做什么。虽然这里采用的方法看起来像是在用氢原子弹去杀一只蚂蚁，但理解 Visual Studio\
  \ 是如何处理像数据定义这样简单的事物的，最终会让你成为一名更优秀的程序员。\n\n确保你完全理解 `lvalues`（左值）和 `rvalues`（右值）是什么，以及它们与数据定义（data\
  \ definitions）有何关系。这些术语在随后的章节中会被频繁使用。\n\n# 练习题\n\n你可以在附录 A 中找到以下练习的答案。\n\n**1.**\
  \ 使用你之前编写的程序，在程序中设置几个断点，并单步执行程序。源代码中是否存在任何无法设置断点的地方？****2.** 重写第 3 章末尾的将华氏度温度转换为摄氏度的练习程序。使用符号常量让程序更易理解。****3.**\
  \ 什么是 `lvalue`，什么是 `rvalue`？如何如何使用它们来解释数据定义（data definition）和数据声明（data declaration）之间的区别？****4.**\
  \ 当你在下一次鸡尾酒派会上使用“桶的比喻”来解释 `lvalues` 和 `rvalues` 时（嘿……这可能发生），什么决定了桶的大小？桶的比喻中关键要素是什么？****5.**\
  \ 写一个程序，询问物品的价格和购买数量，然后根据你所在州的销售税率加上应交的销售税。使用任何符号常量是否有意义？****6.** 写一个程序，使用以下公式计算月供：`payment\
  \ = (rate / (1 + rate)^months – 1 ) * amount`，其中 `rate` 是年利率除以 `12`（即 `.005`），且脱字符表示“……的次方”。\n\
  \n\n\n\n用户输入到程序文本框（textbox）对象中的数据是文本数据。然而，如果你想对用户的输入进行处理，必须先使用数据类型的 `TryParse()`\
  \ 方法将文本数据转换为数值数据。例如，如果你想将 `txtOperand1` 文本框对象的内容转换为 `int` 数据类型，可以使用以下语句：\n\n```\n\
  \ flag = int.TryParse(txtOperand1.Text, out val);\n```\n\n该语句将输入到 `txtOperand1`\
  \ 文本框对象中的文本数据转换为 `int` 数据类型，并将整数结果存储在变量 `val` 中。你可能没有意识到的是，文本框对象的 `Text` 属性实际上是一个字符串变量。`TryParse()`\
  \ 方法的作用是将字符串数据转换为数值数据类型。\n\n在本章中，你将学习到字符串变量只是内存中存储文本数据的地方。根据一般原则，文本数据并不是为了进行数学运算的。相反，你希望通过将数据存储在字符串变量中来将其保持为文本格式。使用文本数据来存储名称、地址、电话号码、邮政编码、客户\
  \ ID 等是非常常见的。某些文本数据实际上是纯数字，例如邮政编码。你如何决定何时将内容存储为字符串，何时存储为数值数据类型？规则很简单：如果你不打算以某种数学方式处理这些数据，就将数据存储为字符串。\n\
  \n## 定义字符串引用变量\n\n假设你想在程序中存储名称 \"Hailey\"。在文本序列周围加上双引号会将引号之间的所有内容标记为 `string literal`（字符串字面量）。换句话说，你是“字面上”想将\
  \ \"Hailey\" 这个词赋值给 `name` 变量。围绕字符串字面量的双引号并不是字面量的一部分。引号的作用只是告诉 Visual Studio 文本数据的起点和终。\n\
  \n你可以使用以下两行代码将字符串字面量 \"Hailey\" 赋值给 `name`：\n\n```\n string name;\nname = \"Hailey\"\
  ;\n```\n\nIntelliSense 解析这两行代码中的每一行并发现语法正确。没有出现可怕的波浪线。到目前为止良好。现在考虑 Visual Studio\
  \ 对第一条语句正在执行的细节。由于第一行没有语法错误，Visual Studio 将按照第 4 章中讨论的方式检查符号表。表 5.1 显示了一个类似于你在第\
  \ 4 章看到的简化符号表。\n\n表 5.1 简化符号表\n\n![image](img/c05tnt001.jpg)\n\n由于变量名不在符号表中，Visual\
  \ Studio 向 Windows 发送消息，请求足够的内存用于引用变量。所有的 `reference variables` 使用相同的存储空间：4 字节。只要\
  \ Windows 内存管理器找到 4 字节空闲内存，Windows 就会返回引用变量名的内存地址。你可以假设 `name` 的内存地址是 670000。Visual\
  \ Studio 在符号表中条目，如表 5.2 添加了引用变量的符号表\n\n![image](img/c05tnt002.jpg)\n\n利用你在第 4 章学习的图表，你可以显示\
  \ `name` 的左值（lvalue）和右值（rvalue），如图 5.1 新的左值和右值\n\n![image](img/c05f001.jpg)\n\n\
  图 5.1 显示了 `name` 引用变量当前状态的内存映射。\n\n图 5.2 字符串变量的内存映射\n\n![image](img/c05f002.jpg)\n\
  \n利用第 4 章的桶类比（Bucket Analogy），你可以口头描述 `name` 引用变量的当前状态。（9781118416471c05.xhtml_c05-fig-0002）：\n\
  \n```\nname = \"Hailey\";\n```\n\n\n\n\n导致 `Visual Studio` 向 Windows 发送第二个 `second`\
  \ 消息。从本质上，这条消息是：“嘿，Windows！我是 Visual Studio……又来了。我需要 12 字节空闲内存来存储一些数据。你能帮帮我吗？”请注意，`Visual\
  \ Studio` 除了存储所需的字节数外，没有对数据的性质说明任何内容。在第 3 节讨论值类型时，你假设 Windows 知道与各种值类型相关联的字节数是多少。而对于引用类型，`Visual\
  \ Studio` 无法假设 Windows 知道所需字节数的数量，因为存储需求可能很短（“Hailey”），也可能很长（《独立宣言》）。\n\n假设系统中某些可用空闲内存，`Windows\
  \ Memory Manager` 会回一条消息：“嘿，Visual Studio！我找到了你需要的存储空间，从内存地址 `725,000` 开始。现在让我静静一会儿吧……我很忙。”内存管理器偶尔会变得得不耐烦，因为也有其他程序在提出类似的请求。毕竟，在你运行\
  \ `Visual Studio` 的同时，可能还有其他程序在运行。由于你刚刚向它要过一个存储 `name` 的地方，所以它并不高兴这么快就又听到你关于这个 12\
  \ 字节存储请求的请求。（不用担心……内存管理器会过去的。）\n\n当 Windows 将内存地址 `725,000` 返回给 `Visual Studio`\
  \ 时，`Visual Studio` 立即获取名称 \"Hailey\" 并将其移动到从地址 `725,000` 开始的内存中。`name` 的内存映射状态现在如\
  \ 图 5.3 所示。\n\n图 5.3 字符串赋值后的内存映射\n\n![image](img/c05f003.jpg)\n\n## 引用变量规则\n\n比较\
  \ 图 5.2 和 5.3。首先，注意 `name` 的 `rvalue` 如何从之前的值 `null` 变为变为存储数据的内存地址。其次，你可以看到从内存位置\
  \ `725,000` 开始的 12 字节现在持有字符串字面量 \"Hailey\"。这些观察说明了关于引用变量的以下规则：\n\n*   引用变量的 `rvalue`\
  \ 只有两个值之一：`null` 或内存地址。\n*   如果引用变量的 `rvalue` 为 `null`，则该引用变量不包含任何有用数据。\n*   如果引用变量的\
  \ `rvalue` 不是 `null`，它包含存储与引用变量关联的数据的内存地址。\n\n第一条规则确认了关于引用变量的几点。首先，与值类型不同（值类型的 `rvalue`\
  \ 存存着你感兴趣的数据），引用变量并不持有你想在程序中使用的实际数据。其次，由于引用的 `rvalue` 只能持有 `null` 或内存地址，因此在 32 位系统中，引用变量的大小*始终*是\
  \ 4 字节。这意味着无论与它可能关联的实际数据是什么，引用变量桶（bucket）的大小始终是相同的——4 字节。当你下次在聚会上谈到这个话题时，你可以这样说显得很聪明：“引用变量的状态要么是\
  \ `null`，要么是一个有效的内存地址。”\n\n第二条规则影响了 `IntelliSense` 强制执行引用变量的 C# 语句语法的方式。如果你尝试对 `rvalue`\
  \ 为 `null` 的引用变量执行某种类型的字符串操作，`IntelliSense` 会报错并发出错误信息。例如，如果你在 `name` 包含 `null`\
  \ `rvalue` 时尝试将其传递给方法，`IntelliSense` 会说类似如下的内容：\n\n```\n 使用未赋值的本地变量 'name'\n```\n\
  \n`IntelliSense` 这样做是因为它知道 `null` `rvalue` 意味着程序没有与变量关联的有用数据。\n\n第三条规则是最重要的。如果引用变量包含非空值，该值就是存储实际数据的内存地址。事实上，这就是为什么它们被称为引用变量。引用变量的\
  \ `non-null rvalue` 将你指向存储数据的内存位置。\n\n## 引用类型变量对比值类型变量\n\n考虑“桶类比”与两种类型变量相关的解释。对于值类型变量，你向桶中看去，并立即在变量的\
  \ `rvalue` 中找到你感兴趣存储的数据。此外，对于值类型，桶的大小根据桶中存储的数据类型而变化。也就是说，`int` 数据类型的桶的大小是 4 字节，而\
  \ `decimal` 数据类型的桶的大小是 16 字节。因此，你对值类型桶的大小感兴趣，因为它给了你关于那里存储了什么类型数据的线索。\n\n对于引用类型变量，你向桶中看去，发现的是\
  \ `null` 或内存地址。如果你在桶中发现 `null`，则该变量不包含内容。相反，如果你在桶中看到 `null` 以外的内容，你必须跳转到内存地址来查看数据。\n\
  \n结论很简单：值类型的 `rvalue` *本身就是*数据。引用类型的 `rvalue` 要么指向数据，要么不引用数据（`null`）。\n\n## 为什么引用变量是这样工作的？\n\
  \n为什么 C# 的设计者让引用变量这样工作？考虑值类型的工作方式。假设你写了一个平方用户输入的数字的方法。在你将用户输入转换为值类型（例如 `int`）后，现在你想将该值传递给你编写的\
  \ `SquareIt()` 方法。`SquareIt()` 方法的目的是获取该值、平方并返回给调用者。为了实现，Visual Studio 创建了该值的*临时副本*，调用你的方法，并告诉它该副本的位置。由于\
  \ `int` 只使用 4 字节存储，因此创建 `int` 副本的过程很快，不会消耗过多内存。\n\n现在假设你的程序有一个字符串变量，指向书籍的三个章节。（可能是你从磁盘文件读取数据到程序中的。）这意味着字符串变量可能指向一个包含几十万字节的内存块。现在假设你写了一个方法，其目的是在这些几十万个字节中搜索特定单词。如果方法调用像值类型那样工作，Visual\
  \ Studio 必须将这几十万个字节拷贝到临时内存位置。拷贝几十万个字节有两个缺点：首先，相对于仅拷贝几个字节的值类型，这相当慢；其次，章节的临时副本将占用另一个巨大的内存块，可能导致程序耗尽内存。\n\
  \n\n\n坏消息是，使用引用变量的方法可以直接访问数据。回想一下，使用值类型的方法接收的是变量值的 `copy`（拷贝），而不是变量本身的左值（lvalue）。这意味着该方法无法永久地更改用户的值。对于值类型，内存中有两个“桶”：原始桶和包含副本的桶。方法可以修改副本的右值（rvalue），但不知道原始桶存储在何处。因此，这种“按值传递（`pass\
  \ by value`）”向方法发送数据的方法保护了原始数据，因为方法只能看到数据的副本。\n\n使用引用变量时，你发送的是存储数据的实际内存位置。传递实际内存位置被称为“按引用传递（`pass\
  \ by reference`）”。这意味着方法可以直接访问原始数据，而不是它的副本。这也意味着，如果方法需要，它可以永久地影响与引用变量关联的数据。\n\n\
  老话说得：“天下没有免费的午餐”，这也适用于编程。在编写方法时，你可以使用引用变量来提高性能并节省内存。然而，你付出的代价是让数据暴露在可能被污染的风险，因为方法可以直接访问它。这有点就像一个中世纪的国王，花时间把女儿藏在城堡塔里，但转头就把房间的钥匙发给了王国里的每一位骑士……这可能不是个好主意。同样，如果你告诉所有人数据藏在哪里，那么费力去隐藏数据也就意义不大了。第\
  \ 10 章将重新审视这些（封装）问题，并提供处理它们的方法。\n\n## 一些小的效率提升\n\n正如之前讨论的，以下语句会导致 Visual Studio\
  \ 向 Windows 内存管理器发送 `two`（两个）内存请求：\n\n```\nstring name;\nname = \"Hailey\";\n```\n\
  \n第一个请求是为 `name` 寻找存储空间，第二个是为 `\"Hailey\"` 寻找存储空间。任何可以减少 Windows 和 Visual Studio\
  \ 之间发送消息数量的方法可能都是好事。这是因为 Visual Studio 和 Windows 之间的消息交换需要时间。你可以通过将这两个语句合并为一条来完成相同的操作并节省一些时间：\n\
  \n```\n string name = \"Hailey\";\n```\n\n在这种情况下，只需要向 Windows 内存管理器发送一条消息。该消息可以表述为：“Windows……醒醒！我需要一个能够存储\
  \ 12 字节数据的引用变量。”Windows 知道引用变量需要 `4` 字节的存储空间。假设它返回如 图 5.3 所示的信息，返回的消息可能是：“嘿，Visual\
  \ Studio！我已将你的引用变量存储在内存地址 `670,000` ，并将其右值设置为 `725,000`。不客气。”随后，Visual Studio 继续从内存地址\
  \ `725,000` 开始存储 `\"Hailey\"`（请参考 图 5.3）。\n\n无论你使用单行还是双行版本来分配字符串字面量，最终结果都是完全相同的。然而，单行版本通过少向\
  \ Windows 发送一条消息完成了相同的任务。诚然，减少一条 Windows 消息对性能的影响可能并不大。但是，如果你的程序重复发送数千次消息，用户可能会注意到这种差异。显然，哪种方法都能正常工作。不过，你可能会看到经验程序员更多地使用第二种形式。如果你确实看到了较短的版本，很可能是程序速度与此无关。程序员可能选择它仅仅是因为它需要的打字次数更少！\n\
  \n# 使用字符串变量\n\n字符串变量是引用变量，允许你存储和操作文本数据。尽管大多数人将计算机与数字计算联系起来，但计算机完成的大部分工作涉及文本数据的操作，而不是数字。事实上，数据库程序经常处理大量的文本数据，其数据量往往超过了数值数据。\n\
  \n## 字符串拼接\n\n你在早期的程序中使用过字符串拼接，但对此没有做太多阐述。简单来说，`string concatenation`（字符串拼接）是将一个字符串并到另一个字符串上，以形成一个新字符串的过程，例如：\n\
  \n```\nstring name = \"Hailey\" ;\nname = name + \" Mohr\";\n```\n\n在前面的语句中，`name`\
  \ 被赋值为 `\"Hailey\"`，如之前解释的。第二行拼接了字符串字面量 `\" Mohr\"`（`Moh` 之前有一个空格）形成新字符串 `\"Hailey\
  \ Mohr\"`。然后将这个新字符串赋值给 `name`。如你所见，字符串拼接无非是将一个字符串叠加到另一个字符串上。在这个例子中，字符串拼接将姓和名合并成了一个全名。\n\
  \n## 简写赋值运算符\n\n获取一个值并对其加上第二个值是编程中非常常见的任务，因此 C# 为基础数学运算符和字符串拼接运算符提供了许多简写赋值运算符。例如，假设变量\
  \ `name` 目前如你刚刚看到的，持有字符串 `\"Hailey\"`。你可以获取之前显示的的那行原始代码：\n\n```\nname = name + \"\
  \ Mohr\";\n```\n\n并使用简写拼接运算符将其重写为：\n\n```\nname += \" Mohr\";\n```\n\n结果与之前完全一样：`\"\
  Hailey Mohr\"`。在语句中\n\n```\nint i = 10;\ni += 5;\n```\n\n`i` 的值现在是 `15`。因此，`+=`\
  \ 运算符具有双重作用：在使用字符串变量时执行字符串拼接，在使用值类型时用于加法。表 5.3 展示了简写运算符列表。\n\n| **运算符** | **示例**\
  \ | **解释** |\n| :--- | :--- | :--- |\n| `+=` | `val += days;` | `val = val + days;`\
  \ |\n| `-=` | `val -= days;` | `val = val - days;` |\n| `*=` | `val *= days;` |\
  \ `val = val * days;` |\n| `/=` | `val /= days;` | `val = val / days;` |\n| `%=`\
  \ | `val %= days;` | `val = val % days;` |\n\n在表 5.3 所示的运算符中，只有拼接运算符 `+` 在处理字符串数据时是有意义的。然而，所有的运算符都可以用于值类型。显然，简写运算符并没有给你提供原本没有的东西。但是，程序员通常不想多写，所以丰富的\
  \ C# 程序员经常使用这些运算符。\n\n## 字符串操作\n\n你已经知道字符串是一种引用类型。你也知道引用类型和值类型是不同的。值类型变量的右值是变量的值。对于引用类型变量，右值要么是\
  \ null，要么是数据所在的内存地址。C# 中的所有引用类型都像对象一样运行。因此，引用类型像文本框、标签、按钮等拥有属性和方法。本节介绍了字符串类中一些常用的属性和方法。\n\
  \n### 字符串长度\n\n处理字符串数据时常见的任务之一是验证字符串是否包含正确的数据。例如，如果你要求用户输入邮编，你可能想验证用户是否在收集邮编字符串的文本框对象中输入了五个字符。（是的，我知道有\
  \ 9 位邮编，但请先忽略它。）例如，假设你编写了一个使用 `txtZipCode` 从用户那里收集邮编的程序。你的下一个任务可能是判断用户是否在文本框中输入了五个字符。字符串类提供的属性之一是\
  \ `Length` 属性：\n\n```\nint length;\nstring zip = \"45245\";\nlength = zip.Length;\n\
  ```\n\n\n\n在上面的代码段中，`zip` 被赋值为字面量值 \"45245\"。然后，整数变量 `length` 被赋值为 `zip` 字符串对象的\
  \ `Length` 属性的值。在示例中，`zip.Length` 属性的值为 5。因此，在最后一行赋值语句之后，`length` 变量的右值（rvalue）为\
  \ 5。\n\n### 让 IntelliSense 显示属性和方法\n\n你可能会问：“`string` 类中还有其他属性或方法吗？”是的的，有很多。每当你想要查找某个对象（字符串或其他类型）的属性或方法时，让\
  \ IntelliSense 为你提供列表即可。例如，图 5.4 定义了一个名为 `temp` 的字符串变量。几行之后，你想找出可能可以使用哪个属性来确定字符串的长度。要实现这一点，输入字符串的名称并在后面加上点运算符（.）。IntelliSense\
  \ 立即会向你显示一个包含当前对象所有属性和方法的列表框，在本例中是一个名为 `temp` 的字符串对象。（参考图 5.4）。\n\n![图 5.4 使用 IntelliSense\
  \ 查找字符串属性]\n\n如果你仔细观察图 5.4（或者最好自己写一些测试代码），你可以在列表框中看到 `Length` 属性。如果你视力好，你会发现列表框中\
  \ `Length` 单词左侧的图标是一个指向代码页的手。手图标表示对象属性。如果你查看列表框的右侧，可以看到 IntelliSense 还为你提供了一个简要描述：\n\
  \n```\nint string.Length Gets the current number of characters in the String object.\n\
  ```\n\n第一行的第一个单词 `int` 告诉 `string.Length` 是 `int` 数据类型（这就是为什么在前面的代码中将 `length` 定义为\
  \ `int` 数据类型）。第二行仅提供了关于该属性（或方法）的简要描述。最后，如果你查看图 5.4 所示列表框中的最后一项，你会看到 `Remove` 旁边有一个紫色的\
  \ 3D 盒子。因为 `Remove` 旁边有一个 3D 盒子图标，所以是一个方法。如果你从列表中选择了 `Remove`，屏幕将显示类似于图 5.5 的内容。\n\
  \n![图 5.5 使用 IntelliSense 查找字符串方法]\n\n注意，来自 IntelliSense 的消息性质发生了变化。它现在显示为：\n\n\
  ```\nstring string.Remove(int startIndex) (+1 overload)\n```\n\n第一个单词 `string` 表示该方法返回一个字符串数据类型。`.Remove(int\
  \ startIndex)` 表示 `Remove()` 方法是字符串类的一部分，并且它期望提供一个整数值（关于如何使用 `Remove()` 的完整示例将在稍后的“试一试”部分“使用字符串类属性和方法”中给出）。最后，`(+1\
  \ overload)` 表示该方法有多种“重载形式”。你现在还没有准备讨论它的含义，但你将在稍后的“重载方法”章节中讨论。\n\n### 使用 IntelliSense\
  \ 选项\n\n如果你不能使用列表框，IntelliSense 就不会在列表框中为你展示所有选项。例如，图 5.4 显示了高亮的 `Length` 属性。如果你现在按下\
  \ `Tab` 键，IntelliSense 会自动在你的源代码中填充 `Length` 一词。你也可以对对象方法使用相同的技术。坏消息是，如果你选择的是方法而不是属性，IntelliSense\
  \ 不会自动为方法提供括号。你必须输入输入。\n\n### 属性和方法之间的重要区别\n\n属性是与对象关联的变量。因此，它们的名称后面不需要括号。相反，所有方法在方法名后面必须有括号。违反这些规则会触发\
  \ IntelliSense 的一个讨厌的波浪线警告。\n\n### 思考对象属性和方法\n\n你刚刚看到 `string` 数据类型为你提供了许多可选的属性和方法。你必须将字符串数据视为一个对象。结合第\
  \ 2 章的讨论，字符串变量实际上是一个对象，你可以使用点运算符打开它。点运算符随后使该对象的属性和方法对你可用。这可以极大地简化引用类型数据的使用，因为 Visual\
  \ Studio 已经为你写好了许多属性和方法。\n\n当你看到 IntelliSense 打开一个列出该对象属性和方法的列表框时，花一点时间浏览列表，高亮每个属性和方法。当你高亮列表框中的每个选项时，IntelliSense\
  \ 会向你提供关于该属性或方法用途的简要描述。在这个过程中，你可能会发现你需要完成的任务已经处理好了。\n\n### 试一试：字符串方法\n\n要创建该程序，请使用以下步骤：\n\
  1. 使用列表 2-1 所示的步骤创建一个新项目。\n2. 使用表 5.4 所示的名称添加标签和文本框对象（表格组织方式是文本框名称从上到下、从左到右排列）。\n\
  3. 还要为 Test（测试）和 Close（关闭）添加两个按钮对象。\n4. 下载 Chapter05StringMethods 文件夹中的代码并将其复制到当前项目。\n\
  \n**表 5.4 程序对象及其描述**\n\n| **文本框名称** | **描述** |\n| :--- | :--- |\n| `txtInput` |\
  \ 要使用的文本数据。 |\n| `txtLength` | 输入数据的长度。 |\n| `txtToUpper` | 将数据转换为大写的结果。 |\n| `txtToLower`\
  \ | 将数据转换为小写的结果。 |\n| `txtSearchChar` | 数据中要搜索的字符。 |\n| `txtSearchIndex` | 找到字符的位置。\
  \ |\n| `txtLastChar` | 查找此字母最后一次出现的位置。 |\n| `txtLastIndexOf` | 最后一次出现的位置。 |\n| `txtStartIndex`\
  \ | 从字符串中的此位置开始。 |\n| `txtEndIndex` | 从字符串中复制多少字符。 |\n| `txtSubstringResult` | 复制的子字符串。\
  \ |\n| `txtRemove` | 要从字符串中删除的文本。 |\n| `txtRemoveResult` | 删除文本后的字符串。 |\n\n\n\n\n\
  如果你需要，可以重新排列文本框的顺序。因为此程序使用了许多字符串方法，随后的“工作原理”部分比大多数部分都要长。然而，理解字符串数据类型的工作原理至关重要。\n\
  \n## 工作原理\n\n你可以从图 5.6 中看到，程序要求用户在顶部文本框(`txtInput`) 中输入一行文本。输入文本后，用户点击“测试”（Test）按钮来练习\
  \ Visual Studio 提供的许多字符串方法之一。Test 按钮点击事件的代码如列表 5-1 所示。图 5.6 中显示的每项功能将在接下来的章节中解释。\n\
  \n### 列表 5-1: btnTest 点击事件代码 (frmMain.cs)\n\n```cpp\n private void btnTest_Click(object\
  \ sender, EventArgs e)\n  {\n    bool flag;\n    int index;\n    int start;\n  \
  \  int howMany;\n    string temp;\n\n    lblIndexOf.Text = \"\";\n    // Find 长度\n\
  \    txtLength.Text = txtInput.Text.Length.ToString();\n    // 转换大小写\n    txtToUpper.Text\
  \ = txtInput.Text.ToUpper();\n    txtToLower.Text = txtInput.Text.ToLower();\n\n\
  \    // 索引\n    index = txtInput.Text.IndexOf(txtSearchChar.Text, 0);\n    lblIndexOf.Text\
  \ = \"txtInput.Text.IndexOf(\\\"\" + txtSearchChar.Text +\n                  \"\\\
  \",0) = \";\n    txtSearchIndex.Text = index.ToString();\n\n    // 最后索引\n    index\
  \ = txtInput.Text.LastIndexOf(txtLastChar.Text);\n    lblLastIndexOf.Text = \"txtInput.Text.LastIndexOf(\\\
  \"\" + txtLastChar.Text + \"\\\")\n                          = \";\n    txtLastIndexOf.Text\
  \ = index.ToString();\n\n    // 子字符串\n    flag = int.TryParse(txtStartIndex.Text,\
  \ out start);\n    if (flag == false)\n    {\n      MessageBox.Show(\"数字输入无效。请重新输入.\"\
  );\n      txtStartIndex.Focus();\n      return;\n    }\n    flag = int.TryParse(txtEndIndex.Text,\
  \ out howMany);\n    if (flag == false)\n    {\n      MessageBox.Show(\"数字输入无效。请重新输入.\"\
  );\n      txtEndIndex.Focus();\n      return;\n    }\n    lblSubstring.Text = \"\
  txtInput.Text.Substring(\" +      start.ToString() + \", \" +\n                \
  \         howMany.ToString()+ \") = \";\n    txtSubstringResult.Text = txtInput.Text.Substring(start,\
  \ howMany);\n\n    // 删除\n    temp = txtInput.Text;\n    index = temp.IndexOf(txtRemove.Text);\n\
  \    if (index > 0)\n    {\n      txtRemoveResult.Text = temp.Remove(index, txtRemove.Text.Length);\n\
  \    }\n    // 替换\n    temp = txtInput.Text;\n    txtReplaceResult.Text = temp.Replace(txtReplaceChars.Text,\
  \ txtReplaceWith.Text);\n  }\n```\n\n对于图 5.6 所示的示例测试运行，你可以输入以下字符串：\n\n```\n This\
  \ is a test of various string METHODS, 1234567890 and z\n```\n\n在接下来的章节中，将根据所讨论的方法或属性重复特定的代码行。\n\
  \n## 字符串的长度：Length\n\n`Length` 属性存储字符串的字符数。此计数包含了字符串中的所有内容，包括空格、标点符号和数字字符。列表 5-1\
  \ 中显示的 `Length` 属性的代码为：\n\n```cpp\n // Find 长度\n    txtLength.Text = txtInput.Text.Length.ToString();\n\
  ```\n\n你可能会说：“等一下！为什么语句中会有这么多点运算符？”问得好。现在先拆分表达式的右侧。假设你在 Visual Studio 的源窗口中输入以下内容：\n\
  \n```cpp\n txtLength.Text = txtInput.\n```\n\n在第 2 章中你学习了点运算符用于分隔对象（本例中的 `txtInput`\
  \ 文本框对象）与该对象可用的属性和方法。换句话说，点运算符“打开”对象的箱子，让你访问该对象的属性和方法。（参见第 2 章中的图 2.7）。一旦你在 `txtInput`\
  \ 文本框对象的名称后输入句号，Visual Studio 就会显示列表，如图 5.7 所示。\n\n图 5.7: 点运算符\n\n```cpp\n txtLength.Text\
  \ = txtInput.\n```\n\n等等，让我们仔细处理提供的文本。源文本末尾包含一些混乱/重复的句子（例如“方法的列表...200...”）。\n\n\
  *基于用户文本的修正：* 用户提供的文本在后半部分有一些伪影/重复错误。我将在遵循规则的同时保持提供文本的结构。因此，由于 `Length` 是一个可以视为对象的\
  \ `int` 类型，当你需要时添加另一个点运算符以查看可用内容：\n\n```cpp\n txtLength.Text = txtInput.Text.\n\
  ```\n\n图 5.8: 属性和方法\n\n```cpp\n txtLength.Text = txtInput.Text.Length\n\n现在你有一个问题。字符串的长度存储为\
  \ `int` 类型。问题在于你想将一个数字值 (`txtInput.Text.Length`) 赋值给文本属性 (`txtLength.Text`)。坏消息是你在赋值运算符的一侧有一个苹果，另一侧有一个橙子。好消息是，当需要时，C#\
  \ 可以值类型视为对象——就像现在这样。（参见“包装器”侧边栏。）因此，由于 `Length` 是一个可以视为对象的 `int` 类型，当你必要时向表达式添加另一个点运算符：\n\
  \n```cpp\n txtLength.Text = txtInput.Text.Length.\n```\n\nVisual Studio 立即感觉到你想将\
  \ `Length` 视为对象，因此向你展示与值类型相关的属性和方法。值类型的方法列表如图 5.9 所示。\n\n图 5.9: 值类型的方法列表\n\n如图 5.9\
  \ 所示，Visual Studio 只为值类型提供了六种方法。然而，六六方法之一是 `ToString()`，这正是你需要的。你现在完成语句：\n\n```cpp\n\
  \ txtLength.Text = txtInput.Text.Length.ToString();\n```\n\n\n\n现在你的问题消失了。在赋值运算符的左侧你有一个字符串数据类型属性（`Text`），右侧是一个字符串数据类型，这是因为你使用了\
  \ `ToString()` 方法将 `Length` 的整数值转换成了字符串。搞定！你现在可以在 `txtLength` 文本框对象中正确地看到输入字符串的长度了。（参考图\
  \ 5.6。）这段相当冗长的解释可能看起来像是用原子弹杀蚂蚁，但你必须理解，一个对象（例如文本框）内部可以存储另一个对象（例如字符串）作为属性。此外，该字符串对象（`Text`）也可以拥有一个属性（例如\
  \ `Length`），该属性也可以被视为一个对象。如果需要，所有值类型都具有图 5.9 所示的六个方法可用。在本示例中，你需要使用 `Length` 属性的\
  \ `ToString()` 方法，以便将 `Length` 的整数值转换为字符串并显示在 `txtLength` 文本框中。\n\n***\n\n**数据包装器**\n\
  在非 OOP 语言中，值类型和引用类型面临着传统的“油水不容”问题……它们互不兼容。相反，C# 从一开始就被设计为一种面向对象的编程语言。因此，设计者知道，总会有某些时候程序员希望将值类型数据像对象一样对待。出于这个原因，C#\
  \ 有一个封装了值类型的包装类。（你已经在第 3 章中读过关于包装类的某些信息）。虽然这有点简化，但你可以将值类型包装类理解为拥有一个属性（它的值）和六个方法（参见图\
  \ 5.9）。在这六个方法中，`ToString()` 方法使用最频繁，它允许你将数据类型的值转换为字符串。\n\n***\n\n### **更改字符串的大小：`ToUpper()`\
  \ 和 `ToLower()`**\n\n有时，如果文本数据的大小完全相同，某些任务就可以简化。例如，一个人可能将她的姓氏写为“Van d'Camp”，而另一个人则写为“van\
  \ d'Camp”。如果你正在搜索一个包含人名的字符串列表，你可能会错过你正在寻找的人，因为你输入名称的大小与用户使用的并不完全相同。为了避免这类问题，你可以将字符串更改为统一的大小，并在搜索过程中使用该种大小。以下语句将图\
  \ 5.6 所示的输入字符串使用 `ToUpper()` 方法更改为全大写字母：\n\n```\ntxtToUpper.Text = txtInput.Text.ToUpper();\n\
  txtToLower.Text = txtInput.Text.ToLower();\n```\n\n结果变化显示在各自的文本框对象中。第二条语句将字符串转换为全小写字母。上述赋值语句的右侧可以口述为：“找到\
  \ `txtInput` 文本框对象，定位它的 `Text` 属性，由于它是一个字符串变量，使用它的 `ToUpper()` 或 `ToLower()` 方法将\
  \ `Text` 属性分别改为大写或小写。”你可以通过滚动图 5.8 所示的列表框找到这两个方法。\n\n### **查找特定字符：`IndexOf()`**\n\
  \n假设你想在字符串中找到一个特定的字符。在图 5.6 中，你输入了字符 `v` 并使用 `IndexOf()` 方法找到该字符的首次出现。同一行的下一个文本框（`txtSearchIndex`）显示了数字\
  \ 18。这意味着 `IndexOf()` 方法在字符串的索引号 18 处找到了字母 `v`。如果你数到 `v` 之前的字母和空格数量，你会发现 `v` 是第\
  \ 19 个字符。怎么的？值为 19 的原因是编程语言在对字符串中的字符计数时，将第一个位置引用为位置零，而不是位置一。如果你从零开始计算字符和空格，你会发现\
  \ `v` 确实位于位置 18。程序员使用 *index*（索引）一词来指代字符在字符串中基于零的位置。完成搜索的代码位于以下语句中：\n\n```\n// Index\
  \ of \nindex = txtInput.Text.IndexOf(txtSearchChar.Text, 0);\nlblIndexOf.Text =\
  \ \"txtInput.Text.IndexOf(\\\"\" + txtSearchChar.Text + \"\\\",0) = \";\ntxtSearchIndex.Text\
  \ = index.ToString();\n```\n\n现在查看第一条语句。赋值运算符的右侧说：“获取 `txtInput` 文本框对象的 `Text` 属性，并使用\
  \ `Text` 的名为 `IndexOf()` 的方法。”不幸的是，如果没有两个额外信息，`IndexOf()` 无法工作。首先，`IndexOf()` 需要知道你想查找的什么字符。你想查找的字符就是你通过\
  \ `txtSearchChar.Text` 属性在图 5.6 中输入的 `v`。其次，`IndexOf()` 需要知道从哪里开始搜索。在你的情况下，你希望搜索从字符串开始开始，所以你使用了索引零。这两个信息被称为参数（arguments）。简单来说，方法参数是你传递给方法的信息，以便方法执行其任务。方法参数可以是变量的形式（如\
  \ `txtSearchChar.Text`），也可以是字面量（如零）（实际上，`IndexOf()` 方法有两种“口味”。本章稍后的“重载方法”部分将解释它是如何工作的）。在你为\
  \ `IndexOf()` 输入了正确的参数后，程序会将控制权转移到 `IndexOf()` 方法的程序代码。简单来说，`IndexOf()` 代码开始检查自己（毕竟\
  \ `IndexOf()` 是 `Text` 属性的一部分，所以它知道字符串是什么），从你传递给它的索引开始。因为你向 `IndexOf()` 方法传递了零，它从字符串的第一个字符开始搜索，即位置零。代码检查第一个字符并与你传递给它的字符\
  \ `v` 进行比较。由于没有匹配，它查看第二个位置。它继续这个过程直到找到匹配，它在位置 18 找到了匹配。好了……现在呢？`IndexOf()` 方法成功在索引\
  \ 18 找到了匹配，但它需要一种方式将该信息传回调用 `IndexOf()` 方法的程序点。将值 18 传回需要的地方的技术细节将在第 10 章介绍，目前，只需将赋值表达式的右侧\n\
  \n```\nindex = txtInput.Text.IndexOf(txtSearchChar.Text, 0);\n```\n\n替换为：\n\n```\n\
  index = 18;\n```\n\n使用 `txtInput` 对象的目的是获取 `Text` 属性，以便你可以使用它的 `IndexOf()` 方法定位特定字符。由于对象（`txtInput`）及其属性（`Text`）和方法（`IndexOf()`）都完成了它们的工作，代码可以确定\
  \ `v` 字符在字符串中的精确位置。在正式语言中，你会说：“`IndexOf()` 方法返回整数值 18。”当语句完成后，变量 `index` 现在被赋值了右值\
  \ 18。\n\n### **“调用”方法**\n\n\n\n\n\n你在第 3 章中读过关于调用方法的内容，但在这里值得重复一下，不过写法略有不同。当使用方法来解析表达式时，通常将赋值语句左侧的变量称为\
  \ `caller`（调用者）。也就是说，`index` 正在调用（或称“调用”）`IndexOf()` 方法，以便其能够将一个适当的位置值赋值给自身。同样，你经常会听到诸如“IndexOf()\
  \ 将值 18 返回给 `caller`”之类的说法。这种解释是：由 `IndexOf()` 方法确定的值被赋值给 `caller`——在本例中为 `index`。如果字符串不包含你正在查找的字符会怎样？在这种情况下，`IndexOf()`向\
  \ `caller` 返回值 `-1`。如果 `IndexOf()` 返回负值，你就知道搜索失败了。还有一点：虽然这里展示的示例说明 `IndexOf()` 是在搜索单个字符，但\
  \ `IndexOf()` 的第一个参数也可以是一个包含多个字符的字符串。在这种情况下，`IndexOf()` 返回字符串中出现匹配项的第一个字符的索引。如果\
  \ `IndexOf()` 无法为传递的字符串序列找到精确匹配，它将返回 `-1`。\n\n### 查找字符最后一次出现：LastIndexOf()\n\n`IndexOf()`\
  \ 方法允许你搜索字符串中特定字符的首次出现。现在假设该字符出现了六次，但你对最后一次的位置感兴趣。你可以调用 `IndexOf()` 五次，让该方法为每个（不想要的）位置返回一个索引。也就是说，你随后可以再次调用\
  \ `IndexOf()`，将索引加 1 作为方法调用的第二个参数。（思考一下这意味着什么）。然而，使用 `LastIndexOf()` 字符串方法会更有效。`LastIndexOf()`\
  \ 方法的代码如下：\n\n```\nindex = txtInput.Text.LastIndexOf(txtLastChar.Text);\nlblLastIndexOf.Text\
  \ = \"txtInput.Text.LastIndexOf(\\\"\" +\n                      txtLastChar.Text\
  \ + \"\\\")\n                      = \";\ntxtLastIndexOf.Text = index.ToString();\n\
  ```\n\n`LastIndexOf()` 只有一个参数，即你正在查找的字符。它不需要用于搜索起始位置的第二个参数，因为 `LastIndexOf()` 会自动从字符串末尾开始搜索，向开头反向搜索。如果搜索成功，该方法返回字符的索引（从\
  \ 0 开始计数）；如果未找到匹配项，则返回 `-1`。剩余的两行代码的含义与 `IndexOf()` 代码片段几乎相同。（请参考 [图 5.6] 以查看标签的内容。）\n\
  \n### 查找子字符串\n\n如果你曾经用过文字处理器并在文档中搜索特定单词，那么很有可能该文字处理器正在使用类似于 `Substring()` 方法的方法来复制字符串中指定位置出现的子字符串。这里显示了使用\
  \ `Substring()` 方法的代码：\n\n```\nlblSubstring.Text = \"txtInput.Text.Substring(\"\
  \ +\n                     start.ToString() + \", \" +\n                     howMany.ToString()+\
  \ \") = \";\ntxtSubstringResult.Text = txtInput.Text.Substring(start, howMany);\n\
  ```\n\n你已经知道如何使用 `TryParse()` 方法调用了。只需说明，在 [代码列表 5-1] 中的两次 `TryParse()` 方法调用仅仅是将用户在两个文本框（textbox）对象中输入的数字字符转换为名为\
  \ `start` 和 `howMany` 的整数型变量。在 [图 5.6] 中，`start` 位置被设置为第 18 位（`start = 18`）。再次，由于字符串位置始终从位置\
  \ 0 开始引用，因此你实际上将从字符串中的第 19 个字符开始子字符串。如果你在字符串中数出 19 个字符（包括空格和标点符号），你会发现它是第 19 个字符。如果\
  \ `IndexOf()` 无法为传递给它的字符串序列找到精确匹配，它将返回 `-1`（此处更正：原文逻辑略有跳跃，此处遵循原文意译：如果 `IndexOf()`\
  \ 无法为传递的字符串序列找到精确匹配，它将返回 `-1`）。*注：此处原文逻辑为“你发现第 19 个字符是 `various` 单词中的 `v`。* 这里的中`第\
  \ 19 个字符（ ` ` `点符号 ` ` ` ` ````` `v`。`howMany` 变量告诉 `Substring()` 方法要复制多少字符，从 `start`\
  \ 开始。`howMany` *并不是*设置 `Substring()` 方法的结束索引。在 [图 5.6] 中你可以看到 `howMany` 的值被设置为 7。因此，语句\n\
  \n```\ntxtSubstringResult.Text = txtInput.Text.Substring(start, howMany);\n```\n\
  \n变为\n\n```\ntxtSubstringResult.Text = txtInput.Text.Substring(18, 7);\n```\n\n\
  结果为\n\n```\ntxtSubstringResult.Text = \"various\";\n```\n\n这意味着你想从字符串中复制的字符串是 `various`。你可以在\
  \ [图 5.6] 中看到结果。你应该尝试不同的 `start` 和结束值，看看对程序的影响。\n\n### 删除子字符串\n\n假设你有一个想要从中删除子字符串的字符串。你可以使用\
  \ `Remove()` 方法来实现。`Remove()` 方法允许你指定起始索引和要删除的字符数。这里是使用它的示例：\n\n```\ntemp = txtInput.Text;\n\
  index = temp.IndexOf(txtRemove.Text);\nif (index > 0)\n{\n  txtRemoveResult.Text\
  \ = temp.Remove(index, txtRemove.Text.Length);\n}\n```\n\n首先，代码将原始字符串复制到 `temp`，这样就不会更改字符串。接下来，代码使用\
  \ `IndexOf()` 找到目标字符串的位置。在前面的讨论中，目标字符串是 `idiot`。如果搜索成功，`index` 被赋值为字符串的起始。如果搜索未找到匹配项，`index`\
  \ 被赋值为 `-1`。`if` 语句防止了失败的搜索调用 `Remove()` 方法。[图 5.6] 显示你在执行 `Remove()` 方法时搜索了 `string`\
  \ 单词。目标字符串位于索引位置 26。这个值成为 `Remove()` 方法调用的第一个参数。第二个参数是你想要删除的字符数。你知道该字符串有六个字符，所以你可以将字面值\
  \ 6 “硬编码”到第二个参数中。然而，这并不灵活。每当你想寻找不同的字符串，你可能都需要调整第二个 `Remove()` 方法参数。因为 `txtRemove`\
  \ 文本框对象持有你想删除的字符串，所以你始终可以使用 `Length` 属性将第二个参数调整为正确的值。因此，语句\n\n```\ntxtSubstringResult.Text\
  \ = temp.Remove(index, txtRemove.Text.Length);\n```\n\n```\ntxtSubstringResult.Text\
  \ = temp.Remove(26, 6);\n```\n\n解析为\n\n```\ntxtSubstringResult.Text = \"This is\
  \ a test of various  METHODS,\n                     1234567890 and z\";\n```\n\n\
  \n\n\n随后，通过将新字符串赋值给其 `Text` 属性，新字符串显示现在 `txtRemoveResult` 文本框对象中。（注意：这段代码中有一个小瑕疵。因为代码只删除了原始字符串中的\
  \ `string` 单词，现在 `various` 和 `METHODS` 单词之间现在有两个空格，而本应该只有一个空格。你该如何解决这个问题？）\n\n###\
  \ 替换子字符串\n\n有时，你需要用一个替换词更改较长字符串中的一个单词。例如，假设你的老板要求你将程序规范发送给 Gene，你听从地执行了，结果却发现 Gene\
  \ 实际上是 Jean。在这种情况下，你需要将单词 `Gene` 替换为 `Jean`。这项任务正是 `string` 的 `Replace()` 方法要设计的。图\
  \ 5.6 所示，你想将子字符串 `1234567890` 替换为 `***`。完成此任务的语句如下：\n\n```\n // Replace\n    temp\
  \ = txtInput.Text;\n    txtReplaceResult.Text = temp.Replace(txtReplaceChars.Text,\n\
  \                            txtReplaceWith.Text);\n```\n\n第一行简单地复制输入字符串，这样你就不会永久地更改\
  \ `txtInput` 文本框对象的 `Text` 属性。`Replace()` 方法需要两个参数。第一个参数是你想要替换的字符串。第二个参数是你想要替换第一个参数的字符串。在图\
  \ 5.6 所示的示例中，方法调用解析为：\n\n```\n txtReplaceResult.Text = temp.Replace(\"1234567890\"\
  , \"***\");\n```\n\n这意味着你想将数字字符替换为三个星号。替换发生后，该语句显示如下：\n\n```\n txtReplaceResult.Text\
  \ = \"This is a test of various string METHODS,\n                      *** and z\"\
  ;\n```\n\n新字符串被赋值到 `txtReplaceResult` 文本框对象的 `Text` 属性中。如果目标字符串在原始字符串中不存在，则原始字符串保持不变。图\
  \ 5.4 中的列表框显示了你可以使用的数百个可用字符串方法的部分列表。显然，在这里显示所有字符串方法是不现实的。然而，你可能想花几分钟时间滚动查看可能的字符串方法列表并从中进行选择。很有可能，你想要对字符串数据进行做的任何操作已经在列表中了。\n\
  \n***\n\n# 字符串与转义序列\n\n你已经看到字符串变量如何被赋予字面量值，例如：\n\n```\n string name = \"Katie\"\
  ;\n```\n\n然而，有时某些字符串字面量可能会引发问题。例如，假设你想显示以下消息：\n\n```\n John said: \"Reach for the\
  \ sky!\"\n```\n\n如果你尝试将此写成一个普通的字符串字面量：\n\n```\n string message = \"John said: \"\
  Reach for the sky!\"\";\n```\n\nVisual Studio 会感到困惑，因为双引号被用于界定字符串字面量的开始和结束，而不是作为字符串本身。\n\
  \n为了解决这个问题，C# 在字符串内部使用特殊的*转义字符*来表示接后的内容将被区别对待。特殊的转义字符是反斜杠字符（`\\`）。从本质上，转义字符表示将紧随其后的任何内容都视为字符串字面量的一部分。例如，假设你这样重写字符串字面量：\n\
  \n```\n string message = \"John said: \\\"Reach for the sky!\\\"\";\n```\n\n单词 Reach\
  \ 之前的双引号和句子末尾的双引号现在被视为转义序列的一部分，因此它们作为字符串字面量的一部分被出来。最终结果是语句显示为：\n\n```\n John said:\
  \ \"Reach for the sky!\"\n```\n\n表 5.5 给出了特殊转义序列的列表。\n\n表 5.5 转义序列\n\n| **转义序列**\
  \ | **解释** |\n| :--- | :--- |\n| `\\\"` | 显示双引号。 |\n| `\\'` | 显示单引号。 |\n| `\\\\\
  ` | 显示反斜杠。 |\n| `\\0` | 空（不可打印）。 |\n| `\\a` | 警报（终端警报声）。 |\n| `\\b` | 退格。（向后退一个字符位置。）\
  \ |\n| `\\f` | 换页。（进到下一页。） |\n| `\\n` | 换行。（进到下一行。） |\n| `\\r` | 回车。（移动到左边距。） |\n\
  | `\\t` | 制表符。（前进一个制表位，通常为八个字符。） |\n| `\\v` | 垂直制表符。 |\n\n转义序列在其他地方也很有用。例如，假设你想将目录路径设置为\
  \ C 盘上的 C# 文件夹。你需要使用以下命令：\n\n```\n string path = \"C:\\\\C#\";\n```\n\n有了较长的路径名，路径看起来相当杂乱。然而，C#\
  \ 有方法让它美观。\n\n### 逐字面量\n\n假设你想输出：\n\n```\n Go to the C:\\Source;\n```\n\n这看起来很丑；C#\
  \ 提供了一种方法让它变得漂亮。你可以使用逐字面量符号（`@`）告诉 Visual Studio 按照你在双引号内编写的内容构建字符串：\n\n```\n string\
  \ message = @\"C:\\Source\";\n```\n\n这样不需要担心转义序列就能显示消息。\n\n# DateTime 对象\n\n许多业务应用程序需要处理日期时间。银行需要根据日期计算利息。Visual\
  \ Studio 提供了 `DateTime` 类型以便你处理日期。\n\nVisual Studio 跟踪时间的方式很有趣。操作系统维护一个时钟。大多数你可以在右下角观察当前的本地时间。Visual\
  \ Studio 使用时钟来跟踪刻数。*刻*是以 100 纳秒为块的时间单位。一个纳秒是秒的十分之一。这是一个非常短的时间片。事实上，光在纳秒内大约传播 18\
  \ 英寸。\n\n`DateTime` 对象维护自公元 0001 年 1 月 1 日午夜以来的刻数。这是一个巨大的刻数！然而，通过操作刻数，`DateTime`\
  \ 对象可以确定与时间和日期相关的各种情况。\n\n图 5.10 显示了一个使用某些 `DateTime` 方法和属性的程序运行示例。\n\n## DateTime\
  \ 和 ToString() 转换\n\n如前所述，所有 C# 数据类型都提供 `ToString()` 包装转换方法，允许你将数据转换为字符串。然而，某些数据类型允许你向\
  \ `ToString()` 方法传递参数，以便按特定方式格式化数据。表 5.6 展示了用于 `DateTime` 数据类型最常用的格式化字符。在每情况下，表\
  \ 5.6 第一列中显示的字母将成为 `ToString()` 的参数。例如，`myDate.ToString(\"F\")` 显示 `myDate` 变量的完整日期和时间。表格示例假设日期是\
  \ 2007 年 10 月 25 日。\n\n\n\n\n## 表 5.6 常用的日期和时间转换字符\n\n| 转换字符 | 描述 | 示例输出 |\n| :---\
  \ | :--- | :--- |\n| \"F\" | 完整的日期和时间，包含秒 | Thursday, October 25, 2007 12:00:59\
  \ PM |\n| \"f\" | 完整的日期和时间，不包含秒 | Thursday, October 25, 2007 12:02 PM |\n| \"D\"\
  \ | 完整日期 | Thursday, October 25, 2007 |\n| \"d\" | 短日期 | 10/25/2007 |\n| \"G\" |\
  \ 通用日期，包含秒^* | 10/25/2007 12:04:54 PM |\n| \"g\" | 通用日期，不包含秒 | 10/25/2007 12:05\
  \ PM |\n| \"T\" | 完整时间，包含秒 | 12:05:48 PM |\n| \"t\" | 完整时间，不包含秒 | 12:05 PM |\n\n\
  ^*“G” 转换字符是在使用 `ToString()` 时未指定任何转换字符时的默认格式。\n\n表 5.6 的第一列显示了在运行 `DateTime` 变量时，可以作为\
  \ `ToString()` 方法参数的转换字符。表格的第三列展示了结果输出的示例。一般而言，大写转换字符比其对应的小写字符提供更详细的信息。请注意，许多日期转换是感知区域（locale-aware）的。也就是说，数据是按照程序运行所在地区的常用样式进行格式化的。例如，在欧洲，2013\
  \ 年 5 月 19 日将写为：19/05/2013，日期在月份之前。\n\n接下来的“尝试一下”（Try It Out）向你展示一些常用字符串格式化选项的影响。\n\
  \n### 尝试一下：字符串格式化 (Chapter0501StringMethods.zip)\n\n生成图 5.10 所示输出的程序代码位于 5-2。\n\n\
