  \ 访问修饰符。代码还为每个属性提供了属性 `get` 和 `set` 方法，以便户可以更改对象的状态。\n\n### 符号常量与枚举类型\n符号常量在本文的许多程序中都得到了使用。然而，如果你仔细考虑，你也可以以相同的方式使用枚举类型。例如，你可以将列表\
  \ 16-1 中所示符号常量替换为以下内容：\n\n```cs\n public enum bldgType {APARTMENT = 1, COMMERCIAL,\
