  \ `switch` 语句。\n\n### 你在本章中学到的知识\n\n| 主题 | 关键点 |\n| :--- | :--- |\n| 数据库 | 包含按行列组织的数据的文件。如果该文件包含两个或多个相关的表，它就是关系型数据库。\
