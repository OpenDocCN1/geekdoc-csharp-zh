  ## 工作原理\n\n该项目目前可以运行，但它什么都不做。虽然你可以现在盲目地添加代码，然后考虑程序是如何工作的，但在讨论程序如何工作之前，你需要先进行一个重要的绕路。虽然这个绕路偏离了正常的顺序，但这样做是有意义的。\n\
  \n***\n\n## 作用域 (Scope)\n\n如果你查看“源代码”（Source）窗口，你可以看到新类的以下代码：\n\n```\nusing System;\n\
  using System.Collections.Generic;\nusing System.Text;\n\nnamespace ClassDesign\n\
  {\n    class clsDates\n    {\n    }\n}\n```\n\n这段代码存根是在你创建 `clsDates` 时由 Visual\
  \ Studio 自动生成的。为了方便讨论，扩展了 `clsDates` 的代码。不要对代码列表 9-1*中所示的代码更改。所示的代码更改仅用于帮助你理解作用域的概念。\n\
  \n代码列表 9-1: 假设的 `clsDates` 源代码\n\n```\nusing System;\nusing System.Collections.Generic;\n\
  using System.Text;\n\nnamespace ClassDesign\n{\n\n    class clsDates           \
  \                   // 命名空间作用域\n    {\n        int scopeClass;                 \
  \        // 类作用域\n\n        public int MyFunction()\n        {\n            int\
  \ scopeLocal;                     // 局部作用域\n\n                                 \
  \               // 块作用域\n            for (int scopeBlock = 0; scopeBlock < 20; scopeBlock++)\n\
  \            {\n                 // for 语句块\n\n            }    // 块作用域结束\n\n  \
  \      }        // 局部作用域结束\n\n    }            // 类作用域结束\n\n}                //\
  \ 命名空间作用域结束\n```\n\n代码列表 9-1 中的代码并不是你将要使用的“真实”代码。然而，你可以使用代码列表 9-1 来理解一个名为作用域（scope）的重要概念。前面的章节提到过几次作用域，但从未完全解释过。情况就要发生改变了。\n\
  \n简单来说，*作用域*指的是变量的可见性和生命周期。只要变量在*作用域内*（in scope），你就可以访问它并在代码中使用它。如果变量在*作用域外*（out\
  \ of scope），就就像该变量不存在一样；你无法在程序中使用它。现在，从代码列表 9-1 的“内部”开始，详细研究作用域的概念。\n\n### 块作用域\
  \ (Block Scope)\n\n考虑以下代码中变量 `scopeBlock` 的定义：\n\n```\n// 块作用域\nfor (int scopeBlock\
  \ = 0; scopeBlock < 20; scopeBlock++)\n{\n     // for 语句块\n\n}    // 块作用域结束\n```\n\
  \n当程序控制到达上述代码中的 `for` 循环时，`for` 循环的 `expression1` 定义了一个名为 `scopeBlock` 的变量。在定义的这一刻，`scopeBlock`\
  \ 就可以在程序中使用。这意味着 `scopeBlock` 现在处于作用域内，并可以在你的代码中使用。换句话说，`scopeBlock` 开始了它的生命周期。\n\
  \n现在假设 `for` 循环已经对 `for` 语句块执行了 20 次，程序控制准备好执行 `for` 循环右大括号之后的任何语句。现在是有趣的部分：当程序控制到达\
  \ `for` 循环的右大括号时，变量 `scopeBlock` 在程序中不再存在了。因为右大括号标记了 `for` 循环的结束，且 `scopeBlock`\
  \ 定义在在该 `for` 循环内部，因此 `scopeBlock` 不再可以在程序中使用。当到达 `for` 循环的右大括号时，`scopeBlock` 离开了作用域且无法使用。\n\
  \n***\n\n**注意**：变量的作用域从它的定义点延伸到其所在代码块的右大括号。因此，*块作用域*（block scope）从定义点延伸到定义变量语句块的右大括号。如果你想证明这一概念，请在\
  \ `clsDates` 的 `Main()` 方法中进行以下代码更改。更改所示于代码列表 9-2。\n\n***\n\n代码列表 9-2: 演示块作用域的代码片段\n\
  \n```\npublic void Main()\n{\n    int j = 1;\n\n    frmMain main = new frmMain();\n\
  \    Application.Run(main);\n\n    if (j == 1)\n    {\n        int i;     // 具有块作用域定义\n\
  \        i = 10;\n        // 以某种方式操作 i\n    }              // if 语句结束\n    j = i;\
  \         // 此处发生错误\n}\n```\n\n现在尝试编译程序。你可以看到以下错误消息：\n\n```\n当前范围内不存在 'i'\n```\n\
  \n代码在尝试将变量 `i` 赋值给 `j` 的语句处失败。原因是 `i` 是块作用域。变量 `i` 定义在 `if` 语句块内，因此它的作用域和生命周期从在\
  \ `if` 语句中的定义点延伸到 `if` 语句的右大括号。由于赋值语句在 `if` 语句之外，变量 `i` 不在作用域内，因此 Visual Studio\
  \ 必须报错。\n\n### 局部作用域 (Local Scope)\n\n现在向上移动查看*局部作用域*。局部作用域变量定义在方法块内，但在语句块之外。（某些程序员可能将局部作用域称为*方法作用域*）。因此，局部作用域从变量的定义点延伸到定义该方法的右大括号。代码列表\
  \ 9-2 中的 `j` 是局部作用域变量的一个示例。变量 `j` 在名为 `Main()` 的方法中的定义点进入作用域。当程序控制到达代码列表 9-2 中 `Main()`\
  \ 方法的右大括号时，`j` 离开作用域并不再存在。\n\n你应该能看到代码列表 9-1 中的变量 `scopeLocal` 具有局部作用域。当程序控制到达代码列表\
  \ 9-1 中的右大括号时，变量 `scopeLocal` 不在作用域内，且无法在程序中使用：\n\n```\n }        // 局部作用域结束\n```\n\
  \n\n\n\n局部作用域变量（local scope）可以在语句块中使用，但反之则不然。也就是说，块作用域变量不能在定义它们的语句块之外使用，但局部作用域变量可以在同一方法内的任何语句块中使用。\n\
  \n### 类作用域（Class Scope）\n\n你可能已经发现了这一点，但无论如何还是过一遍吧。具有`类作用域（class scope）的变量是指定义在类内部但在方法之外的变量。（某些程序员将类作用域称为`模块作用域（module\
  \ scope）。）类作用域使得变量在类的所有地方都是可访问的。列表 9-1 中的变量 `scopeClass` 就是类作用域变量的一个示例。类作用域涵盖了方法作用域和语句块作用域。这意味着具有类作用域的变量可以在方法级和语句块级的作用域上被使用。如果你仔细想想，类作用域变量就是类的属性。类中的方法始终具有类作用域。\n\
  \n### 命名空间作用域（Namespace Scope）\n\n`命名空间作用域（namespace scope）适用于定义在当前命名空间内的任何变量。在列表\
  \ 9-1 顶部，你可以找到以下语句：\n\n```\nnamespace ClassDesign\n{\n```\n\n你可以从这条语句判断出当前正在开发的项目命名为\
  \ `ClassDesign`。因为项目名为 `ClassDesign`，这也意味着如果你想这样做，可以按照以下方式引用程序的入口点：\n\n```\nClassDesign.frmMain.Main();\n\
  ```\n\n到目前为止你编写的每个程序都有一个 `frmMain.Main()` 方法。想想如果你不知道自己正在引用哪个项目，要调用正确的 `frmMain.Main()`\
  \ 方法将有多么混乱。命名空间作用域的主要原因之一是防止存在于多个命名空间中的类和方法发生命名冲突。如果两个程序中都包含一个 `clsDatabase` 的类，你可以应用正确的命名空间来从你想要使用的项目中使用正确的类。这意味着你可以拥有\
  \ `JonesProject.clsDatabase.ReadOneRecord()` 和 `SmithsProject.clsDatabase.ReadOneRecord()`，尽管这两个\
  \ `ReadOneRecord()` 方法共享相同的类名，但它们将保持彼此独立。命名空间作用域涵盖了当前项目中的所有程序元素（如变量、类和方法），并使得区分可能具有相同名称的程序元素成为可能。\n\
  \n### 可视化作用域（Visualizing Scope）\n\n如果你喜欢形象，试着想象一个跨越多个平台的高梯子，就像图 9.4 所示所示。你和你几个朋友站在梯子底部的地面上。唯一奇怪的地方是，你们没有任何人的视线能超过眼睛水平的高度。这就是块作用域。只要你们都定义在同一个语句块内，你就可以看到并与你的朋友互动。在图中，具有块作用域的数据项视野（FOV）仅包含那些具有块作用域的项。\n\
  \n图 9.4 可视化作用域\n\n![image](img/c09f004.jpg)\n\n现在，爬上梯子到达第二个平台。你环顾四周，看到局部作用域平台上的更多朋友。你可以走到平台边缘向下看，看到你下方的朋友，以及在同一平台上的朋友。唯一的区别是，你下方的朋友无法再看到或与你互动，因为他们无法向上看。由于你现在处于更高的作用域层级，只有当你爬下梯子加入他们的`语句块作用域层级（statement\
  \ block scope level）`时才能与他们互动。也就是说，任何涉及你且具有局部作用域的语句必须发生在定义该语句块变量的语句块内。例如，如果你是具有局部作用域的变量\
  \ `x`，而你有一个具有块作用域的朋友 `i`，那么语句\n\n```\nx = i;\n```\n\n只有当你爬回梯子并在 `i` 的语句块中与变量 `i`\
  \ 互动时，该语句才能发生。这意味着该语句必须发生在 `i` 所在的语句块内。否则，该语句无法发生，因为 `i` 只存在于它自己的语句块中。从列表 9-2 来看，只有当你将赋值语句放在\
  \ if 语句块内时，才能与变量 `i` 互动。因此，具有局部作用域的变量视野包含了具有局部作用域和块作用域的数据项，但只能在这些项的语句块内与块作用域项互动。\n\
  \n现在爬得更高，到达类作用域平台。同样，你在这个作用域层级也有可以可以直接互动的。。向下看，你可以同时看到你的局部和语句块朋友，但要与他们互动，你必须爬下梯子到达他们的层级。也就是说，为了与局部变量互动，任何涉及你的语句必须发生在定义你的局部块朋友的方法内，或者发生在定义你的块作用域朋友的语句块内。注意类作用域的视野包含了分别用局部作用域和块作用域定义的数据项。\n\
  \n最后，爬到最高平台。同样，你在这个层级可以看到一些新朋友（例如全局数据项），但向下看，你可以看到一切！然而，要与他们互动意味着你必须爬到它们的层级，因为它们无法向上看。假设你是具有命名空间作用域的变量。要与列表\
  \ 9-2 中的 `i` 互动，你必须一直爬到 if 语句块。\n\n### 为什么 C# 支持作用域？\n\n大多数现代（以及所有面向对象的）语言都支持作用域的概念。这种支持是为了尽量减少程序数据项之间可能发生的意外副作用。考虑一下如果你使用不支持作用域的语言会发生什么。假设一个名为\
  \ `x` 的变量开始表现异常并获得了一个不应具有的值。如果没有作用域，你从哪里开始寻找原因？整个程序都是战场，因为 `x` 处处可见。程序中的任何元素都可能干扰\
  \ `x`，而你并不知道它是在哪里被污染的。在这种情况下，调试此类问题变成了一种碰运气游戏，只有靠运气才能才能找到 bug。在这种情况下，系统性的调试就失效了。\n\
  \n有了具有作用域的数据项，问题的规模会大大缩小。如果 `x` 是一个用块作用域定义的变量，显然是在定义 `x` 的语句块内有东西干扰了它。毕竟，当 `x` 具有块作用域时，它无法在定义它的块之外生存。在一个有\
  \ 3000 行代码的大型程序中，你可以立即排除几乎所有的 3000 行代码，专注于形成 `x` 语句块的相对少数代码。\n\n如果 `x` 是用局部作用域定义的，你仍然可以排除数千行代码，因为只有定义\
  \ `x` 的方法内部的代码起作用。虽然局部作用域变量的作用范围比块作用域变量大，但仍然比完全没有作用域要得多。\n\n\n\n当你攀爬图 9.4 中的作用域梯时，会有更多的代码行开始发挥作用，`x`\
  \ 出错的地方也变得更多。（这是因为视野 FOV 变宽了。）由于变量的作用域扩大，必须考虑的代码行也更多，调试变得更加困难。因此，你的程序设计应该尝试在对当前任务合理的、尽可能窄的作用域级别上处理数据。在程序中孤立数据的过程被称为`封装`（封装），它是面向对象编程的基石之一。虽然在几乎不考虑作用域或封装的情况下随手写出一个程序设计可能更简单，但从长远来看，你将付出更多的调试和维护时间作为代价。\n\
  \n## 在编写之前思考\n\n本课学习的教训是：在开始编写之前，花时间去`think`（思考）程序设计。我无法告诉你我有多少次布置课堂编程作业，结果学生们立刻就开始疯狂敲击键盘，并将对象拖动到表单上。当我观察学生时，通常会有一两个个人坐在座位上，要么在草稿纸上画乱画，也许只是盯着天花板。几分钟后，他们最终开始编写程序。很棒的一点是，这些涂鸦者和看天板的人几乎总是比班上其他人先完成程序，并且通常拥有更好的程序解决方案。原因是什么？他们花在涂鸦或看天花板的时间实际上是花在了创建程序设计。\n\
  \n许多学生将简单的移动与解决问题混为一谈。也就是说，他们认为因为他们正在将文本框和标签对象拖到表单上，他们就在实现程序的解决方案。然而，当他们进入问题后，并不意外看到他们删掉最初认为需要的对象，并将其替换为其他东西——有大量的动作，但没有实用的工作。如果这些学生能在做任何其他事情`before`（之前）先花几分钟想透问题并给出一个设计，他们的进度将领先别人好几里。\n\
  \n那么……你`how`（如何）设计一个程序呢？这正是你在本章剩余部分想要检查的内容。\n\n# 设计程序\n\n新程序员面临的最困难的任务也许是知道在设计程序时该从何开始。每个程序都略有不同，因此每个设计也必须略有不同。既然如此，最好的起点在哪里呢？\n\
  \n虽然程序确实是不同的，但你已经知道所有程序至少有一个共同点：五个程序步骤。记住这一点，回到你在本章开头开始的 `clsDates` 程序。该程序的目标是编写一个类，该类可以确定复活节的日期，并告诉你你该年份是否为闰年。现在看看你如何将这五个程序步骤作为你设计的起点。\n\
  \n## 五个程序步骤\n\n假设图 9.1 中所示的用户界面对于该程序来说已经足够了。在这一假设下，从设计的角度检查这五个程序步骤。\n\n### 初始化步骤\
  \ (Initialization Step)\n\n对于这个程序，初始化步骤唯一需要做的大约是正确初始化你放置在 `frmMain` 表单上的对象，并在屏幕上显示该表单。列表\
  \ 9-3 显示了在你遵循章节开头的指令后，目前存在的 `frmMain` 代码。\n\n列表 9-3：`clsDates` 测试代码。(`frmMain.cs`)\n\
  \n```cs\nusing System;\nusing System.Windows.Forms;\n\npublic class frmMain : Form\n\
  {\n    private TextBox txtYear;\n    private Button btnCalc;\n    private Button\
  \ btnClose;\n    private Label lblLeapYearResult;\n    private Label lblEasterResult;\n\
  \    private Label label1;\n    #region Windows code\n\n    private void InitializeComponent()\n\
  \    {\n        // frmMain 表单的 Windows 初始化代码\n    }\n\n    #endregion\n\n    public\
  \ frmMain()                    // 构造函数\n    {\n        InitializeComponent();\n\
  \    }\n\n    public static void Main()\n    {\n        frmMain main = new frmMain();\
  \   // 程序从这里\n        Application.Run(main);\n    }\n}\n```\n\n当程序开始执行时，你已经知道它的执行源头是名为\
  \ `Main()` 的方法。在 `Main()` 内部，语句\n\n```cs\nfrmMain main = new frmMain();   // 程序从这里\n\
  ```\n\n表示程序执行的第一件事是创建一个 `frmMain` 类的对象实例，并将其命名为 `main`。为了创建名为 `main` 的对象，程序必须首先调用名为\
  \ `frmMain()` 的方法。正如你在第 5 章中学到的，任何与其定义所在类同名的方法都是该类的构造函数。如果你查看列表 9-3 中的 `frmMain()`\
  \ 构造函数，你可以看到它调用了一个名为 `InitializeComponent()` 的方法。实际上，对于你所写的每一个程序，一直在使用这些完全相同的代码行，从你写的第一个程序开始。\n\
  \n当程序开始执行时，你已经知道它的执行源头是名为 `Main()` 的方法。在 `Main()` 内部，语句\n\n```cs\nfrmMain main =\
  \ new frmMain();   // 程序从这里\n```\n\n表示程序执行的第一件事是创建一个 `frmMain` 类的对象实例，并将其命名为 `main`。为了创建名为\
  \ `main` 的对象，程序必须首先调用名为 `frmMain()` 的方法。正如你在第 5 章中学到的，任何与其定义所在类同名的方法都是该类的构造函数。如果你查看列表\
  \ 9-3 中的 `frmMain()` 构造函数，你可以看到它调用了一个名为 `InitializeComponent()` 的方法。实际上，对于你所写的每一个程序，一直在使用这些完全相同的代码行，从你写的第一个程序开始。\n\
  \n当程序开始执行时，你已经知道它的执行源头是名为 `Main()` 的方法。在 `Main()` 内部，语句\n\n```cs\nfrmMain main =\
  \ new frmMain();   // 程序从这里\n```\n\n表示程序执行的第一件事是创建一个 `frmMain` 类的对象实例，并将其命名为 `main`。为了创建名为\
  \ `main` 的对象，程序必须首先调用名为 `frmMain()` 的方法。正如你在第 5 章中学到的，任何与其定义所在类同名的方法都是该类的构造函数。如果你查看列表\
  \ 9-3 中的 `frmMain()` 构造函数，你可以看到它调用了一个名为 `InitializeComponent()` 的方法。实际上，对于你所写的每一个程序，一直在使用这些完全相同的代码行，从你写的第一个程序开始。\n\
  \n当程序开始执行时，你已经知道它的执行源头是名为 `Main()` 的方法。在 `Main()` 内部，语句\n\n```cs\nfrmMain main =\
  \ new frmMain();   // 程序从这里\n```\n\n表示程序执行的第一件事是创建一个 `frmMain` 类的对象实例，并将其命名为 `main`。为了创建名为\
  \ `main` 的对象，程序必须首先调用名为 `frmMain()` 的方法。正如你在第 5 章中学到的，任何与其定义所在类同名的方法都是该类的构造函数。如果你查看列表\
  \ 9-3 中的 `frmMain()` 构造函数，你可以看到它调用了一个名为 `InitializeComponent()` 的方法。实际上，对于你所写的每一个程序，一直在使用这些完全相同的代码行，从你写的第一个程序开始。\n\
  \n（注：由于原始文本中存在大量重复段落，翻译已按逻辑进行了去重处理以确保内容流畅）\n\n`InitializeComponent()` 方法的目的是让 Windows\
  \ 重新创建你在拖动对象到空表单时构建的表单。唯一的不同是 Windows 现在正在重建该表单。当表单构建完成后，控制最终返回 `Main()` 并执行：\n\n\
  ```cs\nApplication.Run(main);\n```\n\n当 `Run()` 方法执行时，Windows 显示当前在内存中存储的 `frmMain`\
  \ 类构象，屏幕现在看起来就像图 9.1。此时，初始化步骤已完成，程序在等待用户进行某些操作。\n\n### 输入步骤 (Input Step)\n\n运行程序的用户只需要两个输入：年份和点击计算按钮。假设用户在年份处输入了\
  \ 2012 并点击了计算按钮。这时，程序控制进入了 `btnCalc_Click()` 事件方法。在程序控制进入该方法后，程序需要将年份的文本数据转换为数值类型，并将其值赋值给变量。因为程序只需要用户输入的年份和点击计算按钮，所以输入步骤非常简单。\n\
  \n### 处理步骤 (Process Step)\n\n如果一切顺利，程序现在需要调用另一个方法，该方法获取用户输入的年份值并确定复活节的日期。完成此后，程序还需要调用另一个方法来判断该年份是否为闰年。你可以假设复活节的日期是以\
  \ `string` 返回的，而闰年值是以 `int` 返回的。\n\n### 显示步骤 (Display Step)\n\n显示要求非常简单：用处理步骤提供的信息填充表单上两个标签对象的\
  \ `Text` 属性。\n\n### 终止步骤 (Termination Step)\n\n由于程序没有执行任何复杂的操作，也没有使用任何你事后需要清理的特殊资源，你只需调用\
  \ `Close()` 方法即可结束程序。\n\n\n\n\n如果你查看图 9.5，可以清楚地看到，你所做的一切都可以放在 `frmMain` 类的范围内。也就是说，`Initialization`步骤设置了你想要的表单外观，`Input`步骤使用表单从用户处收集输入内容，`Process`步骤将数据转换为所需的答案，`Display`步骤将结果显示给用户，而`Termination`步骤则简单地结束程序。现在，请想一下图\
  \ 9.5 中显示的步骤以及它们是如何工作的。\n\n## 看森林，不要只看树\n\n从某种意义上说，所有的步骤都与 `frmMain` 类绑定，`Processing`步骤除外。也就是说，除了`Processing`步骤之外，所有步骤都与表单\
  \ `frmMain` 上的视觉组件进行交互。只有`Processing`步骤与 `frmMain` 表单的视觉表示或对象没有直接关系。这意味着，如果你愿意，可以完全将`Process`步骤与表单的视觉状态隔离开。`Process`步骤正常运行只需要一个存储年份的变量。鉴于这一事实，你应该问问自己：“在我的编程生涯中，是否会需要重用一个可以计算给定年份的复活节日期或该年份是否为闰年的方法？”如果你认为这个答案可能是肯定的，那么你应该考虑将`Process`步骤的代码写在一个独立类的方法中。为什么要这样做呢？\n\
  \n面向对象编程（OOP）的驱动力之一是代码复用。如果你可以编写一次代码并在未来多次使用它，为什么要在每次完成相同任务时都重新发明轮子呢？虽然短期内可能多花一点精力，但从长远来看，收益是巨大的。你需要将编写新类看作是对未来的投资。现在现在投入一点工作时间，以便在将来获得更多空闲。一个副作用是，调试基于类的程序通常比将所有代码都挤在\
  \ `frmMain` 中要容易。\n\n想想微软编写的那些 4000 个饼干模具到目前为止为你简化了多少事情。如果你必须为每个程序亲自重写创建文本框、标签和按钮对象的代码，那么书中的编程示例将会变得困难多少？你还是会回到第\
  \ 2 章的！能够在不编写其代码的情况下使用这些对象的能力，为你节省了无数的输入和调试时间。\n\n因为你以后在某个时刻可能想要重用复活节和闰年方法，所以将这些方法实现为名为\
  \ `clsDates` 的新类的一部分。\n\n# UML Light\n\n统一建模语言（UML）是一种用于建模对象的标准化规范语言。它是由 James Rumbaugh、Grady\
  \ Booch 和 Ivar Jacobson 在 20 世纪 90 年代共同努力而来的。关于 UML 有整卷的著作，在这里无法充分体现它的价值。尽管如此，你可以使用\
  \ UML 的一小部分集，称为 `UML 类图`。这是组成类的部分的视觉表示。你并没有使用 UML 类图的所有特征，而是只使用其中的一小部分，因此被称为 `UML\
  \ Light`（轻量级 UML）（不要去 Google 搜索“UML Light”……作者很久以前就造了这个词。）\n\n图 9.6 显示了 UML 类图的格式。\n\
  \n**图 9.6** 使用 UML Light\n\n![image](img/c09f006.jpg)\n\nUML 类图可以被视为三个堆叠的盒子。顶部的盒子存放类名（在这种情况下为\
  \ `clsDates`）。这是你在饼干模具挂在墙上看到的名称。类名框下方是一个描述类属性的框。（其他 OOP 语言可能会将这些属性称为 `class members`\
  \ 或 `class attributes`）。第三个框描述该特定类支持的方法。（UML 的最新版本支持第四个框，描述类如何在磁盘数据文件或数据库中“持久化”或永久存储。轻量版忽略了这第四个框。）\n\
  \n## 访问修符\n\n属性框中的第一行包含以下内容：\n\n```\n - year : int\n```\n\n行开头的减号用作符号，表示此特定属性的访问修符。这里讨论了两种可能的访问修符：`private`\
  \ 和 `public`。这两个访问修符都是 C# 中的关键字。关键字 `private` 意味着该属性只能从类外部通过其属性方法进行访问。（对对象属性方法的讨论推迟到第\
  \ 10 章。）图 9.6 中的减号是 C# 中关键字 `private` 的 UML 符号。\n\n你也可以使用 `public` 关键字定义属性。关键字 `public`\
  \ 意味着可以直接访问属性，而无需使用对象的属性方法。UML 中 `public` 关键字的符号是加号。\n\n减号出现在属性名之前。属性名后面的冒号（:）仅用于分隔属性名和类型指定符。在这种情况下，类型指定符是\
  \ `int`。这意味着 `year` 是一个整数类型。整行告诉了你关于该属性的很多信息。也就是说，`year` 是 `clsDates` 类的整数属性。该属性\
  \ 使用了 `private` 修饰符。\n\n在图 9.6 中，你可以看到所有属性都 `private` 修饰符。使用这种修饰符有充分的理由，稍后可见。现在，只需将\
  \ `private` 修饰符看作比 `public` 修饰符提供了更多的保护。`private` 修饰符将变量封装在类内部并使其不受外部世界的影响。\n\n\
  ### 访问修符与作用域\n\n类的属性默认具有类作用域。这意味着类属性变量在类中的所有点都是可见的。类属性的默认访问修符是 `private`。类作用域还意味着类属性变量*不*具有命名空间作用域。例如，如果你按照图\
  \ 9.6](#9781118416471c09.xhtml_c09-fig-0006) 所示的光定义属性 `year`，它在 `clsDates` 中显示为：\n\
  \n```` int year;\n```\n\n由于 `private` 访问修符是默认存储类，你编写的是\n\n```\n private int year;\n\
  ```\n\n现在假设你在 `frmMain` 中创建了一个名为 `myDate` 的 `clsDates` 对象。按照目前的情况，你可能会尝试这条语句：\n\n\
  ```\n myDate.year = 2008;\n```\n\nVisual Studio 报错并告诉你：\n\n```\n ClassDesign.clsDates.year'\
  \ 因其保护级别而不可访问\n```\n\n这是 Visual Studio 在告诉你 `year` 不在作用域内。换句话说，你在 `clsDates` 类中赋予\
  \ `year` 的 `private` 访问修符使其免受外部世界邪恶力量的某种保护。再次，`private` 访问修符意味着变量 `year` 仅在 `clsDates`\
  \ 中可见，而不在 `frmMain` 中可见。\n\n现在将 `clsDates` 中 `year` 的定义改为\n\n```\n public int year;\n\
  ```\n\n并尝试编译程序。Visual Studio 不再报错。原是因为你放弃了 `private` 关键字提供的数据保护。现在，任何拥有 `clsDates`\
  \ 对象的人都可以自由将 `year` 修改为她想要的任何值，而你对此无能为力。这不太好。\n\n\n\n\n通过使用 `private` 访问修符定义类属性\
  \ `data`，你的行为就像一位精明的中世纪国王，将他的珍贵财产（`data`）锁在城堡的塔楼里。因为你拥有塔楼的钥匙，所以你可以控制谁可以访问这些财产，而且他们必须遵守你的规则。相反，如果你用\
  \ `public` 访问修符定义类属性，那无异于制作一千把钥匙，并把它们挂在护城河旁的门上。局外人不再需要遵守你的规则，可以随心所欲地更改一切……这可不太好。\n\
  \n总而言之，`private` 访问修符强化了 OOP（面向对象编程）封装数据的设计目标。尽管可能有一些技术性的理由支持使用 `public` 访问修符，但这些理由少之寥寥。作为一条一般原则，请对所有属性数据使用\
  \ `private` 访问修符。\n\n## static 关键字\n\n这一行代码\n\n```\n\n - daysInMonth : static int[]\n\
  ```\n\n是什么意思？`static` 是 C# 的一个关键字，用于传达有关内容如何在计算机内存中存储的信息。在这种情况下，你可以这样口述这一行：“`daysInMonth`\
  \ 是一个使用 `static` 存储类的私有整数数组”。`int` 关键字后的括号告诉你 `daysInMonth` 是一个整数数组。`static` 关键字意味着几点，但最重要的一点是，无论你在程序中创建了多少个该类的实例，Windows\
  \ 内存管理器只会为名为 `daysInMonth` 的数组保留一份存储。\n\n例如，假设你编写了一个程序，出于某种原因需要百万个 `clsDates` 类型的对象。每个对象都拥有\
  \ `year`、`month`、`day`、`leapYear` 和 `current` 属性的副本，见图 9.6。然而，所有百万个对象共享 `daysInMonth`\
  \ 数组的同一个实例。为什么只有一份拷贝？嗯……你*真的*要重新定义一个月有多少天吗？我不认为会。因为没有正理由拥有多个数组的实例，你可以通过只定义一次它并让所有其他实例共享其数据，从而节省数百万字节的存储空间。\n\
  \n正如你在章节稍后部分看到的，`daysInMonth` 数组存储了每个月的天数计数，例如 31、28、31、30 等。由于这些月度计数在短期内不会发生变化，因此没有理由创建多个数组的副本。这样的数组就是一个只读数组，因为没有可以想象的理由去更改这些值。因此，因为没有任何对象有需要更改数组的内容，所以没有理由复制它。程序对数组内容的需求使得每个类对象都可以共享这些数据。\n\
  \n关于静态数据项的另外一点：它们在程序加载的那一刻就被创建了。你可能没有注意到 `Main()` 方法使用了 `static` 存储类。这意味着在程序被加载到内存的那一刻，该方法的副本就存在了。如果你仔细考虑，这完全是合理的。毕竟，如果程序在加载时没有立即创建\
  \ `Main()` 方法的副本，你又如何让程序开始执行呢？你需要 `Main()` 方法来让程序运行。\n\n作为一条通的设计规则，对于任何可以在类实例之间安全共享的数据，或任何在程序准备好开始执行时必须存在的数据，你都应该使用\
  \ `static` 关键字。你也可以将 `static` 访问修符应用于方法，达到同样的效果。\n\n## UML 方法\n\n对 UML 类方法条目的解释与其属性的类似。考虑此条目：\n\
  \n```\n + getLeapYear(year) : int\n```\n\n它表示 `getLeapYear()` 方法是一个公共方法（`+`），它接收一个名为\
  \ `year` 的参数，并返回一个 `int` 数据类型的值。`getEaster()` 的解释类似，不同在于它向调用者返回一个字符串值。\n\n### 方法的设计意图与访问修符\n\
  \n与类属性一样，类方法也可以使用 `public` (+) 或 `private` (-) 访问修符。`public` 方法的解释与 `public` 属性类似。然而，对方法使用\
  \ `public` 访问修符的*意图*与类属性的意图不同。类属性是数据，根据一般原则，你想尽可能地隐藏类数据。再次，数据隐藏是封装的基础，也是 OOP 的真正益处之一。然而，类方法是不同的。\n\
  \n#### public 方法\n\n大多数类方法的设计目标是对一个或多个数据片段执行一个特定的任务。（初学者的一个常见错误是编写等同于瑞士军刀的方法。方法不是多任务处理者。它们应该被设计为执行一项任务并良好完成该任务。）通常，这些数据片段来自类属性。鉴于类方法被用于操作类数据，假设使用该类的程序员想要访问这些新转换的数据是合理的。例如，在几分钟后，你将编写一个类方法，如果年份是闰年则返回值\
  \ 1，如果不是则返回 0。你编写该方法是为了让调用该方法的人知道他传给方法的年份是否为闰年。显然，你想让类外部知道这个结果。因此，你将使用 `public`\
  \ 访问修符来编写 `getLeapYear()` 方法。\n\n你赋予类中所有带有 `public` 访问修符的元素都成为该类*用户*（或*公共*）*接口*的一部分。也就是说，你特意使用公共修符来设计属性和方法，恰恰是因为你希望外部世界能够访问它们。正如前面提到的，我对\
  \ `public` 属性不以为好。然而，我对 `public` 方法感到非常兴奋。这种差异的原因在于，你想隐藏数据（即属性），但通过 `public` 方法以及这些方法带来的功能来让类变得有用。\n\
  \n有时你会听到*类 API* 这个术语。这指的是类的应用程序编程接口（Application Programming Interface）。因此，类 API\
  \ 指类中所有使用 `public` 访问修符的元素。如果你仔细考虑，这是合理的，因为外部世界与类交互的唯一方式就是通过它的公共属性和方法。\n\n#### private（辅助）方法\n\
  \n正如类可以有公共方法，它也可以使用私有类方法。根据定义，私有类方法不能成为类 API 的一部分。如果方法是私有的，它具有类作用域，并且在定义它的类之外不可见。\n\
  \n你可能会问：“如果私有类方法无法在类外部访问，它们有什么用呢？”这是一个好问题，用一个例子来回答是最好的。\n\n假设你正在编写一个电子电话簿应用程序，为它收集人的个人数据。你决定收集每个人的家庭电话号码，以及他们的手机和工作电话号码。你知道人们在输入号码时经常会出错，所以你验证验证他们输入的每个电话号码是否符合有效格式。现在你面临一个设计选择。你可以将验证代码重复三次，每种电话号码类型一次；或者你可以编写一个名为\
  \ `validatePhoneNumber()` 的单一方法并在需要时调用它。嗯……哪种决定是更好的？写三倍的代码然后进行三次测试和调试，还是只写一次代码并测试和调试那一个版本？看起来显而易见。\n\
  \n\n\n\n类中存在 `validatePhoneNumber()` 方法是为了让你验证电话号码的工作变得更简单。任何仅仅是为了让你的工作更简单且你不不想将其作为类\
  \ API 的类方法，都应该使用 `private` 访问修符来定义。很多时候，此类私有类方法被称为“辅助方法”（Helper methods），因为它们存在于类中是为了让你这个程序员的工作更方便，并且`do\
  \ not` 构成暴露给外部的类 API。\n\n## 类属性和方法的命名\n\n在设计类时，对于属性和方法的命名，你有很大的自由。显然，你不能使用 C# 关键字作为名称，但几乎其他任何名称都可以使用。（类的命名规则与变量的命名规则相同。）既然有这种自由，你给属性和方法起什么名字真的重要吗？显然，你在类内部使用的名称确实很重要，否则你就不需要本章的这一部分了。在设计类时，请考虑以下类命名规范。\n\
  \n### 属性名称使用小写字母\n\n首先，你的属性名称以小写字母开头。关于这一决定的详细解释将推迟到第 10 章。简短的解释是，使用小写字母让你能够实现许多\
  \ C# 程序员通用的命名规范。\n\n**Note** 微软拥有一套与此处介绍不同的命名规范和风格。虽然对我呈现此处风格有自己的理由，但你可以在 [`msdn.microsoft.com/en-us/library/x2dbyw72%28v=vs.71%29.aspx`](http://msdn.microsoft.com/en-us/library/x2dbyw72%28v=vs.71%29.aspx)\
  \ 查看微软的规范。\n\n### 给出其功能的暗示\n\n其次，为你的 API 方法选择能够提供其功能暗示（hint）的名称。例如，`SortData()`\
  \ 方法名似乎是一个不错的选择，直到你意识到该类包含了多个部分的数据。更好的名称可能是 `SortZipCodes()`，因为这个名称能让你更清楚地知道即将发生什么。如果你需要根据邮政编码排序类中的所有数据，你可能会将该方法命名为\
  \ `SortAllDataByZip()`。使用功能性名称使得当 IntelliSense 向你展示类中可用的方法列表时，更容易回想起每个方法的作用。\n\n\
  ### API 方法使用动词名称\n\n第三，由于大多数 API 类方法都会与类数据交互，方法名称通常暗示某种动作，因此是基于动词的。例如，`SortZipCodes()`\
  \ 意味着邮政编码数据从其当前状态到排序状态的积极变化。`CalculateSaleTaxDue()` 可能是公司销售包中的一个方法，它更改类的 `salesTaxDue`\
  \ 属性。相比之下，API 方法 `Name()` 没有提供任何关于该方法所作用的线索，只说明它可能与名称数据有关。更好的选择是 `getClientName()`，因为它暗示了该方法的功能。\n\
  \n### API 方法名称应该是与实现无关的\n\n第四，API 类方法`not` 反映方法功能的实现方式。我见过某些代码，其中两个 API 方法被命名为 `SearchLeftTreeNode()`\
  \ 和 `SearchRightTreeNode()`。不需要费费想象力就能看出，编写该类的程序员可能正在使用二叉树来搜索某些东西。现在假设某地方的某个天才发明了一种全新的、超快速的搜索算法，而你想在代码中实现它。你会更改\
  \ API 类名以反映新算法，还是保持它们原样？如果你更改了 API 方法名称，旧版本的代码将会崩溃，因为这些方法不再存在于类中了。如果你不更改名称，那么对于任何使用你类的人来说，你实际上对这些方法的作用撒了谎。这是一个困境：两个选择，都很糟糕。解决方案是永远不要使用基于实现性的名称。\n\
  \n程序员搜索二叉树是因为他们想找到某些东西，而 API 方法名称应该反映这一事实。例如，如果二叉树搜索是使用客户的 ID 来查找客户的人口数据，那么更好的 API\
  \ 方法名称将是 `getClientData()`。这个 API 方法名称没有说明你如何`how` 完成任务。对于外部世界来说，你的 API 类方法应该像黑盒一样：用户不需要知道产生结果的特定魔法类型，只需要知道魔法有效即可。与实现无关的方法名称让你改变完成任务的`way`，而不会让你在第二天早上感到愧疚。这种不愧疚是因为方法名称与实现无关，并且没有对方法内部如何操作做出任何承诺。\n\
  \n## 像用户一样思考\n\n类设计的另一个方面是像最终使用你类的属性和方法的用户一样思考。（这种意义上的用户是指是指程序员，而不是运行程序的人。）例如，几分钟后你将看到\
  \ `clsDates` 类的代码。该类中的一个属性定义如下：\n\n```csharp\nprivate static int[] daysInMonth =\
  \ { 0, 31, 28, 31, 30, 31, 30, 31,\n                                    31, 30,\
  \ 31, 30, 31};\n```\n\n如果你查看 `daysInMonth` 数组的初始化数据，显然，这些值反映了每个月份的天数。然而，仔细观察发现数组的第一个元素是\
  \ 0。为什么？\n\n由于由于人们思考的方式，正如第 8 章提到的那样。如果你问人们一年中的第一个月（即一月）有多少天，很少有人会说 28 天。然而，如果该类的用户在一个应该返回给定月份天数的方法中传递了值\
  \ 1，你得到的答案就是这个。诚然，你完全可以记住“N-1 原则”，并在索引数组时调整用户传递的值。但你也是“人”，你可能和你的用户以相同的方式。如果数据的组织方式与你思考数据的方式匹配，调试方法将变得更容易。是的……你浪费了\
  \ 4 个字节。大不了什么。现在每台电脑都配备了海量内存。\n\n教训很简单：以你（以及任何可能需要支持你的代码的人）理解的方式来组织数据。\n\n# clsDates\
  \ 设计\n\n现在使用你的一些设计思路来实现 `clsDates` 的设计。`clsDates` 的代码显示在 `Listing 9-4` 中。\n\n\n\n\
  \n\n```cs\n using System;\nusing System.Collections.Generic;\nusing System.Text;\n\
  \npublic class clsDates\n{\n    // =============== 符号常量 ==================\n\n \
  \   // =============== 静态成员 ======================\n    private static int[] daysInMonth\
  \ = { 0, 31, 28, 31, 30, 31, 30, 31,\n                                        31,\
  \ 30, 31, 30, 31};\n\n    // =============== 实例成员（属性） =====================\n  \
  \  private int day;\n    private int month;\n    private int year;\n    private\
  \ int leapYear;\n\n    private DateTime current;\n\n    // =============== 构造函数\
  \ ======================\n\n    public clsDates()\n    {\n        current = DateTime.Now;\
  \ // 将 DateTime 设置为当前\n    }\n    // =============== 属性方法 =====================\n\
  \n    // =============== 辅助方法 =======================\n\n    // ===============\
  \ 通用方法 ======================\n\n    /*****\n     * 目的：判断年份是否为闰年。算法\n     *    \
  \      取自 C Programmer's Toolkit, Purdum, Que Corp.,\n     *          1993, p. 258.\n\
  \     *\n     * 参数列表：\n     *    int year      要考虑的年份\n     *\n     * 返回值：\n   \
  \  *    int           闰年为 1，否则为 0\n     *****/\n\n    public int getLeapYear(int\
  \ year)\n    {\n        if (year % 4 == 0 && year % 100 != 0 || year % 400 == 0)\n\
  \            return 1;   // 是闰年\n        else\n            return 0;   // 不是。\n\
  \    }\n\n    /*****\n     * 目的：根据年份确定复活节日期。算法\n     *          取自 C Programmer's\
  \ Toolkit, Purdum, Que Corp.,\n     *          1993, p. 267.\n     *\n     * 参数列表：\n\
  \     *    int year      要考虑的年份\n     *\n     * 返回值：\n     *    string        MM/DD/YYYY\
  \ 格式的日期\n     *****/\n    public string getEaster(int year)\n    {\n        int\
  \ offset;\n        int leap;\n        int day;\n        int temp1;\n        int\
  \ temp2;\n        int total;\n\n        offset = year % 19;\n        leap = year\
  \ % 4;\n        day = year % 7;\n        temp1 = (19 * offset + 24) % 30;\n    \
  \    temp2 = (2 * leap + 4 * day + 6 * temp1 + 5) % 7;\n        total = (22 + temp1\
  \ + temp2);\n        if (total > 31)\n        {\n            month = 4;        \
  \    // 复活节在四月……\n            day = total - 31;   // ……在这一天\n        }\n       \
  \ else\n        {\n            month = 3;            // 复活节在三月……\n            day\
  \ = total;        // ……在这一天\n        }\n        DateTime myDT = new DateTime(year,\
  \ month, day);\n        return myDT.ToLongDateString();\n    }\n}\n```\n\n# 命名空间修饰符\
  \ (Modifier)\n\n如果你仔细查看 Listing 9-4，你会发现我从 `clsDates` 代码中删除了以下（默认）语句：\n\n```\n namespace\
  \ ClassDesign\n       {\n       }\n```\n\n为什么呢？原因是你希望你的 `clsDates` 类可以在你可能开发的其他程序中使用，而无需你必须将项目的命名空间作为类层次结构的一部分。例如，如果你保留了命名空间行并想创建一个名为\
  \ `myDate` 的对象，如果该类来自不同的命名空间，你必须使用以下语句定义它：\n\n```\n ClassDesign.clsDates myDate\
  \ = new ClassDesign.clsDates();\n```\n\n这种语法看起来有点繁琐。通过移除 `clsDates` 中的命名空间语句，你可以使用此语句定义对象：\n\
  \n```\n clsDates myDate = new clsDates();\n```\n\n这种语法结构被更为常用，尽管可能存在与另一个使用 `clsDates`\
  \ 作为类名的类发生命名空间冲突的微小风险。如果你想将命名空间保留作为类定义的一部分，那是可以的。只需记住在定义该类的对象时提供完整的层次结构即可。\n\n#\
  \ 类组织 (Class Organization)\n\n在 Listing 9-4 中，你可以看到我如何添加注释来划分类的不同部分。这些部分（从上到下）是：\n\
  \n*   符号常量\n*   类的静态成员\n*   实例成员\n*   构造函数\n*   属性方法\n*   辅助方法\n*   通用方法\n\n对于类的这种组织并没有板上钉钉的规定。然而，这是多年年来我在编写商业应用时被证明有效的组织结构。关于这种组织，有几点说明是必要的。\n\
  \n### 静态数据对比 实例成员 (static Data Versus Instance Members)\n\n注意属性被划分为静态和非静态部分。正如本章较早部分提到的，静态数据在程序加载时创建。这意味着，即使程序从未到达定义\
  \ `clsDates` 对象的点，`daysInMonth` 也存在。\n\n### 实例成员 (Instance Members)\n\n实例成员是为每个对象创建的。\n\
  \n### 属性和辅助方法 (Property and Helper Methods)\n\n这些方法将在第 10 章中进行解释并单独设置。\n\n### 通用方法\
  \ (General Methods)\n\n通用方法是构成 API 的部分。\n\n#### 通用方法头 (General Method Headers)\n\
  \n对于非简单的通用方法，通常使用如 Listing 9-4 所示的头：\n\n``` /*****\n * 目的：判断年份是否为闰年。算法\n *     \
  \     取自 C Programmer's Toolkit, Purdum, Que Corp.,\n *          1993, p. 258.\n\
  \ *\n * 参数列表：\n *    int year      要考虑的年份\n *\n * 返回值：\n *    int           闰年为\
  \ 1，否则为 0\n *****/\n public int getLeapYear(int year)\n {\n```\n\n方法的头只需说明方法的目的、传递给它的参数列表（如果有）以及返回数据类型（如果有）。如果方法使用了某些算法，且你认为可能需要引用它，请将该引用放在方法头中。注意我使用了多行注释字符来划分方法头。\n\
  \n### 动手尝试：clsDates 程序 (Try It Out: The clsDates Programs)\n\n现在你已经写好了 `clsDates`\
  \ 类的代码，请编写一个可以测试该类的表单代码。之前的运行示例见 图 9.1。此外，你已经创建了项目并将必要的类文件添加到项目中。因此，现在你只需要对代码的工作原理进行更详细的解释。\n\
  \n工作原理 (How It Works)\n\n`frmMain` 类的代码如 Listing 9-5 所示。\n\nListing 9-5: clsDates\
  \ 的测试程序。(frmMain.cs)\n\n\n\n\n\n```cs\n using System;\nusing System.Windows.Forms;\n\
  \npublic class frmMain : Form\n{\n    private TextBox txtYear;\n    private Button\
  \ btnCalc;\n    private Button btnClose;\n    private Label lblLeapYearResult;\n\
  \    private Label lblEasterResult;\n    private Label label1;\n    #region Windows\
  \ code\n\n    public frmMain()\n    {\n        InitializeComponent();\n    }\n\n\
  \    public static void Main()\n    {\n        frmMain main = new frmMain();\n \
  \       Application.Run(main);\n    }\n\n    private void btnCalc_Click(object sender,\
  \ EventArgs e)\n    {\n        bool flag;\n        int year;\n        int leap;\n\
  \        clsDates myDate = new clsDates();\n\n        // Convert validate integer\n\
  \        flag = int.TryParse(txtYear.Text, out year);\n        if (flag == false)\n\
  \        {\n            MessageBox.Show(\"Digit characters only in YYYY format.\"\
  ,\n                            \"Input Error\");\n            txtYear.Focus();\n\
  \            return;\n        }\n        leap = myDate.getLeapYear(year);\n    \
  \    lblLeapYearResult.Text = year.ToString() + \" is \" +\n                   ((leap\
  \ == 1)? \"\":\"not \") + \"a leap year\";\n        lblEasterResult.Text = myDate.getEaster(year);\n\
  \    }\n\n    private void btnClose_Click(object sender, EventArgs e)\n    {\n \
  \       Close();\n    }\n}\n```\n\n在 Listing 9-5 中没什么内容是你以前没见过的。注意 `myDate` 的定义：\n\
  \n```\n clsDates myDate = new clsDates();\n```\n\n由于你已经从 `clsDates` 代码中删除了命名空间属性，你可以简单地通过类名来实例化\
  \ `myDate` 对象。`TryParse()` 和 `if` 语句块将存储在 `txtYear` 对象 `Text` 属性中的文本转换为整数，并将其赋值给名为\
  \ `year` 的变量。该语句\n\n```\n leap = myDate.getLeapYear(year);\n```\n\n调用了 `clsDates`\
  \ 类中名为 `getLeapYear()` 的通用方法，返回 1（闰年）或 0（非闰年），并将此值赋值给 `leap`。为什么我不写 `getLeapYear()`\
  \ 返回一个对于闰年返回 true 否则返回 false 的 bool 呢？毕竟微软是这样写代码的，那些家伙很聪明。那么有什么区别呢？如前所述，原因是程序员经常使用闰年计算来确定特定年份\
  \ 2 月的天数。这让你能够编写如下代码：\n\n```\n int februaryDays = 28;\n// 一些代码. . .\nfebruaryDays\
  \ += myDate.getLeapYear(year);\n```\n\n如果你让代码返回 `bool`，就无法使用这种语句。返回 1 或 0 更符合程序员经常使用闰年计算的方式。（自己编写类的好处是，如果你想的话，可以修改代码。）如果你输入\n\
  \n```\n leap = myDate.\n```\n\nIntelliSense 足够智能，可以向你展示在 `clsDates` 类中定义的方法列表。（注意末尾的点点运算符。在下一章中，你将学习如何让属性也出现在列表中。）下一个语句用于构建一个消息字符串，说明该年份是否为闰年：\n\
  \n```\n lblLeapYearResult.Text = year.ToString() + \" is \" +\n           ((leap\
  \ == 1)?\":\"not \") + \"a leap year\";\n```\n\n该消息字符串随后被赋值给 `lblLeapYearResult`\
  \ 标签对象的 `Text` 属性。老实说，这个语句是 `SOC`（Show-Off Code，炫耀代码）的一个示例。它使用三元运算符来确定消息字符串是如何构建的。如果你研究一下这段代码，你应该能弄明白它是如何工作的。不过，你也可以使用\
  \ `if` 语句来实现同样的功能。（你没有研究代码对吧？如果没有，回去研究……现在！）点击事件中的最后一个语句简单地调用了 `getEaster()`，并将调用返回的字符串写入\
  \ `lblEasterResult` 对象的 `Text` 属性。注意在 `clsDates` 的 `getEaster()` 代码中创建这个字符串是多简单：\n\
  \n```\n DateTime myDT = new DateTime(year, month, day);\nreturn myDT.ToLongDateString();\n\
  ```\n\n只需要两行代码，你就有了一个格式完美的复活节日期字符串。它之所以能这样工作，是因为你使用了重载构造函数，将由复活节算法计算出的月份和日期以及用户提供的年份传进去。名为\
  \ `ToLongDateString()` 的 `DateTime` 方法构建了图 9.7 所示的日期字符串。这里学到的教训是，当你花时间探索你正在使用的类的属性和方法时，生活通常会更容易。\n\
  \n***\n\n# 用户界面对比用户界面\n\n当你谈论用户界面时，需要稍微谨慎。需要谨慎是因为这些术语可以在多个语文中使用。首先，大多数人认为用户界面是程序中与最终用户交互的部分。这种类型的用户界面在表单上呈现视觉对象，就像\
  \ `frmMain` 一直使用的那样。用户随后与 `textbox`、`button`、`listbox` 以及许多其他类型的对象交互。第二种用户界面不需要视觉表示。例如，对于带有对象的表单，用户界面是获取输入和显示结果的主要手段。在这种情况下，用户实际上是程序员。\n\
