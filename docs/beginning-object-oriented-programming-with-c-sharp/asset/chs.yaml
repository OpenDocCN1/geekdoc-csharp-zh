  \ |\n| `GetFileSystemInfos()` | 返回文件和子目录的强类型 `FileSystemInfo`。 |\n| `MoveTo()` |\
  \ 将 `DirectoryInfo` 对象的内容移动到指定路径。 |\n| `Exists` | 返回一个值以指示目录是否存在。 |\n| `Extension`\
  \ | 返回表示文件名扩展名部分的字符串。 |\n| `FullName` | 返回目录或路径的完整路径。 |\n\n通过前三个表格中提供的属性和方法，你可以获得操作目录所需的几乎所有信息。\n\
