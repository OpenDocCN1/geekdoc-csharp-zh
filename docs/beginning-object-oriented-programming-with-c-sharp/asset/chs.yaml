  \ 工作原理\n\n当你创建项目并开始在 Design 模式向表单添加对象后，Visual Studio 会根据你与表单的交互生成代码。例如，考虑来自代码列表\
  \ 18-2 的以下行：\n\n`Default.aspx.cs` 中的代码通常被称为后台文件（code-behind file），因为它是处理信息的 C# 代码，因此是网页背后的工作马。其实现如下：\n\
  \n```csharp\nusing System;\nusing System.Text;\n\npublic partial class _Default\
  \ : System.UI.Page\n{\n    protected void Page_Load(object sender, EventArgs e)\n\
  \    {\n    }\n\n    protected void btnSubmit_Click(object sender, EventArgs e)\n\
  \    {\n        bool flag;\n        decimal amount;\n        decimal interestRate;\n\
  \        decimal months;\n        decimal payment;\n\n        flag = decimal.TryParse(txtAmount.Text,\
  \ out amount);\n        if (flag == false)\n            payment = 0.0M;\n\n    \
  \    flag = decimal.TryParse(txtInterestRate.Text, out interestRate);\n        if\
  \ (flag == false)\n            payment = 0.0M;\n\n        flag = decimal.TryParse(txtMonths.Text,\
  \ out months);\n        if (flag == false)\n            payment = 0.0M;\n\n    \
  \    interestRate /= 1200; // 需要每月的分数\n        decimal temp = (decimal)Math.Pow(1.0\
  \ + (double)interestRate, (double)months);\n        payment = interestRate * amount\
  \ * (temp - 1.0M);\n\n        StringBuilder myPayment = new StringBuilder();\n \
  \       myPayment.AppendFormat(\"${0:F2}\", payment);\n\n        lblPayment.Visible\
  \ = true;\n        txtPayment.Visible = true;\n        txtPayment.Text = myPayment.ToString();\n\
  \    }\n}\n```\n\n\n\n由于该标签对象的名称没有直接在后台文件（code-behind file）中使用，因此 `Label2` 的默认名称是可以接受的。`runat=\"\
  server\"` 属性意味着表单及其相关控件应该在服务器上处理，并且可以通过服务器脚本访问该控件。该行的其余部分内容涉及对象的可见属性。在许多情况下，经验丰富的程序员对这类代码非常熟悉，以至于他们自己写代码的速度比拖放对象要快。\n\
  \n在列表 18-3 中，当网页用户点击提交（Submit）按钮时，会触发 `btnSubmit_Click()` 事件。该方法从几个数据定义开始，然后通过你之前使用的\
  \ `TryParse()` 调用来检查用户是否提供了合理的数据。注意看将此代码添加到项目中是多么简单。文本框中存储的信息实际上位于客户端机器上，但处理是在服务器上进行的。两者之间的通信很大程度上是自动为你处理的。\n\
  \n在验证数据后（这部分可以改进），代码会计算出相应的每月还款。虽然你可以使用其他方法来格式化答案，但使用 `StringBuilder` 对象将还款格式化为带有两位小数的浮点数。（注意使用\
  \ `System.Text` 引用）。代码随后使结果标签和文本框可见，并将格式化后的结果放入 `txtPayment` 文本框中。结果如图 18.10 所示。\n\
  \n图 18.10 显示结果网页\n\n![image](img/c18f010.jpg) 根据用户提供的数据，每月还款额为 $970.12。请记住让这个简单的程序在网页上运行时发生了什么。首先，当用户选择使用贷款计算器时，必须定位到该网页。然后，该页面作为\
  \ HTML 文档发送给用户，并在他们的浏览器中显示。用户随后填写所需的数据，这些数据会被发送回服务器。由于页面包含 ASP.NET 标签，服务器知道应该调用后台文件中的按钮点击事件进行处理。这是因为在提交按钮的属性列表中存在\n\
  \n```\nOnClick=\"btnSubmit_Click\"\n```\n\n该属性告诉服务器当用户点击提交按钮时应该调用哪种方法。在 C# 代码完成工作后，页面将重新重新格式化为\
  \ HTML 页面并返回给用户查看。\n\n***\n\n# 总结\n\n尽管内容相当简单，但本章展示了如何使用 Visual Studio 构建动态网页。除了这里介绍的方法，还有许多方法可以构建视觉上更有趣的网页。正如本章开头所述，网页编程值得写一本书。（你应该考虑由\
  \ Imar Spaanjaars 编写的 Wrox 书籍 *Beginning ASP.NET 4*: *in C*# *and VB* (Wrox, 2010)。这本备受好评的书有\
  \ 800 多页的内容，介绍了如何为网络编写程序。）然而，这里的目标仅仅是让你能够开始研究 C# 编程中的这一流行元素。\n\n# 练习题\n\n你可以在附录\
  \ A 中找到以下练习题的答案。\n\n**1.** 什么是网页？\n**2.** 静态网页和动态网页的区别是什么？\n**3.** 后台文件（code-behind\
  \ file）这一术语指的是什么？\n**4.** 查看列表 18-3 中的代码，找到它是 SDC 的原因。\n**5.** 鉴于第 4 题暗示程序可能会，你会如何修复它？\n\
  \n### 本章学到的知识\n\n| 主题 | 关键点 |\n| :--- | :--- |\n| **网页** | 能够在网页浏览器中渲染的 HTML 文档。\
  \ |\n| **Web ** | 控制网页浏览器的对象。 |\n| **Web 服务器** | 为客户端提供服务的硬件。它可能负责页面处理，也可能不负责。 |\n\
  | **静态与动态网页** | 静态网页的 HTML 内容是不变的。动态网页可以响应用户（或其他）的输入并相应地更改页面渲染。 |\n| **后台文件** |\
  \ 包含 ASP.NET 可以处理的 C# 代码的文件，从而提供了更改返回给客户端网页的能力。 |\n\n# 附录\n\n练习答案\n\n# 第 2 章\n\n\
  ## 练习 1 答案\n\n类（Class）是包含描述对象的属性和方法的实体。对象（Object）是类的实例，可以在程序中使用。类和对象之间是有关联的，因为类是创建对象的模板。它们的区别在于，类不直接在程序中使用，而对象可以。\n\
  \n## 练习 2 答案\n\n程序的五个步骤：\n\n*   `Initialization`（初始化）步骤创建程序运行的环境。\n*   `Input`（输入）步骤负责收集程序完成既定任务所需的所有信息。\n\
  *   `Process`（处理）步骤获取数据并以完成既定任务的方式对其处理。\n*   `Output`（输出）步骤以对用户的方式展示处理步骤的结果。\n*\
  \   `Termination`（终止）步骤负责将环境恢复到之前的状态。\n\n## 练习 3 答案\n\n第一语句定义了一个可以访问 `clsThingie`\
  \ 对象的引用。第二语句实例化 `clsThingie` 对象并可以使用其属性和方法。\n\n## 练习 4 答案\n\n简单的烤箱可能有以下属性和方法：\n\n\
  ```csharp\n// ================ 属性 ===\nint ovenTemp;          // 0 表示关闭，否则为温度\n\
  int ovenOnOff;         // 0 表示关闭，1 表示开启\nint ovenLight;         // 0 表示关闭\nint frontLeftBurner;\
  \   // 0 表示关闭，否则为开启\nint frontRightBurner;\nint backLeftBurner;\nint backRightBurner;\n\
  int minutesToBake;     // 烤箱计时器\n// ================ 方法 =================\npublic\
  \ int TurnOvenOn(int ovenTemp);\npublic int TurnOvenOff();\npublic int SetTimer(int\
  \ minutes);\npublic int TurnFrontLeftBurner(int leftBurner);\npublic int TurnFrontRightBurner(int\
  \ rightBurner);\npublic int TurnBackLeftBurner(int leftBurner);\npublic int TurnBackRightBurner(int\
  \ rightBurner);\npublic int OverLight(int light);\nprivate int ReadTimer();\npublic\
  \ int SelfClean(); // 设置最高温度一小时并关闭\n```\n\n## 练习 5 答案\n\n良好的界面应该：\n\n*   对用户直观\n\
  *   易于获取所需信息\n*   以优雅的方式处理用户输入错误\n\n## 练习 6 答案\n\n对于为什么要学习 OOP，这个问题没有*正确*的答案，但你可能会发现回答这个问题是有益的。\n\
  \n## 练习 7 答案\n\n例如，在设计视图中点击 `frmMain` 并更改表单的颜色，看看会发生什么。\n\n# 第 3 章\n\n## 练习 1 答案\n\
  \n无符号数据类型本质上使其对应的符号数据类型可以存储的最大正数翻倍。无符号属性仅适用于整数数据类型。\n\n## 练习 2 答案\n\n除了以下项，其他都是合法的：\n\
  \n*   9WaysToSunday：非法，因为它以数字开头\n*   Ms.Mini：非法，因为它包含标点符号（点）\n*   Extern：非法，因为它是\
  \ C# 的关键字\n*   My#Eye：非法，因为它包含保留符号（#）\n\n## 练习 3 答案\n\n\n\n\n\n看来 `txtInput` 是一个文本框对象。第一个点运算符让你获取了\
  \ `Text` 对象。由于 `Text` 是一个 `String` 对象，下一个点运算符允许你访问 `Text` 对象的 `Length` 属性。因此，`Length`\
  \ 告诉文本框中文本字符串的长度。然后该值被赋值给 `len`。\n\n## 练习 4 答案\n\n首先，`float` 数据类型使用 4 字节存储，而 `double`\
  \ 使用 8 字节。其次，`double` 的数值范围几乎是 `float` 的 10 倍。第三，`float` 只有 7 位精度，而 `double` 有 15\
  \ 位。\n\n## 练习 5 答案\n\n```\nconst int SNAKEEYES = 2;  // 两个骰子的最小值\nconst int BOXCARS\
  \ = 12;   // 两个骰子的最大值\n\nint ThrowDice()\n{\n    Random rnd = new Random();\n  \
  \             // 加 1 是因为它是排他的性的\n    return rnd.Next(SNAKEEYES, BOXCARS + 1); \n\
  }\n```\n\n## 练习 6 答案\n\n使用 `decimal` 数据类型，其精度为 28 位，而 `double` 为 15 位。\n\n# 第 4\
  \ 章\n\n## 练习 1 答案\n\n你可以在源代码文件的大多数位置设置断点。但是，你不能在空行、使用 `using` 关键字的行或以注释字符开头的行上设置断点。可能存在其他无法设置断点的上下文。\n\
  \n## 练习 2 答案\n\n按钮点击事件的代码为：\n\n```c\n private void btnCalc_Click(object sender,\
  \ EventArgs e)\n  {\n    bool flag;\n    double operand1;\n    double answer;\n\n\
  \         //                    输入步骤\n         // 检查第一个输入...\n    flag = double.TryParse(txtOperand1.Text,\
  \ out operand1);\n    if (flag == false)\n    {\n      MessageBox.Show(”输入华氏温度”,\
  \ “输入错误”);\n      txtOperand1.Focus();\n      return;\n    }\n\n         //    \
  \                 处理步骤\n\n    answer = 5.0 / 9.0 * (operand1 – 32);\n\n        \
  \ //                     显示步骤\n    txtResult.Text = operand1.ToString() + “ 是 ”\
  \ + \n                      answer.ToString() + “ 摄氏度”;\n    txtResult.Visible =\
  \ true;\n\n  }\n```\n\n代码中有三个魔数，你可以将它们替换为：\n\n```c\nconst double RATIO5OVER9 = .555555555555555;\
  \ // 公式中的 5.0 / 9.0\nconst double FREEZEWATER = 32.0;\n公式随后变为：\n    answer = RATIO5OVER9\
  \ * (operand1 – FREEZEWATER);\n```\n\n第一个常量的唯一优势是除法速度很慢，在紧凑循环中，常量可以避免除法操作。此外，相比魔数，常量更容易阅读和理解。第二个注释仅仅是定义了水的冰点。\n\
  \n## 练习 3 答案\n\n`lvalue` 是已定义变量的内存地址。`rvalue` 是存储在该内存地址上的内容。如果变量的 `lvalue` 为 `null`，则该变量未定义，因此该条目仅是数据项的属性列表。这是一种数据声明。非空的\
  \ `lvalue` 意味着变量已定义。在这种情况下，数据项具有属性列表，但存在于内存中并已定义供程序使用。\n\n## 练习 4 答案\n\n桶的大小取决于定义的数据类型。桶必须足够大，以容纳与数据项相关的字节数。桶类比（Bucket\
  \ Analogy）的关键元素是：\n\n* 桶的内存位置是数据项的 `lvalue`。\n* 桶的内容是数据项的 `rvalue`。\n* 桶的大小等于在内存中存储数据项所需的字节数。\n\
