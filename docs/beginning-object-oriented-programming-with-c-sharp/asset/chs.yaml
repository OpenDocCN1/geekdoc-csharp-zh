  \ 的字体，使用等宽字体（`Courier New`）而不是真字体（True Type font）。\n\n## 编辑记录 (UPDATE)\n\n在某个时刻，你可能想要更改数据库中的某条目。人们会搬家、更改地址、结婚并改姓。当此类事件发生时，你可能需要更改某个数据表中的数据。当你想要编辑已存储在数据库中的信息时，就会使用\
  \ `UPDATE` SQL 命令。图 14.17 显示了用于编辑 `Friends` 表中朋友的表单。\n\n图 14.17 编辑数据库记录\n\n![image](img/c14f017.jpg)\n\
  \n当表单首次显示时，所有字段都是空的。如果你知道要编辑的朋友的记录号，可以在最顶部的文本框中输入该记录号。（你可以使用 `Report` 菜单选项来查找合适的记录号。）如果你不知道记录号，代码也接受事人的姓氏作为搜索标准。如果没有数据，且你在\
  \ `Last Name`（姓）文本框中输入 `Yourfriend` 并点击 `Find`（查找）按钮，其余数据将会显示（请参考图 14.17）。虽然这可能并不明显，但\
  \ `Last Contact`（最后联系）字段是被禁用的，这意味着你不能编辑该字段。这是应该的，因为该数据是由卡片的交换决定的。\n\n代码列表 14-6 显示了与\
