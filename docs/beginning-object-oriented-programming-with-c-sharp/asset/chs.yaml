  \ > SYSTEMDBTYPES)\n            cmbDatabase.Items.Add(row[\"database_name\"].ToString());\n\
  \    }\n}\ncmbDatabase.SelectedIndex = 0;\n```\n\n注意代码段开头的 `using` 语句。在此之前，你一直使用\
  \ `using` 关键字来向程序引入引用。当像此代码段所示实现 `using` 时，它会影响操作系统处理作为 `using` 语句一部分的变量的方式。\n\n\
  记住，当变量超出作用范围时，该变量使用的内存可以被 Windows 回收并重用于其他其他程序数据。这个过程被称为*垃圾回收*（garbage collection），它由\
  \ Windows 管理，你通常无法控制 Windows 何时决定清理垃圾。然而，使用 `using` 语句创建数据（例如，`sqlConn`）意味着一旦包含该数据的作用域结束，Windows\
  \ 就可以立即释放与数据相关的资源。由于 SQL 资源相当沉重，因此在这种在这种下使用 `using` 语句是有意义的。当语句块终止时，`cmbDatabase`\
  \ 组合框包含了所选服务器上注册的所有数据库列表。这就是为什么你没有将连接的 `Close()` 调用封装在 `finally` 语句块中；即使抛出异常，资源也将释放。（只有当存在\
  \ `IDisposable` 接口时，才能这样使用 `using` 语句。）\n\n## 向表中添加记录 (INSERT INTO)\n\n你通过“借用”并稍微修改第\
