  \n错误信息为：\n\n```\n未赋值局部变量 ‘x’\n```\n\n问题在于 C# 不允许返回一个未显式赋值的变量。在代码中，`x` 只有在 `if` 语句为真时才会赋值。要解决这个问题，你必须显式地为\
  \ `x` 赋值。最简单的修复方法是修改 `x` 的定义：\n\n```\nint x = 0;\n```\n\n## 练习 2 答案\n\n这里的问题不在于你不能正确编写方程，而是你没有让它对其他人易读。第一种解决方案可能是：\n\
  \n```\np = a  * 1 / (Math.Pow(1 + i, y));\n```\n\n代码可以编译并为 `p` 生成正确的值。然而，你更愿意调试上面的语句还是下面这一个？\n\
  \n```\npresentValue = futureAmount  * 1.0 / (Math.Pow(1.0 + interestRate,\n    \
  \                                            yearsIntoFuture));\n```\n\n主要的区别在于使用了有意义的变量名。另一个优点是使用了数值常量（`1.0`），这反映了方程中使用了浮点值。虽然你可以辩称由于这是一个财务计算，应该使用\
  \ `decimal` 数据类型。但是，`pow()` 方法使用的是 `double` 数据类型，因此你可能会将此方程封装放入一个返回 `double` 的方法中，并让用户根据需要决定是否将其强制转换为\
  \ `decimal`。\n\n另一种让调试变得简单一点的替代方案是：\n\n```\ndiscountFactor = 1.0 / (Math.Pow(1.0\
  \ + interestRate,\n                                 yearsIntoFuture));\npresentValue\
  \ = futureAmount  * discountFactor;\n```\n\n这种形式使用中间值（`discountFactor`）来简化代码。这种变体还允许你生成现值折现因子，其值可以在出版的表中找到。这使得生成测试数据变得更容易。\n\
  \n## 练习 3 答案\n\n你没有使用这种变量定义风格，是因为它不利于变量的初始化和文档化。优点是按键击次数较少。但这理由还不足以支持使用那种风格。你应该使用：\n\
  \n```\nlong number = 2;  // 参数个数\nlong val;         // 方案的值\nlong len;         //\
  \ 钢条的长度\n```\n\n单语句定义阻碍了此类注释的编写。如果你坚持使用短格式，你仍然可以使用以下方式对代码进行注释：\n\n```\nlong number\
  \ = 2,  // 参数个数\n     val,         // 方案的值\n     len;         // 钢条的长度\n```\n\n\
  注意 `number` 定义后的逗号。\n\n## 练习 4 答案\n\n这可能是“见木不见树”问题的一个例子。希望你检查了明显的错误来源（例如，虚假的输入值），而那些没有显示任何有用的信息。盯着代码看久了以至于不再能仔细阅读代码以观察它的功能，这并不罕见。也就是说，你读了代码太多次，你的大脑已经识别了代码的模式，你深信\
  \ bug 不可能在那些熟悉的代码行中。也许……也许不是。\n\n对于“不可能的 bug”问题，我的第一个行动是让别人看看代码。另一个程序员在几分钟内发现程序\
  \ bug 并不罕见，尽管你已经盯着它看了好几天。如果你没有可以寻求帮助的程序员，就去休息很长时间（至少 1 小时）。有时，这能让你的大脑暂时忘记问题足够的时间，以至于当你回来时，你实际上是在重新阅读代码。\n\
  \n另一种技术是在你显示（错误的）答案之前强制抛出异常，并设置一个执行堆栈跟踪（stack trace）的 catch 块。因为堆栈跟踪显示了生成答案时进行的方法调用，你应该使用你的测试数据集按照堆栈跟踪中呈现的顺序检查每个方法。（记住，堆栈跟踪按从最后到第一个的反序显示方法调用。这意味着你正在从“输出步骤”向“输入步骤”工作，对于程序的五个步骤而言。）通过手动计算每个方法调用应该产生的值，你应该隔离出引起错误的方法。然后只需专注于每个方法中应该生成什么测试值，直到你隔离出\
  \ bug。修复 bug 通常是一个简单的过程。耗费时间的是隔离过程。\n\n## 练习 5 答案\n\n我已经到了这样一个地步：我坚持要求他们在任何程序的“处理步骤”中使用\
  \ `try-catch` 块。这是最底限的要求。我还告诉他们，任何涉及文件或数据库 I/O 的方法必须封装在 `try-catch` 块中。作为一个一般原则，程序中可能潜伏异常的最危险的地方是“输入步骤”和“处理步骤”。\n\
  \n我有时问我的学生，如果他们的代码是管理航天飞器的关键任务软件，他们将如何重写作业。他们总是会提供如何“紧凑”他们的代码使其不易出错的想法。\n\n# 第 12\
  \ 章\n\n## 练习 1 答案\n\n泛型的主要优势是它们在不牺牲类型检查的情况下提供了数据灵活性。另一个优点是泛型可以避免与装箱（boxing）和拆箱（unboxing）相关的开销。对于必须执行装箱拆箱过程的代码来说，泛型提供\
  \ 100% 的性能提升并不罕见。最后，缺乏泛型几乎意味着你的代码必须使用大量的强制转换来适应灵活的编码。使用泛型避免了这种“转换麻烦”。\n\n## 练习 2\
  \ 答案\n\n你做的第一件事是按照以下思路修改 `ShowData()` 方法：\n\n```\n private void ShowData<T>(T[]\
