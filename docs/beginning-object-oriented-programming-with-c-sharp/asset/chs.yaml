  \ 键序列来代替使用鼠标点击退出按钮。在这个示例中，字母 `X` 是替代点击退出按钮的“热键”（或加速键）选项。*热键*允许使用户在没有鼠标设备的情况下仅使用键盘运行程序。同样的解释也适用于\
  \ `btnDisplayOutput` 按钮中的字母 `D`。也就是说，用户可以按 `Alt+D` 而不是点击显示按钮。\n\n如前所述，编程风格约定是用特定前缀作为对象名称开头。例如，文本框名称以\
  \ `txt` 开头，按钮名称以 `btn` 开头。前缀后面跟着一个描述对象的名称，例如用于用户名的 `txtName`、地址的 `txtAddress` 等。前缀后使用的对象名称首字母大写。在对象和变量名称中使用大写字母作为子名称的做法被称为*驼峰命名法*（Camel\
  \ Notation）。你可以在表 2.2 所示的对象名称中使用驼峰命名法（例如 `btnDisplayOutput`）。驼峰命名法更容易阅读和理解对象及变量名称。你将在第\
  \ 3 章学习更多关于对象和变量名称的内容。\n\n***\n\n## 对 btnDisplayOutput 点击事件代码的批判\n\n`btnDisplayOutput`\
  \ 点击事件中的程序代码是我称之为 *RDC*……非常愚蠢的代码（Really Dumb Code）的示例。这是出于几个原因。首先，没有对用户在各种文本框中输入的内容进行任何验证。为了让程序代码更智能，你应该添加代码来验证文本框中是否输入了内容，以及数据是否符合所需的信息。例如，如果你想验证邮政编码文本框对象的\
  \ `Text` 属性内容，也许你应该检查是否只输入了数字字符。或者如果字母和数字字符混合，也许你应该检查是否恰好输入了六个字符。这样你也可以允许加拿大的邮政编码，因为那些代码同时使用了字母和数字字符。\n\
  \n第二个改进将是让输出稍微易读一些。如果你仔细观察图 2.16 中的输出，你会发现字段没有正确对齐。尽管你已经在程序语句中通过在每个字段前使用适当数量的空格来对齐姓名、地址和城市字段，但依然如此。为什么这不起作用呢？\n\
  \n原因是标签对象的默认 `Font` 属性被设置为微软正无衬线字体（Microsoft Sans Serif）。这被称为 TrueType 字体。TrueType\
  \ 字体是一种等比例字体（variable-spaced font）。这意味着*TrueType 等比例字体*中的每个字符占据的屏幕空间仅为其在显示设备上可见所需的空间。例如，字母\
  \ `I` 在屏幕上占据的空间比字母 `W` 少。因此，由于不同的字母占据的空间不同，很难让不同行之间的字母相互对齐。\n\n你可以通过将字体更改为等宽字体来解决这个对齐问题。使用*等宽字体*（fixed\
  \ font），每个字母占据占据完全相同的空间。如果你将 `txtDisplayOutput` 对象的 `Font` 属性更改为 `Courier New` 字体（一种等宽字体），字母就会完美对齐。你可以通过比较[图\
  \ 2.16](#9781118416471c02.xhtml_c02_fig_0016）与[图 2.17](#9781118416471c02.xhtml_c02_fig_0017）中的显示输出，看到字体更改的结果。\n\
  \n\n\n\n\n[wrox.com](http://wrox.com) 本章代码下载\n\n你可以在 [wrox.com](http://wrox.com)\
  \ 的“Download Code”选项卡下通过 [www.wrox.com/remtitle.cgi?isbn=9781118336922](http://www.wrox.com/remtitle.cgi?isbn=9781118336922)\
  \ 找到本章的代码下载。`Chapter03` 文件夹中的代码根据本章中的名称进行了单独命名。\n\n正如你在第 2 章中学习到的，大多数计算机程序都是以解决问题为中心：接收一种形式的数据，以某种方式对其转换，然后将这些新数据呈现给用户。计算机处理的数据可以以许多不同的形状和大小存储。完成本章后，你将很好理解为什么\
  \ C# 为你提供了如此灵活的数据类型选择能力。\n\n# 计算机数据\n\n计算机程序通常以一种形式输入数据，对其进行处理，然后在计算机屏幕上显示新数据。这引出了一个问题：什么是数据？简单来说，`data`\
  \ 就是信息。计算机数据是存储在变量中供程序使用的信息。从广义上说，计算机数据有两种基本类型：数值数据和文本数据。\n\n`Numeric data`（数值数据）是可以任何进行算术运算的数据。你可以对数值数据进行加、减、乘、除。你还可以对数值数据执行其他操作，例如计算数值的平方根、正弦或余弦等。你还会看到数值数据类型被称为\
  \ `value types`（值类型）。该术语的精确含义将在第 5 章中讨论。不过，目前你可以将它们想成那些变量可以直接存储数据的数据类型。\n\n`Textual\
  \ data`（文本数据）是数据的字符表示。你的名字就是一段数据，它可以在程序中以文本的形式表示。当你问学生邮政编码（ZIP code）是数值还是文本信息时，有些学生会感到困惑。因为邮政编码通常不在数学表达式中进行处理（例如，你不需要乘以或除以邮政编码），它们通常被视为文本信息。\n\
  \n## 整数数据类型\n\n`integer data type`（整数数据类型）是任何表示为整数的数值值。整数值不能带有小数部分。如果你尝试给整数变量分配一个小数值，C#\
  \ 会截断该值。例如，如果 `val` 是整数数据类型，则语句\n\n```\nval = 6.9999;\n```\n\n会将值 6 赋值给 `val`。这意味着对小数值进行整数运算不会四舍入这些值，而是对其进行截断。也就是说，如果整数数据类型有一个小数值，C#\
  \ 会简单地丢弃小数部分。\n\nTable 3.1 列出了你可以在程序中使用的各种整数数据类型。\n\n**Table 3.1 整数数据类型\n\n![image](img/c03tnt001.jpg)\n\
  \n如你在 Table 3.1 中看到的，某些数据类型带有字母 `s` 前缀（`sbyte`），而另一些则带有字母 `u` 前缀。`s` 表示数据是有符号数量，而\
  \ `u` 表示它们是无符号数量。（下一节将解释为什么这些很重要。）\n\n数据后缀用于告诉编译器表达式中所使用的数据类型。例如，\n\n```\nlong bigNum;\n\
  // some code\nbigNum = 15L;\n```\n\n这告诉编译器该数值常量是表示为 `long` 的 15。如果不使用该后缀，编译器可能会报错说正将一个\
  \ `int` 赋值给 `long`。此外，尽管编译器识别小写后缀，但你应该使用大写后缀。它们更容易识别，而且小写的 `l` 看起来非常像数字 `1`，可能会让调试变得比预想的更困难。\n\
  \n### 整数数据类型的范围\n\n每个整数数据类型都有其可以容纳的值范围。考虑 `byte` 数据类型，它使用 8 位。`binary digit`（二进制位，或\
  \ `bit`）是计算机存储的最小单位，可以取值为开（1）或关（0）。因为只有两种可能的状态，所以信息是以二进制（或  2 进制）存储在计算机中的。尽管你使用十进制系统进行数学运算，但计算机更偏于二位进制。\n\
  \n从工程角度来看，将位分组为一个较大的单位（称为 `byte`，字节）更为方便。一个 `byte` 是 8 位的集合。因为每个位有两个可能的值，所以一个 `byte`\
  \ 可以有 $2⁸$ 或 256 种独特的组合。如果你参考 Table 3.1，你可以看到 `byte` 数据类型可以表示从 0 到 255 的值。\n\n###\
  \ 理解二进制数\n\n等一下！8 位可以表示 256 个值，而不是 255？那么为什么 `byte` 的范围限制在 255？原因是 8 位可以表示 256 个独特的值。由于\
  \ 8 位可以表示 256 个独特的值，且其中一个值是零。因此，如果所有位都开启，`byte` 的值为 255。Table 3.2 进一步阐明了位与其对应值之间的关系。\n\
  \nTable 3.2 位位置与等等值\n\n![image](img/c03tnt002.jpg)\n\n参考 Table 3.2，你可以看到 `byte`\
  \ 的数值取决于哪些位被开启。例如，对于值 73，你看到\n\n```\n01001001\n```\n\n解释为\n\n```\n0 + 64 + 0 + 0\
  \ + 8 + 0 + 0 + 1\n```\n\n总和为 73。如果所有位都开启，`byte` 为：\n\n```\n11111111\n```\n\n变为：\n\
  \n```\n128 + 64 + 32 + 16 + 8 + 4 + 2 + 1\n```\n\n总和为 255。\n\n### 有符号整数值\n\n给定这些信息，为什么\
  \ `sbyte` 的最大值限制为 128？原因是 `sbyte` 数据类型是有符号字节。因为它是有符号的，`sbyte` 数据可以假正正或负值。字节的最高位（第\
  \ 7 位）用于存储数字的符号。对于有符号数，高位被称为符号位。如果符号位开启，则表示负数。如果符号位关闭，则表示正数。由于符号位的存在，只有 7 位（$2⁷$\
  \ 种组合）可用而不是 8 位（$2⁸$）。因为 $2⁷$ 是 128，所以只有 128 个独特的值，由于其中一个值是零，最大的正值是 127。如果符号位开启，你仍然有\
  \ 128 个独特的值可用，且它们都可以是负值。这是因为你已经在正值范围内考虑了 0 这个值。这意味着负值范围从 -1 到 -128。参考 Table 3.1，你可以看到，如果许可值范围从\
  \ 0 开始，该整数数据类型就不使用符号位。如果范围包含负值，它就会使用符号位。你还可以看到，使用符号位的整数数据类型的最大值大约是其相应的无符号数据类型的一半。\n\
  \n## 你应该使用哪种整数？\n\n在使用哪种整数数据类型时面临一个问题。没有单一的正确答案。然而，有几个因素需要注意：\n\n\n\n\n**数值范围**：如果你只对统计一个人口中健康牙齿的数量，那么\
  \ `byte` 数据类型就足够了。另一方面，如果你测量当天的最高温度，如果你的样本区域同时包括死亡谷和阿拉斯加州的朱诺，那么即使是 `sbyte` 范围可能都不够。务必宁大就全，以确保你有足够的范围来满足你的需求。\n\
  \n- **内存限制**：对于你编写的大多数应用程序，你可能至少有半 GB 的内存可可用。如果你选择 `long` 数据类型而不是 `int`，那么每个整数值额外使用的\
  \ 4 个字节可能不会占用太多的额外内存。然而，如果你为烤面包机或引擎传感器编写程序，该设备的内存限制可能会具有局限性。在这种情况下，你希望选择一个具有足够范围的最小数据类型来完成工作。\n\
  \n- **处理器考虑**：每台计算机都有一个中央处理单元，它是计算机的心。在 20 世纪 70 年代后期，CPU 具有内部存储单元，称为 `registers`，它们可以以\
  \ 1 字节（8 位）为块处理数据。后来，CPU 寄存器有了 16 位寄存器，然后是 32 位寄存器，最后是 64 位寄存器。可以整齐地放入寄存器中而不增加或丢失位数的整数数据类型，对于\
  \ CPU 执行的数据的某些操作，可能具有轻微的速度优势。这意味着 32 位 CPU 处理 32 位整数的速度实际上比处理 16 位整数更快，即使 16 位整数更小。虽然单次不匹配的性能影响很小，当重复执行数百万次计算时，这可能会产生差异。\n\
  \n- **库考虑**：你已经知道 .NET Framework 为你提供了数千个类。其中一些类包含你可能经常会使用的方法。例如，`math` 类包含一个平方根方法。你将一个数据值发送到该方法，它会将该值的平方根返回给你。大多数数学数学方法（如\
  \ `Sqrt()`、`Cos()` 和 `Pow()`）都要求你向其发送一个 `double` 数据类型（在后文的浮点数据类型部分中讨论），该方法以 `double`\
  \ 类型返回答案。如果是这样，如果数据类型需要与数学类交互，那么让所有数据类型都成为 `double` 是合理的。如果你提供的数据类型与方法期望的类型不匹配，编译器必须在数据到达方法之前生成代码来执行转换。虽然处理这些额外“转换代码”的时间很短，但在涉及许多此类转换的大型程序循环中，时间代价可能是明显的。\n\
  \n- **惯例**：有时，惯例（“习惯”的一个更好听的词）决定了在某些编程结构体中使用的数据类型。例如，在第 8 章中，你学习了使用变量控制循环的程序循环。惯例发现\
  \ `int` 数据类型最常用于控制程序循环。虽然可能有其他使用 `int` 控制循环的理由（例如处理器考虑和原生寄存器大小），但大多数程序员只是在没有过多思考的情况下定义了一个\
  \ `int` 来控制循环。惯例并不一定意味着对数据类型的选择是正确的，但它可能解释为什么许多程序员倾向于在某些编程结构体中使用某些数据类型。\n\n在最终分析中，在选择整数数据类型时，数值范围可能是要考虑的最重要因素。通过积累的经验，你将掌握为当前任务选择合适数据类型的窍门。\n\
  \n### 变量命名规则和惯例\n\n在你创建第一个程序之前，你需要理解程序变量。`variable` 来说是你提供给特定数据的一个名称。在编程的黑暗时代，你可能将整数值存储在内存地址\
  \ `900,000` 处。在那时没有变量名。每当你想要引用该整数值时，只需输入 `900000`。不久后，程序员开始编写编程工具，让他们可以使用符号名称（如\
  \ `operand1`）来表示内存地址，这使得编写程序变得更加容易且更不容易出错，从而导致了变量名的出现。\n\n变量名，也称为 `identifier`，有几条必须遵循的语法规则，以保持\
  \ Visual Studio 编译器满意。这些语法规则如下：\n\n- 变量名只能以字母（a 到 z，A 到 Z）或下划线字符（_`）开头。\n- 不允许使用标点字符和运算符。\n\
  - 变量名不能是 C# 关键字。\n- 第一个字符之后允许数字字符（例如，`Apollo5`，但不是 `5Apollo`）。\n\n虽然这不是一条规则，但你应该始终尝试使用在其使用的语境中有意义的变量名。在前面的代码中，`operand1`\
  \ 比 `o1` 是一个更好的名字，尽管 Visual Studio 接受这两个名字。第二个惯例称为 `camel notation`（驼峰命名法），长变量名以小字母开头，名称中后的每个单词都大写，例如\
  \ `myHatSize`。驼峰命名法使得变量名更容易阅读。`btnCalc_Click()` 事件中的代码遵循了这些关于标记 `operand1`、`operand2`\
  \ 和 `result` 变量的命名规则和惯例。\n\n让我们把你学到的数据类型知识应用到一个使用整数数据的简单程序中。\n\n### 尝试一下：一个使用整数数据的程序\
  \ (Chapter03.zip)\n\n现在编写一个简单的程序，从键盘接受两个值并对这两个值执行数学运算。像既往一样，你需要一个计划来指导你。\n\n\n\n\
  \n| label1 | 第一个输入的文本标签。设置属性为：AutoSize = False, BorderStyle = Fixed3D, Text = 输入第一个整数值,\
  \ TextAlign = MiddleRight |\n| label2 | 第二个输入的文本标签。设置属性为：AutoSize = False, BorderStyle\
  \ = Fixed3D, Text = 输入第二个整数值, TextAlign = MiddleRight |\n| txtOperand1 | 文本框 |\n\
  | txtOperand2 | 文本框 |\n| txtResult | 属性设置为 ReadOnly = True 的文本框 |\n| btnCalc | 按钮，Text\
  \ 属性设置为：&Calculate（计算） |\n| btnExit | 按钮，Text 属性设置为：E&xit（退出） |\n| frmMain | Text\
  \ = \"Integer Division\" StartPosition = CenterScreen |\n\n当你完成后，你的表单看起来应该与 图 3.1\
  \ 相似。\n\n图 3.1 整数数据程序的用户界面\n\n![image](img/c03f001.jpg)\n\n**11.** 在设计视图（Design\
  \ View）中，双击 `btnCalc` 按钮，这将导致 Visual Studio 为按钮点击事件添加存根代码。双击事件会自动切换到源窗口（Source Window）。现在，将列表\
  \ 3-1 所示的按钮点击代码添加到存根代码中。代码是 `Chapter03.ZIP` 文件的一部分。\n\n列表 3-1: 按钮点击事件代码\n\n```cpp\n\
  \ private void btnCalc_Click(object sender, EventArgs e)\n  {\n    bool flag;\n\
  \    int operand1;\n    int operand2;\n    int answer;\n\n         //          \
  \          输入步骤\n         // 检查第一个输入…\n    flag = int.TryParse(txtOperand1.Text,\
  \ out operand1);\n    if (flag == false)\n    {\n      MessageBox.Show(\"输入一个整数\"\
  , \"Input Error\");\n      txtOperand1.Focus();\n      return;\n    }\n\n      \
  \   // 检查第二个输入…\n    flag = int.TryParse(txtOperand2.Text, out operand2);\n    if\
  \ (flag == false)\n    {\n      MessageBox.Show(\"输入一个整数\", \"Input Error\");\n\
  \      txtOperand2.Focus();\n      return;\n    }\n\n         //               \
  \      处理步骤\n    answer = operand1 / operand2;\n\n         //                  \
  \   显示步骤\n    txtResult.Text = operand1.ToString() + \" divided by \" +\n      \
  \                operand2.ToString() +\n                     \" equals \" +answer.ToString();\n\
  \    txtResult.Visible = true;\n\n  }\n\n  private void btnExit_Click(object sender,\
  \ EventArgs e)\n  {\n    Close();\n  }\n```\n\n### 工作原理\n\n当你运行程序时，你会发现操作是在处理步骤（Process\
  \ step）中完成的，该步骤已你绑定到 `btnCalc` 的按钮点击事件。你通过定义一个名为 `flag` 的布尔变量，开始编写 `btnCalc()` 点击事件的代码，紧接着定义了三个\
  \ `int` 类型的整数变量。（布尔变量只能具有与逻辑 true 或逻辑 false 相关的值。这些内容将在本章末尾介绍。）\n\n### 使用 TryParse(\
  \ ) 方法\n\n程序中的下一条语句是：\n\n```cpp\n flag = int.TryParse(txtOperand1.Text, out operand1);\n\
  ```\n\n这条语句看起来可能相当复杂，但实际上并不是。`int.TryParse()` 方法的目的是检查用户从键盘输入的内容，判断该输入是否可以转换为整数数据类型。由于在\
  \ `TryParse()` 之前有关键字 `int`，你你知道它正在尝试将文本数据到整数的转换。等一下！`int` 和 `TryParse()` 之间的点运算符是在做什么的？C#\
  \ 为每种数据类型都提供了一个类。在这个示例中，当你输入关键字 `int` 然后然后输入点运算符时，你可以看到 Visual Studio 弹出一个类似于 图\
  \ 3.2 的小窗口。\n\n图 3.2 int 类属性和方法\n\n![image](img/c03f002.jpg)\n\n如果你仔细观察 图 3.2，你可以看到四行以一个三维立方体开头，两行以正方形开头。立方体代表类方法，而正方形用于类属性。如图所示，`int`\
  \ 类有几个方法，包括 `TryParse()`。因此，在代码语句中，使用点运算符是因为你想调用在 `int` 类中找到 `TryParse()` 类方法。有时，你会看到*包装类*（wrapper\
  \ class）这个术语，它通常意味着某些数据被“封装”在一个类内部。这里显示的 `int` 类是包装类的一个示例。\n\n\n\n\n\n# 调用方法\n\n\
  `calling a method` 一词是指将程序控制引导向方法以执行某些特定任务的过程。你可能还会看到在调用方法时使用 `caller`（调用者）这一术语。`caller`\
  \ 是程序中的一个执行点，而不是某个人或某个实体。\n\n在之前提供的 `btnCalc_Click()` 代码中，在 `operand1`、`operand2`\
  \ 和 `result` 数据定义之后的第一行是对 `int` 对象的 `TryParse()` 方法的调用。为了指代调用 `TryParse()` 方法的过程，程序员可能会说：“btnCalc\
  \ 调用了 TryParse()...”。另一位程序员可能会说：“flag 调用了 TryParse()...”。这两种短语都意味着程序控制离开了当前序列，转而执行\
  \ `btnCalc_Click()` 方法中的语句，即执行在 `TryParse()` 方法中找到语句。\n\n当程序执行完 `TryParse()` 中的语句后，程序控制将传回调用\
  \ `TryParse()` 的点。这种将控制传回方法调用点的过程与 `return to the caller`（返回给调用者）短语相关。\n\n如果方法作为任务的一部分返回某种形式的数据（例如布尔值\
  \ `true` 或 `false`），你可能会听到“方法向调用者返回 true（或 false）”这种说法。在示例中，`TryParse()` 被设计为向调用者返回\
  \ `true` 或 `false` 布尔值。可视化这一发生过程的方法是查看调用 `TryParse()` 方法之前信息的状态：\n\n```\nflag =\
  \ int.TryParse(txtOperand1.Text, out operand1);\n```\n\n这显示了即将发送到 `TryParse()` 的信息。当\
  \ `TryParse()` 完成其对 `txtOperand1.Text` 内容的检查后，它会向调用者返回 `true` 或 `false`。假设用户只输入了数字字符，`operand1`\
  \ 包含用户输入的数值，并向调用者返回 `true`。因此，当程序控制返回到调用者时，语句看起来如下：\n\n```\nflag = true;\n```\n\n\
  这意味着 `TryParse()` 完成了它的工作，将用户的文本输入转换成了现在存储在 `operand1` 中的数值，并向调用者返回了 `true`。这里介绍的术语和短语将贯穿全文。\n\
  \n***\n\n如果用户在文本框中输入了数字以外的内容，`TryParse()` 将无法成功将文本字符转换为数值。在这种情况下，`TryParse()` 将\
  \ `operand1` 设置为 `0` 并返回值 `false`。返回值（`false`）随后被赋值给名为 `flag` 的布尔变量。\n\n你可能会想：“为什么要麻烦向调用者返回\
  \ true 或 false 呢？为什么不在转换失败时直接将第二个参数设置为零就完事了？”问题在于 `0` 是一个合法的整数值，如果值为 `0`，`TryParse()`\
  \ 方法必须能够优雅处理。如果你无论用户输入什么都返回 `0`，你如何知道这个值是好是坏？如果用户想要值为零但不小心按了“o”键，看起来转换成功了，但实际上不应该是。通过从调用中返回一个布尔值，你可以测试转换是否失败。\n\
  \n一个示例可能有助于强化这里的操作。假设用户在 `txtOperand1` 文本框对象中输入了 `1234`。语句行如下：\n\n```\nflag = int.TryParse(txtOperand1.Text,\
  \ out operand1);\n```\n\n它变成了：\n\n```\n?  = int.TryParse(\"1234\", out ?);\n```\n\
  \n`flag` 和 `operand1` 的值显示为问号，是因为在此时它们可能包含未知的垃圾值。在 `TryParse()` 检查了来自 `txtOperand1`\
  \ 文本框对象的输入数据字符串 (1234) 后，它决定可以成功将这些数字字符转换为 `int` 类型的数值。由于转换成功，`TryParse()` 将 `operand1`\
  \ 设置为新值（`1234`）并向调用者返回 `true`。在这种情况下，调用者是接收返回值（`true`）并将其赋值给 `flag` 变量的赋值运算符。最终结果如下：\n\
  \n```\ntrue = int.TryParse(\"1234\", out 1234);\n```\n\n`TryParse()` 第二个参数中的关键字\
  \ `out` 是要求的，它告诉 Visual Studio 即使 `operand1` 尚未初始化为有意义的值，使用它作为参数是可以的。\n\n紧随 `TryParse()`\
  \ 方法调用后的代码会测试 `flag` 变量以查看转换是否成功。如果转换失败，`if` 语句发现 `flag` 为 `false`，程序将执行由 `if` 语句控制的代码。（第\
  \ 6 章详细讨论了 `if` 语句。）只有当 `flag` 变量为 `false` 时，`if` 关键字后面的语句才会被执行：\n\n```\nif (flag\
  \ == false)\n    {\n      MessageBox.Show(\"Enter a whole number\", \"Input Error\"\
  );\n      txtOperand1.Focus();\n      return;\n    }\n```\n\n程序随后创建一个 `MessageBox`\
  \ 对象并使用其 `Show()` 方法在屏幕上显示错误消息。在用户阅读并关闭错误消息后，程序调用 `txtOperand1` 对象的 `Focus()` 方法。调用\
  \ `Focus()` 方法会导致程序将光标放回其文本框。`return` 关键字导致程序离开 `btnCalc` 点击事件代码并重新显示 `frmMain`\
  \ 表单对象。光标停留在 `txtOperand1` 文本框中，等待用户输入正确的整数值。\n\n对 `txtOperand2` 文本框的内容执行相同的检查序列。`TryParse()`\
  \ 方法对 `txtOperand2` `Text` 属性持有的文本数据执行相同的检查。\n\n# 处理并显示结果\n\n在两个操作数都从关联的文本框赋值后，你就准备好执行除法操作了。正斜杠（/）是\
  \ C# 中的除法运算符。这里显示了执行计算并显示结果的代码。\n\n```\nanswer = operand1 / operand2;\ntxtResult.Text\
  \ = operand1.ToString() + \" divided by \" +\n                  operand2.ToString()\
  \ +\n                 \" equals \" +answer.ToString();\ntxtResult.Visible = true;\n\
  ```\n\n\n\n\n\n因为你想使用除法运算符，第一条语句将整数 `operand1` 的值除以 `operand2` 的值。然后，赋值运算符将该除法表达式的结果赋值给名为\
  \ `answer` 的变量。你现在需要做的就是显示 `answer` 让用户查看。然而，你又遇到了“苹果和橘子”的问题。也就是说，`operand1`、`operand2`\
  \ 和 `answer` 都是数值数据，但你需要将它们显示在一个期望数据为文本形式的文本框中。\n\n如前所述，每个给定值类型的变量都有一个与其关联的包装类，该类提供了某些属性和方法。其中一个可用方法即是\
  \ `ToString()`。`ToString()` 方法的作用是将整数对象的当前数值提取并转换为文本数据。你可以将 `ToString()` 视为 `TryParse()`\
  \ 方法的反向操作。在这个示例中，`ToString()` 简单地获取变量 `operand1` 的数值并将其转换为相应的数字字符序列。\n\n在所有三个值都转换为文本后，每个值的文本表示都通过拼接运算符（`+`\
  \ 运算符）连接到下一段文本。在将所有文本拼接后，组合后的文本被赋值给 `txtResult` 对象的 `Text` 属性。`Concatenation`（拼接）是一个高级词汇，意为“附加到”。程序执行的最后一件事是将\
  \ `txtResult` 对象的 `Visible` 属性设置为 true。你这样做是因为在设计用户界面时，将 `Visible` 属性设置为了 false。因此，当用户首次运行程序时，看不到最终显示结果的文本框。尽管这个程序很简单，表单上没有很多“杂乱”，但这种在显示对象包含有用内容之前隐藏显示步骤对象的技术，有助于在用户执行输入步骤时简化用户界面。隐藏文本框还可以防止用户尝试向该文本框中输入内容。\n\
  \n你可能想对你的程序进行一些实验。尝试在 Process 步骤注释后的后的程序语句行中，将数学运算符从除法改为加法（`+`）、减法（`-`）、乘法（`*`）和取模（`%`）。取模运算符\
  \ `%` 会给你除法运算的余数。\n\n另一个有趣的做法是输入会“弄坏”代码的数据。例如，如果你在当前程序的第二个操作数中输入 `0` 会发生什么？如果你输入了已知超过所选数据类型范围的巨值会发生什么？“弄坏”代码是发现数据局限性以及你在“现实世界”中会遇到的问题的极佳方法。更重要的是，你可以看到当这类错误进入你的程序时，Visual\
  \ Studio 是如何向你报错的。这对于你在后续章节中调试程序非常有帮助。\n\n# 浮点数据类型\n\n浮点数据类型是一种数值数据类型，但它可以表示小数值。表\
  \ 3.4 显示了浮点数据类型及其相关的范围。\n\n**表 3.4** 浮点数据类型\n\n![image](img/c03tnt004.jpg)\n\n两种类型的浮点数的值范围都很大。通常，当你需要数据反映小数值，或者需要在程序中使用很小或很大的数字时，你会选择浮点值。\n\
  \n在接下来的“尝试一试”部分，你将创建一个使用浮点数来代替上一个程序中使用整数的程序。\n\n## 尝试一试：使用浮点数的程序 (Chapter03.zip)\n\
  \n你可以相当容易地修改使用整数的程序，使其处理浮点数。假设你已经在 Visual Studio 中加载了上一个“尝试一试”的代码：\n\n1. 将 `btnCalc`\
  \ 点击事件代码中的语句行从：\n\n```\nint operand1;\nint operand2;\nint answer;\n```\n\n改为：\n\n\
  ```\nfloat operand1;\nfloat operand2;\nfloat answer;\n```\n\n2. 现在尝试运行程序。\n\n###\
  \ 工作原理\n\n进行更改后，运行程序。你将收到以下错误消息：\n\n```\nThe best overloaded method match for 'int.TryParse(string,\
  \ out int)' has some\ninvalid arguments.\n```\n\n这条错误消息告诉你是，`TryParse()` 感到困惑，因为它期望第二个参数是整数，但你传递的\
  \ `operand1` 是一个 `float` 数据类型。这并不是一个严重的问题，因为每种数据类型都有它们自己的 `TryParse()` 版本。将程序中的\
  \ `TryParse()` 方法调用更改为：\n\n```\nflag = float.TryParse(txtOperand1.Text, out operand1);\n\
  ```\n\n此更改使用了 `float` 包装类来处理转换过程。现在编译并运行程序。当你运行整数版本的程序并提供两个输入值 10 和 6 时，答案是 1。这是因为整数运算不允许存在小数部分。整数版本的程序简单地将结果截断为\
  \ 1。如果你在 `float` 版本中使用相同的输入，结果将变为 1.666667。\n\n**图 3.3** 使用 float 类型的程序\n![image](img/c03f003.jpg)\
  \ 浮点除法的结果呈现了一个小数值，这在使用 `int` 数据类型时是不可能的。\n\n## 尝试一试：测试浮点精度的程序 (Chapter03.zip)\n\n\
  使用你刚刚在上一个“尝试一试”中编写的程序，对该程序进行以下更改。注意我们如何将数据类型从之前的版本改为使用 `double` 数据类型：\n\n1. 将\n\n\
  ```\nfloat operand1;\nfloat operand2;\nfloat answer;\n```\n\n改为\n\n```\ndouble operand1;\n\
  double operand2;\ndouble answer;\n```\n\n你需要更改 `TryParse()` 方法调用的数据类型吗？（提示：如果你想让程序运行。）\n\
  \n2. 现在重新编译并运行程序。\n\n## 在 Visual Studio 中搜索和替换\n\n在讨论的浮点版本程序中，你被要求将所有的 `float` 关键字更改为\
  \ `double`。你可以遍历程序代码，查找 `float` 关键字的每次出现处并将其更改为 `double`。然而，这正是非常适合计算机为你完成的无脑任务。如果你想在整个程序中搜索特定的单词或短语，将光标放在源窗口的程序顶部并按\
  \ `Ctrl+F`。你应该迅速看到查找和替换对话框。选择快速替换（Quick Replace）选项。现在输入你要查找的内容（如 `float`），然后输入你想要替换的内容（如\
  \ `double`）。查找和替换对话框看起来应该如图 3.4 所示。\n\n\n\n\n\n![image](img/c03f004.jpg)你现在应该点击\
  \ `Find Next` 按钮来查找程序源代码中 `float` 单词的下一个出现处。如果你想将该处的 `float` 单词更改为 `double`，请点击\
  \ `Replace` 按钮。此时 `float` 单词将被替换为 `double`，程序将继续在程序中寻找下一个 `float` 关键字。\n\n点击 `Replace\
  \ All` 按钮具有巨大的诱惑，它会遍历整个源文件，并自动进行替换，而不会要求你点击 `Replace` 按钮。不要向这种诱惑屈协！“查找和替换”的内在智能就像一盒子的木脑石。假设你想将\
  \ `int` 更改为 `double`。你在对话框中输入这些内容并按下 `Replace All`。现在，当你查看源代码时，你会发现旧的程序行：\n\n```\n\
  int interestRate;\n```\n\n已经被更改为：\n\n```\n double doubleerestRate;\n```\n\n这可能不是你想要做的。遗憾的是，你的代码仍然可以正确执行，因为\
  \ `interestRate` 的所有实例都被忠实地更改为了 `doubleerestRate`。然而，你挑选有意义的变量名的努力付诸东流了。建议：*永远、永远*使用\
  \ `Replace All`。仅使用 `Find Next` 和 `Replace` 按钮。重命名变量更安全的方法是在变量定义处右键点击变量名，并选择 `Refactor\
  \ > Rename` 选项。你将得到一个允许更改变量名的对话框。\n\n***\n\n### 工作原理\n现在结果是 `1.66666666666667`。注意，使用\
  \ `double` 数据类型版本的答案中的数字字符比使用 `float` 版本要多。这是因为 `float` 的精度限制为 7 位，而 `double` 的精度为\
  \ 15 位。\n\n数字的 `precision`（精度）是指数据类型可以表示的有效数字。参考 表 3.4，你可以看到 `float` 可以表示值高达 `1.0\
  \ e38` 的数字。这是一个多达 38 位的数字。然而，由于 `float` 的精度仅限于 7 位，因此该数字的前 7 位是有效的。剩下的 31 位仅仅是计算机对该数字其余部分的最优猜测。当你将数据类型更改为\
  \ `double` 时，你将精度增加到了 15 位。虽然 `double` 的答案可以长达 308 位，但计算机在 15 位后就放弃了，并说：“管它吧；1.66666666666667\
  \ 已经足够了。”\n\n***\n\n## 你应该使用哪种浮点数据类型？\n\n从 表 3.4 中可能很明显，`double` 精度的提高之所以是因为 C#\
  \ 存储 `double` 使用的内存是 `float` 的两倍。这再次引发了问题……“你应该使用哪种浮点数据类型？”答案仍然是：“这取决于情况。”影响你选择的因素（内存限制、处理器考虑等）起着作用。\n\
  \n首先，Intel 类的别的 CPU 内置了数学协处理器。该数学协处理器专门设计用于使浮点运算尽可能快速。使用协处理器不需要你进行任何特殊的编码。\n\n其次，`Math`\
  \ 类中的几乎所有方法（`Sqrt()`、`Pow()`、`Cos()`）都期望 `double` 数据类型。再次，如果你将 `float` 数据类型传递给 `Sqrt()`\
  \ 方法，则必须执行代码将数据值从 32 位扩展到 64 位。这种从小值扩展到大值的过程被称为 `data widening`（数据拓宽）。\n\n最后，`double`\
  \ 数据类型比 `float` 有更多有效数字。除非有严重的内存限制，否则你应该使用 `double` 数据类型，因为 `float` 的精度是有限的。\n\n\
  # 货币值：Decimal 数据类型\n\n看起来 `double` 数据类型也是货币值的良好选择。然而，15 位的精度是不够的。为了克服精度限制带来的问题，C#\
  \ 创建了 `decimal` 数据类型。\n\n`decimal` 数据类型的最大优势是它具有 28 位精度——几乎是 `double` 精度的两倍。`decimal`\
  \ 数据类型的缺点是每个变量占用 16 字节内存。此外，由于数学协处理器并未设计用于处理 16 字节，对 `decimal` 数据类型的操作比对 `double`\
  \ 数据类型慢得多。\n\n表 3.4 Decimal 类型的范围\n\n![image](img/c03f005.jpg)\n\n***\n\n### 尝试：测试\
  \ decimal 的程序（第 03 章）\n你可以通过简单更改代码列表中的 `double` 关键字，来修改你一直在用于测试各种数据类型的程序。\n\n**1.**\
  \ 将\n\n```c\ndouble operand1;\ndouble operand2;\ndouble answer;\n```\n\n更改\n\n```csharp\n\
  decimal operand1;\ndecimal operand2;\ndecimal answer;\n```\n\n**2.** 现在运行程序，对两个操作数相同的相同的值\
  \ 10 和 6。发生了什么？你更改 `TryParse()` 调用了吗？（细节决定一切。）\n\n#### 工作原理\n图 3.5 显示程序的输出。（两个 label\
  \ 对象的输入提示或 `frmMain` 对象的文本没有更改，所以图中的“integer”字有点误导性。如果你愿意，可以更改它们。）\n\n**图 3.5**\
  \ 使用 decimal 数据类型运行程序\n\n![image](img/c03f005.jpg)\n\n程序的运行方式与此程序的早期版本完全相同，有一个重大例外：答案中的数字明显更多。`decimal`\
  \ 数据类型的增强精度非常大，以至于答案无法放入分配的文本框空间。\n\n## 使用 IntelliSense 定位程序错误\n\n在将变量的数据类型更改为 `decimal`\
  \ 数据类型后，尝试在 `answer` 定义之后、调用 `TryParse()` 方法之前在程序中插入以下语句：\n\n```csharp\noperand1\
  \ = .5;\n```\n\n当你编译程序时，`.5` 下方会出现蓝色的波浪线。*蓝色波浪线*指示 Visual Studio 察觉到波浪线所在语句行存在错误。\n\
  \n\n\n\n\n`IntelliSense` 是微软为 Visual Studio 的某部分提供的名称，负责检查你的语句以确保它们符合 `C#` 的语法规则。`syntax\
  \ rule`（语法规则）简单指的是 `C#` 期望你遵循的以形成有效 `C#` 程序语句的语言规则。（你可以在第 4 章中找到更多关于语言规则的细节。）就像英语要求句子必须包含名词和动词一样，`C#`\
  \ 也有它期望你在编写程序语句时遵循的规则。\n\n如果你违反了（或歪违背了）`C#` 的语法规则，`IntelliSense` 会在语句中违规的部分下方画出一条蓝色的波浪线。当你将光标移动到蓝色线条上时，`IntelliSense`\
  \ 会为你提供有关该错误的信息。这些关于错误性质的信息以错误消息的形式呈现。在前面的语句中，错误消息如下：\n\n```\n Literal of type double\
  \ cannot be implicitly converted to type 'decimal';\nuse an 'M'suffix to create\
  \ a literal of this type\n```\n\n换句话说，Visual Studio 对 `.5` 感到困惑。你将 `operand1` 定义为十进制数据类型，但你正尝试将值\
  \ `.5` 赋值给它。除非另有说明，每当 `IntelliSense` 在源代码中看到像 `.5` 这样的小数时，它假设你想使用 `double` 数据类型。（程序源代码中像\
  \ `.5` 这样的纯数字被称为数字字面量，因为没有使用变量来存储该值。相反，该数值是“字面地”作为程序源代码的一部分。）因此，`IntelliSense` 看到你的程序语句试图取一个\
  \ `double` 类型的数据值（`.5`）并将其放入十进制数据类型（`operand1`）中。这就像试图让穿 4 码鞋的人穿 8 码鞋走路……这根本不合脚。错误消息表达的是同样的意思，只是稍微正式一点。以它自己的方式，`IntelliSense`\
  \ 错误消息是这样的：\n\n```\n The literal .5 looks like a double to me and I cannot convert\
  \ it to type 'decimal'\nfor you; use an 'M' suffix to create a literal of this type\n\
  ```\n\n好吧……这很有道理。现在，按照它的建议修正语句，看看会发生什么。修正后的行应该是\n\n```\noperand1 = .5M;\n```\n\n\
  利用表 3.5 中的信息，你可以通过在字面量后加上十进制数据类型的后缀 `M`，让字面量 `.5` 的含义对 `IntelliSense` 变得极其清晰。修改之后，*瞧*……蓝色波浪线消失了。\n\
  \n作为一个通用规则，每当你看到那可怕的蓝色波浪线时，将光标移动到蓝色线条上，阅读 `IntelliSense` 给你的错误消息。有时消息可能看起来有点晦涩，但只要有一点经验，你就能开始正确解释这些错误消息。\n\
  \n* * *\n\n## 消失的蓝色波浪线\n\n当 `IntelliSense` 发现错误时，它会尽确定确定认为的程序错误的确切行号，并在那里画上蓝色波浪线。大多数情况下，`IntelliSense`\
  \ 在识别错误发生的确切语句方面表现出色。然而，在其他情况下，错误的性质导致 `IntelliSense` 在检查了更多几行之后才意识到发生了错误。在带有蓝色波浪线的行看起来在语法上正确的情况下，请查看其上方的几行，寻找异常的语句。请注意，当你修正语句行中的错误时，蓝色波浪线并不总是会消失。判断程序更改是否修复了错误的最佳方法是重新编译程序，查看错误消息和可怕的蓝色波浪线是否消失。最后，波浪线也可能是红色的。`红色波浪线`通常与缺失的语句元素有关。例如，如果你输入以下内容：\n\
  \n```\nint i\n```\n\n行尾会出现一条红色波浪线，提醒你忘记了在行末尾添加分号。第 11 章关于程序 bug 和调试有更多详细的细节介绍。\n\
