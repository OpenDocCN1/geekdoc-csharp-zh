  \   public clsCommercial(string addr, decimal price, decimal payment,\n\n      \
  \                  decimal tax, decimal insur, DateTime date,\n                \
  \        int type) :\n                        base(addr, price, payment, tax,\n\
  \                              insur, date, type)\n    {\n        buildingType =\
  \ type;   // 来自基类的商业类型\n    }\n    //--------------------- 属性方法 -------------------\n\
  \    public int SquareFeet\n    {\n        get\n        {\n            return squareFeet;\n\
  \        }\n        set\n        {\n            if (value > 0)\n               \
  \ squareFeet = value;\n        }\n    }\n    public int ParkingSpaces\n    {\n \
  \       get\n        {\n            return parkingSpaces;\n        }\n        set\n\
  \        {\n            parkingSpaces = value;\n        }\n    }\n    public decimal\
  \ RentPerSquareFoot\n    {\n        get\n        {\n            return rentPerSquareFoot;\n\
  \        }\n        set\n        {\n            if (value > 0M)\n              \
  \  rentPerSquareFoot = value;\n        }\n    }\n\n    //--------------------- 通用方法\
  \ --------------------\n    public override string RemoveSnow()\n    {\n       \
  \ return \"Called Acme Snow Plowing: 803.234.5566\";\n    }\n}\n\n================================================\n\
  using System;\n\nclass clsHome : clsBuilding\n{\n    //--------------------- 实例变量\
  \ -----------------\n    private int squareFeet;\n    private int bedrooms;\n  \
  \  private double bathrooms;\n    private decimal rentPerMonth;\n\n    //---------------------\
  \ 构造函数 ------------------------\n    public clsHome(string addr, decimal price,\
  \ decimal payment,\n                       decimal tax, decimal insur, DateTime\
  \ date,\n                       int type) :\n                       base(addr, price,\
  \ payment, tax,\n                            insur, date, type)\n    {\n       \
  \ buildingType = 3;      // 来自基类的住宅类型\n    }\n    //--------------------- 属性方法 -------------------\n\
  \    public int SquareFeet\n    {\n        get\n        {\n            return squareFeet;\n\
  \        }\n        set\n        {\n            if (value > 0)\n               \
  \ squareFeet = value;\n        }\n    }\n    public int BedRooms\n    {\n      \
  \  get\n        {\n            return bedrooms;\n        }\n        set\n      \
  \  {\n            bedrooms = value;\n        }\n    }\n    public double BathRooms\n\
  \    {\n        get\n        {\n            return bathrooms;\n        }\n     \
  \   set\n        {\n            bathrooms = value;\n        }\n    }\n    public\
  \ decimal RentPerMonth\n    {\n        get\n        {\n            return rentPerMonth;\n\
  \        }\n        set\n        {\n            if (value > 0M)\n              \
  \  rentPerMonth = value;\n        }\n    }\n\n    //--------------------- 通用方法 --------------------\n\
  \n}\n```\n\n每个建筑类型类都以类似下面的行开始：\n\n```cs\n class clsApartment : clsBuilding\n```\n\
  \n\n\n\n\n这建立了在图 16.1 中所示的“是一个”（is a）关系。（这与你在本文使用的几乎每个表单类定义中看到的`: Form”没有区别。）通过使用这种语法将每个派生类绑定到基建筑类，你可以在所有派生类中使用位于\
  \ `clsBuilding` 中的 `PropertySummary()`。\n\n还有一点：派生类不能继承构造函数。你必须为派生类编写一个构造函数。如果基类没有默认构造函数，派生类的构造函数必须使用\
  \ `base` 关键字调用基类构造函数，如 `clsApartment`所示：\n\n```\n public clsApartment(string addr,\
  \ decimal price, decimal payment,\n                   decimal tax, decimal insur,\
  \ DateTime date,\n                   int type) :\n                   base(addr,\
  \ price, payment, tax,\n                        insur, date, type)\n```\n\n这里使用\
  \ `base` 关键字是将用于构建 `clsApartment` 对象的参数传递给 `clsBuilding` 构造函数。（该概念与在多个构造函数中使用的 `this`\
  \ 构造类似。）\n\n## 基类不是派生类\n\n派生类使用基类中方法的能力是一个单向关系。也就是说，派生类可以调用基类方法，但基类不能直接调用派生类方法。例如，假设\
  \ `clsCommercial` 包含一个名为 `HouseCleaning()` 的公共方法。如果 `myBldg` 是一个 `clsBuilding` 对象，你不能使用：\n\
  \n```\n myBldg.HouseCleaning(); // Error!!\n```\n\n编译器会抛出错误并通知你找不到 `HouseCleaning()`\
  \ 的定义。即使你对 `HouseCleaning()` 方法使用了公共访问修符，这个结论也是正确的。你无法执行从基类到派生类方法调的原因是图 16.1 所示的“是一个”关系是单行道。也就是说，`clsCommercial`\
  \ 对象拥有了 `clsBuilding` 对象的所有属性和方法，但 `clsBuilding` 对象并不拥有 `clsCommercial` 对象的所有属性和方法。\n\
  \n## 抽象类\n\n正如我之前提到的，基类通常被用作派生类之间共享的所有属性的存储。然而，基类可能是如此模糊，以至于实例化基类对象是没有意义的。例如，你可能会创建一个名为\
  \ `clsDeciduous` 的树类，它具有 `leafColor`、`barkStyle`、`matureHeight` 和 `ringCount` 属性。派生类可能是\
  \ `clsOak`、`clsMaple`、`clsWillow` 等。问题在于，尽管所有的派生类都具有叶子、树皮、成熟高度和年轮计数，但具有这些特征的树太多，以至于实例化\
  \ `clsDeciduous` 对象没有意义。只有派生类中找到细节结合基类，才有足够的信息让对象变得有用。\n\n为了防止基类的实例化，请使用 `abstract`\
  \ 关键字：\n\n```\n public abstract class clsDecidious\n{\n     // The class code…\n\
  }\n```\n\n如果通过 `abstract` 关键字定义一个类（如所示），则你无法实例化该类的对象。这意味着像下面的语句将导致编译器错误，告诉你是不能实例化一个抽象类的对象：\n\
  \n```\nclsDecidious myLeafyTree = new clsDecidious();\n```\n\n如果你无法实例化该类的对象，为什么要用它呢？\n\
  \n通过使用 `abstract` 关键字定义类，你是在告诉该类的用户两件事。第一，他们不能实例化该类的对象，这提示了第二个原因。第二，也是更重要的，用户必须定义派生类来捕获基类中所体现的功能。事实上，在没有派生类的情况下，没有理由使用基类。\n\
  \n如果你使用 `abstract` 关键字定义一个方法，派生类*必须*实现该方法。基类中没有该方法的代码。通过这种方式，抽象类和抽象方法类似于接口，因为接口同样不包含代码。然而，接口不能包含构造函数。\n\
  \n# 多态\n\n第一章提到多态是面向对象编程的三大支柱之一。当时我略过了这个话题，说*polymorphism*（多态）一词源于希腊语，意思是“多种形状”，而当时仅止于此。现在你已经理解了什么是继承，你准备好更完全地理解什么是多态了。\n\
  \n与其固守“多种形状”的概念，也许定义应该被修改为“多种消息”。本质上，*多态*意味着你可以向一组不同的类发送相同的消息，并且每个类都知道如何正确对该消息做出响应。\n\
  \n## 尝试一下：使用多态\n\n考虑以下示例。在我居住的地方，如果下雪量超过 2 英寸，你就应该出去铲扫人行道。进一步假设，当我们的物业经理看到下了 2 英寸或更多积雪时，我们的软件应该通知每个物业位置的人员。（我将假装软件和电话系统之间有电气连接。我将使用列表框对象中显示的内容作为已拨打\
  \ `call(s)` 的指示。）你想做的是添加一个按钮，让经理在看到地上积雪超过 2 英寸时可以点击。程序的示例运行见图 16.3。\n\n图 16.3 清雪输出\n\
  \n![image](img/c16f003.jpg) 注意，公寓和商业建筑提供了清理积雪的电话号码，但对于租房屋的人没有提供。假设是根据租赁协议，租户需要自己铲雪。你下载的代码已经包含了这个清雪按钮和相关代码。这个练习只是解释了如何实现多态。\n\
  \n### 工作原理\n\n你需要做的第一件事是修改基类以处理清雪消息。添加到 `clsBuilding` 中的代码如下：\n\n```\n public virtual\
  \ string RemoveSnow()\n{\n   return whichType[buildingType] +\n          \": No\
  \ removal service available.\";\n}\n```\n\n### virtual 关键字\n\n`clsBuilding` 中的清雪方法\
  \ `RemoveSnow()` 通过 `virtual` 关键字定义.*virtual* 用于标识该方法可以在派生类中被重写。换句话，虚拟方法可以在任何派自此基类的中被不同的定义替换。如果你参考图\
  \ 16.1，你可以看到为 `clsApartment` 和 `clsCommercial` 对象提供了 `RemoveSnow()` 方法。这两个方法的代码如下：\n\
  \n```\n public override string RemoveSnow()     // clsApartment\n{\n    return \"\
  Apartment: Call John's Snow Removal: 859.444.7654\";\n}\n\npublic override string\
  \ RemoveSnow()     // clsCommerical\n{\n    return \"Commercial: Call Acme Snow\
  \ Plowing: 803.234.5566\";\n}\n```\n\n\n\n\n\n图 16.1 同样显示 `clsHome` 中没有 `RemoveSnow()`\
  \ 方法。租房的人在签署租约时已被告知他们他们负责清理积雪。\n\n### override 关键字\n正如你可能猜到的那样，`override` 关键字与 `virtual`\
  \ 关键字是紧密相连的。`virtual` 告诉代码的阅读者该方法可以被重写，而 `override` 关键字则告诉她该方法正在重写其继承的类中发现的方法。\n\
  \n通常情况下，派生类会重写基类中定义的 `virtual` 方法。然而，你可以从派生类定义一个新类。例如，你可以为 `clsHome` 添加 `clsRecreational`，可能带有\
  \ `lakeFrontage`（湖景面积）、`boatRamp`（下船道）、`availableFishingTackle`（可用钓具）等新属性。该类的定义可能如下：\n\
  \n```cs\n public class clsRecreational : clsHome\n {\n     // 类代码\n }\n```\n\n你可以根据你认为需要的程度不断扩展类定义。（如果你想防止对某个类进行进一步继承，可以在类定义中使用\
  \ `sealed` 关键字作为修饰符，如 `public sealed clsLastClass`。使用 `sealed` 关键字意味着不允许从该类进行进一步的派生。）但在大多数情况下，你是在使用\
  \ `override` 来重写在基类中定义的 `virtual` 方法。\n\n### 发送清理积雪消息\n`frmMain` 的新用户界面现在包含一个发布清理积雪消息的按钮。确定如何操作是每个类的责任。清理积雪消息的按钮点击事件代码如下：\n\
  \n```cs\n private void btnRemoveSnow_Click(object sender, EventArgs e)\n{\n    lstMessages.Items.Add(myApt.RemoveSnow());\n\
  \    lstMessages.Items.Add(myComm.RemoveSnow());\n    lstMessages.Items.Add(myHome.RemoveSnow());\n\
  \    lstMessages.Items.Add(\"\");\n}\n```\n\n每个派生类都通过调用 `RemoveSnow()` 方法接收到相同的消息。然而，显示的消息是由派生类想要附加到方法调用上的任何过程决定的。请注意，`clsHome`\
  \ 甚至*没有* `RemoveSnow()` 方法，但它仍然显示了以下消息：\n\n```\n Home: No snow removal service available.\
  \ （无法提供清理积雪服务。）\n```\n\n正如你无疑已经想到的，因为 `clsHome` 没有 `RemoveSnow()` 方法，所以使用了基类中的 `RemoveSnow()`\
  \ 方法。换句话说，`clsHome` 选择不重写 `RemoveSnow()` 方法，而是使用基类中写的“默认”方法。使用继承和多态行为的好处在于，每个对象都知道如何对调用的任何事件或方法做出反应的具体细节，尽管这些对象共享相同的方法名。初看之下，继承似乎有点令人敬畏。然而，如果你在感到不确定发生了什么的地方设置一些断点并运行程序，你就能很快理解代码在做什么。单步执行程序是更深入理解程序在执行时实际在做什么的极佳方法。\n\
  \n***\n\n# 扩展方法\n\n继承为你提供了一种方法，可以避免在没有父子关系的情况下可能存在的重复代码。当然，使用继承要求你能够访问类的源代码。然而，扩展方法允许你在不需要源代码的情况下扩展类的功能。\n\
  \n你可以将扩展方法视为静态方法，你可以在没有该类源代码的情况下将其“嫁接到”现有类上。理解扩展方法能带来什么最简单的方法是参考接下来的“尝试一下”（Try It\
  \ Out）中的示例。\n\n假设你有一个程序，需要验证用户输入的是有效的社会安全号码（SSN）。有效的 SSN 格式为 `ddd-dd-dddd`，这意味着三位数字字段、一个连字符、两个数字、另一个连字符，最后是四位数字序列。你想做的是扩展\
  \ `String` 类，添加一个检查有效 SSN 的方法。图 16.4 显示了你即将编写的程序的示例运行情况。下一节介绍了如何使用扩展方法的示例。\n\n图\
  \ 16.4 使用扩展方法\n\n![image](img/c16f004.jpg)\n\n***\n\n### 尝试一下：使用扩展方法 (Chapter16ProgramInheritance.zip)\n\
  在图 16.4 所示的程序中，用户输入 SSN 进行检查。`Verify` 按钮随后调用代码判断用户输入是否形成有效的 SSN，并显示关于输入数字的消息。虽然图\
  \ 16.4 中显示的 SSN 格式是 SSN 的标准模式，但有时你会看到输入的 SSN 仅为 9 位数字序列而省略了连字符。你应该编写扩展方法来处理这两种形式。\n\
  \n要尝试该程序，16-4 和 16-5 按照正常方式创建一个新项目。\n2. 创建一个带有两个标签（label）、一个文本框（textbox）和一个按钮（button）的用户界面。\n\
  3. 添加 `Chapter16ProgramInheritance.zip` 中的代码。\n\n#### 工作原理\n你可以在 16-4 中看到扩展方法的代码。你需要使用\
  \ `System.Text.RegularExpression`，因为代码使用了正则表达式解析器。在这个示例中，你使用 `namespace` 关键字来赋予扩展方法身份（`ExtensionMethods`）。\n\
  \n16-4: `clsExtension` 的源代码。（clsExtension.cs）\n\n```cs\nusing System;\nusing System.Text.RegularExpressions;\n\
  \nnamespace ExtensionMethods\n{\n    public static class clsExtension\n    {\n \
  \       // 关于正则表达式选项的细节请参见：\n        // http://www.regular-expressions.info/reference.html\n\
  \n        public static bool CheckValidSSN(this string str)\n        {\n       \
  \     int len = str.Length;\n\n            Regex pattern = null;\n            //\
  \ 是否是 xxx-xx-xxxx 或 xxxxxxxxx？\n            if (len == 11 || len == 9)\n       \
  \     {\n                if (len == 9)\n                {                  // 接受\
  \ 9 位数字字符\n                    pattern = new Regex(@\"\\d{9}\");\n             \
  \   } else {          // 接受 ddd-dd-dddd\n                    pattern = new Regex(@\"\
  \\d{3}-\\d{2}-\\d{4}\");\n                }\n                return pattern.IsMatch(str);\n\
  \            }\n            else\n            {\n            return false;     \
  \    // 无效\n            }\n        }\n   }\n}\n```\n\n正则表达式解析器为在字符串中查找模式提供了一种方法。例如，模式\n\
  \n```\n \\d{3}-\\d{2}-\\d{4}\n```\n\n表示查找三个数字（`\\d {3}` 部分）、一个连字符、两个数字、最后四个数字。（记住，字符串前面的\
  \ `@` 意味着任何连字符都不会被解释为转义序列，而是作为字符串的一部分。）调用 `IsMatch()` 传入要检查的模式，如果字符串匹配模式则返回 `true`，否则返回\
  \ `false`。列表 16-4 中出现的 URL 地址对你可以与正则表达式解析器使用的多数模式选项提供了简洁的解释。`CheckValidSSN()` 的签名以\
  \ `this` 关键字开头。因为 `this` 始终引用当前对象，所以 `CheckValidSSN()` 拥有被调用检查的字符串的引用。\n\n\n\n\n\
  \n```cs\n using System;\nusing System.Windows.Forms;\nusing StringExtensionMethods;\n\
  \npublic class frmMain : Form\n{\n    private Label label1;\n    private Label lblResult;\n\
  \    private TextBox txtSSN;\n    private Button btnVerify;\n    private Button\
  \ btnClose;\n\n    #region Windows Code\n\n    public frmMain()\n    {\n       \
  \ InitializeComponent();\n    }\n\n    [STAThread]\n    public static void Main()\n\
  \    {\n        frmMain main = new frmMain();\n        Application.Run(main);\n\
  \    }\n\n    private void btnVerify_Click(object sender, EventArgs e)\n    {\n\
  \        string str = txtSSN.Text;\n\n        if (str.CheckValidSSN())\n       \
  \     lblResult.Text = \"Valid\";\n        else\n            lblResult.Text = \"\
  Invalid\";\n    }\n\n    private void btnClose_Click(object sender, EventArgs e)\n\
  \    {\n        Close();\n    }\n}\n```\n\n在列表顶部，你可以看到：\n\n```cs\n using StringExtensionMethods;\n\
  ```\n\n这使得扩展方法可以在程序中使用。列表中的其余代码都是你以前见过无数次的内容，除了对扩展方法的调用外：\n\n```cs\n if (str.CheckValidSSN())\n\
  \     lblResult.Text = \"Valid\";\nelse\n    lblResult.Text = \"Invalid\";\n```\n\
  \n你可以使用与其他任何字符串方法相同的语法来调用你的验证方法。等一下。`CheckValidSSN()` 的签名显示它期望接收一个字符串。啊，是的，但签名中的\
  \ `this` 关键字告诉该方法，调用所引用的是当前对象。因此，扩展方法已经可以访问正在测试的字符串，不需要传递字符串。该调用根据字符串的内容返回 `true`\
  \ 或 `false`，并显示相应的标签。扩展方法为你提供了一种方便的方法，可以在不使用继承的情况下扩展类的功能。如果你曾经说过：“我希望这个类能够做……”，那么你可能考虑编写一个扩展方法。如果你为字符串模式或数据值编写重复的测试，这一点将尤为如此。\n\
  \n***\n\n# 总结\n\n本章完成了你对面向对象编程三大支柱的学习：封装、继承和多态。在整个过程中，我们强调了将数据封装在类或方法内部的重要性。在本章中，你学习了\
  \ `protected` 访问修饰符如何允许你封装数据，同时根据需要与派生类共享它。你学习了基类如何作为相关但不同类之间的公约数。你还学习了多态如何让每个派生类都能以适合其自身的方式对消息做出反应。最后，你看到了扩展方法如何通过“附加”新方法来扩展类的功能，而无需使用继承。\n\
  \n# 练习\n\n你可以在附录 A 中找到以下练习的答案。\n\n**1.** 一个高尔夫俱乐部想建立一个会员计划，可以向其成员发送邮件、电子邮件和投票票。会员包括青少年会员、普通会员和资深高尔夫会员，以及一个不包含高尔夫项目的社交会员。问题是，青少年和社交会员不被允许对俱乐部问题进行投票。此外，社交会员不应该收到有关高尔夫锦赛的邮件，因为他们不被允许使用球场，只能使用泳池和餐厅设施。如果你编写这个程序，你会如何组织它？**2.**\
  \ 假设你在程序中看到以下行代码：\n\n```cs\n public clsJunior(string addr, int status, decimal minimum)\n\
  \                   : base(addr, status, minimum)\n```\n\n关于这行代码的用途，你能告诉我什么？**3.**\
  \ 一些程序员不喜欢 `protected` 访问修饰符。你认为他们的原因可能是什么？**4.** 你如何防止其他程序员通过继承来扩展你的类之一？**5.**\
  \ 继承是否带来了某些如果不使用它就无法实现的功能？\n\n### 本章你学到了\n\n| 主题 | 关键点 |\n| :--- | :--- |\n| **继承**\
  \ | 扩展现有类以适应不同属性和方法的能力而无需重复代码。 |\n| **为什么继承有用** | 它让你能够重用并简化代码。 |\n| **基类（父类）**\
  \ | 其他类派生的类。 |\n| **派生类（子类）** | 从基类继承属性和方法的类。 |\n| **protected** | 一种允许基类和派生类之间共享属性和方法的访问修饰符。\
