  \n## 练习 3 答案\n\n他们的担心是派生类可以绕过与属性设置方法相关的验证代码，直接更改基类的值。这是一个真实的担忧。然而，这种担心虽然真实，但并不严重。类的用户仍然会通过属性设置方法，只有派生类的程序员才能滥用这一点。如果你假设你的编程同事不会破坏你的项目，这可能不是一个严重的问题。\n\
  \n## 练习 4 答案\n\n如果你使用 `sealed` 关键字定义类，你是在告知编译器不要允许该类作为进一步继承的基类。例如，\n\n```\npublic\
  \ sealed clsMyClass\n```\n\n防止任何人将 `clsMyClass` 作为进一步继承的基类。\n\n## 练习 5 答案\n\n# 第\
  \ 17 章\n\n## 练习 1 答案\n\n学生忘记在代码中使用 `try-catch` 块。这对于打印机来说特别糟糕，因为它们很大程度上是机电设备，有很多可能故障的组件。此外，缺墨或缺纸也是常见问题。\n\
  \n## 练习 2 答案\n\n线程是在同一个应用程序进程中运行多个执行线程的能力。\n\n## 练习 3 答案\n\n一个进程花费相当长的时间是很不寻常的，例如打印。如果没有线程，用户被迫坐在那里等待进程完成。有了线程，用户可以在线程进程完成其任务时进行其他活动。\n\
  \n## 练习 4 答案\n\n`BackgroundWorker` 是一个能够让你轻松启动、控制和结束线程的对象。`BackgroundWorker` 对象让线程处理变得尽可能简单。\n\
  \n\n\n\n是的。存在需要处理的同步问题，如果处理不当可能会导致系统锁死的条件（例如，死锁），以及可能出现的其他问题（即竞态条件）。当主线程与数据库交互时，这些问题会变得更加严重。\n\
  \n# 第 18 章\n\n## 练习 6 答案\n\n在 Visual Studio 中进行重构只是对现有代码体实现更改的一种简单方法。消除重复代码（方法提取）和改进封装性是重构程序最常用的两种用途。\n\
  \n## 练习 1 答案\n\n网页是一个 HTML 文件，能够被浏览器渲染为视觉化表示。\n\n## 练习 2 答案\n\n静态网页的 HTML 内容是固定且不发生变化的，而动态页面可以根据用户（或其他））的输入来改变其内容。\n\
  \n## 练习 3 答案\n\n与纯 HTML 不同，`ASP.NET` 允许在文件中使用特殊标签，这些标签可以由 `ASP` 引擎进行进一步处理。此类处理的指令位于后置代码（code-behind\
  \ file）中。处理完成后，结果将格式化为 HTML 文件并发送回客户端进行渲染。\n\n## 练习 4 答案\n\n由于以下语句，\n\n```\ninterestRate\
