  \ 默认情况下，网格的列宽对于所有列都是固定的，无论数据内容如何。如果你从 `AutoSizeColumnMode` 下拉组合框将此属性改为 `AllCells`，列宽将自动调整为适应该字段中数据集中最长项目的宽度。图\
  \ 14.14 显示了当 `AutoSizeColumnMode` 属性设置为 `AllCells` 时 `Friends` 表可能的样子。你在表格中看到的阴将在下一节中解释。\n\
  \n\n\n\n## 图 14.14 报告示例\n\n![image](img/c14f014.jpg)\n虽然这确实会让某些列比你希望的要宽，但其他列（如邮政编码、州缩写等）使用的显示空间比其他情况下要少得多。这通常意味着不需要水平滚动显示器就可以看到更多数据。\n\
  \n### AlternatingRowsDefaultCellStyle\n如果你选择网格对象的 `AlternatingRowsDefaultCellStyle`\
  \ 属性，将看到与图 14.15 所示类似的对话框。\n\n## 图 14.15 单元格着色\n\n![image](img/c14f015.jpg)\n如你所示，有很多单元格样式属性可以设置。顶部背景颜色设置为紫色（这是我最喜欢的颜色）。如果你希望显示看起来像旧的\
  \ IBM 风格打印纸，点击 `BackColor` 框，点击向下箭头，点击名为 `Web` 的标签，并选择 `PaleGreen`。\n\n`Behavior`\
  \ 属性允许你以与列类型一致的方式格式化单元格内容。例如，如果你选择 `Numeric`，可以固定显示的位数。会在合适的地方插入逗号。如果你选择 `Currency`，数字前会出现美元符号，负值将使用会计惯例将值括在括号中。这两个属性也允许你对列进行排序。\n\
  \n`Data` 属性允许你指定空值在单元格中的显示方式。如果你的数据源允许空值，你可能会将其设置为 `n/a` 或其他对你的应用程序有意义的值。\n\n`Layout`\
  \ 属性有几个可以更改的属性。如果你显示货币值，可以对值右对齐。当然，用户默认情况下可以调整列宽。（你可以通过将 `AllowUserToResizeColumns`\
  \ 更改为 `false` 来关闭此功能。）\n\n当然，`dataGridView` 对象包含了许多你在其他 Microsoft 产品中找到的功能。例如，双击列标题会根据所选列的值对网格数据进行排序。尝试一下看看你喜爱的“功能”是否已实现在网格的默认设置中。如果没有，请检查网格对象的属性，看看该过程是否可以调整。\n\
  \n**警告**\n在后台有大量工作在运行以显示数据。幸运的是，预写的 Visual Studio 类已经为你完成了大部分大量性工作。然而，你应该知道，这里使用的代码能够执行你所想到的几乎任何查询，包括\
  \ SQL `DELETE` 命令。如果你认为这可能是一个问题，你可能需要在传递执行之前解析查询以检查某些特定的 SQL 命令。\n\n## 不使用数据绑定显示数据库数据\n\
  \n有许多 Visual Studio 控件可以绑定到数据源，包括组合框和列表框。在上一节中，你让 `dataGridView` 控件为你完成了大部分工作。然而，某些情况下，你可能需要对呈现进行比绑定源允许提供的更多控制。本节展示了如何读取数据库数据并在不使用数据绑定的情况下呈现它。\n\
  \nWindows 表单如图 14.16 所示。\n\n## 图 14.16 交换卡片报告\n\n![image](img/c14f016.jpg)\n\n单选按钮的选择可能是不言自明的。`Received`\
  \ 和 `Sent` 按钮要求用户提供一个日期，然后查询将获取该接收或发送日期的数据。`Date` 单选按钮会搜索两个日期。\n\n单选按钮的使用使得代码比表面看起来复杂一点。这是因为你可以禁用任何与单选结果不相关的控件。例如，如果你选择了\
  \ `Person` 单选按钮，`Card Type` 和 `Date` 输入框应被禁用，而 `Last Name` 输入框应启用。然而，如果你选择了任何日期字段，另外两个输入框应关闭。因此，大多数单选按钮都会对\
  \ `Change` 事件做出响应，如下所示代码段所示：\n\n```\nprivate void rbType_CheckedChanged(object sender,\
