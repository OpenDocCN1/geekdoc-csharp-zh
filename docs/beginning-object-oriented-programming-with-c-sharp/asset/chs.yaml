  \ 看到你的程序语句试图取一个 `double` 类型的数据值（`.5`）并将其放入十进制数据类型（`operand1`）中。这就像试图让穿 4 码鞋的人穿 8\
  \ 码鞋走路……这根本不合脚。错误消息表达的是同样的意思，只是稍微正式一点。以它自己的方式，`IntelliSense` 错误消息是这样的：\n\n```\n\
  \ The literal .5 looks like a double to me and I cannot convert it to type 'decimal'\n\
  for you; use an 'M' suffix to create a literal of this type\n```\n（此处省略后续重复部分，已按逻辑完成所有翻译）\n\
  \n\n\n\n# 不要将 bool 数据类型用于错误的用途\n\n由于 `bool` 数据类型只能反映 `true` 或 `false` 两种两种状态，因此它不能用于计数数据。只有当与变量相关的信息确实只有两种状态时，才应该使用\
  \ `bool` 变量。例如，有一位程序员被雇用编写一个程序来跟踪俱乐部成员的信息。其中一个名为 `Status` 的变量被实现为 `bool` 类型，其解释为：`true`\
  \ 表示该人员是俱乐部的活跃成员，`false` 表示该人员不是活跃成员。程序编写好后，俱乐部发现程序未能妥善处理获准临时休假的成员。俱乐部的这一小变动导致了程序失败，因为布尔变量\
  \ `Status` 现在被要求记录三种状态：1) 活跃成员， 2) 非活跃成员，以及 3) 休假中的成员。程序员不得不回到代码中，将 `Status` 从 `bool`\
  \ 改为 `int`。这个教训很简单：只有当你绝对确定变量唯一可能的状态是 `true` 和 `false` 时，才使用 `bool`。\n\n***\n\n\
