  # 数组是对象\n\n与其他一些编程语言不同，C# 中的数组是对象。这意味着每个数组对象都有一组你可以对其使用的属性和方法。代码列表 8-1 中的代码利用 `Length`\
  \ 数组属性来控制循环迭代的次数。不那么明显的是，所有数组对象都派生自 `System.Array` 类。表 8.1 展示了通过 `System.Array`\
  \ 类可用的一些属性和方法的部分列表。\n\n表 8.1 中提供的许多方法都是重载的。你可以使用 IntelliSense 来查看各种数组方法的重载参数列表。\n\
  \n定义数组后，你就可以使用表 8.1 中提供的属性和方法。例如，如果一个名为 `val` 的数组有 100 个随机值，并且你想让它们按升序排列，那么语句\n\n\
  ```\nSystem.Array.Sort(val);\n```\n\n会将这些值重新组织为排序顺序。如果你接着调用\n\n```\nSystem.Array.Reverse(val);\n\
  ```\n\n`val` 数组中的值现在变为降序排列。如你所见，与自己编写代码相比，表 8.1 中的属性和方法大大简化了数组数据操作。\n\n# 多维数组\n\n\
  到目前为止你只读过关于一维数组，它们非常适合描述数据列表。然而，数据通常以行列表格的形式组织。例如，你可能想查看一个班级的成绩分布，其中列代表班级，行代表成绩，如表\
  \ 8.2 所示。\n\n**表 8.2** 按班级的成绩分布\n\n![image](img/c08tnt002.jpg)\n\n如果你想定义一个数组来存储表\
  \ 8.2 所示的数据，可能会使用以下代码：\n\n```\nint[,] grades = new int[5, 4];\n```\n\n该定义表示你想要定义一个五行四列的表格或矩阵。注意定义语句开始处括号内的逗号。赋值表达式左侧括号中的第一个逗号仅仅是告诉\
  \ C# 你正要定义一个二维数组。赋值表达式右侧的第二组括号精确地指定了表格中有多少个元素。因为有两个维度，所以你说 `grades` 数组的秩（rank）为\
  \ 2。也就是说，`rank` 一术语指的是与数组关联的维度数量。\n\n如果你需要，可以使用超过两个的维度。例如，3D 图形是使用 X、Y 和 Z 坐标绘制的。要定义一个三维数组，你可能使用使用此代码：\n\
  \n```\nint[,,] images = new int[20, 20, 20];\n```\n\n这定义了一个数据立方，而不是表格或列表。如果你需要 N\
  \ 维（例如三维），括号内始终会有 N – 1 个逗号（在本例中为两个逗号）。\n\n你可能甚至需要超过三个维度。例如，如果你编写游戏软件，你可能需要三个维度来放置游戏中的\
  \ 3D 图像，并需要第四个维度来跟踪每个图像应该出现的时间。（我试着想一个使用五维的例子，结果只是得我头疼。）C# 支持的秩似乎远超你可能合理认为需要的任何数量。\n\
  \n在下一个“尝试一试”中，你将应用一些我们一直在讨论的数组概念，但将它们应用于二维数组。虽然处理过程相似，但存在你需要处理的细微差异。\n\n***\n\n\
  **尝试一试：使用二维数组 (Chaper08ProgramTwoDimensionalArray.zip)**\n\n\n\n\n\n# 工作原理\n\n程序的代码在列表\
  \ 8-2 中给出。如往常一样，在`btnCalc_Click()` 事件代码中事情变得有趣起来。首先，定义了几个工作变量，包括一个名为 `which` 的 `ListViewItem`\
  \ 对象。代码利用 `TryParse()` 方法来验证用户输入的是数值数据。如果用户输入了负数，你将强制将其转换为正数。当这些检查完成后，变量 `number`\
  \ 存储了你想在 `ListView` 对象中显示的行数。该值被加了 1，因为你想要通过用户输入的数字（包含在内）来显示数据。也就是说，如果用户输入 100，你实际上想显示\
  \ 101 个值，从 0 到 100——这又是那个讨厌的 N – 1 规则。\n\n该语句\n\n```\n int[,] myData = new int[number,\
  \ 3];     // 定义数组\n```\n\n定义了存储数据的数组。循环简单地为数组的每一列分配所需的值：\n\n```\n for (i = 0; i\
  \ < number; i++)\n{\n    myData[i, 0] = i;           // 表格的第一列\n    myData[i, 1]\
  \ = i * i;       // 表格的第二列\n    myData[i, 2] = i * i * i;   // 表格的第三列\n}\n```\n\n\
  你可以看到，变量 `i` 控制循环但也决定了表格的行数。因此，变量 `i` 用于循环中设置数组的第一维度（或其行值）。第二个维度（值 0, 1, 2）决定了表格中三列的值。下一个\
  \ `for` 循环将数据格式化为名为 `lsvTable` 的 `ListView` 对象：\n\n```\n for (i = 0; i < number;\
  \ i++)    // 现在显示它\n{\n    which = new ListViewItem(myData[i, 0].ToString());\n\
  \    which.SubItems.Add(myData[i, 1].ToString());\n    which.SubItems.Add(myData[i,\
  \ 2].ToString());\n    lsvTable.Items.Add(which);\n}\n```\n\n这段代码与你之前在讨论 `ListView`\
  \ 对象时看到的代码相似。唯一的上下文区别是现在有三列，而不是图 8.8 中所示的两列。如果你仔细看这段代码，你可能会说：“嘿，笨蛋！控制两个 `for` 循环的三个表达式是相同的，所以为什么不把它们合并成一个\
  \ `for` 循环呢？”这段 RDC 是刻意为之，以减少代码的“繁忙感”。你可以轻松地将第二个 `for` 循环中的四个语句移动，它们放在第一个 `for`\
  \ 循环的三个语句之后。然后你可以完全删除第二个 `for` 循环。（当然，如果你这样做，你就可以完全删除数组，整个程序的目的就消失了！）\n\n# 初始化数组\n\
  \n通常你已知某些数组具有特定的值，并且你想将数组元素初始化为这些值。例如，你可能有一个名为 `days` 的数组，存储每个月的天数。你可以使用以下代码：\n\n\
  ```\n days[0] = 31;     // 一月\ndays[1] = 28;     // 二月\ndays[2] = 31;     // 三月\n\
  ```\n\n以此此类推。如你所见，这是一个重复性任务，需要 12 条几乎相同的语句。C# 为你提供了一种更简单、更直接的方法来设置数组的值。语法所示：\n\n\
  ```\n typeSpecifier [] arrayID = new typeSpecifier [elementCount] { val1, val2,\
  \ val3,. . .};\n```\n\n使用每个月天数的例子，你可能会使用这个：\n\n```\n int[] days = new int[12] {31,28,31,30,31,30,31,31,30,31,31};\n\
  ```\n\n该语句在一条语句中设置了所有 12 个月份的值。在数组定义时设置数组的值被称为*初始化*数组。大括号之间出现的值列表通常被称为*初始化列表*。\n\
  \n## 初始化数组的变体\n\n有趣的是，C# 为初始化数组提供了两种额外的语法变体。前一节中所示相同数组的这些变体为：\n\n```\n int[] days\
  \ = new int[] {31,28,31,30,31,30,31,31,30,31,31};\n```\n\n或者\n\n```\n int[] days\
  \ = {31,28,31,30,31,30,31,31,30,31,31};\n```\n\n第一种变体没有填充数组的元素计数。编译器通过计算初始化列表中的值数量自动完成计数。第二种变体去掉了\
  \ `new` 关键字和带括号的类型指定符。\n\n### 哪种数组定义/初始化语法最好？\n\n鉴于你有三种方法完成相同任务，你应该用哪一种？一如既往，每当你有多种方案时，你应该用哪种？无论如何，当你有完成相同任务的方案时，重要的是你在代码中保持一致。对于\
  \ C# 来说，你使用哪一种都没有区别，你应该选择一种并始终使用它。尽管如此，我倾向于使用以下定义：\n\n```\n int[] days = new int[]{31,28,31,30,31,30,31,31,30,31,31};\n\
  ```\n\n选择这种变体有几个理由。首先，在定义中使用 `new` 关键字强化了数组是对象的这一事实。其次，你不需要手动填写元素计数，编译器擅长这样做，所以你应该让它来处理。最后，如果你需要从初始化列表中添加或删除元素，编译器会自动调整大小。（如果你提供了元素计数但它与初始化列表不匹配，Visual\
  \ Studio 会变得很躁并发出关于秩的错误信息。）\n\n### 像用户一样思考\n\n你注意到 `days` 的推荐定义包含了 13 个元素吗？增加一个元素是因为用户是如何思考这些数据的。毕竟，如果你问某人“哪个月份？”大多数人不会回答“二月！”然而，数组中的元素\
  \ 1 `days[1]` 的值是 28。确实，作为程序员，在使用零索引数组时总是进行心理调整；但是，对于熟悉的数据集（如月份、星期几、高尔夫球杆数等），当数组第一个值初始化为\
  \ 0 时通常 Bug 更少。如果你确实使用基于 1 的数据集，通过注释引起注意这一点并坏。\n\n再次，无论你对初始化数组做出什么选择，都要选择一种并在你的代码中保持一致。一致性有助于使代码更易读和理解，反过来让调试更容易。\n\
  \n# 初始化多维数组\n\n你也可以对多维数组使用初始化列表。例如，假设你想初始化一个二维数组（具有两行三列的数组）。你可以使用这段代码：\n\n```\n\
  \ int [,] myData = new int[] { {1,2,3}, {4,5,6};\n```\n\n初始化多维数组的语法规则是每行的值封装在自己的大括号中。如果你想提供元素计数，如下：\n\
  \n```\n int [,] myData = new int[2,3 ] { {1,2,3}, {4,5,6};\n```\n\n你可以这样做。然而，再次，编译器擅长这样做。因为你已经有很多任务要做，为什么不让编译器来执行那些它具有比较优势的任务呢？\n\
  \n一些程序员发现使用不同的样式来呈现多维数组初始化列表很有用：\n\n```\n int [] myData = new int[,] {\n       \
  \                       {1,2,3},\n                              {4,5,6}\n      \
  \                      };\n```\n\n\n\n\n虽然这种样式确实强化了数据定义建立了一个数据值矩阵的概念，但它也占据了三行额外的显示空间，你可能不舍得放弃这些空间。尽管如此，如果你认为这有助于理解数据，请选择这种样式并并在你的代码中一致地应用它。\n\
  \n## 字符串对象的初始化列表\n\n你也可以对字符串对象使用初始化列表。例如：\n\n```c\nstring[] weekDays = new string[]\
  \ { \"Monday\", \"Tuesday\",\n                            \"Wednesday\", \"Thursday\"\
  , \"Friday\",\n                            \"Saturday\", \"Sunday\" };\n```\n\n\
  其语法与值类型数据相同。然而，对象数组（即引用类型数据数组）的工作方式与值类型数据并不完全相同。图 8.1 展示了整数值类型数组的内存映射在内存中的呈现布方式。尽管作者在细节上进行了一些简化，但你应当将\
  \ `weekDays` 数组的内存映射可视化为类似于图 8.10 所示。\n\n**图 8.10** 字符串对象的内存映射\n\n![image](img/c08f010.jpg)\n\
  \n图 8.1 中整数数据的内存映射显示，实际的整数数据值位于从内存地址 900,000 开始的连续字节集中。（图中 `myData` 的右值为 900,000。）现在对比图\
  \ 8.1 和图 8.10。\n\n在图 8.10 中，你可以看到 `weekDays` 的左值为 700,000，其右值为 750,000。这意味着有一个从内存地址\
  \ 750,000 开始的内存地址数组。由于初始化列表包含了七个字符串，因此 `weekDays` 数组分配了足够的内存来存放七个连续的*内存地址*，而不是字符串本身，从地址\
  \ 750,000 开始。数组的每个元素都包含一个指向其字符串数据存储内存位置的内存地址。例如，数组中的第一个字符串对象存储在内存位置 800,000。转到该地址，你会发现\
  \ Monday 从该内存位置开始存储的。查看数组中的其他值，你可以发现它们是以相同的方式存储的。\n\n如果没有初始化列表，`weekDays` 数组会是什么什么样？在图\
  \ 8.10 中，你发现的不是从内存位置 750,000 开始的七个内存地址，而是发现数组中的每个元素都包含值 `null`。当 `weekDays` 数组的每个元素被分配一段字符串数据进行存储时，Windows\
  \ 操作系统根据 Windows 内存管理器找到足够字符串数据项内存的位置，向 Visual Studio 一个内存地址，以替换数组中该元素的 `null` 值。\n\
  \n为什么 C# 不像所示图 8.1 所示的整数数据那样将数据背挨着存储呢？原因是字符串数组中每个对象的内存需求（根据其长度）可能会有所不同。虽然每个整数始终占用\
  \ 4 字节，但字符串对象数组中的每个对象可能需要不同数量的内存。也就是说，存储 Friday 所需要的内存与存储 Wednesday 所需的内存不同。由于你无法假设对象数组元素的内存需求是对称的，因此\
  \ C# 必须存储一个内存地址数组（这些地址*是对称的*），其中每个元素都指向数组中该元素实际数据的内存位置。\n\n## 锯齿数组 (Ragged Arrays)\n\
  \n正是由于对象数组中缺乏这种对称性，产生了*锯齿数组*（*ragged array*或*jagged array*）这一术语。也就是说，如果你将一个整数元素数组堆叠在一起，它们将形成一个每个元素宽度为\
  \ 4 字节的平滑垂直列。如果你取星期数组并将元素堆叠在一起，该列可能会是锯齿状的，因为每个元素的宽度可能不同。\n\n值类型数据数组保证始终是对称的。也就是说，你总是可以把值类型数组理解为是按照图\
  \ 8.1 中呈现所示的方式进行存储的。\n\n### 在运行时定义锯齿数组\n\n正是由于对象数组中缺乏这种对称性，产生了*锯齿数组*（*ragged array*或*jagged\
  \ array*）这一术语。也就是说，如果你将一个整数元素数组堆叠在一起，它们将形成一个每个元素宽度为 4 字节的平滑垂直列。如果你取星期数组并将元素堆叠在一起，该列可能会是锯齿状的，因为每个元素的宽度可能不同。\n\
  \n值类型数据数组保证始终是对称的。也就是说，你总是可以把值类型数组理解为是按照图 8.1 中呈现所示的方式进行存储的。\n\n在图 8.10 中，你发现的不是从内存位置\
  \ 750,000 开始的七个内存地址，而是发现数组中的每个元素都包含值 `null`。当 `weekDays` 数组的每个元素被分配一段字符串数据进行存储时，Windows\
  \ 操作系统根据 Windows 内存管理器找到足够字符串数据项内存的位置，向 Visual Studio 一个内存地址，以替换数组中该元素的 `null` 值。\n\
  \n为什么 C# 不像所示图 8.1 所示的整数数据那样将数据背挨着存储呢？原因是字符串数组中每个对象的内存需求（根据其长度）可能会有所不同。虽然每个整数始终占用\
  \ 4 字节，但字符串对象数组中的每个对象可能需要不同数量的内存。也就是说，存储 Friday 所需要的内存与存储 Wednesday 所需的内存不同。由于你无法假设对象数组元素的内存需求是对称的，因此\
  \ C# 必须存储一个内存地址数组（这些地址*是对称的*），其中每个元素都指向数组中该元素实际数据的内存位置。\n\n```c\nint[][] samples\
  \ = new int[3][];\nsamples[0] = new int[count1];\nsamples[1] = new int[count2];\n\
  samples[2] = new int[count3];\n\nfor (int i = 0; i < 3; i++)\n{\n    samples[0][i]\
  \ = i;\n    samples[1][i] = i;\n    samples[2][i] = i;\n}\n```\n\n## 集合\n\n*集合*是共享特征的对象集合。你可以拥有字符串集合（就像\
  \ `weekDays` 数组那样），你也可以拥有复杂对象的集合，例如 ListView 或类似的控件。\n\n在下一个尝试中，你将使用集合来创建一个平方和立方表。虽然你可以轻松地不使用集合来编写程序，但它可以用于说明如何使用集合。\n\
  \n### 尝试：平方和立方 (Chapter08Program.zip)\n\n假设你想遍历 days 和 weekDays 数组。由于数组是对象，你可以将它们视为集合。按照以下步骤创建一个新项目：\n\
  \n1. 以通常的方式创建一个新项目，并添加列表 8-3 所示的代码。\n2. 添加两个按钮对象和一个 ListBox 对象。\n\n**图 8.11** 展示了示例的用户界面和程序运行情况。\n\
  \n![image](img/c08f011.jpg)\n\n注意你可以将任何集合放置在 ListBox 对象中。\n\n\n\n\n\n```\n using\
  \ System;\nusing System.Windows.Forms;\n\npublic class frmMain : Form\n{\n    private\
  \ Button btnCalc;\n    private Button btnClose;\n    private ListBox lstTest;\n\
  \    #region Windows code\n\n    public frmMain()\n    {\n        InitializeComponent();\n\
  \    }\n\n    public static void Main()\n    {\n        frmMain main = new frmMain();\n\
  \        Application.Run(main);\n    }\n\n    private void btnClose_Click(object\
  \ sender, EventArgs e)\n    {\n        Close();\n    }\n\n    private void btnCalc_Click(object\
  \ sender, EventArgs e)\n    {\n        int[] days = new int[] { 0, 31, 28, 31, 30,\
  \ 31, 30, 31, 31, 30,\n                     31, 31 };\n        string[] weekDays\
  \ = new string[] { \"Monday\", \"Tuesday\",\n                            \"Wednesday\"\
  , \"Thursday\", \"Friday\", \"Saturday\",\n                            \"Sunday\"\
  };\n\n        foreach (string str in weekDays)\n        {\n            lstTest.Items.Add(str);\n\
  \        }\n        foreach (int val in days)\n        {\n            lstTest.Items.Add(val.ToString());\n\
  \        }\n    }\n}\n```\n\n***工作原理***\n程序的代码显示在列表 8-3 中。这两个数组在按钮点击事件方法中定义。注意在遍历集合的循环中使用了\
  \ `foreach` 关键字：\n\n```\n foreach (string str in weekDays)\n{\n    lstTest.Items.Add(str);\n\
  }\nforeach (int val in days)\n{\n    lstTest.Items.Add(val.ToString());\n}\n```\n\
  \n`foreach` 循环专门设计用于遍历对象集合。它与标准的 `for` 循环相似，不同之处在于第一个表达式（标准 `for` 循环中的 `expression1`）始终被设置为集合中的第一个对象，并且循环逐个遍历数组中的所有元素（标准\
  \ `for` 循环中的 `expression3`）。循环中使用的数据类型必须与集合中的数据类型匹配。这就是为什么在第一个循环中 `str` 是 `string`，而在第二个循环中\
  \ `val` 是 `int`。你应该将 `foreach` 循环视为一个只读循环。也就是说，你不应该使用 `foreach` 循环来更改集合中任何对象的值。集合提供了一种通过迭代来查看对象的方便方法，但你不应该尝试在\
  \ `foreach` 循环内部修改这些对象。\n\n***\n\n# ArrayList 对象\n\n到目前为止讨论的数组被称为*静态数组*。这是因为当你设置了元素的大小后，它们就无法更改。事实上，在确定维度或多个维度之前，你无法使用静态数组。然而，生活并不总是那么简单。你经常会遇到这种情况：你知道你需要在数组中存储数据，但不知道可能需要多少个元素。例如，你可能会编写一个程序在名为\
  \ `Friends` 的对象中记录朋友的名字和地址。当你运行程序时，你可能需要 50 个数组元素，但另一个人可能只需要 20 个元素。问题在于，“你如何决定为数组分配多少元素？”\n\
  \n对于静态数组，通常的解决方案是妥协是最坏情况设计。*最坏情况设计*是指你尝试猜测数组大小可能需要的最大合理值，然后将数组的维度设置为该大小。这可能是低效的，因为大多数时候你可能都会高估数组所需的大小。`ArrayList`\
  \ 对象克服了静态数组的局限性。`ArrayList` 对象具有创建动态数组的效果，你不需要指定大小。现在来看看它是如何工作的。\n\n`ArrayList`\
  \ 对象提供简单数组不具备的功能。对于那些在编译时不知道数组大小的数组尤其如此。下面的“尝试一下”将向你如何在程序中使用 `ArrayLists`。\n\n***\
  \ 尝试一下：ArrayList 示例 (Chapter08ProgramArrayList.zip)\n编写一个简单的程序，能够将人的姓名添加到列表中。由于你不知道用户将添加多少个名字，因此你决定使用一个\
  \ `ArrayList` 对象。\n**1.** 按照通常的方法创建一个新项目。\n**2.** 添加一个文本对象、三个按钮对象、一个标签对象和一个 `ListBox`\
  \ 对象。示例界面如图 8.12 所示。\n\n**图 8.12** 使用 `ArrayList` 对象的示例程序\n\n![image](img/c08f012.jpg)**3.**\
  \ 添加在列表 8-4 中所示的代码。程序让用户输入姓名，然后点击 `Add` 按钮。该过程只要用户想要就可以一直持续。当他完成时，可以点击 `Show` 按钮查看他输入的姓名列表。\n\
  \n列表 8-4: 使用 ArrayLists (frmMain.cs)\n\n```\n using System;\nusing System.Windows.Forms;\n\
  using System.Collections;\n\npublic class frmMain : Form\n{\n    ArrayList names\
  \ = new ArrayList();\n\n    private TextBox txtName;\n    private Button btnAdd;\n\
  \    private Button btnShow;\n    private Button btnClose;\n    private ListBox\
  \ lstNames;\n    private Label label1;\n\n    #region Windows code\n\n    public\
  \ frmMain()\n    {\n        InitializeComponent();\n    }\n\n    public static void\
  \ Main()\n    {\n        frmMain main = new frmMain();\n        Application.Run(main);\n\
  \    }\n\n    private void btnAdd_Click(object sender, EventArgs e)\n    {\n   \
  \     if (txtName.Text.Length != 0)\n        {\n            names.Add(txtName.Text);\
  \    // 添加新姓名\n            txtName.Clear();            // 清空\n            txtName.Focus();\
  \            // 准备输入下一个名字\n        }\n        else\n        {\n            MessageBox.Show(\"\
  请输入姓名。\", \"输入错误\");\n            return;\n        }\n    }\n\n    private void\
  \ btnShow_Click(object sender, EventArgs e)\n    {\n        foreach (string str\
  \ in names)\n        {\n            lstNames.Items.Add(str);\n        }\n    }\n\
  \n    private void btnClose_Click(object sender, EventArgs e)\n    {\n        Close();\n\
  \    }\n}\n```\n\n\n\n这段代码简单地检查用户是否输入了名称，然后使用 `ArrayList` 对象的 `Add()` 方法将新名称添加到列表中。程序随后从\
  \ `txtName` 文本框对象中清除刚刚输入的名称，并将焦点置回文本框对象，为输入另一个名称做准备。用户可以继续此过程，直到所有名称都输入完毕。当用户完成名称输入后，可以点击\
  \ `Show` 按钮查看其刚刚输入的名称列表。`Show()` 点击事件中的代码使用 `foreach` 循环遍历 `ArrayList` 对象，并将每个名称添加到\
  \ `ListBox` 对象中。`ArrayList` 对象使得在程序中使用动态数组变得简单。此外，请注意，`ArrayList` 对象具有表 8.1 中所示的大部分方法和属性供你使用。例如，如果你想在列表框中显示名称之前按排序顺序呈现它们，只需在\
  \ `foreach` 循环之前添加语句\n\n```\nnames.Sort();\n```\n名称将以升序顺序显示。如果 `ArrayList` 对象允许你创建动态数组，你为什么还要使用静态数组呢？这就像那句老话：“天下没有免费的午餐。”编程中也是如此。`ArrayList`\
  \ 对象的动态行为为它们增加了相当大的开销，因此对于相同的对象，它们往往比静态数组消耗更多内存。这种额外的开销意味着与静态数组相比，处理 `ArrayList`\
  \ 对象的过程中会有轻微的性能影响。尽管如此，在程序中使用“无尺寸”数组的能力提供了足够的灵活性，使得 `ArrayList` 成为你工具箱中极具价值的工具。\n\
  \n# 总结\n\n数组是任何编程语言中的基础数据结构，在进入第 9 章之前，你应该熟悉本章介绍的概念。\n\n# 练习\n\n你可以在附录 A 中找到以下练习的答案。\n\
