  \ 关键字意味着你想创建一个某种类型的新对象。因此，你访问 `System` 对象并使用点运算符来查看其内部。在 `System` 对象内部，你看到了一堆东西，包括一个\
  \ `Windows` 对象。因为这看起来很有戏，你又使用另一个点运算符来查看 `Windows` 对象内部。在 `Windows` 对象内部，你又看到了更多的属性和方法，其中一个是一个\
  \ `Forms` 对象。现在你已经接近目标了，所以你再次使用另一个点运算符来访问 `Forms` 对象。在 `Forms` 对象内部，你找到了 `Label()`\
  \ 方法，你可以调用它来实例化一个新的标签对象。太棒了！因为这正是你想要做的。你调用 `Label()` 方法来实例化一个名为 `label1` 的新标签对象。\n\
  \n不要被多个点运算符吓到。只需记住，点运算符始终将对象（点运算符左侧）与该对象内部的属性或方法（点运算符右侧）隔离开来。然而，由于一个对象可以包含另一个对象，你可能需要使用另一个点运算符来窥探*那个*对象的内部。在前面的语句中，`System`\
  \ 对象显然内部包含一个 `Windows` 对象。因此，你使用另一个点运算符进入 `Windows` 对象内部，发现 `Windows` 对象内部定义了一个\
  \ `Forms` 对象。你不为所畏，进入 `Forms` 对象内部，发现那里有一个 `Label` 对象。最后，你调用 `Label()` 方法在内存中为你实例化一个标签对象。然后，Visual\
  \ Studio 将使用 ID `label1` 将该标签对象的信息存入符号表。无论语句有多复杂，只要你跳过足够多的点运算符，你最终就能看到你感兴趣的属性或方法。尽管你必须穿过三个对象到达那里，但你最终还是找到了那个为你构建名为\
  \ `label` 的新标签对象的方法。轻而易举！\n\n始终要记住：每当你使用点运算符时，Visual Studio 都会显示该对象中可用的属性和方法的列表。你在图\
  \ 5.4 中看到过这一点。（某些属性实际上代表了可以用于实例化新对象的类，但你仍然可以将它们看作属性。）\n\nVisual Studio 为你编写了 `InitializeComponent()`\
  \ 方法中的下一行：\n\n```\nthis.txtCompleteDateAndTime = new System.Windows.Forms.TextBox();\n\
  ```\n\n这创建了一个新的文本框对象，将其命名为 `txtCompleteDateAndTime`，并将其添加到 `frmMain` 中。这个过程不断重复，直到所有的表单对象（标签、文本框和按钮）都添加完毕。如果你继续查看\
  \ `InitializeComponent()` 方法中的代码列表，你就可以看到在创建用户界面时设置的属性值。也就是说，你可以看到放置在标签中的文本、将它们拖到表单上后每个标签、文本框和按钮的位置，以及你可能更改的任何相关属性（如边框样式、大小、`AutoSize`\
  \ 等）。\n\n### 程序如何开始执行\n\n你在第 1 章中学习过，每个 C# 程序都从一个名为 `Main()` 的特殊方法开始执行。考虑代码列表 5-2\
  \ 中的以下语句：\n\n```\npublic static void Main()\n{\n    frmMain main = new frmMain();\n\
  \    Application.Run(main);\n}\n```\n\n这些语句定义了 `Main()` 方法，并标记了程序开始执行的位置。第一行表示你想创建一个\
  \ `frmMain` 类的新对象，并将其命名为 `main`。（记住 C# 是区分大小大小的，所以 `Main` 不等于 `main`。）如果你查看代码列表\
  \ 5-2 的顶部，你可以看到你定义的类名是 `frmMain`。因此，这条语句告诉 Visual Studio 你想创建一个类型为 `frmMain` 的对象。\n\
  \n## 类构造函数\n\n由于赋值运算符的右侧首先处理，发生的第一件事是 `new` 关键字向 Windows 发送消息，请求足够的内存来存放一个 `frmMain`\
  \ 对象。假设 Windows 能找到足够的内存，程序随后会调用 `frmMain()` 方法。所调用的方法与你尝试实例化的对象同名。与类同名的方法被称为*类构造函数*。构造函数的目的是在使用该类的对象之前执行任何需要完成的初始化任务。从代码列表\
  \ 5-2 中，你可以看到构造函数如下：\n\n```\npublic frmMain()\n{\n    InitializeComponent();\n \
  \   UpdateTimeInfo();       // 更新文本框\n}\n```\n\n关于构造函数，有几点你需要记住：\n\n- 构造函数的名称与它们所属的类的名称始终相同。\n\
  - 如果你想实例化该类的对象，构造函数在名称前始终要使用 `public` 关键字。\n- 构造函数永远不会向调用者返回值。\n\n在 `frmMain` 类的构造函数内部，发生的第一件事是代码调用了\
  \ `InitializeComponent()` 方法。然而，正如你在图 5.11 中所示，`InitializeComponent()` 所做的是将标签、文本框和按钮对象放置在表单的正确位置，并设置你在创建用户界面时通过拽指定的属性值。\n\
  \n当 `frmMain()` 构造函数完成后，你的 `frmMain` 对象在内存中的状态完全符合你设计时的要求。现在呢？\n\n嗯，接下来发生的事情是程序调用了你写的\
  \ `UpdateTimeInfo()` 方法（我们稍后会讨论）。从本质上说，`UpdateTimeInfo()` 方法所做的就是使用格式选项为文本框填充日期时间信息。\n\
  \n## 调用应用程序\n\n实例化对象后，程序遇到 `frmMain()` 构造函数的右括号，知道是时候返回到调用处了。返回到调用处意味着程序控制返回到语句\n\
  \n```\nfrmMain main = new frmMain();\n```\n\n你的代码现在已经在内存中创建了 `frmMain` 镜像，并将其与名为\
  \ `main` 的对象关联。下一行说：“好了，一切都准备就绪。通过名为 `main` 的对象调用 `Run()` 方法来执行程序”：\n\n```\nApplication.Run(main);\n\
  ```\n\n到此时……砰！你名为 `main` 的 `frmMain` 对象出现在显示屏幕上，用户实际上看到了你所有工作的成果。输出结果应该与图 5.10 所示所示。\n\
  \n你应该亲手证明这些操作。要这样做，请将光标放在以下行上并按 F9：\n\n```\nfrmMain main = new frmMain();\n```\n\
  \n这在程序的该点设置了一个断点。（该程序行现在显示为红色背景。）现在运行程序。\n\n\n\n不久，Visual Studio 会停在设置了断点的行上，并将背景颜色设置为黄色。将黄色理解为一种警告，告知你\
  \ Visual Studio 已准备好执行该行。现在按下 `F11`。你会看到黄色行跳转到 `frmMain()` 构造函数。你可以继续按 `F11` 键移动到\
  \ `InitializeComponent()` 方法。如果你继续按 `F11`，Visual Studio 将继续单步执行程序中的每一行。如果你觉得无聊，按\
  \ `Shift+F11`，Visual Studio 将带你返回调用者 `frmMain()` 方法。使用调试器遍历程序代码是查看运行情况的好方法。如果你在到达第一个断点时调用“调试窗口->本地变量”（Debug\
  \ Windows Locals）菜单序列，获取的信息会更多。这会打开一个调试窗口，允许你在单步执行代码时观察程序变量。非常有用。\n\n## `UpdateTimeInfo()`\
