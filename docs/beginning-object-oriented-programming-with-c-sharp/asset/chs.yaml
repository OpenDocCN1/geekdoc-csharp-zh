  \      MessageBox.Show(\"Failed to update data.\", \"Process Error\");\n       \
  \     }\n        }\n        catch (Exception ex)\n        {\n            MessageBox.Show(\"\
  Error: \" + ex.Message);\n        }\n    }\n```\n\n变量 `myData` 连接到数据库，`sqlCommand`\
  \ 根据文本框的内容构建。`UPDATE` 命令简单地指定了要更改的表，随后跟上 `SET` 关键字，然后是字段名列表和相关数据。构造命令后，它被传递给 `clsFriend`\
  \ 类的 `ProcessCommand()` 方法。代码列表 14-7 显示了 `ProcessCommand()` 方法的代码。\n\n代码列表 14-7:\
  \ 处理 SQL 查询 (`clsFriend.cs`)\n\n```\n /*****\n    * Purpose: 在数据库上处理 SQL 命令\n  \
  \  *\n    * 参数列表:\n    *  string sqlCommand    持有 CREATE TABLE 指令的命令字符串\n    *\n\
  \    * 返回值:\n    *  int             成功返回 1，否则返回 0\n    *\n    * CAUTION: 该方法假设连接字符串已设置\n\
  \     *****/\n    public int ProcessCommand(string sqlCommand)\n    {\n        int\
  \ flag = 1;\n        try\n        {\n            using (SqlConnection conn = new\
  \ SqlConnection(connectString))\n            {\n                conn.Open();\n \
  \               SqlCommand command = new SqlCommand(sqlCommand, conn);\n       \
  \         flag = command.ExecuteNonQuery(); // 添加记录\n                conn.Close();\n\
  \            }\n        }\n        catch\n        {\n            flag = 0;\n   \
  \     }\n        return flag;\n    }\n```\n\n处理命令的代码现在应该看起来熟悉了。命令字符串 `sqlCommand`\
  \ 打开连接并调用 `ExecuteNonQuery()` 来处理 `UPDATE`。由于查询字符串被传递给 `ProcessCommand()`，该方法可以处理任何表的任何\
  \ SQL 命令。因此，虽然这里讨论的程序没有提供编辑卡片类型或交换卡片的功能，但实现这一点非常简单，这留给你练习。\n\n## \n\n你对什么是数据库、如何创建和扩展数据库以及如何操作数据库内的数据有了很好的理解。现在你已经讨论了分类数据库的主要元素，你应该花时间单步执行代码。还可以尝试\
  \ `dataGridView` 控件并更改其某些属性以观察其对行为的影响。这是值得的。\n\n## 练习题\n\n你可以在附录 A 中找到以下练习的答案。\n\
