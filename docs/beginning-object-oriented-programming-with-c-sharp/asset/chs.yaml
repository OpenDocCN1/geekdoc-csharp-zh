  本章讨论了通用型，这是自 C#  2005 年发布以来一直存在的一个功能。通用型具有潜力为你节省大量的编程工作。\n\n通用型为你提供了一种以合逻辑的方式来扩展你的编程时间。在本章中，你将研究这一相对新的面向对象编程（OOP）特性能提供什么。\n\
  \n# 什么是通用型？\n\n理解通用型为编程带来的价值的最佳方法是通过例子。排序数据是一个常见的编程问题。我曾参加过一份咨询工作的面试，面试的一部分是一个编程测试，我被要求生成一系列随机数，将它们显示在列表框（listbox）中，按升序排序，并在第二个列表框中重新显示。当我跳过编写自己的排序程序，而简单地开启第二个列表框的\
  \ `Sorted` 属性时，面试官们并不高兴。教训：了解你的工具箱。但假设你必须对一组整数数据进行升序排序，且不能使用列表框技巧。你会如何编写解决方案？\n\n\
  作为通用型介绍的一部分，在接下来的“尝试一下”中，你将编写一个短程序，将数据列表按升序排序。然后对示例进行修改，向你展示通用型如何让此类任务变得简单得多。\n\n\
  ***\n\n**尝试一下：快速排序 (Chapter12ProgramQuickSort.zip)** 尽管关于排序算法的著作有很多，但一种最快的通用排序算法之一是快速排序。该算法使用分治法对数据进行分区，然后递归地调用自己来执行排序任务。程序的示例运行如\
  \ 图 12.1 所示，并可用于布局用户界面。\n\n图 12.1 用户界面\n\n![image](img/c12f001.jpg) 尝试此程序：\n\n**1.**\
  \ 以正常方式创建一个新项目。**2.** 创建一个类似于 图 12.1 所示的用户界面。**3.** 从文件 `Chapter12ProgramQuickSort.zip`\
  \ 下载代码。左侧列表框对象显示了使用伪随机数类（`Random`）生成的 10 个整数值的“原始”数据。当用户点击排序按钮后，这些数字将被排序并显示在第二个列表框对象中。（不，我没有简单地将\
  \ `Sorted` 属性设置为 true。）\n\n***工作原理*** 像往常一样，`frmMain` 执行了五个程序步骤中的四个，将处理步骤留给 `clsSort`\
  \ 中的中的代码。`frmMain` 的代码如 列表 12-1 所示。\n\n列表 12-1: 排序数据列表的程序。 (`frmMain.cs`)\n\n\n\n\
  \n\n```cpp\n #define MYDEBUG\n//#undef MYDEBUG\n\nusing System;\nusing System.Windows.Forms;\n\
  \npublic class frmMain : Form\n{\n    private const int MAXVAL = 1000;    // 生成的最大随机数\n\
  \n    private int[] data;                 // 排序的数据数组\n    private int number;  \
  \               // 数组中的元素数量\n\n    private TextBox txtNumber;\n    private Button\
  \ btnGen;\n    private ListBox lstOutput;\n    private Button btnClose;\n    private\
  \ Button btnSort;\n    private ListBox lstSorted;\n    private Label label1;\n\n\
  \    #region Windows code\n\n    public frmMain()\n    {\n        InitializeComponent();\n\
  \    }\n\n    public static void Main()\n    {\n        frmMain main = new frmMain();\n\
  \        Application.Run(main);\n    }\n\n    private void btnGen_Click(object sender,\
  \ EventArgs e)\n    {\n        bool flag;\n        int i;\n\n        flag = int.TryParse(txtNumber.Text,\
  \ out number);\n        if (flag == false)\n        {\n            MessageBox.Show(\"\
  Enter whole digits only.\", \"Input Error\");\n            txtNumber.Focus();\n\
  \            return;\n        }\n\n#if MYDEBUG\n    Random rnd = new Random(number);\
  \    // 用于测试\n#else\n    Random rnd = new Random();\n#endif\n\n        data = new\
  \ int[number];\n\n        lstOutput.Items.Clear();           // 清空列表框对象\n      \
  \  lstSorted.Items.Clear();\n\n        for (i = 0; i < data.Length; i++)  // 设置随机值\n\
  \        {\n            data[i] = rnd.Next(MAXVAL);\n            lstOutput.Items.Add(data[i].ToString());\n\
  \        }\n    }\n\n    private void btnSort_Click(object sender, EventArgs e)\n\
  \    {\n        int i;\n        clsSort mySort = new clsSort(data);\n\n        mySort.quickSort(0,\
  \ data.Length-1);   // 排序数据\n\n        for (i = 0; i < data.Length; i++)    // 显示\n\
  \        {\n            lstSorted.Items.Add(data[i].ToString());\n        }\n  \
  \  }\n\n    private void btnClose_Click(object sender, EventArgs e)\n    {\n   \
  \     Close();\n    }\n}\n```\n\n该列表利用了第 11 章中提到的脚手架代码技术（scaffold coding）。特别注意列表顶部的行以及随后的脚手架结构：\n\
  \n```\n #define DEBUG\n#undef DEBUG\n\n// 省略的代码行 . .\n\n#if DEBUG\n    Random rnd\
  \ = new Random(number);    // 用于测试\n#else\n    Random rnd = new Random();\n#endif\n\
  ```\n\n由于 `#undef` 预处理器指令的存在，程序后部分的 `#if` 测试逻辑为 False，这意味着 `Random` 类的构造函数是在不带参数的情况下被调用的。这导致\
  \ `rnd` 在程序的每次运行中都会产生一组不同的伪随机数。（之所以被称为*伪随机*，是因为数字的分布仅近似于真实的随机数字分布。）在开发代码时，产生一组可重复的数字序列通常是有用的，这样在调试和测试时你就拥有一个稳定的测试数据集。要建立该测试环境，只需注释掉\
  \ `Random` 类参数化构造函数中切换的 `#undef DEBUG` 行即可。完成测试后，删除 `#undef` 的注释字符，如 Listing 12-1\
  \ 所示。该行：\n\n```\n data[i] = rnd.Next(MAXVAL);\n```\n\n 仅仅是生成一系列落在 `0` 到 `MAXVAL`\
  \ 范围内的随机数，`MAXVAL` 是一个被设置为 `1000` 的符号常量。然后将随机值集合添加到列表框对象中。以下语句定义了一个名为 `mySort` 的\
  \ `clsSort` 对象，然后调用 `quickSort()` 方法对数据进行排序：\n\n```\n clsSort mySort = new clsSort(data);\n\
  \nmySort.quickSort(data.Length  1);   // 排序数据\n```\n\n注意构造函数接收原始数据作为参数。`clsSort`\
  \ 的代码在 Listing 12-2 中所示。\n\nListing 12-2: `clsSort` 的代码 (`clsSort.cs`)\n\n```\n\
  \ using System;\nusing System.Collections.Generic;\nusing System.Text;\n\nclass\
  \ clsSort\n{\n    int[] data;\n\n    public clsSort(int[] vals)\n    {\n       \
  \ data = vals;    // 拷贝右值\n    }\n\n    /*****\n     * 目的：此方法通过递归调用 quickSort()\
  \ 将整数数组值\n     *          按升序排序。\n     *\n     * 参数列表：\n     *  int first      \
  \     要排序的第一个值\n     *  int last            要排序的最后一个值\n     *\n     * 返回：\n    \
  \ *  void\n     *****/\n    public void quickSort(int first, int last)\n    {\n\
  \        int start;      // 左分区的索引\n        int end;        // 右分区的索引\n\n      \
  \  start = first;  // 保留数组第一个元素的拷贝\n        end = last;     // ……最后一个元素的。\n\n  \
  \      if (last  first)   // 确保有足够的数据进行排序\n        {\n            int pivot = data[first];\
  \    // 设置分区\n\n            while (end > start)         // 当索引不匹配时……\n         \
  \   {                           // 左分区\n                while (data[start] <= pivot\
  \ && start <= last && end > start)\n                    start++;\n             \
  \                             // 右分区\n                while (data[end] > pivot &&\
  \ end >= first && end >= start)\n                    end--;\n                if\
  \ (end > start)    // 如果分区索引较……\n                    swap(start, end); //……进行交换\n\
  \            }\n            swap(first, end);    // 交换最后一个元素与元素\n            quickSort(first,\
  \ end);   // 在分区周围排序\n            quickSort(end + 1, last);\n        }\n       \
  \ else\n        {\n            return;\n        }\n\n    }\n\n    /*****\n     *\
  \ 目的：此方法为 quickSort() 执行数据交换\n     *\n     * 参数列表：\n     *  int pos1           \
  \ 第一个值的数组索引\n     *  int pos2            第二个值的数组索引\n     *\n     * 返回：\n     * \
  \ void\n     *****/\n    public void swap(int pos1, int pos2)\n    {\n        int\
  \ temp;\n\n        temp = data[pos1];\n        data[pos1] = data[pos2];\n      \
  \  data[pos2] = temp;\n    }\n}\n```\n\n## 递归\n\n快速排序算法的原理是围绕数据中的*枢轴点*将数字集合分成两个部分。代码查看分区周围的数据，并调用\
  \ `swap()` 方法交换值以重新排列数据。然后代码从内部调用相同的 `quickSort()` 方法。方法调用自身的过程被称为*递归*。\n\n\n\n\n\
  递归的好消息是，你实际上通过重用同一个方法调用，而不是编写某种形式的循环来完成相同任务，从而减少代码量。坏消息是很容易写错代码，特别是在确定何时达到最后一次递归调用时。因为递归方法调用每次被调用时都会创建一组新的局部变量，失控的递归最终会耗尽内存并导致程序以惨看的方式终结。此外，由于每次调用方法都会涉及一定的开销（例如从堆栈中推入和弹出数据的开销），递归通常比该问题的非递归解决方案慢一点。\n\
  \n然而，大多数快速排序的实现都使用递归，因此这里也是这么做的。你可以在列表 12-2 的末尾看到两个递归调用。如前所述，`swap()` 方法在算法需要时简单地交换两个值。\n\
  \n许多排序算法的性能因素由*大 O 表示法*的决定（例如，`O(N²)` 符号）。这种表示法意味着，如果排序的值数量增加十倍，排序数据所需的时间将增加一百倍。而另一方面，快速排序受到\
  \ `O(N * LogN)` 关系的限制，这可以使排序时间几乎呈线性增长。（也就是说，10 倍的数据大约需要 10 倍的时间。）一个冷知识：大多数程序员认为泡泡排序是地球上最慢的排序算法。实际上，如果数据已经是排序好的，并且向数据集中添加了一个新项，泡泡排序可以是该新数据集最快的算法之一。（当你在下次鸡尾酒会上提到这个话题时，你可以让朋友们大开眼界。）结论：编程中很少有法律是刻板不变的。\n\
  \n好了。现在你有一个可以以良好性能排序数据的类。你可以将代码保存在某处以备后用。毕竟，OOP 的真正优势之一是代码重用，对吧？嗯，这取决于情况。\n\n##\
  \ 数据问题\n\n过几个月后：一个客户带着编程问题来找你。解决方案的一部分要求你在对数据进行最终处理之前对其进行排序。你的神经元跳动了一下，你想起了不久前编写的排序代码。太棒了！是时候把\
  \ `clsSort` 代码拿出来，并将其集成到解决方案中了。你阅读了客户对程序的其余规格说明，然后……\n\n噢糟糕。\n\n客户的规格说明要求对 `double`\
  \ 数据类型进行排序，但你的 `clsSort` 代码只适用于 `int` 数据。当然，你可以重写代码，将一切更改为使用 `double` 数据类型，但你就失去了排序整数数据的能力。或者你可以复制代码，在类中编写独立的\
  \ `int` 和 `double` 排序方法。然而，如果你这样做，你就有两倍的代码需要测试、调试和维护。如果一个排序方法就能用于排序两种类型的数据，那该有多好呢？这正是泛型（generics）旨在解决的问题类型。\n\
  \n# 泛型简介\n\n简单来说，*泛型*允许你在 C# 中创建“无类型”的数据结构。在之前介绍的快速排序示例中，你使用以下语法定义 `clsSort` 对象的实例：\n\
  \n```\nclsSort mySort = new clsSort(data);\n```\n\n正如你所看到的，问题在于该算法是基于使用 `int` 数据类型进行处理的。使用泛型类，定义变为：\n\
  \n```\nclsSort<T> mySort = new clsSort<T>(data);\n```\n\n你想要使用的数据类型被替换为角括号内的术语 `T`。例如，如果你想排序存储在\
  \ `data` 数组中的 `int` 数据值，你会使用这段代码：\n\n```\nclsSort<int> mySort = new clsSort<int>(data);\n\
  ```\n\n在以后使用 `double` 数据类型的某个项目中，你将使用这段代码：\n\n```\nclsSort<double> mySort = new\
  \ clsSort<double>(data);\n```\n\n泛型的关键优势之一是，相同的代码可以处理不同的数据类型，*无需为每种数据类型更改源代码*！如果你使用泛型模型编写类，该类就可以处理不同的数据类型，而无需为每种数据类型手工编写方法。Visual\
  \ Studio 编译器为你生成必要的代码来处理不同的数据类型。\n\n## 泛型对比 ArrayList\n\n你可能会说：“等一下！ArrayList 不是不能做同样的事情吗？毕竟，它们自带一个\
  \ `Sort()` 方法。” 嗯，并不完全是。ArrayList 受到一些混乱限制的限制。考虑以下代码片段：\n\n```\nArrayList a = new\
  \ ArrayList();\nint i = 5;\n\na[0] = i;\na[1] = \"t\";\n```\n\n前面的代码可以毫无抱怨地通过编译。那么问题所在哪里？问题在于它在应该抱怨时*没有*抱怨。ArrayList\
  \ 的好消息是它们被设计为包含任何内容。坏消息是 ArrayList *可以*包含任何内容。在你刚刚看到的片段中，一个整数被分配给 ArrayList，随后一个字符串字面量也被分配给同一个\
  \ ArrayList。\n\n虽然对数组中的任何数据类型进行排序提供了一种存储内容的灵活手段，但也意味着对数据没有进行任何类型检查。此外，你如何安全地从 ArrayList\
  \ 中读回数据？使用 ArrayList 就放弃了数据类型检查的安全性。现在考虑如果你在之前定义的 ArrayList 中添加以下语句会发生什么：\n\n```\n\
  i = a[0];\n```\n\n编译器会对该语句报错：\n\n```\n无法将类型 'object' 转换为 'int'。你是否缺少转换？\n当你将语句更改为显式转换时，编译器才会消除错误：\n\
  i = (int) a[0];\n```\n\n将 ArrayList 中的所有内容转换为目标类型是非常出错的。失去类型检查的优势等同于编写会产生故障的代码。最后，正如第\
  \ 8 章提到的，ArrayList 的底层工作存在一些性能问题。\n\n### 装箱与拆箱\n\n回顾第 5 章，C# 将所有值类型封装起来，以便你可以将值类型视为对象。本质上，C#\
  \ 中的所有内容都派自 `Object`，ArrayList 利用这一事实实现了存储任何对象的魔法。然而，每当你将值类型作为对象使用时，C# 必须将该值类型转换为对象，这个过程被称为装箱（boxing）。同样，将箱对象转换回其值类型的过程被称为拆箱（unboxing）。正是这种装箱/拆箱功能允许你对值类型使用\
  \ `ToString()` 等方法。\n\n然而，没有免费的午餐，封装带来的灵活性是以性能为代价的。据估计，装箱拆箱过程会导致大约 100%的性能损失。\n\n\
  泛型克服了许多此类限制。泛型最大的优势之一是它们提供了强类型检查，同时让你在每次使用数据项时避免类型转换。为了演示泛型的使用，请在下面的“尝试”中使用它们实现你的快速排序算法。\n\
  \n* * *\n\n**尝试：泛型快速排序 (Chapter12ProgramGenericQuickSort.zip)** 泛型版本排序程序的用户界面所示图\
