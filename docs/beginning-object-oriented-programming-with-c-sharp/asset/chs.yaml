  \  // 如果结果为 OK 则打印文档。\n            if (result == DialogResult.OK)\n            {\n\
  \                myBackgroundWorker.RunWorkerAsync(doPrint);\n            }\n  \
  \      }\n        catch (Exception ex)\n        {\n            MessageBox.Show(\"\
  Error: \" + ex.Message);\n            return;\n        }\n    }\n\n    private void\
  \ myBackgroundWorker_DoWork(object sender,\n                 System.ComponentModel.DoWorkEventArgs\
  \ e)\n    {\n        try\n        {\n            clsPrint myPrinterJob = e.Argument\
  \ as clsPrint;\n// 如果你想在不浪费纸的情况下测试这一点，请取消\n// 下行的注释并注释掉对 myPrinterJob.Print() 的调用\n\
  \            // Thread.Sleep(10000);\n             // 注释掉以避免打印\n\n            myPrinterJob.Print();\n\
  \            e.Result = myPrinterJob;\n        } catch (Exception ex) {\n      \
  \      MessageBox.Show(\"Error in DoWork: \" + ex.Message);\n        }\n    }\n\n\
  \    private void myBackgroundWorker_RunWorkerCompleted(object\n               \
  \   sender, RunWorkerCompletedEventArgs e)\n    {\n        // 让他们知道任务已完成……\n   \
  \     lblJobDone.Visible = true;\n    }\n}\n```\n\n***工作原理***\n\n注意代码中添加了两个新的命名空间\
  \ `Threading` 和 `ComponentModel`，因为代码引用了这些命名空间中的对象。此外，在列表顶部定义了语句\n\n```cs\n private\
  \ System.ComponentModel.BackgroundWorker myBackgroundWorker;\n```\n\n是因为你需要使用的 `BackgroundWorker`\
  \ 对象。如果你仔细观察代码，几乎几乎所有内容都是一样的，除了在 `btnPrint` 点击事件中，代码没有调用：\n\n```cs\n doPrint.Print();\n\
  ```\n\n代码而是调用了：\n\n```cs\n myBackgroundWorker.RunWorkerAsync(doPrint);\n```\n\n\
  `RunWorkerAsync()` 方法会触发 `DoWork()` 线程事件。注意 `doPrint` 对象被传递给事件处理器，以便处理器可以访问它可能需要的任何\
  \ `clsPrint` 数据。\n\n## 使用线程你获得了什么？\n\n在程序中添加线程的主要好处是，用户不需要坐在显示器前等待打印任务完成。如果有第二个文件要打印，用户可以在当前文件完成打印之前通过点击\
  \ `Select Print File` 按钮开始查找该文件。\n\n如果你想在过程中不浪费大量纸张测试此“无等待”功能，请取消 `DoWork()` 事件处理器中行的注释：\n\
  \n```cs\n // Thread.Sleep(10000);\n```\n\n并注释掉：\n\n```cs\n myPrinterJob.Print();\n\
  ```\n\n\n\n\n这些更改会导致程序暂停 10 秒而不是打印文件，这段时间足够你点击“选择打印文件”按钮，并验证即使在打印机正在工作时它仍然有效。\n\n\
  在基础打印程序中添加多线程的另一个用处是，你可以看到当需要时，让你的程序利用多线程是多么简单。\n\n# 重构\n\n简单来说，重构是对现有程序进行修改，以提高其性能或简化代码。图\
  \ 17.6 显示了在代码编辑器上下文右键菜单中看到的各种重构选项。\n\n图 17.6 重构选项\n\n![image](img/c17f006.jpg)\n\
  \n## 重命名 (Rename)\n\n简单来说，`Rename`（重命名）重构选项允许你重命名变量、方法、类或其他程序元素。要使用此选项，只需将光标移动到你想要更改的元素上，双击高亮它，然后按\
  \ `F2`。（你也可以右键点击元素以弹出“重构”菜单。）填写新名称后，Visual Studio 会进行相应的更改。\n\n你可能在想：“为什么不直接用编辑器的搜索和替换功能呢？”这是因为重构功能知道作用域的概念，而编辑器并不知道。也就是说，如果你在一个语句块中定义了一个名为\
  \ `flag` 的变量，在另一个语句块中定义了同名的另一个变量，重构只会更改具有相同作用域级别的 `flag` 出现处。使用编辑器进行此类更改会在不考虑作用域的情况下更改名称……这可能不是你想要的结果。\n\
  \n## 提取方法 (Extract Method)\n\n`Extract Method`（提取方法）重构选项允许你将重复代码提取出来并将其轻松集成到方法中。例如，考虑列表\
  \ 17-5 所示的 RDC。每个文本框对象都有与对象的 `Leave` 事件绑定的代码（即当你按下 `Tab` 键将光标移动到下一个字段时触发的事件）。\n\n\
  在接下来的“尝试一下”中，你将使用代码列表查看 `Extract Method` 重构带来了什么。\n\n***\n\n**尝试一下：提取方法** 要要查看 `Extract\
  \ Method` 如何工作，请遵循以下步骤：\n\n1. 使用项目名称 `ExtractMethod` 创建一个新项目。\n2. 在列表 17-5 中输入代码。（或下载它；它在\
  \ `Chapter17ProgramRefactor.zip` 文件中。）\n3. 添加三个标签和相应的文本框对象以及一个退出按钮。你的用户界面可能与图 17.7\
  \ 相似。\n\n列表 17-5: 未重构的程序\n\n```\nusing System;\nusing System.Text.RegularExpressions;\n\
  using System.Windows.Forms;\n\npublic class frmMain : Form\n{\n    private Label\
  \ label1;\n    private Label label2;\n    private Label label3;\n    private TextBox\
  \ txtHomePhone;\n    private TextBox txtCellPhone;\n    private TextBox txtWorkPhone;\n\
  \    private Button btnCheck;\n    private Button btnExit;\n\n   // Regex myRegex\
  \ = new Regex();\n\n    #region Windows Code\n\n    public frmMain()\n    {\n  \
  \      InitializeComponent();\n    }\n\n    [STAThread]\n    public static void\
  \ Main()\n    {\n        frmMain main = new frmMain();\n        Application.Run(main);\n\
  \    }\n\n    private void txtHomePhone_Leave(object sender,\n                 \
  \               EventArgs e)\n    {\n        Regex regexObj = new Regex(\"\\\\d{3}-\\\
  \\d{4}\");\n\n        if (regexObj.IsMatch(txtHomePhone.Text) == false)\n      \
  \  {\n            // 格式错误\n            MessageBox.Show(\"Phone number must be in\n\
  \                   XXX-NNNN format.\", \"Format Error\");\n            txtHomePhone.Focus();\n\
  \            return;\n        }\n    }\n\n    private void txtWorkPhone_Leave(object\
  \ sender,\n                                EventArgs e)\n    {\n        Regex regexObj\
  \ = new Regex(\"\\\\d{3}-\\\\d{4}\");\n\n        if (regexObj.IsMatch(txtWorkPhone.Text)\
  \ == false)\n        {\n\n            // 格式错误\n            MessageBox.Show(\"Phone\
  \ number must be in\n                   XXX-NNNN format.\", \"Format Error\");\n\
  \            txtWorkPhone.Focus();\n            return;\n        }\n    }\n\n  \
  \  private void txtCellPhone_Leave(object sender,\n                 EventArgs e)\n\
  \    {\n        Regex regexObj = new Regex(\"\\\\d{3}-\\\\d{4}\");\n\n        if\
  \ (regexObj.IsMatch(txtCellPhone.Text) == false)\n        {\n            // 格式错误\n\
  \            MessageBox.Show(\"Phone number must be in\n                   XXX-NNNN\
  \ format.\", \"Format Error\");\n            txtCellPhone.Focus();\n           \
  \ return;\n        }\n    }\n\n    private void btnExit_Click(object sender, EventArgs\
  \ e)\n    {\n        Close();\n    }\n}\n```\n\n图 17.7 提取方法用户界面\n\n![image](img/c17f006.jpg)\
  \ **工作原理** 仔细观察代码，你会发现每个文本框对象的代码都是重复的。如果你高亮代码片段然后选择提取方法（`Ctrl+R, M`），Visual Studio\
  \ 将根据你提供的名称创建以下代码：\n\n```\nprivate void ValidatePhoneNumber()\n{\n    Regex regexObj\
  \ = new Regex(\"\\\\d{3}-\\\\d{4}\");\n    if (regexObj.IsMatch(txtHomePhone.Text)\
  \ == false)\n    {\n        // 格式错误\n        MessageBox.Show(\"Phone number must\
  \ be in\n               XXX-NNNN format.\", \"Format Error\");\n        txtHomePhone.Focus();\n\
  \        return;\n    }\n}\n```\n\n为了让这个新方法适用于所有的文本框，你仍然需要稍微修改代码：\n\n```\nprivate\
  \ void ValidatePhoneNumber(TextBox myTextbox)\n{\n    Regex regexObj = new Regex(\"\
  \\\\d{3}-\\\\d{4}\");\n    if (regexObj.IsMatch(myTextbox.Text) == false)\n    {\n\
  \        // 格式错误\n        MessageBox.Show(\"Phone number must be in\n          \
  \     XXX-NNNN format.\", \"Format Error\");\n        myTextbox.Focus();\n     \
  \   return;\n    }\n}\n```\n\n你所做的是为方法添加了一个参数，允许你将文本框对象传递给方法。因此，当你调用方法\n\n```\n\
  ValidatePhoneNumber(txtCellPhone);\n```\n\n方法知道向哪个对象发送错误控制。虽然此示例中的代码更改非常细微，但在涉及复杂代码时，重构方法可以节省大量时间。当不需要向重构方法传递参数时，简单性会更高。尽管，它使得大规模更改变得简单。剩余的重构选项如你所料。封装字段（Encapsulate\
  \ Field）允许你更改类中特定字段的访问访问符，而提取接口（Extract Interface）允许你在需要时将类中的一个或多个属性转换为接口删除参数（Remove\
  \ Parameters）和重新排序参数（Reorder Parameters）选项只需遍历程序代码并在方法中删除或添加参数。\n\n***\n\n# 总结\n\
  \n本章结合了 C# 和 Visual Studio 中一些较少使用的功能。虽然多线程是许多其他语言的共同技术，但重构可能并不普及。尽管如此，这些都是你腰间的更多工具。\n\
