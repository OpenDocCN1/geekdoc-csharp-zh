  \n其他数据库选项（请参阅图 14.10）允许用户添加新类型的问候卡以及添加朋友之间交换过的卡片。这两个选项的代码使用 SQL `INSERT` 命令的方式与列表\
  \ 14-3 中的代码非常相似。与其在这里通过重复代码来浪费几棵树，不如自己在空闲时查看这些代码。\n\n## 数据绑定到数据库表\n\n在添加了几个朋友、几种卡片类型并交换一两个卡片后，你想查看数据是否已实际写入数据库表。`Reports`\
  \ 选项（请参阅图 14.10）提供了两种不同类型的报告。第一个选项允许你导出指定表的内容。第二种报告类型允许你以多种方式检查 `CardsExchanged`\
  \ 表。然而，提供这两个选项的另一个原因是向你展示两种向用户呈现数据的应用。第一种选项使用数据绑定将表数据绑定到 `dataGridView` 对象。第二种选项简单地使用\
  \ `listbox`，而没有数据绑定的开销。两种技术都是可行的，因此它们都应该加入到你的编程工具箱中。现在先看数据绑定。\n\n图 14.13 显示了数据库报告在启动时的样子。左侧出现数据库中表的列表，文本框中出现预初始化为\
  \ `SELECT * FROM` 的文本框。用户双击想要查看的表，会将该表名复制到文本框字符串的末尾，形成一个完整的 SQL 查询（即 `SELECT * FROM\
  \ Friends`）。当用户点击 `Execute Query` 时，`dgvFriends` 控制将填充来自表的数据。\n\n**图 14.13** 数据库报告\n\
  \n![image](img/c14f013.jpg)\n\n实现所有这些的代码简单得惊人，主要因为 `dataGridView` 控件非常智能。报告窗的完整代码出现在列表\
