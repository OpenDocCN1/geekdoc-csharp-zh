  | **静态存储类** | 静态数据与其他存储类的区别 |\n\n# 第 10 章\n\n## 设计与编写自定义类\n\n**你将在本章中学习到：**\n\n\
  * 构造函数细节\n* 方法重载\n* 内聚性\n* 耦合性\n* 属性方法\n* Getter 和 Setter 方法（访问器与赋值）\n* 改变对象的状态\n\
  * 在类方法中检测错误\n\n[wrox.com](http://wrox.com) 本章代码下载\n\n你可以在 [wrox.com](http://wrox.com)\
  \ 的“Download Code”选项卡找到本章的代码下载：[www.wrox.com/remtitle.cgi?isbn=9781118336922](http://www.wrox.com/remtitle.cgi?isbn=9781118336922)。`Chapter10`\
  \ 文件夹中的代码是根据章节中的名称单独命名的。\n\n第 9 章介绍了如何设计你自己的类。该章节在最后设计并编写了一个名为 `clsDates` 的简单类，它添加了两个方法：`getLeapYear()`\
  \ 和 `getEaster()`。本章继续了类设计的主题，但讨论了编写类的更多细节。\n\n当你完成本章后，你将拥有开始编写你自己的类的坚实基础。只要付出的努力，你会发现编写自己的类既有意义又很有趣。\n\
  \n# 构造函数\n\n你应该将 `constructors`（构造函数）视为设计用于创建（或实例化）对象的方法。构造函数的唯一目的是使你能够以已知的状态实例化对象。C#（以及大多数其他\
  \ OOP 语言）的巧妙之处在于，你会自动获得一个默认构造函数。\n\n## 默认构造函数\n\n为了使默认构造函数的创建，构造函数的名称始终与其类名相同。例如，如果你想为\
  \ `clsDates` 类创建一个名为 `myDate` 的对象，你会使用以下语句：\n\n```\nclsDates myDate = new clsDate();\n\
  ```\n\n你以前见过这种语法，但现在让我们深入研究一下。\n\n首先，注意左侧对 `clsDates` 的引用仅仅是类名：类名后面没有跟圆括号。实际上，这个对\
  \ `clsDates` 的引用只是在告诉你从挂在墙上的成千上万个饼模中拿哪一个。\n\n其次，标识符 `myDate` 的目的是允许你为代码中使用的 `reference\
  \ variable`（引用变量）命名，该变量用作连接到 `clsDates` 类数据的链接。你在第 5 章中学习过，引用变量的 `rvalue`（右值）要么是\
  \ `null`，是对象数据位置的内存地址。为了学习，你可以认为 `myDate` 在这一时刻的 `rvalue` 是 `null`。\n\n第三，关键字 `new`\
  \ 应该始终能唤起你的记忆，让你想起程序与 Windows 内存管理器之间将进行一些消息交换。具体来说，`new` 意味着你正在向 Windows 请求足够的内存来存储一个\
  \ `clsDates` 对象。假设找到了足够的内存，`myDate` 的 `rvalue` 会立即从 `null` 变为对象存储位置的内存地址。\n\n第四，语句中的最后一个表达式是\
  \ `clsDates()`。注意，与语句开头对类的第一个引用不同，这个引用后面跟着圆括号。这意味着代码正在调用一个方法。在这种情况下，`clsDates()`\
  \ 是对构造函数方法的调用。如果你不编写自己的构造函数，C# 仍然会调用自己的默认类构造函数。当默认构造函数执行完毕时，类中所有的值类型数据的值都为 `0`，所有引用变量的值都为\
  \ `null`。默认构造函数将对象置于已知状态，其中值类型为 `0`，引用为 `null`（除非数据在定义点处也进行了初始化）。\n\n## 非默认构造函数\n\
  \n好了，那么你什么时候需要编写非默认构造函数呢？在两种基本情况下：1) 当你的类设计不满意对象诞生时的默认状态时，或者 2) 当非默认构造函数能让使用你类的程序员工作更轻松时。\n\
  \n第一个原因意味着，将所有类数据都设置为 `0` 或 `null` 的开始在某些方面对于对象来说并不是“正确”的状态。例如，在第 9 章中，默认构造函数被更改为：\n\
  \n```\npublic clsDates()\n{\n    current = DateTime.Now; // 将 DateTime 设置为当前\n}\n\
  ```\n\n此构造函数将名为 `current` 的 `DataTime` 数据项从未初始化状态更改为当前的日期时间。换句话说，你的设计是希望 `current`\
  \ 在开始时其值设置为对象实例化时的日期和时间。\n\n创建一个在 `current` 中已经存储了当前日期和时间的 `clsDates` 对象，可能会让类的某些方面更容易使用。（目前类中还没有利用\
  \ `current` 的代码，但这并不意味着将来不会！）\n\n## 构造函数重载\n\n你已经在第 5 章学习过方法重载。因为构造函数无本质上是在对象实例化时总是被调用的方法，所以构造函数也可以被重载。例如，你可以将以下构造函数添加到\
  \ Listing 9-4 所示的代码中：\n\n```\npublic clsDates(int yr)\n\n```\n\n现在你有两个构造函数了。正如第\
  \ 5 章提到的，只要方法签名不同，方法重载就不是问题。因为第二个构造函数有一个整数参数 (`yr`)，签名是不同的。然而，你现在可以使用以下语句实例化 `myDate`\
  \ 对象：\n\n```\nclsDates myDate = new cls(year);\n```\n\n现在 `clsDates` 对象中的实例变量 `year`\
  \ 在实例化时就被初始化了。\n\n### 构造函数的疏忽\n\n我编写这两个构造函数的方式存在问题。让我们对比一下：\n\n```\npublic clsDates()\
  \           // 无参数构造函数\n{\n    current = DateTime.Now; // 将 DateTime 设置为当前\n}\n\n\
  public clsDates(int yr)     // 带参数的构造函数\n{\n    year = yr;\n}\n```\n\n如果我使用语句创建\
  \ `myDate` 对象：\n\n```\nclsDates myDate = new clsDate();\n```\n\n无参数版本意味着 `myDate`\
  \ 诞生时成员 `current` 初始化为当前日期时间。然而，如果我使用语句 `clsDates myDate = new cls(year);` `current`\
  \ 就没有初始化为假设的默认状态！作为一个通用规则，非默认构造函数（即具有一个或多个参数的构造函数）应该包含对象的默认状态。这意味着构造函数的参数版本也应该将\
  \ `current` 初始化为当前日期时间。按照目前的代码，默认（无参数）构造函数初始化了名为 `current` 的成员，但重载构造函数没有。这不太好。\n\
  \n### 修复构造函数问题\n\n解决方案似乎很简单。只需在参数化构造函数内部调用默认构造函数：\n\n```\npublic clsDates(int yr)\
  \     // 带参数的构造函数\n{\n    clsDates();             // 这不起行！\n    year = yr;\n}\n\
  ```\n\n这种修复不起行，因为编译器会对如何在此上下文中使用 `clsDates` 感到困惑。\n\n现在尝试 Listing 10-1 中参数化构造函数的形式。\n\
  \nListing 10-1: 调用参数化构造函数的正确方式\n\n\n\n\n\n```c\n public clsDates(int yr) : this()\n\
  \    {\n        year = yr;\n    }\n```\n\n注意第一条语句中的冒号运算符（`:`）和关键字 `this`。你在编写的每个程序都使用了冒号运算符，但可能没有对其进行过太多思考。例如，任选一个你写过的程序，并查看\
  \ `frmMain` 定义中的第一条语句：\n\n```c\n public class frmMain : Form\n```\n\n你可以将冒号运算符理解为“继承自”（inherits\
  \ from）。换句话说，你的 `frmMain` 继承了通用 Windows 表单（form）的基本属性和方法，但将通过你添加到 `frmMain` 中的任何对象和代码来扩展它。\n\
  \n现在查看 examine 下面的语句：\n\n```c\n public clsDates(int yr) : this()\n```\n\n`this`\
  \ 关键字仅仅是指向当前对象实例引用的简写表示。换句话说，这是程序正在构造的 `clsDates` 对象的简写表示。然而，由于你在 `this` 关键字后面紧跟着括号，编译器知道在执行任何其他操作之前，它必须调用该类的默认（无参数）构造函数。（如果你将来在鸡尾派对上有人提到“构造函数链\
  \ `constructor chaining`），这正是那个人所说的。）\n\n将第二个构造函数的代码（参考 Listing 10-1）添加到 Listing\
  \ 9-4 所示的代码中。现在在这个新的（带参数的）构造函数的第一行设置断点，然后运行并单步执行程序。你会发现，到达第二个构造函数的断点时，程序会立即跳转到默认构造函数，将\
  \ `current` 初始化为适当的值，*然后*执行第二个构造函数的语句体。这正是你想要发生的情况，因为创建 `myDate` 对象的两种方式：\n\n```c\n\
  \ clsDates myDate = new clsDate();\n```\n\n和\n\n```c\n clsDates myDate = new clsDate(year);\n\
  ```\n\n现在都会让 `current` 保持相同的状态。带参数版本的构造函数仅仅是将类的另一个成员（`year`）初始化为已知值。\n\n### 始终调用默认构造函数\n\
  \n你可能会问自己：“为什么要费劲调用默认构造函数？如果你从不使用 `current` 的内容，谁会在意呢？”好吧，考虑到 `clsDates` 目前写法，`current`\
  \ 并没有被使用，所以这真的无关。但这并不意味着你以后不会添加假设 `current` 具有默认状态的代码。\n\n更重要的是，调用默认构造函数可以让你养成为对象建立“基础状态”的编码习惯。不让所有对象从相同的基础状态开始可能会在以后引起问题。例如，你可能正在编写某种数据库类，其中默认构造函数创建了数据库连接。如果重载构造函数没有同样建立该数据库连接，类的其他方法可能无法正常执行其功能。\n\
  \n如果你确实写了一个带有参数的构造函数，你就不能再调用无参数的默认构造函数。一旦创建了带参数的构造函数，调用无参数构造函数的唯一就是显式地编写自己的无参数构造函数。也就是说，“无代码”的默认构造函数不再存在，你必须提供自己的。\n\
  \n正如你之前看到的很多次的那样，“程序五个步骤”中的“初始化步骤”为程序代码的执行创建了基础环境。调用构造函数类似于程序的初始化步骤，但在方法这个更狭的语境下来看。也就是说，构造函数建立了特定对象\
  \ `object` 存在并执行的环境。因此，让所有重载构造函数都调用默认构造函数是一个好主意，这样就可以安全地假设对象的基础状态。\n\n# 属性方法 (Property\
  \ Methods)\n\n到目前，你设计并实现了类的属性成员，还添加了两个构造函数，以便用户在实例化 `clsDates` 对象时具有灵活性。最后，你写了两个通用方法\
  \ `getLeapYear()` 和 `getEaster()`，它们为类提供了一些功能。本着封装的精神，你使用私有访问限定符（private access\
  \ specifier）定义了所有属性方法。使用私有访问限定符很难无意中更改类属性的值。这种对类属性的保护是因为私有访问限定符将属性的范围限制在定义它们的类中。类属性对外部世界是不可见的！\n\
  \n等一下……\n\n如果属性因为范围对外部世界是不可见的，那么没有办法更改它们了！如果类属性无法更改，就没有办法更改对象的状态。如果你无法更改对象的状态，还不如定义一个浇在混凝土里的船锚。正是使用和更改对象状态的能力使得该对象在程序中有用。毕竟，如果一个对象的属性总是空或\
  \ 0，它能有多用呢？\n\n## 属性方法与 Getter/Setter (Getters and Setters)\n\n显然，这种看似疯狂的行为是有规律的。C#\
  \ 为你提供了一种名为“属性方法”（property method）的程序结构，用于访问类内部定义的私有属性。类属性方法由“属性 getter”（property\
  \ getters）和“属性 setter”（property setters）构建。这些是专为类属性设计的特殊方法。按照规定，你为每个私有属性成员定义一组 getter\
  \ 和 setter。\n\n属性 getter 和 setter 的语法如下：\n\n```c\n AccessSpecifier  ReturnType \
  \ PropertyName\n{\n     get\n     {\n          return PropertyMember;\n     }\n\
  \     set\n     {\n          PropertyMember = value;\n     }\n}\n```\n\n`clsDates`\
  \ 类月份属性的示例在 Listing 10-2 中显示。你应该将月份属性方法添加到 Listing 9-4 的代码中：\n\nListing 10-2：典型的属性方法\n\
  \n```c\n public int Month\n    {\n        get\n        {\n            return month;\n\
  \        }\n        set\n        {\n            if (value > 0 && value < 13)\n \
  \           {\n                month = value;\n            }\n        }\n    }\n\
  ```\n\n### 属性方法规则 (Property Method Rules)\n\n关于属性方法有很多需要注意的地方。首先，所有属性方法都使用公共访问限定符。正如你在第\
  \ 9 章中学到的，如果方法使用公共访问限定符，该方法就成了类的用户（或公共接口/API）。由于属性方法是公共的，它们成为了进入类的门户，并提供了访问类私有属性成员的手段。如果属性方法没有使用公共访问限定符定义，它们对于类外部的代码将是毫无用处的，因为它们的范围会使它们不可见。\n\
  \n其次，属性方法的返回数据类型*必须*匹配属性的数据类型。如果你将类属性定义为 `int`（如 `month` 所示），那么属性方法必须返回 `int`。如果属性成员是字符串数据类型，返回数据类型也必须是字符串。\n\
  \n\n\n\n\n第三，请注意 `property method`（属性方法）与任何其他类型的方法不同，因为属性方法的名称后面**没有**跟着一组括号。一种常见的编程约定是让属性方法的名称与属性名称相同，但将属性名称的首字母大写。在这个示例中，名为\
  \ `month` 的类属性有一个名为 `Month` 的类属性方法。（这与将所有类属性名称的第一个单词设为小写一致。）`month` 和 `Month` 之间不会产生混淆，因为\
  \ `C#` 是区分大小写的。\n\n第四，关键字 `get` 用于标记属性方法中的代码块，该代码块可能用于检索类属性成员的值。通常，`get` 语句块内的语句简单地是一个\
  \ `return` 关键字后跟属性名称，如示例所示。你经常会听到将 `get` 语句块称为 `getter`（get 器）。\n\n最后，关键字 `set`\
  \ 用于标记属性方法中的代码块，该代码块可能用于为类属性成员赋值。`set` 语句块应该是外部世界更改类中私有属性成员的唯一手段**。（你可以通过 `General`\
  \ 类的方法来更改它，但那种做法很糟糕，且不建议这样做。）\n\n如果你查看 `Month` 属性方法中的 `set` 语句块，你可以看到你验证了赋值给 `month`\
  \ 的值是合理的。等一下！名为 `value` 的变量是从哪里来的？\n\n### value 关键字\n\n关键字 `value` 是一个隐式变量，作为 `set`\
  \ 语句块语法的一部分使用。你可以将 `value` 视为一个`幽灵变量`，它持有你想要赋值给属性成员的数据。`value` 的数据类型始终匹配属性方法的返回类型指定符。例如，`Month`\
  \ 属性方法返回 `int`，因此 `value` 必须是 `int`。\n\n在属性方法或类中，`value` 没有正式定义。`value` 的数据类型是由其所使用的上下文推断的。该类型始终与属性方法的类型指定符匹配。\n\
  \n### get 属性方法是如何工作的\n\n假设你想读取当前存储在 `clsDates` 对象中的 `month` 的值。以下代码段显示了如何访问名为 `month`\
  \ 的属性成员：\n\n```\n int myMonth;\nclsDates myDate = new clsDates();\n\n// 其他代码行 .\
  \ . .\n\nmyMonth = myDate.Month;\n```\n\n上述代码的意图是获取 `myDate` 对象中当前 `month` 的值并将其赋值给\
  \ `myMonth`。当最后语句执行时，程序控制执行 `clsDates` 中 `Month` 属性方法的 `get` 语句块，并返回名为 `month` 的属性的值。\n\
  \n现在理解了设计类的概念，让我们看看这一切是如何结合的。在下一节中，你把类代码连接到用户界面，以获得功能完整的程序。\n\n***\n\n### 尝试一下：使用属性方法\
  \ (Chapter09ProgramClassDesign.zip)\n\n在这种情况下，你实际上是在重用你在上章节中编写的代码。**1.** 加载第 9 章中讨论的\
  \ `Class Design` 项目中的代码。**2.** 将 `Listings 10-1` 和 `10-2` 中的代码添加到项目中。**3.** 将以下代码添加到\
  \ `frmMain.cs` 中，位于 `Application.Run(main);` 语句之后：\n\n```\n int myMonth;\nclsDates\
  \ myDate = new clsDates();\nmyMonth = myDate.Month;\n```\n\n并在代码段的最后语句上设置断点。现在运行程序并使用\
  \ `F11` 键单步进入 `Month` 属性方法，查看程序控制是如何处理此类语句的。由于 `Listing 10-2` 中的属性方法代码目前的工作方式，返回的值为\
  \ 0，因为还没有给 `month` 属性赋值。你可以将 `Listing 10-2` 修改为 `Listing 10-3` 所示的内容。\n\n`Listing\
  \ 10-3`：month 属性的属性方法\n\n```\n public int Month\n    {\n        get\n        {\n\
  \            if (month == 0)            // 新代码\n            {\n                return\
  \ current.Month;\n            } else\n            {\n                return month;\n\
  \            }\n        }\n        set\n        {\n            if (value > 0 &&\
  \ value < 13)\n            {\n                month = value;\n            }\n  \
  \      }\n    }\n```\n\n### 工作原理\n\n在类中添加属性方法代码后，你有了一种更改 `month` 属性状态的手段。你刚刚添加到\
  \ `frmMain` 中的代码提供了一种测试如何更改 `month` 属性状态的方法。你还能够使用 `if` 语句块对任何赋值给 `month` 的新值进行验证的能力。任何在类外部更改\
  \ `month` 状态的尝试。\n\n\n\n\n如果你在表达式中看到属性方法，且该表达式不涉及赋值或二元运算符（即 `++` 或 `--`），例如：\n\n\
  ```cpp\nfor (j = 0; j < myDate.Days; j++)\n```\n\n则该表达式正在执行一个 get 操作。（再次强调，属性方法出现在关系运算符\
  \ `<` 的右侧，因此它必须是一个 get 操作。）\n\n# 当属性方法中发生错误时该怎么办\n\n有时会有无效值到达属性方法。然而，`set` 语句块被用于更改对象的状态，而不是向调用者返回值。那么，你该如何告知用户你的\
  \ `class` 代码在属性方法中读取到了错误的数据值呢？\n\n你的种方法可能是使用 `MessageBox` 对象向用户显示消息，说明读取到了属性的错误值。这种方法的问题在于，数据操作是在类中进行的，而不是在最终用户交互的\
  \ `frmMain` 中。当你为类编写代码时，应该始终记住，*你的*用户是程序员，而不是运行程序的最终用户。正因如此，你需要让使用你类的人知道出现了一些问题。（通用的风格约定是属性方法*从不*使用\
  \ `MessageBox` 对象。）\n\n`set` 语句块的主要目的是更改与方法相关的属性值。由于类属性值的变化也意味着*对象状态*的变化，当检测到错误时，最安全的方法是保持对象状态不变。例如，如果\
  \ `Listing 10-3` 中的 `set` 语句块接收到了无效的月份值，`month` 的新值将被忽略，对象的状态保持不变。使用你类的程序员将有责任检测到设置操作失败了，正如对象的状态保持不变所示。\n\
  \n另一种可能性是将状态标记作为类的属性成员。你可以编写类似下面的代码：\n\n```csharp\nprivate int errorStatus = 0;\
  \   // 假设对象状态没有错误\n\n// 其他类成员的更多代码 . . .\n\npublic int getErrorStatus      // errorStatus\
  \ 成员的属性方法\n{\n     get\n     {\n          Return errorStatus;\n     }\n}\n```\n\n\
  注意，`getErrorStatus` 属性方法没有 `set` 语句块；它是一个*只读属性方法*。由于该属性方法是只读的，用户无法更改 `errorStatus`\
  \ 的状态；只有可以在类代码中更改它。鉴于这一事实，你可以将 `Listing 10-3` 修改为 `Listing 10-4` 所示。\n\n### Listing\
  \ 10-4: 带有错误处理的属性方法\n\n```csharp\npublic int Month\n    {\n        get\n       \
  \ {\n            if (month == 0)            // 新代码\n            {\n            \
  \    return current.Month;\n            } else\n            {\n                return\
  \ month;\n            }\n        }\n        set\n        {\n            if (value\
  \ > 0 && value < 13)\n            {\n                month = value;\n          \
  \  } else\n            {\n                errorStatus = 1;     // 标记为错误\n      \
  \      }\n        }\n    }\n```\n\n现在，当你类的用户想要查看设置操作是否正常工作时，她可以在 `frmMain` 中添加类似下面的代码：\n\
  \n```csharp\nmyDate.Month = myMonth;\nif (myDate.getErrorStatus == 1)\n{\n     MessageBox.Show(\"\
  The world is ending. Run for your lives!\");\n     return;\n}\n```\n\n这将检测到类中错误的发生。虽然存在其他可能性，但这里展示的是最直接的。\n\
  \n## 方法耦合与内聚\n\n正如你在本章中学到的，属性方法用于读取和写入与类中的属性相关的值。由于它们是公共的，属性方法构成了类用户界面的重要部分。然而，属性方法（无论是获取还是设置）的目的被正确限制在属性上。\n\
  \n另一方面，辅助方法（Helper methods）和通用方法（General methods）旨在使用或处理类的属性。由于辅助方法始终使用 `private`\
  \ 访问修符，它们不属于类用户界面（API）的一部分。相反，它们减轻了你作为类程序员的编码负担。辅助方法通常用于验证。检查和验证数据（如电话号码和社会安全号码的格式）通常是分配给辅助方法的任务。\n\
  \n然而，通用方法通常用于从属性数据中派生新数据。例如，一个库存类可能有一个属性来记录售出的物品数量。可能有一个通用方法接收销售数量并将其乘以单价，以产生总购买金额。类的通用方法可能被命名为\
  \ `getTotalCost()`。另一个名为 `getShippingCost()` 的通用方法可能会使用单位重量和销售数量来计算运费。另一个名为 `getSalesTaxDue()`\
  \ 的方法可能会计算订单的销售税，以此此类推。\n\n### 内聚\n\n注意这些通用方法的一个重要点是，每个方法都针对一个特定的、狭义定义的任务。这些狭义定义的任务说明了*内聚*（cohesion）的概念。这个术语指的是用一两句话描述方法功能的能力。如果定义其目的需要超过几句话，那么它可能不是一个内聚的方法。内聚的方法执行单一任务，你应该能够清晰、简洁地描述它的目的。如果你做不到，就必须回到设计阶段，重新思考方法的设计。\n\
  \n### 耦合\n\n*耦合*（Coupling）是指程序中数据元素之间的依赖程度。方法解耦（Method decoupling）是指在不强制更改另一个方法的情况下对一个方法更改代码的能力。方法耦合意味着一个方法的行为在某种程度上依赖另一个方法的行为。目标是实现方法之间的零耦合。也就是说，更改一个方法的代码不应迫使你更改另一个方法的代码。显然，方法的耦合程度越小，在另一个程序重用该方法的可能性就越大，因为它的功能对其他方法的依赖越少。\n\
  \n\n\n有时，耦合还会引入顺序问题。例如，如果你想打开一个磁盘文件以写入数据，必须先确保该文件存在，或者在文件不存在时创建一个新文件。显然，你需要打开文件、将数据写入文件，然后关闭文件。这种顺序关系似乎暗示应该使用一个方法来完成打开、写入和关闭磁盘文件。这种设计在两个层面上都是糟糕的。首先，该设计不具有内聚性，因为它是多任务的。其次，这是最高程度的耦合，因为本应是三个独立步骤的操作被合并成了一个单一方法。拆解（unrolling）这种方法的一个主原因是路径中的每一步都可能发生错误，因此将这些任务解耦并编写三个方法来分别处理这三个任务更符合逻辑。这样代码将变得更简单且易于维护，而且如果其中任一个方法未能执行其特定任务，你还可以向类用户返回更有意义的错误状态。\n\
  \n目标非常简单：编写面向单一任务的简单方法，并确保这些方法能够独立存在并独立运行。\n\n# 类牌程序的类设计\n\n尝试编写一个新程序，以结合最后两章中讨论的一些设计元素。假设你想编写一个模拟洗牌的程序。在接下来的“尝试一下”中，你将编写一个执行基础牌类任务的类。如果你设计得当，该类应该可以用于其他涉及扑克牌的游戏。\n\
  \n***\n\n### 尝试一下：洗牌 (Chapter10ProgramShuffleDeckClass.zip)\n程序应该简单地在列表框对象中显示洗牌后的牌组。图\
  \ 10.1 展示了你如何构建程序用户界面的起点。\n\n图 10.1 程序洗牌\n\n![image](img/c10f001.jpg) 该图显示了点击两次“洗牌”按钮后输出可能的样子。还要注意，列表框下方会出现一个标签对象，告知用户通过“洗牌循环”了多少次才生成一幅洗好的牌牌。（稍后将详细介绍洗牌循环。）鉴于图\
  \ 10.1 描述了你希望用户界面呈现的样子，你会如何设计并编写代码？同样重要的是，你从哪里开始设计过程？\n\n**1.** 按通常方式创建一个新项目。你可能想将其命名为\
  \ `ShuffleDeck`，但可以使用任何你喜欢的名称。\n**2.** 添加图 10.1 所示的对象。再次，将程序的完整构建推迟稍后以后。现在，只需考虑你希望它如何工作和构建。\n\
  \n### 工作原理\n正如几乎总是那样，你可以编写代码并将所有内容都塞进 `frmMain` 中然后完事。然而，是否存在一种可能，在未来的你可能会编写一个需要\
  \ `\n\n### 牌组的 UML 图\n图 10.1 描述了你希望用户界面呈现的样子，你会如何设计并编写代码？同样重要的是，你从哪里开始设计过程？\n\n\
  （注：提供的文本在后半部分包含大量的结构性重复和碎片化句子。我根据指令在保持核心内容的基础上清理了流畅度。）\n\n\n\n图 10.2 显示该类中只有三个通用方法（General\
  \ methods）。（你知道它们是通用方法，是因为它们都是使用 `public` (+) 访问修饰符定义的。如果它们是内部辅助方法（Helper methods），则必须使用\
  \ `private` (--) 访问修饰符定义。虽然属性方法（Property methods）也是公共的，但它们只涉及获取或设置属性。）因为这些方法是通用方法，所以它们成了该类用户界面或\
  \ API 的一部分。\n\n正如第 9 章建议的那样，方法名应该基于动作或动词。如果你很好地命名方法，它们应该反映这些方法设计用于完成的任务。`shuffleDeck()`\
  \ 和 `getOneCard()` 方法应该是自俗易懂的。`getCardPip()` 方法稍显奇异，需要一些解释。\n\n### getCardPip()\n\
  \n如之前提到的，该设计对牌组中的牌使用了两个字母的缩写（3H、KS 等）。这些缩写定义在名为 `pip` 的静态数组中。该数组的定义如下：\n\n```\n\
  \ private static string[] pips = {\"\",\n \"AS\",\"2S\",\"3S\",\"4S\",\"5S\",\"\
  6s\",\"7S\",\"8S\",\"9S\",\"TS\",\"JS\",\"QS\",\"KS\",\n \"AH\",\"2H\",\"3H\",\"\
  4H\",\"5H\",\"6H\",\"7H\",\"8H\",\"9H\",\"TH\",\"JH\",\"QH\",\"KH\",\n \"AD\",\"\
  2D\",\"3D\",\"4D\",\"5D\",\"6D\",\"7D\",\"8D\",\"9D\",\"TD\",\"JD\",\"QD\",\"KD\"\
  ,\n \"AC\",\"2C\",\"3C\",\"4C\",\"5C\",\"6C\",\"7C\",\"8C\",\"9C\",\"TC\",\"JC\"\
  ,\"QC\",\"KC\"\n                                    };\n```\n\n再次注意，初始化列表中的第一个元素是一个空字符串数组元素（\"\
  \"）。这产生了一个有效的（即非空的）数组元素，但它不包含任何有用信息。该元素仅仅是一个占位符，用于避开从零的数组配置。\n\n如果你观察数组的结构，可以发现\
  \ `pips[1]` 是 `AS`，`pips[14]` 是 `AH`；`pips[27]` 是 `AD`，而 `pips[40]` 是 `AC`。可能不太明显的是，如果你将\
  \ `pips` 数组的索引除以每个花色牌的数量（13），余数就是该花色的牌。即 `1 % 13 = 1`，`14 % 13 = 1`，`27 % 13 = 1`\
  \ 以及 `40 % 13 = 1`。因此，每当索引模 13 等于 1 时，你就知道正在查看某个花色的 Ace。你可以通过查看索引除以 4（花色的数量）的商来判断是哪个花色。例如，`2C`\
  \ 的索引为 41。将该索引除以 13 得到商 3，你可以将其解释为梅花。不需要太多思考就能意识到，值 2 到 10 代表每个花色的这些牌，而值 11 到 13\
  \ 是人牌。（每个花色的王牌模数为 0，形成了一个需要检查的特殊情况。）好吧……那又呢？\n\n回想设计讨论，你不希望选择一个类方法名来告诉用户该方法内部使用的实现细节。然而，假设你想使用\
  \ `clsCardDeck` 类来编写一个扑牌游戏。很有可能，你需要知道产生每张牌与其花色之间关系的结构，以便让扑牌游戏运行。提供 `getCardPip()`\
  \ 方法允许用户“倾倒”牌组并检查其结构。例如，下面的循环有助于向用户揭示实现牌组的数据结构：\n\n``` clsCardDeck myDeck = new\
  \ clsCardDeck();\n\nfor (int j = 0; j <= myDeck.DeckSize; j++)\n{\n      lstCard.Items.Add(myDeck.getCardPip(j));\n\
  }\n```\n\n因此，从某种意义上说，名为 `getCardPip()` 的方法是一个辅助方法，但它是为了用户而不是你自己编写的。简单来说，这个方法是 `clsCardDeck`\
  \ 用户的调试辅助。\n\n将方法作为用户界面的一部分，允许用户访问数据结构的细节，从而使她的编码任务更容易。提供这个方法是因为用户可能需要这些信息来实现她的扑牌游戏。此外，通过这种结构并知道她需要它所提供的信息，你可以通过消除反复尝试来确定牌组结构的方法，减轻她的编程负担。\n\
  \n现在设计已经完成，实现代码以查看所有部分是如何组合的。首先，检查终端用户界面是如何编写的。\n\n### frmMain 代码\n\nListing 10-5\
  \ 展示了测试 `clsCardDeck` 的代码。\n\nListing 10-5: 测试 `clsCardDeck` 的程序代码。（`frmMain.cs`）\n\
  \n```\n using System;\nusing System.Windows.Forms;\n\npublic class frmMain : Form\n\
  {\n    const int CARDSPLINE = 13;\n    private Button btnClear;\n    private Button\
  \ btnClose;\n    private Button btnShuffle;\n    private ListBox lstDeck;\n    private\
  \ Label lblPassCounter;\n\n    public frmMain()\n    {\n        InitializeComponent();\n\
  \    }\n\n    public static void Main()\n    {\n        frmMain main = new frmMain();\n\
  \        Application.Run(main);\n    }\n\n    private void btnShuffle_Click(object\
  \ sender, EventArgs e)\n    {\n        int j;\n        int cardIndex;\n        int\
  \ deckSize;\n        int passes;\n        string buff;\n        string temp;\n \
  \       clsCardDeck myDeck = new clsCardDeck();\n\n        passes = myDeck.ShuffleDeck();\n\
