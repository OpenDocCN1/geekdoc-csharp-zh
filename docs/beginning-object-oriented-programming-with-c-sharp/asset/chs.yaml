  \ | \\| 12:15\\| |\n| `{0, dddd MMMM}` | 1/1/2008 | \\|Tuesday January\\| |\n\n\
  如果你想在列表 box 中格式化列，即使使用 `string` 类的 `Format()` 方法，仍然会有问题需要解决。如果你按原样尝试列表 7-1 中的代码，列表\
  \ box 中的列输出看起来很好，但并不完美。为什么你的输出没有像图 7.2 那样完美对齐呢？\n\n### 字体与列对齐\n\n你的程序中的列不直的原因是列表\
  \ box 的默认字体是 Microsoft Sans Serif。这是一种*TrueType 字体*。这意味着每个字符获得的屏幕像素仅够显示该字符。因此，数字字符\
  \ `1` 可能只需要 3 个像素即可显示，而数字 `8` 可能需要 7 个像素。结果是数字字符将无法对齐，因为列表 box 中的每个数字字符使用的像素空间不同。\n\
  \n如果你从 TrueType 字体切换到*等宽字体*（如 Courier New），列就会完美地对齐了。这是因为 Courier New 字体集中的每个字符无论字符多宽（或多窄），都占据完全相同数量的像素。因此，解决此对齐问题只需要进入列表\
  \ box 的字体属性并将其更改为 Courier New。（你是在更改列表 box 的状态吗？）你可以通过在设计窗口中点击列表 box、选择 `Font` 属性并点击省略号运算符（`…`）来实现这一点。然后，在字体对话框中显示的字体列表中向下滚动，直到找到\
  \ Courier New 字体。由于你可以在图 7.3 中看到 `Font` 窗口。\n\n\n\n\n\n再次阅读一遍算法并思考一下。例如，假设你想计算数字\
  \ 3 的平方。你已经知道答案是 9，但请使用新算法来计算答案：\n\n```\nN2 = 1 + 3 + 5\nN2 = 9\n```\n\n注意看你是如何简单地从\
  \ 1 开始累加三个正奇数来得到 3 的平方（即 9）的。假设你想计算 5 的平方：\n\n```\nN2 = 1 + 3 + 5 + 7 + 9\nN2 =\
  \ 25\n```\n\n虽然这是一种 RDC 计算平方数的方法，但它是一个有趣的测试，可以看看你是否能想出如何在代码中实现该算法。\n\n接下来，让我们取本节之前讨论的平方表程序，并通过几处修改对其进行改进。结果在显示器上查看时应该会更好一些。\n\
  \n* * *\n\n### 尝试一下：平方表，版本 2 (Chapter07ProgramTableOfSquaresVersion2.zip)\n\n对于这个示例，你可以用\
  \ Listing 7-1 中的代码作为起点。（毕竟，面向对象编程的核心优势之一就是代码复用！或者你也可以为了省事直接下载程序代码。）你仍然想要生成一个平方表，因此用户界面不需要更改。然而，你不再使用简单的\
  \ `i * i` 来计算平方数，而是想要实现新的平方算法。\n\n1. **加载** 原始的平方表程序（即你使用 Listing 7-1 的程序）。\n2.\
  \ **替换** Process 和 Display 注释后的 `for` 循环代码为以下代码：\n\n```\nfor (i = start; i <= end;\
  \ i++)\n{\n    nextOddInteger = 1;       // 设置第一个奇数\n    square = 0;           \
  \    // 始终从 square = 0 开始\n\n    for (j = 0; j < i; j++)   // 嵌套 j 循环\n    {\n \
  \       square += nextOddInteger; // 累加奇数\n        nextOddInteger += 2;      //\
  \ 设置下一个奇数\n    }\n    buff = string.Format(\"{0, 5}{1, 20}\", i, square);\n    lstOutput.Items.Add(buff);\n\
  \  }\n```\n\n你应该拿一张纸，手写下实现新算法的代码。光靠阅读看出如何写代码太容易了，通过自己尝试编写代码才能学到更多。你需要为原始程序添加几个新变量。需要在\
  \ `btnCalculate` 点击事件代码中添加的新变量如下：\n\n```\nint j;\nint square;\nint nextOddInteger;\n\
  ```\n\n这些新变量应该被添加到 `btnCalculate` 点击事件代码中。\n\n### 工作原理\n\n在新定义的变量中，`j` 用于控制一个新的\
  \ `for` 循环，`square` 用于存储平方值，而 `nextOddInteger` 用于在循环中创建一系列奇数。在修订后的 `for` 循环代码中：\n\
  \n```\nfor (i = start; i <= end; i++)\n{\n    nextOddInteger = 1;       // 设置第一个奇数\n\
  \    square = 0;               // 始终从 square = 0 开始\n\n    for (j = 0; j < i; j++)\
  \   // 嵌套 j 循环\n    {\n        square += nextOddInteger; // 累加奇数\n        nextOddInteger\
  \ += 2;      // 设置下一个奇数\n    }\n    buff = string.Format(\"{0, 5}{1, 20}\", i, square);\n\
  \    lstOutput.Items.Add(buff);\n}\n```\n\n由变量 `i` 控制的 `for` 循环被称为*外层循环*。由变量 `j`\
  \ 控制的 `for` 循环被称为*内层循环*。这些循环共同成了前面提到的*嵌套循环*。外层循环仍然遍历你想要在平方表中显示的所有值。这两个循环都是根据你对良好循环的三个要求构建的。现在检查内层循环中的代码。假设外层循环的变量\
  \ `i` 值为 3。这意味着你想计算 3 的平方。代码将 `nextOddInteger` 设置为 1 并将变量 `square` 清为 0。在循环的表达式\
  \ 2 中将变量 `i` 替换为其当前值，`j` `for` 循环看起来像这样：\n\n```\nfor (j = 0; j < 3; j++)       \
  \ // 嵌套 j 循环\n{\n    square += nextOddInteger; // 累加奇数\n    nextOddInteger += 2;\
  \      // 设置下一个奇数\n}\n```\n\n因为表达式 2 是 `j < 3`，代码会对循环进行三次通过（0, 1 和 2，因为当 `j = 3`\
  \ 时表达式 2 变为逻辑假）。如果你需要温习一下记忆，第 5 章中的表 5.3 解释了 `+=` 运算符的作用。在第一次通过中，循环看起来如下：\n\n```\n\
  for (j = 0; j < 3; j++)   // 嵌套 j 循环\n{\n    square += nextOddInteger; // 累加奇数\n\
  }\n```\n\n在第一次通过后，`square` 等 1，`nextOddInteger` 为 3。在第二次通过中，循环如下：\n\n```\nfor (j\
  \ = 0; j < 3; j++)   // 嵌套 j 循环\n{\n    square = 4;          // 累加奇数\n}\n```\n\n\
  在第二次通过后，`square` 等 4，`nextOddInteger` 为 5。在循环的第三次也是最后通过中，循环如下：\n\n```\nfor (j =\
  \ 0; j < 3; j++)   // 嵌套 j 循环\n{\n    square = 9;          // 累加奇数\n}\n```\n\n在三次通过后，不再需要额外通过循环，因为表达式\
  \ 2 (j < 3) 现在为逻辑假。因此，接下来的语句将输出显示在列表框中：\n\n```\nbuff = string.Format(\"{0, 5}{1,\
  \ 20}\", i, square);\nlstOutput.Items.Add(buff);\n```\n\n\n\n\n\n# 尝试一下：平方表，while\
  \ 循环版本 (Chapter07ProgramWhileLoopVersion.zip)\n\n由于 `while` 循环结构与 `for` 循环不同，请再次使用平方表程序，以便观察这两种循环结构之间的差异。\n\
  \n1. 加载原始的平方表程序（使用 Listing 7-1）。\n2. 将 `btnCalculate()` 代码替换为 Listing 7-2 中所示的代码。\n\
  \nListing 7-2: 平方表，while 循环变体。(`frmMain.cs`)\n\n```csharp\n private void btnCalculate_Click(object\
  \ sender, EventArgs e)\n    {\n        bool flag;\n        int i;\n        int start;\n\
  \        int end;\n        string buff;\n\n        //============ Gather inputs\
  \ ======================\n        // 将 start 从文本转换为 int\n        flag = int.TryParse(txtStart.Text,\
  \ out start);\n        if (flag == false)\n        {\n            MessageBox.Show(\"\
  Numeric data only\", \"Input Error\");\n            txtStart.Focus();\n        \
  \    return;\n        }\n\n        // 将 end 从文本转换为 int\n\n        flag = int.TryParse(txtEnd.Text,\
  \ out end);\n        if (flag == false)\n        {\n            MessageBox.Show(\"\
  Numeric data only\", \"Input Error\");\n            txtEnd.Focus();\n          \
  \  return;\n        }\n\n        if (start >= end)         // 值是否合理?\n        {\n\
  \            MessageBox.Show(\"Start less than end.\", \"Input Error\");\n     \
  \       txtStart.Focus();\n            return;\n        }\n        //=============\
  \ Process and Display ==============\n\n        i = start;    // 初始化循环计数器：条件 1\n\
  \        while (i <= end)   // 另一次迭代：条件 2\n        {\n            buff = string.Format(\"\
  {0, 5}{1, 20}\", i, i * i);\n            lstOutput.Items.Add(buff);\n          \
  \  i++;        // 改变循环状态：条件 3\n        }\n    }\n```\n\n### 工作原理\n\n你可以在 Listing\
  \ 7-2 中看到，良好循环的第一个条件是在进入 `while` 循环之前设置的。也就是说，变量 `i` 在执行 `while` 语句**之前*被初始化为变量\
  \ `start` 的值。初始化语句的精确位置（即 `expression1`）不需要是 `while` 循环块开始之前的上一条语句。事实上，你可以将该语句放在\
  \ `while` 语句块之前的任何位置。然而，良好的编码实践强烈建议，将初始化循环控制变量的代码放置在 `while` 语句块的开头。这种放置方式在需要调试时更容易看到初始条件。（什么？你现在现在还没有为每个程序都写出完美的代码吗？）\n\
  \n控制 `while` 循环的条件表达式的解释与 Listing 7-1 中 `for` 循环的 `expression2`（`i <= end`）完全相同。这是良好循环的第二个条件。\n\
  \n`while` 循环体从 `expression2` 之后的左大括号延伸到右大括号。循环体与 Listing 7-1 中的 `for` 循环体完全相同，但你必须在\
  \ `while` 循环体内部放置第三个表达式（`i++`）。请注意，良好循环的三个条件仍然存在，但 `while` 循环将它们分散得稍远了一些，而 `for`\
  \ 循环将它们都放在了同一个地方。程序的输出与之前完全相同。这引出了一个问题：“为什么要使用 `while` 循环？”\n\n***\n\n## 为什么需要多一种类型的循环？\n\
  \n任何使用 `for` 循环结构的代码都可以被重写为 `while` 循环，那么 C# 为什么要费心提供两种类型呢？简单来说，C# 为你提供了循环类型的选择，因为不同编程任务的细微差别可能使得某种循环类型比另一种更合适。例如，在很多情况下，你会在列表中查找特定的数据，例如客户列表中的特定客户名称，而你并不确切它出现在什么位置。大多数程序员会将此类任务编写代码为\
  \ `while` 循环，因为他们无法确定找到该名称确切需要多少次迭代。相反，如果你需要读取机器上的 14 个传感器并对这些传感器做出反应，你可能会使用 `for`\
  \ 循环，因为通过循环所需的次数是已知的。（使用符号常量来编写循环的第二个表达式会是一个好主意吗？提示：是的。这样在有需要时，代码将变得更易于阅读和修改。）\n\
  \n选择不同循环结构的能力仅仅是让某些编程任务变得更简单。尽管你可能会扭曲所有的代码以适应单一的循环结构，但拥有选择权意味着你不必这样做。多种循环结构意味着你有多种工具可用来解决不同的编程问题。毕竟，如果手头的工具只有锤子，那么所有问题看起来都像钉子并不意外。多种工具可以带来更优雅的解决方案。\n\
  \n# do-while 循环\n\nC# 为你的工具箱增加了第三种循环变体，称为 `do-while` 循环。`do-while` 循环的语法如下：\n\n\
  ```csharp\ndo\n{\n     // do-while 块\n} while (expression2);\n```\n\n`do-while`\
  \ 变体与 `while` 循环相似，但有一个异常：`do-while` 总是执行一次语句块。观察其他循环变体，`expression2` 的测试发生在语句块执行之前。对于\
  \ `for` 或 `while` 循环，如果 `expression2` 为假，则不执行循环体。\n\n对于 `do-while` 并非如此。`do-while`\
  \ 循环总是执行一次语句块。这是因为判断是否进行下一次循环的表达式位于循环的底部，并在循环体执行一次之后到达。也就是说，程序控制必须通过一次 `do-while`\
  \ 语句。\n\n虽然你可以使用平方表程序使用 `do-while` 语句，但在接下来的尝试中，我们将进行改变，改为生成一系列随机数。注意，良好循环的条件仍然存在，只是它们并不在同一个地方。\n\
  \n***\n\n## 尝试一下：生成随机数 (Chapter07ProgramDoWhileRandomNumbers.zip)\n\nC# 提供了一个能够生成一系列随机数的类。现在编写一个程序，测试该类是否能生成一组连续两个相同随机数的序列。\n\
  \n1. 使用第 2 章介绍的步骤和 C# 模板创建一个新项目。\n2. 在表单上添加两个标签和一个按钮对象，以及一个文本框对象。\n3. 按你认为安排对象，尽管图\
  \ 7.4 展示了程序的示例运行，并可以作为用户界面的模型。\n\n**图 7.4** 相同随机数程序\n\n![image](img/c07f004.jpg)Listing\
  \ 7-3 显示了程序的代码。\n\n\n\n\n\n```cs\n using System;\nusing System.Windows.Forms;\n\n\
  public class frmMain : Form\n{\n    const int MAXITERATIONS = 200000;  // 循环次数\n\
  \n    private Button btnClose;\n    private Label lblAnswer;\n    private Label\
  \ label1;\n    private TextBox txtMax;\n    private Button btnStart;\n    #region\
  \ Windows code\n\n    public frmMain()\n    {\n        //========== 程序初始化步骤 ==============\n\
  \n        InitializeComponent();\n    }\n\n    public static void Main()\n    {\n\
  \        frmMain main = new frmMain();\n        Application.Run(main);\n    }\n\n\
  \    private void btnStart_Click(object sender, EventArgs e)\n    {\n        bool\
  \ flag;\n        int counter;    // 计数器\n        int max;        // 随机数最大值\n   \
  \     int last;\n        int current;\n        Random randomNumber = new Random();\n\
  \n        //========= 程序输入步骤 ================\n        flag = int.TryParse(txtMax.Text,\
  \ out max);\n        if (flag == false)\n        {\n            MessageBox.Show(\"\
  只能输入数字字符。\", \"输入错误\",\n              MessageBoxButtons.OK, MessageBoxIcon.Stop);\n\
  \            txtMax.Focus();\n            return;\n        }\n        //========\
  \ 程序处理步骤 ==============\n        counter = 0;\n        last = (int) randomNumber.Next(max);\n\
  \        do\n        {\n            current = randomNumber.Next(max);\n        \
  \    if (last == current)\n            {\n                break;\n            }\n\
  \            last = current;\n            counter++;\n        } while (counter <\
  \ MAXITERATIONS);\n\n        //========= 程序输出步骤 ==============\n        if (counter\
  \ < MAXITERATIONS)\n        {\n            lblAnswer.Text = \"花费了 \" + counter.ToString()\
  \ + \" 次循环匹配成功\";\n        } else {\n            lblAnswer.Text = \"没有发生连续匹配\";\n\
  \        }\n    }\n\n    //============ 程序终止步骤 ========\n    private void btnClose_Click(object\
  \ sender, EventArgs e)\n    {\n        Close();\n    }\n}\n```\n\n## 工作原理\n\n程序的示例运行结果如图\
  \ 7.4 所示。文本框对象中的值 1000 表示程序应该生成 0 到 1000 之间的随机数（也就是说，随机值在 0 到 999 之间变化）。图 7.4 显示，在随机数生成器连续产生相同值之前，循环执行了\
  \ 5017 次。现在仔细观察代码。\n\n程序开始时使用了第 2 章讨论的 C# 模板。在列表 7-3 的顶部附近有如下语句：\n\n```cs\n const\
  \ int MAXITERATIONS = 200000;    // 循环次数限制\n```\n\n该语句用于限制 `do-while` 循环的最大迭代次数。这样做是因为可能在循环几十亿次后，仍没有生成两个连续相同的值。通过使用符号常量\
  \ `MAXITERATIONS`，你可以轻松更改循环限制，而无需更改循环内部的代码。确实，你可以在 `while` 循环中硬编码值 `200000`，但这样代码中就会出现一个无法说明用途的“魔法数字”。使用符号常量\
  \ `MAXITERATIONS` 有助于记录该数字的作用。此外，如果你决定将 `MAXITERATIONS` 修改为其他值，只需在程序顶部修改一次，新值将自动应用于程序的其余部分。该语句：\n\
  \n```cs\n Random randomNumber = new Random();\n```\n\n用于创建一个名为 `randomNumber` 的\
  \ `Random` 对象。程序随后使用 `TryParse()` 方法来构建用户希望随机数落入的范围。调用 `Random` 类的 `Next()` 方法来产生一个\
  \ 0 到 `max` 减 1 之间的随机值。以下代码片段执行了程序的大部分工作：\n\n```cs\n counter = 0;\nlast = randomNumber.Next(max);\n\
  do\n{\n    current = randomNumber.Next(max);\n    if (last == current)\n    {\n\
  \        break;\n    }\n    last = current;\n    counter++;\n} while (counter <\
  \ MAXITERATIONS);\n```\n\n变量 `counter` 在进入循环之前被初始化为 0。（该语句的作用相当于 `for` 循环中的 `expression1`。）它是用于控制循环的变量。程序随后使用\
  \ `Random` 类的 `Next()` 方法生成一个随机数并赋值给变量 `last`。然而，由于程序的目标是比较两个随机值，你知道在测试两个值是否相同之前，必须生成另一个随机值。这就是为什么你使用\
  \ `do-while` 循环：你至少需要执行一次循环体，以产生用于比较的两个随机值。第二个随机值被赋值给名为 `current` 的变量。现在你有两个随机数要进行比较了。\n\
  \n### 循环中的 break 关键字\n\n`if` 语句比较 `last` 和 `current` 的值以检查它们是否相同。如果相同，`if` 语句为真，并执行\
  \ `break` 语句。一旦在循环中执行 `break` 语句，它会将控制权转移到循环大括号之后的语句。\n\n```cs\n if (counter < MAXITERATIONS)\n\
  ```\n\n如列表 7-3 所示。如果 `current` 和 `last` 的值不同，则不执行 `break` 语句，程序评估 `do-while` 块：\n\
  \n```cs\n while (counter < MAXITERATIONS);\n```\n\n决定是否再次进行循环循环。目前，符号常量 `MAXITERATIONS`\
  \ 设置为 200000，但你可以根据需要修改它。（注意该符号常量在后续行中再次用于确定显示给用户的消息。）假设 `counter` 没有超过 `MAXITERATIONS`，`while`\
  \ 测试结果将再次进入循环体。这种情况有两个原因。第二，更重要的是，循环可能需要执行几十亿次才能产生 `last` 和 `current` 的匹配值。这意味着程序产生的\
  \ `counter` 值可能超出了整数能存储的范围。这会导致所谓的*数值溢出异常*，你的程序将以一种极不体面的方式死掉！（你将在第 11 章中学习如何避免这种尴尬。）最终，要么两个变量发生了匹配，要么\
  \ `counter` 等于 `MAXITERATIONS` 导致 `do-while` 循环终止。此时，最后的 `if` 语句被求值，适当的消息显示在 `lblAnswer`\
  \ 对象中。正如你预期的，随着用户增加 `max` 的值，产生匹配所需的循环次数也会随之增加。\n\n## continue 语句\n\n有时你需要在继续循环之前在循环内部执行某些特殊操作。例如，你可能有一个循环在轮询本章开头提到的消防喷淋传感器。然而，当某个传感器被触发时，你并不跳出循环，而是可能想继续读取其余传感器以查看火蔓蔓得有多快。代码可能如下：\n\
  \n```cs\n while (true)\n{\n    id++;\n    state  = readSensor(id);\n    if (state\
  \ == true)\n    {\n         soundAlarm();\n         callFireDepartment();\n    \
  \     continue;\n     }\n     if (id == MAXSENSORS)\n     {\n         id = 0;  \
  \  // 这样增量运算符将其设置为 1\n     }\n }\n```\n\n\n\n\n\n在此代码段中，你通过设计建立了一个无限 `while` 循环，方法是使测试表达式（`expression2`）始终为逻辑\
  \ `True`，如第一个程序语句所示。代码增加传感器识别号（`id`），然后读取相应的传感器。如果传感器没有返回 `true`，程序将再次进入循环。如果发生火且传感器返回\
  \ `true`，则会响警报、报警消防部门，然后由于 `continue` 语句，代码将在 `while` 循环的 `expression2` 处继续执行。由于\
  \ `expression2` 始终为逻辑 `True`，循环将继续执行代码。\n\n当使用 `while` 或 `do-while` 循环时，`continue`\
  \ 语句会将控制权发送到决定是否需要再次循环的表达式（即 `expression2`）。\n\n使用 `for` 循环的相同代码如下：\n\n```for\n\
  \ for (id = 0; true; id++)\n{\n    state  = readSensor(id);\n    if (state == true)\n\
  \    {\n         soundAlarm();\n         callFireDepartment();\n         continue;\n\
  \     }\n     if (id == MAXSENSORS)\n     {\n         id = 0;//// 0 所以递增运算符将其设置为\
  \ 1\n     }\n }\n```\n\n在这种情况下，如果发生火，变量 `state` 为 `true`，则执行警报和报警消防的方法；然后执行 `continue`。（查看\
  \ `for` 循环的 `expression2`）。`continue` 语句将程序控制权发送到 `for` 语句的 `expression3` (`id++`)，这会增加传感器\
  \ `id`。随后程序控制权发送到 `expression2` 以判断是否需要再次循环。由于 `expression2` 始终为逻辑 `True`，代码将再次通过循环。你应该让自己确信这是一个无限循环。\n\
  \n与将程序控制权转移出循环的 `break` 语句不同，`continue` 语句将程序控制权保留在循环内，以决定是否有必要再次循环。作为一项实验，你可以为\
  \ `soundAlarm()` 和 `callFireDepartment()` 方法编写虚拟方法，然后使用调试器单步执行代码。再次，使用调试器是更全面地理解代码在做什么的极佳方法。\n\
  \n为了完整起见，你应该知道 C# 支持 `goto` 关键字，它可以与标签结合使用创建循环结构。然而，由于 `goto` 是一种非常糟糕的编码结构（即一种编码捷径），我们没有向你展示如何编写这样的循环。如果你真的想知道，可能可以在网上找到示例。（警告：传闻看\
  \ `goto` 语句会会长疣子。）\n\n# 总结\n\n循环结构是大多数程序中的基本元素之一。你应该学习本章中介绍的概念，直到你对如何以及何时使用每种循环类型都充满信心。你还应该确保完成这些练习，也许还可以自己编写几个示例。\n\
  \n# 练习题\n\n你可以在附录 A 中找到以下练习的答案。\n\n**1.** 编写计算数字阶乘所需的循环代码。例如，5 的阶乘写法如下所示：\n\n```\n\
  \ 5! = 5 * 4 * 3 * 2 * 1\n\n5! = 120\n```\n\n你可以假设定义了一个名为 `num` 的变量来存储用于阶乘的数字，并使用名为\
  \ `i` 的变量来控制循环。**2.** 尽管附录 A 中所示练习 1 的解决方案产生了正确答案，但它其中有两个小瑕疵。你能确定它们是什么吗？**3.** 于\
  \ 1 盎司等于 28.3495231 克，编写一个循环，在列表框中生成一个表格，显示从 1 盎司到 4 磅重量转换为克的数值。**4.** 查看练习 3 的解决方案代码。你能找到一个改进代码的微小更改吗？**5.**\
  \ 假设一项货币资产每年增长 *x* 百比，计算该资产在 *n* 年结束时的价值（使用单利）。\n\n### 你在这一章中学到的知识\n\n| 主题 | 关键点\
  \ |\n| :--- | :--- |\n| 良好的循环 | 编写良好的程序循环的必要和充分条件。 |\n| for, while, do-while 循环\
  \ | C# 中使用的三种类型的程序循环。 |\n| 使用哪种循环 | 如何决定哪种循环结构为迭代一组程序语句提供了最佳方式。 |\n| break, continue\
  \ | 如何在程序循环中使用这些关键字。 |\n\n# 第 8 章\n\n# 理解数组和集合\n\n**你将在本章中学到的内容：**\n\n* 数组 (Arrays)\n\
  * 数组索引和元素\n* 如何设置数组大小\n* 常用的数组类方法\n* 多维数组\n* 数组列表 (Array lists)\n* 集合 (Collections)\n\
  * 锯齿数组 (Jagged arrays)\n\n[wrox.com](http://wrox.com) 本章代码下载\n\n你可以在 [www.wrox.com/remtitle.cgi?isbn=9781118336922](http://www.wrox.com/remtitle.cgi?isbn=9781118336922)\
  \ 的 Download Code 选项卡中找到 [wrox.com](http://wrox.com) 本章的代码下载。Chapter08 文件夹中的代码根据整个章节中的名称单独进行命名。\n\
  \n在本章中，你将学习数组、数组列表和集合。这些数据结构有助于解决许多类型的编程问题。当你完成本章后，你将理解数组如何让某些编程问题变得更容易解决。\n\n#\
  \ 什么是数组\n\n`array`（数组）是一组共享名称名称相同类型。定义数组的语法如下：\n\n```typeSpecifier[] arrayName =\
  \ new typeSpecifier[numberOfElements];\n```\n\n其中：\n\n* `typeSpecifier` 是你想要使用的数据类型。\n\
  * `arrayName` 是你想要为数组使用的名称。\n* `numberOfElements` 是你想要的数组元素数量。\n\n稍后将使用以下示例解释这些部分的每一个部分。\n\
  \n假设你有一个包含 100 个名字的地址录。由于你想在程序中以某种方式操作这些名字，每个唯一的名字都必须存储在唯一的变量中。由于名字是文本数据，你可以使用这样的代码：\n\
  \n```\nstring name00;\nstring name01;\nstring name02;\nstring name03;\n//…许多变量…\n\
  string name98;\nstring name99;\n```\n\n虽然这种方法行得通，但它有两个严重的缺点。首先，你会厌倦输入所有这些名字。更糟糕的是，想想如果地址录中有一万个名字会发生什么！其次，你将如何执行在列表中搜索特定某人的常见任务？你将被迫遍历\
  \ 100 个 `if` 语句来寻找一个特定的名字：\n\n```\nif (name00.Equals(targetName))\n{\n     index\
  \ = 0;\n}\nelse\n{\n     if (name01.Equals(targetName))\n     {\n          index\
  \ = 1;\n     }\n     else   …依此类推…\n```\n\n记住，当你比较字符串等对象时，你不是比较右值到右值（rvalue-to-rvalue）。相反，你想比较存储在对象右值所包含的内存地址的内容。因此，在比较字符串时，你应该使用\
  \ `Equals()` 方法，该方法对所有字符串对象都可用。这种编程方案是不实际的，这正是创建数组的原因。\n\n与其使用 100 个不同的变量（每个名字一个），你将使用你之前看到的语法定义一个单字符串数组来存储这些名字：\n\
  \n```string[] names = new string[100];\n```\n\n程序现在有一个名为 `names` 的字符串数组变量，可以存储 100\
  \ 个名字。你可以利用在上一章中中学的循环知识来简化代码：\n\n```for for (i = 0; i < names.Length; i++)\n{\n\
  \     if (names[i].Equals(targetName))\n     {\n          index = i;\n         \
  \ break;\n     }\n}\n```\n\n\n\n\n\n如果你仔细阅读代码，你会发现当循环第一次执行时，`if` 测试会将列表中的第一个名称 (`names[0]`)\
  \ 与存储在 `targetName` 中的名称（你要查找的名称）进行比较。如果测试失败，循环计数变量 `i` 通过 `for` 循环的第三个表达式 (`i++`)\
  \ 加增，代码将进行下一次比较测试（`if names[1].Equals(targetName)`）。循环将持续直到找到匹配项。此时，索引被赋值为 `i` 的值（这样你以后就可以引用该人员），并且\
  \ `break` 语句会将程序控制交交给 `for` 循环后的第一条语句。如果没有找到匹配项，`index` 将保持不变且搜索失败。（在进入循环之前将 `index`\
  \ 设置为 `-1` 是判断搜索是否失败的好方法，因为 `-1` 不能作为数组的索引。）\n\n如你所见，数组和循环之间存在共生关系，它们经常被结合使用来解决无数编程问题。另外注意，在上面的\
  \ `for` 循环中使用 `names.Length` 作为 `expression2`，因为它返回了数组中元素的数量。这比硬编码数组元素的数量要好得多。\n\
  \n## 数组的一些细节\n\n为了证明数组的使用，我们忽略了关于它们的一些重要细节。你将在接下来的几段中涵盖这些细节。\n\n### 数组元素与数组索引\n\n\
  `array element` 是数组的单个单元。考虑以下数组定义：\n\n```\nint[] myData = new int[10];\n```\n\n\
  该语句表示你想要在内存中连续排列 10 个整数，并希望将它们引用为 `myData`。你可以从图 8.1 中看到它在内存中可能是这个样子。\n\n图 8.1 数组的内存映像\n\
  \n![image](img/c08f001.jpg)\n\n这 10 个整数中的每一个都被称为数组中的一个元素。当你定义数组大小时，你总是指定你想要的元素数量。该数字出现在定义语句末尾最后的括号之间（在本例中为\
  \ `[10]`）。\n\n`array index` 指的是数组中特定元素的位置。在示例中，你请求了 10 个元素，但第一个元素的位置索引为 `0`。和几乎其他所有东西一样，C#\
  \ 从 0 开始计算数组索引。因此，在\n\n```\nval = myData[0];\n```\n\n`val` 将等于 `myData` 数组第一个元素的内容。这意味着索引\
  \ `0` 访问数组的第一个元素。（在图 8.1 中，`val` 被赋值为存储在内存位置 900,000 开始的 4 个字节的值。）\n\n### N – 1\
  \ 原则\n\n对 `myData` 数组的定义请求数组大小为 10。这意味着数组的有效索引从 `0` 到 `9`。这得出了 N – 1 原则：\n\n数组允许的最大索引比数组元素的数量少一。\n\
  \n这是初级程序员经常遇到的障碍。因为你请求了 10 个元素，看起来使用索引 `10` 来访问数组最后一个元素是合理的。事实并非如此。如果你尝试使用类似下面的代码引用元素，Visual\
  \ Studio 会抛出越界错误：\n\n```\nval = myData[10];\n```\n\n错误消息的原因是该语句尝试访问数组边界内不存在的元素。只有从\
  \ `0` 到 `9` 的元素是有效的数组索引值。如果你遇到越界错误，请记住 N – 1 原则，检查你是否正在尝试访问数组限制之外的索引。\n\n如果你不确定数组有多大，始终可以使用以下代码：\n\
  \n```\nsize = myData.Length;\n```\n\n数组对象的 `Length` 属性返回数组中元素的数量。（它*并不返回*数组所占内存的字节数。）在例例中，在执行该语句后，`size`\
  \ 将等于 `10`。（注意本章开头的示例 `for` 循环中使用的 `Length` 属性。）\n\n在接下来的“动手试练”（Try It Out）中，你将编写一个简单的程序，来统计文本区域中字母出现的次数。你将使用数组在代码执行期间跟踪各项。\n\
  \n**动手试练：字母计数 (Chapter08ProgramLetterCount.zip)** 现在编写一个短程序，让用户在多行文本框中输入几个句子，然后统计每个字母在该文本中出现的次数。你对标点符号、空格、数字字符或大小写字母的区别不感兴趣——只需要字母字符。根据本节所述的程序设计，你将如何解决这个问题？再次，开始思考如何使用你在第\
  \ 2 章中学到的“五个编程步骤”来解决编程问题。初始化步骤由 Visual Studio 为你完成。输入步骤简单就是用户输入的文本。处理步骤涉及检查输入到文本框对象中的每个字母，并统计每个字母字符出现的次数。输出步骤仅涉及将字母计数复制到列表框中进行显示。终止步骤非常简单。\n\
  \n\n\n\n\n# 工作原理\n\n编程任务的解决方案如列表 8-1 所示。程序开始时首先定义了一系列符号常量。\n\n```cpp\n private const\
  \ int MAXLETTERS = 26;            // 符号常量\n  private const int MAXCHARS = MAXLETTERS\
  \ - 1;\n  private const int LETTERA = 65;\n```\n\n你已经知道为什么在程序中使用符号常量是一件好事了。至少，它能防止你在程序中使用“魔术数字”（magic\
  \ numbers）。`LETTERA` 常量需要一些解释。当你按下键盘上的某个字母时，它会完成键盘矩阵列中的一个电电路的闭合，然后该信号被解码并作为一个单字节数值值发送到计算机。（某些键盘可以发送\
  \ 2 字节的 Unicode 字符，但我们假设这里不是这种情况。）发送到计算机的代码使用了第 5 章所解释的 ASCII 字符集。字母 A 的 ASCII 值为\
  \ 65。字母 Z 的 ASCII 值为 90，这意味着代码是按字母顺序排列的。也就是说，B 是 66，C 是 67，以此类推。因此，如果你将用户在文本框对象中输入的文本转换为大写字母，在存储字母计数的数组中创建正确的索引就是件简单的事。存储计数的数组定义如下：\n\
  \n```cpp\n int[] count = new int[MAXLETTERS];\n```\n\n由于符号常量 `MAXLETTERS` 是 26，因此你定义了一个包含\
  \ 26 个元素的数组，这意味着索引的值范围是从 0 到 25。（记得 $N - 1$ 原则吗？）计划使用 `count[0]` 来存储 A 的计数，`count[1]`\
  \ 存储 B 的计数，`count[2]` 存储 C 的计数，以此类推。现在假设用户输入了单词 Abe。因为大写字母和小写字母的 ASCII 值不同，你需要执行的每件事是将所有内容转换为大写字母。（你的程序设计说过你不在乎字母的大小写。）来自列表\
  \ 8-1 的以下语句获取用户输入的输入并将其赋值给名为 `input` 的字符串变量：\n\n```cpp\n input = txtInput.Text;\n\
  input = input.ToUpper();\n```\n\n代码随后使用 `ToUpper()` 方法将所有字母转换为大写。现在的文本是 ABE。完成大小写转换后，你现在准备好计数字母了。该语句\n\
  \n```cpp\n oneLetter = input[i];               // 获取字符\n```\n\n利用了你可以将字符字符串视为数组的这一事实。因此，在\
  \ `for` 循环中，当 `i` 为 0 时，`input[i]` 是 ABE 中的 A。接下来的语句是：\n\n```cpp\n index = oneLetter\
  \ - LETTERA;        // 转换为索引\n```\n\n解析结果为：\n\n```cpp\n index = 'A' - 65;      \
  \  // 转换为索引\n```\n\n然而，当 A 被视为 ASCII 字符时，它实际上是 65。因此该表达式变为：\n\n```cpp\n index =\
  \ 65–65;        // 转换为索引\nindex = 0;\n```\n\n接下来的三行首先检查刚刚计算的索引是否在 0 到 25 之间。如果不是，则该字符不是字母，你不想计算它：\n\
  \n```cpp\n if (index < 0 || index > MAXCHARS)  // 是字母吗？？\n  continue;          \
  \               // 不是。\ncount[index]++;                     // 是的。\n```\n\n由于你的索引是\
  \ 0，你执行了以下语句：\n\n```cpp\n count[0]++;\n```\n\n这会增加数组中第一个整数的内容。（在 C# 中，所有值类型数组元素在定义时刻都被初始化为\
  \ 0。对象数组被初始化为 null。（你可以在“字符串对象的初始化列表”部分以及表 8.1 等处阅读更多关于这些细节的介绍。）如果你仔细想，`count[0]`\
  \ 对应于字母 A——这正是你想要的元素！现在 `count[0]` 等于 1，因为代码统计了 ABE 中的字母 A。\n\n表 8.1 数组类属性和方法的部分列表\n\
  \n| **示例** | **描述** |\n| :--- | :--- |\n| `System.Array.BinarySearch(count, target)`\
  \ | 在名为 `count` 的排序一维数组上执行二分查找以寻找 `target`。 |\n| `System.Array.Clear(count, start,\
  \ count.Length)` | 将从元素 `start` 到 `Length` 的值类型数组清零为 0。引用数组清零为 null。 |\n| `System.Array.Copy(Source,\
  \ Dest, Length);` | 从 `Source` 数组复制 `Length` 个元素到 `Dest` 数组。 |\n| `System.Array.IndexOf(count,\
  \ val)` | 返回 `count` 数组中首次找到 `val` 处的索引。 |\n| `System.Array.LastIndexOf(count, val)`\
  \ | 返回 `count` 数组中最后一次找到 `val` 处的索引。 |\n| `System.Array.Sort(count)` | 对 `count`\
  \ 数组排序。 |\n| `System.Array.Reverse(count)` | 反转 `count` 数组。 |\n| `System.Array.Binary(count,\
  \ target)` | 在排序的 `count` 数组上执行二分查找以寻找 `target`。 |\n| `System.Array.Clear(count,\
  \ start, count.Length)` | 将 `count` 数组中从 `start` 到 `Length` 的元素清零为 0。 |\n| `System.Array.Copy(Source,\
  \ Dest, Length)` | 将 `Source` 数组中的 `Length` 个元素复制到 `Dest` 数组。 |\n| `System.Array.IndexOf(count,\
  \ val)` | 返回 `count` 数组中第一个出现 `val` 的索引。 |\n| `System.Array.LastIndexOf(count, val)`\
  \ | 返回 `count` 数组中最后一次出现 `val` 的索引。 |\n| `System.Array.Sort(count)` | 对 `count`\
  \ 数组进行排序。 |\n| `System.Array.Reverse(count)` | 反转 `count` 数组的顺序。 |\n\n*(注：由于原文表格内容与示例描述略有差异，此处已根据通用逻辑翻译对齐)*\n\
