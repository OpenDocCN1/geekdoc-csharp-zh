  **在过去的 30 年里，我针对各种编程主题写了 18 本书**。你可能会问，为什么是这么多……难道我第一次就做对了吗？不，我没有……至少并不完全是。当我在 30\
  \ 多年前写我的第一本书时，面向对象编程（OOP）对于大多数人来说是模糊且不为人知的。像许多其他人一样，我必须经历 OOP 的学习过程，才能真正理解 OOP 的意义。我觉得现在很多人也有这种感觉。\n\
  \n\n\n\n每次教授编程课程时，我都能学到新的、更好的讲解方式。当我放眼望去，教室里坐满了学生却像一幅静物画时（即学生们完全听懵了），就该停下来调整思路，换个方法去解释我正在尝试传授的概念。我所教过的每一堂课都为我提供了关于“如何教学”以及“学生如何学习”的新视角。我曾有机会在大学里为本科生授课，也在本地和欧洲的各类公司进行现场培训。每一次经历都带来了不同的教学挑战。变换示例以及用于讲授编程概念的方法是我离开多年后又重返讲台的原因之一……因为我怀念那种不断学习的体验。\n\
  \n我之前写的几本书关注的是`C#`以外的语言,但这同样丰富了我作为讲师的经验教训——只有当你接触过其他一些不那么完美的语言后,才能真正体会到一门语言的优缺点所在.\
