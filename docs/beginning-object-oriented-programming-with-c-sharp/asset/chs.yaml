  \ |\n| Length | 返回文件的字节数 |\n| Name | 返回当前文件的名称 |\n\n这些表格及其关联的方法和属性应该为你提供足够的关于目录和文件的信息，以便于你在程序中对它们进行操作。在本章稍后的内容中，你将用到其中的几个属性和方法。然而，在此之前，你需要理解\
  \ C# 支持的基本文件类型。\n\n# 文件类型\n\n从编程语言的角度来看，文件有两种基本类型：包含文本数据的文件和包含二进制数据的文件。通常，你可以通过文件名判断一个给定文件是文本文件还是二进制文件。文件名使用主文件名和次文件名存储在磁盘上。例如，一个名为\
  \ `JaneAtParty.jpg` 的文件其“主”名称为 `JaneAtParty`，“次”文件名为 `jpg`。（许多人将主文件名称为*唯一的*文件名，将次文件名称为文件的\
  \ `extension`（扩展名）。）次文件名通常提供了其类型的线索。例如，扩展名为 `txt` 的文件通常是文本数据文件，而以 `jpg` 结尾的文件则是二进制图像文件。虽然没有强制要求你使用常用的文件扩展名，但在程序中使用它们通常是一个好主意。\n\
  \n## 文本数据与二进制数据文件\n\n包含文本数据的文件通常是由附加到文件的字符串构建的。当用户在文本框中输入文本时，这些数据以字符串格式的纯文本形式存储在内存中。如果你想在磁盘上永久保存这些信息，意味着将字符串从内存移动到磁盘数据文件。如果用户在文本框中输入一个数字且该数字被用于数值计算（例如取该数字的平方根），则该数字以二进制格式存储在内存中。为了将该数字保存到文本文件中，必须将其转换为字符串，*然后*写入磁盘。（在你之前使用与值类型关联的\
  \ `ToString()` 方法时，已经进行过很多次转换了。）换句话说，文本文件只包含字符串数据。\n\n文本文件的文件的优点之一是很容易读取文本文件的内容。你可以使用像记事本（Windows\
  \ 自带）这样简单的程序来读取文本文件。因为文本文件非常易于阅读，所以读写文本文件的程序通常更容易调试。图 13.2 显示了使用记事本读取文本文件的输出。\n\n\
  **图 13.2**](#9781118416471c13.xhtml_c13-fig-anc-0002) 示例文本文件\n\n![image](img/c13f002.jpg)\n\
  \n二进制文件与文本文件略有不同。如果将一个数字写入二进制文件，不会发生该数字到字符串的转换。如果一个 `int` 变量的值为 `50`，该值将作为 4 字节的数据写入二进制文件，尽管作为字符串写入时只需要\
  \ 2 字节。（如果使用 Unicode，字符串将占用 4 字节。）因为 `int` 值类型以十六进制（16 进制）值存储在内存中，数字 `50` 在二进制文件中将存储为\
  \ `32 00 00 00`。如果该值是十进制数据类型，则在二进制文件中存储该值需要 16 字节。\n\n如果某些数字（如 `50`）在内存中占用的字节比其等效字符串多，为什么要使用二进制文件？首先，如果该值是\
  \ 10 亿而不是 `50`，字符串需要 10 字节来存储文本，但作为二进制值存储仅需 4 字节。第二，更重要的一点是，存储为二进制的值可以直接移动到内存并使用，而无需将其值从磁盘存储的字符串格式转换为程序中使用的十六进制格式。避免这种转换过程使得二进制文件从磁盘文件读取数值数据到程序时速度稍快一点。\n\
  \n如果你取图 13.2 所示的相同文件，并使用以二进制格式显示该文件的程序读取它，输出看起来就像图 13.3 所示所示。\n\n**图 13.3**](#9781118416471c13.xhtml_c13-fig-anc-0003)\
  \ 以二进制格式查看文本文件\n\n![image](img/c13f003.jpg)\n\n***\n\n**注意** 你可以在 Visual Studio\
  \ 内部以二进制格式读取文本文件。要以二进制格式读取文本文件，使用菜单序列 `文件 → 打开 → 文件` 导航到你想查看的文件。然而，文件将以二进制格式显示。\n\
  \n*** *你可以在 Visual Studio 内部以二进制格式读取文本文件。要以二进制格式读取文本文件，使用菜单序列 `文件 → 打开 → 文件` 导航到你想查看的文件。然而，文件将以二进制格式显示。\n\
  \n*** * * *你可以在 Visual Studio 内部以二进制格式读取文本文件。要以二进制格式读取文本文件，使用菜单序列 `文件 → 打开 → 文件`\
  \ 导航到你想查看的文件。然而，文件将以二进制格式显示。\n\n再次，如图 13.3 所示，你可以看到十六进制值以其 ASCII 等效值显示。\n\n如果你仔细观察图\
  \ 13.3，你可以看到十六进制值 `0D 0A` 是文件中最后两个字符。这两个字符形成了一个回车-换行符（CRLF）字符对。将回车符（CR）想象为将光标移动到屏幕的最左侧。换行符（LF）将光标向下移动一行。在一起，CRLF\
  \ 组合形成*换行*字符，它在字符串格式中表示为 `\\n`。简单来说，CRLF 序列会导致后续文本出现在新的输出行上。\n\n在下一个练习中，你将创建一个显示文本文件内容的程序。通常，错误日志文件是文本文件，并可能用于电话技术支持。\n\
  \n***\n\n**练习：写入文本文件 (Chapter13ErrorLog.zip)**在第 11 章中，你读到关于如何将错误日志消息作为异常处理的一部分是一种实用的调试技术。本节开发了一个程序，你可以轻松修改它以作为你程序中的错误日志类。程序的运行示例显示在图\
  \ 13.4 中。\n\n**图 13.4**](#9781118416471c13.xhtml_c13-fig-anc-0004) 错误日志程序\n\n\n\n\
  \n\n![image](img/c13f004.jpg)\n\n该程序允许用户选择她想要抛出的异常类型，以测试错误日志功能。完成选择后，用户点击 `Throw`\
  \ 按钮抛出相应的异常。随后，该异常会被写入错误日志文件中。错误日志文件的内容将显示在列表框对象中，如图 13.4 所示。由于错误日志文件是一个文本文件，你可以使用其他程序（如\
  \ `Notepad`）来显示其内容。\n\n### 创建此程序\n\n1. 按照常规方式创建一个新项目。\n2. 在 Windows 表单（form）上添加工具箱对象。你可以使用代码列表\
  \ 13-3 所示。\n\nListing 13-3：抛出并记录异常的程序 (frmMain.cs)\n\n```cs\nusing System;\nusing\
  \ System.Windows.Forms;\nusing System.IO;\n\npublic class frmMain : Form\n{\n  \
  \  string err;\n\n    private RadioButton rbNumericOverflow;\n    private RadioButton\
  \ rbFileNotFound;\n    private RadioButton rbDivideBy0;\n    private Button btnThrow;\n\
  \    private Button btnClose;\n    private TextBox txtErrorMsgs;\n    private GroupBox\
  \ groupBox1;\n\n    #region Windows code\n\n    public frmMain()\n    {\n      \
  \  InitializeComponent();\n        rbDivideBy0.Checked = true;\n    }\n\n    public\
  \ static void Main()\n    {\n        frmMain main = new frmMain();\n        Application.Run(main);\n\
  \    }\n\n    private void btnThrow_Click(object sender, EventArgs e)\n    {\n \
  \       try\n        {\n            // To use a general catch, uncomment the next\
  \ line\n            // throw new System.OutOfMemoryException();\n            if\
  \ (rbDivideBy0.Checked == true)\n            {\n                throw new System.DivideByZeroException();\n\
  \            }\n            else\n            {\n                if (rbFileNotFound.Checked\
  \ == true)\n                {\n                    throw new System.IO.FileNotFoundException();\n\
  \                }\n                else\n                {\n                  \
  \  throw new System.OverflowException();\n                }\n            }\n   \
  \     }\n        catch (DivideByZeroException ex)\n        {\n            MessageBox.Show(\"\
  DivideByZeroException thrown.\",\n                            \"Exception Error\"\
  );\n            err = \"DivideByZeroException: \" + ex.StackTrace;\n        }\n\
  \        catch (FileNotFoundException ex)\n        {\n            MessageBox.Show(\"\
  FileNotFoundException thrown.\",\n                            \"Exception Error\"\
  );\n            err = \"FileNotFoundException\" + ex.StackTrace;\n        }\n  \
  \      catch (OverflowException ex)\n        {\n            MessageBox.Show(\"OverflowException\
  \ thrown.\",\n                            \"Exception Error\");\n            err\
  \ = \"OverflowException\" + ex.StackTrace;\n        }\n        catch (Exception\
  \ ex)\n        {\n            MessageBox.Show(ex.StackTrace, \"Exception Error\"\
  );\n            err = ex.Message + \" \" + ex.StackTrace;\n        }\n        finally\n\
  \        {\n            clsErrorLog myErrLog = new clsErrorLog(err);\n         \
  \   myErrLog.PathName = Application.StartupPath;\n\n            myErrLog.WriteErrorLog();\n\
  \            txtErrorMsgs.Text = myErrLog.ReadErrorLog();\n        }\n    }\n\n\
  \    private void btnClose_Click(object sender, EventArgs e)\n    {\n        Close();\n\
  \    }\n}\n```\n\n大部分工作是在 `btnThrow_Click()` 事件代码中完成的。根据用户选择的异常类型，一系列嵌套的 if 会导致抛出相应的异常。随后，该异常会触发其相关的\
  \ catch 块进行处理。例如，如果用户选择了除以零异常，该异常就会被抛出并执行 catch 块：\n\n```cs\n catch (DivideByZeroException\
  \ ex)\n{\n    MessageBox.Show(\"DivideByZeroException thrown.\",\n             \
  \       \"Exception Error\");\n    err = \"DivideByZeroException: \" + ex.StackTrace;\n\
  }\n```\n\n系统向用户显示一条消息，然后字符串变量 `err` 会记录异常类型加上来自 `Exception` 对象 `ex` 的 `StackTrace`\
  \ 信息。`finally` 块实例化了一个名为 `myErrorLog` 的错误日志对象，并将错误字符串 (`err`) 传递给构造函数。最后，`WriteErrorLog()`\
  \ 方法将错误字符串追加到错误日志文件中。`ReadErrorLog()` 方法仅是将错误日志文件的内容显示在多行文本框对象中。错误日志文件的管理是通过 `clsErrorLog`\
  \ 类完成的。要查看错误日志类的代码，请参考代码列表 13-4\n\n\n\nListing 13-4：clsErrorLog 源代码 (clsErrorLog.cs)\n\
  \n\n\n\n\n```csharp\n using System;\nusing System.Collections.Generic;\nusing System.IO;\n\
  \nclass clsErrorLog\n{\n    //=================== 实例成员 ====================\n  \
  \  private string fileName;\n    private string pathName;\n    private string errorMessage;\n\
  \    private int errorFlag;\n\n    StreamWriter sw = null;\n    StreamReader sr\
  \ = null;\n\n    //=================== 构造函数 =========================\n    public\
  \ clsErrorLog(string msg)\n    {\n        errorMessage = msg;\n        errorFlag\
  \ = 0;\n        fileName = \"ErrorLog.txt\";\n    }\n    //=================== 属性方法\
  \ ====================\n    public string FileName\n    {\n        get\n       \
  \ {\n            return fileName;\n        }\n        set\n        {\n         \
  \   if (value.Length > 0)\n                fileName = value;\n        }\n    }\n\
  \    public string Message\n    {\n        get\n        {\n            return errorMessage;\n\
  \        }\n        set\n        {\n            if (value.Length > 0)\n        \
  \        errorMessage = value;\n        }\n    }\n\n    public string PathName \
  \     // 设置路径名称\n    {\n        get\n        {\n          return pathName;\n   \
  \     }\n\n        set\n        {\n          if (value.Length > 0)\n           \
  \ pathName = value;\n        }\n    }\n    //=================== 辅助方法 ======================\n\
  \    //=================== 普通方法 =====================\n\n    /*****\n    * 用途：读取错误日志文件。\n\
  \    *\n    * 参数列表:\n    *  n/a\n    *\n    * 返回值\n    *  string          错误日志消息文件的内容\n\
  \     *****/\n    public string ReadErrorLog()\n    {\n       string buff;\n   \
  \    try\n       {\n            string pfn = Path.Combine(pathName, fileName);\n\
  \            if (File.Exists(pfn) == true)\n            {\n                sr =\
  \ new StreamReader(pfn);\n\n                buff = sr.ReadToEnd();\n           \
  \     sr.Close();\n                return buff;\n            }\n       }\n     \
  \  catch\n       {\n          return \"\";\n       }\n       return \"\";\n    }\n\
  \    /*****\n    * 用途：将错误日志消息写入错误日志文件。\n    * 消息包含日期和时间、错误类型\n    * 以及错误的堆栈跟踪（stack\
  \ trace）。\n     *\n     * 参数列表:\n     *  n/a\n     *\n     * 返回值\n     *  int  \
  \        0 = 无错误，1 = 其他情况\n     *****/\npublic int WriteErrorLog()\n{\n    errorFlag\
  \ = 0;\n    DateTime currentDT = DateTime.Now;\n    try\n    {\n      // 我们有所有需要的字符串吗？\n\
  \      if (errorMessage.Length != 0 && pathName.Length != 0 &&\n               \
  \    fileName.Length != 0)\n      {\n        sw = new StreamWriter(Path.Combine(pathName,\n\
  \                                           fileName), true);\n        sw.WriteLine(currentDT.ToShortDateString()\
  \ + \", \" +\n                     currentDT.ToShortTimeString() + \": \" + errorMessage);\n\
  \                     sw.WriteLine(\"----------------\");\n                    \
  \ sw.Close();\n      }\n      else\n      {\n        errorFlag = 1;  // 发生了某些错误\n\
  \      }\n    }\n    catch (Exception ex)\n    {\n              errorMessage = ex.Message;\n\
  \              errorFlag = 1; // 发生了某些错误\n    }\n      return errorFlag;\n    }\n\
  \    /*****\n    * 用途：将错误日志消息写入错误日志文件。\n    *\n    * 参数列表:\n    *  string msg  \
  \     要写入的错误消息\n    *\n    * 返回值\n    *  int              0 = 无错误，1 = 其他情况\n   \
  \  *****/\n    public int WriteErrorLog(string msg)\n    {\n        errorMessage\
  \ = msg;             // 复制消息\n        errorFlag = WriteErrorLog();    // 现在调用原始方法\n\
  \        return errorFlag;\n    }\n}\n```\n\n### StreamWriter 对象\n\n代码利用一个 `StreamWriter`\
  \ 对象将错误消息及相关信息写入名为 `ErrorLog.txt` 的磁盘文件。（请参阅列表 13-4）中的构造函数代码）。该语句\n\n```\nsw = new\
  \ StreamWriter(Path.Combine(pathName, fileName), true);\n```\n\n调用了 `StreamWriter`\
  \ 构造函数来实例化 `sw` `StreamWriter` 对象。该构造函数是重载的，你在此使用的版本有两个参数。第一个参数 `Path.Combine(pathName,\
  \ filename)` 将 `pathname` 和 `filename` 合并形成单个参数。默认情况下，如果你没有为文件提供 `pathname`，C# 假设你希望将文件放置在与程序可执行文件相同的目录中。如果你将此程序存储在\
  \ C 盘名为 `TestCode` 的文件夹中，并将项目命名为 `ErrorLogger`，提供给构造函数的默认 `pathname` 将是\n\n```\n\
  \"C:\\TestCode\\ErrorLogger\\bin\\Debug\\ErrorLog.txt\"\n```\n\n第二个参数是一个值为 `true`\
  \ 的布尔值。如果第二个参数为 `true`，所有新文本数据都将追加到文件末尾。如果文件不存在，则创建该文件。如果第二个参数为 `false` 且文件存在，文件中任何当前数据将被覆盖。如果文件不存在且第二个参数为\
  \ `false`，则不会创建文件。\n\n\n\n\n再次，代码被封装在一个 `try-catch` 块中，以防止程序发生意外崩溃。程序构建路径和文件名，并将它们赋值给变量\
  \ `pfn`。然后代码使用 `File` 对象来判断该文件是否存在。（你可以直接使用 `File.Exists(pfn)` 而无需显式实例化，因为它是一个静态方法。）假设文件确实存在，你将实例化一个名为\
  \ `sr` 的 `StreamReader` 对象。`StreamReader` 类的 `ToEnd()` 方法读取文件中的所有字符串数据并将其赋值给 `buff`，然后将其返回给调用者。在代码中，你只需将字符串复制到\
  \ listbox 对象中即可。\n\n### 使用 clsErrorLog\n与你之前的程序程序不同，`clsErrorLog` 类本身实际上是有用的。如果你在代码中使用了\
  \ `try-catch` 块，或者使用 `if` 语句来感知异常之外的错误状况，你可以可以使用这个类来记录发生的情况。因为你可以自由传递任何所需的字符串，当发生特定错误时，其内容可以根据你的信息需求而变化。如果它出现在商业产品中，有人要求产品支持，你可以让调用者用记事本打开\
  \ `ErrorLog.txt` 文件，至少对哪里出了问题有个底。。诚然，程序很简单，但如果你需要，可以随时添加功能。这就是面向对象编程（OOP）的优点之一——你始终可以扩展类来适应你的特定需求。\n\
  \n***\n\n# 顺序访问文件与随机访问文件\n\n列表 13-3 和 13-4 中所示错误日志程序将文本数据写入名为 `ErrorLog.txt` 的磁盘文件。如果日志文件不存在，则会创建它并将新数据写入文件。如果文件存在且已存储了信息，则新数据将追加到现有文件的末尾。多年来，如果持续添加错误，该文件可能会变得很大。通常，读取文本文件时，读取程序从文件开始处一直读到文件末尾。\n\
  \n## 顺序文件\n\n不断向现有文件末尾添加新数据的过程创建了`顺序文件`。在顺序文件中，新数据被添加到文件末尾。数据之间没有间隙。事实上，顺序文件的优点之一是它们是密密的。也就是说，顺序文件中的每个字节存储空间都填充了一段信息。\n\
  \n顺序文件就像旧的磁盒音乐磁带。如果你喜欢磁带上的第 9 首歌，你必须快进磁带到那首特定的歌曲才能播放。如果你擅长这种操作，可以按下磁带播放机上的快进键，在脑中数出所需的秒数，然后按下播放键。通过练习，你可以接近你想要的歌曲。今天的\
  \ DVD 播放器让这种“定时搜索”显得很过时。你只需跳过不想听的曲目，立即开始收听选定的歌曲即可。\n\n如果你能将磁盘文件想象成音乐磁带，它看起来就像图 13.5\
  \ 所示。\n\n**图 13.5** 一个顺序数据文件\n\n![image](img/c13f005.jpg)\n\n图中首先注意到的点是，每首歌都可以比任何其他歌曲长或短。图\
  \ 13.5 中的 `BOF` 代表 `Beginning Of File`（文件开始），而 `EOF` 代表 `End Of File`（文件结束）。你可以将\
  \ `File Pointer` 视为磁盘硬件的陶瓷读写头。顺序文件从 `BOF` 到 `EOF` 顺序读取。因此，为了读取顺序文件，在打开文件时 `File\
  \ Pointer` 被放置在 `BOF` 处，随着文件的读取，它向 `EOF` 移动。要到达第五首歌，你必须读完前四首歌。（尽管快进键加快了速度，但你仍然必须读取中间的歌曲。）顺序文件在文件末尾写有一个\
  \ `EOF` 标记，因此程序代码可以感知到文件的结束。当 `File Pointer` 读取完整个文件并读到 `EOF` 标记时，你就知道文件的所有内容已读取完毕。\n\
  \n### 顺序文件的优缺点\n\n对于顺序文件，好消息是文件是密密的：它们没有浪费任何磁盘空间。坏消息是，你被迫读取不需要的数据以获取你实际上想要使用的数据。此外，编辑顺序文件中的信息充其量是笨拙的。在大多数情况下，编辑顺序文件的某部分意味着将旧文件读取到内存中，将到编辑点之前的旧文件信息重写到新文件中，将新信息写入新文件，然后将旧文件的剩余部分追加到新文件中。是的……它确实如描述的那样笨拙。\n\
  \n顺序文件通常用于很少需要编辑或更新的信息。电子邮件、错误日志、文档和类似类型的数据是顺序文件的良好候选者，因为它们的信息不经常更新。然而，业务交易通常涉及需要更新的信息，因此顺序文件并不适合这项。这就是随机访问文件的用场。\n\
  \n## 随机访问文件\n\n随机访问文件基于固定大小的概念。例如，当你打开商店账户时，它记录了你的姓名和地址等信息。由于这类信息频繁更新，软件工程师确保每个记录的大小相同。这在图\
  \ 13.6 中所示。\n\n**图 13.6** 一个随机访问数据文件\n\n![image](img/c13f006.jpg)\n\n图 13.5 显示的是长度不同的记录，而图\
  \ 13.6 中每个记录的字节长度是相同的。\n\n### 固定记录大小\n\n所以……那怎样。随机访问文件的优势是什么？你可以通过一个简单的示例看到优势。假设每个客户的信息占用\
  \ 300 字节。这意味着图 13.6 中的每个“信息块”长度均为 300 字节。每个信息块形成一个客户的 `record`（记录）。随机访问文件的优势在于，你可以拿起\
  \ `File Pointer` 并 `skip over` 你不想读取的四个块（即记录），然后将 `File Pointer` 落在第五块的精确起始。\n\n\
  C# 为你提供了一个名为 `Seek()` 的文件方法，允许你将 `File Pointer` 移动到文件中的任何所需位置。`Seek()` 方法可以几乎瞬间移动\
  \ `File Pointer`，速度比你通过读取当前位置与目标记录之间的记录来移动 `File Pointer` 快得多。`Seek()` 方法的通用语法如下：\n\
  \n```\n Seek((desiredRecord - 1) * RECORDSIZE, SeekOrigin.Begin);\n```\n\n\n\n\n\
  与计算机编程中的几乎所有情况一样，随机访问文件中的第一个记录实际上是记录 `0`。。因此，如果每个 `RECORDSIZE` 为 `300` 字节，且你想读取第五条记录，你需要将\
  \ `File Pointer`（文件指针）置在距离 `BOF`（文件开头）`1,200` 字节处。因为目标记录是第 5 号记录，其在文件中的实际位置的计算方式如下：\n\
  \n```\nSeek((desiredRecord - 1) * RECORDSIZE, SeekOrigin.Begin);\nSeek((5–1) * 300,\
  \ SeekOrigin.Begin);\nSeek(4 * 300, BOF);\nSeek(1200, BOF);\n``` \n\n你可以这样理解最后一条语句：“使用\
  \ `Seek()` 方法将 `File Pointer` 定位到相对于文件开头偏移 1,200 字节的位置。”该位置可以如图 13.7 所示。\n\n图 13.7\
  \ 使用 `Seek()`\n\n![image](img/c13f007.jpg)\n\n`Seek()` 方法的第一个参数是 `File Pointer`\
  \ 要移动的*字节偏移量*，用长数据类型表示。`Seek()` 的第二个参数是 `File Pointer` 移动的起始*相对位置*。`Seek()` 方法的第二个参数为移动\
  \ `File Pointer` 提供了三个相对点。\n\n第一个点 `SeekOrigin.Begin` 根据相对于 `BOF` 的字节偏移量来定位 `File\
  \ Pointer`。这如图 13.7 所示：`File Pointer` 相对于 `BOF` 偏移了 1,200 字节。\n\n其次，`SeekOrigin.Current`\
  \ 相对于 `File Pointer` 的当前位置移动它。例如，如果你已经读取了第 5 条记录，`File Pointer` 的当前位置将位于第 6 条记录的开头（相对于\
  \ `BOF` 偏移为 1,500 字节）。如果你现在想读取第 4 条记录，可以使用：\n\n```\nSeek(−600, SeekOrigin.Current);\n\
  ```\n\n由于字节偏移量是负值，`File Pointer` 将从其当前位置*向后*移动 600 字节，即到达第 4 条记录的开头。（在图 13.7 中字节偏移量为\
  \ 900。）因此，负偏移量意味着你想将 `File Pointer` 向 `BOF` 移动。\n\n`File Pointer` 的第三个相对点是末尾。语句\n\
  \n```\nSeek(0, SeekOrigin.End);\n```\n\n将将 `File Pointer` 置于文件末尾（EOF）。那么 `Seek(-300,\
  \ SeekOrigin.End)` 会将 `File Pointer` 置于何处？根据图 13.7，你的代码将准备好读取第 526 条记录。如果你仔细考虑，在使用\
  \ `SeekOrigin.End` 并读取文件时，使用正字节偏移量是错误的。正字节偏移量意味着你正尝试读取文件末尾之后的内容。同样，在用 `SeekOrigin.Begin`\
  \ 时使用负字节偏移量也是错误的。这会将 `File Pointer` 置于一个位于文件开头“之前”的位置。\n\n### 随机访问文件的优缺点\n\n随机访问文件最大的优势是，你可以比使用顺序文件快得多地访问特定记录。通常，会将客户在文件中的记录位置与该客户关联的某些唯一信息相绑定。例如，想象一个客户的姓\
  \ Smith。字母 S 的 ASCII 码是 83。因此，你可以将该客户写入文件的记录位置 83 处。如果每个记录是 300 字节，那么此人的信息将存储在相对于\
  \ `BOF` 偏移 24,900 字节的字节偏移处。这种使用一条信息（S）来推导出第二条信息（记录 83）的过程被称为*哈希*（hashing）。在随机访问文件内部为记录位置使用哈希算法可以使定位单个记录变得非常快。显然，如果文件中添加了第二个\
  \ Smith，就会产生*哈希冲突*（hash collision），哈希算法必须能够处理这种情况。（如果你感兴趣，C# 了一个了一个 `HashAlgorithm`\
  \ 类，你可以在自己的程序中使用它。更多详细信息请参阅在线帮助。）\n\n随机访问文件不仅在查找特定信息方面更好，在更新这些信息方面也更快。由于随机访问文件中的每条记录大小完全相同，你可以轻松地更新特定记录并重写该记录，而不需要复制整个文件。使用随机访问文件更新记录的速度要*快得多*，因为你只需要重写被修改过的记录。\n\
  \n随机访问文件的坏消息是，你必须根据最坏的情况来设计记录大小。尽管你知道大多数人的名字不会超过 10 个字符，但你可能需要为客户的名字设计足够的字节数。\n\n\
  \n\n\n\n![image](img/c13f009.jpg)\n\n用户界面中存在两个组框（groupbox）对象。第一个组用于通过文本框对象收集个人信息。第二个组框对象包含几个按钮对象，这些按钮可能用于在文件中存储的记录之间导航。\n\
