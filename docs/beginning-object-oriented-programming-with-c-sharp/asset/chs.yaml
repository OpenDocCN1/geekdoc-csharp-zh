  \    }\n```\n\n`getOneCard()` 方法设计用于返回牌片的索引而非其字符串表示。`getCardsLeftInDeck()` 方法简单地返回牌组中剩余牌片的数量。注意看为当前游戏进行这种更改是多么容易。如果你想一想，大多数牌游戏可能也需要这些方法。\n\
  \n尽管这个程序涉及的代码比你学过的要多，但你应该遵循每个方法的功能。然而，为了确保你确实理解代码中正在发生什么，请研究它，并在脑海中描述游戏进行时发生的情况。当你觉得理解了程序的执行流时，使用断点重新运行程序并单步执行代码，以查看你的预期与实际情况是否匹配。如果不匹配，你需要找出原因。这种练习可以帮助你培养调试技能……这正是下一章的主题。\n\
  \n# 总结\n\n在这一章中，你学习了属性方法（property methods）的细节以及它们如何作为类用户界面的一部分。属性方法中的 `set` 语句块是你防止类对象被置于意外状态的最后防线。你还应该更完整地理解类属性的私有（private）访问说明符如何帮助保护数据的完整性。\n\
  \n有人曾说过：“熟能生胜。”嗯，并不完全是。完美的练习才能带来完美的表现。然而，尽管编写完美的类可能是你的目标，但目前更合理的目标是获得为你自己创建的对象设计和编写类的经验。你现在已经熟悉\
  \ UML 类设计方法和侧向细化（Sideways Refinement）设计方法的优点。它们都是值得挂在你的工具带上的实用工具。\n\n在进入第 11 章之前，你应该花足够的时间回答章末的练习题。完成练习后，尝试构想几个自己设计的编程问题。思考编程问题、设计解决方案然后实现该解决方案是学习编程的唯一途径。\n\
  \n# 练习\n\n你可以在附录 A 中找到以下练习题的答案。\n\n**1.** 本章讨论的与 In Between 游戏类似的另一种游戏被称为 Acey-Deucey。这种游戏变体的玩法完全相同，但牌组中的最高牌是\
