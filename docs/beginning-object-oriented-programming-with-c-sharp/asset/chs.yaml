  \ 14.3 所示的屏幕。\n\n要向新数据库添加表，右键点击 `Database` 选项。你将看到当前服务器上所有可用数据库的列表。点击 `Cards` 数据库，显示将展开并向你展示与\
  \ `Cards` 数据库关联的所有对象。现在，右键点击 `Tables` 选项以查看如图 14.6 所示的选项。点击 `New Table` 选项。\n\n\
  当你点击 `New Table` 选项时（如图 14.6 所示），屏幕中间附近会打开一个新屏幕，类似于图 14.7。\n\n\n\n\n假设你想使用与第 13\
  \ 章中类似的字段，从电话簿数据库中检索姓和名。假设存储相关信息的表是 `Friends` 表。SQL 命令将编写如下：\n\n```sql\n SELECT\
  \ firstName,lastName FROM Friends\n```\n\n示例 `SELECT` 语句生成了一个包含数据库中所有人的姓和名的数据集。\n\
  \n你也可以使用通配符来代替 `fieldList`（字段列表）：\n\n```sql\n SELECT * FROM Friends\n```\n\n此 SQL\
  \ 查询返回了一个包含 `Friends` 表中每行所有字段数据的数据集……而这正是问题所在：数据集包含了数据库中的每一个人。大多数情况下，你只需要数据库的一个子集。也许是所有具有特定姓氏的人。或者可能是居住在某个邮政编码（ZIP\
  \ code）的人。因此，你需要一种方法来过滤 `SELECT` 查询返回的数据集。\n\n## WHERE 谓词\n\n你可以使用 `WHERE` 谓词来过滤从数据库返回的数据集。例如，查询语句\n\
  \n```sql\n SELECT firstName,lastName FROM Friends WHERE Zip = 45245\n```\n\n返回了一个数据集，包含了所有居住在\
  \ `45245` 邮政编码的人的姓和名。你也可以对 `WHERE` 谓词应用基础条件操作符，例如：\n\n```sql\n SELECT firstName,lastName\
  \ FROM Friends WHERE Zip > 46214 AND Zip < 46254\n```\n\n这能够形成限制较少的数据集。在此查询中，显示了数据库中所有居住在\
  \ `46215` 到 `46253` 邮政编码的人。\n\n## ORDER BY 子句\n\n`ORDER BY` 子句允许你将数据集重新组织为升序或降序。例如，查询语句\n\
  \n```sql\n SELECT * FROM Friends WHERE Zip = 80120 ORDER BY lastName\n```\n\n返回按\
  \ `lastName` 字段升序排序的数据集。如果你想要相同的列表，但按降序排列，则应该使用\n\n```sql\n SELECT * FROM Friends\
  \ WHERE Zip = 80120 ORDER BY lastName DESC\n```\n\n注意 `SELECT` 语句末尾的 SQL 关键字 `DESC`。显然，使用\
  \ `ORDER BY` 子句的默认排序是升序。如果你不使用 `ORDER BY` 子句，数据集将按照从数据库中读取的顺序返回数据。\n\n最后，正如提到的，大多数程序员在查询中会将\
  \ SQL 关键字大写。另一种在格式化 SQL 查询时常用的流行风格是这种：\n\n```sql\n SELECT *\nFROM Friends\nWHERE\
  \ Zip = 80120\nORDER BY lastName\nDESC\n```\n\n这种格式将所有 SQL 操作符单独放在一行，并将实际的数据库参数放在相应的\
  \ SQL 操作符的右侧。使用任何你认为合理的格式……选择权交给你。\n\n## 聚合函数\n\n某些数据库操作是非常常见的，以至于 SQL 提供了称为“聚合”（aggregates）的方法来对数据库执行特定计算。大多数数据库至少支持表\
  \ 14.4 中找到聚合函数。\n\n**表 14.4** 聚合 SQL 类型\n\n| **聚合名称** | **描述** |\n| :--- | :---\
  \ |\n| AVG | 返回选择字段的数值平均值：`SELECT AVG(Age) FROM Friend` 假设字段 `Age` 拥有每个人的年龄，这会返回这些人的平均年龄。\
  \ |\n| COUNT | 返回选择字段中找到的项目数量：`SELECT COUNT(lastName) FROM Friend WHERE Status =\
  \ 1` 这告诉我们 `Friend` 表中有多少个活跃用户。 |\n| MIN | 寻找字段中的最小值：`SELECT MIN(Age) FROM Friend`\
  \ |\n| MAX | 寻找字段中的最大值：`SELECT MAX(Age) FROM Friend` |\n| SUM | 返回字段中值的和：`SELECT\
  \ SUM(Status) FROM Friend` 如果 `Status` 对活跃朋友为 1，对非活跃朋友为 0，则这将返回表中活跃用户的人。 |\n\n聚合方法并不能为你提供任何你无法通过其他（多个）SQL\
  \ 查询自行构建的内容。然而，它们确实让此类信息的获取变得更容易。\n\n你可以使用一些 SQL 命令来创建新数据库、向数据库添加新表，以及用于填充这些表的字段。换句话说，你可以使用\
  \ SQL 来完成你刚刚才用 SQL Server Management Studio 完成过的操作。然而，如果没有必要，何必重复轮子呢？再次，如果你愿意，有几十个在线网站可以帮助你学习所有的\
  \ SQL 命令。\n\n这就是你目前需要的所有内容！你会惊讶于通过这些简单命令构建查询，用数据库可以完成多少工作。在接下来的章节中，你将创建一个简单的 MDI\
  \ 程序，允许你操作数据库并生成关于数据库内容的一些简单报告。\n\n# 一个 DBMS 系统\n\n在本节中，你将使用学过的某些 SQL 命令编写一个程序，用于管理你刚刚创建的小型数据库。该程序使用你在上一节中学到的\
  \ MDI 将所有的数据库活动整合到一个程序中。正如上一节所过的，该程序的通用用途是跟踪你与朋友交换的各种卡片（例如生日、周年纪念日、圣诞节等）。\n\n[content]\n\
  在本节中，你将使用学过的某些 SQL 命令编写一个程序，用于管理你刚刚创建的小型数据库。该程序使用你在上一节中学到的 MDI 将所有的数据库活动整合到一个程序中。正如上一节所过的，该程序的通用用途是跟踪你与朋友交换的各种卡片（例如生日、周年纪念日、圣诞节等）。然而，你可以轻松地重新设计该程序以满足你的喜好。对于任何需要对人员列表（例如成员列表或书俱乐部）执行任务的情况，它都是合适的起点。如果你决定采用另一个程序，请阅读本章的剩余部分，然后设计你需要的对象，最后创建你需要的数据库和相关表。\n\
