  \n### 工作原理\n\n如果你仔细查看 图 2.8，你会发现你不*应该*选择 Windows Forms Application 模板（即列表中的第一个选项），就像你在第\
  \ 1 章中做的那样。相反，你应该点击 `Visual C#` → `Windows` ，然后选择 `Empty Project` 模板。你这样做是因为使用空项目模板会让\
  \ Visual Studio 在“背后”生成的代码比 Windows Application 模板更少。这是好消息。坏消息是，使用空项目模板确实需要你比其他可能的情况多做一些前期工作。\n\
  \n虽然让你编写 Visual Studio 可以替你编写的代码看起来很愚蠢，但使用空项目模板更符合你的需求。本章（以及后续章节）的目标是教导*你*如何编写面向对象的程序。Visual\
  \ Studio 已经知道如何做这一点，而我假设你还！换句话说，使用空项目模板让我能够更好地教你如何编写自己的程序。我的哲学是，如果你必须亲自动手，你会学得更多。（另外，如果你正在用这本书学习\
  \ OOP，但使用的是不同的语言（例如 Java），这种方法可以让你使用该语言变得稍微简单一点。）\n\n如果你双击表单上的空白处，Visual Studio\
  \ 将你从设计视图切换到代码视图。如果你仔细观察，可以通过点击加号 (`+`) 展开 `#region Windows` 部分，并看到如下代码：\n\n```\n\
  \ this.label1 = new System.Windows.Forms.Label();\n```\n\n这行代码负责使用与你之前看到的类似的语法创建一个名为\
  \ `label1` 的新标签对象：\n\n```\n clsPerson myFriend = new clsPerson();\n```\n\n唯一的区别是关键字\
  \ `this` 是 `System.Windows.Forms.Label` 标签对象全限定名称的简写形式。换句话说，该语句只是简单地在你的表单上创建一个标签对象。你看到的其他一些行代码决定了你放置标签的位置以及与标签对象相关的其他开销信息。\n\
  \n现在，点击源代码窗口的 `frmMain.cs` `[Design]` 选项卡，让表单重新出现。点击标签对象，注意属性窗口出现在显示器的右下侧。转到属性窗口中的\
  \ `Text` 属性，双击 `label1` 并将其更改为 `Name:`。如果你现在点击 `frmMain.cs` 选项卡，你会发现其中一行代码已经发生了变化：\n\
  \n```\nthis.label1.Text = “Name:”;\n```\n\n这意味着什么？因为你更改了标签对象的 `Text` 属性，所以你更改了标签对象的状态。因为你将标签放置在表单对象上，你也更改了表单对象。因此，在表单上丢入对象会改变表单对象的状态。同样，更改这些对象的任何属性也会更改对象本身的状态以及持有这些对象的表单的状态。\n\
  \n现在转到文本框对象并拖动文本框使其与标签对象对齐。现在双击按钮对象。Visual Studio 会自动将你切换到源代码窗口，你可以看到这段代码：\n\n```\n\
  private void button1_Click(object sender, EventArgs e)\n{\n}\n```\n\n这是按钮对象的*存根代码*（stub\
  \ code）。现在，在存根代码的括号之间添加以下行代码：\n\n```\nfrmMain.ActiveForm.Text = textBox1.Text;\n\
  ```\n\n这行代码是了什么？因为赋值运算符 (`=`) 会获取右侧的数据并将其分配给左侧的对象，因此该语句简单地将你在文本框中输入的任何内容移动，并使其成为表单的标题，`frmMain.ActiveForm.Text`\
  \ 让你进入该对象以便访问你感兴趣的属性。\n\n\n\n\n通过这种实验是观察各种属性的更改如何影响程序的极佳方法。如果你像大多数初级程序员一样，可能会有点担心会“弄坏”某些东西。不用担心。你可能会得到一个难看的表单，或者发生其他奇怪的事情，但这些都不是你通过简单地将属性重置为原始值无法修复的。因此，最好“一次只”修改一个属性，这样你就能确定该更改的影响，并且在需要时将属性恢复到原始状态。请……尽情在这个简单的程序中进行实验并享受其中吧。\n\
  \n尽管你刚刚编写了一个完整的 Windows 程序，但它只是一个我随手拼凑出来的简单程序。在现实生活中，编程任务很少会这么简单。\n\n#制定程序计划\n\n\
  现在，将你目前所学的知识应用于程序设计中。由于需要，你可以遗漏一些本可以让你的小程序变得更健壮的代码，这仅仅是因为你还没有学会如何做这一点。（你很快就会学会如何让程序更健壮了。）这里的目标是教你如何开始编写程序来解决特定任务。\n\
  \n## 从何开始？程序的五个步骤\n\n毫无疑问，初级程序员最难理解的问题之一就是从哪里开始编写程序。作为一般规则，当我布置课堂编程作业时，大多数学生解决程序问题的第一步是从工具箱中将控件拖放到表单上，并以此开始编写程序。\n\
  \n错了！\n\n不要将“移动操作”等同于“解决问题”。如果你在没有连贯计划的情况下到处拖放对象，你将面临一些意料之外的失望。你不可避免地最终会回头来，并为当前任务制定一个攻击计划，因此还不如从一开始带着计划开始。\n\
  \n事实上，要编写良好的程序必须有一个计划。程序计划的核心是算法。`algorithm` 简单来说就是一个步骤步骤的配方或计划，说明了你想要如何解决手头的编程任务。制定程序计划的一个良好起点是程序的五个步骤。\n\
  \n### 程序的五个步骤\n\n从广义上，可以用五个步骤来描述所有的编程问题。\n\n#### 第一步：初始化 (Initialization)\n\n初始化步骤涉及在用户在屏幕上看到任何显示之前要完成的工作。例如，某些程序会“记住”你用该程序处理过的最后四个五个文件，并将这些文件名附加在\
  \ `File` 菜单的末尾。Microsoft Word、`Excel`、`PowerPoint`、`Visual Studio` 以及其他程序都以这种或那种方式这样做。显然，这些程序在屏幕上显示\
  \ `File` 菜单之前，必须从某个地方读取这些信息。\n\n同样，程序在用户看到屏幕上显示任何内容之前，可能会建立网络连接、初始化打印机、连接数据库、读取传感器或执行各种其他活动。所有这些活动都归类在初始化步骤中。\n\
  \n简单来说：\n\n初始化步骤负责建立程序运行的环境。\n\n初始化步骤的活动发生在用户看到屏幕上出现任何内容之前。\n\n#### 第二步：输入 (Input)\n\
  \n如果你仔细考虑，所有的程序都会接收某种形式的输入，以某种方式对其进行处理，然后显示从原始输入派生的数据的变体。因此，输入步骤关注如何将这些输入到程序中。\n\
  \n大多数时候，你倾向于认为程序输入来自键盘或鼠标。然而，输入也可以来自许多其他输入源。例如引擎传感器、条形码器、视网膜扫描仪、网络连接、火灾或烟雾报警传感器、来自数据库的信息或其他许多输入设备。然而，输入步骤的重要方面是数据以某种形式被程序收集起来。\n\
  \n验证输入数据始终是一个良好习惯。用户在输入数据时确实会出错，网络连接有时会发生怪事，数据源可能会被锁定，其他意外情况可能会损坏数据。你将在后面的章节中学习更多关于数据验证的知识。现在，我假设用户是非常聪明的，永远不会犯打字错误，而且所有硬件都在完美运行！（这个假设让你能够专注于程序中所使用的对象的本质上。）\n\
  \n#### 第三步：处理 (Process)\n\n在这一步中，你获取程序输入并以某种方式对其进行处理。你可能会对它们执行某种数学运算，或者输入可能是客户的姓名和账号，此步骤读取数据库以计算发送给客户的账单。在喷气式飞机中，输入可能是当前的空速和\
  \ GPS 坐标，用于计算飞机何时将降落在特定的机场。在所有情况下，处理步骤都涉及获取输入、对其执行操作并产生某种形式的结果或答案。\n\n“获取输入并对其进行操作”是什么意思？这个句子片段应该让你的脑后勺感到发痒。你如何称那些获取对象数据并对其进行操作的东西？没错……方法\
  \ (methods)！因此，处理步骤经常使用类方法来转换由输入步骤提供的数据。嗯？难道处理步骤中使用的数据可能是由类的属性提供的吗？\n\n你必须记住，通常可以使用多种\
  \ `methods` 来获取相同的输入、处理它们并产生相同的答案。正就像你可以找到多种从纽约飞到洛杉矶的方法（例如直飞，或经由芝加哥、丹佛或休斯顿），结果是一样的：你最终到达洛杉矶。同样，你可以使用不同的算法将相同的输入引入程序，以不同的方式处理它们，但生成相同的结果。例如，有几十种不同的算法可以使用计算机对数据排序。然而，正如你在后续章节中看到的，某些算法比其他算法高效。始终对完成旧任务的新方法保持开放。\n\
  \n#### 第四步：显示 (Display)\n\n显示步骤负责显示处理步骤产生的结果。通常，这意味着在显示器上显示结果，但也存在其他选择。也许意味着跳过显示器，只需打印账单并邮寄给客户。或者程序负责更新数据库中的客户记录。许多程序会自动运行（称为\
  \ `batch programs` 批处理程序），在运行时不在屏幕上显示任何内容，也不会向用户请求任何输入。相反，批处理程序通常在预定的时间（也许在凌晨 1\
  \ 点没有其他人使用系统时）自动启动，从某些输入源（如数据库）读取输入信息，并根据输入信息生成报告。\n\n显示步骤并不总是意味着你“看到”结果在屏幕上显示。有时程序的结果会被传递给另一个进程，或者数据库、网站，甚至自动发送电子邮件。关键在于你已经使用输入产生了某种新东西，并且你想“查看”、“使用”或“保存”这个新结果。然而，对于你在使用本书期间编写的大多数部分程序，显示步骤确实通过显示设备向用户展示某些信息。\n\
  \n#### 第五步：终止 (Termination)\n\n\n\n终止（Termination）步骤并不意味着你简单地结束程序。它也意味着在程序运行结束后进行“清理”。例如，如果初始化（Initialization）步骤读取了程序中使用的四个最新文件，并将它们附加到“文件”菜单中，那么这一步骤就需要更新这些文件名，以反映用户在程序当前会话期间进行的操作。如果初始化步骤设置了打印机或数据库连接，那么这一步骤应该关闭该连接。\n\
  \n通常情况下，初始化步骤中执行的任何操作都会终止步骤中被“撤销”。最后，终止步骤应该为程序提供一个优雅的退出，即使在程序运行过程中发生了错误。（你将在第 11\
  \ 章中学习更多关于规划错误情况的内容。）\n\n# 使用对象创建简单应用程序\n\n现在使用你刚刚学习的“五个程序步骤”来设计并编写一个简单的程序。程序的目标是收集用户的地址信息，然后简单地将这些信息显示为邮件标签的形式。目前你不会对这些信息进行任何实际操作，但在掌握了更多的\
  \ C# 编程之后，你可以将此程序作为某些大型任务任务输入处理，例如创建客户账户或编写你自己的个人邮件列表。然而，这里的主要目标是让你额外获得使用作为 Visual\
  \ Studio 和 .NET 部分提供的一些对象的经验。\n\n## 使用程序步骤创建程序计划\n\n你的第一个任务是制定一个解决手头任务的计划。制定计划的良好起点是前面提到的五个程序步骤。\n\
  \n### 步骤 1：初始化 (Initialization)\n\n这是一个简单的程序，你实际上不需要进行任何花哨的初始化。任何必要的初始化任务都由 Visual\
  \ Studio 自动为你完成。稍后我们会查看 Visual Studio 的后台工作。\n\n### 步骤 2：输入 (Input)\n\n在这一步骤中，你必须问自己：“我需要什么信息来解决手头的编程任务？”因为你想像邮件标签那样安排用户信息，所以你需要知道用户的：\n\
  \n*   姓名\n*   街道地址\n*   城市\n*   州/份\n*   邮政编码（ZIP 或 postal code）\n\n你可以编写程序，并将每项数据的值直接**硬编码（hard-code）**在程序中。当你向程序中\
  \ `hard-code` 一个值时，意味着你将该值设为程序本身的永久组成部分。如果你为此程序硬编码数据，你编写的程序代码将把用户的姓名和地址作为数据直接嵌入程序中。然而，直接将值硬编码到程序中会使程序比其他情况下缺乏灵活性。例如，每当你想要为新用户生成邮件标签时，你都需要在显示信息之前向程序代码中写入新的数据值。这并不好。\n\
  \n一种更灵活的方法是让用户在程序运行时输入必要信息，并在他们完成后将信息显示为邮件标签。在他们输入信息后，你可以安排数据以显示在屏幕上。实现这种方法最简单的方法是针对你想要收集的每项信息（或输入）使用\
  \ `label`（标签）和 `textbox`（文本框）对象。当用户认为他已输入了所需信息时，他可以点击按钮将信息以邮件标签的形式显示出来。\n\n####\
  \ 为输入步骤设计程序用户界面\n\n在这个程序中，你决定使用标签和文本框来收集用户的信息。标签有助于告知用户你正在请求的数据，而文本框为他提供了输入答案的手段。这些标签和文本框成为你程序用户界面的一部分。程序的\
  \ `user interface`（用户界面）简单指的是程序与运行程序的用户交互的方式。在这个程序中，用户界面由排列在表单（form）上的标签、文本框和按钮组成。\n\
  \n关于如何设计良好的用户界面已经写了许多书籍。虽然本章无法完全涵盖用户界面设计这一主题，但请考虑以下指南：\n\n*   **遵循 KISS 原则（简单简单，傻瓜）**。这意味着你应该让用户界面尽可能简单，同时仍以最小的输入错误概率获取所需的信息。如果向表单中添加对象对程序功能没有贡献，请克制添加这些对象的冲动。\n\
  *   **使用熟悉的界面**。例如，在这个程序中，你向用户索要地址信息。用户很有可能填过拆封杂志的订阅表，或填过要求提供地址信息的执照表。尝试以用户可能已经熟悉的方式来建模你的界面，或者尽力让一个不熟悉的用户界面易于理解。\n\
  *   **用户界面应该具有自然的流向**。在 Windows 程序中，`Tab 键` 用于从一个输入字段移动到下一个。让用户输入姓名，在按下 `Tab 键`\
  \ 后跳转到邮政编码字段，让他输入值，然后跳回地址字段，这并没有太大意义。如果程序从姓名字段到地址字段、再到城市字段、州字段，以此类推，这种流向对用户来说更符合逻辑。同样，英语用户从左上到右下阅读，而中文读者从右上到左下进展。因此，即使是语言和文化因素也会影响用户界面的流向。简单来说，用户界面的流向应该是直观且符合逻辑逻辑。\n\
  *   **不要在程序中使用任何 GWF（惊叹因素）**。`Gee-Whiz Factor`（惊叹因素）指的是你可能做的任何用户界面更改，这些更改除了让用户说出“哇！”之外没有其他用途。初级程序员经常更改标签和文本框的背景颜色，将字体颜色改为紫色，并进行其他除了显示他们知道如何进行此类更改之外、对用户界面没有增加任何有用帮助的改动。然而，事实仍然是，微软在测试对象的颜色、形状和其他默认属性值上花费的研发费用，可能比你一生所赚的钱还要多。因此，没有什么理由不接受这些研究的结果。\n\
  \n始终记住，用户界面的目标是让用户轻松运行你的程序。尝试从用户的角度让用户界面变得直观且易用。\n\n### 步骤 3：处理 (Process)\n\n在这一步骤中，你设计产生程序预期结果的算法。此程序的预期结果简单来说是以邮件标签格式显示用户信息。输入步骤通过你设计的用户界面为你提供所需的信息。因此，为了实际开始处理步骤，你需要一个按钮（例如显示按钮），以便程序知道所有输入数据都已输入，并可以开始处理手头任务。\n\
  \n#### 事件驱动程序\n\n微软 Windows 程序是事件驱动的。`event-driven program`意味着某些代理（如用户）必须产生某种类型的事件，程序才能执行下一个程序任务。例如，在这个程序中，如果用户不以某种方式与程序交互，程序将乖乖地在那里等待直到她操作。在你的程序中，用户必须点击显示按钮来触发与处理步骤关联的事件。\n\
  \n\n\n人类操作并不是触发 Windows 事件的唯一方式。例如，程序可能会持续监控时间，当到达某个特定时间时，程序会触发一个事件，导致该程序执行某些操作。火灾传感器可能在那里监测多年火灾传感器，而从不触发事件。但当火灾传感器确实触发事件时，警报会响，喷淋会开启，并发出自动电话通知。然而，对于你在本书中编写的大多数程序，用户会提供活动（例如鼠标点击或击键）来触发\
  \ Windows 事件。\n\n该程序的 `Process` 步骤简单地是将用户输入的信息以地址标签的形式排列。点击按钮事件会触发 `Process` 步骤，并通知程序所有必要数据都已输入并准备好使用。（假设用户在所有数据输入之前不会触发该事件。记住，我们的用户是聪明的。）\n\
  \n### 4: 显示\n\n在程序程序中，你只需将用户的姓名和地址信息作为邮寄标签显示出来。\n\n### 5: 终止\n\n由于你没有在 `Initialization`\
  \ 步骤中编写任何复杂的处理代码，因此你需要在 `Termination` 步骤中执行任何操作来清理并优雅地结束程序。相反，你只需要让一个按钮对象（如退出按钮）供用户点击以结束程序即可。\n\
  \n现在你有了一个基于“程序五步骤”的计划。规划不需要你进行任何编程。然而，跳过这个规划过程是所有程序员都会犯的错误，包括经验丰富的程序员。\n\n尽管如此，你们很多人会像我的大多数学生一样：在没有制定任何计划的情况下就冲向前……这也可以。但是，你最终必须制定一个程序计划，而在开始时这样做总是快的。\n\
  \n现在，你只需要实现你的计划了。\n\n# 使用 C# 实现你的程序计划\n\n现在你已经有了计划，需要编写程序代码来解决眼下的任务。你将通过结合使用 `Visual\
  \ Studio` 和 `.NET` 提供的对象以及你自己的 `C#` 程序逻辑来完成。这对你来说并不困难，因为……你有一个计划！因为从计划开始而不是简单地将对象拖放到表单上，这让你比大多数大多数初级程序员领先几个光年。\n\
  \n诚然，你很快也会开始向表单上拖放对象，但你处理问题的方法是不同的。你的拖放是有方法的……它是由“计划”引导的。许多初级程序员往往在没有计划的情况下就开始向表单上拖放标签和文本框。然而，没有计划的移动产生的热比光多。因此，要学习的教训是：\n\
  \n永远不要在没有计划的情况下编写程序代码。\n\n虽然你在第一章中执行了后续几节中介绍的某些步骤，但你并没有学习为什么要执行这些步骤。此外，现在你对 `OOP`\
  \ 有了一些理解，你的做事方式会有所不同。在接下来的“尝试一下”中，你将开始。\n\n注意：在本章前面，你了解到 `.NET` 有大约 4,000 个可供程序使用的类。虽然所有这些类对你都可用，但你实际上并不需要在在一个项目中使用全部\
  \ 4,000 个类。因此，`Visual Studio` 允许你指定想要在程序中使用的引用类类别。在本节中，你将看到如何选择想要包含在当前项目中的类组。\n\n\
  ### 尝试一下：创建一个新的 C# 项目 (Chapter02Program01.zip)\n\n你的第一个任务是为邮寄标签程序创建一个新的 `C#` 项目。\n\
  \n1. 使用在本章之前讨论过的 `File` → `New Project` → `Visual C#` → `Windows` 菜单序列（参考图 2.8）。\n\
  2. 为项目添加程序引用。使用 `Project` → `Add Reference` 菜单序列显示 `Add Reference` 对话框。现在点击 `Assemblies`\
  \ → `Framework` 选项以获取可用程序集列表。图 2.11 显示了 `Add Reference` 对话框的样子。在图中，选中了 `System`\
  \ 程序集，它是所有 Windows 系统引用的基础，这会将所有处理 Windows Forms 对象的类都引入到你的程序中。点击 `Add` 按钮将该程序集添加到你的程序中。\n\
  \n图 2.11: 选择程序引用\n\n![2.11](img/c02f011.jpg)\n\n你可以只需通过点击想要包含在项目中的每个引用的复选框从列表中选择额外的引用。你需要的引用是：\n\
  \n* `System`\n* `System.Drawing`\n* `System.Windows.Forms`\n\n你编写的几乎每个程序都会添加这三个引用。选择这三个引用后，点击\
  \ `OK` 按钮。你应该在 `Solution Explorer` 窗口的 `References` 标题下看到选中的引用。如果没有看到所有三个引用，返回 `Add\
  \ Reference` 对话框并选择缺失的引用。\n\n**3.** 向项目添加新项。现在你需要创建一个表单对象，用于存放你想在程序中使用的（标签、文本框和其他）对象。使用\
  \ `Project` → `Add New Item` 显示 `Add New Item` 对话框。（你需要滚动对话框列表以找到 `Code File` 选项。）图\
  \ 2.12 显示了此对话框。\n\n\n\n\n\n![2.12](img/c02f012.jpg)\n\n向下滚动模板对象列表，直到在可用模板列表中看到 `Code\
  \ File`，然后在对话框底部的 Name（名称）文本框中输入 `frmMain.cs`，如图 2.12 所示。点击 `Add`（添加）按钮。（“cs”后缀会让\
  \ Visual Studio 识别该文件为 C# 源代码文件。）\n\n你现在应该能从解决方案管理器（Solution Explorer）中看到 `frmMain`。此外，源代码窗口（Source\
  \ Window）顶部现在多了一个标记为 `frmMain.cs` [Design] 的新标签页。此时，源代码窗口显示一个空白表单。\n\n如果双击空白表单，将创建一个名为\
  \ `frmMain.cs` 的新标签页，你可以看到 Visual Studio 为你创建的一些代码。高亮显示的所有代码并按 `Delete` 键从表单中删除代码。（如前所述，高亮代码最快的方法是\
  \ `Ctrl-A`。）\n\n### 4. 向 `frmMain` 对象添加程序代码。\n\n你在阅读本书期间创建的几乎每个程序都以完全相同的程序语句开头。这些程序语句与本章早些列表\
  \ 2-1 中所示完全相同。如果你按照建议将这些语句保存到了 C# 模板文件中，只需将这些行代码剪切并粘贴到 `frmMain.cs` 的源代码窗口中。\n\n\
  ### 5. 设置项目属性。\n\n你现在应该设置控制程序执行环境的属性。选择 `Project` → `Chapter02Program01` 菜单序列。该对话框与你在图\
  \ 2.10 中看到的相同。\n\n由于你想让程序作为 Windows 运行，请从 `Output Type`（输出类型）选项选择 `Windows Application`。接下来，将\
  \ `Startup Object`（启动对象）设置为包含 `Main()` 方法的对象。如第 1 章所述，每个 C# 程序都必须有一个 `Main()` 方法，因为正是\
  \ `Main()` 方法告诉 Visual Studio 从何处开始执行程序。如图 2.11 中所示，是 `frmMain` 对象包含了 `Main()` 方法。从启动对象列表中选择\
  \ `frmMain`。\n\n### 6. 删除设计代码。\n\n由于是你自己控制程序代码而不是依赖 Visual Studio，你可以删除 `frmMain.Designer.cs`\
  \ 源代码文件。你可以通过将光标移动到解决方案管理器窗口并点击 `frmMain.cs` 文件前的小三角形来找到该文件。右键点击 `frmMain.Designer.cs`\
  \ 文件名，并选择 `Delete`（删除）选项。系统会提示你是否要从项目中删除该文件。点击 `OK`。\n\n在解决方案管理器窗口中，右键点击 `frmMain.cs`\
  \ 文件，将呈现出一系列选项，如图 2.13 所示。点击 `View Designer`（查看设计器）选项。这将导致空白表单重新出现在源代码窗口中，如图 2.14\
  \ 所示。\n\n图 2.13: 从解决方案窗口中选择 View Designer\n\n![2.13](img/c02f013.jpg)\n\n图 2.14:\
  \ 设计器视图\n\n![2.14](img/c02f014.jpg)\n\n你现在准备好开始向表单添加对象了。\n\n### 7. 向 `frmMain` 对象添加对象。\n\
  \n如果你正确执行了操作说明，你的屏幕看起来应该类似于图 2.14。你现在可以将各种程序对象添加到表单中了。\n\n表 2.2 展示了你应该放置在表单上的每个对象的对象和属性值。（你需要滚动属性窗口来找到某些属性。）\n\
  \n表 2.2 对象及其属性值\n\n| 对象名称 (Object Name) | 属性名称 (Property Name) | 属性值 (Property Value)\
  \ |\n| :--- | :--- | :--- |\n| frmMain | Text | Mailing Label Program |\n| | StartPosition\
  \ | CenterScreen |\n| label1 | Text | Name: |\n| | AutoSize | False |\n| | BorderStyle\
  \ | Fixed3D |\n| | Size | 75, 20 |\n| label2 | Text | Address: |\n| | AutoSize |\
  \ False |\n| | BorderStyle | Fixed3D |\n| | Size | 75, 20 |\n| label3 | Text | City\
  \ |\n| | AutoSize | False |\n| | BorderStyle | Fixed3D |\n| | Size | 75, 20 |\n\
  | label4 | Text | State |\n| | AutoSize | False |\n| | BorderStyle | Fixed3D |\n\
  | | Size | 75, 20 |\n| label5 | Text | ZIP |\n| | AutoSize | False |\n| | BorderStyle\
  \ | Fixed3D |\n| | Size | 75, 20 |\n\n\n\n\n\n![2.16](img/c02f016.jpg)\n\n## 工作原理\n\
