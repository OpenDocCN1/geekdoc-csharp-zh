  \n本章扩展了继承的概念。虽然你从第一章开始就在使用继承，但对其并没有过多论述。推迟的原因是因为在你理解并欣赏 OOP（面向对象编程）之前，继承并没有太大意义。我猜你已经看到了\
  \ OOP 带来的价值，并准备好深入研究继承这一主题。在本章中，你将学习使用继承所需的细节。\n\n在阅读本章时，请记住继承是为了让生活更简单。\n\n# 什么是继承？\n\
  \n到为止，继承一直在后台运行，在你设计程序时都让生活更简单。上一个语句中的冒号可以口语化为“继承自”。\n\n```\npublic class Main :\
  \ Form\n```\n\n继承的概念建立在许多对象共享属性的基础上。在上一个语句中，你声明要创建一个类。\n\n## 继承示例\n\n很久以前，我受雇为一个房地产投资者编写一个程序。该投资者购买的房地产类型可以分为公寓、商业地产（如小型购物中心）和住宅。我与投资者坐在一起，让她描述她需要跟踪的投资信息类型。表\
