  \n# 在代码中做出决策\n\n**你将在本章中学到：**\n\n* 关系运算符\n* 比较值类型\n* 比较引用类型\n* `if` 和 `else` 关键字\n\
  * 级联 `if` 语句\n* 逻辑运算符\n* `switch`、`case`、`break` 和 `default` 关键字\n* 数据验证\n\n本章的代码下载。\n\
  \n你可以在下载代码选项卡中找到本章的代码下载。`Chapter06` 文件夹中的代码根据本章中的名称单独命名。\n\n\n\n\n\n参考表 6.1，每个示例在关系运算符的左侧有一个操作数（15），在运算符的右侧有第二个操作数（20）。同样，关系运算符的使用与两个操作数相关联，因此所有关系运算符都是二元运算符。因此，使用关系运算符结合两个操作数会得到一个`关系表达式`。\n\
  \n每个关系表达式最终都会解析为逻辑真（True）或逻辑假（False）状态。在 C# 中，逻辑真和逻辑假表示为布尔值（boolean values）。布尔表达式的结果解析为\
  \ C# 关键字 `true` 或 `false`。参考表 6.1，第三列中显示的每个示例都解析为第四列中所示的状态。在表中，使用字面量仅仅是为了让关系表达式更加具体。然而，在编程场景中，关系表达式中的操作数通常是变量而不是字面量。\n\
  \n## 使用关系运算符——if 语句\n\n现在考虑你学到的关于关系运算符的知识，并将它们应用于 C# 的 if 语句中。虽然你已经在之前的章节中看到了 if\
  \ 语句的几个示例，但还没有解释它们的工作原理。这正是本节的目的。\n\nif 语句的语法形式如下：\n\n```cpp\n if (expression1)\n\
  {\n     // 逻辑真：if 语句块\n}\n```\n\n`expression1` 出现在 `if` 关键字后的左括号和右括号之间。通常，`expression1`\
  \ 代表要执行的关系测试。参考表 6.1，关系表达式的结果是逻辑真或逻辑假。出现在两个大括号之间的代码被称为 `if 语句块`。如果 `expression1`\
  \ 的求值为逻辑真，则执行 if 语句块。如果 `expression1` 的求值为逻辑假，程序控制流将跳过 if 语句块，并在 if 语句块右大括号之后的下一语句处恢复程序执行。你可以在图\
  \ 6.1 中根据 `expression1` 的结果看到程序的流向。\n\n图 6.1 if 语句块\n\n![image](img/c06f001.jpg)\n\
  \n让我们通过一个简单的程序来测试你对 if 语句原理的理解，该程序判断用户输入的数字是奇数还是偶数。\n\n***\n\n**尝试一下：测试奇偶数（Chapter06ProgramOddEven.zip）**\n\
  为了说明 if 语句的用法，请考虑图 6.2 所示的程序。\n\n**1.** 如第 2 章所示，使用 C# 模板创建一个新项目。\n**2.** 添加两个标签（label）对象、一个文本框（textbox）对象和两个按钮（button）。\n\
  **3.** 按你的意愿设置对象的属性。图 6.2 是你可能会使用的一种用户界面。\n**4.** 添加按钮点击事件代码，如列表 6-1 所示。\n\n图 6.2\
  \ 用于判断奇偶数的 if 程序\n\n![image](img/c06f002.jpg) 用户输入一个数字，程序根据其值告诉该数字是奇数还是偶数。程序还应该检查用户输入的数字是否为有效的数字字符序列。字母\
  \ O 就在数字字符零（`0`）的下方，有时急忙的人会按错键。\n\n列表 6-1：`btn_Click` 事件代码（frmMain.cs）\n\n```cpp\n\
  \ private void btnCalc_Click(object sender, EventArgs e)\n  {\n    bool flag;\n\
  \    int val;\n    string output = \"Number is even\";\n\n    // 将文本转换为数字\n    flag\
  \ = int.TryParse(txtNumber.Text, out val);\n    if (flag == false)\n    {\n    \
  \  MessageBox.Show(\"Not a number. Re-enter.\");\n      txtNumber.Clear();\n   \
  \   txtNumber.Focus();\n      return;\n    }\n\n    // 查看是奇数还是偶数\n    if (val %\
  \ 2 == 1)\n    {\n      output = \"Number is odd\";\n    }\n    // 显示结果\n    lblOutput.Text\
  \ = output;\n\n  }\n```\n\n***其工作原理***\n执行所有工作的代码位于按钮点击事件方法中（参见列表 6-1）。`btn_Click`\
  \ 方法开始时了几个变量。注意你用字符串字面量 `Number is even` 初始化了 `output`。然后你使用 `int.TryParse()` 将文本转换为数字。\n\
  \n### TryParse 的工作原理\n\n`TryParse()` 方法通常用于将字符串转换为整数。`TryParse()` 方法需要两个参数：1) 要转换的字符串，2)\
  \ 如果转换成功则存储数值的变量。第二个参数中的 `out` 关键字是必要的。首先，`out` 关键字告诉 C# 即使该变量没有初始化可以使用（你应该始终假设未初始化的变量包含垃圾数据）。其次，`out`\
  \ 关键字还告诉 C# 传递的是左值而不是右值。记住，默认情况下参数是通过复制右值传递的。用桶来类比，这意味着 `TryParse()` 方法知道 `val`\
  \ 桶的位置。因为这种类型的 `TryParse()` 是 `int` 类型的方法，它还知道桶的大小。由于 `TryParse()` 知道数据位于内存的哪个位置以及占用多少字节，`TryParse()`\
  \ 拥有更改所传递变量的值所需的所有信息。`TryParse()` 获取第一个参数的字符串，并尝试将这些字符格式化为数值。如果字符中的任何一个与数字不符，则转换失败。`TryParse()`\
  \ 向调用者返回 `false`，并将 `0` 移入变量的右值。由于 `TryParse()` 知道 `val` 在内存中的位置，它将 `val` 设置为 `0`\
  \ 没有问题。\n\n如果 `TryParse()` 方法失败（例如用户输入了非数字字符），变量 `flag` 为逻辑假。if 语句\n\n```cpp\n if\
  \ (flag == false)\n```\n\n使用关系运算符 `==` 检查 `flag` 的状态。如果 `flag` 因为 `TryParse()` 无法将用户输入转换为整数而为假，则\
  \ if 语句中的表达式为逻辑真。也就是说，`flag` 为假是真的。代码随后执行 if 语句块代码，显示关于错误的消息。\n\n### 清空还是不清除\n\n\
  `Clear()` 方法只是移除文本框对象中当前存在的任何字符。if 语句块中的程序语句存在争议：\n\n```cpp\n txtNumber.Clear();\n\
  ```\n\n\n\n\n\n这是因为某些人认为，在用户查看了通过 `MessageBox.Show()` 显示的消息后，你应该允许用户看到他的错误；而另一派观点则认为，你应该清除错误，为输入新的（希望是正确的）值做准备。这里没有所谓的“正确”答案。你可以选择任一一种方法，只要你保持一致性即可。用户喜欢一致性，所以请选择一种风格并坚持下去。\n\
  \n假设用户输入了正确的数值，该数字将由 `TryParse()` 方法赋值给 `val`。接的 `if` 语句使用模运算符来找到用户数字的余数：\n\n```\n\
  \ if (val % 2 == 1)\n{\noutput = \"Number is odd\";\n}\n```\n\n显然，如果你将一个数字除以二且有余数，那么这个数字一定是奇数。因此，如果\n\
  \n```\n val % 2\n```\n\n产生的结果为 1，那么 `if` 测试看起来就像写成这样：\n\n```\n if (1 == 1)\n```\n\
  \n该测试的结果显然是逻辑真（True）。因此，如果数字是奇数，它的余数就是 1，且 `if` 测试表达式为真。这意味着 `if` 语句块的代码被执行，`output`\
  \ 被赋值为字符串字面量 `Number is odd`。你可以根据 `if` 表达式的状态让程序忽略或执行 `if` 语句块中的语句。只要表达式为真，就会执行语句块。每当表达式为假，就会跳过语句块。尽管理解起来很简单，但\
  \ `if` 语句是计算机具备其处理能力的主要构建块。\n\n理解 `if` 语句如何改变程序流最好的方法，是使用不同的 `val` 值单步执行代码。要做到这一点，请将光标放在以下语句上：\n\
  \n```\n flag = int.TryParse(txtNumber.Text, out val);\n```\n\n并按 `F9` 键设置调试断点。现在运行程序。当程序到达断点时，反复按\
  \ `F10` 键单步执行程序。（你也可以使用 `F11` 键，这样更好，因为它会导致程序单步执行你编写的任何方法。）\n\n“使用了未赋值的局部变量”（use\
  \ of unassigned local variable）\n\n有时，当你使用 `if` 语句时，可能会遇到以下错误消息：\n\n```\n use of\
  \ unassigned local variable i\n```\n\n你可以用以下代码段来演示这个错误：\n\n```\n int i;\n// 一些额外的代码\n\
  if (x == MAX)\n{\n     i = 10;\n }\ni *= i;\n```\n\nVisual Studio 对最后一行程序抛出错误消息，表示你正尝试在给变量\
  \ `i` 赋值之前使用它。Visual Studio 这样做的原因是它在编译时不知道 `if` 语句是否会解析为逻辑真，从而将值 10 赋值给 `i`。如果\
  \ `if` 表达式为逻辑假，变量 `i` 就是未初始化的，没有已赋值的值。你可以通过简单地为变量 `i` 赋一个默认值来解决这个问题。大多数情况下，你会在定义变量时这样做。只需将\
  \ `i` 的定义更改如下所示：\n\n```\n int i = 0;\n```\n\n这会将 `i` 的右值设置为 0，Visual Studio 就会很满意了，因为无论\
  \ `if` 测试表达式的结果如何，`i` 现在都有一个已知值。\n\n***\n\n## if-else 语句\n\n如果你仔细查看 Listing 6-1\
  \ 中的代码，你会注意到在字符串定义时，输出字符串被设置为字面量 `Number is even`。因此，只有当数字为奇数时，字符串才会改变。仔细想想，你实际上想做的是根据数字的奇偶性设置输出字符串。程序可以工作，但它并没有反映你想做什么。\n\
  \n`if-else` 语句是清晰代码的完美解决方案。`if-else` 语句的语法如下：\n\n```\n if (expression1)\n{\n   \
  \ // 逻辑真：if 语句块\n\n}\nelse\n{\n    // 逻辑假：else 语句块\n}\n```\n\n使用 `if-else` 语句，如果\
  \ `(expression1)` 求值为逻辑真，则执行 `if` 语句块。如果 `expression1` 为逻辑假，则执行 `else` 关键字之后括号内的语句。`else`\
  \ 关键字之后括号内的语句组被称为 `else 语句块`。`if-else` 语句的程序流如图 Figure 6.3 所示。\n\n**Figure 6.3**\
  \ if-else 语句块\n\n![image](img/c06f003.jpg)\n\n正如你在 Figure 6.3 中所示，`if-else` 语句创建了一种“非此即彼”的决策。也就是说，该决策产生两个互斥的结果。在接下来的练习中，你修改\
  \ Listing 6-1 中的程序。\n\n### 练习：if-else 语句 (Chapter06ProgramEven.zip)\n\n为了演示 `if-else`\
  \ 语句的简单用法，请修改图 Figure 6.2 所示的程序。\n\n1. 加载简单的 `if-else` 测试程序。\n2. 将 `output` 的定义改为：\n\
  ```\n string output = \"Number is \";\n```\n3. 将 `if` 语句替换为：\n\n```\n // 查看奇偶\n\
  if (val % 2 == 1)\n{\noutput = \"odd\";\n}\nelse\n{\noutput = \"even\";\n}\n```\n\
  \n在 `if` 语句中，如果结果为逻辑真，则将 \"odd\" 附加到 \"Number is\" 之后。如果测试为逻辑假，则附加 \"even\"。\n\n\
  ***\n\n## if-else 的简写形式：三元运算符\n\n由于 `if-else` 语句在程序中非常常见，C# 有一种特殊的运算符专门用于替换简单的（即单语句）`if-else`\
  \ 语句块。C# 使用三元运算符来替换 `if-else` 语句。三元运算符的语法为：\n\n```\n (expression1) ? trueExpression\
  \ : falseExpression\n```\n\n该语句的工作原理是首先求值 `expression1`。如果 `expression1` 为逻辑真，则求值\
  \ `trueExpression`。如果 `expression1` 为逻辑假，则求值 `falseExpression`。逻辑流见 Figure 6.4。\n\
  \n**Figure 6.4** 三元运算符\n\n![image](img/c06f004.jpg)\n\n### 练习：三元运算符 (Chapter06ProgramEven.zip)\n\
  \n为了演示三元运算符的简单用法，请修改奇偶数程序的 if-else 版本，用三元运算符替换 `if-else` 语句块。\n\n1. 加载使用图 Figure\
  \ 6.2 代码的简单 `if-else` 测试程序。\n2. 为了用三元运算符替换 `if-else` 语句，初始化 `output` 如下：\n```\n\
  \ string output = \"Number is \";\n```\n3. 用此代码替换 `if` 语句：\n\n```\n 查看奇偶\noutput\
  \ = (val % 2 == 1) ? \"odd\" : \"even\";\n```\n\n\n\n\n\n```\n // 判断奇数还是偶数\noutput\
  \ = (val % 2 == 0) ? \"Number is even\" : \"Number is odd\";\n```\n\n现在运行程序，查看它的行为是否与之前一致。\n\
  \n### 工作原理\n\n使用修改后的代码，如果 `val % 2` 的结果为 `0`，则变量 `output` 被赋值字符串字面量 `Number is even`。否则，如果取模运算符产生的值\
  \ `1`，则 `output` 被赋值为 `Number is odd`。你应该在这一行设置断点并单步执行代码，以观察它的行为是否符合预期。\n\n虽然三元运算符是简单\
  \ `if-else` 语句的简写形式，但我并不喜欢使用它。原因有三个：首先，对于大多数程序员来说，理解一个三元表达式的时间比理解一个简单的 `if-else`\
  \ 块要长。如果你在最初编写代码一个月后，在调试期间回到这段代码，而它使用了三元运算符，那么你理解其意图的时间会比应该花费的长。其次，我总有一种挥之不去的感觉，使用三元运算符的程序员是为了展示他们会用它。读完三元语句后，我感觉程序员好像在说：“看好了，比尔·鲍布。”第三，如果任一个测试语句块需要多个语句来提供正确的结果，你就必须写一些相当丑的代码才能获得正确的结果。鉴于这些原因，如果使用简单的\
  \ `if-else` 语句代码更清晰，为什么要用三元运算符呢？\n\n## if 和 if-else 语句的样式考量\n\nC# 是一种对格式不敏感的语言。这意味着你可以将\
  \ `if-else` 语句写成单行，如下：\n\n```\n if (val % 2 == 1){output = \"Number is odd\";}else{output\
  \ = \"Number is even\";}\n```\n\nVisual Studio 可以正常处理这些语句。然而，大多数程序员会发现，如果没有换行和缩进，上行代码读起来要困难得多。这种格式问题是你编写代码时所用风格的因素。你确实有一些选择。\n\
  \n例如，当 `if` 或 `else` 语句块只包含一条语句时，你不需要大括号。也就是说，你可以写这样的代码：\n\n```\n if (val % 2 ==\
  \ 1)\n{\n  output = \"Number is odd\";\n}else\n{\n  output = \"Number is even\"\
  ;\n}\n```\n\n写成这样：\n\n```\n if (val % 2 == 1)\n  output = \"Number is odd\";\nelse\n\
  \  output = \"Number is even\";\n```\n\n程序的执行方式与之前完全相同。然而，当 `if` 语句块包含多个语句时，你*必须*使用大括号。例如，假设你写了以下代码：\n\
  \n```\n if (val % 2 == 1)\n    {\n        output = \"Number is odd\";\n        oddCounter++;\n\
  \    }\n```\n\n你的意图是用 `oddCounter` 统计奇数的个数。如果你不加大括号写相同的代码：\n\n```\n if (val % 2\
  \ == 1)\n        output = \"Number is odd\";\n        oddCounter++;\n```\n\n你的意图可能是相同的，但如果没有大括号，你实际得到的是：\n\
  \n```\n if (val % 2 == 1)\n    {\n      output = \"Number is odd\";\n    }\n   \
  \       oddCounter++;\n```\n\n代码功能之所以不同，是因为在没有大括号的情况下，`if` 语句只控制一条语句。错误的结果是，无论数字\
  \ `val` 的值如何，`oddCounter` 总是会增加——这可能不是你想做的。\n\n所以样式问题变成了：“当 `if` 语句块只包含一条语句时，你应该使用大括号吗？”答案是肯定的。始终使用大括号。首先，始终使用大括号可以提高你代码的一致性。每当你使用\
  \ `if` 语句时，后面紧跟着大括号。其次，通常 `if` 语句块中开始是单条语句在测试和调试后会变成多条语句。你反正要添加大括号，不如从一开始就加上它们。第三，大多数程序员认为大括号让语句块更加突出，并且更于阅读。在这里学到的教训是，即使\
  \ `if` 语句块只包含一条语句，也要始终使用大括号。\n\n另一个样式考量是放置大括号的位置。例如，由于 C# 不在乎语句的格式，你可以按照如下方式编写之前的代码：\n\
  \n```\n if (val % 2 == 1){\n      output = \"Number is odd\";\n    } else {\n  \
  \    output = \"Number is even\";\n    }\n```\n\n注意，必需的大括号仍然在它们应该在的位置，但位置变了。这种 *K&R\
  \ 风格* 由 Brian Kernighan 和 Dennis Ritchie 在 20 世纪 70 代编写的 C 语言书籍普及起来（《The C Programming\
  \ Language》，P Hall, 1978）。这种风格流行的原因之一是它减少了两行屏幕空间，这意味着你可以更好地利用显示器的微小面积。在不滚动滚动条的情况下看到更多源代码通常是一件好事。\n\
  \n那么你应该使用哪种风格呢？嗯，显然 C# 并不在乎；尽管 Visual Studio 默认将大括号放在单独的行。如果你在一个编程团队中工作，这种样式考量应该是团队（或公司）的决定。如果你只是为自己写代码，那是你的选择。个人而言，我真的非常喜欢\
  \ K&R 风格，主要是因为 C 是我第一种喜欢的语言，而大多数 C 程序员都使用 K&R 风格。许多学生这样做这种蠢事：\n\n```\n if (x ==\
  \ 2);\n    x++;\n```\n\n当使用大括号和 K&R 风格时，这种意图会变得更加明显：\n\n```\n if (x == 2){\n   \
  \ x++;\n}\n```\n\n这可能不是你想做的。始终使用大括号有助于减少这种蠢事。\n\n## 嵌套 if 语句\n\n***注意***：默认情况下，Visual\
  \ Studio 喜欢将大括号放在单独的行。也就是说，如果你尝试将大括号放在同一行，它会将语句格式化为换行。你可以通过`工具`→`自定义`→`编辑器`→`C#`→`格式`→`换行`菜单并取消“将控制块的大括号放在新行”选项的勾选来更改编辑器的默认行为。（确保你勾选了“显示所有设置”复选框。）你可以在\
  \ `if` 语句中包含 `if` 语句。例如，假设你拥有一家酒吧，女士在周二半价。你可能会有类似这样的代码：\n\n```\n decimal price =\
  \ FULLPRICE;\nif (age >= 21)\n{\n     if (gender == \"Female\")\n     {\n      \
  \     price *= .5M;\n     }\n} else {\n     MessageBox.Show(\"未成年人非法\");\n}\n```\n\
  \n在这个示例中，你获取饮料的价格（这里为什么要使用符号常量 `FULLPRICE` 呢？），如果客户是 21 岁以上的女性，则将其乘以 `.5`。如果性别是男性，则维持原价。由于你在\
  \ `if` 语句中包含了一个 `if` 语句，这被称为*嵌套 if 语句*。`else` 语句块也可以包含嵌套 if 语句。\n\n你可能会问：“.5 后面的字母\
  \ M 是什么意思？”回顾关于数据类型的讨论可知，几种值类型都有可以附加在它们后面的后缀，以明确它们的数据类型。在在这种情况下，由于你处理的是饮料的价格（即金钱），所以你想使用\
  \ `decimal` 数据类型。如果你不在 `.5` 后面放置 `M`，C# 默认假设字面量 `.5` 是 `double` 数据类型。C# 认为这是一个错误，因为你尝试将\
  \ `double` 赋值给 `decimal` 数据类型，并发布相应的错误消息。此外，`decimal` 数据类型足够智能，可以跟踪价格中的分，而 `double`\
  \ 可能多于两位小数。\n\n\n\n\n最后，你可能会问，为什么要乘以 .5 而不是除以 2。毕竟，结果是一样的，那么为什么不使用常规的除以 2 的方法呢？原因有两个。首先，乘以\
  \ .5 是将数字减半的一种非常常见的编程惯用法。此外，.5 确实也传达了折扣中“半价”的概念（尽管在这一行加个注释也无妨）。其次，除法是四种基本数学运算中最慢的。乘法略比除法快。虽然在这个例子中速度的提升是察觉的，但如果该操作在一个执行数万次迭代的密集循环中进行，情况就不同了。此外，你需要了解这种惯用法的示例，以防你在查看他人的代码时遇到它。\n\
  \n## RDC\n\n你可能已经注意到代码确实可以为女性生成折扣价格，但它没有考虑到该折扣仅在周二适用。你会如何修复这个问题呢？\n\n有时候，你需要进行一个涉及多个值的搜索，根据某些变量，其中任何一个值可能是正确的。例如，假设你有一个变量告诉你是星期几，并且你想根据该值执行各种任务。你可能会编写如下代码：\n\
  \n```cpp\n if (day == 1)\n{\n     doMondayStuff();\n}\nif (day == 2)\n{\n     doTuesdayStuff();\n\
  }\nif (day == 3)\n{\n    doWednesdayStuff();\n}\nif (day == 4)\n{\n    doThursdayStuff();\n\
  }\nif (day == 5)\n{\n    doFridayStuff();\n}\nif (day == 6)\n{\n    doSaturdayStuff();\n\
  }\nif (day == 7)\n{\n    doSundayStuff();\n}\n```\n\n也许 `doTuesdayStuff()` 方法调整了女性饮料的价格。\n\
  \n无论如何，所描述的代码是 `RDC`（真正愚蠢的代码）的另一个例子。原因在于这里展示的结构经常会导致不必要的代码被执行。例如，假设你想执行周一的任务（`day\
  \ == 1`）。第一个 if 测试逻辑为真（True），因此代码执行 `doMondayStuff()`。这是好消息。坏消息是，当程序控制在执行 `doMondayStuff()`\
  \ 方法后返回时，它会对变量 `day` 执行六次不必要的 if 测试。这些测试是不必要的，因为你已经知道 `day` 的值是 1。因此，尽管你知道它们逻辑上为假，代码仍然执行了六次不必要的\
  \ if 测试。\n\n当你意识到是什么让你的代码变成 `RDC` 时，你通常会拍拍额头，并问自己为什么起初没有发现它。不用担心……大多数优秀的程序员都有实之无归的宽额头！成为一名优秀程序员的关键点是转向更复杂的\
  \ bug，而不是一遍一遍地重复同样的旧错误。\n\n信不信由，我真的在一个生产环境中见过这种 `RDC` 代码，而且情况更糟，因为它是为了处理每月 31 天的问题而编写的。该代码意味着，如果是月份的第一天，就会执行\
  \ 30 次不必要的 if 测试。\n\n下一节将向你展示如何消除这种 `RDC`。接下来，让我们如何改进代码并避免所有潜在不必要的 if 测试。\n\n***\n\
  \n### 尝试一下：消除 RDC: (Chapter06ProgramOddEven.zip)\n\n你仍然可以复用你为 列表 6-1 所示的奇偶数程序编写的代码用于此示例。\n\
  \n1. **加载程序代码。**\n2. **删除按钮点击事件中注释行后的代码：**\n\n```cpp\n // See if odd or even\n```\n\
  \n将其替换为以下代码。（在更真实的代码中，每个 if 块可能会调用一个方法来执行某些有用操作。）\n\n```cpp\n int day;\nday = val;\n\
  if (day == 1)\n{\n     day += 1; // 模拟执行周一的任务\n} else\n     if (day == 2)\n    \
  \ {\n          day += 2;  // 模拟执行周二的任务\n     } else\n           if (day == 3)\n\
  \          {\n               day += 3;  // 模拟执行周三的任务\n          } else\n       \
  \        if (day == 4)\n               {\n                day += 4;  // 模拟执行周四的任务\n\
  \              } else\n                   if (day == 5)\n                   {\n\
  \                   day += 5;  // 模拟执行周五的任务\n                   } else\n       \
  \                if (day == 6)\n                       {\n                     \
  \   day += 6;  // 现在是周六的任务\n                       } else\n                    \
  \       if (day == 7)\n                           {\n                          \
  \ day += 7;  // 最后是周日的任务\n                  }\n```\n\n现在编译并运行程序。\n\n#### 工作原理\n\n\
  像前面的代码被称为`级联 if 语句`（cascading if statement）。通常情况下，级联 if 语句根据特定变量的状态执行不同的任务。在此代码段中，似乎根据变量\
  \ `day` 的值调用了不同的方法。如果你仔细遵循逻辑，你会发现当第一个测试逻辑为真时，不再执行那六个不必要的 if 测试。（使用调试器来证明这一点。）不必要的代码现在被跳过的原因是，当一个\
  \ if 语句逻辑为真时，没有理由评估任何后续的 if 表达式。级联 if 语句通常有点笨拙且难以阅读，仅仅是因为有太多的 if 语句导致事情看起来很混乱。想象一下如果你的缩进越缩越右，这段代码看起来有多糟糕。最终，这可能会迫使你使用水平滚动，这是大多数程序员都不喜欢的。\n\
  \n***\n\n## 逻辑运算符\n\n有时，需要根据两个或多个变量的状态做出复杂的决策。例如，为了判断某一年是否为闰年，你应用以下测试：\n\n*如果年份能被\
  \ 4 整除，但不能被 100 整除，则为闰年。如果年份能被 400 整除，则例外。如果是这样，它就是闰年。*\n\n如果你尝试将此编码为一系列简单的 if 语句，代码就会变得混乱。实际上，使用逻辑运算符的组合来编写该算法更容易。C#\
  \ 的逻辑运算符如表 6.2。\n\n#### 表 6.2 条件运算符\n\n| 项目 | 含义 | 示例 |\n| :--- | :--- | :--- |\n\
  | 逻辑 && | 逻辑与 (AND) | x && y |\n| 逻辑 &#124;&#124; | 逻辑或 (OR) | x &#124;&#124; y\
  \ |\n| 逻辑 ! | 逻辑非 (NOT) | !x |\n\n由于这些是逻辑运算符，每个运算符都解析为真或假的表达式。你可以通过真值表来查看这些关系。\n\
  \n#### 表 6.3 逻辑与真值表\n\n| 表达式 1 | 表达式 2 | Expression1 && Expression2 |\n| :--- |\
  \ :--- | :--- |\n| True | True | True |\n| True | False | False |\n| False | True\
  \ | False |\n| False | False | False |\n\n\n\n\n\n表 6.4 显示了逻辑或（OR）运算符的真值表。如表所示，如果其中一个或两个表达式逻辑为真，则逻辑或语句的结果为真。只有当两个表达式都为假时，结果才为假。\n\
  \n表 6.4 逻辑或真值表\n\n| 表达式 1 | Expression2 | Expression1 || Expression2 |\n| :--- |\
  \ :--- | :--- |\n| True | True | True |\n| True | False | True |\n| False | True\
  \ | True |\n| False | False | False |\n\n最后，表 6.5 显示了逻辑非（NOT）运算符的真值表。与其他运算符不同，逻辑非是一个一元运算符，这意味着它只使用一个表达式。因此，表\
  \ 6.5 表现得非常简单。\n\n表 6.5 逻辑非真值表\n\n| 表达式 1 | !Expression |\n| :--- | :--- |\n| True\
  \ | False |\n| False | True |\n\n如表 6.5 所示，逻辑非运算符只是“翻转”表达式当前的逻辑状态。\n\n## 使用逻辑运算符\n\
  \n现在重新审视判断年份是否为闰年的算法。该算法是：“如果年份能被 4 整除但不能被 100 整除，就是闰年。如果年份能被 400 整除，则是例外。如果是这样，也是闰年。”\n\
  \n你可能会这样编写该算法：\n\n```\n if (year % 4 == 0 && year % 100 != 0 || year % 400 == 0)\n\
  {\n  return 1;     // 是闰年\n}\nelse\n{\n  return 0;     // 不是\n}\n```\n\n如果你检查算法然后看代码，你应该会相信单一的\
  \ `if` 语句确实正确实现了该算法。\n\n注意，这段闰年代码返回 1 或 0，而大多数闰年方法（即 .NET 和 Java）返回 true 或 false\
  \ 的布尔值。为什么编码方式不同？使用这个版本，你可以执行如下操作：\n\n```\n days = DAYSINFEBRUARY + isLeapYear(myYear);\n\
  ```\n\n其中 `DAYSFEBRUARY` 是一个假设值为 28 的常量。如果该方法返回 `bool`，你只能使用像这样的 `if` 语句：\n\n```\n\
  \ if (isLeapYear(myYear))\n{\n     days = DAYSINFEBRUARY + 1;\n}\n```\n\n返回整数的版本更加灵活。显然，有些聪明人对此不同意。解决给定的编程问题几乎总有多种方法。\n\
  \n然而，情况并不总是像闰年计算那么简单。你可能会遇到这样的代码：\n\n```\n if (x + y < b && z - y == c || z * 5\
  \ - b == d)\n{\n     answer = x * y * z;\n}\n```\n\n前面的 `if` 语句将逻辑、条件和数学运算符混合在一起。那么，你如何知道如何处理这样一个复杂的\
  \ `if` 语句呢？（你第一件事是开除写这段代码的白痴。程序语句很少需要这么复杂，调试它将是一场噩梦。）正如你在第 4 章中学到的，优先级顺序决定了运算符求值的顺序。然而，由于你在本章中添加了新的运算符，你需要扩展优先级表以包含新运算符。扩展后的优先级表如表\
  \ 6.6 所示。（虽然你还没有学习过表 6.6 中所示的所有运算符，但为了完整完整性，在此列出。）\n\n表 6.6 运算符优先级\n\n| 运算符 | 类型\
  \ |\n| :--- | :--- |\n| . ++ -- new | 优先级 |\n| ! | 一元 |\n| * / % | 数学 |\n| + - |\
  \ 数学 |\n| < > <= >= | 关系 |\n| == != | 关系 |\n| && \\|\\| | 逻辑 |\n| ?: | 三元 |\n| =\
  \ *= /= %= += -= | 赋值 |\n| , | 逗号 |\n\n如果你对一组表达式的求值顺序不满意，可以将表达式包含在括号内，强制其脱自然优先级进行求值。（你可能想在这个页写上页码）\n\
  \n### 结合性\n\n当一个表达式包含两个具有相同优先运算符时，如何解析优先级？通常情况下，运算符是左结合的，这意味着它们从左到右求值。如果你需要覆盖这一点，可以使用括号。考虑以下内容：\n\
  \n```\n5 + 6 * 2\n```\n\n如果你确实需要结果为 11，则使用括号：\n\n```\n(5 + 6) * 2\n```\n\n## switch\
  \ 语句\n\n你之前学过，当你想测试特定值时，可以使用 `switch` 替换级联 `if`，例如星期几示例：\n\n```\n if (day == 1)\n\
  {\n     doMondayStuff();\n} else\n     if (day == 2)\n     {\n          doTuesdayStuff();\n\
  \     } else\n           if (day == 3)\n          {\n               doWednesdayStuff();\n\
  \           }\n```\n\n虽然这段代码运行正常，但级联 `if` 通常难以阅读，因为你必须将 `if` 语句与其值匹配。其次，如果级联很长，代码会超出屏幕。程序员讨厌水平滚动，因为这浪费时间。此外，这种代码可能导致你垂直滚动。`switch`\
  \ 语句提供了解决这些问题的方法。\n\n`switch` 语句的语法如下：\n\n```\n switch (expression1)\n{\n      case\
  \ 1:\n          // case 1 的语句\n             break;\n      case 2:\n        // case\
  \ 2 的语句\n             break;\n      case 3:\n         // case 3 的语句\n          \
  \   break;\n       default:\n        // default 的语句\n             break;\n}\n```\n\
  \n在 `switch` 语句中，`expression1` 的值决定了执行哪个 `case` 语句。你可以认为每个 `case` 语句从 `case` 关键字后面的冒号（:）开始，到关联的\
  \ `break` 结束。\n\n如果 `expression1` 不匹配任何 `case`，则求值 `default` 表达式。与 `if` 语句不同，`case`\
  \ 语句不需要括号。`break` 语句对于防止程序控制“穿透”到下一个 `case` 语句是必要的。`break` 语句导致程序从 switch 之后的第一个语句继续执行。\n\
  \n让我们编写一个简单的程序，使用 `switch` 语句块来做复杂的决策，而不是大量的嵌套 `if-else` 块。你会发现 `switch` 版本更容易阅读，效率也略高。\n\
  \n* * *\n\n**尝试：使用 switch 语句 (Chapter06ProgramSwitch.zip)**从 `Chapter06ProgramSwitch.zip`\
  \ 文件中加载代码，或使用列表 6.2 中所示的代码。列表中仅显示了 `btnCalc` 点击事件代码，因为其余代码与你编写的所有其他程序几乎相同。\n\n列表\
  \ 6.2: `btn_Click` 事件代码 (`frmMain.cs`)\n\n\n\n\n```c\n private void btnCalc_Click(object\
  \ sender, EventArgs e)\n    {\n        bool flag;\n        int myDay;\n        string\
  \ msg = \"Today is \";   // Don't duplicate it 7 times\n     // Make text into int\n\
  \        flag = int.TryParse(txtDay.Text, out myDay);\n        if (flag == false)\n\
  \        {\n            MessageBox.Show(\"Numeric only, 1 thru 7\");\n         \
  \   txtDay.Focus();    // Send 'em back to try again\n            return;\n    \
  \    }\n        switch (myDay)\n        {\n            case 1:\n               \
  \ lblResult.Text = msg + \"Monday\";\n                break;\n            case 2:\n\
  \                lblResult.Text = msg + \"Tuesday\";\n                break;\n \
  \           case 3:\n                lblResult.Text = msg + \"Wednesday\";\n   \
  \             break;\n            case 4:\n                lblResult.Text = msg\
  \ + \"Thursday\";\n                break;\n            case 5:\n               \
  \ lblResult.Text = msg + \"Friday\";\n                break;\n            case 6:\n\
  \                lblResult.Text = msg + \"Saturday\";\n                break;\n\
  \            case 7:\n                lblResult.Text = msg + \"Sunday\";\n     \
  \           break;\n            default:\n                lblResult.Text = \"You\
  \ should never get here\";\n                break;\n\n        }\n    }\n```\n\n\
  在更实际的情况下，每个 `case` 语句都会执行一些稍微有趣一点的操作。然而，这段简单的代码就能很好地满足你的需求。**工作原理** 如果你学习这段代码片段，你会发现它的工作方式类似于级联的\
  \ `if` 语句；只不过读起来要容易得多。此外，你不需要水平滚动就能一次性看到所有代码。是 `day` 的值决定了执行哪个 `case` 语句块。每个 `case`\
  \ 块中的 `break` 语句会将程序控制发送到 `switch` 语句块结束大括号之后的第一个语句。因此，是 `break` 语句使得 `switch` 能够像级联\
  \ `if` 语句一样工作，从而避免了不必要的 `if` 测试。如果变量 `day` 的值不在 1 到 7 之间，则执行 `default` 情况。（你并不强制要求使用\
  \ `default` 情况，但在每个 `switch` 语句中包含一个是一个好主意。）这种情况显示了一个简单的错误消息。通常的做法是让 `default` 情况调用一个日志方法来记录错误的性质。通常，错误日志文件只是一个简单的文本文件，可以使用任何文字处理程序进行读取。也许\
  \ `ErrorLog()` 方法会在错误日志文件中记录 `day` 的值，这样负责支持程序的人就可以通过电话要求用户读取错误日志文件的最后一行。因此，支持人员对产生错误的\
  \ `day` 值将有一个大致的了解。\n\n***\n\n# 总结\n\n本章介绍了在程序中做出决策的性知识。计算机决策的基本构建单元是简单的 `if` 语句。从那里，你学习了\
  \ `if-else` 和 `switch` 语句，并展示了在什么时候使用它们是合适的。你还读了一些关于编程风格的思考以及决定使用哪种编码风格时所涉及的问题。尽管\
  \ C# 不在乎你的编码风格，但可能阅读你代码的人会在乎。在任何情况下，请尽量让你的代码易于阅读。\n\n# 练习题\n\n你可以在附录 A 中找到以下练习的答案。\n\
  \n**1.** 假设电影院对 12 岁或以下的儿童或 65 岁或以上的成人收取半价。编写一个考虑到此定价策略的 `if` 语句。****2.** 在编写 `if-else`\
  \ 语句时，重要的风格考量有哪些？**3.** 什么时候使用级联 `if` 语句是合适的？**4.** 你在以下代码段中看到了哪些错误？\n\n```\n if\
  \  (x = y);\n{\n     price =* .06;\n}\n```\n\n**5.** 假设小披萨售价 6 美元，中号贵 1 美元，大号比中号贵\
  \ 1 美元。假设变量 `size` 存储了的选择，如何编写代码确定最终价格？**6.** 编写一个程序，接受年份作为输入，然后调用名为 `IsLeapYear(int\
  \ year)` 的方法，然后显示用户输入的年份在二月份正确的天数。\n\n### 本章你学到的内容\n\n| **主题** | **要点** |\n| :---\
  \ | :--- |\n| **if** | 如何使用 `if` 语句。 |\n| **TryParse()** | 关于如何使用此转换方法的更多细节。 |\n\
  | **if-else** | `if-else` 语句块的使用。 |\n| **级联 if** | 如何使用级联 `if` 语句同时避免冗余的 `if` 测试。\
  \ |\n| **? :** | 三元运算符。 |\n| **逻辑运算符** | 什么是逻辑运算符及其真值表。 |\n| **switch** | 如何使用 `switch`、`case`、`break`\
  \ 和 `default` 语句。 |\n\n# 第 7 章\n\n# 使用循环重复语句\n\n**你将在本章中学到：**\n\n* 什么是循环以及何时应该使用它\n\
  * 什么是一个良好的程序循环\n* 当循环不良好时会发生什么\n* 什么是 `for` 循环\n* 什么是 `while` 循环\n* 什么是 `do-while`\
  \ 循环\n* 何时使用 `break` 和 `continue` 语句\n\n本章代码下载\n\n你可以在 [wrox.com](http://wrox.com)\
  \ 找到本章的代码下载。\n\n\n\n\n\n第一个条件意味着你的代码应该始终在一个已知的状态下开始执行程序循环。通常，这意味着你为控制循环的变量分配一个初始值。未能初始化循环变量几乎总是意味着循环执行次数超出意意——这可不妙！\n\
  \n第二个条件意味着你必须有某种形式的测试，用来判断是否需要再次通过循环。通常，这意味着将你在第一个条件中初始化的变量与某些终止标准进行比较。这个条件通常意味着关系运算符是该条件的一部分。\n\
  \n第三个条件意味着某个变量在循环执行期间必须改变其值。如果循环的状态在执行过程中没有发生变化，那么没有任何条件可以终止循环。这就会产生无限循环，即一个永远执行下去的循环。大多数情况下，无限循环是程序逻辑错误的结果。\n\
  \n# 无限循环\n无限循环通常是无意的，并且会导致程序“卡死”。因此，每当你编写涉及程序循环的代码时，在运行之前保存代码是一个好主意。默认情况下，Visual\
  \ Studio 在你运行程序（`F5`）时会保存代码。你可以通过使用 `File → Save All` 菜单序列或 `Ctrl+Shift+S` 键组合显式地保存项目代码。通过在试运行之前保存代码，如果代码进入无限循环，你可以从上次的地方继续。通常，你可以通过点击蓝色小正方形图标或按下\
  \ `Shift+F5` 来重新获得控制。有时这些方法无效，当执行无限循环时，你可能需要使用令人畏的 `Ctrl+Alt+Delete` 来重新获得系统的控制。\n\
  \n为了说明良好循环的三个条件，考虑 C# 的 for 循环。\n\n## for 循环\nfor 的语法如下：\n\n```cpp\n for (expression1;\
  \ expression2; expression3)\n{\n     // for 循环语句块\n}\n```\n\n`expression1` 通常用于初始化控制循环的变量的起始值。`expression2`\
  \ 通常是一个关系测试，用于确定是否需要迭代循环。最后，`expression3` 通常是一个增加或递减控制循环的变量的语句。一个具体的示例将帮助识别这些表达式。假设你想为从\
  \ 0 到 100 的值生成一个平方数表。控制处理的 for 循环可能像这样：\n\n```cpp\n for (i = 0; i <= 100; i++)\n\
  {\n     // 计算值的语句\n}\n```\n\n`expression1` 是紧跟在 for 循环左括号后面的语句：\n\n```cpp\ni = 0;\n\
  ```\n\n该表达式设置了或初始化了控制循环的变量的初始状态。因为变量 `i` 出现在所有三个表达式中，所以它控制着循环。如果你想用值 1 初始化循环状态，你会将\
  \ `expression1` 改为\n\n```cpp\n i = 1;\n```\n\n第二个表达式，\n\n```cpp\n i <= 100;\n```\n\
  \n将变量 `i` 的当前值与目标值 100 进行比较。如果该表达式的结果为真（True），则再次通过循环。也就是说，将执行 for 循环的语句块。第三个表达式，\n\
  \n```cpp\n i++;\n```\n\n负责在每次通过期间改变循环的状态。在这种情况下，代码简单地增加了变量 `i` 的值。注意，你可以在这里放置任何表达式，包括如果你想要的话的减操作。\n\
  \n### 递增和递减运算符\n`expression3` 使用了表达式 `i++`。这是一个后自增运算符的例子。后自增运算符（`i++`）的解释是：\n\n\
  ```cpp\n i = i + 1;\n```\n\n也就是说，后自增运算符获取变量 `i` 的当前值并加 1。你也可以使用后自减运算符，它的语法为 `i--`。后自减运算符的解释是：\n\
  \n```cpp\n i = i – 1;\n```\n\n因此，后自减运算符获取变量 `i` 的当前值并从其减去 1。当递增或递减运算符像在 for 循环中那样“独立存在”时，只有单个变量受到影响。现在考虑以下语句：\n\
  \n```cpp\n k = i++;\n```\n\n如果 `i` 在此语句之前的值是 5，那么 `k` 的值是多少？`k` 等于 5 还是 6？换句话之，递增发生在什么时候？在这个例子中，因为你使用了后自增运算符，`k`\
  \ 的值是 5，但当语句结束时 `i` 的值是 6。这就是为什么它被称为后自增运算符。你先使用值（使用赋值运算符），然后执行递增操作。\n\n正如你可能猜测的那样，还有前自增运算符。前自增操作将两个加号放在变量名之前。在在前自增操作中，递增在值使用之前执行。因此，如果\
  \ `i` 在以下语句执行之前是 5：\n\n```cpp\n k = ++i;\n```\n\n那么 `k` 的 的值是 6，`i` 的值也是如此。C# 还允许你使用前递减和后递减操作。如果\
  \ `i` 在以下语句执行之前是 5：\n\n```cpp\n k = i--;\n```\n\n那么 `k` 的 的值是 5，但 `i` 的值是 4。再次，推理是相同的：递减操作在赋值后完成。如果使用前递减运算符，\n\
  \n```cpp\n k = --i;\n```\n\n`k` 和 `i` 的值都是 4，因为递减是在赋值之前执行的。你应该相信，独立的递增或递减表达式在程序视角下是完全相同的。只有当递增或递减操作作为其他表达式（例如赋值操作）的一部分时，使用前或或后运算符才重要。在\
  \ for 循环中，`expression3` 没有与其他任何表达式一起使用，所以你可以使用前或后递增运算符。\n\n### for 循环中的顺序\nfor 循环中的语句执行顺序有一个定义良好的序列。这种顺序在图\
  \ 7.1 中所示。\n\n图 7.1 for 循环的执行顺序\n![image](img/c07f001.jpg)\n\n在图中，步骤 1 通常是控制循环变量的初始化。在完成步骤\
  \ 1 后，程序控制转移到步骤 2。注意步骤 1 中的 `expression1` 永远不会被再次访问。\n\n步骤 2 是关系表达式。通常这意味着代码比较两个变量以决定下一步做什么。如图\
  \ 7.1 所示，如果 `expression2` 中关系测试的结果为真（true），程序控制发送到 for 循环语句块中的语句。如果 `expression2`\
  \ 计算为假（false），程序控制发送到 for 循环语句块右大括号之后的第一个语句，并跳过循环体。\n\n假设步骤 2 为真，执行两个大括号之间的代码。当\
  \ for 循环语句块的最后一个语句执行时，步骤 3 将程序控制发送到 `expression3`。通常，`expression3` 负责改变在步骤 1 中初始化的变量的状态。\n\
  \n\n\n\n执行完 `expression3` 后，程序控制将立即返回到 `expression2`。同样，会对 `expression2` 中的代码进行测试，以检查是否需要再次通过循环语句块。如果测试结果为逻辑\
  \ True，则将再次执行 for 循环语句块。这种重复的序列将一直持续，直到 `expression2` 的求值结果为逻辑 False，此时 for 循环终止。\n\
  \n就像你在上一章中学习的 `if` 语句块一样，当 for 循环只控制单个程序语句时，可以省略大括号，C# 编译器也不会报出任何错误。然而，就像你应该始终在\
  \ `if` 语句中使用大括号一样，出于同样的原因，你也应该始终在 for 循环中使用大括号：大括号使循环更易读，而且通常你之后可能可能需要添加更多的语句。\n\
  \n现在你已经理解了 `for` 循环中三个表达式每个的作用，请将它们的任务与一个良好循环所需的三个条件进行比较。有发现任何关系吗？使用 `for` 循环所需的三个表达式*恰好*就是良好循环所需的三个必要条件！\n\
  \n在下面的“尝试一试”（Try It Out）中，你将编写一个程序，使用 `for` 循环为一组数字生成平方表。请注意，良好循环的所有条件都写在程序的一行中。\n\
  \n***\n\n### 尝试一试：平方表 (Chapter07ProgramTableOfSquares.zip)\n在这个示例中，你将编写一个程序，为一组数字生成平方表。图\
