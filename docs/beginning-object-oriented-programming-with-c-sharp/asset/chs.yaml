  \ Explorer）窗口显示了大量的源代码文件并不意味着你应该恐慌。正如前面提到的，这是你迄今为止最大的项目，但你拥有所有的工具来让一切完美运行。吃大象就像吃其他任何东西一样：一口一口吃。这个程序也是如此。当你花时间研究每个部分的功能后，你将很好地理解它们是如何协同工作的。\n\
  \n## 工作原理\n\n显示给用户的第一个屏幕是一个包含选项的 MDI（多文档界面）菜单。与大多数此类应用程序一样，第一步是选择数据库。在这里这要稍微困难一些，因为数据库可能位于远程服务器或网络上的其他位置。\n\
  \n#### 获取数据库访问\n\n当程序首次启动时，你需要标识数据库所在的服务器。这实际上是一个两步过程，因为可能运行着多个服务器，而且该服务器可能包含多个数据库。\n\
  \nMDI 表单的标题如往常命名为 `frmMain`，外观类似于图 14.10 所示。随着程序的运行，你会看到菜单和选项的样子。\n\n用户必须执行的第一项任务是选择持有数据库的服务器。（参阅图\
  \ 14.10 查看此选项。）列表 14-1 显示了与“选择服务器”（Select Server）菜单选项相关的代码。\n\n列表 14-1:为数据库选择服务器\
  \ (`frmMain.cs`)\n\n```csharp\n private void mnuSelectServer_Click(object sender,\
  \ EventArgs e)\n    {\n        //在此设置调试代码：\n        /*\n         whichServer = \"\
  ECONJACK-PC\";\n         dbName = \"Cards\";\n         connectionString = \"server=\"\
  \ + whichServer + \";integrated\n                     security=SSPI;database=\"\
  \  + dbName;'\n        */\n\n        frmServerSelect myServer = new frmServerSelect(this);\n\
  \        myServer.ShowDialog();\n        this.Text = \"Database Management Subsystem:\
  \      Server:  \" +\n                     whichServer + \"     Database:  \" +\
  \ dbName;\n        connectionString = \"server=\" + whichServer +\n            \
  \         \";integrated security=SSPI;database=\" + dbName;\n    }\n```\n\n列表中包含了一些硬编码服务器和数据库名称的调试代码。从这些字符串字面量中，你可以构建出用于连接数据库的连接字符串。在开发此数据库软件时，我注释掉了“真实”代码并改用调试字面量。为什么呢？\n\
  \n使用调试代码是因为每当你运行程序测试某些功能时，Windows 都必须执行大量工作来查找服务器的位置。在我的系统上，这可能花费 10 秒钟。虽然这看起来并不长，但在开发过程中运行程序数百次时，这种延迟感觉就像永无止境。通过将服务器和数据库名称直接硬编码到程序中，你可以跳过此菜单选项，直接处理其他程序选项。显然，当程序稳定后，应该注释掉调试代码（参阅列表\
  \ 14-1）。\n\n列表 14-1 中的实际代码应该看起来熟悉。但请注意，当你创建 `frmServerSelect` 表单的实例时，你使用 `this`\
  \ 作为参数调用构造函数。你可以回想起，这是一个变量持有当前活动表单数据存储位置的左值（lvalue）。通过将该引用传递给 `frmServerSelect`\
  \ 表单，该表单就可以访问与 `frmMain` 相关的所有数据。列表 14-2 展示了 `frmServerSelect` 的代码。同样注意，从 `mnuSelectServer_Click()`\
  \ 方法返回后，`frmMain` 的标题将变为包含服务器和数据库名称。\n\n列表 14-2:为数据库选择服务器的代码 (`frmServerSelect.cs`)\n\
