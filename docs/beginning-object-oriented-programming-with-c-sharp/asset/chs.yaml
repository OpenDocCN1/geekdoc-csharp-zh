  \ 类的几个方法。第一次检查是玩家是否还有剩余余额可以继续游戏。如果玩家破产，游戏将无法进行。用户可以点击 `Reset` 按钮来重置其初始余额。如果玩家有余额，程序将检查是否还有足够的牌来玩手牌。如果没有，玩家将看到一条消息显示牌组已重洗，然后继续游戏。最后，发发手牌并向庄家展示两张牌。如果你观察代码的运行方式，下注的结果在此时就已经确定了。手牌的结果仅仅取决于玩家是否点击了下注。\n\
  \n### 使用 `ref` 关键字\n\n如果玩家决定下注，`btnBet_Click` 代码将决定显示结果。当通过以下调用“发牌”时：\n\n```\nmyRules.DealHand(cards,\
  \ ref betResult, ref position);\n```\n\n变量 `betResult` 决定了胜负，`position` 决定了第三张牌显示在哪个标签位置（如前所述）。`cards`\
  \ 变量是一个包含手牌三张牌的数组。由于 C# 方法只能返回一个值，因此无法在方法中使用简单的 `return` 语句来返回所需的所有信息。相反，我们将 `cards`\
  \ 数组连同 `betResult` 和 `position` 变量传递给方法。列表 10-8 显示了 `clsInBetweenRules` 类的代码。\n\n\
  \n\n\n\n```cs\n using System;\nclass clsInBetweenRules\n{\n    // ===============\
  \ 符号常量 ===================\n    const int TIE = 0;\n    const int PLAYERWINS = 1;\n\
  \    const int DEALERWINS = 2;\n\n    // =============== 静态成员 =======================\n\
  \    // =============== 实例成员 =====================\n    private int balance;   \
