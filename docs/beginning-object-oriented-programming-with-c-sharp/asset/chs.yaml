  \n代码从几个符号常量的定义开始，紧接着是一系列数组引用对象。这些数组最终持有要排序的数据。`frmMain` 构造函数将单选按钮的默认数据类型设置为整数，并将当前选择设置为整数（`choice\
  \ = INTEGER`）。数值数据类型默认生成的数值数量为 10 个，如图 12.2 所示。\n\n## 使用 Split( ) 方法处理字符串\n\n当选择字符串数据类型时，计数器由\
  \ `txtString` 文本框对象中由逗号分隔的字符串条目决定。这通过以下语句实现：\n\n```\nsData = txtString.Text.Split(',');\n\
  ```\n\n`Split()` 方法检查 `txtString` 以寻找逗号字符。每当找到一个逗号时，它就会为逗号之前（但不包括逗号）的字符创建一个新字符串。在读取完所有子串后，字符串数组被赋值给\
  \ `sData`。如果需要，`Split()` 方法可以使用多个分隔符字符。你可以通过在线帮助查找详细信息。（也就是说，在源代码中双击 `Split` 词使其高亮，然后按\
  \ `F1` 键。）\n\n如果用户选择了默认 `INTEGER` 以外的选项，会在相应的单选按钮点击事件代码设置变量 `choice`。例如，如果用户点击 Double\
  \ 单选按钮，将执行以下代码，将 `choice` 设置为适当的值：\n\n```\nprivate void rbDouble_Click(object sender,\
  \ EventArgs e)\n{\n    choice = DOUBLE;\n}\n```\n\n变量 `choice` 通过各种 `switch` 语句选择相应的代码。\n\
  \n## 生成数据\n\n根据 `choice` 的值，向相应的数组中填充数据。其实现方式见下面的代码段：\n\n```\nswitch (choice)  \
  \                  // 选择正在使用的数据类型\n                                  \n{\n   case\
  \ INTEGER:                  // 整数\n\n       iData = new int[items];\n          \
  \ for (i = 0; i < items; i++)\n           {\n               iData[i] = rnd.Next(MAXVALUE);\n\
  \           }\n           break;\n       case LONG:                     // 长整型\n\
  \           lData = new long[items];\n           for (i = 0; i < items; i++)\n \
  \          {\n               lData[i] = (long)rnd.Next(MAXVALUE);\n           }\n\
  \           break;\n\ncase DOUBLE:                   // 双精度浮\n           dData =\
  \ new double[items];\n           for (i = 0; i < items; i++)\n           {\n   \
  \            dData[i] = rnd.NextDouble() * MAXVALUE;\n           }\n           break;\n\
  \ncase STRING:                   // 字符串\n           sData = txtString.Text.Split(',');\
  \  // 分割为\n                                                  字符串\n           break;\n\
  \  }\n```\n\n对于 `INTEGER` 和 `LONG` 数据类型，参数化的 `Next()` 方法在 `for` 循环内部生成伪随机数。循环的次数由用户输入的\
  \ `items` 变量决定。传入值 `MAXVALUE` 意味着生成的值落在 0 到 `MAXVALUE` 之间（不包含 MAXVALUE）。对于 `DOUBLE`\
  \ 数据类型，`NextDouble()` 方法返回 0 到 1 之间（不包含 1）的值。因此，将 `NextDouble()` 方法返回的小数乘以 `MAXVALUE`\
  \ 即可为双精度数据类型设置相同的范围。对于字符串数据，如前所述，`Split()` 方法将填充 `sData` 数组。生成值后，调用 `ShowData()`\
  \ 将数据移动到列表框中，以显示生成的值。\n\n## 使用泛型类\n\n在列表框对象生成并显示原始数据后，就可以将未排序的数据传递给泛型版本的快速排序方法。下面的代码段显示了如何为不同的数据类型调用排序方法：\n\
  \n```\nprivate void btnSort_Click(object sender, EventArgs e)\n{\n    whichListbox\
  \ = SORTED;\n\n    switch (choice)\n    {\n        case INTEGER:               \
  \   // 整数\n            clsQuickSort<int> iSort = new clsQuickSort<int>\n       \
  \                               (iData);\n            iSort.Sort();\n          \
  \  break;\n\n        case LONG:\n            clsQuickSort<long> lSort = new clsQuickSort<long>\n\
  \                                       (lData);\n            lSort.Sort();\n  \
  \          break;\n\n        case DOUBLE:\n            clsQuickSort<double> dSort\
  \ = new\n                                         clsQuickSort<double>\n       \
  \                                  (dData);\n            dSort.Sort();\n       \
  \     break;\n\n        case STRING:\n            clsQuickSort<string> sSort = new\n\
  \                                         clsQuickSort<string>\n               \
  \                          (sData);\n            sSort.Sort();\n            break;\n\
  \    }\n    ShowData();\n}\n```\n\n在每种情况下，代码都使用泛型语法来创建 `clsQuickSort` 类的对象。也就是说，实例化对象的语句形式如下：\n\
  \n```\nclsQuickSort<T> typeSort = new clsQuickSort<T>(typeData);\n```\n\n因此，根据 `choice`\
  \ 的值，通过以下四个语句之一实例化四个对象：\n\n```\nclsQuickSort<int> iSort = new clsQuickSort<int>(iData);\n\
  clsQuickSort<long> lSort = new clsQuickSort<long>(lData);\nclsQuickSort<double>\
  \ dSort = new clsQuickSort<double>(dData);\nclsQuickSort<string> sSort = new clsQuickSort<string>(sData);\n\
  ```\n\n实例化适当的对象后，代码调用对象的 `Sort()` 方法（例如 `iSort.Sort()`）。在该代码执行后，数据已排序，排序后的数据显示在第二个列表框中。现在看看对快速排序代码需要哪些更改。\n\
  \n# 泛型快速排序\n\n`clsQuickSort` 的代码在列表 12-4 中。注意列表中使 `clsQuickSort` 类支持泛型的第二个 `using`\
  \ 语句。`Generic` 命名空间包含了泛型类、结构体接口，用于支持泛型字典、列表、队列和栈。在本节中，我们仅在实现泛型类方面使用泛型。\n\n列表中的第三行\n\
  \n```\npublic class clsQuickSort<T> where T : IComparable\n```\n\n回想当我们实例化泛型类对象时（例如对于双精度数据类型），其形式如下：\n\
  \n```\nclsQuickSort<double> dSort = new clsQuickSort<double>(dData);\n```\n\n因此，`dSort`\
  \ 对象的类型是 `double`，它成为类开启语句中的 `T` 类型。换，实例化对象 `dSort` 使得语句看起来像：\n\n```\npublic class\
  \ clsQuickSort<double> where double : IComparable\n```\n\n编译器会生成必要的代码以适应传递给泛型 `clsQuickSort`\
  \ 类的数据类型。暂时忽略语句中 `where` 关键字后面的表达式，这些表达式将在章稍后的“带约束和接口的泛型”节中进行讨论。\n\n列表 12-4: 泛型快速排序源代码\
  \ (clsSort.cs)\n\n\n\n\n\n```cs\nusing System;\nusing System.Collections.Generic;\n\
  \npublic class clsQuickSort<T> where T : IComparable\n{\n    // =================\
  \ 实例成员 ====================\n    T[] data;\n\n    // ================= 构造函数 ====================\n\
  \    public clsQuickSort(T[] values)\n    {\n        data = values;    //拷贝未排序数据的右值\n\
  \    }\n    // ================= 属性方法 ====================\n\n    // =================\
  \ 辅助方法 ====================\n\n    /**\n    *Purpose：此方法获取排序的初始基值点，然后递归\n    * \
  \         调用自身直到所有值都被设置。\n    *\n    * 参数列表:\n    *  int first            分区第一个元素的索引\n\
  \    *  int last            分区最后一个元素的索引\n    *\n    * 返回值:\n    *  void\n     */\n\
  \    private void doSort(int first, int last)\n    {\n        if (first == last)\n\
  \        {\n            return;   // 完成\n        }\n        else\n        {\n  \
  \          int pivot = getPivotPoint(first, last);\n\n            if (pivot > first)\n\
  \                doSort(first, pivot  1);\n            if (pivot < last)\n     \
  \           doSort(pivot + 1, last);\n        }\n    }\n\n    /**\n    *Purpose：此方法设置排序的基值点。\n\
  \    *\n    * 参数列表:\n    *  int start          分区的起始索引\n    *  int end         \
  \   分区的结束索引\n    *\n    * 返回值:\n    *  void\n     */\n    private int getPivotPoint(int\
  \ first, int last)\n    {\n        int pivot = first;\n\n        int start = first;\
  \  // 保留副本\n        int end = last;\n\n        if (last  first >= 1)\n        {\n\
  \            while (end > start)\n            {\n                while (data[pivot].CompareTo(data[start])\
  \ >= 0 &&\n                                     start <= last && end > start)\n\
  \                    start++;\n                while (data[pivot].CompareTo(data[end])\
  \ <= 0 &&\n                                     end >= first && end >= start)\n\
  \                    end--;\n                if (end > start)\n                \
  \    swap(start, end);\n            }\n            swap(first, end);\n         \
  \   doSort(first, end  1);\n        }\n        return end;\n    }\n\n    /**\n \
  \   *Purpose：此方法为 quickSort() 执行数据交换\n    *\n    * 参数列表:\n    *  int pos1      \
  \      第一个待交换值的索引\n    *  int pos2            第二个待交换值的索引\n    *\n    * 返回值:\n  \
  \  *  void\n     */\n    private void swap(int pos1, int pos2)\n    {\n        T\
  \ temp;\n\n        temp = data[pos1];\n        data[pos1] = data[pos2];\n      \
  \  data[pos2] = temp;\n    }\n\n    // ================= 普通方法 ====================\n\
  \    /**\n    *Purpose：这是快速排序的用户接口入口点\n    *\n    * 参数列表:\n    *  n/a\n    *\n \
  \   * 返回值:\n    *  void\n    *\n    * 注意：此例程假设构造函数传递的是未排序数据\n     */\n    public\
  \ void Sort()\n    {\n        int len = data.Length;\n        if (len < 2)     \
  \ // 足够排序？\n            return;\n        doSort(0, data.Length  1);\n    }\n\n}\n\
  ```\n\n你可能会认为，将列表 12-2 中所示的代码转换为泛型是一个相当简单的过程。然而，在类似下面的语句会出现复杂情况：\n\n```\nwhile (data[start]\
  \ <= pivot && start <= last && end > start)\n```\n\n与其他某些支持类似构造的语言（如 C++ 中的模板）不同，C#\
  \ 不喜欢在泛型类型 `T` 上使用关系运算符。由于该限制，C# 编译器会针对 `while` 语句中的表达式报错：\n\n```\ndata[start] <=\
  \ pivot\n```\n\n因为你正试图比较两个类型为 `T` 的操作数。由于数据数组的基值点在快速排序算法中起着重要作用，你必须修改代码来绕过此限制。\n\
  \n幸运的是，编译器投诉的重点集中在基值点与数组特定元素的比较上。你可以修复它。\n\n### 使用带约束和接口的泛型\n\n如果你将类的第一行写为：\n\n\
  ```\npublic class clsQuickSort<T>\n```\n\n那么你是在说此类适用于你所想象的任何数据类型。这意味着，你可以使用该类的对象处理所有值类型和所有引用类型，包括你可能创建的任何自定义对象。这样的类签名意味着\
  \ `clsQuickSort` 可以用于地球上任何类型的数据。这种泛型类被称为*无界泛型类*（unbounded generic class）。无界泛型类不受限于任何特定的数据类型。\n\
  \n然而，正如你想象的，某些数据类型可能并不适合排序算法。事实上，我选择将该类的使用限制在支持 `ICompare` 接口的数据类型。以下表达式使用 `where`\
  \ 关键字为类引入了*约束*：\n\n```\nwhere T : IComparable\n```\n\n该表达式以 `where` 关键字开始，随后是泛型指示符（`T`）、冒号（:`）以及接口名称。你可以将完整的签名解释为：\n\
  \n```\npublic class clsQuickSort<T> where T : IComparable\n```\n\n“`clsQuickSort`\
  \ 可以与任何实现了 `ICompare` 的数据类型配合使用。”换句话说，`clsQuickSort`被称为*受约束泛型类*（constrained generic\
  \ class）。\n\n### 接口\n\n好了，什么是接口？*接口*是一个没有关联实现代码的引用对象。回顾第 4 章，你对*定义*（define）和*声明*（declare）这两个术语做了严格区分。程序员使用这两个术语就像它们是同义词一样，这非常糟糕。一个数据定义必须为数据分配内存。这意味着该数据的左值存在符号表中。相反，曾指出数据声明*不会*为数据分配内存。数据声明的作用仅是填充符号表中的属性列表。数据声明不提供内存。接口可以包含方法签名、属性和事件的声明。但它们并不提供实现这些方法、属性或事件的代码。正如你所见，接口是一个声明，因为它没有关联任何代码。\n\
  \n列表 12-4 中使用的 `IComparable` 接口仅支持一个方法。你可以这样编写该接口：\n\n```\npublic interface IComparable\n\
  {\n    int CompareTo(Object obj);\n}\n```\n\n每个值类型都支持 `IComparable` 接口，这意味着每个值类型的包装类都有一个\
  \ `CompareTo()` 方法，你可以用它将一个数据项与相同类型的另一个数据项进行比较。如果 `CompareTo()` 返回的 `int` 值小于 0，意味着当前实例小于\
  \ `obj`。如果返回值为 0，则两个实例相等。如果返回值为正，则当前实例大于 `obj`。\n\n例如，给定一个名为 `obj` 的对象：\n\n```\n\
  obj.CompareTo(obj)\n```\n\n如果两个对象相同，则要求返回 0。同样，如果另一个名为 `whatever` 的对象与 `obj` 不同，那么：\n\
  \n```\nobj.CompareTo(whatever)\n```\n\n必须返回一个非 0 值，且：\n\n```\nwhatever.CompareTo(obj)\n\
  ```\n\n\n\n\n必须返回一个相反符号的值。也就是说，如果 `obj.CompareTo(whatever)` 返回 `1`，那么 `whatever.CompareTo(obj)`\
  \ 必须返回 `-1`。\n\n接口是你作为程序员，对任何使用实现 `IComparable` 接口的类代码的人（包括 C# 编译器）所做出的承诺。如果你想在你编写的没有提供\
  \ `CompareTo()` 方法的类中使用 `IComparable` 接口，你的类必须为该方法编写代码，并确保它遵守该接口的返回值规则。\n\n## 为什么要使用接口？\n\
  \n在不久之前，我坐上一架私人飞机，和一位拥有私人飞行执照的朋友在一起。大约 40 年前，我也拥有飞行执照，但当时我作为一个贫穷的研究生，钱用光了，那以后再也没有开过飞机。不久前最令我惊讶的是我在朋友飞机上看到的航空电子设备（雷达和其他电子设备）。在和朋友飞行期间，我脑海中闪过一个问题：“我能用这些新的电子玩意儿驾驶这架飞机吗？”\n\
  \n实际上，飞行的基础并没有发生太大变化。你有一个控制飞机基本动作的操杆和踏板。因此，一个基础飞机类可能如下：\n\n```\n public clsPrivatePlane\
  \ : IControls\n```\n\n你可能这样声明 `IControls` 接口：\n\n```\n public interface IControls\n\
  {\n     int Yoke(int pitch, int yaw);\n     int Pedals(int direction);\n     int\
  \ Throttle(int rateOfFuelFlow);\n}\n```\n\n定义了这些基本控制后，飞行员就可以“驾驶”该类的对象，尽管联邦航空管理局（FAA）可能会对途中可能违反的规则给出几十条引用。多年来，随着新的航空电子设备的加入，你可以升级你的私人飞机类，以反映今天飞机具有的新设备。你可能会将类改为：\n\
  \n```\n public clsPrivatePlane : IControls, IAvionics\n```\n\n其中 `IAvionics` 反映今日航空设备所需的的方法和成员。如果我的朋友以后想做特技飞行，这可能需要飞机配备某些设备，该类可以再次扩展：\n\
  \n```\n public clsPrivatePlane : IControls, IAvionics, IStunts\n```\n\n（按照惯例，大多数接口声明以大写字母\
  \ `I` 开。）这里需要注意的关键点在下面的注释中解释。\n\n*** **注意**：如果创建的类没有实现较新的接口，或者对新接口使用了“空”方法，那么早期版本的飞机\
  \ `class` 仍然存在。\n\n这些空接口方法仅仅意味着当前的飞机对象不支持这些高级功能。可能更重要的是，升级后的飞机不会“破坏”早期版本飞机的代码。这就是接口的真正力量：如果处理得当，*接口将用户界面与底层代码解耦*。\n\
  \n例如，考虑我飞行时使用的 `IControls`。飞机的所有控制面都通过钢绳索连接到驾驶舱。今天许多私人飞机的 `IControls` 是基于用于控制面的液压系统。现代军用飞机的\
  \ `IControls` 是电传操纵（控制 by），控制面是由计算机控制的。然而，作为一名使用该类对象的飞行员，我可以将 `IControls` 视为一个黑盒，因为我不在乎控制面是*如何*移动的。也就是说，我不关心控制器的实现。我只关心当我触摸它们时，控制器*确实*会移动控制面。（如果你在驾驶飞机时控制面停止移动将是一个大问题！）使用接口意味着，无论我驾驶的是一架帆布覆盖的\
  \ Piper J2 还是 F/A-22 猛食兽，我都可以使用相同的代码调用 `Yoke()`、`Pedals()` 和 `Throttle()` 方法。\n\n\
  ## 使用接口\n\n如果你仔细查看[列表 12-4]中的代码，你会发现两个语句：\n\n```\n while (data[pivot].CompareTo(data[start])\
  \ >= 0 &&\n                     start <= last && end > start)\n```\n\n以及：\n\n```\n\
  \ while (data[pivot].CompareTo(data[end]) <= 0 &&\n                     end >= first\
  \ && end >= start)\n```\n\n这些中的每一个都使用了 `IComparable` 接口的 `CompareTo()` 方法来检查数据数组中的枢轴值。由于值类型的包装类实现了\
  \ `CompareTo()` 方法，因此你不需要编写代码！再次，这是通用面向对象编程（OOP）特别是接口的优良特性之一。.NET Framework 提供了你使用\
  \ `IComparable` 接口所需的代码。\n\n如果你想比较你编写的类的对象，你可能需要编写自己的 `CompareTo()` 方法。然而，即使你确实需要编写代码来实现接口，你仍然获得了接口提供的灵活性。\n\
  \n### 如何判断一个数据类型是否实现了某个接口？\n\n在[图 12.3]中，`btnSort_Click()` 事件使用 switch 语句来确定为排序方法创建哪个数据对象。这意味着单选按钮对象中提供的四种数据类型是可以被。但你如何判断你使用的数据类型是否实现了特定接口呢？有四种方法。\n\
  \n#### 自己实现接口\n\n首先，如果数据类型是你创建的对象，你必须指定它支持的接口。这就是你为 `clsSort` 类所做的。如果数据类型不是你创建的对象，你必须实现\
  \ `IComparable` 接口（以及其他几个）。\n\n#### 使用 C# 文档\n\n确定数据类型是否支持给定接口的第二种方法是查看其文档。使用 C#\
  \ 文档，你可以查询数据类型。例如，如果你从 C# 主菜单中选择`帮助`，你可以搜索 `int` 关键字。[图 12.4]显示了你查看 `int` 时看到的内容。\n\
  \n在图的右侧中间，你可以看到表格标题 .NET Type。在该列标题下方是链接 `System.Int32`。如果你点击该链接，就会看到[图 12.5]中所示的信息。\n\
  \n在 C# 部分，你可以看到 `System.Int32` 支持 `IComparable` 接口（以及其他几个）。对于字符串数据类型的处理稍有不同，因为字符串从一开始就是引用类型。如果你对\
  \ `string` 执行索引，你会被它是 .NET Framework 中 `String` 的别名。遵循该链接，你会发现[图 12.6]中所示的信息。\n\n\
  这证实了字符串类型也支持 `IComparable` 接口。使用 C# 文档是判断特定 C# 数据类型是否支持特定接口的简单方法。然而，这两种方法都不是运行时判断数据类型是否支持特定接口的方法。你如何在运行时判断？\n\
  \n#### 使用 is 运算符\n\n确定数据类型是否支持给定接口的第三种方法是使用 `is` 运算符。`is` 运算符的语法如下：\n\n\n\n\n\n\
  ```\n TypeInQuestion is InterfaceInQuestion\n```\n\n例如，如果你想查看传递给 `clsQuickSort`\
  \ 构造函数的数据类型是否支持 `IComparable` 接口，你可以在 Listing 12-4 所示的构造函数中添加以下测试代码：\n\n```csharp\n\
  \ public clsQuickSort(T[] values)\n    {\n        data = values;    // copy rvalue\
  \ of unsorted data\n        if (data[0] is IComparable)\n        {\n           \
  \ Console.WriteLine(\"data[0] is IComparable\");\n        }\n    }\n```\n\n注意 `if`\
  \ 语句中使用了 `is` 运算符。如果你在 `if` 语句上设置了断点，可以检查传递给类的每个数据类型，查看它们是否支持 `IComparable` 接口。在代码的最终版本中，你可能希望标记通过\
  \ `if` 测试的数据集并向调用者返回错误消息。\n\n在 `clsQuickSort` 中使用 `IComparable` 接口可以让你避开泛型目前不支持直接支持关系运算符的问题。如果你花一点时间，你会发现这段代码的功能与非泛型形式的类代码完全相同。\n\
  \n### 使用 as 运算符\n\n第四，你可以使用 `as` 运算符来确定对象是否支持特定接口。`as` 运算符具有以下语法形式：\n\n```csharp\n\
  \ expression as type\n```\n\n`as` 运算符实际上用于在兼容的引用数据类型之间进行转换。然而，如果无法进行转换，它将产生 `null`\
  \ 作为表达式的结果。这非常不错，因为如果转换失败，结果是 `null` 而不是抛出异常。\n\n例如，`ArrayList` 数据类型仅支持 `IList`\
  \ 接口。你可以使用以下代码片段中的代码来检查这一事实：\n\n```csharp\n ArrayList val = new ArrayList();\nIComparable\
  \ val1 = val as IComparable;\nif (val1 == null)\n{\n    Console.WriteLine(\"val1\
  \ doesn't support IComparable\");\n}\n```\n\n在这个示例中，定义了一个名为 `val` 的 `ArrayList`\
  \ 引用，然后使用 `as` 运算符检查是否可以将 `val` 转换为名为 `val1` 的 `IComparable` 对象。如果 `ArrayList` 对象不支持\
  \ `IComparable` 接口，则转换将失败且 `val1` 为 `null`。由于 `ArrayLists` 不支持 `IComparable` 接口，转换失败，失败消息被写入控制台。\n\
  \n如果你修改代码使用以下语句定义 `val`：\n\n```csharp\n int val = 5;\n```\n\n则转换将成功完成，不会显示失败消息。（你必须为\
  \ `val` 分配一个值，否则编译器会发出未初始化局部变量的错误消息。）\n\n泛型和接口经常可以合作，使给定的类对于它可以处理的数据类型变得更加灵活。显然，考虑泛型的时间是在项目的设计阶段。虽然设计时间可能会稍微增加，但对于那些实现了泛型的代码，你将获得一个更健壮的类作为回报。\n\
  \n# 总结\n\n在本章中，你学习了泛型如何减少开发新应用程序的代负担。你专注于了泛型如何让你能够以一种方式编写类和方法，使它们能够处理不同的数据类型。泛型不仅提供了代码灵活性，而且在使用强类型数据的情况下实现的，且避免了对每个表达式进行强制转换的烦恼。你还学习了如何使用接口来简化你的代码。接口向用户保证代码提供了特定的功能。关于接口及其相关主题已经写了整本书，它们你你学习。\n\
  \n# 练习\n\n你可以在附录 A 中找到以下练习的答案。\n\n1. 泛型的主要优势是什么？\n2. Listing 12-3 显示了一个名为 `ShowData()`\
  \ 的方法，你可以用它为列表框对象填充适当的数据。你会如何修改该方法以利用泛型？\n3. 接口的主要优势是什么？\n4. `clsQuickSort` 中的 `swap()`\
  \ 方法很粗糙，因为你依赖类作用域来处理交换的数据。重写 `swap()` 方法，使其仍然能够交换类的中任何类型的数据，但不依赖于类作用域。\n5. 编写商业软件的主要痛点之一是在不破坏旧版本的情况下添加新功能。本章讨论的任何主题是否让你重新思考了软件版本控制？\n\
  \n### 你在本章中学到的内容\n\n| 主题 | 关键点 |\n| :--- | :--- |\n| 泛型 | 一种增加代码灵活性但保留严格类型检查的方法\
  \ |\n| 泛型优势 | 允许一组代码处理看似无类型代码的代码；增强了代码复用 |\n| 装箱、拆箱 | 在值类型与对象之间来回转换时相关的额外开销过程 |\n\
  | 接口 | 一种在不破坏旧代码的情况下添加新类功能的灵活手段 |\n\n# 第四部分\n\n# 存储数据\n\n**第 13 章:** 使用磁盘数据文件\n\n\
