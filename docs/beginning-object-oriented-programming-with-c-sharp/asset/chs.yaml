  \  {\n            if (whichListbox == SORTED)\n                lstSorted.Items.Add(val[i].ToString());\n\
  \            else\n                lstUnsorted.Items.Add(val[i].ToString());\n \
  \       }\n    }\n```\n\n这允许你传入需要的数据数组。注意方法签名中的泛型类型指定符。接下来，你需要修改 switch 语句中使用 `ShowData()`\
  \ 的代码。例如，在 `btnSort_Click()` 事件代码中：\n\n```\ncase INTEGER:                  // 整数\n\
  \    clsQuickSort<int> iSort = new clsQuickSort<int>(iData);\n    iSort.Sort();\n\
  \    break;\n```\n\n需要添加对新泛方法的调用并移除旧的 `ShowData()` 调用。整数数据类型的后续代码为：\n\n```\ncase\
  \ INTEGER:                  // 整数\n    clsQuickSort<int> iSort = new clsQuickSort<int>(iData);\n\
  \    iSort.Sort();\n    ShowDataGeneric<int>(iData)\n    break;\n```\n\n\n\n\n这是一个带有陷阱的问题。正如我们目前讨论的接口一样，它们表示了接口中指定的保证性行为或功能。你在\
  \ `clsQuickSort` 代码中使用了 `IComparable` 接口的已知行为。你并不知道该功能是如何实现的，只知道你可以依赖它的存在。这个问题之所以具有“陷阱性”，是因为在第\
  \ 16 章讨论继承时，你还讨论了接口的的其他优势。\n\n## 练习 4 答案\n\n该解决方案意味着你必须将要交换的数据传递给方法。其中一种解决方案是\n\n\
  ```cpp\n private void swap01<T>(T[] data, int pos1, int pos2)\n    {\n        T\
  \ temp;\n        temp = data[pos1];\n        data[pos1] = data[pos2];\n        data[pos2]\
  \ = temp;\n    }\n```\n\n## 练习 5 答案\n\n你希望是如此。正如你提到的接口在飞机现代化方面可以起的作用（例如，`IControls`、`IAvionics`\
  \ 和 `IStunts`），同样的概念也适用于软件版本控制。通过将新功能封装在接口声明内部，你可以确保旧版本仍然可以工作，但它们只是无法使用新的增强功能。这种方法在增强功能改变底层数据结构（例如，可能持久化到磁盘的类成员）时特别别用。\n\
