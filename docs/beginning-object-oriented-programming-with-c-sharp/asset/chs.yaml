  \n```\nvar query = from p in numbers               // “查询”\n            where p\
  \ > lo && p < hi\n            orderby p\n            select p;\n```\n\n## 练习 3 答案\n\
  \n也许最简单的答案是，LINQ 允许你跨所有对象类型进行查询，而 SQL 仅限于数据库。因此，熟悉 SQL 的程序员可以将那部分大部分知识直接应用到 LINQ\
  \ 实现中。虽然有方法可以将 SQL 查询“强行”适配到所有对象类型，但通常会涉及大量的显式类型转换才能使其正常工作。LINQ 赋予了你处理各种对象类型的能力，同时保留了来自查询数据的强类型特性。\n\
  \n正如你在本章前面的部分看到的，经常与 LINQ 一起使用的 `var` 类型不是对象，而是假设用于实例化 `var` 变量的数据类型。\n\n# 第 16\
  \ 章\n\n## 练习 1 答案\n\n显然，这是一个需要继承解决方案的问题。基类将命名为 `clsMembers`，并将包含与所有成员相关的信息。这些数据将包括姓名和邮寄地址、账单信息等。派生类将是\
  \ `clsSenior`、`clsRegular`、`clsJunior` 和 `clsSocial`（例如：会费率、投票权、每月最低金额）。\n\n## 练习\
