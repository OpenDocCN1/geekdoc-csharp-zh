  \n### 确定记录大小\n\n首要任务是确定存储你的数据所需的记录大小。在列表 13-6 顶部你会发现以下内容：\n\n```\n // ----------------\
  \ Constants ------------------\n    const int NAMESIZES = 20;\n    const int ADDRESSSIZES\
  \ = 30;\n    const int PHONESIZES = 12;\n    const int EMAILSIZE = 100;\n    const\
  \ int DATESIZES = 10;\n    const int STRINGSINFILE = 14;\n\n    const int RECORDSIZE\
  \ = NAMESIZES            // 名\n                         + 1                    //\
  \ 中间首字母\n                         + NAMESIZES            // 姓\n                \
  \         + ADDRESSSIZES * 2     // 两个地址\n                         + NAMESIZES \
  \           // 城市\n                         + 2                    // 州缩写\n    \
  \                     + 5                    // 邮编\n                         + PHONESIZES\
  \ * 3       // 电话号码\n                         + EMAILSIZE            // 邮箱地址\n \
  \                          DATESIZES * 2        // 生日与\n                       \
  \    周年纪念\n                         + sizeof(int)          // 状态\n             \
  \              STRINGSINFILE;       // 字符串长度                                   \
  \                字节\n```\n\n常量用于设置存储数据的各种字符串的最大（最坏情况）字符数。属性方法使用这些常量来截断任何超过规定长度的字符串。你可以你可以根据需要调整它们，相应的代码会在程序重新编译后反映这些更改。使用常量的原因是，如果你需要更改数据记录中某个字段的大小，新的记录大小会自动为你更新，所有需要该新记录大小的代码也是如此。常量还让代码更易读。有两个表达式需要解释。表达式\n\
  \n```\nsizeof(int)\n```\n\n该表达式使用 `sizeof()` 运算符来确定存储 `int` 值类型所需的字节数。你可以对任何值类型使用\
  \ `sizeof()` 运算符。只需将值类型放在括号内即可。使用 `sizeof()` 运算符使你的代码对其他编译器和操作系统更具可移植性。例如，我正在写一本关于微控制器的编程书籍，其中\
  \ `int` 只有 2 字节而不是 4 字节。使用 `sizeof()` 运算符会自动处理这种数据大小的差异。\n\n### 二进制文件中的字符串长度\n\n\
  常量列表末尾表达式 `STRINGSINFILE` 是什么？简单的解释是每个记录中存储了 14 个字符串变量。要理解为什么这还需要更详细的解释。将所有常量相加的目的是确定每条记录使用的字节数。这个总和被存储在\
  \ `RECORDSIZE` 中，并在文件指针在文件中移动时，用于类中的多个地方。图 13.11 可以帮助解释为什么 `STRINGSINFILE` 的值 14\
  \ 是必要的。\n\n**图 13.11** 字符串长度字节\n\n![image](img/c13f011.jpg) 图中的第一行具有以下值：\n\n```\n\
  \ 000000  04 49 73 73 79 01 43 05    53 6D 69 74 68 0F 36 35\n```\n\n如果你将这些十六进制值解码为相应的\
  \ ASCII 值，你会得到\n\n```\n 000000  04 49 73 73 79 01 43 05  53 6D 69 74 68 0F 36 35\
  \  (Hex)\n            I  s  s  y     C      S  m  i  t  h     6  5  (ASCII)\n  \
  \       4              1     5                 15        (Decimal)\n```\n\n注意位于每个字符串之前的二进制值。数字\
  \ 4 在 Issy 之前，1 在 C 之前，5 在 Smith 之前，15 在 657 Main Street 之前。这……可能吗？每个字符串前面的数字告诉我们存储该字符串需要多少字节吗？是的，是这样。当二进制数据文件中存储字符串时，底层文件\
  \ I/O 代码需要知道每个段字符串数据关联多少字节。在某些编程语言中，存储在二进制文件中字符串所需的信息稍微复杂，被称为*字符串描述符块*（string descriptor\
  \ block）。在 C# 中，字符串描述符块简单称为长度字节。因为每个字符串都有一个长度字节，而文件中有 14 个字符串，所以你需要在总记录大小计算中考虑这些长度字节——因此，在记录大小计算的最后有\
  \ `STRINGSINFILE`（因为有 14 个字符串）。如果你相加一个记录中所有数据的所有字节要求，你会发现 `RECORDSIZE` 等于 302 字节。因此，向文件中写入几条记录后，文件将类似于图\
  \ 13.7。\n\n### 写入记录\n\n当用户想要保存记录时，她点击 `frmMain` 中的保存按钮。这导致了以下方法的调用：\n\n```\nrecs\
  \ = myData.getRecordCount();\nmyData.Open(TESTDATAFILE);\nmyData.WriteOneRecord(recs);\n\
  ```\n\n`getRecordCount()` 中的代码使用 `Seek()` 方法将文件指针置到文件末尾 (EOF)。当文件指针到达该位置时，它返回从当前位置开始的字节数（`long`\
  \ 类型）。如果你将文件的字节数除以其记录大小，就会得到已写入文件的记录数。然而，你需要完善计算，以考虑最后记录可能存在“信息间隙”的情况（参见图 13.8）。如果是那样，记录计数器必须加\
  \ 1。接下来，打开数据文件并调用 `WriteOneRecord()`，传入用于新文件的记录位置 (`recs`)。`WriteOneRecord()` 的代码非常直观：\n\
  \n```\n public int WriteOneRecord(long num)\n    {\n        int errorFlag = 1;\n\
  \n        try\n        {\n            if (myFile != null && bw != null)\n      \
  \      {   // 定位文件指针\n                myFile.Seek(num * RECORDSIZE, SeekOrigin.Begin);\n\
  \                bw = new BinaryWriter(myFile);\n                bw.Write(firstName);\
  \        // 写入数据\n                bw.Write(middleInitial);\n                bw.Write(lastName);\n\
  \                bw.Write(address1);\n                bw.Write(address2);\n    \
  \            bw.Write(city);\n                bw.Write(state);\n               \
  \ bw.Write(zip);\n                bw.Write(homePhone);\n                bw.Write(cellPhone);\n\
  \                bw.Write(workPhone);\n                bw.Write(email);\n      \
  \          bw.Write(birthday);\n                bw.Write(anniversary);\n       \
  \         bw.Write(status);\n                bw.Close();\n            }\n      \
  \  }\n        catch (IOException ex)\n        {\n            errorMessage = ex.Message;\
  \    // 查看它。\n            errorFlag = 0;\n        }\n        return errorFlag;\n\
  \    }\n```\n\n\n\n这段代码检查你是否持有一个有效的 `FileStream` 对象（`myFile`），然后将文件指针置到文件中写入新记录的位置（即文件中的第\
  \ `num * RECORDSIZE` 字节处）。随后，代码会创建一个 `BinaryWriter` 对象（`bw`）并开始将数据写入文件。完成后关闭文件，你的操作就完成了。（在完成操作后关闭文件是个好习惯。在网络环境中，如果其他人正在使用某些文件，你将无法访问它们。）代码被封装在一个\
  \ `try-catch` 块中，以防发生错误。你可以在 `catch` 块中编写错误日志功能，以使应用程序更加健壮。`BinaryWriter` 对象 `bw`\
  \ 写入每个字符串都会自动写入该字符串的长度字节。那么状态呢？它是一个 `int` 而不是字符串，所以它没有长度字节。`bw` 如何知道写入多少字节？通用语言运行时（CLR）知道每个值类型关联的字节数，因此\
  \ `bw` 会为 `status` 写入四个字节。\n\n## 读取记录\n\n读取记录几乎是写入记录的镜像。这里显示了 `ReadOneRecord()`\
  \ 的代码：\n\n```cpp\n public int ReadOneRecord(long num)\n    {\n        try\n    \
  \    {\n            if (myFile != null)\n                myFile.Close();\n\n   \
  \         myFile = new FileStream(fileName, FileMode.Open);\n            br = new\
  \ BinaryReader(myFile);\n\n            if (myFile != null && br != null)\n     \
  \       {\n               // Position 文件指针\n                myFile.Seek(num * RECORDSIZE,\
  \ SeekOrigin.Begin);\n                firstName = br.ReadString();\n           \
  \     middleInitial = br.ReadString();\n                lastName = br.ReadString();\n\
  \                address1 = br.ReadString();\n                address2 = br.ReadString();\n\
  \                city = br.ReadString();\n                state = br.ReadString();\n\
  \                zip = br.ReadString();\n                homePhone = br.ReadString();\n\
  \                cellPhone = br.ReadString();\n                workPhone = br.ReadString();\n\
  \                email = br.ReadString();\n                birthday = br.ReadString();\n\
  \                anniversary = br.ReadString();\n                status = br.ReadInt32();\n\
  \                br.Close();\n\n            }\n        }\n        catch (IOException\
  \ ex)\n        {\n            errorMessage = ex.Message;\n            return 0;\n\
  \        }\n\n        return 1;\n    }\n```\n\n再次，使用一个名为 `myFile` 的 `FileStream`\
  \ 对象将文件指针移动到文件中你想要读取数据的位置。然后，代码创建了一个 `BinaryReader` 对象（`br`）用于读取数据。`BinaryReader`\
  \ 类提供了读取 C# 提供的每个值类型的方法。最后两个语句显示了如何读取一个字符串，然后读取一个 `int` 数据类型：\n\n```cpp\n anniversary\
  \ = br.ReadString();\nstatus = br.ReadInt32();\n```\n\n每个读取语句都会将其数据分配到类中相应的成员中。读取语句的顺序*必须*与写入语句中使用的顺序一致。如果你搞乱了变量及其数据类型的顺序，不要惊讶数据也会随之错乱。数据读取完毕后，文件会立即关闭。理解这个程序的最佳方法是亲自输入代码，并单步执行数据的写入和读取。确保你使用了调试器的“单步进入”（F11）功能，这样你就可以看到每个方法的工作原理。\n\
  \n# 序列化与反序列化\n\n在 OOP 程序中，读取和写入对象的数据（如上一节中的 `myData`）是非常常见的，因此 C# 为这些任务提供了一种简单的机制。在在上一个程序中，每当你向磁盘写入一个新朋友的信息时，你实际上是在将名为\
  \ `myData` 的 `clsRandomAccess` 对象的状态保存到磁盘。简单来说，*序列化*是将对象的状态保存或持久化到磁盘的行为。*反序列化*是通过将存储在磁盘上的信息读回该类的对象中，来重构对象状态的行为。这一过程可以减少在应用程序中传递对象数据的负担。\n\
  \n由于原始数据类型（`byte`、`char`、`int`、`long`、`double`、`string` 等）默认不可序列化，你必须在要序列对象的类源文件顶部使用\
  \ `[Serializable]` 特性显式地声明该对象是可以序列化的。这会将对象的数据标记为可序列化。\n\n## 省时小贴士\n\n如果你在编译程序后才使用\
  \ `[Serializable]` 特性将类标记为可序列化，程序将失败。错误信息会告诉你一个（或多个）类成员没有设置 `[Serializable]` 特性。如果你看到这个错误信息，回去给类文件添加\
  \ `[Serializable]` 是没有用的。这个故事的教训是：在编译之前不要忘记向类文件中添加 `[Serializable]` 特性。下一个“尝试一下”将展示如何对对象进行序列化，然后将数据读回对象（反序列化）。\n\
  \n## 尝试一下：序列化-反序列化 (Chapter13ProgramSerialization.zip)\n\n图 13.12 显示了一个使用序列化程序的示例运行。\n\
  \n图 13.12 序列化程序\n\n![image](img/c13f012.jpg)当用户点击“Serialize”按钮时，程序会收集类信息（如名称、电子邮件地址和状态），并将数据序列化到名为\
  \ `Test.bin` 的磁盘文件中。点击“Display”按钮将从磁盘文件反序列化数据并显示在 listbox 对象中。要实现此程序：\n\n1. 以常规方式创建一个新项目。\n\
  2. 通过添加表单对象创建用户界面（参考图 13.12），或下载代码文件 Chapter13ProgramSerialization.zip。\n\n***工作原理***`frmMain`\
  \ 的源代码列在列表 13-7 中。\n\n列表 13-7: 序列化数据的程序源码 (frmMain.cs)\n\n\n\n\n\n```cs\n using\
  \ System;\nusing System.Windows.Forms;\n\npublic class frmMain : Form\n{\n    clsSerial\
  \ myFriend = new clsSerial();    // 要序列化的对象\n\n    private Label label1;\n    private\
  \ TextBox txtName;\n    private TextBox txtEmail;\n    private TextBox txtStatus;\n\
  \    private Label label3;\n    private Button btnSerial;\n    private Button btnDisplay;\n\
  \    private Button btnClose;\n    private ListBox lstOutput;\n    private Label\
  \ label2;\n    #region Windows code\n\n    public frmMain()\n    {\n        InitializeComponent();\n\
  \    }\n\n    public static void Main()\n    {\n        frmMain main = new frmMain();\n\
  \        Application.Run(main);\n    }\n\n    private void btnSerial_Click(object\
  \ sender, EventArgs e)\n    {\n        int flag;\n\n        MoveTextToClass(myFriend);\
  \     // 将文本框内容移动到数据\n\n        flag = myFriend.SerializeFriend(myFriend);\n   \
  \     if (flag == 1)\n        {\n            MessageBox.Show(\"Data Serialized successfully\"\
  , \"Data Write\");\n        }\n        else\n        {\n            MessageBox.Show(\"\
  Serialization failure\", \"Data Error\");\n        }\n    }\n\n    private void\
  \ btnDisplay_Click(object sender, EventArgs e)\n    {\n        clsSerial newFriend\
  \ = new clsSerial();\n        newFriend = newFriend.DeserializeFriend();\n     \
  \   lstOutput.Items.Clear();\n        lstOutput.Items.Add(newFriend.Name);\n   \
  \     lstOutput.Items.Add(newFriend.Email);\n        lstOutput.Items.Add(newFriend.Status.ToString());\n\
  \    }\n\n    private void MoveTextToClass(clsSerial obj)\n    {\n        bool flag;\n\
  \        int val;\n\n        obj.Name = txtName.Text;\n        obj.Email = txtEmail.Text;\n\
  \        flag = int.TryParse(txtStatus.Text, out val);\n        if (flag == false)\n\
  \        {\n            MessageBox.Show(\"Must be 1 or 0\", \"Input Error\");\n\
  \            txtStatus.Focus();\n            return;\n        }\n        obj.Status\
  \ = val;\n    }\n\n    private void btnClose_Click(object sender, EventArgs e)\n\
  \    {\n        Close();\n    }\n}\n```\n\n用户通过三个文本框对象输入数据。（为了保持程序简洁，除了变量状态外，未对输入进行任何验证。）`MoveTextToClass()`\
  \ 方法简单地将这三个属性复制到 `myFriend`对象的关联成员中。`SerializeFriend()` 方法将信息序列化到磁盘。Listing 13-8\
  \ 显示了 `clsSerial` 的代码。显示（Display）按钮调用 `DeserializeFriend()` 方法从磁盘文件反序列化数据。随后，类的成员将显示在列表框对象中。Listing\
  \ 13-8 显示了 `clsSerial` 类的源代码。\n\nListing 13-8: `clsSerial` 的源代码 (`clsSerial.cs`)\n\
  \n```cs\n using System;\nusing System.IO;\nusing System.Runtime.Serialization;\n\
  using System.Runtime.Serialization.Formatters.Binary;\n\n[Serializable]        //\
  \ 别忘了这个\nclass clsSerial\n{\n    //------------------- 实例成员 ---------------\n  \
  \  private string name;\n    private string email;\n    private int status;\n\n\
  \    //------------------- 属性方法 ---------------\n    public string Name\n    {\n\
  \        get\n        {\n            return name;\n        }\n        set\n    \
  \    {\n            name = value;\n        }\n    }\n    public string Email\n \
  \   {\n        get\n        {\n            return email;\n        }\n        set\n\
  \        {\n            email = value;\n        }\n    }\n    public int Status\n\
  \    {\n        get\n        {\n            return status;\n        }\n        set\n\
  \        {\n            status = value;\n        }\n    }\n    //-------------------\
  \ 辅助方法 ----------------\n    //------------------- 普通方法 ---------------\n\n    /*****\n\
  \     * 目的: 序列化此类类的内容\n     *\n     * 参数列表:\n     *  clsSerial myFriend      序列化一个实例\n\
  \     *\n     * 返回值:\n     *  int                     错误时为 0，否则为 1\n     *****/\n\
  \    public int SerializeFriend(clsSerial myFriend)\n    {\n        try\n      \
  \  {\n            BinaryFormatter format = new BinaryFormatter();\n            FileStream\
  \ myStream = new FileStream(\"Test.bin\",\n                                    \
  \  FileMode.Create);\n            format.Serialize(myStream, myFriend);\n      \
  \      myStream.Close();\n        }\n        catch (Exception ex)\n        {\n \
  \           string buff = ex.Message;\n            return 0;\n        }\n      \
  \  return 1;\n    }\n\n    /*****\n    * 目的: 从文件反序列化此类实例\n    *\n    * 参数列表:\n \
  \    *  n/a\n    *\n    * 返回值:\n     *  clsSerial      带有数据的类实例\n     *****/\n \
  \   public clsSerial DeserializeFriend()\n    {\n        clsSerial temp = new clsSerial();\n\
  \        try\n        {\n            BinaryFormatter format = new BinaryFormatter();\n\
  \            FileStream myStream = new FileStream(\"Test.bin\",\n              \
  \                        FileMode.Open);\n            temp = (clsSerial)format.Deserialize(myStream);\n\
  \            myStream.Close();\n        }\n        catch (Exception ex)\n      \
  \  {\n            string buff = ex.Message;\n            return null;\n        }\n\
  \        return temp;\n     }\n}\n```\n\n\n\n\n鉴于对象的序列化和反序列化如此简单，你为什么不使用这种程序，而不是之前讨论的随机访问程序呢？毕竟，随机访问程序也是将对象的状态保存到磁盘上，但它需要更多的代码来实现这一点。\n\
  \n首先，随机访问程序并不是专门为简单地序列化对象而设计的。相反，它的目的是作为一个基于事务的结构，其中对象被持久化地存储。对象的序列化更多地用于临时存储对象的状态，以便以后恢复。该对象的状态可能会传递给该对象的其他用户（例如\
  \ Web 应用程序中的会话状态），或用于在应用程序重新加载时重新建立应用程序的状态。\n\n其次，你可能不想将类中的所有信息都进行序列化。类中可能包含你不希望别人看到的敏感信息。尽管序列化后的文件是二进制格式，但你仍然可以使用记事本读取其很大一部分内容。\n\
  \n如果你想将类的某个特定成员从对象状态的序列化中排除掉，你可以在类定义中使用以下语句：\n\n```\n[NonSerialized] string cellPhone;\n\
  ```\n\n此语法将手机号码标记为排除在要序列化磁盘的属性之外。\n\n第三个问题是，如果你的类包含了其他（非原始）数据类型，例如你定义的自定义类，这些类也必须设置\
  \ `Serializable` 属性并进行编译。如果你可以访问这些类的源码，这可能不是问题。然而，如果你使用的是某个没有源码的商业产品中的类，你可能无法将该对象标记为可序列化。\n\
  \n# MDI、菜单和文件对话框\n\n本节将向你如何使用多文档界面（MDI）、C# 菜单对象和文件对话框对象。\n\n下一个“尝试一下”（Try It Out）将扩展你目前为止编写的基础表单程序。在这个程序中，你将学习如何像大多数复杂应用程序那样在表单内调用表单。\n\
