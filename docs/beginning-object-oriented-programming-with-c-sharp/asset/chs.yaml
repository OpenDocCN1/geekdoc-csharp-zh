  \ `txtStart` 和 `txtEnd` 文本框对象中输入了起始和结束值。（TryParse() 方法在第 6 章中详细讨论过，因此无需重复讨论。）如果两个\
  \ `TryParse()` 方法执行成功，则用户输入可以转换为变量 `start` 和 `end` 的数字字符。这意味着你已经完成了第 2 章讨论的五个程序步骤中的输入步骤。\n\
  \n现在复查看 for 循环中的代码：\n\n```csharp\n for (i = start; i <= end; i++)\n    {\n     \
  \ buff = string.Format(\"{0, 5}{1, 20}\", i, i * i);\n      lstOutput.Items.Add(buff);\n\
  \    }\n```\n\n良好循环的第一个条件是你必须设置循环的初始状态。在本示例中，for 循环的第一个表达式（`i = start`）将控制循环的变量（`i`）的起始状态设置为初始值（`start`）（这对应于图\
  \ 7.1;\n```\n\n\n\n这是由 `string` 类提供的一种特殊格式化方法。该方法的参数是其用处的关键。`Format()` 方法的第一个参数始终是一个带引号的字符串字符串字面量。在那个字符串内部，有一组关于你想要如何格式化数据的选项列表。显示的第一个选项是\
  \ `{0, 5}`。该选项表示取第一个参数（即参数 `0`），并将其在一个 5 个字符宽的字段中右对齐。（程序员几乎对所有内容都从零开始，所以第一个参数实际上是零号参数。）第二个选项是\
