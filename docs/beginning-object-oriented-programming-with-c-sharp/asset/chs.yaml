  \ 类的代码非常简单，但使用了委托；这是我们在第 15 章中介绍过的话题。）\n\n`SqlDataSourceEnumerator` 是一个库类，允许你遍历机器上的服务器列表。`foreach`\
  \ 循环将找到的服务器添加到组合框中，以便在表单上显示。`frmServerSelect` 如图图 14.11 所示。\n\n图 14.11 选择使用的数据库\n\
  \n![image](img/c14f011.jpg)\n\n如果你遵循 列表 14-2 中的代码，你会发现当表单首次显示给用户时，只有列出服务器的组合框是可见的。这是因为在用户告诉你是他们想要使用的服务器之前，你无法列出可用数据库。显示数据库组合框会引起困惑，因为在用户选择服务器之前，组合框中无法显示任何内容。在选择服务器后，在填充了该服务器找到的数据库之后，你可以将\
