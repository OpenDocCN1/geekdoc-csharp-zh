  \ `btnSubmit_Click()` 事件中的所有语句放在 `try-catch` 块中是有意义的。这至少提供了一种防止程序崩溃的方法。此外，如果 `TryParse()`\
  \ 失败，可以检查每个文本框的内容，而不是仅仅将付款设置为零。另一种可能性是将 `txtPayment.Text` 属性设置为“interest rate error”并从\
