  \ .\n\n也许你应该问自己的问题是：“为什么我要买这本书而不是别人的书？”这其中涉及许多因素 ，但只有一个真正起决定作用 ：这本教材囊括的技术 、实例和方法倾注了我与数千名学生打交道过程中积累下来的经验\
