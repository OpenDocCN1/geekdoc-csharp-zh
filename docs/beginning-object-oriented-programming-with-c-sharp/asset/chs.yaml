  \n        days = newYears.DayOfYear - myTime.DayOfYear;\n        txtDaysToNewYears.Text\
  \ = days.ToString();\n    }\n\n    private void btnRefresh_Click(object sender,\
  \ EventArgs e)\n    {\n        UpdateTimeInfo();\n    }\n\n    private void btnClose_Click(object\
  \ sender, EventArgs e)\n    {\n        Close();\n    }\n}\n```\n\n#### 工作原理\n\n\
  列表 5-2 展示了说明多种日期和时间格式化选项的代码体。程序首先通过 `using` 关键字告知 Visual Studio 它计划要使用的引用。然后代码开始定义\
  \ `frmMain` 类。`#region` 和 `#endregion` 是 C# 程序指令，允许你将代码组织成块。\n\n`#region` 和 `#endregion`\
