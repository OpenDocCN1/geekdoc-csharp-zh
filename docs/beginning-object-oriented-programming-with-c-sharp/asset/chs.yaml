  \            {\n                temp = myDeck.getCardPip(cardIndex);\n         \
  \       if (temp.Length == 0)\n                {\n                    MessageBox.Show(\"\
  Error reading deck.\", \"Processing Error\");\n                    return;\n   \
  \             }\n                buff += temp + \" \";\n                cardIndex++;\n\
  \            }\n            lstDeck.Items.Add(buff);\n        }\n        lstDeck.Items.Add(\"\
