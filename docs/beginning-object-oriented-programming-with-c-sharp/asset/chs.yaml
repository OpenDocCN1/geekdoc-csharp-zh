- "# C# 面向对象编程入门指南\n\n\n# 第 16 章\n# 第 17 章\n# 第 18 章\n\n# 引言\n## 本书目标读者\n## 本书涵盖内容\n\
  ## 本书的结构\n## 使用本书所需的准备\n## 约定\n## 源代码\n## 错误列表\n## p2p.wrox.com\n## 广告\n\n# 第一部分：入门\n\
  \n## 第 1 章：C# 简介\n# 第 2 章：理解对象\n\n---\n\n# 第 1 章：C# 简介\n\n### 你将在本章中学到：\n* 如何下载\
  \ Visual Studio\n* 如何安装 Visual Studio 专业版\n* 如何创建一个简单的项目\n* 如何在 Visual Studio 中开发小型程序\n\
  * Visual Studio IDE 中的功能\n* 运行 Visual Studio 程序\n\n欢迎来到面向对象编程和 C# 的世界！本书的主要目标是使用微软的\
  \ C# 编程语言来教你面向对象编程（或 OOP）。本书假设你之前在任何语言中都没有编程经验，并且对 OOP 一无所知。因此，本书应被视为一本“入门级”教材。\n\
  \n如果你拥有编程经验并且对 OOP 有一定了解，那也没关系。拥有这些经验会让你事半功倍。然而，出于许多原因，我仍然鼓励你从头到尾阅读这本书。首先，本书代表了\
  \ 25 年编程和教学经验的结晶。对于如何解释复杂主题使其易于理解，我清楚哪些方法有效。阅读每一章都能为你提供理解下一章的工具。其次，我可能在某一个章节介绍某些主题，然后在很后的一个章节中高度依赖这些主题。换句话说，学习\
  \ OOP 和 C# 的过程是基于之前介绍的主题来引入新主题的。显然，在处理后续内容之前，你必须掌握之前的内容。最后，我使用的编程示例也是建立在之前的程序示例所介绍的概念之上的。如果你实验过书中之前介绍的程序，理解后来的程序示例将会更容易。\n\
  \n还有一点：你不能仅仅通过阅读相关书籍来学习编程。你必须亲身投入并开始编写。因此，每章末尾都有练习，旨在帮助你磨练编程技能。如果你尝试根据你想要解决的实际问题创建自己的程序，学习过程会变得更有趣。如果第一次尝试没有立即取得成功，请不要担心。你应该准备好犯很多“愚蠢”错误……你知道的，就是那种在发现错误后，用手掌撞击额头并说“我怎么能犯这么愚蠢的错误！”错误。别担心……我们都经历过。这些错误只是成为程序员道路的一部分，你应该预期自己会犯下应有的错误。然而，请坚持下去，阅读这本书，你会发现事情进展的速度快得让你惊讶。事实上，我认为你会发现编程是一项真正乐趣的爱好。\n\
  \n# 面向对象编程 (OOP) 简史\n\n许多人认为 OOP 是 20 世纪 80 年代的产物，是斯特尔斯特斯特普（Bjarne Stroustrup）通过创建\
  \ C++ 语言将 C 语言引入面向对象世界的工作。实际上，`SIMULA 1` (1962) 和 `Simula 67` (1967) 是两个最早的面向对象语言。Simula\
  \ 语言的工作是由挪威奥斯陆挪威计算中心的奥勒-约翰·达尔（Ole-John Dahl）和克里斯汀·尼加德（Kristen Nygaard）完成的。尽管 OOP\
  \ 的大多数优势在早期的 Simula 语言中就已经具备，但直到 C++ 在 20 世纪 90 年代站稳脚跟后，OOP 才开始兴盛。\n\nC 是 C++ 的父语言，人们常说\
  \ C 强大到可以让你多次射自己的脚。而另一方面，C++ 不仅强大到让你射自己的脚，而且让你把整条腿炸掉。OOP 的开发始于 1991 年 1 月，高斯（Gosling）、比·乔（Bill\
  \ Joy）、帕特里克·诺顿（Patrick Naughton）等人在科罗拉多州的阿斯彭见面讨论想法。他们希望开发能够被控制的智能设备，并认为 C++ 无法胜任。结果是\
  \ Oak（用橡树命名），它最终演变成了 Java 语言。（Oak 必须重命名，因为开发者发现已经存在一种同名的语言了。）\n\n在世界维网增长的推动下，Java\
  \ 迅速流行起来。在这两种情况下，这种快速增长部分是因为在网络上运行 Java 程序所需的“核心”功能成为了各种网络浏览器的不可或缺的一部分。随着 Java 增强了改进的网络功能，互联网以光速发展起来。\n\
  \n对许多程序员来说，C# 是微软对 Java 的回应。有些人甚至会说 C# 是微软固执地推广一种并非其开发的语言的结果。这种情绪有点太刻薄了。微软开发 C#\
  \ 有充分的理由，其中最重要的一点是它想要托管环境中类型安全的程序。你现在可能不理解这意味着什么，但随着你学习 C#，这将会变得清晰。\n\nC# 为你提供了一种健强大的面向对象编程语言和一组令人印象深刻的工具，来应对任何编程任务。无论你想开发桌面、分布式、Web\
  \ 还是移动应用程序，C# 都能胜任这项任务。\n\n随着你对 C# 的熟悉，你会欣赏它相对较少的关键字、简洁的语法和易于使用的开发环境。你会发现用 C# 编写的程序可以在其他程序中重用。最后，你可能会发现，熟悉\
  \ C# 的程序员有很多就业工作机会。\n\n# 安装 C#\n\n如果你已经购买并安装了 Visual Studio 2012 和 C#，可以跳过本节。如果你还没有安装\
  \ C#，本节将告诉你如何下载和安装 Visual Studio 版本的 Visual Studio。Visual Studio 是微软免费提供的 C# 的修改版本。虽然\
  \ Express 版本的 C# 缺少 Visual Studio 商业版中的某些功能，但你应该使用 Visual Studio 编译并运行书中的所有示例程序。\n\
  \n目前，Visual Studio Express 版本需要使用 Windows 8。如果你没有 Windows 8，可以下载 Visual Studio 专业版的试用版。通过注册试用版，你可以使用\
  \ Visual Studio 专业版 90 天。当你确定应该在 C# 中进行所有的开发工作时（你会这么做的），就可以购买 Visual Studio 的完整版。当然，如果你以后购买了\
  \ Windows 8，你也可以随时下载 Express 版本的 Visual Studio。\n\n\n\n\n\n由于 Windows 8 刚发布不久，你可能还没有在使用\
  \ Windows 8，因此必须使用 Visual Studio Professional 预览版。下一节将讨论如何下载 Visual Studio Professional\
  \ 预览版。\n\n## 下载 Visual Studio Professional\n\n在本书编写时，你可以访问 `http://www.microsoft.com/visualstudio/11/en-us/downloads#professional`\
  \ 下载 Visual Studio Professional 版本。下载页面看起来应该与图 1.1 所示类似。如你仔细观察该图所见，下载的是 Visual Studio\
  \ Professional 的 90 天试用版。点击 `Install Now`（立即安装）按钮开始安装过程。\n\n图 1.1 Visual Studio\
  \ Professional 下载页面\n\n![1.1](img/c01f001.jpg)\n\n根据你的系统速度和互联网连接情况，下载并安装过程中使用的 6GB\
  \ 多字节文件可能需要超过 1 小时。你必须先同意许可条款，如图 1.2 所示。\n\n图 1.2 许可条款对话框\n\n![1.2](img/c01f002.jpg)\n\
  \n在你同意许可条款后，程序会显示一个对话框，告知你即将安装的项目。除非你受到磁盘空间的限制，否则你应该勾选所有选项，以便它们全部安装。否则，你可以取消勾选那些不想安装的选项。参见图\
  \ 1.3。\n\n图 1.3 安装项目检查列表\n\n![1.3](img/c01f003.jpg)\n\n做出选择后，点击 `Install`（安装）按钮启动安装过程。你的显示界面将类似于图\
  \ 1.4 所示……并持续很一段时间。\n\n图 1.4 安装过程\n\n![1.4](img/c01f004.jpg)\n\n> **注意**：在我执行安装过程中，安装软件检测到我系统上的某些\
  \ Windows 软件已过时。它询问是否想要安装自我上次更新系统以来发布的更新和补丁。由于列表还包含了几个针对 Visual Studio 的补丁，我选了是。我花了近\
  \ 2 小时时间下载并更新软件。然而，当更新完成后，Visual Studio 安装程序直接从上次中断的地方继续，安装顺畅进行。虽然这确实需要一些时间，但如果安装程序提供该选项，你应该更新你的软件。\n\
  \n最终，安装过程会结束的……诚不！如果你在安装过程中更新了系统软件，安装程序会在某个时刻询问你是否要重启电脑。如果被这样询问，请回答“是”。系统重启且软件安装完成后，你应该会在桌面上看到一个标记为\
  \ Visual Studio 的新图标。你应该双击该新图标并启动 Visual Studio。\n\n## 使用 C# 的测试程序\n\n尽管一切似乎已安装妥当，但在你实际编写程序并尝试运行它之前，你无法确定。这就是本章这一节的目的。这个程序在你保持对安装成功的前提下，可以编写的最简单的程序了。\n\
  \n在你双击桌面上的 Visual Studio 图标后，你应该看到一个与图 1.5 所示类似的 Visual Studio 启动界面。\n\n图 1.5 Visual\
  \ Studio IDE\n\n![1.5](img/c01f005.jpg)\n\n## 创建项目\n\n将光标移动到屏幕左上方，从主程序菜单中选择 `File`（文件）\
  \ → `New`（新建） → `Project`（项目）菜单选项，如图 1.6 所示。\n\n图 1.6 创建项目\n\n![1.6](img/c01f006.jpg)\n\
  \n从菜单中选择 `New`（新建）。你的程序发生了变化，如图 1.7 所示。\n\n图 1.7 新项目对话框\n\n![1.7](img/c01f007.jpg)\n\
  \n从模板中选择 `Windows Forms Application`。确保你已选择了 `Windows Forms Application`。你应该输入你想要的名称。勾选\
  \ `Create directory`（创建目录）并让 Visual Studio 在 `C:\\Temp` 创建目录。输入名称后点击 `OK`。\n\n##\
  \ C# 集成环境\n\n现在你应该会在屏幕上看到类似于图 1.8 的界面，你在本书时将在这里花费大量时间。它被称为集成开发环境，或 IDE，因为编写 C# 程序所需的几乎每个编程工具在那里可用。\n\
  \n图 1.8 Visual Studio IDE\n\n![1.8](img/c01f008.jpg)\n\n### 主要 IDE 窗口\n\n图 1.8 将屏幕分为三个窗口。左侧窗口显示\
  \ Visual Studio 工具箱（Toolbox），默认情况下显示 Visual Studio 提供的某些对象。如果你仔细观察，可以发现工具箱提供了你可以在程序中使用的各种对象。\n\
  \n中间窗口被称为源代码窗口（Source window），当前显示一个未装饰的 Visual Studio 表单对象。（微软将该窗口称为表单设计器窗口 Forms\
  \ Designer window。）如图 1.8 所示，表单尚未放置其他对象……目前。也就是说，你还没有从工具箱向表单添加任何其他对象（如文本框或按钮）。你将在本章后面的“向\
  \ Windows 表单添加工具箱对象”节中改变这一点。\n\n\n\n\nIDE 的右侧目前显示两个子窗口。顶部的子窗口显示 `Solution Explorer`（解决方案管理器）。简单来说，`Solution\
  \ Explorer` 显示了项目当前的开发状态。它显示了程序拥有的表及其引用，以及在后续章节中讨论的其他信息。\n\n`Solution Explorer`\
  \ 窗口下方是 `Properties`（属性）窗口。`Properties` 窗口的作用是显示与 `Source`（源代码）窗口中当前焦点对象的属性。如果你仔细查看\
  \ `Source` 窗口中图 1.8 中的表单，你会发现它边缘有几个小小的白框。这些被称为 `sizing boxes`（尺寸缩放框），其目的是允许你更改它们所附对象的大小。然而，尺寸缩放框还会显示\
  \ `Source` 窗口中当前哪个对象正处于 Visual Studio 的关注点或“焦点”。`Source` 窗口中获得焦点的任何对象也是 `Properties`\
  \ 窗口显示的对象。在图 1.8 中，`Properties` 窗口显示的属性适用于 `Source` 窗口中显示的表。Visual Studio 始终维持 `Source`\
  \ 窗口中焦点对象与 `Properties` 窗口中显示的信息之间的这种关系。\n\n### 使用源代码窗口\n\n如果你在 `Solution Explorer`\
  \ 窗口中右键点击 `Form1.cs`，会弹出一个菜单，你可以从中选择查看右键点击的文件的源代码。你可以移动到 `Solution Explorer` 栏并点击源代码图标，查看\
  \ Visual Studio 直到为止为你编写的代码。正如你在图 1.9 中所所示，你还可以使用 `F7` 键查看该文件的源代码。\n\nFigure 1.9\
  \ 右键点击表单文件名\n\n![1.9](img/c01f009.jpg)\n\n右键点击图 1.9 中所示文件名相关的代码在图 1.10 中给出。注意 `Source`\
  \ 窗口顶部又增加了另一个标签。一个标签显示为 `Form1.cs [Design]`，而另一个标签显示为 `Form1.cs`。第一个标签是源代码模式，向你显示开发中程序的代码。即使你还没有编写任何代码，Visual\
  \ Studio 已经在你背后偷偷为你写了一些程序代码！你可以在图 1.10 中看到 `TemplateProgram` C# 源代码。第二个标签用于设计模式下的表单视图。（设计模式早些在图\
  \ 1.8 中显示过。）\n\nFigure 1.10 文件的源代码\n\n![1.10](img/c01f010.jpg)\n\n此时你不需要理解图 1.10\
  \ 中显示的代码。（后略）\n\n### 向 Windows 表单添加工具箱对象\n\n一个空空如也的表单是无趣的。现在更改表单，使其在程序运行时显示消息 `My\
  \ First Program`。你需要在向图 1.8 中 `Source` 窗口中显示的表单对象上添加一个 label（标签）来承载你的程序消息。向表单添加标签对象有两种方法。第一，如图\
  \ 1.11 所示，你可以点击 `Toolbox`（工具箱）中的标签对象，按住左鼠标键的同时将标签拖到表单上并释放鼠标键。第二，你可以直接双击 `Toolbox`\
  \ 中的标签对象。鼠标双击会导致 Visual Studio 在 `Source` 窗口中显示的表单左上角附近放置一个标签对象。\n\nFigure 1.11\
  \ 向表单添加标签对象\n\n![1.11](img/c01f011.jpg)\n\n你应该尝试这两种方法在表单上放置标签。当你看到这两个操作都能在表单上放置标签后，点击其中一个标签，将\
  \ Visual Studio 的焦点移动到你刚刚点击的标签上。你知道这是真的，因为你看到你刚刚点击的标签上出现了尺寸缩放框。因为在这个测试程序中只需要一个标签，请按键盘上的\
  \ `Delete` 键。标签将从表单上移除。\n\n你可以按住左鼠标键点击 `Source` 窗口中的标签，并将其拖到你希望它出现在表单对象上的任何位置。当你将标签对象放置在表单所需的位置后，只需释放鼠标键即可。\n\
  \n### 修改标签对象的文本\n\n在表单上放置标签对象后，你可以为标签设置文本。Visual Studio 自动执行的操作之一是调整标签的大小，使其恰好容纳标签文本。考虑到\
  \ Visual Studio 使用的默认字体大小，标签的默认高度为 13 像素（`pixel` 是你显示设备屏幕上的一个点或光点）。如果你更改了标签的字体大小，标签的高度会自动调整。\n\
  \n实际上，我不喜欢自动调整大小。要关闭自动调整，转到右侧的 `Properties` 窗口并将 `AutoSize` 属性从 `True` 改为 `False`，如图\
  \ 1.12 所示。你可能需要滚动 `Properties` 窗口的内容才能看到 `AutoSize` 属性。点击 `AutoSize` 文本框右侧的向下箭头显示可选选项。选择\
  \ `False`。标签的自动调整大小已关闭。\n\nFigure 1.12 修改 AutoSize 属性\n\n![1.12](img/c01f012.jpg)\n\
  \n设置 `AutoSize` 为 `False` 后，你可以通过点击 `Source` 窗口中末端和角处的尺寸缩放框来调整标签对象的大小。你可以通过点击标签边缘中间的尺寸缩放框并向右拖动来增加标签宽度，直到达到所需的尺寸。然后释放左鼠标键，如图\
  \ 1.13 所示。\n\nFigure 1.13 调整标签大小\n\n![1.13](img/c01f013.jpg)\n\n设置标签对象的大小后，你可以将标签的\
  \ `Text` 属性设置为任何你想显示在标签中的内容。在你的示例中，你想要文本 `My first program`。目前标签的 `Text` 属性是 `label1`，这不是你想要的。滚动\
  \ `Properties` 窗口内容找到标签对象的 `Text` 属性，将其更改为 `My first program` 并按 `Enter` 键。（如果属性窗口由于某种原因“消失”，按\
  \ `F4` 键调回。）更改标签的 `Text` 属性如图 1.14 所示。注意 `Properties` 窗口标题下方的第一行显示了 `Source` 窗口中当前获得焦的对象名称（图\
  \ 1.13 中的 `label1`）。\n\nFigure 1.14 修改标签的 Text 属性\n\n![1.14](img/c01f014.jpg)\n\n\
  \n\n\n默认情况下，标签对象的文本位置使其出现在标签的左上角。如果将 `AutoSize` 设置为 `True`，则你无法通过标签对象对文本进行定位；它将自动为你设置。然而，由于你关闭了自动调整，你可以在标签内的任何位置对文本定位。图\
  \ 1.15 展示了如何使用属性窗口中的 `TextAlign` 属性来完成此操作。如果你仔细查看图 1.15，你会发现 `TextAlign` 目前被设置为\
  \ `TopLeft`。在一个可以调整大小的标签中，你有九个位置可以放置文本。你希望在标签对象的中心将文本右对齐。如果你查看光标在图 1.15 中的所在位置，点击该框即可使标签对象中的文本右对齐。\n\
  \n图 1.15 更改标签对象的 `TextAlign` 属性\n\n![1.15](img/c01f015.jpg)\n\n## 运行程序\n\n这是你目前测试\
  \ C# 安装时需要做的所有工作。如果你现在可以运行程序，说明你可能已经正确安装了 C#。运行程序有两种简单的方法。最简单的是按下 `F5` 键。如果你这样做，程序应该会在几秒后出现在屏幕上，你的消息居中显示在标签对象。\n\
  \n第二种方法是点击“运行程序”图标。如果你仔细查看图 1.11，在表单顶部 `DEBUG` 菜单下方，你可以看到一个小三角形，后面跟着 `Start` 单词。（在你的屏幕上，三角形是绿色的。）点击那个绿色三角形，程序就开始执行。\n\
  \n如果你的程序没有运行正常，且你没有从 Visual Studio 内部收到错误消息，请回到安装过程的开头，检查是否正确遵循了每个步骤。在开始重新安装之前，请确保你有足够的磁盘空间来存放\
  \ Visual Studio。如果你收到来自 Visual Studio 的错误消息，说明你在编码过程的某个步骤操作有误。只需回到本章“使用 Visual Studio\
  \ 的测试程序”章节的开头，检查每个步骤，以确保你遵循了正确的顺序。\n\n# 总结\n\n在本章中，你学习了面向对象的编程如何在四十多年前开始的。本章还向你展示了如何下载和安装\
  \ Visual Studio 专业版。最后，你编写了一个简单的程序来测试安装情况，以确保执行正确。那么，现在该呢？\n\n你可以立即进入下一章开始阅读。这并不是个好主意。既然你已经运行了一个简单的程序，这是进行一些小实验的绝佳时机。例如，你的程序在标题栏中没有任何文本。C#\
  \ 肯定提供了一个允许你更改标题栏的属性。（提示：它确实提供这样一个属性！）尝试一下其他一些属性，看看它们的作用。例如，更改 `foreground` 属性看看会发生什么变化。\n\
  \n展望未来，本书的每一章的末尾都设置了一系列练习，你在阅读后续章节之前应该完成它们。你可能急于进入下一章，但请克制跳过练习的诱惑——一定要完成它们。它们可以帮助巩固你在本章中学到的知识，并为你下一章的内容做好准备。你可以在附录\
  \ A 中找到所有练习的答案。\n\n编程应该是有趣的，这种乐趣部分源于发现如果把这个变成那个会发生什么。如果你看到电脑里冒烟了，就不要再做那种更改了。（开玩笑的……如果你对属性进行了错误的更改，不会损坏电脑的。）去实验吧，享受其中吧！\n\
  \n### 本章你学到了\n\n| 主题 | 关键点 |\n| :--- | :--- |\n| OOP 简史 | OOP 实际上是从 20 世纪 60 年代的\
  \ Simula 开始的，但在 80 年代通过 C++、Java 和 C# 壮大。 |\n| 下载并安装 C# | 下载和安装 Visual Studio 的过程。\
  \ |\n| 示例程序 | 虽然非常简单，但程序确实测试了你对 Visual Studio 的安装。 |\n\n## 第 2 章\n## 理解对象\n\n###\
  \ 你在本章中将学到：\n\n* 什么是对象\n* `state` 对对象意味着什么\n* 什么是类\n* 实例化对象意味着什么\n* 什么是属性\n* 什么是方法\n\
  * 如何使用 Visual Studio .NET 提供的对象\n\n[wrox.com](http://wrox.com) 本章的代码下载：\n\n你可以在[www.wrox.com/remtitle.cgi?isbn=9781118336922](http://www.wrox.com/remtitle.cgi?isbn=9781118336922)\
  \ 找到本章的 [wrox.com](http://wrox.com) 代码下载。\n\n\n\n\n\n-   你想要与对象关联的方法（或动作）\n\n###\
  \ 类属性 (Class Properties)\n\n`类属性` 是你想要与对象关联并记录的数据。如果你想创建一个名为 `person` 的类对象（称为 `clsPerson`），属性列表可能包含表\
  \ 2.1 所示的项。\n\n表 2.1 `clsPerson` 属性\n\n| 属性 |\n| :--- |\n| name (姓名) |\n| height\
  \ (身高) |\n| hairColor (发色) |\n| eyeColor (瞳颜色) |\n| build (体型) |\n| glasses (眼镜)\
  \ |\n| clothing (服装) |\n| shoes (鞋子) |\n| accessories (配饰) |\n| gender (性别) |\n\n\
  虽然这不是规定，但许多程序员在命名属性名时使用小字母开头，但在属性名称包含的任何单词开头使用大写字母。由于你可能也遵循这一约定，表 2.1 中的属性名称也遵循这一约定。\n\
  \n在电话通话之前，名为 Jane 的 `clsPerson` 属性列表几乎是空的。你从她的简历中能填充的只有姓名和性别。然而，在电话通话之后，你几乎填充了名为\
  \ Jane 的 `clsPerson` 对象的所有所有属性（如果你尝试在电话中询问 `Build` 和 `eyeColor` 属性，你可能会把她吓跑，或者面临法律诉讼。）\n\
  \n当你正在填充名为 Jane 的 `clsPerson` 对象时，她也在为一个名为 Jack 的 `clsPerson` 对象进行同样的操作。在电话之前，Jane\
  \ 创建的用于与名字 Jack 关联的 `clsPerson` 对象可能是完全空的，因为 Jane 并不知道谁会为了工作面试的事给她打电话。然而，电话中的对话让双方都能为对方填写至少一些属性值。从\
  \ Jane 的角度来看，在电话通话完成后，她的 `clsPerson` 对象从一个完全没有特征的对象变成了（至少）一个部分可识别的对象。\n\n通过更改类属性的值，你可以改变对象的状态。`对象的状态`由用于描述对象的属性值决定。在示例中，用于描述\
  \ `clsPerson` 对象状态的属性是表 2.1 所示的属性。在电话通话之前，表 2.1 所示的属性还没有有意义的值。\n\n虽然人们并不经常改名，但偶尔也会发生。同样，人们会增加或减轻、染头发、戴彩色隐形眼镜、换衣服和更换配饰。如果任何一个属性值发生变化，对象的状态也会发生变化。只需记住，`属性值发生变化时``对象的状态`——`根据定义`——`也会发生变化`。\n\
  \n显而易见的是，是属性的值让人们能够区分 Jane `clsPerson` 对象和 Jack `clsPerson` 对象。也就是说，不同的对象通常具有不同的属性值。因此，也可以得出不同的对象具有不同的状态。\n\
  \n### 类方法 (Class Methods)\n\n就像定义对象状态的属性值一样，通常还有作用于属性的类方法。对于一个 `clsPerson` 对象，你希望该对象会说话、挥手、行走、换衣服等等。简而言之，`类方法`决定了对象可以执行的行为或动作。方法被用于描述你想要与对象关联的任何动作。类方法通常用于操作对象中包含的数据。\n\
  \n你可以将 Jane 和 Jack 之间的电话对话描述为人类类的对象，如图图 2.2 所示。\n\n图 2.2：电话通话期间填充属性值\n\n![2.2](img/c02f002.jpg)\n\
  \n通常，类方法用于获取一个或多个属性值，处理这些属性包含的数据，并作为方法处理过程的副产品创建一个新的数据。例如，你可能正在开发一个业务应用程序，需要创建一个发票对象，其中\
  \ `priceEach`（单价）和 `quantityOrdered`（订单数量）等是 `clsInvoice` 类的属性。你可以创建一个名为 `salesTaxDue()`\
  \ 的方法作为类方法，用于计算发票应交的销售税。你可能还有另一个名为 `salesTax` 的 `clsInvoice` 属性，它会作为如 salesTaxDue()`\
  \ 方法中包含的代码的一部分自动填充。\n\n如果你仔细考虑，类属性可以被看作一个名词：用于描述对象的人、地点或物。另一方面，类方法通常的行为像动词，表示对类属性（即类中的数据）要执行的某种动作，或者对象可以执行的动作。\n\
  \n## 多少属性，多少方法？\n\n作为程序员，你必须面对的问题是类中应该有多少个属性和方法。例如，在 `clsPerson` 对象中，你可以包含照片、指纹、视网膜扫描、血型、DNA\
  \ 样本、牙科记录、鞋码以及数百种其他内容。同样，你可以创建模拟说话、跑步、写作、行走、消除、睡眠、做梦等人类可以执行动作的方法。那么，适可止呢？属性和方法的合适数量是多少？\n\
  \n### 类是对象的简化\n\n请记住，每向类添加一个属性或方法，你都必须编写代码来实现它。通常情况下，程序代码越少，出错的地方就越少。从程序员的角度来看，代码越少是一件好事，只要代码能完成任务。也就是说，当你设计一个类时，你需要在尽量减少代码和实现设计目标之间取得平衡。\n\
  \n*** **注意：属性和方法的合适数量是完成任务所需的最小属性和方法。***\n\n你还会发现，如果你在类中省略了不必要的细节，你更有可能在其他项目中重用该类代码。`代码重用`是面向对象编程的主要优势之一。类越通用，就越容易重用。\n\
  \n\n\n\n如前文所述，类（class）是对象的模板。从这个意义上说，类就像一个饼干模具，能够让你径化出特定的饼干对象。通过这个版本的 Visual Studio，微软在\
  \ .NET Framework 中内置了大约 4,000 个可用的类。这意味着你已经有大约 4,000 个饼干模具挂在墙上，供你使用。（在本章的稍后部分，你会用到其中一些模具。）作为一名初级程序员，你的工作之一就是学习那些已经存在的类。毕竟，你没有理由去发明轮子。\n\
  \n有时你会使用这 4,000 个对象之一，但你心里会对自己说：“如果这个对象有某个某个属性，或者有一个可以执行某个功能的方法就好了。”面向对象编程（OOP）提供了一种名为`inheritance`（继承）的机制来实现这一点。不过，这个主题被推到了第\
  \ 16 章。目前，你应该专注于使用 Visual Studio 内置的那些对象。\n\n***\n\n### 作为 IDE 的 Visual Studio\n\
  正如第 1 章所示，Visual Studio 是一个整合许多编程工具的 IDE。在 IDE 出现之前，程序员需要单独的程序来编写源代码（编辑器）、编译程序（编译器）、汇编程序（汇编器）以及将程序组合成可执行程序（链接器）。有了\
  \ IDE，所有这些截然不同的功能都被整合到了一个包中。\n\nVisual Studio 功能的绝大部分来自于 .NET Framework，包括所有那些饼干模具。当你编写代码时，IDE\
  \ 内部的组件会将你的代码与来自 .NET Framework 的元素相结合，并生成微软中间语言（`Microsoft Intermediate Language`，\
  \ 简称 `MSIL`）代码。正是这些 MSIL 代码通过 Visual Studio 的通用语言运行时（CLR）组件，才让你的程序运行起来。\n\n与其在执行某个特定功能时对组成\
  \ Visual Studio 的每个“部分”进行区分，你只需要说类似的话：“Visual Studio 接收你的代码，并采取一切必要的操作来生成可执行程序。”如果出现这种区分非常重要的情况，我们将使用准确的术语。现在，只需记住，作为一个\
  \ IDE，Visual Studio 由许多协同工作的不同组件组成，让你的生活变得更容易。\n\n***\n\n大多数时候，除了 Visual Studio\
  \ 提供的类之外，你必须编写一些自己的类。这意味着，当你完成类的编写后，你现在墙上又挂了 4,001 个饼干模具，其中每一个都可以创建一个该类类型的对象。但注意：仅仅因为你定义了一个类（或饼干模具），并不意味着你拥有了一个对象（或一个饼干）。仅仅因为你妈妈给你的饼干模具放在厨房抽屉里，它本身并不能在桌子上变出任何饼干。\n\
  \n如前所述，类只是对象的模板。正如饼干模具的作用是切饼干面团中切出特定的形状一样，类被用来刻画出用于存放该类对象的内存块。在还没有使用类模板实际刻画出一个对象之前，该对象并不存在。\n\
  \n图 2.3 显示了类与你从该类实例化的对象之间的关系。类被显示为一个菱形的饼干模具。该类被命名为 `clsDiamond`。你可以将 `clsDiamond`\
  \ 的属性看作持有决定饼干模具精确形状的值。换句话说，属性的状态使得类看起来像菱形而不是其他形状（例如，心形）。要获得该类的对象，你必须将饼干模具（类模板）压入饼干面团（计算机内存）中以得到真正的饼干（对象）。\n\
  \n图 2.3\n\n对象也被称为 `instance of a class`（类的实例）。使用类来定义对象的行为被称为 `instantiation`（实例化）。\n\
  \n因此，对象是你可以在程序中实际使用的东西。正如你不能吃饼干模具一样，你不能直接使用类。你必须在程序中使用它之前，先使用该类在内存中实例化一个该类的对象。\n\
  \n***\n\n### 对象的命名\n在本文中，我采用了一种约定，即在某些对象的名称前使用特定的字母组合作为前缀。例如，我在类名之前使用 `cls`，在文本框对象名称之前使用\
  \ `txt`，在按钮对象之前使用 `btn`，以此此类推。你在阅读本文时可以发现其他例子。这种约定是所谓的“匈牙利命名法”（Hungarian notation）的变体，但不是其“纯”形式。在极端情况下，匈牙利命名法会在每个数据项前加上其数据类型的前缀，例如整数变量使用\
  \ `iHatSize`，字符变量使用 `cLetter`，浮点变量使用 `fWage`，数据对象使用 `objMyData`，以及许多其他类似的变体。在极端情况下，某些程序员还会包含作用域标识符，例如\
  \ `igHatSize`，它的意思是：“名为 HatSize 的具有全局作用域的整数变量”。这种记法失去了追随者，仅仅是因为它在代码清晰度方面带来的价值并不值得付出的精力。那么，为什么我仍然继续使用匈牙利命名法的变体呢？原因之一是我觉得我们的版本绝对值得这些精力。主要原因是前缀强化了所使用的对象类型。\n\
  \n***\n\n### 实例化类对象\n\n***\n\n### 实例化类对象\n\n考虑以下语句：\n\n```\nclsPerson myFriend;\n\
  ```\n\n为了帮助解释此语句发生了什么，请考虑图 2.4 所示的计算机系统简化内存图。\n\n图 2.4：简化 Windows 内存图\n\n![2.4](img/c02f004.jpg)\n\
  \n简单来说，程序语句说：“去饼干模具墙寻找名为 `clsPerson` 的饼干模具。找到后，将其从墙上取下，为它刻出一块内存并标记为 `myFriend`。”最终结果是\
  \ .NET 请求 Windows 操作系统提供 4 字节内存，用于存储名为 `myFriend` 变量的*引用*或*内存地址*。\n\n假设 Windows\
  \ 管理器在地址 800000 处找到了 4 字节空闲存储。目前，你还没有对该地址的内存进行任何操作，因此它的当前值为 `null`。（`null` 一词意味着变量当前没有存储任何有用的东西。）\n\
  \n此时，你拥有一个位于内存地址 800000、名为 `myFriend` 的饼干模具，正等待着发生有用的事情。在接下来的程序语句中，事情开始发生：\n\n```\n\
  myFriend = new clsPerson();\n```\n\n\n\n在编程语言中具有特殊含义的单词被称为 `keywords`（关键字）。C# 中的\
  \ `new` 关键字意味着你想要留出足够的内存来存放一个新的 `clsPerson` 对象。进一步假设存储与 `clsPerson` 对象相关的所有数据需要\
  \ 2,000 字节的内存。（.NET 会通过检查类的程序代码来确定一个对象需要多少字节内存。）如果你将这个编程语句右侧发生的事情口语化表达，你可能会说：“嘿，Windows！我是我……Visual\
  \ Studio。我的程序员想创建一个新的 `clsPerson` 对象。你那里有 2,000 字节的空闲内存供这样一个对象使用吗？”随后，Windows 内存管理器会查找它的可用内存表，可能在系统的某处找到\
  \ 2,000 字节的空闲内存。假设这块 2,000 字节的内存块从地址 900,000 开始。然后，Windows 内存管理器向 Visual Studio\
  \ 发回一条消息说：“嘿，VS！我是我……Windows 内存管理器。我找到了从地址 900,000 开始的 2,000 字节空闲内存。”Visual Studio\
  \ 说：“谢谢”，然后继续设置以使用名为 `myFriend` 的 `clsPerson` 对象，该对象现在存在于内存位置 900,000。\n\n当 Visual\
  \ studio 完成该语句后，内存映射现在的样子看起来就像图 2.5 所示的那样。\n\n图 2.5: 对象实例化后的内存映射\n\n![2.5](img/c02f005.jpg)\n\
  \n注意发生了什么。内存地址 800,000 处变量 `myFriend` 关联的值已从 `null` 变为与新创建的 `myFriend` 对象相关的数据存储的内存地址。你现在开辟了一个\
  \ `clsPerson` 对象，你可以通过名为 `myFriend` 的变量来访问它。`myFriend` 变量的目的是告诉你在哪里找到与 `myFriend`\
  \ 对象相关的数据。\n\n再次，正确的编程术语是你已经 `instantiated`（实例化）了一个由变量 `myFriend` 用的 `clsPerson`\
  \ 对象。实例化的对象是一个可以在你的程序中使用的对象。应该明确的是，`myFriend` 是一个引用，使你能够“找到”对象的数据（即其属性的值）。\n\n重复这两条编程语句（第\
  \ 4 章解释了以下语句中斜杠的作用）：\n\n```\nclsPerson myFriend;        // 从墙上取下一个特定的饼干模具\n    \
  \                       // 并将其命名为 myFriend\nmyFriend = new clsPerson();// 使用饼干模具制作一个\
  \ clsPerson \n                           // 饼干并将其引用为 myFriend\n```\n\n第一条语句意味着你意图创建一个\
  \ `clsPerson` 类型的对象，并使用名为 `myFriend` 的变量来引用该对象。第二条语句说你执行了意图，并实例化了一个 `clsPerson`\
  \ 类型的新对象，并将其与名为 `myFriend` 的对象变量关联起来。在程序的剩余部分里，你使用名为 `myFriend` 的变量来引用对象的数据。使用饼干模具的类比，饼干模具（即引用）位于内存地址\
  \ 800,000 处，但饼干本身（即对象的数据）位于内存地址 900,000 处。\n\n如果你愿意，可以将这两个语句合并为一条：\n\n```\nclsPerson\
  \ myFriend = new clsPerson();\n```\n\n解释与之前完全相同。你只是将两条语句合并为一条。因为程序员倾向于使用更少而不是更多的代码，你会经常看到这种简写形式。\n\
  \n你必须理解类（class）和该类的对象（object）之间的区别。当你编写类的代码时，你实际上在扮演一个设计房屋的建筑师。你设计的方案可能被用于建造一栋或几百栋房屋。关键在于，类代码是以后某个时候使用的设计。随后，木工、水管工和其他匠人实际上建造了这些房屋。匠人们从墙上取下蓝图（即类），阅读它们，然后实例化房屋。类（即房屋）的“用性”实际上在类的对象被实例化之后（即房屋被实际盖好之后）才产生。虽然圣诞老人间接地欣赏饼干模具的作用，但他更乐愿看到盘子里有一大堆（实例化的）饼干，而不是一叠生锈的饼干模具。\n\
  \n### 我有一个对象了……现在怎么办？\n\n你现在实例化了一个 `clsPerson` 类型的对象。明显的问题是：“然后呢？”目前，名为 `myFriend`\
  \ 的对象相当平庸。事实上，对象中的每个属性默认都实例化为值为 0、`false` 或 `null`，这取决于属性的数据类型。表 2.1 中之前展示的所有信息都没有填入\
  \ `myFriend` 对象中。你需要将这个面无表情的 `myFriend` 对象变成一个包含某些意义信息的对象。\n\n你可以通过更改其内部定义的属性中所包含的信息来更改对象。根据表\
  \ 2.1，你可能会执行以下操作：\n\n```\nmyFriend.name = “Jane”;\nmyFriend.gender = “F”;\nmyFriend.height\
  \ = 66;\nmyFriend.build = “Petite”;\nmyFriend.hairColor = “Blonde”;\nmyFriend.eyeColor\
  \ = “Blue”;\nmyFriend.clothing = “Business casual”;\nmyFriend.accessories = “Tan\
  \ briefcase”;\n```\n\n注意这些语句的作用。它们将面无表情的 `myFriend` 对象变成了一个看起来这个特定 clsPerson 对象的样子。在这些语句中，等号\
  \ `=` 被称为赋值运算符。赋值运算符获取运算符右侧的信息并复制到表达式左侧。这意味着在 900,000 附近，名称属性已从 `null` 变为 Jane。类似的变化也发生在\
  \ `myFriend` 的属性上。在编程术语中，赋值语句将对象的状态从一个平庸的人变成了名为 Jane 的女性。\n\n#### 对象语法\n\n注意更改对象状态的语法。编程语言的\
  \ `syntax` 指的是其使用的规则。使用对象属性的通用语法如下：\n\n```\nobjectName.Property\n```\n\n注意 `objectName`\
  \ 和 `Property` 之间的点。出现在对象名称和属性（或方法）名称之间的点在 C# 中被称为点运算符。如果你把对象想象成一个围绕属性和方法的钢盒，点运算符就是打开箱门的钥匙，让你进入对象访问其属性和方法。\n\
  \n在语句\n\n```\nmyFriend.Name = “Jane”;\n```\n\n中，计算机从右到左处理该语句。你可能会将语句隐含的过程口语化为以下步骤：\n\
  \n1. 将单词 Jane 放在推车里。\n2. 去名为 myFriend 的对象。\n3. 将你的钥匙（点运算符）插入箱门。\n4. 打开箱门。\n5. 引导你的推车到达名称属性。\n\
  6. 将字母 Jane 倒入名称属性中。\n\n你可以可视化这些步骤，正如图 2.6 所示。\n\n图 2.6: 修改 Name 属性的值\n\n![2.6](img/c02f006.jpg)\n\
  \n现在你遵循了这些步骤，与变量 `myFriend` 关联的对象被分配了一个名称。这也意味着 `myFriend` 对象的状态已从一个没有名字的对象变成了名为\
  \ Jane 的对象。\n\n\n\n该对象也可以“反反方向”使用。例如，假设你已经将 Jane 的名字赋值给了 `myFriend` 对象。在程序的后续部分，你想在表单上的文本框（textbox）对象中显示她的名字。如果文本框对象的名称为\
  \ `txtName`，你可以写道：\n\n```c\ntxtName.Text = myFriend.Name;\n```\n\n同样，由于赋值语句是从右到左处理的，这段代码会导致程序执行以下操作：\n\
  \n1. 访问 `myFriend` 对象。\n2. 将钥匙（点操作符）插入钢盒箱的锁中。\n3. 打开 `myFriend` 对象的门。\n4. 将一辆空推车推向\
  \ `myFriend` 的 `name` 属性。\n5. 对 `name` 属性中存储的字节（即 Jane）进行复制。\n6. 将该副本放入推车中。\n7.\
  \ 离开对象的盒子。（门会自动关闭！）\n8. 将推车推向名为 `txtName` 的文本框对象。\n9. 将钥匙（点操作符）插入 `txtName` 盒子的锁中。\n\
  10. 打开其盒子里 `txtName` 的门。\n11. 将推车推向 `txtName` 对象的 `Text` 属性。\n12. 将 Jane 倾入 `Text`\
  \ 属性中。\n\n你可以可视化这些步骤，如图 2.7 所示。\n\n图 2.7: 将属性值复制到另一个变量\n\n![2.7](img/c02f007.jpg)\n\
  \n这一系列步骤说明了两个需要记住的重要概念：\n\n* 在上一步的序列中，你*并没有改变*与 `myFriend` 关联的对象的状态。你只是进入了对象内部，复制了它的内容并离开。因为代码没有修改\
  \ `myFriend` 任何属性（数据）的内容，所以它的状态保持不变。\n* 你*确实改变了* `txtName` 对象的状态。这是因为你进入了 `txtName`\
  \ 对象，并将 Jane 名字的副本赋值给 `txtName` 对象的 `Text` 属性。因为 `Text` 属性的数据发生了变化，`txtName` 对象的状态被改变了。\n\
  \n你可以从这些观察得出两个重要的结论：\n\n* 如果对象的属性出现在赋值运算符（等号，`=`）的右侧，你只是在读取对象的属性，而不是在改变它的状态。\n*\
  \ 如果对象的属性出现在赋值运算符的左侧，你*确实在改变*其某一个属性的数据，从而改变该对象的状态。\n\n尽管有少数例外，这些结论在大多数情况下对你非常有帮助。\n\
  \n### 为什么要隐藏对象内部的数据？\n\n简单粗暴地说，本节的讨论描述了对象是如何工作的，以及属性（或对象的数据）应该如何隐藏在对象内部。为什么要隐藏对象内部属性？隐藏它们的原因和古代国王把女儿藏在城堡塔楼的原因是一样的……为了防止他人骚扰它们。\n\
  \n通过将对象的属性（数据）封装在钢盒中，你可以通过强制每个人必须拥有正确的钥匙（对象的点操作符）才能访问这些属性，从而限制对这些属性的访问。换句话说，你将数据埋在对象内部，试图保护数据不受程序其他部分的意外修改。在对象内部隐藏数据的过程被称为*封装*（encapsulation）。封装是面向对象编程（OOP）的基石之一。你将在后面的章节中学习更多关于封装和\
  \ OOP 其他其他元素的知识。但目前，只需记住，你想尽可能地封装（隐藏）你的对象数据，同时让这些数据对程序中需要它的部分可用。\n\n# 开始使用对象\n\n\
  在接下来的“尝试一下”（Try It Out）中，你将编写一个简单的程序，使用 Visual Studio 提供的许多对象中的几个。遵循你在第 1 章中创建程序测试\
  \ Visual Studio 安装时使用的通用方向即可。\n\n***\n\n**注意：** 本书中几乎每个程序都从这里描述的 C# 模板开始，使用接下来描述的相同步骤。因此，你应该记住这个页码（也许在封底写上页码），每当被要求启动新项目时参考它。过一段时间，你就会背下这个序列了。如果后续序列不适用于特定项目，系统会通知你，并提供一套不同的指令。除了项目名称外，所有未来项目的步骤都是相同的。\n\
