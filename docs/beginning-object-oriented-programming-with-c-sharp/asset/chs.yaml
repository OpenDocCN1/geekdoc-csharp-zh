  \n## 图 16.1 UML 类图\n\n![image](img/c16f001.jpg)\n\n### 基类与派生类\n\n正如你在 图 16.1 中所示，我使用了\
  \ UML 符号对如何组织投资类型的数据进行了初步估算。图顶部是 `clsBuilding`。`clsBuilding` 包含了所有投资类型共有的属性，被称为**基类**。你可以将基类类为所有类数据的公分母。（这不是一个新概念；在你所有的程序中，你一直通过\
  \ `frmMain` 中的 `:Form` 表达式来继承所有 Windows 表单的所有属性。）\n\n任何想要使用基类属性和方法的类被称为**派生类**。对于\
  \ 图 16.1，`clsBuilding` 是基类，而类 `clsApartment`、`clsCommercial` 和 `clsHome` 是派生类。你也会听到人们将基类称为父类，将派生类称为子类。这些解释是相同的。\n\
  \n参考 图 16.1，你可以注意到有三条箭头从派生类指向基类。这些箭头中的每一个都可以用口头表述为“是一个……（is a）”。也就是说，`clsApartment`\
  \ “是一个” `clsBuilding`。用简单的英语来说，你可以说：“一个公寓对象是一个建筑对象。”同样，商业对象也是一种建筑对象。UML 图中的箭头表示了类之间存在的继承关系的性质。\n\
  \n### 受保护（protected）访问修饰符\n\n参考 图 16.1，你可以看到 `clsBuilding` 中所有投资类型共有的七个共同属性，并标出了每个属性的数据类型。然而，与你在第\
  \ 9 章中学到的公共 (+) 和私有 (--) 访问修饰符不同，这里使用了一种新的访问修饰符 (#)。井号 (`#`) 表示**受保护（protected）访问修饰符**。之所以需要受保护访问修饰符是因为基类与派生类之间形成了共生关系（“是一个……”）。\n\
  \n为了理解为什么使用受保护类，请考虑如果你被限制在使用公共或私有访问修饰符，情况将会如何。首先，考虑私有修饰符。如果你在 `clsBuilding` 中使用私有修饰符，则\
  \ `clsBuilding` 中的每个方法和属性都具有类范围。正如你所知，这意味着这些属性和方法在类外部是不可见的。换句话说，`clsBuilding` 中的任何私有属性或方法对任何外部类（包括三个派生类）都是不可用的。因此，程序中没有任何部分可以访问基属性和方法。如果你无法访问它们，它们对派生类来说几乎毫无价值。\n\
  \n现在考虑另一种替代方案：将所有属性和方法设为公共。如果你这样做，你就等于放弃了封装的所有益处。受保护修饰符解决了这个问题。受保护修饰符允许所有派生类访问这些内容。\n\
  \n### 继承关系的优势\n\n你可能会问继承带给了你什么。嗯，首先，如果没有 图 16.1 所示的继承关系，每个派生类都需要拥有 表 16.2 所示数据的副本。这意味着每个属性都需要它自己的\
  \ get 和 set 属性方法。对于在派生类中共享的任何方法（例如 图 16.1 所示的 `removeSnow()`），情况也是如此。\n\n\n\n\n\
