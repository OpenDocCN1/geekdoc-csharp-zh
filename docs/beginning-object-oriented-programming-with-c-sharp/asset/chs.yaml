  \ 于练习 3 中述的问题，你会如何解决这个问题？**5.** 修改[图 10.1]所示的程序，仅显示适用于扑克牌游戏的牌。\n\n### 你在这一章学到的知识\n\
  \n| 主题 | 关键点 |\n| :--- | :--- |\n| **类构造函数** | 如何编写重载构造函数。 |\n| **内聚性 (Cohesion)**\
  \ | 用一或两句话说明方法目的的能力。 |\n| **耦合性 (Coupling)** | 类方法不应依赖其他类方法。 |\n| **属性方法** | 用于获取或设置类属性的值。它们构成了类的接口。\
  \ |\n| **Getter (访问器)** | 用于获取属性值的属性方法。 |\n| **Setter (存取器)** | 用于更改属性状态的属性方法。 |\n\
  | **类设计** | 使良好的、可重用的类的设计考虑因素。 |\n| **三层架构** | 如何使用类来增强 N 层架构。 |\n\n# 第 11 章：异常处理与调试\n\
  \n**你将在这一章学到的：**\n\n*   bug（缺陷）、错误（errors）和异常（exceptions）之间的区别\n*   语法、语义和逻辑 bug\
  \ \n*   异常处理\n*   抛出异常\n*   使用调试器\n*   调试窗口\n*   bug 的检测、隔离和修正\n\n本章的 `wrox.com`\
  \ 代码下载\n\n你可以找到本章的 `wrox.com` 代码下载。\n\n# 概述\n\n程序员将 bug、错误和异常归为单一概念是常见现象。从技术上讲，每种类型的错误都是不同的。现在让我们详细考虑一下每种情况。\n\
  \n## Bug（缺陷）\n\n一个*bug* 是由程序员引起的特定类型的错误。bug 通常分为三大类：\n\n*   语法错误 (Syntax errors)\n\
  *   语义错误 (Semantic errors)\n*   逻辑错误 (Logic errors)\n\n### 语法错误 (Syntax Errors)\n\
  \n*语法错误* 发生在语句不符合语言规则时。就像英语有特定的规则一样，编程语言也是如此。例如，英语句子预期应该有一个主语和一个谓语。编程语句与句子类似，如果你不遵守规则，就会产生语法错误。带有语法错误的程序无法编译。\n\
  \nVisual Studio 的 IntelliSense 在你输入程序语句的瞬间就能出色地检测到语法错误。那令人讨厌的波浪线告诉了你所犯的语法错误的性质。如果你将光标悬停在波浪线上，Visual\
  \ Studio 会显示一条消息，告知你可能的原因。当你开始编写程序时，程序中可能会有大量的波浪线。\n\n### 语义错误 (Semantic Errors)\n\
  \n*语义错误* 发生在使用了正确的语言语法，但语句或表达式的语境错误的情况下。例如，你可以说下面这个英语句子：“狗喵喵了。”语法是正确的，因为句子有主语和谓语，但主语和谓语的语境错了。带有语义错误的程序通常可以编译，但结果（通常）是错误的。\n\
  \n考虑以下语句：\n\n```csharp\n int j;\nint answer;\n\nj = 10;\nanswer = 1 / j;\n```\n\n\
  \n\n\n该代码没有产生 IntelliSense 错误信息并且可以编译。然而，对于任何大于 1 的 `j` 值，`answer` 始终为 0。（例如，当 `j`\
  \ 等于 1 时，代码会产生正确的结果。）在这种语境下，你正尝试使用整数算术创建一个分数值。如果你将上面的最后语句写为：\n\n```\nanswer = 1.0\
  \ / j;\n```\n\nIntelliSense 会发出的错误信息，询问你是否需要对表达式进行类型转换。IntelliSense 现在可以识别出正确的上下文，因为它知道\
  \ `1.0` 是一个浮点值。语义错误比语法错误更难发现，因为 IntelliSense 并不总是能检测到它们。\n\n### 逻辑错误\n\n当程序通过编译但产生错误结果时，就存在`逻辑错误`。这使得它们听起来很像语义错误，但之间是有区别的。语义错误反映了对语言规则的违背。而逻辑错误是程序员在处理程序数据时所犯的设计错误的结果。这种区别虽然微妙，但是真实的。\n\
  \n随着编程经验的增加，语法错误和语义错误往往变得越来越少。相反，你大部分时间都花在追踪和修正程序中的逻辑错误上。每个程序员都会犯逻辑错误，你应该预期自己也会犯错。应该采取的态度是，修复任何类型的\
  \ bug 都是一次学习经历。编程的奇特性之一就是：你犯的错误越多，作为一个程序员就变得越优秀。\n\n# 输入错误\n\n从严格意义来说，`输入错误`是用户犯的错误。遗憾的是，终端用户聪明到知道他们不需要阅读用户手册。这有点像在迷路时拒绝问路。用户拒绝承认自己不知道如何运行程序。结果是，当程序运行时可能会发生奇怪的事情。\n\
  \n你如何减少输入错误呢？以下编程概念可以有所帮助。\n\n## 数据验证\n\n最常见的输入错误可能发生在用户向程序提供输入，但输入的类型不正确。例如，程序可能会要求用户输入购买的数量，用户可能本想输入\
  \ `10`，但因为手指抖动打成了 `1o`（误按了字母 \"o\" 键）。然而，一个优秀的程序员会通过在程序中添加验证代码来预判此类错误。如果你想验证用户是否正确输入了购买数量，可以像以前那样样使用\
  \ `TryParse()` 方法对输入进行验证：\n\n```\nbool flag;\nint quantity;\nflag = int.TryParse(txtQuantity.Text,\
  \ out quantity);\nif (flag == false)          // 进展不顺利\n{\n      MessageBox.Show(\"\
  仅限数字字符。请重新输入。\",\n                      \"输入错误\");\n      txtQuantity.Focus();\n\
  \      return;\n}\n```\n\n这是你在之前的程序中常见的验证例程。\n\n无效的输入数据可能是程序错误最常见的来源。其原因之一是无法无法完全控制用户在\
  \ `textbox` 对象中输入了什么。作为通用规则，每当你使用 `textbox` 对象向用户请求输入时，都应该对响应进行验证。验证的通用领域包括以下方面：\n\
  \n- **类型检查：** 在这里你会使用如 `TryParse()` 的代码来确保输入字符与想要的数据类型一致。\n- **一致性检查：** 这种检查经常比较两个或多个响应，以确保输入数据是一致的。例如，如果用户声明性别为男性，随后又说自己怀孕\
  \ 8 个月，很可能是他们回答错了其中一个输入问题。\n- **范围检查：** 这种检查尝试通过检查输入数据是否落在合理的数值范围内来验证输入数据的合理性。例如，如果你询问某人的年龄并得到的响应是\
  \ `422`，那么用户很可能指的是其他值。你的代码应该提示用户重新输入该值。\n- **长度检查：** 通常某些响应需要特定数量的字符作为输入。常见的例子包括两个字母州缩写、邮政编码以及电话号码和社会安全号码。有时只需检查用户输入的长度就能检测到其他检查遗漏的错误。\n\
  \n规则很简单：假设用户的输入`总是`是错误的。\n\n## 限制用户输入\n\n你无疑运行过那些让你从给定列表中做出选择的程序。常见的输入技术是以后 `listbox`\
  \ 或 `combination box`（组合框）对象的形式向你展示选项列表。虽然你可能认为这种方法是程序员提供的便利，但其驱动力并不是为了你的便利，而是将你的选择限制在列表选项中的计划。\n\
  \n程序员知道用户会搞乱程序输入。通过向用户提供有限的选项列表，而不是让他们在 `textbox` 中输入内容，程序员可以将用户的输入限制在至少符合预期数据的范围内。诚然，用户仍然可能选择错误的选项，但至少答案与随后的处理过程是一致的。例如，你可以提供一个带有“输入性别\
  \ (M, F)”标签的 `textbox`。显然，你预期用户会输入 `M` 或 `F`。然而，你至少给了用户 24 次机会来搞砸（这还是假设他们选择的是字母字符并且写对了大小写）。\n\
  \n编写旨在限制用户输入错误的代码并不非常困难。在接下来的“动手尝试”中，你将使用单选按钮来限制输入选择。\n\n### **动手尝试：限制输入选择 (Chapter11ProgramRadioButtons.zip)**\n\
  \n在本次动手尝试中，你将看到一个通过单选按钮限制用户输入选择的程序。虽然你可以为这里的选项使用 `listbox`，但更好的选择是使用单选按钮。单选按钮允许用户看到所有选项而无需展开\
  \ `listbox`。当选项数量较少时，单选按钮是一个很好的选择。图 11.1 显示了一个简单的程序，练习了几个可以强制用户进行更具一致性的输入的对象。\n\n\
  **1.** 按通常方式创建一个新项目。**2.** 添加四个单选按钮，如图 11.1 所示。如果你下载了代码文件，上面已经放置了其他对象（参见图 11.3）。然而，你仍然可以像所示添加一组新的单选按钮。\n\
  \n**图 11.1** 使用单选按钮\n\n\n\n\n\n![image](img/c11f001.jpg)\n\n## 工作原理\n\n所示程序似乎用户应该先选择\
  \ `Male`（男）或 `Female`（女），然后选择 `Senior`（高级）或 `Junior`（初级）。遗憾的是，代码并不是这样工作的。按照表单目前的布局，如果用户点击\
  \ `Male` 单选按钮，该选择中会出现一个一个小点（请参考图 11.1）。做出该选择后，用户移动到下一个输入并点击 `Senior`，这会导致该选择中也出现一个小点。坏消息是\
  \ `Male` 的选择消失了，这可能不是程序员的本意。\n\n问题在于，单选按钮对象与互斥选项相关联。程序将表单上所有的单选按钮都视为属于同一组选项。因此，选择其中一个选项会关闭所有其他按钮。这正是单选按钮对象的预期行为，但并不是程序员预期的。那么，你如何解决这个问题呢？\n\
  \n### 组框 (Group Box)\n\n解决方案很简单：将每组相关的单选按钮选择放在它们自己的 `GroupBox` 对象中。要在表单上添加 `GroupBox`\
  \ 对象，请在 `Toolbox` 中选择 `Containers` 选项，并将 `GroupBox` 对象拖到表单上。将对象的 `Text` 属性更改为 `Gender:`。现在在表单上拖入第二个\
  \ `GroupBox` 对象，并将其 `Text` 属性设为 `Membership group:`。现在，按住 `Shift` 键，同时点击 `Male`\
  \ 和 `Female` 单选按钮。按 `Ctrl+X` 从表单上剪切这两个单选按钮。点击应用了 `Gender` 文本的 `GroupBox` 并按 `Ctrl+V`。这两个单选按钮现在应该复制到带有\
  \ `Gender:` 标题的 `GroupBox` 中。对 `Membership` 单选按钮重复此操作。你的表单现在看起来应该像图 11.2 中所示。\n\n\
  **图 11.2** 正确使用单选按钮\n\n![image](img/c11f002.jpg)正如你在图 11.2 中所示，`GroupBox` 将单选按钮分为两组，每组都可以有其适当的选择。（你可以看出来这一点，因为\
  \ `Female` 和 `Senior` 都被选中。）\n\n处理单选按钮选择的代码基本上如下：\n\n```\n int choice;\nif (rbMale.Checked\
  \ == true)\n{\n    choice = MALE;\n}\nelse\n{\n    choice = FEMALE;\n}\n```\n\n\
  （我使用 `rb` 作为单选按钮的前缀，这与我通常对 `Toolbox` 对象使用的三个字符前缀有所不同。使用两个字符前缀的原因是……我没有理由。它只是对我来说很合理。如果这困扰了你，可以尝试\
  \ `rbt` 或 `rbn`。）单选按钮对象有一个 `Checked` 属性，如果按钮被选中，则逻辑为 `true`，如果未选中则逻辑为 `false`。（程序假设\
  \ `MALE` 和 `FEMALE` 的符号常量已经在程序的其他地方定义。）如果选择列表大于两个，可以使用嵌套的 `if` 语句来处理选择。\n\n### 默认选择\
  \ (Default Choices)\n\n很多时候，你想为一组单选按钮设置默认选择。将默认选择设置为大多数用户的预期选择是有意义的。如果你预计大多数用户是女性，可以向表单的构造函数中添加以下代码：\n\
  \n```\n public frmMain()\n{\n    InitializeComponent();\n    rbFemale.Checked =\
  \ true;\n}\n```\n\n`InitializeComponents()` 方法用于构建表单的内存映像。当从该方法调用返回时，完整的表单对象已经在内存中构建完成。如果你想更改该表单对象的默认状态，构造函数就是操作的地方。当表单显示时，它将选中\
  \ `Female` 选项。注意，将代码放在构造函数内部意味着它属于“五个程序步骤”中的初始化步骤。\n\n***\n\n### 复选框 (Check Boxes)\n\
  \n限制用户输入的另一种方法是使用 `CheckBox` 对象，如图 11.3 所示。\n\n**图 11.3** 使用复选框限制输入\n\n![image](img/c11f003.jpg)\n\
  \n与单选按钮不同，复选框的选择不是互斥的。用户可以勾选他们认为合适的多个项目。图 11.3 中持有 `CheckBox` 对象的 `GroupBox` 对象不是必须的。然而，复选框所描述的选项范围应用于某些覆盖选择的情况并不罕见。如果是那样，使用复选框可以用于某些特定的选择。\n\
  \n（注：原文此处提到提到持有复选框的 `GroupBox`，但在图 11.3 所示的图 11.3 中，复选框并未包含在 GroupBox 内，翻译保持原意。）\n\
  \n如果是那样，使用复选框可以用于某些特定的选择：\n\n```\nArray.Clear(toppings, 0, toppings.Length);\n\n\
  if (ckBMushroom.Checked == true)\n{\n    //\n}\nif (ckBOives.Checked == true)\n\
  {\n    //\n}\nif (ckbausage.Checked == true)\n{\n    //\n}\n```\n\n（注：上述代码使用 `Array`\
  \ 类的 `Clear()` 方法来初始化所有元素。再次，使用符号常量来帮助。这些选择。如果你想为选择设置默认值，可以在构造函数中设置这些项。\n\n### 组合框\
  \ (Combination Boxes)\n\n*组合框*，或*下拉框*，与列表框类似，不同之处在于用户也可以输入。图 11.4 显示了组合框的典型用法。（接下来的“尝试”部分将讨论图中所示的对象。）\n\
  \n**图 11.4** 使用组合框\n\n![image](img/c11f004.jpg)\n\n正如你在图 11.4 中所示，组合框与列表框相似。正因如此，你可以在设计模式下通过属性窗口初始化列表，也可以通过程序控制设置列表。图\
  \ 11.5 显示了你如何使用属性窗口的 `Items` 属性向列表添加项。\n\n在属性窗口中使用 `Items` 属性通常意味着你在程序运行之前就知道了要放入组合框中的项目列表。然而，在许多情况下，你希望根据运行时确定的列表来填充组合框。例如，你可能会从数据库读取一组名称，并希望将这些名称中的子集放入组合框中，让用户从中选择特定的。为了创建[图\
  \ 11.5]所示的列表，可以使用以下代码而不是字符串集合编辑器：\n\n```\n cmbSize.Items.Add(\"Small\");\ncmbSize.Items.Add(\"\
  Medium\");\ncmbSize.Items.Add(\"Large\");\n```\n\n如果你有一个想要添加到组合框的名称数组，你可能会使用类似的代码：\n\
  \n```\n int i;\n\n// 假设 names[] 已经填充……\n\nfor (int i = 0; i < names.Length; i++)\n\
  {\n    cmbPeople.Items.Add(names[i]);\n}\ncmbPeople.SelectedIndex = 0;\n```\n\n\n\
  \n\n这段代码片段简单地将存储在 `names` 数组中的名称列表添加到组合框（combo box）中。（完成相同任务的简单方法是使用 `cmbPeople.DataSource\
  \ = names`。）组合框的 `SelectedIndex` 属性决定了当程序运行时，添加到组合框的项目中的哪一个将显示为默认选择。由于组合框中的项目列表是从\
  \ 0 开始的列表，因此前面的代码显示了列表中的第一个项目。你应该将 `SelectedIndex` 设置为列表中的默认项目。如果你不设置 `SelectedIndex`\
  \ 属性，组合框将是空的，看起来类似于一个空白的文本框，等待用户向其输入内容。你也可以从组合框中获取 `SelectedIndex` 属性。\n\n你还可以让对象对添加到组合框的项目列表列表内容进行排序。通常，这会让使用户更容易从列表中找到她想要选择的项。然而，请记住，有时项目添加到组合框的顺序会对后续代码产生影响。例如，如果稍后将使用\
  \ `names` 数组的选择来索引数据库以获取所选人员的详细信息，那么该人在 `names` 数组中的位置可能决定了如何在数据库中找到他。在这种情况下，你就不希望将\
  \ `Sorted` 属性设为 `true`。\n\n如果你想从组合框中检索文本，可以使用如下所示的代码：\n\n```\nstring buff = cmbPeople.Text;\n\
  ```\n\n###带有或不带用户输入的组合框\n\n你可以通过在属性窗口中将 `DropDown` 属性设置为 `DropDownList` 来关闭用户在组合框中输入键值的能力。这种样式使组合框成为一个只读对象。这使得数据验证变得更加容易，因为你的验证代码不需要担心用户输入“small”、“Small”或“SMALL”\
  \ 之间的差异。如果你确实想接受用户输入，请将类型设置为 `DropDown`。这是组合框的默认行为样式。\n\n### 日期和时间输入\n\n另一个常见的输入是日期。让用户输入日期也是获取虚假输入数据的良好方法，因为有许多不同的日期格式（军事格式、法语等）。时间也会出现同样的困扰，因为时间可以使用\
  \ 12 小时制或 24 小时制来表示。\n\n你可以使用 `DateTimePicker` 对象来标准化此类信息。如果你将一个 `DateTimePicker`\
  \ 对象拖到表单上并运行程序，它看起来类似于图 11.6 所示所示。\n\n**图 11.6** 日期和时间格式\n\n![image](img/c11f006.jpg)](images/c11f006.jpg)\n\
  \n如你所示，`DateTimePicker` 对象看起来类似于组合框，但对象的 `Text` 属性中有一个日期。（`DateTimePicker` 是感知区域的，因此它会呈现适当的格式[例如，美国与法国]。）但是，如果你点击对象上的向下箭头，输出将变为如图\
  \ 11.7 所示的样。\n\n**图 11.7** DateTimePicker 对象\n\n![image](img/c11f007.jpg)](images/c11f007.jpg)\n\
  \n### Format 和 ShowUpDown 属性\n\n图 11.7 中所示对象的状态假设对象的 `Format` 属性已设置为 `Long`，且 `ShowUpDown`\
  \ 属性设置为 `false`。如果你将 `Format` 属性设置为 `Short`，日期将显示为 6/21/2012。\n\n在表单上添加第二个 `DateTimePicker`\
  \ 对象并将其 `ShowUpDown` 属性设置为 `true`。现在表单看起来就像图 11.8 所示的样。\n\n**图 11.8** 带有 ShowUpDown\
  \ 的 DateTimePicker\n\n![image](img/c11f008.jpg)](images/c11f008.jpg)\n\n在第二个 `DateTimePicker`\
  \ 对象中，用户可以使用对象末尾的微调控件更改 `Text` 属性中显示的小时。如果用户选择也可以可以在 `Text` 属性中输入时间。\n\n要从 `DateTimePicker`\
  \ 对象中提取信息，使用以下代码：\n\n```\nstring date = dtpDate.Value.ToShortDateString();\nstring\
  \ time = dtpTime.Value.ToShortTimeString();\n```\n\n你可以选择不同的日期和时间方法来更改从 `DateTimePicker`\
  \ 对象中提取的数据格式，以适应你的需求。前面的语句会产生 6/21/2012 的日期和 4:55 PM 的时间。\n\n# 异常\n\n无论你如何很好地预料，事情总会发生。如果你编写的代码遇到错误，它就会产生异常。考虑到这一点，查看一些可以让你代码更健壮的技术。\n\
  \n你可以使用 try-catch 语句块来“捕获”异常。try-catch 语句块的通用语法如下：\n\n```\ntry\n{\n     // try 块\n\
  }\ncatch (exception)\n{\n     // catch 块\n}\nfinally\n{\n     // finally 块\n}\n\
  ```\n\n你可以使用 try-catch 语句块来“捕获”程序异常。try-catch 语句块的通用语法如下：列表 11-1](#9781118416471c11.xhtml_c11-fig-0001)所示的简单程序说明了一个异常。\n\
  \n列表 11-1: 生成异常\n\n```cs\nusing System;\nusing System.Windows.Forms;\n\npublic class\
  \ frmMain : Form\n{\n    private Button btnCalc;\n\n    #region Windows 代码\n\n \
  \   public frmMain()\n    {\n        InitializeComponent();\n    }\n\n    public\
  \ static void Main()\n    {\n        frmMain main = new frmMain();\n        Application.Run(main);\n\
  \    }\n\n    private void btnCalc_Click(object sender, EventArgs e)\n    {\n  \
  \      int exp1 = 0;\n        int exp2 = 5;\n        int result;\n\n        result\
  \ = exp2 / exp1;\n    }\n}\n```\n\n该程序是一个标准的表单，上面有一个按钮对象。在按钮的点击事件中，exp1 被设置为 0，exp2\
  \ 被设置为 5。除以零会产生除以零异常。目前，如果你在 Visual Studio 环境外运行此程序，程序会弹出如图 11.9 所示的异常通知。（如果你在 Visual\
  \ Studio 环境内运行程序，你会得到类似的消息，但发生异常的精确语句会被高亮。）\n\n**图 11.9** 异常通知\n\n![image](img/c11f009.jpg)](images/c11f009.jpg)\n\
  \n这对用户来说是非常糟糕的！这个消息告诉每个看到它的人，程序员并没有预料到程序会到达这种（除以零）状态，但还是让它发生了。这不好。\n\n你如何防止这种糟糕情况发生？\n\
  \n\n\n\n\n`catch` 块紧随在 `try` 块的右合大括号之后。`catch` 块的作用是在抛出异常时执行一个或多个语句。括号表示，如果你需要，也可以在\
  \ `catch` 关键字后面跟一个特定的异常。（稍后你将看到一个相关的示例。）右合大括号标记了 `catch` 语句块的结束。\n\n可选的 `finally`\
  \ 语句块表示一段无论是否抛出异常，你都希望执行的代码块。例如，你可能在 `try` 语句块中激活了某些资源（例如，你可能打开了一个文件或数据库，或者可能是网络或打印机连接），这些资源在你完成使用它们时需要被关闭。通过将所需的语句放置在\
  \ `finally` 语句中，可以确保无论是否发生异常，这些语句都会执行。并不是所有的 `try-catch` 块都会使用（可选的）`finally` 块。然而，`try`\
  \ 块必须包含一个 `catch` 块或一个 `finally` 块。\n\n下一节包含使用 `try-catch` 块进行异常处理的代码。在示例中，既处理了特定异常，也处理了未指定的异常。\n\
  \n***\n\n### 尝试一下：异常示例\n\n修改列表 11-1 中的代码以包含一个 `try-catch` 块。所有代码都列列在这里，因为如果你能在一个地方看到所有代码，将更容易理解代码的作用。\n\
  \n**1.** 按常规方式创建一个新项目。**2.** 添加列表 11-2 中的代码，或者直接下载其 `.zip` 文件。\n\n列表 11-2: 异常处理程序\
  \ (`frmMain.cs`)\n\n```\n//#define DEBUG\n#undef DEBUG\nusing System;\nusing System.Windows.Forms;\n\
  \npublic class frmMain : Form\n{\n    private Button btnExit;\n\n    private Button\
  \ btnCalc;\n    #region Windows code\n\n    public frmMain()\n    {\n        InitializeComponent();\n\
  \    }\n\n    public static void Main()\n    {\n        frmMain main = new frmMain();\n\
  \        Application.Run(main);\n    }\n\n    private void btnCalc_Click(object\
  \ sender, EventArgs e)\n    {\n        int exp1 = 0;\n        int exp2 = 5;\n  \
  \      int result;\n\n#if DEBUG\n        MessageBox.Show(\"exp1 = \" + exp1.ToString());\n\
  #endif\n\n        try\n        {\n            result = exp2 / exp1;\n          \
  \   MessageBox.Show(\"Never get here\");\n        }\n        catch (DivideByZeroException)\n\
  \        {\n            MessageBox.Show(\"Divide by zero error.\", \"Exception Thrown\"\
  );\n            return;\n        }\n        catch (Exception ex)\n        {\n  \
  \          MessageBox.Show(\"Error: \" + ex.Message, \"Exception Thrown\");\n  \
  \      }\n        finally\n        {\n            MessageBox.Show(\"In finally\"\
  );\n        }\n\n    }\n\n    private void btnExit_Click(object sender, EventArgs\
  \ e)\n    {\n        Close();\n    }\n}\n```\n\n#### 工作原理\n\n现在，当你运行程序并点击“计算”按钮时，程序将如图\
  \ 11.10 所示。\n\n图 11.10 除以零异常\n\n![image](img/c11f010.jpg) \n\n现在，当发生除以零异常时，会执行 `catch`\
  \ 语句块来向用户显示消息。在除以零异常发生后，`try` 块中出现的消息框不会被执行。当程序控制传递到 `catch` 块后，代码路径*不会*自动返回到 `try`\
  \ 块的代码。虽然这种解决方案比列表 11-1 发生的情况没那么难看，但它仍然不会赢得任何美容比赛。你可以通过考虑代码试图做什么来消除剩余的几个瑕疵。\n\n\
  ***\n\n### 预判特定异常\n\n你可以进行改进的方法之一是根据 `try` 语句块的作用考虑可能会发生哪些异常。显而易见，一种可能的异常就是你一直在尝试的除以零异常。那么，如何发现其他可能抛出的异常呢？\n\
  \n如果你使用 Debug → Exceptions 菜单序列（或按键 `Ctrl+D, E`），展开 Common Language Runtime Exceptions\
  \ 标题，最后展开 System 标题，你会看到一个与图 11.11 所示类似的列表。\n\n图 11.11 除以零异常\n\n9781118416471c11.xhtml_c11-fig-anc-0011)\
  \ 异常列表\n\n![image](img/c11f010.jpg) \n\n意识到某些类型的异常可能会发生，你可以修改列表 11-1 以包含以下内容：\n\n\
  ```\ntry\n{\n    result = exp2 / exp1;\n     MessageBox.Show(\"Never get here\"\
  );\n}\ncatch (DivideByZeroException)\n{\n    MessageBox.Show(\"Divide by zero error.\"\
  , \"Exception Thrown\");\n    return;\n}\n```\n\n例如，如果 `exp1` 和 `exp2` 的值来自其他来源，它们可能会溢出。你可能需要多个\
  \ catch 块：\n\n```\ntry\n{\n    result = exp2 / exp1;\n}\ncatch (DivideByZeroException)\n\
  {\n    MessageBox.Show(\"Expression 1 is zero. Please reenter.\",\n            \
  \        \"Exception Thrown\");\n    txtExpression1.Focus();\n    return;\n}\ncatch\n\
  {\n    MessageBox.Show(\"Something went wrong.\",\n                    \"Exception\
  \ Thrown\");\n}\n```\n\n代码现在现在捕获除以零异常，但在发生未指定的异常时也能捕获。对于除以零异常，你可以提供更有有用的错误消息，甚至要求用户重新输入，如前面的代码所示。然而，对于未指定的异常的消息是没有帮助的。你需要另一种方法来消除几个瑕疵。\n\
  \n#### 模糊异常消息\n\n虽然你可能没有确定发生的精确异常，但你可以通过以下内容为用户提供帮助：\n\n```\ntry\n{\n    result\
  \ = exp2 / exp1;\n}\ncatch (DivideByZeroException)\n{\n    MessageBox.Show(\"Expression\
  \ 1 is zero. Please reenter.\",\n                    \"Exception Thrown\");\n  \
  \  txtExpression1.Focus();\n    return;\n}\ncatch (Exception ex)\n{\n    MessageBox.Show(\"\
  Error: \" + ex.Message, \"Exception Thrown\");\n}\n```\n\n在这段代码中，你定义了一个名为 `ex` 的\
  \ `Exception` 对象变量。在消息框中，你使用 `Exception` 对象的 `Message` 属性对发生的异常提供更精确的消息。这些消息是*模糊异常消息*，因为它们比没有消息要好，但通常不足以让你采取某些纠正措施（正如你处理除以零异常时所做的那样）。虽然这可能无法解决用户的问题，但至少模糊消息比你之前提供的通用消息要好。\n\
  \n鉴于你的代码现在处理模糊异常，如何测试它呢？\n\n#### 测试模糊异常\n\n你可以通过使用 `throw` 关键字抛出该异常来测试异常。（catch……throw……懂了吗？）为了说明这一点，请再次修改你的点击事件代码如下：\n\
  \n```\ntry\n{\n    throw new ArgumentOutOfRangeException(); // 新语句\n    result =\
  \ exp2 / exp1;\n}\ncatch (DivideByZeroException)\n{\n    MessageBox.Show(\"Expression\
  \ 1 is zero. Please reenter.\",\n                    \"Exception Thrown\");\n  \
  \  txtExpression1.Focus();\n    return;\n}\ncatch (Exception ex)\n{\n    MessageBox.Show(\"\
  Error: \" + ex.Message, \"Exception Thrown\");\n}\n```\n\n\n\n\n\n`try` 块中的第一个语句使用一个示例异常，从图\
  \ 11.11 所示的可能列表中进行尝试。正如你预期的那样，`ArgumentOutOfRangeException()` 表达式末尾括号意味着程序将“构造”一个\
  \ `ArgumentOutOfRangeException` 然后抛出该异常。（*throw*（抛出）一词仅意味着程序在执行构造函数时产生该异常。）由于该异常不是\
  \ `DivideByZeroException`，因此了模糊异常处理程序。调用 `Show()` 方法实际显示的消息如图 11.12 所示。\n\n图 11.12\
  \ 抛出异常\n\n![image](img/c11f012.jpg)\n\n显然，这个 `Exception` 对象的的消息比通用的 `Something went\
  \ terribly wrong`（发生了糟糕的错误）要好。`ex.Message` 属性并不是 `Exception` 对象唯一的有用属性。你还可以使用 `StackTrace`\
  \ 属性（`ex.StackTrace`）来显示直到异常发生时你调用的方法。（方法按反序显示，最后调用的方法位于列表顶部。）虽然向用户显示堆栈跟踪溯消息可能不是一个好主意，但它们对于调试复杂程序非常有用。\n\
  \n### finally 语句块\n\n正如我之前提到的，当你有一系列语句，无论是否存在异常都希望它们执行时，就会使用 `finally` 语句块。再次，让我们修改按钮对象的点击事件代码，如下：\n\
  \n```csharp\n try\n{\n    result = exp2 / exp1;\n}\ncatch (DivideByZeroException)\n\
  {\n    MessageBox.Show(\"Expression 1 is zero. Please reenter.\",\n            \
  \        \"Exception Thrown\");\n    txtExpression1.Focus();\n    return;\n}\ncatch\
  \ (Exception ex)\n{\n    MessageBox.Show(\"Error: \" + ex.Message, \"Exception Thrown\"\
  );\n}\nfinally\n{\n    MessageBox.Show(\"In finally\");\n}\n```\n\n该代码抛出一个除以零异常并显示适当的消息。代码代码指示将光标置在\
  \ `txtExpression1` 框对象中并从子程序返回。然而，如果你运行程序，在错误消息显示并点击 OK 按钮后，会显示另一个带有 `In finally`\
  \ 消息的消息框。\n\n尽管在除以零异常消息框之后有一个 `return` 语句，控制权仍传递到 `finally` 语句块，而不是从点击事件返回。很显然，无论方法块中其他代码的意图如何，`finally`\
  \ 块都会执行。记住，在抛出异常后，程序控制永远不会返回 `try` 块。\n\n尽管定义了超过 100 种异常，你也可以为自定义异常编写代码。然而，我将这个话题推迟到讨论继承之后。\n\
  \n# 程序调试\n\n解决程序调试的最佳方法是永远不要编写带有 bug 的程序。因为这可能在短期内不会发生，你的次优方法是学会如何有效地使用程序调试器。虽然你可以在其他环境中编写\
  \ C# 程序代码，但你可能在使用 Visual Studio；然而，这里讨论的大多数调试技术适用于任何编程环境。\n\n## 问题的本质\n\n你已经读过语法错误和语义错误，以及它们之间的区别。逻辑错误是第三种程序错误（或称\
  \ bug），我们在这里检查的就是这种类型的错误。修复程序错误有三个步骤：\n\n*   检测\n*   隔离\n*   修正\n\n### 检测\n\n听起来很奇怪，但检测程序错误并不像看起来那么简单。如果那样，就不会有程序带有错误发布给公众了。正如我之前提到的，我的公司生产过一个名为\
  \ `Microstat` 的统计软件包，销售了 20 多年。在领域内工作近 7 年并拥有数千用户后，`Stepwise Multiple Regression`（逐步多元回归）组件在一个特定的数据集上失败了。问题发生在当美国国内总值（GNP）以*美元*输入时，程序正在计算交叉乘积的平方和。GNP\
  \ 数据集足够大，以至于平方和溢出了浮点数的范围。（当时语言的浮点值范围比今天 C# 的 `double` 类型要小得多。）在检测到这个隐藏了 7 年的错误后，花了大约\
  \ 3 分钟修复它。真正的问题是产生导致 bug 显现的情况。\n\n大多数程序 bug 不会像 GNP 数据集那样产生数值溢出异常。更多情况下，程序运行完成并产生程序输出。换句话说，程序成功无缺地执行了所有五个程序步骤。既然程序运行结束了，你如何检测错误呢？\n\
  \n#### 测试数据集\n\n检测 bug 的在于测试数据集。要创建这些集合，取一组已知的输入（`Input` 步骤）并手动处理这组输入（`Process`\
  \ 步骤）（也可以使用自动化测试集，但那超出了本书的范围）。然后你记录来自 `Process` 步骤的数据，其结果成为 `Output` 步骤。这些手动生成的测试结果作为标准，用它来衡量你的程序输出。\n\
  \n你如何决定测试哪些数据？换句话说，你如何选择通过哪些输入来判断计算机产生的输出？首先，选择一个用户预期可能会使用的“典型”数据集。例如，如果你写了一个计算应收销售税的程序，你可以通过提供\
  \ 100 个单位、单价 100 美元的购买量来测试该方法，看看计算机产生的销售税是否与你手动计算的结果相同。此类“典型”数据集会产生“典型”的结果。然而，典型数据很少能触到\
  \ bug 潜伏的地方。\n\n程序 bug 喜欢隐藏在边界条件中。边界条件是测试极端情况的情况。在销售税示例中，边界条件的一项测试是确定当销售税率为零时，你的方法会做什么。另一个边界条件是购买数量为零或价格为零。即使你的销售税方法正确处理了零销售税边界，在该边界之后调用的后续方法是否也妥善处理了这种情况？零销售税边界并不听起来那么不寻常，特别是当某些购买免销售税时。例如，某些州免收教育机构的税，而另一些州免收某些产品（如食品）。\n\
  \n同样，你应该输入极大的值来测试测试数据集的上边界条件。最小测试数据集应该针对最小预期值（零）、一些典型值以及最大预期值。一种上限测试是使用接近或达到测试所用数据类型范围限制的输入值。例如，如果使用了\
  \ `byte` 数据集，尝试使用 255 的输入值运行一个上限测试。\n\n简单来说，测试数据集是你判断程序是否正确处理数据的唯一手段。只要可能，确保你包含了能够测试程序边界条件以及更典型值的测试数据集。\n\
  \n\n\n\n\n你的测试数据必须覆盖每条代码路径。这意味着带有 `if-else` 代码路径的程序，其测试套件中必须包含能够执行这两种条路径的数据集。程序员往往从未测试他们所有的代码路径：这简直是一场注定会发生的事故。\n\
  \n还可能存在其他边界情况。例如，在我教的高级面向对象编程（OOP）课程中，我在学期开始时做的第一件事之一就是让学生写一个程序，让计算机尝试确定用户想的数字。程序会询问游戏的下限和上限，然后开始猜数字。计算机显示它的猜测结果，用户点击相应的按钮（太高、太低或正确）。如果限制范围是\
  \ `0` 到 `100`，即使是使用 `RDC` 的非二分查找算法也可以在 100 次尝试内猜出那个数字，对吧？错了。因为边界是包含在，所以需要 `101`\
  \ 次猜测才能确保包含搜索中的所有值。事实上，当学生们告诉他们已经准备好让我测试他们的程序时，我尝试的第一个两个数字就是 `0` 和 `100`。令人失望的是，他们大量的程序在这些边界数字下无法正常运行。\n\
  \n拥有一组测试数据集另一个原因是增加你让 bug 可重复的概率。最难修复的 bug 绝对是无法持续重复的。某些编程语言（如 `C` 和 `C++`）深受野指针问题的困扰，这使得程序\
  \ bug 特别难以追踪。（这也是这也是 C# 不鼓励使用指针数据类型的原因之一。）\n\n用户输入一组输入值，点击 `Calculate`（或类似）按钮，然后程序崩溃或生成了错误的答案，这种现象并不罕见。当你询问哪些值产生了错误时，用户可能记不起自己输入了什么。有时，只有某个特定的值或值的值序列会触发产生输出错误的程序状态。当用户无法回想起这些值时，会令人感到沮丧，尤其是当你无法复制该错误时。（为了辅助程序调试，某些程序在\
  \ `catch` 块中调用了错误记录方法，将特定的程序值写入磁盘。）\n\n无论你使用什么测试数据集，请保存它们。它们以后可能会派上用场。\n\n## 隔离\
  \ (Isolation)\n\n假设你已经有一个可重复的 bug，消除它的下一步是将其隔离。在 OOP 技术在使用、全局作用域数据占主导地位的糟糕年代，错误的输出值几乎可以由程序的任何地方引起。当时没有“私有”数据或作用域的概念。每个变量在程序的任何点都是可见且全局可用。因此，试图精确确定某个特定变量在何处出现错误是极其困难的。\n\
  \n在 OOP 设计中，通常很容易找到隐藏程序 bug 的那个`class`。尽管如此，程序类中可能包含大量代码，因此你可以利用任何找到的帮助来简化发现过程。这就是程序调试器无价之宝的地方。\n\
  \n虽然本节专门讨论了 Visual Studio 程序调试器，但大多数调试器都具有相同的通用功能。因此，尽管运行调试器的机制可能有所不同，但它们的使用和目的在范围内是通用的。\n\
  \n## Visual Studio 调试器 (The Visual Studio Debugger)\n\n调试器最大的好处也许是作为隔离程序 bug 的辅助。隔离\
  \ bug 的起点是断点（`breakpoint`）（虽然你在前面的章节中读到过 Visual Studio 调试器，但我想在这里进行稍微正式一点的检查）。`breakpoint`\
  \ 是程序源代码中的一个位置，你希望在那里强制暂停程序的执行。通过暂停程序执行，你可以检查此时作用域内各种数据项的值。\n\n你已经知道，可以将光标置于想要设置断点的语句上，然后按\
  \ `F9` 键（或点击 `Source` 窗口的左边距）来设置断点。语句行的背景颜色立即变为红色，程序边距处会出现一个红点，如图图 11.13 所示。\n\n\
  **图 11.13** 设置断点\n\n![image](img/c11f013.jpg)\n\n当你运行程序时，它会照常运行，直到遇到断点语句。在那时，程序暂停。红色背景被黄色背景取代，程序准备好执行断点语句。注意，断点语句尚未被处理。\n\
  \n此时，你可以将光标移动到作用域内的不同变量上，并检查它们的值。\n\n### 局部窗口 (The Locals Window)\n\n你可以通过打开 `Locals`\
  \ 窗口看到所有局部作用域变量。要这样做，只需使用 `Debug → Windows Locals` 菜单序列（或 `Ctrl+D, L`）。显示将变为类似于图\
  \ 11.14 所示。\n\n**图 11.14** Locals 调试窗口\n\n![image](img/c11f014.jpg)\n\n`Locals`\
  \ 窗口显示了第 9 章讨论过的具有局部作用域的所有变量。通常情况下使用 `Locals` 窗口更容易。\n\n### 立即窗口 (The Immediate\
  \ Window)\n\n你可以通过使用 `Debug → Windows Immediate` 序列（`Ctrl+D, I`）激活 `Immediate` 窗口。`Immediate`\
  \ 窗口的目的是让你输入表达式并检查其影响。例如，图 11.15 显示 `exp1 = 2`，从而将其值从 `0` 变为 `2`。因此，`Immediate`\
  \ 窗口允许你更改局部变量的值。\n\n**图 11.15** 立即调试窗口\n\n![image](img/c11f015.jpg)\n\n等一下，注意引用数据类型可以展开。你已经知道如何单步执行程序。然而，调试器还包含了你可以使用的额外工具。首先，当你到达断点时，可以按\
  \ `F10` 或 `F11` 键跳转到下一个语句。当你跳转到下一个语句时，边距中的黄色箭头会移动到下一行，向你展示程序执行的位置。\n\n## 单步执行程序\
  \ (Single-Stepping Through the Program)\n\n### 从断点回退 (Backing Up from a Breakpoint)\n\
  \n可能不明显的是，你也可以回退程序执行。图 11.16 显示了边距中的黄色箭头以及一条消息，说明你可以将（黄色箭头）光标拖到之前的行以再次执行该行。这使你无需重启程序并运行到当前断点即可执行程序语句，这可以节省大量时间。你可以看到光标被拖到了第二个数据定义，位于断点上方。\n\
  \n**图 11.16** 拖动断点\n\n![image](img/c11f016.jpg)\n\n尽管消息没有说明，但你不能推进黄色箭头。这样做可能意味着跳过了必要的语句，无法正确确定作用域内变量的值。这并不是一个严重的限制，因为你只需要在源代码文件的靠下位置设置断点，然后按\
  \ `F5` “全速”运行到该断点。（你也可以右键点击某行并选择 `Set Next Statement` 来设置下一语句。）\n\n\n\n\n调试工具栏如图图\
  \ 11.17 所示，并带有有关工具栏上每个图标含义的注释。`Go` 图标仅会让程序从断点处以正常速度恢复执行。`Break All` 图标提供暂停功能，允许您在程序执行时手动进入调试模式。`Stop`\
  \ 图标终止程序的当前运行。`Restart` 图标直接重启程序。`Show Next` 图标显示下一个要执行的语句。但最有趣的调试功能可能与 `Step` 图标有关，现在将对其进行详细讨论。\n\
  \n图 11.17 调试工具栏\n\n![image](img/c11f017.jpg)\n\n### 逐进入 (Step Into)\n使用 `Step Into`\
  \ 图标，如果即将执行的语句是可用源代码的方法调用，程序执行将进入该方法的源代码。这允许您逐行单过该方法的源代码。\n\n### 逐跳过 (Step Over)\n\
  使用 `Step Over` 图标，如果即将执行的语句是可用源代码的方法调用，程序执行将跳过方法的源代码，继续执行当前语句后的下一语句。当您知道即将调用的方法运行正常，且不想浪费时间单步执行其源代码时，跳过方法是非常有用的。\n\
  \n### 逐跳出 (Step Out)\n最后，假设您已经单步进入了方法的源代码，在执行到一半时决定返回到方法的调用者。通过点击 `Step Out` 图标，您将跳过方法中剩余的源代码行，并返回到调用方法的地方。这也可以节省时间。\n\
  \n`Hex` 图标允许您以十六进制值而非默认的 10 进制表示查看调试器信息。这对于汇编语言程序员来说可能很有用。调试工具栏上的最后一个图标（`Output`）提供了有关当前正在运行程序的额外信息。在此时，这些信息并不算特别有用。\n\
  \n### 寻找 Bug\n设置断点和对程序进行单步执行的目的是让您能够在程序执行过程中观察数据的值。在测试数据的帮助下，您应该看到自己如何从良好的输入值（假设这些值是正确的）变为糟糕的输出值。如果您在输入测试数据具有足够的粒度（例如复杂计算的中间值），您应该能精确地隔离\
  \ Bug 所在的位置。（这是支持高内聚方法的另一个理由。如果您编写尝试做太多事情的瑞士军刀式方法，会让调试变得更加困难，因为多用途方法需要更长时间的测试和调试。）\n\
  \n通常，修复 Bug 是简单的。您只需要更改产生错误的程序语句即可。有时您可能需要更改计算方式（即其算法）。\n\n## 脚架代码 (Scaffold Code)\n\
  在符号调试器出现之前的时代，程序员被迫在程序运行时打印变量的值。然后您会查看这些中间值，并尝试确定问题出在哪里。找到错误后，您必须回溯并删除代码中使用的所有打印语句。这是一个容易出错的过程，因为很容易漏掉一两个打印语句，或者在无意中删除了某行本应保留在程序中的代码。\n\
  \n\n\n随后的语言（如 `C`）允许程序员在源代码中添加预处理器指令，并允许编译器将调试语句切换到代码中或排除在外。这些根据预处理器指令添加或删除的调试代码有时被称为\
  \ `scaffold code`（脚架代码）。让编译器切换代码产生错误的可能性小得多。\n\nC# 允许您使用一些预处理器指令。您已经在程序中使用过 `#region-#endregion`\
  \ 指令。现在考虑以下代码：\n\n```\n#define MYDEBUG\n// 许多行代码。\n// 现在你处于一个经常出错的地方，所以你添加了：\n#if\
  \ MYDEBUG\n        MessageBox.Show(\"Value of exp1 = \" + exp1.ToString());\n#endif\n\
  ```\n\n`#define` 预处理器指令必须是源代码文件的第一行。在这个示例中，`#define MYDEBUG` 预处理器指令会导致 `MYDEBUG`\
  \ 被添加到符号表中。（你不应该使用 `DEBUG`，因为 Visual Studio 已经定义了该符号常量。）因为它是在任何方法之外定义的，所以它具有类作用域。这意味着\
  \ `MYDEBUG` 在程序的所有元素中（包括其他源文件）都是都是知的。\n\n您可以在 `#if` 和 `#endif` 之间放置任意数量的代码行。您还可以使用以下变体：\n\
  \n```\n#if MYDEBUG\n        val = 3;\n#else\n        val = 0;\n#endif\n```\n\n这允许您根据\
  \ `#define` 指令切换测试值。一个很棒的小细节是，如果您使用 Visual Studio 查看这段代码段，当前未编译的语句将以灰色文本显示。换句话说，如果定义了\
  \ `MYDEBUG`，语句 `val = 0;` 将显示为灰色。\n\n### 切换脚架代码\n将脚架代码切入或退出程序最简单的方法是在源文件顶部使用以下两行：\n\
  \n```\n#define MYDEBUG\n//#undef MYDEBUG\n```\n\n通过这两行代码，`MYDEBUG` 符号对程序是定义的。如果您取消第二行的注释，`#undef`\
  \ 预处理器指令会将 `MYDEBUG` 符号从符号表中移除。（你应该在源文件中保留 `#define MYDEBUG` 指令。）在前面的代码段中，这将导致 `val`\
  \ 等于 0。\n\n以这种方式使用预处理器指令允许脚架代码永久地留在源文件中，并在需要时切换。\n\n## 防御性编码 (Defensive Coding)\n\
  有时，很难确定具体是哪个变量生成了错误的结果。经常遇到如下复杂的表达式：\n\n```\ndelta = a * (b −1) + (h * math.pow(1+r,\
  \ x) + 2) / left + right;\n```\n\n在这里您只知道 `delta` 出了问题。即使有观察窗口，这种复杂的表达式也难以判断中间值。如果将此语句拆分为几个生成中间值的较小语句，理解和调试它将容易得多。这可能需要多几行（不那么复杂的）代码，但节省的测试和调试时间完全补偿。防御性编码简单意味着以便于调试和维护的方式编写代码。\n\
  \n之前的章节介绍了其他的防御性编码技术，有助于提高您的调试效率。您应该使用 `private` 访问修符定义所有的类属性。这样做，只有属性 getter 和\
  \ setter 方法可以更改属性的状态。在程序中使用符号常量来使代码更易读。文中的其他风格建议都应该有助于防止 Bug 或使其更容易检测和隔离——即使不需要，在\
  \ `switch` 中也使用 `default`；始终为 `if` 和 `for` 语句使用大括号；不要依赖隐式转换。\n\n关于防御性编码技术的其他想法出现在后面的章节。在您编写自己的程序时，尝试实践防御性编码技术。也许最容易实现的是带着“别人必须修复它”的想法来编写代码。聪明但晦涩的代码从长远来看永远不会赢。如果您认为某段聪明代码由于其性能提升到值得这样做是必要的，请务必对代码添加注释，以便他人理解——那个人\
  \ 6 个月后很有可能就是你自己。\n\n\n\n\n在本章中，你学习了可能侵入你程序的各种类型的错误和缺陷（bugs）。到目前，你可能已经进步到很少产生语法或语义错误的程度。你已经进入了高级阶段：逻辑错误。某些错误会抛出异常，你现在已经知道如何使用异常处理程序来保护自己。你还学习了如何强制抛出异常，这对于测试你的异常处理程序很有帮助。\n\
  \n纠正程序错误最大的盟友是程序调试器。你应该知道如何设置断点、单步执行程序，以及使用各种调试窗口在程序执行时监控关键变量。\n\n最后，我提到了防御性编程如何减轻测试和调试程序的负担。编写清晰、简洁的代码使你或任何其他人在调试你的代码时变得容易得多。在编写代码时，务要假设会有其他人负责维护它。\n\
