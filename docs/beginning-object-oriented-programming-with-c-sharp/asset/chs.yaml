  \n本章讨论了如何使用 C# 为 Web 应用程序编程。仅仅一个章节是无法充分介绍 Web 编程的。事实上，有数百书籍专门研究 Web 编程。相反，这里的目标是为你提供背景信息，让你理解参与\
  \ Web 编程涉及的范式。之后，如果你想更深入学习 Web 编程，有很多 Wrox 出版物可以帮助你掌握 Web。\n\n在开始编写你的第一个 Internet\
  \ 网页之前，你需要了解网页如何编写以及在浏览器中显示的基础知识。\n\n## 静态网页\n\n每当你加载 浏览器并显示 Internet 页面时，显示器上看到的任何内容都是由超文本标记语言（HTML）脚本构建的。静态网页是指内容从不改变的页面。因为内容从不改变，无论是谁访问该页面或是如何进入该特定页面的，页面看起来总是相同的。页面的视图是静态且不变的。\n\
  \n在下面的“动手尝试”中，你将使用 Visual Studio 编写一个简单的静态网页。假设你已经加载了 Visual Studio 并准备好选择项目。\n\n\
  ### 动手尝试：静态网页 [Chapter18ProgramStaticWebPage.zip]\n\n编写静态网页并不困难——只需遵循以下步骤：\n\n1.\
  \ 从 Visual Studio 菜单中选择`File` → `New` → `Web Site` → `ASP.NET Empty Web Site`。这将显示如图\
  \ 18.1 所示的对话框。Web Location 应命名为 `StaticWebPage`。\n\n图 18.1 Web 选择\n\n![image](img/c18f001.jpg)\n\
  \n2. 完成选择后，为项目文件输入 `StaticWebPage` 并点击确定。Visual Studio 将忙于执行一些后台工作，并最终向你展示如图 18.2\
  \ 所示的 IDE。\n\n图 18.2 Visual studio 环境\n\n![image](img/c18f002.jpg)\n\n3. 移动到解决方案管理器窗口，右键点击项目名称（`StaticWebPage`）。然后选择\
  \ `Add` → `Web Form`，这会弹出一个要求你输入表单名称的对话框。这一过程在图 18.3 中所示，而图 18.4 显示了对话框。\n\n图 18.3\
  \ 添加 Web 表单的选择过程\n\n![image](img/c18f003.jpg)\n\n图 18.4 Web 表单名称对话框\n\n![image](img/c18f004.jpg)\n\
  \n4. 接受默认名称（即“Default”）并点击确定。Visual Studio 会创建文件并显示 IDE，其界面如图 18.5 所示。\n\n图 18.5\
  \ 选择文件后的 IDE\n\n![image](img/c18f005.jpg) 注意解决方案管理器已向项目添加了 `Default.aspx` 文件。`.aspx`\
  \ 扩展代表 Active Server Page，`Default.aspx` 现在是你的静态网页。（你可以将页面命名为 `Default.htm` 或 `Default.html`）。将你在源代码窗口中看到的代码替换为列表\
  \ 18-1 所示的内容。\n\n列表 18-1: Default Web Page (default.aspx)\n\n```\n <%@ Page Language=\"\
  C#\" AutoEventWireup=\"true\" CodeFile=\"Default.aspx.cs\"\n                  Inherits=\"\
  _Default\" %>\n\n<!DOCTYPE html>\n\n<html xmlns=\"http://www.w3.org/1999/xhtml\"\
  >\n<head runat=\"server\">\n    <title>My First Web Page</title>\n</head>\n<body>\n\
  \    <form id=\"form1\" runat=\"server\">\n        <div>\n            <h1>This is\
  \ a static web page</h1>\n            <br/>\n            Not much going here…\n\
  \        </div>\n    </form>\n</body>\n</html>\n```\n\n现在运行程序。使用你默认的 Web 浏览器，输出将如图\
  \ 18.6 所示。\n\n图 18.6 静态网页\n\n![image](img/c18f006.jpg)\n\n虽然这个网页看起来没什么特别的，但它可以作为讨论网页的良好起点。首先注意到的是，源代码窗口的底部出现了一些新选项，如图\
  \ 18.7 所示。\n\n图 18.7 源代码窗口选项\n\n\n\n\n\n![image](img/c18f007.jpg)你当前在显示器上看到的视图是`Source`（源代码），它显示了当前网页的\
  \ HTML 代码。如果你点击`Design`（设计）选项，显示将会改变并显示页面的当前状态。在本例中，`Design`选项所示图 18.6。你可以在这两个窗口之间来回切换，查看你在\
  \ `Source` 窗口中更改代码对页面显示效果产生的影响。`Split`（拆）选项将 `Source` 窗口水平分割，让你能够同时看到 `Source` 和\
  \ `Design` 窗口。这可以避免你在开发页面时需要反复点击所需的选项。\n\n当你运行程序（按`F5`）时，程序界面所示图 18.6。如果你仔细观察，会发现图中的\
  \ URL 地址栏包含`[`localhost:2245/Default.aspx`](http://localhost:2245/Default.aspx)`。http\
  \ 表示你正在使用超文本传输协议（`HTTP`）在服务器和客户端之间交换信息。在这种情况下，`localhost:2245`术语指定你的计算机将托管 `Default.aspx`\
  \ 网页。`.aspx` 文件扩展代表 Active Server Page Extended（扩展活动服务器页），并将该文件标识为旧 `.asp` 文件类型的扩展。（幸运的是，这些是\
  \ Visual Studio 在后台使用的细节，所以你不需要担心它们。）换句话说，这一行告诉你是显示在计算机上的哪个网页。使用 `localhost` 标识符更容易开发、测试和调试\
  \ 应用程序，因为你不需要在每次测试程序时都将修改后的网页部署到某个服务器上。\n\n现在你已经知道程序运行时的样子，请检查网页的代码。你可以忽略列表 18-1\
  \ 中的前两行。现在考虑这一行：\n\n```html\n <!DOCTYPE html>\n```\n\n这一行是一个 HTML 注释行。注释的标记为：\n\n\
  ```html\n <! Comment >\n```\n\n其中 `<!` 开始注释，`>` 结束注释。从技术上讲，HTML 注释以 `<!--` 开始，以\
  \ `-->` 结束。如果你将注释改为：\n\n```html\n <!-- DOCTYPE html -->\n```\n\n你可以看到字体颜色变为绿色，以表示这是一个\
  \ HTML 注释。如果你运行程序，程序没有可可见的变化。\n\n下一行：\n\n```html\n <html xmlns=\"http://www.w3.org/1999/xhtml\"\
  >\n<head runat=\"server\">\n```\n\n定义了页面中使用的 HTML 版本的命名空间。此引用告诉你 Visual Studio 使用了扩展\
  \ HTML（Extended HTML）。下一行简单地表示页面将在服务器上运行，在你的案例中，即 `localhost`。程序的其余部分处理如何按照你编写的方式显示页面。你可以如下所示简化页面，输出结果看起来仍然相同。\n\
  \n```html\n <html>\n    <head >\n    <title>My First Web Page</title>\n    </head>\n\
  \    <body\n      <h1>This is a static web page</h1>\n             <br/>\n     \
  \        Not much going on here…\n    </body>\n</html>\n```\n\n虽然列表 18-1 中的许多 HTML\
  \ 似乎是不必要的，但在你开发更复杂的网页时情况并非如此。大多数 HTML 指令都是成对出现的。也就是说，`h1` 标题样式是通过以下代码引入的：\n\n```html\n\
  \ <h1>\n```\n\n并以以下代码结束：\n\n```html\n </h1>\n```\n\n这些指令通常被称为 `HTML tags`（HTML 标签）或标签。换行标签\
  \ `<br />` 不需要成对标签，但仍然遵循打开和关闭括号（`<>`）的约定。\n\n显示网页的过程所示图 18.8。控制浏览器的用户被称为 `client`（客户端）。（从技术上讲，浏览器是客户端，而用户是控制浏览器。浏览器是一种可以在显示设备上渲染\
  \ HTML 信息的应用程序。）客户端向服务器请求网页（1）。存储之前编写的 HTML 页面的系统被称为 `server`（服务器）。当客户端请求到来时，服务器找到所需的网页（2），然后将该页面返回给浏览器（3）。浏览器负责在浏览器上渲染页面以供客户端查看。\n\
  \n**图 18.8** 显示网页的过程\n\n![image](img/c18f008.jpg)服务器的处理仅限于定位正确的页面，而客户端的处理器仅限于浏览器渲染\
  \ HTML 页面。除非客户端向服务器发起某种请求，否则页面不会改变。\n\n# 动态网页\n\n动态页面具有更改内容的能力。Visual Studio 支持你可以使用的\
  \ ASP.NET 文件。正如你在本章前面学到的，旧的 ASP.NET 文件以 `.asp` 结尾，而扩展页的扩展后缀为 `.aspx`。ASP.NET 文件通常包含\
  \ HTML 脚本和 ASP.NET 标签。ASP.NET 标签允许你将 `C#` 代码与 HTML 脚本混合以生成动态 HTML 页面。在 `C#` 代码执行后，结果被重新格式化为\
  \ HTML 页面并发送回客户端。\n\n处理可以在服务器或客户端端进行。例如，大多数浏览器具有使用 `JavaScript`、`Flash` 和 `Silverlight`\
  \ 代码的能力。许多服务器可以处理用 `Java`、`Perl`、`ColdFusion`、`Python`、`Ruby` 和 `ASP` 编写的代码。如果服务器可以处理\
  \ ASP.NET 文件，它就具有处理带有 `C#`、`Visual Basic` 或 `C++` 代码页面的能力。（它们共享中间语言。）尽管存在这种双重性，但显然服务器端处理更具优势，特别是考虑到云计算的进步。\n\
  \n在下一个 Try It Out 中，你将开发一个计算贷款每月还款的简单 Web 。使用第 2 章的五个程序步骤，初始化步骤除了标准的网页设置信息外不需要其他内容。输入步骤需要贷款金额、利率和贷款期限的月数。处理步骤需要一个获取输入步骤数据并产生每月还款金额的算法。输出步骤只需将还款金额格式化为\
  \ HTML 页面并发送回客户端。终止步骤不需要任何特殊处理。基于此，你就可以开始了。\n\n\n\n\n\n# 尝试一下：抵贷款计算器 [Chapter18ProgramSMortgageCalculator.zip]\n\
