  \ `mdiParent` 为你提供了一种与 `frmMain` 数据通信的方法，尽管你目前在 `frmSelectServer` 中执行代码。这是一种非常有用的技巧，你可以经常使用。你很快就会看到它是如何发挥作用的。随后构造函数代码尝试为当前机器构建一个服务器列表。是\
