  \       {\n                sudokuViewModel.Cells2DArray[i, j].HasError = CellError(sudokuViewModel,\
  \ i, j);\n            }\n        }\n    }\n\n    private static bool CellError(SudokuViewModel\
  \ sudokuViewModel, int row, int col)\n    {\n        string digit = sudokuViewModel.Cells2DArray[row,\
  \ col].Digit;\n        if (string.IsNullOrEmpty(digit))\n            return false;\n\
  \        if (!int.TryParse(digit, out int i) || i < 1 || i > 9)\n            return\
  \ false;\n\n        for (int j = 0; j < 9; j++)\n        {\n            if (j !=\
  \ col && sudokuViewModel.Cells2DArray[row, j].Digit == digit)\n                return\
  \ true;\n        }\n        for (int r = 0; r < 9; r++)\n        {\n           \
