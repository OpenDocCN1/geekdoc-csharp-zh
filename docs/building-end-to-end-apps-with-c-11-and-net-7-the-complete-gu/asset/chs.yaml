  \n（此处为图 15）\n\n### 实现 MVVM 显示数字\n\n在 Sudoku Buddy 中，我们将用一个二维数组来存储对应 81 个单元格中每一个格的数字。当用户在\
  \ WPF 窗口的任何单元格中输入数字时，我们应该能够更新我们的数据结构。此外，在执行此类更新后，我们需要验证输入是否符合游戏规则（如果不符合则进行标记），并重新计算所有受影响单元格的可能候选数。在完成这些计算后，需要将结果传回给\
  \ UI。同样，当用户点击“清除”（Clear）按钮时，UI 操作必须导致我们数据结构的初始化并相应地更新 UI。因此，我们可以看到有两个不同的实体，一个是 UI，另一个是数独网格的内存副本。有要求在所有用户操作中保持它们同步。我们可以编写自己的事件处理程序（就像我们为自定义订单表单做的那样），但对于实际应用程序，推荐的方法是实现\
  \ MVVM 模式。在为 Sudoku Buddy 应用程序实现它之前，让我们先了解什么是 MVVM。\n\n### 什么是 Model-View-ViewModel？\n\
  \nMVVM 代表 Model-View-ViewModel，这是一种软件设计模式，帮助开发者组织和结构化代码，以编写可维护、可测试和可扩展的应用程序。它将程序逻辑和用户界面控件分离，使得代码更易开发、更新和重用。该模式由三个部分组成：`Model`，它持有数据且不知道\
  \ `View` 或 `ViewModel`；`View`，显示数据的用户界面；以及 `ViewModel`，它在 `Model` 和 `View` 之间充当介者。`ViewModel`\
  \ 将 `Model` 中的数据暴露给 `View` 并提供命令。参考图 7.16。\n\n（此处为图 16）\n\nMVVM 模式常用于基于 XAML 的应用程序，如\
  \ WPF、Web UI 和 MAUI，有助于减少代码复杂性并保持整洁的代码结构。许多框架可以帮助在应用程序中实现 MVVM：`Prism`、`MVVM Cross`\
  \ 和 `Catel` 等。我们将使用微软的 `.NET Community MVVM Toolkit`，其最新版本 8.0 引入了源生成器功能。它提供了一种声明式语法来定义\
  \ MVVM 的各种元素，通过反射生成必要的代码，从而减少样板代码。\n\n### 实现 MVVM\n\n在 Models 文件夹中使用以下代码创建 `SudokuGrid.cs`\
  \ 模型类：\n\n```csharp\nusing System.Collections.Generic;\nnamespace SudokuBuddy.Models;\n\
  \npublic class SudokuGrid\n{\n    public SudokuGrid()\n    {\n        Data = new\
  \ byte[9, 9];\n        Candidates = new List<string>[9, 9];\n    }\n\n    public\
  \ byte[,] Data { get; }\n    public List<string>[,] Candidates { get; set; }\n\n\
  \    public byte[] AsLinearArray\n    {\n        set\n        {\n            for\
  \ (int i = 0; i < 9; i++)\n            {\n                for (int j = 0; j < 9;\
  \ j++)\n                {\n                    Data[i, j] = value[i * 9 + j];\n\
  \                }\n            }\n        }\n    }\n}\n```\n\n之前代码中的 `SudokuGrid`\
  \ 类声明了两个二维数组属性来存储网格数字和相应的候选数。`AsLinearArray` Setter 有助于从线性数组读取值到二维网格。\n\n添加微软的 NuGet\
  \ 包 `CommunityToolkit.Mvvm`。现在，在 ViewModels 文件夹下创建三个（视图模型）类——`CellViewModel`、`BoxViewModel`\
  \ 和 `SudokuViewModel`，使用以下代码：\n\n**CellViewModel.cs**\n\n```csharp\nusing CommunityToolkit.Mvvm.ComponentModel;\n\
  using System;\nusing System.Windows;\n\nnamespace SudokuBuddy.ViewModels;\n\npublic\
  \ partial class CellViewModel : ObservableObject\n{\n    [ObservableProperty]\n\
  \    string _digit;\n\n    [ObservableProperty]\n    string[] _candidates;\n\n \
  \   [ObservableProperty]\n    bool _hasError;\n\n    public CellViewModel()\n  \
  \  {\n        Candidates = Array.Empty<string>();\n    }\n\n    public int Row {\
  \ get; set; }\n    public int Column { get; set; }\n\n    public BoxViewModel ParentBoxViewModel\
  \ { get; set; }\n\n    public Visibility CandidatesVisibility { get; set; } = Visibility.Hidden;\n\
  }\n```\n\n\n\n\n\n`CellViewModel` 类（必须声明为分部类）继承自 MVVM Toolkit 提供的 `ObservableObject`。`ObservableObject`\
  \ 实现了 `INotifyPropertyChanged` 和 `INotifyPropertyChanging`,并提供了用于设置属性和触发变更的辅助方法。它通过属性\
  \ setter 中的 `SetProperty'方法处理所有与触发变更通知相关的逻辑。\n\n源代码生成器会为以**下划线+小写字母**开头、标记了‘’'0bservabrePropertv“”\
  \  私有字段在后台自动创建可观察属性，这使得我们可以操作第 20 行的 ‘Candidates’’变量：\n\n### Box ViewModel . cs\n\
