  \n图 5.15：变体二 - 电脑来猜\n\n### 保存游戏日志\n\nBlazor WebAssembly 通过后端 Web API 连接到服务器端的数据库。应用程序可以向\
  \ API 发送 HTTP 请求以检索或更新数据库中的数据。\n\n假设我们需要在数据库中保存一条总结游戏的日志消息。为此，我们将在 `CowsAndBulls.Server`\
  \ 中暴露 ASP.NET Core Web APIs 来执行创建、读取、更新和删除（CRUD）操作。该 API 可以从 WASM 客户端 `CowsAndBulls.Client`\
  \ 调用。\n\n创建模型类 `GameLog.cs` 来表示日志条目，如下。该类创建在 `CowsAndBulls.Shared` 项目中，以便客户端和服务器项目都可以访问它。\n\
  \n```csharp\nnamespace CowsAndBulls.Shared;\n\npublic class GameLog\n{\n    public\
  \ int Id { get; set; }\n    public string? Log { get; set; }\n}\n```\n\n在 `CowsAndBulls.Server`\
  \ 项目中，右键点击 Controller 并选择以 `GameLog` 为模型的脚手架项（Scaffolded Item）。\n\n- 添加 NuGet 包\
  \ `Microsoft.EntityFrameworkCore.SqlServer` 和 `Microsoft.EntityFrameworkCore.Tools`。\n\
  - 创建了带有端点的 `GameLogsController`。\n- 创建了 `CowsAndBullsContext`。\n- `Program.cs` 包含连接字符串。\n\
  - 在程序包控制台中执行 `Add-Migration` 和 `Update-Database` 以创建数据库。\n\n下一步是在项目中注入 `HttpClient`。在\
  \ `Pages` 文件夹中，添加一个名为 `SaveLog.razor` 的新 razor 组件，包含以下代码：\n\n```razor\n@using CowsAndBulls.Shared;\n\
  @inject HttpClient http\n@if (CanSave)\n{\n    <button class=\"btn btn-primary\"\
  \ @onclick=\"SaveMessage\">保存游戏日志</button>\n</div>\n<div class=\"alert alert-warning\"\
  \ role=\"alert\">\n    @if (Saved)\n    {\n        @message\n    }\n</div>\n\n@code\
  \ {\n    [Parameter]\n    public string? WhoGuessed { get; set; }\n\n    [Parameter]\n\
  \    public string? SecretCode { get; set; }\n\n    [Parameter]\n    public List<Attempt>\
  \ Play { get; set; } = new();\n\n    [Parameter]\n    public bool CanSave { get;\
  \ set; }\n\n    public bool Saved { get; set; } = false;\n\n    private string message\
  \ = \"\";\n\n    private async Task SaveMessage()\n    {\n        if (!Saved)\n\
  \        {\n            // 例如电脑在 6 次尝试后猜中了 4120：1234,3456,2317,4129,4120。\n    \
  \        message = $\"[{DateTime.Now:d-MMM-yyyy HH:mm}]: {WhoGuessed} 猜中 {SecretCode}\
  \ 需 {Play.Count} 次尝试 - {string.Join(\",\", Play.Select(a => a.Guess))}\";\n    \
  \        await http.PostAsJsonAsync(\"api/GameLogs\", new GameLog { Log = message\
  \ });\n            Saved = true;\n        }\n    }\n}\n```\n\n修改 `YouGuess.razor`\
  \ 以包含用于调用 `SaveLog` 组件的高亮更改如下：\n\n```razor\n@page \"/YouGuess\"\n@using CowsAndBulls.Shared;\n\
  <<h3>牛牛游戏 - 电脑思考，你来猜</h3>\n<h5 class=\"fst-italic text-primary\">电脑心里想一个 4 位数，你根据“牛”和“角”的数量找到它。</h5>\n\
  <p> <button class=\"btn btn-primary\" @onclick=\"GenerateCode\">开始新游戏</button> </p>\n\
  ```\n\n\n\n\n### 9. `<div class=\"alert alert-warning\" role=\"alert\"> @message\
  \ </div>`\n\n10. `<SaveGameLog CanSave=\"canSave\" Play=\"Play\" SecretCode=\"@guess\"\
  \ WhoGuessed=\"You\" Saved=\"@false\" />`\n\n12. `<hr />`\n\n14. 猜测：\n\n15. `<input\
  \ @bind=\"guess\" maxlength=\"4\" />`\n\n16. `<button class=\"btn btn-primary\"\
  \ @onclick=\"GetCowsAndBulls\" disabled=\"@canSave\">输入</button>`\n\n18. `<PlayTrail\
  \ Play=\"Play\" />`\n\n```csharp\n@code {\nprivate string? num;\nprivate string?\
  \ guess;\nprivate List<Attempt> Play = new();\nprivate string? message = \"\";\n\
  private bool canSave = false;\n\nprivate void GenerateCode()\n{\n    num = Helpers.GetRandomCode();\n\
  \    Play = new();\n    guess = \"\";\n    message = \"Start guessing...\";\n  \
  \  canSave = false;\n}\n\nprivate void GetCowsAndBulls()\n{\n    var attempt = Helpers.GetCowsAndBulls(num,\
  \ guess);\n    Play.Add(attempt);\n    if (attempt.Bulls == 4)\n    {\n        message\
  \ = \"Found the number, well done!\";\n        canSave = true;\n    }\n}\n}\n```\n\
  \n第 10 行包含了传递所需参数的 `SaveGameLog` 组件。在第 25 行声明的 `canSave` 标志控制着第 16 行 `Input` 按钮的启用状态，并确保只有在第\
  \ 43 行游戏结束后保存按钮才可用。保存日志的选项将如下所示：\n\n![](img/Figure_5.17.png)\n\n图 5.17：“你来猜数字”变体中的保存日志选项\n\
  \n同样，修改 `ComputerGuesses.razor` 并包含高亮更改，包括 `SaveGameLog`，如下：\n\n1. `@page \"/ComputerGuesses\"\
  `\n2. `@using CowsAndBulls.Shared;`\n3. `<h3>猜牛游戏 - 你来思考，电脑来猜</h3>`\n4. `<h5 class=\"\
  fst-italic text-primary\">想一个 4 位数，电脑根据牛和牛的数量找到它。</h5>h5>`\n5. `<p> <button class=\"\
  btn btn-primary btn-start-new-game\" @onclick=\"GenerateAllCode\">开始新游戏</button>\
  \ </p> `\n6. `<div class=\"alert alert-warning log-message\" role=\"alert\"> @message\
  \ </div>`\n8. `<SaveGameLog CanSave=\"canSave\" Play=\"Play\" SecretCode=\"@guess\"\
  \ WhoGuessed=\"Computer\" Saved=\"@false\" />`\n10. `<hr />`\n11. `<p class=\"guess\"\
  >猜测：@guess (在 @allCodes.Count 种可能性中)</p>`\n12. `<p>`\n13. 牛：`<input @bind=\"cows\"\
  \ type=\"number\" min=\"0\" max=\"4\" step=\"1\" />`\n14. 角：`<input @bind=\"bulls\"\
  \ type=\"number\" min=\"0\" max=\"4\" step=\"1\" />`\n15. `<button class=\"btn btn-primary\
  \ btn-input\" @onclick=\"InputCowsAndBulls\" disabled=\"@canSave\">输入</button>`\n\
  16. `</p>`\n18. `<PlayTrail Play=\"Play\" />`\n\n```csharp\n@code {\nprivate string?\
  \ guess;\nprivate int cows;\nprivate int bulls;\nprivate List<Attempt> Play = new();\n\
  private List<string> allCodes = new();\nprivate string? message = \"\";\nprivate\
  \ bool canSave = false;\n\nprivate void GenerateAllCode()\n{\n    allCodes = Helpers.GetAllCodes();\n\
  \    guess = Helpers.SelectRandomCode(allCodes);\n    Play = new();\n    cows =\
  \ 0;\n    bulls = 0;\n    message = \"Let us begin...\";\n    canSave = false;\n\
  }\n\nprivate void InputCowsAndBulls()\n{\n    if (canSave) return;\n    var attempt\
  \ = new Attempt { Guess = guess, Bulls = bulls, Cows = cows };\n    Play.Add(attempt);\n\
  \    allCodes = Helpers.GetPossibleCodes(allCodes, attempt);\n    guess = Helpers.SelectRandomCode(allCodes);\n\
  \    if (allCodes.Count == 0)\n    message = \"放弃吧！我认为你提供的线索错误，请核实牛和角的数量。\";\n \
  \   else if (allCodes.Count == 1)\n    {\n        message = \"游戏结束。找到数字了!\";\n \
  \       canSave = true;\n    }\n}\n}\n```\n\n通过上述更改后，保存游戏日志按钮将在游戏结束后出现，点击该按钮会将消息保存到数据库中。消息在\
  \ UI 上显示如下：\n\n![](img/Figure_5.18.png)\n\n图 5.18：“电脑猜数字”变体中的保存日志选项\n\n在此阶段，我们可以通过直接检查数据库进行验证。现在让我们提供一个\
  \ UI 来查看日志条目。\n\n创建查看游戏日志的 UI\n\n在 `CowsAndBulls.Client` 项目创建一个名为 `ShowGameLog.razor`\
  \ 的新 Razor 组件，代码如下：\n\n1. `@page \"/GameLog\"`\n2. `@using CowsAndBulls.Shared;`\n\
  3. `@inject HttpClient http`\n5. `<h3>游戏日志</h3>`\n6. `@if (Logs == null)`\n7. `{`\n\
  8. `<text>加载中...</text>`\n9. `}`\n10. `else if (Logs.Count == 0)`\n11. `{`\n12.\
  \ `<text>无记录。</text>`\n13. `}`\n14. `else`\n15. `{`\n16. `<table class=\"table\"\
  >`\n17. `<thead>`\n18. `<tr>`\n19. `<th>牛</th><th>角</th>`\n20. `</tr>`\n21. `</thead>`\n\
  22. `<tbody>`\n23. `@foreach (logEntry in Logs)`\n24. `{`\n25. `<tr>`\n26. `<td>@logEntry.Cows</td><td>@logEntry.Bulls</td>`\n\
  27. `</tr>`\n28. `}`\n29. `</tbody>`\n30. `</table>`\n31. `}`\n32. `@code {`\n33.\
  \ `GameLog[] Logs { get; set; }`\n35. `protected async Task OnInitialized()`\n36.\
  \ `{`\n37. `Logs = await http.GetFromJsonAsync<GameLog[]>(\"api\");`\n38. `}`\n\
  39. `}`\n\n前面的代码使用 `@inject` 注入在 `Program.cs` 中注册的 `HttpClient`。该 `HttpClient` 用于请求并解析\
  \ JSON 体以创建 `GameLog` 数组。这些条目在 `NavMenu.razor` 中迭代。\n\n创建可用类库\n\nRazor 类库 (RCL)\
  \ 可用于在多个项目中共享 视图、页面和数据模型。为了演示，我们将创建一个简单的 Razor 类库并使用它。创建一个名为 `CustomMessage.razor`\
  \ 的组件，代码如下：\n\n1. `<div class=\"custom-message\">`\n2. `@if (!Hide)`\n3. `{`\n4.\
  \ `<div class=\"alert-warning\" role=\"alert\"> @Message </div>`\n5. `}`\n6. `</div>`\n\
  7. `@code {`\n8. `[Parameter]`\n9. `public string? Message { get; set; }`\n11. `[Parameter]`\n\
  12. `public bool Hide { get; set; } = false;`\n13. `}`\n\n在 `CowsAndBulls.Client`\
  \ 项目中为 `ComponentLibrary` 添加项目引用。并在两个组件 `YouGuess.razor` 和 `ComputerGuesses.razor`\
  \ 中进行以下替换：\n\n| 旧代码 | `<div class=\"alert-warning log-message\" role=\"alert\">\
  \ @message </div>` |\n| 新代码 | `<ComponentLibrary.CustomMessage Hide=\"@false\" Message=\"\
  @message\" />` |\n\n游戏的这两个变体将正常工作。接下来，我们将演示从 `ComponentLibrary` 调用 JavaScript 方法。用以下内容替换\
  \ `ComponentLibrary` 中的 `/wwwroot/exampleJsInterop.js`：\n\n```javascript\nexport\
  \ function showPrompt(message) {\n  return console.info(message);\n}\n```\n\n在 `YouGuess.razor`\
  \ 中进行高亮更改：\n\n1. `@page \"/page\"`\n2. `@inject IJSRuntime JSRuntime`\n3. `@using\
  \ ComponentLibrary;`\n4. `@using CowsAndBulls.Shared;`\n6. `<h3>猜牛游戏 – 电脑来思考，你来猜</h3>`\n\
  7. `<h5 class=\"fst-italic text-primary\">电脑想一个 4 位数 <span @ondblclick=\"RevealNumber\"\
  >数字</span>，你根据牛和角的数量找到它。</h5>h5>`\n8. `…`\n\n并在 `YouGuess.razor` 的 `@code` 块中包含以下方法：\n\
  \n```csharp\nprivate async void RevealNumber()\n{\n    await (new ExampleJsInterop(JSRuntime)).Prompt($\"\
  秘密代码显示 -> {num}\");\n}\n```\n\n\n\n\n在前面的代码中，我们调用了 `ComponentLibrary` 中的 `ExampleJsInterop.Prompt`\
  \ 方法，该方法又调用了 `exampleJsInterop.js` 中的 `showPrompt` JavaScript 方法，以便使用注入的 `JSRuntime`\
  \ 写入控制台。这实际上是一段“作弊代码”，如所示，在控制台中输出秘密代码：\n\n![](img/Figure_5.20.png)\n\n图 5.20：从 Razor\
  \ 类库调用 JavaScript\n\n# 测试\n\n测试 Blazor 程序的策略围绕测试 Razor 组件展开。即渲染组件、触发事件，然后对预期结果进行断言。测试的两种常用方法是通过模拟（mock）外部依赖进行单元测试，以及在浏览器实例中运行\
  \ Blazor 应用及其相关的依赖基础设施进行端到端测试。我们将使用这两种方法来编写测试。\n\n## 使用 bUnit 进行单元测试\n\n微软没有为 Blazor\
  \ 提供测试框架。`bUnit` 是一个社区驱动的项目，帮助对 Razor 组件进行单元测试。它可以与通用测试框架（如 `MSTest`、`NUnit` 和 `xUnit`）配合使用。\n\
  \n在解决方案中添加一个名为 `CowsAndBulls.Test` 的新 MS Test 项目。为 `CowsAndBulls.Client` 和 `CowsAndBulls.Shared`\
  \ 项目添加引用。添加由 Egil Hansen 的 NuGet 包 `bUnit`。打开项目文件并将 SDK 条目设置为如下：\n\n```xml\n<Project\
  \  Sdk=\"Microsoft.NET.Sdk.Razor\">\n```\n\n在项目中创建一个名为 `ComputerGuessesTests.cs`\
  \ 的新类，包含以下代码。\n\n```csharp\nusing Bunit;\nusing CowsAndBulls.Client.Pages;\nnamespace\
  \ CowsAndBulls.Test;\n[TestClass]\npublic class ComputerGuessesTests\n{\n    private\
  \ Bunit.TestContext ctx;\n\n    // 被测组件\n    private IRenderedComponent<ComputerGuesses>\
  \ cut;\n\n    [TestInitialize] // 在每个测试执行前运行\n    public void Setup()\n    {\n \
  \       ctx = new Bunit.TestContext();\n        cut = ctx.RenderComponent<ComputerGuesses>();\n\
  \    }\n\n    [TestCleanup] // 在每个测试执行后运行\n    public void Cleanup()\n    {\n  \
  \      cut.Dispose();\n        ctx.Dispose();\n    }\n\n    [TestMethod]\n    public\
  \ void ComponentRendersCorrectly()\n    {\n        // 验证标题说明是否存在\n        Assert.IsTrue(cut.Markup.Contains(\"\
  <h3>Cows and Bulls - You think and computer guesses</h3>\"));\n    }\n\n    [TestMethod]\n\
  \    public void GameBeginsCorrectly()\n    {\n        var buttonStartNewGame =\
  \ cut.Find(\"button.btn-start-new-game\");\n        buttonStartNewGame.Click();\n\
  \n        // 验证游戏开始时的标签是否存在\n        Assert.IsTrue(cut.Markup.Contains(\"Let us\
  \ begin...\"));\n        Assert.IsTrue(cut.Markup.Contains(\"Out of 4536 possibilities\"\
  ));\n    }\n\n    [TestMethod]\n    public void GamePlayedCorrectly()\n    {\n \
  \       // 输入按钮点击两次，模拟为 0 头牛和 0 头羊\n        var buttonInput = cut.Find(\"button.btn-input\"\
  );\n        buttonInput.Click();\n        buttonInput.Click();\n\n        // 验证错误情况下的标签是否存在\n\
  \        Assert.IsTrue(cut.Markup.Contains(\"Give up! I think you provided incorrect\
  \ clues, please verify the count of cows and bulls.\"));\n        Assert.IsTrue(cut.Markup.Contains(\"\
  Out of 0 possibilities\"));\n    }\n}\n```\n\n在前面的 MSTest 单元测试中，`Bunit TestContext`\
  \ 的初始化发生在第 17 行，随后创建了 `Computer Guesses` 组件的实例，该组件是被测组件。由于这段代码位于带有 `TestInitialize`\
  \ 属性的 `Setup` 方法中，因此它将在执行每个测试之前运行。同样，`Cleanup` 方法会在执行每个测试后被调用，用以释放 `TestContext`\
  \ 和 `RenderComponent` 对象。在第一个测试 `ComponentRendersCorrectly` 中，我们通过检查第 32 行页面上是否存在特定标题来验证组件是否渲染正确。在下一个单元测试\
  \ `GameBeginsCorrectly` 中，我们首先获取了“开始新游戏”按钮的引用，随后在第 39 行调用该按钮的 `Click` 事件。接着在第 42\
  \ 行和第 43 行验证页面上是否存在预期的字符串。在下一个测试 `GamePlayedCorrectly` 中，我们点击两次输入按钮，以模拟两次输入零头牛和零头羊的情况。由于这是一个不可能的情况，我们预计会在第\
  \ 55 行和第 56 行看到错误相关消息。\n\n# 使用 Playwright .NET 进行端到端测试\n\nPlaywright .NET 是一个类似于\
  \ `Selenium WebDriver` 的工具，用于 Web 应用程序的端到端自动化。`Playwright` 支持所有现代渲染引擎，包括 `Chromium`、`WebKit`\
  \ 和 `Firefox`，并支持 Windows、Linux 和 macOS 测试。\n\n```csharp\nusing Microsoft.Playwright;\n\
  using Microsoft.Playwright.MSTest;\nnamespace CowsAndBulls.Test;\n\n[TestClass]\n\
  public class ComputerGuessesEETests : PageTest\n{\n    private const string BaseUrl\
  \ = \"https://localhost:7017\";\n\n    [TestMethod]\n    public async Task CanNavigateToHomePage()\n\
  \    {\n        await Page.GotoAsync(BaseUrl);\n        await Expect(Page).ToHaveTitleAsync(\"\
  The Game of Cows and Bulls\");\n    }\n\n    [TestMethod]\n    public async Task\
  \ ComputerGuessesTests()\n    {\n        await Page.GotoAsync($\"{BaseUrl}/ComputerGuesses\"\
  );\n        await Expect(Page).ToHaveTitleAsync(\"CowsAndBulls\");\n\n        //\
  \ 获取页面上的定位器\n        var locatorButtonNewGame = Page.GetByRole(AriaRole.Button,\
  \ new() { Name = \"Start new game\" });\n        var locatorButtonInput = Page.GetByRole(AriaRole.Button,\
  \ new() { Name = \"Input\" });\n        var locatorLogMessage = Page.Locator(\"\
  .log-message\");\n        var locatorGuessPara = Page.Locator(\".guess\");\n\n \
  \       // 点击按钮开始新游戏\n        await locatorButtonNewGame.ClickAsync();\n\n     \
  \   // 验证游戏开始时的页面标签\n        await Expect(locatorLogMessage).ToContainTextAsync(\"\
  Let us begin...\");\n        await Expect(locatorGuessPara).ToContainTextAsync(\"\
  Out of 4536 possibilities\");\n\n        // 点击两次输入按钮，即输入零头牛和零头羊\n        await locatorButtonInput.ClickAsync();\n\
  \        await locatorButtonInput.ClickAsync();\n\n        // 验证错误情况下的页面标签\n   \
  \     await Expect(locatorLogMessage).ToContainTextAsync(\"Give up! I think you\
  \ provided incorrect clues, please verify the count of cows and bulls.\");\n   \
  \     await Expect(locatorGuessPara).ToContainTextAsync(\"Out of 0 possibilities\"\
  );\n    }\n}\n```\n\n\n\n\n在 `CanNavigateToHomePage` 测试中，我们导航到主页并验证了页面标题。同样，在下一个测试\
  \ `ComputerGuessesTests` 中，第 21 行和第 22 行我们导航到 `Computer Guesses` 变体，然后验证了页面标题。在第\
  \ 25 行到第 28 行之间设置了定位器供后续测试使用。第 30 行触发了 `Start new game` 按钮的点击事件，随后在第 33 行和第 34 行验证文本是否存在。第\
  \ 37 行和第 38 行点击了两次 `Input` 按钮，这模拟了输入 `0` 头牛和 `0` 头羊的值，由于这种情况是不可能的，我们在第 41 行和第 42\
  \ 行断言了预期的文本。要运行这些测试，请先启动网站。右键点击 `CowsAndBulls.Server` 并选择 `Debug | Start Without\
  \ Debugging`，之后，右键点击测试类名 `ComputerGuessesE2ETests` 应该显示 `Run tests` 选项，点击该选项即可正常运行这两个测试。\n\
  \n## 部署\n\nBlazor 程序的部署方式根据应用类型略有不同，取决于它是 Blazor Server 应用还是 Blazor WebAssembly\
  \ 应用。要托管并部署 Blazor WebAssembly 应用程序，请遵循 [`learn.microsoft.com/en-us/aspnet/core/blazor/host-and-deploy/webassembly?view=aspnetcore-7.0`](https://learn.microsoft.com/en-us/aspnet/core/blazor/host-and-deploy/webassembly?view=aspnetcore-7.0)\
  \ 提供的说明。\n\n## 结论\n\n在本章中，我们学习了什么是 Blazor 应用以及它们的不同类型，并端到端构建了一个 Blazor WebAssembly\
  \ 应用程序。\n\n在下一章中，我们将重点探索使用 ASP.NET Core 和 Angular 框架的单页应用程序。\n\n## 注意事项\n\n* Blazor\
  \ 是一种新的基于 Razor 组件的 UI 框架，用于构建交互丰富的 Web ，它包含在 `.NET Core 3` 中。\n* Blazor 与传统的基于\
  \ JavaScript 框架的单页应用程序的主要区别在于，Blazor 组件完全使用 `C#` 和 `Razor` 编写，不需要 JavaScript。\n\
  * Blazor 应用程序有两种类型——`Blazor Server` 和 `Blazor WebAssembly`。\n* WebAssembly 在客户端浏览器上原生运行，现在已经可以将许多高级语言编译为\
  \ WebAssembly。\n\n## 练习\n\n通过以下更改对本章构建的 Blazor WebAssembly 应用程序进行增强。\n\n* 我们在本章构建的“牛与羊”游戏使用\
  \ 4 位密码密码，但也可以用不同的位数进行游戏。修改应用程序以支持 5 位数。允许用户指定他们想要运行的位数。\n* 游戏日志增长得很快，因此在游戏日志页面上提供一个清除记录的选项。有了此选项，当用户点击新按钮时，除最后\
