  \ } = default!;\npublic DbSet<Models.Publisher> Publishers { get; set; } = default!;\n\
  ```\n\n`DbContext` 中的值将被读取以生成数据库架构脚本，通过将其变为复数，我们将确保表也遵循类似的约定。\n\n现在运行以下命令创建初始架构。在运行命令之前，请确保在\
