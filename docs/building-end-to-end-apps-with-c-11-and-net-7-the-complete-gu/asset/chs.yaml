  \ - 部署方式\n    - 预测引擎的线程安全\n\n## 目标\n\n本章的目标是理解机器学习的概念，并探索 ML.NET 通过构建高效的机器学习模型来解决各种任务的能力。本章将引导你如何使用\
  \ `C#` 和 Visual Studio 作为工具，开始使用 ML.NET 解决机器学习问题。其目的是激发你足够的好奇心，以便你深入学习机器学习。为此，参考章节中提供的资源将是你追求进一步学习的良好起点。\n\
  \n## 机器学习概述\n\n机器学习（ML）是人工智能（AI）的一个子领域，它使计算机系统能够从数据模型中学习并从经验中不断改进，而不需要显式的程序编写。正因如此，它通常被称为“对未编程的程序进行编程”。与编写显式规则和指令的传统编程不同，机器学习涉及算法和模型的开发，这些模型能够根据数据中的模式和关系自动学习并做出预测或决策。\n\
  \n作为一个更广泛的概念，AI 涵盖了更广泛的概念和技术以创建智能系统。机器学习严重依赖数据，而 AI 在包含机器学习技术之外，还可以结合符号推理和知识表示等各种方法。\n\
  \n机器学习的一些技术和场景在图 10.1 所示：\n\n![](img/Figure_10.1.png)\n\n图 10.1: 机器学习场景\n\n该领域仍在快速发展，不断开发新的算法和方法来应对日益复杂的问题。\n\
  \n## ML.NET\n\nML.NET 是由微软开发的一个开源跨平台机器学习框架，它允许开发者使用 `C#` 和 `F#` 等 .NET 编程语言将机器学习模型集成到应用程序中。ML.NET\
  \ 通过提供高级级 API 以及一系列内置算法和数据转换组件，简化了构建、训练和部署机器学习模型的过程。\n\nML.NET 由微软于 2018 年作为一个实验性项目引入，从以后已演变为一个稳定且成熟的框架。它经历了多次更新和改进，扩展了功能，并成为\
  \ .NET 生态系统中机器学习任务的强大工具。\n\nML.NET 可应用于各种类型的机器学习问题。不同的场景以及一些示例在下表 10.1 中：\n\n| 场景\
  \ | 问题示例 |\n| --- | --- |\n| 二分类分类 | - 垃圾邮件检测：根据邮件的内容和元数据将电子邮件分类为垃圾邮件或非垃圾邮件。<br>-\
  \ 欺诈检测：识别财务数据集中的欺诈交易。<br>- 疾病诊断：根据症状和病史预测患者是否患有特定疾病。 |\n| 多分类 | - 图像分类：将图像分为猫、狗和鸟类等不同类别。<br>-\
