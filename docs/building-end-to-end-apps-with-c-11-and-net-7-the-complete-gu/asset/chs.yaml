  \n在前面的代码段中，第 17、18 和 20 行演示了 `nameof` 的现有用法。新功能允许在第 14 行使用 `CustomNullCheck(nameof(values))`\
  \ 而不是 `CustomNullCheck(\"values\")`。第 22 和 26 行分别演示了局部函数和参数声明的扩展作用域。\n### 文件作用域类型\
  \ (File-scoped types)\n\nC# 11 引入了一个新的访问修饰符 `file`。创建的类型可见性被限制在声明它的源文件中。此功能有助于源生成器作者避免命名冲突。文件本地类型不能嵌套，并且在类型上不能将\
  \ `file` 与任何访问性修饰符（private、public、protected 等）结合使用，因为它被视为一个与访问性独立的独立概念。\n```csharp\n\
  // File1.cs\n\ninternal class FileLocalTypes\n}\n\n{\n}\n// File2.cs\nnamespace\
  \ SecondNS;\nfile class Animal // 与 File1 中的 Animal 是不同的符号\n{\n\n// File3.cs\n\n\
  var animal = new Animal(); // error: 找不到类型或命名空间 'Animal'。\n\n由于文件修饰符的存在，`File1.cs`\
  \ 和 `File2.cs` 中定义的 `Animal` 类是不同的。在 `File3.cs` 中尝试访问其中任何一个都会报错。\n\n\nC# 11 现在也支持属性类使用泛型。早期的属性必须接受\
  \ `System.Type` 作为参数，用户需要通过传递 `typeof` 表达式为属性提供其所需的类型。现在属性可以使用现有的类型参数约束系统来表达它们对输入泛的要求。\n\
  ```csharp\nnamespace _01_NewFeatures.Features;\n// C# 11 之前 -----------\ninternal\
  \ class BeforeCSharp11\n    [CustomTypeAttribute(typeof(string))]\n    public string?\
  \ Method() => default;\n\npublic class CustomTypeAttribute : Attribute\n    public\
  \ CustomTypeAttribute(Type t) => ParamType = t;\n    public Type ParamType { get;\
  \ }\n\n// ------------------------\n{\n    [GenericAttribute<string>()]\n}\n\n```\n\
  \n\n### 泛型数学 (Generic math)\n.NET 7 在基础类库中引入了新的与数学相关的泛型接口。此外，C# 11 允许定义静态抽象接口成员。这些创新使得能够以泛型方式执行数学操作——即不需要知道具体的类型。之前，必须为每个类型创建一个重载方法。现在可以编写单一的泛型方法，其中参数类型被约束为类数字类型。\n\
