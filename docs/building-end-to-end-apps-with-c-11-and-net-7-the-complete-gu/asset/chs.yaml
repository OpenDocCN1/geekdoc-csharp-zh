  \ 和 `Error.cshtml` |\n| .gitignore | 用于忽略 Visual Studio 临时文件、生成结果以及某些插件生成文件的 Git\
  \ 文件。 |\n| appsettings.json | 与其他项目一样，此文件包含项目的通用设置。 |\n| Program.cs | 与其他 Web 应用一样，在此配置请求处理管道的一系列中间件组件以及启动期间所需的服务。\
  \ |\n| WeatherForecast.cs | `WeatherForecastController.cs` 中引用的模型类 |\n\n表 6.2：ASP.NET\
  \ Core Angular 项目中的重要文件和文件夹\n\n项目在解决方案管理器中显示如下：\n\n![](img/Figure_6.1.png)\n\n图\
  \ 6.1：默认 Angular 应用中的文件\n\n如前所述，`ClientApp` 文件夹存放完整的 Angular 应用，它可以与其所有依赖项独立运行。让我们检查此基础应用中的重要文件：\n\
  \n- `.angular/`: 此文件夹包含 Angular CLI 使用的缓存。\n- `node_modules/`: 除非选择显示所有文件，否则此文件夹在解决方案管理器中可见。它包含\
  \ Node 包管理器 (NPM) 包依赖项。\n- `src/`: 这是应用程序项目的根文件夹。\n- `src/app/`: 包含定义逻辑和数据的组件文件。\n\
  - `src/app/app.component.html`: 定义与根 `AppComponent` 关联的 HTML 模板。\n- `src/app/app.component.ts`:\
  \ 此 TypeScript 文件定义了根组件 `AppComponent` 的逻辑。随着应用程序添加新的组件和服务，与根组件关联的视图将成为视图层次结构的根。\n\
  \n\n\n\n\n| 路径 | 说明 |\n| :--- | :--- |\n| `src/app/app.module.ts` | 定义根模块，名为 `AppModule`，它告诉\
  \ Angular 如何组装应用程序。初始仅声明 `AppComponent`。随着更多组件的添加，它们必须在此处声明。 |\n| `src/app/app.server.module.ts`\
  \ | 这是服务器端应用模块，适用于服务端渲染 (SSR) 情况。 |\n| `src/assets/` | 包含图像和其他资源文件，在构建应用程序时会按原样复制。\
  \ |\n| `src/environments` | 包含用于设置环境特定设置的文件。 |\n| `src/index.html` | 访问该网站时提供的主\
  \ HTML 页面。CLI 在构建应用时会自动添加所有 JavaScript 和 CSS 文件，无需手动添加任何 `<script>` 或 `<link>` 标签。\
  \ |\n| `src/main.ts` | 这是应用程序的主要入口。它使用 JIT 编译器编译应用程序并启动应用程序根模块 `AppModule` 以在浏览器中运行。\
  \ |\n| `src/Polyfills.ts` | 此文件包含 Angular 所需的补性填充（polyfills），并在应用加载之前加载。可以向此文件添加额外的\
  \ polyfills。 |\n| `src/styles.css` | 列出为项目提供样式的 CSS 文件。扩展名反映了项目配置的样式预处理器。 |\n| `src/tests.ts`\
  \ | `karma.conf.js` 需要此文件，并递归加载所有的 `.spec.ts` 和框架文件 |\n| `.browserslistrc` | 此文件用于构建系统，调整\
  \ CSS 和 JS 输出以支持指定的浏览器 |\n| `.editorconfig` | 包含代码编辑器的配置。 |\n| `.gitignore` | 指定\
  \ Git 应该忽略的未跟踪文件。 |\n| `angular.json` | 此文件包含 CLI 使用的项目默认配置，包括构建、提供和测试的配置选项。 |\n\
  | `aspnetcore-https.js` | 该脚本使用 ASP.NET Core HTTPS 证书为应用程序设置 HTTPS。 |\n| `karma.conf.js`\
  \ | 这是 Karma 单元测试运行器的配置文件。 |\n| `package.json` | 配置项目可用的 NPM 包依赖项。 |\n| `proxy.conf.js`\
  \ | 此文件包含用于设置 SPA 代理的参数 |\n| `README.md` | 根应用程序的介绍文档。 |\n| `tsconfig.json` | 工作区中项目的基础\
  \ TypeScript 配置。其他配置文件（应用程序特定的 `tsconfig.app.json` 和测试特定的 `tsconfig.spec.json` 配置文件）继承自此基础文件。\
  \ |\n\n**表 6.3：ASP.NET Core Angular 项目中的重要文件和文件夹**\n\n### Angular 组件\n\n组件是 Angular\
  \ 应用程序的构建块。组件包含一个 TypeScript 类，该类带有 `@Component()` 装饰器以指定元数据 - 关于该类的 HTML 模板和样式。TypeScript\
  \ 类和 HTML 模板支持双向绑定，这意味着类监听来自 HTML 文件的所有 HTML 事件，如果类中的数据元素发生变化，该变化将反映在 HTML 模板上。\n\
  \n![](img/Figure_6.2.png)\n\n**图 6.2：Angular 组件**\n\n`ClientApp` Angular 应用程序由组件组成\
  \ - 除了根应用组件外，还有 counter、fetch-data、home 和 nav-menu。每个组件都有自己的 TypeScript 类和 HTML\
  \ 模板。某些组件还有自己的样式 `.css` 文件和单元测试 `.spec.ts` 文件。让我们检查计数组件的文件。\n\n#### 类 - counter.component.ts\n\
  \n```typescript\n1. import { Component } from '@angular/core';\n3. @Component({\n\
  4. selector: 'app-counter-component',\n5. templateUrl: './counter.component.html'\n\
  6. })\n7. export class CounterComponent {\n8. public currentCount = 0;\n10. public\
  \ incrementCounter() {\n11. this.currentCount++;\n12. }\n13. }\n```\n\n前面的代码创建了一个带有\
  \ `@Component()` 装饰器的组件，该装饰器带有元数据，告诉 Angular 在何处找到 HTML 模板，并声明了选择器，允许将其作为 HTML 标签放置在其他模板中。\n\
  \n#### HTML 模板 - counter.component.html\n\n```html\n1. <h1>Counter</h1>\n3. <p>This\
  \ is a simple example of an Angular component.</p>\n5. <p aria-live=\"polite\">Current\
  \ count: <strong>{{ currentCount }}</strong></p>\n7. <button class=\"btn btn-primary\"\
  \ (click)=\"incrementCounter()\">Increment</button>\n```\n\n前面的代码是对应计数组件的 HTML 模板，用于声明组件将如何渲染。它可以使用组件类中的属性和方法。第\
  \ 5 行使用双大括号 `{{ }}` 中的 `currentCount` 属性来动态替换它。第 7 行在点击按钮事件时调用 `incrementCounter`\
  \ 方法。\n\n#### 组件测试 - counter.component.spec.ts\n\n```typescript\n1. import { async,\
  \ ComponentFixture, TestBed } from '@angular/core/testing';\n3. import { CounterComponent\
  \ } from './counter.component';\n5. describe('CounterComponent', () => {\n6. let\
  \ fixture: ComponentFixture<CounterComponent>;\n8. beforeEach(async(() => {\n9.\
  \ TestBed.configureTestingModule({\n10. declarations: [CounterComponent]\n11. })\n\
  12. .compileComponents();\n13. }));\n15. beforeEach(() => {\n16. fixture = TestBed.createComponent(CounterComponent);\n\
  17. fixture.detectChanges();\n18. });\n20. it('should display a title', async(()\
  \ => {\n21. const titleText = fixture.nativeElement.querySelector('h1').textContent;\n\
  22. expect(titleText).toEqual('Counter');\n23. }));\n25. it('should start with count\
  \ 0, increments by 1 when clicked', async(() => {\n26. const countElement = fixture.nativeElement.querySelector('strong');\n\
  27. expect(countElement.textContent).toEqual('0');\n29. const incrementButton =\
  \ fixture.nativeElement.querySelector('button');\n30. incrementButton.click();\n\
  31. fixture.detectChanges();\n32. expect(countElement.textContent).toEqual('1');\n\
  33. }));\n34. });\n```\n\n前面是使用 Jasmine 测试框架的计数组件测试文件。第 20 行的第一个测试验证页面标题。在第 25 行的第二个测试中，我们首先确保计数为零，点击后变为一。\n\
  \n### Angular 模块\n\n除了组件外，模块是 Angular 应用程序的另一个构建块。模块描述了应用程序部分如何组合。每个应用程序至少有一个模块，根模块启动应用程序。`ClientApp`\
  \ 包含了所示的 `app.module.ts` 中的根模块。\n\n```typescript\n1. import { BrowserModule } from\
  \ '@angular/platform-browser';\n2. import { NgModule } from '@angular/core';\n3.\
  \ import { FormsModule } from '@angular/forms';\n4. import { HttpClientModule }\
  \ from '@angular/common/http';\n5. import { RouterModule } from '@angular/router';\n\
  7. import { AppComponent } from './app.component';\n8. import { NavMenuComponent\
  \ } from './nav-menu/nav-menu.component';\n9. import { HomeComponent } from './home/home.component';\n\
  10. import { CounterComponent } from './counter/counter.component';\n11. import\
  \ { FetchDataComponent } from './fetch-data/fetch-data.component';\n13. @NgModule({\n\
  14. declarations: [\n15. AppComponent,\n16. NavMenuComponent,\n17. HomeComponent,\n\
  18. CounterComponent,\n19. FetchDataComponent\n20. ],\n21. imports: [\n22. BrowserModule.withServerTransition({\
  \ appId: 'ng-cli-universal' }),\n23. HttpClientModule,\n24. FormsModule,\n25. RouterModule.forRoot([\n\
  26. { path: '', component: HomeComponent, pathMatch: 'full' },\n27. { path: 'counter',\
  \ component: CounterComponent },\n28. { path: 'fetch-data', component: FetchDataComponent\
  \ },\n29. ])\n30. ],\n31. providers: [],\n32. bootstrap: [AppComponent]\n33. })\n\
  34. export class AppModule { }\n```\n\n前面代码中的模块启动了应用程序中的组件和其他所需的模块。在第 25 行到第 28\
  \ 行之间声明了路由以访问 counter 和 fetch-data 组件。\n\n\n\n\n\n# SPA 模板应用的工作原理\n\n如开头所述，使用 Visual\
  \ Studio SPA 模板创建的单页应用（SPA）将前端 `angular` 应用和后端 `ASP.NET core` 应用结合在单个项目中。虽然可以单独运行它们中的每一个，但此此模板使得执行一个项目并同时运行客户端和服务器应用程序变得非常方便。对于随\
  \ `.NET SDK` 提供的的 `Angular` 和 `React` 模板，这一步骤是相同的。\n\n在开发期间，应用被配置为使用前端代理。`React`\
  \ 和 `Angular` 使用相同的前端代理。代理服务器信息包含在项目文件中，如下所示代码片段中的高亮行。\n\n```xml\n<Project Sdk=\"\
  Microsoft.NET.Sdk.Web\">\n  <PropertyGroup>\n    <TargetFramework>net7.0</TargetFramework>\n\
  \    <Nullable>enable</Nullable>\n    <IsPackable>false</IsPackable>\n    <SpaRoot>ClientApp\\\
  \\cf1 </SpaRoot>\n    <SpaProxyServerUrl>https://localhost:44418</SpaProxyServerUrl>\n\
  \    <SpaProxyLaunchCommand>npm start</SpaProxyLaunchCommand>\n    <ImplicitUsings>enable</ImplicitUsings>\n\
  \  </PropertyGroup>\n  <ItemGroup>\n    <PackageReference Include=\"Microsoft.AspNetCore.SpaProxy\"\
  \ Version=\"7.0.2\" />\n  </ItemGroup>\n</Project>\n```\n\n第 13 行引用的包 `Microsoft.AspNetCore.SpaProxy`\
  \ 根据第 7 行和第 8 行的配置启用代理服务器。`SpaProxyServerUrl` 是 SPA 代理的 URL。服务器检查代理是否就绪，如果没有它将使用\
  \ `SpaProxyLaunchCommand` 中的命令启动代理。\n\n`Angular` 应用中启用代理运行的客户端设置分布在下面列出的 `package.json`、`angular.json`\
  \ 和 `proxy.conf.js` 中。\n\n### package.json\n```json\n{\n  \"name\": \"firstangularapp\"\
  ,\n  \"version\": \"0.0.0\",\n  \"scripts\": {\n    \"ng\": \"ng\",\n    \"prestart\"\
  : \"node aspnetcore-https\",\n    \"start\": \"run-script-os\",\n    \"start:windows\"\
  : \"ng serve --port 44418 --ssl\",\n  }\n}\n```\n\n\n\n\n```typescript\nimport {\
  \ HttpClientModule } from '@angular/common/http';\nimport { RouterModule } from\
  \ '@angular/router';\nimport { AppComponent } from './app.component';\nimport {\
  \ NavMenuComponent } from './nav-menu/nav-menu.component';\nimport { HomeComponent\
  \ } from './home/home.component';\nimport { CounterComponent } from './counter/counter.component';\n\
  import { FetchDataComponent } from './fetch-data/fetch-data.component';\n\n@NgModule({\n\
  \  declarations: [\n    AppComponent,\n    NavMenuComponent,\n    HomeComponent,\n\
  \    CounterComponent,\n    FetchDataComponent\n  ],\n  imports: [\n    BrowserModule.withServerTransition({\
  \ appId: 'ng-cli-universal' }),\n    HttpClientModule,\n    FormsModule,\n    RouterModule.forRoot([\n\
  \      { path: '', component: HomeComponent, pathMatch: 'full' },\n      { path:\
  \ 'counter', component: CounterComponent },\n      { path: 'fetch-data', component:\
  \ FetchDataComponent },\n    ])\n  ],\n  providers: [],\n  bootstrap: [AppComponent]\n\
  })\nexport class AppModule { }\n```\n\n3. 删除文件夹 – `counter` 和 `fetch-data`\n4. `nav-menu/nav-menu.component.html`\
  \ – 删除与 `counter` 和 `fetch-data` 路由相关的行，并将文本 `DigitalBookStoreNgApp` 改为 `Digital\
  \ Book Store`。\n5. `src/index.html` – 将页面标题从 `DigitalBookStoreNgApp` 改为 `Digital\
  \ Book Store`。\n\n将项目设置为启动项目并运行，确保项目编译正常。完成所有清理工作后，UI 显示如下：\n\n![](img/Figure_6.12.png)\n\
  \n图 6.12：清理后的初始 UI\n\n## 创建模型\n\n在 `/Models` 文件夹下创建包含以下代码的模型类：\n\n**Publisher.cs**\n\
  \n```csharp\nnamespace 维持 DigitalBookStoreNgApp.Models;\n\npublic class Publisher\n\
  {\n    public int Id { get; set; }\n    public string Name { get; set; }\n}\n```\n\
  \n**Book.cs**\n```csharp\nnamespace DigitalBookStoreNgApp.Models;\n\npublic class\
  \ Book\n{\n    public int Id { get; set; }\n    public string Title { get; set;\
  \ }\n    public decimal Price { get; set; }\n\n    /// <summary>\n    /// 一个或多个用分号分隔的作者字符串\n\
  \    /// </summary>\n    public string Authors { get; set; }\n\n    /// <summary>\n\
  \    /// 一个或多个用分号分隔的标签字符串\n    /// </summary>\n    public string Tags { get; set;\
  \ }\n\n    public int PublisherId { get; set; }\n    public Publisher? Publisher\
  \ { get; set; }\n    public DateTime PublishDate { get; set; }\n}\n```\n\n## 脚架\
  \ – API 控制器\n\n我们将使用 Visual Studio 的脚架选项来创建一个具有 CRUD 操作的基本 API 控制器。右键点击 `Controller`\
  \ 文件夹并选择 `Add | New Scaffolded Item`。在“添加新脚架项”对话框中，选择 `API Controller with actions`\
  \ 并使用 `Entity Framework`。点击 `Add` 后，在下一个对话框中选择 `Book` 类作为模型类，并通过点击 `+` 按钮创建一个新的\
  \ `DbContext` 类。其他所有项保持默认：\n\n![](img/Figure_6.13.png)\n\n图 6.13：Books API 控制器的脚架选项。\n\
  \n点击 `Add` 后，将创建具有相关 CRUD 操作端点的 `BooksController` 和 `DbContext`。项目将添加适用于 `EF Core`\
