  \n\n\n\n\n本章将介绍如何在在服务器端 ASP.NET Core 的支持下，在客户端使用 Angular 开发一个丰富的单页应用（SPA）。本章将从概述开始，解释不同技术在各个层级之间的相互作用，随后将深入探讨一个通过这种组合解决的真实案例研究。开发工作从\
  \ Visual Studio 的内置模板开始，并提供了将两个项目托管在同一个 ASP.NET Core 项目中的便利性，该项目作为一个单一单元进行构建和发布。\n\
  \n## 结构\n\n本章将涵盖以下主题：\n\n*   单页应用简介\n*   先决条件\n*   使用 Angular 开始使用 SPA\n    *  \
  \ （默认）ASP.NET Core Angular 项目结构\n        *   SPA 模板应用程序的工作原理\n*   开发 Angular CRUD\
  \ 应用程序\n    *   创建 Angular 应用\n        *   入门\n        *   创建模型\n        *   脚手架\
  \ – API 控制器\n        *   使用 EF Core 迁移创建数据库\n        *   添加对 Swagger 文档的支持\n   \
  \     *   数据种子 (Seeding)\n        *   创建 Angular 组件和服务\n        *   书籍列表页\n    \
  \    *   书籍详情页\n        *   书籍编辑页\n        *   书籍删除页\n    *   单元测试\n    *   部署\n\
  \n## 目标\n\n本章的目的是理解如何使用 Visual Studio 2022，结合 `C# 11` 和 `.NET 7.0` 在客户端使用流行的 JavaScript\
  \ 框架 Angular 以及服务端使用 ASP.NET Core Web API 创建单页 Web 应用。\n\n## 单页应用简介\n\n在传统的 Web\
  \ 应用中，浏览器每次响应用户请求都会从服务器重新加载整个页面。然而，在单页应用 (SPA) 中，当前页面会在用户交互时使用来自服务器的新数据进行动态刷新。SPA\
  \ 是使用 HTML、JavaScript、CSS 以及 React、Angular 和 Vue 等框架构建的。SPA 提供了更接近原生应用的流畅、响应性良好的用户体验，因为页面加载快且与服务器的数据交换极少。\n\
  \n与多页应用相比，SPA 既有优点也有缺点。优点包括提高性能、更好的用户体验以及更容易进行 SEO 优化。缺点包括开发复杂性增加以及调试困难。\n\n在上一章中，我们涵盖了\
  \ Blazor 应用。与 SPA 不同，Blazor 是一种基于组件的单页应用框架，用于使用 `.NET` 构建客户端 Web 应用。它在客户端使用 WebAssembly\
  \ 版 Blazor，在服务端使用服务端 Blazor 进行渲染。它还允许开发者用 `C#` 而不是 JavaScript 写代码，这使得开发复杂的 Web 应用变得更容易。\n\
  \n## 先决条件\n\n完成本章中的示例需要 Visual Studio 2022 社区版（最好已安装最新更新）以及 ASP.NET 和 Web 开发工作负载。要处理\
  \ Angular 应用中的依赖项，需要 `Node JS`。这可以通过从 `https://nodejs.org/en/download/` 安装 `Node\
  \ JS` 或在 Visual Studio 中安装 Node.js 开发工作负载来实现。\n\n## 使用 Angular 开始使用 SPA\n\n在 Visual\
  \ Studio 2022 中按照以下步骤创建新的 ASP.NET Core 与 Angular 项目：\n\n| 创建新项目 (`文件 \\| 新 \\| 项目…`）\
  \ |\n| :--- |\n| **A. 创建新项目** |\n| 1. 创建新项目 |\n| 2. 通过选择语言：`C#`、平台：`所有平台`、项目类型：`Web`\
  \ 来缩小显示的模板列表 |\n| 3. 选择模板：`ASP.NET Core 与 Angular` |\n| 4. 点击 `下一步` |\n| **B. 配置你的新项目**\
  \ |\n| 4. 项目名称：输入你喜欢的名称，例如 `FirstAngularApp` |\n| 5. 位置：选择所需的位置 |\n| 6. 解决方案：选择\
  \ `添加到解决方案` 或 `创建新解决方案` |\n| 7. 解决方案名称：如果创建了新解决方案，请提供名称 |\n| 8. 将解决方案和项目放在同一目录中：通常我们将解决方案放在高上一层，因此如果创建了新解决方案，请不要选中此项\
  \ |\n| 9. 点击 `下一步` |\n| **C. 附加信息** |\n| 10. 框架：`.NET 7.0` (标准终端支持) |\n| 11. 身份验证类型：`无\
  \ (None)` |\n| 12. 配置 HTTPS：勾选 |\n| 13. 不使用顶层语句：取消勾选 |\n| 14. 点击 `创建` |\n\n表 6.1：创建新的\
  \ ASP.NET Core 与 Angular 项目的步骤\n\n这将创建一个前端使用 Angular、后端使用 ASP.NET Core 的新 SPA。可以使用\
  \ `dotnet` 命令行界面 (CLI) 通过以下命令创建新项目：\n\n```bash\ndotnet new angular --name FirstAngularApp\n\
  ```\n\n将新创建的项目添加到解决方案：\n\n```bash\ndotnet sln add ./FirstAngularApp/FirstAngularApp.csproj\n\
  ```\n\n## （默认）ASP.NET Core Angular 项目结构\n\n使用内置的 ASP.NET Core 与 Angular 模板创建新应用时，会创建一个\
  \ `WeatherForecast` 应用，这次将 ASP.NET Core Web API 项目和 Angular CLI 项目合并到单个 `.csproj`\
  \ 文件中，并具有通过共同项目托管两者的便利性——一起构建并发布。在检查此项目的工作原理之前，让我们检查文件夹和文件：\n\n| 项目 | 描述 |\n| :---\
  \ | :--- |\n| 依赖项 \\| 框架 | 默认情况下对 `Microsoft.AspNetCore.App` 和 `.NETCore.App` 有依赖。\
  \ |\n| 依赖项 \\| 程序包 | 对 NuGet 包 `Microsoft.AspNetCore.SpaProxy` 有依赖。 |\n| Properties/\
  \ | 与 Web 项目一样，在此文件夹中有控制 Web 应用启动的 `launchSettings.json`。 |\n| wwwroot/ | 包含在页面标题旁的\
