- "# C# 11 和 .Net 7 端到端应用构建指南：构建 Web、桌面端和移动应用的完整指南\n\n\n\n![](img/cover.jpg)\n\n![封面](img/cover.jpg)\n\
  \n\n\n\n\n\n**献给**\n\n以此怀念我的父亲，你的奉献、不疲倦的工作精神和简单的生活方式每天都在激励着我。你的生活是决心与激情的典范，设定了一个我努力追求的标准。像任何尽职的父母一样，你没有别的愿望就是看到孩子出类，你为实现这个梦想付出了巨大的努力。尽管你已不在我们身边，但你的爱与抱负已将延续于我所做的一切中。\n\
  \n# 前言\n\n十多年来，C# 一直是我真正的热情所在，塑造了我的职业道路。我沉浸在 .NET 开发者社区，在全球范围内分享以 C# 为中心的应用开发策略的见解。从活跃的\
  \ GitHub 贡献到与顶尖工程师合作，我一直推动功能的采用和创新。作为一名负责二十个团队设计决策的解决方案架构师，我的经验在短短 30 天内就实现了惊人的\
  \ 20 倍速度提升。我很荣幸获得过 Google 开发者专家（Google Developer Expert）、两次微软价值专业人士（MVP）、Twilio\
  \ 冠军以及 O’Reilly Media 出版的《学习 Blazor：使用 WebAssembly 和 C# 构建单页应用》作者等头衔。共同主持“On .NET\
  \ Live”也是一段不可思议的旅程，我非常感谢这些丰富的经历，它们庆祝了 .NET 社区中优秀人士的多样化思想。\n\nC# 应用开发涵盖了广泛的可能性，与每位开发者都产生独特的共鸣。这门语言像一把多功能的画笔，使你能够在不断演变的现代软件开发领域中创作，并与同好爱好者共同协作。你将带来什么样的杰作？它将闪耀得多么绚丽？它将增强谁的世界？在本书的篇页中，你将深入\
  \ C# 开发领域，探索它的现实世界应用以及它所能讲述的迷人故事。我坚信，C# 开发者有能力创造真正精美且有意义的数字体验。\n\n多年来，C# 随着 .NET\
  \ 的每次迭代而不断演进。作为开发者，我们面临着一项关键任务：识别将哪些功能整合到我们的项目中，而且关重要的是，我们为什么要这样做。这种决策过程需要对涉及的权衡有深入理解——某个功能是增强了可读性、提升了性能，还是简化了复杂性。值得注意的是，并非所有功能都能满足所有这些标准，这是完全可以接受的。然而，掌握可用功能的系列仍然具有无价价值。\n\
  \n某些功能具有深远影响我们编写代码方式的力量。从库、服务到框架和核心功能，它们可能会引发重大变化。这强调了培养以可靠代码库为基础的稳健开发环境的重要性。我们对尖端工具的依赖（包括世界级的集成开发环境，并在\
  \ AI 驱动的语句补全和语言服务器的增强下变得丰富）推动了我们的生产力，并确保我们走在创新的前沿。在书中，你将探索这些不断进的功能，理解它们的意义，并应对 C#\
  \ 开发的动态格局。\n\n在书中，你将探索满足不同客户需求的大量应用开发场景。我们从彻底涵盖 C# 11 的功能开始，进入使用 ASP.NET Core Web\
  \ 应用程序和 Web APIs 的 Web 应用开发。旅程继续到 gRPC 服务、Blazor WebAssembly 的创新，以及对 TypeScript\
  \ 和 Angular 的 SPA 开发的致敬。我们还深入了使用 WPF、WinUI 3 和 .NET MAUI 的桌面应用程序。正当我们认为已经涵盖了所有内容时，我们向你介绍了用于机器学习应用开发的\
  \ ML.NET。本书是一部全面的资源，帮助你确定哪些功能符合你的目标。我坚信你会在阅读中发现巨大的价值，我想向 Arun 感谢，他创作了这本卓越的书。\n\n\
  - David Pine\n（微软，高级内容开发人员）\n\n# 关于作者\n\nArun Gupta 在软件开发领域拥有二十五多年的宝贵经验。他曾在服务和产品开发行业的中大型组织中（如以前的\
  \ CMC Limited、Patni Computers 和 Kronos Solutions）担任多种角色。如今，除了技术咨询外，他还喜欢通过指导和帮助个人成为更好的程序员和测试人员来分享他的专业知识。\n\
  \n# 关于审稿人\n\nMarco Siccardi 是一位拥有 10 多年经验的 .NET 开发者，目前在一家大型瑞士交通公司，主要负责 iOS 上的 Xamarin\
  \ 和 .NET MAUI。他过去还从事过服务器、桌面、Web 和云技术，完善了他的专业知识。\n\n他的侧边项目范围广泛，从移动应用到基于云的应用程序和开源库，利用了\
  \ .NET 世界提供的一切（包括 Azure、ASP.NET、MS SQL）。在所有项目中，Marco 都在尝试使用 MVVM、存储库模式等既有模式来实现整洁的架构。\n\
  \n最近，他开始探索 Swift 编程语言，以扩展他对 Apple 生态系统的原生知识。\n\n除此之外，他还通过个人博客分享知识，是一个活跃的跑步者，并喜欢用\
  \ iPhone 拍照。他是两个成年人的父亲，也是一位耐心体谅妻子的丈夫。\n\n# 致谢\n\n我想对几位个人表示深表谢意，他们不懈的支持和对本书的诞生起了至关重要的作用。\n\
  \n向我的妻子 Deepika 和我的儿子 Dhruv 和 Anmol 表以诚挚的感谢，你们的耐心、爱以及对我努力的坚定信念是我的指明灯。即使在错过了多次家庭活动和无数次的“拒绝”中，你们的理解和鼓励也让我的精神高昂、坚定不可摇。\n\
  \n感谢我的家人、朋友和同事，你们的鼓励和祝愿提供了推动我走向终点的无形力量。你们对我的信任是不断的灵感源泉。\n\n特别感谢 Marco 严谨的技术评审和宝贵意见，这些意见改进了内容的技术层面。\n\
  \n特别是对于 ML.NET 章节，我想向我的前同事 Ajay Sharma 表达诚心的谢意，他是该领域的卓越权威。Ajay 曾慷慨地多次引导我走向正确的方向，对此我胜感激。\n\
  \n\n\n\n我也非常感谢 BPB 敬业的工作人员的专业精神，以及他们让行业内人士无缝转型为首次作者的流程框架。\n\n对于每一位你们，你们的共同贡献对于这本书的实现至关重要，对此此，我深表感谢。\n\
  \n# 前言\n\n欢迎来到 C# 编程的世界。这是一段沉浸式的学习之旅，知识在实践中获得。这本书并不是一本传统的手册；而是一系列诞生于计算机实验室体验精华的笔记集。当你深入阅读这些章节时，你将开启一段基调类似于技术博客的学习旅程，我们将一步步营地解决现实世界的问题，并在此过程中揭示\
  \ `C# 11` 和 `.NET 7` 的复杂之处。\n\n这种方法是独特的。我们没有深挖单一主题，而是采取全景视角，探索构建端到端应用所需的各个方面。将其想象为在深入研究之前，先围绕主题进行横向的探索并欣赏其细微差别。这种方法并没有否定深度的价值，但它通过从具体到抽象（而不是反之）的路径奠定了坚实的基础。\n\
  \n本书并非入门读物，它假设你已经对 `C#` 和 `Visual Studio` 有了基本的了解。然而，它为那些希望向新语言特性、应用类型以及 `Visual\
  \ Studio` IDE 内工作模式进的人提供了阶梯。\n\n散布在互联网和微软网站上的海量信息可能会让人目不应接。本书就像一盏灯塔，在解决特定问题的背景下，将来自多个来源的信息合成为一连贯的图景。它将这些丰富的知识以摘要的形式呈现，引导你通过可靠的资源进行进一步的探索。\n\
  \n书中的每一章都通过 `Visual Studio` 中的项目模板连接在一起。我们利用这些模板构建各种应用程序，循序渐进。在这些页面中，我们通过创建围绕有趣主题（如数字书店、牛头对口游戏（Cows\
  \ and Bulls）、数独、图像导航器等）的引人入胜的项目来强化核心概念。我们从宏观视角开始，然后进入思考解决问题的逐步历程。一旦你掌握了这些页面中详细说明的项目，你将能够将相同的原理应用于你自己的项目中。其目标是俗语所说的“授人以钓鱼”——带你入门，并将你提升到一个可以自己找到答案的水平。\n\
  \n在当今世界，书籍只是我们获取信息和建立知识的众多资源之一。我赞扬你在这个领域追求卓越的决心，并恳求你不要让最初的热情消失。我鼓励你充分投入文本学习，勤奋地完成所有示例，思考练习题并探索参考文献。这样，到结束时，你不仅对这些技术有更深入的理解，还会产生进一步钻研该主题的新奇好奇心。\n\
  \n所以，亲爱的读者，当你开启这段教育旅程时，请记住，这本书是你开启 `C#` 编程世界的大钥匙。带着好奇心对待它，拥抱“在做中学习”的哲学，让它引导你一步步精通\
  \ `C#`、`.NET` 和 `Visual Studio`。我邀请你在这个兴奋的领域进行探索、实验并脱颖而出，愿这本书成为你通往成功之路上的可靠伙伴。\n\n\
  \n`.NET` 版本 6 于 2021 年 11 月发布，随后的 `C# 10` 以来，`.NET` 平台和 `C#` 语言都取得了若干进展。本章描述了进入\
  \ `C#` 语言的新特性。还包含了演示新特性工作原理和使用的代码段。\n\n概述了可以在 `.NET 7` 中创建的不同类型的 Web 应用程序，然后通过创建一个端到端的数字书店\
  \ Razor Pages Web 应用程序示例进行后续解释。演示了书籍详情页的单元测试，并为书籍索引页编写了基于 Selenium 的功能测试。\n\n侧重于使用\
  \ `ASP.NET Core` 开发 Web API。它解释了围绕 API 开发的各种概念，并围绕数字书店创建一个简单的增删改查（CRUD）Web API。\n\
  \n引入了 `ASP.NET Core gRPC` 服务作为 `WCF` 服务的逻辑扩展，并将其与其他构建服务的其他选项进行比较。通过创建一个 `gRPC` 服务（该服务将服务器流通过服务方法调用在客户端下载大文件），来阐述\
  \ `gRPC` 服务相关的概念。为员工数据服务编写了基于 `MSTest` 的单元测试。\n\n介绍了不同的 `Blazor` 应用程序，描述了它们相关的概念，并使用\
  \ Blazor WebAssembly App 项目模板创建“牛头对口游戏”的模拟，以突出开发过程的复杂性。使用社区驱动的项目 `bUnit` 演示了针对 Razor\
  \ 组件的单元测试。对于端到端测试场景，描述了 `Playwright .NET` 的使用。\n\n在客户端使用 Angular 开发一个丰富的单页应用（SPA），并在服务器端由\
  \ `ASP.NET core` 提供支持。本章解释了不同层级中不同技术之间的相互作用，然后从项目模板开始创建数字书店应用程序的 Angular 版本。\n\n\
  我们从 Windows Presentation Foundation (`WPF`) 开始探索微软的桌面应用程序。我们将理解可以创建的不同类型的桌面应用程序，以及\
  \ `WPF` 在整体策略中的地位。为了理解控件和布局，我们将创建一个简单的披萨订单表，然后围绕流行的数独游戏构建一个真实世界的 WPF 应用程序。在这里，为了进一步强化构建\
  \ WPF 应用的概念，我们将使用用户控件设计 UI，实现模型-视图-模型 (`MVVM`) 模式，使用资源字典，并最终发布应用程序。通过为 ViewModel\
  \ 添加基于 `MSTest` 的测试，演示 MVVM 应用的单元测试。\n\n首先描述为 Windows 平台创建应用程序的演变，然后详细介绍使用 Windows\
  \ UI Library (`WinUI 3`) 为 Windows 10 和 Windows 11 开发原生 Windows 应用。为了理解构建真实 WinUI\
  \ 应用的概念，我们将创建一个图像导航应用程序。\n\n描述了使用 `.NET` 进行移动应用程序开发的演进格局，随后概述了使用 `.NET MAUI` 模板开发跨平台应用。我们将检查\
  \ `.NET MAUI` App 模板与 `.NET MAUI` Blazor Hybrid App 模板之间的差异。之后我们将使用 `WPF` 数独应用程序迁移到\
  \ `.NET MAUI` 应用程序，以进一步阐述围绕 `.NET MAUI` 的概念。\n\n\n\n\n# 免责声明\n\n（Mac 系统上运行示例）\n\
