  \ Property=\"FontSize\" Value=\"12\" />\n        <Setter Property=\"FontWeight\"\
  \ Value=\"Normal\" />\n    </Style>\n</ResourceDictionary>\n```\n\n`DigitStyle`\
  \ 和 `PencilStyle` 在上述代码中作为资源字典合并，可以一起应用。在 `App.xaml` 中包含它们：\n\n```xml\n<Resources>\n\
