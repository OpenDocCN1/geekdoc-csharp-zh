  \                <td>@Html.DisplayFor(modelItem => item.Authors)</td>\n        \
  \    </tr>\n        }\n</table>\n```\nRazor 视图以表格形式通过模型类 `IndexModel` 的 `Books`\
  \ 属性显示书籍列表。我们需要在 `Program.cs` 中 `var app = builder.Build();` 行之上注入 `BookService`：\n\
  \nbuilder.Services.AddHttpClient<BookService>(service =>\n{\n});\n```\n以及 `appsettings.json`\
  \ 中的配置设置。这应该设置为你机器上 `DigitalBookStoreAPI` 的 URL。\n\n\"backendUrl\": \"https://localhost:7205\"\
  ,\n```\n现在我们已经完成了所有更改以查看运行效果，我们需要同时运行 API 项目和客户端项目。右键点击解决方案并选择 `Set Startup projects…`（设置启动项目...），并所示选择多个启动项目：\n\
  \n\n图 3.21：在 Visual Studio 中设置多个启动项目\n现在开始执行将启动两个项目。在客户端应用程序中导航到 `/Books` 端点显示如下：\n\
  \n\n图 3.22：调用 DigitalBookStoreAPI 的 API Client。\n## 单元测试\n\nWeb API 的单元测试策略与 Web\
  \ App 类似。我们通常测试 `Controllers` 中不同的操作方法。但在在此之前，像 Web App 一样，为数据库调用引入一个抽象层是很有用的，而不是直接使用\
  \ `EF Core DBContext`。根据应用程序的复杂度，该抽象层可以是带有或不带业务逻辑服务的 `Repository` 层。一旦添加了此类层，我们就可以模拟（mock）从\
  \ `Controllers` 操作方法中生成的数据库调用，并仅对输入和生成的响应进行测试。\n\n请参考上一章节，了解有关引入 `Repository` 层、在单元测试中对其进行模拟以及测试操作方法的细节。\n\
  \n## 部署\n\n我们开发的 `DigitalBookStoreAPI` web API 可以部署到如 Microsoft Azure 等云端环境。请参考参考文献中给出的教程，使用\
  \ Visual Studio 将 ASP.NET Core web API 发布到 Azure API Management。\n\n### 总结\n\n在本章中，我们概述了使用\
  \ ASP.NET Core 开发 Web API。\n\n下一章将重点介绍 API 的类型。\n\n\n\n\n\n## gRPC 的特性\n* gRPC 与其他服务模型的对比\n\
  * gRPC 的优势\n* gRPC 的缺点\n* gRPC 的用场景\n\n## 前提条件\n\n## 开始使用 ASP.NET Core gRPC 服务\n\
  * （默认）gRPC 服务项目的结构\n* 消费 gRPC Greeter 服务\n* 使用 Postman 测试 Greeter 服务\n* 通过 JSON\
  \ 转码启用浏览器访问\n* 启用 Swagger 文档\n\n## 开发 gRPC 服务\n### 创建 gRPC 服务和客户端\n    * 开始上手\n\
  \    * 创建 proto 文件\n    * 包含示例数据集\n    * 安装并配置 `CsvHelper` NuGet 包\n    * 创建 `EmployeesDataService`\n\
  \    * 创建 `GrpcDownloadClient`\n* 单元测试\n* 部署\n\n## 目标\n本章的目标是理解 ASP.NET Core gRPC\
  \ 服务栈与构建服务的其他选项相比的如何。随着学习的进行，我们将建立对 gRPC 服务相关重要概念的理解，并学习如何在 Visual Studio 2022 中使用\
  \ `C#` 11 和 `.NET` 7.0 开发它们。\n\n## gRPC 概述\n在处理 gRPC 之前，让我们先了解这项技术是什么以及它是如何工作的。gRPC\
  \ 起初由 Google 创建，但后来开源了。从 2017 年开始，它由云原生基金会（`CNCF`）作为一个孵化项目进行维护。这意味着该项目拥有健康的贡献者数量，并被应用于生产环境中。如果你在猜测，`gRPC`\
  \ 中的 `g` 并不代表 Google，它是一个递归缩写，类似于 `GNU`（GNU's Not Unix）、`cURL`（URL Request Library）等许多其他缩写。因此，缩写\
  \ gRPC 代表 `gRPC Remote Procedure Calls`。\n\n## 什么是 gRPC？\ngRPC 是一个开源、可扩展、高性能的框架，用于构建远程过程调用（RPC）API。它依赖\
  \ `HTTP/2` 并使用 `Protocol Buffers`（`protobuf`）作为接口定义语言（IDL），以 `.proto` 文件的形式存储数据和服务合约。它支持多种编程语言，包括\
  \ `C#`、`C++`、`Dart`、`Go`、`Java`、`JavaScript`、`Objective-C`、`PHP`、`Python` 和 `Ruby`。gRPC\
  \ 设计旨在高效且轻量级，并同时支持单元（一个请求，一个响应）和流式（多个请求和响应）通信模式。它可以用于广泛的应用，包括微服务、云原生应用和 IoT 设备。一些使用\
  \ gRPC 的流行应用包括 `Kubernetes`、`Netflix`、`Square`、`CockroachDB`、`OpenAI`、`Spotify`\
  \ 和 `Dropbox` 等。\n\n## gRPC 如何工作？\n在 gRPC 中，客户端和服务器之间的通信流遵循 RPC 模式。总体流程如图 4.1 所示。\n\
  \n![](img/Figure_4.1.png)\n\n图 4.1：gRPC 中的通信流\n\n与 RPC 系统一样定义了可以远程调用的方法。gRPC 服务器实现接口并监听客户端请求。在客户端侧，存根（stub）提供了与服务器上可用的方法。当客户端侧接收到用户请求时，会在后台对服务进行远程进程外调用。在服务器端生成的响应将传回客户端。开发者在自己的原生平台上编写代码，而\
  \ gRPC 通过处理计算机之间的通信、序列化和执行来完成底层管道工作。\n\ngRPC 服务和消息定义在协议缓冲区 `.proto` 文件中。协议缓冲区为结构化数据的序列化提供了一种语言和平台无关、可扩展的机制。protobuf\
  \ 编译器 `protoc` 在构建时生成特定语言的客户端和服务代码。这些生成的代码包括将消息加载到内存以及序列化/反序列化二进制消息。\n\n![](img/Figure_4.2.png)\n\
  \n图 4.2：协议缓冲区的工作\n\n协议缓冲区假设整个消息可以一次加载到内存中。如果数据超过几兆且对速度至关重要（例如使用大型多维浮点数数组的科学工程应用），则应该考虑不同的解决方案。\n\
  \n## gRPC 的特性\ngRPC 服务的一些关键特性如下：\n\n* 接口定义语言 (IDL)：gRPC 使用 IDL 在 `.proto` 文件中描述服务以及可调用的消息。该文件用于在多种支持的语言中生成客户端和服务器代码。\n\
  * 协议缓冲区：gRPC 使用 `Protocol Buffers`（或 `protobuf`）作为请求和响应消息的数据序列化格式。它是轻量级的并支持复杂的数据结构。最新版本是\
  \ `proto3`。\n* gRPC 协议：gRPC 使用 gRPC 协议，该协议基于 `HTTP/2` 标准，与 `HTTP/1.1` 相比带来了许多高级功能。该协议提供了请求/响应多路复用、流量控制、双向流和头部压缩等。这允许客户端和服务器之间进行高效通信，减少了网络开销和延迟。\n\
  * 传输层安全 (TLS)：gRPC 支持 `TLS`，用于客户端和服务器之间的安全通信。它为通过网络发送的数据提供了加密，并验证了客户端和服务器的身份。\n\
  * 双向流：gRPC 支持双向流，允许客户端和服务器之间进行实时、低延迟的通信。这对于通信是双向且客户端和服务可以同时发送接收消息的情况有用，例如聊天服务器。\n\
  * 跨语言兼容性：gRPC 支持多种编程语言，使得在不同语言之间编写和维护代码变得简单。\n\n## gRPC 与其他服务模型的对比\ngRPC 与其他基于服务的技术有什么区别？表\
  \ 4.1 比较了 gRPC 与 Web API 和 WCF。微软建议将 Windows Communication Foundation (`WCF`) 项目迁移到\
  \ gRPC，因为 .NET Core 不提供 WCF：\n\n| | gRPC | Web API | WCF |\n| :--- | :--- | :---\
  \ | :--- |\n| 协议 | gRPC 使用 gRPC 协议，该协议基于 `HTTP/2` 标准，并提供了流量控制、双向流和头部压缩等功能 | Web\
  \ API 另一方面使用 `HTTP` 协议并基于 REST 架构模式，使用标准的 HTTP 方法如 `GET`、`POST`、`PUT` 和 `DELETE`\
  \ | WCF 另一方面使用多种传输协议，如 `HTTP`、`TCP` 和 `MSMQ`，取决于配置。 |\n| 数据序列化 | gRPC 使用 `Protocol\
  \ Buffers` 进行数据序列化，高效且轻量。 | Web API 使用多种数据序列化格式，如 `JSON` 和 `XML`，取决于配置和客户端请求。 |\
  \ WCF 使用 `XML` 格式进行数据序列化，可能更加冗长且效率较低。 |\n| 语言支持 | gRPC 支持多种编程语言，包括 `C#`、`C++`、`Java`、`Python`\
  \ 和 `Go`。 | Web API 可以与多种编程语言和框架，如 `.NET` 和 `Java`。 | WCF 主要为 `.NET Framework` 设计，并主要与\
  \ `C#` 和 `VB.NET` 配合使用。 |\n\n\n\n\n\n| 特性 | gRPC | Web API | WCF |\n| :--- | :---\
  \ | :--- | :--- |\n| 流式 | gRPC 支持单元调用（一个请求，一个响应）和流式（多个请求和响应）通信模式。 | Web API 支持请求-响应和单向消息模式，但它没有对流式的内置支持。\
  \ | WCF 支持请求-响应和单向消息模式，但它没有对流式的内置支持。 |\n| 平台支持 | gRPC 是跨平台的，可以在 Windows、Linux 和\
  \ macOS 上运行。 | Web API 可以在任何支持其构建的语言和框架的平台上运行，例如 .NET 和 Java。它可以托管在多种 Web 服务器上，包括\
  \ Internet 信息服务 (IIS) 和 Apache。 | WCF 主要为 .NET Framework 设计，可以托管在多种平台上，包括 IIS 和\
  \ Windows 进程激活服务 (WAS)，但它不是跨平台的，且在 Windows 上使用。 |\n\n**表 4.1：gRPC 与 Web API 及 WCF\
  \ 的对比**\n\n## gRPC 的优势\n\ngRPC 提供了列出的若干优势：\n\n* **性能**：由于使用了 `protobuf` 和 `HTTP/2`，gRPC\
  \ 与 REST+JSON 通信相比提供了更好的性能。`protobuf` 在服务器和客户端均序列化消息，导致紧凑的消息负载。`HTTP/2` 通过多路复用、服务器推送和头部压缩扩展了性能。\n\
  * **流式传输**：gRPC 使客户端和服务端的实现都变得简单。如图 4.3 所示，gRPC 服务通过 `HTTP/2` 支持不同的流式组合：\n\n![](img/Figure_4.3.png)\n\
  \n**图 4.3：gRPC 支持的流式场景**\n\n* **代码生成**：gRPC 框架使用 `protoc` 编译器从 `.proto` 文件生成原生代码。这产生了服务器端骨架和客户端存根，节省了具有多种服务的应用程序的开发时间。\n\
  * **互操作性**：gRPC 工具和库设计用于多个平台和编程语言，包括 Java、JavaScript、Ruby、Python、Go、Dart、Objective-C、C#\
  \ 等。\n* **安全性**：在 gRPC 中通过 TLS 端到端加密连接使用 `HTTP/2` 确保了 API 安全。\n\n## gRPC 的劣势\n\n\
  gRPC 确实存在以下劣势：\n\n* **浏览器支持有限**：无法从 Web 浏览器直接调用 gRPC 服务，因为 gRPC 通信使用二进制序列化并基于 `HTTP/2`，目前的浏览器没有提供足够的\
  \ API 通过 JavaScript 控制 `HTTP2` 帧。需要一个带有 `gRPC-web` 的代理层在 `HTTP/1.1` 和 `HTTP/2` 之间进行转换。另一个选项是使用\
  \ `gRPC JSON 转码`，它允许浏览器应用像调用 JSON  RESTful API 一样调用 gRPC 服务。\n* **非人类可读格式**：`protobuf`\
  \ 将 gRPC 消息压缩为二进制格式。因此，为了调试，需要额外的工具来分析 `protobuf` 消息并编写手动请求。\n\n## gRPC 用例\n\n基于\
  \ gRPC 的通信有用的某些用例如下：\n\n* 当微服务之间需要同步通信时，基于 gRPC 的通信非常适用。图 4.4 给出了使用 gRPC 进行微服务间内部通信的典型架构。\n\
  \n![](img/Figure_4.4.png)\n\n**图 4.4：使用 gRPC 进行微服务间的内部通信 [2]**\n\n***\n\n[2] 来源：[`learn.microsoft.com/en-us/dotnet/architecture/cloud-native/grpc#grpc-implementation`](https://learn.microsoft.com/en-us/dotnet/architecture/cloud-native/grpc#grpc-implementation)\n\
  \n* 由于 gRPC 支持不同的编程平台，因此在多种语言并存的异构环境中非常有用。\n* gRPC 在对性能至关重要的低延迟和高吞吐量通信场景下表现出色。\n\
  * 它支持需要点对点实时通信的用例，包括双向流式。\n* 由于 gRPC 基于二进制消息工作，因此在带宽受限的环境中非常有用。\n\n## 前提条件\n\n需要\
  \ Visual Studio 2022 社区版或更高版本（最好带有最新更新）来完成本章中的示例。此外，还需要 ASP.NET 和 Web 开发工作负载来处理\
  \ gRPC 服务。Postman API 测试工具用于测试 gRPC 服务，可以从 [`www.postman.com/downloads/`](https://www.postman.com/downloads/)\
  \ 下载并在免费注册后使用。\n\n## 开始使用 ASP.NET Core gRPC 服务\n\n按照下表 4.2 所示，在 Visual Studio 2022\
  \ 中执行步骤创建一个新的 ASP.NET Core gRPC 服务项目：\n\n| 创建新项目 (文件 | 新建 | 项目...) |\n| :--- | :---\
  \ |\n| **A. 创建新项目** |\n| 1. 通过选择缩小显示的模板列表：语言：`C#`，平台：所有平台，项目类型：Service<br>2. 选择模板：`ASP.NET\
  \ Core gRPC Service`<br>3. 点击下一步 |\n| **B. 配置你的新项目** |\n| 4. 项目名称：输入选择的名称，例如 `FirstService`<br>5.\
  \ 位置：选择位置<br>6. 解决方案：添加到现有的或创建新的 |\n| **C. 附加详细信息** |\n| 7. 框架：`.NET 7.0`（标准支持）<br>8.\
  \ Docker：如果勾选了上方选项则适用。<br>9. 不使用顶层语句<br>10. 点击下一步。 |\n\n**表 4.2：创建新项目的步骤**\n\n这将创建一个新项目。可以使用命令行界面\
  \ (CLI) 使用以下命令创建新项目：\n\n```\ndotnet new grpc --name FirstService\n```\n\n使用以下命令将新项目添加到解决方案：\n\
  \n```\ndotnet sln add ./FirstService/FirstService.csproj\n```\n\n## (默认) gRPC 服务项目的结构\n\
  \n使用内置 gRPC 模板创建新应用程序时，会创建一个示例 Greeter 服务。以下文件和文件夹的作用类似于任何 ASP.NET Core Web 应用或\
  \ Web API：\n\n* 连接的服务\n* 依赖 | 分析器\n* 依赖 | 框架\n* 依赖 | 包\n* 属性 | `launchSettings.json`\n\
  * `appsettings.json`\n* 项目文件 - `*.csproj`\n* 解决方案文件 - .sln 和 .su 文件\n\n默认情况下，除了对\
  \ `Grpc.AspNetCore` 包有依赖外，让我们查看 ASP.NET Core gRPC 应用程序特有的更改。\n\n\n\n\n\n```csharp\n\
  using Grpc.Core;\n\nnamespace FirstGrpcService.Services;\n\npublic class GreeterService\
  \ : Greeter.GreeterBase\n{\n    private readonly ILogger<GreeterService> _logger;\n\
  \    public GreeterService(ILogger<GreeterService> logger)\n    {\n        _logger\
  \ = logger;\n    }\n\n    public override Task<HelloReply> SayHello(HelloRequest\
  \ request, ServerCallContext context)\n    {\n        return Task.FromResult(new\
  \ HelloReply\n        {\n            Message = \"Hello \" + request.Name\n     \
  \   });\n    }\n}\n```\n\nprotobuf 编译器（针对 C#）会根据每个 `.proto` 文件生成一个 `.cs` 文件，并为文件中描述的每个消息类型生成类。生成的类在前面的\
  \ `GreeterService` 中被引用。在第 4 行，`GreeterService` 继承自定义在 `GreetGrpc.cs` 中的 `Greeter.GreeterBase`，而\
  \ `HelloRequest` 和 `HelloReply` 则定义在 `Greet.cs` 中。\n\n### Program.cs\n\n```csharp\n\
  using FirstGrpcService.Services;\n\nvar builder = WebApplication.CreateBuilder(args);\n\
  \n// 在 macOS 上成功运行 gRPC 需要额外的配置。\n// 有关如何在 macOS 上配置 Kestrel 和 gRPC 客户端说明，请访问 https://go.microsoft.com/fwlink/?linkid=2099682\n\
  \n// 将服务添加到容器中。\nbuilder.Services.AddGrpc();\n\nvar app = builder.Build();\n\n//\
  \ 配置 HTTP 请求管道。\napp.MapGrpcService<GreeterService>();\napp.MapGet(\"/\", () =>\
  \ \"Communication with gRPC endpoints must be made through a gRPC client. To learn\
  \ how to create a client, visit: https://go.microsoft.com/fwlink/?linkid=2086909\"\
  );\n\napp.Run();\n```\n\nHTTP 请求管道在应用程序启动期间的第 9 行和第 14 行进行初始化和配置。\n\n在 `FirstGrpcService.csproj`\
  \ 文件中创建了一个 protobuf `ItemGroup` 条目，如下：\n\n```xml\n<ItemGroup>\n  <Protobuf Include=\"\
  Protos\\greet.proto\" GrpcServices=\"Server\" />\n</ItemGroup>\n```\n\n`GrpcServices`\
  \ 属性控制编译期间生成的资源。\n\n### 消费 gRPC Greeter 服务\n\n到目前为止，我们已经创建了一个服务，现在需要在客户端程序中使用它。让我们先尝试执行该项目。将项目设置为启动项目，然后选择调试\
  \ | 开始调试或按 `F5` 在[图 4.5]中启动 UI。\n\n![](img/Figure_4.5.png)\n\n图 4.5：托管 gRPC 服务的\
  \ Kestrel 服务器\n\n与 Web API 不同（在 Web API 中我们看到了端点的 Swagger UI），在一种情况下，没有启动其他 UI。从之前的\
  \ UI 复制 URL 并尝试在浏览器中进行导航，结果如[图 4.6]所示\n\n![](img/Figure_4.6.png)\n\n图 4.6：无法在浏览器中导航到\
  \ gRPC 端点\n\n正如我们所见，尝试在浏览器中导航到 gRPC 服务 URL 是不起的。我们期望从 `Greeter` 服务收到一个 hello 消息，但实际上看到的是前面的消息。此消息实际上来自我们在\
  \ `Program.cs` 中配置的 HTTP 请求管道。由于是 gRPC 使用基于 `HTTP/2` 的二进制协议进行客户端和服务器之间的通信。该协议的设计初衷并非在浏览器中使用以支持\
  \ gRPC 使用的二进制格式。此外，gRPC 使用的通信方法与 HTTP 使用的请求-响应模型不同，这与浏览器导航 URL 的方式不兼容。因此，我们需要创建一个自定义客户端应用程序来消费我们的\
  \ gRPC `Greeter` 服务。\n\n按照 Visual Studio 2022 中[表 4.3]中的步骤创建一个新的控制台应用程序项目。\n\n|\
  \ 创建新项目（文件 | 新建 | 项目…） | |\n| :--- | :--- |\n| A. 创建一个新项目 | 1. 通过选择以下项来缩小显示的模板列表范围：语言：C#，平台：所有平台，项目类型：控制台<br>2.\
  \ 选择模板：控制台应用<br>3. 点击下一步。 |\n| **B. 配置您的新项目** | 4. 项目名称：输入您选择的名称，例如 `FirstGrpcServiceTestClient`<br>5.\
  \ 位置：选择您想要的位置<br>6. 解决方案：选择“添加到解决方案”或“创建新解决方案”<br>7. 解决方案名称：如果创建了新解决方案，请提供名称<br>8.\
  \ 将解决方案和项目放在同一目录中：通常我们将解决方案放在高一级，因此在创建新解决方案时取消勾选此项。<br>9. 点击下一步 |\n| **C. 附加信息**\
