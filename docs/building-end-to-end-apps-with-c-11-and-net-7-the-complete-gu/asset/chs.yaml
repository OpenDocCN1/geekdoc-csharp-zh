  \ `.NET` Core 应用程序所需的设置，这些包含在 `appsettings.json` 文件中。`http` 和 `https` 配置文件用于调用默认的\
  \ `Kestrel` Web 服务器。还有用于启动 IIS 启动设置。 |\n| `wwwroot/` | 静态站点内容，如 CSS、图像和 JavaScript\
  \ 库包含在此文件夹中。 |\n| `appsettings.json` | 此配置文件用于存储应用程序配置设置，如数据库连接字符串、全局变量等。这可以通过特定环境的设置（如\
  \ `appsettings.Development.json`）覆盖。 |\n| `Program.cs` | 此文件包含应用程序的启动代码。在这里配置请求处理管道，将其作为一系列中间件组件以及应用程序所需的的服务。\
  \ |\n| 解决方案文件 | 解决方案是 Visual Studio 中组织项目的结构。解决方案通过两个文件维护项目的状态信息 - `.sln` 和 `.suo`\
  \ 文件。`.sln` 文件是一个文本文件，包含有关解决方案内项目的信息以及项目持久化数据（如解决方案文件夹）。`.suo` 文件是 `.vs` 文件夹内的一个隐藏二进制文件，包含用户特有的解决方案选项，如启动项目、其窗口状态等。\
  \ |\n\n\n### 从 MVC Web 应用程序开始\n要创建一个 MVC 应用程序，所遵循的步骤与创建 Razor Pages 相同，但这次选择的模板是\
  \ ASP.NET Core Web App (模型-视图-控制器)。要从 `dotnet` CLI 创建应用程序，执行以下命令：\n\ndotnet new\
  \ mvc –name FirstMVC\n```\n执行时的基础应用程序看起来像 Razor Pages 网站。\n\n\n基础 MVC 应用程序的结构看起来也像\
  \ Razor Pages ，除了存在以下文件夹而不是 `Pages` 文件夹：\n| 项目 | 说明 |\n| :--- | :--- |\n| Models\
  \ | 此文件夹包含应用程序中的模型类，这些通常在控制器类中填充并通过视图渲染。在基础应用程序中可以看到 `ErrorViewModel.cs`。 |\n| Views\
  \ | 此文件夹包含与每个控制器方法对应的视图，且位于自己的文件夹中。`shared` 文件夹包含其他视图引用的视图。像 Razor Pages 一样，这些视图使用\
  \ Razor 标记。 |\n表 2.4：MVC 应用中的重要文件夹\n\n\n模型-视图-控制器 (MVC) 模式是一种成熟的 UI 模式，微软从 ASP.NET\
  \ 早期版本就开始支持它。它提供了关注点分离，从而使代码更具维护性。遗憾的是，项目模板中实现的模式通常会导致大量的文件和文件夹，随着应用程序的增长增加了复杂性。\n\
  当只有静态视图或需要执行 POST-重定向-GET 的简单表单时，Razor Pages 非常有用。这些场景是 Razor Pages 的理想选择，避免了 MVC\
  \ 应用的大量约定。从架构上看，Razor Pages 不遵循 MVC 模式，因为它们缺少控制器。相反，Razor Pages 遵循更类似于模型-视图-模型 (MVVM)\
  \ 的模式，结合了强大的架构设计和易用性。\n\n\n\n\n\n| 示例 | `Controllers/StudentController.cs`, `Models/Student.cs`,\
  \ `Views/Student/Index.cshtml` | `Pages/Student/Index.cshtml` `Index.cshtml.cs`\
  \ |\n| 适用 | 适用于具有大量动态服务器视图、REST API 和 AJAX 用的 Web 应用。 | 这种方法适用于以页面为核心的场景，即执行基本数据输入或为只读，且页面模型与标记紧密相关的场景。\
