  \n\n\n\nPCA 是一种无监督学习技术，意味着它不需要标注数据。它会探索数据中固有的结构和模式，而无需任何关于正常或异常实例的先验知识。PCA 假设数据遵循线性分布且异常值稀少。如果这些假设不成立，PCA\
  \ 可能无法有效捕获到异常现象。在应用 PCA 之前，深入探究并理解数据的特性至关重要。\n\n为了评估 PCA 在异常检测中的性能表现, ML.NET 使用了以下两个指标：\n\
  \n- ROC 曲线下面积衡量算法将随机选取的正例排在随机选取的负例之上的概率.该值的范围介于 0 和 1 之间,数值越接近 1 代表模型越好。\n-  给定假正样本数量时的检出率表示指定数量的误报情况下的正确识别异常的比率.该值越接近\
