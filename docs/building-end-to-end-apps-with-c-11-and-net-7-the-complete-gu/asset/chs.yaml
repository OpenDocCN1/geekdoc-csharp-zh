  \                sudokuGrid.Candidates[r, c] = GetCandidates(sudokuGrid.Data, r,\
  \ c);\n    }\n\n    private static List<string> GetCandidates(byte[,] data, int\
  \ row, int col)\n    {\n        var candidates = new List<string>();\n        if\
  \ (data[row, col] == 0) // 仅当单元格未被占用时继续\n        {\n            candidates.AddRange(new\
  \ List<string> { \"1\", \"2\", \"3\", \"4\", \"5\", \"6\", \"7\", \"8\", \"9\" });\n\
  \            // 检查该数字所在的行\n            for (int c = 0; c < 9; c++)\n           \
  \     candidates.Remove(data[row, c].ToString());\n            // 检查该数字所在的列\n  \
  \          for (int r = 0; r < 9; r++)\n                candidates.Remove(data[r,\
  \ col].ToString());\n            // 检查宫格\n            int boxStartRowIndex = (row\
  \ / 3) * 3;\n            int boxStartColIndex = (col / 3) * 3;\n            for\
  \ (int c = 0; c < 3; c++)\n                for (int r = 0; r < 3; r++)\n       \
  \             candidates.Remove(data[boxStartRowIndex + r, boxStartColIndex + c].ToString());\n\
  \        }\n        return candidates;\n    }\n}\n```\n\n在上述代码的 `GetCandidates`\
  \ 方法中，对于特定的单元格（空单元格），我们通过移除可能符合游戏规则的数字来计算候选数字。这是通过检查该单元格的行、列和宫格来实现的。`UpdateAllCandidates`\
  \ 方法通过遍历网格中的所有单元格来更新候选数字。\n\n在 `SudokuViewModel` 中进行高亮处的更改以调用新方法：\n\n```csharp\n\
  private void Initialize(SudokuGrid sudokuBoard = null)\n{\n    SudokuBoard = sudokuBoard\
  \ ?? new SudokuGrid();\n    Boxes = new ObservableCollection<BoxViewModel>();\n\
  \    SudokuBoard.UpdateAllCandidates();\n    InitializeBoxes();\n}\n```\n\n让我们也添加样式来改进单元格中显示的数字和候选数字的外观。为了实现这一点，我们将创建资源字典并在视图中使用它们。在\
  \ `Resources` 文件夹下创建两个包含以下内容的资源字典：\n\n**DigitStyle.xaml**\n```xml\n<ResourceDictionary\
  \ xmlns=\"http://schemas.microsoft.com/winfx/2006/xaml/presentation\"\n    xmlns:x=\"\
  http://schemas.microsoft.com/winfx/2006/xaml\">\n    <Style TargetType=\"TextBlock\"\
  \ x:Key=\"DigitStyle\" >\n        <Setter Property=\"Background\" Value=\"Transparent\"\
  \ />\n        <Setter Property=\"Foreground\" Value=\"Blue\" />\n        <Setter\
  \ Property=\"FontSize\" Value=\"24\" />\n        <Setter Property=\"FontWeight\"\
  \ Value=\"Bold\" />\n        <Setter Property=\"HorizontalAlignment\" Value=\"Center\"\
  \ />\n        <Setter Property=\"VerticalAlignment\" Value=\"Center\" />\n     \
  \   <Setter Property=\"Height\" Value=\"26\" />\n    </Style>\n</ResourceDictionary>\n\
  ```\n\n**PencilStyle.xaml**\n```xml\n<ResourceDictionary xmlns=\"http://schemas.microsoft.com/winfx/2006/xaml/presentation\"\
