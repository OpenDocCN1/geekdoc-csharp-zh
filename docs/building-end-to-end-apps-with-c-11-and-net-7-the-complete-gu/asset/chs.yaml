  ```\n\n\n## 单元测试\n软件应用有很多自动化测试。最简单、最低级别的测试是单元测试。稍高一点的是集成测试，然后是模拟终端用户视角的功能测试。单元测试测试应用程序逻辑的单个部分，而不与文件系统、网络或数据库进行通信。因此，它们预计运行速度极快，并且通常在仓库的每次提交时都会运行。\n\
