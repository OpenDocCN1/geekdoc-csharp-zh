  \n图 7.12：完成的订单表\n\n## 开发真实的 WPF 应用\n\n为了理解构建真实 WPF 应用的相关概念，我们将围绕流行的数独（Sudoku）游戏创建一个简单的应用程序。我们将创建一个传统的\
  \ 9x9 数独网格，用户可以在其中输入数字。除了数字，应用程序还会显示每个单元格中可能的候选数字或铅笔标记（pencil marks）。当任何单元格中输入不符合游戏规则的错误数字时，用户将收到警报。这样，应用程序就可以帮助用户玩数独游戏，而不会提供过多的提示。由于这个原因，我们将此应用程序称为\
  \ Sudoku Buddy。\n\n## 创建 Sudoku Buddy WPF \n\n复习一下，数独游戏（具有 9x9 网格）的主要目标是在每个单元格中填充\
  \ 1 到 9 的数字，使得每个数字在每个单元内都是唯一的。一个单元由一行、一列或一个包含 9 个数字的 3x3 框组成。游戏从一个部分填充的网格开始，用户应该填充剩余的数字。完全完成后，应用程序的\
  \ UI 将如如图 7.13 所示：\n\n![](img/Figure_7.13.png)\n\n图 7.13：Sudoku Buddy 程序的最终 UI\n\
  \n## 入门\n\n使用 `WPF Application` 模板创建一个名为 `SudokuBuddy` 的新项目，选择与 `FirstWPFApp` 相同的所有默认选项。此应用程序的目标是演示真实\
  \ WPF 应用的各种设计选择。因此，我们将利用 `User Controls`（用户控件）来设计 UI，实现模型-视图-视图（MVVM）模式，编写单元测试，使用资源字典（resource\
  \ dictionaries），并发布应用程序。但首先，我们将通过将数独网格拆分为各个 `User Controls` 来获取其 UI。\n\n## 创建数独\
  \ UI\n\n数独游戏有多种变化，但经典版本是 9x9 的数字网格，分为 9 行、9 列和 9 个框；每个框有 9 个。为了简化管理，我们将创建 `User\
  \ Controls`。\n\n### MainWindow.xaml\n\n```xml\n<Window x:Class=\"SudokuBuddy.MainWindow\"\
  \n        xmlns=\"http://schemas.microsoft.com/winfx/2006/xaml/presentation\"\n\
