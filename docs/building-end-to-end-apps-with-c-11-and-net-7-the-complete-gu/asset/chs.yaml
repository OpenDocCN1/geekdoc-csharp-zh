  \n### 使用 Postman 测试 Greeter 服务\n\nPostman 是一个用于设计、开发和测试 API 的流行平台。它从 2022 年 1 月发布的\
  \ 9.7.1 版本开始增加了对测试 gRPC 请求的支持。我们将使用 Postman 测试 Greeter 服务。\n\n\n\n\n\n为了让 Postman\
  \ 测试 API，它必须感知 API 的服务定义，包括关于暴露的服务方法、其请求参数和响应类型的信息。这可以通过两种方式实现：导入 `.proto` 文件或开放服务器反射（server\
  \ reflection）。我们将看到如何为 `Greeter` 服务开放服务器反射。为实现此操作，向项目 `FirstGrpcService` 添加由 gRPC\
  \ 作者提供的 NuGet 包 `Grpc.AspNetCore.Server.Reflection`。在 `Program.cs` 中包含以下高亮代码行：\n\
  \n```\n1. builder.Services.AddGrpc();\n2. builder.Services.AddGrpcReflection();\n\
  4. var app = builder.Build();\n6. app.MapGrpcReflectionService();\n```\n\n运行 `FirstGrpcService`。现在启动\
  \ Postman 并如图 4.11 所示打开新请求对话框，选择 gRPC 请求：\n\n![](img/Figure_4.11.png)\n\n图 4.11：在\
  \ Postman 中创建新请求对话框\n\nPostman 上的 gRPC 界面所示图 4.12 所示：\n\n![](img/Figure_4.12.png)\n\
  \n图 4.12：Postman 中的 gRPC 请求界面 3\n\n***\n\n3 来源：[https://learning.postman.com/docs/sending-requests/grpc/grpc-request-interface/]\n\
  \n输入 `Greeter` 服务的服务器 URL 并点击 TLS 切换按钮。选择方法 `Server Reflection` 并选择显示出的 `SayHello`\
  \ 方法。在 `Message` 选项卡中，点击 `Generate Example Message`，然后点击 `Invoke` 按钮。响应消息的生成情况如图\
  \ 4.13 所示：\n\n![](img/Figure_4.13.png)\n\n图 4.13：在 Postman 中测试 Greeter 服务\n\n##\
  \ 通过 JSON 编码启用浏览器访问](#contents.xhtml_sc3_102a)\n\n基于 HTTP/2 的 gRPC 无法通过 HTTP/1.1\
  \ 使用浏览器访问，但我们可以通过 JSON 编码（JSON transcoding）启用浏览器访问。在这里，我们将为 `Greeter` 服务启用浏览器访问。在项目\
  \ `FirstGrpcService` 中安装 Microsoft 提供的 NuGet 包 `Microsoft.AspNetCore.Grpc.JsonTranscoding`。在\
  \ `Program.cs` 中修改以下行：\n\n```\nbuilder.Services.AddGrpc().AddJsonTranscoding();\n\
  ```\n\n在项目中的 `google/api` 文件夹内包含来自 GitHub 仓库文件夹 `[https://github.com/googleapis/googleapis/tree/master/google/api]`\
  \ 的两个 proto 文件：`annotations.proto` 和 `http.proto`。\n\n使用高亮处的更改修改 `greet.proto`。\n\
  \n```proto\n1. syntax = \"proto3\";\n2. import \"google/api/annotations.proto\"\
  ;\n3. option csharp_namespace = \"FirstGrpcService\";\n5. package greet;\n7. //\
  \ 问候服务定义。\n8. service Greeter {\n9. // 发送问候\n10. rpc SayHello (HelloRequest) returns\
  \ (HelloReply)\n11. {\n12. option (google.api.http) =\n13. {\n14. get: \"/Greeter/{name}\"\
  \n15. };\n17. };\n18. }\n20. // 包含用户名称的请求消息。\n21. message HelloRequest {\n22. string\
  \ name = 1;\n23. }\n25. // 包含问候的响应消息。\n26. message HelloReply {\n27. string message\
  \ = 1;\n28. }\n```\n\n运行 `FirstGrpcService` 项目并导航到 URL，浏览器中显示的响应如图 4.14 所示。\n\n\
  ![](img/Figure_4.14.png)\n\n图 4.14：JSON 编码后在浏览器中导航到 gRPC 端点\n\n## 启用 Swagger 文档](#contents.xhtml_sc3_103a)\n\
  \n要为 `Greeter` API 启用 Open API (Swagger) 文档，添加 Microsoft 的 NuGet 包 `Microsoft.AspNetCore.Grpc.Swagger`，并在\
  \ `Program.cs` 中包含高亮更改以启用 Swagger 中间件：\n\n```\n1. using FirstGrpcService.Services;\n\
  3. var builder = WebApplication.CreateBuilder(args);\n5. // 将服务添加到容器。\n6. builder.Services.AddGrpc().AddJsonTranscoding();\n\
  7. builder.Services.AddGrpcReflection();\n9. builder.Services.AddGrpcSwagger();\n\
  10. builder.Services.AddSwaggerGen();\n12. var app = builder.Build();\n14. if (app.Environment.IsDevelopment())\n\
  15. {\n16. app.UseSwagger();\n17. app.UseSwaggerUI();\n18. }\n20. app.MapGrpcReflectionService();\n\
  22. // 配置 HTTP 请求管道线。\n23. app.MapGrpcService<GreeterService>();\n24. app.MapGet(\"\
  /\", () => \"Communication with gRPC endpoints must be made through gRPC\");\n26.\
  \ app.Run();\n```\n\n`app.MapGrpcService<GreeterService>();`\n\n到本节结束时，`FirstGrpcService`\
  \ 项目已准备好尝试 `Greeter` API。Swagger 界面所示图 4.15。\n\n![](img/Figure_4.15.png)\n\n图 4.15：完成的\
  \ FirstGrpcService\n\n通过这些更改，导航到 Swagger 端点如图 4.16 所示：\n\n![](img/Figure_4.16.png)\n\
  \n图 4.16：启用 Swagger\n\n## 开发 gRPC 服务](#contents.xhtml_sc3_104)\n\n作为开发真实 gRPC 服务的一部分，我们将使用服务器流（server\
  \ streaming）下载记录。创建一个名为 `GrpcDownloadService` 的 Asp.NET Core gRPC 服务，选择之前描述的所有默认选项。将该项目设置为启动项目并删除自动生成的\
  \ `/Protos/greet.proto` 和 `/Services/GreeterService.cs`。从 `Program.cs` 中删除以下行并确保项目编译：\n\
  \n```\napp.MapGrpcService<GreeterService>();\n```\n\n## 创建 proto 文件](#contents.xhtml_sc4_107)\n\
  \n右键点击 `Protos` 文件夹并选择“添加 新项”，创建协议缓冲区文件 `/Protos/employees.proto`，如图 4.18 所示：\n\n\
  ![](img/Figure_4.18.png)\n\n图 4.18：添加新 proto 文件的对话框\n\n在 `employees.proto` 文件中描述\
  \ `EmployeeService`、`EmpRequest` 和 `EmpResponse`：\n\n```proto\n1. syntax = \"proto3\"\
  ;\n2. import \"google/protobuf/timestamp.proto\";\n3. option csharp_namespace =\
  \ \"GrpcDownloadService.Protos\";\n5. service EmployeesService {\n6. rpc GetEmployeesData(EmpRequest)\
  \ returns (stream EmpResponse) {}\n7. }\n9. message EmpRequest{\n10. }\n12. message\
  \ EmpResponse {\n13. int32 EmpID = 1;\n14. string FirstName = 2;\n15. string LastName\
  \ = 3;\n16. float Age = 4;\n17. google.protobuf.Timestamp DateOfJoining = 5;\n18.\
  \ float LastHike = 6;\n19. }\n```\n\n注意第 6 行中 `GetEmployeesData` 方法，`EmpResponse`\
  \ 参数被标记为 `stream`，这意味着该方法将在服务器流模式下。`EmpResponse` 定义了我们计划下载的 CSV 文件中的某些字段。\n\n在 `GrpcDownloadService`\
  \ 项目文件中包含以下内容：\n\n```xml\n<ItemGroup>\n  <Protobuf Include=\"Protos\\employees.proto\"\
  \ GrpcServices=\"Server\" />\n</ItemGroup>\n```\n\n生成项目。这应该会在 `.\\obj\\Debug\\net7.0\\\
  Protos` 文件夹下自动生成 `Employees.cs` 和 `EmployeesGrpc.cs` 文件。\n\n\n\n\n从 [`excelbianalytics.com/wp/wp-content/uploads/2020/09/Hr1m.zip`](https://excelbianalytics.com/wp/wp-content/uploads/2020/09/Hr1m.zip)\
  \ 下载开源的人资源示例数据集文件。解压并将其添加到项目的 `Data` 文件夹下。下载的 CSV 文件包含第一行的表头，随后是行或多行数据行，如表 4.4 所示。\n\
  \n| 表头 | Emp ID,Name Prefix,First Name,Middle Initial,Last Name,Gender,E Mail,Father's\
  \ Name,Mother's Name,Mother's Maiden Name,Date of Birth,Time of Birth,Age in Yrs.,Weight\
  \ in Kgs.,Date of Joining,Quarter of Joining,Half of Joining,Year of Joining,Month\
  \ of Joining,Month Name of Joining,Short Month,Day of Joining,DOW of Joining,Short\
  \ DOW,Age in Company (Years),Salary,Last % Hike,SSN,Phone No. ,Place Name,County,City,State,Zip,Region,User\
  \ Name,Password |\n| 行 | 677509,Drs.,Lois,H,Walker,F,lois.walker@hotmail.com,DonaldWalker,Helen\
  \ Walker, Lewis, 3/29/1981,02:31:49 AM,36.36,60,11/24/2003,Q4,H2,2003,11,November,Nov,24,Monday,Mon,13.68,168251,21%,467-99-4677,303-572-8492,Denver,Denver,Denver,CO,80224,West,lhwalker,DCa}.T}X:v?NP\
  \ |\n\n表 4.4:示例数据集\n\n### 安装并配置 CsvHelper NuGet 包](#contents.xhtml_sc4_109a)\n\n\
  为了在我们的服务中解析 CSV 文件，请安装 Josh Close 开发的开源 NuGet 包 `CsvHelper`。创建一个新的类文件 `/CsvMaps/EmpMap.cs`，其内容如下：\n\
  \n```csharp\nusing CsvHelper;\nusing CsvHelper.Configuration;\nusing GrpcDownloadService.Protos;\n\
  using System.Globalization;\n\nnamespace MyDownloadService.CsvMaps;\n\npublic class\
  \ EmpMap : ClassMap<EmpResponse>\n{\n    /// <summary>\n    /// 将 CSV 列映射到 EmpResponse\
  \ 类属性\n    /// </summary>\n    public EmpMap()\n    {\n        Map(m => m.EmpID).Name(\"\
  Emp ID\");\n        Map(m => m.FirstName).Name(\"First Name\");\n        Map(m =>\
  \ m.LastName).Name(\"Last Name\");\n        Map(m => m.Age).Name(\"Age in Yrs.\"\
  );\n        Map(m => m.DateOfJoining).Name(\"Date of Joining\").TypeConverter<TimeStampConverter>();\n\
  \        Map(m => m.LastHike).Name(\"Last % Hike\").TypeConverter<PercentConverter>();\n\
  \    }\n\n    /// <summary>\n    /// 将 DateTime 转换为 Google.Protobuf.WellKnownTypes.Timestamp\n\
  \    /// </summary>\n    private class TimeStampConverter : CsvHelper.TypeConversion.DateTimeConverter\n\
  \    {\n        public override object? ConvertFromString(string? text, IReaderRow\
  \ row, MemberMapData memberMapData)\n        {\n            DateTime date = DateTime.Parse(text,\
  \ CultureInfo.GetCultureInfo(\"en-US\"));\n            date = DateTime.SpecifyKind(date,\
  \ DateTimeKind.Utc);\n            return Google.Protobuf.WellKnownTypes.Timestamp.FromDateTime(date);\n\
  \        }\n    }\n\n    /// <summary>\n    /// 将百分比字符串值（如 \"21%\"）转换为 float 0.21\n\
  \    /// </summary>\n    private class PercentConverter : CsvHelper.TypeConversion.DoubleConverter\n\
  \    {\n        public override object? ConvertFromString(string? text, IReaderRow\
  \ row, MemberMapData memberMapData)\n        {\n            text = text.Replace(CultureInfo.CurrentCulture.NumberFormat.PercentSymbol,\
  \ \"\");\n            return float.Parse(text) / 100;\n        }\n    }\n}\n```\n\
  \n此类有助于设置 `CsvHelper` 以在服务器上正确解析 CSV 文件。在 `EmpMap` 构造函数的第 13 到第 21 行之间，`EmpResponse`\
  \ 属性被映射到 CSV 列。`TimeStampConverter` 和 `PercentConverter` 是解析特定字段所需的自定义转换器。\n\n###\
  \ 创建 EmployeesDataService](#contents.xhtml_sc4_110a)\n\n现在我们需要创建一个服务方法，该方法将在服务器端读取\
  \ CSV 文件并将其写入响应流。创建类文件 `/Services/EmployeesDataService.cs`，其内容如下：\n\n```csharp\n\
  using CsvHelper;\nusing CsvHelper.Configuration;\nusing Grpc.Core;\nusing GrpcDownloadService.Protos;\n\
  using MyDownloadService.CsvMaps;\nusing System.Globalization;\n\npublic class EmployeesDataService\
  \ : EmployeesServiceBase\n{\n    public override async Task GetData(EmpRequest request,\
  \ IStreamWriter<EmpResponse> responseStream, ServerCallContext context)\n    {\n\
  \        try\n        {\n            using var reader = new StreamReader(Path.Combine(AppDomain.BaseDirectory,\
  \ \"Data\", \"Hr1m.csv\"));\n            var config = new CsvConfiguration(CultureInfo.InvariantCulture);\n\
  \            using var csv = new CsvReader(reader, config);\n            csv.RegisterClassMap<EmpMap>();\n\
  \            var records = csv.GetRecordsAsync<EmpResponse>();\n\n            while\
  \ (!context.CancellationToken.IsCancellationRequested && await records.MoveNextAsync())\n\
  \            {\n                await responseStream.WriteAsync(records.Current);\n\
  \            }\n        }\n        catch (Exception ex)\n        {\n           \
  \ throw new RpcException(new Status(StatusCode.Internal, ex.ToString()));\n    \
  \    }\n    }\n}\n```\n\n`EmployeesDataService.GetData` 是 `employees.proto` 中声明的\
  \ `GetData` 方法的实现。它在第 18 行读取 CSV 文件并在第 21 行写入响应流。第 33 行的 `while` 循环允许取消操作。\n\n在\
  \ `Program.cs` 中包含以下行以启动 gRPC 服务：\n\n```csharp\napp.MapGrpcService<EmployeesDataService>();\n\
  ```\n\n`EmployeesService` 已经就绪，并如图 4.19 所示显示在解决方案管理器中：\n\n![图 4.19](img/Figure_4.19.png)\n\
  \n### 4.19: GrpcService 项目\n\n### 创建 GrpcDownloadClient](#contents.xhtml_sc4_111a)\n\
  \n现在我们需要创建一个应用程序来使用此服务。创建一个控制台程序 `GrpcDownloadClient`。在新的应用中安装以下 NuGet 包：\n\n* \
  \  `Google.Protobuf` 来自 Google Inc\n*   `Grpc.NET.Client` 来自 gRPC 作者\n*   `Grpc.Tools`\
  \ 来自 gRPC 作者\n\n将 `/Protos` 文件夹（以及 `employees.proto` 文件）从 `GrpcService` 项目复制到 `GrpcDownloadClient`\
  \ 项目。调整新复制的 `employees.proto` 文件中的命名空间：\n\n```protobuf\noption csharp_namespace\
  \ = \"GrpcDownloadClient.Prottos\";\n```\n\n双击 `GrpcDownloadClient` 项目打开 `GrpcDownloadClient.csproj`\
  \ 文件进行编辑。添加一个指向项目内 `employees.proto` 文件的 `ItemGroup`，其内容所示：\n\n```xml\n<ItemGroup>\n\
  \  <Protobuf Include=\"Protos\\employees.proto\" GrpcServices=\"Client\" />\n</ItemGroup>\n\
  ```\n\n此时，项目应该可以成功编译，并且 `Employees.cs` 和 `EmployeesGrpc.cs` 文件应自动生成在 `.\\obj\\Debug\\\
  net7.0\\Protos` 文件夹下。\n\n要调用服务方法下载并查看 CSV 文件的内容，在 `Program.cs` 中包含以下代码：\n\n```csharp\n\
  using Grpc.Core;\nusing Grpc.NET.Client;\nusing GrpcDownloadClient.Protos;\n\nint\
  \ Count = 0;\nvar watch = System.Diagnostics.Stopwatch.StartNew();\ntry\n{\n   \
  \ var channel = GrpcChannel.ForAddress(\"https://localhost:7181\");\n    var empClient\
  \ = new EmployeesService.EmployeesServiceClient(channel);\n    using var empCall\
  \ = empClient.GetDataData(new EmpRequest(), deadline: DateTime.UtcNow.AddMinutes(10));\n\
  \    await foreach (var emp in empCall.ResponseStream.ReadAllAsync())\n    {\n \
  \       Count++;\n    }\n}\n```\n\n\n\n\n```csharp\n17. Console.WriteLine($\"#{Count}|Id:\
  \ {emp.EmpID}|{emp.FirstName} {emp.LastName}({emp.Age} yrs)|DOJ: {emp.DateOfJoining.ToDateTime():MMM\
  \ dd, yyyy}|Last Hike: {emp.LastHike * 100}%\");\n18. }\n19. }\n20. catch (RpcException\
  \ ex) when (ex.StatusCode == StatusCode.DeadlineExceeded)\n21. {\n22. Console.WriteLine(\"\
  Service timeout.\");\n23. }\n25. watch.Stop();\n27. Console.WriteLine($\"\\nServer\
  \ stream finished. Fetched {Count} records in {watch.Elapsed.TotalSeconds:F} sec.\"\
  );\n28. Console.Read();\n```\n\n在前面的代码中，我们在第 10 行通过指向服务器地址的 `channel` 实例化了 `EmployeesServiceClient`。随后，使用该\
  \ `client` 对象（即 `stub`）来调用服务器端的 `GetEmployeesData` 服务方法（第 12 行）。在第 14 行到第 18 行之间，服务器端实时写入的\
  \ `ResponseStream` 在处理每个员工记录时被读取，并显示在客户端的控制台上。\n\n为了查看程序的实际运行情况，我们需要同时运行两个项目——服务器和客户端。在\
  \ `Visual Studio` 的 `Solution Explorer` 中，右键点击 gRPC 服务器项目 `GrpcDownloadService`，并选择\
  \ `Debug | Start Without Debugging`。对客户端项目 `GrpcDownloadClient` 执行相同的操作，以查看执行是否成功，并查看客户端应用程序中通过服务器端流式传输从\
  \ gRPC 服务器读取的 `CSV` 文件内容。```\n\n## 单元测试\n\n对于 gRPC 服务的单元测试，我们的关注重点放在编写测试来仅验证 gRPC\
  \ 服务，其他所有内容（如依赖项、基础设施、路由、身份验证）都进行模拟（mock）。要进行测试，请创建一个名为 `GrpcDownloadService.Test`\
  \ 的新 `MSTest Test Project`。将单元测试文件 `UnitTest1.cs` 重命名为 `EmployeesDataServiceTests.cs`，并在请求重命名所有引用的提示框中点击“是”。为被测试的项目（即\
  \ `GrpcDownloadService`）添加依赖项。从 GitHub 的文件夹 `https://github.com/grpc/grpc-dotnet/tree/master/examples/Tester/Tests/Server/UnitTests/Helpers`\
  \ 下载两个辅助文件 `TestServerCallContext.cs` 和 `TestServerStreamWriter.cs`，并将它们添加到 `Helper`\
  \ 文件夹中。项目结构将如 `Solution Explorer` 中的图 4.20 所示：\n\n![](img/Figure_4.20.png)\n\n图\
  \ 4.20：`GrpcDownloadService.Test` 项目\n\n在 `EmployeesDataServiceTests.cs` 中添加以下代码：\n\
  \n```csharp\n1. using GrpcDownloadService.Protos;\n2. using GrpcDownloadService.Services;\n\
  3. using GrpcDownloadService.Test.Helpers;\n5. namespace GrpcDownloadService.Test;\n\
  7. [TestClass]\n8. public class EmployeesDataServiceTests\n9. {\n10. [TestMethod]\n\
  11. public async Task GetEmployeesDataTest()\n12. {\n13. // Arrange\n14. var service\
  \ = new EmployeesDataService();\n15. var cts = new CancellationTokenSource();\n\
  16. cts.CancelAfter(5000); // 在 5 秒后取消（长时间运行）操作\n18. var callContext = TestServerCallContext.Create(cancellationToken:\
  \ cts.Token);\n19. var responseStream = new TestServerStreamWriter<EmpResponse>(callContext);\n\
  20. using var taskGetEmployeesDataCall = service.GetEmployeesData(new EmpRequest(),\
  \ responseStream, callContext);\n22. // Act\n23. await taskGetEmployeesDataCall;\n\
  24. responseStream.Complete();\n26. var employees = new List<EmpResponse>();\n27.\
  \ await foreach (var emp in responseStream.ReadAllAsync())\n28. employees.Add(emp);\n\
  30. // Assert\n31. Assert.IsTrue(taskGetEmployeesDataCall.IsCompletedSuccessfully);\n\
  32. Assert.IsTrue(employees.Count >= 1);\n33. }\n34. }\n```\n\n在前面的代码段中，测试方法 `GetEmployeesDataTest`\
  \ 遵循 `Arrange-Act-Assert`（安排-执行-断言）模式。在 `Arrange` 部分，我们正在为调用被测试的方法做准备，即 `GrpcDownloadService.Services.EmployeesDataService.GetEmployeesData`。`Service`\
  \ 在第 14 行实例化，`GetEmployeesData` 方法的参数在第 15 行到第 20 行之间准备。`call context` 和 `response\
  \ stream` 使用辅助类 `TestServerCallContext` 和 `TestServerStreamWriter` 初始化。在 `Act` 部分，对\
  \ `GetEmployeesData` 进行了异步调用（第 23 行）。这是一个耗时操作，但它将在 5 秒后（第 16 行）被取消，此时写入 `response\
  \ stream` 的记录会较少。操作被取消后，我们必须将 `response stream` 标记为 `Complete`，然后从流中读取员工列表。最后，在\
  \ `Assert` 部分，我们验证操作是否已成功完成（第 31 行），以及 `response stream` 中至少有一条员工记录（第 32 行）。\n\n\
  ## 部署\n\n`Microsoft` 最近构建了在 `Linux 工作负载`上通过 `Azure App Service` 托管 gRPC 服务的支持。要在\
  \ `App Service` 上部署 gRPC 应用程序，请遵循教程 [`github.com/Azure/app-service-docs/blob/master/HowTo/gRPC_with_dotnet.md`](https://github.com/Azure/app-service-docs/blob/master/HowTo/gRPC_with_dotnet.md)。\n\
  \n## 结论\n\n总结来说，`ASP.NET Core gRPC` 为现代应用程序提供了强大的通信框架。基于 gRPC 的通信具有高性能、语言无关和自动代码生成等优势。本章提供了\
  \ `gRPC` 的概述，解释了其独特特性，并展示了如何使用 `ASP.NET Core` 创建简单的 gRPC 服务。\n\n## 记忆要点\n\n*   `ASP.NET\
  \ Core` 提供了一个可以通过 gRPC 访问的远程过程调用框架。\n*   `gRPC` 是一种语言无关的框架，客户端和服务器在 `.proto` 文件中约定消息和服务约。了解服务约允许客户端通过网络调用服务，传输请求和响应的基础管道工作由\
  \ gRPC 协议处理。\n*   由于 `gRPC` 服务基于 `HTTP/2` 并使用 `Protocol Buffer` 驱动的二进制方法，它们在性能上表现优异。参考\
  \ [`www.http2demo.io/`](http://www.http2demo.io/) 获取 HTTP/2 的演示。\n*   `gRPC` 支持服务器与客户端之间单向和双向的数据流传输。\n\
  *   `gRPC 服务` 适用于对性能有要求的内部微服务通信。\n\n## 练习\n\n创建一个与本章创建的 `GrpcDownloadService` 类似的\
