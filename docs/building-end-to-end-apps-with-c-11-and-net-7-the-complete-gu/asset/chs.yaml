  \n\n*   Razor Pages 允许将模型（Model）、视图（View）和控制器（Controller）的概念从不同文件夹合并到单个文件夹中的链接页面文件中，同时允许你的代码遵循逻辑上的关注点分离。\n\
  *   如果现有的 ASP.NET MVC 应用大量使用视图（Views），可以考虑从操作（Actions）和视图迁移到 Razor Pages。\n\n\n\
