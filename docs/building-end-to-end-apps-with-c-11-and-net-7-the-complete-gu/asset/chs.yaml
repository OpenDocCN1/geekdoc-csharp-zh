  \n# 第 9 章 .NET MAUI (#contents.xhtml_ch9a)\n\n## 简介 (#contents.xhtml_sc2_219a)\n\
  \n在最后两个章节中，我们专门为 Windows 平台构建了应用程序。本章专注于较新的技术：.NET 多平台 UI (MAUI)。我们将首先了解更多概念，然后创建一个真实的应用程序。\n\
  \n## 结构 (#contents.xhtml_sc2_220a)\n\n本章包含以下主题：\n\n*   移动应用开发的演变\n*   .NET MAUI\n\
  *   先决条件\n*   开始使用 .NET MAUI 应用\n    *   （默认）.NET MAUI 项目结构\n    *   创建 .NET MAUI\
  \ Blazor 应用\n*   开发真实的 .NET MAUI 应用\n    *   回顾 Sudoku Buddy WPF 应用\n    *   WPF\
  \ 与 .NET MAUI\n    *   将 Sudoku Buddy 从 WPF 迁移到 .NET MAUI\n        *   开始\n    \
  \    *   从 WPF 应用复制文件\n        *   创建视图\n        *   使用 Android 模拟器运行\n    *   单元测试\n\
  \    *   部署\n\n## 目标 (#contents.xhtml_sc2_221a)\n\n本章的目标是理解 .NET MAUI 应用的相关概念，并学习使用\
  \ C# 11 和 .NET 7.0 在 Visual Studio 中分步创建此类应用。\n\n## 移动应用开发的演变 (#contents.xhtml_sc2_222a)\n\
  \n在引入 .NET MAUI 之前，微软 .NET 的移动应用开发领域经历了显著演变。最初，微软专注于使用 .NET 框架专门为 Windows Phone\
  \ 构建移动应用。开发者可以利用其 C# 知识通过 Silverlight 和 XNA 等框架创建原生 Windows Phone 应用。\n\n随着 Windows\
  \ Phone 8 的发布和 Windows Runtime (WinRT) 的引入，微软扩展了移动应用开发能力。WinRT 允许开发者构建适用于各种 Windows\
  \ 设备（包括手机、平板电脑和桌面电脑）的通用应用。这实现了代码复用并加速了开发周期。\n\n为了应对增长的跨平台应用开发需求，微软于 2016 年收购了 Xamarin。Xamarin\
  \ 允许开发者使用 C# 和 .NET 框架构建可在 iOS、Android 和 Windows 设备上运行的移动应用。Xamarin.Forms 作为 UI\
  \ 框架促进了跨平台用户面的开发，而 Xamarin.Native 则能够创建特定平台的体验。\n\n\n\n\n随着移动技术格局的持续演变，微软认识到需要一个能够针对多个平台的统一框架。这推动了\
  \ `.NET MAUI` 的开发。\n\n# .NET MAUI\n\n.NET MAUI（发音为 m-OW-ee，以夏威夷第二大岛命名）是 `Xamarin.Forms`\
  \ 的演进版，提供了一个单一的代码库和统一的框架，用于构建面向 iOS、Android、Tizen、Windows 和 macOS 的跨平台应用。它带来了增强的性能、改进的工具以及丰富的\
  \ UI 控件和特性。借助 `.NET MAUI`，开发者可以利用其现有的 `.NET`技能并使用单一代码库来创建精美且响应迅速的用户界面使其在多个平台上无缝运行。同时还可以根据需要添加特定于平台的源代码及资源文件`.\
  \ NETMAU I 与 Blazor 集成因此可以直接在本机移动端桌面应用中重用现有 Blazzor Web UI 组件`\n\n图 9.1：.N ETMA\
