  \ |\n| `Controllers/WeatherForecastController.cs` | 由于我们最初选择了 Controller 模式（而不是\
  \ Minimal API 模式），因此创建了此与模拟 `WeatherForecast` API 对应的控制器文件。有关此文件内容的更多详细信息见下文。 |\n\
  | `appsettings.json` | 此配置文件用于存储应用程序配置设置，如数据库连接字符串、全局变量等。这可以通过特定环境的设置（如 `appsettings.Development.json`）进行覆盖。\
  \ |\n| `WeatherForecast.cs` | 这是与模拟 `WeatherForecast` API 对应的模型类。 |\n| `Project\
  \ file - *.csproj` | 项目是一个 SDK 格式的 XML 文件，描述了项目特定的元数据，例如项目支持的 `Target` `.NET` 框架。\
  \ |\n\n表 3.3：Web API 项目中的重要文件和文件夹\n`WeatherForecastController.cs` 文件是一个控制器类，在使用\
  \ ASP.NET Core 内置模板创建新的 Web API 项目时默认创建。它展示了如何创建控制器、注入依赖并返回数据。让我们查看该文件：\n\nusing\
  \ Microsoft.AspNetCore.Mvc;\n\n{\n    [ApiController]\n    public class WeatherForecastController\
  \ : ControllerBase\n    {\n\n        public WeatherForecastController(ILogger<WeatherForecastController>\
  \ logger)\n            _logger = logger;\n        }\n        [HttpGet]\n       \
  \ public IEnumerable<WeatherForecast> Get()\n            static string[] Summaries\
  \ = new[]\n            {\n            };\n\n            {\n                Date\
  \ = DateTime.Now.AddDays(index),\n            }).ToArray();\n        }\n}\n```\n\
  需要注意的特定点：\n- 类被 `ApiController` 特性修饰，表示它是一个 API 控制器。\n- 它继承自 `ControllerBase`，这是不支持视图（view）的控制器的基类。\n\
  - 它在构造函数中注入了 `ILogger<WeatherForecastController>` 实例，预期用于记录任何消息。\n\n`Program.cs`\
  \ 文件包含如下应用程序启动代码：\n```csharp\nvar builder = WebApplication.CreateBuilder(args);\n\
  // 通过 DI 向容器中添加服务。\nbuilder.Services.AddControllers();\nbuilder.Services.AddSwaggerGen();\n\
  \n\n// 通过中间件配置 HTTP 请求管道。\n{\n    app.UseSwagger();\n}\n\napp.UseAuthorization();\n\
  app.MapControllers();\napp.Run();\n```\n上述代码配置了应用程序所需的服务，并将请求管道定义为一系列中间件组件。服务通过依赖注入（DI）在整个应用程序中使用。在第\
  \ 1 行中，当实例化 `WebApplicationBuilder` 时，在后台隐式地添加了多个框架提供的服务。这包括 `ILogger`、`IConfigureOptions`\
  \ 等。第 4、5 和 6 行使用 `builder.Services` 将所需的服务添加到 DI 容器中。\n\n\n\nASP.NET Core minimal\
  \ API 是一种简化的方法，用于构建快速、精版的 ASP.NET Core 应用程序，旨在暴露轻量级的 HTTP API。此类应用程序通常只包含处理 HTTP\
  \ 请求和返回响应所需的最少代码和依赖项。可以使用极少的代码和配置构建功能完整的 REST 端点，跳过传统的脚手架，并流畅地声明 API 路由和操作，避免不必要的控制器。\n\
  \n\n- 减少了应用程序启动所需的文件数量和代码行数。最少只需要一个文件（`Program.cs`）和几行代码。\n- 不使用显式的 `Main` 方法作为程序的入口点（顶层语句）。\n\
  - 通过使用全局引用指令（global using directives）消除或尽量减少 `using` 语句行。这通过项目文件中的 `ImplicitUsings`\
  \ 设置起作用，该设置默认已启用。\n以下代码使用新的托管模型创建了一个 minimal API，它接受一个参数并返回当天的天气预报字符串。\n\nvar builder\
  \ = WebApplication.CreateBuilder(args);\n\n\nvar summaries = new[]\n\"Freezing\"\
  , \"Bracing\", \"Chilly\", \"Cool\", \"Mild\", \"Warm\", \"Balmy\", \"Hot\", \"\
  Sweltering\", \"Scorching\"\n};\napp.MapGet(\"WeatherForecast/{dayno}\",\n  (uint\
  \ dayno) => $\"The expected weather on day {dayno} is {summaries[Random.Shared.Next(summaries.Length)]}\"\
  );\napp.Run();\n```\n执行时，API 端点显示如下所示：\n\n\n图 3.6: 运行中的 minimal API\n## 控制器方法与 minimal\
  \ API 方法\n\n\n| | 基于控制器的方法 | minimal API 方法 |\n| 框架类型 | 提供一个功能完备、高级的框架用于构建 API。\
  \ | 提供一个轻量级、低级的框架用于构建 API。 |\n| 组成部分 | ASP.NET Core MVC 框架及其组件，如控制器、视图和模型。 | 一组专门为构建\
  \ API 设计的最小化抽象。 |\n| 构建的 API 类型 | 可用于构建作为 Web 应用程序后端的 API。 | 适用于构建简单的 API 或对实现有更多控制要求的\
  \ API。 |\n| 适用场景 | 适用于构建复杂的、功能丰富的 API。 | 与基于控制器的 API 相比，构建可能更快、更容易维护，特别是对于简单的 API。\
