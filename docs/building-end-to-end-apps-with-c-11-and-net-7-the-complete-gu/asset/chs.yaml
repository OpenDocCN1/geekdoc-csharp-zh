  />\n        <ResourceDictionary Source=\"/Resources/PencilStyle.xaml\"/>\n    </MergedDictionaries>\n\
  </Resources>\n```\n\n并在 `CellView.xaml` 中使用样式：\n\n```xml\n<Grid>\n    <TextBlock\
  \ Text=\"{Binding}\" Style=\"{StaticResource DigitStyle}\"/>\n    <TextBlock Text=\"\
  {Binding}\" Style=\"{StaticResource PencilStyle}\"/>\n</Grid>\n```\n\n执行并加载示例网格后，UI\
  \ 应该如图 7.18 所示：（注：此处图片图片逻辑）\n\n到目前为止，数独网格按宫组织，但为了直接访问，添加了新字段 `Cells2Array`。在初始化期间，将每个\
  \ `CellViewModel` 的引用保存在数组中：\n\n```csharp\npublic CellViewModel[,] Cells2Array {\
  \ get; private set; }\n\nprivate void Initialize(SudokuGrid sudokuBoard = null)\n\
  {\n    SudokuBoard = sudokuBoard ?? new SudokuGrid();\n    Boxes = new ObservableCollection<BoxViewModel>();\n\
  \    Cells2Array = new CellViewModel[9, 9];\n    SudokuBoard.UpdateAllCandidates();\n\
  \    InitializeBoxes();\n}\n\nprivate void InitializeBoxes()\n{\n    // ...\n  \
  \  box.Cells.Add(cell);\n    Cells2Array[k, l] = cell;\n}\n```\n\n为了在单元格中输入数字时更新候选数字，在\
  \ `SudokuGridExtensions.cs` 中添加以下方法：\n\n```csharp\npublic static void UpdateAffectedCandidates(this\
  \ SudokuGrid sudokuGrid, int row, int col, SudokuViewModel sudokuViewModel)\n{\n\
  \    for (int c = 0; c < 9; c++)\n        if (c != col)\n            Update(sudokuGrid,\
  \ row, c, sudokuViewModel); //更新行候选数字\n\n    for (int r = 0; r < 9; r++)\n     \
  \   if (r != row)\n            Update(sudokuGrid, r, col, sudokuViewModel); //更新列候选数字\n\
  \n    int boxRow = (row / 3) * 3;\n    int boxColumn = (col / 3) * 3;\n    for (int\
  \ c = 0; c < 3; c++)\n        for (int r = 0; r < 3; r++) //包含当前单元格\n          \
  \  // 更新宫格候选数字\n}\n```\n\n\n\n\n\n```csharp\nif (boxRow + r != row && boxColumn\
  \ + c != col) {\n    Update(sudokuGrid, boxRow + r, boxColumn + c, sudokuViewModel);\
  \ //更新宫格候选数\n    Update(sudokuGrid, row, col, sudokuViewModel); //更新当前单元格\n}\n\n\
  private static void Update(SudokuGrid sudokuGrid, int r, int c, SudokuViewModel\
  \ sudokuViewModel)\n{\n    sudokuGrid.Candidates[r, c] = GetCandidates(sudokuGrid.Data,\
  \ r, c);\n    if (sudokuViewModel != null)\n        sudokuViewModel.Cells2DArray[r,\
  \ c].Candidates = sudokuGrid.Candidates[r, c].ToArray();\n}\n```\n\n在前面的代码中，我们通过遍历行、列和宫的单元格来更新特定单元格的候选数。首先在网格数据结构中更新候选数（第\
  \ 23 行），随后在视图模型中进行更新（第 26 行）。\n\n为了同步输入的数字和对应的视图模型，请在 `Helpers` 文件夹下创建 `CellViewModelExtensions.cs`\
  \ 并包含以下方法：\n\n```csharp\nusing SudokuBuddy.ViewModels;\nusing System.Windows;\n\n\
  namespace SudokuBuddy.Helpers;\npublic static class CellViewModelExtensions\n{\n\
  \    public static void SyncBoardAndViewModel(this CellViewModel cell)\n    {\n\
  \        var sudokuViewModel = cell?.ParentBoxViewModel?.ParentSudokuViewModel;\n\
  \        if (sudokuViewModel == null)\n            return;\n        var sudokuGrid\
  \ = sudokuViewModel.SudokuBoard;\n        //更新网格单元格值\n        byte.TryParse(cell.Digit,\
  \ out var digit);\n        sudokuGrid.Data[cell.Row, cell.Column] = digit;\n   \
  \     cell.CandidatesVisibility = Visibility.Hidden;\n        sudokuGrid.UpdateAffectedCandidates(cell.Row,\
  \ cell.Column, sudokuViewModel);\n        if (digit == 0)\n            cell.CandidatesVisibility\
  \ = Visibility.Visible;\n        sudokuViewModel.MarkErrors();\n    }\n}\n```\n\n\
  在前面的方法中，我们更新网格中的数字（第 17 行），然后调用方法更新候选数（第 20 行）。当在单元格中输入数字时，应该调用此新方法。\n\n为了响应文本框的文本更改事件，我们不再采用编写如\
  \ `OnTextChangedHandler` 等事件处理程序的传统方式，而是使用 `Microsoft.Xaml.Behaviors.Wpf` 通过 `XAML\
  \ Behaviors` 为 WPF 添加交互。行为（Behaviors）封装了元素的可重用功能，可以在不需要更多命令式代码的情况下包含。添加 Microsoft\
  \ 的 NuGet 包 `Microsoft.Xaml.Behaviors.Wpf`。在 `CellViewModel.cs` 中添加高亮代码：\n\n```csharp\n\
  ...\npublic CellViewModel()\n{\n    Candidates = Array.Empty<string>();\n    TextChangedCommand\
