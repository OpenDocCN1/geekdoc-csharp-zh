  }\n```\n\n在 `book.service.ts` 中添加以下代码：\n\n```typescript\nimport { Injectable } from\
  \ '@angular/core';\nimport { HttpClient } from '@angular/common/http';\nimport {\
  \ Observable } from 'rxjs';\n\nconst baseURL = 'https://localhost:7298/api/books';\
  \ // 指向服务器 url\n\n@Injectable({\n  providedIn: 'root'\n})\nexport class BookService\
  \ {\n  constructor(private httpClient: HttpClient) { }\n\n  readAll(): Observable<any>\
  \ {\n    return this.httpClient.get(baseURL);\n  }\n\n  read(id: any): Observable<any>\
  \ {\n    return this.httpClient.get(`${baseURL}/${id}`);\n  }\n\n  create(data:\
  \ any): Observable<any> {\n    return this.httpClient.post(baseURL, data);\n  }\n\
  \n  update(id: any, data: any): Observable<any> {\n    return this.httpClient.put(`${baseURL}/${id}`,\
  \ data);\n  }\n\n  delete(id: any): Observable<any> {\n    return this.httpClient.delete(`${baseURL}/${id}`);\n\
  \  }\n}\n```\n\n上述代码中的 `Book` 服务通过构造函数第 12 行注入的 `HttpClient` 调用了第 5 行定义的 `baseURL`\
  \ 上的 ASP.NET Core API。每个方法都对应一个 API 端点，并使用适当的方法进行 REST 调用。\n\n用以下代码替换 `book-list.component.ts`\
