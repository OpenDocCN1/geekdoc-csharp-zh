  \ Bootstrap 模态对话框来询问删除确认。由于 Bootstrap 已经是默认模板的一部分，我们只需要在 `angular.json` 中包含高亮的行以引入\
  \ Bootstrap JavaScript 对象：\n\n1. …\n2. `\"styles\": [\n3. \"node_modules/bootstrap/dist/css/bootstrap.min.css\"\
  ,\n4. \"src/styles.css\"\n5. ],\n6. \"scripts\": [\n7. \"node_modules/bootstrap/dist/js/bootstrap.min.js\"\
  \n8. ]\n9. …\n\n在 `book-list.component.ts` 中包含高亮行：\n\n```typescript\nimport { Component,\
  \ OnInit } from '@angular/core';\nimport { BookService } from 'src/app/books/book.service';\n\
  import { Book } from \"../book\";\n\ndeclare var window: any;\n\n@Component({\n\
  \  selector: 'app-book-list',\n  templateUrl: './book-list.component.html',\n  styleUrls:\
  \ ['./book-list.component.css']\n})\nexport class BookListComponent implements OnInit\
  \ {\n  books!: Book[];\n  deleteModal: any;\n  idTodelete: number = 0;\n  titleToDelete!:\
  \ string;\n\n  constructor(private bookService: BookService) { }\n\n  ngOnInit():\
  \ void {\n    this.deleteModal = new window.bootstrap.Modal(\n      document.getElementById('deleteModal')\n\
  \    );\n\n    this.readBooks();\n  }\n\n  readBooks(): void {\n    this.bookService.readAll()\n\
  \      .subscribe(\n        books => {\n          this.books = books;\n        \
  \  console.log(books);\n        },\n        error => {\n          console.log(error);\n\
  \        }\n      );\n  }\n\n  openDeleteModal(id: number, title: string) {\n  \
  \  this.idTodelete = id;\n    this.titleToDelete = title;\n    this.deleteModal.show();\n\
  \  }\n\n  delete() {\n    this.bookService.delete(this.idTodelete).subscribe({\n\
  \      next: () => {\n        this.books = this.books.filter(_ => _ != this.idTodelete);\n\
  \        this.deleteModal.hide();\n      }\n    });\n  }\n}\n```\n\n修改后的 `BookListComponent`\
  \ 使用第 21 行的 `deleteModal` 定义实例化了 Bootstrap 模态框。同时在 `book-list.component.html` 中包含以下\
  \ HTML：\n\n```html\n<!-- Modal -->\n<div class=\"modal fade\" id=\"deleteModal\"\
  \ tabindex=\"-1\" aria-labelledby=\"exampleModal\" aria-hidden=\"true\">\n  <div\
  \ class=\"modal-dialog\">\n    <div class=\"modal-content\">\n      <div class=\"\
  modal-header\">\n        <h5 class=\"modal-title\" id=\"exampleModal\">确认</h5>\n\
  \        <button type=\"button\" class=\"btn-close\" data-bs-dismiss=\"modal\" aria-label=\"\
  Close\"></button>\n      </div>>\n      <div class=\"modal-body\">\n        你真的要删除\
  \ <span class=\"fw-bold\">{{title}}</span>吗？\n      </div>\n      <div class=\"\
  modal-footer\">\n        <button type=\"button\" class=\"btn btn-secondary\" data-bs-dismiss=\"\
  modal\">否</button>\n        <button type=\"button\" class=\"btn btn-danger\" (click)=\"\
  delete()\">是</button>\n      </div>\n    </div>\n  </div>\n</div>\n```\n\n通过这些更改，书籍列表将为每条记录显示删除按钮。点击删除按钮将显示接的模态框，点击“是”将根据传递的\
  \ `id` 和 `title` 参数执行删除。\n\n\n\n\n\n*   也可以使用 `React.js` 代替 `Angular` 来配合 `ASP.NET\
  \ core` 作为后端创建 SPA。`Visual Studio` 自带带有 `React.js` 的 `ASP.NET Core` 模板，用于启动此类开发。\n\
  \n## 练习 (#contents.xhtml_sc2_172a)\n\n增强在本章构建的 `Angular` 应用程序，为 `Publisher` 实体添加列表、详情、编辑和删除页面。通过\
  \ `Angular PublisherService` 利用 `PublisherController` 的 API，参考 `Book` 实体的相似页面的代码创建新页面。\n\
