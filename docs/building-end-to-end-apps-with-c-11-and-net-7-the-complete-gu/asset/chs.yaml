  \n\n\n\n在 WPF 章节中，我们创建了一个 Sudoku Buddy ，它演示了关于控件、布局和 MVVM 模式的核心概念。在本章节中，我们将创建一个相同的应用程序，但这次将使用\
  \ .NET MAUI。在这样的迁移过程中，我们应该能够复用 .NET 类文件中大部分代码，即模型（Models）、视图模型（ViewModels）以及基于 `CommunityToolkit.MVVM`\
  \ NuGet 包实现的 MVVM 代码。然而，控件和布局的差异将迫使我们从头创建视图（Views）。这个练习还应该为现实应用中任何此类迁移可能遵循的路径提供参考。在开始之前，让我们回顾一下之前使用\
  \ WPF 创建 Sudoku Buddy 应用所做的工作。\n\n## 回顾 – Sudoku Buddy WPF \n\nSudoku Buddy 是围绕传统的\
  \ 9x9 数独矩阵游戏构建的。该应用程序帮助玩家在输入新数字时，了解每个网格单元中的候选数字（或铅笔标记）。在 WPF 实现中，我们围绕 MVVM 模式构建了应用程序，创建了\
  \ `SudokuGrid` 模型以及三个对应于数独网格（Grid）、宫格（Box）和单元格（Cell）的用户控件。每个控件都有各自的 ViewModel 类。UI\
  \ 上的字段绑定到 ViewModel 中的属性，利用了来自 `CommunityToolkit.Mvvm` 提供的有用注解及其源生成功能，这些功能在后台实现了必要的与观察性相关的胶接代码。关于\
  \ MVVM 工作机制的更多细节，请参考 WPF 章节。\n\n## WPF 与 .NET MAUI\n\nWPF 和 .NET MAUI 之间的一些主要区别总结如下：\n\
  \n*   **跨平台特性**：.NET MAUI 被设计为一个跨平台框架，允许你为多个平台（包括 Windows、macOS、iOS 和 Android）构建应用程序。另一方面，WPF\
  \ 主要关注 Windows 桌面应用程序。\n*   **UI 控件**：虽然 WPF 提供了丰富的 UI 控件集合，但并不是所有控件在 .NET MAUI\
  \ 中都可用。与 WPF 相比，.NET MAUI 的控件集合较少。然而，它提供了一组可在多个平台运行的统一控件。\n*   **XAML 预览**：在 WPF\
  \ 中，你可以在 Visual Studio IDE 中看到 UI 设计的实时预览。然而，在 .NET MAUI 中，IDE 不为正在设计的 UI 屏幕提供实时预览。你需要依赖\
  \ XAML 代码并运行程序来可视化 UI。\n*   **项目结构**：.NET MAUI 的项目结构与 WPF 不同。.NET MAUI 通常包含一个单一项目文件，其中包含共享代码以及每个目标平台的特定特定项目。这允许你在跨平台共享大部分代码库，同时拥有用于自定义的独立平台特定项目。虽然\
  \ .NET MAUI 通过单一代码库覆盖移动端和桌面端，但在形式因子上存在巨大差异，开发者需要适应不同设备上变化的用户体验（UX）。\n*   **布局与样式**：虽然\
  \ WPF 和 .NET MAUI 都使用 XAML 进行 UI 设计，但由于 .NET MAUI 的跨平台特性，布局和样式上可能存在差异。WPF 中提供的某些布局面板或样式功能在\
  \ .NET MAUI 中可能不可用或行为不同。\n*   **打包与部署**：WPF 和 .NET MAUI 之间的打包和部署机制可能不同。WPF 应用程序通常部署为\
  \ Windows 桌面应用程序，而 .NET MAUI 应用程序可以作为独立的可执行文件部署，或者打包为特定平台的应用包进行发布。\n*   **兼容性**：WPF\
  \ 存在已久，拥有庞大的第三方控件、库和资源生态系统。.NET MAUI 是一个较新的框架，因此它与现有 WPF 库和资源可能不具有相同的兼容水平。然而，.NET\
  \ MAUI 设计为与 Xamarin.Forms 向后兼容，这开启了大量的现有 Xamarin 库。\n\n## 将 Sudoku Buddy 从 WPF 迁移到\
  \ .NET MAUI\n\n我们创建 .NET MAUI 版本的基本方法将保持不变，区别在于定义 UI 控件的方式。这对其他代码也有影响。当 Sudoku Buddy\
  \ 在 .NET MAUI 上完全开发后，其在 Windows 上的外观如下：\n\n![](img/Figure_9.11.png)\n\n图 9.11：Windows\
  \ 上的空 Sudoku Buddy UI\n\n当加载示例网格时，它的显示如下（在 Windows 上）：\n\n![](img/Figure_9.12.png)\n\
  \n图 9.12：Windows 上的 Sudoku Buddy\n\n相同的 UI 在 Android 模拟器显示如下：\n\n![](img/Figure_9.13.png)\n\
  \n图 9.13：Android 上的 Sudoku Buddy\n\n## 开始\n\n使用 .NET MAUI App 模板创建一个名为 `SudokuBuddyMauiApp`\
  \ 的新项目，并按照之前描述 `FirstMAUIApp` 时的方式选择所有默认选项。\n\n## 从 WPF 应用程序复制文件\n\n首先，添加 NuGet\
  \ 包 `CommunityToolkit.Maui` 的引用。执行此操作将提示你在 `MauiProgram.cs` 中包含一行代码。\n\n`MauiProgram.cs`\n\
  \n```csharp\n1. using CommunityToolkit.Maui;\n2. using Microsoft.Extensions.Logging;\n\
  3. \n4. namespace SudokuBuddyMauiApp;\n5. public static class MauiProgram\n6. {\n\
  7.   public static MauiApp CreateMauiApp()\n8.   {\n9.     var builder = MauiApp.CreateBuilder();\n\
  10.    builder\n11.     .UseApp<App>()\n12.     .UseCommunityToolkit()\n13.    \
  \ .ConfigureFonts(fonts =>\n14.    {\n15.      fonts.AddFont(\"OpenSans-Regular.ttf\"\
  , \"OpenSansRegular\");\n16.      fonts.AddFont(\"OpenSans-Semibold.ttf\", \"OpenSansSemibold\"\
  );\n17.    });\n18. \n19. #if DEBUG\n20.     builder.Logging.AddDebug();\n21. #endif\n\
  22. \n23.     return builder.Build();\n24.   }\n25. }\n```\n\n上述代码中的高亮行初始化了 Community\
  \ Toolkit。接下来，添加 NuGet 包 `CommunityToolkit.MVVM` 的引用。实现 MVVM 的更改将保持并在并可以参考章节。从 WPF\
  \ 项目复制 `\\Helpers`、`\\Models` 和 `\\ViewModels` 文件夹到 `SudokuMauiApp` 项目下。由于复制类的命名空间不同，右键点击项目并选择\
  \ `Sync Namespaces`。同时运行 `Code Cleanup`。确保复制类的命名空间与其文件夹同步，否则请手动修改。\n\n在此阶段编译项目时，`CellViewModel.cs`\
  \ 会出现错误。`TextCompositionEventArgs` 未被识别。要消除此编译错误，请删除与 `PreviewTextInputCommand`\
  \ 和 `PreviewTextInputHandler` 相关的更改。删除后，`CellViewModel.cs` 文件如下：\n\n```csharp\n\
  1. using CommunityToolkit.Mvvm.ComponentModel;\n2. using CommunityToolkit.Mvvm.Input;\n\
  3. using SudokuMauiApp.Helpers;\n4. using System.Windows.Input;\n5. \n6. namespace\
  \ SudokuMauiApp.ViewModels;\n7. \n8. public partial class CellViewModel : ObservableObject\n\
  9. {\n10.  [ObservableProperty]\n11.  string _digit;\n12. \n13.  [ObservableProperty]\n\
  14.  string[] _candidates;\n15. \n16.  [ObservableProperty]\n17.  bool _hasError;\n\
  18. \n19.  [ObservableProperty]\n20.  Visibility _candidatesVisibility;\n21. \n\
  22.  public int Row { get; set; }\n23.  public int Column { get; set; }\n24.  public\
  \ BoxViewModel ParentBoxViewModel { get; set; }\n25. \n26.  public CellViewModel()\n\
  27.  {\n28.     Candidates = Array.Empty<string>();\n29. \n30.     TextChangedCommand\
  \ = new RelayCommand(TextChangedHandler);\n31.  }\n32.  public ICommand TextChangedCommand\
  \ { get; private set; }\n33. \n34.  private void TextChangedHandler()\n35.  {\n\
  36.    this.SyncBoardAndViewModel();\n37.  }\n38. }\n```\n\n完成上述更改后，项目应该可以正常编译。\n\
