  \ int boxColumn = (col / 3) * 3;\n        for (int r = 0; r < 3; r++)\n        {\n\
  \            for (int c = 0; c < 3; c++)\n            {\n                if ((boxRow\
  \ + r != row || boxColumn + c != col) &&\n                    sudokuViewModel.Cells2DArray[boxRow\
  \ + r, boxColumn + c].Digit == digit)\n                    return true;\n      \
  \      }\n        }\n        return false;\n    }\n}\n```\n\n在前面的方法中，我们遍历网格中的所有单元格，并检查单元格中的数字是否符合数独规则。如果不符合规则，我们为单元格设置\
  \ `HasError` 标记。从 `CellViewModelExtensions.cs` 中调用新的 `SyncBoardAndViewModel`：\n\n\
