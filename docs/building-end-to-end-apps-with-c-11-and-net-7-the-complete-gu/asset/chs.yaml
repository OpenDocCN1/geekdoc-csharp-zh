  \n# 第 5 章 Blazor WebAssembly\n\n## 引言\n继续介绍在 `.NET` 中开发 Web 应用程序的不同方式。在本章中，我们将探索\
  \ Blazor——这是一个由微软开发的相对较新的开源 Web 框架。它于 2018 年作为一个实验项目启动，并于 2021 年 5 月正式发布。Blazor\
  \ 允许使用 `.NET`、`HTML` 和 `CSS` 构建交互式 Web 。然而，与大多数 Web 应用不同，它不是使用 JavaScript，而是使用 `C#`\
  \ 来编写运行在浏览器中的代码。Blazor 这个词是 browser 和 Razor 的组合。让我们深入吧！\n\n## 结构\n本章将涵盖以下主题：\n-\
  \ Blazor 简介\n    - Blazor 应用类型\n        - Blazor Server\n        - Blazor WebAssembly\n\
  \        - Blazor WebAssembly Hosted（托管）\n        - Blazor WebAssembly 渐进式 Web 应用\
  \ (PWA)\n        - Blazor Hybrid\n- 前提条件\n- 从 Blazor WebAssembly 应用开始\n    - （默认）Blazor\
  \ WebAssembly 项目结构\n- 开发 Blazor WebAssembly (托管) 应用\n    - 创建 Blazor WebAssembly\
  \ 客户端和服务器\n        - 入门\n        - 创建 Index 页面\n        - 创建变体一——你来猜\n        -\
  \ 创建变体二——电脑来猜\n        - 保存游戏日志\n        - 创建查看游戏日志的 UI\n    - 单元测试\n        - 使用\
  \ `bUnit` 进行单元测试\n        - 使用 `Playwright .NET` 进行端到端测试\n    - 部署\n\n## 目标\n本章的目标是理解如何使用\
  \ Blazor 开发交互式 Web 应用。随着学习，，我们将检查 Blazor 应用开发框架的相关概念，以及可以在 Visual Studio 2022 中使用\
  \ `C#` 11 和 `.NET` 7.0 构建的不同类型的应用。\n\n## Blazor 简介\nBlazor 是一个开源且跨平台的 Web UI 框架，用于使用\
  \ `.NET` 和 `C#` 代替 JavaScript 在服务器和客户端构建单页应用 (SPA)。Blazor 这个词是 browser 和 Razor 的组合。WebAssembly\
  \ 的最初版本于 2017 年作为 W3C、Mozilla、Google 和 Apple 创建的开放标准发布。它被 Chrome、Edge、Firefox、Safari\
  \ 等主流浏览器广泛支持，但不支持 IE 11。\n\n```\nimages/Figure_1.png\n```\n图 5.1：将 C# 代码编译为 WebAssembly\n\
  \n## Blazor 应用类型\nBlazor 应用由一个或多个 Razor 组件组成。这些组件是独立的代码段，例如页面、对话框或表单，它们在 `.razor`\
  \ 文件将 Razor、`HTML` 和 `C#` 结合。它们可以在项目之间复用和共享。组件使用渲染树在内存中表示文档模型 (DOM)，有助于灵活地更新 UI。Blazor\
  \ 主要支持两种托管组件的模型：Blazor Server 和 Blazor WebAssembly。\n\n### Blazor Server\n在 Blazor\
  \ Server 托管模型中，应用程序在托管 Razor 组件的 ASP.NET Core 中上执行。UI 更新、事件处理和 JavaScript 调用通过使用\
  \ `WebSockets` 协议的 `SignalR` 连接实时处理。大部分处理负载在服务器上。\n\n```\nimages/Figure_2.png\n\
  ```\n图 5.2：Blazor Server 应用的工作原理[1]\n\n---\n\n[1] 来源: https://learn.microsoft.com/en-us/aspnet/core/blazor/?view=aspnetcore-5.0#blazor-server\n\
  \n\n\n\n\nBlazor WebAssembly 是一种用于执行 Blazor 程序的客户端托管模型。当用户在 浏览器中导航到 Blazor WebAssembly\
  \ 应用时，浏览器会下载该应用的资源和 .NET 运行时。随后，应用将在客户端浏览器上运行，并可以与浏览器的 API（如 `DOM`）交互以更新用户界面。如有必要，应用还可以向服务器端后端发出\
  \ API 调用。UI 更新在本地处理，这意味着应用程序可以在离线状态或网络连接不佳的情况下工作。这还能提供更快的响应时间，因为应用程序不需要与服务器通信来处理\
  \ UI 更新。由于应用程序是自包含的，因此可以轻松地分发和部署。应用程序可以托管在多种托管平台上，例如静态网站托管、内容分发网络 (CDN)，或像 `AWS\
  \ S3`、`Azure static web apps` 或 `Blob Storage` 等存储服务。\n\n![](img/Figure_5.3.png)\n\
  \n图 5.3: Blazor WebAssembly 应用的工作原理 2\n\n***\n\n2 来源：[`learn.microsoft.com/en-us/aspnet/core/blazor/?view=aspnetcore-7.0#blazor-webassembly`](https://learn.microsoft.com/en-us/aspnet/core/blazor/?view=aspnetcore-7.0#blazor-webassembly)\n\
  \n因此，Blazor WebAssembly 允许开发者在充分利用浏览器所有功能的同时，创建快速、响应迅速且具备离线能力的 Web 应用。\n\n## Blazor\
  \ WebAssembly Hosted (#contents.xhtml_sc4_125a)\n\n在这种变体中，Blazor WebAssembly 应用托管在\
  \ ASP.NET Core 程序内部。ASP.NET Core 程序作为 Blazor WebAssembly 应用的宿主机，并为其提供额外的服务，如身份验证、授权和\
  \ API 调用。Blazor WebAssembly 应用在客户端浏览器上运行，并可以与浏览器的 API（如 `DOM`）交互以更新用户界面。如有必要，应用还可以向服务器端后端发出\
  \ API 调用。当用户在浏览器中导航到 Blazor WebAssembly Hosted 应用时，浏览器首先与宿主机 ASP.NET Core 程序通信。然后，ASP.NET\
  \ Core 程序将 Blazor WebAssembly 应用作为静态文件提供给浏览器。随后，浏览器下载应用的资源和 .NET 运行时，就像在独立的 Blazor\
  \ WebAssembly 应用中一样。\n\n## Blazor WebAssembly Progressive Web App (PWA) (#contents.xhtml_sc4_126a)\n\
  \n这种 Blazor WebAssembly 应用变体设计用于离线工作并可以安装在用户的设备上，就像原生移动应用一样。渐进式 Web 应用 (PWAs) 是可以添加到用户设备主屏幕、接收推送通知并在离线状态运行的\
  \ Web 应用。为了启用离线功能，应用程序使用名为 `Service Worker` 的缓存机制。`Service Worker` 是一个运行在后台的脚本，允许应用程序在用户离线时也能缓存资源并处理请求。这意味着一旦用户访问过该应用且它已被缓存，即使他们丢失了互联网连接，仍然可以访问和使用它。此外，应用程序可以安装在用户的设备上，这意味着它可以像原生应用一样启动，而无需浏览器。这提供了更无缝的用户体验，并可以提高应用程序的性能。将现有的\
  \ Blazor WebAssembly 应用转换为 PWA 也是可能的。\n\n## Blazor Hybrid (#contents.xhtml_sc4_127a)\n\
  \n在 Blazor Hybrid 应用中，Razor 组件通过 `.NET MAUI`、`WPF` 或 `Windows Forms` 在特定设备的 `BlazorWebView`\
  \ 控件上渲染。Razor 组件加载和执行代码的速度很快，组件可以通过 .NET 平台完全访问设备的原生能力。我们将在后面的章节中详细检查这一内容。\n\n![](img/Figure_5.4.png)\n\
  \n图 5.4: Blazor Hybrid 应用中 Web View 控件内运行的 Razor 组件 3\n\n***\n\n3 来源：[`learn.microsoft.com/en-us/training/modules/build-blazor-hybrid/2-understand-blazor-hybrid`](https://learn.microsoft.com/en-us/training/modules/build-blazor-hybrid/2-understand-blazor-hybrid)\n\
