  \ Microsoft、Google 或 Facebook）验证用户。\n* **OAuth2**: 权的开放标准。许多组织使用 OAuth2 处理基于 API\
  \ 的应用程序中的授权。\n* **第三方身份验证提供程序**: 如 Google、Facebook、Twitter 等。\n\n\n![](img/Figure_3.14.png)\n\
