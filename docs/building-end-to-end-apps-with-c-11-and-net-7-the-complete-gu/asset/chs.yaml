  \n![](img/Figure_7.20.png)\n\n### 图 7.20：允许输入且候选数随之变化\n\n当单元格中的数字不符合数独规则时，我们应该在视觉上高亮该单元格以及同一行、同列、同宫的相关单元格。为了实现这一点，创建包含以下内容的\
  \ `SudokuExtensions.cs`：\n\n```csharp\nusing SudokuBuddy.ViewModels;\nnamespace\
