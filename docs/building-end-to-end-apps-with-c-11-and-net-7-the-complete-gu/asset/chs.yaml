  \ |\n\n表 10.1: ML.NET 支持的机器学习场景 |\n\n## 先决条件\n\n完成本章中的示例需要 Visual Studio 2022 Community\
  \ 版或更高版本，并带有 .NET 开发工作负载以及可选的 ML.NET Model Builder 组件。如果你已经有了 Visual Studio 2022，应通过启动\
  \ Visual Studio 安装程序将其更新到最新版本。同样，ML.NET Model Builder 组件可以通过 Visual Studio 内部的“扩展\
  \ | 管理扩展”菜单进行更新，或从 Visual Studio Marketplace 下载并重新安装。\n\n## 开始使用 ML.NET\n\nML.NET\
  \ 在 Visual Studio 中没有特定的项目模板，任何类型的项目（桌面或 Web）都可以通过包含 NuGet 包 `Microsoft.ML` 来引入机器学习功能。我们将首先创建两个简单的程序以理解解决机器学习问题时的整体流程。一个是直接使用\
  \ ML.NET API，另一个使用 Visual Studio 的 Model Builder 扩展。稍后我们将创建一个使用大型财务数据集并对其进行端到端处理的程序。但在编写任何代码之前，让我们先理解机器学习问题的典型流程。\n\
  \n## 机器学习过程\n\n对于任何机器学习问题，实际实现可能会根据特定任务、数据以及采用的技术或算法而不同，但从高层面上来看，任何机器学习任务的过程都可以总结为以下步骤，如图\
  \ 10.2 所示：\n\n![](img/Figure_10.2.png)\n\n图 10.2: 机器学习过程\n\n\n\n\n\n1. **定义问题**：清晰地描述你想要使用机器学习解决的问题。这涉及到理解预期的结果、可用数据以及任何约束或局限性。\n\
  2. **收集并预处理数据**：收集用于训练和评估机器学习模型的相关数据。这些数据可以来自各种来源，例如数据库、`APIs` 或手动标记。通过清理数据、处理缺失值以及将其转换为适用于分析的格式来对数据进行预处理。\n\
  3. **划分数据**：将收集的数据分为二或三组：训练集、验证集和测试集。训练集用于训练模型，验证集用于在开发过程中调优超参数并评估模型性能，测试集用于对训练好的模型进行最终评估。\n\
  4. **选择模型**：选择一个适合你问题的机器学习算法或模型。此选择取决于数据性质、问题类型（分类、回归、聚类等）以及可用的计算资源等因素。\n5. **训练模型**：使用训练集训练所选模型。模型从输入数据中学习，目标是通过调整内部参数，最小化预测值与训练集中实际结果之间的差异。此过程通常涉及一个迭代更新模型参数的优化算法。\n\
  6. **评估模型**：使用验证集评估训练后模型的性能。这一步有助于调优模型的超参数，并选择能够良好泛化到未见数据的最佳配置。常见的评估指标包括准确率、精确率、召回率、`F1\
  \ score`、ROC 面积、均方误差或其他领域特定指标。\n7. **微调模型**：根据验证集上的性能评估结果调整模型的超参数。这可能涉及更改学习率、正则化技术或其他特定于算法的参数。目标是提高模型的性能和泛化能力。\n\
  8. **使用模型进行预测**：一旦模型完成训练和微调，通过进行一次或多次预测来评估其在测试集上的性能。该集合代表真实世界的未见数据，并对模型的有效性提供无偏评估。从这一步中获得的结果提供了模型性能的最终衡量，并有助于评估其就绪情况。\n\
  9. **部署模型**：如果模型在测试集上的表现满意，则可以部署到生产环境中。这可能涉及将模型集成到应用程序中、搭建适当的基础设施并随时间监控其性能和预测。\n\
  10. **监控和维护模型**：持续监控模型性能，并在新数据可用时定期重新训练或更新模型。确保模型在变化的环境中保持准确性和可靠性，并能适应任何演变的模式或趋势至关重要。\n\
  \n## 使用 ML.NET API 进行二分类\n\n为了开始，我们将创建一个简单的程序，使用来自 `ML.NET` 的二分类算法来执行情感分析。情感分析是将评论意见表述为正面反馈或负面反馈。\n\
  \n### 二分类\n\n二分类是一项监督学习机器学习任务，意味着模型在具有输入和输出参数的标记数据集上进行训练，其中算法学习在输入和正确输出之间建立映射关系。二分类的目标是将数据分为一或两个互斥的特定类别或范畴。这两个类别通常被统为正面和负面，有时也被标记为\
  \ `class 1` 和 `class 0`。输入数据由一组描述每个样本的特征或属性组成，输出是一个指示样本属于哪个类别的二值标签。\n\n### 情感数据集\n\
  \n从参考文献给出的链接下载 UCI 情感标记句子数据集。该数据集包含针对三个不同网站（`imdb.com`、`amazon.com` 和 `yelp.com`）的已标记为正面或负面情感的句子。提取电影评论文件\
  \ `imdb_labelled.txt`，我们稍将在程序中使用。文件中的前几行如表 10.2 所示：\n\n| 一部非常、非常、非常缓慢、无目的电影，讲述关于一个痛苦的、漂泊的年轻男子。\
