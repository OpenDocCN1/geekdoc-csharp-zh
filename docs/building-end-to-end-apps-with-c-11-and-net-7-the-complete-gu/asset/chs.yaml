  \n# 第 7 章：WPF 应用 (#contents.xhtml_ch07a)\n\n## 引言 (#contents.xhtml_sc2_174a)\n\n\
  在本章中，我们将从 Windows Presentation Foundation (WPF) 开始，对微软的桌面应用程序进行探索。我们将理解可以创建的不同类型的桌面应用程序，以及\
  \ WPF 在整体策略中处于什么位置。随后，我们将在创建一个端到端的真实应用程序之前，先理解 WPF 应用的基本结构。\n\n## 结构 (#contents.xhtml_sc2_175a)\n\
  \n本章包含以下主题：\n\n*   桌面应用程序\n*   WPF\n*   先决条件\n*   开始使用 WPF 应用\n    *   （默认）WPF 项目的结构\n\
  \    *   扩展默认应用程序 – 自定义披萨订单单\n    *   开发真实的 WPF 应用\n    *   创建数独伙伴 WPF 应用\n    \
  \    *   开始学习\n        *   创建数独 UI\n        *   实现 MVVM 显示数字。\n            *   什么是\
  \ Model-View-ViewModel (或 MVVM)？\n            *   实现 MVVM\n        *   显示候选数字或铅笔标记。\n\
  \        *   允许用户输入数字。\n        *   高亮错误输入。\n    *   单元测试\n*   部署\n\n## 目标 (#contents.xhtml_sc2_176a)\n\
  \n本章的目标是理解围绕 WPF 应用的概念，并在 Visual Studio 2022 中使用 `C# 11` 和 `.NET 7.0` 逐步创建一个应用。\n\
  \n## 桌面应用程序 (#contents.xhtml_sc2_177a)\n\n桌面应用程序是运行在个人计算机或笔记本电脑上的本地软件程序。与可以通过浏览器访问的基于\
  \ Web 的应用程序不同，桌面应用程序需要安装，安装后可以通过在设备上独立运行的可执行文件启动。它们也与运行在智能手机和平板设备上的移动应用程序不同。由于桌面应用程序在设备上原生运行，它们今天仍然很有意义，因为它们带来的用户体验和性能是其他应用程序类型难以取代的。有几个非常适合桌面应用程序的应用领域，例如独立业务应用（Word,\
  \ Excel, Outlook）、协作应用（Zoom, Meet）、IDE（Visual Studio, VS Code）、多媒体应用（Media Player）等。\n\
  \n微软提供了多种选项来构建仅针对 Windows 或跨平台的桌面应用：Windows、Linux 和 MacOS。下方的图 7.1 总结了今天创建桌面应用程序的流行选择：\n\
  \n![](img/Figure_7.1.png)\n\n图 7.1：桌面应用的 UI 框架选项\n\n这包括由其他公司创建的用于创建使用 `C#` 和 `.NET`\
  \ 的跨平台的 UI 框架。本章重点关注 WPF 应用。在下一章中，我们将处理 WinUI 应用，然后检查 `.NET MAUI` 的跨平台选项。\n\n##\
  \ WPF (#contents.xhtml_sc2_178a)\n\nWPF 框架首次于 2006 年。它的开发目标是提供视觉良好的桌面应用程序，作为 Windows\
  \ Forms 的替代方案。多年来，它经历了多次改进，并在 2018 年开源。WPF 使用 DirectX 并为构建应用程序提供了一致的编程模型。WPF 的高层架构如图\
  \ 7.2 所示：\n\n![](img/Figure_7.2.png)\n\n图 7.2：WPF 架构\n\nWPF 为窗口、对话框、页面和用户控件提供了声明外观模型；UI\
  \ 与对应的代码文件 `xaml.cs` 交互。XAML 提供了模板、样式和绑定等功能，适用于构建大型应用程序。Visual Studio 和 Blend for\
  \ Visual Studio 中的 XAML 设计器提供了设计界面。两者 共享一组功能，Blend 为视觉状态和创建动画提供了额外的工具。\n\n## 先决条件\
  \ (#contents.xhtml_sc2_179a)\n\n完成本章的示例需要 Visual Studio 2022 Community 版 17.4 或更高版本以及\
  \ .NET 桌面工作负载。\n\n## 开始使用 WPF 应用 (#contents.xhtml_sc2_180a)\n\n按照 Visual Studio\
  \ 2022 中的步骤创建新的 WPF 项目，下表表 7.1 所示：\n\n| 新项目创建 (文件 | 新 | 项目…) |\n| :--- | :--- |\n\
  | **1. 创建新项目** | 1. 通过选择语言：`C#`、平台：所有平台、项目类型：桌面来缩小显示的模板列表。<br>2. 选择模板：WPF <br>3.\
  \ 点击下一步 |\n| **B. 配置您的新项目** | 4. 项目名称：输入您选择的名称，例如 `FirstWpfApp`。<br>5. 位置：选择您选择的位置<br>6.\
  \ 解决方案：选择添加到解决方案或创建新解决方案<br>7. 解决方案名称：如果创建新解决方案，请提供名称。<br>8. 将解决方案和项目放在同一目录中：通常我们让解决方案高上一层，因此在创建新解决方案时请取消勾选此项。<br>9.\
  \ 点击下一步 |\n| **C. 附加信息** | 10. 框架：.NET 7.0 (标准支持)<br>11. 点击创建 |\n\n表 7.1：创建新的 WPF\
  \ 项目的步骤。\n\n\n\n\n\n可以使用 `dotnet` 命令行界面 (CLI) 使用以下命令创建新项目：\n\n```bash\ndotnet new\
  \ angular --name FirstAngularApp\n```\n\n并将新创建的项目添加到解决方案：\n\n```bash\ndotnet sln\
  \ add ./FirstAngularApp/FirstAngularApp.csproj\n```\n\n# (默认) WPF 应用程序项目的结构\n\n\
  使用内置的 WPF 应用程序模板创建新应用程序时，会创建如 表 7.2 所示的后续：\n\n| 依赖项 | 框架 |\n| :--- | :--- |\n| 默认情况下，对\
  \ `Microsoft.NETCore.App` 和 `Microsoft.WindowsDesktop.App.WPF` 有依赖 | |\n| App.xaml\
  \ 和 App.xaml.cs | 这种标记 (`.xaml`) 与后台代码 (`.xaml.cs`) 的组合是应用程序的入口点。 |\n| AssemblyInfo.cs\
  \ | 此文件包含有关程序集的信息。对于默认 WPF 应用，它指定了应用程序中所使用的主题的 XAML 资源的位置。 |\n| MainWindow.xaml\
  \ 和 MainWindow.xaml.cs | 这是主应用程序窗口的 UI 和交互逻辑的结合。 |\n\n表 7.2：WPF 应用程序项目中的重要文件\n\n\
  项目在解决方案资源管理器中的显示如下，参见 图 7.3：\n\n![](img/Figure_7.3.png)\n\n图 7.3：默认 WPF 应用中的文件\n\
  \n让我们检查某些文件的内容：\n\n### App.xaml\n\n```xml\n1.  <Application x:Class=\"FirstWpfApp.App\"\
  \n2.  xmlns=\"http://schemas.microsoft.com/winfx/2006/xaml/presentation\"\n3.  xmlns:x=\"\
  http://schemas.microsoft.com/winfx/2006/xaml\"\n4.  xmlns:local=\"clr-namespace:FirstWpfApp\"\
  \n5.  StartupUri=\"MainWindow.xaml\">\n6.  <Application.Resources>\n8.  </Application.Resources>\n\
  9.  </Application>\n```\n\n`App.xaml` 是应用程序的声明式启动点。第 5 行的 `StartupUri` 属性指示当应用程序启动时启动哪个\
  \ Window 或 Page。在这种情况下，将启动 `MainWindow.xaml`。`App.xaml` 的主要目的是持有可以在贯穿应用程序中使用的资源（样式、笔、画刷等）。\n\
  \n### App.xaml.cs\n\n```csharp\n1.  using System.Windows;\n3.  namespace FirstWpfApp;\n\
  4.  /// <summary>\n5.  /// App.xaml 的交互逻辑\n6.  /// </summary>\n7.  public partial\
  \ class App : Application\n8.  {\n9.}\n```\n\n前面的代码声明了后台代码 `App` 部分类，它扩展了 `Application`\
  \ 类。它可以在实例化窗口或页面之前包含启动指令。\n\n### MainWindow.xaml\n\n```xml\n1.  <Window x:Class=\"\
  FirstWpfApp.MainWindow\"\n2.  xmlns=\"http://schemas.microsoft.com/winfx/2006/xaml/presentation\"\
  \n3.  xmlns:x=\"http://schemas.microsoft.com/winfx/2006/xaml\"\n4.  xmlns:d=\"http://schemas.microsoft.com/expression/blend/2008\"\
  \n5.  xmlns:mc=\"http://schemas.openxmlformats.org/markup-compatibility/2006\"\n\
  6.  xmlns:local=\"clr-namespace:FirstWpfApp\"\n7.  mc:Ignorable=\"d\"\n8.  Title=\"\
  MainWindow\" Height=\"450\" Width=\"800\">\n9.  <Grid>\n11.  </Grid>\n12.  </Window>\n\
  ```\n\n在前面的 XAML 标记中，文档根 `Window` 代表由 XAML 文件所描述的对象的类型。`Window` 组件与 `x:Class` 属性中指定的后台类绑定。在第\
  \ 2 行和第 5 行之间，XML 构造 `xmlns`（带有 `x`、`d`、`mc` 等限定符）定义了用于解析 XML 元素的命名空间。未定义限定符的主 `xmlns`\
  \ 命名空间定义了解析 XML 元素名的默认命名空间。第 6 行的 `xmlns:local` 命名空间声明了本地前缀，并映射到项目在 Names 代码命名空间中声明的对象。第\
  \ 7 行将 `d:` 前缀标记为设计时使用的属性，这些属性在标准程序编译后会被忽略。。在第 8 行，设置了窗口的标题以及默认的高度和宽度。\n\n### MainWindow.xaml.cs\n\
  \n```csharp\n1.  using System.Windows;\n3.  namespace FirstWpfApp;\n4.  /// <summary>\n\
  5.  /// MainWindow.xaml 的交互逻辑\n6.  /// </summary>\n7.  public partial class MainWindow\
  \ : Window\n8.  {\n9.  public MainWindow()\n10.  {\n11.  InitializeComponent();\n\
  12.  }\n13.}\n```\n\n作为 `MainWindow` `Window` 元素的后台代码类，它必须继承自 `Window` 类（第 7 行）。从构造函数中调用\
  \ `InitializeComponent()` 以将标记中定义的 UI 与后台代码类合并。XAML 文件中的 `x:Class` 与 `InitializeComponent()`\
  \ 的组合确保了每当它被创建时，你的实现都能被正确初始化。如果我们查看 `InitializeComponent()` 的定义，可以看到以下自动生成的代码：\n\
  \n```csharp\n1.  /// <summary>\n2.  InitializeComponent\n3.  /// </summary>\n4.\
  \  [System.Diagnostics.DebuggerNonUserCode(\"PresentationTasks\", \"7.0\")]\n5.\
  \  public void InitializeComponent()\n6.  {\n7.  if (_contentLoaded)\n8.  return;\n\
  9.  }\n10. _contentLoaded = true;\n11. System.Windows.Uri resourceater = new System.Uri(\"\
  /MainWindow.xaml\", System.UriKind.Relative);\n12. System.Windows.Application.LoadComponent(this,\
  \ resourceater);\n13.\n```\n\n如第 11 行所示，`Windows` 是通过读取 XAML 加载的。\n\n### FirstWpfApp.csproj\n\
  \n```xml\n1.  <Project Sdk=\"Microsoft.NET.Sdk\">\n2.  <PropertyGroup>\n3.  <OutputType>WinExe</OutputType>\n\
  4.  <TargetFramework>net7.0-windows</TargetFramework>\n5.  <Nullable>enable</Nullable>\n\
  6.  <UseWPF>true</UseWPF>\n7.  </PropertyGroup>\n8. </Project>\n```\n\n前面的项目文件采用最新的格式。`WinExe`\
  \ 选项导致编译器创建一个可执行文件。由于 WPF 仅支持 Windows，目标框架 (TFM) 为 `net7.0-windows`。`UseWPF` 设置为\
  \ true。\n\n# 订单表 (#contents.22a)\n\n为了理解控件和布局，我们将通过添加一个简单的订单表来扩展 `FirstWpfApp`，完成后将如\
  \ 图 7.4 所示：\n\n![](img/Figure_7.4.png)\n\n图 7.4：完成的订单表\n\n向当前项目添加名为 `CustomOrder.xaml`\
  \ 的新 WPF Window。默认情况下，WPF Window 使用 `Grid` 布局控件，它定义了行和列并将控件放在单元格中。为了创建订单表，我们需要两列和八行。让我们在\
  \ XAML 编辑器中添加以下内容。按照高亮代码更改窗口标题以及启动的高度和宽度：\n\n```xml\n1.  <Window x:Class=\"FirstWpfApp.CustomOrder\"\
  \n2.  xmlns=\"http://schemas.microsoft.com/winfx/2006/xaml/presentation\"\n3.  xmlns:x=\"\
  http://schemas.microsoft.com/winfx/2006/xaml\"\n4.  xmlns:d=\"http://schemas.microsoft.com/expression/blend/2008\"\
  \n5.  xmlns:mc=\"http://schemas.openxmlformats.org/markup-compatibility/2006\"\n\
  6.  xmlns:local=\"clr-namespace:FirstWpfApp\"\n7.  mc:Ignorable=\"d\"\n8.  Title=\"\
  Custom Pizza Order\" Height=\"340\" Width=\"330\">\n9.  <Grid ShowGridLines=\"True\"\
  >\n10.  <Grid.ColumnDefinitions>\n11.  <ColumnDefinition />\n12.  <ColumnDefinition\
  \ />\n13.  </Grid.ColumnDefinitions>\n14.  <Grid.RowDefinitions>\n15.  <RowDefinition\
  \ />\n16.  <RowDefinition />\n17.  <RowDefinition />\n18.  <RowDefinition />\n19.\
  \  <RowDefinition />\n20.  <RowDefinition />\n21.  <RowDefinition />\n22.  <RowDefinition\
  \ />\n23.  </Grid.RowDefinitions>\n24.  </Grid>\n25.  </Window>\n```\n\n由于第 9 行\
  \ `Grid` 上的 `ShowGridLines` 属性被设置为 true，行和列在 XAML 设计器中显示所示。请参考如下给出的 图 7.5：\n\n![](img/Figure_7.5.png)\n\
  \n\n\n\n\n# 图 7.5：自定义比萨订单表单中的初始行和列\n\n现在我们将逐行向每一行添加控件。在 WPF 中，有两种方法可以在窗口上布局控件。在**绝对定位**中，我们指定子元素在父容器内的精确位置；而在**动态定位**中，我们只需要指定它们应该如何排列以及相对于父元素应该如何换行。在绝对定位模式下，当父元素调整大同时，子元素不会移动；但在动态布局中，子控件会相对于父元素发生移动。对于大多数情况，动态布局是更灵活且首选的方法。动态布局允许内容适应不同的屏幕尺寸、本地化和其他内容变化。绝对布局则留给那些元素位置需要精确且不变的场景。因此，我们几乎从不从\
  \ `Toolbox`（工具箱）将控件拖放到 `XAML` 设计器中，而是直接在 `XAML` 代码中进行编辑，或者通过属性窗口更改属性。\n\n按照如下方式在\
  \ `</Grid.RowDefinitions>` 结束标签下方添加 `Label` 和 `TextBox` 对：\n\n```xml\n<!-- 姓名字段\
  \ -->\n<Label Grid.Row=\"0\" Grid.Column=\"0\" Content=\"Your Name: \" />\n<TextBox\
  \ x:Name=\"Name\" Grid.Row=\"0\" Grid.Column=\"1\"\nMargin=\"5\" Background=\"LightYellow\"\
  \ VerticalContentAlignment=\"Center\" />\n```\n\n这样之后，`Label` 将出现在第一个单元格中，`TextBox`\
  \ 将出现在相邻的单元格中，如下图 7.6 所示：\n\n![](img/Figure_7.6.png)\n\n图 7.6：在第一行添加姓名字段\n\n为了给第二列留更多空间，我们将通过将第一列的宽度设置为\
  \ `Auto` 来将其缩小到标签的宽度。我们还将在 `Window.Resources` 标签中添加应用于 `Grid` 和 `Label` 的样式，如高亮代码段所示：\n\
  \n```xml\nmc:Ignorable=\"d\"\nTitle=\"Custom Pizza Order\" Height=\"340\" Width=\"\
  330\">\n<Window.Resources>\n  <Style TargetType=\"Grid\">\n    <Setter Property=\"\
  ShowGridLines\" Value=\"True\"/>\n    <Setter Property=\"Margin\" Value=\"5\"/>\n\
  \    <Setter Property=\"Background\" Value=\"LightSteelBlue\" />\n  </Style>\n \
  \ <Style TargetType=\"Label\">\n    <Setter Property=\"Background\" Value=\"LightGray\"\
  \ />\n    <Setter Property=\"Margin\" Value=\"5\"/>\n    <Setter Property=\"HorizontalContentAlignment\"\
  \ Value=\"Right\"/>\n    <Setter Property=\"VerticalContentAlignment\" Value=\"\
  Center\"/>\n  </Style>\n</Window.Resources>\n<Grid>\n  <Grid.ColumnDefinitions>\n\
  \    <ColumnDefinition Width=\"Auto\" />\n    <ColumnDefinition />\n  </Grid.ColumnDefinitions>\n\
  \  <Grid.RowDefinitions>\n  …\n```\n\n`Style` 标签定义了所有 `Grid` 和 `Label` 控件的外观，第 19\
  \ 行将列宽设置为 `Auto`。如果不显式设置，宽度将被设置为 `*`，这意味着可用宽度将平均分配在各列或各行之间。这使得表单看起来如图 7.7 所示：\n\n\
  ![](img/Figure_7.7.png)\n\n图 7.7：调整列并应用样式\n\n接下来，我们将添加带有 `RadioButton`（单选按钮）选项的\
  \ `Size` 字段。在姓名字段添加以下代码：\n\n```xml\n<!-- 尺寸字段 -->\n<Label Grid.Row=\"1\" Grid.Column=\"\
  0\" Content=\"Size: \" />\n<Grid Grid.Row=\"1\" Grid.Column=\"1\" VerticalAlignment=\"\
  Center\">\n  <Grid.ColumnDefinitions>\n    <ColumnDefinition Width=\"Auto\"/>\n\
  \    <ColumnDefinition/>\n    <ColumnDefinition Width=\"Auto\"/>\n  </Grid.ColumnDefinitions>\n\
  \  <RadioButton x:Name=\"SizeRegular\" Grid.Column=\"0\" Content=\"Regular\" />\n\
  \  <RadioButton x:Name=\"SizeMedium\" Grid.Column=\"1\" HorizontalAlignment=\"Center\"\
  \ Content=\"Medium\" />\n  <RadioButton x:Name=\"SizeLarge\" Grid.Column=\"2\" Content=\"\
  Large\" />\n</Grid>\n```\n\n三个单选按钮被添加到父级 `Grid` 的第一行第一列的 `Grid` 中（第 3 行）。这样做是为了让三个单选按钮水平对齐，而不是默认的垂直布局。经过此更改后，表单呈现如图\
  \ 7.8 所示：\n\n![](img/Figure_7.8.png)\n\n图 7.8：添加了尺寸单选按钮\n\n接下来，添加以下代码引入 `Crust`（饼底）下拉框：\n\
  \n```xml\n<!-- 饼底字段 -->\n<Label Grid.Row=\"2\" Grid.Column=\"0\" Content=\"Crust:\
  \ \" />\n<ComboBox x:Name=\"Crust\" Grid.Row=\"2\" Grid.Column=\"1\"\nVerticalContentAlignment=\"\
  Center\" Margin=\"5\" Background=\"LightYellow\">\n  <ComboBoxItem IsSelected=\"\
  True\">-- Select --</ComboBoxItem>\n  <ComboBoxItem>New Hand Tossed</ComboBoxItem>\n\
  \  <ComboBoxItem>Wheat Thin Crust</ComboBoxItem>\n  <ComboBoxItem>Cheese</ComboBoxItem>\n\
  \  <ComboBoxItem>Fresh Pan</ComboBoxItem>\n</ComboBox>\n```\n\n通过前面的代码，我们添加了一个带有不同选项的\
  \ `ComboBox`。UI 呈现如图 7.9 所示：\n\n![](img/Figure_7.9.png)\n\n图 7.9：添加了饼底框\n\n接下来，我们将查看\
  \ `ComboBox` 的运行效果。多选下拉框可以运行，选中选项显示在 `text` 属性中。注意窗口标题处的调试栏，这只有在从 `Visual Studio`\
  \ 执行时才会出现。\n\n要填充 `Toppings` 列表，请在后台文件 `CustomOrder.cs` 中添加以下内容：\n\n```csharp\n\
  public CustomOrder()\n{\n  InitializeComponent();\n  Toppings.ItemsSource = new\
