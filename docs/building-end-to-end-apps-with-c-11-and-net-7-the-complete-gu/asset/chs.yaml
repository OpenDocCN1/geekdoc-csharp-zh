  \n# 第 8 章 WinUI 3 (#contents.xhtml_ch08a)\n\n## 引言 (#contents.xhtml_sc2_199a)\n\n\
  在上一章中，我们通过 Windows Presentation Foundation (WPF) 开始了对微软桌面应用的探索。在本章中，我们将重点关注使用 Windows\
  \ UI 库 (WinUI) 3 为 Windows 10 和 Windows 11 开发原生 Windows 应用。我们将理解该领域的技术演进及其相关概念，然后使用\
  \ WinUI 创建一个真实的应用程序。\n\n## 结构 (#contents.xhtml_sc2_200a)\n\n本章包含以下主题：\n\n*   WinUI\
  \ 3\n*   先决条件\n*   开始使用 WinUI 3 应用\n    *   （默认）WinUI 3 项目的结构\n*   开发真实的 WinUI 应用\n\
  \    *   创建图像导航器 WinUI 应用\n        *   快速上手\n        *   在主窗口中添加文件夹浏览功能\n      \
  \  *   创建 Image View Model 类\n        *   创建图像列表页\n        *   创建图像详情页\n*   单元测试\n\
  *   部署\n\n## 目标 (#contents.xhtml_sc2_201a)\n\n本章的目标是理解 WinUI 应用的相关概念，并学习如何在 Visual\
  \ Studio 2022 中使用 C# 11 和 .NET 7.0 逐步创建此类应用程序。\n\n## WinUI 3 (#contents.xhtml_sc2_202a)\n\
  \nWindows UI (WinUI) 库是一个用于 Windows 桌面和通用 Windows 平台 (UWP) 应用的原生用户体验 (UX) 框架。它为现代硬件和设备构建，提供了最新的\
  \ Fluent 设计系统（Fluent Design System），通过最新的用户界面（UI）模式提供一致、直观且无障碍的体验。它可以从零开始为现代 Windows\
  \ 设备构建丰富的 .NET 和 C++ 应用，也可以使用 C++、C#、Visual Basic 和 JavaScript 等熟悉语言逐步迁移现有的 MFC、WinForms\
  \ 或 WPF 应用。它为 Windows 10 和 11 PC、Xbox One、HoloLens、Surface Hub 以及 .NET MAUI 和 React\
  \ Native for Windows 等许多平台的操作系统环境和核心体验提供支持。参考下图：\n\n![](img/Figure_8.1.png)\n\n\
  图 8.1：WinUI 3 概念概述 1\n\n* * *\n\n1 来源：[`blogs.windows.com/windowsdeveloper/2019/11/04/developer-platform-updates-at-microsoft-ignite-2019/`](https://blogs.windows.com/windowsdeveloper/2019/11/04/developer-platform-updates-at-microsoft-ignite-2019/)\n\
  \nWinUI 3 是 Windows 中原生 UX 栈最新的第三代。它将以前构建在 Windows 中的 UX 技术整合到一个单一的解耦框架，并作为 Windows\
  \ App SDK 的发布。Windows App SDK 提供了一套统一的 API 和工具用于开发丰富且吸引人的 Windows 桌面应用。Windows App\
  \ SDK 的最新版本 1.3（此前称为 Project Reunion）为向 Microsoft Store 发布生产级桌面应用打开了大门。\n\nWinUI\
  \ 2 是为 UWP 应用构建的上一代 Windows 原生 UX 栈。它由 XAML 框架和基于 Fluent 的控件样式库组成。\n\n## 先决条件 (#contents.xhtml_sc2_203a)\n\
  \n使用 Windows App SDK 开发 C# 应用需要 Visual Studio 2022 社区版 17.4 或更高版本，以及 .NET 桌面开发负载。此外，在安装对话框的“安装详细信息”窗中，选择\
  \ Windows App SDK C# 模板（列表底部）。\n\n在安装对话框的“单个组件”选项卡中，在“SDK、库和框架”部分，确保选择了 Windows\
  \ 10 SDK (10.0.19041.0 或更高版本)。\n\n安装适用于 VS 2022 的扩展 `Single-project MSIX Packaging\
  \ Tools` 以无缝执行本章中构建的项目。可选地，安装扩展 `Template Studio for WinUI (C#)` 以创建新的[项目]。\n\n\
  如果你已经安装了 Visual Studio 2022，执行以下命令将打开带有缺失负载的安装程序：\n\n```\nwinget install \"Visual\
  \ Studio Community 2022\" --add Microsoft.Workload.Desktop\n```\n\n## 开始使用 WinUI\
  \ 3 (#contents.xhtml_sc2_204a)\n\n按照以下步骤创建一个 WinUI 3 项目：\n\n| 步骤 | 操作 |\n| :---\
  \ | :--- |\n| 1 | 新项目：语言 C#，平台：所有平台 |\n| 2 | 选择模板：`Blank App, Packaged (WinUI 3\
  \ in Desktop)` |\n| 3 | 点击下一步 |\n| 4 | 项目名称：输入 `FirstUIApp` |\n| 5 | 位置：选择位置 |\n\
  | 6 | 解决方案：选择添加到解决方案 |\n| 7 | 解决方案名称：提供名称 |\n| 8 | 将解决方案和项目放在同一目录：取消勾选 |\n| 9 |\
  \ 点击创建 |\n\n表 8.1：创建 WinUI 应用的步骤。与其他项目类型不同，WinUI 项目尚不支持命令行界面 (CLI) 构建。\n\n## （默认）WinUI\
  \ 3 项目的结构 (#contents.xhtml_sc3_205a)\n\n使用内置的 `Blank App, Packaged (WinUI 3 in Desktop)`\
