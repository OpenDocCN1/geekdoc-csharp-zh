  \n图 6.17：书籍 骨架列表页\n\n在接下来的章节中，我们将逐一构建 CRUD 功能。\n\n### 书籍列表页\n\n使用以下代码更新 `book.ts`\
  \ 模型类。\n\n```typescript\nexport class Book {\n  id!: number;\n  title!: string;\n\
