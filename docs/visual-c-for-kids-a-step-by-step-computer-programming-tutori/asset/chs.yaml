  \n![Image](img/0029.jpeg)\n\n完成后，我的表单看起来如下：\n\n![Image](img/0029.jpeg)\n\n# 事件编写\n\
  \n编写卡牌的事件，洗牌的逻辑非常简单。点击 `New Game` 按钮开始新游戏（`Text` 为 `Next Card`），重置分数。在 `New Game`\
  \ 事件的步骤如下：\n\n* 隐藏“游戏结束”提示\n* 设置按钮标签为 `Next Card`\n* 将分数重置为 0\n* 洗牌\n* 初始化 `cardIndex`\
  \ 为 0\n* 显示玩家的卡牌\n\n在 `Next Card` 事件的步骤如下：\n\n* 显示两张卡牌\n* 比较卡牌并更新分数\n* 增加 `cardIndex`\n\
  * 如果没有卡牌了，显示“游戏结束”提示并更改按钮标签。否则，等待点击 `Next Card`。\n\n在已经知道如何洗牌的情况下，这些步骤中比较难的部分是显示和比较卡牌。让我们详细查看。\n\
  \n显示卡牌涉及回答两个问题：花色是什么？点数是多少？四种花色是红心、方片、梅花和桃黑。十三种数值从低到高为：2、3、4、5、6、7、8、9、10、将 (J)、后\
  \ (Q)、王 (K)、王 (A)。我们在洗牌程序中看到，牌号的范围是 0 到 51。我们如何将这个牌号转换为花色和点数？（注意牌号和点数之间的区别——牌号为\
  \ 0 到 51，点数仅为 2 到 A。）我们需要开发某种转换规则。这在编程中非常常见。如果你计算或处理的数字没有直接对应你需要的信息，你需要制定规则来进行转换。\n\
  \n我们每种花色需要 13 张牌。因此，一种决定花色的简单规则是：编号 0-12 的牌是红心，13-25 的牌是方片，26-38 的牌是梅花，39-51 的牌是桃黑。花色通过两个图片框显示在显示的卡牌上：`cardNumber`\
  \ 数组（0-25）表示花色。对于点数，较低数字应该代表较低的牌。一种适用于每种花色中每个数字的规则如下：\n\n```csharp\nint[] cardNumber\
  \ = new int[52];\nint cardIndex;\n```\n\n\n\n\n\n# 卡牌编号\n\n| 红心 | 方块 | 梅花 | 黑桃 |\
  \ 卡牌值 |\n| :--- | :--- | :--- | :--- | :--- |\n| 0 | 13 | 26 | 39 | 二 (Two) |\n\
  | 1 | 14 | 27 | 40 | 三 (Three) |\n| 2 | 15 | 28 | 41 | 四 (Four) |\n| 3 | 16 | 29\
  \ | 42 | 五 (Five) |\n| 4 | 17 | 30 | 43 | 六 (Six) |\n| 5 | 18 | 31 | 44 | 七 (Seven)\
  \ |\n| 6 | 19 | 32 | 45 | 八 (Eight) |\n| 7 | 20 | 33 | 46 | 九 (Nine) |\n| 8 | 21\
  \ | 34 | 47 | 十 (Ten) |\n| 9 | 22 | 35 | 48 | 将 (Jack) |\n| 10 | 23 | 36 | 49 |\
  \ 后的 (Queen) |\n| 11 | 24 | 37 | 50 | 王 (King) |\n| 12 | 25 | 38 | 51 |get (Ace)\
  \ |\n\n例如，请注意编号 22 的牌是一张 `Diamonds` 中的 `Jack`。编号 30 的牌是一张 `Clubs` 中的 `6`。卡牌值显示在\
  \ `lblPlayer` 和 `lblComputer` 标签控件中。现在我们可以显示卡牌了。我们如何比较它们呢？\n\n卡牌比较必须基于数值，而不是显示的卡牌值——虽然检查\
  \ `K` 是否大于 `7` 很有困难，但可以做到。因此，还需要最后一条规则将卡牌值与数值联系起来。这是一个非常简单的规则——从数值为 `0`（最低）的 `2`\
  \ 开始递增，`Ace` (`A`）的数值为 `12`（最高）。这使得数值卡牌比较变得简单。注意红心卡牌的编号已经从 `0` 到 `12`。如果我们从方块编号减去\
  \ `13`，从梅花编号减去 `26`，从黑桃编号减去 `39`，这些卡牌编号的范围都是 `0` 到 `12`。这为比较卡牌提供了一个共同的基础。这一切看起来可能很复杂，但看看\
  \ C# 代码就会发现其实并不复杂。\n\n## C# 实现\n\n实现 `btnNew_Click` 事件方法的 C# 代码如下：\n\n```csharp\n\
  private void btnNew_Click(object sender, EventArgs e)\n{\n    // 方法级变量\n    Random\
  \ myRandom = new Random();\n    int yourNumber = 0; // 你的卡牌编号\n    int computerNumber\
  \ = 0; // 电脑卡牌编号\n\n    if (btnNew.Text == \"New Game\")\n    {\n        // 点击了新游戏\n\
  \        txtOver.Visible = false;\n        btnNew.Text = \"Next Card\";\n      \
  \  btnExit.Text = \"Stop\";\n        // 分数零\n        txtYouScore.Text = \"0\";\n\
  \        txtCompScore.Text = \"0\";\n\n        // 使用单牌洗牌代码洗牌\n        // 初始化 CardNumbers\n\
  \        for (int loopCounter = 0; loopCounter < 52; loopCounter++)\n        {\n\
  \            cardNumber[loopCounter] = loopCounter;\n        }\n\n        // 处理剩余值\n\
  \        // 从 52 开始，在每个 for 循环步骤\n        // 交换一个值\n        // 每一步之后，remaining 减\
  \ 1\n        for (int remaining = 52; remaining >= 1; remaining--)\n        {\n\
  \            // 随机挑选项目\n            int itemPicked = myRandom.Next(remaining);\n\
  \            // 将选取的项目与底部项目交换\n            int tempValue = cardNumber[itemPicked];\n\
  \            cardNumber[itemPicked] = cardNumber[remaining - 1];\n            cardNumber[remaining\
  \ - 1] = tempValue;\n        }\n        // 将 CardIndex 设置为零\n        cardIndex =\
  \ 0;\n    }\n\n    // 显示卡牌\n    // 显示你的卡牌的花色\n    // 确定你的卡牌用于比较的编号\n    if (cardNumber[cardIndex]\
  \ >= 0 && cardNumber[cardIndex] <= 12)\n    {\n        picPlayer.Image = picHeart.Image;\n\
  \        yourNumber = cardNumber[cardIndex];\n    }\n    else if (cardNumber[cardIndex]\
  \ >= 13 && cardNumber[cardIndex] <= 25)\n    {\n        picPlayer.Image = picDiamond.Image;\n\
  \        yourNumber = cardNumber[cardIndex] - 13;\n    }\n    else if (cardNumber[cardIndex]\
  \ >= 26 && cardNumber[cardIndex] <= 38)\n    {\n        picPlayer.Image = picClub.Image;\n\
  \        yourNumber = cardNumber[cardIndex] - 26;\n    }\n    else if (cardNumber[cardIndex]\
  \ >= 39 && cardNumber[cardIndex] <= 51)\n    {\n        picPlayer.Image = picSpade.Image;\n\
  \        yourNumber = cardNumber[cardIndex] - 39;\n    }\n\n    // 显示你的卡牌值\n   \
  \ switch (yourNumber)\n    {\n        case 9:\n            lblPlayer.Text = \"J\"\
  ;\n            break;\n        case 10:\n            lblPlayer.Text = \"Q\";\n \
  \           break;\n        case 11:\n            lblPlayer.Text = \"K\";\n    \
  \        break;\n        case 12:\n            lblPlayer.Text = \"A\";\n       \
  \     break;\n        default:\n            lblPlayer.Text = Convert.ToString(yourNumber\
  \ + 2) + \" \";\n            break;\n    }\n\n    // 显示电脑的卡牌花色\n    // 确定电脑用于比较的编号\n\
  \    if (cardNumber[cardIndex + 26] >= 0 && cardNumber[cardIndex + 26] <= 12)\n\
  \    {\n        picComputer.Image = picHeart.Image;\n        computerNumber = cardNumber[cardIndex\
  \ + 26];\n    }\n    else if (cardNumber[cardIndex + 26] >= 13 && cardNumber[cardIndex\
  \ + 26] <= 25)\n    {\n        picComputer.Image = picDiamond.Image;\n        computerNumber\
  \ = cardNumber[cardIndex + 26] - 13;\n    }\n    else if (cardNumber[cardIndex +\
  \ 26] >= 26 && cardNumber[cardIndex + 26] <= 38)\n    {\n        picComputer.Image\
  \ = picClub.Image;\n        computerNumber = cardNumber[cardIndex + 26] - 26;\n\
  \    }\n    else if (cardNumber[cardIndex + 26] >= 39 && cardNumber[cardIndex +\
  \ 26] <= 51)\n    {\n        picComputer.Image = picSpade.Image;\n        computerNumber\
  \ = cardNumber[cardIndex + 26] - 39;\n    }\n}\n```\n\n\n\n在“卡牌大作战”（Card Wars）中，我们在过完一遍牌组后就会停止游戏。在真实的“战争”（War）卡牌游戏中，第一轮结束后，玩家会拿起赢得的牌，重新洗牌，然后进行另一轮。每当玩家用完“手牌”中的所有牌时，他们会再次拿起获胜堆，重新洗牌并继续游戏。这种情况会一直持续直到一个玩家失去所有的牌。卡牌大作战的另一个变化是编写代码来按照这些规则玩游戏。正如我们所说，这并不容易。你需要添加代码来跟踪每个玩家赢了哪些卡牌、他们何时没有牌可以出、如何重新洗牌剩余卡牌，以及判断游戏何时结束的新逻辑。此类代码将使用更多的数组、更多的\
  \ `for` 循环和更多的变量。如果你想接受编程挑战，尽管尝试吧！\n\n而且，在你应对挑战时，这里还有另一个。在通常的“战争”游戏中，当两张牌的数值相同时——宣布进入“战争”！这意味着每个玩家从“手牌”中取出三张牌并朝下放下。然后放另一张牌朝上。这时较高的牌赢得所有\
  \ 10 张牌！如果仍然平局，则再次进行“战争”。尝试将此逻辑加入游戏。你可能需要更改显示器以容纳更多的牌。你需要弄清楚如何在 `C#` 中将牌“朝下放下”。你需要检查玩家是否有足够的牌来发动“战争”。这是另一个困难的任务，但如果你觉得很有趣就尝试一下。\n\
  \n![Image](img/00014.jpeg)\n\n## 总结\n\n本课程介绍了迄今为止最具挑战性的项目之一。涉及洗牌和显示卡牌的代码虽然简单，但相当复杂。面板（panel）和画框框（picture\
  \ box）控件有助于显示。数组和 `for` 循环的使用使得编码变得简单了一些。如果你完全理解了“卡牌大作战”项目，那么你已经在通往优秀 Visual C#\
  \ 程序员的道路上了。现在，进入最后一节课。\n\n# 10\n\n## 定器、动画、键盘事件\n\n![Image](img/00145.jpeg)\n\n\
  ## 复习与预览\n\n这是最后一节课了。到目前，你应该对自己作为 Visual C# 程序员的能力有一定的信心。在这节课中，我们将查看另一个非常有趣的控件——定时器控件（timer\
  \ control）。\n\n它是为项目图形添加动画（运动）的关键控件。我们将学习一些动画技术，并检查如何通过键盘事件识别用户的键盘输入。然后，你将构建最后一个项目（至少是本课最后一个项目）——你的第一个视频游戏！\n\
  \n![Image](img/00107.jpeg)\n\n## 定时器控件\n\nVisual C# 定时器控件有一个特性。它是唯一不需要用户任何输入即可生成事件的控件。定时器控件在项目的后台运行，按照你指定的时间间隔生成事件。这种事件生成功能对于图形动画非常有用，因为屏幕显示需要定期更新。从工具箱中选择定时器控件。它的显示形式如下：\n\
  \n### 在工具箱中：\n\n![Image](img/00125.jpeg)\n\n### 表单下方（默认属性）：\n\n![Image](img/00187.jpeg)\n\
  \n定时器控件没有用户界面（没有任何可以点击或查看的内容），因此它不会出现在表单上。此类控件放置在设计窗口中表单下方的“区域区域”。\n\n### 属性\n\n\
  定时器控件的属性有：\n\n| 属性 | 说明 |\n| :--- | :--- |\n| `Name` | 用于标识定时器控件的名称。定时器名称的三字母前缀为\
  \ `tim`。 |\n| `Interval` | 定时器事件之间的毫秒数。一秒等于 1000 毫秒。 |\n| `Enabled` | 用于开启和关闭定时器控件。设置为\
  \ `True` 时，定时器继续生成事件，直到设置为 `False`。 |\n\n## 事件\n\n定时器控件有一个事件：\n\n| 事件 | 说明 |\n|\
  \ :--- | :--- |\n| `Tick` | 当定时器控件的 `Enabled` 属性为 `True` 时，每隔 `Interval` 毫秒执行一次事件方法。\
  \ |\n\n## 示例\n\n几个示例可以解释定时器控件的工作原理。它非常简单且强大。发生的情况如下：如果定时器控件的 `Enabled` 属性为 `True`（定时器开启），每隔\
  \ `Interval` 毫秒，Visual C# 将生成一个事件并执行对应的 `Tick` 事件方法。不需要用户交互。如果你的定时器命名为 `timExample`，则\
  \ `Timer` 事件方法的格式如下：\n\n```csharp\nprivate void timExample_Tick(object sender, EventArgs\
  \ e)\n{\n    [每隔 Interval 毫秒执行一次的 C# 代码]\n}\n```\n\n任何你想执行的 C# 代码都放在这个方法中。\n\n`Interval`\
  \ 属性是定时器控件最重要的属性。该属性被设置为定时器事件之间的毫秒数。1 毫秒是秒的 1/1000，或者一秒有 1000 毫秒。如果你想每秒生成 `N` 个事件，将\
  \ `Interval` 设置为 `1000 / N`。例如，如果你希望定时器事件每秒发生 4 次，将 `Interval` 设置为 `250`。`Interval`\
  \ 的最低可用值约为 50，相差 5、10 甚至 20 的值可能会产生相似的结果。这完全取决于你的特定计算机。\n\n另一个需要关注的属性是 `Enabled`\
  \ 属性。它用于开启或关闭定时器。\n\n\n\n如果我们想让计算机每秒响一次，但想让表单颜色每秒改变四次怎么办？如果事件需要不同的间隔，每个事件都需要自己的定时器。为表单添加另一个定时器控件（默认名称\
  \ `timer2`）。我们将使用此定时器来控制表单颜色。将 `timer2` 的 `Interval` 设置为 `250`（`Tick` 事件每 0.25 秒执行一次，即每秒改变\
  \ 4 次颜色）。将 `timer1_Tick` 中设置颜色的代码剪剪并粘贴到 `timer2_Tick` 事件中。两个定时器的 Tick 事件如下：\n\n\
  ```csharp\nprivate void timer1_Tick(object sender, EventArgs e)\n{\n    System.Media.SystemSounds.Beep.Play();\n\
  }\n\nprivate void timer2_Tick(object sender, EventArgs e)\n{\n    Random myRandom\
  \ = new Random();\n    this.BackColor = Color.FromArgb(myRandom.Next(256), myRandom.Next(256),\
  \ myRandom.Next(256));\n}\n```\n\n我们还需要在 `button1_Click` 事件中添加代码来切换（开启和关闭）这个新定时器。我们可以在那里复制并粘贴用于\
  \ `timer1` 的五行代码，并将所有的 `timer1` 单词改为 `timer2`。这确实行得通。但是，让我给你们展示一种切换布尔（`bool` 类型）变量的快速方法，例如\
  \ `Enabled` 属性。我们将用一行代码替换五行代码！\n\n![Image](img/00321.jpeg)\n\n## 非运算符\n\n早在上小学 6\
  \ 年级时，我们就学习了逻辑运算符——即与布尔变量一起工作的运算符。还记得逻辑与 (`&&`) 吗？还记得逻辑或 (`||`) 吗？嗯，还有另一个非常有用的逻辑运算符——非运算符，用感叹号（`!`）表示……此运算符作用于单个布尔变量。如果我们有一个命名为\
  \ `x` 的布尔变量（`bool` 类型），它可以有两个值：`true` 或 `false`。`!x` 的值与 `x` 相反，如这个简单的逻辑表所示：\n\n\
  ![Image](img/00050.jpeg)\n\n注意，非运算符会切换布尔变量 `x`。如果 `x` 是开启（`true`），非运算符会将 `x` 关闭（`false`）。如果\
  \ `x` 是关闭（`false`），非运算符会将 `x` 开启（`true`）。因此，我们可以使用非运算符来开启和关闭定时器控件。在我们的示例的 `button1_Click`\
  \ 事件方法中使用这段代码：\n\n```csharp\nprivate void button1_Click(object sender, EventArgs\
  \ e)\n{\n    timer1.Enabled = !(timer1.Enabled);\n    timer2.Enabled = !(timer2.Enabled);\n\
  }\n```\n\n注意非运算符如何简化了定时器控件的使用。你是否看到这的一行使用非运算符的 C# 代码的效果与我们之前用于切换定时器的五行代码完全相同？运行项目。点击按钮。你看到这两个定时器事件是如何相互作用的了吗？每当屏幕颜色改变四次，你就会听到一声哔声。玩完后停止项目。\n\
  \n### 闪烁图形\n\n让我们用定时器做一些更酷炫的东西。创建一个新项目。添加一个面板控件（默认名称 `panel1`）。让面板足够大一些——让它的宽度大于高度。添加一个按钮（默认名称\
  \ `button1`）以及一个定时器控件（默认名称 `timer1`）。将定时器控件的 `Interval` 属性设置为 `50`。在通用声明区域声明并初始化\
  \ `int` 类型变量 `delta`：\n\n```csharp\nint delta = 0;\n```\n\n在 `Button1_Click` 事件中切换定时器：\n\
  \n```csharp\nprivate void button1_Click(object sender, EventArgs e)\n{\n    timer1.Enabled\
  \ = !(timer1.Enabled);\n}\n```\n\n将此代码放入 `Timer1_Tick` 事件中：\n\n```csharp\nprivate\
  \ void timer1_Tick(object sender, EventArgs e)\n{\n    Graphics myGraphics;\n  \
  \  Pen myPen;\n    Random myRandom = new Random();\n    myGraphics = panel1.CreateGraphics();\n\
  \    myPen = new Pen(Color.FromArgb(myRandom.Next(256), myRandom.Next(256), myRandom.Next(256)),\
  \ 2);\n    myGraphics.DrawEllipse(myPen, delta, delta, panel1.Width - 2 * delta,\
  \ panel1.Height - 2 * delta);\n    delta = delta + (int) myPen.Width;\n    if (delta\
  \ > panel1.Height / 2)\n    {\n        delta = 0;\n        myGraphics.Clear(panel1.BackColor);\n\
  \    }\n    myPen.Dispose();\n    myGraphics.Dispose();\n}\n```\n\n你应该能识别这里的大部分内容。我们创建了一个图形对象和一个笔对象（带有随机颜色）来绘制图形。注意，我们使用了一个之前没见过的图形方法\
  \ (`DrawEllipse`)。你应该能够理解它，并且你会看到它在这个示例中产生了非常漂亮的效果。`DrawEllipse` 方法的形式如下：\n\n```csharp\n\
  myGraphics.DrawEllipse(myPen, x, y, width, height);\n```\n\n在这里，`myGraphics` 是图形对象。此命令在图形对象中从点\
  \ `(x, y)` 开始画出一个宽度为 `width`、高度为 `height` 的椭圆。一张图片显示了结果：\n\n![Image](img/00335.jpeg)\n\
  \n这里，`myGraphics` 是图形对象。此命令在图形对象中画出一个椭圆，宽度为 `width`，高度为 `height`，起始点为 `(x, y)`。一张图片显示了结果：\n\
  \n![Image](img/00335.jpeg)\n\n注意，我们使用了一个之前没见过的图形方法 (`DrawEllipse`)。你应该能够理解它，并且你会看到它在这个示例中产生了非常漂亮的效果。`DrawEllipse`\
  \ 方法的形式如下：\n\n```csharp\nmyGraphics.DrawEllipse(myPen, x, y, width, height);\n```\n\
  \n这里，`myGraphics` 是图形对象。此命令在图形对象中从点 `(x, y)` 开始画出一个椭圆，宽度为 `width`，高度为 `height`。一张图片显示了结果：\n\
  \n![Image](img/00335.jpeg)\n\n*(注：由于原文文本在某些段落存在描述重复，翻译文已根据翻译要求保持了逻辑连贯性)*\n\n\n\n\
  \n```cs\nmyGraphics.DrawImage(picExample.Image, x, y, w, h);\n```\n\n其中 `x` 是图像在\
  \ `myGraphics` 内的水平位置，`y` 是垂直位置。图像将具有宽度值 `w` 和高度 `h`。宽度和高度可以是原始图像的大小，也可以被放大或缩小。这取决于你的选择。\n\
  \n下面的一幅图说明了 `DrawImage` 的执行过程：\n\n![Image](img/00215.jpeg)\n\n注意矩形图像是如何传输的。连续的传输（总是擦除图像的上一个位置）会产生运动或动画的错觉。我们应该把\
  \ `DrawImage` 语句放在哪里呢？\n\n每个需要移动的画框（picture box）图像都必须有一个关联的定时器控件。如果需要，多个图像可以使用同一个定时器。`DrawImage`\
  \ 语句放置在相应的定时器控件 `Tick` 事件中。每当 `Tick` 事件被触发时，图像会在它的旧位置被擦除（通过在那个位置放置一个“空白”图像），计算新的图像位置并执行\
  \ `DrawImage` 方法。这种周期性的运动就是动画。让我们看一个例子来看看这到底有多简单。\n\n启动 Visual C# 并新建一个项目。在表单上放置一个面板（默认名称为\
  \ `panel1`）——让它高一点，背景设为白色。在表单上放置一个小型的画框（命名为 `pictureBox1`）。设置它的 `Image` 属性（我使用了\
  \ `\\VCSKids\\VCSK Projects\\Graphics` 文件夹中的足球位图图形）。在表单上放置一个定时器控件（默认名称为 `timer1`）。使用\
  \ `100` 的 `Interval`。在表单上放置一个按钮（默认名称为 `button1`）来启动和停止定时器。我们将多次使用这个例子。尝试让它看起来像这样：\n\
  \n![Image](img/00270.jpeg)\n\n在通用声明区域定义所需的图形对象。还要包含一个变量（`imageY`）来跟踪图像的垂直位置：\n\n\
  ```cs\nGraphics myGraphics;\nint imageY;\n```\n\n并在 `Form1_Load` 事件方法中创建该对象：\n\n\
  ```cs\nprivate void Form1_Load(object sender, EventArgs e)\n{\n    myGraphics =\
  \ panel1.CreateGraphics();\n}\n```\n\n在 `Form1_FormClosing` 事件方法中释放图形对象：\n\n```cs\n\
  private void Form1_FormClosing(object sender, FormClosingEventArgs e)\n{\n    myGraphics.Dispose();\n\
  }\n```\n\n使用 `button1_Click` 来切换定时器状态并在面板控件顶部初始化 `pictureBox1.Image` 的位置（`imageY`）：\n\
  \n```cs\nprivate void button1_Click(object sender, EventArgs e)\n{\n    timer1.Enabled\
  \ = !(timer1.Enabled);\n    imageY = 0;\n}\n```\n\n现在，在 `timer1_Tick` 事件中移动图像：\n\
  \n```cs\nprivate void timer1_Tick(object sender, EventArgs e)\n{\n    int imageX\
  \ = 10;\n    int imageW = 30;\n    int imageH = 25;\n    myGraphics.Clear(panel1.BackColor);\n\
  \    imageY = imageY + panel1.Height / 40;\n    myGraphics.DrawImage(pictureBox1.Image,\
  \ imageX, imageY, imageW, imageH);\n}\n```\n\n在此事件中，图像的宽度（`imageW`）和高度（`imageH`）被赋予数值，水平位置（`imageX`）也是如此。然后，清除图形对象以擦除之前的图像。每次执行事件时（每\
  \ 0.1 秒），图像的垂直位置（`ImageY`）增加面板高度的 1/40。画框图像正在向下移动。该程序需要执行 40 次（大约 4 秒）才能到达底部。让我们尝试一下。\n\
  \n运行示例项目。点击按钮启动定时器。观察图像掉落。注意图像被缩放以适应 `DrawImage` 方法定义的区域。非常简单，不是吗？图像需要多长时间到达底部？当它到达底部会发生什么？它会一直向下穿过面板、穿过表单，从你电脑显示器的底部出去，到未知的哪里！我们需要能够检测到这种消失并对其进行处理。我们将介绍两种处理这种情况的方法。首先，我们将让图像在面板顶部重新出现，或者让它滚动。然后，我们将让它反弹。停止项目并保存它。我们还会再次使用它。\n\
  \n## 图像消失\n\n当图像在面板中移动时，我们需要知道它们何时越过边界移出面板。这种信息在视频类游戏中经常是需要的。我们刚刚在掉落球的例子中看到了这种需求。当图像消失时，我们可以忽略该图像，或者可能让它“滚动”到面板控件的另一侧。我们如何判断图像是否已经消失了？这基本上是一个比较各种位置和尺寸的情况。\n\
  \n我们需要检测图像是否已完全越过四个面板边界之一（上、下、左、右）。这些检测中的每一个都可以通过这个面板（`myPanel`）内画框图像（`myImage`）的图来开发：\n\
  \n![Image](img/00318.jpeg)\n\n注意图像位于 (`imageX`, `imageY`)，宽度为 `imageW` 像素，高度为 `imageH`\
  \ 像素。\n\n如果图像正在向下移动，当它的顶部低于面板底部时，它就完全越过了底部边界。面板底部是 `myPanel.Height`。这种检测如下：\n\n\
  ```cs\nif (imageY > myPanel.Height)\n{\n    [底部边界消失]\n}\n```\n\n如果图像向上移动，当它的底部小于\
  \ 0 时，它就完全越过了顶部边界。面板顶部是 0。检测如下：\n\n```cs\nif ((imageY + imageH) < 0)\n{\n    [顶部边界消失]\n\
  }\n```\n\n如果控件向左移动，当它的右侧（`imageX + imageW`）小于 0 时，它就完全越过了左边界。检测如下：\n\n```cs\nif\
  \ ((imageX + imageW) < 0)\n{\n    [左边界消失]\n}\n```\n\n![Image](img/00352.jpeg)\n\n\
  如果图像向右移动，当它的左侧（`imageX`）通过边界时，它就完全越过了右边界。面板右侧是 `myPanel.Width`。检测如下：\n\n```cs\n\
  if (imageX > myPanel.Width)\n{\n    [右边界消失]\n}\n```\n\n让我们在掉落球的例子中添加消失检测。回到该项目。假设当图像到达底部时，我们让它从顶部重新出现。我们将\
  \ `timer1_Tick` 事件修改为如下（阴影部分为新增）：\n\n```cs\nprivate void timer1_Tick(object sender,\
  \ EventArgs e)\n{\n    int imageX = 10;\n    int imageW = 30;\n    int imageH =\
  \ 25;\n    myGraphics.Clear(panel1.BackColor);\n    imageY = imageY + panel1.Height\
  \ / 40;\n    myGraphics.DrawImage(pictureBox1.Image, imageX, imageY, imageW, imageH);\n\
  \n    if (imageY > panel1.Height)\n    {\n        imageY = -imageH;\n    }\n}\n\
  ```\n\n我们添加了底部消失逻辑。注意当图像消失时，我们重置其 `imageY` 值，使其重新位于面板上方。运行项目。观察图像滚动。非常简单，不是吗？停止并保存项目。\n\
  \n## 边界交叉\n\n![Image](img/00203.jpeg)\n\n如果在掉落图像例子中，不是滚动而是让图像在到达底部边界时回回？这是另一个常见的动画任务——检测边界交叉的发生。这种交叉用于改变移动图像的方向，即让它们反弹。我们如何检测边界交叉？\n\
  \n用于图像消失的相同图也可以用于这里。检查图像是否越过面板边界就像检查图像消失，只是图像还没有移动得那么远。对于顶部和底部的检查，图像移动量小于其高度值（`imageH`）。对于左侧和右侧的检查，控件移动量小于其宽度值（`imageW`）。回看那个图，你应该能看到代码段完成了相应的边界交叉方向：\n\
  \n```cs\nif (imageY < 0)\n{\n    [顶部边界交叉 C#]\n}\n\nif ((imageY + imageH) > myPanel.Height)\n\
  {\n    [底部边界交叉 C#]\n}\n\nif (imageX < 0)\n{\n    [左边界交叉 C#]\n}\n\nif ((imageX +\
  \ imageW) > myPanel.Width)\n{\n    [右边界交叉 C#]\n}\n```\n\n\n\n\n让我们修改下落图像示例，让它在到达面板底部时发生反弹。在全局声明区域声明一个整数变量\
  \ `imageDir`：\n\n```csharp\nint imageDir;\n```\n\n`imageDir` 用于指示图像移动的方向。当 `imageDir`\
  \ 为 1 时，图像向下移动（`imageY` 增加）。当 `imageDir` 为 -1 时，图像向上移动（`imageY` 减小）。将 `button1_Click`\
  \ 事件更改为如下所示（新行部分有阴影显示）：\n\n```csharp\nprivate void button1_Click(object sender,\
  \ EventArgs e)\n{\n    timer1.Enabled = !(timer1.Enabled);\n    imageY = 0;\n  \
  \  imageDir = 1;\n}\n```\n\n我们添加了一行代码将 `imageDir` 初始化为 1（向下移动）。将 `timer1_Tick` 事件更改为如下所示（再次，修改过或新增的行有阴影显示）：\n\
  \n```csharp\nprivate void timer1_Tick(object sender, EventArgs e)\n{\n    int imageX\
  \ = 10;\n    int imageW = 30;\n    int imageH = 25;\n    myGraphics.Clear(panel1.BackColor);\n\
  \    imageY = imageY + imageDir * panel1.Height / 40;\n    myGraphics.DrawImage(pictureBox1.Image,\
  \ imageX, imageY, imageW, imageH);\n    if (imageY + imageH > panel1.Height)\n \
  \   {\n        imageY = panel1.Height - imageH;\n        imageDir = -1;\n    }\n\
  }\n```\n\n我们修改了 `imageY` 的计算方式以引入 `imageDir` 变量。注意它是如何用于为图像运动赋予正确方向的（`imageDir`\
  \ 为 1 时向下，`imageDir` 为 -1 时向上）。我们还替换了现有 if 结构中处理底部越界的代码。注意，当检测到越界时，图像会被重新定位（通过重置\
  \ `imageY`）到面板底部（`panel1.Height - imageH`），并将 `imageDir` 设置为 -1（更改方向，使图像开始向上移动）。运行项目。现在，当图像到达面板底部时，它会反转方向并返回向上。我们已经让图像弹起来了！但是，一旦它到达顶部，它又消失了！\n\
  \n添加顶部越界检测，因此现在 `timer1_Tick` 事件如下所示（修改部分有阴影显示）：\n\n```csharp\nprivate void timer1_Tick(object\
  \ sender, EventArgs e)\n{\n    int imageX = 10;\n    int imageW = 30;\n    int imageH\
  \ = 25;\n    myGraphics.Clear(panel1.BackColor);\n    imageY = imageY + imageDir\
  \ * panel1.Height / 40;\n    myGraphics.DrawImage(pictureBox1.Image, imageX, imageY,\
  \ imageW, imageH);\n    if (imageY + imageH > panel1.Height)\n    {\n        imageY\
  \ = panel1.Height - imageH;\n        imageDir = -1;\n        System.Media.SystemSounds.Beep.Play();\n\
  \    }\n    else if (imageY < 0)\n    {\n        imageY = 0;\n        imageDir =\
  \ 1;\n        System.Media.SystemSounds.Beep.Play();\n    }\n}\n```\n\n在顶部越界代码（else\
  \ if 部分）中，我们将 `imageY` 重置为 0（面板顶部）并将 `imageDir` 改为 1。我们还添加了 Beep 语句，以便在发生任何反弹时都有听觉反馈。再次运行项目。你的图像现在会上下弹动，每次弹动都会发出蜂哔声，直到你停止它。停止并保存项目。\n\
  \n![Image](img/00042.jpeg)\n\n我们在这里开发的用于检查和重置图像位置的代码是 Visual C# 中的一项常见任务。随着你编程技能的提高，你应该确保自己熟悉所有属性和尺寸的含义以及它们是如何相互作用的。例如，你看到我们如何计算\
  \ `imageX` 使图像在面板中居中了吗？尝试在 `timer1_Tick` 方法中这样做：\n\n```csharp\nimageX = (int) (0.5\
  \ * (panel1.Width - imageW));\n```\n\n确保你将此行放在声明 `imageW` 的行之后。注意将计算结果强制转换（转换）为\
  \ `int` 类型。再次保存一次项目。\n\n你现在已经看到了如何使用动画实现许多功能。你可以让图像移动、让它们消失并重新出现，以及让它们弹动。你对想要构建的简单游戏有什么想法吗？你还需要另外两个技能——图像擦除和碰撞检测——将在后续讨论。\n\
  \n## 图像擦除\n\n![Image](img/00278.jpeg)\n\n在我们刚刚完成的小示例中，我们必须在每个 `DrawImage` 方法之前清除面板控件（使用\
  \ `Clear` 图形方法）。这样做是为了在绘制新图像之前擦除旧位置的图像。这种“先擦除后重绘”的过程是动画背后的秘密。但如果我们正在处理许多图像怎么办？`Clear`\
  \ 方法会清除面板上的所有图像，并需要重新定位每个图像，即使是那些没有移动的。这是一个缓慢、枯燥且不必要的过程，还会导致动画产生闪烁。\n\n我们将采取更精确的擦除方法。我们不在移动图像之前擦除整个面板，而是只擦除之前占据占据矩形区域。为了做到这一点，我们将使用一个新的概念\
  \ `FillRectangle` 图形方法。该方法非常直观，根据你对 Visual C# 的知识，你应该能轻松理解如何使用它。如果应用于名为 `myGraphics`\
  \ 的图形对象，其格式如下：\n\n```csharp\nmyGraphics.FillRectangle(myBrush, x, y, width, height);\n\
  ```\n\n这行代码将“绘制”图像。\n\n\n\n\n> 4. image1 的顶部 (`image1Y`) 必须比 image2 的底部 (`image2Y\
  \ + image2H`) “高”\n\n要发生碰撞，必须满足这四个条件。\n\n检查这些矩形是否重叠的 C# 代码如下：\n\n```csharp\nif ((image1X\
  \ + image1W) > image2X)\n{\n    if (image1X < (image2X + image2W))\n    {\n    \
  \    if ((image1Y + image1H) > image2Y)\n        {\n            if (image1Y < (image2Y\
  \ + image2H))\n            {\n                [重叠或碰撞的 C# 代码]\n            }\n  \
  \      }\n    }\n}\n```\n\n此代码使用四个“嵌套”的 if 结构检查了四种重叠条件。只有当发现四个条件都为真时，才会执行碰撞的 C#\
  \ 代码。\n\n让我们用弹跳足球的示例尝试一些碰撞检测。在面板底部添加一个按钮控件（默认名称为 `button2`）——稍微收窄宽度。清空按钮的 `Text`\
  \ 属性，使其上没有文字。确保按钮“附着”在面板上。是的，我们按钮不是图像，但它是一个矩形，适用于相同的重叠规则。我们想看看图像是否会与按钮碰撞并向上弹起。你的表单看起来应该这样：\n\
  \n![Image](img/00346.jpeg)\n\n将 `timer1_Tick` 事件代码更改为（添加的代码为阴影部分）：\n\n```csharp\n\
  private void timer1_Tick(object sender, EventArgs e)\n{\n    int imageX = 10;\n\
  \    int imageW = 30;\n    int imageH = 25;\n    bool collision;\n    myGraphics.FillRectangle(blankBrush,\
  \ imageX, imageY, imageW, imageH);\n    imageY = imageY + imageDir * panel1.Height\
  \ / 40;\n    myGraphics.DrawImage(pictureBox1.Image, imageX, imageY, imageW, imageH);\n\
  \    collision = false;\n    if ((imageX + imageW) > button2.Left)\n    {\n    \
  \    if (imageX < (button2.Left + button2.Width))\n        {\n            if ((imageY\
  \ + imageH) > button2.Top)\n            {\n                if (imageY < (button2.Top\
  \ + button2.Height))\n                {\n                    collision = true;\n\
  \                }\n            }\n        }\n    }\n    if (collision)\n    {\n\
  \        imageY = button2.Top - imageH;\n        imageDir = -1;\n        System.Media.SystemSounds.Beep.Play();\n\
  \    }\n    else if (imageY < 0)\n    {\n        imageY = 0;\n        imageDir =\
  \ 1;\n        Console.Beep();\n    }\n}\n```\n\n我们声明了一个方法级 bool 变量 `collision` 来表示重叠（true\
  \ 表示重叠，false 表示未重叠）。使用按钮控件属性获取位置（`Left`、`Top`）和大小（`Width`、`Height`）的叠代码位于 `DrawImage`\
  \ 方法之后。如果检测到碰撞，图像将重新定位，使其恰好触碰 `button2` 的顶部，反转方向并播放蜂声。从面板顶部弹起的代码保持不变。运行项目。注意图像现在从按钮上弹起。停止项目。将\
  \ `button2` 移出面板控件，这样图像就不会与它碰撞。图像应该直接掉出屏幕。看看图像在不碰撞的情况下可以多近靠近 `button2`，以确保重叠程序正常工作。停止并保存项目。\n\
  \n现在你已经知道如何检测碰撞，你就迈向学习如何构建简单视频游戏的一步。接下来，我们将学习如何检测来自用户的键盘事件。这些事件的许多用途之一是允许用户移动一个小挡板来“击中”落下的球。我们刚刚学到的碰撞技术将在此类任务中大派用场。\n\
  \n![Image](img/00229.jpeg)\n\n## 键盘事件\n\n在第 8 类中，我们查看了用户使用鼠标输入与 Visual C# 项目交互的方法。我们研究了三个鼠标事件：`MouseDown`、`MouseMove`\
  \ 和 `MouseUp`。另一个可输入设备是计算机键盘。在这里我们查看键盘事件，它使我们的项目能够检测键盘的用户输入。研究了两个键盘事件：`KeyDown`\
  \ 事件和 `KeyPress` 事件。\n\n多个 Visual C# 控件可以识别键盘事件，特别是表单和文本框。然而，只有获得焦点的控件才能接收键盘事件。（回想获得焦点的控件是活动控件。）当尝试检测某个控件的键盘事件时，我们需要确保该控件拥有焦点。我们可以通过鼠标点击它来给控件赋予焦点。但另一种给控件分配焦点的方法是使用\
  \ `Focus` 方法。此类语句的格式为：\n\n`controlName.Focus();`\n\nC# 中的此命令将赋予 `controlName` 焦点并使其成为活动控件。它的效果与点击控件相同。该控件随后可以识别任何关联的键盘事件。我们在处理键盘事件时使用\
  \ `Focus` 方法以确保每个事件的正确执行。\n\n要在表单上检测键盘事件，您需要将表单的 `KeyPreview` 属性设置为 `True`。这会跳过控件用于生成事件的任何按键。\n\
  \n### KeyDown 事件\n\n`KeyDown` 事件具有检测计算机键盘上任何按键按下的能力。它可以检测：\n\n- `Shift`、`Ctrl` 和\
  \ `Alt` 键的特殊组合\n- `Insert`、`Del`、`Home`、`End`、`PgUp`、`PgDn` 键\n- 光标控制键\n\n\n\n\n\
  向表单添加第二个文本框（`textBox2`）。运行项目。点击这个新文本框并输入一些文本。注意发现 `textBox1_KeyDown` 事件没有检测到任何按键。为什么呢？`textBox2`\
  \ 拥有焦点 - 而 `textBox1` 没有。相反，执行的是 `textBox2_KeyDown` 事件（但那里没有代码）。用鼠标点击 `textBox1`\
  \ - 这让它获得了焦点。现在，按一个键。按键检测再次生效。请记住，要检测到键盘事件，相应的控件必须拥有焦点。\n\n## KeyPress 事件\n\n![Image](img/00354.jpeg)\n\
  \n`KeyPress` 事件与 `KeyDown` 事件相似，但有一点不同。在计算机世界中，许多字符具有所谓的 Unicode 值。Unicode 值简单来说就是数字（范围从\
  \ 0 到 255），它们代表了所有字母（大写和小写写）、所有数字、所有标点符号以及 Esc、Space（空格键）和 Enter（回车键）等许多特殊键。`KeyPress`\
  \ 事件可以检测到任何具有对应 Unicode 代码的按键按下。`KeyPress` 事件的一个优点是，你可以立即知道用户输入的是什么 - 不需要对任何其他键进行解释（像\
  \ `KeyDown` 事件那样）。例如，大写字母和小写字母有不同的 Unicode 值。Unicode 值与你可能在其他语言中见过的 ASCII（读作“askey”）代码有关。\n\
  \n名为 `controlName` 的控件的 `KeyPress` 方法格式如下：\n\n```csharp\nprivate void controlName_KeyPress(object\
  \ sender, KeyEventArgs e)\n{\n    [用于 KeyPress 事件的 C# 代码]\n}\n```\n\n同样，有两个参数：`sender`\
  \ 和 `e`。我们感兴趣的是按下了哪个键。该信息存储在 `e.KeyChar` 的值中。`e.KeyChar` 是一个 `char` 类型变量（这是一种我们还没见过的类型），它返回一个单独字符，对应于按下的键。按下的键可以是一个可读字符（字母、数字、标点符号），也可以是非可读字符（Esc、Enter）。查看一个可读字符并很容易知道它是什么。但我们如何区分两个不同的不可读字符呢？\n\
  \n回想一下 `KeyPress` 事件识别的每个可能的键都有一个 Unicode 值。如果你想知道特定字符的 Unicode 值，只需将该字符强制转换为 `int`\
  \ 类型。因此，要确定 `char` 类型变量（名为 `myChar`）的 Unicode (`myCode`）值，请使用：\n\n```csharp\nmyCode\
  \ = (int) myChar;\n```\n\n例如：\n\n```csharp\nmyCode = (int) 'A';\n```\n\n返回大写 A 的\
  \ Unicode 值（`myCode`，顺便说一下是 65）。注意，`char` 类型变量被包含在一对单引号中。要将 Unicode 值（`myValue`）转换为对应的字符，将该值强制转换为\
  \ `char` 类型：\n\n```csharp\nmyChar = (char) myCode;\n```\n\n例如：\n\n```csharp\nmyChar\
  \ = (char) 49;\n```\n\n返回由 Unicode 值 49 代表的字符（`myChar`）（一个数字“1”）。\n\n因此，为了识别不可读字符（称为控制键）的按键按下，我们可以检查对应的\
  \ Unicode 值。我们将使用的两个值为：\n\n| 定义 | Unicode 值 |\n| :--- | :--- |\n| Backspace (退格键)\
  \ | 8 |\n| <Enter> (回车键) | 13 |\n\n让我们尝试一个 `KeyPress` 事件的示例。启动一个新项目。添加一个标签控件（`label1`）和一个文本框控件（`textBox1`）。将此代码添加到\
  \ `textBox1_KeyPress` 事件方法中：\n\n```csharp\nprivate void textBox1_KeyPress(object\
  \ sender, KeyPressEventArgs e)\n{\n    label1.Text = Convert.ToString(e.KeyChar)\
  \ + \" \" + Convert.ToString((int) e.KeyChar);\n}\n```\n\n运行项目。按一个键。输入的字符（如果是可打印的）及其对应的\
  \ Unicode 值（用空格隔开这两个值）将出现在标签控件中。随你意愿按下尽可能多的键。注意大写字母和小写字母显示的值不同。注意并不是每个键都有 Unicode\
  \ 值。特别是，按下功能键或箭头键之一。发生了什么？什么都没有。你无法通过 `KeyPress` 事件检测功能键或箭头键的按下。这就是为什么我们需要讨论 `KeyDown`\
  \ 事件。停止并保存项目。\n\n让我们看看 `KeyPress` 事件的一个强大用途。假设我们有一个应用程序，只想用户在文本框中输入数字在该文本框的 `KeyPress`\
  \ 事件中，我们检查 `e.KeyChar` 并判断它是否为数字。如果是数字，太棒了！如果不是，我们就忽略那个键！这种检测并忽略不需要按键的过程被称为“按键拦截”（key\
  \ trapping）。通过将输入的 `e.KeyChar` 与可接受的值进行比较，我们可以（在 C# 代码中）决定是否接受该值作为输入。按键拦截是每个复杂的\
  \ Visual C# 应用程序的一部分。\n\n剩下的唯一问题是：如果我们决定某个按下的键是不可接受的，我们如何忽略它？我们使用 `e.Handled` 属性来实现。如果检测到不可接受的键，我们将\
  \ `e.Handled` 设置为 `true`。这会“欺骗” Visual C#，使其认为 `KeyPress` 事件已经被处理，按下的键被忽略了。如果按下的键是可以接受的，我们将\
  \ `e.Handled` 设置为 `false`。\n\n回到 Visual C#，让它只接受那些键。注意数字包含在单引号内，`Handled` 设置为 `true`，这限制了用户输入。。代码如下：\n\
  \n```csharp\nprivate void textBox1_KeyPress(object sender, KeyPressEventArgs e)\n\
  {\n    if (e.KeyChar < '0' || e.KeyChar > '9')\n    {\n        e.Handled = true;\n\
  \        label1.Text = \"非数字\";\n    }\n    else\n    {\n        e.Handled = false;\n\
  \        label1.Text = Convert.ToString(e.KeyChar) + \" \" + Convert.ToString((int)\
  \ e.KeyChar);\n    }\n}\n```\n*(注：由于原文最后几段存在逻辑断裂和重复描述，翻译时已根据上下文逻辑进行了整合与优化，以确保文档的可读性。)*\n\
  \n\n\n\n\n## 控件属性\n\n| | SizeMode (尺寸模式) | StretchImage (拉伸图像) |\n| :--- | :---\
  \ | :--- |\n| | Visible (可见) | False (否) |\n\n### `pictureBox2` 图片框:\n| 属性名称 | 属性值\
  \ |\n| :--- | :--- |\n| Name (名称) | `picArrow` |\n| Image (图像) | `arrow.gif` (位于\
  \ `\\VCSKids\\VCSK Projects\\BeachBalls` 文件夹) |\n| SizeMode (尺寸模式) | StretchImage\
  \ |\n| Visible (可见) | False (否) |\n\n### `label1` 标签:\n| 属性名称 | 属性值 |\n| :--- |\
