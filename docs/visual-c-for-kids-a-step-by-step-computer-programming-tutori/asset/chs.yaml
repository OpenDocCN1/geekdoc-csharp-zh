  \n# 关于作者\n\n**Philip Conrod** 为儿童、青少年和成人人编写、合著并编辑了许多计算机编程书籍。Philip 拥有计算机信息系统的 `BS`\
  \ 学位，以及 Regis 大学商业发展要要硕士证书。他还拥有 WarrenTech 的商业编程证书。Philip 从 1977 年开始编写计算机程序。他曾在\
  \ Sundstrand Aerospace、Safeco Insurance Companies、FamilyLife、Kenworth Truck Company、PACCAR\
  \ 和 Darigold Inc 等公司担任过多种信息技术领导职务。在空余时间，Philip 担任 Kidware Software, LLC 的总裁兼出版人。他是三个科技迷女儿的自豪父亲，住在华盛顿州梅普维尔谷。\n\
  \n**Lou Tylee** 拥有机械工程 `BS` 和 `MS` 学位，以及电气工程 `PhD` 学位。Lou 从 1969 年在大学上第一门 `Fortran`\
  \ 课程开始编写计算机程序。他编写过软件用于控制高速地面车辆的悬挂系统、监控核电站、降低商用客机的噪音、计算客机起飞速度、定位和识别空中及地面交通，并让孩子们数兔子、学习拼写和做数学题。他编写了几本在线教程，向数千人教授\
  \ `Visual Basic`、`Visual C#` 和 `Java`。他在一所主要大学教授了超过 15 多年的入门 `Visual Basic` 课程。目前，Lou\
  \ 在西雅图的一家大型航空公司担任工程师。他是五个孩子的自豪父亲，也是他那位特别妻子的自豪丈夫。Lou 和他的家人住在华盛顿州西雅图。\n\n# 致谢\n\n\
  我想感谢我的三个出色的女儿——Stephanie、Jessica 和 Chloe，她们帮助了书籍出版过程的各个方面，包括软件测试、书籍编辑、创意设计以及寻找错误和错别字等许多其他枯燥的任务。没有你们的辛勤、爱和支持，我无法完成这些。我还要感谢我最好的朋友\
  \ Jesus，他一直陪伴在我身边，给予我智慧和指导。没有你，这本书永远无法印刷和出版。\n\n我还要感谢我多才多艺的合著者 Lou Tylee，他完成了所有必要的艰性工作，以开发、测试、调试并更新书中所有的“初学者友好型”应用程序、游戏和基础教程文本。Lou\
  \ 不孜不倦地在以往许多版本的教程中倾注了心血，多年年来有许多初学者受益于他的工作。\n\n# 下载解决方案的安装与使用：\n\n\n\n\n\n如果你是直接从我们的网站购买的，你将收到一封包含特殊且个性化网络下载链接的电子邮件，从中下载压缩后的程序解决方案文件。如果你是通过\
  \ `Amazon.com` 等第三方书店购买的此书，本教程的解决方案文件包含在一个压缩 ZIP 文件中，你可以直接从我们的网站下载下载：\n\n`http://www.kidwaresoftware.com/VCS2015kids-registration.html`\n\
  \n在上述网页上填写在线表单，填写你的姓名、收货地址、电子邮件地址、本书的确切标题、购买日期、在线或实体店名称以及该商店的订单确认号。在我们收到所有这些信息后，我们将向你发送电子邮件与本书相关的源代码解决方案文件下载链接。\n\
  \n**警告：** 如果你购买的是“旧书”或“二手书”，则你没有获得许可或权利下载程序解决方案文件。不过，你可以以折扣价购买此书的数字下载版，这将允许你访问完成本教程所需的数字源代码解决方案文件。\n\
  \n## 为少儿童设计的 Visual C#\n\n`Visual C#` for Kids 的课程笔记和代码包含在一个或多个 ZIP 文件中。使用你最喜欢的“解压缩”应用程序将所有文件写入电脑。课程包含在名为\
  \ `VCSKids` 的文件夹中。该文件夹包含另外两个文件夹：`VSC Notes` 和 `VSC Projects`。`VSC Projects` 文件夹包含了课程期间开发的所有\
  \ `Visual C#` 项目。\n\n## 如何学习本课程\n\n`Visual C#` for Kids 是一门自进度型课程。建议的方法是每周上一一节课，持续十周。每周的课程大约需要你花费\
  \ 3 到 6 小时的时间来完全掌握概念。在进行某一周的工作之前，打开该周的课程笔记文件并将其打印。然后，按照自己的节奏阅读笔记。尝试在遇到笔记中的每个示例时完成它。完成\
  \ `Classes 3` 到 `10` 中的项目（以及奖励课程）。如果你需要任何帮助，所有完成的项目都包含在 `VSC Projects` 文件夹中。\n\n\
  ## 计算机科学教师 Alan Payne 的序言\n\n### 什么是“Visual C# For Kids”以及它是如何运作的\n\n这些 `Visual\
  \ C#` for Kids 课程是一套在 `Visual C#` 编程环境中高度组织化且索引良好的教程，专为 10 岁及以上的儿童设计。`Visual C#`\
  \ 是一种编程环境，允许用户拖放按钮、文本框、滚动条、定时器和其他数十种其他视觉“控件”，以制作看起来像“Windows”程序的程序。这些控件组合在一起为用户提供了一个\
  \ `GUI` —— 图形用户界面。\n\n这些教程的优点是为儿童提供了适合年龄的完整应用程序——从老师或父母的角度编写了完整文档的项目。也就是说，虽然为了成人（以及儿童学习者）的利益提供了完整的解决方案，但项目是以一系列易于遵循的课程呈现，解释了表单布局的原理、编码设计和规范以及与问题相关的特定代码。儿童学习者可以按照自己的进度遵循教程。课程的每一个部分都能被记住，因为它们对一个友好型应用程序的最终解决方案做出了贡献。成品是奖励，但学生在过程中完全投入并受益匪浅。这种学习方式通常是教师培训的重点。每位计算机科学教师都知道要让项目以这种方式运行需要大量工作，而通过这些教程，这些工作是由一位理解课堂和育儿经验的作者完成的。这是极其罕见的！\n\
  \n每个项目都有循进式的课程…… 课程、示例、问题和项目。循进式学习。增加且适当的难度…… 极佳的结果。\n\n通过这些项目，课程提供了关于要涵盖的编程主题的全面、儿童友好的背景。一旦理解，概念就可以很容易应用到各种应用程序中。然后，提取出特定的示例，让年轻学习者可以使用\
  \ `Visual C#` 表单设计器进行练习。然后提供示例的特定编码，使用户可以看到项目的所有部分是如何汇成成品的。\n\n通过这种循进的方式呈现课程，学生将完全投入并受到适当的挑战，从而成为独立的思考者，他们可以提出自己的项目构想，设计自己的表单并编写自己的代码。一旦学会了这一过程，学生的参与积极性将是无限制的！我曾看到，当学生对呈现的内容欲之不能时，他们的字素养水平得到了显著提高。\n\
  \n事实上，课程鼓励了加速学习——从意义上说，它们提供了一个学习计算机科学的丰富环境，但它们也鼓励加速学习，因为学生一旦开始学习就停不下来！计算机科学为挑战学生提供了这一独特机会，而作者们充分证明了他们成功地实现了这种持续的参与度。\n\
  \n### 我与 Kidware 产品的渊缘\n\n我使用 Kidware 的编程教程已经十多年，用以保持自己的学习。通过使用这些课程，我能够把时间花在课堂上会有回报的事情上。我没有浪费宝贵的时间在编程环境的语言参考库中——那些永远无法完全记住的帮助屏幕！这些项目是学生项目作为最终产品应有的示例——因此，每个项目的学习路径都是清晰且直接的。如果我想让学生使用或扩展项目，我会利用站点许可选项。我发现，在课堂中使用这些项目时，强调构成这些项目基础的基础计算机科学主题非常简单。我可以列出一些无论在何处教书都能的计算机科学主题——这些主题得到了专业覆盖：\n\
  \n- `数据类型和范围`\n- `变量作用域`\n- `命名规范`\n- `决策`\n- 循环`\n- `语言函数——字符串、日期、数值`\n- `数组、控制数组`\n\
  - `编写自己的方法（子程序）` 以及更多……这一切都整合在教程中。\n\n在许多州或省，上述主题不会在中学计算机课程中正式介绍，但它们构成了学生开展大多数项目的基础。通过这些教程，你作为老师或父母可以决定重点放在哪里，以确保涵盖你课程文档中的课程要求。\n\
  \n任何进一步的中学计算机主题直接源于上述主题。没有内容被遗漏。所有内容都可以与提供的课程相结合。\n\n对于教师来说，学习曲线很快！教师如何使用该产品：提前完成项目可以让老师先介绍项目的设计方面，然后让学生在完成成品所需的背景下进行所有的学习。这比让学生从零设计所有项目的学习曲线要快得多。集中在统一结果上的课程可以使学生的参与变得更加顺畅（这正是中学以及\
  \ 9、10 年级级学生所需要的），因为他们可以在短时间内完成更多项目，并且所学的每项内容都有背景。\n\n\n\n\n\n在完成表单设计、控件命名并掌握了特定组\
  \ ` C#` 控件的编码后，学生更有可能从零开始创建自己的问题和解决方案。学生们已经准备好为你的计算机科学课程创建他们自己的总结性项目——或者仅仅是为了好玩，他们可能还会为他们的其他课程想项目！而且问问学生的其他老师，他们希望看到什么样的项目扩展，这又有什么不好呢？\n\
  \n## 符合州和省级课程大纲及更多要求\n\n不同的州和省份对计算机科学有自己的课程大纲。通过 `Kidware Software` 产品，你将拥有一系列项目，让你从中挑选最符合你课程需求的项目。学生将从计算机科学和解决问题的角度出发，关注设计阶段和健全的解决问题技术。通过这种方式，他们变成了独立的问题解决者，并将超越所有中学的课程要求。\n\
  \n## 即用项目 – 开箱即用！\n\n`Visual C# for Kids` 教程涵盖的特定项目适用于 10 岁及以上的学生。特定的针对儿童的教程和项目可以在\
  \ `Contents` 文档中找到，包括\n\n### 额外奖励项目\n\n* 项目 1 – 秒表 B-2\n* 项目 2 – 井棋 B-8\n* 项目 3\
  \ – 掷骰子 B-20\n* 项目 4 – 州府 B-26\n* 项目 5 – 记忆游戏 B-37\n* 额外项目 – 弹球游戏 B-53\n\n如你所见，我们投入了精力确保项目符合年龄。\n\
  \n作为家长或教师，你可以从第一天就开始教授这些项目。对于成人来说，从解决方案文件开始完成自己的学习很容易。然后，他们将看到课程的所有部分是如何结合在一起的。即使是新手也能利用随附的课程。\n\
  \n### 如何教学生使用这些材料。\n\n在中学环境中，家长或老师可能会忍不住花大量时间坐在投影仪或电脑屏幕前过一遍教程——但最好的策略是先展示成品！这样，只要成人涵盖了目录中列出的基本概念，学生就能很快学会如何自己使用书面课程。课程将是有趣的，对年幼的学生来说，回报就是总有一个好玩的成品可以使用！\n\
  \n### 用于学生自学的高度组织化的参考资料！\n\n材料已经提炼了 `MSDN`（通常是为成人编写）的内容，并以符合语境和年龄的方式进行呈现，以便年幼学生记住他们学到的知识。为家长、教师和学生节省了大量时间，因为他们不需要翻阅数页的在线帮助来寻找所需内容。\n\
  \n### 如何评分项目。\n\n在教室环境中，教师可以通过在各个设计和编码阶段提问来标记学生的进度。在低年级（第 5 到 8 年级），教师可以根据提供的参考材料轻松地进行口头、图解回顾或书面随机测验，作为日常的复习策略。我发现，完成项目（精通）的要求足以收集学生进度的信息——特别是在高年级（第\
  \ 10 到 12 年级）。\n\n### 课程鼓励你自己的编程扩展。\n\n一旦学会了概念，就很难不知道为自己的项目做些什么。即使在中学水平也是如此——应用仅需\
  \ 10 分钟就可以完成（例如，一个高低猜数字游戏或温度转换程序），或者只需要一节课的时间——如果你想使用“可以尝试的其他事项”建议来扩展任何项目的话。\n\n\
  在过去的十年里使用了 `Kidware Software` 教程，我不得不说，我无法在目前引起孩子们极大兴趣的各种编程环境中实现现在所取得的成功！我感谢 `Kidware\
  \ Software` 及其作者，继续坚持适用于儿童的正确教学方法——即使对于如今的小孩，他们的注意力竞争现在已是一个如此严重的问题。\n\n此致，\n\nAlan\
  \ Payne, B.A.H., B.Ed.,\nTA Blakelock High School,\nOakville, Ontario\n`http://chatt.hdsb.ca/~paynea`\n\
  \n# 介绍 Visual C# Express\n\n## 关于 Bill 和 Paul 的故事\n\n![Image](img/00128.jpeg)\n\n\
  回到 20 世纪 70 年代初，Bill 和 Paul 是华盛顿州西雅图湖滨中学的校友。Bill 和 Paul 喜欢操作电脑，并编写了许多他们可以玩的游戏——像井棋和登月游戏的游戏。这些电脑游戏是用一种名为\
  \ `BASIC`（初学者全能符号指令代码）的计算机语言编写的。当 20 世纪 70 年代中期第一台小型电脑出来时，Bill 和 Paul 刚开始上大学。那时他们已经提高了自己的计算机技能，并能够告诉新电脑如何使用\
  \ `BASIC` 语言。他们实际上将自己版本的 `BASIC` 语言卖给了别人（花费 350 美元并存储在磁带上）。他们开始通过销售 `BASIC` 赚钱，并决定成立一家公司。你可能听过他们的公司——微软！Bill\
  \ 是 Bill Gates，他仍在运营微软，并且价值数十亿美元，而 Paul 是 Paul Allen，他不再为微软工作，但他有自己的业务投资，包括计算机和软件、职业运动队以及房地产开发。\n\
  \n微软销售的首批产品之一是 `BASIC` 计算机编程语言。从那时起他们开发了许多其他产品和许多其他语言。你在这组笔记中学习的产品被称为 `Visual C#`。`Visual`\
  \ 一词意味着你将构建用户可以查看和交互的 Windows 应用程序。`C#`（读作 \"cee sharp”）是指 `Visual C#` 环境中的特定语言。这种语言是基于\
  \ `C`、`C++` 和 `Java` 开发的。`Visual C#` 是最容易学习的编程语言之一。尽管易于学习和使用，`Visual C#` 也可以用于开发强大的程序。`Visual\
  \ C#` 为构建 Windows 应用程序提供了一个复杂的环境。你以前使用过 Windows 应用程序。微软的程序如 `Word`、`Excel`、`Internet\
  \ Explorer` 以及这些应用程序中的窗口（打开和保存文件、打印文件）都是 Windows 应用程序。这些应用程序不是用 `C#` 编写的（是用名为 `C++`\
  \ 的语言编写的），但它们展示了 `C#` 应用程序中实现的功能。\n\n所以，为什么要学习 `Visual C#`？这样做有几个原因。首先，如果你会编程，你将更好地理解计算机是如何运作的。其次，编程对你的思维能力是很好的锻炼——编写程序需要你是逻辑性很强的思考者。你还必须是一个完美主义者——计算机并不聪明，它们需要精确、完美的指令来工作。第三，计算机程序员的需求很大，收入很高。最后，编写程序很有趣。看到你对某个程序的想法在屏幕上变成现实是非常有成就感的。这些笔记中你将学习如何使用微软的\
  \ `Visual C#` 编写自己的 Windows 应用程序。你可能不像 Bill 和 Paul 那样成为比万翁，但希望你在学习这项非常有价值的技能时能获得乐趣。\n\
  \n\n\n\n\n# 学习 Visual C#\n\n学习如何使用 Visual C# 编写计算机程序（就像学习任何新事物一样）涉及许多步骤、许多新术语和许多新技能。我们将放慢速度，详细描述每一个步骤、术语和技能。在开始之前，我们假设你已经知道如何以下操作：\n\
  \n* • 你应该知道如何启动计算机和使用鼠标。\n* • 你应该对操作系统的有少许了解。\n* • 你应该知道如何在屏幕上调整窗口大小并移动窗口。\n* •\
  \ 你应该知道如何通过开始菜单在你的计算机上运行应用程序。\n* • 你应该知道如何填写屏幕上可能弹出的 Windows 窗口信息。\n* • 你应该了解文件夹和文件，以及如何在计算机上找到它们。\n\
  * • 你应该知道什么是扩展名以及如何识别它们。例如，在一个名为 `Example.ext` 的文件中，最后的三个字母 `ext` 被称为扩展名。\n* • 你应该知道如何点击链接阅读文档，并在文档的页面之间切换。你在使用互联网时一直在进行这些操作。\n\
  \n如果你用过文字处理程序、电子表格或计算机上的任何其他软件，你可能已经掌握了所有这些技能。如果你认为自己缺乏其中任何技能，请向他人寻求帮助。他们应该能在几分钟内教你如何操作。实际上，每当你尝试学习这些材料遇到困难时，永远不要害怕向别人寻求帮助。我们曾经都都是初学者，人们真的很喜欢帮助你学习。\n\
  \n让我们开始吧。正如我们所说的，我们将放慢速度。在第一课中，我们将学习如何在计算机上启动 Visual C#、如何将程序（或项目）加载到 Visual C#、如何运行程序、如何停止程序以及如何退出\
  \ Visual C#。这将是对后续课程中我们将学习的许多新内容的很好的介绍。\n\n![Image](img/00126.jpeg)\n\n## 启动 Visual\
  \ C#\n\n![Image](img/00127.jpeg)\n\n我们假设你的计算机已经安装并可以运行 Visual C#。如果没有，你需要先完成这一步。再次，如果需要的话，这可能是一个寻求他人帮助的好地方。你可以从微软免费下载\
  \ Visual C#。\n\nVisual C# 包含 Microsoft Visual Studio 2015 社区版的一部分。Visual Studio\
  \ 不仅包含 Visual C#，还包含 Visual C++ Express 和 Visual Basic Express。这三种语言使用相同的开发环境。按照此链接获取在你的计算机上下载和安装\
  \ Visual Studio 2015 社区版的完整说明：\n\n[`www.visualstudio.com/products/free-developer-offers-vs`](https://www.visualstudio.com/products/free-developer-offers-vs)\n\
  \n安装完成后，要启动 Visual C#：\n\n* • 点击 Windows 任务栏上的“开始”按钮。\n* • 点击“所有应用”。\n* • 然后选择 Microsoft\
  \ Visual Studio 2015\n\nVisual Studio 程序将开始启动。屏幕上会显示几个窗口，布局取决于你产品中的设置。\n\n![Image](img/00130.jpeg)\n\
  \n此屏幕显示了 Visual C# 集成开发环境 (IDE)。这是我们构建、运行和处理应用程序的地方。让我们指出屏幕上的几项项目。屏幕上有很多窗口。屏幕顶部是\
  \ Visual C# 主窗口。主窗口的顶部是标题栏（Title Bar）。标题栏为我们提供了有关正在使用什么程序以及我们正在处理哪个 Visual C# 程序的信息。标题栏下方是主菜单（Main\
  \ Menu），我们可以从那里控制 Visual C# 程序。通过使用文字处理程序和游戏等其他程序，你应该已经熟悉菜单的工作原理。主菜单下方是工具栏（Toolbar）。在这里，带有图片的小按钮也允许我们像主菜单一样控制\
  \ Visual C#。如果你将鼠标指针悬停在这些按钮之一上大约秒，就会弹出一个小“工具提示”（tooltip），并告诉该特定按钮的功能——试一下！几乎所有的\
  \ Windows 应用程序（电子表格、文字处理程序、游戏）都有帮助我们执行不同任务的工具栏。这就是 Visual C# 工具栏的。它将帮助我们完成大部分任务。屏幕中间是设计窗口（Design\
  \ Window）中的启动页（Start Page）。此页面包含许多你在学习更多 Visual C# 时可能感兴趣追求的有用主题 – 特别注意“发现 Visual\
  \ Studio 2015”下的主题。\n\n在任何时候，你的特定屏幕看起来可能和我们的不同。Visual C# 环境可以自定义为无限种可能。这意味着你可以按照你想要的方式让事物看起来如此。你可以“停靠”（dock）窗口或“浮动”（float）窗口。你可以将窗口移动到任何地方，也可以完全删除窗口。而且，不同的窗口会在不同的时间出现。随着你对\
  \ Visual C# 越来越熟悉，你将学习到你想要的状态。我们鼓励你尝试不同的事物。尝试移动窗口。尝试停靠和浮动。我们不会过多讨论如何自定义开发环境。（但是，我们会始终向你展示如何找到你需要的特定窗口。）\n\
  \n## 打开 Visual C# 项目\n\n![Image](img/00131.jpeg)\n\n我们现在想要做的是打开一个项目。使用 Visual C#\
  \ 编写的 Windows 应用程序被称为解决方案（solutions）。一个解决方案由一个或多个项目组成。项目包含了我们计算机所需的所有信息。在本课程中，我们的应用程序（解决方案）将由单个项目组成。因为如此，我们将交替使用应用程序、解决方案和项目这些术语。这些笔记中包含了许多你可以打开的\
  \ Visual C# 项目。让我们现在打开一个。\n\n我们将使用主菜单打开项目。按照以下步骤操作：\n\n* 选择主菜单中的“文件”（File），然后点击“打开”（Open），再选择“项目/解决方案”（Project/Solution）。弹出一个打开窗口：\n\
  \n![Image](img/00132.jpeg)\n\n* • 找到 `VCSKids` 文件夹（代表 Visual C# Sharp for Kids）。这是存放课程笔记和项目的文件夹。打开该文件夹。\n\
  * • 找到并打开 `VCS Projects` 文件夹。此文件夹存放课程的所有项目\n\n记住你是如何进入这个文件夹的。在整个课程中，你将在此文件夹打开需要的项目。在名为\
  \ `Sample` 的项目文件夹中，除了其他物品，还有一个扩展名为 `.sln` 的 Visual Studio 解决方案文件和一个扩展名为 `.csproj`\
  \ 的 Visual C# 项目文件。打开 `Sample` 解决方案文件（如打开窗口所示）。由于此解决方案中只有一个项目，你也可以打开项目文件获得相同的结果，但最好始终打开解决方案文件。\n\
  \n项目打开后，屏幕上现在有很多窗口：\n\n![Image](img/00133.jpeg)\n\n寻找“解决方案资源管理器”（Solution Explorer）窗口（如果不在，从菜单中选择“视图”\
  \ View 并选择“解决方案资源管理器”）。它列出了解决方案中的所有文件。右键点击 `Form1.cs` 文件并选择“打开”。\n\n![Image](img/00134.jpeg)\n\
  \n设计窗口将会出现看起来这样的窗口：\n\n![Image](img/00135.jpeg)\n\n这是我们的项目名为 `Sample`。我们将花一点时间解释这里显示的内容。这将向你介绍我们在\
  \ Visual C# 中使用的一些单词或词汇。Visual C# 中使用了许多术语。不要试图记住所有内容 – 你在课程中会多次看到这些新词。\n\n\n\n\n\
  \n我们将显示的项目窗口称为 `Form`（表单）。所有的 Visual C# 项目或程序都是使用表单构建的。事实上，你可能注意到所有的 Windows 应用程序都是使用某种表单构建的。表单顶部是\
  \ `Title Bar`（标题栏）。它有一个与表单相关的图标（小图片）、一个表单功能的描述（`Visual C# for Kids - Sample`），以及三个控制表单外观的小型按钮（我们现在不需要担心这些按钮）。表单上还有很多其他东西。这些其他东西就是\
  \ Visual C# 计算机程序的“核心”。\n\n你看到一组方形按钮，旁边写着玩具的名字。你看到玩具的图片。你看到一组圆形按钮，旁边写着颜色的名称。右侧有一个可以输入内容的小框，右边被称为\
  \ `scroll bar`（滚动条）。有一个写着 `Beep!` 的大按钮。有一个用于选择数字数值的小设备。而且，在一个大矩形里有一个球，旁边有一个写着 `Start`（开始）的按钮，在表单下方有一个看起来像\
  \ `stopwatch`（秒表）的小东西。我们将表单上的所有这些其他东西称为 `Controls`（控件）或 `Objects`（对象）。控件在你（或你的程序用户）与计算机之间提供了一个界面，或通信链路。你使用控件来告诉计算机某些事情。然后计算机根据它的指令来确定某些结果，并通过控件将这些结果显示给你。顺便说一下，表单本身也是一个控件。如果你用过任何\
  \ Windows 应用程序，你就以前见过控件了——你可能只是不知道它们被叫做控件。例如，工具栏上的按钮是控件，用于移动文字处理文档的滚动条是控件，菜单项是控件，以及你在打开和保存文件时点击的按钮都是控件。\n\
  \n我想你已经明白了控件是 Visual C# 中非常重要的部分，你是对的。它们是 Visual C# 中最重要的部分——它们允许你构建自己的应用程序。我们将在本课程的大部分时间里学习控件。不过现在，让我们运行这个程序，直观了解\
  \ Visual C# 项目（及其控件）是如何运作的。\n\n# 运行 Visual C# 项目\n\n在开发完 Visual C# 项目后，你想启动或运行程序。这会让程序运行起来，并允许用户与表单上的控件进行交互，让计算机执行分配的任务。我们可以使用\
  \ Visual C# 菜单下的工具栏来运行项目。寻找一个看起来像 VCR、CD 播放器或磁带播放机播放按钮的按钮：\n\n![Image](img/00136.jpeg)\n\
  \n*   点击此按钮运行 `Sample`（我们之前打开的项目）。\n\n你也可以通过以下方式运行项目：(1) 选择 `Debug`（调试）菜单，然后点击 `Start\
  \ Debugging`（开始调试），或 (2) 按 `<F5>` 功能键。\n\n项目表单将会出现并看起来如下。根据你使用的特定 Windows 操作系统，你的表单可能会略有不同。我们在这些笔记中同时使用了\
  \ Windows Vista（此处）和 Windows XP：\n\n![Image](img/00137.jpeg)\n\n注意发生了几处变化。所有的玩具都消失了。表单的背景颜色是蓝色的。`Blue`\
  \ 旁边的圆形按钮内有一个黑点。小小的 `stopwatch` 控件不可见。小球移动到了大矩形的上方。发生了什么？随着我们学习更多 Visual C# 的知识，我们将发现这些现象发生和原因。此外，注意\
  \ Visual C# 标题栏（主窗口中）中项目名称旁边的括号内出现了 `Running`（正在运行）。始终知道你是在运行程序（运行模式）还是在设计程序（设计模式）很重要——标题栏中的此指示会告诉你这一点。\n\
  \n![Image](img/00139.jpeg)\n\n项目现在正在运行，但它在做什么呢？什么都没有发生，还是说？在此时，Visual C# 正在等待你（即用户）做些什么。我们说你的\
  \ Visual C# 项目在等待一个 `event`（事件）的发生。在事件发生之前，Visual C# 程序中什么都不会发生。我们将 Visual C# 称为一种事件驱动的编程语言。那么，让我们引发一个事件吧。\n\
  \n你在表单上做某些事情时，事件就会发生——用鼠标点击某个地方，在可以文字的地方输入内容，或者可能将对象拖过表单。在表单的左上角，有一个标题为 `Toys` 的矩形区域，区域内有六个框。每个小框旁边都打印着一个玩具的名字。点击这些框中的一个。注意发生了什么。被选中的框中会出现一个勾选，表示框被选中，该框命名的玩具会出现在屏幕上。当我们点击一个框时，我们就触发了一个事件，称为\
  \ `CheckedChanged` 事件（这意味着框的“已选中”状态发生了变化）。如果发生了那个特定的事件，计算机就会识别该事件，并通过你的计算机程序执行你要求做的事。在这种情况下，事件告诉计算机显示被选中的玩具。再次点击该框。勾号和玩具消失了。你触发了另一个事件，并告诉计算机让玩具消失。这个特定的控件被称为\
  \ `check box`（复选框）。注意，你可以根据意愿勾选任意多个框，选择你想在屏幕上显示哪些玩具（如果有的话）。当你想要从列表中选择项目时，就会复选框。在本示例中还使用了两个控件。包含复选框的矩形区域称为\
  \ `group box`（组合框）。显示每个玩具图片的区域称为 `picture box`（图片框）控件。现在，让我们通过表单上的其他控件来引发事件。\n\n\
  在屏幕中间，有一个标题为 `Color` 的组合框，其中有四个圆形按钮。每个按钮旁边都打印着颜色名称。`Blue` 按钮内有一个黑点，表示它是选中的颜色（注意表单是蓝色的）。点击这些按钮中的另一个。注意发生了什么。表单变为选中的颜色。这种\
  \ `CheckedChanged`（意味着按钮的“已选中”或“已点”状态发生了变化）事件告诉计算机更改表单颜色。注意当你选择新颜色时，黑点出现在选中的按钮中，并从之前的按钮中消失。与我们看到的复选框不同，你只能选择这些按钮中的一个。这是合理的——表单只能有一种颜色！这些圆形按钮被称为\
  \ `radio buttons`（单选按钮）。当你需要从列表中选择一个选项时，就会单选按钮。它们被称为单选按钮，是因为在收音机上你一次只能选择一个电台。\n\n\
  ![Image](img/00140.jpeg)\n\n在 `Toys` 组合框下方是另一个标题为 `Pick a Number` 的组合框。在那里我们看到一个名为\
  \ `numeric up-down`（数字增减控件）的控件。有一个显示数字的标签区域，数字旁边是另一个带有上下箭头的控件（滚动条）。你可能在其他应用程序中见过滚动条。滚动条用于更改显示的数字。点击滚动条顶部的箭头。显示的数值将增加\
  \ 1。持续点击该箭头会继续增加值。点击下方箭头会减小值。在这个示例中，计算机正在响应数字增减控件的 `ValueChanged` 事件，该事件在每次点击箭头时触发，从而改变显示的值。\n\
  \n在 `Pick a Number` 组合框下方有一个带侧滚动条的区域。这个控件被称为 `text box`（文本框）。你可以点击它，然后输入任何想要的文本。试试看。文本框本身就像一个小型文字处理器。每当你向文本框输入某些内容时，都会发生多个事件。当你按下按键时有一个\
  \ `KeyPress` 事件，每当框内文本变化时都会调用一个 `Change` 事件。\n\n![Image](img/00141.jpeg)\n\n\n\n\
  \n\n文本框旁边有一个写着 Beep! 的按钮。点击该按钮，你应该能听到电脑扬声器发出的哔声。这种控件被称为 `button`（按钮），是 Visual C#\
  \ 中应用广泛的控件之一。`Click` 事件告诉电脑让扬声器鸣叫。\n\n我们表单上的最后一个元素是一个高大的、黄色矩形控件，称为 `panel`（面板），它包含一个显示沙球的\
  \ `picture box`（图片框）控件。`panel` 下有一个写着 Start 的按钮。点击该按钮，即触发一个 `Click` 事件。球开始向下移动。它持续向下移动，直到碰到\
  \ `panel` 的底部，然后开始向上移动。它会一直这样做，直到你点击现在显示为 Stop 的按钮。记得我们在设计模式下位于表单下方的小秒表吗，它在我们运行项目时消失了。它正被跳球示例使用——它被称为\
  \ `timer`（定时器）控件。按钮上的 `Click` 事件除了将按钮文字改为 Stop 之外，还启动了这个 `timer` 控件。`timer` 控件会按照预设的时间间隔自动生成\
  \ `Tick` 事件。在这个示例中，每隔 1/10 秒就会生成一个 `Tick` 事件，在在该事件中，球的位置发生改变以产生移动的。注意，即使在球跳动时，你也可以更改表单颜色、让玩具出现和消失、输入文本并让电脑鸣声。因此，Visual\
  \ C# 甚至具有处理多个事件的能力。\n\n显然，这个项目更多的是为了演示 Visual C# 可以做什么，但这是一个重要的概念。它指出了你在构建自己的 Visual\
  \ C# 项目时将要做的工作。一个项目是由允许用户向电脑提供信息的控件组成的。通过触发这些控件的事件，电脑将生成任何所需的结果。我们还没有担心如何使用事件来确定这些结果，但在随后的所有课程中我们都会。当你完成这门课程时，你将能够构建出完成示例项目所做的一切功能（以及更多）的项目。现在让我们来看看如何停止项目。\n\
  \n# 停止 Visual C# 项目\n\n![Image](img/00142.jpeg)\n\n停止 Visual C# 项目有许多方法。我们将使用工具栏。寻找一个看起来像\
  \ VCR、CD 播放器或磁带播放器上停止按钮的按钮（你可能需要在屏幕上向下移动项目表单才能看到工具栏）：\n\n![Image](img/00143.jpeg)\n\
  \n> • 点击此按钮（你可能需要点击两次）。项目将停止，Visual C# 将返回设计模式。\n\n停止项目的其他方法是：\n\n> • 选择 `Debug`（调试）菜单，然后点击\
  \ `Stop Debugging`（停止调试）\n\n> • 点击表单上的 `Close`（关闭）按钮。它是表单右上角像 `X` 的小按钮。\n\n## 停止\
  \ Visual C#\n\n当你完成 Visual C# 项目的工作时，你想要离开 Visual C# 程序和设计环境。这是几乎所有 Windows 应用程序使用的程序：\n\
  \n> • 在主菜单中选择 `File`（文件）。\n\n> • 选择 `Exit`（退出，位于 `File` 菜单末尾）。\n\n现在停止 Visual C#。Visual\
  \ C# 将关闭所有打开的窗口，你将返回 Windows 桌面。在 Sample 项目激活的情况下停止 Visual C#，可能会询问你是否要保存某些文件。回答\
  \ `No`。与停止项目一样，停止 Visual C# 的另一种方法是点击主窗口右上角的关闭按钮。它是那个看起来像 `X` 的按钮。\n\n![Image](img/00144.jpeg)\n\
  \n## 总结\n\n呼！你累了吗？我们在这里涵盖了很多新内容，所以如果你觉得累，也没关系。正如我们之前所说，你学习了许多新词汇和概念。如果你不记得在这里讨论的所有内容，不要担心。你将多次看到这些材料。重要的是，你只需要对\
  \ Visual C# 项目包含什么以及它是如何运作的有一个概念。并且你知道如何启动和停止 Visual C# 本身。\n\n总之，我们看到 Visual C#\
  \ 项目是构建在表单之上的。控件（也称为对象）被放置在表单上，允许用户和电脑进行交互。用户通过控件产生事件，让电脑完成任务。在下节课中，你将开始学习能够让你开始构建自己的\
  \ Visual C# 项目的技能。你将看到项目的各个部分是如何结合的。以 Sample 项目为例，你将学习如何定位项目的重要部分。然后，在第 3 课中，你将实际构建你的第一个项目！\n\
  \n# 2 Visual C# Express 版设计环境\n\n![Image](img/00145.jpeg)\n\n## 复习与预习\n\n在第 1 课中，我们学习了\
  \ Visual C# 项目的重要部分。我们看到项目是使用控件（也称为对象）在表单上构建的。\n\n通过使用事件与控件交互，我们通过我们提供的指令让电脑执行分配的任务。在第第二节课中，我们将通过观察项目的不同部分以及它们在\
  \ Visual C# 设计环境中的位置，学习构建我们自己的 Visual C# 项目的起始步骤。和第 1 课一样，这里也有许多新术语和技能需要学习。\n\n\
  ![Image](img/00146.jpeg)\n\n## Visual C# 项目的组成\n\n在第 1 课中，我们看到 Visual C# 项目有四个主要组件：解决方案（solution）、项目、表单和控件。解决方案可以包含多个项目。在课程中，解决方案包含单个项目，所以解决方案和项目这两个词通用的。项目是涵盖\
  \ Visual C# 中所有内容的词。其他描述项目的词是应用程序或程序。表单是创建创建界面的窗口。控件是放置在表单上的图形功能或工具，允许交互。记住表单本身也是控件。控件也被称为对象。从图上看，项目是：\n\
  \n![Image](img/00147.jpeg)\n\n所以，从最简单的术语来说，项目由一个包含若干（甚至数百）控件的表单组成。\n\n控件的每个特性（包括表单本身）都由属性指定。示例属性包括名称、控件上的文本、宽度、高度、颜色、在表单上的位置、内容。属性用于赋予项目所需的外观。对于学习的每个控件，我们将花费大量时间属性。\n\
  \n![Image](img/00148.jpeg)\n\n在第 1 课中，我们看到通过与 Sample 项目中的控件交互（点击按钮、选择选项、输入文本），我们可以通过触发事件让项目发生变化。我们说\
  \ Visual C# 是一种事件驱动语言，它由事件处理器控制。这意味着在 Visual C# 项目中，事件发生之前什么都不会发生。一旦检测到事件，项目就会找到与事件相关的系列指令，称为事件方法。该方法执行后，程序控制返回给事件处理器：\n\
  \n![Image](img/00149.jpeg)\n\n与控件相关的事件方法是我们进行实际计算机编程的地方。这些方法是我们编写 C# 语句的地方。在本节课中，你将学习大量的编程和\
  \ C# 语言。\n\n总之，Visual C# 项目的主要部分是：\n\n> • form\n\n> \n\n> • controls\n\n> \n\n>\
  \ • control properties\n\n> \n\n> • control event methods\n\n现在，让我们看看 Visual C#\
  \ 编程环境，并识别可以在哪里访问这些项目组件。\n\n![Image](img/00150.jpeg)\n\n## Visual C# 环境的组成\n\n\n\
  \n\nVisual C# 不仅仅是一种计算机语言。它是一个项目构建环境。在这个环境中，我们可以启动并构建项目、运行和测试项目、消除项目中的错误（如果有的话），并保存项目以备后之用。对于其他计算机语言，通常你需要一个单独的文本编辑器来编写程序，一个名为编译器的工具来创建程序，然后在另一个区域来测试程序。Visual\
  \ C# 将项目构建过程的每一个步骤都集成到一个环境中。让我们来看一下 Visual C# 环境的各个部分。为了方便观察，我们首先需要启动一个新项目。我们不会对这个项目进行任何操作，只是用它来识别\
  \ Visual C# 环境的各个部分。\n\n## 启动一个新的 Visual C# 项目\n\n每当你想使用 Visual C# 构建项目时，第一步都是创建一个新项目。按照第\
  \ 1 类中学到的程序启动 Visual C#。我们将使用 Visual C# 菜单下方的工具栏启动新项目。找到这个按钮（左侧的第一个按钮）：\n\n![Image](img/00152.jpeg)\n\
  \n你也可以通过从菜单选择 `File`，然后点击 `New`，最后点击 `Project` 来启动新项目。\n\n点击 `New Project` 按钮，会出现一个\
  \ New Project 框：\n\n![Image](img/00153.jpeg)\n\n在 `Installed Templates` 下，确保选择了\
  \ Visual C#。我们将始终构建 Windows 应用程序，因此请选择 `Windows Forms Application`。\n\n此窗口还会询问你想要将项目保存在何处。在\
  \ `Name` 框中，输入要保存项目文件夹的名称（我使用了 `FirstTry`）。`Location` 应显示你项目文件夹所在的目录。你可以通过 `Browse`\
  \ 浏览到现有位置，或者通过勾选指示的框来创建一个新目录。对于这些笔记，我们建议将每个项目文件夹保存在同一个目录下。对于课程笔记，所有的项目文件夹都保存在 `\\\
  BeginVCS\\BVCS Projects` 文件夹中。完成后，点击 `OK`。你的新项目将出现在 Visual C# 环境中，并显示出几个窗口。\n\n\
  ## 主窗口 (Main Window)\n\n主窗口用于控制 Visual C# 项目构建和运行过程的大多数方面：\n\n![Image](img/00154.jpeg)\n\
  \n主窗口由标题栏、菜单栏和工具栏组成。标题栏显示了项目名称（此处处是 `FirstTry`）。菜单栏具有下拉菜单，你可以通过它们控制 Visual C# 环境的操作。工具栏带有按钮，提供了某些菜单选项的快捷方式。你应该能够识别出\
  \ `New Project` 按钮。此外，寻找我们在第 1 类中用于启动项目的那个按钮。\n\n## 解决方案管理器窗口 (Solution Explorer\
  \ Window)\n\n解决方案管理器窗口显示了哪些文件组成你的项目：\n\n![Image](img/00156.jpeg)\n\n如果屏幕上没有解决方案管理器窗口，请点击主菜单上的\
  \ `View`，然后点击 `Solution Explorer`。如果你选择了表单文件（`Form1.cs`），可以通过选择 `View` 菜单然后 `Designer`\
  \ 获取项目表单的视图。或者，你可以点击解决方案管理器窗口中的 `View Code` 按钮查看表单内的实际 C# 代码。我们就会查看这个代码窗口。\n\n##\
  \ 设计窗口 (Design Window)\n\n设计窗口是开发 Visual C# 应用程序的核心。它是你构建表单并编写实际代码的地方。你应该在这个窗口看到一个空白表单：\n\
  \n![Image](img/00157.jpeg)\n\n如果屏幕上没有表单，请在解决方案管理器窗口中选择 `Form1.cs`。然后，点击主菜单上的 `View`，然后\
  \ `Designer`。或者，在按住 `<Shift>` 的同时按下功能键 `<F7>`。\n\n 工具箱窗口 (Toolbox Window)\n\n工具箱窗口是应用程序中所用控件的选取菜单。很多时候，控件也被称为对象或工具。因此，使用了三个词来描述控件：对象、工具，以及最常用的控件（controls）。\n\
  \n![Image](img/00158.jpeg)\n\n如果屏幕上没有工具箱窗口，请点击主菜单上的 `View`，然后点击 `Toolbox`。请确保你正在查看\
  \ `Common Controls`。看看你是否能识别出我们在第 1 类中使用示例项目中的某些控件。\n\n## 属性窗口 (Properties Window)\n\
  \n属性窗口用于为控件建立初始属性值。它还用于建立控件事件（我们将在第 3 类中看到）——现在我们只看属性——为此操作，请确保选中了属性工具栏按钮（在属性窗口中），而不是事件（Events）按钮（见下图）：\n\
  \n![Image](img/00159.jpeg)\n\n窗口窗口顶部的下拉框列出了当前表单上的所有控件。此框下方是当前选中对象（在本例中为 `Form`）的可用属性。使用窗口顶部附近的工具栏来选择属性的不同视图。有两种视图：字母排序（Alphabetic）和分类（Categorized）。我们将始终使用字母排序视图。\n\
  \n![Image](img/00160.jpeg)\n\n如果属性窗口没有出现在屏幕上，点击菜单上的 `View`，然后 `Properties`。作为替代方案，按下\
  \ `F4` 功能键。注意属性窗口只有在表单显示时才会显示。\n\n你应该熟悉 Visual C# 环境的每个窗口，并知道它们在哪里。\n\n# 在 Visual\
  \ C# 中移动 (Moving Around in C#)\n\n## 解决方案管理器窗口 (Solution Explorer Window)\n\n打开我们在第\
  \ 1 类中使用的 `Sample` 项目（通过 `File` 菜单选择 `Open`，然后 `Project`，如果需要）。在 `\\VCSKids\\BVCS\
  \ Projects` 文件夹中找到并检查解决方案管理器窗口：\n\n![Image](img/00161.jpeg)\n\n解决方案管理器窗口显示我们有一个名为\
  \ `Sample` 的解决方案。该项目包含一个名为 `Form1.cs` 的表单文件。项目还包含 `Properties` 和 `References` 文件夹，以及一个名为\
  \ `Program.cs` 的文件。还有几个带有 `wmf` 扩展名的文件。我们现在关心的唯一文件是表单。\n\n## 属性窗口 (Properties Window)\n\
  \n找到 `Properties` 窗口。记住它在表单显示时才能显示。因此，你可能需要先确保表单显示。回顾让窗口出现在屏幕上的步骤。确保显示的是属性而不是事件。\n\
  \n![Image](img/00162.jpeg)\n\n窗口窗口顶部的下拉框被称为 `control list`。它列出了项目所使用的每个控件的名称（`Name`\
  \ 属性）以及它是控件的类型。注意，如显示所示，当前控件是 `Form`，它的名称是 `Form1`。属性列表就在此框下方。在这个列表中，你可以滚动（使用滚动条）查看控件的属性。属性名位于列表左侧，当前属性值位于右侧。滚动查看表单的属性。你看到有多少个属性了吗？随着课程的进行，你将学习其中许多。不过，现在不需要担心它们。\n\
  \n点击 `control list` 中的向下箭头（记住那是属性窗口顶部的下拉框）：\n\n![Image](img/00163.jpeg)\n\n滚动查看当前表单上所有控件的列表。注意分配的名称和控件类型。注意，如显示所示，很容易识别哪个名称指代哪个控件。例如，`picBear`\
  \ 显然是持有一个熊图片的图片框控件。\n\n\n\n选择一个控件并滚动查看该控件的属性。查看几个控件的属性。你会每个控件都有许多属性。大多数属性是默认分配的，也就是说值是由\
  \ Visual C# 赋予它的。我们将把某些属性从默认值更改，以适应我们的用途进行自定义。我们将在 `Class 3` 中学习如何更改属性。\n\n# 代码窗口\n\
  \n让我们来看一个新的窗口。记得 Visual C# 是事件驱动的 - 当检测到事件时，项目会跳转到正确的事件方法。事件方法用于告诉计算机在响应事件时执行什么。它们是实际计算机编程（使用\
  \ `C` 语言）发生的地方。我们在`Code Window`（代码窗口）查看事件方法。显示代码窗口有很多方法。一种方法是使用`Solution Explorer`（解决方案管理器）窗口中的`View\
  \ Code`按钮。另一种是点击主菜单上的`View`，然后点击`Code`。或者，作为备选方案，按下 `F7` 功能键。找到 `Sample` 项目的代码窗口。它将出现在设计窗口的\
  \ `Form1.cs` 标签页下：\n\n![Image](img/00164.jpeg)\n\n代码窗口的顶部有两个下拉框。右侧的是方法列表。它列出了代码中使用的所有方法（包括事件方法）。点击方法列表中的下拉箭头。选择\
  \ `rdoBlue_CheckedChanged` 作为方法。你应该能看到这个：\n\n![Image](img/00166.jpeg)\n\n代码窗口顶部附近是控件名称\
  \ `rdoBlue` 的 `CheckedChanged` 事件方法。尽管你现在还不知道任何 `C#`，但你应该能够设看出这里正在发生什么。由于我们在命名控件时会非常小心，你应该能识别出这个控件是单选按钮（带有一个小圆圈的那个），旁边带有\
  \ `Blue` 字样（单选按钮旁边的文字是它的 `Text` 属性）。单选按钮的状态（是否被选中）称为它的 `Checked` 属性。因此，每当我们点击 `Blue`\
  \ 单选按钮并更改其 `Checked` 属性时，该事件方法就会被调用。\n\n注意该过程仅有一行指令（暂时忽略其他行）：\n\n```\nthis.BackColor\
  \ = Color.Blue;\n```\n\n这行 `C#` 代码的意思是将名为 `this` 的控件（这是 Visual C# 用于指代表单的单词）的 `BackColor`\
  \ 属性设置为 `Blue`（由 `Color.Blue` 单词表示）。非常简单，对吧？\n\n滚动查看代码窗口中的其他代码。现在这些代码大部分看起来可能像外语，不要担心\
  \ - 它确实应该是这样的！但让你惊讶的是，即使你不懂任何 `C#`，你可能也能弄清楚正在发生什么。在随后的课程中，你将开始学习 `C#`，这类代码将变得易读。你会发现大多数\
  \ `C#` 代码都非常容易理解。编写 `C#` 代码主要关注许多细节。在大多数情况下，它是非常有逻辑且直观的。而且，你即将开始编写自己的代码了！\n\n![Image](img/00168.jpeg)\n\
  \n![Image](img/00169.jpeg)\n\n## 总结\n\n在第二节课中，我们学习了 Visual C# 环境的部分以及如何在该环境中移动。我们还学习了一些重要的新术语。\n\
  \n## 你的第一课\n\n在第二节课中，我们学习了 Visual C# 环境的部分以及如何在该环境中移动。我们还学习了一些重要的新术语。\n\n## 你的第一课\n\
  \n在第二节课中，我们学习了 Visual C# 环境的部分以及如何在该环境中移动。我们还学习了一些重要的新术语。\n\n# 复习\n\n在第二节课中，我们学习了\
  \ Visual C# 环境的部分以及如何在该环境中移动。我们还学习了一些重要的新术语。\n\n# 构建项目的步骤\n\n1. 在表单上放置控件。\n2. 分配属性。\n\
  3. 编写事件方法。\n\n## 在表单上放置控件\n\n在第二节课中，我们学习了 Visual C# 环境的部分以及如何在该环境中移动。我们还学习了一些重要的新术语。\n\
  \n![Image](img/0070.jpeg)\n\n![Image](img/0071.jpeg)\n\n![Image](img/0072.jpeg)\n\
  \n![Image](img/0073.jpeg)\n\n![Image](img/0074.jpeg)\n\n## 在表单上放置控件\n\n![Image](img/0075.jpeg)\n\
  \n## 示例\n\n确保 Visual C# 仍在运行，并且屏幕上有一个表单，以及工具箱（如果没有显示，请点击主菜单上的 `View`，然后点击 `Toolbox`）。进入工具箱并找到按钮控件。它看起来像这样：\n\
  \n![Image](img/0076.jpeg)\n\n将按钮拖放到表单上。你的表单看起来应该像这样：\n\n![Image](img/0077.jpeg)\n\
  \n\n\n\n将另一个按钮控件拖放到表单上。移动并调整它的 own。在按钮之间进行点击，你会注意到最后一次点击的控件会显示尺寸缩放句柄，使其成为活动控件。花些时间在表单上放置控件。使用如标签（labels）、文本框、单选按钮和复选框等其他控件。移动它们，调整它们的大小。尝试将你的控件组织成整齐排列的组。这些都是构建\
  \ Visual C# 项目时将需要的技能。\n\n你还需要知道如何从表单中删除控件。这是一个很容易的过程。点击你想要删除的控件。它将成为活动控件。按下键盘上的\
  \ `Del`（删除）键。该控件将被移除。在删除控件之前，请确保你确实想删除它。删除你可能已经放置在表单上的任何控件。\n\n## 设置控件属性（设计模式）\n\
  \n一旦你在表单上放置了所需的控件，你就会想要为这些控件分配属性。记住，属性指定了控件在表单上的显示方式。它们确定了诸如控件的大小、颜色、控件“显示”的内容以及在表单上的位置。当你将控件放置在表单上时，Visual\
  \ C# 会为其赋予一组默认属性。特别是，它的几何属性（控制大小和位置）是在你在表单上放置并调整控件大时设置的。但很多时候，默认属性并不是理想的，你会想要更改它们。这是通过\
  \ `Properties Window`（属性窗口）完成的。\n\n如果你的计算机上没有运行 Visual C#，请现在启动它。启动另一个新项目。设计窗口中应该有一个空白表单。如果没有，选择\
  \ `View`（视图）菜单并选择 `Designer`（设计器）。找到 `Properties Window`（如果没有，按 `<F4>`）：\n\n![Image](img/00179.jpeg)\n\
  \n如果显示的是分类属性，请点击 `Alphabetic view`（字母视图，带有 A-Z 字样的按钮）。同时确保 `Alphabetic view` 按钮旁边的\
  \ `Properties`（属性）按钮处于按下状态（在处理属性时，请务必确保此按钮处于按下状态）。记住属性窗口顶部的框是控件列表，告诉我们表单上存在哪些控件。现在，列表中只有一个控件，即表单本身。让我们来看一些表单的属性。\n\
  \n![Image](img/00182.jpeg)\n\n首先，表单有多大？所有控件都是矩形的，有两个属性定义了该矩形的大小。向下滚动属性列表并找到 `Size`（大小）属性。你会看到两个用逗号分隔的数字。第一个数字是表单的像素宽度（`Width`，像素是表单上的一个点）。第二个数字是表单的像素高度（`Height`）。点击\
  \ `Size` 属性旁边框中的小加号 `(+)`。`Width` 和 `Height` 属性将单独显示。调整表单的大小，注意 `Height` 和 `Width`\
  \ 属性发生了的变化。你也可以通过在 `Properties window` 中输入所需属性的值来更改表单的宽度高度。尝试一下。\n\n滚动到 `BackColor`\
  \ 属性。你可能猜到了这是设置表单的背景颜色。该属性列出的值可能是 `Control`（浅灰色）。要更改 `BackColor` 属性，点击 `BackColor`，然后点击列表右侧出现的下拉箭头。选择出现的三个“标签”之一：`Custom`（自定义）、`Web`\
  \ 或 `System`（系统），然后选择一种颜色。我最喜欢 `Custom`。选择此项后，会出现一个调色板，你可以选择一种新颜色并观察结果。\n\n滚动到 `Text`\
  \ 属性。此属性确定了表单标题栏中显示的内容。点击 `Text`，然后在属性窗口的右侧输入某些内容并按 `<Enter>`。注意新的 `Text` 出现在表单标题栏中。\n\
  \n设置控件属性就这些了。首先，从控件列表中选择感兴趣的控件。然后向下滚动属性并找到你想要更改的属性。点击该属性。属性可以通过输入新值（如 `Width` 和\
  \ `Height` 值以及 `Text` 属性）或从预定义选项列表中选择（以下拉列表的形式提供，如颜色值）来更改。\n\n让我们来看一些按钮属性。向你的表单添加一个按钮控件。在属性窗口的控件列表中选择该按钮。像表单一样，按钮也是矩形的。向下滚动到\
  \ `Size` 属性并点击小加号 `(+)` 符号以展开此属性。`Width` 属性给出其像素宽度，`Height` 给出像素高度。另外两个属性指定了按钮在表单上的位置。向下滚动到\
  \ `Location` 属性并展开它。显示了 `X`（`Left` 属性）和 `Y`（`Top` 属性）的值。`Left` 给出了按钮左侧相对于表单左侧的水平位置（像素值）。同样，`Top`\
  \ 是按钮顶部相对于表单顶部的垂直位置（像素值）（表单顶部被定义为标题栏的较下部分）。对于单个按钮，这些属性是：\n\n![Image](img/00183.jpeg)\n\
  \n按钮的另一个重要属性是 `Text` 属性。出现在按钮上的文本就是 `Text`。它应该指示点击该按钮时会发生什么。更改你按钮的 `Text` 属性。在表单上多放几个按钮。移动并调整它们。如果需要，更改它们的\
  \ `Text` 和 `BackColor` 属性。\n\n## 控件命名\n\n任何控件另一个重要的属性是 `Name`（名称）。由于其重要性，我们单独处理它。当我们命名控件时，想要指定两部分信息：控件的类型和控件的功能。这种命名将使我们的编程任务变得得多。\n\
  \n在 Visual C# 编程社区中，开发了一套命名控件的规则。控件名称的前三个字母（称为前缀）指定控件类型。这些前缀包括（我们将在课程中看到更多）：\n\n\
  | 控件 | 前缀 |\n| :--- | :--- |\n| Button | `btn` |\n| Label | `lbl` |\n| Text Box\
  \ | `txt` |\n| Check Box | `chk` |\n| Radio Button | `rdo` |\n\n在控件名称前缀之后，我们选择一个名称（通常以大写字母开头以表示前缀结束），指示控件的功能。完整的控件名称可以包含\
  \ 40 个字符。名称必须以字母开头（这通过使用前缀解决了），并且只能包含字母（大小写均可）、数字和下划线 `_` 字符。尽管可以使用 40 个字符的控件名称，但请保持名称简短而不丢失含义。这将为你节省大量的打字时间。\n\
  \n让我们来看一些示例控件名称，让你对如何选择有一个思路。这些是在第一课和第二课中学过的示例项目中使用的名称。示例：\n\n- `btnBeep` - 产生哔哔声的按钮\n\
  - `txtType` - 可以输入信息的文本框\n- `rdoBlue` - 将背景颜色改为蓝色的单选按钮\n- `chkTop` - 显示或隐藏玩具陀螺的复选框\n\
  - `picTop` – 带有玩具陀螺图片的图片框\n\n\n\n\n\n需要注意的是，Visual C# 语言是区分大小写的。这意味着名称 `picTop`\
  \ 和 `PICTOP` 不被视为是相同的。请确保为每个控件分配唯一的名称。我们建议在控件名称中混合使用大小写字母，以提高可读性。只需在输入控件名称时确保你使用了正确的大小写即可。\n\
  \n![Image](img/00186.jpeg)\n\n## 在运行模式下设置属性\n\n为了说明正确命名控件的重要性，让我们来看 Visual C# 中的一项常见任务。我们已经看到，开发\
  \ Visual C# 项目的步骤之一是在设计模式下建立控件属性。你也可以在项目运行模式下建立或更改属性。例如，在 Sample 项目中，当你点击单选按钮时，表单的\
  \ `BackColor` 属性发生了变化。当你点击玩具名称时，该玩具就会出现或消失。要在运行模式下更改属性，我们需要使用一行 C# 代码（你即将学习你的第一行\
  \ C# 代码！）。该行代码的格式为：\n\n```csharp\ncontrolName.PropertyName = PropertyValue;\n```\n\
  \n也就是说，我们输入控件的名称、一个点（等同于句号或小数点）、我们要更改的属性名称（在属性窗口中找到）、一个等号（称为赋值运算符）以及新值。这种格式被称为点符号表示法。确保该行以分号（`;`）结尾——Visual\
  \ C# 中的几乎每一行代码都会以分号结尾。\n\n在 Sample 中，用于在表单上显示陀螺的代码是：\n\n```csharp\npicTop.Visible\
  \ = true;\n```\n\n控件的 `Visible` 属性可以是 `true`（控件显示）或 `false`（控件不显示）。注意，适当的控件命名使得这行代码非常易于理解，即使你完全不懂任何\
  \ C#。它表示显示陀螺的图片框已设置为可见。\n\n我们刚刚使用的规则有一个例外，那就是当我们设置表单（Form）属性时。要在运行时设置表单属性，你使用 Visual\
  \ C# 关键字 `this` 来引用表单。例如，在 Sample 中，将表单的背景颜色设置为蓝色，我们使用：\n\n```csharp\nthis.BackColor\
  \ = Color.Blue;\n```\n\n![Image](img/00188.jpeg)\n\n## 控件名称如何在事件方法中使用\n\n另一个正确命名控件的重要性变得明显出来的地方是当我们编写事件方法时（下文讨论）。我们已经看到事件方法是在代码窗口中查看的。事件方法的结构如下：\n\
  \n![Image](img/00191.jpeg)\n\n有很多内容要看。第一行长代码在这里占了两行（由于页边距限制），是标题行。然后方法以左大括号（`{`）开始并以右大括号（`}`）结束。你会在\
  \ C# 中看到很多括号。实际的 C# 代码位于这两个大括号之间。\n\n![Image](img/00193.jpeg)\n\n让我们来看标题行，暂时忽略括号中的信息。注意，控件名称被原样用作事件名称。你能看到通过正确的命名，我们可以轻松地识别每个控件的事件方法吗？\n\
  \n再次以 Sample 为例，`rdoBlue` 控件的 `CheckedChanged` 事件方法是：\n\n```csharp\nprivate void\
  \ rdoBlue_CheckedChanged(object sender, EventArgs e)\n{\n    // 将表单颜色改为蓝色\n    this.BackColor\
  \ = Color.Blue;\n}\n```\n\n我们承认这是当用户更改 `rdoBlue` 单选按钮的 `Checked` 属性（点击它）时执行的代码。适当的命名使得识别和阅读事件方法变得非常简单。再次，这将使你作为程序员的工作变得容易得多。现在，让我们编写第一个事件方法。\n\
  \n![Image](img/00195.jpeg)\n\n# 编写事件方法\n\n![Image](img/00197.jpeg)\n\n构建 Visual\
  \ C# 程序的第三步是为表单上的控件编写事件方法。要编写事件方法，我们使用代码窗口。回顾在你的项目中显示代码窗口的方法。这一步是我们需要实际编写 C# 代码或进行计算机编程的地方。你现在学不会很多\
  \ C#，只需学习寻找事件方法和输入代码的过程。\n\n每个控件都有许多与其关联的可能事件。你不需要为每个事件方法编写 C# 代码——只编写你希望计算机做出响应的那些方法。一旦你决定某个事件需要被“编码”，你就决定了想让该事件方法中发生什么，并将这些愿望转化为实际的\
  \ C# 代码。如之前所示，每个事件方法的格式为：\n\n```csharp\nprivate void controlName_EventName(object\
  \ sender, EventArgs e)\n{\n    // [C# 代码写在此处]\n}\n```\n\n在标题行中（记住它是一行长代码），单词 `private`\
  \ 表示此方法对于表单来说是私有的（仅供表单使用——现在不用担心它的意思）。单词 `void` 表示该方法没有计算任何结果。括号内的单词告诉我们向事件方法提供了哪些信息。这些值被称为方法参数，我们现在不必关心它们。代码位于该标题行之后的大括号之间。\n\
  \n![Image](img/00199.jpeg)\n\n编写 C# 代码是开发 Visual C# 程序的创造性部分。而且，这也是你需要非常精确的地方。拼写错误、缺少标点符号或缺少运算符都会导致程序无法运行。由于编写程序需要精确性，编写事件方法的流程如下：\n\
  \n- 决定你需要哪些事件\n- 决定你想让该事件方法中发生什么\n- 将这些愿望转化为实际的 C# 代码\n- 在代码窗口中建立事件方法\n- 输入 C# 代码\n\
  \n这种过程通过示例说明最好。示例保存为 `VCSKids`。\n\n## 示例\n\n如果 Visual C# 没有运行，启动它并创建一个新项目。命名为 `FirstCode`。\n\
  \n- 在表单上放置一个按钮。\n- 将表单的 Text 属性设置为 `My First`。\n- 将按钮的 Name 属性设置为 `btnBeep`。\n-\
  \ 将按钮的 Text 属性设置为 `Beep!!`。\n\n![Image](img/00200.jpeg)\n\n在设计的此阶段，你的表单看起来应该是：\n\
  \n![Image](img/00202.jpeg)\n\n我们要编写一个事件方法——响应按钮 `Click` 事件的方法。当我们点击该按钮时，我们希望计算机发出哔哔声。让我们看看如何建立事件方法。\n\
  \n显示代码窗口（按下 `F7` 是一种方法；在菜单中选择 `View` 然后选择 `Code` 是另一种方法）：\n\n![Image](img/0204.jpeg)\n\
  \n标题行 `namespace FirstCode` 开始代码。在 Visual C# 中，构成你的项目的一切都称为命名空间。你的表单被称为类。`public\
  \ Form1()` 开始表单构造函数。构造函数由一行 `InitializeComponent();` 组成。此代码访问 Visual C# 环境编写的程序来设置你设计的表单。再次注意使用大括号来开始和结束代码段。你不需要担心这些任何代码——只需不要更改它们。\n\
  \n我们唯一更改的代码是与我们建立和编写的事件方法相关的。回想起查看属性窗口时，我们提到除了建立控件属性外，该窗口也用于建立事件方法。注意，由于属性窗口有两个用途，你应该始终注意工具栏中选择了\
  \ `Properties` 还是 `Events` 按钮。为特定控件建立空白事件方法的步骤如下：\n\n1. 在设计模式下查看应用程序表单。\n2. 使目标控件处于激活状态，使其名称出现在属性窗口顶部。\n\
  3. 转到属性窗口——选择 `Events` 按钮（看起来像闪电）。\n4. 找到感兴趣的事件。\n5. 双击事件名称。\n\n\n\n\n\n此时，代码窗口将打开并显示出新生成的事件方法。让我们按照这些步骤来处理按钮控件。\n\
  \n### 按钮控件点击事件\n\n我们想要为按钮控件的 `Click` 事件编写代码。显示表单设计窗口。在属性窗口的下拉框中选择按钮控件 `btnBeep`（或点击表单上的按钮控件）使其变为激活。向下滚动事件列表并高亮\
  \ `Click` 事件：\n\n![Image](img/00206.jpeg)\n\n任何已分配给 `Click` 事件方法的名称将列在属性窗口的右侧。该区域应该是应该是的——系统会自动分配一个名称。双击属性窗口中的\
  \ `Click` 单词。\n\n代码窗口将打开并显示如下：\n\n![Image](img/00207.jpeg)\n\n注意 `btnBeep` 按钮的 `Click`\
  \ 方法现在显示在表单构造函数代码下方。这是所有事件方法出现的地方。如果你返回属性窗口，方法名 `btnBeep_Click` 将出现在 `Click` 事件旁边。我们在方法标题头行之后的两个大括号之间输入让电脑蜂鸣的代码。\n\
  \n代码窗口的作用就像一个文字处理器。你可以在窗口中输入文本，并使用许多普通的编辑功能，如剪切、粘贴、复制、查找和替换。随着你成为越来越熟练的程序员，你会习惯使用代码窗口。点击两个大括号之间的区域。完全按照所示输入单行代码：\n\
  \n```cs\nSystem.Media.SystemSounds.Beep.Play();\n```\n\n代码窗口现在应该是这样的：\n\n![Image](img/00209.jpeg)\n\
  \n注意在你输入该行代码后，它被缩进了并在末尾添加了括号（这是一个内置函数）。Visual C# 环境执行了这种额外的“格式化”。这一行长代码：\n\n```cs\n\
  System.Media.SystemSounds.Beep.Play();\n```\n\n这是一条 C# 指令，只需告诉电脑蜂鸣。你现在已经写了第一行 C#\
  \ 代码。\n\n## 运行项目\n\n你的项目现在已准备好运行了。运行项目（点击工具栏上的启动按钮或按 `<F5>`）。表单将出现：\n\n![Image](img/00210.jpeg)\n\
  \n（如果没有出现，请返回并确保你已正确完成了所有步骤）。点击按钮。电脑应该发出蜂鸣声，或者听到类似蜂鸣的声音。你触发了 `btnBeep` 控件的 `Click`\
  \ 事件。电脑识别了此并进入 `btnBeep_Click` 事件方法。在那里，它解释了代码行 `Console.Beep();` 并让电脑蜂鸣。停止项目。回到代码窗口找到\
  \ `btnBeep_Click` 事件。在“蜂鸣”行之后，添加此行：\n\n```cs\nbtnBeep.BackColor = Color.Blue;\n\
  ```\n\n确保你完全按照所示输入，特别注意字母的大小——计算机程序中的代码必须完全精确。再次运行项目。点击按钮。解释控件、事件方法和 C# 代码之间发生了什么。停止项目。\n\
  \n### Visual C# 智能提示 (Intellisense)\n\n你可能注意到，当你添加第二行代码时，只要你输入 `btnBeep` 然后一个点，就会弹出一个带有许多完成选项的小窗口（`BackColor`\
  \ 就是其中之一）。同样，一旦你输入 `Color` 然后一个点，就会弹出一个颜色选择（包括 `Blue`）。这就是 Visual C# 的智能提示功能（你可能在编写让电脑蜂鸣的代码时也注意到了它）。它在编写代码时非常有帮助。智能提示是\
  \ Visual C# 中非常实用的部分。你应该熟悉它的用法以及如何选择建议的值。你通常只需向下滚动列表（你可以输入选择项的前几个字母来加速滚动），选择所需的项目并继续输入。该选择将插入到适当的位置。我们现在告诉你们智能提示功能，是为了让你在编写代码时，小框开始弹出时不会感到意外。\n\
  \n![Image](img/00211.jpeg)\n\n![Image](img/00213.jpeg)\n\n## 总结\n\n你现在已经完成了第一个完整的\
  \ Visual C# 项目。你遵循了构建应用的三个步骤：\n\n1. 在表单上放置控件\n2. 分配控件属性\n3. 编写控件事件方法\n\n无论是构建像这里这样简单的项目，还是非常复杂的项目，你都遵循这些相同的步骤。\n\
  \n现在，了解了这些步骤，你已经准备好开始学习 Visual C# 工具箱，学习每个控件的作用。你现在可以开始学习 C# 语言的元素来帮助你编写程序。而且，你可以开始学习\
  \ Visual C# 环境的新功能，以帮助你进行项目开发。在随后的每节课中，你将都会这样做：学习一些新控件，学习一些 C#，并学习更多关于 Visual C#\n\
  \n# 4 项目设计、表单、按钮\n\n![Image](img/00145.jpeg)\n\n## 复习与预览\n\n你现在已经学习了 Visual C# 项目的部分以及构建项目所需的三个步骤：\n\
  \n1. 在表单上放置控件。\n2. 设置控件属性。\n3. 编写所需的事件方法。\n\n你是否已经有一些想要使用 Visual C# 构建的项目想法？如果是，那太棒了。从这节课开始，你将开始开发自己的编程技能。在接后的每节课中，你将学习\
  \ Visual C# 环境的一些新功能、一些 C# 以及更多关于 Visual C# 的知识。在本节课中，你将学习项目设计、表单并构建一个完整项目。\n\n\
  ## 项目设计\n\n![Image](img/0216.jpeg)\n\n你正准备使用 Visual C# 开发项目。我们将提供项目供你构建，你可能也有自己的想法。无论如何，看到想法变成计算机程序是有趣且令人兴奋的。但在开始项目之前，花一点时间思考你想做什么。这种良好设计的思想将为你节省大量时间，并产生一个更好的项目。\n\
  \n良好的项目设计并不困难。主要思想是创建一个易用、易懂且无错误的项目。这听起来很合理，不是吗？花时间思考你希望项目做的一切。程序需要哪些信息？计算机确定哪些信息？决定你需要哪些控件来提供这些信息。设计一个良好的界面（界面涉及控件在表单上的放置）。考虑外观和易用性。如果可能，使界面与其他应用程序保持一致。对于使用\
  \ Visual C# 开发的项目，熟悉性是有好处的。\n\n\n\n\n\n在 Visual C# 中创建项目时，它会自动保存到你指定的位置。如果你正在进行大量更改，可能偶尔想在运行项目之前保存你的工作。点击\
  \ Visual C# 工具栏上的 `Save All` 按钮执行此操作。寻找一个看起来像几块软盘的按钮。（你认为人们过多久还会知道软盘长什么样？—— 大多数新机器甚至没有软盘驱动器了！）\n\
  \n![Image](img/00218.jpeg)\n\n在运行项目之前或离开 Visual C# 之前，务必确保保存你的项目。\n\n![Image](img/00220.jpeg)\n\
  \n# 在线帮助\n\n很多时候，在 Visual C# 环境中工作时，你会对某些事情产生疑问。你可能想知道某个特定控件的作用、某个属性的用途、某个控件拥有事件，或者\
  \ C# 中某个特定术语的含义。当你遇到困难时，获取帮助的一种极方法是询问知道答案的人。人们通常乐意帮助你——他们喜欢帮助你学习这种想法。你也可以尝试在书中寻找答案，市面上有很多\
  \ Visual C# 的书籍！或者，另一种获取帮助的好方法是使用 Visual C# 在线帮助系统。\n\n大多数 Windows 应用程序（包括 Visual\
  \ C#）都有供使用的帮助文件。要访问 Visual C# 帮助系统，点击主菜单中的 `Help` 项，然后点击 `Contents`。此时，你可以搜索你需要帮助的主题，或滚动查看所有主题。Visual\
  \ C# 帮助系统与其他所有的 Windows 帮助系统一样。如果你曾经用过任何在线帮助系统，那么在 Visual C# 中使用该系统应该是很简单的。如果你从未用过在线帮助系统，请向别人寻求。它们非常好用。或者，点击\
  \ Windows 任务栏上的 `Start`，然后选择 `Help`。你可以使用那个在线帮助系统来学习如何使用在线帮助系统！\n\n![Image](img/00221.jpeg)\n\
  \nVisual C# 在线帮助系统的一个非常棒特性是它是“上下文敏感”的。这意味着什么？嗯，让我们试一下。启动 Visual C# 并创建一个新项目。转到属性窗口。向下滚动显示表单属性的窗口，点击\
  \ `BackColor` 单词。该单词被高亮。按下 `<F1>` 键。出现了一个关于 `Form.BackColor` 属性的信息屏幕：\n\n![Image](img/00224.jpeg)\n\
  \n帮助系统具有智能。它知道由于你高亮了单词 `BackColor`，然后按了 `<F1>`（当你需要帮助时，始终是按 `<F1>`），你正在请求关于 `BackColor`\
  \ 的帮助。每当你在 Visual C# 中工作时按下 `<F1>`，程序都会查看你所在的位置，并尝试根据上下文确定你正在寻求哪方面的帮助。它会查看如属性窗口中的高亮单词或光标在代码窗口中的位置等内容。\n\
  \n在使用 Visual C# 工作时，你会发现你会经常使用“上下文敏感”帮助。很多时候，你可以获得可能产生的问题的快速答案。习惯依赖 Visual C# 在线帮助系统来寻求协助。关于\
  \ Visual C# 环境的新材料就到这里了。现在，让我们详细查看两个重要的控件：表单本身和按钮。然后我们将开始学习 C# 语言并构建一个完整的项目。\n\n\
  ![Image](img/00225.jpeg)\n\n## 表单控件 (Form)\n\n我们已经看到表单是 Visual C# 项目开发中的中心控件。没有表单，就没有项目！让我们看看表单控件的一些重要属性和事件。当你开始一个新项目时，表单就会出现。\n\
  \n![Image](img/00227.jpeg)\n\n### 属性\n\n与所有控件一样，表单有许多（40 多个）属性。幸运的是，我们只需要知道其中一些。我们将关注的属性是：\n\
  \n| 属性 |  |\n| :--- | :--- |\n| `Name` | 用于识别表单的名称。在本课程中，我们将始终使用默认的 `Form1` 作为名称。\
  \ |\n| `Text` | 显示在表单标题栏中的文本。 |\n| `BackColor` | 表单的背景颜色。 |\n| `Icon` | 在表单标题栏中显示的图标的引用（我们将在第\
  \ 7 章查看创建图标）。 |\n| `Width` | 表单的像素宽度（展开 `Size` 属性） |\n| `Height` | 表单的像素高度（展开 `Size`\
  \ 属性） |\n| `FormBorderStyle` | 表单可以是可调整大小的（可以使用鼠标调整大小），也可以是固定大小。 |\n| `StartPosition`\
  \ | 确定应用程序启动时表单在计算机屏幕上的位置（我们通常使用 `CenterScreen` 值）。 |\n\n表单主要是其他控件的“容器”。作为容器意味着放置在表单上的许多控件（下一个学习的按钮控件除外）将共享\
  \ `BackColor` 属性。要更改此行为，选择所需的控件（在将其放置于表单后）并更改颜色。\n\n## 示例\n\n为了熟悉这些属性，启动 Visual\
  \ C# 并启动一个仅包含表单的新项目。设置 `Height` 和 `Width` 属性值（位于属性窗口的 `Size` 下方），并观察它们对表单大小的影响。调整表单大小并注意属性窗口中这些值是如何变化的。设置\
  \ `Text` 属性。选择一个新的背景颜色。\n\n## 事件\n\n![Image](img/00230.jpeg)\n\n表单支持事件。也就是说，它可以对某些用户交互做出响应。在本课程中我们只关注三个表单事件：\n\
  \n| 事件 | 说明 |\n| :--- | :--- |\n| `Click` | 用户点击表单时执行。 |\n| `Load` | 表单首次加载时执行。\
  \ |\n| `FormClosing` | 项目结束时执行。 |\n\n记住，要在 Visual C# 中工作时创建任何事件方法，使表单成为活动控件，在属性窗口中选择\
  \ `Events`，然后双击事件名称。事件方法将出现在代码窗口中。使用代码窗口顶部的方法下拉框查看已创建的方法。\n\n### 表单的典型用法\n\n对于本及后续章节中的每个控件，我们将提供有关如何使用该控件的信息。表单通常的设计步骤如下：\n\
  \n> ➢ 设置 `Text` 属性为一个有意义的标题。\n> ➢ 设置 `StartPosition` 属性（在本课程中，此属性将设置为 `CenterScreen`）\n\
  > ➢ 设置 `FormBorderStyle` 的某个值。在本课程中我们使用 `FixedSingle`。\n> ➢ 在表单的 `Load` 事件中编写任何必要的初始化代码。\n\
  > ➢ 在表单的 `FormClosing` 事件中编写任何必要的清理代码。\n\n# 按钮控件\n\n![Image](img/00233.jpeg)\n\n\
  按钮是最常用的 Visual C# 控件之一。按钮用于启动、暂停或结束特定的过程。从工具箱中选择按钮。它显示为：\n\n工具箱中：\n\n![Image](img/00236.jpeg)\n\
  \n表单上（默认属性）：\n\n![Image](img/00238.jpeg)\n\n### 属性\n\n按钮的一些实用用属性有：\n\n| 属性 | 说明\
  \ |\n| :--- | :--- |\n| `Name` | 用于识别按钮的名称。按钮名称的三字母前缀是 `btn`。 |\n| `Text` | 显示按钮上的文本（标题）。\
  \ |\n| `TextAlign` | 文本在按钮上的对齐方式。 |\n| `Font` | 设置文本的样式、大小和类型。 |\n| `BackColor`\
  \ | 按钮的背景颜色。 |\n| `ForeColor` | 按钮文本的颜色。 |\n\n\n\n\n\n| 属性 | 说明 |\n| :--- | :---\
  \ |\n| 左侧 (Left) | 表单左侧到按钮左侧的距离（在属性窗口中通过 `X` 引用，展开 `Location` 属性）。 |\n| 顶部 (Top)\
  \ | 表单顶部到按钮顶部的距离（在属性窗口中通过 `Y` 引用，展开 `Location` 属性）。 |\n| 宽度 (Width) | 按钮的宽度（像素）（展开\
  \ `Size` 属性）。 |\n| 高度 (Height) | 按钮的高度（像素）（展开 `Size` 属性）。 |\n| 可用 (Enabled) | 决定按钮是否可以响应用户事件（运行模式下）。\
  \ |\n| 可见 (Visible) | 决定按钮是否显示在表单上（运行模式下）。 |\n\n## \n\n启动 Visual C# 并创建一个新项目。在表单上放置一个按钮。移动按钮并观察\
  \ `X` 和 `Y` 属性的变化（列在属性窗口的 `Location` 下）。调整按钮的大小，观察 `Width` 和 `Height` 如何变化。设置 `Text`\
  \ 属性。更改 `BackColor` 和 `ForeColor` 属性。\n\n许多控件除了按钮外，都有 `Font` 属性，所以让我们花一点时间来查看如何更改它。`Font`\
  \ 决定了 `Text` 的外观。当你点击属性窗口中的 `Font` 时，窗口右侧会弹出一个带有省略号的按钮：\n\n![Image](img/00239.jpeg)\n\
  \n点击此按钮，将出现一个 `Font Window`：\n\n![Image](img/00240.jpeg)\n\n通过此窗口，你可以选择三项主要信息：`Font`（字体）、`Font\
  \ Style`（字体样式）和 `Size`（大小）。你还可以使用下划字体。此窗口列出了你计算机上存储的所有字体信息。要设置 `Font` 属性，请在该窗口中进行选择并点击\
  \ OK。为按钮的 `Text` 属性尝试不同的字体、样式和字体大小。\n\n按钮列出的另外两个属性是 `Enabled` 和 `Visible`。这些属性中的每一个可以是\
  \ `True`（开启）或 `False`（关闭）。大多数其他控件也有这些属性。你为什么需要这些？\n\n如果控件的 `Enabled` 属性为 `False`，用户将无法访问该控件。假设你有一个带有\
  \ `Start` 和 `Stop` 按钮的秒表项目：\n\n![Image](img/00242.jpeg)\n\n你想让用户点击 `Start` 然后点击\
  \ `Stop` 来获取经过的时间。你不希望用户在点击 `Start` 按钮之前点击 `Stop` 按钮。因此，最初，将 `Start` 按钮的 `Enabled`\
  \ 属性设置为 `True`，并将 `Stop` 按钮的 `Enabled` 属性设置为 `False`。这样，用户只能点击 `Start`。一旦用户点击了 `Start`，你就交换属性值。即将\
  \ `Start` 按钮的 `Enabled` 属性变为 `False`，将 `Stop` 按钮的 `Enabled` 属性变为 `True`。这样，用户现在只能点击\
  \ `Stop`。\n\n`Enabled` 属性为 `False` 的效果只有在 Visual C# 处于运行模式时才会明显。当按钮未启用（`Enabled`\
  \ 为 `False`）时，它看起来是“模糊”的，用户无法点击它。当秒表上的 `Stop` 未启用时，它看起来像这样：\n\n![Image](img/00244.jpeg)\n\
  \n因此，当你想让表单上的控件临时禁用时，请使用 `Enabled` 属性。这是我们在之前讨论的项目设计过程中做出的决策。\n\n`Visible` 属性的影响更彻底一些。当控件的\
  \ `Visible` 属性设置为 `False`（其默认值为 `True`）时，该控件甚至不会出现在表单上！现在，我们为什么要将刚刚放置在表单上、设置了属性并编写了事件方法的控件设置为不可见呢？\n\
  \n\n\n\n- 在块内对代码进行缩进是一种良好的编码习惯。这使得代码更易阅读。注意我们在看过的示例中，每个块都缩进了 4 个空格。Visual C# 编辑器会自动为你块中的代码进行缩进。\n\
  - 每一个 C# 语句都以分号结束。语句是一个会产生某些动作的程序表达式（例如，在上节课中用于让计算机发出“哔”声的语句）。请注意，并不是所有的 C# 表达式都是语句（例如，定义事件方法的行就没有分号）。\n\
  \n随着我们学习的进行，我们将学习更多的 C# 编程规则。\n\n# 赋值语句 (Assignment Statement)\n\n![Image](img/00249.jpeg)\n\
  \nC# 中最简单、最常用的语句是赋值语句。它的形式如下：\n\n```\nleftSide = rightSide;\n```\n\n符号 `=` 被称为赋值运算符。你可能认出这个符号是你在算术运算中使用的等号，但在计算机编程中它不被称为等号。这是为什么呢？\n\
  \n在赋值语句中，我们说赋值语句左侧的内容被赋值语句右侧的内容替换。赋值语句的左侧只能是一个项，例如一个属性。赋值语句的右侧可以是任何合法的 C# 表达式。它可能包含一些需要执行的数学运算，或者需要评估的其他内容。如果有此类评估，它们将在赋值之前完成。我们现在说的是非常泛泛的术语，而且必须如此。当你再多学一点\
  \ C# 时，赋值语句的概念将变得显而易见。\n\n# 属性类型 (Property Types)\n\n回想属性描述了关于控件的某些信息：尺寸、颜色、外观。每个属性根据它所代表的信息类型具有特定的类型。当我们在设计模式下使用属性窗口设置值时，Visual\
  \ C# 会自动提供正确的类型。如果我们想在事件方法中使用 C# 赋值语句更改属性，我们必须知道属性的类型，以便为它分配一个类型正确的值。记住，我们使用所谓的“点表示法”（dot\
  \ notation）在运行模式更改属性：\n\n```\ncontrolName.PropertyName = PropertyValue;\n```\n\n\
  `controlName` 是分配给控件的 `Name` 属性，`PropertyName` 是属性名，`PropertyValue` 是我们分配给 `PropertyName`\
  \ 的新值。我们将关注四种属性类型。\n\n### int 类型\n第一种属性类型是 `int`（代表 integer）类型。这些属性是用整数、非小数数字表示的属性。如\
  \ `Top`、`Left`、`Height` 和 `Width` 等属性都是整数类型。因此，如果我们为整数类型属性赋值，我们将使用整数数字。例如，为了将表单的宽度属性更改为\
  \ 1100 像素，我们会在 C# 中写道：\n\n```\nthis.Width = 1100;\n```\n\n记住关键字 `this` 用于引用表单。这表示我们用新值\
  \ `1100` 替换表单当前的 `Width`。注意，在 C# 中你将 1,100 写成 `1100` —— 我们不能在大数字中使用逗号。\n\n### Color\
  \ (颜色) 类型\n第二种属性类型涉及颜色。我们需要它来设置 `BackColor` 等属性。幸运的是，Visual C# 有一组内置颜色供我们选择。要设置控件颜色（由\
  \ `ColorPropertyName` 描述），我们输入：\n\n```\ncontrolName.ColorPropertyName = Color.ColorName;\n\
  ```\n\n一旦我们在赋值语句的右侧输入 `Color` 单词和点号，整个供选择的颜色名称列表就会神奇地出现。要将表单背景颜色更改为蓝色，使用：\n\n```\n\
  this.BackColor = Color.Blue;\n```\n\n### bool (布尔) 类型\n另一种属性类型是 `bool`（代表 Boolean）类型。它来源于一位著名的数学家（Boole）。它可以有两个值：`true`\
  \ 或 `false`。我们看到按钮的 `Enabled` 和 `Visible` 属性具有布尔值。因此，在处理布尔类型属性时，我们必须确保只分配 `true`\
  \ 值或 `false` 值。要让表单消失（这不是好主意！），我们将使用赋值语句：\n\n```\nthis.Visible = false;\n```\n\n\
  这表示表单当前的 `Visible` 属性被布尔值 `false` 替换。我们可以通过以下代码让它回来：\n\n```\nthis.Visible = true;\n\
  ```\n\n在处理布尔值时有一个可能的混点。当使用属性窗口设置布尔值时，两个选项是 `True` 或 `False`。在使用 C# 代码设置布尔值时，两个选项是\
  \ `true` 或 `false`。也就是说，在一种情况下使用的是大写字母单词，而在另一种情况下使用的是小写字母单词。编写代码时请注意这一点。一个常见的错误是使用大写值，而不是正确的小写值。\n\
  \n### string (字符串) 类型\n我们这里查看的最后一种属性类型是 `string` 类型。这种类型的属性正如其定义所说——字符字符串。字符串可以是一个名称、一个数字字符串、一个句子、一个段落、任何字符。而且，很多时候一个字符串完全不包含字符（空字符串）。`Text`\
  \ 属性是一个字符串类型属性。我们在 Visual C# 中将进行大量的字符串工作，所以这是你应该熟悉的内容。在分配字符串类型属性时，唯一的技巧是确保字符串被引号（“\
  \ ”）括起来。你可能会忘记这一点，因为字符串类型属性的值在属性窗口中并没有被引号括起来。为了给我们的表单在标题栏添加标题，我们会使用：\n\n```\nthis.Text\
  \ = \"这是一个标题\";\n```\n\n# 注释 (Comments)\n\n![Image](img/0251.jpeg)\n\n当我们谈论项目设计时，提到过编写\
  \ C# 代码应该遵循遵守规则。其中一个规则就是对代码添加注释。你可以在代码中放置非执行的语句（被计算机忽略的内容）来解释你在做什么。这些注释可以帮助理解代码。它们也让未来的代码更改变得更容易。\n\
  \n要在代码中放置注释，请使用注释符号双斜杠 `//`。注释符号后的任何内容都将被计算机忽略。你可以让注释占据一行 C# 代码，如下：\n\n```\n// 将表单改为蓝色\n\
  this.BackColor = Color.Blue;\n```\n\n或者，你可以将注释放在赋值语句同一行：\n\n```cs\nthis.BackColor\
  \ = Color.Blue; // 使背景变为蓝色\n```\n\n你作为程序员，应该决定对代码进行多少注释。我们将在提供的项目中尝试提供足够的注释。现在，进入第一个这样的项目。\n\
  \n# 项目 - 表单趣味 (Form Fun)\n\n![Image](img/0253.jpeg)\n\n## 项目设计\n\n在这个项目中，我们将使用按钮对表单进行有趣的尝试。我们将有一个让表单放大的按钮、一个让表单缩小的按钮，以及两个更改表单颜色的按钮。我们还将两个让其他按钮消失并重新出现的按钮。此项目保存为\
  \ `FormFun`，位于项目文件夹（VCSKids\\VCSK Projects）。\n\n## 在表单上放置控件\n\n在 Visual C# 中启动新项目。调整表单尺寸，使六个按钮能够放在表单上。在表单上放置六个按钮。调整并移动按钮，直到表单看起来像这样：\n\
  \n![Image](img/0103.jpeg)\n\n如果你使用 Windows 应用程序了一段时间，你可能已经使用过被称为“复制和粘贴”的编辑功能。也就是说，你可以复制想要复制的内容，移动到你想放置副本的地方，然后粘贴。这在文字处理中是经常完成的操作。你可能在玩\
  \ Visual C# 时已经发现你可以复制和粘贴控件。在这里对按钮控件进行尝试，在其他项目中也可以这样做。效果非常好。\n\n## 设置控件属性\n\n\n\n\
  \n使用属性窗口设置控件属性。请记住，要更改属性窗口中选中的控件，您可以使用窗口顶部的控件列表，也可以直接点击所需的控件。对于项目的控件属性，我们将始终按照它们的默认名称列出控件（这些是由\
  \ Visual C# 在控件放置于表单时分配的名称）。\n\n| Form1 Form: | | |\n| :--- | :--- | :--- |\n| |\
  \ Property Name | 属性 Value |\n| | StartPosition | CenterScreen |\n| | Text | Form\
  \ Fun |\n| button1 Button: | | |\n| | Property Name | 属性 Value |\n| | Name | `btnShrink`\
  \ |\n| | Text | Shrink Form |\n| button2 Button: | | |\n| | Property Name | 属性 Value\
  \ |\n| | Name | `btnGrow` |\n| | Text | Grow Form |\n| button3 Button: | | |\n|\
  \ | Property Name | 属性 Value |\n| | Name | `btnHide` |\n| | Text | Hide Buttons\
  \ |\n| button4 Button: | | |\n| | Property Name | 属性 Value |\n| | Name | `btnRed`\
  \ |\n| | Text | Red Form |\n| button5 Button: | | |\n| | Property Name | 属性 Value\
  \ |\n| | Name | `btnBlue` |\n| | Text | Blue Form |\n| button6 Button: | | |\n|\
  \ | Property Name | 属性 Value |\n| | Name | `btnShow` |\n| | Text | Show Buttons\
  \ |\n| | Visible | False |\n\n您可以根据需要更改其他属性——也许更改按钮的 `Font` 属性。当设置完属性后，您的表单应该像这样：\n\
  \n![Image](img/00256.jpeg)\n\n我们现在有六个按钮，两个用于更改表单大小，两个用于更改表单颜色，一个让按钮消失，一个让按钮重新出现。注意\
  \ `Show Buttons` 按钮的 `Visible` 属性为 `False`。我们起不希望它显示在表单上，因为按钮已经在那里了。当我们通过点击 `Hide\
  \ Buttons` 控件（通过更改它们的 `Visible` 属性）让按钮消失时，我们将显示 `Show Buttons` 按钮。这很合理，对吧？但是，既然\
  \ `Show Buttons` 按钮的 `Visible` 属性是 `False`，为什么它会在那里呢？请记住，`False` 的 `Visible` 属性只会在运行时可见。\n\
  \n![Image](img/00259.jpeg)\n\n# 编写事件方法\n\n我们的表单上有六个按钮。我们需要为这些按钮中的每一个编写 `Click` 事件方法代码。我们还想为表单编写一个\
  \ `Click` 事件方法——我们将解释其原因。表单上有一个可以让表单缩小的按钮。如果我们把它缩小得太小，以至于无法点击按钮让它再次变大怎么办？我们可以通过允许点击表单也能让表单放大来避免这种情况。这种“未雨绸缪”是我们讨论过的项目设计概念之一。\n\
  \n每个事件方法都是使用属性窗口创建的。要创建方法，请在表单上选择所需的控件并进入属性窗口。点击工具栏上的 `Events` 按钮，向下滚动到所需的事件（在此处都是\
  \ `Click`），并双击事件名称。代码窗口将打开并显示该方法。然后点击标题行之后的大括号之间的区域，并开始输入代码。操作就这么简单。但再次，请确保您输入的输入与这些笔记中写的完全一致。您必须做到精确！\n\
  \n首先，让我们输入 `btnShrink_Click` 事件方法。在这个事件方法中，我们将表单高度减少 10 像素，并将表单宽度减少 10 像素：\n\n```csharp\n\
  private void btnShrink_Click(object sender, EventArgs e)\n{\n    // Shrink the form\n\
  \    // Decrease the form height by 10 pixels\n    this.Height = this.Height - 10;\n\
  \    // Decrease the form width by 10 pixels\n    this.Width = this.Width - 10;\n\
  }\n```\n\n在查看其他事件方法之前，让我们仔细观察这一个，因为它使用了我们尚未清楚讨论过的观点。这是当您点击标记为 Shrink Form 的按钮时执行的事件方法。您应该很容易识别注释语句。非注释语句更改了表单的高度和宽度。更改高度的语句：\n\
  \n`this.Height = this.Height – 10;`\n\n回想赋值运算符 (`=`) 是如何工作的。首先计算右侧。因此，从当前的表单高度中减去（使用\
  \ `-` 符号）10。该值被分配给表达式的左侧，即 `this.Height`。结果是表单的 `Height` 属性被减去 10 像素后的值所替换。在这行代码之后，`Height`\
  \ 属性减少了 10，表单在屏幕上看起来变小了。\n\n这个表达式还解释了为什么我们称赋值运算符 (`=`) 为赋值，而不是等号。任何人都能看出这个表达式的左侧不可能等于右侧。无论\
  \ `this.Height` 是多少，右侧总是比左侧小 10。但是，尽管这不是一个等式，但您经常会听到程序员将此语句读作“this.Height 等于 this.Height\
  \  10”，尽管他们知道这不是真的！在您开始编写自己的程序时，请记住赋值语句是如何工作的。\n\n现在，让我们看看其他事件方法。`btnGrow_Click`\
  \ 事件方法将表单高度增加 10 像素，并将表单宽度增加 10 像素：\n\n```csharp\nprivate void btnGrow_Click(object\
  \ sender, EventArgs e)\n{\n    // Grow the form\n    // Increase the form height\
  \ by 10 pixels\n    this.Height = this.Height + 10;\n    // Increase the form width\
  \ by 10 pixels\n    this.Width = this.Width + 10;\n}\n```\n\n`btnRed_Click` 事件方法将表单背景颜色变为红色：\n\
  \n```csharp\nprivate void btnRed_Click(object sender, EventArgs e)\n{\n    // Make\
  \ form red\n    this.BackColor = Color.Red;\n}\n```\n\n而 `btnBlue_Click` 事件方法将表单背景颜色变为蓝色：\n\
  \n```csharp\nprivate void btnBlue_Click(object sender, EventArgs e)\n{\n    // Make\
  \ form blue\n    this.BackColor = Color.Blue;\n}\n```\n\n`btnHide_Click` 事件方法用于隐藏除\
  \ btnShow` 以外的所有按钮（将 `Visible` 属性设为 `false`），并将 `btnShow` 设置为可见（注意在编写代码时使用小写的 true\
  \ 和 false）：\n\n```csharp\nprivate void btnHide_Click(object sender, EventArgs e)\n\
  {\n    // Hide all buttons but btnShow\n    btnGrow.Visible = false;\n    btnShrink.Visible\
  \ = false;\n    btnHide.Visible = false;\n    btnRed.Visible = false;\n    btnBlue.Visible\
  \ = false;\n    // Show btnShow button\n    btnShow.Visible = true;\n}\n```\n\n\
  并且 `btnShow_Click` 事件方法反转了这些效果：\n\n```csharp\nprivate void btnShow_Click(object\
  \ sender, EventArgs e)\n{\n    // Show all buttons but btnShow\n    btnGrow.Visible\
  \ = true;\n    btnShrink.Visible = true;\n    btnHide.Visible = true;\n    btnRed.Visible\
  \ = true;\n    btnBlue.Visible = true;\n    // Hide btnShow button\n    btnShow.Visible\
  \ = false;\n}\n```\n\n最后，`Form1_Click` 事件方法也用于“放大”表单，因此它与 `btnGrow_Click` 代码相同：\n\
  \n```csharp\nprivate void Form1_Click(object sender, EventArgs e)\n{\n    // Grow\
  \ the form\n    // Increase the form height by 10 pixels\n    this.Height = this.Height\
  \ + 10;\n    // Increase the form width by 10 pixels\n    this.Width = this.Width\
  \ + 10;\n}\n```\n\n通过点击工具栏上的 `Save All` 按钮（多个磁盘图标按钮）来保存您的项目。\n\n\n\n\n\n你应该很容易就能看到这些方法中正在发生什么。特别注意\
  \ `Visible` 属性在 `btnHide` 和 `btnShow` 按钮点击事件中是如何使用的。同样注意，许多事件方法的代码编写非常相似。例如，`Form1_Click`\
  \ 事件与 `btnGrow_Click` 事件是相同的。这在 Visual C# 项目中很常见。我们鼓励在编写代码时使用 `Copy` 和 `Paste` 等编辑器功能。要复制内容，使用鼠标高亮所需的文本\
  \ - 就像你在文字处理器中操作一样。然后，在 Visual C# 主菜单中选择 `Edit`，然后 `Copy`。将光标移动到你想粘贴的地方。你甚至可以移动其他事件方法。选择\
  \ `Edit`，然后 `Paste`。漂亮漂亮！复制的内容出现了。粘贴的文本可能需要一点编辑，但你会发现，编写代码时复制和粘贴将为你节省大量时间。而且，这是你想要做的，因为你可能已经注意到编程中会有大量的打字工作，即使对于像这样简单的项目也是如此。查找（Find）和替换（Replace）编辑器功能也很有用，尽可能使用它们。\n\
  \n![Image](img/00260.jpeg)\n\nVisual C# 的 Intellisense（智能提示）功能是减少你的打字负担和可能犯错误的另一种方法。你在代码窗口中编写\
  \ C# 时，某些点会弹出小框，显示逻辑上可以完成你正在编写语句的信息。通过这种方式，你可以选择所需的补全，而不是手动输入。\n\n## 运行项目\n\n去做吧！运行你的项目\
  \ - 点击 Visual C# 工具栏上的 `Start` 按钮。如果它没有正常运行，此时唯一的建议是停止项目，重新检查你的输入并重试。我们将在下节课中学习“调试”技术。这是我运行的一个示例，其中我放大了表单并将其设为红色：\n\
  \n![Image](img/00261.jpeg)\n\n尝试所有的按钮。放大表单、缩小表单、更改表单颜色、隐藏按钮、让按钮重新出现。确保你尝试了每一个按钮，并确保每个按钮都按照你的预期工作。确保点击表单得到预期结果。这看起来是一件显而易见的事，但对于大型项目，有时你编写的某些事件永远不会被执行，你无法知道那个特定的事件方法是否工作正常。这是正确项目设计的另一个步骤\
  \ - 彻底测试你的项目。确保每个事件都按预期工作。尝试完这个项目后，停止它（点击 Visual C# 工具栏上的 `Stop` 按钮）。\n\n## 其他尝试\n\
  \n![Image](img/00262.jpeg)\n\n对于本课程中的每个项目，我们将提供你可以修改和尝试的建议。修改 `Shrink Form` 和 `Grow\
  \ Form` 按钮，让它们也能移动表单在屏幕上（使用 `Left` 和 `Top` 属性）。使用其他颜色值更改表单颜色。修改 `Hide Buttons` 按钮，使其仅将按钮的\
  \ `Enabled` 属性设置为 `false`，而不是 `Visible` 属性。同样，修改 `Show Buttons` 按钮。\n\n![Image](img/00265.jpeg)\n\
  \n## 总结\n\n恭喜你！你现在完成了一个相当详细的（至少有一个多个控件的）Visual C# 项目。你学习了项目设计、保存项目、表单和按钮控件的细节，以及如何构建一个完整的项目。你现在应该已经熟悉构建项目的三个步骤：放置控件、设置属性和编写事件方法。我们将在未来的课程中继续使用这些步骤，使用新控件和更多的\
  \ C# 语言构建其他项目。\n\n# 5\n\n## 标签、文本框、变量\n\n![Image](img/00170.jpeg)\n\n## 复习与预览\n\n\
  我们将继续观察 Visual C# 环境并学习一些新的控件和新的 C# 语句。在学习过程中，请记住构建 Visual C# 项目的三个步骤：(1) 在表单上放置控件，(2)\
  \ 为控件分配属性，(3) 编写事件方法。\n\n在本节中，你将检查如何发现并消除项目中的错误，学习标签和文本框控件，以及 C# 变量。你将构建一个帮助你规划储蓄的项目。\n\
  \n![Image](img/00138.jpeg)\n\n## 调试 Visual C# 项目\n\n无论你计划得有多好，无论你在控件和事件方法中实现想法时有多小心，你都会犯错。错误或者计算机程序员所说的\
  \ bug，总会溜入你的项目。你作为一名程序员，你需要一套寻找和消除这些 bug 的策略。在项目中消除 bug 的被称为调试（debugging）。遗憾的是，寻找程序中\
  \ bug 并没有很多硬性的快速规则。每个程序员都有自己攻击 bug 的方法。你会形成自己的方法。不过，我们可以提出一些通用策略，这就是我们在这里提供给你的。\n\
  \n项目错误或 bug，可以分为三种类型：\n\n- 语法错误\n- 运行时错误\n- 逻辑错误\n\n当你在设计模式下设置属性出错或输入一行 C# 代码时，就会发生语法错误。某些内容拼写错误，或者漏掉了本该存在的内容。如果存在任何语法错误，你的项目将无法运行。运行时错误发生在你尝试运行项目时。它会突然停止，因为发生了超出其控制的事情。逻辑错误最难发现。你的项目会正常运行，但它给出的结果不是你预期的。让我们检查每种错误类型以及可能的调试方法。\n\
  \n### 语法错误\n\n![Image](img/0151.jpeg)\n\n语法错误容易识别和消除。Visual C# 程序在寻找语法错误方面很有帮助。语法错误通常发生在设置属性或编写代码时。\n\
  \n在 Visual C# 中启动一个项目。进入项目窗口，尝试将 Width 属性设置为单词 `Junk`。（点击 Size 旁的加号查看 Width。）发生了什么？你应该看到像这样的窗口：\n\
  \n![Image](img/0165.jpeg)\n\n点击 `Details`，你将看到问题的解释。记住属性值必须是正确的类型。将不正确的类型分配给属性就是语法错误。但我们\
  \ Visual C# 不让我们犯这种错误。点击 `Cancel` 恢复 `Width` 原值。\n\n如果你在编写代码时产生语法错误会发生什么？让我们试一下。使用属性窗口建立一个\
  \ `Form1_Load` 事件方法（记得：在属性窗口中选择 Events 按钮，滚动到 Load 事件并双击事件名称）。当窗口打开时，在标题行的左大括号下输入此行，然后按\
  \ Enter：\n\n如果在赋值语句中输入 0 而不是 `=`，就会发生这种情况。发生了什么？在代码窗口中，该行的部分将带有波浪线，类似于 Microsoft\
  \ Word 在你拼错单词时的做法：\n\n![Image](img/0241.jpeg)\n\nVisual C# 已经识别出该语句有问题。你应该能看到哪里。任何错误行在某些地方都会有“波浪线”。将光标置在波浪线上会提供关于你错误的某些指示。\n\
  \n所以，如果你犯了语法错误，Visual C# 通常会知道你做错了，并让你意识到自己的错误。在线帮助系统是调试语法错误的良好资源。注意，语法错误通常是因为打字错误\
  \ - 如果你需要提高打字技能，这又是一个绝佳的理由。\n\n### 运行时错误\n\n![Image](img/00272.jpeg)\n\n\n\n\n一旦你成功设置了控制属性并编写了事件方法，消除了所有识别出的语法错误，就可以尝试运行你的项目。如果项目运行了，太好了！但很多时候，你的项目可能会停止并告诉你发现了一个错误——这就是运行时错误。你需要弄清楚它为什么停止并修复该问题。同样，Visual\
  \ C# 和在线帮助通常会给你足够的信息来消除运行时错误。让我们来看一些例子。\n\n使用与上面相同的示例，尝试运行带有错误代码行的项目。在点击工具栏上的启动（Start）”按钮后，应该会出现以下窗口：\n\
  \n![Image](img/00001.jpeg)\n\n这告诉我们我们在尝试“生成”项目时发生了错误。点击“否” – 我们不想继续。我们想要找到错误。如果发生“生成错误”，它们将列在另一个\
  \ Visual C# 窗口中——“错误列表（Error List）”。此列表显示了在尝试运行程序时检测到的错误。现在转到该窗口（如果它不在那里，选择菜单中的\
  \ `View`，然后选择 `Error List`。`Error List` 出现在设计窗口中。你的窗口可能是浮动状态或停靠在某处）。\n\n我的错误列表窗口是：\n\
  \n![Image](img/00021.jpeg)\n\n它有三个必须在程序运行之前清除的错误。注意每个错误都指向 `Form1` 上的 `Line 22`，指向了错误的行。双击第一个错误跳转到相应的行：\n\
  \n![Image](img/00066.jpeg)\n\nVisual C# 正在提示你，你使用这行代码的方式存在问题。利用任务列表中的提示（代码期望一个行尾指示符），你应该能看到缺少了赋值运算符\
  \ `=`。如果你没有看到问题，点击 `<F1>` 可能会给你更多帮助。\n\n假设我们通过添加 `=` 号纠正了错误，但我们无意中在 `BackColor`\
  \ 属性名中漏掉了字母‘k’，或者我们输入了：\n\n```cpp\nthis.BacColor = Color.Red;\n```\n\n尝试运行项目，你将看到另一个“生成错误（build\
  \ error）”窗口。选择不继续并进入错误列表：\n\n![Image](img/00093.jpeg)\n\n消息再次指向 `Line 22`，说 `BacColor`\
  \ 未由表单定义。\n\n再次，转到代码窗口中的 `Line 22`（双击错误消息），你应该看到：\n\n![Image](img/00110.jpeg)\n\n\
  光标位于 `Me.BacColor` 旁边。Visual C# 正在告诉你它找不到该特定控件（表单）的此属性。你应该注意拼写错误并纠正它。\n\n现在，假设我们纠正了属性名，但又搞错了，在引用表单时输入\
  \ `thiss` 而不是 `this`：\n\n```cpp\nthiss.BackColor = Color.Red;\n```\n\n运行项目。你将得到另一个生成错误，选择不继续并查看任务列表：\n\
  \n![Image](img/00223.jpeg)\n\n这里的关键信息是“thiss 不存在（does not exist）……”这通常出现在你在 C# 代码中拼错了赋值赋值的控件名称时。Visual\
  \ C# 正在尝试使用“点符号法”为某个东西分配属性：\n\n```cpp\ncontrolName.PropertyName = Value;\n```\n\n\
  但它找不到给定名称的控件（在这种情况下为 `thiss`）。转到代码窗口，纠正错误并运行应用程序。你最终应该得到一个红色的表单！！\n\n我们在这里造成的错误是三种最常见的运行时错误：拼错赋值的\
  \ `Name` 属性、拼错属性名，或在赋值语句中漏掉了某些内容。注意看到的每个运行时错误在运行之前就被检测到了，导致了生成错误。在应用程序实际运行时可能还会发生其他运行时错误。\n\
  \nVisual C# 将某些运行时错误称为异常（exceptions）。如果出现一个窗口说你有某种异常，检测到错误的错误行将显示出来，并带有修复错误的建议。在尝试修复错误之前，务必停止程序。\n\
  \n我们看到了一些典型的运行时错误。还有其他错误，当你开始构建项目时，你会看到很多。但你已经看到，Visual C# 在指出错误位置方面非常有帮助，而且在线帮助始终可以可用来解释它们。关于运行时错误的最后一点是：Visual\
  \ C# 不会一次性找到所有错误。它会在遇到第一个运行时错误时停止。在你修复该错误后，可能还有更多错误。你必须一个一个地修复运行时错误。\n\n### 逻辑错误\n\
  \n![Image](img/00273.jpeg)\n\n逻辑错误最难发现和消除。这些错误不会阻止你的项目运行，但会导致错误或意外的结果。此时如果你怀疑存在逻辑错误，你唯一能做的就是深入项目（主要是事件方法），并确保所有代码都是完全按照你的意图编写的。发现逻辑错误是一项耗时的艺术，而不是科学。寻找逻辑错误没有通用规则。每个程序员都有自己特定的寻找逻辑错误的方法。\n\
  \n在我们一直使用的示例中，一个逻辑错误将是将表单的背景颜色设置为蓝色，而你预期的是红色。然后你将进入代码查看为什么发生这种情况。你会看到颜色 `Color.Blue`\
  \ 而不是预期的值 `Color.Red`。做出更改将消除逻辑错误。遗憾的是，消除逻辑错误并不像这样。Visual C# 有一个叫做调试器（debugger）的东西可以帮助你。如果你想提高技能，建议最终学会使用调试器。调试器的使用是一个高级主题，本课程将不会讨论。\n\
  \n现在，让我们提高对 C# 控件的技能。我们将查看两个控件：标签（Label）和文本框（TextBox）。\n\n### 标签控件 (Label)\n\n标签是一种用户无法直接编辑信息的控件。它通常用于为其他控件提供标题，或者显示计算机操作的结果。标签控件从工具箱中选择。它显示如下：\n\
  \n在工具箱中：\n\n![Image](img/0254.jpeg)\n\n在表单上（默认属性）：\n\n![Image](img/0291.jpeg)\n\n\
  ### 属性\n\n标签的一些常用属性有：\n\n| 属性 | 说明 |\n| :--- | :--- |\n| `Name` | 用于标识标签的名称。标签名称的三字母前缀为\
  \ `lbl`。 |\n| `Text` | 标签中的文本。 |\n| `TextAlign` | 指定文本的对齐方式。 |\n| `Font` | 设置文本的字体、大小和类型。\
  \ |\n| `BackColor` | 设置标签的背景颜色。 |\n| `ForeColor` | 设置文本的颜色。 |\n| `Left` | 表单左侧到标签左侧的距离（在属性窗口中为\
  \ `X`，展开位置属性）。 |\n| `Top` | 表单顶部到标签顶部的距离（在属性窗口中为 `Y`，展开位置属性）。 |\n| `Width` | 标签的宽度（像素）（展开尺寸属性）。\
  \ |\n| `Height` | 标签的高度（像素）（展开尺寸属性）。 |\n| `BorderStyle` | 决定标签边框的类型。 |\n| `Visible`\
  \ | 决定标签在运行模式下是否显示。 |\n| `AutoSize` | 如果为 `True`（默认值），标签根据文本大小调整。如果为 `False`，标签可以调整大小。\
  \ |\n\n注意，默认情况下，标签控件没有调整大小的手柄。要调整标签大小，请将 `AutoSize` 设置为 `False`。\n\n\n\n确保 Visual\
  \ C# 正在运行并启动一个新项目。在表单上放置一个标签（label）。根据需要调整其大小并移动它。设置 `Text` 属性。尝试不同的字体（Fonts）。观察\
  \ `BorderStyle` 各种选项之间的差异；注意默认值（`None`）会让按钮与表单匹配，`Fixed Single` 会在标签周围画一个框，而 `Fixed3D`\
  \ 则为标签提供三维内凹视觉效果。更改 `BackColor` 和 `ForeColor` 属性。你可能会发现某些颜色组合在彩色模式下无法很好地显示 `Text`。请确保你注意哪些组合是有效的，哪些无效的。你希望用户能够读懂显示的内容。\n\
  \n最常用的标签属性是 `Text`。它存储了标签控件中显示的信息。你需要注意两点：\n\n首先，默认情况下，标签会“增长”以容纳你为它提供的任何 `Text`。如果标签的大小不可接受，你可以尝试更改\
  \ `Font` 或 `AutoSize` 等。如果将标签设置得比它所包含的文本大（通过将 `AutoSize` 设置为 `False`），你可能还想要设置 `TextAlign`\
  \ 属性。尝试 `TextAlign` 属性的不同值；从“图形”菜单中选取了九种不同的对齐方式：\n\n![Image](img/00287.jpeg)\n\n\
  垂直选项有：`top`（顶部）、`middle`（中间）和 `bottom`（底部）对齐。水平选项有：`left`（左对）、`center`（居中）和 `right`（右对）。\n\
  \n你需要知道的第二点是 `Text` 是一个字符串类型的属性。它只能包含字符串值。在运行时设置 `Text` 属性时，`Text` 信息必须加引号。例如，如果你有一个名为\
  \ `lblExample` 的标签控件并并将 `Text` 属性设置为 `My Label Box`，将使用 C# 代码（注意点符号）：\n\n```\nlblExample.Text\
  \ = “My Label Box”;\n```\n\n在设计模式下设置 `Text` 时不需要担心引号。Visual C# 知道这是一个字符串值。\n\n##\
  \ 事件\n\n![Image](img/00314.jpeg)\n\n只有一个感兴趣的标签事件：\n\n| 事件 | 描述 |\n\n| :--- | :---\
  \ |\n| Click | 用户用鼠标点击标签时执行的事件。 |\n\n通过此事件，你可以允许用户在一组显示的标签框中进行选择。你为什么要这样做呢？示例应用程序包括测试中的多选题或颜色选择。\n\
  \n![Image](img/00326.jpeg)\n\n## 标签控件的典型用途\n\n标签控件用于显示不变文本（例如，提供标题信息）的通常设计步骤为：\n\
  \n> ➢ 设置 `Name` 属性（虽然并不真正，因为你很少为标签控件编写代码）和 `Text` 属性。\n>  ➢ 你可能还想更改 `Font`、`Backcolor`\
  \ 和 `Forecolor` 属性。\n\n要使用标签控件更改文本（例如，显示某些计算结果），请使用以下步骤：\n\n> ➢ 设置 `Name` 属性。将 `Text`\
  \ 初始化为所需的字符串。\n>  ➢ 将 `AutoSize` 设置为 `False`，调整控件大小并为 `TextAlign` 选择所需的值。\n>  ➢\
  \ 在需要的代码中分配 `Text` 属性（字符串类型）。\n>  ➢ 你可能还想更改 `Font`、`Backcolor` 和 `Forecolor` 属性。\n\
  \n![Image](img/00081.jpeg)\n\n## 文本框控件\n\n文本框控件用于显示用户在设计模式下输入、在运行时输入的信息，或在事件方法中分配的信息。只需将文本框想象成一个用户可以（或可能无法）更改内容的标签即可。文本框从\
  \ Visual C# 工具箱中选择。它显示如下：\n\n工具箱中：\n\n![Image](img/00099.jpeg)\n\n在表单上（默认属性）：\n\n\
  ![Image](img/00115.jpeg)\n\n### 属性\n\n文本框拥有丰富的实用属性：\n\n| 属性 | 描述 |\n| :--- | :---\
  \ |\n| Name | 用于标识文本框的名称。文本框名称的三字母前缀是 `txt`。 |\n| Text | 出现在文本框中的 `Text`（字符串值）。\
  \ |\n| TextAlign | 设置 `Text` 在文本框中是左对、右对还是居中。 |\n| Font | 设置 `Text` 的样式、大小和类型。 |\n\
  | MultiLine | 指定文本框显示单行还是多行。 |\n| ScrollBars | 指定显示的滚动条类型。 |\n| MaxLength | 显示的\
  \ `Text` 的最大长度。如果为 0，则长度不受限。 |\n| BackColor | 设置文本框背景颜色。 |\n| ForeColor | 设置 `Text`\
  \ 的颜色。 |\n| Left | 从表单左侧到文本框左侧的距离（属性窗口中的 X，展开 `Location` 属性）。 |\n| Top | 从表单顶部到文本框顶部的距离（属性窗口中的\
  \ Y，展开 `Location` 属性）。 |\n| Width | 文本框的像素宽度（展开 `Size` 属性）。 |\n| Height | 文本框的像素高度（展开\
  \ `Size` 属性）。 |\n| ReadOnly | 如果为 `True`，则用户无法更改文本框的内容（仅限运行时）。 |\n| TabStop | 如果为\
  \ `False`，则无法通过 Tab 键选中该控件。 |\n| BorderStyle | 决定文本框边框的类型。 |\n| Visible | 决定文本框是否出现。\
