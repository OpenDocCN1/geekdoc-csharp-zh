  - 如何使用 Visual C# 调试器\n- 如何从磁盘读取文件并将文件写入磁盘（这可以用于保存游戏中的高分）\n- 如何制作更精细的动画\n- 如何播放复杂的声音（Beep\
  \ 相当无聊）\n- 如何为你的项目添加菜单和工具栏\n- 如何使用你的打印机\n- 最后，你将拥有许多可以使用（或修改）的实用项目\n\n如果你想要更多信息，请联系我们。或者，访问我们的网站——地址在课程的标题页上。在离开之前，尝试一下奖励项目。它们能让你对下一节\
  \ Visual C# 课程能学到什么有所了解。\n\n# 奖励项目\n\n![Image](img/00170.jpeg)\n\n# 预览\n\n现在，你应该对构建\
  \ Visual C# 项目涉及的步骤感到相当熟悉。在这个奖励章节中，我们提供了更多你可以构建和尝试的项目。我们将介绍构建每个项目所需的步骤——项目设计、在表单上放置控件、设置控件属性、编写事件方法、运行项目以及其他尝试的内容。但是，我们不会对代码中正在发生的情况进行详细讨论（我们会指出新想法）。你现在应该能够自己发现（在代码注释的帮助下）。实际上，拥有一种非常有价值的编程技能是阅读和理解他人代码的能力。\n\
  \n包含的五个新项目是：计算机秒表、井井棋、掷骰子、州首和记忆游戏。作为另一个额外奖励，我们还将送上历史上第一个视频游戏的 Visual C# 版本——乒乓！\n\
  \n# 项目 1 - 计算机秒表\n\n## 项目设计\n\n![Image](img/00022.jpeg)\n\n在这个项目中，我们将建立一个计算机秒表，用秒来测量经过的时间。一个按钮用于开始和停止计时，另一个按钮用于重置显示。\n\
  \n## 在表单上放置控件\n\n启动秒表，点击 Start。停止，点击 Stop。点击 Reset 将显示重置为零。这些按钮都有一个 `Click` 事件。计时器控件的\
  \ `Tick` 事件控制时间的显示。\n\n## 设置控件属性\n\n使用属性窗口设置控件属性：\n\n| 控件 | 属性 | 值 |\n| :--- | :---\
  \ | :--- |\n| Form | BorderStyle | FixedSingle |\n| Form | StartPosition | CenterScreen\
  \ |\n| TextBox | Name | `txtTime` |\n| TextBox | Text | 00:00:00 |\n| TextBox |\
  \ BackColor | White |\n| TextBox | Font | Arial |\n| TextBox | FontSize | 24 |\n\
  | TextBox | Style | Bold |\n| TextBox | ReadOnly | True |\n| TextBox | TextAlign\
  \ | Center |\n| TextBox | TabStop | False |\n| Button1 | Name | `btnStartStop` |\n\
  | Button1 | Text | Start |\n| Button1 | Font | Arial |\n| Button1 | FontSize | 12\
  \ |\n| Button2 | Name | `btnReset` |\n| Button2 | Text | Reset |\n| Button2 | Enabled\
  \ | False |\n| Button2 | Font | Arial |\n| Button2 | FontSize | 12 |\n| Timer1 |\
  \ Name | `timDisplay` |\n| Timer1 | Interval | 1000 |\n\n设置属性后，我的表单看起来像这样（我调整了文本框的大小）：\n\
  \n![Image](img/094.jpeg)\n\n# 编写事件方法\n\n在通用声明区域添加此代码：\n\n```csharp\nDateTime startTime;\
