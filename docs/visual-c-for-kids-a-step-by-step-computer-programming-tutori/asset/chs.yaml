  \ 标签: | |\n| :--- | :--- |\n| 属性名称 | 属性值 |\n| Name | lblDepositHeading |\n| Text\
  \ | Weekly Deposit |\n| Font | Arial |\n| Font Size | 10 |\n\n| label2 标签: | |\n\
  | :--- | :--- |\n| 属性名称 | 属性值 |\n| Name | lblWeeksHeading |\n| Text | Number of\
  \ Weeks |\n| Font | Arial |\n| Font Size | 10 |\n\n| label3 标签: | |\n| :--- | :---\
  \ |\n| 属性名称 | 属性值 |\n| Name | lblTotalHeading |\n| Text | Total Savings |\n| Font\
  \ | Arial |\n| Font Size | 10 |\n\n| textbox1 文本框: | |\n| :--- | :--- |\n| 属性名称\
  \ | 属性值 |\n| Name | txtDeposit |\n| TextAlign | Right |\n| Font | Arial |\n| Font\
  \ Size | 10 |\n\n| textbox2 文本框: | |\n| :--- | :--- |\n| 属性名称 | 属性值 |\n| Name |\
  \ txtWeeks |\n| TextAlign | Right |\n| Font | Arial |\n| Font Size | 10 |\n\n| textbox3\
  \ 文本框: | |\n| :--- | :--- |\n| 属性名称 | 属性值 |\n| Name | txtTotal |\n| TextAlign |\
  \ Right |\n| Font | Arial |\n| Font Size | 10 |\n| ReadOnly | True |\n| BackColor\
  \ | White |\n| TabStop | False |\n\n（注意当将 `ReadOnly` 设置为 `True` 时背景颜色会发生变化。因此，我们将\
  \ `BackColor` 设置为 `White` 以匹配另外两个文本框的外观。）\n\n| button1 按钮: | |\n| :--- | :--- |\n\
