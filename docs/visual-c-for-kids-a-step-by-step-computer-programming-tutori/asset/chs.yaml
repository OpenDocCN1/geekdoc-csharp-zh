  | Font Size (字体大小) | 18 |\n| ReadOnly (只读) | True (是) |\n| TabStop (制表停止) | False\
  \ (否) |\n| TextAlign (对齐方式) | Center (居中) |\n| BackColor (背景颜色) | White (白色) |\n\
  | ForeColor (前颜色) | Blue (蓝色) |\n\n### `textBox2` 文本框:\n| 属性名称 | 属性值 |\n| :--- |\
  \ :--- |\n| Name (名称) | `txtOver` |\n| Text (文本) | Game Over (游戏结束) |\n| Font Size\
  \ (字体大小) | 18 |\n| ReadOnly (只读) | True (是) |\n| TabStop (制表停止) | False (否) |\n\
  | TextAlign (对齐方式) | Center (居中) |\n| BackColor (背景颜色) | White (白色) |\n| ForeColor\
  \ (前颜色) | Red (红色) |\n\n### `button1` 按钮:\n| 属性名称 | 属性值 |\n| :--- | :--- |\n| Name\
  \ (名称) | `btnStart` |\n| BackColor (背景颜色) | Light Yellow (浅黄色) |\n| Text (文本) |\
  \ Start (开始) |\n\n### `button2` 按钮:\n| 属性名称 | 属性值 |\n| :--- | :--- |\n| Name (名称)\
  \ | `btnExit` |\n| BackColor (背景颜色) | Light Yellow (浅黄色) |\n| Text (文本) | Exit (退出)\
  \ |\n\n### `timer1` 定计时器:\n| 属性名称 | 属性值 |\n| :--- | :--- |\n| Name (名称) | `timBalls`\
  \ |\n| Interval (间隔) | 100 |\n\n### `timer2` 定计时器:\n| 属性名称 | 属性值 |\n| :--- | :---\
  \ |\n| Name (名称) | `timGame` |\n| Interval (间隔) | 60000 |\n\n![Image](img/00054.jpeg)\n\
  \n当完成属性设置后，我的表单看起来如下所示：\n\n![Image](img/00092.jpeg)\n\n我们使用了 gif 文件作为我们的图形（球和箭头）。对于这种类型的图形，你可以选择一种颜色作为透明色，允许背景颜色显示出来。这种实现方法超出了本课程的范围。你可以自己用绘图程序进行一些研究——JASC\
  \ 的 PaintShop Pro（可以在互联网上查找）是一个非常棒的图形程序。\n\n## 写事件方法\n\n“接滩球”游戏在概念上非常简单。要玩游戏，点击\
  \ Start 按钮。五个球会掉落在面板，每个球的速度不同。使用键盘移动箭头。如果当碰撞发生时箭头位于球下方，球就会破裂，你获得一分。球在破裂或未被破裂到达屏幕底部后会重新从顶部出现。你需要在\
  \ 60 秒内尽可能多地破球。此时，会出现一条“Game Over”消息。你可以点击 Start 重新开始，或点击 Exit 停止程序。\n\n看起来只有三个事件需要代码：点击\
  \ Start 按钮、点击 Exit 按钮，或者使用 `picBalls_KeyDown` 来检查方向键按下。但请记住，表单有两个计时器控件。名为 `timBalls`\
  \ 的控件控制球的动画，每秒更新面板 10 次（`Interval` 为 `100`）。名为 `timGame` 的计时器控件控制游戏的总时间。它在游戏结束时生成一次\
  \ `Tick` 事件（`Interval` 为 `60000`——那是 60 秒）。因此，除了按钮点击和按键事件外，我们还需要两个计时器事件的代码。这里有大量的\
  \ C# 代码需要编写，尽管你会发现有很多重复。我们建议分阶段编写事件方法。先写一个方法或方法的一部分。运行项目。确保你写的代码运行正常。添加更多代码。再次运行项目。确保添加的代码有效。继续添加代码直到完成。通过这种方式构建项目可以最大限地减少潜在错误，并使调试过程变得容易。让我们开始吧。\n\
  \n![Image](img/00293.jpeg)\n\n每个球将占据一个方形区域。我们将计算球的大小（`ballSize`）以使其完美地适应面板。我们需要数组变量来跟踪每个球的位置（`ballX`、`ballY`）和掉落速度（`ballSpeed`）。我们需要知道箭头的尺寸（`arrowSize`）和位置（`arrowX`）。我们还需要一个图形对象来绘制球（`myGraphics`）和一个空白画刷对象（`blankBrush`，用于擦除球）。最后，我们需要随机数对象（`myRandom`）。将此代码添加到全局声明区域：\n\
  \n```csharp\nint ballSize;\nint[] ballX = new int[5];\nint[] ballY = new int[5];\n\
  int[] ballSpeed = new int[5];\nint arrowSize;\nint arrowX;\nGraphics myGraphics;\n\
  Brush blankBrush;\nRandom myRandom = new Random();\n```\n\n数组 `ballSpeed` 存储五个速度，代表球在每次更新面板时掉落的像素数。我们希望每个球以不同的速率掉落。在代码中，每个速度将使用以下计算：\n\
  \n```csharp\nmyRandom.Next(4) + 3\n```\n\n或者，它是 3 到 6 之间的随机值。\n\n### 初始化：Form1_Load\n\
  在这段代码中，计算了每个球的初始水平位置（`ballX`）。\n\n```csharp\nprivate void Form1_Load(object sender,\
  \ EventArgs e)\n{\n    int x;\n    // 让球散布在面板\n    ballSize = (int)(pnlBalls.Width\
  \ - 20) / 5;\n    x = 10;\n    for (int i = 0; i < 5; i++)\n    {\n        ballX[i]\
  \ = x;\n        x = ballSize + 20;\n    }\n    // 让箭头为球的一半\n    arrowSize = (int)(ballSize\
  \ / 2);\n    myGraphics = pnlBalls.CreateGraphics();\n    blankBrush = new SolidBrush(pnlBalls.BackColor);\n\
  \    // 给表单焦点\n    this.Focus();\n}\n```\n\n### 清理：Form1_Closing\n将此代码添加到 `Form1_Closing`\
  \ 事件以释放我们的对象：\n\n```csharp\nprivate void Form1_Closing(object sender, FormClosingEventArgs\
  \ e)\n{\n    myGraphics.Dispose();\n    blankBrush.Dispose();\n}\n```\n\n### 移动：Form1_KeyDown\n\
  为了移动箭头（使用 `DrawImage`），我们需要一个 `Form1_KeyDown` 事件方法（面板控件没有 KeyDown 事件）。确保你已将表单的 `KeyPreview`\
  \ 属性设置为 `True`，这样才能检测到 KeyDown 事件。\n\n```csharp\nprivate void Form1_KeyDown(object\
  \ sender, KeyEventArgs e)\n{\n    // 擦除旧位置的箭头\n    myGraphics.FillRectangle(blankBrush,\
  \ arrowX, pnlBalls.Height - arrowSize, arrowSize, arrowSize);\n\n    // 检查 F 键（左）和\
  \ J 键（右）并计算箭头位置\n    if (e.KeyCode == Keys.F)\n    {\n        arrowX = arrowX -\
  \ 5;\n    }\n    else if (e.KeyCode == Keys.J)\n    {\n        arrowX = arrowX +\
  \ 5;\n    }\n\n    // 箭头\n    myGraphics.DrawImage(picArrow.Image, arrowX, pnlBalls.Height\
  \ - arrowSize, arrowSize, arrowSize);\n}\n```\n\n\n\n\n注意当按下 `F` 键时，箭头 (`imgArrow`)\
  \ 会向左移动 5 像素。如果按下 `J` 键，箭头则向右移动 5 像素。同样，`5` 像素的值是通过“尝试错误”找到的——似乎能提供平滑的运动。按照这种方法输入代码后，保存项目并运行它。确保箭头按预期移动。按下\
  \ `J` 键查看。它应该从表单的左侧（`arrowX = 0`）开始，因为我们没有给它设置初始位置。这就是我们建议分阶段构建项目的意思。注意，没有任何代码可以防止箭头移出面板——如果你愿意，可以添加此类代码。你需要检测是否跨越了左边界或右边界。停止项目。现在，我们来处理按钮事件。\n\
  \n### btnExit_Click\n`btnExit_Click` 方法非常简单，所以我们先处理它。它是通常的单行代码（加上注释的话是两行），用于停止项目：\n\
  \n```csharp\nprivate void btnExit_Click(object sender, EventArgs e)\n{\n    this.Close();\n\
  }\n```\n\n### btnStart_Click\n让我们概述一下 `btnStart_Click` 事件涉及的步骤。我们用此按钮有两个用途。它要么启动游戏（`Text`\
  \ 为 `Start`），要么停止游戏（但不是停止程序——`Text` 为 `Stop`）。因此，`Click` 事件有两个部分。如果 `Text` 是 `Start`，步骤如下：\n\
  \n* 隐藏“Game Over”消息\n* 将 `btnStart` 的 `Text` 设置为“Stop” \n* 禁用 `btnExit` 按钮\n* 清除屏幕上的球\n\
  * 将 `score` 设置为 `0`\n* 初始化每个球的位置和速度\n* 初始化箭头位置\n* 给表单焦点（以便可以识别 `KeyDown`）\n* 启动计时器\n\
  \n如果点击按钮时 `Text` 为 `Stop`，程序的执行步骤为：\n\n* 显示“Game Over”消息\n* 将 `btnStart` 的 `Text`\
  \ 设置为“Start”\n* 启用 `btnExit` 按钮\n* 停止计时器\n\n查看 `btnStart_Click` 事件方法，看看你是否能识别出所有概述的步骤。注意，球位于面板正上方，速度使用之前给出的公式设置：\n\
  \n```csharp\nprivate void btnStart_Click(object sender, EventArgs e)\n{\n    if\
  \ (btnStart.Text == \"Start\")\n    {\n        // New Game\n        myGraphics.Clear(pnlBeachBalls.BackColor);\n\
  \        txtOver.Visible = false;\n        btnStart.Text = \"Stop\";\n        btnExit.Enabled\
  \ = false;\n        txtScore.Text = \"0\";\n        // 将每个球设置到面板上方并赋予新速度\n     \
  \   for (int i = 0; i < 5; i++)\n        {\n            ballY[i] = -ballSize;\n\
  \            ballSpeed[i] = myRandom.Next(4) + 3;\n        }\n        // 设置箭头在中心附近\n\
  \        arrowX = (int)(pnlBeachBalls.Width / 2);\n        myGraphics.DrawImage(picArrow.Image,\
  \ arrowX, pnlBeachBalls.Height - arrowSize, arrowSize, arrowSize);\n        // 给表单焦点以便它可以接收\
  \ KeyDown 事件\n        this.Focus();\n    }\n    else\n    {\n        // Game stopped\n\
  \        txtOver.Visible = true;\n        btnStart.Text = \"Start\";\n        btnExit.Enabled\
  \ = true;\n    }\n    // 切换计时器\n    timBalls.Enabled = !(timBalls.Enabled);\n  \
  \  timGame.Enabled = !(timGame.Enabled);\n}\n```\n\n保存并运行项目。不应该显示任何球。确保没有运行时错误。箭头应该位于面板的中央。确保箭头移动键（`F`\
  \ 和 `J`）仍然正常工作。停止项目。\n\n`btnStart_Click` 事件方法切换两个计时器控件。两个 `Tick` 事件中发生了什么？我们先做简单的。每个游戏持续\
  \ 60 秒。这个计时由 `timGame` 计时器处理。它的 `Interval` 为 `60000`，这意味着它的 `Tick` 事件每隔 60 秒执行一次。我们只执行一次该事件——当它执行时，我们停止游戏。执行此操作的代码与点击\
  \ `btnStart` 按钮且其 `Text` 为 `Stop` 时执行的代码相同。`timGame_Tick` 事件方法应该是：\n\n```csharp\n\
  private void timGame_Tick(object sender, EventArgs e)\n{\n    // 60 seconds have\
  \ elapsed - stop game\n    timBalls.Enabled = false;\n    timGame.Enabled = false;\n\
  \    txtOver.Visible = true;\n    btnStart.Text = \"Start\";\n    btnExit.Enabled\
  \ = true;\n}\n```\n\n保存项目。运行它。点击 Start。使用箭头移动键玩或就坐在那里。60 秒后，你应该看到弹出“Game Over”通知，并看到按钮外观变化。如果发生了，说明\
  \ `timGame` 计时器控件工作正常。如果没有发生，说明你需要修复某些地方。停止项目。\n\n### timBalls_Tick\n现在，进入沙滩球游戏的核心——`timBalls_Tick`\
  \ 事件。我们还没有看到球掉落。这里就是我们执行这些以及更多操作的地方。`timBalls` 计时器处理动画序列。它让球向下掉落，检查是否碰撞，并检查球是否到达底部。它产生新球。这里有很多操作。每个球的步骤步骤是相同的：\n\
  \n```csharp\nprivate void timBalls_Tick(object sender, EventArgs e)\n{\n    for\
  \ (int i = 0; i < 5; i++)\n    {\n        // 移动球\n        ballY[i] += ballSpeed[i];\n\
  \        // 擦除球\n        myGraphics.FillRectangle(blankBrush, ballX[i], ballY[i],\
  \ ballSize, ballSize);\n        // 检查是否碰撞\n        if (ballY[i] + ballSize > pnlBeachBalls.Height)\n\
  \        {\n            if (ballX[i] + ballSize > arrowX)\n            {\n     \
  \           // 球碰撞\n                // 增加分数 - 回到顶部\n                System.Media.SystemSounds.Beep.Play();\n\
  \                txtScore.Text = Convert.ToString(Convert.ToInt32(txtScore.Text)\
  \ + 1);\n                ballY[i] = -ballSize;\n                ballSpeed[i] = myRandom.Next(4)\
  \ + 3;\n            }\n        }\n        // 检查是否出底\n        if (ballY[i] < 0)\n\
  \        {\n            // 回到顶部\n            ballY[i] = -ballSize;\n           \
  \ ballSpeed[i] = myRandom.Next(4) + 3;\n        }\n        // 重画球\n        myGraphics.DrawImage(picBall.Image,\
  \ ballX[i], ballY[i], ballSize, ballSize);\n    }\n}\n```\n\n你看到所有步骤是如何实现的了吗？我们在球碰撞时添加了\
  \ Beep 语句以提供一些音频反馈。\n\n\n\n\n为游戏添加可选的难度级别。这可以使游戏对小孩来说很简单，而对专家来说非常困难。你可以做什么来调整游戏难度？你可以做的一件事是调整弹出箭头的大小。要破一个球，整个箭头的宽度必须在球的宽度内。因此，较小（更窄）的箭头会让球在到达图像框底部之前更容易被破。较大（更宽）的箭头会让破球变得更困难。球掉落的速度也会影响游戏难度。缓慢掉落的球容易破——快速的球则不然。玩玩游戏，看看不同难度下适合什么速度。\n\
  \n让游戏可以持续更久，并随着游戏的进行，使用上述一些想法（更小的箭头、更快的球）让游戏变得越来越难。你在玩过的其他游戏中见过这种情况——游戏通常会随着时间的推移变得越来越难。\n\
  \n玩家喜欢知道游戏中还剩多少时间。为你的游戏添加此功能。使用文本框控件显示剩余的秒数。你需要另一个 `Interval` 设置为 `1000`（一秒）的计时器控件。每当此计时器的\
  \ `Tick` 事件执行时，就意味着过去了一秒。在此事件中，从标签中显示的数值上减 1。你应该能够胜任对你的项目进行这样的更改。\n\n玩家喜欢的另外一点是最高分。添加此功能。声明一个新变量来跟踪最高分。在每局游戏结束后，将当前分数与最高分比较，看是否达到了新高。添加一个文本框控件显示最高分。但有一个问题：当你停止程序时，最高分值将会丢失。每次运行项目时都需要建立新的高分。随着你成为一名更高级的\
  \ Visual C# 程序员，你将学习保存最高分的方法。\n\n![Image](img/00337.jpeg)\n\n![Image](img/00002.jpeg)\n\
  \n## 总结\n\n在最后一节课程中，我们发现计时器控件是计算机动画的关键元素。通过周期性更改面板控件中的显示，获得了运动的感觉。我们学习了“动画数学”——如何检测图像是否从面板中消失，如何检测图像是否跨越面板的边界，以及如何检测两个图像（矩形）是否碰撞。我们学习了如何检测键盘事件。而且，你建立了自己的第一个视频游戏。\n\
