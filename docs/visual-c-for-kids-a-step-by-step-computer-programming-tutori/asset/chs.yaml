  | :--- | :--- |\n| 属性名称 | 属性值 |\n| Name | btnExit |\n| Text | Exit |\n\n注意，这是你第一次被要求更改\
  \ `Font` 属性。如有必要，回顾执行此操作步骤（按钮控件下的第 4 类）。如果你愿意，可以更改任何其他属性，如颜色。完成后，你的表单应该像这样：\n\n\
  ![Image](img/00330.jpeg)\n![Image](img/00359.jpeg)\n\n# 编写事件方法\n\n在这个项目中，用户在 `Weekly\
  \ Deposit` 文本框中输入金额。然后，用户在 `Number of Weeks` 文本框中输入一个值。随后，用户点击 `Compute` 按钮。项目确定储蓄账户的总金额并将其显示在下方的文本框控件中。因此，此项目的主要事件是\
  \ `Compute` 按钮上的 `Click` 事件。唯一的另一个事件是 `Exit` 按钮上的 `Click` 事件。为用户提供一种明显的退出项目的方法总是好的。\n\
  \n此项目中我们需要三个变量（我们将使用 `int` 类型），一个用于存储每周存款的金额（`deposit`），一个用于存储周数（`weeks`），另一个用于存储总储蓄（`total`）。打开代码窗口并找到通用声明：\n\
  \n```csharp\nint deposit;\nint weeks;\nint total;\n```\n\n![Image](img/0112.jpeg)\n\
  \n`btnCompute_Click` 事件实现了以下步骤：\n1. 将 `txtDeposit.Text` 转换为数字并存储在 `deposit`。\n2.\
  \ 将 `txtWeeks.Text` 转换为数字并存储在 `weeks`。\n3. 将 `deposit` 乘以 `weeks` 并结果存储在 `total`。\n\
  4. 将 `total` 转换为字符串，与美元符号（`$`）拼接，并存储在 `txtTotal`。\n\n```csharp\nprivate void btnCompute_Click(object\
  \ sender, EventArgs e)\n{\n    // 获取存款\n    deposit = Convert.ToInt32(txtDeposit.Text);\n\
  \n    // 获取周数\n    weeks = Convert.ToInt32(txtWeeks.Text);\n\n    // 计算总额\n    total\
  \ = deposit * weeks;\n\n    // 显示总额\n    txtTotal.Text = \"$\" + Convert.ToString(total);\n\
  }\n```\n\n注意将列出的步骤转换为实际 C# 代码有多简单。这只需要注意细节。特别是 `Convert.ToInt32` 和 `Convert.ToString`\
  \ 的使用。\n\n`btnExit_Click` 事件方法通过关闭表单来停止程序，只需一行代码：\n\n```csharp\nprivate void btnExit_Click(object\
  \ sender, EventArgs e)\n{\n    this.Close();\n}\n```\n![Image](img/0269.jpeg)\n\n\
  ## 项目\n\n![Image](img/0205.jpeg)\n\n运行项目。点击 `Weekly Deposit` 文本框并输入某个值。在 `Number\
  \ of Weeks` 文本框中也同样操作。点击 `Compute` 按钮。你的答案应该显示在 `Total` 文本框中。确保答案是正确的。记住，项目设计的一一步是确保你的项目正常运行！如果你说你想每周存\
  \ 10 美元，存 10 周，而你的电脑项目却说那时你有百万美元，你应该知道哪里有问题！点击 Exit 确保它运行。如果你进行了任何更改，请保存项目。这是我的一次运行：\n\
  \n![Image](img/0258.jpeg)\n\n这个项目看起来可能并不复杂。事实如此。毕竟，我们只是把两个数字相乘。但是这个项目展示了每个 Visual\
  \ C# 项目都会用的步骤。在如何读取输入值、将其转换为正确的类型、进行数学运算获得所需结果以及将结果输出给用户方面，获得了宝贵的经验。\n\n### 其他尝试的内容\n\
  \n![Image](img/0304.jpeg)\n\n大多数储蓄账户都会产生利息，也就是说银行因为让他们使用你的钱而向你支付。这个储蓄账户项目忽略了利息。但是，进行必要的修改来考虑利息相当简单的——数学计算稍微复杂一点。我们将提供步骤，但不会展示如何修改你的项目。如果你愿意，可以尝试一下：\n\
  \n\n\n\n\n- 定义一个变量 `interest` 来存储年度储蓄利率。利率是小数，因此对该变量使用 `double` 类型（这是我们第一次使用小数！）。\n\
  - 添加另一个文本框以允许用户输入此利率。将其命名为 `txtInterest`。\n- 添加一个标签（label）控件来标识这个新添加的文本框（将 `Text`\
  \ 属性设置为 `Interest Rate`）。\n- 修改代码，在计算总额时使用 `interest`。通过以下方式获取 `interest`：\n\n```csharp\n\
  interest = Convert.ToDouble(txtInterest.Text);\n```\n\n然后，使用以下公式计算 `total`（做好准备——这看起来可能很乱）：\n\
  \n```csharp\ntotal = (int) (5200 * (deposit * (Math.Pow((1 + interest / 5200), weeks)\
  \ - 1) / interest));\n```\n\n请确保将这些所有内容写在一行内——文字处理器让它看起来像占了两个行。正如我们所说，这是一个复杂的表达式，但它是使用括号和算术运算符的良好练习。还要注意使用\
  \ `int` 关键字将计算结果转换（强制类型转换）为整数。这里使用数字“5200”是将利率从年度值转换为周值。\n\n该方程使用一个我们还没有见过的 C# 方法，`Pow`\
  \ 方法，也称为幂运算方法。在幂运算中，一个数字乘以它自身若干。如果我们将一个数字与自身相乘 4 次，我们就称之为为该数字的第 4 次方。用于幂运算的 C# 方法是：\n\
  \n```csharp\nMath.Pow(argument1, argument2)\n```\n\n注意 `Pow`（代表 power，幂）函数有两个参数。`argument1`\
  \ 是我们要与其自身相乘 `argument2` 次的数字。换句话说，该方法将 `argument1` 提升到 `argument2` 次方。每个参数和返回值都是\
  \ `double` 类型的数字。示例示例：\n\n| 示例 | 结果 |\n| :--- | :--- |\n| `Math.Pow(4.0, 2.0)` |\
  \ `16.0` |\n| `Math.Pow(-3.0, 3.0)` | `-27.0` |\n| `Math.Pow(10.0, 4.0)` | `10000.0`\
  \ |\n\n在每个示例中，参数都没有小数部分。我们这样做是为了让示例更清晰。你并不限于此类值。可以使用此函数来计算将 7.654 与自身相乘 3.16 次的结果！！（顺便说一下，答案是\
  \ 620.99。）\n\n现在，运行修改后的项目。输入 `deposit`、`weeks` 和 `interest` 的值。点击 `Compute` 按钮。确保你得到的是合理的答案。（作为检查，如果你使用的\
  \ `Deposit` 值为 10，`Weeks` 值为 20，`Interest` 值为 6.5，则 `Total` 答案应为 $202 —— 注意，如果没有利率你会有\
  \ $200，所以这是合理的）。尽管答案中可能包含小数（某些分币），项目仍会将 `total` 转换为整数（使用强制类型转换）。保存你的项目。\n\n![Image](img/00264.jpeg)\n\
  \n![Image](img/00276.jpeg)\n\n## 总结\n\n在这节课中，你学习了许多新内容。你学习了 `label` 和 `text box`\
  \ 控件。你学习了变量：命名、它们的类型以及如何正确声明它们。而且，你学习了允许你从字符串变量转换为数字以及从数字转换为字符串的函数。你学习了如何在 C# 中进行算术运算。正如我们所说，有很多新内容。在随后的课程中，我们将强调新的控件和新的\
  \ C# 语句，而不是 Visual C# 环境的新功能。到目前，你应该对该环境相当熟悉了。\n\n# 6. UpDown 控件、决策、随机数\n\n![Image](img/00145.jpeg)\n\
  \n## 复习与预览\n\n你已经完成课程的一半了！你现在应该对项目构建过程和你已学的控件感到很熟悉。在剩下的课程中，我们将更多地关注控件和 C#，而少关注 Visual\
  \ C# 环境。\n\n在这节课中，我们将查看数值增减控件（numeric updown control）、使用 C# 进行决策，以及一个非常有趣的话题：随机数。你将构建一个“猜数字”游戏项目。\n\
  \n![Image](img/00222.jpeg)\n\n## 数值增减控件 (Numeric UpDown Control)\n\n`Numeric UpDown`\
  \ 控件用于获取数值输入。它看起来像带有两个小箭头的文本框控件。点击箭头会更改显示的值，其范围从指定的最小值到指定的最大值。如果需要，用户甚至可以输入一个值。这些控件对于提供整数非常有用，例如月份中的日期。数值增减控件从\
  \ Visual C# 工具箱中选择。它显示如下：\n\n### 工具箱：\n\n![Image](img/00086.jpeg)\n\n### 在表单上（默认属性）：\n\
  \n![Image](img/00280.jpeg)\n\n### 属性\n\n数值增减控件的属性有：\n\n| 属性 | 说明 |\n| :--- | :---\
  \ |\n| Name | 用于标识数值增减控件的名称。数值增减命名的三字母前缀是 `nud`。 |\n| Value | 分配给增减控件的值（decimal\
  \ 类型）。 |\n| Increment | 点击向上或向下按钮时增加（increase）或减少（decrease）增减控件的量。 |\n| Maximum\
  \ | 数值增减控件的最大值。 |\n| Minimum | 数值增减控件的最小值。 |\n| TextAlign | 设置显示值是否左对齐。 |\n| Font\
  \ | 设置显示值的字体、大小和类型。 |\n| BackColor | 设置增减控件的背景颜色。 |\n| ForeColor | 设置显示值的颜色。 |\n\
  | Left | 表单左侧到数值增减控件的距离。 |\n| Top | 表单顶部到数值增减控件的距离。 |\n| Width | 增减控件的宽度。 |\n| Height\
  \ | 增减控件的高度。 |\n| ReadOnly | 决定是否可以更改文本。 |\n| Enabled | 决定增减控件是否可以响应用户。 |\n| Visible\
  \ | 决定增减控件是否显示在表单上。 |\n\n增减控件的操作实际上非常简单。`Value` 属性可以通过点击箭头（每次）或可选地通过输入（如果 `ReadOnly`\
  \ 为 `False`）来更改。如果使用箭头，值将位于 `Minimum` 和 `Maximum` 之间。如果用户可以输入值，你对输入的内容没有控制。\n\n\
  ![Image](img/0016.jpeg)\n\n## 示例\n\n启动 Visual C# 并新建项目。我们将创建一个提供 0 到 20 数字的数值增减控件。在表单上放置一个数值增减控件。（确保你选择的是数值增减控件，而不是域增减控件。）如果需要，对其调整大小并移动。设置以下属性：\n\
  \n| 属性 | 值 |\n| :--- | :--- |\n| Value | 10 |\n| Increment | 1 |\n| Minimum | 0\
  \ |\n| Maximum | 20 |\n| ReadOnly | False |\n\n如果你喜欢，尝试更改颜色、字体和任何其他属性。运行项目。数值增减控件将出现并显示值为\
  \ 10。点击末端箭头查看值的变化。注意值不会低于 0 或超过 20，这些是设计时指定的限制。点击显示区域并输入值 100。注意，尽管这超过了最大 20，但你可以输入该值。尝试增加值，它不会增加。按下\
  \ <Enter> 或尝试减少值，它会立即调整到范围之内。因此，Visual C# 会做一些尝试确保用户不会输入非法值。停止项目。\n\n## 事件\n\n![Image](img/00266.jpeg)\n\
  \n我们将使用一个数值增减事件：\n\n| 事件 | 说明 |\n| :--- | :--- |\n| ValueChanged | 当 `Value` 属性以某种方式发生变化时发生。\
  \ |\n\n\n\n\n\n当 `Value` 发生时，就会执行 `ValueChanged` 事件。在这里你可以使用当前值。如果允许用户在控件中输入值，你可能需要检查该值是否在接受范围内。\n\
  \n### 数值调节控件（Numeric UpDown Control）的典型用法\n\n数值调节控件的设计步骤如下：\n\n- 设置 `Name`、`Minimum`\
  \ 和 `Maximum` 属性。初始化 `Value` 属性。决定 `ReadOnly` 的值。\n- 监控 `ValueChanged` 事件以检测 `Value`\
  \ 的变化。\n- 你可能还想更改 `Font`、`Backcolor` 和 `Forecolor` 属性。\n\n注意，为了最大的灵活性，`Value` 是\
  \ `decimal` 类型，这意味着你可以拥有非整数（你需要将 `DecimalPlaces` 属性设置为某个值）。如果你想要一个整数值，需要将 `Value`\
  \ 强制转换为 `int` 类型。\n\n## C# - 第三课\n\n在课程的 `C#` 章节中，我们将学习计算机程序最实用的功能之一——决策。我们将讨论用于决策的表达式和逻辑运算符，以及如何做出决策。我们还将查看一个新的\
  \ `C#` 函数——随机数。这个函数是每个电脑游戏的核心。\n\n### 逻辑表达式\n\n你可能认为计算机非常聪明。它们似乎具有做出惊人决策和选择的能力。计算机可以击败国际象棋大师，并帮助人类进入太空。事实上，计算机并没有那么聪明——它们拥有的唯一决策能力就是判断某事为真为假。但是，计算机能够非常快速地做出决策，这就是为什么它们看起来很聪明（而且，与你在学校里做的\
  \ `True` 或 `False` 测试不同，计算机总是能得到正确答案！）。要使用 `C#` 进行决策，我们将所有可能的决策写成真或假的陈述形式，这种陈述被称为逻辑表达式。我们给计算机一个逻辑表达式，计算机就会告诉我们该表达式是真是假。根据该决策，我们可以在计算机程序中采取任何我们想要的操作。注意，逻辑表达式的结果是一个\
  \ `bool` 类型的值。\n\n![Image](img/00217.jpeg)\n\n假设在计算机程序中，我们需要知道变量 `aValue` 的值是否大于变量\
  \ `bValue` 的值。我们将要求计算机（通过编写一些 `C#` 代码）对真假陈述提供答案：“aValue 大于 bValue。”这是一个逻辑表达式的示例。如果计算机告诉我们这是真的，我们就可以采取一组\
  \ `C#` 步骤。如果是假的，我们就可以采取另一组。这就是在 `C#` 中进行决策的方式。\n\n为了做出决策，我们需要知道如何构建和使用逻辑表达式。构建此类表达式的第一步是学习比较运算符。\n\
  \n![Image](img/00282.jpeg)\n\n### 比较运算符\n\n![Image](img/00322.jpeg)\n\n在第 3 类中，我们看了一种\
  \ `C#` 运算符——算术运算符。在本课中，我们引入了比较运算符的概念。比较运算符的作用正如其名——它们比较两个值，比较的输出是一个布尔值（`bool`）。也就是说，比较的结果非真即假。比较运算符允许我们构建用于决策的逻辑表达式。\n\
  \n共有六比较运算符。第一个是“等于”运算符，用两个等号（`==`）表示。该运算符告诉我们两个值是否相等。示例：\n\n| 比较 | 结果 |\n| :---\
  \ | :--- |\n| `6 == 7` | false |\n| `4 == 4` | true |\n\n`C#` 中的一个常见错误（逻辑错误）是在“等于”运算符上只使用一个等号。使用单个等号仅仅是给变量赋值，这使其始终为真。\n\
  \n还有一个“不等于”运算符，由一个感叹号（称为非运算符）后跟等号（`!=`）组成。使用该运算符的示例：\n\n| 比较 | 结果 |\n| :--- | :---\
  \ |\n| `6 != 7` | true |\n| `4 != 4` | false |\n\n还有其他运算符让我们我们可以比较数字的大小。“大于”运算符（`>`）告诉我们一个数字（运算符左侧）是否大于另一个数字（运算符右侧）。其用法示例：\n\
  \n| 比较 | 结果 |\n| :--- | :--- |\n| `8 > 3` | true |\n| `6 > 7` | false |\n| `4 >\
  \ 4` | false |\n\n“小于”运算符（`<`）告诉我们一个数字（运算符左侧）是否小于另一个数字（运算符右侧）。一些示例：\n\n| 比较 | 结果\
  \ |\n| :--- | :--- |\n| `8 < 3` | false |\n| `6 < 7` | true |\n| `4 < 4` | false\
  \ |\n\n最后两个运算符是对“大于”和“小于”运算符的修改版。“大于等于”运算符（`>=`）比较两个数字。如果运算符左侧的数字大于或等于右侧的数字，结果为真。否则，结果为假。示例：\n\
  \n| 比较 | 结果 |\n| :--- | :--- |\n| `8 >= 3` | true |\n| `6 >= 7` | false |\n| `4\
  \ >= 4` | true |\n\n同样地，“小于等于”运算符（`<=`）告诉我们运算符左侧的数字是否小于或等于右侧的数字。示例：\n\n| 比较 | 结果\
  \ |\n| :--- | :--- |\n| `8 <= 3` | false |\n| `6 <= 7` | true |\n| `4 <= 4` | false\
  \ |\n\n### 逻辑运算符\n\n逻辑运算符用于组合使用比较运算符构建的逻辑表达式。逻辑运算符允许你，作为程序员，做出任何想要的决策。例如，假设我们需要知道\
  \ `aValue` 和 `bValue` 是否大于零。使用比较运算符（`>`），我们知道 `aValue` 大于零且 `bValue` 大于零。逻辑运算符可以做出这种决策。逻辑运算符用于组合使用比较运算符构建的逻辑表达式。第一个是用两个与符号（`&&`）表示的与运算符。其格式如下（使用两个逻辑表达式\
  \ `x` 和 `y`，每个都有布尔（`bool`）类型结果）：\n\n```\nx && y\n```\n\n这个表达式所问的问题是“x 和 y 都为真吗？”这就是为什么它被称为与运算符。与运算符（`&&`）只有在\
  \ `x` 和 `y` 都为真时才返回真。如果任何一个表达式为假，与运算符将返回假。`&&` 的四种可能性在此逻辑表中：\n\n![Image](img/00353.jpeg)\n\
  \n![Image](img/00013.jpeg)\n\n注意与运算符将用于解决本节开头提到的问题。也就是说，为了查看 `aValue` 和 `bValue`\
  \ 是否大于零，我们将使用表达式：\n\n```\naValue > 0 && bValue > 0\n```\n\n我们将使用的另一个逻辑运算符是或运算符，用两个管道符号（`||`）表示。管道符号是标准键盘上反斜杠键（`\\\
  `）的 Shift。使用该运算符的格式如下：\n\n```\nx || y\n```\n\n这个表达式所问的问题是“x 或 y 为真吗？”这就是为什么它被称为或运算符。或运算符（`||`）只要\
  \ `x` 或 `y` 其中任何一个为真就会返回真。如果两个表达式都为假，或运算符将返回假。`||` 的四种可能性为：\n\n![Image](img/00044.jpeg)\n\
  \n![Image](img/00090.jpeg)\n\n\n\n\n`or` 运算符的优先级次于 `and` 运算符（即 `and` 在 `or` 之前执行），且所有逻辑运算符的优先级都低于比较运算符。使用比较运算符和逻辑运算符来构建逻辑表达式，是使\
  \ C# 中做出正确决策的关键。请确保你理解所有运算符（以及它们的优先级）是如何工作的。让我们来看一些示例来帮助理解这些内容。\n\n在这些示例中，我们有两个整数变量\
  \ `aInteger` 和 `bInteger`，其值如下：\n\n`aInteger = 14`\n`bInteger = 7`\n\n如果我们想评估逻辑表达式：\n\
  \n`aInteger > 10 && bInteger > 10`\n\n比较首先进行，从左到右，因为所有比较运算符都具有相同的优先级级别。`aInteger`\
  \ (14) 大于 10，所以 `aInteger > 10` 为真（true）。`bInteger` (7) 不大于 10，所以 `bInteger > 10`\
  \ 为假（false）。由于其中一个表达式不为真，因此 `and` (`&&`) 操作的结果为假。这个表达式 `aInteger > 10 && bInteger\
  \ > 10` 是假的。那么这个表达式的结果是：\n\n`aInteger > 10 || bInteger > 10`\n\n你能看出这个表达式是真吗？（`aInteger\
  \ > 10` 为真，`bInteger > 10` 为假；`true || false` 结果为真）。\n\n逻辑表达式并不要求只能有一个逻辑运算符。那么，让我们把情况复杂化一点。如果表达式是：\n\
  \n`aInteger > 10 || bInteger > 10 && aInteger + bInteger == 20`\n\n优先级告诉我们算术运算首先执行（`aInteger`\
  \ 和 `bInteger` 相加），然后是从左到右的比较。我们知道 `aInteger > 10` 为真，`bInteger > 10` 为假，`aInteger\
  \ + bInteger == 20` 为假。因此，这个表达式在布尔比较值方面变为：\n\n`true || false && false`\n\n我们如何评估它？优先级规定先执行\
  \ `and` (`&&`)，然后是执行 `or` (`||`)。`false && false` 的结果为假，因此表达式归化为：\n\n`true || false`\n\
  \n其结果为真。因此，我们说表达式 `aInteger > 10 || B > 10 && aInteger + bInteger = 20` 是真的。\n\n\
  逻辑表达式可以使用括号来强制执行求值时的优先级。如果在上面的示例中，我们想先执行 `or` (`||`) 操作呢？这通过使用括号重写来完成：\n\n`(aInteger\
  \ > 10 || bInteger > 10) && aInteger + bInteger == 20`\n\n你应该能够证明这评估的结果结果为假 [先执行\
  \ `or` (`||`)]。在在此之前，没有括号时，它是真的。括号的添加改变了这个逻辑表达式的值！最好的做法始终清晰地指示你希望如何评估一个逻辑表达式。括号是实现这一点的好方法。即使优先级没有受到影响，也请使用括号。\n\
  \n如果我们移动这个示例中的括号并写道：\n\n`aInteger > 10 || (bInteger > 10 && aInteger + bInteger\
  \ == 20)`\n\n结果（真）与没有括号时相同，因为 `and` (`&&`) 本身就是先执行的。然而，括号确实清楚地指示了 `and` 是首先执行的。这种清晰性在编程中是非常好的。\n\
  \n比较运算符和逻辑运算符是 C# 中做出决策的关键。确保你熟悉它们的含义和用法。始终双检你形成的任何逻辑表达式，以确保它真实代表了你想要实现的决策逻辑。如果需要，使用括号增加清晰度。\n\
  \n![Image](img/00105.jpeg)\n\n## 决策 - if 语句\n\n我们花了很多时间涵盖比较运算符和逻辑运算符，并讨论了它们如何用于构建逻辑表达式。但这一切是如何应用于计算机决策的？我们现在通过查看\
  \ C# 的 `if` 语句来解决这个问题。实际上，`if` 语句并不是单一语句，而是实现某些决策逻辑的语句组。它在概念上很简单。\n\n`if` 语句检查一个具有布尔（`bool`\
  \ 类型）结果的特定逻辑表达式。根据该表达式是真还是假，执行不同的 C# 语句组。这种逻辑 C#结构如下：\n\n```csharp\nif (expression)\n\
  {\n    [如果 expression 为真则执行的 C# 代码块]\n}\nelse\n{\n    [如果 expression 为假则执行的 C# 代码块]\n\
  }\n```\n\n让我们看看这里发生了什么。我们有一些由比较运算符和逻辑运算符构建的逻辑表达式。如果 `expression` 为真，则执行第一块 C# 语句（用一对左右大括号标记）。`else`（意味着表达式不为真，或者它为假），执行第二块\
  \ C# 语句。每个代码块都包含标准的 C# 语句，并有一定程度的缩进。无论 `expression` 是真是假，程序执行都会从最后一个右大括号（}`）之后的第一行\
  \ C# 代码继续。\n\n`else` 关键字和随其后的语句块是可选的。如果表达式为假时没有 C# 代码需要执行，那么 `if` 结构将是：\n\n```csharp\n\
  if (expression)\n{\n    [如果 expression 为真则执行的 C# 代码块]\n}\n```\n\n![Image](img/00122.jpeg)\n\
  \n假设你刚刚开了一家柠檬水摊，你想让计算机决定每杯收多少钱。定义一个 `int` 类型变量 `cost`（以及另一个变量 `temperature`）。请看这段\
  \ C# 代码：\n\n```csharp\nif (temperature > 90)\n{\n    cost = 50;\n}\nelse\n{\n  \
  \  cost = 25;\n}\n```\n\n我们看到如果 `temperature > 90` 为真，`cost` 将为 50。否则（温度不大于 90），`cost`\
  \ 将为 25。我们可以在没有 `else` 的情况下重写：\n\n```csharp\ncost = 25;\nif (temperature > 90)\n\
  {\n    cost = 50;\n}\n```\n\n在这里，在 `if` 结构之前，`cost` 为 25。只有当 `temperature` 大于 90\
  \ 时，`cost` 变为 50。否则，`cost` 保持为 25。尽管在这些示例中，每个决策只有一行 C# 代码，但我们并不限于一行。在 `if` 结构的代码块中可以使用任意行的\
  \ C# 代码。\n\n如果在我们的柠檬水摊示例中，我们想根据不同的温度值将定价结构划分为不同的成本值呢？`if` 结构可以修改为包含 `else if` 语句以考虑多个逻辑表达式。这样的结构是：\n\
  \n```csharp\nif (expression1)\n{\n    [如果 expression1 为真则执行的 C# 代码块]\n}\nelse if\
  \ (expression2)\n{\n    [如果 expression2 为真则执行的 C# 代码块]\n}\nelse if (expression3)\n\
  {\n    [如果 expression3 为真则执行的 C# 代码块]\n}\nelse\n{\n    [如果 expression1、expression2\
  \ 和 expression3 都为假则执行的 C# 代码块]\n}\n```\n\n你能看出这里发生了什么吗？它非常直观——只需向下处理代码即可。如果 `expression1`\
  \ 为真，执行第一块 C# 代码。如果 `expression1` 为假，程序检查 `expression2`（使用 `else if`）是否为真。如果 `expression2`\
  \ 为真，执行该代码块。如果 `expression2` 为假，则评估 `expression3`。如果 `expression3` 为真，执行相应的代码块。如果\
  \ `expression3` 为假，注意此时 `expression1`、`expression2` 和 `expression3` 都被发现为假，则执行 `else`\
  \ 块中的代码（这是可选的）。\n\n\n\n你可以根据需要使用任意数量的 `else if` 语句。然而你必须意识到，在 `if` 结构中只有一个 C# 代码块会被执行。这意味着一旦\
  \ C# 找到一个为真的逻辑表达式，它就会执行该代码块，然后离开该结构，并执行紧跟最后一个右大括号（}）之后的第一行代码。例如，在上面的示例中，如果 `expression1`\
  \ 和 `expression3` 都为真，则只有与 `expression1` 为真相关的 C# 语句会被执行。`if` 结构的规则是：只有与第一个真表达式关联的代码块会被执行。\n\
  \n我们能如何在我们的柠檬水示例中使用这一点呢？这段代码反映了更详细的定价结构：\n\n```csharp\nif (temperature > 90)\n{\n\
  \    cost = 50;\n}\nelse if (temperature > 80)\n{\n    cost = 40;\n}\nelse if (temperature\
  \ > 70)\n{\n    cost = 30;\n}\nElse\n{\n    cost = 25;\n}\n```\n\n如果 `temperature`\
  \ 是 85，成本会是多少？`temperature` 不大于 90，但大于 80，所以 `cost` 是 40。\n\n![Image](img/00349.jpeg)\n\
  \n如果这段代码被重写为：\n\n```csharp\nif (temperature > 70)\n{\n    cost = 30;\n}\nelse if\
  \ (temperature > 80)\n{\n    cost = 40;\n}\nelse if (temperature > 90)\n{\n    cost\
  \ = 50;\n}\nElse\n{\n    cost = 25;\n}\n```\n\n这看起来没什么区别——我们只是重新排列了一些语句。但是，请注意如果我们再次尝试寻找\
  \ `temperature` 等于 85 的 `cost`，会发生什么。第一个 `if` 表达式为真（`temperature` 大于 70），所以 `cost`\
  \ 是 30。这不是我们想要的结果，并将减少我们柠檬水摊的利润！这里有一个“第一个真”规则给了我们错误答案的案例——逻辑错误。\n\n这个例子指出了始终仔细检查你编写的任何\
  \ `if` 结构的必要性。确保你想要实现的决策逻辑正常工作。确保你尝试了执行所有可能决策的用例，并获得了正确的结果。这里使用的示例相对简单。显然，`if` 结构可以更加复杂得多。通过使用多个变量、多次比较和多个运算符，你可以开发出非常详细的决策过程。在剩下的课程项目中，你将看到此类过程的示例。\n\
  \n### 随机数生成器\n\n![Image](img/00231.jpeg)\n\n让我们先放过决策，来看一个有趣的 C# 概念——随机数。你曾经玩过 Windows\
  \ 接接牌游戏、扫雷或某些类似的游戏吗？你有没有注意到每次玩游戏时，得到的结果都是不同的？这是如何发生的？你如何能让计算机程序变得不可预测，或引入“随机性”的概念？关键在于\
  \ C# 随机数生成器。这个生成器在每次被引用时简单地产生一个不同的数字。\n\n你为什么需要随机数？在 Windows 接接牌游戏中，计算机需要洗一副扑牌。它需要“随机”对\
  \ 52 张牌进行排序。它使用随机数来这样做。如果你有一个掷骰子的游戏，你需要随机生成一个 1 到 6 之间的数字。随机数可以用于此。如果你需要抛硬币，你需要随机生成正面或反面。是的，随机数也被用于此。\n\
  \nVisual C# 有几种生成随机数的方法。我们将只使用其中一种——整数（全数）随机生成器。该生成器使用所谓的 `Random` 对象。\n\n\n\n\n\
  ![Image](img/00361.jpeg)\n\n## 设置控件属性\n\n使用属性窗口设置控件属性：\n\n| Form1 表单: |\n| 属性名称\
  \ | 属性值 |\n| :--- | :--- |\n| `Text` | 猜数字 |\n| `BorderStyle` | 固定单边 |\n| `StartPosition`\
  \ | 屏幕中心 |\n\n| textBox1 文本框: |\n| 属性名称 | 属性值 |\n| :--- | :--- |\n| `Name` | `txtMessage`\
  \ |\n| `TextAlign` |居中 |\n| `Font` | Arial |\n| `Size` | 16 |\n| `BackColor` | 白色\
  \ |\n| `ForeColor` | 蓝色 |\n| `ReadOnly` | True |\n| `TabStop` | False |\n\n| numericUpDown1\
  \ 数值调节控件: |\n| 属性名称 | 属性值 |\n| :--- | :--- |\n| `Name` | `nudGuess` |\n| `Font`\
  \ | Arial |\n| `Size` | 16 |\n| `BackColor` | 白色 |\n| `ForeColor` | 红色 |\n| `TextAlign`\
  \ | 居中 |\n| `Value` | 50 |\n| `Minimum` | 0 |\n| `Maximum` | 100 |\n| `Increment`\
  \ | 1 |\n| `ReadOnly` | True |\n| `Enabled` | False |\n\n| button1 按钮: |\n| 属性名称\
  \ | 属性值 |\n| :--- | :--- |\n| `Name` | `btnCheck` |\n| `Text` | 检查数字 |\n| `Enabled`\
  \ | False |\n\n| button2 按钮: |\n| 属性名称 | 属性值 |\n| :--- | :--- |\n| `Name` | `btnPick`\
  \ |\n| `Text` | 选取数字 |\n\n| button3 按钮: |\n| 属性名称 | 属性值 |\n| :--- | :--- |\n| `Name`\
  \ | `btnExit` |\n| `Text` | 退出 |\n\n![Image](img/00010.jpeg)\n\n完成后，你的表单看起来应该像这样（你可能需要移动并调整一些控件的大小以适应布局）：\n\
  \n![Image](img/00056.jpeg)\n\n我们最初将 `btnCheck` 和 `nudGuess` 的 `Enabled` 属性设置为 `False`。在点击“选取数字”按钮之前，我们不允许进行猜测。\n\
  \n![Image](img/00311.jpeg)\n\n# 编写事件方法\n\n这个项目是如何工作的？你点击 `Pick Number` 让电脑随机一个数字供你猜。此点击事件将“启用”数值调节控件和\
  \ `Check Guess` 按钮（记得我们最初将它们的 `Enabled` 属性设置为了 `False`）。使用数值调节控件输入你的猜测，然后点击 `Check\
  \ Guess`。电脑将通过消息框（`txtMessage`）告诉你的猜测是太低、太高还是正确。因此，我们需要为每个按钮编写一个 `Click` 事件方法。\n\
  \n项目中需要两个变量，都是 `int` 类型。一个变量将存储计算机选的数字（你尝试猜的数字）。我们将此变量命名为 `theNumber`。你当前的猜测将保存在变量\
  \ `myGuess` 中。你还需要一个名为 `myRandom` 的 `Random` 对象。打开代码窗口，在表单构造方法下的通用声明区域声明这些变量：\n\n\
  ```csharp\nint theNumber;\nint myGuess;\nRandom myRandom = new Random();\n```\n\n\
  ![Image](img/00108.jpeg)\n\n输入这些行后，代码窗口应该显示如下：\n\n![Image](img/00174.jpeg)\n\n当你点击\
  \ `Pick Number` 时，电脑需要执行以下步骤：\n\n* 选取一个 0 到 100 之间的随机整数。\n* 向用户显示一条消息。\n* 启用数值调节控件以允许猜测。\n\
  * 启用 `Check Guess` 按钮以允许猜测。\n\n并且我们将再添加一个步骤。在 Visual C# 中，很多时候你可能在程序运行时更改某个特定控件的功能。在这个游戏中，一旦我们点击\
  \ `Pick Number`，在数字被猜中之前，该按钮就没有其他用了。但如果我们在猜测之前决定放弃，我们需要一个按钮告诉我们答案。我们将使用 `btnPick`\
  \ 来实现这一点。我们将更改 `Text` 属性并添加判断逻辑来查看按钮处于何种“状态”。如果按钮在点击时显示为“Pick Number”（初始状态），将遵循上述步骤。如果按钮在点击时显示为“Show\
  \ Answer”（“进行中”状态），将显示答案并将表单控件恢复到初始状态。这是 Visual C# 中常见的做法。\n\n以下是完成所有操作 `btnPick_Click`\
  \ 代码：\n\n```csharp\nprivate void btnPick_Click(object sender, EventArgs e)\n{\n\
  \    if (btnPick.Text == \"Pick Number\")\n    {\n        // 获取新数字并设置控件\n      \
  \  theNumber = myRandom.Next(101);\n        txtMessage.Text = \"I'm thinking of\
  \ a number between 0 and 100\";\n        nudGuess.Value = 50;\n        nudGuess.Enabled\
  \ = true;\n        btnCheck.Enabled = true;\n        btnPick.Text = \"Show Answer\"\
  ;\n    }\n    else\n    {\n        // 只显示答案并重置控件\n        txtMessage.Text = \"The\
  \ answer is\" + Convert.ToString(theNumber);\n        nudGuess.Value = theNumber;\n\
  \        nudGuess.Enabled = false;\n        btnCheck.Enabled = false;\n        btnPick.Text\
  \ = \"Pick Number\";\n    }\n}\n```\n\n\n\n\n\n# 引言\n\n如果 `inputValue` 是正数（大于 0），则\
  \ `yourValue` 被赋值为 `inputValue`。如果 `inputValue` 是负数（小于 0），则 `yourValue` 被赋值为 `inputValue`\
  \ 的数值值，不带负号。以下是示例：\n\n| value | Math.Abs(value) |\n| :--- | :--- |\n| 6 | 6 |\n\
  | -6 | 6 |\n| 0 | 0 |\n| -1 | 1 |\n\n在我们的数字猜测游戏中，我们可以使用 `Math.Abs` 来查看猜测与实际数字之间的距离。一种可能的逻辑是：\n\
  \n```csharp\nif (myGuess == theNumber)\n{\n    // 正确答案的 C# 代码块\n}\nelse if (Math.Abs(myGuess\
  \ - theNumber) <= 1)\n{\n    // 接近 - 在范围 1 以内的 C# 代码块\n}\nelse if (Math.Abs(myGuess\
  \ - theNumber) <= 2)\n{\n    // 较热 - 在范围 2 以内的 C# 代码块\n}\nelse if (Math.Abs(myGuess\
  \ - theNumber) <= 3)\n{\n    // 温暖 - 在范围 3 以内的 C# 代码块\n}\nelse\n{\n    // 冰冷 - 超过\
  \ 3 的 C# 代码块\n}\n```\n\n最后一种可能的改变是将项目变成一个游戏，并告诉猜测者猜测数字距离目标“有多远”。我相信你还能想出其他方式来更改它。祝你玩愉快。\n\
  \n![Image](img/00339.jpeg)\n\n## 总结\n\n在本类中，你学习了用于数字的有用输入控制，将在下一节课中学习其他控件。你学习了 C#\
  \ 决策的关键部分。你学习了逻辑表达式、比较运算符和结构。你会发现图标对象是许多游戏中很有趣的部分。你正朝着成为程序员的道路迈进。\n\n## 图标、组框、单选按钮\n\
  \n![Image](img/0170.jpeg)\n\n## 复习与预览\n\n你现在应该已经非常习惯在 Visual 环境中工作，并知道构建项目的步骤。在本类中，我们学习了与在\
  \ C# 中制作相关的控件：组框、复选框和单选按钮。我们将学习另一种使用结构做出决策的方法。我们将为项目制作图标会很有趣，并且你将构建项目。\n\n![Image](img/00004.jpeg)\n\
  \n## 图标\n\n你是否注意到，每当你设计或运行项目时，表单左上角都会出现一张小图片？这张图片被称为图标。图标在整个环境中都广泛使用。你的桌面上可能有很多图标——每个都代表某个应用程序。使用资源管理器查看文件。注意每个文件都有关联的图标。这里有一个空白表单：\n\
  \n![Image](img/00117.jpeg)\n\n看到的图标是表单的默认图标。它真的很无聊。通过使用表单的 `Icon` 属性，你可以将此显示图标改为更亮眼的内容。在学习如何操作之前，让我们先看看如何找到图标甚至设计你自己的图标。\n\
  \n![Image](img/00312.jpeg)\n\n### 自定义图标\n\n图标是一种带有 `.ico` 扩展名的特殊图形文件。它是一张尺寸为 32\
  \ x 32 像素的图片。互联网上有大量的免费图标可以下载到电脑并使用。搜索“free 32 x 32 ico files”，你会看到许多选择。我们建议的一个网站是：\n\
  \n`http://www.softicons.com/toolbar-icons/32x32-free-design-icons-by-aha-soft/`\n\
  \n在这样的网站上，你只需要将 `.ico` 文件下载到电脑并保存。可以使用 Visual Studio 创建自己的图标。要做到这一点，你需要了解画画工具的使用。我们将向你展示如何创建一个图标模板，并在\
  \ Paint 中打开和保存它。为此，我们假设你已经具备使用 Paint 的基础知识。关于如何使用 Paint 的更多细节，请访问并在搜索教程。\n\n![Image](img/00219.jpeg)\n\
  \n为特定项目创建图标，在解决方案管理器（Solution Explorer）中，右键点击项目名称，选择添加（Add），然后新建项（New Item）。将出现此窗口：\n\
  \n![Image](img/00271.jpeg)\n\n如所示，展开项（Items）并选择通用（General）。然后选择图标文件（Icon File）。命名你的图标并点击添加。微软画画工具中将打开一个通用图标：\n\
  \n![Image](img/00192.jpeg)\n\n图标非常小。让我们做一些更改使其可见且可编辑。首先，将图像调整大小为 32 x 32 像素。然后，使用放大镜使图像尽可能大。最后，在图形中添加网格。完成后，我看到：\n\
  \n![Image](img/00355.jpeg)\n\n此时，我们可以通过将像素设置为特定颜色来添加我们所需的任何细节。完成后，通过文件菜单保存图标。图标将保存在你的项目文件中，并被你的项目使用。图标文件（在此情况下为\
  \ `Icon1.ico`）也列在解决方案管理器中：\n\n![Image](img/00212.jpeg)\n\n### 为表单分配图标\n\n如所述，要为表单分配图标，你只需设置表单的\
  \ `Icon` 属性即可。让我们试一下。\n\n启动 Visual 并创建一个新项目。应该出现一个空白表单。进入属性窗口并点击 `Icon` 属性。会出现省略号（`...`）按钮。这允许选择你下载或创建的图标。如下：\n\
  \n![Image](img/0048.jpeg)\n\n## 组框控件\n\n组框（Group Box）简单来说包含其他控件的控件。组框提供了一种分离和分组控件的方法，并具有整体启用/禁用功能。这意味着如果你禁用了组框，其中的所有控件也将被禁用。组框没有事件，只有属性。感兴趣的事件是与控件相关的事件。编写这些事件的方法与它们不在组框中时相同。组框从工具箱中选择。显示如下：\n\
  \n工具箱中：\n\n![Image](img/0091.jpeg)\n\n表单上（默认属性）：\n\n![Image](img/0106.jpeg)\n\n\
  ### 属性\n\n组框属性有：\n\n| 属性 | 说明 |\n| :--- | :--- |\n| Name | 用于标识组框的名称。组框名称的三字母前缀为\
  \ `grp`。 |\n| Text | 组框顶部的标题信息。 |\n| Font | 设置标题文字的样式、大小和类型。 |\n| BackColor | 设置组框背景色。\
  \ |\n| ForeColor | 设置标题文字颜色。 |\n| Left | 组框距离左侧距离（属性窗口中，展开位置属性）。 |\n| Top | 组框距离顶部的距离（属性窗口中，展开位置属性）。\
  \ |\n| Width | 组框的宽度（展开大小属性）。 |\n| Height | 组框的高度（展开大小属性）。 |\n| Enabled | 决定组框内的所有控件是否可以响应用户事件（在运行时）。\
  \ |\n| Visible | 决定组框（及其附控件）是否出现在表单上（在运行时）。 |\n\n像表单对象一样，组框是一个容器控件，因为它“装载”其他控件。因此，放置在组框中的控件将共享\
  \ BackColor、ForeColor 和 Font 属性。要更改这一点，请选择所需的控件（在放置到组框上后）并更改所需的属性。\n\n\n\n\n\n#\
  \ 在分组框中放置控件\n\n![Image](img/00180.jpeg)\n\n如前所述，分组框的单一任务是包含其他控件。要将控件放置在分组框中，你首先需要在表单上定位并调整分组框的大小。然后，必须将关联的控件放置在分组框内。这允许你同时移动分组框和控件。有几种方法可以将控件放置在分组框中：}\n\
  \n* • 使用任何常规方法直接将控件放置在分组框中。\n* • 在分组框外部绘制控件并将其拖入框内。\n* • 将控件复制并粘贴到分组框中（在执行粘贴操作之前，确保已选中分组框）。\n\
  \n为了确保控件已正确放置在分组框中，请尝试移动分组框（使用移动句柄），并确保关联的控件随之移动。要从分组框中移除控件，只需将其拖出控件框范围即可。\n\n##\
  \ 示例\n\n启动 Visual C# 并新建一个新项目。在表单上放置一个分组框并调整其大小使其足够大。在 Visual C# 工具箱中选择 `button`\
  \ 控件。拖动控件直到它位于分组框上方。将控件释放到分组框中。移动分组框，按钮应该随之移动。如果它没有移动，说明它没有被正确放置在分组框中。如果你需要删除控件，选中它然后按键盘上的\
  \ `Del` 键。尝试将按钮从分组框中移到表单上。再将按钮移回分组框内。\n\n在分组框内放置第二个按钮。在分组框内放置一个 `numeric updown`\
  \ 控件。注意控件是如何与分组框关联的。警告：如果你删除了分组框，关联的控件也将被删除！运行项目。注意你可以点击按钮并使用 `numeric updown` 控件。停止项目。将分组框的\
  \ `Enabled` 属性设置为 `False`。再次运行项目。注意分组框的标题（通过 `Text` 属性设置）变为灰色，分组框上的所有控件现在都已禁用——你无法点击按钮或数字上调控件。因此，通过简单设置一个\
  \ `Enabled` 属性（分组框的属性），我们可以启用或禁用多个单独控件。停止项目。将分组框的 `Enabled` 属性重置为 `True`。将 `Visible`\
  \ 属性设置为 `False`（在设计模式下将保持可见）。运行项目。分组框及其所有控件将不会出现。你可以使用分组框控件的 `Visible` 属性来隐藏（或显示）一组控件（如果你的项目需要这样做）。停止项目。\n\
  \n![Image](img/00234.jpeg)\n\n将 `Visible` 属性改回 `True`。在分组框内放置一个 `label` 控件。更改分组框的\
  \ `BackColor` 属性。注意标签控件的背景颜色取了相同的值，而按钮控件不受影响。回想，这是因为分组框是一个“容器”控件。有时，这种属性的共享是一个很好的有利用处，特别是对于标签控件。在其他情况下，它是一种困扰。如果你不想让控件与分组框共享属性（`BackColor`、`ForeColor`、`Font`），你必须单独更改你不喜的属性。分组框在我们接下来看到的两个控件中将大派用场：`check\
  \ box` 和 `radio button`。你会发现颜色属性的共享对于这两个控件来说是一个很棒的效果。它节省了我们更改许多颜色的工作！\n\n## 分组框控件的典型用法\n\
  \n分组框控件的常规设计步骤是：\n\n* ➢ 设置 `Name` 和 `Text` 属性（可能更改 `Font`、`BackColor` 和 `ForeColor`\
  \ 属性）。\n* ➢ 将所需的控件放置在分组框中。使用常规技术监控分组框内控件的事件。\n\n![Image](img/00285.jpeg)\n\n## 复选框控件\n\
  \n复选框提供了一种从一组事物中选择的方法。当复选框被选中时，框内会出现一个标记。每个复选框独立工作。组中的某些、全部或无选项都可以被选中。复选框可以使用的一个示例是从冰淇淋配料列表中进行选择。你可能想要原味的，你可能想要一些配料，你可能想要全配的——由你决定。复选框也单独单独用于指示特定项目选项是否激活。例如，它可以指示控件的文本是否为加粗（已选）或未加粗（未选）。\n\
  \n复选框通常在分组框控件中。从工具箱中选择复选框控件。它显示如下：\n\n工具箱中：\n\n![Image](img/00286.jpeg)\n\n在表单上（默认属性）：\n\
  \n![Image](img/00007.jpeg)\n\n### 属性\n\n复选框属性有：\n\n| 属性 | 说明 |\n| :--- | :--- |\n\
  | `Name` | 用于标识复选框的名称。复选框名称的三字母前缀是 `chk`。 |\n| `Text` | 复选框旁标识文本。 |\n| `TextAlign`\
  \ | 指定显示文本的位置。 |\n| `Font` | 设置显示文本的样式、大小和类型。 |\n| `Checked` | 表示框是否被选中 (`True`)\
  \ 或未选中 (`False`)。 |\n| `BackColor` | 设置复选框背景颜色。 |\n| `ForeColor` | 设置显示文本的颜色。 |\n\
  | `Left` | 如果在表单上，从表单左侧到复选框左侧的距离。如果在分组框内，从分组框左侧到复选框左侧的距离（属性窗口中的 X，展开 `Location`\
  \ 属性）。 |\n| `Top` | 如果在表单上，从表单顶端到复选框顶部的距离。如果在分组框内，从分组框顶部到复选框顶部的距离（属性窗口中的 Y，展开 `Location`\
  \ 属性）。 |\n| `Width` | 复选框的宽度（展开 `Size` 属性）。 |\n| `Height` | 复选框的高度（展开 `Size` 属性）。\
  \ |\n| `Enabled` | 决定复选框是否可以响应用户（运行时）。 |\n| `Visible` | 决定复选框是否显示（运行时）。 |\n\n特别注意\
  \ `Left` 和 `Top` 属性。注意如果复选框在分组框内，这两个属性提供的是分组框内的位置，而不是表单的位置。\n\n![Image](img/00084.jpeg)\n\
  \n## 示例\n\n启动 Visual C# 并新建一个项目。绘制分组框——我们将始终使用分组框来分组复选框。使用之前的方法在分组框内放置三个四个复选框。移动分组框以确保复选框在框内。运行项目。点击复选框观察标记如何出现和消失。注意你可以选择任意数量的框。在代码中，我们会检查每个复选框的\
  \ `Checked` 属性以确定哪些被选中。停止项目。更改分组框的 `BackColor`。注意复选框控件的背景颜色随之变化。这是使用分组框作为容器的好结果。你注意到我们不需要编写任何\
  \ C# 代码来让标记出现或消失吗？那是由复选框控件处理的。然而，复选框有事件。让我们来看一个。\n\n## 事件\n\n| 事件 | 说明 |\n| :---\
  \ | :--- |\n| `CheckedChanged` | 当复选框的 `Checked` 属性更改时执行的事件。 |\n\n每当用户点击复选框时，都会发生该事件，在框内放置标记或移除标记。\n\
  \n## 复选框控件的典型用法\n\n复选框控件的常规设计步骤是：\n\n* ➢ 设置 `Name` 和 `Text` 属性。初始化 `Checked` 属性。\n\
  * ➢ 监控 `CheckedChanged` 事件以确定何时点击控件。在任何时候，读取 `Checked` 属性以确定复选框状态。\n* ➢ 你可能还想更改\
  \ `Font`、`BackColor` 和 `ForeColor` 属性。\n\n## 单选按钮控件\n\n![Image](img/00333.jpeg)\n\
  \n\n\n\n\n单选按钮（Radio button）提供了一种从一组项目中进行“互斥”选择的方法。这是一种高级说法，意味着组中只能选中其中一个项目。当单选按钮被选中时，按钮中会出现一个实心圆。组中的其他按钮不能被选中，也不能有实心圆。你可以在很多地方使用单选按钮——每当你想在一组中只做一个选择时，就可以使用它们。假设你有一个适合一到四人的游戏——使用单选按钮来选择人数。单选按钮可以选择背景颜色，也可以选择街机游戏的难度级别。随着你编写越来越多的\
  \ Visual C# 程序，你将依赖单选按钮作为一种选择工具。\n\n## 单选按钮\n\n单选按钮总是分组工作的，每个组必须位于单独组框控件中。一个组框内的单选按钮与另一个组框内的单选按钮独立运行。因此，通过使用组框，你可以拥有任意数量的单选按钮组。从工具箱中选择：\n\
  \n### 工具箱：\n![Image](img/00338.jpeg)\n\n### 表单上（默认属性）：\n![Image](img/00189.jpeg)\n\
  \n### 属性\n\n单选按钮的属性如下：\n\n| 属性 | 说明 |\n| :--- | :--- |\n| `Name` | 用于标识单选按钮的名称。单选按钮名称的三字母前缀为\
  \ `rdo`。 |\n| `Text` | 单选按钮旁的标识文本。 |\n| `TextAlign` | 指定显示文本的位置。 |\n| `Font` | 设置显示文本的样式、大小和类型。\
  \ |\n| `Checked` | 表示按钮是否被选中 (True) 或未选中 (False)。一组中只能有一个按钮具有 `True` 值。 |\n| `BackColor`\
  \ | 设置单选按钮的背景颜色。 |\n| `ForeColor` | 设置显示文本的颜色。 |\n| `Left` | 如果在表单上，从表单左侧到单选按钮左侧的距离。如果在组框内，则从组框左侧到单选按钮左侧的距离（属性窗口中的\
  \ `X`，展开 `Location` 属性）。 |\n| `Top` | 如果在表单上，从表单顶部到单选按钮顶部的距离。如果在组框内，则从组框顶部到单选按钮顶部的距离（属性窗口中的\
  \ `Y`，展开 `Location` 属性）。 |\n| `Width` | 单选按钮的宽度（像素）（展开 `Size` 属性）。 |\n| `Height`\
  \ | 单选按钮的高度（像素）（展开 `Size` 属性）。 |\n| `Enabled` | 决定单选按钮内的所有控件是否能响应用户事件（运行模式）。 |\n\
  | `Visible` | 决定单选按钮是否显示在表单上（运行模式）。 |\n\n在设计模式下，每组单选按钮中应始终有一个按钮的 `Checked` 属性被设置为\
  \ `True`。同样，如果单选按钮在组框内，`Left` 和 `Top` 属性提供的是在组框内的位置，而不是表单上的位置。\n\n## 示例\n\n启动 Visual\
  \ C# 并新建一个新项目。绘制一个组框。记住，每个独立的单选按钮组（我们所做的每个决策都需要一个组）必须放在单独的组框中。使用之前讨论的技巧在组框中放置三个或四个单选按钮。将其中一个按钮的\
  \ `Checked` 属性设置为 `True`。运行项目。注意看到一个按钮有一个实心圆（即你初始化 `Checked` 属性的那个）。点击另一个单选按钮。该按钮将被填充，而之前填充的按钮将不再被填充。继续点击按钮以理解它们的工作原理。在事件方法中，我们将检查每个单选按钮的\
  \ `Checked` 属性以确定哪一个被选中了。停止项目。你注意到没有，就像复选框一样，我们不需要编写任何 C# 代码来让实心圆出现或消失？这是由控件本身处理的。更改组框的\
  \ `BackColor` 属性，发现所有“包含”的单选按钮也改变了背景颜色。\n\n在表单上绘制另一个组框。在该组框中放置两个或三个单选按钮，并将一个按钮的\
  \ `Checked` 属性设置为 `True`。一如既往，确保按钮正确地放置在组框中。运行项目。更改第二个组中的被选中按钮。注意更改这组单选按钮对之前的组没有影响。记住，一个组框内的单选按钮不会影响另一个组框内的单选按钮。组框用于实现独立的选择。如果你愿意，可以尝试更多的组框和单选按钮。停止项目。\n\
  \n## 事件\n\n![Image](img/00196.jpeg)\n\n唯一感兴趣的单选按钮事件是 `CheckedChanged` 事件：\n\n| 事件\
  \ | 说明 |\n| :--- | :--- |\n| `CheckedChanged` | 当 `Checked` 属性更改时执行的事件。 |\n\n当组中的一个单选按钮获得\
  \ `True` 的 `Checked` 属性时，组内所有其他按钮的 `Checked` 属性设置为 `False`。我们不需要编写 C# 代码来实现此——这是自动完成的。\n\
  \n## 单选按钮控件的典型用途\n\n单选按钮控件通常的设计步骤为：\n\n*   通过将它们放在同一个组框控件中来建立单选按钮组\n*   对于组中的每个按钮，设置\
  \ `Name`（给每个按钮起一个类似的名称以识别它们所属组）和 `Text` 属性。你还可能更改 `Font`、`BackColor` 和 `ForeColor`\
  \ 属性。\n*   将一个按钮的 `Checked` 属性初始化为 `True`。\n*   监控组中每个单选按钮的 `CheckedChanged` 事件，以确定何时点击了按钮。组中“最后被点击”的按钮\
  \ `Checked` 属性始终为 `True`。\n\n## C# - 第四课\n\n到目前，你已经学习了许多 C# 语言知识。在本课中，我们只看一个新概念——另一种做决策的方法。\n\
  \n## 决策 – Switch 结构\n\n![Image](img/00356.jpeg)\n\n在上一节课中，我们学习了 `if` 结构，这是使用比较运算符和逻辑运算符让\
  \ Visual C# 决策的方法。我们看到 `if` 结构非常灵活，允许实现各种决策逻辑。在做决策时，我们往往只是想检查一个变量或表达式的值。根据该表达式可能具有的任何值，我们希望在\
  \ C# 代码中采取特定行动。我们可以使用 `if` 和 `else if` 语句来实现这种逻辑。C# 提供了另一种做此类决策的方法。\n\n当仅检查单个变量的值时，复杂的\
  \ `if` 结构的替代方案是 C# 的 `switch` 结构。`switch` 结构的组成部分有：\n\n*   `switch` 关键字\n*   一个控制变量\n\
  *   一个或多个 `case` 语句，后跟一个由冒号（:`）结束的值。冒号之后是当变量等于对应值时执行的代码。\n*   可选的 `break` 语句，用于在执行\
  \ case 代码后离开结构。\n*   可选的 `default` 块，当没有先前的 case 语句被执行时执行。\n\n该结构的通用形式为：\n\n```csharp\n\
  switch (variable)\n{\ncase value1:\n    [当 variable == value1 时执行的 C# 代码]\n    break;\n\
  case value2:\n    [当 variable == value2 时执行的 C# 代码]\n    break;\n.\n.\ndefault:\n\
  \    [当没有其他代码执行时执行的代码]\n    break;\n}\n```\n\n在此示例中，如果 `variable = value1`，则执行第一个代码块。如果\
  \ `variable = value2`，则执行第二个。如果没有发现变量与值之间的后续匹配，则执行 `default` 块中的代码。\n\n此代码等同于以下\
  \ `if` 结构：\n\n```csharp\nif (variable == value1)\n{\n    [当 variable = value1 时执行的\
  \ C# 代码]\n}\nelse if (variable == value2)\n{\n    [当 variable = value2 时执行的 C# 代码]\n\
  }\n.\n.\nelse\n{\n    [当没有其他代码执行时执行的代码]\n}\n```\n\n\n\n\n\n关于 `switch` 的几点说明。`break`\
  \ 语句虽然是可选的，但几乎总是存在的。如果在特定的 `case` 结尾没有看到 `break` 语句，接下来的 `case` 或多个 `case` 将执行，直到遇到\
  \ `break` 为止。这与 `if` 语句的行为不同，在 `if` 语句中只能执行一个“case”。其次，`switch` 结构中的所有执行块都包含在花括号中，但每个\
  \ `case` 内部的块不需要有大括号（它们是可选的）。这与 C# 中的大多数代码块不同。查看下一个项目中对 `switch` 结构的使用，以了解其使用示例。\n\
  \n# 项目 - 三明治制作器\n\n![Image](img/00294.jpeg)\n\n当地的一家明治店听说了你卓越的 Visual C# 编程技能，聘请你为他们的点餐系统制作计算机版本。这是一个尝试使用组框（group\
  \ boxes）、复选框（check boxes）和单选按钮（radio buttons）展示技能的绝佳地方！\n\n## 项目设计\n\n在这样的项目中，将现有流程（点三明治）制作成计算机版本，设计步骤通常非常简单。我们询问了三明治店是如何操作的，他们是这样告诉我们的：\n\
  \n> • 三种面包选择（只能选一种）：白面包、全麦面包、黑面包\n> • 五种肉类选择（可任选）：烤牛肉、火腿、火鸡、熏牛肉片、萨拉米肠\n> • 三种奶酪选择（只能选一种）：无、美国奶酪、瑞士奶酪\n\
  > • 六种调料选择（可任选）：芥末酱、蛋美酱、生菜、西红柿、洋葱、酸黄\n\n所需的控件是显而易见的。\n\n我们需要一组三个单选按钮用于面包，一组五个复选框用于肉类，一组三个单选按钮用于奶酪，以及六个用于调料的复选框。我们添加添加一个用于清空菜单板的按钮，一个用于“制作”三明治的按钮，以及一个带有标题信息标签的文本框，在其中我们将打印三明治订单。该项目保存为课程项目文件夹中的\
  \ `Sandwich`（路径 `\\VCSKids\\VCSK Projects`）。\n\n## 在表单上放置控件\n\n在 Visual C# 中启动新项目。在表单上放置并调整四个组框的大小。在第一个组框中放置三个单选按钮（用于面包选择，记住如何正确在组框中放置控件）。在第二个组框中放置五个复选框（用于肉类选择）。在第三个组框中放置三个单选按钮（用于奶酪选择）。在第四个组框中放置六个复选框（用于调料选择）。添加两个按钮、一个标签和一个文本框。我的表单看起来如下：\n\
  \n![Image](img/00340.jpeg)\n\n是的，在处理复选框和单选按钮时会涉及到很多控件，甚至更多的属性。准备好了吧！\n\n## 设置控件属性\n\
