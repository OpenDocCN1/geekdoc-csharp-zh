- "# 少儿 Visual C#：计算机编程循序渐进教程\n\n\n\n![](img/00319.jpeg)\n\n\n\n![Image](img/00129.jpeg)\n\
  \n\n\n\n本本《少儿版 Visual C#》及相关软件许可供单个用户使用。课程副本不得分发或提供给任何其他用户。教育机构可申领多份副本许可。请联系 Kidware\
  \ Software 获取学校站点许可信息。\n\n本指南是为 Kidware Software（华盛顿州梅普维尔谷）制作的“少儿版 Visual C#”课程而开发的。它并非\
  \ Visual C# 语言的完整参考书。请咨询微软网站获取详细的参考信息。\n\n本指南以商品名称引用了若干软件和硬件产品。这些引用仅供参考，所有商标均为其各自公司和所有者的财产。Microsoft、`Visual\
  \ Studio`、`Small Basic`、`Visual Basic`、`Visual J#`、`Visual C#`、`IntelliSense`、`Word`、`Excel`、`MSDN`\
  \ 和 `Windows` 均为微软公司的商标。`Java` 是 Oracle 公司的商标。\n\n书中描述的示例公司、组织、产品、域名、电子邮件地址、标志、人物、地点和事件均为虚构。不意味着也不应推断与任何真实的公司、组织、产品、域名、电子邮件地址、标志、人物、地点或事件有任何关联。\n\
