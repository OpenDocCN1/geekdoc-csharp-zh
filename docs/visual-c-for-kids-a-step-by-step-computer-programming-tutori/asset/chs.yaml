  \n![Image](img/00005.jpeg)\n\n正如我们所说的，在处理复选框和单选按钮时会涉及到很多控件——在组框中需要放置许多控件，需要设置许多属性。这是开发计算机应用程序的一部分。很多时候，这项工作是枯燥且无味的。但当你知道一旦完成后，你的项目将拥有一个用户都知道如何使用的专业界面时，你会感到非常满足。现在，让我们编写事件方法——它们非常简单。\n\
  \n\n\n\n在这个项目中，你将使用各种组框中的复选框（check boxes）和单选按钮（radio buttons）来指定所需的明治。完成所有选择后，点击\
  \ `Order`，订单明治的原料将打印在文本框中（供制作人员阅读）。点击 `Clear` 将将菜单板恢复到初始状态，以便进行下一次订单。因此，我们需要为每个按钮控件编写\
  \ `Click` 事件。\n\n我们还需要一种方法来确定哪些复选框和哪些单选按钮被选中。我们该如何做呢？注意，在点击 `Order` 按钮之前，每个复选框的最终状态尚未确立。此时，我们可以检查每个复选框的\
  \ `Checked` 属性（由 Visual C# 自动设置）来查看它是否被选中。因此，我们不需要为这些框编写专门的事件方法。\n\n单选按钮的值属性在组中的某个按钮被点击时建立，从而改变其\
  \ `Checked` 属性。对于单选按钮，我们将使用 `CheckedChanged` 事件来跟踪组内当前选了哪个按钮。这需要两个整数变量，一个用于跟踪选择了哪种面包（`breadChoice`），另一个用于跟踪选择了哪种奶酪（`cheeseChoice`）。我们将使用这些值来表示选择：\n\
  \n| `breadChoice:` | `cheeseChoice:` | | |\n| Value | 选中的面包 | Value | 选中的奶酪 |\n\
  | :--- | :--- | :--- | :--- |\n| 1 | 白面包 | 0 | 无 |\n| 2 | 小麦面包 | 1 | 美国芝 |\n| 3\
  \ | 黑麦面包 | 2 | 瑞士芝 |\n\n使用变量来表示单选按钮的选择是常见做法。\n\n我们将添加两个变量（`numberMeats` 和 `numberCondiments`）来计算选择了多少肉类和调料。打开代码窗口，并在表构造方法下的通用声明区域声明这些变量：\n\
  \n```csharp\nint breadChoice;\nint cheeseChoice;\nint numberMeats;\nint numberCondiments;\n\
  ```\n\n代码窗口看起来应该是这样的：\n\n![Image](img/00024.jpeg)\n\n`breadChoice` 和 `cheeseChoice`\
  \ 必须初始化以匹配初始选中的单选按钮：`rdoWhite`（白面包）在面包组中有一个初始 `True` 值（对应 `Checked` 属性），因此 `breadChoice`\
  \ 初始为 1；`rdoNone`（无奶酪）在奶酪组中有一个初始 `True` 值（对应 `Checked` 属性），因此 `cheeseChoice` 初始为\
  \ 0。在 `Form1_Load` 方法中设置这些初始值（记住，这里总是第一次使用这些值的好地方）：\n\n```csharp\nprivate void Form1_Load(object\
  \ sender, EventArgs e)\n{\n    // 初始化面包和奶酪选择\n    breadChoice = 1;\n    cheeseChoice\
  \ = 0;\n}\n```\n\n在明治菜单板上输入所有选择后，点击 `Order`。此时，计算机需要执行以下操作：\n\n- 决定选择了哪种面包\n- 决定选择了哪些肉类（如果有）\n\
  - 决定选择了哪种奶酪（如果有）\n- 决定选择了哪些调料（如果有）\n- 将“订单”放入文本框中\n\n![Image](img/00071.jpeg)\n\n\
  让我们来看看是如何做出每个决定的。\n\n关于面包和奶酪的决定是相似的——它们都使用单选按钮。选中的面包由变量 `breadChoice` 给出。`breadChoice`\
  \ 在三个面包单选按钮的每个 `CheckedChanged` 事件中确立。代码非常简单。首先是 `rdoWhite_CheckedChanged`：\n\n\
  ```csharp\nprivate void rdoWhite_CheckedChanged(object sender, EventArgs e)\n{\n\
  \    // 选择了白面包\n    breadChoice = 1;\n}\n```\n\n`rdoWheat_CheckedChanged`:\n\n```csharp\n\
  private void rdoWheat_CheckedChanged(object sender, EventArgs e)\n{\n    // 选择了小麦面包\n\
  \    breadChoice = 2;\n}\n```\n\n`rdoRye_CheckedChanged`:\n\n```csharp\nprivate\
  \ void rdoRye_CheckedChanged(object sender, EventArgs e)\n{\n    // 选择了黑麦面包\n  \
  \  breadChoice = 3;\n}\n```\n\n使用类似的代码来确定 `CheeseChoice`。`rdoNone_CheckedChanged`\
  \ 事件方法：\n\n```csharp\nprivate void rdoNone_CheckedChanged(object sender, EventArgs\
  \ e)\n{\n    // 未选择奶酪\n    cheeseChoice = 0;\n}\n```\n\n`rdoAmerican_CheckedChanged`:\n\
  \n```csharp\nprivate void rdoAmerican_CheckedChanged(object sender, EventArgs e)\n\
  {\n    // 选择了美国芝\n    cheeseChoice = 1;\n}\n```\n\n`rdoSwiss_CheckedChanged`:\n\n\
  ```csharp\nprivate void rdoSwiss_CheckedChanged(object sender, EventArgs e)\n{\n\
  \    // 选择了瑞士芝\n    cheeseChoice = 2;\n}\n```\n\n通过上述代码，我们看到在点击 `Order` 时，面包和奶酪的选择已经确定了。然而，我们并不知道肉类和调料的选择。确定这些选择的唯一方法是检查每个单独复选框的\
  \ `Checked` 属性，查看它是否被勾选。这在 `btnOrder_Click` 事件方法中完成。我们在此方法中还将完整订单放入文本框控件。让我们来看看如何操作。\n\
  \n文本框中显示的信息存储在它的 `Text` 属性中。我们分阶段构建这个多行的 `Text` 属性。阶段如下：\n\n- 在 `Text` 属性中建立面包类型（使用\
  \ `switch`）。\n- 将 `Text` 属性替换为之前的值加上任何添加的肉（对每种肉类使用 `if` 语句）。\n- 将 `Text` 属性替换为之前的值加上任何添加的奶酪（使用\
  \ `switch`）。\n- 将 `Text` 属性替换为之前的值加上任何添加的调料（对每种调料使用 `if` 语句）。\n- `Text` 属性完成。\n\n\
  项目被添加到 `Text` 属性中（我们会大量的拼接），我们还想把每个项目放在单独的一行。\n\n```csharp\nprivate void btnOrder_Click(object\
  \ sender, EventArgs e)\n{\n    // 开始面包类型\n    txtOrder.Text = \"Sandwich:\\n\";\n\
  \    switch (breadChoice)\n    {\n        case 1:\n            txtOrder.Text +=\
  \ \"White Bread\\n\";\n            break;\n        case 2:\n            txtOrder.Text\
  \ += \"Wheat Bread\\n\";\n            break;\n        case 3:\n            txtOrder.Text\
  \ += \"Rye Bread\\n\";\n            break;\n    }\n\n    // 添加肉类\n    numberMeats\
  \ = 0;\n    if (chkRoast.Checked)\n    {\n        txtOrder.Text += \"Roast Beef\\\
  n\";\n        numberMeats++;\n    }\n    if (chkHam.Checked)\n    {\n        txtOrder.Text\
  \ += \"Ham\\n\";\n        numberMeats++;\n    }\n    if (chkTurkey.Checked)\n  \
  \  {\n        txtOrder.Text += \"Turkey\\n\";\n        numberMeats++;\n    }\n \
  \   if (chkSalami.Checked)\n    {\n        txtOrder.Text += \"Salami\\n\";\n   \
  \     numberMeats++;\n    }\n    if (numberMeats == 0)\n    {\n        txtOrder.Text\
  \ += \"No Meat\\n\";\n    }\n\n    // 添加奶酪类型\n    switch (cheeseChoice)\n    {\n\
  \        case 0:\n            txtOrder.Text += \"No Cheese\\n\";\n            break;\n\
  \        case 1:\n            txtOrder.Text += \"American Cheese\\n\";\n       \
  \     break;\n        case 2:\n            txtOrder.Text += \"Swiss Cheese\\n\"\
  ;\n            break;\n    }\n\n    // 添加调料\n    numberCondiments = 0;\n    if (chkMustard.Checked)\n\
  \    {\n        txtOrder.Text += \"Mustard\\n\";\n        numberCondiments++;\n\
  \    }\n    if (chkMayo.Checked)\n    {\n        txtOrder.Text += \"Mayonnaise\\\
  n\";\n        numberCondiments++;\n    }\n    if (chkLettuce.Checked)\n    {\n \
  \       txtOrder.Text += \"Lettuce\\n\";\n        numberCondiments++;\n    }\n \
  \   if (chkTomato.Checked)\n    {\n        txtOrder.Text += \"Tomato\\n\";\n   \
  \     numberCondiments++;\n    }\n    if (chkOnions.Checked)\n    {\n        txtOrder.Text\
  \ += \"Onions\\n\";\n        numberCondiments++;\n    }\n    if (chkPickles.Checked)\n\
  \    {\n        txtOrder.Text += \"Pickles\\n\";\n        numberCondiments++;\n\
  \    }\n    if (numberCondiments == 0)\n    {\n        txtOrder.Text += \"No Condiments\\\
  n\";\n    }\n\n    txtOrder.Text += \"Order Placed!\";\n}\n```\n\n\n\n\n哇！这是一个非常长的事件方法。而且，在我们完成之后，我们真正拥有的只是一个非常长的\
  \ `txtOrder.Text` 属性。但凭借你的 C# 知识，你应该能看到它其实并不复杂，只是很长。该方法中的每一步都非常有逻辑。\n\n有几点注释。首先，当你根据这些笔记输入方法时，请注意文字处理器因为超出右页边距而进行“自动换行”的地方。看起来那里像是一个新行，但不要在你的\
  \ C# 代码中开启新行。请在 Visual C# 代码窗口中将每行代码写在一行。\n\n其次，这是一个练习复制和粘贴技能的好地方。注意很多代码都非常相似。使用复制和粘贴（高亮文本，选择\
  \ Edit 菜单，然后 Copy - 移动到粘贴位置，选择 Edit 菜单，然后 Paste）。粘贴文本后，务确保你对粘贴的文本进行了必要的更改！\n\n第三，对于像这样长的方法，我建议先输入一段代码（例如选择奶酪的部分），保存项目，然后运行项目以确保该部分工作正常。然后添加另一个部分并进行测试。再添加另一个部分并测试。Visual\
  \ C# 让这种增量添加变得非常容易。这也减少了你需要做的程序“调试”量。\n\n![Image](img/00097.jpeg)\n\n### btnClear\
  \ Click 事件\n\n我们需要最后一个事件方法 - `btnClear_Click` 事件。点击 Clear 将重置面包和奶酪的选择，清空所有复选框，并清空文本框。该事件如下：\n\
  \n```csharp\nprivate void btnClear_Click(object sender, EventArgs e)\n{\n    //\
  \ 将面包设置为白色\n    breadChoice = 1;\n    rdoWhite.Checked = true;\n\n    // 清空所有肉类选择\n\
  \    chkRoastBeef.Checked = false;\n    chkHam.Checked = false;\n    chkTurkey.Checked\
  \ = false;\n    chkPastrami.Checked = false;\n    chkSalami.Checked = false;\n\n\
  \    // 将奶酪设置为无\n    cheeseChoice = 0;\n    rdoNone.Checked = true;\n\n    // 清空所有调料选择\n\
  \    chkMustard.Checked = false;\n    chkMayo.Checked = false;\n    chkLettuce.Checked\
  \ = false;\n    chkTomato.Checked = false;\n    chkOnions.Checked = false;\n   \
  \ chkPickles.Checked = false;\n\n    // 清空文本框\n    txtOrder.Text = \"\";\n}\n```\n\
  \n你完成了！点击工具栏上的 Save All 按钮保存你的项目。\n\n![Image](img/00113.jpeg)\n\n## 运行项目\n\n运行项目。在菜单板上进行选择，然后点击\
  \ Order。很酷对吧？这是我最喜欢的三明治：\n\n![Image](img/00317.jpeg)\n\n一如既往，确保所有复选框和单选按钮都能正常工作，并在文本框中提供正确的信息。确保\
  \ Clear 按钮有效。注意只有当三明治订单很长时，文本滚动条才会激活。如果某些功能没有按预期工作，请重新检查控件属性和事件方法。如果你需要进行任何更改，请保存项目。\n\
  \n### 其他尝试的内容\n\n![Image](img/00208.jpeg)\n\n注意，停止这个项目的唯一方法是点击 Visual C# 工具栏上的 Stop\
  \ 按钮，或者点击 Sandwich Maker 表单右上角像 X 的框。我们可能应该在表单上放一个 Exit 按钮。尝试添加一个以及它的代码。记住 C# 的\
  \ `this.Close()` 语句可以停止项目。\n\n三明治店主非常喜欢你的程序，她想把它连接到她的收银机上。她希望你修改程序，使其也能在（底部）打印出三明治的价格。我们会提供步骤，你来完成工作。老板说三明治花费\
  \ $3.95。每种额外的肉类选择额外收取 $0.75（$3.95 的价格已包含一种肉），并且有 8% 的销售税。\n\n现在是步骤：(1) 定义一个 `double`\
  \ 类型变量 `cost` 来计算三明治费用，(2) 在设置文本框的 `Text` 属性后，使用以下代码段计算 `cost`（将此段放在 `btnOrder_Click`\
  \ 事件方法中最后一个右大括号之前）：\n\n```csharp\n// 从基础费用开始\ncost = 3.95;\n\n// 检查是否有额外的肉\nif (numberMeats\
  \ > 1)\n{\n    cost = cost + (numberMeats - 1) * 0.75;\n}\n\n// 添加 8% 的销售税\ncost\
  \ = cost + 0.08 * cost;\n\n// 将费用添加到文本属性\ntxtOrder.Text = txtOrder.Text + Convert.ToString(cost);\n\
  ```\n\n你能看到它是如何运作的吗？特别是查看用于判断是否需要收取额外肉费的 `if` 结构。现在运行项目，看费用神奇地出现了（我最喜欢的三明治花费 5.886）。注意，费用值可能多于或少于我们在处理货币时希望看到的两位小数。使用\
  \ `Convert.ToString` 方法将小数转换为字符串时，我们无法控制显示多少位（如果有的话）小数。\n\n另一个 C# 方法可以帮助我们实现这一点\
  \ - C# 的 `Format` 函数。我们将展示如何使用 `Format` 显示美元金额。如需了解更多关于 `Format` 的信息（这是一个非常有用的函数，我们只是在本课程中没用），请咨询\
  \ Visual C# 在线帮助系统。为 `cost` 显示两位小数，将最后一行代码替换为：\n\n```csharp\ntxtOrder.Text = txtOrder.Text\
  \ + String.Format(\"{0:f2}\", cost);\n```\n\n## 总结\n\n在这节课中，我们学习了用于选择的非常有用的控件：组框、复选框和单选按钮。而且，我们查看了另一种决策方法：switch\
  \ 结构。通过这些工具，你构建了最大的项目 - 三明治制作器。这个项目有很多控件、很多需要设置的属性，以及大量的 C# 代码需要编写。但我想你看到，通过仔细的规划和系统的方法，构建这样一个复杂的项目并不困难。在下节课中，我们将开始学习\
  \ C# 中一个非常有趣的部分 - 图形！\n\n\n\n\n\n和表单以及组框（group box）对象一样，面板（panel）是一个容器控件，因为它“持有”了其他控件。因此，放置在面板中的许多控件将共享\
  \ `BackColor` 属性（注意面板没有 `Text` 属性）。要更改此属性，请选择所需的控件（在将其放置于组框之后）并更改背景颜色。此外，请注意，面板是使用显示的“句柄”来移动的，这与上一节课中处理组框的过程相同。\n\
  \n## 面板控件的典型用法\n\n使用面板控件的通常设计步骤如下：\n\n-   ➢ 设置 `Name` 属性。\n-   ➢ 将所需的控件放置在面板控件中。\n\
  -   ➢ 使用常用技术监控面板内控件的事件。\n\n## 使用面板控件进行图形绘制\n\n如前所述，面板控件看起来非常像组框，其用途也相似。如果需要，可以使用面板来代替组框控件。然而，面板控件的一个强大功能（组框不具备的功能）是它对图形的支持。我们可以将控件作为空白画布来创作自己的的艺术品！为了帮助我们成为计算机艺术家，有许多新概念需要学习。让我们现在来看看这些概念。\n\
  \n## 图形方法\n\n![Image](img/00124.jpeg)\n\n在 Visual C# 中进行图形绘制时，我们使用内置的图形方法。方法是一个过程或函数，类似于我们一直在使用的事件方法，它能对对象或控件执行某些操作。大多数控件都有方法，而不只是面板。对于面板，可以使用图形方法在上面绘制某些内容。方法只能在运行模式下使用。使用方法的\
  \ C# 代码为：\n\n```\nobjectName.MethodName(Arguments);\n```\n\n其中 `ObjectName` 是感兴趣的对象，`MethodName`\
  \ 是正在使用的方法，并且可能包含一些参数或参数（方法执行任务所需的信息）。注意，这是我们在代码中设置控件属性时使用的点符号表示法（dot notation）的另一种形式。在本节中，我们将查看可以绘制彩色线条的图形方法。随着你编程技能的提高，鼓励你学习许多其他可以绘制矩形、椭圆、多边形和几乎任何形状、任何颜色的图形方法。要使用面板绘制线条，我们需要引入另一个概念：图形对象（graphics\
  \ object）。\n\n## 图形对象\n\n你需要告诉 Visual C# 你将配合面板控件使用图形方法。为了做到这一点，你将面板控件转换为称为“图形对象”的东西。图形对象为图形方法提供了“表面”。创建图形对象需要两个简单的步骤。我们首先使用标准声明语句声明该对象。如果我们将图形对象命名为\
  \ `myGraphics`，则格式如下：\n\n```\nGraphics myGraphics;\n```\n\n此声明放在代码窗口的通用声明区域，与我们通常变量声明放在一起。一旦声明，使用\
  \ `CreateGraphics` 方法创建对象：\n\n```\nmyGraphics = controlName.CreateGraphics();\n\
  ```\n\n其中 `controlName` 是托管图形对象的控件名称（在我们的工作中是面板控件的 `Name` 属性）。我们将在项目的 `Load` 事件中创建此对象。\n\
  \n一旦创建了图形对象，所有的图形方法都会应用于这个新形成的对象。因此，要将名为 `GraphicsMethod` 的图形方法应用于 `myGraphics`\
  \ 对象，请使用：\n\n```\nmyGraphics.GraphicsMethod(Arguments);\n```\n\n其中 `Arguments` 是任何所需的参数，或者图形方法所需的信息。\n\
  \n我们现在介绍两个重要的图形方法。首先，在图形对象中完成所有大量的绘制工作后，有时你可能想要擦除或清除该对象。这是通过 `Clear` 方法完成的：\n\n\
  ```\nmyGraphics.Clear(Color);\n```\n\n该语句将清除图形对象（`myGraphics`）并用指定的 `Color` 填充它。我们将进一步讨论颜色。清除图形对象的常用颜色参数是主机控件（`controlName`）的背景颜色，或者：\n\
  \n```\nmyGraphics.Clear(controlName.BackColor);\n```\n\n当你完成对对象的绘制并不再需要它时，应该正确释放以清理系统资源。要对我们的示例图形对象实现这一点，请使用\
  \ `Dispose` 方法：\n\n```\nmyGraphics.Dispose();\n```\n\n此语句通常放在 `FormClosing` 事件方法中。\n\
  \n我们的绘制需要颜色和称为“笔”（pens）的对象，所以让我们来看看这些概念。我们需要笔来画画这不是很合理吗？\n\n## 颜色\n\n![Image](img/00184.jpeg)\n\
  \n颜色在 Visual C# 中起着重要作用。我们在设计之前的某些应用程序时已经见过颜色。在设计时，我们为不同的控件选择了背景颜色（`BackColor` 属性）和前景色颜色（`ForeColor`\
  \ 属性）。此类选择通过在属性窗口中选择所需的属性来实现。一旦选中，就会出现一个供你选择的自定义调色板。\n\n大多数图形方法和图形对象都使用颜色。例如，我们接下来研究的笔对象有一个\
  \ `Color` 参数，指定了它绘制时使用的颜色。与控件颜色属性不同，这些颜色无法在设计时选择。它们必须在代码中定义。我们如何做到这一点？我们将采取两种方法：(1)\
  \ 使用内置颜色 (2) 创建颜色。\n\nVisual C# 内置的颜色由 `Color` 结构指定。我们在某些示例和项目中见过一些颜色。使用以下方式指定颜色：\n\
  \n```\nColor.ColorName\n```\n\n其中 `ColorName` 是预留的颜色名称。有很多颜色名称（我数了有 141 个）。有像 `BlanchedAlmond`、`Linen`、`NavajoWhite`、`PeachPuff`\
  \ 和 `SpringGreen` 这样的颜色。你不需要记住这些名字。\n\n每当你在代码窗口输入单词 `Color` 后加上点（`.`），Visual C#\
  \ 的智能提示（Intellense）功能就会弹出一个颜色列表。只需从列表中选择即可完成颜色。不过，你必须记住 BlanchedAlmond 和 Linen 之间的区别！\n\
  \n如果由于某种原因，`Color` 结构提供的选择不符合你的需求，有一种方法允许你创建超过 1600 万种不同的颜色。该方法（`FromArgb`）与 `Color`\
  \ 结构配合。指定颜色的语法为：\n\n```\nColor.FromArgb(Red, Green, Blue)\n```\n\n其中 `Red`、`Green`\
  \ 和 `Blue` 是对应原色的强度整数值。例如，`Color.FromArgb(255, 255, 0)` 将产生黄色。抱歉，我无法告诉你使用什么值来创建\
  \ PeachPuff。\n\n使用 `Color` 结构为图形方法指定颜色是很容易的。每当你需要颜色时，只需使用内置颜色之一或 `FromArgb` 方法。这些表示颜色的技术不仅限于为图形方法提供颜色。它们可以用任何\
  \ Visual C# 需要颜色的的地方；例如，`BackColor` 和 `ForeColor` 属性也可以使用这些技术（在运行时）设置。例如，要将表单背景颜色更改为\
  \ `Color.PeachPuff`：\n\n你也可以定义带有颜色值的变量。这是一个两步过程。假设我们想定义一个名为 `myRed` 的变量来表示红色。首先，在通用声明区域，将你的变量声明为类型\
  \ `Color`：\n\n```\nColor myRed;\n```\n\n然后，在代码中使用以下方式定义你的颜色：\n\n```\nmyRed = Color.Red;\n\
  ```\n\n从现在起，你可以在任何需要红色的地方使用 `myRed`。\n\n![Image](img/00237.jpeg)\n\n\n\n\n进入课程项目文件夹（`\\\
  VCSKids\\VCS Projects`）并打开名为 `RGBColors` 的项目。运行此项目。这里有三个数字增减控件：一个控制红色（`R =`）内容，一个控制绿色（`G\
  \ =`）内容，一个控制蓝色（`B =`）内容。为每个颜色设置值，并使用 `FromArgb` 函数查看对应的颜色。尝试这个项目，并查看该函数支持的所有颜色。查看完所有\
  \ 1600 万种组合需要多久？需要很长时间！运行中的项目看起来像这样：\n\n![Image](img/00181.jpeg)\n\n在你玩完颜色后，停止项目。看看你是否能弄清楚这个小项目是如何工作的。\n\
  \n# 笔对象\n\n![Image](img/00334.jpeg)\n\n如前所述，许多图形方法（包括画线方法）都需要一个 `Pen` 对象。这个虚拟笔就像你用来写字和画画时使用的笔一样。你可以选择颜色和宽度。你可以使用\
  \ Visual C# 内置的笔，也可以创建你自己的笔。\n\n在很多情况下，Visual C# 内置的笔对象已经足够了。这些笔将以你选择的颜色画出 1 像素宽的线（Intellisense\
  \ 将提供供选择的列表）。如果选定的颜色是 `ColorName`（141 内置颜色名称之一），则引用此类笔的语法为：\n\n`Pens.ColorName`\n\
  \n创建你自己的笔与创建图形对象类似，但在这里我们创建的是 `Pen` 对象。要创建你自己的 `Pen` 对象，你首先使用以下代码声明笔：\n\n```cs\n\
  Pen myPen;\n```\n\n此行位于通用声明区域。然后使用 `Pen` 构造函数创建该笔：\n\n```cs\nmyPen = new Pen(Color,\
  \ Width);\n```\n\n其中 `Color` 是你的新笔将画出的颜色，`Width` 是所画线条的整数宽度（单位为像素）。笔通常以 `Load` 方法的形式创建。这支笔将画出实线。`Color`\
  \ 参数可以是内置颜色之一，也可以是用 `FromArgb` 函数生成的颜色。\n\n一旦创建，你可以随时使用笔对象的 `Color` 和 `Width` 属性更改颜色和宽度。语法如下：\n\
  \n```cs\nmyPen.Color = newColor;\nmyPen.Width = newWidth;\n```\n\n在这里，`newColor`\
  \ 是新指定的颜色，`newWidth` 是新的整数笔宽。\n\n与图形对象一样，在使用完笔对象后，应该使用 `Dispose` 方法将其释放：\n\n```cs\n\
  myPen.Dispose();\n```\n\n这种释放通常以 `FormClosing` 方法的形式出现。\n\n我们几乎已经准备好画线了——请耐心！再来一个概念，我们就可以上路了。\n\
  \n# 图形坐标\n\n我们将使用 Visual C# 通过一个名为 `DrawLine` 的方法来画线。在查看此方法之前，让我们看看如何指定用于画线和连接线条的点。所有图形方法都使用默认坐标系。这意味着我们有一种特定方法来引用控件（我们工作中的一个面板）中承载图形对象的单个点。所使用的坐标系是：\n\
  \n![Image](img/00274.jpeg)\n\n我们使用两个值（坐标）来识别面板中的单个点。`x`（水平）坐标从左到右增加，从 0 开始。`y`（垂直）坐标从上到下增加，同样从\
  \ 0 开始。面板中的点通过括号括起来的两个坐标，即 `(x, y)` 来引用。注意 `x` 和 `y` 分别类似于 `Left` 和 `Top` 控件属性。显示的所有值都以像素为单位。\n\
  \n终于，我们准备好画几条线了。\n\n# DrawLine 方法\n\nVisual C# 的 `DrawLine` 方法用于用直线连接两个点。它在之前创建的图形对象上操作。如果该对象是\
  \ `myGraphics` 且我们想用笔对象 `myPen` 将点 `(x1, y1)` 与 `(x2, y2)` 连接，则语句为：\n\n```cs\nmyGraphics.DrawLine(myPen,\
  \ x1, y1, x2, y2);\n```\n\n笔对象可以是内置笔之一，也可以是你使用刚刚讨论的笔构造函数创建的。每个坐标值都是整数类型。使用内置的黑色笔（`Pens.Black`），带有这些点的\
  \ `DrawLine` 方法为：\n\n```cs\nmyGraphics.DrawLine(Pens.Black, x1, y1, x2, y2);\n```\n\
  \n这在面板（`MyGraphics` 对象）上产生：\n\n![Image](img/00019.jpeg)\n\n要将最后一个点 `(x2, y2)` 连接到另一个点\
  \ `(x3, y3)`，使用：\n\n```cs\nmyGraphics.DrawLine(Pens.Black, x2, y2, x3, y3);\n```\n\
  \n这在面板（`MyGraphics` 对象）上产生：\n\n![Image](img/00062.jpeg)\n\n对于你画的每一段线，都需要单独的 `DrawLine`\
  \ 语句。要连接一条线和另一段，你需要保存第一段线中画的最后一个点（使用两个整数变量，一个用于 `x`，一个用于 `y`）。这个保存的点将成为下一段线的起点。你可以根据自己的意愿随时更改笔的颜色。\n\
  \n# 图形回顾\n\n![Image](img/0279.jpeg)\n\n我们涵盖了使用 `DrawLine` 方法的很多内容：\n- 在通用声明区域声明图形对象。\n\
  - 在 `Load` 方法中创建图形对象。\n- 选择笔对象（内置或创建自己的）。\n- 使用指定的坐标进行 `DrawLine`。\n\n## 示例\n\n\
  开始一个 Visual C# 新项目。放置一个名为 `panel1` 的控件。将其 `BackColor` 设置为白色。\n\n![Image](img/109.jpeg)\n\
  \n在通用声明区域声明你的图形对象：\n\n```cs\nGraphics myGraphics;\n```\n\n在 `Form1_Load` 事件中，添加此行代码创建图形对象：\n\
  \n```cs\nmyGraphics = panel1.CreateGraphics();\n```\n\n在 `button1_Click` 事件中，编写从\
  \ `(10, 10)` 到 `(260, 160)` 的线：\n\n```cs\nmyGraphics.DrawLine(Pens.Black, 10, 10,\
  \ 260, 160);\n```\n\n并在 `Form1_FormClosing` 事件中，释放你的图形对象：\n\n```cs\nmyGraphics.Dispose();\n\
  ```\n\n确保你的代码窗口看起来如下：\n\n![Image](img/255.jpeg)\n\n运行项目。点击按钮。代码从左上角的 `(10, 10)`\
  \ 到右下角的 `(260, 160)` 画了一条黑线：\n\n![Image](img/198.jpeg)\n\n停止项目。在 `button1_Click`\
  \ 事件中的当前行之后添加此行，将最后一点连接到 `(260, 10)`：\n\n```cs\nmyGraphics.DrawLine(Pens.Red, 260,\
  \ 160, 260, 10);\n```\n\n再次运行项目。添加了一条红线，连接最后一点到 `(260, 10)`：\n\n![Image](img/250.jpeg)\n\
  \n停止项目。让我们创建一个宽笔。在通用声明区域添加此行以声明 `myPen`：\n\n```cs\nPen myPen;\n```\n\n在 `Form1_Load`\
  \ 事件中添加此行代码，将 `myPen` 创建为宽度为 10 的蓝色笔：\n\n```cs\nmyPen = new Pen(Color.Blue, 10);\n\
  ```\n\n在 `Form1_FormClosing` 事件中添加此行代码以释放 `myPen`：\n\n```cs\nmyPen.Dispose();\n\
  ```\n\n现在，在 `button1_Click` 事件中已有的线条之后添加此行，画一条“宽”蓝色线来完成一个小小三角形：\n\n```cs\nmyGraphics.DrawLine(myPen,\
  \ 260, 10, 10, 10);\n```\n\n运行项目，点击按钮，你应该看到：\n\n![Image](img/296.jpeg)\n\n\n\n[content]\n\
  添加更多线段，如果你喜欢，可以使用其他点和颜色。尝试创建具有不同颜色和线条宽度的画笔。保存此项目——我们将继续使用它。我想你已经明白了绘画的意图了。只需选择一些点，选择一些颜色，然后画几条线。但是，仅仅指定点并看线条画出来是非常无聊的。如果能有一些用户交互，可以使用鼠标绘制点，就太好了。而这正是我们要做的。我们将利用新学到的图形方法知识来构建一个\
  \ Visual C# 绘画程序。不过，为了实现这一点，我们需要知道如何在项目中使用鼠标。我们现在就开始学习。\n\n# C# - 第五课\n\n在本课的 C#\
  \ 课程中，我们将研究如何识别鼠标事件（点击和释放按钮、移动鼠标），以帮助我们构建带有面板控件（panel control）的绘画程序。\n\n## 鼠标事件\n\
  \n![Image](img/00341.jpeg)\n\n与图形方法相关的是鼠标事件。鼠标是 Visual C# 中进行图形处理的主要接口。我们已经使用过鼠标点击控件了。在这里我们看到如何识别控件中的其他鼠标事件。许多控件都能识别鼠标事件——我们正在学习它们是为了在面板控件中进行绘画。\n\
  \n### MouseDown 事件\n\n当鼠标光标悬停在控件上并按下鼠标按钮时，就会触发 `MouseDown` 事件。该方法的格式为：\n\n```csharp\n\
  private void controlName_MouseDown(object sender, MouseEventArgs e)\n{\n    [C#\
  \ code for MouseDown event]\n}\n```\n\n这是我们第一次在事件方法中使用参数（括号中的信息）。这些信息是 C# 在执行此事件方法时为我们供之使用的信息。注意，此方法有两个参数：`sender`\
  \ 和 `e`。`sender` 是导致此事件（`MouseDown`）发生的被点击控件。在我们的情况下，它将是面板控件。参数 `e` 是事件处理程序，揭示了点击了哪个按钮以及在按下按钮时鼠标光标的坐标。我们对事件处理程序\
  \ `e` 的三个属性感兴趣：\n\n| Value | 描述 |\n| :--- | :--- |\n| `e.Button` | 按下的鼠标按钮。可能的值有：`MouseButtons.Left`、`MouseButtons.Center`、`MouseButtons.Right`\
  \ |\n| `e.X` | 鼠标点击时光标在控件中的 X 坐标 |\n| `e.Y` | 鼠标点击时光标在控件中的 Y 坐标 |\n\n`MouseDown`\
  \ 事件只能检测到一个按钮的按下——你无法判断是否是否同时按了左、右鼠标键。在绘画应用程序中，`MouseDown` 事件用于初始化绘画过程。点击点击的点用于开始绘制线条，而点击的按钮通常用于选择线条颜色。\n\
  \n![Image](img/00288.jpeg)\n\n## 示例\n\n让我们用刚才在图形方法中使用示例来尝试 `MouseDown` 事件。回想一下，我们现在表单上有一个面板控件和一个按钮。从表单中删除按钮控件。在表单底部添加两个标签框（一个默认名称为\
  \ `label1`，另一个默认名称为 `label2`）——我们将使用它们来告诉我们点击了哪个按钮并显示鼠标点击坐标。我的表单看起来像这样：\n\n![Image](img/00289.jpeg)\n\
  \n将这些代码行放入 `panel1_MouseDown` 事件中（从面板控件的属性窗口中选择该事件）：\n\n```csharp\nprivate void\
  \ panel1_MouseDown(object sender, MouseEventArgs e)\n{\n    switch (e.Button)\n\
  \    {\n        case MouseButtons.Left:\n            label1.Text = \"Left\";\n \
  \           break;\n        case MouseButtons.Middle:\n            label1.Text =\
  \ \"Middle\";\n            break;\n        case MouseButtons.Right:\n          \
  \  label1.Text = \"Right\";\n            break;\n    }\n    label2.Text = Convert.ToString(e.X)\
  \ + \",\" + Convert.ToString(e.Y);\n}\n```\n\n在这里，我们使用 `switch` 结构来指定点击了哪个按钮（显示在\
  \ `label1` 的 Text 属性中），并在 `label2` 的 Text 属性中显示 `e.X` 和 `e.Y`（逗号分隔）。运行项目。点击面板并注意显示的按钮和坐标。这是一个我点击的点示例：\n\
  \n![Image](img/00074.jpeg)\n\n尝试不同的鼠标按钮。点击面板中的各个位置，观察坐标如何变化。点击左上角附近。(X, Y) 是否接近\
  \ (0, 0)？应该是的。多玩玩这个示例，直到你熟悉 `MouseDown` 事件的工作方式以及坐标的含义。停止并保存项目。\n\n![Image](img/00098.jpeg)\n\
  \n### MouseUp 事件\n\n`MouseUp` 事件是 `MouseDown` 事件的相反。每当之前按下的鼠标按钮释放时，就会触发它。该方法格式为：\n\
  \n```csharp\nprivate void controlName_MouseUp(object sender, MouseEventArgs e)\n\
  {\n    [C# code for MouseUp event]\n}\n```\n\n注意 `MouseUp` 的参数与 `MouseDown` 相同。唯一的区别是\
  \ `e.Button` 告诉我们释放了哪个鼠标按钮。在绘画程序中，`MouseUp` 事件意味着当前绘画过程的停止。\n\n## 示例\n\n从示例的 `panel1_MouseDown`\
  \ 方法中剪切代码（高亮代码，点击 Edit 菜单，然后 Cut），并粘贴到 `panel1_MouseUp` 方法中（从面板控件的属性窗口中选择该事件）。运行项目。点击面板并注意显示的按钮和坐标。熟悉\
  \ `MouseUp` 事件的工作方式以及与 `MouseDown` 事件的区别。\n\n### MouseMove 事件\n\n![Image](img/00114.jpeg)\n\
  \n与图形方法相关的是鼠标事件。鼠标是 Visual C# 中进行图形处理的主要接口。我们已经使用过鼠标点击控件了。在这里我们看到如何识别控件中的其他鼠标事件。许多控件都能识别鼠标事件——我们正在学习它们是为了在面板控件中进行绘画。\n\
  \n`MouseMove` 事件在鼠标光标在控件上移动时持续触发。该方法的格式为：\n\n```csharp\nprivate void controlName_MouseMove(object\
  \ sender, MouseEventArgs e)\n{\n    [C# code for MouseMove]\n}\n```\n\n是的，参数与 `MouseDown`\
  \ 相同。唯一的区别是 `e.Button` 告诉我们按下了哪个鼠标按钮。在绘画程序中，`MouseMove` 事件用于检测之前开始线条的延续。如果正在绘画，使用当前笔将当前点连接到上一个点。\n\
  \n## 示例\n\n从示例的 `panel1_MouseUp` 方法中剪切代码并粘贴到 `panel1_MouseMove` 方法中。运行项目。点击面板并注意显示的按钮和坐标。当鼠标移动时，坐标\
  \ (X, Y) 会持续显示并变化。标签框会告诉我们按了哪个按钮。停止项目。\n[/content]\n]content][content]\n# 项目 - 趣味绘画\n\
  \n![Image](img/00297.jpeg)\n\n你曾经用彩色粉笔在黑板上画画吗？你将在本项目中构建的“电子”黑板上这样做。此项目保存为 `Blackboard`，位于项目文件夹\
  \ (`\\VCSKids\\VCS Projects`) 中。\n\n## 项目设计\n\n这个项目在概念上非常简单。使用鼠标在黑板上绘制彩色线条。面板控件代表黑板。单选按钮用于选择颜色。鼠标事件控制绘画过程。有两个命令按钮：用于擦除黑板，用于退出程序。\n\
  \n## 在表单上放置控件\n\n在 Visual C# 中新建项目。在表单上放置一个面板控件（尽可能大）、一个组框和两个命令按钮。在组框中放置八个单选按钮（用于颜色选择）。完成后，我的表单看起来像这样：\n\
