  private void btnNext_Click(object sender, EventArgs e)\n{\n    // 生成下一个随机问题\n  \
  \  btnNext.Enabled = false;\n    answer = myRandom.Next(50);\n    // 显示选中的州\n  \
  \  txtState.Text = state[answer];\n    // Vused 数组用于查看哪些首府\n    // 被选为可能的答案\n  \
  \  int[] vUsed = new int[50];\n    int[] index = new int[4];\n    for (int i = 0;\
  \ i < 50; i++)\n    {\n        vUsed[i] = 0;\n    }\n    // 随机选取四个不同的州索引 (J)\n \
  \   // 这些用于设置多选题答案\n    // 存储在 Index 数组中\n    for (int i = 0; i < 4; i++)\n    {\n\
  \        // 寻找未未使用且不是答案的索引\n        //寻找未未使用且不是答案的索引\n        do\n        {\n  \
  \          j = myRandom.Next(50);\n        }\n        while (vUsed[j] != 0 || j\
  \ == answer);\n        vUsed[j] = 1;\n        index[i] = j;\n    }\n    // 现在用正确答案替换其中一个索引\n\
  \    index[myRandom.Next(4)] = answer;\n    // 在文本框中显示多选题答案\n    for (int i = 0;\
  \ i < 4; i++)\n    {\n        listedCapital[i].Text = capital[index[i]];\n    }\n\
  \    // 设置首个问题\n    btnNext.PerformClick();\n}\n```\n\n此程序中的一个新概念是使用 `do` 循环（阴影行）来选择不同的可能的答案。让我们解释这个特定的循环是如何工作的。\n\
  \n代码中使用的形式为：\n\n```csharp\ndo\n{\n    [C# 代码]\n}\nwhile condition;\n```\n\n\n\n\n\
  \n在这个“循环”中，`do` 行和 `while` 行之间的 C# 代码只要指定的条件为真，就会重复执行。看看你是否能看出这个循环如何允许我们为选题答案选择四个不同的首都（不重复重复的值）。\n\
