  \n你需要知道的第二点是 `Text` 是一个字符串类型的属性。它只能包含字符串值。在运行时设置 `Text` 属性时，`Text` 信息必须加引号。例如，如果你有一个名为\
  \ `lblExample` 的标签控件并并将 `Text` 属性设置为 `My Label Box`，将使用 C# 代码（注意点符号）：\n\n```\nlblExample.Text\
  \ = “My Label Box”;\n```\n\n在设计模式下设置 `Text` 时不需要担心引号。Visual C# 知道这是一个字符串值。\n\n##\
  \ 事件\n\n![Image](img/00314.jpeg)\n\n只有一个感兴趣的标签事件：\n\n| 事件 | 描述 |\n\n| :--- | :---\
  \ |\n| Click | 用户用鼠标点击标签时执行的事件。 |\n\n通过此事件，你可以允许用户在一组显示的标签框中进行选择。你为什么要这样做呢？示例应用程序包括测试中的多选题或颜色选择。\n\
  \n![Image](img/00326.jpeg)\n\n## 事件\n\n![Image](img/0155.jpeg)\n\n文本框最重要的属性是 `Text`。作为程序员，你需要知道这个属性何时改变了，以便使用它。有两个事件可以做到这一点：\n\
  \n| 事件 | 描述 |\n| :--- | :--- |\n| TextChanged | 每当 `Text` 改变时执行的事件。 |\n| Leave |\
  \ 用户离开文本框时执行的事件。 |\n\n`TextChanged` 事件非常频繁——每当在文本框中打字按下按键时执行。在此事件方法中查看 `Text` 属性将获得其当前值。\n\
  \n`Leave` 事件是检查 `Text` 更有用的事件。记住在设计模式下放置控件时，你可以通过点击它使其“激活”。在运行时也有类似的概念。用户一次只能与一个控件交互。用户正在交互的控件（产生事件）被称为焦点。当用户在文本框中打字时，该框具有焦点。`Leave`\
  \ 事件在离开文本框且另一个控件获得焦点时执行。此时，我们知道用户已完成在文本框中的打字并更改了 `Text` 属性。这就是为什么这个事件方法是获取 `Text`\
  \ 属性值的好地方。\n\n\n\n\n> ➢ 在需要的地方的代码中分配 `Text` 属性。\n> ➢ 你可能还想更改 `Font`、`Backcolor`\
  \ 和 `Forecolor` 属性。\n\n# C# - 第二课\n\n![Image](img/00214.jpeg)\n\n在本课程中，你将学习一些新的\
  \ C# 概念。我们将讨论变量（名称、类型、声明）、算术运算，以及处理字符串的一些函数和技巧。\n\n## 变量\n\n所有的计算机程序都在处理各种类型的信息。数字、文本、颜色和图片是它们处理的信息类型。计算机程序在处理信息时需要地方来存储这些信息。我们已经见过\
  \ Visual C# 项目使用的一种存储类型——控件属性。控件属性存储如控件大小、控件外观、控件在表上的位置以及控件颜色等信息。\n\n但是，控件属性并不存储项目可能需要的所有信息。如果我们需要知道如果每根香蕉\
  \ 25 分钱，十根香蕉多少钱呢？我们需要一个地方来存储香蕉的数量、每根香蕉的价格以及这两个数字相乘的结果。为了在 Visual C# 项目中存储控件属性以外的信息，我们使用被称为“变量”的东西。之所以称为变量，是因为存储其中的信息在程序执行过程中可能会改变或变化。变量是\
  \ Visual C# 项目中移动信息的主要方法。在使用变量时，必须遵循某些规则。这些规则与我们已经为控件属性建立的规则非常相似。\n\n### 变量名称\n\n\
  你必须为项目项目中使用的每个变量命名。变量命名的规则如下：\n\n- 长度不超过 40 个字符。\n- 只能使用字母、数字和下划线 (`_`) 字符。\n- 第一个字符必须是字母。在\
  \ Visual C# 中，虽然不是强制，但习惯上第一个字母是小写。\n- 你不能使用 Visual C# 保留的单词（例如，你不能有一个名为 `Form` 的变量，或者名为\
  \ `Beep` 的变量）。\n\n最重要的规则是使用有意义的变量名称。你应该能够通过观察名称来识别存储在变量中的信息。例如，在我们买香蕉的示例中，好的名称应该是：\n\
  \n| 数量 | 变量名 |\n| :--- | :--- |\n| 每根香蕉的价格 | `bananaCost` |\n| 购买的香蕉数量 | `bananas`\
  \ |\n| 所有香蕉的费用 | `totalBananaCost` |\n\n![Image](img/00268.jpeg)\n\n正如之前的课程提到的，Visual\
  \ C# 语言是区分大小写的。这意味着名称 `BananaCost` 和 `bananacost` 指向不同的变量。确保为每个变量分配唯一的、易于识别的名称。与控件名称一样，我们建议混合使用大和小写字母以提高可读性。你会发现，在输入代码时，Visual\
  \ C# 编辑器会需要调整控件名称、变量和 C# 保留关键字的大小写。\n\n### 变量类型\n\n我们需要知道每个变量存储的信息的类型。用于属性的相同类型也可以应用于变量：`int`（整数）、`bool`（布尔）和\
  \ `string`（字符串）。还有其他类型——对于你可能使用的类型，请查阅在线帮助。\n\n在这里，我们看另一种将在变量中使用的类型：`double` 类型。到目前为止，我们处理过的所有项目都使用了整数（或全数）值。但我们知道，大多数“现实世界”数学涉及小数。`double`\
  \ 类型就是这样——一个带有小数点的数字。在计算机语言中，我们称之为浮点数。那个浮动（移动）的“点”就是小数点。`double` 类型数字的示例有：\n\n|\
  \ 2.00 | -1.2 | 3.14159 |\n\n变量可以出现在赋值语句中：\n\n`variableName = NewValue;`\n\n赋值运算符\
  \ (`=`) 的左侧只能有一个变量，而使用任意数量变量的任何合法 C# 表达式都可以位于运算符的右侧。记住，在该语句中，`NewValue` 首先被求值，然后赋值给\
  \ `variableName`。我们主要关注的是 `NewValue` 与 `variableName` 是相同类型。也就是说，我们必须为变量分配类型正确的值。这与我们在处理属性值时需要做的一样。\n\
  \n### 声明变量\n\n![Image](img/00305.jpeg)\n\n一旦我们为变量命名并确定了我们想要的的类型，我们就必须将此信息传递给我们的\
  \ Visual C# 项目。我们需要声明变量。（我们不需要声明控件属性，因为 Visual C# 已经知道它们了。）用于声明类型为 `type` 的名为 `variableName`\
  \ 变量的语句是：\n\n`type variableName;`\n\n我们项目中的每个变量都需要这样的声明语句。这看起来可能是一项大量工作，但它是值得的。适当的变量声明会让编程变得更容易，减少程序错误的可能性，并使随后的程序修改更加容易。\n\
  \n那么，我们将这些变量声明放在哪里呢？启动一个新的 Visual C# 项目并打开代码窗口。代码窗口看起来如下：\n\n![Image](img/00306.jpeg)\n\
  \n我们将变量声明语句直接放在表单构造函数代码（`Public Form1`）下方以及任何事件方法之前。代码窗口中的此位置被称为全局声明区域，在这里声明的任何变量都可以在项目的任何事件方法中使用（可以访问和/更改值）。\n\
  \n尝试在代码窗口中输入一些变量声明。这里有一些可以尝试的示例：\n\n![Image](img/0307.jpeg)\n\n### 类型转换\n\n在每个赋值语句中，赋值运算符\
  \ (`=`) 两侧的数据类型必须相同。如果左侧是 `int`，C# 将尝试进行任何转换。如果不能，则会打印错误消息。在这种情况下，你需要显式地将结果转换为左侧相同的类型。例如，在语句中：\n\
  \n`a = (int)3.14159;`变量 `a` 将赋值为 3。从高精度数字转换为低精度数字时要小心。\n\n## 算术运算符\n\n![Image](img/0041.jpeg)\n\
  \n计算机程序非常擅长执行算术。它们可以快速地加、减、乘、除数字。我们需要知道如何让我们的 C# 项目进行算术。C# 语言中有五种算术运算符。\n\n加法使用加号\
  \ (`+`)，减法使用减号 (`-`) 。简单的示例有：\n\n| 操作 | 示例 | 结果 |\n| :--- | :--- | :--- |\n| 加法\
  \ | `7 + 2` | 9 |\n| 加法 | `3 + 8` | 11 |\n| 减法 | `6 - 4` | 2 |\n| 减法 | `11 - 7`\
  \ | 4 |\n\n![Image](img/0018.jpeg)\n\n乘法使用星号 (`*`)，除法使用斜杠 (`/`)。简单的示例有：\n\n| 操作\
  \ | 示例 | 结果 |\n| :--- | :--- | :--- |\n| 乘法 | `8 * 4` | 32 |\n| 乘法 | `2 * 12` |\
  \ 24 |\n| 除法 | `12 / 2` | 6 |\n| 除法 | `42 / 6` | 7 |\n\n![Image](img/0023.jpeg)\n\
  \n我确定你以前做过加、减、乘、除，并理解每个操作是如何工作的。然而，另一个算术运算符可能对你来说熟悉。\n\n我们使用的另一个算术运算符被称为取余运算符 (`%`)。这个运算符给出两个整数除法的余数。现在可能并不明显，但取余运算符在计算机编程中被广泛使用。示例：\n\
  \n| 示例 | 除法结果 | 余数结果 |\n| :--- | :--- | :--- |\n| `7 % 4` | 商 1 余 3 | 3 |\n| `14\
  \ % 3` | 商 4 余 2 | 2 |\n| `25 % 5` | 商 5 余 0 | 0 |\n\n\n\n\n学习这些示例可以让你理解 C# 中取余运算符是如何工作的。\n\
  \n如果赋值语句中包含多个算术运算符会发生什么？这会有影响吗？看这个示例：\n\n```\n7 + 3 * 4\n```\n\n答案是什么？嗯，这取决于情况。如果你从左到右计算，先加\
  \ `7` 和 `3`，再乘以 `4`，答案是 `40`。如果你先用 `3` 乘以 `4`，再加 `7`，答案是 `19`。感到困惑吗？是的。但是，C# 通过优先级规则消除了这种困惑的可能性。这意味着算术运算有一个特定的顺序执行。该顺序是：\n\
  \n1. 乘法 (`*`) 和除法 (`/`)\n2. 取余 (`%`)\n3. 加法 (`+`) 和 减法 (`-`)\n\n因此，在赋值语句中，所有的乘法和除法首先执行，然后是取余操作，最后是加法减法。在我们的示例\
  \ `(7 + 3 * 4)` 中，我们看到乘法会在加法之前执行，因此 C# 提供的答案将是 `19`。\n\n如果两个运算符具有相同的优先级（例如乘法和除法），则操作在赋值语句中从左到右执行。例如：\n\
  \n```\n24 / 2 * 3\n```\n\n首先执行除法 `(24 / 2)` 得到 `12`，然后执行乘法 `(12 * 3)`，所以答案是 `36`。但如果我们想在除法之前进行乘法呢——可以这样做吗？可以——使用\
  \ C# 的分组运算符——括号 `()`。通过在赋值语句中使用括号，你可以强制括号内的操作先执行。所以，如果我们把示例重写为：\n\n```\n24 / (2\
  \ * 3)\n```\n\n乘法 `(2 * 3)` 将先执行得到 `6`，然后执行除法 `(24 / 6)`，得到预期的结果 `4`。你可以使用任意数量的括号，但要确保它们成对出现——每个左括号都需要一个右括号。如果你嵌套括号（即一组括号在另一组括号内部），评估将从最内层的括号开始并向外进行。例如，看：\n\
  \n```\n((2 + 4) * 6) + 7\n```\n\n首先执行 `2` 和 `4` 相加得到 `6`，然后乘以 `6` 得到 `36`。然后将此结果加上\
  \ `7`，最终答案为 `43`。你可能也想在即使括号没有改变优先级的情况下使用它们。很多时候，它们只是为了澄清赋值语句中发生了什么。\n\n随着你编程技能的提高，请确保你了解每个算术运算符是如何工作的、优先级顺序是什么以及如何使用括号。始终双检查你的赋值语句，以确保它们提供了你想要的结果。\n\
  \n带有算术运算符的 C# 赋值语句示例：\n\n```\ntotalBananaCost = numberBananas * bananaCost;\nnumberOfWeeks\
  \ = numberOfDays / 7;\naverageScore = (score1 + score2 + score3) / 3.0;\n```\n\n\
  注意这里的几点。首先，注意 `averageScore` 计算中的括号强制 C# 在除以 `3` 之前相加三个分数。此外，注意“空白”的使用，即分隔运算符和变量的空格。这是\
  \ C# 中的常见做法，有助于代码更具可读性。在我们课程中构建项目时，我们将看到大量的赋值语句示例。\n\n### 字符串/数字转换方法\n\n![Image](img/00120.jpeg)\n\
  \n任何 Visual C# 项目中的一项常见任务都是获取用户输入的数字，对这些数字进行一些算术运算，并输出运算的结果。你如何做到这一点？根据你目前掌握的 Visual\
  \ C# 知识，你可能认为可以使用文本框控件允许用户输入数字。然后你可以使用算术运算符进行数学计算，并使用标签控件显示计算结果。但是，但这里有两个问题：\n\n\
  **问题一**：算术运算符只能处理数字（例如，整数变量和整数属性），但文本框控件提供的值（`Text` 属性）是字符串。你不能对字符串类型的变量和属性进行加减除！\n\
  \n**问题二**：算术运算的结果是一个数字。但标签控件的 `Text` 属性（我们显示这些结果的地方）是字符串类型。你不能在字符串变量中存储数值数据！\n\n\
  我们需要解决这两个问题的解决方案。解决方案在 C# 的内置方法中。我们需要将字符串转换为数字以及反之，将数字转换为字符串的方法。有了这种能力，我们就可以从文本框获取\
  \ `Text` 属性，将其转换为数字，进行数学计算，并将该数值结果转换为字符串，以便作为标签框中的 `Text` 属性使用。这是 C# 中非常常见的任务，C#\
  \ 拥有大量的方法帮助我们完成此类常见任务。我们稍后会查看这些，但首先让我们定义一下什么是方法。\n\nC# 方法是一个内置过程，在给定我们提供的一些信息的情况下，它计算出所需的值。使用方法的格式为：\n\
  \n```\nmethodValue = MethodName(ArgumentList);\n```\n\n`MethodName` 是方法的名称，`ArgumentList`\
  \ 是提供给函数的数值列表（用逗号分隔），以便它可以执行工作。在这个赋值语句中，`MethodName` 使用 `ArgumentList` 中的值来计算结果，并将该结果赋值给我们命名为\
  \ `methodValue` 的变量。我们必须确保变量 `methodValue` 与计算出的值的类型相同。\n\n\n\n\n![Image](img/0004.jpeg)\n\
  \n# 告白\n\n在上面的讨论中，你被告诉了一个小谎言。有人说你不能对字符串进行加法和乘法。好吧，你不能进行乘法，但你可以进行类似于加法的操作。在 Visual\
  \ C# 项目中，你经常想要从一个地方获取字符串变量，并将其“附加在另一个字符串的末尾”。这种操作的专业术语是字符串拼接。拼接运算符是加号（`+`），它非常易用。例如：\n\
  \n```csharp\nnewString = “Visual C# ” + “is Fun!\";\n```\n\n执行该语句后，字符串变量 `newString`\
  \ 将拥有值“Visual C# is Fun!”。\n\n注意，字符串拼接运算符与加法运算符是相同的。在使用两者两者时，我们总是需要确保不会混淆。正如你所看到的，字符串变量是\
  \ Visual C# 的重要部分。随着你作为程序员的成长，你需要熟悉字符串并熟练处理它们。你现在准备好开始一个新项目了。\n\n# 项目 - 储蓄账户\n\n\
  ![Image](img/00228.jpeg)\n\n## 项目设计\n\n在这个项目中，我们将构建一个储蓄账户计算器。我们将输入每周存入账户的金额，以及存入账户的周数。然后项目将计算出我们节省了多少钱。我们将使用文本框作为输入控件和输出信息的载体。使用一个按钮来执行计算。该项目保存为课程项目文件夹中的\
  \ `Savings`（`\\VCSKids\\VCSK Projects`）。\n\n## 在表单上放置控件\n\n在 Visual C# 中启动新项目。在表单上放置三个文本框控件、三个标签控件和两个按钮。你的表单应该像这样：\n\
  \n![Image](img/00324.jpeg)\n\n再次，尝试使用复制和粘贴处理相似的控件。\n\n## 设置控件属性\n\n使用属性窗口设置控件属性（记住，控件按默认名称列出）：\n\
