  \n## 写事件方法\n\n![Image](img/00008.jpeg)\n\n这个项目的工作原理类似于你用过的任何绘画程序。点击 `Color` 组框中的颜色（我们很快就会在那里看到颜色）来选择一种用于绘图的颜色。然后，移动到黑板，左键单击开始绘画过程。拖动鼠标画线。松开鼠标按钮停止绘图。就这么简单。点击\
  \ `Erase` 将清除黑板，点击 `Exit` 将停止程序。每一步，除了初始化一些内容和停止程序外，都是由面板的鼠标事件处理的。\n\n此项目使用了三个变量。我们需要一个布尔变量（`mousePress`）来告诉我们左鼠标键是否被按下。这让我们知道是否应该正在绘图。我们需要两个变量（`xLast`\
  \ 和 `yLast`）来保存线中最后绘制的端点（我们总是将“当前”点连接到“上一个”点）。我们还需要一个图形对象（`myGraphics`）和一个画笔对象（`myPen`）。打开代码窗口并在通用声明区域声明这些变量：\n\
  \n```c\nbool mousePress;\nint xLast;\nint yLast;\nGraphics myGraphics;\nPen myPen;\n\
  ```\n\n我们需要建立一些初始值。首先，我们创建用于绘图的图形对象（`myGraphics`）和画笔对象（`myPen`）。我们将画笔的初始绘制颜色设置为灰色。我们如何选择颜色呢？每个单选按钮都有\
  \ `BackColor` 属性。我们使用 C# 代码将每个 `BackColor` 属性设置为相应的颜色。用户随后会看到每个实际颜色，而不是描述颜色的单词。我们将使用的八种颜色是来自\
  \ `Color` 结构的值。选择这些颜色是为了让在黑色背景上看起来良好。如所示，初始颜色将是灰色，因此我们将 `rdoGray` 单选按钮的 `Checked`\
  \ 属性设置为 `true`。我们还将 `mousePress` 初始化为 `false`（我们还没有开始绘图）。这一切都在 `Form1_Load` 方法中完成的：\n\
  \n```csharp\nprivate void Form1_Load(object sender, EventArgs e)\n{\n    // 创建图形和画笔对象\n\
  \    myGraphics = pnlBlackboard.CreateGraphics();\n    myPen = new Pen(Color.Gray,\
  \ 1);\n\n    // 初始化八个单选按钮颜色\n    rdoGray.BackColor = Color.Gray;\n    rdoBlue.BackColor\
  \ = Color.Blue;\n    rdoGreen.BackColor = Color.LightGreen;\n    rdoCyan.BackColor\
  \ = Color.Cyan;\n    rdoRed.BackColor = Color.Red;\n    rdoMagenta.BackColor = Color.Magenta;\n\
  \    rdoYellow.BackColor = Color.Yellow;\n    rdoWhite.BackColor = Color.White;\n\
  \n    // 设置初始颜色\n    rdoGray.Checked = true;\n    mousePress = false;\n}\n```\n\n\
  \n\n\n\n## 运行项目\n\n运行项目。看看单选按钮 `BackColor` 属性是如何用于显示颜色的吗？如果颜色选择区域不够宽，请确保你将每个单选按钮的\
  \ `Text` 属性设置为一些空格。选择一种颜色。在面板控件（panel）中画一条线。尝试其他颜色。画点东西。这是我的艺术尝试（一张自画像）：\n\n![Image](img/00101.jpeg)\n\
  \n我让学生用这个程序画过弗雷德·弗林通（Fred Flintstone）和霍默·辛森（Homer Simpson）的完美图片。确保每种颜色都有效。确保 `Erase`\
  \ 有效。确保 `Exit` 有效。如既往，彻底测试你的项目。如果在运行过程中进行了任何更改，请将其保存。\n\n你看到这个程序的绘图部分是多么简单了吗？大部分代码仅仅用于设置和选择颜色。代码的实际绘制部分（`MouseDown`、`MouseMove`、`MouseUp`\
  \ 事件）只有几行 C# 代码！！这说明了两点：(1) 你使用的那些绘图程序构建起来并不困难；(2) Visual C# 图形方法蕴含着巨大的力量。\n\n![Image](img/00118.jpeg)\n\
  \n## 其他尝试\n\n![Image](img/00167.jpeg)\n\n“黑板乐趣”（Blackboard Fun）项目通过增加选项提供了许多改进机会。添加一个设置笔\
  \ `Width` 属性的选项。这样你就可以画非常细或非常粗的线条。使用数值 Numeric 调控件（numeric updown control）来设置该值。\n\
  \n添加更改黑板背景色的功能。确定并构建逻辑，允许根据按下左键还是右键绘制不同颜色的线条。为此，我建议创建一个左笔和一个右笔。你还需要一种方法让用户为每支笔选择颜色。然后，根据按了哪个按钮，在各种鼠标事件中应用相应的笔。\n\
  \n看看你是否能找到实现特效的方法。这里有一个可以尝试的可能性。删除 `pnlBlackboard_MouseMove` 事件中的这些行（或将其“注释掉”）：\n\
  \n```csharp\nxLast = e.X;\nyLast = e.Y;\n```\n\n通过这样做，第一次点击的点（在 `MouseDown` 事件中）始终是最后一点，所有的线条绘制都源于这个原始点。现在，再次运行项目。注意这种“扇形”效果。很漂亮吧？玩一玩，看看还有其他效果（随机改变颜色、随机改变笔宽）。玩得开心！\n\
  \n“黑板乐趣”项目有一个效果很令人烦恼。你可能已经发现了，也可能还没有。表单的右上角有一个带有“下划线”的小按钮，称为最小化按钮：\n\n![Image](img/00038.jpeg)\n\
  \n当你点击此按钮时，你的应用程序窗口会消失（最小化）并移动到屏幕底部的 Windows 任务栏。当你点击任务栏中的应用程序名称时，它会返回屏幕。去尝试吧。运行项目并画几条线。不要画太复杂的——你很快就会发现原因。最小化你的应用程序，然后点击\
  \ Windows 任务栏上的相应按钮恢复应用程序。你的线条去哪了？\n\n为什么当项目消失一会儿后线条也消失了？Visual C# 图形对象没有内存。它们只显示最后在上面绘制的内容。如果你将表单缩小为任务栏上的图标并恢复它（正如我们刚刚所做的），图形对象无法记住之前显示过的内容——它会被清除。同样，如果你从激活的\
  \ Visual C# 应用程序切换到其他应用程序，你的 Visual C# 表单可能会部分或完全被遮挡。当你回到 Visual C# 应用程序时，任何图形对象的被遮挡部分将被擦除。再次，没有内存。然而，请注意在这两种情况下，所有控件都会自动恢复到表单上。幸运的是，你的应用程序记得这些！控件是持久的。我们也希望图形也是持久的。\n\
  \n持久图形的主题超出了本课程的范围。然而，为了消除黑板项目中的这种干扰，我们将向你展示添加持久性所需的代码更改。只需要更改几行。如果你喜欢，可以进行这些更改。在每个情况下，修改和/或新的代码将以灰色背景显示。想法是创建一个带有内存的图形对象类型（维护在面板控件的\
  \ `BackgroundImage` 属性中）。执行此操作的新 `Form1_Load` 方法如下：\n\n```csharp\nprivate void Form1_Load(object\
  \ sender, EventArgs e)\n{\n    // 创建图形和笔对象\n    pnlBlackboard.BackgroundImage =\
  \ new Bitmap(pnlBlackboard.Width, pnlBlackboard.Height, System.Drawing.Imaging.PixelFormat.Format24bppRgb);\n\
  \    myGraphics = Graphics.FromImage(pnlBlackboard.BackgroundImage);\n    myPen\
  \ = new Pen(Color.Gray, 1);\n\n    // 初始化八个单选按钮颜色\n    rdoGray.BackColor = Color.Gray;\n\
  \    rdoBlue.BackColor = Color.Blue;\n    rdoGreen.BackColor = Color.LightGreen;\n\
  \    rdoCyan.BackColor = Color.Cyan;\n    rdoRed.BackColor = Color.Red;\n    rdoMagenta.BackColor\
  \ = Color.Magenta;\n    rdoYellow.BackColor = Color.Yellow;\n    rdoWhite.BackColor\
  \ = Color.White;\n\n    // 设置初始颜色\n    rdoGray.Checked = true;\n    mousePress =\
  \ false;\n}\n```\n\n我们还需要在 `pnlBlackboard_MouseMove` 事件、`pnlBlackboard_MouseDown`\
  \ 事件和 `btnErase_Click` 事件中添加单行（阴影）。这行代码在每个图形方法后都会刷新添加的内存。修改后的事件方法为：\n\n```csharp\n\
  private void pnlBlackboard_MouseMove(object sender, MouseEventArgs e)\n{\n    //\
  \ 如果正在绘图，则画线\n    if (mousePress)\n    {\n        myGraphics.DrawLine(myPen, xLast,\
  \ yLast, e.X, e.Y);\n        pnlBlackboard.Refresh();\n        xLast = e.X;\n  \
  \      yLast = e.Y;\n    }\n}\n\nprivate void pnlBlackboard_MouseUp(object sender,\
  \ MouseEventArgs e)\n{\n    // 完成线条\n    if (e.Button == MouseButtons.Left)\n  \
  \  {\n        myGraphics.DrawLine(myPen, xLast, yLast, e.X, e.Y);\n        pnlBlackboard.Refresh();\n\
  \        mousePress = false;\n    }\n}\n\nprivate void btnErase_Click(object sender,\
  \ EventArgs e)\n{\n    // 清除黑板\n    myGraphics.Clear(pnlBlackboard.BackColor);\n\
  \    pnlBlackboard.Refresh();\n}\n```\n\n再次运行项目。你现在应该不用担心你的艺术作品了！\n\n![Image](img/00275.jpeg)\n\
  \n## 总结\n\n你现在已经通过使用 `DrawLine` 方法有了在 C# 中进行图形编程的首次体验。你学习了面板控件的多功能性。你学习了有助于绘图的三个控件事件：`MouseDown`、`MouseMove`\
  \ 和 `MouseUp`。而且，你对颜色有了深入了解。在下节课中，我们将继续查看如何在项目中使用图形。并且我们将查看一些设计游戏的方法。\n\n# 图片框，数组\n\
  \n![Image](img/0170.jpeg)\n\n## 复习与预览\n\n在上一节课中，我们引入了面板控件以及在 Visual C# 项目中绘制彩色线条的方法。我们在本节课中继续查看图形。图片框控件将被研究。\n\
  \n特别是，我们使用该控件显示图形文件——照片、绘画、图片。在 C# 课程中，我们学习了声明变量的新方法以及计数和循环的方法。作为一个项目，我们构建了一个“大战”扑牌游戏版本。\n\
  \n![Image](img/0328.jpeg)\n\n## 图片框控件\n\n在许多项目中，你想要显示保存为计算机上图形文件的图片或绘画。你可能有一个小孩子的程序，如果你输入\
  \ A，就会出现苹果；B，就会出现球，以此类推。你可能想在地理课上显示一张美国（或其他国家）的地图。你可能想看看你用数码相机拍摄的一些照片。图片框是该用途的控件。图片框从工具箱中选择。它显示如下：\n\
  \n在工具箱中：\n\n![Image](img/0357.jpeg)\n\n在表单上（默认属性）：\n\n![Image](img/00015.jpeg)\n\
  \n### 属性\n\n图片框控件属性有：\n\n| 属性 | 描述 |\n| :--- | :--- |\n| Name | 用于标识图片框控件的名称。图片框名称的三字母前缀为\
  \ `pic`。 |\n| Image | 建立图片框中显示的图形文件。 |\n\n\n\n\n\n| SizeMode | 表示图像显示的方式。 |\n| :---\
  \ | :--- |\n| BorderStyle | 决定图片框框的类型。 |\n| Left | 表单左侧到图片框左侧的距离（在属性窗口中为 X，展开 `Position`\
  \ 属性）。 |\n| Top | 表单顶部到图片框顶部的距离（在属性窗口中为 Y，展开 `Position` 属性）。 |\n| Width | 图片框以像素（pixels）为单位的宽度（展开\
  \ `Size` 属性）。 |\n| Height | 图片框以像素（pixels）为单位的高度（展开 `Size` 属性）。 |\n| Enabled | 决定图片框在运行模式下是否能响应用户事件。\
  \ |\n| Visible | 决定图片框在运行模式下是否显示在表上。 |\n\n`Image` 属性用于选择显示在图片框中的图形文件，而 `SizeMode`\
  \ 属性则影响文件的显示方式。让我们来看这两个属性。\n\n![Image](img/00267.jpeg)\n\n### 属性\n\n图片框的 `Image`\
  \ 属性指定了要显示的图形文件。要在设计时设置 `Image` 属性，只需显示图片框控件的属性窗口并选择 `Image` 属性。会出现一个省略号（……）。点击省略号将出现一个\
  \ `Select Resource`（选择资源）窗口。选择 `Import`（导入），会出现 `Open File`（打开文件）对话框。使用该框找到要显示的图形文件。图片框可以显示存储在多种图形格式中的图片。我们学习的格式有：\n\
  \n| Bitmap | 位图是由像素（屏幕点）表示的图像，并存储为位集合，其中每个位对应一个像素。它通常具有 `bmp` 扩展名。你也可以显示图标文件（`ico`\
  \ 扩展名），因为它们本质上是位图文件。 |\n| GIF | `GIF`（图形交换格式，读音为“jif”，像花生酱一样）是一种最初由互联网提供商 CompuServe\
  \ 开发的压缩位图格式。你在互联网上看到的大图形都是 GIF 文件。GIF 文件具有 `gif` 扩展名。 |\n| JPEG | `JPEG`（联合图像专家小组，读音为“jay-peg”）是一种在互联网上流行的压缩位图格式，也是通常用于存储数字照片的格式。JPEG\
  \ 文件具有 `jpg` 扩展名。 |\n\n这些是标准的图形文件类型，还有其他可以显示的类型。有许多程序（如 JASC 的 Paint Shop Pro，位于明尼苏州爱登普雷利市）可以将文件从一种类型转换为另一种类型，你可能会发现它们很有用。\n\
  \n在网上寻找示例位图和 GIF 文件的好地方。要将显示的网页图形保存为文件，右键点击该图形并选择 `Save Picture As`（另存图片）选项（确保它具有\
  \ `bmp` 或 `gif` 扩展名）。如果你有数码相机，你可能有数百个 JPEG 文件。\n\n在 `\\VCSKids\\VCSK Projects\\\
  Graphics` 文件夹中，我们包含了每种类型的一个文件供示例使用：\n\n| ball.bmp | 球的位图图片 |\n| :--- | :--- |\n\
  | kidware.gif | 我们公司（KIDware）在网站上使用的 Logo GIF 文件 |\n| mexico.jpg | 墨西哥度假拍摄的数字照片\
  \ |\n\n## 示例\n\n启动 Visual C# 并创建一个新项目。在表单上放置一个图片框控件。让它足够大。点击 `Image` 属性和出现的省略号（...）按钮。会出现一个\
  \ `Select Resource` 窗口。确保选中了“Project resource file”单选按钮并点击标记为 `Import` 的按钮，将出现文件打开窗口。移动（如图所示）到\
  \ `\\VCSKids\\VCSK Projects\\Graphics` 文件夹，你将看到列出的示例文件：\n\n![Image](img/00201.jpeg)\n\
  \n注意显示了六种文件类型，包括位图、gif 和 jpeg。其他文件类型包括元文件（`wmf` 扩展名）和可移植网络图形（`png` 扩展名）——你可能想自己去学习这些其他文件类型。一种未运行的类型是图标文件（`ico`\
  \ 扩展名）。要查看这些文件（它们显示正常），你需要点击 `Files of type`（文件类型）并选择 `All Files`（所有文件）。\n\n选择 `ball.bmp`\
  \ 文件并点击 `Open`（打开）。你将返回 `Select Resource` 窗口，它看起来应该是这样的：\n\n![Image](img/00252.jpeg)\n\
  \n点击 `OK` 按钮。\n\n在你的表上，你应该能看到类似这样的内容（取决于你的图片框的大小）：\n\n![Image](img/00299.jpeg)\n\
  \n图像位于图片框的左上角。它以完整尺寸显示。\n\n返回属性窗口并为图片框的 `Image` 属性选择 `kidware.gif` 文件（按照相同的步骤使用\
  \ `Select Resource` 窗口）：\n\n![Image](img/00342.jpeg)\n\n在这个示例中，图片框比图形短，所以图片在垂直方向上被“裁剪”了。它位于左上角并以完整尺寸显示。如果你的示例中图片也被裁剪了，你可以调整图片框控件的大小来查看整个图形。\n\
  \n最后，加载并查看 `mexico.jpg` 文件：\n\n![Image](img/00006.jpeg)\n\n这里没多少特别好看的。图片框比照片小，所以只能看到天空。图像以完整尺寸显示并被严重裁剪了。\n\
  \n我们看到位图文件似乎显示得良好。但 GIF 和 JPEG 文件存在裁剪问题。图片框控件的 `SizeMode` 属性让我们能够对我们想要的显示方式进行一些控制。\n\
  \n有些时候你想要删除图片框中的图形。要删除它，点击属性窗口中的 `Image`。右侧窗口将显示当前文件（带有缩略图）。选中此信息（双击高亮），按下键盘 `Del`。显示的图片将消失，属性将显示为\
  \ `None`。\n\n![Image](img/0027.jpeg)\n\n## SizeMode 属性\n\n`SizeMode` 属性决定特定图像在图片框中的显示方式。该属性有五个可能的值：`Normal`、`CenterImage`、`StretchImage`、`AutoSize`、Zoom`。每个值的作用如下：\n\
  \n| SizeMode | 效果 |\n| :--- | :--- |\n| Normal | 以原始尺寸显示。如果图片框比图像大，会有空白。如果图片框比图像小，图像将被裁剪。\
  \ |\n| CenterImage | 以原始尺寸居中显示。如果图片框比图像大，会有空白。如果图片框比图像小，图像将被裁剪。 |\n| StretchImage\
  \ | 图像将“填充”图片框。如果图像比图片框小，它会放大。如果图像比图片框大，它会缩小。位图缩放效果不好。JPEG 和 GIF 文件缩放良好。 |\n| AutoSize\
  \ | StretchImage 的相反——图片框将更改其尺寸以匹配图像的原始尺寸。预警——有些文件很大！ |\n| Zoom | 与 StretchImage\
  \ 类似。图像将适应图片框，但保持了其实际的宽高比。 |\n\n在上一个示例中，`SizeMode` 属性具有默认值 `Normal`，因此所有图像都以原始尺寸显示。对于位图文件，有很多空白。对于\
  \ GIF 和 JPEG 文件，则存在裁剪。在我看来，`SizeMode` 属性选择中最用用 `StretchImage`。使用此属性，图像始终填充你提供的空间。\n\
  \n![Image](img/00078.jpeg)\n\n## 示例\n\n继续之前的项目。将图片框控件的 `SizeMode` 属性更改为 `CenterImage`。加载三个示例图形文件。注意当你点击图片框属性窗口中\
  \ `Image` 旁边的省略号时，出现的 `Select Resources` 窗口所示：\n\n![Image](img/00235.jpeg)\n\n\n\
  \n\n\n由于每个图形已经显示在“选择资源”窗口中（这些图形已成为项目的一部分），因此无需重新加载实际的图形文件。你可以直接从该窗口中选择 `Image` 属性。过程是——选择所需的图形（资源）并点击确定。\n\
  \n使用 `CenterImage` `SizeMode` 属性时，请注意文件显示方式的区别。特别是 `GIF` 和 `JPEG` 文件仍然会被裁剪，但现在它们在控件中是居中的。例如，这里是图片居中的\
  \ kidware 品牌 logo 图形：\n\n![Image](img/00245.jpeg)\n\n将 `SizeMode` 更改为 `StretchImage`。重新加载每个示例图形文件。注意图形是如何占据整个图片框（picture\
  \ box）。这里是墨西哥图形：\n\n![Image](img/00281.jpeg)\n\n尝试调整图片框控件。不同类型的图形是如何缩放的？调整图片框控件后，图片还能辨认吗？你会发现位图（在大多数情况下）的缩放效果很差，而\
  \ `GIF` 和 `JPEG` 图形的缩放效果非常理想。将 `SizeMode` 更改为 `Zoom`。注意图形的显示与使用 `StretchImage` 时看到的非常相似。墨西哥图形看起来更清晰，因为高宽比是正确的：\n\
  \n![Image](img/00283.jpeg)\n\n最后，将 `SizeMode` 更改为 `AutoSize`。加载每个图形示例并查看结果。注意！墨西哥的照片很大。只有当你知道图像的大小并在项目表单上留出相应空间时，才应该使用\
  \ `AutoSize`。如果你愿意，尝试在电脑上寻找其他图形文件，并在不同的 `SizeMode` 属性在图片框中查看它们。\n\n## 事件\n\n图片框控件支持几个事件。重要的事件有：\n\
  \n| 事件 | 说明 |\n| :--- | :--- |\n| `Click` | 用户点击图片框时执行的事件。 |\n| `MouseDown` | 用户在光标位于图片框上时按下鼠标键执行的事件。\
  \ |\n| `MouseMove` | 用户在图片框上移动光标时执行的的事件。 |\n| `MouseUp` | 用户在光标位于图片框上时释放鼠标键执行的事件。\
  \ |\n\n当你在多选环境中从一组图片框控件中进行选择时，你会使用 `Click` 事件。当你需要知道按下了或释放了哪个鼠标键，以及/或在鼠标点击、移动或释放发生时光标所在的位置时，你会使用鼠标事件。\n\
  \n## 图片框控件的典型用途\n\n![Image](img/00284.jpeg)\n\n使用图片框控件显示图形文件的通常设计步骤为：\n\n> ➢ 设置\
  \ `Name` 和 `SizeMode` 属性（最常用的是 `StretchImage`）。\n> ➢ 在设计模式或运行时设置 `Image` 属性。\n\n\
  ## C# - 第六课\n\n在这一节 C# 课程中，我们将查看存储大量变量的方法、一种计数技术，以及用于洗一副牌牌（或随机排序数字列表）的代码。\n\n###\
  \ 变量数组\n\n你的学校校长认可了你出色的 C# 编程技能，并来寻求你的帮助。学校里的所有人（352 名学生）刚刚参加了一项 C# 技能测试。校长希望你写一个程序来存储每个学生的姓名和分数。程序应该对分数进行排名（排序）并计算平均分。实现此点的代码并不难。我们在这里讨论的问题是，如何声明我们所需的所有变量？编写这个测试分数程序，你需要\
  \ 352 个 `string` 变量来存储学生姓名和 352 个 `int` 变量来存储学生分数。我们被要求声明使用的每一个变量。你想输入 704 行类似这样的代码吗？\n\
  \n```\nstring student1;\nstring student2;\nstring student3;\n.\n.\nstring student352;\n\
  \nint score1;\nint score2;\nint score3;\n.\n.\nint score352;\n```\n\n我不认为是这样。\n\n\
  C# 提供了一种在相同名称下存储大量变量的方法——变量数组。数组中的每个变量（称为元素）必须具有相同的数据类型，并通过数组索引相互区分。变量数组的声明方式与其他变量类似。要指示该变量是数组，你在类型后使用两个方括号\
  \ `[]`。方括号在数组中非常频繁。在声明数组的同时，使用 `new` 关键字来创建它是一个良好的习惯。对于 352 个学生姓名和 352 个学生分数，我们使用以下代码声明并创建所需的数组：\n\
  \n```\nstring[] student = new string[352];\nint[] score = new int[352];\n```\n\n\
  括号中的数字被称为数组维度。这两行代码的效果与我们可能需要编写的 704 行声明相同！而且，注意看如果我们需要再添加 200 个变量，将是多么简单。如果你愿意，也可以在两个独立的语句中声明并创建数组。对于学生姓名数组，代码将是：\n\
  \n```\nstring[] student; // 声明；\nstudent = new string[352]; // 创建\n```\n\n我们现在有\
  \ 352 个学生变量（`string` 类型）和 352 个分数变量（`int` 类型）供我们使用。一个需要注意非常重要的概念是，C# 使用所谓的“基于零的数组”。这意味着数组索引从\
  \ 0 开始，到维度值减 1 结束（在本例中为 351）。数组中的每个变量通过其声明名称和索引引用。数组中的第一个学生将是 `student[0]`，最后一个是\
  \ `student[351]`，而不是 `student[352]`。\n\n## C# for 循环\n\n![Image](img/0095.jpeg)\n\
  \n![Image](img/0350.jpeg)\n\n计算机编程的一种常见任务是计数。我们可能希望特定次数地执行某些 C# 代码段——我们需要统计执行了多少次。在上面的学校分数示例中，我们需要遍历所有的\
  \ 352 个分数来计算平均分。C# 提供了一种方便的计数方法：for 循环。\n\nC# for 循环具有这种独特的结构：\n\n```\nfor (initialization;\
  \ expression; update)\n{\n    // 要执行的 C# 代码块\n}\n```\n\n`for` 后面是三个分号隔的部分：初始化、表达式和更新。第一个\
  \ `initialization` 是执行一次的步骤，用于初始化计数器变量（通常是 `int` 类型）。常见的初始化是将计数器 `i` 置零：\n\n```csharp\n\
  i = 0\n```\n\n第二个部分 `expression` 是在循环代码每次迭代（重复）之前执行的步骤。如果表达式为真，则执行代码；如果为假，程序执行将从\
  \ for 循环结束后的行继续。常见的表达式是：\n\n```csharp\ni < iMax\n```\n\n最后一部分 `update` 是在循环代码每次迭代后执行的步骤；它用于更新计数器变量的值。常见的更新是：\n\
  \n```csharp\ni = i + 1\n```\n\n使用这些示例步骤，for 循环如下所示：\n\n```csharp\nfor (i = 0; i\
  \ < iMax; i = i + 1)\n{\n    // 代码\n}\n```\n\n\n\n\n在这个示例中，计数器 `i` 初始化为 0，然后在程序每次执行循环时，它都会加\
  \ 1（改变）。对于循环的每次执行，两个大括号之间的任何代码都会重复执行。只要 `i` 仍然小于 `iMax`，循环就会继续。当循环完成后，程序执行将在右大括号之后继续。如果要在完成前退出循环，可以使用在\
  \ `switch` 结构中引入的 `break` 语句。\n\n几个示例应该能解释这些问题。假设我们想将数组 `myArray[10]` 的 10 个元素的值设为\
  \ 0。完成此任务的 `for` 循环如下：\n\n```\nfor (i = 0; i < 10; i = i + 1)\n{\n    myArray[i]\
  \ = 0;\n}\n```\n\n在这个循环中，计数器变量 `i`（在此语句之前已声明为 `int` 类型变量）初始化为 0。每次迭代，`i` 都会加 1。只要\
  \ `i` 仍然小于 10，循环就会重复（记住 `myArray[9]` 是数组的最后一个元素）。\n\n火箭发射倒计时怎么样？这个循环可以胜任：\n\n```\n\
  for (i = 10; i <= 0; i = i - 1)\n{\n    [倒计时的 C# 代码块]\n}\n```\n\n在这里，`i` 从 10 开始，每次循环重复时减\
  \ 1（`i = i - 1`）。是的，你可以减少计数器。而且，你可以设置非 1 的计数器递增。这个循环每隔 5 从 0 计数到 200：\n\n```\nfor\
  \ (i = 0; i <= 200; i = i + 5)\n{\n    [执行的 C# 代码块]\n}\n```\n\n在这些每个示例中，都假设 `i`\
  \ 在这些循环之前已经声明。\n\n计算学生示例中的平均分如何？这段代码可以胜任：\n\n```\nscoreSum = 0;\nfor (studentNumber\
  \ = 0; studentNumber < 352; studentNumber = studentNumber + 1)\n{\n    scoreSum\
  \ = scoreSum + score[StudentNumber];\n}\naverage = scoreSum / 300;\n```\n\n（再次，假设所有变量都已声明为适当类型）。要找到一组数字的平均值，将所有数字相加，然后除以数字的个数。在代码中，`scoreSum`\
  \ 代表所有数字之和。我们将其设置为 0 开始。然后，每次循环时，我们将下一个分数加到该“运行”总和中。循环利用 `score` 数组累加了所有 352 个分数。第一次执行时，它加上\
  \ `score[0]`，然后是 `score[1]`，然后是 `score[2]`，以此此类推，直到通过加上 `score[351]` 结束。完成后，通过将\
  \ `scoreSum` 除以 352 来计算平均值。你是否看到 `for` 循环如何极大地简化了相加 352 个数字的任务？这是我们在处理数组时可以使用的快捷方法之一。学习这些每个示例，以便你对\
  \ `for` 循环的工作原理有一个直观的概念。当你需要计数时就使用它们。\n\n在离开 `for` 循环之前，让我们来看最后一点。计数器变量的一种非常常见的更新是加\
  \ 1（递增）或减 1（递减）。C# 有特殊的递增和递减运算符可以正好执行这些操作。要给名为 `counterVariable` 的变量加 1，你只需写：\n\n\
  ```\ncounterVariable++;\n```\n\n这条语句等同于：\n\n```\ncounterVariable = counterVariable\
  \ + 1;\n```\n\n同样，递减运算符：\n\n```\ncounterVariable--;\n```\n\n等同于：\n\n```\ncounterVariable\
  \ = counterVariable – 1;\n```\n\n递增和递减运算符不仅限于 `for` 循环。它们可以用在 C# 程序中需要的任何地方。\n\n\
  ## 块级变量\n\n让我们解决另一个问题。注意，`for` 循环至少需要声明一个变量，即循环计数器，通常是一个 `int` 类型变量。该变量仅在与此循环相关的代码块中使用——它的值通常在其他地方没有用处。当我们在代码窗口的通用声明区域声明变量时（正如我们一直所做的那样），它的值对所有事件方法都是可见的。我们称这种变量具有类级作用域。`for`\
  \ 循环计数器不需要这种声明，如果你有大量的 `for` 循环，这将变成一个头疼的问题。循环计数器可以在 `for` 语句的初始化部分声明。我们赋予这些变量块级作用域——它们的值只在那个循环的代码块内已知。\n\
  \n作为声明块级变量的示例，看对学生平均分示例的修改：\n\n```\nscoreSum = 0;\nfor (int studentNumber = 0; studentNumber\
  \ < 352; studentNumber++)\n{\n    scoreSum = scoreSum + score[StudentNumber];\n\
  }\naverage = scoreSum / 300;\n```\n\n注意计数器（`studentNumber`）如何在 `for` 语句中一步到位完成声明和初始化。这在\
  \ C# 中是完全允许的——每当你声明变量时，也可以给它分配初始值。一旦 `for` 循环完成，`studentNumber` 的值就不再已知或可用。当你编写\
  \ C# 代码时，你经常会修改这种示例来包含递增运算符 `++`。\n\n## 方法级变量\n\n除了块级和类级变量，我们还有一种变量作用域可以使用——方法级变量。如果一个变量仅在特定方法中使用，则不需要在通用声明区域声明它。方法级作用域的变量紧跟在方法的左大括号之后声明。\n\
  \n作为声明方法级变量的示例，假设我们在表单上有一个按钮控件 (`btnAverage`) 来计算学生平均分。`btnAverage_Click` 方法如下：\n\
  \n```csharp\nprivate void btnAverage_Click(object sender, EventArgs e)\n{\n    int\
  \ scoreSum;\n    scoreSum = 0;\n    for (int studentNumber = 0; studentNumber <\
  \ 352; studentNumber++)\n    {\n        scoreSum = scoreSum + score[StudentNumber];\n\
  \    }\n    average = scoreSum / 300;\n}\n```\n\n在这个示例中，`scoreSum` 仅在此方法中使用，因此是方法级变量。变量\
  \ `average` 应该声明在通用区域以便具有类级作用域。当你编写 C# 代码时，决定你的变量是块级、方法级还是类级作用域，并在代码窗口的相应区域声明它们。\n\
  \n## 洗牌程序\n\n![Image](img/00011.jpeg)\n\n让我们利用对数组和循环循环的新知识编写一个非常有用的方法。任何计算机程序中的常见任务是随机排序一组连续的整数值。你为什么要这样做？假设你有一个四选择测验。随机排序\
  \ 1、2、3 和 4，以便答案以随机顺序呈现。或者，你有一个有 30 个问题的测验。随机排序问题以打印为工作单。或者，经典的应用程序是洗一副扑牌（这样的副牌有\
  \ 52 张）。在这种情况下，你可以随机排序 0 到 51 的整数来“模拟”洗牌过程。让我们构建一个“洗牌”程序。通常当我们需要一个不需要计算机就能完成的计算机版本时，很容易写下采取的步骤并在\
  \ C# 代码中复制它们。我们在到目前为止的项目中已经这样做过了。\n\n\n\n我们将执行一种被称为“单牌洗牌”的操作。在单牌洗牌中，你从牌组中（随机）抽出单张牌并将其放在旁边的一堆中。重复\
  \ 52 次，牌就洗乱了。试一试！我想你已经看出这个想法很简单，但用一副真正的扑牌进行单牌洗牌会非常耗时。在这里，我们将使用单牌洗牌的想法，但会稍作变通。我们不是将选中的牌放在一堆中，而是将其与剩余待洗牌牌堆中底部的牌进行交换。这会将选中的牌从牌组中取出，并用剩余的底部的牌替换它。结果与将其放在一边是一样的。\n\
  \n### 洗牌的工作原理\n\n以下是洗牌算法针对 `n` 个数字的运行原理：\n\n*   从一个包含 `n` 个连续整数的列表开始。\n*   从列表中随机选取一个项。将该项与最后一个项交换。现在你待排序的列表项少了一个（称为剩余列表），或者说\
  \ `n` 现在变成了 `n - 1`。\n*   从剩余列表中随机选取一个项。将其与剩余列表底部的项交换。再次，你的剩余列表项又少了一个。\n*   重复从剩余列表中移除一个项，并将其与剩余列表底部的项交换，直到项耗尽。完成后，该列表将以随机顺序替换为原始列表。\n\
  \n困惑吗？让我们用一个 `n = 5`（一个非常小的牌组）的简单示例来展示。\n\n起始列表如下（有 5 个剩余项）：\n\n![Image](img/00039.jpeg)\n\
  \n我们想从这个列表中随机选取一个项。使用 C# 随机数生成器，我们将在从 1 到 5 之间选择一个随机数。假设数字是 3。我们取出列表中的第三项（`3`），并将其与列表中的最后一项（`5`）交换。我们现在得到：\n\
  \n![Image](img/00292.jpeg)\n\n剩余列表中有 4 个项。从 1 到 4 之间任选一个随机数——假设是 4。剩余列表中的第四项是 4。将其与剩余列表中的最后一项交换。等一下！剩余列表中的最后一项本身就是\
  \ 4。在这种情况下，我们将其与自身交换，或者说保持不变。如果随机数不是 4，那么这里真的会发生交换。我们现在得到：\n\n![Image](img/00102.jpeg)\n\
  \n剩余列表中有 3 个项。从 1 到 3 之间任选一个随机数——假设是 1。列表中的第一项是 1。将 `1` 与剩余列表中的最后一项（`5`）交换，我们得到：\n\
  \n![Image](img/00119.jpeg)\n\n剩余列表中有 2 个项。从 1 到 2 之间任选一个随机数——假设是 1。列表中的第一项是 5。将\
  \ `5` 与剩余列表中的最后一项（`2`）交换，我们得到了最终结果，即随机排序的 1 到 5 的数字：\n\n![Image](img/00343.jpeg)\n\
  \n这种运行方式很精妙，对吧？\n\n### 在 C# 中实现交换\n\n我们想用 C# 代码来描述单牌洗牌。大部分代码都是直观的。唯一的问题是如何实现每一步中涉及的交换。这种交换在纸面上很容易。我们在\
  \ C# 中如何实现交换？实际上，这是一个常见的 C# 任务，而且相对简单。起初，为了交换变量 `aVariable` 和变量 `bVariable`，你可能会写：\n\
  \n```\naVariable = bVariable;\nbVariable = aVariable;\n```\n\n这段代码的问题是，当第一条语句用 `bVariable`\
  \ 替换 `aVariable` 时，你已经破坏了 `aVariable` 的原始值。第二条语句只是将新赋值的 `aVariable` 值（即 `bVariable`）放回\
  \ `bVariable`。现在 `aVariable` 和 `bVariable` 都拥有原始的 `bVariable` 值！实际上，交换两个变量是一个三步骤的过程。首先，将\
  \ `aVariable` 放入一个临时存储变量（使其类型与 `aVariable` 和 `bVariable` 相同）。然后，用 `bVariable` 替换\
  \ `aVariable`。接着，用临时变量（持有原始 `aVariable` 值）替换 `bVariable`。如果 `tVariable` 是临时变量，则使用以下代码完成\
  \ `aVariable` 和 `bVariable` 的交换：\n\n```\ntVariable = aVariable;\naVariable = bVariable;\n\
  bVariable = tVariable;\n```\n\n你在各种 C# 中都会这样使用交换。\n\n### 随机排序代码\n\n现在，我们将看到使用单牌洗牌来随机排序\
  \ N 个连续整数值的 C# 代码。完成后，随机的整数列表将位于数组 `numberList` 中，该数组应该在项目的通用声明区域声明，并具有适当的维度。还要声明变量\
  \ `numberOfItems`，它是列表的长度。对于一副扑牌，这些声明如下：\n\n```csharp\nint[] numberList = new int[52];\n\
  int numberOfItems;\n```\n\n你需要确保在某处给 `numberOfItems` 赋值（52），最可能是 `Load` 过程的形式。我们需要一个具有方法级作用域的随机数对象（`myRandom`）来完成所有的随机数生成。还有四个变量具有块级作用域：\n\
  \n*   `loopCounter` - 循环计数器\n*   `remaining` - 剩余项的数量\n*   `itemPicked` - 剩余列表中选取的项\n\
  *   `tempValue` - 用于交换的临时变量\n\n```csharp\n// 变量声明\nRandom myRandom = new Random();\n\
  \n// 单牌洗牌\nfor (int loopCounter = 0; loopCounter < numberOfItems; loopCounter++)\n\
  {\n    numberList[loopCounter] = loopCounter;\n}\n\n// 处理剩余项\nfor (int remaining\
  \ = numberOfItems; remaining >= 1; remaining--)\n{\n    // 随机选取项\n    int itemPicked\
  \ = myRandom.Next(remaining);\n    // 与底部项交换\n    int tempValue = numberList[itemPicked];\n\
  \    numberList[itemPicked] = numberList[remaining - 1];\n    numberList[remaining\
  \ - 1] = tempValue;\n}\n```\n\n学习这段代码，看看它是如何实现我们在课程中讨论的内容：数组、for 循环以及块和方法变量。\n\n\
  ### 项目：纸大战 (Card Wars)\n\n在这个项目中，我们创建了一个简单的牌类游戏——战争（War）。你和电脑玩。你们各拿半副牌（26 张）。玩家各翻开一张牌。牌大的人赢得对方的牌。最后牌数最多的人获胜。显然，洗牌程序在这里将派上用场。我们将这个项目命名为\
  \ Card Wars！该项目保存在项目文件夹 (\\VCSKids Projects)。\n\n## 项目设计\n\n我们将使用面板控件来表示每张牌的轮廓。标签控件将显示牌的值，图片框控件将显示牌的花色。一个按钮将控制开始新游戏或抽取新牌，取决于游戏状态。另一个按钮将在游戏进行时控制停止游戏，在未进行游戏时停止程序。当前分数（每个玩家拥有的牌数）将显示在带标签的文本框中。\n\
