  \n# Visual Basic^® 项目\n\nVisual Basic^® Homework Projects 是一本为期一学期的自学编程教程，用简单、易于理解的语言解释如何构建\
  \ Visual Basic Windows 项目。学生将学习项目设计、Visual Basic 工具箱、Visual Basic 语言的许多元素，以及如何调试和发布完成的项目。构建的项目包括双模式计时器、闪卡数学测验、多选择考试、黑杰卡牌游戏、重量监控器、家庭库存管理器和雪球投掷游戏。\n\
  \n![Image](http://www.computerscienceforkids.com/visual-basic)\n\n# VISUAL BASIC\
  \ 与数据库\n\nVISUAL BASIC AND DATABASES 是一本详细介绍如何使用 Visual Basic 为桌面应用程序访问和维护数据库的教程。涵盖主题包括：数据库结构、数据库设计、Visual\
  \ Basic 项目构建、`ADO .NET` 数据对象（`connection`、`data adapter`、`command`、`data table`）、数据绑定控件、合理的界面设计、结构化查询语言\
  \ (`SQL`）、使用 `Access`、`SQL Server` 和 `ADOX` 创建数据库以及数据库报告。开发的实际项目包括书籍跟踪系统、销售发票程序、家庭库存系统和每日天气监控器。\n\
