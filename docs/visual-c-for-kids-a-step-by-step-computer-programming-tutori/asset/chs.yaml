  \n### btnNew_Click 事件方法设置了隐藏图片：\n\n```csharp\nprivate void btnNew_Click(object sender,\
  \ EventArgs e)\n{\n    for (int i = 0; i < 16; i++)\n    {\n        // 替换为卡片背面\n\
  \        displayed[i].Image = picBack.Image;\n        displayed[i].Visible = true;\n\
  \        behind[i] = i;\n    }\n    // 使用第 9 类中的洗牌程序随机排序 16 个整数 (0 到 15)\n    //\
  \ behind 数组包含隐藏图片的索引 (0-7)\n    // 处理剩余值\n    // 从 16 开始并交换一个值\n    // 在每个 for 循环步进中\n\
  \    // 在每一步之后，剩余值减 1\n    for (int remaining = 16; remaining >= 1; remaining--)\n\
  \    {\n        // 随机选取项目\n        int itemPicked = myRandom.Next(remaining);\n\
  \        // 交换选中的项目与底部项目\n        int tempValue = behind[itemPicked];\n        behind[itemPicked]\
  \ = behind[remaining - 1];\n        behind[remaining - 1] = tempValue;\n    }\n\
  \    for (int i = 0; i < 16; i++)\n    {\n        if (behind[i] > 7)\n        {\n\
  \            behind[i] = behind[i] - 8;\n        }\n    }\n    choice = 0;\n}\n\
