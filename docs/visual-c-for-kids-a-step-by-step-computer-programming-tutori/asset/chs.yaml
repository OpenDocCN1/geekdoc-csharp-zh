  \n![Image](http://www.computerscienceforkids.com/microsoft-small-basic)\n\n## 少年版\
  \ Small Basic\n《Small Basic For Kids》是一本计算机编程的图解介绍，为新的 `Small Basic` 编程环境提供了交互式、自进式的教程。该书由\
  \ 30 节短课程组成，解释了如何创建和运行 `Small Basic` 程序。小学生将学习程序设计和 `Small Basic` 语言的许多元素。书中使用了大量的示例来演示构建过程中的每一步。教程还包含了两个完整的游戏（`Hangman`\
  \ 和 `Pizza Zapper`）供学生构建和尝试。为 8 岁以上儿童设计。\n\n![Image](http://www.computerscienceforkids.com/microsoft-small-basic)\n\
  \n## 使用 Microsoft Small Basic 编写游戏\n《Programming Games with Microsoft Small Basic》是一本自学的第二学期“中级”编程教程，由\
  \ 10 章组成，用简单、易懂的术语解释了如何在 Microsoft Small Basic 中编写视频游戏。构建的游戏是非暴力的、家庭友好的，并教授逻辑思维能力。学生将学习如何编写以下\
  \ `Small Basic` 视频游戏：`Safecracker`、`Tic Tac Toe`、`Match Game`、`Pizza Delivery`、`Moon\
  \ Landing` 和 `Leap Frog`。这个中级自学式教程可以在家里或学校使用。\n\n![Image](http://www.computerscienceforkids.com/microsoft-small-basic)\n\
  \n## Microsoft Small Basic 开发者参考指南\n在开发所有不同的 Microsoft Small Basic 教程时，我们认为有编写《The\
  \ Developer's Reference Guide to Microsoft Small Basic》。该指南超过 500 页，包含了 100 多个 `Small\
  \ Basic` 编程示例供你学习并包含到你自己的 Microsoft Small Basic 程序中。它是新开发者的详细参考指南。\n\n![Image](http://www.computerscienceforkids.com/microsoft-small-basic)\n\
  \n## 基础计算机游戏 - Small Basic 版\n《Basic Computer Games - Small Basic Edition》是对 David\
  \ H. Ahl 最初编选的经典书籍《BASIC COMPUTER GAMES》的重制。它包含了 100 个原始基于文本的 `BASIC` 游戏，启发了一整代程序员。现在，这些经典的\
  \ `BASIC` 游戏已用 Microsoft Small Basic 重新编写，供新一代人享受！新的 Small Basic 游戏看起来和操作起来与原始的文本游戏一样。书中包含了所有的原始面条代码和\
  \ `GOTO` 命令！\n\n![Image](http://www.computerscienceforkids.com/microsoft-small-basic)\n\
  \n## Microsoft Small Basic 编程入门教程\n《The Beginning Microsoft Small Basic Programming\
  \ Tutorial》是一本自学的第一学期“初级”编程教程，由 11 章组成，用简单、易懂的术语解释了如何编写 Microsoft Small Basic 程序。书中使用了大量的示例来演示构建过程中的每一步。该教程的最后一章向你展示了四个不同的\
  \ Small Basic 游戏如何转换为 `Visual Basic`、`Visual C#` 和 `Java`。这个初级自学式教程可以在家里或学校使用。该教程对\
  \ 10 岁以上的儿童足够简单，对成年人也足够吸引。\n\n![Image](http://www.computerscienceforkids.com/microsoft-small-basic)\n\
  \n## 使用 Microsoft Small Basic 编写家庭项目\n《Programming Home Projects with Microsoft\
  \ Small Basic》是一本自学编程教程，用简单、易懂的术语解释了如何构建 Small Basic Windows 应用程序。学生将学习程序设计、`Small\
  \ Basic` 对象、`Small Basic` 语言的许多元素，以及如何调试和分发完成的程序。还介绍了顺序文件输入和输出。构建的项目包括一个 `Dual-Mode\
  \ Stopwatch`（双模式计时器）、`Flash Card Math`（数学闪卡）、`Multiple-Choice Exam`（多选择考试）以及雪球游戏。\n\
  \n![Image](http://www.computerscienceforkids.com/microsoft-small-basic)\n\n## David\
  \ Ahl 的 Small Basic 计算机冒险\n《David Ahl's Small Basic Adventures》是对 David Ahl 编写的经典游戏书籍的\
  \ Microsoft Small Basic 重制。新书包含了以下经典模拟：`Marco Polo`、`Westward Ho!`、`The Longest\
  \ Automobile Race`、`Amelia Earhart: Around the World Flight`、`Tour de France`、`Subway\
  \ Scavenger`、`Hong Kong Hustle` 和 `Voyage to Neptune`。使用 Microsoft Small Basic 编写这些经典。\n\
  \n![Image](http://www.computerscienceforkids.com/java)\n\n## 少年版 Java\n《Java For\
