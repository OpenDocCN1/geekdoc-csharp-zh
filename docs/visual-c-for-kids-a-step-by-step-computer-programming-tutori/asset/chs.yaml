  \ `Swing` 控件、Java 语言的许多元素，以及如何分发完成的项目。构建的项目包括双模式计时器、数学闪卡、多选择考试、黑式赌牌游戏、体重监测、家庭库存管理器以及雪球游戏。我们的学习\
  \ Java GUI 应用程序教程是本教程的前提。\n\n\n\n\n\n# 入门 Java™\n\nBeginning Java™ 是一本为期一学期的“入门”编程教程，由\
  \ 10 章节组成，用简单、易于理解的语言解释如何构建 Java 应用程序。该教程包含了几个详细的计算机项目，供学生进行构建和尝试。这些项目包括数字猜谜游戏、卡牌游戏、零花钱计算器、绘图程序、州府游戏以及几个像\
  \ Pong 这样的视频游戏。我们还包含了几个大学预备加分项目，包括贷款计算器、投资组合管理器和支票簿平衡器。为 15 岁及以上的学生设计。\n\n![Image](http://www.computerscienceforkids.com/java)\n\
  \n# 使用 Java™ 编程游戏\n\nProgramming Games with Java™ 是一本为期一学期的“中级”编程教程，由 10 章节组成，用简单、易于理解的语言解释如何构建\
  \ Visual C# 视频游戏。构建的游戏是非暴力、适合家庭的并能教授逻辑思维能力。学生将学习如何编写以下 Visual C# 视频游戏：密码破解者（Safecracker）、井字棋（Tic\
