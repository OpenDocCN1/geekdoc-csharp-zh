  \ 继承\n\n## 继承中的构造函数\n\n## 抽象\n\n## 静态与非静态类\n\n## 接口\n\n## 多态\n\n\n\n\n请尝试研究其他运行环境，例如小型商店或连锁店。不要急于编写代码，要保持冷静。根据我的经验，首先，你需要完美地学习这些；因此，为了实现这一重要目标，你必须尽可能在纸上进行练习，并记录与不同系统相关的对象的本质属性和行为，直到变得精通。不要害怕在大型系统上尝试，因为这完全`通过将庞大结构的组件分解为小组件`来实现；通过这种方式，有助于你在对象设计方面获得良好的技能水平。\n\
  \n## 对象的属性\n\n`properties of an object`（对象的属性）是与对象的一系列特征，能够精确地描述它。例如，将人看作一个对象，他/她有许多不同的特征，如眼睛颜色、身高、体重以及描述人的许多其他参数，这些都被称为\
  \ `properties of a human.`。\n\n## 行为\n\n除了`properties` 外，对象内部还有一系列动作，被称为 `Behaviors`（行为）。让我们快速澄清这一点：如果我们把人看作一个对象；我们可以说“人类可以行走，或人类可以看”，这些都是对象（人）可以执行的\
  \ `Behaviors`。\n\n## 方法\n\n事实上，方法是使用对象函数的方式。让我们用一个例子来拆解它。想象手机手机作为一个对象，这个对象（手机）内部有一个方法称为\
  \ `displaying numbers`（显示数字），它会在你的手机屏幕上显示所按的数字。所以，从技术上讲，当手机键盘上按下 `1` 时，这个按钮会调用 `displaying\
  \ numbers` 方法并发送 `1` 给它，最终，该方法会在屏幕上显示 `1`。如果这还不足够清楚，不要担心，稍后我们将通过实际操作在概念上理解它。\n\n\
  ## 字段\n\n一个 `field`（字段）是一个普通变量，可以携带不同类型的数据，并被认为是 `class` 的成员。它在 `class` 中声明，并使用\
  \ `set` 或 `get` 访问器来设置或获取任何值。\n\n## 访问器\n\n简单来说，`set` 和 `get` 是属性，允许程序员为 `class`\
  \ 中的字段设置或从字段中获取值。我们将在实践练习部分复习它。\n\n## 命名空间\n\n一个 `class` 可以包含大量成员，而 `namespace`（命名空间）内部可以包含许多\
  \ `classes`。`Namespaces` 包含了不同的预定义 `classes`，让程序员将其用于不同的用途。例如，在 `.NET` 框架中，有一个 `namespace`\
  \ 包含了连接到数据库（如 `SQL`、`Oracle DB` 等）所需的类。\n\n## 类的概念\n\n事实上，如果不把 `class` 作为原则，对象就毫无意义。让我们解释得更清楚一些：`class`\
  \ 在这里扮演父类角色，涵盖了从变量到属性、行为、方法等所有内容。换句话说，`class` 由一套为了实现特定目标而设计的规则组成，但为了使其适用，我们必须创建它的副本，这被称为\
  \ `Instantiation`（实例化）；通过这种方式，字面意思是，你`从一个类创建了一个对象`。\n\n\n\n\n属性（Property）是一种提供灵活机制的成员，用于读取、写入或计算私有字段的值。属性可以像公共数据成员一样被使用。属性封装了私有字段。它提供了\
  \ getter（`get{}`）来检索底层字段的值，以及 setter（`set{}`）来设置底层字段的值。\n\n#继承\n\n继承在面向对象编程（OOP）范式中起着主要作用。我们应该尽可能地练习这种技术，如果我们这样做，可以很有把握地成为\
  \ OOP 大师。为了更好地理解这个概念，让我们想象一下：从出生开始，孩子从父母那里继承属性，例如眼睛颜色、头发颜色、肤色、特殊行为等等。OOP 范式中也是如此，但如何实现呢？当我们设计一个实体时，可以将一个类视为父类，实体可以从父类继承一切。继此，就会实现代码的可重用，实体可以继承必要的属性；而不是编写大量的代码，从而减少了代码量并实际上提高了效率。\n\
  \n## 接口\n\n它与类相似，但正如你可能已经意识到的，与类不同，类不能同时继承两个或多个类，但接口可以无限制地被多次继承，因此我们将在“实际练习”部分尝试一个简单的示例，找出它是如何工作的。\n\
  \n# 多态性\n\n我们中的许多人对多态感到困扰，我们总是建议他们：“尽管完美地学习了‘继承’，但非常建议通过非常基础的示例来轻松找到该概念。”\n\n我们将讨论多态，并在实际部分尝试基础练习。想象一个办公室，在办公室里：有一位经理、一名办事员和一个秘书，他们的办公室进口了电脑设备。好了，为办事员（clerk）定义了一个类，里面定义了不同的方法，例如“注销（Log\
  \ out）”、“登录（Log in）”、“支付（Payment）”和“职责（Duty）”。请注意下方“办事员”类中定义的方法的行为。\n\n### 办事员方法的行为\n\
  \n- `Log in`: 此方法记录进入办公室的时间。\n- `Log out`: 此方法记录离开办公室的时间。\n- `Payment`: 此方法记录每月\
  \ 900 美元的默认月薪。\n- `Duty`: 此方法记录办事员是否与出口商交过话？\n\n好了，这个方法对办事员来说非常有效，但现在，我们还需要为经理（manager）也定义一个类。我们需要做的是从“办事员”继承一个类并进行细小的更改，因为办事员和经理的行为并不完全相同。因此，请注意下方继承后“经理”类中定义的每个方法的行为。\n\
  \n### “经理”方法的行为\n\n- `Log in`: 此方法记录进入办公室的时间。\n- `Log out`: 此方法记录离开办公室的时间。\n- `Payment`:\
  \ 此方法记录每月 3000 美元的默认月薪。\n- `Duty`: 此方法记录经理是否签署了信件？\n\n太棒了，我们希望读者能理解。我们做了什么？很简单，我们通过继承“办事员”类创建了一个名为“经理”的新类，由于这两个类所需的所需的行为并不完全相同，我们确实在“经理”类的\
  \ `Payment` 和 `Duty` 方法中提交了修改。\n\n## 实际练习\n\n## 如何创建一个类\n\n打开 Visual Studio 软件，然后点击\
