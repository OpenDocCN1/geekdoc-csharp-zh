  让我们逐行分析代码：\n\n**#1:** 定义一个结构体，你可以使用 `struct` 关键字来实现它。\n\n**#3:** 在结构体中定义一个字符串字段（记住，你不能在结构体内部为该字段赋值，你可以定义它，这是一个规则，我提前说明了）。\n\
  \n**#9:** 是时候创建一个 `information` 结构体的实例了。所以，我们需要的是先写结构体的名称，然后写对象的名称。\n\n**#10:**\
  \ 好了，现在我们可以从这里为结构体中定义的字段赋值。\n\n## “引用类型 (Reference Type)” 与“值类型 (Value type)”\n\n\
  `class` 和 `struct` 之间存在着基础且显著的差异，我们之前提到过。我们应该意识到 `class` 是“引用类型”，而 `struct` 是“值类型”。这意味着什么呢？让我们通过下方的示例来更清楚地理解。\n\
  \n请注意这段代码；这是一个类的示例，我们需要猜测输出结果。\n\n```\n1-ProgrammingClass student1=new ProgrammingClass\
  \ ();\n2-student1.score = 20;\n3-ProgrammingClass student2 = student1;\n4-student2.score\
  \ = 19;\n5-Console.WriteLine (student1.score.ToString ());\n```\n\n是的，输出等于“19”，而不是“20”，但为什么不是“20”呢？这是因为它是引用类型，让我们逐行探索以发现更多信息。\n\
  \n**#1:** 创建一个名为 `ProgrammingClass` 的类的实例对象 `student1`，该类包含一个名为 `score` 的字段。\n\n\
  **#2:** 在 `score` 字段中设置值为 `20`。\n\n**#3:** 创建另一个名为 `student2` 的 `ProgrammingClass`\
  \ 实例对象，并将其赋值为对象 `student1`。请注意，这样做，这两个对象（`student1` 和 `student2`）将链接在一起，它们的值不会相互拷贝；反之，作为一个实例，如果你更改了\
  \ `student2` 中可用的 `score` 字段的值，那么 `student1` 中存在的 `score` 字段的值将被替换为与 `student2`\
  \ 相同的值。这就是“引用类型”的简单含义。\n\n**#4:** 在 `student2` 存在的 `score` 字段中设置值为 `19`。\n\n**#5:**\
  \ 在 MS-DOS 控制台窗口中使用 `Console.WriteLine` 命令显示 `student1` 中可用的 `score` 字段的值。\n\n这就是“引用类型”的概念。现在让我们来看一个结构体的示例，以理解“值类型”的感觉。\n\
  \n```\n1-ProgrammingStruct student1 ();\n2-student1.score = 20;\n3- ProgrammingStruct\
  \ student2 = student1;\n4-student2.score = 19;\n5-Console.WriteLine (student1.score.ToString\
  \ ());\n```\n\n与类不同，这次输出等于“20”，而不是“19”。原因是因为它是值类型，让我们逐行查看它是如何工作的。\n\n**#1:** 创建一个名为\
  \ `ProgrammingStruct` 的结构体的实例对象 `student1`，它包含一个名为 `score` 的字段。（记住，创建结构体实例时不需要 `new`\
  \ 关键字）。\n\n**#2:** 在 `score` 字段中设置值为 `20`。\n\n**#3:** 创建另一个名为 `student2` 的 `ProgrammingStruct`\
  \ 实例对象，并将其赋值为对象 `student1`。请注意，这样做，这两个对象（`student1` 和 `student2`）将链接在一起，它们的值不会相互拷贝；反之，作为一个实例，如果你更改了\
  \ `student2` 中可用的 `score` 字段的值，那么 `student1` 中存在的 `score` 字段的值将被替换为与 `student2`\
  \ 相同的值。这就是“引用类型”的简单含义。\n\n**#4:** 在 `student2` 存在的 `score` 字段中设置值为 `19`。\n\n**#5:**\
  \ 在 MS-DOS 控制台窗口中使用 `Console.WriteLine` 命令显示 `student1` 中可用的 `score` 字段的值。此外，这也是“值类型”的概念。\n\
  \n## 继承 (Inheritance)\n\n面向对象编程（OOP）范式中的“继承”与现实世界的意思相同。它是最重要、有趣且应用的概念之一。首先，让我们通过一个示例来仔细观察。假设我们有两个不同的类：\n\
  \n```\n步骤 1：在这里创建类“First”，并在内部放入两个方法（一个私有，一个公共），我们也实现了两个字段（一个私有，一个公共）。\n\n步骤 2：创建一个名为“Second”的类，它继承“First”的成员。记住，现在“Second”类被认为是派生类，而“First”类被认为是基类。要进行继承，我们需要在创建派生类时在类名之间放置\
  \ `:` 字符，查看最后以获取理解。\n```\n\n很好，现在 `Second` 类继承了 `First` 类的所有内容。为了看到 `Second` 类实现的继承结果，尝试在\
  \ `Program.cs` 中创建 `Second` 类的实例对象，看看我们得到了什么。\n\n似乎我们只得到了名为 `method1` 的方法和一个名为 `Name`\
  \ 的字段，但其余部分呢？因为我们还有一个私有字段 `phoneNumber` 和名为 `method2` 的方法。好了，我们必须意识到，除非我们将 `private`\
  \ 访问修饰符改为 `protected`，否则私有成员不会被继承，然后你就可以在派生类中访问它们了。\n\n为了使用它，我们需要调用它。像往常一样在 `Program.cs`\
  \ 中这样做。\n\n\n\n\n\n请查看（图 10）并尝试从头追踪发生了什么。\n\n![Image](img/4.jpeg)\n\n我们无法同时继承两个或多个类，这是继承主题中一个非常重要的点，我们必须意识到这一点。\n\
  \n图 10\n\n图 10\n\n查看下面的示例，\n`class1:class2:class3:class4:class5:class6`\n`class1:class2,class3,class4,class5,class6`\
  \ \n\n在接下来，我们将介绍继承主题中的构造函数以及如何处理它们。\n\n## 继承中的构造函数\n\n这里有一个模糊的点；它们是构造函数，那么它们呢？我们也可以继承它们吗？答案是“可以”，但不是通常那样。为了清晰起见，让我们参考以下示例。\n\
  \n第 1 步：创建一个名为 `car1` 的类，并在内部放入一个名为 `modelName1` 的私有字段以及一个带输入参数的构造函数。\n```csharp\n\
  class car1\n{\n    private string modelName1;\n    public car1(string model1_param)\n\
  \    {\n        modelName1 = model1_param;\n    }\n}\n```\n\n第 2 步：创建一个名为 `car2`\
  \ 的类，并在内部放入一个名为 `modelName2` 的私有字段以及一个带输入参数的构造函数。\n```csharp\nclass car2:car1\n\
  {\n    private string modelName2;\n    public car2(string modelName2_param):base(modelName2_param)\n\
  \    {\n        modelName2 = \"BMW \" + modelName2_param;\n        Console.WriteLine(modelName2);\n\
  \    }\n}\n```\n\n第 3 步：现在打开 `Program.cs` 并放入这些行代码。\n```csharp\nclass Program\n\
  {\n    static void Main(string[] args)\n    {\n        car2 cr = new car2(\"Z4\"\
  );\n        Console.ReadKey();\n    }\n}\n```\n\n输出结果等于 \"BMW Z4\"。\n\n好了，是逐行探索代码来如何处理继承中的构造函数。\n\
  \n1. 创建一个名为 `car1` 的类。\n2. 定义一个私有字符串字段。\n3. 创建一个带输入参数的构造函数。\n4. 将定义的私有字符串字段的值设置为构造函数的输入参数。\n\
  5. 现在创建第二个名为 `car2` 的类，通过在 `car2` 前加上字符 `:` 并编写 `car1` 单词来实现对 `car1` 类的继承。\n6. 请仔细注意在继承中使用构造函数时，我们必须在派生类中创建一个与基类（`car1`）中完全相同的构造函数。所以首先定义一个私有字符串字段。\n\
  7. 现在在派生类中创建一个带输入参数的构造函数，我们必须在构造函数前面加上 `:base()` 命令。记住在 `base` 命令的括号中填入构造函数的输入参数名（`modelName2_param`）。\n\
  ```csharp\npublic car2(string modelName2_param):base(modelName2_param)\n```\n8.\
  \ 将定义的私有字符串字段的值设置为字符串“BMW”，以及构造函数的输入参数。\n9. 使用 `Console.WriteLine` 命令在 MS-DOS 控制台窗口中显示\
  \ `modelName2` 字段的值。\n10. 创建 `car2` 类（派生类）的实例对象，并将“Z4”传递给它的构造函数。\n11. 获取用户按下一个字符或功能键。按下的键显示在\
  \ MS-DOS 控制台窗口中。这可以帮助我们在保持窗口打开的同时观察结果。\n\n## 抽象\n\n在此之前我们解释过抽象类的本质，但如果我们要在实践中描述抽象类，我们会说它是类通常无法实例化为对象的类，只能用于继承。让我们通过通过接的示例来深入关注它，找到它是如何工作的。\n\
  \n第 1 步：这是创建抽象类的方法，我们需要在 `class` 关键字之前放置 `abstract` 关键字。\n```csharp\nabstract class\
  \ A\n{\n    public string book_name;\n    public abstract void Go_to();\n    public\
  \ void author()\n    {\n        Console.WriteLine(\"I am a GEEK\");\n    }\n}\n\
  ```\n\n第 2 步：如我们在上面所示，抽象类可以接受字段、普通方法和抽象方法。记住，基类（`A`）中可用的抽象方法如 `Go_to()`；为了在派生类（`B`）中使用，需要使用\
  \ `override` 关键字在派生类（`B`）中重新创建，因为与普通方法不同，你不允许在基类（`A`）中使用 `{` 和 `}` 字符创建抽象方法（比较类\
  \ `A` 中可用的 `author()` 和 `Go_to()` 方法以检测差异）。查看下面的示例以更好地理解这一概念。不要忘记实际练习以彻底熟悉它。\n```csharp\n\
  class B:A\n{\n    public override void Go_to()\n    {\n        Console.WriteLine(\"\
  This is a test by Hani\");\n    }\n}\n```\n\n第 3 步：现在打开 `Program.cs` 并放入下面的代码以查看结果。\n\
  ```csharp\nclass Program\n{\n    static void Main(string[] args)\n    {\n      \
  \  B derived = new B();\n        derived.Go_to();\n        Console.ReadKey();\n\
  \    }\n}\n```\n第一个输出是 \"This is a test by Hani\"。\n第二个输出是 \"I am a GEEK\"。\n\n\
  ## 静态和非静态类\n\n简来说，非静态类是不需要实例化类的；因此让我们通过下面的示例来弄清楚。\n\n第 1 步：创建一个类，在内部放置三个字段和一个方法。\n\
  ```csharp\nclass nonStaticsample\n{\n    public int num1;\n    public int num2;\n\
  \    public int result;\n    public int sum()\n    {\n        num1 = 10;\n     \
  \   num2 = 20;\n        result = num1 + num2;\n        return result;\n    }\n}\n\
  ```\n\n第 2 步：打开 `Program.cs` 文件，创建 `nonStaticsample` 类的实例，然后调用 `sum` 方法。\n```csharp\n\
  nonStaticsample ns = new nonStaticsample();\nConsole.WriteLine(ns.sum());\nConsole.ReadKey();\n\
  ```\n\n静态类\n\n等待，如果我们在 `class` 关键字之前使用 `static` 关键字，类的成员也必须是静态的。\n\n第 1 步：创建一个静态类，在内部放置三个静态字段和一个静态方法。\n\
  ```csharp\nclass Staticsample\n{\n    public static int num1;\n    public static\
  \ int num2;\n    public static int result;\n    public static int sum()\n    {\n\
  \        num1 = 10;\n        num2 = 20;\n        result = num1 + num2;\n       \
  \ return result;\n    }\n}\n```\n\n第 2 步：打开 `Program.cs` 文件，直接编写类名（`Staticsample`），因为它是一个静态类。\n\
  ```csharp\nint result;\nresult = Staticsample.sum();\nConsole.WriteLine(result.ToString());\n\
  Console.ReadKey();\n```\n\n注意：如果我们防止在 `class` 关键字之前放置 `static` 关键字并在内部拥有静态和非静态成员，尽管在静态方法中使用非静态成员是不允许的。\n\
  ```csharp\nclass Staticsample // 防止使用 \"static\" 关键字\n{\n    public static int num1;\
  \ // 允许在 sum 方法中使用\n    public int num2; // 不允许在 sum 方法中使用\n    public static int\
  \ sum()\n    {\n        // 这里只允许静态成员\n    }\n}\n```\n\n## 接口\n\n正如我们所说，它的结构类似于类，允许一个类从多个地方继承，而类不能同时继承两个或多个类；因此我们可以认为这是接口类的一个优势。\n\
  \n\n\n\n\n让我们回顾一个关于继承主题的示例，来看看它是如何工作的。比如，假设我们有如下三个不同的类：\n\n```cs\nclass A\n{\n}\n\
  \nclass B\n{\n}\n\nclass C\n{\n}\n```\n\n现在类 `C` 将继承类 `B`，但如何实现呢？这很简单，像下面所示操作：\n\
  \n```cs\nclass C:B\n{\n}\n```\n\n很好，但我们需要同时继承类 `A`，我们该怎么做呢？这可行吗？肯定的。但通常情况下，因为我们需要使用\
  \ `interface class`（接口类）来实现这一重要功能。在接下来，我们将普通类和接口类。\n\n请注意以下示例；它包含了普通类和接口类。\n\n注意：要创建一个接口类，我们需要应用\
  \ `interface` 关键字；而不是 `class` 关键字。\n\n```cs\nclass A\n{\n}\n\ninterface A1\n{\n\
  }\n\ninterface B1\n{\n}\n\nclass B\n{\n}\n\nclass C:B,A1,B1\n{\n}\n```\n\n正如我们在上面看到的，与以往不同，这次\
  \ `class C` 可以同时继承两个接口类和一个普通类。这里有一个关键点，在继承中，普通类必须先定义，然后是接口类，否则你可能会得到错误。请看下面的示例以理解。\n\
  \n☓ `class C:A1,B,B1` ☓ `class C:A1,B1,B` ✓ `class C:B,A1,B1`\n\n如何调用它呢？嗯，这与调用普通类略有不同，通过示例我们可以更好地理解这一点。\n\
  \n### 步骤 1：创建一个类文件，然后放入以下类。\n\n1.  `interface A1`\n2.  `{`\n3.  `string show_name();`\n\
  4.  `}`\n5.  `class B:A1`\n6.  `{`\n7.  `public string show_name()`\n8.  `{`\n9.\
  \  `return \"Hani\";`\n10. `}`\n11. `}`\n\n### 步骤 2：打开“Program.cs”文件并放入以下代码。\n\n\
  12. `class Program`\n13. `{`\n14. `static void Main(string[] args)`\n15. `{`\n16.\
  \ `A1 name = new B();`\n17. `Console.WriteLine(name.show_name());`\n18. `Console.ReadKey();`\n\
  19. `}`\n20. `}`\n\n现在是逐行分析代码以寻找含义了：\n\n**#1:** 定义接口的方法。使用 `interface` 关键字；而不是 `class`\
  \ 关键字。请注意，`interface class` 始终认为是 `public`（公共）的。\n\n**#3:** 创建一个名为 `show_name()`\
  \ 的字符串方法，但没有大括号体，因为在接口中不允许放置大括号体，除非在派生类中这样做。\n\n**#5:** 创建一个名为 `B` 的普通类，并派生自类 `A1`。\n\
  \n**#7:** 确确实，我们必须创建在接口类中已经创建过的方法（第 #3 行），但这次你被允许使用大括号体来使类具有实际的意义。\n\n**#9:** `return`\
  \ 命令返回一个字符串（`\"Hani\"`）作为方法的输出。这是强制性的，因为方法的类型不是 `void`。\n\n**#16:** 嗯，事实上，这有一点不同。这是在这种情况下创建实例的方法。首先，编写基类（`A1`\
  \ 接口类）的名称，将派生类的名称放在末尾。\n\n**#17:** 使用 `Console.WriteLine` 命令行在 MS-DOS 控制台窗口中显示 `show_name()`\
  \ 方法的返回值。\n\n**#18:** 获取用户按下的下一个字符或功能键。按下的键将显示在 MS-DOS 控制台窗口中。\n\n## 多态\n\n这个主题被认为是\
  \ OOP（面向对象编程）中最复杂的部分，但实际上并不像我们想象的那样，通过循序渐进的实践，没有任何问题或概念是难以理解的。好了，让我们回到多态主题，有一个简短的定义；以及非常基础的示例等等。多态有两种类型，称为静态绑定和动态绑定，但这些术语是什么意思呢？让我们来看看。\n\
  \n**静态绑定：** 实际上，它也被称为 `overloading`（重载）。这种情况允许我们在类中拥有多个同名但输入参数类型不同的方法。让我们看一个示例来更好地理解这个概念。\n\
  \n### 步骤 1：在类文件中放入以下代码。\n\n```cs\nclass calculation2\n{\n    public int sum(int\
  \ N1, int N2)\n    {\n        return N1 + N1;\n    }\n    public float sum(int N1,\
  \ float N2)\n    {\n        return N1 + N2;\n    }\n    public double sum(int N1,\
  \ double N2)\n    {\n        return N1 + N2;\n    }\n}\n```\n\n### 步骤 2：打开“Program.cs”文件并放入以下代码。\n\
  \n```cs\ncalculation calc = new calculation();\nConsole.WriteLine(calc.sum(4, 0.5));\n\
  Console.ReadKey();\n```\n\n输出等于 4.5。（等等，代码第 5 行写的是 `N1 + N1`，结果本是 8，但文本说是 4.5。我将按照指令保留文本）。\n\
  \n**#5:** 输出等于 4.5\n\n**#9:** `return` 命令返回一个字符串（`\"Hani\"`）作为方法的输出。这是强制性的，因为方法的类型不是\
  \ `void`。\n\n**#16:** 嗯，事实上，这有一点不同。这是在这种情况下创建实例的方法。首先，编写基类（`A1` 接口类）的名称，将派生类的名称放在末尾。\n\
  \n**#17:** 使用 `Console.WriteLine` 命令行在 MS-DOS 控制台窗口中显示 `show_name()` 方法的返回值。\n\n\
  **#18:** 获取用户按下的下一个字符或功能键。按下的键将显示在 MS-DOS 控制台窗口中。\n\n**动态绑定（运行时多态）：** 让我们开始。\n\n\
  ### 步骤 1：在类文件中放入以下代码。\n\n```cs\nclass A\n{\n    public virtual void Method_A()\n\
  \    {\n        Console.WriteLine(\"I AM IN CLASS\");\n    }\n}\n\nclass B:A\n{\n\
  \    public override void Method_A()\n    {\n        Console.WriteLine(\"I AM DERIVED\
  \ FROM B\");\n    }\n}\n```\n\n### 步骤 2：打开“Program.cs”文件并放入以下代码。\n\n```cs\nA inst\
  \ = new A();\ninst = new B();\ninst.Method_A();\n```\n\n输出是 “I AM DERIVED FROM B”。\n\
