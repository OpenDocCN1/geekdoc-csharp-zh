  \ MS-DOS 控制台窗口中使用 `Console.WriteLine` 命令行显示 `color` 字段的值。\n\n### #17：在 MS-DOS 控制台窗口中使用\
  \ `Console.WriteLine` 命令显示 `max_speed` 字段的值。\n\n### #18：获取用户按下的下一个字符或功能键。按下的键将显示在\
  \ MS-DOS 控制台窗口中。这有助于我们在保持窗口打开的同时观察结果。\n\n我们可能会问自己，既然可以在定义字段时设置它们的默认值，为什么还要使用构造函数呢？很好，这是一个问题，让我们看看为什么？即使我们没有创建构造函数来初始化类或结构体的数据成员，编译器也会这样做，在创建类或结构体后初始化数据成员并调用它。记住，我们可以在类或结构体中同时定义多个带有输入参数的构造函数，这使我们能够为类的每个实例设置不同的值，例如，我们可以拥有五个具有不同值的类实例。我们可以在\
  \ C# OOP 的高级主题中找到关于此点的更多信息。\n\n## 如何使用析构函数\n\n析构函数是帮助从内存中清理完成对象的方法。然而，垃圾回收语言可以很容易地做到这一点，析构函数不再那么有用，但至少，了解析构函数的功能是有用的。\n\
  \n查看下例以发现它的工作原理。\n\n第 1 ：将以下代码放入类文件中。\n\n```csharp\nclass print_command\n{\n   \
  \ public print()\n    {\n        Console.WriteLine (\"This is a constructor\");\n\
  \    }\n    ~print()\n    {\n        Console.WriteLine (\"This is a destructor\"\
  );\n    }\n} // 类结束\n```\n\n第 2 ：打开 `Program.cs` 文件并放入以下代码。\n\n```csharp\nclass\
  \ Program\n{\n    static void Main(string[] args)\n    {\n        print_command\
  \ prt = new print_command();\n    }\n}\n```\n\n第 3 ：运行程序，让 CLR 输出结果。\n\n第一个输出等于“This\
  \ is a constructor”。\n\n第二个输出等于“This is a destructor”。\n\n好了，让我们追踪这些代码行看看发生了什么。\n\
  \n### #1：定义一个名为 `print_command` 的类。\n\n### #3：定义 `print()` 构造函数。\n\n### #5：在构造函数内部使用\
  \ `Console.WriteLine`。\n\n### #7：使用 `~print()` 定义析构函数。\n\n### #9：在析构函数内部使用 `Console.WriteLine`。\n\
  \n### #11：类结束。\n\n### #12：定义 `Program` 类。\n\n### #13：定义 `Main(string[] args)` 方法。\n\
  \n### #16：创建一个名为 `prt` 的 `print_command` 实例。\n\n### #17：关闭 `Main` 方法。\n\n### #18：关闭\
  \ `Program` 类。\n\n## 属性与封装\n\n这里有一个属性的简化示例。首先，追踪这些代码行：\n\n第 1 ：创建一个名为 `Calculation`\
  \ 的类。\n\n```csharp\nclass Calculation\n{\n    private int result;\n    public int\
  \ Age\n    {\n        get { return result; }\n        set { result = value; }\n\
  \    }\n}\n```\n\n第 2 ：打开 `Program.cs` 文件并放入以下代码。\n\n```csharp\nclass Program\n\
  {\n    static void Main(string[] args)\n    {\n        Calculation clc=new Calculation();\n\
  \        clc.Age=50;\n        Console.WriteLine (clc.Age);\n        Console.ReadKey();\n\
