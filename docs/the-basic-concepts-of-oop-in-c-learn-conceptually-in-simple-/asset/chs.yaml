  \n### #1：我们定义了一个名为 `Calculation` 的类。\n\n### #3：由于遵循封装规则，我们必须将 `result` 字段定义为 `private`。这样，该字段对于使用同一类的其他用户的尝试是不可访问的。因此，我们就可以满足在现实意义上非常重要的封装概念。\n\
  \n### #4：在类内部定义一个属性，名为 `Age`。\n\n### #6：简单来说，这个方法**从私有字段获取值**并在你调用它时将其传递给你。\n\n\
  ### #7：这个方法为私有字段设置值，记住 `=` 旁边的 `value` 是一个必须的关键字，用于正确地将值放入字段。\n\n\n\n\n快要完了，代码的其他部分（从\
  \ #10 开始）都在 `Program.cs` 中。\n\n**#14:** 在这里我们需要创建一个名为 `Calculation` 的定义类的实例。好了，我这样做了，并将实例化的类命名为\
  \ `clc`（你可以使用你喜欢的名称），然后我们就有了一个名为 `clc` 的可用 `Calculation` 类副本。正如你可能意识到的，类不能单独使用，需要通过实例化才能生效。\n\
  \n**#15:** 将值 `50` 赋值给 `Calculation` 类中名为 `result` 的私有字段。事实上，实际上是它将值 `50` 传递给属性，而属性中的\
  \ `set` 方法使用 `value` 关键字获取该值，并简单地将其置于名为 `result` 的私有字段中。\n\n**#16:** 这一行读取了 `Calculation`\
  \ 类中私有字段的可用值。简单来说，这次 `get` 方法从 `Calculation` 类中名为 `result` 的私有字段获取可用值，并将其传递给你，然后接收到的值将减去数字\
  \ 7。最终，这一行命令 `Console.WriteLine` 在 MS-DOS 控制台窗口中显示结果（获取的值减去数字 7）。\n\n**#17:** 获取用户按下的下一个字符或功能键。按下的键将显示在\
  \ MS-DOS 控制台窗口中。事实上，它可以帮助我们在保持窗口打开的同时观察最终结果。\n\n## 结构体 (Struct)\n\n让我们通过下方的结构体基本实例来了解其结构。\n\
