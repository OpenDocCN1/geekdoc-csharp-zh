  \n图 6\n\n图 6\n\n## 如何使用构造函数\n\n好了，正如我们提到的，构造函数是不返回任何值的方法。例如，如果我们有一个名为 `car` 的类，它也一定有一个构造函数，也称为\
  \ `car`。我们注意到，构造函数的主要任务之一是初始化新对象的数据成员。\n\n构造函数的总体结构如下：\n\n`{Access-modifier} {Class-name}([Parameters])`\n\
  \n```csharp\n{\n\n}\n```\n\n查看一个简单的示例以更好地理解结构。\n\n第 1 ：将以下代码放入类文件中。\n\n```csharp\n\
  public class car2\n{\n    public string color;\n    public int max_speed;\n    public\
  \ car ()\n    {\n        color = \"Orange\";\n        max_speed = 200;\n    }\n\
  }\n```\n\n第 2 ：打开 `Program.cs` 文件并放入以下代码。\n\n```csharp\npublic class Program1\n\
  {\n    static void Main(string[] args)\n    {\n        car cr = new car();\n   \
  \     Console.WriteLine(cr.max_speed);\n        Console.WriteLine(cr.colour);\n\
  \        Console.ReadKey();\n    }\n}\n```\n\n第 3 ：运行程序，让 CLR 输出结果。\n\n第一个输出等于“200”。\n\
