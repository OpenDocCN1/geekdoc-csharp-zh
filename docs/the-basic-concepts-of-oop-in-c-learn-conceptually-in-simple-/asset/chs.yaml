  `[Access modifier][`class` keyword][ClassName]`*\n\n仔细考虑，“访问修饰符”你需要替换为下面提到的项，\n\n\
  - `public`: 该类型或成员可以被同一程序集的任何其他代码或引用该程序的另一个程序集的代码访问。\n- `internal`: 该类型或成员可以被同一程序集的任何代码访问，但不能从另一个程序集访问。\n\
  \n在 `[Access modifier]` 之后，你**必须**放置 `class` 关键字，然后为你的类命名，请查看下面的示例了解它是如何工作的。（使用访问修饰符是可选的）。\n\
  \n**注意：** 如果未指定访问修饰符，默认是“Internal”。\n\n```csharp\npublic / internal class Customer\n\
  {\n    // 代码写在这里……\n}\n```\n\n所以，尝试在 C# 中创建一个类来查看它是如何工作的；然而，这是至关重要的。\n\n## C# 中方法的声明\n\
  \n`[Access modifier][Return type]Method Name`\n\n好了，方法定义在类内部，为此，首先我们需要一个类。假设我们有一个名为\
  \ `math_operation` 的类，我将在里面创建一个 `sum` 方法。在一切之前，让我们解释一下下方的声明元素。\n\n在 `Access modifier`\
  \ ，你可以替换下面提到的项：\n\n- `public`: 该类型或成员可以被同一程序集的任何其他代码或引用该程序的另一个程序集的访问。\n- `private`:\
  \ 该类型或成员仅可以被类内部的代码访问。\n- `protected`: 该类型或成员可以被类内部代码或其派生类的代码访问。\n- `internal`: 该类型或成员可以被同一程序集中的任何代码访问，但不能从另一个程序集访问。\n\
  - `protected internal`: 该类型或成员可以被其声明程序集中的任何代码或来自另一个程序集的派生类的代码访问。\n- `private protected`:\
  \ 该类型或成员仅可以被其声明程序集内的类或其派生类的代码访问。\n\n对于 `return type`，如果方法返回任何值，你必须编写数据类型，例如 `int`、`string`\
  \ 等。否则，返回类型为 `void`，我们需要应用 `void` 关键字。\n\n**注意：** 如果用 `void` 关键字替代 `return type`，你不需要在方法体内编写\
  \ `return` 关键字，但如果你在 `return type` 中使用了任何数据类型，则需要使用 `return` 关键字。\n\n在 `Method name`\
  \ 方面，你需要为你的方法设置一个**唯一标识符**与其他标识符区分，记住，它是区分大小的。\n\n在 `Parameter list`（即在两个括号之间），你可以插入不同类型的变量作为方法的**输入**和**输出**。\n\
