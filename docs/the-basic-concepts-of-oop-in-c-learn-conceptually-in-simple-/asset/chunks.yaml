    # The polymorphism


    This topic is considered to be the most complex part in OOP, but not really as
    we believe no problem or concept is hard-to-understand with step by step practices.
    Well, let us get back to polymorphism topic, have a short definition of; also,
    very basic examples, and so on. There are two types of polymorphism, which are
    called static binding and dynamic binding, but what do these terms mean? Let us
    see.


    **Static binding:** In fact, it is called “**overloading**” too. This situation
    allows us having **multiple the same-name methods** in a class with **different
    input parameters in type**. Let us look at an example to find out the concept
    better.


    Step 1: Put the below codes in a class file.


    1- class calculation2- {3- public int sum(int N1, int N2)4- {


    5-return N1 + N1;


    6-}


    7-public float sum(int N1, float N2)


    8-{


    9-return N1 + N2;


    10-}


    11-public double sum(int N1, double N2)


    12-{


    13-return N1 + N2;


    14-}


    15-}


    Step 2: Open the “Program.cs” file and put the following codes in.


    16- calculation calc = new calculation();


    17- Console.WriteLine(calc.sum(4, 0.5));


    18- Console.ReadKey();


    The output is equal to 4.5.


    Well, let us explore the lines to find out the way it works.


    **#1:** Create a class called calculation.


    **#3:** Create a method called “**sum**” as “**int”**, **which comes with** two
    input parameters as “int**”.**


    **#5:** Returns the sum of the two “int” input parameters.


    #7:  Create the second method called “sum” as “float”, which comes with two input
    parameters as “int” and as “float”.


    **#9:** Returns the sum of the two “**int**” and “**float**” input parameters.


    **#11:** Create the third method called “**sum**” as “**double”**, **which comes
    with** two input parameters as “int” and as “double”.


    **#13:** Returns the sum of the two “**int**” and “**double**” input parameters.


    **#16:** Create an instance from the “calculation” class. Well, now we have access
    to each three of the same-name methods, but for example, how to use the third
    method, which uses “int” and “double” input parameters? It is easy, call the method,
    and put the appropriate input type and amount to work. See the line #17**.**


    **#17:** Show the returned value from the **third “sum” method** using the “**Console.WriteLine”**
    command line, in an MS-DOS console window.


    Why the third one? Moreover, why not the first one? Because we passed these amounts
    “5”, which is an integer, and “0.5”, which is **double**, so technically, spontaneously
    it will use the third one that benefits from “**integer**” and “**double**” input
    types.


    **#18:** Obtains the next character or function key pressed by the user. The pressed
    key is displayed in the MS-DOS console window. In fact, it could help us observe
    the final consequence(s) while keeping the window opened.


    **Dynamic binding (Runtime Polymorphism):** Let us begin with an example.


    Step 1: Put the below codes in a class file.


    1-class A


    2-{


    3- public virtual void Method_A()


