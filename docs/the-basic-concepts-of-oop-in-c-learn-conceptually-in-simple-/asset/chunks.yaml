    \    {\n        Console.WriteLine(\"I am a GEEK\");\n    }\n}\n```\n\nStep 2:\
    \ As we could see in the above, an abstract class could accept fields, normal\
    \ methods, and abstract methods too. Remember, the available abstract method(s)\
    \ in the base class (`A`), like `Go_to()`; in order to use in derived class (`B`),\
