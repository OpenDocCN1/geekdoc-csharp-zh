    \ method.\n```csharp\nnonStaticsample ns = new nonStaticsample();\nConsole.WriteLine(ns.sum());\n\
    Console.ReadKey();\n```\n\n# Static class\n\nWait, if we use the `static` keyword\
    \ before the `class` keyword, the members of the class have to be static too.\n\
    \nStep 1: Create a static class, place three static fields and a static method\
    \ inside.\n```csharp\nclass Staticsample\n{\n    public static int num1;\n   \
    \ public static int num2;\n    public static int result;\n    public static int\
    \ sum()\n    {\n        num1 = 10;\n        num2 = 20;\n        result = num1\
    \ + num2;\n        return result;\n    }\n}\n```\n\nStep 2: Open the `Program.cs`\
    \ file, write the name of the class (`Staticsample`) directly, as it is a static\
    \ class.\n```csharp\nint result;\nresult = Staticsample.sum();\nConsole.WriteLine(result.ToString());\n\
    Console.ReadKey();\n```\n\nNote: If we prevented putting the `static` keyword\
    \ before the `class` keyword and still could have static and non-static members\
    \ inside, although employing non-static members in static methods are not allowed.\n\
    ```csharp\nclass Staticsample // Prevented to use the \"static\" keyword\n{\n\
    \    public static int num1; // Allowed to be used in the sum method\n    public\
    \ int num2; // Not allowed to be used in the sum method\n    public static int\
    \ sum()\n    {\n        //Only static members are allowed here.\n    }\n}\n```\n\
    \n# The interface\n\nAs we said, its structure is like the class, which let a\
    \ class to inheritance multiple times from, while a class cannot inherit from\
    \ two or more classes simultaneously; thereupon we could consider this as an advantage\
    \ of the Interface class.\n"
