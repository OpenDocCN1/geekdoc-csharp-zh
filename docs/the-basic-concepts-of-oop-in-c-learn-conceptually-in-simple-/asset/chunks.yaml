    Please try to examine other operational environments like a small shopping or
    a chain store. Do not rush to get on codes quickly, keep calm, based on my experience,
    first, you need to learn this perfectly; therefore, to achieve this important
    you must practice on paper as much as you could, and jot down essential properties
    and behaviors of objects related to different systems until becoming a master.
    Do not afraid to try on large systems as it is possible simply `by breaking down
    the components of enormous structures into small ones`; through this, helps to
    gain a good level of skill in designing an object.


    # The Properties of an object


    The `properties of an object` are bunches of characteristics concerned an object,
    which precisely, describe it. For example, consider a human as an object, there
    are tons of different characteristics for him/her such as eye color, height, weight
    and many other parameters describing a human, these are all called `properties
    of a human.`


    # The Behaviors


    Despite `properties`, there are a series of actions inside an object called `Behaviors`,
    let us clarify this quickly, if we consider a human as an object; hence, we can
    say “humans can walk, or humans can see”, these are called `Behaviors` an object
    (human) could do.


    # The Methods


    In fact, methods are the ways to employ function(s) of an object. Let us break
    down this using an example. Imagine, there is a mobile phone as an object, and
    there is a method inside this object (mobile phone) called `displaying numbers`,
    which shows pressed numbers on the display of your mobile phone. So, technically
    when we press `1` on your mobile phone''s keypad, this button invokes `displaying
    numbers` method and sends `1` to that, and ultimately, the method will show `1`
    on display. If it is not crystal clear enough, do not worry, later, we will work
    practically to get it conceptually.


    # The fields


    A `field` is a normal variable, which can carry different types of data, and are
    contemplated to be members of a `class`. It has declared in a `class`, and to
    set or get any values to use `set` or `get` accessor.


    # The Accessor


    In simple language, `set` and `get` are properties, which let the programmer set
    or get value(s) to or from a field in a `class`. We will review it in practical
    exercises section.


    # The Namespaces


    A `class` can carry tons of members, and a `namespace` can carry a lot of `classes`
    inside. `Namespaces` are containing different pre-defined `classes`, which let
    programmers use for variant purposes. For example, in `.NET` framework, there
    is a `namespace` that contains necessary classes to connect to a database such
    as `SQL`, `Oracle DB`, and etcetera.


    # The concept of a Class


    Well, in fact, objects are nothing if we do not consider a `class` as a principle.
    Let us explain more clearly, a `class` plays a parent role here and encompasses
    everything from variables to properties, behaviors, methods, and etcetera. In
    other words, a `class` has made of a set of rules to achieve a unique goal, but
    to make it applicable; we have to create a copy of that, which is called `Instantiation`;
    by this, literally, you have `created an object from a class`.

