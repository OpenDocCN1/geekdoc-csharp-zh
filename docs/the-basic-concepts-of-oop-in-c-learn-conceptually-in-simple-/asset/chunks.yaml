    {\n    public int num1;\n    public int num2;\n    public int result;\n    public\
    \ int sum()\n    {\n        num1 = 10;\n        num2 = 20;\n        result = num1\
    \ + num2;\n        return result;\n    }\n}\n```\n\nStep 2: Open the `Program.cs`\
