    请尝试研究其他运行环境，例如小型商店或连锁店。不要急于编写代码，要保持冷静。根据我的经验，首先，你需要完美地学习这些；因此，为了实现这一重要目标，你必须尽可能在纸上进行练习，并记录与不同系统相关的对象的本质属性和行为，直到变得精通。不要害怕在大型系统上尝试，因为这完全`通过将庞大结构的组件分解为小组件`来实现；通过这种方式，有助于你在对象设计方面获得良好的技能水平。


    # 对象的属性


    `properties of an object`（对象的属性）是与对象的一系列特征，能够精确地描述它。例如，将人看作一个对象，他/她有许多不同的特征，如眼睛颜色、身高、体重以及描述人的许多其他参数，这些都被称为
    `properties of a human.`。


    # 行为


    除了`properties` 外，对象内部还有一系列动作，被称为 `Behaviors`（行为）。让我们快速澄清这一点：如果我们把人看作一个对象；我们可以说“人类可以行走，或人类可以看”，这些都是对象（人）可以执行的
    `Behaviors`。


    # 方法


    事实上，方法是使用对象函数的方式。让我们用一个例子来拆解它。想象手机手机作为一个对象，这个对象（手机）内部有一个方法称为 `displaying numbers`（显示数字），它会在你的手机屏幕上显示所按的数字。所以，从技术上讲，当手机键盘上按下
    `1` 时，这个按钮会调用 `displaying numbers` 方法并发送 `1` 给它，最终，该方法会在屏幕上显示 `1`。如果这还不足够清楚，不要担心，稍后我们将通过实际操作在概念上理解它。


    # 字段


    一个 `field`（字段）是一个普通变量，可以携带不同类型的数据，并被认为是 `class` 的成员。它在 `class` 中声明，并使用 `set` 或
    `get` 访问器来设置或获取任何值。


    # 访问器


    简单来说，`set` 和 `get` 是属性，允许程序员为 `class` 中的字段设置或从字段中获取值。我们将在实践练习部分复习它。


    # 命名空间


    一个 `class` 可以包含大量成员，而 `namespace`（命名空间）内部可以包含许多 `classes`。`Namespaces` 包含了不同的预定义
    `classes`，让程序员将其用于不同的用途。例如，在 `.NET` 框架中，有一个 `namespace` 包含了连接到数据库（如 `SQL`、`Oracle
    DB` 等）所需的类。


    # 类的概念


    事实上，如果不把 `class` 作为原则，对象就毫无意义。让我们解释得更清楚一些：`class` 在这里扮演父类角色，涵盖了从变量到属性、行为、方法等所有内容。换句话说，`class`
    由一套为了实现特定目标而设计的规则组成，但为了使其适用，我们必须创建它的副本，这被称为 `Instantiation`（实例化）；通过这种方式，字面意思是，你`从一个类创建了一个对象`。

