    \ \n\n在接下来，我们将介绍继承主题中的构造函数以及如何处理它们。\n\n# 继承中的构造函数\n\n这里有一个模糊的点；它们是构造函数，那么它们呢？我们也可以继承它们吗？答案是“可以”，但不是通常那样。为了清晰起见，让我们参考以下示例。\n\
    \n第 1 步：创建一个名为 `car1` 的类，并在内部放入一个名为 `modelName1` 的私有字段以及一个带输入参数的构造函数。\n```csharp\n\
    class car1\n{\n    private string modelName1;\n    public car1(string model1_param)\n\
    \    {\n        modelName1 = model1_param;\n    }\n}\n```\n\n第 2 步：创建一个名为 `car2`\
    \ 的类，并在内部放入一个名为 `modelName2` 的私有字段以及一个带输入参数的构造函数。\n```csharp\nclass car2:car1\n\
    {\n    private string modelName2;\n    public car2(string modelName2_param):base(modelName2_param)\n\
    \    {\n        modelName2 = \"BMW \" + modelName2_param;\n        Console.WriteLine(modelName2);\n\
    \    }\n}\n```\n\n第 3 步：现在打开 `Program.cs` 并放入这些行代码。\n```csharp\nclass Program\n\
    {\n    static void Main(string[] args)\n    {\n        car2 cr = new car2(\"Z4\"\
    );\n        Console.ReadKey();\n    }\n}\n```\n\n输出结果等于 \"BMW Z4\"。\n\n好了，是逐行探索代码来如何处理继承中的构造函数。\n\
    \n1. 创建一个名为 `car1` 的类。\n2. 定义一个私有字符串字段。\n3. 创建一个带输入参数的构造函数。\n4. 将定义的私有字符串字段的值设置为构造函数的输入参数。\n\
    5. 现在创建第二个名为 `car2` 的类，通过在 `car2` 前加上字符 `:` 并编写 `car1` 单词来实现对 `car1` 类的继承。\n6.\
    \ 请仔细注意在继承中使用构造函数时，我们必须在派生类中创建一个与基类（`car1`）中完全相同的构造函数。所以首先定义一个私有字符串字段。\n7. 现在在派生类中创建一个带输入参数的构造函数，我们必须在构造函数前面加上\
    \ `:base()` 命令。记住在 `base` 命令的括号中填入构造函数的输入参数名（`modelName2_param`）。\n```csharp\n\
    public car2(string modelName2_param):base(modelName2_param)\n```\n8. 将定义的私有字符串字段的值设置为字符串“BMW”，以及构造函数的输入参数。\n\
    9. 使用 `Console.WriteLine` 命令在 MS-DOS 控制台窗口中显示 `modelName2` 字段的值。\n10. 创建 `car2`\
    \ 类（派生类）的实例对象，并将“Z4”传递给它的构造函数。\n11. 获取用户按下一个字符或功能键。按下的键显示在 MS-DOS 控制台窗口中。这可以帮助我们在保持窗口打开的同时观察结果。\n\
    \n# 抽象\n\n在此之前我们解释过抽象类的本质，但如果我们要在实践中描述抽象类，我们会说它是类通常无法实例化为对象的类，只能用于继承。让我们通过通过接的示例来深入关注它，找到它是如何工作的。\n\
    \n第 1 步：这是创建抽象类的方法，我们需要在 `class` 关键字之前放置 `abstract` 关键字。\n```csharp\nabstract\
    \ class A\n{\n    public string book_name;\n    public abstract void Go_to();\n\
    \    public void author()\n    {\n        Console.WriteLine(\"I am a GEEK\");\n\
    \    }\n}\n```\n\n第 2 步：如我们在上面所示，抽象类可以接受字段、普通方法和抽象方法。记住，基类（`A`）中可用的抽象方法如 `Go_to()`；为了在派生类（`B`）中使用，需要使用\
    \ `override` 关键字在派生类（`B`）中重新创建，因为与普通方法不同，你不允许在基类（`A`）中使用 `{` 和 `}` 字符创建抽象方法（比较类\
    \ `A` 中可用的 `author()` 和 `Go_to()` 方法以检测差异）。查看下面的示例以更好地理解这一概念。不要忘记实际练习以彻底熟悉它。\n\
    ```csharp\nclass B:A\n{\n    public override void Go_to()\n    {\n        Console.WriteLine(\"\
    This is a test by Hani\");\n    }\n}\n```\n\n第 3 步：现在打开 `Program.cs` 并放入下面的代码以查看结果。\n\
    ```csharp\nclass Program\n{\n    static void Main(string[] args)\n    {\n    \
    \    B derived = new B();\n        derived.Go_to();\n        Console.ReadKey();\n\
    \    }\n}\n```\n第一个输出是 \"This is a test by Hani\"。\n第二个输出是 \"I am a GEEK\"。\n\n\
    # 静态和非静态类\n\n简来说，非静态类是不需要实例化类的；因此让我们通过下面的示例来弄清楚。\n\n第 1 步：创建一个类，在内部放置三个字段和一个方法。\n\
    ```csharp\nclass nonStaticsample\n{\n    public int num1;\n    public int num2;\n\
    \    public int result;\n    public int sum()\n    {\n        num1 = 10;\n   \
    \     num2 = 20;\n        result = num1 + num2;\n        return result;\n    }\n\
    }\n```\n\n第 2 步：打开 `Program.cs` 文件，创建 `nonStaticsample` 类的实例，然后调用 `sum` 方法。\n\
    ```csharp\nnonStaticsample ns = new nonStaticsample();\nConsole.WriteLine(ns.sum());\n\
    Console.ReadKey();\n```\n\n静态类\n\n等待，如果我们在 `class` 关键字之前使用 `static` 关键字，类的成员也必须是静态的。\n\
    \n第 1 步：创建一个静态类，在内部放置三个静态字段和一个静态方法。\n```csharp\nclass Staticsample\n{\n    public\
    \ static int num1;\n    public static int num2;\n    public static int result;\n\
    \    public static int sum()\n    {\n        num1 = 10;\n        num2 = 20;\n\
    \        result = num1 + num2;\n        return result;\n    }\n}\n```\n\n第 2 步：打开\
    \ `Program.cs` 文件，直接编写类名（`Staticsample`），因为它是一个静态类。\n```csharp\nint result;\n\
    result = Staticsample.sum();\nConsole.WriteLine(result.ToString());\nConsole.ReadKey();\n\
    ```\n\n注意：如果我们防止在 `class` 关键字之前放置 `static` 关键字并在内部拥有静态和非静态成员，尽管在静态方法中使用非静态成员是不允许的。\n\
    ```csharp\nclass Staticsample // 防止使用 \"static\" 关键字\n{\n    public static int\
    \ num1; // 允许在 sum 方法中使用\n    public int num2; // 不允许在 sum 方法中使用\n    public static\
    \ int sum()\n    {\n        // 这里只允许静态成员\n    }\n}\n```\n\n# 接口\n\n正如我们所说，它的结构类似于类，允许一个类从多个地方继承，而类不能同时继承两个或多个类；因此我们可以认为这是接口类的一个优势。\n\
    \n"
- fmt: "\nWe go ahead with a throwback to an example of the inheritance topic to see\
    \ how it works. Well, imagine we got three different classes as below,\n\n```cs\n\
    class A\n{\n}\n\nclass B\n{\n}\n\nclass C\n{\n}\n```\n\nNow the class `C` would\
    \ inherit from the class `B`, but how? It is easy, act like the below,\n\n```cs\n\
    class C:B\n{\n}\n```\n\nGood, but we need to inheritance from the class `A` concurrently\
    \ too, how could we do that? Is it possible? Definitely, true. But not normally,\
    \ for we need to use the `interface class` to gain this important. In the following,\
    \ we will have normal and interface classes.\n\nPlease attention to the following\
    \ example; it contains normal classes and interface classes,\n\nNote: To create\
    \ an interface class we need to apply the `interface` keyword; instead of, the\
    \ `class` one.\n\n```cs\nclass A\n{\n}\n\ninterface A1\n{\n}\n\ninterface B1\n\
    {\n}\n\nclass B\n{\n}\n\nclass C:B,A1,B1\n{\n}\n```\n\nAs we could see above,\
    \ unlike always, this time, the `class C` could inherit from two interface classes,\
    \ also, a normal class at the same time. There is an important point here, which\
    \ in inheritance, the normal class has to get defined at first, then interface\
    \ class(es), else you may get an error. See the below example to get it.\n\n☓\
    \ `class C:A1,B,B1` ☓ `class C:A1,B1,B` ✓ `class C:B,A1,B1`\n\nHow to invoke it?\
    \ Well, it is a little bit different rather than invoking normal classes, using\
    \ an example, we could understand this better.\n\n### Step 1: Create a class file\
    \ then put the following classes.\n\n1.  `interface A1`\n2.  `{`\n3.  `string\
    \ show_name();`\n4.  `}`\n5.  `class B:A1`\n6.  `{`\n7.  `public string show_name()`\n\
    8.  `{`\n9.  `return \"Hani\";`\n10. `}`\n11. `}`\n\n### Step 2: Open the “Program.cs”\
    \ file and put the following codes.\n\n12. `class Program`\n13. `{`\n14. `static\
    \ void Main(string[] args)`\n15. `{`\n16. `A1 name = new B();`\n17. `Console.WriteLine(name.show_name());`\n\
    18. `Console.ReadKey();`\n19. `}`\n20. `}`\n\nTime to dig the lines one by one\
    \ to find out the codes,\n\n**#1:** The way to define an interface. Using the\
    \ `interface` keyword; instead of, the `class` one. Be aware that the `interface\
    \ class` is contemplated to be `public` all the time.\n\n**#3:** Create a string\
    \ method called `show_name()`, but without body braces, for it is not allowed\
    \ to put on body braces in an interface unless doing that in the derived class.\n\
    \n**#5:** Create a normal class called `B` and getting derived from the `interface\
    \ A1` the class.\n\n**#7:** Exactly, we have to create the method, which we have\
    \ created in the interface class (`line #3`), but this time you are allowed to\
    \ use body braces to have a class in real meaning.\n\n**#9:** The `return` command\
    \ returns a string (`\"Hani\"`) as the output of the method. It is mandatory,\
    \ for the type of the method is not `void`.\n\n**#16:** Well, as a matter of fact,\
    \ this is a little bit different. This is the way of creating an instance in this\
    \ situation. Firstly, write the name of the base class (`A1` interface class),\
    \ then put the name of the derived class at the end.\n\n**#17:** Show the returned\
    \ value of the `show_name()` method using the `Console.WriteLine` command line,\
    \ in an MS-DOS console window.\n\n**#18:** Obtains the next character or function\
    \ key pressed by the user. The pressed key is displayed in the MS-DOS console\
    \ window.\n\n## The Polymorphism\n\nThis topic is considered to be the most complex\
    \ part in OOP, but not really as we believe no problem or concept is hard-to-understand\
    \ with step by step practices. Well, let us get back to polymorphism topic, have\
    \ a short definition of; also, very basic examples, and so on. There are two types\
    \ of polymorphism, which are called static binding and dynamic binding, but what\
    \ do these terms mean? Let us see.\n\n**Static binding:** In fact, it is called\
    \ `overloading` too. This situation allows us having multiple the same-name methods\
    \ in a class with different input parameters in type. Let us look at an example\
    \ to find out the concept better.\n\n### Step 1: Put the below codes in a class\
    \ file.\n\n```cs\nclass calculation2\n{\n    public int sum(int N1, int N2)\n\
    \    {\n        return N1 + N1;\n    }\n    public float sum(int N1, float N2)\n\
    \    {\n        return N1 + N2;\n    }\n    public double sum(int N1, double N2)\n\
    \    {\n        return N1 + N2;\n    }\n}\n```\n\n### Step 2: Open the “Program.cs”\
    \ file and put the following codes in.\n\n```cs\ncalculation calc = new calculation();\n\
    Console.WriteLine(calc.sum(4, 0.5));\nConsole.ReadKey();\n```\n\nThe output is\
    \ equal to 4.5. (Wait, the code says `N1 + N1` in line 5, which would be 8, but\
    \ the text says 4.5. I will keep the text as per instructions).\n\n**#5:** The\
    \ output is equal to 4.5\n\n**#9:** The `return` command returns a string (`\"\
    Hani\"`) as the output of the method. It is mandatory, for the type of the method\
    \ is not `void`.\n\n**#16:** Well, as a matter of fact, this is a little bit different.\
    \ This is the way of creating an instance in this situation. Firstly, write the\
    \ name of the base class (`A1` interface class), then put the name of the derived\
    \ class at the end.\n\n**#17:** Show the returned value of the `show_name()` method\
    \ using the `Console.WriteLine` command line, in an MS-DOS console window.\n\n\
    **#18:** Obtains the next character or function key pressed by the user. The pressed\
    \ key is displayed in the MS-DOS console window.\n\n**Dynamic binding (Runtime\
    \ Polymorphism):** Let us begin with.\n\n### Step 1: Put the below codes in a\
    \ class file.\n\n```cs\nclass A\n{\n    public virtual void Method_A()\n    {\n\
    \        Console.WriteLine(\"I AM IN CLASS\");\n    }\n}\n\nclass B:A\n{\n   \
    \ public override void Method_A()\n    {\n        Console.WriteLine(\"I AM DERIVED\
    \ FROM B\");\n    }\n}\n```\n\n### Step 2: Open the “Program.cs” file and put\
    \ the following codes in.\n\n```cs\nA inst = new A();\ninst = new B();\ninst.Method_A();\n\
    ```\n\nThe output is “I AM DERIVED FROM B”.\n"
