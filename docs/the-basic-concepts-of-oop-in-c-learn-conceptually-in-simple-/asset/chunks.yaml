  trans: "\n\n属性（Property）是一种提供灵活机制的成员，用于读取、写入或计算私有字段的值。属性可以像公共数据成员一样被使用。属性封装了私有字段。它提供了\
    \ getter（`get{}`）来检索底层字段的值，以及 setter（`set{}`）来设置底层字段的值。\n\n#继承\n\n继承在面向对象编程（OOP）范式中起着主要作用。我们应该尽可能地练习这种技术，如果我们这样做，可以很有把握地成为\
    \ OOP 大师。为了更好地理解这个概念，让我们想象一下：从出生开始，孩子从父母那里继承属性，例如眼睛颜色、头发颜色、肤色、特殊行为等等。OOP 范式中也是如此，但如何实现呢？当我们设计一个实体时，可以将一个类视为父类，实体可以从父类继承一切。继此，就会实现代码的可重用，实体可以继承必要的属性；而不是编写大量的代码，从而减少了代码量并实际上提高了效率。\n\
    \n# 接口\n\n它与类相似，但正如你可能已经意识到的，与类不同，类不能同时继承两个或多个类，但接口可以无限制地被多次继承，因此我们将在“实际练习”部分尝试一个简单的示例，找出它是如何工作的。\n\
    \n# 多态性\n\n我们中的许多人对多态感到困扰，我们总是建议他们：“尽管完美地学习了‘继承’，但非常建议通过非常基础的示例来轻松找到该概念。”\n\n\
    我们将讨论多态，并在实际部分尝试基础练习。想象一个办公室，在办公室里：有一位经理、一名办事员和一个秘书，他们的办公室进口了电脑设备。好了，为办事员（clerk）定义了一个类，里面定义了不同的方法，例如“注销（Log\
    \ out）”、“登录（Log in）”、“支付（Payment）”和“职责（Duty）”。请注意下方“办事员”类中定义的方法的行为。\n\n### 办事员方法的行为\n\
    \n- `Log in`: 此方法记录进入办公室的时间。\n- `Log out`: 此方法记录离开办公室的时间。\n- `Payment`: 此方法记录每月\
    \ 900 美元的默认月薪。\n- `Duty`: 此方法记录办事员是否与出口商交过话？\n\n好了，这个方法对办事员来说非常有效，但现在，我们还需要为经理（manager）也定义一个类。我们需要做的是从“办事员”继承一个类并进行细小的更改，因为办事员和经理的行为并不完全相同。因此，请注意下方继承后“经理”类中定义的每个方法的行为。\n\
    \n### “经理”方法的行为\n\n- `Log in`: 此方法记录进入办公室的时间。\n- `Log out`: 此方法记录离开办公室的时间。\n-\
    \ `Payment`: 此方法记录每月 3000 美元的默认月薪。\n- `Duty`: 此方法记录经理是否签署了信件？\n\n太棒了，我们希望读者能理解。我们做了什么？很简单，我们通过继承“办事员”类创建了一个名为“经理”的新类，由于这两个类所需的所需的行为并不完全相同，我们确实在“经理”类的\
    \ `Payment` 和 `Duty` 方法中提交了修改。\n\n# 实际练习\n\n## 如何创建一个类\n\n打开 Visual Studio 软件，然后点击\
    \ **File（文件）** **New（新建）** **Project（项目）** **Visual C#** **Console Application（控制台应用程序）**，更改项目名称和位置（可选）后，点击“OK（确定）”按钮。（图\
    \ 1）\n\n![Image](img/Untitled-2.png)\n图 1\n\n![Image](img/Untitled-2-1.png) 太棒了，我们需要向项目中添加一个类，在解决方案管理器窗口中找到项目名称，对其右键点击并按照以下操作：Add\
    \ Class（添加类）。（图 2）\n图 2\n\n很好，将打开一个如下所示的新窗口，包含不同的项目，但我们需要的是“class（类）”项目，因此首先点击“Visual\
    \ C# Items”，然后选择“Class（类）”。\n\n最后，也可以更改类的名称，然后点击“Ok（确定）”按钮创建它。（图 3）\n\n![Image](img/Untitled-2-2.png)\
    \ 是的，我们做到了。我们可以成功地向项目添加类文件。现在，我们可以双击它来打开文件并开始创建不同的类。\n图 3\n图 3\n\n## C# 中类的声明\n\
    \n`[Access modifier][`class` keyword][ClassName]`*\n\n仔细考虑，“访问修饰符”你需要替换为下面提到的项，\n\
    \n- `public`: 该类型或成员可以被同一程序集的任何其他代码或引用该程序的另一个程序集的代码访问。\n- `internal`: 该类型或成员可以被同一程序集的任何代码访问，但不能从另一个程序集访问。\n\
    \n在 `[Access modifier]` 之后，你**必须**放置 `class` 关键字，然后为你的类命名，请查看下面的示例了解它是如何工作的。（使用访问修饰符是可选的）。\n\
    \n**注意：** 如果未指定访问修饰符，默认是“Internal”。\n\n```csharp\npublic / internal class Customer\n\
    {\n    // 代码写在这里……\n}\n```\n\n所以，尝试在 C# 中创建一个类来查看它是如何工作的；然而，这是至关重要的。\n\n# C# 中方法的声明\n\
    \n`[Access modifier][Return type]Method Name`\n\n好了，方法定义在类内部，为此，首先我们需要一个类。假设我们有一个名为\
    \ `math_operation` 的类，我将在里面创建一个 `sum` 方法。在一切之前，让我们解释一下下方的声明元素。\n\n在 `Access modifier`\
    \ ，你可以替换下面提到的项：\n\n- `public`: 该类型或成员可以被同一程序集的任何其他代码或引用该程序的另一个程序集的访问。\n- `private`:\
    \ 该类型或成员仅可以被类内部的代码访问。\n- `protected`: 该类型或成员可以被类内部代码或其派生类的代码访问。\n- `internal`:\
    \ 该类型或成员可以被同一程序集中的任何代码访问，但不能从另一个程序集访问。\n- `protected internal`: 该类型或成员可以被其声明程序集中的任何代码或来自另一个程序集的派生类的代码访问。\n\
    - `private protected`: 该类型或成员仅可以被其声明程序集内的类或其派生类的代码访问。\n\n对于 `return type`，如果方法返回任何值，你必须编写数据类型，例如\
    \ `int`、`string` 等。否则，返回类型为 `void`，我们需要应用 `void` 关键字。\n\n**注意：** 如果用 `void` 关键字替代\
    \ `return type`，你不需要在方法体内编写 `return` 关键字，但如果你在 `return type` 中使用了任何数据类型，则需要使用\
    \ `return` 关键字。\n\n在 `Method name` 方面，你需要为你的方法设置一个**唯一标识符**与其他标识符区分，记住，它是区分大小的。\n\
    \n在 `Parameter list`（即在两个括号之间），你可以插入不同类型的变量作为方法的**输入**和**输出**。\n\n好了，回到示例，假设我们有一个名为\
    \ `math_opration` 的类，它包含一个名为 `sum` 方法，该方法使用两个参数接收两个数字。请考虑这些元素和它的工作方式。（图 4）。\n\n\
    ![Image](img/5.png)\n图 4\n图 4\n\n"
