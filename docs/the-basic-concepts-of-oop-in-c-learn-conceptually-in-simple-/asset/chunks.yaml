    winner of the Field medal in 2014\. She  is a light in the way of doing scientific
    investigations, perseverance, and dignity for us.


    Hani Marzban, January 19, 2019


    # Introduction


    Maybe readers have heard about “Object-Oriented,” or have heard that this could
    be the hardest-to-understand concept in  programming  especially if you are a
    newbie in this or having a plan to get into the community of coders? So, we assure
    that this is hard no more.


    However, this could be true at the beginning of programming age, but fortunately
    it has become pretty much easier and understandable more than ever with the advent
    of HLL^([¹](#index_split_004.html_note_1 "1")) of programming such as C, C++,
    C#^([²](#index_split_005.html_note_2 "2")), Visual Basic, and etcetera., which
    helped programmers to comprehend the main concept of OOP^([³](#index_split_006.html_note_3
    "3"))  paradigm  more,  like never before.


    Well, there are benefits for the programmers using OOP paradigm, such as having
    a high-performance piece of codes, re-usability, which is considered to be a principle
    in OOP and literally as the foundation of OOP. Debugging codes are easy to do,
    so this way, the audience will not get involved with tons of complex lines of
    codes and also developing and modification of codes are easy to deal with, too.


    Ultimately, in this book, we will have a closer look at the OOP paradigm in practice
    using C# language, and surely by relying on different examples, achieving a high
    level of ability in OOP paradigm will become true. Do not forget that “practice
    is the key.” We wish dear readers all the success in this.


    # The concept of an object


    Whatever we see, whatever we feel or even imagine in the real world is counted
    as an object. Usually, we work with different types of objects in the daily life,
    such as Computers, Mobile phones, Televisions, and etcetera. So, it is the same
    in the world of the computer. As an instance, OS^([⁴](#index_split_007.html_note_4
    "4")) applications are called objects like, media players, toolbars, buttons,
    windows and what we could observe, these are the visible objects; on the other
    hand, there are hidden objects too, we cannot see, but they are working behind
    the scene, technically, a bunch of codes letting visible objects to run and be
    controlled. Each object as an entity contains two main factors, “**properties**”
    and “**behaviors**,” which I will describe them later. So, for now, let us clear
    the definition of an object using an example.


    Firstly, before creating an object, we need to analyze the essential **properties**
    and **behaviors** of an object. Imagine we have a plan to build software for managing
    a library, so surely after analyzing the needs, for example, we find primary **objects**
    in which to implement as below.


    1-Members of the library


    2-Operators of the library


    3-Category of book


    4-Book


    Great, so, the next step is recognizing related **properties** and **behaviors**;
