  trans: "\n\n让我们回顾一个关于继承主题的示例，来看看它是如何工作的。比如，假设我们有如下三个不同的类：\n\n```cs\nclass A\n{\n\
    }\n\nclass B\n{\n}\n\nclass C\n{\n}\n```\n\n现在类 `C` 将继承类 `B`，但如何实现呢？这很简单，像下面所示操作：\n\
    \n```cs\nclass C:B\n{\n}\n```\n\n很好，但我们需要同时继承类 `A`，我们该怎么做呢？这可行吗？肯定的。但通常情况下，因为我们需要使用\
    \ `interface class`（接口类）来实现这一重要功能。在接下来，我们将普通类和接口类。\n\n请注意以下示例；它包含了普通类和接口类。\n\n\
    注意：要创建一个接口类，我们需要应用 `interface` 关键字；而不是 `class` 关键字。\n\n```cs\nclass A\n{\n}\n\n\
    interface A1\n{\n}\n\ninterface B1\n{\n}\n\nclass B\n{\n}\n\nclass C:B,A1,B1\n\
    {\n}\n```\n\n正如我们在上面看到的，与以往不同，这次 `class C` 可以同时继承两个接口类和一个普通类。这里有一个关键点，在继承中，普通类必须先定义，然后是接口类，否则你可能会得到错误。请看下面的示例以理解。\n\
    \n☓ `class C:A1,B,B1` ☓ `class C:A1,B1,B` ✓ `class C:B,A1,B1`\n\n如何调用它呢？嗯，这与调用普通类略有不同，通过示例我们可以更好地理解这一点。\n\
    \n### 步骤 1：创建一个类文件，然后放入以下类。\n\n1.  `interface A1`\n2.  `{`\n3.  `string show_name();`\n\
    4.  `}`\n5.  `class B:A1`\n6.  `{`\n7.  `public string show_name()`\n8.  `{`\n\
    9.  `return \"Hani\";`\n10. `}`\n11. `}`\n\n### 步骤 2：打开“Program.cs”文件并放入以下代码。\n\
    \n12. `class Program`\n13. `{`\n14. `static void Main(string[] args)`\n15. `{`\n\
    16. `A1 name = new B();`\n17. `Console.WriteLine(name.show_name());`\n18. `Console.ReadKey();`\n\
    19. `}`\n20. `}`\n\n现在是逐行分析代码以寻找含义了：\n\n**#1:** 定义接口的方法。使用 `interface` 关键字；而不是\
    \ `class` 关键字。请注意，`interface class` 始终认为是 `public`（公共）的。\n\n**#3:** 创建一个名为 `show_name()`\
    \ 的字符串方法，但没有大括号体，因为在接口中不允许放置大括号体，除非在派生类中这样做。\n\n**#5:** 创建一个名为 `B` 的普通类，并派生自类\
    \ `A1`。\n\n**#7:** 确确实，我们必须创建在接口类中已经创建过的方法（第 #3 行），但这次你被允许使用大括号体来使类具有实际的意义。\n\n\
    **#9:** `return` 命令返回一个字符串（`\"Hani\"`）作为方法的输出。这是强制性的，因为方法的类型不是 `void`。\n\n**#16:**\
    \ 嗯，事实上，这有一点不同。这是在这种情况下创建实例的方法。首先，编写基类（`A1` 接口类）的名称，将派生类的名称放在末尾。\n\n**#17:** 使用\
    \ `Console.WriteLine` 命令行在 MS-DOS 控制台窗口中显示 `show_name()` 方法的返回值。\n\n**#18:** 获取用户按下的下一个字符或功能键。按下的键将显示在\
    \ MS-DOS 控制台窗口中。\n\n## 多态\n\n这个主题被认为是 OOP（面向对象编程）中最复杂的部分，但实际上并不像我们想象的那样，通过循序渐进的实践，没有任何问题或概念是难以理解的。好了，让我们回到多态主题，有一个简短的定义；以及非常基础的示例等等。多态有两种类型，称为静态绑定和动态绑定，但这些术语是什么意思呢？让我们来看看。\n\
    \n**静态绑定：** 实际上，它也被称为 `overloading`（重载）。这种情况允许我们在类中拥有多个同名但输入参数类型不同的方法。让我们看一个示例来更好地理解这个概念。\n\
    \n### 步骤 1：在类文件中放入以下代码。\n\n```cs\nclass calculation2\n{\n    public int sum(int\
    \ N1, int N2)\n    {\n        return N1 + N1;\n    }\n    public float sum(int\
    \ N1, float N2)\n    {\n        return N1 + N2;\n    }\n    public double sum(int\
    \ N1, double N2)\n    {\n        return N1 + N2;\n    }\n}\n```\n\n### 步骤 2：打开“Program.cs”文件并放入以下代码。\n\
    \n```cs\ncalculation calc = new calculation();\nConsole.WriteLine(calc.sum(4,\
    \ 0.5));\nConsole.ReadKey();\n```\n\n输出等于 4.5。（等等，代码第 5 行写的是 `N1 + N1`，结果本是 8，但文本说是\
    \ 4.5。我将按照指令保留文本）。\n\n**#5:** 输出等于 4.5\n\n**#9:** `return` 命令返回一个字符串（`\"Hani\"\
    `）作为方法的输出。这是强制性的，因为方法的类型不是 `void`。\n\n**#16:** 嗯，事实上，这有一点不同。这是在这种情况下创建实例的方法。首先，编写基类（`A1`\
    \ 接口类）的名称，将派生类的名称放在末尾。\n\n**#17:** 使用 `Console.WriteLine` 命令行在 MS-DOS 控制台窗口中显示\
    \ `show_name()` 方法的返回值。\n\n**#18:** 获取用户按下的下一个字符或功能键。按下的键将显示在 MS-DOS 控制台窗口中。\n\
    \n**动态绑定（运行时多态）：** 让我们开始。\n\n### 步骤 1：在类文件中放入以下代码。\n\n```cs\nclass A\n{\n    public\
    \ virtual void Method_A()\n    {\n        Console.WriteLine(\"I AM IN CLASS\"\
    );\n    }\n}\n\nclass B:A\n{\n    public override void Method_A()\n    {\n   \
    \     Console.WriteLine(\"I AM DERIVED FROM B\");\n    }\n}\n```\n\n### 步骤 2：打开“Program.cs”文件并放入以下代码。\n\
    \n```cs\nA inst = new A();\ninst = new B();\ninst.Method_A();\n```\n\n输出是 “I AM\
    \ DERIVED FROM B”。\n\n"
