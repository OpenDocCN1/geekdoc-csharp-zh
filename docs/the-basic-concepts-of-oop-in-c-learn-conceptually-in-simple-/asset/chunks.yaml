    **#3:** 在结构体中定义一个字符串字段（记住，你不能在结构体内部为该字段赋值，你可以定义它，这是一个规则，我提前说明了）。


    **#9:** 是时候创建一个 `information` 结构体的实例了。所以，我们需要的是先写结构体的名称，然后写对象的名称。


    **#10:** 好了，现在我们可以从这里为结构体中定义的字段赋值。


    # “引用类型 (Reference Type)” 与“值类型 (Value type)”


    `class` 和 `struct` 之间存在着基础且显著的差异，我们之前提到过。我们应该意识到 `class` 是“引用类型”，而 `struct` 是“值类型”。这意味着什么呢？让我们通过下方的示例来更清楚地理解。


    请注意这段代码；这是一个类的示例，我们需要猜测输出结果。


    ```

    1-ProgrammingClass student1=new ProgrammingClass ();

    2-student1.score = 20;

    3-ProgrammingClass student2 = student1;

    4-student2.score = 19;

    5-Console.WriteLine (student1.score.ToString ());

    ```


    是的，输出等于“19”，而不是“20”，但为什么不是“20”呢？这是因为它是引用类型，让我们逐行探索以发现更多信息。


    **#1:** 创建一个名为 `ProgrammingClass` 的类的实例对象 `student1`，该类包含一个名为 `score` 的字段。


    **#2:** 在 `score` 字段中设置值为 `20`。


    **#3:** 创建另一个名为 `student2` 的 `ProgrammingClass` 实例对象，并将其赋值为对象 `student1`。请注意，这样做，这两个对象（`student1`
    和 `student2`）将链接在一起，它们的值不会相互拷贝；反之，作为一个实例，如果你更改了 `student2` 中可用的 `score` 字段的值，那么
    `student1` 中存在的 `score` 字段的值将被替换为与 `student2` 相同的值。这就是“引用类型”的简单含义。


    **#4:** 在 `student2` 存在的 `score` 字段中设置值为 `19`。


    **#5:** 在 MS-DOS 控制台窗口中使用 `Console.WriteLine` 命令显示 `student1` 中可用的 `score` 字段的值。


    这就是“引用类型”的概念。现在让我们来看一个结构体的示例，以理解“值类型”的感觉。


    ```

    1-ProgrammingStruct student1 ();

    2-student1.score = 20;

    3- ProgrammingStruct student2 = student1;

    4-student2.score = 19;

    5-Console.WriteLine (student1.score.ToString ());

    ```


    与类不同，这次输出等于“20”，而不是“19”。原因是因为它是值类型，让我们逐行查看它是如何工作的。


    **#1:** 创建一个名为 `ProgrammingStruct` 的结构体的实例对象 `student1`，它包含一个名为 `score` 的字段。（记住，创建结构体实例时不需要
    `new` 关键字）。


    **#2:** 在 `score` 字段中设置值为 `20`。


    **#3:** 创建另一个名为 `student2` 的 `ProgrammingStruct` 实例对象，并将其赋值为对象 `student1`。请注意，这样做，这两个对象（`student1`
    和 `student2`）将链接在一起，它们的值不会相互拷贝；反之，作为一个实例，如果你更改了 `student2` 中可用的 `score` 字段的值，那么
    `student1` 中存在的 `score` 字段的值将被替换为与 `student2` 相同的值。这就是“引用类型”的简单含义。


    **#4:** 在 `student2` 存在的 `score` 字段中设置值为 `19`。


    **#5:** 在 MS-DOS 控制台窗口中使用 `Console.WriteLine` 命令显示 `student1` 中可用的 `score` 字段的值。此外，这也是“值类型”的概念。


    # 继承 (Inheritance)


    面向对象编程（OOP）范式中的“继承”与现实世界的意思相同。它是最重要、有趣且应用的概念之一。首先，让我们通过一个示例来仔细观察。假设我们有两个不同的类：


    ```

    步骤 1：在这里创建类“First”，并在内部放入两个方法（一个私有，一个公共），我们也实现了两个字段（一个私有，一个公共）。


    步骤 2：创建一个名为“Second”的类，它继承“First”的成员。记住，现在“Second”类被认为是派生类，而“First”类被认为是基类。要进行继承，我们需要在创建派生类时在类名之间放置
    `:` 字符，查看最后以获取理解。

    ```


    很好，现在 `Second` 类继承了 `First` 类的所有内容。为了看到 `Second` 类实现的继承结果，尝试在 `Program.cs` 中创建
    `Second` 类的实例对象，看看我们得到了什么。


    似乎我们只得到了名为 `method1` 的方法和一个名为 `Name` 的字段，但其余部分呢？因为我们还有一个私有字段 `phoneNumber` 和名为
    `method2` 的方法。好了，我们必须意识到，除非我们将 `private` 访问修饰符改为 `protected`，否则私有成员不会被继承，然后你就可以在派生类中访问它们了。


    为了使用它，我们需要调用它。像往常一样在 `Program.cs` 中这样做。


