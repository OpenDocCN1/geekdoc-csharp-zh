    # Preface


    Researching in various areas of computer science has been the author’s most favorite
    work to do from a long time ago. This time he has decided to write a book about
    the preliminary topics in the object-oriented programming paradigm in C# programming
    language, which is considered to be one of the most popular ones thanks to the
    powerful “**Dot NET framework**.”


    This book helps interested audiences to get familiar with the basics of the object-oriented
    programming paradigm in C# faster, for he has written this book in the simplest
    possible language, used very simple examples; however, being a mid-level C#.Net
    developer is a prerequisite. Moreover, the author has **emboldened** and underlined
    important points too.


    Hence, expected that readers find this book useful, although, study without practical
    practice is worth nothing in programming; therefore, remember that “practice is
    the key.”


    Hopefully, to enjoy reading this book as much as the author enjoyed writing it,
    and please do not hesitate to send possible suggestions, corrections, and errors
