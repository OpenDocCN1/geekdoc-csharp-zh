    numbers” method and sends “1” to that, and ultimately, the method will show “1”
    on display. If it is not crystal clear enough, do not worry, later, we will work
    practically to get it conceptually.


    # The fields


    A fieldis a normal variable, which can carry different types of data, and are
    contemplated to be members of a class. It has declared in a class, and to set
    or get any values to use “**set**” or “**get**” **accessor**.


    # The Accessor


    In simple language, “**set**” and “**get**” are properties, which let the programmer
    set or get value(s) to or from a field in a class. We will review it in **practical
    exercises** **section.**


    # The Namespaces


    A class can carry tons of members, and a namespace can carry a lot of classes
    inside. **Namespaces** are containing different pre-defined classes, which let
    programmers use for variant purposes. For example, in .NET framework^([⁵](#index_split_008.html_note_5
    "5")), there is a namespace that contains necessary classes to connect to a database
    such as SQL, Oracle DB, and etcetera.


    # The concept of a Class


    Well, in fact, objects are nothing if we do not consider a class as a principle.
    Let us explain more clearly, a class plays a parent role here and encompasses
    everything from variables to properties, behaviors, methods, and etcetera. In
    other words, a class has made of a set of rules to achieve a unique goal, but
    to make it applicable; we have to create a copy of that, which is called “**Instantiation**”;
    by this, literally, you have **created an object from a class** that is usable
    in action.


    # The Concept of a struct


    The structure, and technically, the functionality of a struct is pretty much similar
    to a class, although s struct is more limited and could be contemplated to be
    a light version of a class. Well, in “**Practical exercises**” section, we will
    try a simple sample of the struct to find out the way it works, for practical
    example(s) it can help you get a better understanding too.


    # Differences between class and struct


    Within a struct declaration, fields cannot get initialized unless they get declared
    as const or static.


    A struct cannot declare a default constructor (a constructor without parameters).


    Structs get copied on assignment. When a struct has assigned to a new variable,
    all the data get copied, and any modification to the new copy does not change
    the data for the original copy. It is important to remember when working with
    collections of value types such as Dictionary.


    A struct is “value type,” and a class is “reference type.”


    Unlike classes, a struct gets instantiated without using “new” operator.


    Structs can declare constructors, which have parameters.


    A struct cannot inherit from another struct or class, and it cannot be the base
    of a class.


    A struct can implement interfaces.


    A struct can be used as a nullable type and can be assigned a null value.


    # The constructors


    Initializing data members of a new object is often the task of a constructor.
    When a class gets created, in fact, its constructor is called concurrently, too.
    Constructors have the same name as the class. There are different usages for constructors
    of which we prevent.


    # The destructors


    A destructor is the same in name with class and constructor, but there is a bold
    sign which distinguishes it from a constructor’s or a class’s name, and it is
    a “**~**” symbol that needs to get implemented as a prefix in the name of a destructor.
    So, what is the advantage of destructor? Well, it runs when the class runs and
    ends before the class ends; by this, **it cleans the finished class from memory,
    which results in managing memory**, although, this task is useful no more in programming
    languages equipped by garbage-collector^([⁶](#index_split_009.html_note_6 "6")),
    and also are not suitable to use in big projects too.


    # The re-usability


    One of the strong points in the OOP paradigm is, “**Re-usability.”** **It lets
    us use a single object “N” times to do “N” different tasks; instead of, using
    “N” different objects to do “N” different tasks,**  which results in **reducing
    the high volume of codes and increasing the execution speed of the codes dramatically**.


    In the direction of a deeper comprehension regarding the subject, see the example
    below.


    **Problem:** We need to print the names of 50 people from a database, which solution
    is preferred? Why?


    A) Creating **fifty** different objects to receive the names from the database
    and print them out.B) Creating **one** object to receive the names from the database
    and print them out.


    Definitely, the option “B” is the key answer, as **it helps reducing tons of repetitive
    codes, which leads to increasing the speed of execution; by which, the efficiency
    boosts like never before.**


    # The abstraction


    When you plan to write a program using OOP paradigm, firstly, you have to analyze
    a system thoroughly, it means you need to recognize all possible entities such
    as properties, behaviors, variables, and etcetera., take them into account, but
    sometimes to run a system working properly, all the suggested entities are not
    mandatory and we should prevent them.


    For example, we are going to buy a car, and we need to arrange a contract between
    the seller and us, so, it is natural  to write our personal information in it,
    but surely writing our blood type or the size of our shoes is not a must. These
    are the properties of us too, in which are not compulsory to mention.


    # The encapsulation


    Let us begin with an example, we have a mobile phone in hand, and we do make a
    call using it. Do we know the process by which the mobile phone does to make a
    call? Absolutely, not. We, as a user of the mobile phone press a few simple buttons
    to make a call instantly, but surely we are ignorant of the functions that the
    mobile phone runs behind the scene to make a connection. It is what we named as
    “**Encapsulation,” to hide function’s complexities of an object from the view
    of users** in simple language. There is no reason that a user sees how it works
    but the final consequence.


    # The Property'
