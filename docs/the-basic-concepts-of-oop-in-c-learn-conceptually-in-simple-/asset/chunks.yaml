    11- {


    12- Console.WriteLine("I AM DERIVED FROM B");


    13- }


    14- }


    Step 2: Open the “Program.cs” file and put the following codes in.


    15- A inst = new A();


    16- inst = new B();


    17- inst.Method_A();


    18- Console.ReadKey();


    The output is equal to “I AM DERIVED FROM B”.


    Time to see what happened really?


    **#1:** Create a class called **“A”**


    **#3:** Create a method called “**Method_A**”, but something is new here. It is
    the “**virtual**” keyword. If we create a method in a normal class and going to
    override it, we need to use “**virtual**” keyword.


    **#5:** Show the “I AM IN CLASS A” string in an MS-DOS console window using the
    “**Console.WriteLine”** command line.


    **#8:** Create a normal class called “**B**” and getting derived from the class
    A.


    **#10:** Now we **override** the created method in “**class A”** (**line #3**).


    **#12:** Show the “I AM DERIVED FROM B” string in an MS-DOS console window using
    the “**Console.WriteLine”** command line.


    **#15:** Now time to invoke the overridden method, here we create an instance
    called “**inst**” from the base class (**A**).


    **#16:** Put the created instance equal to the derived class (**B**).


    **#17:** Now, we can invoke the overridden method.


    **#18:** Obtains the next character or function key pressed by the user. The pressed
    key is displayed in the MS-DOS console window. In fact, it could help us observe
    the final consequence(s) while keeping the window opened.


