    # CHAPTER 2


    ## VARIABLES AND DATA TYPES


    In this chapter, we will discuss variables and data types in C#. These are fundamental
    concepts in programming that allow you to store and manipulate data in your programs.


    ### WHAT ARE VARIABLES?


    Variables are containers that hold data or values that can be used in your program.
    They are named locations in memory that store values of different data types.
    Variables can be changed during program execution and are used to hold values
    for calculations, comparisons, and data storage.


    ### DECLARING AND INITIALIZING


    Variables Before you can use a variable in your program, you must declare it.
    Declaring a variable is the process of reserving space in memory for that variable.
    You must specify the data type of the variable you are declaring.


    Here is an example of declaring a variable of type integer named "myNumber":


    ![Image](images/image2.png)


    In this example, we declare a variable called `myNumber` of type integer. The
    integer data type stores whole numbers such as -1, 0, 1, 2, 3, etc.


    Once you have declared a variable, you can initialize it with a value. Initializing
    a variable is the process of assigning an initial value to the variable.


    Here is an example of declaring and initializing a variable of type string named
    "myName":


    ![Image](images/image3.png)


    In this example, we declare a variable called `myName` of type `string` and initialize
    it with the value "John". The string data type stores text values such as "Hello",
    "World", etc.


    ### COMMON DATA TYPES IN C#


    C# supports several data types, each with its own set of values and operations.
    Here are some common data types in C#:


    * `int`: stores whole numbers, such as -1, 0, 1, 2, 3, etc.


    * `double`: stores floating-point numbers, such as 3.14, 5.5, 100.0, etc.


    * `bool`: stores true/false values, such as true or false.


    * `string`: stores text values, such as "Hello", "World", etc.


    * `char`: stores single characters, such as ''a'', ''b'', ''c'', etc.


    Here are some examples of declaring and initializing variables of different data
    types:


    ![Image](images/image4.png)


