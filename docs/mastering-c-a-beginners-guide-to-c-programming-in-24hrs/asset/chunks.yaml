    # 第 9 章


    ## 文件 I/O 与序列化


    在本章中，我们将涵盖 C# 中文件输入/输出（I/O）和对象序列化的基础。我们将学习如何使用流（streams）从文件读取和写入文件，以及如何将对象序列化到文件中并反之。


    ### 文件 I/O


    文件 I/O 是从磁盘上的文件读取和写入的过程。在 C# 中，我们可以使用 `FileStream` 类来处理文件。`FileStream` 对象提供了一个用于向文件读取或写入数据的流。


    若要从文件中读取内容，我们可以创建一个 `FileStream` 对象并使用它从文件中读取字节。例如，以下代码读取了文件内容并将其打印到控制台：


    ![Image](img/image56.png)


    在这个示例中，我们为文件 `file.txt` 创建了一个 `FileStream` 对象，并使用了 `FileMode.Open` 和 `FileAccess.Read`，这意味着我们想要打开文件进行读取。然后，我们创建一个字节数组来存放文件内容，并调用
    `FileStream` 对象的 `Read` 方法将字节读取到缓冲区。最后，我们关闭 `FileStream` 对象并将缓冲区的内容打印到控制台。


    若要向文件写入内容，我们可以创建一个 `FileStream` 对象并使用它将字节写入文件。例如，以下代码将一个字符串写入文件：


    ![Image](img/image57.png)


    在这个示例中，我们创建了一个字符串并使用 `Encoding.ASCII.GetBytes` 方法将其转换为字节数组。然后，我们为文件 `file.txt`
    创建了一个 `FileStream` 对象，并使用了 `FileMode.Create` 和 `FileAccess.Write`，这意味着如果文件不存在则创建它并打开进行写入。然后我们调用
    `FileStream` 对象的 `Write` 方法将字节写入文件。最后，我们关闭 `FileStream` 对象。


    ### 序列化


    序列化是指将对象转换为字节流的过程，该字节流可以存储在文件中或通过网络发送。反序列化是将字节转换回对象的逆过程。


    当我们需要将对象存储在持久化存储中或通过网络发送它们时，序列化和反序列化非常有用。例如，我们可以将对象序列化到文件，稍后将其反序列化以恢复其状态。


    要序列化一个对象，首先需要通过在其类定义上应用 `[Serializable]` 特性将其标记为可序列化的。然后，我们可以创建一个 `FileStream`
    对象并将其传递给 `BinaryFormatter` 对象以序列化该对象。这是一个示例：


    ![Image](img/image58.png)


    若要反序列化对象，我们可以从文件中读取字节并将其传递给 `BinaryFormatter` 对象的 `Deserialize` 方法。这是一个示例：


    ![Image](img/image59.png)


    除了二进制序列化，C# 还支持其他序列化格式，如 XML 和 JSON。要将对象序列化为 XML 或 JSON，我们可以分别使用 `XmlSerializer`
    和 `JsonSerializer` 类。


    ### 练习：


    1. 创建一个带有 `Name` 和 `GPA` 属性的 `Student` 类。

    2. 创建一个 `Student` 对象列表并添加一些示例数据。

    3. 使用二进制序列化将列表序列化到文件中。

    4. 从文件中反序列化列表并将其内容打印到控制台。


    # 第 10 章


    ## 调试技术


    调试是任何程序员都具备的一项重要技能，因为它允许你识别并修复代码中的错误。在本章中，我们将涵盖一些基础调试技术，帮助你追踪并修复 C# 程序中的错误。


    ### 使用断点


    调试最强大的工具之一是断点。断点是你放置在代码中的一个标记，它告诉调试器在某一点暂停执行。这允许你检查程序在那个时刻的状态，并查看发生了什么。


    要在 Visual Studio 中设置断点，只需点击想要设置断点的代码行侧的边距即可。会出现一个红点，表示已设置断点。当你以调试模式运行程序时，执行将在断点处停止，你可以开始检查程序的状态。


    ### 检查变量


    在调试程序时，检查代码中不同位置变量的值通常很有用。在 Visual Studio 中，你可以使用 `Locals`（本地变量）窗口。该窗口显示当前在作用域内的所有变量及其当前值。


    要打开 `Locals` 窗口，转到 `Debug` 菜单并选择 `Windows` > `Locals`。这将打开窗口并向你显示程序中所有变量的当前状态。你还可以将变量添加到
    watch（监视）窗口中，这允许你在程序运行时监控特定变量的值。


    ### 调试常见错误


    C# 程序中会出现几种常见错误，例如空引用异常、索引超出范围异常和除以零错误。当这些错误发生时，它们可能会导致程序崩溃或表现出不可预测的行为。


    要调试此类错误，理解产生它们的原因以及它们在代码何处出现至关重要。最好的方法之一是使用堆栈跟踪（stack trace），它可以向你显示调用序列。


    在 Visual Studio 中，你可以通过进入 `Debug` 菜单并选择 `Call Stack`（调用堆栈来查看堆栈跟踪。这将显示所有调用方法的列表。通过检查堆栈跟踪，你通常可以确定错误源并开始调试。


