    ## OBJECT-ORIENTED PROGRAMMING


    OOP is a programming paradigm that is based on the concept of objects, which can
    contain data and behaviour. It is one of the most popular paradigms used in software
    development today.


    ### CLASSES AND OBJECTS


    A `class` is a blueprint for creating objects. It defines the attributes and methods
    an object of that class will have. An `object` is an instance of a class. It contains
    the data and methods defined in the class.


    ![Image](images/image47.png) Here''s an example of a simple class in C#:


    In this example, we have a class called `Person`. It has two attributes, `Name`
    and `Age`, which are of type `string` and `int` respectively. It also has a method
    called `SayHello` which writes a message to the console using the `Name` and `Age`
    attributes.


    To create an object of this class, we can use the `new` keyword:


    ![Image](images/image48.png)


    This creates a new instance of the `Person` class and assigns it to a variable
    called `john`. We can then set the attributes of this object:


    ![Image](images/image49.png)


    And call its methods:


    ![Image](images/image50.png)


    ### PROPERTIES AND METHODS


    In a class, attributes are often referred to as properties, and methods are functions
    that belong to the class. Properties allow you to encapsulate the data of an object
    and control access to it. Methods allow you to define the behavior of the object.


    ![Image](images/image51.png) Here''s an example of a class with properties and
    methods:


    In this example, we have a class called `BankAccount`. It has a private attribute
    called `balance` which can only be accessed through the public property `Balance`.
    It also has two methods, `Deposit` and `Withdraw`, which modify the `balance`
    attribute.


    ### ENCAPSULATION OR INFORMATION HIDING


    `Encapsulation` refers to the concept of bundling data and methods that operate
    on that data into a single unit, which is called a class. The purpose of encapsulation
    is to hide the implementation details of the class from the outside world and
    to provide a well-defined interface for interacting with the class. In C#, encapsulation
    is achieved using access modifiers, which control the visibility of members (properties
    and methods) of a class. There are four access modifiers in C#: `public`, `private`,
    `protected`, and `internal`.


    - `Public` members are accessible from anywhere, including outside the class.

    - `Private` members are only accessible from within the class.

    - `Protected` members are accessible from within the class and from derived classes.

    - `Internal` members are accessible only from within the same assembly.


    It is a good practice to make the fields (variables) of a class private and to
    provide public properties to access them. This ensures that the class data is
    protected and can only be accessed through a well-defined interface.


    ### INHERITANCE AND POLYMORPHISM


    `Inheritance` is a mechanism in OOP that allows a class (called a derived class)
    to inherit properties and methods from another class (called a base class). The
    derived class can add its own properties and methods, and override or extend the
    properties and methods of the base class.


    `Polymorphism` is a concept in which objects of different classes can be treated
    as if they belong to the same class hierarchy. This allows for greater flexibility
    and extensibility in object-oriented programs.


    In C#, inheritance is achieved using the `:` symbol, followed by the name of the
    base class. For example, the following code defines a derived class called "Employee"
    that inherits from a base class called "Person":


    ![Image](images/image52.png)


    In this example, the `Employee` class inherits the `Name` and `Age` properties
    from the `Person` class and adds its own `EmployeeId` property.


    Polymorphism is achieved through the use of `virtual` and `override` keywords.
    When a method is marked as virtual in a base class, it can be overridden in a
    derived class. For example:


    ![Image](images/image53.png)


    In this example, the `Animal` class defines a virtual `MakeSound` method, which
    is overridden in the `Dog` class to make the dog bark.


