    # CHAPTER 4


    ## CONTROL STRUCTURES


    Control structures are used in programming to control the flow of execution of
    a program. They allow the program to make decisions based on conditions or repeat
    a block of code multiple times. In this chapter, we will cover some of the most
    used control structures in C#: If statements, switch statements, and loops.


    ### IF STATEMENTS


    An *if statement* is a decision-making statement in C# that allows the program
    to execute certain statements based on a particular condition. The syntax of an
    if statement is as follows:


    ![Image](images/image20.png)


    Here, `condition` is the expression that is evaluated to either true or false.
    If the condition is true, the code inside the curly braces will be executed. If
    the condition is false, the code will be skipped.


    For example, let''s say we want to write a program that checks if a number is
    even or odd:


    ![Image](images/image21.png)


    In this example, we first declare and initialize a variable `number` with the
    value 10. We then use an *if statement* to check if `number` is even or odd. The
    expression `number % 2 == 0` checks if the remainder of `number` divided by 2
    is equal to 0. If it is, the number is even, and the first `Console.WriteLine`
    statement will execute. If it is not, the number is odd, and the second `Console.WriteLine`
    statement will execute.


    ### SWITCH STATEMENTS


    A switch statement is another decision-making statement that allows the program
    to execute different sections of code depending on the value of a variable. The
    syntax of a switch statement is as follows:


    ![Image](images/image22.png)


    Here, `expression` is the variable that is being checked, and `value1`, `value2`,
    etc. are the values that it could equal. The `break` statement is used to exit
    the switch statement once a matching case has been found. If none of the cases
