    # CHAPTER 9


    ## FILE I/O AND SERIALIZATION


    In this chapter, we will cover the basics of file input/output (I/O) and object
    serialization in C#. We will learn how to read from and write to files using streams,
    as well as how to serialize and deserialize objects to and from files.


    ### FILE I/O


    File I/O is the process of reading from and writing to files on the disk. In C#,
    we can use the `FileStream` class to work with files. A `FileStream` object provides
    a stream for reading or writing data to a file.


    To read from a file, we can create a `FileStream` object and use it to read bytes
    from the file. For example, the following code reads the contents of a file and
    prints it to the console:


    ![Image](images/image56.png)


    In this example, we create a `FileStream` object for the file `file.txt` with
    `FileMode.Open` and `FileAccess.Read`, which means we want to open the file for
    reading. We then create a byte array to hold the contents of the file and call
    the `Read` method of the `FileStream` object to read the bytes into the buffer.
    Finally, we close the `FileStream` object and print the contents of the buffer
    to the console.


    To write to a file, we can create a `FileStream` object and use it to write bytes
    to the file. For example, the following code writes a string to a file:


    ![Image](images/image57.png)


    In this example, we create a string and convert it to a byte array using the `Encoding.ASCII.GetBytes`
    method. We then create a `FileStream` object for the file `file.txt` with `FileMode.Create`
    and `FileAccess.Write`, which means we want to create the file if it does not
    exist and open it for writing. We then call the `Write` method of the `FileStream`
    object to write the bytes to the file. Finally, we close the `FileStream` object.


    ### SERIALIZATION


    Serialization refers to the process of converting an object into a stream of bytes
    that can be stored in a file or sent over a network. Deserialization is the reverse
    process of converting the bytes back into an object.


    Serialization and deserialization are useful in scenarios where we need to store
    objects in a persistent storage or send them over a network. For example, we can
    serialize an object to a file and then deserialize it later to restore its state.


    To serialize an object, we first need to mark it as serializable by applying the
    `[Serializable]` attribute to its class definition. We can then create a `FileStream`
    object and pass it to a `BinaryFormatter` object to serialize the object. Here
    is an example:


    ![Image](images/image58.png)


    To deserialize the object, we can read the bytes from the file and pass them to
    the `Deserialize` method of the `BinaryFormatter` object. Here''s an example:


    ![Image](images/image59.png)


    In addition to binary serialization, C# also supports other serialization formats
    such as XML and JSON. To serialize an object to XML or JSON, we can use the `XmlSerializer`
    and `JsonSerializer` classes, respectively.


    ### EXERCISE:


    1. Create a class `Student` with properties `Name` and `GPA`.

    2. Create a list of `Student` objects and add some sample data.

    3. Serialize the list to a file using binary serialization.

    4. Deserialize the list from the file and print its contents to the console.


    # CHAPTER 10


    ## BASIC DEBUGGING TECHNIQUES


    Debugging is an important skill for any programmer, as it allows you to identify
    and fix errors in your code. In this chapter, we will cover some basic debugging
    techniques that can help you track down and fix bugs in your C# programs.


    ### USING BREAKPOINTS


    One of the most powerful tools for debugging is the breakpoint. A breakpoint is
    a marker that you can place in your code that tells the debugger to pause execution
    at that point. This allows you to inspect the state of your program at that point
    in time and see what is going on.


    To set a breakpoint in Visual Studio, simply click in the margin next to the line
    of code where you want to set the breakpoint. A red dot will appear to indicate
    that a breakpoint has been set. When you run your program in debug mode, execution
    will stop at the breakpoint and you can begin inspecting the state of your program.


    ### INSPECTING VARIABLES


    When debugging your program, it is often useful to inspect the values of variables
    at various points in the code. To do this in Visual Studio, you can use the `Locals`
    window. This window shows you all the variables that are currently in scope, along
    with their current values.


    To open the `Locals` window, go to the `Debug` menu and select `Windows` > `Locals`.
    This will open the window and show you the current state of all the variables
    in your program. You can also add variables to the watch window, which allows
    you to monitor the value of a specific variable as your program runs.


    ### DEBUGGING COMMON ERRORS


    There are several common errors that can occur in C# programs, such as null reference
    exceptions, index out of range exceptions, and divide by zero errors. When these
    errors occur, they can cause your program to crash or behave unpredictably.


    To debug these types of errors, it is important to understand what causes them
    and where they occur in your code. One of the best ways to do this is to use the
    stack trace, which shows you the sequence of calls.


    In Visual Studio, you can view the stack trace by going to the `Debug` menu and
    selecting `Call Stack`. This will show you a list of all the methods that were
    called up to the error. By examining the stack trace, you can often identify the
    source of the error and begin debugging.


    # CONCLUSION


    Congratulations on completing this book on C# programming! You have now gained
    a solid foundation in one of the most popular languages used in industry today.


    As you move forward in your programming journey, there are still many topics and
    resources you can explore to deepen your understanding of C# and expand your skills.
    Some of these include:


    * Advanced topics in OOP, such as interfaces, abstract classes, and delegates.

    * Web development with C# using frameworks like ASP.NET

    * Desktop application development with C# using Windows Forms or WPF.

    * Game development with C# using game engines like Unity.

    * Mobile app development with C# using Xamarin.

    * Integration with databases using ADO.NET or Entity Framework.


    There are many resources available to help you continue your learning journey,
    including online tutorials, forums, and books. Some popular resources for C# include:


    * Microsoft''s official C# documentation and tutorials (`https://docs.microsoft.com/en-us/dotnet/csharp/`)

    * The C# Station (`https://www.csharp-station.com/`)

    * C# Corner (`https://www.c-sharpcorner.com/`)

    * Udemy and Coursera offer online courses on C# programming

