    ## EXCEPTION HANDLING


    ### WHAT ARE EXCEPTIONS?


    In programming, an exception is an event that occurs during the execution of a
    program that disrupts the normal flow of instructions. Exceptions can occur for
    many reasons, such as invalid input, incorrect usage of a method, or unexpected
    behavior of an object. When an exception occurs, the program will stop executing
    unless we handle the exception.


    ### TRY-CATCH BLOCKS


    A `try-catch block` is a structure in C# that allows us to handle exceptions gracefully.
    It works by enclosing a block of code that may throw an exception in a `try` block.
    If an exception is thrown within the `try` block, it will be caught and handled
    by the `catch` block. The `catch` block will contain the code to handle the exception,
    such as displaying an error message or logging the exception details.


    Here''s an example:


    ![Image](images/image54.png)


    In this example, we have a `try` block that contains the code that may throw an
    exception. The `catch` block will catch any exception that occurs within the `try`
    block, and the `ex` variable will contain the details of the exception. We can
    then use this information to handle the exception appropriately.


    ### THROWING EXCEPTIONS


    In addition to catching exceptions, we can also throw exceptions manually using
    the `throw` keyword. This is useful when we encounter an error that we cannot
    handle within the current method, and we want to pass the error up the call stack
    to a higher-level method that can handle it.


    Here''s an example:


    ![Image](images/image55.png)


    In this example, we are checking a condition, and if it is true, we are throwing
    a new `exception` with a message "Something went wrong!". This exception can then
    be caught and handled by a higher-level method.

