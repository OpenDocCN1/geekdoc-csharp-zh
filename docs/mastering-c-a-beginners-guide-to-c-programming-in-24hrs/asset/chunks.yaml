    `CalculateArea` 方法来计算矩形圆形的面积。


    # 第 8 章


    ## 异常处理


    ### 什么是异常？


    在编程中，异常是程序执行过程中发生的事件，会破坏正常的指令流。异常可能由于许多原因引起，例如无效输入、错误的用法或对象的意外行为。当发生异常时，除非我们处理它，否则程序将停止执行。


    ### try-catch 块


    `try-catch block` 是 C# 中允许我们优雅处理异常的结构。它通过将可能抛出异常的代码块封装在 `try` 块中工作。如果在 `try` 块内抛出了异常，它将被
    `catch` 块捕获并处理。`catch` 块包含处理异常的代码，例如显示错误或记录异常详情。


    这是一个示例：


    ![Image](img/image54.png)


    在此示例中，我们有一个 `try` 块，包含可能抛出异常的代码。`catch` 块将捕获 `try` 块内发生的任何异常，`ex` 变量将包含异常的详细信息。然后我们可以使用这些信息来适当处理异常。


    ### 抛出异常


    除了捕获异常外，我们还可以使用 `throw` 关键字手动抛出异常。当我们遇到在当前方法无法处理的错误，并希望将错误向上传递给调用栈中可以处理它的上层方法时，这非常有用。


    这里有一个示例：


    ![Image](img/image55.png)


    在此示例中，我们正在检查一个条件，如果该条件为真，我们就会抛出一个带有消息“出问题了！”的新 `exception`。此异常随后可以被上层方法捕获并处理。

