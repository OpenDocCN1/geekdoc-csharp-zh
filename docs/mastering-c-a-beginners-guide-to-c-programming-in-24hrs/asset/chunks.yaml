    # BREAKING AND CONTINUING LOOPS


    Sometimes you may want to prematurely exit a loop or skip to the next iteration
    of a loop based on a certain condition. In C#, you can use the `break` and `continue`
    statements to achieve this.


    The `break` statement allows you to exit a loop prematurely. When the `break`
    statement is executed, the program will immediately exit the loop and continue
    executing the next statement after the loop.


