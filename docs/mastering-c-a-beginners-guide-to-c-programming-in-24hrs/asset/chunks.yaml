    # CHAPTER 3


    ## OPERATORS AND EXPRESSIONS


    In programming, operators are used to perform operations on data. Operators can
    be used to perform arithmetic, comparison, and logical operations. Expressions
    are combinations of operators and values that produce a result.


    ### ARITHMETIC OPERATORS


    Arithmetic operators are used to perform mathematical operations on numerical
    data. Here are some of the most common arithmetic operators in C#:


    1. `Addition (+)`: Adds two values together. *Example:*


    ![Image](images/image5.png)


    2. `Subtraction (-)`: Subtracts one value from another. *Example:*


    ![Image](images/image6.png)


    3. `Multiplication (*)`: Multiplies two values together. *Example:*


    ![Image](images/image7.png)


    4. `Division (/)`: Divides one value by another. *Example:*


    ![Image](images/image8.png)


    5. `Modulus (%)`: Returns the remainder of a division operation. *Example:*


    ![Image](images/image9.png)


    ### COMPARISON OPERATORS


    Comparison operators are used to compare two values and return a Boolean (true/false)
    result. Here are some of the most common comparison operators in C#:


    1. `Equal to (==)`: Returns true if two values are equal. *Example:*


    ![Image](images/image10.png)


    2. `Not equal to (!=)`: Returns true if two values are not equal. *Example:*


    ![Image](images/image11.png)


    3. `Greater than (>)`: Returns true if one value is greater than another. *Example:*


    ![Image](images/image12.png)


    4. `Less than (<)`: Returns true if one value is less than another. *Example:*


    ![Image](images/image13.png)


    5. `Greater than or equal to (>=)`: Returns true if one value is greater than
    or equal to another. *Example:*


    ![Image](images/image14.png)


    6. `Less than or equal to (<=)`: Returns true if one value is less than or equal
    to another. *Example:*


    ![Image](images/image15.png)


    ### LOGICAL OPERATORS


    Logical operators are used to combine multiple boolean values and return a boolean
    result. Here are some of the most common logical operators in C#:


    1. `AND (&&)`: Returns true if both values are true. *Example:*


    ![Image](images/image16.png)


    2. `OR (||)`: Returns true if either value is true. *Example:*


    ![Image](images/image17.png)


    3. `NOT (!)`: Returns the opposite of a boolean value. *Example:*


    ![Image](images/image18.png)


    ### UNDERSTANDING EXPRESSIONS


    An expression is a combination of values and operators that produce a result.
    In C#, expressions can be used in many places, such as in assignment statements,
    function calls, and conditional statements.


    For example:


    ![Image](images/image19.png)


    In this example, the expression `(5 + 10) * 2` is evaluated to produce 30, which
    is then assigned to the variable `result`.


