  # 第 10 章


  ## 调试技术


  调试是任何程序员都具备的一项重要技能，因为它允许你识别并修复代码中的错误。在本章中，我们将涵盖一些基础调试技术，帮助你追踪并修复 C# 程序中的错误。


  ### 使用断点


  调试最强大的工具之一是断点。断点是你放置在代码中的一个标记，它告诉调试器在某一点暂停执行。这允许你检查程序在那个时刻的状态，并查看发生了什么。


  要在 Visual Studio 中设置断点，只需点击想要设置断点的代码行侧的边距即可。会出现一个红点，表示已设置断点。当你以调试模式运行程序时，执行将在断点处停止，你可以开始检查程序的状态。


  ### 检查变量


  在调试程序时，检查代码中不同位置变量的值通常很有用。在 Visual Studio 中，你可以使用 `Locals`（本地变量）窗口。该窗口显示当前在作用域内的所有变量及其当前值。


  要打开 `Locals` 窗口，转到 `Debug` 菜单并选择 `Windows` > `Locals`。这将打开窗口并向你显示程序中所有变量的当前状态。你还可以将变量添加到
  watch（监视）窗口中，这允许你在程序运行时监控特定变量的值。


  ### 调试常见错误


  C# 程序中会出现几种常见错误，例如空引用异常、索引超出范围异常和除以零错误。当这些错误发生时，它们可能会导致程序崩溃或表现出不可预测的行为。


  要调试此类错误，理解产生它们的原因以及它们在代码何处出现至关重要。最好的方法之一是使用堆栈跟踪（stack trace），它可以向你显示调用序列。


  在 Visual Studio 中，你可以通过进入 `Debug` 菜单并选择 `Call Stack`（调用堆栈来查看堆栈跟踪。这将显示所有调用方法的列表。通过检查堆栈跟踪，你通常可以确定错误源并开始调试。


