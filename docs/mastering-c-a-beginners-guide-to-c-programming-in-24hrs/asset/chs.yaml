  * **using System;**：这一行告诉编译器使用 `System` 命名空间，其中包含了我们将用于输出到控制台的 `Console` 类。

  * **namespace HelloWorld**：这一行创建了一个名为 `HelloWorld` 的命名空间来包含我们的程序。


