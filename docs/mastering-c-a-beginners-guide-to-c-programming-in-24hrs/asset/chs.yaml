  # 第 4 章


  ## 控制结构


  控制结构用于控制程序的执行流。它们允许程序根据条件做出决策或重复执行代码块。在本章中，我们将介绍一些常用的控制结构：if 语句、switch 语句和循环。


  ### if 语句


  *if 语句* 是 C# 中的一种决策语句，允许程序根据特定条件执行某些语句。if 语句的语法如下：


  ![Image](img/image20.png)


  在这里，`condition` 是被求值为真或假的表达式。如果条件为真，则执行大括号内的代码。如果条件为假，则跳过这些代码。


  例如，假设我们想写一个程序检查一个数字是奇还是偶：


  ![Image](img/image21.png)


  在这个示例中，我们首先声明并初始化变量 `number` 值为 10。然后我们使用 *if 语句* 来检查 `number` 是偶还是奇。表达式 `number
  % 2 == 0` 检查 `number` 除以 2 的余数是否等于 0。如果是，说明是偶数，执行第一个 `Console.WriteLine` 语句。如果不是，则是奇数，执行第二个
  `Console.WriteLine` 语句。


  ### switch 语句


  switch 语句是另一种决策语句，允许根据变量的值执行不同的代码段。switch 语句的语法如下：


  ![Image](img/image22.png)


  在这里，`expression` 是被检查的变量而 `value1`、`value2` 等是它可能相等的值。`break` 语句用于在找到匹配项后退出 switch
  语句。如果没有匹配项，将执行 `default` 块中的代码。





  在这个示例中，我们声明并初始化了一个值为 "Monday" 的变量 `dayOfWeek`。然后，我们使用 `switch` 语句根据 `dayOfWeek`
  的值来显示消息。由于 `dayOfWeek` 是 "Monday"，第一个 `case` 被匹配，程序显示消息“Today is Monday”。


  # 循环 (LOOPS)


  循环用于多次执行一段代码块。C# 中有三种循环：`while` 循环、`do-while` 循环和 `for` 循环。


  ## WHILE 循环


  `while loop` 允许你在特定条件为真时重复执行一段代码块。


  `while` 循环的基本结构如下：


  ![Image](img/image24.png)


  `while loop` 中的 `condition` 是一个布尔表达式，决定了循环是否继续。如果 `condition` 为真，循环将继续执行代码块。


  下面是一个使用 `while` 循环打印 1 到 5 的示例：


  ![Image](img/image25.png)


  在这个示例中，`condition` 是 `i <= 5`，当 `i` 小于或等于 5 时，该条件为真。循环内部的代码块将执行 5 次，每次都会打印 `i` 的值。


  ## DO-WHILE 循环


  `do-while loop` 类似于 `while` 循环，区别在于检查条件之前至少执行一次代码块。*do-while 循环的基本结构如下：*


  ![Image](img/image26.png)


  下面是一个使用 `do-while` 循环反复要求用户输入数字直到输入数字的示例：


  ![Image](img/image27.png)


  在这个示例中，循环内部的代码块提示用户输入数字。使用 `int.TryParse()` 方法尝试将输入解析为整数。如果不是整数，循环将继续。


  ## FOR 循环


  `for loop` 允许你对范围内的值进行迭代。*for 循环的基本结构如下：*


  ![Image](img/image28.png)


  `initialization` 步骤用于初始化控制循环的变量。`condition` 步骤决定了循环是否继续。`iteration` 步骤在每次迭代结束时修改变量。


  下面是一个使用 `for` 循环打印 0 到 10 偶数的示例：


  ![Image](img/image29.png)


  在这个示例中，`initialization` 步骤将变量 `i` 初始化为 0。`condition` 步骤检查 `i` 是否小于等于 10。`iteration`
  步骤在每次迭代时将 `i` 加 2。循环内部的代码块将执行 6 次，每次打印 0 到 10 的偶数。


  # 跳出与继续循环 (BREAKING AND CONTINING LOOPS)


  有时你想根据特定条件提前退出循环或跳到循环的下一次迭代。在 C# 中，可以使用 `break` 和 `continue` 语句来实现。


  `break` 语句允许你提前退出循环。执行 `break` 语句时，程序立即退出循环并继续执行循环后的语句。


  ![Image](img/image30.png) 使用 `while` 循环配合 `break` 语句打印 1 到 5 的示例，但在打印数字 3 时退出循环：


  在这个示例中，`if` 语句检查 `i` 是否等于 3。如果是，则执行 `break` 语句，提前退出循环。


  `continue` 语句允许你根据特定条件跳到循环的下一次迭代。执行 `continue` 语句时，程序将跳过当前迭代的剩余部分并开始下一次迭代。


  *使用 `for` 循环配合 `continue` 语句打印 1 到 5 的示例，但跳过了数字 3：*


  ![Image](img/image31.png)


  在这个示例中，`if` 语句检查 `i` 是否等于 3。如果是，则执行 `continue` 语句，跳过当前迭代的剩余部分并开始下一次迭代。


