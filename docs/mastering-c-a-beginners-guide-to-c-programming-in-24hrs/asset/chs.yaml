  ### 属性与方法


  在类中，属性通常被称为属性（properties），而方法是属于该类的函数。属性允许你封装对象的数据并控制对它的访问。方法允许你定义对象的行为。


  ![Image](img/image51.png) 这是一个带有属性和方法的类示例：


  在例示例中，我们有一个名为 `BankAccount` 的类。它有一个私有属性 `balance`，只能通过公共属性 `Balance` 访问。它还有两个方法
  `Deposit` 和 `Withdraw`，它们会修改 `balance` 属性。


  ### 封装或信息隐藏


  `Encapsulation`（封装）指的是将数据和操作这些数据的方法封装在一个单元中，该单元被称为类。封装的目的是从外部隐藏类的实现细节，并为与类的交互提供定义良好的接口。在
  C# 中，封装是通过访问修饰符实现的，访问修饰符控制类成员（属性和方法）的可见性。C# 中四种访问修饰符：`public`、`private`、`protected`
  和 `internal`。


  - `Public`（公共）成员可以从任何地方访问，包括类外部。

  - `Private`（私有）成员只能从类内部访问。

  - `Protected`（保护）成员可以在类内部和派生类中访问。

  - `Internal`（内部）成员只能在同一个程序集内部访问。


  将类的字段（变量）设置为私有，并提供公共属性来访问它们是一种良好的做法。这确保了类数据受到保护，并且只能通过定义的接口访问。


  ### 继承与多态


  `Inheritance`（继承）是 OOP 中的一种机制，允许一个类（称为派生类）从另一个类（称为基类）继承属性和方法。派生类可以添加自己的属性和方法，并覆盖或扩展基类的属性和方法。


  `Polymorphism`（多态）是一种概念，不同类的对象可以被视为属于同一个类层次结构。这使得面向对象的程序具有更大的灵活性和扩展性。


  在 C# 中，继承通过 `:` 符号实现，后后跟基类的名称。例如，以下代码定义了一个名为 "Employee" 的派生类，它继承自名为 "Person" 的基类：


