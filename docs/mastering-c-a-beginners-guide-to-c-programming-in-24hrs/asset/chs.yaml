  在此示例中，`Employee` 类继承了 `Person` 类的 `Name` 和 `Age` 属性，并添加了自己的 `EmployeeId` 属性。


  多态通过使用 `virtual` 和 `override` 关键字来实现。当方法在基类中被标记为虚拟时，它可以在派生类中重写。例如：


  ![Image](img/image53.png)


  在此示例中，`Animal` 类定义了一个虚拟方法 `MakeSound`，它在 `Dog` 类中被重写。


