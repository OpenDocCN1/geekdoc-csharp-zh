  # 第 9 章


  ## 文件 I/O 与序列化


  在本章中，我们将涵盖 C# 中文件输入/输出（I/O）和对象序列化的基础。我们将学习如何使用流（streams）从文件读取和写入文件，以及如何将对象序列化到文件中并反之。


  ### 文件 I/O


  文件 I/O 是从磁盘上的文件读取和写入的过程。在 C# 中，我们可以使用 `FileStream` 类来处理文件。`FileStream` 对象提供了一个用于向文件读取或写入数据的流。


  若要从文件中读取内容，我们可以创建一个 `FileStream` 对象并使用它从文件中读取字节。例如，以下代码读取了文件内容并将其打印到控制台：


  ![Image](img/image56.png)


  在这个示例中，我们为文件 `file.txt` 创建了一个 `FileStream` 对象，并使用了 `FileMode.Open` 和 `FileAccess.Read`，这意味着我们想要打开文件进行读取。然后，我们创建一个字节数组来存放文件内容，并调用
  `FileStream` 对象的 `Read` 方法将字节读取到缓冲区。最后，我们关闭 `FileStream` 对象并将缓冲区的内容打印到控制台。


  若要向文件写入内容，我们可以创建一个 `FileStream` 对象并使用它将字节写入文件。例如，以下代码将一个字符串写入文件：


  ![Image](img/image57.png)


  在这个示例中，我们创建了一个字符串并使用 `Encoding.ASCII.GetBytes` 方法将其转换为字节数组。然后，我们为文件 `file.txt` 创建了一个
  `FileStream` 对象，并使用了 `FileMode.Create` 和 `FileAccess.Write`，这意味着如果文件不存在则创建它并打开进行写入。然后我们调用
  `FileStream` 对象的 `Write` 方法将字节写入文件。最后，我们关闭 `FileStream` 对象。


  ### 序列化


  序列化是指将对象转换为字节流的过程，该字节流可以存储在文件中或通过网络发送。反序列化是将字节转换回对象的逆过程。


  当我们需要将对象存储在持久化存储中或通过网络发送它们时，序列化和反序列化非常有用。例如，我们可以将对象序列化到文件，稍后将其反序列化以恢复其状态。


  要序列化一个对象，首先需要通过在其类定义上应用 `[Serializable]` 特性将其标记为可序列化的。然后，我们可以创建一个 `FileStream` 对象并将其传递给
  `BinaryFormatter` 对象以序列化该对象。这是一个示例：


