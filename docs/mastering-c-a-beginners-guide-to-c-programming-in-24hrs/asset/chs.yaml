  ## 变量与数据类型


  在本章中，我们将讨论 C# 中的变量和数据类型。这些是编程中的基础概念，允许你在程序中存储和操作数据。


  ### 什么是变量？


  变量是存储数据或值的容器，这些这些值可以在你的程序中使用。它们是内存中命名的位置，用于存储不同数据类型的值。变量可以在程序执行期间更改，并用于存储计算、比较和数据存储的值。


  ### 声明与初始化


  变量 在程序中使用变量之前，你必须对其进行声明。声明变量是在内存中为该变量预留空间的过程。你必须指定你正在声明的变量的数据类型。


  这是一个声明名为 "myNumber" 的整数类型变量的示例：


  ![Image](img/image2.png)


  在这个示例中，我们声明了一个名为 `myNumber` 的整数类型变量。整数数据类型存储整数，例如 -1, 0, 1, 2, 3 等。


  一旦你声明了变量，就可以用一个值对其初始化。初始化变量是为变量分配初始值的过程。


  这是一个声明并初始化一个名为 "myName" 的字符串类型变量的示例：


  ![Image](img/image3.png)


  在这个示例中，我们声明了一个名为 `myName` 的 `string` 类型变量，并将其初始化为值 "John"。字符串数据类型存储文本值，如 "Hello"、World"
  等。


  ### C# 中的常见数据类型


  C# 支持多种数据类型，每种类型都有自己的一组值和操作。以下是 C# 中一些常见的数据类型：


  * `int`: 存储整数，例如 -1, 0, 1, 2, 3 等。


  * `double`: 存储浮点数，例如 3.14, 5.5, 100.0 等。


  * `bool`: 存储真/假值，例如 true 或 false。


  * `string`: 存储文本值，如 "Hello"、"World" 等。


  * `char`: 存储单个字符，如 ''a'', ''b'', ''c'' 等。


