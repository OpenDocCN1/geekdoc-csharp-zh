  ## 数组与集合


  在编程中，数组是存储在连续内存块中的相同数据类型元素的集合。数组适用于结构化存储和处理大量数据。另一方面，集合是更灵活的数据结构，可以包含不同数据类型的元素。


  ### 数组声明与初始化 (DECLARING AND INITIALIZING ARRAYS)


  在 C# 中声明数组需要指定数组元素的数据类型，然后是数组名称和方括号中的数组大小。


