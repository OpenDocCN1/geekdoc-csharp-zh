  ![Image](img/image33.png)


  ### 操作数组元素 (WORKING WITH ARRAY ELEMENTS)


  你可以使用索引 `[]` 访问数组的单个元素。第一个元素的索引为 0，最后一个元素的索引为大小减一。


  ![Image](img/image34.png)


  你也可以通过分配新值来更改数组中元素的值：


  ![Image](img/image35.png)


  ### C# 集合类型 (COMMON COLLECTION TYPES IN C#)


  C# 提供了几种比数组更灵活的内置集合类型。*以下是最常用的集合类型：*


  - `List<T>`：一种可以包含任何类型元素的动态数组。你可以在运行时添加、删除和修改 `List<T>`。


  ![Image](img/image36.png)


  - `Dictionary<TKey, TValue>`：键值对集合。你可以在运行时添加、删除和修改 `Dictionary<TKey, TValue>`。


