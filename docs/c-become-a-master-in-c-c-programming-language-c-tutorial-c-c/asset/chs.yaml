  \n\n![](img/00001.jpeg)\n\n每当 .Net 框架正在开发时，类库是使用托管代码编译器编写的，这被称为 `Simple Managed\
  \ C`。直到 99 年 1 月，Hejberg 才建立了一个团队开发了这种新语言，简称为 `Cool`，但实际上是 `C like Object Oriented\
  \ Language`。当时微软曾考虑将 `Cool` 作为其项目的最终名称，但由于版权原因未采用。\n\n在 2000 年专业开发者会议上，.Net 项目向业界宣布该语言被更名为\
  \ `C#`，类库被命名为 `ASP.Net`，而运行时被移植到了该语言中。\n\nC# 语言的主要设计师也是微软的首席架构师，并参与了 `Turbo Pascal`、`Embarcadero\
  \ Delphi`（曾名为 `CodeGear Delphi`）、`Inpris Delphi` 和 `BorlandDelphi` 的设计，还参与了 `Visual\
  \ C++`。\n\n当你开始使用 C# 时，你会注意到它是由 ECMA（欧洲计算机制造商协会）以及 ISO（国际标准组织）批准、由微软创建的语言，它是为了 CLI（通用语言基础设施）而设计的。\n\
  \n它的它的原因：\n\n1. 你可以作为 .Net 框架的一部分使用它\n2. 它是一种通用语言\n3. 你可以跨平台使用\n4. 它是一个面向对象的程序\n\
  5. 它将产生高效的程序\n6. 它是组件化的\n7. 这种语言结构化且易于学习\n\n虽然 C# 看起来只是 C 语言的另一种变体，但由于以下事实，它更像 Java。\n\
  \n程序员发现的一些特性：\n\n1. 它可以与 Windows 集成\n2. 布尔条件\n3. 用于 `LINQ` 和 `Lambda` 的表达式\n4. 自动垃圾回收\n\
  5. 简单的多线程\n6. 标准库\n7. 条件编译\n8. 程序集\n9. 索引器\n10. 属性和事件\n11. 易于使用泛型\n12. 委托和事件管理\n\
  \n\n\n\n\n\n1994 年，James Gosling 创建了 `Java` 语言，而 Sun Microsystems 的联合创始人 Bill Joy\
  \ 则认为 `C#` 仅仅是 `Java` 语言的模仿。他甚至说道：“C# 就像是删除了可靠性、生产力和安全性的 Java。” Kreft 和 Langer 则反驳道，“Java`\
  \ 和 `C#` 几乎是完全相同的编程语言。这种缺乏创新的无聊重复。几乎没有人会声称 `Java` 或 `C#` 是改变了我们编写程序方式的革命性编程语言。而且，`C#`\
  \ 从 `Java` 中借鉴了很多，反之亦然。既然 `C#` 支持装箱和拆箱，我们将在 `Java` 中拥有一个非常相似的功能。”\n\n2000 年后期，Hejlsberg\
  \ 站出来并表示：“C# 不是 Java 的克隆版本，在设计上更接近 `C++`。”\n\n自 2005 年发布 2.0 版本以来，`C#` 和 `Java`\
  \ 沿着不同的轨迹演进，这使得它们彼此不再那么相似。最大的区别之一是语言中引入了泛型，这使得它们与众不同。`C#` 使用具现化（reification）来提供一等泛型对象，这些对象在类加载时生成代码以执行，能够在其他类中使用。此外，`C#`\
  \ 还具有许多特性，使其成为一种函数式编程语言，并与 `C#` 3.0 版本发布的 `LINQ` 扩展协同工作。\n\n以下是 `C#` 各版本发布时所添加的功能。\n\
  \n## 版本 2.0\n\n1. 委托推断\n2. 泛型\n3. 静态类\n4. 部分类\n5. 委托的协变与逆协变\n6. 匿名方法\n7. 方法组转换\n\
  8. 迭代器\n9. Getter/setter 独立访问访问性\n10. 可空类\n\n## 版本 3.0\n\n1. 部分方法\n2. 隐式类级局部变量\n\
  3. 表达式树\n4. 对象和集合初始化器\n5. Lambda 表达式\n6. 自动实现属性\n7. 查询表达式\n8. 匿名类\n9. 扩展方法\n\n##\
  \ 版本 4.0\n\n1. 嵌入式互操作类\n2. 动态绑定\n3. 泛型协变与逆协变\n4. 命名参数和可选参数\n\n## 版本 5.0\n\n1. 调用者信息属性\n\
  2. 异步方法\n\n## 版本 6.0\n\n1. 字典初始化器\n2. 编译器服务\n3. 运算符命名\n4. 将静态类成员导入到命名空间\n5. 字符串插值\n\
  6. 异常过滤器\n7. 空传播器\n8. 在 catch/finally 块中使用 Await\n9. 表达式体成员\n10. 自动属性初始化器\n11. 仅限\
  \ getter 属性的默认值\n\n## 版本 7.0\n\n1. 表达式体 getter 和 setter\n2. out 变量\n3. 表达式体构造函数和终结器\n\
  4. 模式匹配\n5. 泛型异步返回类型\n6. 元组\n7. ref 返回值和局部变量\n8. 解构\n9. 二进制字面量\n10. 局地函数\n11. 数字分隔符\n\
  \n## 版本 7.1\n\n1. 默认表达式\n2. 异步 main\n\n\n![](img/00001.jpeg)\n\n# C# 环境\n\n`.Net`\
  \ 是一个运行在自身平台上的框架，旨在帮助你编写 Windows 应用程序、Web 服务和 Web 应用程序。由于该框架设计用于用于几乎任何编程语言，因此它的应用程序可以在多个平台上运行。每种语言都有访问该框架的选项，以便相互通信。\n\
  \n`.Net` 框架通过包含大量代码库工作，你可以使用 `C#` 使用它们。`.Net` 框架的一些组件包括：\n\n1. `LINQ`\n2. `CLR`（通用语言运行时）\n\
  3. `WCF`（Windows 通信基础）\n4. .Net Framework 类库\n5. Windows Presentation Foundation\n\
  6. 通用语言规范\n7. `WF`（Windows 工作流基础）\n8. 通用类系统\n9. `ADO. Net`\n10. 元数据和程序集\n11. `ASP.\
  \ NET` 和 `ASP. Net AJAX`\n12. Windows Forms\n\n每个组件都会执行不同的任务，你可以通过使用该组件或查看微软提供的文档来了解它们。\n\
  \n## 集成开发环境\n\n还有更多仅凭 `C Sharp` 就可以使用的开发工具，这些是：\n\n1. Visual Web creator\n2. `VS`\
  \ (Visual Studio 2010)\n3. `VCE` (Visual C# 2010 Express)\n\nWeb Creator 和 `VCE`\
  \ 可以在微软官方网站找到。当你使用这些工具时，你将能够编写几乎任何类型的 `C#` 程序。你还可以选择编写源文件，并配合如 `Notepad` 等基础文本编辑器，这样可以使用命令行提示符（它是\
  \ .Net Framework 的一部分）将代码建模成程序集。\n\n`VCE` 和 Web Creator 是比 Visual Studio 小的版本，并且具有相同的外观。\n\
  \n安装 Visual Studio 快速版时需要保持稳定的连接。\n\n## 在 Linux 和 Mac 上编写程序\n\n由于 `.Net` 框架是一个 Windows\
  \ 系统软件功能；当你处理其他系统软件时，还可以使用其他版本。`Mono` 是 `.Net` 框架的一个变体，它可以与 `C#` 编译器配合工作并在 Linux\
  \ 和 Mac OS 等多个不同的系统上运行。\n\n`Mono` 的完全目的是能够运行为 Microsoft `.Net` 构建的应用程序，以便它们能够与其他系统软件（如\
  \ Android、iOS、Linux 和 Unix）开发的工具一起工作。\n\n# 第四章\n\n![](img/00001.jpeg)\n\n## C# 的程序结构\n\
  \n在学习构建 `C#` 程序需要什么之前，你必须先了解编程语言是如何构建的。程序中的某些部分对于确保你在创建 `C#` 程序时添加了它们至关重要。\n\n1.\
  \ 注释\n2. 命名空间声明\n3. 语句和表达式\n4. 类\n5. `main` 方法\n6. 类方法\n7. 类属性\n\n示例\n\n```csharp\n\
  using system;\n\nNamespace helloouterspaceapplication\n{\n\nClass helloouterspace\n\
  {Static void main (tuple [] para)\n{\n/* 你的第一个 C # 程序 */\nConsole. Write line (“hello\
  \ outer space”);\nConsole. Ready key ();\n}\n}\n\n}\n```\n\n一旦代码执行，你将得到“Hello outer\
  \ space”的结果。\n\n你程序中的第一行是代码中的 `using system` 部分。`using` 关键字为程序包含一个系统的命名空间。大多数 `C#`\
  \ 程序使用多个 `using` 语句。\n\n你的命名空间声明是你所使用的类的集合。你的应用程序名称将是该应用程序的类。\n\n你的类声明将包含程序最终使用的所有数据和定义。类将包含多个方法，这些方法最终将定义类的行为。但示例中使用的类只有一个名为\
  \ `main` 的方法。\n\n你的 `main` 方法是所有 `C#` 程序的入口点。该方法将规定类何时被执行。\n\n星号和斜杠会被编译器忽略，因为它们是程序的注释。\n\
  \n你的 `main` 方法将告诉你你的语句将遵循什么行为。\n\n`Write line` 是 `console` 类在命名空间中完整写时将使用的方法。这条语句将导致你的结果显示在你面前的屏幕上。\n\
  \n\n\n\n对于 VS.Net 用户来说，底线在于。这将导致程序等待按下某个键，最终这将阻止你的页面在每次从 visual studio 启动程序时自动打开和关闭。\n\
  \n你需要记住以下几点：\n\n1. 文件名必须与类名不同\n2. `C#` 是区分大小写的\n3. 你的执行将从 `main` 方法开始\n4. 你的所有语句和表达式必须以分号结尾\n\
  \n## 编译并运行你的程序\n\n如果你打算在 Visual Studio 中使用 .Net，你需要执行以下步骤。\n\n1. 你需要打开 visual studio\n\
  2. 移动到菜单栏，进入 `file`、`new`、`project`\n3. 选择一个模板，然后选择 `Windows`\n4. 进入控制台应用程序（console\
  \ application）\n5. 选择你想为项目命名的名称\n6. 你的新项目将在解决方案管理器中创建\n7. 现在你可以用代码编辑器编写代码\n8. 选择运行按钮来执行你的项目。命令提示符将会出现并显示你的输出。\n\
  \n当你使用命令行而不是 visual studio 使用 `C#` 编译程序时，请遵循以下步骤：\n\n1. 选择你喜欢的文本编辑器并插入你将使用的代码\n\
  2. 使用你的文件名保存文件并添加 `.cs` 后缀\n3. 需要打开命令提示符，以便定位到存放文件的目录\n4. 输入 `CSC` 和你的文件名，然后按回车键强制编译你的代码\n\
  5. 如果没有错误，下一行将引起你的注意，该行是生成可执行文件的行\n6. 输入你的代码来运行程序\n7. 你的输出应该打印在屏幕上。\n\n# 第五章\n\n\
  ![](img/00001.jpeg)\n\n## C# 语法\n\n由于 `C#` 是一种面向对象的编程语言，你将需要使用对象来与其他对象交互，从而创建动作。这些动作在每次使用时都会创建方法。相同的对象将具有同一个类或位于同一个类中。\n\
  \n以矩形为例。长度和宽度是矩形的属性。根据矩形的设计，在计算面积和显示细节时，这些属性会接受特定的值。\n\n**示例：**\n\n```csharp\nusing\
  \ system;\n\nNamespace circle application\n\n{\n\nClass circle\n{\n\n    // variables\n\
  \    Double width;\n    Double circumference\n\n    Open void accept details ()\n\
  \    {\n        Width = 3.4\n        Circumference = 3.2\n    }\n\n    Open double\
  \ ()\n    {\n        Return width * circumference\n    }\n\n    Open void display\
  \ ()\n    {\n        Console.WriteLine(\"width: {0}\", width);\n        Console.WriteLine\
  \ (circumference: {0}, circumference);\n    }\n}\n\nClass perform\n{\n    Static\
  \ void main (string [] para)\n    {\n        Circle c = new circle ();\n       \
  \ accept details ();\n        display ();\n    }\n}\n```\n\n对于上面的示例，是 circle。\n\n\
  **Using**\n在 `C#` 中，你的第一个语句总是 `using system;`。`using` 关键字用于命名空间（namespaces）。\n\n\
  **Class**\n当你声明类时使用 `class` 关键字。\n\n**注释**\n当你需要解释你的代码时使用注释。`C#` 编译器将忽略你编写的注释。多行注释以\
  \ `/*` 开始，以 `*/` 结束。单行注释使用双斜杠。\n\n**成员变量**\n这些变量是类的成员属性。当使用时，它们可以存储数据。\n\n**成员函数**\n\
  成员函数是执行任务的语句。这些函数通常在类内部声明。\n\n**实例化**\n类包含 `main` 方法中的类名。\n\n**标识符**\n标识符是用于标识类、变量和函数的单词。在\
  \ `C#` 中创建标识符有三个规则：\n\n1. 不能使用 `C#` 中找到关键字\n2. 必须以字母开头，然后是字母、数字或下划线。但不能以数字开头。\n\
  3. 可以使用任何字符但下划线。\n\n**C# 中的关键字**\n关键字是 `C#` 保留的单词。但如果你想将这些单词作为标识符，可以在单词前使用 `@` 符号以使其有效。`C#`\
  \ 中找到的标识符具有特殊含义，导致某些被称为上下文关键字（contextual keywords）。\n\n**保留关键字**\n`Abstract`, `Catch`,\
  \ `Default`, `Explicit`, `Foreach`, `Interface`, `Null`, `Private`, `Sealed`, `Switch`,\
  \ `Ulong`, `Volatile`, `While`, `Unchecked`, `This`, `Short`, `Protected`, `Internal`,\
  \ `Goto`, `Extern`, `Delegate`, `Char`, `As`, `Base`, `Checked`, `Do`, `False`,\
  \ `If`, `Is`, `Operator`, `Open`, `Sizeof`, `Throw`, `Unsafe`, `Ushort`, `True`,\
  \ `Stackalloc`, `Readonly`, `Out`, `Lock`, `Implicit`, `Finally`, `Double`, `Class`,\
  \ `Bool`, `Break`, `Const`, `Else`, `Fixed`, `In`, `Long`, `Out`, `Ref`, `Static`,\
  \ `Try`, `Using`, `Virtual`, `Classof`, `String`, `Return`, `Override`, `Namespace`,\
  \ `In`, `Float`, `Enum`, `Continue`, `Byte`, `Case`, `Decimal`, `Event`, `For`,\
  \ `Int`, `New`, `Params`, `Sbyte`, `Struct`, `Uint`, `Void`。\n\n**上下文关键字**\n`Partial`,\
  \ `Get`, `From`, `Orderby`, `Let`, `Dynamic`, `Set`, `Join`, `Descending`, `Ascending`,\
  \ `Into`, `Select`, `Remove`, `Group`, `Alias`, `Partial`, `Global`, `Add`。\n\n\
  # 第六章\n\n![](img/00001.jpeg)\n\n## 数据类\n\n`C#` 中有三种不同的数据类：\n\n1. `Pointer`（指针）\n\
  2. `Value`（值）\n3. `Reference`（引用）\n\n## 值类\n\n值类是你直接赋值给值的变量。这些派自 `system.value.class`。\n\
  \n值类直接包含数据，如 `char`、`int` 和 `float`。每当声明 `int` 类时，系统都会留出空间。\n\n**值类：**\n1. `Bool`:布尔值\n\
  2. `Byte`:8 位无符号整数\n3. `Char`:16 位 Unicode 字符\n4. `Decimal`:128 位高精度小数值，最多有 29 位有效数字\n\
  5. `Double`:64 位双精度浮点类\n6. `Float`:32 位单精度浮点类\n7. `Int`:32 位有符号整数\n8. `Long`:64\
  \ 位有符号整数\n9. `Sbyte`:有符号 8 位整数\n10. `Short`:16 位有符号整数\n11. `Uint`:32 位无符号整数\n12.\
  \ `Ulong`:64 位无符号整数\n13. `Ushort`:16 位无符号整数\n\n变量的具体大小取决于所使用的平台，可以通过使用 `Sizeof`\
  \ 方法找到。此表达式将产生以字节为单位的对象所需的存储大小。\n\n**语法**\n```csharp\nusing system;\n\nNamespace\
  \ dataclass application\n\n{\n\nClass program\n{\n\n    Static void main (string\
  \ [] args)\n    {\n        Console.Write line (size of int: {0}, Sizeof (int));\n\
  \        Console. ReadiLine ()\n    }\n}\n\n}\n```\n\n\n\n你并不会在引用类（reference class）中实际存储任何数据。基本上，你只是在引用程序内存中的一个位置。当你使用多个变量时，你的引用类将指向这些类所处的位置。如果该位置上的数据被某个变量修改，那么另一个变量将自动反映该变化。\n\
  \n## 对象类 (OBJECT CLASS)\n\n此类将成为你在 C# 中找到的每个数据类的基类。CTS（公共类系统）在使用系统时会使用一个别名：`Object\
  \ class`。只要该类是由程序预定义的或由用户定义的，此对象类就有被赋值给本章将要讨论的其他类的选项。在你有赋值选项之前，它需要进行转换。\n\n每当对象类被转换时，它将被称为“装箱”（boxing），当它被转换为值类时，它被称为“拆箱”（unboxing）。\n\
  \n## 动态 (DYNAMIC)\n\n任何类的任何值都可以存储在 `dynamic` 类中。你需要检查这些类型的变量，因为它们发生在运行时。`dynamic`\
  \ 类与对象类类似，但对象的类检查是在编译时进行的。\n\n### 语法\n\n```\nDynamic < variable_ name> = value;\n\
  ```\n\n## 字符串类 (STRING CLASS)\n\n此类允许你为任何变量分配任何字符串值。字符串类在系统字符串类中包含一个别名。此类也继承自对象类。你会发现字符串类的值是通过字符串字面量赋值的，字符串字面量有两种形式：带引号的和带\
  \ `@` 符号的（quoted）。\n\n用户定义的引用类被称为接口（interface）、委托（delegate）和类（class）。\n\n## 指针类\
  \ (POINTER CLASS)\n\n指针变量将存储其他类的内存地址。这些指针具有与其它 C 语言中的指针相同的能力。\n\n### 语法\n\n```\n\
  Class * identifier;\n```\n\n# 第七章\n\n![](img/00001.jpeg)\n\n## C# 中的类转换\n\nC# 类转换是将将一个数据类转换为另一个数据类的行为。你可能也知道这些转换称为类强制转换（class\
  \ casting）。你会发现有两种不同类型的强制转换。\n\n1. `隐式转换` (Implicit conversion)：在此转换下转换的类将由 C# 以与被转换类相同的方式进行执行。例如，当\
  \ `convariations` 从最小到最大转换时，这将使你的 `convariations` 派类转换为基类。\n2. `显式转换` (Explicit\
  \ conversion)：显式转换由用户在处理预定义函数时完成。这些转换需要强制转换运算符。\n\n### 语法\n\n```c\nusing System;\n\
  \nnamespace TypeClassConversionApplication\n{\n\nclass ExplicitConversion\n{\n\n\
  static void Main (string [] args)\n{\n\ndouble d = 5673.74;\n\nint i;\n\n// 将 double\
  \ 转换为 int.\ni = (int)d;\n\nConsole.WriteLine(i);\n\nConsole.ReadKey();\n\n}\n\n\
  }\n\n}\n```\n\n## 转换方法\n\n1. `Toboolean`：布尔类将进行转换\n2. `To byte`：字节将被转换\n3. `Tochar`：单个\
  \ Unicode 字符中的字符将被转换\n4. `Todatime`：你的日期时间结构将进行转换\n5. `Todecimal`：浮点数或整数将转换为小数类。\n\
  6. `Todouble`：类将转换为 double 类\n7. `Toint16`：类将转换为 16 位整数\n8. `Toint32`：类将转换为 32 位整数\n\
  9. `Toin64`：类将转换为 64 位整数\n10. `Tosbyte`：你的类将转换为有符号字节类\n11. `Tosingle`：类将转换为浮点数，但它很小\n\
  12. `To string`：你的类将转换为字符串\n13. `To class`：你的类将转换为你指定的类\n14. `Touint16`：你将拥有无符号\
  \ int 类\n15. `Touint32`：你将拥有无符号 long 类\n16. `Touint64`：你将得到一个无符号整数。\n\n**示例：**\n\
  \n```csharp\nusing System;\n\nnamespace ClassConversionApplication\n{\n\nclass StringConversion\n\
  {\n\nstatic void Main (string [] args)\n{\n\nint i = 75;\n\nfloat f = 53.005f;\n\
  \ndouble d = 2345.7652;\n\nbool b = true;\n\nConsole.WriteLine(i.ToString());\n\n\
  Console.WriteLine(f.ToString());\n\nConsole.WriteLine(d.ToString());\n\nConsole.WriteLine(b.ToString());\n\
  \nConsole.ReadKey();\n\n}\n\n}\n\n}\n```\n\n\n![](img/00001.jpeg)\n\n# C# 中的变量\n\
  \n变量本质上除了被放置在用于操作的存储区域中的一个名称外，什么也不是的。每个变量都将包含一个特定的类，其中大小将被确定，以及变量内存的布局。每块内存都都有一个存储在内部的值范围，以及一组可以应用于每个变量的操作。\n\
  \nC# 提供的某些基本值类包括：\n\n1. `整数类`：`char`, `ulong`, `long`, `uint`, `int`, `ushort`,\
  \ `short`, `byte`, `sbyte`\n2. `浮点数`：`double` 和 `float`\n3. `小数类`：`decimal`\n4.\
  \ `布尔`：`true`, `false`, `assigned`\n5. `可空类`：`nullable`\n\nC# 让你能够使用 `class` 和 `enum`\
  \ 等变量来定义值类。\n\n## 定义变量\n\n### 语法\n\n```\n<data_class> <variable_lists>;\n```\n\n\
  数据类必须是 C# 数据类的一部分并且必须是有效的。你的变量列表必须包含至少一个标识符，并用逗号分隔。\n\n**变量定义：**\n\n`int i, j, k;`\n\
  `char c, ch;`\n`float f, salary;`\n`double d;`\n\n### 初始化变量\n\n在初始化变量时，将有一个等号，后面跟着一个常量表达式。\n\
  \n### 语法\n\n```\nVariable_name = value;\n```\n\n你可以在声明内部初始化变量。此初始化器将有一个等号，后面跟着一个常量表达式\n\
  \n### 语法\n\n```\n<data_class> <variable_name> = value;\n```\n\n**示例：**\n\n```csharp\n\
  int d = 3, f = 5; /* 初始化 d 和 f. */\nbyte z = 22; /* 初始化 z. */\ndouble pi = 3.14159;\
  \ /* 声明 pi。 */\nchar x = 'x'; /* 变量 x 的值为 'x'. */\n```\n\n你需要正确的方式初始化变量，否则程序将给你非预期的结果。\n\
  \n**示例：**\n\n```csharp\nusing System;\n\nnamespace VariableDefinition\n{\n\nclass\
  \ Program\n{\n\nstatic void Main(string[] args)\n{\n\nshort a;\n\nint b;\n\ndouble\
  \ c;\n\n/* 实际初始化 */\na = 10;\n\nb = 20;\n\nc = a + b;\n\nConsole. WriteLine(\"a\
  \ = {0}, b = {1}, c = {2}\", a, b, c);\n\nConsole.ReadLine();\n\n}\n\n}\n\n\n**从用户接受值**\n\
  \n你的 `console` 类可以在 `system` 命名空间中找到，它将提供一个名为 `readline()` 的函数，可以使用它来接受来自用户的输入并存储在变量中。\n\
  \n**示例：**\n\n```csharp\nint num;\nnum = Convert.ToInt32(Console.ReadLine());\n```\n\
  \n## 左值和右值表达式\n\n在 C# 中你会发现两种不同的表达式\n\n1. `右值` (Rvalue)：此表达式将出现在工作的右侧，而不是左侧。\n2.\
  \ `左值` (Lvalue)：这将在出现在工作时的左侧或右侧。\n\n`lvalues` 的变量将使它们出现在左侧。数字字面量将是 `r values`，这解释了为什么它们无法赋值，因此不能出现在大脑的左侧。\n\
  \n\n\n\n你的常量将引用一个在程序执行代码期间固定且无法更改的值。这些固定的值被称为字面量。常量可以是任何数据类型，例如整数或字符。你也可以拥有枚举常量。\n\
  \n你可以像普通变量一样对待你的常量，区别在于你的值在定义后将不会改变。\n\n## 整数字面量\n\n整数字面量是指如十进制或十六进制等内容。前缀会告诉你基数或进制制。当你处理十六进制时，前缀将是\
  \ `0x` 或 `0X`，但十进制没有前缀。\n\n你的整数字面量还可以使用 `U` 和 `L` 作为无符号（unsigned）和长型（long）的后缀。后缀可以是大写或小写。\n\
  \n### 示例\n\n```\n85 /* decimal */\n0x4b /* hexadecimal */\n30 /* int */\n30u /*\
  \ unsigned int */\n30l /* long */\n30ul /* unsigned long */\n```\n\n## 浮点数字面量\n\n\
  浮点字面量由四个部分组成：指数、小数部分、整数、小数点。你还可以用指数形式或十进制形式表示这些字面量。\n\n### 示例\n\n```\n3.14159 /*\
  \ Legal */\n314159E-5F /* Legal */\n510E /* Illegal: incomplete exponent */\n210f\
  \ /* Illegal: no decimal or exponent */\n.e55 /* Illegal: missing integer or fraction\
  \ */\n```\n\n当使用十进制形式时，你需要确保包含小数点、指数，甚至两者都有。对于指数形式，你需要包含整数部分、小数部分，或者如果你愿意，也可以都包含。对于符号指数，你将使用\
  \ `e` 或 `E`。\n\n## 字符常量\n\n字符字面量由单引号包围并存储在 `char` 类中。这些字面量可以是普通字符甚至是转义序列，你甚至可能会看到通用字符。\n\
  \n在 C# 中使用的某些字符前面会有反斜杠，这意味着它们具有特殊含义并以不同的方式表示。\n\n转义序列有：\n\n1. `\\xhh`: 带有位数的十六进制\n\
  2. `\\\\`: \\字符\n3. `\\v`: 垂直制表符\n4. `\\’`: ‘字符\n5. `\\t`: 水平制表符\n6. `\\”`: “字符\n\
  7. `\\r`: 回车符\n8. `\\?`: ?字符\n9. `\\n`: 换行符\n10. `\\a`: 警报\n11. `\\f`: 分页符\n12.\
  \ `\\b`: 退格\n\n### 示例\n\n```csharp\nusing System;\n\nnamespace EscapeChar\n{\nclass\
  \ Program\n{\nstatic void Main(string[] args)\n{\nConsole.WriteLine(\"Hello\\tWorld\\\
  n\\n\");\nConsole.ReadLine();\n}\n}\n}\n```\n## 字符串字面量\n\n字符串字面量或常量由双引号包围，或包含 @\
  \ 符号。这些字符串充满了与字符字面量类似的字符。\n\n只要使用空格进行分离处理，长行可以通过字符串字面量拆分为多行。\n\n### 示例\n\n```\n\"\
  hello, dear\"\n\"hello, \\\ndear\"\n\"hello, \" \"d\" \"ear\"\n@\"hello dear\"\n\
  ```\n\n## 定义常量\n\n常量通过使用 `const` 关键字定义。\n\n### 语法\n\n`const <data_class> <constant_name>\
  \ = value;`\n\n### 示例\n\n```csharp\nusing System;\n\nnamespace DeclaringConstants\n\
  {\nclass Program\n{\nstatic void Main(string[] args)\n{\nconst double pi = 3.14159;\n\
  // constant declaration\ndouble r;\nConsole.WriteLine(\"Enter Radius: \");\nr =\
  \ Convert.ToDouble(Console.ReadLine());\ndouble areaCircle = pi * r * r;\nConsole.WriteLine(\"\
  Radius: {0}, Area: {1}\", r, areaCircle);\nConsole.ReadLine();\n}\n}\n}\n```\n\n\
  \n![](img/00001.jpeg)\n\n# C# 运算符\n\n运算符是告知编译器在数学或逻辑表达式中执行什么操作的符号。C# 内置了某些运算符，例如：\n\
  \n1. 杂项\n2. 算术\n3. 赋值\n4. 关系\n5. 位运算\n6. 逻辑\n\n## 算术运算符\n\n1. 加法 (`+`)\n2. 减法 (`-`)\n\
  3. 乘法 (`*`)\n4. 除法 (`/`)\n5. 取模 (`%`)\n6. 加一 (`++`)\n7. 减一 (`--`)\n\n## 关系运算符\n\n\
  1. 值是否为真？ (`==`)\n2. 值是否相等 (`!=`)\n3. 大于 (`>`)\n4. 小于 (`<`)\n5. 大于或 (` (`>=`)\n\
  6. 小于等于 (`<=`)\n\n## 逻辑运算符\n\n1. 逻辑与 (`&&`)\n2. 逻辑或 (`||`)\n3. 逻辑非 (`!`)\n\n## 位运算\n\
  \n1. 二进制与 (`&`)\n2. 二进制或 (`|`)\n3. 二进制异或 (`^`)\n4. 二进制按位取反 (`~`)\n5. 二进制左移 (`<<`)\n\
  6. 二进制右移 (`>>`)\n\n## 赋值运算符\n\n1. 赋值 (`=`)\n2. 相加并赋值 (`+=`)\n3. 减法并赋值 (`-=`)\n4.\
  \ 乘法并赋值 (`*=`)\n5. 除法并赋值 (`/=`)\n6. 取模并赋值 (`%=`)\n7. 左移并赋值 (`<<=`)\n8. 右移并赋值 (`>>=`)\n\
  9. 位与并赋值 (`&=`)\n10. 位异或并赋值 (`^=`)\n11. 位或并赋值 (`|=`)  *(注：原文!=此处为误，应为|=，此处保留原文意图或修正逻辑)*\n\
  \n## 杂项\n\n1. `Sizeof()`\n2. `Classof()`\n3. 变量地址 (`&`)\n4. 变量指针 (`*`)\n5. 三元表达式\
  \ (`? :`)\n6. 对象类型判断 (`is`)\n7. 如果类型转换失败时不抛出异常 (`as`)\n\n## 运算符优先级\n\nC# 中的优先级会告诉你哪一组项先求值。某些运算符的优先级高于其他运算符，例如乘法的优先级高于加法。\n\
  \n这里是 C# 的优先级：\n\n1. 后置：`()`, `[]`, `.`, `++`, `--`\n2. 一元：`+`, `-`, `!`,`~`, `++`,\
  \ `--`, `(class)*`, `&`, `Sizeof`\n3. 乘法：`*`, `/`, `%`\n4. 加法：`+`, `-`\n5. 移位：`<<`,\
  \ `>>`\n6. 关系：`<`, `<=`, `>`, `>=`\n7. 等：==`, `!=`\n8. 位与：`&`\n9. 位异或：`^`\n10. 位或：`|`\n\
  11. 逻辑与：`&&`\n12. 逻辑或：`||`\n13. 三元：`?:`\n14. 赋值： `=`, `+=`, `-=`, `^=`, `/=`, `%=`,\
  \ `=>`, `>=`, `<<=`, `&=`, `^=`, `|=`\n15. 逗号：`,`\n\n\n![](img/00001.jpeg)\n\n#\
  \ 使用 C# 进行决策\n\n你将使用 C# 中的决策机制来学习程序是如何工作的。决策的结构意味着你需要告诉程序哪些条件需要评估和测试，以及在条件为真或假时需要执行的语句。\n\
  \n## 决策语句\n\n1. If 语句：有一个布尔表达式。\n2. If-else 语句：这是一个后面跟着 else 语句的 if 语句。\n3. 嵌套语句：嵌套在另一个语句内部的语句。\n\
  4. Switch 语句：此语句允许对变量进行相等性测试。\n5. 嵌套 switch 语句：放在另一个 switch 语句内部的 switch 语句。\n\n\
  ### ? : 运算符\n\n该运算符可以代替 if-else 语句。\n\n### 语法\n\n`Expression one ? expression two\
  \ : expression three;`\n\n该表达式的值取决于 expression one 的评估结果是否为真。如果是，则将评估 expression\
  \ 二 并作为问号的值。然而，如果 expression one 被判断为假，则 expression 三 将求值并成为你的表达式的值。\n\n# 第十二章\n\
  \n![](img/00001.jpeg)\n\n## 循环\n\n在某些情况下，你会发现自己需要连续执行多次特定的代码块。语句是按照它们编写的顺序执行的。\n\
  \n大多数编程语言都会提供控制结构，允许你处理更复杂的执行路径。循环允许语句执行多次，而不需要不断编写需要执行的语句。\n\n1. While 循环：如果条件为真，则重复所选语句。\n\
  2. For 循环：语句将执行并缩写，以便管理循环变量。\n\n\n\n\n\n3. `while loop`：条件将在循环体结束时进行测试。\n\n4. `Nested\
  \ loop`：和其他嵌套语句一样，这是在一个循环内部的另一个循环。\n\n## 循环控制语句\n\n控制语句将改变循环的执行方式，使其脱离正常执行。每当执行离开作用范围时，任何自动对象将被销毁。\n\
  \n1. `Break statement`：循环或 `switch` 语句将终止，同时执行循环或 switch 之后的语句。\n\n2. `Continue\
  \ statement`：循环将跳过其所有的循环体，并在再次迭代之前测试条件。\n\n## 死循环\n\n当循环的条件从未被判定为假时，循环就会属于这一类别。`for`\
  \ 循环通常属于这一类。由于三个表达式中的任何一个都不是要求的，你可以通过留空条件表达式来导致死循环的发生。\n\n### 示例\n\n```csharp\n\
  using System;\n\nnamespace Loops\n\n{\n\nclass Program\n{\n\nstatic void Main(string[]\
  \ args)\n{\n\nfor (; ; )\n{\n\nConsole.WriteLine(\"Hey! I am Trapped\");\n\n}\n\n\
  }\n\n}\n\n}\n```\n\n只要条件表达式不存在，就会被假设为真。你可能会发现你必须初始化增量表达式。然而，许多程序员使用 `for (; ; )`\
  \ 来构建一个死循环。\n\n# 第十三章\n\n![](img/00001.jpeg)\n\n## C# 中的封装\n\n你将封装定义为将一个或多个项目封装在一个逻辑或物理包内部。封装是在面向对象的编程语言内部完成的，这种方法最终防止了对实现细节的访问。\n\
  \n抽象和封装是你只能在面向对象编程中找到的。然而，抽象将代码中的相关信息变为可见的代码，而封装允许程序员在代码中实现他们想要的抽象级别。\n访问修饰符可以实现封装。访问修饰符定义了类成员的作用范围和可见性。这些是\
  \ C# 支持的标识符。\n\n1. `Protected internal`\n2. `Open`\n3. `Internal`\n4. `Private`\n\
  5. `Protected`\n\n## OPEN\n\n这些修饰符允许类显示成员变量和函数，以便其他对象和函数可见。当成员为 `Open` 时，可以从外部访问它。\n\
  \n### 示例\n\n```csharp\nusing System;\n\nnamespace RectangleApplication\n\n{\n\n\
  class Rectangle\n{\n\n//member variables\n\nOpen double length;\n\nOpen double width;\n\
  \nOpen double GetArea()\n{\n\nreturn length * width;\n\n}\n\nOpen void Display()\n\
  {\n\nConsole.WriteLine(\"Length: {0}\", length);\n\nConsole.WriteLine(\"Width: {0}\"\
  , width);\n\nConsole.WriteLine(\"Area: {0}\", GetArea());\n\n}\n\n}//end class Rectangle\n\
  \nclass PerformRectangle\n{\n\nstatic void Main(string[] args)\n{\n\nRectangle r\
  \ = new Rectangle();\n\nr.length = 4.5;\n\nr.width = 3.5;\n\nr.Display();\n\nConsole.ReadLine();\n\
  \n}\n\n}\n\n}\n```\n\n在这个示例中，你可以看到成员变量 `length` 和 `width` 将是 `Open` 的，以便可以通过类名从你的函数中访问它们。你的成员函数只有直接访问变量的能力，而无需使用任何类实例。它们还通过使用\
  \ `main()` 函数声明为 `Open`。\n\n## PRIVATE\n\n`Private` 修饰符允许类向代码中的其他内容隐藏成员变量和函数。只有在同一个类中的函数才有权访问私有成员。甚至存在类无法访问私有成员的情况。\n\
  \n### 示例\n\n```csharp\nusing System;\n\nnamespace RectangleApplication\n\n{\n\n\
  class Rectangle\n{\n\n//member variables\nprivate double length;\n\nprivate double\
  \ width;\n\nOpen void Acceptdetails()\n\n{\n\nConsole.WriteLine(\"Enter Length:\
  \ \");\n\nlength = Convert.ToDouble(Console.ReadLine());\n\nConsole.WriteLine(\"\
  Enter Width: \");\n\nwidth = Convert.ToDouble(Console.ReadLine());\n\n}\n\nOpen\
  \ double GetArea()\n{\n\nreturn length * width;\n\n}\n\nOpen void Display()\n{\n\
  \nConsole.WriteLine(\"Length: {0}\", length);\n\nConsole.WriteLine(\"Width: {0}\"\
  , width);\n\nConsole.WriteLine(\"Area: {0}\", GetArea());\n\n}\n\n}//end class Rectangle\n\
  \nclass PerformRectangle\n{\n\nstatic void Main(string[] args)\n{\n\nRectangle r\
  \ = new Rectangle();\n\nr.Acceptdetails();\n\nr.Display();\n\nConsole.ReadLine();\n\
  \n}\n\n}\n\n}\n```\n\n在上面的示例中，成员变量被声明为 `private`，因此函数无法访问它们。然而，成员函数将显示这些变量。由于成员函数是\
  \ `open` 的，因此可以通过使用类名的实例从主函数中访问它们。\n\n## PROTECTED 访问修符\n\n此修饰符允许子类访问其基类中的成员变量和函数。这在你处理继承时会非常有帮助。\n\
  \n## INTERNAL 访问修饰符\n\n`internal` 访问修饰符允许成员函数和变量暴露给你正在工作的程序集中的其他函数和对象。因此，只要它定义在定义成员的应用程序中，你就可以访问任何类或方法。\n\
  \n### 示例\n\n```csharp\nusing System;\n\nnamespace RectangleApplication\n\n{\n\n\
  class Rectangle\n{\n\n//member variables\n\ninternal double length;\n\ninternal\
  \ double width;\n\ndouble GetArea()\n{\n\nreturn length * width;\n\n}\n\nOpen void\
  \ Display()\n{\n\nConsole.WriteLine(\"Length: {0}\", length);\n\nConsole.WriteLine(\"\
  Width: {0}\", width);\n\nConsole.WriteLine(\"Area: {0}\", GetArea());\n\n}\n\n}//end\
  \ class Rectangle\n\nclass PerformRectangle\n{\n\nstatic void Main(string[] args)\n\
  {\n\nRectangle r = new Rectangle();\n\nr.length = 4.5;\n\nr.width = 3.5;\n\nr.Display();\n\
  \nConsole.ReadLine();\n\n}\n\n}\n\n}\n```\n\n此示例显示成员函数没有使用提供访问的修饰符声明。因此，由于它是私有的，没有提到类成员的默认访问修饰符。\n\
  \n## PROTECTED INTERNAL 访问修饰符\n\n此修饰符将一个类的成员变量和函数从其他类对象和函数隐藏，除了同一应用程序中的子类情况外。你在实现继承时将使用这种方法。\n\
  \n# 第十四章\n\n![](img/00001.jpeg)\n\n## C# 中使用的方法\n\n方法是按顺序工作的以执行任务的语句组。C# 中的每个程序都将有一个类方法\
  \ `main`。\n\n为了使用方法，你必须：\n\n1. 定义你的方法\n2. 调用你的方法\n\n## 定义方法\n\n每当定义方法时，你必须声明该结构的元素。\n\
  \n**语法**\n\n```\n<access specifier> <return class> <method name> (parameter list)\n\
  \n{\n\nMethod body\n}\n```\n\n方法的某些元素是：\n\n1. `access specifier`：变量的可见性将由另一个类决定。\n\
  2. `return class`：方法将返回一个值。这个返回的类将返回给你的值的数据类型。如果方法不返回值，则返回类将是 `void`。\n3. `method\
  \ name`：方法名是区分大小写的标识符。它不会与类中声明的其他标识符相同。\n4. `parameter list`：在括号之间的参数将用于从正在使用的方法中传递和获取数据。参数是指方法正在使用的参数的顺序、数量和类型。参数并不必须使用。\n\
  \n\n\n\n\n## 5. 方法体：这里将是你的指令，你需要它们来完成需要执行的步骤。\n\n### 示例\n\n```csharp\nclass NumberManipulator\n\
  {\n    Open int FindMax(int num1, int num2)\n    {\n        /* local variable declaration\
  \ */\n        int result;\n        if (num1 > num2)\n            result = num1;\n\
  \        else\n            result = num2;\n        return result;\n    }\n    ...\n\
  }\n```\n\n## 调用方法\n\n通过使用你想要调方法的名称来调用方法。\n\n### 示例\n\n```csharp\nusing System;\n\
  namespace CalculatorApplication\n{\nclass NumberManipulator\n{\n    Open int FindMax(int\
  \ num1, int num2)\n    {\n        /* local variable declaration */\n        int\
  \ result;\n        if (num1 > num2)\n            result = num1;\n        else\n\
  \            result = num2;\n        return result;\n    }\n    static void Main(string[]\
  \ args)\n    {\n        /* local variable definition */\n        int a = 100;\n\
  \        int b = 200;\n        int ret;\n        NumberManipulator n = new NumberManipulator();\n\
  \        //调用 FindMax 方法\n        ret = n.FindMax(a, b);\n        Console. WriteLine(\"\
  Max value is : {0}\", ret);\n        Console.ReadLine();\n    }\n}\n```你还可以从其他类调用\
  \ Open 方法的方法。\n\n### 示例\n\n```csharp\nusing System;\nnamespace CalculatorApplication\n\
  {\nclass NumberManipulator\n{\n    Open int FindMax(int num1, int num2)\n    {\n\
  \        /* local variable declaration */\n        int result;\n        if (num1\
  \ > num2)\n            result = num1;\n        else\n            result = num2;\n\
  \        return result;\n    }\n}\nclass Test\n{\n    static void Main(string[]\
  \ args)\n    {\n        /* local variable definition */\n        int a = 100;\n\
  \        int b = 200;\n        int ret;\n        NumberManipulator n = new NumberManipulator();\n\
  \        //调用 FindMax 方法\n        ret = n.FindMax(a, b);\n        Console. WriteLine(\"\
  Max value is : {0}\", ret);\n        Console.ReadLine();\n    }\n}\n```\n\n## 递归调用\n\
  \n这种方法是它自身的调用，被称为递归。\n\n### 示例\n\n```csharp\nusing System;\nnamespace CalculatorApplication\n\
  {\nclass NumberManipulator\n{\n    Open int factorial(int num)\n    {\n        /*\
  \ local variable declaration */\n        int result;\n        if (num == 1)\n  \
  \      {\n            return 1;\n        }\n        else\n        {\n          \
  \  result = factorial(num - 1) * num;\n            return result;\n        }\n \
  \   }\n    static void Main(string[] args)\n    {\n        NumberManipulator n =\
  \ new NumberManipulator();\n        //调用 factorial 方法\n        Console. WriteLine(\"\
  Factorial of 6 is : {0}\", n.factorial(6));\n        Console. WriteLine(\"Factorial\
  \ of 7 is : {0}\", n.factorial(7));\n        Console. WriteLine(\"Factorial of 8\
  \ is : {0}\", n.factorial(8));\n        Console.ReadLine();\n    }\n}\n```\n\n##\
  \ 向方法传递参数\n\n每当调用参数时，必须将参数传递到方法。至少有三种方法可以传递：\n\n1. 值参数：将参数的值复制到函数的形式参数中。这样做后，对参数的任何更改都不会影响参数。\n\
  2. 引用参数：你的引用将复制到形式参数的内存位置。这意味着你对参数所做的更改将影响参数。\n3. 输出参数：你将获得多一个值。\n\n\n![](img/00001.jpeg)\n\
  \n# C# 中的可空类型\n\n可空类型是特殊数据类型，可以将范围赋值为 null。\n\n你可以存储从 -2,147,483,648 到 2,147,483,647\
  \ 之间的任何值。你也可以分配 true、false 或 null 输出。\n\n### 语法\n\n`<data_class> ? <variable_name>\
  \ = null;`\n\n### 示例\n\n```csharp\nusing System;\nnamespace CalculatorApplication\n\
  {\nclass NullablesAtShow\n{\n    static void Main(string[] args)\n    {\n      \
  \  int? num1 = null;\n        int? num2 = 45;\n        double? num3 = new double?();\n\
  \        double? num4 = 3.14157;\n        bool? boolval = new bool?();\n       \
  \ //显示值\n        Console. WriteLine(\"Nullables at Show: {0}, {1}, {2}, {3}\", num1,\
  \ num2, num3, num4);\n        Console. WriteLine(\"A Nullable boolean value: {0}\"\
  , boolval);\n        Console.ReadLine();\n    }\n}\n}\n```\n\n# 合并运算符 ( ?? )\n\n\
  当使用可空类型和引用类型时可以使用合并运算符。你使用合并运算符将操作数转换为另一个可能的可空类型操作数。\n\n如果第一个操作数为 null，那么当运算符返回第二个操作数时，它将返回第一个操作数的值。\n\
  \n### 示例\n\n```csharp\nusing System;\nnamespace CalculatorApplication\n{\nclass\
  \ NullablesAtShow\n{\n    static void Main(string[] args)\n    {\n        double?\
  \ num1 = null;\n        double? num2 = 3.14157;\n        double num3;\n        num3\
  \ = num1 ?? 5.34;\n        Console. WriteLine(\" Value of num3: {0}\", num3);\n\
  \        num3 = num2 ?? 5.34;\n        Console. WriteLine(\" Value of num3: {0}\"\
  , num3);\n        Console.ReadLine();\n    }\n}\n}\n```\n\n\n![](img/00001.jpeg)\n\
  \n# C# 中的数组\n\n数组存储固定大小顺序的对象或数据类型集合。数组可以用于存储作为数组比不同数据类型更有用的数据集合。它还使其存储在连续的内存位置上。\n\
  \n与其声明单独变量，你可以在数组中声明一个数字变量，并使用方括号表示单独变量。你的变量将有一个索引，用于访问该元素。数组由连续内存位置组成，最低地址指向第一个元素。\n\
  \n## 声明数组\n\n### 语法\n\n`<dataclass>[] name;`\n\n1. `dataclass` 告诉你是什么类。\n2. 方括号\
  \ `[]` 告诉你秩（rank）。秩告诉大小。\n3. `name` 显然告诉你数组的名称。\n\n### 示例\n\n```csharp\nDouble [\
  \ ] hello\n```\n\n## 数组初始化\n\n当声明数组时，需要在内存中初始化数组。数组被称为引用类型，这意味着你需要使用 `new` 关键字来实例化。\n\
  \n### 示例\n\n```csharp\nDouble [ ] hello = new double [ 3 ]\n```\n\n## 给数组赋值\n\n\
  值可以通过索引分配给数组元素。你可以通过在数组名称后的一组方括号内放置元素的索引来这样做。\n\n### 示例\n\n```csharp\nusing System;\n\
  namespace CalculatorApplication\n{\nclass MyArray\n{\n    static void Main(string[]\
  \ args)\n    {\n        int [] n = new int[10]; /* n 是一个 10 个整数数组 */\n        int\
  \ i,j;\n        /* 初始化数组 n 的元素 */\n        for ( i = 0; i < 10; i++ )\n        {\n\
  \            n[ i ] = i + 100;\n        }\n        /* 输出每个数组元素的值 */\n        for(j\
  \ = 0; j < 10; j++ )\n        {\n            Console. WriteLine(\"Element[{0}] =\
  \ {1}\", j, n[j]);\n        }\n        Console.ReadKey();\n    }\n}\n}\n```\n\n\
  ## for each 循环\n\nfor each 语句将用于遍历数组。\n\n### 示例\n\n```csharp\nusing System;\nnamespace\
  \ CalculatorApplication\n{\nclass MyArray\n{\n    static void Main(string[] args)\n\
  \    {\n```\n\n\n\n\n\n```cs\nint [] n = new int[10]; /* n 是一个包含 10 个整数的数组 */\n\n\
  /* 初始化数组 n 的元素 */\nfor ( int i = 0; i < 10; i++ )\n{\n    n[i] = i + 100;\n}\n\n\
  /* 输出每个数组元素的值 */\nforeach (int j in n )\n{\n    int i = j-100;\n    Console. WriteLine(\"\
  Element[{0}] = {1}\", i, j);\n}\nConsole.ReadKey();\n}\n}\n}\n```\n\n# 数组\n\n1.\
  \ 多维数组\n2. 锯齿数组\n3. 将数组传递给函数\n4. 参数数组 (Param array)\n5. 数组类\n\n# 第十七章\n\n![](img/00001.jpeg)\n\
  \n## C# 中的字符串\n\n在 C# 中，你可以将字符串当作数组使用。但更常用的操作之一是使用 `string` 关键字来声明字符串变量。`string`\
  \ 关键字是 `System.String` 的别名。\n\n## 创建字符串对象可以通过以下方式创建 `String` 对象：\n\n1. 调用格式化方法以将值或对象转换为字符串表示\n\
  2. 将字符串字面量赋值给 `string` 变量、获取属性或调用将返回字符串的方法\n3. 使用 `String` 类的构造函数\n4. 使用字符串拼接运算符。\n\
  \n### 示例\n\n```cs\nusing System;\nnamespace StringApplication\n{\nclass Program\n\
  {\nstatic void Main(string[] args)\n{\n// 来自字符串字面量和字符串拼接\nstring fname, lname;\n\
  fname = \"Rowan\";\nlname = \"Atkinson\";\nstring fullname = fname + lname;\nConsole.\
  \ WriteLine(\"Full Name: {0}\", fullname);\n// 使用字符串构造函数\nchar[] letters = { 'H',\
  \ 'e', 'l', 'l','o' };\nstring greetings = new string(letters);\nConsole. WriteLine(\"\
  Greetings: {0}\", greetings);\n// 返回字符串的方法\nstring[] sarray = { \"Hello\", \"From\"\
  , \"Tutorials\", \"Point\" };\nConsole. WriteLine(\"Message: {0}\", message);\n\
  // 用于转换值的格式化方法\nDateTime waiting = new DateTime(2012, 10, 10, 17, 58, 1);\nstring\
  \ chat = String.Format(\"Message sent at {0:t} on {0:D}\", waiting);\nConsole. WriteLine(\"\
  Message: {0}\", chat);\n}\n}\n}\n```\n\n## 字符串类的属性\n\n1. Chars：在 `string` 对象的特定位置获取\
  \ `char` 对象\n2. `Length`：你的 `string` 对象中的字符数量\n\n## 字符串类的方法\n\n`String` 类有许多方法，可以帮助你处理\
  \ `string` 对象的工作更加轻松。\n\n1. `Open static int compare (string strA, string strB)`\n\
  2. `Open static int compare (string strA, string strB, bool ignoreCase )`\n3. `Open\
  \ static string concat (string str0, string str 1)`\n4. `Open static string concat(\
  \ string str0, string str1, string str 2)`\n5. `Open static string concat (string\
  \ str0,string str1, string str2, string str 3)`\n6. `Open bool contains (string\
  \ value)`\n7. `Open static string copy (string str)`\n8. `Open void copyto (int\
  \ sourceindex, char [] destination, int destinationindex, int count)`\n9. `Open\
  \ bool endswith (string value)`\n10. `Open bool equals (string value)`\n11. `Open\
  \ static bool equals (string a, string b)`\n12. `Open static string format (string\
  \ format, object arg 0)`\n13. `Open int index of (char value)`\n14. `Open int index\
  \ of (string value)`\n15. `Open int indexof (char value, int startindex)`\n16. `Open\
  \ int indexof (string value, int start index)`\n17. `Open int indexof any (char\
  \ [] anyof)`\n18. `Open int index of any (char [] anyof, int start index)`\n19.\
  \ `Open string insert (int startindex, string value)`\n20. `Open static bool is\
  \ null or empty (string value)`\n21. `Open static string join (string separator,\
  \ params string [] value)`\n22. `Open static string join (string, string [] value,\
  \ int start index, int count)`\n23. `Open int last index of (char value)`\n24. `Open\
  \ int last index of (string value)`\n25. `Open string remove (int start index)`\n\
  26. `Open string remove (int start index, int count)`\n27. `Open string replace\
  \ (char old char, cha new char)`\n28. `Open string replace (string old value, string\
  \ new value)`\n29. `Open string [] split (params char [] separator)`\n30. `Open\
  \ string [] split (char [] separator, int count)`\n31. `Open bool starts with (string\
  \ value)`\n32. `Open char [] to char ()`\n33. `Open char [] to char array (int start\
  \ index, int length)`\n34. `Open string to lower ()`\n35. `Open string to upper\
  \ ()`\n36. `Open string trim ()`\n\n### 示例\n\n```cs\nusing System;\nnamespace StringApplication\n\
  {\n{\nstatic void Main(string[] args)\n{\nstring str1 = \"This is test\";\nstring\
  \ str2 = \"This is text\";\nif (String.Compare(str1, str2) == 0)\n{\nConsole. WriteLine(str1\
  \ + \" and \" + str2 + \" are equal.\");\n}\nelse\n{\nConsole. WriteLine(str1 +\
  \ \" and \" + str2 + \" are not equal.\");\n}\nConsole.ReadKey() ;\n}\n}\n```\n\n\
  ### 字符串包含包含示例\n\n```cs\nusing System;\nnamespace StringApplication\n{\nclass StringProg\n\
  {\nstatic void Main(string[] args)\n{\nstring str = \"This is test\";\nif (str.Contains(\"\
