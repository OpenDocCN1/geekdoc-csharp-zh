  \ = 0;\nBox1.height = 0;\n// Box 1 指定\nBox1.length = 5.0;\nBox1.breadth = 6.0;\n\
  Box1.height = 7.0;\n// Box 2 指定\nBox2.length = 10.0;\nBox2.breadth = 12.0;\nBox2.height\
