  Length of line : {0}\", line.getLength());\nConsole.ReadKey();\n}\n}\n}\n```\n\n\
  \n\n默认构造函数不会为你提供任何参数，但是，如果你需要一个带有参数的构造函数，有一些参数被称为“参数化构造函数”，它们将帮助在对象创建时为其分配初始值。\n\
  \n### 示例\n\n```csharp\nusing System;\n\nnamespace LineApplication\n{\n\nclass Line\n\
  {\n    private double length; // Length of a line\n\n    Line(double len) //Parameterized\
  \ constructor\n    {\n        Console.WriteLine(\"Object is being created, length\
  \ = {0}\", len);\n        length = len;\n    }\n\n    public void setLength( double\
  \ len )\n    {\n        length = len;\n    }\n\n    public double getLength()\n\
  \    {\n        return length;\n    }\n\n    static void Main(string[] args)\n \
  \   {\n        Line line = new Line(10.0);\n        Console.WriteLine(\"Length of\
  \ line : {0}\", line.getLength());\n        // set line length\n        line.setLength(6.0);\n\
  \        Console.WriteLine(\"Length of line : {0}\", line.getLength());\n      \
  \  Console.ReadKey();\n    }\n}\n\n}\n```\n\n## 析构函数 (DECONSTRUCTOR)\n\n析构函数也是一种特殊函数，当类实例超出作用范围时将会执行。析构函数的名称与类相同，但名称前有一个波浪号（~），并且不能有任何参数或返回值。\n\
  \n当你需要在离开程序之前释放内存时，析构函数将非常有用，但析构函数无法被继承或重载。\n\n### 示例\n\n```csharp\nusing System;\n\
  \nnamespace LineApplication\n{\n\nclass Line\n{\n    private double length; // Length\
  \ of a line\n\n    Line() // constructor\n    {\n        Console.WriteLine(\"Object\
  \ is being created\");\n    }\n\n    ~Line() //destructor\n    {\n        Console.WriteLine(\"\
  Object is being deleted\");\n    }\n\n    public void setLength( double len )\n\
  \    {\n        length = len;\n    }\n\n    public double getLength()\n    {\n \
  \       return length;\n    }\n\n    static void Main(string[] args)\n    {\n  \
  \      Line line = new Line();\n        // set line length\n        line.setLength(6.0);\n\
  \        Console.WriteLine(\"Length of line : {0}\", line.getLength());\n    }\n\
  }\n\n}\n```\n\n# 结\n\n![](img/00001.jpeg)\n\n感谢你坚持到 `C#` 的最后，希望这些内容对你是有启发性的，并能够为你提供实现任何目标所需的所有工具。\n\
