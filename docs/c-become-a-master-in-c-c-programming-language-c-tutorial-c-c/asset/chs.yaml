  \n[content]\n\n7. 每使用 `new` 运算符创建一个 `struct` 对象时，你将创建该对象以及与之对应的构造函数。\n\n8. 如果没有使用\
  \ `new` 运算符，则字段在初始化之前将处于未赋值状态。\n\n# 类 VS 结构\n\n在 C# 中，结构（structure）和类（class）之间至少有三个区别\n\
  \n1. 结构不允许默认构造函数\n2. 类使用引用类（reference classes），而结构（structs）使用值类（value classes）\n\
  3. 结构不能使用继承\n\n### 示例\n\n```csharp\nusing System;\n\nstruct Books\n{\nprivate string\
  \ title;\nprivate string author;\nprivate string subject;\nprivate int book_id;\n\
  \nOpen void getValues(string t, string a, string s, int id)\n{\ntitle = t;\nauthor\
  \ = a;\nsubject = s;\nbook_id = id;\n}\n\nOpen void display()\n{\nConsole. WriteLine(\"\
  Title : {0}\", title);\nConsole. WriteLine(\"Author : {0}\", author);\nConsole.\
  \ WriteLine(\"Subject : {0}\", subject);\nConsole. WriteLine(\"Book_id :{0}\", book_id);\n\
  }\n};\n\nOpen class testStructure\n{\nOpen static void Main(string[] args)\n{\n\
  Books Book1 = new Books(); /* 声明类 Book Book1 */\nBooks Book2 = new Books(); /* 声明类\
  \ Book Book2 */\n/* 书 1 指定 */\nBook1.getValues(\"C Programming\",\n\"Nuha Ali\"\
  , \"C Programming Tutorial\",6495407);\n/* 书 2 指定 */\nBook2.getValues(\"Telecom\
  \ Billing\",\n\"Zara Ali\", \"Telecom Billing Tutorial\", 6495700);\n/* 打印 Book1\
  \ 信息 */\nBook1.display();\n/* 打印 Book2 信息 */\nBook2.display();\nConsole.ReadKey();\n\
  }\n}\n```\n\n# 第十九章\n\n![](img/00001.jpeg)\n\n## C# 中的 枚举\n\n枚举（Enumerations）用于一组命名的整数常量。这些枚举类通过使用\
  \ `enum` 关键字进行声明。\n\nC# 枚举用于值数据值类。最后，枚举将持有它自己的值，并且不会继承或传递继承。\n\n## 声明枚举变量\n\n###\
  \ 语法\n\n```text\nEnum <enum_name>\n{\n枚举列表\n} ;\n```\n\n1. `enum_name` 将是正在使用的枚举类\n\
  2. 枚举列表将是一组由逗号分隔的标识符列表\n\n枚举列表中的每个符号都代表一个特定的整数。大于值将位于任何其他符号之前。默认情况下，你的第一个枚举符号为 0。\n\
  \n示例 `enum num { 1, 2, 3, 4, 5, 6} ;` \n\n### 枚举变量示例\n\n```csharp\nusing System;\n\
  \nnamespace EnumApplication\n{\nclass EnumProgram\n{\nenum Days { Sun, Mon, Tue,\
  \ Wed, Thu, Fri, Sat };\nstatic void Main(string[] args)\n{\nint WeekdayStart =\
  \ (int)Days.Mon;\nint WeekdayEnd = (int)Days.Fri;\nConsole. WriteLine(\"Monday:\
  \ {0}\", WeekdayStart);\nConsole. WriteLine(\"Friday: {0}\", WeekdayEnd);\nConsole.ReadKey();\n\
  }\n}\n}\n```\n\n# 第二十章\n\n![](img/00001.jpeg)\n\n## C# 中发现的类\n\n当定义一个类时，你正在为该数据类定义一个蓝图。你并没有实际定义任何数据，但它定义了类类名的含义。这意味着它将包含类中的对象以及操作将执行的内容。你类中的方法和变量将被称为类的成员。\n\
