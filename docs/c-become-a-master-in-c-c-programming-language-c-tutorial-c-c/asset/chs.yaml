  \n# C# 结构 (STRUCTURES)\n\n在 C# 中，值类可以帮助你创建与该数据类相关的单个变量。使用 `struct` 关键字来创建结构。结构用于表示记录。\n\
  \n## 定义结构\n\n要定义结构，你需要使用 `struct` 语句。该语句用于在程序中定义一个具有多个成员的新数据类。\n\n### 示例\n\n```cs\n\
  using System;\nstruct Books\n{\nstring title;\nstring author;\nstring subject;\n\
  int book_id;\n};\n\nclass testStructure\n{\nstatic void Main(string[] args)\n{\n\
  Books Book1; /* 声明 Books1 类 */\nBooks Book2; /* 声明 Books2 类 */\n/* 指定 book 1 */\n\
  Book1.title = \"C Programming\";\nBook1.author = \"Nuha Ali\";\nBook1.subject =\
  \ \"C Programming Tutorial\";\nBook1.book_id = 649547;\n/* 指定 book 2 */\nBook2.title\
  \ = \"Telecom Billing\";\nBook2.author = \"Zara Ali\";\nBook2.subject = \"Telecom\
  \ Billing Tutorial\";\nBook2.book_id = 649570;\n/* 打印 Book1 信息 */\nConsole. WriteLine(\
  \ \"Book 1 title : {0}\", Book1.title);\nConsole. WriteLine(\"Book 1 author : {0}\"\
  , Book1.author);\nConsole. WriteLine(\"Book 1 subject : {0}\", Book1.subject);\n\
  Console. WriteLine(\"Book 1 book_id :{0}\", Book1.book_id);\n/* 打印 Book2 信息 */\n\
  Console. WriteLine(\"Book 2 title : {0}\", Book2.title);\nConsole. WriteLine(\"\
  Book 2 author : {0}\", Book2.author);\nConsole. WriteLine(\"Book 2 subject : {0}\"\
  , Book2.subject);\nConsole. WriteLine(\"Book 2 book_id : {0}\", Book2.book_id);\n\
  Console.ReadKey();\n}\n}\n}\n```\n\n## C# 结构的特征\n\n由于你已经有了上面示例中创建的结构，你会发现它们与其它 C\
  \ 语言中的结构不同。C# 为结构包含了以下特性：\n\n1. 结构允许拥有方法、字段、属性、事件、运算符方法和索引器。\n2. 这些结构允许拥有构造函数，但不能有析构函数。\n\
  3. 禁止继承。\n4. 你不能作为其他结构或类的基类。\n5. 结构将实现至少一个接口。\n\n\n\n\n\n6. 结构成员不能被指定为保护（protected）、虚（virtual）或抽象（abstract）。\n\
  \n7. 每使用 `new` 运算符创建一个 `struct` 对象时，你将创建该对象以及与之对应的构造函数。\n\n8. 如果没有使用 `new` 运算符，则字段在初始化之前将处于未赋值状态。\n\
  \n# 类 VS 结构\n\n在 C# 中，结构（structure）和类（class）之间至少有三个区别\n\n1. 结构不允许默认构造函数\n2. 类使用引用类（reference\
  \ classes），而结构（structs）使用值类（value classes）\n3. 结构不能使用继承\n\n### 示例\n\n```csharp\n\
  using System;\n\nstruct Books\n{\nprivate string title;\nprivate string author;\n\
  private string subject;\nprivate int book_id;\n\nOpen void getValues(string t, string\
  \ a, string s, int id)\n{\ntitle = t;\nauthor = a;\nsubject = s;\nbook_id = id;\n\
  }\n\nOpen void display()\n{\nConsole. WriteLine(\"Title : {0}\", title);\nConsole.\
  \ WriteLine(\"Author : {0}\", author);\nConsole. WriteLine(\"Subject : {0}\", subject);\n\
  Console. WriteLine(\"Book_id :{0}\", book_id);\n}\n};\n\nOpen class testStructure\n\
  {\nOpen static void Main(string[] args)\n{\nBooks Book1 = new Books(); /* 声明类 Book\
  \ Book1 */\nBooks Book2 = new Books(); /* 声明类 Book Book2 */\n/* 书 1 指定 */\nBook1.getValues(\"\
  C Programming\",\n\"Nuha Ali\", \"C Programming Tutorial\",6495407);\n/* 书 2 指定\
  \ */\nBook2.getValues(\"Telecom Billing\",\n\"Zara Ali\", \"Telecom Billing Tutorial\"\
  , 6495700);\n/* 打印 Book1 信息 */\nBook1.display();\n/* 打印 Book2 信息 */\nBook2.display();\n\
  Console.ReadKey();\n}\n}\n```\n\n\n![](img/00001.jpeg)\n\n## C# 中的 枚举\n\n枚举（Enumerations）用于一组命名的整数常量。这些枚举类通过使用\
  \ `enum` 关键字进行声明。\n\nC# 枚举用于值数据值类。最后，枚举将持有自己的值，并且不会继承或传递继承。\n\n## 声明枚举变量\n\n###\
  \ 语法\n\n```text\nEnum <enum_name>\n{\n枚举列表\n} ;\n```\n\n1. `enum_name` 将是正在使用的枚举类\n\
  2. 枚举列表将是一组由逗号分隔的标识符列表\n\n枚举列表中的每个符号都代表一个特定的整数。大于值将位于任何其他符号之前。默认情况下，你的第一个枚举符号为 0。\n\
  \n示例 `enum num { 1, 2, 3, 4, 5, 6} ;` \n\n### 枚举变量示例\n\n```csharp\nusing System;\n\
  \nnamespace EnumApplication\n{\nclass EnumProgram\n{\nenum Days { Sun, Mon, Tue,\
  \ Wed, Thu, Fri, Sat };\nstatic void Main(string[] args)\n{\nint WeekdayStart =\
  \ (int)Days.Mon;\nint WeekdayEnd = (int)Days.Fri;\nConsole. WriteLine(\"Monday:\
  \ {0}\", WeekdayStart);\nConsole. WriteLine(\"Friday: {0}\", WeekdayEnd);\nConsole.ReadKey();\n\
  }\n}\n}\n```\n\n# 第二十章\n\n![](img/00001.jpeg)\n\n## C# 中发现的类\n\n当定义一个类时，你正在为该数据类定义一个蓝图。你并没有实际定义任何数据，但它定义了类类名的含义。这意味着它将包含类中的对象以及操作将执行的内容。你类中的方法和变量将被称为类的成员。\n\
  \n## 定义类\n\n类定义将以 `class` 关键字开始，后面跟着类名。你的类体将由一对大括号包含。\n\n### 示例\n\n```text\n<access\
  \ specifier> class class_name\n{\n// 成员变量\n<access specifier> <data class> variable1;\n\
  <access specifier> <data class> variable2;\n...\n<access specifier> <data class>\
  \ variableN;\n// 成员方法\n<access specifier> <return class> method1(parameter_list)\n\
  {\n// 方法体\n}\n<access specifier> <return class> method2(parameter_list)\n{\n// 方法体\n\
  }\n...\n<access specifier> <return class> methodN(parameter_list)\n{\n// 方法体\n}\n\
  }\n```\n\n请记住：\n\n1. 为了根据特定的访问规则访问你的修饰符，你将拥有访问成员和类的权限。如果你没有提到任何，将使用默认值，即内部类（internal\
  \ class）。成员的默认值是 `private`。\n2. 数据类需要通过你正在使用的变量类以及返回类来指定，以便如果你在使用其中一个，则数据类方法将按你想要的方式返回。\n\
  3. 为了访问类成员，你需要使用点运算符（dot operator）\n4. 点运算符链接将告诉你对象的名称和成员的名称。\n\n### 示例\n\n```csharp\n\
  using System;\n\nnamespace BoxApplication\n{\nclass Box\n{\nOpen double length;\
  \ // 类的长度\nOpen double breadth; // 类的宽度\nOpen double height; // 类的定义\n}\nclass Boxtester\n\
  {\nstatic void Main(string[] args)\n{\nBox Box1 = new Box(); // 声明类 Box Box1\nBox\
  \ Box2 = new Box(); // 声明类 Box Box2\ndouble volume = 0; // 这里的这里的定义\nBox1.length\
  \ = 0;\nBox1.breadth = 0;\nBox1.height = 0;\n// Box 1 指定\nBox1.length = 5.0;\nBox1.breadth\
  \ = 6.0;\nBox1.height = 7.0;\n// Box 2 指定\nBox2.length = 10.0;\nBox2.breadth = 12.0;\n\
  Box2.height = 13.0;\n// 打印 Box1 信息\nvolume = Box1.length * Box1.breadth * Box1.height;\n\
  Console. WriteLine(\"Volume of Box1 : {0}\", volume);\n// 打印 Box2 信息\nvolume = Box2.length\
  \ * Box2.breadth * Box2.height;\nConsole. WriteLine(\"Volume of Box2 : {0}\", volume);\n\
  Console.ReadKey();\n}\n}\n}\n```\n\n## 成员函数与封装\n\n成员函数是类的一部分，与变量类似，将保持私有以封装。这些函数在类中操作。\n\
  \n### 示例\n\n```csharp\nusing System;\n\n{\nclass Box\n{\nprivate double length;\
  \ // 类的长度\nprivate double breadth; // 类的宽度\nprivate double height; // 类的定义\nOpen\
  \ void setLength( double len )\n{\nlength = len;\n}\n\nOpen void setBreadth( double\
  \ bre )\n{\nbreadth = bre;\n}\n\nOpen void setHeight( double hei )\n{\nheight =\
  \ hei;\n}\n\nOpen double getVolume()\n{\nreturn length * breadth * height;\n}\n\
  }\nclass Boxtester\n{\nstatic void Main(string[] args)\n{\nBox Box1 = new Box();\
  \ // 声明类 Box Box1\nBox Box2 = new Box(); // 声明类 Box Box2\ndouble volume = 0; //\
  \ 这里的这里的定义\nBox1.setLength(5.0);\nBox1.setBreadth(6.0);\nBox1.setHeight(7.0);\n\
  Box2.setLength(10.0);\nBox2.setBreadth(12.0);\nBox2.setHeight(13.0);\n// 打印 Box1\
  \ 信息\nvolume = Box1.getVolume();\nConsole. WriteLine(\"Volume of Box1 : {0}\", volume);\n\
  // 打印 Box2 信息\nvolume = Box2.getVolume();\nConsole. WriteLine(\"Volume of Box2 :\
  \ {0}\", volume);\nConsole.ReadKey();\n}\n}\n}\n```\n\n## 构造函数\n\n类的构造函数是类的一种特殊函数，当在该类中创建新对象时按需要执行。构造函数的名称与类名相同，但你不会得到返回类。\n\
  \n### 示例\n\n```csharp\nusing System;\n\nnamespace LineApplication\n{\nclass Line\n\
  {\nprivate double length; // 类的长度\nOpen Line()\n{\nConsole. WriteLine(\"Object is\
  \ being created\");\n}\n\nOpen void setLength( double len )\n{\nlength = len;\n\
  }\n\nOpen double getLength()\n{\nreturn length;\n}\n\nstatic void Main(string[]\
  \ args)\n{\nLine line = new Line();\n// 设置线条长度\nline.setLength(6.0);\nConsole. WriteLine(\"\
  Length of line : {0}\", line.getLength());\nConsole.ReadKey();\n}\n}\n}\n```\n\n\
