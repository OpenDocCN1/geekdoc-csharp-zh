    1994 年，James Gosling 创建了 `Java` 语言，而 Sun Microsystems 的联合创始人 Bill Joy 则认为 `C#`
    仅仅是 `Java` 语言的模仿。他甚至说道：“C# 就像是删除了可靠性、生产力和安全性的 Java。” Kreft 和 Langer 则反驳道，“Java`
    和 `C#` 几乎是完全相同的编程语言。这种缺乏创新的无聊重复。几乎没有人会声称 `Java` 或 `C#` 是改变了我们编写程序方式的革命性编程语言。而且，`C#`
    从 `Java` 中借鉴了很多，反之亦然。既然 `C#` 支持装箱和拆箱，我们将在 `Java` 中拥有一个非常相似的功能。”


    2000 年后期，Hejlsberg 站出来并表示：“C# 不是 Java 的克隆版本，在设计上更接近 `C++`。”


    自 2005 年发布 2.0 版本以来，`C#` 和 `Java` 沿着不同的轨迹演进，这使得它们彼此不再那么相似。最大的区别之一是语言中引入了泛型，这使得它们与众不同。`C#`
    使用具现化（reification）来提供一等泛型对象，这些对象在类加载时生成代码以执行，能够在其他类中使用。此外，`C#` 还具有许多特性，使其成为一种函数式编程语言，并与
    `C#` 3.0 版本发布的 `LINQ` 扩展协同工作。


    以下是 `C#` 各版本发布时所添加的功能。


    ## 版本 2.0


    1. 委托推断

    2. 泛型

    3. 静态类

    4. 部分类

    5. 委托的协变与逆协变

    6. 匿名方法

    7. 方法组转换

    8. 迭代器

    9. Getter/setter 独立访问访问性

    10. 可空类


    ## 版本 3.0


    1. 部分方法

    2. 隐式类级局部变量

    3. 表达式树

    4. 对象和集合初始化器

    5. Lambda 表达式

    6. 自动实现属性

    7. 查询表达式

    8. 匿名类

    9. 扩展方法


    ## 版本 4.0


    1. 嵌入式互操作类

    2. 动态绑定

    3. 泛型协变与逆协变

    4. 命名参数和可选参数


    ## 版本 5.0


    1. 调用者信息属性

    2. 异步方法


    ## 版本 6.0


    1. 字典初始化器

    2. 编译器服务

    3. 运算符命名

    4. 将静态类成员导入到命名空间

    5. 字符串插值

    6. 异常过滤器

    7. 空传播器

    8. 在 catch/finally 块中使用 Await

    9. 表达式体成员

    10. 自动属性初始化器

    11. 仅限 getter 属性的默认值


    ## 版本 7.0


    1. 表达式体 getter 和 setter

    2. out 变量

    3. 表达式体构造函数和终结器

    4. 模式匹配

    5. 泛型异步返回类型

    6. 元组

    7. ref 返回值和局部变量

    8. 解构

    9. 二进制字面量

    10. 局地函数

    11. 数字分隔符


    ## 版本 7.1


    1. 默认表达式

    2. 异步 main


    # 第三章


    ![](img/00001.jpeg)


    # C# 环境


    `.Net` 是一个运行在自身平台上的框架，旨在帮助你编写 Windows 应用程序、Web 服务和 Web 应用程序。由于该框架设计用于用于几乎任何编程语言，因此它的应用程序可以在多个平台上运行。每种语言都有访问该框架的选项，以便相互通信。


    `.Net` 框架通过包含大量代码库工作，你可以使用 `C#` 使用它们。`.Net` 框架的一些组件包括：


    1. `LINQ`

    2. `CLR`（通用语言运行时）

    3. `WCF`（Windows 通信基础）

    4. .Net Framework 类库

    5. Windows Presentation Foundation

    6. 通用语言规范

    7. `WF`（Windows 工作流基础）

    8. 通用类系统

    9. `ADO. Net`

    10. 元数据和程序集

    11. `ASP. NET` 和 `ASP. Net AJAX`

    12. Windows Forms


    每个组件都会执行不同的任务，你可以通过使用该组件或查看微软提供的文档来了解它们。


    ## 集成开发环境


    还有更多仅凭 `C Sharp` 就可以使用的开发工具，这些是：


    1. Visual Web creator

    2. `VS` (Visual Studio 2010)

    3. `VCE` (Visual C# 2010 Express)


    Web Creator 和 `VCE` 可以在微软官方网站找到。当你使用这些工具时，你将能够编写几乎任何类型的 `C#` 程序。你还可以选择编写源文件，并配合如
    `Notepad` 等基础文本编辑器，这样可以使用命令行提示符（它是 .Net Framework 的一部分）将代码建模成程序集。


    `VCE` 和 Web Creator 是比 Visual Studio 小的版本，并且具有相同的外观。


    安装 Visual Studio 快速版时需要保持稳定的连接。


    ## 在 Linux 和 Mac 上编写程序


    由于 `.Net` 框架是一个 Windows 系统软件功能；当你处理其他系统软件时，还可以使用其他版本。`Mono` 是 `.Net` 框架的一个变体，它可以与
    `C#` 编译器配合工作并在 Linux 和 Mac OS 等多个不同的系统上运行。


    `Mono` 的完全目的是能够运行为 Microsoft `.Net` 构建的应用程序，以便它们能够与其他系统软件（如 Android、iOS、Linux
    和 Unix）开发的工具一起工作。


    # 第四章


    ![](img/00001.jpeg)


    # C# 的程序结构


    在学习构建 `C#` 程序需要什么之前，你必须先了解编程语言是如何构建的。程序中的某些部分对于确保你在创建 `C#` 程序时添加了它们至关重要。


    1. 注释

    2. 命名空间声明

    3. 语句和表达式

    4. 类

    5. `main` 方法

    6. 类方法

    7. 类属性


    示例


    ```csharp

    using system;


    Namespace helloouterspaceapplication

    {


    Class helloouterspace

    {Static void main (tuple [] para)

    {

    /* 你的第一个 C # 程序 */

    Console. Write line (“hello outer space”);

    Console. Ready key ();

    }

    }


    }

    ```


    一旦代码执行，你将得到“Hello outer space”的结果。


    你程序中的第一行是代码中的 `using system` 部分。`using` 关键字为程序包含一个系统的命名空间。大多数 `C#` 程序使用多个 `using`
    语句。


    你的命名空间声明是你所使用的类的集合。你的应用程序名称将是该应用程序的类。


    你的类声明将包含程序最终使用的所有数据和定义。类将包含多个方法，这些方法最终将定义类的行为。但示例中使用的类只有一个名为 `main` 的方法。


    你的 `main` 方法是所有 `C#` 程序的入口点。该方法将规定类何时被执行。


    星号和斜杠会被编译器忽略，因为它们是程序的注释。


    你的 `main` 方法将告诉你你的语句将遵循什么行为。


    `Write line` 是 `console` 类在命名空间中完整写时将使用的方法。这条语句将导致你的结果显示在你面前的屏幕上。


