    # 第一章：C# 概览


    ![](img/00001.jpeg)


    每当 .Net 框架正在开发时，类库是使用托管代码编译器编写的，这被称为 `Simple Managed C`。直到 99 年 1 月，Hejberg 才建立了一个团队开发了这种新语言，简称为
    `Cool`，但实际上是 `C like Object Oriented Language`。当时微软曾考虑将 `Cool` 作为其项目的最终名称，但由于版权原因未采用。


    在 2000 年专业开发者会议上，.Net 项目向业界宣布该语言被更名为 `C#`，类库被命名为 `ASP.Net`，而运行时被移植到了该语言中。


    C# 语言的主要设计师也是微软的首席架构师，并参与了 `Turbo Pascal`、`Embarcadero Delphi`（曾名为 `CodeGear Delphi`）、`Inpris
    Delphi` 和 `BorlandDelphi` 的设计，还参与了 `Visual C++`。


    当你开始使用 C# 时，你会注意到它是由 ECMA（欧洲计算机制造商协会）以及 ISO（国际标准组织）批准、由微软创建的语言，它是为了 CLI（通用语言基础设施）而设计的。


    它的它的原因：


    1. 你可以作为 .Net 框架的一部分使用它

    2. 它是一种通用语言

    3. 你可以跨平台使用

    4. 它是一个面向对象的程序

    5. 它将产生高效的程序

    6. 它是组件化的

    7. 这种语言结构化且易于学习


    虽然 C# 看起来只是 C 语言的另一种变体，但由于以下事实，它更像 Java。


    程序员发现的一些特性：


    1. 它可以与 Windows 集成

    2. 布尔条件

    3. 用于 `LINQ` 和 `Lambda` 的表达式

    4. 自动垃圾回收

    5. 简单的多线程

    6. 标准库

    7. 条件编译

    8. 程序集

    9. 索引器

    10. 属性和事件

    11. 易于使用泛型

    12. 委托和事件管理


    # 第二章：C# 历史


    '
- fmt: '

    In 94, James Gosling created the `Java` language, and Bill Joy who was the co-founder
    for Sun Microsystems said that `C#` was just an imitation of the `Java` language.
    He even went as far to say, “C# is sort of Java with reliability, productivity,
    ad security deleted.” Kreft and Langer came back saying that “Java` and `C#` are
    almost identical programming languages. Boring repetition that lacks innovation.
    Hardly anybody will claim that `Java` or `C#` are revolutionary programming languages
    that changed the way we write programs. And, `C#` borrowed a lot from `Java` and
    vice versa. Now that `C#` supports boxing and unboxing, we will have a very similar
    feature in `Java`.


    Later in 2000 Hejlsberg stepped up and said, “C# is not a Java clone and is much
    closer to `C++` in its design.”


