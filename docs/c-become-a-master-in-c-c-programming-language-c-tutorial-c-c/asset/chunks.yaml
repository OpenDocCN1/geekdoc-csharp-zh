    # C# SYNTAX


    Being that C# is an object-oriented programming language, there are going to be
    objects that you are going to have to use in order to interact with other objects
    so that you create actions. These actions are going to create methods whenever
    they are used. Objects that are the same are going to have class or will be in
    the same class.


    Think of a rectangle for example. The length and width are going to be the attributes
    for the rectangle. Depending on the design of the rectangle the values are accepted
    for those attributes while calculating the area and displaying the details.


    **Example:**


    Using system;


    Namespace circle application


    {


    Class circle


    {


    // variables


    Double width;


    Double circumference


    Open void accept details ()


    {


    Width = 3\. 4


    Circumference = 3.2


    }


    Open double ()


    {


    Return width * circumference


    }


    Open void display ()


    {


    Console. WriteLine (“width: {0}”, width);


    Console. WriteLine (circumference: {0}, circumference);


    }


    }


    Class perform circle


    {


    Static void main (string [] para)


    {


    Circle c = new circle ();


    C accept details ();


    C. display ();


    Console. ReadiLine ();


    }


    }


    }


    For the example shown above, you are going to the measurements for the circle.


    **Using**


    In C# your first statement is always using system;


    The keyword using is used for namespaces in C#.


    **Class**


    You will use this keyword when you are declaring your class.


    **Comments**


    You will use comments whenever you have to explain the code you have created.
    Your C# compilers are going to ignore any comments that you make. A multiple line
    comment is going to start like this /* and end like this */.


    A single line comment will use a set of double slashes.


    **Member variables**


    These variables are going to be the attributes of the members of a class. When
    used they can store data.


    **Member functions**


    The member functions are the statements that are going to carry out the task.
    These functions for classes are typically declared inside of the class.


    **Instantiating a class**


    A class is going to contain the name of the class in the main method of the script.


    **Identifiers**


    Identifiers are going to be words that you use to identify classes, variables,
    and functions. There are three rules for creating identifiers in C#.


    1\. You cannot use a keyword that you find in C#


    2\. You have to start your word with a letter and then follow it with other letters,
    digits, or underscores. But you cannot start with a digit.


    3\. You cannot use any special characters but an underscore.


    **Keywords in C#**


    The keywords are going to be words that are reserved by the compiler in C#. These
    keywords are going to be set to where they cannot be used as identifiers. But,
    if you want to use these words for your identifier, you are going to be able to
    use an at symbol before the word in order to make it valid in C#.


    The identifiers found in C# are going to hold special meanings in your code which
    causes some to be called contextual keywords.


