    Console.ReadKey();


    }


    }


    }


    # CHAPTER TWENTY


    ![](images/00001.jpeg)


    # CLASSES YOU FIND IN C#


    When a class is defined, you are going to be defining a blueprint for that data
    class. You are not going to actually define any data, but it is going to define
    what the name of the class means. This means that it is going to contain the object
    in the class as well as what the operations are going to do. The methods and variables
    in your class are going to be known as the members of the class.


    ## DEFINING A CLASS


    Class definitions are going to start with the keyword of class and will be followed
    by the name of the class. Your class body is going to be enclosed by a pair of
    curly braces.


    **Example**


    <access specifier> class class_name


    {


    // member variables


    <access specifier> <data class> variable1;


    <access specifier> <data class> variable2;


    ...


    <access specifier> <data class> variableN;


    // member methods


    <access specifier> <return class> method1(parameter_list)


    {


    // method body


    }


    <access specifier> <return class> method2(parameter_list)


    {


    // method body


    }


    ...


    <access specifier> <return class> methodN(parameter_list)


    {


    // method body


    }


    }


    Keep in mind:


    1\. In order to access your specifiers by a particular access rule, you are going
    to have access to the members and the class. If you do not mention anything, then
    the default is going to be used which is the internal class. Default for the member
    is going to be private.


    2\. A data class needs to be specified by the class of variable that you are using
    as well as the return class so that the data class method is returned as you want
    it if you are using one.


    3\. In order to access a class member, you need to use the dot operator


    4\. Dot operator links are going to tell you the name of the object and the name
    of the member.


    **Example**


    using System;


    namespace BoxApplication


    {


    class Box


    {


    Open double length; // Length of a box


    Open double breadth; // Breadth of a box


    Open double height; // Height of a box


    }


    class Boxtester


    {


    static void Main(string[] args)


    {


    Box Box1 = new Box(); // Declare Box1 of class Box


    Box Box2 = new Box(); // Declare Box2 of class Box


    double volume = 0.0; // Store the volume of a box here


    // box 1 specification


    Box1.height = 5.0;


    Box1.length = 6.0;


    Box1.breadth = 7.0;


    // box 2 specification


    Box2.height = 10.0;


    Box2.length = 12.0;


    Box2.breadth = 13.0;


    // volume of box 1


    volume = Box1.height * Box1.length * Box1.breadth;


    Console. WriteLine("Volume of Box1 : {0}", volume);


    // volume of box 2


    volume = Box2.height * Box2.length * Box2.breadth;


    Console. WriteLine("Volume of Box2 : {0}", volume);


    Console.ReadKey();


    }


    }


    }


    ## MEMBER FUNCTIONS AND ENCAPSULATION


    The member functions are part of a class with its own definition and protoclass
    inside the class definition which will be similar to other variables. These functions
    operate the objects of a class where the member can access all the members of
    the class of that object.


    The member variables are known as attributes that will be kept private for implementing
    encapsulation. It is these variables that will have access to the Open functions.


    **Example**


    using System;


    namespace BoxApplication


    {


    class Box


    {s


    private double length; // Length of a box


    private double breadth; // Breadth of a box


    private double height; // Height of a box


    Open void setLength( double len )


    {


    length = len;


    }


    Open void setBreadth( double bre )


    {


    breadth = bre;


    }


    Open void setHeight( double hei )


    {


    height = hei;


    }


    Open double getVolume()


    {


    return length * breadth * height;


    }


    }


    class Boxtester


    {


    static void Main(string[] args)


    {


    Box Box1 = new Box(); // Declare Box1 of class Box


    Box Box2 = new Box();


    double volume;


    // Declare Box2 of class Box


    // box 1 specification


    Box1.setLength(6.0);


    Box1.setBreadth(7.0);


    Box1.setHeight(5.0);


    // box 2 specification


    Box2.setLength(12.0);


    Box2.setBreadth(13.0);


    Box2.setHeight(10.0);


    // volume of box 1


    volume = Box1.getVolume();


    Console. WriteLine("Volume of Box1 : {0}" ,volume);


    // volume of box 2


    volume = Box2.getVolume();


    Console. WriteLine("Volume of Box2 : {0}", volume);


    Console.ReadKey();


    }


    }


    }


    ## CONSTRUCTORS


    The constructors for a class are going to be special functions for a class that
    will perform as needed when you create new objects in that class.


    Constructors will have the same name as the name of the class, but you will not
    get a return class.


    **Example**


    using System;


    namespace LineApplication


    {


    class Line


    {


    private double length; // Length of a line


    Open Line()


    {


    Console. WriteLine("Object is being created");


    }


    Open void setLength( double len )


    {


    length = len;


    }


    Open double getLength()


    {


    return length;


    }


    static void Main(string[] args)


    {


    Line line = new Line();


    // set line length


    line.setLength(6.0);


    Console. WriteLine("Length of line : {0}", line.getLength());


    Console.ReadKey();


    }


    }


