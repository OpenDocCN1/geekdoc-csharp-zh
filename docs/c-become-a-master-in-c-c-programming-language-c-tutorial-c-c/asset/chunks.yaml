    # Chapter One: An Overview of C#


    ![](images/00001.jpeg)


    Whenever you begin to use `C#`, you are going to notice that it is a language
    that was created by Microsoft and then approved by the `ECMA` (European Computer
    Manufacturers Association) as well as the `ISO` (International Standards).


    Anders Hejberg developed the language while his team worked on the `.Net` framework.
    It was designed to be used with `CLI` (Common Language Infrastructures).


    Some of the reasons that make it:


    1. You can use it as part of the `.Net` framework

    2. It is a general-purpose language

    3. You can use it across various platforms

    4. It is an object-oriented program

    5. It is going to produce efficient programs

    6. It is component oriented

    7. The language is structured and easy to learn


    While it may seem that `C#` is nothing more than another variation of the C language,
    it is going to resemble `Java` more than it will C due to the fact that it is
    used by programmers all over the world.


    Some of the features that programmers find important:


    1. It can be integrated with Windows

    2. Boolean conditions

    3. Expressions for `LINQ` and `Lambda`

    4. Automatic garbage collection

    5. Multithreading made simple

    6. Standard library

    7. Conditional compilation

    8. Assembly variations

    9. Indexers

    10. Properties and events

    11. Easy to use `Generics`

    12. Delegates and event management


    # Chapter Two: The History of C#


    ![](images/00001.jpeg)


    Whenever the `.Net` framework was being developed, the class libraries were written
    with managed code compilers in a system known as `Simple Managed C`. It was not
    until January of 99 that Hejberg builds a team that built the new language which
    was called `Cool` for short but was really `C like Object Oriented Language`.
    It was then that Microsoft had thought about using `Cool` as the final name for
    their project, however, did not due to copyright reasons.


    The `.Net` project was announced to the Open in 2000 at the Professional Developers
    Conference that the language with the new name of `C#` and the class libraries
    were given the name `ASP.Net` while runtime was ported into the language.


    The principal designer of the `C#` language was also the head architect at Microsoft
    and had been involved in creating the design for `Turbo Pascal`, `Embarcadero
    Delphi` which used to be known as `CodeGear Delphi`, `Inpris Delphi` and `BorlandDelphi`
    as well as working with `Visual C++`. When sitting through interviews and papers
    that were written, Hejberg said that the flaws that could be found in most of
    the programming languages would be what drove the fundamentals for the `Common
    Language Runtime` which then drove the design for the language itself.

