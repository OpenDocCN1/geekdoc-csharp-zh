- fmt: '

    3. `while loop`: the condition is going to be tested at the end of the body for
    the loop.


    4. `Nested loop`: just like other nested statements, this is going to be one loop
    inside of another.


    ## LOOP CONTROL STATEMENTS


    Control statements are going to change the way that a loop is performed from how
    it normally would be. Whenever the execution leaves the scope, any automatic object
    is going to be destroyed.


    1. `Break statement`: the loop or `switch` statement will be terminated while
    the statement that follows the loop or switch is carried out.


    2. `Continue statement`: the loop will skip all of its body and test the condition
    before it reiterates.


    ## INFINITE LOOP


    Loops are going to fall into this category when their condition is never found
    to be false. `for` loops are usually the ones that are going to fall into this
    category. Due to the fact that none of the three expressions are going to be required,
    you can cause an endless loop to occur by leaving the condition expression empty.


    ### Example


    ```csharp

    using System;


    namespace Loops


    {


    class Program

    {


    static void Main(string[] args)

    {


    for (; ; )

    {


    Console.WriteLine("Hey! I am Trapped");


    }


    }


    }


    }

    ```


    Whenever the conditional expression is not there, it is going to be assumed to
    be true. You may find that you have to initialize the increment expression. However,
    many programmers use `for (; ; )` to construct an infinite loop.


