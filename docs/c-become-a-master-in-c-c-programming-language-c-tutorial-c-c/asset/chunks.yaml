    # C# OPERATORS


    The operators are going to be the symbols that inform the compiler what action
    to perform in mathematical or logical expressions. There are operators that are
    built into C# such as:


    1. Misc

    2. Arithmetic

    3. Assignment

    4. Relational

    5. Bitwise

    6. Logical


    ## ARITHMETIC OPERATORS


    1. Addition (`+`)

    2. Subtraction (`-`)

    3. Multiplication (`*`)

    4. Division (`/`)

    5. Modulus (`%`)

    6. Increases by one (`++`)

    7. Decreases by one (`--`)


    ## RELATIONAL


    1. Is the value true? (`==`)

    2. Are the values equal (`!=`)

    3. Greater than (`>`)

    4. Less than (`<`)

    5. Greater than or equal to (`>=`)

    6. Less than or equal to (`<=`)


    ## LOGICAL


    1. Logical and (`&&`)

    2. Logical or (`||`)

    3. Logical not (`!`)


    ## Bitwise


    1. Binary and (`&`)

    2. Binary or (`|`)

    3. Binary XOR (`^`)

    4. Binary ones (`~`)

    5. Binary left shift (`<<`)

    6. Binary right shift (`>>`)


    ## ASSIGNMENT


    1. Assigning values (`=`)

    2. And assignment (`+=`)

    3. Subtract and assign (`-=`)

