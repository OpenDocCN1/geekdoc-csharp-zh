    \ 运算符创建一个 `struct` 对象时，你将创建该对象以及与之对应的构造函数。\n\n8. 如果没有使用 `new` 运算符，则字段在初始化之前将处于未赋值状态。\n\
    \n# 类 VS 结构\n\n在 C# 中，结构（structure）和类（class）之间至少有三个区别\n\n1. 结构不允许默认构造函数\n2. 类使用引用类（reference\
    \ classes），而结构（structs）使用值类（value classes）\n3. 结构不能使用继承\n\n## 示例\n\n```csharp\n\
    using System;\n\nstruct Books\n{\nprivate string title;\nprivate string author;\n\
    private string subject;\nprivate int book_id;\n\nOpen void getValues(string t,\
    \ string a, string s, int id)\n{\ntitle = t;\nauthor = a;\nsubject = s;\nbook_id\
    \ = id;\n}\n\nOpen void display()\n{\nConsole. WriteLine(\"Title : {0}\", title);\n\
    Console. WriteLine(\"Author : {0}\", author);\nConsole. WriteLine(\"Subject :\
    \ {0}\", subject);\nConsole. WriteLine(\"Book_id :{0}\", book_id);\n}\n};\n\n\
    Open class testStructure\n{\nOpen static void Main(string[] args)\n{\nBooks Book1\
    \ = new Books(); /* 声明类 Book Book1 */\nBooks Book2 = new Books(); /* 声明类 Book\
    \ Book2 */\n/* 书 1 指定 */\nBook1.getValues(\"C Programming\",\n\"Nuha Ali\", \"\
    C Programming Tutorial\",6495407);\n/* 书 2 指定 */\nBook2.getValues(\"Telecom Billing\"\
    ,\n\"Zara Ali\", \"Telecom Billing Tutorial\", 6495700);\n/* 打印 Book1 信息 */\n\
    Book1.display();\n/* 打印 Book2 信息 */\nBook2.display();\nConsole.ReadKey();\n}\n\
    }\n```\n\n# 第十九章\n\n![](img/00001.jpeg)\n\n# C# 中的 枚举\n\n枚举（Enumerations）用于一组命名的整数常量。这些枚举类通过使用\
    \ `enum` 关键字进行声明。\n\nC# 枚举用于值数据值类。最后，枚举将持有自己的值，并且不会继承或传递继承。\n\n## 声明枚举变量\n\n###\
    \ 语法\n\n```text\nEnum <enum_name>\n{\n枚举列表\n} ;\n```\n\n1. `enum_name` 将是正在使用的枚举类\n\
    2. 枚举列表将是一组由逗号分隔的标识符列表\n\n枚举列表中的每个符号都代表一个特定的整数。大于值将位于任何其他符号之前。默认情况下，你的第一个枚举符号为\
    \ 0。\n\n示例 `enum num { 1, 2, 3, 4, 5, 6} ;` \n\n### 枚举变量示例\n\n```csharp\nusing\
    \ System;\n\nnamespace EnumApplication\n{\nclass EnumProgram\n{\nenum Days { Sun,\
    \ Mon, Tue, Wed, Thu, Fri, Sat };\nstatic void Main(string[] args)\n{\nint WeekdayStart\
    \ = (int)Days.Mon;\nint WeekdayEnd = (int)Days.Fri;\nConsole. WriteLine(\"Monday:\
    \ {0}\", WeekdayStart);\nConsole. WriteLine(\"Friday: {0}\", WeekdayEnd);\nConsole.ReadKey();\n\
    }\n}\n}\n```\n\n# 第二十章\n\n![](img/00001.jpeg)\n\n# C# 中发现的类\n\n当定义一个类时，你正在为该数据类定义一个蓝图。你并没有实际定义任何数据，但它定义了类类名的含义。这意味着它将包含类中的对象以及操作将执行的内容。你类中的方法和变量将被称为类的成员。\n\
    \n## 定义类\n\n类定义将以 `class` 关键字开始，后面跟着类名。你的类体将由一对大括号包含。\n\n### 示例\n\n```text\n<access\
    \ specifier> class class_name\n{\n// 成员变量\n<access specifier> <data class> variable1;\n\
    <access specifier> <data class> variable2;\n...\n<access specifier> <data class>\
    \ variableN;\n// 成员方法\n<access specifier> <return class> method1(parameter_list)\n\
    {\n// 方法体\n}\n<access specifier> <return class> method2(parameter_list)\n{\n//\
    \ 方法体\n}\n...\n<access specifier> <return class> methodN(parameter_list)\n{\n\
    // 方法体\n}\n}\n```\n\n请记住：\n\n1. 为了根据特定的访问规则访问你的修饰符，你将拥有访问成员和类的权限。如果你没有提到任何，将使用默认值，即内部类（internal\
    \ class）。成员的默认值是 `private`。\n2. 数据类需要通过你正在使用的变量类以及返回类来指定，以便如果你在使用其中一个，则数据类方法将按你想要的方式返回。\n\
    3. 为了访问类成员，你需要使用点运算符（dot operator）\n4. 点运算符链接将告诉你对象的名称和成员的名称。\n\n### 示例\n\n```csharp\n\
    using System;\n\nnamespace BoxApplication\n{\nclass Box\n{\nOpen double length;\
    \ // 类的长度\nOpen double breadth; // 类的宽度\nOpen double height; // 类的定义\n}\nclass\
    \ Boxtester\n{\nstatic void Main(string[] args)\n{\nBox Box1 = new Box(); // 声明类\
    \ Box Box1\nBox Box2 = new Box(); // 声明类 Box Box2\ndouble volume = 0; // 这里的这里的定义\n\
    Box1.length = 0;\nBox1.breadth = 0;\nBox1.height = 0;\n// Box 1 指定\nBox1.length\
    \ = 5.0;\nBox1.breadth = 6.0;\nBox1.height = 7.0;\n// Box 2 指定\nBox2.length =\
    \ 10.0;\nBox2.breadth = 12.0;\nBox2.height = 13.0;\n// 打印 Box1 信息\nvolume = Box1.length\
    \ * Box1.breadth * Box1.height;\nConsole. WriteLine(\"Volume of Box1 : {0}\",\
    \ volume);\n// 打印 Box2 信息\nvolume = Box2.length * Box2.breadth * Box2.height;\n\
    Console. WriteLine(\"Volume of Box2 : {0}\", volume);\nConsole.ReadKey();\n}\n\
    }\n}\n```\n\n## 成员函数与封装\n\n成员函数是类的一部分，与变量类似，将保持私有以封装。这些函数在类中操作。\n\n### 示例\n\n\
    ```csharp\nusing System;\n\nnamespace BoxApplication\n{\nclass Box\n{\nprivate\
    \ double length; // 类的长度\nprivate double breadth; // 类的宽度\nprivate double height;\
    \ // 类的定义\nOpen void setLength( double len )\n{\nlength = len;\n}\n\nOpen void\
    \ setBreadth( double bre )\n{\nbreadth = bre;\n}\n\nOpen void setHeight( double\
    \ hei )\n{\nheight = hei;\n}\n\nOpen double getVolume()\n{\nreturn length * breadth\
    \ * height;\n}\n}\nclass Boxtester\n{\nstatic void Main(string[] args)\n{\nBox\
    \ Box1 = new Box(); // 声明类 Box Box1\nBox Box2 = new Box(); // 声明类 Box Box2\ndouble\
    \ volume = 0; // 这里的这里的定义\nBox1.setLength(5.0);\nBox1.setBreadth(6.0);\nBox1.setHeight(7.0);\n\
    Box2.setLength(10.0);\nBox2.setBreadth(12.0);\nBox2.setHeight(13.0);\n// 打印 Box1\
    \ 信息\nvolume = Box1.getVolume();\nConsole. WriteLine(\"Volume of Box1 : {0}\"\
    , volume);\n// 打印 Box2 信息\nvolume = Box2.getVolume();\nConsole. WriteLine(\"Volume\
    \ of Box2 : {0}\", volume);\nConsole.ReadKey();\n}\n}\n}\n```\n\n## 构造函数\n\n类的构造函数是类的一种特殊函数，当在该类中创建新对象时按需要执行。构造函数的名称与类名相同，但你不会得到返回类。\n\
    \n### 示例\n\n```csharp\nusing System;\n\nnamespace LineApplication\n{\nclass Line\n\
    {\nprivate double length; // 类的长度\nOpen Line()\n{\nConsole. WriteLine(\"Object\
    \ is being created\");\n}\n\nOpen void setLength( double len )\n{\nlength = len;\n\
    }\n\nOpen double getLength()\n{\nreturn length;\n}\n\nstatic void Main(string[]\
    \ args)\n{\nLine line = new Line();\n// 设置线条长度\nline.setLength(6.0);\nConsole.\
    \ WriteLine(\"Length of line : {0}\", line.getLength());\nConsole.ReadKey();\n\
    }\n}\n}\n```\n\n[/content] (修正：应为 [content] \n    抱歉，由于原始文本在翻译过程中出现了逻辑重复和格式混乱，我已根据您提供的逻辑要求重新梳理并翻译了完整的文本内容：)\n\
    \n[content]\n6. 结构成员不能被指定为保护（protected）、虚（virtual）或抽象（abstract）。\n\n7. 每使用 `new`\
    \ 运算符创建一个 `struct` 对象时，你将创建该对象以及与之对应的构造函数。\n\n8. 如果没有使用 `new` 运算符，则字段在初始化之前将处于未赋值状态。\n\
    \n# 类 VS 结构\n\n在 C# 中，结构（structure）和类（class）之间至少有三个区别\n\n1. 结构不允许默认构造函数\n2. 类使用引用类（reference\
    \ classes），而结构（structs）使用值类（value classes）\n3. 结构不能使用继承\n\n## 示例\n\n```csharp\n\
    using System;\n\nstruct Books\n{\nprivate string title;\nprivate string author;\n\
    private string subject;\nprivate int book_id;\n\nOpen void getValues(string t,\
    \ string a, string s, int id)\n{\ntitle = t;\nauthor = a;\nsubject = s;\nbook_id\
    \ = id;\n}\n\nOpen void display()\n{\nConsole. WriteLine(\"Title : {0}\", title);\n\
    Console. WriteLine(\"Author : {0}\", author);\nConsole. WriteLine(\"Subject :\
    \ {0}\", subject);\nConsole. WriteLine(\"Book_id :{0}\", book_id);\n}\n};\n\n\
    Open class testStructure\n{\nOpen static void Main(string[] args)\n{\nBooks Book1\
    \ = new Books(); /* 声明类 Book Book1 */\nBooks Book2 = new Books(); /* 声明类 Book\
    \ Book2 */\n/* 书 1 指定 */\nBook1.getValues(\"C Programming\",\n\"Nuha Ali\", \"\
    C Programming Tutorial\",6495407);\n/* 书 2 指定 */\nBook2.getValues(\"Telecom Billing\"\
    ,\n\"Zara Ali\", \"Telecom Billing Tutorial\", 6495700);\n/* 打印 Book1 信息 */\n\
    Book1.display();\n/* 打印 Book2 信息 */\nBook2.display();\nConsole.ReadKey();\n}\n\
    }\n```\n\n# 第十九章\n\n![](img/00001.jpeg)\n\n# C# 中的 枚举\n\n枚举（Enumerations）用于一组命名的整数常量。这些枚举类通过使用\
    \ `enum` 关键字进行声明。\n\nC# 枚举用于值数据值类。最后，枚举将持有它自己的值，并且不会继承或传递继承。\n\n## 声明枚举变量\n\n\
    ### 语法\n\n```text\nEnum <enum_name>\n{\n枚举列表\n} ;\n```\n\n1. `enum_name` 将是正在使用的枚举类\n\
    2. 枚举列表将是一组由逗号分隔的标识符列表\n\n枚举列表中的每个符号都代表一个特定的整数。大于值将位于任何其他符号之前。默认情况下，你的第一个枚举符号为\
    \ 0。\n\n示例 `enum num { 1, 2, 3, 4, 5, 6} ;` \n\n### 枚举变量示例\n\n```csharp\nusing\
    \ System;\n\nnamespace EnumApplication\n{\nclass EnumProgram\n{\nenum Days { Sun,\
    \ Mon, Tue, Wed, Thu, Fri, Sat };\nstatic void Main(string[] args)\n{\nint WeekdayStart\
    \ = (int)Days.Mon;\nint WeekdayEnd = (int)Days.Fri;\nConsole. WriteLine(\"Monday:\
    \ {0}\", WeekdayStart);\nConsole. WriteLine(\"Friday: {0}\", WeekdayEnd);\nConsole.ReadKey();\n\
    }\n}\n}\n```\n\n# 第二十章\n\n![](img/00001.jpeg)\n\n# C# 中发现的类\n\n当定义一个类时，你正在为该数据类定义一个蓝图。你并没有实际定义任何数据，但它定义了类类名的含义。这意味着它将包含类中的对象以及操作将执行的内容。你类中的方法和变量将被称为类的成员。\n\
    \n## 定义类\n\n类定义将以 `class` 关键字开始，后面跟着类名。你的类体将由一对大括号包含。\n\n### 示例\n\n```text\n<access\
    \ specifier> class class_name\n{\n// 成员变量\n<access specifier> <data class> variable1;\n\
    <access specifier> <data class> variable2;\n...\n<access specifier> <data class>\
    \ variableN;\n// 成员方法\n<access specifier> <return class> method1(parameter_list)\n\
    {\n// 方法体\n}\n<access specifier> <return class> method2(parameter_list)\n{\n//\
    \ 方法体\n}\n...\n<access specifier> <return class> methodN(parameter_list)\n{\n\
    // 方法体\n}\n}\n```\n\n请记住：\n\n1. 为了根据特定的访问规则访问你的修饰符，你将拥有访问成员和类的权限。如果你没有提到任何，将使用默认值，即内部类（internal\
    \ class）。\n2. 数据类需要通过你正在使用的变量类以及返回类来指定，以便如果你在使用其中一个，则数据类方法将按你想要的方式返回。\n3. 为了访问类成员，你需要使用点运算符（dot\
    \ operator）\n4. 点运算符链接将告诉你对象的名称和成员的名称。\n\n### 示例\n\n```csharp\nusing System;\n\
    \nnamespace BoxApplication\n{\nclass Box\n{\nOpen double length; // 类的长度\nOpen\
    \ double breadth; // 类的宽度\nOpen double height; // 类的定义\n}\nclass Boxtester\n{\n\
    static void Main(string[] args)\n{\nBox Box1 = new Box(); // 声明类 Box Box1\nBox\
    \ Box2 = new Box(); // 声明类 Box Box2\ndouble volume = 0; // 这里的这里的定义\nBox1.length\
    \ = 0;\nBox1.breadth = 0;\nBox1.height = 0;\n// Box 1 指定\nBox1.length = 5.0;\n\
    Box1.breadth = 6.0;\nBox1.height = 7.0;\n// Box 2 指定\nBox2.length = 10.0;\nBox2.breadth\
    \ = 12.0;\nBox2.height = 13.0;\n// 打印 Box1 信息\nvolume = Box1.length * Box1.breadth\
    \ * Box1.height;\nConsole. WriteLine(\"Volume of Box1 : {0}\", volume);\n// 打印\
    \ Box2 信息\nvolume = Box2.length * Box2.breadth * Box2.height;\nConsole. WriteLine(\"\
    Volume of Box2 : {0}\", volume);\nConsole.ReadKey();\n}\n}\n}\n```\n\n## 成员函数与封装\n\
    \n成员函数是类的一部分，与变量类似，将保持私有以封装。这些函数在类中操作。\n\n### 示例\n\n```csharp\nusing System;\n\
    \nnamespace BoxApplication\n{\nclass Box\n{\nprivate double length; // 类的长度\n\
    private double breadth; // 类的宽度\nprivate double height; // 类的定义\nOpen void setLength(\
    \ double len )\n{\nlength = len;\n}\n\nOpen void setBreadth( double bre )\n{\n\
    breadth = bre;\n}\n\nOpen void setHeight( double hei )\n{\nheight = hei;\n}\n\n\
    Open double getVolume()\n{\nreturn length * breadth * height;\n}\n}\nclass Boxtester\n\
    {\nstatic void Main(string[] args)\n{\nBox Box1 = new Box(); // 声明类 Box Box1\n\
    Box Box2 = new Box(); // 声明类 Box Box2\ndouble volume = 0; // 这里的这里的定义\nBox1.setLength(5.0);\n\
    Box1.setBreadth(6.0);\nBox1.setHeight(7.0);\nBox2.setLength(10.0);\nBox2.setBreadth(12.0);\n\
    Box2.setHeight(13.0);\n// 打印 Box1 信息\nvolume = Box1.getVolume();\nConsole. WriteLine(\"\
    Volume of Box1 : {0}\", volume);\n// 打印 Box2 信息\nvolume = Box2.getVolume();\n\
    Console. WriteLine(\"Volume of Box2 : {0}\", volume);\nConsole.ReadKey();\n}\n\
    }\n}\n```\n\n## 构造函数\n\n类的构造函数是类的一种特殊函数，当在该类中创建新对象时按需要执行。构造函数的名称与类名相同，但你不会得到返回类。\n\
    \n### 示例\n\n```csharp\nusing System;\n\nnamespace LineApplication\n{\nclass Line\n\
    {\nprivate double length; // 类的长度\nOpen Line()\n{\nConsole. WriteLine(\"Object\
    \ is being created\");\n}\n\nOpen void setLength( double len )\n{\nlength = len;\n\
    }\n\nOpen double getLength()\n{\nreturn length;\n}\n\nstatic void Main(string[]\
    \ args)\n{\nLine line = new Line();\n// 设置线条长度\nline.setLength(6.0);\nConsole.\
    \ WriteLine(\"Length of line : {0}\", line.getLength());\nConsole.ReadKey();\n\
    }\n}\n}\n```\n"
- fmt: "\nThe default constructor will not give you any parameter, however, if you\
    \ need a constructor can have a parameter. There are some parameters known as\
    \ parameterized constructors that are going to assist in assigning the primary\
    \ value for an object when it is created.\n\n### Example\n\n```csharp\nusing System;\n\
    \nnamespace LineApplication\n{\n\nclass Line\n{\n    private double length; //\
    \ Length of a line\n\n    Line(double len) //Parameterized constructor\n    {\n\
    \        Console.WriteLine(\"Object is being created, length = {0}\", len);\n\
    \        length = len;\n    }\n\n    public void setLength( double len )\n   \
    \ {\n        length = len;\n    }\n\n    public double getLength()\n    {\n  \
    \      return length;\n    }\n\n    static void Main(string[] args)\n    {\n \
    \       Line line = new Line(10.0);\n        Console.WriteLine(\"Length of line\
    \ : {0}\", line.getLength());\n        // set line length\n        line.setLength(6.0);\n\
    \        Console.WriteLine(\"Length of line : {0}\", line.getLength());\n    \
    \    Console.ReadKey();\n    }\n}\n\n}\n```\n\n### DECONSTRUCTOR\n\nThe deconstructor\
    \ is also a special function that is going to be carried out when there is a class\
    \ that falls out of its scope. The deconstructor is going to have the same name\
    \ as the class but will have a tilde before it and is not going to be able to\
    \ have any parameters or return values.\n\nDeconstructors are going to be useful\
    \ when you need to release the memory before you leave a program, but the deconstructor\
    \ is not going to be able to be inherited or overload.\n\n### Example\n\n```csharp\n\
    using System;\n\nnamespace LineApplication\n{\n\nclass Line\n{\n    private double\
    \ length; // Length of a line\n\n    Line() // constructor\n    {\n        Console.WriteLine(\"\
    Object is being created\");\n    }\n\n    ~Line() //destructor\n    {\n      \
    \  Console.WriteLine(\"Object is being deleted\");\n    }\n\n    public void setLength(\
    \ double len )\n    {\n        length = len;\n    }\n\n    public double getLength()\n\
    \    {\n        return length;\n    }\n\n    static void Main(string[] args)\n\
    \    {\n        Line line = new Line();\n        // set line length\n        line.setLength(6.0);\n\
    \        Console.WriteLine(\"Length of line : {0}\", line.getLength());\n    }\n\
    }\n\n}\n```\n\n# CONCLUSION\n\n![](images/00001.jpeg)\n\nThank you for making\
    \ it through to the end of `C#`, let’s hope it was informative and able to provide\
    \ you with all of the tools you need to achieve your goals whatever it may be.\n\
    \nThe next step is to use the new programming language that you have learned and\
    \ put it to go use. No matter what it is that you are using `C# for, you are going\
    \ to discover that there are going to be similarities between every C language.\n\
    \nMake sure that you are patient when learning a programming language because\
    \ if you are not then you are going to be causing yourself to have to go back\
    \ and correct a lot of mistakes which is going to take up valuable time that you\
    \ could be using for something else.\n\nThank you and good luck.\n"
  raw: 'The default constructor will not give you any parameter, however, if you need
    a constructor can have a parameter. There are some parameters known as parameterized
    constructors that are going to assist in assigning the primary value for an object
    when it is created.


    **Example**


    using System;


    namespace LineApplication


    {


    class Line


    {


    private double length; // Length of a line


    Open Line(double len) //Parameterized constructor


    {


    Console. WriteLine("Object is being created, length = {0}", len);


    length = len;


    }


    Open void setLength( double len )


    {


    length = len;


    }


    Open double getLength()


    {


    return length;


    }


    static void Main(string[] args)


    {


    Line line = new Line(10.0);


    Console. WriteLine("Length of line : {0}", line.getLength());


    // set line length


    line.setLength(6.0);


    Console. WriteLine("Length of line : {0}", line.getLength());


    Console.ReadKey();


    }


    }


    }


    ## DECONSTRUCTOR


    The deconstructor is also a special function that is going to be carried out when
    there is a class that falls out of its scope. The deconstructor is going to have
    the same name as the class but will have a tilde before it and is not going to
    be able to have any parameters or return values.


    Deconstructors are going to be useful when you need to release the memory before
    you leave a program, but the deconstructor is not going to be able to be inherited
    or overload.


    **Example**


    using System;


    namespace LineApplication


    {


    class Line


    {


    private double length; // Length of a line


    Open Line() // constructor


    {


    Console. WriteLine("Object is being created");


    }


    ~Line() //destructor


    {


    Console. WriteLine("Object is being deleted");


    }


    Open void setLength( double len )


    {


    length = len;


    }


    Open double getLength()


    {


    return length;


    }


    static void Main(string[] args)


    {


    Line line = new Line();


    // set line length


    line.setLength(6.0);


    Console. WriteLine("Length of line : {0}", line.getLength());


    }


    }


    }


    # CONCLUSION


    ![](images/00001.jpeg)


    Thank you for making it through to the end of *C#*, let’s hope it was informative
    and able to provide you with all of the tools you need to achieve your goals whatever
    it may be.


    The next step is to use the new programming language that you have learned and
    put it to go use. No matter what it is that you are using C# for, you are going
    to discover that there are going to be similarities between every C language.


    Make sure that you are patient when learning a programming language because if
    you are not then you are going to be causing yourself to have to go back and correct
    a lot of mistakes which is going to take up valuable time that you could be using
    for something else.


    Thank you and good luck.'
