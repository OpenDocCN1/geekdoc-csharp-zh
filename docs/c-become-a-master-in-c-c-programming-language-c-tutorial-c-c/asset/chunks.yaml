    , Book1.book_id);\n/* 打印 Book2 信息 */\nConsole. WriteLine(\"Book 2 title : {0}\"\
    , Book2.title);\nConsole. WriteLine(\"Book 2 author : {0}\", Book2.author);\n\
    Console. WriteLine(\"Book 2 subject : {0}\", Book2.subject);\nConsole. WriteLine(\"\
    Book 2 book_id : {0}\", Book2.book_id);\nConsole.ReadKey();\n}\n}\n}\n```\n\n\
    ## C# 结构的特征\n\n由于你已经有了上面示例中创建的结构，你会发现它们与其它 C 语言中的结构不同。C# 为结构包含了以下特性：\n\n1. 结构允许拥有方法、字段、属性、事件、运算符方法和索引器。\n\
    2. 这些结构允许拥有构造函数，但不能有析构函数。\n3. 禁止继承。\n4. 你不能作为其他结构或类的基类。\n5. 结构将实现至少一个接口。\n\n"
- fmt: "\n6. The structure members are not allowed to be specified as protected, virtual,\
    \ or abstract.\n\n7. Whenever a `struct` object is created with the `new` operator,\
    \ you are going to be creating the object and the constructor that is going to\
    \ go with it.\n\n8. Should the `new` operator not be used, then the field is going\
    \ to be unassigned until the fields are initialized.\n\n# CLASS VS. STRUCTURE\n\
    \nThere are at least three differences between a structure and a class that is\
    \ going to be used in C#\n\n1. Structures are not allowed to have default constructors\n\
    2. The classes are going to use reference classes while structs use value classes\n\
    3. A structure cannot use inheritance\n\n## Example\n\n```csharp\nusing System;\n\
    \nstruct Books\n{\nprivate string title;\nprivate string author;\nprivate string\
    \ subject;\nprivate int book_id;\n\nOpen void getValues(string t, string a, string\
    \ s, int id)\n{\ntitle = t;\nauthor = a;\nsubject = s;\nbook_id = id;\n}\n\nOpen\
