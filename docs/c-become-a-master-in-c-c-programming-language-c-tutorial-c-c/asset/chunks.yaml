- fmt: '

    Your constant is going to refer to a value that is fixed and cannot be altered
    while the program is performing code. The values that are fixed are going to be
    known as literals. A constant is going to be any data class such as an integer
    or a character. You can also have enumeration constants as well.


    You are going to treat your constant like a regular variable except for the fact
    that your values are not going to be changed after they have been defined.


    ## INTEGER LITERALS


    Integer literals are going to be things such as decimals or hexadecimals. The
    prefix is going to tell you the base or radix. It is going to either be `0x` or
    `0X` when you are working with hexadecimal, but there is not going to be a prefix
    id for the decimals.


    Your integer literals can also use `U` and `L` for the suffix for those that are
    unsigned and long. The suffix will either be capitalized or lowercase depending
    on the order.


    ### Example


    ```

    85 /* decimal */

    0x4b /* hexadecimal */

    30 /* int */

    30u /* unsigned int */

    30l /* long */

    30ul /* unsigned long */

    ```


    ## FLOATING POINT LITERALS


    The floating point literals will be composed of four parts: exponent, fractional,
    integer, decimal. You are also going to be able to represent these literals in
    the exponential form or their decimal form.


    ### Example


    ```

    3.14159 /* Legal */

    314159E-5F /* Legal */

    510E /* Illegal: incomplete exponent */

    210f /* Illegal: no decimal or exponent */

    .e55 /* Illegal: missing integer or fraction */

    ```


    When working with the decimal form you need to ensure that you include the decimal
    point, the exponent, or even both. For the exponential form you will need to include
    the integer part, the fractional part, or if you choose to, you can do both. For
    signed exponents, you are going to use `e` or `E`.


    ## CHARACTER CONSTANTS


    The character literals are going to be surrounded by a set of single quotes and
    are going to be stored in a `char` class. These literals are going to be plain
    characters or even escape sequences, you may even see some that are universal
    characters.


    Some characters that are used in C# are going to be preceded by backslashes which
    mean that they have a special meaning and are going to represented differently.


    Escape sequences are:


    1. `\xhh`: hexadecimal with multiple digits

    2. `\\`: \character

    3. `\v`: vertical tab

    4. `\’`: ‘character

    5. `\t`: horizontal tab

    6. `\”`: “ character

    7. `\r`: carriage return

    8. `\?`: ?character

    9. `\n`: newline

    10. `\a`: alerts

    11. `\f`: form feed

    12. `\b`: backspace


    ### Example


    ```csharp

    using System;


    namespace EscapeChar

    {

    class Program

    {

    static void Main(string[] args)

    {

    Console.WriteLine("Hello\tWorld\n\n");

    Console.ReadLine();

    }

    }

    }

    ```


    ## STRING LITERALS


    A string literal or constant is going to be surrounded by double quotes, or contain
    an at symbol. These strings are going to be full of characters that are going
    to look similar to the character literals.


    Long lines can be broken up into multiple lines through the use of string literals
    as long as whitespaces are used for the separation process.


    ### Example


    ```

    "hello, dear"

    "hello, \

    dear"

    "hello, " "d" "ear"

    @"hello dear"

    ```


    ## DEFINING CONSTANTS


    A constant is going to be defined by using the `const` keyword.


    ### Syntax


    `const <data_class> <constant_name> = value;`


    ### Example


    ```csharp

    using System;


    namespace DeclaringConstants

    {

    class Program

    {

    static void Main(string[] args)

    {

    const double pi = 3.14159;

    // constant declaration

    double r;

    Console.WriteLine("Enter Radius: ");

    r = Convert.ToDouble(Console.ReadLine());

    double areaCircle = pi * r * r;

    Console.WriteLine("Radius: {0}, Area: {1}", r, areaCircle);

    Console.ReadLine();

    }

    }

    }

    ```


