    ## CLASS VS. STRUCTURE


    There are at least three differences between a structure and a class that is going
    to be used in C#


    1\. Structures are not allowed to have default constructors


    2\. The classes are going to use reference classes while structs use value classes


    3\. A structure cannot use inheritance


