    # ENUMS IN C#


    Enumerations are for sets of integer constants that are named. These enumerated
    classes are going to be declared by use of the enum keyword.


    A C# enumeration is for the value data value class. In the end, the enumeration
    is going to hold on to its own values and is not going to inherit or pass inheritance.


    ## DECLARING ENUM VARIABLE


    **Syntax**


    Enum <enum_name>


    {


    Enumeration list


    } ;


    1\. The enum_name will be the class of enumeration being used


    2\. The enumeration list is going to be a list of identifiers that are separated
    by commas


    Every symbol in the list of enumeration is going to stand for a particular integer.
    The greater than value is going to precede any other symbol. By default, your
    first enumeration symbol will be 0.


    Example enum num { 1, 2, 3, 4, 5, 6} ;


    Example of enum variables


    using System;


    namespace EnumApplication


    {


    class EnumProgram


    {


    enum Days { Sun, Mon, Tue, Wed, Thu, Fri, Sat };


    static void Main(string[] args)


    {


    int WeekdayStart = (int)Days.Mon;


    int WeekdayEnd = (int)Days.Fri;


    Console. WriteLine("Monday: {0}", WeekdayStart);


