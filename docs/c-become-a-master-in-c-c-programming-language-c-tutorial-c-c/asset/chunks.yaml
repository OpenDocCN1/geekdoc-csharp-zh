    # METHODS THAT ARE USED IN C#


    The method is the group of statements that work in order to perform a task. Each
    program in C# is going to have one class method `main`.


    In order to use a method you have to


    1. Define your method

    2. Call your method


    ## DEFINING METHODS


    Whenever a method is defined, you have to declare the elements of the structure.


    **Syntax**


    ```

    <access specifier> <return class> <method name> (parameter list)


    {


    Method body

    }

    ```


    Some of the elements of the method are:


    1. `access specifier`: the visibility of the variable will be determined by another
    class.

    2. `return class`: the method is going to return a value. This returned class
    is going to be the data class of the value that is returned to you. Should the
    method not return a value then the return class is going to be `void`.

    3. `method name`: the method name is the identifier that is going to be case sensitive.
    It is not going to be the same as other identifiers that are declared in the class.

    4. `parameter list`: between the parentheses the parameters are going to be used
    to pass and obtain data from the method that is being used. Parameters are going
    to refer to the order, number, and class of parameters that a method is using.
