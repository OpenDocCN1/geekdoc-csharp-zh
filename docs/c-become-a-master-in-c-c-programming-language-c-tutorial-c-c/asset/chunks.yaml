    # ENCAPSULATION IN C#


    You will define encapsulation as the process of enclosing a single item or more
    inside of a logical or physical package. Encapsulation is done inside of programming
    languages that are object-oriented, and methodology ends up preventing the access
    to implementation details.


    Abstraction and encapsulation are going to be features that you can only find
    in object oriented programming. Abstraction, however, turns relevant information
    in the code into a visible piece of the code while encapsulation allows the programmer
    to implement the level of abstraction that they want in their code.


    There are access specifiers that are going to cause encapsulation to be implemented.
    Access specifiers are going to define the scope and how visible a class member
    is. These are the specifiers that C# supports.


    1. `Protected internal`

    2. `Open`

    3. `Internal`

    4. `Private`

    5. `Protected`


    ## OPEN


    These specifiers are going to enable the class to show the member variables and
    functions so that other objects and functions can see them. When a member is `Open`,
    it can be accessed from the outside.


    ### Example


    ```csharp

    using System;


    namespace RectangleApplication


    {


    class Rectangle

    {


    //member variables


    Open double length;


    Open double width;


    Open double GetArea()

    {


    return length * width;


    }


    Open void Display()

    {


    Console.WriteLine("Length: {0}", length);


    Console.WriteLine("Width: {0}", width);


    Console.WriteLine("Area: {0}", GetArea());


    }


    }//end class Rectangle


    class PerformRectangle

    {


    static void Main(string[] args)

    {


    Rectangle r = new Rectangle();


    r.length = 4.5;


    r.width = 3.5;


    r.Display();


    Console.ReadLine();


    }


    }


    }

    ```


    In this example, you can see that the member variable `length` and `width` are
    going to be `Open` so that they can be accessed from your function through the
    use of the class name. Your member functions are only going to have the ability
    to access the variables directly without using any of the class instances. They
    are also going to be declared as `Open` by using the `main()` function.


    ## PRIVATE


    Private specifiers are going to enable a class to hide the member variables and
    functions from other things in the code. The only functions that you find in the
    same class are going to have the ability to access the private members. There
    are even going to be instances where classes are not going to be able to access
    private members.


