  \npublic class Card : MonoBehaviour \n{\n    // 这将在稍后定义\n}\n\n[System.Serializable]\n\
  public class Decorator \n{\n// 此类存储来自 DeckXML 的每个装饰器或花点的信息\n    public string type;\
