  \n### 构建场景\n\n与之前的原型不同，这个游戏使用可扩展标记语言（XML）和一系列 3D 瓦片来构建环境。双击 `Resources` 文件夹内的 `Rooms.xml`\
  \ 文件即可查看我的意思。这些房间的布局灵感源自经典冒险游戏《地牢险》（Rogue），该游戏通过用 ASCII 艺术显示玩家、敌人和地下城成为了最早的“图形”游戏之一。\n\
  \n\n\n\n你会注意到 `tex` 属性被注释掉了。这是因为需要 `LayoutTiles` 脚本已就绪才能正确编译。在你输入了前面的代码并确保它们都能通过编译后，在\
  \ `Scripts` 文件夹中创建一个名为 `LayoutTiles` 的新脚本，并将其挂到 `MainCamera` 上。然后，移除 `tex` 属性前后的多行注释（`/*`\
  \ 和 `*/`）。Unity 将抛出一个编译错误（`Assets/__Scripts/Tile.cs(31,53): error CS0117: ‘LayoutTiles’\
  \ does not contain a definition for ‘S’`），但我们现在将通过编写 `LayoutTiles` 脚本来修复它。在 `MonoBehaviour`\
  \ 中打开 `LayoutTiles` 并添加以下代码：\n\n点击此处查看代码图片\n\n```csharp\nusing UnityEngine;\n\n\
