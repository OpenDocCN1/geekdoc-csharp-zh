  \n\n\n\n\n## 前言\n欢迎阅读*游戏设计、原型制作与开发简介》。这本书基于我多年作为专业游戏设计师以及在多所大学担任游戏设计教授的经历，其中包括南加州大学的交互式媒体与游戏部门，以及密歇根大学安娜堡分校的电气工程与计算机科学系。\n\
  本前言将向你介绍本书的目的、范围和方法。\n### 本书的目的\n我在书中的目标非常简单：我想为你提供所有的工具和知识，帮助你踏上成为一名成功游戏设计师和原型制作者的道路。本书是我尽可能将知识吸收并浓缩在其中，以帮助你实现这一目标。与市上的大多数书籍不同，本书将游戏设计与数字开发（即计算机编程）两个学科相结合，并将它们封装在迭代原型制作这一核心实践之中。像\
  \ `Unity` 这样先进且易于手的游戏开发引擎的出现，使得比以往任何时候都更容易创建可玩的原型，以此向他人表达你的游戏设计概念，而这种能力将让你成为一名更熟练（更有就业竞争力）的游戏设计师。\n\
  本书分为四个部分：\n### 第一部分：游戏设计与纸质原型\n书的第一部分开始探索各种游戏设计理论以及早期几书中提出的游戏设计分析框架。随后，本节描述了“分层四元结构”（Layered\
  \ Tetrad），将其作为一种结合和扩展这些早期理论中许多优秀特征的方法。书中深入探讨了“分层四元结构”如何与你作为交互体验设计师时必须做出的各种决策。这部分还涵盖了不同游戏设计学科中趣味十足的挑战；描述了纸质原型制作、测试和迭代的过程；并为你提供了具体信息，帮助你成为一名更好的设计师。\n\
  # 第二部分：数字原型\n第二部分将教你如何编程。这部分借鉴了我多年作为教授教授非技术学生如何通过数字代码表达其游戏设计想法的经验。如果你没有任何编程或开发的预知识或经验，这部分正是为你准备的。然而，即使你已经有一些编程经验，可能也想看看这部分，以学习一些新技巧或复习某些方法。\n\
  ### 第三部分：游戏原型示例与教程\n书的第三部分包含了几个不同的教程，每份教程都会引导你开发一个特定风格的游戏原型。这部分的目的有两个：其一通过向你展示我个人如何处理各种类型的原型，揭示快速游戏原型制作的一些最佳实践；其二是为你提供一个基础，以便未来在此构建你自己的游戏。市面上大多数尝试教授\
  \ `Unity`（我们的游戏开发环境）的其他书籍，都是通过让读者阅读一个长达数百页的单一、大体教程来实现的。相比之下，本书带你完成了几个小得多的教程。这些教程的最终产品不可避免地比其他书籍中的作品那么健壮，但我相信书中项目的多样性将更好地为你未来创建自己的项目做做好准备。\n\
  ### 第四部分：附录\n本书有几个重要的附录值得在此处提到。为了避免在书中反复重复信息，或要求你翻阅各个章节来寻找这些信息，任何在书中被多次引用的信息，或者我认为你可能在日后（当你读完一遍书后）会想要查阅的信息，都被放置在附录中。附录\
  \ A，“有用概念”。尽管它的名字相当平淡，但我认为在初次读完这本书后的几年里，这是你回看最频繁的部分。“有用概念”收集了几个我在个人游戏原型制作过程中不断使用的常用技术和策略，我认为你会发现其中很多内容非常有用。第三个也是最后一个附录是一份非常实用的在线参考列表，你可以在其中找到书中未涵盖的问题的答案。在网上寻找帮助的正确位置往往很困难；这个附录列出了我个人最常求助的地方。\n\
  ### 还有其他书籍\n作为任何类型的设计师或创作者，我认为承认那些你站在肩膀上的人是至关重要的。市面上写有很多关于游戏和游戏设计的书籍，我在这里列出的少数几本是对我的流程或我对游戏设计的思考产生最深远影响的书。你将在书中多次看到这些书籍，我鼓励你尽可能阅读它们。\n\
  #### Tracy Fullerton 著《游戏设计工作坊》*Game Design Workshop*\n《游戏设计工作坊》最初由 Tracy Fullerton、Chris\
  \ Swain 和 Steven S. Hoffman 编写，现在已是第三版。比起其他任何文本，这是我在寻求游戏设计建议时最常参考的书。这本书最初基于 Tracy\
  \ 和 Chris 在南加州大学教授的“游戏设计工作坊”课程，该课程构成了 USC 整个游戏课程的基础（我也在 2009 年至 2013 年在那里教过这门课程）。南加州大学交互式媒体与游戏研究生项目在普林顿评论（Princeton\
  \ Review）每年对游戏项目进行的排名中被评为北美游戏设计的第一学院，而《游戏设计工作坊》这本书和课程正是这一成功的基石。\n与许多阐述大量游戏理论的其他书籍不同，Tracy\
  \ 的书始终聚焦于帮助初级设计师提高技艺的信息上。我曾用这本书教了多年（甚至在我在南加州大学工作之前），我相信，如果你真的尝试了书中列出的所有练习，你自然会得到一个相当不错的纸质游戏。\n\
  Fullerton, Tracy, Christopher Swain, and Steven Hoffman, *Game Design Workshop:\
  \ A Playcentric Approach to Creating Innovative Games,* 2nd ed. (Boca Raton, FL:\
  \ Elsevier Morgan Kaufmann, 2008)\n#### Jesse Schell 著《游戏艺术》*The Art of Game Design*\n\
  Jesse Schell 是我在卡内基梅隆大学的教授之一，也是一位出色的游戏设计师，拥有多年在迪士尼幻想工厂（Walt Disney Imagineering）工作积累的主题公园设计背景。Jesse\
  \ 的书是许多从业设计师的最爱之，因为它将游戏设计视为一种通过贯穿全书的 100 个不同视角来审视的学科。Jesse 的书读起来非常有趣味，并涉及了书中未涵盖的话题。\n\
  Jesse Schell, *The Art of Game Design: A Book of Lenses* (Boca Raton, FL: CRC Press,\
  \ 2008)\n#### Bernard Suits 著《蚱》*The Grasshopper*\n\n\n虽然《蚂蝗》并不是一本真正关于游戏设计的书籍，但它是对“游戏”一词定义的极佳探索。这本书以一种让人联想到苏格底式教学法的风格呈现，在文本非常早的时候就提出了对游戏的定义：蚂蝗（源自伊索寓言《蚂蚁与蚂蝗》）在临终前给出了他的定义，而他的弟子们在书的剩余部分里一直在试图批判和理解这一定义。这本书还探讨了游戏和玩在社会中的地位问题。\n\
  Bernard Suits，《蚂蝗：游戏、生活与乌托邦》 (Peterborough, Ontario: Broadview Press, 2005)\n##\
  \ Keith Burgun 的游戏设计理论\n在书中，Burgun 探索了在他认为当前游戏设计和开发现状中存在的缺陷，并提出了一个比 Suits 窄得多的游戏定义。Burgun\
  \ 编写此书的目的是具有挑衅性，并推动游戏设计理论的讨论。虽然 Burgun 的文本基调很大程度上是负面的，但它提出了许多有趣的观点，对其的反应帮助我完善了个人对游戏设计的理解。\n\
  Keith Burgun，《游戏设计理论：理解游戏的全新哲学》(Boca Raton, FL: A K Peters/CRC Press, 2013)\n##\
  \ Chris Bateman 的虚构游戏\nBateman 利用这本书论证游戏是一门用于学术研究的合法媒介。他汲取了多个学术、实践和哲学领域的资源；他对约翰·荷伊延青根的《人性的游戏》、罗杰·卡伊瓦的《人、玩耍与游戏》以及玛丽·米德格林的论文《游戏的游戏》等书籍的的讨论既机明又通俗易懂。\n\
  Chris Bateman，《虚构游戏》(Washington, USA: Zero Books, 2011)\n## Scott Rogers 的《关卡升级！》\n\
  Rogers 将他在多年游戏开发一线积累的知识浓缩成一本有趣、易于上手且非常实用的书。当和他共同教一门关卡设计课程时，我们使用的就是本教材。Rogers 也是一名漫画家，他的书中充满了幽默且有用的插图，这些插图强化了关卡、角色、叙事以及设计的许多其他方面的概念。\n\
  Scott Rogers，《升级：优秀视频游戏设计指南》(Chichester, UK: Wiley, 2010)\n## 我们的数字原型环境：Unity\n\
  书中的所有数字游戏示例都基于 `Unity` 引擎和 `C#` 编程语言。我教学生开发数字游戏和交互体验已经多年了，根据我的经验，`Unity` 是迄为止我发现的学习开发游戏的最佳环境。我还发现\
  \ `C#` 是游戏原型设计者学习的最佳初始语言。市面上还有其他工具更容易学习且不需要真正的编程（Game Maker 和 Game Salad 就是两个例子），但\
  \ `Unity` 让你在一个基本上是免费的包中获得更多的灵活性和性能（`Unity` 的免费版本包含了付费版几乎的所有功能，这也是本书书中使用的版本）。如果你真的想学习编写游戏，`Unity`\
  \ 是你想要使用的引擎。\n同样，某些编程语言比 `C#` 稍微容易上手一点。在过去，我教过学生 `ActionScript` 和 `JavaScript`。然而，`C#`\
  \ 是我用过的、其灵性和功能集不断给我留下深刻印象的语言。学习 `C#` 意味着不仅学习编程，还学习良好的编程实践。像 `JavaScript` 这样的语言允许许多粗糙的行为，我发现这些行为实际上会导致开发变慢。`C#`\
  \ 让你保持严谨（通过强类型变量等手段），这种严谨不仅会让你成为更优秀的程序员，还会让你更快地编写代码（例如，强变量类型能够实现非常健壮的代码提示和自动补全，这使得编码更快、更准确）。\n\
  ## 这本书适合谁读\n关于游戏设计的书有很多，关于编程的书也很多。这本书试图于填补两者之间的鸿沟。随着 `Unity` 等游戏开发技术变得越来越无处不在，游戏设计者不仅要能够在纸上勾勒设计想法，还要通过运行的数字原型来表达，这变得越来越重要。这本书的出现是为了帮助你学会做到这一点：\n\
  ![Image](img/00003.jpeg) **如果你对游戏设计感兴趣但从未编写过程序，** 这本书非常适合你。第一部分 向你介绍了几种实用的游戏设计理论，并向你展示了帮助你开发和完善设计想法的实践。第二部分\
  \ 教你如何从零开始编程到理解面向对象的类层次。自从我成为大学教授以来，我的大多数课程都侧重于教非程序员如何编写游戏。我将这方面的全部经验都浓缩在了本书的第二部分中。第三部分\
  \ 带你完成跨不同游戏类型开发八种不同游戏原型的过程。每个示例都展示了从概念到工作数字原型的快速方法。最后，附录将深入解释特定的游戏开发和编程概念，并在你读完书后引导你查找学习更多资源。这些深度内容很大程度上移动到了附录\
  \ B“[有用概念]”，以便你以后未来几年里可以继续将书的这一部分作为参考。\n![Image](img/00003.jpeg) **如果你是一个对游戏设计感兴趣的程序员，**\
  \ 这本书的第一部分和第三部分 对你有帮助。\n## 规范\n本书遵循了几种写作规范，以使文本更易理解。\n任何当介绍特定的按钮名称、菜单命令或其他多词名词时，它们将以斜体显示。这包括如\
