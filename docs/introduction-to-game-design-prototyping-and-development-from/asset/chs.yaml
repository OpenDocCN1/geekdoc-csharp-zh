  ### 编写游戏\n\n有了你现在的经验，编写这个游戏实际上看起来非常简单，但与其他项目一样，你在这里学到的可以作为未来项目的基础。\n\n1. **在 `__Scripts`\
  \ 文件夹中创建一个名为 `Shot` 的新 C# 脚本**。打开并将 `Shot` 类中的所有默认文本替换为以下代码：\n\n```csharp\nusing\
  \ UnityEngine;\nusing System.Collections;\nusing System.Collections.Generic;\n\n\
  [System.Serializable] // 在检器中可见\npublic class Shot // Shot 不继承 MonoBehaviour\n{\n\
  \    public Vector3 position; // 相机位置\n    public Quaternion rotation; // 相机旋转\n\
  \    public Vector3 target; // 相机指向的目标\n}\n```\n\n\n\n\n这个 `Shots` 类将跟踪游戏中拍摄的摄影快照信息。由于我们希望游戏能够在\
  \ Unity 免费版中运行，我们无法将摄像头图像录制到图像文件中（这是 Unity Pro 专用功能），但我们仍然记录相机的位置和朝向（以及目标的位置）。`Shot`\
  \ 将为我们处理这些工作。\n\n### 2. 创建第二个新的 C# 脚本命名为 `TargetCamera`，将其放在 `Scripts` 文件夹中，并将其附加到层级结构中的\
  \ `TargetCamera` 上。`TargetCamera` 类负责在编辑模式下创建要拍摄的快照列表，并在播放模式下检查目标快照。输入以下代码：点击此处查看代码图像\n\
  \n```csharp\nusing UnityEngine;\n\nusing System.Collections;\n\nusing System.Collections.Generic;\n\
  \npublic class TargetCamera : MonoBehaviour {\n\n    public GameObject fpCamera;\
  \ // 第一视角相机\n    public bool ________________;\n\n    void Update () {\n\n     \
  \   Shot sh;\n        // 鼠标输入\n        if (Input.GetMouseButtonDown(0)) { // 左鼠标键\n\
  \            sh = new Shot();\n            // 获取 fpCamera 的位置和旋转\n            sh.position\
  \ = fpCamera.transform.position;\n            sh.rotation = fpCamera.transform.rotation;\n\
  \            // 从相机发射射线并查看它击中了什么\n            Ray ray = new Ray(sh.position, fpCamera.transform.forward);\n\
  \            RaycastHit hit;\n            if (Physics.Raycast(ray, out hit)) {\n\
  \                sh.target = hit.point;\n            }\n            // 设置 TargetCamera\
  \ 的快照\n            ShowShot(sh);\n        }\n    }\n    public void ShowShot(Shot\
  \ sh) {\n        // 设置 TargetCamera 的快照\n        transform.position = sh.position;\n\
  \        transform.rotation = sh.rotation;\n    }\n}\n```\n\n### 3. 将层级结构中的 `PC`\
  \ 子对象分配给 `TargetCamera` 检查器中的 `fpCamera` 字段。\n\n### 4. 保存场景！\n\n点击播放，你应该看到当点击左鼠标键时，`_TargetCamera`\
  \ 会移动到你拍摄的快照位置。现在我们知道这是可行的，我们需要一种方法将快照从一次播放话存储到下一次。\n\n#### 使用 PlayerPrefs 存储快照\n\
  \n正如我们在 `Apple Picker` 原型所示，`PlayerPrefs` 是存储内容的好地方；但它只能存储浮点、整数和字符串。为了处理这一点，我们将\
  \ `Shot` 转换为 XML，然后可以使用 `PT_XMLReader`（在第 31 章“原型 4：纸接龙](part045.html_ch31)”和第 32\
  \ 章“原型 5：纸扑克](part046.html_ch32)”的卡牌游戏中使用）来读取它，当我们下次启动游戏时：\n\n**1. 第一步是将每个 `Shot`\
  \ 转换为 XML。在 `Shot` 中添加以下代码：** 点击此处查看代码图像\n\n```csharp\npublic class Shot { // Shot\
  \ 没有继承 MonoBehaviour\n    public Vector3 position; // 相机位置\n    public Quaternion\
  \ rotation; // 相机旋转\n    public Vector3 target; // 相机指向的位置\n    // 为 XML 文档生成单行\
  \ <shot> 条目\n    public string ToXML() {\n        string ss = \"<shot \";\n    \
  \    ss += \"x=\\\"\"+position.x+\"\\\"\";\n        ss += \"y=\\\"\"+position.y+\"\
  \\\"\";\n        ss += \"z=\\\"\"+position.z+\"\\\"\";\n        ss += \"qx=\\\"\"\
  +rotation.x+\"\\\"\";\n        ss += \"qy=\\\"\"+rotation.y+\"\\\"\";\n        ss\
  \ += \"qz=\\\"\"+rotation.z+\"\\\"\";\n        ss += \"qw=\\\"\"+rotation.w+\"\\\
  \"\";\n        ss += \"tx=\\\"\"+target.x+\"\\\"\";\n        ss += \"ty=\\\"\"+target.y+\"\
  \\\"\";\n        ss += \"tz=\\\"\"+target.z+\"\\\"\";\n        ss += \"/>\";\n \
  \       return(ss);\n    }\n}\n```\n\n**1.1.** 在这一行以及后续行中，你在定义字符串字量量的双引号内部看到了 `\\\
  \"`（例如 `\"x=\\\"\"`）。在这种情况下，斜杠（`\\` `）被用作转义字符，因此它导致紧随其后的字符成为字符串字面量的一部分，无论它是什么字符。通常，双引号会结束字符串字面量，但在它前面有一个斜杠的情况下，双引号会被添加到字符串字面量中。\n\
  \n**2. 在 `TargetCamera` 中添加一行来对其测试：** 点击此处查看代码图像\n\n```csharp\npublic class TargetCamera\
  \ : MonoBehaviour {\n    ...\n    void Update () {\n        ...\n        if (Input.GetMouseButtonDown(0))\
  \ { // 左鼠标键\n            ...\n            ShowShot( sh );\n            Utils.tr(\
  \ sh.ToXML() );\n        }\n    }\n    ...\n}\n```\n\n**3. 点击播放并拍摄一些快照。你应该会在 `Console`\
  \ 窗口中看到格式如下的输出：** 点击此处查看代码图像\n\n```xml\n<shot x=\"-9.014837\" y=\"1.457083\" z=\"\
  24.45312\" qx=\"0.000000\" qy=\"0.000000\" qz=\"0.000000\" qw=\"1.000000\" tx=\"\
  -9.014837\" ty=\"1.457083\" tz=\"24.45312\" />\n```\n这让你知道它是可行的。**4. 现在，通过将 `Shot`\
  \ 添加到 `PlayerPrefs` 来扩展此功能。**\n\n\n\n\n\n```cs\n// 将每个 Shot 作为 <shot> 标签添加到 XML\
  \ 中\nforeach( Shot sh in shots ) {\n    xs += sh.ToXML()+\"\\n\";\n}\n// 添加 XML\
