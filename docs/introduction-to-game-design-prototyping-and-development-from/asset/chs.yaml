  \ );\n        }\n        set {\n            back.SetActive(value);\n        }\n\
  \    }\n}\n```\n\n**5.** 现在，可以在 `MakeCards()` 中将背面添加到卡牌中了。在 `Deck` 类的 `MakeCards()`\
