  \ 文件夹的梅花、方、红、黑桃纹理拖入 `Deck` 中相应的变量（`suitClub`、`suitDiamond`、`suitHeart` 和 `suitSpade`）。Unity\
  \ 会自动将 sprite 赋值给变量（而不是尝试将 `Texture2D` 赋值给 sprite 变量变量\n\n3. 下一步有点复杂。通过在 Hierarchy\
  \ 面板中选择 `MainCamera` 然后点击 Inspector 面板顶部的的小锁图标来锁定 `MainCamera` 的 Inspector（在图 31.6\
  \ 的 Inspector 中展开变量 `faceSprites` 旁边的三角形，将其 Size 设置为 12。现在，将每个以 `FaceCard_` 开头的\
  \ `Texture2D` 拖入 `faceSprites` 的元素中。顺序不重要，只要完成时每个恰好有一个（见图 31.6）。\n\n\n\n\n\n就像屏幕上的其他任何内容一样，精灵（sprites）需要封装在\
  \ `GameObjects` 中。对于本项目，你需要两个制体（prefabs）：一个用于所有装饰符和点数（pips）的通用 `PrefabSprite`，以及作为牌组所有卡牌基础的\
  \ `PrefabCard`。\n\n## PrefabSprite\n\n要创建 `PrefabSprite`，请执行以下操作：\n\n1. 从菜单栏选择 `GameObject\
  \ > Create Other > Sprite`。\n2. 将此 GameObject 命名为 `PrefabSprite`，并将其拖入 `Project`\
  \ 面板中的 `_Prefabs` 文件夹以制制体。\n3. 从 `Hierarchy` 中删除剩余的 `PrefabSprite` 实例。\n\n## PrefabCard\n\
  \n要创建 `PrefabCard`，请执行以下操作：\n\n1. 从菜单栏中选择 `GameObject > Create Other > Sprite`。将此\
  \ GameObject 命名为 `PrefabCard`。\n2. 从 `Project` 面板将 `Card_Front` 拖入 `PrefabCard`\
  \ 检查器中 `Sprite Renderer` 的 `sprite` 变量中。现在你应该能在 `Scene` 面板中看到 `Card_Front` 精灵。\n\
  3. 从 `Project` 面板将 `Card` 脚本拖到 `Hierarchy` 中的 `PrefabCard` 上。这将将 `Card` 脚本分配给 `PrefabCard`（`Card\
  \ (Script)` 组件现在将出现在 `PrefabCard` 的 `Inspector` 中）。\n4. 在 `PrefabCard` 的 `Inspector`\
  \ 中，点击 `Add Component` 按钮。从出现的菜单中选择 `Physics > Box Collider`。（这与从菜单栏中选择 `Component\
  \ > Physics > Box Collider` 相同）。`Box Collider` 的 `Size` 应该自动设置为 `[2.56, 3.56, 0.2]`，但如果不是，请将\
  \ `Size` 设置为这些值。\n5. 将 `PrefabCard` 从 `Hierarchy` 拖入 `_Prefabs` 文件夹以将其制为制体。从 `Hierarchy`\
  \ 中删除剩余的 `PrefabCard` 实例。\n\n现在，你需要将这两个制体分配到 `_MainCamera` 上 `Deck (Script)` 组件的检查器中相应的公共变量中。\n\
  \n1. 在层级结构中选择 `_MainCamera`，并将 `PrefabCard` 和 `PrefabSprite` 从 `Project` 面板拖入 `Deck\
  \ (Script)` 检查器中相应的变量中。\n2. 保存你的场景。\n\n## 在代码中构建卡牌\n\n在实际向 `Deck` 类添加制作卡牌的方法之前，我们需要按照如下方式向\
