  \n#### 比较镜头\n\n由于我们需要玩家拍摄相同的，编写一个比较镜头的函数至关重要。我们将使用 `Physics.Raycast` 命中点来比较相机位置。\n\
  \n![](img/0252)\n\n**图 34.10** 相机的偏差\n\n我们在移动中使用 `Easing`，它可以改变任何位于 0 到 1 之间的数字。我们将使用\
  \ `Easing.Out`，以便使其更加宽松。\n\n在 `Shot` 类的末尾添加以下静态方法来比较两个镜头。此代码将引用我们在 `TargetCamera`\
  \ 中设置的一些字段，因此稍后我们将为 `TargetCamera` 添加一个单例以使其变得简单：\n\n点击此处查看代码图片\n\n```csharp\npublic\
  \ class Shot { // Shot 没有继承 MonoBehaviour\n\n    ...\n\n    // 比较两个镜头。1 是完美匹配，小于\
  \ 0 有效\n    public static float Compare(Shot target, Shot test) {\n        // 获取相机和射线命中的偏差\n\
  \        float posDev = (test.position - target.position).magnitude;\n        float\
  \ tarDev = (test.target - target.target).magnitude;\n        float posAccPct, tarAccPct,\
  \ posAP2, tarAP2; // 准确率百分比\n        TargetCamera tc = TargetCamera.S;\n       \
  \ // 获取准确值，1 是完美，0 是勉强接受\n        posAccPct = 1-(posDev/tc.maxPosDeviation);\n \
  \       tarAccPct = 1-(tarDev/tc.maxTarDeviation);\n        // 调整数值使其更加宽松。这使用了与我们运动相同的\n\
  \        // Easing。你可以曲线化任何位于 0 到 1 之间的值，\n        // 不仅仅是插值值。\n        posAP2 =\
  \ Easing.Ease(posAccPct, tc.deviationEasing);\n    }\n}\n```\n\n\n\n\n```cs\ntarAP2\
  \ = Easing.Ease(tarAccPct, tc.deviationEasing);\n\nfloat accuracy = (posAP2+tarAP2)/2f;\n\
  \n// 记住你可以使用 Utils 将数字格式化为良好的字符串\n\nstring accText = Utils.RoundToPlaces(accuracy*100).ToString()+\"\
  %\";\n\nUtils.tr(\"Position:\",posAccPct,posAP2,\"Target:\",tarAccPct,tarAP2,\"\
  Accuracy\",accText);\n\nreturn(accuracy);\n\n}\n\n}\n```\n\n现在，为 `TargetCamera`\
  \ 添加以下**粗体代码**以使用 `Slot.Compare()` 函数：\n\n点击此处查看代码图片\n\n```cs\npublic class TargetCamera\
  \ : MonoBehaviour {\n\n    static public TargetCamera S;\n\n    public bool editMode\
  \ = true;\n    public GameObject fpCamera; // 第一人称相机\n\n    // Shot.position 允许的最大偏差\n\
  \    public float maxPosDeviation = 1f;\n    // Shot.target 允许的最大偏差\n    public\
  \ float maxTarDeviation = 0.5f;\n    // 这些偏差的缓动函数\n    public string deviationEasing\
  \ = Easing.Out;\n    public bool checkToDeletePlayerPrefs = false;\n    public bool\
  \ ________________;\n    public Rect camRectNormal; // 从 camera.rect 获取\n    public\
  \ int shotNum;\n    public GUIText shotCounter, shotRating;\n    public GUITexture\
  \ checkMark;\n    public Shot lastShot;\n\n    void Awake() {\n        S = this;\n\
  \    }\n    ...\n\n    void Update () {\n        ...\n        if (Input.GetMouseButtonDown(0)\
  \ || Input.GetMouseButtonDown(1)) {\n            ...\n            if (editMode)\
  \ {\n                if (Input.GetMouseButtonDown(0)) {\n                    //\
  \ 左键记录一次新的拍摄\n                    Shot.shots.Add(sh);\n                    shotNum\
  \ = Shot.shots.Count-1;\n                } else {\n                    // 右键替换当前的拍摄\n\
  \                    Shot.ReplaceShot(shotNum, sh);\n                    ShowShot(Shot.shots[shotNum]);\n\
  \                }\n                // 拍摄时重置玩家信息\n                ResetPlayerShotsAndRatings();\n\
  \            } else {\n                // 与当前 Shot 测试此次拍摄\n                float\
  \ acc = Shot.Compare(Shot.shots[shotNum], sh );\n                lastShot = sh;\n\
  \            }\n        }\n        ...\n    }\n    // 当需要绘制 Gizmos 时，都会调用 OnDrawGizmos()，\n\
  \    // 即使 Unity 没有在运行！\n    public void OnDrawGizmos() {\n        ...\n       \
  \ // 显示玩家的上一次尝试\n        if (lastShot != null) {\n            Gizmos.color = Color.green;\n\
  \            Gizmos.DrawSphere(lastShot.position, 0.25f);\n            Gizmos.color\
  \ = Color.white;\n            Gizmos.DrawLine(lastShot.position, lastShot.target\
  \ );\n            Gizmos.color = Color.red;\n            Gizmos.DrawSphere(lastShot.target,\
  \ 0.125f);\n        }\n    }\n}\n```\n\n请确保在 Inspector（检查器）中将 `_TargetCamera` 的\
  \ `TargetCamera.editMode` 设置为 `false`，然后按下 Play（播放）。你应该能够使用 `Q` 和 `E` 键到处走并选择不同的目标拍摄。对准目标拍摄并点击左键进行测试拍摄。Console（控制台）面板将显示你的准确率信息，Scene（场景）面板中应该出现一个新的\
  \ gizmo，显示你最后拍摄的次拍摄。如果你在某个特定拍摄上一直不准确，可以使用此来查看是你的位置还是准星导致了问题。然后你可以调整 `maxPosDeviation`\
  \ 和 `maxTarDeviation` 到更适合你的值。\n\n#### 记录和显示玩家进度\n\n现在拍摄之间已经可以正确比较了，是时候向玩家展示她在游戏中的表现了。在\
  \ `TargetCamera` 中添加此处所示**粗体代码**：\n\n点击此处查看代码图片\n\n```cs\npublic class TargetCamera\
  \ : MonoBehaviour {\n    ...\n    public string deviationEasing = Easing.Out;\n\
  \    public float passingAccuracy = 0.7f;\n    ...\n    public Shot lastShot;\n\
