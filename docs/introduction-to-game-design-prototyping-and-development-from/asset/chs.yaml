  \n**图 16.6** Web player 构建设置\n\n从这里，确保点击左侧的 `Web Player`，然后勾选 `Web Player` 区域中的\
  \ `Offline Deployment`。点击 `Build and Run`，Unity 将询问你保存文件的位置。输入 `AngryBots Web` 并点击\
  \ `Save`。\n\nUnity 将处理一段时间并为你构建游戏的版本。一旦构建完成，你的浏览器将自动打开并跳转到你刚刚创建的页面，见图 16.7。根据你的浏览器，可能会提示你运行\
  \ Unity 插件。\n\n![image](img/00082.jpeg)\n\n**图 16.7** 在浏览器窗口中运行 *AngryBots*\n\n\
  搞定了。你已经为网页版编译了 `AngryBots`。Unity 让这类操作变得非常简单，你可以专注于有趣的工作：游戏设计和开发。\n\n### 设置 Unity\
  \ 布局\n\n在开始在 Unity 中制作内容之前，我们需要做的最后一件事是正确布局我们的环境。Unity 非常灵活，其灵活性之一允许你按喜欢的方式排列窗口面板。你可以通过\
  \ Unity 窗口右上角的 `Layout` 弹出菜单选择多种窗口布局，见图 16.8。\n\n![image](img/00083.jpeg)\n\n**图\
  \ 16.8** `Layout` 弹出菜单的位置和 `2 by 3` 布局的选择\n\n从此弹出菜单选择 `2 by 3`。这将是我们布局的起点。\n\n在进行其他操作之前，让我们让\
  \ Project 面板看起来整洁一点。点击 Project 面板的选项（见图 16.9），选择 `One Column Layout`。\n\n![image](img/00084.jpeg)\n\
  \n**图 16.9** 为 Project 面板选择单列布局\n\nUnity 允许你移动窗口面板并调整它们之间的边界。如图 16.10 所示，你可以通过拖动标签（箭头光标）来移动面板，或通过拖动面板之间的边界（缩放光标）来调整边界。\n\
  \n![image](img/00085.jpeg)\n\n**图 16.10** 用于移动和调整 Unity 窗口面板的光标类型\n\n当你通过标签拖动面板时，会出现一个虚影版本（见图\
  \ 16.11）。某些位置会导致面板吸附到位。当发生这种情况时，标签的虚影版本出现在新位置。\n\n![image](img/00086.jpeg)\n\n**图\
  \ 16.11** 在 Unity 窗口中移动时的吸附的面板\n\n移动窗口面板，直到你的窗口看起来像图 16.12。\n\n![image](img/00087.jpeg)\n\
  \n**图 16.12** Unity 窗口的正确布局……但缺少东西\n\n现在我们需要添加的最后件事是 Console 面板。从菜单栏选择 `Window >\
  \ Console`。然后将 Console 面板拖到 Hierarchy 面板下方。完成此操作后，你还需要移动 Project 面板，以创建图 16.13 所示的最终布局。\n\
  \n![image](img/00088.jpeg)\n\n**图 16.13** Unity 窗口的最终布局，包括 Console 面板\n\n现在你只需要在\
  \ Layout 弹出菜单中保存此布局，这样你就不需要再次执行这些操作。点击 Layout 弹出菜单并选择 `Save Layout`，见图 16.14。\n\n\
  ![image](img/00089.jpeg)\n\n**图 16.14** 保存布局\n\n以 `Game Dev` 命名保存此布局，在 Game 前加一个空格（即“Game\
  \ Design”），以确保此布局排在菜单顶部。现在，每当你需要返回此布局时，只需从此弹出菜单中选择即可。\n\n### 熟悉 Unity\n\n在我们真正开始编码之前，你需要了解你刚刚安排的各种窗口面板。在我们讨论每个面板时，请参考图\
  \ 16.13：\n\n![Image](img/00003.jpeg) **Scene 面板：** Scene 面板允许你在 3D 场景中导航，并选择、移动、旋转和缩放对象。\n\
  \n![Image](img/00003.jpeg) **Game 面板：** Game 面板是你预览实际游戏的地方；它是你在编译网页之前运行 `AngryBots`\
  \ 的窗口。此面板还向你显示场景中 `Main Camera` 的视图。\n\n![Image](img/00003.jpeg) **Hierarchy 面板：**\
  \ Hierarchy 面板显示当前场景中的每一个 `GameObject`。现在，你可以将每个场景视为游戏的一个关卡。场景中存在的一切，从相机到玩家角色，都是\
  \ `GameObject`。\n\n![Image](img/00003.jpeg) **Project 面板：** Project 面板包含项目中的所有资源。资源是项目部分的任何文件，包括图像、3D\
  \ 模型、C# 代码、文本文件、声音、字体等。Project 面板是你计算机硬盘上 Unity 项目文件夹内 `Assets` 文件夹内容的反映。这些资源并不一定在当前场景中。\n\
  \n![Image](img/00003.jpeg) **Inspector 面板：** 每当你点击 Project 面板中的资源或 Scene 或 Hierarchy\
  \ 面板中的 `GameObject` 时，你都可以在 Inspector 面板中查看并编辑有关它的信息。\n\n![Image](img/00003.jpeg)\
  \ **Console 面板：** Console 面板允许你看到 Unity 关于代码中错误或 Bug 的消息，以及你自己提供的帮助你理解自己代码的消息。\n\
  \n### 总结\n\n设置就此结束。现在，让我们开始实际开发吧！正如你在这一章看到的，Unity 可以创建一些非常漂亮的视觉效果和引人入胜的游戏性。尽管制作漂亮的\
  \ 3D 模型和着色器的过程在本本书范围之外，但了解 Unity 能力范围对你来说是很重要的。在下一章中，你将学习更多 C#，这是你将用于游戏开发的语言。\n\n\
  ## 第 17 章：介绍我们的语言：C#\n\n**本章向你介绍 C# 的关键特性，并描述了选择它作为本书语言的一些重要原因。它还检查了 C# 的基础语法，解释了一些简单\
  \ C# 语句结构的含义。**\n\n**在本章结束时，你将更好地理解 C#，并准备好应对后续更深入的章节。**\n\n### 理解 C# 的特性\n\n正如第\
  \ 15 章“数字系统思维”所涵盖的，编程是给计算机一系列简单的指令，而 C# 是我们执行这些指令的语言。然而，有很多不同的编程语言，每种语言都有其优缺点。C#\
  \ 的一些特性是：\n\n![Image](img/00003.jpeg) 编译型语言\n\n![Image](img/00003.jpeg) 管理代码\n\n\
  ![Image](img/00003.jpeg) 强类型\n\n![Image](img/00003.jpeg) 基于函数的\n\n![Image](img/00003.jpeg)\
  \ 面向对象的\n\n这些特性将在随后的节中详细描述，每种特性都将从各个方面帮助你。\n\n#### C# 是编译型语言\n\n\n\n\n当大多数人编写计算机程序时，他们实际上并不是用计算机本身能够理解的语言来编写。事实上，市场上的每种计算机芯片都有一套略有不同但非常简单的指令集，这被称为机器语言。这种语言对于芯片来说执行速度非常、非常快，但对于人类来说阅读起来极其困难。例如，机器语言行\
  \ `000000 00001 00010 00110 00000 100000` 对正确的计算机芯片来说意味着某些意义，但对人类读者来说几乎毫无意义。不过，你可能已经注意到，那段机器码的每一个字符要么是\
  \ `0` 要么是 `1`。这是因为所有更复杂的数据类型——数字、字母等——都已转换成了单个的数据位 `bits`（即 1 或 0）。如果你听过人们使用打卡片为计算机编程，这正是他们所做的：对于某些格式的二进制打卡片，在纸板上物理地打一个孔代表\
  \ 1，而未打孔的地方则代表 0。\n\n为了让人们能够更容易地编写代码，人们创建了人类可读的编程语言——有时称为编写语言。你可以将编写语言想象成一种中间语言，充当你与计算机之间的桥梁。像\
  \ `C#` 这样的编写语言逻辑清晰且简单，足以让计算机解释，同时又接近人类书面语言，让程序员能够轻松地阅读和理解它们。\n\n编写语言之间还有一个主要划分，即`编译型`语言（如\
  \ `BASIC`、`C++`、`C#` 和 `Java`）与`解释型`语言（如 `JavaScript`、`Perl`、`PHP` 和 `Python`）（参见图\
  \ 17.1）。\n\n![image](img/00090.jpeg)\n\n**图 17.1** 编程语言的简单分类\n\n在`解释型`语言中，编写和执行代码是一个两步骤的过程：程序员编写代码；然后，每当玩家玩游戏时，代码都会在玩家的机器上实时从编写语言转换为机器语言。这样做的好处是它能够实现代码的可移植性，因为编写的代码可以根据其运行的计算机类型进行特定的解释。例如，给定网页的\
  \ `JavaScript` 将运行在几乎任何现代计算机上，无论该计算机运行的是 `OS X`、`Windows`、`Linux`，甚至是许多移动操作系统如 `iOS`、`Android`、`Windows\
  \ Phone` 等。然而，这种活性也导致代码执行速度较慢，原因在于：在玩家计算机上解释代码所需的时间、编写语言针对其运行的设备未经过优化，以及许多其他原因。由于相同的解释代码运行在所有设备上，因此无法针对恰好运行的特定设备进行优化。正因如此，用\
  \ `JavaScript` 等解释型语言创建的 3D 运行速度比用编译语言创建的慢得多，即使在同一台计算机上运行也是如此。\n\n使用`编译型`语言（如 `C#`）时，编程过程有三个独立的步骤：编写代码、编译代码和执行编译后的程序。新增的编译过程将代码转换为可执行文件（即应用程序或\
  \ App），计算机可以在不需要解释器的情况下直接运行。由于编译器既对程序有完全理解，又对程序运行的执行平台有完全理解，因此可以在过程中加入许多优化。在游戏中，这些优化直接转化为更高的帧率、更详细的图形和更灵敏的游戏。由于这种优化和速度优势，大多数高预算游戏都是用编译型语言编写的，但这意味着必须为每个执行平台编译不同的可执行文件。\n\
  \n在许多情况下，编译型编写语言仅适用于单一执行平台。例如，`Objective C` 是苹果计算机公司专有的编写语言，用于为 `OS X` 和 `iOS` 制作应用程序。这种语言基于\
  \ `C`（`C++` 的前身），但它包含了许多 `OS X` 或 `iOS` 开发特有的功能。同样，`XNA` 是微软专门开发的一种 `C#` 变体，专门用于让学生能够为基于\
  \ `Windows` 的个人电脑和 `Xbox 360` 编写游戏。\n\n如第 16 章所提到的，“介绍我们的开发环境：Unity”中提到的，Unity 允许使用\
  \ `C#`（以及 `Boo` 和名为 `UnityScript` 的 `JavaScript` 版本）来创建游戏。这三种语言中的任何一种都会在额外的编译步骤中编译成`通用中间语言\
  \ (CIL)`，然后该 `CIL` 再被编译到任意多个平台，从 `iOS` 到 `Android`、`Mac`、`Windows PC`、如 `Wii` 和\
  \ `Xbox` 等游戏主机，甚至是如 `WebGL` 等解释型语言。这个额外的 `CIL` 步骤确保了即使是用 `UnityScript` 或 `Boo` 编写，Unity\
  \ 程序也能被编译，但我仍然认为 `C#` 优于其他两种。\n\n一次编写、随处编译的能力并不是 Unity 特有的，但它是 Unity Technologies\
  \ 对 Unity 的核心目标之一，并且比我见过的任何其他游戏开发软件都更好地集成到 Unity 中。然而，作为游戏设计师，你仍然需要认真考虑用于触摸手机的游戏和运行在鼠标键盘电脑上的游戏之间的差异，因此你通常会有不同的代码。\n\
  \n### C# 是托管代码\n\n更传统的编译型语言如 `BASIC`、`C++` 和 `Objective-C` 要求程序员直接管理内存，强制程序员在创建或销毁变量时手动分配和释放内存。如果程序员在这些语言中没有手动释放内存，她的程序将会“内存泄漏”并最终占用计算机的所有内存，导致崩溃。内存分配是在计算机中留出特定数量的随机存取内存\
  \ (RAM) 以便能够存储数据的过程。虽然计算机现在有数百千字节（GB）的硬盘空间，但 RAM 只有小于 20GB。RAM 比硬盘内存*快得多*，因此应用程序从硬盘提取图像和声音，在\
  \ RAM 中分配空间，然后存储在 RAM 中以便快速访问。\n\n幸运的是，C# 是*托管代码*，这意味着内存的分配和释放是由自动处理的。你仍然可以在托管代码导致内存泄漏，但很难。\n\
  \n### C# 是强类型的\n\n变量将在后面的章节中详细介绍，但你现在需要了解几点。首先，变量只是一个用于值的命名容器。例如，在代数中，你可能见过这样的表达式：\n\
  \n```\nx = 5\n```\n\n在这一行中，我们创建了一个变量，将其命名为 `x`，并给它赋值 `5`。之后，如果询问 `x + 2` 的值，我确定你能告诉我答案是\
  \ `7`，因为你记得 `x` 持有的值 `5`。这就是变量在编程中为你做的事情。\n\n在大多数解释型语言（如 JavaScript）中，同一个变量可以持有任何类型的数据。变量\
  \ `x` 在一分钟前可以持有数字 `5`，下一分钟可以持有图像，之后持有声音文件。这种持有任何类型值的能力就是当我们说一种编程语言是*弱类型*时所的意思。\n\
  \n\n\n相比之下，C# 是*强类型*的。这意味着当我们最初创建一个变量时，我们在那一刻就告诉了它可以持有什么类型的值：\n\n```cs\nint x =\
  \ 5;\n```\n\n在上述语句中，我们创建了一个名为 `x` 的变量，告诉它它只允许持有整数值（即不带小数点的数字），并为它分配了整数值 `5`。虽然这看起来会让编程变得更加困难，但强类型允许编译器进行许多优化，并使作者编写环境\
  \ `MonoDevelop` 能够对你编写的代码进行实时语法检查（非常就像 `Microsoft Word` 执行的语法检查一样）。这还启用并增强了代码补全功能，这是\
  \ `MonoDevelop` 中的一项技术，它能够预测你正在输入的单词，并根据你已经编写的其他代码为你提供有效的补全选项。通过代码补全，如果你在输入时看到 `MonoDevelop`\
  \ 建议了某个单词的正确补全，只需按 `Tab` 键即可接受该建议。一旦你习惯了这一点，它每分钟可以为你节省数百次击键。\n\n## C# 是基于函数的\n\n\
  在编程早期，程序是由单系列命令组成的。这些程序直接从头到尾运行，就像你给一个试图开车来你家的朋友提供的指令一样：\n\n1. 从学校出发，沿 `Vermont`\
  \ 北向。\n2. 沿 `I-10` 西向约 7.5 英里。\n3. 在 `I-405` 的交汇处，转入 `405` 南向 2 英里。\n4. 经 `Venice\
  \ Blvd` 出口。\n5. 右转进入 `Sawtelle Blvd`。\n6. 我家就在 `Venice` 北边的 `Sawtelle` 街。\n\n后来，编程中增加了可重复的区块，形式诸如*循环*（一段会重复自身的代码段）和*子程序*（一段原本无法直接访问、但可以跳转到、执行并然后返回的代码段）。\n\
  \n*函数式语言*允许程序员对代码块进行命名，从而封装功能（即将一系列操作分组在一个函数名称下）。例如，如果你像之前描述的那样给某人提供去你家的详细路线，同时又要求他在沿途中顺便帮你买瓶牛奶，那么他就知道如果在路上看到杂货店，就应该停车、下车、寻找牛奶、付钱、回到车上，然后继续去你家。因为你的朋友已经知道如何买牛奶，你只需要要求他这样做，而不是为每一个微小的步骤提供显式指令。这看起来像这样：\n\
  \n“嘿哥们儿，如果你在路上看到商店，能请你 `BuySomeMilk()` 吗？”\n\n在句句中，你将买牛奶的所有指令封装了一个名为 `BuySomeMilk()`\
  \ 的单个函数中。任何函数式语言都可以完成同样的操作。当计算机处理 `C#` 并遇到函数名后跟括号时，它将*调用*该函数（即它将执行函数中封装的所有操作）。你将在第\
  \ 23 章 中的“函数和参数”中学更多关于函数的知识。\n\n函数的另一个神奇之处是，当你写过一次 `BuySomeMilk()` 函数的代码后，就不需要再写。即使你正在编写一个完全不同的程序，通常也可以复制并粘贴像\
  \ `BuySomeMilk()` 这样的函数并重用它们，而无需从头重新编写整个内容。在本的教程章节中，你将编写一个名为 `Utils.cs` 的 `C#` 脚本，其中包含几个可重用的函数。\n\
  \n## C# 是面向对象的\n\n在函数发明多年后，*面向对象*代码（OOC）的概念诞生了。在 OOC 中，不仅功能，数据也被封装在一起，被称为*对象*或更准确地说是*类*的东西中。这在第\
  \ 25 章 中的“类”中有详细介绍，但这里先给你一个比喻。\n\n考虑各种动物。每种动物都有一些关于它自身的特定信息。这些数据的示例可以是它的物种、年龄、大小、情绪状态、饥饿程度、当前位置等。每种动物还具有某些它可以做的事情：吃、移动、呼吸等。关于动物的数据类似于代码中的变量，而动物可以执行的操作类似于函数。\n\
  \n在 OOC 之前，代码中表示的动物可以持有信息（即变量），但不能执行任何操作。那些操作是由没有直接连接动物的函数执行的。程序员可以写一个名为 `Move()`\
  \ 的函数，它可以移动任何种类的动物，但她必须在那个函数里写几行代码来判断它是哪种动物以及哪种移动方式适合它。例如，狗会走，鱼游泳，鸟会飞。每当程序中添加一种新动物时，`Move()`\
  \ 都需要更改以适应新的运动类型，并且 `Move()` 会不断变得越来越大、越来越复杂。\n\n面向对象通过引入*类*和*类继承*的概念改变了这一切。一个*类*将变量和函数结合结成一个完整的对象。在\
  \ OOC 中，不再有一个可以处理任何动物的巨型 `Move()` 函数，相反，每个物种的动物都附带了一个更小、更具体的 `Move()` 函数。这消除了你每添加一个物种就重写一次\
  \ `Move()` 的需要。相反，每种动物物种都有它自己的 `Move()` 函数。\n\n面向对象还包括*类继承*的概念。这使得子类能够继承或覆盖父类中的函数。\n\
  \n### 阅读和理解 C# 语法\n\n就像任何其他语言一样，`C#` 有必须遵循的特定语法。看看这些英语示例语句：\n\n1. The dog barked\
  \ at the squirrel.\n2. At the squirrel the dog barked.\n3. The dog at the squirrel.\
  \ barked\n4. barked The dog at the squirrel.\n\n这些英语语句具有相同的单词和标点符号，但它们的顺序不同，标点符号和大小写也发生了变化。因为你熟悉英语，你可以很容易判断第一个是正确的，而其他都是错误的。检查这种问题的另一种方法是更抽象地将其视为词性：\n\
  \n1. [主语] [谓语] [宾语]。\n2. [宾语] [主语] [谓语]。\n3. [主语] [宾语]. [谓语]\n4. [谓语] [主语] [宾语]。\n\
  \n当词性这样重新排列时，会改变句子的语法结构，后三个句子是错误的，因为它们有*语法错误*。\n\n\n\n\n就像任何语言一样，C# 也有特定的语法规则来规定语句必须如何编写。让我们详细检查一下这条简单的语句：\n\
  \n```\nint x = 5;\n```\n\n如之前解释过的，这条语句执行了几项操作：\n\n![Image](img/00003.jpeg) 声明了一个类型为\
  \ `int`、名为 `x` 的变量\n\n每当语句以变量类型开头时，语句的第二个单词就是该类型新变量的名称（参见第 19 章，“变量与组件](#part0032.html_ch19)”）。这被称为`declaring`（声明）一个变量。\n\
  \n![Image](img/00003.jpeg) 将 `x` 的值为 `5`\n\n`=` 符号用于向变量赋值（`assign` values），这也被称为`defining`（定义）变量。这样做时，变量名在左侧，赋值的值在右侧。\n\
  \n![Image](img/00003.jpeg) 以分号（`;`）结尾\n\nC# 中的每一个简单语句都必须以分号（`;`）结尾。这在用法上类似于英语句子末尾的句号。\n\
  \n***\n\n### Note\n\n为什么不在 C# 语句末尾使用句号？计算机编程语言追求极其清晰。C# 语句末尾不使用句号，是因为它在数字中已经用作小数点了（例如\
  \ `3.14159` 中的句号）。为了清晰起见，C# 中分号的唯一用途就是结束语句。\n\n***\n\n现在，我们来添加第二个简单语句：\n\n点击此处查看代码图像\n\
  \n```\nint x = 5;\nint y = x * ( 3 + x );\n```\n\n你已经理解了第一条语句，现在我们来检查第二条。第二条语句执行了以下操作：\n\
  \n![Image](img/00003.jpeg) 声明了一个类型为 `int`、名为 `y` 的变量\n\n![Image](img/00003.jpeg)\
  \ 将 `3 + x`（即 3 + 5，结果为 8）相加\n\n就像在代数中一样，`order of operations`（运算顺序）优先遵循括号，这意味着\
  \ `3 + x` 先被计算，因为它被括号包围。和为 8 是因为在上条语句中 `x` 的值被设置为 `5`。在附录 B，“常用概念参考](#part0052.html_app02)”中，请阅读“运算符优先级和运算顺序”章节以了解更多关于\
  \ C# 中的运算顺序，但程序中主要要记住的一点是：如果你在脑中对事情发生的顺序有`any`任何疑问，就应该使用括号来消除疑问（并提高代码的可读性）。(2)\n\
  \n如果没有括号，运算顺序将在处理加减法`之前`处理乘法和除法。这将导致 `x * 3 + 5`，其结果将变为 5 * 3 + 5，然后是 15 + 5，最后是\
  \ 20。\n\n![Image](img/00003.jpeg) 将 `x` 乘以 8（`x` 是 5，所以结果是 40）\n\n![Image](img/00003.jpeg)\
  \ 将 `y` 的值为 `40`\n\n![Image](img/00003.jpeg) 以分号（`;`）结尾\n\n本章以对最后一组 C# 语句的拆解结束。在这个示例中，语句现在被编号了。行号可以使引用代码中的特定行变得简单得多，我希望当你将代码输入电脑时，行号能让你更容易阅读和理解书中的代码。需要记住的一点是，**你不需要在\
  \ MonoDevelop 中输入行号**。MonoDevelop 会在你工作时自动为你的行编号（并重新编号）：\n\n点击此处查看代码图像\n\n```\n\
  1   string greeting = \"Hello World!\";\n2   print( greeting );\n```\n\n这些语句处理字符串（一系列字符，如单词或句子），而不是整数。第一条语句（编号为\
  \ `1`）：\n\n![Image](img/00003.jpeg) 声明了一个类型为 `string`、名为 `greeting` 的变量\n\n`string`\
  \ 是另一种变量类型，就像 `int` 一样。\n\n![Image](img/00003.jpeg) 将 `greeting` 的值为 `\"Hello World!\"\
  `\n\n`\"Hello World!\"` 周围的双引号告诉 C#，它们之间的字符应被视为`string literal`（字符串字面量），而不会被编译器解释为具有任何额外的含义。在代码中放入字符串字面量\
  \ `\"x = 10\"` 将**不会**定义 `x` 的值为 `10`，因为编译器知道忽略引号内所有的字符串字面量。\n\n![Image](img/00003.jpeg)\
  \ 以分号（`;`）结尾\n\n第二条语句（编号为 `2`）：\n\n![Image](img/00003.jpeg) 调用函数 `print()`\n\n如之前讨论的，函数是操作的集合。当函数被调用时，它执行其包含的操作。正如你所预期的，`print()`\
  \ 包含了输出字符串的操作。有些函数需要你传递某些东西。\n\n![Image](img/00003.jpeg) 将 `greeting` 传递给 `print()`\n\
  \n\n\n\n当你在 Unity 中创建一个项目时，你实际上只是创建了一个文件夹，用于存放组成项目的所有文件。如你所见，一旦 Unity 完成项目的创建，新项目会带有一个打开的场景，其中只包含一个\
  \ `Main Camera`，而 Project（项目）窗格中什么都没有。在进行其他操作之前，请从菜单栏选择 `File > Save Scene` 保存你的场景。Unity\
  \ 会自动选择正确的位置保存场景，你只需将其命名为 `_Scene_0` 并点击 `Save`。现在，你的场景出现在 Project 窗格中了。\n\n场景名称\
  \ `_Scene_0` 开头的下划线 `_` 会导致场景始终排序在 Project 窗格的最顶部。我也经常将 `Main Camera` 重命名为 `_MainCamera`，以在\
  \ Hierarchy（层级）面板中实现相同的排序效果。\n\n右键点击 Project 窗格并选择 `Reveal in Finder`（Windows 系统下为\
  \ `Show in Explorer`），如[图 18.1]所示。\n\n![image](img/00091.jpeg)\n\n**图 18.1** 新 Unity\
  \ 项目的空白画布（显示 Project 窗格弹出菜单中的 Reveal in Finder）\n\n***\n\n**提示**\n\n**在 OS X 上右键点击**\
  \ 在 OS X 鼠标或触控板上执行右键点击不像在 Windows PC 上操作那么简单。有关如何执行此操作，请查阅[附录 B],[有用概念参考”中的“[在 OS\
  \ X 上右键点击]章节”。\n\n选择 `Reveal in Finder` 将打开一个 Finder 窗口（或资源管理器窗口），显示你的项目文件夹内容（参见[图\
  \ 18.2]）。\n\n![image](img/00092.jpeg)\n\n**图 18.2** 在 OS X Finder 中显示的 Hello World\
  \ 项目文件夹\n\n如你在[图 18.2]的图像所示，`Assets` 文件夹包含了 Unity 中 Project 窗格中显示的所有内容。从理论上讲，你可以交替使用\
  \ `Assets` 文件夹和 Project 窗格（例如，如果你将一张图片拖入 `Assets` 文件夹，它就会出现在 Project 窗格中，反之亦然），但我强烈建议专门使用\
  \ Project 窗格而非 `Assets` 文件夹进行工作。直接在 `Assets` 文件夹中进行更改有时会导致问题，而 Project 窗格通常更安全。此外，非常重要的一点是你千万不要碰\
  \ `Library`、`ProjectSettings` 或 `Temp` 文件夹。这样做会导致 Unity 出现异常行为，甚至可能损坏你的项目。\n\n***\n\
  \n**警告**\n\n**千万不要在 Unity 运行时更改项目文件夹名称** 如果你在 Unity 运行时更改项目文件夹名称，它将以一种非常不体的方式崩溃。Unity\
  \ 在运行时会在后台进行大量文件管理，更改文件夹名称几乎总是会导致崩溃。如果你想更改项目文件夹名称，请退出 Unity，更改名称，然后重新启动 Unity。\n\
  \n***\n\n现在切回 Unity。\n\n### 创建一个新的 C# 脚本\n\n时候到了。现在你将编写你的第一段代码。我们将在后面的章节中更多关于 C#\
  \ 的内容，但现在，只需复制你在这里看到的内容。点击 Project 窗格中的 `Create` 按钮并选择 `Create > C# Script`（如[图\
  \ 18.3]所示）。一个新脚本将被添加到 Project 窗格中，它的名称将自动高亮以便你更改。将此脚本命名为 `HelloWorld`（确保两个单词之间没有空格）并按\
  \ Return 键（PC 上的 `Enter` 键）设置名称。\n\n![image](img/00093.jpeg)\n\n**图 18.3** 创建新的\
  \ C# 脚本并在 MonoDevelop 中查看该脚本\n\n双击 `HelloWorld` 脚本的名称或图标启动 MonoDevelop，这是我们的 C#\
  \ 编辑器。你的脚本看起来应该和[图 8.3]中的完全一样，除了第 8 行。在 MonoDevelop 脚本第 8 行输入两个制表符（tab）以及代码 `print(\"\
  Hello World\");`。确保所有拼写和大小写完全正确，并在行尾加上一个分号（`;`）。你的 `HelloWorld` 脚本现在看起来应该与下面的代码列表完全一致。在书中的代码列表中，任何你需要输入的新内容都将以**粗体**显示，而已经存在的代码为`普通粗细`。\n\
  \n以下代码语法的每行代码前面都有一个行号。如你在[图 18.3]所示，MonoDevelop 会自动为你的代码显示行号，因此你不需要手动输入它们。它们出现在书里是为了让代码列表更清晰。\n\
  \n```\n1  using UnityEngine;\n2  using System.Collections;\n3\n4  public class HelloWorld\
  \ : MonoBehaviour\n5  {\n6    void Start()\n7    {\n8        // initialization\n\
  9        print(\"Hello World\");\n10   }\n11\n12   // Update is called per frame\n\
  13   void Update()\n14   {\n15   }\n16 }\n```\n\n***\n\n**注意**\n\n你的 MonoDevelop\
  \ 版本可能会添加一些空格。通常情况下，虽然编程中大小写很重要，但空格更灵活。如果行号与代码中的示例不同，你也不必太生气。\n\n***\n\n现在，通过 MonoDevelop\
  \ 中的 `File > Save` 保存此脚本并切回 Unity。\n\n这部分有点复杂，但你很快就会习惯，因为它非常常见。点击并按 Project 窗格中\
  \ `HelloWorld` 脚本的名称，将其拖到场景 Hierarchy 面板中的 `Main Camera` 上，然后释放鼠标，如[图 18.4]所示。当你拖动脚本时，你会看到\
  \ `HelloWorld (Script)` 字样跟随鼠标，当你在 `Main Camera` 上释放鼠标时，`HelloWorld (Script)` 字就会消失。\n\
  \n![image](img/00094.jpeg)\n\n**图 18.4** 在 Hierarchy 面板将 HelloWorld C# 脚本附加到 Main\
  \ Camera\n\n将 `HelloWorld` 脚本拖到 `Main Camera` 上会将脚本作为`组件`附加到 `Main Camera`。出现在场景层级中的所有对象（例如\
  \ `Main Camera`）被称为 GameObject，而 GameObject 由组件组成。如果你现在点击 Hierarchy 面板中的 `Main Camera`，你应该能在\
  \ Inspector 面中看到 `HelloWorld (Script)` 列为 Main Camera 的组件之一。如[图 18.5]所示，Inspector\
  \ 面显示了 `Main Camera` 的多个组件，包括它的 `Transform`、`Camera`、`GUILayer`、`Flare Layer`、`Audio\
  \ Listener` 和 `HelloWorld (Script)`。GameObject 和组件将在后面的章节中进行详细介绍。\n\n![image](img/00095.jpeg)\n\
  \n**图 18.5** HelloWorld 脚本出现在 Main Camera 的 Inspector 面中\n\n现在，只需点击 `Play` 按钮（Unity\
  \ 窗口顶部向右的三角形），见证魔法！\n\n![image](img/00096.jpeg)\n\n**图 18.6** 控制台打印出 *Hello World!*\n\
  \n\n\n\n\n我们编写的脚本在控制台（Console）面板打印了 `Hello World!`，如图 18.6 所示。你会发现，它在屏幕左下角的小灰色条上也打印了\
  \ `Hello World!`。这可能不是你生命中发生过最神奇的事情，但你必须从某个地方开始，而我们已经迈出了这一步。正如一位智的老人所说，你已经向一个更大的世界迈出了第一步。\n\
  \n### `Start()` 与 `Update()`\n\n现在，让我们尝试将 `print()` 函数调用从 `Start()` 移动到 `Update()`。回到\
  \ `MonoDevelop` 并按照下面的代码列表修改你的代码。\n\n在第 8 行开头添加两个正斜杠（`//`）会将第 8 行中斜杠之后的所有内容转换为`注释`。计算机会完全忽略注释，它们被用于禁用代码（正如你现在对第\
  \ 8 行所做的那样）或为阅读代码的其他人类留存信息（如你在第 6 行和第 11 行所示）。在行之前添加两个斜杠（如我们对第 8 行所做的）被称为“注释掉”（commenting\
  \ out）该行。在第 13 行输入语句 `print(\"Hello World!\");` 使其成为 `Update()` 函数的一部分。\n\n点击此处代码图像\n\
  \n```cpp\n1 using UnityEngine;\n2 using System.Collections;\n3\n4 public class HelloWorld\
  \ : MonoBehaviour {\n5\n6     // Use this for initialization\n7     void Start ()\
  \ {\n8         // print(\"Hello World!\"); // 这行现在被忽略了。\n9     }\n10\n11     //\
  \ Update is called once per frame\n12     void Update () {\n13         print(\"\
  Hello World!\");\n14     }\n15 }\n```\n\n保存脚本（替换原始版本）并尝试再次点击按钮。你会看到 `Hello World!`\
  \ 现在连续打印了很多次（参见图 18.7）。你可以再次点击播放按钮停止执行，你会发现 Unity 停止输出 `Hello World!` 消息。\n\n![image](img/00097.jpeg)\n\
  \n**图 18.7** `Update()` 导致每帧都打印 `Hello World!`\n\n`Start()` 和 `Update()` 都是 Unity\
  \ 版本 C# 中的特殊函数。`Start()` 在对象存在的第一帧被调用一次，而 `Update()` 每帧都会被调用一次，这就是为什么图 18.6 是单条消息而图\
  \ 18.7 是多条消息的原因。Unity 有一系列这类在不同时间点调用的特殊函数。其中许多内容将在本书后部分介绍。\n\n**提示**\n如果你只想每个重复的消息显示一次，可以点击控制台面板的\
  \ `Collapse`（折叠）按钮（如图 18.7](#part0031.html_ch18fig07) 中的箭头所示），它将确保每个不同的消息只出现一次。\n\
  \n### 让事情变得有趣\n\n现在我们要为你的第一个程序添加一些样式。在这个示例中，我们将创建许多许多立方体（cube）。每个副本都将独立地跳动并对物理做出反应。这将同时展示\
  \ Unity 的运行速度，以及它让你创建内容的简易程度。\n\n从创建一个新场景开始。从菜单栏选择 `File > New Scene`。不会发现太大区别，因为我们在\
  \ `Scene_0` 中除了脚本外并没做什么东西，但如果你点击主相机（Main Camera），你会发现它不再挂载脚本，你还会注意到 Unity 窗口的标题栏已从\
  \ `Scene_0.unity - Hello World, PC, & Standalone` 变为 `Untitled - World, PC, & Standalone`。一如既往，你应该做的第一件事是保存这个新场景。从菜单栏选择\
  \ `File > Save Scene` 并将其命名为 `Scene_1`。\n\n现在，从菜单栏选择 `GameObject > Create Other\
  \ > Cube`。将在场景面板（Scene pane）和层级面板（Hierarchy pane）中放置一个名为 `Cube` 的 GameObject。如果在场景面板中很难看到\
  \ `Cube`，在层级面板中双击它的名称将使场景聚焦到 `Cube` 上。如需更多信息，请阅读本章稍后部分关于“更改场景视图”的侧边栏，其中涵盖了如何操作场景面板的视图。\n\
  \n如果你点击层级面板中的 `Cube`，你应该看到它在场景面板中被选中，并在检器面板（Inspector pane）中看到它的组件（参见图 18.8）。检器面板的主要目的是让你查看并编辑组成任何\
  \ GameObject 的组件。这个 `Cube` GameObject 拥有 `Transform`、`Mesh Filter`、`Box Collider`\
  \ 和 `Mesh Renderer` 组件：\n\n![Image](img/00003.jpeg) **Transform:** `Transform` 组件设置\
  \ GameObject 的位置、旋转和缩放。这是每个 GameObject 都必需的唯一组件。\n\n![Image](img/00003.jpeg) **Cube\
  \ (Mesh Filter):** `Mesh Filter` 组件提供了物体的几何形状。\n\n![Image](img/00003.jpeg) **Box\
  \ Collider:** `Collider` 组件允许带有 `Rigidbody` 的 GameObject 与其他物体进行交互。\n\n![Image](img/00003.jpeg)\
  \ **Mesh Renderer:** `Mesh Renderer` 组件将 `Mesh Filter` 提供的几何形状显示在屏幕上。\n\n![image](img/00098.jpeg)\n\
  \n**图 18.8** 创建一个新的立方体 GameObject\n\n现在我们要为这个 GameObject 添加另一个组件：`Rigidbody`。当 `Cube`\
  \ 仍处于层级面板选中状态时，从菜单栏选择 `Component > Physics > Rigidbody`，你会看到检器中添加了 `Rigidbody` 组件。\n\
  \n现在，如果你点击播放按钮，你会看到盒子由于重力而落下。\n\nUnity 中所有的物理模拟都基于公制单位。这意味着：\n\n1 个单位距离 = 1 米（例如\
  \ `transform` 位置的单位）。我有时会将 Unity 中的一个单位距离称为 `1m`。\n\n1 个单位质量 = 1 公斤（例如 `Rigidbody`\
  \ 质量的单位）。\n\n默认重力为 –9.8 m/s²，方向朝下（负 y 轴方向）。\n\n一个平均的人类角色会有 2 个单位（2 米）高。\n\n\n目前，你的场景有点暗，所以让我们添加一些光。从菜单栏中选择\
  \ `GameObject > Create > Directional Light`（物体 > 创建 > 平行光）。这将场景中添加一个平行光，让你更清楚地看到立方体。我们将在后面的章节中详细讨论各种光。\n\
  \n## 创建制体 (Prefab)\n\n现在，我们将把 `Cube` 变成一个 `prefab`（制体）。制体是项目中的可复用元素，可以被多次实例化（克隆并生成）。你可以将制体想象成\
  \ `GameObject` 的模具，而由该制体制作的每个 `GameObject` 都称为该制体的 `instance`（实例）（这就是 `instantiate`\
  \ 实例化一词的由来）。要创建一个制体，点击 `Hierarchy`（层级）面板中的 `Cube`，将其拖到 `Project`（项目）面板并释放鼠标按钮（参见图\
  \ 18.9）。\n\n![image](img/00099.jpeg)\n\n**图 18.9** 将 Cube 变成制体\n\n你会看到刚刚发生了几件事：\n\
  \n1. `Project` 面板中创建了一个名为 `Cube` 的制体。你可以通过旁边的蓝色立方体图标判断它是一个制体。（无论制体本身的形状如何，制体图标始终是一个立方体。）\n\
  \n2. `Hierarchy` 中 `Cube` `GameObject` 的名称变成了蓝色。如果 `GameObject` 在 `Hierarchy` 中的名称是蓝色的，意味着该\
  \ `GameObject` 是制体的 `instance`（即根据制体模具制作的副本）。\n\n为了清晰起见，让我们将 `Project` 面板中的 `Cube`\
  \ 制体重命名 `Cube Prefab`。点击一次 `Cube` 制体以选中它。然后点击第二次进行重命名（你也可以尝试在选中后按 `Return` [PC 上按\
  \ `F2`] 来重命名），然后将名称改为 `Cube Prefab`。你会发现，因为 `Hierarchy` 面板中的实例只是它的拷贝，它的名称也跟着改变了。如果你将\
  \ `Hierarchy` 中的实例重命名为与制体不同的名称，则实例名称将不受影响。\n\n现在我们已经设置好了制体，不再需要场景中的那个实例了。点击 `Hierarchy`\
  \ 面板中的 `Cube Prefab`（不是 `Project` 面板！）。然后从菜单栏选择 `Edit > Delete`（编辑 > 删除）。\n\n是时候动手写些代码了。\n\
  \n从菜单栏选择 `Assets > Create > C# Script`（资源 > 创建 > C# 脚本），并将新创建的脚本命名为 `CubeSpawner`（确保名称中有两个大写字母且没有空格）。双击\
  \ `CubeSpawner` 脚本打开 `MonoDevelop`，添加此处显示的**加粗代码**并保存：\n\n点击此处查看代码图像\n\n```csharp\n\
  using UnityEngine;\nusing System.Collections;\n\npublic class CubeSpawner : MonoBehaviour\
  \ {\n    public GameObject cubePrefabVar;\n\n    // 使用此进行初始化\n    void Start ()\
  \ {\n        Instantiate( cubePrefabVar );\n    }\n\n    // Update 每帧调用一次\n    void\
  \ Update() {\n\n    }\n}\n```\n\n这与我们之前的脚本一样，这需要挂载到某个物体才能运行，因此在 Unity 中，就像你之前在图\
  \ 18.4 中做的那样，将 `CubeSpawner` 脚本拖到 `Main Camera` 上。\n\n现在，点击 `Hierarchy` 面板中的 `Main\
  \ Camera`。你会发现 `Main Camera` `GameObject` 上添加了一个 `Cube Spawner (Script)` 组件（参见图\
  \ 18.10）。\n\n![image](img/00100.jpeg)\n\n**图 18.10** Main Camera 的 Inspector 面板中的\
  \ CubeSpawner 脚本组件\n\n你还可以看到此组件中有一个名为 `Cube Prefab Var` 的变量（尽管正如下面的警告所解释，它实际上应该是\
  \ `cubePrefabVar`）。这源于你在第 5 行输入的 `\"public GameObject cubePrefabVar;\"` 语句。如果脚本中的变量被标记为\
  \ `\"public\"`，它将出现在 `Inspector`（检查器）面板中。\n\n***\n\n**警告：变量名在 Inspector 中看起来不同**\n\
  \nUnity 的某人认为在 `Inspector` 面板中更改变量名的大小写和间距会很好看。我不知道为什么这种做法持续到了当前版本，但这意味着你的变量名如 `cubePrefabVar`\
  \ 会在 `Inspector` 中错误地显示为 `Cube Prefab Var`。在编程时请务必正确引用你的变量名，并忽略你在 `Inspector` 中看到的奇怪的大小写和间距。在书中，我通过代码中的正确名称来引用变量，而不是在\
  \ `Inspector` 中显示的名称。\n\n***\n\n正如你在 `Inspector` 中看到的，`cubePrefabVar` 目前没有赋值值。点击\
