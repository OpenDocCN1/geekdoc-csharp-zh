  \ Vector2 multiplier; // 设置牌阵的间距\n    // SlotDef 引用\n    public List<SlotDef> slotDefs;\
  \ // Row0-Row3 的所有 SlotDefs\n    public SlotDef drawPile;\n    public SlotDef discardPile;\n\
  \    // 这存储了由 layerID 设置的所有可能的层名称\n    public string[] sortingLayerNames = new string[]\
  \ { \"Row0\", \"Row1\", \"Row2\", \"Row3\", \"Discard\", \"Draw\" };\n    // 此函数被用于读取\
  \ LayoutXML.xml 文件\n    public void ReadLayout(string xmlText) {\n        xmlr =\
  \ new PT_XMLReader();\n        xmlr.Parse(xmlText); // 解析 XML\n        xml = xmlr.xml[\"\
  xml\"][0]; // 将 xml 设置为 XML 的快捷方式\n        // 读取倍数，设置卡牌间距\n        multiplier.x\
  \ = float.Parse(xml[\"multiplier\"][0].att(\"x\"));\n        multiplier.y = float.Parse(xml[\"\
  multiplier\"][0].att(\"y\"));\n        // 读取槽位\n        SlotDef tSD;\n        //\
  \ slotsX 用作所有 <slot> 的快捷方式\n        PT_XMLHashList slotsX = xml[\"slot\"];\n   \
  \     for (int i=0; i<slotsX.Count; i++) {\n            tSD = new SlotDef(); //\
  \ 创建一个新的 SlotDef 实例\n            if (slotsX[i].HasAtt(\"type\")) {\n           \
  \     // 如果这个 <slot> 有 type 属性则解析它\n                tSD.type = slotsX[i].att(\"\
  type\");\n            } else {\n                // 如果没有，将其类型设置为 \"slot\"；它是一个牌阵卡牌\n\
  \                tSD.type = \"slot\";\n            }\n            // 各种属性被解析为数值值\n\
  \            tSD.x = float.Parse(slotsX[i].att(\"x\"));\n            tSD.y = float.Parse(slotsX[i].att(\"\
  y\"));\n            tSD.layerID = int.Parse(slotsX[i].att(\"layer\"));\n       \
  \     // 将 layerID 的数字转换为文本名称\n            tSD.layerName = sortingLayerNames[tSD.layerID];\n\
  \            // 层用于确保正确的卡牌位于\n            // 其他卡牌之上。在 2D 中，我们所有的资源实际上\n        \
  \    // 都处于相同的 Z 深度，因此层被用来\n            // 区分它们。\n            switch (tSD.type)\
  \ {\n                // 根据此 <slot> 的类型提取额外的属性\n                case \"slot\":\n\
  \                    tSD.faceUp = (slotsX[i].att(\"faceup\") == \"1\");\n      \
  \              tSD.id = int.Parse(slotsX[i].att(\"id\"));\n                    if\
  \ (slotsX[i].HasAtt(\"hiddenby\")) {\n                        string[] hiding =\
  \ slotsX[i].att(\"hiddenby\").Split(',');\n                        foreach(string\
  \ s in hiding ) {\n                            tSD.hiddenBy.Add(int.Parse(s));\n\
  \                        }\n                    }\n                    slotDefs.Add(tSD);\n\
  \                    break;\n                case \"drawpile\":\n              \
  \      tSD.stagger.x = float.Parse(slotsX[i].att(\"stagger\"));\n              \
  \      drawPile = tSD;\n                    break;\n                case \"discardpile\"\
  :\n                    discardPile = tSD;\n                    break;\n        \
  \    }\n        }\n    }\n}\n```\n\n到此时，大部分之前的语法对你来说应该很熟悉。创建 `SlotDef` 类是为了以便更方便的方式存储从\
  \ `<slot>` 中读取的信息。然后定义了 `Layout` 类并创建了 `ReadLayout()` 方法，该方法将接受 XML 格式的字符串作为输入并将其转换为一系列\
  \ `SlotDefs`。\n\n### 3. 打开 `Prospector` 类并添加以下行：\n\n```csharp\npublic class Prospector\
  \ : MonoBehaviour {\n    static public Prospector S;\n    public Deck deck;\n  \
  \  public TextAsset deckXML;\n    public Layout layout;\n    public TextAsset layoutXML;\n\
  \    void Awake() {\n        S = this; // 为 Prospector 设置一个单例\n    }\n    void Start\
  \ () {\n        deck = GetComponent<Deck>(); // 获取 Deck\n        deck.InitDeck(deckXML.text);\
  \ // 将 DeckXML 传递给它\n        Deck.Shuffle(ref deck.cards); // 这会洗牌\n        // ref\
  \ 关键字传递了 deck.cards 的引用，允许\n        // deck.cards 被 Deck.Shuffle() 修改\n        layout\
  \ = GetComponent<Layout>(); // 获取 Layout\n        layout.ReadLayout(layoutXML.text);\
  \ // 将 LayoutXML 传递给它\n    }\n}\n```\n\n### 4. 完成此后，你需要在 Unity 中设置一些内容。切换到 Unity\
  \ 并选择 `MainCamera`。从菜单中选择 `Component > Scripts > Layout` 为 `MainCamera` 挂载 脚本（这是向游戏对象添加脚本的另一种方法）。现在你应该可以在\
  \ Inspector 面板向下看到 `Layout (Script)` 组件。\n\n### 5. 找到 `MainCamera` 的 `Prospector\
  \ (Script)` 组件。你会发现公共字段 `layout` 和 `layoutXML` 出现在那里。点击 `layoutXML` 旁边的目标并在 Assets\
  \ 中选择 *LayoutXML*。（你可能需要点击窗口顶部的 Assets 按钮。）\n\n### 6. 保存你的场景。\n\n### 7. 现在，按下播放。如果你在层级面板选择\
  \ `MainCamera` 并滚动到 `Layout (Script)` 组件，你应该能够打开 `slots` 旁边的三角形并看到所有的 `<slot>` 都已从\
  \ XML 解析完成。\n\n##### 处理 CardProspector，作为 Card 的子类\n\n在可以在牌阵中放置卡牌之前，有必要为 `Card`\
  \ 类添加一些针对 Prospector 游戏的特性。由于 `Card` 和 `Deck` 旨在在其他卡牌游戏中重用，我们选择创建一个 `Prospector`\
  \ 类作为 `Card` 的子类，而不是修改 `Card`。创建一个名为 *CardProspector* 的新 C# 脚本并输入以下代码：\n\n```csharp\n\
  using UnityEngine;\nusing System.Collections;\nusing System.Collections.Generic;\n\
  \n// 这是一个枚举，定义了一种只有若干可能命名值的变量类型。\n// CardState 变量有四个值之一：\n// drawpile, tableau,\
  \ target, discard\npublic enum CardState {\n    drawpile,\n    tableau,\n    target,\n\
  \    discard\n}\n\npublic class CardProspector : Card { // 确保 Prospector 继承自 Card\n\
  \    // 这就是如何使用枚举\n    public CardState state = CardState.drawpile;\n    // hiddenBy\
  \ 列表存储了哪些卡牌会盖住这张\n    public List<CardProspector> hiddenBy = new List<CardProspector>();\n\
  \    // LayoutID 在是牌阵卡时将卡牌匹配到 Layout XML id\n    public int layoutID;\n    // SlotDef\
  \ 类存储了从 LayoutXML <slot> 中提取的信息\n    public SlotDef slotDef;\n}\n```\n\n\n\n既然这个子类已经可用，那么就有将牌组中的卡牌从\
  \ `Cards` 转换为 `CardProspectors` 了。这通过向 `Prospector` 类中添加以下代码来实现：\n\n点击此处查看代码图片\n\
  \n```csharp\npublic class Prospector : MonoBehaviour {\n\n    ...\n\n    public\
  \ List<CardProspector> drawPile;\n\n    void Start () {\n        deck = GetComponent<Deck>();\
  \ // 获取 Deck\n        deck.InitDeck(deckXML.text); // 将 DeckXML 传递给它\n        layout\
  \ = GetComponent<Layout>(); // 获取 Layout\n        layout.ReadLayout(layoutXML.text);\
  \ // 将 LayoutXML 传递给它\n        drawPile = ConvertListCardsToListCardProspectors(deck.cards);\n\
  \    }\n\n    List<CardProspector> ConvertListCardsToListCardProspectors(List<Card>\
  \ lCD) {\n        List<CardProspector> lCP = new List<CardProspector>();\n     \
  \   CardProspector tCP;\n        foreach(Card tCD in lCD) {\n            tCP = tCD\
  \ as CardProspector; // 1\n            lCP.Add(tCP);\n        }\n        return(lCP);\n\
  \    }\n}\n```\n\n一旦这段代码完成后，尝试运行它，然后查看 Inspector（检查器）面板中的 `drawPile`。你会发现 `drawPile`\
  \ 中的所有卡牌都是 `null`。（你也可以通过在前面代码标记为 `// 1` 的行上设置断点来观察这一现象发生。）当我们尝试将 `Card tCD` 视为\
  \ `CardProspector` 时，`as` 运算符返回的是 `null` 而不是转换后的 `Card`。这是由于 C# 中面向对象编程的工作机制（请参见侧边栏“关于父类和子类”）。\n\
  \n### 关于父类和子类\n\n当然，你已经熟悉第 25 章中“类”里的父类和子类概念了。然而，你可能会疑惑，为什么尝试将父类强制转换为子类是不可行的。\n\n\
  在 `Prospector` 中，`Card` 是父类，子类是 `CardProspector`。你完全可以将其想象为父类 `Animal`（动物）和子类 `Scorpion`（蝎子）。所有的\
  \ `Scorpions` 都是 `Animals`，但并不是所有的 `Animals` 都是 `Scorpions`。你可以将 `Scorpion` 称为“那个\
  \ `Animal`”，但你不能将任何 `Animal` 称为 `Scorpion`。同样，`Scorpion` 可能有一个 `Sting()` 函数，但 `Cow`\
  \ 则没有。这就是为什么无法将任何 `Animal` 视为 `Scorpion`，因为在任何其他 `Animal` 上调用 `Sting()` 可能会导致错误。\n\
  \n在 `Prospector` 中，我们希望将 `Deck` 脚本创建的一组卡牌像 `CardProspectors` 一样使用。这类似于我们有一堆 `Animals`\
  \ 想要把它们当作 `Scorpions` 处理（尽管我们已经决定这是不可能的）。但是，将 `Scorpion` 称为 `Animal` 总是可能的，因此我们在\
  \ `Prospector` 中使用的解决方案是让 `PrefabCard` 拥有一个 `CardProspector (Script)` 组件，而不仅仅是 `Card\
  \ (Script)` 组件。如果我们从一开始就创建 `Scorpions`，然后通过几个函数将它们视为 `Animals`（我们可以这样做，因为 `Scorpion`\
  \ 是 `Animal` 的子类），那么当我们以后选择调用 `Scorpion s = Animal as Scorpion;` 时，它将完美运行，因为那个 `Animal`\
  \ 从本质上上一直是一个 `Scorpion`。\n\n这种情况下的解决方案是确保 `CardProspector` 始终是一个 `CardProspector`，并且对于所有的\
  \ `Deck` 类来说，它只是充当 `Card`。要做到这一点，在 Project 面板中选择 `PrefabCard`，你会发现它出现在 Inspector\
  \ 中，并带有 `Card (Script)` 组件。如果你点击 `target` 变量（当前设置为 `Card`），你可以为此组件选择不同的脚本。选择 `Prospector`，现在\
  \ `PrefabCard` 就会拥有一个 `CardProspector (Script)` 组件，而不仅仅是 `Card` 了。如果你从 Hierarchy（层级）中选择\
  \ `MainCamera` 并运行场景，你会发现 `drawPile` 中的所有条目现在都满了 `Prospectors`。当 `Deck` 脚本实例化 `PrefabCard`\
  \ 并获取其 `Card` 组件时，这仍然可以正常工作，因为 `Card` 始终可以被视为 `Card`。然后，当 `ConvertListCardsCardProspectors()`\
  \ 函数尝试调用 `tCP = tCD as Prospector;` 时，它可以正常运行。保存你的场景。\n\n#### 在牌区（Tableau）中放置卡牌\n\
  \n现在一切都就绪了，是时候给 `Prospector` 类添加一些代码来实际对游戏进行布局了：\n\n点击此处查看代码图片\n\n```csharp\npublic\
  \ class Prospector : MonoBehaviour {\n\n    ...\n    Layout layout;\n    TextAsset\
  \ layoutXML;\n    Vector3 layoutCenter;\n    float xOffset = 3;\n    float yOffset\
  \ = -2.5f;\n    Transform layoutAnchor;\n    CardProspector target;\n    List<CardProspector>\
  \ tableau;\n    List<CardProspector> discardPile;\n    List<CardProspector> drawPile;\n\
  \n    void Start () {\n        ...\n        drawPile = ConvertListCardsProspectors(deck.cards);\n\
  \        LayoutGame();\n    }\n\n    // Draw 函数从 drawPile 中提取单张卡牌并返回\n    CardProspector\
  \ Draw() {\n        CardProspector cd = drawPile[0]; // 获取第 0 个 Prospector\n   \
  \     drawPile.RemoveAt(0); // 然后从 List<> drawPile 中移除它\n        return(cd); //\
  \ 返回它\n    }\n\n    // LayoutGame 放置牌区，即“矿区”\n    void LayoutGame() {\n        //\
  \ 创建一个空对象作为牌区的锚点 //1\n        if (layoutAnchor == null) {\n            GameObject\
  \ tGO = new GameObject(\"_LayoutAnchor\");\n            // ^ 在 Hierarchy 中创建一个名为\
  \ _LayoutAnchor 的空对象\n            layoutAnchor = tGO.transform; // 获取其 Transform\n\
  \            layoutAnchor.position = layoutCenter; // 放置它\n        }\n        CardProspector\
  \ cp;\n        // 布局\n        foreach(SlotDef tSD in layout.slots) { // 遍历布局中所有的\
  \ SlotDef\n            cp = Draw(); // 从 drawPile 的顶部（开头）提取卡牌\n            cp.faceUp\
  \ = tSD.faceUp; // 设置其正面状态为 SlotDef 中的值\n            cp.transform.parent = layoutAnchor;\
  \ // 将父对象设置为 layoutAnchor\n            // 这替换了之前的父对象：deckAnchor，在场景运行时它在 Hierarchy\
  \ 中显示为 _Deck。\n            cp.transform.localPosition = new Vector3(\n         \
  \       layout.multiplier.x * tSD.x,\n                layout.multiplier.y * tSD.y,\n\
  \                -tSD.layerID); // 设置本地位置\n            cp.layoutID = tSD.id;\n \
  \           cp.slotDef = tSD;\n            cp.state = CardState.tableau; // 牌区的\
  \ CardProspector 状态为 CardState.tableau\n            tableau.Add(cp); // 将此 Prospector\
  \ 添加到 List<> tableau 中\n        }\n    }\n}\n```\n\n运行此后，你会看到卡牌确实按照 `LayoutXML.xml`\
  \ 描述的矿区牌区进行了布局，正确的卡牌是正面或反朝的，但在排序层方面存在严重的问题（请参见图 31.10）。\n\n![Image](img/00218.jpeg)\n\
  \n**图 31.10** 卡牌已布局，但存在若干排序层问题（以及之前存在的网格布局留下的剩余卡牌）\n\n\n\n\n按住 `Option/Alt` 键并在\
  \ Scene（场景）窗口中使用左鼠标键进行观察，你会发现，当使用 Unity 的 2D 工具时，2D 对象到相机的距离与物体的深度排序（即哪些物体渲染在另一个物体之上）没有关系。在构建卡牌时，我们其实是有点幸运的，因为我们是从后到向前构建的，这样所有的点数标记（pips）和装饰元素都显示在牌面的上方。然而，在游戏布局中，我们实际上必须更加小心，以避免出现你在图\
  \ 31.10 中看到的问题。\n\nUnity 2D 有两种处理深度排序的方法：\n\n![Image](img/00003.jpeg) 排序层（Sorting\
  \ Layers）：排序层用于对 2D 对象进行分组。位于较低排序层中的所有内容都会渲染在较高排序层的所有内容之后。每个 `SpriteRenderer` 组件都有一个\
  \ `sortingLayerName` 字符串变量，可以设置为排序层的名称。\n\n### 排序顺序（Sorting Order）\n\n![Image](img/00003.jpeg)\
  \ 排序顺序：每个 `SpriteRenderer` 组件还有一个可以设置的 `sortingOrder` 变量。这用于在每个排序层内部确定元素之间的相对位置。\n\
  \n在没有排序层和 `sortingOrder` 的情况下，精灵（sprites）通常按照它们被创建的顺序从后到向前渲染，但这完全不可靠。\n\n### 设置排序层\n\
  \n从菜单栏中，选择 `Edit > Project Settings > Tags and Layers`。你以前在物理层和标签中用过标签和层，但我们还没有触及过排序层。打开\
  \ `Sorting Layers` 旁边的展开三角形，并按照图 31.11 所示输入层级。你需要点击列表右下角的 `+` 按钮来添加新的排序层。\n\n![Image](img/00219.jpeg)\n\
  \n**图 31.11** Prospector 需要的排序层\n\n由于 `SpriteRenderers` 和深度排序是任何使用我们代码库构建的卡牌游戏都必不可的，因此处理深度排序的代码应该添加到\
  \ `Card` 类中。打开 `Card` 脚本并添加以下代码：\n\n点击此处查看代码图像\n\n```cs\npublic class Card : MonoBehaviour\
  \ {\n\n    ...\n\n    public CardDefinition def;  // 从 DeckXML.xml 解析\n\n    //\
  \ 此 GameObject 及其子对象的 SpriteRenderer 组件列表\n    public SpriteRenderer[] spriteRenderers;\n\
  \n    void Start() {\n        SetSortOrder(0);  // 确保卡牌从开始就经过正确的深度排序\n    }\n\n\
  \    public bool faceUp {\n        ...\n    }\n\n    // 如果 spriteRenderers 尚未定义，则由此函数定义\n\
  \    public void PopulateSpriteRenderers() {\n        // 如果 spriteRenderers 为空或为空\n\
  \        if (spriteRenderers == null || spriteRenderers.Length == 0) {\n       \
  \     // 获取此 GameObject 及其子对象的 SpriteRenderer 组件\n            spriteRenderers =\
  \ GetComponentsInChildren<SpriteRenderer>();\n        }\n    }\n\n    // 设置所有 SpriteRenderer\
  \ 组件的 sortingLayerName\n    public void SetSortingLayerName(string tSLN) {\n   \
  \     PopulateSpriteRenderers();\n        foreach (SpriteRenderer tSR in spriteRenderers)\
  \ {\n            tSR.sortingLayerName = tSLN;\n        }\n    }\n\n    // 设置所有 SpriteRenderer\
  \ 组件的 sortingOrder\n    public void SetSortOrder(int sOrd) {\n        PopulateSpriteRenderers();\n\
  \        // 卡牌的白色背景在底部 (sOrd)\n        // 在其上方是所有的点数标记、装饰等 (sOrd+1)\n        //\
  \ 背面在上方，当可见时，它会覆盖其他部分 (sOrd+2)\n        // 遍历所有作为 tSR 的 spriteRenderer\n       \
  \ foreach (SpriteRenderer tSR in spriteRenderers) {\n            if (tSR.gameObject\
  \ == this.gameObject) {\n                // 如果 gameObject 是 this.gameObject，它就是背景\n\
  \                tSR.sortingOrder = sOrd;  // 将其顺序设置为 sOrd\n                continue;\
  \  // 继续循环的下次迭代\n            }\n            // 此 GameObject 的每个子对象都根据名称命名\n    \
  \        switch (tSR.gameObject.name) {\n                case \"back\": // 如果名为\
  \ \"back\"\n                    tSR.sortingOrder = sOrd+2;  // 将其设置为最高层以覆盖一切\n \
  \                   break;\n                case \"face\": // 如果名为 \"face\"\n  \
  \              default:  // 如果是其他任何内容\n                    tSR.sortingOrder = sOrd+1;\
  \  // 将其设置为中间层，使其在背景之上\n                    break;\n            }\n        }\n \
  \   }\n}\n```\n\n现在，`Prospector` 需要添加一行代码，以确保初始矿区布局中的卡牌放置在正确的排序层中。在 `Prospector.LayoutGame()`\
  \ 的末尾添加此行：\n\n点击此处查看代码图像\n\n```cs\npublic class Prospector : MonoBehaviour {\n\n\
  \    ...\n    // LayoutGame() 放置初始的卡牌布局，即“矿区”\n    void LayoutGame() {\n       \
  \ ...\n        foreach (SlotDef tSD in slotDefs) {\n            ...\n          \
  \  cp.state = CardState.tableau;  // tableau 有 CardState.tableau\n            cp.SortingLayerName(tSD.layerName);//\
  \ 设置排序层\n            tableau.Add(cp);  // 添加此 Prospector\n        }\n    }\n}\n\
  ```\n\n现在，当你运行场景时，你会看到卡牌正确地堆叠。\n\n### 抽牌、弃牌和游戏逻辑\n\n在我们将卡牌移动到位置之前，让我们先列出可能发生的操作：\n\
  \n1. 如果卡牌被其他卡牌替换，被替换的牌移动到弃牌堆。\n2. 卡牌从 `drawPile` 移动成为目标卡牌。\n3. 矿台中比目标卡牌等级大或小的卡牌可以成为目标卡牌。\n\
  4. 如果背面卡牌遮住了它，会被正面。\n5. 当矿区为空（胜利）或抽牌堆为空且没有更多操作时（失败），游戏结束。\n\n这里的操作 2 和 3 是物理移动的动作，而\
  \ 1、4 和 5 是由于 2 或 3 结果的被动动作。\n\n### 可点击\n\n由于所有这些动作都是通过点击卡牌发起的，首先我们需要让卡牌可以点击。这对于每个卡牌游戏都是需要的，所以向\
  \ `Card` 类中添加以下方法：\n\n点击此处查看代码图像\n\n```cs\npublic class Card : MonoBehaviour {\n\
  \n    ...\n    // 虚方法可以被子类的同名方法重写\n    virtual void OnMouseUpAsButton() {\n    \
  \    print(name);  // 点击时输出卡牌名称\n    }\n}\n```\n\n现在，当你按下 Play 时，你可以点击场景中的任何卡牌，它会输出名称。然而，在\
  \ Prospector 中，我们需要卡牌点击不仅仅于此，因此在 `CardProspector` 类末尾添加以下方法：\n\n点击此处查看代码图像\n\n```cs\n\
  public class CardProspector : Card {\n\n    ...\n    // 这允许卡牌对点击产生反应\n    override\
  \ void OnMouseUpAsButton() {\n        // 调用 Prospector 单例上的 CardClicked 方法\n   \
  \     Prospector.S.CardClicked(this);\n        // 同时调用基类（Card.cs）的此方法版本\n      \
  \  base.OnMouseUpAsButton();\n    }\n}\n```\n\n现在，必须在 `Prospector` 脚本中编写 `CardClicked`\
  \ 方法。目前，我们只需处理从 `drawPile` 移动到目标的卡牌（操作列表中的第 2 项）：\n\n\n\n\n\n点击此处查看代码图像\n\n```csharp\n\
  public class Prospector : MonoBehaviour {\n\n    ...\n\n    // 每当游戏中的卡牌被点击时，就会调用\
  \ CardClicked 方法\n    public void CardClicked(CardProspector cd) {\n        // 反应由被点击卡牌的状态决定\n\
  \        switch (cd.state) {\n        case CardState.target:\n            // 点击目标卡牌无任何操作\n\
  \            break;\n        case CardState.drawpile:\n            // 点击抽牌堆中的任何卡牌都会抽取下一张牌\n\
  \            MoveToDiscard(target);  // 将目标移动到弃牌堆\n            MoveToTarget(Draw());\
  \  // 将抽到的下一张牌移动到目标位置\n            UpdateDrawPile();      // 重新堆放抽牌堆\n         \
  \   break;\n        case CardState.tableau:\n            // 点击布局中的卡牌将检查它是否为有效操作\n\
  \            break;\n        }\n    }\n}\n```\n\n当然，你还需要在 `Prospector` 类中添加 `MoveToDiscard()`、`MoveToTarget()`\
  \ 和 `UpdateDrawPile()` 方法，并在 `Prospector.LayoutGame()` 的末尾添加代码来绘制初始目标卡牌并排列抽牌堆：\n\
  \n点击此处查看代码图像\n\n```csharp\npublic class Prospector : MonoBehaviour {\n\n    ...\n\
  \n    // LayoutGame() 为初始卡牌布局（即“矿区”）定位\n    void LayoutGame() {\n        ...\n \
  \       foreach (SlotDef tSD in layout.slotDefs) {\n            ...\n        }\n\
  \        // 设置初始目标卡牌\n        MoveToTarget(Draw());\n        // 设置抽牌堆\n        UpdateDrawPile();\n\
  \    }\n\n    // 每当游戏中的卡牌被点击时，就会调用 CardClicked 方法\n    public void CardClicked(CardProspector\
  \ cd) {\n        ...\n    }\n\n    // 将当前目标移动到弃牌堆\n    void MoveToDiscard(CardProspector\
  \ cd) {\n        // 将卡牌状态设为弃牌\n        cd.state = CardState.discard;\n        discardPile.Add(cd);\
