  \n**图 31.5** `MainCamera` 的 `Deck`（脚本）组件的 Inspector，显示了从 `xml` 文件中读取的 `Decorators`\
  \ 和 `Defs`\n\n### 分配成为卡牌的 Sprites\n\n现在 XML 已被正确读取并解析为可用的 `Lists`，是时候制作一些卡牌了。实现此目标的第一步是获取我们在在本节之前创建的所有\
  \ sprite 的引用：\n\n1. 在 `Deck` 类顶部添加以下变量来存储这些 sprite：\n\n点击此处查看图像\n\n```cs\npublic\
  \ class Deck : MonoBehaviour {\n    // Suits\n    public Sprite suitClub;\n    public\
