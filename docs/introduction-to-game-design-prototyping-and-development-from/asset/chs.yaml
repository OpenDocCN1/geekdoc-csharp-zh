  \ C# 脚本\n\n在这个程序中将有两个不同的 C# 脚本。`BoidSpawner` 脚本将附加到 `_MainCamera`。它将存储所有 `Boids`\
  \ 共享的字段（变量），并实例化所有 `Boid` 制体的实例。\n\n`Boid` 脚本将附加到 `Boid` 制体，它将处理每个单独 `Boid` 的移动。由于这是一个面向对象的程序，每个\
  \ `Boid` 都会独立思考并根据其对世界的独立理解做出反应。\n\n本章中的 `Boid` 脚本基于 Conrad Parker 的 Boids 伪代码。Conrad\
  \ Parker, “Boids Pseudocode,” [`www.vergenet.net/~conrad/boids/pseudocode.html`](http://www.vergenet.net/~conrad/boids/pseudocode.html),\
  \ 于 2014 年 3 月 1 日访问。\n\n现在有了模型可以操作了，是时候进入代码了。从菜单栏中选择 `Assets` > `Create` > `C#\
  \ script`，并将 `NewBehaviour` 脚本重命名为 `BoidSpawner`。双击 `BoidSpawner` C# 脚本在 MonoDevelop\
  \ 中打开它，并输入列表 26.1 中的代码。你需要添加的内容已加粗。\n\n**列表 26.1** BoidSpawner C# 脚本\n\n点击此处代码图像\n\
  \n```csharp\n1 using UnityEngine;\n2 using System.Collections;\n3\n4 public class\
  \ BoidSpawner : MonoBehaviour {\n5\n6     // 这是 BoidSpawner 的单例。只有一个 BoidSpawner\n\
  7\n     // 实例，所以我们可以将其存储在静态变量中\n8     static BoidSpawner S;\n9\n10     // 这些字段允许你调整一组\
