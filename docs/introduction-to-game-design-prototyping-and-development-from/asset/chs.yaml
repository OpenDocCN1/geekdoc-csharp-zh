  \ `Q`）并尝试以下操作：\n\n![Image](img/00003.jpeg) 在场景面板中左键拖动（即使用鼠标左键点击并拖动）将移动场景摄像机的位置，而不会改变场景中任何物体的位置。从技术角度来说，场景相机是在垂直于相机面向方向的平面内移动（即垂直于相机的正向向量）。\n\
