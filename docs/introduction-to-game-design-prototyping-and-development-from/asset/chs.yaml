  \n#### PowerUp 代码\n\n现在创建一个名为 `PowerUp` 的新 C# 脚本，并将其分配给层级中的 `PowerUp` 对象。在 MonoDevelop\
  \ 中打开 `PowerUp` 脚本并输入以下代码：\n\n\n\n\n\n点击此处查看代码图像\n\n```csharp\nusing UnityEngine;\n\
  \nusing System.Collections;\n\npublic class PowerUp : MonoBehaviour�{\n\n    //\
  \ 这是一个对 Vector2 不寻常但实用的用法。x 存储最小值\n    // y 存储最大值，供之后调用的 Random.Range() 使用\n   \
  \ public Vector2 rotMinMax = new Vector2(15,90);\n    public Vector2 driftMinMax\
  \ = new Vector2(.25f,2);\n    public float lifeTime = 6f; // PowerUp 存在的秒数\n   \
  \ public float fadeTime = 4f; // 随后开始淡出的秒数\n    public bool ________________;\n\
  \    public WeaponType type; // PowerUp 的类型\n    public GameObject cube; // 对子物体\
  \ Cube 的引用\n    public TextMesh letter; // 对 TextMesh 的引用\n    public Vector3 rotPerSecond;\
  \ // 每秒欧拉旋转速度\n    public float birthTime;\n\n    void Awake() {\n        // 查找\
  \ Cube 引用\n        cube = transform.Find(\"Cube\").gameObject;\n        // 查找 TextMesh\n\
  \        letter = GetComponent<TextMesh>();\n        // 设置随机速度\n        Vector3\
  \ vel = Random.onUnitSphere; // 获取随机的 XYZ 速度\n        // Random.onUnitSphere 返回一个指向位于原点周围\n\
  \        // 半径为 1m 球表面任意某处的向量\n        vel.z = 0; // 将 vel 展到 XY 平面\n        vel.Normalize();\
  \ // 使 vel 的长度变为 1\n        // 归一化 Vector3 使其长度变为 1m\n        vel *= Random.Range(driftMinMax.x,\
  \ driftMinMax.y); // 以上将速度设置为 driftMinMax 的 x 和 y 值之间的某个值\n        rigidbody.velocity\
  \ = vel; // 设置此 GameObject 的旋转为:[0,0,0]\n        transform.rotation = Quaternion.identity;\
  \ // Quaternion.identity 等于无旋转\n        // 使用 rotMax 的 x & y 为子物体 Cube 设置 rotPerSecond\n\
  \        rotPerSecond = new Vector3(Random.Range(rotMinMax.x,rotMinMax.y),\n   \
  \         Random.Range(rotMinMax.x,rotMinMax.y),\n            Random.Range(rotMinMax.x,rotMinMax.y));\n\
  \        // 每 2 秒执行一次 CheckOffscreen()\n        InvokeRepeating(\"CheckOffscreen\"\
  , 2f, 2f);\n        birthTime = Time.time;\n    }\n\n    void Update () {\n    \
  \    // 在每次 Update() 中手动旋转子物体 Cube\n        // 乘以 Time.time 会导致旋转基于时间\n        cube.transform.rotation\
  \ = Quaternion.Euler(rotPerSecond*Time.time);\n        // 随着时间淡出 PowerUp\n     \
  \   // 根据默认值，PowerUp 将存在 10 秒，然后在 4 秒内淡出。\n        float u = (Time.time - (birthTime+lifeTime))\
  \ / fadeTime; // 在 lifeTime 秒内，u 将将 <= 0。然后它将在 fadeTime 秒内过渡到 1。\n        // 如果\
  \ u >= 1，销毁此 PowerUp\n        if (u >= 1) {\n            Destroy(this.gameObject);\n\
  \            return;\n        }\n        // 使用 u 确定 Cube 和 Letter 的 alpha 值\n  \
  \      if (u > 0) {\n            Color c = cube.renderer.material.color;\n     \
  \       c.a = 1f-u;\n            cube.renderer.material.color = c;\n           \
  \ // 也淡出 Letter，只是程度没那么深\n            c = letter.color;\n            c.a = 1f -\
  \ (u*0.5f);\n            letter.color = c;\n        }\n    }\n\n    // 这个 SetType()\
  \ 与 Weapon 和 Projectile 不同\n    public void SetType(WeaponType wt) {\n        //\
  \ 从 Main 获取 WeaponDefinition\n        WeaponDefinition def = Main.GetWeaponDefinition(wt);\n\
