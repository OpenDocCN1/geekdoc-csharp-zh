  \        for (int i=0; i<bigLettersActive.Count; i++) {\n            pos = bigLetterCenter;\n\
  \            pos.x += (i-halfWidth)*bigLetterSize;\n            pos.y += bigLetterSize*1.25f;\n\
  \            bigLettersActive[i].pos = pos;\n        }\n    }\n```\n\n现在，除了顶部的字母外，你应该在下方看到目标单词的打乱形式。是时候添加一些交互性了。\n\
  \n### 添加交互性\n\n对于这个游戏，我们希望玩家能够通过键盘从可用的大字母输入单词，并按 Return/Enter 提交。她也可以按 Backspace/Delete\
  \ 删除已输入末尾的字母，并按空格键打乱剩余的字母。\n\n当她按下 Enter 时，她输入的单词将与 `WordLevel` 中可能的单词进行比较。如果她输入的单词在\
  \ `WordLevel` 中，她将为单词中的每个字母获得分数。此外，如果她输入的单词包含任何 `WordLevel` 中的较小单词，她还将获得这些单词的分数，以及每个单词的倍数积分。参考\
  \ TORN 的示例，如果玩家第一个单词输入 TORN 并按下 Return，她将获得共 36 分，如下：\n\n![图像](img/0239.jpeg)\n\n\
  所有这些交互性将由 `Update()` 函数处理，并基于 `Input.inputString`，这是一个包含本帧内发生的所有键盘输入的字符串。在 `WordGame`\
  \ 中添加以下 `Update()` 方法和辅助方法：\n\n点击此处查看代码图像\n\n```csharp\npublic class WordGame :\
  \ MonoBehaviour {\n    ...\n    public List<Letter> bigLettersActive;\n    public\
  \ string testWord;\n    private string upperCase = \"ABCDEFGHIJKLMNOPQRSTUVWXYZ\"\
  ;\n    ...\n    void Update() {\n        // 声明一些常用的局部变量\n        Letter lett;\n\
  \        char c;\n        switch (mode) {\n            case GameMode.inLevel:\n\
  \                // 遍历玩家本帧输入的每个字符\n                foreach (char cIt in Input.inputString)\
  \ {\n                    // 将 cIt 转换为大写\n                    c = System.Char.ToUpperInvariant(cIt);\n\
  \                    // 检查是否为大写字母\n                    if (upperCase.Contains(c))\
  \ {\n                        // 在 bigLetters 中查找可用的字母\n                        lett\
  \ = FindNextLetterByChar(c);\n                        // 如果找到了字母\n             \
  \           if (lett != null) {\n                            // 将此字符添加到 testWord\n\
  \                            testWord += c.ToString();\n                       \
  \     // 将返回的字母添加到 bigLettersActive\n                            bigLettersActive.Add(lett);\n\
  \                            bigLetters.Remove(lett);\n                        \
  \    lett.color = bigColorSelected; // 设置为激活颜色\n                            ArrangeBigLetters();\
  \ // 排列大字母\n                        }\n                    }\n                 \
  \   if (c == '\\b') { // 退格\n                        // 删除 bigLettersActive 中的最后一个字母\n\
  \                        if (bigLettersActive.Count == 0) return;\n            \
  \            if (testWord.Length > 1) {\n                            // 清除 testWord\
  \ 的最后一个字符\n                            testWord = testWord.Substring(0,testWord.Length-1);\n\
  \                        } else {\n                            testWord = \"\";\n\
  \                        }\n                        lett = bigLettersActive[bigLettersActive.Count-1];\n\
  \                        // 将其从活动列表移动到非活动列表\n                        bigLettersActive.Remove(lett);\n\
  \                        bigLetters.Add(lett);\n                        lett.color\
  \ = bigColorDim; // 设置为非活动颜色\n                        ArrangeBigLetters();\n   \
  \                 }\n                }\n                if (c == '\\n' || c == '\\\
  r') { // 回车\n                    // 测试 testWord 与 level.subWords 中的单词\n        \
  \            CheckWord();\n                }\n                if (c == ' ') { //\
  \ 空格\n                    // 打乱大字母\n                    bigLetters = ShuffleLetters(bigLetters);\n\
  \                    ArrangeBigLetters();\n                }\n                break;\n\
  \        }\n    }\n\n    // 在 bigLetters 中查找具有字符 c 的可用字母。\n    // 如果没有可用的，则返回 null。\n\
  \    Letter FindLetterByChar(char c) {\n        // 遍历 bigLetters 中的每个字母\n      \
  \  foreach (Letter l in bigLetters) {\n            // 如果字母的字符与 c 相同\n          \
  \  if (l.c == c) {\n                // ...则返回它\n                return(l);\n   \
  \         }\n        }\n        // 否则，返回 null\n        return(null);\n    }\n\n\
  \    public void CheckWord() {\n        // 测试 testWord 与 level.subWords 中的单词\n \
  \       string subWord;\n        bool foundTestWord = false;\n    }\n}\n```\n\n\n\
  \n\n```csharp\n// 创建一个 List<int> 来存储包含在 testWord 内部的其他 subWords 的索引\nList<int> containedWords\
  \ = new List<int>();\n// 遍历 currLevel.subWords 中的每一个单词\nfor (int i=0; i<currLevel.subWords.Count;\
  \ i++) {\n    // 如果屏幕上的第 i 个 Wyrd 已经找过了\n    if (wyrds[i].found) {\n        // ...那么继续并跳过本次迭代的剩余部分\n\
  \        continue;\n        // 这种方法有效，是因为屏幕上的 Wyrds 和 subWords List<> 中的单词顺序是相同的\n\
  \    }\n    subWord = currLevel.subWords[i];\n    // 如果这个 subWord 就是 testWord\n\
  \    if (string.Equals(testWord, subWord)) {\n        // ...那么高亮该 subWord\n    \
  \    HighlightWyrd(i);\n        foundTestWord = true;\n    } else if (testWord.Contains(subWord))\
  \ {\n        // ^否则如果 testWord 包含这个 subWord（例如，SAND 包含 AND）\n        // ...那么将其添加到\
  \ containedWords 列表中\n        containedWords.Add(i);\n    }\n}\n// 如果在 subWords\
  \ 中找到了测试单词\nif (foundTestWord) {\n    // ...那么高亮 testWord 中包含的其他单词\n    int numContained\
  \ = containedWords.Count;\n    int ndx;\n    // 按反序高亮这些单词\n    for (int i=0; i<containedWords.Count;\
  \ i++) {\n        ndx = numContained-i-1;\n        HighlightWyrd( containedWords[ndx]\
  \ );\n    }\n}\n// 无论 testWord 是否有效，都清除激活的字母\nClearLettersActive();\n}\n// 高亮 Wyrd\n\
  void HighlightWyrd(int ndx) {\n    // 激活 subWord\n    wyrds[ndx].found = true; //\
  \ 告诉它已被找到\n    // 变亮它的颜色\n    wyrds[ndx].color = (wyrds[ndx].color+Color.white)/2;\n\
  \    wyrds[ndx].visible = true; // 使其 3D 可可见\n}\n// 从 bigActive 中移除所有字母\nvoid ClearLettersActive()\
  \ {\n    testWord = \"\"; // 清除 testWord\n    foreach (Letter l in bigActive) {\n\
  \        bigLetters.Add(l); // 将每个字母添加到 bigLetters\n        l.color = bigColorDim;\
  \ // 设置为非激活颜色\n    }\n    bigLettersActive.Clear(); // 清空列表\n    ArrangeLetters();\
  \ // 重新排列屏幕上的字母\n}\n```\n\n在你输入完这些内容后，你还需要在 `_MainCamera` 的 `WordGame (Script)`\
  \ 组件的 Inspector 面板中将 `showAllWyrds` 设置为 `false`。然后，按下 Play。你应该看到一个可以运行的游戏版本和一个随机关卡。\n\
  \n### 添加评分功能\n\n由于我们已经编写并导入了此项目中的 `Scoreboard` 和 `FloatingScore` 代码，为这个游戏添加评分功能应该非常简单。首先从\
  \ Project 面板中的 `_Prefab` 文件夹将 `Scoreboard` 拖入 Hierarchy（层级）面板。现在，层级面板面板中的 `Scoreboard`\
  \ 实例和 `PrefabFloatingScore` 应该已经为这个游戏预设好了。（如果你想了解更多关于它们如何工作的知识，请参考第 31 章“原型 4：探险者纸牌”。）\n\
  \n现在，你必须通过以下编辑为 `WordGame` C# 脚本添加评分代码：\n\n```csharp\npublic class WordGame : MonoBehaviour\
  \ {\n    ...\n    public Vector3 bigLetterCenter = new Vector3(0, -16, 0);\n   \
  \ public List<float> scoreFontSizes = new List<float> { 24, 36, 36, 1 };\n    public\
  \ Vector3 scoreMidPoint = new Vector3(1,1,0);\n    public float scoreComboDelay\
  \ = 0.5f;\n    ...\n    public void CheckWord() {\n        ...\n        // 遍历 currLevel.subWords\
  \ 中的每一个单词\n        for (int i=0; i<currLevel.subWords.Count; i++) {\n          \
  \  ...\n            // 如果这个 subWord 就是 testWord\n            if (string.Equals(testWord,\
  \ subWord)) {\n                // ...那么高亮该 subWord\n                HighlightWyrd(i);\n\
  \                Score(wyrds[i], 1); // 为测试 Word 评分\n                foundTestWord\
  \ = true;\n            }\n            ...\n        }\n        // 如果在 subWords 中找到了测试单词\n\
  \        if (foundTestWord) {\n            ...\n            // 按反序高亮这些单词\n     \
  \       for (int i=0; i<containedWords.Count; i++) {\n                ndx = numContained-i-1;\n\
  \                HighlightWyrd(containedWords[ndx]);\n                Score(wyrds[containedWords[ndx]],\
  \ i+2); // 为其他单词评分\n                // 第二个参数 (i+2) 是该单词在组合中的数量\n            }\n\
  \        }\n        ...\n    }\n    ...\n    // 为此单词添加分数\n    // int combo 是该单词在组合中的数量\n\
  \    void Score(Wyr wyrd, int combo) {\n        // 获取 wyrd 中第一个字母的位置\n        Vector3\
  \ pt = wyrd.letters[0].transform.position;\n        // 为 FloatingScore 创建一个 Bezier\
  \ 点的列表<>\n        List<Vector3> pts = new List<Vector3>();\n        // 将 pt 转换为视口坐标\n\
  \        // 视口范围从 0 到 1\n        // 用于屏幕\n        pt = Camera.main.WorldToViewportPoint(pt);\n\
  \        pt.z = 0;\n        // 将 pt 作为第一个 Bezier 点\n        pts.Add(pt);\n     \
  \   // 添加第二个 Bezier 点\n        pts.Add(scoreMidPoint);\n        // 将 Scoreboard\
  \ 作为最后一个 Bezier 点\n        pts.Add(Scoreboard.S.transform.position);\n        //\
  \ 设置 Floating Score 的值\n        int value = wyrd.letters.Count * combo;\n      \
  \  FloatingScore fs = Scoreboard.S.CreateFloatingScore(value, pts);\n        fs.timeDuration\
  \ = 2f;\n        // 设置字体\n        fs.fontSizes = scoreFontSizes;\n        // 双 InOut\
  \ 缓缓效果\n        fs.easingCurve = Easing.InOut+Easing.InOut;\n        // 让 FloatingScore\
  \ 的文本类似于 \"3 x2\"\n        string txt = wyrd.letters.Count.ToString();\n       \
  \ if (combo > 1) {\n            txt += \" x\"+combo;\n        }\n        fs.guiText.text\
  \ = txt;\n    }\n}\n```\n\n在你输入这些代码并运行游戏后，你会发现输入的每个正确单词都会获得分数，输入的单词包含的每个有效单词都会获得倍数。然而，所有评分都是同时发生的。幸运的是，这是一个可以使用协程来解决的问题。通过以下更改使\
  \ `CheckWord()` 函数变为一个协程，在组合中的每个单词之间暂停 0.5 秒：\n\n```csharp\npublic class WordGame\
  \ : MonoBehaviour {\n    ...\n    void Update() {\n        ...\n        switch (mode)\
  \ {\n            case GameMode.inLevel:\n                ...\n                //\
  \ 遍历玩家此帧输入的字符输入\n                foreach (char cIt in Input.inputString) {\n   \
  \                 ...\n                    if (c == '\\n') { // 回车/换行\n        \
  \                // 使用 WordLevel 中的单词测试 testWord\n                        StartCoroutine(CheckWord()\
  \ );\n                    }\n                    ...\n                }\n      \
  \          break;\n        }\n    }\n    ...\n    public IEnumerator CheckWord()\
  \ {\n        ...\n        // 如果在 subWords 中找到了测试单词\n        if (foundTestWord) {\n\
  \            // ...那么高亮 testWord 中包含的其他单词\n            int numContained = containedWords.Count;\n\
  \            int ndx;\n            // 按反序高亮这些单词\n            for (int i=0; i<containedWords.Count;\
  \ i++) {\n                // 在高亮每个单词之前等待一会儿\n                yield return( new WaitForSeconds(scoreComboDelay)\
  \ );\n                ndx = numContained-i-1;\n\n\n\n\n```csharp\nHighlightWyrd(containedWords[ndx]);\n\
  \nScore(wyrds[containedWords[ndx]], i+2); // 为其他单词评分\n\n// 第二个参数 (i+2) 是该单词在组合中的次数\n\
  }\n}\n...\n}\n...\n```\n\n现在，分数将会飞舞而出，单词将以约 0.5 秒的间隔显示。\n\n### 添加动画\n\n与评分类似，我们可以利用在\
  \ `Utils` 脚本中导入的插值函数非常轻松地为字母（Letters）添加平滑的动画。\n\n将以下代码添加到 `Letter` C# 脚本中：\n\n点击此处查看代码\n\
  \n```csharp\npublic class Letter : MonoBehaviour {\n    ...\n    public bool big\
  \ = false; // 大写字母略有不同\n\n    // 插值字段\n    public List<Vector3> pts = null;\n  \
  \  public float timeDuration = 0.5f;\n    public float timeStart = -1;\n    public\
  \ string easingCuve = Easing.InOut; // 源自 Utils.cs 的缓动\n    ...\n    // 现在设置贝塞尔曲线移动到新位置\n\
  \    public Vector3 pos {\n        set {\n            // transform.position = value;\
  \ // 这一行现在被注释了\n            // 找到一个距离当前位置与传入值之间 \n            // 实际中点随机距离的中点\n \
  \           Vector3 mid = (transform.position + value)/2f;\n            // 随机距离将在从实际中点直线长度的\
  \ 1/4 以内\n            float mag = (transform.position - value).magnitude;\n    \
  \        mid += Random.insideUnitSphere * mag*0.25f;\n            // 创建贝贝塞尔点的 List<Vector3>\n\
  \            pts = new List<Vector3>() { transform.position, mid, value };\n   \
  \         // 如果 timeStart 为默认值 -1，则设置它\n            if (timeStart == -1 ) timeStart\
  \ = Time.time;\n        }\n    }\n    // 立即移动到位置\n    public Vector3 position {\n\
  \        set {\n            transform.position = value;\n        }\n    }\n    //\
  \ 插值代码\n    void Update() {\n        if (timeStart == -1) return;\n        // 标准线性插值\n\
  \        float u = (Time.time-timeStart)/timeDuration;\n        u = Mathf.Clamp01(u);\n\
  \        float u1 = Easing.Ease(u,easingCurve);\n        Vector3 v = Utils.Bezier(u1,\
  \ pts);\n        transform.position = v;\n        // 如果插值完成，将 timeStart 回 -1\n \
  \       if (u == 1) timeStart = -1;\n    }\n}\n```\n\n现在，如果你运行场景，你将看到字母都插值到它们的新位置。然而，所有字母同时移动并从屏幕中心开始看起来有点奇怪。让我们对\
  \ `WordGame.Layout()` 添加一些细小的更改来改进这一点：\n\n点击此处查看代码\n\n```csharp\npublic class WordGame\
  \ : MonoBehaviour {\n    ...\n    void Layout() {\n        ...\n        // 为每个 level.subWord\
  \ 创建一个 Wyrd\n        for (int i=0; i<currLevel.subWords.Count; i++) {\n        \
  \    ...\n            // 为单词的每个字母实例化一个 PrefabLetter\n            for (int j=0; j<word.Length;\
  \ j++) {\n                ...\n                // % 让多列对齐\n                pos.y\
  \ -= (i%numRows)*letterSize;\n                // 将字母立即移动到屏幕上方的位置\n             \
  \   lett.position = pos+Vector3.up*(20+i%numRows);\n                // 然后设置它插值到的\
  \ pos\n                lett.pos = pos;\n                // 增加 lett.timeStart 以让单词在不同的时间移动\n\
  \                lett.timeStart = Time.time + i*0.05f;\n                go.transform.localScale\
  \ = Vector3.one*letterSize;\n                wyrd.Add(lett);\n            }\n  \
  \          ...\n        }\n        ...\n        // 为目标单词中的每个字母创建一个大字母 Letter\n \
  \       for (int i=0; i<currLevel.word.Length; i++) {\n            ...\n       \
  \     go.transform.localScale = Vector3.one*bigLetter;\n            // 设置大字母在屏幕下的初始位置\n\
  \            pos = new Vector3(0, -100, 0);\n            lett.pos = pos;\n     \
  \       // 增加 lett.timeStart 让大字母最后出现\n            lett.timeStart = Time.time +\
  \ currLevel.subWords.Count*0.05f;\n            lett.easingCuve = Easing.Sin+\"0.18\"\
  ; // 弹跳缓动\n            col = bigColor;\n            lett.color = col;\n        \
  \    ...\n        }\n        ...\n    }\n}\n```\n\n有了这些代码，游戏现在应该带有优美的动作进行布局。\n\n\
  ### 添加颜色\n\n现在游戏运行良好了，是时候添加一点颜色了：\n\n**1.** 在 `WordGame` 中添加以下代码，根据长度为 wyrds 上色：\n\
  \n点击此处查看代码\n\n```csharp\npublic class WordGame : MonoBehaviour {\n    ...\n    public\
  \ float scoreDelay = 0.5f;\n    public Color[] wyrdPalette;\n    public bool showAllYds;\n\
  \    ...\n    void Layout() {\n        ...\n        // 为每个 level.subWord 创建一个 Wyrd\n\
  \        for (int i=0; i<currLevel.subWords.Count; i++) {\n            ...\n   \
  \         // 为单词的每个字母实例化一个 PrefabLetter\n            for (int j=0; j<word.Length;\
  \ j++) {\n                ...\n                wyrd.Add(lett);\n            }\n\
  \            if (showAllYrds) wyrd.visible = true; // 这一行用于测试\n            // 根据长度为\
  \ wyrd 上色\n            wyrd.color = wyrdPalette[word.Length];\n            wyrd.Add(lett);\n\
  \            ...\n        }\n        ...\n    }\n```\n\n这些最后的代码更改之所以简单，是因为我们已经有了支持的代码（例如\
  \ `Wyrd.color` 和 `Letter.color` 属性，以及 `Utils` 类中的 `Easing` 代码）。\n\n**2.** 现在，你需要为\
  \ `wyrdPalette` 设置大约八种颜色。为了这一点，我们将使用项目开始时导入的调色板图像。我们将使用吸管器来设置颜色，这可能会让你好奇如何同时看到调色板图像和\
  \ _MainCamera 检查器。为了这一点，我们将利用 Unity 同时打开多个 Inspector 窗口的能力。\n\n**3.** 正如 图 33.5\
  \ 所示，点击面板选项按钮（用红色圈出）并选择 *Add Tab > Inspector* 在 Game 标签页中添加一个 Inspector。然后在 Project\
  \ 面板中选择调色板图像。它将出现在两个 Inspector 中。（你可能需要拖动 Inspector 中图像预览部分的边缘，使其看起来像 图 33.6。）点击其中一个\
  \ Inspector 的锁图标（在 [图 33.6] 中用红色圈出），然后在 Hierarchy 面板中选择 _MainCamera。你会看到未解锁的 Inspector\
  \ 变为了 _MainCamera，但锁定的仍然显示调色板。\n\n\n\n\n\n## 4. 展开 `MainCamera` 检查器中 `wyrdPalette`\
  \ 旁边的展开三角形，并将其大小设置为 8。点击每个 `wyrdPalette` 元素旁边的取色器图标（在图 33.6 中用浅蓝色圈出），然后点击调色板（Color\
  \ Palette）图像中的一种颜色。对 `wyrdPalette` 的每个元素执行此操作，你将获得调色板图像中的八种不同颜色，但它们的默认透明度（alpha）都为\
  \ 0（因此是不可见的）。点击 `wyrdPalette` 数组中的每个颜色条，并将每个色的透明度（或 `A`）设置为 255，使其变为完全不透明，如颜色块下方的白色条所示。\n\
  \n现在，当你运行场景时，你应该能看到与本章开头的截图类似的内容。\n\n### 总结\n\n在本章中，你创建了一个简单的文字游戏，并通过一些优美的插值移动为它增添了些色彩。如果你一直在按照顺序学习这些教程，你可能会发现制作它们的过程变得越来越容易了。凭借你现在对\
  \ Unity 更深入的理解以及如 `Scoreboard`、`FloatingScore` 和 `Utils` 等现成实用脚本的功能，你能够将更多的代码精力放在每个游戏中新颖和不同的事物上，而不是花费在重复造轮上。\n\
  \n### 下一步工作\n\n在之前的原型中，你看到了如何设置了一系列游戏状态来处理游戏的不同阶段并从一个关卡过渡到下一个关卡的示例。现在，这个原型还没有具备这些功能。你应该自己为这个游戏添加那种控制结构。\n\
