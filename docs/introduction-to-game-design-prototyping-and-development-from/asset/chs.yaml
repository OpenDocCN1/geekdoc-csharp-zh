  \n光照映射是 Unity 中为对象创建纹理的过程，这些复杂的光照计算被“烘焙”（`baked`）在其中。这意味着不再是在整个墙面上重复相同的纹理，而是制作一张包含各种光源对墙面影响的光照映射纹理。Unity\
  \ 4 的光照映射通过名为 `Autodesk Beast` 的软件工作，而 Unity 5 使用 `Geomerics Enlighten` 引擎。由于这些光照映射解决方案在界面和设置上的差异，如果你在使用\
  \ Unity 5，你应该从 [`book.prototools.net`](http://book.prototools.net) 下载 Unity 5 版本的章节，该版本涵盖了\
  \ `Enlighten` 引擎而非 `Beast`。\n\nBeast 会场景中所有光源的信息，以及它们将命中标记为 `static`（静态）的各种物体（即在游戏过程中永远不会移动）。如果你打开层级面板中\
  \ `environment` 旁边的收叠三角形并选择子物体 `env_stealth_static`，你会发现 `env_stealth_static` 及其所有子体的检查器右上角都勾选了\
  \ `Static`。点击检查器中 `Static` 旁边的下拉弹出菜单也会显示它被设置为静态。\n\nBeast 会计算场景中所有光源的信息，以及它们将命中标记为\
  \ `static` 的各种物体。如果你打开层级面板中 `environment` 旁边的收叠三角形并选择子物体 `env_stealth_static`，你会发现\
  \ `env_stealth_static` 及其所有子体的检查器右上角都勾选了 `Static`。\n\n高质量下，光照映射可以创建仍能实时渲染的真实场景。然而，对于开发者你来说，这意味着所有的处理性能节省都回到了你身上。因此，在复杂场景上光照映射可能需要几小时才能完成，在此期间你可以在\
  \ Unity 中工作，但无法播放场景。\n\n### 探针（Probes）\n\n光照映射的局限性之一是只能用于静态物体。然而，通过 Unity Pro，可以使用光照探针（`light\
  \ probes`）映射动态物体。每个球形探针存储某个位置的光照信息，并相对于其位置进行插值。更多信息，请在手册（Manual）中搜索“light probes”。\n\
  \n### 烘焙光照映射\n\n要在你的原型中实现光照映射，请从菜单栏选择 `Window > Lightmapping` 并点击顶部的 `Bake` 按钮。Unity\
  \ Pro 和 Unity Free 选择的设置会有所不同。在两种情况下，光照映射的质量有两个选项可供：低质量生成的阴影会有明显的锯齿边缘，但烘焙速度快得多；而高质量会产生更好的阴影和光照，但烘焙时间会长得多。我强烈建议第一次烘焙时将\
  \ `Quality` 弹出菜单设置为 `Low`。\n\n\n\n在你输入这些设置后，可以点击光照面板（Lightmapping pane）底部的 `Bake\
  \ Scene` 按钮（如果按钮上没有显示 `Bake Scene`，可能需要从旁边的弹出菜单三角形中选择它），然后去喝杯咖啡或者给自己买个雪冰锥；你可能需要等待一会儿。否则，你可以选择继续开发这个原型，只在休息时再烘焙场景。我倾向于在可以的情况下晚上烘焙场景，但如果你有一台快速机器，低质量下的单张光照贴可能只需要\
  \ 10 到 20 分钟。在烘焙处理时，Unity 窗口右下角会出现进度条，`Bake Scene` 按钮会被 `Cancel` 按钮取代。如前所述，在场景烘焙期间，你仍然可以在\
  \ Unity 中工作，但某些操作会受到限制。\n\n### 质量设置\n\n我们用来改进游戏外观的技巧很大程度上取决于玩家选择的 Unity 质量设置，但作为开发者，你可以为游戏选择默认质量设置。从\
