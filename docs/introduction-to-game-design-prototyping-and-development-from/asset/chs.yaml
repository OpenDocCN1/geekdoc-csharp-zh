  \ false;\n        }\n    }\n    ...\n}\n```\n\n#### 添加快照声音和视觉效果\n\n为了让这看起来像玩家正在拍照，我们将添加快门声和视觉效果。\n\
  \n##### 添加 Audio Source\n\n在 Hierarchy（层级）中选择 _TargetCamera，从菜单栏选择 `Component >\
  \ Audio > Audio Source`。正如其名称所示，Audio Source 组件会在场景中产生声音。在现在于 Inspector（检查器）中显示的\
  \ Audio Source 组件中，点击 Audio Clip 字段右侧的目标图标，并选择我们项目资源中唯一的音频剪：`camera-shutter-click-03`。你会看到现在在\
  \ Audio Clip 字段下方，Unity 告诉你“这是一个 3D 声音”。\n\n\n\n\nUnity 同时支持 3D 和 2D 音效。2D 音效是你所习惯处理的普通立体声（例如听音乐时）。无论\
  \ `Audio Source` 在场景的哪个位置，2D 音效对玩家来说听起来是一样的。相比之下，3D 音效会根据它们距离 `Audio Listener`（在本游戏中是\
  \ `FPCamera` 上充当麦克风作用的组件）的远近而变化，而且当它们靠近或远离 `Audio Listener` 时，甚至会产生多普勒效应（就像汽车警报声在靠近或远离你时音调发生的变化）。3D\
  \ 音效在某些游戏中非常棒，但我们在这个原型中并不需要它；我们希望快门声无论玩家在何处听起来都是那样的。\n\n因此，在 `Inspector` 中点击 `camera-shutter-click-03`\
  \ 名称，使其在 `Project pane` 中被高亮显示。然后在 `Project pane` 中选中它，以显示 `camera-shutter-click-03`\
  \ 的导入设置。取消勾选 `3D Sound` 旁边的框框（将其设置为 `false`）并点击 `Apply`。现在，在 `Hierarchy` 中选择 `TargetCamera`，`Audio\
  \ Source` 组件现在会告诉你 `camera-shutter-click-03` 是一个 2D 音效。在 `Audio Source` 组件中，确保勾选了\
  \ `Bypass Effects` 且*没有*勾选 `Play On Awake`。（如果 `Play On Awake` 为 `true`，它会导致相机声音在场景启动时立即播放。）\n\
  \n### 添加快门视觉效果\n\n在 `Project pane` 中，选择 `Textures` 文件夹中名为 `White` 的纹理。然后从菜单栏选择 `Game\
  \ Object > Create Other > GUI Texture`。这会在 `Hierarchy` 中创建一个名为 `White` 的新 `GUITexture`。将其重命名为\
  \ `WhiteOut`，以免与 `Hierarchy` 中已有的 `White` 混淆。然后按照如下设置设置：\n\n![Image](img/00253.jpeg)\n\
  \n这应该会让 `Target` 窗口完全填充白色。每当 `Target` 窗口中的画面变化时，`WhiteOut` 就会闪烁以吸引玩家的注意力。\n\n###\
  \ 音频和视觉效果代码\n\n将以下代码添加到 `TargetCamera` 类中，以使用 `Audio Source` 和 `WhiteOut`。注意我们用于延迟操作的两种不同策略：`Invoke()`\
  \ 和 协协程。\n\n点击此处查看代码图片\n\n```csharp\npublic class TargetCamera : MonoBehaviour {\n\
  \n    ...\n\n    public Shot[]        playerShots;\n    public float[]      playerRatings;\n\
  \    public GUITexture    whiteOut;\n    void Start() {\n\n        // 找到 GUI 组件\n\
  \        ...\n        checkMark = go.GetComponent<GUITexture>();\n        go = GameObject.Find\
  \ (\"WhiteOut\");\n        whiteOut = go.GetComponent<GUITexture>();\n\n       \
  \ // 隐藏 checkMark 和 whiteOut\n        checkMark.enabled = false;\n        whiteOut.enabled\
  \ = false;\n        ...\n    }\n    void Update () {\n        Shot sh;\n       \
  \ // 鼠标输入\n        // 如果这一帧按下了左键或右键...\n        if (Input.GetMouseButtonDown(0)\
  \ || Input.GetMouseButtonDown(1)) {\n            ...\n            if (editMode)\
  \ {\n                ...\n            } else {\n                // 将此拍摄与当前 Shot\
  \ 进行比较\n                float acc = Shot.Compare( Shot.shots[shotNum], sh );\n \
  \               lastShot = sh;\n                playerShots[shotNum] = sh;\n   \
  \             playerRatings[shotNum] = acc;\n                // 显示玩家拍摄的画面\n    \
  \            ShowShot(sh);\n                // 等待 1 秒后返回当前拍摄\n                Invoke(\"\
  CurrentShot\",1);\n            }\n            // 播放快门声\n            this.GetComponent<AudioSource>().Play();\n\
  \        }\n        ...\n    }\n    public void ShowShot(Shot sh) {\n        //\
  \ 调用 WhiteTargetWindow() 并让其处理自己的计时\n        StartCoroutine( WhiteTargetWindow()\
  \ );\n        // 根据 Shot 移动 TargetCamera\n        this.transform.position = sh.position;\n\
  \        this.transform.rotation = sh.rotation;\n    }\n    public void ShowCurrentShot()\
  \ {\n        ShowShot(Shot.shots[shotNum]);\n    }\n    // 协程的另一个用途是像我们这里所做的那样，实现一个带有\n\
  \    // 延迟的触发后遗忘函数。WhiteOutTargetWindow() 将启用\n    // whiteOut，等待 0.05 秒，然后禁用它。将这种\n\
  \    // 延迟方法与上面使用的 Invoke(\"ShowCurrentShot\",1f) 进行比较\n    public IEnumerator WhiteOutTargetWindow()\
  \ {\n        whiteOut.enabled = true;\n        yield return new WaitForSeconds(0.05f);\n\
  \        whiteOut.enabled = false;\n    }\n    ...\n}\n```\n\n现在，运行场景，感觉应该更像是在拍照。当你拍下一张时，快门声会播放，`WhiteOut`\
  \ 会闪烁，你刚刚拍摄的画面会显示一秒，`WhiteOut` 再次闪烁，然后显示目标画面以及你表现的评分。\n\n### 总结\n\n虽然本教程中的代码比之前的章节简单，但我希望你能够有机会看到\
  \ Unity 中包含的这类强大的视觉技术（即使在 Unity 免费版中也是如此）。书中的大多数教程项目都是原型，因此它们看起来就像原型。在这个项目中，我想给你一个机会制作出漂亮的东西。\n\
  \n下一章的教程返回了原型风格的图形，但它包含了复杂的交互和对 XML 文件的读取。它还进一步利用了在本章中学会的多相机技巧。\n\n### 后续步骤\n\n\
  这个原型向你介绍了许多新概念，并展示了如何从 Unity 中获得精美的图形。这里你可以增加的一些额外内容：\n\n1. 在主窗口右上角添加一个计时器，倒计时玩家找到所有照片的时间。\n\
  2. 更改环境或为游戏创建一个新环境。当前环境有一个平坦的地板，但不必如此。\n3. 如果你更改了环境（即使在这个环境中），你可能想考虑根据 `Shot.target`\
  \ 与 `Shot.position` 的距离来调整拍摄比较的 `maxTarDeviation`。\n4. 在环境中放置移动的生物，玩家必须寻找并拍摄。根据生物在画面中的位置大小给玩家评分。类似的任务在\
  \ Ubisoft 开发的《Beyond Good & Evil》中是一个非常有趣的支线任务。提示：使用 `GameObject.Renderer.Bounds`\
  \ 获取生物周围的 3D 边界体，然后对边界的中心和范围调用 `Camera.WorldToViewportPoint()` 以找到它们在视口中的位置。如果物体位于中心并占据了相当大的比例，则给玩家评分。你甚至可以因为他们遵循三分法而给更多分（在网上搜索“摄影三分法”）。\n\
  \n\n\n这是本书的最后一个原型，因此也是最复杂的。在最后，你将获得一个用于动作冒险游戏的良好骨架。\n\n## 快速入门：Omega Mage 原型\n\n\
  该项目的 `unitypackage` 包含了许多资源、材质和脚本。由于你已经有了在 Unity 中通过简单形状构建对象的经验（正如你在 SHMUP 原型中做的那样），在这一章中我不再要求你这样做。相反，你将导入一系列预制体（prefabs），它们将作为游戏的艺术资源。\n\
  \n### 游戏概述\n\nOmega Mage 是一款类似于《塞尔达传说》和《地牢险》（Rogue）等经典的地下城爬行类游戏。然而，在这个游戏中，主角是一个魔法师，可以召唤四元素来击败敌人。\n\
  \n图 35.1 显示了 Omega Mage 在原型结束时的样子。屏幕左侧 3/4 处的 `MainCamera` 以俯视视角显示动作，右侧 1/4 处包含一个用于选择元素的简单背包。\n\
  \n![Image](img/00254.jpeg)\n\n**图 35.1** Omega Mage 的外观示例\n\nOmega Mage 的设计考虑了 iPad\
  \ 和 Android 等基于触摸的平板电脑，因此交互操作通过鼠标或触摸界面都能同样地运行。\n\n玩家可以在主区域点击或触摸地面，使其角色向触碰点移动。点击背包区域中的四个元素之一将选择该元素（玩家将看到它环绕着魔法师旋转）。点击其他元素中间的黑色“无（none）”元素将清除元素选择。\n\
  \n在未选择任何元素的情况下点击并拖动，会导致魔法师持续向玩家的光标（或触摸位置）移动，直到松开鼠标或抬起手指，此时魔法师将停止。如果她已经选择了一个元素，在地面上点击并拖动将施放一个地面法术（如图\
  \ 35.1 所示的火法术）。\n\n点击敌人将对其进行攻击。如果玩家选择了某种元素，魔法师将施放该元素类型的法术。如果她没有选择任何元素，点击将稍微推开敌人。\n\
  \n### Unitypackage 中 ProtoTools 的更改\n\n对于这个原型，我在 `ProtoTools` 目录中添加了几个新脚本：\n\n![Image](img/00003.jpeg)\
  \ `PT_MonoBehaviour`: 这个简单的脚本仅为我们经常更改的嵌套字段添加了一些快捷方式，包括位置、`localPosition`、旋转、缩放、材质和颜色。如果你的脚本继承自此类而不是\
  \ `MonoBehaviour`，那么它们将获得这一微小的增益功能。\n\n![Image](img/00003.jpeg) `PT_Mover`: 这个更复杂的脚本允许对象使用贝塞尔曲线（Bézier\
  \ curves）基于时间移动，这会影响主材质的位置、旋转、缩放和颜色。它是 `PT_MonoBehaviour` 的子类，因此如果你的脚本继承自它，它们将同时获得\
  \ `PT_MonoBehaviour` 和 `PT_Mover` 的功能。\n\n***\n\n## 为本章设置项目\n\n遵循标准的项目设置程序，在 Unity\
