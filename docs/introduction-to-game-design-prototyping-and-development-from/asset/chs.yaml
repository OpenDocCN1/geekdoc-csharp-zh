  \        // 如果 otherGO 是 EnemyBug，将 otherGO 传递给 CollisionDamage()\n        if (bug\
  \ != null) CollisionDamage(otherGO);\n    }\n\n    void CollisionDamage(GameObject\
  \ enemy) {\n        // 如果处于无敌状态则不受伤害\n        if (invincibleBool) return;\n    \
  \    // 法师被敌人击中\n        StopWalking();\n        ClearInput();\n        health -=\
  \ 1; // 受到 1 点伤害（目前）\n        if (health <= 0) {\n            Die();\n         \
  \   return;\n        }\n        damageTime = Time.time;\n        knockbackBool =\
  \ true;\n        knockbackDir = (pos - enemy.transform.position).normalized;\n \
  \       invincibleBool = true;\n    }\n\n    // 法师死亡\n    void Die() {\n       \
  \ Application.LoadLevel(0); // 重重新关卡\n        // ^ 最终，你可能想要一些更优雅的操作\n    }\n   \
  \ // 显示玩家点击的位置\n    ...\n}\n```\n\n到此为止 `EnemyBug` 的编写就完成了。确保点击 `EnemyBug` 属性顶部部分右侧\
  \ Prefab 的 `Apply` 按钮，将你的所有工作应用到 `_Prefabs` 文件夹中的 `EnemyBug` 版本中。这会将你所做的所有更改应用回\
  \ `EnemyBug` Prefab。为了确保一切运行正常：\n\n**1.** 保存你的场景。\n**2.** 从 `Hierarchy`（层级面板）中删除\
  \ `EnemyBug`。\n**3.** 从 `_Prefabs` 文件夹将一个新的 `EnemyBug` 实例拖入 `Hierarchy` 中。\n**4.**\
  \ 确保它的工作方式相同。\n\n如果一切运行正常，你可以删除 `Hierarchy` 中的新 `EnemyBug` 实例并保存场景。如果发生任何错误，你可以恢复到已保存的场景版本并尝试重新应用更改。由于某种原因这仍然不起作用，将\
  \ `Hierarchy` 中正常版本的 `EnemyBug` 拖入 `_Prafabs` 文件夹。这将创建一个名为 `EnemyBug 1` 的新 prefab。然后删除旧的\
  \ `EnemyBug` prefab 并将 `EnemyBug 1` 重命名为 `EnemyBug`。\n\n#### EnemySpiker\n\n我们将实现的下种敌人是\
  \ `EnemySpiker`。这种刺者会在一条线上来回巡逻。它不受任何法术影响，并在接触时对法师造成。创建一个名为 `EnemySpiker` 的新 C# 脚本并将其放在\
  \ `__Scripts` 文件夹中。将此脚本挂载到 `_Prefabs` 文件夹中的 `EnemySpiker` prefab 上。打开 `EnemySpiker`\
  \ 脚本并输入以下代码：\n\n```csharp\nusing UnityEngine;\nusing System.Collections;\nusing\
  \ System.Collections.Generic;\npublic class EnemySpiker : PT_MonoBehaviour {\n \
  \   public float speed = 5f;\n    public string roomXML = \"{\";\n    public bool\
  \ ________________;\n    public Vector3 moveDir;\n    public Transform characterTrans;\n\
  \    void Awake() {\n        characterTrans = transform.Find(\"CharacterTrans\"\
