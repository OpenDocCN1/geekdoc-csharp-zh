  \ null\n    return(null);\n}\n```\n\n**4.** 现在点击播放，你应该能看到所有 52 张牌都正确布局，并且花牌带有点数和花纹。下一步要做的是给卡牌添加背面。背面的\
  \ sorting order 将比卡牌上的任何内容都高，当卡牌背面朝上时可见，当卡牌正面朝上时隐藏。\n\n为了实现这种可见性切换，请向 `Card` 类中添加以下\
  \ `faceUp` 属性。作为一个属性，`faceUp` 实际上是两个函数（一个 get 和一个 set）伪装成单个字段：\n\n点击此处查看图片\n\n```csharp\n\
  public class Card : MonoBehaviour {\n    ...\n    public CardDefinition def; //\
