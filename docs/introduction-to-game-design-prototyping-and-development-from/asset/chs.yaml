  \ timeStart)/timeDuration;\n        // 使用 Utils 中的 Easing 类对 u 值进行处理\n        float\
  \ uC = Easing.Ease(u, MOVE_EASING);\n        if (u<0) { // 如果 u<0，则我们还不应该移动。\n \
