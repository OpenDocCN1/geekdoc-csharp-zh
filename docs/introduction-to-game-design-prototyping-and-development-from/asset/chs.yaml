  \ 场景周围的八个镜头\n\n### 7. 保存你的场景。记住，始终保存你的场景。\n\n#### `OnDrawGizmos()` 的两个用途\n\n`Gizmos`\
  \ 是你在 Unity Scene 面板中看到的各种屏幕图标和工具。这些包括轴 gizmo（显示 Scene 视图的朝向）以及所有灯光等图标。Gizmos 也可以作为调试工具，允许开发者使用它们绘制简单的形状。我们将为\
  \ `TargetCamera` 添加一个 `DEBUG` 布尔值，如果勾选了，`OnDrawGizmos()` 将在 Scene 面板中绘制关于每个 shot\
  \ 的信息。\n\n将以下代码添加到 `TargetCamera` 的末尾：\n\n点击此处查看代码图像\n\n```csharp\npublic class\
  \ TargetCamera : MonoBehaviour {\n    ...\n    // OnDrawGizmos() is called ANY time\
  \ Gizmos need to be drawn, even when\n    // Unity isn't playing!\n    public void\
  \ OnDrawGizmos() {\n        ...\n        // If checkToDeletePlayerPrefs is checked\n\
