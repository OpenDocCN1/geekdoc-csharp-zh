  \  cards.Add (card);\n    }\n}\n```\n\n**6.** 点击播放，你会发现所有 52 张牌现在都是背面朝上的。如果你将最后一行改为\
  \ `faceUp = true;`，它们将是正面朝上的。\n\n### 洗牌\n\n既然卡牌已经可以构建并显示在屏幕上，我们从 `Deck` 类需要的最后一个功能是洗牌。\n\
  \n**1.** 在 `Deck` 类末尾添加 `Shuffle()` 方法：\n\n点击此处查看图片\n\n```csharp\npublic class Deck\
  \ : MonoBehaviour {\n    ...\n    // 洗牌 Deck 中的 cards\n    static void Shuffle(ref\
  \ List<Card> oCards) { // 1\n    // 创建一个临时列表来存放新的顺序\n    List<Card> tCards = new\
  \ List<Card>(); // 初始化临时列表\n    int ndx; // 将存储要移动的牌的索引\n    tCards = new List<Card>();\n\
  \    // 只要原始牌组中还有牌就循环\n    while (oCards.Count > 0) {\n        // 随机选取一个牌的索引\n \
  \       ndx = Random.Range(0,oCards.Count);\n        // 将该牌添加到临时列表\n        tCards.Add(oCards[ndx]);\n\
  \        // 从原始牌组中移除该牌\n        oCards.RemoveAt(ndx);\n    }\n    // 用临时列表替换原始列表\n\
  \    oCards = tCards;\n    // 因为 oCards 是引用变量，传入的\n    // 也会发生变化。\n    }\n}\n```\n\
  \n在前面的代码标记为 `// 1` 的位置，`ref` 关键字确保了传递给 `List<Card> oCards` 的引用传递，而不是复制。这意味着对 `oCards`\
  \ 的任何操作实际上都发生在传入的变量上。换句话说，如果通过引用传递 `Deck` 的卡牌，则这些卡牌不需要返回变量就可以洗牌。\n\n**2.** 对 Prospector\
  \ 脚本进行以下更改以查看效果：\n\n点击此处查看图片\n\n```csharp\npublic class Prospector : MonoBehaviour\
  \ {\n    static public Prospector S;\n    public Deck deck;\n    public TextAsset\
  \ deckXML;\n    void Awake() {\n        S = this; // 设置 Prospector 的单例\n    }\n\
  \    void Start () {\n        deck = GetComponent<Deck>(); // 获取 Deck\n        deck.InitDeck(deckXML.text);\
  \ // 将 DeckXML 传递给它\n        Deck.Shuffle(ref deck.cards); // 这洗了牌组\n    }\n}\n\
  ```\n\n\n\n\n```cs\n// The ref keyword passes a reference to deck.cards, which allows\n\
  //   deck.cards to be modified by Deck.Shuffle()\n    }\n}\n```\n\n**3.** 如果你现在运行场景，可以在场景层级面板（Hierarchy）中选择\
  \ `MainCamera`，并查看 `Deck.cards` 变量，以看到洗牌过的牌组。\n\n既然 `Deck` 类可以洗牌任何卡牌列表，你已经拥有了创建任何纸牌游戏的基础工具。你在这个原型中将制作的游戏叫做\
  \ `Prospector`（淘金矿者）。\n\n## Prospector 游戏\n\n到目前为止的代码已经为你提供了制作任何纸牌游戏的基础工具。现在，让我们来谈谈我们要制作的特定游戏。\n\
  \n*Prospector* 是基于经典的纸牌类游戏 *Tri-Peaks*（三峰接）的。这两种游戏的规则相同，但有两点不同：\n\n1.  *Prospector*\
  \ 的前提是玩家正在向下挖掘金矿，而 *Tri-Peaks* 的前提是玩家正试图爬上三座山。\n2.  *Tri-Peaks* 的目标仅仅是清空所有的牌。而 *Prospector*\
  \ 的目标是通过连续打出一组牌（且不需要从牌堆中抽牌）来得分，且牌组中的每张金牌都会让整个组合的价值翻倍。\n\n### Prospector 规则\n\n想要尝试一下，拿一副普通的扑克牌（比如实体牌，而不是我们刚刚制作的虚拟牌）。去掉大王牌并洗牌剩下的\
  \ 52 张牌：\n\n1.  按照图 31.7 所示所示摆出 28 张牌。底部的三行牌应该朝下，顶部的一行朝上。牌的边缘不需要接触，但下方的牌需要被上方的牌覆盖。这为我们的淘金矿者将挖掘的“矿井”设置了初始的牌阵（tableau）。\n\
  \n![Image](img/00215.jpeg)\n\n**图 31.7** Prospector 中矿井的初始牌阵布局\n\n2.  牌的其余部分形成牌堆。将其朝下放在最顶行牌的上方。\n\
  3.  从牌堆中取出最顶的一张牌，将其朝上并居中放在最顶行牌的上方。这就是目标牌。\n4.  任何与目标牌点数正好大一级或小一级的牌都可以从牌阵移动到目标牌上，使其成为新的目标牌。A\
  \ 和 K 是循环衔接的，所以 A 可以打在 K 之上，反之亦然。\n5.  如果一张朝下的牌不再被更高一行的牌覆盖，就可以将其翻为朝上。\n6.  如果朝上的牌中没有一张可以打在目标牌上，则从牌堆中抽取新牌作为下一个目标牌。\n\
  7.  如果在牌堆用完之前清空了牌阵，你就赢了！（得分和金牌将在游戏的数字版本中进行保存。）\n\n### 游戏示例\n\n图 31.8 中的图像显示了 Prospector\
  \ 的示例初始布局。在所示的情况下，玩家最初可以先将 9C（梅花 9）或 7S（黑桃 7）打在 8H 上。\n\n![Image](img/00216.jpeg)\n\
  \n**图 31.8** Prospector 的示例初始布局\n\n琥珀色和绿色数字显示了两个可能的四牌组合。在琥珀色组合中，打出了 9C，它变成了新的目标牌。这允许打出\
  \ 8S、8D 或 8C。玩家选择 8S，因为这会揭示被 9C 和 8S 隐藏的牌。然后琥珀色组合继续打出 7S，最后是 8C。这导致了图 31.9 所示的布局。\n\
  \n![Image](img/00217.jpeg)\n\n**图 31.9** 第一次组合后的 Prospector 示例游戏\n\n现在，由于牌阵中没有更多有效的朝上牌可以打出，\
  \ 玩家必须从牌堆中抽取一张牌作为下一个目标牌。这结束了游戏的第一次组合。\n\n尝试玩几次游戏来找找感觉。\n\n### 在代码中实现 Prospector\n\
  \n正如你通过玩游戏看到的，Prospector 是一个非常简单的游戏，但也非常好玩。我们之后可以通过一些精美的视觉效果和评分调整来增加这种趣味性，但现在，让我们先让基础游戏运行起来。\n\
  \n#### 布局矿井牌阵\n\n我们将在 Prospector 的数字版本中为矿井牌实现与相同的牌阵布局，就像你刚刚玩过的纸质原型一样。为了实现这一点，我们将根据图\
