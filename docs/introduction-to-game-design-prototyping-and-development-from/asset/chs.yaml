  \ 的护盾将由一个透明贴图 quad（用于提供视觉效果）和一个 `Sphere Collider`（用于碰撞）组成。\n\n创建一个 quad（GameObject\
  \ > Create Other > Quad）。将 quad 重命名为 `Shield` 并使其成为 `Hero` 的子物体。设置 `Shield` 的变换为\
  \ `P:[0,0,0]` `R:[0,0,0]` `S:[8,8,8]`。\n\n在层级面板中选择 `Shield` 并添加 `Sphere Collider`（Component\
  \ > Physics > Sphere Collider）。然后通过点击 Inspector 中 `Mesh Collider` 名称右侧的小齿轮并选择 `Remove\
  \ Component` 来删除它。\n\n创建一个材质（Assets > Create > Material），命名为 `Mat Shield`，并放入 `Materials`\
  \ 文件夹。将 `Mat Shield` 拖到 `Shield`（层级面板中 `Hero` 下方）上以为 quad 赋值。\n\n在层级面板中选择 `Shield`，你现在会在\
  \ `Shield` 的检查器中看到 `Mat Shield`。将 `Mat Shield` 的 `Shader` 设置为 `ProtoTools > UnlitAlpha`。在\
  \ `Mat Shield` 的着色器选择下方，应该有一个区域允许你选择材质的主颜色以及贴图。（如果你没有看到这个，请点击一次检查器中的 `Mat Shield`\
  \ 名称，它就会出现。）点击贴图方框右下角的 *Select* 并选择名为 `Shields` 的贴图。点击 *Main Color* 旁边的颜色块并选择一种亮绿色（RGBA:[0,255,0,255]）。然后将\
  \ `Tiling.x` 设置为 `0.2`并将 `Offset.x` 设置为 `0.4`。`x Tiling` 的 `0.2` 导致 `Mat Shield`\
  \ 只使用整个 `Shield` 贴图在 x 方向上的分之一，而 `x Offset` 则选择哪一个。`Tiling.y` 应保持为 `1.0`，`Offset.y`\
  \ 应保持为 `0`。这是因为贴图被设计成水平方向分为五部分，但垂直方向只分一份。\n\n\n\n\n创建一个名为 `Shield` 的新 C# 脚本（`Asset\
  \ > Create > C# Script`）。将其放入 Project 面格中的 `__Scripts` 文件夹，然后将其拖到层级（Hierarchy）中的\
  \ `Shield` 上，将其赋值为 `Shield` GameObject 的组件。在 MonoDevelop 中打开 `Shield` 脚本并输入以下代码：\n\
  \n点击查看代码图像\n\n```csharp\nusing UnityEngine;\n\nusing System.Collections;\n\npublic\
  \ class Shield : MonoBehaviour {\n\n    public float rotationsPerSecond = 0.1f;\n\
  \n    public bool ________________;\n\n    public int levelShown = 0;\n\n    void\
  \ Update () {\n\n        // 从 Hero Singleton 读取当前的护盾等级\n        int currLevel =\
  \ Mathf.FloorToInt( Hero.S.shieldLevel );          // 1\n\n        // 如果这与 levelShown\
  \ 不同...\n        if (levelShown != currLevel) {\n            levelShown = currLevel;\n\
  \            Material mat = this.renderer.material;\n            // 调整纹理偏移以显示不同的护盾等级\n\
  \            mat.mainTextureOffset = new Vector2( 0.2f*levelShown, 0 );      //\
  \ 2\n        }\n        // 每秒旋转护盾一下\n        float rZ = (rotationsPerSecond*Time.time*360)\
  \ % 360f;           // 3\n        transform.rotation = Quaternion.Euler( 0, 0, rZ\
  \ );\n    }\n}\n```\n\n1. `currLevel` 被设置为当前 `Hero.S.shieldLevel` 浮点数的向下取整。通过对 `shieldLevel`\
  \ 进行取整，我们确保护盾会跳转到新的 x 偏移，而不是在两个护盾图标之间显示偏移。\n2. 这一行调整了 `Mat Shield` 的 x 偏移以显示正确的护盾等级。\n\
  3. 这一行和下一行导致 `Shield` GameObject 每帧都绕 z 轴缓慢旋转。\n\n### 让英雄保持在屏幕上\n\n你的 `Hero` 飞船运动现在感觉应该很不错了，旋转的护盾看起来也很漂亮，但此时你可以轻松地让飞船飞出屏幕。这比我们之前做的一些事情要复杂一点，但你现在将编写一些可重用的代码，将飞船限制在屏幕内。\n\
  \n#### 边界 (Bounds)\n\n渲染器和碰撞器都有一个类型为 `Bounds` 的 `bounds` 字段。`Bounds` 由中心点和大小定义，每个值都是\
  \ `Vector3` 类型。在图 30.5 中，这在二维空间中进行了解释；只需记住在 Unity 中工作时还有一个 z 维度即可。\n\n![图像](img/00183.jpeg)\n\
  \n**图 30.5** 显示 `Bounds` 各种字段 `bnd` 的图，定义为 `Bounds bnd = new Bounds( new Vector3(3,4,0),\
  \ new Vector3(16,16,0) );`\n\n##### 组合复杂 GameObject 的边界\n\n`Hero` 是一个带有多个子对象的复杂\
  \ GameObject，然而，`Hero` 本身没有碰撞器。要找到 `Hero` 的碰撞边界，有必要找到 `Hero` 每个子对象的边界，然后创建一个包含所有这些边界的\
  \ `Bounds` 变量。Unity 并没有包含任何用于扩展 `Bounds` 以包裹其他 `Bounds` 的函数，因此我们需要写一个名为 `BoundsUnion`\
  \ 的函数（之所以命名是因为它返回两个 `Bounds` 的数学并集）。这似乎在随后的游戏中也可能有用，因此我们将这部分作为一个新的 `Utils` C# 类的一部分，我们将用可重用的游戏代码填充该类。`Utils`\
  \ 类将几乎完全由静态函数组成，这样这些函数就可以从代码中的任何地方轻松调用。\n\n创建一个名为 `Utils` 的新 C# 脚本并将其放在 `__Scripts`\
  \ 文件夹中。在 MonoDevelop 中打开 `Utils` 并输入以下内容：\n\n点击查看代码图像\n\n```csharp\nusing UnityEngine;\n\
  using System.Collections;\nusing System.Collections.Generic;\npublic class Utils\
  \ : MonoBehaviour {\n//============= 边界函数 =\n    // 创建封装了两个 Bounds 的边界。\n    public\
  \ static Bounds BoundsUnion( Bounds b0, Bounds b1 ) {\n        // 如果其中一个边界的大小为 Vector3.zero，则忽略它\n\
  \        if (b0.size == Vector3.zero && b1.size != Vector3.zero ) {   // 1\n   \
  \         return b1;\n        } else if (b0.size != Vector3.zero && b1.size == Vector3.zero\
  \ ) {\n            return b0;\n        } else if (b0.size == Vector3.zero && b1.size\
  \ == Vector3.zero ) {\n            return b0;\n        }\n        // 扩展 b0 以包含 b1.min\
  \ 和 b1.max\n        b0.Encapsulate(b1.min);                               // 2\n\
  \        b0.Encapsulate(b1.max);\n        return b0;\n    }\n}\n```\n\n1. 这个 `if`\
  \ 子句确保没有一个边界的大小为 0。如果其中一个的大小为 `Vector3.zero`，则返回另一个。如果两个的大小都为 0，则返回 `b0`。\n2. 尽管\
  \ `Bounds` 类不包含一个扩展来包裹其他 `Bounds` 的函数，但它有一个用于包含 `Vector3` 的函数。`b0.Encapsulate(b1.min)`\
  \ 会扩展 `Bounds` 以包含 `b1.min`，如果 `b1.min` 和 `b1.max` 都在新扩展的 `b0` 内部，那么 `b0` 就扩展以包含\
  \ `b1`。\n\n在 `Utils` 类 `BoundsUnion()` 之后添加以下代码：\n\n点击查看代码图像\n\n```csharp\npublic\
  \ class Utils : MonoBehaviour {\n//============= 边界函数 =\\\n    // 创建封装了传入两个 Bounds\
  \ 的边界。\n    public static Bounds BoundsUnion( Bounds b0, Bounds b1 ) {\n       \
  \ ...\n    }\n    public static Bounds CombineBoundsOfChildren(GameObject go) {\n\
  \        // 创建空的 Bounds b\n        Bounds b = new Bounds(Vector3.zero, Vector3.zero);\n\
  \        // 如果 GameObject 有渲染器组件...\n        if (go.renderer != null) {\n      \
  \      // 扩展 b 以包含渲染器的边界\n            b = BoundsUnion(b, go.renderer.bounds);\n\
  \        }\n        // 如果 GameObject 有碰撞器组件...\n        if (go.collider != null)\
  \ {\n            // 扩展 b 以包含碰撞器的边界\n            b = BoundsUnion(b, go.collider.bounds);\n\
  \        }\n        // 递归地遍历此 transform 的每个子\n        foreach( Transform t in go.transform\
  \ ) { // 1\n            // 扩展 b 以包含它们的边界\n            b = BoundsUnion(b, CombineBoundsOfChildren(t.gameObject)\
  \ ); // 2\n        }\n        return b;\n    }\n}\n```\n\n1. `Transform` 类支持枚举器（通过实现\
  \ `IEnumerable`），这使得可以使用 `foreach` 循环遍历 `Transform` 的每个子。\n2. 因为 `CombineBoundsOfChildren()`\
  \ 调用它自己（实际上是另一个实例），所以这也是递归函数的另一个例子。（递归函数在第 23 章中首次介绍过，“函数和参数](#part0036.html_ch23).”）\n\
  \n现在可以通过传递 `CombineBoundsOfChildren()` 方法来获取任何 GameObject 及其子对象的组合边界。打开 `Hero` C#\
  \ 脚本并添加以下代码以获取 `_Hero` 的组合边界：\n\n点击查看代码图像\n\n```csharp\npublic bool ____________________________;\n\
  \npublic Bounds bounds;\n\nvoid Awake() {\n    S = this; // 设置单例\n    bounds = Utils.CombineBoundsOfChildren(this.gameObject);\n\
  }\n```\n\n##### 寻找摄像机的边界\n\n\n\n\n为了让 `Hero` 保持在屏幕上，了解摄像视场范围的边界也是必要的。对于透视相机，这会非常棘手，但只要正交相机不旋转，它处理起来要简单得多。为了找到相机的边界，我们将创建两个\
  \ `Vector3`（分别用 `boundTLN` 表示左上近点，`boundBRF` 表示右下远点）。这些边界通过将屏幕的左上角和右下坐标传入 `Camera.ScreenToWorldPoint`，并将生成的\
  \ `Vector3` 的 z 值替换为相机近裁剪平面和远裁剪设置的 z 平面来定义。\n\n在 MonoDevelop 中打开 `Utils`，并在静态方法\
  \ `CombineBoundsOfChildren()` 之后添加以下代码：\n\n点击此处查看代码\n\n```csharp\npublic class Utils\
  \ : MonoBehaviour {\n\n//============================= Bounds Functions ==================\\\
  \n\n    // 创建封装了传入的两个 Bounds 的边界。\n    public static Bounds BoundsUnion(Bounds b0,\
  \ Bounds b1) {\n        ...\n    }\n\n    public static Bounds CombineBoundsOfChildren(GameObject\
  \ go) {\n        ...\n    }\n\n    // 创建一个静态只读的公共属性 camBounds\n    static public\
  \ Bounds camBounds { // 1\n        get {\n            // 如果 _camBounds 还没有被设置\n\
  \            if (_camBounds.size == Vector3.zero) {\n                // 使用默认相机设置相机边界\n\
  \                SetCameraBounds();\n            }\n            return(_camBounds);\n\
  \        }\n    }\n    // 这是 camBounds 使用的私有静态字段\n    static private Bounds _camBounds;\
  \ // 2\n    // 此函数被 camBounds 用于设置 _camBounds，也可以\n    // 直接调用。\n    public static\
  \ void SetCameraBounds(Camera cam=null) { // 3\n        // 如果没有传入相机，使用主相机\n    \
  \    if (cam == null) cam = Camera.main;\n        // 这对相机做出了两个重要的假设！\n        //\
  \   1. 相机是正交的 (Orthographic)\n        //   2. 相机的旋转角度为 R:[0,0,0]\n        // 在屏幕坐标的左上角和右下角创建\
  \ Vector3\n        Vector3 topLeft = new Vector3(0, 0, 0);\n        Vector3 bottomRight\
  \ = new Vector3(Screen.width, Screen.height, 0);\n        // 将这些转换为世界坐标\n      \
  \  Vector3 boundTLN = cam.ScreenToWorldPoint(topLeft);\n        Vector3 boundBRF\
  \ = cam.ScreenToWorldPoint(bottomRight);\n        // 调整它们的 z 值使其位于近裁剪和平远裁剪平面\n \
  \       boundTLN.z += cam.nearClipPlane;\n        boundBRF.z += cam.farClipPlane;\n\
  \        // 找到 Bounds 的中心\n        Vector3 center = (boundTLN + boundBRF)/2f;\n\
  \        _camBounds = new Bounds(center, Vector3.zero);\n        // 扩展 _Bounds 以包含范围。\n\
  \        _camBounds.Encapsulate(boundTLN);\n        _camBounds.Encapsulate(boundBRF);\n\
  \    }\n}\n```\n\n1. `Utils.camBounds` 是一个静态只读属性。作为一个属性，它在每次被访问时都会运行 `get{}` 句中的代码。如果私有静态字段\
  \ `_camBounds` 尚未设置，`get{}` 句会在返回返回之前调用 `Utils.SetCameraBounds()`。这种技术被用于确保 `_camBounds`\
  \ 在恰好被 `camBounds` 读取时被设置，并确保 `Utils.SetCameraBounds()` 只被调用一次。\n2. 注意，`camBounds`\
  \ 和 `_camBounds` 的声明顺序对 C# 并不重要。编译器在解释任何代码之前，会读取 `Utils` 类中声明的所有内容。\n3. 静态公共方法 `SetCameraBounds()`\
  \ 有一个默认值为 `null` 的 `Camera cam`。如果没有向 `SetCameraBounds()` 传入参数，它会将 `cam` 中的 `null`\
  \ 值替换为 `Camera.main`（场景的主相机）。如果程序员希望使用 `MainCamera` 以外的相机来设置 `_camBounds`，可以调用 `Utils.SetCameraBounds()`。\n\
  \n### 测试两个边界的重叠\n\n为了保持 `Hero` 在屏幕上，我们需要的最后一个组件是能够测试两个 `Bounds` 是否重叠。以下代码将使用一个 `enum`（枚举），你可以在“Enum”侧边栏中学习关于它的更多信息。\n\
  \n首先，在 `Utils` C# 脚本中 `Utils` 类声明*之前*添加以下列表中的代码：\n\n点击此处查看代码\n\n```csharp\nusing\
  \ UnityEngine;\nusing System.Collections;\nusing System.Collections.Generic;\n\n\
  // 这实际上是在 Utils 类之外\npublic enum BoundsTest {\n    center, // GameObject 的中心点在屏幕上吗？\n\
  \    onScreen, // 边界是否完全在屏幕内？\n    offScreen // 边界是否完全在屏幕外？\n}\n\npublic class Utils\
  \ : MonoBehaviour {\n    ...\n}\n```\n\n### Enum (枚举)\n\n`enum`（或枚举）是 C# 中定义特定命名数字的方式。`Utils`\
  \ C# 脚本顶部的枚举定义声明了一个 `BoundsTest` 类型，包含三个值：`center`、`onScreen` 和 `offScreen`。一旦定义了枚举，就可以声明一个使用该枚举类型的变量。\n\
  \n```csharp\npublic BoundsTest testMode = BoundsTest.center;\n```\n\n上一行代码将创建一个名为\
  \ `testMode` 的变量，其类型为 `BoundsTest` 值为 `BoundsTest.center`。枚举通常用于只有少数已知选项且你希望变量具有可读性的代码中。或者也可以通过字符串传递边界测试类型（例如“center”、“onScreen”或“offScreen”），但使用枚举是一种更整洁的方法，不容易拼错，并且在输入时支持自动补全。\n\
  \n关于枚举的更多信息，请参见附录 B，“有用概念](#part0052.html_app02)”。\n\n现在，将以下方法作为 `Utils` 类的一部分。注意\
  \ `BoundsTest` 枚举是如何在 `switch` 语句中使用的。在接下来的代码中，有几处该代码的用法。\n\n\n\n\n```javascript\n\
  off.y = pos.y - bigB.max.y;\n} else if (pos.y < bigB.min.y) {\n    off.y = pos.y\
  \ - bigB.min.y;\n}\nif (pos.z > bigB.max.z) {\n    off.z = pos.z - bigB.max.z;\n\
  } else if (pos.z < bigB.min.z) {\n    off.z = pos.z - bigB.min.z;\n}\nreturn( off\
  \ );\n// The onScreen test determines what off would have to be applied to\n// \
  \ keep all of lilB inside bigB\ncase BoundsTest.onScreen:\n    if ( bigB.Contains(lilB.min\
