  \ { // 如果是 none...\n            ClearElements(); // 则清除所有 Elements\n           \
  \ return; // 并返回\n        }\n        if (maxNumElements == 1) {\n            //\
  \ 如果可以选择一个，则清除现有的...\n            ClearElements(); // 它可以被替换\n        }\n      \
  \  // 选择的元素不能超过 maxNumElements\n        if (selectedElements.Count >= maxNumElements)\
  \ return; // 添加此元素是安全的\n        GameObject go = Instantiate(elementabs[(int) elType])\
  \ as GameObject; // 注意上行中从 ElementType 到 int 的类型转换\n        Element el = go.GetComponent<Element>();\n\
  \        el.transform.parent = this.transform;\n        selectedElements.Add(el);\
  \ // 将 el 添加到 selectedElements 列表\n    }\n    // 清空 selectedElements 并销毁其 GameObject\n\
  \    public void ClearElements() {\n        foreach (Element el in selectedElements)\
  \ {\n            // 销毁列表中的每个 GameObject\n            Destroy(el.gameObject);\n \
  \       }\n        selectedElements.Clear(); // 清空列表\n    }\n    // 每帧调用 Update\
  \ 绕旋转元素\n    void OrbitSelectedElements() {\n        // 如果没有选择元素，直接返回\n        if\
