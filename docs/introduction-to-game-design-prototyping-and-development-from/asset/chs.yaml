  \    public float totalLineLength;\n    public List<Vector3> linePts; // 显示在线条中的点\n\
  \    ...\n    //---------------- LineRenderer 代码 ----------------\n    // 向线条添加一个新点。如果它与现有点太近则忽略该点，\n\
  \    // 如果太远则添加额外的点\n    void AddPointToLiner(Vector3 pt) {\n        pt.z = lineZ;\
  \ // 将 pt 的 z 设置为 lineZ 以使其稍微\n        // 离开地面\n        //linePts.Add(pt);    //\
  \ 注释掉这些行\n        //UpdateLiner();      // 注释掉这些行\n        // 如果 linePts 为空，始终添加该点\n\
  \        if (linePts.Count == 0) {\n            linePts.Add(pt);\n            totalLineLength\
  \ = 0;\n            return; // ...等待第二个点来启用线条\n        }\n        // 如果线条过长，则返回\n\
  \        if (totalLineLength > maxLength) return;\n        // 如果有上一个点 (pt0)，则找到\
  \ pt 距离它的多远\n        Vector3 pt0 = linePts[linePts.Count-1]; // 获取 linePts 中的最后一个点\n\
  \        Vector3 dir = pt-pt0;\n        float delta = dir.magnitude;\n        dir.Normalize();\n\
  \        totalLineLength += delta;\n        // 如果小于最小距离\n        if (delta < lineMinDelta\
  \ ) {\n            // ...那么太近了；不添加它\n            return;\n        }\n        //\
  \ 如果大于最大距离，则额外的点...\n        if (delta > lineMaxDelta) {\n            // ...则在中间添加额外的点\n\
  \            float numToAdd = Mathf.Ceil(delta/lineMaxDelta);\n            float\
  \ midDelta = delta/numToAdd;\n            Vector3 ptMid;\n            for (int i=1;\
  \ i<numToAdd; i++) {\n                ptMid = pt0+(dir*midDelta*i);\n          \
  \      linePts.Add(ptMid);\n            }\n        }\n        linePts.Add(pt); //\
  \ 添加点\n        UpdateLiner(); // 最后更新线条\n    }\n    ...\n}\n```\n\n现在线条的显示应该更加平滑，并且它应该在长度约为\
  \ 8 米处（即 8 个 Unity 单位）停止绘制。\n\n### 火焰法术\n\n现在我们已经可以看到法术将前往的线条，是时候释放法术了。将 Project\
  \ 面板中 `_Prefabs` 文件夹下的 `FireGroundSpellPrefab` 拖入场景中，你就可以预览法术的样子。你也可以利用这段时间检查它的\
  \ `Particle System` 组件，它负责生成所有的火焰粒子。探索完成后，从层级面板（Hierarchy）中删除该实例。\n\n打开 `Mage` 脚本并添加以下代码：\n\
  \n```csharp\nclass Mage : MonoBehaviour {\n    ...\n    public GameObject fireSpellPrefab;\n\
  \    public bool ________________;\n    protected Transform spellAnchor; // 所有法术的父物体\n\
