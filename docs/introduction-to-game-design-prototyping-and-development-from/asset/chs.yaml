  \n![Image](img/00003.jpeg) OS X 右键点击\n\n# C# 和 Unity 编码概念\n\n本节涵盖了 C# 编码中的元素，你在读完本书后可能想要回顾以复习。这里还有一些内容虽然很重要，但并不适合放入常规章节中。为了方便起见，这些内容都被收集在这个附录中。\n\
  \n## 位运算布尔运算符与层掩码（Layer Masks）\n\n正如你在第 20 章“布尔运算与条件判断”中所学的，单个管道符号（`|`）可以作为非短路逻辑或运算符使用，单个安符符号（`&`）可以作为非短路逻辑与运算符使用。然而，在处理\
  \ `ints` 时，它们还有另一个重要特性。`|` 和 `&` 可以对整数进行位运算，因此有时被称为*位按或*（bitwise OR*）和*位按与*（bitwise\
  \ AND*）。\n\n在位运算中，整数的每个位将使用 C# 中包含的 6 种位运算符之一进行比较。下列表包含了它们对一个 8 位字节（一种可以存储 0 到 255\
  \ 数字的简单整数数据类型）的影响。这些操作在 32 位 `int` 上的工作方式相同（但 32 位无法显示在这一页上）。\n\n![Image](img/00268.jpeg)\n\
  \n在 Unity 中，位运算通常用于管理 `LayerMask`。Unity 允许开发者定义最多 32 层，而 `LayerMask` 是一个 32 位的整数表示，用于在任何物理引擎或射线检测中考虑哪些层。在\
  \ Unity 中，`LayerMask` 类型用于层掩码，但它只是 32 位 `int` 的封装器，没有多少额外功能。当使用 `LayerMask` 时，任何为\
  \ 1 的位代表一个可见的层，而任何为 0 的位代表一个被忽略的层。如果你只想针对特定层进行碰撞检测，或者如果你希望指定忽略某一个层，这将非常有用（例如，内置名为\
  \ Ignore 的第 2 层在所有射线检测测试中都被掩码掉了）。\n\nUnity 有八个“内置”层，所有的 `GameObjects` 最初都被放在第 0\
  \ 层，该层名为 Default。剩余的层（编号 8 到 31）被称为用户层（User Layers），给其中任意一层命名都将使其出现在任何弹出菜单中（例如每个\
  \ `GameObject` 顶部的弹出菜单）。\n\n由于层号从零开始，因此不掩码第 0 层的位 `LayerMask` 表示是 `LayerMask` 最右侧位的\
  \ 1（参见下方列表中的变量 `lmZero`）。这可能会引起困惑（因为该表示的整数值是 1 而不是 0），所以许多 Unity 开发者使用位移运算符（`<<`）来分配\
  \ `LayerMask` 值。例如，`1<<0` 生成值 1，即第 0 层，而 `1<<4` 在正确的位置生成 1，以掩码所有的第 4 层层。以下列表包含更多示例：点击此处查看代码\n\
  \n```\n1 LayerMask lmNone = 0; // 00000000000000000000000000000000 位运算\n2 LayerMask\
  \ lmAll = ~0; // 11111111111111111111111111111111 位运算\n3 LayerMask lmZero = 1; //\
  \ 00000000000000000000000000000001 位运算\n4 LayerMask lmOne = 2; // 00000000000000000000000000000010\
  \ 位运算\n5 LayerMask lmTwo = 1<<2; // 00000000000000000000000000000100 位运算\n6 LayerMask\
  \ lmThree = 1<<3; // 00000000000000000000000000001000 位运算\n8 LayerMask lmOneOrThree\
  \ = lmZero | lmTwo; // 5\n9 // 这创建了 00000000000000000000000000000101 位运算\n11 LayerMask\
  \ lmZeroThroughThree = lmZero | lmTwo | lmThree;\n12 // 这创建了 00000000000000000000000000001111\
  \ 位运算\n14 lmZero = 1 << LayerMask.NameToLayer(\"Default\"); // 6\n```\n\n1. 当所有位为\
  \ 0 时。\n2. 当所有位为 1 时。\n3. `1<<2`\n4. 左移。\n5. 位按或。\n6. `NameToLayer()`\n\n### 协程\
  \ (Coroutines)\n\n协程是 C# 的一种功能，允许方法在执行过程中暂停，允许其他方法执行，然后返回。它用于按特定计划执行的任务。\n\n####\
  \ Unity 示例\n\n在这个示例中，我们希望每秒打印一次时间。如果我们使用 `Update()` 方法打印时间，它每秒会打印几十次，太多了。\n\n创建一个新的\
  \ Unity 项目。创建一个名为 *Clock* 的 C# 脚本，将其挂到主相机上，并输入以下代码：\n\n```csharp\nusing UnityEngine;\n\
  using System.Collections;\n\npublic class Clock : MonoBehaviour\n{\n    // 用于初始化\n\
  \    void Start()\n    {\n        StartCoroutine(Tick());\n    }\n\n    // 所有协程的返回类型均为\
  \ IEnumerator\n    IEnumerator Tick()\n    {\n        // 这个无限 while 循环将保持打印，直到\n\
  \        // 协程停止或程序停止\n        while (true)\n        {\n            print(DateTime.Now.ToString());\n\
  \            // 这个 yield 语句告诉协程等待大约 1 秒\n            // 然后再继续。协程的时机并非完全精确。\n   \
  \         yield return new WaitForSeconds(1);\n        }\n    }\n}\n```\n\n有几种不同类型的\
  \ `yield` 语句：\n\n```csharp\nyield return null; // 尽快继续\nyield return new WaitForSeconds(10);\
  \ // 等待 10 秒\nyield return new WaitForEndOfFrame(); // 等到下一帧结束\nyield return new\
  \ WaitForFixedUpdate(); // 等到下一次固定物理更新\n```\n\n协程用在第 33 章 到第 35 章 的原型中。\n\n\n\n\n\
  \n`Enum`（枚举）是一种声明变量类型的简单方式，该类型只有几个特定的选项，并且在书中广泛使用。`Enums` 定义在类定义之外。\n\n点击此处查看代码图像\n\
  \n```csharp\npublic enum PetType\n{\n    none,\n    dog,\n    cat,\n    bird,\n\
  \    fish,\n    other\n}\n\npublic enum Gender\n{\n    unspecified,\n    female,\n\
  \    male\n}\n```\n\n稍后，可以使用枚举类型来声明类内部变量（例如下方代码列表中的 `public PetType`）。枚举的各种选项通过枚举类型、点运算符（.）和枚举选项来引用（例如\
  \ `PetType.dog`）：\n\n点击此处查看代码图像\n\n```csharp\npublic class Pet\n{\n    public string\
  \ name = \"Flash\";\n    public PetType pType = PetType.dog;\n    public Gender\
  \ gender = Gender.male;\n}\n```\n\n`Enums` 实际上是伪装成其他值的整数，因此它们可以转换为 `int`（如下方代码列表第\
  \ 7 行和第 8 行所示）。这意味着，如果没有显式设置，枚举将默认为第 0^(th 个选项。例如，使用前述的枚举 `Gender` 定义，声明一个新变量 `Gender\
  \ gen;` 将自动为 `gen` 分配默认值 `Gender.unspecified`。\n\n点击此处查看代码图像\n\n```csharp\n1 public\
  \ class Pet {\n2      public string name = \"Flash\";\n3      public PetType pType\
  \ = PetType.dog;\n4      public Gender gender = Gender.male;\n5\n6      void Awake()\
  \ {\n7          int i = (int) PetType.cat; // i 将等于 2              // 1\n8     \
  \     PetType pt = (PetType) 4;  // pt 将等于 PetType.fish  // 2\n      }\n10 }\n```\n\
  \n1. 第 7 行显示的 `(int)` 是一个显式类型转换，强制将 `PetType.cat` 解释为 `int`。这与 Unity 中 `Instantiate()`\
  \ 语句中使用的 `as GameObject` 关键字和类型类似，但显式类型转换更底层，可以用于 `ints` 等简单数据类型。（`as` 关键字只能用于类的实例。）\n\
  \n2. 在这里，整数字面量 `4` 通过代码 `(PetType)` 被显式类型转换为 `PetType`。\n\n`Enums` 经常被用于 `switch`\
  \ 语句（正如你在整本书中一直见到的那样）。\n\n## 函数委托 (Function Delegates)\n\n函数委托简单来说可以被看作是相似函数（或方法）的容器，这些函数可以同时被调用。`Delegates`\
  \ 可用于实现**策略模式**（strategy pattern），这是一种游戏开发开发者经常使用的软件设计模式，用于为同一个人工智能 (AI) 代理在遇到不同情况时定义要使用的不同策略。策略模式在附录的软件设计模式\
  \ 部分中有详细描述。\n\n使用函数委托的第一步是定义委托的类型。该类型为委托及其将包含的函数设置了参数和返回值。点击此处查看代码图像\n\n```csharp\n\
  public delegate float FloatOperationDelegate(float f0, float f1);\n```\n\n上一行创建了一个\
  \ `FloatOperationDelegate` 委托，它接受两个 `floats` 并返回单个 `float`。一旦设置了定义，你就可以定义符合此委托的目标方法：点击此处查看代码图像\n\
  \n```csharp\nusing UnityEngine;\nusing System.Collections;\n\npublic class DelegateExample\
  \ : MonoBehaviour {\n    // 创建名为 FloatOperationDelegate 的委托\n    // 这定义了目标函数的参数和返回类型\n\
  \    public delegate float FloatOperationDelegate(float f0, float f1);\n    // FloatAdd\
  \ 必须与 FloatOperationDelegate 具有相同的参数和返回类型\n    public float FloatAdd(float f0, float\
  \ f1) {\n        float result = f0 + f1;\n        print(\"The sum of \" + f0 + \"\
  \ & \" + f1 + \" is \" + result + \".\");\n        return result;\n    }\n    //\
  \ FloatMultiply 也必须与 FloatOperationDelegate 具有相同的参数和返回类型\n    public float FloatMultiply(float\
  \ f0, float f1) {\n        float result = f0 * f1;\n        print(\"The product\
  \ of \" + f0 + \" & \" + f1 + \" is \" + result + \".\");\n        return result;\n\
  \    }\n}\n```\n\n现在，可以创建一个 `FloatOperationDelegate` 类型的变量，并将任一目标函数赋值给它。然后，这个委托变量可以像函数一样调用（参见下方语法中的委托字段\
  \ `fod`）。点击此处查看代码图像\n\n```csharp\npublic class DelegateExample : MonoBehaviour {\n\
  \    public delegate float FloatOperationDelegate(float f0, float f1);\n```\n\n\
  `Delegates` 经常用于 `switch` 语句（正如你在整本书中一直见到的那样）。\n\n委托还可以**多路复**（multicast），这意味着可以为多个目标方法分配该委托。调用该委托时，会按照分配的顺序依次执行。如果委托的返回类型不是\
  \ `void`（如我们的示例所示），则最后一个调用的方法将返回结果。然而，如果在没有附加任何函数的情况下调用委托，将会抛出错误。通过先检查它是否为 `null`\
  \ 来避免这种情况。点击此处查看代码图像\n\n```csharp\nvoid Awake() {\n    // 将 FloatAdd 赋值给 fod\n \
  \   fod = FloatAdd;\n    // 将 FloatMultiply 添加到 fod，现在 fod 可以调用两个方法\n    fod +=\
  \ FloatMultiply;\n    // 在调用前先检查 fod 是否为空\n    if (fod != null) {\n        // 像函数一样调用\
  \ fod(3,4)\n        // 它会先调用 FloatAdd(3,4)，然后调用 FloatMultiply(3,4)\n        float\
  \ result = fod(3, 4);\n        // 结果将是 12，因为最后一个调用的方法返回结果\n        print(result);\n\
  \    }\n}\n```\n\n## 接口 (Interfaces)\n\n接口声明了将由类实现的这些方法和属性。任何实现接口的类都可以作为该接口类型进行引用，而不是其实际类类型。这与子类化有几点不同，最有趣的一点是类可以同时实现多个不同的接口，而类只能扩展一个父类。\n\
  \n### Unity 示例\n\n在 Unity 中创建一个新项目。在该项目中，创建一个名为 *Menagerie* 的 C# 脚本并输入以下代码：\n\n\
  点击此处查看代码图像\n\n```csharp\nusing UnityEngine;\nusing System.Collections;\nusing System.Collections.Generic;\n\
  \n// 两个枚举用于为类设置特定选项\npublic enum PetType\n{\n    none,\n    dog,\n    cat,\n   \
  \ bird,\n    fish,\n    other\n}\n\npublic enum Gender\n{\n    female,\n    male\n\
  }\n\n// Animal 接口声明了两个公共属性和两个公共方法\n// 所有 Animal 必须具备这些方法\npublic interface Animal\n\
  {\n    // 公共属性\n```\n\n\n\n\n\n```csharp\n    PetType pType { get; set; }\n\n  \
  \  Gender gender { get; set; }\n\n    // Public Methods\n\n    void Move();\n\n\
  \    string Speak();\n}\n\n// Fish 实现了接口 Animal\npublic class Fish : Animal {\n\
  \    private PetType _pType = PetType.fish;\n    private Gender _gender;\n    public\
  \ PetType pType {\n        get { return( _pType ); }\n        set { _pType = value;\
  \ }\n    }\n    public Gender gender {\n        get { return( _gender ); }\n   \
  \     set { _gender = value; }\n    }\n    public void Move() {\n        Debug.Log(\"\
  The fish swims around.\");\n    }\n    public string Speak() {\n        return(\"\
  ...!\");\n    }\n}\n\n// Mammal 是一个会被 Dog 和 Cat 扩展超类\npublic class Mammal {\n  \
  \  protected Gender _gender;\n    public Gender gender {\n        get { return(\
  \ _gender ); }\n        set { _gender = value; }\n    }\n}\n\n// Dog 是 Mammal 的子类并且实现了\
  \ Animal\n// 因为 Dog 是 Mammal 的子类，它继承了受保护字段 _gender\n// 以及公有属性 gender。如果 _gender\
  \ 是私有的，Dog 将\n// 无法继承它。\npublic class Dog : Mammal, Animal {\n    private PetType\
  \ _pType = PetType.dog;\n    public PetType pType {\n        get { return( _pType\
  \ ); }\n        set { _pType = value; }\n    }\n    public void Move() {\n     \
  \   Debug.Log(\"The dog walks around.\");\n    }\n    public string Speak() {\n\
  \        return(\"Bark!\");\n    }\n}\n\n// Cat 是 Mammal 的子类并且实现了 Animal\npublic\
  \ class Cat : Mammal, Animal {\n    private PetType _pType = PetType.cat;\n    public\
  \ PetType pType {\n        get { return( _pType ); }\n        set { _pType = value;\
  \ }\n    }\n    public void Move() {\n        Debug.Log(\"The cat stalks around.\"\
  );\n    }\n    public string Speak() {\n        return(\"Meow!\");\n    }\n}\n\n\
  // Menagerie 是 MonoBehaviour 的子类\npublic class Menagerie : MonoBehaviour {\n   \
  \ // 这个列表可以存放任何实现了 Animal 的类的实例\n    public List<Animal> animals;\n    void Awake()\
  \ {\n        animals = new List<Animal>();\n        Dog d = new Dog();\n       \
  \ d.gender = Gender.male;\n        // 当 d 被添加到 Animal 时，它是以 Animal 的身份添加的，而不是 Dog\n\
  \        animals.Add(d);\n        animals.Add(new Cat());\n        animals.Add(new\
  \ Fish());\n        // 在循环中，所有的 Animal 都被同样的方式对待，尽管\n        // 它们的工作方式不同\n    \
  \    for (int i=0; i<animals.Count; i++) {\n            animals[i].Move();\n   \
  \         print(\"Animal\"+i+\" says: \"\"+animals[i].Speak());\n            switch\
  \ (animals[i].gender) {\n                case Gender.female:\n                 \
  \   print(\"Animal\"+i+\" is female.\");\n                    break;\n         \
  \       case Gender.male:\n                    print(\"Animal\"+i+\" is male.\"\
  );\n                    break;\n            }\n        }\n    }\n}\n```\n\n正如代码所示，拥有\
  \ `Animal` 接口允许 `Cat`、`Dog` 和 `Fish` 类被以相同的方式处理并存储同一个 `List<Animal>` 中，尽管其中两个是 `Mammal`\
  \ 的子类，而另一个是没有继承任何内容的类。关于这如何在项目中使用使用的示例，请查看第 35 章，“原型 8：奥米茄法师”。\n\n#### 命名规范\n\n\
  命名规范最初在第 19 章“变量与组件”中介绍过，但它们非常重要，值得在这里重复。书中的代码遵循了管理变量、函数、类等命名的若干规则。虽然这些规则都不是强制性的，但遵循它们将使你的代码对尝试解读它的其他人更易读，对你自己也是如此（如果你在几个月后需要返回它并希望理解你写了什么）。每位编码员遵循的规则略有不同——我个人的规则多年来甚至发生了变化——但我在这里介绍的规则对我过的学生都非常有效，并且与我在\
  \ Unity 中遇到的大多数 C# 代码保持一致：\n\n1. 几乎所有情况都使用 `camelCase`。在由多个单词组成的变量名中，`camelCase`\
  \ 将每个单词的首字母大写（对于变量名，第一个单词除外）。\n2. 变量名应以小写字母开头（例如 `someVariableName`）。\n3. 函数名应以大写字母开头（例如\
  \ `Start()`、`FunctionName()`）。\n4. 类名应以大写字母开头（例如 `GameObject`、`ScopeExample`）。\n\
  5. 私有变量名可以以下划线开头（例如 `_hiddenVariable`）。\n6. 静态变量名可以是全大写并使用 `snake_case` 格式（例如 `NUM_INSTANCES`）。如你所见，`snake_case`\
  \ 通过中间下划线将多个单词组合在一起。\n\n#### 运算符优先级和运算顺序\n\n就像代数数一样，C# 中的某些运算符的优先级高于其他运算符。你可能熟悉的一个例子是\
  \ `*` 的优先级高于 `+`（例如，`1 + 2 * 3` 的结果是 `7`，因为 `2` 和 `3` 先被相乘）。\n\n#### 竞态条件\n\n与本节其他许多主题不同，竞态条件是你绝对*不希望*在代码中出现的情况。当你的代码需要某件事发生在另一件事之前，但这两件事可能以无顺序的方式发生时，就会产生竞态条件。在设计用于多处理器计算机、多线程操作系统或网络应用程序的代码时，竞态条件是一个严重的考虑因素，但也可以出现在我们编写的游戏中。\n\
  \n##### Unity 示例\n\n按照以下步骤操作：\n\n1. 创建名为 *RaceCondition* 的新 Unity 项目。创建一个名为 `SetValues`\
  \ 的 C# 脚本并输入代码：\n\n```csharp\nusing UnityEngine;\nusing System.Collections;\n\n\
  public class SetValues : MonoBehaviour {\n    static int[] VALUES;\n    void Start()\
  \ {\n        VALUES = new int[] { 0, 1, 2, 3, 4, 5 };\n    }\n}\n```\n\n2. 创建第二个名为\
  \ `ReadValues` 的脚本并输入以下代码：\n\n```csharp\nusing UnityEngine;\nusing System.Collections;\n\
  \npublic class ReadValues : MonoBehaviour {\n    void Start() {\n        print(SetValues.VALUES[2]);\n\
  \    }\n}\n```\n\n3. 在场景中创建两个立方体并命名为 *Cube0* 和 *Cube1*。将 `SetValues` 脚本附加到 *Cube0*，将\
  \ `ReadValues` 脚本附加到 *Cube1*。\n\n现在，当你尝试按照我们创建的方式运行场景时，你最可能会在控制面板中遇到错误消息。我说“最可能”，是因为竞态条件之所以困难的原因之一是它们发生何种方式是不可预测的。如果你没有遇到错误，请尝试将\
  \ `SetValues` 移动到 *Cube1* 并 `ReadValues` 移动到 *Cube0*。即使你没有看到错误，也请继续阅读。\n\n**NullReferenceException:**\
  \ Object reference not set to an instance of an object `ReadValues.Start () (at\
  \ Assets/ReadValues.cs:7)\n\n\n\n\n\n## 4. 让我们使用调试器来更多地了解错误产生。在 `ReadValues.cs`\
  \ 的 `print` 行旁边添加一个断点，并将调试器附加到 Unity。如果你需要复习调试器相关知识，请阅读第 24 章中的“调试”。\n\n## 5. 当你在附加调试器的情况下运行项目（在\
  \ Unity 中）时，它会在执行该行之前立即冻结在断点处。我们知道这一行出了问题，作为一个 `NullReferenceException`（空引用异常），我们知道正在尝试访问某个尚未定义的变量。让我们查看每个变量看看发生了什么。在\
  \ MonoDevelop 中打开监视（Watch）面板（从菜单栏选择 `View > Debug Windows > Watch`；其旁边应该已经有一个勾选，再次选择它会将监视窗口带到前台）。这一行使用的唯一变量是\
  \ `SetValues.VALUES`，因此在监视窗口的一行输入 `SetValues.VALUES`，你就能看到它的值。正如我们预期的那样，`VALUES`\
  \ 没有被定义；也就是说，它目前是空的。但我们知道 `VALUES` 应该在 `SetValues.Start()` 中定义。你可以在上方几行看到执行该操作的代码。`VALUES`\
  \ 不可能定义的唯一方法就是 `SetValues.Start()` 还没有运行，而这恰恰发生了。\n\n这是一个竞态条件（race condition）。`SetValues.Start()`\
  \ 定义了 `SetValues.VALUES`，但 `ReadValues.Start()` 可能在它被设置之前尝试使用该字段。我们知道在每个 GameObject\
  \ 接收到第一次 `Update()` 之前会在其上调用 `Start()`，但并不清楚各种对象的调用顺序。我推测这可能是按照对象被添加到层级面板（Hierarchy）的顺序发生的，但我并不确定。事实上，我甚至不确定你是否遇到了与我相同的错误，因为你的\
  \ `Start()` 方法的调用顺序可能与我的不同。\n\n这就是竞态条件的主要问题所在。两个 `Start()` 函数正在相互竞争。如果其中一个先被调用，你的代码就能正常工作；但当另一个先被调用时，一切都会崩溃。无论你的代码恰恰好运行，这都是一个你需要解决的问题。\n\
  \n这就是为什么 `MonoBehaviour` 中的 `Awake()` 和 `Start()` 方法之间存在差异的原因之一。`Awake()` 在 GameObject\
  \ 时立即被调用，而 `Start()` 在 GameObject 接收到第一次 `Update()` 之前立即被调用。这可能是几毫秒的差异，但对于计算机程序来说这是一个非常长的时间。即使你的层级面板中有多个对象，你也可以保证在调用任何对象的\
  \ `Start()` 之前，会对所有对象调用 `Awake()`。只要两个对象在同一帧中被添加到场景（或从一开始作为 `Cube0` 和 `Cube1` 那样存在），`Awake()`\
  \ 始终会在 `Start()` 之前发生。\n\n了解这一点后，回原始错误。错误的发生是因为两个 `Start()` 函数之间的竞争。要修复此，请将需要先执行的移动到\
  \ `Awake()` 方法中。按照下面的代码列表替换 `SetValues` 脚本的第 7 行。在更改 `SetValues` 代码之前，你需要点击 MonoDevelop\
  \ 调试器中的停止按钮（或从 MonoDevelop 菜单栏选择 `Run > Stop`），并并在 Unity 中停止播放：\n\n点击此处查看代码图像\n\n\
  ```csharp\n1 using UnityEngine;\n2 using System.Collections;\n3\n4 public class\
  \ SetValues : MonoBehaviour {\n5     static public int[]        VALUES;\n6\n7  \
  \   void Awake() {\n8         VALUES = new int[] { 0, 1, 2, 3, 4, 5 };\n9     }\n\
  10\n11 }\n```\n\n现在，`SetValues.Awake()` 方法一定会在 `ReadValues.Start()` 方法之前被调用，竞态条件解决了。\n\
  \n### 递归函数\n\n设计用于反复调用自身的函数被称为递归函数。其中一个简单的例子是计算数字的阶乘。\n\n在数学中，`5!`（5 的阶乘）是该数与其下方所有其他自然数的乘积：\n\
  `5! = 5 * 4 * 3 * 2 * 1 = 120`\n\n`0!=1` 是一个特殊情况，对于我们的目的来说，负数的阶乘将为 0：\n`0! = 1`\n\
  \n我们可以写一个递归函数来计算任何整数的阶乘：\n\n点击此处查看代码图像\n\n```csharp\n1 void Awake() {\n2     print(\
  \ fac(-1) );  // 打印 0\n3     print( fac(0) );   // 打印 1\n4     print( fac(5) );\
  \   // 打印 120\n5 }\n6\n7 int fac(int n) {\n8     if (n < 0) { // 这防止了 n<0 时发生崩溃\n\
  9         return (0);\n9     }\n10    if (n == 0) { // 这是“终止情况”\n11        return\
  \ (1);\n12    }\n13    int result = n * fac(n-1);\n14    return (result);\n15 }\n\
  ```\n\n当在前面的代码调用 `fac(5)` 时，且代码到达第 14 行，`fac()` 再次对 `n-1`（现在是 4）进行调用。这个过程继续再次调用四次\
  \ `fac()`，直到到达 `fac(0)` 处的终止情况，然后开始返回值。递归链的解析如下：\n\n点击此处查看代码图像\n`fac(5)`\n`5 * fac(4)`\n\
  `5 * 4 * fac(3)`\n`5 * 4 * 3 * fac(2)`\n`5 * 4 * 3 * 2 * fac(1)`\n`5 * 4 * 3 * 2\
  \ * 1 * fac(0)`\n`5 * 4 * 3 * 2 * 1 * 1 = 120`\n\n要真正理解递归函数中发生了什么，最好的方法是在第 14 行设置断点，连接调试器到\
  \ Unity，并使用“步入”（Step In）观察递归的发生。（如果你需要复习调试器知识，请阅读第 24 章。）\n\n#### 用于贝曲线的递归函数\n\n\
  递归函数的绝佳例子是贝曲线插值静态方法（名为 `Bezier`），它包含在 `ProtoTools` 类中，作为第 31 章到第 35 章导入的一部分。该函数可以插值由任意数量点组成的贝曲线上的位置。`Bezier`\
  \ 函数的代码列在本附录的“插值”部分。\n\n## 软件设计模式\n\n1994 年，“四人”（Erich Gamma, Richard Helm, Ralph\
  \ Johnson 和 John Vissides）出版了《面向对象软件的设计模式》一书，书中描述了软件开发中用于创建有效、可重用代码的各种模式。本书使用了其中两种模式，并引用了第三种。\n\
  \n(1) Erich Gamma, Richard Helm, Ralph Johnson, and John Vissides, *面向面向对象软件的设计模式*\
  \ (Reading, MA: Addison-Wesley, 1994)。工厂模式是书中描述的模式之一。其他还包括单例模式，它被用于本书中的许多教程。\n\n\
  ### 单例模式\n\n单例模式是本书中最常用的模式，可以在第 26 章、第 27 章以及第 29 章到第 35 章中找到。如果你知道某个类在游戏中只会有一个实例，你可以为该类创建一个*单例*（singleton），它是该类的一个静态变量，可以在代码的任何地方引用它。下面的代码列表显示了一个示例：\n\
  \n点击此处查看代码图像\n\n```csharp\n1 public class Hero : MonoBehaviour {\n2     static public\
  \ Hero S;      // 1\n3\n4     void Awake() {\n5         S = this;             //\
  \ 2\n6     }\n7 }\n\n1 public class Enemy {\n2\n```\n\n\n\n\n\n```cs\nvoid Update()\
  \ {\n    public Vector3 heroLoc = Hero.S.transform.position; // 3\n}\n```\n\n1.\
  \ 静态公共字段 `S` 是英雄的单例。我个人习惯将我所有的单例都命名为 `S`。\n2. 因为 `Hero` 类只会有一个实例，因此它在实例创建的 `Awake()`\
  \ 方法中被赋值给 `S`。\n3. 因为 `S` 既是公共的又是静态的，因此可以通过类名 `Hero.S` 在代码的任何地方引用它。\n\n### 工厂模式\n\
  \n工厂模式在第 35 章 中被使用和描述。简而言之，工厂模式使用一个接口来定义一组相似类，然后创建一个*工厂*函数，该函数可以根据传入的参数返回这些对象中的一个。在《奥米茄法师》（Omega\
  \ Mage）中，这被用于在关卡中放置的不同敌人类型之间进行选择。这些敌人是非常不同的类，但它们都实现了相同的 `Enemy` 接口，因此工厂可以返回其中任何一个。要了解更多关于接口的知识，请参见本文附录中的“接口”部分。要查看工厂模式如何在项目中使用，请查看第\
  \ 35 章。\n\n### 策略模式\n\n正如本文附录中的“函数委托”部分提到的，策略模式经常用于 AI 以及其他领域，在这些领域中，你可能根据条件更改行为，但仍调用单个函数委托。在策略模式中，为类可以执行的某种类型的操作创建一个函数委托（例如在战斗中采取行动），并为该委托的实例赋值并根据情况进行调用。这避免了代码中复杂的\
  \ `switch` 语句，因为可以在单行中调用委托：\n\n点击此处查看代码图片\n\n```cs\nusing UnityEngine;\nusing System.Collections;\n\
  \npublic class Strategy : MonoBehaviour {\n    public delegate void ActionDelegate();\
  \ // 1\n\n    public ActionDelegate act; // 2\n\n    public void Attack() {} //\
  \ 3\n        // 攻击代码将放在这里\n    }\n\n    public void Wait() { ... }\n    public void\
  \ Flee() { ... }\n\n    void Awake() {\n        act = Wait; // 4\n    }\n\n    void\
  \ Update() {\n        Vector3 hPos = Hero.S.transform.position;\n        if (hPos\
  \ - transform.position).magnitude < 10 ) {\n            act = Attack; // 5\n   \
  \     }\n        if (act != null) act(); // 6\n    }\n}\n```\n\n1. 定义了 `ActionDelegate`\
  \ 委托类型。它没有参数且返回类型为 `void`。\n2. `act` 被创建为 `ActionDelegate` 的一个实例。\n3. 这里的 `Attack()`\
  \ 和 `Flee()` 函数是为了展示各种动作将如何匹配 `ActionDelegate` 委托的参数和返回类型进行定义。\n4. 该代理的初始策略是 `Wait`。\n\
  5. 如果英雄进入该代理的 100 米范围内，它将通过替换 `act` 委托的目标方法将其策略切换为 `Attack`。\n6. 无论选择哪种策略，都会调用 `act()`\
  \ 来执行它。在调用之前检查 `act != null` 是很有用的，因为调用空委托（即尚未分配目标的的委托）会导致运行时错误。\n\n### 变量作用域\n\n\
  变量的*作用域*是任何编程语言中的重要概念。变量的作用域是指代码中有多少部分感知到了该变量的存在。全局作用域`意味着任何代码都可以看到并引用该变量，而`局部作用域`意味着变量的作用域在某种程度上受到了限制，无法被代码的所有部分看到。如果一个变量是类的局部的，那么类中的其他内容可以看到它。如果一个变量是函数的局部的，那么它只存在于该函数内部并在函数完成后被销毁。\n\
  \n以下代码演示了单个类内变量的多个级作用域。代码后的数字注释解释了重要行上发生了什么。\n\n点击此处查看代码图片\n\n```cs\nusing UnityEngine;\n\
  using System.Collections;\n\npublic class ScopeExample : MonoBehaviour {\n    //\
  \ 公共字段（公共类变量）\n    public bool trueFalse = false; // 1\n    public int graduationAge\
  \ = 18;\n    public float goldenRatio = 1.618f;\n\n    // 私有字段（私有类变量）\n    private\
  \ bool _hiddenVariable = false; // 2\n    private float _anotherHiddenVariable =\
  \ 0.5f;\n\n    // 保护字段（受保护类变量）\n    protected int partiallyHiddenInt = 1; // 3\n\
  \    protected float anotherVariable = 1.0f; // 静态字段（静态类变量）\n    static int NUM_INSTANCES\
  \ = 0; // 4\n    static int NUM_TOO = 0; // 5\n\n    void Awake() {\n        trueFalse\
  \ = true; // 6: 给 trueFalse 赋值为 \"true\"\n        print(trueFalse); // 打印 \"true\"\
  \n        int ageTenthReunion = graduationAge + 10; // 7\n        print(_anotherHiddenVariable);\
  \ // 8\n        NUM_INSTANCES += 1; // 9\n        NUM_TOO++; // 10\n    }\n\n  \
  \  void Update() {\n        print(ageTenthReunion); //  // 11\n        float ratioed\
  \ = 1f; // 可以\n        for (int i=0; i<10; i++) { // 可以 // 12\n            ratioed\
  \ *= goldenRatio; // 可以\n        }\n        print(ratioed); // 可以\n        print(i);\
  \ // 错误\n    }\n}\n\npublic class SubScopeExample : ScopeExample {\n    void Start()\
  \ {\n        print(trueFalse);\n        print(partiallyHiddenInt);\n        print(_hiddenVariable);\
  \ // 错误\n        print(NUM_INSTANCES); // 可以\n        print(NUM_TOO); // 错误\n  \
  \  }\n}\n```\n\n\n\n\n\n### 3. 受保护字段\n被标记为 protected（受保护）的字段介于公共和私有之间。`SubScopeExample`\
  \ 子类确实有一个受保护字段 `partiallyHiddenInt`。然而，一个带有变量 `ScopeExample se` 的函数无法看到或访问字段 `se.partiallyHiddenVariable`。\n\
  \n### 4. 静态字段\n静态字段是类本身的字段，而不是类的实例。这意味着 `NUM_INSTANCES` 是通过 `ScopeExample.NUM_INSTANCES`\
  \ 访问的。这是我在 C# 中使用的的最接近全局作用域的东西。我代码中的任何脚本都可以访问 `ScopeExample.NUM_INSTANCES`，并且 `NUM_INSTANCES`\
  \ 对于所有 `ScopeExample` 实例都是相同的。带有变量 `ScopeExample se` 的函数无法访问 `se.NUM_INSTANCES`，但可以访问\
  \ `ScopeExample.NUM_INSTANCES`。`ScopeExample` 的子类 `SubScopeExample` 也可以访问 `NUM_INSTANCES`。\n\
  \n### 5. `NUM_TOO` 是私有静态类变量，这意味着所有的 `ScopeExample` 实例共享相同的 `NUM_TOO` 值，但其他类都无法看到或访问它。子类\
  \ `SubScopeExample` 无法访问 `NUM_TOO`。\n\n### 6. `// Works` 注释意味着这一行执行时没有任何错误。`trueOrFalse`\
  \ 是 `ScopeExample` 的公共字段，因此 `ScopeExample` 的此方法可以访问它。\n\n### 7. 这一行声明并定义了一个名为 `ageAtTenthReunion`\
  \ 的变量，它的作用域局限于 `Start()` 方法。这意味着一旦 `Start()` 函数执行完毕，变量 `ageAtTenthReunion` 将不再存在。此外，此函数之外的任何地方无法看到或访问\
  \ `ageAtTenthReunion`。\n\n### 8. 作为私有字段，`_anotherHiddenVariable` 只能被此类实例内部的方法可见。\n\
  \n### 9. 在类内部，静态公共字段可以通过它们的名称引用，这意味着 `Start()` 方法可以引用 `NUM_INSTANCES`，而不需要在前面加上类名。\n\
  \n### 10. `NUM_TOO` 可以在 `ScopeExample` 类中的任何地方被访问。\n\n### 11. 这一行抛出了错误，因为 `ageAtTenthReunion`\
  \ 是 `Start()` 方法的局部变量，所以它在 `Update()` 中没有意义。\n\n### 12. 在此 `for` 循环中声明并定义的变量 `i`\
  \ 作用域局限于该 `for` 循环。这意味着当 `for` 循环完成后，`i` 将失去意义。\n\n### 13. 这一行抛出了错误，因为 `i` 在之前的\
  \ `for` 循环之外没有意义。\n\n### 14. 这一行声明并定义 `SubScopeExample` 为 `ScopeExample` 的子类。作为子类，`SubScopeExample`\
  \ 可以访问 `ScopeExample` 的公共和受保护字段，但无法访问私有字段。由于 `SubScopeExample` 没有定义自己的 `Awake()`\
  \ 或 `Update()` 函数，它将运行其基类 `ScopeExample` 中定义版本。\n\n### 15. `trueOrFalse` 是公共的，所以\
  \ `SubStaticField` 继承了一个 `trueOrFalse` 字段。此外，由于在 `SubScopeExample` 上调用 `Start()`\
  \ 之前，基类（`ScopeExample`）的 `Awake()` 版本已经运行，因此 `trueOrFalse` 已经被 `Awake()` 方法设置为 `\"\
  true\"`。\n\n### 16. `SubScopeExample` 还有一个从 `ScopeExample` 继承的受保护字段 `partiallyHiddenInt`。\n\
  \n### 17. `_hiddenVariable` 没有从 `ScopeExample` 继承，因为它是私有的。\n\n### 18. `NUM_INSTANCES`\
  \ 可以被 `SubScopeExample` 访问，因为它作为一个公共变量，是继承自基类 `ScopeExample`。此外，这两个类共享相同的 `NUM_INSTANCES`\
  \ 值，所以如果每个类都实例化一个实例，无论是从 `ScopeExample` 还是 `SubScopeExample` 访问，`NUM_INSTANCES`\
  \ 都将是 `2`。\n\n### 19. 作为私有静态变量，`NUM_TOO` 没有被 `SubScopeExample` 继承。但值得注意的是，尽管 `NUM_TOO`\
  \ 没有被继承，当 `SubScopeExample` 实例化并运行基类版本的 `Awake()` 时，`Awake()` 方法可以无错误地访问 `NUM_TOO`，因为基类版本是在\
  \ `ScopeExample` 类的作用域内运行的，尽管它实际上是在 `SubScopeExample` 的实例上运行。\n\n这 19 条笔记包含了变量作用域的非常简单和非常复杂的示例。如果你对其中某些内容不理解，没关系。当你以后更多地使用\
  \ C# 并有了更具体的作用域问题时，可以再回来阅读。\n\n#### XML\n\nXML（可扩展标记语言）是一种设计为既灵活又易于人类阅读的文件格式。以下是来自第\
  \ 31 章“原型 4：探险者纸牌”的某些 XML 示例。为了提高可读性，添加了一些空格，但这是没问题的，因为 XML 通常会将任何数量的空格或换行符视为单个空格。\n\
  \n```xml\n<xml>\n    <!-- 装饰符是每张牌角的花色和点数 -->\n    <decorator type=\"letter\" x=\"\
  -1.05\" y=\"1.42\" z=\"1.42\" />\n</xml>\n```\n\n### 正弦和余弦 (Sin and Cos)\n\n正弦和余弦函数是将角度值\
  \ Θ（theta）转换为沿范围为 -1 到 1 的波形点点的函数。它们在图 B.1 中显示。\n\n![Image](img/00271.jpeg)\n\n\n\
  \n\n# 图 B.1 正弦和余弦的传统表示\n\n但正弦和余弦不仅仅是波形；它们描述了在圆周上移动时 `x` 和 `y` 之间的关系。我将通过一些代码来演示我的意思。\n\
  \n## Unity 示例\n\n按照以下步骤操作：\n\n1. 打开 Unity 并创建一个新场景。在场景中创建一个球体（`GameObject > Create\
  \ Other > Sphere`）。将 `Sphere` 的变换（transform）设置为 `P:[0,0,0]`、`R:[0,0,0]`、`S:[0.1,\
  \ 0.1, 0.1]`。为 `Sphere` 添加一个 `TrailRenderer`。（在层级（Hierarchy）中选择 `Sphere`，从菜单栏中选择\
  \ `Component > Effects > Trail Renderer`。）\n\n2. 打开 `Sphere:TrailRenderer` 检查器中\
  \ `Materials` 旁边的折叠三角形，点击 `Element 0` 右侧的圆圈，选择 `Default-Particle` 为 `TrailRenderer`\
  \ 的纹理。同样设置 `Time` = 1，`StartWidth` = 0.1，且 `EndWidth` = 0.1。\n\n3. 创建一个名为 `Cyclic`\
  \ 的新 C# 脚本。将其挂载到层级中的 `Sphere` 上。然后在 MonoDevelop 中打开 `Cyclic` 脚本，并输入以下代码：\n\n点击此处查看代码图片\n\
  \n```csharp\nusing UnityEngine;\n\nusing System.Collections;\n\npublic class Cyclic\
  \ : MonoBehaviour {\n\n    public float theta = 0;\n    public bool showCosX = false;\n\
  \    public bool showSinY = false;\n    public bool ________________;\n    public\
  \ Vector3 pos;\n    public Color[] colors;\n\n    void Awake() {\n        // 定义一些要使用的颜色\n\
  \        colors = new Color[] {\n            new Color(1f,   0f,   0.0f),\n    \
  \        new Color(1f,   0.5f, 0.0f),\n            new Color(1f,   1f,   0.0f),\n\
  \            new Color(0.5f, 1f,   0.0f),\n            new Color(0f,   1f,   0.0f),\n\
  \            new Color(0f,   1f,   0.5f),\n            new Color(0f,   1f,   1.0f),\n\
  \            new Color(0f,   0.5f, 1.0f),\n            new Color(0f,   0f,   1.0f),\n\
  \            new Color(0.5f, 0f,   1.0f),\n            new Color(1f,   0f,   1.0f),\n\
  \            new Color(1f,   0f,   0.5f),\n            new Color(1f,   0f,   0.0f)\n\
  \        };\n    }\n\n    void Update () {\n        // 根据时间计算弧度\n        float radians\
  \ = Time.time * Mathf.PI;\n        // 将弧度转换为角度以便检查器中显示\n        // \"% 360\" 将值限制在\
  \ 0-359.999 的范围内\n        theta = Mathf.Round( radians * Mathf.Rad2Deg ) % 360;\n\
  \        // 重置 pos\n        pos = Vector3.zero;\n        // 根据 cos 和 sin 计算 x &\
  \ y\n        pos.x = Mathf.Cos(radians);\n        pos.y = Mathf.Sin(radians);\n\
  \        // 如果检查器中勾选了，则使用 sin 和 cos\n        Vector3 tPos = Vector3.zero;\n    \
  \    if (showCosX) tPos.x = pos.x;\n        if (showSinY) tPos.y = pos.y;\n    \
  \    // 设置此游戏对象（球体）的位置\n        transform.position = tPos;\n    }\n\n    void OnDrawGizmos()\
  \ {\n        if (!Application.isPlaying) return;\n        // 根据我们在圆中的位置选择颜色\n  \
  \      float cIndexFloat = (theta/180f)%1f * (colors.Length-1);\n        int cIndex\
  \ = Mathf.FloorToInt(cIndexFloat);\n        float cU = cIndexFloat % 1.0f; // 只获取小数部分\n\
  \        Gizmos.color = Color.Lerp( colors[cIndex], colors[cIndex+1], cU );\n  \
  \      // 使用 Gizmos 显示单独的 Sin 和 Cos\n        Vector3 cosPos = new Vector3(pos.x,\
  \ -1f-(theta/360f), 0);\n        Gizmos.DrawSphere(cosPos, 0.05f);\n        if (showCosX)\
  \ Gizmos.DrawLine(cosPos, transform.position);\n        Vector3 sinPos = new Vector3(1f+(theta/360f),\
  \ pos.y, 0);\n        Gizmos.DrawSphere(sinPos, 0.05f);\n        if (showSinY) Gizmos.DrawLine(sinPos,\
  \ transform.position);\n    }\n}\n```\n\n4. 在按下 Play 之前，点击 Scene 面格顶部的 `2D` 按钮将\
  \ Scene 面格设置为 2D 模式。按下 Play，你会看到球体没有移动，但在下方和右侧有彩色的圆。（你可能需要缩小视图。）右侧的圆遵循 `Mathf.Sin(theta)`\
  \ 定义的波形，下方的圆遵循 `Mathf.Cos(theta)`。\n\n如果你勾选了这些项，在检查器中...\n\n[content]\n（注：原文最后部分似乎不完整，已根据指令要求翻译提供的文本部分）\n\
  \n\n\n\n```csharp\nfloat heightMult = 1f/maxRolls;\n\nfloat widthMult = 1f/(maxVal-minVal);\n\
  \nGizmos.color = Color.white;\n\nVector3 v0, v1 = Vector3.zero;\nfor (int i=numDice;\
  \ i<=maxVal; i++) {\n    v0 = v1;\n    v1.x = ((float) i - numDice) * width * widthMult;\n\
  \    v1.y = ((float) rolls[i]) * height * heightMult;\n    if (i != numDice) {\n\
  \        Gizmos.DrawLine(v0,v1);\n    }\n}\n\npublic IEnumerator CalculateRolls()\
  \ {\n    // 计算最大值（骰子可能掷出的最大值）\n    // （例如，对于 2d6 来说，maxValue 为 12）\n    int maxValue\
  \ = numDice*numSides;\n    // 使数组足够大，以容纳所有可能的值\n    rolls = new int[maxValue+1];\n\
  \    // 创建一个每个骰子对应一个元素的数组。除了第一个骰子设为 0 外，\n    // 所有的都预设为 1（为了让 RecursivelyAddOne()\
  \ 方法正常工作）\n    dice = new int[numDice];\n    for (int i=0; i<numDice; i++) {\n \
  \       dice[i] = (i==0) ? 0 : 1;\n    }\n    // 遍历骰子。\n    int iterations = 0;\n\
  \    int sum = 0;\n    // 通常情况下，我会避免使用 while 循环，因为它们会导致死循环，\n    // 但由于这是一个在 while\
  \ 循环中带有 yield 的协程，\n    // 所以这个问题不是大问题。\n    while (sum != maxValue) {\n       \
  \ // ^ 当所有骰子都处于最大值时，sum 将等于 maxValue\n        // 增加数组中索引为 0 的骰子\n        RecursivelyAddOne(0);\n\
  \        // 将骰子相加\n        sum = SumDice();\n        // 在数组的该位置加 1\n        rolls[sum]++;\n\
  \        // 增加迭代次数并 yield\n        iterations++;\n        if (iterations % maxIterations\
  \ == 0) {\n            yield return null;\n        }\n    }\n    print(\"Calculation\
  \ Done\");\n    string s = \"\";\n    for (int i=numDice; i<=maxValue; i++) {\n\
  \        s += i.ToString()+\"\\t\"+rolls[i]+\"\\n\";\n    }\n    int totalRolls\
  \ = 0;\n    foreach (int i in rolls) {\n        totalRolls += i;\n    }\n    s +=\
  \ \"\\nTotal Rolls: \"+totalRolls+\"\\n\";\n    print(s);\n}\n\n// 这是一个递归方法，意味着它调用自己。你稍后在本附录中可以读关于递归方法的知识。\n\
  public void RecursivelyAddOne(int ndx) {\n    if (ndx == dice.Length) return; //\
  \ 我们超过了 dice 数组的长度\n    // 数组，所以直接返回\n    // 增加位置 ndx 处的骰子\n    dice[ndx]++;\n \
  \   // 如果这超过了骰子的容量...\n    if (dice[ndx] > numSides) {\n        dice[ndx] = 1; //\
  \ 则将此骰子设为 1...\n        RecursivelyAddOne(ndx+1); // 并增加下一个骰子\n    }\n    return;\n\
  }\n\npublic int SumDice() {\n    // 求和 dice 数组中所有骰子的值\n    int sum = 0;\n    for\
  \ (int i=0; i<dice.Length; i++) {\n        sum += dice[i];\n    }\n    return(sum);\n\
  }\n```\n\n**2.** 要使用 `DiceProbability` 枚举器，请点击 Play，然后在 Hierarchy（层级）面板中选择 `Main\
  \ Camera`。在 `Main Camera:Dice Probability (Script)` 的 Inspector（检检器）面板中，你可以设置 `numDice`（骰子数量）和\
  \ `numSides`（每个骰子的面数），然后点击 `checkCalculate` 来计算这些骰子上掷出任何特定数字的概率。Unity 将列出所有可能的结果并将结果输出到\
  \ Console（控制台）。先尝试 2 个 6 面的骰子（`2d6`），你将在控制台中得到这些结果（你必须选中控制台才能看到前两行以外的内容）：\n\n```\n\
  2    1\n3    2\n4    3\n5    4\n6    5\nTotal Rolls: 36\nUnityEngine.MonoBehaviour:print(Object)\n\
  <CalculateRolls>__Iterator:MoveNext() (at DiceProbability.cs:34)\n```\n\n**3.**\
  \ 接下来，尝试 `8d6`。你会发现这计算需要更长的时间，而且结果（以及曲线图）会在每次协程 yield 时逐渐更新（参见本附录中的协程部分）。现在，每当你想知道诸如在\
  \ `8d6` 上掷出 13 之类的概率时，你可以通过枚举来计算。（它是 `792/1679616 = 11/23328 ≈0.00047 ≈0.05%`）。此外，这段代码可以进行调整，每次选择随机掷骰，并给你一个实际的概率，而不是目前产生的理论概率。\n\
  \n### 点积 (Dot Product)\n\n另一个非常有用的数学概念是点积。两个向量的点积是将每个向量相应的 `x`、`y` 和 `z` 分量相乘，并将结果相加，如下所示：\n\
  \n```csharp\nVector3 a = new Vector3(1, 2, 3);\nVector3 b = new Vector3(4, 5, 6);\n\
  float dotProduct = a.x*b.x + a.y*b.y + a.z*b.z; // 1\n// dotProduct = 4 + 10 + 18\n\
  // dotProduct = 32\ndotProduct = Vector3.Dot(a,b); // 这是这种方法 2\n```\n\n**1.** 第\
  \ 3 行手动计算 `a` 和 `b` 的点积。\n**2.** 第 7 行使用内置静态方法 `Vector3.Dot()` 执行相同的计算。\n\n起初，这似乎并不重要，但它有另一个非常有用的属性：点积返回的浮点数等同于\
  \ `a.magnitude * b.magnitude * Cos(Θ)`，其中 `Θ` 是两个向量之间的角度，如图 B.3 所示。\n\n![Image](img/0273.jpeg)\n\
  \n图 B.3 点积示例（数字为近似值）。图中 • 表示点积操作。\n\n正如图 B.3 所示，这可以判断敌人是否正面对玩家角色（这在潜行游戏中很有用）。还有几个地方可以使用它，它在计算机图形编程中非常常见。在\
  \ *Omega Mage* 中，它被用于 `EnemySpiker.OnTriggerEnter()` 来判断 `EnemySpiker` 是靠近还是远离碰撞到的触发器。\n\
  \n### 插值 (Interpolation)\n\n*插值*指的是任何两个值之间的数学混合。当我大学毕业后担任合同程序员时，我觉得我获得许多工作机会的主要原因之一是我代码中元素的运动看起来非常平滑且流畅（使用\
  \ Kyle Gabler 的术语）。这是通过使用各种形式的插值、缓冲和贝塞尔曲线实现的，这些将在本节中介绍。\n\n#### 线性插值 (Linear Interpolation)\n\
  \n*线性插值*是一种通过声明位于两个现有值之间来数学定义新值或位置的方法。所有的线性插值都遵循相同的公式：\n\n`p01 = (1-u) * p0 + u\
  \ * p1`\n\n在代码中，它看起来像：\n\n```csharp\nVector3 p0 = new Vector3(0,0,0);\nVector3 p1\
  \ = new Vector3(1,1,0);\nfloat u = 0.5f;\nVector3 p01 = (1-u) * p0 + u * p1;\nprint(p01);\
  \ // 打印: (0.5, 0.5, 0) p0 和 p1 之间的中间点\n```\n\n\n\n\n\n# 基于时间的线性插值\n\n在基于时间的线性插值中，你可以保证插值将在特定的时间内完成，因为\
  \ `u` 值是根据已通过的时间除以插值所需的总时长来计算的。\n\n## Unity 示例\n\n要创建一个 Unity 示例，请执行以下操作：\n\n1.\
  \ 启动一个名为 `Interpolation Project` 的新 Unity 项目。在 Hierarchy 中创建一个立方体（`GameObject >\
  \ Create Other > Cube`）。在 Hierarchy 面板中选择 `Cube` 并为其挂载一个 `TrailRenderer`（`Components\
  \ > Effects > Trail Renderer`）。打开 `TrailRenderer` 的 `Materials` 数组，并将 `Element 0`\
  \ 设置为内置材质 `Default-Particle`。（点击 `Element 0` 右侧的圆形，你将在可用材质列表中看到 `Default-Particle`。）\n\
  \n2. 在 Project 面板中创建一个名为 `Interpolator` 的新 C# 脚本。将其挂载到 `Cube` 上，然后在 MonoDevelop\
  \ 中打开它输入此代码：\n\n点击此处查看代码图片\n\n```csharp\nusing UnityEngine;\nusing System.Collections;\n\
  \npublic class Interpolator : MonoBehaviour {\n    public Vector3 p0 = new Vector3(0,0,0);\n\
  \    public Vector3 p1 = new Vector3(3,4,5);\n    public float timeDuration = 1;\n\
  \    // 将 checkToCalculate 设置为 true 以开始移动\n    public bool checkToCalculate = false;\n\
  \    public bool ________________;\n    public Vector3 p01;\n    public bool moving\
  \ = false;\n    public float timeStart;\n    // Update 每帧被调用一次\n    void Update\
  \ () {\n        if (checkToCalculate) {\n            checkToCalculate = false;\n\
  \            moving = true;\n            timeStart = Time.time;\n        }\n   \
  \     if (moving) {\n            float u = (Time.time-timeStart)/timeDuration;\n\
  \            if (u>=1) {\n                u=1;\n                moving = false;\n\
  \            }\n            // 这是标准的线性插值函数\n            p01 = (1-u)*p0 + u*p1;\n\
  \            transform.position = p01;\n        }\n    }\n}\n```\n\n3. 返回 Unity\
  \ 并按下 Play。在 `Cube:Interpolator (Script)` 组件中，勾选 `checkToCalculate` 旁边的框，`Cube`\
  \ 将在 1 秒内从 `p0` 移动到 `p1`。如果你将 `timeDuration` 为另一个值并再次勾选 `checkToCalculate`，你会发现\
  \ `Cube` 总会在 `timeDuration` 秒内从 `p0` 移动到 `p1`。你还可以在 `Cube` 移动时更改 `p0` 或 `p1` 的位置，它会相应更新。\n\
  \n## 使用芝诺悖论的线性插值\n\n埃利亚的芝诺（约公元前 490–430 年）是一位希腊哲学家，他提出了一系列悖论，这些悖论都与日常常运动在哲学上的不可能性有关。\n\
  \n在芝诺的二分法悖论中，问题是：运动物体是否可以到达静态点。想象一只青蛙正在向墙跳跃。每跳一次，它都覆盖距离墙剩余距离的一半。无论青蛙跳了多少次，在最后一次跳跃后，它仍然只覆盖了距离墙剩余距离的一半，它永远无法到达墙。\n\
  \n忽略这些哲学含义，我们实际上可以在线性插值中使用类似的概念来创建一种向某点平滑减速的运动。这在书中被广泛使用，用于制作能够平滑跟随兴趣点的摄像。\n\n###\
  \ Unity 示例\n\n继续之前的 `Interpolation Project`，现在向场景中添加一个球体（`GameObject > Create Other\
  \ > Sphere`）并将其移离 `Cube`。在 Project 面板中创建一个名为 `ZenosFollower` 的新 C# 脚本并挂载到 `Sphere`\
  \ 上。在 MonoDevelop 中打开 `ZenosFollower` 并输入此代码：\n\n点击此处查看代码图片\n\n```csharp\nusing\
  \ UnityEngine;\nusing System.Collections;\npublic class ZenosFollower : MonoBehaviour\
  \ {\n    public GameObject poi; // Interest 点\n    public float u = 0.1f;\n    public\
  \ Vector3 p0, p1, p01;\n    // Update 每帧被调用一次\n    void Update () {\n        //\
  \ 获取此物体和 poi 的位置\n        p0 = this.transform.position;\n        p1 = poi.transform.position;\n\
  \        // 在两者之间插值\n        p01 = (1-u)*p0 + u*p1;\n        // 将此移动到新位置\n     \
  \   this.transform.position = p01;\n    }\n}\n```\n\n保存代码并返回 Unity。在那里，将 `Sphere:ZenosFollower`\
  \ 的 `poi` 设置为 `Cube`（通过将 Hierarchy 面板中的 `Cube` 拖入 `Sphere:ZenosFollower (Script)`\
  \ 检查器的 `poi` 槽中）。保存你的场景！\n\n现在，当你按下 Play 时，球体将向 `cube` 移动。如果你选择 `cube` 并勾选 `checkToCalculate`\
  \ 框，球体将继续跟随 `cube`。你也可以在 Scene 窗口中手动移动 `cube` 并观察球体的跟随。\n\n尝试更改 `Sphere:ZenosFollower`\
  \ 检查器中 `u` 的值。较低的值会让它跟随得慢一些，较高的值会让它跟随得更快。`0.5` 的值会让球体每帧都覆盖到立方体一半距离，这会完全模拟芝诺的二分法悖论（但在实践中，这遵循得太紧密了）。确实，使用这段特定的代码，球体永远无法到达\
  \ `cube` 完全相同的位置；同样，由于这段代码不是基于时间的，球体在快速电脑上跟随得更紧密，在慢速电脑上跟随得更慢，但这只是一个非常快速、简单的跟随脚本。\n\
  \n## 插值不仅仅是位置\n\n插值几乎任何类型的数值都是可能的。在 Unity 中，这意味着我们可以非常容易地插值缩放、旋转和颜色等值。\n\n### Unity\
  \ 示例\n\n这可以在之前插值示例的同一个项目中完成，也可以在一个新项目中完成：\n\n1. 在层次中创建两个名为 `c0` 和 `c1` 的新立方体。为每个立方体创建一个新材质（`Assets\
  \ > Create > Material`）并将材质命名为 `Mat_c0` 和 `Mat_1`。通过将每个材质拖到相应的立方体上来应用它们。选择 `c0`\
  \ 并设置它的位置、旋转和缩放（只要在屏幕上可见）。在检查器的 `c0:Mat_c0` 部分，你也可以设置任何想要的颜色。对 `c1` 和 `Mat_c1` 执行相同的操作，确保\
  \ `c1` 和 `c0` 的位置、旋转和缩放不同。\n2. 在场景中添加第三个立方体，保持默认位置并将其命名为 `Cube1`。\n3. 创建名为 `Interpolator2`\
  \ 的新 C# 脚本并挂载到 `Cube1`：\n\n点击此处查看图片\n\n```csharp\nusing UnityEngine;\nusing System.Collections;\n\
  public class Interpolator2 : MonoBehaviour {\n    public Transform c0, c1;\n   \
  \ public float timeDuration = 1;\n    // 将 checkToCalculate 设置为 true 以开始移动\n   \
  \ public bool checkToCalculate = false;\n    public bool ________________;\n   \
  \ public Vector3 p01;\n    public Color c01;\n    public Quaternion r01;\n    public\
  \ Vector3 s01;\n    public bool moving = false;\n    public float timeStart;\n \
  \   // Update 每帧被调用一次\n    void Update () {\n        if (checkToCalculate) {\n \
  \           checkToCalculate = false;\n            moving = true;\n            timeStart\
  \ = Time.time;\n        }\n        if (moving) {\n            float u = (Time.time-timeStart)/timeDuration;\n\
  \            if (u>=1) {\n                u=1;\n                moving = false;\n\
  \            }\n            // 这是标准的线性插值函数\n            p01 = (1-u)*c0.position\
  \ + u*c1.position;\n            c01 = (1-u)*c0.renderer.material.color + u*c1.renderer.material.color;\n\
  \        }\n    }\n}\n```\n\n\n\n\n\n```cs\nu*c1.renderer.material.color;\n\ns01\
  \ = (1-u)*c0.localScale + u*c1.localScale;\n\n// 旋转的处理方式不同，因为四元数比较特殊\nr01 = Quaternion.Slerp(c0.rotation,\
  \ c1.rotation, u);\n\n// 将这些应用此 Cube01\ntransform.position = p01;\n\nrenderer.material.color\
  \ = c01;\ntransform.localScale = s01;\ntransform.rotation = r01;\n\n}\n}\n```\n\n\
  4. 回到 Unity，从层级面板（Hierarchy pane）将 `c0` 拖入 `Cube01:Interpolator2 (Script)` 属性面板的\
  \ `c0` 字段中。对 `c1` 和 `c1` 字段执行相同的操作。点击播放，然后点击 `Cube01:Interpolator2` 属性中的 `checkToCalculate`\
  \ 复选框。你会发现 Cube01 现在插值的内容远不仅仅是位置。\n\n## 线性外推 (Linear Extrapolation)\n\n我们目前为止进行的所有插值，其\
  \ `u` 值范围都在 0 到 1 之间。如果你允许 `u` 值超出这个范围，就会得到*外推*（之所以如此，是因为现在不再是在两个值之间进行插值，而是在原始两个点之外进行数据外推）。\n\
  \n给定初始两个点 10 和 20，`u=2` 的外推效果如图 B.4 所示。\n\n![Image](img/00274.jpeg)\n\n**图 B.4**\
  \ 外推示例\n\n### Unity 示例\n\n要在代码中查看此，请对 `Interpolator2` 进行以下修改：\n\n点击此处查看代码图片\n\n\
  ```cs\nusing UnityEngine;\n\nusing System.Collections;\n\npublic class Interpolator2\
  \ : MonoBehaviour {\n\n    public Transform c0, c1;\n    public float Min = 0;\n\
  \    public float Max = 1;\n    public float timeDuration = 1;\n    // 设置 checkToCalculate\
  \ 为 true 以开始移动\n    public bool checkToCalculate = false;\n    public bool ________________;\n\
  \    public Vector3 p01;\n    public Color c01;\n    public Quaternion r1;\n   \
  \ public Vector3 s01;\n    public bool moving = false;\n    public float timeStart;\n\
  \    // Update 每帧调用一次\n    void Update () {\n        if (checkToCalculate) {\n \
  \           checkToCalculate = false;\n            moving = true;\n            timeStart\
  \ = Time.time;\n        }\n        if (moving) {\n            float u = (Time.time-timeStart)/timeDuration;\n\
  \            if (u>=1) {\n                u=1;\n                moving = false;\n\
  \            }\n            // 将 u 调整到 Min 到 Max 的范围\n            u = (1-u)*Min\
  \ + u*Max;\n            // ^ 看起来眼？我们正在使用线性插值来实现这一点！\n            // 这是标准的线性函数\n\
  \            p01 = (1-u)*c0.position + u*c1.position;\n            c01 = (1-u)*c0.renderer.material.color\
  \ +\n                  u*c1.renderer.material.color;\n            s01 = (1-u)*c0.localScale\
  \ + u*c1.localScale;\n            // 旋转的处理方式不同，因为四元数比较特殊\n            r01 = Quaternion.Slerp(c0.rotation,\
  \ c1.rotation, u);\n            // 将这些应用此 Cube01\n            transform.position\
  \ = p01;\n            renderer.material.color = c01;\n            transform.localScale\
  \ = s01;\n            transform.rotation = r01;\n        }\n    }\n```\n\n现在，如果你只需按下并点击\
  \ Cube1 上的 `checkToCalculate` 框，将获得与之前相同的行为。但尝试在 `Cube01:Interpolator2 (Script)`\
  \ 属性面板中将 `Min` 改为 -1，`Max` 改为 2。现在，点击 `checkToCalculate`，你会发现颜色、位置和缩放都会外推并超出你设置的原始范围。然而，由于\
  \ `Quaternion.Slerp()` 方法（执行球面线性插值）的限制，旋转不会外推 `c0` 或 `c1` 的旋转。如果传递给 `Slerp()` 的任何低于\
  \ 0 的数字作为 `u` 值，它仍将其视为 0（任何大于 1 的数字被视为 1）。如果你查看 `Vector3` 的文档，它也有一个 `Lerp()` 方法可以在\
  \ `Vector3` 之间进行插值，但我从不使用该函数，因为它也将 `u` 的值限制在 0 到 1 的范围内，且不允许外推。\n\n## 插值的平缓 (Easing\
  \ for Interpolations)\n\n我们目前为止所做的插值非常不错，但它们也有非常机械的感觉，因为它们是突然开始、以恒定速率移动，然后突然停止。幸运的是，有几种*平缓函数*可以让这种运动变得有趣。通过\
  \ Unity 示例来解释这一点：\n\n打开 `Interpolator2` 并进行以下修改：\n\n\n\n\n\n在图 B.5 中，你可以看到各种缓动曲线（easing\
  \ curves）的图形表示。图中，水平轴表示初始的 `u` 值，而垂直轴表示缓动后的 `u` 值 (`u2`)。你可以看到，在每个示例中当 `u=1` 时，`u2`\
  \ 也等于 `1`。正如此，如果线性插值是基于时间的，无论缓动设置如何，该值总会在相同时间内完全从 `p0` 移动到 `p1`。\n\n![Image](img/00275.jpeg)\n\
  \n**图 B.5** 各种缓动曲线及其公式。在每种情况下，管道符 (`|`) 之后的数字代表 `easingMod` 值。\n\n`Linear` 曲线没有缓动（`u2\
  \ = u`）。在所示的其他曲线中，`u2=u` 线以虚线对角线的形式存在，用于显示正常的线性行为。如果曲线的垂直部分位于虚对角线下方，则运动速度比线性曲线慢。相反，如果曲线的垂直部分位于虚对角线上方，则缓动曲线领先于线性运动所在的位置。\n\
  \n`EaseIn` 曲线开始较慢，然后在末尾变快（`u2 = u*u`）。这被称为*淡入*（easing in），因为运动的第一部分是“容易”且缓慢的，然后才加速。\n\
  \n`EaseOut` 曲线是 `EaseIn` 曲线的相反。使用这种曲线，运动开始很快，然后在结尾变慢。\n\n图底部的三个 `Sin` 曲线都遵循相同的公式（`u2\
  \ = u + n * sin(u*2p)`），其中 `n` 是一个浮点数（我们代码中的变量 `easingMod`）。`sin()` 内部的 `u * 2π`\
  \ 乘法确保了当 `u` 从 0 移动到 1 时，它会经过整个正弦波（经过中心、向上、中心、向下，最后回到中心）。如果 `n=0`，正弦曲线对曲线没有影响（即曲线保持线性），随着\
  \ `n` 向任何方向越离零越远，它的影响就越大。\n\n`Sin|-0.2` 曲线是带有弹跳的缓入缓出。`-0.2` 的 `n` 值在线性进度中添加了一个负正弦波，导致移动物体从\
  \ `p0` 稍微后退，快速向 `p1` 移动，稍微越头，然后稳定在 `p1`。`Sin|-0.1` 这种更接近 0 的 `n` 值会让物体在中心点处淡入到全速，然后在接近\
  \ `p1` 时减慢，而两端都没有外推弹跳。\n\n在 `Sin|0.16` 曲线中，在线性的 `u` 进度中添加了轻微的正弦曲线，导致曲线领先于线性，在中间变慢，然后追上。如果是移动物体，这将将其带到中心点，在中间让它减慢以“突出”一段时间，然后将其移出。\n\
  \n`Sin|0.6` 曲线是第 30 章中 `Enemy_2` 使用的缓动曲线。在这种情况下，添加了足够的正正弦波，导致物体射过中心点到达距离 `p1` 约\
  \ 80% 距离的点，然后回到距离 `p1` 20% 距离的点，最后移动到 `p1`。\n\n#### 贝塞尔曲线 (Bézier Curves)\n\n贝塞尔曲线是两个以上点之间的线性插值。与普通的线性插值一样，基础公式为\
  \ `p01 = (1-u) * p0 + u * p1`。贝塞尔曲线只是增加了更多的点和更多的计算。\n\n给定三个点：`p0`、`p1` 和 `p2`\n\n\
  ```\np01 = (1-u) * p0 + u * p1\np12 = (1-u) * p1 + u * p2\np012 = (1-u) * p01 +\
  \ u * p12\n```\n\n如前面的方程所示，对于三个点 `p0`、`p1` 和 `p2`，贝塞尔曲线点的位置计算方法是：首先在 `p0` 和 `p1`\
  \ 之间进行线性插值（称为 `p01`），然后在 `p1` 和 `p2` 之间进行线性插值（称为 `p12`），最后在 `p01` 和 `p12` 之间进行线性插值以获得最终点\
  \ `p012`。这种方法的图形表示如图 B.6 所示。\n\n![Image](img/00276.jpeg)\n\n**图 B.6** 线性插值以及 3 点和\
