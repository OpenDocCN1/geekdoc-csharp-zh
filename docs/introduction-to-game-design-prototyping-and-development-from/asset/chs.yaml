  \ 20 个单位（y 缩放）。而且，因为屏幕是 4:3 的宽高缩比，`20 / 3 = 26.667` 是宽度（x 缩放），我们需要设置的背景。\n\n当你现在玩游戏时，它看起来应该像图\
