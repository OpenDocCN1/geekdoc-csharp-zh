  \ -100 是为了让 Mage 在场景开始时\n    //    不会立即处于受伤状态\n    public float             knockbackDist\
  \ = 1;   // 后退距离\n    public float             knockbackDur = 0.5f;  // 后退时长\n \
  \   public float             invincibleDur = 0.5f; // 无敌时长\n    public int     \
  \          invTimesToBlink = 4;  // 无敌时闪烁的次数\n    public bool              ________________;\n\
  \    private bool             invincibleBool = false; // Mage 是否无敌？\n    private\
  \ bool             knockbackBool = false;  // Mage 是否正在击退？\n}\n```\n\n\n\n\n```csharp\n\
  \    private Vector3 knockbackDir; // 击退方向\n\n    private Transform viewCharacterTrans;\n\
  \n    protected Transform spellAnchor; // 所有法术的父级 transform\n\n    ...\n\n    void\
  \ Awake() {\n        ...\n        // 找到配合 Face() 使用的 characterTrans\n        characterTrans\
  \ = transform.Find(\"CharacterTrans\");\n        viewCharacterTrans = characterTrans.Find(\"\
  View_Character\");\n        ...\n    }\n\n    ...\n\n    void FixedUpdate () { //\
  \ 每物理步长执行一次（即每秒 50 次）\n        if (invincibleBool) {\n            // 获取数值 [0..1]\n\
  \            float blinkU = (Time.time - damageTime)/invincibleDur;\n          \
  \  blinkU *= invTimesToBlink; // 乘以闪烁次数\n            blinkU %= 1.0f;\n         \
  \   // ^ 对 1.0 取模，可以得到 ?blinkU 除以 1.0 剩余的小数部分\n            //     例如：3.85f % 1.0f\
