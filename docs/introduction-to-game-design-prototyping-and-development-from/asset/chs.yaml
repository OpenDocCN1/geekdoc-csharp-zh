  \    print(s);\n    }\n}\n```\n\n从解析后的 XML 中获取数据的行最初看起来可能有点奇怪。`xmlr` 是 `PT_XMLReader`\
  \ 实例，而 `xmlr.xml` 是解析后的 XML。然后使用括号访问以嵌套的方式深入挖掘 XML。`xmlr.xml[\"xml\"]` 获取 XML 文件顶层所有\
  \ `<xml>` 元素的集合，而 `xmlr.xml[\"xml\"][0]` 获取该集合的第 0 个元素。以此继续，深入到 XML 的各种元素。`xmlr.xml[\"\
  xml\"]` 获取 XML 文件顶层所有 `<xml>` 元素的集合，而 `xmlr.xml[\"xml\"][0]` 获取该集合的第 0 个元素。\n\n\
