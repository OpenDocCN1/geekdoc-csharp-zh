  \n```csharp\n// ^ Quaternion 表示与 rot 相同的旋转四元数\n// pos 是位于 [0,0,0] 上方半张牌高度的 V3（即\
  \ [0,1.75,0]）\npos = Vector3.up * CardBartok.CARD_HEIGHT / 2f;\n// 将 Quaternion\
  \ 乘以 Vector3 会使该 Vector3 按照\n// Quaternion 中存储的旋转进行旋转。结果是\n// 位于 [0,0,0] 上方且经过 rot\
  \ 角度旋转的向量\npos = rotQ * pos;\n// 添加玩家手的基础位置（它将位于\n// 卡牌扇形底部的中央）\npos += handSlotDef.pos;\n\
  // 这让卡牌在 z 方向上错错开，虽然肉眼不可见，\n// 但可以防止它们的碰撞体重叠\npos.z = -0.5f*i;\n// 设置手牌第 i 张卡牌的本地位置和旋转\n\
  hand[i].transform.localPosition = pos;\nhand[i].transform.rotation = rotQ;\nhand[i].state\
  \ = CBState.hand;\n// 这使用比较运算符返回一个真或假的布尔值\n// 所以，如果 (type == PlayerType.human)，则\
  \ hand[i].faceUp 被设置为 true\nhand[i].faceUp = (type == PlayerType.human);\n// 设置卡牌的\
  \ SortOrder，以便它们能正确重叠\nhand[i].SetSortOrder(i*4);\n```\n\n现在，如果你运行场景并按下键盘上的数字 1、2、3\
  \ 和 4，你应该能看到卡牌跳入玩家手中并正确地展开成扇形。然而，你可能已经注意到，人类玩家手中的卡牌并没有按点数排序，看起来有点杂乱。幸运的是，我们可以对此进行一些些处理。\n\
  \n### LINQ 简要介绍\n\nLINQ 代表 Language INtegrated Query（语言集成查询），是 C# 的一个非常棒的扩展，关于它已经写了很多书。在\
  \ Joseph 和 Ben Albahari 编写的精彩的 *C# 5.0 Pocket Reference^* 中，有整整 24 页专门留给了 LINQ（而他们只为数组分留了\
  \ 4 页）。LINQ 的大部分内容远超本书的范围，但了解它的存在以及它能做什么是非常重要的。\n\nLINQ 能够在单行 C# 代码中执行类似数据库的查询，允许你对数组中的特定元素进行选择和排序。我们将这样对人类玩家手中的卡牌。在\
  \ `Player.AddCard()` 中添加以下行：\n\n```csharp\npublic class Player {\n    ...\n    public\
  \ CardBartok AddCard(CardBartok eCB) {\n        if (hand == null) hand = new List<CardBartok>();\n\
  \        // 将卡牌加入手\n        hand.Add(eCB);\n        // 如果是人类，则使用 LINQ 按点数排序卡牌\n\
  \        if (type == PlayerType.human) {\n            // 将手拷贝到一个新数组\n          \
  \  CardBartok[] cards = hand.ToArray();\n            // 下面是对 CardBartok 数组操作的 LINQ\
  \ 调用。\n            // 它类似于执行 foreach(CardBartok cd in cards)\n            // 并按点数对它们排序。然后返回一个排序后的数组\n\
  \            cards = cards.OrderBy(cd => cd.rank).ToArray();\n            // 将数组\
  \ CardBartok[] 转换回 List<CardBartok>\n            hand = new List<CardBartok>(cards);\n\
  \            // 注意：LINQ 操作可能会有点慢（比如可能需要\n            // 几毫秒），但我们每回合只执行一次，\n    \
  \        // 所以这不是问题。\n        }\n        FanHand();\n        return(eCB);\n    }\n\
  \    ...\n}\n```\n\n如你所见，通过几行代码我们就能对列表进行排序。LINQ 拥有强大的能力，超出了本书的范围，但我强烈建议如果你需要对数组中的元素进行排序或其他类似查询的操作，去查一下它们（例如，如果你有一个人员数组，需要找到年龄在\
  \ 18 到 25 岁之间的所有人）。\n\n现在运行场景，你会发现人类玩家手中的卡牌始终按点数顺序排列。为了让玩家理解游戏情况，卡牌需要动画移动到位置，所以是时候让卡牌移动起来了。\n\
  \n### 让卡牌移动起来！\n\n现在到了有趣的部分，我们让卡牌实际上从一个位置和旋转插值到下一个。这会让牌类游戏看起来更像是在真实进行，而且正如你所看到的，这让玩家更容易理解游戏中发生了什么。\n\
  \n我们在这里进行的大部分插值都是基于在 Prospector 中对 FloatingScore 所做的。就像 FloatingScore 一样，我们将开始一个由卡牌本身处理的插值，当卡牌移动完成后，它将发送一个回调消息通知游戏它已完成。\n\
  \n让我们从让卡牌平滑移动到玩家手中开始。CardBartok 已经写了很多移动代码，所以让我们利用起来。修改 `Player.FanHand()` 方法的以下代码：\n\
  \n```csharp\npublic class Player {\n    ...\n    public void FanHand() {\n     \
  \   ...\n        for (int i=0; i<hand.Count; i++) {\n            ...\n         \
  \   // 设置手中第 i 张卡牌的本地位置和旋转\n            hand[i].MoveTo(pos, rotQ); // 告诉 Bartok\
  \ 插值\n            // 移动后，Bartok 将状态设置为 CBState.hand\n            hand[i].state =\
  \ CBState.hand;\n            /*\n            hand[i].transform.localPosition = pos;\n\
  \            hand[i].transform.rotation = rotQ;\n            hand[i].state = CBState.hand;\n\
  \            */\n        }\n    }\n}\n```\n\n1. `/*` 开始一个多行注释，因此它和后续 `*/` 之间的所有代码都被视为注释掉了（被\
  \ C# 忽略）。这与在本章开头注释掉 `SlotDef` 类的方法相同。\n\n现在，当你运行场景并按下数字键（1、2、3、4），你会看到卡牌实际上移动到了位置！因为大部分体力工作由\
  \ CardBartok 完成，这只需要很少的代码。这是面向对象代码的巨大优势之一。我们信任 CardBartok 知道如何移动，只需带位置和旋转调用 `MoveTo()`，Bartok\
  \ 会完成剩下的工作。\n\n### 管理初始发牌\n\n在 Bartok 的回合开始时，每个玩家会分发七张牌，然后从牌堆中翻出一张作为第一张目标牌。在 Bartok\
