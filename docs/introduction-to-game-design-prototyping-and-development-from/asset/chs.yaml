  \ all the shots\n            // Uncheck checkToDeletePlayerPrefs\n            checkToDeletePlayerPrefs\
  \ = false;\n        }\n    }\n}\n```\n\n\n\n\n\n```csharp\nshotNum = 0; // 将 shotNum\
  \ 设置为 0\n}\n}\n}\n```\n\n现在，即使 Unity 没有在运行，只要你勾选检器（Inspector）中 `TargetCamera` 字段旁边的\
  \ `checkToDeletePlayerPrefs` 复选框，Unity 就会运行代码从 `PlayerPrefs` 中删除这些设置，在控制台中通知你已完成操作，然后取消检器中\
  \ `checkToDeletePlayerPrefs` 的勾选。如果你选择使用这种功能，需要非常小心，但在这种情况下它可能真的非常有用。\n\n如果你已经测试了\
  \ `checkToDeletePlayerPrefs`（你应该这么做的），现在你需要在继续操作之前再多拍摄一些镜头并保存它们。\n\n### 替换单个镜头\n\
  \n现在，你可以一次性删除所有镜头，但如果你只想替换单个镜头了呢？\n\n1. 在 `Shot` 类的末尾添加以下静态方法：\n\n点击此处查看代码图片\n\n\
  ```csharp\npublic class Shot { // Shot 没有继承 MonoBehaviour\n\n    ...\n\n    // 替换镜头\n\
  \n    static public void ReplaceShot(int ndx, Shot sh) {\n\n        // 确保该索引处有一个\
  \ Shot 供替换\n        if (shots==null || shots.Count <= ndx) return;\n        // 移除旧的\
  \ Shot\n        shots.RemoveAt(ndx);\n        // List<>.Insert() 在特定索引处向列表中添加内容\n\
  \        shots.Insert(ndx,sh);\n        Utils.tr(\"Replaced shot:\", ndx, \"with\"\
  , sh.ToXML());\n    }\n}\n```\n\n2. 现在对所示的 `TargetCamera` 进行更改。这将涉及对代码中 `// Mouse\
