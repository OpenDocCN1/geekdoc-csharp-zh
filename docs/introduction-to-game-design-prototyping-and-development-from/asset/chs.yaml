  \ 的空对象。这样创建时，它位于 [0,0,0], [0,0,0], [1,1,1]\n        spellAnchor = saGO.transform;\
  \ // 获取其变换\n    }\n    ...\n    void MouseDragUp() {\n        ...\n        // 如果没有选中的元素，停止移动\n\
