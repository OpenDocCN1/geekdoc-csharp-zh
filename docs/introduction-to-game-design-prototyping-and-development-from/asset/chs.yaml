  \             visible = true; // 为了确保万无\n            }\n            // 让 GameObject\
  \ 变为激活状态使其隐藏\n            viewCharacterTrans.gameObject.SetActive(visible);\n  \
  \      }\n        if (knockbackBool) {\n            if (Time.time - damageTime >\
  \ knockbackDur) {\n                knockbackBool = false;\n            }\n     \
  \       float knockbackSpeed = knockbackDist/knockbackDur;\n            vel = knockbackDir\
  \ * knockbackSpeed;\n            return; // 返回以避免执行下方的移动代码\n        }\n        if\
  \ (walking) { // 如果法师正在移动\n            ...\n        }\n    }\n\n    void OnCollisionEnter(\
  \ Collision coll ) {\n        GameObject otherGO = coll.gameObject;\n        //\
  \ 碰撞墙壁也会停止移动\n        Tile ti = otherGO.GetComponent<Tile>();\n        if (ti !=\
  \ null) {\n            if (ti.height > 0) { // 如果 ti.height > 0\n              \
  \  // 那么这个 ti 就是一个墙，法师应该停止\n                StopWalking();\n            }\n    \
