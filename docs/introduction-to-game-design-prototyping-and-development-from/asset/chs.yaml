  \ 键运行 Boid，并享受它们表现出的复杂行为。\n\n## 第 27 章：敏捷思维\n\n在本章中，你将学习如何以敏捷的方式思考项目，以及在开始处理一个项目时如何权衡你的选择。你将接触敏捷开发思维和\
  \ Scrum 方法论。我们还详尽讨论了燃尽图（burndown charts），我建议在未来的所有项目中使用它。在本章之后，你将更好地理解如何处理你自己的游戏项目，如何将它们拆解为可以在特定时间内完成的冲刺（sprints），以及如何在这些冲刺中对任务排序。\n\
  \n### 总结\n\n在本章中，你学习了面向对象（object-orientation），这个概念将贯穿本书的剩余部分。由于 Unity 采用了带有组件的 GameObject\
  \ 结构，它非常适用于面向对象编程（OOP）。OOP 的另一个有趣元素是模块化（modularity）概念。在许多方面，模块化代码是单体代码（monolithic\
  \ code）的相反。模块化编码专注于编写小型、可重用且功能单一的良好的函数和类。由于模块化的类和函数很小（即少于约 500 行），它们更容易调试和理解。模块化代码还设计为可重用。当你进入第三部分的教程章节时，你将开始看到以\
  \ `Utils` 形式从一个项目到另一个项目被重用的代码。下一章与我们在第二部分其余部分做的编码有所不同。在第 27 章“敏捷思维”中，你将学习一种管理小型开发项目的方法，我发现这种方法对个人和小团队非常有效。对于一本关于游戏设计和开发的书来说，这可能看起来有点枯燥，但我看到它对寻求按期开发游戏的小团队有巨大的帮助。\n\
  \n### 敏捷开发宣言\n\n多年来，大量的软件作品（包括游戏）倾向于使用通常被称为“瀑布式”（waterfall）的开发方法进行开发。使用瀑布方法，一个较小的预制作团队会通过一份巨型游戏设计文档来定义整个项目，并期望制作团队在开发游戏时逐字遵守该文档。过于严格地坚持瀑布模型往往会导致游戏在完成之前没有经过测试，而且这些制作团队的成员感觉自己更像大机器中的齿轮，而不是真正的游戏开发者。\n\
  \n凭借你现在通过书中的纸质和数字原型设计获得的经验，我确信你能立即看出这种方法的某些问题。2001 年，组成敏捷联盟（Agile Alliance）的开发者们也看到了这些问题，导致了他们的《敏捷开发宣言》，内容如下：\n\
  \nKent Beck, et al.“敏捷开发宣言，”Agile Alliance (2001)。我们正在通过实践和帮助他人实践来发现更更好的软件开发方法。通过这项工作，我们开始重视：\n\
  \n- `个人与交互` 高于 过程与工具\n- `运行的软件` 高于 详尽文档\n- `客户协作` 高于 合同谈判\n- `响应变化` 高于 遵循计划\n\n\
  也就是说，虽然右侧的项目也有价值，但我们更看重左侧的项目。在这四个核心价值中，你可以看到许多我在书中一直努力强加给你的原则：\n\n- 遵循你个人的设计直觉、不断提问并对过程化思维建立理解，比遵循预定义的规则或使用特定的开发框架更重要。\n\
  - 一个运行的简单原型并对其迭代直到变得有趣，比等待几个月直到拥有完美的游戏想法或解决方案要成功得多。\n- 在积极、协作的环境中与其他创意人员碰撞火花，比担心谁拥有特定的知识产权更重要。当然，你确实希望尊重他人对其知识产权的所有权。我的观点是，创造某些东西比争论谁应该拥有百分之比要重要。\n\
  \n![Image](img/00003.jpeg) 听取并响应测试者对你游戏的反馈，比遵循你最初的设计愿要重要得多、得多。你必须让你的游戏演进。\n\n\n\n\
  \n\n在我将敏捷（Agile）开发方法论引入课程之前，学生在开发游戏时往往进度严重落后。事实上，由于缺乏管理开发流程的工具，他们甚至无法理解自己到底落后了多少。这意味着在项目非常后期之前，很难对学生的作品进行玩测试。\n\
  \n在我向课程中引入敏捷及其相关的工具和方法论后，我发现发生了几点变化：\n\n![Image](img/00003.jpeg) 学生对项目的进度有了更清晰的理解，并能够更好地遵守进度表。\n\
  \n![Image](img/00003.jpeg) 学生制作的游戏有了显著提高，这在很大程度上是因为学生专注于不断保持一个可运行的版本，使他们能够更早、更频繁地进行游戏玩测试。\n\
  \n![Image](img/00003.jpeg) 学生对 `C#` 和 `Unity` 的理解增加了，他们对技术能力的信心也随之提高。\n\n在这三点中，前两点是在意之中的。第三点起初让我感到惊讶，但我发现在我每一个使用敏捷方法论教学的班级中情况都是如此。因此，我在所有的课程中、个人游戏开发实践中，甚至在写这本书时都在继续使用敏捷。我希望你们也是。^^(3)\n\
  \n^(3) 非常感谢我在南加大学、MDM 以及电子艺的同事 Tom Frisina，向我介绍了敏捷和 Scrum。\n\n## Scrum 方法论\n\n自\
  \ 2001 年以来，许多人开发了工具和方法论来帮助团队轻松地适应敏捷思维。我最喜欢的之一是 Scrum。\n\nScrum 实际上始于《敏捷宣言》之前的几年，由许多人开发，但它与敏捷的关系在\
  \ Ken Schwaber 和 Mike Beedle 2001 年出版的书籍 *Agile Software Development with Scrum*\
  \ 中得到了巩固。^(4) 在书中，他们描述了 Scrum 方法论的许多共同元素，这些元素在出版后一直广受欢迎。\n\n^(4) Ken Schwaber 和\
  \ Mike Beedle, *Agile Software Development with Scrum*, (Upper Saddle River, NJ:\
  \ Prentice Hall, 2002).\n\nScrum 的目标与大多数敏捷方法论一样，尽可能地获得可运行的产品或游戏，同时让设计能够灵活地适应玩测试者和设计团队成员的反馈。本章剩余部分将向你介绍\
  \ Scrum 方法论中使用一些术语和实践，并向你展示如何使用我课程和这本书开发的基于电子表的燃尽图（burndown chart）。\n\n### Scrum\
  \ 团队\n\n用于游戏原型的 Scrum 团队由一个 `product owner（产品所有者）、一个 `scrum master（Scrum 主管）和一个跨学科的\
  \ `development team（开发团队）组成，最多包含其他十名精通编程、游戏设计、建模、纹理、音频等领域的人。\n\n![Image](img/00003.jpeg)\
  \ **Product owner：** 客户的声音或游戏未来玩家的声音。产品所有者希望确保所有酷炫的功能进入游戏，她负责理解游戏的整体视觉（gestalt vision）。\n\
  \n![Image](img/00003.jpeg) **Scrum master：** 理性的声音。Scrum 主管主持每日 Scrum 会议，并希望确保每个人都在任务中且没有过度工作。Scrum\
  \ 主管通过务实观察项目剩余剩余工作量以及开发团队成员完成分配任务的速度，对产品所有者起到制衡作用。如果项目进度落后或需要削减某些功能，确保其发生是 Scrum\
  \ 主管的责任。\n\n![Image](img/00003.jpeg) **Development team：** 在前线工作的人。开发团队由所有参与项目的人员组成，可以包括产品所有者和\
  \ Scrum 主管，他们在 Scrum 会议之外通常作为团队的普通成员工作。开发团队的个人在每日 Scrum 会议上被分配任务，并被寄希望在下一次会议前完成这些任务。在\
  \ Scrum 中，个人团队成员拥有比其他开发方法更多的自主权，但这种自主也伴随着与团队其他成员进行每日检查的责任。\n\n### 产品待办列表 / 特性列表\n\
  \nScrum 项目始于 `product backlog（产品待办列表，也称为 feature list，即特性列表）））`，它列出了团队预期在最终游戏中实现的所有功能、机制、美术等列表。其中某些内容最初非常模糊，随着开发的进行，必须将其拆分为更具体的子功能。\n\
  \n### 发布与冲刺\n\n产品被拆分为 `releases（发布）` 和 `sprints（冲刺）`。你可以将发布理解为一个已知的向他人展示游戏的时间（例如，与投资者的会议、公测或正式的玩测试轮次），而冲刺是通往发布的一个步骤。在冲刺开始时，会创建一个\
  \ `sprint backlog（冲刺待办列表）），其中包含冲刺结束前完成的所有特性。一个冲刺通常持续 1 到 4 周，你需要确保无论在冲刺期间选择处理什么，在冲刺结束时你都有一个可以玩的游戏（或游戏的一部分）。事实上，在理想情况下，从拥有第一个可运行原型的那刻起，你应该努力不要让任何一天以游戏不可玩的状态结束。\n\
  \n### Scrum 会议\n\n`Scrum meeting（Scrum 会议）` 是一个每日 15 分钟的站立会议（字面意思是，在整个会议期间都要站着），让整个团队保持同步。会议由\
  \ Scrum 主管主持，在会议期间，每个人回答三个问题：\n\n1. 你昨天完成了什么？\n2. 你今天计划完成什么？\n3. 哪些障碍可能会阻碍你？\n\n\
  就这些。Scrum 会议旨在让每个人快速达成共识。问题 1 和问题 2 会根据 `burndown chart（燃尽图）` 进行检查，以查看项目进展。作为问题\
  \ 3 出现的任何问题都将被标记在会议后讨论。当担任 Scrum 主管时，如果会议期间提出障碍，我会请求一名志愿者帮助那个有潜在障碍的人，但限制在会议结束后再对该障碍进行进一步讨论。你希望让\
  \ Scrum 会议尽可能短，以便你团队中的创意人员在全组会议上尽可能少地浪费时间。\n\n### 燃尽图\n\n我发现燃尽图是我游戏开发过程和课程中最实用的工具之一。燃尽图始于一个冲刺期间要执行的任务列表（冲刺待办列表），并估算完成每个任务所需的时间（以小时、天、周等为单位）。在整个项目期间，燃尽图跟踪每个团队成员对其分配的目标的进展情况，并将其转换为图表，该图表不仅跟踪项目剩余工作的总小时数，还跟踪团队的\
  \ `burndown velocity（燃尽速度，即每天平均完成的工作小时数））。当燃尽速度与剩余工作小时数相结合时，团队成员可以快速、轻松地看到他们是否能按时完成工作。\n\
  \n\n\n\n在该书的网站上有一个 OpenOffice Calc 表格 (.ods) 格式的燃尽图模板，你可以用它为自己的项目创建图表。访问 [`book.prototools.net`](http://book.prototools.net)\
  \ 并查看 第 27 章 下“敏捷心态”。\n\nOpenOffice 是 Microsoft Office 软件套的开源免费替代品，它在 第 11 章 的“数学与游戏平衡”中被介绍过。如果你还没有下载，可以在\
  \ [`openoffice.org`](http://openoffice.org) 获取。我发现 OpenOffice Calc 程序与 Microsoft\
  \ Excel 非常相似，但存在一些差异。更多信息请参阅 第 11 章。\n\n解释此燃尽图中所使用的表格公式超本书书的范围，但如果你还没有阅读，可以从 第 11\
  \ 章学习表格的基础知识以及如何使用它们平衡游戏。\n\n## 燃尽图示例\n\n在该书的网站上有一个`燃尽图示例`表格：[`book.prototools.net`](http://book.prototools.net)。此图表在随后的页面中多次被引用，因此请现在下载。为了与本章中的图片保持一致，我建议下载适用于\
  \ OpenOffice 的版本。\n\n### 燃尽图：设置工作表\n\n现代表格被分为几个工作表，可以通过选择窗口底部的标签页进行选择（在图 27.1 中标记为\
  \ `Setup` 和 `Data`）。一旦你下载并打开了`燃尽图示例`表格，点击最左侧的工作表标签（标记为 `Setup`）。\n\n![Image](img/00129.jpeg)\n\
  \n**图 27.1** 设置（Setup）工作表\n\n此 `Setup` 工作表允许你输入几项重要数据，所有数据都应该放在具有蓝色背景的单元格中。在左上角，你可以输入冲刺（sprint）的开始和结束日期。示例项目被设置为今天的一周开始，并在\
  \ 31 个日历后结束。取决于你打开示例文档时的星期几，这将为示例团队在本次冲刺中提供 21 到 23 个工作日（因为示例团队计划在周末不工作）。在在真实的冲刺中，你当然会有固定的开始和结束日期，但我希望这个示例能向你展示一些灵活性。\n\
  \n在开始和结束日期下方，会计算总工作天数，下方是任务列表（也称为冲刺待办事项）。在这里，你可以看到本次冲刺的示例任务列表，以及团队估计完成每个任务所需的小时。\n\
  \n***\n\n提示\n\n**估算小时数** 程序员和其他创意性工作人员面临的最艰巨的任务之一就是估算完成一项任务所需的小时数。事情几乎总是比你预期的要长，除非那个你预计需要\
  \ 20 小时但不知何地只用了 2 小时就完成了某件事。现在，你只需要在遵循一些简单估算规则的情况下做出最好的猜测，这些规则都基于这样一个事实：随着任务规模的增加，你的估算准确性必然会降低。如果你估计一项任务需要\
  \ 4 到 8 小时之间，直接向上取整为 8 小时。\n\n![Image](img/00003.jpeg) 如果你按小时估算，请坚持 1、2、4 或 8 小时的数值。\n\
  \n![Image](img/00003.jpeg) 按天计算：1、2、3 或 5 天。\n\n![Image](img/00003.jpeg) 按周计算：1、2、4\
  \ 或 8 周。\n\n然而，如果你在冲刺中以周为单位估算任何内容，你都需要将其拆分为更小的任务！\n\n***\n\n任务的右侧是本次冲刺的团队成员列表，以及他们的一个或两个字母的标识首字母，这些首字母将在下一个工作表中用于为他们分配任务。下方是星期列表以及关于每天是否应被视为工作日（Y）或休息日（N）的信息。\n\
  \n在右侧（J 列及以后），你将看到一些计算，根据所选的每周工作日来确定每月哪些天是工作日。如果你将单元格 `E39` 设置为 `N`（使周五为休息日），你会看到这立即反映在右侧，并将减少你在冲刺开始和结束日期之间的总工作天数（显示在单元格\
  \ `B6` 中）。你也可以直接在 `M` 列中设置工作日，例如如果你在冲刺期间有一个假期，需要将特定的周一设为假期，而其他所有周一应为工作日。\n\n请将 `E39`\
  \ 改回 `Y`，并点击窗口底部的 `Data` 工作表标签继续操作。\n\n### 示例燃尽图：数据（Data）工作表\n\n在这里跟踪来自 `Setup`\
  \ 工作表中所有任务的每日进度。此表格可以处理多达 100 个任务。（注：原文此段有大量重复错误文本，已清理）。\n\n\n\n\n\n![Image](img/00003.jpeg)\
  \ **03-21:** 他又工作了 2 小时，使任务完成了 50%，在原始 4 小时的预估中还剩 2 小时。因此，他在 `03-21` 列（`J38`）中输入\
  \ `2`，并将 `Wkd.` 列中的小时数增加到 `4`。\n\n![Image](img/00003.jpeg) **03-25 (今天):** 1 小时的工作又消耗了任务的\
  \ 25%（他现在工作得快快了），现在到今天为止，他的加速任务还剩余 25%，即 1 小时。他在 `03-25` 列（`L38`）中填入 `1`，并将 `Wkd.`\
  \ 单元格增加到 `5`。\n\n如你所见，最重要的数据是根据原始预估剩余小时数所表示的任务剩余百分比。然而，Archon 也在 `Wkd.` 列（`E`）中记录了他在加速任务上投入的\
  \ 5 小时，以帮助他在未来改进任务估算。\n\n在图 27.3 中，你也可以看到 Gilbert (`G`) 为 `Risky Driving System`\
  \ 预估了 2 小时的工作，但在 `03-25` 仅用 1 小时就完成了 100% 的任务。Icarus (`I`) 如预期在 1 小时内完成了 `Point\
  \ System` 任务的 50%（同样在 `03-25`）。\n\n### 燃尽速率与燃尽图\n\n`Data` 工作表的顶部显示了实际的燃尽信息（参见图 27.4）。\n\
  \n![Image](img/00132.jpeg)\n\n**图 27.4** Data 工作表中的燃尽速率 (BDV) 和实际燃尽图\n\n在这里，`Today`\
  \ 用橙色显示，每个任务剩余的小时数被用于确定`燃尽速率` (BDV)，这是项目完成工作的的平均速率。在示例的 `D4` 单元格中，你可以看到到今天为止，冲刺的初始\
  \ 30 小时预估还剩下 24 小时的工作。将已完成的 `6` 小时工作除以该团队到目前为止投入项目的 `5` 天，得到 `1.2 小时/天` 的燃尽速率（显示在单元格\
  \ `E4` 中），这意味着团队工作的项目的每一天，预计都会燃尽（即完成）`1.2 小时`的预估工作。如果此 `BDV` 在项目整个 23 个工作日内维持，将完成\
  \ `27.6 小时`的工作，剩余 `2.4 小时`的缺口（如单元格 `D5` 所示）。这对团队来说是一个大问题，因为这意味着他们将无法按时完成冲刺。正如本章前面提到的，这是燃尽图能带给你的关键知识。你的团队可以快速看出他们是否落后于进度，并在太晚之前决定如何明智地处理问题。\n\
  \n这些信息也可以在工作表中间的燃尽图中看到。蓝色柱状代表完成冲刺中任务所需工作小时数的每日计数，红线显示了根据项目到目前为止的历史对未来几天的预期进度。红线和蓝柱在\
  \ `Today` 处将始终匹配，对于项目的剩余部分，红线将估计工作完成的速率。\n\n在燃尽图正上方，你还可以根据每个团队成员对分配给他们的任务的个人进度，查看每个人的燃尽速率报告。\n\
  \n### 任务的排序与分配\n\n`Data` 工作表的 `Rnk` 列（从单元格 `B38` 开始）保存任务优先级信息。任务用数字 `1`、`2` 或 `3`\
  \ 排序，其中 `1` 优先级最高。这分配了颜色（分别为红色、黄色和绿色）。它还导致任务在工作表的 `Remaining Hours By Priority`（按优先级划分的剩余小时数）部分（行\
  \ 30–33）。该部分跟踪每个优先级任务的剩余小时数和燃尽速率。通常情况下，你会在花费过多时间处理 `2` 级或 `3` 级任务之前燃尽所有 `1` 级的任务。\n\
  \n`Data` 工作表的 `Assn` 列（从单元格 `F38` 开始）保存关于哪个团队成员被分配到每个任务的信息。任务使用 `Setup` 工作表中定义的每个人的字母缩写进行分配。（示例使用单个字母，但可以使用任意数量的字母作为缩写。）一旦任务分配给特定人员，它就会计入\
  \ `Data` 工作表的 `Remaining Hours By Person`（按人员划分的剩余小时数）部分（行 8–28）。这样，就可以跟踪每个团队成员的进度，如果一个团队成员被分配的任务过多或过少，就可以平衡工作负载。\n\
  \n### 潜在的燃尽速率陷阱\n\n如前所述，在过去的几年里，我发现燃尽图对我来说是非常无价的；然而，我也遇到过两种特定情况，燃尽图会提供某种误导性信息，如图\
  \ 27.5 所示。\n\n![Image](img/00133.jpeg)\n\n**图 27.5** 燃尽速率可能产生误导的情况\n\n在图 27.5 的图\
  \ A](#part0040.html_ch27fig05) 中，团队最初有一个非常缓慢的燃尽速率，但在过去的几天里，他们极大地提高了。由于 BDV 是根据项目开始以来的总工作计算的，BDV\
  \ 没有更新显示团队现在提高的速率，因此燃尽图预测将延期完成（尽管虚线所示），如果他们保持目前的进度，他们将会提前完成。\n\n在图 27.5 的图 B](#part0040.html_ch27fig05)\
  \ 显示了一个更严重的问题。在图 B 中，团队最初工作非常快，但在过去的几天里速度大大慢了。现在，BDV 仍然反映最初的工作，所以看起来他们仍然可以按时完成。\n\
  \n这两种特殊情况只有在团队工作速率发生剧变时才会发生，但不仅要考虑项目开始以来的 BDV，还需要考虑过去几天的工作速率。\n\n### 创建你的燃尽图\n\n\
  既然你已经熟悉了燃尽示例，你可以返回本书的网站并下载燃尽图模板，为你自己的项目制作燃尽图：\n\n[`book.prototools.net`](http://book.prototools.net)\n\
  \n### 总结\n\n\n\n\n由于这是你的第一个原型，它非常简单。随着你继续学习原型章节，项目将变得越来越复杂，并使用更多 Unity 的功能。\n\n\
  在本章结束时，你将拥有一个简单街机游戏的可运行原型。\n\n### 数字原型的目的\n\n在我们开始制作 Apple Picker（采苹果游戏）原型之前，现在可能是再次思考数字原型目的的好时机了。在本书的第一部分，我们对纸质原型及其用途进行了大量的讨论。纸质游戏原型可以帮助你完成以下操作：\n\
  \n![Image](img/00003.jpeg) 快速测试、拒绝和/或完善游戏机制和规则\n\n![Image](img/00003.jpeg) 探索游戏的动态行为，并理解由规则产生的涌现可能性\n\
  \n![Image](img/00003.jpeg) 确定规则和游戏元素是否易于玩家所理解\n\n![Image](img/00003.jpeg) 理解玩家对你的游戏产生的情感反应\n\
  \n数字原型还增加了一种观察游戏体验的奇妙能力；事实上，这是它们的主要目的。虽然你可以花费几个小时详细向某人描述游戏机制，但让他们直接玩游戏并感受手感要高效得多（也更有趣）。这在\
  \ Steve Swink 的著作 *Game Feel* 中有详细讨论。^(1)\n\n^(1) Steve Swink, *Game Feel: A Game\
  \ Designer’s Guide to Virtual Sensation* (Boston: Elsevier, 2009)。\n\n在本章中，你将创建一个运行的游戏，最终结果将是可以展示给朋友和同事的东西。在让他们玩一会儿后，你可以询问他们感觉是太简单、太难还是恰好。利用这些信息调整游戏中的变量，为他们每人定制特定的难度。\n\
  \n让我们开始制作 Apple Picker 吧。\n\n***\n\n### 为本章设置项目\n\n按照标准的项目设置程序，在 Unity 中创建一个新项目。如果你需要复习标准的项目设置程序，请参阅\
  \ 附录 A，“标准项目设置程序”。\n\n![Image](img/00003.jpeg) **项目名称：** Apple Picker Prototype\n\
  \n![Image](img/00003.jpeg) **场景名称：** `Scene_0`（场景名称开头的下划线将使其排在 Project 板上方。）\n\n\
  ![Image](img/00003.jpeg) **C# 脚本名称：** `ApplePicker`, `Apple`, `AppleTree` 和 `Basket`\n\
  \n将 `ApplePicker` C# 脚本挂载到 `Scene_0` 中的 `Main Camera`。不要将 C# 脚本 `Apple`、`AppleTree`\
  \ 或 `Basket` 挂载到任何东西。\n\n***\n\n### 准备\n\n幸运的是，你已经在 第 15 章“数字系统思维](#part0028.html_ch15)”中为这个原型做了很多准备工作，当时我们分析了\
  \ Apple Picker 和经典游戏 *Kaboom!*。正如该章提到的，Apple Picker 将具有 *Kaboom!* 相同的游戏机制。对于设计师来说，理解经典游戏及其运作方式非常有帮助，而且这是一个非常棒的入门选择。\n\
  \n花点时间回看 第 15 章，确保你理解了每个元素的流程图：`AppleTree`、`Apples` 和 `Baskets`。\n\n#### 入门：美术资源\n\
  \n作为一个原型，这个游戏不需要华丽的艺术效果；它只需要能运行。我们在整本书中创建的这类艺术通常被称为*程序员艺术*（programmer art），即程序员制作的占位艺术，最终会被艺术家创建的实际游戏美术取代。与原型中的几乎所有东西一样，这种艺术的目的是让你尽可能从概念转变为可玩的原型。如果你的程序员艺术看起来并不糟糕，那很好，但这并非必须。\n\
  \n##### AppleTree\n\n从菜单栏中，选择 `GameObject` > `Create Other` > `Cylinder`（圆柱体）。这将是我们树的树干。在\
  \ Hierarchy（层级）中选中它并点击 Inspector（检查器）顶部的名称，将 `Cylinder` 命名为 `Trunk`。将 `Trunk` 的\
  \ `Transform` 组件设置为与图 28.1 所示的 `Transform` 组件设置匹配。\n\n![Image](img/00134.jpeg)\n\
  \n**图 28.1** 名为 `Trunk` 的圆柱体的 Transform 组件\n\n在本书的教程中，我使用以下格式为你提供 `GameObject` transform\
  \ 组件的设置：\n\n![Image](img/00135.jpeg)\n\n前一行指令指示你将名为 `Trunk` 的 `GameObject` 的 transform\
  \ 设置为位置 `x=0`、`y=0` 和 `z=0`；旋转 `x=0`、`y=0` 和 `z=0`；缩放 `x=1`、`y=1` 和 `z=1`。括号中的单词\
  \ `Cylinder` 告诉你是什么种类型的 `GameObject`。你有时会在段落中间看到这种格式列出为 `P:[0,0,0] R:[0,0,0] S:[1,1,1]`。\n\
  \n\n\n\n这应该为场景带来一条优美的对角线光。在这里需要注意的是，方向光的位置并不重要——无论位置如何，方向光都向相同的方向投射光——但我为你设置了 `[0,10,0]`\
  \ 的位置，以便将其移出场景视图的中心，否则它的 `gizmo`（即图标）将位于场景（Scene）面板的中心。\n\n现在，将 `AppleTree` 向上移动并向外移开位置。在层级（Hierarchy）面板中选择\
  \ `AppleTree`，将其位置更改为：\n\n![Image](img/00141.jpeg)\n\n这可能会使其移出场景面板的视野，但你可以在鼠标指针悬停在场景面板上时滚动鼠标滚轮来缩小以查看它。\n\
  \n### Apple\n\n现在你有了 `AppleTree`，你需要制作它将掉落的 `Apple` 游戏对象制体（prefab）。从菜单栏选择 `GameObject`\
  \ > `Create Other` > `Sphere`。将此球体重命名为 `Apple`，并按照如下设置其变换（transform）：\n\n![Image](img/00142.jpeg)\n\
  \n创建一个名为 `Mat_Apple` 的新材质，将其涂为红色（或者如果你喜欢青苹果，改为浅绿色），并将其赋予 `Apple`。\n\n#### 为苹果添加物理属性\n\
  \n在层级面板中选择 `Apple`。从菜单栏选择 `Component` > `Physics` > `Rigidbody`。正如你可能从第 16 章中所记得的“介绍我们的开发环境：Unity”，“`Rigidbody`\
  \ 组件允许物体对物理做出反应（例如掉落、与其他物体碰撞）。如果你现在点击播放按钮，将看到 `Apple` 由于重力掉出屏幕。\n\n#### 为苹果赋予“Apple”标签\n\
  \n最终你会想要快速获取屏幕上所有 `Apple` 游戏对象的数组，给 `Apples` 赋予特定的标签可以对此帮助。在层级面板选中 `Apple` 时，从检查器（Inspector）中\
  \ `Tag` 旁边的弹出菜单中选择 `Add Tag`，如图 28.3 左半所示。这将在检查器中打开 Unity 的`标签和层级管理器（Tag and Layers\
  \ Manager）`。点击 `Tags` 旁展开三角形，并在 `Element 0` 字段中输入 `Apple`，如图 28.3 右半所示。\n\n![Image](img/00143.jpeg)\n\
  \n**图 28.3** 向标签列表中添加 Apple 标签\n\n现在，再次点击层级面板中的 `Apple` 以返回 `Apple` 的检查器。再次点击 `Tags`\
  \ 弹出菜单现在会为你提供 `Apple` 标签选项。从标签列表中选择 `Apple`。所有的苹果现在都具有 `Apple` 标签，这将使得它们更容易被识别和选择。\n\
  \n#### 制作苹果制体\n\n最后，将 `Apple` 从层级面板拖到项目（Project）面板以使其成为制体。一旦你确认项目面板中有一个 `Apple`\
  \ 制体，点击层级面板中的 `Apple` 实例并将其删除（通过右键菜单选择 `Delete`，或在键盘上按下 `Command-Delete` [Windows\
  \ 下为 `Delete`]）。因为我们游戏中的苹果将从项目面板中的 `Apple` 制体实例化，所以我们不需要从开始就在场景中包含一个。\n\n### Basket\n\
  \n和其他美术资产一样，篮子将非常简单。从菜单栏选择 `GameObject > Create Other > Cube`。将 `Cube` 重命名为 `Basket`\
  \ 并将其变换设置为如下：\n\n![Image](img/00144.jpeg)\n\n这应该会给你一个扁平、宽大的矩形几何体。现在创建一个名为 `Mat_Basket`\
  \ 的新材质，将其涂为浅色、低饱和度的黄色（像草席），并将其应用 `Basket`。将 `Basket` 从层级面板拖到项目面板使其成为制体，并删除层级面板中剩余的\
  \ `Basket` 实例。确保保存你的场景。\n\n你的项目面板和层级面板现在看起来应该像图 28.4。\n\n![Image](img/00145.jpeg)\n\
  \n**图 28.4** 原型此阶段的项目面板和层级面板\n\n### 相机设置\n\n在游戏中正确处理最重要的事情之一是相机的位置。对于“苹果采摘（Apple\
  \ Picker）”，我们想要一个能够显示足够大小游戏区域的相机。因为这个游戏的游戏性完全是二维的，我们还想要一个正交相机（orthographic）而不是透视相机（perspective）。查看侧边栏获取关于这两种相机投影的更多信息。\n\
  \n***\n\n正交相机与透视相机\n\n`Orthographic` 和 `perspective` 是游戏中的两种虚拟 3D 相机，可以在图 28.5 中看到。\n\
  \n![Image](img/00146.jpeg)\n\n**图 28.5** 透视投影与正交投影投影的比较\n\n`perspective` 相机像人眼一样工作；因为光线通过透镜进入，靠近相机的物体看起来更大，而较远的物体看起来更小。这使得透视相机的视野（也称为投影）形状像正方锥体（或者更简单地说，像一个切掉顶部的正方锥）。要查看这一点，请在层级面板中点击\
  \ `Main Camera`，然后在场景面板中缩小。从相机延伸出的锥形线框形状是`视视锥体（view frustum）`，它显示了相机将看到的所有内容。\n\n\
  \n\n\n\n```csharp\npublic GameObject applePrefab;\n\n    // AppleTree 移动的速度（米/秒）\n\
  \    public float speed = 1f;\n\n    // AppleTree 转向的距离\n    public float leftAndRightEdge\
  \ = 10f;\n\n    // AppleTree 改变方向的概率\n    public float chanceToChangeDirections\
  \ = 0.1f;\n\n    // 苹果实例化的频率\n    public float secondsBetweenAppleDrops = 1f;\n\n\
  \    void Start () {\n        // 每秒掉落一个苹果\n    }\n\n    void Update () {\n     \
  \   // 基础移动\n        // 改变方向\n    }\n}\n```你可能已经注意到之前的代码没有包含之前章节中出现的行号。书中这部分的代码列表通常不会有行号，因为我需要尽可能利用每一个字符来将代码挤在页面上。\n\
  \n为了看到这段代码实际起作用，你需要将它附加到 `AppleTree` GameObject 上。从 `Project` 格中将 `AppleTree` C#\
  \ 脚本拖到同样在 `Project` 格中的 `AppleTree` 制体（prefab）上。然后，点击 `Hierarchy` 格中的 `AppleTree`\
  \ 实例，你会发现脚本不仅被添加到了 `AppleTree` 制体，还添加到了它在 `Hierarchy` 中的实例中。\n\n当在 `Hierarchy` 中选中\
  \ `AppleTree` 时，你应该能在 `Inspector` 的 `AppleTree (Script)` 组件下看到你输入的所有变量。\n\n尝试通过调整\
  \ `Transform` Inspector 中的 `X` 和 `Y` 坐标在场景中移动 `AppleTree`，为 `AppleTree` 寻找一个合适的高度（`position.y`）和一个合适的左右移动限制范围。在我的机器上，`12`\
  \ 看起来是一个不错的 `position.y`，树木似乎可以在 `position.x` 上从 `-20` 移动到 `20` 而仍然留在屏幕内。将 `AppleTree`\
  \ 的位置设置为 `[0,12,0]`，并将 `AppleTree (Script)` 组件 Inspector 中的 `leftAndRightEdge` 浮点数设置为\
  \ `20`。\n\n***\n\n# Unity 引擎脚本参考\n\n在你深入进行此项目之前，如果你对这里看到的代码有任何疑问，记住查看 Unity 脚本参考（Scripting\
  \ Reference）是极其重要的。进入脚本参考有两种方式：\n\n**1.** 从 Unity 菜单栏中选择 `Help > Scripting Reference`。这将调出保存在本地机器上的脚本参考，这意味着即使没有连接互联网也可以正常工作。你可以在左侧的搜索框中输入任何函数或类名来查找它的更多信息。\n\
  \n在搜索框中输入 `MonoBehaviour` 并按回车键。然后点击第一个结果，查看内置到每个 `MonoBehaviour` 脚本（以及延伸到附加到 Unity\
  \ 中 `GameObject` 的每个类脚本）中的所有方法。对于美国读者，请注意 `Behaviour` 的欧式拼写。\n\n**2.** 在 `MonoDevelop`\
  \ 中工作时，选择任何你想要了解的文本，然后从菜单栏中选择 `Help > Unity API Reference`。这将启动 Unity 脚本参考的在线版本，因此在没有网络访问的情况下无法正常工作，但它与通过第一种方法的本地参考具有相同的信息。\n\
  \n遗憾的是，脚本参考中的所有代码示例默认都是 JavaScript，但有一个弹出的菜单或 C# 按钮（取决于文档版本），允许你将几乎所有的代码示例切换到 C#。相信我；对于使用这种优越得多的语言来说，这是一个很小的代价。\n\
  \n***\n\n## 基础移动\n\n现在，该脚本并没有包含实际移动 `AppleTree` 的代码，而是包含了代码注释（以 `//` 开头），描述了将添加到代码中的动作。我经常发现先在代码注释中列出这些动作，然后逐步添加功能是有用的。这可以帮助你组织思路，类似于为论文写大纲。\n\
  \n现在，对 `AppleTree` 脚本中的 `Update` 方法进行以下更改：\n\n点击此处代码图像\n\n```csharp\nvoid Update\
  \ () {\n    // 基础移动\n    Vector3 pos = transform.position;\n    pos.x += speed *\
  \ Time.deltaTime;\n    transform.position = pos;\n\n    // 改变方向\n}\n```\n\n这段代码的第一行定义了\
  \ `Vector3` 类型的 `pos`。`pos.x += speed * Time.deltaTime` 这一行通过 `speed` 乘以 `Time.deltaTime`\
  \ 来增加 `pos` 的 `x` 分量。最后一行 `transform.position = pos` 将修改后的 `pos` 赋值回 `transform.position`。\n\
  \n\n\n\n\n点击此处查看代码图像\n\n```go\nvoid Update() {\n    // Basic Movement\n    Vector3\
  \ pos = transform.position;\n    pos.x += speed * Time.deltaTime;\n    transform.position\
  \ = pos;\n\n    // Changing Direction\n    if (pos.x < -leftAndRightEdge) {\n  \
  \      speed = Mathf.Abs(speed);  // 向右移动\n    } else if (pos.x > leftAndRightEdge)\
  \ {\n        speed = -Mathf.Abs(speed); // 向左移动\n    }\n}\n```\n\n点击播放并观察发生了什么。`//Changing\
  \ Direction` 下方的第一行会检查前几行刚刚设置的新的 `pos.x` 是否小于由 `leftAndRightEdge` 设置的左右边界限制。如果 `pos.x`\
  \ 太小，`speed` 将设置为 `Mathf.Abs(speed)`，这会取 `speed` 的绝对值，确保结果为正数，从而转为向右移动。如果 `pos.x`\
  \ 大于 `leftAndRightEdge`，则 `speed` 将设置为 `Mathf.Abs(speed)` 的负值，确保 `AppleTree` 向左移动。\n\
  \n### 随机改变方向\n\n添加此处所示的**粗体**行，以引入随机的方向变化：\n\n点击此处查看代码图像\n\n```go\n// Changing Direction\n\
  if (pos.x < -leftAndRightEdge) {\n    speed = Mathf.Abs(speed);  // 向右移动\n} else\
  \ if (pos.x > leftAndRightEdge) {\n    speed = -Mathf.Abs(speed); // 向左移动\n} else\
  \ if (Random.value < chanceToChangeDirections) {\n    speed *= -1;  // 改变方向\n}\n\
  ```\n\n`Random.value` 是 `Random` 类的静态属性，返回 0 到 1 之间的随机浮点值（不包含 1，这意味着结果可以非常接近 1，但\
  \ `Random.Value` 本身永远不会返回 1）。如果这个随机数小于 `chanceToChangeDirections`，`AppleTree` 将通过将\
  \ `speed` 设置为自身的负值来改变方向。按下播放，你会发现当 `chanceToChangeDirections` 为 `0.1f` 时，这种情况发生得太频繁了。在\
  \ Inspector（检查器）中，将 `chanceToChangeDirections` 的值改为 `0.02`，感觉会好很多。注意，在检查器中输入浮点值时，不需要在末尾添加\
  \ `f`。\n\n为了继续讨论基于时间的游戏，这种改变方向的概率实际上不是基于时间的。每一帧，`AppleTree` 改变方向的概率都是 2%。在运行非常快的电脑上，这每秒可能发生\
  \ 200 次（平均每秒变化 4 次），而在慢速电脑上，每秒可能只发生 30 次（平均每秒 0.6 次）。为了修复这个问题，将方向改变代码从 `Update()`（按计算机渲染帧的速度尽可能快地调用）移动到\
  \ `FixedUpdate()`（每秒恰好调用 50 次）。\n\n点击此处查看代码图像\n\n```go\nvoid Update() {\n    //\
  \ Basic Movement\n    Vector3 pos = transform.position;\n    pos.x += speed * Time.deltaTime;\n\
  \    transform.position = pos;\n\n    // Changing Direction\n    if (pos.x < -leftAndRightEdge)\
  \ {\n        speed = Mathf.Abs(speed); // 向右移动\n    } else if (pos.x > leftAndRightEdge)\
  \ {\n        speed = -Mathf.Abs(speed); // 向左移动\n    }\n}\n\nvoid FixedUpdate()\
  \ {\n    // Changing Direction Randomly\n    if (Random.value < chanceToChangeDirections)\
  \ {\n        speed *= -1; // 改变方向\n    }\n}\n```\n\n这将导致 `AppleTree` 平均每秒随机改变 1\
  \ 次方向（每秒 50 次 `FixedUpdates` * 0.02 的随机概率 = 每秒 1 次）。你还需要注意，`AppleTree` 类的代码仍然将 `chanceToChangeDirections`\
  \ 的值列为 `0.1f`。但是，由于 `chanceToChangeDirections` 是公共字段，它会被 Unity 序列化，这允许在 Inspector\
  \ 中看到它，并允许 Inspector 中的 `0.02` 值覆盖脚本中的值。如果你在脚本中更改此字段的值，你不会看到游戏行为发生任何变化，因为对于任何序列化字段，Inspector\
  \ 的值始终将覆盖脚本中的值。\n\n### 掉落苹果\n\n在 Hierarchy（层级面板）中选择 `AppleTree`，查看其 Inspector 中的\
  \ `Apple Tree (Script)` 组件。目前，字段 `applePrefab` 的值为 `None (Game Object)`，这意味着它尚未设置（括号中的\
  \ `GameObject` 是为了让你知道 `applePrefab` 字段的类型是 `GameObject`）。需要将此值设置为 Project（项目）面板中的\
  \ Apple GameObject 预制体。你可以通过点击 Inspector 中 `Apple Prefab None (Game Object)` 右侧的小目标图标并在\
  \ Assets 选项卡中选择 Apple，或者从 Project 面板中拖入 Apple GameObject 预制体来实现。\n\n回到代码，为 `AppleTree`\
  \ 类添加以下粗体代码：\n\n点击此处查看代码图像\n\n```go\nvoid Start() {\n    // 每秒掉落苹果\n    InvokeRepeating(\"\
  DropApple\", 2f, secondsBetweenDrops);\n}\n\nvoid DropApple() {\n    GameObject\
  \ apple = Instantiate(applePrefab);\n    apple.transform.position = transform.position;\n\
  }\n```\n\n`InvokeRepeating` 函数将周期性调用命名的函数。在这种情况下，第一个参数告诉它调用 `DropApple()`。第二个参数\
  \ `2f` 让 `InvokeRepeating` 在第一次调用 `DropApple()` 之前等待 2 秒。第三个参数告诉它之后每隔 `secondsBetweenDrops`\
  \ 秒再次调用。\n\n\n\n\n\n现在层碰撞矩阵（Layer Collision Matrix）已经设置好了，是时候为游戏中重要的 GameObject\
  \ 分配层级了。在 Project（项目）面板中点击 `Apple`。然后在 Inspector（检查器）面板顶部，从 Inspector 面板顶部 `Layer`\
  \ 旁边的弹出菜单中选择 `Apple` 层。在 Project 面板中选择 `Basket`，并将它的 `Layer` 设置为 `Basket`。接着在 Project\
  \ 面板中选择 `AppleTree`，并将它的 `Layer` 设置为 `AppleTree`。当你为 `AppleTree` 选择层时，Unity 会询问你是只想更改\
  \ `AppleTree` 的层，还是同时更改 `AppleTree` 及其子对象的层。你肯定需要选择 `Yes`，因为你需要组成树干和叶子的圆柱体和球体也处于\
  \ `AppleTree` 物理层中。此更改将一直影响场景中的 `AppleTree` 实例。你可以点击 Hierarchy（层级视图）面板中的 `AppleTree`\
  \ 来确认这一点。\n\n现在如果你按下 Play（播放），你应该能看到苹果从树上掉落。\n\n### 如果苹果掉得太远就停止\n\n如果你让当前版本的游戏运行一段时间，你会发现\
  \ Hierarchy 中有很多 `Apples`。这是因为代码每秒都会创建一个新的 `Apple`，但从未删除过任何 `Apples`。打开 `Apple`\
  \ C# 脚本并添加以下代码，以便在每个 `Apple` 达到深度 `transform.position.y == -20`（这已经完全在屏幕外）时将其销毁。代码如下：\n\
  \n点击此处查看代码图片\n\n```csharp\nusing UnityEngine;\n\nusing System.Collections;\n\npublic\
  \ class Apple : MonoBehaviour {\n\n    public static float bottomY = -20f;\n\n \
  \   void Update () {\n        if (transform.position.y < bottomY) {\n          \
  \  Destroy(this.gameObject);\n        }\n    }\n}\n```\n\n你需要将 `Apple` C# 脚本挂到 Project\
  \ 面板中的 `Apple` GameObject 制体上，这段代码在游戏中才能生效。方法是将脚本拖到制体上并释放。现在，如果你在 Unity 中按下 Play\
  \ 并在场景中缩小，你可以看到苹果掉落了一段时间，但一旦它们达到 y 位置 -20，它们就会消失。\n\n`public static float` 一行声明并定义了一个名为\
  \ `bottomY` 的静态变量。正如第 25 章 中提到的，静态变量被该类的所有实例共享，因此每个 `Apple` 实例都具有相同的 `bottomY` 值。如果某个实例的\
  \ `bottomY` 被更改，它将同时改变所有实例的值。不过，同样重要的一点是，像 `bottomY` 这样的静态字段不会出现在 Inspector 中。\n\
  \n`Destroy()` 函数会从游戏中移除传递它的对象，它可以用于销毁组件和 GameObject。在这种情况下，必须使用 `Destroy(this.gameObject)`，因为\
  \ `Destroy(this)` 只会移除 `Apple` GameObject 实例上的 `Apple`（脚本）组件。在任何脚本中，`this` 都指向调用它的地方的\
  \ C# 类的当前实例（在本例中为 `Apple` 类），而不是整个 GameObject。每当你想从挂载的组件类内部销毁整个 GameObject 时，都必须调用\
  \ `Destroy(this.gameObject)`。\n\n这就是对 `Apple` GameObject 需要做的全部工作。\n\n### 实例化篮子\n\
  \n为了让 `Basket` GameObject 开始工作，我们将引入一个贯穿于这些原型教程中的概念。虽然面向面向对象的思维鼓励我们为每个 GameObject\
  \ 创建一个独立的类（正如我们刚刚为 `AppleTree` 和 `Apple` 所的那样），但通常拥有一个运行整个游戏的脚本也是非常有用的。从菜单栏中，选择\
  \ `Assets > Create > C# Script`并将脚本命名为 `ApplePicker`。将 `ApplePicker` 脚本挂载到 Hierarchy\
  \ 中的 `Main Camera` 上。我经常将这些游戏管理脚本挂载到 `Main Camera` 上，因为我确定每个场景中都有 `Main Camera`。在\
  \ MonoDevelop 中打开 `ApplePicker` 脚本并输入以下代码：\n\n点击此处查看代码图片\n\n```csharp\nusing UnityEngine;\n\
  \nusing System.Collections;\n\npublic class ApplePicker : MonoBehaviour {\n\n  \
  \  public GameObject basketPrefab;\n    public int numBaskets = 3;\n    public float\
  \ basketBottomY = -14f;\n    public float basketSpacingY = 2f;\n\n    void Start\
  \ () {\n        for (int i=0; i<numBaskets; i++) {\n            GameObject tBasketGO\
  \ = Instantiate(basketPrefab) as GameObject;\n            Vector3 pos = Vector3.zero;\n\
  \            pos.y = basketBottomY + (basketSpacingY * i);\n            tBasketGO.transform.position\
  \ = pos;\n        }\n    }\n}\n```\n\n点击 Hierarchy 面板中的 `Main Camera`，并在 Inspector\
  \ 中将 `basketPrefab` 设置为之前制作的 `Basket` GameObject 制体，然后点击 Play。你会看到这段代码在屏幕底部创建了三个篮子。\n\
  \n### 使用鼠标移动篮子\n\n在 MonoDevelop 中打开 `Basket` C# 脚本并输入此代码：\n\n点击此处查看代码图片\n\n```csharp\n\
  using UnityEngine;\n\nusing System.Collections;\n\npublic class Basket : MonoBehaviour\
  \ {\n\n    // 获取鼠标当前的屏幕位置\n    Vector3 mouse2D = Input.mousePosition; // 1\n   \
  \ // 相机的 z 坐标设置了鼠标推入 3D 空间的距离\n    mouse2D.z = -Camera.main.transform.position.z;\
  \ // 2\n    // 将点从 2D 屏幕空间转换为 3D 游戏空间\n    Vector3 mouse3D = Camera.main.ScreenToWorldPoint(mouse2D);\
  \ // 3\n\n    // 将篮子的 x 位置移动到鼠标的 x 位置\n    Vector3 pos = this.transform.position;\n\
  \    pos.x = mouse3D.x;\n    this.transform.position = pos;\n}\n\n1. `Input.mousePosition`\
  \ 赋值给 `mouse2D`。这个值是屏幕坐标，测量了鼠标距离左上角的像素距离。\n2. `mouse2D.z = -Camera.main.transform.position.z`。在我们的游戏中，相机位于\
  \ -10，因此 `mouse2D.z` 被设置为 10。\n3. `Camera.main.ScreenToWorldPoint(mouse2D)` 将 `mouse2D`\
  \ 转换为 3D 空间。如果 `mouse2D.z` 为 0，生成的 `mouse3D` 将位于 -10（与相机相同）。通过将 `mouse2D.z` 设置为\
  \ 10，`mouse3D` 被投影在相机位置 10 米处。这在正交投影中不会改变 x 或 y 位置，但在透视投影中具有显著影响。\n\n现在篮子可以移动了，你可以用它们与苹果发生碰撞，尽管它们并没有真正被捕捉到；它们只是落在了篮子里。\n\
  \n### 捕捉苹果\n\n在 `Basket` 脚本中添加以下行：\n\n点击此处查看代码图片\n\n```csharp\npublic class Basket\
  \ : MonoBehaviour {\n\n    void Update () {\n        ...\n    }\n\n    void OnCollisionEnter(Collision\
  \ coll) { // 2\n        // 找出是什么撞到了这个篮子\n        GameObject collidedWith = coll.gameObject;\
  \ // 3\n        if (collidedWith.tag == \"Apple\") { // 4\n            Destroy(collidedWith);\n\
  \        }\n    }\n}\n```\n\n\n\n\n\n1. 在本书的整个教程章节中，我使用省略号（`...`）来表示代码列表中我跳过的部分。如果没有这些省略号，在后面的某些章节中代码列表将变得长得离谱。当你看到这样的省略号时，你不应该对它们所在的代码进行任何更改；只需保持原样并专注于新代码即可（为了清晰起见，新代码已加粗）。此代码列表不需要修改\
  \ `Update()` 函数，因此我使用了省略号来跳过它。\n\n2. 每当另一个 GameObject 与此篮子（Basket）碰撞时，`OnCollisionEnter`\
  \ 方法就会被调用，并传入一个 `Collision` 参数，其中包含了关于碰撞的信息，包括击中此篮子 Collider 的 GameObject 引用。\n\n\
  3. 这一行将此碰撞的 GameObject 赋值给临时变量 `collidedWith`。\n\n4. 通过查找分配给所有苹果 GameObjects 的 `\"\
  Apple\"` 标签来检查 `collidedWith` 是否为一个苹果（Apple）。如果 `collidedWith` 是苹果，它就会被销毁。现在，如果一个苹果撞中这个篮子，它就会被销毁。\n\
  \n此时，游戏的运行方式与我们的灵感来源 *Kaboom!* 非常相似，尽管它还没有任何类似*图形用户界面*（GUI）元素，比如得分或玩家剩余生命数的显示。然而，即使没有这些元素，苹果采集器（Apple\
  \ Picker）在目前的状态下也是一个成功的原型。就目前，这个原型将允许你调整游戏的几个方面，以达到合适的难度水平。\n\n保存你的场景（Scene）。然后点击项目面板（Project\
  \ pane）中的 `Scene_0` 选中它。在键盘上按 `Command-D`（Windows 上为 `Control+D`）来克隆场景。这将创建一个名为\
  \ `Scene_1` 的新场景。双击 `Scene_1` 打开它。作为 `Scene_0` 的精确副本，此新场景中的游戏也能正常运行。这让你有了一个机会，可以调整场景中的变量，而不会更改\
  \ `Scene_0` 中的任何变量，因为每个场景都会为 C# 脚本组件中的序列化公共字段存储不同的检查器（Inspector）值。试着通过增加 `AppleTree`（苹果树）的移动、增加\
  \ `AppleTree` 改变方向的随机概率、更频繁地掉落苹果等来让游戏变得更加困难。当你为 `Scene_1` 平衡好更难的难度后，保存并重新打开 `Scene_0`。如果你不确定当前打开的是哪个场景，只需查看\
  \ Unity 窗口顶部的标题。它将始终包含场景名称。\n\n### GUI 与游戏管理\n\n我们要添加到游戏的最后内容是 GUI 和*游戏管理*，这会让它听起来更像一个真实的游戏。我们将添加的\
  \ GUI 元素是一个得分计数器，而我们将添加的游戏管理元素是回合以及当玩家耗光篮子时游戏重启的能力。\n\n#### 得分计数器\n\n得分计数器将帮助玩家感知自己在游戏中的成就程度。\n\
  \n在项目面板中双击 `Scene_0` 打开它。然后进入菜单栏并选择 `GameObject > Create Other > GUI Text`。这会在屏幕中间放置一个\
  \ `GUIText`，里面包含 `Gui Text` 字样。将 GUI Text 重命名为 `ScoreCounter`。尝试更改 `ScoreCounter`\
  \ 的 `x` 和 `y` 坐标。你会发现 `GUITexts` 的坐标与其他 GameObjects 的坐标完全不同。这是因为 `GUITexts` 是相对于屏幕定位的，而不是在世界空间中定位。`x`\
  \ 值为 0 是屏幕的最左边缘，`x` 值为 1 是右边缘。`y` 值为 0 是屏幕底部，`y` 值为 1 是顶部。（注意，这与 `Input.mousePosition`\
  \ 的屏幕坐标也不同，后者的 `y` 值为 0 是屏幕顶部。）\n\n如图 28.10 左侧所示设置 `ScoreCounter` 的 `Transform`\
  \ 和 `GUIText` 组件。\n\n![Image](img/00152.jpeg)\n\n**图 28.10** ScoreCounter 和 HighScore\
  \ 的 Transform 和 GUIText 组件设置\n\n欲需有关 `GUIText` 组件的更多信息，请点击 `GUIText` 组件右上角的帮助图标（在图\
  \ 28.10 中用黑色圈出）。你可以使用这些帮助图标来进一步了解任何组件。\n\n#### 为每个捕捉到的苹果加分\n\n当苹果和篮子之间发生碰撞时，有两个脚本会收到通知：Apple\
  \ 脚本和 Basket 脚本。在这个游戏中，`Basket` C# 脚本中已经有一个 `OnCollisionEnter()` 方法，因此我们将修改它，为每个捕捉到的苹果给玩家加分。每个苹果\
  \ 100 分似乎是一个合理的数字（尽管我个人一直认为分数末尾多出那些零有点荒唐）。在 MonoDevelop 中打开 `Basket` 脚本并添加此处所示的加粗行：\n\
  \n点击此处查看代码图像\n\n```csharp\nusing UnityEngine;\n\nusing System.Collections;\n\npublic\
  \ class Basket : MonoBehaviour {\n\n    public GUIText        scoreGT; // 1\n\n\
  \    void Update () {\n        ...\n    }\n\n    void Start() {\n        // 找到 ScoreCounter\
  \ GameObject 的引用\n        GameObject scoreGO = GameObject.Find(\"ScoreCounter\"\
  ); // 2\n        // 获取该 GameObject 的 GUIText 组件\n        scoreGT = scoreGO.GetComponent<GUIText>();\
  \ // 3\n        // 设置初始设置为 0\n        scoreGT.text = \"0\";\n    }\n\n    void OnCollisionEnter\
  \ (Collision coll) {\n        // 找到击中此篮子的\n        GameObject collidedWith = coll.gameObject;\n\
  \        if (collidedWith.tag == \"Apple\") {\n            // 销毁\n            Destroy(collidedWith);\n\
  \        }\n        // 将 scoreGT 的文本解析为 int\n        int score = int.Parse(scoreGT.text);\
  \ // 4\n        // 为捕捉到的苹果加分\n        score += 100;\n        // 显示\n        scoreGT.text\
  \ = score.ToString();\n    }\n}\n```\n\n1. 不要忽略此行。它在代码的前部。\n2. `GameObject.Find(\"\
  ScoreCounter\")` 在所有 GameObjects 中查找 `\"ScoreCounter\"` 并将其赋值给 `scoreGO`。\n3. `scoreGO.GetComponent<GUIText>()`\
  \ 在 `scoreGO` 上查找 `GUIText` 组件，并将其赋值给公共字段 `scoreGT`。\n4. `int.Parse(scoreGT.text)`\
  \ 将 scoreGT 的文本转换为整数。增加 100 分后，将其从 int 解析为字符串重新赋值给 `scoreGT`。\n\n#### 通知 Apple Picker\
  \ 苹果掉落了\n\n让 Apple Picker 感觉像一个游戏的另一个方面是在苹果掉落时结束回合。此时，苹果由自己管理销毁，这是可以的，但苹果需要以某种方式通知\
  \ `ApplePicker` 脚本这一事件，以便 Apple Picker 结束回合并销毁剩下的苹果。这将涉及一个脚本调用另一个脚本的函数。首先对 `Apple`\
  \ C# 脚本进行这些修改：\n\n点击此处查看代码图像\n\n```csharp\nusing UnityEngine;\n\nusing System.Collections;\n\
  \npublic class Apple : MonoBehaviour {\n\n    public static float bottomY = -20f;\n\
  \n    void Update () {\n        if (transform.position.y < bottomY) {\n        \
  \    Destroy(this.gameObject);\n            // 获取主摄像机的 ApplePicker 组件引用\n      \
  \      ApplePicker apScript = Camera.main.GetComponent<ApplePicker>(); // 1\n  \
  \          // 调用 apScript 的公共方法 AppleDestroyed()\n            apScript.AppleDestroyed();\
  \ // 2\n        }\n    }\n}\n```\n\n\n\n\n\n1. 获取主相机（Main Camera）上 `ApplePicker`\
  \ 脚本组件的引用。由于 `Camera` 类有一个内置的静态变量 `Camera.main` 引用了主相机，因此不需要使用 `GameObject.Find(\"\
  Main Camera\")` 来获取主摄像机的引用。然后使用 `GetComponent<ApplePicker>()` 获取主相机上 `ApplePicker`（脚本）组件的引用，并将其赋值给\
  \ `apScript`。完成后后，就可以访问挂载在主相机上的 `ApplePicker` 实例的公共变量和方法了。\n\n2. 这调用了 `ApplePicker`\
  \ 实例中不存在的 `AppleDestroyed()` 方法。\n\n目前 `ApplePicker` 脚本中没有公共的 `AppleDestroyed()`\
  \ 方法，因此你需要在 MonoDevelop 中打开 `ApplePicker` C# 脚本，并进行以下加粗的更改：\n\n点击此处查看代码图像\n\n```csharp\n\
  using UnityEngine;\n\nusing System.Collections;\n\npublic class ApplePicker : MonoBehaviour\
  \ {\n\n    public GameObject basketPrefab;\n\n    ...                          \
  \      // 1\n\n    public float basketSpacingY = 2f;\n\n    void Start () {\n\n\
  \        ...\n\n    }\n\n    public void AppleDestroyed() {                 // 2\n\
  \n        //// 删除所有掉落的苹果\n\n        GameObject[] tAppleArray=GameObject.FindGameObjectsWithTag(\"\
  Apple\");// 3\n\n        foreach ( GameObject tGO in tAppleArray ) {\n\n       \
  \     Destroy( tGO );\n        }\n\n    }\n}\n```\n\n1. 这是另一种使用省略号（`...`）来缩短代码列表的方法。在这里，代码省略了省略号上下两行之间的中间部分。再次，这表示你不需要修改这些行之间的任何代码。\n\
  \n2. `AppleDestroyed()` 方法必须声明为 `public`，其他类（如 `Apple`）才能调用它。默认情况下，所有方法都是 `private`\
  \ 的，无法被其他类调用（甚至无法被看到）。\n\n3. `GameObject.FindGameObjectsWithTag(\"Apple\")` 将返回一个包含所有现有\
  \ Apple GameObject 的数组。随后的 `foreach` 循环会遍历其中的每一个对象并销毁它们。\n\n### 当苹果掉落时销篮子\n\n此场景的最后一段代码将管理在每次掉落苹果时删除其中一个篮子，并在所有篮子被销毁时停止游戏。对\
  \ `ApplePicker` C# 脚本进行以下更改：\n\n点击此处查看代码图像\n\n```csharp\nusing UnityEngine;\n\n\
  using System.Collections;\n\nusing System.Collections.Generic;                 \
  \               // 1\n\npublic class ApplePicker : MonoBehaviour {\n\n    ...  \
  \                                                         // 2\n\n    public float\
  \ basketSpacingY = 2f;\n\n    public List<GameObject> basketList;\n\n    void Start\
  \ () {\n\n        basketList = new List<GameObject>();\n        for (int i=0; i<numBaskets;\
  \ i++) {\n\n            GameObject tBasketGO = Instantiate( basketPrefab ) as GameObject;\n\
  \            Vector3 pos = Vector3.zero;\n            pos.y = basketBottom + ( basketSpacingY\
  \ * i );\n            tBasketGO.transform.position = pos;\n            basketList.Add(\
  \ tBasketGO );                                // 3\n        }\n    }\n\n    public\
  \ void AppleDestroyed() {\n        //// 删除所有掉落的苹果\n        GameObject[] tAppleArray\
  \ = GameObject.FindGameObjectsWithTag(\"Apple\");\n        foreach ( GameObject\
  \ tGO in tAppleArray ) {\n            Destroy( tGO );\n        }\n        //// 删除一个篮子\n\
  \        // 获取 basketList 中最后一个篮子的索引\n        int basketIndex = basketList.Count-1;\n\
  \        // 获取该篮子的引用\n        GameObject tBasketGO = basketList[basketIndex];\n\
  \        // 从列表中移除篮子并销毁 GameObject\n        basketList.RemoveAt( basketIndex );\n\
  \        Destroy( tBasketGO );\n    }\n}\n```\n\n1. 我们将篮子 GameObject 存储在 `List`\
  \ 中，因此必须使用 `System.Collections.Generic` 代码（有关 List 的更多信息，请参阅第 22 章）。`public List<GameObject>\
  \ basketList` 在类开头声明，并在 `Start()` 的第一行中定义并初始化。\n\n2. 在这里，省略号省略了 `public float basketSpacingY\
  \ = 2f;` 之前的所有行。\n\n3. for 循环末尾添加了新行，将篮子添加到 `basketList` 中。篮子按照创建顺序添加，这意味着它们是从下到上添加的。\n\
  \n在 `AppleDestroyed()` 方法中，添加了一个新部分来删除其中一个篮子。由于篮子是从下到上添加的，因此确保列表中的最后一个篮子先被销毁（以便从上到下销毁篮子）。\n\
  \n#### 添加高分\n\n在场景中像之前创建 `ScoreCounter` 那样创建一个新的 `GUIText`，并命名为 `HighScore`。为它的\
  \ `Transform` 和 `GUIText` 组件设置如图 28.10 右侧所示的。\n\n接下来，创建一个名为 `HighScore` 的新 C# 脚本，将其挂到\
  \ Hierarchy（层级）面板中的 `HighScore` GameObject 上，并赋予它以下代码：\n\n点击此处查看代码图像\n\n```csharp\n\
  using UnityEngine;\n\nusing System.Collections;\n\npublic class HighScore : MonoBehaviour\
  \ {\n    static public int score = 1000;\n    void Update () {\n        GUIText\
  \ gt = this.GetComponent<GUIText>();\n        gt.text = \"High Score: \"+score;\n\
  \    }\n}\n```\n\n`Update()` 中的行简单显示 `GUIText` 组件中的 `score` 值。因为在使用 `+` 运算符将字符串与另一种数据类型（本例中的\
  \ int `score`）连接时，`ToString()` 被隐式调用（即自动调用）。\n\n将 int `score` 不仅设为 public 还是 static，让我们能够通过直接输入\
  \ `HighScore.score` 来访问它。这是我们在书中原型中使用的静态变量的力量之一。打开 `Basket` C# 脚本并添加以下行以查看如何使用：\n\
  \n点击此处查看代码图像\n\n```csharp\nvoid OnCollisionEnter( Collision coll ) {\n    ...\n\
  \    // 将分数转换回字符串并显示\n    scoreGT.text = score.ToString();\n    //记录高分\n    if (score\
  \ > HighScore.score) {\n        HighScore.score = score;\n    }\n}\n```\n\n现在当当前分数超过\
  \ `HighScore.score` 时，`HighScore.score` 将被赋值。\n\n最后，打开 `ApplePicker` C# 脚本并添加以下行，当玩家耗光篮子时重置游戏：\n\
  \n点击此处查看代码图像\n\n```csharp\npublic void AppleDestroyed() {\n    ...\n    //// 删除一个篮子\n\
  \    ...\n    basketList.RemoveAt( basketIndex );\n    Destroy( tBasketGO );\n \
  \   // 重启游戏，不会影响 HighScore.Score\n    if ( basketList.Count == 0 ) {\n        Application.LoadLevel(\
  \ \"_Scene_0\" );\n    }\n}\n```\n\n`Application.LoadLevel( \"_Scene_0\" )` 将重新加载\
  \ _Scene_0。这有效地将游戏重置为初始状态。但是，由于 `HighScore.score` 是静态变量，它不会随着游戏的其他部分一起重置。这意味着高将在回合之间保留。但是，每当你再次按下\
  \ Play 按钮停止游戏时，`HighScore.score` 将重置。可以通过 Unity 的 `PlayerPrefs` 来解决这个问题。`PlayerPrefs`\
  \ 将 Unity 脚本的信息存储在计算机上，以便稍后可以调取，且在播放停止时不会被破坏。为 `HighScore` C# 脚本添加以下加粗的更改：\n\n点击此处查看代码图像\n\
  \n```csharp\nusing UnityEngine;\n```\n\n\n\n\n\n```cs\nusing System.Collections;\n\
  \npublic class HighScore : MonoBehaviour {\n\n    static public int score = 1000;\n\
  \n    void Awake() { // 1\n        // 如果 ApplePickerHighScore 已经存在，则读取它\n      \
  \  if (PlayerPrefs.HasKey(\"ApplePickerHighScore\")) { // 2\n            score =\
  \ PlayerPrefs.GetInt(\"ApplePickerHighScore\");\n        }\n        // 将高分赋值给 ApplePickerHighScore\n\
  \        PlayerPrefs.SetInt(\"ApplePickerHighScore\", score); // 3\n    }\n\n  \
  \  void Update () {\n        GUIText gt = this.GetComponent<GUIText>();\n      \
  \  gt.text = \"High Score: \"+score;\n        // 如果必要，更新 PlayerPrefs 中的 ApplePickerHighScore\n\
  \        if (score > PlayerPrefs.GetInt(\"ApplePickerHighScore\")) { // 4\n    \
  \        PlayerPrefs.SetInt(\"ApplePickerHighScore\", score);\n        }\n    }\n\
  }\n```\n\n**1.** `Awake()` 是 Unity 的一个内置方法（类似于 `Start()` 或 `Update()`），在 `HighScore`\
  \ 实例首次创建时触发（因此 `Awake()` 总是在 `Start()` 之前发生）。\n\n**2.** `PlayerPrefs` 是一个通过键（即唯一字符串）引用的值字典。在这种情况下，我们引用了键\
  \ `ApplePickerHighScore`。这里，第一行检查 `PlayerPrefs` 中是否已经存在 `ApplePickerHighScore`，如果存在则将其读取出来。\n\
  \n**3.** `Awake()` 的最后一行将 `score` 的当前值赋值给 `PlayerPrefs` 键 `ApplePickerHighScore`。如果\
  \ `ApplePickerHighScore` 已经存在，会将值重写回 `PlayerPrefs`；然而，如果该键不存在，这确保了会创建一个 `ApplePickerHighScore`\
  \ 键。\n\n**4.** 加上这几行代码后，`Update()` 现在每帧都会检查当前的 `HighScore.score` 是否高于存储在 `PlayerPrefs`\
  \ 中的分数，如果是，则更新 `PlayerPrefs`。\n\n这种对 `PlayerPrefs` 的用法使得 Apple Picker 的高分可以记录在这台机器上，并且高分在停止播放、退出\
  \ Unity 甚至重启电脑后依然存在。\n\n### 总结\n\n现在你已经有了一个与原始 Activision 游戏 `Kaboom!` 玩法非常相似的游戏原型！虽然这个游戏仍然缺乏如逐渐增加难度、启动界面和结束界面等元素，但你可以在获得更多经验后自己添加这些内容。\n\
  \n### 下一步计划\n\n以下是对你未来可以添加到原型中的一些元素的的进一步说明：\n\n![Image](img/00003.jpeg) **启动界面：**\
  \ 可以添加一个启动界面。你可以在自己的场景中构建它，并给它一个启动图像和一个 `Start` 按钮。`Start` 按钮可以调用 `Application.LoadLevel(\"\
  _Scene_0\")` 来开始游戏。\n\n![Image](img/00003.jpeg) **游戏结束界面：** 可以创建另一个场景作为游戏结束界面。游戏结束界面可以显示玩家获得的最终得分，并让玩家知道是否超过了之前的最高分。它应该有一个标记为\
  \ `Play Again` 的按钮，调用 `Application.LoadLevel(\"_Scene_0\")`。\n\n![Image](img/00003.jpeg)\
  \ **增加难度：** 难度级别将在稍后的原型中讨论，但如果你想在这里添加它们，那么为 `AppleTree` 上的每个值存储一个数组或 `List` 是合理的，例如\
  \ `speed`、`chanceToChangeDirections` 和 `secondsBetweenAppleDrops`。每个元素\n\n\n\n\n\
  \n1. 从菜单栏中，选择 `GameObject > Create > Directional Light`。平行光的一个特性是，它的位置对场景没有影响；只考虑平行光的旋转。既然如此，通过将它的变换（transform）设置为以下值将其移开位置：\n\
  \n![Image](img/00154.jpeg)\n\n2. 保存你的场景。\n\n## 相机设置\n\n接下来是摄像机设置：\n\n1. 在层级（Hierarchy）中选择\
  \ `Main Camera` 并将其重命名为 `Main Camera`，以保持它位于层级面板顶部的排序。然后将它的变换设置为以下：\n\n![Image](img/00155.jpeg)\n\
  \n2. 现在将 `Main Camera` 的 `Projection`（投影）设置为 `Orthographic`（正交），并将 `Size`（大小）设置为\
  \ `10`。然后选择一个更亮的背景颜色使其看起来更像蓝天。最终设置应该像图 29.1 所示。\n\n![Image](img/00156.jpeg)\n\n\
  **图 29.1** Transform 和 Camera 组件的 Main Camera 设置\n\n3. 虽然你以前用过正交摄像机，但从未真正讨论过 `Size`\
  \ 设置的含义。在正交投影中，`Size` 设置了从中心到摄像机视图底部的距离，因此 `Size` 是相机可视区域高度的一半。你现在可以在游戏（Game）面板中看到这一插图。地板的\
  \ y 位置为 `-10`，它被 Game 窗口的底部完美平分。尝试通过图 29.2 中高亮的弹出菜单更改 Game 窗口的宽高比例。你会发现，无论你选择哪种宽高比例，地面立方体（Ground\
  \ cube）的中心仍然完美位于 Game 面板的底部。探索一段时间后，选择如图所示的 `16:9` 宽高比例。\n\n![Image](img/00157.jpeg)\n\
  \n**图 29.2** 正交相机大小为 10 含义的演示\n\n4. 保存你的场景。务要保存你的场景。\n\n## 弹弓\n\n我们将用三个圆柱体制作一个简单的弹弓：\n\
  \n1. 先创建一个空对象 `GameObject`（`GameObject > Create Empty`）。将 `GameObject` 的名称更改为 `Slingshot`\
  \ 并将其变换设置为以下：\n\n![Image](img/00158.jpeg)\n\n2. 创建一个新的圆柱体（`GameObject > Create Other\
  \ > Cylinder`）并将其命名为 `Base`。在层级面板将其拖到 `Slingshot` 下方，使 `Slingshot` 成为父级。点击 `Slingshot`\
  \ 旁边的展开三角形再次选择 `Base`。将 `Base` 的变换设置为以下：\n\n![Image](img/00159.jpeg)\n\n当修改像 `Base`\
  \ 这样作为其他 `GameObject` 子对象的变换时，你是在*本地坐标*中进行，这意味着你设置的位置是 `Base` 相对于父级 `Slingshot`\
  \ 的位置，而不是 `Base` 在全局世界坐标中的位置。\n\n3. 选中 `Base`，点击检查器（Inspector）中 `Capsule Collider`\
  \ 组件旁边的齿轮图标并选择 `Remove Component`（移除组件）（参见图 29.3）。这将从 `Base` 中移除 `Collider` 组件。\n\
  \n![Image](img/00160.jpeg)\n\n**图 29.3** 移除 Collider 组件\n\n4. 创建一个名为 `Mat_Slingshot`\
  \ 的新材质并将其变为浅黄色（或你喜欢的任何颜色）。将 `Mat_Slingshot` 拖到 `Base` 上将材质应用到该 `GameObject`。\n\n\
  5. 在层级面板中选择 `Base` 并按下键盘上的 `Command-D` 复制它（Windows 上为 `Control+D`）。通过复制，你可以确保新的副本也是\
  \ `Slingshot` 的子级，并保留 `Mat_Slingshot` 材质。将新副本的名称从 `Base` 更改为 `LeftArm`。将 `LeftArm`\
  \ 的变换设置为以下：\n\n![Image](img/00161.jpeg)\n\n这制作成了弹弓的一臂。\n\n6. 在层级面板中选择 `LeftArm`\
  \ 并复制它（`Command-D`）。将此实例重命名为 `RightArm`。将 `RightArm` 的变换设置为以下：\n\n![Image](img/00162.jpeg)\n\
  \n7. 在层级面板中选择 `Slingshot`。为 `Slingshot` 添加 `Sphere Collider` 组件（`Component > Physics\
  \ > Sphere Collider`）。将 `Sphere Collider` 组件设置为如图 29.4 所示所示。\n\n![Image](img/00163.jpeg)\n\
  \n**图 29.4** Slingshot 的 Sphere Collider 组件设置\n\n8. 确保将 `Is Trigger` 设置为 `true`（勾选）。正如你预期的，`Is\
  \ Trigger = true` 的碰撞体被称为*触发器*（trigger）。触发器是 Unity 物理模拟的一部分，当其他碰撞体或触发器穿过它们时会发送通知。然而，物体不会像普通碰撞体那样从触发器反弹。我们将使用这个大球形触发器来处理鼠标与\
  \ `Slingshot` 的交互。\n\n9. 将 `Slingshot` 的变换设置为以下：\n\n![Image](img/00164.jpeg)\n\n\
  这将使弹弓的一侧手臂位于屏幕左侧，通过正交摄像机。\n\n10. 最后，你需要为弹弓添加一个发射点来发射子弹。创建一个空 `GameObject`（`GameObject\
  \ > Create Empty`）并命名为 `LaunchPoint`。将 `LaunchPoint` 拖到 `Slingshot` 上使 `Slingshot`\
  \ 成为其父级。将 `LaunchPoint` 的变换设置为以下：\n\n![Image](img/00165.jpeg)\n\n`LaunchPoint` 的本地坐标旋转将使其与世界坐标中的\
  \ 轴对齐。\n\n11. 保存你的场景。\n\n## 子弹\n\n接下来是子弹。\n\n1. 创建一个球体并命名为 `Projectile`。在层级中选择 `Projectile`\
  \ 并挂载 `Rigidbody` 组件（`Component > Rigidbody`）。这个 `Rigidbody` 组件将允许子弹进行物理模拟，类似于苹果。\n\
  \n2. 创建一个新材质并命名为 `Mat_Projectile`。将 `Mat_Projectile` 设为深灰色并应用于 `Projectile`。\n\n\
  3. 将 `Projectile` 从层级面板拖到项目面板以制制体。然后删除层级中剩余的 `Projectile` 实例。\n\n你的最终项目面板和层级面板应该像图\
  \ 29.5 所示。\n\n![Image](img/00166.jpeg)\n\n**图 29.5** 编码前的项目和层级面板\n\n4. 保存你的场景。\n\
  \n### 编写原型\n\n美术资源就绪后，是时候为项目添加代码了。我们将添加的第一个脚本是 `Slingshot` 的，使其响应鼠标输入、实例化 `Projectile`\
  \ 并发射该 `Projectile`。此脚本将以迭代方式进行，每次添加一小部分代码，测试代码并增加一点。当你开始编写自己的脚本时，这是一个极佳的方法：实现简单容易编码的功能，测试它，实现另一个，重复。\n\
  \n#### Slingshot\n\n按照以下步骤创建 `Slingshot` 类：\n\n1. 创建一个新的 C# 脚本并命名为 `Slingshot`（`Assets\
  \ > Create > C# Script`）。将其挂载到层级中的 `Slingshot` 上并在 MonoDevelop 中打开 `Slingshot` C#\
  \ 脚本。输入以下代码：\n\n```csharp\nusing UnityEngine;\nusing System.Collections;\n\npublic\
  \ class Slingshot : MonoBehaviour\n{\n    void OnMouseEnter()\n    {\n        print(\"\
  Slingshot:OnMouseEnter()\");\n    }\n\n    void OnMouseExit()\n    {\n        print(\"\
  Slingshot:OnMouseExit()\");\n    }\n}\n```\n\n2. 按播放，并在 Game 面板中将鼠标指针悬 `Slingshot`。你会看到，当鼠标进入\
  \ `Slingshot` 的 `Sphere Collider` 时，“Slingshot:OnMouseEnter()”会被输出到控制台（Console）面板。当鼠标离开\
  \ `Sphere Collider` 时，“Slingshot:OnMouseExit()”会被输出。`OnMouseEnter()` 和 `OnMouseExit()`\
  \ 是可以作用于任何碰撞体或触发器的函数。\n\n\n\n\n\n这只是我们编写用于启动“发射物”（Projectiles）项目脚本的第一步，但从小开始并逐步构建是非常重要的。\n\
  \n## 3. 保存你的场景。\n\n### 显示弹弓何时处于激活状态\n\n接下来，让我们添加一个高亮显示，告诉玩家弹弓正处于激活状态：\n\n**1.**\
  \ 在 Hierarchy（层级面板）中选择 `LaunchPoint`。然后为 `LaunchPoint` 添加一个 `Halo` 组件（`Component\
  \ > Effects > Halo`）。将光晕的 `Size` 设置为 `1`，并将 `Color` 设置为浅灰色，以确保其可见（我的设置是 `[r:191,g:191,b:191,a:255]`）。\n\
  \n**2.** 现在将以下代码添加到 `Slingshot` C# 脚本中。如你所见，这也是注释掉上一次测试中 `print()` 语句的好时机：\n\n点击此处查看代码图像\n\
  \n```csharp\npublic class Slingshot : MonoBehaviour {\n\n    public GameObject \
  \     launchPoint;\n\n    void Awake() {\n        Transform launchPointTrans = transform.Find(\"\
  LaunchPoint\");\n        launchPoint = launchPointTrans.gameObject;\n        launchPoint.SetActive(\
  \ false );\n    }\n\n    void OnMouseEnter() {\n        //print(\"Slingshot:OnMouseEnter()\"\
  );\n        launchPoint.SetActive( true );\n    }\n\n    void OnMouseExit() {\n\
  \        //print(\"Slingshot:OnMouseExit()\");\n        launchPoint.SetActive( false\
  \ );\n    }\n}\n```\n\n现在当你按下 Play 时，你会看到光晕的开启和关闭，这表明玩家可以与弹弓进行交互。\n\n`GameObjects`（如\
  \ `launchPoint`）上的 `SetActive()` 方法告诉游戏是否忽略它们。如果 `GameObject` 的 `active` 被设置为 `false`，它将不会在屏幕上进行渲染，也不会接收任何诸如\
  \ `Update()` 或 `OnCollisionEnter()` 的函数调用。这并不会销毁 `GameObject`；它只是将其从游戏的活跃部分移除。在\
  \ `GameObject` 的 Inspector（检器面板）中，Inspector 顶部 GameObject 名称左侧的复选框表示该 `GameObject`\
  \ 是否激活（请参阅图 29.6）。\n\n组件也有类似的复选框。这设置了组件是否启用。对于大多数组件（例如 `Renderer` 和 `Collider`），这也可以在代码中设置（例如，`Renderer.enabled\
  \ = false`），但由于某些原因，`Halo` 在 Unity 中不是一个可访问的组件，这意味着我们无法从 C# 影响 `Halo` 组件。你偶尔会遇到这种不一致的情况，这时你需要找到一个通变方法。在这种情况下，我们无法禁用光晕，而是通过激活包含它的\
  \ `GameObject`。\n\n![Image](img/00167.jpeg)\n\n**图 29.6** GameObject 激活复选框和组件启用复选框。\n\
  \n**3.** 保存你的场景。\n\n### 实例化发射物\n\n下一步是在按下鼠标 0 键时实例化 `Projectile`（发射物）。\n\n***\n\n\
  **警告**\n\n**不要修改 OnMouseEnter() 或 OnMouseExit()！！！** 这在上一章中已经提到过，但为了以防万一，在此重复强调。\n\
  \n在接下来的 `Slingshot` 代码列表中，`OnMouseEnter()` 和 `OnMouseExit()` 的大括号之间包含省略号：`{``}`。随着我们编写的游戏越来越复杂，脚本将变得越来越长。每当你看到预存函数名称后跟着\
  \ `{`...`}` 时，这表示大括号之间的之前的列表代码应保持不变。在这个示例中，`OnMouseEnter()` 和 `OnMouseExit()` 应该保持不变：\n\
  \n点击此处查看代码图像\n\n```csharp\nvoid OnMouseEnter() {\n    //print(\"Slingshot:OnMouseEnter()\"\
  );\n    launchPoint.SetActive( true );\n}\n\nvoid OnMouseExit() {\n    //print(\"\
  Slingshot:OnMouseExit()\");\n    launchPoint.SetActive( false );\n}\n```\n\n务必注意这些。在代码中任何看到省略号的地方，意味着我使用它们来缩短书中的代码列表，并省略你已经输入过的内容。`{...}`\
  \ **不是**真实的 C# 代码。\n\n***\n\n**1.** 将以下代码添加到 `Slingshot`：\n\n点击此处查看代码图像\n\n```csharp\n\
  public class Slingshot : MonoBehaviour {\n\n    // 在 Unity Inspector 面板设置的字段\n \
  \   public GameObject      prefabProjectile;\n    public bool            _____________________________;\n\
  \    // 动态设置的字段\n    public GameObject      launchPoint;\n    public Vector3   \
  \      launchPos;\n    public GameObject      projectile;\n    public bool     \
  \       aimingMode;\n\n    void Awake() {\n        Transform launchPointTrans =\
  \ transform.FindChild(\"LaunchPoint\");\n        launchPoint = launchPointTrans.gameObject;\n\
  \        launchPoint.SetActive( false );\n        launchPos = launchPointTrans.position;\n\
  \    }\n\n    void OnMouseEnter() {...}   // 不要修改 OnMouseEnter()\n\n    void OnMouseExit()\
  \ {...}    // 不要修改 OnMouseExit()\n\n    void OnMouseDown() {\n        // 待添加的逻辑\n\
  \    }\n}\n```\n\n这里首先需要注意的是 `Slingshot` 顶部所有的额外字段：`prefabProjectile`（指向所有 Projectile\
  \ 制体的引用）必须在运行游戏之前在 Inspector 中设置，而所有其他变量都旨在动态设置。因为 Unity Inspector 按照声明顺序对序列化公共字段进行排序，带下划线的\
  \ bool 变量将出现在 Inspector 中，作为预设变量和动态变量之间的分隔符。\n\n其他新字段要要直观得多：`launchPos` 存储了 `launchPoint`\
  \ 的 3D 世界位置，`projectile` 是指向创建的新实例的引用。`mouseActive` 通常为 `false`，但在鼠标在 Slingshot\
  \ 上按下时会被设置为 `true`。这是一个状态变量，让代码的其他部分知道如何运行。在下一节中，我们将为 Slingshot 的 `Update()` 编写代码，它仅在\
  \ `mouseActive == true` 时运行。\n\n在 `Awake()` 中，我们添加了一行代码来设置 `launchPos`。\n\n`OnMouseDown()`\
  \ 方法包含了此列表中大部分的变化。只有当玩家在 Slingshot GameObject 的 Collider 组件上按下鼠标时，`OnMouseDown()`\
  \ 才会被调用，因此只有当鼠标位于有效的起始位置时才能调用此方法。创建一个 `prefabProjectile` 实例并将其赋值给 `projectile`。然后将\
  \ `projectile` 放置在 `launchPos` 位置。最后，将 Projectile Rigidbody 上的 `isKinematic` 设置为\
  \ `true`。当 Rigidbody 是运动学运行时，它不会通过物理自动移动，但仍然模拟的一部分（这意味着运动学 Rigidbody 不因为碰撞或重力而移动，但仍会导致非运动学\
  \ Rigidbodies 移动）。\n\n**2.** 在按下 Play 之前，在 Hierarchy 面板中选择 Slingshot，并将 *prefabProjectile*\
  \ 设置为 Project 面板中的 Projectile 制体（可以通过点击 Inspector 中 prefabProjectile 右侧的目标对象，或者从\
  \ Project 面板将 Projectile 制体拖动到 Inspector 中的 prefabProjectile 上来实现）。\n\n**3.** 按下\
  \ Play，将鼠标指针移动到 Slingshot 的活动区域内并点击。你会看到 Projectile 字段实例出现。\n\n\n\n\n\n## 4. 现在让我们让它实现更多功能。在\
  \ `Slingshot` 类中添加以下字段和 `Update()` 方法：\n\n点击此处查看代码图片\n\n```csharp\npublic GameObject\
  \ prefabProjectile;\npublic float velocityMult = 4f;\npublic bool _________________;\n\
  \n// // 如你从省略号所示，这里跳过了一些行\n\nvoid Update() {\n    // 如果 Slingshot 不处于瞄准模式 (aimingMode)，则不运行此代码\n\
  \    if (!aimingMode) return;\n    // 获取在 2D 屏幕坐标下的当前鼠标位置\n    Vector3 mousePos2D\
  \ = Input.mousePosition;\n    // 将鼠标位置转换为 3D 世界坐标\n    mousePos2D.z = -Camera.main.transform.position.z;\n\
  \    Vector3 mousePos3D = Camera.main.ScreenToWorldPoint( mousePos2D );\n    //\
  \ 找到 launchPos 到 mousePos3D 之间的差值\n    Vector3 mouseDelta = mousePos3D-launchPos;\n\
  \    // 将 mouseDelta 限制为 Slingshot SphereCollider 的半径\n    float maxMagnitude =\
  \ this.GetComponent<SphereCollider>().radius;\n    if (mouseDelta.magnitude > maxMagnitude)\
  \ {\n        mouseDelta.Normalize();\n        mouseDelta *= maxMagnitude;\n    }\n\
  \    // 将弹体移动到这个新位置\n    Vector3 projPos = launchPos + mouseDelta;\n    projectile.transform.position\
  \ = projPos;\n    if ( Input.GetMouseButtonUp(0) ) {\n        // 鼠标已释放\n       \
  \ aimingMode = false;\n        projectile.rigidbody.isKinematic = false;\n     \
  \   projectile.rigidbody.velocity = -mouseDelta * velocityMult;\n        projectile\
  \ = null;\n    }\n}\n```\n\n大部分内容已经在内联注释中解释过了；然而，部分向量数学需要更仔细的检查（参见图 29.7）。\n\n![Image](img/00168.jpeg)\n\
  \n**图 29.7** 二维向量减法\n\n如你在图 29.7 所示，向量是逐个分量进行加减的。该图是二维的，但相同的方法适用于 3D。向量 `A` 和 `B`\
  \ 的 x 分量被相减，y 分量也是如此，定义了一个新的 `Vector2` 为 `Vector2( 2-5, 8-3 )`，它变为 `Vector2( -3,\
  \ 5 )`。该图说明 `A-B` 给出了 `A` 和 `B` 之间的向量距离，这也是从点 B 移动到点 A 所需移动的距离和方向。一个记忆向量指向哪里的口诀是\
  \ AMBLAA，“A Minus B Looks At A（A 减 B 指向 A）”。\n\n这在 `Update()` 方法中很重要，因为 `Projectile`\
  \ 需要放置在从 `launchPos` 到当前 `mousePos3D` 的向量上，这个向量被命名为 `mouseDelta`。然而，`Projectile`\
  \ 沿着 `mouseDelta` 移动的距离限制为 `maxMagnitude`，即 `Slingshot` 上 `SphereCollider` 的半径（在\
  \ Inspector 的 Collider 组件中当前设置为 3m）。\n\n如果 `mouseDelta` 长度大于 `maxMagnitude`，其量级将被限制为\
  \ `maxMagnitude`。这是通过首先调用 `mouseDelta.Normalize()`（这会将 `mouseDelta` 的长度设置为 1 但保持其方向不变）然后将\
  \ `mouseDelta` 乘以 `maxMagnitude` 实现的。\n\n`projectile` 被移动到这个新位置，如果你运行游戏，你会看到 `Projectile`\
  \ 随着鼠标移动，但限制在一个特定的半径内。\n\n`Input.GetMouseButtonUp(0)` 仅在左鼠标键释放的第一帧返回 `true`。这意味着\
  \ `Update()` 结尾的 `if` 语句会在鼠标按钮释放的那帧执行。在这一帧中，`aimingMode` 被设置为 `false`。`projectile`\
  \ 的 `Rigidbody` 被设置为非运动（nonkinematic），允许它再次对重力做出响应。`projectile` 被赋予一个与它离 `launchPos`\
  \ 距离成比例的速度。最后，`projectile` 被重置为 `null`。这并没有删除已创建的 `Projectile` 实例，它只是让 `projectile`\
  \ 字段在下次发射发射时可以被另一个实例填充。\n\n## 5. 点击播放并看看弹弓弓的手感如何。`Projectile` 实例发射的速度合适吗？尝试在 Inspector\
  \ 中调整 `velocityMult`，看看哪个值让你觉得合适。我最终选定的值是 10。\n\n目前，`Projectile` 实例会非常快地飞出屏幕。让我们创建一个跟随相机，在\
  \ `Projectile` 飞行时追赶它。\n\n## 6. 保存你的场景。\n\n### 制作跟随相机\n\n我们需要 `Main Camera` 在 `Projectile`\
  \ 发射出时跟随它，但这种行为有点复杂。完整的行为应该是：\n\n1. 相机位于初始位置，并在 `aimingMode` 期间不移动。\n2. 一旦 `Projectile`\
  \ 发射出去，相机就跟随它（带有轻微的缓冲）。\n3. 随着相机移动到空中，增加 `orthographicSize` 以保持在视野内。\n4. 当 `Projectile`\
  \ 停止移动时，相机停止跟随并返回位置。\n\n按照以下步骤操作：\n\n1. 首先创建一个新脚本并命名为 *FollowCam*（*Assets > C# Script*）。将\
  \ *FollowCam* 拖到 `Main Camera` 上使其成为一个组件。\n2. 现在双击 *FollowCam* 脚本打开它并输入以下代码：\n\n\
  ```csharp\nusing UnityEngine;\nusing System.Collections;\n\npublic class FollowCam\
  \ : MonoBehaviour {\n    static FollowCam S;\n    public GameObject poi;\n    public\
  \ float camZ;\n\n    void Awake() {\n        S = this;\n        camZ = transform.position.z;\n\
  \    }\n\n    void Update() {\n        if (poi == null) return;\n        Vector3\
  \ destination = poi.transform.position;\n        destination.z = camZ;\n       \
  \ transform.position = destination;\n    }\n}\n```\n\n\n\n\n这一行使用 `FollowCam.S`\
  \ 单例来设置摄像机的 `poi` 值。新的 `poi` 将是新发射的 `Projectile`（射物体）。尝试点击播放并查看效果。\n\n你会注意到几个问题：\n\
  \n**A.** 如果你足够缩小场景（Scene）面板的视图，你会发现 `Projectile` 实际上飞过了 `Ground`（地面）的边缘。\n\n**B.**\
  \ 如果你向 `Ground` 射击，你会发现 `Projectile` 在命中 `Ground` 后既不反弹也不停止。如果在发射后立即暂停，在层级（Hierarchy）中选择\
  \ `Projectile`，然后取消暂停，你会看到它在击中 `Ground` 后一直在滚动且永不停止。\n\n**C.** 当 `Projectile` 发射时，相机会跳到\
  \ `Projectile` 的位置，这在视觉上非常突兀。\n\n**D.** 一旦 `Projectile` 达到某个高度，你看到的只有天空，因此很难判断 `Projectile`\
  \ 到底有多高。\n\n这些问题都将通过按照以下步骤依次修复（这些步骤通常从最容易修复到最难修复排序）。\n\n**1.** 首先，通过将 `Ground` 的变换（transform）设置为\
  \ `P:[100,-10,0] R:[0,0,0] S:[400,1,1]` 来修复问题 A。这将使 `Ground` 向右延伸得远得多。\n\n**2.**\
  \ 为了修复问题 B，需要为 `Projectile` 添加 Rigidbody 约束和 `Physic Material`（物理材质）。在项目（Project）面板中选择\
  \ `Projectile` 预制体。在 `Rigidbody` 组件中，点击 `Constraints` 旁边的展开小三角形，并勾选 `Freeze Position`\
  \ 的 `z` 以及 `Freeze Rotation` 的 `x`、`y`、`z`。`Freeze Position` `z` 将防止射物体靠近或远离相机（基本上让它保持与地面以及稍后添加的城堡在相同的\
  \ `z` 深度上）。`Freeze Rotation` `x`、`y`、`z` 将防止它翻滚。\n\n在此处，你还应该将 `Collision Detection`（碰撞检测）的弹出菜单设置为\
  \ `Continuous`（连续）。有关碰撞检测类型的信息，请点击 `Rigidbody` 组件右上角的帮助图标。简而言之，`continuous` 碰撞检测比\
  \ `discrete`（离散）消耗更多的处理器资源，但对于像 `Projectile` 这样快速移动的对象更准确。按下播放并再次尝试发射 `Projectile`。\n\
  \n**3.** 这些 `Rigidbody` 设置防止了 `Projectile` 无限滚动，但感觉仍然不对对。你的一生都在体验物理现象，这让你对那些感觉像自然、真实物理世界的行为有一种直观的感受。对你的玩家也是如此，这意味着尽管物理是一个需要大量数学建模的复杂系统，但如果你能让游戏的物理效果感觉像玩家熟悉的物理一样，你就不需要向他们解释那些数学了。\n\
  \n添加 `Physic Material` 可以让你的物理模拟对象感觉更加真实。从菜单栏中选择 `Assets > Create > Physic Material`。将此物理材质命名为\
  \ `PMat_Projectile`。点击 `PMat_Projectile` 并在检查器（Inspector）中将 `bounciness`（弹性）设置为\
  \ 1。然后将项目面板中的 `PMat_Projectile` 拖到 `Projectile` 预制体（同样在项目面板中）上，将其应用于 `Projectile.SphereCollider`。选择\
  \ `Projectile` 应该会发现检查器中的 `PMat_Projectile` 已被分配为 `Sphere Collider` 的 `material`。现在当你按下播放时，你会看到射物体反弹停止，而不是仅仅在地面上滑动。\n\
  \n**4.** 问题 C 将通过两种方式修复：通过插值进行平滑以及限制摄像机的位置。要开始平滑，向 `FollowCam` 中添加以下加粗的行：\n\n点击此处查看代码图\n\
  \n```csharp\n// Unity 检查器面板设置的字段\n\npublic float easing = 0.05f;\npublic bool _____________________________;\n\
  \n...\n\nVector3 destination = poi.transform.position;\n\n// 从当前相机位置向目标插值\n\ndestination\
  \ = Vector3.Lerp(transform.position, destination, easing);\n\n// 保留目标.z 为 camZ\n\
  ```\n\n`Vector3.Lerp()` 方法在两点之间进行插值，返回两者的加权平均值。如果 `easing` 为 0，`Lerp()` 将返回第一个点（`transform.position`）；如果\
  \ `easing` 为 1，`Lerp()` 将返回第二个点（`destination`）。如果 `easing` 是 0 到 1 之间的任何值，它将返回两者之间的一个点（`easing`\
  \ 为 0.5 时返回两者的中点）。通过设置 `easing = 0.05`，我们告诉 Unity 每一帧让相机从其当前位置向 `poi` 位置移动约 5%。因为\
  \ `poi` 是不断移动的，这为我们提供了非常平滑的相机跟随移动。尝试调整 `easing` 的值，看看它是如何影响相机移动的。这种对 `Lerp` 的使用方法是一种非常简单的、非基于时间的线性插值形式。关于线性插值的更多信息，你可以在\
  \ 附录 B 中阅读。\n\n**5.** 你现在可能注意到即使使用了这种平滑处理，相机移动中仍有轻微的闪烁和抖动。这是因为物理模拟以 50fps 的速率更新，而\
  \ `Update()` 方法被调用的频率更高。在使用这种平滑处理后，将 `Update()` 方法改为 `FixedUpdate()` 即可解决问题。\n\n\
  **6.** 现在，为 `FollowCam` 添加位置限制：\n\n**点击此处查看代码图](#part0071_split_008.html_p0466_01a)\n\
  \n```csharp\n// Unity 检查器面板设置的字段\n\npublic float easing = 0.05f;\npublic Vector2\
  \ minXY;\npublic bool _____________________________;\n\n...\n\nVector3 destination\
  \ = poi.transform.position;\n\n// 限制 X & Y 最小值\ndestination.x = Mathf.Max(minXY.x,\
  \ destination.x);\ndestination.y = Mathf.Max(minXY.y, destination.y);\n\n// 从当前相机位置向目标插值\n\
  ```\n\nVector2 `minXY` 的默认值为 `[0,0]`，这完美符合我们的需求。`Mathf.Max()` 选择传入两个值中的较大值。当射物体最初发射时，它的\
  \ x 和 y 坐标都是负数，因此 `Mathf.Max()` 确保相机不会在 x 或 y 轴上进入负区域。这还防止了射物体落地时相机掉进地下。\n\n**7.**\
  \ 问题 D 通过动态调整摄像机的 `orthographicSize`（正交大小）来修复。在 `FollowCam` 脚本中添加以下加粗的行：\n\n点击此处查看代码图\n\
  \n```csharp\ntransform.position = destination;\n\n// 设置摄像机的 orthographicSize 以保持地面在视野内\n\
  this.camera.orthographicSize = destination.y + 10;\n\n}\n```\n\n这之所以有效是因为我们知道 destination.y\
  \ 永远不会允许小于 0。因此，最小 `orthographicSize` 为 10，摄像机的 `orthographicSize` 将根据需要扩大，以始终保持地面在视野内。在层级中双击\
  \ `Ground` 以缩小视图并在场景面板中显示整个物体。然后选择 `Main Camera`，按下播放并发射一个 `Projectile`。在场景面板中，你会看到摄像机的视野随着\
  \ `Projectile` 的飞行而平滑扩大。\n\n**8.** 保存你的场景。\n\n#### 视觉运动与速度感\n\n\n\n\n\n现在 `FollowCam`\
  \ 移动得很不错了，但仍然很难看出 `Projectile` 移动有多快，特别是当它处于高空时。为了解决这个问题，我们将利用*速度感*（vection）这一概念。速度感是指当你看到其他物体快速掠过时产生的运动感，它是导致\
  \ 2D 视频游戏中出现*视差滚动*（parallax scrolling）的概念基础。在 2D 游戏中，视差滚动会导致前景物体掠过得很快，而背景物体相对于主摄像机的运动移动得较慢。虽然完整的视差系统超出了本教程的范围，但通过创建许多云并让它们随机分布在空中，至少可以获得简单的速度感感受。当\
  \ `Projectile` 穿过它们时，玩家会有更强的运动感。\n\n### 制作云朵艺术\n\n为了实现这一效果，你需要制作一些简单的云：\n\n1. 首先创建一个新的球体（`GameObject\
  \ > Create Other > Sphere`）。将鼠标悬停在 `Inspector` 面板中球体的 `Sphere Collider` 组件名称上。右键点击并从弹出菜单中选择\
  \ `Remove Component`。将球体的 `Transform.Position` 设置为 `[0,0,0]`，以便它在 `Game` 面板和 `Scene`\
  \ 面板中可见。将 `Sphere` 重命名为 `CloudSphere`。\n\n2. 创建一个新的材质并命名为 `Mat_Cloud`（`Assets >\
  \ Create > Material`）。将 `Mat_Cloud` 拖到 `CloudSphere` 上，然后在 `Project` 面板中选择 `Mat_Cloud`。从\
  \ `Inspector` 中 `Shader` 旁的弹出菜单中，选择 `Self-Illumin > Diffuse`。这种着色器是自光的（它产生自己的光），并且对场景中的方向光有响应。点击\
  \ `Mat_Cloud` `Inspector` 中 `Main Color` 旁边的颜色块，将其设置为 65% 的灰色（或 Unity 颜色选择器中的 `RGBA`\
  \ `[166,166,166,255]`）。这会在 `Game` 面板左下角有一点灰色，看起来有点像阳光下的云。\n\n3. 将 `CloudSphere`\
  \ 拖到 `Project` 面板使其成为预制体（prefab），然后将多个 `CloudSphere` 实例拖入 `Hierarchy` 面板，并调整位置和缩放，使其看起来有点像云的物体。创建一个空的\
  \ `GameObject`（`GameObject > Create Empty`），将其重命名为 `Cloud_0`，并将它的变换设置为 `P:[0,0,0]`、`R:[0,0,0]`、`S:[1,1,1]`。将\
  \ `Cloud_0` 设置为 `CloudSphere` 组的父级（通过将它们全部在 `Hierarchy` 中拖到它下方）。尝试确保 `CloudSpheres`\
  \ 聚集在父级 `Cloud_0` 周。每个 `CloudSphere` 在 `Inspector` 中的位置在每个维度（`x`, `y`, & `z`）上应处于\
  \ -2 到 2 之间。将 `Cloud_0` 拖到 `Project` 面板使其成为预制体。然后从 `Hierarchy` 中删除剩余的 `Cloud_0`\
  \ 实例。\n\n4. 点击 `Project` 面板中的 `Cloud_0`并通过按 `Command-D`（Windows 上的 `Control+D`）对其进行复制。副本将自动命名为\
  \ `Cloud_1`。将 `Cloud_1` 拖入 `Hierarchy` 以在 `Scene` 面板中放置它的实例。选择 `Cloud_1` 中的每个 `CloudSpheres`\
  \ 并根据你的意愿缩放和重新定位它们，以制作看起来不同的云。当你满意时，在 `Hierarchy` 中选择 `Cloud_1`，点击 `Apply` 按钮（位于\
  \ `Cloud_1` `Inspector` 顶部 `Prefab` 单词右侧）。这将把你所做的更改应用回 `Cloud_1` 预制体。\n\n5. 重复这种复制、修改和应用过程，总共创建五个命名为\
  \ `Cloud_0` 到 `Cloud_4` 的不同云。你可以制作你需要的任何数量的云，但五个对于我们的目的已经足够了。完成后，如果你向 `Hierarchy`\
  \ 中添加每种云的实例，它看起来应该像 图 29.8。\n\n![Image](img/00169.jpeg)\n\n**图 29.8** 由 `CloudSpheres`\
  \ 组成的分级 `Cloud_#s` 示例图像\n\n6. 你也可以在 图 29.8 中看到我添加了文件夹来组织我的 `Project` 面板。我通常在项目的最开始就会这样做，但等到现在是为了让你体验项目一旦组织好后感觉会好多少。通过菜单栏选择\
  \ `Assets > Create > Folder` 创建文件夹。我创建的文件夹命名为 `__Scripts`、`_Materials` 和 `_Prefabs`。名称中的下划线有助于将其排在任何非文件夹资产的上方，而\
  \ `__Scripts` 文件夹的双下划线确保了它是 `Project` 面板中的顶层文件夹。创建这些文件夹后，将 `Project` 面板中的相应资源拖入它们。这将同时在你的硬盘项目\
  \ `Assets` 文件夹内创建创建对应的文件夹，因此不仅你的 `Project` 面板，你的 `Assets` 文件夹也将变得有序。\n\n7. 现在，删除\
  \ `Hierarchy` 面板中的 `Cloud_#s` 实例。创建一个名为 `CloudAnchor` 的新空 `GameObject`（`GameObject\
  \ > Create Empty`）。这将为我们提供所有 `Cloud_#s` 父级的 GameObject，从而在游戏运行时保持 `Hierarchy` 的整洁。\n\
  \n8. 创建一个名为 `CloudCrafter` 的新 C# 脚本。将 `CloudCrafter` 拖入 `__Scripts` 文件夹，并将其拖到 `_Main\
  \ Camera` 上。这将为 `Main Camera` 添加第二个 `Script` 组件，这在 Unity 中是完全没问题的，只要两个脚本互不冲突（例如，只要它们没有每帧都尝试设置\
  \ GameObject 的位置）。因为 `FollowCam` 正在移动摄像，而 `CloudCrafter` 只是将 `Cloud_#s` 放置在空中，它们不应该产生任何冲突。在\
  \ `CloudCrafter` 中输入以下代码：\n\n```csharp\nusing UnityEngine;\n\nusing System.Collections;\n\
  \npublic class CloudCrafter : MonoBehaviour {\n\n    // 在 Unity Inspector 面板中设置的字段\n\
  \n    public int numClouds = 40;           // 要制作的云的数量\n    public GameObject[]\
  \ cloudPrefabs;   // 云预制体\n    public Vector3 cloudPosMin;         // 云的最小位置\n \
  \   public Vector3 cloudPosMax;         // 云的最大位置\n    public float cloudScaleMin\
  \ = 1;      // 云的最小缩放\n    public float cloudScaleMax = 5;      // 云的最大缩放\n    public\
  \ float SpeedMult = 0.5f;       // 云的速度系数\n    GameObject[] cloudInstances;\n\n\
  \    void Awake() {\n        // 创建足够容所有实例的数组\n        cloudInstances = new GameObject[numClouds];\n\
  \        // 找到 CloudAnchor\n        GameObject anchor = GameObject.Find(\"CloudAnchor\"\
  );\n        // 迭代并制作\n        for (int i=0; i<numClouds; i++) {\n            //\
  \ 在 0 到 cloudPrefabs.Length-1 之间随机选择一个\n            int prefabNum = Random.Range(0,cloudPrefabs.Length);\n\
  \            // 实例化\n            cloud = Instantiate(cloudPrefabs[prefabNum]) as\
  \ GameObject;\n            // 定位云\n            Vector3 cPos = Vector3.zero;\n  \
  \          cPos.x = Random.Range(cloudPosMin.x, cloudPosMax.x);\n            cPos.y\
  \ = Random.Range(cloudPosMin.y, cloudPosMax.y);\n            // 缩放云\n          \
  \  float scaleU = Random.value;\n            float scaleVal = Mathf.Lerp(cloudScaleMin,\
  \ cloudScaleMax, scaleU);\n            // 较小的云（scaleU 较小）应该靠近地面\n            cPos.y\
  \ = Mathf.Lerp(cloudPosMin.y, cPos.y, scaleU);\n            // 较小的云应该更远\n      \
  \      cPos.z = 100 - 90*scaleU;\n            // 将这些变换应用到云\n            cloud.transform.position\
  \ = cPos;\n            cloud.transform.localScale = Vector3.one * scaleVal;\n  \
  \          // 将云设置为 anchor 的子级\n            cloud.transform.parent = anchor.transform;\n\
  \        }\n    }\n}\n```\n\n\n\n\n```csharp\n// 将云添加到 cloudInstances 中\ncloudInstances[i]\
  \ = cloud;\n\n        }\n    }\n\n    void Update() {\n        // 遍历每个创建的云\n   \
  \     foreach (GameObject cloud in cloudInstances) {\n            // 获取云的缩放和位置\n\
  \            float scaleVal = cloud.transform.localScale.x;\n            Vector3\
  \ cPos = cloud.transform.position;\n            // 让较大的云移动得更快\n            cPos.x\
  \ -= scaleVal * Time.deltaTime * cloudSpeedMult;\n            // 如果云向左移动得太远……\n\
  \            if (cPos.x <= cloudPosMin.x) {\n                // 将它移动到最右侧\n     \
  \           cPos.x = cloudPosMax.x;\n            }\n            // 将新位置应用到云\n  \
  \          cloud.transform.position = cPos;\n        }\n    }\n}\n```\n\n这里有几个字段必须在\
  \ Inspector（检查器）中设置。它们应该被设置为图 29.9 所示所示的值。要设置 `cloudPrefabs`，点击变量名 *Cloud Prefabs*\
  \ 旁边的折叠小三角形，并在 *Size* 中输入 5。然后，将 Project 格中每个编号的 `Cloud_ prefab` 拖入 `cloudPrefabs`\
  \ 的五个 *Element* 槽位中。\n\n![Image](img/00170.jpeg)\n\n**图 29.9** CloudCrafter Script\
  \ 组件的设置\n\n**9.** 保存你的场景。\n\n在 `CloudCrafter` 类中，`Awake()` 方法创建所有云并为它们设置位置。`Update()`\
  \ 方法每帧让每朵云向左移动一一点。当云向左移动过 `cloudPosMin.x` 时，它会被移动到右侧的 `cloudPosMax.x`。在 Scene（场景）面板中缩小视图，观察云朵的飘过。现在，当你发射一个物体（Projectile）时，云掠过的速度感会让你感觉更像物体真的在移动。\n\
  \n### 建造城堡\n\n破坏任务（Mission Demolition）需要可以摧毁的东西，所以让我们建造一座城堡作为目标。图 29.11 展示了最终城堡应该的样子。\n\
  \n**1.** 调整 Scene 面板，点击 z 轴相反轴向工具（axes gizmo）上的箭头，从等轴测角的背面查看场景（参见图 29.10）。\n\n![Image](img/00171.jpeg)\n\
  \n**图 29.10** 选择背面视图\n\n**2.** 现在，双击 Hierarchy 中的 *Main Camera*，将 Scene 面板视图缩放到一个适合建造城堡的视野。\n\
  \n**3.** 创建一个空 GameObject 作为城堡的根节点（`GameObject > Create Empty`）。将其命名为 *Castle*，并将\
  \ transform 设置为 `P:[0,-9.5,0] R:[0,0,0] S:[1,1,1]`。这将为构造提供良好的位置，并让底座恰好停在 Ground（地面）上。\n\
  \n**4.** 制作城堡的垂直墙：\n\n**4.1.** 创建一个新的立方体（`GameObject > Create Other > Cube`）并将其重命名为\
  \ *Wall_Stone*。\n\n**4.2.** 将其拖到 Hierarchy 中的 `Castle` 上，使其成为 `Castle` 的子物体。\n\n\
  **4.3.** 为 *Wall_Stone* 添加 `Rigidbody` 组件（`Component > Physics > Rigidbody`）。使用\
  \ Inspector 将 `Rigidbody.FreezePosition.z` 设置为 `true` 以约束 `Wall_Stone` 的 z 位置。将\
  \ `Rigidbody.mass` 设置为 4。\n\n**4.4.** 将 `Wall_Stone` 的 Transform 设置为 `P:[-2,2,0]\
  \ R:[0,0,0] S:[1,4,1]`。\n\n**4.5.** 将 `Wall_Stone` 拖入 Project 面使其成为制制体（确保将其放入 *Prefabs*\
  \ 文件夹中）。\n\n**4.6.** 在 Hierarchy 中创建三个 `Wall_Stone` 的副本，并将它们的 x 位置分别设置为 -6、2 和 6。这将形成城堡第一楼的\
  \ 4 堵垂直墙。\n\n**5.** 制作形成第一层天花板的水平墙。\n\n**5.1.** 创建另一个立方体并将其命名为 *Wall_Stone_H*（代表“Horizontal”水平的）。\n\
  \n**5.2.** 将 *Wall_Stone_H* 为 `Castle` 的子物体，并将 transform 设置为 `P:[0,4.25,0] R:[0,0,0]\
  \ S:[4,0.5,1]`。\n\n**5.3.** 为 *Wall_Stone_H* 添加 `Rigidbody` 组件（`Component > Physics\
  \ > Rigidbody`）。通过将 `Rigidbody.FreezePosition.z` 设置为 `true` 来约束 `Wall_Stone_H` 的\
  \ z 位置。将 `Rigidbody.mass` 设置为 4。\n\n**5.4.** 将 *Wall_Stone_H* 制制体并放置在 *Prefabs*\
  \ 文件夹中。\n\n**5.5.** 在 Hierarchy 中创建两个 *Wall_Stone_H* 的副本，x 位置分别为 -4 和 4。\n\n**6.**\
  \ 要制作城堡的第二楼，使用鼠标选择第一楼的三个相邻的 `Wall_Stones` 以及它们上面的两个 `Wall_Stone_Hs`。复制它们（使用 `Command-D`\
  \ 或 `Control+D`）并将它们移动到停在其他墙体上方。你需要调整它们的位置，新墙体的最终位置如下：\n\n![Image](img/00172.jpeg)\n\
  \n**7.** 继续复制技巧通过添加三堵垂直墙和一堵水平墙来制作第三楼：\n\n![Image](img/0173.jpeg)\n\n**8.** 添加到 `Castle`\
  \ 的最后一个 GameObject 是玩家用物体击中的的目标（goal）。\n\n**8.1.** 创建立方体，命名为 *Goal*，使其成为 `Castle`\
  \ 的子物体，并将 transform 设置为 `P:[0,2,0] R:[0,0,0] S:[3,4,4]`。\n\n**8.2.** 创建名为 `Mat_Goal`\
  \ 的材质。将其拖到 `Goal` 上。选择 `Mat_Goal` 并应用。\n\n**8.3.** 在 Hierarchy 中选择 `Goal`并将 `BoxCollider`\
  \ 设置为 `true`。\n\n**8.4.** 将 `Goal` 拖入 *Prefabs* 文件夹。\n\n**9.** 使用 prefab 构建城堡的优点之一是可以轻松更改\
  \ `Wall_Stone`。在 Project 面中选择 `Wall_Stone` prefab 并设置其缩放。\n\n**10.** 保存场景。\n\n###\
  \ 返回再次射击\n\n现在有城堡可以推倒了，是时候添加一些逻辑了。当物体平稳后，相机应该向后移动：\n\n```csharp\nvoid FixedUpdate()\
  \ {\n    Vector3 destination;\n    // 如果没有目标（poi），则返回 [0,0]\n    if (poi == null)\
  \ {\n        destination = Vector3.zero;\n    } else {\n        // 获取目标的位置\n   \
  \     destination = poi.transform.position;\n        // 如果目标是物体（Projectile），检查它是否静止\n\
  \        if (poi.tag == \"Projectile\") {\n            // 如果它处于睡眠状态（即没有在移动）\n  \
  \          if (poi.rigidbody.IsSleeping()) {\n                // 返回默认视图\n      \
  \          poi = null;\n                // 在下一次更新返回\n                return;\n \
  \           }\n        }\n    }\n    // 限制 X & Y 为最小值\n    this.camera.orthographicSize\
  \ = destination.y + 10;\n}\n```\n\n\n\n\n虽然 Unity 确实内置了 `Trail Renderer` 效果，但它并不能真正满足我们的需求，因为我们需要对轨迹进行比它允许的更多的控制。相反，我们将利用构建\
  \ `Trail Renderer` 的 `Line Renderer` 组件：\n\n### 1. 首先创建一个空游戏对象（`GameObject > Create\
  \ Empty`）并将其命名为 `ProjectileLine`。添加 `Line Renderer` 组件（`Components > Effects > Line\
  \ Renderer`）。在 `ProjectileLine` 的 `Line Renderer` 检查器中，展开 `Materials` 和 `Parameters`\
  \ 的显示三角形。将它们设置为图 29.12 所示的设置。\n\n![Image](img/00175.jpeg)\n\n**图 29.12** ProjectLine\
  \ 的设置\n\n### 2. 创建 C# 脚本（`Asset > Create > C# Script`），命名为 `ProjectileLine` 并将其附加到\
  \ `ProjectileLine` 游戏对象。在 MonoDevelop 中打开 `ProjectileLine` 脚本并编写以下代码：\n\n点击此处查看代码图像\n\
  \n```csharp\nusing UnityEngine;\nusing System.Collections;\n// 记住，使用列表需要此行\nusing\
  \ System.Collections.Generic;\n\npublic class ProjectileLine : MonoBehaviour {\n\
  \    static public ProjectileLine S; // 单例\n\n    // 在 Unity Inspector 面中设置的字段\n\
  \    public float minDist = 0.1f;\n    public bool ____________________________;\n\
  \n    // 动态设置的字段\n    public LineRenderer line;\n    private GameObject _poi;\n\
  \    public List<Vector3> points;\n\n    void Awake() {\n        S = this; // 设置单例\n\
  \        // 获取 LineRenderer 的引用\n        line = GetComponent<LineRenderer>();\n\
  \        // 在需要之前禁用 LineRenderer\n        line.enabled = false;\n        // 初始化点列表\n\
  \        points = new List<Vector3>();\n    }\n\n    // 这是一个属性（即伪装成字段的方法）\n    public\
  \ GameObject poi {\n        get {\n            return( _poi );\n        }\n    \
  \    set {\n            _poi = value;\n            if ( _poi != null ) {\n     \
  \           // 当 _poi 设置为新值时，重置所有内容\n                line.enabled = false;\n   \
  \             points = new List<Vector3>();\n                AddPoint();\n     \
  \       }\n        }\n    }\n\n    // 这可以直接清除线条\n    public void Clear() {\n   \
  \     _poi = null;\n        line.enabled = false;\n        points = new List<Vector3>();\n\
  \    }\n\n    public void AddPoint() {\n        // 调用此方法向线条添加一个点\n        Vector3\
  \ pt = _poi.transform.position;\n        if (points.Count > 0 && (pt - lastPoint).magnitude\
  \ < minDist) {\n            // 如果点距离上一个点不够，则返回\n            return;\n        }\n\
  \        if (points.Count == 0) {\n            // 如果是发射点\n            Vector3 launchPos\
  \ = Slingshot.S.launchPoint.transform.position;\n            Vector3 launchDiff\
  \ = pt - launchPos;\n            //... 添加额外的线条以帮助瞄准\n            points.Add(pt +\
  \ launchDiff);\n            points.Add(pt);\n            line.VertexCount(2);\n\
  \            // 设置起始点\n            line.SetPosition(0, points[0]);\n           \
  \ line.SetPosition(1, points[1]);\n            // 启用 LineRenderer\n            line.enabled\
  \ = true;\n        } else {\n            // 添加点的正常行为\n            points.Add(pt);\n\
  \            line.VertexCount(points.Count);\n            line.SetPosition(points.Count-1,\
  \ lastPoint);\n            line.enabled = true;\n        }\n    }\n\n    // 返回最后添加的一个点的位置\n\
  \    public Vector3 lastPoint {\n        get {\n            if (points == null)\
  \ {\n                // 如果没有点，返回 Vector3.zero\n                return( Vector3.zero\
  \ );\n            }\n            return( points[points.Count-1] );\n        }\n\
  \    }\n\n    void FixedUpdate() {\n        if ( poi == null ) {\n            //\
  \ 如果没有 poi，则搜索一个\n            if (FollowCam.S.poi != null) {\n                if\
  \ (FollowCam.S.poi.tag == \"Projectile\") {\n                    poi = FollowCam.S.poi;\n\
  \                } else {\n                    return; // 如果没有找到 poi 则返回\n     \
  \           }\n            } else {\n                return; // 如果没有找到 poi 则返回\n\
  \            }\n        }\n        // 如果有 poi，它的位置每个 FixedUpdate 都会添加\n        AddPoint();\n\
  \        if (poi.rigidbody.IsSleeping()) {\n            // 一旦 poi 进入睡眠状态，将其清除\n\
  \            poi = null;\n        }\n    }\n}\n```\n\n### 3. 你还需要在 `Slingshot` C#\
  \ 脚本中添加一个单例。这将允许 `AddPoint()` 引用 `Slingshot` `launchPoint` 的位置：\n\n点击此处查看代码图像\n\n\
  ```csharp\npublic class Slingshot : MonoBehaviour {\n    static public Slingshot\
  \ S;\n    // 在 Unity Inspector 面中设置的字段\n    ...\n    void Awake() {\n        //\
  \ 设置 Slingshot S\n        S = this;\n        Transform launchPointTrans = transform.FindChild(\"\
  LaunchPoint\");\n    }\n}\n```\n\n现在当你运行游戏时，你应该会看到一条漂亮的灰色线条，描出弹物体移动时的路径。线条会在每次后续射击时被替换。\n\
  \n### 4. 保存你的场景。\n\n#### 击中目标\n城堡的目标在被弹物体击中时需要反应：\n\n**1.** 创建一个名为 `Goal` 的新 C#\
  \ 脚本并将其附加到 `Goal` 制体上。在 `Goal` 脚本中输入以下代码。\n\n点击此处查看代码图像\n\n```csharp\nusing UnityEngine;\n\
  using System.Collections;\n\npublic class Goal : MonoBehaviour {\n    // 代码任何地方都可以访问的静态字段\n\
  \    static public bool goalMet = false;\n    void OnTriggerEnter(Collider other)\
  \ {\n        // 当触发器被物体击中时\n        // 检查是否是弹物体\n        if (other.gameObject.tag\
  \ == \"Projectile\") {\n            // 如果是，将 goalMet 设置为 true\n            goalMet\
  \ = true;\n            // 同时设置颜色的不透明度\n            Color c = renderer.material.color;\n\
  \            c.a = 1;\n            renderer.material.color = c;\n        }\n   \
  \ }\n}\n```\n\n现在当你发射时，如果击中了目标，它将变成绿色。\n\n**2.** 保存你的场景。\n\n#### 添加更多关卡和逻辑\n单个城堡到目前表现良好，但让我们多添加几个。\n\
  \n**1.** 将城堡重命名为 `Castle_0` 并拖入项目面板使其变为制体。\n\n**2.** 复制 `Castle_0`（它将命名为 `Castle_1`）。\n\
  \n**3.** 将 `Castle_1` 放入场景，并更改其布局。如果你删除了其中一面墙，很可能会“丢失制体”。这完全没。按照你喜欢的方式构建 `Castle_1`，然后删除项目面板中的\
  \ `Castle_1` 制体，从层级面板拖入新的 `Castle_1`。\n\n**4.** 重复此过程制作几个不同的城堡。图 29.13 显示了我制作的几个。\n\
  \n![Image](img/00176.jpeg)\n\n**图 29.13** 更多城堡\n\n**5.** 保存你的场景。\n\n**6.** 在场景中添加一个\
  \ GUIText（`GameObject > Create Other > GUIText`）并命名为 `GT_Level`。创建第二个 GUIText 并命名为\
  \ `GT_Score`。给每个对象设置图 29.14 所示的设置。\n\n![Image](img/00177.jpeg)\n\n**图 29.14** GT_Level\
  \ 和 GT_Score 的设置\n\n**7.** 创建一个新的空游戏对象（`GameObject > Create Empty`）并命名为 `ViewBoth`。将\
  \ `ViewBoth` 的变换设置为 P:[25,25,0] R:[0,0,0] S:[1,1,1]。这将作为当我们想要查看城堡和弹发射时摄像机的 `poi`。\n\
  \n**8.** 创建一个名为 `MissionDemolition` 的新 C# 脚本并附加到 `_Main Camera`。这将作为游戏的游戏状态管理器。打开它并编写以下代码：\n\
  \n\n\n\n\n点击此处查看代码图像\n\n```csharp\nusing UnityEngine;\n\nusing System.Collections;\n\
  \npublic enum GameMode\n{\n    idle,\n    playing,\n    levelEnd\n}\n\npublic class\
  \ MissionDemolition : MonoBehaviour\n{\n    static public MissionDemolition S; //\
  \ 一个单例\n    // 在 Unity Inspector 面板设置的字段\n    public GameObject[] castles; // 城堡数组\n\
  \    public GUIText gtLevel; // GT_Level GUIText\n    public GUIText gtScore; //\
  \ GT_Score GUIText\n    public Vector3 castlePos; // 放置城堡的位置\n    public bool _____________________________;\n\
  \    // 动态设置的字段\n    public int level; // 当前关卡\n    public int levelMax; // 关卡总\n\
  \    public int shotsTaken;\n    public GameObject castle; // 当前城堡\n    public GameMode\
  \ mode = GameMode.idle;\n    public string showing = \"Slingshot\"; // 随动相机\n  \
  \  void Start()\n    {\n        S = this; // 定义单例\n        level = 0;\n        levelMax\
  \ = castles.Length;\n        StartLevel();\n    }\n    void StartLevel()\n    {\n\
  \        // 如果旧城堡存在则销毁\n        if (castle != null)\n        {\n            Destroy(castle);\n\
  \        }\n        // 如果弹体存在则销毁\n        GameObject[] gos = GameObject.FindObjectsWithTag(\"\
  Projectile\");\n        foreach (GameObject pTemp in gos)\n        {\n         \
  \   Destroy(pTemp);\n        }\n        // 实例化新城堡\n        castle = Instantiate(castles[level])\
  \ as GameObject;\n        castle.transform.position = castlePos;\n        shotsTaken\
  \ = 0;\n        // 重置相机\n        SwitchView(\"Both\");\n        ProjectileLine.S.Clear();\n\
  \        // 重置目标\n        Goal.goalMet = false;\n        ShowGT();\n        mode\
  \ = GameMode.playing;\n    }\n    void ShowGT()\n    {\n        // 在 GUI 中显示数据\n\
  \        gtLevel.text = \"Level: \" + (level+1) + \" of \" + levelMax;\n       \
  \ gtScore.text = \"Shots Taken: \" + shotsTaken;\n    }\n    void Update()\n   \
  \ {\n        ShowGT();\n        // 检查关卡是否结束\n        if (mode == GameMode.playing\
  \ && Goal.goalMet)\n        {\n            // 模式以停止检查关卡结束\n            mode = GameMode.levelEnd;\n\
  \            // 缩小视角\n            SwitchView(\"Both\");\n            // 2 秒后开始下一关卡\n\
  \            Invoke(\"NextLevel\", 2f);\n        }\n    }\n    void NextLevel()\n\
  \    {\n        level++;\n        if (level == levelMax)\n        {\n          \
  \  level = 0;\n        }\n        StartLevel();\n    }\n    void OnGUI()\n    {\n\
  \        // 在屏幕顶部绘制用于切换视图的 GUI 按钮\n        Rect buttonRect = new Rect((Screen.width/2)-50,\
  \ 10, 100, 24);\n        switch (showing)\n        {\n            case \"Slingshot\"\
  :\n                if (GUI.Button(buttonRect, \"Show Castle\"))\n              \
  \  {\n                    SwitchView(\"Castle\");\n                }\n         \
  \       break;\n            case \"Castle\":\n                if (GUI.Button(buttonRect,\
  \ \"Show Both\"))\n                {\n                    SwitchView(\"Both\");\n\
  \                }\n                break;\n            case \"Both\":\n       \
  \         if (GUI.Button(buttonRect, \"Show Slingshot\"))\n                {\n \
  \                   SwitchView(\"Slingshot\");\n                }\n            \
  \    break;\n        }\n    }\n    // 允许任何地方请求切换视图的静态方法\n    static public void\
  \ SwitchView(string eView)\n    {\n        S.showing = eView;\n        switch (S.showing)\n\
  \        {\n            case \"Slingshot\":\n                FollowCam.S.poi = null;\n\
  \                break;\n            case \"Castle\":\n                FollowCam.S.poi\
  \ = S.castle;\n                break;\n            case \"Both\":\n            \
  \    FollowCam.S.poi = GameObject.Find(\"ViewBoth\");\n                break;\n\
  \        }\n    }\n    // 允许任何地方增加 shotsTaken 值的静态方法\n    public static void ShotFired()\n\
  \    {\n        S.shotsTaken++;\n    }\n}\n```\n\n### 9. 现在在 `MissionDemolition`\
  \ 类中有一个静态的 `ShotFired()` 方法，可以从 `Slingshot` 类中调用它。在 `Slingshot` C# 脚本中添加以下**粗体**行：\n\
  \n点击此处查看代码图像\n\n```csharp\npublic class Slingshot : MonoBehaviour\n{\n    ...\n\
  \    void Update()\n    {\n        ...\n        if (Input.GetMouseButtonUp(0))\n\
  \        {\n            ...\n            projectile = null;\n            MissionDemolition.ShotFired();\n\
  \        }\n    }\n}\n```\n\n由于由于 `MissionDemolition` 上的 `ShotFired()` 方法是静态的，可以通过\
  \ `MissionDemolition` 类本身进行访问，而不需要通过 `MissionDemolition` 的特定实例进行访问。当 `Slingshot`\
  \ 调用 `MissionDemolition.ShotFired()` 时，会导致 `MissionDemolition.S.shotsTaken` 增加。\n\
  \n### 10. 返回 Unity 并在层级（Hierarchy）中选择 *Main Camera*。在 *MissionDemolition* (Script)\
  \ 组件 Inspector 中，你需要设置几个变量。\n\n**10.1.** 首先，将 `castlePos` 设置为 `[50,-9.5,0]`，这将城堡放置在距离你的\
  \ `Slingshot` 较远的地方。\n\n**10.2.** 要设置 `gtLevel`，点击 Inspector 中 `gtLevel` 右侧的目标，并在弹出的对话框的\
  \ Scene 选项卡中选择 `GT_Level`。\n\n**10.3.** 点击 Inspector 中 `gtScore` 旁边的目标，从 Inspector\
  \ 中选择 `GT_Score`。\n\n**10.4.** 接下来，点击 `castles` 旁边的收叠三角形，将其长度设置为你制作的城堡数量。（在 图 29.15\
  \ 的示例中，我制作了四个城堡。）\n\n![图像](img/0178.jpeg)\n\n**图 29.15** 为 *Main Camera* 的最终设置（带有城堡数组）\n\
  \n**10.5.** 将每个带有编号的城堡制体（prefab）拖入 `castles` 数组元素中，为你的游戏设置关卡。尝试从易到难对它们排序。\n\n**10.6.**\
  \ 保存场景并按下 Play。现在游戏将运行各个关卡，并记录你发射了多少次子。\n\n### 总结\n\n拆除任务（Mission Demolition）原型就此结束了。在短短一个章节中，你就制作了一个像*愤怒的小鸟*那样的基于物理的游戏，你可以对其进行持续的改进和扩展。本教程以及后续所有的教程实际上都是框架，你可以在此基础上构建任何你想要的游戏，你还可以添加许多额外功能，其中一些包括：\n\
  \n1. 使用 `PlayerPrefs` 存储每个关卡的最高分，就像在 Apple Picker 中做的那样。\n2. 使用各种材料制作城堡部分，某些材料的质量较大或较小。某些材料在受到足够撞击时甚至会破碎。\n\
  3. 显示多条之前的路径的线条，而不仅仅是最近的一条。\n4. 使用 `LineRenderer` 绘制弹弓的皮筋。\n5. 对背景云实现真正的视差滚动，并添加更多背景元素，如山脉或建筑。\n\
  6. 射击次数，如果玩家在仅 3 次射击内未命中目标则输关。增加这种风险增加了游戏的紧张感和刺激感。\n7. 你任何想要的东西！\n\n### 下一步骤\n\n\
  在完成其他原型开发后，回到这个原型并思考你可以添加什么。创建自己的设计，展示给别人看，并通过迭代改进游戏。如果你做了一个你不喜欢的修改，不要因此气馁；只需将其视为经验并尝试其他方法。\n\
  \n## 第 30 章。原型 3：太空 SHMUP\n\nSHMUP（或射击游戏）游戏类型包含了 20 世纪 80 年代的经典游戏如 *Galaga* 和 *Galaxian*，以及现代杰作\
  \ *Ikaruga*。\n\n\n\n\n在本章中，你将使用多种编程技术创建一个卷射击游戏（SHMUP），这些技术在你未来的编程和原型开发职业中将受益浅，包括类继承、枚举、静态字段和方法以及单例模式。虽然你之前已经见过其中许多技术，但在本原型中，它们将被更广泛地使用。\n\
  \n### 入门：原型 3\n\n在这个项目中，你将为一款经典的太空题材卷射击游戏创建一个原型。图 30.1 展示了完成后的原型的两张图片。在这两张图中，玩家已经升级了武器，并击败了一些敌机（并留下了标记为\
  \ B、O 和 S 的强化方块）。在左图中，她正在使用发射器武器；在右图中，她正在使用散弹武器。\n\n![Image](img/00179.jpeg)\n\n\
  **图 30.1** 太空射击游戏原型的两种视觉视角\n\n#### 导入 Unity 资源包\n\n此原型设置中的一个新变化是，你将被要求下载并导入自定义的\
  \ Unity 资源包。为游戏创建复杂的艺术和图像超出了本书的范围，但我为你创建了一个包含简单资源的包，它将允许你创建此游戏所需的所有视觉效果。当然，正如书中多次提到的，当你在制作原型时，游戏玩起来的体验和手感比外表重要得多，但理解如何处理艺术资源仍然很重要。\n\
  \n***\n\n### 为本章设置项目\n\n按照标准的项目设置流程，在 Unity 中创建一个新项目。如果你需要复习此流程，请参阅附录 A 中的“标准项目设置程序”。\n\
  \n![Image](img/00003.jpeg) **项目名称：** Space SHMUP Prototype（太空射击原型）\n\n![Image](img/00003.jpeg)\
  \ **场景名称：** `Scene_0`\n\n![Image](img/00003.jpeg) **项目文件夹：** `Scripts`、`_Materials`、`_Prefabs`\n\
  \n![Image](img/00003.jpeg) **下载并导入包：** 在 [`book.prototools.net`](http://book.prototools.net)\
  \ 查找第 30 章\n\n![Image](img/00003.jpeg) **C# 脚本名称：**（暂无）\n\n![Image](img/00003.jpeg)\
  \ **重命名：**将 Main Camera 更改为 `_MainCamera`\n\n***\n\n要下载并安装侧边栏“为本章设置项目”中提到的包，请先访问列出的\
  \ URL（[`book.prototools.net`](http://book.prototools.net)）并搜索本文。将 `Chapter30.unitypackage`\
  \ 下载到你的电脑上，它通常会放在你的“下载”文件夹中。在 Unity 中打开你的项目，并从菜单栏选择 `Assets > Import Package > Custom\
  \ Package`。从“下载”文件夹中导航并选择 `Chapter30.unitypackage`。这将打开如图 30.2 所示的导入对话框。\n\n![Image](img/00180.jpeg)\n\
  \n**图 30.2** .unitypackage 导入对话框\n\n如图 30.2 所示选择所有文件，并点击 `Import`。这将四个新的纹理和一个新的着色器放入\
  \ `_Materials` 文件夹中。纹理的创建超本书范围，但许多书籍和在线教程涵盖了纹理创建。Adobe Photoshop 可能是最常用的图像编辑工具，但它非常贵。一个常见的开源替代方案是\
  \ Gimp ([`www.gimp.org`](http://www.gimp.org))。\n\n着色器（Shaders）的创建也远超本书范围。着色器是告诉计算机如何在\
  \ `GameObject` 上渲染纹理的程序。它们可以让场景看起来真实、卡通或任何你喜欢的风格，并且是任何现代游戏图形的重要部分。Unity 使用它自己独特的着色器语言，称为\
  \ `ShaderLab`。如果你想了解更多关于它的信息，很好的起点是 Unity Shader 参考文档（[`docs.unity3d.com/Documentation/Components/SL-Reference.html`](http://docs.unity3d.com/Documentation/Components/SL-Reference.html)）。\n\
  \n包含的着色器是一个简单的着色器，它跳过了着色器能做的大多数功能，仅用于在屏幕上渲染一个彩色的、无光的形状。对于你希望呈现特定亮颜色的屏幕元素，导入的 `UnlitAlpha.shader`\
  \ 是完美的。`UnlitAlpha` 还允许 Alpha 混合和透明度，这对于此游戏中的强化方块非常有用。\n\n### 设置场景\n\n向场景中添加一个方向性光（从菜单栏选择\
  \ `GameObject > Create Other > Directional Light`）。将它的变换设置为 `P:[0,20,0]` `R:[50,330,0]`\
  \ `S:[1,1,1]`。\n\n选择 `_MainCamera` 并将其变换设置为 `P:[0,0,-10]` `R:[0,0,0]` `S:[1,1,1]`。在\
  \ `Camera` 组件中，将 `Background color`（背景颜色）设置为黑色。将 `Projection`（投影）设置为 `Orthographic`（正交投影），并将\
  \ `Size`（大小）设置为 `40`。由于这是一款垂直俯视射击游戏，我们需要将 `Near` 和 `Far` 分别设置为 `0.3` 和 `100`，如图\
  \ 30.3 所示。\n\n![Image](img/081)\n\n### 制作飞船\n\n在本章中，我们将交替进行美术和代码编写，而不是先构建美术。为了制作玩家的飞船，请完成以下步骤：\n\
  \n1. 创建一个空对象并命名为 `_Hero`（`GameObject > Create Empty`）。将其变换设置为 `P:[0,0,0]` `R:[0,0,0]`\
  \ `S:[1,1,1]`。\n2. 创建一个立方体（`GameObject > Create Other > Cube`）并将其拖到 `_Hero` 上成为其子对象。将立方体命名为\
  \ `Wing`，并将其变换设置为 `P:[0,-1,0]` `R:[0,0,45]` `S:[3,3,0.5]`。\n3. 创建一个空对象，命名为 `Cockpit`，并成为\
  \ `_Hero` 的子对象。\n4. 创建一个立方体并成为 `Cockpit` 的子对象。将立方体的变换设置为 `P:[0,0,0]` `R:[315,0,45]`\
  \ `S:[1,1,1]`。\n5. 创建一个新的 C# 脚本并命名为 `Hero`（从菜单栏 `Assets > Create > C# Script`）。确保将此脚本放入\
  \ `Scripts` 文件夹。将 Hero 脚本拖到 `_Hero` 对象上进行挂。\n6. 为 `_Hero` 添加 `Rigidbody` 组件，先在层级面板中选择\
  \ `_Hero`，从菜单选择 `Component > Physics > Rigidbody`。取消勾选 `Use Gravity` 并勾选 `isKinematic`。展开\
  \ `Constraints` 折叠并冻结 Z 轴位置以及 X、Y、Z 轴旋转。\n\n之后我们会为 `_Hero` 添加更多内容，但现在足够了。保存你的场景！记住，每次对场景进行更改时都应该保存。我稍后会考考你。\n\
  \n#### Hero.Update()\n\n在接后的代码列表中，`Update()` 方法首先从 `InputManager` 读取水平和垂直轴（参见侧边栏“Input.GetAxis()\
  \ and The InputManager””），将 -1 到 1 之间的值放入浮点数 `xAxis` 和 `yAxis` 中。`Update()` 的部分代码根据时间移动飞船，并考虑了\
  \ `speed` 设置。\n\n\n\n最后一行（标记为 `// 2`）根据输入来旋转飞船。虽然我们之前在 `Rigidbody` 组件中冻结了旋转，但我们仍然可以在\
  \ `isKinematic` 设置为 `true` 的 `Rigidbody` 上手动设置旋转。（正如在前面的章节中讨论过的，`isKinematic=true`\
  \ 意味着 `Rigidbody` 将被物理系统跟踪，但它不会由于 `Rigidbody.velocity` 而自动移动。）这种旋转会让飞船的移动感觉更有动态、更有表现力，或者说更“多汁”（juicy）。\n\
  \n“多汁”（Juiciness）作为一个与游戏玩法相关的术语，是由 Kyle Gabler 以及卡内基梅梅隆大学娱乐技术中心实验性游戏项目的其他成员于 2005\
  \ 年提出的。对他们来说，一个多汁的元素意味着“持续且丰富的用户反馈”。你可以在他们的 Gamasutra 文章《如何在 7 天内原型化一个游戏》中阅读更多信息：[`www.gamasutra.com/view/feature/130848/how_to_prototype_a_game_in_under_7_php`](http://www.gamasutra.com/view/feature/130848/how_to_prototype_a_game_in_under_7_php)。\n\
  \n在 MonoDevelop 中打开 `Hero` C# 脚本并输入以下代码：\n\n点击此处查看代码图像\n\n```csharp\nusing UnityEngine;\n\
  \nusing System.Collections;\n\npublic class Hero : MonoBehaviour {\n\n    static\
  \ public Hero S;  // 单例\n\n    // 这些字段控制飞船的移动\n    public float speed = 30;\n  \
  \  public float rollMult = -45;\n    public float pitchMult = 30;\n\n    // 飞船状态信息\n\
  \    public float shieldLevel = 1;\n    public bool ____________________________;\n\
  \n    void Awake() {\n        S = this;  // 设置单例\n    }\n\n    void Update () {\n\
  \        // 从 Input 类获取信息\n        float xAxis = Input.GetAxis(\"Horizontal\");\
  \ // 1\n        float yAxis = Input.GetAxis(\"Vertical\");   // 1\n\n        //\
  \ 根据轴改变 transform.position\n        Vector3 pos = transform.position;\n        pos.x\
  \ += xAxis * speed * Time.deltaTime;\n        pos.y += yAxis * speed * Time.deltaTime;\n\
  \        transform.position = pos;\n\n        // 旋转飞船让它感觉更有动态            // 2\n\
  \        transform.rotation = Quaternion.Euler(yAxis*pitchMult,xAxis*rollMult,0);\n\
  \    }\n}\n```\n\n**1.** 这两行使用 Unity 的 `Input` 类从 Unity InputManager 中提取信息。更多信息请参阅侧边栏。\n\
  \n**2.** 此注释下方的 `transform.rotation...` 行用于根据飞船的移动速度给它一点旋转，这可以让飞船感觉上更灵敏、更“多汁”。\n\
