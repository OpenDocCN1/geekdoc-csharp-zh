  // 向线条添加一个新点\nvoid AddPointToLiner(Vector3 pt) {\n    pt.z = lineZ; // 将 pt 的 z\
  \ 设置为 lineZ 以使其稍微\n    // 离开地面\n    linePts.Add(pt);\n    UpdateLiner();\n} // 使用新点更新\
  \ LineRenderer\npublic void UpdateLiner() {\n    // 获取选中元素的类型\n    int el = (int)selectedElements[0].type;\n\
