  \ Inspector 中的 `transform.z`，你应该能看到相机跟随位于 `Mage` 正前方的光源移动。\n\n### 鼠标交互\n由于我们希望这个游戏可以在电脑或触摸屏设备上运行，因此所有的交互都将基于简单的鼠标手势。这在平板电脑上同样适用，因为\
