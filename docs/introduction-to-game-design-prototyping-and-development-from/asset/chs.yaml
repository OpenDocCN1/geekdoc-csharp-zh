  \ Cube Prefab\n\n你还可以看到此组件中有一个名为 `Cube Prefab Var` 的变量（正如在下面的警告中所解释的，它实际上应该是 `cubePrefabVar`）。这源于你在第\
  \ 5 行输入的 `\"public GameObject cubePrefabVar;\"` 语句。如果脚本中的变量被标记为 `\"public\"`，它将出现在\
  \ `Inspector` 面板中。\n\n正如你在 `Inspector` 中看到的，`cubePrefabVar` 目前没有赋值值。正如刚才，我们不再需要场景中的那个实例了。点击\
