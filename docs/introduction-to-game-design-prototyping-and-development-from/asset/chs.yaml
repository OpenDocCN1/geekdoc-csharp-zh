  \ 时，法师将移动到你点击的地面上。然而，给玩家一些点击反馈会更好。\n\n#### 添加点击指示\n\n在 `Scripts` 文件夹创建一个名为 `TapIndicator`\
  \ 的新 C# 脚本，并将其拖到 `_Prefabs` 文件夹中的 `TapIndicator` 上。然后在 MonoDevelop 中打开 `TapIndicator`\
  \ 脚本输入以下代码：\n\n```csharp\nusing UnityEngine;\nusing System.Collections;\nusing System.Collections.Generic;\n\
  \n/*\nTapIndicator 使用 ProtoTools 中的 PT_Mover 类。这允许它\n使用贝塞尔曲线来改变位置、旋转、缩放等。\n你还会注意到这在\
  \ Inspector 中增加了几个公共字段。\n*/\npublic class TapIndicator : PT_Mover {\n    public\
  \ float life = 0.4f; // 持续多久\n    public float[] scales; // 缩放插值\n    public Color[]\
  \ colors; // 颜色插值\n    void Awake() {\n        scale = Vector3.zero; // 隐藏指示器\n\
  \    }\n    void Start () {\n        // PT_Mover 于 PT_Loc 类，该类包含\n        // 位置、旋转和缩放。它类似于\
  \ Transform\n        // 更简单（Unity 不允许随意创建 Transform）。\n        PT_Loc pLoc;\n  \
  \      List<PT_Loc> locs = new List<PT_Loc>();\n        // 位置始终相同且始终在 z=-0.1f\n\
  \        Vector3 tPos = pos;\n        tPos.z = -0.1f;\n        // 在 Inspector 中必须有相同数量的缩放和颜色\n\
  \        for (int i=0; i<scales.Length; i++) {\n            pLoc = new PT_Loc();\n\
  \            pLoc.scale = Vector3.one * scales[i]; // 每个缩放\n            pLoc.pos\
  \ = tPos;\n            pLoc.color = colors[i]; // 以及每个颜色\n            locs.Add(pLoc);\
  \ // 添加到 locs 中\n        }\n    }\n}\n```\n\n\n\n\n\n```csharp\n// callback 是一个函数委托，可以在移动完成后调用\
  \ void 函数()\ncallback = CallbackMethod;      // 完成时调用 CallbackMethod()\n// 通过传入一系列\
  \ PT_Locs 和用于 贝塞尔曲线（Bézier curve）的持续时间来启动移动。\nPT_StartMove(locs, lifeTime);\n}\n\
  \nvoid CallbackMethod() {\n    Destroy(gameObject);      // 移动完成后，销毁(gameObject)\n\
  }\n\n```\n\n从代码中可以看出，这创建了一个“触发后不管”的（fire-and-forget）对象。它被实例化，设置了一条贝塞尔曲线来插值缩放和颜色（我们将在接下来的\
  \ Inspector 面板中设置这些值），并且当 `PT_Mover` 完成时，它会调用 `CallbackMethod()` 并销毁自己的 `GameObject`。\n\
  \n点击项目面板中 `_Prefab` 文件夹中的 `TapIndicator`，并将图 35.3 中所示的值输入 Inspector 面板。\n\n![Image](img/00256.jpeg)\n\
