  \ 6. 这也是玩家们的故事\n\n运行一个战役是一项挑战性的任务。最流行的可能仍然是 Wizards of the Coast 出出的《地下城与龙》（`D&D`），现在已经是第五版了。从第三版开始，`D&D`\
  \ 一直基于 `d20`，这是一种二十面骰。\n\n\n\n\n虽然书中包含的大多数游戏都使用鼠标或键盘界面，但我猜你最终可能想为游戏连接一个游戏手柄。通常情况下，在\
  \ PC、OS X 或 Linux 上最易让控制器运行起来的设备是适用于 Windows 的 `Microsoft Xbox 360 Controller`。你可以买到有线或无线版本，且无线版本带有一个接收器，允许一台机器同时连接多达四个\
  \ Xbox 控制器。\n\n然而，遗憾的是，每个平台（PC、OS X 和 Linux）对控制器的解释方式都不同，因此你需要设置一个 `Input Manager`，以适应手柄在每个平台上的工作方式。\n\
  \n或者，你可以从 Unity 资源商店选择一个输入管理器，从而为自己省去很多麻烦。我的几位学生使用过 Gallant Games 的 `InControl`，它不仅能映射微软控制器，还可以将索尼、罗技、Ouya\
  \ 等许多控制器的输入映射到 Unity 中相同的输入代码。\n\n[InControl 介绍](http://www.gallantgames.com/pages/incontrol-introduction)\n\
  \n如果你确实想自己配置 Unity 的 `InputManager`，图 B.7 包含了 Unity 社区页面关于 Xbox 360 控制器的信息。^(2)\
  \ 图中的数字表示可以通过 `InputManager Axes` 窗口访问的摇杆按钮编号。这些轴的前面标有字母 `a`（例如，`aX`、`a5`）。如果在同一台机器上使用多个摇杆，你可以通过\
  \ `joystick # button #` 在 `InputManager Axes` 中指定特定的摇杆（例如“joystick 1 button 3”）。该\
  \ Unity 页面还包含一个适用于四个同时使用的微软控制器的可下载 `InputManager` 设置。\n\n^(2) 该内容的 Unity 社区页面地址是：[`wiki.unity3d.com/index.php?title=Xbox360Controller`](http://wiki.unity3d.com/index.php?title=Xbox360Controller)\n\
  \n![Image](img/00277.jpeg)\n\n**图 B.7** 适用于 PC、OS X 和 Linux 的 Xbox 控制器映射\n\n在 PC\
  \ 上，控制器的驱动程序会自动安装。在 Linux 上（Ubuntu 13.04 及更高版本），它也应该包含在内。对于 OS X，你需要从 TattieBogle\
  \ 处下载驱动：[`tattiebogle.net/index.php/ProjectRoot/Xbox360Controller/OsxDriver`](http://tattiebogle.net/index.php/ProjectRoot/Xbox360Controller/OsxDriver)。\n\
  \n### 在 OS X 上右键点击\n\n在本书中，我多次要求你对某些内容进行右键点击。然而，许多人不知道如何在 Macintosh 上右键点击，因为这不是\
  \ OS X 触控板和鼠标的默认设置。实际上有几种右键点击的方法，你使用的方法取决于你的 Mac 有多新以及你偏好与机器交互的方式。\n\n#### Control-点击\
  \ = 右键点击\n\n在左下角附近，按住 `Control` 键的同时点击。这是 Mac 上右键点击的常用方法。\n\n\n\n\n随着你深入学习 Unity\
  \ 开发，你会发现使用 C# 编写 Unity 的文档主要分布在两个地方：Unity 脚本文档和微软的 C# 参考文档。Unity 脚本文档在记录 Unity\
  \ 特有的功能、类和组件方面做得非常出色，但它没有涵盖任何核心的 C# 类（例如 `List<>`、`Dictionary<>` 等）。对于这些内容，请查阅微软的\
  \ C# 文档。我建议首先在你电脑上的本地 Unity 文档中查找，如果那里没有，再去查看微软的文档。\n\n# Unity 脚本参考\n\nUnity 脚本参考包含以下内容：\n\
  \n![Image](img/00003.jpeg) **在线：** [`docs.unity3d.com/Documentation/ScriptReference/`](http://docs.unity3d.com/Documentation/ScriptReference/)\n\
  \n![Image](img/00003.jpeg) **本地：** 在 Unity 内部，从菜单栏选择 `Help > Scripting Reference`。这将弹出一个存储在你计算机本地的参考文档版本。即使你没有连接互联网，该参考也可用。（我在旅行时经常使用它。）\n\
  \n# 微软 C# 参考\n\n在 [Bing.com](http://Bing.com) 上搜索 `Microsoft C# Reference.`。第一个结果应该是你要找的内容。在本书编写期间，URL\
  \ 为：\n\n[`msdn.microsoft.com/en-us/library/618ayhy6.aspx`](http://msdn.microsoft.com/en-us/library/618ayhy6.aspx)。\n\
  \n# Stack Overflow\n\nStack Overflow 是一个帮助开发者的在线开发者社区。人们在这里发布问题，网站的其他成员会进行回答。通过一种游戏化机制，那些提供最佳答案（由其他成员投票）的人可以在网站上获得经验值和声望：\n\
  \n[`stackoverflow.com`](http://stackoverflow.com)\n\n通常，当我尝试研究如何实现新颖或不常的功能时，我最终会在\
  \ Stack Overflow 上找到很好的答案。例如，如果我想知道如何使用 `LINQ` 排序 `List<>`，我会在 Google 中输入 `c# LINQ\
  \ sort list of objects`，在我写这段文字时，前四个结果都是 Stack Overflow 的问题。我通常是通过 Google 搜索到达那里的，而不是从\
  \ [Stackoverflow.com](http://Stackoverflow.com) 开始，但当该网站出现结果时，它是我寻找优质答案的首选。\n\n\
  # 学习更多 C#\n\n我强烈推荐另外两本书来学习更多 C#：\n\n![Image](img/00003.jpeg) **针对初学者：** Rob Miles\
  \ 的 `CSharp Yellow Book, 2014.pdf`，[`www.csharpcourse.com`](http://www.csharpcourse.com)\n\
  \nRob Miles 是赫尔大学的讲师，他写了一本关于 C# 编程的精彩书籍，并经常进行更新。你可以在他的网站上找到当前版本（此处所示）。它幽默、清晰且详尽。\n\
  \n![Image](img/00003.jpeg) **用于参考：** `C# 4.0 Pocket Reference, 3rd Edition,*` [`shop.oreilly.com/product/0636920013365.do`](http://shop.oreilly.com/product/0636920013365.do)\n\
  \n虽然现在有了 C# 5.0 版本的参考文档，但 Unity 仍在使用 C# 4.0 标准（嗯，是 C# 4.0 的大部分；实际上缺少了几小部分），所以这个参考文档适合你。每当我遇到\
  \ C# 问题时，这都是我第一个查阅的地方。它是 O'Reilly 的 `C# in a Nutshell` 一书中信息的精简版，但我实际上发现这个口袋书更有用。\n\
  \n## 搜索技巧\n\n每当你想要搜索与 C# 有关的内容时，请将 `C#` 作为搜索的第一个术语。如果你只搜索 `list,`，第一个出现的将与编码无关。搜索\
  \ `C# list` 将立即带你到达正确的地方。\n\n同样，如果你想找到与 Unity 相关的任何内容，请确保将 `Unity` 作为你的第一个搜索词。\n\
  \n# 寻找资源\n\n以下章节提供了关于寻找各种艺术和音频资源的建议。\n\n## Unity Asset Store\n\n可以通过在 Unity 中打开\
  \ Asset Store 窗口（从菜单栏选择 `Window > Asset Store`）或通过访问以下网站来进入 Asset Store。Asset Store\
  \ 拥有海量的模型、动画、声音、代码甚至是完整的 Unity 项目供你下载。大多数资源需要支付少量费用，但网站上的某些资源甚至是免费的。有些东西非常贵，但通常是值得的，并且可以节省你数百小时开发时间：\n\
  \n![Image](img/00003.jpeg) [`www.assetstore.unity3d.com/`](https://www.assetstore.unity3d.com/)\n\
