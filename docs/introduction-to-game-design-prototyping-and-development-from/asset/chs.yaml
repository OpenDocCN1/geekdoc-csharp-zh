  \n### 为 Prospector 添加评分\n\n原始的 `Prospector` 卡牌游戏（或其基于的 `Tri-Peaks`）除了玩家胜负之外，没有评分机制。但作为一款数字游戏，拥有分数和高分非常有帮助，这样玩家就有继续玩下去的理由（为了打破自己的高分）。\n\
  \n#### 在游戏中得分的方法\n\n我们将在 Prospector 中实现几种得分方式：\n\n1. 将卡牌从矿中移动到目标卡牌可获得 1 分。\n2. 之后每当不从抽牌堆牌牌从矿中移除一张卡牌，每张卡牌的分数就会增加\
  \ 1 分，因此不抽牌而*连续*移除五张卡牌将分别获得 1、2、3、4 和 5 分，该次连击总计得 15 分（1 + 2 + 3 + 4 + 5 = 15）。\n\
  3. 如果玩家赢得这一轮，她会将分数带入下一轮。每当输掉一轮时，她所有回合的分数将汇总并与高分列表进行比较。\n4. 连击获得的分数根据连击中每张特殊卡牌的数量翻倍。如果示例连击中的两张卡牌是金卡牌，那么该连击将价值\
  \ 60 分（15 x 2 = 60）。\n\n评分将由 `Prospector` 类处理，因为它感知了所有可能导致得分的条件。我们还将创建一个名为 `Score`\
  \ 的脚本来处理显示分数的各种视觉元素。我们将在本章中实现第 1 到 3 点，我把第 4 点留给你自己去实现。\n\n#### 实现连击评分\n\n现在，让我们先对\
  \ `Prospector` 做一些更改以跟踪分数。由于我们开启了连击机制，并最终将通过金卡牌添加连击翻倍，因此分开存储连击分数，并在连击结束（通过从 `drawPile`\
  \ 抽取卡牌）后将其应用到总分是有合理的。将以下代码添加到 `Prospector` 中实现此功能：\n\n```cs\nusing UnityEngine;\n\
  using System.Collections;\nusing System.Collections.Generic;\n// 处理所有可能事件的枚举\npublic\
  \ enum ScoreEvent {\n    draw,\n    mine,\n    gold,\n    gameWin,\n    gameLoss\n\
  }\npublic class Prospector : MonoBehaviour {\n    static public Prospector S;\n\
  \    static public int SCORE_FROM_PREV_ROUND = 0;\n    static public int HIGH_SCORE\
  \ = 0;\n    ...\n    public List<CardProspector> drawPile;\n    // 用于跟踪分数信息的字段\n\
  \    public int chain = 0; // 此次连击中的卡牌数\n    public int scoreRun = 0;\n    public\
  \ int score = 0;\n    void Awake() {\n        S = this; // 为 Prospector 设置单例\n \
  \       // 在 PlayerPrefs 中检查是否有高分\n        if (PlayerPrefs.HasKey (\"ProspectorHighScore\"\
  )) {\n            HIGH_SCORE = PlayerPrefs.GetInt(\"ProspectorHighScore\");\n  \
  \      }\n        // 加上上一轮的分数，如果是的话则大于 0\n        score += SCORE_FROM_PREV_ROUND;\n\
  \        // 重置 SCORE_FROM_PREV_ROUND\n        SCORE_FROM_PREV_ROUND = 0;\n    }\n\
  \    ...\n    // 每当游戏中的卡牌被点击时，就会调用 CardClicked\n    public void CardClicked(CardProspector\
  \ cd) {\n        // 反应由被点击卡片的状态决定\n        switch (cd.state) {\n        ...\n  \
  \      case CardState.drawpile: // 抽牌\n            ...\n            ScoreManager(ScoreEvent.draw);\n\
  \            break;\n        case CardState.tableau: // 牌区\n            ...\n  \
  \          ScoreManager(ScoreEvent.mine);\n            break;\n        }\n    }\n\
  \    ...\n    // 当游戏结束时调用。目前实现很简单，但可以扩展\n    void GameOver(bool won) {\n       \
  \ if (won) {\n            ScoreManager(ScoreEvent.gameWin); // 替换此行\n        } else\
  \ {\n            ScoreManager(ScoreEvent.gameLoss); // 替换此行\n        }\n       \
  \ // 重载场景，重置游戏\n        Application.LoadLevel(\"__Prospector_Scene_0\");\n    }\n\
  \    // ScoreManager 处理所有的评分\n    void ScoreManager(ScoreEvent sEvt) {\n       \
  \ switch (sEvt) {\n            // 无论是抽牌、胜利还是失败，都需要执行相同的操作\n            case ScoreEvent.draw:\
  \ // 抽牌\n            case ScoreEvent.gameWin: // 赢得回合\n            case ScoreEvent.gameLoss:\
  \ // 输掉回合\n                chain = 0; // 重置分数连链\n                score += scoreRun;\
  \ // 将连击分加入总分\n                scoreRun = 0; // 重置 scoreRun\n                break;\n\
  \        }\n    }\n}\n```\n\n\n\n\n\n```csharp\ncase ScoreEvent.mine:  // 移除地雷卡牌\n\
  \    chain++;              // 增加分数链\n    scoreRun += chain;  // 将此卡片的分加入本轮总分\n \
  \   break;\n}}\n// 第二个 switch 语句处理回合的获胜与输**\nswitch (sEvt) {\n    case ScoreEvent.gameWin:\n\
  \        // 如果赢了，将分数加到下一轮\n        // 静态字段不会被 Application.LoadLevel() 重置\n     \
  \   Prospector.SCORE_FROM_PREV_ROUND = score;\n        print (\"You won this round!\
  \ Round score: \"+score);\n        break;\n    case ScoreEvent.gameLoss:\n     \
  \   // 如果输了，检查是否为高分\n        if (Prospector.HIGH_SCORE <= score) {\n           \
  \ print(\"You got the high score! High score: \"+score);\n            Prospector.HIGH_SCORE\
  \ = score;\n            PlayerPrefs.SetInt(\"ProspectorHighScore\", score);\n  \
  \      } else {\n            print (\"Your final score for the game was: \"+score);\n\
  \        }\n        break;\n    default:\n        print (\"score: \"+score+\"  scoreRun:\"\
  +scoreRun+\"  chain:\"+chain);\n        break;\n}}\n```\n\n现在，当你玩游戏时，会在控制台（Console）面板中看到一些小备注，告诉你你的分数。这对于测试来说很好，但让我们让玩家看到的视觉效果更好一点吧。\n\
  \n### 向玩家显示分数\n\n对于这个游戏，我们将创建几个可重用的组件来显示分数。其中一个是 `Scoreboard` 类，它将管理所有的分数显示。另一个是\
  \ `FloatingScore`，它是一个屏幕上的数字，可以独立在屏幕上移动。我们还将利用 Unity 的 `SendMessage()` 功能，它可以通过名称带一个参数调用任何\
  \ `GameObject` 上的方法：\n\n**1.** 创建一个名为 `FloatingScore` 的新 C# 脚本并输入以下代码：\n\n点击此处查看代码图片\n\
  \n```csharp\nusing UnityEngine;\nusing System.Collections;\nusing System.Collections.Generic;\n\
  \n// 用于跟踪 FloatingScore 可能状态的枚举\npublic enum FSState {\n    idle,\n    pre,\n  \
  \  active,\n    post\n}\n\n// FloatingScore 可以沿着贝塞尔曲线在屏幕上自移动\npublic class FloatingScore\
  \ : MonoBehaviour {\n    public FSState state = FSState.idle;\n    [Serialize Field]\n\
  \    private int _score = 0; // 分数字段\n    public string scoreString;\n    // 分数属性在设置值时也会设置\
  \ scoreString\n    public int score {\n        get {\n            return(_score);\n\
  \        }\n        set {\n            _score = value;\n            scoreString\
  \ = Utils.AddCommasNumber(_score);\n            GetComponent<GUIText>().text = scoreString;\n\
  \        }\n    }\n    public List<Vector3> bezierPts; // 用于移动的贝塞尔点\n    public\
  \ List<float> fontSizes; // 用于缩放的贝塞尔点\n    public float timeStart = -1f;\n    public\
  \ float timeDuration = 1f;\n    public string easingCurve = Easing.InOut; // 使用\
  \ Utils.cs 中的 Easing\n    // 当此完成后，GameObject 将接收到 SendMessage \n    public GameObject\
  \ FinishTo = null;\n    // 设置 FloatingScore 和移动。注意 eTimeS & eTimeD 的默认值\n    public\
  \ void Init(List<Vector3> ePts, float eTimeS = 0, float eTimeD = 1) {\n        bezierPts\
  \ = new List<Vector3>(ePts);\n        if (ePts.Count == 1) { // 如果只有一个点\n      \
  \      // ...那么移动那里。\n            transform.position = ePts[0];\n            return;\n\
  \        }\n        // 如果 eTimeS 是默认值，则从当前时间开始\n        if (eTimeS == 0) eTimeS\
  \ = Time.time;\n        timeStart = eTimeS;\n        timeDuration = eTimeD;\n  \
  \      state = FSState.pre; // 设置为 pre 状态，准备开始\n    }\n    public void FSCallback(FloatingScore\
  \ fs) {\n        // 当被 SendMessage 调用时，\n        // 来自调用者 FloatingScore 的分数\n  \
  \      score += fs.score;\n    }\n    // Update 每帧调用一次\n    void Update() {\n  \
  \      // 如果没有在移动，直接返回\n        if (state == FSState.idle) return;\n        // 从当前时间和持续时间获取\
  \ u\n        // u 的范围从 0 到 1（通常）\n        float u = (Time.time - timeStart)/timeDuration;\n\
  \        // 使用 Utils 中的 Easing 类对 u 值进行处理\n        float uC = Easing.Ease(u, easingCurve);\n\
  \        if (u < 0) { // 如果 u<0，我们现在不应该移动。\n            state = FSState.pre;\n \
  \           // 移动到初始点\n            transform.position = bezierPts[0];\n        }\
  \ else {\n            if (u >= 1) { // 如果 u>=1，我们完成了移动\n                uC = 1;\
  \ // 设置 uC=1 以免越界\n                state = FSState.post;\n                if (FinishTo\
  \ != null) { // 有回调\n                    // 使用 SendMessage 调用 FSCallback 方法\n  \
  \                  // 将此作为参数。\n                    FinishTo.SendMessage(\"FSCallback\"\
  , this);\n                    // 消息已发送，\n                    // 销毁对象\n         \
  \           Destroy(gameObject);\n                } else { // 如果没有回调\n         \
  \           // ...不要销毁它。保持静止。\n                    state = FSState.idle;\n     \
  \           }\n            } else {\n                // 0<=u<1，意味着处于活跃并移动状态\n  \
  \              state = FSState.active;\n            }\n            // 使用贝塞尔曲线将移动到右侧\n\
  \            Vector3 pos = Utils.Bezier(uC, bezierPts);\n            transform.position\
  \ = pos;\n            if (fontSizes != null && fontSizes.Count > 0) { // 如果 fontSizes\
  \ 有值\n                // ...那么调整此 GUIText 的字体\n                int size = Mathf.RoundToInt(Utils.Bezier(uC,\
  \ fontSizes));\n                GetComponent<GUIText>().fontSize = size;\n     \
  \       }\n        }\n    }\n}\n```\n\n**2.** 创建一个名为 `Scoreboard` 的新 C# 脚本并在其中输入代码：\n\
