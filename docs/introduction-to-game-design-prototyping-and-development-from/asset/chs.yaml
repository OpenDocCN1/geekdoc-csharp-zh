  \ (The Player Class)\n\n由于这个游戏有四位玩家，我选择创建一个类来表示玩家，它可以执行诸如将牌收集到手牌中并最终使用简单的人工智能选择要出的牌的操作。`Player`\
  \ 类相对于你之前编写的其他类，有一个独特之处之处在于：`Player` 类*没有*继承 `MonoBehaviour`（或其他任何类）。这意味着它不会接收来自\
  \ `Awake()`、`Start()` 或 `Update()` 的调用，你无法在内部调用诸如 `print()` 的函数，也无法将其作为组件挂载到 `GameObject`\
  \ 上。然而，对于 `Player` 类来说，这些都不是必要的，因此在这种情况下，不使用它实际上更容易操作。\n\n创建一个名为 `Player` 的新 C#\
  \ 脚本并输入以下代码：\n\n点击此处查看代码图像\n\n```csharp\nusing UnityEngine;\nusing System.Collections;\n\
  using System.Collections.Generic;\nusing System.Linq; // 启用 LINQ 查询，很快就会进行解释\n\n\
  // 玩家可以是人类或 AI\npublic enum PlayerType {\n    human,\n    ai\n}\n\n// 游戏中的单个玩家\n\
  // 注意：Player 没有继承 MonoBehaviour (或其他任何类)\n[System.Serializable] // 让 Player 类在检查器面板（Inspector\
  \ pane）中可见\npublic class Player {\n    public PlayerType type = PlayerType.ai;\n\
  \    public int playerNum;\n    public List<CardBartok> hand; // 此玩家手牌牌\n    public\
  \ SlotDef handSlotDef;\n    // 向手牌中添加一张牌\n    public CardBartok AddCard(CardBartok\
  \ eCB) {\n        if (hand == null) hand = new List<CardBartok>();\n        // 将牌添加到手牌\n\
  \        hand.Add (eCB);\n        return(eCB);\n    }\n    // 从手牌中移除一张牌\n    public\
  \ CardBartok RemoveCard(CardBartok cb) {\n        hand.Remove(cb);\n        return(cb);\n\
  \    }\n}\n```\n\n现在，将以下代码添加到 `Bartok` 中以使用 `Player`：\n\n点击此处查看代码图像\n\n```csharp\n\
