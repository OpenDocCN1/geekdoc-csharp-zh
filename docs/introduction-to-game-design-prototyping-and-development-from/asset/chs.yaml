  \ bezierRots);\n            transform.rotation = rotQ;\n        }\n        break;\n\
  \    }\n}\n```\n\n这部分很大程度上是对你在上一章中看到的 `FloatingScore` 类代码的适配和扩展。`Bartok` 版本的插值还插值了\
