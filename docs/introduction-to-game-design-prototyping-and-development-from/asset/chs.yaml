  \ {\n            case \"^\":\n                moveDir = Vector3.up;\n          \
  \      break;\n            case \"v\":\n                moveDir = Vector3.down;\n\
  \                break;\n            case \"{\":\n                moveDir = Vector3.left;\n\
  \                break;\n            case \"}\":\n                moveDir = Vector3.right;\n\
  \                break;\n        }\n    }\n    void FixedUpdate () { // 每物理步长执行一次（即每秒\
  \ 50 次）\n        rigidbody.velocity = moveDir * speed;\n    }\n    // 此结构与 EnemyBug\
  \ 的 Damage 方法相同\n    public void Damage(float amt, ElementType eT, bool damageTime=false)\
  \ {\n        // 伤害刺者\n    }\n    void OnTriggerEnter(Collider other) {\n       \
  \ // 检查是否碰撞了墙\n        GameObject go = Utils.FindTaggedParent(other.gameObject);\n\
  \        if (go == null) return; // 如果没有标记\n        if (go.tag == \"Ground\") {\n\
  \            // 确保地板在我们移动的方向。\n            // 点积可以帮助我们这一点（参见实用概念）。\n           \
  \ float dot = Vector3.Dot(moveDir, go.transform.position - pos);\n            if\
  \ (dot > 0) { // 如果刺者正朝向区块移动\n                moveDir *= -1; // 反转方向\n         \
  \   }\n        }\n    }\n}\n```\n\n##### 让 EnemySpiker 伤害法师\n\n`Spiker` 使用触发器（trigger）而不是普通的碰撞体，这样与其他对象的碰撞就不会导致刺者偏离路线。然而，这意味着它目前会穿过法师而不造成任何伤害。对\
  \ `Mage` 进行以下编辑，使 `EnemySpiker` 能够伤害她：\n\n```csharp\npublic class Mage : PT_MonoBehaviour\
  \ {\n    ...\n    void OnCollisionEnter( Collision coll ) {\n        ...\n    }\n\
  \    void OnTriggerEnter(Collider other) {\n        EnemySpiker spiker = other.GetComponent<EnemySpiker>();\n\
  \        if (spiker != null) {\n            CollisionDamage(other.gameObject);\n\
  \        }\n    }\n    void CollisionDamage(GameObject enemy) {\n        ...\n \
  \   }\n    ...\n}\n```\n\n要测试新的 `EnemySpiker`，请完成以下步骤：\n\n**1.** 从 `Project` 格将\
  \ `EnemySpiker` 拖入 `Hierarchy` 面板，以向场景添加一个 `EnemySpiker` 实例。确保将其放置在距离地板约 1 米（1 Unity\
  \ 单位）且位于两墙之间。\n**2.** 保存场景。\n**3.** 运行场景以测试一切并查看 `EnemySpiker` 的行为。\n**4.** 如果一切看起来运行正常，删除\
  \ `Hierarchy` 中的 `EnemySpiker` 实例并再次保存你的场景。\n\n\n\n\n现在我们在游戏中有两种不同的敌人，它们有自己的行为，并且都能对法师造成伤害；然而，如果我们想让它们对法师造成的伤害值不同——例如：如果我们希望\
  \ `EnemySpiker` 只让法师扣除 0.5 点生命值，而不是像 Bug 产生那样扣除 1 点——目前还没有方法可以做到，因为即使每个敌人都有一个 `touchDamage`\
  \ 字段，也没有优雅的方法将其传递给 `CollisionDamage` 方法（该方法只接受一个 `GameObject` 作为输入）。这种情况正是接口（interface）大显身场的时候。\n\
  \n### 抽象敌人接口\n\n如前所述，接口是抽象两个不同类之间共性的性的极佳方法。为了让 `EnemyBug` 和 `EnemySpiker` 在接触到法师时都能正确地与其交互，我们实际上只需要知道关于它们的两点：\n\
  \n1. 敌人所在的位置，以便法师可以被击退\n2. 当法师接触到敌人时，敌人造成的伤害值\n\n正如你将在附录 B 的“接口”章节中读到的，接口就像一个承诺，任何实现该接口的类都将实现特定的方法和属性。虽然接口不能包含字段信息，但这些功能可以由属性（properties）轻松处理。\n\
  \n创建一个名为 `Enemy` 的新 C# 脚本并将其放入 **Scripts** 文件夹中。打开它并输入以下代码：\n\n点击此处查看代码图片\n\n```csharp\n\
  using UnityEngine;\nusing System.Collections;\n\npublic interface Enemy {\n\n  \
  \  // 这些是属性声明，将由所有实现\n    // Enemy 接口的类来实现\n    Vector3 pos { get; set; } // 敌人的\
  \ transform.position\n    float touchDamage { get; set; } // 接触敌人造成的伤害\n}\n```\n\
  \n接口通常非常短，因为它们只声明了以后将实现的方法和属性。现在是时候利用 `Enemy` 接口了。对 `EnemyBug` 脚本的开头进行以下更改：\n\n\
  点击此处查看代码图片\n\n```csharp\npublic class EnemyBug : PT_MonoBehaviour, Enemy {\n\n \
  \   [SerializeField]\n    private float _touchDamage = 1;\n    public float touchDamage\
  \ {\n        get { return( _touchDamage ); }\n        set { _touchDamage = value;\
  \ }\n    }\n\n    // pos 属性已经在 PT_MonoBehaviour 中实现过了\n    public float speed =\
  \ 0.5f;\n    ...\n}\n```\n\n`EnemyBug : PT_MonoBehaviour, Enemy` 告诉 C# `EnemyBug`\
  \ 继承了 `PT_MonoBehaviour` 类*并且*实现了 `Enemy` 接口。如果实现了多个接口，或者存在一个类和一个多个接口，则用逗号隔开。对 `EnemyBug`\
  \ 的此更改实现了承诺的 `touchDamage` 属性，而承诺的 `pos` 属性已经由 `PT_MonoBehaviour` 实现了。`[SerializeField]`\
  \ 特性使得私有字段 `_touchDamage` 出现在 Inspector 面板中（尽管它是私有的）。\n\n现在，在 `EnemySpiker` 的开头添加类似的代码：\n\
  \n点击此处查看代码图片\n\n```csharp\npublic class EnemySpiker : PT_MonoBehaviour, Enemy {\n\
  \n    [SerializeField]\n    private float _touchDamage = 0.5f;\n    public float\
  \ touchDamage {\n        get { return( _touchDamage ); }\n        set { _touchDamage\
  \ = value; }\n    }\n\n    // pos 属性已经在 PT_MonoBehaviour 中实现过了\n    public float\
  \ speed = 5f;\n    ...\n}\n```\n\n现在，`EnemyBug` 和 `EnemySpiker` 实例都可以被视为 `Enemy`\
  \ 接口的实例。对 `Mage` 进行以下更改以查看它是如何工作的：\n\n点击此处查看代码图片\n\n```csharp\npublic class Mage\
  \ : PT_MonoBehaviour { \n    ...\n    void OnCollisionEnter(Collision coll ) {\n\
  \        ...\n        // 检查是否是 EnemyBug\n        EnemyBug bug = coll.gameObject.GetComponent<EnemyBug>();\n\
  \        // 如果 otherGO 是 EnemyBug，则将 bug 传递给 CollisionDamage()，\n        // 它会将其解释为\
  \ Enemy\n        if (bug != null) CollisionDamage(bug);\n        // if (bug != null)\
  \ CollisionDamage(other); // 注释掉这一行\n    }\n\n    void OnTriggerEnter(Collider other)\
  \ {\n        EnemySpiker spiker = other.GetComponent<EnemySpiker>();\n        if\
  \ (spiker != null) {\n            // CollisionDamage() 将把 spiker 视为 Enemy\n    \
  \        CollisionDamage(spiker);\n            // CollisionDamage(other.gameObject);\
  \ // 注释掉这一行\n        }\n    }\n\n    void CollisionDamage(Enemy enemy) {\n     \
  \   // 如果处于无敌状态，则不受伤\n        if (invincibleBool) return;\n        // 法师被敌人击中\n\
  \        StopWalking();\n        ClearInput();\n        health -= enemy.touchDamage;\
  \ // 根据敌人造成伤害\n        if (health <= 0) {\n            Die();\n        }\n     \
  \   damageTime = Time.time;\n        knockbackDir = (pos - enemy.pos).normalized;\n\
  \        invincibleBool = true;\n    }\n    ...\n}\n```\n\n即使 `EnemyBug` 和 `EnemySpiker`\
  \ 共享的代码很少，对于 `CollisionDamage()` 方法来说，它们都实现了 `Enemy` 接口。\n\n### 创建敌人工厂\n\n将敌人抽象为\
