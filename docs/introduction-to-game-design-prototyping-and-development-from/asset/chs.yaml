  \ {\n        S = this; // 设置法师单例\n        mPhase = Phase.idle;\n        // 找到 characterTrans\
  \ 以通过 Face() 旋转\n        characterTrans = transform.Find(\"CharacterTrans\");\n\
  \    }\n    ...\n    void MouseTap() {\n        // 点击了类似按钮的物体\n        if (DEBUG)\
  \ print(\"age.MouseTap()\");\n        WalkTo(lastMouseInfo.loc); // 移动到最新的 mouseInfo\n\
  \    }\n\n    void MouseDragUp() {\n        // 鼠标拖拽后释放\n        print(\"age.MouseDragUp()\"\
  );\n    }\n    // 移动到特定位置。位置.z 始终为 0\n    public void WalkTo(Vector3 xTarget) {\n\
  \        walkTarget = xTarget; // 设置移动到的点\n        walkTarget.z = 0; // 强制 z=0\n\
  \        walking = true; // 现在法师正在行走\n        Face(walkTarget); // 朝向 walkTarget\
  \ 的方向看\n    }\n    public void Face(Vector3 poi) { // 面向感兴趣点\n        Vector3 delta\
  \ = poi-pos; // 找到指向感兴趣点的向量\n        // 使用 Atan2 获取绕 Z 轴的旋转，使\n        // Mage:CharacterTrans\
  \ 指向 poi\n        float rZ = Mathf.Rad2Deg * Mathf.Atan2(delta.y, delta.x);\n  \
  \      // 设置 characterTrans 的旋转（实际上不会让法师本体旋转）\n        characterTrans.rotation =\
  \ Quaternion.Euler(0,0,rZ);\n    }\n    public void StopWalking() { // 停止法师行走\n\
  \        walking = false;\n        rigidbody.velocity = Vector3.zero;\n    }\n \
  \   void FixedUpdate () { // 每一步都发生一次（即每秒 50 次）\n        if (walking) { // 如果法师正在行走\n\
  \            if ((walkTarget-pos).magnitude < speed*Time.fixedDeltaTime) {\n   \
  \             // 如果法师非常接近 walkTarget，直接停在那里\n                pos = walkTarget;\n\
  \                StopWalking();\n            } else {\n                // 否则，向 walkTarget\
