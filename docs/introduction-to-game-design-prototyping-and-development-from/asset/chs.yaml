  ```\n\n运行场景后，你会发现七张卡牌的分布和第一个张目标的抽取都按计划正常发生；然而，人类玩家的卡牌以奇怪的方式相互重叠。正如我们在处理“Prospector”时做的那样，我们需要非常仔细地管理每张卡牌每个元素的\
  \ `sortingLayerName` 和 `sortingOrder`。\n\n### 管理 2D 深度排序顺序\n\n除了标准的 2D 对象深度排序问题外，我们现在还必须处理卡牌正在移动的这一事实，并且有时我们希望它们在移动开始时处于一种排序顺序，而在到达时处于另一种排序顺序。为了实现这一点，我们将为\
  \ `CardBartok` 添加了 `eventualSortLayer` 和 `eventualSortOrder` 字段。这样，当卡牌在移动时，它会在移动过程中途切换到\
  \ `eventualSortLayer` 和 `eventualSortOrder`。\n\n你所做的第一件事是重命名所有的排序层。通过菜单栏中的 `Edit\
  \ > Project Settings > Tags & Layers` 打开标签与层级管理器。然后，将 Sorting Layers 1 到 10 的名称设置为\
  \ `1` 到 `10`，如图 32.5 所示。\n\n![Image](img/00232.jpeg)\n\n**图 32.5** 为 Bartok 简单命名的排序层\n\
