  \        // 无需旋转她就能以正确的方向\n        // 进入这个房间。\n        p.justArrived = true;\n \
  \       // ^ 告诉门户法师刚刚到达。\n        firstRoom = false;\n        // ^ 防止此房间内的第 2 个门户将法师移动到它那里\n\
  \    }\n}\n// 最后分配 roomNumber\n```\n\n\n\n\n设计此类内容通常有两种方法。一种是提前对其进行深入思考，尝试预见每个 `Enemy`（敌人）类型行为中所有你想要抽象到接口（interface）的可能部分。另一种是直接构建几个敌人，看看它们有哪些共同的方法，然后将这些方法添加到接口中。第二种方法更接近书中贯穿的迭代设计过程，尽管它可能会导致灵活性和扩展性降低。在大多数情况下，我会将两种方法结合使用，并偏向于第二种。我会尝试直接开始编写代码，既心里清楚之后可能需要重构某些代码，又敏锐地关注那些我以后可能想要抽象为接口或基类的内容。记住了这一点，让我们让\
  \ `EnemyBug` 运行起来吧。\n\n## EnemyBug\n\n虫子（Bugs）是一种非常基本的敌人。如果 `Mage` 与它们在同一个房间里，它们会直接向\
  \ `Mage` 移动。虫子对墙壁或房间布局一无所知，因此它们会乐意地撞在墙上，而不是绕过墙去找玩家。（如果你以后想让它们变得更智能，可以添加 A*`pathfinding（读作“A-star”）或使用\
  \ Unity 的导航网格 navigation mesh。）虫子会被火伤害，但并不害怕火，如果它们触碰到 `Mage`，就会对她造成伤害。\n\n让我们从让\
  \ `EnemyBug` 追逐玩家开始。创建一个名为 `EnemyBug` 的新 C# 脚本，并将其放在 `Scripts` 文件夹中。然后将其拖到 `_Prefabs`\
  \ 文件夹中的 `EnemyBug` 上。\n\n接下来，从 `_Prefabs` 文件夹将一个 `EnemyBug` 实例拖入 `Hierarchy`（层级）面板。确保它的位置是\
  \ `P:[8,4,0]`，这样一旦 `LayoutTiles` 构建了第 $0^{th}$ 个房间，它就会将与玩家位于同一个房间内（但仍保持足够的距离，让你有充足的时间在它到达你之前对其施法术）。如果你在\
  \ `Hierarchy` 中查看 `EnemyBug`，你会发现它的构造方式与 `_Mage` 非常相似，一个顶层 `GameObject`（`EnemyBug`）包含一个\
  \ `Rigidbody` 和 `CapsuleCollider`。`EnemyBug` 有一个名为 `CharacterTrans` 的子对象，该子对象用于父化并旋转另一个名为\
  \ `View_Bug` 的子对象，而该对象实际上包含了玩家看到的虫子模型。与 `View_Character` 一样，`View_Bug` 的每个身体部位都有独立的碰撞器（colliders）。这对于\
  \ `View_Bug` 比比 `View_Character` 更重要，因为 `View_Bug` 的腿伸得比 `EnemyBug` 上 `CapsuleCollider`\
  \ 的边界还要远。\n\n打开 `EnemyBug` 脚本并输入以下代码。如你所见，它几乎完全是从 `Mage` 复制粘贴过来的。通常情况下，当你编写大型系统时，你并不希望这样复制粘贴代码。但在原型设计阶段，起初复制粘贴是非常有用的，然后——一旦你确切知道想要什么——就可以在之后抽象这些代码。\n\
  \n点击此处查看代码图片\n\n```csharp\nusing UnityEngine;\n\nusing System.Collections;\n\nusing\
  \ System.Collections.Generic;\n\npublic class EnemyBug : PT_MonoBehaviour {\n\n\
  \    public float speed = 0.5f;\n    public bool ________________;\n    public Vector3\
  \ walkTarget;\n    public bool walking;\n    public Transform characterTrans;\n\n\
  \    void Awake() {\n        characterTrans = transform.Find(\"CharacterTrans\"\
  );\n    }\n    void Update() {\n        WalkTo(age.S.pos);\n    }\n    // ---Walking\
  \ Code\n    // 以下所有移动代码都复制自 Mage\n    // 移动到特定位置。该位置是 position。\n    // Walk to\
  \ a specific position. The position.z is always 0\n    public void WalkTo(Vector3\
  \ xTarget) {\n        // 移动到特定位置。position.z 始终为 0\n        walkTarget = xTarget;\
  \ // 设置移动目标\n        walking = true; // 移动中\n        Face(walkTarget); // 朝向目标\n\
  \    }\n    // 朝向目标\n    public void Face(Vector3 poi) {\n        // 朝向目标\n    \
  \    Vector3 delta = poi - pos;\n        float rZ = Mathf.Atan2(delta.y, delta.x);\n\
  \        character. = Quaternion.Euler(0, r0, rZ);\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\
  \n\n\n}\n// 停止移动\npublic void StopWalking() {\n    // 停止移动\n    walking = false;\n\
  }\nvoid FixedUpdate () { // 每物理帧执行一次（即每秒 50 次）\n    if (walking) { // 如果在移动中\n \
  \       if ((walkTarget - pos).magnitude < speed * Time.fixedDeltaTime) { // 如果距离足够近\n\
  \            StopWalking(); // 停止移动\n        } else { // 否则，朝目标移动\n            rigidbody.velocity\
  \ = (walkTarget - pos).normalized * speed;\n        }\n    }\n}\n```\n\n按下播放，你会发现\
  \ `Mage` 会被虫子追逐。在 `Console` 面板中看到关于它的消息。\n\n### 伤害 EnemyBug\n\n为了让 `EnemyBug` 能够被伤害。我们需要添加一个让虫子被伤害的功能。在\
  \ `EnemyBug` 中添加以下代码：\n\n点击此处查看图片\n\n```csharp\npublic class Enemy : PT_MonoBehaviour\
  \ {\n    public float speed = 0.5f;\n    public float health = 0;\n    private float\
  \ _maxHealth;\n    public Vector3 walkTarget;\n    public bool walking;\n    public\
  \ Transform characterTrans;\n\n    void Awake() {\n        characterTrans = transform.Find(\"\
  CharacterTrans\");\n        _maxHealth = health; // 用于限制血量上限\n    }\n    ...\n \
  \   void FixedUpdate () { // 每物理帧执行一次（即每秒 50 次）\n        ...\n    }\n    // 伤害此实例。默认情况下，伤害是即时的，但也可以\n\
  \    // 随时间伤害（DOT），其中 amt 值是每秒造成的伤害量。\n    // 注意：相同的代码也可用于治疗实例\n    public void\
  \ Damage(float amt, bool damageOverTime=false) {\n        // 如果是持续伤害，则按当前帧计算伤害量\n\
  \        if (damageOverTime) {\n            amt *= Time.deltaTime;\n        }\n\
  \        health -= amt;\n        health = Mathf.Min(_maxHealth, health); // 愈时限制血量\n\
  \        if (health <= 0) {\n            Die();\n        }\n    }\n    // 将 Die()\
  \ 作为一个独立函数允许我们以后添加\n    // 不同的死亡动画、掉落物品给玩家等。\n    public void Die() {\n        Destroy(gameObject);\n\
  \    }\n}\n```\n\n既然 `EnemyBug` 已经有了被伤害的能力，现在是时候让 `FireGroundSpell` 执行这一操作了。打开 `FireGroundSpell`\
  \ 并输入以下代码：\n\n点击此处查看代码图片\n\n```csharp\npublic class FireGroundSpell : PT_MonoBehaviour\
  \ {\n    ...\n    public float timeStart; // GameObject 的出生时间\n    public float\
  \ damagePerSecond = 10;\n    ...\n    void OnTriggerEnter(Collider other) {\n  \
  \      ...\n    }\n    void OnTriggerStay(Collider other) {\n        // 实际上伤害对方\n\
  \        // 获取对方的 EnemyBug 脚本组件\n        EnemyBug recipient = other.GetComponent<EnemyBug>();\n\
  \        // 如果存在 EnemyBug 组件，对其造成火伤害\n        if (recipient != null) {\n       \
  \     recipient.Damage(damagePerSecond, true);\n        }\n    }\n}\n```\n\n\n\n\
  \n保存，按下播放，并在 `Mage` 和 `EnemyBug` 之间的地面上施放火焰法术。你会看到虫子在接触火焰后不久就消失了。然而，如果你留心，你会发现虫子死得太快了。火球法术每秒造成\
  \ 10 点伤害，而 `EnemyBug` 有 10 点血量，按理应该需要 1 秒才会死亡，但实际情况比这快。这是因为虫子正在接触多个独立的 `FireGroundSpellPrefab`\
  \ 实例，每个实例都在单独对其造成伤害。\n\n对 `EnemyBug` 造成伤害的方式需要进行修改，以便虫子不会受到多个同一法术实例的复合伤害。我们需要修改\
  \ `EnemyBug` 的 `Damage()` 方法，使其能够接收伤害类型的信息，并对不同类型的伤害进行不同的处理。首先，将你刚刚在 `FireGroundSpell`\
  \ 末尾添加的 `recipient.Damage()` 行替换为以下内容：\n\n点击此处查看代码图像\n\n```sharp\n// 如果存在 EnemyBug\
  \ 组件，则用火焰对其造成伤害\nif (recipient != null) {\n    recipient.Damage(damagePerSecond,\
  \ ElementType.fire, true);\n}\n```\n\n然后，按照下面的代码修改 `EnemyBug`。注意，你将替换大部分 `Damage()`\
  \ 方法的内容：\n\n点击此处查看代码图像\n\n```sharp\npublic class EnemyBug : PT_MonoBehaviour {\n\
  \    ...\n    public Transform        characterTrans;\n    // 存储每帧每个元素的伤害值\n   \
  \ public Dictionary<ElementType,float>    damageDict;\n    // ^ 注意：字典不会出现在 Unity\
  \ Inspector 面中\n    void Awake() {\n        characterTrans = transform.Find(\"CharacterTrans\"\
  );\n        _maxHealth = health;  // 始终从最大血量开始\n        ResetDamageDict();\n   \
  \ }\n    // 重置 damageDict 的值\n    void ResetDamageDict() {\n        if (damageDict\
  \ == null) {\n            damageDict = new Dictionary<ElementType, float>();\n \
  \       }\n        damageDict.Clear();\n        damageDict.Add(ElementType.earth,\
  \ 0);\n        damageDict.Add(ElementType.water, 0);\n        damageDict.Add(ElementType.air,\
  \   0);\n        damageDict.Add(ElementType.fire,  0);\n        damageDict.Add(ElementType.aether,0);\n\
  \        damageDict.Add(ElementType.none,  0);\n    }\n    ...\n    // 对此实例造成伤害。默认情况下，伤害是即时的，但也可以\n\
  \    //   被视为持续性伤害（DOT），其中 amt 值是每秒造成的\n    //   伤害。\n    // 注意：这段代码也可以用于治愈实例\n\
  \    public void Damage(float amt, ElementType eT, bool damageOverTime=false) {\n\
  \        // 如果是持续性伤害，则只对当前帧的小比例造成伤害\n        if (damageOverTime) {\n           \
  \ amt *= Time.deltaTime;\n        }\n        // 对不同伤害类型进行不同处理（大部分为默认）\n        switch\
  \ (eT) {\n            case ElementType.fire:\n                // 只有一个火焰源的最大伤害会影响此实例\n\
  \                damageDict[eT] = Mathf.Max(amt, damageDict[eT]);\n            \
  \    break;\n            case ElementType.air:\n                // 空气不伤害 Enemyugs，什么都不做\n\
  \                break;\n            default:\n                // 默认情况下，伤害加到其他类型\n\
  \                damageDict[eT] += amt;\n                break;\n        }\n   \
  \ }\n    // LateUpdate() 由 Unity 自动调用。一旦所有\n    // Updates() 都已调用，就会在所有实例上\n   \
  \ // 调用 LateUpdate()\n    void LateUpdate() {\n        // 应用来自元素类型的伤害\n        //\
  \ 遍历字典使用 KeyValuePair\n        // entry.Key 是 ElementType，而 entry.Value 是 float\
  \ 类型\n        float dmg = 0;\n        foreach (KeyValuePair<ElementType,float> entry\
  \ in damageDict ) {\n            dmg += entry.Value;\n        }\n        health\
  \ -= dmg;\n        health = Mathf.Min(_maxHealth, health); // 如果治愈则限制血量\n      \
  \  ResetDamageDict(); // 为下一帧做准备\n        if (health <= 0) {\n            Die();\n\
  \        }\n    }\n    ...\n}\n```\n\n现在，虫子需要整整一秒的火焰伤害才会死亡。如果你想双检计时是否工作正常，可以把虫子的伤害增加到\
  \ 100，发现它确实需要 10 秒才会死亡。\n\n### 显示伤害\n\n现在，在虫子死亡之前，没有任何指示告诉玩家正在受到伤害。许多游戏在受到伤害时会闪烁红色（我们在\
  \ SHMUP 原型中做过），但颜色在这个游戏中已经有了很多含义，所以当角色受到伤害时，我们应该改变颜色以外的内容。与其闪烁红色，我们将使用 `CharacterTrans`\
  \ 稍微缩放模型。在 `EnemyBug` 中添加以下代码来实现此操作：\n\n点击此处查看代码图像\n\n```sharp\npublic class EnemyBug\
  \ : PT_MonoBehaviour {\n    public float             speed = 0.5f;\n    public float\
  \             health = 10;\n    public float             damageScale = 0.8f;\n \
  \   public float             damageDuration = 0.25f;\n    public bool          \
  \    ________________;\n    private float            damageStartTime;\n    ...\n\
  \    void LateUpdate() {\n        // 应用来自元素类型的伤害\n        // 遍历字典使用 KeyValuePair\n\
  \        // entry.Key 是 ElementType，而 entry.Value 是 float 类型\n        float dmg\
  \ = 0;\n        foreach (KeyValuePair<ElementType,float> entry in damageDict ) {\n\
  \            dmg += entry.Value;\n        }\n        if (dmg > 0) { // 如果受到了伤害\n\
  \            // 并且当前不在缩放...\n            if (characterTrans.localScale == Vector3.one)\
  \ {\n                // 开始伤害动画\n                damageStartTime = Time.time;\n \
  \           }\n        }\n        // 伤害动画\n        float damU = (Time.time - damageStartTime)/damageDuration;\n\
  \        damU = Mathf.Min(1, damU); // 限制最大为 1\n        float scl = (1-damU)*damageScale\
  \ + damU*1;\n        characterTrans.localScale = scl * Vector3.one;\n        health\
  \ -= dmg;\n        health = Mathf.Min(_maxHealth, health); // 如果治愈则限制血量\n      \
  \  ResetDamageDict(); // 为下一帧做准备\n        if (health <= 0) {\n            Die();\n\
  \        }\n    }\n    ...\n}\n```\n\n现在，当虫子受到伤害时，它会变成较小的尺寸（原始比例的 80%），然后在 0.25\
  \ 秒内恢复到 100%。保存场景，播放并用火焰法术进行测试。\n\n### 伤害 Mage\n\n`EnemyBug` 最后的任务是在接触时伤害 `Mage`。与任何敌人接触会导致\
  \ `Mage` 后退、损失血量并获得 1 秒的无敌。这将通过让 `Mage` 进入持续 1 秒的不同模式来实现，该模式控制所有这些因素。打开 `Mage` 脚本并进行所示编辑：\n\
  \n点击此处查看代码图像\n\n```sharp\npublic class Mage : PT_MonoBehaviour {\n    ...\n    public\
