  \ `Utils.ScreenBoundsCheck()` 来判断飞船是否离开了屏幕。\n3. 如果飞船偏移量 `off` 不为零，则将 `Hero` 移回屏幕。\n\
  \n尝试修改标记为 `// 2` 的行，使用其他的 `BoundsTest` 选项（`BoundsTest.center` 和 `BoundsTest.offScreen`），并观察它们如何改变\
  \ `ScreenBoundsCheck()` 的行为。使用 `BoundsTest.center` 时，飞船应该停止在半位置。使用 `BoundsTest.offScreen`\
  \ 时，你应该看到屏幕上只剩下一小条边缘。\n\n### 添加一些敌人\n\n这类游戏的敌人已经在第 25 章 “类”中略有介绍。\n\n\n\n\n\n按下播放，场景中的\
  \ `Enemy_0` 实例将向屏幕底部移动。然而，在目前的情况下，该实例将继续移出屏幕并一直存在，直到你停止游戏。我们需要让敌人在完全移出屏幕后自销毁。这是我们将再次使用\
  \ `Utils.ScreenBoundsTest()` 的另一个地方。\n\n在接下来的代码列表中，`Awake()` 方法中的单行代码创建了对 `CheckOffscreen()`\
  \ 方法的重复调用。`InvokeRepeating()` 是 Unity 的内置函数，用于调度对同一函数的重复调用。第一个参数是作为字符串的函数名，第二个参数是在第一次调用指定函数之前的延迟（以秒为单位），最后一个参数是后续每次调用之间的延迟。在\
  \ `Awake()` 函数中，`CheckOffscreen()` 将敌人实例化后立即被调用（`0` 秒），然后每每隔 2 秒再次调用一次，直到对象被销毁为止。\n\
  \n`CheckOffscreen()` 方法首先检查 `bounds.size` 是否为 `[0,0,0]`。由于 `Bounds` 是一个值类型（而不是引用类型），它的初始值是默认值\
  \ `center:[0,0,0] size:[0,0,0]` 而不是 `null`。（值类型永远不能被设置为 `null`。）为了检查它是否已被设置，我们检查其大小是否为默认值以外的值。如果边界尚未设置，将调用\
  \ `Utils.CombineBoundsOfChildren()` 来进行设置。与 `_Hero` 不同，某个 `Enemy` 飞船的边界中心可能与 `GameObject`\
  \ 的实际中心产生偏移，因此 `boundsCenterOffset` 被设置为该偏移值（对于之前定义的敌方飞船，这对于 `Enemy_4` 是必要的）。\n\n\
  在 `Enemy` 脚本中添加以下代码：\n\n点击此处查看代码图片\n\n```csharp\npublic class Enemy : MonoBehaviour\
  \ {\n\n    ...\n\n    public Vector3 boundsCenterOffset; // bounds.center 距离位置的距离\n\
  \n    void Awake() {\n        InvokeRepeating(\"CheckOffscreen\", 0f, 2f);\n   \
  \ }\n\n    ...\n\n    // 这是一个属性：行为像字段一样的方法\n    public Vector3 pos {\n        ...\n\
  \    }\n\n    void CheckOffscreen() {\n        // 如果 bounds 仍为默认值...\n        if\
  \ (bounds.size == Vector3.zero) {\n            // 则设置它们\n            bounds = Utils.CombineBoundsOfChildren(this.gameObject);\n\
  \            // 同时也找到 bounds.center 与 transform.position 之间的差异\n            boundsCenterOffset\
  \ = bounds.center - transform.position;\n        }\n        // 每次将 bounds 更新为当前位置\n\
  \        bounds.center = transform.position + boundsCenterOffset;\n        // 检查边界是否完全超出屏幕\n\
  \        Vector3 off = Utils.ScreenBoundsCheck(bounds, BoundsTest.offScreen);\n\
  \        if (off != Vector3.zero) {\n            // 如果这个敌人已经移出了屏幕底部\n          \
  \  if (off.y < 0) {\n                // 则销毁它\n                Destroy(this.gameObject);\n\
  \            }\n        }\n    }\n}\n```\n\n现在，当你运行场景时，你应该看到 `Enemy_0` 飞船向下移动屏幕，然后移出屏幕，并在移出屏幕几秒钟后它被销毁。\n\
  \n### 随机生成敌人\n\n在完成所有这些工作后，现在可以随机实例化多个 `Enemy_s`。创建一个名为 `Main` 的新 C# 脚本并将其挂载到 `MainCamera`\
  \ 上。输入以下代码：点击此处查看代码图片\n\n```csharp\nusing; // Unity 需要\nusing System.Collections;\
  \ // 数组和其他需要\nusing System.Collections.Generic; // 使用列表或字典需要\npublic class Main\
  \ : MonoBehaviour {\n    static Main S;\n    public GameObject[] prefemies;\n  \
  \  public float enemySpawnSecond = 0.5f; // 每秒敌人数量\n    public float enemySpawnPadding\
  \ = 1.5f; // 位置留白\n    public bool ________________;\n    public float enemySpawnRate;\
  \ // 每次生成之间的延迟\n    void Awake() {\n        S = this;\n        // 设置 Utils.camBounds\n\
  \        Utils.SetCameraBounds(this.camera);\n        // 0.5 敌人/秒 = enemySpawnRate\n\
  \        enemySpawnRate = 1f/enemySpawnSecond;\n        // 在 2 秒延迟后调用一次 SpawnEnemy()\n\
  \        Invoke(\"SpawnEnemy\", enemySpawnRate);\n    }\n    public void SpawnEnemy()\
  \ {\n        // 选择一个敌人预制体实例化\n        int ndx = Random.Range(0, prefemies.Length);\n\
  \        GameObject go = Instantiate(prefemies[ndx]) as GameObject;\n        //\
  \ 在屏幕上方带有随机 x 位置放置敌人\n        Vector3 pos = Vector3.zero;\n        float xMin =\
  \ Utils.camBounds.min.x+enemySpawnPadding;\n        float xMax = Utils.camBounds.max.x-enemySpawnPadding;\n\
  \        pos.x = Random.Range(xMin, xMax);\n        pos.y = Utils.camBounds.max.y\
  \ + enemySpawnPadding;\n        go.transform.position = pos;\n        // 几秒后再次调用\
  \ SpawnEnemy()\n        Invoke(\"SpawnEnemy\", enemySpawnRate);\n    }\n}\n```\n\
  \n1. 设置敌人生成速率的公共字段 `enemySpawnSecond` 存储了每秒生成的敌人数量。默认设置为 `0.5f`（每秒半个敌人）。此行代码将其转换为每次生成之间的延迟秒数（在此例中为\
  \ 2 秒），并赋值给 `enemySpawnRate`。\n2. `Invoke()` 函数的工作原理与 `InvokeRepeating()` 类似，但它只调用一次指定的函数。\n\
  3. 之所以使用 `Invoke()` 而不是 `InvokeRepeating()`，是因为我们希望能够动态调整每次生成敌人之间的时间。在 `SpawnEnemy()`\
  \ 的末尾添加 `Invoke()` 调用允许游戏随时调整 `enemySpawnRate` 并影响调用 `SpawnEnemy()` 的频率。\n\n###\
  \ 设置标签、层和物理效果\n\n正如第 28 章 中介绍的“原型 1：苹果拾取器”，Unity 中层（Layers）控制的功能之一是哪些对象可以或不可以发生相互碰撞。首先，让我们考虑一下这个太空射击游戏原型。在这个游戏中，多个不同类型的\
  \ GameObject 可以放置在不同的层上并以不同的方式相互作用：\n\n\n\n\n\n![Image](img/00003.jpeg) **Hero:**\
  \ `Hero` 飞船应该与敌人、敌人弹药和道具包碰撞，但不应与英雄的弹药碰撞。\n\n![Image](img/00003.jpeg) **ProjectileHero:**\
  \ 由 `Hero` 发射的弹药应该只与敌人碰撞。\n\n![Image](img/00003.jpeg) **Enemy:** 敌人应该与 `Hero` 和英雄弹药碰撞，但不要与道具包碰撞。\n\
  \n![Image](img/00003.jpeg) **ProjectileEnemy:** 由敌人发射的弹药应该只与 `Hero` 碰撞。\n\n![Image](img/00003.jpeg)\
  \ **PowerUp:** 道具包应该只与 `Hero` 碰撞。\n\n创建这五个层，请完成以下步骤：\n\n1. 在检查面板中**打开标签和层管理器**（`Edit\
  \ > Project Settings > Tags and Layers`）。标签（Tags）和层（Layers）是不同的，但它们都在标签和层管理器中设置。\n\
  \n2. **打开 Tags 旁边的展开三角形**。将 `Tags` 的 `Size` 设置为 7，并输入图 30.7 左图所示的标签。注意，在你输入 `Tags\
  \ Element 5`、`PowerUpBox` 名称的过程中，你可能会收到控制台消息（“Default GameObject Tag: PowerUp already\
  \ registered”），你可以安全地忽略它。\n\n![Image](img/00191.jpeg)\n\n**图 30.7** 显示此原型标签和层名称\
  \ TagManager\n\n3. **打开 Layers 旁边的展开三角形**。从 `User Layer 8` 开始，输入图 30.7 右图所示的层名称。`Builtin\
  \ Layers 0–7` 由 Unity 预留，但你可以设置 `User Layers 8–31` 的名称。\n\n4. **打开 PhysicsManager**（`Edit\
  \ > Project Settings > Physics`）并按照图 30.8 所示进行设置。\n\n![Image](img/00192.jpeg)\n\n\
  **图 30.8** 为此原型带有正确设置的 PhysicsManager\n\n* * *\n\n### Note\n\n从 Unity 4.3 开始，`Physics`\
  \ 和 `Physics2D` 都有设置。在本章中，你应该设置 `Physics`（标准的 3D PhysX 物理库），而不是 `Physics2D`。\n\n\
  * * *\n\n`PhysicsManager` 底部的网格设置了哪些层相互碰撞。如果有勾选，两个层中的对象就可以碰撞；如果没有勾选，它们不会。取消勾选可以加快游戏的执行速度，因为它们之间进行碰撞测试的对象会更少。正如你在图\
  \ 30.8 中所示，我们选择的层和碰撞实现了我们之前指定的碰撞行为。\n\n### 为 GameObject 分配正确的层\n\n现在层已经定义好了，你必须按照如下方法将创建的\
  \ GameObject 分配到正确的层：\n\n1. 在层级（Hierarchy）中选择 `Hero`，并在检查面板的 `Layer` 弹出菜单中选择 `Hero`。当\
  \ Unity 询问是否也将 `Hero` 的子物体分配到此新层时，选择 `Yes, change children`（是，更改子物体）。\n\n2. 使用检查面板中的\
  \ `Tag` 弹出菜单将 `Hero` 的标签设置为 `Hero`。你不需要更改 `Hero` 子物体的标签。\n\n3. 在项目面板中选择每个 `Enemy`\
  \ 预制体（prefab），并将每个设置为 `Enemy` 层。当被询问时，选择也更改其子物体的层。\n\n4. 同样将每个 `Enemy` 预制体的标签设置为\
  \ `Enemy`。你不需要设置每个敌人子物体的标签。\n\n### 让敌人伤害玩家\n\n现在敌人和英雄已经有了可以碰撞的层，我们需要让它们对碰撞做出反应。\n\
  \n在层级中打开 `Hero` 旁边的展开三角形，选择其子物体 `Shield`。在检查面板中，将 `Shield` 的 `Sphere Collider` 设置为触发器（trigger）（勾选\
  \ `Is Trigger` 旁边的框框）。我们不需要物体从 `Shield` 上弹开；我们只需要知道它们何时击中了它。\n\n在 `Hero` C# 脚本末尾添加以下粗体方法：\n\
  \n点击此处查看代码图像\n\n```csharp\npublic class Hero : MonoBehaviour {\n\n    ...\n\n  \
  \  void Update() {\n        ...\n    }\n\n    void OnTriggerEnter(Collider other)\
  \ {\n        print(\"Triggered: \"+other.gameObject.name);\n    }\n}\n```\n\n运行场景并尝试撞向一些敌人。你会发现为\
  \ `Enemy` 的子物体 GameObject（例如 `Cockpit` 和 `Wing`）触发了触发事件，但为 `Enemy` 本身没有。将这对方法添加到\
  \ `Utils` 类中，以便你能够向上 `transform.parent` 树移动以寻找带有标签的父物体（在此情况下为 `Enemy`）：\n\n点击此处查看代码图像\n\
  \n```csharp\npublic class Utils : MonoBehaviour {\n//============= Bounds Functions\
  \ ==============\n// 检查 lilB 是否在 bigB 内部\npublic static Vector3 BoundsCheck(Bounds\
  \ bigB, Bounds lilB, Bounds test = Bounds.Screen) {\n    ...\n}\n//Transform Functions\
  \ ===========\n// 此函数将迭代向上 transform.parent 树\n// 直到找到标签 != \"Untagged\" 的父物体或没有父物体\n\
  public static GameObject FindTaggedParent(GameObject go) {\n    // 1 如果此 gameObject\
  \ 有标签\n    if (go.tag != \"Untagged\") {\n        // 2 则返回此 gameObject\n       \
  \ return(go);\n    }\n    // 如果此 Transform 没有父物体\n    if (go.transform.parent ==\
  \ null) {\n        // 3 我们到达了层级的顶端但没有标签\n        // 所以返回 null\n        return(null);\n\
  \    }\n    // 否则，递归向上爬树\n    return(FindTaggedParent(go.transform.parent.gameObject));\
  \ // 4\n}\n// 此版本的函数处理了传入 Transform 的情况\npublic static GameObject FindTaggedParent(Transform\
  \ t) { // 5\n    return(FindTaggedParent(t.gameObject));\n}\n```\n\n1. `FindTaggedParent()`\
  \ 搜索 `go` 之上层级中带有标签（即标签不是 \"Untagged\"）的 GameObject。\n2. 如果 `go` 有标签，则返回该 `gameObject`。\n\
  3. 如果 `go.transform.parent` 为空，则 `go` 没有父物体。这意味着原始 `gameObject` 及其任何父物体都没有标签，因此返回\
  \ null。\n4. 因为 `go.transform.parent` 不为空，递归调用 `FindTaggedParent` 并传入 `go` 的父 `gameObject`。\n\
  5. 这是 `FindTaggedParent()` 的重载，它接收 `Transform` 作为初始参数，而不是另一个版本 `FindTaggedParent()`\
  \ 所要求的 `GameObject`。\n\n接下来，按照如下方式修改 `Hero` 类中的 `OnTriggerEnter()` 方法，以利用 `Utils.FindTaggedParent()`\
  \ 方法：\n\n点击此处查看代码图像\n\n```csharp\npublic class Hero : MonoBehaviour {\n\n    ...\n\
  \n    void Update() {\n        ...\n    }\n\n    void OnTriggerEnter(Collider other)\
  \ {\n        //  other.gameObject 或其父物体 GameObject 的标签\n        GameObject go =\
  \ Utils.FindTaggedParent(other.gameObject);\n        // 如果父物体带有标签\n        if (go\
  \ != null) {\n            // 宣布它\n            print(\"Triggered: \"+go.name);\n\
  \        } else {\n            // 否则宣布原始 other.gameObject\n            print(\"\
  Triggered: \"+other.gameObject.name); // 将此行移到这里！\n        }\n    }\n}\n```\n\n\
  现在当你运行场景并飞船撞向敌人时，你应该会看到 `OnTriggerEnter()` 宣布它击中了 *Enemy_0(Clone)*，这是 Enemy_0 的一个实例。\n\
  \n* * *\n\nTip\n\n\n\n\n\n# 迭代式代码开发\n\n在自己进行原型设计时，这种类型的公告测试是你经常会的操作，用以测试你编写的代码是否运行正常。我发现，在过程中像这样进行一些小测试，比编写了几个小时代码后最后才发现某个地方导致了\
  \ bug 要好得多。增量式测试会让调试变得*容易得多*，因为你你知道自从上一次运行通过的测试以来，你只做了微小的更改，因此更容易找到添加 bug 的地方。\n\
  \n这种方法的另一个关键要素是使用调试器。在编写此书的期间，每当我遇到运行结果与我的预期略有不同的情况时，我都会使用调试器来理解发生了什么。如果你不记得如何使用\
  \ MonoDevelop 调试器，我强烈建议重读第 24 章 中的“调试”。\n\n有效有效使用调试器通常是解决代码问题与仅仅对着几页代码发呆几个小时之间的区别。尝试在你刚刚修改的\
  \ `OnTriggerEnter()` 方法中放置一个调试断点，并观察代码是如何调用的以及变量是如何变化的。特别是 `Utils.FindTaggedParent()`\
  \ 的递归调用应该会很有趣。\n\n迭代式代码开发与设计的迭代过程具有相同的优势，它是第 27 章中“敏捷心态”所讨论的敏捷开发方法的关键。\n\n***\n\n\
  接下来，修改 `Hero` 类的 `OnTriggerEnter()` 方法，使与敌人碰撞时玩家的护盾减少 1 并销毁被击中的 `Enemy`。确保同一个父级\
  \ `GameObject` 不会触发两次护盾碰撞器也非常重要（对于移动非常快的物体，如果一个物体的两个子碰撞器在同一帧内击中护盾触发器，就会发生这种情况）。\n\
  \n点击此处查看代码图像\n\n```csharp\npublic class Hero : MonoBehaviour {\n    ...\n\n    void\
  \ Update() {\n        ...\n    }\n\n    // 此变量持有对上一个触发 GameObject 的引用\n    public\
  \ GameObject lastTriggerGo = null; // 1\n\n    void OnTriggerEnter(Collider other)\
  \ {\n        ...\n        if (go != null) {\n            // 确保它不是上一次触发的同一个 go\n\
  \            if (go == lastTriggerGo) { // 2\n                return;\n        \
  \    }\n            lastTriggerGo = go; // 3\n            if (go.tag == \"Enemy\"\
  ) {\n                // 如果护盾是由敌人触发的\n                // 将护盾等级减少 1\n            \
  \    shieldLevel--;\n                // 销毁敌人\n                Destroy(go); // 4\n\
  \            } else {\n                print(\"Triggered:\"+go.name); // 移动这一行！\n\
  \            }\n        } else {\n            ...\n        }\n    }\n}\n```\n\n\
  1. 此字段持有对上一个触发护盾的 `GameObject` 的引用。它初始被设置为 null。虽然我们通常在类的顶部声明字段，但它们可以在类的任何地方声明，就像我们这一行所做的那样。\n\
  2. 如果 `lastTriggerGo` 与 `go`（当前的 `GameObject`）相同，则该碰撞将作为重复被忽略，这发生在同一个 `Enemy` 的两个子\
  \ GameObject 同时（即在同一帧内）触发护盾碰撞器时。\n3. 将 `go` 赋值给 `lastTriggerGo`，以便在下一次调用 `OnTriggerEnter()`\
  \ 时进行更新。\n4. `go`，即敌人 `GameObject`，由于击中护盾而被销毁。因为我们正在测试的实际 `GameObject` 是 `Utils.FindTaggedParent()`\
  \ 找到的 `Enemy`。\n\n\n\n\n\n```csharp\nInvoke(\"Restart\", delay);\n}\n\npublic void\
  \ Restart() {\n    // 重新加载 _Scene_0 以重启游戏\n    Application.LoadLevel(\"_Scene_0\"\
  );\n}\n}\n```\n\n现在，一旦玩家船被摧毁，游戏会等待几秒然后通过重新加载场景来重启。\n\n### 射击（终于到了）\n\n既然敌船现在可以伤害玩家了，是时候给\
  \ `Hero` 提供一种反击的方法了。\n\n#### 艺术资源\n\n创建一个空的 `GameObject`，命名为 `Weapon`，并赋予它以下结构和子物体：\n\
