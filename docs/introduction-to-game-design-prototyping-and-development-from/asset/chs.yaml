  我确定你注意到回合结束得非常突兀。让我们解决这个问题。首先，我们将使用 `Invoke()` 函数延迟关卡的实际加载。首先，我们将以下加粗的代码添加到 `Prospector`：\n\
  \n点击此处查看代码图\n\n```csharp\npublic class Prospector : MonoBehaviour {\n    static\
  \ public Prospector S;\n    static public int SCORE_FROM_PREV_ROUND = 0;\n    static\
  \ public int HIGH_SCORE = 0;\n    public float reloadDelay = 1f; // 回合之间的延迟\n  \
  \  public Vector3 fsPosMid = new Vector3(0.5f, 0.9f, 0);\n    ...\n    // 当游戏结束时调用。目前比较简单，但可以扩展\n\
  \    void GameOver(bool won) {\n        if (won) {\n            ScoreManager(ScoreEvent.win);\n\
  \        } else {\n            ScoreManager(ScoreEvent.loss);\n        }\n     \
  \   // 在 reloadDelay 秒后重新加载场景\n        // 这为分数移动留出时间\n        Invoke (\"ReloadLevel\"\
  , reloadDelay); //1\n        // Application.LoadLevel(\"__Prospector_Scene_0\");\
  \ // 现在被注释掉了\n    }\n    void ReloadLevel() {\n        // 重新加载场景，重置游戏\n        Application.LoadLevel(\"\
  __Prospector_Scene_0\");\n    }\n    ...\n}\n```\n\n1. //1 的 `Invoke()` 通过在 `reloadDelay`\
  \ 秒后调用名为 `ReloadLevel` 的函数来工作。这与 `SendMessage()` 的原理类似，但带有延迟。现在当你玩游戏时，它会等待最后回合的分数移动到\
  \ _Scoreboard_ 之后才会重新加载游戏。\n\n#### 给玩家提供分数反馈\n\n\n\n\n\n我们还想告诉玩家她在每一轮结束时的表现如何。在场景中添加两个新的\
  \ `GUIText`，并将它们命名为 `GameOver` 和 `RoundResult`。为它们设置如图 31.15 所示的参数。\n\n![Image](img/00224.jpeg)\n\
