  \    public void BuildRoom(PT_XMLhtable room) {\n        // 从 <room> 属性获取地板和墙壁的纹理名称\n\
  \        string floorTexStr = room.att(\"floor\");\n        string wallTexStr =\
  \ room.att(\"wall\");\n        // 根据 Rooms.xml 文件中的换行符将房间分为瓷砖行\n        string[]\
  \ roomRows = room.text.Split('\\n');\n        // 去除行首的制表符。然而，我们留下了空格\n        //\
  \ 和下划线，以便允许非矩形房间。\n        for (int i=0; i<roomRows.Length; i++) {\n           \
