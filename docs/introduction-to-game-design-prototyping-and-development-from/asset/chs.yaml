  \n将完成的 `BoidSpawner` C# 脚本拖到 `_MainCamera` 上。完成后，你还需要在 Inspector 面板中为 `_MainCamera`\
  \ 设置 `boidPrefab` 变量。要这样做，请在 Hierarchy（层级）面板中选择 `_MainCamera`。然后会在 Inspector 的 `BoidSpawner`\
  \ (Script) 组件中寻找 `boidPrefab` 变量。点击 `boidPrefab` 变量右侧的圆形目标，然后从 Assets 选项卡中选择 `Boid`。\n\
  \nBoids 本身要复杂一些，这将会是你迄为止编写的最长的脚本，但与其它所生成的行为复杂度相比，该脚本仍然很短。从菜单栏选择 `Assets` > `Create`\
  \ > `C# script`，并将脚本重命名为 `Boid`。双击 `Boid` C# 脚本在 MonoDevelop 中打开它，并输入 Listing 26.2\
  \ 中的代码。\n\n### Listing 26.2 Boid C# 脚本\n\n点击此处查看代码图像\n\n```csharp\nusing UnityEngine;\n\
  using System.Collections;\nusing System.Collections.Generic;  // 使用泛型 List 所必需\n\
  \npublic class Boid : MonoBehaviour {\n    // 这个静态 List 持有所有的 Boid 实例并在它们之间共享\n\
  \    static public List<Boid>    boids;\n\n    // 注意：此代码没有使用 Rigidbody。它直接处理速度\n\
