  \n![Image](img/00200.jpeg)\n\n接下来，选择 `_Hero`，并在检测器（Inspector）的 Hero (Script) 组件中打开\
  \ `weapons` 字段的展开三角形。将 `weapons` 的 `Size` 设置为 5，并按顺序将 `Weapon_0` 到 `Weapon_4` 分配给五个武器槽位（可以从层级面板中拖入它们，也可以点击武器槽位右侧的目标对象并从\
  \ Scene 选项卡中选择每个 `Weapon_#`）。图 30.13 显示了最终的设置。\n\n![Image](img/00201.jpeg)\n\n**图\
  \ 30.13** `Hero` 飞船显示五个武器作为子物体并分配给 weapons 字段\n\n### 解决代码中的竞态条件\n\n现在，当你尝试运行我们创建的场景时，可能会在控制台（Console）面板中遇到错误消息。也可能不会遇到这个错误。在这段代码中，我故意创建了一个竞态条件（race\
  \ condition），向你展示如何解决它们。竞态发生在一段代码必须在另一段代码之前执行，但它们可能会以错误的顺序执行。这两段代码最终在相互竞争。竞态条件的问题在于它们是不可预测的，所以你可能不会遇到我尝试创建的错误。无论如何，请阅读这一节。竞态条件是你应该理解的一种重要错误类型。你可能遇到的错误如下：\n\
  \n```\n`NullReferenceException`: Object reference not set to an instance of an object\
  \ Main.GetWeaponDefinition (WeaponType wt) (at Assets/__Scripts/Main.cs:38) Weapon.SetType\
  \ (WeaponType wt) (at Assets/__Scripts/Weapon.cs:77) Hero.Awake () (at Assets/__Scripts/Hero.cs:35)\n\
  ```\n\n如果你双击错误消息，它应该会带你到 `Main.cs` 的第 38 行。（你的行可能会略有不同。）第 38 行是：\n\n```cs\nif (W_DEFS.ContainsKey(wt))\
  \ {\n```\n\n让我们使用调试器来了解更多关于错误原因。（即使你没有遇到错误，也请这样做）。在 `Main.cs` 的这一行旁边添加一个断点，并将调试器附加到\
  \ Unity（通过点击 MonoDevelop 窗口左上角的播放图标，或从 MonoDevelop 菜单栏中选择 `Run > Attach to Process`）。如果你需要复习调试器的使用，请重读第\
  \ 24 章。遗憾的是，在这种情况下，你需要在场景首次开始播放时就附加调试器，因此在第 24 章中描述的先让游戏暂停启动稍后附加调试器的技巧对这些 bug 是不起的。\n\
  \n当你附加调试器运行项目（在 Unity 中）时，它会立即冻在执行该行之前的第 38 行断点处。我们知道这一行有问题，并且由于是 `NullReferenceException`，我们知道代码正尝试访问某个尚未定义的变量。让我们查看每个变量并看看发生了什么。\n\
  \n**1.** 在 MonoDevelop 中打开监视（Watch）面板（从菜单栏选择 `View > Debug Windows > Watch`；旁边应该已经有一个勾选，再次选择它会将监视面板带到最前面）。\n\
  \n**2.** 这一行使用的两个变量是 `W_DEFS`（`Main` 类的静态变量）和 `wt`（方法 `GetWeaponDefinition()` 的局部变量）。\n\
  \n**3.** 将这些中的每一个输入到监视窗口的一行中，你就能看到它们各自的值。\n\n**4.** 正如预期的，`W_DEFS` 未被定义（其值为 `null`）。（也就是说，如果你在你的机器上遇到了竞态条件错误的话）。但我们知道\
  \ `W_DEFS` 在 `Main.Awake()` 中被正确定义了。你可以看到上方几行执行此操作的代码。`W_DEFS` 不被定义的唯一可能是 `Main.Awake()`\
  \ 尚未运行。\n\n这就是竞态条件。`Main.Awake()` 定义了 `W_DEF`，而 `Hero.Awake()` 正在尝试使用该值。我们知道 `Awake()`\
  \ 在每个游戏对象产生时会被调用，但不清楚它们被调用的顺序。我相信它可能是按照对象在层级面板中列出的顺序发生的，但我并不确定。你的 `Awake()` 方法被调用的顺序可能与我的不同。\n\
  \n这是竞态条件的主要问题。两个 `Awake()` 函数正在相互竞争。当其中一个先被调用时，你的代码运行正常；但当另一个先被调用时，一切都会崩溃。无论你的代码是否恰好在工作，这都是你需要解决的问题，因为即使在同一台电脑上，这两个函数的顺序也是不确定的。\n\
  \n\n\n\n```csharp\ncollar = transform.Find(\"Collar\").gameObject;\n}\n\nvoid Start()\
  \ {\n    // 为默认的 _type 正确调用 SetType()\n    SetType(_type);\n    ...\n}\n```\n\n\
  现在，竞态条件应该已经解决了。`Weapon.Awake()` 会在调用 `Weapon.Start()` 或 `Hero.Start()` 之前定义 `collar`。此外，`Main.Awake()`\
  \ 会在调用 `Hero.Start()` 之前设置 `Main.W_DEFS` 的值。竞态条件是新游戏开发者容易陷入的常见错误，能够识别出何时可能遇到此类问题至关重要。这就是为什么我带你进入这个问题，并向你展示了如何发现和解决它。\n\
  \n## 让敌人掉落强化道具\n\n回到强化道具上。让我们敌人在被摧毁时有概率掉落随机强化道具。这为玩家提供了更多动力去摧毁敌人而不是仅仅躲避它们，并且为玩家提供了改进飞船的路径。\n\
  \n在 `Enemy` 和 `Main` C# 脚本中添加以下代码：\n\n点击此处查看代码图片\n\n```csharp\npublic class Enemy\
  \ : MonoBehaviour {\n    ...\n    public int showDamageForFrames = 2; // 显示伤害的帧数\n\
  \    public float powerUpDropChance = 1f;  // 掉落强化道具的概率\n    public bool ________________;\n\
  \    ...\n    void OnCollisionEnter(Collision coll) {\n        ...\n        case\
  \ \"ProjectileHero\":\n            ...\n            if (health <= 0) {\n       \
  \         // 通知 Main 单例该飞船已被摧毁\n                Main.S.ShipDestroyed(this);\n  \
  \              // 销毁这个敌人\n                Destroy(this.gameObject);\n          \
  \  }\n            ...\n    }\n    }\n    ...\n}\n\npublic class Main : MonoBehaviour\
  \ {\n    ...\n    public WeaponDefinition[] weaponDefinitions;\n    public GameObject\
  \ prefabPowerUp;\n    public WeaponType[] powerUpFrequency = new WeaponType[] {\n\
  \        WeaponType.blaster, WeaponType.blaster,\n        WeaponType.spread,\n \
  \       WeaponType.shield\n    };\n    public bool ________________;\n    ...\n\
  \    public void ShipDestroyed(Enemy e) {\n        // 可能生成一个强化道具\n        if (Random.value\
  \ <= e.powerUpDropChance) {\n            // Random.value 生成一个 0 到 1 之间的值（尽管永远不等于\
  \ 1）\n            // 如果 e.powerUpDropChance 是 0.50f，则会有 50% 的概率生成强化道具\n        \
  \    // 为了测试，现在设置为 1f。\n            // 选择要选取哪种强化道具\n            // 从 powerUpFrequency\
  \ 中选取一个\n            int ndx = Random.Range(0,powerUpFrequency.Length);\n      \
  \      WeaponType puType = powerUpFrequency[ndx];\n            // 实例化强化道具\n    \
  \        GameObject go = Instantiate(prefabPowerUp) as GameObject;\n           \
  \ PowerUp pu = go.GetComponent<PowerUp>();\n            // 设置其为正确的 WeaponType\n\
  \            pu.SetType(puType);\n            // 将其设置为被摧毁飞船的位置\n            pu.transform.position\
  \ = e.transform.position;\n        }\n    }\n}\n```\n\n在这些代码生效之前，你需要在 Unity 层层面板（Hierarchy）中选择\
  \ `_MainCamera`，并将 `Main` 脚本的 `prefabPowerUp` 字段设置为 `Prefabs` 文件夹中的 `PowerUp` 制体。`powerUpFrequency`\
  \ 应该已经在检查器（Inspector）中设置，但以防万一，图 30.14 显示了正确的设置。注意枚举在 Unity 检查器中显示为弹出菜单。\n\n![Image](img/0202.jpeg)\n\
  \n**图 30.14** `_MainCamera` 上 `Main`（脚本）组件的 `PowerUp` 和 `powerUpFrequency`\n\n运行场景并摧毁一些敌人。它们应该掉落改进你飞船的强化道具！你会注意到随着时间的推移，激光\
  \ [B] 强化道具比散弹 [S] 或护盾 [O] 更常见。这是因为在 `powerUpFrequency` 中出现了两次 blaster，而 spread 和\
  \ shield 各一次。通过调整 `powerUpFrequency` 中每种类型的相对数量，你可以决定它们相对于其他类型被中的概率。同样的技巧也可以用于设置不同类型敌人的频率，通过将某些敌人多次分配到\
  \ `prefabEnemies` 数组中。\n\n## 编写敌人\n\n现在游戏的核心元素已经运行正常，是时候扩展敌人的种类了。创建名为 `Enemy_1`、`Enemy_2`、`Enemy_3`\
  \ 和 `Enemy_4` 的新 C# 脚本，并将它们分配给项目面板中相应的 `Enemy_` 制体。\n\n### Enemy_1\n\n在 Mono 中打开\
  \ `Enemy_1` 脚本并输入以下代码：\n\n点击此处查看代码图片\n\n```csharp\nusing UnityEngine;\nusing System.Collections;\n\
  \n// Enemy_1 继承自 Enemy 类\npublic class Enemy_1:Enemy {\n    // 因为 Enemy_1 继承了 Enemy，_____\
  \ bool 在检查器面板中的工作方式不同。\n    // 完全正弦波的秒\n    public float waveFrequency = 2;\n  \
  \  // 米为单位的正弦波宽度\n    public float waveWidth = 4;\n    public float waveRotY = 45;\n\
  \    private float x0 = -12345; // pos 的初始 x 值\n    private float birthTime;\n\n\
  \    void Start() {\n        // 将 x0 设置为 Enemy_1 的初始 x 位置\n        // 这运行良好，因为在\
  \ Start() 运行之前\n        // Main.SpawnEnemy() 已经设置了位置\n        // （尽管 Awake() 会太早了！）。\n\
  \        // 这也是好的，因为 Enemy 上没有 Start 方法。\n        x0 = pos.x;\n        birthTime\
  \ = Time.time;\n    }\n\n    // 重写 Enemy 的 Move 函数\n    public override void Move()\
  \ {\n        // 2\n        // 因为 pos 是一个属性，你不能直接设置 pos.x\n        // 所以获取 pos 作为可编辑的\
  \ Vector3\n        Vector3 tempPos = pos;\n        // theta 随时间调整\n        float\
  \ age = Time.time - birthTime;\n        float theta = Mathf.PI * 2 * age / waveFrequency;\n\
  \        float sin = Mathf.Sin(theta);\n        tempPos.x = x0 + waveWidth * sin;\n\
  \        pos = tempPos;\n        // 绕 y 轴旋转\n        Vector3 rot = new Vector3(0,\
  \ waveRotY, 0);\n        this.transform.rotation = Quaternion.Euler(rot);\n    \
  \    // base.Move() 仍然处理 y 轴的移动\n        base.Move(); // 3\n    }\n}\n```\n\n\n\n\
  \n\n# 仅球体碰撞体会均匀缩放\n\n你可能注意到，与 `Enemy_1` 的碰撞实际上在弹药到达机翼之前发生了。如果你在 `Project` 面格中选择\
  \ `Enemy_1` 并将一个实例拖入场景，你会发现 `Enemy_1` 周围的绿色碰撞体球体并没有缩放以匹配机翼的扁平椭圆。这并不是一个大问题，但值得注意。`Sphere\
  \ Collider`（球体碰撞体）会根据 transform 中最大的单个缩放组件进行缩放。（在这种情况下，由于 `wing` 的 `Scale.x` 为 6，`Sphere\
  \ Collider` 会缩放大到该大小。）\n\n如果你愿意，可以尝试其他类型的碰撞体，看看是否有其中一种能更精确地匹配机翼。`Box Collider`（盒形碰撞体）会非均匀缩放。你也可以用\
  \ `Capsule Collider`（胶囊碰撞体）近似一个方向比其他方向长得多。`Mesh Collider`（网格碰撞体）的匹配最精确，但 `Mesh Colliders`\
  \ 的运行速度比其他类型慢得多。这在现代高性能 PC 上可能不是问题，但对于 iOS 或 Android 等移动平台来说，`Mesh Colliders` 通常太慢。\n\
  \n如果你选择给 `Enemy_1` 配备 `Box Collider` 或 `Mesh Collider`，当它绕 y 轴旋转时，机翼的边缘将移出 XY（即\
  \ z=0）平面。这就是为什么 `ProjectileHero` 预制的 `Box Collider Size.z` 为 10（以确保即使翼尖不在 XY 平面上，也能击中\
  \ `Enemy_1` 的翼尖）。\n\n## 准备其他敌人\n\n剩余的敌人使用了线性插值，这是一个重要的开发概念，在附录 B 中有所描述。你在第 29 章的“原型\
  \ 2：任务破坏”中看到过一个非常简单的插值，但这些将会更加有趣。在处理剩余敌人之前，请花时间阅读附录 B 中的“插值”部分。\n\n## Enemy_2\n\n\
  Enemy_2 将通过一个受正弦波高度缓动的线性插值移动。它将从屏幕侧冲入，减速，反转方向一会儿，减速，然后沿着初始速度飞出屏幕。这种插值仅使用两个点，但 `u`\
  \ 值会被正弦波剧烈弯曲。Enemy_2 的 `u` 值的缓动函数如下：\n\n```text\nu = u + 0.6 * Sin(2π * u)\n```\n\
  \n这是附录 B 中“插值”部分描述的缓动函数之一。\n\n打开 `Enemy_2` C# 脚本并输入以下代码。在代码运行后，欢迎调整缓动曲线并观察它如何影响运动。\n\
  \n点击此处查看代码图像\n\n```csharp\nusing UnityEngine;\n\nusing System.Collections;\n\npublic\
  \ class Enemy_2 : Enemy {\n\n    // Enemy_2 使用 Sin 波修改 2 点线性插值\n    public Vector3[]\
  \ points;\n    public float birthTime;\n    public float lifeTime = 10;\n    //\
  \ 决定正弦波对运动的影响程度\n    public float sinEccentricity = 0.6f;\n\n    void Start () {\n\
  \        // 初始化点\n        points = new Vector3[2];\n        // 找到 Utils.camBounds\n\
  \        Vector3 cbMin = Utils.camBounds.min;\n        Vector3 cbMax = Utils.camBounds.max;\n\
  \        Vector3 v = Vector3.zero;\n        // 在屏幕左侧选取任意点\n        v.x = cbMin.x\
  \ - Main.S.enemySpawnPadding;\n        v.y = Random.Range(cbMin.y, cbMax.y);\n \
  \       points[0] = v;\n        // 在屏幕右侧选取任意点\n        v = Vector3.zero;\n     \
  \   v.x = cbMax.x + Main.S.enemySpawnPadding;\n        v.y = Random.Range(cbMin.y,\
  \ cbMax.y);\n        points[1] = v;\n        // 可能交换位置\n        if (Random.value\
  \ < 0.5f) {\n            // 将每个点的 .x 设置为负值将使其移动到\n            // 屏幕另一侧\n       \
  \     points[0].x *= -1;\n            points[1].x *= -1;\n        }\n        //\
  \ 将 birthTime 设置为当前时间\n        birthTime = Time.time;\n    }\n\n    public override\
  \ void Move() {\n        // Bézier 曲线作用于 0 到 1 之间的 u 值\n        float u = (Time.time\
  \ - birthTime) / lifeTime;\n        // 如果 u>1，说明时间超过了 lifeTime\n        if (u >\
  \ 1) {\n            // 这个 Enemy_2 结束了生命周期\n            Destroy(this.gameObject);\n\
  \            return;\n        }\n        // 通过正弦波添加缓动曲线来调整 u\n        u = u + sinEccentricity\
  \ * Mathf.Sin(u * Mathf.PI * 2);\n        // 插值两个点\n        pos = (1-u) * points[0]\
  \ + u * points[1];\n    }\n}\n```\n\n将 `Enemy_2` 预制体放入 `Main.S.prefabEnemies` 的\
  \ 0 槽位，使用 Inspector 面板并播放。你可以看到 `Enemy_2` 在屏幕两侧选择的点之间具有非常平滑的运动。\n\n## Enemy_3\n\n\
  Enemy_3 将使用 Bézier 曲线从上方俯冲、减速，然后飞回屏幕顶部。在这个例子中，我们将使用简单的三点 Bézier 曲线。在附录 B 的“插值”部分中，你可以找到可以使用任意数量点的递归\
  \ Bézier 曲线函数（而不只是三个点）。\n\n打开 `Enemy_3` 脚本并输入以下代码：\n\n点击此处查看代码图像\n\n```csharp\n\
  using UnityEngine;\n\nusing System.Collections;\n\n// Enemy_3 继承 Enemy\npublic class\
  \ Enemy_3 : Enemy {\n\n    // Enemy_3 将遵循 Bézier 曲线，这是两个点之间的\n    // 线性插值\n    public\
  \ Vector3[] points;\n    public float birthTime;\n    public float lifeTime = 10;\n\
  \    // 再次，Start 运行良好，因为它没有被 Enemy 使用\n    void Start () {\n        // 初始化点\n  \
  \      points = new Vector3[3];\n        // 已经由 Enemy() 设置\n        points[0] =\
  \ pos;\n        // 按照 Enemy() 的方式设置 xMin 和 xMax\n        float xMin = Utils.camBounds.min.x\
  \ + Main.S.enemySpawnPadding;\n        float xMax = Utils.camBounds.max.x - Main.S.enemySpawnPadding;\n\
  \        // 在屏幕下半部分选取随机位置\n        Vector3 v = Vector3.zero;\n        v.x = Random.Range(xMin,\
  \ xMax);\n        v.y = Random.Range(Utils.camBounds.min.y, Utils.camBounds.min.y);\n\
  \        points[1] = v;\n        // 在屏幕上方选取随机位置\n        v = Vector3.zero;\n   \
  \     v.x = Random.Range(xMin, xMax);\n        v.y = Random.Range(Utils.camBounds.max.y,\
  \ Utils.camBounds.max.y);\n        points[2] = v;\n        // 将 birthTime 设置为当前时间\n\
  \        birthTime = Time.time;\n    }\n\n    public override void Move() {\n  \
  \      // Bézier 曲线作用于 0 到 1 之间的 u 值\n        float u = (Time.time - birthTime)\
  \ / lifeTime;\n        // 如果 u>1，说明时间超过了 lifeTime\n        if (u > 1) {\n      \
  \      // 这个 Enemy_3 结束了生命周期\n            Destroy(this.gameObject);\n          \
  \  return;\n        }\n        // 插值三个 Bézier 点\n        Vector3 p01, p12;\n   \
  \     p01 = (1-u) * points[0] + u * points[1];\n        p12 = (1-u) * points[1]\
  \ + u * points[2];\n        pos = (1-u) * p01 + u * p12;\n    }\n}\n```\n\n\n\n\n\
  \n## 2. `Enemy_3` 在曲线中间部分会变慢。这也是贝塞尔曲线的特性之一。如果你愿意，可以在曲线点进行插值之前，在 `Enemy_3` 的 `Move()`\
  \ 方法中添加以下**粗体行代码**来纠正这一点。这将为 `Enemy_3` 的移动添加缓动（easing），从而加快中间部分的速度，使运动感觉更加平滑：\n\n\
  点击此处查看代码图片\n\n```\nVector3 p01, p12;\nu = u - 0.2f*Mathf.Sin(u*Mathf.PI*2);\np01\
  \ = (1-u)*points[0] + u*points[1];\n```\n\n## Enemy_4\n\n`Enemy_4` 作为某种 Boss 类型的敌人，将比其他类型的敌人拥有更多的生命值，并且具有可破坏的部位（而不是所有部位同时被销毁）。它将一直留在屏幕上，从一个位置移动到另一个位置，直到玩家将其完全摧毁。\n\
  \n### 碰撞体修改\n\n在进入代码问题之前，你需要对 `Enemy_4` 的碰撞体进行一些调整。首先，将 `Enemy_4` 的实例拖入层级面板（Hierarchy），并确保它的位置与场景中的其他\
  \ GameObject 保持距离。\n\n打开层级面板中 `Enemy_4` 旁边的展开三角形，选择 `Enemy_4.Fuselage`。通过菜单栏中的 `Component\
  \ > Physics > Capsule Collider` 将 `Sphere Collider` 替换为 `Capsule Collider`。如果 Unity\
  \ 询问你，选择将 `Sphere Collider` 替换为 `Capsule Collider`；如果它没有询问，你需要手动移除 `Sphere Collider`。在\
  \ Fuselage 检查器中按如下所示设置 `Capsule Collider`：\n\n![Image](img/00203.jpeg)\n\n你可以尝试调整这些值以观察它们如何影响结果。如你所看到的，`Capsule\
  \ Collider` 比 `Sphere Collider` 更好地贴合 `Fuselage`（机身）。\n\n现在，在层级面板中选择 `Wing_L`，同样将其\
  \ `Sphere Collider` 替换为 `Capsule Collider`。该碰撞体的设置如下：\n\n![Image](img/00204.jpeg)\n\
  \n`Direction` 设置选择了胶囊体的长轴。这是在本地坐标中确定的，因此沿 `X` 轴高度为 `5` 的 `Capsule Collider` 与 `Transform`\
  \ 中 `X` 维度的比例 `5` 相匹配。`0.1` 的半径表示半径应该是高度的 `1/10`（`5 * 1/10 = 0.5`，即 `Z Scale` 维度）。你可以看到胶囊体并没有完美匹配机翼，但它比球体要贴合得多。\n\
  \n选择 `Wing_R`，将其碰撞体替换为 `Capsule Collider`，并为该碰撞体设置与 `Wing_L` 相同的参数。完成这些更改后，点击检查器面板顶部的\
  \ `Prefab > Apply` 按钮，将这些更改提交到项目面板（Project）中的 `Enemy_4` 预制体。为了双重检查操作是否成功，将第二个 `Enemy_4`\
  \ 预制体实例拖入层级面板，并检查所有碰撞体看起来都正确。完成后，从层级面板中删除两个 `Enemy_4` 实例。\n\n如果你愿意，这种胶囊碰撞体策略也可以应用于\
  \ `Enemy_3`。\n\n### Enemy_4 的移动\n\n`Enemy_4` 将从屏幕顶部的标准位置开始，在屏幕上随机选择一个点，并随着时间的线性插值移动到那里。每当\
  \ `Enemy_4` 到达插值点时，它都会选择一个新点并开始向其移动。打开 `Enemy_4` 脚本并输入以下代码：\n\n点击此处查看代码图片\n\n```\n\
  using UnityEngine;\nusing System.Collections;\n\npublic class Enemy_4 : Enemy {\n\
  \    // Enemy_4 将从屏幕外开始，然后在屏幕上随机选择一个点\n    // 移动到那里。一旦到达，它将选择另一个随机点并\n    // 继续移动，直到玩家将其击落。\n\
  \    public Vector3[] points;  // 存储用于插值的 p0 & p1\n    public float timeStart; \
  \ // 此 Enemy_4 的出生时间\n    public float duration = 4;  // 移动持续时间\n    void Start\
  \ () {\n        points = new Vector3[2];\n        // Main.SpawnEnemy() 已经选择了一个初始位置\n\
  \        // 所以将其添加到 points 作为初始的 p0 & p1\n        points[0] = pos;\n        points[1]\
  \ = pos;\n        InitMovement();\n    }\n    void InitMovement() {\n        //\
  \ 在屏幕上选择一个新点移动过去\n        Vector3 p1 = Vector3.zero;\n        float esp = Main.S.enemyPadding;\n\
  \        Bounds cBounds = Utils.camBounds;\n        p1.x = Random.Range(cBounds.min.x\
  \ + esp, cBounds.max.x - esp);\n        p1.y = Random.Range(cBounds.min.y + esp,\
  \ cBounds.max.y - esp);\n        points[0] = points[1]; // 将 points[1] 移动到 points[0]\n\
  \        points[1] = p1;\n    }\n}\n```\n\n\n\n\n\n```csharp\n// 缓存每个 Part 的 GameObject\
  \ 和 Material\nTransform t;\n\nforeach(Part prt in parts) {\n    t = transform.Find(prt.name);\n\
  \    if (t != null) {\n        prt.go = t.gameObject;\n        prt.mat = prt.go.renderer.material;\n\
  \    }\n}\n...\n\npublic override void Move() {\n    ...\n}\n\n// 这将覆盖 Enemy.cs\
  \ 中定义的 OnCollisionEnter\n// 因为 MonoBehaviour 声明 Unity 通用函数（如 OnCollisionEnter()）的方式\n\
  // 所以不需要 override 关键字。\nvoid OnCollisionEnter( Collision coll ) {\n    GameObject\
  \ other = coll.gameObject;\n    switch (other.tag) {\n    case \"ProjectileHero\"\
  :\n        Projectile p = other.GetComponent<Projectile>();\n        // 除非在屏幕上，否则敌人不会受伤\n\
  \        // 这防止了玩家在敌人可见之前击中它们\n        bounds.center = transform.position + boundsOffset;\n\
  \        if (bounds.extents == Vector3.zero || Utils.ScreenBoundsCheck(bounds, BoundsTest.offScreen)\
  \ != Vector3.zero) {\n            Destroy(other);\n            break;\n        }\n\
  \        // 伤害敌人\n        // 找到被击中的 GameObject\n        // Collision coll 有 contacts[]，一个\
  \ ContactPoints 数组\n        // 因为发生了碰撞，我们保证至少有一个 contacts[0]\n        // thisCollider\
  \ 是被击中的 Enemy_4 部分的碰撞\n        GameObject goHit = coll.contacts[0].thisCollider.gameObject;\n\
  \        Part prtHit = FindPart(goHit);\n        if (prtHit == null) { // 如果没有找到\
  \ prtHit\n            // ...通常是因为 contacts[0] 是 ProjectileHero 而不是 ship\n      \
  \      // 如果是这样，查找 otherCollider\n            goHit = coll.contacts[0].otherCollider.gameObject;\n\
  \            prtHit = FindPart(goHit);\n        }\n        // 检查部分是否仍保护\n      \
  \  if (prtHit != null) { \n            foreach(string s in prtHit.protectedBy) {\n\
  \                // 如果保护部件尚未销毁...\n                if (!Destroyed(s)) {\n      \
  \              // ...那么还没有造成伤害\n                    Destroy(other); // 销毁 Projectile\n\
  \                    return; // 在导致之前返回\n                }\n            }\n    \
  \    }\n        // 未被保护，所以受到伤害\n        // 从 Projectile.type & Main_DEFS 获取伤害值\n\
  \        prtHit.health -= Main_DEFS[p.type].damageOnHit;\n        // 在部分上显示伤害\n\
  \        ShowLocalizedDamage(prtHit.mat);\n        if (prtHit.health <= 0) {\n \
  \           // 不是销毁敌人，而是禁用损坏的部分\n            prtHit.go.SetActive(false);\n     \
  \   }\n        // 检查整个飞船是否已销毁\n        bool allDestroyed = true; // 假设已销毁\n    \
  \    foreach(Part prt in parts) {\n            if (!Destroyed(prt)) { // 如果部分还存在\n\
  \                allDestroyed = false; // 将 allDestroyed 设置为 false\n           \
  \     break; // 跳出 foreach 循环\n            }\n        }\n        if (allDestroyed)\
  \ { // 如果完全销毁\n            // 通知 Main 单例飞船已销毁\n            Main.S.ShipDestroyed(\
  \ this );\n            // 销毁敌人\n            Destroy(this.gameObject);\n        }\n\
  \        Destroy(other); // 销毁 Projectile\n        break;\n    }\n}\n\n// 这两个函数通过名称或\
  \ GameObject 在 this.parts 中查找 Part\nFindPart(string n) {\n    foreach(Part prt in\
  \ parts ) {\n        if (prt.name == n) {\n            return (prt);\n        }\n\
  \    }\n    return (null);\n}\nFindPart(GameObject go) {\n    foreach(Part prt in\
  \ parts ) {\n        if (prt.go == go) {\n            return (prt);\n        }\n\
  \    }\n    return (null);\n}\n// 如果 Part 已销毁，这些函数返回 true\nDestroyed(GameObject\
  \ go) {\n    return (Destroyed(FindPart(go)) );\n}\nDestroyed(string n) {\n    return\
  \ (Destroyed(FindPart(n)) );\n}\nDestroyed(Part prt) {\n    if (prt == null) { //\
  \ 如果没有传入真实的 Part\n        return (true); // 返回 true（意味着它已销毁）\n    }\n    // 返回比较结果：prt.health\
  \ <= 0\n    // 如果 prt.health 为 0 或少，返回 true（是的，它已销毁）\n    return (prt.health <=\
  \ 0);\n}\n// 这仅将一个部分的颜色改为红色，而不是整个飞船\nShowLocalizedDamage(Material m) {\n    m.color\
  \ = Color.red;\n    remainingDamageFrames = showDamageFrames;\n}\n```\n\n现在当你运行场景时，你应该会被许多\
  \ `Enemy_4` 所包围，每个敌人都有两个保护机身的机翼和一个保护驾驶舱的机身。如果你想增加对付它们的几率，可以将 `MainCamera` 上 `Main\
  \ (Script).enemySpawnPerSecond` 的值改为较低的值，这将给你两次 `Enemy_4` 生成之间更多的时间（尽管它也会延迟初始生成）。\n\
  \n### 添加粒子效果和背景\n\n在完成所有代码编写后，你可以做一些为了好玩的尝试，让游戏看起来更好一点。\n\n#### 星空背景\n\n创建一个双层星空背景，让事物看起来更像外太空。\n\
  \n在层级（Hierarchy）中创建一个 Quad（`GameObject > Create Other > Quad`）。将其命名为 `StarfieldBG`。\n\
  \n![Image](img/00206.jpeg)\n\n这将 `StarfieldBG` 放置在摄像机的中心并完全填充视图。现在，创建一个名为 `Mat Starfield`\
  \ 的新材质，并将其 Shader 设置为 `ProtoTools > UnlitAlpha`。将 `Mat Starfield` 的贴图设置为你在教程开始时导入的\
  \ `Space Texture2D`。将 `Mat Starfield` 拖到 `StarfieldBG` 上，你应该就能在 `Hero` 飞船后面看到星空。\n\
  \n在项目面板中选择 `Mat Starfield` 并复制（Mac 上使用 Command-D，PC 上使用 Ctrl+D）。将新材质命名为 `Mat Starfield\
  \ Transparent`。选择 `Space_Transparent` 作为此材质的贴图。\n\n在层级选择 `StarfieldBG` 并复制。将副本命名为\
  \ `StarfieldFG_0`。将 `Mat Starfield Transparent` 拖到 `StarfieldFG_0` 上，并设置它的变换。\n\n\
  ![Image](img/00207.jpeg)\n\n现在稍微移动 `StarfieldFG_0`，你会发现前景的星星相对于背景的星星在移动，产生了一种酷的视差滚动效果。现在复制\
  \ `Starfield_FG_0` 并将副本命名为 `Starfield_FG_1`。你需要两个前景副本来实现我们即将采用的滚动技巧。\n\n创建一个名为 `Parallax`\
  \ 的新 C# 脚本并在 MonoDevelop 中编辑。\n\n点击此处查看代码图片\n\n```csharp\nusing UnityEngine;\nusing\
  \ System.Collections;\n\npublic class Parallax : MonoBehaviour {\n    public GameObject\
  \ poi; // 玩家飞船\n    public GameObject[] panels; // 滚动的前景\n    public float scrollSpeed\
  \ = -30f;\n    // motionMult 控制面板如何对玩家移动做出反应\n    public float motionMult = 0.25f;\n\
  \    private float panelHt; //面板的高度\n    private float depth; // 面板的深度（即 pos.z）\n\
  \    // 用于初始化\n    void Start() {\n```\n\n\n\n\n\n```csharp\npanelHt = panels[0].transform.localScale.y;\n\
  \ndepth = panels[0].transform.position.z;\n\n// Set initial positions of panels\n\
  \npanels[0].transform.position = new Vector3(0,0,depth);\n\npanels[1].transform.position\
  \ = new Vector3(0,panelHt,depth);\n\n}\n\n// Update is called once per frame\nvoid\
  \ Update () {\n    float tY, tX=0;\n    tY = Time.time * scrollSpeed % panelHt +\
  \ (panelHt*0.5f);\n    if (poi != null) {\n        tX = -poi.transform.position.x\
  \ * motionMult;\n    }\n    // Position panels[0]\n    panels[0].transform.position\
  \ = new Vector3(tX, tY, depth);\n    // Then position panels[1] where needed to\
  \ make a continuous starfield\n    if (tY >= 0) {\n        panels[1].transform.position\
  \ = new Vector3(tX, tY-panelHt, depth);\n    } else {\n        panels[1].transform.position\
  \ = new Vector3(tX, tY+panelHt, depth);\n    }\n}\n```\n\n保存脚本，返回 Unity，并将脚本分配给\
  \ `_MainCamera`。在 Hierarchy（层级）中选择 `_MainCamera`，并在 Inspector（检器）中找到 `Parallax (Script)`\
  \ 组件。在那里，将 `poi` 设置为 `_Hero`，并向 `panels` 数组中添加 `StarfieldFG_0` 和 `StarfieldFG_1`。现在按下\
  \ Play，你应该能看到星场响应玩家的移动而移动。\n\n当然，记得保存你的场景（Scene）。\n\n### 总结\n这一章很长，但它引入了许多重要的概念，我希望这些概念对你未来的游戏项目有所帮助。在过去的多年里，我广泛使用了线性插值和贝塞尔曲线来使我的游戏和其他项目中的运动变得平滑且精致。一个简单的缓动函数（easing\
  \ function）就能让物体的移动看起来优雅、兴奋或迟缓，这在你试图平衡和调整游戏手感时，是一个非常强大的工具。\n\n在下一章中，我们将转向一种完全不同的游戏类型：纸牌牌游戏（实际上，是我最喜欢的纸牌牌游戏）。下一章将演示如何从\
  \ XML 文件读取信息，以便仅通过几个美术资源构建出整副扑牌，并演示如何使用 XML 来布局游戏本身。最后，你将拥有一个好玩的数字纸牌游戏。\n\n### 下一步建议\n\
  根据你之前在教程中的经验，你已经理解了如何完成本节列出的许多内容。如果你想继续完善这个原型，这些只是关于你可以尝试做的一些建议。\n\n#### 调整变量\n\
  正如你在纸质游戏和数字游戏中中学到的那样，数字的调优至关重要，并且对体验有显著影响。以下是你应该考虑调整的变量列表，以改变游戏感：\n\n![Image](img/00003.jpeg)\
  \ `_Hero`: 改变移动手感\n\n![Image](img/00003.jpeg) 调整 `speed`。\n\n![Image](img/00003.jpeg)\
  \ 修改 `InputManager` 中水平和垂直轴的重力和灵敏度。\n\n![Image](img/00003.jpeg) 武器：增加武器之间的差异。\n\n\
  ![Image](img/00003.jpeg) 散弹：散弹枪可以发射五个投影物而非仅三个，但具有更长的 `delayBetweenShots`。\n\n![Image](img/00003.jpeg)\
  \ 激光器：激光器的发射速度可以更快（更小的 `delayBetweenShots`），但每击造成的伤害更少（减少的 `damageOnHit`）。\n\n![Image](img/00003.jpeg)\
  \ 强化道具：调整掉落率。\n\n![Image](img/00003.jpeg) 每个 `Enemy` 类都有一个 `powerUpChance` 字段，可以设置为\
  \ 0（从不掉落强化道具）到 1（总是掉落强化道具）之间的任何数字。这些被设置为 1，但你可以根据需要进行任何调整。\n\n![Image](img/00003.jpeg)\
  \ 现在，多个 `Projectiles` 可以在 `Enemy` 血量降为 0 的同一回合击中。这将导致 `PowerUps` 的生成。尝试修改代码来阻止这种情况的发生。\n\
  \n#### 添加额外元素\n虽然这个原型已经展示了五种敌人和两种武器，但对你来说，有无限可能：\n\n![Image](img/00003.jpeg) **武器：**\
  \ 添加额外的武器\n\n![Image](img/00003.jpeg) `Phaser`：发射沿正弦波移动的两个投影物（类似于 `Enemy_1`）。\n\n\
  ![Image](img/00003.jpeg) `Laser`：`laser` 不是一次性造成所有伤害，而是持续造成时间伤害。\n\n![Image](img/00003.jpeg)\
  \ `Missiles`：`Missiles` 可以拥有锁定机制，且速度非常慢，但会追踪敌人并始终命中。也许 `missiles` 可以是另一种弹药有限的武器，使用不同的按键（即不是空格键）。\n\
  \n![Image](img/00003.jpeg) `Swivel Gun`：类似于 `blaster` 但实际上是向最近的敌人射。然而，这把枪非常弱。\n\n\
  ![Image](img/00003.jpeg) **敌人：** 添加额外的敌人。可以为这个游戏创建无数种类型的敌人。\n\n![Image](img/00003.jpeg)\
  \ 添加额外的能力\n\n![Image](img/00003.jpeg) 允许某些敌人射击。\n\n![Image](img/00003.jpeg) 某些敌人可以追踪并跟随玩家，可能像导弹追踪玩家一样。\n\
  \n![Image](img/00003.jpeg) 添加关卡进度\n\n![Image](img/00003.jpeg) 使用特定的、定时的波代替现有原型中的随机攻击。这可以使用此处定义的\
  \ `[System.Serializable] Wave` 类来实现：\n\n```csharp\n[System.Serializable]\npublic\
  \ class Wave {\n    float delayBeforeWave=1; // 上一波后的延迟秒数\n    GameObject[] ships;\
  \ // 此波中的船\n    // 在波被杀死后延迟下一波？\n    bool delayNextWaveUntilIsDead=false;\n}\n```\n\
  \n![Image](img/00003.jpeg) 添加一个 `Level` 类来包含 `Wave[]` 数组：\n\n```csharp\n[System.Serializable]\n\
  public class Level {\n    Wave[] waves; // 波的容器\n    float timeLimit=-1; // 如果为\
  \ -1，则没有时间限制\n    string name=\"\"; // 如果留空（即 \"\"），// 名称可以显示为 \"Level #1\"\n}\n\
  ```\n\n然而，即使 `Level` 是序列化的，这会导致问题，`Wave[]` 数组无法正常显示，因为 Unity Inspector 不允许嵌套序列化类。这意味着你应该尝试使用类似\
  \ XML 文档的方法定义关卡和波，然后将其读取 `Level` 和 `Wave` 类。XML 在附录 B 的“XML”部分有介绍，并在下一个原型 Prospector\
  \ Solitaire 中使用。\n\n![Image](img/00003.jpeg) 添加更多游戏结构和 GUI（图形用户界面）元素：\n\n![Image](img/00003.jpeg)\
  \ 给玩家分数和特定的生命值（这些都在第 29 章中介绍过）。\n\n![Image](img/00003.jpeg) 添加难度设置。\n\n![Image](img/00003.jpeg)\
  \ 记录高分（如在 Apple Picker 和 Mission Demolition 原型中涵盖的）。\n\n![Image](img/00003.jpeg)\
  \ 创建一个标题界面场景，欢迎玩家进入游戏并允许她选择难度设置。\n\n\n\n\n与 Prototype 3 一样，这部分是从要求你下载并导入此游戏的资源 `unitypackage`\
  \ 开始的。我们将使用的艺术资产是由 Chris Aguilar 公开的 `Vectorized Playing Cards 1.3` 的部分构成的.^(1)\n\
