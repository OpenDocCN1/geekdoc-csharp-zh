  \n## 构建设置 (Build Settings)\n\n这将第一个能够在移动设备上编译的项目。作为一个示例，我将使用 `Apple iPad` 的设置，但如果你愿意，使用\
  \ `Android`、`BlackBerry`、`Windows 8 Phone` 甚至 `Web Player` 构建完全也可以。本项目是为 `iPad`\
  \ 竖屏模式下的 4:3 比例屏幕设计的。虽然本项目设计为可以为移动设备编译，但移动设备的实际构建过程超出了本书的范围（并且根据你拥有的设备会有很大不同），但你可以在\
  \ Unity 网站上找到许多关于此的信息。iOS 开发的链接是 [`docs.unity3d.com/Documentation/Manual/iphone-GettingStarted.html`](http://docs.unity3d.com/Documentation/Manual/iphone-GettingStarted.html)。在本章末尾还有更多关于移动端编译的信息。\n\
  \n1. 双击 `Project` 窗格中的 `Prospector_Scene_0` 场景以打开它。\n2. 从菜单栏选择 `File > Build Settings`，这将弹出如图\
  \ 31.1 所示的窗口。\n\n![Image](img/00209.jpeg)\n\n**图 31.1** Build Settings 窗口\n\n3.\
  \ 点击 `Add Current` 将 `Prospector_Scene_0` 添加到构建的场景列表中。\n4. 从列表中选择 `iOS` 并点击 `Switch\
  \ Platform`。Unity 将重新导入所有图像以匹配默认的 `iOS` 设置。切换完成后，`Switch Platform` 按钮将变为灰色。一旦你的\
  \ `Build Settings` 看起来像图 31.1 中的图像，你就可以关闭此窗口。（先不要点击 Build；那将在实际制作游戏后进行。）\n\n## 将图像作为精灵\
  \ (Sprites) 导入\n\n接下来，我们需要正确地导入用作 `sprites` 的图像。`sprite` 是一种可以在屏幕上移动和旋转的 2D 图像，它们在\
  \ 2D 游戏中非常常见：\n\n1. 打开 `Project` 窗格中的 `Sprites` 文件夹并选择其中所有的图像。（点击 `Sprites` 文件夹中顶部的图像，然后\
  \ `Shift-click` 点击底部的图像。）查看 `Inspector` 窗格中的 `Preview`，你可以看到它们目前都被导入为没有透明度的正方形图像。我们将改变这一点并将它们变为可用的精灵。\n\
  2. 在 `Inspector` 窗格的 `21 Texture 2Ds Import Settings` 部分，将 `Texture Type` 设置为 `Sprite`。然后点击\
  \ `Apply`，Unity 将按照适当的比例重新导入所有图像；然而，你将在控制台中看到警告“只有正方形纹理可以压缩为 PVRTC 格式”。将 `Inspector`\
  \ 中的 `Format` 从 `Compressed` 改为 `TrueColor`。\n\n\n\n\n# 图 31.4 黑桃 10 显示了在其构造的每个\
  \ sprite 周围的自动生成边框。这张牌的可视部分由 15 个不同的 sprite 组成（12 张黑桃、2 张数字 10 和 1 张牌面正面）。\n\n这是通过使用\
  \ XML 文件来定义的。现在请阅读附录 B 中的“XML 部分”章节和“有用概念）”，以了解更多关于 XML 以及如何使用导入的 `unitypackage`\
  \ 中的 `PT_XMLReader` 来读取它。项目中使用的 `DeckXML.xml` 文件的结构也在附录 B 的该章节中。\n\n## 通过代码使用 XML\n\
  \n对于本项目的第一部分，创建三个名为 `Card`、`Deck` 和 `Prospector` 的 C# 文件。\n\n![Image](img/00003.jpeg)\
  \ `Card`：牌组中每张单独牌的类。`Card` 还将包含 `CardDefinition` 类（存储在每张牌的每个点数上定位 sprite 信息）和 `Decorator`\
  \ 类（存储 XML 文档中描述的装饰器和花点信息）。\n\n![Image](img/00003.jpeg) `Deck`：`Deck` 类解释 `DeckXML.xml`\
  \ 中的信息并使用这些信息创建整副扑牌。\n\n![Image](img/00003.jpeg) `Prospector`：`Prospector` 类管理整个游戏。当\
  \ `Deck` 处理牌的创建时，`Prospector` 将这些牌转化为游戏。`Prospector` 将牌收集到不同的堆中（如抽牌堆和弃牌堆）并管理游戏逻辑。\n\
  \n### 1. 首先创建 Card C# 脚本并在 MonoDevelop 中打开它。输入以下代码：\n\n点击此处查看代码图片\n\n```csharp\n\
