  \ test` 的类型，该值表示 `lilB` 边界位于 `bigB` 边界（或相机边界）之外的距离。\n\n将以下**粗体行**添加到 `Hero` 类中，以查看其工作原理：\n\
  \n点击此处查看代码图片\n\n```javascript\npublic class Hero : MonoBehaviour {\n    ...\n  \
