  \  // 我们可以向目标进行补间动画并缩小尺寸，但目前只需销毁这个。\n        Destroy(this.gameObject);\n    }\n\n\
  \    void CheckOffscreen() {\n        // 如果 PowerUp 漂出了屏幕...\n        if (Utils.ScreenBounds(cube.bounds,\
  \ Bounds.offScreen) != Vector3.zero) {\n            // ...那么销毁 GameObject\n    \
  \        Destroy(this.gameObject);\n        }\n    }\n}\n```\n\n当你按下 Play 时，你应该看到\
