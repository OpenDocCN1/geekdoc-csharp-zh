  #### 可序列化 WeaponDefinition 类\n\n在 `MonoDevelop` 中打开 `Weapon` 脚本并输入以下代码：\n\n点击此处查看代码图片\n\
  \n```csharp\nusing UnityEngine;\nusing System.Collections;\n\n// 这是各种可能的武器类型的枚举\n\
  // 它还包含一个“护盾”类型，以允许护盾强化\n// 下方标记为 [NI] 的项目在书中尚未实现\npublic enum WeaponType\n{\n \
  \   none,       // 默认 / 无武器\n    blaster,    // 简单的喷射器\n    spread,     // 同时发射两发\n\
  \    phaser,     // 以波浪形式移动的射击 [NI]\n    missile,    // 制导导弹 [NI]\n    laser,  \
  \    // 随时间产生的伤害 [NI]\n    shield      // 提升 shieldLevel\n}\n\n// WeaponDefinition\
  \ 类允许你在 Inspector 中设置\n// 特定武器的属性。Main 类拥有一个 WeaponDefinitions\n// 数组，使得这一切成为。\n\
  // [System.Serializable] 告诉 Unity 尝试在 Inspector\n// 中查看 WeaponDefinition。它对所有内容都有效，\n\
  但对于像这样简单的类是有效的\n[System.Serializable]\npublic class WeaponDefinition\n{\n    public\
  \ WeaponType type = WeaponType.none;\n    public string letter;      // 在强化道具上显示的字母\n\
  \    public Color color = Color.white; // Collar &强化道具的颜色\n    public GameObject\
  \ projectilePrefab; // 制体\n    public Color projectileColor = Color.white;\n   \
  \ public float damageOnHit = 0;   // 命中伤害量\n    public float continuousDamage =\
  \ 0; // 每秒伤害（激光）\n    public float delayBetweenShots = 0;\n    public float velocity\
  \ = 20;     // 弹体速度\n}\n\n// 注意：武器制体、颜色等是在 Main 类中设置的。\npublic class Weapon\n{\n\
  \    // Weapon 类将在以后填充。\n}\n```\n\n正如代码注释所示，枚举 `WeaponType` 定义了所有可能的武器类型和强化类型。`WeaponDefinition`\
  \ 是一个结合了 `WeaponType` 和其他字段的类。在 `Main` 类中添加以下代码：\n\n点击此处查看代码图片\n\n```csharp\npublic\
  \ class Main : MonoBehaviour\n{\n    ...\n    public float enemyPadding = 1.5f;\
  \ // 位置填充\n    public WeaponDefinition[] weaponDefinitions;\n    public bool ________________;\n\
  \    public WeaponType[] activeWeaponTypes;\n    public float enemySpawnRate; //\
  \ 敌人之间的延迟\n    void Awake() {...}\n    void Start() {\n        activeWeaponTypes\
  \ = new WeaponType[weaponDefinitions.Length];\n        for (int i=0; i<weaponDefinitions.Length;\
  \ i++) )\n    }\n    ...\n}\n```\n\n保存这些内容，然后选择 `Hierarchy` 中的 `_MainCamera`。你现在应该在\
  \ `Main (Script)` 组件的 Inspector 中看到一个 `weaponDefinitions` 数组。点击它旁边的展开三角形并将数组的 `Size`\
  \ 设置为 `3\\.`。如图图 30.11 所示输入三个 `WeaponDefinitions` 设置。颜色不需要完全准确，但重要的是每个颜色的 alpha\
  \ 值都必须设置为完全不透明（这显示为色块下方的白色条）。\n\n![Image](img/00197.jpeg)\n\n**图 30.11** Main 上\
  \ blaster、spread 和 shield 的 WeaponDefinitions 设置\n\n* * *\n\n警告\n\n**颜色有时默认为不可见的\
  \ Alpha 透明度** 当你创建一个像 `WeaponDefinition` 这样包含颜色字段的可序列化类时，这些颜色的 alpha 值将默认为 0（即不可见）。要修复此问题，请确保每个颜色定义下方的白色条确实是白色（而不是黑色）。如果你点击颜色本身，你将看到四个可以设置的值（R、G、B\
  \ 和 A）。确保将 A 设置为 255（即完全不透明），否则你的射击将是不可见的。\n\n如果你使用的是 OS X 并选择在 Unity 中使用 OS X 颜色选择器而非默认选择器，则\
  \ A 值由颜色选择器底部的不透明度滑块设置（对于对于这些颜色，它应该设置为 100%）。\n\n* * *\n\n#### 用于 WeaponDefinitions\
  \ 的泛型字典\n\n\n\n\n\n现在，在 MonoDevelop 中打开 `Main` 脚本并输入以下代码。这段代码使用了 `Dictionary`，它是另一种类似于\
  \ `List` 的泛型集合。Dictionary 具有 `key`（键）类型和 `value`（值）类型，并使用键来检索值。在这里，Dictionary 使用枚举\
  \ `WeaponType` 作为键，使用类 `WeaponDefinition` 作为值。我们将创建一个静态字典 `W_DEFS`，用来存储我们刚刚在 `Main`\
  \ 检查器（Inspector）的数组中输入的 `WeaponDefinition` 信息。遗憾的是，Dictionary 不会显示在检查器中，否则我们从一开始就会使用它了。相反，`W_DEFS`\
  \ 在 `Main` 的 `Awake()` 方法中定义，然后被静态函数 `Main.GetWeaponDefinition()` 调用。\n\n```csharp\n\
  public class Main : MonoBehaviour {\n    static public Main S;\n    static public\
  \ Dictionary<WeaponType, WeaponDefinition> W_DEFS;\n\n    void Awake() {\n     \
  \   ...\n        Invoke(\"Spawn\", enemyRate);\n        // 一个以 WeaponType 为键的泛型\
  \ Dictionary\n        W_DEFS = new Dictionary<WeaponType, WeaponDefinition>();\n\
  \        foreach(WeaponDefinition def in weaponDefinitions) {\n            W_DEFS[def.type]\
  \ = def;\n        }\n    }\n\n    static public WeaponDefinition GetWeaponDefinition(WeaponType\
  \ wt) {\n        // 检查键是否存在于 Dictionary 中\n        // 尝试检索一个不存在的键会抛出错误，\n      \
  \  // 所以下面的 if 语句是重要的\n        if (W_DEFS.ContainsKey(wt)) {\n            return(W_DEFS[wt]);\n\
  \        }\n        // 这将返回 WeaponType.none 的定义，\n        // 意味着没有找到 WeaponDefinition\n\
  \        return(new WeaponDefinition());\n    }\n    void Start(){}\n}\n```\n\n\
  现在，在 MonoDevelop 中打开 `Projectile` 类并输入此代码：\n\n```csharp\nusing UnityEngine;\nusing\
  \ System.Collections;\n\npublic class Projectile : MonoBehaviour {\n    [SerializeField]\n\
  \    private WeaponType _type;\n    // 这个公共属性掩盖了字段 _type 并在被设置时执行操作\n    public\
  \ WeaponType type {\n        get {\n            return(_type);\n        }\n    \
  \    set {\n            SetType(value);\n        }\n    }\n    void Awake() {\n\
  \        // 测试是否每隔 2 秒就会飞出屏幕\n        InvokeRepeating(\"CheckOffscreen\", 2f, 2f);\n\
  \    }\n    public void SetType(WeaponType eType) {\n        // 设置 _type\n     \
  \   _type = eType;\n        WeaponDefinition def = Main.GetWeaponDefinition(_type);\n\
  \        renderer.material.color = def.color;\n    }\n    void CheckOffscreen()\
  \ {\n        if (Utils.ScreenBounds(collider.bounds, Bounds.offScreen) != Vector3.zero)\
  \ {\n            Destroy(this.gameObject);\n        }\n    }\n}\n```\n\n每当 `Projectile`\
  \ 的 `type` 属性被设置时，就会调用 `SetType()`，并且 `Projectile` 将根据 `Main` 中的 `WeaponDefinitions`\
  \ 自动设置自己的颜色。\n\n### 使用函数委托进行射\n\n在继续之前，请阅读附录 B 中的“函数委托（Function Delegates）”部分。在这个游戏中，`Hero`\
  \ 类将有一个函数委托 `fireDelegate`，它被调用来发射所有武器，每个挂载在其上面的武器都会将其个人的 `Fire()` 方法添加到 `fireDelegate`\
  \ 中。\n\n为 `Hero` 类添加以下代码：\n\n```csharp\npublic class Hero : MonoBehaviour {\n  \
  \  ...\n    public Bounds bounds;\n    // 声明一个新委托类型 WeaponFireDelegate\n    public\
  \ delegate void WeaponFireDelegate();\n    // 创建一个名为 fireDelegate 的 WeaponFire 字段\n\
  \    public WeaponFireDelegate fireDelegate;\n    void Awake() {\n        ...\n\
  \    }\n    void Update() {\n        ...\n        // 旋转飞船使其具有动态感\n        transform.rotation\
  \ = Quaternion.Euler(yAxis*pitchMult, xAxis*rollMult,0);\n        // 使用 fireDelegate\
  \ 发射武器\n        // 首先，确保 Axis(\"Jump\") 按钮被按下\n        // 然后确保 fireDelegate 不空以避免错误\n\
  \        if (Input.GetAxis(\"Jump\") == 1 && fireDelegate != null) {\n         \
  \   fireDelegate();\n        }\n    }\n    ...\n}\n```\n\n如果 `fireDelegate` 在没有分配任何方法时被调用，它将抛出错误。为了避免这种情况，在调用之前会测试\
  \ `fireDelegate != null` 以检查它是否为空。\n\n在 MonoDevelop 中打开 `Weapon` C# 脚本并添加以下代码：\n\
  \n```csharp\npublic class Weapon : MonoBehaviour {\n    static public Transform\
  \ PROJECTILE_ANCHOR;\n    public bool ____________________;\n    [SerializeField]\n\
  \    private WeaponType _type = WeaponType.none;\n    public WeaponDefinition def;\n\
  \    public GameObject collar;\n    public float lastShot; // 上一次发射的时间\n    void\
  \ Start() {\n        collar = transform.Find(\"Collar\").gameObject;\n        //\
  \ 为默认 _type 正确调用 SetType()\n        SetType(_type);\n        if (PROJECTILE_ANCHOR\
  \ == null) {\n            GameObject go = new GameObject(\"Projectile_Anchor\");\n\
  \            PROJECTILE_ANCHOR = go.transform;\n        }\n        // 找到父节点的 fireDelegate\n\
  \        GameObject parentGO = transform.parent.gameObject;\n        if (parentGO.tag\
  \ == \"Hero\") {\n            Hero.S.fireDelegate += Fire;\n        }\n    }\n \
  \   public WeaponType type {\n        get { return(_type); }\n        set { SetType(value);\
  \ }\n    }\n    public void SetType(WeaponType wt) {\n        _type = wt;\n    \
  \    if (type == WeaponType.none) {\n            this.gameObject.SetActive(false);\n\
  \            return;\n        } else {\n            this.gameObject.SetActive(true);\n\
  \        }\n        def = Main.GetWeaponDefinition(_type);\n        collar.material.color\
  \ = def.color;\n        lastShot = 0; // 在 type 设置后可以立即发射\n    }\n    public void\
  \ Fire() {\n        // 如果 this.gameObject 未激活，则返回\n        if (!gameObject.activeHierarchy)\
  \ return;\n        // 如果两次射之间的时间不够，返回\n        if (Time.time - lastShot < def.delayBetweenShots)\
  \ {\n            return;\n        }\n        Projectile p;\n        switch (type)\
  \ {\n            case WeaponType.blaster:\n                p = MakeProjectile();\n\
