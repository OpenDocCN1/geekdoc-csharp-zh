  \ { // 有一个回调 GameObject\n                // ...然后使用 SendMessage 调用 CBCallback 方法\n\
  \                // 并将此作为参数。\n                reportFinishTo.SendMessage(\"CBCallback\"\
  , this);\n                // 调用 SendMessage() 后，必须将 reportFinishTo 设置\n        \
  \        // 为 null，这样卡片后续每次移动就不会\n                // 继续向同一个 GameObject \n      \
  \          reportFinishTo = null;\n            } else { // 如果没有回调\n            \
