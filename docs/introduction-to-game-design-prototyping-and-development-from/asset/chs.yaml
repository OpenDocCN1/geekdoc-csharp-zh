  \n#### 游戏布局\n\nBartok 的布局与 Prospector 有很大不同。在 Bartok 中，屏幕中间会有一个牌堆和一个弃牌堆，以及分布在屏幕顶部、左侧、底部和右侧的四手牌。牌应该扇形散开，就像在玩家手里一样（参见图\
  \ 32.3）。\n\n这将需要一个与 Prospector 使用的不同的布局 XML 文档。选择 Resources 文件夹中的 `LayoutXML` 并将其复制（*Edit\
  \ > Duplicate*）。将副本重命名为 *BartokLayoutXML* 并输入以下文本。（粗体文本与原始的 LayoutXML 文本不同。）\n\n\
  点击此处查看代码图像\n\n```xml\n<xml>\n  <!-- 此文件包含用于 Bartok 牌游戏布局的信息 -->\n  <!-- 乘数将乘以下方的\
  \ x 和 y 属性 -->\n</xml>\n```\n\n\n\n\n\n```xml\n<!-- 这决定了布局的紧凑程度。 -->\n<multiplier\
  \ x=\"1\" y=\"1\" />\n<!-- 确定抽牌堆的位置并进行交错排列 -->\n<slot type=\"drawpile\" x=\"1.5\"\
  \ y=\"0\" xstagger=\"0.05\" layer=\"1\"/>\n<!-- 确定弃牌堆的位置 -->\n<slot type=\"discardpile\"\
  \ x=\"-1.5\" y=\"0\" layer=\"2\"/>\n<!-- 确定目标牌的位置 -->\n<slot type=\"target\" x=\"\
  -1.5\" y=\"0\" layer=\"4\"/>\n<!-- 这些插槽用于四名玩家手持的四个牌 -->\n<slot type=\"hand\" x=\"\
  0\" y=\"-8\" rot=\"0\" player=\"1\" layer=\"3\"/>\n<slot type=\"hand\" x=\"-10\"\
  \ y=\"0\" rot=\"270\" player=\"2\" layer=\"3\"/>\n<slot type=\"hand\" x=\"0\" y=\"\
  8\" rot=\"180\" player=\"3\" layer=\"3\"/>\n<slot type=\"hand\" x=\"10\" y=\"0\"\
  \ rot=\"90\" player=\"4\" layer=\"3\"/>\n```\n\n现在，负责布局的类也必须重写，以便能够正确散开卡牌，并利用新的卡牌插值能力。创建一个名为\
  \ `BartokLayout` 的新 C# 脚本并输入以下代码：\n\n点击此处查看代码图像\n\n```csharp\nusing UnityEngine;\n\
  using System.Collections;\nusing System.Collections.Generic;\n\n// SlotDef 类没有基于\
  \ MonoBehaviour，因此它不需要独立的文件。\n[System.Serializable] // 使 SlotDef 能够在 Unity 器中可见\n\
  public class SlotDef {\n    public float x;\n    public float y;\n    public bool\
  \ faceUp=false;\n    public string layerName=\"Default\";\n    public int layerID\
  \ = 0;\n    public int id;\n    public List<int> hiddenBy = new List<int>(); //\
  \ 在 Bartok 中未使用\n    public float rot; // 手牌的旋转\n    public string type=\"slot\"\
  ;\n    public Vector2 stagger;\n    public int player; // 手牌的玩家编号\n    public Vector3\
  \ pos; // 从 x, y 和 multiplier 派生出的 pos\n}\n\npublic class BartokLayout : MonoBehaviour\
  \ {\n    ...\n}\n```\n\n保存此代码并返回 Unity。你会注意到控制台中出现了一个一个错误：\n\n“error CS0101: 空间\
  \ ’global::’ 已经包含针对 ’SlotDef’ 的定义。”\n\n这是因为 Layout 脚本中的公共类 `SlotDef`（来自 Prospector）与新\
  \ `BartokLayout` 脚本中的公共类 `SlotDef` 冲突。你可以完全删除 Layout 脚本，也可以在 MonoDevelop 中打开 Layout\
  \ 脚本并注释掉定义 `SlotDef` 的部分。要注释掉一大块代码，只需在代码前放置 `/*` 并在要注释的代码后放置 `*/`。你也可以通过在 MonoDevelop\
  \ 中选择代码行并从菜单中选择 `Edit > Format > Toggle Comments` 来注释掉大部分区域，这会在你选择的每行代码前添加单行注释 `//`。在你从\
  \ Layout 脚本中消除了 `SlotDef` 类后，返回 `BartokLayout` 脚本并通过添加以下行继续编辑：\n\n点击此处查看代码图像\n\n\
  ```csharp\npublic class BartokLayout : MonoBehaviour {\n    public PT_XMLReader\
  \ r; // 就像 Deck 一样，它有一个 PT_XMLReader\n    public PT_HashTable xml; // 用于快速访问 xml\
  \ 的变量\n    public Vector2 multiplier; // 设置牌牌区域的间距\n    public List<SlotDef> slotDefs;\
  \ // 手牌\n    public SlotDef drawPile;\n    public SlotDef discardPile;\n    public\
  \ SlotDef target; // 调用此函数用于读取 Layout.xml 文件\n    public void ReadLayout(string\
  \ xmlText) {\n        r = new PT_XMLReader();\n        r.Parse(xmlText); // 解析 XML\n\
  \        xml = r.xml[\"xml\"][0]; // 将 xml 设置为 XML 的快捷方式\n        // 读取倍器，用于设置卡牌间距\n\
  \        multiplier.x = float.Parse(xml[\"multiplier\"][0].att(\"x\"));\n      \
  \  multiplier.y = float.Parse(xml[\"multiplier\"][0].att(\"y\"));\n        // 读取插槽\n\
  \        SlotDef tSD; // slotsX 被用作所有 <slot> 的快捷方式\n        PT_XMLHashList slotsX\
  \ = xml[\"slot\"];\n        for (int i=0; i<slotsX.Count; i++) {\n            tSD\
  \ = new SlotDef(); // 创建一个新的 SlotDef 实例\n            if (slotsX[i].HasAtt(\"type\"\
  )) {\n                // 如果此 <slot> 有 type 属性，则解析它\n                tSD.type = slotsX[i].att(\"\
  type\");\n            } else {\n                // 如果没有，将其类型设为 \"slot\"\n      \
  \          tSD.type = \"slot\";\n            }\n            // 将各种属性解析为数值值\n   \
  \         tSD.x = float.Parse(slotsX[i].att(\"x\"));\n            tSD.y = float.Parse(slotsX[i].att(\"\
  y\"));\n            tSD.pos = new Vector3(tSD.x*multiplier.x, tSD.y*multiplier.y,\
  \ 0);\n            // 排序层\n            tSD.layerID = int.Parse(slotsX[i].att(\"\
  layer\")); // 排序层用于确保正确的卡牌在其他卡牌之上。\n            // 在 Unity 2D 中，所有的资源处于相同的 Z 深度，因此排序层用于区分它们。\n\
  \            // 根据 <slot> 的类型提取属性\n            tSD.layerName = tSD.layerID.ToString();\
  \ // 将层级 ID 转换为文本\n            switch (tSD.type) {\n                case \"slot\"\
  :\n                    // 忽略 \"slot\" 类型的插槽\n                    break;\n      \
  \          case \"drawpile\":\n                    // 抽牌堆交错但在 Bartok 中实际未使用\n  \
  \                  tSD.stagger.x = float.Parse(slotsX[i].att(\"xstagger\"));\n \
  \                   drawPile = tSD;\n                    break;\n              \
  \  case \"discardpile\":\n                    // 弃牌堆具有不同的层级\n                  \
  \  discardPile = tSD;\n                    break;\n                case \"target\"\
  :\n                    // 目标牌与弃牌堆不同层\n                    target = tSD;\n      \
  \              break;\n                case \"hand\":\n                    // 每个玩家手牌的信息\n\
  \                    tSD.player = int.Parse(slotsX[i].att(\"player\"));\n      \
  \              tSD.rot = float.Parse(slotsX[i].att(\"rot\"));\n                \
  \    slotDefs.Add(tSD);\n                    break;\n            }\n        }\n\
  \    }\n}\n```\n\n要使用此代码，你需要将 `Bartok` 脚本附加到 MainCamera。（从 Project 面板将 Bartok 脚本拖入\
  \ Hierarchy。）你还需要将 BartokXML 分配给 MainCamera 组件的 `layout` 字段。现在，在 Bartok 脚本中添加以下代码以使用\
  \ `BartokLayout`：\n\n点击此处查看代码图像\n\n```csharp\npublic class Bartok : MonoBehaviour\
