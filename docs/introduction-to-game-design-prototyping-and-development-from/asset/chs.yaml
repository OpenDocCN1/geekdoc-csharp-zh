  \n现在游戏将能够正常运行，它会在结束时停止，并能正确地重启。\n\n### 总结\n本章的目标是演示如何将你在书中制作的数字原型并将它们适配到你自己的游戏中。一旦你完成了所有教程，你将拥有这些游戏的框架：一个经典街机游戏（`Apple\
  \ Picker`）、基于物理的休闲游戏（`Mission Demolition`）、太空射击游戏（`Space UP`）、纸牌游戏（`Prospector and\
  \ Bartok`）、单词游戏（`Word Game`）、一个第一人称射击游戏（`Quick Snap`）以及第三人称冒险游戏（`Omega Mage`）。作为原型，它们一个都不是完成的游戏，但其中任何一个都可以作为构建你自己的游戏的基础。\n\
  \n### 下一步工作\n`Bartok`纸牌游戏的经典版本包含任何回合获胜者都可以为游戏添加额外规则的功能。虽然这目前是不可能的，但你可以利用这些基础来构建自己的游戏。在`Bartok`示例中，你已经学习了如何处理\
  \ `GUIText` 和简单的游戏状态逻辑。在接下来的章节中，我们将探索更复杂的游戏机制。\n\n\n\n\n\n这种游戏是一种经典的文字游戏形式。这种游戏的商业示例包括\
  \ [Pogo.com] 的 *Word Whomp*、Branium 的 *Jumbline 2*、Words and Maps 的 *Pressed for\
  \ Words* 等。玩家将看到六个字母，这些字母至少可以拼成一个六字母单词，玩家的任务是找到所有能用这六个字母所创建的单词。我们版本的这个游戏将包含一些流畅的动画（使用贝塞尔插值）以及一种评分机制，鼓励玩家先寻找长单词，后寻找短单词。图\
  \ 33.1 显示了你将在本章中创建的游戏图像。如图像所示，这个游戏可以处理长达 8 个字母的单词，尽管这类游戏的标准通常是 6 个字母。\n\n![Image](img/00235.jpeg)\n\
  \n**图 33.1** 本章创建的文字游戏图像\n\n在图像中，你可以看到每个单词都被拆分成了单个字母，并且有两种大小的字母。为了面向对象的设计，我们将创建一个\
  \ `Letter` 类来处理每个字母，并创建一个 `Word` 类将它们收集成单词。我们还将创建一个 `WordList` 类来读取我们拥有的候选单词大字典，并将其转换为游戏可用的数据。游戏将由一个\
  \ `WordGame` 类控制，并使用之前原型中的 `Scoreboard` 和 `FloatingScore` 类来向玩家显示分数。此外，`Utils` 类将用于插值和缓动。`PT_XMLReader`\
  \ 类已导入此项目，但未被使用。我将此脚本留在 unitypackage 中，是因为我想鼓励你开始构建自己的实用脚本集合，你可以将其导入到任何项目中来帮助你快速上手（就像\
  \ ProtoTools 文件夹对于书中的项目的作用一样）。随时将你创建的任何有用脚本添加到此集合中，并考虑在开始每个新游戏原型时，执行的第一件事就是导入它。\n\
  \n## 解析单词列表\n\n该游戏使用了由 Alan Beale 创建的 2of12inf 单词列表的修改版本.^(1)。我删除了一些单词并尝试修正了其他。只要你遵循\
  \ Alan Beale 和 Kevin Atkinson 的版权声明（脚注所示），你未来可以随心地使用此单词列表。我还通过将所有字母转换为大写并将行结束符从\
  \ `\\r\\n`（回车加换行，Windows 标准文本格式）改为 `\\n`（换行符，Mac 标准文本格式）修改了列表。这样做是为了根据换行符将文件拆分成单个单词，并且在\
  \ Windows 和 Mac 上都能运行。(1) Alan Beale 将他的 2of12inf 列表发布到了公有领域，Copyright 2000 Kevin\
  \ Atkinson。特此授予使用、复制、修改和分发此数据库相关脚本的许可，只要上述版权声明出现在所有副本中以及支持文档中。Kevin Atkinson 对此数组的任何用途的适用性不作任何表示。它是“按现状”提供的，不提供明示或隐含的保证。\n\
  \n删除单词的决定取决于游戏的类型。在 *Scrabble* 或 *Letterpress* 等游戏中，玩家获得一组字母牌，并能够用这些字母牌拼出想要的单词。如果是那种游戏，我将不会移除列表中的任何单词。在本游戏中，玩家被强制拼出列表中的每一个单词。然而，在列表的\
  \ 75,000 个单词中，可能遗漏了一些单词，所以如果你发现我漏掉了（或应该添加的）任何单词，请通过 [`book.prototools.net`](http://book.prototools.net)\
  \ 通知我。\n\n为了读取单词列表，我们需要将其文本提取到字符串数组并按 `\\n` 进行拆分。以下代码列出了书中第一个协程（coroutine）的实例。协程是在执行过程中通过\
  \ `yield` 允许其他函数运行的函数。你可以在附录 B 中了解更多关于有用概念。创建一个名为 *WordList* 的新 C# 脚本并输入以下代码：\n\n\
  点击此处查看代码\n\n```csharp\nusing UnityEngine;\n\nusing System.Collections;\n\nusing\
  \ System.Collections.Generic;\n\npublic class WordList : MonoBehaviour {\n    public\
  \ static WordList S;\n    public TextAsset wordList;\n    public int numParseBeforeYield\
  \ = 1000;\n    public int wordMin = 3;\n    public int wordMax = 7;\n    public\
  \ bool ________________;\n    public int curr = 0;\n    public int totalLines;\n\
  \    public int longCount;\n    public int wordCount;\n    // 下面的一些变量是私有的，以防止它们出现在\
  \ Inspector 中。\n    // 因为如果这些变量是，Inspector 尝试显示它们会导致性能大幅下降。\n    // 私有变量受到限制，只有\
  \ WordList 类的这个实例可以看到它们。\n    private string[] lines;\n    private List<string>\
  \ longWords;\n    private List<string> words;\n\n    void Awake() {\n        S =\
  \ this; // 设置单例\n    }\n\n    void Start () {\n        // 按换行符拆分 wordList 的文本，创建一个填充了列表中所有单词的大型\
  \ string[]\n        lines = wordList.text.Split('\\n');\n        totalLines = lines.Length;\n\
  \        // 这启动协程 ParseLines()。协程可以在中间\n        // 暂停允许其他代码执行。\n        StartCoroutine(ParseLines());\
  \ // 2\n    }\n\n    // 所有协程的返回类型都是 IEnumerator。\n    public IEnumerator ParseLines()\
  \ { // 3\n        string word;\n        // 初始化存储最长单词和所有有效单词的列表\n        longWords\
  \ = new List<string>();\n        words = new List<string>();\n        for (currLine\
  \ = 0; currLine < totalLines; currLine++) {\n            word = lines[currLine];\n\
  \            // 如果单词长度等于 wordMax\n            if (word.Length == wordMax) {\n  \
  \              // ...将其存储在 longWords 中\n                longWords.Add(word);\n \
  \           }\n            // 如果长度在 wordMin 和 wordMax 之间\n            if (word.Length>=wordMin\
  \ && word.Length<=wordMax ) {\n                // ...则将其添加到所有有效单词列表中\n         \
  \       words.Add(word);\n            }\n            // 确定协程是否应该 yield\n       \
  \     // 这使用模运算 (%) 函数每 10,000 条记录 yield 一次\n            // （或者你设置的 numParseBeforeYield\
  \ 的值）\n            if (currLine % numParseBeforeYield == 0) {\n                yield\
  \ return null;\n            }\n        }\n    }\n}\n```\n\n\n\n\n\n```cs\n// Count\
  \ the words in each list to show that the parsing is\n// progressing\nlongWordCount\
  \ = longWords.Count;\nwordCount = words.Count;\n// This yields execution until the\
  \ next frame\nyield return null; // 4\n// The yield will cause the execution of\
  \ this method to wait\n// here while other code executes and then continue from\
  \ this\n// point.\n}\n\n// These methods allow other classes to access the private\
  \ List<string>s\npublic List<string> GetWords() {\n    return(words);\n}\n\npublic\
  \ string GetWord(int ndx) {\n    return(words[ndx]);\n}\n\npublic List<string> GetLongWords()\
  \ {\n    return(longWords);\n}\n\npublic string GetLongWord(int ndx) {\n    return(longWords[ndx]);\n\
  }\n```\n\n**1.** 另一种在不将变量设为私有情况下情况下从 Inspector 中隐藏变量的方法是使用 `[System.NonSerialized]`\
  \ 属性。该属性向 Unity 发送指令，说明如何处理代码中的下一行内容。如果你将一个变量设为公共，并在其之前的行放置 `[System.NonSerialized]`，那么该公共变量就不会出现在\
  \ Inspector 中。这段代码中使用私有变量是为了展示如何使用像 `GetWord()` 这样的方法来访问它们，但如果你实际上只需要从 Inspector\
  \ 中隐藏变量，`[System.NonSerialized]` 可能是更好的选择。\n\n**2.** 这启动了协程 `ParseLines()`。协程可以在中间进行\
  \ `yield`（产出），允许其他代码执行。当协程执行 `yield` 时，它会将执行权交还给其他代码，并在经过一段时间后继续执行协程。因此，如果协程在无限\
  \ `while` 循环的中间有一个 `yield`，即使循环永不退出，其他代码仍然可以执行。\n\n**3.** 所有的协程都以 `IEnumerator`\
  \ 作为其返回类型。这使得它们能够产出执行，并允许其他方法在返回协程之前运行。这对于加载大文件或解析大量数据（正如我们在这种情况中所做的那样）等过程至关重要。\n\
  \n**4.** 这是 `yield` 语句。当协程执行 `yield` 时，它实际上会暂停在 `yield` 行，直到经过了一段时间后才从那里继续执行。这段代码中协程和\
  \ `yield` 语句是必要的，因为 `for` 循环将迭代超过 75,000 次来解释 WordList 的 75,000 多行。在较慢的电脑上，这可能会让程序看起来卡死，因此协程允许我们在执行耗时过程中保持\
  \ Unity 的更新和交互性。\n\n在这段代码中，我们希望协程尽可能短地产出（单帧），因此 `yield` 语句返回 `null`。通过输入类似 `yield\
  \ return new WaitForSeconds(5);` 的代码，可以让协程产出特定的时长。\n\n\n\n\n现在，沿着蓝色图表点击并拖动鼠标，你应该看到一条白线跟随鼠标。这根白线代表图表中的单帧。随着你的移动，分析器（Profiler）下半部分的文本将更新，显示在该帧期间每个函数或后台进程消耗了多少处理时间。我们感兴趣的函数是\
  \ `WordList.ParseLines()` 协程。它只在前几帧中运行，因此你不会在图表的右侧看到它；但是，你应该能在图表的开头看到脚本活动的峰值（如图\
  \ 33.2 所示），这就是 `ParseLines()` 协程消耗的时间。将白线移动到图表的该部分，并在概述（Overview）列中点击 `WordList.ParseLines()`。这将突出显示该例程的图表贡献，并将其他变暗。如果你使用\
  \ Profiler 面板右上角的左右箭头，可以（分别）向后或向前步进一帧，并查看每帧中 `ParseLines()` 使用的 CPU 资源。在我的分析中，我发现对于前几帧，`ParseLines()`\
  \ 占据了每帧消耗的 CPU 时间的近 50%（尽管由于计算机类型和处理速度，你的数据可能会不同）。\n\n除了脚本分析外，分析器还可以帮助你找到游戏中渲染或物理模拟的哪些方面花费了大部分时间。如果你在某个游戏中遇到帧率问题，请尝试检查分析器查看发生了什么。（当你[这样做]时，要确保重新开启所有其他类型的\
  \ CPU 分析[即，重新勾选我们为了隔离脚本而取消勾的所有复选框]）。\n\n要查看非常不同的分析器图表，你可以尝试在第 18 章中的 Hello World\
  \ 项目“Hello World: 你的第一个程序””上运行分析器。你会发现，在 Hello World 中，花费在物理上的时间远多于脚本。（你可能需要再次关闭图表的\
  \ VSync 元素以便清楚地看到这一点。）\n\n你可以在 Unity 文档中了解更多关于分析器的信息。\n\n***\n\n### 设置游戏\n\n我们将创建一个\
  \ `WordGame` 类来管理游戏，但在此之前，我们需要对 `WordList` 进行几处更改。首先，我们需要让它不要在 `Start()` 中开始解析单词，而是等待直到另一个类调用\
  \ `Init()` 方法。其次，我们需要让 `WordList` 在解析完成后通知即将出现的 `WordGame` 脚本。为了做到这一点，我们将让 `WordList`\
  \ 使用 `SendMessage()` 命令向 `MainCamera` 对象发送一条消息。正如你很快将看到的，这条消息将由 `WordGame` 解析。将\
  \ `WordList` 中的 `void Start()` 方法重命名为 `public void Init()`，并在 `WordList` 的 `ParseLines`\
  \ 方法末尾添加以下粗体代码：\n\n点击此处查看代码图像\n\n```csharp\npublic class WordList : MonoBehaviour\
  \ {\n\n    ...\n\n    void Awake() {\n        S = this;  // 设置单例\n    }\n\n    public\
  \ void Init() {  // 这一行替换了 \"void Start()\"\n        // 按换行符分割 wordListText 的文本，创建一个大的、\n\
  \        // 填充了列表所有单词的 string[] \n        lines = wordListText.text.Split('\\n');\n\
  \        totalLines = lines.Length;\n        // 这启动了 ParseLines 的协程。协程可以在\n    \
  \    // 中间暂停允许其他代码执行。\n        StartCoroutine( ParseLines() );\n    }\n\n    ...\n\
  \n    public IEnumerator ParseLines() {\n        ...\n        for (currLine = 0;\
  \ currLine < totalLines; currLine++) {\n            ...\n        }\n        // 向此对象发送消息让它知道解析已完成\n\
  \        gameObject.SendMessage(\"WordListParseComplete\");\n    }\n}\n```\n\n`SendMessage()`\
  \ 命令在对象 `MainCamera` 上执行（因为 `WordList` 是 `MainCamera` 的一个脚本组件）。此命令将调用任何挂载在（即，`MainCamera`）上的脚本上的\
  \ `WordListParseComplete()` 方法。\n\n现在，创建一个 `WordGame` C# 脚本并将其作为脚本组件挂载到 `MainCamera`\
  \ 上。然后输入以下代码以利用对 `WordList` 所所的更改：点击此处查看代码图像\n\n```csharp\nusing UnityEngine;\n\
  using System.Collections;\nusing System.Collections.Generic; // 我们将使用 List<> & Dictionary<>\n\
  using System.Linq; // 我们将使用 LINQ\npublic enum GameMode {\n    preGame, // 游戏开始前\n\
  \    loading, // 单词列表正在加载并解析\n    makeLevel, // 个体 WordLevel 被创建\n    levelPrep,\
  \ // 关卡视觉效果被实例化\n    inLevel // 关卡进行中\n}\npublic class WordGame : MonoBehaviour\
  \ {\n    static WordGame S; // 单例\n    public bool ____________;\n    public GameMode\
  \ mode = GameMode.preGame;\n    void Awake() {\n        S = this; // 分配单例\n    }\n\
  \    void Start () {\n        mode = GameMode.loading; // 告诉 WordList 开始解析\n   \
  \     WordList.S.Init();\n    }\n    // 由 SendMessage 命令调用\n    public void WordListParseComplete()\
  \ {\n        mode = GameMode.makeLevel;\n    }\n}\n```\n\n选择层级面板中的 `MainCamera`，查看面板中的\
  \ `WordGame (Script)` 组件。当你按下播放时，`mode` 字段将从 `preGame` 变为 `loading`。然后，当所有单词解析完成后，它将变为\
  \ `makeLevel`。这显示一切运行正常。现在，是时候从 `WordList` 中的单词创建一个关卡了。`WordLevel` 类将包含以下：\n\n![Image](img/00003.jpg)\
  \ 基于该单词的长单词。\n\n![Image](img/00003.jpg) 单词在 `longWords` 中的索引。在本章中，每次游戏开始时我们都会选择一个随机单词![Image](img/00003.jpg)\
  \ 关卡编号 `levelNum`。之后可以使用伪随机函数来确保第八个关卡总是同一个单词。\n\n![Image](img/00003.jpg) 单词中每个字符及其使用次数的字典。Dictionary\
  \ 与 List 一属于 `System.Generic`。上述字典中的字符可以形成其他单词的 `List<>`。\n\n`Dictionary<,>` 是一个包含一系列键值对的通用集合。在每个关卡中，`Dictionary<,>`\
  \ 将使用 `char` 键和 `int` 值来存储每个 `char` 在长单词中使用的次数。例如，长单词 MISSISSPIPI 的字典如下：\n\n点击此处查看代码图像\n\
  \n```csharp\nDictionary<char,int> charDict = new Dictionary<char,int>();\ncharDict.Add('M',1);\
  \ // MISSISSIPPI 有 1 个 M\ncharDict.Add('I',4); // MISSISSIPPI 有 4 个 I\ncharDict.Add('S',4);\
  \ // MISSISSIPPI 有 4 个 S\ncharDict.Add('P',2); // MISSISSIPPI 有 2 个 P\n```\n\n`WordLevel`\
  \ 还包含两个非常有静态方法：\n\n![Image](img/00003.jpg) `MakeCharDict()`：从任何字符串创建一个类似于上述代码中的\
  \ `charDict`\n\n![Image](img/00003.jpg) `CheckWordInLevel()`：检查单词是否可以使用 `WordLevel`\
  \ 的 `charDict` 中的字符拼写。\n\n创建一个名为 *WordLevel* 的新 C# 脚本并输入以下代码。注意 `WordLevel` 没有继承自\
  \ `MonoBehaviour`，因此它不是可以作为脚本组件挂载到 GameObject 上的类，不能在其内部调用 `StartCoroutine()`。\n\
  \n```csharp\nusing UnityEngine;\n```\n\n\n\n\n```csharp\nusing System.Collections;\n\
  using System.Collections.Generic;\n\n[System.Serializable] // WordLevels 可以在 Inspector\
  \ 中查看\npublic class WordLevel { // WordLevel 并没有继承 MonoBehaviour\n\n    public int\
  \ levelNum;\n    public int longWordIndex;\n    public string word;\n\n    // 包含\
  \ word 中所有字母的字典\n    public Dictionary<char,int> charDict;\n\n    // 可以用 charDict\
  \ 中的字母拼写的所有单词\n    public List<string> subWords;\n\n    // 静态函数，用于统计字符串中字符出现的次数，\n\
  \    // 并返回一个包含这些信息的 Dictionary<char,int>\n    static public Dictionary<char,int>\
  \ MakeCharDict(string w) {\n        Dictionary<char,int> dict = new Dictionary<char,\
  \ int>();\n        char c;\n        for (int i = 0; i < w.Length; i++) {\n     \
  \       c = w[i];\n            if (dict.ContainsKey(c)) {\n                dict[c]++;\n\
  \            } else {\n                dict.Add(c, 1);\n            }\n        }\n\
  \        return(dict);\n    }\n\n    // 此静态方法检查单词是否可以使用 level.charDict\n    // 中的字符进行拼写\n\
  \    public static bool CheckWordInLevel(string str, WordLevel level) {\n      \
  \  Dictionary<char,int> counts = new Dictionary<char, int>();\n        for (int\
  \ i = 0; i < str.Length; i++) {\n            char c = str[i];\n            // 如果\
  \ charDict 包含字符 c\n            if (level.charDict.ContainsKey(c)) {\n          \
  \      // 如果 counts 尚未包含字符 c 作为键\n                if (!counts.ContainsKey(c)) {\n\
  \                    // ...则添加一个值为 1 的新键\n                    counts.Add(c, 1);\n\
  \                } else {\n                    // 否则，在当前值上加 1\n                \
  \    counts[c]++;\n                }\n                // 如果这意味着 str 中字符 c 的次数\n\
  \                // 比 level.charDict 中提供的多\n                if (counts[c] > level.charDict[c])\
  \ {\n                    // ... 返回 false\n                    return(false);\n \
  \               }\n            } else {\n                // c 不在 level.word 中，所以返回\
  \ false\n                return(false);\n            }\n        }\n        return(true);\n\
  \    }\n}\n```\n\n现在，为了使用这些功能，请对 `WordGame` 进行以下更改：点击此处查看代码\n\n```csharp\npublic\
  \ class WordGame : MonoBehaviour {\n\n    ...\n    public GameMode mode = GameMode.preGame;\n\
  \    public WordLevel currLevel;\n    ...\n    // 由 WordList 的 SendMessage() 命令调用\n\
  \    public void WordListComplete() {\n        mode = GameMode.makeLevel;\n    \
  \    // 创建一个关卡并赋值给 currLevel，即当前的 WordLevel\n        currLevel = MakeWordLevel();\n\
  \    }\n\n    // 使用默认值 -1，此方法将根据随机单词生成关卡\n    public WordLevel MakeWordLevel(int\
  \ levelNum = -1) {\n        WordLevel level = new WordLevel();\n        if (levelNum\
  \ == -1) {\n            // 随机选择一个关卡\n            level.longWordIndex = Random.Range(0,\
  \ WordList.S.longWordCount);\n        } else {\n            // 稍后可以添加\n        }\n\
  \        level.levelNum = levelNum;\n        level.word = WordList.S.GetLongWord(level.longWordIndex);\n\
  \        level.charDict = WordLevel.MakeCharDict(level.word);\n        // 调用协程检查\
  \ WordList 中的所有单词，并查看\n        // 每个单词是否可以使用 level.charDict 中的字符拼写\n        StartCoroutine(FindWordsCoroutine(level));\n\
  \        // 此方法在协程完成之前返回关卡，\n        // 所以当协程结束时会调用 WordSearchComplete()\n     \
  \   return(level);\n    }\n\n    // 寻找可以在此关卡中拼出的单词的协程\n    public IEnumerator FindWordsCoroutine(WordLevel\
  \ level) {\n        level.subWords = new List<string>();\n        string str;\n\
  \        List<string> words = WordList.S.GetWords();\n        // 这非常快，因为 List<string>\
  \ 是按引用传递的\n        // 遍历 WordList 中的所有单词\n        for (int i = 0; i < WordList.S.wordCount;\
  \ i++) {\n            str = words[i];\n            // 检查可以使用 level.charDict 拼写\n\
  \            if (WordLevel.CheckWordInLevel(str, level)) {\n                level.subWords.Add(str);\n\
  \            }\n            // 如果本帧解析了大量单词，则挂起\n            if (i % WordList.S.numParseBeforeYield\
  \ == 0) {\n                // 等待下一帧\n                yield return null;\n      \
  \      }\n        }\n        // List<string>.Sort() 默认按字母顺序排序\n        level.subWords.Sort();\n\
  \        // 现在按长度排序，以便按字母数量对单词分组\n        level.subWords = SortWordsByLength(level.subWords).ToList();\n\
  \        // 协程完成，因此调用 SubWordSearchComplete()\n        SubWordSearchComplete();\n\
  \    }\n\n    public static IEnumerable<string> SortWordsByLength(IEnumerable<string>\
  \ e) {\n        // 使用 LINQ 对接收到的数组排序并返回副本\n        // LINQ 语法与普通 C# 不同，且超出了\n  \
  \      // 本书的范围 // 1\n        var sorted = from s in e\n                     orderby\
  \ s.Length ascending\n                     select s;\n        return sorted;\n \
  \   }\n\n    public void SubWordSearchComplete() {\n        mode = GameMode.levelPrep;\n\
  \    }\n}\n```\n\n**1.** Unity Gems 网站上有关于 LINQ 的很好的解释。此链接来自互联网存档，以确保其仍然有效。[`web.archive.org/web/20140209060811/`](https://web.archive.org/web/20140209060811/)\
  \ [`unitygems.com/linq-1-time-linq/`](http://unitygems.com/linq-1-time-linq/)\n\n\
  \n\n\n\n## 6. 一旦 `PrefabLetter` 准备好，将其拖入 Project 格中的 `Prefabs` 文件夹，并删除 Hierarchy（层级）中剩余的实例。\n\
  \n### Letter C# 脚本\n\n`PrefabLetter` 将拥有它自己的 C# 脚本，用于处理其显示的字符、颜色以及其他各种设置。创建一个名为\
  \ `Letter` 的新 C# 脚本并将其挂到 `PrefabLetter` 上。然后在 `MonoDevelop` 中打开它并输入以下代码：\n\n点击此处查看代码图片\n\
  \n```csharp\nusing UnityEngine;\nusing System.Collections;\nusing System.Collections.Generic;\n\
  public class Letter : MonoBehaviour {\n\n    private char _c; // 在 Letter 上显示的字符\n\
  \    public TextMesh tMesh; // TextMesh 显示字符\n    public Renderer tR; // 3D 文本的渲染器。这决定了字符是否可见\n\
  \    public bool big = false; // 大写字母的行为不同\n\n    void Awake() {\n        tMesh\
  \ = GetComponentInChildren<TextMesh>();\n        tRend = tMesh.renderer;\n     \
  \   visible = false;\n    }\n\n    // 用于获取或设置 _c 以及由 3D 文本显示的字母\n    public char\
  \ c {\n        get {\n            return(_c);\n        }\n        set {\n      \
  \      _c = value;\n            tMesh.text = _c.ToString();\n        }\n    }\n\n\
  \    // 将 _c 获取或设置为字符串\n    public string str {\n        get {\n            return(_c.ToString());\n\
  \        }\n        set {\n            c = value[0];\n        }\n    }\n\n    //\
  \ 启用或禁用 3D 文本的渲染器，分别导致字符可见或不可见\n    public bool visible {\n        get {\n     \
  \       return(tRend.enabled);\n        }\n        set {\n            tRend.enabled\
  \ = value;\n        }\n    }\n\n    // 获取或设置圆角矩形的颜色\n    public Color color {\n\
  \        get {\n            return(renderer.material.color);\n        }\n      \
  \  set {\n            renderer.material.color = value;\n        }\n    }\n    //\
  \ 设置 Letter 的 gameObject 的位置\n    public Vector3 pos {\n        set {\n        \
  \    transform.position = value;\n        }\n    }\n}\n```\n\n此类使用了多个带有 `get{}`\
  \ 和 `set{}` 的属性以便在设置变量时执行操作。例如，这允许 `Word` 设置 `Letter` 的 `c`，而无需担心它是如何被转换为字符串并由 3D\
  \ 文本显示的。这种在类内部的封装是面向对象编程的核心。\n\n### Wyrd 类：字母集合\n\n创建一个名为 `Wyrd` 的新 C# 脚本。`Wyrd`\
  \ 类将作为 `Letters` 的集合，它的拼写使用了 `y` 以区分代码和本书文本中该单词的其他实例。`Wyrd` 是另一个没有继承 `MonoBehaviour`\
  \ 的类，不能挂载到 `GameObject` 上，但它仍然可以包含挂载到 GameObject 上的 `List<>`。输入以下代码：\n\n点击此处查看代码图片\n\
  \n```csharp\nusing UnityEngine;\nusing System.Collections;\nusing System.Collections.Generic;\n\
  public class Wyrd {\n    public string str; // 单词的字符串表示\n    public List<Letter>\
  \ letters = new List<Letter>();\n    public bool found = false; // 如果玩家拥有此单词则为真\n\
  \n    // 设置每个 Letter 3D 文本可见性的属性\n    public bool visible {\n        get {\n   \
  \         if (letters.Count == 0) return(false);\n            return(letters[0].visible);\n\
  \        }\n        set {\n            foreach(Letter lett in letters) {\n     \
  \           lett.visible = value;\n            }\n        }\n    }\n    // 设置每个\
  \ Letter 圆角矩形颜色的属性\n    public Color color {\n        get {\n            if (letters.Count\
  \ == 0) return(Color.black);\n            return(letters[0].color);\n        }\n\
  \        set {\n            foreach(Letter lett in letters) {\n                lett.color\
  \ = value;\n            }\n        }\n    }\n    // 将 Letter 添加到 letters\n    public\
  \ void Add(Letter lett) {\n        letters.Add(lett);\n        str += lett.c.ToString();\n\
  \    }\n}\n```\n\n### WordGame 布局\n\n`Layout()` 函数将为游戏生成 `Wyrds` 和 `Letters`，以及玩家可以用来拼写单词的大字母\
  \ `Letters`（在本章开头显示的大字母所示）。我们将从小小字母开始，在原型的这个阶段，我们将字母初始设为可见（而不是像最终版本中那样隐藏它们）。在 `WordGame`\
  \ 中添加以下代码：\n\n点击此处查看代码图片\n\n```csharp\npublic class WordGame : MonoBehaviour {\n\
  \    static WordGame S; // 单例\n    public GameObject prefabLetter;\n    public Rect\
  \ wordArea = new Rect(-24,19,48,28);\n    public float letterSize = 1.5f;\n    public\
  \ bool showAllyrds = true;\n    public float bigLetterSize = 4f;\n    public GameMode\
  \ mode = GameMode.preGame;\n    public WordLevel currLevel;\n    public List<Wyrd>\
  \ wyrds;\n    ...\n    public void SubWordComplete() {\n        mode = GameMode.levelPrep;\n\
  \        Layout(); // 在 SubSearch 后调用 Layout 函数\n    }\n    void Layout() {\n  \
  \      // 将 currLevel 的每个子单词放在屏幕上\n        wyrds = new List<Wyrd>();\n        //\
  \ 定义此方法所需的许多变量\n        GameObject go;\n        Letter lett;\n        string word;\n\
  \        Vector3 pos;\n        float left = 0;\n        float columnWidth = 3;\n\
  \        char c;\n        Color col;\n        Wyrd wyrd;\n        // 确定屏幕上可以容纳多少行\
  \ Letters\n        int numRows = Mathf.RoundToInt(wordArea.height/letterSize);\n\
  \        // 为 level.subWord 创建 Wyrd\n        for (int i=0; i<currLevel.subWords.Count;\
  \ i++) {\n            wyrd = new Wyrd();\n            word = currLevel.subWords[i];\n\
  \            // 如果单词长于 columnWidth，则扩展\n            columnWidth = Mathf.Max(columnWidth,\
  \ word.Length);\n            // 为单词的每个字母实例化一个 PrefabLetter\n            for (int\
  \ j=0; j<word.Length; j++) {\n                c = word[j]; // 获取单词的 j 字符\n     \
  \           go = Instantiate(prefabLetter) as GameObject;\n                lett\
  \ = go.GetComponent<Letter>();\n                // 设置 Letter 的 c\n             \
  \   lett.c = c;\n                // 安置 Letter\n                pos = new Vector3(wordArea.x+left+j*letterSize,\
  \ wordArea.y,0);\n                // 这里的 % 使多列对齐\n                pos.y -= (i%numRows)*letterSize;\n\
  \                lett.pos = pos;\n                go.transform.localScale = Vector3.one*letterSize;\n\
  \                wyrd.Add(lett);\n            }\n            if (showAllyrds) wyrd.visible\
  \ = true; // 这行用于测试\n            wyrds.Add(wyrd);\n            // 如果我们到了第 numRows\
  \ 行，开始新的一列\n            if (i%numRows == numRows-1) {\n                left += (columnWidth+0.5f)*letterSize;\n\
  \            }\n        }\n    }\n}\n```\n\n\n\n\n点击此处查看代码图像\n\n```csharp\npublic\
