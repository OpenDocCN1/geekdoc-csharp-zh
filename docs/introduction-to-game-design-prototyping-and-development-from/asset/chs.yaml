  \n**图 31.17** 游戏结束示例\n\n### 总结\n在本章中，你创建了一个完整的卡牌游戏，它从 XML 文件构建，并包含了评分、背景图像和主题设置。教程的目的之一是为你提供一个框架，以便你构建自己的游戏。在下一章中，我将引导你基于这个项目构建第一章开始的\
  \ `Bartok` 游戏。\n\n### 下一步\n以下是你你可以改进此游戏的几个可能方向。\n\n#### 金牌牌\n我们在为游戏添加评分的方法列表中提到了第\
  \ 4 点，但本章并没有实现金牌牌。你导入的包中有用于金牌牌的图形（包括 `Card_Back_Gold` 和 `Card_Front_Gold`）。金牌牌的目的是让它们所属的任何连对价值翻倍。金牌牌只能在矿井中出现，矿井中的任何牌都有\
  \ 10% 的概率变成金牌牌。尝试自己实现金牌牌。\n\n#### 在移动设备上编译此游戏\n虽然这个游戏的构建设置是为了 iPad 设计的，但指导你如何对移动设备进行实际编译并不在本书的范围内。Unity\
  \ 有几个页面记录了这一点；不过，我建议你查看适用于你拥有设备的正确文档。\n\n\n\n\n\n关于 `Bartok` 的描述以及如何玩，请参阅第 1 章，在该章节中它被广泛用作设计练习。简而言之，`Bartok`\
  \ 与商业游戏 `Uno` 非常相似，不同在于它使用标准扑克牌进行游戏，而且在传统的 Bartok 牌游戏中，每一轮的获胜者可以为游戏添加一条规则。在第 1 章的示例中，我们还包含了三种规则变体，但这些规则在本章中不会创建；我将这个任务留给你们以后完成。\n\
  \n要玩在线版本的 Bartok 游戏，请访问 [`book.prototools.net`](http://book.prototools.net) 并查看第\
  \ 1 章下的相关内容。\n\n## 创建新场景\n\n与此项目的许多部分一样，我们将使用的场景将基于 `Prospector` 的场景。在项目面板（Project\
  \ pane）中点击 `Prospector_Scene_0`，然后从菜单栏中选择 `Edit > Duplicate`。这将创建一个名为 `Prospector_Scene_1`\
  \ 的新场景。将其重命名为 `Bartok_Scene_0` 并双击它打开它。你可以看出它已经打开了，因为 Unity 窗口的标题栏会更改以反映新的场景名称。\n\
  \n### 清理场景\n\n让我们删掉一些不需要的东西。在层级面板（Hierarchy pane）中选择 `Scoreboard` 和 `HighScore`\
  \ 并将它们删除（从菜单栏中选择 `Edit > Delete`）。这个游戏不会评分，所以我们不需要其中任何一个。\n\n同样，你也可以从此场景中同时删除 `GameOver`\
  \ 和 `RoundResult`。我们稍后会用到它们，但需要时可以随时从 `Prospector_Scene_0` 中获取副本。\n\n选择 `MainCamera`\
  \ 并移除 `Prospector (Script)` 和 `Layout (Script)` 组件（右键点击每个名称[或点击名称右侧的齿轮图标]并选择 `Remove\
  \ Component`）。你最后应该会下一个 `MainCamera`，它具有所有正确的 `Transform` 和 `Camera` 的设置，并且仍然有一个\
  \ `Deck (Script)` 组件。\n\n最后，让我们更改背景。首先在层级面板中选择 `ProspectorBackground` 对象（不是 ProjectPane\
  \ 中的 `Texture2D`）并重命名为 `BartokBackground`。然后于 `Sprites` 文件夹中创建一个新的材质（从菜单栏选择 `Assets\
