  \ `fireGroundSpellPrefab` 字段。从 Project 面格的 `Prefabs` 文件夹将 `FireGroundSpellPrefab`\
  \ 拖入此字段中并保存场景。现在，当你运行场景时，你可以选择一种火元素并在地面施放火法术。然而，该法术目前是永久持续的。\n\n### 发后即忘法术（Fire-and-Forget\
  \ Spells）\n\n此游戏设计的一个方面是，法术应该能够由 `Mage` 脚本施放后被忽略。与其让 `Mage` 脚本管理法术的持续时间、伤害和行为，不如让单个法术制体管理自己。为了实现火地面法术的功能，在\
  \ `Scripts` 文件夹中创建一个名为 `FireGroundSpell` 的新 C# 脚本，并将其挂到 `Prefabs` 文件夹中的 `FireGroundSpellPrefab`\
  \ 上。在 MonoDevelop 中打开脚本并输入以下代码：\n\n点击此处查看代码图像\n\n```csharp\nusing UnityEngine;\n\
  using System.Collections;\n\n// 扩展 PT_MonoBehaviour\npublic class FireGroundSpell\
  \ : PT_MonoBehaviour {\n    public float duration = 4; // 此 GameObject 的寿命\n   \
  \ public float durationVariance = 0.5f;\n    // ^ 这允许持续时间在 3.5 到 4.5 之间变化\n    public\
  \ float fadeTime = 1f; // 渐隐时长\n    public float timeStart; // 此 GameObject 的出生时间\n\
  \    // 使用此进行初始化\n    void Start () {\n        timeStart = Time.time;\n        duration\
  \ = Random.Range(duration-durationVariance, duration+durationVariance);\n      \
  \  // ^ 设置持续时间在 3.5 到 4.5 之间（默认值）\n    }\n    // 每帧调用一次 Update\n    void Update\
  \ () {\n        // 确定一个 [0..1]（0 到 1 之间）的数值，用于存储\n        // 已通过时间的百分比\n       \
  \ float u = (Time.time-timeStart)/duration;\n        // 在哪个 u 位置开始渐隐\n        float\
  \ fadePercent = 1-(fadeTime/duration);\n        if (u>fadePercent) { // 如果过了开始渐隐的时间...\n\
  \            // ...然后沉入地面\n            float u2 = (u-fadePercent)/(1-fadePercent);\n\
  \            // ^ u2 是对应 fadeTime 的 [0..1] 数\n            Vector3 loc = pos;\n \
  \           loc.z = u2*2; // 随时间移低\n            pos = loc;\n        }\n        if\
  \ (u>1) { // 如果生存时间超过...\n            Destroy(gameObject); // ...销毁它\n        }\n\
  \    }\n    void OnTriggerEnter(Collider other) {\n        // 当另一个对象进入碰撞器时宣布\n \
  \       GameObject go = Utils.FindTaggedParent(other.gameObject);\n        if (go\
  \ == null) {\n            go = other.gameObject;\n        }\n        Utils.tr(\"\
  Flame hit\",go.name);\n    }\n    //TODO: 实际上对另一个对象造成伤害\n}\n```\n\n现在，当你运行场景时，你会发现在施放火地面法术后，每一股火苗都会持续\
  \ 4 秒并消失。此外，如果你让 `Mage` 走过火源，控制台中将出现“Flame hit”公告。当然，`Mage` 的法术不会伤害她，所以让我们给她一种方法寻找她可以伤害的敌人吧。\n\
  \n### 切换房间（Changing Rooms）\n\n为了体谅我们的 Mage 师，第一个房间里没有任何怪物，但在整个地下城中肯定会有一些怪物。`Mage`\
  \ 需要一种在房间之间移动的方法。这将通过 `Prefabs` 文件夹中的 `PortalPrefab` 和一些脚本来实现。如果你检查 `PortalPrefab`，请注意它位于\
  \ `Ignore Raycast`（忽略射线检测）层。Unity 自动在每个项目中包含此层，我们使用它来确保 `MouseInfo` 执行的 `Physics.Raycast()`\
  \ 会忽略 `PortalPrefab` 并穿透到其后的 `Tile`。\n\n创建一个名为 `Portal` 的新 C# 脚本并将其放在 `Scripts`\
  \ 文件夹中。然后，将其挂到 `Prefabs` 文件夹中的 `PortalPrefab` 制体上。在 MonoDevelop 中打开 `Portal` 脚本并输入以下代码：\n\
  \n点击此处查看代码图像\n\n```csharp\nusing UnityEngine;\nusing System.Collections;\npublic\
  \ class Portal : PT_MonoBehaviour {\n    public string toRoom;\n    public bool\
  \ justArrived = false;\n    // ^ 如果 Mage 刚刚传送到这里为 true\n    void OnTriggerEnter(Collider\
  \ other) {\n        if (justArrived) return;\n        // ^ 因为 Mage 刚刚到达，不要让她传送\n\
  \        // 获取碰撞器的 GameObject\n        GameObject go = other.gameObject;\n     \
  \   // 向上寻找标签父对象\n        GameObject goP = Utils.FindTaggedParent(go);\n       \
  \ if (goP != null) go = goP;\n        // 如果不是 age，则返回\n        if (go.tag != \"\
  age\") return;\n        // 从而构建下一个房间\n        LayoutTiles.S.BuildRoom(toRoom);\n\
  \    }\n    void OnTriggerExit(Collider other) {\n        // 当 Mage 离开此 Portal 时将\
  \ justArrived 设置为 false\n        if (other.gameObject.tag == \"age\") {\n      \
  \      justArrived = false;\n        }\n    }\n}\n```\n\n`justArrived` 布尔值很重要，因为它防止了\
  \ Mage 被传送回之前的房间。如果没有 `justArrived`，Mage 出现在新房间（Portal 之上）会触发 `OnTriggerEnter()`\
  \ 并送回之前的房间。\n\n现在，我们需要对 `LayoutTiles` 脚本进行若干修改，以允许它多次构建房间（并允许销毁被替换的房间）。打开 `LayoutTiles`\
  \ 并按**粗体**所示编辑代码：\n\n点击此处查看代码图像\n\n```csharp\npublic class LayoutTiles : MonoBehaviour\
  \ {\n    ...\n    public TileTex[] textures; // 用于 Tile 的命名纹理列表\n    public GameObject\
