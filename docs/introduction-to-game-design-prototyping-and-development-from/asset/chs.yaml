  \n**图 18.14** 添加了静态形状的场景\n\n### 总结\n\n在约 20 页的内容里，你已经从无到有了一个带有少量编程内容的可用 Unity 项目。诚实地说，这个项目非常小，但我希望它能向你展示\
  \ Unity 运行的原始速度，以及你可以在 Unity 中运行某些东西的速度。\n\n下一章将通过介绍变量并继续你对 C# 和 Unity 的介绍，并增加你对可以添加到\
  \ `GameObject` 中的最常见组件的了解。\n\n## 第 19 章 变量与组件\n\n**本章将向你介绍整个 Unity C# 编程中使用的许多变量和组件类型。到本章结束，你将理解许多常见的\
  \ C# 变量类型以及一些 Unity 特有的重要变量类型。**\n\n**本章还将向你介绍 Unity 的 `GameObjects` 和组件。Unity 场景中的任何对象都是一个\
  \ `GameObject`，构成它们的组件实现了从 `GameObject` 的定位到物理模拟、特殊特效、在屏幕上显示 3D 模型以及角色动画的所有功能。**\n\
  \n### 介绍变量\n\n回顾一下第 17 章 中的“介绍我们的语言：C#”，变量只是一个可以定义为特定值的名称。这实际上是一个源自代数学习的概念。例如，在代数中，你可能会得到如下定义：\n\
  \n```\nx = 5\n```\n\n这定义变量 `x` 等于值 5。换句话说，它将值 5 赋值给名称 `x`。然后，如果之后遇到定义：\n\n```\n\
  y = x + 2\n```\n\n你就知道 `y` 等于 7。\n\n### 强类型变量\n\n与其可以接受任何类型的值不同，C# 变量是强类型的，这意味着它们只能接受特定的类型。这是必要的，因为计算机需要知道分配多少空间。大图像可能占用数兆字节甚至几十\
  \ GB，而布尔值（只能存储 1 或 0）实际上只需要一个比特。\n\n#### 在 C# 中声明和定义变量\n\n在 C# 中，在定义变量之前必须先声明，尽管通常在同一行内完成：\n\
  \n```\nstring sierra = \"Mountain\";\n```\n\n*声明*变量创建了它并赋予其名称和类型。然而，这并没有给它赋值。\n\n\
  ```cs\nbool bravo;\nint india;\nfloat foxtrot;\nchar charlie;\n```\n\n*定义*变量为该变量赋值。以下是使用声明变量的一些示例：\n\
  \n```cs\nbravo = true;\nindia = 8;\nfoxtrot = 3.14f; // 后文将描述 f 使 foxtrot 为 float\n\
  charlie = 'c';\n```\n\n##### 字量\n\n当你代码中编写特定值时（例如 `true`、`8` 或 `'c'`），该特定值被称为字量。在之前的代码列表中，`true`\
  \ 是 bool 字量，`8` 是 int 字量，`3.14f` 是 float 字量，而 `'c'` 是 char 字量。默认情况下，MonoDevelop\
  \ 将这些字量显示为亮洋红色，并且每种变量类型对于其字量的表示方式都有某些规则。\n\n##### 定义前声明\n\n在定义变量之前，必须先声明它，尽管通常在同一行内完成。\n\
  \n通常情况下，如果你尝试访问一个已声明但尚未定义的（即读取）变量，Unity 会报错并抛出编译错误。\n\n### 重要的 C# 变量类型\n\n\n\n\n\
  在 C# 中有多种不同类型的变量可以使用。这里有你经常会遇到的几个重要类型。所有这些基础 C# 变量类型都以小写字母开头，而大多数 Unity 数据类型以大写字母开头。对于每种类型，我都列出了关于该变量类型的信息以及如何声明和定义变量的示例。\n\
  \n#### bool: 1 位的真或假值\n\n`bool` 是 Boolean（布尔）的缩写。从本质上讲，所有变量由位组成，可以设置为 true（真）或 false（假）。`bool`\
  \ 的长度为 1 位，是最小可能的变量。`bool` 对于 `if` 语句和其他条件判断等逻辑操作非常有用，这些将在接下来两个章节中介绍。在 C# 中，`bool`\
  \ 字面量仅限于小写关键字 `true` 和 `false`：\n\n```c\nbool verified = true;\n```\n\n虽然存储一个 `bool`\
  \ 只需要 1 位内存，但 C# 实际上使用至少 1 字节（即 8 位）来存储每个 `bool`。在 32 位系统上，最小的内存单元是 32 位，在 64 位系统上，则是\
  \ 64 位或 8 字节。\n\n#### int: 32 位整数\n\n`int` 是 integer（整数）的缩写，可以存储单个整数（整数是不带任何小数部分的数字，如\
  \ `5`、`2` 和 `-90`）。整数运算非常准确且快速。Unity 中的 `int` 可以存储于 –2,147,483,648 到 2,147,483,647\
  \ 之间的数字，其中 1 位用于表示数字的正负号，31 位用于表示数值。`int` 可以包含这两个数字之间的任何整数值（包含边界）：\n\n```csharp\n\
  int nonFractionalNumber = 12345;\n```\n\n#### float: 32 位小数\n\n浮点数（或 `float`）是 Unity\
  \ 中最常用的小数形式。它被称为“浮点数”，是因为它是使用一种类似于科学计数法的系统进行存储的。科学计数法是将数字以 `a•10^(b)` 的形式表示的（例如，300\
  \ 可以写成 `3•10²`，12,345 可以写成 `1.2345•10⁴`）。浮点数以类似的 `a•2^(b)` 格式存储。在内存中以这种方式存储数字时，1\
  \ 位表示数字是正还是负，23 位分配给有效数字（数字本身以及上述的 `a` 部分），8 位分配给数字所升幂或降低的指数（`b` 部分）。这意味着非常大的数字以及\
  \ 1 到 –1 之间的任何数字，在精度上将出现巨大的间隙。例如，无法使用 `float` 准确地表示 1/3。\n\n大多数情况下，`float` 的不精确性在你的游戏中影响不大，但它可能会导致碰撞检测等操作产生微小误差；因此，通常将游戏中的元素大小保持在大于\
  \ 1 个单位且小于几千个单位之间将使碰撞更准确。`float` 字面量必须是一个整数，或者是一个后面跟着 `f` 的十进制数。这是因为 C# 假设任何不带后缀\
  \ `f` 的十进制字面量都是 `double`（精度是 float 两倍的浮），而不是 Unity 使用的单精度浮点数。Unity 的所有内置函数都使用 `float`\
  \ 而非 `double`，以便实现最快的计算，尽管这是以牺牲精度为代价：\n\n```csharp\nfloat notPreciselyOneThird =\
  \ 1.0f/3.0f;\n```\n\n提示\n\n如果你在代码中看到以下编译错误\n\nerror CS0664: Literal of type double\
  \ cannot be implicitly converted to type 'float'. Add suffix 'f' to create a literal\
  \ of this type\n这意味着你在某处忘记在 `float` 字面量后添加 `f`。\n\n#### char: 16 位单字符\n\n`char`\
  \ 是由 16 位信息表示单个字符。`char` 使用 Unicode 值存储字符，能够表示来自 100 多种不同字符集和语言的 110,000 多个不同字符（例如所有的简体中文字符）。`char`\
  \ 字面量由单引号（也称为撇号）包围：\n\n```csharp\nchar theLetterA = 'A';\n```\n\n#### string: 16\
  \ 位字符序列\n\n`string` 用于表示从单个字符到整本书文本的所有内容。C# 中字符串的理论最大长度超过 20 亿个字符，但在达到该限制之前，大多数计算机就会遇到内存分配问题。为了提供背景，莎士比亚剧作《哈姆雷特》完整版大约有\
  \ 175,000 多个字符，包括舞台指示、换行等。这意味着《哈姆雷特》可以在单个字符串中重复 12,000 多次。字符串字面量由双引号包围：\n\n```csharp\n\
  string theLineOfHamlet = \"Who's there?\";\n```\n\n可以使用括号访问字符串的单个 `char`：\n\n```csharp\n\
  char theChar = theLineOfHamlet[0];\nchar theChart = theLineOfHamlet[6];\n```\n\n\
  提示\n\n如果你在代码中看到以下任何编译错误\n\nerror CS0029: Cannot implicitly convert type 'string'\
  \ to 'char'\nerror CS0029: Cannot implicitly convert type 'char' to 'string'\nerror\
  \ CS1012: Too many characters in character literal\nerror CS1525: Unexpected symbol\
  \ <>\n\n通常意味着你在某处不小心为 `char` 字面量使用了双引号（`\"`）或为 `string` 字面量使用了单引号（`’ ’`）。\n\n####\
  \ class: 新变量类型的定义\n\n`class` 定义了一种新的变量类型，这种类型最好被看是变量和功能的集合。本章“重要变量类型”部分中列出的所有 Unity\
  \ 变量类型和组件都是类的示例。第 25  own“类”将更详细地介绍类。\n\n\n\n\n本书中的代码遵循了一系列关于变量、函数、类等的命名的规则。虽然这些规则中没有强制性的，但遵循它们将使你的代码更具可读性，不仅对于那些尝试解读代码的人，也对于你你自己如此——如果你在几个月后需要重新查看代码并希望理解自己写了什么。每位编码员遵循的规则都略有不同——我个人的规则多年来甚至发生了变化——但我在这里介绍的规则对我学生学生都非常好，并且与我在\
  \ Unity 中遇到的大多数 C# 代码一致：\n\n**1.** 几乎所有内容都使用 `camelCase`（驼峰命名法，参见 camelCase 侧边栏）。\n\
  \n#### CamelCase\n\n`camelCase` 是编程中编写变量名的一种常用方式。它允许程序员或阅读代码的人能够轻松解析长变量名。这里是一些示例：\n\
  \n![Image](img/00003.jpeg) `aVariableNameStartingWithALowerCaseLetter`\n\n![Image](img/00003.jpeg)\
  \ `AClassNameStartingWithACapitalLetter`\n\n![Image](img/00003.jpeg) `aRealLongNameThatIsEasierToReadBecauseOfCamelCase`\n\
  \n`camelCase` 的关键特征是它允许将多个单词组合为一个，并在每个原始单词的开头使用中间大写字母。之所以命名为 `camelCase`，因为它看起来有点像骆驼背上的驼。\n\
  \n**2.** 变量名应该以小写字母开头（例如 `someVariableName`）。\n\n**3.** 函数名应该以大写字母开头（例如 `Start()`、`Update()`）。\n\
  \n**4.** 类名应该以大写字母开头（例如 `GameObject`、`ScopeExample`）。\n\n**5.** 私有变量名可以以后划线开头（例如\
  \ `_hiddenVariable`）。\n\n**6.** 静态变量名可以是全大写并使用下划线命名法（snake_case，例如 `NUM_INSTANCES`）。如你所见，`snake_case`\
  \ 通过下划线连接多个单词。\n\n为了方便稍后参考，这些将在将在附录 B](#part0052.html_app02) 中的“命名规范”部分重复出现。\n\n\
  #### 类实例和静态函数\n\n就像你在第 18 章中看到的制体一样，“Hello World：你的第一个程序”，类也可以拥有*实例*。任何类的实例（也称为该类的*成员*）都是一个由该类定义类型的数据对象。\n\
  \n例如，你可以定义一个类 `Human`，你认识的每个人都是该类的一个实例。所有人类共享几个函数（例如 `Eat()`、`Sleep()`、`Breathe()`）。\n\
  \n正如你与周围的所有人类不同一样，类的每个实例与其他实例之间也不同。即使两个实例具有完全相同的值，它们也存储在计算机内存中的不同位置，并被视为两个不同的对象。（继续用人类来类比，你可以将它们想象成相同的双胞胎。）类实例是通过*引用*引用的，而不是通过值。这意味着如果你在比较两个类实例以查看它们是否相同，比较的是它们在*内存中的位置*，而不是它们的值（就像两个相同的双胞胎有不同的名字一样）。\n\
  \n当然，使用不同的变量引用同一个类实例是可能的。就像我可能会称某人为“女儿”，而我的父母也会称其为“孙女”一样，类实例可以分配给任意数量的变量名，但仍然是数据对象，如下代码所示：\n\
  \n```\nusing UnityEngine;\nusing System.Collections;\n\n// 定义类 Human\npublic class\
  \ Human {\n    public string    name;\n    public Human    partner;\n}\n\npublic\
  \ class Family : MonoBehaviour {\n    // 公共变量声明\n    public Human husband;\n   \
  \ public Human wife;\n\n    void Start() {\n        // 初始状态\n        husband = new\
  \ Human();\n        husband.name = \"Jeremy Gibson\";\n        wife = new Human();\n\
  \        wife.name = \"Melanie Schuessler\";\n\n        // 我的妻子和我结婚了\n        husband.partner\
  \ = wife;\n        wife.partner = husband;\n\n        // 我们更改了名字\n        husband.name\
  \ = \"Jeremy Gibson\";\n        wife.name = \"Melanie Schuessler\";\n\n        //\
  \ 因为 wife.partner 与 husband 指向同一个实例，\n        // wife.partner 的名字也发生了变化\n      \
  \  print(wife.partner.name); // 打印 \"Jeremy Gibson\"\n    }\n}\n```\n\n在 `Human`\
  \ 类上创建*静态函数*也是可能的，该函数能够作用于该类的一个或多个实例。以下静态函数 `Marry()` 允许你通过一个函数将两个人类设置为彼此的伴侣。\n\n\
  ```\nstatic void Marry(Human h0, Human h1) {\n    h0.partner = h1;\n    h1.partner\
  \ = h0;\n}\n```\n\n有了这个函数，现在可以将初始代码中的第 23 和 24 行替换为单行 `Human.Marry( wife, husband)`；因为\
  \ `Marry()` 是静态函数，它几乎可以用你代码中的任何地方。你将在书中后面学习更多关于静态函数和变量的知识。\n\n### Unity Unity 变量类型\n\
  \nUnity 有许多你在几乎每个项目中遇到的变量类型。这些变量类型都是类的示例，并遵循 Unity 的命名规范，即所有类类型都以大写字母开头。对于每个 Unity\
  \ 变量类型，你将看到有关如何创建该类的*实例*的信息（参见实例 侧边栏），然后是该数据类型的重要变量和函数列表。对于本节列出的大多数 Unity 类，变量和函数分为两组：\n\
  \n实例变量和函数：这些变量和函数直接与变量类型的实例绑定。如果你查看后续 Vector3 信息，你会发现 `x`、`y`、`z` 和 `magnitude`\
  \ 都是 `Vector3` 的实例变量，每个变量都通过*点语法*访问，即 Vector3 变量名、点、然后实例变量名（例如 `position.x`）。每个\
  \ `Vector3` 实例的这些变量可以不同的值。同样，`Normalize()` 函数作用于 `Vector3` 的单个实例并将 `magnitude` 设置为\
  \ 1。\n\n静态类变量和函数：静态变量与类定义绑定，而不是绑定到特定的实例。它们通常用于存储跨所有实例都相同的信息（例如 `Color.red` 始终是同样的红色），或作用于类的多个实例而不影响任何一个（例如\
  \ `Vector3.Cross( v3a, v3b )` 用于计算两个 `Vector3` 的叉积并将该值作为新的 `Vector3` 返回，而不改变 `v3a`\
  \ 或 `v3b`）。\n\n有关这些任何 Unity 类型的更多信息，请查看脚注中引用的 Unity 文档链接。\n\n#### Vector3：三个浮点数的集合\n\
  \n`Vector3` 是 3D 工作中非常常见的数据类型。它最常用于存储 Unity 中对象的三维位置。请查看脚注获取更多关于 Vector3 的详细信息。\n\
  \nhttp://docs.unity3d.com/Documentation/ScriptReference/Vector3.html\n\n\n\n\n```csharp\n\
  Vector3 position = new Vector3( 0.0f, 3.0f, 4.0f ); // 设置 x, y, & z 值\n```\n\n###\
  \ Vector3 实例变量和函数\n\n作为一个类，每个 `Vector3` 实例还包含许多实用的内置值和函数：\n\n点击此处查看代码图片\n\n```csharp\n\
  print( position.x ); // 0.0, Vector3 的 x 值\nprint( position.y ); // 3.0, Vector3\
  \ 的 y 值\nprint( position.z ); // 4.0, Vector3 的 z 值\nprint( position.magnitude );\
  \ // 5.0, Vector3 到 0,0,0 的距离\n// Magnitude 是“长度”的另一个表达词。\nposition.Normalize();\
  \ // 将 position 的幅度设置为 1，这意味着\n// position 的 x, y, & z 值现在是 [0.0, 0.6, 0.8]\n```\n\
  \n### Vector3 静态类变量和函数\n\n此外，还有几个静态变量和函数与 `Vector3` 类本身相关：\n\n点击此处查看代码图片\n\n```csharp\n\
  print( Vector3.zero ); // (0,0,0), new Vector3( 0, 0, 0 ) 的简写\nprint( Vector3.one\
  \ ); // (1,1,1), new Vector3( 1, 1, 1 ) 的简写\nprint( Vector3.right ); // (1,0,0),\
  \ new Vector3( 1, 0, 0 ) 的简写\nprint( Vector3.up ); // (0,1,0), new Vector3( 0, 1,\
  \ 0 ) 的简写\nprint( Vector3.forward ); // (0,0,1), new Vector3( 0, 0, 1 ) 的简写\nVector3.Cross(\
  \ v3a, v3b);// // 计算两个 Vector3 的叉积\nVector3.Dot( v3a, v3b ); // 计算两个 Vector3 的点积\n\
  ```\n\n这只是与 `Vector3` 相关的字段和方法的示例。要了解更多信息，请查看脚注中引用的 Unity 文档。\n\n### Color：带有透明度信息的颜色\n\
  \n`Color`(6) 变量类型可以存储关于颜色及其透明度（alpha 值）的信息。计算机上的颜色是三原色光（红、绿、蓝）的混合物。这些与你小时候可能学过的颜料原色（红、黄、蓝）不同，因为电脑屏幕上的颜色是加法色，而不是*减法色*。在像颜料这样的减法色系统中，混合越来越多的不同颜色会使混合色趋向黑色（或一种非常深、浑浊的棕色）。相比之下，在加法色系统中（如电脑屏幕、剧院灯光设计或互联网上的\
  \ HTML 颜色），将越来越多的颜色加在一起会变得越来越亮，直到最终的混合颜色变为白色。C# 中颜色的红、绿、蓝分量以 `0.0f` 到 `1.0f` 之间的浮点数存储，其中\
  \ `0.0f` 代表该颜色通道不存在，而 `1.0f` 代表该颜色通道尽可能多：^(7)(6) [`docs.unity3d.com/Documentation/ScriptReference/Color`](http://docs.unity3d.com/Documentation/ScriptReference/Color)^(7)\
  \ 在 Unity 颜色选择器中，颜色的四个通道被定义为 0 到 255 之间的整数。这些数字与 HTML 的可能颜色匹配，但会自动转换为 0–1 之间的浮点数。点击此处查看代码图片\n\
  \n```csharp\n// 颜色通过浮点数定义红、绿、蓝、Alpha 通道\nColor darkGreen = new Color( 0f, 0.25f,\
  \ 0f ); // 如果没有传递 alpha 信息，\n// 则假设 值值为 1（完全不透明）\nColor darkTransparent = new Color(\
  \ 0.25f, 0f, 0f, 0.5f );\n```\n\n如你所见，定义颜色有两种不同的方法：一种带有三个参数（红、绿、蓝），另一种带有四个参数（红、绿、蓝和\
  \ alpha）。(([8) alpha 值设置了颜色的透明度。alpha 为 `0.0f` 的颜色完全透明，而 alpha 为 `1.0f` 的颜色完全不透明。(([8)\
  \ `new Color()` 函数接受不同数量变量的能力被称为*函数重载*，你可以在第 23 章“函数与参数”中阅读更多相关内容。\n\n#### Color\
  \ 实例变量\n\n颜色的每个通道可以通过实例变量引用：\n\n点击此处查看代码图片\n\n```csharp\nprint( Color.yellow.r );\
  \ // 1, 颜色的红色值\nprint( Color.yellow.g ); // 0.92f, 颜色的绿色值\nprint( Color.yellow.b\
  \ ); // 0.016f, 颜色的蓝色值\nprint( Color.yellow.a ); // 1, 颜色的 alpha 值\n```\n\n####\
  \ Color 静态类变量和函数\n\n几种常用颜色在 Unity 中被定义为静态类变量：\n\n点击此处查看代码图片\n\n```csharp\n// 原色：红、绿、蓝\n\
  Color.red = new Color(1, 0, 0, 1); // 纯红色\nColor.green = new Color(0, 1, 0, 1);\
  \ // 纯绿色\nColor.blue = new Color(0, 0, 1, 1); // 纯蓝色\n\n// 间色：青、洋红、黄\nColor.cyan\
  \ = new Color(0, 1, 1, 1); // 青色，亮绿色\nColor.magenta = new Color(1, 0, 1, 1); //\
  \ 洋红色，粉紫色\nColor.yellow = new Color(1, 1, 0, 1); // 黄色，亮黄色\n```\n\n\n\n\n`Mathf`^(10)\
  \ 与其说是一个变量类型，不如说是一个非常有用的数学函数库。所有附加 `Mathf` 的变量和函数都是静态的；你无法创建 `Mathf` 的实例。`Mathf`\
  \ 库中的有用函数非常多，无法在此全部列出，但包括以下几个：\n\n**^(10)** [`docs.unity3d.com/Documentation/ScriptReference/Mathf.html`](http://docs.unity3d.com/Documentation/ScriptReference/Mathf.html)\n\
  \n点击此处查看代码图像\n\n```javascript\nMathf.Sin(x);           // 计算 x 的正弦\nMathf.Cos(x);\
  \           // 还有 .Tan(), .Asin(), .Acos(), & .Atan()\nMathf.Atan2( y, x );    //\
  \ 给你绕 z 轴旋转的角度，以便将面向 x 轴的物体转为面向 x, y 点。(11)\nprint(Mathf.PI);        // 3.141593;\
  \ 周长与直径的比率\nMathf.Min( 2, 3, 1 );   // 1, 三个数（浮点或整数）中的最小值\nMathf.Max( 2, 3, 1 );\
  \   // 3, 三个数（浮点或整数）中的最大\nMathf.Round( 1.75f );   // 2, 四舍五入到最近的数字\nMathf.Ceil(\
  \ 1.75f );    // 2, 向上取整到下一个高整数\nMathf.Floor( 1.75f );   // 1, 向下取整到下一个低整数\nMathf.Abs(\
  \ -25 );      // 25, -25 的绝对值\n```\n\n**^(11)** [`docs.unity3d.com/Documentation/ScriptReference/Mathf.Atan2.html`](http://docs.unity3d.com/Documentation/ScriptReference/Mathf.Atan2.html)\n\
  \n## Screen: 关于显示的信息\n\n`Screen`^(12) 是另一个类似于 `Mathf` 的库，它可以提供你的 Unity 游戏使用的特定计算机屏幕的信息。无论何种设备都有效，因此无论是在\
  \ PC、OS X、iOS 设备还是 Android 平板上，`screen` 都会提供准确的信息：\n\n**^(12)** [`docs.unity3d.com/Documentation/ScriptReference/Screen.html`](http://docs.unity3d.com/Documentation/ScriptReference/Screen.html)\n\
  \n点击此处查看代码图像\n\n```javascript\nprint( Screen.width );   // 以像素为单位打印屏幕宽度\nprint(\
  \ Screen.height );  // 以像素为单位打印屏幕高度\nScreen.showCursor = false;  // 隐藏光标\n```\n\n\
  ## SystemInfo: 关于设备的信息\n\n`SystemInfo`^(13) 将告诉你关于运行游戏的设备的特定信息。它包含了关于操作系统、处理器数量、显卡硬件等的信息。我建议遵循脚注中的链接以了解更多：\n\
  \n**^(13)** [`docs.unity3d.com/Documentation/ScriptReference/SystemInfo.html`](http://docs.unity3d.com/Documentation/ScriptReference/SystemInfo.html)\n\
  \n点击此处查看代码图像\n\n```javascript\nprint( SystemInfo.operatingSystem );  // 例如：Mac OS\
  \ X 10.8.5\n```\n\n（注：此处为 GameObject）\n\n## GameObject: 场景中任何对象的类型\n\n`GameObject`^(14)\
  \ 是 Unity 场景中所有实体的基类。你在 Unity 游戏屏幕上看到的任何东西都是 `GameObject` 类的子类。GameObject 可以包含任意数量的不同组件，包括下一节“Unity\
  \ GameObject 组件”中提到的所有组件。然而，除了那里涵盖的内容，GameObject 还有几个重要的变量：\n\n**^(14)** [`docs.unity3d.com/Documentation/ScriptReference/GameObject.html`](http://docs.unity3d.com/Documentation/ScriptReference/GameObject.html)\n\
  \n点击此处查看代码图像\n\n```javascript\nGameObject gObj = new GameObject(\"MyGO\");  // 创建名为\
  \ MyGO 的新 GameObject\nprint( gObj.name );   // MyGO，GameObject gObj 的名称\nTransform\
  \ trans = gObj.GetComponent<Transform>();  // 定义 trans 为 gObj 的 Transform 组件的引用\n\
  Transform trans2 = gObj.transform;  // Transform 的快捷方式\ngObj.SetActive(false); \
  \ // 使 GameObject 变为非激活\n```\n\n\n\n\n\n一个 `Renderer` 组件——在大多数情况下是 `MeshRenderer`——允许你在场景（Scene）和游戏（Game）窗格中看到\
  \ `GameObject`。`MeshRenderer` 需要一个 `MeshFilter` 来提供 3D 网格数据，至少还需要一个 `Material`（材质），如果你希望它看起来不像一个丑陋的洋红色色块（材质会为对象应用纹理）。渲染器将\
  \ `MeshFilter`、材质 `Material(s)` 和光照结合在一起，在屏幕上显示 `GameObject`。\n\n[`docs.unity3d.com/Documentation/Components/class-MeshRenderer.html`](http://docs.unity3d.com/Documentation/Components/class-MeshRenderer.html)\n\
  \n### Collider：GameObject 的物理存在\n\n`Collider`（碰撞器）使 `GameObject` 能够在游戏世界中具有物理存在，并能与其他物体发生碰撞。Unity\
  \ 中有四种不同的 `Collider` 组件：\n\n[`docs.unity3d.com/Documentation/Components/comp-DynamicsGroup.html`](http://docs.unity3d.com/Documentation/Components/comp-DynamicsGroup.html)\n\
  \n![Image](img/00003.jpeg) 球体 `Collider`：最快的碰撞形状。球或球体。\n\n[`docs.unity3d.com/Documentation/Components/class-SphereCollider.html`](http://docs.unity3d.com/Documentation/Components/class-SphereCollider.html)\n\
  \n![Image](img/00003.jpeg) 胶囊体 `Collider`：两端带有球体的管道。仅次最快的类型。\n\n[`docs.unity3d.com/Documentation/Components/class-CapsuleCollider.html`](http://docs.unity3d.com/Documentation/Components/class-CapsuleCollider.html)\n\
  \n![Image](img/00003.jpeg) 盒体 `Collider`：矩形实体。适用于箱子、汽车、躯干等。\n\n[`docs.unity3d.com/Documentation/Components/class-BoxCollider.html`](http://docs.unity3d.com/Documentation/Components/class-BoxCollider.html)\n\
  \n![Image](img/00003.jpeg) 网格 `Collider`：由 3D 网格形成的碰撞器。虽然有用且准确，但它们的运行比其他任何三个慢得多。此外，只有将\
  \ `Convex`（凸包）设置为 true 的 `Mesh Colliders` 才能与其他 `Mesh Colliders` 碰撞。\n\n[`docs.unity3d.com/Documentation/Components/class-MeshCollider.html`](http://docs.unity3d.com/Documentation/Components/class-MeshCollider.html)\n\
  \nUnity 通过 NVIDIA PhysX 引擎处理物理和碰撞。尽管这通常能提供非常快速且准确的碰撞，但请注意，所有物理引擎都有局限性，即使是 PhysX\
  \ 有时在处理快速移动物体或薄墙也会出现问题。\n\n书中后面将更深入地介绍碰撞器，你也可以从 Unity 文档中学习更多相关知识。\n\n### Rigidbody：物理模拟\n\
  \n`Rigidbody` 组件控制你的 `GameObject` 的物理模拟。`Rigidbody` 组件在每个 `FixedUpdate`（通常是每秒第 50\
  \ 次）模拟加速度和速度，以随时间更新 `Transform` 组件的位置和旋转角度。它还使用 `Collider` 组件来处理与其他 `GameObjects`\
  \ 的碰撞。`Rigidbody` 组件还可以模拟重力、阻力以及风和爆炸等各种力。如果你想直接设置 `GameObject` 的位置而不使用 `Rigidbody`\
  \ 提供的物理效果，请将 `isKinematic` 设置为 true。\n\n[`docs.unity3d.com/Documentation/Components/class-Rigidbody.html`](http://docs.unity3d.com/Documentation/Components/class-Rigidbody.html)\n\
  \n为了让 `Collider` 组件的位置随其 `GameObject` 移动，`GameObject` *必须* 拥有 `Rigidbody`。否则，从 Unity\
  \ PhysX 物理模拟的角度来看，碰撞器将不会移动。句话说，如果没有挂载 `Rigidbody`，`GameObject` 看起来会在屏幕上移动，但在 PhysX\
  \ 中，`Collider` 组件的位置将不会更新，因此将保持在原地。\n\n### Script：你编写的 C# 脚本\n\n所有的 C# 脚本都是 GameObject\
  \ 组件。脚本作为组件的优点之一是，你可以为每个 `GameObject` 挂载多个脚本，我们将在本书第三部分的的一些教程中利用这一功能。在书的后部分，你将读到更多关于\
  \ `Script` 组件以及如何访问它们的内容。\n\n***\n\n**警告**\n\n**变量名会在 Inspector 面中发生变化** 在图 19.1\
  \ 中，你可以看到脚本名称是 *Scope Example (Script)*，但这违反了类的命名规则，因为类名不能包含空格。\n\n我代码中的实际脚本名称是一个使用驼峰命名法的单单词：`ScopeExample`。我不确定确切原因，但在\
  \ Inspector 面中，类名和变量名的拼写会根据以下规则从你编写的 C# 脚本实际拼写发生变化：\n\n![Image](img/00003.jpeg)\
  \ 类名 `ScopeExample` 变为 *Scope Example (Script)*。\n\n![Image](img/00003.jpeg) 变量\
  \ `trueOrFalse` 变为 *True Or False*。\n\n![Image](img/00003.jpeg) 变量 `graduationAge`\
  \ 变为 *Graduation Age*。\n\n![Image](img/00003.jpeg) 变量 `goldenRatio` 变为 *Golden Ratio*。\n\
  \n这是一个重要的区别，它曾困扰过一些学生。\n\n***\n\n### 总结\n\n这是一个很长的章节，包含了很多信息，你可能需要再次阅读或查阅它。然而，当你继续阅读本书时，所有这些信息将证明它们非常有价值。一旦你理解了\
  \ GameObject/Component 的结构并学会了利用 Inspector 设置和修改变量，你会发现编写 Unity 代码将变得更快、更流畅。\n\n\
  ## 第 20 章 布尔运算与条件语句\n\n**大多数人都听说过计算机数据在底层上完全由 1 和 0 组成，即真或假的位。然而，只有程序员真正理解，编程在很大程度上是关于将问题简化为真或假的值并对其做出反应。**\n\
  \n**在本章中，你将学习像 AND、OR 和 NOT 等布尔运算；学习 >、<、== 和 != 等比较语句；并开始理解 if 和 switch 等条件语句。这些都是核心内容。**\n\
  \n### 布尔值 (Booleans)\n\n正如你在上一章中中学到的，`bool` 是一个可以存储真或假值的变量。`Bools` 以乔治·布尔（George\
  \ Boole）命名，他是一位研究真、假值和逻辑运算（现在称为“布尔运算”）的数学家。尽管在他研究时期计算机还没有出现，但计算机逻辑从根本上是基于他的理论。\n\
  \n在 C# 编程中，`bools` 用于存储游戏状态的简单信息（例如，`bool gameOver = false;`），并通过在本章后面介绍的 `if` 和\
  \ `switch` 语句来控制程序的流。\n\n#### 布尔运算\n\n布尔运算允许程序员以意义的方式修改或组合 `bool` 变量。\n\n##### !\
  \ — NOT 运算符\n\n`!`（读作“not”或“bang”）运算符会反转 `bool` 值。假变真，真变假：\n\n```javascript\nprint(!true);\
  \ // 输出: false\nprint(!false); // 输出: true\nprint(!(!true)); // 输出: true（真的双重否定为真）\n\
  ```\n\n\n\n\n\n`!` 有时也被称为`逻辑取反运算符`，以区分于 `~`（`位取反运算符`），后者在附录 B 中的位运算布尔运算符与图层掩码部分以及常用概念进行了解释。\n\
  \n#### &&—与运算符\n\n`&&` 运算符仅在两个操作数都为真时才返回真：\n\n点击此处查看代码图片\n\n```cpp\nprint( false\
  \ && false );    // false\nprint( false && true );    // false\nprint( true && false\
  \ );     // false\nprint( true && true );     // true\n```\n\n#### ||—或运算符\n\n`||`\
  \ 运算符在其中一个操作数为真（或都为真）时均返回真：\n\n点击此处查看代码图片\n\n```cpp\nprint( false || false );  \
  \  // false\nprint( false || true );     // true\nprint( true || false );     //\
  \ true\nprint( true || true );      // true\n```\n\n#### 短路与非短路布尔运算符\n\n标准的与和或运算符（`&&`\
  \ 和 `||`）是`短路`运算符，这意味着如果短路运算符仅通过第一个参数就能确定其返回值，它将不会去求值第二个参数。相比之下，非短路运算符（`&` 和 `|`）始终会完全地计算两个参数。下面的代码列表包含了几个示例，说明了这两者之间的差异。在代码列表中，行右侧的双斜杠后跟数字（例如\
  \ `// 1`）表示代码列表后面有对该行的解释。\n\n点击此处查看代码图片\n\n```cpp\n1 // 此函数打印 \"--true\" 并返回一个真值。\n\
  2 bool printAndReturnTrue() {\n3     print( \"--true\" );\n4     return( true );\n\
  5 }\n6\n7 // 此函数打印 \"--false\" 并返回一个假值。\n8 bool printAndReturnFalse() {\n9     print(\
  \ \"--false\" );\n10    return( false );\n11 }\n12\n13 void ShortingOperatorTest()\
  \ {\n14     // 此测试的前半部分使用了短路的 && 和 ||\n15     bool tfAnd = ( printAndReturnTrue()\
  \ && printAndReturnFalse() );     // 1\n16     print( \"tfAnd: \"+tfAnd );\n17\n\
  18     bool tfAnd2 = ( printAndReturnFalse() && printAndReturnTrue() );   // 2\n\
  19     print( \"tfAnd2: \"+tfAnd2 );\n20\n21     bool tfOr = ( printAndReturnTrue()\
  \ || printAndReturnFalse() );      // 3\n22     print( \"tfOr: \"+tfOr );\n23\n\
  24     bool tfOr2 = ( printAndReturnFalse() || printAndReturnTrue() );     // 4\n\
  25     print( \"tfOr2: \"+tfOr2 );\n26\n27\n28\n     // 此测试的后半部分使用了非短路的 & 和 |\n\
  29     bool tfAnd3 = ( printAndReturnFalse() & printAndReturnTrue() );     // 5\n\
  30     print( \"tfAnd3: \"+tfAnd3 );\n31\n32     bool tfOr3 = (printAndReturnTrue()\
  \ | printAndReturnFalse() );       // 6\n33     print( \"tfOr3: \"+tfOr3 );\n34\n\
  35 }\n```\n\n列表中的数字指的是前面代码中行右侧标记有 `// 1` 和 `// 2` 的行。\n\n**1.** 这行在将 `tfAnd` 设置为假之前会打印\
  \ `--true` 和 `--false`。因为短路 `&&` 运算符评估的第一个参数为真，它将不会去求值第二个参数。\n\n**2.** 这行在设置 `tfAnd2`\
  \ 之前会打印 `--false`。因为短路 `&&` 运算符评估的第一个参数为假，它将求值第二个参数。\n\n**3.** 这行在设置 `tfOr` 之前会打印\
  \ `--true`。因为短路 `||` 运算符评估的第一个参数为真，它将不会去求值第二个参数。\n\n**4.** 这行在设置 `tfOr2` 之前会打印 `--false`\
  \ 和 `--true`。因为短路 `||` 运算符评估的第一个参数为假，它将求值第二个参数。\n\n**5.** 这行在设置 `tfAnd3` 之前会打印 `--false`\
  \ 和 `--true`。因为这是一个非短路运算符 `&`，它会求值两个参数。\n\n**6.** 这行在设置 `tfOr3` 之前会打印 `--true` 和\
  \ `--false`。因为这是一个非短路运算符 `|`，它会求值两个参数。\n\n\n\n\n等值比较运算符用于检查任意变量或字面量的值是否相互相等。该运算符的结果是一个为真（true）或假（false）的布尔值。\n\
  \n点击此处查看代码图片\n\n```cpp\nint i0 = 10;\nint i1 = 10;\nint i2 = 20;\nfloat f0 = 1.23f;\n\
  float f1 = 3.14f;\nfloat f2 = Mathf.PI;\n\nprint( i0 == i1 );    // 输出: True\nprint(\
  \ i1 == i2 );    // 输出: False\nprint( i2 == 20 );    // 输出: True\nprint( f0 == f1\
  \ );    // 输出: False\nprint( f0 == 1.23f ); // 输出: True\nprint( f1 == f2 );    //\
  \ 输出: False\n```\n\n1. 第 13 行的比较为假，因为 `Mathf.PI` 比 `3.14f` 准确得多，而 `==` 要求值必须完全相等。\n\
  \n***\n\n### 警告\n\n**不要混淆 = 和 ==** 赋值运算符（`=`）和等值运算符（`==`）有时会被混淆。赋值运算符（`=`）用于给变量赋值，而等值运算符（`==`）用于比较两个值。请考虑以下代码列表：\n\
  \n点击此处查看代码图片\n\n```cpp\nbool f = false;\nbool t = true;\nprint( f == t ); //// 输出:\
  \ False\nprint( f = t );  // 输出: True\n```\n\n在第 3 行中，`f` 与 `t` 进行比较，因为它们不相等，所以返回并打印了\
  \ false。然而，在第 4 行，`f` 被赋值为 `t` 的值，导致 `f` 的值变为 true，并打印了 true。\n\n在讨论这两个运算符时，混淆也是一个问题。为了避免混淆，我通常将\
  \ `i=5;` 读作“i 等于 5”，而将 `i==5;` 读作“i 是等于 5”。\n\n***\n\n参阅“通过值或引用测试相等性”侧边栏，获取有关如何处理不同变量类型相等性的详细信息。\n\
  \n***\n\n### 通过值或引用测试相等性\n\nUnity 版本的 C# 将按值比较大多数简单数据类型。这意味着只要两个变量的值相同，它们就会被视为等等。这适用于以下所有数据类型：\n\
  \n![Image](img/00003.jpeg) bool\n![Image](img/00003.jpeg) int\n![Image](img/00003.jpeg)\
  \ float\n![Image](img/00003.jpeg) char\n![Image](img/00003.jpeg) string\n![Image](img/00003.jpeg)\
  \ Vector3\n![Image](img/00003.jpeg) Color\n![Image](img/00003.jpeg) Quaternion\n\
  \n然而，对于更复杂的变量类型，如 `GameObject`、`Material`、`Renderer` 等，C# 不再检查两个变量的所有值是否相等，而是检查两个变量的*引用*是否相等。换句话说，它检查两个变量是否引用（或指向）计算机内存中的同一个单一对象。（对于接下来的示例，我们假设\
  \ `boxPrefab` 是一个引用 `GameObject` 制体的预存变量。）\n\n点击此处查看代码图片\n\n```cpp\nGameObject go0\
  \ = Instantiate( boxPrefab ) as GameObject;\nGameObject go1 = Instantiate( boxPrefab\
  \ ) as GameObject;\nGameObject go2 = go0;\nprint( go0 == go1 ); // 输出: false\nprint(\
  \ go0 == go2 ); // 输出: true\n```\n\n尽管赋值给变量 `go0` 和 `go1` 的两个 `boxPrefab` 具有相同的值（它们具有相同的默认位置、旋转和开启状态），但\
  \ `==` 运算符认为它们是不同的，因为它们实际上实际上是两个对象，因此位于不同的位置。`go0` 和 `go2` 被 `==` 视为相等，因为它们都引用同一个对象。让我们继续之前的代码：\n\
  \n点击此处查看代码图片\n\n```cpp\ngo0.transform.position = new Vector3(10, 20, 30);\nprint(\
  \ go0.transform.position ); // 输出: (10.0, 20.0, 30.0)\nprint( go1.transform.position\
  \ ); // 输出: (0.0, 0.0, 0.0)\nprint( go2.transform.position ); // 输出: (10.0, 20.0,\
  \ 30.0)\n```\n\n在这里，`go0` 的位置改变了。由于 `go1` 是不同的 `GameObject` 实例，它的位置保持不变。然而，由于 `go2`\
  \ 和 `go0` 引用同一个 `GameObject` 实例，`go2.transform.position` 也随之改变了。\n\n#### != (不等于)\n\
  \n`!=` 运算符在两个值不相等时返回真。它是 `==` 的反面。\n\n点击点击此处查看代码图片\n\n```cpp\nprint( 10 != 20 );\
  \ // 输出: True\nprint( 10 != 10 ); // 输出: False\nprint( 1.23f != 3.14f ); // 输出:\
  \ True\n```\n\n#### > (大于) 和 < (小于)\n\n#### (大于)\n\n`>` 运算符在左侧的值大于右侧的值时返回真。\n\n\
  点击此处查看代码图片\n\n```cpp\nprint( 20 > 10 ); // 输出: True\nprint( 10 > 10 ); // 输出: False\n\
  print( 3.14f > 1.23f ); // 输出: True\nprint( 1.23f > 3.14f ); // 输出: False\n```\n\
  \n#### (小于)\n\n`<` 运算符在左侧的值小于右侧的值时返回真\n\n点击此处查看代码图片\n\n```cpp\nprint( 10 < 20 );\
  \ // 输出: True\nprint( 10 < 10 ); // 输出: False\nprint( 1.23f < 3.14f ); // 输出: True\n\
  print( 3.14f < 1.23f ); // 输出: False\n```\n\n字符 `<` 和 `>` 在它们作为比较运算符时有时被称为*角括号*。\n\
  \n#### >= (大于或等于)\n\n`>=` 运算符在左侧的值大于或等于右侧的值时返回真\n\n点击此处查看代码图片\n\n```cpp\nprint(\
  \ 20 >= 10 ); // 输出: True\nprint( 10 >= 10 ); // 输出: True\nprint( 3.14f >= 1.23f\
  \ ); // 输出: True\nprint( 1.23f >= 3.14f ); // 输出: False\n```\n\n#### <= (小于或等于)\n\
  \n`<=` 运算符在左侧的值小于或等于右侧的值时返回真\n\n点击此处查看代码图片\n\n```cpp\nprint( 10 <= 20 ); // 输出:\
  \ True\nprint( 10 <= 10 ); // 输出: True\nprint( 1.23f <= 3.14f ); // 输出: True\nprint(\
  \ 3.14f <= 1.23f ); // 输出: False\n```\n\n***\n\n### 条件语句\n\n条件语句可以结合布尔值和比较运算符来控制程序的流。这意味着真值可以导致代码生成一个结果，而假值可以使其生成另一个结果。两种常见的条件语句形式是\
  \ `if` 和 `switch`。\n\n#### if 语句\n\n只有当括号 `()` 中的值评估为真时，`if` 语句才会执行其大括号 `{}` 中的代码。\n\
  \n点击此处查看代码图片\n\n```cpp\nif (true) {\n    print(\"第一个 if 语句的代码执行了。\");\n}\n\nif (false)\
  \ {\n    print(\"第二个 if 语句的代码执行了。\");\n}\n\n// 此代码的输出将是：\n// 第一个 if 语句的代码执行了。\n\
  ```\n\n第一个 `if` 语句大括号 `{}` 中的代码执行了，但第二个 `if` 语句大括号中的代码没有执行。\n\n\n\n包含在大括号中的语句在右大括号后不需要分号。其他所有涵盖的语句在末尾都需要一个分号：\n\
  \n点击此处查看代码图像\n\n```cpp\nfloat approxPi = 3.14159f; // 这里有标准分号\n```\n\n复合语句（即在大括号包围的语句）在右大括号后不需要分号：\n\
  \n点击此处查看代码图像\n\n```cpp\nif (true) {\n    print( \"Hello\" );  // 这一行需要分号。\n    print(\
  \ \"World\" );  // 这一行需要分号。\n}                    // 右大括号后不需要分号！\n```\n\n任何被大括号包围的复合语句也是如此。\n\
  \n## 将 if 语句与比较运算符和布尔运算符结合\n\n布尔运算符可以与 `if` 语句结合，以响应游戏中的各种情况：\n\n点击此处查看代码图像\n\n\
  ```cpp\nbool night = true;\nbool fullMoon = false;\n\nif (night) {\n    print( \"\
  It's night.\" );\n}\n\nif (!fullMoon) {\n    print( \"The moon is not full.\" );\n\
  }\n\nif (night && fullMoon) {\n    print( \"Beware werewolves!!!\" );\n}\n\nif (night\
  \ && !fullMoon) {\n    print( \"No werewolves tonight. (Whew!)\" );\n}\n\n// 这段代码的输出将是：\n\
  //     It's night.\n//     The moon is not full.\n//     No werewolves tonight.\
  \ (Whew!)\n```\n\n当然，`if` 语句也可以与比较运算符结合：\n\n点击此处查看代码图像\n\n```cpp\nif (10 == 10 )\
  \ {\n    print( \"10 is equal to 10.\" );\n}\n\nif ( 10 > 20 ) {\n    print( \"\
  10 is greater than 20.\" );\n}\n\nif ( 1.23f <= 3.14f ) {\n    print( \"1.23 is\
  \ less than or equal to 3.14.\" );\n}\n\nif ( 1.23f >= 1.23f ) {\n    print( \"\
  1.23 is greater than or equal to 1.23.\" );\n}\n\nif ( 3.14f != Mathf.PI ) {\n \
  \   print( \"3.14 is not equal to \"+Mathf.PI+\".\" );\n    // + 可用于字符串与其他数据类型连接。\n\
  \    // 当这种情况发生时，其他数据类型会被转换为字符串。\n}\n\n// 这段代码的输出将是：\n//     10 is equal to 10.\n\
  //     1.23 is less than or equal to 3.14.\n//     1.23 is greater than or equal\
  \ to 1.23.\n//     3.14 is not equal to 3.141593.\n```\n\n### 警告\n\n**避免在 if 语句中使用\
  \ =**\n如之前的警告中所提到的，`==` 是一个判断两个值是否相等的比较运算符。`=` 是一个赋值运算符，将值赋给变量。如果你无意中在 `if` 语句中使用了\
  \ `=`，结果将是赋值而不是比较。\n\n有时 Unity 会通过给出的出一个关于无法将值隐式转换为 `Boolean` 的错误来捕捉这一点。你将从这段代码得到该错误：\n\
  \n点击此处查看代码图像\n\n```cpp\nfloat f0 = 10;\nif (f0 = 10) {\n    print(\"f0 is equal\
  \ to 10.\");\n}\n```\n\n其他时候，Unity 实际上会给出一个警告，说明它在 `if` 语句中发现了 `=`，并询问你是否想输入 `==`。\n\
  \n## if...else\n\n很多时候，你可能希望在值为真时执行一个操作，在值为假时执行另一个操作。在这种情况下，会在 `if` 语句中添加一个 `else`\
  \ 子句：\n\n点击此处查看代码图像\n\n```cpp\nbool night = false;\nif (night) {\n    print( \"\
  It's night.\" );\n} else {\n    print( \"It's daytime. What are you about?\" );\n\
  }\n// 这段代码的输出将是：\n//     It's daytime. What are you about?\n```\n\n在这种情况下，由于 `night`\
  \ 为假，将执行 `else` 子句中的代码。\n\n## if...else...else\n\n也可能拥有一个 `else` 子句链：\n\n点击此处查看代码图像\n\
  \n```cpp\nbool night = true;\nbool fullMoon = true;\nif (!night) { // 条件 1 (false)\n\
  \    print( \"It's daytime. What are you about?\" );\n} else if (fullMoon) { //\
  \ 条件 2 (true)\n    print( \"Beware werewolves!!!\" );\n} else { // 条件 3\n    print(\
  \ \"It's night, but the moon is not full.\" );\n}\n// 这段代码的输出将是：\n//     Beware\
  \ werewolves!!!\n```\n\n一旦 `if...else if` 链中的任何一个条件为真，后续的条件将不再被评估。\n\n## 嵌套 if 语句\n\
  \n也可以在另一个 `if` 语句内部嵌套 `if` 语句来实现复杂的逻辑：\n\n点击此处查看代码图像\n\n```cpp\nbool night = true;\n\
  bool fullMoon = false;\nif (!night) {\n    print( \"It's daytime. What are you about?\"\
  \ );\n} else {\n    if (fullMoon) {\n        print( \"Beware werewolves!!!\" );\n\
  \    } else {\n        print( \"It's night, but the moon is not full.\" );\n   \
  \ }\n}\n// 这段代码的输出将是：\n//     It's night, but the moon is not full.```\n\n### switch\
  \ 语句\n\n`switch` 语句可以替代多个 `if...else` 语句，但它有一些局限性：\n\n1. switch 语句只能比较相等性。\n2. switch\
  \ 语句只能比较单个变量。\n3. switch 语句只能与字面量进行比较。\n\n这里有一个例子：\n\n点击此处查看代码图像\n\n```cpp\nint\
  \ num = 3;\nswitch (num) { // 括号中的 (num) 是被比较的变量\n    case (0): // 每个 case 都是与 num\
  \ 比较的字面量\n        print( \"The number is zero.\" );\n        break; // 每个 case 必须以\
  \ break 结束\n    case (1):\n        print( \"The number is one.\" );\n        break;\n\
  \    case (2):\n        print( \"The number is two.\" );\n        break;\n    default:\
  \ // 如果没有 case 为真\n        print( \"The number is more than two.\" );\n        break;\n\
  } // switch 以大括号结束\n// 这段代码的输出是：\n//     The number is more than two.\n```\n\n如果某个\
  \ case 与变量的值相同，则将执行该 case 中的代码，直到遇到 `break`。一旦计算机遇到 `break`，就会退出 switch，不再评估其他 case。如果两个\
  \ case 之间没有代码行，则允许一个 case “穿透”到下一个：\n\n点击此处查看代码图像\n\n```cpp\nint num = 4;\nswitch\
  \ (num) {\n    case (0):\n        print( \"The number is zero.\" );\n        break;\n\
  \    case (1):\n        print( \"The number is one.\" );\n        break;\n    case\
  \ (2):\n        print( \"The number is two.\" );\n        break;\n    case (3):\n\
  \    case (4):\n    case (5):\n        print( \"The number is a few.\" );\n    \
  \    break;\n    default:\n        print( \"The number is more than two.\" );\n\
  \        break;\n}\n// 这段代码的输出是：\n//     The number is a few.\n```\n\n在前面的代码中，如果\
  \ `num` 等于 3、4 或 5，输出将是 `The number is a few`。\n\n根据你对条件判断和 `if` 语句的了解，你可能会疑问何时使用\
  \ `switch` 语句，因为它们有许多局限性。它们经常被用于处理 `GameObject` 的不同可能状态。例如，如果你制作了一个玩家可以变成人、鸟、鱼或狼人的游戏，可能会有这样一段代码：\n\
  \n点击此处查看代码图像\n\n```cpp\nstring species = \"fish\";\nbool inWater = false;\n// 每个不同的物种类型移动方式都不同\n\
  public function Move() {\n    switch (species) {\n        case (\"person\"):\n \
  \           Run(); // 调用名为 Run() 的函数\n            break;\n        case (\"bird\"\
  ):\n            Fly();\n            break;\n        case (\"fish\"):\n         \
  \   if (!inWater) {\n                Swim();\n            } else {\n           \
  \     FlopAroundPainfully();\n            }\n            break;\n    }\n}\n```\n\
  \n\n\n\n```csharp\n    break;\n\ncase (\"wolverine\"):\n    Scurry();\n    break;\n\
  \ndefault:\n    print( \"Unknown species type: \"+species );\n    break;\n    }\n\
  }\n```\n\n在先述代码中，玩家（作为水中的鱼）将执行 `Swim()`。需要注意的是，这里的 `default` 用用来捕获任何 `switch` 语句尚未准备就的物种，它将对遇到的任何意料之外的物种输出信息。例如，如果\
  \ `species` 被设置为 `\"lion\"`，输出将是：\n\nUnknown species type: lion\n\n在先述代码语法中，你还看到了几个尚未定义的函数名称（例如，`Run()`、`Fly()`、`Swim()`）。第\
  \ 23 章，“函数与参数”涵盖了了如何创建你自己的函数。\n\n### 总结\n\n虽然布尔操作看起来可能有些枯燥，但它们构成了编程核心的很大部分。计算机程序充满了成百上千甚至上万个分支点，计算机可以在这些点执行某件事或另一件事，而这一切在某种程度上都归结为布尔值和比较。当你继续阅读本书时，如果你对代码中的任何比较感到困惑，可能想要经常返回这一节。\n\
  \n## 第 21 章：循环\n\n计算机程序通常设计为重复执行同一项任务。在一个标准的游戏循环中，游戏会在屏幕上绘制一帧，接收玩家的输入，考虑该输入，然后绘制下一帧，这种行为每秒至少重复\
  \ 30 次。\n\nC# 代码中的循环会导致计算机重复执行某些行为。这可以是任何操作，从遍历场景中的每个敌人并考虑每个人的 AI，到遍历场景中所有的物理对象并检查碰撞。到本章结束时，你将了解关于循环的所有必要知识，在下一章中，你将学习如何结合列表（Lists）和数组使用它们。\n\
  \n### 循环的类型\n\nC# 只有四种循环：`while`、`do...while`、`for` 和 `foreach`。在这些循环中，你使用 `for`\
  \ 和 `foreach` 的频率比其他的高得多，因为它们通常更安全，并且更能适应你在制作游戏时会遇到的挑战：\n\n- ![Image](img/00003.jpeg)\
  \ `while` 循环：最基础的循环类型。在每次循环之前检查条件以决定是否继续循环。\n- ![Image](img/00003.jpeg) `do...while`\
  \ 循环：与 while 循环类似，但在每次循环*之后*检查条件以决定是否继续循环。\n- ![Image](img/00003.jpeg) `for` 循环：一种包含初始语句、每次迭代时递增的变量以及结束结束的循环语句。这是最常用的循环结构。\n\
  - ![Image](img/00003.jpeg) `foreach` 循环：一种自动遍历可枚举对象或集合中每个元素的循环语句。本章包含了对 `foreach`\
  \ 的一些讨论，并在下一章将作为 C# 列表和数组讨论的一部分进行更广泛的介绍。\n\n### 设置项目\n\n在附录 A，“标准项目设置程序”中，详细的指令将告诉你如何为本书中的章节设置\
  \ Unity 项目。在每个项目的开始时，你还会看到一个类似于这里的侧边栏。请按照侧边栏中的说明创建本章节的项目。\n\n***\n\n####为本章节设置项目\n\
  \n按照标准项目设置程序，在 Unity 中创建一个新项目。关于标准项目设置程序的信息，请参见附录 A。\n\n- ![Image](img/00003.jpeg)\
  \ **项目名称：** Loop Examples\n- ![Image](img/00003.jpeg) **场景名称：** _Scene_Loops\n-\
  \ ![Image](img/00003.jpeg) **C# 脚本名称：** Loops\n\n将脚本 `Loops` 挂载到场景中的 Main Camera\
  \ 上。\n\n***\n\n### while 循环\n\n`while` 循环是最基础的循环结构。然而，这意味着它缺乏使用更现代形式循环的安全性。在我的编码中，我几乎从不用\
  \ `while` 循环，因为使用它可能会产生*无限循环*的危险。\n\n#### 无限循环的危险\n\n当程序进入一个循环且无法退出时，就会发生无限循环。让我们写一个看看会发生什么。在\
  \ MonoDevelop 中打开（通过双击项目面板中的）`Loops` C# 脚本，并添加以下加粗代码。\n\n点击此处查看代码\n\n```csharp\n\
  1 using UnityEngine;\n2 using System.Collections;\n3\n4 public class Loops : MonoBehaviour\
  \ {\n5\n6     void Start () {\n7         while (true) {\n8             print( \"\
  Loop\" );\n9         }\n10     }\n11\n12 }```\n\n通过 MonoDevelop 菜单栏选择 `File > Save`\
  \ 保存此脚本。完成后，返回 Unity 并点击 Unity 窗口顶部的三角形播放按钮。看没有任何事情发生……看如何*永远*没有任何事情发生？事实上，你可能不得不强制退出。\n\
  \n***\n\n#### 如何强制退出应用程序\n\n**Mac 上**\n通过以下步骤强制退出：\n1. 按 `Command-Option-Esc`。\n\
  2. 找到出现问题的应用程序。它的名称后面通常会跟着“(无响应)”。\n3. 点击该应用程序并强制退出。\n\n**Windows 上**\n通过以下步骤强制退出：\n\
  1. 按 `Shift+Control+Esc`。\n2. 找到出现问题的应用程序。\n3. 点击该应用程序并结束任务。\n\n你可能需要等待几秒钟才能退出。\n\
  \n如果你在 Unity 运行时强制退出，你将丢失上次保存以来所做的任何工作。由于必须保存 C# 脚本，这不是问题，但你可能需要重做未保存的场景更改。例如，在\
  \ _Scene_Loops 中，如果在添加 `Loops` 脚本后没有保存场景，你需要重新挂载它。\n\n***\n\n那么，那里发生了什么循环？为了发现这一点，观察\
  \ `while` 循环。\n\n```csharp\n7     while (true) {\n8         print( \"Loop\" );\n\
  9     ```\n\n只要括号内的条件为真，`while`\n\n循环内部都会重复执行。在第 7 行，条件始终为真，因此 `print( \"Loop\"\
  \ );` 将重复。\n\n但你可能会想，如果这一行无限重复，为什么你从未在控制台中看到打印“Loop”呢？尽管 `print()` 函数被调用了很多（在你决定强制退出之前可能调用了百万次），但你始终无法在控制台中看到输出，因为\
  \ Unity 被困在了无限 `while` 循环中，无法重绘 Unity 窗口（这需要发生才能看到控制台的变化）。\n\n#### 更有用的 while 循环\n\
  \n在 MonoDevelop 中打开 `Loops` C# 脚本并将其修改为如下：\n\n点击此处查看代码\n\n```csharp\n1 using UnityEngine;\n\
  2 using System.Collections;\n3\n4 public class Loops : MonoBehaviour {\n5\n6   \
  \  void Start () {\n7         int i=0;\n8         while ( i<3 ) {\n9           \
  \  print( \"Loop: \"+i );\n10        }\n11     }\n12 }```\n\n\n\n\n\n```cpp\n10\
  \         i++;      // 查看侧边栏关于自增和自减运算符\n11     }\n12 }\n13\n14 }\n```\n\n# 自增和自减运算符\n\
  \n在“更有用”的 `while` 循环代码列表的第 10 行，书中首次出现了自增运算符（`++`）。自增运算符将其后跟的变量的值加 1。因此，如果 `i=5`，那么\
  \ `i++;` 语句将把 `i` 的值设置为 `6`。\n\n还有自减运算符（`--`）。自减运算符会将变量的值减 1。\n\n### 提示\n在本章的大多数示例中，使用的迭代变量将命名为\
  \ `i`。程序员经常使用 `i`、`j` 和 `k` 变量名作为迭代变量（即循环中递增的变量），因此，它们很少用于任何其他代码情况。由于这些变量在各种循环结构中被频繁创建和销毁，通常你应该避免在其他任何地方使用\
  \ `i`、`j` 或 `k` 变量名。\n\n保存你的代码，回到 Unity 并点击 `Play`。这次，Unity 不会陷入死循环，因为 `while` 条件句（`i<3`）最终会变为假。该程序到控制台的输出（不包括\
  \ Unity 输出的所有额外内容）如下：\n\n```\nLoop: 0\nLoop: 1\nLoop: 2\n```\n\n这是因为它在每次 `while`\
  \ 循环迭代时都会调用 `print( i )`。需要注意的是，条件句会在循环每次迭代之前进行检查。\n\n### do...while 循环\n\n`do...while`\
  \ 循环的工作方式与 `while` 循环相同，不同之处条件句是在每次迭代之后检查的。这保证了循环至少运行一次。将代码修改如下：\n\n点击此处查看代码图像\n\
  \n```csharp\n1 using UnityEngine;\n2 using System.Collections;\n3\n4 public class\
  \ Loops : MonoBehaviour {\n5\n6     void Start () {\n7         int i=10;\n8    \
  \     do {\n9             print( \"Loop: \"+i );\n10            i++;\n11       \
  \ } while ( i<3 );\n12     }\n13\n14 }\n```\n\n确保你将 `Start()` 函数的第 7 行改为 `int i=10;`。尽管\
  \ `while` 条件永远为假（10 永远不小于 3），循环在测试第 11 行的条件句之前仍然经过一次迭代。如果 `i` 在这里像在 `while` 循环示例那样初始化为\
  \ `0`，控制台输出将相同，因此我们在第 7 行设置 `i=10` 是为了证明无论 `i` 的值如何，`do...while` 循环至少运行一次。在 `do...while`\
  \ 循环中，条件句之后必须放置分号（`;`），如第 11 行所示。\n\n保存此脚本并在 Unity 中尝试以查看结果。\n\n### for 循环\n\n在\
  \ `while` 和 `do...while` 示例中，我们需要声明并定义变量 `i`、递增变量 `i`，然后检查变量 `i` 的条件句；这些操作每一个都由单独语句完成。`for`\
  \ 循环在单行中处理所有这些操作。在 Loops C# 脚本中编写以下代码，然后在 Unity 中保存并运行。\n\n点击此处查看代码图像\n\n```csharp\n\
  1 using UnityEngine;\n2 using System.Collections;\n3\n4 public class Loops : MonoBehaviour\
  \ {\n5\n6     void Start() {\n7         for ( int i=0; i<3; i++ ) {\n8         \
  \    print( \"Loop: \"+i );\n9         }\n10    }\n11 }\n```\n\n此示例中的 `for` 循环向控制台面板发送的输出与之前的“更有用”\
  \ `while` 循环完全相同，但它使用的行数更少。`for` 循环的结构需要一个初始化句、一个条件句和一个迭代句才能有效。在先前的示例中，这三个句如下：\n\
  \n![图像](img/00107.jpeg)\n\n初始化句（`int i=0;`）在 `for` 循环之前执行。它声明并定义了一个作用域限于 `for` 循环局部的变量。这意味着变量\
  \ `int i` 在 `for` 循环完成后将不再存在。有关变量作用域的更多信息，请参见附录 B 的变量作用域，有用概念。\n\n条件句（`i<3`）在 `for`\
  \ 循环的第一次迭代之前检查（就像在 `while` 循环第一次迭代之前检查条件句一样）。如果条件句为真，则执行 `for` 循环大括号之间的代码。\n\n一旦\
  \ `for` 循环大括号之间的代码迭代完成，迭代句（`i++`）就会执行（即在执行完 `print( i );` 之后执行 `i++`）。然后再次检查条件句，如果条件句仍然为真，则再次执行括号中的代码，并再次执行迭代句。这种持续一直持续直到条件句为假，此时\
  \ `for` 循环结束。\n\n由于 `for` 循环强制包含这三个句中的每一个，且它们都在同一行，因此在处理 `for` 循环时更容易避免死循环。\n\n\
  #### 警告：不要忘记 for 语句中每个句之间的分号\n初始化句、条件句和迭代句之间必须用分号隔开，这一点至关重要。因为每一个都是独立的句，必须像 C# 中的任何其他句一样用分号结束。由于\
  \ C# 中的大多数行都必须以分号结束，`for` 循环中的独立句也必须是。\n\n#### 迭代句不必是递增\n虽然迭代句通常是如 `i++` 这样的递增语句，但它不必如此。任何操作都可以用于迭代句。\n\
  \n##### 自减\n最常见的替代迭代句之一是倒计数而不是递增计数。这通过在 `for` 循环中使用自减运算符来实现。\n\n点击此处查看代码图像\n\n```csharp\n\
  6     void Start() {\n7         for ( int i=5; i>2; i-- ) {\n8             print(\
  \ \"Loop: \"+i );\n9         }\n10    }\n```\n\n控制台面板的输出如下：\n\n```\nLoop: 5\nLoop:\
  \ 4\nLoop: 3\n```\n\n### foreach 循环\n\n`foreach` 循环类似于一种自动的 `for` 循环，可以用于任何可枚举对象。在\
  \ C# 中，大多数数据集合都是可枚举的，包括下一章将涵盖的 Lists 和数组以及字符串（字符的集合）。在 Unity 中尝试此示例。\n\n点击此处查看代码图像\n\
  \n```csharp\n1 using UnityEngine;\n2 using System.Collections;\n3\n4 public class\
  \ Loops : MonoBehaviour {\n5\n6     void Start() {\n7         string str = \"Hello\"\
  ;\n8         foreach(char chr in str ) {\n9             print( chr );\n10      \
  \  }\n11    }\n12\n13 }\n```\n\n控制台输出每次迭代打印字符串 `str` 中的单个字符，结果如下：\n\n```\nH\ne\n\
  l\nl\no\n```\n\n`foreach` 循环保证将遍历枚举对象的所有元素。在这种情况下，它遍历字符串 `\"Hello\"` 中的每个字符。`foreach`\
  \ 循环将在下一章讨论 Lists 和数组时进行进一步介绍。\n\n### 循环中的跳转语句\n\n跳转语句是任何导致代码执行跳转到代码另一个位置的语句。已经涵盖的一个示例是\
  \ `switch` 语句中每个 case 结尾的 `break` 语句。\n\n#### break\n`break` 语句也可以用于提前跳出任何循环结构。要查看示例，请将你的\
  \ `Start()` 函数修改如下：\n\n点击此处查看代码图像\n\n```csharp\n6     void Start() {\n7        \
  \ for ( int i=0; i<10; i++ ) {\n8             print( i );\n9         }\n10    }\n\
  ```\n\n\n\n\n\n```csharp\nif ( i==3 ) {\n    break;\n  }\n}\n}\n```\n\n请注意，在此代码列表中，第\
  \ 1–5 行以及仅包含一个右括号 `}` 的最后一行（原为第 13 行）已被省略了，因为它们与之前代码列表中的行相同。它们在你的 MonoDevelop 脚本中仍然存在，你只需要将上一个\
  \ `foreach` 代码列表中第 7–10 行的 `foreach` 循环替换为此代码列表的第 7–12 行即可。\n\n在 Unity 中运行此，你将得到此输出：\n\
  \n```\n0\n1\n2\n3\n```\n\n`break` 语句提前退出 `for` 循环。`break` 也可以用于 `while`、`do...while`\
  \ 和 `foreach` 语句。\n\n![Image](img/00108.jpeg)\n\n点击此处查看代码图片\n\n```csharp\nint i\
  \ = 3;\ndo {\n    print( i );\n    i--;\n    if ( i==1 ) break;      // 2\n} while\
  \ ( i > 0 );\n\nforeach (char c in \"Hello\") {\n    if (c == 'l') {         H\n\
  \        break;              e\n    }\n    print( c );\n}\n```\n\n后续列表中的数字指的是之前代码中右侧标记为\
  \ `// 1` 和 `// 2` 的行（这些行在之前的代码中为了强调已加粗处理）。\n\n**1.** 这一行显示了 `if` 语句的单行版本。如果只有一行，则不需要大括号。\n\
  \n**2.** 这段代码只输出 `3` 和 `2`，因为在循环的第二次迭代中，`i--` 递操作将 `i` 变为 `1`，然后第 11 行 `if` 语句的条件句为真并跳出循环。\n\
  \n花时间查看之前的每个代码示例，确保你理解为什么每个示例都会生成所示的输出。如果任何一个看起来很困惑，请将代码输入 Unity 然后使用调试器运行它。（调试器在第\
  \ 24 章“调试”中进行了详细解释。）\n\n### continue\n\n`continue` 用于强制程序跳过当前迭代的剩余部分并继续下一次迭代。\n\n\
  ![Image](img/00109.jpeg)\n\n在之前的代码中，任何当 `i%90 != 0`（即 `i/90` 的余数不为 0）时，`continue`\
  \ 都会导致 `for` 循环移动到下次迭代，跳过 `print( i );` 行。`continue` 语句也可以用于 `while`、`do...while`\
  \ 和 `foreach` 循环。\n\n### 模运算符\n\n`continue` 跳转语句代码列表的第 8 行是书中首次出现`模`运算符（`%`）。模（或\
  \ mod）返回返回一个数除以另一个数的余数。例如，`12%10` 将返回值 2，因为 12/10 的余数是 2。\n\n模运算也可以用于浮点数，因此 `12.4f%1f`\
  \ 将返回 0.4f，即 12.4 除以 1 的余数。\n\n### 总结\n\n理解循环是成为一名优秀程序员的关键元素之一。然而，如果现在并不是所有的内容都能完全理解，也没关系。一旦你开始在开发某些实际游戏原型中使用循环，它们对你来说就会变得清晰。只需确保你确实将每个代码示例输入\
  \ Unity 并运行它，以帮助你理解这些。\n\n此外请记住，在我的编码中，我最常用 `for` 和 `foreach`，很少或从不使用 `while` 和\
  \ `do...while`，因为存在无限循环的危险。\n\n在下一章中，你将学习数组（arrays）和列表（`Lists`），这是两种相似项目的可枚举、有序集合的形式，并且你将看到如何使用循环来遍历这些集合。\n\
  \n## 第 22 章 列表与数组\n\n本章涵盖了 C# 中供你使用的两种重要集合类型。这些集合允许你对多个项目进行分组操作。例如，你可以每帧遍历 `GameObjects`\
  \ 的 `List`，以更新它们的所有位置和状态。\n\n在本章结束时，你将理解这些集合类型是如何工作的，以及在各种情况下应该使用哪种。\n\n### C# 集合\n\
  \n集合是一组对象。集合是由单个变量引用的对象组。在通常情况下，有两种重要的类型：\n\n![Image](img/00003.jpeg) **数组 (Array)**：数组是最原始的。\n\
  \n![Image](img/00003.jpeg) **列表 (List)**：列表更灵活。\n\n### 设置项目\n\n按照标准设置，参见附录 A。\n\n\
  ![Image](img/00003.jpeg) **项目名称**\n\n![Image](img/00003.jpeg) **场景名称**\n\n### 列表\
  \ (List)\n\n每个 C# 脚本顶部的第一个 `using` 行提供了 Unity 的脚本支持。第二行 `using System.Collections`\
  \ 提供了 `ArrayLists` 的脚本；然而，`List` 类型实际上是 `System.Collections.Generic` 的。\n\n```csharp\n\
  using UnityEngine;\nusing System.Collections;\nusing System.Collections.Generic;\n\
  \npublic class ListEx : MonoBehaviour {\n```\n\n\n\n\n```csharp\npublic List<string>\
  \ sList; // 4\n\nvoid Start () {\n    sList = new List<string>(); // 5\n    sList.Add(\"\
  Experience\"); // 6\n    sList.Add(\"is\");\n    sList.Add(\"what\");\n    sList.Add(\"\
  you\");\n    sList.Add(\"get\");\n    sList.Add(\"when\");\n    sList.Add(\"you\"\
  );\n    sList.Add(\"didn't\");\n    sList.Add(\"get\");\n    sList.Add(\"what\"\
  );\n    sList.Add(\"you\");\n    sList.Add(\"wanted.\");\n    // This quote is from\
  \ my professor, Dr. Randy Pausch (1960-2008)\n\n    print(\"sList Count = +sList.Count);\
  \ // 7\n    print(\"The 0th element is: +sList[0]); // 8\n    print(\"The 1st element\
  \ is: +sList[1]);\n    print(\"The 3rd element is: +sList[3]);\n    print(\"The\
  \ 8th element is: +sList[8]);\n\n    string str = \"\";\n    foreach (string sTemp\
  \ in sList) { // 9\n        str += sTemp+\"\";\n    }\n    print(str);\n}\n```\n\
  \n下方列表中的数字指的是前述代码中右侧用 `#` 标记的行。\n\n1. `UnityEngine` 库启用了所有 Unity 特有的类和类型（例如 `GameObject`、`Renderer`）。在任何\
  \ C# 脚本中都必须包含它。\n2. 所有 C# 脚本开头的 `System.Collections` 库启用了 `ArrayList` 类型（其他类型）。`ArrayList`\
  \ 是另一种 C# 集合类型，与 `List` 类似，区别在于 `ArrayLists` 不限于单一数据类型。这提供了更大的灵活性，但我发现它比 `Lists`\
  \ 有更多的缺点（包括显著的性能损失）。\n3. `List` 集合类型是 `System.Collections.Generic` 的一部分，因此必须导入该库才能使用\
  \ `Lists`。你可以通过搜索“C# System.Collections.Generic”来了解更多信息。\n4. 这行声明了 `List<string>\
  \ sList`。所有泛型集合类型的名称后都跟着尖括号 `<>`，其中括着指定的数据类型。在这种情况下，`List` 是一个字符串列表。然而，泛型的强大之处在于它们可以用于任何数据类型。你可以轻松地创建\
  \ `List<int>`、`List<GameObject>`、`List<Transform>`、`List<Vector3>` 等。`List` 的类型必须在声明时指定。\n\
  5. 第 6 行对 `sList` 的声明使得 `sList` 成为可以存放字符串列表的变量名，但在第 9 行定义 `sList` 之前，它的值是 `null`（即它没有值）。在定义定义之前，任何向\
  \ `sList` 添加元素的尝试都会导致错误。`List` 定义必须在 `new` 语句中重复 `List` 的类型。新定义的 `List` 不包含任何元素，且\
  \ `Count` 为 0。\n6. `List` 的 `Add()` 函数向 `List` 中添加元素。这将字符串字面量 `\"Experience\"` 插入到\
  \ `List` 的第 0 个（读作 \"zeroth\"）元素中。关于零索引列表的信息，请参阅[列表和数组是零索引的]。\n7. `List` 的 `Count`\
  \ 属性返回一个 `int`，表示 `List` 中元素的数量。\n8. 第 25–28 行演示了括号访问（例如 `sList[0]`）的使用。括号访问使用方括号\
  \ `[]` 和一个整数来引用 `List` 或数组中的特定元素。括号之间的整数被称为“索引”（index）。\n9. `foreach`（在上一章介绍）经常与\
  \ `Lists` 和其他集合配合使用。就像 `string` 是字符的集合一样，`List<string> sList` 是字符串的集合。字符串变量 `sTemp`\
  \ 的范围限于 `foreach` 语句，因此一旦 `foreach` 循环完成，它将不再存在。由于 `Lists` 是强类型的（也就是说 C# 知道 `sList`\
  \ 是一个 `List<string>`），`sList` 的元素可以直接赋值给 `sTemp` 而不需要任何类型的转换。这是 `List` 集合优于非类型类型\
  \ `ArrayList` 类型的主要优势之一。\n\n上述代码的控制台输出将是以下行：\n\n```\nsList Count = 12\nThe 0th element\
  \ is: Experience\nThe 1st element is: is\nThe 3rd element is: you\nThe 8th element\
  \ is: get\nExperience is what you get when you didn't get what you wanted.\n```\n\
  \n### 列表和数组是零索引的\n\n列表和数组集合类型是零索引的，这意味着你可能认为的“第一个”元素实际上是元素 [0]。在整本书中，我将此元素称为第 0\
  \ 个或 “zeroth” 元素。\n\n对于这些示例，我们考虑伪代码集合 `coll`。“伪代码”不是来自任何特定编程语言的代码，而是用于更容易地解释概念性观点。\n\
  \n```\ncoll = [\"A\", \"B\", \"C\", \"D\", \"E\"]\n```\n\n`coll` 的 `count` 或 `length`\
  \ 为 5，元素的有效索引从 `0` 到 `coll.Count-1`（即 `0`、`1`、`2`、`3` 和 `4`）。\n\n```csharp\nprint(coll.Count);\
  \ // 5\nprint(coll[0]); // A\nprint(coll[1]); // B\nprint(coll[2]); // C\nprint(coll[3]);\
  \ // D\nprint(coll[4]); // E\n```\n\n如果你尝试访问超出范围的索引，将看到以下错误：\n\n```\nIndexOutOfRangeException:\
  \ Index out of range.\n```\n\n\n\n\n![Image](img/00003.jpeg) `sL.IndexOf(\"A\"):`\
  \ 在 `sL` 中查找参数 `\"A\"` 第一次出现的位置，并返回该元素的索引。由于 `\"A\"` 是 `sL` 的第 0 个元素，因此此调用返回 `0`。如果变量在\
  \ List 中不存在，则返回 `-1`。这是一个判断 List 是否包含某个元素的安全且快速的方法。\n\n![Image](img/00003.jpeg)\
  \ `sL.Insert(2, \"B.5\"):` 将第二个参数（`\"B.5\"`）根据第一个参数（`2`）指定的索引插入到 `sL` 中。这会将 List\
  \ 中随后的元素向前移动。在这种情况下，这会导致 `sL` 变为 `[ \"A\", \"B\", \"B.5\", \"C\", \"D\" ]`。第一个参数的有效索引值范围为\
  \ `0` 到 `sL.Count`。任何超出此范围的值都会导致运行时错误。\n\n![Image](img/00003.jpeg) `sL.Remove(\"\
  C\"):` 从列表中删除指定的元素。如果列表中恰好有两个 `\"C\"`，则只删除第一个。`sL` 变为 `[ \"A\", \"B\", \"D\" ]`。\n\
  \n![Image](img/00003.jpeg) `sL.RemoveAt(0):` 从列表中删除指定索引处的元素。由于 `\"A\"` 是列表的第 0 个元素，`sL`\
  \ 变为 `[ \"B\", \"C\", \"D\" ]`。\n\n## 将 List 转换为数组\n\n![Image](img/00003.jpeg) `sL.ToArray():`\
  \ 生成一个包含 `sL` 所有元素的数组。新数组的类型与 List 相同。返回一个包含元素 `[ \"A\", \"B\", \"C\", \"D\" ]`\
  \ 的新字符串数组。\n\n***\n\n要继续学习数组，请确保 Unity 播放已停止，然后取消勾检查器（Inspector）面板中 `ListEx (Script)`\
  \ 组件名称旁边的复选框，使 `ListEx` 脚本处于激活状态（如 图 22.1 所示）。\n\n![Image](img/00110.jpeg)\n\n**图\
  \ 22.1** 点击复选框以禁用 ListEx 脚本组件\n\n## 数组\n\n数组是最简单的集合类型，这使得它最快。数组不需要导入任何库（通过 `using`\
  \ 命令）即可工作，因为它们内置在 C# 核心中。此外，数组还有多维和锯形形式，这些非常有用。\n\n### 基础数组创建\n\n数组具有固定长度，必须在定义数组时确定。双击\
  \ Project 面板中的 `ArrayEx` C# 脚本，在 MonoDevelop 中打开它并输入以下代码：\n\n点击此处查看代码图像\n\n```csharp\n\
  1 using UnityEngine;\n2 using System.Collections;\n3\n4 public class ArrayEx : MonoBehaviour\
  \ {\n5     public string[]        sArray;                     // 1\n6\n7     void\
  \ Start () {\n8         sArray = new string[10];                     // 2\n9\n10\
  \            sArray[0] = \"These\";                     // 3\n11            sArray[1]\
  \ = \"are\";\n12            sArray[2] = \"some\";\n13            sArray[3] = \"\
  words\";\n14\n15            print( \"The length of sArray is: \"+sArray.Length );\
  \     // 4\n16\n17            string str = \"\";\n18            foreach (string\
  \ sTemp in sArray) {               // 5\n19                str += \"|\"+sTemp;\n\
  20            }\n21            print(str );\n22    }\n23 }\n```\n\n**1.** 与 List\
  \ 不同，C# 中的数组实际上并不是一个独立的数据类型；相反，它是通过在名称后添加方括号从任何数据类型构成的集合。上述代码中 `sArray` 的类型未声明为\
  \ `string`；它是 `string[]`，即多个 `strings` 的集合。注意，虽然 `sArray` 在这里声明为数组，但它的长度尚未定义。\n\n\
  **2.** 在这里，`sArray` 被定义为长度为 `10` 的 `string[]`。当定义数组时，其长度将用该数据类型的默认值元素填充。对于 `int[]`\
  \ 或 `float[]`，默认值是 `0`。对于 `string[]` 和其他数据类型（如 `GameObject[]`），数组的每个元素将填充为 `null`（表示未分配任何值）。\n\
  \n**3.** 标准数组不像 List 那样使用 `Add()` 方法，而是使用括号访问来为赋值以及从数组中检索值。\n\n**4.** 像其他 C# 集合那样使用\
  \ `Count`，数组使用 `Length` 属性。需要注意的是（如从前面的代码所示），`Length` 返回数组的整个长度，包括所有定义的元素（例如 `sArray[0]`\
  \ 到 `sArray[3]`）。\n\n**5.** `foreach` 对数组的工作方式与对其他 C# 集合一样。唯一的区别是数组可能包含空或 null 元素，而\
  \ `foreach` 会遍历它们。\n\n当你运行代码时，请确保已选中 `Main Camera`。这将允许你在 Inspector 面板的 `ListEx\
  \ (Script)` 组件中查看 `sArray`。代码输出如下：\n\n```\nThe length of sArray is: 10\n|These|are|some|words\n\
  ```\n\n### 数组中间的空元素\n\n数组允许的一种而 List 不允许的情况是在数组中间有空元素。修改前面的代码如下：\n\n点击此处查看代码图像\n\
  \n```csharp\n10   sArray[0] = \"These\";\n11   sArray[1] = \"are\";\n12   sArray[3]\
  \ = \"some\";\n13   sArray[6] = \"words\";\n```\n\n代码输出将变为：`|These|are||words`\n\
  \n从输出可以看出，`sArray` 现在在索引 `2`、`4`、`5` 和 `7` 处有空。只要索引（例如 `0`、`1`、`3` 和 `6`）在有效范围内，你就可以使用括号访问放置值。\n\
  \n尝试为超出数组范围的索引赋值（例如 `sArray[10] = \"oops!\"` 或 `sArray[99] = \"error!\"`）会导致运行时错误：\n\
  \n点击此处查看代码图像\n\n`OutOfRangeException: Array index is out of range.`\n\n将代码还原为：\n\
  \n点击此处查看代码图像\n\n```csharp\n10   sArray[0] = \"These\";\n11   sArray[1] = \"are\"\
  ;\n12   sArray[2] = \"some\";\n13   sArray[3] = \"words\";\n```\n\n### 空元素与 foreach\n\
  \n再次运行项目并查看输出，它已返回之前的状态：\n\n`|These|are|some|words||||||`\n\n`str += \"|\"+sTemp;`\
  \ 语句在数组的每个元素之前向 `str` 拼接（即添加）一个管道符 `|`。即使 `sArray[4]` 到 `sArray[9]` 仍然是默认值 `null`，它们也会\
  \ `foreach` 计数并遍历。这是一个使用 `break` 跳出语句的好机会。修改代码如下：\n\n点击此处查看代码图像\n\n```csharp\n18\
  \   foreach (string sTemp in sArray) {\n19       str += \"|\"+sTemp;\n20       if\
  \ (sTemp == null) break;\n21   }\n```\n\n新的代码输出为：`|These|are|some|words|`\n\n当 C#\
  \ 遍历 `sArray[4]` 时，它仍然会向 `str` 末尾拼接 `\"|\"+null`，但随后会检查 `sArray[4]`，发现它是 `null`，并跳出\
  \ `foreach` 循环，不再遍历 `sArray[5]` 到 `sArray[9]`。\n\n\n\n\n\n数组还有许多可用的属性和方法。这些是最常用的。所有这些项都引用以下数组，且是非累积的。\n\
  \n点击此处查看代码图像\n\n```csharp\nstring[] sA = new string[] { \"A\", \"B\", \"C\", \"\
  D\" };\n\n#### 结果数组：[ \"A\", \"B\", \"C\", \"D\" ]\n```\n\n在这里你看到的是数组初始化表达式，它允许在一行内完成数组的声明、定义和填充。注意，当使用数组初始化表达式时，数组的\
  \ `Length` 是根据大括号之间的元素数量推定的，不需要指定；事实上，如果你使用大括号来定义数组，就不能在数组声明中使用中括号指定一个与大括号内元素数量不同的长度。\n\
  \n## 属性\n\n![Image](img/00003.jpeg) `sA[2]`（括号访问）：返回数组中由参数（`2`）指定的索引处的元素。因为 `\"\
  C\"` 是 `sA` 的第二个元素，因此返回：`\"C\"`。\n\n如果索引参数在数组的有效范围之外（对于 `sA` 是 0 到 3），它将产生运行时错误。\n\
  \n![Image](img/00003.jpeg) `sA[1] = \"Bravo\"`（用于赋值的括号访问）：将 `=` 赋值运算符右侧的值分配给数组中的指定位置，替换之前的值。`sA`\
  \ 将变为 `[ \"A\", \"Bravo\", \"C\", \"D\" ]`。\n\n如果索引参数在数组的有效范围之外，它将产生运行时错误。\n\n![Image](img/00003.jpeg)\
  \ `sA.Length:` 返回数组的总容量。无论元素是否已赋值或为默认值，都会被计数。返回 `4`。\n\n## 静态方法\n\n这里的静态方法属于 `System.Array`\
  \ 类，可以作用于数组，赋予它们类似于 List 的功能。\n\n![Image](img/00003.jpeg) `System.Array.IndexOf(\
  \ sA, \"C\" )`：在 `sA` 中查找元素 `\"C\"` 的第一个实例，并返回该元素的索引。因为 `\"C\"` 是 `sA` 的第二个元素，因此返回\
  \ `2`。\n\n如果变量在数组中不存在，则返回 `-1`。这通常用于判断数组是否包含特定元素。\n\n![Image](img/00003.jpeg) `System.Array.Resize(\
  \ ref sA, 6 )`：这是一个调整数组长度的 C# 方法。第一个参数是数组实例的引用（这就是为什么需要 `ref` 关键字），第二个参数是新长度。`sA`\
  \ 将变为 `[ \"A\", \"B\", \"C\", \"D\", null, null ]`。\n\n如果第二个参数指定的 `Length` 比原始数组短，多余的元素将被剪裁。`System.Array.Resize(\
  \ ref sA, 2 )` 会导致 `sA` 变为 `[ \"A\", \"B\" ]`。`System.Array.Resize()` 不适用于多维数组。\n\
  \n## 将数组转换为 List\n\n![Image](img/00003.jpeg) `List<string> sL = new List<string>(\
  \ sA )`：这一行将创建一个 List `sL`，它复制 `sA` 的所有元素。\n\n也可以使用数组初始化表达式在一行内声明、定义并填充 List，但稍微有点复杂：\n\
  \n点击此处查看代码图像\n\n```csharp\nList<string> sL = new List<string>( new string[] { “A”,\
  \ “B”, “C” } );\n```\n\n这声明、定义并填充了一个匿名的新 `string[]` 数组，该数组被立即传递给 `new List<string>()`\
  \ 函数。\n\n***\n\n为了准备下一个示例，请点击 Main Camera 检查器面板名称旁边的复选框，禁用 `ArrayEx` 脚本。\n\n## 多维数组\n\
  \n创建具有两个或多个索引的多维数组是可能的，而且通常很有用。这意味着数组括号内不仅仅是一个索引数字，数组可以使用两个或多个。这对于创建一个二维网格非常有用，每个网格单元可以存放一个项目。\n\
  \n创建一个名为 `Array2dEx` 的新 C# 脚本并将其挂载到 Main Camera。在 MonoDevelop 中打开 `Array2dEx` 并输入以下代码：\n\
  \n点击此处查看代码图像\n\n```csharp\nusing UnityEngine;\nusing System.Collections;\n\npublic\
  \ class Array2dEx : MonoBehaviour {\n\n    public string[,] sArray2d;\n\n    void\
  \ Start () {\n\n        sArray2d = new string[4,4];\n\n        sArray2d[0,0] = \"\
  A\";\n        sArray2d[0,3] = \"B\";\n        sArray2d[1,2] = \"C\";\n        sArray2d[3,1]\
  \ = \"D\";\n\n        print( \"The Length of sArray2d is: \"+sArray2d.Length );\n\
  \    }\n}\n```\n\n代码将产生以下输出：`The Length of sArray2d is: 16`\n\n如你所示，尽管这是一个多维数组，`Length`\
  \ 仍然是一个单一的 int。这里的 `Length` 现在只是数组中元素的总数，因此程序员有责任跟踪数组的每个独立维度。\n\n现在，让我们为 `sArray2d`\
  \ 中的值创建一个格式化的输出。完成后，它应该看起来像这样：\n\n| A | | | B |\n| | | C | |\n| | | | | |\n| | D\
  \ | | | |\n\n如你所见，A 位于第 0 行、第 0 列（`[0,0]`），B 位于第 0 行、第 3 列（`[0,3]`），以此依此类推。要实现此功能，请在代码中添加以下加粗行：\n\
  \n点击此处查看代码图像\n\n```csharp\nprint( \"The Length of sArray2d is: \"+sArray2d.Length\
  \ );\n\nstring str = \"\";\nfor ( int i=0; i<4; i++ ) { // 1\n    for ( int j=0;\
  \ j<4; j++ ) { // 2\n        if (sArray2d[i,j] != null) {\n            str += sArray2d[i,j];\
  \ // 3\n        } else {\n            str += \" \"; // 4\n        }\n        str\
  \ += \"|\";\n    }\n    str += \"\\n\"; // 5\n}\nprint(str);\n```\n\n\n\n\n\n**图\
  \ 22.2** 在 `Console` 中点击输出消息会在下方展开视图。请注意，最近的一条 `Console` 消息的第一行也会显示在 `Unity` 窗口的左下角。\n\
  \n如如图所示，我们所做的花哨文本格式在 `Console` 格中并没有对齐得很好，因为它使用了非等宽字体（也就是说，在等宽字体中 `i` 的宽度与 `m` 不同，而在等宽字体中\
  \ `i` 和 `m` 的宽度相同）。你可以点击 `Console` 格中的任意行，并从菜单栏选择 `Edit > Copy` 来复制该数据，然后将其粘贴到另一个程序中。这是我经常这样做，我最常用它粘贴到文本编辑器中。（我更喜欢在\
  \ Mac 上使用 `TextWrangler` 或在 PC 上使用 `EditPad Pro`，两者都很强大。）\n\n`TextWrangler` 可以从\
  \ BareBones Software 免费获取：[`www.barebones.com`](http://www.barebones.com)。\n\n`EditPad\
  \ Pro` Just Great Software 提供免费试用：[`editpadpro.com`](http://editpadpro.com)。\n\n\
  你还应该意识到，`Unity Inspector` 格不显示多维数组。事实上，如果 `Inspector` 不知道如何正确显示变量，它将完全忽略它，因此即使是公共多维数组的名称也不会出现在\
  \ `Inspector` 格中。\n\n再次点击 Play 按钮停止 `Unity` 的运行（使其不再变为蓝色），然后使用 `Main Camera` `Inspector`\
  \ 禁用 `Array2dEx (Script)` 组件。\n\n### 交错数组 (Jagged Arrays)\n\n交错数组是“数组的数组”。这类似于多维数组，但它允许子数组具有不同的长度。我们将创建一个包含以下数据的交错数组：\n\
  \n| A | B | C | D |\n|---|---|---|---|\n| E | F | G | |\n| H | I | | |\n| J | |\
  \ | K |\n\n如你所见，第 0 行和第 3 行各包含四个元素，而第 1 行和第 2 行分别包含三个和两个元素。请注意，如第 3 行所示，允许空元素（null\
  \ elements）。事实上，整行为 null 也是可能的（尽管这会导致后续代码列表中的第 32 行报错，因为该代码并未设计用于处理 null 行）。\n\n\
  创建一个名为 `JaggedArrayEx` 的新 C# 脚本并将其挂载到 `Main Camera`。在 `MonoDevelop` 中打开 `JaggedArrayEx`\
  \ 并输入以下代码：\n\n```csharp\n1 using UnityEngine;\n2 using System.Collections;\n3\n\
  4 public class JaggedArrayEx : MonoBehaviour {\n5     public string[][] jArray;\
  \                 // 1\n6\n7     void Start () {\n8         jArray = new string[4][];\
  \             // 2\n9\n10         jArray[0] = new string[4];         // 3\n11  \
  \       jArray[0][0] = \"A\";\n12         jArray[0][1] = \"B\";\n13         jArray[0][2]\
  \ = \"C\";\n14         jArray[0][3] = \"D\";\n15\n16         // 这些行使用了单行初始化 // 4\n\
  17         jArray[1] = new string[] { \"E\", \"F\", \"G\" };\n18         jArray[2]\
  \ = new string[] { \"H\", \"I\" };\n19\n20         jArray[3] = new string[4];  \
  \       // 5\n21         jArray[3][0] = \"J\";\n22         jArray[3][3] = \"K\"\
  ;\n23\n24         print(\" Length of jArray is:\"+jArray.Length );   // 6\n25  \
  \       // 输出: Length of jArray is: 4\n26\n27         print(\" Length of jArray[1]\
  \ is:\"+jArray[1].Length );   // 7\n28         // 输出: Length of jArray[1] is: 3\n\
  29\n30         string str = \"\";\n31         foreach (string[] sArray in jArray)\
  \ {             // 8\n32             foreach(string sTemp in sArray ) {\n33    \
  \         if (sTemp != null) {\n34                 str += \" |\"+sTemp;        \
  \       // 9\n35             } else {\n36                 str += \" |  \";     \
  \             // 10\n37             }\n38         }\n39             str += \" |\
  \ \\n\";\n40         }\n41\n42         print(str);\n43 }\n```\n\n1. 第 5 行将 `jArray`\
  \ 声明为交错数组（也就是说，数组的数组）。`string[]` 是字符串集合，而 `string[][]` 是字符串数组集合（或 `string[]s`）的集合。\n\
  2. 第 8 行将 `jArray` 定义为长度为 4 的交错数组。注意，第二组括号是空的，表示子数组可以是任意长度。\n3. 第 10 行将 `jArray`\
  \ 的第 0 个元素定义为长度为 4 的字符串数组。\n4. 第 17 行和第 18 行使用了数组的单行形式。因为数组元素定义在大括号之间，因此不需要显式说明数组的长度（因此\
  \ `new string[]` 中的括号是空的）。\n5. 第 20–22 行将 `jArray` 的第 3 个元素定义为长度为 4 的 `string[]`，并仅填充了该\
  \ `string[]` 的第 0 个和第 3 个元素，留下了 1 和 2 为 null。\n6. 第 24 行输出 `Length of jArray is:\
  \ 4`。因为 `jArray` 是数组的数组（而不是多维数组），`jArray.Length` 只计算通过第一组括号可以访问的元素数量。\n7. 第 27 行输出\
  \ `Length of jArray[1] is: 3`。因为 `jArray` 是数组的数组，现在可以很容易确定子数组的 `Length`。\n8. 在交错数组中，`foreach`\
  \ 分别对数组和子数组运行。对 `jArray` 的 `foreach` 将遍历 `jArray` 中的四个 `string[]`（字符串数组）元素，而对其中任何一个\
  \ `string[]` 的 `foreach` 将遍历字符串。注意 `sArray` 是一个 `string[]`（字符串数组），而 `sTemp` 是一个字符串。\n\
  正如前面提到的，如果 `jArray` 的某一行为 null，第 32 行将抛出空引用错误。在这种情况下，`sArray` 将为 null，尝试在第 32 行对\
  \ null 变量运行 `foreach` 语句将导致空引用，即尝试引用一个空元素。`foreach` 语句将尝试访问 `sArray` 的数据如 `sArray.Length`\
  \ 和 `sArray[0]`。由于 null 数据没有元素或值，访问 `null.Length` 等会报错。\n9. 在键盘上，第 34 行的字符串字面量输入为：`\
  \ |`。\n10. 在键盘上，第 36 行的字符串字面量输入为：` | `。\n\n代码在 `Console` 中输出以下内容：\n\n```\nLength\
  \ of jArray: 4\nLength of jArray[1] is: 3\n| A | B | C | D |\n| E | F | G | |\n\
  | H | I | | |\n| J | | | K |\n```\n\n### 使用 for 循环代替 foreach 用于交错数组\n\n也可以根据数组和子数组的\
  \ `Length` 使用 `for` 循环。之前的 `foreach` 循环可以替换为以下代码：\n\n```csharp\n31 string str =\
  \ \"\";\n32 for (int i=0; i<jArray.Length; i++) {\n33     for (int j=0; j<jArray[i].Length;\
  \ j++) {\n34         str += \" |\"+jArray[i][j];\n35     }\n36     str += \" | \\\
  n\";\n37 }\n```\n\n这段代码产生的输出与之前显示的 `foreach` 循环完全相同。选择 `for` 还是 `foreach` 取决于情况。\n\
  \n### 交错列表 (Jagged Lists)\n\n关于交错集合的最后一点，也可以创建交错列表。一个字符串交错二维列表可以声明为 `List<List<string>>\
  \ jaggedStringList`。正如交错数组一样，子列表最初为 null，因此你必须在添加它们时对它们进行初始化，如下代码所示。与所有 List 一样，交错列表不允许空元素。\n\
  \n\n\n\n\n点击此处查看代码图片\n\n```csharp\nusing UnityEngine;\nusing System.Collections.Generic;\
  \ // 1\n\npublic class JaggedListTest : MonoBehaviour {\n\n    public List<List<string>>\
  \ jaggedList;\n\n    // Use this for initialization\n    void Start () {\n     \
  \   jaggedList = new List<List<string>>();\n\n        // Add a couple List<string>s\
  \ to jaggedList\n        jaggedList.Add( new List<string>() );\n        jaggedList.Add(\
  \ new List<string>() );\n\n        // Add two strings to jaggedList[0]\n       \
  \ jaggedList[0].Add (\"Hello\");\n        jaggedList[0].Add (\"World\");\n\n   \
  \     // Add a third List<string> to jaggedList, including data\n        jaggedList.Add\
  \ ( new List<string>( new string[] {\"complex\", \"initialization\"} ) ); // 2\n\
  \n        string str = \"\";\n        foreach (List<string> sL in jaggedList) {\n\
  \            foreach (string sTemp in sL) {\n                if (sTemp != null)\
  \ {\n                    str += \" |\"+sTemp;\n                } else {\n      \
  \              str += \" |  \";\n                }\n            }\n            str\
  \ += \" | \\n\";\n        }\n        print( str );\n    }\n\n}\n```\n\n**1.** 虽然所有的\
  \ Unity C# 脚本默认都包含了 `System.Collections`，但实际上它并不是必须的（尽管使用 `List` 时需要 `System.Collections.Generic`）。\n\
  \n**2.** 这是书中首次出现 ![Image](img/00112.jpeg) 代码续行符。当单行代码长度超过页面宽度时，书中会处处使用该字符。你不应该尝试输入这个\
  \ ![Image](img/00112.jpeg) 字符，它的存在是为了让你知道应该像没有换行一样继续写该单行。在没有制表符的情况下，第 21 行显示如下：\n\
  \n点击此处查看代码图片\n```csharp\njaggedList.Add(new List<string>(new string[] {\"complex\"\
  ,\"initialization\"}) );\n```\n代码在控制台中输出以下内容：\n\n点击此处查看代码图片\n```text\n| Hello |\
  \ World |\n| complex | initialization |\n```\n\n### 使用数组还是 List\n数组（array）和 `List`\
  \ 类型之间的主要区别如下：\n\n- `List` 具有灵活的长度，而 `array` 的长度难以改变。\n- `Array` 速度稍快，尽管在大多数情况下这种差异微乎其微。\n\
  - `Array` 允许多维索引。\n- `Array` 允许中间出现空元素。\n\n由于它们实现更简单且不需要思考（得益于灵活的长度），我倾向于更多地使用 `Lists`\
  \ 而数组。在游戏原型设计中确实如此，因为原型需要大量的灵活性。\n\n### 总结\n现在你已经掌握了 `Lists` 和 `arrays`，你就可以轻松地处理游戏中的大量对象了。例如，你可以回到第\
  \ 18 章的“Hello World: First Program”项目，并在 `CubeSpawner` 代码中添加一个 `List<GameObject>`，每当实例化一个新的立方体时，就将其添加到该列表中。这将让你拥有每个立方体的引用，允许你在创建它后对其进行操作。\n\
  \n### 总结\n在本次练习中，我们回到第 18 章的 Hello World 项目，并编写一个脚本将每个创建的立方体添加到名为 `gameObjectList`\
  \ 的 `List<GameObject>` 中。在立方体存在的每一帧中，它的比例都会缩小到上一帧大小的 95%。一旦立方体的缩放缩小到 0.1 或更小，它将从场景和\
  \ `gameObjectList` 中被删除。\n\n然而，如果我们在 `foreach` 循环遍历 `gameObjectList` 时从删除删除元素，会导致错误。为了避免这种情况，需要删除的立方体将临时存储在另一个名为\
  \ `removeList` 的 `List` 中，然后遍历该 `List` 将它们从 `gameObjectList` 中移除。（你会在代码中看到我的意思。）\n\
  \n打开你的 Hello World 项目并创建一个新场景（*File > Scene*）。将场景另存为 *Scene_3*。创建一个名为 *CubeSpawner3*\
  \ 的新脚本并将其挂到场景的主摄像上。然后，在 MonoDevelop 中打开 CubeSpawner3 并输入以下代码：\n\n点击此处查看代码图片\n```csharp\n\
  using UnityEngine;\nusing System.Collections;\nusing System.Collections.Generic;\n\
  \npublic class CubeSpawner3 : MonoBehaviour {\n    public GameObject cubePrefabVar;\n\
  \    public List<GameObject> gameObjectList; // 将持有所有的立方体\n    public float scalingFactor\
  \ = 0.95f; // 每个立方体每帧缩小的比例\n    public int numCubes = 0; // 实例化立方体的总数\n\n    //\
  \ Use this for initialization\n    void Start() {\n        // 初始化 List<GameObject>\n\
  \        gameObjectList = new List<GameObject>();\n    }\n\n    // Update 每帧调用一次\n\
  \    void Update () {\n        numCubes++; // 增加立方体数量\n        GameObject gObj =\
  \ Instantiate(cubePrefabVar) as GameObject; // 这些行为新立方体设置了某些值\n        gObj.name\
  \ = \"Cube\"+numCubes;\n        Color c = new Color(Random.value, Random.value,\
  \ Random.value);\n        gObj.renderer.material.color = c; // 给立方体一个随机颜色\n    \
  \    gObj.transform.position = Random.insideUnitSphere;\n        gameObjectList.Add(gObj);\
  \ // 将 gObj 添加到立方体列表\n\n        List<GameObject> removeList = new List<GameObject>();\
  \ // 这个 removeList 将存储应该从 gameObjectList 中移除的立方体\n\n        // 遍历 gameObjectList\
  \ 中的每个立方体\n        foreach (GameObject goTemp in gameObjectList) {\n           \
  \ // 获取立方体的缩放\n            float scale = goTemp.transform.localScale.x;\n      \
  \      scale *= scalingFactor; // 按 scalingFactor 缩小它\n            goTemp.transform.localScale\
  \ = Vector3.one * scale;\n\n            if (scale <= 0.1f) { // 如果缩放小于 0.1f...\n\
  \                removeList.Add(goTemp); // ...则添加到 removeList\n            }\n\
  \        }\n\n        foreach (GameObject goTemp in removeList) {\n            gameObjectList.Remove(goTemp);\n\
  \            Destroy(goTemp); // 销毁立方体\n        }\n    }\n}\n```\n\n\n\n\n5. `Random.insideUnitSphere`\
  \ 返回一个半径为 1（中心位于点 [0,0,0]）的球体内部的随机位置。这段代码使得立方体生成在 `[0,0,0]` 附近的随机位置，而不是全部生成在完全同一个点。\n\
  \n6. 如代码注释所示，`removeList` 将用于存储需要从 `gameObjectList` 中移除的立方体。这是必要的，因为 C# 不允许在遍历 `List`\
  \ 的 `foreach` 循环中间从 `List` 中移除元素（也就是说，无法在第 38–48 行遍历 `gameObjectList` 的 `foreach`\
  \ 循环中的任何地方调用 `gameObjectList.Remove()`）。\n\n7. 这个 `foreach` 循环遍历 `gameObjectList`\
  \ 中的所有立方体。注意，为 `foreach` 创建的临时变量是 `goTemp`。`goTemp` 也用于第 50 行的 `foreach` 循环，因此 `goTemp`\
  \ 在第 38 行和第 50 行都进行了声明。由于 `goTemp` 在每情况下都局部作用于对应的 `foreach` 循环，因此在同一个 `Update()`\
  \ 函数中多次声明该变量不会引起冲突。更多信息请参阅 `附录 B` 中的 `变量范围`。\n\n8. 第 41–43 行获取立方体的当前比例（通过获取其 `transform.localScale`\
  \ 的 x 维度），将比例乘以 95%，然后将 `transform.localScale` 设置为新值。将 `Vector3` 乘以 `float`（如第 43\
  \ 行所示）是将每个单独维度乘以相同的数字，因此 `[2,4,6] * 0.5f` 将产生 `[1,2,3]`。\n\n9. 如代码注释所述，如果新缩减的比例小于\
  \ `0.1f`，则立方体将被添加到 `removeList`。\n\n10. 第 50–54 行的 `foreach` 循环遍历 `removeList`，并将\
  \ `removeList` 中的任何立方体从 `gameObjectList` 中移除。由于 `foreach` 正在遍历 `removeList`，因此从\
  \ `gameObjectList` 中移除元素是完全没问题的。被移除的立方体 `GameObject` 在使用 `Destroy()` 命令销毁它之前仍然留在屏幕上。即使如此，它仍然存在于计算机内存中，因为它仍然\
  \ `removeList` 的一个元素。然而，由于 `removeList` 是作用于 `Update()` 函数的局部变量，一旦 `Update()` 函数完成，`removeList`\
  \ 将不再存在，随后任何仅存储在 `removeList` 中的对象也将被从内存中删除。\n\n保存你的脚本并返回 Unity。如果你想实际实例化任何立方体，必须从\
  \ Project 面板将*Main Camera Camera:CubeSpawner3 (Script)* 组件中的 `cubePrefabVar` 变量分配*立方体制体*（*Cube\
  \ Prefab*）。\n\n完成此操作后，在 Unity 中点击 Play，你应该看到许多立方体开始生成，就像在之前的 Hello World 版本中一样。然而，它们生成的颜色不同，会随着时间的推移而缩小，并最终被销毁（而不是像早期版本那样无限存在）。\n\
  \n由于 `CubeSpawner3` 代码通过 `gameObjectList` 跟踪每个立方体，它能够每帧修改每个立方体的比例，并在立方体比例小于 `0.1f`\
  \ 时销毁它。在 `0.95f` 的 `scalingFactor` 下，每个立方体需要 45 帧才能缩小到 <= 0.1f 的比例，因此 `gameObjectList`\
  \ 中的第 0 个立方体总是因为太小而被移除并销毁，`gameObjectList` 的 `Count` 保持在 45。\n\n### 继续后续\n\n在下一章中，你将学习如何创建和命名\
  \ `Start()` 和 `Update()` 以外函数。\n\n## 第 23 章 函数与参数\n\n**在本章中，你将学会利用函数的巨大力量。你将编写自定义函数，这些函数可以接受任何类型的变量作为输入参数，并返回单个变量作为函数的结果。我们还将探索函数输入参数的一些特殊情况，例如函数重载、可选参数和\
  \ `params` 关键字修符，这些都将帮助你编写出更高效、模块化、可重用且灵活的代码。**\n\n### 设置 Function Examples 项目\n\
  \n在 `附录 A`、`标准项目设置程序` 中，详细的指令将教你如何为本书中的章节设置 Unity 项目。在每个项目的开始处，你还会看到一个类似于这里的侧边栏。请按照侧边栏中的说明创建本章的项目。\n\
  \n***\n\n### 设置本章的项目\n\n按照标准项目设置程序，在 Unity 中创建一个新项目。有关标准项目设置程序的信息，请参阅 `附录 A`。\n\n\
  ![Image](img/00003.jpeg) **项目名称：** Function Examples\n\n![Image](img/00003.jpeg)\
  \ **场景名称：** *Scene_Functions*\n\n![Image](img/00003.jpeg) **C# 脚本名称：** CodeExample\n\
  \n将脚本 `CodeExample` 挂到场景中的 Main Camera 上。\n\n***\n\n### 函数的定义\n\n实际上从第一个 Hello World\
  \ 开始你就编写函数了，但直到现在，你一直在向 `Awake()`、`Start()` 和 `Update()` 等内置函数中添加内容。从现在起，你将编写自定义函数。\n\
  \n考虑函数的最佳方式是将其看作执行某些操作的代码块。例如，为了计算 `Update()` 被调用的次数，你可以创建一个带有以下代码的新 C# 脚本：\n\n\
  ```csharp\nusing UnityEngine;\nusing System.Collections;\n\npublic class CodeExample\
  \ : MonoBehaviour\n{\n    public int timesCalled = 0;\n\n    void Update()\n   \
  \ {\n        timesCalled++;\n        CountUpdates();\n    }\n\n    void CountUpdates()\n\
  \    {\n        string outputMessage = \"Updates:\"+timesCalled;\n        print(outputMessage);\
  \ // 输出: Updates:1\n    }\n}\n```\n\n1 声明了公共变量 `timesCalled` 并将其初始值定义为 0。因为 `timesCalled`\
  \ 被声明为 `CodeExample` 类内部但在任何函数之外的公共变量，因此它的作用域是 `CodeExample` 类，并且可以被类内的任何函数访问。\n\
  \n2 `timesCalled++` 递增（对其加 1）。\n\n3 第 10 行*调用*了函数 `CountUpdates()`。当你的代码调用函数时，会触发该函数的执行。\n\
  \n4 第 13 行*声明*了函数 `CountUpdates()`。声明函数与声明变量类似。`void` 是函数的返回类型（将在本章稍后部分介绍）。第 13–16\
  \ 行*定义*了该函数。第 13 行左大括号 `{` 到第 16 行右大括号 `}` 之间的所有代码行都是 `CountUpdates()` 定义的一部分。\n\
  \n\n\n\n\n### 5. 局部变量作用域\n第 14 行定义了一个名为 `outputMessage` 的局部字符串变量。由于 `outputMessage`\
  \ 是在函数 `CountUpdate()` 内定义的，其作用范围限于 `CountUpdate()`，这意味着 `outputMessage` 在函数 `CountUpdate()`\
  \ 外部没有值。关于变量作用范围的更多信息，请参阅附录 B 中的“变量作用范围”部分以及“有用概念”。\n\n第 14 行还将将 `outputMessage`\
  \ 定义为 `\"Updates: \"` 和 `numTimesCalled` 的拼接结果。\n\n### 6. 函数调用\n此处调用了 Unity 函数 `print()`，并传入了唯一的参数\
  \ `outputMessage`。这会将 `outputMessage` 的值打印到 Unity 控制台中。函数参数将在本章稍后部分介绍。\n\n在实践中，`CountUpdate()`\
  \ 并不是一个非常有用的函数，但它展示了本章涵盖的两个重要概念。\n\n![Image](img/00003.jpeg) **函数封装了操作：** 函数可以被视为几行代码的命名集合。每当调用该函数时，这些代码就会被执行。这一点通过第\
  \ 17 章中的“介绍我们的语言：C#”以及 `BuySomeMilk()` 示例得到了证明。\n\n![Image](img/00003.jpeg) **函数包含自己的作用域：**\
  \ 正如你在附录 B 的“变量作用范围”部分中所读到的，在函数内部声明的变量的作用范围限于该函数。因此，变量 `outputMessage`（声明在第 14 行）的作用范围仅限于函数\
  \ `CountUpdates()`。这可以表述为“outputMessage` 的作用域是 `CountUpdates()`”或“`outputMessage`\
  \ 是 `CountUpdates()` 的局部变量”。\n\n将 `outputMessage` 的作用域与公共变量 `numTimesCalled` 的作用域进行对比，后者的作用范围是整个\
  \ `CodeExample` 类，并可以被 `CodeExample` 中的任何函数使用。\n\n如果你在 Unity 中运行这段代码，你会看到 `numTimesCalled`\
  \ 每帧都会递增，并且 `CountUpdate()` 每帧都会被调用（这会将 `numTimesCalled` 的值输出到控制面板）。调用函数会导致其执行，当函数执行完毕，执行将返回到调用它的位置。因此，在\
  \ `CodeExample` 类中，每帧都会发生以下情况：\n\n1. 每一帧，Unity 引擎都会调用 `Update()` 函数（第 8 行）。\n2.\
  \ 然后，第 9 行增加 `numTimesCalled` 的值。\n3. 第 10 行调用 `CountUpdate()`。\n4. 执行随后跳转到第 13\
  \ 行 `CountUpdate()` 函数的开头。\n5. 执行第 14 行和第 15 行。\n6. 当 Unity 到达第 16 行 `CountUpdate()`\
  \ 的右大括号时，执行返回到第 10 行（即调用它的那行）。\n7. 执行继续到第 11 行。\n\n本章的其余部分将涵盖函数的简单用法和复杂用法，它是一些相当复杂概念的介绍。当你继续阅读书中后后的教程时，你将更好地理解函数是如何运作的，并为你自己的函数提供更多灵感，所以如果第一次读本章时有任何地方不理解，那没关系。你可以在多读一些书的内容后再回来查看。\n\
  \n***\n\n### 在 Unity 中使用本章的代码\n\n虽然本章的第一个代码列表包含了 `CodeExample` 类的所有行，但稍后的代码示例并没有全部包含。如果你想在\
  \ Unity 中实际运行本章的其余代码，你需要将它们封装在一个类内部。类将在第 25 章的“类”中进行详细介绍，但目前，你可以通过在本章列出的任何代码周围添加以下这些加粗的行来实现这一点：\n\
  \n点击此处查看代码图像\n\n```csharp\nusing UnityEngine;\nusing System.Collections;\n\npublic\
  \ class CodeExample : MonoBehaviour {\n{\n    // 代码列表将替换此注释\n}\n```\n```\n\n例如，如果没有这些加粗的行，本章的第一个代码列表看起来像这样：\n\
  \n点击此处查看代码图像\n\n```csharp\npublic int numTimesCalled = 0;\n\nvoid Update() {\n \
  \   CountUpdates();\n}\n\nvoid CountUpdates() {\n    numTimesCalled++;\n    print(\"\
  Updates: \" + numTimesCalled);\n}\n```\n\n### 参数与实参数\n\n有些函数是用空括号调用的，例如 `CountUpdate()`。其他函数可以在括号中传递信息，例如\
  \ `Say(\"Hello\")`。\n\n```csharp\npublic int numTimesCalled = 0;\n\nvoid Update()\
  \ {\n    CountUpdates();\n}\n\nvoid CountUpdates() {\n    numTimesCalled++;\n  \
  \  print(\"Updates: \" + numTimesCalled);\n}\n```\n\n```csharp\nvoid Update() {\n\
  \    Say(\"Hello\");\n}\n\nvoid Say(string sayThis) {\n    print(sayThis);\n}\n\
  ```\n\n1. 字符串 `sayThis` 被声明为函数 `Say()` 的参数变量。\n2. 当第 7 行调用 `Say()` 时，字符串字面量 `\"\
  Hello\"` 作为参数传递给函数 `Say()`，第 10 行随后将 `sayThis` 的值赋值为 `\"Hello\"`。\n\n\n\n\n\n```cs\n\
  void PrintGameObjectName(GameObject go) {\n    print(go.name);\n}\n\nvoid SetColor(Color\
  \ c, GameObject go) {\n    Renderer r = go.renderer;\n    r.material.color = c;\n\
  }\n```\n\n### 返回值\n\n除了通过参数接收值外，函数还可以返回一个值，这被称为函数的*结果*，如下代码列表第 13 行所示。\n\n点击此处查看代码图片\n\
  \n```cs\nvoid Awake() {\n    int num = Add(2, 5);\n    print(num); // 在控制台中打印数字\
  \ 7\n}\n\nint Add(int numA, int numB) {\n    int sum = numA + numB;\n    return(sum);\n\
  }\n```\n\n在这个示例中，`Add()` 函数有两个参数，即整数 `numA` 和 `numB`。当调用时，它会求传入的两个整数参数之和，然后返回结果。函数定义开头的\
  \ `int` 声明了 `Add()` 将返回一个整数作为结果。就像你必须为任何变量声明类型才能使其有用一样，你也必须声明函数的返回类型，以便在代码的其他地方使用它。\n\
  \n#### 返回 void\n\n我们目前为止编写的大多数函数返回类型都是 `void`，这意味着不能返回任何值。虽然这些函数不返回特定值，但在某些情况下你可能想在它们内部调用\
  \ `return`。\n\n在函数内部任何时候使用 `return`，它都会停止函数的执行，并将执行权返回到调用该函数所在的行。（例如，下方代码列表第 16\
  \ 行的 `return` 将执行权返回到第 9 行。）\n\n有时，从函数中返回以避免执行函数的剩余部分是有用的。例如，如果你有一个包含超过 100,000\
  \ 个 GameObject 的列表（例如下方代码列表中的 `reallyLongList`），并且你想将命名为“Phil”的 GameObject 移动到原点（`Vector3.zero`），但不在意执行任何其他操作，你可以编写这样一个函数：\n\
  \n点击此处查看代码图片\n\n```cs\npublic List<GameObject> reallyLongList; // 在 Unity 编辑器中定义\
  \    // 1\n\nvoid Awake() {\n    MoveToOrigin(\"Phil\"); // 2\n}\n\nvoid MoveToOrigin(string\
  \ theName) { // 3\n    foreach (GameObject go in reallyLongList) {\n        if (go.name\
  \ == theName) { // 4\n            go.transform.position = Vector3.zero; // 5\n \
  \           return; // 6\n        }\n    }\n}\n```\n\n**1.** `List<GameObject> reallyLongList`\
  \ 是一个非常长的 GameObject 列表，我们想象它已经在 Unity 检查器中被预定义了。因为在这个示例中我们必须想象这个预定义的 `List`，除非你自己定义了\
  \ `reallyLongList`，否则在 Unity 中输入这段代码将无法运行。\n\n**2.** 调用函数 `MoveToOrigin()` 时将字符串字面量\
  \ `\"Phil\"` 作为参数。\n\n**3.** `foreach` 语句遍历 `reallyLongList`。\n\n**4.** 如果找到了一个名为“Phil”的\
  \ GameObject……\n\n**5.** ……那么它就会被移动到*原点*，即位置 [0,0,0]。\n\n**6.** 第 16 行将执行返回到第 9\
  \ 行。这避免了遍历 `List` 的剩余部分。\n\n在 `MoveToOrigin()` 中，在你找到名为 Phil 的对象后，你真的不在乎检查其他的 GameObject，因此最好让函数短路并返回，而不是在这样做上浪费计算能力。如果\
  \ Phil 是列表中的最后一个 GameObject，你并没有节省任何时间；但如果 Phil 是第一个 GameObject，你就节省了大量时间。\n\n注意，当在返回类型为\
  \ `void` 的函数中使用 `return` 时，不需要括号。\n\n#### 适当函数命名\n\n正如你记得的，变量名应该具有足够的描述性，以小写字母开头，并使用驼峰命名法（每个单词边界处使用大写字母）。例如：\n\
  \n`int numEnemies;`\n\n`float radiusOfPlanet;`\n`Color colorAlert;`\n`string playerName;`\n\
  \n函数名也类似；但函数名应该都以大写字母开头，以便与代码中的变量区分开来。以下是一些良好的函数名：\n\n点击此处查看代码图片\n\n```cs\nvoid\
  \ ColorAGameObject(GameObject go, Color c) {...}\nvoid AlignX(GameObject go0, GameObject\
  \ go1, GameObject go2) {...}\nvoid AlignListX(List<GameObject> goList) {...}\nvoid\
  \ SetX(GameObject go, float eX) {...}\n```\n\n### 什么时候应该使用函数？\n\n函数是以后可复用形式封装代码和功能的完美方法。通常情况下，每当你需要编写相同的代码行两次以上时，定义一个函数来这样做就是良好的风格。让我们从一个包含一些重复代码的列表开始。\n\
  \n下方列表中的 `AlignX()` 函数接收三个 GameObject，计算它们在 X 方向上的平均位置，并将它们都设置到该位置：\n\n点击此处查看代码图片\n\
  \n```cs\nvoid AlignX(GameObject go0, GameObject go1, GameObject go2) {\n    float\
  \ avgX = go0.transform.position.x;\n    avgX += go1.transform.position.x;\n    avgX\
  \ += go2.transform.position.x;\n    avgX = avgX/3.0;\n    Vector3 tempPos = go0.transform.position;\n\
  \    tempPos.x = avgX;\n    go0.transform.position = tempPos;\n}\n```\n\n由于直接设置\
  \ `transform.position` 的 x、y 或 z 值的限制，`AlignX()` 函数第 12-20 行存在大量重复代码。输入这些内容非常繁琐，如果需要更改任何内容，将需要重复三次。这是编写函数的主要原因之一。在下方列表中，重复的行已被对新函数\
  \ `SetX()` 的调用所取代。\n\n**1.** 在第 12-14 行中，你可以看到我们如何处理 Unity 不允许直接设置的限制。相反，你必须先将位置赋值另一个变量（例如\
  \ `Vector3 tempPos`），然后更改该变量的 x 值，最后将整个 `Vector3` 复制回 `transform.position`。编写这些非常繁琐（如\
  \ 12-20 行所示），这就是为什么它应该被所示的 `SetX()` 函数替换。\n\n```cs\nvoid AlignX(GameObject go0,\
  \ GameObject go1, GameObject go2) {\n    float avgX = go0.transform.position.x;\n\
  \    avgX += go1.transform.position.x;\n    avgX += go2.transform.position.x;\n\
  \    avgX = avgX/3.0;\n    SetX(go0, avgX);\n    SetX(go1, avgX);\n    SetX(go2,\
  \ avgX);\n}\n\nvoid SetX(GameObject go, float eX) {\n    Vector3 tempPos = go.transform.position;\n\
  \    tempPos.x = eX;\n    go.transform.position = tempPos;\n}\n```\n\n\n\n\n\n在段改进后的代码列表中，之前代码中的第\
  \ 11 到 20 行被新函数 `SetX()` 的定义（第 16–20 行）以及对它的三次调用（第 11–13 行）所替换。如果我们需要对设置 `x` 值的方式进行任何更改，只需要在\
  \ `SetX()` 中修改一次，而不需要像在之前的代码列表中那样修改三次。虽然这是一个简单的示例，但我希望它能展示函数为我们程序员带来的强大力量。\n\n本章的剩余部分将介绍在\
  \ C# 中编写函数的更复杂且有趣的方法。\n\n## 函数重载 (Function Overloading)\n\n函数重载是一个高级术语，指的是 C# 函数能够根据传入的参数类型和数量表现出不同的行为。以下代码中的加粗部分演示了函数重载。\n\
  \n点击此处查看代码图像\n\n```csharp\n6    void Awake() {\n7        print( Add( 1.0f, 2.5f\
  \ ) );\n8        // ^ 输出: \"3.5\"\n9        print( Add( new Vector3(1, 0, 0), new\
  \ Vector3(0, 1, 0) ) );\n10       // ^ 输出 \"(1.0, 1.0, 0.0)\"\n11       Color colorA\
  \ = new Color( 0.5f, 1, 0, 1);\n12       Color colorB = new Color( 0.25f, 0.33f,\
  \ 0, 1);\n13       print( Add( colorA, colorB ) );\n14       // ^ 输出 \"RGBA(0.750,\
  \ 1.000, 0.000, 1.000)\"\n15   }\n16\n17     float Add( float f0, float f1 ) { //\
  \ 1\n18       return( f0 + f1 );\n19   }\n20\n21     Vector3 Add( Vector3 v0, Vector3\
  \ v1 ) { // 1\n22       return( v0 + v1 );\n23   }\n24\n25     Color Add( Color\
  \ c0, Color c1 ) { // 1\n26       float r, g, b, a;\n27       r = Mathf.Min( c0.r\
  \ + c1.r, 1.0f ); // 2\n28       g = Mathf.Min( c0.g + c1.g, 1.0f ); // 2\n29  \
  \     b = Mathf.Min( c0.b + c1.b, 1.0f ); // 2\n30       a = Mathf.Min( c0.a + c1.a,\
  \ 1.0f ); // 2\n31       return( new Color( r, g, b, a) );\n32   }\n```\n\n1. 此列表中有三个不同的\
  \ `Add()` 函数，每个都是根据 `Awake()` 函数中不同行传入的参数被调用的。当传入两个浮点数时，使用 `float` 版本的 `Add()`；当传入两个\
  \ `Vector3` 时，使用 `Vector3` 版本；当传入两个 `Colors` 时，使用 `Color` 版本。\n2. 在 `Add()` 的 `Color`\
  \ 版本中，特意注意不允许 `r`、`g`、`b` 或 `a` 超过 1，因为颜色的红、绿和 alpha 通道限制在 0 到 1 之间。这是通过使用 `Mathf.Min()`\
  \ 函数实现的。Mathf.Min()` 接受任意数量的参数并返回其中最小的一个。在之前的列表中，如果红色等于 `0.75f`，则红色通道将返回 `0.75f`；但如果绿色的和大于\
  \ `1.0f` 的任何数字，则将返回绿色值 `1.0f`。\n\n### 可选参数 (Optional Parameters)\n\n有时你希望函数具有可选参数，这些参数可以传递也可以省略：\n\
  \n点击此处查看代码图像\n\n```csharp\n6    void Awake() {\n7        SetX( this.gameObject,\
  \ 25 ); // 2\n8        print( this.gameObject.transform.position.x ); // 输出: \"\
  25\"\n9        SetX( this.gameObject ); // 3\n10       print( this.gameObject.transform.position.x\
  \ ); // 输出: \"0\"\n11   }\n12\n13   void SetX( GameObject go, float eX=0.0f ) {\
  \ // 1\n14       Vector3 tempPos = go.transform.position;\n15       tempPos.x =\
  \ eX;\n16       go.transform.position = tempPos;\n17   }\n```\n\n1. `float` 类型的\
  \ `eX` 定义为具有默认值 `0.0f` 的可选参数。\n2. 因为 `float` 可以存储任何整数值，所以将 `int` 传递给 `float` 是完全可以的。（例如第\
  \ 7 行的整数字面量 `25` 被传递给了第 13 行的 `eX`）。更准确地说，`float` 可以容纳很多整数。\n3. `float` `eX` 参数是可选的，不是必须，如第\
  \ 9 行所示。在 `SetX()` 函数中，如果你给参数赋一个默认值，编译器将认为该参数是可选的。第一次从 `Awake()` 调用时，参数被设置为 `25.0f`，覆盖了默认值\
  \ `0.0f`。然而，第二次调用时省略了 `eX` 参数，使其默认为 `0.0f`。可选参数位于任何必需参数之后。\n\n## params 关键字\n\n\
  `params` 关键字可以允许函数接受任意数量相同类型的参数。这些参数会被转换为类型的数组。\n\n点击此处查看代码图像\n\n```csharp\n6  \
  \  void Awake() {\n7        print( 1 ); // 输出: \"1\"\n8        print( 1, 2 ); //\
  \ 输出: \"3\"\n9        print( 1, 2, 3 ); // 输出: \"6\"\n10       print( 1, 2, 3, 4\
  \ ); // 输出: \"10\"\n11   }\n12\n13   int Add( params int[] ints ) {\n14       int\
  \ sum = 0;\n15       foreach(int i in ints) {\n16           sum += i;\n17      \
  \ }\n18       return( sum );\n19   }\n```\n\n`Add()` 现在可以接受任意数量的整数并返回它们的和。与可选参数一样，`params`\
  \ 列表需要放在函数定义中其他参数之后（这意味着你可以在 `params` 列表之前放置其他必需参数）。\n\n这也允许我们重写之前的 `AlignX()` 函数，以接受任意数量可能的\
  \ GameObject，如下代码列表所示。\n\n点击此处查看代码图像\n\n```csharp\n6void AlignX( params GameObject[]\
  \ goArray ) { // 1\n7    float sumX = 0;\n8    foreach (GameObject go in goArray)\
  \ { // 2\n9        sumX += go.transform.position.x; // 3\n10   }\n11   float avgX\
  \ = sumX / goArray.Length; // 4\n12\n13   foreach (GameObject go in goArray) { //\
  \ 5\n14       SetX(go, avgX);\n15   }\n16 }\n```\n\n\n\n\n有时候一个函数被设计为反复调用自己，这被称为递归函数。其中一个简单的例子就是计算一个数字的阶乘。\n\
  \n在数学中，`5!`（5 的阶乘）是该数字与其比它小的所有自然数的乘积。（自然数是大于 0 的整数。）\n\n`5! = 5 * 4 * 3 * 2 * 1\
  \ = 120`\n\n`0!=1` 是一个特殊情况，而且就我们的目的而言，负数的阶乘将为 0：\n\n`0! = 1`\n\n我们可以写一个递归函数来计算任何整数的阶乘：\n\
  \n点击此处查看代码图片\n\n```cpp\n6    void Awake() {\n7      print( Fac(-1) );   // 输出: \"\
  0\"\n8      print( Fac(0)  );    // 输出: \"1\"\n9      print( Fac(5)  );    // 输出:\
  \ \"120\"\n10 }\n\n11\n12 int Fac( int n ) {\n13     if (n < 0) {      // 这处理 n<0\
  \ 的情况\n14         return( 0 );\n15     }\n16     if (n == 0) {   // 这是“终止情况”\n17\
  \         return( 1 );\n18     }\n19     int result = n * Fac( n-1 );\n20     return(\
  \ result );\n21 }\n```\n\n当调用 `Fac(5)` 时（第 9 行），并且代码到达第 19 行，`Fac()` 将再次带有参数 `n-1`（即\
  \ 4）被调用，这个过程被称为递归。这种递归会继续调用四四次 `Fac()`，直到达到调用 `Fac(0)` 的情况。由于 `n` 等于 0，这命中了第 16\
  \ 行的终止情况，返回了 `1`。这个 `1` 被传回上一次递归的第 19 行，并与 `n` 相乘，其结果再次向上传递，直到所有 `Fac()` 的递归都结束，并最终将值\
  \ `120` 返回给第 9 行（并在那里打印）。所有这些递归 `Fac()` 调用的链运作如下：\n\n点击此处查看代码图片\n\n```\nFac(5)\n\
  5 * Fac(4)\n5 * 4 * Fac(3)\n5 * 4 * 3 * Fac(2)\n5 * 4 * 3 * 2 * Fac(1)\n5 * 4 *\
  \ 3 * 2 * 1 * Fac(0)\n5 * 4 * 3 * 2 * 1 * 1\n5 * 4 * 3 * 2 * 1\n5 * 4 * 3 * 2\n\
  5 * 4 * 6\n5 * 24\n120\n```\n\n真正理解这个递归函数中发生了什么的最佳方法是使用调试器进行探索，调试器是 MonoDevelop\
  \ 中的一个功能，允许你观察程序执行的每一步，并看到不同的变量如何受到你代码的影响。调试的过程是下一章的主题。\n\n### 总结\n\n在本章中，你已经看到了函数的威力以及你可以使用它们的许多不同方法。函数是任何现代编程语言的基石，你做的编程越多，就越会发现它们是多么强大且必要的。第\
  \ 24 章《调试》展示了如何在 Unity 中使用调试工具。这些工具旨在帮助你发现代码中的问题，但它们对于理解你的代码如何工作也非常有用。在从下一章学习了调试之后，我建议返回这一章，更详细地检查\
  \ `Fac()` 函数。当然，请随时使用调试器来探索并更好地理解这里的任何函数。\n\n## 第 24 章 调试\n\n对于初学者来说，调试可能看起来有点像是一门黑术。相反，它实际上是你能拥有的最好的技能之一，尽管它很少教给初学者，我认为这是一个悲剧性的机会流失。所有初级程序员都会犯错，而了解调试将使你能够比仅仅盯着代码并希望\
  \ bug 自动显现快地发现并纠正这些错误。\n\n在本章结束时，你将理解编译时错误和运行时错误之间的区别，你将知道如何在代码中设置断点，并且将知道如何逐行执行程序，以帮助你根除那些难以发现的\
  \ bug。\n\n### 开始调试\n\n在我们开始寻找 bug 之前，我们需要做一些准备。对于本章，我们将从为第 18 章创建的项目——Hello World：你的第一个程序开始。如果你手头没有那个项目，可以从这个网站下载：[`bookotools.net/`](http://bookotools.net/)\n\
  \n在网站上，找到这个第 24 章《调试》，并点击下载章节初的项目。在本章中，我指示你故意制造一些 bug。这看起来可能是一种很奇怪的方法，但我这样做的目标是让你在追踪和修复你在处理\
  \ Unity 时几乎肯定会遇到的各种类型的 bug 和其他错误方面获得一些经验。\n\n> 在整个章节中，我所指的是发生在特定行号上的错误。有时这与你得到的错误行号完全相同，有时可能会向上或向下偏移几行。如果你的行号与我的不完全相同，不要担心，只需寻找我在这些行号附近正在讨论的内容即可。\n\
  \n#### 编译时 bug\n\n编译时 bug（或错误）是 Unity 在编译 C# 代码时可以发现的问题（也就是说，尝试解释 C# 代码并将其转换为通用中间语言，然后该语言再被转换为可以在你的计算机上运行的机器语言）。在\
  \ Unity 中打开 Hello World 项目后，按照这些说明故意导致编译时错误并探索它们是如何工作的：\n\n1. 复制现有的 Scene_1。这样做：在\
  \ Project（项目）面板中点击 `Scene_1` 选中它，并从菜单栏中选择 `Edit > Duplicate`。Unity 非常擅长计数，所以它会自动增加场景名称，将其命名为\
  \ `Scene_2`。\n2. 双击 `Scene_2` 在 Hierarchy（层级）和 Scene 面板中打开它。一旦打开，你的 Unity 窗口标题应该是\
  \ `Scene_2.unity - Hello World - PC, Mac & Linux Standalone*。如果你按下 Play，一切应该和之前的一样。\n\
  3. 现在我们应该为 `CubeSpawner` 类制作第二个版本，以免损坏 `Scene_1` 中的那个。点击 Project 面板中的 `CubeSpawner`\
  \ 脚本，然后从菜单栏中选择 `Edit > Duplicate`。将创建一个名为 `CubeSpawner1` 的脚本，错误会立即出现在 Console（控制台）面板中（见图\
  \ 24.1）。点击错误以获取更多信息。\n\n![Image](img/0113.jpeg)\n\n**图 24.1** 你的第一个 bug：Unity 捕获的编译时错误\n\
  \n错误消息中包含了大量有用信息，让我们逐条分析。\n\n`Assets/CubeSpawner1.cs(4,14):`\n\n你遇到的每个错误都会包含 Unity\
  \ 遇到错误的信息。这告诉我们错误位于项目文件夹下的 `CubeSpawner1.cs` 脚本中，第 4 行第 14 列。\n\n`error CS0101:`\n\
  \n消息的部分告诉我们遇到了什么样的错误。如果你遇到了你不理解的错误，可以在网上搜索“Unity error”和错误代码。（在这个例子中，我们的网络搜索是“Unity\
  \ error CS0101”。）这样的搜索几乎总是能找到你所遇到问题的论坛帖子或类似内容。根据我的经验，你通常会从 [`forum.unity3d.com`](http://forum.unity3d.com)\
  \ 和 [`answers.unity3d.com`](http://answers.unity3d.com) 获得良好的结果，而一些问题的最佳答案来自 [`stackoverflow.com`](http://stackoverflow.com)。\n\
  \n\n\n\n命名空间 `global::` 已经包含了 `CubeSpawner` 的定义。\n\n错误信息的最后一部分尝试用通俗易懂的英语解释错误。在这种情况下，它告诉我们\
  \ `CubeSpawner` 术语在代码的其他地方已经定义过了，事实确实如此。此时，`CubeSpawner` 和 `CubeSpawner1` 两个脚本都正尝试定义类\
  \ `CubeSpawner`。\n\n让我们开始修复这个问题：\n\n1. 双击 `CubeSpawner1` 以打开 MonoDevelop。（或者，你也可以双击控制台（Console）面板格中的错误消息，这将打开脚本并定位到产生错误的行。）\n\
  \n2. 在 `CubeSpawner1` 脚本中，将第 4 行（声明 `CubeSpawner` 的行）更改为：\n\n```csharp\npublic class\
  \ CubeSpawner2 : MonoBehaviour {\n```\n\n`CubeSpawner2` 类名故意与与脚本名称不同，以便我们稍后能看到另一个错误。\n\
  \n3. 保存文件并返回 Unity，你会发现控制台面板格中的错误消息消失了。\n\n每当你保存脚本时，Unity 都会检测到保存操作并重新编译脚本以确保没有错误。如果它确实遇到了\
  \ Bug，你将获得像我们刚刚修复的那样的编译错误消息。这些是最容易修复的 Bug，因为 Unity 确切知道问题发生的位置并将此信息传递给你。现在 `CubeSpawner`\
  \ 脚本正在定义类 `CubeSpawner`，而 `CubeSpawner1` 脚本正在定义类 `CubeSpawner2`，编译错误消失了。\n\n####\
  \ 分号导致的编译错误\n\n删除第 14 行末尾的分号（`;`），该行内容为：\n\n```csharp\n14      Instantiate( cubePrefabVar\
  \ );\n```\n\n这将导致另一个编译错误消息。\n\n```\nAssets/CubeSpawner1.cs(15,9): error CS1525:\
  \ Unexpected symbol ’}’\n```\n\n你会注意到它并没有说“嘿，你忘记写分号了”，但它确实告诉了编译脚本时遇到问题的地方（第 15 行的第\
  \ 9 个字符）。它还告诉你在一个意料之外的地方遇到了右括号（`}`）。根据这些信息，你应该能够查看代码该区域并发现缺失的分号。\n\n在第 14 行末尾重新加上分号并保存，Unity\
  \ 就会停止报错。编译错误几乎总会在问题所在行或后续行被检测到。在这个示例中，缺失的分号在第 14 行，但问题是在第 15 行发现的。\n\n#### 挂载和移除脚本\n\
  \n回到 Unity，尝试将 `CubeSpawner1` 脚本拖到层级面板（Hierarchy）中的 `Main Camera` 上。这一次，你会得到图 24.2\
  \ 所示的错误。\n\n![Image](img/00114.jpeg)\n\n**图 24.2** 某些错误在你尝试将脚本附加到 GameObject 时才会被捕捉。\n\
  \nUnity 正在报错是因为我们的脚本名称 `CubeSpawner1` 与我们在脚本中定义的类名 `CubeSpawner2` 不匹配。在 Unity 中，当你创建一个扩展自\
  \ `MonoBehavior` 的类时（例如 `CubeSpawner2 : Monobehaviour`），类名必须与定义它的文件名匹配。\n\n要修复此，只需确保这两个名称匹配。在项目面板（Project）格格中点击一次\
  \ `CubeSpawner1` 选中它，然后再次点击名称进行重命名。（你也可以在 Mac 上按 Return 键或在 Windows 上按 F2 键来重命名脚本。）将名称更改\
  \ `CubeSpawner2` 并再次尝试将其附加到 `Main Camera`。这一次，它应该可以顺利运行。\n\n点击层级面板中的 `Main Camera`。在检查器（Inspector）中，你现在应该看到\
  \ `Main Camera` 同时挂载了 `CubeSpawner` 和 `CubeSpawner2` 脚本。点击检查器中 `Cube Spawner (Script)`\
  \ 名称右侧的小齿轮图标，从下拉菜单中选择“Remove Component”，如图 24.3 所示。\n\n![Image](img/00115.jpeg)\n\
  \n**图 24.3** 移除额外的 CubeSpawner 脚本组件\n\n这样，我们就不会有两个不同的脚本尝试同时生成立方。在接下来的几个章节中，我们将为每个\
  \ GameObject 只挂载一个脚本组件。\n\n#### 运行时错误\n\n现在，点击播放，你会遇到另一种类型的错误（参见图 24.4）。点击暂停按钮暂停播放（播放按钮旁边带有两条竖线的按钮），我们来看这个错误。\n\
  \n![Image](img/00116.jpeg)\n\n**图 24.4** 相同运行时错误的多次重复\n\n这是一个*运行时错误*（runtime error），这意味着它是只有在\
  \ Unity 尝试运行项目时才会发生的错误。当从编译器的角度判断输入完全正确，但代码实际运行时某些地方不对，就会发生运行时错误。\n\n你会发现这个错误与你之前看到的其他错误略有不同。首先，错误消息的开头不包含错误发生位置的信息。（注：原文此处存在大量重复的错误描述，已根据翻译要求进行处理）。\n\
  \n\n\n\n除了我们在本章已经探索过的自动代码检查工具外，Unity 和 MonoDevelop 还允许你逐行单步代码，这对于理解代码中正在发生什么非常有帮助。请将以下代码列表中的加粗行（（即第\
  \ 13 行和第 16–26 行）添加到你的 `CubeSpawner2` 脚本中。如果你需要为脚本留出空间，只需按 `Return` 键（Windows 键盘上按\
  \ `Enter` 键换行）。代码也如图 24.5 所示：\n\n点击此处查看代码图像\n\n```csharp\n1 using UnityEngine;\n\
  2 using System.Collections;\n3\n4 public class CubeSpawner2 : MonoBehaviour {\n\
  5     public GameObject cubePrefabVar;\n6\n7     // Use this for initialization\n\
  8     void Start () {\n9     }\n10\n11     // Update is called once per frame\n\
  12     void Update() {\n13         SpellItOut();                               \
  \             // 1\n14         Instantiate( cubePrefabVar );\n15     }\n16\n17 \
  \    public void SpellItOut () {                                  // 2\n18     \
  \    string sA = \"Hello World!\";\n19         string sB = \"\";\n20\n21       \
  \  for (int i=0; i<sA.Length; i++) {                   // 3\n22             sB +=\
  \ sA[i];                                    // 4\n23         }\n24\n25         print(sB);\n\
  26     }\n27 }\n```\n\n**1.** 第 13 行调用了 `SpellItOut()`。\n**2.** 第 17–26 行声明并定义了函数\
  \ `SpellItOut()`。该函数将逐个字符将 `sA` 的内容复制到 `sB`。\n**3.** 这个 `for` 循环遍历 `sA` 的长度。因为 `\"\
  Hello World\"` 包含 11 个字符，循环将迭代 11 次。\n**4.** 第 22 行从 `sA` 中提取第 `i` 个字符并将其拼接到 `sB`\
  \ 的末尾。\n\n![Image](img/0017.jpeg)\n\n**图 24.5** `SpellItOut()` 函数显示在第 13 行上的断点。在这里，我们创建了一个名为\
  \ `SpellItOut()` 的函数，它将逐字母地将字符串 `sA` 复制到字符串 `sB`。这是一种极其复制字符串的方法，但它可以很好地演示调试器的工作原理。一旦你输入了代码并反复检查，点击第\
  \ 13 行左侧的行槽（如图 24.5 所示）。这将在此 13 行创建一个断点，它显示为一个红圈。当设置了断点且 MonoDevelop 正在调试 Unity\
  \ 时，Unity 每当遇到该断点时都会暂停执行。让我们检查一下。\n\n### 将调试器附加到 Unity\n\n* *\n\n### 警告\n\n**在启动项目之前附加调试器有时会导致\
  \ OS X 上的 Unity 崩溃！** 在编写本书时，OS X 上的 Unity 和 MonoDevelop 在已经附加了 MonoDevelop 的情况下点击\
  \ Unity 中的 Play 仍存在偶发性问题。Unity 已经知道了此问题，所以希望在你阅读本书时它已经解决，但万一没有解决，本节关于如何附加调试器的说明将引导你在\
  \ Unity 已经在运行后后再附加它，并在你想要停止和重新播放时随时取消附加并重新附加。如果你使用的是 PC（或者如果你在 OS X 上且觉得运气不错），你可以在点击\
  \ Unity 中的 Play 之前将调试器附加到 Unity，这样一切都应该运行正常。对于书中本节的小型项目，这在 OS X 上不应该是问题，但在大型项目中我偶尔遇到过这种情况。如果你遇到这个\
  \ bug，当你在没有 MonoDevelop 反应的情况下启动播放时，Unity 将冻结。Unity 和 MonoDevelop 都会变得无响应。要解决这个问题，你将像强制退出应用程序侧边栏解释的那样强制退出\
  \ Unity。\n\n* * * *\n\n### 如何强制退出应用程序\n\n**在 OS X 计算机上**\n通过执行以下操作实现强制退出：\n**1.**\
  \ 在键盘上按 `Command-Option-Esc`。这将弹出强制退出窗口。\n**2.** 在应用程序列表中找到运行异常的应用程序。它的名称后面通常会跟着“(未响应)”。\n\
  **3.** 点击该应用程序，然后点击“强制退出”。\n\n**在 Windows 计算机上**\n通过执行以下操作实现强制退出：\n**1.** 在键盘上按\
  \ `Shift+Ctrl+Esc`。这将打开 Windows 任务管理器。\n**2.** 找到运行异常的应用程序。\n**3.** 点击该应用程序，然后点击“结束任务”。\n\
  \n如果你必须在 Unity 运行时强制退出，你将丢失自上次保存以来进行的所有工作。由于你必须不断保存 C# 脚本，这些脚本应该不是问题，但你可能需要重做对场景进行的未保存的更改。\n\
  \n* * *\n\n为了让 MonoDevelop 能够调试 Unity 运行时发生的情况，你需要将其附加到 Unity 进程。一旦 MonoDevelop\
  \ 调试器附加到 Unity，它就能查看 Unity 中正在发生的情况。当 MonoDevelop 调试器附加到 Unity 后，它将能够查看 Unity 运行时正在发生的情况。由于前面提到的\
  \ Unity/MonoDevelop bug，最好先让 Unity 运行然后附加调试器。要这样做请遵循以下步骤：\n**1.** 点击 Unity 中的暂停\
  \ 按钮（位于 Play 按钮旁边）。\n**2.** 点击 Play 按钮。现在暂停按钮应该变成蓝色。\n**3.** 切换到 MonoDevelop 应用，点击\
  \ MonoDevelop 左上角的 Play 按钮（如图 24.6 所示）或从 MonoDevelop 菜单中选择 `Run > Attach to Process`。\n\
  \n![Image](img/0018.jpeg)\n\n**图 24.6** 点击此按钮将调试器附加到 Unity Editor\n\n这将弹出一个（见图 24.7），让你选择要调试的进程（在\
  \ Windows 机器上通常不出现 mono 进程）。列出的进程是 MonoDevelop 可以连接并调试的应用程序。通过此接口，Unity 可以控制其执行。\n\
  \n![Image](img/0019.jpeg)\n\n**图 24.7** 选择 Unity Editor 进程\n\n**4.** 点击 `Unity Editor\
  \ (Unity)` 进程，然后点击 `Attach` 按钮。这将导致 MonoDevelop 切换到调试模式并做好调试准备。这可能需要几秒钟，所以如果事情看起来卡住了，请不要担心。切换完成后，你会注意到\
  \ MonoDevelop 窗口发生了变化（见图 24.8）。左上角的 Play 按钮变成了 Stop 按钮，MonoDevelop 窗口底部出现了几个窗格，MonoDevelop\
  \ 窗口顶部出现了一些控制调试器的按钮（见图 24.9）。\n\n![Image](img/00120.jpeg)\n\n**图 24.8** 调试器在第 13\
  \ 行停止执行\n\n![Image](img/00121.jpeg)\n\n**图 24.9** 调试器控制按钮\n\n* * *\n\n### 注意\n\n\
  **我的 MonoDevelop 看起来可能不同** 在 MonoDevelop 中，你可以像在 Unity 中那样移动窗格（或面板）。我移动我的布局是为了方便你看到我在书中示例中的操作，但这可能意味着它与你在屏幕上看到的略有不同。你应该拥有所有的窗格，只是排列方式略有不同。\n\
  \n\n\n\n\n### 5. 现在我们已经准备好并连接了调试器，切换到 Unity 并点击暂停按钮来恢复 Unity。几乎立即，Unity 就会冻结，此时\
  \ `MonoDevelop` 应该弹出来。有时在 Windows 上上，`MonoDevelop` 不会自动弹出，但 Unity 看起来像是冻结了。只需手动切换到\
  \ `MonoDevelop` 任务，你就能看到图 24.8 中所示的内容。\n\n`Update()` 函数的执行已暂停在设置了断点的第 13 行。行槽中的黄色箭头显示当前的执行行。当执行在调试器中停止时，Unity\
  \ 进程会被完全冻结。这意味着在它再次运行之前，我们无法通过任何正常手段回到 Unity。\n\n在调试模式下，工具栏顶部的某些按钮发生了变化（参见图 24.9）。\n\
  \n接下来的步骤将向你展示各种调试器控制按钮是如何工作的。在执行这些步骤之前，我建议阅读侧边栏“在调试器中监视变量”。\n\n**1.** 点击 `MonoDevelop`\
  \ 中调试器的 `Run` 按钮（如图 24.9 所示）。这会导致 Unity 继续执行脚本。当 Unity 停止在像第 13 行这样的断点处时，Unity 的一切都会被冻结，直到你告诉它继续。\n\
  \n当你点击 `Run` 按钮时，Unity 开始重新运行，直到它遇到另一个断点。当你点击 `Run` 时，Unity 穿过了游戏循环，开始了一个新帧帧，然后再次停止在第\
  \ 13 行（当调用 `Update()` 时）。\n\n**注意**\n\n取决于你所拥有的计算机类型，你可能需要切换回 Unity 进程（即应用程序），Unity\
  \ 才能移动到下一帧。在某些机器上，当你使用 `MonoDevelop` 时，Unity 会继续进入下一帧，而在另一些机器上不会。如果你在点击运行后，调试器中的黄色箭头没有返回断点，请切换到\
  \ Unity 进程，它应该会开始下一帧然后再次停止在断点处。\n\n正如之前提到的，当代码在调试器中停止时（即你可以看到图 24.8 中所示的黄色箭头），你无法切换到\
  \ Unity 进程。这是正常的，因为当 Unity 等待你查看调试器中的代码时它是完全冻结的。当你不再调试时，Unity 将恢复正常功能。\n\n**2.**\
  \ 一旦黄色执行箭头再次停止在第 13 行断点处，点击 `Step Over`（逐行）按钮。黄色箭头将移动到第 14 行，而不进入函数 `SpellItOut()`。`SpellItOut()`\
  \ 函数仍会被调用并运行，但调试器会跳过它。如果你不想看到被调用的函数的内部运作，`Step Over` 就非常有用。\n\n**3.** 再次点击 `Run`。Unity\
  \ 将推进下一帧，黄色执行箭头将再次停止在第 13 行断点处。\n\n**4.** 这第三次，点击 `Step Into`（单步）。你会看到黄色箭头从第 13\
  \ 行跳转到 `SpellItOut()` 函数的第 18 行。每当你点击 `Step Into` 时，调试器都会进入任何被调用的函数，而 `Step Over`\
  \ 则会跳过它们。\n\n**5.** 现在你已经进入 `SpellItOut()` 函数内部，点击几次 `Step Over` 来走过 `SpellItOut()`\
  \ 函数的执行。\n\n**6.** 随着你继续点击 `Step Over`，你可以观察 `sA` 和 `sB` 在此函数过程的变化（参见侧边栏“在调试器中监视变量”）。每通过一次第\
  \ 21–23 行的 `for` 循环，都会从 `sA` 添加一个字符到字符串 `sB`。你可以在 `Locals`（局部变量）调试器面板中看到变量值的变化。\n\
  \n### 在调试器中监视变量\n\n任何调试器的强大优势之一都是能够在几乎任何时候查看单个变量的值。在 `MonoDevelop` 调试器中有三种可能的方法。在尝试这些方法之前，请确保你已经按照本章的指示启动了调试过程，并且黄色执行箭头当前暂停在调试器中的某行代码上。\n\
  \n第一种最简单的方法是将鼠标指针悬停在 `MonoDevelop` 代码面板中的任何变量上。如果你将鼠标指针停放在变量名上并保持静止 1 秒，就会出现工具提示，告诉你该变量的值。然而，非常重要的一，显示的值是基于黄色箭头位置的变量当前值，而不是该变量在代码中的位置。例如，`SpellItOut()`\
  \ 函数的变量 `sB` 在整个代码中重复出现，无论你悬停在哪一个 `sB` 上，都会显示 `sB` 的当前值。\n\n第二种方法是在调试器的 `Locals`\
  \ 面板中找到该变量。要查看此面板，请从 `MonoDevelop` 菜单栏中选择 `View > Debug Windows > Locals`。这将把 `Locals`\
  \ 变量监视面板带到前景。在这里，你将看到当前调试器可用的所有局部变量列表。如果你按照本章指示进入 `SpellItOut()` 函数，你将看到列出的局部变量：`this`、`sA`\
  \ 和 `sB`。变量 `sA` 和 `sB` 最初被设置为 `null`，但一旦它们分别在第 18 行和第 19 行被定义，它们的值就会出现在 `Locals`\
  \ 面板中。当你使用 `Step Over` 几次并到达调试器中的第 21 行时，你会看到整数 `i` 在该行被声明并定义。变量 `this` 指向 `CubeSpawner2`\
  \ 脚本的当前实例。点击 `this` 旁边的展开三角形以显示 `this` 内部公共字段 `cubePrefabVar` 以及名为 `base` 的变量。打开\
  \ `base` 旁边的展开三角形将显示与 `CubeSpawner2` 基类（`MonoBehaviour`）相关的所有变量。像 `MonoBehaviour`\
  \ 这样的基类（超类或父类）将在第 25 章中介绍。\n\n监视变量的第三种方法是将其显式地输入 `Watch` 面板。要将面板带到前景，请从菜单栏选择 `View\
  \ > Debug Windows > Watch`。在 `Watch` 面板中，点击一个空行来添加监视视变量。（点击带有“Click here to add\
  \ a new watch.”文本的字段。）在此字段中输入变量名称，`MonoDevelop` 将尝试显示其值。例如，输入变量 `this.gameObject.name`\
  \ 并按回车，它将显示“Main Camera”，即挂载此脚本的 GameObject 的名称。如果值太大而无法放入 `Watch` 面板，你可以点击值旁边的放大镜来阅读全部内容；这在处理大段文本字符串时有时会发生。\n\
  \n**7.** 如果黄色执行箭头仍在 `SpellItOut()` 内部，继续执行第 8 步；但如果你点击 `Step Over` 的次数足以让你退出 `SpellItOut()`\
  \ 函数，请点击 `Run`，然后点击 `Step Into` 以将执行返回 `SpellItOut()` 内部。\n\n**8.** 在仍在 `SpellItOut()`\
  \ 函数内部时，点击 `Step Out`（跳出）。这会导致调试器退出 `SpellItOut()` 函数并继续执行到第 14 行（调用 `SpellItOut()`\
  \ 之后的行）。这与 `return` 语句不同，因为 `SpellItOut()` 函数的剩余部分仍会被执行，只是你不在调试器中见证它。当你想要退出当前函数但不想完全通过点击\
  \ `Run` 回到全速执行时，这非常有用。\n\n\n\n\n\n最后，图 24.9 中显示的“分离进程”（Detach from Process）按钮会将\
  \ MonoDevelop 调试器与 Unity 进程分离，停止调试并让 Unity 回到正常执行。^(1) 你也可以点击 MonoDevelop 窗口左上角的巨大“停止”（Stop）按钮来与\
  \ Unity 进程分离并停止调试。\n\n^(1) 如果你确实遇到了本节开头警告中提到的“启动调试时崩溃”问题，你需要在每次在 Unity 中停止游戏后，断开并重新连接\
  \ MonoDevelop 调试器。否则，如果调试器仍处于连接状态，下次你在 Unity 中点击 `Play` 时可能会崩溃。\n\n我强烈建议使用调试器来检查第\
  \ 23 章末尾“函数与参数”中特色的递归 `Fac()` 函数的执行情况。该函数是演示调试器如何帮助你更好地理解代码的极佳示例。\n\n### 总结\n\n\
  关于调试的介绍就此结束。虽然在这个案例中我们没有使用调试器来发现 bug，但你可以看到它是如何帮助你更好地理解代码的。记住：每当代码中出现令你困惑的地方时，你都可以使用调试器逐行执行它。\n\
  \n虽然要求你生成这么多 bug 看起来可能让你有些沮丧，但我诚挚的希望是，通过帮助你体验并理解这些 bug 以及如何调查和修复它们，能让你在以后自己遇到真实的\
  \ bug 时占得优势。请记住，你始终可以在互联网上搜索 bug 的文本（或至少是错误代码）来寻找修复线索。正如我在章节开头所写的，良好的调试技能是帮助你成为既胜任又自信的程序员的要因素之一。\n\
  \n# 第 25 章：类\n\n**在本章结束时，你将理解如何使用类。类是单个 C# 对象中变量和函数的集合。类是现代游戏中（以及更广泛的面向对象编程中）中至关重要的构建块。**\n\
  \n### 理解类\n\n类将功能和数据结合。另一种表达方式是，类由函数和变量组成，当它们在类内部使用时，分别称为 `methods`（方法）和 `fields`（字段）。类通常用于表示游戏项目世界中的对象。例如，考虑标准角色扮演游戏中的角色。她可能拥有几个字段（或变量）：\n\
  \n点击此处查看代码图像\n\n```csharp\nstring name;          // 角色的名字\nfloat health;       \
  \  // 她拥有的血值量\nfloat healthMax;      // 她可能拥有的最大值\nList<Item> inventory; // 她背包中所有\
  \ Item 的列表\nList<Item> equipped;  // 她当前装备的 Item 列表\n```\n\n这些字段都适用于角色扮演游戏（RPG）中的任何角色，因为所有角色都有血量、装备和名字。还有几个方法（函数）可以被该角色使用或作用于该角色。（后续代码列表中的省略号\
  \ `[...]` 显示了需要添加哪些代码才能使函数生效。）\n\n点击此处查看代码图像\n\n```csharp\nvoid Move(Vector3 newLocation)\
  \ {...}      // 允许角色移动\nvoid Attack(Character target) {...}     // 攻击目标角色\nvoid\
  \ TakeDamage(float damageAmt) {...}  // 使该角色失去血量\nvoid Equip(Item newItem) {...}\
  \          // 将 Item 添加到装备列表中\n```\n\n显然，你会希望实际游戏中的角色拥有比这里描述多多的字段和方法，但核心思想是，你 RPG\
  \ 中的所有角色都需要这些变量和函数。\n\n> **提示**\n> 你已经在使用类了！事实上，尽管直到现在才明确指出，但你到为止在书中编写的每行代码都是类的一部分，通常情况下，你可以将创建的每个\
  \ C# 文件视为其自己的一个类。\n\n### 类的结构分析（以及 C# 脚本的结构）\n\n图 25.1 展示了许多类的几个重要元素。并不是所有元素在每个类中都是必要的，但它们非常常见。\n\
  \n![Image](img/00003.jpeg)\n\n**Includes**（引用）使得你的 C# 脚本可以使用各种集合。这些通过 `using` 语句启用。\n\
  \n**class declaration**（类声明）命名了你的类并决定它继承自什么。在这种情况下，`Enemy` 继承自 `MonoBehaviour`。\n\
  \n**Fields**（字段）是类的局部变量（名称开头的下划线会使其保持在 Project 板格的最上方）。\n\n**Methods**（方法）是类所执行的操作。**Virtual\
  \ functions**（虚函数）是可以被覆盖的特殊类型方法。\n\n**Properties**（属性）可以被认为通过 `get` 和 `set` 访问器伪装成字段的方法。\n\
  \n![Image](img/00122.jpeg)\n**图 25.1** 显示类的一些重要元素的图表\n\n### 建立敌人类项目\n\n附录 A,“标准设置程序”包含了如何为本章示例创建新\
  \ Unity 项目的信息。请遵循侧边栏的说明。\n\n#### 设置本章的项目\n\n按照标准项目程序，在 Unity 中创建一个新项目。标准项目程序的信息包含在附录\
  \ A 中。\n\n![Image](img/00003.jpeg)\n**项目名称：** Enemy Class Sample Project\n\n![Image](img/00003.jpeg)\n\
  **场景名称：** _Scene_0（场景名称开头的下划线会使其保持在 Project 板格的最上方。）\n\n![Image](img/00003.jpeg)\n\
  **C# 脚本名称：** 暂无\n\n你不需要为主摄像机挂载脚本。此项目中没有主摄像脚本。\n\n\n\n\n\n在 Project（项目）面板中，选择 `Create\
  \ > C# Script` 并将脚本命名为 `Enemy`。双击脚本在 MonoDevelop 中打开它，并输入以下代码（与图 25.1\n\n```csharp\n\
  using UnityEngine;                 // Unity 需要\nusing System.Collections;      \
  \   // Unity 自动包含\nusing System.Collections.Generic; // 如果你想使用 List 则需要\n\npublic\
  \ class Enemy : MonoBehaviour {\n\n    public float speed = 10f;      // 以米/秒为的速度\n\
  \    public float fireRate = 0.3f;  // 每秒射击（未使用）\n\n    // Update 每帧被调用一次\n    void\
  \ Update() {\n        Move();\n    }\n\n    public virtual void Move() {\n     \
  \   Vector3 tempPos = pos;\n        tempPos.y -= speed * Time.deltaTime;\n     \
  \   pos = tempPos;\n    }\n\n    void OnCollisionEnter( Collision coll ) {\n   \
  \     GameObject other = coll.gameObject;\n        switch (other.tag) {\n      \
  \  case \"Hero\":\n            // 目前未实现，但它会销毁英雄\n            break;\n        case\
  \ \"HeroLaser\":\n            // 销毁这个 Enemy\n            Destroy(this.gameObject);\n\
  \            break;\n        }\n    }\n\n    // 这是一个属性 (Property): 像字段一样的方法\n  \
  \  public Vector3 pos {\n        get {\n            return( this.transform.position\
  \ );\n        }\n        set {\n            this.transform.position = value;\n \
  \       }\n    }\n}\n```\n\n除了属性和虚拟函数（virtual function）之外，大部分内容对你来说应该直接且熟悉。这两者在本章中都会介绍。\n\
  \n### 属性 (Properties)\n\n你从之前的代码列表中可以看到，在 `Move()` 的第 16 行和第 18 行中，属性 `pos` 被处理得就像变量一样。这是通过使用\
  \ `get` 和 `set` 访问子句（accessor clauses）实现的，这些子句允许你在每次读取或设置属性时运行代码。每当读取 `pos` 属性时，`get`\
  \ 访问器中的代码就会运行，且 `get` 访问器必须返回与属性相同类型的值（即 Vector3）。每当为 `pos` 属性赋值时，`set` 中的代码就会运行，并且\
  \ `value` 关键字被用作隐式变量来存储赋值的值。换句话说，在第 18 行中，`pos` 被赋值为 `tempPos` 的值；然后在第 40 行，`tempPos`\
  \ 的值由变量 `value` 持并赋值给 `transform.position`。隐式变量不需要你显式声明即可存在。属性中所有的 `set` 子句都有 `value`。可以创建一个只包含\
  \ `get` 访问器（或仅包含 `set` 访问器）的属性，使属性变为只读（或只写）。在 `pos` 属性示例中，`pos` 仅仅是为了通过更少的输入量来访问\
  \ `transform.position`。然而，接下来的列表包含更有趣的示例。创建一个名为 `CountHigher` 的新 C# 脚本，将其挂载到球体上，并输入以下代码：\n\
  \n点击此处查看代码图像\n\n```csharp\nusing UnityEngine;\nusing System.Collections;\n\nclass\
  \ CountHigher : MonoBehaviour {\n    [SerializeField]\n    private int _num = 0;\n\
  \n    void Update() {\n        print(nextNum );\n    }\n\n    public int nextNum\
  \ { // 2\n        get {\n            _num++; // 将 _num 的值加 1\n            return(\
  \ _num ); // 返回 _num 的新值\n        }\n    }\n\n    public int currentNum { // 3\n\
  \        get { return( _num ); } // 4\n        set { _num = value; }\n    }\n}\n\
  ```\n\n1. 整数 `_num` 是私有的，因此它只能被 `CountHigher` 类的此实例访问。其他类和实例无法看到它。上一行的 `[SerializeField]`\
  \ 特性允许该私有变量在 Inspector（检查器）中可见并编辑。\n2. `nextNum` 是一个只读属性。因为没有 `set` 子句，它只能被读取（例如\
  \ `int x = nextNum;`），而不能被设置（例如 `nextNum = 5;` 将导致错误）。\n3. `currentNum` 是一个可以被读取也可以设置的属性。`int\
  \ x = currentNum;` 和 `currentNum = 5;` 都能工作。\n4. `get` 和 `set` 子句也可以写在一行内。注意在单行格式下，结束语句的分号（`;`）位于右大括号（`}`）之前，如第\
  \ 21 行所示。\n\n当你按下 Play 时，你会发现 Unity 每帧都会调用 `Update()` 函数，`print( nextNum );` 的输出每帧增加一次。前五帧的输出如下：\n\
  \n2\n3\n4\n5\n\n每当读取属性 `nextNum` 时（`print( nextNum`），它都会递增私有字段 `_num` 并返回新值（代码的第\
  \ 14 行和第 15 行）。虽然这是一个小示例，但可以使用 `get` 或 `set` 访问器执行任何普通方法可以做的事，甚至是调用另一个方法。同样，`currentNum`\
  \ 是一个允许你读取或设置 `_num` 值的属性。因为 `_num` 是私有字段，因此让属性 `currentNum` 公可用是有用的。\n\n#### 类实例是\
  \ GameObject 组件\n\n正如你在之前的章节中见过的，当你将一个 C# 脚本拖到 GameObject 上时，它就变成了该 GameObject 的组件。Transform、Rigidbody\
  \ 以及你在 Unity Inspector 中看到的其他元素都是 GameObject 组件。这意味着你可以通过 `GameObject.GetComponent<>()`\
  \ 获取挂载到 GameObject 上的任何类的引用，并将类类型放在尖括号中（见下方代码第 7 行）。创建一个名为 `MoveAlong` 的新 C# 脚本，并将其挂载到与\
  \ `CountHigher` 相同的 GameObject 上。将以下代码输入 `MoveAlong` 脚本：\n\n```csharp\nusing UnityEngine;\n\
  using System.Collections;\n\nclass MoveAlong : MonoBehaviour {\n\n    void LateUpdate()\
  \ { // 1\n        CountHigher cih=this.gameObject.GetComponent<CountHigher>(); //\
  \ 2\n        if (cih != null ) { // 3\n            float tX = cih.currentNum/10f;\
  \ // 4\n            Vector3 tempLoc = pos; // 5\n            tempLoc.x = tX;\n \
  \           pos = tempLoc;\n        }\n    }\n}\n```\n\n\n\n\n\n2. `cih` 是一个 `CountItHigher`\
  \ 类型的局部变量，这意味着它可以持有 `CountItHigher` 实例的引用，该实例是附加到 Sphere GameObject 上的组件。`GetComponent<CountItHigher>()`\
  \ 调用会寻找与此 `MoveAlong (Script)` 组件在同一个 Sphere GameObject 上的 `CountItHigher (Script)`\
  \ 组件。\n\n3. 如果你使用 `GetComponent<>()` 方法且请求的组件类型未挂载到 GameObject 上，`GetComponent<>()`\
  \ 将返回 `null`（一个表示那里没有任何内容的值）。在尝试使用 `cih` 之前，检查这一点是非常重要的。\n\n4. 虽然 `cih.currentNum`\
  \ 是一个 `int` 类型，但当它与 `float` 进行数学运算时（例如 `cih.currentNum/10f`）或赋值给 `float` 时（第 9 行也是），它会被自动视为\
  \ `float`。\n\n5. 第 10 行和第 12 行使用了第 16–19 行定义的 `pos` 属性。\n\n6. 这与 `Enemy` 类中的 `pos`\
  \ 属性实际上相同，但它使用单行来定义每个 `get{}` 和 `set{}` 子句。\n\n在每个 `LateUpdate`，这段代码都会找到此 GameObject\
  \ 的 `CountItHigher` 脚本组件，并从中获取 `currentNum`。然后脚本将 `currentNum` 除以 10，并将 GameObject\
  \ 的 x 轴设置为结果值（使用 `pos` 属性）。随着 `CountItHigher._num` 每帧的增加，GameObject 也会沿着 X 轴移动。在\
  \ Unity 中点击 Play 以观察此过程。在继续阅读本章节之前，请保存场景（从菜单栏中选择 `File > Save Scene`）。\n\n***\n\n\
  ### 警告\n\n**注意竞态条件！** 当任何两个事物相互依赖，但你不确定其中哪一个会先发生时，就会发生竞态条件。这就是为什么在在上一个示例中使用了 `LateUpdate()`。如果在\
  \ `MoveAlong` 中使用 `Update()`，将无法确定 Unity 会先调用 `CountItHigher` 中的 `Update()` 还是 `MoveAlong`\
  \ 中的 `Update()`，因此 GameObject 可能会在 `_num` 增加之前或之后移动，取决于先调用了哪个。通过使用 `LateUpdate()`，我们可以确保场景中所有的\
  \ `Update()` 都会先执行，然后是所有的 `LateUpdate()`。\n\n***\n\n### 类继承\n\n类扩展（或基于）其他类的内容。在章节的第一个代码列表中，`Enemy`\
  \ 继承自 `MonoBehaviour`，你到目前为止看到的所有类都是此类的。实现以下指令以让 `Enemy` 在你的游戏环境中运行，然后我们再进一步讨论这一点。\n\
  \n#### 实现 Enemy 类示例项目\n\n完成以下步骤：\n\n1. 创建一个新场景（从菜单栏选择 `File > New Scene`）。立即将其保存为\
  \ `Scene_1`。在场景中创建一个新球体（`GameObject > Create Other > Sphere`）并将其重命名为 `EnemyGO`（GO\
  \ 代表 GameObject）。这个新球体与 `Scene_0` 中的 Sphere 没有任何连接。（例如，它没有附加那两个脚本组件。）\n\n2. 使用 Inspector（检查器）中的\
  \ `Transform` 组件将 `EnemyGO` 的 `transform.position` 设置为 `[0,4,0]`。\n\n3. 从 Project\
  \ （项目面板）将你之前编写的 `Enemy` 脚本拖到 `Scene_1` 层级面板（Hierarchy 面板）中的 `EnemyGO` 上。你现在应该能看到\
  \ `Enemy (Script)` 作为 `EnemyGO` GameObject 的组件出现。\n\n4. 将 `EnemyGO` 从层级面板拖入 Project\
  \ 面板以创建一个名为 `EnemyGO` 的制体（Prefab）。如前面的章节所述，你会知道制体已成功创建，因为 Project 面板会出现一个带有蓝色框图标的名为\
  \ `EnemyGO`的项目，且层级面板中 `EnemyGO` GameObject 的名称将变为蓝色，表示它是 `EnemyGO` 制体的实例。\n\n5.\
  \ 通过从层级面板选择 `Create > Directional Light` 为场景添加一个方向光灯。\n\n6. 选择层级面板中的 `Main Camera`，并将其位置和相机设置设置为图\
  \ 25.3 中用绿色框高亮的内容：\n\n![Image](img/00003.jpeg) 将变换位置设为 `[0,-15,-10]`。\n\n![Image](img/00003.jpeg)\
  \ 将相机投影设为 `Orthographic`（正交投影）。\n\n![Image](img/00003.jpeg) 将相机大小设为 `20`。\n\n![Image](img/00124.jpeg)\n\
  \n**图 25.3** `Scene_1` 的相机设置及对应的 Game 窗口\n\n图 25.3 右侧显示的 Game 窗口应该与你现在通过相机看到的内容相似。\n\
  \n点击 Play。你应该看到 Enemy 实例以恒定速率屏幕向下移动。\n\n#### 父类与子类\n\n*父类*（Superclass）和*子类*（subclass）描述了两个类之间的关系，其中一个*继承*另一个。在我们的示例中，`Enemy`\
  \ 类继承自 `MonoBehaviour`，这意味着 `Enemy` 类不仅包含 `Enemy` C# 脚本的字段和方法，还包含父类 `MonoBehaviour`\
  \ 的所有字段和方法，以及 `MonoBehaviour` 继承的所有类。这就是为什么我们在 `Enemy` 中编写的任何 C# 脚本可以使用 `gameObject`、`transform`\
  \ 和 `GetComponent<>()`。\n\n```csharp\nusing UnityEngine;\nusing System.Collections;\n\
  \npublic class EnemyZig : Enemy\n{\n    public override void Move()\n    {\n   \
  \     Vector3 tempPos = pos;\n        tempPos.x = Mathf.Sin(Time.time * Mathf.PI\
  \ * 2) * 4;\n        pos = tempPos;\n        base.Move();\n    }\n}\n```\n\n\n\n\
  \n\n类将数据与功能相结合的能力使得开发者能够使用下一章中介绍的面向对象方法。面向对象编程让程序员能够将类类为可以独立移动和思考的对象，这种方法与 Unity\
  \ 基于 `GameObject` 的结构完美契合，并将帮助我们更轻松、更快速地制作游戏。\n\n# 第 26 章 面向对象思维\n\n本章涵盖了如何从面向对象编程（OOP）的角度进行思考，OOP\
  \ 是前一章所讨论的类的逻辑扩展。\n\n在本章结束时，你不仅将理解如何以 OOP 的方式思考，还将学习如何以最适合 Unity 开发环境的方式专门构建项目。\n\
  \n## 面向对象的比喻\n\n描述面向对象最简单的方法是通过比喻。想象一下鸟群中所有的鸟。鸟群可能由数百只甚至数千只鸟鸟组成，每只鸟在随群移动的同时，都必须避开障碍和其他鸟。鸟群表现出极其协调的行为，这种行为在多年以来一直是无法进行模拟的。\n\
  \n### 以单体化方式模拟鸟群\n\n在面向对象编程（OOP）出现之前，程序基本上是一个执行所有操作的单一大型函数。这个单一函数控制所有数据、移动每个对象，并处理从键盘输入到游戏逻辑到图形显示的所有事务。这现在被称为\
  \ `monolithic programming`（单体化编程），即试图通过一个巨大的函数来完成所有工作。\n\n当然，这是一种极端的简化，但它足以说明问题。\n\
  \n如果尝试以单体化方式来模拟鸟群，那么合理的做法是存储一个巨大的鸟类数组，然后创建一个程序，考虑鸟群中的每只鸟，并尝试为它们生成集群式的行为。该程序将在每一帧中逐个将每只鸟从其当前位置移动到下一帧的位置，并在数组中维护所有关于鸟的数据。\n\
  \n像这样的单体化程序会非常庞大、难以处理且难以调试。幸好的是，有更好的方法。\n\nOOP 采取了不同的方法，尝试模拟每只鸟及其感知和动作（这些都是其局部的）。这正是前一章中两个\
  \ `Enemy` 类示例所展示的内容。相比之下，如果用单体化方式实现，代码将是如下：\n\n```csharp\nusing UnityEngine;\nusing\
  \ System.Collections;\nusing System.Collections.Generic;\n\npublic class MonolithicEnemyController\
  \ : MonoBehaviour {\n    // The List of all enemies. This is populated in the Unity\
  \ inspector\n    public List<GameObject> enemies;                     // 1\n   \
  \ public float speed = 10f;\n\n    void Update () {\n        Vector3 tempPos;\n\n\
  \        foreach (GameObject enemy in enemies) {              // 2\n           \
  \ tempPos = enemy.transform.position;\n\n            switch (enemy.name) {     \
  \                     // 3\n                case \"EnemyGO\":\n                \
  \    tempPos.y -= speed * Time.deltaTime;\n                    break;\n        \
  \        case \"EnemyZigGO\":\n                    tempPos.x = 4 * Mathf.Sin(Time.time\
  \ * Mathf.PI*2);\n                    tempPos.y -= speed * Time.deltaTime;\n   \
  \                 break;\n            }\n        }\n    }\n}\n```\n\n\n\n\n\n##\
  \ 4. 从菜单栏中选择 `GameObject` > `Create Other` > `Cube`。将 `Cube` 拖到 `Fuselage` 下（使其成为\
