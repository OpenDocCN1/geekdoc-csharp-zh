  \ 点击播放（Play）。你应该能看到 52 张牌整齐地排列。它们还没有点数（pips），但它们已经出现了，并且带有正确的装饰器和颜色。现在让我们为点数和花牌（faces）添加代码。将以下内容添加到\
  \ `Deck` 类的 `MakeCards()` 方法中：\n\n点击此处查看图片\n\n```csharp\n// 创建卡牌 GameObjects\npublic\
  \ void MakeCards() {\n    ...\n    // 遍历所有刚刚创建的牌名\n    for (int i=0; i<cardNames.Count;\
