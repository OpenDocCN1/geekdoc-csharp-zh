  \    }\n}\n```\n\n保存并正确编译后，返回 Unity 从 `_Prefabs` 文件夹将 `_InventoryCamera` 拖入层级。它应该位于\
  \ `P:[-100,0,0] R:[0,0,0] S:[1,1,1]`。\n\n展开层级中 `_InventoryCamera` 旁的小三角形，然后将 `ElementButton`\
  \ 脚本附加到子对象 `0_Earth`、`1_Water`、`2_Air`、`3_Fire` 和 `5_None` 上。当你按下 Play 时，你应该看到每个\
  \ `ElementButton.type` 都由于 `Awake()` 方法进行了赋值。\n\n#### 调整两个相机\n\n如你所示，`_InventoryCamera`\
  \ 包含覆盖屏幕右侧 1/4 的相机并渲染在 `_MainCamera` 图像之上。这是由 `_InventoryCamera` Inspector 中的 `Viewport\
  \ Rect` 和 `Depth` 字段控制的。你可以在图 35.5 中看到 `_MainCamera` 和 `_InventoryCamera` 的 Inspector。`_InventoryCamera`\
  \ 的深度为 0，大于默认的 `_MainCamera` 深度 -1，因此 `_MainCamera` 在背景渲染。然而，`_MainCamera` 仍然位于屏幕中央，1/4\
  \ 的图像被 `_InventoryCamera` 遮挡。将 `_MainCamera` 的 `Viewport Rect` 设置为图 35.5 所示所示，`_MainCamera`\
  \ 现在将仅尝试填充屏幕左侧 3/4。这也可以为 `_MainCamera` 选择不同的背景颜色的好时机。（我建议在颜色选择器中使用 [R:48, G:64,\
  \ B:48]；Unity 会忽略背景颜色的 alpha 设置。）\n\n\n\n\n由于此原型是针对 iPad 设计的，因此主屏幕旨在以 4:3 的纵横比显示（原始\
  \ iPad 分辨率为 1024x768，而 iPad Air 和 iPad Mini Retina 的屏幕分辨率均为 2048x1536）。要查看这在 Unity\
  \ 中的效果，请从 Game 面板左上角的纵横比弹出菜单中选择 `4:3`。（如果你选择类似 16:9 的比例，你将在木制背包背景的两侧看到灰色条纹。）\n\n\
  你需要完成的最后一个调整是让 `Mage` 忽略屏幕右侧 1/4 处的任何点击或触摸。在 Hierarchy（层级）中选择 `Mage`，并将 `Mage` (Script)\
  \ 检查器中的 `activeScreenWidth` 字段设置为 `0.75`。\n\n### 选择元素\n\n正如你在 `ElementInventoryButton`\
  \ 的代码中所看到的，我们需要为 `Mage` 添加一个 `SelectElement()` 方法，该方法将选择一个元素并让它绕着 Mage 的头部旋转。然而，在在此此之前，我们需要创建\
  \ `Element` 类，并准备好将环绕 Mage 旋转的 `Element_Sphere` 游戏对象制体。在 `__Scripts` 文件夹中创建一个名为\
  \ `Element` 的新 C#脚本并输入以下代码：\n\n点击此处查看代码图片\n\n```csharp\nusing UnityEngine;\n\nusing\
  \ System.Collections;\n\npublic class Element : PT_MonoBehaviour {\n    public ElementType\
  \ type;\n}\n```\n\n如你见，这并不复杂，但它扩展了 `PT_MonoBehaviour` 类，这使我们能够访问修改 `Element.gameObjects`\
  \ 的几个快捷方法，并在每个制体上挂载一个名为 `type` 的 `ElementType` 字段。\n\n现在，在 Unity 的 Project（项目）面板中，在\
  \ `_Prefabs` 文件夹中找到四个 `Element_Spheres`。点击 `Element_Sphere_Air`，然后按住 Shift 点击 `Element_Sphere_Water`，以便同时选中全部四个。从菜单栏中选择\
  \ `Component > Scripts > Element`。这将同时为所有四个制体添加 `Element` 脚本。现在，逐个选择每个制体，并在该制体的\
  \ Inspector 面板中选择相应的 `Element.type`（例如，将 `Element_Sphere_Air` 的 `type` 设置为 `air`）。\n\
  \n在游戏的游戏的后续迭代中（超出本书的范围），可以同时选择多个元素来创建不同的混合法术，正如 Paradox Interactive 开发的游戏 *Magicka*\
  \ 中中所做的那样——而你即将添加到 `Mage` 中的代码将反映这种可能的扩展——但目前，我们只允许一次选择一个元素。向 `Mage` 添加以下**加粗**代码以实现元素选择功能：\n\
  \n点击此处查看代码图片\n\n```csharp\npublic class Mage : PT_MonoBehaviour {\n    ...\n   \
