  \ *Mage (Script)* 检查器中。展开 `elementabs` 字段旁边的收叠三角形，并将其 `Size` 设置为 `4`。然后将每个 Element_Sphere\
  \ 制体拖入 `elementabs` 数组中，顺序与枚举相同：土、水、风、火。完成后，你的 *Mage.Mage (Script)* 检查器应该如图 35.6\n\
  \n**图 35.6** 显示 elementPrefabs 的 Mage (Script) 检查器\n\n在 MonoDevelop 中打开 ElementInventoryButton\
  \ 脚本，移除调用 `Mage.S.SelectElement()` 一行的注释 (`//`)：\n\n```csharp\nvoid OnMouseUpAsButton()\
  \ {\n    // 通知 Mage 添加此元素类型\n    Mage.S.SelectElement(type);\n}\n```\n\n\n\n现在，当你按下播放（Play）时，你可以选择单个元素，该元素将环绕法师（Mage）旋转。点击黑色无元素将清除你的选择。如果你愿意，可以在\
  \ `Mage (Script)` 器中将 `maxNumSelectedElements` 设置为更高的数值（例如 4），以观察多个 `Element_Spheres`\
  \ 如何环绕法师旋转，但为了本章的需要，请在检查完毕后将 `maxNumSelectedElements` 设置回 1。\n\n既然你已经可以选择元素了，让我们对它们进行一些操作。游戏设计为可以处理两种类型的法术：\n\
  \n![Image](img/00003.jpeg) `地面法术（Ground spells）`施放在地面上，用于对敌人造成范围性伤害或提供保护。\n\n![Image](img/00003.jpeg)\
  \ `攻击法术（Attack spells）`直接施在单个敌人身上。\n\n在本章中，你将构建火焰地面法术。\n\n# 释放火焰地面法术\n\n我们将创建的法术是火焰地面法术。要释放此法术，玩家将选择一个元素，然后在地面上画出一条法术将遵循的彩色路径，喷射出一道火焰以阻挡敌人。\n\
  \n为了实现这一功能，我们需要更多关于玩家最初开始鼠标交互或触摸位置的信息：是在地面上、敌人身上还是法师身上？此信息将改变后续鼠标手势的解释方式。这将通过给各种游戏对象（包括法师、`TilePrefab`\
  \ 和各种敌人）添加标签，然后使用 SHMUP 原型中的 `Utils.FindTaggedParent()` 函数来实现。然而，由于如果父级层级结构中没有对象标记标签，`Utils.FindTaggedParent()`\
  \ 将返回 null，因此这种情况也需要被处理。\n\n将加粗的代码添加到 Mage C# 脚本中：\n\n点击此处查看代码图像\n\n```csharp\n\
  public class Mage : PT_MonoBehaviour {\n\n    ...\n\n    public MPhase         \
  \  mPhase = MPhase.idle;\n\n    public List<MouseInfo>   mouseInfos = new List<MouseInfo>();\n\
  \n    public string            actionStartTag; // [\"Mage\", \"Ground\", \"Enemy\"\
  ]\n\n    public bool              walking = false;\n\n    ...\n\n    void MouseDown()\
  \ {\n\n        // 鼠标点击在某个物体上（可能是拖拽或点击）\n        if (DEBUG) print(\"Mage.MouseDown()\"\
  );\n        GameObject clickedGO = mouseInfos[0].hitInfo.collider.gameObject;\n\
  \        // ^ 如果鼠标没有点击在任何地方，这里会抛出错误\n        //    因为 hitInfo 为 null。然而，我们知道 MouseDown()\n\
  \        //    只有在鼠标确实点击了某个物体时才会被调用，\n        //    所以保证 hitInfo 定义。\n        GameObject\
  \ taggedParent = Utils.FindTaggedParent(clickedGO);\n        if (taggedParent ==\
  \ null) {\n            actionStartTag = \"\";\n        } else {\n            actionStartTag\
  \ = taggedParent.tag;\n            // ^ 这应该是 \"Ground\", \"Mage\", 或 \"Enemy\" 之一\n\
  \        }\n    }\n\n    void MouseTap() {\n        // 像点击按钮一样点击了某个\n        if\
  \ (DEBUG) print(\"age.MouseTap()\");\n        // 现在关注点击了什么\n        switch (actionStartTag)\
  \ {\n            case \"age\":\n                // 什么都不做\n                break;\n\
  \            case \"Ground\":\n                // 无论是否选择了元素，移动到点击点 z=0\n       \
  \         WalkTo(lastMouseInfo.loc); // 移动到第一个 mouseInfo 位置\n                ShowTap(lastMouseInfo.loc);\
  \ // 显示玩家点击的位置\n                break;\n        }\n    }\n\n    void MouseDrag()\
  \ {\n        // 鼠标在物体上拖动\n        if (DEBUG) print(\"age.MouseDrag()\");\n     \
  \   // 除非鼠标在地面上开始，否则拖拽没有意义\n        if (actionStartTag != \"Ground\") return;\n\
  \        // 如果没有选择元素，玩家应该跟随鼠标\n        if (selectedElements.Count == 0) {\n    \
  \        // 持续向当前的 mouseInfo 位置移动\n            WalkTo(mouseInfos[mouseInfos.Count-1].loc);\n\
  \        }\n    }\n\n    void MouseDragUp() {\n        // 鼠标在拖动后释放\n        if (DEBUG)\
  \ print(\"age.MouseDragUp()\");\n        // 除非鼠标在地面上开始，否则拖拽没有意义\n        if (actionStartTag\
  \ != \"Ground\") return;\n        // 如果没有选择元素，现在停止移动\n        if (selectedElements.Count\
  \ == 0) {\n            // 拖拽停止时停止移动\n            StopWalking();\n        }\n   \
  \ }\n    ...\n}\n```\n\n一旦完成此代码，就需要为几个对象添加标签。由于使用了 `Utils.FindTaggedParent()` 方法，只需要最顶部的父对象具有标签即可，这对于带有多个碰撞器的复杂对象（例如法师）将非常有帮助。\n\
  \n在层级结构（Hierarchy）中选择 `Select Mage`，并在 Mage 检查器顶部的 Tag 弹出菜单中选择 `Add Tag`。在 Tags\
  \ 数组中，为 `Mage`、`Ground` 和 `Enemy` 添加标签。完成后，再次在层级结构中选择 `Mage` 并将其标签设置为 `Mage`。在 Project\
  \ 面板的 Prefabs 文件夹中选择 `TilePrefab` 并将其标签设置为 `Ground`。现在保存场景并按下播放。\n\n现在你应该能看到点击 `Mage`\
  \ 或从 `Mage` 拖动会产生效果。\n\n## 使用 LineRenderer 释放地面法术\n\n当选择元素时，我们想要在地面上画出带有颜色的线条来释放法术（在此情况下是火焰法术）。线条将根据元素的颜色绘制，这是使用\
  \ `LineRenderer` 实现的。\n\n只需要绘制一条线条，所以我们需要一个 `LineRenderer` 组件。在层级结构中选择 `Mage`，从菜单栏选择\
  \ `Component > Effects > Line Renderer`。你会看到 `Mage` 附近有一条难看的粉色线条。我们很快会让它变得漂亮得多。\n\
  \n你还会在 Mage 检查器中看到 `LineRenderer` 组件。打开 `Materials` 旁边的折叠箭头并点击右侧的小圆。这将显示所有材质的列表。从列表末尾选择\
  \ `Default-Particle`（它是每个 Unity 项目包含的少数默认材质之一）。这种材质非常适合线条、轨迹和简单的粒子。线条现在看起来好多了。\n\
  \n在 `LineRenderer` 检查器中取消勾选 `Cast Shadows` 和 `Receive Shadows`。打开 `Parameters` 旁边的箭头，将\
  \ `Start Width` 和 `End Width` 都设置为 `0.2`。最后，现在 `LineRenderer` 已准备就绪，取消勾选 `LineRenderer`\
  \ 旁边的框以禁用它（我们会在需要时通过代码启用它）。完成后，你的 `LineRenderer` 设置应该像图 35.7 左图所示。\n\n![Image](img/00260.jpeg)\n\
  \n**图 35.7** Mage:LineRenderer 设置和 Mage:ElementColor 设置\n\n在 MonoDevelop 中打开 Mage\
  \ 脚本并添加以下加粗代码来实现线条渲染器：\n\n点击此处查看代码图像\n\n```csharp\npublic class Mage : PT_MonoBehaviour\
  \ {\n\n    ...\n\n    public int maxNumSelectedElements = 1;\n\n    public Color[]\
