  \ Shift+S。\n\n#### 最大化目标窗口\n\n你可能在开发过程中注意到，目标窗口在尺寸很小时很难看清。你可以通过改变相机的 `rect` 值在运行时调整其屏幕窗口。尝试将以下代码添加到\
