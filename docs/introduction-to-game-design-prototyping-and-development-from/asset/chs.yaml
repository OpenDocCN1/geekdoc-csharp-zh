  \ 中的这些小类将存储当 `Deck` 读取 XML 文件时创建的信息。在 MonoDevelop 中打开 Deck C# 脚本并输入以下代码：\n\n点击此处查看代码图片\n\
  \n```csharp\nusing UnityEngine;\n\nusing System.Collections;\nusing System.Collections.Generic;\n\
  \npublic class Deck : MonoBehaviour \n{\n    public bool ________________;\n   \
  \ public PT_XMLReader xmlr;\n\n    // InitDeck 在 Prospector 准备就绪时调用\n    public\
  \ void InitDeck(string deckXMLText) \n    {\n        ReadDeck(deckXMLText);\n  \
  \  }\n\n    // ReadDeck 将传递它的 XML 文件解析为 CardDefinitions\n    public void ReadDeck(string\
