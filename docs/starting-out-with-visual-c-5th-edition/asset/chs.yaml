  \ 5.1 关于 ListBox\n\n### 概念\n\n`ListBox` 控件有许多可以来操作 `ListBox` 的方法和属性。\n\n在第 4 章中我们介绍了\
  \ `ListBox`，它可以显示列表。在本章中，我们使用 `ListBox` 控件显示输出。\n\n我们向 `ListBox` 的 `Items` 属性添加项目。在设计时，你可以可以使用属性窗口添加项目。你也可以编写代码在运行时向\
  \ `ListBox` 添加项目。要用代码向 `ListBox` 添加项目，可以调用控件的 `Add` 方法。这里是方法的通用格式：\n\n```\nListBoxName.Items.Add(Item);\n\
