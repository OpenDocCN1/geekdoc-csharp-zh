  \n# 关键术语\n\n* Action 委托\n* 匿名方法\n* 委托\n* `delegate` 关键字\n* 委托类型\n* `Func` 委托\n*\
  \ lambda 表达式\n* lambda 运算符\n\n\n\n\n\n- 多路委托\n- `Predicate` 委托\n\n# 复习题：单选题\n\n\
  1. 你可以使用委托来引用一个（）。\n    1. 对象\n    2. 变量\n    3. 方法\n    4. 结构\n\n2. 在创建委托之前，你必须声明。\n\
  \    1. 一个委托类型\n    2. 一个委托变量\n    3. 委托的生命周期\n    4. 委托的作用域\n\n3. 委托可以引用。\n   \
  \ 1. 任何方法\n    2. 任何 `void` 方法\n    3. 任何参数列表与委托类型匹配的方法。\n    4. 任何返回类型和参数列表与委托类型匹配的方法。\n\
  \n4. 引用多个方法的委托被称为（）。\n    1. 复合委托\n    2. 多路委托\n    3. 复杂委托\n    4. 错误！委托不能引用多一个方法。\n\
  \n5. （）方法没有名称。\n    1. 无类型\n    2. 匿名\n    3. 隐藏\n    4. 保护\n\n6. Lambda 表达式是编写（）的快捷技术。\n\
  \    1. 扩展方法\n    2. `if-else` 语句\n    3. 匿名方法\n    4. 无监督委托\n\n7. () 是 Lambda 运算符。\n\
  \    1. `=>`\n    2. `->`\n    3. `<=`\n    4. `<=>`\n\n8. 如果 Lambda 表达式体中包含多个语句，这些语句必须包含在（）。\n\
  \    1. 大括号 `{ }`\n    2. 中括号 `[]`\n    3. 圆括号 `()`\n    4. 尖括号 `<>`\n\n9. 这种类型的委托调用接受\
  \ 0 到 16 个参数的 `void` 方法。\n    1. `Func`\n    2. `Predicate`\n    3. `Action`\n \
  \   4. `Automaton`\n\n10. 这种类型的委托调用接受一个参数并返回 `boolean` 值的方法。\n    1. `Func`\n  \
  \  2. `Predicate`\n    3. `Action`\n    4. `Automaton`\n\n11. 这种类型的委托调用接受 0 到 16\
  \ 个参数并返回一个值的方法。\n    1. `Func`\n    2. `Predicate`\n    3. `Action`\n    4. `Automaton`\n\
  \n# 判断题：对或错\n\n1. 你可以使用委托来调用方法。\n2. 一旦委托被赋值，就不能再重新赋值。\n3. 你可以使用委托将方法作为参数传递给另一个方法。\n\
  4. 委托与任何返回类型和参数列表与委托类型匹配的方法兼容。\n5. 委托不能引用匿名方法。\n6. 匿名方法是编写 Lambda 表达式的快捷技术。\n7.\
  \ 你可以将 Lambda 表达式赋值给委托。\n8. 编写 Lambda 表达式通常比编写匿名方法需要更多的代码。\n9. Lambda 表达式可以作为参数传递给方法。\n\
