  \ for clicking the button.”](img/FG_02_037.png)图 2-37 完整替代文本\n\n### 注意\n\n在为 `Button`\
  \ 控件编写 `Click` 事件处理程序时，你可能会疑惑是否有必要先在 `Designer` 中双击 `Button` 控件以创建空事件处理程序代码。毕竟，你难道不能跳过这一步，而是打开代码编辑器自己编写所有的事件处理程序代码吗？答案是否定的，你不能跳过这一步。当你在\
