  \ 5))\n{\n   MessageBox.Show(\"Character 5 is \" + \"punctuation mark.\");\n}\n\
  ```\n\n```\nchar.IsPunctuation(str, index)\n```\n\n | 参数 `str` 是一个字符串，`index` 是字符在\
  \ `str` 中的位置。如果指定的字符被归类为标点符号，该方法返回 `true`，否则返回 `false`。 |\n\n```\nExample: \nstring\
  \ str = \"Hello!\";\nif (char.IsPunctuation(str, 5))\n{\n   MessageBox.Show(\"Character\
  \ 5 is \" + \"punctuation mark.\");\n}\n```\n\n```\nchar.IsUpper(ch)\n```\n\n |\
  \ 参数 `ch` 是一个字符。如果 `ch` 是大写字母，该方法返回 `true`，否则返回 `false`。 |\n\n```\nExample: \nstring\
  \ str = \"Hello World\";\nif (char.IsUpper(str[0]))\n{\n   MessageBox.Show(\"Character\
  \ 0 is \" + \"uppercase.\");\n}\n```\n\n```\nchar.IsUpper(str, index)\n```\n\n |\
  \ 参数 `str` 是一个字符串，`index` 是字符在 `str` 中的位置。如果指定的字符是大大写字母，该方法返回 `true`，否则返回 `false`。\
  \ |\n\n```\nExample: \nstring str = \"Hello World\";\nif (char.IsUpper(str, 0))\n\
  {\n   MessageBox.Show(\"Character 0 is \" + \"uppercase.\");\n}\n```\n\n```\nchar.IsWhiteSpace(ch)\n\
  ```\n\n | 参数 `ch` 是一个字符。如果 `ch` 是空白字符，该方法返回 `true`，否则返回 `false`。（空白字符包括空格、制表符、回车符、分页符、垂直制表符和换行符。）\
  \ |\n\n```\nExample: \nstring str = \"      \";\nif (char.IsWhiteSpace(str[0]))\n\
