  \n### 概念\n\nOpenFileDialog 和 SaveFileDialog 允许你的应用程序显示打开和保存的标准对话框。到目前为止，打开文件的应用程序都是指定文件名。然而，大多数\
  \ Windows 用户习惯使用对话框来浏览文件。你可以使用 OpenFileDialog 和 SaveFileDialog 为应用程序配备标准的对话框。\n\n\
  # OpenFileDialog 控件\n\nOpenFileDialog 显示一个标准的*打开*对话框，如图 5-43 所示。对于必须打开现有文件的应用程序，该对话框非常有用，因为它允许用户浏览系统并选择文件。\n\
  \n# 图 5-43 Windows *打开*对话框\n\n![显示了一个 Windows“打开”对话框。](img/FG_05_039.png)图 5-43 完整备用文本\n\
  \n# 向项目中添加 OpenFileDialog 控件\n\n要在表单上添加 OpenFileDialog 控件，双击工具箱窗口中*对话框*组下的 OpenFileDialog\
  \ 工具。当控件被创建时，它不会出现在表单上，而是出现在设计器底部的一个被称为组件托的区域。图 5-44 显示了 OpenFileDialog 控件在组件托中显示的示例。该控件的默认名称为\
  \ `OpenFileDialog1`。与其他控件一样，你可以通过更改控件的 `Name` 属性来更改其名称。\n\n# 图 5-44 组件托中的 OpenFileDialog\
  \ 控件\n\n![截图显示 OpenFileDialog 控件出现在组件托底部。控件的默认名称显示为“OpenFileDialog1”。它被标记为“OpenFileDialog\
  \ 控件”。](img/FG_05_044.png)\n\n\n\n\n在代码中，可以通过调用 `OpenFileDialog` 控件的 `ShowDialog`\
  \ 方法来显示 `Open` 对话框。例如，假设我们已经创建了一个 `OpenFileDialog` 控件并将其更名为 `openFile`。以下语句调用了控件的\
  \ `ShowDialog` 方法：\n\n```\nopenFile.ShowDialog();\n```\n\n但在大多数情况下，你可能想知道用户点击的是\
  \ `Open` 按钮还是 `Cancel` 按钮来关闭 `Open` 对话框。如果用户点击了 `Open` 按钮，意味着用户已选择了一个文件并可以打开它。如果用户点击了\
  \ `Cancel` 按钮，则意味着用户不想继续操作。\n\n`ShowDialog` 方法返回一个值，表示用户点击哪个按钮来关闭对话框。如果用户点击了 `Open`\
  \ 按钮，则返回值 `DialogResult.OK`。如果用户点击了 `Cancel` 按钮，则返回值 `DialogResult.Cancel`。假设 `openFile`\
  \ 是 `OpenFileDialog` 控件的名称，以下是一个 `if-else` 语句示例，它调用了 `ShowDialog` 方法并判断用户点击的是 `Open`\
  \ 按钮还是 `Cancel` 按钮。\n\n```\nif (openFile.ShowDialog() == DialogResult.OK)\n{\n \
  \  MessageBox.Show(\"You clicked the Open button.\");\n}\nelse\n{\n   MessageBox.Show(\"\
  You clicked the Cancel button.\");\n}\n```\n\n# Filename 属性\n\n当用户使用 `Open` 对话框选择文件时，文件的路径和文件名会存储在控件的\
  \ `Filename` 属性中。假设 `openFile` 是 `OpenFileDialog` 控件的名称。以下代码演示了如何显示 `Open` 对话框，并在用户点击\
  \ `Open` 按钮关闭对话框时打开所选的文件：\n\n```\n 1 StreamReader inputFile;\n 2 \n 3 if (openFile.ShowDialog()\
  \ == DialogResult.OK)\n 4 {\n 5    // Open the selected file.\n 6    inputFile =\
  \ File.OpenText(openFile.Filename);\n 7 \n 8    // Continue processing the file…\n\
  \ 9 }\n10 else\n11 {\n12    MessageBox.Show(\"Operation canceled.\");\n13 }\n```\n\
  \n让我们仔细观察这段代码。第 1 行语句声明了一个名为 `inputFile` 的 `StreamReader` 变量。第 3 行的 `if` 语句调用 `openFile`\
  \ 控件的 `ShowDialog` 方法来显示 `Open` 对话框。如果用户点击 `Open` 按钮关闭对话框，程序将继续执行第 6 行，从控件的 `Filename`\
  \ 属性获取所选文件名并打开该文件。否则（如果用户点击了 `Cancel` 按钮），程序将跳转到第 10 行的 `else` 子。\n\n# Tips\n\n\
  当你创建一个 `OpenFileDialog` 控件时，其 `Filename` 属性最初设置为控件的默认名称。例如，如果控件的默认名称为 `openFileDialog1`，那么\
  \ `Filename` 属性也会设置为 `openFileDialog1`。请务必删除 `Filename` 属性的默认值。\n\n# InitialDirectory\
  \ 属性\n\n默认情况下，`Open` 对话框显示用户 `Documents` 目录（或文件夹）的内容。你可以通过将路径存储在 `InitialDirectory`\
  \ 属性中指定另一个初始目录。例如，以下代码在显示 `Open` 对话框之前将路径 `C:\\Data` 存储在 `openFile` 控件的 `InitialDirectory`\
  \ 属性中：\n\n```\nopenFile.InitialDirectory = \"C:\\Data\";\nif (openFile.ShowDialog()\
  \ == DialogResult.OK)\n{\n   // Continue to process the selected file…\n}\nelse\n\
  {\n   // The operation was canceled.\n}\n```\n\n在此示例中，当显示 `Open` 对话框时，它会显示 `C:\\\
