  \ 2-31 完整替代文本\n\n# 向项目添加自己的代码\n\n现在你准备好学习如何向项目添加自己的代码了。假设你创建了一个名为 *Code Demo* 的项目，并使用\
  \ `Button` 控件设置了项目的表单，如图 2-32 所示。`Button` 控件的 `Text` 属性设置为 *Click*。\n# 图 2-32 带有\
