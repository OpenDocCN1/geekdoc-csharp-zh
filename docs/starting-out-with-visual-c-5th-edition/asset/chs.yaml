  \    numberListBox.Items.Add(30);\n6     numberListBox.Items.Add(40);\n7 }\n```\n\
  \n# Items.Count 属性\n\nListBox 控件有一个 `Items.Count` 属性，用于报告存储在 ListBox 中的项目数量。如果 ListBox\
  \ 是空的，则 `Items.Count` 属性等于 0。例如，假设一个应用程序有一个名为 `employeesListBox` 的 ListBox 控件。如果\
  \ ListBox 中没有项目，以下 `if` 语句将显示消息框：\n\n```\n if (employeesListBox.Items.Count == 0)\n\
  {\n    MessageBox.Show(\"There are no items in the list!\")\n}\n```\n\n`Items.Count`\
  \ 属性存储一个整数值。假设 `numEmployees` 是一个 `int` 变量，以下语句将 `employeesListBox` 中的项目数量赋值给变量\
  \ `numEmployees`：\n\n```\nnumEmployees = employeesListBox.Items.Count;\n```\n\n\
  # Items.Clear 方法\n\nListBox 控件有一个 `Items.Clear` 方法，用于擦除 Items 属性中的所有项目。以下是方法的通用格式：\n\
  \n```\nListBoxName.Items.Clear();\n```\n\n例如，假设一个应用程序有一个名为 `employeesListBox` 的\
  \ ListBox 控件。以下语句将清除列表中的所有项目：\n\n```\nemployeesListBox.Items.Clear();\n```\n\n#\
  \ 检查点\n\n1. 5.1 在代码中，如何向 ListBox 控件添加一个项目？\n2. 5.2 如何确定存储在 ListBox 控件中的项目数量？\n3.\
  \ 5.3 如何擦除 ListBox 控件的内容？\n\n# 5.2 `while` 循环\n\n### 概念\n\n`while` 循环导致语句或一组语句只要布尔表达式为真，就会重复执行。\n\
  \n`while` 循环的名称源于它的工作方式：*当布尔表达式为真时，执行某些任务*。该循环包含两个部分：(1) 用于测试真假值的布尔表达式，以及 (2) 只要布尔表达式为真就会重复执行的语句或一组语句。图\
  \ 5-3 显示了 `while` 循环的逻辑。\n\n# 图 5-3 `while` 循环的逻辑\n\n![一张图说明了 while 循环的逻辑。](img/FG_05_003.png)图\
  \ 5-3 完整替代文本\n\n菱形符号表示要测试的布尔表达式。注意表达式为真会发生什么：执行一个或多个语句，程序的执行流返回到菱形符号上方一点。再次测试布尔表达式，如果为真，则重复该过程。如果布尔表达式为假，程序退出循环。循环每次执行其语句或一组语句时，我们称循环正在迭代，或正在执行一次迭代。\n\
  \n以下是 `while` 循环的通用格式：\n\n![屏幕截图显示了带有语句的 while 循环通用格式。](img/UNFG_05_001.png)5.2-1\
  \ 完整替代文本\n\n我们将第一行称为 `while` 子句。`while` 子句以单词 `while` 开头，后面跟着括括号内的布尔表达式。从下一行开始是一组包含在大括号中的的语句。该语句块被称为循环体。\n\
  \n当 `while` 循环执行时，会测试布尔表达式。如果布尔表达式为真，则执行循环体中出现的语句，然后循环重新开始。如果布尔表达式为假，循环结束，程序从循环后的紧邻语句开始继续执行。\n\
  \n我们说循环体中的语句是**条件执行**的，因为它们只有在布尔表达式为真的条件下才会执行。如果你编写的 `while` 循环循环体中只有一条语句，则不需要将该语句包含在大括号内。这种循环可以按照以下通用格式编写：\n\
  \n```\n while (BooleanExpression)\n    statement;\n```\n\n当执行以这种格式编写的 `while` 循环时，会测试布尔表达式。如果为真，则执行下一行的那条语句，然后循环重新开始。然而，如果布尔表达式为假，循环将结束。\n\
  \n虽然当循环体中只有一条语句时不需要大括号，但使用它们仍然是一个好习惯，如下所示的通用格式：\n\n```\n while (BooleanExpression)\n\
  {\n    statement; \n}\n```\n\n当我们讨论第 4 章中的各种 `if` 语句时，提到过这是一个良好的编程风格，因为它减少了错误。如果你有多个语句，它们**必须**包含在大括号内。\n\
  \n你还应该注意到循环体中的语句进行了缩进。与 `if` 语句一样，这种缩进使得代码更易读。让我们来看一个例子。在本书学生示例程序的 `Chap05` 文件夹中，你会找到一个名为\
  \ `while Loop` 的项目。图 5-4 显示了应用程序运行时表单。如左图所示，按钮控件的名称是 `goButton`。在运行时，当你点击 `goButton`\
  \ 控件时，会显示右图中消息框。当你点击*确定*按钮关闭消息框时，会显示另一个相同的消息框。消息框共显示五次。\n\n```\n1 private void goButton_Click(object\
  \ sender, EventArgs e)\n2 {\n3     // 定义一个变量来计算循环次数。\n4     int count = 1;\n5 \n\
  6     // 在消息框中显示五次 \"Hello\"。\n7     while (count <= 5)\n8     {\n 9         //\
  \ 显示消息框。\n10         MessageBox.Show(\"Hello\");\n11 \n12         // count 加 1。\n\
  13         count = count + 1;\n14     }\n15 }\n```\n\n\n\n\n\n让我们仔细观察这段代码。在第 4 行，声明了一个名为\
  \ `count` 的 `int` 变量并将其初始化为 1。第 7 行开始了一个 `while` 循环。注意，`while` 循环测试表达式 `count <=\
  \ 5`。只要 `count` 变量小于或等于 5，`while` 循环体内的语句就会重复。在循环体内部，第 10 行在消息框中显示“Hello”，然后第 13\
  \ 行将 `count` 变量加 1。这是循环体内的最后一条语句，因此在执行之后，循环将重新开始。它会再次测试布尔表达式，如果为真，则执行循环体内的语句。这个循环不断重复，直到布尔表达式\
  \ `count <= 5` 为假为止，如图 5-5 所示。循环的流程图如图 5-6 所示。\n\n## 图 5-5 `while` 循环\n\n![截图显示了在语句帮助下\
  \ while 循环涉及的步骤。](img/FG_05_005.png)图 5-5 完整替代文本\n\n## 图 5-6 `while` 循环的流程图\n\n\
  ![流程图显示了 while 循环。](img/FG_05_006.png)图 5-6 完整替代文本\n\n# `while` 循环是一种预测试循环\n\n`while`\
  \ 循环被称为预测试循环，这意味着它在执行迭代*之前*测试其条件。因为测试是在循环开始时进行的，所以你通常需要在循环之前执行一些步骤，以确保循环至少执行一次。注意\
  \ *while Loop Demo* 程序中 `count` 变量的声明：\n\n```cs\nint count = 1;\n```\n\n变量 `count`\
  \ 被初始化为值 1。如果 `count` 初始化为大于 5 的值（如下所示示例所示），循环将永远不会执行：\n\n```cs\n 1 private void\
  \ goButton_Click(object sender, EventArgs e)\n 2 {\n 3     // 声明一个变量来计算循环迭代次数。\n\
  \ 4     int count = 6;\n 5 \n 6     // 这个循环永远不会迭代！\n 7     while (count <= 5)\n\
  \ 8     {\n 9         // 显示消息框。\n10         MessageBox.Show(\"Hello\");\n11 \n12\
  \         // 将 count 加 1。\n13         count = count + 1;\n14     }\n15 }\n```\n\n\
  `while` 循环的一个重要特性是，如果布尔表达式初始为假，则循环将永远不会迭代。如果你想确保 `while` 循环执行第一次，你必须初始化相关数据，使得布尔表达式初始为真。\n\
  \n# 计数器变量\n\n在 *while Loop Demo* 应用中，变量 `count` 初始化为值 1，然后在每次循环迭代期间向变量 `count` 加\
  \ 1。只要 `count` 小于或等于 5，循环就会执行。变量 `count` 被用作计数器变量，这意味着它在每次循环迭代中都会定期递增。从本质上，`count`\
  \ 变量记录了循环执行的迭代次数。计数器变量通常用于控制循环迭代的次数。\n\n教程 5-1 将提供一些编写循环和使用计数器变量的练习。在教程中，你将编写一个\
  \ `while` 循环，计算银行账户在若干月内每个月赚取的利息。\n\n# 无限循环\n\n在少数情况外，循环必须包含一种在内部终止的方法。这意味着循环内部某些内容最终必须让循环的布尔表达式变为假。程序\
  \ 5-2 中的循环在表达式 `count <= months` 为假时停止。如果一个循环没有停止的方法，它被称为无限循环。*无限循环*会一直重复，直到程序被中断。无限循环通常发生在程序员忘记在循环内部编写代码来使测试条件变为假时。在大多数情况下，你应该避免编写无限循环。\n\
  \n下面的代码示例演示了一个无限循环。在第 1 行，声明了 `count` 变量并将其初始化为值 1。只要 `count <= 5` 为真，`while` 循环就会迭代。然而，循环内部没有语句来递增\
  \ `count`。\n\n```cs\n1 int count = 1;\n2 while (count <= 5)\n3 {\n4     // 这是一个无限循环。\n\
  5 }\n```\n\n### 注意\n\n`++` 运算符读作“加加”，`--` 运算符读作“减减”。这些示例中，我们将 `++` 和 `--` 运算符写在操作数之后（或操作数的右侧）。这被称为后置模式。运算符也可以写在操作数之前（或操作数的左侧），这被称为前置模式。例如：\n\
  \n```cs\n++num;\n--num;\n```\n\n当你编写一个简单的递增或递减变量的语句时（如此处），使用前置模式或后置模式没有区别。运算符在两种模式下的作用相同；但是，如果你将这些运算符与其他运算符或其他操作混合，两种模式的工作方式就会不同。这种复杂的代码可能难以理解和调试。当我们使用递增递减运算符时，我们将仅采用直观易懂的方式，如之前所示的语句。\n\
  \n在这里引入这些运算符是因为它们在循环中很常用。下面的代码段展示了一个示例。\n\n```cs\n 1 // 声明一个变量来计算循环迭代次数。\n2 int\
  \ count = 1;\n3 \n4 // 在消息框中显示五次“Hello”。\n5 while (count <= 5)\n6 {\n7     // 显示消息框。\n\
  8     MessageBox.Show(\"Hello\");\n9 \n10     // 递增 count。\n11     count++;\n12\
  \ }\n```\n\n在接下来的讨论 `for` 循环的节中，你将经常看到这些运算符。\n\n# 检查点\n\n1. 什么是循环？\n2. 什么是计数器变量？\n\
  3. 什么是预测试循环？\n4. 什么是无限循环？\n5. 什么是递增运算符？\n6. 什么是递减运算符？\n7. 如何递增和递减变量？\n8. 什么是前置模式和后置模式？\n\
  \n\n\n\n\n### 1. 5.9 下面的代码示例将显示什么消息？\n\n```\nint number = 5;\nnumber++;\nMessageBox.Show(number.ToString());\n\
  number--;\nMessageBox.Show(number.ToString());\n```\n\n### 2. 5.10 下面的循环将迭代多少次？\n\
  \n```\nint count = 0;\nwhile (count < 4)\n{\n   MessageBox.Show(count.ToString());\n\
  \   count++;\n}\n```\n\n# 5.4 `for` 循环\n\n### 概念\n\n`for` 循环适用于执行已知次数的迭代。\n\n`for`\
  \ 循环专门为需要使用计数器变量来控制循环迭代次数的情况设计。当你编写一个 `for` 循环时，你指定了三个操作：\n\n*   **初始化（Initialization）**：此操作在循环开始时发生。它只发生一次。\n\
  *   **测试（Test）**：测试布尔表达式。如果表达式为真，则循环迭代。否则，循环停止。\n*   **更新（Update）**：此操作在每次循环迭代结束时发生。\n\
  \n`图 5-10` 显示了这三个操作是如何在 `for` 循环的逻辑中被使用的。\n\n# 图 5-10 `for` 循环的逻辑\n\n![流程图显示了“for”循环的逻辑。](img/FG_05_010.png)\
  \ `图 5-10 完整替代文本`\n\n以下是 `for` 循环的一般格式：\n\n```\n for (InitializationExpression;\
  \ TestExpression; UpdateExpression)\n{\n    statement;\n    statement;\n    etc.\
  \ \n}\n```\n\n出现在大括号内部的语句是循环体。这些是在每次循环迭代时执行的语句。与其他控制结构一样，如果循环体只包含一条语句，则大括号是可选的，如下方的一般格式所示：\n\
  \n```\n for (InitializationExpression; TestExpression; UpdateExpression) \n   statement;\n\
  ```\n\n`for` 循环的第一行是`循环头（loop header）`。在关键字 `for` 之后，括号内有三个表达式，用分号分隔。（注意第三个表达式后面没有分号。）\n\
  \n第一个表达式是初始化表达式。它通常用于将计数器变量初始化为起始值。这是循环执行的第一个操作，且只执行一次。第二个表达式是测试表达式。这是一个控制循环执行的布尔表达式。只要该表达式为真，`for`\
  \ 循环体就会重复。`for` 循环是一个预测试循环，因此它在每次迭代之前都会评估测试表达式。第三个表达式是更新表达式。它在每次迭代结束时执行。通常，这是一个增加循环计数器变量的语句。\n\
  \n假设 `count` 是一个已经声明的 `int` 变量。这是一个简单的 `for` 循环示例，它会在消息框中显示 5 次“Hello”：\n\n```\n\
  \ for (count = 1; count <= 5; count++)\n{\n   MessageBox.Show(\"Hello\");\n}\n```\n\
  \n在这个循环中，初始化表达式是 `count = 1`，测试表达式是 `count <= 5`，更新表达式是 `count++`。循环体包含一条语句，即对 `MessageBox.Show`\
  \ 方法的。以下是该循环执行时发生的总结：\n\n1.  执行初始化表达式 `count = 1`。这会将 1 赋值给变量 `count`。\n2.  测试表达式\
  \ `count <= 5`。如果表达式为真，继续第 3 步。否则，循环结束。\n3.  执行语句 `MessageBox.Show(\"Hello\");`。\n\
  4.  执行更新表达式 `count++`。这给变量 `count` 增加 1。\n5.  返回第 2 步。\n\n`图 5-11` 说明了这一系列事件。注意，只要测试表达式为真，步骤\
  \ 2–4 就会重复执行。`图 5-12` 以流程图的形式显示循环的逻辑。\n\n# 图 5-11 `for` 循环中的事件序列\n\n![截图显示了“for”循环中的一系列事件。](img/FG_05_011.png)\
  \ `图 5-11 完整替代文本`\n\n# 图 5-12 `for` 循环的逻辑\n\n\n\n\n\n当变量在 `for` 循环的初始化表达式中声明时，该变量的作用范围仅限于循环。这意味着你不能在循环外的语句中访问该变量。例如，以下代码会导致编译器错误，因为第\
  \ 6 行的语句无法访问 `count` 变量。\n\n```\n 1 for (int count = 1; count <= 5; count++)\n2\
  \ {\n3     MessageBox.Show(\"Hello\");\n4 }\n5\n6 MessageBox.Show(\"The value of\
  \ count is \" + count);\n```\n\n# 更新表达式的其他形式\n\n在更新表达式中，计数变量通常加 1。这使得在递增表达式中使用 `++`\
  \ 运算符非常方便。然而，这并不是强制要求的。你可以编写任何你想要的表达式作为更新表达式。例如，以下循环将 `count` 加了 10：\n\n```\n for\
  \ (int count = 0; count <= 100; count += 10)\n{\n   MessageBox.Show(count.ToString());\n\
  }\n```\n\n注意，在例例中，递增表达式是 `count += 10`。这意味着在每次迭代结束时，`count` 都会加 10。在第一次迭代中，`count`\
  \ 被设置为 0，在第二次迭代中，`count` 被设置为 10，在第三次迭代中，`count` 被设置为 20，以此类推。\n\n# 通过递减计数变量进行倒数\n\
  \n虽然计数变量在计数控制循环中通常是递增，但你也可以递减计数变量。例如，看以下代码：\n\n```\n for (int count = 10; count\
  \ >= 0; count−−)\n{\n   MessageBox.Show(count.ToString());\n}\nMessageBox.Show(\"\
  Blastoff!\");\n```\n\n在这个循环中，`count` 变量初始化为 10。只要 `count` 大于或等于 0，循环就会继续迭代。在每次迭代结束时，`count`\
  \ 递减 1。\n\n在第一次迭代中 `count` 为 10，在第二次迭代中 `count` 为 9，以此类推。如果这在实际程序中，它将显示数字 10、9、8\
  \ 等，一直显示到 0，然后显示 Blastoff!\n\n# 避免在 `for` 循环体中修改计数变量\n\n小心不要在 `for` 循环体中放置修改计数变量的语句。对控制变量的所有修改都应该在更新表达式中进行，更新表达式会在每次迭代结束时自动执行。如果循环体中的语句也修改了计数变量，循环可能不会在你预期的那个时间停止。例如，以下循环每次迭代都会将\
  \ `count` 加两次次：\n\n```\n for (int count = 1; count <= 10; count++)\n{\n   MessageBox.Show(count.ToString());\n\
  \   count++; // 错误！\n}\n```\n\n你已经看到了 `for` 循环的几个示例。教程 5-3 给了你一个编写此类循环的机会。在教程中，你将完成一个应用程序，使用\
  \ `for` 循环将一系列测量值从公制单位转换为英制单位。\n\n# 检查点\n\n1. 5.11 写出 `for` 循环第一行括号内出现的三个表达式。\n\
  2. 5.12 你想写一个 `for` 循环来显示 **I love to program* 50 次。假设你将使用一个名为 `count` 的变量作为计数变量。\n\
  \    1. 你将使用什么初始化表达式？\n    2. 你将使用什么测试表达式？\n    3. 你将使用什么更新表达式？\n    4. 写出该循环。\n\
  3. 5.13 下列代码将显示什么？\n    ```\n     for (int count = 1; count <= 5; count++)\n   \
  \ {\n      MessageBox.Show(count.ToString());\n    }\n    ```\n4. 5.14 下列代码将显示什么？\n\
  \    ```\n     for (int count = 0; count <= 500; count += 100)\n    {\n      MessageBox.Show(count.ToString());\n\
  \    }\n    ```\n\n# 5.5 `do-while` 循环\n\n### 概念\n\n`do-while` 循环是一种后测试循环，这意味着它在测试布尔表达式之前会执行一次迭代。\n\
  \n你已经学习了 `while` 循环和 `for` 是前测试循环，这意味着它们在执行迭代之前会测试布尔表达式。`do-while` 循环是后测试循环。这意味着它在测试布尔表达式之前执行一次迭代。结果是，`do-while`\
  \ 循环至少执行一次迭代，即使它的布尔表达式初始为假。`do-while` 循环的逻辑所示图 5-15。\n\n# 图 5-15 `do-while` 循环的逻辑\n\
  \n![流程图显示了 do-while 循环的逻辑。](img/FG_05_015.png)图 5-15 文本\n\n在流程图中，执行一个或多个语句，然后测试布尔表达式。如果布尔表达式为真，程序流回到循环体第一个语句之前的点，并重复此过程。如果布尔表达式为假，程序退出循环。\n\
  \n在代码中，`do-while` 循环看起来类似于反转的 `while` 循环。这里是 `do-while` 循环的通用格式：\n\n```\n do\n{\n\
  \    语句;\n    语句;\n    等等。\n} while (Boolean 表达式);\n```\n\n与 `while` 循环一样，如果循环体内只有一个语句，括号是可选的。这是\
  \ `do-while` 循环的通用格式：\n\n```\n do\n    语句;\nwhile (Boolean 表达式);\n```\n\n注意 `do-while`\
  \ 循环最后有一个分号。漏掉它是常见的错误。\n\n`do-while` 循环是后测试循环。这意味着它在完成迭代之前不测试表达式。结果，`do-while` 循环至少执行一次迭代，即使表达式初始为假。这与\
  \ `while` 循环的行为不同。例如，在下面的 `while` 循环中，调用 `MessageBox.Show` 的语句将不会执行：\n\n```\n int\
  \ number = 1;\nwhile (number < 0)\n{\n    MessageBox.Show(number.ToString());\n\
  }\n```\n\n但在下面的 `do-while` 循环中，调用 `MessageBox.Show` 的语句执行一次，因为 `do-while` 循环在迭代结束时才测试\
  \ `number < 0`：\n\n```\n int number = 1;\ndo\n{\n   MessageBox.Show(number.ToString());\n\
  } while (number < 0);\n```\n\n# 检查点\n\n1. 5.15 什么是后测试循环？\n2. 5.16 `while` 循环和 `do-while`\
  \ 循环有什么区别？\n3. 5.17 下列循环将迭代多少次？\n    ```\n     int count = 0;\n    do\n    {\n \
  \      MessageBox.Show(count.ToString());\n       count++;\n    } while (count <\
  \ 0);\n    ```\n\n\n\n\n\n*   **电子表格**：电子表格程序用于处理数值数据。数字和数学公式可以插入到电子表格的行和列中。电子表格可以保存到文件中，供日后使用。\n\
  *   **游戏**：许多计算机游戏将数据存储在文件中。例如，某些游戏会将包含玩家名称及其分数的列表存储在文件中。这些游戏通常按照分数从高到低的顺序显示玩家名称。某些游戏还允许你将当前游戏状态保存到文件中，这样你就可以退出游戏并在稍后继续玩，而无需从头开始。\n\
  *   **Web 浏览器**：有时当你访问网页时，浏览器会在你的计算机上存储一个名为 `cookie` 的小文件。`Cookies` 通常包含有关浏览会话的信息，例如购物车的内容。\n\
  \n日常业务操作中使用的程序高度依赖文件。工资程序将员工数据存储在文件中，库存程序将有关公司产品的数据存储在文件中，会计系统将公司财务运营的数据存储在文件中，以此此类推。\n\
  \n程序员通常将把数据保存到文件的过程称为向文件`写入数据`。当一段数据被写入文件时，它会从 `RAM` 中的变量被复制到文件中。这在图 5-16 中有所说明。`输出文件`一词用于描述写入数据的文件。它被称为`输出文件`是因为程序将输出内容存储其中。\n\
  \n# 图 5-16 向文件写入数据\n\n![一张图显示了向文件中写入一段数据的过程。](img/FG_05_016.png)图 5-16  完整替代文本\n\
  \n从文件中检索数据的过程被称为从文件中`读取数据`。当一段数据从文件中被读取时，它会从文件复制到 `RAM` 中的变量中。图 5-17 说明了这一点。`输入文件`一词用于描述从文件中读取数据的文件。它被称为`输入文件`是因为程序从文件中获取输入。\n\
  \n# 图 5-17 从文件中读取数据\n\n![一张图显示了从文件中读取数据的过程。](img/FG_05_017.png)图 5-17  完整替代文本\n\n\
  在本节中，我们将讨论创建向文件写入数据和从文件读取数据程序的方法。当程序使用文件时，始终必须采取三个步骤。\n\n1.  **打开文件**——打开文件会在文件和程序之间建立连接。打开一个`输出文件`通常会在磁盘上创建该文件并允许程序向其写入数据。打开一个输入文件`允许程序从文件中读取数据。\n\
  2.  **处理文件**——在这一步中，数据被写入文件（如果它是`输出文件`）或从文件中读取（如果它是`输入文件`）。\n3.  **关闭文件**——当程序完成文件的使用后，必须关闭文件。关闭文件会将文件与程序断开连接。\n\
  \n# 文件类型\n\n通常，文件有两种类型：文本文件和二进制文件。`文本文件`包含使用 `Unicode` 等方案编码为文本的数据。即使文件中包含数字，这些数字也是作为一系列字符存储在文件中。因此，可以使用记事本（`Notepad`）等文本编辑器打开并查看。`二进制文件`包含未转换为文本的数据。因此，你无法用文本编辑器查看`二进制文件`的内容。在本章中，我们只处理文本文件。\n\
  \n# 文件访问方法\n\n大多数编程语言提供了两种访问存储在文件中的数据的不同方法：`顺序访问`和`直接访问`。当你处理`顺序访问文件`时，你从文件的开始到文件的末尾访问数据。如果你想读取存储在文件末尾的一段数据，你必须读取它之前的所有数据——你不能直接跳转到所需的数据。这类似于磁带播放机的工作方式。如果你想听磁带上的最后一首歌，你必须快进跳过之前所有的歌曲或者听它们。没有办法可以直接跳转到特定的歌曲。\n\
  \n当你处理`直接访问文件`（也称为`随机访问文件`）时，你可以直接跳转到文件中的任何数据，而无需读取其之前的数据。这类似于 CD 播放器或 MP3 播放器的工作方式。你可以直接跳转到你想听的任何歌曲。\n\
  \n本章重点关注`顺序访问文件`。顺序访问文件易于处理，你可以使用它们来。\n\n# 文件名与文件对象\n\n磁盘上的文件通过文件名识别。例如，当你创建一个文档并保存文件时，你使用\
  \ Windows 资源管理器（`Windows Explorer`）等工具来查看文件名。图 5-18 显示了三个文件。\n\n每个操作系统都有自己的文件命名规则。许多系统（包括\
  \ Windows）支持使用文件扩展名，它是出现在文件名末尾的短字符序列，并带有一个点（被称为“点”）。例如，`.jpg`扩展名通常表示文件包含根据 JPEG\
  \ 标准压缩的图像`.txt`扩展名通常表示文件包含文本。`.docx`扩展名通常表示文件包含 Word 文档。\n\n# 图 5-18 三个文件\n\n![显示了\
  \ jpg、txt 和 docx 三个文件。](img/FG_05_018)\n\n为了让程序处理磁盘上的文件，程序必须在内存中创建一个对象。文件对象是与文件关联的对象，并为程序提供方式。在程序中，变量与对象关联。我们说该变量`引用`该对象。该变量用于执行对文件进行的任何操作。这一概念在图\
  \ 5-19 中所示。\n\n# 图 5-19 引用关联文件对象的变量\n\n![一张图显示了引用关联文件对象的变量。](img/FG_05_019)\n\n\
  你将使用 .NET 框架中的两个类来创建文件对象。当你向文本文件写入数据时，你使用`StreamWriter` 类，而你想从文本文件中读取数据时，你使用`StreamReader`\
  \ 类。这些类位于 .NET 框架的 `System.IO` 命名空间中，因此你需要在程序的顶部编写以下指令：\n\n```\nusing System.IO;\n\
  ```\n\n\n\n\n\n你可以使用 `StreamWriter` 类的 `WriteLine` 方法将一行文本写入文件。假设你想编写一个程序，创建一个名为\
  \ `courses.txt` 的文本文件，并将你正在修的课程名称写入该文件。下面的代码示例展示了如何实现这一操作：\n\n```\n1 StreamWriter\
  \ outputFile;\n2 outputFile = File.CreateText(\"courses.txt\");\n3 \n4 outputFile.WriteLine(\"\
  Intro to Computer Science\");\n5 outputFile.WriteLine(\"English Composition\");\n\
  6 outputFile.WriteLine(\"Calculus I\");\n7 outputFile.WriteLine(\"Music Appreciation\"\
  );\n8 \n9 outputFile.Close();\n```\n\n让我们来看每一行代码。\n\n- **第 1 行：** 该语句声明了一个名为 `outputFile`\
  \ 的变量，该变量可用于引用一个 `StreamWriter` 对象。\n- **第 2 行：** 简而言之，该语句打开了你准备从中写入数据的文件。它通过调用\
  \ `File.CreateText` 方法并传递字符串 `\"courses.txt\"` 作为参数来实现。`File.CreateText` 方法执行以下操作：\n\
  \    - 它创建一个以参数指定的命名的文本文件。如果文件已存在，其内容将被擦除。\n    - 它在内存中创建一个与文件关联的 `StreamWriter`\
  \ 对象。\n    - 它返回该 `StreamWriter` 对象的引用。\n\n注意，赋值运算符将 `File.CreateText` 方法返回的值赋值给\
  \ `outputFile` 变量。这使得 `outputFile` 变量引用了由方法创建的 `StreamWriter` 对象。在执行第 2 行的语句后，磁盘上会创建\
  \ `courses.txt` 文件，内存中存在一个与该文件相关的 `StreamWriter` 对象，且 `outputFile` 变量引用该对象。\n- **第\
  \ 4 行：** 该语句将字符串 `\"Intro to Computer Science\"` 写入 `courses.txt` 文件。它通过调用 `StreamWriter`\
  \ 类的 `WriteLine` 方法来实现，并将要写入文件的字符串作为参数传递。当 `WriteLine` 方法将数据写入文件时，它会在数据紧之后写入一个换行符。换行符是一个不可见的字符，用于指定文本文本的结束。\n\
  - **第 5 行：** 该语句将字符串 `\"English Composition\"` 写入 `courses.txt` 文件。\n- **第 6 行：**\
  \ 该语句将字符串 `\"Calculus I\"` 写入 `courses.txt` 文件。\n- **第 7 行：** 该语句将字符串 `\"Music Appreciation\"\
  ` 写入 `courses.txt` 文件。\n- **第 9 行：** 该语句关闭了 `courses.txt` 文件。它通过调用 `StreamWriter`\
  \ 类的 `Close` 方法来实现。\n\n在执行此代码后，我们可以使用文本编辑器打开 `courses.txt` 文件并查看其内容。图 5-20 显示了文件内容在记事本中的显示方式。\n\
  \n# 图 5-20 在记事本中显示的 courses.txt 文件内容\n\n![截图显示了课程文件在记事本中显示的内容。](img/FG_05_020.png)图\
  \ 5-20 完整备备性文本\n\n# 使用 `Write` 方法写入数据\n\n之前你读到过 `StreamWriter` 类的 `WriteLine` 方法向文件写入一个数据项，然后写入一个换行符。换行符指定了文本行的结束。例如，下面的代码示例打开了一个名为\
  \ `Example.txt` 的文件，然后使用 `WriteLine` 方法向文件写入字符串 `\"One\"`、`\"Two\"` 和 `\"Three\"\
  `。由于每个字符串后面都写入了换行符，当在文本编辑器查看时，这些字符串显示在不同的行上。图 5-21 左侧的屏幕显示了文件在记事本中的外观。\n\n# 图 5-21 用\
  \ `WriteLine` 和 `Write` 方法写入的项\n\n![一组截图显示了在记事本中使用“WriteLine”和“Write”方法写入的项。](img/FG_05_021.png)图\
  \ 5-21 完整备备性文本\n\n```\n1 StreamWriter outputFile;\n2 outputFile = File.CreateText(\"\
  Example.txt\");\n3 \n4 outputFile.WriteLine(\"One\");\n5 outputFile.WriteLine(\"\
  Two\");\n6 outputFile.WriteLine(\"Three\");\n7 \n8 outputFile.Close();\n```\n\n\
  在某些情况下，你可能想向文件中写入一个项，但其后不紧跟换行符。`StreamWriter` 类为此目的提供了 `Write` 方法。它向文本文件写入一个数据项，而不写入换行符。下面的代码示例演示了这一点。图\
  \ 5-21 右侧的屏幕显示了文件在记事本中的外观。\n\n```\n1 StreamWriter outputFile;\n2 outputFile = File.CreateText(\"\
  Example.txt\");\n3 \n4 outputFile.WriteLine(\"One\");\n5 outputFile.WriteLine(\"\
  Two\");\n6 outputFile.WriteLine(\"Three\");\n```\n\n# 处理文件异常\n\n在处理文件时可能会出现意外问题。例如，在调用\
  \ `File.CreateText` 方法时程序可能没有创建权限，或者在调用 `WriteLine` 方法时磁盘已满。当发生此类意外错误时，会抛出异常。为了处理此类异常，可以使用\
  \ `try-catch` 语句，将文件操作的代码放在 `try` 块中。示例如下：\n\n```\n1 try\n2    // 声明 StreamWriter\
  \ 变量。\n3    StreamWriter outputFile;\n4 \n5    // 创建文件并获取 StreamWriter。\n6    outputFile\
  \ = File.CreateText(\"Numbers.txt\");\n7 \n8    // 将数字 1 到 10 写入文件。\n9    for (int\
  \ count = 1; count <= 10; count++)\n10       {\n11           outputFile.WriteLine(count);\n\
  12       }\n13 \n14   // 关闭文件。\n15   outputFile.Close();\n16 }\n17 catch (Exception\
  \ ex)\n18 {\n19    // 显示错误消息。\n20    MessageBox.Show(ex.Message);\n21 }\n```\n\n\
  在教程 5-4，你将完成一个从 TextBox 读取输入并写入文件的应用程序。\n\n# 向文本文件写入数值\n\n你可以使用 `StreamWriter` 类的\
  \ `WriteLine` 或 `Write` 方法将数字（如 `int`、`double` 和 `decimal`）写入文本文件，但数字会被转换为字符串。例如，查看以下示例（摘自\
  \ *Chap05* 中的 *Number File* 项目）：\n\n```\n1 private void writeNumbers_Click(object\
  \ sender, EventArgs e)\n2 {\n3    try\n4    {\n5        // 声明 StreamWriter 变量。\n\
  6        StreamWriter outputFile;\n7 \n8        // 创建文件并获取 StreamWriter 对象。\n9 \
  \       outputFile = File.CreateText(\"Numbers.txt\");\n10 \n11       // 将数字 1 到\
  \ 10 写入文件。\n12       for (int count = 1; count <= 10; count++)\n13       {\n14 \
  \          outputFile.WriteLine(count);\n15       }\n16 \n17       // 关闭文件。\n18\
  \       outputFile.Close();\n19    }\n20     catch (Exception ex)\n21     {\n22\
  \        // 显示错误消息。\n23        MessageBox.Show(ex.Message);\n24     }\n25 }\n```\n\
  \n当此事件处理程序执行时，第 9 行创建了一个名为 `Numbers.txt` 的文本文件，第 12–15 行的循环将数字 1–10 写入文件。图 5-25\
  \ 显示了该文件在记事本中打开时的外观。\n\n# 图 5-25 在记事本中打开的 Numbers.txt 文件\n\n![截图显示了 Numbers dot\
  \ t x t 文件在记事本中显示的内容。](img/FG_05_025.png)图 5-25 完整备备性文本\n\n\n\n\n\n当您调用 `File.CreateText`\
  \ 方法打开文件时，如果参数指定的文件已经存在，它将被擦除，并创建一个同名的新空文件。例如，当您运行在教程 5-4 中完成完成的“友谊文件”应用程序时，每当您点击“写入名称”按钮时，`Friend.txt`\
  \ 文件都会被擦除并创建一个新文件。\n\n有时，您希望保留现有文件并向其当前内容追加新数据。要向现有文件追加数据，您可以使用 `File.AppendText`\
  \ 方法来打开它。它的工作方式与 `File.CreateText` 方法类似，但如果文件已存在，则不会被擦除。写入文件的任何数据都会追加到文件的现有内容之后。\n\
  \n例如，假设文件 `Names.txt` 存在并包含图 5-26 所示的数据：\n\n## 图 5-26 Names.txt 文件\n\n![截图显示了记事本中\
  \ Names dot t x t 文件的内容。](img/FG_05_026.png)图 5-26 完整替代文本\n\n以下代码打开文件并向其现有内容追加了额外数据：\n\
  \n```\n 1 StreamWriter outputFile;\n2 outputFile = File.AppendText(\"Names.txt\"\
  );\n3 \n4 outputFile.WriteLine(\"Lynn\");\n5 outputFile.WriteLine(\"Steve\");\n\
  6 outputFile.WriteLine(\"Bill\");\n7 \n8 outputFile.Close();\n```\n\n执行此代码后，`Names.txt`\
  \ 文件包含图 5-27 所示的数据：\n\n## 图 5-27 追加数据后的 Names.txt 文件\n\n![截图显示了记事本中 Names dot t\
  \ x t 文件的内容，在追加了额外数据之后。](img/FG_05_027.png)图 5-27 完整替代文本\n\n# 指定输出文件的位置\n\n当您调用\
  \ `File.CreateText` 或 `File.AppendText` 方法打开文件时，您将文件名作为字符串参数传递。如果传递的参数文件名不包含文件路径，则文件的位置将位于应用程序项目文件夹下的\
  \ `bin\\Debug` 文件夹。您在教程 5-4 和 5-5 中在 Visual Studio 中打开 `Friend.txt` 文件时已经见过这一点。\n\
  \n如果您想在不同的位置打开文件，可以在传递给 `File.CreateText` 或 `File.AppendText` 方法的参数中指定路径以及文件名。如果您在字符串字面量中指定路径，请确保在字符串前加上\
  \ `@` 字符。这里是一个示例：\n\n```\nStreamWriter outputFile;\noutputFile = File.CreateText(@\"\
  C:\\Users\\Chris\\Documents\\Names.txt\");\n```\n\n### 提示\n\n您还可以让用户指定文件位置。请查看第\
  \ 5.7 节获取有关 SaveFileDialog 控件的更多信息。\n\n# 使用 StreamReader 对象从文件读取数据\n\n要从文本文件中读取数据，您需要创建一个\
  \ `StreamReader` 对象。然后您可以使用 `StreamReader` 类的 `ReadLine` 方法从文件中读取一行文本。例如，假设一个名为\
  \ `Students.txt` 的文件存在并包含图 5-29 所示的四个名称。\n\n## 图 5-29 Students.txt 文件内容\n\n![截图显示了记事本中\
  \ Students dot t x t 文件的内容。](img/FG_05_029.png)图 5-29 完整替代文本\n\n假设您想编写一个程序，从 `Students.txt`\
  \ 文件读取四个名称并在消息框中显示它们。下面的代码示例展示了如何这样做。（此代码示例摘自本书中 `Chap05` 文件夹中的 `Student Names`\
  \ 项目。）\n\n```\n 1 try\n 2 {\n 3 // 声明一个变量来存放从文件中读取的项。\n 4 string studentName;\n\
  \ 5\n 6 // 声明一个可以从文件中读取项的 StreamReader。\n 7 StreamReader inputFile;\n 8\n 9 // 打开文件并获取一个\
  \ StreamReader 对象。\n 10 inputFile = new StreamReader(\"Students.txt\");\n 11\n 12\
  \ // 读取第一个名称并显示它。\n 13 studentName = inputFile.ReadLine();\n 14 MessageBox.Show(studentName);\n\
  \ 15\n 16 // 读取第二个名称并显示它。\n 17 studentName = inputFile.ReadLine();\n 18 MessageBox.Show(studentName);\n\
  \ 19\n 20 // 读取第三个名称并显示它。\n 21 studentName = inputFile.ReadLine();\n 22 MessageBox.Show(studentName);\n\
  \ 23\n 24 // 读取第四个名称并显示它。\n 25 studentName = inputFile.ReadLine();\n 26 MessageBox.Show(studentName);\n\
  \ 27\n 28 // 关闭文件。\n 29 inputFile.Close();\n 30 }\n 31 catch (Exception ex) \n 32\
  \ { // 显示错误消息\n 33 MessageBox.Show(ex.Message);\n 34 }\n```\n\n让我们仔细观察这段代码：\n\n\
  *   第 1 行：是 `try` 语句的开始。在打开文件或读取项时如果发生异常，程序将跳转到 `catch` 块。\n*   第 4 行：声明了一个名为 `studentName`\
  \ 的 `string` 变量。当从文件中读取项时，我们将结果赋值给该变量。\n*   第 7 行：声明了一个可以从文件中读取项的 `StreamReader`。\n\
  *   第 10 行：打开文件并获取一个 `StreamReader` 对象。如果文件不存在，将抛出异常。该语句创建了指向文件的 `StreamReader`\
  \ 引用。\n*   第 11 行：将 `File.OpenText` 方法返回值赋值给 `inputFile` 变量。\n*   第 13 行：该语句调用 `inputFile.ReadLine()`\
  \ 方法，从文件中读取一行文本。该方法返回的字符串被赋值给 `studentName`。当该语句读取文件的第一行时，`studentName` 被赋值为 \"\
  Joe Merrell\"。\n*   第 14 行：在消息框中显示 `studentName` 的内容。\n*   第 17 行：该语句调用 `inputFile.ReadLine()`\
  \ 方法，从文件中读取一行文本。该方法返回的字符串赋值给 `studentName`。当该语句读取文件的第二行时，`studentName` 被赋值为 \"Chris\
  \ Rich\"。\n*   第 18 行：在消息框中显示 `studentName` 的内容。\n*   第 21 行：该语句调用 `inputFile.ReadLine()`\
  \ 方法，从文件中读取一行文本。该方法返回的字符串赋值给 `studentName`。当该语句读取文件的第三行时，`studentName` 被赋值为 \"Kathryn\
  \ Stevens\"。\n*   第 22 行：在消息框中显示 `studentName` 的内容。\n*   第 25 行：该语句调用 `inputFile.ReadLine()`\
  \ 方法，从文件中读取一行文本。该方法返回的字符串赋值给 `studentName`。当该语句读取文件的第四行时，`studentName` 被赋值为 \"Carly\
  \ Colombo\"。\n*   第 26 行：在消息框中显示 `studentName` 的内容。\n*   第 29 行：关闭文件。\n*   第 31\
