  \ 10-21\n\n# 在表单和表单代码之间切换\n\n在 Visual Studio 中，您可以通过双击“解决方案资源管理器”窗口中的表单条目轻松切换视图到另一个表单。该表单将显示在“设计器”中。您还可以使用位于设计器顶部出现的标签来显示不同的表单或其代码。图\
  \ 10-23 图 10-23 完整备用文本\n\n当您在代码编辑器中打开表单时，您将看到几个 `using` 指令、一个命名空间声明以及表单类。图 10-24\
  \ 图 10-24 完整备用文本\n\n# 移除表单\n\n如果您想从项目中移除表单并删除文件，请按照以下步骤操作：\n\n1. 在解决方案资源管理器中右键点击表单。\n\
  2. 在弹出菜单中点击“删除”（Delete）。\n\n如果您想从项目中移除表单但不删除文件，请按照以下步骤操作：\n\n1. 在解决方案资源管理器中右键点击表单。\n\
  2. 在弹出菜单中点击“排除在项目之外”（Exclude）。\n\n# 显示表单\n\n在应用程序代码中，显示表单的第一步是创建表单类的实例。例如，假设项目有一个名为\
  \ `ErrorForm` 的表单。以下语句创建了该实例：\n\n```\nErrorForm myErrorForm = new ErrorForm();\n\
  ```\n\n此语句声明了一个名为 `myErrorForm` 的引用变量。它在内存中创建了 `ErrorForm` 类的对象，并将对象赋值给 `myErrorForm`。执行此语句后，您可以使用\
  \ `myErrorForm` 对表单进行操作。\n\n创建表单类的实例并不会在屏幕上显示表单。下一步是调用表单的 `ShowDialog` 方法。这是一个示例：\n\
  \n```\nmyErrorForm.ShowDialog();\n```\n\n`ShowDialog` 方法将表单显示在屏幕上，并将焦点交给表单。这意味着应用程序的控制权转移到了表单。当用户关闭表单时，控制权返回调用\
  \ `ShowDialog` 方法的地方，执行继续。\n\n在我们涵盖了创建和显示表单的基本概念后，请教程 10-5 步骤。在教程中，您将创建一个有两个表单的简单应用程序。\n\
  \n# 模态表单与非模态表单\n\n表单可以是模态的也可以是非模态的。`ShowDialog` 方法以模态方式显示表单。当模态表单显示时，在模态表单关闭之前，应用程序中的任何其他表单都无法接收焦点。用户必须关闭模态表单，才能与应用程序中的任何其他表单交互。非模态表单则允许用户在其显示时切换焦点到另一个表单。用户不需要关闭非模态表单即可切换焦点。如果您想以非模态方式显示表单，请调用其\
  \ `Show` 方法。\n\n模态和非模态表单之间还有另一个重要区别。当您调用 `ShowDialog` 方法显示模态表单时，程序的控制权会转移给表单，在表单关闭之前，位于\
  \ `ShowDialog` 调用之后的任何语句都不会执行。\n\n\n\n\n当你调用 `Show` 方法显示非模态表单时，`Show` 方法调用之后出现的语句会在表单显示期间继续执行。应用程序不会等待非模态表单关闭后执行这些语句。图\
  \ 10-31 说明了这一概念。\n\n# 图 10-31 显示非模态表单后语句的执行\n\n![截图显示了显示非模态表单后语句的执行。](img/FG_10_031.png)图\
  \ 10-31 完整备用文本\n\n### 提示\n\n非模态表单通常用于特殊情况。在大多数多窗口应用程序中，你可能希望以模态方式显示表单。\n\n## 访问不同表单上的控件\n\
  \n你放在表单上的控件默认具有私有访问权限。这意味着存在于特定表单上的控件只能由编写在该表单类中的代码访问。有了私有访问权限，你无法在一个表单中编写代码来访问另一个表单上的控件。\n\
  \n你可以通过在 `Properties` 窗口中更改控件的 `Modifiers` 属性来更改其访问权限。如果你将控件的 `Modifiers` 属性更改为\
  \ `Public`，则可以通过表单类的代码访问该控件。\n\n例如，假设应用程序有一个名为 `GreetingsForm` 的表单，`GreetingsForm`\
  \ 有一个名为 `messageLabel` 的 Label 控件。此外，假设 `messageLabel` 控件的 `Modifiers` 属性设置为 `Public`。以下代码显示了如何创建\
  \ `GreetingsForm` 的实例，为 `messageLabel` 控件的 `Text` 属性赋值，然后显示该表单：\n\n```\n 1  GreetingsForm\
  \ greetingsForm = new GreetingsForm();\n2  greetingsForm.messageLabel.Text = \"\
  Good day!\"\n3  greetingsForm.ShowDialog();\n```\n\n第 1 行的语句创建了 `GreetingsForm`\
  \ 类的实例，并由变量 `greetingsForm` 引用。此时，表单存在于内存中，但尚未显示在屏幕上。第 2 行的语句将字符串 `\"Good day!\"\
  ` 赋值给 `messageLabel` 控件的 `Text` 属性。注意，控件的名称前面是 `greetingsForm` 后跟点。这表示该控件不在当前表单上，而是在\
  \ `greetingsForm` 变量引用的表单上。第 3 行的语句调用表单的 `ShowDialog` 方法将表单显示在屏幕上。当表单出现在屏幕上时，`messageLabel`\
  \ 控件将显示文本 *Good day!*。\n\n在 教程 10-6 中，你有创建一个多窗口应用程序，其中一个表单上的代码创建另一个表单的实例，并为该表单上的控件赋值。\n\
  \n# 检查点\n\n1. 10.25 更改表单名称应该遵循哪些步骤？\n2. 10.26 向项目中添加新表单应该遵循哪些步骤？\n3. 10.27 如何从项目中删除表单并从磁盘删除其文件？\n\
  4. 10.28 显示表单的第一步是什么？\n5. 10.29 当使用 `ShowDialog` 方法显示的表单被用户关闭后会发生什么？\n\n# 10.7 静态类成员\n\
  \n### 概念\n\n静态类成员属于类，而不属于从类实例化的对象。\n\n## 实例字段和实例方法的快速复\n\n（等待，原文此处重复了标题）\n\n回想类的每个实例都有自己的一组字段，这些字段被称为实例字段。你可以创建类的多个实例，并在每个实例的字段中存储不同的值。例如，我们在本章早些时候创建的\
  \ `Coin` 类有一个名为 `sideUp` 的字段。当你调用类的 `Toss` 方法时，字符串类型的 `sideUp` 字段会被随机设置为“Heads”或“Tails”。假设\
  \ `myCoin` 引用 `Coin` 类的实例，我们执行以下语句：\n\n```\nmyCoin.Toss();\n```\n\n该语句将值存储在属于 `myCoin`\
  \ 引用实例的 `sideUp` 字段中。你可以认为实例字段属于类的特定实例。\n\n你还会记得类也可以有实例方法。当你调用实例方法时，它会在类的特定实例上执行操作。例如，假设\
  \ `myCoin` 引用 `Coin` 类的实例，查看以下语句：\n\n```\nstatus = myCoin.GetSideUp();\n```\n\n\
  该语句调用 `GetSideUp` 方法，该方法返回属于 `Coin` 类特定实例（即 `myCoin` 引用的实例）的 `sideUp` 字段的值。实例字段和实例方法都与特定实例关联。\n\
  \n## 静态成员\n\n可以创建一个不属于类任何实例字段、属性或方法。此类成员被称为静态。\n\n## 静态字段\n\n当使用 `static` 关键字声明字段时，无论存在多少类实例，内存中都只有一个副本。类字段的副本由所有实例共享。例如，上文所示的\
  \ `Countable` 类使用静态字段来计数创建的实例数量。\n\n```\n 1   class Countable\n2   {\n3      //\
  \ 静态字段\n4      private static int instanceCount = 0;\n5 \n6      // 构造函数\n7    \
  \  public Countable()\n8      {\n9         instanceCount++;\n10      }\n11 \n12\
  \      // 获取 instanceCount 值的方法\n13      public int GetInstanceCount()\n14     \
  \ {\n15         return instanceCount;\n16      }\n17   }\n```\n\n第 4 行声明了一个名为 `instanceCount`\
  \ 的静态字段。通过在访问修符之后数据类型之前放置 `static` 关键字来创建静态字段。注意我们显式地将 `instanceCount` 字段初始化为 0。无论创建多少类实例，此初始化只发生一次。\n\
  \n接下来查看第 7-10 行的构造函数。构造函数使用 `++` 运算符增加 `instanceCount` 。每创建一个 `Countable` 类实例，就会调用构造函数，`instanceCount`\
  \ 字段就会加 1。因此，`instanceCount` 字段将包含已创建的 `Countable` 类实例。第 28-31 行的 `GetInstanceCount`\
  \ 方法返回 `instanceCount` 的值。以下代码片段演示了这个类：\n\n```\n 1   // 创建三个 Countable 对象。\n2  \
  \ Countable obj1 = new Countable();\n3   Countable obj2 = new Countable();\n4  \
  \ Countable obj3 = new Countable();\n5 \n6   // 获取实例数量。\n7   int numObjects = obj3.GetInstanceCount();\n\
  ```\n\n\n\n\n这段代码创建了 `Countable` 类的三个实例，分别由变量 `obj1`、`obj2` 和 `obj3` 引用。尽管该类有三个实例，但静态字段只有一个副本。这在图\
  \ 10−35 中所示。在第 7 行中，代码调用了 `getInstanceCount` 方法来获取已创建的实例数量。（变量 `numObjects` 将赋值为\
  \ 3。）尽管程序是从 `obj3` 调用 `getInstanceCount` 方法的，但从任何对象返回的都是相同的值。\n\n# 图 10−35 所有实例共享静态字段\
  \ `instanceCount`\n\n![图像显示，静态的“instanceCount”字段有三个 Countable 类的实例，它们分别由变量“obj 1”、“obj2”和“obj3”引用。](img/FG_10_035.png)\n\
  \n### 注意\n\nC# 自动在所有未初始化的值类型静态字段中存储 0（或在未初始化的静态 `boolean` 字段中存储 `false`），并在所有未初始化的引用类型静态字段中存储\
  \ `null`。`Countable` 类中的 `instanceCount` 字段显式初始化，因此任何阅读代码的人都能清楚地知道该字段初始值为 0。\n\n\
  # 静态属性\n\n属性也可以是静态的。当使用 `static` 关键字声明属性时，无论类存在多少个实例，内存中都只有一个属性值的副本。类的所有实例将共享该属性数据的副本。例如，下面的代码段显示了\
  \ `Countable` 类的另一个版本。该版本的类使用静态属性来记录创建的实例数量。\n\n```\n 1   class Countable\n 2  \
  \ {\n 3      // 静态属性\n 4      public static int InstanceCount { get; set; } = 0;\n\
  \ 5\n 6      // 构造函数\n 7      public Countable()\n 8      {\n 9          InstanceCount++;\n\
  10      }\n11   }\n```\n\n第 4 行声明了一个名为 `InstanceCount` 的静态属性。该属性被实现为自动属性，并初始化为值\
  \ 0。无论创建了多少个类实例，此初始化只发生一次。\n\n当类具有静态属性时，类外部代码不能使用类的实例来访问该属性。例如，下面的代码段会导致错误。\n\n\
  ```\nCountable obj = new Countable();     // 创建一个 Countable 实例\nint numObjects =\
  \ obj.InstanceCount; // 错误！\n```\n\n不要使用类的实例来访问静态属性，而是使用类本身。这里有一个示例：\n\n```\nCountable\
  \ obj = new Countable();\nint numObjects = Countable.InstanceCount;\n```\n\n当这段代码执行时，`numObjects`\
  \ 变量将被赋值为 1。后面是另一个示例。当这段代码执行时，`numObjects` 变量将被赋值为 3。\n\n```\n 1   // 创建三个 Countable\
  \ 对象。\n2   Countable obj1 = new Countable();\n3   Countable obj2 = new Countable();\n\
  4   Countable obj3 = new Countable();\n5 \n 6   // 获取实例数量。\n7   int numObjects =\
  \ Countable.InstanceCount;\n```\n\n如果你显式声明静态属性的底层字段（backing field），请记住属性和底层字段都必须声明为\
  \ `static`。这里是 `Countable` 类的另一个示例。在这个版本的类中，`InstanceCount` 属性没有实现为自动属性。它的底层字段被显式声明。注意第\
  \ 4 行中底层字段 `_instanceCount` 被声明为 `static`，第 7 行中 `InstanceCount` 属性也被声明为 `static`。\n\
  \n```\n 1   class Countable\n 2   {\n 3      // InstanceCount 属性的底层字段\n 4      private\
  \ static int _instanceCount = 0;\n 5 \n 6      // InstanceCount 属性\n 7      public\
  \ static int InstanceCount\n 8      {\n 9          get { return _instanceCount;\
  \ }\n10          set { _instanceCount = value; }\n11      }\n12 \n 13      // 构造函数\n\
  14      public Countable()\n15      {\n16          InstanceCount++;\n17      }\n\
  18   }\n```\n\n# 静态方法\n\n当类包含静态方法时，你不需要创建类的实例即可执行该方法。下面的代码段显示了一个带有静态方法的类示例。\n\n\
  ```\n 1   class Metric\n 2   {\n 3      // 以下方法将英里转换为公里。\n 4      public static\
  \ double MilesToKilometers(double m)\n 5      {\n 6          return m * 1.609;\n\
  \ 7      }\n 8\n 9      // 下一方法将公里转换为英里。\n10      public static double KilometersToMiles(double\
  \ k)\n11      {\n12          return k / 1.609;\n13      }\n```\n\n静态方法对于许多任务非常方便，因为可以根据需要直接从类调用。它们通常用于执行操作但不需要存储数据的工具类。`Metric`\
  \ 类就是一个很好的例子。它被用于存放转换英里和公里的方法。静态方法唯一的限制是它们不能引用类的非静态成员。这意味着从静态方法调用的任何方法都必须是静态的。这意味着如果方法使用了类的任何字段或属性，它们也必须是静态的。\n\
  \n# 静态类\n\n你已经看到 `static` 关键字可以用于将字段、属性和方法声明为静态。你也可以使用 `static` 关键字将类声明为静态。如果你将类声明为静态，那么类的所有成员都必须是静态的。如果静态类包含非静态字段、属性或方法，会导致编译错误。\n\
  \n如果一个类被声明为 `static`，编译器将不允许实例化该类。此外，静态类不能有构造函数。这种限制是合理的，因为构造函数负责初始化实例，由于静态类无法实例化，因此它们不需要构造函数。\n\
