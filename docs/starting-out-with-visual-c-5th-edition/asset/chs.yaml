  \ Visual C# 应用程序创建 GUI：Hello World 应用程序\n\n当学生学习计算机编程时，传统的做法是从学习编写一个 `Hello World`\
  \ 程序开始的。`Hello World` 程序是一个简单的程序，仅在屏幕上显示“Hello World”字样。在本章中，你将创建你的第一个 Visual C#\
  \ 应用程序，它将是一个事件驱动的 `Hello World` 程序。当完成的应用程序运行时，它将显示左侧所示的图 2-14 中的表单。注意，表单包含一个显示为\
  \ `Display Message` 的按钮。当你点击该按钮时，图中右侧显示的窗口将会出现。\n\n\n![显示了两个截图，第一张显示了空白项目表单上一个标记为“Display\
  \ Message”的按钮，点击它会弹出第二个窗口，该窗口显示有文本“Hello World”。](img/FG_02_014.png)\n\n创建此应用程序的过程分为两个部分。首先，你创建应用程序的\
  \ GUI，其次，你编写代码以便在用户点击 `Display Message` 按钮时显示 `Hello World` 消息。教程 2-1 将将引导你完成创建\
  \ GUI 的过程。\n\n# 2.3 C# 代码介绍\n### 概念\n\n你使用 Visual Studio 代码编辑器来编写应用程序代码。你在应用程序中编写的大部分代码将是事件处理程序。事件处理程序响应应用程序运行时发生的特定事件。\n\
  \n在本章的节节中，你学习了创建应用程序 GUI 的基础知识。然而，应用程序不仅仅是一个用户界面。如果你想让你的应用程序执行任何有意义的操作，你就必须编写代码。本节将向你介绍\
  \ Visual C# 代码，并展示如何编写程序以响应按钮点击。\n\n\n### 图 2-24 解决方案资源管理器中显示的源代码文件\n\n![截图显示了解决方案资源管理器窗口，显示了源代码文件。](img/FG_02_024.png)图\
  \ 2-24 完整备用文本\n\n\n*   `Program.cs` 文件包含应用程序的启动代码，这些代码在应用程序运行时执行。该文件中的代码执行了后台初始化任务，这些任务对于启动和运行应用程序是必要的。重要的是，你不要修改此文件的内容，因为这样做可能会阻止应用程序执行。\n\
  *   `Form1.cs` 文件包含与 `Form1` 表单相关的代码。当你编写代码时，这些代码与该表单相关。\n\n### 注意\n\n\n### 图 2-25\
  \ 在编辑器中显示的代码\n\n![截图显示了打开文件 1 中代码的步骤。](img/FG_02_025.png)\n\n\n![截图显示了 Visual Studio\
  \ 界面中的显示代码。](img/FG_02_026.png)\n\n此时，你不需要理解你所看到的语句的含义。然而，了解代码是如何组织的对你将有帮助，因为以后你将向其添加代码。C#\
  \ 代码主要通过三种方式组织：命名空间、类和方法。这里是总结：\n\n*   命名空间是类的容器。\n*   方法是执行某些操作的代码组。\n\n因此，C# 代码被组织为方法，方法包含在类中，类包含在命名空间中。根据这种组织结构，请看图\
  \ 2-27。\n\n# 图 2-27 Form1.cs 代码的组织结构\n![图像显示了文件 1 代码的组织结构。它被分为 . NET Framework 的命名空间（标记为\
  \ 1）、项目的命名空间（标记为 2）、类（标记为 3）和方法（标记为 4）。](img/FG_02_027.png)\n\n图中显示了四个代码部分，标记为 1、2、3\
  \ 和 4。让我们讨论每个代码部分。\n\n1.  ![](img/CircleOne.png) 回想第 1 章，C# 应用程序高度依赖于 .NET Framework，它是类和其他代码的集合。.NET\
  \ Framework 中的代码组织在命名空间中。C# 源代码文件顶部出现的一系列 `using` 指令明了程序将使用哪些命名空间。\n\n\n\n\n## 2.\
  \ ![](img/CircleTwo.png) 这部分代码为项目创建了一个命名空间。读取 `namespace Hello_World` 的行标记了名为 `Hello_World`\
  \ 的命名空间的开始。注意下一行包含一个左括号（`{`），而文件的最后一行包含一个对应的右括号（`}`）。这些大括号之间的所有代码都在 `Hello_World`\
  \ 命名空间内部。\n## 3. ![](img/CircleThree.png) 这部分代码是一个类声明。读取 `public partial class`\
  \ 等行标记了类的开始。下一行包含一个左括号（`{`），而该部分代码的最后一行包含对应的右括号（`}`）。这些大括号之间的所有代码都在类内部。\n\n## 4.\
  \ ![](img/CircleFour.png) 这部分代码是一个方法。读取 `public Form1()` 的行标记了方法的开始。下一行包含一个左括号（`{`），而该部分代码的最后一行包含对应的右括号（`}`）。这些大括号之间的代码都在方法内部。\n\
  \n需要指出的是，代码容器（如命名空间、类和方法）使用大括号（`{}`）来包裹代码。每个左括号（`{`）必须在程序的后续某处有一个对应的右括号（`}`）。图 2-28\
  \ 显示了 `Form1.cs` 中的大括号是如何配对的。\n\n\n![图像显示了代码中的配对括号。](img/FG_02_028.png)图 2-28 完整替代文本\n\
