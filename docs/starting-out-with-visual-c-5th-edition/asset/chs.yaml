  \ 当你将数组作为参数传递时，传递参数变量的是？\n2. 7.12 接收数组作为参数的方法是可以访问实际数组还是只能访问数组的副本？\n3. 7.13 在数组参数上使用\
  \ `ref` 或 `out` 关键字时，结果是什么？\n\n# 7.5 实用的数组算法\n\n## 顺序查找\n\n程序通常需要搜索存储在数组中的数据。各种被称为搜索算法的技巧已被开发出来，用于在较大的数据集（如数组）中定位特定项目。在本节中，我们将讨论所有搜索算法中最简单的——顺序查找。顺序查找算法使用循环按顺序遍历数组，从第一个元素开始。它将每个元素与要搜索的值进行比较，并在找到该值或遇到数组末尾时停止。如果搜索的值不在数组中，算法将搜索到数组末尾并返回失败。\n\
  \n让我们来看一个例子。在 Student Sample Programs 的 *Chap07* 文件夹中，你会找到一个名为 *American* *Colonies*\
  \ 的项目。该应用程序是一个测试你对美国历史知识的游戏。如图 7-22 所示，应用程序表单在 `ListBox` 控件中显示了一个州列表。`ListBox` 中显示的州只有一个有一个是原始的。\n\
  \n```cs\nprivate void okButton_Click(object sender, EventArgs e)\n{\n   string selection;\n\
  \   string[] colonies = { \"Delaware\", \"Pennsylvania\", \"Georgia\", \"Maryland\"\
  , \"Massachusetts\", \"Connecticut\", \"New Hampshire\", \"New Jersey\", \"New York\"\
  , \"North Carolina\", \"North Carolina\", \"Maryland\", \"Rhode Island\", \"South\
  \ Carolina\", \"South Virginia\", \"Virginia\" };\n\n   // 获取选中的项目\n   selection\
  \ = outputListBox.SelectedItem.ToString();\n\n   // 判断项目是否在数组中\n   if (SequentialSearch(colonies,\
  \ selection) != -1)\n   {\n       MessageBox.Show(\"Yes, that was one of the colonies.\"\
  );\n   }\n   else\n   {\n       MessageBox.Show(\"No, that was not one of the colonies.\"\
  );\n   }\n}\n\nint SequentialSearch(string[] sArray, string value)\n{\n   bool found\
  \ = false; // 标记位\n   int index = 0; // 用于遍历数组\n   int position = -1; // 位置\n\n\
  \   // 搜索数组\n   while (!found && index < sArray.Length)\n   {\n       if (sArray[index]\
  \ == value)\n       {\n           found = true;\n           position = index;\n\
  \       }\n       index++;\n   }\n   // 返回\n   return position;\n}\n```\n\n\n\n\n\
  `OK` 按钮的 `Click` 事件处理器从第 26 行开始。让我们仔细查看该事件处理器的代码：\n\n* 第 28 行声明了一个名为 `selection`\
  \ 的 `string` 变量。该变量将存储从 `ListBox` 控件中选中的项。\n* 第 31–35 行声明了一个名为 `colonies` 的 `string`\
  \ 数组。该数组用美国殖民地的名称进行初始化。\n* 第 37 行开始的 `if` 语句判断 `selectionListBox` 控件中是否选择了某项。如果选择了某项，将执行以下操作：\n\
  \    * 第 40 行获取选中的项并将其赋值给 `selection` 变量。\n    * 第 43 行的 `if` 语句调用 `SequentialSearch`\
  \ 方法，并将 `colonies` 数组和 `selection` 变量作为参数传递。如果在 `colonies` 数组中找到了 `selection` 变量的值，该方法将返回一个非\
  \ −1 的值，第 45 行将显示消息框通知用户选中的项是殖民地之一。然而，如果在 `colonies` 数组中没有找到 `selection` 变量的值，该方法将返回\
  \ −1，第 49 行将显示消息框通知用户选中的项不是殖民地之一。\n\n# 复制数组\n\n由于数组是一个对象，因此数组和引用它的变量之间存在区别。数组和引用变量是两个独立的实体。当你想要将一个数组的内容复制到另一个数组时，记住这一点非常重要。你可能会倾向于编写类似下面的代码，认为你正在复制一个数组：\n\
  \n```\nint[] array1 = { 2, 4, 6, 8, 10 };\nint[] array2 = array1; // 这并没有复制 array1。\n\
  ```\n\n第一条语句创建由 `array1` 变量引用的数组。第二条语句将 `array1` 赋值给 `array2`。这并没有为 `array1` 所引用的数组创建副本，而是将\
  \ `array1` 中的引用赋值给 `array2`。执行此条语句后，`array1` 和 `array2` 变量都将引用同一个数组。这种赋值操作被称为引用复制。它只复制了数组对象的引用，而不是数组对象的内容。这在图\
  \ 7-23 中所示。\n\n# 图 7-23 `array1` 和 `array2` 引用同一个数组\n\n![一张图显示两个变量引用同一个数组。](img/FG_07_023.png)图\
  \ 7-23 完整备用文本\n\n如果你想复制一个数组，必须在内存中创建第二个数组，然后将第一个数组的各个元素复制到第二个数组中。这通常通过循环完成，如下所示：\n\
  \n```\n1 const int SIZE = 5;\n2 int[] firstArray = { 5, 10, 15, 20, 25 };\n3 int[]\
  \ secondArray = new int[SIZE];\n4\n5 for (int index = 0; index < firstArray.length;\
  \ index++)\n6 {\n7     secondArray[index] = firstArray[index];\n8 }\n```\n\n此代码中的循环将\
  \ `firstArray` 的每个元素复制到 `secondArray` 对应的元素。\n\n# 比较数组\n\n你不能使用 `==` 运算符来比较两个数组引用变量并判断数组是否相等。例如，下面的代码看起来在比较两个数组，但实际上并没有这么做：\n\
  \n```\n1 int[] firstArray  = { 5, 10, 15, 20, 25 };\n2 int[] secondArray = { 5,\
  \ 10, 15, 20, 25 };\n3\n4 if (firstArray == secondArray) // 这是一个错误。\n5 {\n6    \
  \ MessageBox.Show(\"The arrays are the same.\");\n7 }\n8 else\n9 {\n10     MessageBox.Show(\"\
  The arrays are not the same.\");\n11 }\n```\n\n当对引用变量使用 `==` 运算符时，该运算符比较的是变量包含的引用，而不是变量所引用的对象的内容。由于示例中的\
  \ `firstArray` 和 `secondArray` 变量引用内存中不同的对象，布尔表达式 `firstArray == secondArray` 的结果为\
  \ `false`，代码报告数组不相等。\n\n要比较两个数组的内容，你必须比较这两个数组的元素。例如，查看下面的代码：\n\n```\n1 int[] firstArray\
  \  = { 2, 4, 6, 8, 10 };\n2 int[] secondArray = { 2, 4, 6, 8, 10 };\n3 boolean arraysEqual\
  \ = true; // 标记变量\n4 int index = 0;              // 用于存储数组下标\n5\n6 // 首先确定数组的大小是否相同。\n\
  7 if (firstArray.length != secondArray.length)\n8 {\n9     arraysEqual = false;\n\
  10 }\n11\n12 // 接下来判断元素是否相同。\n13 while (arraysEqual && index < firstArray.length)\n\
  14 {\n15     if (firstArray[index] != secondArray[index])\n16     {\n17        \
  \ arraysEqual = false;\n18     }\n19     index++;\n20 }\n21\n22 if (arraysEqual)\n\
  23 {\n24     MessageBox.Show(\"The arrays are equal.\");\n25 }\n26 else\n27 {\n\
  28     MessageBox.Show(\"The arrays are not equal.\");\n29 }\n```\n\n此代码判断 `firstArray`\
  \ 和 `secondArray`（定义在第 1 和 2 行）是否包含相同的值。布尔变量 `arraysEqual` 在第 3 行声明并初始化为 `true`。`arraysEqual`\
  \ 用于指示数组是否相等。\n\n# 数组的值\n\n要计算数值数组的总和，你可以使用带有累加器的循环。首先，将累加器初始化为 0。然后，循环遍历数组并将每个数组元素的值加到累加器。\n\
  \n```\n1 // 创建数组。\n2 int[] units = { 2, 4, 6, 8, 10 };\n3\n4 // 声明并初始化累加器变量。\n5\
  \ int total = 0;\n6\n7 // 遍历数组，将每个元素加到\n8 // 累加器。\n9 for (int index = 0; index <\
  \ units.Length; index++)\n10 {\n11     total += units[index];\n12 }\n13\n14 // 显示总和。\n\
  15 MessageBox.Show(\"The total is \" + total);\n```\n\n# 数组的平均值\n\n计算数值数组所有值的平均值的第一步是获取值的总和。第二步是将总和除以数组中元素的个数。下面的代码展示了一个示例：\n\
  \n```\n1 // 创建数组。\n2 double[] scores = { 92.5, 81.6, 65.7, 72.8 };\n3\n4 // 声明并初始化累加器变量。\n\
  5 // 声明一个存储平均值的变量。\n```\n\n\n\n\n当这段代码执行完成后，`average` 变量将包含 `scores` 数组中值的平均值。请注意，最后一条将\
  \ `total` 除以 `scores.length` 的语句不在循环内部。该语句应在循环完成所有迭代后执行且仅执行一次。\n\n# 在数组中寻找最大值和最小值\n\
  \n某些编程任务需要你在一组数据中找到最大值。例如，报告特定时间段最高销售额的程序、一组测试分中的最高分、给定日期范围内的最高温度等。\n\n在数组中寻找最大值的算法工作原理如下：你创建一个变量来存放最大值（下面的示例将此变量命名为\
  \ `highest`）。然后，你将索引 0 处的元素赋值给 `highest` 变量。接下来，你使用循环来遍历数组的其余元素，从元素 1 开始。循环每次迭代时，它都会将一个数组元素与\
  \ `highest` 变量进行比较。如果数组元素大于 `highest` 变量，则将该元素的值赋值给 `highest` 变量。当循环结束时，`highest`\
  \ 变量将包含数组中的最大值。图 7-24 中的流程图说明了这一逻辑。\n\n# 图 7-24 寻找数组中最大值的流程图\n\n![插图显示了寻找数组中最大值的流程图。](img/FG_07_024.png)图\
  \ 7-24 完整备用文本\n\n以下代码演示了该算法：\n\n```\n 1 // 创建数组。\n 2 int[] numbers = { 8, 1, 12,\
  \ 6, 2 };\n 3\n 4 // 声明一个变量来存放最大值，并\n 5 // 用数组中的第一个值对其初始化。\n 6 int highest = numbers[0];\n\
  \ 7\n 8 // 遍历数组的其余元素，从\n 9 // 元素 1 开始。当发现比 highest 大的值时，\n10 // 将该值赋值给 highest。\n\
  11 for (int index = 1; index < numbers.Length; index++)\n12 {\n13     if (numbers[index]\
  \ > highest)\n14     {\n15         highest = numbers[index];\n16     }\n17 }\n19\n\
  20 // 显示最大值。\n21 MessageBox.Show(\"The highest value is \" + highest);\n```\n\n\
  在某些程序中，你对寻找一组数据中的最小值比对寻找最大值更感兴趣。例如，假设你正在编写一个程序，将几名球员的高尔夫得分存储在数组中，并且你需要找到最佳得分。在尔尔夫中，分数越低越好，因此你需要一个寻找数组中最小值的算法。\n\
  \n在数组中寻找最小值的算法与寻找最高分的算法非常相似。它的工作原理如下：你创建一个变量来存放最小值（下面的示例将此变量命名为 `lowest`）。然后，你将索引\
  \ 0 处的元素赋值给 `lowest` 变量。接下来，你使用循环来遍历数组的其余元素，从元素 1 开始。循环每次迭代时，它都会将一个数组元素与 `lowest`\
  \ 变量进行比较。如果数组元素小于 `lowest` 变量，则将该元素的值赋值给 `lowest` 变量。当循环结束时，`lowest` 变量包含数组中的最小值。图\
  \ 7-25 中的流程图说明了这一逻辑。\n\n# 图 7-25 寻找数组中最小值的流程图\n\n![插图显示了寻找数组中最小值的流程图。](img/FG_07_025.png)图\
  \ 7-25 完整备用文本\n\n以下代码演示了该算法：\n\n```\n 1 // 创建数组。\n 2 int[] numbers = { 8, 1, 12,\
  \ 6, 2 };\n 3\n 4 // 声明一个变量来存放最小值，并\n 5 // 用数组中的第一个值对其初始化。\n 6 int lowest = numbers[0];\n\
  \ 7\n 8 // 遍历数组的其余元素，从\n 9 // 元素 1 开始。当发现比 lowest 小的值时，\n10 // 将该值赋值给 lowest。\n\
  11 for (int index = 1; index < numbers.Length; index++)\n12 {\n13     if (numbers[index]\
  \ < lowest)\n14     {\n15         lowest = numbers[index];\n16     }\n17 }\n19\n\
  20 // 显示最小值。\n21 MessageBox.Show(\"The lowest value is \" + lowest);\n\n部分数组\n\n\
  有时你需要将一系列项目存储在数组中，但你不知道项目的数量。结果是你不知道确切的数量。一种解决方案是让数组足够大以容纳所有可能的项目。但这会导致另一个问题：如果项目较少，数组将只有部分填充。\n\
  \n部分数组通常与一个存储数组中项目的变量配合使用。例如，在 Chap07 文件夹中你会找到一个名为 *Partially Array* 的项目。当你点击 `Go`\
  \ 按钮时，应用程序将部分填充数组。随后会显示数组的内容。图 7-26 显示了用户点击 `Go` 按钮后的状态。以下代码是 `Values` 按钮的处理程序。\n\
  \n# 图 7-26 部分数组应用程序\n\n![显示了一个显示数组的窗口。](img/FG_07_026.png)图 7-26 完整备用文本\n\n```\n\
  \ 1 private void goButton_Click(object sender, EventArgs e)\n 2 {\n 3     try\n\
  \ 4     {\n 5         // 创建一个从文件中读取的数组。\n 6         const int SIZE = 100;\n 7  \
  \       int[] numbers = new int[SIZE];\n 8\n 9         // 存储数组中项目的\n10         //\
  \ 变量\n 11         int count = 0;\n 12\n 13         // 声明 StreamReader 变量。\n 14 \
  \        StreamReader inputFile;\n 15\n 16         // 打开文件并获取 StreamReader 对象。\n\
  \ 17         inputFile = File.OpenText(\"Values.txt\");\n 18\n 19         // 将文件内容读取到数组中，直到\n\
  20         // 文件结束或数组满。\n 21         while (!inputFile.EndOfStream && count < numbers.Length)\n\
  \ 22         {\n 23             // 从文件中读取下一个项目。\n 24             numbers[count]\
  \ = int.Parse(inputFile.ReadLine());\n 25\n 26             // 计数。\n 27         \
  \    count++;\n 28         }\n 29\n 30         // 关闭文件。\n 31         inputFile.Close();\n\
  \ 32\n 33         // 在列表框中显示数组元素。\n 34         outputListBox.Items.Add(\"The file\
  \ contains \" + count +\n 35             \"items:\");\n 36\n 37         for (int\
  \ index = 0; index < count; index++)\n 38         {\n 39             outputListBox.Items.Add(numbers[index]);\n\
  \ 40         }\n 41     }\n 42     catch (Exception ex)\n 43     {\n 44        \
  \ // 显示错误消息。\n 45         MessageBox.Show(ex.Message);\n 46     }\n 47 }\n```\n\n\
  让我们详细检查代码：\n\n\n\n\n* 第 3 行是 `try`-`catch` 语句的开始，用于处理在从文件读取数据时可能产生的任何错误。\n* 第 6\
  \ 行声明了一个常量 `SIZE`，并初始化值为 100。\n* 第 7 行使用 `SIZE` 作为长度声明符声明了一个名为 `numbers` 的 `int`\
  \ 数组。因此，`values` 数组有 100 个元素。\n* 第 11 行声明了一个名为 `count` 的 `int` 变量，用于存储在 `numbers`\
  \ 数组中的项目数量。注意，`count` 被初始化为 0，因为数组中还没有存储值。\n* 第 14 行声明了一个名为 `inputFile` 的 `StreamReader`\
  \ 变量。（你在此代码示例中没有看到它，但文件顶部出现了使用 `System.IO;` 的指令。这是第 14 行中 `StreamReader` 声明所必需的。）\n\
  * 第 17 行打开一个名为 `Values.txt` 的文件进行读取。在该语句执行后，`inputFile` 变量将引用与文件相关的 `StreamReader`\
  \ 对象。\n* 第 21 行是 `while` 循环的开始，从文件中读取项目并将其赋值给 `numbers` 数组的元素。注意循环测试了两个由 `&&` 运算符连接的布尔表达式。第一个表达式是\
  \ `!inputFile.EndOfStream`。该表达式的目的是防止循环超出文件末尾。当文件中没有更多值可读时，循环停止。第二个表达式是 `count <\
  \ numbers.Length`。该表达式的目的是防止循环超出数组末尾。当数组填满时，循环将停止。\n* 在循环内部，第 24 行从文件中读取一行文本，将其转换为\
  \ `int`，并将该 `int` 赋值给 `numbers[index]`。\n* 然后，第 27 行增加 `count` 变量的值。每当一个数字赋值给数组元素时，`count`\
  \ 变量就会加 1。因此，`count` 变量持有存储在数组中的项目数量。\n* 第 31 行关闭文件。\n* 第 37–40 行中的 `for` 循环在 `outputListBox`\
  \ 控件中显示数组元素。然而，循环并没有遍历数组中的所有元素，而是只遍历包含值的元素。注意，只要 `index` 小于 `count`，循环就会迭代。因为 `count`\
  \ 包含存储在数组中的项目数量，当包含最后一个有效值的元素显示后，循环就会停止。\n\n现在你已经看到了几种处理数组内容的算法，你应该练习自己编写其中一些算法。教程\
  \ 7-2 将引导你完成编写一个程序，该程序从文件中读取数据到 `int` 数组中，然后确定数组中的最高、最低和平均值。\n\n# 图 7-27 测试平均分应用程序表单\n\
  \n![截图显示了一个显示测试平均分应用程序表单的窗口。](img/FG_07_027.png)图 7-27 完整替代文本\n\n# 图 7-28 测试平均分应用程序\n\
  \n![截图显示了一个显示测试平均分应用程序表单的窗口。](img/FG_07_028.png)图 7-28 完整替代文本\n\n# 7.6 排序和搜索数组的高级算法\n\
  \n### 概念\n\n排序算法用于将数据按照某种顺序排列。搜索算法是在较大的数据集中定位特定项目的方法。选择排序和二分查找是通的排序和搜索算法。\n\n# 选择排序算法\n\
  \n通常，数组中的数据必须按某种顺序进行排序。例如，客户列表通常按字母顺序排序。学生成绩可能从高到低排序。产品代码可以进行排序，以便所有相同颜色的产品存储在一起。在本节中，我们将探索如何编写自己的排序算法。排序算法是一种扫描数组并按某种特定顺序重新排列其内容的技术。我们探索的算法被称为选择排序。\n\
  \n选择排序的工作原理如下：找到数组中的最小值，并将其移动到元素 0。然后找到下一个较小的值并移动到元素 1。这个过程一直持续，直到所有元素都已按正确顺序放置。让我们看看选择排序在安排图\
  \ 7-29 中数组元素时是如何工作的。\n\n# 图 7-29 数组中的值\n\n![图显示了数组中的六个值。](img/FG_07_029.png)图 7-29\
  \ 完整替代文本\n\n选择排序从元素 0 开始扫描数组并找到最小值。然后将该元素与元素 0 交换。此时，数组如图 7-30 所示。\n\n# 图 7-30 交换后的数组值\n\
  \n![图显示了第一次交换后数组中的值。](img/FG_07_030.png)图 7-30 完整替代文本\n\n再次重复该过程，但元素 0 已经包含了最小值。这次从元素\
  \ 1 开始扫描。算法发现元素 5 包含下一个较小的值。将该元素与元素 2 交换，导致数组如图 7-31 所示。\n\n# 图 7-31 交换两次后的数组值\n\
  \n![图显示了两次交换后数组中的值。](img/FG_07_031.png)图 7-31 完整替代文本\n\n接下来，从元素 3 开始扫描。将其值与元素 5\
  \ 交换，导致数组如图 7-32 所示。\n\n# 图 7-32 交换三次后的数组值\n\n![图显示了交换三次后数组中的值。](img/FG_07_032.png)图\
  \ 7-32 完整替代文本\n\n此时，只剩下两个元素需要排序。算法发现元素 5 中的值比元素 4 的小，因此对它们进行交换。这使得数组处于最终状态，如图 7-34\
  \ 所示。\n\n# 图 7-33 交换四次后的数组值\n\n![图显示了交换四次后数组中的值。](img/FG_07_033.png)图 7-33 完整替代文本\n\
  \n# 图 7-34 交换五次后的数组值\n\n![图显示了交换五次后数组中的值。](img/FG_07_034.png)图 7-34 完整替代文本\n\n#\
  \ 交换数组元素\n\n正如你在选择排序算法描述中所看到的，当算法遍历数组时，某些元素会被交换。让我们简要讨论在计算机内存中交换两个项目的过程。假设有以下变量声明：\n\
  \n```\n int a = 1;\nint b = 9;\n```\n\n\n\n\n假设我们想要交换这些变量中的值，使得变量 `a` 包含 9 而变量 `b`\
  \ 包含 1。起初，你可能认为我们只需要将变量互相赋值，如下所示：\n\n```\n// 错误！以下代码并没有交换变量。\na = b;\nb = a;\n```\n\
  \n为了理解为什么这样做不起作用，让我们逐行执行代码。第一条语句是 `a = b`。这导致值 9 被赋值给 `a`。但是，之前存储在 `a` 中的值 1 发生了什么呢？记住，当你给变量赋新值时，新值会替换该变量中之前存储的任何值。因此，旧值\
  \ 1 被丢弃了。接着下一条语句是 `b = a`。由于变量 `a` 包含 9，这会将 9 赋值给 `b`。在执行这些语句后，变量 `a` 和 `b` 都包含值\
  \ 9。\n\n要成功交换两个变量的内容，我们需要第三个变量来作为临时存储位置：\n\n```\nint temp;\n```\n\n然后我们可以执行以下步骤来交换变量\
  \ `a` 和 `b` 中的值：\n\n* 将 `a` 的值赋值给 `temp`。\n* 将 `b` 的值赋值给 `a`。\n* 将 `temp` 的值赋值给\
  \ `b`。\n\n图 7-35 显示了在我们执行每个步骤时这些变量的内容。注意，在步骤完成后，`a` 和 `b` 中的值已经交换了。\n\n# 图 7-35\
  \ 交换 `a` 和 `b` 的值\n\n![插图显示了交换 a 和 b 值的四个步骤。](img/FG_07_035.png)图 7-35 完整替代文本\n\n\
  以下是一个 `Swap` 方法的代码，我们可以它交换 `int` 类型的值：\n\n```\n 1 private void Swap(ref int a, ref\
  \ int b)\n2\uFEFF {\n3\uFEFF     int temp = a;\n4\uFEFF     a = b;\n5\uFEFF    \
  \ b = temp;\n6 }\n```\n\n### 注意\n\n在 `Swap` 方法中使用引用参数至关重要，因为该方法必须能够更改作为参数传递给它的项目的值。\n\
  \n让我们来看一个演示选择排序算法的完整程序。在学生示例程序的 `Chap07` 文件夹中，你将找到一个名为 `Selection Sort` 的项目。图 7-36\
  \ 显示了应用程序的表单。在左侧，你看到 `Designer` 中的表单，带有各种控件的名称。在右侧，你看到的是点击 `Go` 按钮后的运行时表单。当你点击 `Go`\
  \ 按钮时，会发生以下操作：\n\n# 图 7-36 选择排序应用程序的表单\n\n![一组截图显示了设计器和运行时的选择排序应用程序表单。](img/FG_07_036.png)图\
  \ 7-36 完整替代文本\n\n* 创建一个 `int` 数组，并用未排序的值初始化。\n* 数组的内容显示在 `originalListBox` 控件中。\n\
  * 数组作为参数传递给 `SelectionSort` 方法。该方法使用选择排序算法对数组进行排序。\n* 数组的内容显示在 `sortedListBox` 控件中。\n\
  \n程序 7-3 显示了 Selection Sort 应用程序的完整代码。\n\n# 二分查找算法\n\n在本章之前，我们讨论了顺序查找算法，它使用循环从第一个元素开始顺序遍历数组。它将每个元素与要查找的值进行比较，并在找到值或遇到数组末时停止。如果要查找的值不在数组中，算法将搜索到数组末尾并返回失败。\n\
  \n顺序查找的优点在于它的简单性：它非常容易理解和实现。此外，它不需要数组中的数据存储在任何特定顺序。然而，它的缺点是效率低下。如果搜索的数组包含 20,000\
  \ 个元素，算法必须顺序查看所有 20,000 个元素才能找到存储在最后一个元素中的值。\n\n在平均情况下，在开头找到项目和在结尾找到项目的概率是相等的。（注：原文此处包含重复/乱码句子，已进行清理以提高清晰度，同时保持了核心逻辑）。\n\
  \n二分查找是一种聪明的算法，比顺序查找高效得多。它唯一的要求是数组中的值必须按升序排列。该算法不是测试数组的第一个元素，而是从中间开始。如果数组中间的元素包含所需的值，则搜索结束。否则，中间的值要么大于要么小于要查找的值。如果大于，那么所需的值（如果在列表中的话）将在数组的前半部分找到。如果小于，那么所需的值（如果在列表中的话）将在数组的后半部分找到。在任何情况下，数组的一半都被排除了。\n\
  \n如果在中间元素没有找到所需的值，则对可能包含该值的数组部分重复该过程。\n\n以下是对数组执行二分查找的的伪代码：\n\n```\n Method BinarySearch(array,\
  \ searchValue)\n\n  Set first to 0\n\n  Set last to the last subscript in the array\n\
  \n  Set position to −1\n\n  Set found to false\n\n  While found is not true and\
  \ first is less than or equal to last\n\n    Set middle to the subscript half between\
  \ array[first]and array[last]\n\n    If array[middle] equals searchValue\n\n   \
  \     Set found to true\n\n        Set position to middle\n\n    Else If array[middle]\
  \ is greater than searchValue\n\n        Set last to middle −1\n\n    Else\n\n \
  \       Set first to middle +1\n\n  End If\n\n  End While\n\n  Return position\n\
  \nEnd Method\n```\n\n该算法使用三个变量标记数组中的位置：`first`、`last` 和 `middle`。`first` 和 `last`\
  \ 变量标记正在搜索的数组边界。它们初始化为数组第一个和最后一个元素的下标。first 和 last 中间的元素下标被计算并存储在 `middle` 变量中。如果数组中间的元素不包含的值，则调整\
  \ `first` 或 `last` 变量，以便在下一次迭代中只搜索数组的上半或下半部分。\n\n\n\n\n\n以下 C# 方法对整数数组执行二分查找。第一个参数\
  \ `iArray` 用于查找存储在 `value` 中的数字出现的位置。如果找到了该数字，则返回其数组下标。否则，返回 `-1`，表示该值未出现在数组中。\n\
  \n```csharp\n 1 private int BinarySearch(int[] iArray, int value)\n 2 {\n 3    \
  \ int first = 0;                // 数组第一个元素\n 4     int last = iArray.Length − 1;\
  \ // 数组最后一个元素\n 5     int middle;                   // 查找中间点\n 6     int position\
  \ = −1;            // 查找值的位置\n 7     bool found = false;           // 标志位\n \n 9\
  \     // 查找该值。\n10     while (!found && first <= last)\n11     {\n12         //\
  \ 计算中间点。\n13         middle = (first + last) / 2;\n14\n15         // 如果在中间找到了值 .\
  \ . .\n16         if (iArray[middle] == value)\n17         {\n18             found\
  \ = true;\n19             position = middle;\n20         }\n21         // 否则值在下半部分\
  \ . . .\n22         else if (iArray[middle] > value)\n23         {\n24         \
  \    last = middle − 1;\n25         }\n26         // 否则值在上半部分 . . .\n27        \
  \ else\n28         {\n29             first = middle + 1;\n30         }\n31     }\n\
  32\n33     // 返回项的位置，如果未找到\n34     // 则返回 −1。\n35     return position;\n36 }\n```\n\
  \n如果你想查看使用二分查找算法的完整应用程序，请查看位于“学生示例程序”中 `Chap07` 文件夹下的 `Binary Search` 项目。它从文件中加载名称列表到数组中，然后执行二分查找以在数组中查找特定名称。\n\
  \n# 检查点\n\n1. 7.14 什么是搜索算法？\n2. 7.15 排序算法的什么？\n3. 7.16 二分查找算法的唯一要求是什么？\n\n# 7.7\
  \ 二维数组\n\n### 概念\n\n二维数组就像几个完全相同的数组组合在一起。它适用于存储多组数据。\n\n你到目前为止学过的数组被称为一维数组。它们被称为一维数组是因为它们只能包含一组数据。而二维数组（也称为\
  \ `2D arrays`）可以包含多组数据。将二维数组想象成具有行和列元素的数组，如图图 7-37 所示。该图显示了一个具有三行四列的二维数组。注意，行编号为\
  \ 0、1 和 2，列编号为 0、1、2 和 3。数组中总共有 12 个元素。\n\n# 图 7-37 二维数组\n\n![一张图表显示了一个具有行和列元素的二维数组。](img/FG_07_037.png)图\
  \ 7-37 完整备用文本\n\n二维数组对于处理多组数据非常有用。例如，假设你正在为一名老师设计一个成绩平均分程序。老师有六个学生，每个学生在学期内参加了五次考试。一种方法是创建六个一维数组，每个学生一个。每个数组有五个元素，对应每个考试的分数。然而，这种方法会很繁琐，因为你必须单独处理每个数组。更好的方法是使用一个具有六行（每个学生一行）和五列（每个考试分数一列）的二维数组，如图图\
  \ 7-38](#fileP7001016012000000000000000005F86.xhtml_P7001016012000000000000000005F96)所示。\n\
  \n# 图 7-38 具有六行五列的二维数组\n\n![一张图表显示了一个具有行和列元素的二维数组。](img/FG_07_038.png)图 7-38 完整备用文本\n\
  \n# 声明二维数组\n\n要声明二维数组需要两个尺寸声明符：第一个用于行数，第二个用于列数。这是一个具有三行四列的二维数组声明示例：\n\n```csharp\n\
  double[,] scores = new double[3, 4];\n```\n\n注意括号内的逗号。这里的 `scores` 表示一个二维数组。数字 `3`\
  \ 和 `4` 是声明符。与一维数组一样，最好使用命名常量作为声明符。例如：\n\n```csharp\nint ROWS = 3;\nint COLS = 4;\n\
  double[,] scores = new double[ROWS, COLS];\n```\n\n# 访问二维数组的元素\n\n要访问二维数组的元素，必须使用两个下标。例如，假设有如下\
  \ `scores` 声明：\n\n```csharp\nscores[2,1] = 95;\n```\n\n程序通常使用嵌套循环处理二维数组。例如，以下代码为\
  \ `values` 数组的每个元素分配随机数：\n\n```csharp\n// 创建一个随机对象。\nRandom rand = new Random();\n\
  \n// 创建二维数组。\nconst int ROWS = 5;\nconst int COLS = 10;\nint[,] values = new int[ROWS,\
  \ COLS];\n\n// 用随机数填充数组。\nfor (int row = 0; row < ROWS; row++)\n{\n    for (int\
  \ col = 0; col < COLS; col++)\n    {\n        values[row, col] = rand.Next(100);\n\
  \    }\n}\n```\n\n并且以下嵌套循环将 `values` 数组的所有元素显示在名为 `outputListBox` 的 ListBox 中：\n\
  \n```csharp\n// 显示内容。\nfor (int row = 0; row < ROWS; row++)\n{\n    for (int col\
  \ = 0; col < COLS; col++)\n    {\n        outputListBox.Items.Add(values[row, col].ToString());\n\
  \    }\n}\n```\n\n# 二维数组的隐式尺寸确定与初始化\n\n与一维数组一样，你可以为二维数组提供初始化列表。回想一下，当你为数组提供初始化列表时，不能提供下标数字。在初始化二维数组时，必须提供逗号来指示维度。以下是带有初始化列表的二维数组声明示例：\n\
  \n```csharp\nint[,] values = { {1, 2, 3},\n                  {4, 5, 6},\n      \
  \            {7, 8, 9} };\n```\n\n每行的初始化值封装在自己的括号中。在这个示例中，行 0 的初始化值为 `{1, 2, 3}`，行\
  \ 1 的初始化值为 `{4, 5, 6}`，行 2 的初始化值为 `{7, 8, 9}`。因此，该语句声明了一个三行三列的数组。\n\n\n\n\n\n```\n\
  values[0, 0] is set to 1.\nvalues[0, 1] is set to 2.\nvalues[0, 2] is set to 3.\n\
  values[1, 0] is set to 4.\nvalues[1, 1] is set to 5.\nvalues[1, 2] is set to 6.\n\
  values[2, 0] is set to 7.\nvalues[2, 1] is set to 8.\nvalues[2, 2] is set to 9.\n\
  ```\n\n教程 7-3 将为你提供操作二维数组的实操练习。\n\n# 求和二维数组的所有元素\n\n要求出二维数组中所有元素的和，你可以使用一对嵌套循环，将每个元素的内容加到一个累加器中。以下代码显示了一个示例：\n\
  \n```sharp\n 1\uFEFF const int ROWS = 3;\n 2\uFEFF const int COLS = 3;\n 3\uFEFF\
  \ int[,] numbers = { {1, 2, 3, 4},\n 4                    {5, 6, 7, 8},\n 5    \
  \                {9, 10, 11, 12}\n 6\uFEFF                  };\n 7\uFEFF\n 8 int\
  \ total = 0; // 累加器，设置为 0\n 9\uFEFF\n10 // 求数组元素的和。 \n11 for (int row = 0; row <\
  \ ROWS; row++)\n12 {\n13     for (int col = 0; col < COLS; col++)\n14     {\n15\
  \         total += numbers[row, col];\n16     }\n17 }\n18 // 显示和。\n19 MessageBox.Show(\"\
  The total is \" + total);\n```\n\n# 求二维数组的行和\n\n有时，你可能需要计算二维数组中每一行的和。例如，假设用一个二维数组来存储一组学生的测试成绩。数组中的每一行代表一个学生的测试成绩。要获取某位学生测试成绩的总和（可能是为了计算平均分），你使用循环将某一行中的所有元素相加。以下代码显示了一个示例：\n\
  \n```sharp\n 1\uFEFF const int ROWS = 3;\n 2\uFEFF const int COLS = 3;\n 3\uFEFF\
  \ int[,] numbers = { {1, 2, 3, 4},\n 4                    {5, 6, 7, 8},\n 5    \
  \                {9, 10, 11, 12}\n 6\uFEFF                  };\n 7\uFEFF\n 8 int\
  \ total;  // 累加器\n 9\uFEFF\n10 // 求数组中每一行的和。\n11 for (int row = 0; row < ROWS; row++)\n\
  12 {\n13     // 将累加器设置为 0。\n14     total = 0;\n15\n16     // 计算行的总和。\n17     for\
  \ (int col = 0; col < COLS; col++)\n18     {\n19         total += numbers[row, col];\n\
  20     }\n21\n22     // 显示该行的总和。\n23     MessageBox.Show(\"The total of row \" +\
  \ row +\n24                     \" is \" + total);\n25 }\n```\n\n# 求二维数组的列和\n\n\
  有时，你可能需要计算二维数组中每一列的和。例如，假设用一个二维数组存储一组学生的测试成绩，而你希望计算每项测试的级平均分。为了实现这一点，你需要计算数组中每一列的平均值。这通过一组嵌套循环来实现。外层循环控制列下标，内层循环控制行下标。内层循环计算列的和，并存储在累加器中。以下代码演示了：\n\
  \n```sharp\n 1\uFEFF const int ROWS = 3;\n 2\uFEFF const int COLS = 4;\n 3\uFEFF\
  \ int[,] numbers = { {1, 2, 3, 4},\n 4\uFEFF                    {5, 6, 7, 8},\n\
  \ 5\uFEFF                    {9, 10, 11, 12}\n 6\uFEFF                  };\n 7\uFEFF\
  \n 8\uFEFF int total;   // 累加器\n 9\uFEFF\n10 // 求数组中每一列的和。\n11 for (int col = 0;\
  \ col < COLS; col++)\n12 {\n13     // 将累加器设置为 0。\n14     total = 0;\n15\n16    \
  \ // 计算列的总和。\n17     for (int row = 0; row < ROWS; row++)\n18     {\n19        \
  \ total += numbers[row, col];\n20     }\n21\n22     // 显示该列的总和。\n23     MessageBox.Show(\"\
  The total of column \" + col +\n24                     \" is \" + total);\n25 }\n\
  ```\n\n# 检查点\n\n1.  7.17 下列数组中有多少行、多少列？\n    ```csharp\n    int[,] values = new\
  \ decimal[200, 100];\n    ```\n2.  7.18 编写一条语句，将值 50 赋值给检查点 7.17 中定义的 values 数组的最后一个元素。\n\
  3.  7.19 为以下数据编写一个二维 int 数组声明：\n    | 12 | 24 | 32 | 21 |\n    | 99 | 8 | 68 | 92\
  \ |\n    | 95 | 34 | 21 | 11 |\n\n# 错错数组 (Jagged Arrays)\n\n交错数组类似于二维数组，但交错数组的每行长度可以不同。在传统的二维数组中，每一行的列数都是相同的。在心理上，我们将二维数组设化为矩形结构。图\
  \ 7-1 出于此原因，二维数组有时被称为矩形数组。\n\n交错数组类似于二维数组，但交错数组的每行长度可以不同。\n\n```csharp\nint[][]\
  \ jaggedArray = new int[3][];\njaggedArray[0] = new int[] { 1, 2, 3, 4 };\njaggedArray[1]\
  \ = new int[] { 5, 6, 7, 8 };\njaggedArray[2] = new int[] { 9, 10, 11, 12 };\n```\n\
  \n要访问交错数组中特定行和列的项，你需要将行和列下标分别封装在自己的括号中。例如，以下语句显示第 1 行第 2 列的值：\n\n```csharp\nMessageBox.Show(jaggedArray[1][2].ToString());\n\
  ```\n\n以下语句显示了另一个示例。它将值 99 赋值给 jaggedArray 的第 0 行第 3 列：\n\n```csharp\njaggedArray[0][3]\
  \ = 99;\n```\n\n交错数组有一个 `Length` 属性用于表示行数，然后每行都有自己的 `Length` 属性。你可以使用某行的 `Length`\
  \ 属性来确定该行的列数。例如，以下嵌套循环显示了 jaggedArray 中存储的所有值：\n\n```csharp\nfor (int row = 0; row\
  \ < jaggedArray.Length; row++)\n{\n    for (int col = 0; col < jaggedArray[row].Length;\
  \ col++)\n    {\n        MessageBox.Show(jaggedArray[row][col].ToString());\n  \
  \  }\n}\n```\n\n\n\n\n\n| 3 | 5 | 7 | 9 |  |\n| 5 | 9 | 11 | 17 | 21 |\n\n# 7.9\
  \ `List` 集合\n\n### 概念\n\nList 是 .NET Framework 中的一个类，与数组类似。与数组不同，`List` 对象的大小会自动进行调整，以适应存储在其中的项目数量。\n\
  \n.NET Framework 提供了一个名为 `List` 的类，用于存储和检索项目。一旦你创建了 `List` 对象，你就可以将其看作一个存放其他对象的容器。`List`\
  \ 对象与数组相似，但比数组具有许多优势。以下是其中几点：\n\n-   当你创建一个一个 `List` 对象时，你不需要知道想要存储在其中的项目数量。\n-\
  \   当向 `List` 中添加项目时，`List` 对象会自动扩展。\n-   除了向 `List` 中添加项目外，你还可以移除项目。\n-   当从 `List`\
  \ 中移除项目时，`List` 对象会自动收缩。\n\n## 创建 `List`\n\n以下是一个显示如何创建一个用于存储字符串的 `List` 对象的示例：\n\
  \n```\nList<string> nameList = new List<string>();\n```\n\n该语句创建了一个 `List` 对象，由变量\
  \ `nameList` 引用。注意，在此示例中，单词 `string` 写在紧跟单词 `List` 之后的尖括号 `<>` 中。这指定了该 `List` 可以持有\
  \ `string` 数据类型的对象。如果你尝试向此 `List` 存储任何其他类型的对象，将会发生错误。\n\n以下是一个如何创建一个用于存储整数的 `List`\
  \ 对象的示例：\n\n```\nList<int> numberList = new List<int>();\n```\n\n该语句创建了一个 `List`\
  \ 对象，由变量 `numberList` 引用。注意，在此示例中，单词 `int` 写在紧跟单词 `List` 之后的尖括号 `<>` 中。\n\n## 初始化\
  \ `List`\n\n你可以在声明 `List` 对象时选择性地初始化它。以下是一个示例：\n\n```\nList<int> numberList = new\
  \ List<int>() { 1, 2, 3 };\n```\n\n该语句创建了一个可以包含整数的 `List` 对象，并用值 1、2 和 3 初始化了它。以下是一个创建一个用于存储字符串的\
  \ `List` 对象并用三个字符串初始化的示例：\n\n```\nList<string> nameList = new List<string>() { \"\
  Chris\",\n    \"Kathryn\", \"Bill\" };\n```\n\n## 向 `List` 添加项目\n\n要向现有的 `List`\
  \ 对象添加项目，请使用 `Add` 方法。例如，以下语句创建了一个 `List` 对象并向其添加了一系列字符串：\n\n```\nList<string> nameList\
  \ = new List<string>();\nnameList.Add(\"Chris\");\nnameList.Add(\"Kathryn\");\n\
  nameList.Add(\"Bill\");\n```\n\n执行这些语句后，`nameList` 对象将持有三个字符串 `\"Chris\"`、`\"Kathryn\"\
  ` 和 `\"Bill\"`。\n\n存储在 `List` 中的项目具有对应的索引。索引指定项目在 `List` 中的位置，因此它非常像数组下标。第一个添加到\
  \ `List` 的项目存储在索引 0 处。下一个添加到 `List` 的项目存储在索引 1 处，以此类推。在执行之前显示的语句后，`\"Chris\"` 存储在索引\
  \ 0，`\"Kathryn\"` 存储在索引 1，`\"Bill\"` 存储在索引 2。\n\n## Count 属性\n\n`List` 对象有一个 `Count`\
  \ 属性，用于持有存储在 `List` 中的项目数量。例如，以下语句使用 `Count` 属性显示存储在 `nameList` 中的项目数量：\n\n```\n\
  MessageBox.Show(\"The List has \" + nameList.Count +\n                \" objects\
  \ stored in it.\");\n```\n\n假设 `nameList` 持有字符串 `\"Chris\"`、`\"Kathryn\"` 和 `\"\
  Bill\"`，以下语句将在消息框中显示：\n\n```\nThe List has 3 objects stored in it.\n```\n\n## 访问\
  \ `List` 中的项目\n\n你可以使用下标表示法来访问 `List` 中的项目，就像访问数组一样。例如，以下 `for` 循环显示了 `nameList`\
  \ 对象中的项目：\n\n```\nfor (int index = 0; index < nameList.Count; index++)\n{\n    MessageBox.Show(nameList[index]);\n\
  }\n```\n\n注意，循环在测试表达式中使用 `List` 对象的 `Count` 属性来控制迭代次数。以下是一个从文本文件读取值并将其添加到 `List`\
  \ 中的示例：\n\n```\n1 // 打开 Names.txt 文件。\n2 StreamReader inputFile = File.OpenText(\"\
  Names.txt\");\n3\n4 // 创建一个持有字符串的 List 对象。\n5 List<string> nameList = new List<string>();\n\
  6\n7 // 读取文件内容。\n8 while (!inputFile.EndOfStream)\n9 {\n10     // 读取一行并将其添加到 List\
  \ 中。\n11     nameList.Add(inputFile.ReadLine());\n12 }\n```\n\n让我们仔细看看这段代码：\n\n\
  -   第 2 行打开一个名为 `Names.txt` 的文件，并将其与 `inputFile` 引用的 `StreamReader` 对象关联。\n-   第\
  \ 5 行创建了一个持有字符串的 `List` 对象，由 `nameList` 引用。\n-   第 8 行启动了一个 `while` 循环，直到 `inputFile.EndOfStream`\
  \ 为真。\n-   第 11 行读取一行并使用 `nameList.Add()` 将其添加到 `List`。\n\n执行代码后，`nameList` 包含了文件中的行。你可以使用\
  \ `foreach` 循环遍历项目，就像遍历数组一样：\n\n```\nforeach (string str in nameList)\n{\n    MessageBox.Show(str);\n\
  }\n```\n\n## 向方法传递 `List`\n\n有时你希望编写一个接受 `List` 并执行操作的方法。例如，以下代码显示了 `DisplayList`：\n\
  \n```\n1 private void DisplayList(List<string> sList)\n2 {\n3     foreach (string\
  \ str in sList)\n4         MessageBox.Show(str);\n5 }\n```\n\n注意第 1 行，参数命名为 `sList`\
  \ 类型为 `List<string>`。调用此方法时，你必须传递 `List` 对象作为参数。\n\n```\n1 // 创建一个字符串列表。\n2 List<string>\
  \ nameList = new List<string>() { \"Chris\",\n3     \"Kathryn\", \"Bill\" };\n4\n\
  5 // 将 List 传递给 DisplayList。\n6 DisplayList(nameList);\n```\n\n### 注意\n\n`List`\
  \ 对象像数组一样总是通过引用传递。\n\n## 从 `List` 移除项目\n\n你可以使用 `RemoveAt` 方法从特定索引处移除项目。以下代码是一个示例：\n\
  \n```\n1 // 创建一个字符串列表。\n2 List<string> nameList = new List<string>() { \"Chris\"\
  ,\n3     \"Kathryn\", \"Bill\" };\n4\n5 // 移除索引 0 的项目。\n6 nameList.RemoveAt(0);\n\
  ```\n\n第 2 行和第 3 行语句创建一个包含字符串 `\"Chris\"`、`\"Kathryn\"` 和 `\"Bill\"` 的 `List`。然后，第\
  \ 6 行语句移除了索引 0 的字符串。执行此语句后，`List` 包含 `\"Kathryn\"` 和 `\"Bill\"`。\n\n如果你知道要从 `List`\
  \ 中移除的项目的值，但不知道该项目的索引，可以使用 `Remove` 方法。你将要移除的项目作为参数传递，`Remove` 方法会在 `List` 中搜索该项目。如果找到了该项目，它就会被移除。以下是一个示例：\n\
  \n```\n1 // 创建一个字符串列表。\n2 List<string> nameList = new List<string>() { \"Chris\"\
  ,\n3     \"Kathryn\", \"Bill\" };\n4\n5 // 从 List 中移除 \"Bill\"。\n6 nameList.Remove(\"\
  Bill\");\n```\n\n\n\n\n第 2 行和第 3 行的语句创建了一个包含字符串 `\"Chris\"`、`\"Kathryn\"` 和 `\"\
  Bill\"` 的 `List`。然后，第 6 行的语句从 `List` 中移除 `\"Bill\"`。执行该语句后，`List` 包含字符串 `\"Chris\"\
  ` 和 `\"Kathryn\"`。\n\n`Remove` 方法返回一个布尔值，表示该项是否已从 `List` 中实际删除。如果在 `List` 中找到了指定的项并将其删除，`Remove`\
  \ 方法返回 `true`。如果未在 `List` 中找到该项，`Remove` 方法返回 `false`。下面的代码演示了如何使用该方法的返回值：\n\n```\n\
  \ 1 // 创建一个字符串列表。\n2 List<string> nameList = new List<string>() { \"Chris\",\n3\
  \     \"Kathryn\", \"Bill\" };\n4\n5 // 移除 \"Susan\"。\n6 if (!nameList.Remove(\"\
  Susan\"))\n7 {\n8     MessageBox.Show(\"Susan was not found.\");\n9 }\n```\n\n第\
  \ 2 行和第 3 行的语句创建了一个包含字符串 `\"Chris\"`、`\"Kathryn\"` 和 `\"Bill\"` 的 `List`。然后，第 6\
  \ 行的语句尝试从 `List` 中移除 `\"Susan\"`。该 `List` 不包含字符串 `\"Susan\"`，因此 `Remove` 方法返回 `false`。显示消息“Susan\
  \ was not found”。执行此代码后，`List` 仍然包含字符串 `\"Chris\"`、`\"Kathryn\"` 和 `\"Bill\"`。\n\
  \n## Note\n\n`Remove` 方法通过执行顺序查找来定位指定的项。如果 `List` 包含大量项，其性能将会很慢。\n\n如果你想从 `List`\
  \ 中移除所有项，可以调用 `Clear` 方法。这里有一个示例：\n\n```\nnameList.Clear();\n```\n\n执行该语句后，`nameList`\
  \ 对象将变为空。\n\n## 插入项\n\n你可以使用 `Insert` 方法在 `List` 的特定索引处插入一个项。下面的代码显示了一个示例：\n\n```\n\
  \ 1 // 创建一个字符串列表。\n2 List<string> nameList = new List<string>() { \"Chris\",\n3\
  \     \"Kathryn\", \"Bill\" };\n4\n5 // 在索引 0 处插入一个项。\n6 nameList.Insert(\"Joanne\"\
  , 0);\n```\n\n第 2 行和第 3 行的语句创建了一个包含字符串 `\"Chris\"`、`\"Kathryn\"` 和 `\"Bill\"` 的\
  \ `List`。然后，第 6 行的语句在索引 0 处插入字符串 `\"Joanne\"`。执行该语句后，`List` 包含字符串 `\"Joanne\"`、`\"\
  Chris\"`、`\"Kathryn\"` 和 `\"Bill\"`。\n\n## Note\n\n如果指定的索引小于 0 或大于 `List` 对象的 `Count`\
  \ 属性，将发生异常。\n\n## 在 List 中查找项\n\n由于你可以使用下标法访问 `List` 中的项，因此你可以调整在本章之前看到的任何数组处理算法，使其能够适用于\
  \ `List`。例如，你可以编写代码在 `List` 上执行顺序查找、二分查找、选择排序等操作。\n\n然而，在 `List` 中查找项的一种简便方法是使用\
  \ `IndexOf` 方法。`IndexOf` 方法接受一个值作为参数，并在 `List` 中搜索该值。如果找到了该值，方法返回其索引。如果未找到该值，方法返回\
  \ −1。下面的代码显示了一个示例：\n\n```\n 1 // 创建一个字符串列表。\n2 List<string> nameList = new List<string>()\
  \ { \"Chris\",\n3     \"Kathryn\", \"Bill\" };\n4\n5 // 查找 \"Kathryn\"。\n6 int position\
  \ = nameList.IndexOf(\"Kathryn\");\n7\n8 // 在 List 中找到 Kathryn 了吗？\n9 if (position\
  \ != −1)\n10 {\n11     MessageBox.Show(\"Kathryn was found at index \" +\n12   \
  \                  position);\n13 }\n14 else\n15 {\n16     MessageBox.Show(\"Kathryn\
  \ was not found.\");\n17 }\n```\n\n第 2 行和第 3 行的语句创建了一个包含字符串 `\"Chris\"`、`\"Kathryn\"\
  ` 和 `\"Bill\"` 的 `List`。第 6 行的语句调用 `IndexOf` 方法在 `List` 中查找 `\"Kathryn\"`。方法返回的值被赋值给变量\
  \ `position`。执行该语句后，`position` 变量包含 `\"Kathryn\"` 的索引，或者在 `List` 中未找到 `\"Kathryn\"\
  ` 时为 −1。第 9 到第 17 行的 `if` 语句根据是否找到 `\"Kathryn\"` 显示两条可能的消息之一。（如果执行此代码，它将显示消息“Kathryn\
  \ was found at index 1”。）\n\n`IndexOf` 方法还有两个版本，允许你指定需要搜索的 `List` 区域。下面的语句显示了其中一个的示例：\n\
  \n```\nposition = nameList.IndexOf(\"Diane\", 2);\n```\n\n注意，向 `IndexOf` 方法传递了两个参数。第一个参数\
  \ `\"Diane\"` 是要查找的项。第二个参数 `2` 是搜索的起始索引。这指定搜索应从索引 2 开始，并到 `List` 中的最后一个项结束。\n\n\
  ## Note\n\n`IndexOf` 方法通过执行顺序查找来定位指定的项。如果 `List` 包含大量项，其性能将会很慢。\n\n在教程 7-4 中，你将完成一个读取文件内容并对其进行各种操作的应用程序。\n\
