  \n## 7. 电子邮件通讯录\n\n创建一个名为 `PersonEntry` 的类的应用程序。`PersonEntry` 类应具有一个人的姓名、电子邮件地址和电话号码的属性。此外，创建一个文本文件，其中包含至少五个人的姓名、电子邮件地址和电话号码。当应用程序启动时，它应该从文件中读取数据，并为每个人的数据创建一个\
