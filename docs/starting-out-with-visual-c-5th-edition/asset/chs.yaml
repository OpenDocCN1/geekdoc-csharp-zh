  ## 1.7 程序开发过程\n\n### 概念\n\n\n# 程序开发周期\n\n在本章之前，你已经学习了程序员通常使用 `C#` 等高级语言来创建程序。然而，创建一个程序的程序远比编写代码复杂得多。创建一个正确运行的程序通常需要图\
  \ 1-25 所示的六个阶段。整个过程被称为程序开发周期。\n\n# 图 1-25 程序开发周期\n\n![显示了程序开发中的步骤。](img/FG_01_025.png)\
  \ 图 1-25 备用文本\n让我们仔细查看循环中的每个阶段。\n\n1. **理解程序的目的**\n   在开始一个新的编程项目时，理解程序要做什么至关重要。大多数程序执行以下三个步骤：\n\
  \   - 步骤 1：接收输入。\n   - 步骤 2：执行某些处理。\n   - 步骤 3：产生输出。\n\n\n例如，假设你要求编写一个计算总工资的程序。以下是程序的输入、处理和输出摘要：\n\
  \   - 输入：\n     - 输入员工工作的小时。\n     - 输入员工的时薪率。\n   - 处理：\n     - 将工作小时乘以时薪率。结果就是员工的总工资。\n\
  \   - 输出：\n\n2. **设计 GUI**\n   一旦你清楚地理解程序要做什么，就可以开始设计它的 GUI。通常，为程序显示的每个表单画草图会很有帮助。例如，如果你正在设计一个计算总工资的程序，图\
  \ 1-26 展示了你可以如何勾勒程序的表单。\n\n# 图 1-26 表单草图\n\n![显示程序表单的草图。](img/FG_01_026.png) 图 1-26\
  \ 备用文本\n\n\n\n\n\n一旦你对程序表单的草图感到满意，就可以开始在计算机上创建实际表单了。作为一名 Visual C# 程序员，你拥有一个名为 Visual\
  \ Studio 的强大环境供使用。Visual Studio 为你提供了一个“所见即所得”的编辑器，允许你视觉化地设计程序表单。你可以使用 Visual Studio\
  \ 创建程序表单，在表单上放置所有必要的控件，并设置每个控件的属性以获得所需的外观。例如，图 1-27 显示了你为工资计算器程序创建的实际表单，该程序用于计算总工资。\n\
  \n## 图 1-27 工资计算器程序的表单\n\n\n## 3. 设计程序的逻辑\n\n在这个阶段，你将程序必须执行的每个任务分解为一系列逻辑步骤。例如，如果你回看图\
  \ 1-27，你会发现工资计算程序的表单有一个显示“Calculate Gross Pay”（计算总工资）的`Button`控件。当用户点击此按钮时，你希望程序显示员工的总工资。以下是程序执行该任务应采取的步骤：\n\
  \n1. 第 1 步：从相应的`TextBox` 获取工作小时数。\n2. 第 2 步：从相应的`TextBox` 获取时薪率。\n3. 第 3 步：用工作小时数乘以时薪计算总工资。\n\
  \n这是一个算法的示例，它是执行任务时必须采取的一系列定义良好的逻辑步骤。以这种纯英语陈述写出的算法被称为伪代码（pseudocode）。（*pseudo* 一词的意思是“虚假的”，所以伪代码就是虚假的代码。）在尝试编写任何实际代码之前，用伪代码非正式地写出算法步骤的过程，这对于你设计程序非常有帮助。因为你不需要担心违反任何语法规则，可以专注于程序必须执行的逻辑步骤。\n\
  \n流程图是程序员用于设计程序的另一种工具。流程图是用图形方式描述算法步骤的图表。图 1-28 显示了你可能如何为工资计算器算法创建一个流程图。注意流程图中有三种符号：椭圆、平行四边形和矩形。这些符号中的每一个代表算法中的一个步骤，描述如下：\n\
  \n* 出现在流程图顶部和底部的椭圆称为终端符号。`Start`终端符号标记程序的起点，而`End`终端符号标记程序的终点。\n* 平行四边形用作输入符号和输出符号。它们代表程序读取输入或显示输出的步骤。\n\
  * 矩形用作处理符号。它们代表程序对数据进行某些处理的步骤，例如数学计算。\n## 图 1-28 工资计算器程序的流程图\n\n![流程图显示了工资计算器程序涉及的步骤，用不同的符号表示：椭圆、平行四边形和矩形。](img/FG_01_028.png)图\
  \ 1-28 完整备用文本\n\n符号由代表程序“流”的箭头连接。要按照正确的顺序遍历符号，你从`Start`终端开始，并顺着箭头移动直到到达`End`终端。\n\
  \n## 4. 编写代码\n\n\n## 5. 纠正语法错误\n\n你之前在本章中学习过，像 C# 这样的编程语言具有在编写程序时必须遵守的规则，称为语法。语言的语法规则规定了关键字、运算符和标点字符的使用方式等。如果程序员违反了任何这些规则，就会发生语法错误。如果程序包含语法错误，即使是拼错关键字等简单错误，程序也无法编译或执行。\n\
  \n## 6. 测试程序并纠正逻辑错误\n\n一旦代码变为可形式，你就必须对其进行测试以确定是否存在逻辑错误。逻辑错误是一种不会阻止程序运行但会导致产生错误结果的错误。（数学错误很常见。）如果程序产生错误的结果，程序员必须对代码进行调试。这意味着程序员发现并修正逻辑。有时在这个过程中，程序员发现程序的原始设计必须更改。在这种情况下，程序开发将重新开始并继续。\n\
