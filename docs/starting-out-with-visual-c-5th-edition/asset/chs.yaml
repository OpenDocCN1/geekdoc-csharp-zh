  \ 5-34 完整替代文本\n\n### 注意\n\n你是否注意到之前的代码示例按顺序读取 `Students.txt` 文件中的项目，从文件开头到文件结尾？回想一下我们之前的讨论。\n\
  \n\n\n\n\n*   `Line 25`: 此语句用于关闭文件。\n\n# 使用循环读取文件并检测文件结束\n\n很多时候，程序必须读取文件的内容，但并并文件中文件中存储了多少个项目。例如，假设你需要编写一个程序来显示文件中的所有项目，但你不知道文件中包含多少个项目。你可以打开文件，然后使用循环反复从文件中读取一个项目并将其显示。然而，如果程序尝试读取文件末尾之后的内容，将会抛出异常。程序需要某种方法来判断何时到达文件末尾，这样它就不会尝试读取末尾之后的内容。下面的伪代码显示了逻辑：\n\
  \n```\n 打开文件\n当未到达文件末尾时：\n  从文件中读取一个项目\n  显示该项目\n结束循环\n 关闭文件\n```\n\n`StreamReader`\
  \ 对象有一个命名为 `EndOfStream` 的布尔属性，它用于指示是否已到达文件末尾。如果文件的读取位置位于文件末尾（且没有更多数据可读），则 `EndOfStream`\
  \ 属性被设置为 `true`。否则，它被设置为 `false`。当你需要读取文件中的所有项目但又不知道文件中包含多少个项目时，你可以编写一个循环，只要 `EndOfStream`\
  \ 属性为 `false` 就一直迭代。\n\n假设 `inputFile` 引用一个与已打开文件关联的 `StreamReader` 对象。你可以按照以下方式编写循环：\n\
  \n```\n while (inputFile.EndOfStream == false)\n{\n   // 从文件中读取一个项目。\n   // 处理该项目。\n\
  }\n```\n\n然而，大多数程序员更倾向于以下逻辑，它使用了 `!` 运算符：\n\n```\n while (!inputFile.EndOfStream)\n\
  {\n   // 从文件中读取一个项目。\n   // 处理该项目。\n}\n```\n\n记住 `!` 运算符是逻辑非（NOT）运算符。当你读取此循环的第一行时，你自然会想到*当未到达流末尾时*。在教程\
  \ 5-6 中，你将完成一个使用该技术显示文件中所有项目的应用程序。\n\n# 计算运行总和\n\n许多编程任务需要你计算一系列数字的总和。在本节中，你将学习如何计算存储在文件中的系列数字的总和。例如，假设你有一个文件包含某公司每周每天的销售额，你需要编写一个程序来计算文件中所有金额的总和。程序将读取文件中的值，并在读取时保持这些值的总和累加。\n\
  \n计算一系列数字总和的程序通常使用两个元素：\n\n*   一个读取序列中每个数字的循环\n*   一个在读取数字时累加数字总和的变量\n\n用于累加数字总和的变量被称为累加器（accumulator）。人们通常说循环保持了一个“运行总和”，因为它在读取序列中的每个数字时都会累加总和。图\
  \ 5-39 显示了计算运行总和的循环的通用逻辑。\n\n# 图 5-39 计算运行总和的逻辑\n\n![流程图显示了计算运行总和的循环的通用逻辑。](img/FG_05_039.png)图\
  \ 5-39 完整备用文本\n\n当循环结束，累加器将包含循环读取的数字的总和。注意流程图中的第一步是将累加器变量设置为 0。这是一个关键步骤。循环每读取一个数字，它就会将其加到累加器中。如果累加器的初始值是\
  \ 0 以外的任何值，那么当循环结束时，它将包含正确的总和。\n\n在教程 5-7 中，你将完成一个计算文件中数值运行总和的应用程序。\n\n# 检查点\n\n\
