  \n### 判断对错\n\n1. `var` 关键字让代码更难易读，但它将性能提高了一倍。\n2. 在 LINQ 查询中，`from` 子句遍历元素集合。\n\
  3. 你可以在 LINQ 查询中使用多个 `where` 子句。\n4. C# 编译器会将所有以方法语法编写的 LINQ 查询转换为查询语法。\n5. 数据上下文对象具有作为数据库中表的表对象的属性。\n\
  \n\n\n\n6. `table` 对象是一个实体对象的集合，这些对象表示表中的行。\n\n7. `LINQ to SQL` 的一个局限性是查询结果无法显示在数据绑定控件中。\n\
  \n8. `LINQ to SQL` 的一个局限性是你你不能在数据库表中插入或删除行。表本质上是只读的。\n\n# 简答\n\n1. 在以下代码中，假设 `values`\
  \ 是一个 `double` 类型的数组。变量 `results` 的数据类型是什么？\n\n```\nvar results = from item in nums\n\
  \              where item < 0\n              select item;\n```\n\n2. 你可以使用哪两种语法来编写\
  \ `LINQ` 查询？\n\n3. 如果你想按降序排列对查询结果进行排序，你应该调用哪个扩展方法？\n\n4. 在 `LINQ to SQL` 中，数据库、表、行和列是如何表示的？\n\
  \n5. 描述使用 `LINQ to SQL` 向表中插入新行的过程。\n\n# 算法工作台\n\n1. 假设 `nums` 是一个整数列表 `List`。编写一个\
