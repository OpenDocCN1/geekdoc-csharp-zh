  \    1. 按引用传递\n    2. 命名常量\n    3. 按值传递\n    4. 方法\n\n14. （ ）是用于建立方法之间双向通信的特殊参数类型。\n\
  \    1. 通信变量\n    2. 引用参数\n    3. 方法参数\n    4. 全局变量\n\n15. （ ）可以接收未初始化的值，但在结束之前必须设置为某个值。\n\
  \    1. 输入参数\n    2. 引用参数\n    3. 输出参数\n    4. 默认参数\n\n# 判断题\n\n1. 将大问题拆分成若干易解决的小问题有时被称为分治法。\n\
  2. 在帕斯卡命名法中，第一个字母始终大大写。\n3. 如果方法属于一个类，那么你必须在类内部编写方法的定义。\n4. 变量的内容和表达式的值不能作为参数传递。\n\
  5. 如果参数列表中声明的所有参数变量数据类型相同，则你不需要为每个参数变量编写数据类型。\n6. 输出参数的工作原理类似于值传递。\n7. 有返回值的方法必须包含\
  \ `return` 语句。\n8. 布尔方法返回 `yes` 或 `no`。\n\n# 简答题\n\n1. 执行其包含的语句并将返回值返回给调用它的语句的方法称为？\n\
