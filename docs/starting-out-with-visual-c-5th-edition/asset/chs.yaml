  \ 6-23 完整替代文本\n\n当你调用一个返回值的方法时，你通常希望对它返回的值做一些有意义的操作。在程序 6-7 的第 39 行，从 `Sum` 方法返回的值被赋值给变量。这是使用返回值的常用方法，但你也可以对它们进行许多其他操作。例如，下面的代码显示了一个使用\
