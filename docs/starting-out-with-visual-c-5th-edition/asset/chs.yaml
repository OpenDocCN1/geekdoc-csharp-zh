  \    * 椭圆\n    * 平行四边形\n\n## 1.8 开始使用 Visual Studio\n\n### 概念\nVisual Studio 提供了一系列用于构建\
  \ C# 应用程序的工具。使用 C# 的第一步是学习这些工具。\n\n为了遵循书中的教程并创建 C# 应用程序，你需要在计算机上安装 Visual Studio。Visual\
  \ Studio 是一个专业的集成开发环境 (IDE)，这意味着它提供了创建、测试和调试软件所需的所有工具。它不仅可以用于 C# 创建应用程序，还可以用于 Visual\
