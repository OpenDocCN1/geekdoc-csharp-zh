  \n# 3.3 数字类型与变量\n\n### 概念\n\n如果你需要在变量中存储数字并在中使用，变量必须是数值类型。根据你需要存储的数字类型选择合适的数值类型。\n\
  \n在上一节中，你学习了 `string` 变量。`string` 类型的变量可以存储文本，但不能存储用于数学运算的数据。如果你需要存储数字并对其进行运算，你必须使用数值类型。\n\
  \nC# 语言提供了几种原始数据类型。你可以在附录 A 中阅读所有 C# 原始数据类型。提供的许多数据类型都是针对特殊用途的。对于数值数据，你大多数时候将使用表格\
  \ 3.2 中描述的三种数值类型。\n\n# 表格 3.2 你经常使用的原始数值数据类型\n\n| 数据类型 | 说明 |\n| --- | --- |\n|\
  \ `int` | `int` 类型的变量只能包含整数。例如，`int` 变量可以包含 42、0 和 -99 等值。`int` 变量不能包含带有部分的数字，例如\
  \ 22.1 或 -4.9。 |\n| | `int` 数据类型是存储整数的主要数据类型。在我们本书中，每我们需要存储和处理整数时都会使用它。`int` 变量使用\
  \ 32 位内存，可以存储 -2,147,483,648 到 2,147,483,647 之间的整数。 |\n| `double` | `double` 类型的变量可以包含实数，例如\
  \ 3.5、-87.95 或 3.0。存储在 `double` 变量中的数字将保留到 15 位精度。 |\n\n\n\n\n\n我们使用 `double` 数据类型的变量来存储可能带有小数部分的数字。`double`\
  \ 数据类型对于存储极大或极小的数字特别有用。\n\n在内存中，一个 `double` 变量占用 64 位内存。它以程序员称为`双精度浮点数表示法`的格式存储。`double`\
  \ 类型的变量可以存储范围在 ±5.0 × 10²³²⁴ 到 ±1.7 × 10³⁰⁸ 之间的数字。\n\n`decimal` 数据类型的变量可以存储比 `double`\
  \ 类型精度更高的实数。存储在 `decimal` 变量中的数字会被四舍五入到 28 位精度。\n\n由于 `decimal` 变量存储的是高精度的实数，它们最常用于财务应用程序。在本书中，我们在存储金额时通常使用\
  \ `decimal` 数据类型。\n\n在内存中，一个 `decimal` 变量占用 128 位内存。它以程序员称为`小数表示法`的格式存储。`decimal`\
  \ 类型的变量可以存储范围在 ±1.0 × 10²²⁸ 到 ±7.9 × 10²⁸ 之间的数字。\n\n以下是声明种数据类型变量的示例：\n\n```\nint\
  \ speed;\ndouble distance;\ndecimal grossPay;\n```\n\n第一条语句声明了一个名为 `speed` 的 `int`\
  \ 变量。第二个示例声明了一个名为 `distance` 的 `double` 变量。第三条语句声明了一个名为 `grossPay` 的 `decimal` 变量。\n\
  \n# 数字字面量\n\n你在第 2 章中了解到，字面量（literal）是写入程序代码中的数据。当你在编写程序代码时，如果知道想在变量中存储一个特定值，你可以将该值作为字面量赋值给变量。\n\
  \n数字字面量是写入程序代码中的数字。例如，接述语句声明了一个名为 `hoursWorked` 的 `int` 变量，并将其初始化为 40：\n\n```\n\
  int hoursWorked = 40;\n```\n\n在这条语句中，数字 40 是一个数字字面量。以下是另一个示例：\n\n```\ndouble temperature\
  \ = 87.6;\n```\n\n这条语句声明了一个名为 `temperature` 的 `double` 变量，并将其初始化为 87.6。数字 87.6 是一个数字字面量。\n\
  \n当你在程序代码中写数字字面量时，该字面量会被分配数据类型。在 C# 中，如果数字字面量是一个整数（不带小数点）且它在 `int` 的数值范围内，则该数字字面量被视为\
  \ `int`。被视为 `int` 的数字字面量称为整数字面量。例如，以下每条语句都使用整数字面量初始化了一个变量：\n\n```\nint hoursWorked\
  \ = 40;\nint unitsSold = 650;\nint score = −23;\n```\n\n如果数字字面量带有小数点且它在 `double`\
  \ 的范围内，则该数字字面量被视为 `double`。被视为 `double` 的数字字面量称为 `double` 字面量。例如，以下每条语句都使用 `double`\
  \ 字面量初始化了一个变量：\n\n```\ndouble distance = 28.75;\ndouble speed = 87.3;\ndouble temperature\
  \ = −10.0;\n```\n\n当你在数字字面量后面附加字母 `M` 或 `m` 时，它被视为 `decimal` 并被称为 `decimal` 字面量。以下是一些示例：\n\
  \n```\ndecimal payRate = 28.75m;\ndecimal price = 8.95M;\ndecimal profit = −50m;\n\
  ```\n\n### 提示\n\n由于 `decimal` 是存储金额的首选数据类型，记住“m”代表“money”（钱）可能帮你记住 `decimal` 字面量必须以字母\
  \ `M` 或 `m` 结尾。\n\n# `int` 变量的赋值兼容性\n\n你可以将 `int` 值赋值给 `int` 变量，但不能将 `double` 或\
  \ `decimal` 值赋值给 `int` 变量。例如，看以下声明：\n\n```\nint hoursWorked = 40; ← 这种有效\nint unitsSold\
  \ = 650m; ← 错误！\nint score = −25.5;    ← 错误！\n```\n\n第一条声明有效，是因为我们正在用 `int` 值初始化\
  \ `int` 变量。然而，第二个声明会导致错误，因为你不能将 `decimal` 值赋值给 `int` 变量。第三条声明也会导致错误，因为你不能将 `double`\
  \ 值赋值给 `int` 变量。\n\n你不能将 `double` 或 `decimal` 值赋值给 `int` 变量，因为这种赋值可能会导致数据丢失。原因如下：\n\
  \n* `double` 和 `decimal` 值可能是小数，但 `int` 变量只能存储整数。如果你允许在 `int` 变量中存储小数，那么该值的小数部分将被舍弃。\n\
  * `double` 和 `decimal` 值可能比 `int` 变量范围允许的大得多或小得多。`double` 或 `decimal` 数字可能大到或小到可能无法放入\
  \ `int` 变量中。\n\n# `double` 变量的赋值兼容性\n\n你可以将 `double` 或 `int` 值赋值给 `double` 变量，但不能将\
  \ `decimal` 值赋值给 `double` 变量。例如，看以下声明：\n\n```\ndouble distance = 28.75; ← 这种有效\n\
  double speed = 75;       ← 这种有效\ndouble sales = 6500.0m;  ← 错误！\n```\n\n第一条声明有效是因为我们正在用\
  \ `double` 值初始化 `double` 变量。第二条声明有效是因为我们正在用 `int` 值初始化 `double` 变量。第三条声明会导致错误，因为你不能将\
  \ `decimal` 值赋值给 `double` 变量。\n\n允许将 `int` 值赋值给 `double` 变量是合理的，因为任何可以存储为 `int`\
  \ 的数字都可以转换为 `double` 而不丢失数据。当你将 `int` 值赋值给 `double` 变量时，该 `int` 值会被隐式转换为 `double`。\n\
  \n你不能将 `decimal` 值赋值给 `double` 变量，因为 `decimal` 数据类型的精度比 `double` 类型高得多。`decimal`\
  \ 值可以拥有 28 位精度，而 `double` 只能提供 15 位精度。在 `double` 变量中存储 `decimal` 值可能会导致数据丢失。\n\n\
  # `decimal` 变量的赋值兼容性\n\n你可以将 `decimal` 或 `int` 值赋值给 `decimal` 变量，但不能将 `double` 值赋值给\
  \ `decimal` 变量。例如，看以下声明：\n\n```\ndecimal balance = 9280.73m; ← 这种有效\ndecimal price\
  \ = 50;         ← 这种有效\ndecimal sales = 6500.0;     ← 错误！\n```\n\n第一条声明有效是因为我们正在用\
  \ `decimal` 值初始化 `decimal` 变量。第二条声明有效是因为我们正在用 `int` 值初始化 `decimal` 变量。当你将 `int`\
  \ 值赋值给 `decimal` 变量时，该 `int` 值会被隐式转换为 `decimal` 而不丢失数据。然而，第三条声明会导致错误，因为你不能将 `double`\
  \ 值赋值给 `decimal` 变量。`double` 值可能比 `decimal` 范围允许的大得多或小得多。\n\n# 使用转换运算符显式转换值\n\n\n\
  \n\n让我们考虑一种假设的情况。假设你编写了一个使用 `double` 变量的型程序，并且由于某种原因，你需要将 `double` 变量的内容赋值给一个 `int`\
  \ 变量。在这种特定情况下，你知道 `double` 变量的值可以安全地转换为 `int` 而不会产生任何数据丢失（例如 3.0 或 98.0）。然而，C# 编译器将不允许你进行此类赋值，因为\
  \ `double` 值与 `int` 变量之间是不兼容赋值的。难道没有办法在 particular 特定情况下覆盖 C# 的规则并强制进行赋值吗？\n\n答案是肯定的，有这种方法。你可以使用强制转换符（cast\
  \ operator）将值从一种数值数据类型显式转换为另一种数据类型，即使这种转换可能会导致数据丢失。强制转换符是所需数据类型的名称，写在括号内，并放置在你想要转换的值左侧。下面的代码示例演示了：\n\
  \n```\n 1 // 声明一个 int 变量。\n2 int wholeNumber;\n3\n4 // 声明一个 double 变量。\n5 double\
  \ realNumber = 3.0;\n6\n7 // 将 double 赋值给 int。\n8 wholeNumber = (int)realNumber;\n\
  ```\n\n下面的点描述了该代码：\n\n*   第 2 行声明了一个名为 `wholeNumber` 的 `int` 变量。\n*   第 5 行声明了一个名为\
  \ `realNumber` 的 `double` 变量，初始化值为 3.0。\n*   第 8 行使用强制转换符将 `realNumber` 的值转换为 `int`，并将转换后的值赋值给\
  \ `wholeNumber`。在执行该语句后，`wholeNumber` 变量被赋值为 3。\n\n表 3.3 显示了涉及不同类型强制转换符的其他代码示例。\n\
  \n# 表 3.3 强制转换符的使用示例\n\n| 代码示例 | 说明 |\n| --- | --- |\n\n| `int wholeNumber;decimal\
  \ moneyNumber = 4500m;wholeNumber = (int)moneyNumber;` | `(int)` 强制转换符将 `moneyNumber`\
  \ 变量的值转换为 `int`。转换后的值被赋值给 `wholeNumber` 变量。 |\n| `double realNumber;decimal moneyNumber\
  \ = 625.70m;realNumber = (double)moneyNumber;` | `(double)` 强制转换符将 `moneyNumber`\
  \ 变量的值转换为 `double`。转换后的值赋值给 `realNumber` 变量。 |\n| `decimal moneyNumber;double realNumber\
  \ = 98.9;moneyNumber = (decimal)realNumber;` | `(decimal)` 强制转换符将 `realNumber` 变量的值转换为\
  \ `decimal`。转换后的值赋值给 `moneyNumber` 变量。 |\n\n当你使用强制转换符时，你本质上是在告诉编译器你知道你在做什么，并且愿意接受转换的后果。仍然可能发生数据丢失。例如，查看下面的代码示例：\n\
  \n```\n int wholeNumber;\ndouble realNumber = 8.9;\nwholeNumber = (int)realNumber;\n\
  ```\n\n在这个示例中，`double` 变量包含一个小数。当强制转换符将该小数转换为 `int` 时，数字中小数点后的部分会被丢弃。丢弃数字小数部分的过程称为截断（truncation）。在代码代码执行后，`wholeNumber`\
  \ 变量包含值 8。\n\n重要的是，当强制转换符应用到变量上时，它并不会改变变量的内容。强制转换符只是返回存储在变量中的值，将其转换为指定的数据类型。在之前的代码示例中，当\
  \ `(int)` 强制转换符应用到 `realNumber` 变量时，强制转换符返回值 8。然而，`realNumber` 变量保持不变，仍然包含值 8.9。\n\
  \n# 使用 `var` 关键字声明局部变量\n\nC# 提供了一种声明局部变量的替代方法，即使用 `var` 关键字和初始化值。这里有一个示例：\n\n```\n\
  var amount = 100;\n```\n\n注意，该语句使用了 `var` 单词而不是数据类型。`var` 关键字告诉编译器从初始化值中确定变量的数据类型。在这个示例中，初始化值\
  \ 100 是一个 `int`，因此 `amount` 将是一个 `int` 变量。这里是其他示例：\n\n```\nvar interestRate = 12.0;\n\
  var stockCode = \"D465U\";\nvar accountBalance = 1000.0m;\n```\n\n在代码中，`interestRate`\
  \ 变量将是一个 `double`，因为初始化值 12.0 是一个 `double`。`stockCode` 变量将是一个 `string`，因为初始化值 `\"\
  D465U\"` 是一个 `string`。`accountBalance` 变量将是一个 `decimal`，因为初始化值 `1000.0m` 是 `decimal`。\n\
  \n你不能在一个语句中使用 `var` 关键字声明多个变量。例如，下面的语句会导致错误：\n\n```\nvar x, y, z = 99;     // 错误！\n\
  ```\n\n你必须提供一个初始化值来使用 `var` 声明变量。以下语句会导致错误：\n\n```\nvar value;\n```\n\n# 练习\n\n\
  1. 为各项指定适当的原始数据类型：\n    * 24 元\n    * 12 个\n    * 14.5\n    * 8\n\n2. 下面哪些声明会导致错误？为什么？\n\
  \    * `decimal rate = 24m;`\n    * `double playerScore = 14.5;`\n    * `string\
  \ lastName = 25;`\n    * 5\n\n3. 写一条编程语句，将下面的 `decimal` 变量转换为 `int`并将结果存储在名为 `dollars`\
  \ 的 `int` 变量中：\n   ```\n   decimal deposit = 97.54m;\n   ```\n\n4. 执行以下代码后，`wholePieces`\
  \ 变量将包含什么值？\n   * `double totalPieces = 6.5;`\n   * `int wholePieces = (int)totalPieces;`\n\
  \n5. 给定以下 `var` 声明，各项的数据类型是什么？\n    * `var idNumber1 = \"007\";`\n    * `var idNumber2\
  \ = 0.07;`\n    * `var idNumber3 = 7;`\n    * `var idNumber4 = 7m;`\n\n\n\n\n变量也可以用于数学表达式。例如，假设我们有两个名为\
  \ `hoursWorked` 和 `payRate` 的变量。下面的数学表达式使用 `*` 运算符将 `hoursWorked` 变量中的值乘以 `payRate`\
  \ 变量中的值：\n\n```\nhoursWorked * payRate\n```\n\n当我们使用数学表达式来计算一个值时，我们必须对该值进行某些处理。通常情况下，我们希望将该值保存在内存中，以便在程序中再次使用它。我们通过赋值语句来实现。例如，假设我们有另一个名为\
  \ `grossPay` 的变量。以下语句将 `hoursWorked` 乘以 `payRate` 的值赋值给 `grossPay` 变量：\n\n```\n\
  grossPay = hoursWorked * payRate\n```\n\n这里是其他将数学表达式的结果赋值给变量的语句示例：\n\n```\ntotal\
  \ = price + tax;\nsale = price − discount;\ncommission = sales * percent;\nhalf\
  \ = number / 2;\n```\n\n模运算符（`%`）在两个整数之间执行除法，但它返回的不是商，而是余数。以下语句将 2 赋值给 `leftOver`：\n\
  \n```\nleftOver = 17 % 3;\n```\n\n该语句将 2 赋值给 `leftover`，因为 17 除以 3 等于 5，余数为 2。你不会频繁使用模运算符，但它在某些情况下很有用。它通常用于检测奇偶数的计算、确定星期几、测量时间的流逝以及其他特殊操作。\n\
  \n# 运算符的顺序\n\n你可以编写包含多个运算符的数学表达式。以下语句将 17、变量 `x`、21 和变量 `y` 的和赋值给变量 `answer`。\n\n\
  ```\nanswer = 17 + x + 21 + y;\n```\n\n然而，某些表达式并不那么直观。考虑以下语句：\n\n```\noutcome =\
  \ 12 + 6 / 3;\n```\n\n`outcome` 中将存储什么值？数字 6 被用作加法运算符和除法运算符的操作数。`outcome` 变量可能被赋值为\
  \ 6 或 14，取决于除法发生的时间。答案是 14，因为运算符顺序规定除法运算符在加法运算符之前执行。\n\n运算符顺序可以总结如下：\n\n1. 执行任何包含在括号中的操作。\n\
  2. 按照从左到右顺序执行任何乘法、除法或模运算。\n3. 按照从左到右顺序执行任何加法或减法。\n\n数学表达式从左到右求值。乘法和除法始终在加法和减法之前执行，因此语句\n\
  \n```\noutcome = 12 + 6 / 3;\n```\n\n工作原理如下：\n\n1. 6 除以 3，得到结果 2。\n2. 12 加上 2，得到结果\
  \ 14。\n\n它可以像图 3-11 所示所示图示。\n\n# 图 3-11 运算符顺序的执行\n\n![图表通过示例说明了运算符的顺序。](img/FG_03_011.png)图\
  \ 3-11 完整备用文本\n\n表 3.5 显示了其他一些示例表达式及其值。\n\n# 表 3.5 一些数学表达式及其值\n\n| 表达式 | 值 |\n|\
  \ --- | --- |\n| `5 + 2 * 4` | 13 |\n| `10 / 2` − `3` | 2 |\n| `8 + 12 * 2` − `4`\
  \ | 28 |\n| `6` − `3 * 2 + 7` − `1` | 6 |\n\n# 使用括号分组\n\n数学表达式的一部分可以使用括号分组，以强制某些操作在其他操作之前执行。在以下语句中，变量\
  \ `a` 和 `b` 相加，并将它们的和除以 4：\n\n```\nresult = (a + b) / 4;\n```\n\n但如果我们像这里这样省略括号会怎样呢？\n\
  \n```\nresult = a + b / 4;\n```\n\n我们将得到不同的结果。如果没有括号，`b` 将被除以 4，并将结果加到 `a` 上。表 3.6\
  \ 显示了一些使用括号的数学表达式及其值。\n\n# 表 3.6 更多表达式及其值\n\n| 表达式 | 值 |\n| --- | --- |\n| `(a +\
  \ b) / 4` | 5 |\n| `a + b / 4` | 6 |\n| `(5 + 3) / 4` | 2 |\n| `5 + 3 / 4` | 5 |\n\
  \n# 数学表达式中的类型混合\n\n当你对不同类型的操作数进行操作时，结果取决于操作数的类型。如果操作数是相同类型，则结果为该类型。例如，如果你将 `int`\
  \ 和 `double` 相加，结果为 `double`。\n\n* 当 `int` 和 `double` 相加，结果是 `double`。\n* 当从 `int`\
  \ 中减去 `double` 时，结果是 `double`。\n* 当 `int` 乘以 `double` 时，结果是 `double`。\n* 当 `double`\
  \ 乘以 `int` 时，结果是 `double`。\n* 当 `int` 除以 `double` 时，结果是 `double`。\n* 当 `double`\
  \ 除以 `int` 时，结果是 `double`。\n* 当 `int` 和 `decimal` 相加时，结果是 `decimal`。\n* 当从 `int`\
  \ 中减去 `decimal` 时，结果是 `decimal`。\n* 当 `int` 乘以 `decimal` 时，结果是 `decimal`。\n* 当 `decimal`\
  \ 乘以 `int` 时，结果是 `decimal`。\n* 当 `int` 除以 `decimal` 时，结果是 `decimal`。\n* 当 `decimal`\
  \ 除以 `int` 时，结果是 `decimal`。\n\nC# 不允许涉及 `double` 和 `decimal` 的操作，除非你使用转换运算符转换其中一个操作数。例如，假设计算产品成本的程序有以下变量声明：\n\
  \n```\ndouble weight;         // 产品重量\ndecimal pricePeround; // 每磅价格\ndecimal total;\
  \         // 总成本\n```\n\n程序的后续部分，你需要计算总成本，如下：\n\n```\ntotal = weight * pricePeround;\
  \ ← 错误！\n```\n\n编译器不允许该语句，因为 `weight` 是 `double` 而 `pricePeround` 是 `decimal`。要修复该语句，你可以插入转换运算符，如下：\n\
  \n```\ntotal = (decimal)weight * pricePeround;\n```\n\n转换运算符将 `weight` 变量的值转换为 `decimal`，转换后的值乘以\
  \ `pricePeround`。表达式的结果是 `decimal` 并赋值给 `total`。\n\n# 整数除法\n\n当在 C# 中用整数除以整数时，结果始终以整数给出。如果结果有小数部分，将被截断。例如，查看以下代码：\n\
  \n```\n int length;               // 声明 length 为 int\ndouble half;             \
  \ // 声明 half 为 double\nlength = 75;              // 将 75 赋值给 length\nhalf = length\
  \ / 2;        // 计算长度的一半\n```\n\n\n\n\n最后一条语句将 `length` 的值除以 2 并将结果赋值给 `half`。从数学上讲，75\
  \ 除以 2 的结果是 37.5。然而，这并不是我们通过该表达式得到的结果。`length` 变量是一个 `int`，它被除以数字字面量 2，而该字面量也被视为一个\
  \ `int`。除法的结果被截断，得到值 37。这就是赋值给 `half` 变量的值。`half` 变量被声明为 `double` 无关，因为在赋值发生之前，结果的小数部分已经被截断了。\n\
  \n# 复合赋值运算符\n\n有时你想将变量的值增加某个特定值。例如，假设你有一个名为 `number` 的变量，你想让它的值增加 1。你可以通过以下语句实现：\n\
  \n```\nnumber = number + 1;\n```\n\n赋值运算符右侧的表达式计算 `number` 加上 1 的值。然后将结果赋值给 `number`，替换之前存储在该处的值。该语句实际上为\
  \ `number` 加了 1。例如，如果在该语句执行之前 `number` 等于 6，那么在语句执行后它等于 7。\n\n同样，以下语句从 `number`\
  \ 中减去 5：\n\n```\nnumber = number − 5;\n```\n\n如果在该语句执行之前 `number` 等于 15，那么在语句执行后它等于\
  \ 10。这里另一个例子。以下语句将 `number` 变量的值翻倍：\n\n```\nnumber = number * 2;\n```\n\n如果在该语句执行之前\
  \ `number` 等于 4，那么在语句执行后它等于 8。\n\n这类操作在编程中非常常见。为了方便起，C# 提供了一组特殊的运算符，被称为复合赋值运算符，专门为这些任务设计。表\
  \ 3.7 显示了复合赋值运算符。\n\n# 表 3.7 复合赋值运算符\n\n| 运算符 | 示例用法 | 等价于 |\n| --- | --- | ---\
  \ |\n| `+=` | `x += 5;` | `x = x + 5;` |\n| `−=` | `y −= 2;` | `y = y − 2;` |\n\
  | `*=` | `z *= 10;` | `z = z * 10;` |\n| `/=` | `a /= b;` | `a = a / b;` |\n| `%=`\
  \ | `c %= 3;` | `c = c % 3;` |\n\n如你所示，复合赋值运算符不需要程序员输入两次变量名。此外，它们清晰地指示了语句中正在发生什么。\n\
  \n# 检查点\n\n1. 3.19 列出以下数学表达式的操作数：\n   ```\n   length * width\n   ```\n\n2. 3.20\
  \ 总结数学运算的顺序。\n\n3. 3.21 重写以下代码段，使其不会产生错误。\n   ```c\n   decimal pricePerFoot = 2.99m;\n\
  \   double boardLength = 10.5;\n   decimal totalCost = boardLength * pricePerFoot;\n\
  \   ```\n\n4. 3.22 假设 `result` 是一个 `double` 变量。当执行以下语句时，`result` 中将存储什么值？\n   ```c\n\
  \   result = 4 + 10 / 2;\n   ```\n\n5. 3.23 假设 `result` 是一个 `int` 变量。当执行以下语句时，`result`\
  \ 中将存储什么值？\n   ```c\n   result = (2 + 5) * 10;\n   ```\n\n6. 3.24 假设 `result` 是一个\
  \ `double` 变量。当执行以下语句时，`result` 中将存储什么值？\n   ```c\n   result = 5 / 2;\n   ```\n\n\
  7. 3.25 使用复合赋值运算符重写以下语句：\n   1. `count = count + 1`\n   2. `amount = amount – 5`\n\
  \   3. `radius = radius * 10`\n   4. `length = length / 2`\n\n# 3.5 输入和输出数值\n\n\
  ### 概念\n\n如果用户在 `TextBox` 中输入了一个数字，该数字将作为字符串存储在 `TextBox` 的 `Text` 属性中。如果你想将该数字存储在数值变量中，必须将其转换为相应的数值数据类型。当你想在\
  \ `Label` 控件或消息框中显示数值变量的值时，必须将其转换为 `string`。\n\n# 从 TextBox 获取数字\n\n图形用户界面 (GUI)\
  \ 应用程序通常使用 `TextBox` 控件来读取键盘输入。用户输入 `TextBox` 控件的任何数据都以字符串的形式存储在控件的 `Text` 属性中，即使是一个数字。例如，如果用户在\
  \ `TextBox` 控件中输入数字 72，则输入作为字符串 `\"72\"` 存储在控件的 `Text` 属性中。\n\n如果用户在 `TextBox` 中输入了一个数字，该数字将作为字符串存储在\
  \ `TextBox` 的 `Text` 属性中。如果你想将该数字存储在数值变量中，必须将其转换为相应的数值数据类型。当你想在 `Label` 控件或消息框中显示数值变量的值时，必须将其转换为\
  \ `string`。\n\n# 图 3-12 int 解析\n\n以下代码示例显示了如何使用 `int.Parse` 方法将控件的 `Text` 属性转换为\
  \ `int`。假设 `hoursWorkedTextBox` 是一个 TextBox 的名称。\n\n```csharp\n1 // 定义一个 int 变量来存储工作小时。\n\
  2 int hoursWorked;\n3\n4 // 从 TextBox 获取工作小时。\n5 hoursWorked = int.Parse(hoursWorkedTextBox.Text);\n\
  ```\n\n第 *5* 行将 `hoursWorkedTextBox.Text` 作为参数传递给 `int.Parse` 方法。因为用户在 `hoursWorkedTextBox`\
  \ 中输入了 40，所以传递的参数值为字符串 `\"40\"`。该方法将字符串 `\"40\"` 转换为 `int` 值 40。\n\n\n\n以下代码示例演示了\
  \ `decimal.Parse` 方法。假设 `moneyTextBox` 是一个 TextBox 控件的。\n\n```\n 1 // 声明一个 decimal\
  \ 变量来存储金额。\n2 decimal money;\n3\n4 // 从 TextBox 中获取金额。\n5 money = decimal.Parse(moneyTextBox.Text);\n\
  ```\n\n第 5 行将 `moneyTextBox.Text` 作为参数传递给 `decimal.Parse` 方法。该值被转换为 `decimal` 类型，由\
  \ `decimal.parse` 方法返回，并赋值给 `money` 变量。\n\n### 注意\n\n如果你在代码编辑器中查看表单源代码的顶部，你应该看到一条内容为\
  \ `using System;` 的指令。任何使用 `Parse` 方法的程序都需要该指令。\n\n# 无效转换\n\n只有当被转换的字符串包含有效的数值值时，`Parse`\
  \ 方法才能工作。如果字符串包含无效字符，或者包含无法转换为指定数据类型的的数字，就会发生被称为“异常”（exception）的错误。异常是程序运行期间发生的意外错误，如果不妥善处理该错误，会导致程序停止。\n\
  \n例如，假设 `hoursWorked` 是一个 `int` 变量，`hoursWorkedTextBox` 是一个 TextBox 控件。假设用户在 TextBox\
  \ 中输入了 `xyz` 并执行以下语句：\n\n```\nhoursWorked = int.Parse(hoursWorkedTextBox.Text);\n\
  ```\n\n显然，字符串 `\"xyz\"` 无法转换为 `int`，因此发生了异常。（当异常发生时，程序员说异常被“抛出”（thrown）了。）根据你执行应用程序的方式，你将看到在\
  \ 图 3-14 或 图 3-15 中显示的任意窗口。\n\n# 图 3-14 报告异常\n\n![窗口截图显示了异常的发生。](img/FG_03_014.png)图\
  \ 3-14 完整备用文本\n\n# 图 3-15 报告异常\n\n![对话框截图显示了异常的发生。](img/FG_03_015.png)图 3-15 完整备用文本\n\
  \n*   如果你在 图 3-14 中看到该窗口，可以通过点击 `Stop Debugging`（停止调试）按钮 (![](img/StopDebugging.jpg))、或者按下\
  \ Shift + F5，或者点击 `Debug`（调试）然后点击 `Stop Debugging` 来停止应用程序。\n\n*   当你看到 图 3-15 中的窗口时，在大多数情况下，你应该点击\
  \ `Quit`（退出）按钮来停止应用程序。\n\n在本章的稍后部分，你将学习如何捕获此类错误并防止程序停止。\n\n# 显示数值值\n\n假设应用程序有一个名为\
  \ `grossPay` 的 `decimal` 变量和一个名为 `grossPayLabel` 的 Label 控件。你想在 Label 控件中显示变量的值。为了实现这一点，你必须以某种方式将\
  \ `grossPay` 变量的值放入 `grossPayLabel` 控件的 `Text` 属性。然而，下面的赋值语句将不起：\n\n```\ngrossPayLabel.Text\
  \ = grossPay; ← 错误！\n```\n\n你不能将数值值赋值给控件的 `Text` 属性，因为只有字符串才能赋值给 `Text` 属性。如果你想在\
  \ Label 控件中显示数值变量的值，你必须将变量的值转换为字符串。\n\n幸运的是，所有变量都有一个 `ToString` 方法，你可以调用它将变量的值转换为字符串。你使用以下通用格式调用\
  \ `ToString` 方法：\n\n```\nvariableName.ToString()\n```\n\n在通用格式中，`variableName` 是任何变量的名称。该表达式将变量的值作为字符串返回。下面的代码示例演示了：\n\
  \n```\ndecimal grossPay = 1550.0m;\ngrossPayLabel.Text = grossPay.ToString();\n\
  ```\n\n第一条语句声明了一个名为 `grossPay` 的 `decimal` 变量，并值为 1550.0。在第二条语句中，`=`运算符右侧的表达式调用了\
  \ `grossPay` 变量的 `ToString` 方法。该方法将 `\"1550.0\"` 返回给 `grossPayLabel` 控件的 `Text`\
  \ 属性。结果是在 图 3-16 中显示了 `1550.0`。\n\n# 图 3-16 显示数值值\n\n![图表显示了一个表单。](img/FG_03_014.png)图\
  \ 3-16 完整备用文本\n\n\n\n当你显示大数字时，通常希望用逗号对其进行格式化，以便于阅读。例如，`487,634,789.0` 比 `487634789.0`\
  \ 更容易读。此外，当你显示金额时，通常希望将其四舍五入到两位小数并显示货币符号，例如美元符号（$）。\n\n当你调用 `ToString` 方法时，可以可选地将一个格式化字符串作为参数传递给该方法。该格式化字符串表示，当数字作为字符串从方法返回时，你希望它以特定的方式显示。例如，当你将格式化字符串\
  \ `\"c\"` 传递给 `ToString` 方法时，数字将以货币格式返回。假设你位于美国，以货币格式格式化的数字前面有一个美元符号（$），四舍五入到两位小数，并在需要的地方插入逗号分隔符。下面的代码示例演示：\n\
  \n```\ndecimal amount = 123456789.45678m;\nMessageBox.Show(amount.ToString(\"c\"\
  ));\n```\n\n注意第二个语句，将 `\"c\"` 格式化字符串传递给 `amount` 变量 `ToString` 方法。该语句显示的消息框如图 3-19\
  \ 所示。\n\n# 图 3-19 货币格式的数字\n\n![对话框的截图显示了一个以货币格式格式化的数字：123,456,789.46 美元。下方有一个 OK\
  \ 按钮。](img/FG_03_019.png)\n\n还有其他几个可以与 `ToString` 方法使用的格式化字符串，每个字符串都会产生不同类型的格式化。表\
  \ 3.9 显示了其中几个。\n\n# 表 3.9 常用格式化字符串\n\n| 格式字符串 | 描述 |\n| --- | --- |\n| `\"N\"` 或\
  \ `\"n\"` | 数字格式 |\n| `\"F\"` 或 `\"f\"` | 固定点科学格式 |\n| `\"E\"` 或 `\"e\"` | 指数计数科学格式\
  \ |\n| `\"C\"` 或 `\"c\"` | 货币格式 |\n| `\"P\"` 或 `\"p\"` | 百分比格式 |\n\n# 数字格式\n\n数字格式（`\"\
  n\"` 或 `\"N\"`）显示带有逗号分隔符和小数点的数值。默认情况下，小数点右侧显示两位。负值带有一个前导减号显示。其中一个例子是 −2,345.67。\n\
  \n# 固定点格式\n\n固定点格式（`\"f\"` 或 `\"F\"`）显示不带千位分隔符但带有小数点的数值。默认情况下，小数点右侧显示两位。负值带有前导减号（−）显示。其中一个例子是\
  \ −2345.67。\n\n# 指数格式\n\n指数格式（`\"e\"` 或 `\"E\"`）以科学计数法显示数值。数字在小数点左侧显示一位。字母 `e` 出现在指数前面，指数带有前导\
  \ `+` 或 `−` 符号。默认情况下，小数点右侧显示六位，如果数字为负，则使用前导减号。\n\n示例为 −2.345670e+003。\n\n# 货币格式\n\
  \n货币格式（`\"c\"` 或 `\"C\"`）显示领先货币符号（如 $）、数字、逗号分隔符和小数点。默认情况下，小数点右侧显示两位。负值用括号括。负值的示例是\
  \ ($2,345.67)。\n\n# 使用百分比格式\n\n百分比格式（`\"p\"` 或 `\"P\"`）使数字乘以 100 并带有尾随空格和 `%` 符号显示。默认情况下，小数点右侧显示两位。负值带有前导减号显示。例如，数字\
  \ 0.125 将格式化为 `12.5 %`，而数字 −0.2345 将格式化为 −`23.45 %`。\n\n# 指定精度\n\n每个数字格式字符串后面都可以可选地跟一个整数，表示在小数点后显示多少数字。例如，格式\
  \ `\"n3\"` 在小数点后显示三位。表 3.10 显示了基于北美区域设置的各种数字格式化示例。\n\n# 表 3.10 数字格式化示例（北美区域设置）\n\
  \n| 数字 | 格式字符串 | `ToString( )` 返回值 |\n| --- | --- | --- |\n| `12.3` | `\"n3\"` |\
  \ `12.300` |\n| `12.3` | `\"n2\"` | `12.30` |\n| `1234567.1` | `\"N\"` | `1,234,567.10`\
  \ |\n| `123456.0` | `\"f2\"` | `123456.00` |\n| `123456.0` | `\"e3\"` | `1.234560e+05`\
  \ |\n| `.234` | `\"P\"` | `23.40 %` |\n| `−234567.8` | `\"C\"` | `($−2,345,678.00)`\n\
  \n# 四舍五入\n\n当指定的小数点后位数小于数值精度时，会发生四舍五入。假设对 1.235 使用 `\"n2\"` 格式。如果最后一位数字是 5 或更高，则会四舍五入。表\
  \ 3.11 显示示例。\n\n# 表 3.11 使用 \"n2\" 格式的四舍五入示例\n\n| 数字 | 格式化后 |\n| --- | --- |\n|\
  \ `1.234` | `1.23` |\n| `1.235` | `1.24` |\n| `1.236` | `1.24` |\n\n# 整数的前导零\n\n\
  你可以使用 `\"d\"` 或 `\"D\"` 格式字符串配合整数来指定显示数字的宽度。如果需要，将插入前导零。表 3.12 显示示例。\n\n# 表 3.12\
  \ 使用 \"d\" 或 \"D\" 字符串整数\n\n| 整数值 | 格式字符串 | 格式化后 |\n| --- | --- | --- |\n| `23`\
  \ | `\"d\"` | `23` |\n| `23` | `\"d4\"` | `0023` |\n| `1` | `\"d2\"` | `01` |\n\n\
  在教程 3.3 中，你将创建一个使用货币格式显示金额的应用程序。\n\n# 检查\n\n1.  3.31 编写一条语句，使用货币格式在消息框中显示变量 `salary`\
