  \ 56, valueC = 7, valueD = 89123;\n    ```\n5.  3.35 编写一条语句，使用变量 `millimeters` 的\
  \ `ToString` 方法，使其以固定点科学格式显示小数点后四位数的精度。\n\n# 3.7 简单异常处理\n\n### 概念\n\n异常是程序运行时发生的意外错误。如果异常未被程序处理，程序将异常停止。\n\
  \n\n\n异常是程序在运行过程中发生的意外错误，如果该错误没有被妥善处理，程序将会停止。异常通常由程序员无法控制的情况引起。例如，假设用户在 `TextBox`\
  \ 中输入了一个值，且该值被预期是一个数字。程序使用 `Parse` 方法之一将控件的 `Text` 属性转换为数值数据类型，但该字符串包含无效字符，无法进行转换。`Parse`\
  \ 方法无法继续执行，因此发生了异常。（使用准确的术语，我们称当发生意外错误且方法无法继续操作时，该方法“抛出”（throws）了句异常。）\n\n让我们来看一个例子。如果你已经完成了教程\
  \ 3.2 中的*燃油经济*项目，请在 Visual Studio 中打开它，然后点击*开始调试*按钮 (![](img/StartDebugging.jpg))\
  \ 或按 `F5` 运行应用程序。在应用程序表单上，为行驶里程数输入 *300*，然后在燃油加仑数输入一个非数字字符序列。图 3-22 显示了一个用户输入 *wxyz*\
  \ 的示例。然后，点击*计算 MPG*按钮。因为你为燃油加仑输入的无效字符串无法转换为 `double`，因此抛出了异常。应用程序停止运行，Visual Studio\
  \ 进入一种名为断点模式（break mode）的特殊模式。显示图 3-23 中的窗口，抛出异常时正在执行的代码行会被高亮显示。\n\n## 图 3-22 为加仑数输入的无效数据\n\
  \n![截图显示了一个填充了用于计算 MPG 数据的表单窗口。](img/FG_03_022.png)图 3-22 完整替代文本\n\n## 图 3-23 异常报告\n\
  \n![一个窗口截图显示了异常的发生，窗口覆盖在命令提示符窗口上。](img/FG_03_023.png)图 3-23 完整替代文本\n\n图 3-23 中显示的异常窗口显示大量信息，但如果你查看窗口标题栏正下方的一行，你会看到消息*Input\
  \ string was not in a correct format*。这是对导致异常的情况描述。要退出断点模式，点击*停止调试*按钮 (![](img/StopDebugging.jpg))，或按\
  \ `Shift + F5`。Visual Studio 将将返回到正常模式。\n\n# 处理异常\n\nC# 与大多数现代编程语言一样，允许你编写在异常抛出时对其做出响应的代码，并防止程序崩溃崩溃。这种代码被称为异常处理器，使用\
  \ `try-catch` 语句编写。编写 `try`-`catch` 语句有多种方法，但以下通用格式是最简单的变体：\n\n```\n try\n{\n  \
  \       statement;\n         statement;\n         etc.\n}\ncatch\n{\n         statement;\n\
  \         statement;\n         etc.\n}\n```\n\n首先出现关键字 `try`，紧接着是一组包含在大括号内的一条或多个语句。这组语句被称为\
  \ try 块（try block）。try 块内部的一条或多个语句都可能抛出异常。\n\n在 try 块之后，会出现 `catch` 子句。`catch` 子句后面是一组包含在大括号内的一条或多个语句。这组语句被称为\
  \ catch 块（catch block）。\n\n当执行 `try`-`catch` 语句时，try 块中的语句按照它们出现的顺序执行。如果 try 块中的某个语句抛出异常，程序将立即跳转到\
  \ `catch` 子句并执行 catch 块中的语句。如果 try 块中的所有语句执行且没有异常，则跳过 catch 块。\n\n让我们看看 `try`-`catch`\
  \ 语句如何在*燃油经济*应用程序中用。以下是应用程序 `calculateButton_Click` 事件处理器的修改版本：\n\n```\n 1 private\
  \ void calculateButton_Click(object sender, EventArgs e)\n 2 {\n 3    try\n 4  \
  \  {\n 5       double miles;   // 用于存储里程\n 6       double gallons; // 用于存储加仑\n 7\
  \       double mpg;     // 用于存储 MPG\n 8       miles = double.Parse(milesTextBox.Text);\
  \ // 获取里程\n 9       gallons = double.Parse(gallonsTextBox.Text); // 获取加仑\n10\n11\
  \      mpg = miles / gallons; // 计算 MPG\n 12      mpgLabel.Text = mpg.ToString();\
  \ // 显示 MPG\n 13    }\n 14    catch\n 15    {\n 16       // 显示消息\n 17       MessageBox.Show(\"\
  Invalid data was entered.\");\n 18    }\n 19 }\n```\n\n当你撰写一个 `try`-`catch` 语句时，你将所有可能抛出异常的代码放在\
  \ try 块中。在本例中，try 块出现在第 5-21 行。如果 try 块中的任何语句抛出异常，程序将立即跳转到第 23 行的 `catch` 子句。然后执行\
  \ catch 块。\n\n假设应用程序正在运行，用户在 `milesTextBox` 控件中输入了无效内容。当事件处理器执行时，第 11 行的语句抛出异常，因为\
  \ `double.Parse` 无法将其转换为 `double`。程序将立即跳转到第 23 行的 `catch` 子句，并执行 catch 块中的语句。第 19\
  \ 行显示了消息。相反，如果 try 块中的所有语句都执行且没有异常，则跳过 catch 块。\n\n## 图 3-24 处理异常\n\n![截图显示了处理已发生异常的代码。](img/FG_03_024.png)图\
  \ 3-24 完整替代文本\n\n# 显示异常的默认错误消息\n\n当异常被抛出时，内存中会创建一个名为异常的对象。异常对象具有包含有关异常数据的各种属性。当你撰写\
  \ `catch` 子句时，可以选择地为异常对象分配一个名称，如下：\n\n```\ncatch (Exception ex)\n```\n\n括号内的表达式指定我们正在将名称\
  \ `ex` 分配给异常对象。（`ex` 这个名称并没有特殊之处。那只是我们为示例选择的名称。你可以使用任何喜欢的名称。）在 catch 块内部，我们可以使用名称\
  \ `ex` 来访问异常对象的属性。这些属性之一是 `Message` 属性，它包含了异常的默认错误消息。\n\n\n\n\n\n```csharp\nprivate\
  \ void calculateButton_Click(object sender, EventArgs e)\n{\n   try\n   {\n    \
  \  double miles;   // 用于存储行驶里程\n      double gallons; //存储消耗的加仑\n      double mpg;\
  \     // 用于存储 MPG\n\n      // 获取行驶里程并将其赋值给\n      // miles 变量。\n      miles = double.Parse(milesTextBox.Text);\n\
  \n      // 获取消耗的加仑并将其赋值给\n      // gallons 变量。\n      gallons = double.Parse(gallonsTextBox.Text);\n\
  \n      // 计算 MPG。\n      mpg = miles / gallons;\n\n      // 在 mpgLabel 控件中显示 MPG。\n\
  \      mpgLabel.Text = mpg.ToString();\n   }\n   catch (Exception ex)\n   {\n  \
  \    // 显示默认错误消息。\n      MessageBox.Show(ex.Message);\n   }\n}\n```\n\n第 26 行的语句只是将异常对象的\
  \ `Message` 属性传递给 `MessageBox.Show` 方法。这会导致在消息框中显示默认错误消息。图 3-25 显示了当用户为 `milesTextBox`\
  \ 或 `gallonsTextBox` 控件输入无效内容时，显示的消息示例。\n\n# 图 3-25 显示异常默认错误消息的消息框\n\n![对话框的截图显示了由于用户输入无效内容而显示的消息示例。消息内容为：“输入字符串不是正确的格式。”\
  \ 底部有一个“确定”按钮。](img/FG_03_025.png)\n\n在教程 3.4 中，你将创建一个应用程序，该程序使用 `try-catch` 语句来处理用户向\
  \ `TextBox` 控件输入无效数据时抛出的异常。\n\n# 检查点\n\n1. 3.36 什么会导致应用程序抛出异常？\n2. 3.37 当抛出异常时如何退出断点模式？\n\
  3. 3.38 `try`-`catch` 语句的 `try` 块包含什么类型的代码？\n4. 3.39 什么导致程序跳转到 `catch` 子句并执行 `try`-`catch`\
  \ 语句的 `catch` 块？\n5. 3.40 当抛出异常时如何显示默认错误消息？\n6. 3.41 为一个应用程序编写 `try`-`catch` 语句，该程序计算两个整数之和并显示结果。该应用程序使用名为\
  \ `value1TextBox` 和 `value2TextBox` 的两个 `TextBox` 控件收集输入，并使用名为 `sumLabel` 的 `Label`\
  \ 控件显示结果。\n\n# 3.8 使用命名常量\n\n### 概念\n\n命名常量是一个代表在程序执行期间不能更改的值的名称。\n\n假设以下语句出现在计算贷款相关数据的银行程序中：\n\
  \n```csharp\namount = balance * 0.069;\n```\n\n在这样的程序中，会出现两个潜在问题。首先，除了原始编程人员外，其他人都不清楚\
  \ `0.069` 是什么。它看起来像是一个利率，但在某些情况下，贷款还款还涉及费用。在不费力检查程序其余部分的情况下，如何确定此语句的目的呢？\n\n第二个问题是，如果这个数字在程序中的其他计算中使用并且必须定期更改就会该怎么办。假设该数字是利率，如果利率从\
  \ 6.9% 变为 7.2% 怎样？程序员必须搜索整个源代码以找到该数字出现的所有处。\n\n这两个问题都可以通过使用命名常量来解决。命名常量是一个代表在程序执行期间不能更改的值的名称。以下是在\
  \ C# 中如何声明命名常量的示例：\n\n```csharp\nconst double INTEREST_RATE = 0.129;\n```\n\n该语句声明了一个名为\
  \ `INTEREST_RATE` 的命名常量，并初始化为值 `0.129`。它看起来像普通的变量声明，不同在于数据类型名称之前出现了 `const` 单词，并且变量名使用了大写字母。`const`\
  \ 关键字是一个修饰符，告诉编译器将变量设为只读。如果语句尝试更改常量的值，则在程序编译时会发生错误。当你声明命名常量时，需要一个初始化值。\n\n并不要求常量名必须用大写字母，但许多程序员倾向于这样写，以便它们更容易与普通变量名区分开来。当你阅读程序代码并看到大写标识符时，你立即知道这是一个常量。\n\
  \n### 注意\n\n在许多编程语言中，用大写字母编写常量名称是传统。在 C# 社区中，有些程序员遵循这种做法，而有些则不然。使用命名常量的优势是它们让程序更加自明。语句\n\
  \n```csharp\namount = balance * 0.069;\n```\n\n可以改为\n\n```csharp\namount = balance\
  \ * INTEREST_RATE;\n```\n\n新程序员可以阅读第二个语句并知道 `balance` 被乘以。这种方法的另一个优点是方便进行大规模更改。假设利率出现在程序中的十几个不同的语句中。当利率更改时，只需要修改声明中的初始化值。如果利率增加到\
  \ 7.2%，则 `INTEREST_RATE` 的新值 0.72 将用于使用该常量的每个语句。在教程 3.5 中，你将创建一个应用程序。\n\n# 3.9 将变量声明为字段\n\
  \n### 概念\n\n字段是在类级别上声明的变量。字段的作用范围是整个类。\n\n到本章为止，我们处理过的所有变量都是局部变量。局部变量声明在方法内部，仅对该方法中的语句可见。另一种变量类型是字段，它是声明在类内部但在方法外部的变量。字段的作用范围是整个类，因此当你声明字段时，类中的所有方法都可以访问该变量。\n\
  \n通常，字段声明在类定义的顶部，在任何方法之前。图 3-28 显示了在表单类内部编写字段声明的位置。当你准备编写字段声明时，可以在类的大括号（`{`）之后插入一些空行并在该处编写字段声明。\n\
  \n让我们看一个字段声明的示例。假设以下语句出现在类定义内部但在任何方法内部。该语句声明了一个名为 `number` 的 `int` 字段，初始化值为 0：\n\
  \n```csharp\nprivate int number = 0;\n```\n\n\n\n\n字段声明的写法与其他任何变量声明相同，不同之处访问修饰符通常出现在数据类型之前。在这个示例中，关键字\
  \ `private` 就是访问修饰符。访问修饰符指定了类外部代码如何访问类成员。当你在字段声明中使用 `private` 访问修饰符时，类外部代码无法访问该字段。它只能由类内部的方法访问。\n\
  \n将字段设为 `private` 是一种良好的编程习惯，因为 `private` 字段对类外部代码是隐藏的。这防止了外部代码修改类字段的值，并有助于防止 Bug\
  \ 引入你的程序中。你将在第 10 章中学习更多相关内容。在此之前，如果你在类中声明字段，应该养成将它们设为 `private` 的习惯。\n\n# Note\n\
  \n还有其他的访问修饰符，你将在本书的后续部分学习。如果你在字段声明中没有写访问修饰符，C# 将自动将字段设为 `private`。但写出 `private`\
  \ 访问修饰符仍然是一个好主意，因为它让任何阅读代码的人都能看出该字段确实是 `private` 的。\n\n在之前的字段声明示例中，`number` 字段被初始化为\
  \ 0。如果一个字段是数值数据类型的变量（如 `int`、`double` 或 `decimal`），如果你没有显式初始化它的值，它将默认初始化为 0。然而，即使你希望它从值\
  \ 0 开始，显式初始化字段始终是一个好主意。这能为任何阅读代码的人清晰地指示该字段的起始值。\n\n# Warning!\n\n如果你不初始化 `string`\
  \ 字段，它将以一个名为 `null` 的特殊值开始。如果你尝试使用被设置为 `null` 的 `string`，将会发生错误。\n\n# Note\n\n你不能使用\
  \ `var` 关键字来声明字段。`var` 关键字只能用于声明局部变量。\n\n在表单中，字段用于存储必须在表单事件处理程序之间共享的数据。例如，在本书的学生示例程序的\
  \ `Chap03` 文件夹中（可从 www.pearsonhighered.com/gaddis 下载），你将找到一个名为 *Field Demo* 的项目。图\
  \ 3-29 显示了应用程序的表单以及 `Button` 控件的名称。\n\n# 图 3-29 *Field Demo* 表单\n\n![图表显示了一个表单窗口，显示三个用于字段演示的按钮，以及按钮控件的名称。](img/FG_03_029.png)图\
  \ 3-29 完整备用文本\n\n程序 3.5 显示了 `Form1` 代码。注意第 16 行声明了一个名为 `name` 的 `string` 变量作为字段，并初始化为值\
  \ `\"Charles\"`。接下来，查看按钮事件处理程序：\n\n*   在 `showNameButton_Click` 事件处理程序中，第 25 行显示了一个显示\
  \ `name` 变量值的值的消息框。\n*   在 `chrisButton_Click` 事件处理程序中，第 30 行将 `name` 变量的值改为 `\"\
  Chris\"`。\n*   在 `carmenButton_Click` 事件处理程序中，第 35 行将 `name` 变量的值改为 `\"Carmen\"\
  `。\n\n如你所见，`Form1` 类中的所有事件处理程序都可以访问 `name` 变量。如果你运行应用程序并点击 *Show Name* 按钮，将出现显示\
  \ *Charles* 的消息框，这是字段的初始值。如果你点击 *Change Name to Chris* 按钮然后点击 *Show Name* 按钮，将出现显示\
  \ *Chris* 的消息框。如果你点击 *Change Name to Carmen* 按钮然后点击 *Show Name* 按钮，将出现显示 *Carmen*\
  \ 的消息框。\n\n# 表单类中字段的生命周期\n\n当你在表单类中声明字段时，字段的生命周期就是表单存在的时间。这意味着只要表单存在，字段就会存在于内存中。这与局部变量的生命周期不同，局部变量只在声明它的方法执行期间存在。局部变量在内存中来来去去，但表单字段只要表单存在就会一直存在。\n\
  \n你可以在 *Field Demo* 应用程序中看到这一点。`name` 字段在 `Form1` 表单创建时在内存中创建，只要 `Form1` 存在，它就会一直存在。当其中一个事件处理程序在字段中存储值时。\n\
  \n# Precautions\n\n虽然字段方便共享数据，但你应该小心使用它们。过度使用字段会让类的调试变得困难，特别是当类有很多方法时。\n\n# Constant\
  \ Fields\n\n常量字段是不能被任何语句更改的字段。如果编译器发现尝试更改常量值的语句，将发生错误。常量字段使用 `const` 关键字声明并初始化一个值。这是一个示例：\n\
  \n```csharp\nprivate decimal INTEREST_RATE = 0.075;\n```\n\n此语句声明了一个初始化为 0.075 的常量\
  \ `decimal` 字段 `INTEREST_RATE`。常量字段通常用于表示许多方法需要的值。由于常量字段无法更改，你不需要担心与过度使用普通字段相关的许多调试问题。\n\
  \n在教程 3.5，你将创建一个使用字段存储数据并使用常量字段表示不变值的应用程序。\n\n# Checkpoint\n\n1. 使用命名常量有什么优点？\n\
  2. 写一个声明 10% 折扣命名常量的语句。\n3. 你应该在程序的哪里放置字段？\n4. 声明字段时应该使用什么访问修饰符为什么？\n5. 字段的生命周期与局部变量的生命周期有什么不同？\n\
  6. 写一个声明 5.9% 利率常量字段的语句。\n\n# 3.10 使用 `Math` 类\n\n## Concept\n\n.NET Framework 的\
  \ `Math` 类提供了执行复杂数学计算的方法。.NET Framework 提供了一个名为 `Math` 的类，其中包含了许多用于执行高级数学运算的方法。表\
  \ 3.16 给出了几个 `Math` 类方法的摘要。（要获取 `Math` 类提供的所有完整方法列表以及其中任何一个方法的更多详细信息，只需在 MSDN 帮助系统中搜索\
  \ *Math class* 即可。）\n\n\n\n\n# 表 3.16 常用的 Math 类方法\n\n| Math 类方法 | 说明 |\n| --- |\
  \ --- |\n| `Math.Abs(x)` | 返回 `x` 的绝对值。 |\n| `Math.Acos(x)` | 返回 `x` 的反余弦，单位为弧度。参数\
  \ `x` 是一个 `double`，返回值为 `double`。 |\n| `Math.Asin(x)` | 返回 `x` 的反正正弦，单位为弧度。参数 `x`\
  \ 是一个 `double`，返回值为 `double`。 |\n| `Math.Atan(x)` | 返回 `x` 的反正正切，单位为弧度。参数 `x` 是一个\
  \ `double`，返回值为 `double`。 |\n| `Math.Ceiling(x)` | 返回大于等于 `x`（`decimal` 或 `double`）的最小整数。\n\
  | `Math.Cos(x)` | 返回 `x` 的余弦，单位为弧度。参数 `x` 是一个 `double`，返回值为 `double`。 |\n| `Math.Exp(x)`\
  \ | 返回 `e`^x。参数 `x` 是一个 `double`，返回值为 `double`。 |\n| `Math.Floor(x)` | 返回小于等于 `x`（`decimal`\
  \ 或 `double`）的最大整数。 |\n| `Math.Log(x)` | 返回 `x` 的自然对数。参数 `x` 是一个 `double`，返回值为 `double`。\
  \ |\n| `Math.Log10(x)` | 返回 `x` 的 10 为底对数。参数 `x` 是一个 `double`，返回值为 `double`。 |\n\
  | `Math.Max(x, y)` | 返回两个值 `x` 和 `y` 中较大的者。 |\n| `Math.Min(x, y)` | 返回两个值 `x` 和\
  \ `y` 中较小的者。 |\n| `Math.Pow(x, y)` | 返回 `x`（`double`）的 `y`（同样为 `double`）方幂。返回值为\
  \ `double`。 |\n| `Math.Round(x)` | 返回 `x`（`double` 或 `decimal`）四舍五入到最近整数的值。 |\n\
  | `Math.Sin(x)` | 返回 `x` 的正弦，单位为弧度。 |\n| `Math.Sqrt(x)` | 返回 `x`（`double`）的平方根。返回值为\
  \ `double`。 |\n| `Math.Tan(x)` | 返回 `x` 的正切，单位为弧度。参数 `x` 是一个 `double`，返回值为 `double`。\
  \ |\n| `Math.Truncate(x)` | 返回 `x`（`double` 或 `decimal`）的整数部分。 |\n\n这些方法通常接受一个或多个值作为参数，使用参数执行数学运算并返回结果。例如，`Math.Pow`\
  \ 方法对一个数字求幂。以下是该方法的调用方式示例：\n\n```\ndouble result;\nresult = Math.Sqrt(4.0, 2.0);\n\
  ```\n\n该方法接受两个 `double` 参数。它将第一个参数提升到第二个参数的幂并将结果作为 `double` 返回。在示例中，4.0 的 2.0 次方。该语句等同于以下代数等式：\n\
  \n```\nresult =  42\n```\n\n接下来的代码示例了另一个使用 `Math.Pow` 方法的语句。它将 3 乘以 6³ 赋值给 `x`：\n\
  \n```\ndouble x;\nx = 3 * Math.pow(6.0, 3.0);\n```\n\n`Math.Sqrt` 方法接受一个参数并返回该参数的平方根。以下是它的用法示例：\n\
  \n```\ndouble result;\nresult = Math.Sqrt(16.0);\n```\n\n调用 `Math.Sqrt` 方法的语句将 16.0\
  \ 作为参数传递。该方法返回 16.0 的平方根（作为 `double`），然后将其赋值给变量 `result`。\n\n# 命名常量 `Math.PI` 和\
  \ `Math.E`\n\n`Math` 类还提供了两个预定义的命名常量 `Math.PI` 和 `Math.E`，它们分别被赋予 `pi` 和 `e` 的数学值。你可以在需要这些值的方程中使用这些变量。例如，下面使用\
  \ `Math.PI` 计算圆面积的语句：\n\n```\narea = Math.PI * radius * radius;\n```\n\n### 注意\n\
  \n如果你在代码编辑器中查看表单源代码顶部，你应该看到一条写着 `using System;` 的指令。任何使用 `Math` 类的程序都需要该指令。\n\n\
