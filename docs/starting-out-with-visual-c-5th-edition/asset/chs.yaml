  \n### 概念\n\nPictureBox 控件在表单上显示图形图像。PictureBox 控件具有控制图像显示方式的属性。PictureBox 控件可以有一个\
  \ Click 事件处理程序，在运行时用户点击控件时做出响应。\n\n\n\n在 `Toolbox`（工具箱）中，`PictureBox` 工具位于 `Common\
  \ Controls`（公共控件）组。当你双击该工具时，表单上会创建一个空的 `PictureBox` 控件，如图图 2-63 所示。虽然该控件尚未显示图像，但它有一个边界框，可以显示其的大小和位置，并带有缩放句柄。当你创建\
  \ `PictureBox` 控件时，它们会被自动赋予默认名称，如 `pictureBox1`、`pictureBox2` 等。你始终应该将默认名称更改为更具意义意义的名称。\n\
  \n## 图 2-63 一个空的 PictureBox 控件\n\n一旦你创建了 `PictureBox` 控件，你就可以使用它的 `Image` 属性来指定它将显示的图像。按照以下步骤操作：\n\
  \n1. 第 1 步：在 `Properties`（属性）窗口中点击 `Image` 属性。会出现一个省略号按钮（![](img/EllipsesButton.png)），如图图\
  \ 2-64 左侧所示。\n\n   ![屏幕截图显示了使用 PictureBox 控件的属性窗口打开 Select Resource 窗口的步骤。](img/FG_02_064.png)图\
  \ 2-64 完整备用文本\n\n2. 第 2 步：点击省略号按钮，将弹出如图图 2-64 右侧所示的 `Select Resource`（选择资源）窗口。\n\
  \n4. 第 4 步：选择图像文件后，你将在 `Select Resource` 窗口中看到它的内容。这表示图像已导入到项目中。图 2-65 显示了我们在选择并导入图像后\
  \ `Select Resource` 窗口的示例。\n\n   ## 图 2-65 被选中并导入的图像\n\n5. 第 5 步：点击 `Select Resource`\
  \ 窗口中的 `OK` 按钮，选定的图像将出现在 `PictureBox` 控件中。图 2-66 显示了我们在选择并导入图像后的情况。根据图像的大小，你可能会看到它的部分内容，图\
  \ 2-66 所示，这是因为我们更改了默认名称。\n\n   ## 图 2-66 显示图片的 PictureBox 控件\n\n\n\n当你在设计时使用`Properties`（属性）窗口更改控件的`Visible`属性时，该控件在`Designer`（设计器）中仍然可见。然而，当你运行应用程序时，控件不会显示在表单上。例如，图\
  \ 2-72 左侧的图像显示了`Designer`中的表单。`PictureBox`控件的`Visible`属性被设置为`False`，但在`Designer`中仍然可以看到该控件。右侧的图像显示了应用程序运行时的表单。在运行时，该控件是不可见的。\n\
  \n![截图显示了 PictureBox 控件的属性窗口和运行时的空项目表单。](img/FG_02_072.png)图 2-72 完整替代文本\n\n还可以通过赋值语句在代码中修改控件的`Visible`属性，这使得应用程序运行时隐藏或显示控件成为可能。例如，图\
  \ 2-72 所示的`PictureBox`控件命名为`spiderPictureBox`。以下语句将控件的`Visible`属性设置为`true`：\nspiderPictureBox.Visible\
  \ = true;\n```\n\n当此语句执行时，`spiderPictureBox`控件将变为可见。同样，以下语句将控件的`Visible`属性设置为`false`：\n\
  spiderPictureBox.Visible = false;\n```\n\n当此语句执行时，`spiderPictureBox`控件将变为不可见。\n\n\
  在代码中编写`true`和`false`值时（如前面的赋值语句所示），它们必须全部小小写。`true`和`false`是 C#关键字，如果你不全小写它们，将会发生错误。然而，当你使用`Properties`窗口设置布尔属性（如`Visible`）时，值`True`和`False`将以首字母大写显示。尽量不要让这种不一致性困扰你！\n\
  \n### 注意\n\n除了`PictureBoxs`，许多其他类型的控件都有`Visible`属性。例如，你可以通过设置其`Visible`属性的值来使`Label`控件可见或不可见。\n\
  \n在教程 2-5 中，你创建的每个事件处理程序都包含多个语句。例如，这里是`showBackButton_Click`方法：\n\n```\nprivate\
  \ void showBackButton_Click(object sender, EventArgs e)\n    cardFacePictureBox.Visible\
  \ = false;\n}\n```\n\n```\ncardBackPictureBox.Visible = true;\n```\n\n```\ncardFacePictureBox.Visible\
  \ = false;\n```\n\n在这个特定的方法中，哪个赋值语句先写并不重要。如果我们反转语句的顺序，我们将无法在屏幕上看到区别，因为应用程序执行得非常快。但在大多数应用程序中，你在事件处理程序中编写语句的顺序至关重要。在第\
  \ 3 章中将开始编写执行多个步骤的事件处理程序，在大多数情况下，这些步骤必须按照特定的顺序执行。否则，程序将无法产生正确的结果。\n\n1. 2.38 `PictureBox`是做什么的？\n\
