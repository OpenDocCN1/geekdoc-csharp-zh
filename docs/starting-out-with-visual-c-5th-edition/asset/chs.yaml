  \n# 第 10 章 类类论\n\n## 10.1 类简介\n\n### 概念\n\n类是对象的蓝图。它指定了特定类型对象拥有的字段和方法。从类中可以创建一个或多个对象。\n\
  \n在你学习此本书的过程中，在你所编写的所有程序中广泛使用了对象。某些对象（例如你放置在表单上的控件）是视觉化的。其他对象（例如 `Random` 对象、数组、`List`\
  \ 对象和 ImageList 控件）在屏幕上不可见，但存在于内存中并执行重要任务。\n\n类不是对象，而是对对象的描述。当程序运行时，它可以使用类在内存中根据需要创建任意特定类型的对象。从类创建的每个对象称为该类的实例。\n\
  \n例如，杰西卡是一个昆虫学家（研究昆虫的人），她也喜欢编写程序。她设计了一个程序来分类不同类型的昆虫。作为程序的一部分，她创建了一个名为 `Insect` 的类，该类指定了存储和处理所有昆虫类型通用数据的字段、属性和方法。`Insect`\
  \ 类不是对象，而是可以创建对象的规范。接下来，她编写程序语句创建一个 `housefly` 对象，它是 `Insect` 类的一个实例。`housefly`\
  \ 对象是内存中的一个实体，存储关于房屋蝇的数据。它拥有由 `Insect` 类指定的字段。然后她编写程序语句创建一个 `mosquito` 对象。`mosquito`\
  \ 对象也是 `Insect` 类的一个实例。它有自己的内存区域并存储关于蚊的数据。虽然 `housefly` 和 `mosquito` 对象是两个两个独立的实体，但它们都是从\
  \ `Insect` 类创建的。这意味着每个对象拥有 `Insect` 类描述的字段和方法。\n\n类是对象的蓝图。它指定了特定类型对象拥有的字段和方法。从类中可以创建一个或多个对象。\n\
  \n在你学习此本书的过程中，在你所编写的所有程序中广泛使用了对象。某些对象（例如你放置在表单上的控件）是视觉化的。其他对象（例如 `Random` 对象、数组、`List`\
  \ 对象和 ImageList 控件）在屏幕上不可见，但存在于内存中并执行重要任务。\n\n类不是对象，而是对对象的描述。当程序运行时，它可以使用类在内存中根据需要创建任意特定类型的对象。从类创建的每个对象称为该类的实例。\n\
  \n# 图 10-1 蓝图及其生成的房屋![插图显示了一个房屋的蓝图，左侧是一个卧室，右侧是一个客厅。它在下方显示了三座房屋的实例。](img/FG_10_001)\n\
  \n# 图 10-2 作为 `Insect` 类实例的 `housefly` 和 `mosquito` 对象\n\n\n\n\n\n![插图显示“家蝇”对象和“蚊”对象是“昆虫”类的实例。](img/FG_10_002.png)图\
  \ 10-2 完整备用文本\n\n# 创建类\n\n你通过编写类声明来创建一个类。以下是类声明的通用格式：\n\n```\n class ClassName \n\
  {\n   在此处编写成员声明。 . .\n}\n```\n\n类声明的第一行被称为类头（class header）。它以单词 `class` 开头，后面跟着类的名称。命名变量的相同规则也适用于类的命名。大多数程序员遵循以大写字母开头类名的惯例。这有助于在阅读代码时轻松地区分类名和变量名。\n\
  \n## 类头和成员声明\n\n类头之后是一个左大括号 `{`。接下来，你编写类的成员声明。这些是定义类的字段（fields）、属性（properties）和方法的语句。类声明的末尾有一个右大括号\
  \ `}`。\n\n让我们来看一个简单的例子。假设我们正在编写一个程序来模拟掷硬币。在程序中，我们需要反复掷硬币，并且每次判断它是正面朝上还是反面朝上。首先，我们编写一个名为\
  \ `Coin` 的类，它可以执行硬币的行为。下面的代码示例显示了 `Coin` 类。（注意，此类只是应用程序代码的一部分。稍后，你将看到它应该出现在项目的什么位置，但现在我们只关注这个类。）\n\
  \n```\n 1\uFEFF class Coin\n 2\uFEFF {\n 3\uFEFF     // 表示朝上侧面的字段；\n4\uFEFF    \
  \ private string sideUp;\n 5\uFEFF \n6\uFEFF     // 构造函数\n7\uFEFF     public Coin()\n\
  \ 8\uFEFF     {\n 9\uFEFF         sideUp = \"Heads\";\n1\uFEFF\uFEFF0     }\n1\uFEFF\
  \uFEFF\uFEFF1\n12     // Toss 方法模拟掷硬币。\n1\uFEFF\uFEFF\uFEFF3     public void Toss()\n\
  1\uFEFF\uFEFF\uFEFF4     {\n1\uFEFF\uFEFF\uFEFF5         // 创建一个 Random 对象。\n1\uFEFF\
  \uFEFF6         Random rand = new Random();\n1\uFEFF7\n18         // 使用随机数来决定\n\
  1\uFEFF\uFEFF9         // 硬币哪一面朝上。\n2\uFEFF\uFEFF\uFEFF0         // 0 = 正面，1 = 反面\n\
  2\uFEFF\uFEFF\uFEFF1         if (rand.Next(2) == 0)\n2\uFEFF\uFEFF\uFEFF2      \
  \   {\n2\uFEFF\uFEFF\uFEFF3             sideUp = \"Heads\";\n2\uFEFF\uFEFF\uFEFF\
  4         }\n2\uFEFF\uFEFF\uFEFF5         else\n2\uFEFF\uFEFF\uFEFF6         {\n\
  2\uFEFF\uFEFF\uFEFF7             sideUp = \"Tails\";\n2\uFEFF\uFEFF\uFEFF8     \
  \    }\n2\uFEFF\uFEFF\uFEFF9     }\n3\uFEFF\uFEFF\uFEFF0\n31     // GetSideUp 方法返回\n\
  3\uFEFF\uFEFF\uFEFF     // sideUp 字段的值。\n3\uFEFF\uFEFF\uFEFF3     public string\
  \ GetSideUp()\n3\uFEFF\uFEFF\uFEFF4     {\n3\uFEFF\uFEFF\uFEFF5         return sideUp;\n\
  3\uFEFF\uFEFF\uFEFF6     }\n3\uFEFF\uFEFF\uFEFF7 }\n```\n\n第一行是类头。它指定类的名称为 `Coin`。第\
  \ 2 行和第 37 行的大括号包围了类的内容。让我们仔细查看类内部的代码：\n\n*   **第 4 行：** 该语句声明了一个名为 `sideUp` 的字段。`sideUp`\
  \ 字段是一个 `string` 变量，指示硬币的哪一面朝上。如果正面朝上，则将字符串 `\"Heads\"` 赋值给该字段。如果反面朝上，则将字符串 `\"\
  Tails\"` 赋值给该字段。\n\n    注意字段声明以关键字 `private` 开头。`private` 关键字是一个访问修饰符，指定该字段不能被类外部的语句直接访问。\n\
  \n    通过使用 `private` 访问修饰符，类可以向类外部的代码隐藏其数据。当类的字段对外部代码隐藏时，数据就能免受意外损坏。将类的所有字段都设为 `private`\
  \ 并仅通过方法提供对这些字段的访问是一种常见做法。\n\n*   **第 7–10 行：** 这段代码定义了一个名为构造函数（constructor）的特殊方法。构造函数是在对象创建时自动执行的方法。在大多数情况下，构造函数用于用初始值初始化对象的字段。它被称为构造函数是因为它有助于构造对象。\n\
  \n    此构造函数执行了一个简单的任务。在第 9 行中，它将字符串 `\"Heads\"` 赋值给 `sideUp` 字段。结果，每当我们创建一个 `Coin`\
  \ 类的对象时，该对象的 `sideUp` 字段最初都会被赋值为字符串 `\"Heads\"`。\n\n    注意第 7 行中构造函数头部的几点：\n\n \
  \   *   构造函数的名称与类的名称相同。在这种情况下，构造函数的名称是 `Coin`。\n    *   头部没有指定返回类型——甚至没有 `void`。\n\
  \    *   构造函数头部以 `public` 访问修饰符开头。在大多数情况下，类的构造函数是公有的。在本书中，我们总是对构造函数使用 `public` 访问修饰符。\n\
  \n*   **第 13–29 行：** 这段代码定义了一个名为 `Toss` 的 `void` 方法。注意第 13 行方法头部使用了 `public` 访问修饰符。由于该方法是公共的，它可以从类外部调用。（此处省略大量重复的描述）……（等一下，让我简化逻辑：`Random\
  \ rand = new Random();`。使用随机数来决定硬币哪一面朝上。如果 `rand.Next(2) == 0`，则 `sideUp = \"Heads\"\
  `，否则 `sideUp = \"Tails\"`。）\n\n    在代码中，`rand.Next(2) == 0` 判断硬币是正面还是反面。由于该方法是公共的，它可以从类外部调用。（此处省略大量重复的描述）\n\
  \n# 创建对象\n\n记住，类是一个蓝图。当你从类创建对象时，你使用引用变量来引用该对象。当你想要操作该对象时，你使用引用它的变量。\n\n要创建一个 `Coin`\
  \ 对象，我们需要编写如下语句：\n\n```\nCoin myCoin = new Coin();\n```\n\n让我们看看该语句的不同部分：\n\n* \
  \  语句 `=` 左侧的部分是 `Coin myCoin`。这声明了一个名为 `myCoin` 的变量，用于引用 `Coin` 类的对象。\n*   语句 `=`\
  \ 右侧的部分是 `new Coin()`。该表达式创建 `Coin` 类的实例并调用类的构造函数。`new` 运算符返回对象的引用。\n*   `=` 操作将\
  \ `new` 运算符返回的引用赋值给 `myCoin` 变量。\n\n执行此语句后，`myCoin` 变量将引用一个 `Coin` 对象，正如图 10-3 所示](#fileP7001016012000000000000008232)。注意图中该对象的\
  \ `sideUp` 字段被设置为 `\"Heads\"`，这是构造函数的结果。\n\n# 图 10-3 `myCoin` 变量引用一个 `Coin` 对象\n\
  \n![插图显示 myCoin 变量引用一个 Coin 对象，该对象的 sideUp 字段被设置为“正面”。](img/FG_10_003.png)\n\n###\
  \ 注意\n\n类是引用类型（reference types）。当你从类创建对象时，你使用引用变量（reference variable）来引用该对象。当你想要操作对象时，你使用引用它的变量。\n\
  \n一旦我们创建了 `Coin` 对象，就可以对它进行操作。例如，假设变量 `myCoin` 引用一个 `Coin` 对象，下面的语句调用该对象的 `Toss`\
  \ 方法：\n\n```\nmyCoin.Toss();\n```\n\n以及，接下来的语句显示硬币朝上的一面：\n\n```\nMessageBox.Show(myCoin.GetSideUp());\n\
  ```\n\n\n\n\n\n在 C# 中，你在选择编写类声明的位置时具有一定的灵活性。当你开始在项目中编写自己的类时，可以将它们写在包含表单类的同一个文件中。图\
  \ 10-4 展示了一个示例，说明了如何将 `Coin` 类写在与项目的 `Form1` 类相同的相同文件中。注意图中，`Coin` 类被写在项目的命名空间（namespace）内部。这并不是强制要求的，但这是一个好主意，因为该类是项目的一部分。（类写在\
  \ `Form1` 类之前或之后都没有关系。）\n\n## 图 10-4 位于同一源文件中的 `Form1` 类和 `Coin` 类\n\n![截图显示 Coin\
  \ 类写在与项目 Form 1 类相同的源代码文件中。](img/FG_10_004.png)图 10-4 完整替代文本\n\n尽管对于小型类来说这种方法是可以接受的，但建议将每个类写在单独独立的文件。这样做可以让你的代码更有组织，并帮助源代码文件保持在易于管理的大小。它还方便你在其他项目中复用这些类。在本书，我们始终将类存储在它们自己的文件中。\n\
  \nVisual Studio 自动化了向项目添加新类文件的过程。当你准备好编写新类时，按照以下步骤为该类创建一个源文件：\n\n1. 在 Visual Studio\
  \ 中打开项目后，点击菜单栏上的 `Project`；然后选择 `Add Class. . .`。这如图图 10-5 所示。\n\n   ### 图 10-5\
  \ 在 `Project` 菜单上选择 `Add Class. . .`\n\n   ![截图显示 Microsoft Visual Studio 菜单栏上 Project\
  \ 选项卡的弹出菜单。鼠标光标显示位于菜单中名为“Add Class”的项上。](img/FG_10_005.png)\n\n2. 应该出现图图 10-6 所示的\
  \ `Add New Item` 窗口。确保选择 `Class` 作为项目类型。注意图中，`Class1.cs` 出现在 `Name` 文本框中。这是 Visual\
  \ Studio 提供的默认文件名。将名称更改为你正在创建的类的名称。例如，如果你正在创建一个名为 `Coin` 的类，则将名称更改为 `Coin.cs`。（确保文件名以\
  \ `.cs` 扩展名结尾。）\n\n   ### 图 10-6 `Add New Item` 窗口\n\n   ![截图显示 Add New Item 窗口，在可滚动列表中选择了“Class”作为项类型。名称文本框显示新类的名称为“Class\
  \ 1 dot c s”。](img/FG_10_006.png)\n\n3. 点击 `Add` 按钮。\n\n执行这些步骤后，指定的源代码文件将在项目中创建并显示在代码编辑器中。该源代码文件已经包含了几个\
  \ `using` 指令和一个你可以编辑的空类声明。图图 10-7 所示所示了一个示例。你还会在 `Solution Explorer` 中看到新源代码文件的项，如图图\
  \ 10-8 所示。\n\n   ### 图 10-7 在代码编辑器中显示的新类文件\n\n   ![截图显示代码编辑器中显示的新类文件。](img/FG_10_007.png)图\
  \ 10-7 完整替代文本\n\n   ### 图 10-8 `Solution Explorer` 窗口\n\n   ![截图显示 Solution Explorer\
  \ 中新源代码文件的项“Coin dot c s”。](img/FG_10_008.png)\n\n\n\n\n从这些示例中，你可以看到属性（property）是一种类似于公共字段的类成员。然而，属性并不是公共字段。它是一组特殊的方法，称为访问器（accessors），它们与私有字段配合工作。该私有字段被称为属性的备份字段（backing\
  \ field），存储赋值给属性的任何数据。访问器允许类外部代码获取属性的值并为属性赋值。\n\n让我们来看一个带有属性的简单类示例。假设你想创建一个名为 `Pet`\
  \ 的类来表示家庭宠物。该类将有一个 `Name` 属性，用于存储宠物的名字。以下代码展示了如何编写 `Pet` 类：\n\n```csharp\n 1 class\
  \ Pet\n 2 {\n 3     // Field for the pet’s name\n 4     private string _name;\n\
  \ 5\n 6     // Constructor\n 7     public Pet()\n 8     {\n 9         _name = \"\
  \";\n10    }\n11 \n12     // Name property\n13     public string Name\n14     {\n\
  15         get\n16         {\n17             return _name;\n18         }\n19\n20\
  \         set\n21         {\n22             _name = value;\n23         }\n24   \
  \  }\n25 }\n```\n\n让我们仔细查看类内部的代码：\n\n- **第 4 行：** 该语句声明了一个名为 `_name` 的私有 `string`\
  \ 字段。`_name` 字段是 `Name` 属性的备份字段。当给 `Name` 属性赋值时，它会被存储在 `_name` 字段中。注意我们用下划线开头开头。这不是强制要求，但某些程序员会以下划线开头备份字段的名字，以消除字段名和属性名之间的混。遵循这种做法，当你阅读代码并看到以下划线开头的变量时，你会立即知道它是属性的备份字段。\n\
  \n- **第 7–10 行：** 这是类的构造函数。当创建 `Pet` 类的实例时，此构造函数会将空字符串分配给 `_name` 字段。\n\n- **第 13\
  \ 行：** 这是属性声明的开始。它指定了关于属性的三点：\n    - `public`——属性是公共的，因此可以被类外部的代码使用。（大多数属性都声明为公共的。）\n\
  \    - `string`——属性的数据类型为 `string`。\n    - `Name`——属性的名字为 `Name`。\n\n- **第 14 行：**\
  \ 这一行出现了一个左大括号。相应的右大括号出现在第 24 行。大括号内部是 `Name` 属性的访问器。\n\n- **第 15–18 行：** 这是属性的\
  \ `get` 访问器。你可以将 `get` 访问器认为是一个返回属性值的方法。你可以看到第 17 行是一个 `return` 语句，返回 `_name` 字段的值。每当读取属性时，都会执行\
  \ `get` 访问器。\n\n- **第 20–23 行：** 这是属性的 `set` 访问器。`set` 访问器的目的是为属性设置一个值。`set` 访问器有一个名为\
  \ `value` 的隐式参数。它是“隐式”的，因为它没有像普通方法中的参数那样被声明。`value` 参数由编译器自动创建，其数据类型与属性的类型相同。在这种情况下，`value`\
  \ 参数的数据类型为 `string`。\n  每当给属性赋值时，就会执行属性的 `set` 访问器，并将被赋值的值传递给 `value` 参数。第 22 行将\
  \ `value` 参数分配给 `_name` 字段。\n\n以下代码展示了如何使用 `Pet` 类的 `Name` 属性：\n\n```csharp\n 1\
  \ // Create two Pet objects.\n 2 Pet myDog = new Pet();\n 3 Pet myCat = new Pet();\n\
  \ 4 \n 5 // Set their Name properties.\n 6 myDog.Name = \"Fido\";\n 7 myCat.Name\
  \ = \"Sylvester\";\n 8 \n 9 // Display their names.\n10 MessageBox.Show(\"My dog's\
  \ name is \" + myDog.Name);\n11 MessageBox.Show(\"My cat's name is \" + myCat.Name);\n\
  ```\n\n让我们仔细查看代码：\n\n- **第 2 行：** 该语句创建了一个 `Pet` 对象，调用 `Pet` 类构造函数，并将对象的引用分配给 `myDog`\
  \ 变量。在该语句执行后，`myDog` 变量引用一个 `Pet` 对象。\n- **第 3 行：** 该语句创建了一个 `Pet` 对象，调用 `Pet` 类构造函数，并将对象的引用分配给\
  \ `myCat` 变量。在该语句执行后，`myCat` 变量引用一个 `Pet` 对象。\n- **第 6 行：** 该语句将 `myDog` 对象的 `Name`\
  \ 属性设置为 `\"Fido\"`。在该语句执行时，会执行 `Name` 属性的 `set` 访问器，并将字符串 `\"Fido\"` 传递给 `value`\
  \ 参数。随后，`value` 参数被分配给 `_name` 字段。\n\n\n\n有时候，将属性设置为只读是有很有用的。只读属性可以读取，但不能修改。如果你需要将一个属性设置为只读，只需不为该属性编写\
  \ `set` 访问器即可。下面的 `Circle` 类展示了一个示例：\n\n```\n 1 class Circle\n 2 {\n 3     // Field\n\
  \ 4     private double _diameter;\n 5 \n 6     // Constructor\n 7     public Circle()\n\
  \ 8     {\n 9         _diameter = 0.0;\n10     }\n11 \n12     // Diameter property\n\
  13     public double Diameter\n14     {\n15         get { return _diameter; }\n\
  16         set { _diameter = value; }\n17     }\n18 \n19     // Radius property\
  \ (read-only)\n20     public double Radius\n21     {\n22         get { return _diameter\
  \ / 2; }\n23     }\n24 }\n```\n\n该类有两个属性：`Diameter`（定义在第 13–17 行）和 `Radius`（定义在第\
  \ 20–23 行）。注意 `Radius` 属性有一个 `get` 访问器，但没有 `set` 访问器。`Radius` 属性是只读的。因此，如果我们创建一个\
  \ `Circle` 类的对象，我们可以获取 `Radius` 属性的值，但如果我们尝试给 `Radius` 属性赋值，就会发生错误。\n\n# 避免过时数据\n\
  \n在之前展示的 `Circle` 类示例中，注意 `Radius` 属性没有自己的备用字段，而 `Diameter` 属性有。相反，`Radius` 属性的\
  \ `get` 访问器返回的是计算结果的值。半径没有存储在字段中，因为圆的半径取决于圆的直径。如果我们将直径和半径都存储在各自的字段中，一旦直径字段发生变化，半径字段就会变得错误。\n\
  \n当一个字段的值紧密依赖其他数据，且当其他数据更改时该字段没有更新时，称该字段变得“过时”（stale）。在设计类时，你应该注意不要在字段中存储任何可能过时的计算数据。相反，应提供一个只读属性或方法，返回计算结果的值。\n\
  \n# 自动属性 (Auto-Properties)\n\n有时候，属性仅仅是获取和设置备用字段的值，而不执行任何其他操作。例如，回想我们在在本节之前讨论过的\
  \ `Pet` 类。该类有一个 `Name` 属性，它用于获取和设置名为 `_name` 的备用字段的值。这里是 `Pet` 类中相关的代码：\n\n```\n\
  \ private string _name;\npublic string Name\n{\n    get\n    {\n        return _name;\n\
  \    }\n    set\n    {\n        _name = value;\n    }\n}\n```\n\n如果我们将属性实现为自动属性，这段代码可以被大大简化。自动属性允许你在不声明备用字段的情况下创建简单属性，且无需编写代码来获取和设置属性的值。以下是\
  \ `Pet` 类中的 `Name` 属性如何写成自动属性的示例：\n\n```\n public string Name\n{\n          get;\n\
  \          set;\n}\n```\n\n当按这种方式编写属性时，C# 编译器会自动创建一个隐藏的备用字段，以及 `get` 和 `set` 方法的代码。事实上，大多数程序员更倾向于编写更短的属性版本，如下所示：\n\
  \n```csharp\npublic string Name { get; set; }\n```\n\n未初始化的自动属性将自动设置为其数据类型的默认值。（数值类型将设置为\
  \ 0。字符串、`struct` 和类变量将设置为 `null`。）如果你想将一个自动属性初始化为特定值，可以按照以下方式操作：\n\n```csharp\n\
  public string Name { get; set; } = \"Fido\";\n```\n\n这段代码创建了一个 `Name` 属性，并初始化为值“Fido”。为了说明自动属性如何简化代码，请将之前展示的包含\
  \ 25 行代码的 `Pet` 类版本与这里显示的仅包含 5 行代码的版本进行比较。\n\n```csharp\n 1 class Pet  \n2 {\n3\
  \    // Name property\n4    public string Name { get; set; } = \"\";\n5 }\n```\n\
  \n# 只读自动属性\n\n如果你在自动属性中省略 `set` 关键字，该属性就会变为只读。这里有一个如何让 `Pet` 类的 `Name` 属性变为只读的示例：\n\
  \n```csharp\n 1 class Pet\n2 {\n3     // Name property\n4     public string Name\
  \ { get; } = \"Fido\";\n5 }\n```\n\n在这个示例中，`Name` 属性被初始化为值“Fido”。我们可以获取属性的值，但不能设置属性的值。如有必要，你可以在类的构造函数为只读自动属性赋值，如下所示：\n\
  \n```csharp\n 1\uFEFF class Pet\n 2\uFEFF {\n 3\uFEFF     // Constructor\n 4\uFEFF\
  \     public Pet()\n 5\uFEFF     {\n 6\uFEFF        Name = \"Fido\";\n 7\uFEFF \
  \    }\n 8\uFEFF \n 9\uFEFF     // Name property\n 10     public string Name { get;\
  \ }\n11 }\n```\n\n教程 10-2\n\n有时候将属性设置为只读是有用的。只读属性可以读取，但不能修改。如果你需要将一个属性设置为只读，只需不为该属性编写\
  \ `set` 访问器即可。下面的 `Circle` 类展示了一个示例：\n\n```\n 1 class Circle\n 2 {\n 3     // Field\n\
  \ 4     private double _diameter;\n 5 \n 6     // Constructor\n 7     public Circle()\n\
