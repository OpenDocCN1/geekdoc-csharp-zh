  \     MessageBox.Show(\"Three\");\n     }\n     else\n     {\n     MessageBox.Show(\"\
  Unknown\");\n     }\n  }\n}\n```\n\n## 4.4 逻辑运算符\n\n### 概念\n\n逻辑与 运算符 `&&` 和逻辑或\
  \ 运算符 `||` 允许你连接多个布尔表达式以创建一个复合表达式。逻辑非 运算符 `!` 反转布尔表达式的真值。\n\nC# 语言提供了一组称为`逻辑运算符`的运算符，你可以使用它们来创建复杂的布尔表达式。[表\
  \ 4-3] 描述了这些运算符。\n\n### 表 4-3 逻辑运算符\n\n| 运算符 | 含义 |\n| --- | --- |\n| `&&` | 这是逻辑与运算符。它将两个布尔表达式连接成一个复合表达式。只有当两个子表达式都为真时，复合表达式才为真。\
  \ |\n| `||` | 这是逻辑或运算符。它将两个布尔表达式连接成一个复合表达式。只要其中一个或两个子表达式为真，复合表达式就为真。只需要其中一个子表达式为真即可，具体是哪一个并不重要。\
  \ |\n| `!` | 这是逻辑非运算符。它是一个一元运算符，意味着它只作用于一个操作数。操作数必须是一个布尔表达式。非运算符反转其操作数的真值。如果将其应用于一个真的表达式，运算符返回假。如果将其应用于一个为假的表达式，运算符返回真。\
  \ |\n\n[表 4-4] 显示了使用逻辑运算符的几个复合布尔表达式示例。\n\n### 表 4-4 使用逻辑运算符的复合布尔表达式\n\n| 表达式 | 含义\
  \ |\n| --- | --- |\n| `x > y && a < b` | `x` 是否大于 `y` 且 `a` 是否小于 `b`？ |\n| `x ==\
  \ y || x == z` | `x` 是否等于 `y` 或 `x` 是否等于 `z`？ |\n| `! (x > y)` | 表达式 `x > y` 是否不为真？\
  \ |\n\n## `&&` 运算符\n\n`&&` 运算符是逻辑与运算符。它接受两个尔表达式作为操作数，并创建一个仅当两个子表达式都为真时为真的复合布尔表达式。以下是一个使用\
  \ `&&` 运算符的 `if` 语句示例：\n\n```csharp\n if (temperature < 20 && minutes > 12)\n{\n\
  \    MessageBox.Show(\"The temperature is in the danger zone.\");\n}\n```\n\n在该语句中，两个布尔表达式\
  \ `temperature < 20` 和 `minutes > 12` 被组合为一个复合表达式。只有当 `temperature` 小于 20 且 `minutes`\
  \ 大于 12 时，才会执行 `MessageBox.Show` 语句。如果任何布尔子表达式为假，复合表达式为假，就不会显示消息。\n\n[表 4-5] 显示了\
  \ `&&` 运算符的真值表。真值表列出了所有与 `&&` 运算符连接的真假可能的组合。表达式的结果也显示出来。\n\n### 表 4-5 `AND` 运算符的真值表\n\
  \n| 表达式 | 表达式的值 |\n| --- | --- |\n| `true && false` | `false` |\n| `false && true`\
  \ | `false` |\n| `false && false` | `false` |\n| `true && true` | `true` |\n\n如表所示，`&&`\
  \ 运算符的两侧都必须为真，表达式才为真。\n\n## `||` 运算符\n\n`||` 运算符是逻辑或运算符。它接受两个布尔表达式作为操作数，并创建一个只要任一子表达式为真就为真的复合布尔表达式。以下是一个使用\
  \ `||` 运算符的 `if` 语句示例：\n\n```csharp\n if (temperature < 20 || minutes > 12)\n{\n\
  \    MessageBox.Show(\"The temperature is in the danger zone.\");\n}\n```\n\n在该语句中，两个布尔表达式\
  \ `temperature < 20` 和 `minutes > 12` 被组合为一个复合表达式。只有当 `temperature` 小于 20 或 `minutes`\
  \ 大于 12 时，才会执行 `MessageBox.Show` 语句。[表 4-6] 显示了 `||` 运算符的真值表。\n\n### 表 4-6 `OR`\
  \ 运算符的真值表\n\n| 表达式 | 表达式的值 |\n| --- | --- |\n| `true || false` | `true` |\n| `false\
  \ || true` | `true` |\n| `false || false` | `false` |\n| `true || true` | `true`\
  \ |\n\n## 短路求\n\n`&&` 和 `||` 运算符都执行短路求值。`&&` 运算符的工作原理是：如果左侧表达式为假，则不计算右侧。\n\n`||`\
  \ 运算符的工作原理是：如果左侧表达式为真，则不计算右侧。\n\n## `!` 运算符\n\n`!` 运算符是逻辑非运算符。它是一个一元运算符，接受一个布尔表达式作为操作数并反转其逻辑值。换句话说，如果表达式为真，`!`\
  \ 运算符返回假；如果表达式为假，`!` 运算符返回真。以下是使用非运算符的 `if` 语句：\n\n```csharp\n if (!(temperature\
  \ > 100) )\n{\n    MessageBox.Show(\"This is below the maximum temperature.\");\n\
  }\n```\n\n首先测试表达式 `(temperature > 100)` 并得到真或假。然后对该值应用 `!`。如果表达式 `(temperature >\
  \ 100)` 为真，`!` 运算符返回假。如果表达式 `(temperature > 100)` 为假，`!` 运算符返回真。之前的代码等同于询问“温度是否不大于\
  \ 100？”\n\n注意，在这个示例中，我们对表达式 `temperature > 100` 加了括号。这是必要的，因为 `!` 运算符的优先级高于关系运算符。如果我们不对表达式\
  \ `temperature > 100` 加括号，`!` 运算符将仅作用于 `temperature` 变量。\n\n[表 4-7] 显示了 `!` 运算符的真值表。\n\
  \n### 表 4-7 `!` 运算符的真值表\n\n| 表达式 | 表达式的值 |\n| --- | --- |\n| `! true` | `false`\
  \ |\n| `! false` | `true` |\n\n\n\n\n我们之前提到过 `!` 运算符的优先级高于关系运算符。`&&` 和 `||` 逻辑运算符的优先级低于关系运算符。例如，看以下表达式：\n\
  \n```\ncreditScore > 700 || accountBalance > 9000\n```\n\n当求值该表达式时，`>` 运算符先作用，然后是\
  \ `||` 运算符作用。该表达式与以下表达式等同：\n\n```\n(creditScore > 700) || (accountBalance > 9000)\n\
  ```\n\n许多程序员选择用括号将逻辑运算符左右两侧的表达式括起来，如下所示。尽管在很多情况下不需要加括号，但使用括号可以使复合表达式更易于理解。\n\n#\
  \ 使用逻辑运算符检查数值范围\n\n有时，你需要编写代码来确定一个数值是否在特定的值范围内，或是否在特定范围之外。在确定一个数字是否在范围内时，最好使用 `&&`\
  \ 运算符。例如，以下 `if` 语句检查 `x` 的值，以确定它是否在 20 到 40 的范围内：\n\n```\nif (x > 20 && x < 40)\n\
  {\n    MessageBox.Show(\"该值在接受范围内.\");\n}\n```\n\n该语句测试的复合布尔表达式仅在 `x` 大于 20 *且*\
  \ 小于 40 时才为真。`x` 的值必须在 20 和 40 之间，该复合表达式才为真。\n\n在确定一个数字是否在范围之外时，最好使用 `||` 运算符。以下语句确定\
  \ `x` 是否在 20 到 40 的范围之外：\n\n```\nif (x < 20 || x > 40)\n{\n    MessageBox.Show(\"\
  该值在接受范围之外.\");\n}\n```\n\n在测试数字范围时，不要混淆逻辑运算符的逻辑是非常重要的。例如，以下代码中的复合布尔表达式永远不会测试结果为真：\n\
  \n```\n// 这是一个错误！\nif (x < 20 && x > 40)\n{\n    MessageBox.Show(\"该值在接受范围之外.\"\
  );\n}\n```\n\n显然，`x` 不可能既小于 20 又大于 40。\n\n让我们来看一个检查用户输入值范围的示例应用程序。打开本书中 *Chap04*\
  \ 文件夹下的 *Range Checker* 应用程序。图 4-17 显示了程序的表单以及一些控件的名称。当你运行程序时，在 `inputTexBox` 控件中输入一个整数并点击\
  \ `checkButton` 控件。如果你输入 1 到 10 之间的数字，会出现一个消息框告知你该数字是接受的。否则，会出现一个消息框告知该数字*不*接受。\n\
