  \ 菜单上，点击 `Solution Explorer`。\n*   如果你看不到 `Properties` 窗口，点击菜单栏上的 `View`。在 `View`\
  \ 菜单上，点击 `Properties`。\n## 使用自动隐藏\nVisual Studio 中的许多窗口都有一个名为“自动隐藏”（Auto Hide）的功能。当你在窗口标题栏中看到图钉图标时（如图\
