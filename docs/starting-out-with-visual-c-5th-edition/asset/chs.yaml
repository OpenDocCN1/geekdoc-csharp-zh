  \ 方法，并将 `str` 变量作为参数传递。\n\n如果你正在编写一个方法并希望它在被调用时接收参数，你必须为该方法配备一个或多个参数变量。参数变量（通常称为参数）是一种特殊的变量，在方法被调用时用于接收参数。这里是一个带有参数变量的方法示例：\n\
  \n```csharp\n private void DisplayValue(int value)\n{\n    MessageBox.Show(value.ToString());\n\
  }\n```\n\n注意出现在括号 `(int value)` 内的 `int` 变量声明。这是参数变量的声明，它允许 `DisplayValue` 方法接受一个\
  \ `int` 值作为参数。这里是调用 `DisplayValue` 方法的示例，将 `5` 作为参数传递：\n\n```csharp\nDisplayValue(5);\n\
  ```\n\n该语句执行了 `DisplayValue` 方法。括号内列出的参数被赋值给方法的参数变量 `value`。这在 图 6-10 中如图所示。\n\n\
  ## 图 6-10：将值 5 传递给 `DisplayValue` 方法\n\n![截图显示了将值 5 传递给 DisplayValue 方法的代码。](img/FG_06_010.png)图\
  \ 6-10 完整备用文本\n\n在 `DisplayValue` 方法内部，变量 `value` 将包含传递给它的任何参数的值。如果我们传递 `5` 作为参数，该方法将在消息框中显示值\
  \ `5`。\n\n你也可以将变量的内容和表达式的值作为参数传递。例如，以下语句通过传递各种参数调用了 `DisplayValue` 方法：\n\n```csharp\n\
