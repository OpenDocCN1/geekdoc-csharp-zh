  12. 哪个属性允许你更改控件文本的颜色？\n\n# 编程题\n\n### 1. 格式化\n创建一个应用程序，允许用户输入以下数据：\n* 用户的名字\n* 用户的中间名\n\
  * 用户的姓\n* 用户偏好的头衔\n\n该应用程序应该显示：\n* 用户的名字\n* 用户的中间名\n* 用户的姓\n* 用户偏好的头衔\n\n### 2.\
  \ 小费与总额\n创建一个应用程序，允许用户输入餐费费用。当点击按钮时，应用程序应计算 15% 的小费、7% 的销售税以及总额。\n\n### 3. 行程\n\
  假设没有事故或延迟，汽车行驶的距离可以通过公式计算：\n`Distance = Speed * Time`\n\n创建一个应用程序，允许用户输入每小时英里的速度。应用程序应该显示：\n\
  * 汽车在 5 小时内行驶的距离\n* 汽车在 8 小时内行驶的距离\n* 汽车在 12 小时内行驶的距离\n\n### 4. 销售税与总额\n创建一个应用程序，允许用户输入购买金额。程序随后计算州销售税（4%）、县销售税（2%）和总额。\n\
