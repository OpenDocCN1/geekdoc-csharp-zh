  \n`Tony Gaddis` 是 *Starting Out With* 系列教科书的主作者。Tony 在北卡罗来纳州的海伍德社区学院教授计算机科学课程已有近\
  \ 20 年经验。他是一位广受誉目的讲师，曾被选为北卡罗来纳州社区学院教师，并获得了国家员工和组织发展协会的教学卓越奖。\n\n\n# 学生注意\n\n## 安装\
  \ Visual Studio\n\n为了完成书中的教程和编程题，你需要在电脑上安装 Visual Studio 2017 或更高版本。我们建议你从以下网站下载\
  \ Visual Studio Community 2017 并将其安装到你的系统中：\n\n`www.visualstudio.com`\nVisual Studio\
  \ Community 2017 是一个免费、功能全开发环境，是本教材的完美伴侣。\n\n## 注意事项\n\n如果你在学校的机房里工作，很有可能已经安装了 `Microsoft\
  \ Visual Studio`。如果是这样的话，你的老师会教你如何启动 Visual Studio。\n\n## 安装学生示例程序文件\n随书提供的学生示例程序文件可以从本书的配套网站下载：\n\
  \n`www.pearson.com/cs-resources`\n\n书中的许多教程都需要这些文件。只需将学生示例程序文件下载到硬盘上的一个你可以易于访问的位置即可。\n\
  \n\n## 1.1 引言\n\n想一看人们使用电脑的一些不同方式。在学校里，学生使用电脑完成写论文、搜索文章、发送电子邮件和参加在线课程等任务。在工作中，人们使用电脑分析数据、制作演示、进行业务交易、与客户和同事交流、控制制造设施中的机器以及进行许多其他事情。在家里，人们使用电脑支付账单、在线购物、与朋友和家人保持联系以及玩电脑游戏。不要忘记智能手机、平板电脑、汽车导航系统和许多其他设备也是电脑。在我们的日常生活中，电脑用途几乎是无限的。\n\
  \n计算机可以执行如此广泛的事情，是因为它们是可以编程的，这意味着计算机的设计不是为了只某一项工作，而是为了执行程序告诉它们执行的任何工作。程序是计算机执行任务时遵循的一系列指令。例如，图\
  \ 1-1 显示了两个常用 Microsoft 程序的屏幕：Word 和 PowerPoint。Word 是一个文字处理程序，允许你创建、编辑和打印文档。PowerPoint\
  \ 允许你创建图形幻片并将其作为演示文的一部分。\n\n### 图 1-1 文字处理程序和演示文程序\n![显示了两个屏幕，第一个显示了兼容模式下的 Microsoft\
  \ Word 文档视图，第二个显示了 PowerPoint 演示。](img/FG_01_001.png)图 1-1 完整备用文本\n\n程序通常被称为软件。软件对计算机是至关重要的，因为没有软件，计算机什么也做不了。所有让我们的计算机实用的软件都是由被称为程序员或软件开发者创建的。程序员或软件开发者是指具有设计、创建和测试计算机程序所需的培训和技能的人。计算机编程是一项令人兴奋且有丰报的职业。今天，程序员工作于商业、医学、政府、执法、农业、娱乐以及几乎每一个其他领域。\n\
  \n## 1.2 硬件与软件\n\n### 概念\n\n构成计算机的物理设备被称为硬件。在计算机上运行的程序被称为软件。\n\n\n硬件指的是计算机的所有物理设备或组件。计算机不是单一设备，而是一个共同工作的设备系统。就像交响乐团中的不同乐器一样，计算机中的每个设备都有自己的作用。\n\
  \n如果你曾买过电脑，可能可能见过销售材料中列过微处理器、内存、磁盘驱动器、显示器、显卡等组件。除非你已经非常了解电脑，或者有一个了解电脑的朋友，否则理解这些不同组件的作用可能会很混乱。正如图\
  \ 1-2 所示，典型的计算机系统由以下主要组件组成：\n\n*   中央处理单元 (CPU)\n*   内存\n*   辅助存储设备\n*   输入设备\n\
  *   输出设备\n### 图 1-2 计算机系统的典型组件\n\n![插图显示了计算机系统的各种组件。](img/FG_01_002.png)图 1-2 完整备用文本\n\
  \n让我们仔细观察这些组件中的每一个。\n\n\n\n\n当计算机正在执行程序指令其完成的任务时，我们说计算机正在运行或执行该程序。中央处理器，简称 `CPU`，是计算机中实际运行程序的部分。`CPU`\
  \ 是计算机中最重要的组件，因为没有它，计算机就无法运行软件。\n\n\n## 图 1-3 ENIAC 计算机\n\n![一张黑白照片显示了计算机程序员贝蒂·珍·詹宁斯（左）和弗兰·比拉斯（右）正在操作\
  \ ENIAC 计算机的主控制面板。该计算机是由真空管和开关组成的复杂系统。](img/FG_01_003.jpg)\n\n今天，`CPUs` 是称为微处理器的微型芯片。图\
  \ 1-4 展示了一位实验室技术人员拿着现代微处理器的照片。微处理器比早期计算机中的旧式电磁 `CPUs` 要小得多，而且功能也强大得多。\n\n## 图 1-4\
  \ 一位实验室技术人员拿着一个现代微处理器\n\n![一张黑白照片特写了一位实验室技术人员展示她手中拿着的一块小芯片。她戴着安全眼镜、口罩和手套。](img/FG_01_004.jpg)\n\
  \n\n你可以将主内存看作计算机的工作区域。计算机在程序运行时存储程序的地方，以及存储程序正在处理的数据的地方。例如，假设你正在使用一个文字处理程序为你的某门课程写论文。当你进行此操作时，文字处理程序和论文都存储在主内存中。\n\
  \n主内存通常被称为随机存取存储器，或 `RAM`（注：原文为 random access memory，此处保留 RAM）。它之所以有这个名字，是因为 `CPU`\
  \ 能够快速访问存储在 `RAM` 中任何随机位置的数据。`RAM` 通常是某种易失性内存类型，仅在程序运行时用于临时存储。当计算机关闭时，`RAM` 的内容会被擦除。在你的计算机内部，`RAM`\
  \ 存储在芯片中，类似于图 1-5 所示的芯片。\n\n## 图 1-5 内存芯片\n\n\n## 次级存储设备\n\n次级存储是一种可以长时间保存数据的内存，即使计算机没有电源也是如此。程序通常存储在次级内存中并在需要时加载到主内存中。重要数据，如文字处理文档、工资数据和库存记录，也会保存到次级存储中。\n\
  \n常见的次级存储设备类型是磁盘驱动器。传统的磁盘驱动器通过将数据磁编码到旋转的圆形磁盘上来存储数据。将数据存储在固态内存中的固态硬盘（SSD）正变得越来越流行。固态硬盘没有移动部件，运行速度比传统的磁盘驱动器更快。\n\
  大多数计算机机箱内部都安装了某种次级存储设备，无论是传统的磁盘驱动器还是固态硬盘。还有外部存储设备，它们连接到计算机的通信端口之一或插入内存槽。外部存储设备可用于创建重要数据的备份副本，或将数据移动到另一台计算机。例如，`USB`（通用串行总线）驱动器和\
  \ `SD`（安全数字）内存卡是系统中以磁盘驱动器形式出现的小设备。它们廉价、可靠，且足够小可以装进口兜里。\n\n光盘（CD）和数字功能光盘（DVD）等光学设备也常用于数据存储。数据不是磁性地记录在光盘上，而是编码为磁盘表面的的一系列坑。`CD`\
  \ 和 `DVD` 驱动器使用激光探测这些坑，从而读取编码的数据。光盘可以存储大量数据，由于现在刻录 `CD` 和 `DVD` 驱动器已非常普遍，它们是创建数据备份副本的良好介质。\n\
  \n\n输入是计算机从人类或其他设备收集的任何数据。收集数据并发送计算机的组件被称为输入设备。常见的输入设备有键盘、鼠标、触摸屏、扫描仪、麦克风和数字相机。磁盘驱动器和光驱也可以被认为是输入设备，因为程序是从那里检索并加载到计算机。\n\
  \n## 输出设备\n\n输出是计算机为人类或其他设备产生的任何数据。可能是销售报告、名称列表或图像。常见的输出设备是屏幕和打印机。存储设备也可以认为是输出设备，因为系统会将数据发送到那里进行保存。\n\
  \n## 软件\n如果计算机要运行，软件是必不可少的。从你打开电源开关到关机，计算机所做的一切都在软件控制之下。软件分为两大类：系统软件和应用程序。让我们仔细查看每一类。\n\
  \n### 系统软件\n\n控制和管理计算机基本操作的程序通常被称为系统软件。系统软件通常包括以下类型：\n\n### 操作系统\n\n\n### 公用程序\n\
  \n* 公用程序执行特定任务，以增强计算机功能或保护数据。\n\n### 开发工具\n\n* 程序员用于创建、修改和测试软件的软件工具被称为开发工具。汇编器、编译器和解释器（在本章后面将讨论）是属于该类的程序示例。\n\
  \n\n使计算机适用于日常任务的程序被称为应用程序。这些是人们通常在计算机上运行时间最长的程序。图 1-1 在本章开头显示了两个常用应用程序的屏幕——Microsoft\
  \ Word（一个文字处理程序）和 Microsoft Powerpoint（一个演示文程序）。应用程序的其他示例还有电子表格程序、电子邮件程序、网络浏览器和游戏程序。\n\
  \n# 检查点\n\n1. 什么是程序？\n2. 什么是硬件？\n3. 列出计算机系统的五个主要组件。\n4. 计算机的哪个部分实际运行程序？\n\n\n\n\n\
  \n## 1.6 计算机的哪个部分在计算机没有供电的情况下也能长期存储数据？\n\n## 1.7 计算机的哪个部分从人类和其他设备中收集数据？\n\n\n##\
  \ 1.9 哪一组基本程序控制计算机硬件的内部运行？\n\n## 1.10 执行特定任务的程序（例如病毒扫描程序、文件压缩程序或数据备份程序）称为什么什么？\n\
  \n## 1.11 文字处理程序、电子表格程序、电子邮件程序、Web 浏览器和游戏程序属于哪类软件？\n\n\n### 概念\n\n存储在计算机中的所有数据都会转换为\
  \ 0 和 1 的序列。\n\n计算机内存被分为称为“字节”（byte）的微小存储单元。一个字节的内存仅足够存储一个字母或很小的数字。为了执行任何有意义的操作，计算机必须拥有大量的字节。今天大多数计算机拥有数百万甚至数十亿字节的内存。\n\
  \n每个字节又分为八个更小的称为“位”（bit）的存储单元。bit 一术是二进制数字（binary digit）的缩写。计算机科学家通常将位视为可以开启或关闭的微型开关。然而，至少在传统意义上，位并不是真正的“开关”。在大多数计算机系统中，位是微小的电子元件，可以保持正电或负电荷。计算机科学家将正电视为处于\
  \ `on` 状态的开关，将负电视为处于 `off` 状态的开关。图 1-6 显示了计算机科学家看待内存字节的方式：作为一组开关的集合，每个开关都翻转到开启或关闭位置。\n\
  \n\n![插图显示了八个开关的集合，每个开关都翻转到开启或关闭位置。从左到右，开关的位置如下：关闭、开启、关闭、关闭、开启、开启、关闭和开启。](img/FG_01_006.png)\n\
  \n当数据被存储在字节中时，计算机会将八位设置为表示该数据的开启/关闭模式。例如，图 1-7 中左侧的模式显示了数字 77 是如何存储在字节中的，右侧的模式显示了字母\
  \ A 是如何存储在字节中的。稍后，你将看到这些模式是如何被决定的。\n\n\n![一组两个插图显示了八个开关，分别代表字节中数字 77 的位模式和字母 A 的位模式。](img/FG_01_007.png)图\
  \ 1-7 完整替代文本\n\n# 存储数字\n\n位可以用一种非常有限的方式表示数字。取决于位是开启还是关闭，它可以代表两个不同值中的一个。在计算机系统中，关闭的位表示数字\
  \ 0，开启的位表示数字 1。这与二进制计数法完美对应。在二进制计数法（或通常所说的二进制）中，所有的数值都写写成 0 和 1 的序列。这里有一个二进制形式表示的数字示例：\n\
  \n```\n```\n\n二进制数中每个数字的位置都有一个对应的值。从右侧数字开始向左移动，位置值为 2⁰、2¹、2²、2³ 等，如图 1-8 所示。图 1-9\
  \ 显示了计算了位置值的相同图。从右侧数字开始向左移动，位置值为 1, 2, 4, 8 等。\n\n# 图 1-8 作为 2 的幂的二进制数字值\n\n![图表显示了作为\
  \ 2 的幂的二进制数字值。](img/FG_01_008.png)图 1-8 完整替代文本\n# 图 1-9 二进制数字的值\n\n![图表显示了二进制数字的值。](img/FG_01_009.png)图\
  \ 1-9 完整替代文本\n\n要确定一个二进制数的值，只需相加所有 1 的位置值。例如，在二进制数 `10011101` 中，1 的位置值为 1, 4, 8,\
  \ 16, 和 128。如图 1-10 所示，这些位置值的和为 157。因此，二进制数 `10011101` 的值为 157。\n\n# 图 1-10 确定 10011101\
  \ 的值\n\n\n如图 1-11 所示，显示了你如何在字节中设数字 157。每个 1 都由 `on` 位置的位表示，每个 0 都由 `off` 位置的位表示。\n\
  \n# 图 1-11 157 的位模式\n\n![插图显示了代表数字 157 位模式的八个开关集合。](img/FG_01_011.png)图 1-11 完整替代文本\n\
  \n当字节中的所有位都设置为 0（关闭）时，字节的值为 0。当字节中的所有位都设置为 1（开启）时，字节持有可以存储的最大值。字节中可以存储的最大值为 `1 +\
  \ 2 + 4 + 8 + 16 + 32 + 64 + 128 = 255`。这种限制的存在是因为字节中只有八位。\n如果你需要存储大于 255 的数字怎么办？答案很简单：使用超过\
  \ 1 个字节。例如，假设我们将两个字节放在一起。这给了我们 16 位。这些 16 位的值将是 2⁰、2¹、2²、2³ 等，直到 `2¹⁵`。如图 1-12 所示，2\
  \ 个字节可以存储的最大值为 65,535。如果你需要存储比这更大的数字，就需要更多的字节。\n\n# 图 1-12 用于大数字的两个字节\n\n![插图显示了代表大数字两个字节的两组开关。](img/FG_01_012.png)图\
  \ 1-12 完整替代文本\n\n### 提示\n\n如果你觉得这些内容让你无所措，放松点！在编程时，你不需要实际上将数字转换为二进制。知道这个过程是在计算机内部进行的会对你的学习有所帮助，从长期来看，这些知识将让你成为一个更好的程序员。\n\
  # 存储字符\n\n存储在计算机内存中的任何数据都必须以二进制数存储。这包括字母和标点符号等字符。当字符存储在内存中时，首先将其转换为数字代码。然后以二进制数存储在内存中。\n\
  \n多年来开发了不同的编码方案来表示计算机内存中的字符。从历史上看，这些编码方案中最重要的是 `ASCII`，全称为美国信息交换标准。`ASCII` 是 128\
  \ 个数字代码的集合，代表英语字母、各种标点符号和其他字符。例如，大写字母 A 的 `ASCII` 代码是 65。当你电脑键盘上输入大写字母 A 时，数字 65\
  \ 被存储在内存中（当然，是以二进制数的形式）。如图 1-13 所示。\n\n# 图 1-13 以数字 65 存储在内存中的字母 A\n\n\n\n\n![插图显示了大写字母\
  \ A 的 ASCII 码为 65。](img/FG_01_013.png)图 1-13 完整替代文本\n\n### 提示\n\n`ASCII` 缩写读作“askee”。\n\
  如果你好奇的话，大写 B 的 `ASCII` 码是 66，大写 C 是 67，以此此类推。附录 C 显示了所有的 `ASCII` 及其代表的字符。\n\n`ASCII`\
  \ 字符集开发于 20 世纪 60 年代初，最终被几乎所有的计算机制造商采用。然而，`ASCII` 是有限的，因为它只定义了 128 个字符的代码。为了解决这个问题，`Unicode`\
  \ 字符集开发于 20 世纪 90 年代初。`Unicode` 是一种广泛的编码方案，兼容 `ASCII`，还能表示世界上许多语言的字符。今天，`Unicode`\
  \ 正在迅速成为计算机行业使用的标准字符集。\n\n# 高级数字存储\n\n之前你已经看到数字是如何存储在内存中的。也许你那时认为，二进制计数法只能表示从 `0`\
  \ 开始的整数。负数和实数（如 `3.14159`）无法使用我们过的简单二进制计数技术来表示。\n\n计算机能够在内存中存储负数和实数，但为了实现这一点，它们使用了二进制计数系统的编码方案。负数使用被称为“补码”的技术进行编码，而实数则使用浮点表示法进行编码。你不需要知道这些编码方案是如何工作的，知道它们被用于将负数和实数转换为二进制格式即可。\n\
  # 其他类型的数据\n\n计算机通常被称为数字设备。`数字` 一词可以描述任何使用二进制数字的设备。`数字数据`是以二进制形式存储的数据，而数字设备是任何与二进制数据工作的设备。在本节中，我们讨论了数字和字符是如何以二进制存储的，但计算机也处理许多其他类型的数字数据。\n\
  \n例如，考虑你用数码相机拍摄的照片。这些图像由被称为 `pixels` 的微彩色点组成（`pixel` 一词是 picture element 的缩写）。如图\
  \ 1-14\n\n你在 CD 播放器、iPod 或 MP3 播放器上播放的音乐也是数字的。一首数字歌曲被分解成许多被称为 `samples` 的片段。每个样本都被转换为一个二进制数，并存储在内存中。歌曲被分割的样本越多，播放时听起来就越像原始音乐。一首\
  \ CD 级的歌曲每秒被分成超过 44,000 个样本！\n\n\n1. 1.12 多大的内存足够存储一个字母表字母或一个小的数字？\n2. 1.13 能够设置为“开启”或“关闭”的微小“开关”称为什么？\n\
  3. 1.14 所有的数值都写为 0 和 1 的序列？\n4. 1.15 `ASCII` 的用途是什么？\n5. 1.16 哪种编码方案足够广泛表示世界上许多语言的所有字符？\n\
  6. 1.17 `数字数据` 和 `数字设备` 是什么意思？\n\n## 1.4 程序是如何运行的\n### 概念\n\n计算机的 `CPU` 只能理解用机器语言编写的指令。因为人们发现用机器语言编写整个程序非常困难，因此发明了其他编程语言。\n\
  \n之前，我们提到 `CPU` 是计算机中最重要的组件，因为它是计算机运行程序的部分。有时 `CPU` 被称为“计算机的大脑”，并被描述为“智能”。虽然这些是常见的比喻，但你应该理解\
  \ `CPU` 不是大脑，它并不智能。`CPU` 是旨在执行特定任务的电子设备。特别是，`CPU` 设计用于执行以下操作：\n\n* 从主内存中读取一段数据\n\
  * 两个数字相加\n* 两个数字相乘\n* 将一个数字除以另一个数字\n* 将一段数据从一个内存位置移动到另一个内存位置\n* 判断一个值是否等于另一个值\n\n\
  从这个列表可以看出，`CPU` 对数据进行操作。然而，`CPU` 本身无所作为。它必须被告诉做什么，这就是程序的目的。程序无非是导致 `CPU` 执行操作的指令列表。\n\
  \n程序中的每条指令都是告诉 `CPU` 执行特定操作的命令。这里有一个出现在程序中的指令示例：\n\n10110000\n```\n\n对你和我来说，这只是\
  \ 0 和 1 的序列。但对于 `CPU` 来说，这是一条执行操作的指令。¹ 它用 0 和 1 编写，因为 CPU 只能理解用机器语言编写的指令，而机器语言指令总是用二进制编写的。\n\
  \n`CPU` 能够执行的每个操作都有对应的机器语言指令。例如，有相加数字的指令；有从一个数字减去另一个的指令；以此此类推。`CPU` 可以执行的所有指令集被称为\
  \ `CPU` 的指令集。\n\n### 注意\n\n今天有几微处理器公司制造 `CPU`。一些广为人知的微处理器公司包括 `Intel`、`AMD` 和 `Motorola`。如果你仔细观察你的计算机，可能会发现显示其微处理器标志的标签。\n\
  每个品牌的微处理器都有自己独特的指令集，该指令集通常只有相同品牌的微处理器理解。例如，`Intel` 微处理器理解相同的指令，但它们不理解 `Motorola`\
  \ 微处理器的指令。\n\n程序通常存储在磁盘驱动器等次级存储设备上。当你在计算机上安装程序时，程序通常是从 CD-ROM 或可能从网站下载到你计算机的磁盘驱动器中的。\n\
  \n\n\n\n\n虽然程序可以存储在磁盘驱动器等次级存储设备上，但每当 CPU 执行它时，必须将其复制到主内存（或 RAM）中。例如，假设你的计算机磁盘上有一个文字处理程序。要执行该程序，你用鼠标双击该程序的图标。这会导致程序从磁盘复制到主内存中。然后，计算机的\
  \ CPU 就会执行主内存中的程序副本。这一过程在图 1-15 中所示。\n# 图 1-15：程序被复制到主内存并随后执行\n\n![一张图说明了将程序复制到主内存及其执行的过程。](img/FG_01_015.png)图\
  \ 1-15 完整替代文本\n\n当 CPU 执行程序中的指令时，它正处于一个被称为取指-解码-执行循环的过程中。该循环由三个步骤组成，对于程序中的每条指令都会重复该循环。步骤如下：\n\
  \n1. **取指 (Fetch)**。程序是一个长机器语言指令序列。循环的第一步是从内存中取（或读取）下一条指令到 CPU 中。\n2. **解码 (Decode)**。机器语言指令是一个二进制数，代表告诉\
  \ CPU 执行某操作的命令。在这一步中，CPU 解码刚从内存取出的指令，以确定它应该执行哪种操作。\n\n图 1-16 展示了这些步骤。\n\n# 图 1-16：取指-解码-执行循环\n\
  \n![插图显示了涉及取指-解码-执行循环的步骤。](img/FG_01_016.png)图 1-16 完整替代文本\n\n\n计算机只能执行用机器语言编写的程序。如前所述，一个程序可能包含成千上万甚至上百万条二进制指令，编写这样的程序将非常枯燥且耗费时间。用机器语言进行编程也会非常困难，因为在错误的位置放置\
  \ `0` 或 `1` 都会导致错误。\n\n尽管计算机的 CPU 只理解机器语言，但让人们用机器语言编写程序是不切实际的。出于这个原因，汇编语言在计算机计算早期²作为机器语言的替代方案被创建。汇编语言不再使用二进制数作为指令，而是使用称为助记词的短单词。例如，在汇编语言中，助记词\
  \ `add` 通常意味着相加，`mul` 通常意味着相乘，而 `mov` 通常意味着将一个值移动到内存中的某个位置。当程序员使用汇编语言编写程序时，他或她可以写短助记词而不是二进制数。\n\
  \n### 注意\n\n有许多不同的汇编语言版本。之前提到过，每个 CPU 品牌都有自己的机器语言指令集。每个 CPU 品牌通常也有自己的汇编语言。\n\n\n\
  # 图 1-17：汇编器将汇编语言程序翻译为机器语言程序\n\n![插图显示了汇编器将汇编语言程序翻译为机器语言程序。](img/FG_01_017.png)图\
  \ 1-17 完整替代文本\n\n## 高级语言\n\n虽然汇编语言使得无需编写二进制机器语言指令，但它并非没有困难。汇编语言主要是机器语言的直接替代品，和机器语言一样，它要求你对\
  \ CPU 有深入的了解。汇编语言还要求即使对于最简单的程序，也要编写大量的指令。因为汇编语言在本质上与机器语言非常接近，所以它被称为低级语言。\n在 20 世纪\
  \ 50 年代，被称为高级语言的新一代编程语言开始出现。高级语言允许你在无需了解 CPU 如何工作且无需编写大量低级指令的情况下，创建强大且复杂的程序。此外，大多数高级语言使用易于理解的单词。例如，如果程序员正在使用\
  \ COBOL（一种 20 世纪 50 年代的高级语言），他或她会写以下指令在屏幕上显示 Hello world：\n\n```\nDISPLAY \"Hello\
  \ world\"\n```\n\n用汇编语言完成相同的工作需要对 CPU 如何交互有深入的知识。高级语言允许程序员关注他们想要完成的任务，而不是 CPU 如何执行这些程序。自\
  \ 20 世纪 50 年代以来，已经创建了数千种高级语言。表 1-1 列出了一些为人知的语言。\n\n\n| 语言 | 描述 |\n| --- | --- |\n\
  | Ada | Ada 创建于 20 世纪 70 年代，主要用于美国国防部的应用程序。该语言以计算机领域的影响力人物达格拉斯伯爵命名。 |\n| BASIC |\
  \ Beginners All-purpose Symbolic Instruction Code（学者通用符号指令）是一种通用语言，最初设计于 20 世纪 60\
  \ 年代，以便初学者学习。今天，有许多版本的 BASIC。 |\n| FORTRAN | FORmula TRANslator（公式翻译器）是第一种高级语言。它在\
  \ 20 世纪 50 年代设计，用于进行数学计算。 |\n| COBOL | Common Business-Oriented Language（公共业务语言）创建于\
  \ 20 世纪 50 年代，用于业务应用。 |\n| Pascal | Pascal 创建于 1970 年，最初设计用于教学。该语言以数学家、物理学家和哲学家布莱兹·帕斯卡命名。\
  \ |\n| C# | 读作“c sharp”，这种语言由微软在 2000 年左右创建，用于开发基于 Microsoft .NET 平台的应用程序。 |\n|\
  \ Java | Java 由 Sun 公司在 20 世纪 90 年代初创建。它可以用于开发在单机上运行或通过 Web 服务器从互联网运行的程序。 |\n| JavaScript\
  \ | JavaScript 创建于 20 世纪 90 年代，可用于网页。尽管名字如此，JavaScript 与 Java 没有关系。 |\n| Python\
  \ | Python 是创建于 20 世纪 90 年代初的通用语言。它在商业和学术应用中变得流行。 |\n| Ruby | Ruby 是一种创建于 20 世纪\
  \ 90 年代的通用语言。它正日益成为 Web 服务器上运行程序的流行语言。 |\n| Visual Basic | Visual Basic（通常称为 VB）是微软的一种编程语言和软件开发环境，允许程序员快速创建\
  \ Windows 应用程序。VB 最初创建于 20 世纪 90 年代初。 |\n\n\n\n\n## 关键字、操作符与语法：概述\n\n每种高级语言都有其独特的一组预定义单词，程序员必须使用这些单词来编写程序。构成高级编程语言的单词被称为关键字（keywords）或保留字（reserved\
  \ words）。每个关键字都有特定的含义，不能用于任何其他用途。表 1-2 显示了 C# 编程语言中的关键字。\n\n## 表 1-2 C# 关键字\n\n\
  | `abstract` | `as` | `base` | `bool` |\n| `char` | `checked` | `class` | `const`\
  \ |\n| `continue` | `decimal` | `default` | `delegate` |\n| `do` | `double` | `else`\
  \ | `enum` |\n| `event` | `explicit` | `extern` | `false` |\n| `finally` | `fixed`\
  \ | `float` | `for` |\n| `foreach` | `goto` | `if` | `implicit` |\n| `in` | `int`\
  \ | `interface` | `internal` |\n| `is` | `lock` | `long` | `namespace` |\n| `out`\
  \ | `override` | `params` | `private` |\n| `protected` | `public` | `readonly` |\
  \ `ref` |\n| `return` | `sbyte` | `sealed` | `short` |\n| `sizeof` | `stackalloc`\
  \ | `static` | `string` |\n| `struct` | `switch` | `this` | `throw` |\n| `true`\
  \ | `try` | `typeof` | `uint` |\n| `ulong` | `unchecked` | `unsafe` | `ushort` |\n\
  | `using` | `virtual` | `void` | `volatile` |\n\n除了关键字之外，编程语言还有用于对数据执行各种操作的操作符（operators）。例如，所有编程语言都具有执行算术运算的数学操作符。在\
  \ C# 以及大多数其他语言中，`+` 号是一个用于两个数字相加的操作符。以下代码计算了 12 加 75：\n\n```\n12 + 75\n```\n\nC#\
  \ 语言中还有许多其他操作符，你将在学习本文的过程中不断接触到其中很多。\n\n\n用高级语言编写程序时使用的单个指令称为语句（statements）。一个程序语句由关键字、操作符、标点符号和其他允许的编程元素组成，按正确顺序排列执行操作。\n\
  \n## 编译器与解释器\n\n由于 CPU 仅理解机器语言指令，因此用高级语言编写的程序必须翻译成机器语言。根据编写程序时使用的语言，程序员将使用编译器（compiler）或解释器（interpreter）来完成翻译。\n\
  \n编译器是一个将高级语言程序翻译成独立的机器语言程序的程序。然后，该机器语言程序可以在需要的任何时候执行。这在图 1-18 中所示。如图，编译和执行是两个不同的过程。\n\
  ## 图 1-18 编译高级程序并执行它\n\n![插图显示了编译高级程序及其执行过程中涉及的步骤。](img/FG_01_018.png)图 1-18 完整替代文本\n\
  \n某些编程语言使用解释器，解释器是一种既翻译又执行高级语言程序中指令的程序。当解释器读取程序中的每条指令时，它将其转换为机器语言指令并立即执行。该过程对程序中的每条指令重复进行。这一过程在图\
  \ 1-19 中所示。由于解释器结合了翻译和执行，通常不会创建独立的机器语言程序。\n\n## 图 1-19 使用解释器执行高级程序\n\n\n程序员用高级语言编写的语句被称为\
  \ `source code`（源代码）。程序员将代码输入文本编辑器并保存到文件中。如果代码包含语法错误，编译器或解释器会报错。语法错误通常由关键字拼写错误、标点符号缺失或操作符使用错误引起。当这种情况发生时，程序员进行修正并再次尝试。\n\
  \n### 注意\n\n人类语言也有语法规则。你还记得学习第一门语言时，关于逗号、撇号以及大小写的规则吗？尽管人们经常违反这些。\n\n# 检查点\n1. CPU\
  \ 仅理解什么语言？\n2. 程序每次执行时必须复制到什么内存中？\n3. 当 CPU 执行程序中的指令时，它正在进行什么过程？\n4. 什么是汇编语言？\n\
  5. 什么类型的编程语言允许你在不知道 CPU 如何工作的情况下创建强大的程序？\n6. 每种语言都有一套必须严格遵守的规则。这组规则称为什么？\n7. 将高级语言程序翻译成独立的机器语言程序的程序称为什么？\n\
  8. 既翻译又执行高级语言程序中的程序称为什么？\n\n\n\n\n\n![一张截图显示了 Windows 命令提示符窗口，其中命令行界面显示了位于用户主文件夹内的图像文件夹的路径。](img/FG_01_020.png)\n\
  \n许多计算机用户，尤其是初学者，认为命令行界面难以使用。这是因为有很多命令需要学习，而且每个命令都有其特定的语法，就像编程语句一样。如果输入的命令不正确，它将无法运行。\n\
  在 20 世纪 80 年代，一种称为图形用户界面的新型接口开始在商业操作系统中使用。图形用户界面，简称 `GUI`（读音为“gooey”），允许用户通过屏幕上的图形元素与操作系统和应用程序进行交互。GUI\
  \ 还普及了鼠标作为输入设备的使用。GUI 不再要求用户在键盘上打字输入命令，而是允许用户指向图形元素并点击鼠标按钮来激活它们。\n\n与 GUI 的大部分交互是通过窗口完成的，窗口显示信息并允许用户执行操作。图\
  \ 1-21 显示了一个允许用户更改系统 Internet 设置的窗口示例。用户无需输入晦涩的命令，而是与图标、按钮和滑块等图形元素进行交互。\n\n# 图 1-21\
  \ 图形用户界面中的一个窗口\n\n![一张截图显示了一个允许用户更改系统中 Internet 设置的窗口示例。](img/FG_01_021.png)图 1-21\
  \ 完整替代文本\n\n\n在基于文本的环境（如命令行界面）中，程序决定事件发生的顺序。例如，图 1-22 显示了在文本环境中与计算员工总工资的程序之间发生的交互。首先，程序告诉用户输入工作小时数。图中，用户输入了\
  \ 40 并按下了 ![](img/page_54b.png) 键。接着，程序告诉用户输入其时薪率。图中，用户输入了 50.00，按下了 ![](img/page_54b.png)\
  \ 键。然后，程序显示了用户的总工资。在程序运行期间，用户别无按照要求的顺序输入数据。\n\n# 图 1-22 文本环境中与程序的交互\n\n![一张截图显示了\
  \ Windows 命令提示符，显示了在文本环境中与程序的交互。](img/FG_01_022.png)图 1-22 完整替代文本\n\n然而，在 GUI 环境中，用户决定事件发生的顺序。例如，图\
  \ 1-23 显示了一个计算员工总工资的 GUI 程序。注意，有框允许用户输入工作小时数和薪率。用户可以按照任何顺序输入小时数和薪率。如果用户犯了错，可以删除输入的数据并重新输入。当用户准备好计算时，使用鼠标点击“计算总工资”按钮，程序执行计算。\n\
  # 图 1-23 GUI 程序\n\n![一张截图显示了 GUI 程序的工资窗口。](img/FG_01_023.png)图 1-23 完整替代文本\n\n由于\
  \ GUI 程序必须对用户的操作做出响应，因此被称为事件驱动的。用户引起事件（例如点击按钮），程序对这些事件做出响应。\n\n本书专注于使用 C# 语言开发 GUI\
  \ 应用程序。在学习本书的过程中，你将学习创建通过图形对象的窗口与用户交互的应用程序。你还将学习如何编写应用程序，以响应用户与其交互时发生的事件。\n\n\n\
