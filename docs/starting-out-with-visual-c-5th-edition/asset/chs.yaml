  \n# 工具提示 (ToolTips)\n\n`ToolTip` 是用户将鼠标光标悬停在控件上时显示的一个小框。该框显示控件功能的简短描述。大多数 Windows\
  \ 应用程序使用工具提示作为向用户提供即时简洁帮助的一种。图 B-1 显示了一个示例。\n\n# 图 B-1 显示的工具提示\n\n![截图显示了表单上的两个\
  \ Label 控件。](img/FG_APPb_001.png)图 B-1 完整替代文本\n\n`ToolTip` 控件允许你为表单上的其他控件创建工具提示。通过双击\
  \ `Toolbox` 中的 `ToolTip` 图标将 `ToolTip` 控件放入你的应用程序中，就像放置其他控件一样。当你这样做时，`ToolTip` 控件出现在组件托盘中，组件托盘是\
  \ `Designer` 底部可调整大小的区域，用于存放不可见的控件。图 B-2 显示了一个示例。\n\n# 图 B-2 ToolTip 控件\n\n![截图显示了项目表单\
  \ Designer 选项卡上的工资计算器窗口，底部组件托盘中出现 Tooltip 控件。](img/FG_APPb_002.png)图 B-2 完整替代文本\n\
  \n当你向表单添加 `ToolTip` 控件时，该表单上的所有其他控件都会增加一个新的属性。该新属性命名为 `ToolTipControl` 上的 `ToolTip`，其中\
  \ `ToolTipControl` 是 `ToolTip` 控件的名称。例如，假设你向表单添加了一个 `ToolTip` 控件并保留默认名称 `ToolTip1`。其他控件上的新属性命名为\
  \ `ToolTip1` 上的 `ToolTip`。\n\n`ToolTipControl` 上的 `ToolTip` 属性持有显示为控件 `ToolTip`\
  \ 的字符串。你在控件的 `ToolTipControl` 属性 `ToolTip` 中输入的任何文本，当用户将鼠标光标悬停在控件上时，都会显示为该控件的 `ToolTip`。\n\
