  \n## 8. 面积类\n\n编写一个类，具有三个重载静态方法，用于计算以下几何形状的面积：\n\n* 圆形\n* 矩形\n* 圆柱\n\n以下是计算这些形状面积的公式：\n\
  \n* 圆面积：`Area` = π`r`²\n* 其中 `p` 是 `Math.PI`，`r` 是圆的半径\n* 矩形面积：`Area` = `Width`\
  \ `Length`\n* 圆柱面积：`Area` = π`r`²`h`\n* 其中 `p` 是 `Math.PI`，`r` 是圆柱底面的半径，`h` 是圆柱的高度\n\
  \n由于这三个方法需要重载，因此它们应该具有相同的名称，但参数列表不同。在一个完整的应用程序中演示该类。\n\n# 第 11 章 继承、多态和接口\n\n##\
  \ 11.1 继承\n\n### 概念\n\n继承允许新类扩展现有的类。新类继承其所扩展的类的成员。\n\n### 泛化与特化\n\n在现实世界中，你可以发现许多对象是其他更通用对象的特化版本。例如，“昆虫”一词描述了一种具有众多特征的非常通用的生物。因为蚂蚱和蜜蜂都是昆虫，所以它们拥有昆虫的所有通用特征。此外，它们还有自己的特殊特征。例如，蚂蚱具有跳跃能力，而蜜蜂有刺刺。蚂蚱和蜜蜂是昆虫的特化版本。这在图\
  \ 11-1 中有所说明。\n\n#### 图 11-1 蜜蜂和蚂蚱，昆虫的特化版本\n\n![插图显示蚂蚱和蜜蜂是昆虫的特化版本。](img/FG_11_001.png)\n\
  图 11-1 完整替代文本\n\n### 继承与“是”关系\n\n当一个对象另一个对象的特化版本时，它们之间存在“是”（is a）的关系。例如，蚂蚱是一种昆虫。以下是“是”关系的其他几个例子：\n\
  \n* 贵宾犬是狗。\n* 汽车是交通工具。\n* 花是植物。\n* 矩形是形状。\n* 足球运动员是运动员。\n\n当对象之间存在“是”关系时，意味着特化对象具有通用对象的所有特征，外加上使其变得特殊的额外特征。在面向对象编程中，继承被用于在类之间建立“是”的关系。这允许你通过创建另一个类的特化版本来扩展该类的功能。\n\
  \n继承涉及基类和派生类。基类是通用类，派生类是特化类。你可以将派生类认为是基类的扩展版本。派生类继承基类的字段、属性和方法，无需重写其中任何一个。此外，可以向派生类中添加新的字段、属性和方法，这正是它成为基类特化版本的原因。\n\
  \n### 注意\n\n基类有时被称为超类（superclass），派生类有时被称为子类（subclass）。这两个术语都是正确的。为了一致起见，本文使用了基类（base\
  \ class）和派生类（derived class）。\n\n让我们来看一个继承使用的示例。假设我们正在开发一个供汽车经销商管理其库存的应用程序。该经销商的库存包括三种类型：汽车、皮卡和运动用途车（SUV）。无论何种类型，经销商对每种汽车都记录以下数据：\n\
  \n* 品牌\n* 年份\n* 里程\n* 价格\n\n库存中的每种类型具有这些通用特征，以及它们自己的特殊特征。对于汽车，经销商保留额外数据：\n\n* 门数（2\
  \ 扇或 4 扇）\n\n对于皮卡，经销商保留额外数据：\n\n* 驱动类型（两驱或四驱）\n\n对于 SUV，经销商保留以下数据：\n\n* 容量\n\n在设计程序时，一种方法是编写以下三个类：\n\
  \n* `Car` 类，具有品牌、份、里程程、价格和门数的属性\n* `Truck` 类，具有品牌、份、里程程、价格和驱动类型的属性\n* `SportUtility`\
  \ 类，具有品牌、份、里程程、价格和容量的属性\n\n然而，这种方法效率很低，因为这三个类具有许多共同属性。结果是这些类将包含大量的重复代码。此外，如果我们以后发现需要添加更多共同属性，则必须修改所有三个类。\n\
  \n\n\n`Automobile` 类是一个完整的类，我们可以从它创建对象。然而，`Automobile` 类只包含关于汽车的通用数据。它没有包含经销商想要保留的关于汽车、皮卡车和\
  \ SUV（运动用途车）的特定数据。为了存储这些特定类型汽车的数据，我们编写了继承自 `Automobile`类的派生类。以下代码显示了派生自 `Automobile`\
  \ 类的 `Car` 类：\n\n```\n 1 class Car : Automobile\n 2 {\n 3     // Constructor\n 4\
  \     public Car()\n 5     {\n 6         Doors = 0;\n 7     }\n 8\n 9     // Doors\
  \ property\n10     public int Doors { get; set; }\n11 }\n```\n\n仔细观察第 1 行的类头：\n\n\
  ```\nclass Car : Automobile\n```\n\n这行代码包含了一些新符号。在类名 `Car` 之后出现了一个冒号，后面是另一个类的名称\
  \ `Automobile`。这行代码表示我们正在定义一个名为 `Car` 的类，它派生自 `Automobile` 类。`Car` 类是派生类，而 `Automobile`\
  \ 类是基类。图 11-2 展示了这种表示法。如果我们想表达 `Car` 类和 `Automobile` 类之间的关系，我们可以说一个 `Car` 是一个 `Automobile`。\n\
  \n# 图 11-2 类头中的继承表示法\n\n![插图显示了类中的继承表示法。](img/FG_11_002.png)图 11-2 完整替代文本\n\n由于\
  \ `Car` 类派生自 `Automobile` 类，因此 `Car` 类继承了 `Automobile` 类的所有成员，其构造函数除外。（基类构造函数的目的是创建基类的实例，因此派生类不继承基类的构造函数是合理的。）\n\
  \n### 注意\n\n尽管派生类继承了基类的私有成员，但它无法直接访问它们。只有基类中的方法可以直接访问基类的私有成员。\n\n`Car` 类有一个出现在第\
  \ 4–7 行的无参数构造函数。在第 9 行，构造函数将值 0 赋值给 `Doors` 属性。以下是创建 `Car` 类对象时发生的情况：\n\n*   首先执行基类构造函数。在这种情况下，调用了\
  \ `Automobile` 类的构造函数，它为 `Make` 和 `Model` 属性分配空字符串，为 `Mileage` 和 `Price` 属性分配 0。\n\
  \n*   接下来执行派生类构造函数。在这种情况下，将 0 赋值给 `Doors` 属性。\n\n在继续之前，让我们来看一个展示了 `Automobile` 和\
  \ `Car` 类的完整应用程序。在学生示例程序（Student Sample Programs）的 `Chap11` 文件夹中，你将找到一个名为 *Car Demo*\
  \ 的项目。该项目包含一个名为 `Form1` 的表单、`Automobile` 类和 `Car` 类。图 11-3 显示了在设计器中显示的 `Form1` 表单。\n\
  \n# 图 11-3 *Car Demo* 项目的 Form1 表单\n\n![窗口的截图，显示了在设计器中带有 Car Demo 项目的 Form 1 表单，带有控件按钮的名称。](img/FG_11_003.png)图\
  \ 11-3 完整替代文本\n\n运行应用程序时，在文本框中输入示例汽车数据，然后点击 *Create Object* 按钮。应用程序将创建一个 `Car` 类对象，并将文本框中的数据分配给对象的属性。然后它将读取并并在\
  \ `makeLabel`、`modelLabel`、`mileageLabel`、`priceLabel` 和 `doorsLabel` 控件中显示对象属性的值。图\
  \ 11-4 显示了用户在输入某些数据并点击 *Create Object* 按钮后运行时应用程序表单的示例。\n\n# 图 11-4 *Car Demo* 应用程序\n\
  \n![窗口截图显示了运行时的 Car Demo 项目的 Form 1 表单。](img/FG_11_004.png)图 11-4 完整替代文本\n\n程序 11-1\
  \ 显示了 `Form1.cs` 文件中的代码。\n\n让我们仔细查看代码：\n\n*   **第 23–69 行：** 这是 `GetCarData` 方法的代码。该方法的目的是接受一个\
  \ `Car` 对象作为参数，获取用户输入的汽车数据（对里程、价格和门进行输入验证），并将这些数据存储在 `Car` 对象的属性中。\n\n*   **第 74\
  \ 行：** 该语句创建了 `Car` 类的实例，由变量 `myCar` 引用。\n\n*   **第 77 行：** 该语句调用了 `GetCarData`\
  \ 方法，并将 `myCar` 对象作为参数传递。方法执行后，`myCar` 对象的属性将被更新。\n\n*   **第 80–84 行：** 这些语句显示了\
  \ `myCar` 对象的属性。`Truck` 类有一个名为 `Drive` 的字符串属性。在第 9 行，构造函数将空字符串赋值给 `Drive` 属性。以下是\
  \ `Truck` 类的代码：\n\n```\n 1 class Car : Automobile\n 2 {\n 3     // Constructor\n\
  \ 4     public Car()\n 5     {\n 6         Doors = 0;\n 7     }\n 8\n 9     // Doors\
  \ property\n10     public int Doors { get; set; }\n11 }\n```\n\n`Truck` 类有一个名为 `Drive`\
  \ 的字符串属性。该属性存储如“四轮”或“两轮”这样的值。让我们来看 `SportUtility` 类，它也派生自 `Automobile` 类：\n\n```\n\
  \ 1 class SportUtility : Automobile\n 2 {\n 3     // Constructor\n 4     public\
  \ SportUtility()\n 5     {\n 6         Drive = \"\";\n 7     }\n 8\n 9     // Passengers\
  \ property\n10     public int Passengers { get; set; }\n11 }\n```\n\n`SportUtility`\
  \ 类有一个名为 `Passengers` 的整数属性。构造函数出现在第 4–7 行，为 `Passengers` 属性赋值。\n\n现在，让我们来看一个展示所有这些类的程序。在学生示例程序的\
  \ `Chap11` 文件夹中，你将找到一个名为 *Car Demo Demo* 的项目。该项目包含一个名为 `Form1` 的表单、`Automobile`\
  \ 类、`Truck` 类和 `SportUtility` 类。图 11-5 显示了运行时的 `Form1` 表单，而 程序 11-2 显示了 `Form1.cs`\
  \ 文件中的代码。\n\n# 图 11-5 *Car Truck SUV Demo* 项目的 Form1 表单\n\n![截图显示了一个小型对话框，显示了 Car\
  \ Truck SUV Demo 项目的 Form 1 表单。](img/FG_11_005.png)图 11-5 完整替代文本\n\n让我们逐步执行 `createObjectsButton_Click`\
  \ 事件处理程序的代码。第 24 行创建了 `Car` 类的实例，由变量 `myCar` 引用。第 25–29 行将值分配给 Make、Model、Mileage、Price\
  \ 和 Doors 属性。\n\n第 34 行创建了 `Truck` 类的实例，由变量 `myTruck` 引用。第 35–39 行将值分配给 Make、Model、Mileage、Price\
  \ 和 Drive 属性。\n\n第 44 行创建了 `SportUtility` 类的实例，由变量 `mySUV` 引用。第 45–49 行将值分配给 Make、Model、Mileage、Price\
  \ 和 Passengers 属性。\n\n\n\n第 52–55 行显示了图 11-6 中顶部消息框中 `myCar` 对象的属性。第 58–61 行显示了图\
  \ 10-6 中中间消息框中 `myTruck` 对象的属性。第 64–67 行显示了图 11-6 中底部消息框中 `mySUV` 对象的属性。\n\n# 图\
  \ 11-6 Car Truck SUV Demo 项目显示的消息框\n\n![截图显示了 Car Truck SUV Demo 项目显示的三个消息框。](img/FG_11_006.png)图\
  \ 11-6 完整备用文本\n\n在教程 11-1 中，你为储蓄账户创建了一个基类，并为存款创建了一个派生类。\n\n# 基类和派生类的构造函数\n\n当你创建一个派生类的实例时，首先执行基类构造函数，然后执行派生类构造函数。在我们目前讨论的所有示例中，基类和派生类都有无参数构造函数。当你创建一个派生类的实例时，默认情况下会自动执行基类的无参数构造函数。\n\
  \n但如果基类的构造函数有参数会怎样？或者，如果基类有多个重载的构造函数，而你想确保调用特定的某一个会怎样？在这两种情况下，派生类构造函数必须显式地调用基类构造函数。\n\
  \n例如，看下面的 `Rectangle` 类：\n\n```\n 1 class Rectangle\n 2 {\n 3    // Constructor\n\
  \ 4     public Rectangle()\n 5     {\n 6         Length = 0;\n 7         Width =\
  \ 0;\n 8     }\n 9\n10     // Constructor\n11     public Rectangle(int length, int\
  \ width)\n12     {\n13         Length = length;\n14         Width = width;\n15 \
  \    }\n16\n17     // Properties\n18     public int Length { get; set; }\n19   \
  \  public int Width { get; set; }\n20 }\n```\n\n该类持有有关矩形的数据。它具有 `Length` 和 `Width`\
  \ 属性来存储矩形的长度和宽度。它还有两个构造函数：一个无参数构造函数（第 8–12 行），将 `Length` 和 `Width` 属性初始化为 0；以及一个接受\
  \ `Length` 和 `Width` 属性参数的构造函数（第 11–15 行）。\n\n下面的 `Box` 类派生自 `Rectangle` 类：\n\n\
  ```\n 1 class Box : Rectangle\n 2 {\n 3     // Constructor\n 4     public Box()\n\
  \ 5     {\n 6         Height = 0;\n 7     }\n 8\n 9     // Constructor\n10     public\
  \ Box(int length, int width, int height)\n11         : base(length, width)\n12 \
  \    {\n13         Height = height;\n14     }\n15     // Height property\n16   \
  \  public int Height { get; set; }\n17 }\n```\n\n`Box` 类持有关于矩形盒的数据，该盒子有长度、宽度和高度。该类继承了\
  \ `Rectangle` 类的 `Length` 和 `Width` 属性，并且它有自己的 `Height` 属性。注意，`Box` 类有两个构造函数：一个无参数构造函数（第\
  \ 7–10 行）和一个参数化构造函数（第 13–17 行）。\n\n如果你创建一个 `Box` 类的实例并调用它的无参数构造函数，将执行 `Rectangle`\
  \ 类的无参数构造函数。这是一个示例：\n\n```\nBox myBox = new Box();\n```\n\n在该语句执行后，`myBox` 对象的 `Length`、`Width`\
  \ 和 `Height` 属性将被设置为 0。\n\n现在，让我们来看 `Box` 类的参数化构造函数。以下代码出现在第 10 行：\n\n```\npublic\
  \ Box(int length, int width, int height)\n```\n\n此构造函数有三个参数：`length`、`width` 和 `height`。注意第\
  \ 11 行中的以下代码：\n\n```\n: base(length, width)\n```\n\n`base` 关键字指向基类。为了理解它是如何工作的，请考虑以下内容：\n\
  \n```\nBox myBox = new Box();\n```\n\n\n\n\n多态（polymorphism）一术是指对象采取不同形式的能力。它是面向对象编程中的一项强大特性。在本节中，我们将查看多态行为的两个核心要素：\n\
  \n1. 在基类中定义一个方法，然后在派生类中定义一个同名的方法。当派生类方法与基类方法同名时，通常认为派生类方法重写（overrides）了基类方法。\n2.\
  \ 根据用于调用对象的类型，调用被重写方法的正确版本。如果使用派生类对象调用被重写的方法，则执行的是派生类版本的方法。如果使用基类对象调用被重写的方法，则执行的是基类版本的方法。\n\
  \n描述多态最好的方法或许是通过演示来展示，因此让我们考虑一个简单的例子。查看以下 `Animal` 类的代码：\n\n```\n 1 class Animal\n\
  \ 2 {\n 3     // Constructor\n 4     public Animal(string species)\n 5     {\n 6\
  \         Species = species;\n 7     }\n 8\n 9     // Species property\n10     public\
  \ string Species { get; set; }\n11\n 12     // MakeSound method\n13     public virtual\
  \ void MakeSound()\n 14     {\n 15         MessageBox.Show(\"Grrrrrrr\");\n 16 \
  \    }\n 17 }\n```\n\n第 10 行声明了 `Species` 属性。第 4–7 行的构造函数接收一个参数并赋值给 `Species` 属性。\n\
  \n该类在第 13–16 行有一个名为 `MakeSound` 的方法。该方法在消息框中显示 `\"Grrrrrrr\"`。注意方法头中出现的 `virtual`\
  \ 关键字。`virtual` 关键字声明派生类允许重写此方法。\n\n以下是一个使用 `Animal` 类实例的代码示例：\n\n```\n 1  Animal\
  \ myAnimal = new Animal(\"regular animal\");\n2  MessageBox.Show(\"The species is\
  \ \" + myAnimal.Species);\n3  myAnimal.MakeSound();\n```\n\n第 1 行的语句创建一个 `Animal`\
  \ 类的对象，并将字符串 `\"regular animal\"` 传递给构造函数。该对象由变量 `myAnimal` 引用。第 2 行在消息框中显示“The\
  \ species is regular animal”。第 3 行调用 `myAnimal` 对象的 `MakeSound` 方法，该方法在消息框中显示“Grrrrrrr”。\n\
  \n接下来，查看派自 `Animal` 类的 `Dog` 类：\n\n```\n 1 class Dog : Animal\n 2 {\n 3     // Constructor\n\
  \ 4     public Dog(string name) : base(\"Dog\")\n 5     {\n 6         Name = name;\n\
  \ 7     }\n 8\n 9     // Name property\n10     public string Name { get; set; }\n\
  11\n 12     // MakeSound method\n13     public override void MakeSound()\n 14  \
  \   {\n 15         MessageBox.Show(\"Woof! Woof!\");\n 16     }\n 17 }\n```\n\n\
  第 10 行声明了 `Name` 属性。第 4–7 行的构造函数接收一个名称参数。注意构造函数调用了基类构造函数，并将字符串 `\"Dog\"` 作为参数传递。`Animal`\
  \ 类构造函数将字符串 `\"Dog\"` 赋值给 `Species` 属性。\n\n尽管 `Dog` 类派自 `Animal` 类，但 `Animal` 类的\
  \ `MakeSound` 方法对于 `Dog` 类来说是不够。因此，`Dog` 类重写了 `Animal` 类的 `MakeSound` 方法。第 13–16\
  \ 行的 `Dog` 类 `MakeSound` 方法在消息框中显示 `\"Woof! Woof!\"`，这对于狗更为合适。注意方法头中出现的 `override`\
  \ 关键字。`override` 关键字声明此方法重写了基类中的方法。\n\n以下是一个使用 `Dog` 类实例的代码示例：\n\n```\n 1 Dog myDog\
  \ = new Dog(\"Fido\");\n2 MessageBox.Show(\"The species is \" + myDog.Species);\n\
  3 MessageBox.Show(\"The animal's name is \" + myDog.Name);\n4 myDog.MakeSound();\n\
  ```\n\n第 1 行的语句创建一个 `Dog` 类的对象，并将字符串 `\"Fido\"` 传递给构造函数。该对象由变量 `myDog` 引用。第 2 行在消息框中显示“The\
  \ species is Dog”。第 3 行在消息框中显示“The animal’s name is Fido”。第 4 行调用 `myDog` 对象的 `MakeSound`\
  \ 方法。当我们使用 `Dog` 对象调用 `MakeSound` 方法时，执行的是 `Dog` 类中的方法版本。因此，第 4 行的语句在消息框中显示“Woof!\
  \ Woof!”。\n\n接下来，查看同样派自 `Animal` 类的 `Cat` 类：\n\n```\n 1 class Cat : Animal\n 2 {\n\
  \ 3     // Constructor\n 4     public Cat(string name) : base(\"Cat\")\n 5     {\n\
  \ 6         Name = name;\n 7     }\n 8\n 9     // Name property\n10     public string\
  \ Name { get; set; }\n11\n 12     // MakeSound method\n13     public override void\
  \ MakeSound()\n 14     {\n 15         MessageBox.Show(\"Meow\");\n 16     }\n 17\
  \ }\n```\n\n第 10 行声明了 `Name` 属性。第 4–7 行的构造函数接收一个猫名称参数。注意构造函数调用了基类构造函数，并将字符串 `\"\
  Cat\"` 作为参数传递。`Animal` 类构造函数将字符串 `\"Cat\"` 赋值给 `Species` 属性。\n\n尽管 `Cat` 类派自 `Animal`\
  \ 类，但 `Animal` 类的 `MakeSound` 方法对于 `Cat` 类来说是不够。因此，`Cat` 类重写了 `Animal` 类的 `MakeSound`\
  \ 方法。第 13–16 行的 `Cat` 类 `MakeSound` 方法在消息框中显示 `\"Meow\"`，这对于猫更为合适。注意方法头中出现的 `override`\
  \ 关键字。\n\n以下是一个使用 `Cat` 类实例的代码示例：\n\n```\n 1 Cat myCat = new Cat(\"Kitty\");\n2\
  \ MessageBox.Show(\"The species is \" + myCat.Species);\n3 MessageBox.Show(\"The\
  \ animal's name is \" + myCat.Name);\n4 myCat.MakeSound();\n```\n\n第 1 行的语句创建一个\
  \ `Cat` 类的对象，并将字符串 `\"Kitty\"` 传递给构造函数。该对象由变量 `myCat` 引用。第 2 行在消息框中显示“The species\
  \ is Cat”。第 3 行在消息框中显示“The animal’s name is Kitty”。第 4 行调用 `myCat` 对象的 `MakeSound`\
  \ 方法。当我们使用 `Cat` 对象调用 `MakeSound` 方法时，执行的是 `Cat` 类中的方法版本。因此，第 4 行的语句在消息框中显示“Meow”。\n\
  \n由于基类和派生类之间存在“是”的关系，`Dog` 类的对象不仅仅是一个 `Dog` 对象。它还是一个 `Animal` 对象（狗是动物）。由于这种关系，我们可以使用\
  \ `Animal` 类变量来引用 `Dog` 对象。例如，查看以下代码：\n\n```\n 1 Animal myAnimal = new Dog(\"Fido\"\
  );\n2 MessageBox.Show(\"The species is \" + myAnimal.Species);\n3 myAnimal.MakeSound();\n\
  ```\n\n第 1 行将 `myAnimal` 为 `Animal` 类型。它还创建一个 `Dog` 类的对象，并将 `Dog` 对象的引用赋值给变量 `myAnimal`。在执行该语句后，我们拥有一个引用\
  \ `Dog` 对象的 `Animal` 变量。这种赋值是合法的，因为 `Dog` 对象也是 `Animal` 对象。第 2 行在消息框中显示“The species\
  \ is Dog”。第 3 行调用 `myAnimal` 对象的 `MakeSound` 方法，该方法在消息框中显示“Woof! Woof!”。\n\n同样，我们可以使用\
  \ `Animal` 变量来引用 `Cat` 对象，如下代码所示：\n\n```\n 1 Animal myAnimal = new Cat(\"Kitty\"\
  );\n2 MessageBox.Show(\"The species is \" + myAnimal.Species);\n3 myAnimal.MakeSound();\n\
  ```\n\n# 重写属性\n\n基类中的属性可以像重写方法一样进行重写。在基类中，您在属性声明中编写 `virtual` 关键字，如下所示：\n\n\n\n\n\
  \n```csharp\n class Rectangle\n {\n    // Properties\n    public int Length { get;\
  \ set; }\n    public int Width { get; set; }\n\n    public virtual int Area\n  \
  \  {\n        get { return Length * Width; }\n    }\n}\n```\n\n此 `Rectangle` 类声明了\
  \ `Length` 和 `Width` 属性，以及一个名为 `Area` 的虚拟只读属性（注意第 7 行中的 `virtual` 关键字）。`Area` 属性返回矩形的面积，其计算方式为\
  \ `Length * Width`。\n\n假设我们需要一个 `Box` 类来表示一个具有长度、宽度和高的箱子。我们可以从 `Rectangle` 类派生出\
  \ `Box` 类，并在 `Box` 类中添加一个 `Height` 属性来表示箱子的高度。然而，在 `Box` 类中，我们必须重写 `Area` 属性，因为三维箱子的面积计算方式与二维矩形的面积计算不同。以下是一个示例：\n\
  \n```csharp\n class Box : Rectangle\n{\n    // Properties\n    public int Height\
  \ { get; set; }\n\n    public override int Area\n    {\n        get { return base.Area\
  \ * Height; }\n    }\n}\n```\n\n`Box` 类的 `Height` 属性出现在第 4 行。在第 6–9 行，我们重写了 `Area`\
  \ 属性（注意第 6 行中的 `override` 关键字）。在第 8 行，我们使用表达式 `base.Area` 来获取基类 `Area` 属性的值（这得到了\
  \ `Length * Width`），并将该值乘以 `Height`。结果就是箱子的面积。\n\n# 基类引用变量仅了解基类成员\n\n基类引用变量可以引用派生自该基类的任何类的对象；然而，基类变量对这些对象能的操作是有限制的。基类引用变量只了解在基类中声明的成员。如果派生类引入了额外的方法、属性或字段，基类引用变量无法访问这些成员。例如，查看以下代码：\n\
  \n```csharp\n Animal myAnimal = new Dog(\"Fido\");\n MessageBox.Show(\"The species\
  \ is \" + myAnimal.Species);\n MessageBox.Show(\"The animal's name is \" + myAnimal.Name);\
  \ // ERROR!\n myAnimal.MakeSound();\n```\n\n此代码中的第 3 行无法编译。`myAnimal` 变量是一个 `Animal`\
  \ 引用变量，而 `Animal` 类没有 `Name` 属性。尽管 `myAnimal` 引用的是一个 `Dog` 对象，它也无法访问该对象的 `Name`\
  \ 属性。\n\n# “是”关系不能反过来\n\n理解“是”关系不能反过来是非常关重要的。虽然“狗是动物”这个陈是正确的，但“动物是狗”这个陈是不正确的。这是因为所有的狗都是动物，但并不是所有的动物都是狗。因此，以下语句无法编译：\n\
  \n```csharp\nDog myDog = new Animal(\"Dog\");\n```\n\n你不能将 `Animal` 引用赋值给 `Dog`\
  \ 变量。这是合理的，因为 `Dog` 对象拥有的能力超 `Animal` 对象。\n\n### 注意\n\n有趣的是，如果你使用强制转换符，C# 编译器将允许你进行此类赋值，如下所示：\n\
  \n```csharp\nDog myDog = (Dog) new Animal(\"Dog\");\n```\n\n然而，在赋值发生运行时将抛出异常。\n\n\
  # 将对象传递给基类参数\n\n多态在设计应用程序时提供了极大的灵活性。例如，查看以下方法：\n\n```csharp\n private void ShowAnimalInfo(Animal\
  \ animal)\n{\n    MessageBox.Show(\"Species: \" + animal.Species);\n    animal.MakeSound();\n\
  }\n```\n\n此方法显示关于动物的信息。因为它将 `Animal` 变量作为参数，因此在调用它时，可以将 `Animal` 对象传递给该方法。该方法随后显示对象的\
  \ `Species` 属性并调用其 `MakeSound` 方法。\n\n`ShowAnimalInfo` 方法可以处理 `Animal` 对象，但如果你还需要需要显示\
  \ `Dog` 对象和 `Cat` 对象相同信息的方法呢？你需要为每种类型编写额外的方法吗？由于多态性的存在，答案是*不需要*。除了 `Animal` 对象外，你还可以将\
  \ `Dog` 对象或 `Cat` 对象作为参数传递给之前所示的 `ShowAnimalInfo` 方法。\n\n在 教程 11-2 中，你完成了一个使用 `Animal`、`Dog`\
  \ 和 `Cat` 类来演示多态应用程序。\n\n# 检查点\n\n1. 11.6 查看以下类定义：\n\n```csharp\n class Vegetable\n\
  {\n    public virtual void message()\n    {\n       MessageBox.Show(\"I'm a vegetable.\"\
  );\n    }\n}\nclass Potato : Vegetable\n{\n    public override void message()\n\
  \    {\n       MessageBox.Show(\"I'm a potato.\");\n    }\n}\n```\n\n给定这些类声明，以下代码将显示什么？\n\
  \n```csharp\nVegetable v = new Potato();\nPotato p = new Potato();\nv.message();\n\
  p.message();\n```\n\n2. 11.7 “是”关系可以反过来吗？为什么可以或不可以？\n\n# 1.3 抽象类\n\n### 概念\n\n抽象类充当基类但不能被实例化。抽象方法没有方法体，必须在派生类中被重写。\n\
  \n有时，实例化基类是没有意义的。例如，考虑一个制造飞机的工厂。该工厂不制造通用飞机，而是制造两种特定类型：螺旋桨飞机和支线飞机。用于分类飞机的计算机软件可能会使用名为\
  \ `Airplane` 的类。`Airplane` 类具有表示所有飞机共同特征的成员。此外，软件还有一个名为 `PropPlane` 的类和一个名为 `CommuterJet`\
  \ 的类。这些类代表了工厂制造的特定飞机型号，并派生自 `Airplane` 类。`Airplane` 类从不被实例化，而是作为基类使用。\n\n一个不打算实例化而仅用作基类的类被称为抽象类。抽象类充当起点，为它的派生类提供一些成员。要将一个类声明为抽象类，你需要在类头部使用\
  \ `abstract` 关键字。以下是通用格式：\n\n```csharp\nabstract class ClassName\n{\n    // Member\
  \ declarations\n}\n```\n\n抽象类与普通类（有时称为具体类）的主要区别在于抽象类不能被实例化。尝试使用 `new` 运算符实例化抽象类的语句将无法编译。\n\
  \n抽象类还可以包含抽象方法。抽象方法是出现在基类中但期望在派生类中被重写的方法。抽象方法只有方法头没有方法体。在方法头中，`abstract` 关键字出现在返回类型之前。这是一个包含抽象方法的抽象类的简单示例：\n\
  \n```csharp\nabstract class Person\n{\n    public abstract void DoSomething();\n\
  }\n```\n\n当抽象方法出现在类中时，必须在任何派生自该类的类中重写。在示例中，如果一个类派生自 `Person` 类，该派生类必须重写 `DoSomething`\
  \ 方法。\n\n抽象类还可以包含抽象属性。抽象属性是出现在基类中但期望在派生类中被重写的属性。在属性头，`abstract` 关键字出现在属性类型之前。这是一个包含抽象属性的抽象类的简单示例：\n\
  \n```csharp\nabstract class Person\n{\n    public abstract string JobTitle\n   \
  \ {\n        get;\n        set;\n    }\n}\n```\n\n\n\n\n\n注意，抽象属性显示了 `get` 和 `set`\
  \ 访问器，但它并没有指定这些访问器的功能。当抽象属性出现在类中时，必须在任何派生自该类的中进行重写。在示例中，如果一个类派生自 `Person` 类，则派生类必须重写\
  \ `JobTitle` 属性。\n\n### 注意\n如果你想创建一个抽象只读属性，请省略 `set` 访问器。\n\n在教程 11-3 中，你将完成一个使用带有抽象属性的抽象基类的应用程序。\n\
  \n# 检查点\n1. 11.8 抽象类的目的是什么？\n2. 11.9 如果一个类是抽象的，那么该类不能做什么？\n3. 11.10 如果一个类派生自具有抽象方法的基类，那么派生类必须做什么？\n\
  4. 11.11 抽象属性在使用之前必须进行什么操作？\n5. 11.12 如何创建一个抽象只读属性？\n\n# 11.4 扩展方法\n\n### 概念\n扩展方法是一种静态方法，它可以扩展现有的类或数据类型，包括\
  \ .NET Framework 中的类和类型。\n\n假设你想扩展一个类，但你无法继承它，因为它是密封的（sealed）。当你想要扩展的类位于 .NET Framework\
  \ 中，或者是由其他人编写时，可能会出现这种情况。在这种情况下，你可以使用扩展方法来扩展该类。扩展方法是一种可以在不修改类或不继承该类的情况下将其添加到类中的方法。\n\
  \n扩展方法可以应用于类、`struct` 和接口（这些将在本章的稍后部分讨论）。它们甚至可以应用于 `int` 和 `double` 等原始数据类型。事实上，让我们看看如何将扩展方法应用于原始数据类型\
  \ `int`。假设我们希望让 `int` 变量拥有一个方法，告诉我们该变量是奇数还是偶数。例如，我们希望能够执行类似这样的操作：\n\n```cs\n int\
  \ number = 4;\nif (number.IsEven())\n{\n    MessageBox.Show(\"The number is even.\"\
  );\n}\n```\n\n为了实现这一点，我们需要为 `int` 类型定义一个名为 `IsEven` 的扩展方法。如果该方法评估的数字是偶数，则扩展方法返回\
  \ `true`，否则返回 `false`。\n\n以下是实现扩展方法需要了解的关键：\n* 扩展方法是一个静态方法，存储在静态类中。你可以在同一个静态类中编写多个扩展方法。\n\
  * 建议将扩展方法的类放在它自己的命名空间中，与你的项目命名空间分开。\n* 扩展方法始终有一个参数。方法的第一个参数必须是该方法所扩展的类或类型的对象。第一个参数的声明必须以\
  \ `this` 关键字开头。\n\n下面是我们如何实现之前显示的 `IsEven` 扩展方法的示例：\n\n```cs\n 1 namespace ExtensionMethods\n\
  \ 2 {\n 3    public static class Extensions\n 4    {\n 5        public static bool\
  \ IsEven(this int i)\n 6        {\n 7            return (i % 2) == 0;\n 8      \
  \  }\n 9    }\n10 }\n```\n\n此代码定义了一个名为 `ExtensionMethods` 的命名空间，在该命名空间内有一个名为 `Extensions`\
  \ 的静态类。（任何使用该扩展方法的程序都需要包含语句 `using ExtensionMethods;` 才能访问该方法。）在 `Extensions` 类中，第\
  \ 5–8 行定义了静态方法 `IsEven`。仔细观察第 5 行中的参数声明：\n\n```cs\nthis int i\n```\n\n`this` 关键字告诉编译器该方法是一个扩展方法。参数\
  \ `i` 是一个 `int`，因此编译器知道我们正在为 `int` 数据类型定义扩展方法。当方法执行时，参数 `i` 将引用该方法正在处理的 `int` 变量。例如，看以下代码：\n\
  \n```cs\n int myValue = 4;\nif (myValue.IsEven())\n{\n   MessageBox.Show(\"The number\
  \ is even.\");\n}\n```\n\n在代码中，当 `IsEven` 方法执行时，`myValue` 变量将隐式地传递给参数 `i`。这在图 11-11\
  \ 中进行了说明。这是另一个示例：\n\n```cs\n int num = 4;\nif (num.IsEven())\n{\n   MessageBox.Show(\"\
  The number is even.\");\n}\n```\n\n# 图 11-11 `myValue` 被隐式地传递到参数 `i`\n\n![插图显示“myValue”被传递到参数“i”中。](img/FG_11_011.png)图\
  \ 11-11 全文\n\n# 在扩展方法中，第一个参数以 `this` 开始\n\n在扩展方法中，第一个参数以 `this` 开头。在代码中，当 `IsEven`\
  \ 方法执行时，`num` 变量将隐式地传递给参数 `i`。如果你需要向扩展方法传递传递参数，只需在第一个参数之后声明额外的参数：\n\n```cs\n public\
  \ static bool Greater(this int a, int b)\n{\n    return a > b;\n}\n```\n\n此方法有两个参数：`a`\
  \ 和 `b`。由于 `a` 前有 `this` 关键字，我们知道它将引用方法正在处理的 `int`。这里有一个示例：\n\n```cs\n int num1\
  \ = 5, num2 = 4;\nif (num1.GreaterThan(num2))\n{\n    MessageBox.Show(\"num1 is\
  \ greater than num2.\");\n}\n```\n\n在代码中，`num1` 将隐式地传递给参数 `a`。这在图 11-12 中进行了说明。\n\
