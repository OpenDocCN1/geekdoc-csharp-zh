  \ `Personnel.mdf` 数据库的应用程序。应用程序的主窗应在 `DataGridView` 控件中显示 `Employee` 表。主窗应有一个按钮，点击后会显示第二个表单。第二个表单应以详情显示\
  \ `Employee` 表。确保当第二个表单关闭时，主窗会刷新数据集，以便显示最新数据。\n\n### 3. 小时工资排序\n创建一个连接到你在“编程问题 1”中创建的\
  \ `Personnel.mdf` 数据库的应用程序。应用程序的表单应在 `DataGridView` 控件中显示 `Employee` 表。表单还应包含以下控件：\n\
  \n* 一个按钮，点击后按小时工资率升序排列数据。\n* 一个按钮，点击后按小时工资率降序排列数据。\n\n### 4. 员工搜索\n创建一个连接到你在“编程问题\
  \ 1”中创建的 `Personnel.mdf` 数据库的应用程序。应用程序的表单应在 `DataGridView` 控件中显示 `Employee` 表。应用程序应允许用户在文本框中指定名称，然后在\
  \ `Employee` 表中搜索该名称。应用程序应显示任何包含指定名称全匹配或部分匹配的行。\n\n### 5. 最高和最低工资率\n创建一个连接到你在“编程问题\
  \ 1”中创建的 `Personnel.mdf` 数据库的应用程序。应用程序的表单应在 `DataGridView` 控件中显示 `Employee` 表。表单还应包含以下控件：\n\
  \n* 一个按钮，点击后显示一条消息，指示表中最高（最大）工资率。\n* 一个按钮，点击后显示一条消息，指示表中最低（最小）工资率。\n\n### 6. 人口数据库\n\
  在学生示例程序的 `Chap12` 文件夹中，你将找到一个名为名为 `PopulationDB.mdf` 的数据库文件。该数据库有一个名为 `City` 的表。`City`\
  \ 表具有以下列：\n\n| 列名 | 数据类型 |\n| --- | --- |\n| `City` | `nvarchar(50)` 主键 |\n| `Population`\
  \ | `float` |\n\n`City` 列存储城市名称，`Population` 列存储该城市的人口。该数据库已录入了 20 行数据。\n\n创建一个连接到\
  \ `PopulationDB.mdf` 数据库的应用程序，并允许用户执行以下操作：\n\n* 使用数据绑定控件向数据库添加新行、更改现有行并删除行。\n* 按人口升序排序城市列表。\n\
  * 按人口降序排序城市列表。\n* 按名称排序城市列表。\n* 获取所有城市的总人口数。\n* 获取所有城市的平均人口。\n* 获取最高人口。\n* 获取最低人口。\n\
  \n# 第 13 章 委托、匿名方法和 Lambda 表达式\n\n## 13.1 委托\n\n### 概念\n委托是一个工作类似于引用变量的变量，该变量引用一个方法。\n\
  \n你已经学习过引用变量引用对象。当你在内存中创建一个对象时，你可以将该对象赋值给引用变量，然后使用该引用变量操作该对象。在本节中，你将学习`delegates`（委托），它允许创建可以引用方法的引用变量。当委托引用一个方法时，你可以使用委托来调用该方法。\n\
  \n为了演示，让我们来看一个声明和使用委托的简单示例。假设我们在类内部有以下方法：\n\n```cs\n private void DisplayMessage(string\
  \ str)\n{\n   MessageBox.Show(str);\n}\n```\n\n注意关于该方法的以下几点：\n\n* 返回类型为 `void`\n\
  * 方法有一个参数，类型为 `string`\n\n假设你想将此方法分配给一个委托，然后使用该委托调用该方法。首先，你必须声明一个委托类型。在这一步中，你并没有创建实际委托，而是在描述委托可以引用的方法。你通过指定方法的返回类型和它的参数来实现。这里是一个示例：\n\
  \n```cs\n delegate void MyDelegate(string str);\n```\n\n此声明以 `delegate` 关键字开始，后面跟着类似于方法头部的代码，并以分号结束。这段代码声明了我们正在创建一个名为\
  \ `MyDelegate` 的委托类型，它可以引用任何具有一个 `string` 类型参数的 `void` 方法。（参数的名称并不重要。）\n\n一旦声明了委托类型，你就可以使用它来创建一个实际的委托。（这一步通常被描述为创建委托类型的实例。）委托可以引用任何返回类型和参数列表与委托类型匹配的方法。这里是一个示例，使用了我们之前创建的\
  \ `MyDelegate` 类型：\n\n```cs\n MyDelegate Display = DisplayMessage;\n```\n\n该语句创建了一个名为\
  \ `Display` 的委托，并将 `DisplayMessage` 方法分配给该委托。结果是，你可以使用 `Display` 委托调用 `DisplayMessage`\
  \ 方法。这里是一个示例：\n\n```cs\n Display(\"Hello World\");\n```\n\n总结委托的创建和使用：\n\n1. 声明委托类型。\n\
  2. 创建委托类型的实例并使其引用一个方法。\n3. 使用委托调用该方法。\n\n图 13-1 委托的创建](AE29) 说明了委托类型声明、方法以及创建委托实例的语句如何协同工作。\n\
  \n# 图 13-1 声明和使用委托\n\n![说明了委托类型声明、方法以及创建委托实例的语句如何协同工作。](img/FG_13_001.png)la_13_001AE3B\
  \ 显示了 Delegate 应用程序的 Form1 代码。\n\n# 图 13-2 Delegate 应用程序\n\n![两个截图显示了 Delegate 应用程序的窗口，光标放在“Click\
  \ Me”按钮上，以及一个显示“Hello World”的消息框。](img/FG_13_002.png)\n\n在应用程序代码中，第 6 行声明了委托类型。注意委托类型声明在应用程序的命名空间内，但在任何类之外。这是一种常见的做法，尽管可以在类内部声明委托类型。第\
  \ 18 行创建了委托的实例，并使其引用 `DisplayMessage` 方法。（`DisplayMessage` 方法出现在 24-27 行。）\n\n 重新分配委托\n\
  委托可以重新分配给另一个方法，只要该方法的返回类型和参数列表与委托类型匹配。例如，假设我们在类中有以下方法：\n\n```cs\n private void DisplayString(string\
  \ str)\n{\n    MessageBox.Show(str);\n}\nprivate void DisplayLength(string str)\n\
  {\n    int len = str.Length;\n    MessageBox.Show(len.ToString());\n}\n```\n\n`DisplayString`\
  \ 方法接收一个 `string` 消息框中显示它，而 `DisplayLength` 方法接收一个 `string` 消息框中显示其长度。两个方法都返回 `void`\
  \ 并有一个 `string` 参数。以下委托类型兼容这两个方法：\n\n```cs\n delegate void WorksWithAString(string\
  \ str);\n```\n\n以下代码演示了我们如何使用一个委托来处理这两个方法：\n\n\n\n\n\n```\n 1 // 创建一个字符串。\n 2 string\
  \ mystring = \"Abracadabra\";\n 3\n 4 // 创建一个名为 StringOperation 的委托，并将\n 5 DisplayString\
  \ 方法赋值给它。\n 6 WorksWithAString StringOperation = DisplayString;\n 7\n 8 // 调用 StringOperation\
  \ 引用的方法。\n 9 StringOperation(mystring);\n10\n11 // 将 DisplayLength 方法赋值给 StringOperation\
  \ 委托。\n12 StringOperation = DisplayLength;\n13\n14 // 调用 StringOperation 引用的方法。\n\
  15 StringOperation(mystring);\n```\n\n第 6 行的语句创建了一个名为 `StringOperation` 的委托，并将 `DisplayString`\
  \ 方法赋值给它。当执行第 9 行代码时，调用的是 `DisplayString` 方法。然后，第 12 行将 `DisplayLength` 方法赋值给 `StringOperation`\
  \ 委托。结果是当第 15 行执行时，调用的是 `DisplayLength` 方法。\n\n# 将委托传递给方法\n\n委托可以作为参数传递给方法。这意味着你可以编写一个接受另一个方法作为参数的方法。程序\
  \ 13-2 显示了 `DelegatePassing` 程序的代码，而图 13-3 显示了应用程序的表单。\n\n# 图 13-3 DelegatePassing\
  \ 应用程序的表单\n\n![显示了设计器标签页中的 DelegatePassing 应用程序表单。表单有一个 控件，其 Text 属性设置为“Demo”，name\
  \ 设置为“demoButton”。](img/FG_13_003.png)\n\n让我们仔细观察该程序。首先，注意第 15 行到 28 行中 `SetToZero`、`MakeTwice`\
  \ 和 `CutInHalf` 方法的代码。这些方法每个都返回 `void` 并且有一个 `double` 引用参数。\n\n在第 6 行，我们声明了一个名为\
  \ `DoSomething` 的委托类型，指定了 `void` 返回类型和一个 `double` 引用参数。因此，该委托类型与 `SetToZero`、`MakeTwice`\
  \ 和 `CutInHalf` 方法兼容。\n\n`ShowResult` 方法出现在第 30 行到 37 行。查看该方法的参数列表。第一个参数是 `double`\
  \ 类型的引用变量名 `myvalue`。第二个参数是名为 `MyMethod` 的 `DoSomething` 委托。当我们调用 `ShowResult` 方法时，必须传递一个\
  \ `double`（通过引用）和一个 `DoSomething` 委托。\n\n在 `ShowResult` 方法内部，第 33 行调用了 `MyMethod`\
  \ 委托引用的方法，并将 `myvalue` 变量作为参数传递。然后，第 36 行在消息框中显示 `myvalue` 的值。\n\n第 39 行到 61 行显示的\
  \ `demoButton_Click` 事件处理程序执行以下操作：\n\n*   第 42 行声明了一个名为 `value` 的 `double` 变量，初始化为\
  \ 100.0。\n*   第 45 行创建了一个名为 `operation` 的委托，并将 `MakeTwice` 方法赋值给它。\n*   第 48 行调用\
  \ `ShowResult` 方法，将 `value` 变量和 `operation` 委托作为参数。结果是在消息框中显示值 200。\n*   第 51 行将\
  \ `CutInHalf` 方法赋值给 `operation` 委托。\n*   第 54 行调用 `ShowResult` 方法，将 `value` 变量和\
  \ `operation` 委托作为参数。结果是在消息框中显示值 100。\n*   第 57 行将 `SetToZero` 方法赋值给 `operation`\
  \ 委托。\n*   第 60 行调用 `ShowResult` 方法，将 `value` 变量和 `operation` 委托作为参数。结果是在消息框中显示值\
  \ 0。\n\n# 多路委托委托\n\n在之前的示例中，你看到了如何使用委托来引用方法。当你调用委托时，会执行委托引用的方法。委托也可以同时引用多个方法。引用多个方法的委托被称为多路委托（multicast\
  \ delegate）。当你调用多路委托时，委托引用的每个方法都将按照它们被添加到委托的顺序被执行。你使用 `+=` 运算符将方法添加到委托中。例如，假设你有以下方法：\n\
  \n```\n private void DisplayString(string str)\n{\n    MessageBox.Show(str);\n}\n\
  private void DisplayLength(string str)\n{\n    int len = str.Length;\n    MessageBox.Show(len.ToString());\n\
  }\n```\n\n假设你还有以下委托类型声明：\n\n```\n delegate void WorksWithAString(string str);\n\
  ```\n\n下面的代码演示了我们如何创建一个多路委托来调用这两个方法：\n\n```\n 1   // 创建一个字符串。\n 2   string mystring\
  \ = \"Abracadabra\";\n 3\n 4   // 创建引用 DisplayString 的委托。\n 5   WorksWithAString\
  \ StringOperation = DisplayString;\n 6\n 7   // 将 DisplayLength 方法添加到委托。\n 8   StringOperation\
  \ += DisplayLength;\n 9\n10   // 调用 StringOperation 引用的方法。\n11   StringOperation(mystring);\n\
  ```\n\n第 5 行的语句创建了一个名为 `StringOperation` 的委托，并将 `DisplayString` 方法赋值给它。然后，第 8 行使用\
  \ `+=` 运算符将 `DisplayLength` 委托。当执行第 11 行时，首先执行 `DisplayString`，然后执行 `DisplayLength`\
  \ 方法。\n\n关于多路委托还有以下几点：\n\n*   可以使用 `-=` 运算符从委托中移除方法。使用之前的示例，我们可以通过此语句从 `StringOperation`\
  \ 中移除 `DisplayLength`：如果多路委托引用的方法返回值（非 `void` 方法），则委托将返回最后一个执行的方法的值。在实践中，多路委托最好引用\
  \ `void` 方法。\n\n# 检查点\n\n1.13.1 什么是委托？\n2.13.2 假设你想用委托调用方法，你需要采取哪三个步骤？\n3.13.3 委托类型的目的是什么？\n\
  4.13.4 一旦委托被赋值给方法，还可以重新赋值吗？\n5.13.5 什么是多路委托？\n\n# 13.2 匿名方法\n\n### 概念\n\n委托可以引用匿名方法，匿名方法是没有名称的方法。*匿名方法*是没有名称的方法。在\
  \ C# 中，委托让你具有创建匿名方法的能力。例如，假设有以下委托声明：\n\n```\n delegate void WorksWithAString(string\
  \ str);\n```\n\n给定此类型声明，下面的代码创建一个引用匿名方法的委托：\n\n```\n WorksWithAString Display =\
  \ delegate(string str)\n{\n    MessageBox.Show(str);\n};\n```\n\n这段代码创建了一个名为 `Display`\
  \ 的委托。`Display` 委托类型为 `WorksWithAString`。`Display` 委托引用一个具有 `string` 参数的匿名方法，因此当我们调用该方法时，必须向其传递一个\
  \ `string` 参数，如下：\n\n```\n Display(\"Calling the anonymous method.\");\n```\n\n\
  让我们查看演示匿名方法的完整应用程序。程序 13-3 显示了 `AnonymousMethod` 程序的 Form1 代码。\n\n*   在第 6 行，我们声明了一个名为\
  \ `IntCalculator` 的委托类型，指定了 `int` 返回类型两个 `int` 参数。\n*   在第 19 行到 22 行，我们创建一个名为 `Sum`\
  \ 的 `IntCalculator` 委托，引用一个接受两个 `int` 参数并返回其和的匿名方法。\n*   在第 24 行到 27 行，我们创建另一个名为\
  \ `Multiply` 的 `IntCalculator` 委托，引用一个接受两个 `int` 参数并返回其乘积的匿名方法。\n\n\n\n\n\n*   在第\
  \ 29 行，我们调用了由 `Sum` 委托引用的方法，传递了参数 1 和 2，并将返回值赋值给 `result` 变量。在第 30 行，我们在消息框中显示了\
  \ `result` 变量。\n*   在第 32 行，我们调用了由 `Multiply` 委托引用的方法，传递了参数 2 和 4，并将返回值赋值给 `result`\
  \ 变量。在第 33 行，我们在消息框中显示了 `result` 变量。\n\n# 检查点 (Checkpoint)\n\n### 13.6 什么是匿名方法？\n\
  \n### 13.7 给定以下委托类型声明，以下代码段 (a 或 b) 哪个使用了匿名方法？\n\n```\ndelegate void DoSomething(string\
  \ str);\n```\n\n1.  ```c\nvoid ShowStr(string str)\n{\n    MessageBox.Show(str);\n\
  }\nDoSomething Display = ShowStr;\n```\n\n2.  ```c\nDoSomething Display = delegate(string\
  \ str)\n{\n    MessageBox.Show(str);\n};\n```\n\n# 13.3 Lambda 表达式 (Lambda Expressions)\n\
  \n### 概念\n\nLambda 表达式是一个创建匿名方法的简洁表达式。\n\nLambda 表达式是编写匿名方法的快捷技巧。以下是一个接受一个参数并返回值的简单\
  \ Lambda 表达式的通用格式：\n\n```\nparameter  =>  expression\n```\n\n在这个通用格式中，Lambda 表达式以参数变量开始，紧接着是\
  \ Lambda 运算符 (`=>`)，然后是一个具有值的表达式。这里是一个示例：\n\n```c\nx => x * x\n```\n\n出现在 `=>` 运算符左侧的\
  \ `x` 是参数变量的名字，出现在 `=>` 运算符右侧的表达式 `x * x` 是返回的值。\n\n这个 Lambda 表达式的工作方式就像一个有一个名为\
  \ `x` 参数变量的方法，它返回 `x * x` 的值。\n\n例如，假设我们有以下委托类型声明：\n\n```\ndelegate int IntOperation(int\
  \ x);\n```\n\n委托类型的名称是 `IntOperation`，它指定了 `int` 返回类型和一个 `int` 参数。此外，假设我们想创建一个 `IntOperation`\
  \ 类型的委托，引用一个返回 `x` 平方的的方法。以下代码显示了我们如何使用 Lambda 表达式来创建委托：\n\n```c\nIntOperation Square\
  \ = x => x * x;\n```\n\n在 `=` 运算符的左侧，我们声明了一个名为 `Square` 的 `IntOperation` 委托。在 `=`\
  \ 运算符的右侧，我们有一个 Lambda 表达式，它具有具有로匿名方法：\n\n*   Lambda 表达式使用的参数 `x` 代表传递给方法的实参数。我们不需要指定\
  \ `x` 的数据类型，因为编译器会确定它。由于 `IntOperation`\n\n委托类型指定了 `int` 参数，Lambda 表达式中的参数 `x` 将自动成为一个\
  \ `int`。\n*   表达式 `x * x` 是方法返回的值。\n\n下表显示了左侧的 Lambda 表达式以及右侧显式创建匿名方法的等效代码。你可以看到\
  \ Lambda 表达式比匿名方法的声明要简洁得多。\n\n| Lambda 表达式 | 匿名方法 |\n| --- | --- |\n| ```c\nIntOperation\
  \ Square = x => x * x;\n``` | ```c\nIntOperation Square = delegate(int x)\n{\n \
  \   return x * x;\n};\n``` |\n\n让我们来看一个演示 Lambda 表达式使用的完整应用程序。程序 13-4 显示了 LambdaDemo\
  \ 应用程序的 Form1 代码。\n\n*   在第 6 行，我们声明了一个名为 `IntOperation` 的委托类型，它指定了 `int` 返回类型和一个\
  \ `int` 参数。\n*   在第 18 行，我们声明了一个名为 `Square` 的 `IntOperation` 委托，引用一个具有名为 `x` 的 `int`\
  \ 参数的匿名方法。该方法返回 `x * x` 的值。\n*   在第 20 行，我们调用了由 `Square` 委托引用的方法，传递参数 5，并将返回值赋值给\
  \ `result` 变量。在第 21 行，我们在消息框中显示了 `result` 变量。\n\n# 多参数的 Lambda 表达式\n\n如果委托类型指定了多个参数，那么你与该委托使用的任何\
  \ Lambda 表达式也必须具有多个参数。例如，考虑此委托类型声明：\n\n```\ndelegate void IntCalculator(int a, int\
  \ b);\n```\n\n要在 Lambda 表达式中使用多个一个参数，只需编写一个逗号分隔的列表并将该列表括在括号中。这是一个示例：\n\n```c\nIntCalculator\
  \ Sum = (a, b) => a + b;\n```\n\n这个 Lambda 表达式有两个参数，`a` 和 `b`。表达式返回 `a + b` 的值。\n\
  \n让我们来看另一个演示 Lambda 表达式的应用程序。程序 13-5 显示了 LambdaDemo 应用程序的 Form1 代码。\n\n*   在第 6\
  \ 行，我们声明了一个名为 `IntOperation` 的委托类型，它指定了 `int` 返回类型和一个 `int` 参数。\n*   在第 18 行，我们声明了一个名为\
  \ `Square` 的 `IntOperation` 委托，引用一个具有名为 `x` 的 `int` 参数的匿名方法。该方法返回 `x * x` 的值。\n\
  *   在第 20 行，我们调用了由 `Square` 委托引用的方法，传递参数 5，并将返回值赋值给 `result` 变量。在第 21 行，我们在消息框中显示了\
  \ `result` 变量。\n\n# 无参数的 Lambda 表达式\n\n如果委托类型未指定参数，那么你与该委托使用的任何 Lambda 表达式也必须没有参数。例如，考虑此委托类型声明：\n\
  \n```\ndelegate void TestMessage();\n```\n\n只需编写一组空括号作为参数列表，如下所示：\n\n```c\nTestMessage\
  \ Display = () => MessageBox.Show(\"Testing, 1, 2, 3...\");\n```\n\n当此 Lambda 表达式被调用时，它会在消息框中显示字符串\
  \ `\"Testing, 1, 2, 3...\"`。\n\n# 不返回值的 Lambda 表达式\n\n如果委托类型指定了 `void` 返回类型，你与该委托使用的任何\
  \ Lambda 表达式也应该是 `void`。例如，考虑此委托类型声明：\n\n```\ndelegate void DisplayInt(int x);\n\
  ```\n\n以下语句创建了一个名为 `Display` 的 `DisplayInt` 类型委托：\n\n```c\nDisplayInt Display =\
  \ x => MessageBox.Show(x.ToString());\n```\n\n这个 Lambda 表达式有一个参数 `x`。当表达式被调用时，它会在消息框中显示\
  \ `x` 的值。\n\n# 显式声明参数的数据类型\n\n你不需要指定 Lambda 表达式参数的数据类型，因为编译器通常能够从委托类型声明中确定。但如果你愿意，C#\
  \ 允许你显式声明参数的数据类型。例如，假设我们有以下委托类型声明：\n\n```\ndelegate int IntOperation(int x);\n```\n\
  \n以下语句中的 Lambda 表达式显式声明了参数 `x` 的类型：\n\n```c\nIntOperation Square = (int x) => x\
  \ * x;\n```\n\n注意，参数声明（在 `=` `>` 运算符左侧）必须括在括号中。这里另一个示例，涉及两个参数。\n\n\n\n\n\n```csharp\n\
  delegate void IntCalculator(int a, int b);\nIntCalculator Sum = (int a, int b) =>\
  \ a + b;\n```\n\n## 在 Lambda 表达式中使用多个语句\n\n你可以在 Lambda 表达式的体中编写多个语句，但如果你这样做，就必须将这些语句封装在花括号中，并且如果表达式返回值，你必须编写一个\
  \ `return` 语句。例如，考虑以下委托类型声明：\n\n```csharp\ndelegate int IntOperation(int x);\n```\n\
  \n以下语句创建了一个名为 `TimesTwo` 的 `IntOperation` 类型的委托：\n\n```csharp\nIntOperation TimesTwo\
  \ = (x) => {\n    int a = x * 2;\n    return a;\n};\n```\n\n## 在 Lambda 表达式内部访问外部变量\n\
  \nLambda 表达式可以访问包含该 Lambda 表达式的方法中定义的局部变量，只要这些变量在作用范围内并且已经赋值。下面的代码演示了这一点。注意第 9 行中的\
  \ Lambda 表达式访问了局部变量 `factor`，该变量已被赋值为 10：\n\n```csharp\n1 private void demoButton_Click(object\
  \ sender, EventArgs e)\n2 {\n3\n4    int factor = 10;\n5    int result;\n6\n7  \
  \  // 创建一个委托，将其参数\n    // 乘以 factor。\n9    IntOperation Multiplier = x => x * factor;\n\
  10\n11    result = Multiplier(5);\n12    MessageBox.Show(result.ToString());\n13\
  \ }\n```\n\n## 将 Lambda 表达式作为参数传递\n\n你可以在任何需要兼容委托的地方使用 Lambda 表达式。例如，如果你正在调用一个期望传递委托作为参数的方法，你可以传递一个兼容的\
  \ Lambda 表达式。程序 13-6 中的代码显示了一个示例。\n\n*   第 6 行声明了一个名为 `IntRefOperation` 的委托类型，该类型有一个\
  \ `int` 引用参数。\n*   第 15 行是名为 `ArrayStepper` 的方法头。该方法有两个参数：一个名为 `array` 的 `int` 数组和一个名为\
  \ `op` 的 `IntRefOperation` 委托。\n*   第 26 行创建了一个名为 `numbers` 的 `int` 数组，初始化值为 10,\
  \ 20, 30, 40。\n*   第 29 行调用 `ArrayStepper` 方法，并将 `numbers` 数组和以下 Lambda 表达式作为参数：\n\
  \    ```csharp\n    (ref int x) => MessageBox.Show(x.ToString())\n    ```\n*   因为\
  \ `ArrayStepper` 方法期望第二个参数为 `IntRefOperation` 委托，因此该 Lambda 表达式被转换为 `IntRefOperation`\
  \ 委托。结果，`ArrayStepper` 方法在消息框中显示数组的每个元素。\n*   第 32 行调用 `ArrayStepper` 方法，并将 `numbers`\
  \ 数组和以下 Lambda 表达式作为参数：\n    ```csharp\n    (ref int x) => x = 0\n    ```\n*   因为\
  \ `ArrayStepper` 方法期望第二个参数为 `IntRefOperation` 委托，因此该 Lambda 表达式被转换为 `IntRefOperation`\
  \ 委托。结果，`ArrayStepper` 方法调用将每个数组元素设置为 0。\n*   第 35 行执行了与第 29 行相同的操作：它显示数组的每个元素。\n\
  \n## 使用 Lambda 表达式定义类方法\n\nLambda 表达式为在类声明中定义简单方法提供了一种快速且简洁的方法。例如，查看以下 `SimpleMath`\
  \ 类：\n\n```csharp\n1   class SimpleMath\n2   {\n3      public int Add(int a, int\
  \ b) => a + b;\n4      public int Sub(int a, int b) => a − b;\n5      public int\
  \ Mult(int a, int b) => a * b;\n6      public double Div(int a, int b) => (double)\
  \ a / b;\n7   }\n```\n\n该类使用 Lambda 表达式定义了名为 `Add`、`Sub`、`Mult` 和 `Div` 的四个方法。将此代码与使用普通方法定义的类声明进行比较：\n\
  \n```csharp\n1  class SimpleMath\n2  {\n3     public int Add(int a, int b)\n4  \
  \   {\n5         return a + b;\n6     }\n7\n8     public int Sub(int a, int b)\n\
  9     {\n10          return a − b;\n11     }\n12\n13     public int Mult(int a,\
  \ int b)\n14     {\n15         return a * b;\n16     }\n17\n18     public double\
  \ Div(int a, int b)\n19     {\n20         return (double) a / b;\n21     }\n22 \
  \ }\n```\n\n你可以看到，第一个版本的类只占了 7 行代码，比占了 22 行代码的第二个版本简洁得多。\n\n# 检查点\n\n1.  13.8 什么是\
