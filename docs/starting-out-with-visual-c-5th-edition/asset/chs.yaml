  回想第 3 章变量变量的作用域是程序中可以访问该变量的部分。变量仅对其作用域内的语句可见。参数变量的作用域是声明该参数的方法。方法之外的任何语句都无法访问参数变量。\n\
  \n# 传递多个参数\n\n通常，向方法传递多个参数是有用的的。下面的代码示例显示了一个接受两个参数的方法。该方法的名称为 `ShowMax`。它接受两个 `int`\
  \ 参数，并显示其中最大的参数值。如果两个参数相等，它会显示一条消息说明它们相等。（该方法可以在本书 `Chap06` 文件夹下的 `Max` 项目的学生示例程序中找到。）\n\
  \n```\n 1 private void ShowMax(int num1, int num2)\n 2 {\n 3     if (num1 == num2)\n\
  \ 4     {\n 5         MessageBox.Show(\"The numbers are equal.\");\n 6     }\n 7\
  \     else if (num1 > num2)\n 8     {\n 9         MessageBox.Show(num1 + \" is the\
  \ greatest.\");\n10     }\n11     else\n12     {\n13         MessageBox.Show(num2\
  \ + \" is the greatest.\");\n14     }\n15 }\n```\n\n注意，两个参数变量 `num1` 和 `num2` 声明在方法头（第\
  \ 1 行）的括号内。这通常被称为参数列表。还要注意用逗号分隔了这些声明。这里是调用该方法的语句示例：\n\n```\nShowMax(5, 10);\n```\n\
  \n该语句将参数 `5` 和 `10` 传递给方法。参数根据其位置传递给参数变量。句话说，第一个参数传递给第一个参数变量，第二个参数传递给第二个参数变量，依此类推。因此，该语句导致\
  \ `5` 被传递给 `num1` 参数，而 `10` 被传递给 `num2` 参数。这在图 6-13 中所示。\n\n# 图 6-13 按照位置传递给方法的两个参数\n\
  \n![屏幕截图显示了一个按照位置向方法传递两个参数的程序。](img/FG_06_013.png)图 6-13 完整备用文本\n\n假设我们反转方法调用中列出参数的顺序，如下所示：\n\
  \n```\nShowMax(10, 5);\n```\n\n这将 `10` 传递给 `num1` 参数并将 `5` 传递给 `num2` 参数。接下来的代码示例显示了另一个例子。这次我们将变量作为参数传递。\n\
  \n```\n int value1 = 2;\nint value2 = 3;\nShowMax(value1, value2);\n```\n\n当该代码执行\
  \ `ShowMax` 方法时，`num1` 参数包含 `2`，而 `num2` 参数包含 `3`。\n\n### 注意\n\n你必须为参数列表中声明的每个参数变量编写数据类型。例如，如果\
  \ `ShowMax` 方法的参数列表如下所示编写，则会发生编译错误：\n\n```\nprivate void ShowMax(int num1, num2)\
  \ // 错误！\n```\n\n必须列出 `num1` 和 `num2` 参数变量的数据类型，如下所示：\n\n```\nprivate void ShowMax(int\
  \ num1, int num2)\n```\n\n# 具名参数\n\n除了传统的位置参数传递方法（第一个参数传递给方法的第一个参数，第二个参数传递给方法的第二个参数，依此类推）外，C#\
  \ 还允许你指定应将参数传递给哪个参数。要指定参数应该传递给哪个参数变量，你可以在方法调用中使用以下格式编写参数：\n\n```\nparameterName\
  \ : value\n```\n\n在此格式中，`parameterName` 是参数变量的名称，`value` 是传递给该参数的值。使用这种语法编写的参数被称为具名参数。为了演示，请看以下方法：\n\
  \n```\n private void ShowName(string firstName, string lastName)\n{\n    MessageBox.Show(firstName\
  \ + \" \" + lastName);\n}\n```\n\n下面的语句显示了如何使用具名参数调用方法：\n\n```\nShowName(lastName\
  \ : \"Smith\", firstName : \"Suzanne\");\n```\n\n该语句指定 `\"Smith\"` 应该传递给 `lastName`\
  \ 参数，而 `\"Suzanne\"` 应该传递给 `firstName` 参数。你得到的结果与使用位置参数这样调用方法的结果是相同的：\n\n```\nShowName(\"\
  Suzanne\", \"Smith\");\n```\n\n# 默认参数\n\nC# 允许你为参数提供默认参数。当为参数提供默认参数时，就可以不显式地传递参数来调用方法。这里有一个带有默认参数的方法示例：\n\
  \n```\n void ShowTax(decimal price, decimal taxRate = 0.07m)\n{\n    // 计算税额。\n\
  \    decimal tax = price * taxRate;\n    // 显示税额。\n    MessageBox.Show(\"The tax\
  \ is \" + tax.ToString(\"c\"));\n}```\n\n在该方法中，`0.07m` 是 `taxRate` 的默认参数。因为我们没有为\
  \ `taxRate` 传递参数，所以它的值是 `0.07m`。\n\n```\nShowTax(100.0m);\n```\n\n如果我们想要 `taxRate`\
  \ 参数具有不同的值，可以在调用方法时为其指定一个参数，如下所示：\n\n```\nShowTax(100.0m, 0.08m);\n```\n\n在使用默认参数时注意以下细节：\n\
  \n- 默认参数必须是字面量或常量。你不能指定变量作为默认参数。\n- 你可以为方法的所有参数提供默认参数。但是当只有部分参数具有默认参数时（如示例所示），你必须将带有默认参数的参数声明在最后。例如，如果我们这样编写\
  \ `ShowTax` 方法头将会发生编译错误：\n\n    ```\n     // 非法的方法头\n    private void ShowTax(decimal\
  \ taxRate = 0.07m, decimal price)\n    ```\n\n- 当方法有多个默认参数且你在调用方法时省略了其中一个参数时，你必须省略其后面的所有参数。\n\
  \n\n\n\n\n```csharp\nprivate void goButton_Click(object sender, EventArgs e)\n{\n\
  \    int number = 99;\n\n    // 显示 number 的值。\n    MessageBox.Show(\"The value of\
  \ number is \" + number);\n\n    // 调用 ChangeMe，并将 number 作为参数。\n    ChangeMe(number);\n\
  \n    // 再次显示 number 的值。\n    MessageBox.Show(\"The value of number is \" + number);\n\
  }\n\nprivate void ChangeMe(int myValue)\n{\n    // 更改 myValue 参数的值。\n    myValue\
  \ = 0;\n\n    // 显示 myValue 的值。\n    MessageBox.Show(\"In ChangeMe, myValue is \"\
  \ + myValue);\n}\n```\n\n在 `goButton_Click` 事件处理程序内部，在第 3 行声明了一个名为 `number` 的局部变量，并将其初始化为值\
  \ 99。因此，第 6 行的语句显示 `The value of number is 99`。随后，`number` 变量的值作为参数传递给第 9 行的 `ChangeMe`\
  \ 方法。这意味着在 `ChangeMe` 方法中，值 99 被赋值给参数变量 `myValue`。\n\n在 `ChangeMe` 方法内部，第 18 行将值\
  \ 0 赋值给 `myValue` 参数变量。这覆盖了在调用该方法时传递给参数的值 99。第 21 行显示消息 `In ChangeMe, myValue is\
  \ 0`。\n\n在 `ChangeMe` 方法执行完毕，程序的控制权返回到 `goButton_Click` 事件处理程序。当执行第 12 行的语句时，将显示消息\
  \ `The value of number is 99`。尽管参数变量 `myValue` 在 `ChangeMe` 方法中被更改了，但 `goButton_Click`\
  \ 事件处理程序中的 `number` 变量并没有被修改。\n\n按值传递在大多数情况下都是有效的，因为参数发送到方法通常仅出于信息目的。通常，当你将变量作为参数传递给方法时，你希望该变量在方法调用之前之后具有相同的值。按值传递参数保证了该参数不会被其所在的方法所更改。然而，有时你希望方法能够更改作为参数传递给它的变量的值。这需要一种稍微不同的参数传递类型，将在下一节中讨论。\n\
  \n# Checkpoint（检查点）\n\n1. 6.6 参数的目的是什么？\n2. 6.7 简要总结赋值兼容性是如何应用于参数传递的。\n3. 6.8 参数变量的作用域是什么？\n\
  4. 6.9 什么是命名参数？\n5. 6.10 参数按值传递意味着什么？\n\n# 6.4 引用引用传递参数\n\n## Concept（概念）\n\n当参数按引用传递给方法时，该方法可以更改程序调用部分中参数的值。\n\
  \n当你希望方法能够更改作为参数传递给它的变量的值时，该变量必须按引用传递。在 C# 中，按引用传递参数有两种方式：\n\n-   你可以在方法中使用引用参数（ref\
  \ parameter）。\n-   你可以在方法中使用输出参数（output parameter）。\n\n## Using Reference Parameters（使用引用参数）\n\
  \n引用参数是一种特殊的参数变量类型。当你将参数传递到引用参数时，引用参数并接收参数值的副本。相反，它变成了传递给它的参数的*引用*（reference）。对引用参数进行的任何操作实际上都是在它所引用的参数上执行的。\n\
  \n引用参数对于建立方法之间的双向通信非常有用。当一个方法调用另一个方法并按引用传递参数时，方法之间的通信可以通过以下方式进行：\n\n-   调用方法可以通过传递参数与被调用方法进行通信。\n\
  -   被调用方法可以通过通过引用参数修改参数的值与调用方法进行通信。\n\n在 C# 中，你通过在参数变量的数据类型之前编写 `ref` 关键字来声明引用参数。例如，查看以下方法：\n\
  \n```csharp\nprivate void SetToZero(ref int number)\n{\n    number = 0;\n}\n```\n\
  \n在括号内部，`ref` 关键字表示 `number` 是一个引用变量。该方法将 0 赋值给 `number` 参数。由于 `number` 是引用参数，此操作实际上是在作为参数传递给方法的变量上执行的。\n\
  \n当你调用带有引用参数的方法时，也必须在参数之前编写 `ref` 关键字。以下代码示例显示了一个例子：\n\n```csharp\nint myVar = 99;\n\
  SetToZero(ref myVar);\n```\n\n第一条语句声明 `myVar` 为 `int` 变量，初始化为值 99。第二条语句调用 `SetToZero`\
  \ 方法，按引用传递 `myVar`。在方法调用之后，`myVar` 变量被设置为值 0。\n\n当你将参数传递给 `ref` 参数时，该参数必须已经设置了某个值。例如，如果一个变量没有初始化或赋值，则你无法将其作为参数传递到\
  \ `ref` 参数中。以下代码示例会导致编译错误：\n\n```csharp\nint myVar;            // 声明一个没有值的 myVar。\n\
  SetToZero(ref myVar); // 错误！myVar 未设置值。\n```\n\n让我们来看使用 `SetToZero` 方法的完整程序。在书籍示例程序中，你会找到一个名为\
  \ `Pass Ref` 的项目。\n\n# Figure 6-15\n显示了带有控件的 Pass Ref 应用表单。\n\n# Program 6-5\nPass\
  \ Ref Form1 的代码\n\n```csharp\nusing System;\nusing System.Collections.Generic;\n\
  using System.ComponentModel;\nusing System.Data;\nusing System.Drawing;\nusing System.Linq;\n\
  using System.Text;\nusing System.Threading.Tasks;\nusing System.Windows.Forms;\n\
  \nnamespace Pass_Ref\n{\n    public partial class Form1 : Form\n    {\n        public\
  \ Form1()\n        {\n            InitializeComponent();\n        }\n\n        //\
  \ SetToZero 方法引用接收 int 参数\n        // 并将其设置为零。\n        private void SetToZero(ref\
  \ int number)\n        {\n            number = 0;\n        }\n\n        private\
  \ void goButton_Click(object sender, EventArgs e)\n        {\n            // 声明一些局部变量。\n\
  \            int x = 99, y = 100, z = 101;\n\n            // 显示这些变量的值。\n       \
  \     outputListBox.Clear();\n            outputListBox.Items.Add(\"x is set to\
  \ \" + x);\n            outputListBox.Items.Add(\"y is set to \" + y);\n       \
  \     outputListBox.Items.Add(\"z is set to \" + z);\n\n            // 将每个变量传递给\
  \ SetToZero。\n            SetToZero(ref x);\n            SetToZero(ref y);\n   \
  \         SetToZero(ref z);\n\n            // 再次显示这些变量的值。\n            outputListBox.Items.Add(\"\
  --------------------\");\n            outputListBox.Items.Add(\"x is set to \" +\
  \ x);\n            outputListBox.Items.Add(\"y is set to \" + y);\n            outputListBox.Items.Add(\"\
  z is set to \" + z);\n        }\n\n        private void exitButton_Click(object\
  \ sender, EventArgs e)\n        {\n            // 关闭表单。\n            this.Close();\n\
  \        }\n    }\n}\n```\n\n\n\n\n注意，表单有一个名为 `outputListBox` 的 `ListBox` 控件。此 ListBox\
  \ 用于显示程序的输出。我们之前讨论的 `SetToZero` 方法出现在第 22–25 行。该方法按引用接收一个 `int` 参数，并将值 0 赋值给该参数。\n\
  \n在 `goButton_Click` 方法中，第 30 行声明了 `int` 变量 `x`、`y` 和 `z`，并将它们初始化为值 99、100 和 101。第\
  \ 33 行清空 `outputListBox` 控件，第 34–36 行在 ListBox 中显示 `x`、`y` 和 `z` 变量的值。\n\n在第 39–41\
  \ 行，`x`、`y` 和 `z` 变量作为参数按引用传递给 `SetToZero` 方法。每调用一次 `SetToZero`，作为参数传递的变量会被赋值为 0。这在第\
  \ 45–47 行显示 `x`、`y` 和 `z` 变量时得到了体现。图 6-16 显示了点击 `Go` 按钮后的应用程序表单。\n\n# 图 6-16 按引用传递程序的输出\n\
  \n![截图显示了一个显示 Pass By Ref 应用程序表单的窗口](img/FG_06_016.png)图 6-16 完整替代文本\n\n# 使用输出参数\n\
  \n输出参数的工作方式类似于引用参数。当你将参数传递到输出参数时，该输出参数就变成了传入参数的引用。对输出参数执行的任何操作实际上都是作用在它所引用的参数之上的。输出参数与引用参数的区别体现在以下几个方面：\n\
  \n*   参数在传递给输出参数之前不需要设置值。例如，一个未初始化的变量可以传递给输出参数。\n*   具有输出参数的方法在执行完成之前必须将输出参数设置为某个值。\n\
  \n在 C# 中，你通过在参数变量的数据类型之前编写 `out` 关键字来声明输出参数。例如，我们可以以此方式修改 `SetToZero` 方法，使 `number`\
  \ 参数成为输出参数：\n\n```\nprivate void SetToZero(out int number)\n{\n    number = 0;\n\
  }\n```\n\n当你调用带有输出参数的方法时，必须在参数之前也编写 `out` 关键字。下面的代码示例展示了一个例子：\n\n```\nint myVar;\n\
  SetToZero(out myVar);\n```\n\n第一条语句声明 `myVar` 为未初始化的 `int` 变量。第二条语句调用 `SetToZero`\
  \ 方法，将 `myVar` 传递给输出参数。方法调用后，`myVar` 变量被设置为值 0。\n\n教程 6-3 为你编写使用输出参数的方法提供了一些经验。\n\
  \n# 检查点\n\n1.  6.11 什么是引用参数？\n2.  6.12 方法如何使用引用参数进行通信？\n3.  6.13 使用什么关键字来指定引用参数？\n\
  4.  6.14 什么是输出参数？\n\n# 6.5 返回值的方法\n\n### 概念\n\n返回值的方法是指向调用它的程序部分返回值的方法。\n\n返回值的方法与\
  \ `void` 方法在以下方面相似：\n\n*   它包含一组执行特定任务的语句。\n*   当你想要执行该方法时，你会调用它。\n\n然而，当返回值的方法结束时，它会向调用它的语句返回一个值。方法返回的值可以像任何其他值一样使用：它可以赋值给变量、显示在屏幕上、在数学表达式中使用（如果它是数字）等。\n\
  \n你已经使用过 .NET Framework 中的许多返回值的方法。例如，`int.Parse` 方法接受一个字符串作为参数，并返回字符串转换为 `int`\
  \ 的值。让我们回顾一下该方法是如何运行的。在以下语句中，假设 `number` 是一个 `int` 变量：\n\n```\nnumber = int.Parse(\"\
  100\");\n```\n\n语句中读取 `int.Parse(\"100\")` 的部分是对 `int.Parse` 方法的调用，并将字符串 `\"100\"\
  ` 作为参数传递。图 6-19\n\n## 编写你自己的返回值的方法\n\n你编写返回值的方法与编写 `void` 方法相同，但有两个例外：\n\n*   你必须为方法返回的值指定类型。\n\
  *   方法内部的语句之一必须是 `return` 语句。\n\n这是返回值方法的通用格式：\n\n```\nAccessModifier DataType MethodName(ParameterList)\n\
  {\n    statement;\n    etc.\n}\n```\n\n*   `AccessModifier` 是访问修饰符，如 `private` 或\
  \ `public`。\n*   `DataType` 是方法返回的值的数据类型。我们通常称之为返回类型。例如，如果方法返回整数，这里显示 `int`。如果方法返回\
  \ `double`，这里显示 `double`。同样，如果方法返回 `decimal`，这里显示 `decimal`。\n*   `MethodName` 是方法的名称。\n\
  *   `ParameterList` 是参数列表。如果方法不接受参数，则显示括号。\n\n方法内部的语句之一必须是 `return` 语句，其如下：\n\n\
  ```\nreturn expression;\n```\n\n`return` 关键字之后的 `expression` 值被发送回给调用方法的语句。\n\n\
  这是一个返回值方法的示例：\n\n```\nprivate int Sum(int num1, int num2)\n{\n    return num1 +\
  \ num2;\n}\n```\n\n\n\n让我们来看一个演示 `Sum` 方法的完整程序。在本书的学生示例程序 `Chap06` 文件夹中，你会找到一个名为\
  \ `Sum` 的项目。图 6-22 显示了应用程序的表单，程序 6-7 显示表单的代码。当你运行应用程序时，在 `age1TextBox` 和 `age2TextBox`\
  \ 控件中输入两个整数。当你点击*计算总年龄*（Calculate Combined Age）按钮时，这两个整数的和将显示在 `combinedAgeLabel`\
  \ 控件中。\n\n## 图 6-22 `Sum` 应用程序的表单\n\n![截图显示了设计器中 Sum 应用程序表单的窗口，带有控件名称。](img/FG_06_022.png)图\
