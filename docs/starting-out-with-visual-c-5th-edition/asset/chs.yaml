  3.  10.21 如何识别问题域中的类？\n4.  10.22 什么是类的职责？\n5.  10.23 为了确定类的职责你应该问哪些问题？\n6.  10.24\
  \ 类的动作是否都会在问题域中提到？\n\n# 10.6 类的应用：创建多个表单\n\n在我们的问题域中，`Car` 类的对象必须知道什么？以下项目都是汽车的数据属性，并在问题域中被提到：\n\
  \n*   汽车品牌\n*   汽车型号\n*   汽车年份\n\n现在让我们确定该类的方法。在我们的问题域中，`Car` 类必须做什么？再次，唯一显而易见的动作是我们在大多数类中都能找到的标准方法集。具体来说，这些动作是：\n\
  \n*   创建并初始化 `Car` 类的对象。\n*   获取和设置汽车品牌。\n*   获取和设置汽车型号。\n*   获取和设置汽车年份。\n\n下面的代码显示了\
  \ `Car` 类可能是如何写的：\n\n（此处重复了代码块已翻译，省略）\n\n# 重命名 Form1 表单\n\n当你向 C# 项目添加表单时，它们被赋予默认名称，如\
