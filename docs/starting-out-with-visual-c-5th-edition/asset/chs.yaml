  \ `motors` 的数组，该数组可以容纳 100 个 `Engine` 对象。\n8. 9.8 什么导致数据结构之间存在并行关系？\n\n# 9.3 `DateTime`\
  \ 和 `TimeSpan` 结构\n\n### 概念\n\n在 .NET Framework 中，`DateTime` 结构存储日期、时间或两者。`TimeSpan`\
  \ 结构存储有关时间间隔的信息。\n\n在 .NET Framework 中定义的 `DateTime` 结构允许你创建存储某一时刻数据的对象。`DateTime`\
  \ 对象同时存储日期和时间。在内部，日期和时间值存储在以下属性中：\n\n* Month—1–12 范围内的整数\n* Day—1–31 范围内的整数\n* Year—1–9999\
  \ 范围内的整数\n* Hour—0–23 范围内的整数\n* Minute—0–59 范围内的整数\n* Second—0–59 范围内的整数\n* Millisecond—0–999\
  \ 范围内的整数\n\n注意，`Hour` 属性是根据 24 小 24 小时制设置的。例如，小时 1 是上午 1:00，小时 13 是下午 1:00。\n\n\
  创建 `DateTime` 结构体实例有多种方法。以下语句创建了一个名为 `dt` 的 `DateTime` 实例，设置为默认日期 0001 年 1 月 1 日和默认时间凌晨\
  \ 12:00:00， 0 毫秒：\n\n```\nDateTime dt = new DateTime();\n```\n\n你可以像下面的代码示例所示更改单独的日期和时间属性：\n\
  \n```\nDateTime dt = new DateTime();\ndt.Month = 12;\ndt.Day = 15;\ndt.Year = 2019;\n\
  dt.Hour = 13;\ndt.Minute = 30;\ndt.Second = 0;\ndt.Millisecond = 0;\n```\n\n在此示例中，`dt`\
  \ 实例被设置为 2019 年 12 月 15 日的下午 1:00:00。\n\n当你创建 `DateTime` 实例时，可以选择地用特定日期、时间或两者对其进行初始化。以下是三种通用格式：\n\
  \n```\nDateTime instanceName = new DateTime(Year, Month, Day); \nDateTime instanceName\
  \ = new DateTime(Year, Month, Day, Hour, Minute, Second);\nDateTime instanceName\
  \ = new DateTime(Year, Month, Day, Hour, Minute, Second, Millisecond);\n```\n\n\
  `Year`、`Month`、`Day`、`Hour`、`Minute`、`Second` 和 `Millisecond` 的值为整数。以下示例创建了一个名为\
  \ `dt` 的 `DateTime` 实例，设置为 2000 年 11 月 5 日。`Hour`、`Minute`、`Second` 和 `Millisecond`\
  \ 属性被设置为默认值 0，即午夜：\n\n```\nDateTime dt = new DateTime(2000, 11, 5);\n```\n\n以下示例创建了一个名为\
  \ `dt` 的 `DateTime` 实例，设置为 2000 年 11 月 5 日的上午 8:30。`Second` 属性设置为 15，`Millisecond`\
  \ 属性设置为默认值 0：\n\n```\nDateTime dt = new DateTime(2000, 11, 5, 8, 30, 15);\n```\n\
  \n以下示例创建了一个名为 `dt` 的 `DateTime` 实例，设置为 2000 年 11 月 5 日的上午 8:30。`Second` 属性设置为 15，`Millisecond`\
  \ 属性设置为 500：\n\n```\nDateTime dt = new DateTime(2000, 11, 5, 8, 30, 15, 500);\n\
  ```\n\n# 显示 `DateTime` 对象\n\n你可以获取 `DateTime` 对象的任何属性并在程序中使用它们。例如，下面的代码示例显示了 `DateTime`\
  \ 对象的属性：\n\n```\nDateTime dt = new DateTime(2000, 11, 5, 8, 30, 15, 500);\nConsole.WriteLine(dt.Month);\n\
  Console.WriteLine(dt.Day);\nConsole.WriteLine(dt.Year);\nConsole.WriteLine(dt.Hour);\n\
  Console.WriteLine(dt.Minute);\nConsole.WriteLine(dt.Second);\nConsole.WriteLine(dt.Millisecond);\n\
  ```\n\n\n\n\n\n## 方法\n\n* `ToShortDateString()`—返回格式化为短日期格式的日期，与 `ToString(\"d\"\
  )` 相同。\n* `ToLongDateString()`—返回格式化为长日期格式的日期，与 `ToString(\"D\")` 相同。\n* `ToShortTimeString()`—返回格式化为短时间格式的时间，与\
  \ `ToString(\"t\")` 相同。\n* `ToLongTimeString()`—返回格式化为长时间格式的时间，与 `ToString(\"D\"\
  )` 相同。\n\n# 从系统获取当前日期和时间\n\n表达式 `DateTime.Now` 为您提供系统的当前日期和时间。以下是如何将系统当前日期和时间赋值给\
  \ `DateTime` 变量的示例：\n\n```\nDateTime currentDateTime = DateTime.Now;\n```\n\n表达式\
  \ `DateTime.Today` 为您提供当前日期，但不包含时间。以下是如何将系统当前日期赋值给 `DateTime` 变量的示例：\n\n```\nDateTime\
  \ currentDate = DateTime.Today;\n```\n\n在执行此语句后，`currentDate` 对象将设置为当前日期，但该对象的日期属性将被设置为默认值凌晨\
  \ 12:00。\n\n# 将字符串转换为 `DateTime` 结构\n\n您已经熟悉了 `TryParse` 方法以及如何使用它将字符串转换为数值数据类型。您也可以使用\
  \ `TryParse` 方法将字符串转换为 `DateTime` 对象。以下是通用格式：\n\n```\nDateTime.TryParse(string,\
  \ out targetVariable)\n```\n\n在通用格式中，`string` 是您想要转换的字符串，`targetVariable` 是 `DateTime`\
  \ 对象的名称。该方法尝试将 `string` 参数转换为 `DateTime` 对象。如果转换成功，转换后的值将赋值给 `targetVariable`，并且该方法返回布尔值\
  \ `true` 表示转换成功。如果转换失败，该方法将把默认日期 0001 年 1 月 1 日和默认时间凌晨 12:00:00 存储在 `targetVariable`\
  \ 中，并返回布尔值 `false` 表示无法转换该字符串。\n\n以下是一些可以使用 `TryParse` 方法成功转换为 `DateTime` 对象的字符串示例：\n\
  \n* `\"4/20/2019\"` 转换为 4/20/2019 凌晨 12:00:00\n* `\"2019-4-20\"` 转换为 4/20/2019 凌晨\
  \ 12:00:00\n* `\"20 April 2019\"` 转换为 4/20/2019 凌晨 12:00:00\n* `\"4/20/2019 3:45:50\
  \ PM\"` 转换为 4/20/2019 下午 3:45:50\n* `\"4/20/2019 3:45:50.500 PM\"` 转换为 4/20/2019\
  \ 下午 3:45:50，500 毫秒\n\n您可以使用 `DateTime.TryParse` 方法来转换输入到 TextBox 控件中的日期和/或时间。下面的代码示例显示了一个例子。假设\
  \ `dateTimeTextBox` 是一个 TextBox 控件：\n\n```\nDateTime dt = new DateTime();\nif (DateTime.TryParse(dateTimeTextBox.Text,\
  \ out dt))\n{\n    MessageBox.Show(\"Successful Conversion\");\n}\nelse\n{\n   \
  \ MessageBox.Show(\"Failed Conversion\");\n}\n```\n\n# DateTimePicker 控件\n\nDateTimePicker\
  \ 控件（位于工具箱的 `Common Controls` 组）为用户选择日期提供了一种方便的方法。图 9-11 显示了一个示例。它是一个下拉控件，显示一个整个月份的小滚动日历。用户从日历中选择一个日期，您的程序从控件的\
  \ `Value` 属性获取该日期作为 `DateTime` 对象。最初，`Value` 属性设置为当前日期，当前日期将在控件日历中显示为已选中。\n\n当用户从\
  \ DateTimePicker 控件中选择日期时，会触发 `ValueChanged` 事件。如果您为控件编写了 `ValueChanged` 事件处理程序，则该处理程序会在每次选择日期时执行。要为\
  \ `ValueChanged` 事件处理程序生成代码模板，只需在 `Designer` 窗口中双击 DateTimePicker 控件即可。\n\n由于图 9-12\
  \ 显示了本章学生示例程序中 `DateTime Demo` 应用程序的 Form1 表。如图 9-13 所示，用户从 DateTimePicker 控件中选择日期时，会触发\
  \ `ValueChanged` 事件。如果您为控件编写了 `ValueChanged` 事件处理程序，则该处理程序会在每次选择日期时执行。\n\n# 比较 `DateTime`\
  \ 对象\n\n您可以使用 C# 的关系运算符来比较两个 `DateTime` 对象，并确定一个是否晚于、早于或等于另一个。当与 `DateTime` 对象一起使用时，关系运算符的作用如下：\n\
  \n* 表达式 `obj1 > obj2` 如果 `obj1` 晚于 `obj2`，则为 `true`。\n* 表达式 `obj1 < obj2` 如果 `obj1`\
  \ 早于 `obj2`，则为 `true`。\n* 表达式 `obj1 == obj2` 如果 `obj1` 与 `obj2`相同，则为 `true`。\n*\
  \ 表达式 `obj1 != obj2` 如果 `obj1` 不等于 `obj2`，则为 `true`。\n* 表达式 `obj1 >= obj2` 如果 `obj1`\
  \ 晚于或等于 `obj2`，则为 `true`。\n* 表达式 `obj1 <= obj2` 如果 `obj1` 早于或等于 `obj2`，则为 `true`。\n\
  \n例如，假设我们如下结构：\n\n```csharp\nstruct Person {\n    public string name;\n    public\
  \ DateTime birthdate;\n}\n```\n\n该结构存储一个人的姓名（`string` 类型）和出生日期（`DateTime` 类型）。下面的代码示例创建了两个\
  \ `Person` 实例，然后判断谁年龄大：\n\n```csharp\n// 创建 person1 对象。\nPerson person1 = new Person();\n\
  person1.name = \"Emily\";\nperson1.birthdate = new DateTime(1996, 10, 7);\n\n//\
  \ 创建 person2 对象。\nPerson person2 = new Person();\nperson2.name = \"Dave\";\nperson2.birthdate\
  \ = new DateTime(1994, 4, 12);\n\n// 判断谁年龄大。\nif (person1.birthdate > person2.birthdate)\
  \ {\n    MessageBox.Show(person2.name + \" 比 \" + person1.name + \" 大\");\n} else\
  \ if (person2.birthdate > person1.birthdate) {\n    MessageBox.Show(person1.name\
  \ + \" 比 \" + person2.name + \" 大\");\n} else if (person1.birthdate == person2.birthdate)\
  \ {\n    MessageBox.Show(person1.name + 与 \" + person2.name + \" 同龄\");\n}\n```\n\
  \n# `TimeSpan` 结构\n\n`TimeSpan` 结构允许您创建存储时间跨度数据对象，例如五天或 20 小时。\n\n`TimeSpan` 对象在以下属性中存储时间值：\n\
  \n* 天—整数，正负均可\n* 小时—在 -23 到 23 之间的整数\n* 分钟—在 -59 到 59 之间的整数\n* 秒—在 -59 到 59 之间的整数\n\
  * 毫秒—在 -999 到 999 之间的整数\n\n有多种方法可以创建 `TimeSpan` 结构的实例。下面的语句创建一个名为 `tspan` 的 `TimeSpan`\
  \ 实例，其默认值为 0 天、0 小时、0 分钟、0 秒和 0 毫秒：\n\n```csharp\nTimeSpan tspan = new TimeSpan();\n\
  ```\n\n\n\n\n\n你可以像下面的代码示例所示更改单个属性：\n\n```\n TimeSpan tspan = new TimeSpan();\n\
  tspan.Days = 15;\ntspan.Hours = 6;\ntspan.Minutes = 30;\ntspan.Seconds = 10;\ntspan.Milliseconds\
  \ = 500;\n```\n\n在此示例中，`tspan` 对象被设置为 15 天、6 小时、30 分钟、10 秒和 500 毫秒。\n\n当你创建一个 `TimeSpan`\
  \ 对象时，可以选择地使用特定值对其初始化。这里有三种通用格式：\n\n```\n TimeSpan instanceName = new TimeSpan(Hours,\
  \ Minutes, Seconds);\nTimeSpan instanceName = new TimeSpan(Days, Hours, Minutes,\
  \ Seconds);\nTimeSpan instanceName = new TimeSpan(Days, Hours, Minutes, Seconds,\
  \ Milliseconds);\n```\n\n在通用格式中，`Days`、`Hours`、`Minutes`、`Seconds` 和 `Milliseconds`\
  \ 的值为整数。\n\n# 使用 `DateTime` 和 `TimeSpan` 对象进行数学运算\n\n你可以通过以下方式对 `DateTime` 和 `TimeSpan`\
  \ 对象进行数学运算：\n\n* 你可以将一个 `TimeSpan` 添加到 `DateTime` 对象中，以得到比第一个对象的的 `DateTime` 对象。例如，假设我们有一个设置为\
  \ 4 月 5 日的 `DateTime` 对象，还有一个设置为 10 天的 `TimeSpan` 对象。如果我们将 `TimeSpan` 对象添加到 `DateTime`\
  \ 对象中，我们将得到另一个设置为 4 月 15 日的 `DateTime` 对象。\n\n* 你可以从一个 `DateTime` 对象中减去另一个 `DateTime`\
  \ 对象，得到表示两个 `DateTime` 对象之间间隔时间的 `TimeSpan` 对象。例如，假设我们有一个设置为 1 月 20 日的 `DateTime`\
  \ 对象，从中减去另一个设置为 1 月 15 日的 `DateTime` 对象。结果将是一个设置为 5 天的 `TimeSpan` 对象。\n\n下面是如何创建一个表示\
  \ 10 天的 `TimeSpan` 对象，然后将该对象添加到 `DateTime` 对象的示例：\n\n```\n 1 // 为 2019 年 8 月 15\
  \ 日创建一个 DateTime 对象。\n2 DateTime dt = new DateTime(2019, 8, 15);\n3 \n4 // 创建一个\
  \ 10 天的 TimeSpan 对象。\n5 TimeSpan tspan = new TimeSpan(10, 0, 0, 0);\n6 \n7 // 将\
  \ TimeSpan 对象添加到 DateTime 对象中。\n8 DateTime futureDate = dt + tspan;\n```\n\n执行此代码后，`futureDate`\
  \ 对象将被设置为 2019 年 8 月 25 日。\n\n下面的代码示例显示了如何从一个 `DateTime` 对象中减去另一个 `DateTime` 对象。结果是一个表示两个\
  \ `DateTime` 对象之间间隔时间的 `TimeSpan` 对象：\n\n```\n 1 // 创建两个 DateTime 对象。\n2 DateTime\
  \ date1 = new DateTime(2019, 8, 15);\n3 DateTime date2 = new DateTime(2019, 8, 30);\n\
  4 \n5 // 获取日期之间的时间。\n6 TimeSpan tspan = date2 - date1;\n```\n\n执行此代码后，`tspan` 对象将被设置为\
  \ 15 天。你还可以使用几种方法来数学上地调整 `DateTime` 对象的值。\n\n# `DateTime` 数学方法\n\n| 方法 | 描述 |\n\
  | :--- | :--- |\n| `Add` | 通用格式：通用格式下的 `dtObject.Add(tspan)`，`dtObject` 是 `DateTime`\
  \ 对象，`tspan` 是一个 `TimeSpan` 对象。将 `TimeSpan` 对象添加到 `DateTime` 对象中并返回一个新的 `DateTime`\
  \ 对象。 |\n| `AddYears` | 通用格式：通用格式下的 `dtObject.AddYears(years)`，`dtObject` 是 `DateTime`\
  \ 对象，`years` 是一个指定年数的 `int`。将年数添加到 `DateTime` 对象中并返回一个新的 `DateTime` 对象。 |\n| `AddMonths`\
  \ | 通用格式：通用格式下的 `dtObject.AddMonths(months)`，`dtObject` 是 `DateTime` 对象，`months`\
  \ 是一个指定月份数的 `int`。将月份数添加到 `DateTime` 对象中并返回一个新的 `DateTime` 对象。 |\n| `AddDays` |\
  \ 通用格式：通用格式下的 `dtObject.AddDays(days)`，`dtObject` 是 `DateTime` 对象，`days` 是一个指定天数的\
  \ `int`。将天数添加到 `DateTime` 对象中并返回一个新的 `DateTime` 对象。 |\n| `AddHours` | 通用格式：通用格式下的\
  \ `dtObject.AddHours(hours)`，`dtObject` 是 `DateTime` 对象，`hours` 是一个指定小时数的 `int`。将小时数添加到\
  \ `DateTime` 对象中并返回一个新的 `DateTime` 对象。 |\n| `AddMinutes` | 通用格式：通用格式下的 `dtObject.AddMinutes(minutes)`，`dtObject`\
  \ 是 `DateTime` 对象，`minutes` 是一个指定分钟数的 `int`。将分钟数添加到 `DateTime` 对象中并返回一个新的 `DateTime`\
  \ 对象。 |\n| `AddSeconds` | 通用格式：通用格式下的 `dtObject.AddSeconds(seconds)`，`dtObject`\
  \ 是 `DateTime` 对象，`seconds` 是一个指定秒数的 `int`。将秒数添加到 `DateTime` 对象中并返回一个新的 `DateTime`\
  \ 对象。 |\n| `AddMilliseconds` | 通用格式：通用格式下的 `dtObject.AddMilliseconds(milliseconds)`，`dtObject`\
  \ 是 `DateTime` 对象，`milliseconds` 是一个指定毫秒数的 `int`。将毫秒数添加到 `DateTime` 对象中并返回一个新的 `DateTime`\
  \ 对象。 |\n| `Subtract` (版本 1) | 通用格式：通用格式下的 `dtObject1.Subtract(dtObject2)`，`dtObject1`\
  \ 是 `DateTime` 对象，`dtObject2` 是另一个 `DateTime` 对象。从 `dtObject1` 中减去 `dtObject2` 并返回一个新的\
  \ `DateTime` 对象。 |\n| `Subtract` (版本 2) | 通用格式：通用格式下的 `dtObject.Subtract(tspan)`，`dtObject`\
  \ 是 `DateTime` 对象，`tspan` 是 `TimeSpan` 对象。从 `dtObject` 中减去 `tspan` 并返回一个新的 `DateTime`\
  \ 对象。 |\n\n# 检查\n\n1. 9.9 如果你不初始化 `DateTime` 对象，它将持有什么默认日期和时间？\n2. 9.10 创建名为 `dt`\
