  \ 将包含一个元素，其键为字符串“robot”，值为一个包含数字 7、18、94 和 138 的列表。\n\n一旦构建了 `Dictionary`，程序应该创建另一个名为单词索引的文本文件，列出\
  \ `Dictionary` 的内容。单词索引文件应该包含存储在 `Dictionary` 中作为键的单词的字母顺序列表，以及这些单词在原始文件中出现的行号。[图\
