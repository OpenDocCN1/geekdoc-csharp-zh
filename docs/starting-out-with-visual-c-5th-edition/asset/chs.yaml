  \ `Brake` 按钮，点击它时会调用 `Brake` 方法并显示汽车的当前速度。\n\n## 3. 信息类\n创建一个类，在属性中存储以下个人数据：姓名、地址、年龄和电话号码。在一个应用程序中演示该类，创建三个类的实例。一个实例存储你的信息，另外两个存储朋友或家庭成员的信息。在应用程序表单上显示每个对象的属性。\n\
