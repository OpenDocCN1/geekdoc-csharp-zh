  \n### Concept\n\n`ImageList` 控件允许你存储图像集合。运行时，你可以从 `ImageList` 控件检索图像并显示在 `PictureBox`\
  \ 控件中。\n\n`ImageList` 控件是一个包含多个图像的容器。正如其名称，它是图像列表。你可以使用索引从 `ImageList` 控件检索图像并显示在\
  \ `PictureBox` 控件中。\n\n当你计划在应用程序中使用 `ImageList` 控件时，遵循以下指南：\n\n*   存储在 `ImageList`\
  \ 中的所有图像都应该是相同的大小。\n*   存储在 `ImageList` 中的图像大小不能超过 256 比 256 像素。\n*   存储在 `ImageList`\
  \ 中的所有图像都应该是相同的格式（.bmp、.jpg 等）。\n\n尽管这些指南看起来很有局限性，但请记住 `ImageList` 控件设计用于存储小型图像（如图标或缩略图）。它们也适用于显示卡牌的游戏程序。\n\
  \n你可以在*工具箱*的*组件*部分找到 `ImageList` 控件。当你双击*工具箱*中的 `ImageList` 工具时，会在*设计器*底部的组件区域创建一个\
  \ `ImageList` 控件。（`ImageList` 控件不会出现在表单上。）图 7-44 显示了一个示例。当你创建 `ImageList` 控件时，它们会被赋予默认名称，如\
  \ `imageList1`、`imageList2` 等。\n\n\n\n\n\n在创建 `ImageList` 控件后，你应当将其 `ImageSize`\
  \ 属性设置为计划存储在控件中的图像尺寸。默认大小为 `16,16`。你可以将 `ImageSize` 属性设置为从 `0,0` 到 `256,256` 之间的任何值。（如果\
  \ `ImageSize` 属性的值与存储在控件中的图像尺寸不匹配，在显示图像时图像将会失真。）\n\n然后，你可以使用 `Images` 属性向控件添加图像。在\
  \ `Properties` 窗口中，点击 `Images` 属性旁出现的省略号按钮 (![](img/EllipsesButton.png))。这将显示如图\
  \ 7-45 所示的 `Images Collection Editor` 窗口。点击 `Add` 按钮，会弹出 `Open` 对话框。使用该对话框找到并选择你想添加到\
  \ `ImageList` 控件的图像文件（或多个图像文件）。\n\n# 图 7-45  集合编辑器窗口\n\n![截图显示了设计器中用于成员和属性的 Images\
  \ Collection Editor 窗口](img/FG_07_045.png)图 7-45 完整替代文本\n\n图 7-46 显示了添加四张图像后的 `Images\
  \ Collection Editor` 窗口。在 `Members` 列表中显示的图像名称为 `2_Clubs.bmp`、`2_Diamonds.bmp`、`2_Hearts.bmp`\
  \ 和 `2_Spades.bmp`。注意每个图像名称旁边都出现了一个索引值。稍后你将使用该索引值从控件中检索图像。当你添加了所有需要的图像后，点击 `OK`\
