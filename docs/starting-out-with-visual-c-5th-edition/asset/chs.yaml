  4. 1.30 什么是事件驱动程序？\n\n## 1.6 对象\n\n\n对象是将数据和操作结合的结构。在 GUI 中，对象通过图形元素表示。\n\n- **字段\
  \ (Fields)**：存储在对象内部。\n- **方法 (Methods)**：对象可以执行的操作。\n- **属性 (Properties)**：可以访问或修改的对象的特征。\n\
  \n\n\n\n表单、标签、文本框和按钮只是你将在 `C#` 中学习使用的对象中的少数几个。在学习本书的过程中，你将创建包含许多不同类型对象的应用程序。\n\n\
  ## 可见对象与不可见对象\n\n在程序的 GUI（图形用户界面）中可见的对象通常被称为控件。我们可以说图 1-24 所示表单包含了两个 `Label` 控件、两个\
  \ `TextBox` 控件和两个 `Button` 控件。当一个对象被称为控件时，它仅仅意味着该对象在程序的 GUI 中起了作用。\n\n\n## 类：对象的来源\n\
  \n对象非常有用，但它们并不会凭空出现在你的程序中。在使用特定类型的对象之前，必须在内存中创建该对象。而在内存中创建对象之前，你必须为该对象定义一个“类”（class）。\n\
  \n类是描述特定类型对象的代码。它指定了对象可以可以包含的数据（对象的字段和属性）以及对象可以执行的操作（对象的方法）。随着本书的深入，你将学习到更多关于类的知识，但现在，只需将类看作可以用于创建特定类型对象的代码“蓝图”即可。\n\
  \n## .NET Framework\n`C#` 是一种非常流行的编程语言，但有很多事情是它本身无法完成的。例如，你不能仅用 `C#` 来创建 GUI、从文件中读取数据、处理数据库或程序通常需要执行的许多其他工作。`C#`\
  \ 仅提供了构建程序所需的各种关键字和操作符。\n\n因此，如果 `C#` 语言没有提供创建 GUI 和执行许多其他高级操作所需的类和其他代码，那么这些类和代码是从哪里来的呢？答案是\
  \ `.NET Framework`。`.NET Framework` 是一个类和其他代码的集合，可以与 `C#` 等编程语言一起使用，为 Windows 操作系统创建程序。例如，`.NET\
  \ Framework` 提供了创建 `Forms`、`TextBoxBoxes`、`Labels`、`Buttons` 以及许多其他类型的类。\n\n当你使用\
  \ `Visual C#` 编写程序时，你正在结合使用 `C#` 语言和 `.NET Framework`。学习本书的过程中，你不仅会学习 `C#`，还将学习由\
  \ `.NET Framework` 提供的许多类和其他特性。\n\n## 编写你自己的类\n`.NET Framework` 提供了许多可供程序直接使用的预写类。然而，在某些情况下，你可能希望有一个对象来执行特定任务，而\
  \ `.NET Framework` 中并不存在这样的类。这并不是问题，因为在 `C#` 中，你可以编写自己的类，拥有任何情况下都所需的特定字段、属性和方法。在第\
  \ 10 章中，你将学习为程序所需的特定对象创建类。\n\n# 检查点\n\n1. 1.31 什么是对象？\n2. 1.32 通过组合集合来创建程序使用的是什么类型的语言？\n\
