  * 一个 `string` 扩展方法，返回反后的 `string`。\n* 一个 `string` 扩展方法，统计字符串中的单词数。\n\n# 第 12 章数据库\n\
  \n## 12.1 数据库管理系统简介\n\n### 概念\n\n数据库管理系统 (DBMS) 是用于管理大量数据的软件。\n\n如果应用程序只需要存储极少量数据，传统文件效果良好。然而，当必须存储和处理大量数据时，这些类型的文件并不实用。许多企业在文件中保留了数十万甚至数百万个数据项。当传统文件包含这么多数据时，搜索、插入和删除等简单操作就会变得繁琐且低效。\n\
  \n在开发处理大量数据的应用程序时，大多数开发者倾向于使用数据库管理系统。数据库管理系统 (DBMS) 是专门设计用于以组织且高效的方式存储、检索和处理大量数据的软件。一旦使用数据库管理系统存储了数据，可以使用\
  \ C# 或语言编写应用程序与 DBMS 通信。应用程序不是直接检索或处理数据，而是向 DBMS 发送指令。DBMS 执行这些指令并将结果返回给应用程序，如 图\
  \ 12-1 所示。\n\n# 图 12-1 与 DBMS 交互并处理数据的 C# 应用程序\n\n![插图显示了与 DBMS 工作的应用程序的分层性质。](img/FG_12_001.png)\
  \ 图 12-1 完整备用文本\n\n尽管 图 12-1 是简化的，但它说明了与 DBMS 工作的应用程序的分层性质。软件的最顶层（在本例中，用 C# 编写）与用户交互。它还向下一层软件（即\
  \ DBMS）发送指令。DBMS 直接与数据交互，并将操作结果返回给应用程序。\n\n假设一家公司将其所有产品记录存储在数据库中。该公司有一个 C# 应用程序，允许用户通过输入产品\
  \ ID 查找任何产品的信息。C# 应用程序指示 DBMS 检索指定产品 ID 的记录。DBMS 检索产品记录并将数据传回 C# 应用程序。C# 应用程序将数据显示给用户。\n\
  \n这种分层软件开发方法的优势是，C# 程序员不需要知道数据的物理结构。他或她只需要知道如何 DBMS 交互。DBMS 处理数据的实际读取、写入和搜索。\n\n\
  ## SQL Server Express 版\n\n今天有很多 DBMS，Visual C# 可以与其中的许多系统交互。其中一些流行的有 Microsoft\
  \ SQL Server、Oracle、DB2、MySQL 和 Microsoft Access。在本书中，我们使用 Microsoft SQL Server\
  \ Express 版，因为它在安装 Visual Studio 时会自动安装在你的系统中。\n\n# 检查点\n\n1. 12.1 什么是数据库管理系统 (DBMS)？\n\
  2. 12.2 为什么大多数企业使用 DBMS 存储数据，而不是创建自己的文本文件存储数据？\n3. 12.3 在开发使用 DBMS 存储和处理数据的 C# 应用程序时，为什么程序员不需要知道物理结构的特定细节？\n\
  \n## 12.2 表、行和列\n\n### 概念\n\n存储在数据库中的数据被组织成表、行和列。\n\n数据库管理系统在数据库中存储数据。存储在数据库中的数据被组织成一个或多个表。每个表包含一组相关数据。存储在表中的数据被组织成行和列。一行是关于单个项目的完整信息集。存储在行中的数据被划分为列。每列包含关于该项目的一个单独信息。\n\
  \n例如，假设我们正在开发一个电话簿应用程序，并希望在数据库中存储姓名和电话号码列表。\n\n| Katie Allen | 555-1234 |\n| Jill\
  \ Ammons | 555-5678 |\n| Kevin Brown | 555-9012 |\n| Elisa Garcia | 555-3456 |\n\
  | Jeff Jenkins | 555-7890 |\n| Leo Killian | 555-1122 |\n| Marcia Potemkin | 555-3344\
  \ |\n| Kelsey Rose | 555-5566 |\n\n思考一下我们将这些数据存储为行和列时它将变成什么样。我们将姓名放在一列，电话号码放在另一列。那么，每一行都包含关于一个人的数据。图\
  \ 12-2 显示了 Kevin 的姓名和电话号码。\n\n# 图 12-2 表\n\n![表格显示了姓名和电话号码。](img/FG_12_001.png)\
  \ 图 12-2 完整备用文本\n\n当我们创建一个存储这些信息的数据库表时，以类似的方式组织它。我们给表起名，例如 `Person`。在表中，我们为姓名创建一个列，为电话号码创建一个列。表中的每个列必须有一个名称，因此我们分别命名为\
  \ `Name` 和 `Phone`。\n\n## 列类型\n\n创建数据库表时，必须为列指定数据类型。然而，你选择的数据类型不是 C# 数据类型。它们是 DBMS\
  \ 提供的数据类型。在书中，我们使用 SQL Server，因此我们将从它提供的类型中进行选择。表 12-1 列出了一些 Microsoft SQL 数据类型，并显示了与其通常兼容的\
  \ C# 数据类型。\n\n# 表 12-1 一些 Microsoft SQL 数据类型\n\n| SQL Server 数据类型 | 说明 | 对应的 C#\
  \ 或 .NET 框架数据类型 |\n| --- | --- | --- |\n| `bit` | 真假值 | `bool` |\n| `datetime` |\
  \ 日期和时间 | `DateTime` |\n| `decimal(`*t`,` *d*`)` | 具有 *t* 位数字且小数点后有 *d* 位的小数 | `decimal`\
  \ |\n| `float` | 实数 | `double` |\n| `int` | 整数 | `int` |\n| `money` | 代表货币的值 | `decimal`\
  \ |\n| `nchar(`*n*`)` | 最大长度为 *n* 的固定长度 Unicode 字符串 | `string` |\n| `nvarchar(`*n*`)`\
  \ | 最大长度为 *n* 的可变长度 Unicode 字符串 | `string` |\n\n### 注意\n\n[表 12-1] 显示了你在学习期间最常用的数据类型。然而，这些只是\
  \ Microsoft SQL Server 提供的数据类型的一小部分。\n\n\n\n\n\n`nchar(n)` 和 `nvarchar(n)` 数据类型都用于存储字符串。`nchar(n)`\
  \ 列是固定长度的，在数据库中始终会使用 `n` 个字符的空间。`nvarchar(n)` 列是变长度的，它在数据库中使用的空间将足够容纳其所持的数据，最多为\
  \ `n` 个字符。\n\n# 主键\n\n大多数数据库表都有主键，主键是用来用于标识特定行的列。被指定为主键的列必须为每一行包含一个唯一的值。以下是一些示例：\n\
  \n*   一个存储员工数据的表，其中一列存储员工 ID 。由于每个员工的 ID 码都是唯一的，因此该列可以作为主键。\n*   一个存储产品数据的表，其中一列存储产品编号。由于每个产品都有唯一的内编号，因此该列可以作为主键。\n\
  *   一个存储发票数据的表，其中一列存储发票号码。由于每张发票都有唯一的发票号码，因此该列可以作为主键。\n\n# 标识标识列\n\n有时，你想存储在表中的数据并不包含任何可以作为主键的唯一项。例如，在我们之前描述的\
  \ `Person` 表中，`Name` 列和 `Phone` 列都不包含唯一数据。两个人可能有相同的名字，因此一个名字可能会在 `Name` 列中出现多次。同样，多个人可能共享同一个电话号码，因此电话号码可能会在\
  \ `Phone` 列中出现多次。因此，你无法使用 `Name` 列或 `Phone` 列作为主键。\n\n在这种情况下，有必要专门创建一个标识列（identity\
  \ column）来作为主键。标识列是由 DBMS 生成包含唯一值的列。标识列通常包含整数。每当向表中添加新行时，DBMS 都会自动为该行的标识列分配一个唯一的值。\n\
  \n例如，在设计我们之前讨论的 `Person` 表时，我们可以创建一个名为 `PersonID` 的 `int` 列，并将该列指定为标识列。（结果是，DBMS\
  \ 为每一行的 `PersonID` 列 分配一个唯一的整数值。）然后，我们可以将 `PersonID` 列指定为表的主键。图 12-3 显示了我们创建并输入数据后\
  \ `Person` 表的示例。\n\n# 图 12-3 填充了数据的 `Person` 表\n\n![显示了已输入数据的 Person 表截图。](img/FG_12_003.png)\n\
  图 12-3 完整备用文本\n\n# 允许空值\n\n如果某列不包含数据，则称为空（null）。有时，列留空是可以的。然而，某些列（例如主键）必须包含值。当你设计表时，可以指定某列是否允许为空。如果某个特定列不允许为空，那么每当你向表中添加一行数据时，DBMS\
  \ 都会要求为该列提供值。留该列为空会导致错误。\n\n# 检查点\n\n1. 12.4 描述以下每个术语：\n    1. `database`（数据库）\n\
  \    2. `table`（表）\n    3. `row`（行）\n    4. `column`（列）\n2. 12.5 将 Microsoft SQL\
  \ Server 数据类型与兼容的 C# 数据类型匹配。\n    1. `bit`\n    2. `datetime`\n    3. `float`\n\
  \    4. `int`\n    5. `money`\n    6. `nchar`\n    1. `double`\n    2. `int`\n \
  \   3. `bool`\n    4. `DateTime`\n    5. `string`\n    6. `decimal`\n3. 12.6 主键的目的是什么？\n\
  4. 12.7 什么是标识列？\n5. 12.8 如果某个特定列不允许为空，如果该列留空的结果是什么？\n\n# 12.3 在 Visual Studio 中创建数据库\n\
  \n### 概念\n\n.NET 应用程序使用分层排列多个组件连接到数据库。Visual Studio 提供了工具，允许你创建数据库并配置应用程序连接到它所需的各种组件。\n\
  \n# 将应用程序连接到数据库\n\n.NET 应用程序需要一组特殊组件，使其能够连接并与数据库工作。这些组件层层堆叠，如图 12-4 所示。\n\n# 图 12-4\
  \ 应用程序使用的组件\n\n![插图显示了应用程序使用的组件。](img/FG_12_004)\n图 12-4 完整备用文本\n\n以下是分层的概述：\n*\
  \   `Data Source`（数据源）：正如其名，数据源是应用程序与之工作的源。\n*   `Table Adapter`（表适配器）：表适配器连接表并可以更新表。\n\
  *   `Dataset`（数据集）：数据集从表适配器获取表的副本并将其内存内存中。\n*   `Binding Source`（绑定源）：绑定源是将界面控件连接到数据集。\n\
  \n幸运的是，Visual Studio 提供了向导，可以轻松创建这些组件。在教程 12-1 中，你启动了一个新的 C# 项目并执行以下操作：\n*   创建\
  \ SQL Server 数据库\n*   设计表\n*   向表添加数据\n\n# 数据库文件\n\n当你使用 Visual Studio 创建数据库时（如在教程\
  \ 12-1](#fileP700101601200000000000000000A0EB.xhtml_P7001016012)中所示），数据库文件将创建在项目文件夹中。例如，图\
  \ 12-23 显示了 `.mdf` 数据库文件是如何创建的。\n\n![截图显示了电话簿应用程序的项目文件夹，其中包含 .mdf 数据库文件。](img/FG_12_023.png)\n\
  # 图 12-23 .mdf 数据库文件的位置\n\n### 注意\n\n当你创建 SQL Server 数据库时，还会看到一个以 `.LDF` 结尾的文件。例如，在图\
  \ 12-23 中，你看到一个名为 `Person_log.LDF` 的文件。这是一个事务日志文件。SQL Server DBMS 使用它记录你对数据库执行的所有操作。\n\
  \n# 检查点\n\n1. 12.9 按层顺序列出允许应用程序连接并与数据库工作的 .NET 组件。从应用程序作为顶层开始列表。\n2. 12.10 表适配器和数据源组件之间是什么关系？\n\
  3. 12.11 使用什么组件将界面控件连接到数据集？\n\n# 12.4 DataGridView 控件\n\n### 概念\n\nDataGridView\
  \ 控件可以在可滚动网格中显示数据库表。\n\n\n\n\n\n数据绑定控件（data-bound control）是一种连接到数据源的用户界面控件。例如，数据绑定控件可以连接到数据库表中的某列。数据绑定控件会自动显示来自数据源的数据，并可用于更改它们所绑定的数据。最简单且强大的数据绑定控件之一是\
  \ `DataGridView` 控件。`DataGridView` 控件可以在表单上的可滚动网格中显示整个数据库表。\n\n在教程 12-2 中，你继续之前在教程\
  \ 12-1 中开始的*通讯录*（Phone Book）应用程序。你将应用程序表单连接到 `Phonelist.mdf` 数据库，并添加了一个 `DataGridView`\
  \ 控件用于查看和更新 `Person` 表。\n\n# 自动生成代码\n\n当你将数据绑定控件（如 `DataGridView`）放在表单上时，Visual\
  \ Studio 会在后台完成大量工作以使控件正常运行。事实上，你在教程 12-2 中甚至没有写一行代码就完成了应用程序完成！但是，如果你在代码编辑器中打开表单，你将看到\
  \ Visual Studio 生成了一些代码，如程序 12-1 所示。\n\nVisual Studio 在第 20–26 行添加了一个事件处理程序，当用户点击导航栏上的*保存*（Save）按钮时执行。简而言之，该方法中的语句会将对\
  \ `DataGridView` 控件进行的任何更改应用于数据集，然后将数据集保存到数据库。\n\nVisual Studio 还在第 28–33 行为表单添加了\
  \ `Load` 事件处理程序。在第 31 行中，该事件处理程序调用了表适配器（table adapter）的 `Fill` 方法，并将 `Person` 表（在数据集中）的引用作为参数传递。此语句会导致表适配器从数据库加载数据到数据集中。\n\
