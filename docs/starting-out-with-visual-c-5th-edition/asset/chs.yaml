  \ 3 | III |\n| 4 | IV |\n| 5 | V |\n| 6 | VI |\n| 7 | VII |\n| 8 | VIII |\n| 9 |\
  \ IX |\n| 10 | X |\n\n## 2. 质量与重量\n\n科学家以千克（kg）测量对象的质量，以牛顿（N）测量重量。如果你知道对象的质量，可以使用以下公式计算其以牛顿为单位重量：\n\
  \n`Weight = Mass × 9.8`\n\n创建一个应用程序让用户输入对象的质量然后计算其重量。如果物体重量超过 1000 牛顿，显示一条表示太太重的消息。如果物体重量小于\
  \ 10 牛顿，显示一条表示太轻的消息。\n\n## 3. 魔法日期\n\n1960 年 6 月 10 日是特殊的，因为当按照以下格式书写时，月份乘以日期等于年份：\n\
  \n`6/10/60`\n\n创建一个应用程序让用户输入月份（数字形式）、日期和两位数的年份。程序应该判断月份乘以日期是否等于年份。如果是，它应该显示一条消息说该日期是魔法日期。否则，应该显示一条消息说该日期不是。\n\
  \n## 4. 调色器\n\n红、蓝、黄被称为原色，因为它们不能通过混合其他颜色产生。当你混合原色时，你会得到二次色：\n\n- 混合红色和蓝色得到紫色。\n\
  - 混合红色和黄色得到橙色。\n- 混合蓝色和黄色得到绿色。\n\n创建一个应用程序让用户从 `Radio` 按钮选择两种原色。当用户点击 `Mix` 按钮时，表的背景应变为得到的颜色。\n\
  \n## 5. 距离转换器\n\n在英制单位系统中，1 码等于 3 英尺，1 英尺等于 12 英寸。使用这些信息创建一个应用程序，允许用户在英寸、英尺和码之间进行距离转换。用户在\
  \ `TextBox` 中输入距离，并使用 `ListBox` 控件选择转换的源单位目标单位。\n\n## 6. 书俱乐部积分\n\nSerendipity Booksellers\
