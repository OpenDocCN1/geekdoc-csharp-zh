  4. 成为一个抽象类\n\n# 判断对错\n\n1. 基类从派生类继承字段、属性和方法。\n2. 多态允许基类类型的类变量引用基类类型或派生类类型的对象。\n\
  3. 基类中的属性不能像方法那样可以被重写。\n4. 基类引用变量可以引用任何派生自基类的类对象。\n5. 尝试使用 `new` 运算符来实例化抽象类的语句将无法编译。\n\
  6. 不用于实例化而仅用作基类的类被称为具体类。\n7. 当抽象属性出现在类中时，在任何派生自该类的中都必须重写。\n8. 要编写扩展方法，你必须继承你正在扩展的那个类。\n\
