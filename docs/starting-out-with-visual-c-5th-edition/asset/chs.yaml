  \ price）和加成百分率（markup percentage）的参数变量。编写该方法，使加成百分率的默认参数 50%。\n\n4. 检查以下方法标头；然后编写该方法的示例调用。\n\
  \n```cs\nprivate void ResetValue(ref int value)\n```\n\n5. 程序包含以下带有返回值的方法：\n\n```cs\n\
  private int Square(int value)\n{\n    return value * value;\n}\n```\n\n编写一条语句，将值\
  \ `10` 作为参数传递给该方法，并将其返回值赋值给变量 `result`。\n\n# 编程题\n\n## 1. 零售价计算器\n\n创建一个应用程序，允许用户输入商品的批发成本及其加成百分率。然后它应该显示商品的零售价。例如：\n\
  \n* 如果一个商品的批发成本为 $5.00 且加成百分率为 100%，则该商品的零售价为 $10.00。\n* 如果一个商品的批发成本为 $5.00 且加成百分率为\
  \ 50%，则该商品的零售价为 $7.50。\n\n程序应该有一个名为 `CalculateRetail` 的方法，该方法接收批发成本和加成百分率作为参数，并返回商品的零售价。\n\
  \n## 2. 下落距离\n\n当物体因重力下落时，可以使用以下公式确定物体在特定时间内的下落距离：\n\n$$d = \\frac{1}{2}\\ gt^{2}$$\n\
  \n公式中的变量如下：`d` 是以米为单位的距离，`g` 为 9.8，`t` 是物体下落的秒。创建一个应用程序，允许用户输入物体下落的时间，然后显示物体下落的距离。应用程序应该有一个名为\
  \ `FallingDistance` 的方法。`FallingDistance` 方法接受对象的下落时间（秒）作为参数。该方法应返回物体在该时间段内下落的米数距离。\n\
  \n## 3. 动能\n\n在物理学中，运动中的物体具有动能。可以使用以下公式确定运动物体的动能：\n\n$$\\text{KE} = \\frac{1}{2}\\\
  \ mv^{2}$$\n\n在公式中，`KE` 是动能，`m` 是以公斤为单位的物体质量，`v` 是以米/秒为单位的物体速度。创建一个应用程序允许用户输入对象的质量和速度，然后显示对象的动能。应用程序应该有一个名为\
  \ `KineticEnergy` 的方法，它接受对象的质量（公斤）和速度（米/秒）作为参数。该方法返回物体拥有的动能值。\n\n## 4. 脂肪和碳水化合物的热量\n\
  \n一位在健身俱乐部工作的营养师通过评估成员的饮食来帮助他们。作为评估的一部分，她询问成员每天消耗的脂肪克数和碳水化合物克数。然后，她使用以下公式计算脂肪产生的卡路里：\n\
  \n`Calories from fat` = `Fat grams` × 9\n\n接下来，她使用以下公式计算碳水化合物产生的卡路里：\n\n`Calories\
  \ from carbs` = `Carbs grams` × 4\n\n创建一个执行这些计算的应用程序。在应用程序中，你应该有以下方法：\n\n* `FatCalories`–此方法应接受脂肪克数作为参数，并返回该数量脂肪的卡路里。\n\
  * `CarbCalories`–此方法应接受碳水化合物克数作为参数，并返回该数量碳水化合物的卡路里。\n\n## 5. Joe 的汽车 (Joe’s Automotive)\n\
  \nJoe 汽车提供以下常规维护服务：\n\n* 换油—$26.00\n* 润滑—$18.00\n* 散热器清洗—$30.00\n* 变速箱清洗—$80.00\n\
  * 检查—$15.00\n* 消声器更换—$100.00\n* 轮胎换位—$20.00\n\nJoe 还提供其他非常规服务，并收取零件和人工费（每小时 $20）。创建一个应用程序，显示客户访问\
  \ Joe 汽车店的总费用。表单应当如下。\n\n\n\n\n\n`n` 是你计划让资金留在账户中的`年数`。\n\n编写一个名为 `PresentValue`\
  \ 的方法来执行此计算。该方法应接受未来值、年利率和年数作为参数。它应该返回现值，即你今天需要存的金额。在一个应用程序中演示该方法，让用户可以实验公式各项项的不同值。\n\
  \n## 8. 质数\n\n质数是一个只能被自身和 1 整除的数字。例如，数字 5 是质数，因为它只能被 1 和 5 整除。然而，数字 6 不是质数，因为它可以分别被\
  \ 1、2、3 和 6 整除。编写一个名为 `IsPrime` 的布尔类型方法，该方法接受一个整数作为参数，如果该参数是质数则返回 `true`，否则返回 `false`。在应用程序中使用该方法，让用户输入一个数字，然后显示一条消息指示该数字是否为质数。\n\
  \n### 提示\n\n记住 `%` 运算符将其中一个数字除以另一个数字，并返回除法的余数。在如 `num1 % num2` 这样的表达式中，如果 `num1`\
  \ 能被 `num2` 整除，则 `%` 运算符返回 0。\n\n## 9. 质数列表\n\n此练习假设你已经在编程问题 8 中编写了 `IsPrime` 方法。创建另一个应用程序，使用该方法在列表框中显示从\
  \ 1 到 100 之间的所有质数。程序应该有一个循环来调用 `IsPrime` 方法。\n\n## 10. 剪刀石头布游戏\n\n创建一个应用程序，让用户与电脑玩剪刀石头布游戏。该程序的工作原理如下：\n\
  \n1. 当程序开始时，生成一个 1 到 3 之间的随机数。如果数字是 1，则电脑选择了石头；如果数字是 2，则电脑选择了纸；如果数字是 3，则电脑选择了剪刀。（先不要显示的选择。）\n\
  \n2. 用户选择他的石头、纸或剪刀。为了获取此输入，你可以使用 `Button` 控件，或使用可点击的 `PictureBox` 控件，显示一些你在学生示例文件中找到的艺术作品。\n\
  \n3. 显示电脑的选择。\n\n4. 根据以下规则选择胜者：\n\n    * 如果一个玩家选择石头而另一个玩家选择剪刀，则石头胜。（石头压碎剪刀。）\n \
  \   * 如果一个玩家选择剪刀而另一个玩家选择纸，则剪刀胜。（剪刀剪开纸。）\n    * 如果一个玩家选择纸而另一个玩家选择石头，则纸胜。（纸包住石头。）\n\
  \    * 如果两个玩家都做出相同的选择，则必须重新游戏以决定胜者。\n\n务必将程序模块化为执行每个主要任务的方法。\n\n# 第 7 章 数组和列表\n\n\
  ## 7.1 值类型和引用类型\n\n### 概念\n\nC# 和 .NET Framework 中的数据类型分为两类：值类型和引用类型。\n\n在本章中，你将获得更多处理对象的经验。具体来说，你将处理数组和集合，这些是存储数据组的对象。在我们进入创建和操作这些对象的细节之前，了解对象是如何存储在内存中的将对你很有帮助。在本节中，我们讨论了\
  \ .NET Framework 内部存储不同类型对象的方式。结果，你将更好地理解本章以及后续章节介绍的概念。\n\nC# 中的所有数据类型以及底层的 .NET\
  \ Framework 都分为两类：值类型和引用类型。在你目前为止使用的 C# 数据类型中，以下是值类型：`int`、`double`、`decimal` 和\
  \ `bool`。（除了这些还有其他值类型，但这些是我们在书中关注的。）\n\n当你声明一个值类型变量时，编译器会留出或分配一段足够容纳该变量的内存。例如，查看以下变量声明：\n\
  \n```c\nint wholeNumber;\ndouble realNumber;\ndecimal moneyNumber;\n```\n\n回想第 3\
  \ 章，`int` 使用 32 位内存（4 字节），`double` 使用 64 位内存（8 字节），而 `decimal` 使用 128 位内存（16 字节）。这些声明语句会导致内存如图\
  \ 7-1 所示被分配。\n\n# 图 7-1 分配的内存\n\n![插图显示了使用声明语句分配内存。](img/FG_07_001.png)\n图 7-1 完整替代文本\n\
  \n为值类型变量分配的内存是存储分配给该变量的值的实际位置。例如，假设我们使用以下语句为图 7-1 所示的变量赋值：\n\n```csharp\nwholeNumber\
  \ = 99;\nrealNumber = 123.45;\nmoneyNumber = 800.0m;\n```\n\n图 7-2 显示了赋值的值是如何存储在每个变量的内存位置中的。\n\
  \n# 图 7-2 赋值给变量的值\n\n![插图显示了每个变量分配的内存。](img/FG_07_002.png)\n图 7-2 完整替代文本\n\n从这些插图中可以看出，值类型非常简单直观。当你处理值类型时，你正在使用一个持有数据的变量。\n\
  \n这与引用类型的工作方式不同。当你处理引用类型时，你正在使用两个东西：\n\n* 一个在内存中创建的对象\n* 一个引用该对象的变量\n\n在内存中创建的对象持有某种数据并执行某种操作。（具体是什么数据和操作，取决于它是一个什么样的对象。）为了操作该对象，你需要某种方式来引用它。这就是变量派上用场的地方。变量并不持有你的程序将处理的实际数据。相反，它持有一个被称为“引用”的特殊值，该值将变量链接到对象。当你想操作该对象时，使用引用它的变量。\n\
  \n用于引用对象的变量通常称为引用变量。引用变量只能用于引用对象。图 7-3 展示了内存中创建的两个对象，每个对象都被一个变量引用。\n\n# 图 7-3 被变量引用的两个对象\n\
  \n![插图显示了被变量引用的对象。](img/FG_07_003.png)\n图 7-3 完整替代文本\n\n为了理解引用变量和对象如何协作，想象放风筝。为了放风筝，你需要一根连接在上面的线。当风筝飞在空中时，你使用线来抓住风筝并控制它。这与对象与引用它的变量之间的关系相似。如图\
  \ 7-4 所示，对象就像风筝，而引用对象的变量就像线轴。\n\n# 图 7-4 风筝与线的比喻\n\n![图表说明了对象与引用变量之间的关系。](img/FG_07_004.png)\n\
  图 7-4 完整替代文本\n\n创建引用类型对象通常需要以下两个步骤：\n\n\n\n\n\n1. 你声明一个引用变量。\n2. 你创建一个对象并将其与引用变量关联。\n\
  \n在执行这些步骤后，你就可以使用引用变量来操作该对象。让我们来看一个你已经学过的示例：创建 `Random` 类的对象。回想第 5 章中的内容，`Random`\
  \ 类允许你的程序生成随机数。以下是如何从 `Random` 类创建对象的示例：\n\n```\nRandom rand = new Random();\n```\n\
  \n让我们来看此此语句的不同组成部分：\n\n*   语句的第一部分出现在 `=` 运算符的左侧，内容为 `Random rand`。这声明了一个名为 `rand`\
  \ 的变量，该变量可以用于引用 `Random` 类型的对象。\n*   语句的第二部分出现在 `=` 运算符的右侧，内容为 `new Random()`。`new`\
  \ 运算符在内存中创建一个对象并返回该对象的引用。因此，表达式 `new Random()` 创建了一个来自 `Random` 类的对象，并返回该对象的引用。\n\
  *   `=` 运算符将 `new` 运算符返回的引用赋值给 `rand` 变量。\n\n在该语句执行后，`rand` 变量将引用一个 `Random` 对象，如图\
  \ 7-5 所示。随后，可以使用 `rand` 变量对该对象执行操作，例如生成随机数。\n\n# 图 7-5 `rand` 变量引用一个 `Random` 对象\n\
  \n![一张图说明了 rand 变量引用一个随机对象。一个标记为“rand”的小框通过一个向右的箭头连接到一个标记为“Random object”的椭圆形框。](img/FG_07_005.png)\n\
