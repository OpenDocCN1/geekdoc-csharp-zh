  \   3. 表描述文件\n    4. DBMS 协议文件\n\n# 判断对错\n1. 在开发处理大量量数据的应用程序时，大多数开发者倾向于使用传统文件。\n\
  2. DBMS 直接处理数据，并将操作结果传回给应用程序。\n3. 存储在数据库中的数据被组织成一个或多个表。\n4. 表中的每一列都必须有一个名称。\n5.\
  \ 当你创建数据库表时，选择的数据类型是 C# 数据类型。\n6. 在处理数据库表中的数据时，指定为主键的列必须为每一行持有一个唯一值。\n7. 如果数据库表中的某列没有数据，则称其为空（null）。\n\
  8. 应用程序直接操作数据库，修改行、添加新行等。\n9. 详情视图（Details view）不是一次显示多行，而是让用户一次查看一行。\n10. SQL 是一种可以编写数据密集型应用程序的语言。\n\
  11. SQL 中的字符串比较是区分大小写的。\n\n# 简答\n1. 在什么情况下，传统文件对于存储数据效果良好？\n2. 简述与 DBMS 操作的应用程序的分层性质。\n\
