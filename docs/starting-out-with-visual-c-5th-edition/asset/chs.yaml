  ## 3.12 使用调试器定位逻辑错误\n\n### 概念\n\nVisual Studio 调试器允许你暂停程序，然后逐条执行语句。在每条语句执行后，你可以检查变量的内容和属性值。\n\
  \n逻辑错误是一种不会阻止应用程序运行但会导致应用程序产生错误结果的错误。数学错误、将值赋值给错误的变量或给变量分配错误的值都是逻辑错误的示例。逻辑错误可能很难找到。发现和修复逻辑错误通常需要程序员花费一些侦探性的工作。幸运的是，Visual\
  \ Studio 为你提供了调试工具，使定位逻辑错误变得更加简单。\n\nVisual Studio 允许你在程序代码中设置断点。断点是你在源代码中选择的一行。当应用程序运行并到达断点时，应用程序将暂停并进入中断模式。在应用程序暂停期间，你可以检查变量的内容和存储在某些控件属性中的值。\n\
  \n一旦应用程序的执行被断点暂停，Visual Studio 允许你单步执行应用程序的代码。这意味着应用程序的语句会在你的控制下逐条执行。在每条语句执行后，你可以检查变量和属性值。此过程允许你识别导致错误的代码行或代码行。在教程\
  \ 3.6 中，你单步执行了应用程序的代码。\n\n### 工具栏中的调试命令\n\nVisual Studio 提供了一个用于调试命令的工具栏，如图 3-46\
