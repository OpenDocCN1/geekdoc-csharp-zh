  \n6. 4.17 编写一个 `if` 语句，如果数字在 0-200 的范围之外，则显示“该数字不接受”。\n\n# 4.5 `bool` 变量与标志\n\n\
  # Concept\n\n你可以将 `true` 和 `false` 存储在通常用于标志的 `bool` 变量中。C# 语言提供了 `bool` 类型，你可以用它创建存储\
  \ `true` 或 `false` 的变量。这是一个 `bool` 变量定义的示例：\n\n```\nbool grandMaster;\n```\n\n这声明了一个名为\
  \ `grandMaster` 的 `bool` 变量。在程序中我们可以为它赋值 `true` 或 `false`，如下所示：\n\n```cs\nif (points\
  \ > 500)\n{\n   grandMaster = true;\n}\nelse\n{\n   grandMaster = false;\n}\n```\n\
  \nbool 类型的变量通常用于标志。标志是指示某个条件存在的变量。当标志变量被设置为 `false` 时，表示该条件不存在。当标志变量被设置为 `true`\
  \ 时，意味着该条件存在。例如，之前的代码可能用于游戏来判断用户是否是“大师”。如果他或她获得了超过 500 分，我们将 `grandMaster` 变量设置为\
  \ `true`。否则，我们将变量设置为 `false`。在程序的后面，我们可以测试 `grandMaster` 变量，如下：\n\n```cs\nif (grandMaster)\n\
  {\n   powerLevel += 500;\n}\n```\n\n这段代码的作用是：如果 `grandMaster` 为 `true`，则给 `powerLevel`\
  \ 增加 500。另一个例子是：\n\n```cs\nif (!grandMaster)\n{\n   powerLevel = 100;\n}\n```\n\n\
  这段代码的作用是：如果 `grandMaster` 不是 `true`，则将 `powerLevel` 设置为 100。\n\n# 检查点\n\n1. 4.18\
