  \n`combo box` 是一个像图 B-3 那样的列表。\n\n\n\n\n*   下拉列表组合框（Drop-Down List Combo Box）。使用下拉列表组合框样式时，用户可能无法直接在组合框中输入文本。必须从列表中选择一个项目。运行时，会出现一个下拉列表组合框，如图\
  \ B-5 中左侧图像所示。当用户点击向下箭头时，会出现一个项目列表，如图中右侧图像所示。选中的项目将被分配给组合框的 `Text` 属性。\n\n## 图 B-5\
  \ 下拉列表组合框\n\n![屏幕截图显示组合框顶部有一个矩形文本框，下拉菜单中出现了一个项目列表。图中有一个箭头正在从下拉菜单中选择一个项目。](img/FG_APPb_005.png)\n\
  \n## 从组合框获取用户输入\n\n与列表框一样，你可以通过检索 `SelectedIndex` 或 `SelectedItem` 属性中的值来确定从组合框列表中选择了哪一个项目。然而，如果用户在组合框的文本区域中输入了文本，你无法使用\
  \ `SelectedIndex` 或 `SelectedItem` 属性来获取文本。获取用户输入的最佳方法是使用 `Text` 属性，它包含用户的文本输入或从列表中选中的项目。\n\
  \n## 列表框与组合框\n\n以下指南将帮助你决定何时使用列表框，以及何时使用组合框：\n\n*   当你想要为用户提供一个项目列表供其选择，但不想将用户的输入限制在列表项目上时，请使用下拉或简单组合框。\n\
  \n*   当你想要将用户的选择限制在项目列表中时，请使用列表框或下拉列表组合框。下拉列表组合框通常比列表框占用的更小（因为列表在用户点击向下箭头之前不会显示），所以当你想要节省表单空间时请使用它。\n\
  \n## 滚动条\n\n滚动条提供了一种在值范围内调整值的视觉方法。此类类型的控件显示一个可以沿着轨道拖动的滑块。Visual C# 提供了一个名为 `HScrollBar`\
  \ 的水平滚动条控件和一个名为 `VScrollBar` 的垂直滚动条控件。图 B-6 显示了这些控件的各个示例。你可以在`Toolbox`（工具箱）的`All\
  \ Windows Forms`组中找到这些控件。\n\n## 图 B-6 水平和和垂直滚动条\n\n![屏幕截图沿显示长度处有一个名为“H ScrollBar”的水平滚动条，沿显示高度处有一个名为“V\
  \ ScrollBar”的垂直滚动条。](img/FG_APPb_006.png)\n\n以下是这些控件的重要属性的摘要：\n\n*   `Value` 属性是一个整数值，随着用户移动控件的滑块而调整。（默认值为\
  \ 0。）\n*   `Minimum` 属性是可滚动范围的下限。（默认值为 0。）\n*   `Maximum` 属性是可滚动范围的上限。（默认值为 100。）\n\
  *   `LargeChange` 属性是当用户点击滑块两侧的滚动条区域时，`Value` 属性改变的整数值。当用户在控件获得焦点时按下 `Page Up` 或\
  \ `Page Down` 键，`Value` 属性改变的量也是该值。（默认值为 10。）\n*   `SmallChange` 属性是当用户点击滚动条两端出现的任意箭头之一时，`Value`\
  \ 属性改变的整数值。（默认值为 1。）\n\n当水平滚动条的滑块向左侧移动时，`Value` 属性会减小。当滑块向滚动条的右侧移动时，`Value` 属性会增加。当垂直滚动条的滑块向顶部移动时，`Value`\
  \ 属性会减小。当滑块向滚动条的底部移动时，`Value` 属性会增加。\n\n当用户移动滚动条上的滑块时，会触发 `Scroll` 事件。如果你为控件编写了\
  \ `Scroll` 事件处理程序，那么每当滑块移动时，处理程序都会执行。要为 `Scroll` 事件生成代码模板，只需在`Designer`（设计器）中双击滚动条控件即可。\n\
  \n图 B-7 显示了示例应用程序中的表单，该表单演示了 `HScrollBar` 控件。`HScrollBar` 控件名为 `hScrollBar`，显示值的标签名为\
  \ `valueLabel`。表单的代码如程序 B-1 所示。\n\n*   - 下拉列表组合框（Drop-Down List Combo Box）。使用下拉列表组合框样式时，用户可能无法直接在组合框中输入文本。必须从列表中选择一个项目。运行时，会出现一个下拉列表组合框，如图\
  \ B-5 中左侧图像所示。当用户点击向下箭头时，会出现一个项目列表，如图中右侧图像所示。选中的项目将被分配给组合框的 `Text` 属性。\n\n## 图 B-5\
  \ 下拉列表组合框\n\n![屏幕截图显示组合框顶部有一个矩形文本框，下拉菜单中出现了一个项目列表。图中有一个箭头正在从下拉菜单中选择一个项目。](img/FG_APPb_005.png)\n\
  \n## 从组合框获取用户输入\n\n与列表框一样，你可以通过检索 `SelectedIndex` 或 `SelectedItem` 属性中的值来确定从组合框列表中选择了哪一个项目。然而，如果用户在组合框的文本区域中输入了文本，你无法使用\
  \ `SelectedIndex` 或 `SelectedItem` 属性来获取文本。获取用户输入的最佳方法是使用 `Text` 属性，它包含用户的文本输入或从列表中选中的项目。\n\
  \n## 列表框与组合框\n\n以下指南将帮助你决定何时使用列表框，以及何时使用组合框：\n\n*   当你想要为用户提供一个项目列表供其选择，但不想将用户的输入限制在列表项目上时，请使用下拉或简单组合框。\n\
  \n*   当你想要将用户的选择限制在项目列表中时，请使用列表框或下拉列表组合框。下拉列表组合框通常比列表框占用的更小（因为列表在用户点击向下箭头之前不会显示），所以当你想要节省表单空间时请使用它。\n\
  \n## 滚动条\n\n滚动条提供了一种在值范围内调整值的视觉方法。此类类型的控件显示一个可以沿着轨道拖动的滑块。Visual C# 提供了一个名为 `HScrollBar`\
  \ 的水平滚动条控件和一个名为 `VScrollBar` 的垂直滚动条控件。图 B-6 显示了这些控件的各个示例。你可以在`Toolbox`（工具箱）的`All\
  \ Windows Forms`组中找到这些控件。\n\n## 图 B-6 水平和和垂直滚动条\n\n![屏幕截图沿显示长度处有一个名为“H ScrollBar”的水平滚动条，沿显示高度处有一个名为“V\
  \ ScrollBar”的垂直滚动条。](img/FG_APPb_006.png)\n\n以下是这些控件的重要属性的摘要：\n\n*   `Value` 属性是一个整数值，随着用户移动控件的滑块而调整。（默认值为\
  \ 0。）\n*   `Minimum` 属性是可滚动范围的下限。（默认值为 0。）\n*   `Maximum` 属性是可滚动范围的上限。（默认值为 100。）\n\
  *   `LargeChange` 属性是当用户点击滑块两侧的滚动条区域时，`Value` 属性改变的整数值。当用户在控件获得焦点时按下 `Page Up` 或\
  \ `Page Down` 键，`Value` 属性改变的量也是该值。（默认值为 10。）\n*   `SmallChange` 属性是当用户点击滚动条两端出现的任意箭头之一时，`Value`\
  \ 属性改变的整数值。（默认值为 1。）\n\n当水平滚动条的滑块向左侧移动时，`Value` 属性会减小。当滑块向滚动条的右侧移动时，`Value` 属性会增加。当垂直滚动条的滑块向顶部移动时，`Value`\
  \ 属性会减小。当滑块向滚动条的底部移动时，`Value` 属性会增加。\n\n当用户移动滚动条上的滑块时，会触发 `Scroll` 事件。如果你为控件编写了\
  \ `Scroll` 事件处理程序，那么每当滑块移动时，处理程序都会执行。要为 `Scroll` 事件生成代码模板，只需在`Designer`（设计器）中双击滚动条控件即可。\n\
  \n图 B-7 显示了示例应用程序中的表单，该表单演示了 `HScrollBar` 控件。`HScrollBar` 控件名为 `hScrollBar`，显示值的标签名为\
  \ `valueLabel`。表单的代码如程序 B-1 所示。\n\n*   - 下拉列表组合框（Drop-Down List Combo Box）。使用下拉列表组合框样式时，用户可能无法直接在组合框中输入文本。必须从列表中选择一个项目。运行时，会出现一个下拉列表组合框，如图\
  \ B-5 中左侧图像所示。当用户点击向下箭头时，会出现一个项目列表，如图中右侧图像所示。选中的项目将被分配给组合框的 `Text` 属性。\n\n## 图 B-5\
