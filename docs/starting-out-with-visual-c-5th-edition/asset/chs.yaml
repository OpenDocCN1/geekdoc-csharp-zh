  \ `valueLabel`。表单的代码如程序 B-1 所示。\n\n\n\n\n\n图 B-10 显示了一个名为 `TabControl Demo` 的示例应用程序，该程序可以在学生示例程序中找到。应用程序的表单有一个包含三个\
  \ `TabPages` 的 `TabControl`。每个 `TabPage` 包含一个显示图片的 `PictureBox` 控件。（该应用程序中没有代码。）\n\
  \n# 图 B-10 TabControl Demo 应用程序\n\n![一组三个截图显示了 TabControl Demo 应用程序的三个标签页。三个标签页的标题分别为“海滩”、“城市”和“山脉”。每个\
  \ TabPage 都根据其相应的标题显示一张图片。](img/FG_APPb_010.png)\n\n# WebBrowser 控件\n\n`WebBrowser`\
  \ 控件（位于“工具箱”中的 `Common Controls` 组）允许你在应用程序的表单上显示 Web 页面。该控件有一个名为 `Url` 的属性，可以设置为\
  \ Web 页面的 URL（统一资源定位符）。在运行时，该 Web 页面将显示在控件中。\n\n在设计时，你可以使用 `Properties` 窗口来设置 `Url`\
  \ 属性。你只需要在属性的值框中输入一个有效的 URL，例如 `www.gaddisbooks.com`。如果你想在代码中设置 `Url` 属性，则必须创建一个\
  \ `Uri` 对象（统一资源标识符）并将该对象赋值给该属性。这是一个示例：\n\n```\nWebBrowser1.Url = new Uri(\"http://www.gaddisbooks.com\"\
  );\n```\n\n或者，你可以调用控件的 `Navigate` 方法来显示 Web 页面，如下所示：\n\n```\nWebBrowser1.Navigate(New\
  \ Uri(\"http://www.gaddisbooks.com\"));\n```\n\n在这两种方法中，如果使用了无效的 Web 地址，将会抛出异常。\n\
  \n当 Web 页面加载完成后，会发生 `DocumentCompleted` 事件。如果你想在页面加载后执行某些操作，可以为此事件编写一个处理程序。（只需在\
  \ `Designer` 窗口中双击 `WebBrowser` 控件，即可为 `DocumentCompleted` 事件处理程序创建代码模板。）\n\n图 B-11\
  \ 显示了学生示例程序中的 `WebBrowser Demo` 应用程序。应用程序的表单有一个名为 `WebBrowser1` 的 `WebBrowser` 控件、一个名为\
  \ `urlTextBox` 的 `TextBox` 控件以及一个名为 `goButton` 的 `Button` 控件。当用户点击 `goButton` 按钮时，应用程序会将\
  \ `WebBrowser1` 控件的 `Url` 属性设置为在 `urlTextBox` 文本框中输入的地址。`Form1` 表单的代码在 程序 B-2 中所示。\n\
  \n# 图 B-11 WebBrowser Demo 应用程序\n\n![WebBrowser 控件应用程序的截图显示了 Form1 表单代码的结果。它显示表单倾斜，标题为“Pearson，始终学习”，显示了两个书籍的列表，表单底部有“U\
  \ r l TextBox”和“go Button”。](img/FG_APPb_011.png)\n\n# ErrorProvider 组件\n\n`ErrorProvider`\
  \ 组件（位于“工具箱”中的 `Components` 组）允许你通过在应用程序表单上的特定控件旁边显示闪烁的错误图标 (![错误图标](img/ErrorIcon.png))\
  \ 来指示用户输入了无效值。当用户将鼠标指针悬停在图标上时，将以工具提示（ToolTip）的形式显示错误消息。\n\n当你插入 `ErrorProvider`\
  \ 组件时，它会出现在 `Designer` 窗口底部的组件区中，并带有如 `ErrorProvider1` 的默认名称。在代码中，当用户用特定控件输入无效值时，你调用\
  \ `ErrorProvider` 组件的 `SetError` 方法。以下是调用该方法的通用格式：\n\n```\nErrorProviderName.SetError(ControlName,\
  \ ErrorMessage);\n```\n\n在通用格式中，`ErrorProviderName` 是 `ErrorProvider` 组件的名称，`ControlName`\
  \ 是你想要显示错误图标旁边的控件名称，`ErrorMessage` 是与错误关联的错误消息。这是一个示例：\n\n```\nErrorProvider1.SetError(payRateTextBox,\
  \ \"Invalid pay rate\");\n```\n\n此语句使用 `ErrorProvider1` 组件在 `payRateTextBox` 控件旁边显示错误图标。当用户将鼠标指针悬停在错误图标上时，消息\
  \ `Invalid pay rate` 将作为工具提示显示。\n\n错误图标将一直显示在指定的控件旁边，直到你再次调用 `SetError` 方法，并将相同的控件名称作为第一个参数，并将空字符串作为第二个参数。这是一个示例：\n\
  \n```\nErrorProvider1.SetError(payRateTextBox, \"\");\n```\n\n图 B-12 显示了学生示例程序中的\
  \ `ErrorProvider Demo` 应用程序。用户在 `hoursTextBox` 控件中输入小时数，在 `payRateTextBox` 控件中输入数字薪率，然后点击\
  \ `calcButton` 控件计算总工资。如果小时数或薪率输入了非数字值，`ErrorProvider` 组件将在包含无效值的控件旁边显示错误图标。在 图\
  \ B-12 中，用户输入了无效的薪率值。\n\n# 图 B-12 ErrorProvider Demo 应用程序\n\n![截图显示了学生示例程序中的 ErrorProvider\
  \ Demo 应用程序。](img/FG_APPb_012.png)\n\n\n\n\n\n图 B-13 显示了学生示例程序文件中的`Selected Text\
  \ Demo`应用程序。这是之前展示的`ErrorProvider Demo`应用程序的修改版本。在这个版本中，当`ErrorProvider`显示错误图标后，包含无效输入的`TextBox`内容会被自动选中。在图中，用户输入了无效的小时值。应用程序的代码见程序\
  \ B-4。\n\n# 图 B-13 *Selected Text Demo* 应用程序\n\n![截图显示了学生示例程序中的 Selected Text Demo\
  \ 应用程序。](img/FG_APPb_013.png)图 B-13 完整备用文本\n\n# 创建菜单系统\n\n`菜单系统`是组织在一个或多个下拉菜单中的命令集合。在\
  \ Visual Studio 中，`菜单设计器`允许你为应用程序中的任何表单视觉化地创建自定义菜单系统。在学习如何使用菜单设计器之前，你必须了解菜单系统的典型组件。查看图\
  \ B-14 所示的示例菜单系统。\n\n# 图 B-14 示例菜单系统\n\n![截图显示了菜单系统的示例。](img/FG_APPb_014.png)图 B-14\
  \ 完整备用文本\n\n图中的菜单系统由以下项目组成：\n\n*   **菜单名称**。每个下拉菜单都有一个名称。菜单名称列在表单标题栏下方的菜单条上。图 B-14\
  \ 中的菜单名称为`File`、`Edit`和`Help`。用户可以通过点击菜单名称来激活菜单。在图中，`Edit`菜单已被激活。\n\n*   **菜单命令**。菜单拥有命令。用户可以通过点击命令、输入其访问键或输入其快捷键来选择命令。\n\
  \n*   **快捷键**。快捷键是执行菜单命令的按键或组合键。快捷键显示在菜单中对应命令的右侧。例如，在图 B-14 中，`Ctrl+C`是`Copy`命令的快捷键。\n\
  \n*   **禁用的菜单命令**。当你不想用户选择某个菜单命令时，可以禁用该命令。禁用的菜单命令以淡字体（灰色）显示且无法被选择。在图 B-14 中，`Undo`命令是禁用的。\n\
  \n*   **选中的菜单命令**。选中的菜单命令通常用于开启关闭选项。命令左侧会出现勾号，表示该选项已开启。当命令左侧没有勾号时，表示该选项已关闭。用户每次选择选中的菜单命令时都会切换其状态。在图\
  \ B-14 中，`Autosave`是一个选中的菜单命令。\n\n*   **子菜单**。菜单上的某些命令实际上是子菜单的名称。当命令右侧出现一个右箭头时，你就可以判断该命令是子菜单的名称。激活子菜单名称会显示子菜单。例如，在图\
  \ B-14 中，`Sort`会导致子菜单出现。\n\n*   **分割线**。分割线是用于分组的水平线。在图 B-14 中，分割线用于将`File`、`Cut`和`Paste`命令分组。\n\
  \n# MenuStrip 控件\n\n`菜单系统`通过`MenuStrip`构建。一旦在表单上放置了`MenuStrip`，你就可以使用菜单设计器创建项。当选中`MenuStrip`时，会显示设计器。`MenuStrip`是菜单项目的容器。图\
  \ B-15 显示了带有`MenuStrip`控件的表单。\n\n`MenuStrip`允许你视觉化地创建自定义菜单系统。`MenuStrip`中的每个项目都是`ToolStripMenuItem`。图\
  \ B-16 显示了带有`MenuStrip`控件的表单。\n\n`MenuStrip`项目根据你输入的文本进行命名。当你输入一个`ToolStripMenuItem`文本时，它会显示在菜单条上。图\
  \ B-17 显示了在输入`File`作为第一个菜单项的文本后的菜单设计器。\n\n# 如何使用菜单设计器\n\n一旦在表单上放置了`MenuStrip`，你就可以使用菜单设计器创建项。通过选择`MenuStrip`控件启动菜单设计器。图\
  \ B-16 显示了带有`MenuStrip`控件的表单。\n\n\n\n\n\n注意，菜单设计器现在显示了两个新的 `Type Here` 框，一个在第一个对象的下方，另一个在它的右侧。只需点击其中一个框即可选中它，然后输入你希望显示在该位置的文本。图\
  \ B-18 显示了具有更完整菜单系统的菜单设计器。该菜单系统包含 `File`、`Edit` 和 `Help` 菜单。显示的是 `Edit` 菜单。\n\n\
  # 图 B-18 具有许多项目的菜单设计器\n\n![截图显示了具有更完整菜单系统的菜单设计器。](img/FG_APPb_018.png)图 B-18 完整替代文本\n\
  \n# 快捷键\n\n如前所述，快捷键是导致菜单命令执行的按键或按键组合。表 B-1 列出了 Windows 应用程序中一些常用的快捷键。\n\n# 表 B-1\
  \ Windows 应用程序中常用的快捷键\n\n| 快捷键 | 命令 |\n| --- | --- |\n| Control + S | 保存 |\n| Control\
  \ + P | 打印 |\n| Control + C | 复制 |\n| Control + X | 剪切 |\n| Control + V | 粘贴 |\n\
  \n快捷键显示在对应命令右侧菜单中。要为菜单项创建快捷键，请点击 `Properties` 窗口中 `ShortcutKeys` 属性旁出现的箭头。会出现一个对话框，如图\
  \ B-19 所示。`Key` 下拉列表显示了所有可用快捷键，并允许从列表中选择一个键。对话框还允许你选择 `Control`、`Shift` 或 `Alt`\
  \ 键或这些键的任何组合）。例如，如果你想将 `Control + S` 分配为快捷键，可以在列表中选择 `S` 键并在 `Ctrl` 旁边打勾选。\n\n#\
  \ 图 B-19 ShortcutKeys 属性\n\n![截图显示了 Properties 窗口，选中了“ShortcutKeys”属性。它显示了一个标题为“Modifiers”的对话框，其中包含与“c\
  \ t r l”、“shift”和“A l t”键组合的可用快捷键下拉列表。](img/FG_APPb_019.png)\n\n你还必须确保 `ShowShortcut`\
  \ 属性被设置为 `True`。当设置为 `False` 时，该项的快捷键将不会显示。\n\n# 勾选菜单项\n\n某些程序具有可以简单开启或关闭某功能的菜单项。例如，假设你正在创建一个作为闹钟钟应用程序，并且你希望用户能够通过菜单项开启或关闭闹钟。一种常见方法是闹钟设置一个勾选菜单项。当菜单项旁边出现勾选标记时，表示闹钟已开启。当项旁边没有显示勾选标记时，表示闹钟已关闭。当用户点击菜单项时，它的状态会在开启和关闭之间切换。这种菜单项被称为勾选菜单项（checked\
  \ menu item）。\n\n要让菜单项在被用户点击时具有变为勾选或取消勾选的能力，你需要将该项的 `CheckOnClick` 属性设置为 `True`。然后你可以将\
  \ `Checked` 属性设置为 `True` 或 `False`，以指定应用程序运行时该项初始显示状态。如果你将 `Checked` 属性设置为 `True`，该项将带有勾选标记出现。如果你将\
  \ `Checked` 属性设置为 `False`，则不会显示勾选标记。\n\n在代码中，你可以使用 `Checked` 属性判断菜单项是否被勾选。如果 `Checked`\
  \ 属性设置为 `True`，则意味着该项已勾选。如果 `Checked` 属性设置为 `False`，则意味着该项未勾选。以下代码显示了一个示例。此代码测试了名为\
  \ `alarmToolStripMenuItem` 的菜单项的 `Checked` 属性。如果该项已勾选，则显示一个消息框。\n\n```\nif (alarmToolStripMenuItem.Checked)\n\
  {\n    MessageBox.Show(\"WAKE UP!\");\n}\n```\n\n# 禁用菜单项\n\n禁用的菜单项显示为暗淡或灰色，用户可能无法选择它。你可以通过将将其\
  \ `Enabled` 属性设置为 `False` 来禁用菜单项。例如，提供 `Cut`、`Copy` 和 `Paste` 命令的应用程序通常在剪切或复制内容之前禁用\
  \ `Paste` 命令。因此，可以在设计时（在 `Properties` 窗口中）将 `Paste` 菜单项的 `Enabled` 属性设置为 `False`，在使用\
  \ `Cut` 或 `Copy` 命令后在代码中设置为 `true`。假设 `Paste` 菜单项名为 `pasteToolStripMenuItem`。\n\n\
  ```\npasteToolStripMenuItem.Enabled = true;\n```\n\n# 分隔线\n\n你可以通过以下两种方式在菜单中插入分隔线：\n\
  \n*   右键点击菜单项。在弹出菜单中，选择 *Insert* 并选择 *Separator*。\n*   输入连字符作为菜单项。\n\n# 子菜单\n\n\
  当选中某个菜单项时，会显示一个 `Type Here` 框。图 B-20 显示了一个示例。这允许你创建一个子菜单。\n\n# 图 B-20 创建子菜单\n\n\
  ![截图显示了表单 Designer 标签页中的菜单系统。](img/FG_APPb_020.png)图 B-20 完整替代文本\n\n# 在现有菜单中插入菜单项\n\
  \n如果你需要在现有菜单上方插入新菜单项，请启动菜单设计器并右键点击该菜单项。在弹出菜单中，选择 *Insert* 然后 *MenuItem*。如果你需要在现有菜单的底部插入新菜单项，只需启动菜单设计器并选择相应的菜单即可。\n\
  \n# 删除菜单项\n\n要删除菜单项，请启动菜单设计器并执行以下步骤之一：\n\n*   右键点击要删除的菜单项。在弹出菜单中，选择 *Delete*。\n\
  *   选择要删除的菜单项，然后按键盘上的 Delete 键。\n\n# 快捷键（继续）\n\n# ToolStripMenuItem 点击事件\n\n你不需要编写代码来显示菜单或子菜单。当用户点击显示菜单或子菜单的菜单项时，Visual\
  \ Studio 会自动显示该菜单或子菜单。\n\n如果菜单项没有显示的菜单或子菜单，你可以通过为其提供 Click 事件处理程序来使其具有功能。例如，假设菜单系统有一个\
  \ `File` 菜单，其中包含 `Exit` 命令，该命令结束应用程序。`Exit` 命令的菜单名为 `exitToolStripMenuItem`。\n\n\
  # 重排菜单项\n\n你可以通过点击并拖动来移动菜单项。只需在菜单设计器中选择它并拖动到所需的位置即可。\n\n\n\n\n\n你始终应该将这些项目添加到你的菜单系统中，因为大多数\
  \ Windows 用户都期望看到它们。你还应该为最常用的命令分配快捷键。学习 Microsoft Word 或 Microsoft Excel 等应用程序中的菜单系统，以熟悉典型的菜单设计。\n\
