  \ MessageBox.Show(\"Sorry, that is NOT the secret word.\");\n 15     }\n 16  }\n\
  ```\n\n# 其他字符串比较\n\n除了判断字符串是否相等，还可以可以使用 `String.Compare` 方法判断一个字符串是否大于另一个字符串。这是一个很有用的功能，因为有时你需要按照某种顺序对字符串进行排序。在查看该方法如何工作之前，我们应该回顾字符是如何存储在内存中的。\n\
  \n回想 第 1 章，计算机并没有在内存中实际存储如 *A*、*B*、*C* 等字符。相反，它们存储的是代表字符的数值代码。我们在 第 1 章 中提到过 C#\
  \ 使用 Unicode 来表示字符。以下是关于 Unicode 系统的一些事实：\n\n*   大写字母 *A* 到 *Z* 由数字 65 到 90 表示。\n\
  *   小写字母 *a* 到 *z* 由数字 97 到 122 表示。\n*   当数字 0 到 9 作为字符存储在内存中时，它们由数值代码 48 到 57 表示。（例如，字符串“abc123”在内存中存储为代码\
  \ 97, 98, 99, 49, 50 和 51。）\n*   空格格由数字 32 表示。\n\n除了建立了一组表示内存中字符的数值代码外，Unicode 还为字符建立了一种顺序。字符\
  \ *A* 在字符 *B* 之前，*B* 在字符 *C* 之前，以此此类推。\n\n当程序比较字符时，它实际上比较的是字符的代码。字符 *A* 会被认为小于字符\
  \ *B*，因为字符 *A* 的数值代码小于字符 *B* 的数值代码。\n\n让我们来看看包含多个字符的字符串是如何比较的。假设我们在内存中存储了字符串“Mary”和“Mark”，如下：\n\
  \n```\n string name1 = \"Mary\";\nstring name2 = \"Mark\";\n```\n\n图 4-19 显示了字符串“Mary”和“Mark”是如何使用字符代码存储在内存中的。\n\
  \n# 图 4-19 字符串“Mary”和“Mark”的字符代码\n\n![图表显示了字符串“Mary”和“Mark”的字符代码。](img/FG_04_019.png)图\
  \ 4-19 完整替代文本\n\n当程序中比较这些字符串时，它们会逐个字符进行比较，从第一个（即最左侧）字符开始。这在 图 4-20 中所示。\n\n# 图 4-20\
