  \n## 通过名称识别表单和控件\n应用程序的 GUI 由表单和各种控件组成。应用程序 GUI 中的每个表单和控件都必须有一个用于识别它们的名称。Visual\
  \ Studio 在新项目中初始创建的空白表单命名为 `Form1`。\n\n### 注意\n在本书的后面，你将学习如何更改表单的名称，但现在你将保留默认名称\
  \ `Form1`。\n\n## 属性窗口\nGUI 对象的外观和其他特征由对象的属性决定。当你从 `Designer` 中选择一个对象时，该对象的属性会显示在\
