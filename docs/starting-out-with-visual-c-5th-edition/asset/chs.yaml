  \n| `Except` | Summary：返回一个包含第一个集合中但不在第二个集合中的元素的集合。通用格式：`collection1`.`Except(collection2)`描述：在通用格式下，`collection1`\
  \ 和 `collection2` 是集合。该方法返回一个 `IEnumerable<T>` 集合，包含 `collection1` 中未出现在 `collection2`\
  \ 中的元素。这是两个集合的数学差集。 |\n\n| `Intersect` | Summary：返回一个仅包含两个集合中共同元素的集合。通用格式：`collection1`.`Intersect(collection2)`描述：在通用格式下，`collection1`\
  \ 和 `collection2` 是集合。该方法返回一个 `IEnumerable<T>` 集合，仅包含在两个集合中都出现的元素。这是两个集合的数学交集。 |\n\
  \n| `Union` | Summary：返回一个包含两个集合中所有去重元素的集合。通用格式：`collection1`.`Union(collection2)`描述：在通用格式下，`collection1`\
  \ 和 `collection2` 是集合。该方法返回一个 `IEnumerable<T>` 集合，包含两个集合的去重元素。这是两个集合的数学并集。 |\n\n\
  ### 注意\n\n表 14-5 中的方法在处理原始数据类型时按描述的方式工作。然而，如果你想在类对象集合上使用它们，这些方法将根据对象的引用工作，而不是对象所包含的数据。如果你想根据对象包含的数据在对象集合上使用这些方法，你将需要为这些对象实现一个自定义比较器。我们未在本书中讨论自定义比较器。\n\
  \n下面的代码片段演示了 `Distinct` 方法。`result` 集合将具有四个元素，值分别为 1、2, 3 和 4：\n\n```\n 1   int[]\
  \ set1 = { 1, 2, 2, 3, 3, 3, 4, 4, 4, 4 };\n2   var result = set1.Distinct();\n\
  ```\n\n下面的代码片段演示了 `Except` 方法。`result` 集合将具有两个元素，值分别为 1 和 2：\n\n```\n 1   int[]\
  \ set1 = { 1, 2, 3, 4 };\n2   int[] set2 = { 3, 4, 5, 6 };\n3   var result = set1.Except(set2);\n\
  ```\n\n下面的代码片段演示了 `Intersect` 方法。`result` 集合将具有两个元素，值分别为 3 和 4：\n\n```\n 1   int[]\
  \ set1 = { 1, 2, 3, 4 };\n2   int[] set2 = { 3, 4, 5, 6 };\n3   var result = set1.Intersect(set2);\n\
  ```\n\n下面的代码片段演示了 `Union` 方法。`result` 集合将具有六个元素，值分别为 1, 2, 3, 4, 5 和 6：\n\n```\n\
  \ 1   int[] set1 = { 1, 2, 3, 4 };\n2   int[] set2 = { 3, 4, 5, 6 };\n3   var result\
  \ = set1.Union(set2);\n```\n\n# 分区方法\n\n**分区方法**是将集合分为两个部分并返回其中一个部分的方法。LINQ 提供了表\
  \ 14-6 中列出的生成方法。\n\n# 表 14-6 LINQ 分区方法\n\n| 方法 | 描述 |\n\n| --- | --- |\n\n| `Skip`\
  \ | Summary：从集合的第一个元素开始，跳过指定数量的元素。返回剩余元素。通用格式：`collection`.`Skip(count)`描述：在通用格式下，`collection`\
  \ 是一个集合。该方法返回一个 `IEnumerable<T>` 集合，包含跳过了前 `count` 个元素的 `collection` 副本。 |\n\n|\
  \ `SkipWhile` | Summary：从第一个元素开始，跳过符合条件的元素。返回剩余元素。通用格式：`collection`.`SkipWhile(FuncDelegate)`描述：在通用格式下，`collection`\
  \ 是一个集合，`FuncDelegate` 是一个具有一个参数并返回 `bool` 值的 `Func` 委托（或 表达式）。`collection` 中的每个元素将作为参数传递给\
  \ `Func` 委托。从集合开始，所有导致 `Func` 委托返回 `true` 的元素将被跳过。 |\n\n| `Take` | Summary：从第一个元素开始返回指定数量的元素。通用格式：`collection`.`Take(count)`描述：在通用格式下，`collection`\
  \ 是一个集合，`count` 是一个整数。该方法返回一个 `IEnumerable<T>` 集合，包含前 `count` 个元素。如果 `collection`\
  \ 包含元素少于 `count`，则返回 `collection` 的所有元素。 |\n\n| `TakeWhile` | Summary：从第一个元素开始，返回符合条件的元素。通用格式：`collection`.`TakeWhile(FuncDelegate)`描述：在通用格式下，`collection`\
  \ 是一个集合，`FuncDelegate` 是一个具有一个参数并返回 `bool` 值的 `Func` 委托（或 表达式）。`collection` 中的每个元素将作为参数传递给\
  \ `Func` 委托。返回一个 `IEnumerable<T>` 集合，包含从 `collection` 到第一个导致 `Func` 委托返回 `false`\
  \ 的元素的所有元素。 |\n\n下面的代码片段演示了 `Skip` 方法。`result` 集合将具有四个元素，值分别为 4, 5, 6 和 7：\n\n```\n\
  \ 1   int[] numbers = { 1, 2, 3, 4, 5, 6, 7 };\n2   var result = numbers.Skip(3);\n\
  ```\n\n下面的代码片段演示了 `SkipWhile` 方法。`result` 集合将具有三个元素，值分别为 5, 6 和 7：\n\n```\n 1  \
  \ int[] numbers = { 1, 2, 3, 4, 5, 6, 7 };\n2   var result = numbers.SkipWhile(item\
  \ => item < 5);\n```\n\n下面的代码片段演示了 `Take` 方法。`result` 集合将具有三个元素，值分别为 1, 2 和 3：\n\
  \n```\n 1   int[] numbers = { 1, 2, 3, 4, 5, 6, 7 };\n2   var result = numbers.Take(3);\n\
  ```\n\n下面的代码片段演示了 `TakeWhile` 方法。`result` 集合将具有四个元素，值分别为 1, 2, 3 和 4：\n\n```\n 1\
  \   int[] numbers = { 1, 2, 3, 4, 5, 6, 7 };\n2   var result = numbers.TakeWhile(item\
  \ => item < 5);\n```\n\n# 杂杂方法\n\nLINQ 提供了表 14-7 中列出的杂杂方法。\n\n# 表 14-7 杂杂 LINQ 方法\n\
  \n| 方法 | 描述 |\n\n| --- | --- |\n\n| `Concat` | Summary：返回一个两个集合的连接 `IEnumerable<T>`\
  \ 集合。通用格式：`collection1`.`Concat(collection2)`描述：在通用格式下，`collection1` 和 `collection2`\
  \ 是集合。该方法返回一个 `IEnumerable<T>` 集合，包含 `collection1` 的元素后跟 `collection2` 的元素。 |\n\n\
  \n\n\n\n| `SequenceEqual` | 摘要：比较两个集合，如果相等则返回 `true`，否则返回 `false`。通用格式：`collection1`.SequenceEqual(`collection2)`\
  \ 描述：在通用格式中，`collection1` 和 `collection2` 是集合。如果这两个集合包含相同的值且元素数量相同，则该方法返回 `true`。否则，该方法返回\
  \ `false`。注意：该方法在处理原始数据类型时按描述的方式工作。然而，如果你想比较两个包含类对象的集合，该方法将比较对象的引用，而不是对象所包含的数据。如果你想根据对象包含的数据对对象集合进行比较，你必须为这些对象实现一个自定义的比较器。我们没有在本书*书*中讨论自定义比较器。\
  \ |\n\n下面的代码段演示了 `Concat` 方法。`result` 集合将有六个元素，值为 1, 2, 3, 4, 5 和 6：\n\n```\n 1\
  \  int[] numbers1 = { 1, 2, 3 };\n2  int[] numbers2 = { 4, 5, 6 };\n3  var result\
  \ = numbers1.Concat(numbers2);\n```\n\n下面的代码段演示了 `SequenceEqual` 方法。代码将同时显示消息 \"\
  numbers1 and numbers2 are the same\" 和 \"numbers1 and numbers3 are NOT the same\"\
  。\n\n```\n 1  int[] numbers1 = { 1, 2, 3 };\n2  int[] numbers2 = { 1, 2, 3 };\n\
  3  int[] numbers3 = { 4, 5, 6 };\n4\n5  if (numbers1.SequenceEqual(numbers2))\n\
  6      MessageBox.Show(\"numbers1 and numbers2 are the same\");\n7\n8  if (!numbers1.SequenceEqual(numbers3))\n\
  9      MessageBox.Show(\"numbers1 and numbers3 are NOT the same\");\n```\n\n# 检查点\n\
  \n1. 14.7 `ElementAt` 方法和 `ElementAtOrDefault` 方法的区别是什么？\n2. 14.8 如果在一个包含多个元素的集合上调用\
  \ `Single` 方法会发生什么？\n3. 14.9 假设你需要一个包含从特定值开始的连续整数的 `IEnumerable<int>` 集合。你应该调用哪个方法来创建该集合？\n\
  4. 14.10 假设你需要从原始值集合中删除所有重复项。你应该调用哪个方法？\n5. 14.11 如果你需要从集合的开头获取特定数量的元素，你会使用什么方法？\n\
  6. 14.12 你会使用什么方法来比较两个原始类型的集合以确定它们是否相等？\n\n# 14.4 使用 LINQ 查询数据库\n\n### 概念\n\n通过使用对象关系映射工具（或简称\
  \ ORM），你可以使用 LINQ 查询数据库。\n\n在本章的节节中，我们讨论了将 LINQ 作为查询数组和列表数据的工具。通过使用名为 `LINQ to SQL`\
  \ 的工具，你也可以使用 LINQ 查询数据库。`LINQ to SQL` 是一种 `Object Relational Mapping`（或 `ORM`）工具。`ORM`\
  \ 工具是一种将数据库转换为对象的软件。程序员随后可以编写与这些对象交互的 LINQ 查询，而在后台，`LINQ to SQL` 会将 LINQ 查询翻译成 SQL\
  \ 查询。\n\n在本节中，我们将处理三种类型的对象：数据上下文对象、表对象和实体对象。让我们详细观察其中的每一个。\n\n## 数据上下文对象\n\n`data\
  \ context object` 代表一个数据库。它具有连接数据库、将 LINQ 查询翻译成 SQL 查询以及在数据库上执行这些 SQL 查询的能力。当你设置\
  \ `LINQ to SQL` 与特定数据库工作时，Visual Studio 会自动在你的项目中生成一个派自 .NET Framework 中 `DataContext`\
  \ 类的类。在你的代码中，你可以创建一个该派生类实例的对象。该对象就是代表数据库的数据上下文对象。\n\n## 表对象\n\n`table object` 代表数据库中的一张表。`table\
  \ object` 是 .NET Framework 中 `Table` 类的实例。它本质上是一个 `IEnumerable<T>` 集合，其元素包含数据库表中的行。在代码中，你可以像遍历\
  \ `List` 或数组一样遍历表对象的元素的元素。你还可以在表对象上执行 LINQ 查询。\n\n当 Visual Studio 生成一个派生的 `DataContext`\
  \ 类来表示特定数据库时，该派生的 `DataContext` 类将包含作为属性的表对象，每个属性代表数据库中的一张表。例如，如果你正在处理一个包含两个表的数据库，代表数据库的对象将有两个表属性，每个对应数据库中的一张表。\n\
  \n## 实体对象\n\n`entity object` 代表表中的某行。它具有代表行中列的属性。例如，假设我们正在处理一张表，表中的每行都有以下三列：\n\n\
  * 一个名为 `EmployeeID` 的 `int` 列\n* 一个名为 `Name` 的 `nvarchar(50)` 列\n* 一个名为 `PayRate`\
  \ 的 `money` 列\n\n代表该行的实体对象将具有三个属性：\n\n* 一个名为 `EmployeeID` 的 `int` 属性\n* 一个名为 `Name`\
  \ 的 `string` 属性\n* 一个名为 `PayRate` 的 `decimal` 属性\n\n图 14-4 阐说明了一个包含两个表对象的数据上下文对象。每个表对象都是实体对象的集合。这对应于具有两个表的数据库。#\
  \ 图 14-4 数据上下文、表和实体对象\n\n![显示了包含“表对象”的数据上下文对象。每个表对象都有“实体对象”。](img/FG_14_00)\n\n\
  # 安装 LINQ to SQL\n\n`LINQ to SQL` 不随 Visual Studio 自动安装。在使用它之前，你必须使用 Visual Studio\
  \ 安装程序进行下载并安装。请参见附录 E 获取说明。\n\n# 设置 LINQ to SQL 以处理数据库\n\n要设置 `LINQ to SQL` 与数据库工作，你通常应该遵循以下步骤：\n\
  \n1. 连接到你要处理的数据库。\n\n有多种方法可以实现这一点。一种方法是打开“服务器管理器”并点击“连接到数据库”图标，如图 14-5 所示。这将导致“连接”窗口，如图\
  \ 14-6 所示，它可以让你浏览文件系统并选择所需的数据库文件。\n\n2. 向项目添加 DBML 文件。\n\n在这一步中，你在项目中创建一个 DBML 文件。**DBML**\
  \ 代表 **Database Markup Language**（数据库标记语言）。Visual Studio 使用 DBML 文件自动生成 `LINQ to\
  \ SQL` 需要的类。以下是向项目添加 DBML 文件的步骤：\n\n* 点击菜单栏上的“项目”，然后点击“添加新建项”。\n* 接下来出现“新建项”窗口。如图\
  \ 14-7 所示，在左侧窗格中选择“数据”，在中间窗格中选择“LINQ to SQL 类”。\n* 在“名称”文本框中，将 DBML 文件的默认名称更改为更具描述性的名称，然后点击“添加”按钮将文件添加到项目中。\n\
  \n\n\n\n\n![截图显示了“添加新项”窗口，在可滚动列表中选择了“LINQ to S Q L Classes”作为项的类型。名称文本框显示新类的名称为“DataClass\
  \ 1 dot d b m l”。](img/FG_14_007.png)\n\n3 使用 `Object Relational Designer` 选择你想要操作的数据库表。\n\
  \n一旦你向项目添加了 `DBML` 文件，就会出现图 14-8 所示的 `Object Relational Designer`。`Object Relational\
  \ Designer` 是一个视觉化设计工具，你用它创建 `LINQ to SQL` 操作特定数据库所需的类。在最简单的情况下，你从 `Server Explorer`\
  \ 拖出一个表并将其释放到 `Object Relational Designer` 中。表示表所需的 `LINQ to SQL` 类将自动在项目中创建。\n\n\
  ## 图 14-8 *Object Relational Designer* 窗口\n\n![截图显示了设计器选项卡中的 Object Relational Designer\
  \ 窗口。其左侧是 Server Explorer 窗口，选中的模式菜单为“Phonelist dot m d f”。](img/FG_14_008.png)\n\
  \n一旦执行了这些步骤，你的项目中将自动创建以下类：\n\n*   将创建一个数据上下文类来表示数据库。该类派自 `.NET Framework` 中的 `DataContext`\
  \ 类。\n*   数据上下文类包含一个或多个表示数据库中表的表对象（作为属性存在）。每个表对象都是 `.NET Framework` 中 `Table` 类的的一个实例。每个表对象都是一个实体对象的集合，这些实体对象表示表中的行。\n\
  *   实体对象包含表示表中的列的属性。\n\n# LINQ to SQL 命名约定\n\n当 Visual Studio 生成数据上下文类时，命名约定非常直观：数据上下文类的名称基于\
  \ `DBML` 文件的名称。例如，如果 `DBML` 文件命名为 `Personnel.dbml`，则数据上下文类将命名为 `PersonnelDataContext`。\n\
  \n表对象及其关联实体类的命名约定并没有那么简单。默认情况下，表对象的名称是数据库表名称的复数形式，而关联实体类的名称是数据库表名称的单数形式。例如，假设我们的数据库表名为\
  \ `Employee`。Visual Studio 将表对象命名为 `Employees`，将实体类命名为 `Employee`。这意味着 `Employees`\
  \ 对象（表对象）将是 `Employee` 对象（实体对象）的集合。\n\n让我们来看另一个例子。假设数据库包含一个二手车经销商的库存。数据库名为 `UsedCars.mdf`，它有一个名为\
  \ `Car` 的表。`Car` 表中的每一行都包含关于库存中汽车的数据。我们正在创建一个与该数据库交互的应用程序，因此我们的 `DBML` 文件命名为 `UsedCars.dbml`。Visual\
  \ Studio 将使用以下名称我们的 `LINQ to SQL` 类：\n\n*   数据上下文类将命名为 `UsedCarsDataContext`。\n\
  *   `UsedCarsDataContext` 类将有一个名为 `Cars` 的表属性（数据库表名称的复数形式）。\n*   表的实体类将命名为 `Car`（数据库表名称的单数形式）。\n\
  \n# 使用 Data Context 对象\n\n一旦你使用 `Object Relational Designer` 生成了所需的 `LINQ to SQL`\
  \ 类，你就可以准备编写与数据库交互的代码了。第一步是创建数据上下文类的实例。例如，假设我们正在处理之前描述的二手车数据库。要创建 `UsedCarsDataContext`\
  \ 类的实例，我们将编写这样的语句：\n\n```\nUsedCarsDataContext db = new UsedCarsDataContext();\n\
  ```\n\n此语句创建了一个名为 `db` 的 `UsedCarsDataContext` 对象。我们可以使用 `db` 对象来访问数据库的表，如下代码段所示。假设数据库表有一个名为\
  \ `Mileage` 的列。此代码遍历表中的每一行，将 `Mileage` 列添加到 `ListBox` 中。\n\n```\nforeach(Car c in\
  \ db.Cars)\n{\n    mileageListBox.Items.Add(c.Mileage.ToString());\n}\n```\n\n在教程\
  \ 14-4 中，你将通过将应用程序连接到数据库、创建表示数据库所需的 `LINQ to SQL` 类以及编写遍历数据库中表的代码来完成应用程序。\n\n# 编写\
  \ LINQ to SQL 查询\n\n在教程 14-4 中，你使用了一个简单的 `foreach` 循环来遍历表对象。你通过将应用程序连接到数据库、创建表示数据库所需的\
  \ `LINQ to SQL` 类以及编写遍历数据库中表的代码来完成应用程序。以下代码创建一个数据上下文，然后使用 `LINQ to SQL` 查询来检索数据：\n\
  \n```\nPhonelistDataContext db = new PhonelistDataContext();\nvar results = from\
  \ person in db.Persons\n              select person;\nforeach(string( in results)\n\
  )\n{\n    \nname);\n}\n```\n\n以下代码显示了另一个例子。此代码检索所有包含“Smith”的电话号码：\n\n```\nPhonelistDataContext\
  \ db = new PhonelistDataContext();\nvar results = from person in db.Persons\n  \
  \            where person.Name.Contains(\"Smith\")\n              select person.Phone;\n\
  foreach(string ph in results)\n{\n    resultsListBox.Items.Add(ph);\n}\n```\n\n\
  在教程 14-5 中，你将通过将应用程序连接到数据库、创建表示数据库所需的 `LINQ to SQL` 类以及编写各种 LINQ 查询来检索数据。\n\n# 使用\
  \ LINQ 查询处理绑定控件\n\n你已经在第 12 章中学习过数据绑定控件是连接到数据源的用户界面控件。数据绑定控件会自动显示来自数据源的数据并可以更改它们所绑定的数据。简单且强大的数据绑定控件之一是\
  \ `DataGridView` 控件。`DataGridView` 控件可以在应用程序表单上显示整个数据库表。\n\n数据绑定控件也可以用于显示 LINQ 查询的结果。如果你想使用\
  \ LINQ 查询数据库表并在数据绑定控件中显示结果，请遵循以下步骤：\n\n1. 在 Visual Studio 中连接项目到数据库并使用 `Object Relational\
  \ Designer` 为要查询的表创建实体类。\n2. 向项目添加新数据源，选择 `Object` 作为数据源类型。\n3. 选择实体类作为数据对象。\n4.\
  \ 在设计器中，打开表单并创建数据绑定控件（例如 `DataGridView`）。\n5. 在代码中，编写 LINQ 查询以返回第 3 步中选择的实体类实例的集合。\n\
  6. 将 LINQ 查询的结果赋值给数据绑定控件的 `DataSource` 属性。\n\n你将在教程 14-6 中练习这些步骤。在教程中，你将创建一个使用 LINQ\
  \ 查询数据库表的应用程序，并将查询结果显示在 `DataGridView` 控件中。\n\n\n\n\n除了从数据库表中检索行之外，LINQ 还允许你更新行、插入行和删除行。在接下来的示例中，我们假设正在处理\
  \ `ProductDB` 数据库。我们的数据上下文类命名为 `ProductDBDataContext`，它有一个命名为 `Products` 的表属性。我们的实体类命名为\
  \ `Product`。\n\n第一个示例（下文所示）获取 `Product_Number` 设置为 `10-04` 的产品。它将产品的价格更改为 `99.99`，然后用新行更新数据库。\n\
  \n```\n 1  ProductDBDataContext db = new ProductDBDataContext();\n 2 \n3  Product\
  \ prod = db.Products.FirstOrDefault(item =>\n 4                       item.Product_Number\
  \ == \"10-04\");\n 5 \n6  if (prod != null)\n7  {\n8      prod.Price = 99.99m;\n\
  9      db.SubmitChanges();\n10  }\n```\n\n让我们仔细查看一下这段代码。第 1 行创建一个数据上下文对象。第 3–4 行使用\
  \ `FirstOrDefault` 扩展方法从 `db.Products` 集合获取第一个 `Product_Number` 属性设置为 `10-04` 的项。如果找到了该项，它将赋值给\
  \ `prod` 变量。如果未找到，`prod` 变量将设置为 `null`。如果 `prod` 不为 `null`，则第 8 行的语句将 `99.99` 分配给它的\
  \ `Price` 属性，第 9 行的语句调用 `db.SubmitChanges()` 用新数据更新数据库。\n\n接下来的代码显示另一个示例。在此示例中，第\
  \ 3–5 行中的 LINQ 查询返回所有 `Product_Number` 属性包含字符串 `10-` 的产品。第 7–10 行中的 `foreach` 循环遍历查询返回的所有产品，将它们的\
  \ `Units_On_Hand` 属性更改为 `0`。第 8 行的语句调用 `db.SubmitChanges()` 用新数据更新数据库。\n\n```\n\
  \ 1  ProductDBDataContext db = new ProductDBDataContext();\n 2 \n3  var results\
  \ = from prod in db.Products\n 4                where prod.Product_Number.Contains(\"\
  10-\")\n 5                select prod;\n 6\n7  foreach(Product p in results)\n8\
  \  {\n9      p.Units_On_Hand = 0;\n10  }\n11\n 12  db.SubmitChanges();\n```\n\n\
  接下来的示例显示了如何向数据库表插入新行：\n\n```\n 1  ProductDBDataContext db = new ProductDBDataContext();\n\
  \ 2\n3  Product prod = new Product();\n4  prod.Product_Number = \"40-01\";\n5  prod.Description\
  \ = \"Hiking Boots\";\n6  prod.Units_On_Hand = 10;\n7  prod.Price = 299m;\n 8\n\
  9  db.Products.InsertOnSubmit(prod);\n10  db.SubmitChanges();\n```\n\n在这段代码中，第 3–7\
  \ 行创建了 `Product` 实体类的实例并为对象的属性赋值。第 9 行调用 `db.Products.InsertOnSubmit` 方法，并将对象作为参数传递。当在第\
  \ 10 行调用 `db.SubmitChanges()` 方法时，该对象被插入到数据库中。\n\n接下来的示例显示了如何从数据库表中删除删除项：\n\n```\n\
  \ 1  ProductDBDataContext db = new ProductDBDataContext();\n2\n3  Product prod =\
  \ db.Products.FirstOrDefault(item => \n4                      item.Product_Number\
  \ == \"10-04\");\n5 \n6  if (prod != null)\n7  {\n8      db.Products.DeleteOnSubmit(prod);\n\
  9      db.SubmitChanges();\n10  }\n```\n\n第 3–4 行使用 `FirstOrDefault` 扩展方法从 `db.Products`\
  \ 集合获取第一个 `Product_Number` 属性设置为 `10-04` 的项。如果找到了该项，它将赋值给 `prod` 变量。如果未找到，`prod`\
  \ 变量将设置为 `null`。如果 `prod` 不为 `null`，第 8 行的语句调用 `db.Products.DeleteOnSubmit` 方法，并将\
  \ `prod` 对象作为参数传递。当在第 9 行调用 `db.SubmitChanges()` 方法时，该对象从数据库中删除。\n\n# Checkpoint\n\
