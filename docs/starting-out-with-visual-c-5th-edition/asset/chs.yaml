  \ 列。结果按 `Num_Shares` 列升序排序。\n\n# 编程题\n1. 人员数据库\n   使用 Visual Studio 创建名为 `Personnel.mdf`\
  \ 的数据库。该数据库应该有一个名为 `Employee` 的表，包含员工 ID、姓名、职位和时薪率列。员工 ID 应为主键。向 `Employee` 表插入至少五行示例数据。创建一个应用程序，使用\
