  # 3.11 详情\n\n在本节中，你将通过在表单上放置控件来学习 GUI 的许多方面。\n\n# 控制表单的标签顺序\n\n当应用程序运行时，按下 Tab 键可以在控件之间切换焦点。接收焦点的顺序被称为标签顺序。当你在表单上创建控件时，C#\
  \ 会自动为其分配一个 `TabIndex` 值。你创建的第一个控件 `TabIndex` 为 0，第二个的 `TabIndex` 为 1，依此类推。`TabIndex`\
  \ 为 0 的控件是标签顺序中的第一个控件。\n\n你可以通过逐个选择控件并在*属性*窗口中更改 `TabIndex` 来更改表单控件的标签顺序。然而，另一种简单的方法是点击\
  \ Studio 栏上的“视图”，然后点击“标签顺序”。这会导致表单以标签顺序选择模式显示。\n\n在标签顺序选择模式下，每个控件现有的 `TabIndex`\
  \ 值显示在控件左上角的小框中。注意右侧图像中的内容：\n\n# 图 3-31 以标签顺序选择模式显示的表单\n\n![显示了两组表单窗口截图，分别显示普通视图和标签顺序选择模式。](img/FG_03_031.png)\n\
  \n在标签顺序选择模式下，每个控件现有的 `TabIndex` 值显示在控件左上角的小框中。注意右侧图像中的内容：\n\n* `nameTextBox` 控件的\
  \ `TabIndex` 为 2。\n* `addressTextBox` 控件的 `TabIndex` 为 3。\n\n\n\n\n\n*   `cityTextBox`\
  \ 控件的 `TabIndex` 为 0。\n*   `stateTextBox` 控件的 `TabIndex` 为 4。\n*   `zipTextBox`\
  \ 控件的 `TabIndex` 为 1。\n*   `clearButton` 控件的 `TabIndex` 为 8。\n\n### 注意\n\n尽管 `Label`\
  \ 控件具有 `TabIndex` 值，但在此示例中这些值是无关的，因为 `Label` 控件无法接收焦点。\n\n当你查看图 3-31 时，请考虑应用程序运行时控件接收焦点的顺序。\n\
  \n*   `cityTextBox` 控件具有最低的 `TabIndex` 值 (0)，因此它将首先接收焦点。\n*   如果你按下 Tab 键，焦点将跳转到\
  \ `zipTextBox` 控件，因为它具有下一个最低的 `TabIndex` 值 (1)。\n*   再次按下 Tab 键，焦点将跳转到 `nameTextBox`\
  \ 控件（`TabIndex` 设置为 2）。\n*   再次按下 Tab 键，焦点将跳转到 `addressTextBox` 控件（`TabIndex` 设置为\
  \ 3）。\n*   再次按下 Tab 键，焦点将跳转到 `stateTextBox` 控件（`TabIndex` 设置为 4）。\n*   再次按下 Tab\
  \ 键，焦点将跳转到 `clearButton` 控件（`TabIndex` 设置为 8）。\n\n这是一个非常混乱的制表顺序，应该重新排列。当表单在制表顺序选择模式下显示时，你只需用鼠标按照你想要的顺序点击控件即可建立新的制表顺序。为了修复图\
  \ 3-31 中所示的混乱制表顺序，我们执行了以下操作：\n\n*   首先，点击 `nameTextBox` 控件。控件的 `TabIndex` 值变为 0。\n\
  *   接下来，点击 `addressTextBox` 控件。控件的 `TabIndex` 值变为 1。\n*   然后，点击 `cityTextBox` 控件。控件的\
  \ `TabIndex` 值变为 2。\n*   紧接着，点击 `stateTextBox` 控件。控件的 `TabIndex` 值变为 3。\n*   然后，点击\
  \ `zipTextBox` 控件。控件的 `TabIndex` 值变为 4。\n*   最后，点击 `clearButton` 控件。控件的 `TabIndex`\
  \ 值变为 5。\n\n完成后，通过按下 Esc 键退出制表顺序选择模式。现在当应用程序运行时，焦点将以一种符合用户逻辑的顺序平滑移动。\n\n# 使用 `Focus`\
  \ 方法更改焦点\n\n通常，你希望确保某个控件拥有焦点。例如，查看图 3-31 所示的表单。`Clear` 按钮的作用清除用户输入的所有内容并重置表单，以便准备接受一组新输入。当点击\
  \ `Clear` 按钮时，`TextBox` 控件应该被清空，焦点应该返回到 `nameTextBox` 控件。这样用户就无需再次点击 `TextBox` 控件即可开始输入另一组信息。\n\
  \n在代码中，你通过调用 `Focus` 方法将焦点移动到控件。方法的通用语法为：\n\n```\nControlName.Focus();\n```\n\n\
  其中 `ControlName` 是控件的名称。例如，你通过此语句将焦点移动到 `nameTextBox` 控件：\n\n```\nnameTextBox.Focus();\n\
  ```\n\n语句执行后，`nameTextBox` 控件将获得焦点。以下是编写 `clearButton` 控件的 `Click` 事件处理程序的示例：\n\n\
  ```\n 1 private void clearButton_Click(object sender, EventArgs e)\n 2 {\n 3   \
  \  // 清空 TextBox 控件。\n 4     nameTextBox.Text = \"\";\n 5     addressTextBox.Text\
  \ = \"\";\n 6     cityTextBox.Text = \"\";\n 7     stateTextBox.Text = \"\";\n 8\
  \     zipTextBox.Text = \"\";\n 9\n10     // 将焦点设置为 nameTextBox。\n11     nameTextBox.Focus();\n\
  12 }\n```\n\n第 4–8 行的语句清除了 `TextBox` 控件的内容。然后，第 11 行的语句将焦点设置为 `nameTextBox` 控件。\n\
  \n# 为按钮分配键盘访问键\n\n访问键（也称为助记键）是与 `Alt` 键组合按下的键，用于快速访问如按钮之类的控件。当你为按钮分配访问键时，用户可以通过鼠标点击按钮或使用访问键来触发\
  \ `Click` 事件。熟练使用键盘的用户更倾向于使用访问键而不是鼠标。\n\n你通过按钮的 `Text` 属性为其分配访问键。例如，假设应用程序中有一个 `Text`\
  \ 属性被设置为 `Exit` 的按钮。你希望为该按钮分配访问键 `Alt + X`，以便用户可以通过在键盘上按下 `Alt + X` 来触发按钮的 `Click`\
  \ 事件。要进行此分配，请在按钮的 `Text` 属性的字母 `x` 之前放置一个和符号 (`&`)：`E&xit`。图 3-32 显示了 `Text` 属性在*属性*窗口中的外观。\n\
  \n# 图 3-32 Text 属性 `E&xit`\n\n![截图显示了一个显示 Text 属性的属性窗口。](img/FG_03_032.png)图 3-32\
  \ Text 属性 `E&xit`\n\n![截图显示了一个显示 Text 属性的属性窗口。 尽管和符号 (`&`) 是 `Text` 属性的一部分，但它不会显示在按钮上。在字母\
  \ `x` 前放置和符号后，该字母将带有下划线，如图 3-33 所示。当用户按下访问键时，按钮将被点击。（你会在设计时看到下划线。在运行时可能不会出现。）# 图\
  \ 3-32 Text 属性 `E&xit`![截图显示了一个显示 Text 属性的属性窗口。](img/03.)\n\n### 注意\n\n访问键不区分大小写字母。`Alt\
  \ + X` 和 `Alt + x` 没有区别。\n\n假设我们在按钮的 `Text` 属性中存储值 `&Exit`。和符号位于字母 `E` 前，因此 `Alt\
  \ + E` 成为访问键。按钮将如图 3-34 所示。\n\n# 图 3-34 Text 属性 `&Exit`\n\n![截图显示了一个显示 Text 属性的属性窗口。](img/0.)\n\
  \n# 为多个按钮分配相同的访问键\n\n不要对同一个表单上的多个按钮分配相同的访问键。如果多个按钮共享相同的访问键，当用户按下访问键时，将触发第一个按钮的 `Click`\
  \ 事件。\n\n# 在按钮上显示 & 字符\n\n如果你希望在按钮上显示和符号字符，请在 `Text` 属性中使用两个和符号 (`&&`)。使用两个和符号会显示单个和符号且不定义访问键。例如，如果按钮的\
  \ `Text` 属性设置为 `Save && Exit`，按钮将如图 3-35 所示。\n\n# 图 3-35 Text 属性 `Save && Exit`\n\
  \n![截图显示了一个 Save 和 Exit 按钮，在 save 和 exit 之间放置了一个和符号。](img/FG_03_035.png)\n\n# 接受按钮和取消按钮\n\
  \n接受按钮是用户按下 Enter 键时自动点击的表单按钮。取消按钮是用户按下 Esc 键时自动点击的表单按钮。表单有两个属性，`AcceptButton` 和\
  \ `CancelButton`，它们允许你指定接受按钮和取消按钮。当你在*属性*窗口中选择这些属性时，会出现一个向下箭头按钮(![](img/DownArrow.png))，点击后会显示一个下拉列表。列表包含表单上所有按钮的名称。选择你想要指定接受按钮或取消按钮的按钮。\n\
  \n\n\n\n任何经常被点击的按钮可能应该被选为接受按钮。这将允许键盘用户快速方便地访问该按钮。`Exit`（退出）或`Cancel`（取消）按钮可能是取消按钮的候选者。\n\
  \n# BackColor 属性\n\n表单和大多数控件都有 `BackColor`属性，允许你更改对象的背景颜色。当你在`Properties`窗口中选择对象的`BackColor`属性时，会出现一个向下的箭头按钮\
  \ (![](img/DownArrow.png))，点击后会显示可用颜色的下拉列表，如图 3-36 所示。\n\n## 图 3-36 颜色下拉列表\n\n![属性窗口的截图显示了在“System”选项卡下可用颜色的下拉列表。](img/FG_03_36.png)图\
  \ 3-36 全文\n\n下拉列表有三个选项卡：`Custom`、`Web`和`System`。`System`选项卡列出了当前配置中定义的颜色。`Web`选项卡列出了浏览器中显示的颜色。`Custom`选项卡显示调色板。从其中一个选项卡中选择一种颜色，对象的背景颜色将被该颜色。\n\
  \n# ForeColor 属性\n\n显示文本的控件具有`ForeColor`属性，允许你更改文本颜色。当你在`Properties`窗口中选择控件的`ForeColor`属性时，会出现一个向下的箭头按钮\
  \ (![](img/DownArrow.png))，点击后会显示图 3-36 所示的可用颜色下拉列表。从其中一个选项卡中选择一种颜色，控件显示的文本将设置为该颜色。\n\
  \n# 在代码中设置颜色\n\n除了使用`Properties`窗口外，你还可以用代码设置`BackColor`和`ForeColor`属性的值。.NET Framework\
  \ 提供了许多表示颜色的值，可以赋值给代码中的`ForeColor`和`BackColor`属性。以下是其中几个值：\n\n```\nColor.Black\n\
  Color.Blue\nColor.Cyan\nColor.Green\nColor.Magenta\nColor.Red\nColor.White\nColor.Yellow\n\
  ```\n\n例如，假设应用程序有一个名为`messageLabel`的`Label`控件。以下代码将标签的背景颜色设置为黑色，前景颜色设置为黄色：\n\n```\n\
  messageLabel.BackColor = Color.Black;\nmessageLabel.ForeColor = Color.Yellow;\n\
  ```\n\n.NET Framework 还提供了表示系统默认颜色的值。例如，`SystemColors.Control`代表默认控件背景，`SystemColors.ControlText`代表默认文本颜色。以下语句将`messageLabel`控件的背景和前景设置为默认颜色：\n\
  \n```\nmessageLabel.BackColor = SystemColors.Control\nmessageLabel.ForeColor = SystemColors.ControlText\n\
  ```\n\n### 注意\n\n如果你在表单源代码中有一个事件处理程序，并且你想让该处理程序更改表单的`BackColor`属性，请使用`this`关键字引用表单。例如，以下语句将表单的颜色更改为蓝色：\n\
  \n```\nthis.BackColor = Color.Blue;\n```\n\n# 表单的背景图像\n\n在第 2 章中，你学习了如何使用`PictureBox`控件显示图像。图像也可以作为表单的背景。表单有一个名为`BackgroundImage`的属性，允许你在表单上导入并显示图像。如果你知道如何使用`PictureBox`控件的`Image`属性，那么你就知道如何使用表单的`BackgroundImage`属性。它们的工作方式相同：\n\
  \n*   在`Properties`窗口中点击`BackgroundImage`属性。会出现一个省略号按钮 (![](img/EllipsesButton.png))。\n\
  *   点击省略号按钮，将`Select Resource`窗口。\n*   在`Select Resource`窗口中，点击`Import`按钮。会出现一个`Open`对话框。使用该对话框找到并选择要显示的图像文件。\n\
  *   点击`Select Resource`窗口中的`OK`按钮，选定的图像将作为表单的背景。\n\n表单的`BackgroundLayout`属性类似于`PictureBox`控件的`SizeMode`属性。它指定了背景图像如何显示。它可以被设置为以下值之一：\n\
  \n*   `None`：图像位于表单的左上角。如果图像太大无法容于表单，则会被裁剪。\n*   `Tile`：这是默认值。图像在整个表单上平铺（重复显示）。\n\
  *   `Center`：图像在表单中居中，不调整大小。\n*   `Stretch`：图像在水平和垂直方向上都调整大小以适应表单。\n*   `Zoom`：图像等比例缩放以适应表单，不会丢失原始比例。\n\
  \n图 3-37 显示了各种示例。\n\n## 图 3-37 背景布局设置\n\n![显示了图像设置的插。](img/FG_03_37.png)图 3-37 全文\n\
  \n# 使用 GroupBox 组织控件\n\n`GroupBox`控件是一个带有细边框和可选左上标题的矩形控件。它是可以包含其他控件的容器。你可以使用`GroupBox`在表单上创建视觉分区。\n\
  \n`GroupBox`控件位于工具箱中。当你创建一个`GroupBox`控件时，可以设置其`Text`属性为显示在`GroupBox`左上角的文本。如果你不想在`GroupBox`上显示标题，可以清除其`Text`属性的内容。\n\
  \n图 3-38 显示了一个`GroupBox`控件。控件的`Text`属性设置为`Personal Data`，多个其他控件位于`GroupBox`内部。左侧图像显示了表单在`Designer`中的外观，右侧图像显示了表单在运行时的外观。\n\
  \n## 图 3-38 包含其他控件的 GroupBox\n\n![一组带有 GroupBox 控件的两个截图显示了它在 Designer 和运行时的外观。](img/FG_03_38.png)图\
  \ 3-38 全文\n\n# 创建 GroupBox 并添加控件\n\n假设你刚刚创建了一个`GroupBox`控件。要向`GroupBox`添加另一个控件，请选择`GroupBox`控件，然后双击工具箱中的所需工具将其放入组框内部。\n\
  \n# 将现有控件移动到 GroupBox\n\n如果一个现有控件不在`GroupBox`中，但你想将其移动到`GroupBox`，请按照以下步骤操作：\n\n\
  1.  选择要添加到`GroupBox`的控件。\n2.  将控件剪切到剪贴板。\n3.  选择`GroupBox`。\n4.  粘贴控件。\n\n# 移动和调整\
  \ GroupBox  own\n\n如果在`Designer`中选择了`GroupBox`，`GroupBox`的左上角会出现一个四头箭头 (![](img/FourHeadedArrow.png))。点击并拖动四头箭头移动`GroupBox`。`GroupBox`内部的任何控件都会随之移动。\n\
  \n# 删除 GroupBox\n\n要删除`GroupBox`，只需在`Designer`中选择它并按 Delete 键。`GroupBox`内部的所有控件也会被删除。\n\
  \n# Group Box Tab 顺序\n\n\n\n\n\n当控件放置在 `GroupBox` 控件内部时，其 `TabIndex` 属性值的处理方式有所不同。`GroupBox`\
  \ 控件有自己的 `TabIndex` 属性，而组框内部控件的 `TabIndex` 值相对于 `GroupBox` 控件的 `TabIndex` 属性的。例如，图\
  \ 3-39 显示了一个在制表顺序选择模式下显示的 `GroupBox` 控件。如你所示，`GroupBox` 控件的 `TabIndex` 设置为 0。组框内部控件的\
  \ `TabIndex` 显示为 0.0、0.1、0.2 等。\n\n## 图 3-39 GroupBox 的 TabIndex 值\n\n![一张截图显示了在制表顺序选择模式下带有\
  \ GroupBox 控件的表单](img/FG_03_039.png)图 3-39 完整替代文本\n\n### 注意\n\n组框内部控件的 `TabIndex`\
  \ 属性在 `Properties` 窗口不会以这种方式显示。它们将显示为 0、1、2 等。\n\n`Panel` 控件是一个用于放置其他控件的矩形容器，类似于\
  \ `GroupBox`。`Panel` 和 `GroupBox` 之间有几点主要区别：\n\n* `Panel` 无法显示标题，且没有 `Text` 属性。\n\
  * `Panel` 的边界可以通过其 `BorderStyle` 属性来指定。可用设置有 `None`、`FixedSingle` 和 `Fixed3D`。该属性默认设置为\
  \ `None`，这意味着不会出现边框。如果 `BorderStyle` 属性设置为 `FixedSingle`，控件将用细边框勾轮勒。如果 `BorderStyle`\
  \ 属性设置为 `Fixed3D`，控件将具有凹陷的 3D 视觉效果。\n\n图 3-40 显示了一个带有 `Panel` 的表单示例。`Panel` 的 `BorderStyle`\
  \ 属性设置为 `Fixed3D`。左侧图像显示了表单在设计器中的外观，右侧图像显示了表单在运行时的外观。\n\n## 图 3-40 包含其他控件的 Panel\n\
