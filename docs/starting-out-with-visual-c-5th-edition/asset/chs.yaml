  \n在你目前为止编写的程序中，你已经使用变量在内存中存储数据。在内存中存储值的最简单方法是存储在变量中。变量在许多情况下运行良好，但它们也有局限性。例如，它们一次只能包含一个值。考虑以下变量声明：\n\
  \n```\nint number = 99;\n```\n\n考虑如果程序稍后出现以下语句，会发生什么：\n\n```\nnumber = 5;\n```\n\
  \n该语句将值 5 赋值给 `number`，替换了之前存储在那里的值 99。由于 `number` 是一个普通变量，它一次只能包含一个值。\n\n由于变量只持有单个值，因此在处理数据列表的程序中，它们可能会非常繁琐。例如，假设你被要求写一个存储\
  \ 50 名员工名称的程序。想象声明 50 个变量来保存所有这些名称：\n\n```\nstring employee1;\nstring employee2;\n\
  string employee3;\n```\n*以此类推 . . .* .*\n\n```\nstring employee50\n```\n\n然后，想象编写处理所有\
  \ 50 个名称的代码。例如，如果你想在 `ListBox` 中显示变量的内容，你会编写如下代码：\n\n```\nemployeeListBox.Items.Add(employee1);\
  \   // 显示员工 1\nemployeeListBox.Items.Add(employee2);   // 显示员工 2\nemployeeListBox.Items.Add(employee3);\
  \   // 显示员工 3\n```\n*以此类推 . . .* .*\n\n```\nemployeeListBox.Items.Add(employee50);\
  \  // 显示员工 50\n```\n\n如你所示，变量并不适用于存储和处理数据列表。每个变量都是一个独立的项，必须单独声明并逐一处理。\n\n幸运的是，你可以使用数组作为一组变量的替代方案。数组是一个对象，可以容一组相同数据类型的值。你可以拥有\
  \ `int` 值的数组、`double` 值的数组、`decimal` 值的数组或 `string` 值的数组，但你不能在数组中存储混合的数据类型。一旦你创建了数组，就可以编写简单高效的代码来处理存储在其中的值。\n\
  \n数组是引用类型对象。回想第 7.1 节中的内容，`Random` 类允许你的程序生成随机数。以下是以下两个步骤从 `Random` 类创建对象的示例：\n\n\
  1. 你声明一个引用变量。\n2. 你创建一个对象并将其与引用变量关联。\n\n在执行这些步骤后，`rand` 变量将引用一个 `Random` 对象，如图 7-5\
  \ 所示。随后，可以使用 `rand` 变量对该对象执行操作，例如生成随机数。\n\n`new` 运算符也返回它创建的对象的引用。在上述语句中，`new` 运算符创建一个\
  \ `int` 数组并返回该对象的引用。`=` 运算符将该引用赋值给 `rand` 变量。在该语句执行执行，`randrand  变量将引用 ` `int` 数组。这所示图\
  \ 7-6 所示。\n\n# 图 7-6 `rand` 变量引用一个 `int` 数组\n\n![一张图说明了 rand 变量引用一个 int 数组。一个标记为“rand\
  \ variable”的小框连接到一个被分为六个相等部分的矩形框，标记为“Array that can hold six values.”](img/FG_0706)\n\
  \n在之前的示例中，我们使用了两个语句来 (1) 声明引用变量和 (2) 创建数组对象。这两个步骤可以合并为一个语句，如下所示：\n\n```\nint[] numbersArray\
  \ = new int[6];\n```\n\n你可以创建任何数据类型的数组。以下都是有效的数组声明：\n\n```\ndouble[] temperatures\
  \ = new double[100];\ndecimal[] prices = new decimal[50];\nstring[] nameArray =\
  \ new string[1200];\n```\n\n数组的大小声明符必须是一个非负整数表达式。它可以是一个字面量值（如前面的示例所示），也可以是一个变量。然而，首选的做法是使用命名常量作为大小声明符。以下是一个示例：\n\
  \n```\nconst int SIZE = 6;\nint[] numbersArray = new int[SIZE];\n```\n\n\n\n\n这种做法可以使程序更容易维护。正如你在本章稍后部分将看到的，许多数组处理技术都需要你引用数组的大小。当你使用命名常量作为数组的大小声明符时，你就可以在算法中使用该常量来引用数组的大小。如果你以后需要修改程序使数组具有不同的大小，你只需要更改命名常量的值即可。\n\
  \n# 数组元素和下标\n\n数组中的存储位置被称为元素（elements）。在内存中，数组的元素位于连续的内存位置。数组中的每个元素都被分配了一个唯一的数字，被称为下标（subscript）。下标用于标识数组中的特定元素。第一个元素的下标分配为\
  \ `0`，第二个元素的下标分配为 `1`，依此类推。例如，假设程序有以下声明：\n\n```\nconst int SIZE = 5;\nint[] numbersArray\
  \ = new int[SIZE];\n```\n\n如图 7-7 所示，`numbersArray` 引用的数组有五个元素。这些元素被分配了下标 `0–4`。（由于下标从\
  \ `0` 开始计数，数组最后一个元素的下标比数组元素的总数少 1。）\n\n# 图 7-7 数组下标\n\n![一张图说明了 numbersArray 变量引用一个具有五个元素的\
  \ int 数组。](img/FG_07_007.png)图 7-7 完整备用文本\n\n# 数组元素的默认值\n\n注意图 7-7 显示数组的每个元素包含值\
  \ `0`。当你在 C# 中创建数值数组时，它的元素默认被设置为值 `0`。\n\n记住，你可以创建一个数组来存放任何类型的值。创建一个引用类型对象的数组是完全可能的。如果你创建一个引用类型对象的数组，数组的每个元素都充当引用变量。默认情况下，引用类型对象数组的元素被设置为特殊值\
  \ `null`。值 `null` 表示引用变量未设置为有效对象，且不能用于任何有意义的用途。\n\n### 注意\n\n正如你在第 8 章中看到的，字符串实际上是引用类型，因此\
  \ `string` 数组元素的默认值是 `null`。\n\n# 操作数组元素\n\n你通过使用下标来访问数组中的单个元素。例如，以下代码创建了一个具有五个元素的\
  \ `int` 数组，并为它的每个元素赋值。\n\n```c\n const int SIZE = 5;\nint[] numbersArray = new int[SIZE];\n\
  numbersArray[0] = 20;\nnumbersArray[1] = 30;\nnumbersArray[2] = 40;\nnumbersArray[3]\
  \ = 50;\nnumbersArray[4] = 60;\n```\n\n此代码将值 `20` 分配给元素 `0`，将值 `30` 分配给元素 `1`，依此类推。图\
  \ 7-8 显示了这些语句执行后数组的内容。\n\n# 图 7-8 分配给每个元素的值\n\n![一张图说明了 numbersArray 变量引用一个具有五个元素的\
  \ int 数组。](img/FG_07_008.png)图 7-8 完整备用文本\n\n### 注意\n\n表达式 `numbersArray[0]` 的读音为“numbersArray\
  \ sub zero”。\n\n以下代码展示了另一个示例。它创建了一个具有三个元素的 `string` 数组，并为它的每个元素分配字符串。\n\n```c\n\
  \ const int SIZE = 3;\nstring[] names = new string[SIZE];\nnames[0] = \"Chris\"\
  ;\nnames[1] = \"Laurie\";\nnames[2] = \"Joe\";\n```\n\n下面的代码示例显示了如何将值从 `TextBox`\
  \ 控件赋值给数组元素。假设应用程序表单有三个名为 `amount1TextBox`、`amount2TextBox` 和 `amount3TextBox` 的\
  \ `TextBox` 控件，并且用户已经在每个控件中输入了一个数值。以下代码创建一个名为 `amounts` 的 `decimal` 数组，并将每个 `TextBox`\
  \ 控件的输入值赋值给数组元素。\n\n```csharp\nconst int SIZE = 3;\ndecimal[] amounts = new decimal[SIZE];\n\
  amounts[0] = decimal.Parse(amount1TextBox.Text);\namounts[1] = decimal.Parse(amount2TextBox.Text);\n\
  amounts[2] = decimal.Parse(amount3TextBox.Text);\n```\n\n让我们来看完整的程序，它演示了如何给数组赋值，然后显示数组中的值。在本书的\
  \ Student Sample Programs 的 *Chap07* 文件夹中，你会找到名为 *Display Elements* 的项目。图 7-9 显示了应用程序的表单。\n\
  \n# 图 7-9 *Display Elements* 应用程序的表单\n\n![截图显示了 Display Elements 应用程序表单的窗口。](img/FG_07_009.png)图\
  \ 7-9 完整备用文本\n\n这里是 `getNames_Click` 事件的代码：\n\n```csharp\nprivate void getNames_Click(object\
  \ sender, EventArgs e)\n{\n    // 创建一个字符串数组。\n    string[] names = new string[3];\n\
  \n    // 从 TextBox 控件获取名称。\n    names[0] = amount1TextBox.Text;\n    names[1] =\
  \ amount2TextBox.Text;\n    names[2] = amount3TextBox.Text;\n\n    // 显示名称。\n  \
  \  MessageBox.Show(names[0]);\n    MessageBox.Show(names[1]);\n    MessageBox.Show(names[2]);\n\
  }\n```\n\n运行应用程序，在每个 TextBox 控件中输入名称，然后点击 *Get* 按钮。发生了以下操作：\n\n*   在第 5 行，创建了数组。\n\
  *   在第 8-10 行，你输入的名称被赋值了。\n*   在第 13-15 行，显示了每个元素。\n\n# 数组初始化\n\n当你创建数组时，可以选择使用一组值对其进行初始化。例如：\n\
  \n```csharp\nconst int SIZE = 5;\nint[] numbersArray = new int[SIZE] { 10, 20, 30,\
  \ 40, 50 };\n```\n\n括号内用逗号分隔的一系列值被称为初始化列表（initialization list）。这些值按照它们在列表中顺序存储在数组元素中。（第一个值\
  \ `10` 存储在 `numbersArray[0]`，第二个值 `20` 存储在 `numbersArray[1]`，依此类推。）\n\n当你提供了初始化列表时，可以省略大小声明符。编译器根据初始化列表中的项数确定数组的大小。例如：\n\
  \n```csharp\nint[] numbersArray = new int[] { 10, 20, 30, 40, 50 };\n```\n\n在此示例中，编译器确定数组应该有五个元素，因为初始化列表中出现了五个值。\n\
  \n当提供了初始化列表时，你也可以省略 `new` 运算符及其随后的表达式。例如：\n\n```csharp\nint[] numbersArray = { 10,\
  \ 20, 30, 40, 50 };\n```\n\n以下是三个独立的示例，声明并初始化了一个名为 `days` 的 `string` 数组。这些示例的结果都是相同的数组：\n\
  \n\n\n\n\n```\n // Example 1\nconst int SIZE = 7;\nstring[] days = new string[SIZE]\
  \ = { \"Sunday\", \"Monday\",\n                     \"Tuesday\", \"Wednesday\",\
  \ \"Thursday\",\n                     \"Friday\", \"Saturday\" };\n// Example 2\n\
  string[] days = new string[] = { \"Sunday\", \"Monday\",\n                 \"Tuesday\"\
  , \"Wednesday\", \"Thursday\",\n                 \"Friday\", \"Saturday\" };\n//\
  \ Example 3\nstring[] days = { \"Sunday\", \"Monday\", \"Tuesday\",\n          \
  \        \"Wednesday\", \"Thursday\", \"Friday\",\n                  \"Saturday\"\
  \ };\n```\n\n# 使用循环遍历数组\n\n你可以将一个数字存储在 `int` 变量中，然后将该变量用下标。这使得可以使用循环来遍历数组，并对每个元素执行相同的操作。例如，请看下面的代码示例：\n\
  \n```\n 1 // 创建用于存储三个整数的数组。\n2 const int SIZE = 3;\n3 int[] myValues = new int[SIZE];\n\
  4\n5 // 将 99 赋值给每个数组元素。\n6 for (int index = 0; index < SIZE; index++)\n7 {\n8  \
  \    myValues[index] = 99;\n9 }\n```\n\n第 3 行创建了一个名为 `myValues` 的具有三个元素的 `int` 数组。第\
  \ 6 行开始的 `for` 循环使用名为 `index` 的 `int` 变量作为计数器。`index` 变量初始化为 0，并在每次循环迭代后递增。只要 `index`\
  \ 小于 3，循环就会继续。因此，循环将迭代三次。在迭代过程中，`index` 变量被赋值为 0、1 和 2。\n\n在循环内部，第 8 行的语句使用 `index`\
  \ 变量作为下标将值 99 赋值给数组元素。循环迭代时发生如下：\n\n*   循环第一次迭代时，`index` 被设置为 0，因此将 99 赋值给 `myValues[0]`。\n\
  *   循环第二次迭代时，`index` 被设置为 1，因此将 99 赋值给 `myValues[1]`。\n*   循环第三次迭代时，`index` 被设置为\
  \ 2，因此将 99 赋值给 `myValues[2]`。\n\n# 无效下标\n\n在处理数组时，不要使用无效下标是非常重要的。你不能使用小于 0 或大于数组大小减\
  \ 1 的下标。例如，假设一个数组有 100 个元素。该数组的有效下标是整数 0 到 99。如果你尝试使用此范围之外的任何值，将在运行时抛出异常。代码示例演示了编写不当的循环如何导致抛出此类异常：\n\
  \n```\n 1 // 创建用于存储三个整数的数组。\n2 const int SIZE = 3;\n3 int[] myValues = new int[SIZE];\n\
  4\n5 // 此循环会导致异常吗？\n6 for (int index = 0; index <= SIZE; index++)\n7 {\n8     myValues[index]\
  \ = 99;\n9 }\n```\n\n注意 `for` 循环只要 `index` 小于等于 3 就会迭代。在循环的最后一次迭代中，`index` 被设置为\
  \ 3，因此第 8 行的语句试图对 `myValues[3]` 进行赋值。数组中没有下标为 3 的元素，因此将抛出异常。\n\n# \n\n在 C# 中，所有数组都有一个\
  \ `Length` 属性，其值设置为数组中的元素数量。例如，考虑由以下语句创建的数组：\n\n```\ndouble[] temperatures = new\
  \ double[25];\n```\n\n`temperatures` 数组的 `Length` 属性将被设置为 25。如果我们执行以下语句，它将显示消息“The\
  \ temperatures array has 25 elements.”\n\n```\n MessageBox.Show(\"The temperatures\
  \ array has \" +\n     temperatures.Length + \" elements.\");\n```\n\n当使用循环处理数组的所有内容时，`Length`\
  \ 属性非常有用。最后一个元素的下标始终比数组的 `Length` 属性少 1。这是一个示例：\n\n```\n for (int index = 0; index\
  \ < temperatures.Length; index++)\n{\n    MessageBox.Show(temperatures[index].ToString());\n\
  }\n```\n\n### 注意\n\n数组的 `Length` 属性是只读的，因此你不能更改它的值。\n\n在 `Tutorial 7-1` 中，你完成了一个生成类似于彩票随机随机数的应用程序。这些数字将存储在数组中。\n\
  \n# 关注差一错误 (Off-by-One Errors)\n\n由于数组下标从 0 开始而不是 1，所以你必须小心避免差一错误。当循环迭代过多一次或少于一次时，就会发生差一错误。例如，请看下面的代码示例：\n\
  \n```\n 1 // 创建用于存储三个整数的数组。\n2 const int SIZE = 100;\n3 int[] myValues = new int[SIZE];\n\
  4\n5 // 将 99 赋值给每个数组元素。\n6 for (int index = 0; index < SIZE; index++)\n7 {\n8  \
  \   myValues[index] = 99;\n9 }\n```\n\n`for` 循环只要 `index` 小于等于 3 就会迭代。在循环的最后一次迭代中，`index`\
  \ 被设置为 3，因此第 8 行的语句试图对 `myValues[3]` 进行赋值。数组中没有下标为 3 的元素，因此将抛出异常。\n\n# 使用 foreach\
  \ 循环遍历数组\n\n由于数组下标从 0 开始而不是 1，你必须小心不要发生差一错误。`foreach` 循环的设计初衷在很多情况下简化了数组处理。C# 提供了一种特殊的循环，它在很多情况下简化了数组处理。它被称为\
  \ `foreach` 循环。由于 `foreach` 循环自动知道数组中的元素数量，你不需要使用计数器变量来控制迭代，就像使用 `for` 循环一样。每次 `foreach`\
  \ 循环迭代时，它会将一个数组元素复制到迭代变量。例如，第一次迭代时，迭代变量将包含元素 0 的值，第二次迭代时，它将包含元素 1 的值，以此类推。\n\n这是\
  \ `foreach` 循环的通用格式：\n\n```\nforeach(Type VariableName in ArrayName)\n{\n     statement;\n\
  \     statement;\n     etc.\n}\n```\n\n大括号内的语句是循环体。这些是在循环每次迭代时执行的语句。让我们仔细查看圆括号内出现的项：\n\
  \n*   `Type` 是数组中值的数据类型。\n*   `VariableName` 是迭代变量的名称。\n*   `in` 是必须出现在 `VariableName`\
  \ 之后的关键字。\n*   `ArrayName` 是数组的名称。\n\n假设我们有以下数组声明：\n\n```\nint[] numbers = { 3,\
  \ 6, 9 };\n```\n\n我们可以使用下面的 `foreach` 循环显示 `numbers` 数组的内容：\n\n```\nforeach (int\
  \ val in numbers)\n{\n    MessageBox.Show(val.ToString());\n}\n```\n\n由于 `numbers`\
  \ 数组有三个元素，此循环将迭代三次。第一次迭代时，`val` 将包含 `numbers[0]` 的值，因此消息框将显示 3。在第二次迭代时，`val` 将包含\
  \ `numbers[1]` 的值，因此消息框将显示 6。第三次迭代时，`val` 将包含 `numbers[2]` 的值，因此消息框将显示 9。\n\n# `foreach`\
  \ 循环与 `for` 循环的对比\n\n\n\n\n当你需要从第一个元素到最后一个元素读取数组中存储的值时，`foreach` 循环比 `for` 循环更易于使用。使用\
  \ `foreach` 循环，你不需要担心数组的大小，也不需要创建一个计数器变量来保存下标；然而，由于迭代变量是只读的，在某些情况下 `foreach` 循环并不够用。如果你需要执行以下任何操作，就不能使用\
  \ `foreach` 循环：\n\n*   修改数组元素的内容\n*   按反序处理数组元素\n*   访问数组的某些元素而非全部元素\n*   在循环中同时处理两个或多个数组\n\
  \n在这些任何一种情况下，你都应该使用 `for` 循环来处理数组。\n\n# 重新赋值数组引用变量\n\n可以将数组引用变量重新赋值为不同的数组，如下面的代码示例所示：\n\
  \n```\n 1 // 创建一个由 numbers 变量引用的数组。\n2 int[] numbers = new int[6];\n3\n4 // 将 numbers\
  \ 变量重新赋值为一个新数组。\n5 numbers = new int[3];\n```\n\n第 2 行的语句创建了一个六个元素的 `int` 数组。该数组的引用被分配给\
  \ `numbers` 变量。图 7-11 显示了在该语句执行后，`numbers` 变量如何引用六个元素的数组。\n\n# 图 7-11 `numbers`\
  \ 变量引用六个元素的数组\n\n![一张图说明了 numbers 变量引用一个六个元素的数组。一个标记为“numbers variable”的小框连接到一个被分为六个等部分的矩形框，标记为“可以存储六个\
  \ int 值的数组”。](img/FG_07_011.png)\n\n然后，第 5 行的语句创建了一个新的三元素 `int` 数组。新数组的引用被分配给 `numbers`\
  \ 变量。当第 5 行执行时，当前存储在 `numbers` 变量中的引用将被替换为指向三元素数组的引用。在该语句执行后，`numbers` 变量将引用三元素数组而不是六元素数组。这在图\
  \ 7-12 中所示。\n\n# 图 7-12 `numbers` 变量引用三元素数组\n\n![一张图说明了 numbers 变量引用一个三元素的数组。](img/FG_07_012.png)图\
  \ 7-12 完整备用文本\n\n注意图 7-12，六元素数组仍然存在于内存中，但它不再被任何变量引用。由于它不再被引用，它就无法被访问。当一个对象不再被引用时，它就符合垃圾回收条件。垃圾回收是一个定期运行的过程，用于从内存中移除所有未引用的对象。\n\
  \n# 检查点\n\n1.  7.5 写一条语句，声明一个名为 `monthlyPay` 的引用变量，用于一个可以存储 `decimal` 值的数组。\n2.\
  \  7.6 写一条语句，使检查点 7.5 中的 `monthlyPay` 变量引用一个可以存储 12 个值的 `decimal` 数组。\n3.  7.7 将检查点\
  \ 7.5 和 7.6 中的语句合并为单一语句，并使用命名常量作为大小声明符。\n4.  7.8 写一条语句，创建一个由名为 `fullName` 的变量引用的包含\
  \ 3 个 `string` 值的数组。使用代表名、中间名和姓的字符串值为数组提供初始化列表。\n5.  7.9 在什么情况下，你应该使用 `for` 循环而不是\
  \ `foreach` 循环来处理存储在数组中的数据？\n6.  7.10 当像数组这样的对象不再被变量引用时会发生什么？\n\n# 7.3 文件与数组处理器\n\
  \n### 概念\n\n对于某些问题，文件和数组可以有效地结合使用。你可以轻松编写一个循环，将数组的内容保存到文件中，反之亦然。\n\n某些任务可能需要你将数组的内容保存到文件中，以便稍后使用这些数据。同样，某些情况可能需要你将数据从文件读取到数组。例如，假设你有一个包含一组值的文件，你想反转这些值的顺序。实现此操作的技术之一是将文件的值读入数组，然后从数组的末尾到开头将数组中的值写回文件。\n\
  \n# 将数组写入文件\n\n将数组写入文件是一个简单的程序：打开文件并使用循环遍历数组的每个元素。在 `Chap07` 章节，以下代码显示了 `OK` 按钮的事件处理程序：\n\
  \n```\n1 private void okButton_Click(object sender, EventArgs e)\n2     try\n3 \
  \    {\n4         // 创建包含某些值的数组。\n5         int[] numbers = { 10, 20, 30, 40, 50\
  \ };\n6\n7         // 声明 StreamWriter 变量。\n8         StreamWriter outputFile;\n\
  9\n10        // 创建文件并获取 StreamWriter 对象。\n11        outputFile = File.CreateText(\"\
  Values.txt\");\n12\n13        // 将数组的内容写入文件。\n14        for (int index = 0; index\
  \ < numbers.Length; index++)\n15        {\n16            outputFile.WriteLine(numbers[index]);\n\
  17        }\n18\n19        // 关闭文件。\n20        outputFile.Close();\n21\n22     \
  \   // 通知用户已完成。\n23        MessageBox.Show(\"Done\");\n24    }\n25    catch (Exception\
  \ ex)\n26    {\n27        // 显示错误消息。\n28        MessageBox.Show(ex.Message);\n29\
  \    }\n30 }\n```\n\n`try`-`catch` 语句处理任何文件错误。以下是 try 块内部的代码摘要：\n\n*   第 6 行创建一个包含五个值的\
  \ `int` 数组。\n*   第 9 行声明一个名为 `outputFile` 的 `StreamWriter` 变量。（你在此代码中没有看到它，但在文件顶部使用了\
  \ `System.IO;` 指令。这是第 9 行 `StreamWriter` 声明所必需。）\n*   第 12 行创建一个名为 `Values.txt`\
  \ 的文件在该语句执行后，`outputFile` 变量将引用与文件相关的 `StreamWriter` 对象。\n*   第 14 行是 `for` 循环的开始。循环为数组的每个元素执行一次。在循环期间，`index`\
  \ 变量将被赋值 0, 1, 2, 3 和 4。\n*   第 16 行将数组元素 `numbers[index]` 写入文件。\n*   第 20 行关闭文件。\n\
  *   第 23 行显示一个消息框，通知用户操作完成。\n\n\n\n将文件内容读取到数组也是同样简单：打开文件并使用循环从文件中读取每个项目，并将每个项目存储在数组元素中。循环将一直迭代，直到数组填充或到达文件末尾。例如，在学生示例程序（Student\
  \ Sample Programs）的 `Chap07` 文件夹中，你会找到名为 `File To Array` 的项目。当你点击 `Get Values` 按钮时，应用程序从名为\
  \ `Values.txt` 的文件中读取值到 `int` 数组中。然后将数组的内容显示在列表框中。以下代码显示了 `Get Values` 按钮的 Click\
  \ 事件处理器。\n\n```\n 1 private void getValuesButton_Click(object sender, EventArgs\
  \ e)\n 2 {\n 3     try\n 4     {\n 5         // Create an array to hold items read\
  \ from the file.\n 6         const int SIZE = 5;\n 7         int[] numbers = new\
  \ int[SIZE];\n 8\n 9         // Counter variable to use in the loop\n10        \
  \ int index = 0;\n11\n12                   Declare a StreamReader variable.\n13\
  \         StreamReader inputFile;\n14\n15         // Open the file and get a StreamReader\
  \ object.\n16         inputFile = File.OpenText(\"Values.txt\");\n17\n18       \
  \  // Read the file's contents into the array.\n19         while (index < numbers.Length\
  \ && !inputFile.EndOfStream)\n20         {\n21             numbers[index] = int.Parse(inputFile.ReadLine());\n\
  22             index++;\n23         }\n24\n25         // Close the file.\n26   \
  \      inputFile.Close();\n27\n28         // Display the array elements in the list\
  \ box.\n29         foreach (int value in numbers)\n30         {\n31            \
  \ outputListBox.Items.Add(value);\n32         }\n33     }\n34     catch (Exception\
  \ ex)\n35     {\n36         // Display an error message.\n37         MessageBox.Show(ex.Message);\n\
  38     }\n39 }\n```\n\n`try`-`catch` 语句处理任何与文件相关的错误。以下是 try 块内内部代码的摘要：\n\n* 第 6\
  \ 行和第 7 行创建了一个具有五个元素的 `int` 数组。\n* 第 10 行声明了一个名为 `index` 的 `int` 变量，并值为 0。该变量将在循环中使用以存储下标值。\n\
  * 第 13 行声明了一个名为 `inputFile` 的 `StreamReader` 变量。（你在此代码示例中没有看到它，但使用 `System.IO;`\
  \ 的指令出现在文件顶部。这是第 13 行中 `StreamReader` 声明所必需的。）\n* 第 16 行打开名为 `Values.txt` 的文件进行读取。在该语句执行后，`inputFile`\
  \ 变量将引用与文件相关的 `StreamReader` 对象。\n* 第 19 行是 `while` 循环的开始，该循环从文件中读取项目并将其赋值给 `numbers`\
  \ 数组的元素。注意，循环测试了两个由 `&&` 运算符连接的布尔表达式。第一个表达式是 `index < numbers.Length`。该表达式的目的是防止循环写入数组末尾之外。当数组满时，循环停止。第二个表达式是\
  \ `!inputFile.EndOfStream`。该表达式的目的是防止循环读取到文件末尾之外。当文件中没有更多可读值时，循环停止。\n* 在循环内部，第 21\
  \ 行从文件中读取一行文本，将其转换为 `int`，并将该 `int` 赋值给 `numbers[index]`。然后，第 22 行增加 `index`。\n\
  * 第 26 行关闭文件。\n* 第 29–32 行中的 `foreach` 循环在 `outputListBox` 控件中显示数组元素。\n\n图 7-14\
  \ 显示了点击 `Get Values` 按钮后的应用程序表单。\n\n# 图 7-14 `File To Array` 表单\n\n![窗口截图显示了文件到数组表单，在五行中列出了数字\
