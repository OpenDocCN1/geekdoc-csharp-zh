  \ `if-else-if`，它使得这种逻辑编写更加简单。使用以下通用格式编写 `if-else-if` 语句：\n\n![截图显示了“if”和“else”子句对齐在一起。](img/FG_04_014.png)图\
  \ 4-14 完整替代文本\n\n当 `if-else-if` 语句执行时，会测试 `BooleanExpression1`。如果 `BooleanExpression1`\
  \ 为真，则执行后续语句并跳过剩余部分。然而，如果 `BooleanExpression1` 为假，程序将跳转到下一个 `else if` 子句测试 `BooleanExpression2`。如果\
  \ `BooleanExpression2` 为真，则执行后续语句并跳过剩余部分。这个过程一直持续直到找到真的布尔表达式，或者没有更多的 `else if` 子句。如果所有布尔表达式都为假，则执行最后一个\
  \ `else` 子句后的语句。\n\n例如，查看本书学生示例程序中 `Chap04` 文件夹下的 `Grader` 应用程序。它的表单与之前讨论的图 4-15\
  \ 相同。该应用程序的 `determineGradeButton_Click` 事件处理器所示：\n\n```\n 1 private void determineGradeButton_Click(object\
  \ sender, EventArgs e)\n 2 {\n 3     try\n 4     {\n 5         // Variable to hold\
  \ the score.\n 6         double testScore;\n 7\n 8         // Get the test score.\n\
  \ 9         testScore = double.Parse(testTextBox.Text);\n10\n 11         // Determine\
  \ the grade.\n 12         if (testScore < 60)\n 13         {\n 14             gradeLabel.Text\
  \ = \"F\";\n 15         }\n 16         else if (testScore < 70)\n 17         {\n\
  \ 18             gradeLabel.Text = \"D\";\n 19         }\n 20         else if (testScore\
  \ < 80)\n 21         {\n 22             gradeLabel.Text = \"C\";\n 23         }\n\
  \ 24         else if (testScore < 90)\n 25         {\n 26             gradeLabel.Text\
  \ = \"B\";\n 27         }\n 28         else\n 29         {\n 30             gradeLabel.Text\
  \ = \"A\";\n 31         }\n 32     }\n 33     catch (Exception ex)\n 34     {\n\
  \ 35         // Display an error message.\n 36         MessageBox.Show(ex.Message);\n\
  \ 37     }\n 38 }\n```\n\n注意在使用 `if-else-if` 语句时使用的对齐和缩进：`if`、`else if` 和 `else`\
  \ 子句全部对齐，而条件执行的语句是缩进的。\n\n你永远不需要使用 `if-else-if` 语句，因为其逻辑可以通过嵌套的 `if-else` 语句来实现；但是，长系列嵌套\
  \ `if-else` 语句在调试代码时有两个特别的缺点：\n\n*   代码可能会变得复杂且难以理解。\n\n\n\n\n\n- 因为缩进在嵌套语句中至关重要，一系列嵌套的\
  \ `if-else` 语句可能会变得过长，导致在不水平滚动的情况下无法在计算机屏幕上显示。此外，长语句在纸打印运行时会换行，使得代码变得更加难以阅读。\n\n\
  `if-else-if` 语句的逻辑通常比一系列嵌套的 `if-else` 语句更容易理解。而且，由于 `if-else-if` 语句中的所有子都是对齐的，语句中行的长度往往更短。\n\
  \n# 检查点\n\n1. 4.11 将以下嵌套的 `if-else` 语句转换为 `if-else` `if` 语句：\n\n```c\n if (number\
