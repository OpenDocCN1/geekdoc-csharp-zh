  | `Purchase_Price` | `money` |\n| `Selling_Price` | `money` |\n\n同时假设已使用以下语句创建了数据上下文对象：\n\
  \n```\nStockDataContext db = new StockDataContext();\n```\n\n5. 编写一个 `LINQ to SQL`\
  \ 查询，返回表中每行的所有列。\n\n6. 编写一个 `LINQ to SQL` 查询，仅返回表中每行的 `Trading_Symbol` 列。\n\n7.\
  \ 编写一个 `LINQ to SQL` 查询，仅从 `Purchase_Price` 大于 $50.00 的行返回 `Company_Name` 列。\n\n\
  8. 编写一个 `LINQ to SQL` 查询，仅从 `Selling_Price` 大于 `Purchase_Price` 且 `Num_Shares` 大于\
  \ 100 的行返回 `Trading_Symbol` 列。\n\n# 编程题\n\n1. 唯一单词\n\n创建一个应用程序，打开指定的文本文件，然后显示文件中找到的所有唯一单词的列表。*提示：使用\
  \ `LINQ` 方法移除所有重复单词。*\n\n2. 文本文件分析\n\n创建一个应用程序，读取两个文本文件的内容并使用 `LINQ` 扩展方法执行以下操作：\n\
  \n* 它应该显示两个文件中包含的所有唯一单词的列表。\n* 它应该显示在两个文件中都出现的单词列表。\n* 它应该显示出现在第一个文件但不在第二个文件中的单词列表。\n\
  * 它应该显示出现在第二个文件但不在第一个文件中的单词列表。\n* 它应该显示出现在第一个或第二个文件中、但不同时出现在两个文件中的单词列表。\n\n提示：*使用集合操作来执行这些分析。*\
  \ \n\n3. 油价\n\n在本章的学生示例程序文件中，你将找到一个名为 `GasPrices.txt` 的文本文件。该文件包含了从 1993 年 4 月 5\
  \ 日开始到 2013 年 8 月 26 日美国加仑汽油的每周平均价格。图 14-27 显示了文件内容前几行的示例：\n\n# 图 14-27 GasPrices.txt\
  \ 文件\n\n![记事本截图显示了不同日期的油价。](img/FG_14_027.png)\n\n文件中的每一行都包含特定日期每加仑汽油的平均价格。每行的格式如下：\n\
  \n```\nMM-DD-YYYY:Price\n```\n\n对于此作业，你需要创建一个或多个应用程序来读取 `GasPrices.txt` 的内容，并使用\
  \ `LINQ` 执行以下操作：\n\n* 每年平均价格：计算每年的平均价格。\n* 每月平均价格：计算每个月的平均价格。\n* 每年最高最低价：确定最高和最低价格。\n\
  * 价格列表（从低到高）：生成一个文本文件，按价格从低到高出日期和价格。\n* 价格列表（从高到低）：生成一个文本文件，按价格从高到低出日期和价格。\n\n4.\
  \ 产品搜索\n\n在学生示例程序的 `Chap14` 文件夹中，你将找到第 8 章过的 `ProductDB` 数据库副本。该数据库有一个名为 `Product`\
  \ 的表。`Product` 表具有以下列：\n\n* `Product_Number` – `nchar(5)`,主键，不允许为空\n* `Description`\
  \ – `nvarchar(50)`,不允许为空\n* `Units_On_Hand` – `int`,不允许为空\n* `Price` – `money`,不允许为空\n\
  \n创建一个应用程序连接到数据库并使用 `LINQ to SQL` 让用户执行以下搜索：\n\n* 搜索 `Product_Number`\n* 搜索包含指定文本的描述\n\
  \n5. 产品库存搜索\n\n创建一个应用程序连接到 `ProductDB` 数据库（见编程题 4）。该应用程序应使用 `LINQ to SQL` 与数据库交互。它初始按\
  \ `Units_On_Hand` 升序显示数据库中的所有产品。它允许用户搜索库存大于指定数量和小于指定数量的产品。\n\n6. 产品价格搜索\n\n创建一个应用程序连接到\
  \ `ProductDB` 数据库（见编程题 4）。该应用程序应使用 `LINQ to SQL` 与数据库交互。它初始按 `Price` 升序显示数据库中的所有产品。它允许用户指定最低和最高价格，然后显示该价格范围的产品。\n\
