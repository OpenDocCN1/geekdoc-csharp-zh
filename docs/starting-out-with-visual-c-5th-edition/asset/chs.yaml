  \ 完整替代文本\n\n假设你想让应用程序在用户点击时显示消息 *Thanks for the!*。为了实现这一点，你需要编写一种特殊的方法，称为事件处理器。事件处理器是在事件发生时执行的方法。要创建事件处理器，请在设计器中双击\
  \ `Button` 控件。这将如图 2-33 所示打开 `Form1.cs` 文件。\n# 图 2-33 带事件处理器的代码窗口\n\n![截图显示 Microsoft\
  \ Visual Studio 界面。](img/FG_02_033.png)\n\n当应用程序运行且用户点击控件时，我们说该控件发生了 Click 事件。添加到\
  \ `Form1.cs` 中的代码（如图 2-33)）是一个将执行的事件处理器。现在你不需要理解事件处理器的所有部分。此时，你只需要理解以下：\n\n\n- Visual\
  \ Studio 生成的事件处理器实际上并没有做任何事情。你可以将其认为一个空容器，你可以向其中添加自己的代码。注意事件处理器的第二行是左括号（`{`），最后一行是右括号（`}`）。任何你想在用户点击\
  \ `myButton` 控件时执行的代码都必须写在这些大括号之间。\n\n# 图 2-34 事件处理器代码的细节\n\n现在你知道如何为 `Button` 控件创建一个空的\
  \ Click 事件处理器了。但我们在事件处理器内部编写什么代码呢？在这个示例中，我们编写了在消息框（一种小弹出窗口）中显示消息 *Thanks for clicking\
  \ the button!* 消息的代码。\n\n\n\n\n消息框是一个小窗口，有时被称为对话框，用于显示消息。图 2-35 显示了一个显示显示消息 `Thanks\
  \ for clicking the button!` 的消息框示例。注意，消息框还有一个 `OK` 按钮。当用户点击 `OK` 按钮时，消息框就会关闭。\n\n\
  ## 图 2-35 消息框\n\n![截图显示了一个消息框，显示着消息，“Thanks for clicking the button!”](img/FG_02_035.png)\n\
  \n```\nMessageBox.Show(\"Thanks for clicking the button!\");\n```\n\n\n注意，代码中的字符串被双引号包围。然而，当消息显示时（如图\
  \ 2-35 所示），双引号并不会出现。代码中需要双引号来指示字符串的开始和结束。\n\n还要注意语句末尾有一个分号。这是 C# 语法要求的。正如句号标记句子的结束一样，分号在\
  \ C# 中标记一个编程语句的结束。\n\n## 图 2-36 显示消息框的事件处理程序代码\n\n![截图显示了一个项目的表单，显示了显示消息框的代码](img/FG_02_036.png)图\
