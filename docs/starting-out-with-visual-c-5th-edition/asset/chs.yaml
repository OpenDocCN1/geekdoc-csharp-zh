  \ `name` 字段副本？\n\n# 算法工作\n\n1. 编写一条创建 `Transcript` 类实例的语句。\n2. 为名为 `CustomerNumber`\
  \ 的属性编写访问器（accessors），将一个字符串值赋值给 `_customerNumber` 字段。\n3. 假设应用程序使用以下语句声明了一个类对象数组：\n\
