  \n# 11.5 接口\n\n### 概念\n\n接口指定了类的行为。\n\n接口类似于仅包含抽象方法和/或抽象属性的类。接口不能实例化。相反，它由其他类来实现。当一个类实现接口时，该类必须提供接口所指定的所有方法和属性。\n\
  \n接口的声明看起来与类相似，但使用的是 `interface` 关键字而不是 `class` 关键字，并且接口中指定的方法没有体，只有以分号结尾的头。此外，接口中指定的任何属性都是抽象的，除了\
  \ `get` 和/或 `set` 关键字外，不能包含任何代码。以下是接口定义的通用格式：\n\n```\n public interface InterfaceName\n\
  {\n     // 方法和属性\n}\n```\n\n# 接口是一个合同\n\n当一个类实现接口时，它同意提供接口指定的所有方法和/或属性。人们通常说接口就像一份合同，当类实现接口时，它必须遵守合同。\n\
  \n# 接口中的属性\n\n要记住，接口指定了类必须具备的方法和属性，但接口从不指定类如何实现这些方法和属性。因此，接口中的属性除了 `get` 和/或 `set`\
  \ 关键字外，不能包含任何代码。如果属性同时具有 `get` 和 `set` 关键字，那么实现接口的任何类都必须提供具有 `get` 访问器和 `set` 访问器的属性。\n\
  \n你也可以通过省略 `set` 关键字在接口中指定只读属性。这是一个示例：\n\n```\ninterface IInventory\n{\n    decimal\
  \ Cost { get; }\n}\n```\n\n此接口指定了一个名为 `Cost` 的只读属性。如果类实现了此接口，它也必须提供名为 `Cost` 的只读属性。\n\
  \n### 注意\n\n通常的做法是以 `I` 开头命名接口。\n\n# 在 Visual Studio 中创建接口\n\n要在 Visual Studio 中编写新接口的代码，请按照以下步骤创建接口的源文件并将其添加到项目中：\n\
  \n\n\n\n\n1. 在 Visual Studio 中打开项目，点击菜单栏上的 `Project`；然后选择 `Add New Item...`。\n\n\
  2. 将出现 `Add New Item` 窗口。如图 11-18 所示，在左窗格中选择 `Code`，在中间窗格中选择 `Interface`，并将窗口底部\
  \ `Name` 框中显示的默认名称更改您想要赋予接口的名称。（请确保保留 `.cs` 文件扩展名作为文件名的一部分。）\n\n    ### # 图 11-18\
  \ 添加新项窗口\n\n    ![截图显示了“Add New Item”窗口。](img/FG_11_018.png)图 11-18 完整替代文本\n\n3.\
  \ 点击 `Add` 按钮在项目中创建新的源代码文件。程序 11-17 显示了一个示例。注意，会自动创建一个空接口（第 9–11 行）并将其放在项目的命名空间中。\n\
  \n    在教程 11-5 中，你将学习编写接口步骤，然后创建两个实现该接口的类。\n\n# 实现多个接口\n\n你可能会疑惑为什么既需要抽象类又接口，因为它们非常相似。原因之一是类只能继承一个基类，但\
  \ C# 允许类实现多个接口。当一个类实现多个接口时，它必须提供所有接口都指定的方法和属性。\n\n要在类声明中指定多个接口，只需在冒号后用逗号列出接口名称。以下是一个实现多个接口的类示例：\n\
  \n```\n class MyClass : IDisplayable, IComparable, IRelatable\n{\n}\n```\n\n该类的名称为\
  \ `MyClass`，它实现了三个接口：`IDisplayable`、`IComparable` 和 `IRelatable`。\n\n# 实现接口的派生类\n\
  \n当你声明一个继承自基类并实现接口的类时，基类的名称必须首先出现在派生类头部冒号之后。如果基类名称没有排在第一，将在编译时发生错误。\n\n例如，假设我们有一个名为\
  \ `Person` 的类和一个名为 `IDisplayable` 的接口。以下是名为 `Customer` 的类的声明，它派自 `Person` 类并实现了\
  \ `IDisplayable` 接口：\n\n```\n class Customer : Person, IDisplayable\n{\n}\n```\n\
  \n以下代码显示了名为 `Customer` 的类的声明，它派自 `Person` 类并实现了三个接口：`IDisplayable`、`IComparable`\
  \ 和 `IRelatable`：\n\n```\n class Customer : Person, IDisplayable, IComparable, IRelatable\n\
  {\n}\n```\n\n# 多态与接口\n\n就像创建类类型的引用变量一样，C#允许创建接口类型的引用变量。接口引用变量可以引用任何实现该接口的对象，无论其类类型是什么。这是多态的另一个例子。例如，回想教程\
  \ 11-5 中编写的 `ITossable` 接口以及 `Die` 和 `Coin` 类。查看以下代码段：\n\n```\n 1   ITossable tossable\
  \ = new Die();\n2   tossable.Toss();\n3   MessageBox.Show(tossable.Value.ToString());\n\
  ```\n\n第 1 行创建了一个 `Die` 对象并将该对象赋值给 `tossable` 变量。尽管 `tossable` 是一个 `ITossable` 变量，它也可以引用\
  \ `Die` 对象，因为 `Die` 类实现了 `ITossable` 接口。第 2 行调用 `tossable` 对象的 `Toss` 方法，第 3 行在消息框中显示\
  \ `tossable` 对象的 `Value` 属性。\n\n以下代码段演示了对 `Coin` 对象也可以采取相同的步骤：\n\n```\n 1   ITossable\
  \ tossable = new Coin();\n2   tossable.Toss();\n3   MessageBox.Show(tossable.Value.ToString());\n\
  ```\n\n虽然 `ITossable` 变量可以引用任何实现 `ITossable` 接口的类对象，但该变量对这些对象的操作是有限制的。回想 `ITossable`\
  \ 接口仅指定了两点：一个名为 `Value` 的属性和一个名为 `Toss` 的方法。因此，`ITossable` 变量只能访问 `Value` 属性并调用\
  \ `Toss` 方法，无论该变量引用的对象类型如何。例如，查看以下代码：\n\n```\n 1   ITossable tossable = new Coin();\
  \           // 正常工作\n2   tossable.Toss();                           // 正常工作\n3 \
  \  MessageBox.Show(tossable.Heads);          // 错误！\n```\n\n\n\n\n\n```csharp\n\
  IRetail[] items = {\n    new DigitalSong()\n    {\n        Title = \"Wipe The Tears\
