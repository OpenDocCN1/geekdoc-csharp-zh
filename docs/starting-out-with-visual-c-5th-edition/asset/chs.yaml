  \ 克脂肪 | 脂肪热量百分比：12%（低脂食品） |\n| 500 卡路里，30 克脂肪 | 脂肪热量百分比：54% |\n\n注意：确保卡路里数和脂肪克数不小于\
  \ 0。此外，脂肪热量不能大于总卡路里数。如果发生这种情况，显示错误消息，指示卡路里数或脂肪克数输入错误。\n\n## 11. 时间计算器\n\n创建一个应用程序，允许用户输入秒数，按如下方式工作：\n\
