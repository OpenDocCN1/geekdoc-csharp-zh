  \ Sum = (int a, int b) => a + b;\n    ```\n4.  13.11 Lambda 表达式外部的哪些可以可以访问？\n\n\
  ## 内置委托：`Action`、`Func`、`Predicate`\n\n.NET Framework 提供了一些简化过程的委托类型。到目前为止，你已经了解到实现委托是一个两步过程：首先声明委托，然后创建实例。让我们仔细查看每种：\n\
  \n*   `Action`——调用带有 0 个参数的 `void` 方法\n*   `Func`——调用返回值的方法\n*   `Predicate`——接受一个参数并返回\
  \ `boolean`\n\n当你创建 `Action`、`Func` 或 `Predicate` 委托时，不需要声明委托，因为这些类型是内置的。这是一个使用\
  \ Lambda 表达式创建不接受参数的 `Action` 的示例：\n\n```csharp\nAction DisplayTest = () => MessageBox.Show(\"\
  Testing, 2, 3...\");\n```\n\n我们可以使用匿名方法创建等效的 `Action` 委托，如下：\n\n```csharp\nAction\
  \ DisplayTest = delegate()\n{\n    MessageBox.Show(\"Testing, 2, 3...\");\n};\n\
  ```\n\n在这两个示例中，委托的名字都是 `DisplayTest`。调用此委托时，它会在消息框中显示字符串 \"Testing, 2, 3...\"。无论我们\
  \ Lambda 表达式还是匿名方法，我们这样调用委托：\n\n```csharp\nDisplayTest();\n```\n\n让我们查看演示此 `Action`\
  \ 委托的完整应用程序。\n\n## 向 `Action` 委托传递参数\n\n如果你想向 `Action` 委托传递参数，必须指定委托每个参数的数据类型。这里有一个具有一个\
  \ `string` 类型参数的 `Action` 委托的示例：\n\n```csharp\nAction<string> ShowString = str =>\
  \ MessageBox.Show(str);\n```\n\n在该语句中，委托类型为 `Action<string>`。正如前面提到的，这指定了我们正在创建一个有一个\
  \ `string` 参数的 `Action` 委托。注意 `=` 运算符右侧的 Lambda 表达式有一个名为 `str` 的参数。`str` 参数的数据类型是\
  \ `string`。\n\n\n\n\n\n![截图显示了一个 lambda 表达式版本的带有一个参数的“Action”委托](img/FG_13_004.png)图\
  \ 13-4 完整替代文本\n\n我们可以使用匿名方法来创建一个等等的 `Action<string>` 委托，如下：\n\n```\nAction<string>\
  \ ShowString = delegate(string str)\n{\n    MessageBox.Show(str);\n};\n```\n\n注意，在匿名方法中，我们必须指定两次参数数据类型，如图图\
  \ 13-5 所示。\n\n## 图 13-5 带有一个参数的 `Action` 委托（匿名方法版本）\n\n![截图显示了一个匿名方法版本的带有一个参数的“Action”委托](img/FG_13_005.png)图\
  \ 13-5 完整替代文本\n\n如前所述，`Action`委托可以接受 0 到 16 个参数。这里是一个使用 lambda 表达式创建一个具有两个参数的 `Action`\
  \ 委托的示例：\n\n```\nAction<int, int> ShowSum = (a, b) => {\n    int result = a + b;\n\
  \    MessageBox.Show(result.ToString());\n};\n```\n\n在这条语句中，委托类型为 `Action<int, int>`。这指定我们正在创建一个具有两个参数的\
  \ `Action` 委托，这两个参数都是 `int`。注意，在 `=` 运算符的右侧，lambda 表达式有两个命名为 `a` 和 `b` 的参数。这两个参数都是\
  \ `int` 类型。\n\n这是另一个示例：\n\n```\nAction<string, int> ShowMessage = (str, x) => {\n\
  \    MessageBox.Show(str + x.ToString());\n};\n```\n\n在这条语句中，委托类型为 `Action<string,\
  \ int>`。这指定我们正在创建一个具有两个参数的 `Action` 委托：第一个参数是 `string`，第二个参数是 `int`。注意，在 `=` 运算符的右侧，lambda\
  \ 表达式有两个命名为 `str` 和 `x` 的参数。`str` 参数是 `string`，`x` 参数是 `int`。\n\n一个 `Action` 委托可以多有\
  \ 16 个参数。你只需要在括号内按照参数声明的顺序列出每个参数的数据类型。例如，下面的代码创建了一个带有四个参数的 `Action` 委托：\n\n```\n\
  Action<int, double, string> ShowValues = (a, b, c) => {\n    MessageBox.Show(a.ToString()\
  \ + b.ToString() + c);\n};\n```\n\n在代码代码中，参数 `a` 是 `int`，参数 `b` 是 `double`，参数 `c`\
  \ 是 `string`。\n\n## `Func` 委托\n\n你可以使用 `Func` 委托来调用接受 0 到 16 个参数的返回值方法。这里有一个如何使用\
  \ lambda 表达式创建一个不接受参数并返回 `string` 的 `Func` 委托的示例：\n\n```\nFunc<string> GetString\
  \ = () => \"This is a test.\";\n```\n\n我们可以使用匿名方法来创建一个等等的 `Action` 委托，如下：\n\n```\n\
  Func<string> GetString = delegate()\n{\n    return \"This is a test.\";\n};\n```\n\
  \n在这两个示例中，委托名称都是 `GetString`。当此委托被调用时，它会返回字符串 `\"This is a test.\"`。这里有一个我们如何调用该方法的示例：\n\
  \n```\nMessageBox.Show(GetString());\n```\n\n此条语句将在消息框中显示字符串 `\"This is a test.\"\
  `。\n\n## 向 `Func` 委托传递参数\n\n如果你想向 `Func` 委托传递参数，你必须指定委托每个参数的数据类型，以及委托返回的值的数据类型。这里有一个创建一个返回\
  \ `double` 且具有一个 `int` 类型参数的 `Func` 委托的示例：\n\n```\nFunc<int, double> Half = x =>\
  \ x * 0.5;\n```\n\n在括号内，`int` 是参数 `x`的数据类型，`double` 是委托的返回类型。如图图 13-6 所示。\n\n##\
  \ 图 13-6 带有一个参数的 `Func` 委托（lambda 表达式版本）\n\n![截图显示了一个 lambda 表达式版本的带有一个参数的“Func”委托](img/FG_13_006.png)图\
  \ 13-6 完整替代文本\n\n我们可以使用匿名方法来创建一个等等的 `Func<int, double>` 委托，如下：\n\n```\nFunc<int,\
  \ double> Half = delegate(int x)\n{\n    return x * 0.5;\n};\n```\n\n在这两个示例中，委托名称都是\
  \ `Half`。当此委托被调用时，它返回 `x` 乘以 `0.5` 的结果。\n\n\n\n\n\n| `Find` | **查找第一个符合条件的元素** |\
  \ `Find` 方法接受一个 `Predicate` 委托作为参数。`Predicate` 必须接受一个与 `List` 元素数据类型相同的参数。`Find`\
  \ 方法返回第一个在传递给 `Predicate` 时使 `Predicate` 返回 `true` 的元素。 |\n| `FindAll` | **查找所有符合条件的元素**\
  \ | `FindAll` 方法接受一个 `Predicate` 委托作为参数。`Predicate` 必须接受一个与 `List` 元素数据类型相同的参数。`FindAll`\
  \ 方法返回一个包含所有符合条件的元素的 `List`，这些元素在传递给 `Predicate` 时都会使 `Predicate` 返回 `true`。 |\n\
  | `FindIndex` | **查找第一个符合条件的元素的索引** | `FindIndex` 方法接受一个 `Predicate` 委托作为参数。`Predicate`\
  \ 必须接受一个与 `List` 元素数据类型相同的参数。`FindIndex` 方法返回第一个在传递给 `Predicate` 时使 `Predicate`\
  \ 返回 `true` 的元素的索引。 |\n| `FindLast` | **查找最后一个符合条件的元素** | `FindLast` 方法接受一个 `Predicate`\
  \ 委托作为参数。`Predicate` 必须接受一个与 `List` 元素数据类型相同的参数。`FindLast` 方法返回最后一个在传递给 `Predicate`\
  \ 时使 `Predicate` 返回 `true` 的元素。 |\n| `FindLastIndex` | **查找最后一个符合条件的元素的索引** | `FindLastIndex`\
  \ 方法接受一个 `Predicate` 委托作为参数。`Predicate` 必须接受一个与 `List` 元素数据类型相同的参数。`FindLastIndex`\
  \ 方法返回最后一个在传递给 `Predicate` 时使 `Predicate` 返回 `true` 的元素的索引。 |\n| `ForEach` | **对\
  \ `List` 中的每个元素执行操作** | `ForEach` 方法接受一个 `Action` 委托作为参数。`Action` 委托必须接受一个参数。该参数的数据类型必须与\
  \ `List` 元素的数据类型匹配。该方法遍历 `List`，将每个元素作为参数传递给委托。 |\n| `RemoveAll` | **移除所有符合条件的元素**\
  \ | `RemoveAll` 方法接受一个 `Predicate` 委托作为参数。`Predicate` 必须接受一个与 `List` 元素数据类型相同的参数。`RemoveAll`\
  \ 方法移除所有在传递给 `Predicate` 时使 `Predicate` 返回 `true` 的元素。 |\n| `TrueForAll` | **判断\
  \ `List` 中的所有元素是否都符合条件** | `TrueForAll` 方法接受一个 `Predicate` 委托作为参数。`Predicate` 必须接受一个与\
  \ `List` 元素数据类型相同的参数。如果所有 `List` 元素在传递给 `Predicate` 时都使 `Predicate` 返回 `true`，则\
  \ `TrueForAll` 方法返回 `true`。否则，返回 `false`。 |\n\n表 13-1 中列出的方法非常直观，但让我们来看其中几个。首先是\
  \ `ForEach` 方法。这里是通用格式：\n\n```\nlistName.ForEach(ActionDelegate)\n```\n\n在通用格式中，`listName`\
  \ 是一个 `List` 的名称。`ActionDelegate` 参数是一个接受一个参数的 `Action` 委托。`ForEach` 方法遍历整个 `List`，将每个元素作为参数传递给\
  \ `ActionDelegate`。让我们来看一个演示 `ForEach` 方法的完整应用程序。程序 13-9 显示了 ForEachDemo 应用程序的 Form1\
  \ 代码。\n\n让我们仔细查看代码：\n\n* 第 17 行的代码创建了一个名为 `numbers` 的整数列表 `List`，并用值 1, 2, 3, 4\
  \ 和 5 初始化该 `List`。\n* 第 20 行创建了一个名为 `Display` 的 `Action` 委托，带有一个名为 `x` 的 `int` 参数。当调用委托时，参数\
  \ `x` 的值消息框中显示。\n* 第 23 行调用了 `numbers` `List` 的 `ForEach` 方法，将 `Display` 委托作为参数。`ForEach`\
  \ 方法遍历 `List`，将每个元素作为参数传递给 `Display` 委托。结果将出现五个消息框（一个接一个），每个框显示一个元素的值。\n\n记住，如果一个方法接受委托作为参数，你可以向该方法传递一个兼容的\
  \ lambda 表达式。我们可以通过向 `List` 的 `ForEach` 方法传递 lambda 表达式来简化 程序 13-9 中的代码，这让我们消除了第\
  \ 20 行的委托声明。程序 13-10 显示了修改后的代码。此程序的工作原理与程序 13-9 所示所示。在第 20 行向 `ForEach` 方法传递以下 lambda\
  \ 表达式：\n\n```\nx => MessageBox.Show(x.ToString())\n```\n\n当应用程序编译时，此 lambda 表达式将转换为\
  \ `Action` 委托并传递给 `ForEach` 方法。让我们也来看 `RemoveAll` 方法。这是通用格式：\n\n```\nlistName.RemoveAll(PredicateDelegate)\n\
  ```\n\n在通用格式中，`listName` 是 `List` 的名称。`PredicateDelegate` 参数是一个 `Predicate` 委托。`RemoveAll`\
  \ 方法遍历整个 `List`，将每个元素作为参数传递给 `PredicateDelegate`。如果 `PredicateDelegate` 返回 `true`，则从\
  \ `List` 中移除该元素。如果 `PredicateDelegate` 返回 `false`，则不采取任何操作。让我们来看演示 `RemoveAll` 方法的完整应用程序。程序\
  \ 13-11 显示了 RemoveAllDemo 应用程序 代码。\n\n让我们仔细查看代码：\n\n* 第 17 行的代码创建一个名为 `numbers`\
  \ 的整数 `List`，并用 -3, -2, -1, 0 初始化 `List`。\n* 第 20 行调用 `List` 的 `RemoveAll` 方法，传递以下\
  \ lambda 表达式作为参数：\n\n```\nx < 0\n```\n\n* 此 lambda 表达式由编译器转换为 `Predicate` 委托，如果参数\
  \ `x` 小于 0 则返回 `true`，否则返回 `false`。结果是第 20 行移除了 `List` 中所有的负数。完成后，`List` 将包含值 0,\
  \ 1 和 2。\n* 第 23 行调用 `numbers` `List` 的 `ForEach` 方法，传递一个在消息框中显示参数的 lambda 表达式。结果将出现三个消息框（一个接一个），显示值\
  \ 0, 1 和 2。\n\n在 教程 13-1 中完成使用 `FindAll` 方法查找 `List` 中所有大于指定值的应用程序。\n\n# 检查点\n\n\
