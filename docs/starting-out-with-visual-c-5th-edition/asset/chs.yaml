  \n# 判断对错\n\n1. 作为类实例的对象总是按值传递的。\n2. 类声明必须写在项目命名空间内。\n3. 类是一个对象。\n4. 将类的所有字段都设为私有，并通过方法提供这些字段的访问是一种常见做法。\n\
  5. 变量命名的规则也适用于类的命名。\n6. 如果你需要将属性设为只读，只需不为该属性编写 `set` 访问器。\n7. 如果你尝试将属性传递给 `ref`\
  \ 或 `out` 参数，将会出错。\n8. 类字段几乎总是声明为 `public`，以便类外部代码轻松访问其值。\n9. `get` 访问器可以被认为是返回类属性值的方法。\n\
  10. 构造函数接受参数的方式与其他方法相同。\n11. 编写一个没有任何构造函数的类是合法的。\n\n\n\n\n\n12. 类的实例可以存储在数组中。\n\
  13. 类的对象可以存储在数组中，但不能存储在 `List` 中。\n14. 寻找面向对象程序所需的类的一种方法是识别问题领域描述中的所有动词。\n15. Visual\
  \ C# 项目中的每个表单（form）都有一个类。\n16. 默认情况下，控件的 `Modifiers` 属性设置为 `Public`。\n17. 静态成员方法可以引用同一类的非静态字段，但只有在定义了类的实例之后才可以。\n\
  18. 静态类的所有成员也必须是静态的。\n\n# 简答\n\n1. 当方法接收一个对象作为参数时，该方法访问的是实际对象还是对象的拷贝？\n2. 将类存储在它们自己的文件中有什么好处？\n\
