  \n当一个字段的值紧密依赖其他数据，且当其他数据更改时该字段没有更新时，称该字段变得“过时”。在设计类时，你应该注意不要在字段中存储任何可能过时的计算数据。相反，应提供一个只读属性或方法，返回计算结果的值。\n\
