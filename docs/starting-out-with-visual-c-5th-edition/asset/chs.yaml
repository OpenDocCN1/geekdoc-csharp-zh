  \ 控件中。\n\n```\n 1 private void addButton_Click(object sender, EventArgs e)\n2 {\n\
  3     namesListBox.Items.Add(\"Chris\");\n4     namesListBox.Items.Add(\"Alicia\"\
  );\n5     namesListBox.Items.Add(\"Justin\");\n6     namesListBox.Items.Add(\"Holly\"\
  );\n7 }\n```\n\n\n\n\n你也可以添加其他类型的值。在书籍学生示例程序的 `Chap05` 文件夹中，你会找到一个名为 `Number List`\
  \ 的项目。图 5-2) 显示了应用程序的表单。如左图所示，ListBox 的名称是 `numberListBox`，按钮控件的名称是 `addButton`。在运行时，当你点击\
  \ `addButton` 控件时，右图中显示的数字会被添加到 `numberListBox` 控件中。\n\n# 图 5-2 `Number List`应用程序\n\
