  \n# 图 3-7 标签中显示的用户全名\n\n# 在使用之前声明变量\n\n变量声明语句的目的是告诉编译器，你计划在程序中使用具有特定名称的变量来存储特定类型的数据。变量声明语句会在内存中创建该变量。出于此原因，变量的声明语句必须出现在方法中使用该变量的任何其他语句*之前*。这完全符合逻辑，因为如果变量没有在内存中创建，你也就无法在变量中存储值。\n\
  \n注意图 3-6 中的`fullName`变量是在事件处理方法内部声明的。在方法内部声明的变量被称为局部变量。局部变量属于其所在的方法，只有该方法内部的语句才能访问该变量。（*局部*一词意指该变量只能在声明它的方法内部（即局部）使用。）\n\
