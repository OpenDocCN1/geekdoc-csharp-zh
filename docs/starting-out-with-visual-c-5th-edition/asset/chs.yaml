  \n# 在多个表单上拥有数据绑定控件\n\n\n\n\n\n你已经看到，当你在表单上放置数据绑定的控件时，Visual Studio 会自动创建一组组件，允许表单连接到数据库。这些组件包含一个数据集（dataset）。当你在多个表单上放置数据绑定的控件时，请记住每个表单都有自己的数据集。当你对一个表单中的数据集进行更改时，这些更改不会自动显示在其他拥有数据集的表单中。请考虑以下场景：\n\
  \n* `Form1` 显示数据库的视图，可能在一个 `DataGridView` 控件中。\n* `Form1` 中的某些代码显示了 `Form2`。\n*\
  \ `Form2` 也显示相同数据库的视图，允许用户进行更改并将这些更改保存到数据库。用户关闭了 `Form2`。\n* `Form1` 仍然显示其数据的原始副本。它的数据集不会自动更新，因此\
  \ `Form1` 不显示由 `Form2` 生成的更改。\n\n为了确保数据集包含数据的最新副本，你需要编写代码，使表适配器（table adapter）读取数据库表并填充数据集。你通过调用表适配器的\
  \ `Fill` 方法来实现这一操作。在**教程 12-5 中，你将学习如何通过创建一个正确处理之前讨论的场景的应用程序来实现。\n\n# 检查点\n\n1.\
  \ 12.19 在 `Designer` 中点击控件的智能标签（smart tag）时会发生什么？\n2. 12.20 当你创建详细视图（Details view）时，什么决定了绑定列的控件类型？\n\
  3. 12.21 将 `ListBox` 控件绑定到列必须设置哪两个属性？\n4. 12.22 用当前数据副本填充数据集的表适配器方法名称是什么？\n\n# 12.7\
  \ 使用 SQL `Select` 语句选择数据\n\n### 概念\n\nSQL 是一种大多数 DBMS 支持的标准语言。`Select` 语句在 SQL 中用于从数据库检索数据。\n\
  \n`SQL` 是结构化查询语言，是用于操作数据库管理系统的标准语言。它最初由 IBM 在 20 世纪 70 代开发。从那时起，SQL 被几乎所有数据库软件供应商采用与其与其交互的首选语言。\n\
  \n`SQL` 由几个关键字组成。你使用这些关键字来构造语句，这些也称为查询。这些语句或查询被提交给 DBMS，它们是指导 DBMS 对其数据执行操作的指令。在本节中，你将学习如何构造简单的\
  \ SQL 语句，然后将它们传递给 SQL Server DBMS。\n\n### 注意\n\n尽管 SQL 是一种语言，但你并不使用它来编写应用程序。它仅旨在作为与\
  \ DBMS 交互的标准手段。你仍然需要一种通用编程语言（如 C#`）来为普通用户编写应用程序。\n\n在 SQL 中，你使用 `Select` 语句来检索表中的行。正如其名称所示，`Select`\
  \ 语句允许你选择特定的行。我们从该语句的一种非常简单的形式开始，如下：\n\n```\nSelect Columns From Table\n```\n\n\
  在通用格式中，`Columns` 是一个或多个列名，`Table` 是表名。这是一个可能在 `ProductDB.mdf` 数据库上执行的 `Select` 语句示例：\n\
  \n```\nSelect Description From Product\n```\n\n此语句检索 `Product` 表中每一行的 `Description`\
  \ 列。你可以通过逗号隔开列名，在 `Select` 语句中指定多个列。这里是一个示例：\n\n```\nSelect Description, Price From\
  \ Product\n```\n\n此语句检索 `Product` 表中每一行的 `Description` 列和 `Price` 列。如果你想检索表中的每一列，可以使用\
  \ `*` 字符代替列出列名。这里是一个示例：\n\n```\nSelect * From Product\n```\n\n此语句检索 `Product` 表中每一行的每一列。SQL\
  \ 语句是自由格式的，这意味着关键字之间的制表符、换行符和空格会被忽略。例如，语句\n\n```\nSelect * From Product\n```\n\n\
  与以下语句\n\n```\n Select\n    *\nFrom\n    Product\n```\n的效果相同。\n\n此外，SQL 关键字和表名是不区分大小写的。之前的语句可以写成：\n\
  \n```\nSELECT * FROM PRODUCT\n```\n\n# 使用 `Where` 子句指定搜索标准\n\n有时你想检索表中的每一行。但在许多情况下，你希望将列表缩小到表中的少数几个选定行。这就是\
  \ `Where` 子句派用用场的地方。`Where` 子句可以与 `Select` 语句一起使用，指定搜索标准。当你使用 `Where` 子句时，仅返回符合搜索标准的行。带有\
  \ `Where` 子句的 `Select` 语句的通用格式为：\n\n```\nSelect Columns From Table Where Criteria\n\
  ```\n\n在通用格式中，`Criteria` 是条件表达式。这是一个使用 `Where` 子句的 `Select` 语句示例：\n\n```\nSelect\
  \ * From Product Where Price > 20.00\n```\n\n语句的第一部分 `Select * From Product` 指定了我们要查看每一列。`Where`\
  \ 子句指定我们只需要 `Price` 列内容大于 20.00 的行。SQL 支持表 12-2 列出的关系运算符，用于在 `Where` 子句中编写条件表达式。\n\
  \n# 表 12-2 SQL 运算符\n\n| 运算符 | 含义 |\n| --- | --- |\n| `>` | 大于 |\n| `<` | 小于 |\n\
  | `>=` | 大于等于 |\n| `<=` 小于等于 |\n| `=` | 等于 |\n| `<>` | 不等于 |\n\n注意 SQL 中的等于和不等于运算符与\
  \ C# 不同。等于运算符是一个等号，不等于运算符是 `<>`。\n\n让我们看几个更多 `Select` 语句的示例。以下语句可以检索价格为 28.95 的产品编号和价格：\n\
  \n```\nSelect Product_Number, Price From Product Where Price = 28.95\n```\n\n以下\
  \ `Select` 语句检索描述为“Denim Jeans”的所有列：\n\n```\nSelect * From Product Where Description\
  \ = 'Denim Jeans'\n```\n\n如果你仔细观察之前的语句，你会发现 SQL 语法的另一个区别。在 SQL 中，字符串字面量是用单引号括起来。\n\
  \n### 提示\n\n如果你需要在字符串中包含单引号，只需在该处编写两个单引号即可。例如，假设你想搜索 `Product` 表中的 Katy's Cap。你可以使用以下语句：\n\
  \n```\nSelect * From Product Where Description = 'Katy''s Cap'\n```\n\nSQL 中的字符串比较是区分大小写的。如果你对\
  \ `Product` 表运行以下语句，将无法获得任何结果：\n\n```\nSelect * From Product Where Description =\
  \ 'denim jeans'\n```\n\n但是，你可以使用 `Lower()` 函数将字符串转换为小写。这里有一个示例：\n\n```\nSelect *\
  \ From Product Where Lower(Description) = 'denim jeans'\n```\n\n此语句在执行比较之前将 `Description`\
  \ 列转换为小写。因此，它将返回所有 `Description` 等于“denim jeans”的行，无论大小写如何。你可以使用将字符串转换为大写的 `Upper`\
  \ 函数来获得相同的结果：\n\n```\nSelect * From Product Where Upper(Description) = 'DENIM JEANS'\n\
  ```\n\n\n\n\n[content]\n\n# 图 12-69 `ProductDB.mdf` 数据库中的 `Product` 表\n\n![图像显示存储在\
  \ Product 表中的数据。](img/FG_12_069.png)图 12-69 完整替代文本\n\n以下语句将无法运行。你能看出为什么吗？\n\n```\n\
  Select * From Product Where Description = 'Shirt'\n```\n\n该语句将搜索 `Description` 列等于字符串\
  \ `\"Shirt\"` 的行。遗憾的是，它将找不到任何结果，因为没有一行的 `Description` 列等于 `\"Shirt\"`。然而，`\"Shirt\"\
  ` 这个单词确实出现在某些行的 `Description` 列中。例如，在图 12-69 中，第一行的 `Description` 列是 `\"Oxford Cloth\
  \ Shirt\"`，第二行的 `Description` 列是 `\"Poplin Shirt\"`，依此类推。\n\n# 图 12-70 `Solution\
  \ Explorer`（解决方案管理器）中的架构定义文件项\n\n![截图显示了解决方案管理器窗口，其中列有一个项目列表。列表上的“Product Data Set\
  \ dot x s d”项目显示被选中，并标记为“数据集的架构定义文件”。](img/FG_12_070.png)\n\n为了找到找到所有衬衫，我们需要搜索 `\"\
  Shirt\"` 作为子字符串出现在 `Description` 列中的行。你可以使用 `Like` 运算符来执行此类搜索。这里是使用该运算符的示例。\n\n\
  ```\nSelect * From Product Where Description Like '%Shirt%'\n```\n\n`Like` 运算符后面跟着一个包含字符模式的字符串。在这个示例中，字符模式是\
  \ `'%Shirt%'`。`%` 符号被用作通配符，它代表零个或多个字符的序列。模式 `'%Shirt%'` 指定字符串 `\"Shirt\"` 必须在其前后带有任何字符序列出现。因此，之前显示的语句将返回所有\
  \ `Description` 列包含字符串 `\"Shirt\"` 的行。\n\n同样，以下语句将产生所有 `Description` 列以单词 `\"Chino\"\
  ` 开头的行：\n\n```\nSelect * From Product Where Description Like 'Chino%'\n```\n\n下划线字符（`_`）也被用作通配符。与\
  \ `%` 字符不同，下划线代表单个字符。例如，查看以下语句：\n\n```\nSelect * From Product Where Product_Number\
  \ Like '2_-0_'\n```\n\n该语句将产生所有 `Product_Number` 列以 `\"2\"` 开头，随后是任意一个字符，然后是 `\"\
  -0\"`，最后是任意一个字符的行。\n\n你可以使用 `Not` 运算符在搜索标准中排除某个字符模式。例如，假设你想获得一个所有不是衬衫的物品列表。以下语句将仅产生这些结果：\n\
  \n```\nSelect * From Product Where Description Not Like '%Shirt%'\n```\n\n# 使用 `And`\
  \ 和 `Or`\n\n你可以使用 `And` 和 `Or` 逻辑运算符在 `Where` 子句中指定多个搜索标准。例如，查看以下语句：\n\n```\nSelect\
  \ * From Product Where Price > 20.00 And Price < 30.00\n```\n\n`And` 运算符要求两个搜索标准都为真，该行才会被判定为匹配。此语句返回的唯一行是\
  \ `Price` 列包含大于 20.00 且小于 30.00 的行。\n\n这里是一个使用 `Or` 运算符的示例：\n\n```\n Select * From\
  \ Product\nWhere Description Like '%Shirt%' or Product_Number Like '10-%'\n```\n\
  \n`Or` 运算符要求搜索标准之一为真，该行即可被判定为匹配。此语句搜索 `Description` 列在任何位置包含字符串 `\"Shirt\"` 的行，或者\
  \ `Product_Number` 列以 `\"10-\"` 开头的行。\n\n# 对 `Select` 查询结果排序\n\n如果你希望对 `Select`\
  \ 查询的结果进行排序，可以使用 `Order By` 子句。这里是一个示例：\n\n```\nSelect * From Product Order By Price\n\
  ```\n\n该语句产生 `Product` 表中所有行的列表，按 `Price` 列排序。列表将按 `Price` 列升序排列，这意味着价格最低的咖啡将出现在前面。\n\
  \n这里有一个同时使用 `Where` 子句和 `Order By` 子句的 `Select` 查询：\n\n```\nSelect * From Product\n\
  Where Price > 20.00\nOrder By Price\n```\n\n该语句产生 `Product` 表中所有 `Price` 列包含大于 20.00\
  \ 值的行，并按价格升序排列。\n\n如果你希望列表按降序（从高到低）排序，请使用 `Desc` 运算符，如下：\n\n```\n Select * From\
  \ Product\nWhere Price > 20.00\nOrder By Price Desc\n```\n\n# 表适配器查询 (Table Adapter\
  \ Queries)\n\n表适配器查询是存储在表中的表适配器查询，可以通过调用方法来执行。例如，当你在表上放置 `DataGridView` 控件时，会自动创建\
  \ `Load` 事件。让我们查看此处显示的表代码：\n\n```\nprivate void MainForm_Load(object sender, EventArgs\
  \ e)\n{\n    // TODO: This line loads into.\n    this.productTableAdapter.Fill(this.productDataSet);\n\
  }\n```\n\n第 4 行语句调用了 `productTableAdapter` 的 `Fill` 方法，并将 `productDataSet` 作为参数传递。`Fill`\
  \ 方法填充数据集。在 `Solution Explorer` 中，你应该能看到名为 `productDataSet` 的项，如图 12-70 所示。注意 *TableAdapter*\
  \ 窗口中的 SQL 查询。数据集将根据此 `Select` 语句返回的行进行填充。如果你更改此 `Select` 语句（例如添加一个 `Where` 子句并点击\
  \ `Finish` 按钮），`DataGridView` 控件中初始的数据将随之变化。当你查看完毕时，点击 `Cancel` 按钮关闭它。\n\n# 图 12-71 编辑中的\
  \ `ProductDataSet.xsd`\n\n![截图显示正在编辑的数据集文件。](img/FG_12_071.png)图 12-71 完整替代文本\n\n\
  右键点击读取 `Fill, GetData()` 的区域，如图 12-72 所示，从弹出菜单中选择 `Configure`。这将显示如图 12-73 所示的 *TableAdapter\
  \ Configuration Wizard* 窗口。注意 *TableAdapter* *Configuration Wizard* 窗口中的 SQL 查询。数据集将根据此\
  \ `Select` 语句返回的行进行填充。\n[/content]\n\n\n\n\n![截图显示了从产品数据集文件中勾选的配置设置。](img/FG_12_072.png)图\
  \ 12-72 完整替代文本\n\n# 图 12-73 TableAdapter 配置向导\n\n![截图显示了 TableAdapter 配置向导允许输入 SQL\
  \ 语句。](img/FG_12_073.png)图 12-73 完整替代文本\n\n### 注意\n\n请注意 `Select` 语句中的表名带有 `dbo.`\
  \ 前缀。`dbo` 前缀代表数据库所有者（database owner），是 SQL Server 命名规范的一部分。在我们的示例程序中，`dbo` 前缀是可选的。\n\
  \n## 添加新的表适配器查询\n\n你可以将自己的 SQL 查询添加到表适配器中，并在 C# 代码中调用它们。在教程 12-6 中，你向表适配器添加了多个查询，然后在应用程序表单上创建了执行这些查询的按钮。\n\
  \n## SQL 数学函数\n\nSQL 提供了几个用于计算的函数。例如，`Avg` 函数计算特定列的平均值。使用 `Avg` 函数的 `Select` 语句示例：\n\
  \n```\nSelect Avg(Price) From Product\n```\n\n该语句产生单个值：`Price` 列所有值的平均值。由于我们没有使用\
  \ `Where` 子句，计算使用了 `Product` 表中的所有行。以下是一个示例，计算产品编号以“20”开头的所有项目的平均价格：\n\n```\nSelect\
  \ Avg(Price)From Product Where Product_Number LIKE '20%'\n```\n\n另一个数学函数是 `Sum`，它计算一列值的总和。以下语句（可能不太实用）计算\
  \ `Price` 列值的总和：\n\n```\nSelect Sum(Price) From Product\n```\n\n`Min` 和 `Max` 函数确定列中找到最小值和最大值。以下语句给出\
  \ `Price` 列中的最小值：\n\n```\nSelect Min(Price) From Product\n```\n\n以下语句给出 `Price`\
  \ 列中的最大值：\n\n```\nSelect Max(Price) From Product\n```\n\n`Count` 函数可以用于确定表中的行数，如下语句所示：\n\
  \n```\nSelect Count(*) From Product\n```\n\n`*` 仅表示你想计算整行。另一个示例给出了价格大于 50.0 的项目数量：\n\
  \n```\nSelect Count(*) From Product Where Price > 50.0\n```\n\n在教程 12-7 中，你将在 *Product\
  \ Queries* 应用程序中向表适配器添加另一个查询。该新查询将显示数据库中所有项目的平均价格。\n\n## 查询参数\n\nSQL 查询可以接受参数。与普通方法一样，参数被传递给参数变量。在\
  \ SQL 语句中，参数变量以 `@` 符号开头。以下语句是一个示例：\n\n```\nSelect * From Product Where Price <\
  \ @priceValue\n```\n\n该语句检索所有 `Price` 列小于 `priceValue` 参数值的行。这是另一个示例：\n\n```\nSelect\
  \ * From Product\nWhere Price < @priceValue And Units_On_Hand < @unitsValue\n```\n\
  \n该语句检索所有 `Price` 列小于 `@priceValue` 参数值且 `Units_On_Hand` 列小于 `@unitsValue` 参数值的行。\n\
  \n当你调用用于 SQL 查询的表适配器方法时，你必须为查询中使用的任何参数传递参数。在教程 12-8 中，你创建了一个应用程序，从用户处获取值并将该值作为参数传递给\
  \ SQL 查询。\n\n# 检查点\n\n1. 12.23 在 SQL 中，`Select` 语句的作用是什么？\n2. 12.24 让 DBMS 对其数据执行操作的指令称为什么？\n\
