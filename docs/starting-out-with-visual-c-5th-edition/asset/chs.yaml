  \ 窗口或 `Properties` 窗口，可以使用 `View` 菜单重新显示它们。\n\n## 项目与解决方案\n\n当你学习使用 Visual C# 编程时，你会经常看到\
  \ `project`（项目）和 `solution`（解决方案）这两个术语。这些术语的意思不同，但有时会互换使用。让我们简要讨论项目和解决方案之间的区别。\n\
  \n你创建的每个 Visual C# 都称为 `project`。一个 Visual C# 项目由多个文件组成。你可以将项目认为属于单个应用程序的文件的集合。\n\
  \n\n虽然解决方案可以包含多个项目，但本书书中创建的每个项目都将保存在自己的解决方案中。每当你创建一个新项目时，你都会创建一个新的解决方案来容纳它。图 1-44\
  \ 说明了这一概念。通常，解决方案将获得与项目相同的名称。\n\n## 图 1-44 解决方案和项目的组织\n\n![图说明了解决方案和项目的组织。它显示了一个标题为“Solution”的窗口，由一个项目组成。项目下方出现了一个项目列表，它们共同标记为“属于项目的文件”。](img/FG_01_044.png)\n\
