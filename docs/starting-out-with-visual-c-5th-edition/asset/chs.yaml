  \ date1 = new DateTime(1977, 3, 22);\n DateTime date2 = new DateTime(1978, 3, 22);\n\
  ```\n\n7. 9.15 `TimeSpan` 对象持有什么数据？\n8. 9.16 执行此代码后，什么日期将存储在 `date2` 对象中？\n\n```\n\
  \ DateTime date1 = new DateTime(1977, 3, 22);\n TimeSpan ts = new TimeSpan(3, 0,\
  \ 0, 0);\n DateTime date2 = date1 + ts;\n```\n\n# 9.4 枚举类型\n\n### 概念\n\n枚举类型是一种程序员定义的数据类型。它由预定义的常量（称为枚举）组成，这些常量表示整数值。\n\
  \n有时在程序中，你需要一种方法来表示无法以直接方式存储在内存中的值。例如，假设你正在编写一个处理星期（星期日、星期一、星期二等）的程序，你需要一种方法在内存中表示每周的每一天。一种解决方案是让整数\
  \ 0 到 6 代表每周的每天；0 代表星期日，1 代表星期一，以此此类推。虽然这种方法可行，但也有一些缺点。\n\n\n\n\n例如，阅读代码的其他人可能并不清楚\
  \ `0` 到 `6` 的值代表的是一周中的几天。此外，你可能认为周日是的一周的第一天，而另一个人可能认为周一是的一周的第一天。当另一个人看到值 `0` 时，他或她可能会认为它代表周一。\n\
  \n处理此类数据的更好解决方案是创建一个枚举数据类型（enumerated data type）。枚举数据类型是你可以创建的一种数据类型。当你创建一个枚举数据类型时，你会指定一组属于该数据类型的符号值。以下是一个枚举数据类型声明的示例：\n\
  \n```\nenum Day { Sunday, Monday, Tuesday, Wednesday,\n           Thursday, Friday,\
  \ Saturday }\n```\n\n枚举数据类型的声明以关键字 `enum` 开头，后面跟着类型的名称，然后是大括号内的标识符列表。示例声明创建了一个名为\
  \ `Day` 的枚举数据类型。大括号内列出的标识符 `Sunday`、`Monday`、`Tuesday`、`Wednesday`、`Thursday`、`Friday`\
  \ 和 `Saturday` 称为成员（enumerators）。它们代表属于 `Day` 类型的值。\n\n### 注意\n\n注意枚举成员没有包含在引号中；因此，它们不是字符串。枚举成员必须是有效的\
  \ C# 标识符。\n\n枚举成员是表示整数值的常量。当你声明一个枚举类型时，枚举成员会被分配整数值，从 `0` 开始。例如，在 `Day` 类型中，`Day.Sunday`\
  \ 成员被分配值为 `0`，`Day.Monday` 成员被分配值为 `1`，依此类推。\n\n`enum` 声明可以出现在以下任何一处位置：\n\n* 在应用程序的命名空间（namespace）外部\n\
  * 在应用程序的命名空间内部\n* 在类（class）内部\n\n在本书中，我们始终在编写结构声明的区域编写 `enum` 声明：在应用程序的命名空间内部，但在类之外。\n\
  \n一旦你在程序中创建了枚举数据类型，就可以声明该类型的变量。例如，以下语句将 `workDay` 声明为 `Day` 类型的变量：\n\n```\nDay workDay;\n\
  ```\n\n我们称之为 `enum` 变量。因为 `workDay` 是 `Day` 类型的变量，我们可以赋值给它的值是 `Day` 类型的枚举成员。例如，以下语句将值\
  \ `Day.Wednesday` 赋值给 `workDay` 变量：\n\n```\nworkDay = Day.Wednesday;\n```\n\n注意我们赋值的是\
  \ `Day.Wednesday` 而不仅仅是 `Wednesday`。`Day.Wednesday` 是 `Day` 类型中 `Wednesday` 成员的全限定名称（fully\
  \ qualified name）。你必须使用枚举成员的全限定名称，因为同一个枚举成员可能出现在多个枚举类型中。这里是另一个示例：\n\n```\nDay weekendDay\
  \ = Day.Saturday;\n```\n\n该语句声明了一个名为 `weekendDay` 的 `Day` 变量，并用值 `Day.Saturday`\
  \ 对其初始化。\n\n以下代码显示另一个示例。（假设应用程序的表单有一个名为 `mondayRadioButton` 的单选按钮控件。）\n\n```\n1\
  \ Day selectedDay;\n2 if (mondayRadioButton.Checked)\n3 {\n4     selectedDay = Day.Monday;\n\
  5 }\n```\n\n在此代码中，第 1 行声明了一个名为 `selectedDay` 的 `Day` 变量。第 2 行的 `if` 语句判断 `mondayRadioButton`\
  \ 控件是否选中。如果是，第 4 行的语句将 `Day.Monday` 赋值给 `selectedDay` 变量。\n\n你可以对 `enum` 变量和枚举成员进行比较。以下代码显示了一个示例。（假设\
  \ `selectedDay` 是一个 `Day` 变量。）\n\n```\n1 if (selectedDay == Day.Wednesday)\n2 {\n\
  3     MessageBox.Show(\"Halfway through the week!\");\n4 }\n```\n\n第 1 行的 `if` 语句判断\
  \ `selectedDay` 变量是否等于 `Day.Wednesday`。如果是，第 3 行显示一个消息框。\n\n以下代码显示了如何在 `switch`\
  \ 语句中测试 `enum` 变量。（假设 `selectedDay` 是 `Day` 变量。）\n\n```\n1 switch (selectedDay)\n\
  2 {\n3     case Day.Sunday:\n4         MessageBox.Show(\"Rest.\");\n5         break;\n\
  6     case Day.Monday:\n7         MessageBox.Show(\"Back to work.\");\n8       \
  \  break;\n9     case Day.Tuesday:\n10         MessageBox.Show(\"Just a regular\
  \ work day.\");\n11         break;\n12     case Day.Wednesday:\n13         MessageBox.Show(\"\
  Halfway through the week.\");\n14         break;\n15     case Day.Thursday:\n16\
  \         MessageBox.Show(\"Almost there.\");\n17         break;\n18     case Day.Friday:\n\
  19         MessageBox.Show(\"Last day!\");\n20         break;\n21     case Day.Saturday:\n\
  22         MessageBox.Show(\"Sleep late today.\");\n23         break;\n24 }\n```\n\
  \n第 1 行的 `switch` 语句测试 `selectedDay` 变量。根据变量的值，程序跳转到相应的 `case` 语句。\n\n# 使用枚举成员或\
  \ `enum` 变量的 `ToString` 方法\n\n枚举成员和 `enum` 变量都有 `ToString` 方法。当你调用枚举成员的 `ToString`\
  \ 方法时，它将枚举名称作为字符串返回。例如，以下代码将在消息框中显示字符串 `\"Sunday\"`：\n\n```\nMessageBox.Show(Day.Sunday.ToString());\n\
  ```\n\n当你调用 `enum` 变量的 `ToString` 方法时，它返回变量包含的名称。例如，以下代码将在消息框中显示字符串 `\"Thursday\"\
  `：\n\n```\nDay today = Day.Thursday;\nMessageBox.Show(today.ToString());\n```\n\n\
  当你对字符串和 `enum` 变量使用 `+` 运算符时，`enum` 变量的 `ToString` 方法会被隐式调用。（对 `int` 变量使用 `+` 运算符时也是如此。）这里是另一个示例：\n\
  \n```\nDay today = Day.Thursday;\nMessageBox.Show(\"Today is \" + today);\n```\n\
  \n此代码将显示 `\"Today is Thursday\"`\n\n# 获取枚举成员或 `enum` 变量的整数值\n\n你不能直接将枚举成员赋值给 `int`\
  \ 变量，但可以使用强制转换（cast）将枚举转换为整数类型。这里是一个示例：\n\n```\nint value = (int)Day.Friday;\n```\n\
  \n该语句声明了一个名为 `value` 的 `int` 变量，并用 `Day.Friday` 的整数值对其初始化。执行该语句后，`value` 将等于 `5`。这里是另一个示例：\n\
  \n```\nDay workDay = Day.Monday;\nint value = (int)workDay;\n```\n\n第一个语句声明了一个名为\
  \ `workDay` 的 `Day` 变量。第二个语句声明了一个名为 `value` 的 `int` 变量，并用 `workDay` 变量的整数值对其初始化。执行该语句后，`value`\
  \ 将等于 `1`。\n\n# 为枚举成员指定整数值\n\n默认情况下，枚举数据类型中的枚举成员被分配整数值 0、1、2 等依此类推。如果这不合适，你可以指定要赋值的值，如下所示：\n\
  \n```\nenum Water { Freezing = 32, Boiling = 212 }\n```\n\n在此示例中，`Water.Freezing`\
  \ 成员被分配整数值 32，`Water.Boiling` 成员被分配整数值 212。\n\n你分配给枚举成员的整数值不需要是唯一的。例如，以下代码显示了一个名为\
  \ `MonthDays` 的枚举类型。它的成员有 `January`、`February`、`March` 等。注意分配给枚举成员的值是每个月的天数（1 月有\
  \ 31 天，2 月有 28 天，等等）。该数据类型可能会出现在使用每月天数的应用程序中。\n\n\n\n\n```cs\nenum MonthDays\n{\n\
  \    January = 31, February = 28, March = 31,\n    April = 30, May = 31, June =\
  \ 30,\n    July = 31, August = 31, September = 30,\n    October = 31, November =\
  \ 30, December = 31\n}\n```\n\n# 比较枚举器和 `enum` 变量\n\n之前你已经看到枚举器和 `enum` 变量可以使用等号运算符\
  \ (`==`) 进行比较。你也可以使用其他关系运算符来比较枚举器和 `enum` 变量。例如，使用我们一直在讨论的 `Day` 数据类型，以下表达式为真：\n\
  \n```\nDay.Friday > Day.Monday\n```\n\n该表达式之所以为真，是因为枚举器 `Day.Friday` 在内存中存储为 5，而枚举器\
  \ `Day.Monday` 存储为 1。以下代码将显示消息 `\"Friday is greater than Monday.\"`：\n\n```cs\n\
  if (Day.Friday > Day.Monday)\n{\n    MessageBox.Show(\"Friday is greater than Monday.\"\
  );\n}\n```\n\n以下代码展示了比较两个 `enum` 变量的另一个示例。该代码将显示消息 `\"Friday is greater than Monday.\"\
  `：\n\n```cs\nDay day1 = Day.Friday;\nDay day2 = Day.Monday;\n\nif (day1 > day2)\n\
  {\n    MessageBox.Show(day1 + \" is greater than \" + day2);\n}\n```\n\n枚举器和 `enum`\
  \ 变量可以直接与整数值比较。例如，以下代码将显示消息 `\"Sunday is equal to zero.\"`：\n\n```cs\nif (Day.Sunday\
  \ == 0)\n{\n    MessageBox.Show(\"Sunday is equal to zero.\");\n}\n```\n\n# 使用 `enum`\
  \ 变量遍历数组元素\n\n由于枚举器表示整数值，因此它们可以在循环中使用来遍历数组的元素。例如，查看以下代码：\n\n```cs\ndecimal[] sales\
  \ = { 1000, 2000, 3000, 4000, 5000, 6000, 7000 };\n\nfor (Day dayCount = Day.Sunday;\
  \ dayCount <= Day.Saturday; dayCount++)\n{\n    MessageBox.Show(\"Sales for \" +\
  \ dayCount + \" were \" +\n        sales[(int)dayCount].ToString(\"c\"));\n}\n```\n\
  \n第 1 行和第 2 行创建了一个名为 `sales` 的 `decimal` 数组。第 4 行开始的 `for` 循环使用枚举变量名 `dayCount`\
  \ 作为其计数变量。注意关于循环的以下几：\n\n*   `dayCount` 变量初始化值为 `Day.Sunday`。\n*   只要 `dayCount`\
  \ 小于或等于 `Day.Saturday`，循环就会继续迭代。\n*   在每次迭代结束时，`dayCount` 会加 1。\n\n在第 7 行，表达式 `(int)dayCount`\
  \ 被用数组下标。随着循环执行，它将显示以下消息：\n\n*   `\"Sales for Sunday were $1,000.00\"`\n*   `\"\
  Sales for Monday were $2,000.00\"`\n*   `\"Sales for Tuesday were $3,000.00\"`\n\
  *   `\"Sales for Wednesday were $4,000.00\"`\n*   `\"Sales for Thursday were $5,000.00\"\
  `\n*   `\"Sales for Friday were $6,000.00\"`\n*   `\"Sales for Saturday were $7,000.00\"\
  `\n\n# 检查点\n\n1.  9.17 查看以下声明：\n\n    ```cs\n    enum Flower { Rose, Daisy, Petunia\
  \ }\n    ```\n\n    1.  该数据类型的名称是什么？\n    2.  在内存中，枚举器 `Flower.Rose` 将存储什么值？`Flower.Daisy`\
  \ 呢？`Flower.Petunia` 又是呢？\n    3.  写一条语句声明一个此枚举类型的变量。变量名应为 `flora`。使用 `Flower.Petunia`\
  \ 枚举器初始化变量。\n\n2.  9.18 你使用什么方法来显示枚举器的字符串值？\n3.  9.19 如何获取枚举器的整数值？\n\n# 9.5 字典 (Dictionaries)\n\
  \n### 概念\n\n字典（dictionary）是一个用于存储数据集合的对象。字典中的每个元素包含两个部分：键（key）和值（value）。每个键都与特定的值相关，并可用于定位该值。\n\
  \n当你听到“字典”这个词时，可能会想到像《韦尔-斯特词典》那样的大书，其中包含了单词及其定义。如果你想知道某个单词的含义，可以在字典中找到它并查看其定义。\n\
  \n在编程中，**字典（dictionary）**是一个用于存储数据集合的对象。存储在字典中的每个元素都有两个部分：**键（key）**和**值（value）**。事实上，字典元素通常被称为**键-值对（key–value\
  \ pairs）**。当你想要从字典中检索特定值时，你会使用与该值相关的键。这与在《韦尔-斯特词典》中查单词的过程相似，其中单词是键，定义是值。\n\n\n\n\
  \n\n* 第四个个元素是 `{104, \"Will Osborn\"}`。在这个元素中，104 是键（key），“Will Osborn” 是值（value）。\n\
  \n注意初始化列表的以下方面：\n\n* 初始化列表包含在一组大括号 `{}` 中；\n* 每个元素都包含在自己的大括号对 `{}` 中，键和值之间用逗号分隔；\n\
  * 元素之间用逗号分隔；\n* 在最后一个大括号之后，声明以分号结束。\n\n如前所述，`Dictionary` 中的键必须是唯一的。如果初始化列表中的两个或多个元素具有相同的键，在运行时会抛出异常。\n\
  \n# 向现有的 `Dictionary` 中添加元素\n\n你可以使用符合以下通用格式的赋值语句向 `Dictionary` 中添加元素：\n\n```\n\
  dictionaryName[key] = value;\n```\n\n在通用格式中，`dictionaryName` 是 `Dictionary` 的名称，`key`\
  \ 是键。如果 `key` 已经存在于 `Dictionary` 中，其关联的值将被更改为 `value`。如果 `key` 不存在，它将被添加到 `Dictionary`\
  \ 中，并将 `value` 作为其关联值。以下代码显示了一个示例：\n\n```\nDictionary<int, string> employees = new\
  \ Dictionary<int, string>();\nemployees[110] = \"Beth Young\";\nemployees[111] =\
  \ \"Jake Brown\";\nemployees[112] = \"Emily Davis\";\n```\n\n第一语句创建了一个名为 `employees`\
  \ 的空 `Dictionary`。随后的语句向 `Dictionary` 添加了以下元素：\n\n* `Key = 110`, `Value = \"Beth\
  \ Young\"`\n* `Key = 111`, `Value = \"Jake Brown\"`\n* `Key = 112`, `Value = \"\
  Emily Davis\"`\n\n记住 `Dictionary` 中的键必须是唯一的。如果你为已有的键分配一个新值，新值将替换之前存储的值。例如，查看以下代码：\n\
  \n```\nDictionary<int, string> employees = new Dictionary<int, string>();\nemployees[110]\
  \ = \"Beth Young\";\nemployees[110] = \"Jake Brown\";\n```\n\n第一语句创建了一个名为 `employees`\
  \ 的空 `Dictionary`。第二语句添加了一个键为 110 值为“Beth Young”的元素。第三条将值“Jake Brown”分配给键为 110 的元素。\n\
  \n# 使用 `Add` 方法添加元素\n\n除了使用 `[]` 操作符外，你还可以使用 `Add` 方法向 `Dictionary` 添加元素。以下是通用格式：\n\
  \n```\ndictionaryName.Add(key, value);\n```\n\n在通用格式中，`dictionaryName` 是 `Dictionary`\
  \ 的名称，`key` 是键。如果 `key` 不存在，它将被添加到 `Dictionary` 中，并将 `value` 作为其关联值。如果 `key` 已经存在于\
  \ `Dictionary` 中，则将抛出异常。以下代码显示了一个示例：\n\n```\nDictionary<int, string> employees =\
  \ new Dictionary<int, string>();\nemployees.Add(110, \"Beth Young\");\nemployees.Add(111,\
  \ \"Jake Brown\");\nemployees.Add(112, \"Emily Davis\");\n```\n\n第一语句创建了一个名为 `employees`\
  \ 的空 `Dictionary`。随后的语句向 `Dictionary` 添加了以下元素：\n\n* `Key = 110`, `Value = \"Beth\
  \ Young\"`\n* `Key = 111`, `Value = \"Jake Brown\"`\n* `Key = 112`, `Value = \"\
  Emily Davis\"`\n\n# 从 `Dictionary` 中检索值\n\n要从 `Dictionary` 中检索值，你可以使用符合以下通用格式的表达式：\n\
  \n```\ndictionaryName[key]\n```\n\n在通用格式中，`dictionaryName` 是引用 `Dictionary` 的变量，`key`\
  \ 是键。如果键存在于 `Dictionary` 中，表达式返回与该键关联的值。如果键不存在，则会发生异常。以下代码段演示了这一点。假设此代码位于名为 `emplyeesListBox`\
  \ 的 ListBox 控件的应用程序中。\n\n```\nDictionary<int, string> employees = new Dictionary<int,\
  \ string>();\n\n// 向 Dictionary 添加元素\nemployees[101] = \"Chris Jones\";\nemployees[102]\
  \ = \"Jessica Smith\";\nemployees[103] = \"Amanda Stevens\";\nemployees[104] = \"\
  Will Osborn\";\n\n// 显示元素\nfor (int key = 101; key < 105; key++)\n{\n     employeesListBox.Items.Add(employees[key]);\n\
  }\n```\n\n# 移除元素\n\n你可以使用 `Remove` 方法从 `Dictionary` 中移除元素。你调用 `Remove` 方法并传递与要移除的元素关联的键。以下代码显示了一个示例：\n\
  \n```\nDictionary<int, string> employees = new Dictionary<int, string>();\n\n//\
  \ 向 Dictionary 添加元素\nemployees[101] = \"Chris Jones\";\nemployees[102] = \"Jessica\
  \ Smith\";\nemployees[103] = \"Amanda Stevens\";\nemployees[104] = \"Will Osborn\"\
  ;\n```\n\n\n\n\n\n```c\nKeyValuePair<int, string> element = \n    new KeyValuePair<int,\
  \ string>(101, \"Chris Jones\");\nif (!employees.Contains(element))\n{\n   MessageBox.Show(\"\
  Chris Jones was not found.\");\n}\n```\n\n# 使用 `TryGetValue` 方法检索值\n\n当你调用 `TryGetValue`\
  \ 方法时，你会传递两个参数：(1) 你正在查找的键（key），以及 (2) 你想要存储与该键关联值的输出变量。以下是 `TryGetValue` 方法调用的通用格式：\n\
  \n```\n dictionaryName.TryGetValue(key, out targetVariable)\n```\n\n在通用格式中，`dictionaryName`\
  \ 是 `Dictionary` 的名称，`key` 是你正在查找的键，`targetVariable` 是变量的名称。该方法在 `Dictionary` 中搜索\
  \ `key`，如果找到了，则与 `key` 关联的值将存储在 `targetVariable` 中，并且方法返回 `true` 表示找到了该元素。如果未找到\
  \ `key`，方法会在 `targetVariable` 中存储一个默认值并返回 `false` 表示未找到该 `key`。以下代码显示了一个示例：\n\n\
  ```c\n // 创建一个包含员工信息的 Dictionary\nDictionary<int, string> employees = new Dictionary<int,\
  \ string>()\n{\n   {101, \"Chris Jones\"},\n   {102, \"Jessica Smith\"},\n   {103,\
  \ \"Amanda Stevens\"},\n   {104, \"Will Osborn\"}\n};\n// 用于保存员工名称的变量\nstring name;\n\
  \n// 查找员工 104\nif (employees.TryGetValue(104, out name))\n{\n    MessageBox.Show(name);\n\
  }\nelse\n{\n    MessageBox.Show(\"Employee 104 was not found.\");\n}\n```\n\n# `Count`\
  \ 属性和 `ElementAt` 方法\n\n`Dictionary` 对象有一个 `Count` 属性，该值被设置为 `Dictionary` 中的元素数量。`Count`\
  \ 属性可以配合 `ElementAt` 方法使用，通过 `for` 循环遍历 `Dictionary` 中的元素。以下是 `ElementAt` 方法的通用格式：\n\
  \n```\n dictionaryName.ElementAt(index)\n```\n\n在通用格式中，`dictionaryName` 是一个 `Dictionary`，`index`\
  \ 是 `Dictionary` 中的一个位置，0 表示第一个元素。该方法返回指定位置上的元素，其类型为 `KeyValuePair` 对象。如果索引超出范围，方法将抛出异常。以下代码显示了一个示例。假设此代码位于一个名为\
  \ `emplyeesListBox` 的 ListBox 控件应用程序中。\n\n```c\n Dictionary<int, string> employees\
  \ = new Dictionary<int, string>()\n{\n   {101, \"Chris Jones\"},\n   {102, \"Jessica\
  \ Smith\"},\n   {103, \"Amanda Stevens\"},\n   {104, \"Will Osborn\"}\n}; \n\nfor\
  \ (int i = 0; i < employees.Count; i++)\n{\n   // 获取 KeyValuePair 元素\n   var element\
  \ = employees.ElementAt(i);\n\n   // 显示元素\n   employeesListBox.Items.Add(element.Key\
  \ + \" \" + element.Value);\n}\n```\n\n# `Clear` 方法\n\n`Clear` 方法删除 `Dictionary`\
  \ 中的所有元素，使 `Dictionary` 置空。方法的通用格式为：\n\n```\n dictionaryName.Clear();\n```\n\n在通用格式中，`dictionaryName`\
  \ 是一个 `Dictionary` 的名称。\n\n# 将 `List` 存储为 `Dictionary` 的值\n\n在以下代码段中，我们创建了一个 `Dictionary`，其键是学生姓名（字符串），值是包含测试分的\
  \ `List`。假设此代码位于一个名为 `scoresListBox` 的 ListBox 控件应用程序中。代码的输出（ListBox 的内容）所示图 9-16。\n\
  \n```c\n 1 // 创建用于存放测试分的 List\n 2 List<int> student1scores = new List<int>() {88,\
  \ 92, 100};\n 3 List<int> student2scores = new List<int>() {95, 74, 81};\n 4 List<int>\
  \ student3scores = new List<int>() {72, 88, 9};\n 5 List<int> student4scores = new\
  \ List<int>() {70, 75, 78};\n 6 \n 7 // 创建一个存放学生姓名和测试分的 Dictionary。\n 8 Dictionary<string,\
  \ List<int>> testScores =\n 9     new Dictionary<string, List<int>>();\n10 \n11\
  \ // 将每个学生的姓名和测试分添加到字典中。\n12 testScores[\"Kayla\"] = student1scores;\n13 testScores[\"\
  Luis\"] = student2scores;\n14 testScores[\"Sophie\"] = student3scores;\n15 testScores[\"\
  Ethan\"] = student4scores;\n16 \n17 // 显示每个学生的测试分。\n18 foreach (var student in testScores)\n\
  19     scoresListBox.Items.Add(student.Key);\n20     foreach (int score in student.Value)\n\
  21     {\n22     scoresListBox.Items.Add(score);\n23     }\n24     }  \n25 }\n```\n\
