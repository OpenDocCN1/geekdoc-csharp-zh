  \n编写一个程序读取此文件并创建一个 `Dictionary`，其中键是球队名称，每个键关联的值是该球队赢得世界大赛的次数。该程序还应该创建一个 `Dictionary`，其中键是年份，每个键关联的值是该年份获胜球队的名称。\n\
  \n程序应允许用户选择 1903 年到 2009 年范围一个年份。然后它应该显示该年份赢得世界大赛的球队名称，以及该球队赢得世界大赛的次数。\n\n## 12.\
  \ 单词索引\n\n编写一个程序读取文本文件的内容。该程序应该创建一个 `Dictionary`，其键值对描述如下：\n\n*   键——键是文件中找到的单个单词。\n\
