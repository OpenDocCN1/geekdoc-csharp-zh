  The number is odd.\");\n}\n```\n\n这种逻辑不仅更容易理解，而且你现在有了一个方法，可以在需要测试数字是否为偶数时，在程序中的任何时候调用它。（本书的学生示例程序中的\
  \ `Chap06` 文件夹有一个名为 `Even Number` 的项目，它演示了 `IsEven` 方法。）\n\n# 使用布尔方法使输入验证模块化\n\n\
  布尔方法对于输入验证的模块化非常有用。当表单有多个 `TextBox` 控件时，输入验证通常需要多个嵌套的 `if` 语句。在许多情况下，你可以通过创建一个布尔方法来简化代码，该方法执行所有输入验证，如果所有输入都有效则返回\
  \ `true`，如果任何一个无效则返回 `false`。在教程 6-5 中，你完成了一个使用这种方法的应用程序。\n\n# 从方法返回字符串\n\n到目前为止，你已经了返回数字和布尔值的方法示例。你可以编写返回任何类型数据的方法。让我们来看一个使用返回字符串方法的示例程序。本书的学生示例程序中的\
