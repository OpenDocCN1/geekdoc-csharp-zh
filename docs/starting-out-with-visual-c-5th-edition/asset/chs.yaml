  }\nelse\n{\n   MessageBox.Show(s1);\n   MessageBox.Show(s2);\n}\n```\n\n# 4.7 使用\
  \ `TryParse` 方法防止数据转换异常\n\n### 概念\n\n应该尽可能避免异常。你可以使用 `TryParse` 方法来防止因用户输入无效数据导致的异常。\n\
  \n在第 3 章中，你学习了尝试使用 `Parse` 方法将非数字数据转换为数值类型时，它会抛出异常。如果你使用 `Parse` 方法之一将 `TextBox`\
  \ 控件的 `Text` 属性转换为数字，始终存在抛出异常的可能性。毕竟，用户可以自由地在 `TextBox` 控件中输入任何内容。为了处理 `Parse` 方法引起的异常，我们一直在使用\
  \ `try-catch` 语句。\n\n虽然许多异常是由程序员无法预料的原因引起的（例如系统故障），但某些异常是可以预测的。例如，你知道使用 `Parse`\
  \ 方法将非数字输入转换为数值类型会抛出异常。在那种异常可预测的情况下，你应该编写代码来防止异常的发生。与其让异常发生然后让 `try-catch` 语句对其做出反应，不如防止异常是更好的编程实践。你应该主要将\
  \ `try-catch` 语句用于那些你无法控制的异常。\n\n### 注意\n\n到为止，我们只是简单地允许异常发生并让 `try-catch` 语句对它们做出响应。读完上段后，你可能会奇怪为什么我们一直没有防止异常。原因是你需要学会如何编写\
  \ `if` 语句，以执行在本节中讨论的技术。现在你已经知道如何编写 `if` 语句，就可以增加你代码的复杂性了。\n\n现在你已经知道如何编写 `if` 语句，就可以使用\
  \ .NET Framework 中称为 `TryParse` 方法的一系列方法。通过 `TryParse` 方法，你可以在字符串（如控件的 `Text` 属性）转换为特定数据类型*之前*，确定其是否包含可以转换为该类型的值。`TryParse`\
  \ 方法不会抛出异常，因此你可以在没有 `try-catch` 语句的情况下使用它们。\n\n.NET Framework 中有很多 `TryParse` 方法。目前，我们正在使用\
  \ `int`、`double` 和 `decimal` 数值数据类型，因此我们将讨论其中三个：\n\n* 我们使用 `int.TryParse` 方法将字符串转换为\
  \ `int`。\n* 我们使用 `double.TryParse` 方法将字符串转换为 `double`。\n* 我们使用 `decimal.TryParse`\
  \ 方法将字符串转换为 `decimal`。\n\n当你调用其中一个 `TryParse` 方法时，你传递了两个参数：(1) 你想要转换的字符串，以及 (2)\
  \ 你想要存储转换后的值的变量名。首先让我们来看 `int.TryParse` 方法。这里是调用 `int.TryParse` 方法的通用格式：\n\n```\n\
  int.TryParse(string, out targetVariable)\n```\n\n在通用格式中，`string` 是你想要转换的字符串，`targetVariable`\
  \ 是一个 `int` 变量的名称。该方法尝试将 `string` 参数转换为 `int`。如果转换成功，转换后的值将存储在 `targetVariable`\
  \ 中，并且方法返回布尔值 `true` 表示转换成功。如果转换失败，该方法不会抛出异常。相反，它在 `targetVariable` 中存储 0 并返回布尔值\
  \ `false` 表示该字符串无法转换。\n\n仔细观察通用格式，注意单词 `out` 出现在 `targetVariable` 之前。`out` 关键字是必须的，它指定\
  \ `targetVariable` 是一个输出变量。输出变量是参数传递给方法的变量，当方法完成后，一个值会存储在该变量中。\n\n由于 `TryParse`\
  \ 方法返回 `true` 或 `false`，它们通常被用作 `if` 语句。下面的代码是一个使用 `int.TryParse` 方法的示例。在示例中，假设\
  \ `inputTextBox` 是 `TextBox` 控件的。\n\n```\nint number;\nif (int.TryParse(inputTextBox.Text,\
  \ out number))\n{\n   MessageBox.Show(\"Success!\");\n}\nelse\n{\n   MessageBox.Show(\"\
  Enter a valid integer.\");\n}\n```\n\n这段代码的作用是将 `inputTextBox` 控件的 `Text` 属性转换为\
  \ `int` 并赋值给 `number`。在第 3 行，`if` 语句调用 `int.TryParse` 方法，并将 `inputTextBox.Text`\
  \ 作为参数 1，`number` 作为参数 2。\n\n* 如果 `inputTextBox.Text` 成功转换，执行第 5 行。\n* 如果 `inputTextBox.Text`\
  \ 无法转换，将 0 赋值给 `number` 并执行第 9 行（`else` 子句）。\n\n其他 `TryParse` 方法的工作方式类似。这里是调用 `double.TryParse`\
  \ 方法的通用格式：\n\n```\ndouble.TryParse(string, out targetVariable)\n```\n\n下面的代码是一个使用\
  \ `double.TryParse` 方法的示例。\n\n```\ndouble number;\nif (double.TryParse(inputTextBox.Text,\
  \ out number))\n{\n   MessageBox.Show(\"Success!\");\n}\nelse\n{\n   MessageBox.Show(\"\
  Enter a valid double.\");\n}\n```\n\n这里是调用 `decimal.TryParse` 方法的通用格式：\n\n```\n\
  decimal.TryParse(string, out targetVariable)\n```\n\n\n\n\n```\n 1 decimal number;\n\
  \ 2\n 3 if (decimal.TryParse(inputTextBox.Text, out number))\n 4 {\n 5     MessageBox.Show(\"\
  Success!\");\n 6 }\n 7 else\n 8 {\n 9     MessageBox.Show(\"Enter a valid decimal.\"\
  );\n10 }\n```\n\n# 验证多个 TextBox 中的数据\n\n如果表单有多个 `TextBox`，用户就有多次机会输入无效数据。一个设计良好的程序应该单独验证每个\
  \ `TextBox` 的内容。当发现无效数据时，程序应该显示错误消息，告诉用户具体是哪个 `TextBox` 包含了错误的输入。\n\n这种技术需要一组嵌套的\
  \ `if` 语句。例如，假设一个表单有两个 `TextBox`。下面的伪代码显示了验证每个 `TextBox` 的逻辑。（在伪代码中，一组虚线将每个 `If`\
  \ 语句与其对应的 `Else` 子句及其结束标记连接起来。）\n\n![截图显示了包含一组两个嵌套“if” 语句的伪代码。](img/UNFG_04_003.png)4.7-10\
  \ 完整替代文本\n\n让我们看看这种逻辑在实际的 C# 代码中是怎样的。在本书的学生示例程序 `Chap04` 文件夹中，你会找到一个名为 `Add Two\
  \ Numbers` 的项目。应用程序的表单所示图 4-21。运行应用程序时，向每个 `TextBox` 控件输入一个整数，然后点击 `Add` 按钮。弹出一个消息框显示两个数字的和。如果你在任一\
  \ `TextBox` 中输入整数以外的任何内容，将出现错误消息，告知哪个 `TextBox` 包含了无效数据。\n\n# 图 4-21 Add Two Numbers\
  \ 表单\n\n![截图显示了一个带有控件名称的表单，用于两个两个数字。](img/FG_04_021.png)图 4-21 完整替代文本\n\n以下是 `addButton_Click`\
  \ 事件处理程序的代码：\n\n```\n 1  private void addButton_Click(object sender, EventArgs e)\n\
  \ 2  {\n 3      // 局部变量\n 4      int first, second, sum;\n 5\n 6      if (int.TryParse(firstTextBox.Text,\
  \ out first))\n 7      {\n 8          if (int.TryParse(secondTextBox.Text, out second))\n\
  \ 9          {\n10              // 将两个数字相加并显示和。\n11              sum = first + second;\n\
  12              MessageBox.Show(sum.ToString());\n13          }\n14          else\n\
  15          {\n16              // 关于第二个 TextBox 显示错误消息。\n17              MessageBox.Show(\"\
  The second TextBox contains invalid data.\");\n18          }\n19      }\n20    \
  \  else\nelse1      {\n22          // 关于第一个 TextBox 显示错误消息。\n23          MessageBox.Show(\"\
  The first TextBox contains invalid data.\");\n24      }\n25  }\n```\n\n让我们仔细观察一下：\n\
  \n* 第 4 行声明了三个 `int` 变量：`first`、`second` 和 `sum`。\n* 第 6 行的 `if` 语句尝试将 `firstTextBox.Text`\
  \ 转换为 `int`。如果转换成功，结果将存储在 `first` 变量中，程序继续第 8 行执行。如果转换失败，程序将跳转到第 20 行的 `else` 子句，第\
  \ 23 行显示关于第一个 `TextBox` 控件的错误消息。\n* 第 8 行的 `if` 语句尝试将 `secondTextBox.Text` 转换为 `int`。如果转换成功，结果将存储在\
  \ `second` 变量中，程序继续第 10 行执行。如果转换失败，程序将跳转到第 14 行的 `else` 子句，第 17 行显示关于第二个 `TextBox`\
  \ 控件的错误消息。\n* 第 11 行和第 12 行的语句只有在两个 `TextBox` 控件都包含有效的整数值时才会执行。这些语句将 `first` 和 `second`\
  \ 变量相加并显示它们的和。\n\n如果你需要验证三个 `TextBox` 控件，将编写一组三个嵌套的 `if` 语句。以下是伪代码：\n\n![截图显示了包含一组三个嵌套“if”\
  \ 语句的伪代码。](img/UNFG_04_004.png)4.7-11 完整替代文本\n\n在教程 4-4 中，你完成了一个使用 `TryParse` 方法来验证输入到两个\
  \ `TextBox` 中的数据的应用程序。\n\n# 节点\n\n1. 4.22 如果 `TryParse` 成功转换字符串，它返回什么值？如果没有成功，返回什么？\n\
  2. 4.23 如果 `TryParse` 成功转换字符串，它存储在何处？\n3. 4.24 `out` 关键字出现时表示什么？\n4. 4.25 `TryParse`\
  \ 是什么？\n\n# 4.8 输入验证\n\n### 概念\n\n输入验证是对已输入的数据进行检查以确保其有效的过程。在上一节中，你学习了使用 `TryParse`\
  \ 方法来验证输入到 `TextBox` 中的数据。程序员中最著名的格言之一是“垃圾进，垃圾出”（garbage in, garbage out）。这句话有时缩写为\
  \ GIGO，指的是如果程序接收到不良输入，就会产生不良输出。例如，考虑一个接受员工工时的工资程序。如果工资单员不小心输入了 400 小时而不是 40 小时，将会写巨大的支票，因为计算机并不知道事实，除非程序编写了捕捉此类错误，否则它将处理不良数据。新闻有时会报道有关计算机错误的故事，这些错误导致人们因小额购买收取数千美元或收到不属于他们的大额退款。这些“计算机错误”很少由计算机引起；它们通常是由软件漏洞或不良数据引起的。程序输出的完整性取决于其输入。因此，你应该以这种方式编写程序，使其拒绝不良输入。当给程序输入时，应该在处理之前对其进行检查。如果输入无效，程序应该将其丢并提示用户输入正确的数据。\n\
  \n例如，在工资程序中，我们可以这样验证工时：\n\n```\n 1 if (int.TryParse(hoursWorkedTextBox.Text, out\
  \ hours))\n 2 {\n 3     if (hours > 0 && hours <= 168)\n 4     {\n 5         //\
  \ 继续处理输入。\n 6     }\n 7     else\n 8     {\n 9         MessageBox.Show(\"Invalid\
  \ number of hours entered.\");\n10     }\n 11 }\n12 else\n13 {\n14     MessageBox.Show(\"\
  The hours worked must be an integer.\");\n15 }\n```\n\n\n\n\n让我们来看另一个例子。以下代码来自一个获取测试分数作为输入的应用程序。有效的测试分数是\
  \ 0 到 100 范围内的整数。\n\n```\n 1 if (int.TryParse(testScoreTextBox.Text, out testScore))\n\
  \ 2 {\n 3     if (testScore >= 0 && testScore <= 100)\n 4     {\n 5         // 继续处理输入。\n\
  \ 6     }\n 7     else\n 8     {\n 9         MessageBox.Show(\"测试分数必须在 0 − 100 范围内.\"\
  );\n10     }\n11 }\n12 else\n13 {\n14     MessageBox.Show(\"测试分数必须是整数。\");\n15 }\n\
  ```\n\n假设应用程序使用名为 `testScoreTextBox` 的 `TextBox` 来获取测试分数。同样假设变量 `testScore` 已经声明为\
  \ `int`。外部 `if` 语句（第 1 行）使用 `int.TryParse` 方法来确保用户输入了整数。如果是，该值将存储在 `testScore` 变量中，程序继续执行内部\
  \ `if` 语句（第 3 行）。内部 `if` 语句确保只有当 `testScore` 大于等于 0 *且* `testScore` 小于等于 100 时，我们才处理该输入。\n\
  \n## 4.9 单选按钮和复选框\n\n### 概念\nGUI 通常使用单选按钮和复选框让用户选择项目。\n\n### 单选按钮\n当你想要让用户从多个可能的选项中选择一个时，单选按钮非常有用。图\
  \ 4-24 显示了一个运行时运行时，包含一组三个单选按钮。图中的单选按钮允许用户选择 `Coffee`（咖啡）、`Tea`（茶）或 `Soft Drink`（饮料）。\n\
  \n### 图 4-24 单选按钮\n![显示带有单选按钮的应用程序窗口。](img/FG_04_024.png)图 4-24 完整备用文本\n\n单选按钮可以选中或未选中。每个单选按钮都有一个小圆圈，当单选按钮被选中时，圆圈显示为填充；当未选中时，显示为空。在图\
  \ 4-24 中，`Coffee` 单选按钮被选中，而其他单选按钮未被选中。\n\n在运行时，一组中的单选按钮同时只能被选中一个。点击单选按钮会选中它，并自动取消同一组内任何其他单选按钮的选择。我们称此为互斥选择。\n\
  \n### 注意\n*radio button*（单选按钮）这个名称指的是旧式带有用于选择台台按钮的汽车收音机。一次只能按下一个按钮。当你按下一个按钮时，当前选中的按钮会自动弹出。\n\
  \n当你想在表单上创建一组单选按钮时，你可以使用 `RadioButton` 控件，它位于*Toolbox*（工具箱）中的*Common Controls*（公共控件）部分。`RadioButton`\
  \ 通常以以下方式之一分组：\n\n*   你将它们放在 `GroupBox` 控件内部。`GroupBox` 内的所有 `RadioButton` 控件都是同一组的成员。\n\
  *   你将它们放在 `Panel` 控件内部。`Panel` 内的所有 `RadioButton` 控件都是同一组的成员。\n*   你将它们放在表单上但不在\
  \ `GroupBox` 或 `Panel` 内部。表单上所有不在 `GroupBox` 或 `Panel` 内部的 `RadioButton` 控件都是同一组的成员。\n\
  \n图 4-25 显示了一个运行时运行时，包含两组 `RadioButton` 控件的表单。左侧的一组在 `GroupBox` 控件内部，右侧的一组在 `Panel`\
  \ 控件内部。当应用程序运行时，用户将能够从每个组中仅选择一个 `RadioButton`。在图中，左组选了 `Coffee`，右组选择了 `Lunch`（午餐）。\n\
  \n### 图 4-25 带有两组 RadioButton 控件的表单\n![显示带有两组 RadioButton 控件的应用程序窗口。](img/FG_04_025.png)图\
  \ 4-25 完整备用文本\n\n### RadioButton 控件的 Text 属性\n`RadioButton` 控件有一个 `Text` 属性，它保存显示在单选按钮圆圈旁边的文本。例如，图\
  \ 4-24 中显示的单选按钮分别设置为 `Coffee`、`Tea` 和 `Soft Drink`。\n\n### RadioButton 的 Checked\
  \ 属性\n`RadioButton` 控件有一个 `Checked` 属性，它决定单选按钮是被选中还是未选中。该属性是一个布尔值，意味着它可能是 `True`\
  \ 或 `False`。\n\n### 在代码中使用单选按钮\n在代码中，你可以通过测试 `Checked` 属性来确定单选按钮是否被选中。例如，假设表单有一个名为\
  \ `choice1` 的 RadioButton。以下 `if` 语句判断它是否被选中：\n\n```\nif (choice1.Checked)\n{\n\
  \   MessageBox.Show(\"你选择了\");\n}\n```\n注意，我们没有显式地使用 `==` 运算符来比较 `Checked` 属性与 `true`。这段代码等同于：\n\
  \n```\nif (choice1.Checked == true)\n{\n   MessageBox.Show(\"你选择了\");\n}\n```让我们来看一个使用多个单选按钮的例子。打开书中\
  \ *Chap4* 文件夹下的 *RadioButton* 项目。应用程序的表单如图 4-26 所示。运行应用程序，选择一个单选按钮然后点击 *OK* 按钮。弹出的对话框显示你选择的项目。\n\
  \n### 图 4-26 RadioButton 示例表单\n![显示使用多个 RadioButton 控件的应用程序窗口。](img/FG_04_026.png)图\
  \ 4-26 完整备用文本\n\n以下是 `okButton_Click` 事件处理程序的代码：\n\n```csharp\nprivate void okButton_Click(object\
  \ sender, EventArgs e)\n{\n    if (footballRadioButton.Checked)\n    {\n       \
  \ MessageBox.Show(\"你选择了足球。\");\n    }\n    else if (basketballRadioButton.Checked)\n\
  \    {\n        MessageBox.Show(\"你选择了篮球。\");\n    }\n    else if (baseballRadioButton.Checked)\n\
  \    {\n        MessageBox.Show(\"你选择了棒球。\");\n    }\n}\n```\n\n当事件处理器执行时，第 3 行的\
  \ `if` 语句判断 `footballRadioButton` 控件的 `Checked` 属性是否为真。如果是，则第 5 行显示“你选择了足球”。否则，第\
  \ 7 行判断 `basketballRadioButton` 控件的 `Checked` 属性是否为真。如果是，第 9 行显示“你选择了篮球”。否则，第 11\
  \ 行判断 `baseballRadioButton` 控件的 `Checked` 属性是否为真。如果是，第 13 行显示“你选择了棒球”。\n\n\n\n复选框显示为一个小方框，旁边附有一些文本。图\
  \ 4-27 显示了一个示例。它们之所以被称为复选框，是因为点击空复选框会在其中显示一个勾选标记。如果复选框中已经出现了勾选标记，点击它就会移除该标记。\n\n\
  # 图 4-27 复选框\n\n![截图显示了一个空的小复选框，旁边附有文本，内容为“Pepperoni（意大利米腊肠）”。](img/FG_04_027.png)\n\
  \n复选框与单选按钮类似，不同之处复选框不是互斥的。你可以在一组中拥有一个或多个复选框，并且在任何给定时间内都可以选择其中的任意数量。当你想要在表单上创建复选框时，你可以使用\
  \ `CheckBox` 控件，该控件位于 `Toolbox` 的 `Common Controls` 部分。\n\n# CheckBox 控件的 Text 属性\n\
  \nCheckBox 控件有一个 `Text` 属性，它存储显示在复选框旁边的文本。例如，图 4-27 所示的 `CheckBox` 控件的 `Text` 属性被设置为\
  \ `Pepperoni`。\n\n# CheckBox 控件的 Checked 属性\n\n与单选按钮一样，CheckBox 控件有一个 `Checked`\
  \ 属性。当 `CheckBox` 控件被选中（勾选）时，其 `Checked` 属性被设置为 `True`。当 `CheckBox` 控件被取消选中（取消勾选）时，其\
  \ `Checked` 属性被设置为 `False`。\n\n# 在代码中使用 CheckBox 控件\n\n在代码中，你可以通过测试其 `Checked` 属性来确定\
  \ `CheckBox` 控件是否被选中。例如，假设表单上有一个名为 `option1CheckBox` 的 `CheckBox` 控件。以下 `if` 语句确定了它是否被选中：\n\
  \n```\nif (option1CheckBox.Checked)\n{\n   MessageBox.Show(\"You selected Option\
  \ 1.\");\n}\n```\n\n让我们来看一个示例程序。打开本书 `Chap04` 文件夹中的 `CheckBox Example` 项目。应用程序的表单如图\
  \ 4-28。当你运行应用程序时，选择任何复选框，然后点击 `OK` 按钮。会出现一个或多个消息框，向你显示你所选择的项目。\n\n# 图 4-28 CheckBox\
  \ Example 表单\n\n![截图显示了一个使用复选框的应用程序窗口示例。](img/FG_04_028.png)图-4-28 完整备用文本\n\n以下是\
  \ `okButton_Click` 事件处理程序的代码：\n\n```\n1 private void okButton_Click(object sender,\
  \ EventArgs e)\n2 {\n3     if (pepperoniCheckBox.Checked)\n4     {\n5         MessageBox.Show(\"\
  You selected Pepperoni.\");\n6     }\n7\n8     if (cheeseCheckBox.Checked)\n9  \
  \   {\n10         MessageBox.Show(\"You selected Cheese.\");\n11     }\n```\n\n\
  注意这里三个独立的 `if` 语句。第 3 行的 `if` 语句判断 `pepperoniCheckBox` 是否被选中。如果是，则第 5 行显示消息。第 8\
  \ 行的 `if` 语句判断 `cheeseCheckBox` 是否被选中。如果是，则第 10 行显示消息。第 13 行的 `if` 语句判断 `anchoviesCheckBox`\
  \ 是否被选中。如果是，则第 15 行显示消息。\n\n# CheckedChanged 事件\n\n每当单选按钮或复选框的 `Checked` 属性发生变化时，都会触发\
  \ `CheckedChanged` 事件。如果你想在选中或取消选中单选按钮或复选框时执行某些操作，可以为它们创建 `CheckedChanged` 事件。\n\
  \n在代码中为单选按钮或复选框创建 `CheckedChanged` 事件。图 4-5 只要当属性发生变化时，`CheckedChanged` 事件就会发生。\n\
  \n# switch 语句\n\n`switch` 语句允许变量的值决定执行的路径。图 4-30 显示了一个多分支的示例。\n\n`switch` 语句的第一行以\
  \ `switch` 开头，后面跟着一个在括号内的 `testExpression`。`testExpression` 是产生整数、字符串或 `bool` 值的变量或表达式。（我们尚未讨论的其他数据类型也是允许的。要重要的是\
  \ `testExpression` 不能是浮点或 `decimal` 值。）\n\n从下一行开始是用花括号括起来的代码块。块内部包含一个或多个 `case`\
  \ 部分。`case` 部分以 `case` 单词开头，跟着一个值，一个冒号。每个 `case` 部分包含一个或多个语句，然后是一个 `break` 语句。每个\
  \ `case` 部分都必须以 `break` 语句结束。最后是一个可选的 `default` 部分。`default` 部分也必须以 `break` 语句结束。\n\
  \n当 `switch` 语句执行时，它会将 `testExpression` 的值与每个 `case` 语句后面的值进行比较。当发现一个与 `testExpression`\
  \ 值匹配的 `case` 值时，程序跳转到该 `case` 语句。执行 `case` 语句后面的语句，直到遇到 `break` 语句。此时，程序跳出 `switch`\
  \ 语句。如果 `testExpression` 不与任何 `case` 值匹配，程序跳转到 `default` 语句并执行紧随其后的语句。\n\n例如，以下代码执行的操作与图\
  \ 4-30 中的流程图相同：\n\n\n\n\n```switch\n switch (month)\n{\n   case 1:\n      MessageBox.Show(\"\
  January\");\n      break;\n   case 2:\n      MessageBox.Show(\"February\");\n  \
  \    break;\n   case 3:\n      MessageBox.Show(\"March\");\n      break;\n   default:\n\
  \      MessageBox.Show(\"Error: Invalid month\");\n      break;\n}\n```\n\n在这个示例中，`testExpression`\
  \ 是 `month` 变量。如果 `month` 变量的值为 1，程序将分支到 `case 1:` 部分并执行紧随其后的 `MessageBox.Show(\"\
  January\")` 语句。如果 `month` 变量的值为 2，程序将分支到 `case 2:` 部分并执行紧随其后的 `MessageBox.Show(\"\
  February\")` 语句。如果 `month` 变量的值为 3，程序将分支到 `case 3:` 部分并执行紧随其后的 `MessageBox.Show(\"\
  March\")` 语句。如果 `month` 变量的值不是 1、2 或 3，程序将分支到 `default:` 部分并执行紧随其后的 `MessageBox.Show(\"\
  Error: Invalid month\")` 语句。\n\n`switch` 语句可以作为 `if-else-if` 语句的替代方案，对同一个变量或表达式进行多个不同值的测试。例如，之前显示的\
  \ `switch` 语句工作方式如下面的 `if-else-if` 语句：\n\n```\n if (month == 1)\n{\n    MessageBox.Show(\"\
  January\");\n}\nelse if (month == 2)\n{\n    MessageBox.Show(\"February\");\n}\n\
  else if (month == 3)\n{\n    MessageBox.Show(\"March\");\n}\nelse\n{\n    MessageBox.Show(\"\
  Error: Invalid month\");\n}\n```\n\n要查看使用 `switch` 语句的应用程序，请查看本书 `Chap04` 文件夹下的\
  \ `Switch Example` 项目。\n\n# 检查点\n\n1. 4.29 将将以下 `if-else-if` 代码转换为 `switch` 语句：\n\
  \n```\n if (choice == 1)\n{\n    MessageBox.Show(\"You chose 1.\");\n}\nelse if\
  \ (choice == 2)\n{\n    MessageBox.Show(\"You chose 2.\");\n}\nelse if (choice ==\
  \ 3)\n{\n    MessageBox.Show(\"You chose 3.\");\n}\nelse\n{\n    MessageBox.Show(\"\
  Make another choice.\");\n}\n```\n\n# 4.11 列表框简介\n\n### 概念\n\n列表框（List boxes）显示项目列表，并允许用户从列表中选择一个项目。\n\
  \n列表框显示项目列表，并允许用户从列表中选择一个或多个项目。在 Visual C# 中，你使用 `ListBox` 控件在应用程序表单上创建列表框。图 4-31\
  \ 显示了一个运行时带有两个 `ListBox` 控件的表单。在运行时，用户可以选择项目中的某一个，导致该项目显示为选中状态。\n\n# 图 4-31 ListBox\
  \ 示例\n\n![截图显示了一个运行的应用程序表单，带有有两个 ListBox 控件。](img/FG_04_031.png)图 4-31 完整替代文本\n\n\
  图 4-31 最顶部的 `ListBox` 没有滚动条，但底部的有。当 `ListBox` 包含的项目多于显示空间时，就会出现滚动条。在图中，顶部的 `ListBox`\
  \ 有四个项目（Poodle、Great Dane、German Shepherd 和 Terrier），且所有项目都显示了。底部的 `ListBox` 显示四个项目（Siamese、Persian、Bobtail\
  \ 和 Burmese），但因为有滚动条，我们知道 `ListBox` 中的项目多于这四个。\n\n你将在工具箱（Toolbox）中找到 `ListBox` 控件。一旦创建了\
  \ `ListBox` 控件，就可以向其 `Items` 属性添加项目。添加到 `ListBox` 的 `Items` 属性的项目将显示在 `ListBox`\
  \ 中。\n\n要在设计时向 `Items` 属性存储值，请遵循以下步骤：\n\n1. 在设计器（Designer）窗口中选择 `ListBox` 控件。\n\
  2. 在属性（Properties）窗口中，`Items` 属性显示为 *(Collection)*。当你选择 `Items` 属性时，会出现省略号按钮[](images/Ellipses.png)。\n\
  3. 点击省略号按钮。出现如图 4-32 所示的字符串编辑器框。\n4. 输入要在 `ListBox` 中显示的值。每个值单独占一行。\n5. 输入所有值后，点击\
  \ `OK` 按钮。\n\n# 图 4-32 字符串编辑器\n\n![截图显示字符串编辑器框。](img/FG_04_032.png)图 4-32 完整替代文本\n\
  \n### 注意\n\n一旦掌握了必要的技能，你就可以从外部数据（如数据库）填充列表框的 `Items` 集合。\n\n# SelectedItem 属性\n\n\
  当用户在 `ListBox` 中选择项目时，该项目存储在 `ListBox` 的 `SelectedItem` 属性中。例如，假设应用程序有一个名为 `fruitListBox`\
  \ 的 `ListBox` 控件和一个名为 `selectedFruit` 的 `string` 变量。`fruitListBox` 控件包含 Apples、Pears、Bananas。如果用户选择了\
  \ `Pears`，以下语句将字符串 `\"Pears\"` 赋值给变量 `selectedFruit`：\n\n```\nselectedFruit = fruitListBox.SelectedItem.ToString();\n\
  ```\n注意你必须调用 `SelectedItem` 属性的 `ToString` 方法来获取字符串格式的值。\n\n# 确定是否选择了项目\n\n如果没有选择项目就尝试获取\
  \ `ListBox` 的值，会发生异常。因此，你应该在读取 `SelectedItem` 之前始终确保已选择项目。请使用 `SelectedIndex` 属性来实现这一点。存储在\
  \ `ListBox` 中的每个项目都有一个标识其在 `ListBox` 中位置的索引。第一个索引为 0，下一个为 1，以此此类推。最后一个索引值为 `n-1`，其中\
  \ `n` 是 `ListBox` 中的项目数。当用户在 `ListBox` 中选择项目时，该项目的索引存储在 `ListBox` 的 `SelectedIndex`\
  \ 属性中。如果 `ListBox` 中没有选择项目，`SelectedIndex` 属性被设置为 -1。在尝试获取 `SelectedItem` 属性的值之前，你可以使用\
  \ `SelectedIndex` 属性确保 `ListBox` 中已选择项目。只需在读取 `SelectedItem` 之前确保 `SelectedIndex`\
  \ 属性未设置为 -1 即可。这是一个示例：\n\n```\nif (fruitListBox.SelectedIndex != -1)\n{\n    selectedFruit\
  \ = fruitListBox.SelectedItem.ToString();\n}\n```\n在教程 4-6 中，你创建了一个允许用户从 `ListBox`\
  \ 控件中选择项目的应用程序。\n\n# 检查点\n\n1. 4.30 如何使用属性（Properties）窗口向 `ListBox` 控件添加项目？\n2.\
