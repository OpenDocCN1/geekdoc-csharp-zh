  \ Paris\",\n        RunningTime = 124,\n        RetailPrice = 16.95m\n    }\n};\n\
  ```\n\n以下代码段展示了我们如何使用 `foreach` 循环遍历 `List` 元素，并将每个元素传递给之前显示的 `DisplayRetail` 方法：\n\
  \n```csharp\nforeach (IRetail item in itemList)\n{\n    DisplayRetail(item);\n}\n\
  ```\n\n# 接口的限制\n\n接口在多个方面都受到了限制。以下是需要记住的一些重要局限性：\n\n- 你不能在接口中声明任何字段。只允许属性和方法。\n\
  - 在接口中声明的属性是抽象的，因此它们不能包含 `get` 和/或 `set` 关键字以外的任何代码。\n- 在接口中声明的方法是抽象的，因此不能包含任何代码。\n\
  - 接口的所有成员都是公共的（public），因此你不能为接口中的任何属性或方法列出访问修饰符。\n- 接口没有构造函数。\n- 你不能在接口内部声明类、结构体、枚举或其他接口。\n\
  - 接口只能继承自其他接口。接口不能继承类。\n\n# 检查点\n\n1. 11.18 接口的目的是什么？\n2. 11.19 接口与抽象类何相似之处？\n3.\
