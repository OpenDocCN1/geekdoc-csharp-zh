  public string Name { get; set; } = \"Fido\";\n```\n\n这段代码创建了一个 `Name` 属性，并初始化为值“Fido”。为了说明自动属性如何简化代码，请将之前展示的包含\
  \ 25 行代码的 `Pet` 类版本与这里显示的仅包含 5 行代码的版本进行比较。\n\n```csharp\n 1 class Pet  \n2 {\n3\
  \    // Name property\n4    public string Name { get; set; } = \"\";\n5 }\n```\n\
  \n# 只读自动属性\n\n如果你在自动属性中省略 `set` 关键字，该属性就会变为只读。这里有一个如何让 `Pet` 类的 `Name` 属性变为只读的示例：\n\
  \n```csharp\n 1 class Pet\n2 {\n3     // Name property\n4     public string Name\
  \ { get; } = \"Fido\";\n5 }\n```\n\n在这个示例中，`Name` 属性被初始化为值“Fido”。我们可以获取属性的值，但不能设置属性的值。如有必要，你可以在类的构造函数为只读自动属性赋值，如下所示：\n\
  \n```csharp\n 1\uFEFF class Pet\n 2\uFEFF {\n 3\uFEFF     // Constructor\n 4\uFEFF\
  \     public Pet()\n 5\uFEFF     {\n 6\uFEFF        Name = \"Fido\";\n 7\uFEFF \
  \    }\n 8\uFEFF \n 9\uFEFF     // Name property\n 10     public string Name { get;\
  \ }\n11 }\n```\n\n# 检查点\n\n1. 什么是属性？\n2. 如果尝试给只读属性赋值会发生什么？\n3. 如何让属性变为只读？\n4. 什么是过时数据？\n\
  \n# 10.3 参数化构造函数与重载\n\n### 概念\n\n接受参数的构造函数被称为参数化构造函数。类可以拥有相同方法的多个版本，被称为重载方法。\n\n\
  # 重载方法\n\n有时候，你需要不同的方式来执行相同的操作。例如，你在教程 10-2 中编写的 `BankAccount` 类有一个接受 `decimal`\
  \ 参数的 `Deposit` 方法。假设你正在一个需要向方法传递 `double` 变量而不是 `decimal` 变量的应用程序中使用该类。在该应用程序中调用\
  \ `Deposit` 方法之前，你必须将 `double` 变量转换为 `decimal` 才能传递给该方法。如果 `Deposit` 方法既可以接受 `decimal`\
  \ 参数也可以接受 `double` 参数就太好了。这可以通过重载来实现。\n\n当方法被重载时，意味着同一个类中的多个方法具有相同的名称但使用不同类型的参数。这里是我们如何在\
  \ `BankAccount` 类内部重载 `Deposit` 方法的示例：\n\n```csharp\n 1\uFEFF // Deposit method\n\
  \ 2\uFEFF public void Deposit(decimal amount)\n 3\uFEFF {\n 4\uFEFF     _balance\
  \ += amount;\n 5\uFEFF }\n 6\uFEFF\n 7\uFEFF // Deposit method\n 8\uFEFF public\
  \ void Deposit(double amount)\n 9\uFEFF {\n10     _balance += (decimal)amount;\n\
  11 }\n```\n\n第一个 `Deposit` 方法（第 2–5 行）接受 `decimal` 参数，并在第 4 行将其加到 `_balance` 字段上。第二个\
  \ `Deposit` 方法（第 8–11 行）接受 `double` 参数。第 10 行使用强制转换运算符将其转换为 `decimal`，并将结果赋值给 `_balance`\
  \ 字段。\n\n\n\n\n\n当你编写调用 `Deposit` 方法时，编译器必须确定你意图调用重载方法中的哪一个。将方法调用与正确方法匹配的过程被称为 `binding`（绑定）。当调用重载方法时，编译器使用方法的名称和参数列表来确定将该调用绑定到哪种方法上。如果我们调用\
  \ `Deposit` 方法并传递一个 `decimal` 类型参数，则会调用具有 `decimal` 参数的方法版本。同样地，如果我们调用 `Deposit`\
  \ 方法并传递一个 `double` 类型参数，则会调用具有 `double` 参数的方法版本。\n\n编译器使用方法的签名（`signature`）将其与同名的其他方法区分开来。方法的签名由方法的名称，以及方法的参数的数据类型和形参种类（按值传递、`ref`\
  \ 或 `out`）组成，从左到右排列。例如，这里是我们之前展示的 `Deposit` 方法的签名：\n\n```\nDeposit(decimal)\nDeposit(double)\n\
  ```\n\n注意，方法的返回类型不是签名的一部分。由于这个原因，你不能通过提供不同的返回类型来重载方法。\n\n# 重载构造函数\n\n构造函数也可以重载，这意味着一个类可以有多个构造函数。重载构造函数的规则与重载其他方法相同：每个版本的构造函数必须具有不同的参数列表。只要每个构造函数都有唯一的签名，编译器就能区分它们。\n\
  \n下面是一个我们如何重载 `BankAccount` 类构造函数的示例：\n\n```\n 1\uFEFF // 构造函数\n 2\uFEFF public\
  \ BankAccount()\n 3\uFEFF {\n 4     _balance = 0;\n 5\uFEFF }\n 6\n 7 // 构造函数\n\
  \ 8\uFEFF public BankAccount(decimal startingBalance)\n 9\uFEFF {\n10     _balance\
  \ = startingBalance;\n11 }\n```\n\n第一个构造函数（第 2–5 行）是无参数构造函数，这意味着它不接受任何参数。以下语句在创建\
  \ `BankAccount` 对象时调用了无参数构造函数：\n\n```\nBankAccount account = new BankAccount();\n\
  ```\n\n第二个构造函数（第 8–11 行）接受一个 `decimal` 参数。以下语句在创建 `BankAccount` 对象时调用了该构造函数：\n\n\
  ```\nBankAccount account = new BankAccount(500m);\n```\n\n以下语句也调用了第二个构造函数（第 8–11\
  \ 行），因为整数值可以隐式转换为 `decimal`：\n\n```\nBankAccount account = new BankAccount(500);\n\
  ```\n\n然而，以下代码会导致错误，因为没有一个接受 `double` 参数的构造函数：\n\n```\n// 错误\nBankAccount account\
  \ = new BankAccount(500.0);\n```\n\n# 默认构造函数\n\n编写一个没有任何构造函数的类是完全允许。如果你编写了一个完全没有构造函数的类，编译器会提供一个默认构造函数。默认构造函数是一个无参数构造函数（它不接受任何参数），并将对象的字段初始化为值\
  \ 0。（如果任何字段是引用变量，它们将初始化为特殊值 `null`。）\n\n# 对象初始化器语法\n\n如果你在创建对象时已经知道想要存储在对象属性中的值，则可以使用对象初始化器语法来初始化对象的属性。例如，假设我们有如下\
  \ `Circle` 类：\n\n```\n 1  class Circle\n2  {\n3      public int CenterX { get; set;\
  \ }\n4      public int CenterY { get; set; }\n5  }\n```\n\n我们可以使用对象初始化器语法这样初始化该类的实例：\n\
  \n```\nCircle ring = new circle { CenterX = 100, CenterY = 50 };\n```\n\n该语句在内存中创建了\
  \ `Circle` 类的实例。对象的名称是 `ring`。对象的 `CenterX` 属性将初始化为值 100，`CenterY` 属性将初始化为值 50。\n\
  \n让我们来看另一个例子。假设我们有如下 `Person` 类：\n\n```\n 1  class Person\n2  {\n3      public string\
  \ Name { get; set; }\n4      public string Email { get; set; }\n5  }\n```\n\n我们可以使用对象初始化器语法这样初始化该类的实例：\n\
  \n```\n Person person = new Person { Name = \"Janet Smith\", \n                \
  \             Email = \"janet@example.com\"};\n```\n\n该语句在内存中创建了 `Person` 类的实例。对象的名称是\
  \ `person`。对象的 Name 属性将初始化为“Janet Smith”，Email 属性将初始化为“janet@example.com”。\n\n当使用对象初始化器时，你不需要为每个属性都提供初始化器。接接的示例创建了一个\
  \ `Person` 对象，只初始化了 Name 属性。email 属性将初始化为 `null`，这是字符串的默认值。\n\n```\nPerson person\
  \ = new Person { Name = \"Janet Smith\" };\n```\n\n如果你正在使用对象初始化器，且对象的类有一个构造函数，则构造函数总会在初始化器赋值给对象的属性之前被调用。例如，查看下面的\
  \ `Person` 类：\n\n```\n 1  class Person\n 2  {\n 3      public Person()\n 4     \
  \ {\n 5          Name = \"unknown\";\n 6          Email = \"unknown\";\n 7     \
  \ }\n 8\n 9      public string Name { get; set; }\n10      public string Email {\
  \ get; set; }\n11  }\n```\n\n假设我们通过以下语句创建类的实例：\n\n```\n Person person = new Person\
  \ { Name = \"Janet Smith\", \n                             Email = \"janet@example.com\"\
  };\n```\n\n首先调用构造函数，Name 和 Email 属性初始化为“unknown”。然后，初始化器被应用，Name 属性将初始化为“Janet Smith”，Email\
  \ 属性将初始化为“janet@example.com”。\n\n# 检查\n\n1.  10.11 什么是参数化构造函数？\n2.  10.12 方法被重载意味着什么？\n\
  3.  10.13 将方法调用与正确方法匹配的过程是什么？\n4.  10.14 如果你编写了一个完全没有构造函数的类会发生什么？\n5.  10.15 描述默认构造函数的用途。\n\
  \n# 10.4 在数组和 `List` 中存储类类型对象\n\n### 概念\n\n你可以将类类型对象的集合存储在数组或 `List` 中。\n\n# 类类型数组\n\
  \n类实例的对象可以存储在数组中。例如，假设之前展示的 `CellPhone` 类存在于应用程序。以下代码创建了一个包含四个元素的 `CellPhone` 数组：\n\
  \n```\nconst int SIZE = 4;\nCellPhone[] phones = new CellPhone[SIZE];\n```\n\n\n\
  \n虽然这段代码创建了一个数组，但它尚未包含任何对象。当创建一个创建一个类类型的数组时，数组的每个元素都是引用变量。默认情况下，每个元素将被初始化为值 `null`。下一步是创建每个元素将引用的对象。可以逐个元素地完成，所示：\n\
  \n```\nphones[0] = new CellPhone();\nphones[1] = new CellPhone();\nphones[2] = new\
  \ CellPhone();\nphones[3] = new CellPhone();\n```\n\n或者，可以使用循环完成，所示：\n\n```\n for\
  \ (int index = 0; index < phones.Length; index++)\n{\n   phones[index] = new CellPhone();\n\
  }\n```\n\n或者，你可以在声明语句中初始化数组元素：\n\n```\nCellPhone[] phones =\n{\n    new CellPhone(),\
  \ new CellPhone(),\n    new CellPhone(), new CellPhone()\n};\n```\n\n接下来显示另一个示例。这段代码创建一个\
  \ `BankAccount` 数组，并将其元素初始化为四个 `BankAccount` 对象的引用。\n\n```\nBankAccount[] accounts\
  \ =\n{\n    new BankAccount(1000),\n    new BankAccount(2000),\n    new BankAccount(3000),\n\
  \    new BankAccount(4000)\n};\n```\n\n注意传递给每个对象的 `BankAccount` 构造构造的参数。如果执行以下代码，它将显示“The\
  \ balance is 1000”、“The balance is 2000”等：\n\n```\n for (int index = 0; index <\
  \ accounts.Length; index++)\n{\n   MessageBox.Show(\"The balance is \" +\n     \
  \              accounts[index].Balance);\n}\n```\n\n以下代码使用 `foreach` 循环执行相同的操作：\n\
  \n```\nforeach (BankAccount acct in accounts)\n{\n   MessageBox.Show(\"The balance\
  \ is \" +\n                   acct[index].Balance);\n}\n```\n\n# 类类型对象的 `List`\n\
  \n在第 7 章中，我们讨论了 `List` 类，它是用于存储对象集合的容器。这里是如何创建一个可以容 `CellPhone` 对象的 `List` 的示例：\n\
  \n```\nList<CellPhone> phoneList = new List<CellPhone>();\n```\n\n该语句创建一个由 `phoneList`\
  \ 变量引用的 `List` 对象。注意 `CellPhone` 一词写在尖括号 `<>` 中，紧跟在 `List` 之后。这指定了 `List` 只能包含 `CellPhone`\
  \ 类类型的对象。\n\n要向 `List` 添加对象，请使用 `Add` 方法。以下代码显示了一个示例：\n\n```\n 1 // 创建一个存放 CellPhone\
  \ 对象的 List。\n 2 List<CellPhone> phoneList = new List<CellPhone>();\n 3 \n 4 // 创建\
  \ CellPhone 类的实例。\n 5 CellPhone myPhone = new CellPhone();\n 6 \n 7 // 给对象的属性赋值。\n\
  \ 8 myPhone.Brand = \"Acme Electronics\";\n 9 myPhone.Model = \"M1000\";\n 10 myPhone.Price\
  \ = 199;\n 11 \n 12 // 将对象添加到 List 中。\n 13 phoneList.Add(myPhone);\n```\n\n第 2 行的语句创建一个名为\
  \ `phoneList` 的、可以存放 `CellPhone` 对象的 `List`。第 5 行创建了一个由 `myPhone` 变量引用的 `CellPhone`\
  \ 类的实例。（注：原文后续存在大量重复和干扰，已提取核心含义）。\n\n# 检查点\n\n1.  `List` 只能包含 `CellPhone` 对象。\n\
  2.  `List` 只能包含 `CellPhone` 对象。\n3.  `List` 只能包含 `CellPhone` 对象。\n\n\n\n我们可以为这些中的每个项确定一个单一的类。在这个示例中，我们从列表中任意地删除了\
  \ `cars` 和 `foreign cars`，并使用单词 `car`。同样，我们从列表中删除了 `Joe’s Automotive Shop`，并使用单词\
  \ `shop`。更新后的潜在类列表如下：\n\n* address\n* BMW\n* car\n* ~~cars~~\n* customer\n* estimated\
  \ labor charges\n* estimated parts charges\n* ~~foreign cars~~\n* ~~Joe’s Automotive\
  \ Shop~~\n* make\n* manager\n* Mercedes Benz\n* model\n* name\n* Porsche\n* sales\
  \ tax\n* service quote\n* shop\n* telephone number\n* total estimated charges\n\
  * year\n\n## 2. **某些名词可能代表我们为了解决问题而不需要关注的项**。\n\n对问题描述的快速回顾提醒了我们我们的应用程序应该做什么：打印一份服务报价单。在例例中，我们可以从列表中消除两个不必要的类：\n\
  \n* 我们可以从列表中划掉 `shop`，因为我们的应用程序只需要关注单个的服务报价单。它不需要处理或确定任何公司范围的信息。如果问题描述要求我们保留所有服务报价单的总和，那么为商店建立一个类就有意义了。\n\
  * 我们不需要为 `manager` 创建类，因为问题陈述没有指示我们处理任何关于经理的信息。如果有多个商店经理，并且问题描述要求我们记录是哪个经理生成了每个服务报价单，那么为经理建立一个类就有意义了。\n\
  \n此时，更新后的潜在类列表如下：\n\n* address\n* BMW\n* ~~car~~\n* ~~cars~~\n* customer\n* estimated\
  \ labor charges\n* estimated parts charges\n* ~~foreign cars~~\n* ~~Joe’s Automotive\
  \ Shop~~\n* make\n* ~~manager~~\n* Mercedes Benz\n* model\n* name\n* Porsche\n*\
  \ sales tax\n* service quote\n* ~~shop~~\n* telephone number\n* total estimated\
  \ charges\n* year\n\n## 3. **某些名词可能代表对象，而不是类**。\n\n我们可以将 `Mercedes`、`Porsche` 和\
  \ `BMW` 作为类排除，因为在这个示例中，它们都代表特定的汽车，可以被视为 `car` 类的实例。此时，更新后的潜在类列表如下：\n\n* address\n\
  * ~~BMW~~\n* car\n* ~~cars~~\n* customer\n* estimated labor charges\n* estimated\
  \ parts charges\n* ~~foreign cars~~\n* ~~Joe’s Automotive Shop~~\n* make\n* ~~manager~~\n\
  * ~~Mercedes Benz~~\n* model\n* name\n* ~~Porsche~~\n* sales tax\n* service quote\n\
  * ~~shop~~\n* telephone number\n* total estimated charges\n* year\n\n## 4. **某些名词可能代表可以赋值给变量的简单值，不需要类**。\n\
  \n类包含数据属性和方法。数据属性是定义对象状态的字段和属性。方法是该类的对象可以执行的操作或行为。如果一个名词代表的项类型没有任何可识别的数据属性或方法，那么它可能可以从列表中消除。为了帮助判断一个名词是否代表具有数据属性和方法的项，可以就它提出以下问题：\n\
  \n* 你是否会使用一组相关值来表示该项的状态？\n* 该项是否有任何显而易见的操作？\n\n如果这两个问题的答案都是否，那么该名词可能代表一个可以存储在简单变量中的值。如果我们将此测试应用于列表中剩余的每个名词，我们可以得出以下项可能不是类：`address`、`estimated\
  \ labor charges`、`estimated parts charges`、`make`、`model`、`name`、`sales tax`、`telephone\
  \ number`、`total estimated charges` 和 `year`。这些都是可以存储在变量中的简单字符串或数值。以下是更新后的潜在类列表：\n\
  \n* ~~address~~\n* ~~BMW~~\n* car\n* ~~cars~~\n* customer\n* ~~estimated labor charges~~\n\
  * ~~estimated parts charges~~\n* ~~foreign cars~~\n* ~~Joe’s Automotive Shop~~\n\
  * ~~make~~\n* ~~manager~~\n* Mercedes Benz\n* ~~model~~\n* ~~name~~\n* Porsche\n\
  * ~~sales tax~~\n* service quote\n* ~~shop~~\n* ~~telephone number~~\n* ~~total\
  \ estimated charges~~\n* ~~year~~\n\n### 注意\n\n一些面向对象的设计师会注意名词是复数还是单数。有时复数名词表示一个类，而单数名词表示一个对象。\n\
  \n从列表中可以看出，我们删除了 `car`、`customer` 和 `service quote` 外的所有内容。这意味着在我们的应用程序中，我们需要类来表示汽车、客户和服务报价单。最终，我们将编写一个\
  \ `Car` 类、一个 `Customer` 类和一个 `ServiceQuote` 类。\n\n# 识别类的职责\n\n一旦确定了类，接下来的任务就是识别每个类的职责。类的职责如下：\n\
  \n* 类负责知道的事项\n* 类负责执行的操作\n\n当你识别出类负责知道的事项时，你就识别了类的字段和/或属性。同样，当你识别出类负责执行的操作时，你就识别了它的方法。\n\
  \n问这些问题通常很有帮助：在这个问题的语境下，类必须知道什么？类必须做什么？寻找答案的第一个地方是在问题领域的描述中。许多类必须知道和做的事项会被提到。然而，某些类的职责可能没有在问题领域中直接提到，因此通常需要头脑风暴。让我们将这种方法应用于我们之前从问题领域识别出的类。\n\
  \n# `Customer` 类\n\n在我们问题的语境下，`Customer` 类必须知道什么？描述直接提到了以下项：\n\n* 客户姓名\n* 客户的地址\n\
  * 客户的电话号码\n\n这些都是用字符串表示并存储为属性的值。`Customer` 类可能知道很多其他事情。在这一点上可能犯的错误是识别了太多对象负责知道的事务。在某些应用程序中，`Customer`\
  \ 类可能会知道客户的电子邮件地址。这个特定的问题领域没有提到客户的电子邮件地址用于任何目的，因此我们不应该将其包含为职责。\n\n现在让我们识别类的方法。在我们问题的语境下，`Customer`\
  \ 类必须做什么？唯一显而易见的操作是这些：\n\n* 创建并初始化 `Customer` 类的对象。\n* 获取和设置客户姓名。\n* 获取和设置客户的地址。\n\
  * 获取和设置客户的电话号码。\n\n从这个列表中可以看出，`Customer` 类将有一个构造函数，以及用于数据属性的字段和属性。以下代码展示了 `Customer`\
  \ 类可能如何编写：\n\n\n\n\n\n```cs\nclass Customer\n{\n    // \n    private string _name;\n\
  \    private string _address;\n    private string _phone;\n\n    // 构造函数\n    public\
  \ Customer(string name, string address, string phone)\n    {\n        _name = name;\n\
  \        _address = address;\n        _phone = phone;\n    }\n\n    // Name 属性\n\
  \    public string Name\n    {\n        get { return _name; }\n        set { _name\
  \ = value; }\n    }\n\n    // Address 属性\n    public string Address\n    {\n   \
  \     get { return _address; }\n        set { _address = value; }\n    }\n\n   \
  \ // Phone 属性\n    public string Phone\n    {\n        get { return _phone; }\n\
  \        set { _phone = value; }\n    }\n}\n```\n\n# `Car` 类\n\n在我们的问题域中，`Car` 类的对象必须知道什么？以下项目都是汽车的数据属性，并在问题域中被提到：\n\
  \n*   汽车品牌\n*   汽车型号\n*   汽车年份\n\n现在让我们确定该类的方法。在我们的问题域中，`Car` 类必须做什么？再次，唯一显而易见的动作是我们在大多数类中都能找到的标准方法集。具体来说，这些动作是：\n\
  \n*   创建并初始化 `Car` 类的对象。\n*   获取和设置汽车品牌。\n*   获取和设置汽车型号。\n*   获取和设置汽车年份。\n\n下面的代码显示了\
  \ `Car` 类可能是如何写的：\n\n```cs\nclass Car\n{\n    // 字段\n    private string _make;\n\
  \    private string _model;\n    private int _year;\n\n    // 构造函数\n    public Car(string\
  \ make, string model, int year)\n    {\n        _make = make;\n        _model =\
  \ model;\n        _year = year;\n    }\n\n    // Make 属性\n    public string Make\n\
  \    {\n        get { return _make; }\n        set { _make = value; }\n    }\n\n\
  \    // Model 属性\n    public string Model\n    {\n        get { return _model; }\n\
  \        set { _model = value; }\n    }\n\n    // Year 属性\n    public int Year\n\
  \    {\n        get { return _year; }\n        set { _year = value; }\n    }\n}\n\
  ```\n\n# `ServiceQuote` 类\n\n在我们的问题域中，`ServiceQuote` 类的对象必须知道什么？问题域提到了以下项目：\n\n\
  *   预估的零件费用\n*   预估的人工费用\n*   销售税\n*   总预估费用\n\n经过仔细的思考和一些头脑风暴发现，其中两个项目是计算结果：销售税和总预估费用。此外，为了计算销售税，该类还必须知道税率。\n\
  \n现在让我们确定该类的方法。在我们的问题域中，`ServiceQuote` 类必须做什么？再次，唯一显而易见的动作是我们在大多数类中都能找到的标准方法集。具体来说，这些动作是：\n\
  \n*   创建并初始化 `ServiceQuote` 类的对象。\n*   获取和设置预估的零件费用。\n*   获取和设置预估的人工费用。\n*   获取和设置税率。\n\
  *   获取销售税。\n*   获取总预估费用。\n\n下面的代码显示了 `ServiceQuote` 类可能是如何写的：\n\n```cs\nclass ServiceQuote\n\
  {\n    // 字段\n    private decimal _partsCharges;\n    private decimal _laborCharges;\n\
  \    private decimal _taxRate;\n\n    // 构造函数\n    public ServiceQuote(decimal partsCharges,\n\
  \        decimal laborCharges, decimal taxRate)\n    {\n        _partsCharges =\
  \ partsCharges;\n        _laborCharges = laborCharges;\n        _taxRate = taxRate;\n\
  \    }\n\n    // PartsCharges 属性\n    public decimal PartsCharges\n    {\n     \
  \   get { return _partsCharges; }\n        set { _partsCharges = value; }\n    }\n\
  \n    // LaborCharges 属性\n    public decimal LaborCharges\n    {\n        get {\
  \ return _laborCharges; }\n        set { _laborCharges = value; }\n    }\n\n   \
  \ // TaxRate 属性\n    public decimal TaxRate\n    {\n        get { return _taxRate;\
  \ }\n        set { _taxRate = value; }\n    }\n\n    // SalesTax 属性（只读）\n    public\
  \ decimal SalesTax\n    {\n        get { return _partsCharges * _taxRate; }\n  \
  \  }\n\n    // TotalCharges 属性（只读）\n    public decimal TotalCharges\n    {\n   \
  \     get\n        {\n            return _partsCharges + _laborCharges +\n     \
  \           (_partsCharges * _taxRate);\n        }\n    }\n}\n```\n\n# 这仅仅是开始\n\n\
  你应该将我们在本节中讨论的过程仅仅视为一个起点。重要的是意识到设计一个面向对象的应用程序是一个迭代过程。你可能需要多次尝试才能识别出所需的所有类，并确定它们所有的职责。随着设计过程展开，你将对问题有更深入的理解，因此你会看到改进设计的方法。\n\
