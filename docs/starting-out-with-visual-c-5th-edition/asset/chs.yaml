  \n\n删除控件非常简单：选中它，然后按下键盘上的 `Delete` 键。\n\n## 关于 Button 控件的更多信息\n\n你之前已经学习过，应用程序 GUI\
  \ 中的每个表单和每个控件都必须有一个可以识别它们的名称。当你创建 `Button` 控件时，它们会被自动赋予默认名称，如 `button1`、`button2`\
  \ 等。\n`Button` 控件有一个 `Text` 属性，该属性存储显示在按钮表面的文本。当创建 `Button` 控件时，其 `Text` 属性初始被设置为与\
  \ `Button` 控件的名称相同的值。因此，当你创建一个 `Button` 控件时，它的名称将显示在按钮上。例如，图 2-10 中的表单包含三个名为 `button1`、`button2`\
  \ 和 `button3` 的 `Button` 控件。\n\n## 图 2-10 带有三个 Button 控件的表单\n\n![截图显示了设计器标签页下一个空白项目的表单，表单中心有三个标记为“Button\
  \ 1”、“Button 2”和“Button 3”的 Button 控件。](img/FG_02_010.png)\n\n\n1. 第 1 步：确保 `Button`\
  \ 控件已选中。（如果你在控件周围没有看到边界框和大小调整手，只需点击控件即可选中它。）\n2. 第 2 步：在 `Properties` 窗口中找到 `Text`\
  \ 属性。\n3. 第 3 步：点击存放 `Text` 属性值的区域，然后删除当前值。然后在该位置输入新文本并按下 ![](img/page_54b.png)\
  \ 键。新文本将显示在按钮上。\n\n图 2-11 显示了更改 `Button` 控件的 `Text` 属性如何更改按钮表面显示的文本的示例。\n## 图 2-11\
  \ 修改了 Text 属性的 Button 控件\n\n![截图显示了空白项目表单上 Button 控件的 Properties 窗口，显示按钮文本已从“Button\
  \ 1”更改为“Click Me”。](img/FG_02_011.png)图 2-11 完整替代文本\n\n## 更改控件名称\n\n\n例如，假设你创建了一个用于计算税额的\
  \ `Button` 控件。如 `button1` 这样的默认名称无法表达按钮的作用。像 `calculateTaxButton` 这样的名称要好得多。当你处理应用程序代码并看到\
  \ `calculateTaxButton` 时，你就能准确知道它是哪一个按钮。\n\n1. 第 1 步：确保 `Button` 控件已选中。\n2. 第 2\
  \ 步：在 `Properties` 窗口中找到 `Text` 属性。\n3. 第 3 步：点击存放 `Text` 属性值的区域，然后删除当前值。然后在该位置输入新文本并按下\
  \ ![](img/page_54b.png) 键。新文本将显示在按钮上。\n\n\n\n这种命名样式被称为 `camelCase`（驼峰式），因为名称中出现的大写字母有时会让人联想到驼驼的驼峰。\n\
