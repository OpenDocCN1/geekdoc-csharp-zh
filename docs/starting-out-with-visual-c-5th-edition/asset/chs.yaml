  \n# 2.8 注释、空行和缩进\n\n注释是放置在程序中的简短说明。程序员通常使用空行和缩进来使代码更易读。\n\n# 注释\n\n在 C#中，有三种类型的注释：行注释、块注释和文档注释。行注释出现在一行中。你用两个正斜杠（`//`）开始行注释。斜杠之后一直到行尾的所有内容都会被忽略。以下代码示例显示了我们如何在教程\
  \ 2-5 中使用注释。每个行注释解释了紧随的一行代码。\n\n```\n    // 让卡片的背面变得可见。\n    cardBackPictureBox.Visible\
  \ = true;\n    // 让正面变得不可见。\n    cardFacePictureBox.Visible = false;\n\n行注释并不非占据整行。`//`符号之后到行尾的任何内容都会被忽略。因此，注释可以出现在执行语句之后。以下代码示例显示了一个例子。\n\
  \n```\n    cardBackPictureBox.Visible = true; // 显示卡片背面。\n    cardFacePictureBox.Visible\
  \ = false; // 隐藏卡片正面。\n}\n块注释可以占据程序中的连续行。块注释以`/*`（正斜杠加星号）开始，并以`*/`（星号加正斜杠）结束。这些标记之间的所有内容都会被忽略。以下代码示例显示了如何使用块注释。\n\
  \n```\n/*   showBackButton 控件的点击事件处理程序。\n*/\nprivate void showBackButton_Click(object\
  \ sender, EventArgs e)\n{\n}\n```\n\n此代码示例中的前五行是一个块注释，解释了`showBackButton_Click`方法的作用。块注释使得编写长解释变得更容易，因为你不需要为每一行标记注释符号。\n\
  \n*   小心不要反转起始符号（`/*`）和结束符号（`*/`）。\n*   不要忘记结束符号。\n\n这些错误中的每一个都可能难以追踪，并且会导致程序无法正确编译。\n\
  \n第三种注释被称为文档注释（documentation comment）。专业程序员使用文档注释在程序的源代码中嵌入详尽的文档。Visual Studio 可以从文档注释中提取信息，并生成外部文档文件。单行文档注释以三个正斜杠（`///`）开头。块文档注释以\
  \ `/**` 开始并以 `*/` 结束。虽然文档注释对专业程序员很有用，但我们在这书中并不使用它们。\n\n# 使用空行和缩进让你的代码更易读\n\n程序员通常在代码中使用空行和缩进来营造一种视觉上的组织感。这与作者在书页上对文本进行视觉布局的方式相似。他们不是将每一章写成一长串句子，而是将文本分成在页面上视觉上分离的段落。这并没有改变书中的信息，但让它变得更容易阅读。\n\
  \n```\n private void showBackButton_Click(object sender, EventArgs e)\n{\n   //\
  \ Make the image of the face of the card invisible.\n   cardFacePictureBox.Visible\
  \ = false;\n}\n程序员还使用缩进在视觉上组织代码。你可能注意到，在代码编辑器中，大括号（`{}`）内部的所有语句都缩进了。例如，命名空间内部的所有语句都缩进了，类内部的所有语句都缩进了，方法内部的所有语句都缩进了。事实上，Visual\
  \ Studio 通常被被设置为自动对你以此方式编写的代码进行缩进。\n\n虽然缩进不是必须的，但它让你的代码变得更容易读。通过对方法内部的语句进行缩进，你在视觉上将它们隔离开来。结果是你可以一眼看出哪些语句是在方法内部。类和命名空间也是如此。这种缩进的做法是几乎所有程序员都遵循的惯例。\n\
  \n1. 2.45 注释的作用是什么？\n2. 2.46 行注释和块注释有什么什么区别？\n3. 2.47 关于块注释的起始和结束符号，你应该注意记住什么？\n\
