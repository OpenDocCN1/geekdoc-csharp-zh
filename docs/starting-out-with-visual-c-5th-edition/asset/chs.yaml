  \ 8.11 一个程序有两个名为 `str1` 和 `str2` 的 `string` 变量。写一个语句从 `str1` 变量中去除开头和结尾的空白字符，并将结果赋值给\
  \ `str2` 变量。\n7. 8.12 一个程序有两个名为 `vegetable` 和 `veggie` 的 `string` 变量。写一个语句将 `vegetable`\
  \ 变量的全小写拷贝赋值给 `veggie` 变量。\n\n# 8.4 字符串分词\n\n### 概念\n\n分词（Tokenizing）是将字符串分解为更小的字符串组件的过程，这些组件被称为标记（tokens）。在\
  \ C# 中，`string` 对象有一个 `Split` 方法，可以对字符串的内容进行分词。\n\n有时，字符串包含一组由空格或其他字符分隔的单词或其他数据项。例如，查看以下字符串：\n\
  \n```\n\"peach raspberry strawberry vanilla\"\n```\n\n此字符串包含以下四个数据项：peach、raspberry、strawberry\
  \ 和 vanilla。在编程术语中，此类项被称为标记。注意项目与项目之间有一个空格。分隔标记的字符被称为分隔符（delimiter）。这是另一个例子：\n\n\
  ```\n\"17;92;81;12;46;5\"\n```\n\n此字符串包含以下标记：17, 92, 81, 12, 46, 5。注意项目与项目之间有一个空格。分隔标记的字符被称为分隔符。这是另一个例子：\n\
  \n```\n\"17;92;81;12;46;5\"\n```\n\n（注：由于原文中存在大量重复内容和格式错误，已根据要求提取核心文档内容进行翻译。）\n\n\
  \n\n\n在某些情况下，你需要在同一个字符串中使用多个字符作为分隔符。例如，查看以下电子邮件地址：\n\n```\njoe@gaddisbooks.com\n\
  ```\n\n该字符串使用了两个分隔符：`@`（*at* 符号）和 `.`（点）。为了从此字符串中提取令牌（tokens），我们必须指定这两个字符作为分隔符。以下是一个示例：\n\
  \n```\n 1 // 创建一个用于分字的字符串。\n 2 string str = \"joe@gaddisbooks.com\";\n 3\n 4 //\
  \ 创建分隔符数组。\n 5 char[] delim = { '@', '.' };\n 6\n 7 // 从字符串中获取令牌。\n 8 string[] tokens\
  \ = str.Split(delim);\n 9\n10 // 显示每个令牌。\n11 foreach (string s in tokens)\n12 {\n\
  13     MessageBox.Show(s);\n14 }\n```\n\n仔细查看代码：\n\n- 第 2 行声明了一个名为 `str` 的 `string`\
  \ 变量，并用字符串 `\"joe@gaddisbooks.com\"` 初始化。\n- 第 5 行声明了一个名为 `delim` 的 `char` 数组，并用字符\
  \ `'@'` 和 `'.'` 初始化。\n- 第 8 行声明了一个名为 `tokens` 的 `string` 数组。`tokens` 数组由 `str.Split(delim)`\
  \ 方法调用返回的数组初始化。执行此语句后，`tokens` 数组将拥有三个元素，包含字符串 `\"joe\"`、`\"gaddisbooks\"` 和 `\"\
  com\"`。\n- 第 11–14 行的 `foreach` 循环将 `tokens` 数组的每个元素显示在消息框中。当循环执行时，将连续显示四个消息框，依次显示字符串\
  \ `\"joe\"`、`\"gaddisbooks\"` 和 `\"com\"`。\n\n# 在分字前裁剪字符串\n\n当你对用户输入的字符串进行分字并使用空格以外的字符作为分隔符时，你可能希望在分字之前对字符串进行裁剪（trim）。否则，如果用户输入了开头空白字符，它们将成为第一个令牌的一部分。同样，如果用户输入了结尾空白字符，它们将成为最后一个令牌的一部分。例如，查看以下代码：\n\
  \n```\n 1 // 创建一个带有开头和结尾空格的字符串。\n 2 String str = \"   one;two;three   \";\n 3\n\
  \ 4 // 创建一个包含分号的 char 数组。\n 5 char[] delim = { ';' };\n 6\n 7 // 从字符串中获取令牌。\n 8\
  \ string[] tokens = str.Split(delim);\n 9\n10 // 显示每个令牌。\n11 foreach (string s in\
  \ tokens)\n12 {\n13     MessageBox.Show(\"*\" + s + \"*\");\n14 }\n```\n\n此代码会产生三个消息框，显示输出输出：\n\
  \n```\n*   one*\n*two*\n*   three   *\n```\n\n注意，第一个令牌包含了开头空格，最后一个令牌包含了结尾空格。为了防止开头和/或结尾空白字符包含在第一个和最后一个令牌中，请使用\
  \ `Trim` 方法移除它们。以下是修改后使用 `Trim` 方法的相同代码：\n\n```\n 1 // 创建一个带有开头和结尾空格的字符串。\n 2 String\
  \ str = \"   one;two;three   \";\n 3\n 4 // 创建一个包含分号的 char 数组。\n 5 char[] delim\
  \ = { ';' };\n 6\n 7 // 裁剪字符串。\n 8 str = str.Trim();\n 9\n10 // 从字符串中获取令牌。\n 11\
  \ string[] tokens = str.Split(delim);\n 12\n13 // 显示每个令牌。\n 14 foreach (string s\
  \ in tokens)\n15 {\n16     MessageBox.Show(\"*\" + s + \"*\");\n17 }\n```\n\n此代码会产生三个消息框，显示以下输出：\n\
  \n```\n*one*\n*two*\n*three*\n```\n\n在 教程 8-4 中，你完成了一个应用程序，该程序可以读取并分字从 Microsoft\
  \ Excel 导出的文件中读取的数据。\n\n# 检查点\n\n1. 8.13 下述字符串包含三个令牌。它们是什么？分隔符是哪个字符？\n\n   ```\n\
  \   \"apples pears bananas\"\n   ```\n\n2. 8.14 查看以下代码：\n\n   ```\n   string str\
  \ = \"one two three four\";\n   string[] tokens = str.Split(\" \");\n   int x =\
  \ tokens.Length;\n   string first = tokens[0];\n   ```\n\n   变量 `x` 将存储什么值？`first`\
  \ 变量将引用哪个值？\n\n3. 8.15 查看下字符串：\n\n   ```\n   \"/home/rjones/mydata.txt\"\n   ```\n\
  \n   使用 `Split` 方法编写代码，用于从该字符串中提取以下令牌：home, rjones, mydata 和 txt。\n\n4. 8.16 查看下字符串：\n\
  \n   ```\n   \"dog$cat@bird%squirrel\"\n   ```\n\n   使用 `Split` 方法编写代码，用于从该字符串中提取以下令牌：dog,\
  \ cat, bird, squirrel。\n\n5. 8.17 声明一个名为 `delimiters` 的 `char` 数组并用分号初始化它。\n\n6.\
  \ 8.18 `String.Format` 方法的用途是什么？\n\n# String.Format 方法\n\n### 概念\n\n`String.Format`\
  \ 方法允许你将值插入字符串中。你经常需要将值插入字符串。实现此目的的方法是使用字符串拼接。示例如下：\n\n```\nstring message = \"\
  Our sales are \" + sales + \" for the day.\";\n```\n\n方法是使用 `String.Format`。示例如下：\n\
  \n```\ndecimal sales = 1000;\nstring message = String.Format(\"Our sales are {0}\
  \ for the day.\", sales);\n```\n\n在此示例中，`String.Format` 方法接收两个参数：\n\n- `\"Our sales\
  \ are {0} for the day.\"` 是格式字符串\n- `sales` 是参数 0\n\n当代码执行时，`sales` 的值将被插入字符串。注意字符串内部出现的特殊序列\
  \ `{0}`。这被称为令牌（format item）。令牌是待插入值的占位符。括号内的数字是标识参数的索引。0 表示参数 0，1 表示参数 1，以此此类推。因此，返回的字符串为：\n\
  \nOur sales are 1000 for the day.\n\n这是另一个示例：\n\n```\ndouble temp1 = 72.5, temp2\
  \ = 83.7;\nstring message = String.Format(\"The temperatures are {0} and {1} degrees\"\
  , temp1, temp2);\n```\n\n在此示例中，参数 0 是变量 `temp1`，参数 1 是变量 `temp2`。当代码执行时，返回的字符串为：\n\
  \n```\nThe temperatures are 72.5 and 83.7 degrees.\n```\n\n# 格式化参数\n\n在令牌中，你可以选择包含一个格式指定符（format\
  \ specifier），以特定方式格式化参数。例如，如果你想将数字格式化为货币，可以包含 `C` 格式指定符，如下所示：\n\n```\ndecimal amount\
  \ = 123456789.45678m;\n```\n\n```c-sharp\nstring message = String.Format(\"The balance\
  \ is {0:C}\", amount);\n```\n\n注意索引和格式指定符之间用冒号分隔。当代码执行时，`String.Format` 方法返回的字符串为：\n\
  \n```\nThe balance is $123,456,789.46\n```\n\n\n\n\n\n支持多种格式说明符。[表 8−7] 列出了其中一些。请注意，这些格式说明符与你在\
  \ [第 3 章] 中讨论的、用于 `ToString()` 方法的格式说明符相同。\n\n# 表 8−7 格式说明符\n\n| 格式说明符 | 描述 |\n\
  | --- | --- |\n| N | 数字格式–使用逗号作为分隔符并使用小数点对数字进行格式化。默认情况下，小数点后显示两位数字。负值以前置负号开头显示。例如\
  \ -2,345.67。 |\n| F | 固定点格式–使用不带逗号的分隔符并使用小数点对数字进行格式化。默认情况下，小数点后显示两位数字。负值以前置 `-`\
  \ 号开头显示。例如 -2345.67。 |\n| E | 科学计数法格式–数字在小数点左侧保留一位数字进行格式化。字母 e 出现在指数前面，指数带有前置 +\
  \ 或 - 号。默认情况下，小数点后显示六位数字，如果数字为负数，则使用前置负号。例如 -2.345670e + 003。 |\n| C | 货币格式–将数字格式化为包含前置货币符号（如\
  \ $）、逗号分隔符和小数点。默认情况下，小数点后显示两位数字。负值用括号括起。负值的示例为 ($2,345.67)。 |\n| P | 百比格式–将数字乘以\
  \ 100，并带有尾随空格和 % 符号显示。默认情况下，小数点后显示两位数字。负值以前置负号开头显示。例如，数字 0.125 将被格式化为 12.5%，数字 -0.2345\
  \ 将被格式化为 -23.45%。 |\n\n### 注意\n[表 8−7] 中列出的格式说明符不区分大小写。例如，格式项目 `{0:N}` 与 `{0:n}`\
  \ 是相同的。\n\n# 指定最小字段宽度\n\n格式项目可以包含一个最小字段宽度，即显示该值时应使用的最小空格数。以下示例在宽度为 20 个空格的字段中显示浮点数：\n\
  \n```\ndouble number = 12345.6789;\nstring message = String.Format(\"The number\
  \ is:{0,20}\", number);\n```\n\n注意索引和宽度说明符之间用逗号分隔。格式项目 `{0,20}` 指定参数 0 应该出现在一个最小宽度为\
  \ 20 个空格的字段中。当此代码执行时，`String.Format` 方法返回的字符串将是：\n\n```\nThe number is:        12345.678900\n\
  ```\n\n字段宽度如图图 [8−7] 所示。\n\n# 图 8−7 数字占据了一个宽度为 20 个空格的字段\n\n![截图显示了代码返回的字符串，“String\
  \ dot Format。”它显示了一个宽度为 20 个空格的数字 12345.978600。](img/FG_08_007.png)\n\n在这个示例中，数字\
  \ 12345.678900 仅使用了 12 个空格，但它被插入了一个宽度为 20 个空格的字段中。在这种情况下，数字将在字段中右对齐。如果值太大无法放入指定的字段宽度，字段将自动扩大以容纳它。以下示例在宽度仅为\
  \ 1 个空格的字段中显示浮点数：\n\n```\ndouble number = 12345.6789;\nstring message = String.Format(\"\
  The number is:{0,1}\", number);\n```\n\n`number` 变量的值需要多一个空格；但字段宽度会被扩展以容纳整个数字。当此代码执行时，`String.Format`\
  \ 方法返回的字符串将是：\n\n```\nThe number is:12345.6789\n```\n\n如果你想让数字在其字段内左对齐，可以在字段说明符之前插入一个负号\
  \ `-`。这里有一个示例：\n\n```\ndouble number = 12345.6789;\nstring message = String.Format(\"\
  {0,-20}\", number);\n```\n\n当此代码执行时，`String.Format` 方法返回的字符串将是：\n\n```\n12345.6789\
  \          \n```\n\n你可以同时包含宽度说明符和格式说明符，如下所示：\n\n```\ndouble number = 12345.6789;\n\
  string message = String.Format(\"The number is:{0,20:C}\", number);\n```\n\n在这个示例中，格式项目\
  \ `{0,20:C}` 指定参数 0 应该出现在一个最小宽度为 20 个空格的字段中，并格式化为货币。当此代码执行时，`String.Format` 方法返回的字符串将是：\n\
  \n```\nThe number is: $12,345.68\n```\n\n# 指定精度\n\n每个格式说明符后面可以可选地跟一个整数，表示小数点后显示的数字位数。例如，格式\
  \ `N3` 在小数点后显示三位数字。[表 8−8] 基于北美区域设置，展示了多种数字示例。\n\n# 表 8−8 数字格式化示例（北美区域设置）\n\n| 数字\
  \ | 格式说明符 | 格式化结果 |\n| --- | --- | --- |\n| 12.3 | `N3` | 12.300 |\n| 12.348 | `N2`\
  \ | 12.35 |\n| 1234567.1 | `N` | 1,234,567.10 |\n| 123456.0 | `F2` | 123456.00 |\n\
  | 123456.0 | `E3` | 1.235e+ 005 |\n| .234 | `P` | 23.40% |\n| -1234567.8 | `C` |\
  \ ($1,234,567.80) |\n\n这里有一个示例：\n\n```\ndouble number = 12345.6789;\nstring message\
  \ = String.Format(\"The number is {0:N3}\", number);\n```\n\n在这个示例中，格式项目 `{0:N3}`\
  \ 指定参数 0 应该以带有三位小数的数字出现。当此代码执行时，`String.Format` 方法返回的字符串将是：\n\n```\nThe number is\
  \ 12,345.679\n```\n\n 四舍五入\n\n当你在格式字符串中指定的小数点后位数小于数值的精度时，就会发生四舍五入。假设我们对数字 1.235\
  \ 使用 `N2` 格式说明符。结果将是 1.24。如果最后一个显示数字之后的数字是 5 或更高，则远离零舍入。\n\n# 检查点\n\n1. 8.19 假设存在以下变量声明：\n\
