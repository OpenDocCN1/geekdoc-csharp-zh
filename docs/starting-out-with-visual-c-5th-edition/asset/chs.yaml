  \ C# 应用程序之前，重置编程环境是一个好主意。教程 1-1 将引导你完成这一过程。\n\n你创建的每个 C# 应用程序称为项目。当你准备好创建一个新应用程序时，就可以启动一个新项目。教程\
  \ 1-2 将引导完成启动新 C# 项目的步骤。\n\n\n\nVisual Studio 环境由许多你经常使用的窗口组成。图 1-36 显示了在 Visual\
  \ Studio 环境中出现的以下窗口的位置：`Designer`（设计器）窗口、`Solution Explorer`（解决方案管理器）窗口和 `Properties`（属性）窗口。以下是每个窗口用途的要概述：\n\
  \n## 图 1-36 设计器窗口、解决方案管理器窗口和属性窗口\n\n\n### 设计器窗口\n你使用 `Designer` 窗口创建应用程序的 GUI。`Designer`\
  \ 窗口显示应用程序的表单，并允许你通过放置所需的控件来视觉化设计其外观，这些控件将在应用程序执行时出现在表单上。\n\n### 解决方案管理器窗口\n解决方案是用于存放\
  \ Visual C# 项目的容器。（我们稍后会更详细讨论解决方案。）当你创建一个新的 C# 项目时，系统会自动创建一个新的解决方案来包含它。`Solution\
  \ Explorer` 窗口允许你在 Visual C# 项目中的文件之间进行导航。\n\n## 属性窗口\n\n记住，Visual Studio 是一个可自定义的环境。你可以移动各个窗口，因此它们在你的系统中的显示位置可能与\
  \ 图 1-36 中所示的位置不相同。\n\n## 显示解决方案管理器和属性窗口\n如果你看不到 `Solution Explorer` 或 `Properties`\
