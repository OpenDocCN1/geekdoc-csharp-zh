  \    * `InitialDirectory`\n    * `Title`\n    * `Filename`\n\n# 5.8 随机数\n\n### 概念\n\
  \n随机数用于各种应用程序。 .NET Framework 提供了 `Random` 类，你可以在 C# 中使用它来生成随机数。\n\n随机数对于许多不同的编程任务都有用。以下只是几个例子：\n\
  \n* 随机数常用于游戏。例如，让玩家掷骰子的游戏使用随机数来表示骰子的值。显示从洗过的牌组中抽取牌片的程序使用随机数来表示牌面的点数。\n* 随机数在模拟程序中非常有用。在某些模拟中，计算机必须随机决定人、动物、昆虫或其他生物将如何表现。可以构建公式，其中使用随机数来确定程序中发生的各种动作和事件。\n\
  * 随机数对于必须随机选择数据进行分析的统计程序非常有用。\n* 随机数常用于计算机安全，以加密敏感数据。\n\n.NET Framework 提供了一个名为\
  \ `Random` 的类，你可以在 C# 中使用它来生成随机数。首先，你通过如下语句创建 `Random` 类的对象：\n\n```\nRandom rand\
  \ = new Random();\n```\n\n让我们将该语句拆解为两个部分。语句的第一部分出现在 `=` 运算符的左侧，如下所示：\n\n![截图显示了将一个语句拆分为两个部分。](img/UNFG_05_002.png)5.8-2\
  \ 完整备用文本\n\n这声明了一个名为 `rand` 的变量，可以用它引用一个 `Random` 对象。语句的第二部分出现在 `=` 运算符的右侧，如下所示：\n\
  \n![语句的第二部分，出现在右侧。](img/UNFG_05_003.png)\n\n表达式 `new Random()` 会导致内存中创建一个 `Random`\
  \ 类的对象。`=` 运算符使 `rand` 变量引用该 `Random` 对象，如图 5-46 所示。在该语句执行后，我们可以使用 `rand` 变量来对 `Random`\
  \ 对象进行操作。\n\n# 图 5-46 `rand` 变量引用 `Random` 对象\n\n![图表显示了一个由正方形表示的“rand”变量引用一个“Random”对象。引用动作由一个向左的箭头表示，从“rand”指向“Random\
  \ 对象”。](img/FG_05_046.png)\n\n# `Next` 方法\n\n一旦你创建了 `Random` 对象，就可以调用它的 `Next` 方法来获取随机整数。以下代码显示了一个示例：\n\
  \n```\n // 声明一个 int 变量。\nint number;\n// 创建一个 Random 对象。\nRandom rand = new Random();\n\
  \n// 获取一个随机整数并将其赋值给 number。\nnumber = rand.Next();\n```\n\n此代码执行后，`number` 变量包含一个随机整数。如果你像示例所示不带任何参数调用\
  \ `Next` 方法，则返回的整数位于 0 到 2,147,483,647 之间。或者，你可以传递一个参数来指定生成数字范围的上限。在下面的语句中，赋值给 `number`\
  \ 的值位于 0 到 99 之间：\n\n```\nnumber = rand.Next(100);\n```\n\n你也可以为数字范围指定下限。在下面的语句中，赋值给\
  \ `number` 的值位于 100 到 199 之间：\n\n```\nnumber = rand.Next(100, 200);\n```\n\n以下语句显示了另一个示例。它为\
  \ `number` 分配一个位于 -50 到 +49 之间的随机整数：\n\n```\nnumber = rand.Next(-50, 50);\n```\n\
  \n# `NextDouble` 方法\n\n你可以调用 `Random` 对象的 `NextDouble` 方法来获取一个 0.0 到 1.0 之间的随机浮点数（不包括\
  \ 1.0）。以下代码显示了一个示例：\n\n```\n // 声明一个 Double 变量。\ndouble number;\n\n// 创建一个 Random\
  \ 对象。\nRandom rand = new Random();\n\n// 获取一个随机数并将其赋值给 number。\nnumber = rand.NextDouble();\n\
  ```\n\n此代码执行后，`number` 变量将包含一个 0.0 到（但不包括）1.0 范围内的随机浮点数。\n\n在教程 5-8 中，生成的数字不是随机的。它们是通过公式计算的。\n\
  \n# 随机种子\n\n生成的数字不是随机的。它们是通过公式计算的。如果你在每次创建 `Random` 对象时使用相同的种子，它将产生相同的序列。然而，如果你使用系统时间作为种子，每次运行程序时数字都是不同的。你可以在创建\
  \ `Random` 对象时指定自己的种子：\n\n```\nRandom rand = new Random(123);\n```\n\n如果你使用相同的种子，将得到相同的序列。这对于调试和测试代码很有。\n\
