  \n## 8. 身体质量指数程序增强\n\n在第 3 章的编程问题 6 中，你被要求创建一个计算个人身体质量指数（BMI）的应用程序。回想那次练习，BMI 通常用于判断一个人的体重相对于身高来说是否超重或过轻。一个人的\
  \ BMI 使用以下公式计算：\n\nBMI = 重量 × 703 ÷ 身高²\n\n在公式中，重量以磅为单位，身高以英寸为单位。增强程序，使其显示一条消息，指示该人的体重是理想、偏轻还是超重。如果一个人的\
  \ BMI 在 18.5 到 25 之间，则认为其体重理想。如果 BMI 小于 18.5，则该人被认为体重减轻。如果 BMI 值大于 25，则该人被认为超重。\n\
