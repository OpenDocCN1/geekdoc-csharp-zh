  ### 概念\n\n数组允许你在内存中将一组相同数据类型的项存储在一起。处理数组中的大量项通常比处理存储在单独变量中的大量项要容易得多。\n\n在你目前为止编写的程序中，你已经使用变量在内存中存储数据。在内存中存储值的最简单方法是存储在变量中。变量在许多情况下运行良好，但它们也有局限性。例如，它们一次只能包含一个值。考虑以下变量声明：\n\
  \n```\nint number = 99;\n```\n\n考虑如果程序稍后出现以下语句，会发生什么：\n\n```\nnumber = 5;\n```\n\
  \n该语句将值 5 赋值给 `number`，替换了之前存储在那里的值 99。由于 `number` 是一个普通变量，它一次只能包含一个值。\n\n由于变量只持有单个值，因此在处理数据列表的程序中，它们可能会非常繁琐。例如，假设你被要求写一个存储\
  \ 50 名员工名称的程序。想象声明 50 个变量来保存所有这些名称：\n\n```\nstring employee1;\nstring employee2;\n\
  string employee3;\n```\n*以此类推 . . .* .*\n\n```\nstring employee50\n```\n\n然后，想象编写处理所有\
  \ 50 个名称的代码。例如，如果你想在 `ListBox` 中显示变量的内容，你会编写如下代码：\n\n```\nemployeeListBox.Items.Add(employee1);\
  \   // 显示员工 1\nemployeeListBox.Items.Add(employee2);   // 显示员工 2\nemployeeListBox.Items.Add(employee3);\
  \   // 显示员工 3\n```\n*以此类推 . . .* .*\n\n```\nemployeeListBox.Items.Add(employee50);\
  \  // 显示员工 50\n```\n\n如你所示，变量并不适用于存储和处理数据列表。每个变量都是一个独立的项，必须单独声明并逐一处理。\n\n幸运的是，你可以使用数组作为一组变量的替代方案。数组是一个对象，可以容一组所有相同数据类型的值。你可以拥有\
  \ `int` 值的数组、`double` 值的数组、`decimal` 值的数组或 `string` 值的数组，但你不能在数组中存储混合的数据类型。一旦你创建了数组，就可以编写简单高效的代码来处理存储在其中的值。\n\
  \n数组是引用类型对象。回想第 7.1 节中的内容，`Random` 类允许你的程序生成随机数。以下是如何以下两个步骤从 `Random` 类创建对象的示例：\n\
  \n1. 你声明一个引用变量。\n2. 你创建一个对象并将其与引用变量关联。\n\n在执行这些步骤后，你就可以使用引用变量来操作该对象。让我们来看一个你已经学过的示例：创建\
  \ `Random` 类的对象。\n\n```\nRandom rand = new Random();\n```\n\n让我们是来看此语句的不同组成部分：\n\
  \n*   语句的第一部分出现在 `=` 运算符的左侧，内容为 `Random rand`。这声明了一个名为 `rand` 的变量，该变量可以用于引用 `Random`\
  \ 类型的对象。\n*   语句的第二部分出现在 `=` 运算符的右侧，内容为 `new Random()`。`new` 运算符在内存中创建一个对象并返回该对象的引用。因此，表达式\
  \ `new Random()` 创建了一个来自 `Random` 类的对象，并返回该对象的引用。\n*   `=` 运算符将 `new` 运算符返回的引用赋值给\
  \ `rand` 变量。\n\n在该语句执行后，`rand` 变量将引用一个 `Random` 对象，如图 7-5 所示。随后，可以使用 `rand` 变量对该对象执行操作，例如生成随机数。\n\
  \n# 图 7-5 `rand` 变量引用一个 `Random` 对象\n\n![一张图说明了 rand 变量引用一个随机对象。一个标记为“rand”的小框通过一个向右的箭头连接到一个标记为“Random\
  \ object”的椭圆形框。](img/FG_07_005.png)\n\n# 检查点\n\n1. 7.1 C# 中的数据类型和底层的 .NET 框架属于哪两个类别？\n\
