  \n# 7.4 将数组作为参数传递给方法\n\n### 概念\n\n数组可以作为参数传递给方法。要传递数组，只需传递引用该数组的变量即可。\n\n有时你可能希望编写一个接受整个数组作为参数并对数组执行操作的方法。例如，以下代码显示了一个名为\
  \ `ShowArray` 的方法。该方法接受字符串数组作为参数，并在消息框中显示每个元素。\n\n```\n 1 private void ShowArray(string[]\
  \ strArray)\n2 {\n3     foreach (string str in strArray)\n4     {\n5         MessageBox.Show(str);\n\
  6     }\n7 }\n```\n\n注意第 1 行，该方法有一个名为 `strArray` 的参数，其类型为 `string[]`。当你调用此方法时，只管传递该变量即可。以下代码显示了一个示例：\n\
  \n```\n 1 // Create an array of strings.\n2 string[] people = { \"Bill\", \"Jill\"\
  , \"Phil\", \"Will\" };\n3 4 // Pass the array to the ShowArray method.\n5 ShowArray(people);\n\
  ```\n\n记住，数组总是通过引用传递的。当你传递数组作为参数时，传递的是数组的引用。这在图 7-15 中有所说明。如图所示，`people` 变量包含一个引用。当\
  \ `people` 变量传递给 `ShowArray` 方法时，数组的引用被传递给 `strArray` 参数。图 7-16 显示在执行 `ShowArray`\
  \ 方法时，`people` 变量和 `strArray` 参数引用内存中的同一个数组。\n\n# 图 7-15 作为参数传递的数组\n\n![插图显示作为参数传递数组。](img/FG_07_015.png)\n\
  \n# 图 7-16 `people` 和 `strArray` 变量引用同一个数组\n\n![插图显示 people 变量和 strArray 参数引用同一个数组。](img/FG_07_016.png)\n\
  \n由于数组通过引用传递，接收数组作为参数的方法可以访问实际数组（而不是数组的副本）。例如，在学生示例程序的 `Chap07` 文件夹中，你会找到一个名为 `Array\
