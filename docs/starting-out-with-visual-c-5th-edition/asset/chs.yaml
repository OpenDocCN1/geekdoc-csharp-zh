  \ GUI 的基本概念。\n\n启动一个新的 C# 项目时，Visual Studio 会自动创建一个表单并将其显示在 `Designer` 中。图 2-1 显示了一个示例。将空表单看作创建应用程序的画布。你可以在表单上添加控件、更改表单的大小并修改它的许多特性。应用程序运行时，表单将显示在屏幕上。\n\
