  \ `string` 来指代字符串。）写在括号内的字符串将显示在消息框中。在这个示例中，括号内编写的是字符串 `\"Thanks for clicking the\
  \ button!\"`。\n\n注意，代码中的字符串被双引号包围。然而，当消息显示时（如图 2-35 所示），双引号并不会出现。代码中需要双引号来指示字符串的开始和结束。\n\
  \n还要注意语句末尾有一个分号。这是 C# 语法要求的。正如句号标记句子的结束一样，分号在 C# 中标记一个编程语句的结束。\n\n### 注意\n\n在为 `Button`\
