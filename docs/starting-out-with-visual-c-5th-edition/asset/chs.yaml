  \ `OpenFileDialog` 控件让用户选择由为题 13 编写的应用程序创建的文件。此应用程序应该从文件中读取数字，在 `ListBox` 控件中显示数字，然后显示以下数据：\n\
  \n*   数字总和\n*   从文件中读取的随机数个数\n\n# 第 6 章使用方法实现代码模块化\n\n## 6.1 方法简介\n\n### 概念\n\n\
  方法可以将一个复杂的程序拆分为较小的、易于管理的部分。`void` 方法仅执行一组语句然后终止。返回值的方法则向调用它的语句返回一个值。\n\n从广义意义上说，方法是执行特定任务的语句集合。到目前，你已经通过以下两种方式体验了方法：\n\
  \n*   你创建了事件处理程序。事件处理器是一种响应事件的特殊类型方法。\n*   你执行了 .NET Framework 中的预定义方法，例如 `MessageBox.Show`\
  \ 和 `TryParse` 方法。\n\n在本章中，你将学习如何创建自己的方法，这些方法可以像执行 .NET Framework 方法一样执行。\n\n方法通常用于将问题拆分为较小的、易于管理的部分。与其编写一个包含解决问题所需所有语句的长方法，不如编写几个小方法，每个方法解决问题的特定部分。这些小方法可以按照所需的顺序执行以解决问题。这种方法有时被称为“分治法”，因为它将一个大问题分解为几个更容易解决的小问题。图\
  \ 6-1 和 6-2 通过比较两个程序来阐明这一思想：一个程序一个包含解决问题所需所有语句的长复杂事件处理程序，另一个将问题划分为更小的问题，每个问题由一个独立的方法处理。\n\
  \n### 图 6-1 使用一长串语句执行任务\n\n![截图显示了使用一长串语句执行任务。](img/FG_06_001.png)图 6-1 完整替代文本\n\
  \n### 图 6-2 使用方法分治问题\n\n![截图显示了使用不同的方法分治问题。](img/FG_06_002.png)图 6-2 完整替代文本\n\n\
  从通俗上说，将程序拆分成较小代码单元（如方法）的程序被称为模块化程序。模块化倾向于简化代码。如果某个特定任务在程序的多个处执行，则可以编写一次方法来执行该任务，并在需要任何时候执行。使用方法的这种优势被称为**代码重用**，因为你只需编写一次执行该任务的代码，然后在每次需要执行该任务时重用它。\n\
  \n### `void` 方法和返回值的方法\n\n在本章中，你将学习编写两种类型的方法：`void` 方法和返回值的方法。当你调用 `void` 方法时，它仅执行其包含的语句然后终止。当你调用返回值的方法时，它执行其包含的语句，然后将一个值返回给调用它的语句。`Parse`\
  \ 方法是返回值方法的良好示例。你将学习编写的第一类方法是 `void` 方法。\n\n## 6.2 `void` 方法\n\n### 概念\n\n`void`\
  \ 方法执行一个任务后终止。它不向调用它的语句返回值。要创建一个方法，你需要编写它的定义。方法定义包含两个部分：头部和正体。方法头部出现在方法的开头，列出了关于该方法的若干重要信息。方法正体是执行时执行的语句集合。\n\
  \n```csharp\nprivate void DisplayMessage()\n{\n    MessageBox.Show(\"这是消息。\");\n\
  }\n```\n\n[/content]\n\n```：\n\n### 方法头部\n\n使用之前所示的方法定义，图 6-3 指出了方法头部的不同部分。\n\n\
  ### 图 6-3 方法头部部分\n\n![图显示了方法头部的部分。](img/FG_06_003.png)图 6-3 完整替代文本\n\n让我们仔细观察图中标识的部分：\n\
  \n*   **访问修饰符**——`private` 关键字是一个访问修饰符。当方法声明为 `private` 时，只能由类内部调用。相反，声明为 `public`\
  \ 的方法可以在类外部调用。这很重要，因为某些应用程序有多个类，除非你希望方法对类外部可用，否则应将其声明为 `private`。\n*   **返回类型**——回顾我们之前对\
  \ `void` 和返回值方法的讨论。当关键字 `void` 现在这里时，意味着该方法是 `void` 方法，且不返回值。正如你在本章晚些时候看到的，返回值方法在这里列出一个数据类型。\n\
  *   **方法名**——你应该给每个方法起一个描述性的名称。通常，适用于变量名的规则也适用于方法名。示例中的方法命名为 `DisplayMessage`，因此我们可以很容易猜出该方法的作用：显示消息。在本书中，我们对方法使用\
  \ Pascal 命名法。Pascal 命名类似于 camelCase（我们一直以来对变量使用的约定），区别在于 Pascal 命名的第一个字母始终大写。C#\
  \ 程序员的一个标准约定是对方法使用 Pascal 命名，因为可以将方法名与变量和字段名区分开。\n*   **括号**——在头部，方法名后面总是跟着一组括号。正如你在本章晚些时候看到的，你有时会在括号内编写声明，但目前，括号是空的。\n\
  \n### 注意\n\n方法头部从不以分号结尾。\n\n\n\n\n\n当你编写一个方法定义时，Visual Studio 会自动对方法体中的语句进行缩进。缩进并不是强制的，但它让代码更易于阅读和调试。通过对方法体中的语句进行缩进，你可以在视觉上将它们与周围的代码隔离开来。这能让你一眼看出程序的哪个部分是该方法的一部分。\n\
  \n# 在类内部声明方法\n\n方法通常属于一个类，因此你必须将方法的定义写在它应该所属的类内部。在本章中，你将编写的所有方法都属于应用程序的 `Form1`\
  \ 类。当你编写方法定义时，要将其写在 `Form1` 类内部，如图 6-4 所示。\n\n## 图 6-4 在 `Form1` 类内部编写方法定义\n\n![截图显示了如何在\
  \ Form 1 类内部编写方法的定义。](img/FG_06_004.png)图 6-4 完整备用文本\n\n# 调用方法\n\n方法在被调用时会执行。当特定事件发生时，事件处理程序会被调用，但其他方法是通过方法调用语句执行的。当一个方法被调用时，程序会跳转到该方法并执行其体中的语句。以下是一个方法调用语句的示例，它了我们之前检查过的\
  \ `DisplayMessage` 方法：\n\n```\nDisplayMessage();\n```\n\n该语句仅仅是方法名后跟一组括号。因为它是一个完整的语句，所以以分号结束。\n\
  \n让我们来看一个使用 `DisplayMessage` 方法的完整程序。在本书的学生示例程序的 `Chap06` 文件夹中，有一个名为 `Simple Method`\
  \ 的项目。图 6-5 显示了设计器中的应用程序表单，而程序 6-1 显示了表单的代码。\n\n## 图 6-5 `Simple Method` 应用程序的表单\n\
