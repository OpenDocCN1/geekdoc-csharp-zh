  # 编程题\n\n1. 单词计数：创建一个应用程序，其方法接受字符串作为参数并返回其中包含的单词数。例如，如果参数为 `\"Four score and seven\
  \ years ago,\"`，该方法应返回数字 6。应用程序允许用户输入字符串，然后将字符串传递给方法。显示字符串中的单词数。\n2. 字母平均数：修改你为第\
  \ 1 题题编写的程序（单词计数），使其也能显示每个单词的字母平均数。\n3. 句子大写：创建一个应用程序，其方法接受字符串作为参数并返回一个每个句子首字母大写的字符串副本。例如，如果参数为\
  \ `\"hello. my name is Joe. what is your name?\"`，该方法应返回字符串 `\"Hello. My name is\
  \ Joe. What is your name?\"`。应用程序允许用户输入字符串并将其传递给方法。显示修改后的字符串。\n4. 元音和辅音\n\n\n\n\n\
  \n创建一个应用程序，其中一个方法接收 `string` 作为参数并返回该字符串包含的元音数量。该应用程序还应该有另一个方法接收 `string` 作为参数并返回该字符串包含的辅音数量。该应用程序应允许用户输入一个\
  \ `string`，并显示其中包含的元音数量和辅音数量。\n\n## 5. 出现频率最高的字符\n\n创建一个应用程序，允许用户输入一个字符串，并显示该字符串中出现频率最高的字符。\n\
  \n## 6. 单词分隔符\n\n创建一个应用程序，接收一个句子，句子中的所有单词连在一起，但每个单词的首字母都是大写。将该句子转换为单词由空格分隔且仅第一个单词首字母大写的字符串。例如，字符串\
  \ `\"StopAndSmellTheRoses.\"` 将转换为 `\"Stop and smell the roses.\"`。\n\n## 7. 猪语英语\
  \ (Pig Latin)\n\n创建一个应用程序，接收一个句子作为输入并将每个单词转换为“猪语英语”。要将单词转换为猪语英语，你需要移除第一个字母并将其放在单词末尾。然后在该单词末尾附加字符串\
  \ `\"ay\"`。这里是一个例子：\n\n英语：I SLEPT MOST OF THE NIGHT\n\n猪语英语：IAY LEPTSAY OSTMAY FOAY\
  \ HETAY IGHTNAY\n\n## 8. 字符串中数字之和\n\n创建一个应用程序，允许用户输入一个包含由逗号分隔的一系列数字的字符串。这是一个有效输入的示例：\n\
  \n```\n7,9,10,2,18,6\n```\n\n程序应该计算并显示所有数字之和。\n\n## 9. 字母电话号码翻译器\n\n许多公司使用如 `555-GET-FOOD`\
  \ 这样的电话号码，以便客户更容易记忆。在标准电话上，字母到数字的映射如下：\n\n*   A, B, and C = 2\n*   D, E, and F =\
  \ 3\n*   G, H, and I = 4\n*   J, K, and L = 5\n*   M, N, and O = 6\n*   P, Q, R,\
  \ and S = 7\n*   T, U, and V = 8\n*   W, X, Y, and Z = 9\n\n创建一个应用程序，允许用户输入一个格式为\
  \ `XXX-XXX-XXXX` 的 10 位电话号码。应用程序应显示该电话号码，并将原始翻译中的任何字母字符转换为对应的数字。例如，如果用户输入 `555-GET-FOOD`，应用程序将显示\
  \ `555-438-3663`。\n\n## 10. 摩斯密码转换器设计一个程序，要求用户输入一个字符串，然后将该字符串转换为摩斯密码。摩斯密码是一种代码，英语字母表中的每个字母、每个数字以及各种标点符号都由一系列点和横线表示。表\
  \ 8-9 显示了部分代码。\n\n### 表 8−9 摩斯密码\n\n| 字符 | 代码 | 字符 | 代码 | 字符 | 代码 | 字符 | 代码 |\n\
  | --- | --- | --- | --- | --- | --- | --- | --- |\n| 空格 | `space*` | `6` | `-....`\
  \ | `G` | `––.` | `Q` | `––.-` |\n| 逗号 | `––..––` | `7` | `––...` | `H` | `....`\
  \ | `R` | `.-.` |\n| 句号 | `.-.-.-` | `8` | `—––..` | `I` | `..` | `S` | `...` |\n\
  | 问号 | `..––..` | `9` | `—-––.` | `J` | `.––—` | `T` | `-` |\n| `0` | `—––––` |\
  \ `A` | `.-` | `K` | `-.-` | `U` | `..-` |\n| `1` | `.—––-` | `B` | `-...` | `L`\
  \ | `.-..` | `V` | `...-` |\n| `2` | `..––—` | `C` | `-.-.` | `M` | `–––` | `W`\
  \ | `.––` |\n| `3` | `...––` | `D` | `-..` | `N` | `-.` | `X` | `-..-` |\n| `4`\
  \ | `....-` | `E` | `.` | `O` | `—––` | `Y` | `-.––` |\n| `5` | `.....` | `F` |\
  \ `..-.` | `P` | `.––.` | `Z` | `––..` |\n\n# 第 9 章 结构、枚举类型和字典\n\n## 9.1 引言\n\n\
  现在你已经学习了使用 Visual C# 进行编程的基础知识，可以使用本章介绍的主题来执行更高级的操作。首先，我们讨论结构（structures），它们允许你将几个变量封装在一个项目项目中。之后，我们讨论枚举类型（enumerated\
  \ types），这是你可以创建的由指定值组成的数据类型。最后，我们讨论字典（dictionaries），用于键值对的数据结构。\n\n## 9.2 结构\n\n\
  ### 概念\n\nC# 允许你将变量分组到一个项目中。到目前，你创建的是将数据存储在独立变量中的应用程序。有时，项目之间存在关系。例如，汽车经销商系统可能会使用以下内容：\n\
  \n```\nstring make;\nint year;\ndouble mileage;\n```\n\n所有这些变量都是相关的，因为它们将持有同一辆汽车的数据。要创建一个结构，必须对其进行声明。在使用结构之前，这里是通用格式：\n\
  \n```\nstruct 结构名称\n{\n    字段声明\n}\n```\n\n结构声明的第一行以关键字 `struct` 开始，后面是结构名称。接下来是一组括号，括号包含字段声明。这是一个结构的示例：\n\
  \n```\nstruct Automobile\n{\n    public string make;\n    public int year;\n   \
  \ public double mileage;\n}\n```\n\n该结构的名称是 `Automobile`。在书中我们总是以大写字母开始结构名称。这不是强制要求的，但许多程序员遵循这种做法，因为它有助于区分结构名和变量名。\n\
  \n第 3、4、5 行声明了字段。第 3 行声明了名为 `make` 的 `string` 字段，第 4 行声明了 `int` 字段，第 5 行声明了 `double`\
  \ 字段。注意每个声明都以 `public` 开始。`public` 关键字是一个访问修饰符，指定该字段可以在结构外部直接访问。\n\n\n\n\n\n![截图显示了表单代码中应用程序命名空间内“Automobile”结构体的声明。](img/FG_09_001.png)图\
  \ 9-1 完整替代文本\n\n请记住，结构体声明不会在内存中创建任何内容。它只是告诉 C# 编译器该结构体是由什么组成的。在使用结构体存储数据之前，你必须在内存中创建该结构体的实例。（在编程术语中，`instance`\
  \ 实例和 `object` 对象是一个东西。当你创建一个结构体的实例时，你就是在创建一个对象。）\n\n在第 7 章所示，`sportsCar` 对象具有三个字段：`make`、`year`\
  \ 和 `mileage`。\n\n# 图 9-2 作为 Automobile 结构体实例的 sportsCar 对象\n\n![图像显示了带有三个 Automobile\
  \ 结构体字段的“sportsCar”对象。这三个字段是“make”、“Year”和“mileage”。](img/FG_09_002.png)\n\n你可以通过声明语句创建多个结构体的实例，如下所示：\n\
  \n```\n Automobile sportsCar, pickupTruck;\n```\n\n此语句创建了两个 `Automobile` 结构体的实例。这些对象名为\
  \ `sportsCar` 和 `pickupTruck`。如图 9-3 所示，每个对象都有自己的 `make`、`year` 和 `mileage` 字段。\n\
  \n# 图 9-3 Automobile 结构体的两个实例\n\n![一组两张图片显示了 Automobile 结构体的两个实例：“sportsCar object”和“pickupTruck\
  \ object”。每个对象都有三个字段：“make”、“Year”和“mileage”。](img/FG_09_003.png)\n\n# 使用 `new`\
  \ 运算符创建结构体实例\n\n当你像之前所示使用简单的声明语句创建结构体对象时，对象的字段是未初始化的，如果你在为它们赋值之前尝试使用其中任何一个字段，就会发生编译错误。作为替代方案，你可以使用\
  \ `new` 运算符来创建结构体的实例，如下所示：\n\n```\n Automobile sportsCar = new Automobile();\n```\n\
  \n这是创建结构体实例的推荐技术，因为 `new` 运算符不仅在内存中创建实例，还用默认值 0 初始化对象的字段。（如果结构体包含任何作为引用变量的字段，则它们将被初始化为特殊值\
  \ `null`。）这里有一个使用 `new` 运算符创建两个 `Automobile` 结构体实例的示例：\n\n```\n Automobile sportsCar\
  \ = new Automobile();\nAutomobile pickupTruck = new Automobile();\n```\n\n如果你在实例化结构体时已经知道想要在结构体字段中存储的值，可以使用\
  \ `object initializer syntax`（对象初始化语法）来初始化对象的字段。这是一个示例：\n\n```\n Automobile truck\
  \ = new Automobile {make = \"Dodge Ram\", year = 2014, \n                      \
  \             mileage = 85000.0};\n```\n\n此语句在内存中创建了一个 `Automobile` 结构体的实例。对象的名称是\
  \ `truck`。对象的字段将用以下值初始化：`make` 字段将初始化为字符串“Dodge Ram”，`year` 字段将初始化为值 2014，`mileage`\
  \ 字段将初始化为值 85000.0。\n\n# 访问结构体的字段\n\n一旦你创建了结构体的实例，就可以可以使用运算符（句号）访问它的字段。例如，假设一个应用程序包含之前所示的\
  \ `Automobile` 结构体声明，并且方法中出现了以下代码：\n\n```\n 1 Automobile sportsCar = new Automobile();\n\
  2 sportsCar.make = \"Ford Mustang\";\n3 sportsCar.year = 1965;\n4 sportsCar.mileage\
  \ = 67500.0;\n```\n\n第 1 行在内存中创建了一个 `Automobile` 结构体的实例。对象的名称是 `sportsCar`。第 2 行将\
  \ `\"Ford Mustang\"` 赋值给 `sportsCar.make`。第 3 行将 `1965` 赋值给 `sportsCar.year`。第 4\
  \ 行将 `67500.0` 赋值给 `sportsCar.mileage`。\n\n以下是如“1965 Ford Mustang with 67500.0.”：\n\
  \n```\nsportsCar.year + \" \" + sportsCar.make + \" with \" + sportsCar.mileage;\n\
  ```\n\n# 赋值结构体\n\n你可以使用赋值运算符 (`=`) 将一个结构体赋值给另一个。例如，假设 `car1` 和 `car2` 都是 `Automobile`\
  \ 结构体的实例。以下语句将 `car1` 赋值给 `car2`：\n\n```\ncar2 = car1;\n```\n\n执行此语句后，`car2` 的字段与\
  \ `car1` 相同。\n\n# 向方法传递结构体\n\n与其他类型一样，你可以将结构体作为参数传递给方法。以下代码显示了一个名为 `DisplayAuto`\
  \ 的方法，它接受 `Automobile` 结构体的实例作为参数：\n\n```\n1 void DisplayAuto(Automobile auto)\n\
  2 {\n3     MessageBox.Show(auto.year + \" \" + auto.make + \" with \" + auto.mileage\
  \ + \" miles.\");\n4 }\n```\n\n注意第 1 行方法有一个参数变量 `auto`，其数据类型为 `Automobile`。当我们调用此方法时，我们传递一个\
  \ `Automobile` 对象作为参数，如下代码所示：\n\n```\n1 // 创建一个 Automobile 实例。\n2 Automobile sportsCar\
  \ = new Automobile();\n3 \n4 // 为字段赋值。\n5 sportsCar.make = \"Chevy Corvette\";\n\
  6 sportsCar.year = 1970;\n7 sportsCar.mileage = 50000.0;\n8 \n9 // 显示字段。\n10 DisplayAuto(sportsCar);\n\
  ```\n\n在第 10 行，`sportsCar` 对象作为参数传递给 `DisplayAuto` 方法。在 `DisplayAuto` 方法内部，`auto`\
  \ 参数包含 `sportsCar` 对象的副本。\n\n结构体可以按值传递，也可以按引用传递。通常，结构体按值传递。参数变量包含参数的副本，对参数进行的任何更改都不会影响原始参数。然而，如果接收方法需要更改原始参数的内容可以在参数声明中使用\
  \ `ref` 或 `out` 关键字。以下代码显示了一个使用 `Automobile` 类型引用参数的方法。假设应用程序表单上有名为 `makeTextBox`、`yearTextBox`\
  \ 和 `mileageTextBox` 的 TextBox 控件。\n\n```\n1 void GetData(ref Automobile auto)\n\
  2 {\n3     try\n4     {\n5          // 从 TextBox 中获取数据。\n6          auto.make =\
  \ makeTextBox.Text;\n7          auto.year = int.Parse(yearTextBox.Text);\n8    \
  \      auto.mileage = double.Parse(mileageTextBox.Text);\n9     }\n10     catch\
  \ (Exception ex)\n11     {\n12           // 显示异常消息。\n13           MessageBox.Show(ex.Message);\n\
  14     }\n15 }\n```\n\n\n\n\n\n注意 `auto` 参数是用 `ref` 关键字声明的。第 6–8 行的语句从 `TextBox`\
  \ 控件获取数据，并将这些数据赋值给 `auto` 参数的字段。由于 `auto` 是一个 `ref` 参数，这些值实际上被赋值了作为方法参数传递的对象。\n\n\
  当我们调用此方法时，我们通过引用传递一个 `Automobile` 对象，如下所示：\n\n```\n 1 // 创建一个 Automobile 结构体的实例。\n\
  2 Automobile car = new Automobile();\n3 \n4 // 获取对象的数据。\n5 GetData(ref car);\n```\n\
  \n方法执行执行后，`car` 对象包含了输入到 `TextBox` 控件的数据。\n\n# 比较结构体对象\n\n你不能直接对结构体对象执行比较操作。例如，假设\
  \ `sportsCar` 和 `raceCar` 是 `Automobile` 结构体的实例。以下语句会导致错误：\n\n```\n if (sportsCar\
  \ == raceCar) // 错误！\n```\n\n为了比较两个结构体对象，你必须比较各个字段，如下代码所示：\n\n```\n if (sportsCar.make\
  \ == raceCar.make &&\n    sportsCar.year == raceCar.year &&\n    sportsCar.mileage\
  \ == raceCar.mileage)\n{\n    MessageBox.Show(\"两者相等。\");\n}\n```\n\n# 结构体对象数组\n\
  \n结构体对象可以存储在数组中。例如，假设之前显示的 `Automobile` 结构存在于应用程序中。以下代码创建一个包含五个 `Automobile` 对象的数组：\n\
  \n```\n const int SIZE = 5;\nAutomobile[] cars = new Automobile[SIZE];\n```\n\n\
  当你创建一个结构体数组时，数组的每个元素都是结构体实例，每个实例的字段都被初始化为 0。（如果任何字段是引用变量，它将被初始化为值 `null`。）\n\n结构体数组的每个元素都可以通过下标访问。例如，`cars[0]`\
  \ 是数组中的第一个对象，`cars[1]` 是第二个，依此类推。要访问任何元素的字段，只需在下标后放置点操作符和字段名即可。例如，以下表达式引用 `cars[2]`\
  \ 的 `mileage` 成员：\n\n```\n cars[2].mileage\n```\n\n以下 `for` 循环遍历 `cars` 数组，显示存储在每个元素中的数据：\n\
  \n```\n for (int index = 0; index < cars.Length; index++)\n{\n    MessageBox.Show(cars[index].year\
  \ + \" \" +\n        cars[index].make + \" with \" +\n        cars[index].mileage\
  \ + \" miles.\");\n}\n```\n\n你也可以使用 `foreach` 循环遍历结构体数组中的所有元素，如下代码所示：\n\n```\n foreach\
  \ (Automobile aCar in cars)\n{\n    MessageBox.Show(aCar.year + \" \" +\n      \
  \  aCar.make + \" with \" +\n        aCar.mileage + \" miles.\");\n}\n```\n\n# 在列表中存储结构体对象\n\
  \n在[第 7 章]中，我们讨论了 `List` 类，它是用于存储对象集合的容器。这是一个如何创建一个可以容 `Automobile` 对象的 `List` 的示例：\n\
  \n```\n List<Automobile> carList = new List<Automobile>();\n```\n\n该语句创建一个由 `carList`\
  \ 变量引用的 `List` 对象。注意 `Automobile` 一词写在尖括号 `<>` 中，紧跟在 `List` 单词之后。这指定了 `List` 只能容纳\
  \ `Automobile` 数据类型的对象。\n\n要向 `List` 添加结构体对象，你可以使用 `Add` 方法。以下代码显示了一个示例：\n\n```\n\
  \ 1 // 创建一个用于存放 Automobile 对象的 List。\n 2 List<Automobile> carList = new List<Automobile>();\n\
  \ 3 \n4 // 创建一个 Automobile 结构体的实例。\n5 Automobile sportsCar = new Automobile();\n\
  \ 6 \n7 // 给对象的字段赋值。\n8 sportsCar.make = \"Chevy Corvette\";\n9 sportsCar.year =\
  \ 1970;\n10 sportsCar.mileage = 50000.0;\n11 \n12 // 将对象添加到 List。\n13 carList.Add(sportsCar);\n\
  ```\n\n第 2 行语句创建一个名为 `carList` 的 `List`，它可以容纳 `Automobile` 对象。第 5 行创建了一个名为 `sportsCar`\
  \ 的 `Automobile` 结构体实例，第 8–10 行为对象的字段赋值。第 13 行将对象添加到 `List` 中。\n\n请记住，结构体实例是值类型对象，当你向\
  \ `List` 添加值类型对象时，`List` 将包含该对象的一个副本。例如，查看以下代码：\n\n```\n 1 // 创建一个用于存放 Automobile\
  \ 对象的 List。\n 2 List<Automobile> carList = new List<Automobile>();\n 3 \n4 // 创建一个\
  \ Automobile 结构体的实例。\n5 Automobile sportsCar = new Automobile();\n 6 \n7 // 给对象的字段赋值。\n\
  8 sportsCar.make = \"Chevy Corvette\";\n9 sportsCar.year = 1970;\n10 sportsCar.mileage\
  \ = 50000.0;\n11 \n12 // 将对象添加到 List。\n13 carList.Add(sportsCar);\n```\n\n# 程序 9-1:\
  \ 列表\n\n以下是一个演示 `List` 功能的完整程序。\n\n```csharp\npublic struct Automobile\n{\n    public\
  \ string make;\n    public int year;\n    public double mileage;\n}\n\npublic partial\
  \ class Form1 : Form\n{\n    private List<Automobile> carList = new List<Automobile>();\n\
  \n    public Form1()\n    {\n        InitializeComponent();\n    }\n\n    private\
  \ void addButton_Click(object sender, EventArgs e)\n    {\n        Automobile car\
  \ = new Automobile();\n        car.make = textBoxMake.Text;\n        car.year =\
  \ int.Parse(textBoxYear.Text);\n        car.mileage = double.Parse(textBoxMileage.Text);\n\
  \        carList.Add(car);\n    }\n\n    private void displayButton_Click(object\
  \ sender, EventArgs e)\n    {\n        carListBox.Items.Clear();\n        foreach\
  \ (Automobile car in carList)\n        {\n            carListBox.Items.Add($\"{car.make},\
  \ {car.year}, {car.mileage} miles\");\n        }\n    }\n\n    private void GetData(ref\
  \ Automobile car)\n    {\n        car.make = textBoxMake.Text;\n        car.year\
  \ = int.Parse(textBoxYear.Text);\n        car.mileage = double.Parse(textBoxMileage.Text);\n\
  \    }\n}\n```\n\n\n\n\n\n* **第 49–67 行：** 这些行中出现了 `addButton_Click` 事件处理器。以下是该事件处理程序代码的摘要：\n\
  \    * 第 52 行创建了 `car` 对象，它是 `Automobile` 结构体的实例。\n    * 第 55 行调用了 `GetData` 方法，并将\
  \ `car` 对象按引用作为参数传递。该语句执行后，`car` 对象的字段将包含用户在表单文本框（TextBox）中输入。\n    * 第 58 行将 `car`\
  \ 对象的副本添加到 `carList` 中。\n    * 第 61–63 行清空文本框的内容。\n    * 第 66 行将焦点赋给 `makeTextBox`\
  \ 控件。\n\n* **第 69–87 行：** 这些行中出现了 `displayButton_Click` 事件处理器。以下是该事件处理程序代码的摘要：\n\
