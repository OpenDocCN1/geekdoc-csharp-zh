  14. 第 14 章 语言集成查询 (LINQ) 821\n# 前言\n欢迎阅读《Visual C# 入门》第五版。本书旨在为入门编程课程设计，非常适合没有经验的学者。初学编程的学生将非常感谢书中提供的清晰、接地气的解释和详细的步骤指导。经验较丰富的学生在学习\
  \ .NET 框架、数据库、语言集成查询（LINQ）以及其他主题时，也会对其细节深度表示认可。正如“入门”（Starting Out）系列的所有书籍一样，本书的特点是写作风格清晰、友好且易于理解。此外，书中包含了丰富的程序。既有短小的示例，也有侧重于解决问题的复杂示例。每一章都提供了大量的实操教程，引导学生完成开发的每一步。除了详尽的分步说明外，教程还提供了应用程序的完整代码和截图。\n\
  \n# 本版新内容\n本版最大的变化出现在书的后半部分。部分章节进行了重新组织，并新增了两个章节。以下是重组情况的摘要：\n\n* 第 8 章被分为两个章节，并在两个章节中都添加了新材料。在本版中，第\
  \ 8 章名为`文本处理`，第 9 章名为`结构、枚举类型和字典`。\n* 新增了两个章节。在本版中，第 13 章名为`委托和 Lambda 表达式`，第 14\
  \ 章名为`语言集成查询 (LINQ)`。\n\n本版增加了许多新主题和改进：\n\n* `var` 关键字：本版引入了用于变量声明的 `var` 关键字。\n\
  * 处理日期和时间：第 9 章包含一个关于处理日期时间的新节。该节涵盖了 `DateTime` 和 `TimeSpan` 数据类型，以及 `DateTimePicker`\
  \ 控件。\n* 字典：第 9 章包含一个关于 `Dictionary` 集合的新节。学生将学习如何在字典中以键值对的形式存储和处理数据。\n* 更多地使用自动属性：在之前的版本中，属性声明几乎总是使用显式声明的字段来编写，即使这些属性仅用于设置和获取值。在可能的情况下，这些属性声明已重写为自动属性。\n\
  * 对象初始化器语法：第 8 章和第 10 章引入了对象初始化器语法，作为声明和初始化结构及类实例的另一种方式。\n\n\n\n-   静态成员：第 10 章新增静态字段、属性、方法和类的新章节。\n\
  -   密封类和方法：第 11 章关于使用 `sealed` 关键字防止类被继承以及防止方法被重写的新讨论。\n-   扩展方法：第 11 章涵盖了扩展方法，该方法允许你扩展无法继承的类以及原始数据类型。\n\
  -   接口：第 11 章现在包含一个关于编写和使用接口的章节。\n-   委托：第 13 章向学生介绍了委托。\n-   匿名方法：第 13 章还介绍了与委托密切结合的匿名方法。\n\
  -   Lambda 表达式：第 13 章通过向学生展示如何使用 lambda 表达式简洁地创建委托和匿名方法作为结束。\n-   语言集成查询 (LINQ)：第\
  \ 14 章引入了 LINQ，并展示了如何使用 LINQ to Objects 查询数组和 Lists 等简单数据结构，以及如何使用 LINQ to SQL 查询数据库。\n\
  \n\n当学生的应用程序具有某种图形元素（如图形用户界面 GUI）时，初学者学习编程的动力会更强。使用本书的学生将学习创建基于 GUI 的、事件驱动的 Visual\
  \ C# 应用程序。使用 Visual Studio 环境来创建丰富用户界面控件和图形图像的表单。\n\n# 尽早学习对象，后学习编写类\n\n本书在很早阶段解释了什么是对象，并向学生展示如何从\
  \ .NET Framework 提供的类创建对象。然后，向学生介绍了输入和输出的基础、控制结构、方法、数组和列表以及文件操作。接着，学生将学习编写自己的类，并探索继承和多态等主题。\n\
  \n# 章节简述\n\n\n本章首先通过给出一个非常具体且易于理解的解释，说明计算机是如何工作的、数据是如何存储和处理的，以及我们为什么要用高级语言编写程序。在本章中，学生学习了什么是对象，并通过研究组成程序\
  \ GUI 的对象来看了几个示例。本章讨论了编程开发周期中的步骤，并介绍了 Visual Studio 环境。\n\n\n在本章中，学生将学习创建带有标签、按钮和图片框的表单，并学习修改控件属性。学生将接触\
  \ C# 代码，并学习命名空间、类和方法的组织结构。学生将学习编写简单的事件驱动应用程序，以响应按钮点击或通过可点击图像提供交互。本章还讨论了代码注释的重要性。\n\
  \n## 第 3 章：数据处理\n\n本章引入了变量和数据类型。讨论了局部变量以及在表单类中声明为字段的变量。学生将学习创建从 `TextBox` 控件读取输入的应用程序、执行数学运算并产生格式化输出。学生将学习当用户向\
  \ `TextBox` 输入无效数据时可能发生的异常，并学习编写简单的异常处理代码来解决这些问题。引入了命名常量，作为表示不变的值以及创建自文档式、易于维护代码的方法。学生还学习了更多内容。本章以通过使用\
  \ Visual Studio 调试器单步执行来定位逻辑错误结束。\n\n\n在本章中，学生学习了关系运算符和布尔表达式，并展示了如何使用决策结构控制程序流。涵盖了\
  \ `if`、`if-else` 和 `if-else-if` 语句。还讨论了嵌套决策结构、逻辑运算符和 `switch` 语句。学生学习使用 `TryParse`\
  \ 族方法来验证输入。介绍了单选按钮、复选框和列表框作为在 GUI 中选择项目的方法。\n\n## 第 5 章：循环、文件与随机数\n\n\n## 第 6 章：通过方法模块化代码\n\
  \n在本章中，学生首先学习如何编写和调用 `void` 方法以及有返回值的方法。本章展示了使用方法模块化程序的优势，并讨论了自顶向下的设计方法。然后，学生学习向方法传递参数。讨论了值传递、引用传递和输出参数。本章以使用\
  \ Visual Studio `step-into`、`step-over` 和 `step-out` 命令调试方法结束。\n\n\n数组和列表在 C# 中是引用类型对象，因此本章首先讨论\
  \ C# 语言中值类型和引用类型对象的区别。然后，学生学习创建和使用一维和二维数组。学生学习将数组作为参数传递给方法、在数组和文件之间传输数据、处理部分填充数组以及创建交叉数组。提供了许多数组处理的示例，包括寻找数组和、平均值、最大值最小值示例。最后，学生学习创建\
  \ `List` 对象并在其中存储数据，以及使用 `ImageList` 控件（一种用于存储和检索图像的数据结构）。\n\n\n\n\n到此为止，学生已经广泛使用了\
  \ .NET Framework 类的实例对象。在本章中，学生将学习编写类，以创建自己的具有字段、方法和构造函数的自定义对象。学生将学习如何在类中实现各种类型的属性，包括自动属性和只读自动属性。书中还讨论了创建对象数组以及在\
  \ `List` 中存储对象。此外，书中还提供了关于如何在问题中寻找相关类及其职责的入门指南。本章将向学生展示如何在项目中创建多个表单类、实例化这些类并显示它们。书中提供了一个教程，让学生创建一个多表单应用程序，其中一个表单的代码可以访问另一个表单上的控件。本章通过讨论静态成员和静态类作为结束。\n\
  \n\n本章继续学习类的内容，重点是继承和多态。涵盖的主题包括基类、派生类、继承中构造函数的工作原理、方法重写和多态。还讨论了抽象类和抽象方法。本章讨论了扩展方法，并以接口章节作为收尾。\n\
  \n\n本章向学生介绍了基础数据库概念。学生首先学习表、行、列，以及如何在 Visual Studio 中创建 SQL Server 数据库。然后，学生学习如何将数据库连接到\
  \ Visual C# 应用程序，并在 `DataGridView` 控件、详细视图以及其他数据绑定控件中显示表。最后，学生学习如何编写 SQL `Select`\
  \ 语句来从表中检索数据。\n\n\nLambda 表达式在 C# 编程中已变得非常常见。在学生真正理解 Lambda 表达式之前，必须先理解委托和匿名方法。本章的目标是建立关于委托和匿名方法工作原理的知识基础，然后建立对\
  \ Lambda 表达式的理解。\n\n\n本章首先向学生介绍 LINQ，作为一种查询数组和 `Lists` 等常用数据结构中数据的工具（使用 LINQ to\
  \ Objects）。它讨论了查询语法和方法语法。还讨论了几个实用的 LINQ 扩展方法。本章以 LINQ to SQL 章节结束，并讨论了如何使用 LINQ\
  \ 查询数据库。\n\n\n本附录概述了 C# 中提供的原始数据类型。\n\n\n本附录展示了如何创建各种控件，如 `ToolTips`、组合框、滚动条、`TabControls`、`WebBrowser`\
  \ 控件、`ErrorProvider` 组件和菜单系统。\n\n# 附录 C：ASCII/Unicode 字符\n\n本附录列出了 ASCII（美国信息交换标准）字符集，这也是\
  \ Unicode 的拉丁子集。\n\n# 附录 D：检查点问题答案\n\n本附录提供了书中每章出现的检查点题目的答案。\n\n\n本附录展示了如何使用 Visual\
  \ Studio 安装程序下载并安装 LINQ to SQL。\n\n\n本书循序渐进地教授 Visual C#。每章涵盖一组主要的编程主题，介绍控件和 GUI\
  \ 元素，并随着学生阅读本书的过程不断构建知识。虽然章节可以按照现有顺序轻松教学，但具有一定的灵活性。图 P-1 展示了章节间的依赖关系。如图所示，第 1 章](#fileP70010160120000000000000000004BC.xhtml_P70010160120000000000000000004BC)–第\
  \ 7 章介绍了 Visual C# 编程的基础知识，应该按顺序涵盖。然后，你可以直接进入第 8 章、第 9 章、第 10 章或第 12 章。\n\n\n###\
  \ 概念说明 本书的每个主要章节都从一个概念说明开始。该说明简要总结了该章节的重点。\n\n### 教程 每个章节都有若干实践教程，引导学生开发应用程序。每个教程提供了详细的步骤说明以及完成表单的截图。\n\
  \n### 示例程序 每个章节都有大量的代码示例，旨在突出当前主题。\n\n### 注意事项 注意事项出现在书中各。它们对相关的有趣或难以理解的点进行了简要解释。\n\
  ### 提示 提示学生处理编程问题的最佳技巧。\n\n### 警告 警告学生可能导致程序故障或数据丢失的编程技术或做法。\n\n### 检查点 检查点分布在每章中。旨在学习新内容后快速测试学生的知识。检查点的答案可以在附录\
  \ D 中找到。\n\n\n### 编程题 每章提供一系列编程题，旨在巩固学生对所学主题的知识。\n\n### 视频教程 书中的每个教程都有相应的在线视频，可以在书籍配套网站访问。学生可以跟随作者完成视频中的每个教程。此外，每章末尾的一个编程题都有相应的视频教程，展示学生如何创建解决方案。\n\
