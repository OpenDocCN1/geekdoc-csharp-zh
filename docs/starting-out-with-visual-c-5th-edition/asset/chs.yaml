  \n* 每个班的平均成绩\n* 所有班的平均成绩\n* 所有班中的最高分及其所在的班级\n* 所有班中的最低分及其所在的班级\n\n## 10. 老虎机模拟\n\
  \n老虎机是一种赌博设备，用户向其投入资金然后拉动杠杆（或按下按钮）。老虎机随后显示一组随机图像。如果两个或多个图像匹配，用户将赢得吐出的金额。图 7-50 显示了表单运行时的示例。应用程序应该允许用户在\
  \ `TextBox` 中输入投入机器的金额。当用户点击 *Spin*（旋转）按钮时，应用程序应该显示三个随机选择的符号。（老虎机传统上显示水果符号。你将在示例程序的\
  \ `Images\\Fruit Symbols` 文件夹中找到一组水果符号。）\n\n如果随机显示的图像一个都不匹配，程序应该通知用户其赢得了 0 元。如果两个图像匹配，程序应该通知用户其赢得了投入金额的两倍。如果三个图像匹配，程序应该通知用户其赢得了投入金额的三倍。当用户点击\
  \ Exit 按钮退出应用程序时，程序应该显示投入老虎机的总金额和赢得的总金额。\n\n\n\n\n\n你到为止编写的许多程序都处理过字符串，但仅限于有限的方式。到目前为止，你对字符串执行的操作主要涉及输入和输出。例如，你从键盘和文件读取字符串作为输入，并将字符串作为输出到屏幕和文件中。\n\
  \n许多类型的程序不仅读取字符串作为输入并写入字符串作为输出，还能对字符串进行操作。例如，文字处理程序处理大量的文本，因此广泛地使用字符串。电子邮件程序和搜索引擎是其他对字符串执行操作的程序。C#\
  \ 和 .NET Framework 提供了多种工具和编程技术，你可以使用它们来检查和操作字符串。我们将在本章介绍其中许多内容。\n\n## 8.2 处理字符\n\
  \n### 概念\n\n某些编程任务要求你在细致的级别上处理字符串。C# 和 .NET Framework 提供了工具，允许你处理字符串中的单个字符和字符集。\n\
  \n有时，程序必须处理的数据以文本形式出现。文字处理器、文本消息程序、电子邮件应用程序、Web 浏览器和拼写检查器只是大量处理文本的程序示例。本书前面的章节演示了一些简单的文本处理技术，例如比较字符串和将字符串转换为其他数据类型。然而，有时你需要在更细致的级别上对字符串进行操作。某些操作要求访问或操作字符串中的单个字符。\n\
  \n例如，你可能用过要求你设置符合特定要求的密码的程序或网站。某些系统要求密码具有最小长度，并包含至少一个大写字母、至少一个小写字母和一个数字。这些要求是为了防止普通单词被用作密码，从而提高密码的安全性。当创建新密码时，系统必须检查密码的每个字符，以确定其是否符合要求。在下一节中，你将看到一个执行此操作的算法示例。不过，我们先讨论\
  \ `char` 数据类型以及检索字符串中单个字符的过程。\n\n### `char` 数据类型\n\n到本书为止，我们使用 `string` 数据类型来存储文本。C#\
  \ 也提供了 `char` 数据类型，用于存储单个字符。`char` 类型的变量一次只能包含一个字符。以下是你如何声明 `char` 变量的示例：\n\n```\n\
  char letter;\n```\n\n此语句声明了一个名为 `letter` 的 `char` 变量，它可以存储一个字符。在 C# 中，字符字面量用单引号括起来。以下显示我们如何将字符赋值给\
  \ `letter` 变量的示例：\n\n```\nletter = 'g';\n```\n\n此语句将字符 `'g'` 赋值给 `letter` 变量。因为\
  \ `char` 变量只能包含一个字符，所以它们与字符串不兼容。例如，你不能将字符串赋值给 `char` 变量，即使字符串只包含一个字符。例如，以下语句将无法编译，因为它尝试将字符串字面量赋值给\
  \ `char` 变量：\n\n```\nletter = \"g\";  // ERROR! Cannot assign a string to a char\n\
  ```\n\n不要混淆用单引号括起来的字符字面量与用双引号括起来的字符串字面量是非常重要的。\n\n当你需要将 `char` 变量转换为字符串时，可以调用它的\
  \ `ToString` 方法。例如，以下语句在消息框中显示 `letter` 变量的值：\n\n```\nMessageBox.Show(letter.ToString());\n\
  ```\n\n以下语句显示了另一个示例。假设 `letter` 是 `char` 变量，`outputLabel` 是 Label 控件的名字：\n\n```\n\
  outputLabel.Text = letter.ToString();\n```\n\n### 检索字符串中的单个字符\n\nC# 允许你使用下标符号访问字符串中的单个字符。这使得像处理字符数组一样处理字符串成为可能。你使用下标\
  \ 0 访问第一个字符，使用下标 1 访问第二个字符，依此类推。最后一个字符的下标比字符串长度少 1。以下代码显示了一个示例：\n\n```\n1 // Declare\
  \ a string and a char.\n2 string name = \"Jacob\";\n3 char letter;\n4\n5 // Get\
  \ the first character (at position 0).\n6 letter = name[0];\n7\n8 // Display the\
  \ character.\n9 MessageBox.Show(letter.ToString());\n```\n\n在此代码中，第 2 行声明了一个名为 `name`\
  \ 的 `string` 变量，初始化为字符串 `\"Jacob\"`。第 3 行声明了一个名为 `letter` 的 `char` 变量。第 6 行获取 `name`\
  \ 中位置 0 的字符（字符串中的第一个字符）并将其赋值给变量 `letter`。第 9 行在消息框中显示 `letter` 变量的值。执行此代码代码将出现显示字符\
  \ J 的消息框。\n\n### 注意\n\n与数组一样，如果尝试对字符串使用无效下标，就会发生异常。字符串下标至少为 0，且必须小于字符串的长度。\n\n以下代码示例显示了如何使用循环遍历字符串中的字符。注意在\
  \ `for` 循环中，`index` 变量的初始值为 0，并在每次迭代后递增，只要 `index` 小于 `name.Length`，循环就会继续。执行此代码，将出现一系列显示字符\
  \ J, a, c, o, b 的消息框。\n\n```\n1 // Declare a string and a char.\n2 string name =\
  \ \"Jacob\";\n3 char letter;\n4\n5 // Display the characters in the string.\n6 for\
  \ (int index = 0; index < name.Length; index++)\n7 {\n8     letter = name[index];\n\
  9     MessageBox.Show(letter.ToString());\n10 }\n```\n\n记住下标对字符串字符提供了只读访问。你不能使用下标更改字符的值。例如，以下代码将无法编译，因为第二条语句尝试更改字符的值：\n\
  \n```\nstring name = \"Jill\";\nname[0] = 'B';\n```\n\n你还可以使用 `foreach` 循环来检索字符串中的单个字符。以下代码显示了一个示例。执行此代码，将出现一系列显示字符\
  \ J, a, c, o, b 的消息框。\n\n```\n1 // Declare a string and a char.\n2 string name =\
  \ \"Jacob\";\n3 char letter;\n4\n5 // Display the characters in the string.\n6 foreach\
  \ (char letter in name)\n7 {\n8     MessageBox.Show(letter.ToString());\n9 }\n```\n\
  \n### 字符测试和转换方法\n\n`char` 数据类型提供了几种测试字符值的方法。表 8-1 列出了其中一些方法。注意，表中所列的每个方法都返回布尔值 `true`\
  \ 或 `false`。\n\n#### 表 8-1 些字符测试方法\n\n| 方法 | 描述 |\n| --- | --- |\n| ```csharp\\\
  char.IsDigit(ch)\\n``` | 参数 `ch` 是一个字符。如果 `ch` 是数字（0 到 9），则该方法返回 `true`，否则返回 `false`。\n\
  \ ```csharp\n Example: \n string str = \"12345\";\n if (char.IsDigit(str[0]))\n\
  \ {\n   MessageBox.Show(\"Character 0 is \" + \"a digit.\");\n }\n ``` |\n| ```csharp\\\
  char.IsDigit(str, index)\\n``` | 参数 `str` 是一个字符串，`index` 是字符在 `str` 中的的位置。如果指定的字符是数字（0\
  \ 到 9），则该方法返回 `true`，否则返回 `false`。 |\n\n\n\n\n\n```\nExample: \nstring str = \"\
  12345\";\nif (char.IsDigit(str, 0))\n{\n   MessageBox.Show(\"Character 0 is \" +\
  \ \"a digit.\");\n}\n```\n\n```\nchar.IsLetter(ch)\n```\n\n | 参数 `ch` 是一个字符。如果 `ch`\
  \ 是字母，该方法返回 `true`，否则返回 `false`。 |\n\n```\nExample: \nstring str = \"Hello World\"\
  ;\nif (char.IsLetter(str[0]))\n{\n   MessageBox.Show(\"Character 0 is \" + \"a letter.\"\
  );\n}\n```\n\n```\nchar.IsLetter(str, index)\n```\n\n | 参数 `str` 是一个字符串，`index`\
  \ 是字符在 `str` 中的位置。如果指定的字符是字母，该方法返回 `true`，否则返回 `false`。 |\n\n```\nExample: \nstring\
  \ str = \"Hello World\";\nif (char.IsLetter(str, 0))\n{\n   MessageBox.Show(\"Character\
  \ 0 is \" + \"a letter.\");\n}\n```\n\n```\nchar.IsLetterOrDigit(ch)\n```\n\n |\
  \ 参数 `ch` 是一个字符。如果 `ch` 是字母或数字，该方法返回 `true`。否则，该方法返回 `false`。 |\n\n```\nExample:\
  \ \nstring str = \"Hello World\";\nif (char.IsLetterOrDigit(str[0]))\n{\n   MessageBox.Show(\"\
  Character 0 is \" + \"either a letter \" + \"or a digit.\");\n}\n```\n\n```\nchar.IsLetterOrDigit\n\
  (str, index)\n```\n\n | 参数 `str` 是一个字符串，`index` 是字符在 `str` 中的位置。如果指定的字符是字母或数字，该方法返回\
  \ `true`。否则，该方法返回 `false`。 |\n\n```\nExample:\nstring str = \"12345\";\nif (char.IsLetterOrDigit(str,\
  \ 0))\n{\n   MessageBox.Show(\"Character 0 is \" + \"either a letter \" + \"or a\
  \ digit.\");\n}\n```\n\n```\nchar.IsLower(ch)\n```\n\n | 参数 `ch` 是一个字符。如果 `ch` 是小写字母，该方法返回\
  \ `true`，否则返回 `false`。 |\n\n```\nExample: \nstring str = \"hello world\";\nif (char.IsLower(str[0]))\n\
  {\n   MessageBox.Show(\"Character 0 is \" + \"lowercase.\");\n}\n```\n\n```\nchar.IsLower(str,\
  \ index)\n```\n\n | 参数 `str` 是一个字符串，`index` 是字符在 `str` 中的位置。如果指定的字符是小写字母，该方法返回 `true`，否则返回\
  \ `false`。 |\n\n```\nExample: \nstring str = \"hello world\";\nif (char.IsLower(str,\
  \ 0))\n{\n   MessageBox.Show(\"Character 0 is \" + \"lowercase.\");\n}\n```\n\n\
  ```\nchar.IsPunctuation(ch)\n```\n\n | 参数 `ch` 是一个字符。如果 `ch` 被归类为标点符号，该方法返回 `true`，否则返回\
