  \n这里有一些提示：\n\n* 使用我们在第 8 章 中讨论过的 `Split` 方法，将文件的每一行分分为五项数据。\n* 使用本章稍后讨论的 `Find`\
  \ 和 `FindAll` 方法来搜索 `List`。\n\n# 第 14 章 语言集成查询 (LINQ)\n\n# 14.1 LINQ 简介\n\n### 概念\n\
  \nLINQ（Language-Integrated Query）是一种内置在 C# 中的查询语言，可用于从许多数据源查询数据。\n\n在第 12 章 中，你学习了\
  \ SQL（结构化查询语言），它允许你查询数据库中的数据。.Net Framework 还提供了另一种名为 `LINQ` 的查询语言，全称为“语言集成查询”。虽然\
  \ SQL 允许你查询数据库中的数据，但 .NET Framework 提供了许多 LINQ 工具，允许你查询许多类型的数据。在本节中，我们将使用一种名为 `LINQ\
  \ to Objects` 的工具，它允许你查询存储在集合（如数组和列表）中的数据。\n\n使用 LINQ 查询的语句遵循以下通用格式：\n\n```\nvar\
  \ resultVariable = LINQquery;\n```\n\n在通用格式中，`resultVariable` 是持有结果的变量，`LINQquery`\
  \ 是查询语句。C# 编译器会自动确定 `resultVariable` 的类型。\n\n假设我们有如下整数数组：\n\n```\nint[] numbers\
  \ = { 4, 104, 2, 102, 1, 101, 3, 103 };\n```\n\n如果我们想查询此数组以获取大于 100 的项，可以写道：\n\n\
  ```\nvar results = from item in numbers\n              where item > 100\n      \
  \        select item;\n```\n\n语句声明了 `results`，它将存储 LINQ 查询的结果。`where` 子句指定了搜索标准（`item\
  \ > 100`），而 `select` 子句导致检索 `item` 值。用通话说，这个表达式的意思是“选择大于 100 的项”。\n\n语句执行后，我们可以使用循环检查\
  \ `results` 变量。例如，下面的代码段显示了我们如何将值添加到名为 `ListBox` 的列表框中。代码执行后，列表框将包含值 104、102、101\
  \ 和 103。\n\n```\nint[] numbers = { 4, 104, 2, 102, 1, 101, 3, 103 };\nvar results\
  \ = from item in numbers\n              where item > 100\n              select item;\n\
  foreach (var value in results)\n{\n    ListBox.Items.Add(value);\n}\n```\n\n你也可以使用\
  \ LINQ 查询 `List` 中的数据，如下代码所示：\n\n```\nList<int> numbers = new List<int>() { 4, 104,\
  \ 2, 102, 1, 101, 3, 103 };\nvar results = from item in numbers\n              where\
  \ item > 100\n              select item;\nforeach (var value in results)\n{\n  \
  \  ListBox.Items.Add(value);\n}\n```\n\n# `IEnumerable<`*T`*>` 接口\n\n你使用 LINQ 查询从数据源中搜索并检索特定的数据。数据源可以是内存集合（如数组或\
  \ `List`），也可以是更大型的数据库（如数据库）。当你执行 LINQ 查询时，查询将它的结果作为 `IEnumerable<`*T`*>` 集合返回，其中\
  \ *`T`* 是数据源中单个元素的数据类型。\n\n\n\n\n例如，如果查询的数据源是一个 `int` 数组，则查询将返回 `IEnumerable<int>`\
  \ 集合。或者，如果查询的数据源是一个 `string`  `List`，则查询将返回 `IEnumerable<string>` 集合。这在图 14-1 中已所示。\n\
  \n## 图 14-1 LINQ 查询将结果作为 `IEnumerable<T>` 集合返回\n\n![插图显示了 LINQ 查询的数据源在一个“整数”数组中，以及\
  \ LINQ 查询的数据源在一个“字符串列表”中并返回了集合，](img/FG_14_001.png)图 14-1 完整替代文本\n\n`IEnumerable<T>`\
  \ 是定义在 .NET Framework 中的一个接口。`IEnumerable<T>` 集合简单来说就像 `List` 一样可以进行迭代的集合。因此，使用\
  \ LINQ 查询数据通常是一个在数据源上执行查询、获取结果作为集合、然后遍历该集合以对其元素执行某些操作的过程。\n\n到此时，你可能已经意识到，在之前的两个\
  \ LINQ 示例中，你没有在任何代码中看到 `IEnumerable` 这个词。这里是之前显示的查询 `int` 数组的代码：\n\n```\n int[]\
  \ numbers = { 4, 104, 2, 102, 1, 101, 3, 103 };\nvar results = from item in numbers\n\
  \              where item > 100\n              select item;\n```\n\n在该语句中，`results`\
  \ 变量是一个 `IEnumerable<int>` 集合，但我们没有将其声明为 `IEnumerable<int>`，而是使用了 `var` 关键字。记住 `var`\
  \ 关键字会导致编译器根据其初始化值确定变量的数据类型。因此，在这个示例中，`results` 变量的数据类型将是 LINQ 表达式返回的值的数据类型，即 `IEnumerable<int>`。这与我们编写以下代码是一样的：\n\
  \n```\nIEnumerable<int> results = from item in numbers\n                       \
  \    where item > 100\n                           select item;\n```\n\n如你所示，`var`\
  \ 关键字简化了代码。出于这个原因，大多数程序员倾向于使用它。\n\n##更多关于 `select` 操作符\n\nLINQ 查询以 `from` 子句开始，通常以\
  \ `select` 子句结束。`from` 子句遍历数据元素集合，并将每个元素赋值给迭代变量。`select` 子句决定查询结果中包含哪些内容，并将结果作为\
  \ `IEnumerable<T>` 集合返回。`select` 子句还决定了数据类型 `T` 是什么。例如，查看以下代码段：\n\n```\n 1  int[]\
  \ numbers = { 4, 104, 2, 102, 1, 101, 3, 103 };\n2\n3  var results = from item in\
  \ numbers\n4                select item;\n5\n6  foreach (var value in results)\n\
  7  {\n8     MessageBox.Show(value);\n9  }\n```\n\n第 3 行和第 4 行出现的 LINQ 查询非常简单。由于没有\
  \ `where` 子句来过滤数据，它检索了 `numbers` 数组中的每个项目。语句中使用的各种变量的数据类型如下：\n\n*   查询正在搜索一个 `int`\
  \ 数组，因此在第 3 行 `item` 变量的数据类型将是 `int`。\n*   在第 4 行中，`select` 语句选择一个 `int`（`item`\
  \ 变量），因此查询将返回 `IEnumerable<int>` 集合。这意味着在第 3 行 `results` 变量的数据类型将是 `IEnumerable<int>`。\n\
  *   在第 6 行，`value` 变量的数据类型将是 `int`。\n\n这里是一个适用于 `string` 数组的示例：\n\n```\n 1  string[]\
  \ names = { \"Joe\", \"Jill\", \"John\", \"Jennifer\" };\n 2\n 3  var results =\
  \ from item in names\n 4                where  String.Compare(item, \"Joe\") < 0\n\
  \ 5                select item;\n 6\n 7  foreach (var value in results)\n 8  {\n\
  \ 9     MessageBox.Show(value);\n10  }\n```\n\n在这个示例中，LINQ 查询返回 `names` 数组中所有小于\
  \ `\"Joe\"` 的字符串。查询将返回一个 `IEnumerable<string>` 集合。因此，语句中的数据类型如下：\n\n*   查询正在搜索一个\
  \ `string` 数组，因此在第 3 行 `item` 变量的数据类型将是 `string`。\n*   在第 5 行中，`select` 语句选择一个 `string`（`item`\
  \ 变量），因此查询将返回 `IEnumerable<string>` 集合。这意味着在第 3 行 `results` 变量的数据类型将是 `IEnumerable<string>`。\n\
  *   在第 7 行，`value` 变量的数据类型将是 `int`。\n\n\n\n你可以在 LINQ 表达式中使用多个 `where` 子句来指定多个搜索标准。下面的代码段显示了一个示例：\n\
  \n```sharp\n 1  RetailItem[] retailItems =\n 2  {\n 3      new RetailItem(\"Headphones\"\
  , 199.99m),\n 4      new RetailItem(\"Color Printer\", 99.99m),\n 5      new RetailItem(\"\
  Security Camera\", 129.99m),\n 6      new RetailItem(\"Bluetooth Speaker\", 79.99m)\n\
  \ 7  };\n 8\n 9  var results = from item in retailItems\n10                where\
  \ item.Price > 90m\n11                where item.Price < 120m\n12              \
  \  select item.Description;\n13\n14  foreach (var value in results)\n15  {\n16 \
  \     MessageBox.Show(value);\n17  }\n```\n\n注意 LINQ 查询在第 10 行和第 11 行有两个 `where`\
  \ 子句。第一个 `where` 子句使查询检索价格大于 90 的项目。然后，在这些结果集中，第二个 `where` 子句使查询检索价格小于 120 的项目。如果我们这样写查询，将得到相同的结果：\n\
  \n```sharp\n var results = from item in retailItems\n              where item.Price\
  \ > 90m && item.Price < 120m\n              select item.Description;\n```\n\n# `orderby`\
  \ 子句\n\n如果你想对 LINQ 查询的结果进行排序，可以使用 `orderby` 子句。下面的代码段显示了一个示例。\n\n```sharp\n 1  int[]\
  \ numbers = { 4, 104, 2, 102, 1, 101, 3, 103 };\n 2 \n 3  var results = from item\
  \ in numbers\n 4                orderby item\n 5                select item;\n 6\n\
  \ 7  foreach (var value in results)\n 8  {\n 9      MessageBox.Show(value);\n10\
  \  }\n```\n\n第 4 行中的 `orderby item` 子句使查询结果按升序（从低到高）排序。第 7 到 10 行的循环将在消息框中显示值 1,\
  \ 2, 3, 4, 101, 102, 103 和 104。\n\n这里是一个使用之前过的 `RetailItem` 类的示例：\n\n```sharp\n\
  \ 1  RetailItem[] retailItems =\n 2  {\n 3      new RetailItem(\"Headphones\", 199.99m),\n\
  \ 4      new RetailItem(\"Color Printer\", 99.99m),\n 5      new RetailItem(\"Security\
  \ Camera\", 129.99m),\n 6      new RetailItem(\"Bluetooth Speaker\", 79.99m)\n 7\
  \  };\n 8\n 9  var results = from item in retailItems\n10                where item.Price\
  \ < 150m\n11                orderby item.Price\n12                select item.Description;\n\
  13\n14  foreach (var value in results)\n15  {\n16      MessageBox.Show(value);\n\
  17  }\n```\n\n第 9 到 12 行的查询搜索 `retailItems` 数组并检索所有价格小于 150 的 `RetailItem` 对象描述。第\
  \ 11 行的 `orderby` 子句根据 `Price` 属性对结果进行排序，因此描述将按价格从低到高的顺序显示。\n\n如果你想按降序（从高到低）排序查询结果，请使用\
  \ `descending` 关键字，如第 3 行所示：\n\n```sharp\n 1  var results = from item in retailItems\n\
  2                where item.Price < 150m\n3                orderby item.Price descending\n\
  4                select item.Description;\n```\n\n# 检查点\n\n1.1 假设 `values` 是一个 `int`\
  \ 数组。以下 LINQ 查询的作用是什么？\n```sharp\nvar results = from item in values\n          \
  \    where item > 0\n              select item;\n```\n\n1.2 再次查看检查点 1.1 中的查询。`results`\
  \ 变量是什么数据类型？\n\n1.3 在 LINQ 查询中，`from` 子句的作用是什么？\n\n1.4 在 LINQ 查询中，`select` 子句的作用是什么？\n\
  \n1.5 你如何按升序对 LINQ 查询的结果进行排序？你如何按降序对结果进行排序？\n\n# LINQ 方法语法\n\n### 概念\n\n你可以使用查询语法或方法语法来编写\
  \ LINQ 查询。如果你使用查询语法，C# 编译器会将你的查询翻译为在 .NET Framework 中定义的方法调用。如果你使用方法语法，你是在直接调用这些扩展方法。\n\
  \n编写 LINQ 查询有两种方法：你可以使用查询语法或方法语法。之前所有的示例都是用查询语法编写的，它类似于 SQL 查询。用方法语法编写的查询采用方法调用的形式。.NET\
  \ 框架定义了一组适用于所有集合的 LINQ 扩展方法。这些扩展方法对应于 LINQ 查询中出现的各种子句。例如，有一个 `Where` 方法，一个 `OrderBy`\
  \ 方法以及一个 `Select` 方法。当你编译包含用查询语法编写的查询的 C# 程序时，它将其转换为方法调用。\n\n# `Where` 方法\n\n你可以使用方法语法而不是查询语法。\n\
  \n`Where` 方法的通用格式如下：\n\n```sharp\ncollection.Where(FuncDelegate)\n```\n\n在通用格式中，`collection`\
  \ 是你要搜索的集合，`FuncDelegate` 是一个 `Func` 委托（或 Lambda 表达式），它有一个参数并返回一个布尔值。`collection`\
  \ 中的每个元素将作为参数传递给 `Func` 委托。如果 `Func` 委托返回 `true`，则该元素将被包含；如果返回 `false`，则该元素将不被包含。`Where`\
  \ 方法返回 `IEnumerable<T>` 集合。如果你对 `int` 数组执行 `Where` 方法，它将返回 `IEnumerable<int>` 集合。\n\
  \n下面的代码段显示了一个简单的示例：\n\n```sharp\n1   int[] numbers = { 4, 104, 2, 102, 1, 101, 3,\
  \ 103 };\n2\n3   var results = numbers.Where(item => item > 100);\n4\n5   foreach\
  \ (var value in results)\n6   {\n7      MessageBox.Show(value.ToString());\n8  \
  \ }\n```\n\n在这个示例中，LINQ 查询出现在第 3 行。传递给查询的 Lambda 表达式有一个名为 `item` 的参数。如果 `item` 大于\
  \ 100，Lambda 表达式返回 `true`，否则返回 `false`。因此，`Where` 方法返回 `numbers` 数组中大于 100 的元素。\n\
  \n下面的代码段是一个使用本章之前过的 `RetailItem` 类的示例：\n\n```sharp\n 1  RetailItem[] retailItems\
  \ =\n 2  {\n 3      new RetailItem(\"Headphones\", 199.99m),\n 4      new RetailItem(\"\
  Color Printer\", 99.99m),\n 5      new RetailItem(\"Security Camera\", 129.99m),\n\
  \ 6      new RetailItem(\"Bluetooth Speaker\", 79.99m)\n 7  };\n 8\n 9   var results\
  \ = retailItems.Where(item => item.Price < 100m);\n10 \n11   foreach (var value\
  \ in results)\n12   {\n13      MessageBox.Show(value.Price.ToString());\n14   }\n\
  ```\n\n在这个示例中，第 9 行的 LINQ 查询返回 `retailItems` 数组中所有价格小于 100 的元素。\n\n# `OrderBy` 和\
  \ `OrderByDescending` 方法\n\n如果你想按升序对集合的元素进行排序，可以使用 `OrderBy` 方法。这是 `OrderBy` 方法的通用格式：\n\
  \n```sharp\ncollection.OrderBy(FuncDelegate)\n```\n\n在通用格式中，`collection` 是你要搜索的集合，`FuncDelegate`\
  \ 是一个 `Func` 委托（或 Lambda 表达式），它有一个参数并返回一个值。`collection` 中的每个元素将作为参数传递给 `Func` 委托。该委托返回应该排序的元素字段。`OrderBy`\
  \ 方法将查询结果作为 `IEnumerable<T>` 集合。\n\n下面的代码显示了对 `RetailItem` 对象数组进行排序的示例。\n\n\n\n\n\
  ```csharp\n RetailItem[] retailItems = {\n     new RetailItem(\"Headphones\", 199.99m),\n\
  \     new RetailItem(\"Color Printer\", 99.99m),\n     new RetailItem(\"Security\
  \ Camera\", 129.99m),\n     new RetailItem(\"Bluetooth Speaker\", 79.99m)\n };\n\
  \n  var results = retailItems.OrderBy(item => item.Price);\n\n  foreach (var value\
  \ in results)\n  {\n     MessageBox.Show(value.Price.ToString());\n  }\n```\n\n\
  请仔细观察第 9 行中传递给 `OrderBy` 方法的 lambda 表达式：\n\n```\n item => item.Price\n```\n\n`item`\
  \ 参数接收数组中的一个元素，然后返回该元素的 `Price` 属性。结果是，查询将返回按其 `Price` 属性升序排列的数组元素。\n\n如果你想查看按降序排列的结果，则不能使用\
  \ `OrderBy` 方法。相反，你应该使用 `OrderByDescending` 方法，如下所示：\n\n```csharp\n var results\
  \ = retailItems.OrderByDescending(item => item.Price);\n```\n\n你经常需要在 LINQ 查询中组合对扩展方法的调用。例如，假设你有一个\
  \ `RetailItem` 数组，并且你想获取所有价格小于 100 的项目，并希望结果按价格升序排列。这需要你同时调用 `Where` 方法和 `OrderBy`\
  \ 方法。下面的代码段显示了实现这一目标的一种方法。\n\n```csharp\n RetailItem[] retailItems = {\n     new\
  \ RetailItem(\"Headphones\", 199.99m),\n     new RetailItem(\"Color Printer\", 99.99m),\n\
  \     new RetailItem(\"Security Camera\", 129.99m),\n     new RetailItem(\"Bluetooth\
  \ Speaker\", 79.99m)\n };\n\n  var results = retailItems.Where(item => item.Price\
  \ < 100m);\n  var results2 = results.OrderBy(item => item.Price);\n\n  foreach (var\
  \ value in results2)\n  {\n     MessageBox.Show(value.Price);\n  }\n```\n\n在此示例中，第\
  \ 9 行在 `retailItems` 数组上执行了 `Where` 方法。它获取所有 `Price` 值小于 100 的元素。该查询的结果作为 `IEnumberable<RetailItem>`\
  \ 集合返回，并赋值给变量 `results`。然后，第 10 行的语句在 `results` 集合上执行了 `OrderBy` 方法。它返回集合元素，并按其\
  \ `Price` 属性升序排列。结果以另一个 `IEnumberable<RetailItem>` 集合返回，并赋值给变量 `results2`。因此，`results2`\
  \ 变量指向包含最终结果的集合。\n\n与其执行多个独立的查询，LINQ 支持一种名为“方法链式”（method chaining）的技术，它允许你在一个语句中调用所有必要的扩展方法。以下是一个示例：\n\
  \n```csharp\n RetailItem[] retailItems = {\n     new RetailItem(\"Headphones\",\
  \ 199.99m),\n     new RetailItem(\"Color Printer\", 99.99m),\n     new RetailItem(\"\
  Security Camera\", 129.99m),\n     new RetailItem(\"Bluetooth Speaker\", 79.99m)\n\
  \ };\n\n  var results = retailItems.Where(item => item.Price < 100m)\n         \
  \                  .OrderBy(item => item.Price);\n\n  foreach (var value in results)\n\
  \  {\n     MessageBox.Show(value.Price);\n  }\n```\n\n在此示例中，首先调用 `Where` 方法来获取所有\
  \ `Price` 值小于 100 的元素。`Where` 方法将其结果作为 `IEnumberable<RetailItem>` 集合返回。然后，在 `Where`\
  \ 方法返回的集合上调用 `OrderBy` 方法。由 `OrderBy` 方法返回的 `IEnumberable<RetailItem>` 集合赋值给变量 `results`。\n\
  \n# `Select` 方法\n\n你可能注意到，在之前的方法语法示例中，我们没有使用 `Select` 方法。这是因为在使用方法语法编写查询时，`Select`\
  \ 方法是可选的。只有当你想要重塑查询返回的数据时，才需要使用它。以下是 `Select` 方法的通用格式：\n\n```csharp\n collection.Select(FuncDelegate)\n\
  ```\n\n在通用格式中，`collection`是要搜索的集合，`FuncDelegate` 是一个 `Func` 委托（或 lambda 表达式），它带有一个参数并返回一个值。`collection`\
  \ 中的每个元素都将作为参数传递给 `Func` 委托。该委托返回应包含在查询结果中的数据。例如，下面的代码段：\n\n```csharp\n string[]\
  \ names = { \"Jake\", \"Allison\", \"Sara\" };\n var results = names.Select(item\
  \ => item.ToUpper());\n```\n\n查询返回所有已转换为大写的 `names` 集合。这是另一个示例：\n\n```csharp\n string[]\
  \ names = { \"Bill\", \"Allison\", \"Sara\" };\n var results = names.Where(item\
  \ => item.Contains(\"ill\"))\n                   .Select(item => item.ToUpper());\n\
  ```\n\n查询返回字符串。以下是另一个示例：\n\n```csharp\n RetailItem[] retailItems = {\n     new RetailItem(\"\
  Headphones\", 199.99m),\n     new RetailItem(\"Color Printer\", 99.99m),\n     new\
  \ RetailItem(\"Security Camera\", 129.99m),\n     new RetailItem(\"Bluetooth Speaker\"\
  , 79.99m)\n };\n\n  var results = retailItems.Where(item => item.Price < 150m)\n\
  \                           .OrderBy(item => item.Price)\n                     \
  \      .Select(item => item.Description);\n```\n\n第 9 行和第 10 行的查询返回一个 `IEnumerable<string>`\
  \ 集合，包含价格小于 150 的项目的 `Description` 属性，并按价格排序。\n\n# Checkpoint\n\n1.  14.6 将以下查询转换为方法语法：\n\
  \n    ```csharp\n     var results = from item in retailItems\n                 \
  \ where item.Price < 100m\n                  orderby item.Price\n              \
  \    select item.Description;\n    ```\n\n\n\n\n\n| `Any` | 摘要：如果集合中的任何元素符合条件，则返回\
  \ `true`。否则，返回 `false`。通用格式：`collection`.`Any(`FuncDelegate`)`描述：在通用格式中，`collection`\
  \ 是你正在搜索的集合，而 `FuncDelegate` 是一个具有一个参数并返回 `bool` 值的 `Func` 委托（或 lambda 表达式）。`collection`\
  \ 的每个元素都将作为参数传递给 `Func` 委托。如果 `Func` 委托对集合中的任何一个元素返回 `true`，则 `Any` 方法返回 `true`。否则，`Any`\
  \ 方法返回 `false`。 |\n\n| `Contains` | 摘要：如果集合包含某个特定元素，则返回 `true`。否则，返回 `false`。通用格式：`collection`.`Contains(`value`)`描述：在通用格式中，`collection`\
  \ 是你正在搜索的集合，`value` 是你正在搜索的值。 |\n\n表 14-1 中的每个方法都接受一个具有一个参数并返回 `bool` 值的 `Func`\
  \ 委托（或 lambda 表达式）作为参数。让我们看看之前提供的 `RetailItem` 类的一些示例。以下代码段演示了 `All` 和 `Any` 方法：\n\
  \n```\n 1  RetailItem[] retailItems =\n 2  {\n 3      new RetailItem(\"Headphones\"\
  , 199.99m),\n 4      new RetailItem(\"Color Printer\", 99.99m),\n 5      new RetailItem(\"\
  Security Camera\", 129.99m),\n 6      new RetailItem(\"Bluetooth Speaker\", 79.99m)\n\
  \ 7  };\n 8\n 9  if (retailItems.All(item => item.Price < 200m))\n10      MessageBox.Show(\"\
  All items are less than $200.\");\n11\n12  if (retailItems.Any(item => item.Price\
  \ < 100m))\n13      MessageBox.Show(\"Some items are less than $100.\");\n```\n\n\
  第 9 行的 `if` 语句使用 `All` 方法判断 `retailItems` 数组中的是否所有元素的 `Price` 值都小于 200。然后，第 12 行的\
  \ `if` 语句使用 `Any` 方法判断 `retailItems` 数组中是否有任何元素的 `Price` 值小于 100。\n\n在第 8 章中首次提到的\
  \ `Contains` 方法在集合包含指定值时返回 `true`。否则，返回 `false`。以下代码段演示了这一点。\n\n```\n 1   string[]\
  \ names = { \"New York\", \"London\", \"Paris\", \"Munich\" };\n2 \n3   if (names.Contains(\"\
  London\"))\n4       MessageBox.Show(\"London is one of the cities.\");\n```\n\n\
  # 聚合方法\n\n*聚合方法*（aggregation method）是一种从值集合中计算单个值的方法。LINQ 提供了表 14-2 列出的聚合方法。\n\n\
  # 表 14-2 LINQ 聚合方法\n\n| 方法 | 描述 |\n| --- | --- |\n| `Average` | 摘要：返回数值集合的平均值。通用格式：`collection`.`Average()`通用格式：`collection`.`Average(`FuncDelegate`)`描述：在第一通用格式中，`collection`\
  \ 是数值集合。该方法返回 `collection` 中值的平均值。在第二通用格式中，`collection` 是一个集合，`FuncDelegate` 是一个具有一个参数并返回数值的\
  \ `Func` 委托（或 lambda 表达式）。`collection` 的每个元素都将作为参数传递给 `Func` 委托。`Average` 方法返回 `FuncDelegate`\
  \ 返回的值的平均值。| |\n| `Count` | 摘要：返回集合中的元素数量，或符合条件的元素数量。通用格式：`collection`.`Count()`通用格式：`collection`.`Count(`FuncDelegate`)`描述：在第一通用格式中，`collection`\
  \ 是一个集合。该方法返回 `collection` 中的元素数量。在第二通用格式中，`collection` 是一个集合，`FuncDelegate` 是一个具有一个参数并返回\
  \ `bool` 值的 `Func` 委托（或 lambda 表达式）。`collection` 的每个元素都将作为参数传递给 `Func` 委托。`Count`\
  \ 方法返回 `FuncDelegate` 返回的元素数量。 |\n| `Max` | 摘要：从数值集合返回最大值，或从对集合每个元素执行操作的委托返回最大值。通用格式：`collection`.`Max()`通用格式：`collection`.`Max(`FuncDelegate`)`描述：在第一通用格式中，`collection`\
  \ 是数值集合。该方法返回 `collection` 中的最大值。在第二通用格式中，`collection` 是一个集合，`FuncDelegate` 是一个具有一个参数并返回数值的\
  \ `Func` 委托（或 lambda 表达式）。`collection` 的每个元素都将作为参数传递给 `Func` 委托。`Max` 方法返回 `FuncDelegate`\
  \ 返回的最大值。|\n| `Min` | 摘要：从数值集合返回最小值，或从对集合每个元素执行操作的委托返回最小值。通用格式：`collection`.`Min()`通用格式：`collection`.`Min(`FuncDelegate`)`描述：在第一通用格式中，`collection`\
  \ 是数值集合。该方法返回 `collection` 中的最小值。在第二通用格式中，`collection` 是一个集合，`FuncDelegate` 是一个具有一个参数并返回数值的\
  \ `Func` 委托（或 lambda 表达式）。`collection` 的每个元素都将作为参数传递给 `Func` 委托。`Min` 方法返回 `FuncDelegate`\
  \ 返回的最小值。|\n| `Sum` | 摘要：返回数值集合元素的总和，或从对集合每个元素执行操作的委托返回的值的总和。通用格式：`collection`.`Sum()`通用格式：`collection`.`Sum(`FuncDelegate`)`描述：在第一通用格式中，`collection`\
  \ 是数值集合。该方法返回 `collection` 中值的总和。在第二通用格式中，`collection` 是一个集合，`FuncDelegate` 是一个具有一个参数并返回数值的\
  \ `Func` 委托（或 lambda 表达式）。`collection` 的每个元素都将作为参数传递给 `Func` 委托。`Sum` 方法返回 `FuncDelegate`\
  \ 返回的值的总和。|\n\n\n\n\n\n```\nRetailItem[] retailItems =\n{\n    new RetailItem(\"\
  Headphones\", 199.99m),\n    new RetailItem(\"Color Printer\", 99.99m),\n    new\
  \ RetailItem(\"Security Camera\", 129.99m),\n    new RetailItem(\"Bluetooth Speaker\"\
  , 79.99m)\n};\n\n// Get the average price.\nvar avg = retailItems.Average(item =>\
  \ item.Price);\nMessageBox.Show(\"Average Price: \" + avg);\n\n// Get the number\
  \ of items priced less than $100.\nvar lessThan100 = retailItems.Count(item => item.Price\
  \ < 100m);\nMessageBox.Show(\"Items less than $100: \" + lessThan100);\n\n// Get\
  \ the highest price.\nvar mostExpensive = retailItems.Max(item => item.Price);\n\
  MessageBox.Show(\"Most expensive price: \" + mostExpensive);\n\n// Get the lowest\
  \ price.\nvar leastExpensive = retailItems.Min(item => item.Price);\nMessageBox.Show(\"\
  Least expensive price: \" + leastExpensive);\n\n// Get the sum of all the prices.\n\
  var sum = retailItems.Sum(item => item.Price);\nMessageBox.Show(\"Sum of the prices:\
  \ \" + sum);\n```\n\n# 元素方法\n\n`元素方法`（element method）是指从集合返回特定元素的方法。LINQ 提供了表 14-3\
  \ 列出的元素方法。\n\n# 表 14-3 LINQ 元素方法\n\n| 方法 | 说明 |\n| --- | --- |\n| `ElementAt` |\
  \ 摘要：返回集合中特定位置的元素。通用格式：`collection`.ElementAt(`index)` 描述：在通用格式中，`collection` 是数值值集合，`index`\
  \ 是集合中的位置，其中 0 是第一个元素。该方法返回指定位置上的元素。如果索引超出范围，该方法将抛出 `ArgumentOutOfRangeException`。\
  \ |\n| `ElementAtOrDefault` | 摘要：返回集合中特定位置的元素，或者如果位置无效，则方法返回默认值。通用格式：`collection`.ElementAtOrDefault(`index)`\
  \ 描述：在通用格式中，`collection` 是数值值集合，`index` 是集合中的位置，其中 0 是第一个元素。该方法返回指定位置上的元素。如果索引超出范围，该方法返回元素数据类型的默认值（`int`\
  \ 为 0，引用类型为 `null` 等）。| |\n| `First` | 摘要：返回集合的第一个元素或符合条件的第一个元素。通用格式：`collection`.First()`\
  \ 通用格式：`collection`.First(`FuncDelegate)` 描述：在第一种通用格式中，`collection` 是集合。该方法返回集合中的第一个元素。如果集合为空，该方法将抛出\
  \ `InvalidOperationException`。在第二种通用格式中，`collection` 是集合，`FuncDelegate` 是一个 `Func`\
  \ 委托（或 lambda 表达式），它有一个参数并返回 `bool` 值。`collection` 中的每个元素都将作为参数传递给 `Func` 委托。`First`\
  \ 方法返回导致 `FuncDelegate` 返回 `true` 的第一个元素。 |\n| `FirstOrDefault` | 摘要：返回集合的第一个元素或符合条件的第一个元素。如果集合为空或没有元素符合条件，则方法返回默认值。通用格式：`collection`.FirstOrDefault()`\
  \ 通用格式：`collection`.FirstOrDefault(`FuncDelegate)` 描述：在第一种通用格式中，`collection` 是集合。该方法返回集合中的第一个元素。如果集合为空，该方法返回元素数据类型的默认值（`int`\
  \ 为 0，引用类型为 `null` 等）。在第二种通用格式中，`collection` 是集合，`FuncDelegate` 是一个 `Func` 委托（或\
  \ lambda 表达式），它有一个参数并返回 `bool` 值。`collection` 中的每个元素都将作为参数传递给 `Func` 委托。`FirstOrDefault`\
  \ 方法返回导致 `FuncDelegate` 返回 `true` 的第一个元素。 |\n| `Last` | 返回集合的最后一个元素或符合条件的最后一个元素。通用格式：`collection`.Last()`\
  \ 通用格式：`collection`.Last(`FuncDelegate)` 描述：在第一种通用格式中，`collection` 是集合。该方法返回集合中的最后一个元素。如果集合为空，该方法将抛出\
  \ `InvalidOperationException`。在第二种通用格式中，`collection` 是集合，`FuncDelegate` 是一个 `Func`\
  \ 委托（或 lambda 表达式），它有一个参数并返回 `bool` 值。`collection` 中的每个元素都将作为参数传递给 `Func` 委托。`Last`\
  \ 方法返回导致 `FuncDelegate` 返回 `true` 的最后一个元素。 |\n| `LastOrDefault` | 摘要：返回集合的最后一个元素或符合条件的最后一个元素。如果集合为空或没有元素符合条件，则方法返回默认值。通用格式：`collection`.LastOrDefault()`\
  \ 通用格式：`collection`.LastOrDefault(`FuncDelegate)` 描述：在第一种通用格式中，`collection` 是集合。该方法返回集合中的最后一个元素。如果集合为空，该方法返回元素数据类型的默认值（`int`\
  \ 为 0，引用类型为 `null` 等）。在第二种通用格式中，`collection` 是集合，`FuncDelegate` 是一个 `Func` 委托（或\
  \ lambda 表达式），它有一个参数并返回 `bool` 值。`collection` 中的每个元素都将作为参数传递给 `Func` 委托。`FirstOrDefault`\
  \ 方法返回导致 `FuncDelegate` 返回 `true` 的最后一个元素。 |\n| `Single` | 摘要：返回集合的唯一元素，或符合条件的唯一元素。通用格式：`collection`.Single()`\
  \ 通用格式：`collection`.Single(`FuncDelegate)` 描述：在第一种通用格式中，`collection` 是集合。如果集合包含一个元素，该方法返回该元素。如果集合为空或包含多个元素，该方法将抛出\
  \ `InvalidOperationException`。在第二种通用格式中，`collection` 是集合，`FuncDelegate` 是一个 `Func`\
  \ 委托（或 lambda 表达式），它有一个参数并返回 `bool` 值。`collection` 中的每个元素都将作为参数传递给 `Func` 委托。`Single`\
  \ 方法返回导致 `FuncDelegate` 返回 `true` 的唯一元素。 | |\n\n\n\n\n\n| `SingleOrDefault` | 摘要：返回集合的唯一元素，或符合条件的唯一元素。如果没有符合条件的元素，该方法返回默认值。如果有多个元素符合条件，该方法将抛出异常。通用格式：`collection``.SingleOrDefault()`通用格式：`collection``.SingleOrDefault(`FuncDelegate`)`描述：在第一种通用格式中，`collection`是一个集合。如果集合包含一个元素，该方法返回该元素。如果集合为空，该方法返回元素数据类型的默认值（`int`\
  \ 为 0，引用类型为 `null` 等）。如果集合包含多个一个元素，该方法将抛出 `InvalidOperationException`。在第二种通用格式中，`collection`\
  \ 是一个集合，`FuncDelegate` 是一个 `Func` 委托（或 lambda 表达式），它有一个参数并返回一个 `bool` 值。`collection`\
  \ 中的每个元素都将作为参数传递给 `Func` 委托。`SingleOrDefault` 方法返回导致 `FuncDelegate` 返回 `true` 的唯一元素。如果集合为空，该方法返回元素数据类型的默认值（`int`\
  \ 为 0，引用类型为 `null` 等）。如果集合中有多个导致 `FuncDelegate` 返回 `true` 的元素，该方法将抛出 `InvalidOperationException`。\
