  \ 3-49 完整替代文本\n\n使用以下测试数据判断应用程序计算是否正确：\n\n| 门票销售 | 收入 |\n| --- | --- |\n| A 类: 320\
  \ | A 类: $4,800.00 |\n| B 类: 570 | B 类: $6,840.00 |\n| C 类: 890 | C 类: $8,010.00\
  \ |\n| | 总收入: $19,650.00 |\n| A 类: 500 | A 类: $7,500.00 |\n| B 类: 750 | B 类: $9,000.00\
  \ |\n| C 类: 1,200 | C 类: $10,800.00 |\n| | 总收入: $27,300.00 |\n| A 类: 100 | A 类:\
  \ $1,500.00 |\n| B 类: 300 | B 类: $3,600.00 |\n| C 类: 500 | C 类: $4,500.00 |\n| |\
  \ 总收入: $9,600.00 |\n\n\n\n\n\n```\n if (expression)\n{\n   statement;\n   statement;\n\
  \   etc.\n}\n```\n\n该语句以 `if` 关键字开头，随后跟着用括号括起来的 `expression`。从下一行开始是一组用大括号括起来的语句。\n\
  \n括号内部出现的 `expression` 是一个布尔表达式。布尔表达式是可以被求值为 `true` 或 `false` 的表达式。当 `if` 语句执行时，会测试该布尔表达式。如果结果为\
  \ `true`，则执行大括号内的语句。然而，如果布尔表达式为 `false`，则大括号内的语句将被跳过。我们称大括号内的语句是 `conditionally\
  \ executed`（条件执行）的，因为它们只有在布尔表达式为 `true` 时才会被执行。\n\n如果你正在编写一个仅有一个条件执行语句的 `if` 语句，则不需要将该条件执行语句包含在大括号内。这样的一个\
  \ `if` 语句可以按照以下通用格式编写：\n\n```\n if (expression)\n   statement;\n```\n\n当按照这种格式编写的\
  \ `if` 语句执行时，会测试布尔表达式。如果结果为 `true`，则执行下一行的那条语句。然而，如果布尔表达式为 `false`，则那条语句将被跳过。\n\n\
  虽然在只有一个条件执行语句时不需要大括号，但使用它们仍然是一个好习惯，如下面的通用格式所示：\n\n```\n if (expression)\n{\n   statement;\n\
  }\n```\n\n这是编写 `if` 语句的良好风格，因为可以尽可能地减少错误。记住，如果你有多个条件执行语句，这些语句 `must` 包含在大括号内。如果你养成总是将条件执行语句包含在一对大括号中的习惯，你忘记它们的概率就会降低。\n\
  \n# 布尔表达式与关系运算符\n\n布尔表达式是为了纪念英国数学家乔治·布尔（George Boole）而命名的。在 19 世纪，布尔发明了一套数学系统，在这一套系统中，`true`\
  \ 和 `false` 的抽象概念可以被用于计算。\n\n通常情况下，由 `if` 语句测试的布尔表达式是由关系运算符组成的。关系运算符用于确定两个值之间是否存在特定的关系。例如，大于运算符（`>`）确定一个值是否大于另一个值。相等运算符（`==`）确定两个值是否相等。[表\
  \ 4-1] 列出了 C# 中可用的关系运算符。\n\n# 表 4-1 关系运算符\n\n| 运算符 | 含义 |\n| --- | --- |\n| `>`\
  \ | 大于 |\n| `<` | 小于 |\n| `>=` | 大于等于 |\n| `<=` | 小于等于 |\n| `==` | 等于 |\n| `!=`\
  \ | 不等于 |\n\n以下是一个使用大于运算符（`>`）比较两个变量 `length` 和 `width` 的表达式示例：\n\n```\n length\
  \ > width\n```\n\n该表达式确定 `length` 变量的值是否大于 `width` 变量的值。如果 `length` 大于 `width`，则表达式的值为\
  \ `true`。否则，表达式的值为 `false`。接下来的表达式使用小于运算符（`<`）来确定 `length` 是否小于 `width`：\n\n```\n\
  \ length < width\n```\n\n[表 4-2] 显示了几个比较变量 `x` 和 `y` 的布尔表达式示例。\n\n# 表 4-2 使用关系运算符的布尔表达式\n\
  \n| 表达式 | 含义 |\n| --- | --- |\n| `x > y` | `x` 大于 `y` 吗？ |\n| `x < y` | `x` 小于 `y`\
  \ 吗？ |\n| `x >= y` | `x` 大于等于 `y` 吗？ |\n| `x <= y` | `x` 小于等于 `y` 吗？ |\n| `x ==\
  \ y` | `x` 等于 `y` 吗？ |\n| `x != y` | `x` 不等于 `y` 吗？ |\n\n# `>=` 和 `<=` 运算符\n\n运算符\
  \ `>=` 和 `<=` 测试了多种关系。`>=` 运算符确定左侧的操作数是否大于*或*等于右侧的操作数。`<=` 运算符确定左侧的操作数是否小于*或*等于右侧的操作数。\n\
  \n例如，假设变量 `a` 被赋值 4。以下表达式均为真：\n\n```\n a >= 4\na >= 2\n8 >= a\na <= 4\na <= 9\n\
  4 <= a\n```\n\n# `==` 运算符\n\n`==` 运算符确定左侧的操作数是否等于右侧的操作数。如果两个操作数的值相同，则表达式为 `true`。假设\
  \ `a` 为 4，表达式 `a == 4` 为 `true`，表达式 `a == 2` 为 `false`。\n\n# `!=` 运算符\n\n`!=` 运算符确定左侧的操作数是否等于右侧的操作数。\n\
  \n# 综合运用\n\n让我们来看这个 `if` 语句的示例：\n\n```\n if (sales > 500)\n{\n   bonus = 500;\n\
  }\n```\n\n该语句使用 `>` 运算符来确定 `sales` 是否大于 500。如果表达式 `sales > 500` 为 `true`，则给 `bonus`\
  \ 赋值 500。如果表达式为 `false`，则赋值语句将被跳过。[图 4-3] 显示了该部分的流程图。\n\n# 图 4-3 决策结构示例\n\n![显示了一个简单决策结构的流程图。](img/FG_04003.png)\n\
  \n以下代码示例条件执行了三个语句：\n\n```\n if (sales > 50000)\n{\n    bonus = 500;\n    commissionRate\
  \ = 0.12;\n    MessageBox.Show(\"你达到了目标！\");\n}\n```\n\n# 图 4-4 决策结构示例\n\n![显示了一个复杂决策结构的流程图。](img/FG_04004.png)\n\
  \n当你编写 `if` 语句时，Visual Studio 会自动缩进条件执行语句，如示例所示。缩进不是必须的，但它让代码更易读、更容易调试。通过缩进条件执行语句，你可以将其与周围的代码区分开。这让你一眼看出程序的哪部分是由\
  \ `if` 语句控制的。大多数程序员在编写 `if` 语句时都会使用这种缩进风格。\n\n# 检查点\n\n1. 什么是 4.1？\n2. 什么是决策结构？\n\
  3. 什么是单分支决策结构？\n4. 什么是布尔表达式？\n5. 使用关系运算符可以测试数值值之间哪些类型的关系？\n6. 写一个 `if` 语句，确定变量 `y`\
  \ 是否等于 20。如果是，则给变量 `x` 赋值 0。\n7. 写一个 `if` 语句，确定变量 `sales` 是否大于或等于 10,000。如果是，则给变量\
  \ `commissionRate` 赋值 0.2。\n\n# 4.2 `if-else` 语句\n\n### 概念\n\n`if-else` 语句会在布尔表达式为\
  \ `true` 时执行一个语句块，在布尔表达式为 `false` 时执行另一块语句块。\n\n\n\n\n\n上一节介绍了单路择一决策结构（`if` 语句），它只有一条执行路径。现在，我们将介绍双路择一决策结构，它有两个可能的执行路径——如果布尔表达式为真，则执行一条路径；如果布尔表达式为假，则执行另一条路径。图\
  \ 4-8 展示了双路择一决策结构的示例流程图。\n\n## 图 4-8 双路择一决策结构\n\n![流程图显示了双路择一决策结构。](img/FG_04_008.png)图\
  \ 4-8 替代文本\n\n流程图中的决策结构测试表达式 `temperature < 40`。如果该表达式为真，则显示消息“有点冷，不是吗？”。如果表达式为假，则显示消息“天气真不错。”。\n\
  \n在代码中，我们将双路择一决策结构写为 `if-else` 语句。以下是 `if-else` 语句的通用格式：\n\n![截图显示了 if-else 语句的通用格式。](img/UNFG_04_001.png)4.2-3\
  \ 替代文本\n\n`if-else` 语句包含两个部分：`if` 子句和 `else` 子句。与普通的 `if` 语句一样，`if-else` 语句测试一个布尔表达式。如果布尔表达式为真，则执行\
  \ `if` 子句后面的语句 set。如果布尔表达式为假，则执行 `else` 子句后面的语句 set。\n\n`if-else` 语句有两组根据条件执行的语句。一组语句仅在布尔表达式为真的条件下才执行，另一组语句则仅在布尔表达式为假的条件下才执行。在任何情况下，两组条件执行的语句都不会同时被执行。\n\
  \n如果某一组条件执行的语句只包含一条语句，则不需要大括号。例如，下面的通用格式显示 `if` 子句后面只有一条语句，`else` 子句后面也只有一条语句：\n\
  \n```cpp\n if (expression)\n    statement;\nelse\n    statement;\n```\n\n虽然在只有一个条件执行的语句时不需要大括号，但使用它们仍然是一个好习惯，如下所示的通用格式所示：\n\
  \n```cpp\n if (expression)\n{\n   statement;\n}\nelse\n{\n   statement;\n}\n```\n\
  \n当我们讨论普通的 `if` 语句时，提到这是一种良好的编程风格，因为可以减少错误。如果 `if` 子句或 `else` 子句后面有多个根据条件执行的语句，则这些语句*必须*被括在大括号中。如果你养成了总是将条件执行的语句封装在一对大括号中的习惯，那么你就不太可能忘记它们。\n\
  \n在教程 4-2 中，你将完成一个使用 `if-else` 语句的应用程序。\n\n# 检查点\n\n1. 4.8 描述双路一决策结构的工作原理。\n2. 4.9\
  \ 在 `if-else` 语句中，在什么情况下 `else` 子句后面的语句会执行？\n3. 4.10 编写一个如下所示的 `if-else` 语句：如果 `sales`\
  \ 变量大于或等于 50,000，则给 `commissionRate` 变量赋值 0.2。否则，给 `commissionRate` 变量赋值 0.1。\n\n\
  ## 4.3 嵌套决策结构\n\n### 概念\n\n为了测试多个条件，可以将一个决策结构嵌套在另一个决策结构内部。\n\n在第 4.1 节中，我们提到控制结构决定了一组语句执行的顺序。程序通常设计为不同控制结构的组合。例如，图\
  \ 4-10 显示了一个将决策结构与两个顺序结构相结合的流程图。\n\n### 图 4-10 顺序结构与决策结构的结合\n\n![流程图显示了一个包含两个顺序结构的组合决策结构。](img/FG_04_010.png)图\
  \ 4-10 替代文本\n\n流程图中的决策结构测试表达式 `temperature < 40`（注：原文为 `temperature < 40`）。如果该表达式为真，则显示“有点冷，不是吗？”。如果表达式为假，则显示“天气真不错。”。\n\
  \n流程图中的图 4-10 从顺序结构开始。如果表达式为真，第一步是。通常情况下，结构必须嵌套。例如，查看图 4-11，它显示了决策结构中的顺序结构。\n\n\
  ### 图 4-11 决策结构中的顺序结构\n\n![流程图显示了决策结构中的顺序结构。](img/FG_04_011.png)图 4-11 替代文本\n\n\
  你也可以拥有嵌套结构，即出现在其他结构内部的决策结构。这通常用于需要测试多个条件的程序。例如，考虑一个判断客户是否符合贷款条件的程序。要符合条件，必须满足两个：(1)\
  \ 客户年收入至少 40,000；(2) 客户在当前工作至少 2 年。图 4-12 显示了可能用于此类程序的流程图。假设 `salary` 变量包含客户的年收入，`yearsOnJob`\
  \ 变量包含客户在当前工作的年数。\n\n### 图 4-12 嵌套决策结构\n\n![流程图显示了一个嵌套决策结构的示例。](img/FG_04_012.png)图\
  \ 4-12 替代文本\n\n如果我们遵循执行流，可以看到测试了布尔表达式 `salary >= 40000`。如果该表达式为假，则不需要进一步测试；我们知道客户不符合条件。然而，如果表达式为真，我们需要测试第二个条件。这是通过一个测试布尔表达式\
  \ `yearsOnJob >= 2` 的嵌套决策结构来实现的。如果该表达式为真，则客户符合条件。如果该表达式为假，则客户不符合条件。在教程 4-3 中，你将创建一个执行该算法的应用程序。\n\
  \n## 嵌套决策结构中的缩进与对齐\n\n为了调试，在嵌套 `if` 语句中使用正确的对齐和缩进是非常重要的。这有助于更容易看出结构的每个部分执行了哪些操作。例如，下面的代码在功能上等同于程序\
  \ 4-3 中的第 37-56 行。虽然这段代码在逻辑上是正确的，但由于没有正确缩进，调试将非常困难。\n\n\n\n\n\n```\n if (salary\
  \ >= MINIMUM_SALARY)\n{\nif (yearsOnJob >= MINIMUM_YEARS_ON_JOB)\n{\n// The user\
  \ qualifies.\ndecisionLabel.Text = \"You qualify for the loan.\";\n}\nelse\n{\n\
  // The user does not qualify.\ndecisionLabel.Text = \"Minimum years at current \"\
