- - '###'
  - 概念说明 本的每个主要章节都从一个概念说明开始。该说明简要总结了该章节的重点。
- - '###'
  - 教程 每个章节都有若干实践教程，引导学生开发应用程序。每个教程提供了详细的步骤说明以及完成表单的截图。
- - '###'
  - 示例程序 每个章节都有大量的代码示例，旨在突出当前主题。
- - '###'
  - 注意事项 注意事项出现在书中各。它们对相关的有趣或难以理解的点进行了简要解释。
- - '###'
  - 提示 提示学生处理编程问题的最佳技巧。
- - '###'
  - 警告 警告学生可能导致程序故障或数据丢失的编程技术或做法。
- - '###'
  - 检查点 检查点分布在每章中。旨在学习新内容后快速测试学生的知识。检查点的答案可以在附录 D找到。
- - '###'
  - 编程题 每章提供一系列编程题，旨在巩固学生对学主题的知识。
- - '###'
  - 视频教程 中的每个教程都有相应的视频，可以在网站访问。学生跟随作者完成视频。此外，每章末尾的一个编程题都有相应的视频教程展示。
