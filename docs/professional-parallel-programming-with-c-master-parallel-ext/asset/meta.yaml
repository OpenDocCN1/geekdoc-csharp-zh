  - 本书的结构
- - '##'
  - 第 6 章，“PLINQ：声明式数据并行化” —— 使用并行语言集成查询 (`PLINQ`) 及其聚合函数进行声明式数据并行化工作。你可以使用 `PLINQ`
    来简化运行混合了任务分解和数据分解任务的代码。你还可以执行经典的并行 Map Reduce 算法。本章结合了之前章节中介绍的许多主题，并解释了如何将 `LINQ`
    查询转换为 `PLINQ` 查询。此外，本章还教授了根据不同场景调整 `PLINQ` 并行执行的不同技术。
- - '##'
  - 第 7 章，“Visual Studio 2010 任务调试能力” —— 充分利用 Visual Studio 2010 中引入的新任务调试功能。本章介绍了新窗口如何显示有关任务的重要信息，以及任务与源代码和支持其执行的线程之间的关系。在
    `.NET Framework 4` 中处理并行化代码时，使用这些新窗口检测并解决潜在的错误。
- - '##'
  - 第 8 章，“线程池” —— 理解使用任务与直接请求在线程池中运行的工作项之间的区别。如果你在使用线程池，可以利用新的改进并将代码迁移到基于任务的编程模型。本章介绍了在
    `.NET Framework 4` 中引入的 `CLR` 线程池引擎的变化，并提供了一个自定义任务调度器的示例。
- - '##'
  - 第 9 章，“异步编程模型” —— 利用将现有异步编程模型与任务混合的优势。本章提供了真实示例，利用任务和延续的简单性来执行与现有异步编程模型相关的并发异步作业。此外，本章还教授了并发编程相关的最复杂的话之一：从不同的任务和线程更新用户界面
    (UI)的过程。本章解释了在 Windows Forms 和 Windows Presentation Foundation (`WPF`) 应用程序中更新
    UI 的模式。
- - '##'
  - 第 10 章，“并行测试与调优” —— 利用 Visual Studio 2010 专业版和旗舰版引入的新并发性能分析功能。学习与 `.NET Framework
    4` 并行代码相关的常见且易于检测的问题是非常重要的。本章解释了用于创建和运行并行测试及基准测试的不同技术。它还教你如何根据每次分析会议的结果重构现有应用程序。
- - '##'
  - 第 11 章，“向量化、SIMD 指令和额外的并行库” —— 利用现代硬件提供的与并行相关的其他可能性。`.NET Framework 4` 未提供对 `SIMD`
    或向量化的直接支持。然而，大多数现代微处理器提供了这些强大的额外指令。因此，你可以使用优化过的库来利用这些指令带来的性能提升。本章解释了如何使用 `C#`
    将 Intel Math Kernel Library 集成到基于任务的编程代码中。此外还解释了如何使用 Intel Integrated Performance
    Primitives 优化关键区域。
- - '##'
  - 附录 A，“.NET 4 并行类图” —— 本附录包含了支持新型轻级并发模型和底层线程模型并行的类、接口、结构、委托、枚举和异常的图表。还引用了详细解释这些图表内容的章节。
- - '##'
  - 附录 B，“并发 UML 模型” —— 本附录提供了一些示例，说明如何使用 UML 模型表示为并发准备的设计和代码。你可以通过添加一些简单且标准的视觉元素来扩展经典模型。
- - '##'
  - 附录 C，“Parallel Extensions Extras” —— Parallel Extensions Extras 是一个补充项目，它不属于 `.NET
    Framework 4` 的类，但它是微软作为 `.NET Framework 4` 并行编程示例的一部分而开发的。本附录包含了构成 Parallel Extensions
    Extras 的类和结构的图表及简要描述。
