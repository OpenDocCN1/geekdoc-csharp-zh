  \ OK\nTime: 16:22:03.700997, Phase: 40, Participant: 2, Phase completed OK\n\n关键区域运行了一单行代码，调用\
  \ `StringBuilder` 实例 `sb` 的 `Append` 方法，并将时间、阶段数和参与者编号的信息添加到日志字符串中。由于关键区域将是序列化的，因此调用\
  \ `Append` 方法是安全的。注意，关键区域仅使用预先格式化的 `logLine` 字符串调用 `Append` 方法。`String.Format` 方法在关键区域之外返回格式化字符串，以避免比绝对需要的时间持有锁。添加新字符串时需要锁，但格式化要添加的字符串时不需要锁。\n\
  \n\n\n\n当代码使用 `lock` 关键字时，`Monitor.Enter` 方法将尝试获取 `sb` 上的锁，如果无法获取，任务将阻塞直到能够获取该锁为止。一旦获取了锁，`//\
  \ Critical section` 之后的行就会执行。如果此时其他任务调用了 `Monitor.Enter` 方法，它们将阻塞，直到正在运行临界区的任务调用针对\
  \ `sb` 的 `Monitor.Exit` 方法来释放锁。请记住，由于代码使用了 `lock` 关键字，因此在最后一个语句块之后的一个 `try…finally`\
  \ 块中调用了 `Monitor.Exit`。当代码退出此临界区块后，其他任务之一将能够获取锁并执行相同的序列。\n\n## 使用 Monitor\n\n以下代码显示了之前的\
  \ .NET Framework 版本用于替换 `lock` 关键字的编译器生成代码，该代码使用互斥锁来运行临界区块。如你所见，代码使用了 `Monitor.Enter`\
  \ 和 `Monitor.Exit` 而不是 `lock` 关键字：\n\n![download](img/download.gif)\n\n```cs\nMonitor.Enter(sb);\n\
  \ntry\n{\n    // Monitor acquired a lock on sb\n    // Critical section\n    sb.Append(logLine);\n\
  \    // End of critical section\n}\nfinally\n{\n    // You need to make sure that\n\
  \    // you release the lock on sb\n    Monitor.Exit(sb);\n}\n```\n代码片段来自 `Snippet5_5`\n\
  \n.NET Framework 4 为 `Monitor.Enter` 方法添加了一个新的重载，该方法接收一个引用传递的 `bool` 变量作为额外参数。实际上，.NET\
  \ Framework 4 在替换 `lock` 关键字的编译器生成代码中使用此参数。一旦 `Monitor` 获取了锁，它会自动将引用 `bool` 变量设置为\
  \ `true`。接后的代码显示了你如何使用此参数：\n\n![download](img/download.gif)\n\n```csharp\nbool lockTaken\
  \ = false;\ntry\n{\n    Monitor.Enter(sb, ref lockTaken);\n    // Monitor acquired\
  \ a lock on sb\n    // Critical section\n    sb.Append(logLine);\n    // End of\
  \ critical section\n}\nfinally\n{\n    // You need to make sure that\n    // you\
  \ release the lock on sb\n    if (lockTaken)\n    {\n        // Gives up the lock\
  \ if it actually acquired it\n        Monitor.Exit(sb);\n    }\n}\n```\n代码片段来自 `Snippet5_6`\n\
  \n每个参与者都将 `lockTaken` `bool` 变量设置为 `false`，然后调用 `Monitor.Enter` 方法获取 `sb` 上的锁。`Monitor.Enter`\
  \ 的第二个参数是 `lockTaken`，通过引用传递。一旦 `Monitor` 获取了锁，`lockTaken` 将变为 `true`，且 `// Critical\
  \ section` 之后的行就会执行。`finally` 部分中的代码会检查 `lockTaken` 是否为 `true`，以便仅在实际获取了锁的情况下才通过调用\
  \ `Monitor.Exit` 方法来释放锁。如果 `Monitor.Enter` 因为抛出异常而无法获取锁，则 `lockTaken` 变量将为 `false`，结果\
  \ `finally` 部分中的代码将不会调用 `Monitor.Exit`。\n\n![note](img/note.gif)\n\n你应该避免在外部对象上加锁，因为这可能导致难以解决的死锁。此外，避免跨成员和/或类边界获取和释放锁。由于类似的原因，在持有锁时避免调用未知代码。如果你无法做到这一点，编写这些未知代码的开发者应该知道在调用代码时将持有锁。将临界区中的代码保持尽可能简单。临界区必须包含需要序列化的代码。\n\
  \n## 锁的超时处理\n\n正如在屏障（barrier）中发生的情况一样，由于会有许多任务尝试获取锁以进入临界区，如果一个参与者不释放锁，其他任务将永远阻塞在\
  \ `Monitor.Enter` 方法中。要查看此方面的示例，请更改临界区代码中的以下几行：\n\n![download](img/download.gif)\n\
  \n```csharp\nbool lockTaken = false;\ntry\n{\n    Monitor.Enter(sb, ref lockTaken);\n\
  \    // Monitor acquired a lock on sb\n    // Critical section\n    sb.Append(logLine);\n\
  \    // Spin until there aren't remaining participants\n    // for the current phase\n\
  \    // This should never be used inside a critical region\n    SpinWait.SpinUntil(()\
  \ => (_barrier.ParticipantsRemaining == 0));\n    // End of critical section\n}\n\
  finally\n{\n    // You need to make sure that\n    // you release the lock on sb\n\
  \    if (lockTaken)\n    {\n        // Gives up the lock if it actually acquired\
  \ it\n        Monitor.Exit(sb);\n    }\n}\n```\n代码片段来自 `Snippet5_7`\n\n第一个获取 `sb`\
  \ 锁并到达临界区的任务将保持阻塞，直到 `ParticipantsRemaining` 达到 0。该条件永远不会成立，因此临界区的结束不会到来，`Monitor.Exit`\
  \ 也不会运行以释放锁。所有其他任务将留在 `Monitor.Enter` 方法中，处于阻塞状态并等待锁释放。\n\n如果你使用 `Break All` 命令停止执行，并通过选择\
  \ `Debug` → `Parallel Tasks` 显示 `Parallel Tasks` 窗口，所有参与屏障的任务状态都将是 `Waiting`，如图\
  \ 5-12 所示。这样做的问题是它们将永远等待。在某些情况下，运行 `SpinWait.SpinUntil` 行的任务可能会显示为 `Running`。\n\n\
  ![note](img/note.gif)\n\n之前的示例在临界区内调用 `SpinWait.SpinUntil` 方法仅仅是为了说明死锁情况——这是并行编程中最不希望的问题之一，你不应该编写这种代码。持有锁时，你应该避免调用可能阻塞的内容。\n\
  \n![5.12](img/c0f012.jpg)\n\n你可以使用 `TryEnter` 方法代替 `Enter` 来建立超时。它的定义之一接受等待毫秒数作为第一个参数，并将\
  \ `bool` 变量作为第二个参数。与 `Monitor.Enter` 不同，`TryEnter` 在等待锁时不会无限阻塞。它会阻塞直到锁可用或指定的超时过期。因此，在调用\
  \ `TryEnter` 后检查 `bool` 变量的值，因为 `false` 值意味着由于超时未获取锁。\n\n下面的代码显示了带超时获取锁并运行临界区的新版本。调用\
  \ `TryEnter` 方法后的下一行检查 `lockTaken` 是否为 `false`，如果是，则抛出 `TimeoutException`。在这种情况下，异常没有被捕获，因此无法获取锁的每个任务将故障并停止执行。\n\
  \n![download](img/download.gif)\n\n```csharp\nbool lockTaken = false;\ntry\n{\n\
  \    Monitor.TryEnter(sb, 2000, ref lockTaken);\n    if (!lockTaken)\n    {\n  \
  \      // It was not possible to acquire the lock\n        // within the 2000 milliseconds\
  \ timeout\n        Console.WriteLine(\"Lock timeout for participant: {0}\", participantNumber);\n\
  \        throw new TimeoutException(\n            String.Format(\n             \
  \   \"Participants are requiring more than {0} seconds to acquire the lock at the\
  \ Phase # {1}.\",\n                2000, _barrier.CurrentPhase));\n    }\n    //\
  \ Monitor acquired a lock on sb\n    // Critical section\n    sb.Append(logLine);\n\
  \    // Spin until there aren't remaining participants\n    // for the current phase\n\
  \    // This should never be used inside a critical region\n    SpinWait.SpinUntil(()\
  \ => (_barrier.ParticipantsRemaining == 0));\n    // End of critical section\n}\n\
