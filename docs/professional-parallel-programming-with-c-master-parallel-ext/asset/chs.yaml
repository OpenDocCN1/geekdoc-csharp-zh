  \          // 这是要处理的文件名\n            string fileName = @\"C:\\Pictures\\Test.jpg\"\
  ;\n            var originalImage = new Bitmap(fileName);\n            var srcBitmapData\
  \ = GetBitmapData(originalImage, ImageLockMode.ReadOnly);\n            var destinationImage\
  \ = new Bitmap(originalImage.Width, originalImage.Height);\n            var dstBitmapData\
