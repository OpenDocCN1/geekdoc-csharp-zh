  \n\n\n\n# 列表 4-10：带有多个 `BlockingCollection` 实例的多级管道过滤器实现\n\n```csharp\nclass PipelineFilter<TInput,\
  \ TOutput>\n{\n    private Func<TInput, TOutput> _processor = null;\n    private\
  \ Action<TInput> _outputProcessor = null;\n    private System.Threading.CancellationToken\
  \ _token;\n    public BlockingCollection<TInput>[] Input;\n    public BlockingCollection<TOutput>[]\
  \ Output = null;\n    public string Name { get; private set; }\n    private const\
  \ int OUT_COLLECTIONS = 5;\n    private const int OUT_BOUNDING_CAPACITY = 1000;\n\
  \    private const int TIMEOUT = 50;\n\n    // Func<TInput, TOutput> 过滤器的构造函数\n\
  \    public PipelineFilter(\n        BlockingCollection<TInput>[] input,\n     \
  \   Func<TInput, TOutput> processor,\n        System.Threading.CancellationToken\
  \ token,\n        string name)\n    {\n        Input = input;\n        Output =\
  \ new BlockingCollection<TOutput>[OUT_COLLECTIONS];\n        // 创建输出 BlockingCollection\
  \ 实例\n        for (int i = 0; i < Output.Length; i++)\n        {\n            Output[i]\
  \ = new BlockingCollection<TOutput>(OUT_BOUNDING_CAPACITY);\n        }\n       \
  \ _processor = processor;\n        _token = token;\n        Name = name;\n    }\n\
  \n    // Action<TInput> 过滤器的构造函数\n    // 最终消费者\n    public PipelineFilter(\n   \
  \     BlockingCollection<TInput>[] input,\n        Action<TInput> renderer,\n  \
  \      System.Threading.CancellationToken token,\n        string name)\n    {\n\
  \        Input = input;\n        _outputProcessor = renderer;\n        _token =\
  \ token;\n        Name = name;\n    }\n\n    public void Run()\n    {\n        //\
  \ 当所有输入 \n        // BlockingCollection 实例的 IsCompleted 为 false \n        // 且没有取消请求时继续运行\n\
  \        while (!Input.All(inputBC => inputBC.IsCompleted) && (!_token.IsRequested))\n\
  \        {\n            TInput item;\n            int i = BlockingCollection<TInput>.TryTakeAny(Input,\
  \ out item, TIMEOUT, _token);\n            if (i >= 0)\n            {\n        \
  \        if (Output != null)\n                {\n                    // 处理项目\n \
  \                   TOutput result = _processor(item);\n                    // 将结果添加到任何输出集合中\n\
  \                    BlockingCollection<TOutput>.AddToAny(Output, result, _token);\n\
  \                }\n                else\n                {\n                  \
  \  // 代码正在运行最后一个消费者\n                    _outputProcessor(item);\n             \
  \   }\n            }\n        }\n        if (Output != null)\n        {\n      \
  \      // 所有 BlockingCollection 实例已完成\n            foreach (var outputBC in Output)\n\
  \            {\n                outputBC.CompleteAdding();\n            }\n    \
  \    }\n    }\n}\n\nprivate const int NUM_SENTENCES = 2000000;\nprivate static string\
  \ ProduceASentence(string[] possibleSentences)\n{\n    var rnd = new Random();\n\
  \    var sb = new StringBuilder();\n    string newSentence;\n    for (int j = 0;\
  \ j < possibleSentences.Length; j++)\n    {\n        if (rnd.Next(2) > 0)\n    \
  \    {\n            sb.Append(possibleSentences[rnd.Next(possibleSentences.Length)]);\n\
  \            sb.Append(' ');\n        }\n    }\n    if (rnd.Next(20) > 5)\n    {\n\
  \        newSentence = sb.ToString();\n    }\n    else\n    {\n        newSentence\
  \ = sb.ToString().ToUpper();\n    }\n    return newSentence;\n}\n\npublic static\
  \ void Main()\n{\n    var cts = new System.Threading.CancellationTokenSource();\n\
  \    var ct = cts.Token;\n    var sw = Stopwatch.StartNew();\n    BlockingCollection<string>[]\
  \ sourceSentences = new BlockingCollection<string>[5];\n    for (int i = 0; i <\
  \ sourceSentences.Length; i++)\n    {\n        sourceSentences[i] = new BlockingCollection<string>(NUM_SENTENCES\
  \ / 5);\n    }\n    string[] possibleSentences = {\n        \"ConcurrentBag is included\
  \ in the Systems.Concurrent.Collections namespace.\",\n        \"Is parallelism\
  \ important for cloud-computing?\",\n        \"Parallelism is very important for\
  \ cloud-computing!\",\n        \"ConcurrentQueue is one of the new collections added\
  \ in .NET Framework 4\",\n        \"ConcurrentStack is a concurrent collection that\
  \ represents a LIFO collection\",\n        \"ConcurrentQueue is a concurrent collection\
  \ that represents a FIFO collection\"\n    };\n    Parallel.For(0, NUM_SENTENCES,\
  \ (sentenceNumber) =>\n    {\n        BlockingCollection<string>.TryAddToAny(sourceSentences,\
  \ ProduceASentence(possibleSentences), 50);\n    });\n    for (int j = 0; j < sourceSentences.Length;\
  \ j++)\n    {\n        sourceSentences[j].CompleteAdding();\n    }\n    char[] delimiterChars\
  \ = { ' ', ',', '.', ':', ';', '(', ')', '[', ']', '{', '}', '/', '?', '@', '\\\
  t', '\"' };\n    var filterCapitalizeWords = new PipelineFilter<string, string>(\n\
  \        sourceSentences,\n        (sentence) => CapitalizeWords(delimiterChars,\
  \ sentence, ''),\n        ct,\n        \"CapitalizeWords\"\n    );\n    char[] letterChars\
  \ = { 'A', 'B', 'C', 'e', 'i', 'j', 'm', 'X', 'y', 'Z' };\n    var filterRemoveLetters\
  \ = new PipelineFilter<string, string>(\n        filterCapitalizeWords.Output,\n\
  \        (sentence) => RemoveLetters(letterChars, sentence),\n        ct,\n    \
  \    \"RemoveLetters\"\n    );\n    var filterWriteLine = new PipelineFilter<string,\
  \ string>(\n        filterRemoveLetters.Output,\n        (sentence) => Console.WriteLine(sentence),\n\
  \        ct,\n        \"WriteLine\"\n    );\n    var deferredCancelTask = Task.Factory.StartNew(()\
  \ =>\n    {\n        // 让此线程睡眠 2 秒\n        System.Threading.Thread.Sleep(2000);\n\
  \        // 发送取消信号\n        cts.Cancel();\n    });\n    try\n    {\n        Parallel.Invoke(\n\
  \            () => filterCapitalizeWords.Run(),\n            () => filterRemoveLetters.Run(),\n\
  \            () => filterWriteLine.Run()\n        );\n    }\n    catch (AggregateException\
  \ ex)\n    {\n        foreach (var innerEx in ex.InnerExceptions)\n        {\n \
  \           Console.WriteLine(innerEx.Message);\n        }\n    }\n    Debug.WriteLine(sw.Elapsed.ToString());\n\
  \    // 显示结果并等待用户按键\n    Console.WriteLine(\"Finished!\");\n    Console.ReadLine();\n\
  }\n```\n\n`Main` 方法创建了五个名为 `sourceSentences` 的 `BlockingCollection<string>` 实例来分配句子。一旦句子分配到不同的\
  \ `BlockingCollection` 实例，调用 `CompleteAdding` 方法即可确保它们可以被第一个过滤器使用。\n\n![note](img/note.gif)\n\
  \n在这个示例中，由于 `Parallel.For` 循环通过调用 `TryAddToAny` 方法填充 `BlockingCollection` 实例，随机数生成器的效率并不高。不过，该主题将在后续章节中介绍。\n\
  \n然后，代码定义了以下三个过滤器：\n\n*   `filterCapitalizeWords` —— 接收一个字符串并返回一个字符串。它的输入数组是 `sourceSentences[]`，它对从这些集合中取的每个字符串调用\
  \ `CapitalizeWords` 方法以产生另一个字符串。\n*   `filterRemoveLetters` —— 接收一个字符串并返回一个字符串。它的输入数组是\
  \ `filterCapitalizeWords.Output`（这是一个 `BlockingCollection<string>` 数组），它对从这些集合中取的每个字符串调用\
  \ `RemoveLetters` 方法以产生另一个字符串。\n\n\n\n\n\n*   `filterWriteLine` — 这是最终的消费者，不会生成输出。因此，它使用\
  \ `Action<string>` 构造函数，因为它接收一个字符串。它的输入数组是来自 `filterRemoveLetters.Output` 的输出，这是一个\
  \ `BlockingCollection<string>` 数组，它会对从这些集合中提取的每个字符串调用 `Console.WriteLine` 方法，以便在控制台上显示结果字符串。\n\
  \n<br>一旦定义了这三个过滤器，一个名为 `deferredCancelTask` 的新 `Task` 实例将在 2 秒后发送信号以取消所有过滤器。在启动此任务后，代码调用\
  \ `Parallel.Invoke` 通过并发（并可能并行）调用它们的 `Run` 方法，在管道中运行这三个过滤器。\n\n如之前解释，当可用逻辑核心数超过三个时，对\
  \ `Parallel.Invoke` 的调用将无法扩展。然而，你可以像前面的章节介绍的那样使用许多 `Task` 实例来利用每个过滤器中额外的核心。此示例解释了将不同的过滤器应用于顺序流的方法。你可以测试不同的配置以实现最佳的吞吐量。\n\
  \n![note](img/note.gif)\n\n当每个过滤器运行在不同的软件线程中时，管道可以获得最佳吞吐量。记住，当你处理任务时，调度器可以使用不同的线程来支持其执行。你可以自定义调度器，让过滤器创建的每个任务运行在不同的线程中。然而，这是一个更复杂的话题，将在后续章节介绍。\n\
  \n## ConcurrentDictionary\n\n`ConcurrentDictionary` 对于读取操作是完全无锁的。它针对读取是最频繁操作的场景进行了优化。当许多任务或线程在字典中添加或更新数据时，它使用细粒度锁。`ConcurrentDictionary`\
  \ 是 `System.Collections.IDictionary` 实现的并发版本。你可以定义所需的并发级别（更新字典的任务或线程的最大数量）、其首选初始容量，以及用于比较键的\
  \ `IEqualityComparer<TKey>` 实现。你可以使用 `Item` 属性获取或设置与指定键关联的值。该属性作为 `TKey` 的索引器工作并返回\
  \ `TValue`。`ConcurrentDictionary` 提供的最重要方法如下：\n\n*   `AddOrUpdate` — 如果键不存在，此方法将向字典添加新的键值对。如果键已存在，此方法将更新键值对。你可以使用函数根据键的现有值来生成不存在的键和/或更新现有的键；因此，此方法返回该键的新值。然而，此方法在持有锁时不会运行添加或更新委托。因此，你必须添加必要的同步代码，以确保在委托内执行的操作是线程安全的。\n\
  \n*   `GetEnumerator` — 返回一个遍历 `ConcurrentDictionary` 的枚举器。你可以并发地使用它来读取和写入字典，因为枚举器的实现是线程安全的。枚举器会暴露在你调用此方法后对\
  \ `ConcurrentDictionary` 所所的修改，因为枚举器不提供 `ConcurrentDictionary` 的快照。此方法返回一个 `IEnumerator<KeyValuePair<TKey,\
  \ TValue>>`。\n\n*   `GetOrAdd` — 如果键不存在，此方法将向字典添加新的键值对。如果键已存在，此方法将返回其现有的值，而不添加新值。\n\
  \n*   `TryAdd` — 尝试将作为参数接收到的新键值对添加到字典。它返回一个 `bool` 值，表示操作是否成功。\n\n*   `TryGetValue`\
  \ — 尝试返回与指定键关联的值。它返回一个 `bool` 值，表示操作是否成功，并且 `out` 参数包含从字典中检索到的值。\n\n*   `TryRemove`\
  \ — 尝试移除并返回 `out` 参数中具有指定键的值。它返回一个 `bool` 值，表示操作是否成功，并且 `out` 参数包含从字典中移除的值。\n\n\
  *   `TryUpdate` — 比较作为第一个参数接收的键值与作为第三参数接收的比较值。如果它们相等，则使用作为第二个参数接收的新值更新键。\n\n![note](img/note.gif)\n\
  \n细粒度锁意味着当 `ConcurrentDictionary` 在某些操作中需要使用锁时，它只锁定它真正需要锁的部分，而不是整个字典。换句话说，只要它们访问的是受不同锁保护的字典部分，更新字典的多个请求就可以并行进行。\n\
  \n`Listing 4-11` 显示了一个 Windows Presentation Foundation (WPF) 应用程序的代码，该程序定义了一个名为\
  \ `RectangleInfo` 的新类并实现了 `IEqualityComparer`。它定义了以下与矩形相关的属性：\n\n*   `Name` — 作为字典的键。此属性具有私有的\
  \ `set`，因为你将在哈希码中使用它。你不希望在哈希码生成后还能能够更改它的值。\n\n*   `Location` — 矩形的位置。\n*   `Size`\
  \ — 矩形的大小。\n*   `LastUpdate` — 此矩形值最后更新的时间。\n*   `UpdatedTimes` — 跟踪实例值更新的次数。\n\n\
  ![download](img/download.gif)\n\n###  4-11: 为 ConcurrentDictionary 并行添加、比较和更新值\n\
  \n```csharp\npublic partial class MainWindow : Window\n{\n    public MainWindow()\n\
  \    {\n        InitializeComponent();\n    }\n    private ConcurrentDictionary<string,\
  \ RectangleInfo> _anglesDict;\n    private const int MAX_RECTLES = 200;\n    private\
  \ void Generateangles()\n    {\n        Parallel.For(1, MAX_RECTLES + 1, (i) =>\n\
  \        {\n            for (int j = 0; j < 50; j++)\n            {\n          \
  \      var newKey = String.Format(\"Rectangle {0}\", i % 50);\n                var\
  \ newRect = new RectangleInfo(\n                    String.Format(\"Rectangle {0}\"\
  , i),\n                    new Point(j, j * i),\n                    new Size(j\
  \ * i, i / 2));\n                _anglesDict.AddOrUpdate(\n                    newKey,\n\
  \                    newRect,\n                    (key, existingRect) =>\n    \
  \                {\n                        // 键已存在\n                        if\
  \ (existingRect != newRect)\n                        {\n                       \
  \     // 矩形不同\n                            // 有必要\n                            //\
  \ 更新现有的矩形\n                            // AddOrUpdate 在持有\n                    \
  \        // 锁时不会运行\n                            // 添加或更新委托\n                   \
  \         // 在调用 Update\n                            // 方法之前锁定 existingRect\n  \
  \                          lock (existingRect)\n                            {\n\
  \                                // 在关键区域内调用\n                                //\
  \ Update 方法\n                                existingRect.Update(\n            \
  \                        newRect.Location, newRect.Size);\n                    \
  \        }\n                        }\n                        return existingRect;\n\
  \                    }\n                    // 矩形相同\n                    // 不需要更新现有的\n\
  \                    return existingRect;\n                    }});\n          \
  \  }\n        });\n    }\n}\n```\n\n\n\n\n\n```csharp\nprivate void butTest_Click(object\
  \ sender, RoutedEventArgs e)\n{\n    var sw = Stopwatch.StartNew();\n    _rectanglesDict\
  \ =\n        new ConcurrentDictionary<string, RectangleInfo>();\n    GenerateRectangles();\n\
  \    foreach (var keyValuePair in _rectanglesDict)\n    {\n        listRectangles.Items.Add(\n\
  \            String.Format(\"{0}, {1}. Updated {2} times.\",\n            keyValuePair.Key,\
  \ keyValuePair.Value.Size,\n            keyValuePair.Value.UpdatedTimes));\n   \
  \ }\n    Debug.WriteLine(sw.Elapsed.ToString());\n}\n```\n\nclass RectangleInfo\
  \ : IEqualityComparer<RectangleInfo>\n{\n    // Name 属性具有私有 setter，因为你在哈希码中使用了它\n\
  \    // 你不希望更改 Name\n    // 如果更改了名称，你可能永远无法\n    // 在字典中再次找到该对象\n    public string\
  \ Name { get; private set; }\n    public Point Location { get; set; }\n    public\
  \ Size Size { get; set; }\n    public DateTime LastUpdate { get; set; }\n    public\
  \ int UpdatedTimes { get; private set; }\n    public RectangleInfo(string name,\
  \ Point location, Size size)\n    {\n        Name = name;\n        Location = location;\n\
  \        Size = size;\n        LastUpdate = DateTime.Now;\n        UpdatedTimes\
  \ = 0;\n    }\n\n    public RectangleInfo(string key)\n    {\n        Name = key;\n\
  \        Location = new Point();\n        Size = new Size();\n        LastUpdate\
  \ = DateTime.Now;\n        UpdatedTimes = 0;\n    }\n\n    public void Update(Point\
  \ location, Size size)\n    {\n        Location = location;\n        Size = size;\n\
  \        UpdatedTimes++;\n    }\n\n    public bool Equals(RectangleInfo rectA, RectangleInfo\
  \ rectB)\n    {\n        return\n            (rectA.Name == rectB.Name) &&\n   \
  \         (rectA.Size == rectB.Size) &&\n            (rectA.Location == rectB.Location);\n\
  \    }\n\n    public int GetHashCode(RectangleInfo obj)\n    {\n        RectangleInfo\
  \ rectInfo = (RectangleInfo)obj;\n        return rectInfo.Name.GetHashCode();\n\
  \    }\n}\n```\n\n`RectangleInfo` 提供了两个构造函数：一个初始化实例的所有属性，另一个仅接收矩形的名称作为键。`Update`\
  \ 方法允许你为 `Location` 和 `Size` 分别分配新值，并会递增 `UpdatedTimes` 属性。然后，它实现了以下 `IEqualityComparer`\
  \ 方法：\n\n- `Equals`：返回一个布尔值（`bool`），指示两个对象是否相等。在这种情况下，它比较了 `Name`、`Size` 和 `Location`。\n\
  - `GetHashCode`：返回对象的哈希码。在这种情况下，它返回 `Name` 值的哈希码。\n\n该代码需要添加以下 `using` 语句才能运行。此代码未包含\
  \ WPF 程序的默认值：\n\n```csharp\n// 为 Stopwatch 添加\nusing System.Diagnostics;\n// 为 Tasks\
  \ 添加\nusing System.Threading.Tasks;\n// 为 并发集合 添加\nusing System.Collections.Concurrent;\n\
  ```\n\n`Main` 方法在私有变量 `_rectanglesDict` 中创建了一个新的 `ConcurrentDictionary<string, RectangleInfo>`。然后，它调用了\
  \ `GenerateRectangles` 方法。该方法内部运行了一个带有顺序循环的 `Parallel.For`。并行循环运行 `MAX_RECTANGLES`\
  \ 次，而内部的顺序循环运行 50 次。代码添加了一个新的 `RectangleInfo` 实例，然后对其更新了 199 次。它调用了并发字典 `_rectanglesDict`\
  \ 的 `AddOrUpdate` 方法。在内层循环中第一次执行时，键不存在，因此字典添加了新的键值对。\n\n然而，在接下来的 199 次中，键已经存在，因此\
  \ `AddOrUpdate` 第三个参数中提供的委托代码将被执行。这段代码比较了矩形，比较结果将由 `RectangleInfo` 类中定义的 `Equals`\
  \ 方法进行评估。如果矩形不同，委托程序将调用现有矩形的 `Update` 方法（该矩形作为委托的第二个参数 `existingRect` 接收），并返回此更新后的实例。然而，委托在持有锁的情况下运行；因此，必须获取对\
  \ `existingRect` 的独占访问，执行 `Update` 方法，然后释放锁。代码使用 `lock` 关键字来确保一次只有一个线程会为 `existingRect`\
  \ 引用的 `RectangleInfo` 执行 `Update` 方法。第 5 章“协调数据结构”详细分析了锁。\n\n`AddOrUpdate` 方法简化了当键已存在时运行代码的执行。`Parallel.For`\
  \ 将运行许多任务来并发更新许多不同的键。`Main` 子程序将键、大小以及 `RectangleInfo` 实例被更新的次数添加到 `listRectangles`\
  \ ListBox 中。这是运行列表 4-11 所示代码的结果，其中所有 `RectangleInfo` 实例都更新了 199 次，且其中许多操作是并发执行的。\n\
  \n# 总结\n\n本章通过提供五个新类和一个新接口的使用示例，介绍了新的 .NET Framework 4 并发集合。本章介绍了许多并发集合，并展示了在使用它们时会遇到的一些问题。然后，你通过利用新并发集合发现的额外功能改进了原始示例。总结本章如下：\n\
  \n- 你可以在 `System.Collections.Concurrent` 命名空间中找到许多新类。\n- 当你需要从多个任务或线程插入或删除项时，可以使用这些并发集合。\n\
  - 当你需要实现生产者-消费者场景时，可以使用 `BlockingCollection<T>`。\n- 你可以使用并发集合设计并优化流水线。\n- 你可以使用\
  \ `BlockingCollection<T>` 提供的阻塞和边界功能来避免必要的自旋。\n- 你可以将实现 `IProducerConsumerCollection<T>`\
  \ 的并发集合类型封装在 `BlockingCollection<T>` 中。\n\n# 第 5 章：协调数据结构\n\n### 本章内容\n\n- 理解轻量级协调数据结构\n\
  - 使用轻量级同步变为\n- 根据你的需求选择最合适的同步变为\n- 使用屏障（Barrier）同步并发任务\n- 结合超时和取消令牌使用同步变为\n- 使用互斥锁和关键区域\n\
  - 重构代码以避免使用锁\n- 使用自旋等待\n- 理解自旋和让出\n- 使用轻量级手动重置事件\n- 使用信号量限制访问访问的并发性\n- 理解并防止同步相关的错误\n\
  - 使用原子操作\n\n\n\n\n\n图 5-1 显示了单车道中的一辆车。有三面黑旗和两面灰旗。汽车必须数出路线中发现的黑旗和灰旗总数。汽车运行一个使用两个全局变量的算法：一个用于存储黑旗计数，另一个用于存储灰旗计数。这里没有并发情况，因为单车道上只有一辆车。\n\
  \n图 5-1\n\n![5.1](img/c05f001.jpg)\n\n单车道中的汽车代表了在编写代码时没有考虑并发的典型情况。如果再增加另一条车道和一辆新车会发生什么？\n\
  \n## 不良的副作用\n\n图 5-2 显示了两辆车、两条车道以及位于车道中间相同的灰旗和黑旗。两辆车的任务是统计赛道上唯一旗帜的数量。两辆车共享两个存储黑旗计数和灰旗计数的全局变量。正确的计数是三面黑旗和两面灰旗。然而，由于它们运行之前的算法并共享这两个全局变量，将产生不准确的计数。这些变量的总值黑旗将是六而不是三个，灰旗将是四个而不是两个。\n\
  \n图 5-2\n\n![5.2](img/c05f002.jpg)\n\n该代码是为了顺序执行编写的，而不是并发执行。由于你通过使用两辆车而不是一辆车来引入并发，你正在使用为顺序执行设计的代码在并发执行环境下运行（即在两条独立的车道上运行两辆车）。因此，由于编写代码时没有考虑并发，每辆车都会增加共享全局变量的值。由于你引入了并发，共享全局变量的值是错误的。在两个并发车道上运行为顺序执行设计的代码并使用汽车，会产生不良的副作用。该算法无法提供正确性。当你增加一辆新车时，结果是错误的，因为它没有代表每种颜色旗帜的真实总量。\n\
  \n## 竞态条件\n\n你设计的另一种在某些并发场景下仍会产生意之外结果的算法是：两辆车共享两个用于存储黑旗计数和灰旗计数的全局变量。在这种情况下，每辆车分别进行计数，并通过无线电通知它们的维修站头来并移除旗帜。由于每辆车现在都在增加相应变量后请求移除每面旗帜，你可能认为这种新算法不会产生不良副作用并能确保正确性。\n\
  \n然而，在其中一次执行中，两辆车同时到达第二面黑旗。两辆车都增加了其本地黑旗计数，并无线电通知它们的维修站头来移除旗帜。图 5-3 显示了两辆车同时到达旗帜时的这种情况。\n\
  \n图 5-3\n\n![5.3](img/c05f003.jpg)\n\n你再次运行应用程序。这次，两辆车同时到达第二面灰旗。两辆车都增加了其本地灰旗计数，并无线电通知它们的维修站头来并移除旗帜。图\
  \ 5-4 显示了两辆车同时到达旗帜时的这种情况。结果与之前的执行不同，且再次是错误的。你遇到了另一个竞态条件，该算法无法提供正确性。\n\n图 5-4\n\n\
  ![5.4](img/c05f004.jpg)![note](img/note.gif)\n\n当许多并发任务在没有适当同步机制的情况下对同一个变量进行读取和写入时，可能会出现竞态条件。这是一个正确性问题。错误的、并行化的代码在某些并发执行场景下可能会产生错误的结果。然而，在某些情况下执行，它可以产生预期的结果，因为竞态条件可能不会显。考虑以下情况：任务\
  \ `t1` 读取公共变量 `A` 的值 `50`，然后更新为增加一的值 `51`。同时，任务 `t2` 读取公共变量 `A` 的原始值 `50`，然后更新为增加一的值\
  \ `51`。公共变量 `A` 的最终值应该是 `52` 而不是 `51`。初始值为 `50`，有两次加法操作。随后，当任务 `t1` 读取公共变量 `A` 的值时，读到的不是\
  \ `52`，而是错误的值 `51`。\n\n## 锁锁\n\n图 5-5 显示了两辆车、两条车道以及两个全局变量：一个存储黑旗总和，另一个存储灰旗总和。新算法让每辆车都从不同的位置开始赛程。此外，它使用锁来确保每辆车对需要增加的变量具有排他访问权。然而，这种使用锁的方法错误的，因为它会导致两辆车无限等待。\n\
  \n图 5-5\n\n![5.5](img/c05f005.jpg)\n\n新算法试图解决之前说明的竞态条件，但它产生了死锁情况。汽车 #0 锁定了灰旗计数且没有释放。因此，汽车\
  \ #0 对灰旗计数拥有排他访问权，而汽车 #1 在变量被锁定时无法增加它。汽车 #1 锁定了黑旗计数并增加了该变量的值。然而，它没有释放锁。然后，汽车 #0\
  \ 到达黑旗并等待获取被汽车 #1 锁定的灰旗计数。\n\n在这个例子中，问题很容易解决，因为在增加操作发生后释放锁。然而，还有其他避免锁的可能性。\n\n##\
  \ 使用原子操作的无锁算法\n\n汽车可以利用原子操作避免死锁和竞态条件。本书在“使用原子操作”部分深入探讨原子操作。然而，这个示例向你介绍了一个不使用代码的抽象场景。\n\
  \n另一种简单且安全的方案是将旗帜分布在两条车道之间，并使用原子操作增加车道间的共享变量。图 5-6 显示了源数据（黑旗和灰旗）的新分区方案的结果。\n\n图\
  \ 5-6\n\n![5.6](img/c05f006.jpg)\n\n现在，每辆车都分配了一些需要计数的旗帜。然而，仍然有两个全局变量：一个存储黑旗总和，另一个存储灰总和。每辆车通过原子操作增加相应的共享变量——即所有操作被视为一个单元。每辆车增加相应的变量，并将结果存储为一个完全成功或完全失败的单一操作。如果失败，变量将保持在尝试增加之前的状态。\n\
  \n如果两辆车同时调用原子操作增加同一个共享变量，这两个操作将作为两个串行增加操作执行，一个接一个。因此，新算法没有竞态条件的风险。不需要担心死锁，因为算法不使用锁，而是依赖原子操作。\n\
  \n\n\n\n在此示例中，汽车使用了线程安全的原子操作，来增加由多个线程（车道）共享的变量。\n\n## 带有本地存储的无锁算法\n\n该算法的另一个版本可以利用数据分区方案，将标志分布在两条车道中。在这个示例中，每个车道使用两个局部变量来存储部分结果。然后，当两辆汽车都到达车道末端时，通过一个顺序执行的最终和来确定每种颜色标志的总数。这个最终和是线程安全的，因为它在单线程中运行，并带有每辆汽车计算出的值。图\
  \ 5-7 显示该算法如何配合汽车和车道工作。\n\n图 5-7\n\n![5.7](img/c05f007.jpg)\n\n这种无锁算法对源数据进行分区，并为每个车道使用本地存储工作。它需要更多的内存，因为它使用了更多的变量来产生相同的结果。然而，在计算最终和之前，两辆汽车之间是相互独立的。因此，不需要使用锁或原子操作来增加持有标志计数器的变量。这不存在产生竞态态的风险，也不需要担心死锁。\n\
  \n在之前的示例中，当汽车使用共享变量时，它们使用原子操作来增加该变量的值。在当前示例中，它们使用本地存储来避免处理共享变量时所需的同步或原子性。然而，末尾有一段串行代码必须执行最终求和。这段代码将限制可扩展性。事实上，这总是存在权衡。\n\
  \n![note](img/note.gif)\n\n前面的示例的目标是帮助你理解与并发代码和并行算法相关的某些复杂主题的本质。后续章节提供了代码示例，用于同步并发任务执行的工作的各种替代方案，并避免上述的噩梦情况、非预期的副作用、竞态条件和死锁。\n\
  \n# 理解新的同步机制\n\n.NET Framework 4 为并行编程提供了许多新的数据结构，简化了许多复杂的同步问题，包括以下内容：\n\n*   并发集合类\n\
  *   轻量级同步原语\n*   用于延迟初始化的类型\n\n你已经在上一章节中学习了新的并发集合类提供的功能。因此，当你需要在并发运行的代码中从支持的集合类型之一添加和或删除元素时，可以使用这些专门的并发集合来避免添加显式的同步代码。后台仍在进行同步，其程度不同，取决于所使用的集合。\n\
  \n然而，有时你必须访问尚未为并发访问做好准备的变量、实例、方法、属性或结构体。或者，你可能需要执行必须独立运行的代码部分，但你无法拆分任务以便它们独立工作。当任务和线程访问共享数据和资源时，你必须添加显式同步或使用原子操作或锁。对于互斥和等待有很多选项，你必须为每种场景选择最合适的一个。\n\
  \n![note](img/note.gif)\n\n只要可能，尝试以这种方式分解问题，使同步成为隐式的而不是显式的。如果你可以拆分任务以便它们独立工作，你就能避免添加显式同步，你的代码将更高效且具扩展性。然而，你还必须确保代码提供正确性保证，正如第\
  \ 1 章“基于任务的编程”中所解释的那样。显式同步、原子操作和锁总是会增加开销、消耗处理器时间并降低可扩展性。如果你能避免它们，将能够获得更好的速度提升。隐式同步也会增加开销。\n\
  \n早期的 .NET Framework 版本通过其遗留的多线程模型提供了贵的锁定机制。新的数据结构实现了细粒度的并发和并行，并减少了必要的开销。因此，它们被称为轻量级同步原语。它们经过调整，为关键场景提供更快的性能，因为它们避免了昂贵的锁定机制。然而，当你在等待时间不短的情况下这些新原语时，它们会增加不必要的开销。其中一些新原语在之前的\
  \ .NET Framework 版本中并没有。\n\n当你设计并行算法时，你是了解显式同步需求以及代码运行常见方式的专家。.NET Framework 4 并不包含算命能力。因此，如果你需要特定的执行顺序，可以为此添加显式同步。然而，每只要可能，你应该利用延续，正如第\
  \ 3 章“命令式任务并行”中所解释的那样。\n\n此外，通过推迟对象的创建直到第一次使用它们，你可以提高并行代码的性能，减少其内存需求并避免浪费计算。再次，因为你是最了解代码运行常见方式的人，你可以将这种知识与新的延迟初始化类型结合起来，以改进你的并行算法。第\
  \ 10 章“并行测试与调优”解释了如何使用延迟初始化。\n\n## 使用同步原语\n\n.NET Framework 4 在现有的 `System.Threading`\
  \ 命名空间提供了六种新的轻量级同步原语。此命名空间提供了对遗留多线程类、类型和枚举的访问，但也提供了与新的基于任务的编程模型某些场景密切相关的新类型。以下列表提供了新轻量级同步类型的简要介绍：\n\
  \n*   `Barrier` — 允许多个任务在多个阶段同步它们的并发工作。\n*   `CountdownEvent` — 简化分支合并（fork and\
  \ join）场景。它代表一种非常轻量级的同步原语，当计数达到 0 时发出信号。新的基于任务的编程模型通过 `Task` 实例、延续和 `Parallel.Invoke`\
  \ 提供了更简单的方法来实现分支并行。然而，`CountdownEvent` 对于任务仍然有用。使用 `Task.WaitAll` 或 `TaskFactory.ContinueWhenAll`\
  \ 方法需要一个包含所有待等待 `Task` 实例的数组。`CountdownEvent` 不需要对象引用，可以用于跟踪动态数量的任务。\n*   `ManualResetEventSlim`\
  \ — 允许许多任务等待事件句柄被另一个任务手动信号。当你预计等待时间很短时，它比其重量级的等价物 `ManualResetEvent` 提供更好的性能。\n\
  *   `SemaphoreSlim` — 允许限制并发访问资源或资源池的任务数量。当你预计等待时间很短时，它比其重量级的等价物 `Semaphore` 提供更好的性能。\n\
  \n\n\n\n- `SpinLock` — 允许任务自旋直到获取到互斥锁，这确保了同一时间只有一个任务可以访问被锁定的变量、对象或区域。当你预计等待细粒度锁的时间非常非常短，并且关闭了\
  \ `SpinLock` 的调试功能时，它的性能可能比其他互斥锁更好。在这些情况下，你可以测试将使用 `System.Threading.Monitor` 类方法获取的锁替换为\
  \ `SpinLock` 锁。此外，`SpinLock` 是一个 `struct`（结构体），如果你需要大量的锁并且/或需要尽可能地减少对象分配，使用它可以减少内存需求和垃圾回收压力。![note](img/note.gif)\n\
  \n在循环中等待的过程被称为自旋（spinning）。当一个任务自旋直到获取到互斥锁时，意味着它在循环中等待，反复检查直到锁变得可用。这种忙等（busy waiting）既有优点也有缺点。下一节将分析每个依赖自旋的同步原语。\n\
  \n- `SpinWait` — 允许任务执行基于自旋的等待，直到满足特定条件。例如，高层算法可能会使用 `SpinWait` 指定超时时间来创建一个“先自旋后等待”的条件。这种算法被称为两阶段等待操作，其中如果基于自旋的等待花费了特定时间自旋且条件未满足，它将进入基于内核的等待。这对于在满足某些条件的任务中运行代码，且任务没有与延续（continuations）链接时非常有用。`SpinWait`\
  \ 本身并不提供回退到内核等待的直接支持；它只是允许实现该模式。\n\n对于 .NET Framework 早期版本中具有对应类的类，其轻量级版本仅在单个进程内有效，而重量级版本同时支持单进程和跨进程同步。\n\
  \n接下来的章节将提供上述轻量级同步类型及其与任务密切相关的重量级等效类的用法示例，以及最适用场景的详细信息。选择合适的同步原语以最小化开销是非常重要的。\n\n\
  ![note](img/note.gif)\n\nVisual Studio 2010 提供了新的并发分析功能。你可以使用这些功能来确定在特定场景下哪种同步原语提供更好的性能。例如，你可以测试经典的\
  \ `Monitor` 锁与关闭了调试功能的 `SpinLock` 的对比。此外，你还可以测试另一个使用原子操作的算法版本。第 10 章“并行测试与调优”解释了许多工具和技术，帮助你在后续示例所解释的各种选项中选择最合适的同步原语。\n\
  \n## 使用 Barrier 同步并发任务\n\n当你需要一组任务并行运行一系列阶段，但每个新阶段必须在所有其他任务完成上一个阶段后开始时，你可以使用 `Barrier`\
  \ 类的实例来同步这种协作工作。由于每个阶段都需要任务之间的同步，`Barrier` 对象防止单个任务继续执行，直到所有任务到达 `Barrier`。组中的每个任务被称为参与者（participant）——它在每个给定的阶段信号其到达\
  \ `Barrier`，并在继续之前隐式地等待所有其他参与者也信号到达。你可以对多个阶段使用同一个 `Barrier` 实例。\n\n考虑图 5-8 所示的五个阶段：\n\
  \n* `CreatePlanets`\n* `CreateStars`\n* `CheckCollisionsBetweenPlanets`\n* `CheckCollisionsBetweenStars`\n\
  * `RenderCollisions`\n\n图 5-8\n\n![5.8](img/c05f008.jpg)\n\n你可以将每个阶段完成的工作拆分为许多任务。例如，四个任务可以运行\
  \ `CreatePlanets`，但下一个阶段 `CreateStars` 要求 `CreatePlanets` 的所有数据都可用。因此，在所有参与者完成运行\
  \ `CreatePlanets` 的代码之前，这些任务无法开始运行 `CreateStars`。\n\n定义任务延续并利用 `Task.Factory.ContinueWhenAll`\
  \ 方法编写一个委托可能的，在之前的任务完成执行后启动另外四个新任务来运行每个新阶段。然而，由于五个阶段必须运行 10 次，这种技术会因为大量的链式任务而产生巨大的开销。每运行一次五个阶段，代码都会五个阶段的每个阶段创建四个新任务，因此会创建\
  \ 20 个 `Task` 实例。因为五个阶段要运行 10 次，代码将创建 200 个 `Task` 实例。如果每个阶段运行时间很短，创建这么多任务带来的额外开销将降低代码的性能和可扩展性。你需要衡量这种开销与使用\
  \ `Barrier`（更容易表达所需的同步）所引入的开销。\n\n在这种情况下，更好的想法是创建四个任务，并使用 `Barrier` 类提供的功能在开始运行每个新阶段的代码之前定义屏障。这样，这四个\
  \ `Task` 实例就能以较少的开销运行 10 次五个同步阶段。\n\n代码列表 5-1 显示了使用 `Barrier` 实例来协调运行上述五个阶段的任务组之间工作的示例。\n\
  \n![download](img/download.gif)\n\n代码列表 5-1: 使用屏障同步具有多个阶段的多个任务中的代码\n\n```csharp\n\
  static void CreatePlanets(int participantNum)\n{\n    Console.WriteLine(\"Creating\
  \ planets {0}\", participantNum);\n}\nstatic void CreateStars(int participantNum)\n\
  {\n    Console.WriteLine(\"Creating stars {0}\", participantNum);\n}\nstatic void\
  \ CheckCollisionsBetweenPlanets(int participantNum)\n{\n    Console.WriteLine(\"\
  Checking collisions between planets {0}\", participantNum);\n}\nstatic void CheckCollisionsBetweenStars(int\
  \ participantNum)\n{\n    Console.WriteLine(\"Checking collisions between stars\
  \ {0}\", participantNum);\n}\nstatic void RenderCollisions(int participantNum)\n\
  {\n    Console.WriteLine(\"Rendering collisions {0}\", participantNum);\n}\nstatic\
  \ int _participants = Environment.ProcessorCount;\nstatic Task[] _tasks;\nstatic\
  \ Barrier _barrier;\nstatic void Main(string[] args)\n{\n    _tasks = new Task[_participants];\n\
  \    _barrier = new Barrier(_participants, (barrier) =>\n    {\n        Console.WriteLine(\"\
  Current phase: {0}\", barrier.CurrentPhaseNumber);\n    });\n    for (int i = 0;\
  \ i < _participants; i++)\n    {\n        _tasks[i] = Task.Factory.StartNew((num)\
  \ =>\n        {\n            var participantNumber = (int)num;\n            for\
  \ (int j = 0; j < 10; j++)\n            {\n                CreatePlanets(participantNumber);\n\
  \                _barrier.SignalAndWait();\n                CreateStars(participantNumber);\n\
  \                _barrier.SignalAndWait();\n                CheckCollisionsBetweenPlanets(participantNumber);\n\
  \                _barrier.SignalAndWait();\n                CheckCollisionsBetweenStars(participantNumber);\n\
  \                _barrier.SignalAndWait();\n                RenderCollisions(participantNumber);\n\
  \                _barrier.SignalAndWait();\n            }\n        }, i);\n    }\n\
  \    var finalTask = Task.Factory.ContinueWhenAll(_tasks, (tasks) =>\n{\n    //\
  \ 等待所有任务以确保\n});\n```\n\n\n\n\n\n```csharp\n// 传播在任何一个 任务（tasks）\n// 中发生的任何异常\n\
  Task.WaitAll(_tasks);\nConsole.WriteLine(\n    \"所有阶段已执行完毕.\");\n// 释放 Barrier 实例\n\
  _barrier.Dispose();\n\n});\n\n// 等待 finalTask 完成\nfinalTask.Wait();\nConsole.ReadLine();\n\
  ```\n\n存储在私有变量 `_participants` 中的参与者数量等于可用逻辑核心的数量。列表 5-1 以及后续章节中的示例假设包含了以下两个 `using`\
  \ 语句：\n\n![下载](img/download.gif)\n\n```csharp\nusing System.Threading;\nusing System.Threading.Tasks;\n\
  ```\n\n来自列表 5_1 的代码片段\n\n`_barrier` 私有变量存储了一个 `Barrier` 实例。该代码使用其 `_participants`\
  \ 构造函数接收初始参与者的数量，并使用一个 `System.Action<Barrier>` 在每个阶段后执行操作。每当屏障接收到所有参与者的到达信号时，它就会增加其阶段数，运行在构造函数中指定的动作，并释放每个参与者的\
  \ `Task` 实例。通过这样，参与者能够继续执行代码。屏障当前阶段的数字可以通过其只读属性 `CurrentPhaseNumber` 获取。因此，当每个阶段演进时，作为屏障构造函数第二个参数指定的动作将显示该阶段的数字。在阶段后操作运行之后，`CurrentPhaseNumber`\
  \ 会增加其值以表示将运行的新阶段。委托程序通过其 `barrier` 参数接收 `Barrier` 实例，如下所示：\n\n```csharp\n_barrier\
  \ = new Barrier(_participants, (barrier) => {\n    Console.WriteLine(\"当前阶段: {0}\"\
  , barrier.CurrentPhaseNumber);\n});\n```\n\n列表 5-1 中代表每个阶段的五个方法的代码仅在控制台上显示文本，以保持简单并专注于屏障的效果。然而，每个参与者运行每个阶段代码所需的时间可能有所不同。图\
  \ 5-9 显示了一个具有四个参与者的效果示例，它们运行每个阶段所需的时间各异。许多参与者将必须等待其他参与者发出到达信号。此图表还显示了阶段后操作的运行时间以及\
  \ `CurrentPhaseNumber` 只读属性的值。\n\n图 5-9\n\n![5.9](img/c05f009.jpg)\n\n每个参与者运行一个循环，执行\
  \ 10 次这 5 个阶段。在每个代表阶段的方法运行完毕后，它会如下所示调用 `_barrier.SignalAndWait()` 方法：\n\n```csharp\n\
  CreatePlanets(participantNumber);\n_barrier.SignalAndWait();\n\nCreateStars(participantNumber);\n\
  _barrier.SignalAndWait();\n\nCheckCollisionsBetweenPlanets(participantNumber);\n\
  _barrier.SignalAndWait();\n\nCheckCollisionsBetweenStars(participantNumber);\n_barrier.SignalAndWait();\n\
  \nRenderCollisions(participantNumber);\n_barrier.SignalAndWait();\n```\n\n此方法指示一个参与者已到达屏障，并开始等待所有其他参与者也到达屏障。当前任务将保持等待，直到所有其他参与者都调用此屏障的\
  \ `SignalAndWait` 方法。没有必要添加额外的同步处理来调用此方法，因为它已经准备好被并发调用。\n\n屏障的 `ParticipantCount`\
  \ 只读属性存储了必须向屏障发出到达信号的参与者数量。此外，其他任务可以访问其 `ParticipantsRemaining` 只读属性来获取尚未向屏障发出到达信号的参与者数量。每当新阶段开始时，该属性将具有\
  \ `ParticipantCount` 的值，并在参与者每次调用 `SignalAndWait` 方法时递减 1。在启动新阶段之前，屏障将运行阶段后操作的代码。正如之前在\
  \ 图 5-9 中所示，当运行阶段后操作的委托执行时，屏障的 `CurrentPhaseNumber` 属性将具有最近完成阶段的值，而不是新阶段的数字。\n\n\
  \n\n\n\n## 在所有参与任务中捕异常\n\n如果屏障后阶段操作（post-phase action）中的代码抛出异常，它将被封装在一个 `BarrierPostPhaseException`\
  \ 中，所有参与的任务或线程都能捕获它。原始异常可以通过 `BarrierPostPhaseException` 实例的 `InnerException` 属性获取。\n\
  \n以下几行显示了列表 5-1 中所示 `Main` 方法第一部分的新版本，它在屏障完成第 10 个阶段时会抛出一个 `InvalidOperationException`。运行第\
  \ 10 个阶段的 `SignalAndWait` 方法调用包含在一个 `try…catch` 块中。该块在 `bppex` 中捕获了 `BarrierPostPhaseException`。这样，当所有参与者都发送信号表示一个阶段已完成，且后阶段操作运行并确定阶段号为\
  \ 10 时，代码将显示原始异常的消息值 `bppex.InnerException.Message` 并退出 for 循环。因此，参与者将不会继续运行屏障中后续阶段的代码。\n\
  \n![download](img/download.gif)\n\n```c\nstatic void Main(string[] args)\n{\n  \
  \  _tasks = new Task[_participants];\n    _barrier = new Barrier(_participants,\
  \ (barrier) =>\n    {\n        Console.WriteLine(\"Current phase: {0}\", \n    \
  \        barrier.CurrentPhaseNumber);\n        if (barrier.CurrentPhaseNumber ==\
  \ 10)\n        {\n            throw new InvalidOperationException(\n           \
  \   \"No more phases allowed.\");\n        }\n    });\n    for (int i = 0; i < _participants;\
  \ i++)\n    {\n        _tasks[i] = Task.Factory.StartNew((num) =>\n        {\n \
  \           var participantNumber = (int)num;\n            for (int j = 0; j < 10;\
  \ j++)\n            {\n                CreatePlanets(participantNumber);\n     \
  \           try\n                {\n                    _barrier.SignalAndWait();\n\
  \                }\n                catch (BarrierPostPhaseException bppex)\n  \
  \              {\n                    Console.WriteLine(\n                     \
  \   \"{0}\", bppex.InnerException.Message);\n                    // Exit the for\
  \ loop\n                    break;\n                }\n                CreateStars(participantNumber);\n\
  \                _barrier.SignalAndWait();\n                CheckCollisionsBetweenPlanets(participantNumber);\n\
  \                _barrier.SignalAndWait();\n                CheckCollisionsBetweenStars(participantNumber);\n\
  \                _barrier.SignalAndWait();\n                RenderCollisions(participantNumber);\n\
  \                _barrier.SignalAndWait();\n            }\n        }, i);\n    }\n\
  }\n```\n代码段来自 Snippet_1\n\n![note](img/note.gif)\n\n你可以使用这种在后阶段操作中抛出异常的方法来向所有捕获该异常的参与者传递信息。参与者随后可以通过检查其\
  \ `InnerException` 属性来确定异常类型，并据此做出决策。然而，请记住抛出异常的开销很大；如果你需要频繁通信，可能希望使用其他的协调机制。\n\n\
  ## 使用超时处理\n\n屏障的问题之一是有许多任务在等待其他参与者发送到达信号，如果一个或多个参与者没有发送到达信号，其他任务将永远等待下去。为了更好地理解这种情况，请尝试用以下代码替换列表\
  \ 5-1 所示的 `CreatePlanets` 方法：\n\n![download](img/download.gif)\n\n```csharp\nstatic\
  \ void CreatePlanets(int participantNum)\n{\n    Console.WriteLine(\"Creating planets.\
  \ Participant #{0}\", participantNum);\n    if (participantNum == 0)\n    {\n  \
  \      // 自旋直到没有剩余的参与者\n        // 对于当前阶段\n        // 该条件在循环中运行（自旋）是非常低效的\n    \
  \    // 此示例出于教学目的使用了这种自旋\n        // 这最佳实践\n        SpinWait.SpinUntil(() => _barrier.ParticipantsRemaining\
  \ == 0));\n    }\n}\n```\n代码段来自 Snippet_2\n\n运行第一个阶段的任务任务（参与者 #0）将一直等待直到屏障的 `ParticipantsRemaining`\
  \ 属性达到 0。`CreatePlanets` 使用 `SpinWait.SpinUntil` 方法自旋直到条件为真。然而，这个条件永远不会成立，因为等待 `ParticipantsRemaining`\
  \ 达到 0 的参与者永远不会完成 `CreatePlanets` 方法的执行；因此，其任务将无法到达向屏障发送到达信号的代码。以下行显示了用四个核心运行代码的结果：\n\
  \nCreating planets. Participant #2\nCreating planets. Participant #3\nCreating planets.\
  \ Participant #0\nCreating planets. Participant #1\n\n应用程序没有运行后阶段操作，因为它从未完成第一个屏障的阶段。如果你使用“全部中断”命令停止执行，并通过选择\
  \ 调试 → 窗口 → 并行任务来显示并行任务窗口，所有参与屏障的任务状态都将是“等待”（Waiting），如图图 5-10](#9781118029770c05.xhtml_c05_fig_0010）所示。这样做的问题是它们将永远等待下去。在某些情况下，你可能会看到运行\
  \ `CreatePlanets` 方法的任务其 `participantNum` 等于 0，在 `SpinWait.SpinUntil` 行处于自旋状态，这取决于你由于内部使用的自旋或睡眠，还是你捕获了运行代码。\n\
  \n图 5-10\n\n![5.10](img/c05f010.jpg)\n\n正如前面的示例所示，建立超时防止任务在没有任何限制的情况下阻塞非常重要。因此，你可以使用接受等待毫秒数的\
  \ `SignalAndWait` 方法。该方法返回一个 `bool` 值，指示所有参与者是否在指定时间内到达了屏障。以下代码显示了 `Main` 方法的新版本，它使用超时和\
  \ `CancellationToken` 以在一个或多个参与者出现问题时故障并取消任务：\n\n![download](img/download.gif)\n\
  \n```c\n// 2000 毫秒 = 2 秒超时\nprivate const int TIMEOUT = 2000;\n\nprivate static\
  \ void CreatePlanets(int participantNum)\n{\n    Console.WriteLine(\n        \"\
  Creating planets. Participant #{0}\",\n        participantNum);\n    if (participantNum\
  \ == 0)\n    {\n        // 自旋直到没有剩余的参与者\n        // 对于当前阶段\n        // 该条件在循环中运行（自旋）是非常低效的\n\
  \        // 此示例出于教学目的使用了这种自旋\n        // 这最佳实践\n        SpinWait.SpinUntil(() =>\
  \ _barrier.ParticipantsRemaining == 0));\n    }\n}\n\nstatic void Main(string[]\
  \ args)\n{\n    var cts = new System.Threading.CancellationTokenSource();\n    var\
  \ ct = cts.Token;\n    _tasks = new Task[_participants];\n    _barrier = new Barrier(_participants,\
  \ (barrier) =>\n    {\n        Console.WriteLine(\"Current phase: {0}\", barrier.CurrentPhaseNumber);\n\
