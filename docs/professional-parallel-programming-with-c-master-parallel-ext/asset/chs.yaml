  \ FAQ，请点击任何 P2P 页面上的 `FAQ` 链接。\n\n# 第 1 章：基于任务的编程\n\n### 本章内容包括：\n\n* 与共享内存多核协作\n\
  * 理解共享内存多核与分布式内存系统之间的区别\n* 在共享内存架构中进行并行编程和多核编程\n* 理解硬件线程和软件线程\n* 理解阿姆达尔定律（Amdahl's\
  \ Law）\n* 考虑古斯塔夫定律（Gustafson's Law）\n* 使用轻量级并发模型\n* 创建成功的任务设计\n* 理解交错并发、并发与并行之间的区别\n\
  * 任务并行化并最小化关键区域\n* 理解多核架构并行编程的规则\n* 为 NUMA 架构做准备\n\n本章介绍了新的基于任务的编程，允许在应用程序中引入并行性。并行性对于利用现代共享内存多核架构至关重要。本章描述了新的轻量级并发模型以及与并发和并行相关的重要概念。它包含了必要的背景信息，为您接下来的\
  \ 10 章做好准备。\n\n# 与共享内存多核协作\n\n2005 年，Herb Sutter 在《Dr. Dobb's Journal》上发表了一篇名为《免费午餐结束了：软件向并发的根本转变》的文章（[www.gotw.ca/publications/concurrency-ddj.htm](http://www.gotw.ca/publications/concurrency-ddj.htm)）。他谈到了需要开始考虑并发来开发软件，以充分利用微处理器吞吐量的持续指数级增长。微处理器制造商正在增加处理核心数量，而不是增加时钟频率。软件开发者无法再依赖时钟频率带来的“免费午餐”式性能提升了。\n\
  \n今天大多数机器至少有一个双核微处理器。然而，具有四个核心和八个核心的四核和八核微处理器在服务器、高级工作站甚至在高端移动电脑上也非常流行。单个微处理器中更多的核心已指日可待。现代微处理器提供了新的多核架构。因此，准备好软件设计和代码以利用这些架构非常重要。使用\
  \ `Visual C# 2010` 和 `.NET Framework 4` 生成的各种应用程序运行在一个或多个中央处理器（CPU），即主微处理器上。这些微处理器中的每一个都可以具有不同数量的核心，能够执行指令。\n\
  \n您可以将多核微处理器视为在单个封装内的许多相互连接的微处理器。所有核心都可以访问主内存，如图 1-1 所示。因此，这种架构被称为共享内存多核。这种内存共享方式很容易导致性能瓶颈。\n\
  \n图 1-1\n\n![1.1](img/c01f001.jpg)\n\n多核微处理器许多许多复杂的微架构，旨在提供更多的并行执行能力、提高整体吞吐量并减少潜在瓶颈。同时，多核微处理器试图减少功耗并产生更少的热量。因此，许多现代微处理器可以根据负载增加或降低每个核心的频率，甚至可以在未使用时让核心进入睡眠。Windows\
  \ 7 和 Windows Server 2008 R2 支持一种名为 `Core Parking`（核心暂停）的新功能。当许多核心未使用且此功能处于激活状态时，这些操作系统会将剩余的核心置于睡眠状态。当需要这些核心时，操作系统会唤醒睡眠的核心。\n\
  \n现代微处理器以每个核心的动态频率工作。由于核心不是以固定频率工作，因此很难预测指令序列的性能。例如，`Intel Turbo Boost Technology`（英特睿频加速技术）增加活动核心的频率。增加核心频率的过程也被称为超频。\n\
  \n如果单个核心处于重负载下，此技术将允许它在其他核心空闲时以更高的频率运行。如果许多核心处于重负载下，它们将以较高的频率运行，但没有单核心所实现的频率那么高。微处理器无法长时间保持所有核心处于超频状态，因为这消耗更多功率且温度升高更快。在重负载下，所有核心的平均时钟频率将低于单核心所实现的频率。因此，在某些情况下，某些代码的运行频率可能比其他代码高，这使得测量真实的性能提升成为一项挑战。\n\
  \n## 共享内存多核与分布式内存系统的区别\n\n\n\n\n\n分布式内存计算机系统由许多具有各自私有内存的微处理器组成，如图 1-2 所示。每个微处理器可以位于在不同的计算机中，它们之间通过不同类型的通信通道连接。通信通道的示例包括有线和无线网络。如果运行在某个微处理器上的作业需要远程数据，它必须通过通信通道与相应的远程微处理器进行通信。用于编写在分布式内存计算机系统上运行并行应用程序的最流行的通信协议之一是消息传递接口（`MPI`）。可以使用\
  \ `C#` 和 `.NET Framework` 使用 `MPI` 来利用共享内存多核的优势。然而，`MPI` 的主要重点是帮助开发运行在集群上的应用程序。因此，它增加了巨大的开销，而这在共享内存多核系统中是没有必要的，因为所有核心都可以直接访问内存，而无需发送消息。\n\
  \n图 1-2\n\n![1.2](img/c01f002.jpg)\n\n图 1-3 显示了一个带有三台机器的分布式内存计算机系统。每台机器都有一个四核微处理器，并为这些核心提供了共享内存架构。通过这种方式，每个微处理器的私有内存充其四个核心的共享内存。\n\
  \n图 1-3\n\n![1.3](img/c01f003.jpg)\n\n分布式内存系统迫使你考虑数据的分布，因为检索远程数据的每个消息都会引入重要的延迟。由于你可以添加新机器（节点）来增加系统的微处理器数量，分布式内存系统可以提供极佳的可扩展性。\n\
  \n## 并行编程与多核编程\n\n传统的顺序代码（指令一个接一个运行）没有利用多核心的优势，因为串行指令只运行在可用核心之一上。如果使用 `Visual C#\
  \ 2010` 编写的顺序代码没有使用 `.NET Framework 4` 提供的新功能将工作分派到许多核心，它将无法利用多核心。现有的顺序代码并没有自动并行化。\n\
  \n并行编程是一种编程形式，代码利用了底层硬件提供的并行执行可能性。并行编程同时运行许多指令。如前所述，有许多不同类型的并行架构，对它们进行详细分析需要一本专门介绍该主题的著作。\n\
  \n多核编程是一种编程形式，代码利用多个执行核心来并行运行许多指令。多核计算机和多处理器计算机在单台机器中提供不止一个处理核心。因此，目标是通过通过将待处理的工作分配到可用核心中，以便在更短的时间内完成更多工作。\n\
  \n现代微处理器可以在多条数据上执行相同的指令，迈克尔·J·弗莱明（Michael J. Flynn）在 1966 年提出的弗莱明分类法将其归类为单指令多数据流（`SIMD`）。通过这种方式，你可以利用这些向量处理器来缩短执行某些算法所需的时间。\n\
  \n本书将详细详细介绍并行编程的两个领域：共享内存多核编程和向量处理能力的使用。总体目标是缩短算法的执行时间。额外的处理能力使你能够为现有软件添加新功能，例如。\n\
  \n# 理解硬件线程与软件线程\n\n多核微处理器具有多个物理核心——即真实的独立的处理单元，使其能够同时并行地运行指令。为了利用多个物理核心的优势，有必要运行许多进程或在单个进程中运行多个线程，从而创建多线程代码。\n\
  \n然而，每个物理核心可以提供多个硬件线程，也称为逻辑核心或逻辑处理器。带有 Intel 超线程技术（`HT` 或 `HTT`）的微处理器每个物理核心提供许多架构状态。例如，许多具有四个物理核心并带有\
  \ `HT` 的微处理器复制每个物理核心的架构状态并提供八个硬件线程。这种技术被称为同步多线程（`SMT`），它利用额外的架构状态来优化和增加微处理器指令级别的并行执行。`SMT`\
  \ 并不限于每个物理核心两个硬件线程；例如，你可以每个核心拥有四个硬件线程。这并不意味着每个硬件线程都代表一个物理核心。`SMT` 在某些场景下为多线程代码提供性能改进。后续章节提供了这些性能改进的多个示例。\n\
  \n`Windows` 中运行的每个程序都是一个进程。每个进程创建并运行一个或多个线程，被称为软件线程，以区别于之前解释的硬件线程。一个进程至少有一个线程，即主线程。操作系统调度器在它必须运行的所有进程和线程之间公平地分配可用处理资源。`Windows`\
  \ 调度器为每个软件线程分配处理时间。当 `Windows` 调度器在多核微处理器上运行时，它必须从物理核心支持的硬件线程分配时间给每个需要运行指令的软件线程。类比，你可以将每个硬件线程想象为一个泳道，将软件线程想象为一个游泳者。\n\
  \n![note](img/note.gif)\n\n每个软件线程与其父进程共享私有的唯一内存空间。但它有自己的栈、寄存器和私有本地存储。\n\n`Windows`\
  \ 将每个硬件线程识别为可调度的逻辑处理器。每个逻辑处理器都可以运行软件线程的代码。在多个线程中运行代码的进程可以利用硬件线程和物理核心并行运行指令。图 1-4\
  \ 显示了运行在硬件线程和物理核心上的软件线程。`Windows` 调度器可以决定将一个软件线程重新分配到另一个硬件线程，以平衡每个硬件线程的工作。由于通常有很多其他软件线程等待处理时间，负载均衡将通过组织可用资源，使得其他线程能够运行指令。图\
  \ 1-5 显示了 `Windows` 任务显示的八个硬件线程（逻辑核心及其负载）。\n\n![note](img/note.gif)\n\n负载均衡是将软件线程的工作在硬件线程之间公平共享的实践。然而，实现完美的负载均衡取决于应用程序的并行性、负载、软件线程的数量、可用的硬件线程以及负载均衡策略。\n\
  \n![note](img/note.gif)\n\n`Windows` 管理器和 `Windows` 资源监器显示硬件线程的 CPU 使用历史图表。例如，如果你有一个具有四个物理核心和八个硬件线程的微处理器，这些工具将显示八个独立的图表。\n\
  \n\n\n\nWindows 通过为每个可用的硬件线程分配处理时间片来运行数百个软件线程。你可以使用 Windows 资源监视器在“概述”选项卡中查看特定进程的软件线程数。CPU\
  \ 面板显示每个进程的映像名称，并在“线程”列中显示相关的软件线程数，如图 1-6 所示，其中 `vlc.exe` 进程有 32 个软件线程。\n\n图 1-6\n\
  \n![1.6](img/c01f006.jpg)\n\n核心停用（Core Parking）是一种 Windows 内核电源管理器和内核线程调度器技术，旨在提高多核系统的能源效率。它不断跟踪每个硬件线程相对于所有其他线程的相对负载，并可以决定将某些线程设置为睡眠模式。\n\
  \n核心停用根据工作负载动态调整正在使用的硬件线程数量。当某个硬件线程的工作负载低于特定阈值时，核心停用算法将尝试通过停用系统中的某些硬件线程来减少正在使用的硬件线程数。为了使该算法高效运行，内核调度器在调度软件线程时会优先选择未停用的硬件线程。内核调度器会尝试让已停用的硬件线程空闲，允许它们转换到低功耗空闲状态。\n\
  \n在包含 HT（超线程）的微处理器系统中，核心停用尝试在运行同一物理核心的多个硬件线程的线程之间智能地调度工作。这种调度决策降低了功耗。\n\nWindows\
  \ Server 2008 R2 支持完整的核心停用技术。然而，Windows 7 也使用了核心停用算法和基础，以在包含 HT 的微处理器的硬件线程之间平衡处理器性能。图\
  \ 1-7 显示了 Windows 资源监视器显示的八个硬件线程的活动情况，其中四个处于停用状态。\n\n图 1-7\n\n![1.7](img/c01f007.jpg)\n\
  \n无论停用的硬件线程数量，.NET Framework 4 函数返回的硬件线程数量将是总数，而不仅仅是未停用的。核心停用技术并不限制进程中运行软件线程的硬件线程数量。\n\
  \n在某些工作负载下，具有八个硬件线程的系统在轻负载下可以转换为具有两个硬件线程的系统，然后根据需要增加并启动预留的硬件线程。在某些情况下，核心停用可能会为尝试并行运行代码的许多软件线程引入额外的延迟。因此，在测量并行性能时，考虑产生的延迟是非常重要的。\n\
  \n# 理解阿姆达尔定律\n\n如果你想利用多核心在更短的时间内运行更多指令，就有必要将代码拆分为并行序列。但大多数算法需要运行一些顺序性代码来协调并行执行。例如，必须并行启动许多部分，然后收集它们的结果。用于拆分并行工作和收集结果的代码可能是无法利用并行性的的顺序性代码。如果你这样连接许多算法，顺序性代码的整体百分比可能会增加，所实现的性能收益可能会减少。\n\
  \n著名的计算机架构师吉恩·阿姆达尔（Gene Amdahl）对仅改进系统部分时，计算机系统可以预期的最大性能改进进行了观察。他利用这些观察定义了阿姆达尔定律（Amdahl's\
  \ Law），该定律包含以下公式，旨在预测使用多个处理器时的理论最大性能改进（称为加速比）。它也可以应用于在多核微处理器上运行的并行算法。\n\n加速比（倍）\
  \ = 1 / ((1 - P) + (P/N)\n\n其中：\n\n*   `P` 是完全并行运行的代码部分。\n*   `N` 是可用的执行单元数量（处理器或物理核心）。\n\
  \n根据该公式，如果你有一个算法，其总工作中只有 50%（`P = 0.50`）是并行执行，那么在具有两个物理核心的微处理器上，最大加速比将为 1.33 倍。图\
  \ 1-8 展示了一个包含 1,000 个工作单元的算法，被拆分为 500 个顺序工作单元和 500 个并行工作单元。如果顺序版本需要 1,000 秒完成，那么带有某些并行代码的新版本将花费不少于\
  \ 750 秒。\n\n图 1-8\n\n![1.8](img/c01f008.jpg)\n\n加速比（倍） = 1 / ((1 - 0.50) + (0.50\
  \ / 2)) = 1.33x\n\n在具有八个物理核心的微处理器上，相同算法的最大加速比仅为 1.77 倍。它将花费不少于 750 秒。\n\n加速比（倍）\
  \ = 1 / ((1 - 0.50) + (0.50 / 8)) = 1.14x\n\n图 1-9 显示了相同算法在具有八个物理核心的微处理器上的最大加速比。它将花费不少于\
  \ 750 秒。\n\n图 1-10 显示了相同算法在具有十六个物理核心的微处理器上的最大加速比。它将花费不少于 750 秒。\n\n加速比（倍） = 1 /\
  \ ((1 - 0.50) + (0.50 / 16)) = 1.09x\n\n阿姆达尔定律考虑了物理核心的数量，但它没有考虑你可以为现有应用程序添加的新功能，以利用额外算力。例如，你可以创建新算法，以利用那些在超过三个核心上运行时无法获得巨大性能改进的核心。你可以创建考虑不同并行场景的设计来减少阿姆达尔定律的影响。随着硬件提供新功能，应用程序必须演进。\n\
  \n# 考虑古尔森定律\n\n约翰·古尔森（John Gustafson）注意到阿姆达尔定律将算法视为固定的，而没有考虑运行它们的硬件的变化。因此，他在 1988\
  \ 年对该定律提出了重新评估。他认为加速比应该通过将问题扩展到处理器数量来衡量，而不是通过固定问题大小。当硬件提供的并行处理能力增加时，问题负载随之扩展。\n\n\
  古尔森定律提供了以下公式，关注问题大小以衡量在固定时间内可以执行的工作量：\n\n总工作量（单位） = S + (N × P)\n\n其中：\n\n*   `S`\
  \ 代表顺序执行的工作单元。\n*   `P` 是每个完全并行运行的工作单元的大小。\n*   `N` 是可用的执行单元数量（处理器或物理核心）。\n\n你可以考虑一个由\
  \ 50 个顺序执行单元组成的问题。该问题还可以为每个可用核心调度 50 个单元的并行工作。如果你有一个具有两个物理核心的微处理器，最大工作量将是 150 个单元。\n\
  \n\n\n\n总工作量（单位） = 50 + (2 × 50) = 150 单位工作\n\n图 1-11 展示了一个包含 50 个工作量的算法，其包含一个顺序执行部分和一个并行部分。后者根据物理核心的数量进行扩展。通过这种方式，并行部分可以处理可扩展的、可并行的\
  \ 50 个工作量。当可用核心更多时，并行部分的负载会随之增加。如果并行部分有足够的额外工作量待处理，该算法可以在更短时间内处理更多数据。相同的算法可以在具有八个物理核心的微处理器上运行。在这种情况下，它能够在与之前相同的时间内处理\
  \ 450 个工作量：\n\n总工作量（单位） = 50 + (8 × 50) = 450 单位工作\n\n图 1-11\n\n![1.11](img/c01f011.jpg)\n\
  \n图 1-12 显示了算法根据物理核心数量（1 到 16）的加速情况。只要在核心数量增加时有足够的工作量进行并行处理，这种加速就是可能的。如你所见，这种加速优于应用阿姆尔定律（Amdahl's\
  \ Law）产生的结果。图 1-13 显示了根据可用物理核心数量（1 到 32）的总工作量。\n\n图 1-12\n\n![1.12](img/c01f012.jpg)\n\
  \n图 1-13\n\n![1.13](img/c01f013.jpg)![note](img/note.gif)\n\n有时，程序中顺序部分花费的时间取决于问题规模。在这些情况下，你可以通过扩展问题规模来增加获得比阿姆尔定律计算结果更好加速效果的机会。然而，某些问题在可并行处理的数据量上存在扩展性限制。当发生这种情况时，你可以添加新功能来利用现代硬件中提供的并行处理能力，或者采用不同的设计。随后的章节将教授许多技术，用于准备算法以通过古斯塔夫森定律（Gustafson's\
  \ Law）改进计算的总工作量。\n\n图 1-14 展示了许多由多个工作单元组成的算法，这些算法包含顺序执行部分和并行部分。并行部分随着可用核心数量增加而扩展。随着更多可扩展的并行部分运行工作单元，顺序部分的影响就会减小。在这种情况下，有必要计算顺序部分和并行部分的总工作单元，以及：\n\
  \n总顺序工作量（单位） = 25 + 150 + 100 + 150 = 425 单位工作\n\n总并行工作单元总量（单位） = 50 + 200 + 300\
  \ = 550 单位工作\n\n总工作量（单位） = 425 + (8 × 550) = 4,825 单位工作\n\n图 1-14\n\n![1.14](img/c01f014.jpg)\n\
  \n顺序执行在相同的时间内仅能够执行 975 个工作量：\n\n顺序执行的总工作量（单位） = 25 + 50 + 150 + 200 + 100 + 300\
  \ + 150 = 975 单位工作\n\n# 使用轻量级并发\n\n阿姆尔定律和古斯塔夫森定律都没有考虑并行性引入的开销。它们也没有考虑到允许转换模式的存在\n\
  \n# 创建成功的基于任务的设计\n\n有时，你必须优化现有的解决方案以利用并行性。在这些情况下，你必须理解现有的顺序设计或扩展性较低的并行算法，然后必须对其进行重构，以在不引入问题或不产生不同结果的情况下实现性能提升。你可以针对问题的一小部分或整个问题创建一个基于任务的设计，然后引入并行性。\n\
  \n\n\n\n6. 考虑到当前的多核微处理器和未来的架构，分析并行化问题的执行计划。为更高的可扩展性做好你的设计准备。\n\n7. 尽可能地减少关键区域（critical\
  \ sections）。\n\n8. 尽可能使用基于任务的编程（task-based programming）来实现并行。\n\n9. 调优并迭代。\n\n上述步骤并不意味着所有子问题都将成为在不同线程中运行的并行任务。设计必须考虑并行的可能性，然后在编写代码时，你可以根据性能和可扩展性目标来决定最佳方案。以并行的方式进行思考并将待完成的工作拆分为任务是非常重要的。这样，你就可以根据需要对代码进行并行化。如果你准备的设计是针对经典的顺序执行的，那么要使用基于任务的编程技术将其并行化将花费巨大的精力。\n\
  \n![note](img/note.gif)\n\n你可以将基于任务的设计与面向对象的设计结合。事实上，你可以使用面向对象的代码来封装并行性，并创建并行化的对象和组件。\n\
  \n## 考虑到并发性进行设计\n\n当你设计代码以利用多个核心时，非常重要的一点是停止认为 C# 内部的代码是独立运行的。C# 已经为并发代码做好了准备，这意味着许多代码段可以在同一个进程中同时运行，或者以交替执行。同一个类方法可以在并发代码中执行。如果该方法将状态保存在静态变量中并在稍后使用该保存的状态，许多并发执行可能会产生出乎意料且不可预测的结果。\n\
  \n如前所述，针对多核微处理器的并行编程基于共享内存模型工作。数据存在于相同的共享内存中，如果设计没有考虑并发性，可能会导致意料之外的结果。\n\n将每个类和方法准备好能够并发运行且不产生副作用，是一个良好的做法。如果你有没有考虑到并发性的设计的类、方法或组件，那么在并行化代码中使用它们之前，你必须对它们的设计进行测试。\n\
  \n在设计过程中检测到的每个子问题都应该能够在其他子问题并发执行的同时运行。如果你认为在运行某个子问题时由于使用了旧的类、方法或组件而需要限制并发代码，那么应该在设计文档中明确说明。一旦你开始处理并行化代码，很容易整合其他现有的、并非为并发执行而设计的类、方法和组件。\n\
  \n## 理解交替并发、并发与并行之间的区别\n\n图 1-15 展示了当有两个软件线程且每个线程执行四条指令时，交替并发与并发之间的区别。交替并发场景为每个线程执行一条指令并将它们交替执行，但并发场景是同时并行运行两条指令。设计必须为这两种场景做好准备。并发要求物理上的同时处理发生。\n\
  \n图 1-15\n\n![1.15](img/c01f015.jpg)![note](img/note.gif)\n\n并行化涉及对待完成的工作进行划分，在这些部分上并发运行处理，并合并结果。并行化问题会产生并发。\n\
  \n并行化代码可以在许多不同的并发和交替并发场景中运行，即使它们在相同的硬件配置上执行。因此，并行设计面临的巨大挑战之一是确保其以不同的可能的有效顺序和交替执行将导致正确的结果，即所谓的正确性。如果你需要特定的顺序，或者代码的某些部分不需要一起运行，那么就有必要确保这些部分不并发运行。你不能仅仅因为运行了多次且它产生了预期结果，就假设它们没有并发运行。当你为并发和并行进行设计时，你必须确保考虑了正确性。\n\
  \n在下一章中，你将通过查看各种代码示例学习更多关于并发与并行之间的区别。\n\n## 任务并行化\n\nVisual C# 2010 和 .NET Framework\
  \ 4 可以轻松将基于任务的设计转换为并行化代码。然而，非常重要的是理解，并行化代码需要特定的测试和调优程序以实现预期目标。你将在书剩余范围内学习它们。\n\n\
  当你对任务进行并行化时，并行引入的开销可能会产生重要影响，并可能需要测试不同的方案。如前所述，现代多核微处理器极其复杂，有必要测试不同的并行技术提供的结果，直到你可以做出选择。事实上，顺序代码也是如此，区别在于你已经知道\
  \ `foreach` 循环比 `for` 循环慢。在并行化任务时，`for` 循环的并行版本可以根据决定并行化任务执行方式的某些参数提供许多不同的性能结果。一旦你体验了这些场景，当你必须为类似问题和类似的基于任务的设计编写代码时，你就可以考虑它们了。\n\
  \n通常需要链联多个任务，其中代码可以将待完成的工作拆分为任务，并行执行操作，收集结果，然后像当前这样重复许多循环。在决定并行化不是某个特定问题的良好替代方案之前，尝试创建一个其潜在并发执行的图，假定你可以在\
  \ 1,000 个核心上运行它。如果算法中某些完全并行化的部分没有提供预期的可扩展性，你有机会让与其他并行运行。\n\n## 最小化关键区域\n\n阿姆达法则和格尔逊法则都将顺序工作视为并行算法整体性能的敌人。两个并行区域之间需要顺序执行的串行时间被称为关键区域（critical\
  \ section）。图 1-16 在格尔逊法则使用的图表之一中识别了四个关键区域。\n\n图 1-16\n\n![1.16](img/c01f016.jpg)\n\
  \n当你并行化任务时，为了获得最佳性能，最重要的目标之一就是最小化这些关键区域。大多数情况下，无法避免两个并行区域之间某些需要顺序执行的代码，因为需要启动并行作业并收集结果。然而，优化关键区域中的代码并移除不必要的区域，比对并行代码进行适当调优更为重要。\n\
  \n当你面对具有过多关键区域的执行计划时，记住阿姆达法则。如果你无法减少它们，尝试寻找可以与关键区域并行运行的任务。例如，你可以与关键区域并行的同时，预取下一个并行化算法将消耗的数据，以提高解决方案提供的整体性能。非常重要的是，你要考虑现代多核硬件提供的能力，以避免认为你只有一个执行单元。\n\
  \n\n\n\n\nJames Reinders 在《Dr. Dobb's Journal》上发表了一篇名为《多核并行编程规则》的文章（[www.drdobbs.com/hpc-high-performance-computing/201804248](http://www.drdobbs.com/hpc-high-performance-computing/201804248)）。他列出了八条规则来帮助开发者进行多核编程。正如此处所述，他的规则对于使用\
  \ C# 和 .NET Framework 4 创建并行应用同样有用：\n\n1. **并行思维** —— 这一规则关于在设计时考虑并行性，正如在前面的章节中所解释的那样。\n\
  \n2. **使用抽象进行编程** —— 你可以 `.NET Framework 4` 中 `Task Parallel Library`（`TPL`）提供的新功能，使你的高层代码反映问题本身，而不是复杂的底层线程管理技术。第\
  \ 2 章：命令式数据并行引入了 `TPL`。\n\n3. **基于任务（杂务）而非线程（核心）进行编程** —— `TPL` 允许你编写代码来实现基于任务的设计，而无需担心底层的线程。\n\
  \n4. **设计提供关闭并发的选项** —— 当你使用 `TPL` 编写代码时，它仍然运行在具有单核微处理器（只有一个物理核心）的计算机上。\n\n5. **避免使用锁**\
  \ —— 利用专为消除复杂同步机制需求而设计的新类、方法和结构是至关重要的。`TPL` 使得在许多复杂场景下避免使用重量级锁变得更容易，并提供了新的轻量级同步机制。\n\
  \n6. **使用专为帮助并发设计的工具和库** —— Visual Studio 2010 提供了用于调试、测试和调整并行代码的新工具。你将在本书中学习各种工具和库。\n\
  \n7. **使用可扩展的内存分配器** —— `TPL` 在 `Common Language Runtime`（`CLR`）中提供了可扩展的内存分配器，并在处理任务和线程时自动使用它们。然而，为了最大化利用缓存，你必须分析不同的分区可能性，并尝试避免在每个任务中消耗过内存。\n\
  \n8. **设计通过增加工作负载来实现扩展** —— 一旦你掌握了并行扩展，利用 `TPL` 提供的新类就可以轻松地考虑古斯夫森法则（Gustafson's\
  \ Law）。如果你为未来的扩展性做好设计上的准备，你就能编写出随着核心数量增加而扩展的代码。Windows 7 和 Windows Server 2008 R2\
  \ 支持多 256 个硬件线程或逻辑处理器；因此，存在扩展空间。\n\n# 为 NUMA 和更高的扩展性做准备\n\n近年来，支持多处理器的最广泛模型——对称多处理器（`SMP`）已将位置让给了非统一内存访问（`NUMA`）架构。`SMP`\
  \ 的主要问题之一是处理器总线变成了未来扩展的限制，因为每个处理器对内存和输入/输出（`I/O`）的访问是平等的。\n\n通过 `NUMA`，每个处理器访问附近的内存的速度比访问远程内存更快。当处理器数量超过四个时，`NUMA`\
  \ 提供了更好的扩展性。在 Windows 扩展技术术语中，`NUMA` 的组织方式如下（该结构的图示请参见图 1-17）：\n\n* 单台计算机或机器可以有一个或多个组。\n\
  * 每个组拥有一个或多个 `NUMA` 节点。\n* 每个 `NUMA` 节点拥有一个或多个物理处理器或插槽（真正的微处理器）。组成 `NUMA` 节点的不同微处理器可以访问本地内存和\
  \ `I/O`。\n* 每个处理器或插槽拥有一个或多个物理核心，因为它们通常是多核微处理器。\n* 每个物理核心可以提供一个或多个逻辑处理器或硬件线程。\n\n\
  图 1-17\n\n![1.17](img/c01f017.jpg)\n\n图 1-18 显示了一台由两个 `NUMA` 节点组成的单组计算机。每个 `NUMA`\
  \ 节点都有两个微处理器，它们可以访问自己的本地内存和 `I/O`。如果运行在 `NUMA` 节点 #0 中处理器 #0 的物理核心 #0 上的线程需要访问位于\
  \ `NUMA` 节点 #1 本地内存的数据，将必须使用两个 `NUMA` 节点之间的共享总线，这将比访问其本地内存要慢。\n\n图 1-18\n\n![1.18](img/c01f018.jpg)\n\
  \n通过 `NUMA`，计算机拥有多个系统总线。一组处理器使用每个可用的系统总线。因此，每组处理器都可以访问自己的内存和自己的 `I/O` 通道。正如之前解释的，在适当的协调方案下，它们仍然能够访问其他处理器组拥有的内存。然而，访问远程\
  \ `NUMA` 节点拥有的内存显然比使用本地系统总线访问的内存（`NUMA` 节点内存）贵得多。\n\n`NUMA` 硬件需要特定的优化。应用程序必须意识到\
  \ `NUMA` 硬件及其配置。因此，它们可以运行在同一 `NUMA` 节点中访问相似内存位置的并发任务和线程。应用程序必须避免昂贵的内存访问，并在考虑到内存需求的情况下倾向于并发。\n\
  \nWindows 7 和 Windows Server 2008 R2 引入了上述的处理器组概念。线程、进程或中断可以表示对特定核心、处理器、节点或组的偏好。然而，`TPL`\
  \ 或 `C#` 都不支持这种低级定义。`TPL` 针对 `NUMA` 进行了优化，它并尝试将支持并行的线程运行在最方便的核心上，并尽可能使用本地内存。因此，你的并行代码将是\
  \ `NUMA` 就绪的，尽管当支持并行代码的线程必须访问远程 `NUMA` 节点中的内存时，你仍可能遇到一些意外的性能问题。\n\n![note](img/note.gif)\n\
  \nWindows API 提供了许多处理 `NUMA` 架构的函数，但它们与托管线程不兼容。因此，在使用 `C#` 和 `TPL` 时，你不需要使用它们。\n\
  \n`Coreinfo` 是一个简单而强大的命令行实用，可以向你显示关于处理器及其结构和缓存拓扑的有用信息。它显示了逻辑处理器或硬件线程与物理核心之间的映射信息。此外，它还显示了关于\
  \ `NUMA` 节点、组、插槽以及所有缓存级的信息。你可以在运行性能测试之前轻松保存底层硬件信息，并判断 `NUMA` 架构是否会导致性能问题。你可以从 [`technet.microsoft.com/en-us/sysinternals/cc835722.aspx`](http://technet.microsoft.com/en-us/sysinternals/cc835722.aspx)\
  \ 下载 `Coreinfo` v2.0。然后，你可以解压缩执行文件并从命令行（开始 → 所有程序 → 附件工具 → 命令提示符）运行它。\n\n\n\n\n\
  该工具使用 `GetLogicalProcessorInformation` Windows API 函数获取所有信息并将其显示在屏幕上。列表 1-1 显示了在带有单颗\
  \ Intel Core i7 微处理器的计算机上运行 `CoreInfo` v2.0 的结果。这里有一个包含四个物理核心的单插槽，在“逻辑处理器到物理处理器映射”中详细列出。然而，由于此\
  \ CPU 提供了 Intel 超线程技术（Intel Hyper-Threading Technology），`Coreinfo` 告诉你是它是超线程的。`Coreinfo`\
  \ 使用星号 `*` 表示映射。在这种情况下，有四个物理核心，每个物理核心有两个硬件线程；因此，它们各显示为两个星号 `**`。此外，还有一个统一的 8MB 三级缓存。这八个硬件线程共享此缓存；因此，`Coreinfo`\
  \ 在“逻辑处理器到缓存映射”最后行的左侧显示了八个星号 `********`。这意味着缓存被映射到所有这些硬件线程及其物理核心。\n\n### 列表 1-1：\
