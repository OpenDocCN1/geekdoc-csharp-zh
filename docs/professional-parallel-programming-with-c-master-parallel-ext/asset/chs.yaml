  \ 4_3\n\n`TryPopRange` 方法接收一个字符串数组 `hexStrings`，将 `0` 作为初始索引，并将 `bufferSize` 作为尝试从栈顶移除的元素数量。\n\
  \n![download](img/download.gif)\n\n```cs\nint numItems = _keysStack.TryPopRange(hexStrings,\
  \ 0, bufferSize);\n```\n\n代码片段是 Snippet 4_3\n\n该方法返回成功移除的元素数量，这些元素现在位于作为参数接收的 `numItems`\
  \ 数组中。元素的数量可能少于指定的数量，因为此时栈中没有足够的元素。因此，考虑该方法返回的值非常重要，以便访问数组中正确数量的元素。如果栈为空，它将返回 0。\n\
  \n然后，代码运行一个顺序 `for` 循环，将每个经过验证的字符串保存在 `hexStrings` 数组中，并递有效有效字符串计数器 `numValidKeys`。然后，如果循环产生的有效字符串数量大于零，它将调用\
  \ `PushRange` 方法以原子操作将所有元素插入到栈顶。\n\n![download](img/download.gif)\n\n```cs\n_validKeys.PushRange(validHexStrings,\
  \ 0, numValidKeys);\n```\n\n代码片段是 Snippet 4_3\n\n该方法接收带有 `validHexStrings` 的数组，将\
  \ `0`（经过验证的字符串）作为初始索引，并将 `numValidKeys` 作为推入栈的元素数量。通过这种方式，它将添加 `validHexStrings`\
  \ 数组从 `0` 到 `numValidKeys - 1` 的项。\n\n![note](img/note.gif)\n\n有时，你可以减少 `ConcurrentStack`\
  \ 中并发推入和出的次数。在这些情况下，你可以通过使用之前解释的 `TryPopRange` 和 `PushRange` 方法对组元素执行原子操作，从而提高性能。然而，你必须小心，因为缓冲区也会增加开销并消耗额外的内存。\n\
  \n你可以通过调用 `Clear` 方法从 `ConcurrentStack` 中移除所有项。因此，你也可以像下一行一样在原子操作中清空栈：\n\n```cs\n\
  _keysStack.Clear()\n```\n\n## 将数组和安全集合转换为并发集合\n\n你可以通过创建一个以安全集合作为参数的新实例，将数组和安全集合转换为并发集合之一。以下代码行显示了一个示例，它创建一个名为\
  \ `invalidHexValuesStack` 的 `ConcurrentStack<string>`，并用填充在名为 `_invalidHexValues`\
  \ 的现有字符串数组中找到的值。通过这种方式，你可以使用它的 `TryPop` 方法从 `ConcurrentStack` 中移除项。\n\n![download](img/download.gif)\n\
  \n```cs\nprivate static string[] _invalidHexValues =\n    { \"AF\", \"BD\", \"BF\"\
  , \"CF\", \"DA\", \"FA\", \"FE\", \"FF\" };\n\nstatic void Main(string[] args)\n\
  {\n    var invalidHexValuesStack = new ConcurrentStack<string>(_invalidHexValues);\n\
  \    while (!invalidHexValuesStack.IsEmpty)\n    {\n        string hexValue;\n \
  \       invalidHexValuesStack.TryPop(out hexValue);\n        Console.WriteLine(hexValue);\n\
  \    }\n    Console.ReadLine();\n}\n```\n代码片段是 Snippet 4_4\n\n之前的代码将在控制台中生成以下输出。第一个项是\
  \ `_invalidHexValues` 字符串数组中的第一个项，因为它的项是被添加到栈中的，遵循先入先出（FIFO）顺序。\n\n```\nFF\nFE\n\
  FA\nDA\nCF\nBF\nBD\nAF\n```\n\n你可以使用任何支持 `IEnumerable` 接口的集合，其数据类型与并发集合为元素定义的数据类型相同。因此，如果发送到\
  \ `ConcurrentStack` 构造函数的参数 `_invalidHexValues` 是一个 `List<string>`，之前显示的代码也可以工作。例如：\n\
  \n```cs\npublic static List<string> _invalidHexValues =\n    new List<string> {\
  \ \"AF\", \"BD\", \"BF\", \"CF\", \"DA\", \"FA\", \"FE\", \"FF\" };\n```\n\n一旦你对并发集合执行了所有必要的并发操作，你可能需要运行访问其元素的顺序代码。当这种情况发生时，由线程安全操作带来的额外开销可能会导致顺序代码的运行速度比访问安全集合更慢。在这种情况下，你可以调用以下方法之一，根据并发队列中的元素创建一个安全集合：\n\
  \n*   `CopyTo` — 将元素复制到现有的一维数组中，从作为第二个参数接收的数组索引开始。目标数组必须设置大小以支持元素数量。在下面的示例中，`CopyTo`\
  \ 方法复制了元素：\n    ```cs\n    string[] invalidStrings = new string[invalidValuesStack.Count];\n\
  \    invalidValuesStack.CopyTo(invalidStrings, 0);\n    ```\n*   `ToArray` — 返回一个与元素相同类型的新数组。下面的代码片段显示了\
  \ `ToArray` 如何返回新数组：\n    ```cs\n    var invalidStrings = invalidValuesStack.ToArray();\n\
  \    ```\n\n你可以在其他任务或线程向并发集合添加和移除元素的同时运行上述方法，但新的安全集合将基于并发集合在特定时间的快照。因此，你可能会接收到一个包含可能已被移除元素的安全集合。\n\
  \n![note](img/note.gif)\n\n你还可以使用支持的 `ToList`、`ToDictionary` 和 `ToLookup` 扩展方法将并发集合复制到其他类型。\n\
  \n## ConcurrentBag\n\n`ConcurrentBag` 在同一线程添加和移除元素的某些场景下是非常高效的集合。它使用了许多不同的机制来减少对同步及其相关开销的需求。然而，有时它需要锁定，并且在生产者线程与消费者线程完全分离的场景下效率较低。`ConcurrentBag`\
  \ 为每个访问包的线程维护一个本地队列，并在可能的情况下以无锁方式访问本地队列。`ConcurrentBag` 表示一个包，这是一个无序且支持重复的对象集合。因此，`ConcurrentBag`\
  \ 适用于对顺序没有要求的对象存储。\n\n`ConcurrentBag` 提供的三个方法如下：\n\n*   `Add` — 将作为参数的新元素添加到包中。\n\
  *   `TryTake` — 尝试从包中移除并返回一个元素。它返回一个 `bool` 值表示操作是否成功，`out` 参数包含从包中移除的对象。\n*   `TryPeek`\
  \ — 尝试从包中返回一个元素但不从包中移除它。它返回一个 `bool` 值表示操作是否成功，`out` 参数包含包中的对象。\n\n这三个方法在图 4-10\
  \ 中进行了说明。\n\n![4.10](img/c04f010.jpg)\n\n`ConcurrentBag` 还提供了之前在 `ConcurrentStack`\
  \ 部分解释过的 `IsEmpty` 属性。\n\n[Listing 4-7] 显示了多个生产者和消费者的代码，它们生成并处理两百万个句子（NUM_SENTENCES），通过与以下三个\
  \ `ConcurrentBag` 实例协作工作：\n\n*   `_sentencesBag` ––`ProduceSentences` 方法生成两百万个句子并将添加到此包中。\n\
  \n\n\n\n\n* `_capWordsInSentencesBag` – `CapitalizeWordsInSentences` 方法从 `sentencesBag`\
  \ 集合中获取句子，并生成一个替换了分隔符且单词首字母大写的新句子。它将这些新句子添加到另一个集合 `_capWordsInSentencesBag` 中。\n\
  * `_finalSentencesBag` – `RemoveLettersInSentences` 方法从 `_capWordsInSentencesBag`\
  \ 集合中获取句子，并生成一个删除了匹配某些字母的字符的新句子。它将这些新句子添加到另一个集合 `_finalSentencesBag` 中。\n\n![下载](img/download.gif)\n\
  \nListing 4-7: 生产者和消费者从多个 `ConcurrentBag` 实例中添加和删除元素\n\n```csharp\nprivate static\
  \ string RemoveLetters(char[] letters, string sentence)\n{\n    var sb = new StringBuilder();\n\
  \    bool match = false;\n    for (int i = 0; i < sentence.Length; i++)\n    {\n\
  \        for (int j = 0; j < letters.Length; j++)\n        {\n            if (sentence[i]\
  \ == letters[j])\n            {\n                match = true;\n               \
  \ break;\n            }\n        }\n        if (!match)\n        {\n           \
  \ sb.Append(sentence[i]);\n        }\n        match = false;\n    }\n    return\
  \ sb.ToString();\n}\n\nprivate static string CapitalizeWords(\n    char[] delimiters,\
  \ string sentence, char newDelimiter)\n{\n    string[] words = sentence.Split(delimiters);\n\
  \    var sb = new StringBuilder();\n    for (int i = 0; i < words.Length; i++)\n\
  \    {\n        if (words[i].Length > 1)\n        {\n            sb.Append(words[i][0].ToString().ToUpper());\n\
  \            sb.Append(words[i].Substring(1).ToLower());\n        }\n        else\n\
  \        {\n            // 只有 1 个字母的单词必须是小写\n            sb.Append(words[i].ToLower());\n\
  \        }\n        sb.Append(newDelimiter);\n    }\n    return sb.ToString();\n\
  }\n\nprivate const int NUM_SENTENCES = 2000000;\nprivate static ConcurrentBag<string>\
  \ _sentencesBag;\nprivate static ConcurrentBag<string> _capWordsInSentencesBag;\n\
  private static ConcurrentBag<string> _finalSentencesBag;\nprivate static volatile\
  \ bool _producingSentences = false;\nprivate static volatile bool _capitalizingWords\
  \ = false;\n\nprivate static void ProduceSentences()\n{\n    string[] possibleSentences\
  \ =\n    { \n        \"ConcurrentBag is included in the Systems.Concurrent.Collections\
  \ namespace.\",\n        \"Is parallelism important for cloud-computing?\",\n  \
  \      \"Parallelism is very important for cloud-computing!\",\n        \"ConcurrentQueue\
  \ is one of the new concurrent collections added in .NET Framework 4\",\n      \
  \  \"ConcurrentStack is a concurrent collection that represents a LIFO collection\"\
  ,\n        \"Queue is a concurrent collection that represents a FIFO collection\"\
  \n    };\n    try\n    {\n        // 产生句子的真主方法\n        _sentencesBag = new ConcurrentBag<string>();\n\
  \        var rnd = new Random();\n        for (int i = 0; i < NUM_SENTENCES; i++)\n\
  \        {\n            var sb = new StringBuilder();\n            for (int j =\
  \ 0; j < possibleSentences.Length; j++)\n            {\n                if (rnd.Next(2)\
  \ > 0)\n                {\n                    sb.Append(possibleSentences[rnd.Next(possibleSentences.Length)]);\n\
  \                    sb.Append(\" \");\n                }\n            }\n     \
  \       if (rnd.Next(20) > 5)\n            {\n                _sentencesBag.Add(sb.ToString());\n\
  \            }\n            else\n            {\n                _sentencesBag.Add(sb.ToString().ToUpper());\n\
  \            }\n        }\n    }\n    finally\n    {\n        _producingSentences\
  \ = false;\n    }\n}\n\nprivate static void CapitalizeWordsInSentences()\n{\n  \
  \  char[] delimiterChars = { \n        ' ', ',', '.', ':', ';', '(', ')', '[', ']',\
  \ '{', '}', \n        '/', '?', '@', '\\t', '\"'\n    };\n    // 在 Produce sentences\
  \ 开始工作后开始\n    System.Threading.SpinWait.SpinUntil(() => _producingSentences);\n\
  \    try\n    {\n        _capitalizingWords = true;\n        // 在循环（自旋）中运行此条件是非常无效的\n\
  \        // 此示例出于教学目的使用了这种自旋\n        // 这并不是最佳实践\n        // 后后的章节和章节将解释一个改进版本\n\
  \        while ((_sentencesBag.IsEmpty) || (_producingSentences))\n        {\n \
  \           string sentence;\n            if (_sentencesBag.TryTake(out sentence))\n\
  \            {\n                _capWordsInSentencesBag.Add(\n                 \
  \   CapitalizeWords(delimiterChars, sentence, ''));\n            }\n        }\n\
  \    }\n    finally\n    {\n        _capitalizingWords = false;\n    }\n}\n\nprivate\
  \ static void RemoveLettersInSentences()\n{\n    char[] letterChars = { 'A', 'B',\
  \ 'C', 'e', 'i', 'j', 'm', 'X', 'y', 'Z' };\n    // 在 CapitalizeWordsSentences 开始工作后开始\n\
  \    System.Threading.SpinWait.SpinUntil(() => _capitalizingWords);\n    // 在循环（自旋）中运行此条件是非常无效的\n\
  \    // 此示例出于教学目的使用了这种自旋\n    // 这并不是最佳实践\n    // 后后的章节和章节将解释一个改进版本\n    while ((_sentencesBag.IsEmpty)\
  \ || (_capitalizingWords))\n    {\n        string sentence;\n        if (_capWordsInSentencesBag.TryTake(out\
  \ sentence))\n        {\n            _finalSentencesBag.Add(RemoveLetters(letterChars,\
  \ sentence));\n        }\n    }\n}\n\nstatic void Main(string[] args)\n{\n    var\
  \ sw = Stopwatch.StartNew();\n    _sentencesBag = new ConcurrentBag<string>();\n\
  \    _capWordsInSentencesBag = new ConcurrentBag<string>();\n    _finalSentencesBag\
  \ = new ConcurrentBag<string>();\n    // 在并发调用其他方法之前\n    // 将 _producingSentences\
  \ 设置为 true\n    // 这样 CapitalizeWordsInSentences\n    // 和 RemoveLettersInSentences\n\
  \    // 就能看到该变量的真值\n    _producingSentences = true;\n    Parallel.Invoke(\n    \
  \    () => ProduceSentences(),\n        () => CapitalizeWordsInSentences(),\n  \
  \      () => RemoveLettersInSentences()\n    );\n    Console.WriteLine(\n      \
  \  \"单词首字母大写的句子数: {0}\",\n        _capWordsInSentencesBag.Count);\n    Console.WriteLine(\n\
  \        \"删除字母后的句子数: {0}\",\n        _finalSentencesBag.Count);\n    Debug.WriteLine(sw.Elapsed.ToString());\n\
  \    // 显示结果并等待用户按键\n    Console.WriteLine(\"完成!\");\n    Console.ReadLine();\n\
  }\n```\n\n在这种情况下，`Main` 方法将共享布尔变量 `_producingSentences` 设置为 `true`，然后通过调用 `Parallel.Invoke`\
  \ 并发启动以下三个方法：\n\n* `ProduceSentences`\n* `CapitalizeWordsInSentences`\n* `RemoveLettersInSentences`\n\
  \n图 4-11 显示了这些方法之间的关系。\n\n图 4-11\n\n![4.11](img/c04f011.jpg)\n\n`ProduceSentences`\
  \ 是第一个生产者。在它向名为 `sentencesBag` 的 `ConcurrentBag` 添加随机句子之前，共享布尔变量 `_producingSentences`\
  \ 的值被设置为 `true`。因此，检查该值的消费者将等待 `sentencesBag` 添加新项。`ProduceSentences` 确保在顺序循环结束后通过在\
  \ `finally` 块中分配此值将 `_producingSentences` 设置为 `false`。这样，即使发生任何异常，检查该变量以确定是否需要继续等待共享\
  \ `ConcurrentBag` 中新值的消费者也不会在生产者出现问题时永远等下去。\n\n\n\n\n\n`CapitalizeWordsInSentences`\
  \ 是 `ProduceSentences` 的消费者，也是 `RemoveLettersInSentences` 的生产者。它会等待共享的布尔变量 `_producingSentences`\
  \ 设置为 true 后开始工作。`Main` 方法在通过 `Parallel.Invoke` 调用生产者和两个消费者之前设置了该值，因为并发执行可能会在主生产者启动之前启动消费者。`Main`\
  \ 方法确保在消费者开始执行之前，`_producingSentences` 为 true。`CapitalizeWordsInSentences` 调用了 `System.Threading.SpinWait.SpinUntil`\
  \ 方法，并将共享的布尔变量 `_producingSentences` 作为 `Func<bool>` 条件的返回结果。下一行中指定的委托将反复执行，直到它返回\
  \ true 为止：\n\n```\n// 在循环中运行条件（自旋）是非常低效的\n// 此示例出于教学目的使用了这种自旋\n// 这并不是最佳实践\n// 随后的章节和章节将解释一个改进版本\n\
  System.Threading.SpinWait.SpinUntil(() => _producingSentences);\n```\n\n一旦 `_producingSentences`\
  \ 为 true，`SpinUntil` 方法将停止自旋并继续执行后续语句。有许多不同的方法可以协调作为生产者和消费者运行的多个任务执行的活动，有时自旋并不是最佳替代方案。这里使用的示例仅向你展示了可能性之一——你可以运行它，然后使用专门准备的其他类型的并发集合来改进它，这些集合可以简化生产者-消费者场景所需的协调，例如\
  \ `BlockingCollection`。第 5 节“协调数据结构”涵盖了 `SpinUntil` 方法以及在不同任务和线程之间协调工作的其他替代方案。\n\
  \n在 `CapitalizeWordsInSentences` 开始为名为 `_sentencesBag` 的 `ConcurrentBag` 取出的每个句子调用\
  \ `CapitalizeWords` 方法之前，它将共享的布尔变量 `_capitalizingWords` 设置为 true。它还通过在 `finally`\
  \ 块中分配此值，确保在顺序循环结束后该变量的值将被设置为 false。它通过调用 `TryTake` 方法从 `_sentencesBag` 获取元素，并通过调用\
  \ `Add` 方法向 `_capWordsInSentencesBag` 添加元素。执行这些操作是在 `_sentencesBag` 不为空或 `ProduceSentences`\
  \ 仍在工作时进行的。它假设当 `_producingSentences` 为 true 时，`ProduceSentences` 仍在工作。检查 `ConcurrentBag`\
  \ 上 `IsEmpty` 属性的值是非常昂贵的，因为需要临时获取包中的所有锁。因此，接几行中显示的条件并不是最佳选项：\n\n![下载](img/download.gif)\n\
  \n```cs\n_capitalizingWords = true;\n\n// 在循环中运行条件（自旋）是非常低效的\n// 此示例出于教学目的使用了这种自旋\n\
  // 这并不是最佳实践\n// 随后的章节和章节将解释一个改进版本\nwhile ((!_sentencesBag.IsEmpty) || (_producingSentences))\n\
  {\n    string sentence;\n    if (_sentencesBag.TryTake(out sentence))\n    {\n \
  \       _capWordsInSentencesBag.Add(CapitalizeWords(delimiterChars, sentence, '\\\
  \\'));\n    }\n}\n```\n\n代码片段是列表 4_7\n\n两个用标志的共享布尔变量使用 `volatile` 关键字声明。这些标志决定了消费者是否需要继续在它们从中获取元素的\
  \ `ConcurrentBag` 中等待新值。代码没有使用互斥锁或原子更新来更改后续行中声明的这些变量的值：\n\n```cs\nprivate static\
  \ volatile bool _producingSentences = false;\nprivate static volatile bool _capitalizingWords\
  \ = false;\n```\n\n使用 `volatile` 关键字确保了当从不同线程访问变量时，变量中将存在最新的值。因此，这些变量不受编译器优化的影响（编译器优化假设它们只会被单个线程访问）。第\
  \ 5 节“协调数据结构”深入探讨了 `volatile` 字段。\n\n`RemoveLettersInSentences` 是最后一个消费者。它的结构与之前解释的\
  \ `CapitalizeWordsInSentences` 类似，它是消费者。然而，`RemoveLettersInSentences` 方法没有为另一个布尔标志定义值。不需要另一个标志，因为没有其他消费者与名为\
  \ `_finalSentencesBag` 的 `ConcurrentBag` 联。`RemoveLettersInSentences` 使用这个 `ConcurrentBag`\
  \ 来添加删除了一些字母的句子。\n\n![注意](img/note.gif)\n\n## IProducerConsumerCollection\n\n`IProducerConsumerCollection<T>`\
  \ 接口定义了用于生产者-消费者场景的并发集合的方法。它继承了 `ICollection`、`IEnumerable<T>`，并暴露了之前为并发集合解释的方法：\n\
  \n* `CopyTo`\n* `ToArray`\n* `TryAdd`\n* `TryTake`\n\n## BlockingCollection\n\n\
  `BlockingCollection<T>` 是 `IProducerConsumer<T>` 实例的包装器。之前解释的所有集合类型都实现了 `IProducerConsumer<T>`，因此它们可以被封装在\
  \ `BlockingCollection<T>` 中。\n\n`BlockingCollection` 提供了边界（bounding）和阻塞（blocking）的支持。列表\
  \ 4-8 显示了使用三个 `BlockingCollection` 实例并利用边界和阻塞功能的示例代码。这些功能使得 `BlockingCollection`\
  \ 对于生产者-消费者场景和流水线的实现非常有用。然而，仍然可以改进这个示例。\n\n![下载](img/download.gif)\n\n```cs\nprivate\
  \ const int NUM_ENCES = 200000;\nprivate static BlockingCollection<string> _sentencesBC;\n\
  private static BlockingCollection<string> _capWordsSentencesBC;\nprivate static\
  \ BlockingCollection<string> _finalSentencesBC;\n\nprivate static void ProduceSentences()\n\
  {\n    string[] sentences = { \n        \"ConcurrentBag 包含在 System.Concurrent.Collections\
  \ 命名空间中。\",\n        \"并行性对计算重要吗？\",\n        \"并行性对计算非常重要！\",\n        \"ConcurrentQueue\
  \ 是 .NET 4 中添加的新并发集合之一\",\n        \"ConcurrentStack 是一个表示 LIFO（后进先出）的并发集合\",\n\
  \        \"ConcurrentQueue 是一个表示 FIFO（先入后出）的并发集合\" \n    };\n    var rnd = new Random();\n\
  \    for (int i = 0; i < NUM_ENCES; i++)\n    {\n        var sb = new StringBuilder();\n\
  \        for (int j = 0; j < sentences.Length; j++)\n        {\n            if (rnd.Next(2)\
  \ > 0)\n            {\n                sb.Append(sentences[rnd.Next(sentences.Length)]);\n\
  \                sb.Append(' ');\n            }\n        }\n        if (rnd.Next(20)\
  \ > 15)\n        {\n            _sentencesBC.Add(sb.ToString());\n        }\n  \
  \      else\n        {\n            _sentencesBC.Add(sb.ToString().ToUpper());\n\
  \        }\n    }\n    // 消费者生产者工作已完成\n    _sentencesBC.CompleteAdding();\n}\n```\n\
  \n\n\n\n\n`Main` 方法创建了 `BlockingCollection` 实例，如如下行所示，将集合的最大容量设为 `NUM_SENTENCES`：`_sentencesBC\
  \ = new BlockingCollection<string>(NUM_SENTENCES);`。\n\n`BoundedCapacity` 属性持有集合指定的最大容量。一旦集合达到此值，如果有另一个添加项的请求，生产者任务或线程将会被阻塞。这意味着生产者任务或线程将一直等待，直到某个项被移除。这种边界能力对于控制内存中集合的最大尺寸非常有用，特别是当你需要处理海量元素时。你不需要在生产者和消费者之间使用共享标志或添加同步代码，因为\
  \ `BlockingCollection` 提供了特定的功能来帮助处理这些场景。每个消费者将尝试从集合中移除元素，直到生产者的集合的 `IsCompleted`\
  \ 属性为 `true`。示例 4-8 所示的示例在 `while` 循环中使用了一个条件来检查 `IsCompleted` 属性的布尔值，如下行所示：\n\n\
  ```csharp\n// 此条件在循环中运行（自旋）效率非常低\n// 此示例使用这种自旋是为了教学目的\n// 这不是最佳实践\n// 后续章节和章节将解释改进后的版本\n\
  while (!_sentencesBC.IsCompleted)\n```\n\n在生产者调用 `BlockingCollection` 实例的 `CompleteAdding`\
  \ 方法后，`IsAdding` 属性将被设置为 `true`，如下所示：`_sentencesBC.CompleteAdding();`。当 `IsAdding`\
  \ 为 `true` 且集合为空时，`IsCompleted` 属性将被设置为 `true`。当 `IsCompleted` 为 `true` 时，意味着集合已由生产者标记为完成，并且没有更多项可以提供给消费者了。这样，当生产者调用\
  \ `CompleteAdding` 时，它可以告诉消费者它已经完成了工作。代码更简单了，因为消费者只需要检查一个属性 `IsCompleted` 的值即可知道是否继续。然而，你可以使用其他方法来避免在\
  \ `while` 循环中检查此条件所引入的低效率。接下来的示例将改进示例 4-8 中所示的代码。\n\n在这种情况下，代码使用句子总数来建立边界容量；但是，你可以使用较小的数字来减少内存消耗。以下代码行显示了三个\
  \ `BlockingCollection` 实例的定义，使用 `NUM_SENTENCES / 20` 作为边界容量。\n\n![download](img/download.gif)\n\
  \n```csharp\n_sentencesBC = new BlockingCollection<string>(NUM_SENTENCES / 20);\n\
  _capWordsInSentencesBC = new BlockingCollection<string>(NUM_SENTENCES / 20);\n_finalSentencesBC\
  \ = new BlockingCollection<string>(NUM_SENTENCES / 20);\n\n// 异常处理应该改进以避免潜在的死锁\n\
  Parallel.Invoke(\n    () => ProduceSentences(),\n    () => CapitalizeWordsInSentences(),\n\
  \    () => RemoveLettersInSentences(),\n    () =>\n    {\n        foreach(var sentence\
  \ in _finalSentencesBC.GetConsumingEnumerable())\n        {\n            Console.WriteLine(sentence);\n\
  \        }\n    });\n```\n\n代码段是 Snippet 4_5。这意味着 `ProduceSentences` 方法向 `_sentencesBC`\
  \ 添加的句子不会超过 `NUM_SENTENCES / 20`。然后，当它调用 `Add` 方法时，它将等待直到某个项被移除。这样，生产者将需要更少的内存，但由于额外的同步，代码运行时间可能会更长。`_finalSentencesBC`\
  \ 生成的集合需要总容量，因为 `Parallel.Invoke` 添加了一个新的消费者。你可以使用 `GetConsumingEnumerable` 方法来替换每个消费者的\
  \ `while` 循环，该循环会移除元素直到生产者的集合属性为 `true`。以下代码行显示了两个消费者 `CapitalizeWordsInSentences`\
  \ 和 `RemoveLettersInSentences` 的新版本：\n\n![download](img/download.gif)\n\n```csharp\n\
  private static void CapitalizeWordsInSentences()\n{\n    char[] delimiterChars =\
  \ { '.', ':', ';', '(', ')', '[', ']', '{', '}', '/', '?', '@', '\\t', '”' };\n\
  \    foreach (var sentence in _sentencesBC.GetConsumingEnumerable())\n    {\n  \
  \      _capWordsInSentencesBC.Add(CapitalizeWords(delimiterChars, sentence, '\\\\\
  '));\n    }\n    // 告诉消费者生产者的工作已完成\n    _capWordsInSentencesBC.CompleteAdding();\n\
  }\n\nprivate static void RemoveLettersInSentences()\n{\n    char[] letterChars =\
  \ { 'A', 'B', 'C', 'e', 'i', 'j', 'm', 'X', 'y', 'Z' };\n    foreach (var sentence\
  \ in _capWordsInSentencesBC.GetConsumingEnumerable())\n    {\n        _finalSentencesBC.Add(RemoveLetters(letterChars,\
  \ sentence));\n    }\n    // 告诉消费者生产者的工作已完成\n    _finalSentencesBC.CompleteAdding();\n\
  }\n```\n\n\n\n\n\n这两个消费者的新版本都更加简单且高效。只要可能，你必须避免不必要的自旋（spinning）。\n\n默认情况下，`BlockingCollection`\
  \ 封装了一个 `ConcurrentQueue`。不过，你可以在构造函数中指定不同类型的并发集合。元素的顺序会发生变化，但用于添加和删除元素的方法将保持不变，如前所述。以下几行显示了在\
  \ `sentencesBC` `BlockingCollection` 中封装 `ConcurrentStack`：\n\n![download](img/download.gif)\n\
  \n```csharp\nsentencesBC = new BlockingCollection<string>(new ConcurrentStack<string>(),\
  \ NUM_SENTENCES / 20);\n```\n\n代码片段为 Snippet 4_7\n\n通过这种方式，`sentencesBC` 将代表一个 LIFO（后进先出）并发集合。不需要更改为此集合添加和删除元素的代码，因为\
  \ `BlockingCollection` 封装了底层的并发集合。\n\n### 在 BlockingCollection 上取消操作\n\n通过许多 `BlockingCollection`\
  \ 实例实现的生产者-消费者场景可能运行很长时间。因此，提供一种中断其执行的机制是一个好主意。你可以通过取消令牌来实现这一点，正如你之前在第 3 章“命令式任务并行”中学习\
  \ `Task` 实例时学的那样。\n\n![note](img/note.gif)\n\n如前所述，`BlockingCollection` 提供了许多不同的替代方案来消费生产者产生的元素，而不需要复杂的同步机制。然而，请记住，这种并发集合的实现错误可能会导致任务无限等待。\n\
  \nListing 4-9 显示了支持取消的 `ProduceSentences` 方法的新版本代码。\n\n![download](img/download.gif)\n\
  \nListing 4-9: 为 `ProduceSentences` 方法添加了取消支持，以及在 `Main` 方法中发送取消信号的更改\n\n```csharp\n\
  private static void ProduceSentences(System.Threading.CancellationToken ct)\n{\n\
  \    string[] possibleSentences =\n    { \n        \"ConcurrentBag is included in\
  \ the Systems.Concurrent.Collections namespace.\",\n        \"Is parallelism important\
  \ for cloud-computing?\",\n        \"Parallelism is very important for cloud-computing!\"\
  ,\n        \"ConcurrentQueue is one of the new concurrent collections added in .NET\
  \ Framework 4\",\n        \"ConcurrentStack is a concurrent collection that represents\
  \ a LIFO collection\",\n        \"ConcurrentQueue is a concurrent collection that\
  \ represents a FIFO collection\" \n    };\n\n    var rnd = new Random();\n    for\
  \ (int i = 0; i < NUM_SENTENCES; i++)\n    {\n        var sb = new StringBuilder();\n\
  \        string newSentence;\n        for (int j = 0; j < possibleSentences.Length;\
  \ j++)\n        {\n            if (rnd.Next(2) > 0)\n            {\n           \
  \     sb.Append(possibleSentences[rnd.Next(possibleSentences.Length)]);\n      \
  \          sb.Append(' ');\n            }\n        }\n        if (rnd.Next(20) >\
  \ 15)\n        {\n            newSentence = sb.ToString();\n        }\n        else\n\
  \        {\n            newSentence = sb.ToString().ToUpper();\n        }\n    \
  \    try\n        {\n            if (!sentencesBC.TryAdd(newSentence, 200, ct))\n\
  \            {\n                throw new TimeoutException(\"sentencesBC took more\
