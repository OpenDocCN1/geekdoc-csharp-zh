  \ + number.ToString());\n```\n代码片段为 Listing2_11\n\n在这种情况下，性能与其他版本相比并不理想。在与之前示例相同的硬件配置下，该方法运行几乎需要\
  \ 16 秒。这不是一种优化实现，因为代码必须遍历序列中的 100,000 个项目。虽然它是并行执行的，但比运行开销更小的循环耗时长。它还消耗更多的内存。此示例的目的并不是提供这种情况的最佳实践，而是为了帮助你理解\
  \ `Parallel` 类方法提供的不同机会，并在不同场景下对其评估。\n\n问题部分在于 `Enumerable` 的实际迭代是顺序执行的。所有支持 `Parallel.ForEach`\
  \ 启动的任务执行的线程在访问迭代器时都被强制序列化。你可以创建一个能够执行静态范围划分的自定义分区器来避免这种序列化。\n\n## 退出并行循环\n\n如果你想中断顺序循环，可以使用\
  \ `break` 语句。但在处理并行循环时，退出委托主体方法脱离了传统的循环结构并在每次新迭代时被调用。\n\n[列表 2-12] 显示了 `ParallelForEachGenerateMD5Hashes`\
  \ 方法的新版本，命名为 `ParallelForEachGenerateMD5HashesBreak`。\n\n```csharp\n// 列表 2-12：具有退出循环能力的\
  \ ParallelForEachMD5Hashes 方法的新版本\nprivate static void DisplayLoopResult(ParallelLoopResult\
  \ loopResult)\n{\n    string text;\n    if (loopResult.Completed)\n    {\n     \
  \   text = \"循环运行完毕.\";\n    }\n    else\n    {\n        if (loopResult.LowestIteration.HasValue)\n\
  \        {\n            text = \"循环通过调用 Break 语句结束。\";\n        }\n        else\n\
  \        {\n            text = \"循环通过 Stop 语句提前结束。\";\n        }\n    }\n    Console.WriteLine(text);\n\
  }\n\nprivate static void ParallelForEachMD5HashesBreak()\n{\n    var sw = Stopwatch.StartNew();\n\
  \    var inputData = GenerateMD5InputData();\n    var loopResult = Parallel.ForEach(inputData,\n\
  \    (int number, ParallelLoopState loopState) =>\n    {\n        // 在循环刚开始做这些价值很小，\n\
  \        // 因为循环本身在调用主体委托之前\n        // 已经检查了相同的条件\n        // 因此，接的 if 语句看起来像被注释了\n\
  \        // if (loopState.ShouldExitCurrentIteration)\n        // {\n        //\
  \     return;\n        // }\n        var md5M = MD5.Create();\n        byte[] data\
  \ =\n            Encoding.Unicode.GetBytes(\n            Environment.UserName +\
  \ number.ToString());\n        byte[] result = md5M.ComputeHash(data);\n       \
  \ string hexString = ConvertToHexString(result);\n        // Console.WriteLine(\"\
  MD5 HASH: {0}\", hexString);\n        if (sw.Elapsed.Seconds > 3)\n        {\n \
  \           loopState.Break();\n            return;\n        }\n    });\n    DisplayLoopResult(loopResult);\n\
  \    Debug.WriteLine(\"MD5: \" + sw.Elapsed.ToString());\n}\n```\n\n现在，本地变量 `loopResult`\
  \ 保存了调用 `Parallel.ForEach` 类的结果。此外，委托主体接收一个 `ParallelLoopState` 实例作为第二个参数：\n\n```csharp\n\
  var loopResult = Parallel.ForEach(inputData,\n(int number, ParallelLoopState loopState)\
  \ =>\n```\n\n### 理解 ParallelLoopState\n\n`ParallelLoopState` 实例提供了两个方法来停止 `Parallel.For`\
  \ 或 `Parallel.ForEach` 的执行：\n\n*   Break —— 这通知并行循环应尽快停止当前迭代之后的执行。如果在调用 `Break`\
  \ 时正在处理第 100 次，循环将处理所有小于 100 的迭代。\n*   Stop —— 这通知并行循环应尽快停止执行。如果在调用 `Stop` 时正在处理第\
  \ 100 次，循环不保证处理所有小于 100 的迭代。\n\n`Break` 与顺序语义更为接近，即如果你在第 100 次迭代时使用 `break`，你知道小于\
  \ 100 的迭代已经处理完毕。\n\n[列表 2-12] 显示的代码在通过时间超过 3 秒时调用了 `Break` 方法：\n\n```csharp\nif\
  \ (sw.Elapsed.Seconds > 3)\n{\n    loopState.Break();\n    return;\n}\n```\n\n注意\
  \ lambda 委托体中的代码访问了 `ParallelForEachMD5HashesBreak` 中定义的 `sw` 变量。它读取 `Seconds` 只读属性的值。\n\
  \n你还可以检查 `ShouldExitCurrentIteration` 只读属性的值，以便在收到停止并行循环执行请求时做出决策。该请求可能由当前或其他并发迭代发出。[列表\
  \ 2-12] 包含了以下注释行，用于检查 `ShouldExitCurrentIteration` 是否为真：\n\n```csharp\nif (loopState.ShouldExitCurrentIteration)\n\
  {\n    return;\n}\n```\n\n\n\n\n\n如果上述条件为真，它将退出方法，并避免执行不需要的迭代。这些行被注释掉是因为在这种情况下，增加额外的一次迭代并没有问题；因此，没有必要在每次迭代中添加这些指令。如果你希望当另一个力量导致循环提前退出时允许循环更早结束，你只需要在长时间运行的迭代中间执行此。\n\
  \n![note](img/note.gif)\n\n取消并行循环的请求也可以来自外部，以取消（cancellation）的形式出现。第 3 章解释了如何处理取消操作。\n\
  \n### 分析并行循环执行的结果\n\n一旦 `Parallel.ForEach` 完成执行，`loopResult` 将以 `ParallelLoopResult`\
  \ 结构的形式提供有关结果的信息。\n\n列表 2-12 中所示 `DisplayParallelLoopResult` 方法接收一个 `ParallelLoopResult`\
  \ 结构，评估其只读属性，并在控制台中显示执行 `Parallel.ForEach` 循环的结果。表 2-1 解释了此示例中考虑的三种可能情况。\n\n表 2-1:ParallelLoopResult\
  \ 的只读属性\n\n| 条件 | 解释 |\n| :--- | :--- |\n| `(IsCompleted)` | 循环运行完成。 |\n| `((!IsCompleted)\
  \ && (!LowestBreakIteration.HasValue))` | 循环通过 `Stop` 语句提前结束。 |\n| `((!IsCompleted)\
  \ && (LowestBreakIteration.HasValue))` | 循环通过调用 `Break` 语句结束。`LowestBreakIteration`\
  \ 属性持有调用 `Break` 语句的最低迭代的值。 |\n\n![note](img/note.gif)\n\n如果循环循环体可能调用过 `Break` 或\
  \ `Stop`，那么分析并行循环执行的结果是非常重要的。继续执行下一个语句并不意味着它在执行 `Break` 或 `Stop` 之后完成了所有迭代。因此，有必要检查\
  \ `ParallelLoopResult` 属性的值，或者在循环体内部包含自定义的控制机制。在所有其他情况下，如果并行循环在没有抛出异常的情况下完成，则所有迭代都已完成。如果它确实抛出了异常，则没有\
  \ `ParallelLoopResult` 可以检查。再次，将顺序代码转换为并行并发代码不仅仅是替换几个循环。你需要理解一种完全不同的编程范式以及为这种新场景准备的结构。记住应用第\
  \ 1 章中解释的所有概念。\n\n### 捕获并行循环内部发生的异常\n\n由于许多迭代是并行运行，许多异常可能会并行发生。在顺序代码中使用的经典异常管理技术对于并行循环并不不可用。\n\
  \n当在每个并行迭代中调用的委托内部代码抛出未在委托内部被捕获的异常时，它将成为一组异常的一部分。新的 `System.AggregateException`\
  \ 类处理了这组异常。\n\n你已经知道如何在顺序代码中处理异常，并且可以将几乎相同的技术应用到你的并行代码中。唯一的区别是当在循环体（这是一个委托）内部抛出异常时。列表\
  \ 2-13 显示了 `ParallelForEachGenerateMD5Hashes` 方法的新版本，称为 `ParallelForEachGenerateMD5HashesException`。\n\
  \n![download](img/download.gif)\n\n列表 2-13:使用 ParallelForEachGenerateMD5Hashes 方法抛出和处理异常\n\
  \n```cpp\nprivate static void ParallelForEachGenerateMD5HashesException()\n{\n \
  \   var sw = Stopwatch.StartNew();\n    var inputData = GenerateMD5InputData();\n\
  \    var loopResult = new ParallelLoopResult();\n    try\n    {\n        loopResult\
  \ = Parallel.ForEach(inputData, \n        (int number, ParallelLoopState loopState)\
  \ =>\n        {\n            //if (loopState.ShouldExitCurrentIteration)\n     \
  \       //{\n            //    return;\n            ////}\n            var md5M\
  \ = MD5.Create();\n            byte[] data =\n                Encoding.Unicode.GetBytes(\n\
  \                Environment.UserName + number.ToString());\n            byte[]\
  \ result = md5M.ComputeHash(data);\n            string hexString = ConvertToHexString(result);\n\
  \            //Console.WriteLine(\"MD5 HASH: {0}\", hexString);\n            if\
  \ (sw.Elapsed.Seconds > 3)\n            {\n                throw new TimeoutException(\n\
  \                \"Parallel.ForEach is taking more than 3 seconds to complete.\"\
  );\n            }\n        });\n    }\n    catch (AggregateException ex)\n    {\n\
  \        foreach (Exception innerEx in ex.InnerExceptions)\n        {\n        \
  \    Debug.WriteLine(innerEx.ToString());\n            //Do something considering\
  \ the innerEx Exception\n        }\n    }\n    DisplayParallelLoopResult(loopResult);\n\
  \    Debug.WriteLine(\"MD5: \" + sw.Elapsed.ToString());\n}\n```\n\n现在，如果通过时间超过\
  \ 3 秒，循环体将抛出 `TimeoutException`：\n\n![download](img/download.gif)\n\n```cpp\nif\
  \ (sw.Elapsed.Seconds > 3)\n{\n    throw new TimeoutException(\n    \"Parallel.ForEach\
  \ is taking more than 3 seconds to complete.\");\n}\n```\n\n`try` 块封装了对 `Parallel.ForEach`\
  \ 的调用。然后而不是传统的 `catch (Exception)` 子句，接的 catch 捕获了异常：\n\n```cpp\ncatch (AggregateException\
  \ ex)\n```\n\n`AggregateException` 包含了执行并行并发代码期间发生的一个或多个异常。因此，一旦被捕获，就可以遍历 `InnerExceptions`\
  \ 只读集合中的每个异常。在这种情况下，没有使用自定义分区的 `Parallel.ForEach` 将显示许多异常。循环结果看起来是使用 `Stop` 关键字停止的。然而，由于可以捕获\
  \ `AggregateException`，你可以根据导致无法完成所有迭代的问题做出决策。在这种情况下，顺序 `foreach` 循环检索 `Exception`\
  \ 中的所有信息。\n\n```cpp\ncatch (AggregateException ex)\n{\n    foreach (Exception innerEx\
  \ in ex.InnerExceptions)\n    {\n        Debug.WriteLine(innerEx.ToString());\n\
  \        //Do something considering the innerEx Exception\n    }\n}\n```\n\n列表 2-14\
  \ 显示了前两个异常转换为字符串并发送到控制台的信息。这两个异常向控制台显示相同的信息。然而，大多数时候，你将使用更复杂的异常管理技术，并就产生问题的迭代提供更多信息。\n\
  \n此示例专注于 `AggregateException` 与传统 `Exception` 之间的区别。它并不推崇将错误信息写入控制台输出作为完整的异常管理技术。事实上，你将在后续章节中处理更复杂的示例。\n\
