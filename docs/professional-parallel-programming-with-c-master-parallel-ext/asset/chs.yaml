  \n![9.7](img/c09f007.jpg)\n\n列表 9-4 中所示的代码指定了 `fileAddresses` 字符串数组中要下载的文件的 URL。此外，应用程序使用默认的硬编码位置\
  \ `C:\\FILES` 来保存这些文件。要运行此代码，你必须将要下载的文件地址替换为你有访问的 URL，然后指定你所需的文件夹。\n\n当你点击“开始下载”按钮时，`butDownloadFiles_Click`\
  \ 事件处理程序中的代码会调用 `CreateToken` 方法。该方法创建一个新的 `CancellationTokenSource` (`cts`)，然后将其令牌分配给私有的\
  \ `CancellationToken`  `ct`。这个 `CancellationToken` 允许用户通过结合任务能力和 EAP 操作的取消功能来取消异步下载操作。该代码使用了之前解释过的\
  \ `uiScheduler` `TaskScheduler` 来运行必须在适当同步上下文中更新控件的任务。\n\n该代码清空了提供下载文件状态信息的 `lstStatus`\
  \ 列表框（ListBox），并启用了 `butCancel` 按钮（Button）。然后，代码创建并执行了一个新的 `Task`，在 UI 线程之外启动多个下载。\n\
  \n此任务为 `fileAddresses` 字符串数组中的每个地址启动一个 `Task<string>`。一个 `foreach` 循环为每个文件地址调用 `DownloadFileInTask`\
  \ 方法，然后将该方法返回的 `Task<string>` 添加到 `_downloadTasks` 中。每个 `Task<string>` 从地址中解码文件名，通过异步执行下载文件，并将其保存到本地路径。代码将一个新的\
  \ `Uri` 和私有的 `CancellationToken` `ct` 传递给 `DownloadFileInTask` 方法。该方法可以访问 `ct`，因为它是一个私有变量；但是示例展示了如何使用此方法实现可能在不同作用范围内运行的取消功能；因此，该方法接收\
  \ `CancellationToken` 作为参数。\n\n如果下载成功，`DownloadFileInTask` 方法将生成的文件名字符串存储在它的 `Result`\
  \ 属性中。如果发生任何错误，`Task<string>` 将持有适当的状态。代码操作 `Task<string>` 以表示封装的 EAP 实现所完成的工作。\n\
  \n然后，代码使用 `ContinueWith` 方法调度一个后续任务，以分析前一个 `downloadTask` 的状态，该状态在操作委托中被接收为 `t`。此后续任务在创建\
  \ `lstStatus` 控件的 UI 线程中运行，因为对 `ContinueWith` 方法的调用指定了 `uiScheduler` 作为使用的 `TaskScheduler`\
  \ 来调度此操作的执行，如下：\n\n![下载](img/download.gif)\n\n```csharp\ndownloadTask.ContinueWith(\n\
  \    (t) =>\n    {\n        string line = \"\";\n        if (t.IsCanceled)\n   \
  \     {\n            line = \"Canceled.\";\n        }\n        else if (t.IsFaulted)\n\
  \        {\n            foreach (Exception innerEx in t.Exception.InnerExceptions)\n\
  \            {\n                line += innerEx.Message;\n            }\n      \
  \  }\n        else\n        {\n            line = t.Result;\n        }\n       \
  \ lstStatus.Items.Add(line);\n    }, uiScheduler);\n```\n代码片段来自 代码 9_6\n\n`DownloadFileInTask`\
  \ 方法使用 `TaskCompletionSource` 提供的方法将方法返回的 `Task<string>` 转换到真实状态。因此，此后续任务可以分析其任务的\
  \ `IsCanceled` 和 `IsFaulted` 属性，以便向 `lstStatus` 框写入相关下载的状态信息。\n\n最后，事件处理程序中的代码创建了一个新的\
  \ `TaskFactory` (`uiTF`)，它使用 `uiScheduler` 作为其 `TaskScheduler`：\n\n```csharp\nvar\
  \ uiTF = new TaskFactory(uiScheduler);\n```\n\n因此，使用 `uiTF` 创建的实例将在创建需要更新的控件的 UI\
  \ 线程中运行。当 `foreach` 循环创建并调度所有下载任务时，代码使用 `uiTF.ContinueWhenAll` 在所有这些任务完成异步操作的执行后调度一个后续任务。为\
  \ `ContinueWhenAll` 指定的操作将在新任务中运行，但在 UI 线程中执行。事件处理程序中的代码不会等待这个新后续任务的完成；因此，UI 线程中没有更多代码在运行，用户可以使用\
  \ UI 控件。\n\n\n\n\n\n*   `TrySetResult` — 转换到 `TaskStatus.RanToCompletion` 并将接收到的参数结果绑定到任务的\
  \ `Result` 属性上。\n\n上述方法返回一个布尔值，指示尝试是否成功。你可以通过使用这些方法控制 `Task<TResult>` 的消费者端，并简化必须将许多操作封装为\
  \ `Task<TResult>` 部分的代码。\n\n如果文件不存在，代码将创建一个新的 `System.Net.WebClient` 实例 (`wc`)，并注册一个在\
  \ `ct` 取消时会被调用的委托程序。当 `ct` 取消时，该委托程序将调用 `wc` 的 `CancelAsync` 方法（如果它尚未被销毁）。这使得任务取消机制能够传播到\
  \ EAP 异步操作中。然后，委托程序将调用 `tcs` 的 `TrySetCanceled` 方法，尝试将 `TaskStatus.Canceled` 设置到底层的\
  \ `Task<string>`，如下所示：\n\n![下载](img/download.gif)\n\n```\nct.Register(\n    () =>\n\
  \    {\n        if (wc != null)\n        {\n            wc.CancelAsync();\n    \
  \        tcs.TrySetCanceled();\n        }\n    }\n);\n```\n来自 Snippet9_9 的代码片段\n\
  \n然后，代码声明了一个 `AsyncCompletedEventHandler` (`handler`) 并将其初始化为 `null`。这使得代码能够在委托程序内部引用\
  \ `handler` 以处理异步下载操作的完成。代码将调用实现之前解释的 EAP 模式的 `DownloadFileAsync` 方法。\n\n以下代码片段定义了在异步下载完成时运行的委托程序：\n\
  \n![下载](img/download.gif)\n\n```\nhandler =\n    (hSender, hE) =>\n    {\n     \
  \   if (hE.Error != null)\n        {\n            tcs.TrySetException(hE.Error);\n\
  \        }\n        else if (hE.Cancelled)\n        {\n            tcs.TrySetCanceled();\n\
  \        }\n        else\n        {\n            tcs.TrySetResult(fileName);\n \
  \       }\n        // 注销回调\n        wc.DownloadFileCompleted -= handler;\n    };\n\
  ```\n来自 Snippet9_10 的代码片段\n\n该委托程序接收众名的对象 `sender` 和 `AsyncCompletedEventArgs` `e`\
  \ 参数。由于代码写在另一个事件中，委托程序使用 `hSender` 和 `hE` 作为这些参数的名称，而不是经典名称。代码分析异步下载的结果并调用 `tcs`\
  \ 的相应方法，将操作的实际状态传输到底层的 `Task<string>`。最后，代码注销了自身作为 `DownloadFileCompleted` 事件的回调。记住注销回调以避免意外的泄漏。\n\
  \n当代码定义处理异步下载完成的委托程序时，`handler` 必须绑定到 `wc` 的 `DownloadFileCompleted` 事件上，如下：\n\n\
  ```\nwc.DownloadFileCompleted += handler;\n```\n\n然后，代码调用 `DownloadFileAsync` 方法开始异步下载。该方法会立即返回，因为它具有异步执行特性，并且之前绑定的回调将在下载完成时运行。然而，当代码调用\
  \ `DownloadFileAsync` 方法时可能会出现问题；因此，对该方法的包含包含在 `try...catch` 块中。如果抛出异常，`catch` 块将注销\
  \ `DownloadFileCompleted` 事件的回调，然后调用 `tcs` 的 `TrySetException` 方法将异常绑定到底层的 `Task<string>`，如下所示：\n\
  \n![下载](img/download.gif)\n\n```c\ntry\n{\n    wc.DownloadFileAsync(address, fileName);\n\
  }\ncatch (Exception ex)\n{\n    wc.DownloadFileCompleted -= handler;\n    tcs.TrySetException(ex);\n\
  }\n```\n来自 Snippet9_11 的代码片段\n\n无论是否发生异常，代码都会返回与 `TaskCompletionSource<string>`\
  \ `tcs` 关联的底层 `Task<string>`，可以通过其 `Task` 属性访问：\n\n```\nreturn tcs.Task;\n```\n\n\
  此 `Task<string>` 代表 EAP 异步下载，并具有额外的行为，即将状态信息设置到此 `Task<string>` 实例。异步下载的结果被传播到底层的\
  \ `Task<string>`。\n\n![注意](img/note.gif)\n\n不需要为 `DownloadFileAsync` 方法返回的新 `Task<string>`\
  \ 调用 `Start` 方法，因为 `TaskCompletionSource<string>` 实例启动了底层的 `Task<string>`。事实上，如果你对与\
  \ `TaskCompletionSource<TResult>` 实例关联的底层 `Task` 实例调用 `Start` 方法，代码将抛出异常。\n\n当你首次运行应用程序并点击“开始下载文件”按钮时，异步下载会将文件名添加到\
  \ `lstStatus` ListBox 中。如果所有下载成功，ListBox 中将显示“All downloads completed!”。图 9-8 显示了三次下载的结果。\n\
  \n\n\n\n\n* 当你使用 `Task.Factory.FromAsync` 执行异步 I/O 密集型负载时，线程资源仅将用于处理执行结果。\n* 你可以通过操作\
  \ `TaskCompletionSource<TResult>` 实例，将复杂异步操作的结果传播到底层任务。\n\n# 第 10 章：并行测试与调优\n\n\
  ## 本章主要内容\n\n* 准备并行测试\n* 使用 Visual Studio 2010 性能剖析功能\n* 测量和可视化并发性\n* 识别常见的并行性能问题\n\
  * 检测序列化执行问题\n* 识别各种锁竞争场景\n* 使用并发垃圾回收机制\n\n本章介绍了 Visual Studio 2010 专业版和 Ultimate\
  \ 版中引入的新型剖析功能。在本章中，你将学习如何使用这些新的剖析功能来检测与 .NET Framework 4 并行化代码相关的常见问题。性能分析会话将为你提供宝贵的反馈以优化代码。本章解释了用于剖析并行代码的各种技术，并教你如何根据每次分析会话的结果重构现有应用程序。\n\
  \n## 准备并行测试\n\n当你向现有的串行应用程序添加并行性，或从头开始创建一个新的并行算法时，你必须运行必要的测试以确保你的应用程序提供了以下特性：\n\n\
  * **正确性** —— 并行化程序的执行应始终导致正确的结果。第 1 章“基于任务的编程”介绍了当不同代码段与并发代码一起运行时，正确性的重要性。\n* **预期的加速**\
  \ —— 在能够运行真实并发执行的某些硬件上，并行化程序的运行速度应该比其串行版本更快。你应该测试并行化程序在特定的多核硬件上是否实现了预期的加速。\n* **随核心数增加的可扩展性**\
  \ —— 并行化程序应该准备好利用可用的额外核心。第 2 章“命令式数据并行”解释了如何衡量并行化代码提供的加速和可扩展性。然而，在某些情况下，算法具有内置的上限。\n\
  * **与单核硬件的兼容性** —— 如果要求指定应用程序可以在单核计算机上运行，那么当逻辑核心数为 1 时，并行化程序也应该运行。此外，并行化程序在单核计算机上运行时不应增加不必要的开销。通常情况下，这是一个重要要求。\n\
  \n![note](img/note.gif)\n\n如果你决定并行化应用程序必须在具有最小逻辑核心数的计算机上运行，你必须指定此项要求。此外，你可以添加代码在应用程序启动时测试此项要求。你不希望应用程序在尝试并行运行代码时抛出异常，因为其假设了可用最小数量的核心。\n\
  \n当你测试并行化应用程序时，你必须确保它在各种目标硬件配置上都能提供正确性。你应该在具有不同核心数的环境中遵循你传统的测试程序。然而，你通常无法访问应用程序应运行的所有可能的硬件配置。\n\
  \n例如，如果你的应用程序能够在从 1 个逻辑核心到 20 个逻辑核心的计算机上提供合理的可扩展性，那么理想的测试将要求你在几十种硬件配置上运行应用程序。然而，除非你有巨大的预算，否则你无法在许多不同的计算机上运行应用程序。因此，结合带有虚拟技术的不同计算机通常可以提供必要的环境数量，确保应用程序满足之前列出的要求。\n\
  \n假设你有以下三种不同的硬件配置来测试你的应用程序：\n\n* 带有 2 个逻辑核心的双核 CPU\n* 带有 8 个逻辑核心的四核 CPU\n* 带有 20\
  \ 个逻辑核心的十核 CPU\n\n假设你主要感兴趣的是检查应用程序在有一、二、三、四、六和八个核心下的行为。然而，你还想在其他超过 8 个核心的随机配置下测试应用程序。你可以使用虚拟化创建以下额外环境来测试你的应用程序：\n\
  \n* 在双核 CPU 上虚拟化的 1 个逻辑核心\n* 在四核 CPU 上虚拟化的 3 个逻辑核心\n* 在十核 CPU 上虚拟化的 6 个逻辑核心\n* 在十核\
  \ CPU 上虚拟化的 10 个逻辑核心\n* 在十核 CPU 上虚拟化的 16 个逻辑核心\n\n某些虚拟化工具无法生成上述环境。这些环境基于 `VirtualBox\
  \ 3.2.x`，它允许你创建带有最多 32 个逻辑核心的虚拟机。如果你同时考虑真实环境和虚拟化环境，你将能够在在 表 10.1 中列出的真实和虚拟化环境中测试你的应用程序。此表显示了所有可能性的随机子集。\n\
  \nTable 10.1: 测试并行化应用程序的环境\n\n| 环境类型 | 应用程序的逻辑核心数 | 底层物理 CPU |\n| :--- | :--- |\
  \ :--- |\n| 虚拟化 | 1 | 带有 2 个逻辑核心的双核 CPU |\n| 真实物理核心 | 2 | 带有 2 个逻辑核心的双核 CPU |\n\
  | 虚拟化 | 3 | 带有 8 个逻辑核心的四核 CPU |\n| 真实物理核心 | 4 | 带有 8 个逻辑核心的四核 CPU |\n| 虚拟化 | 6 |\
  \ 带有 20 个逻辑核心的十核 CPU |\n| 真实物理核心 | 8 | 带有 8 个逻辑核心的四核 CPU |\n| 虚拟化 | 10 | 带有 20 个逻辑核心的十核\
  \ CPU |\n| 物理核心不足的虚拟化 | 16 | 带有 20 个逻辑核心的十核 CPU |\n| 真实逻辑核心 | 20 | 带有 20 个逻辑核心的十核\
  \ CPU |\n\n通过在这些九种环境中进行测试，你将对应用程序的可扩展性和正确性有一个良好的了解。然而，这些计算机中使用的多核处理器的架构可能是不同的。例如，假设双核\
  \ CPU 拥有 2MB 共享 L3 缓存，而十核 CPU 拥有 10MB 共享 L3 缓存。当你在十核 CPU 上运行测试时，额外的 8MB L3 缓存对应用程序性能有巨大影响。因此，如果你想测试可扩展性，使用相同硬件的不同数量虚拟化核心是一个好主意。然而，这并不一定为你提供准确的可扩展性数字，因为某些算法具有内置上限。\n\
  \n例如，你可以使用十核 CPU 在虚拟机中使用 1 到 10 个核心运行相同的应用程序。现代虚拟化软件允许你指定分配给虚拟机的核心数，你可以生成脚本来更改此虚拟机设置并自动化测试。由于你有\
  \ 10 个物理核心，当你获得这 10 次测试的结果时，你将对应用程序真实的扩展扩展性有一个良好的了解。此外，你还可以运行 11 到 20 个核心的测试，但你必须考虑到这些额外的核心并不代表真实的物理核心。第\
  \ 2 章在“逻辑核心不是物理核心”一节中解释了逻辑核心和物理核心之间的区别。首先检查应用程序在真实物理核心上的性能，然后衡量 CPU 提供的额外逻辑核心带来的收益。\n\
  \n\n\n\n然后，你可以在不同的计算机上进行测试，以检查不同架构下的结果。通过执行这些测试，你将对应用程序的性能有一个良好的了解。这些测试中的一个或多个测试应该为你提供一个基准（baseline）。\n\
  \n![note](img/note.gif)\n\n在你获得一个可测量且可重复的基准后，你可以优化你的应用程序，并测试每个新版本带来的新性能。基准是你可以作为比较同一应用程序不同版本的依据的性能指标。请记住使用发布生成（release\
  \ builds）来定义基准并生成每个新版本。发布生成包含了所有的优化。\n\n在获得基准后，你就可以分析并调整你的应用程序以优化性能。然而，不要忘记，你的应用程序在每个新的优化版本中都必须提供正确性。因此，你必须为每个新版本运行正确性测试。\n\
  \n由于基准应该是可测量且可重复的，在测试性能时，禁用某些微处理器提供的加速模式（turbo modes）是一个好主意。例如，`Intel Turbo Boost\
  \ Technology` 很难衡量并行代码的加速。有时并行代码的运行速度可能比其顺序版本慢，因为 `Intel Turbo Boost Technology`\
  \ 可以让后者以比前者更高的时钟频率运行。因此，如果你使用启用了 `Intel Turbo Boost Technology` 的微处理器，你将需要注意该技术引入的变化。\n\
  \n第 1 章在“使用共享内存多核”节中解释了现代共享内存多核架构。加速模式可能会扭曲你的加速测量。因此，你可以在禁用加速模式的情况下运行所有测试，然后启用此模式以检查其益处。\n\
  \n在 Windows 的 32 位和 64 位版本中，都有简单的方法来启用和禁用 `Intel Turbo Boost Technology` 等加速模式。你可以使用\
  \ `TMonitor`这是一个由 `CPID` 开发的免费工具。你只需要从 [www.cpuid.com](http://www.cpuid.com) 下载相应的版本，并运行压缩的可执行文件\
  \ `TMonitor32.exe` 或 `TMonitor64.exe`。然后，右键点击 `TMonitor` 窗口，从显示的右键键菜单中选择 `Turbo`，然后点击\
  \ `Disable`。图 10-1 显示了 `TMonitor` 右键菜单，它允许你控制支持此加速模式的微处理器中的 `Intel Turbo Boost Technology`。当你想要启用加速模式时，可以重复此步骤并点击\
  \ `Enable`。\n\nFigure 10-1\n\n![10.1](img/c10f001.jpg)![note](img/note.gif)\n\n\
  如果你在虚拟化环境中运行测试，你必须在主机操作系统中禁用和启用加速模式。主机操作系统可以控制底层硬件。\n\n你可以在许多硬件配置下测试你的并发代码，但这并不意味着它在所有可能的并发执行路径中都能提供正确性。第\
  \ 5 章“协调数据结构”解释了竞态条件（race conditions）。你可能花费几个月的时间在许多硬件配置上运行复杂的并行算法以提供正确性。然而，由于竞态条件，复杂的算法在某些并发场景下仍可能产生意料之外的结果。竞态条件非常难以检测。\n\
  \n存在竞态检测器可以分析你的代码来预测潜在的竞态条件。这些竞态检测器使用多种算法来分析不同的并发执行路径以及代码中使用的同步原语。\n\n遗憾的是，在本文写作时，还没有基于代码分析的\
  \ C# 竞态检测器能够支持 `.NET Framework 4` 引入的新类型协调数据结构。然而，你可以期待未来 `Visual Studio` 版本、第三方工具以及插件的改进，它们将在接下来的几个月内为并发代码提供静态和/或动态分析。\n\
  \n## 使用性能剖析功能\n\nVisual Studio 2010 Premium 和 Ultimate 版本支持许多性能剖析功能。这些功能对于检测可并化的热点或已经并行但需要进一步优化的函数非常有用。例如，插桩分析（instrumentation\
  \ profiling）方法允许你测量函数调用次数和耗时。\n\n![note](img/note.gif)\n\n当你需要知道应用程序大部分时间花花在哪里，并寻找影响应用程序性能的频繁调用函数时，插桩分析方法非常有用。\n\
  \n后续章节将介绍一些新的剖析方法，这些方法对于分析并行应用程序的行为非常有帮助。当你有一个运行并发代码的应用程序并想知道底层发生了什么时，可以使用这些方法。然而，你必须理解，每种剖析方法都会给现有的应用程序带来开销。因此，如果你只是想测量运行特定算法所需的时间，你应该运行应用程序的发布版本而不使用任何剖析方法。\n\
  \n![note](img/note.gif)\n\n并发可视化器提供的剖析方法需要 `Windows Vista`、`Windows 7`、`Windows\
  \ Server 2008` 或 `Windows Server 2008 R2`。\n\n在使用剖析方法之前，你必须遵循以下前提：\n\n*   你必须以系统管理员身份启动\
  \ `Visual Studio 2010`。在 `Windows Server 2008 R2` 或 `2008` 中，如果你已以 `Administrator`\
  \ 身份登录机器，可以直接运行 `Visual Studio 2010`。但在 `Windows 7` 或 `Windows Vista` 中，你可以通过右键点击\
  \ `Visual Studio 2010` 快捷方式并在菜单中选择“以管理员身份运行”来以管理员身份启动 `Visual Studio 2010`。\n\n\
  *   由于基于 `.NET Framework 4` 的代码调用 Windows 函数，你必须访问 Windows `.pdb` 符号文件才能获得最佳结果。符号文件的最简单配置是使用\
  \ `Microsoft Symbol Servers` 并将其缓存在本地文件夹。在 `Visual Studio` 主菜单中选择 `工具 → 选项 → 调试\
  \ → 符号`，IDE 将显示符号选项。激活 `Microsoft Symbol Servers` 复选框。然后，在你的本地驱动器上创建一个文件夹来缓存这些符号文件，并在“在此目录缓存符号”中指定该文件夹。图\
  \ 10-2 显示了配置了符号选项，从 `Microsoft Symbol Servers` 下载 `.pdb` 文件并缓存到 `C:\\Symbols` 文件夹。在运行后续章节的示例之前，在“自动加载符号”下选择“所有模块，排除外”，然后点击\
  \ `确定`。\n\nFigure 10-2\n\n![10.2](img/c10f002.jpg)\n\nIDE 需要连接互联网以从 `Microsoft Symbol\
  \ Servers` 下载必要的符号文件。在你将这些文件放入缓存文件夹后，可以在没有互联网连接的情况下运行剖析方法。然而，互联网连接可以确保你始终拥有最新版本的必要符号文件。当你尝试运行剖析方法时缺少符号文件的必要配置，IDE\
