  \ `ConvertToHexString` 方法。通过 `Parallel Stacks` 窗口中 `Threads` 视图显示的新堆栈帧，可以很容易地理解调用路径。分配用于支持两个任务执行的线程正在运行\
  \ `Program.ConvertToHexString` 方法，其中包括当前任务，其后续语句在代码窗口中用黄色箭头显示。\n\n```text\nFigure\
