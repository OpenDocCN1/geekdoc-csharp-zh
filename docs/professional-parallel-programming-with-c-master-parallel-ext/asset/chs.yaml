  \ TValue>` |\n\n# 协调数据结构\n\n`CoordinationDataStructures` 文件夹包含了提供新的同步和异步协调数据结构、并发集合以及数据处理功能的类。图\
  \ [2](https://wiki.example.org/fig2) 显示了 `CoordinationDataStructures` 文件夹中的以下类：\n\
  \n*   `ProducerConsumerCollectionBase<T>` —— 为封装其他生产者-消费者集合提供基实现。这是一个抽象类。`T` 指定集合中元素的类型。\n\
  *   `ObjectPool<T>` —— 提供线程安全的对象池。`T` 指定池中元素的类型。\n*   `ObservableConcurrentCollection<T>`\
  \ —— 提供用于绑定的线程安全并发集合。`T` 指定集合中元素的类型。\n*   `TransferStream` —— 为生产者-消费者场景实现可写流。\n\
  \n图 [3](https://wiki.example.org/fig3) 显示了 `CoordinationDataStructures` 文件夹中的以下类：\n\
  \n*   `ActionCountdownEvent` —— 当 `CountdownEvent` 零时运行由委托指定的操作。\n*   `ConcurrentPriorityQueue<TKey,\
  \ TValue>` —— 提供线程安全的优先级队列数据结构。`TKey` 指定用于优先排序值的键，`TValue` 决定队列元素的类型。\n*   `ObservableConcurrentDictionary<TKey,\
  \ TValue>` —— 提供用于绑定的线程安全并发字典。`TKey` 指定字典中的键类型，`TValue` 决定值的类型。\n*   `Pipeline`\
  \ —— 提供流水线数据处理支持。它使用 `ThreadPerTaskScheduler`，使得代表阶段的任务尽可能使用不同的线程。该类支持自定义并行度。\n\
  *   `Pipeline<TInput, TOutput>` —— 提供流水线数据处理支持。`TInput` 指定管道输入数据的类型，`TOutput` 决定管道阶段的输出数据。该类支持取消和自定义并行度。它使用\
  \ `Pipeline` 类中定义的 `ThreadPerTaskScheduler`。\n*   `ReductionVariable<T>` —— 为参与计算的多线程提供一个归约变量。`T`\
  \ 指定聚合的数据和积累值的类型。该类为每个线程的值使用线程本地存储。该类对于执行 Map Reduce 算法中的归约计算有用。\n*   `SerialTaskQueue`\
  \ —— 表示一个必须顺序启动和执行的有序任务队列。该类允许你按 LIFO 顺序队列任务，并检查任务的执行状态。\n*   `SpinLockClass` 为\
  \ `SpinLock` 结构体提供引用类型包装器。\n\n\n\n\n\n- `ThreadSafeRandom` — 表示线程安全的伪随机数生成器。该类是\
  \ `Random` 的子类，并重写了 `Next`、`NextDouble` 和 `NextBytes` 方法。该类使用 `System.Security.Cryptography.RNGCryptoServiceProvider`\
  \ 作为伪数生成器的种子提供程序，并使用 `Random` 类的一个实例作为每个线程线程本地存储中随机性的底层提供程序。当你需要在不同线程中生成伪随机数时，此类非常有用。\n\
  \n图 C-3\n\n![3.1](img/b03f003.jpg)\n\n图 C-4 显示了 `CoordinationDataStructures\\AsyncCoordination`\
  \ 文件夹内以下类的类图：\n\n- `AsyncCache<TKey, TValue>` — 缓存异步接收到的数据。`TKey` 指定缓存键的类型，`TValue`\
  \ 决定缓存值的类型。该类使用任务来异步生成每个缓存的值。该类提供一个枚举器来访问缓存的内容。\n\n- `HtmlAsyncCache` — 为下载的 HTML\
  \ 提供异步缓存。它是 `AsyncCache<Uri, string>` 的子类，并使用 `WebClientExtensions` 类中定义的 `DownloadStringTask`\
  \ 方法。`WebClientExtensions` 类包含在 `Extensions\\EAP` 文件夹中。\n\n- `AsyncBarrier` — 提供一个异步屏障。当一轮操作完成时，它会信号一个任务。\n\
  \n- `AsyncCall<T>` — 允许你异步调用每个发布项的处理器。`T` 指定由实例发布的数据类型。该类是 `MarshalByRefObject`\
  \ 的子类。\n\n- `AsyncCall` — 为创建 `AsyncCall<T>` 实例提供静态工厂方法。\n\n- `AsyncProducerConsumerCollection<T>`\
  \ — 提供一个异步生产者-消费者集合。`T` 指定存储在集合中的元素类型。该类使用 `AsyncSemaphore` 来跟踪异步工作。\n\n- `AsyncReaderWriter`\
  \ — 提供排斥读者、并发读者以及排斥写器的异步执行。你可以指定所需的 `TaskFactory` 来初始化 `AsyncReaderWriter` 实例。\n\
  \n- `AsyncSemaphore` — 提供一个异步信号量。\n\n图 C-4\n\n![3.1](img/b03f004.jpg)\n\n# 扩展\n\n\
  `Extensions` 文件夹包含了提供了新新扩展方法的类，用于为现有类和接口添加功能。图 C-5 显示了 `Extensions` 文件夹内以下类的类图：\n\
  \n- `AggregateExceptionExtensions` — 为 `AggregateException` 添加扩展方法。\n\n- `BlockingCollectionExtensions`\
  \ — 为 `BlockingCollection` 添加扩展方法。\n\n- `CancellationTokenExtensions` — 为 `CancellationToken`\
  \ 添加扩展方法。\n\n- `CompletedTask` — 提供对已完成执行的 `Task` 实例的访问。当你无法使用 `StartNew` 时，可以访问已完成的任务来使用\
  \ `ContinueWith` 重载。\n\n- `CompletedTask<TResult>` — 提供对已完成执行的 `Task<TResult>` 实例的访问。\n\
  \n- `DelegateBasedObserver<T>` — 此内部类实现了 `IObserver<T>` 并允许你定义三个操作：`OnCompleted`、`OnError`\
  \ 和 `OnNext`。\n\n- `DelegateExtensions` — 为委托添加并行扩展：用于 `Delegate` 的 `ParallelDynamicInvoke`、用于\
  \ `Action` 的 `WithFailFast` 以及用于 `Func<T>` 的 `WithFailFast<T>`。\n\n- `LazyExtensions`\
  \ — 为 `Lazy<T>` 和 `Task<T>` 添加与 `Lazy` 相关的扩展方法。\n\n- `LinqToTasks` — 实现针对任务的主要标准查询运算符。该类为\
  \ `Task` 实例提供了 LINQ 支持。\n\n- `ParallelLinqExtensions` — 为 PLINQ 添加了以下公共扩展方法：\n\n\
  \    - `AsParallel<TSource>` — 允许你定义一个 `ParallelLinqOptions` 实例来定义 PLINQ 。`TSource`\
  \ 指定输入元素的类型。\n\n    - `MapReduce<TSource, TMapped, TKey, TResult>` — 实现 Map Reduce\
  \ 操作。`TSource` 指定源元素的类型。`TMapped` 表示映射元素的类型，`TKey` 指定元素键的类型，`TResult` 定义了结果的类型。\n\
  \n    - `OutputToProducerConsumerCollection<TSource>` — 执行查询并将结果输出到实现 `IProducerConsumerCollection<TSource>`\
  \ 的目标集合。`TSource` 指定源和目标元素的类型。\n\n    - `TakeTop<TSource, TKey>` — 获取顶部的元素，就像它们已经排序一样。该方法使用指定的函数从源中的每个元素中提取键。该方法使用包含在\
  \ `Utils` 文件夹中的 `SortedTopN<TKey, TValue>` 为每个线程维护一个排序列表，以便跟踪每个线程的最佳 N 个元素。`TSource`\
  \ 指定源元素的类型。`TKey` 指定元素键的类型。\n\n    - `ParallelLinqOptions` — 提供带有 PLINQ 选项。\n\n\
  - `ParallelOptionsExtensions` — 为 `ParallelOptions` 提供 `ShallowClone` 扩展方法。该方法返回\
  \ `ParallelOptions` 实例的浅拷贝。\n\n- `ProducerConsumerCollectionExtensions` — 为 `IProducerConsumerCollection`\
  \ 添加扩展方法。\n\n- `TaskCompletionSourceExtensions` — 为 `TaskCompletionSource` 添加以下公共扩展方法：\n\
  \n    - `SetFromTask<TResult>` — 此方法的两种定义将 `Task` 或 `Task<TResult>` 的结果传输到 `TaskCompletionSource`。`TResult`\
  \ 指定结果类型。\n\n    - `TrySetFromTask<TResult>` — 此方法的两种定义提供了上述功能，但它们返回一个指示是否成功的布尔值。\n\
  \n- `TaskExtrasExtensions` — 为 `Task` 添加以下公共扩展方法：\n\n    - `AttachToParent` — 该方法确保在调用此方法的任务实例完成之前，父任务不会转换到\
  \ `RanToCompletion` 。即使调用此方法的 Task 实例不是子任务，该方法也能确保此条件。\n\n    - `ContinueWith` —\
  \ 此方法的四个定义使用指定的 `TaskFactory` 实例创建延续任务。\n\n    - `FailFastOnException` — 此方法的两种定义在\
  \ `Task` 实例遇到异常时立即失败。这些方法创建一个仅在任务故障时运行的延续任务，并在 Windows 事件日志中写入消息后调用 `Environment.FailFast`\
  \ 方法立即终止进程。\n\n    - `IgnoreExceptions` — 此方法的两种定义抑制 `Task` 实例的默认异常处理。这些方法创建一个仅在任务故障时运行的延续任务。防止异常上升到终结器线程。\n\
  \n    - `PropagateExceptions` — 此方法的两种定义传播 `Task` 实例或 `Task` 数组上发生的任何异常。\n\n   \
  \ - `ToAsync` — 此方法的两种定义创建并返回一个新的 `Task` 或 `Task<TResult>` 实例，代表调用 `ToAsync` 的 `Task`\
  \ 实例的完成。这些方法在调用 `ToAsync` 的任务实例完成时调度指定的 `AsyncCallback`。\n\n    - `ToObservable<TResult>`\
  \ — 此方法创建并返回一个 `IObservable<TResult>`，代表调用此方法的 Task 实例的完成。\n\n    - `WaitForCompletionStatus`\
  \ — 该方法等待 `Task` 实例完成其执行，并返回该 `Task` 实例 `Status` 属性的 `TaskStatus` 值。当你想要等待任务但不想让\
  \ `Wait` 方法抛出异常时，此方法非常有用。\n\n\n\n\n\n- `WaitWithPumping` — 此方法旨在帮助 WPF 应用程序的测试程序。该方法进入一个消息循环，该循环在\
  \ `Task` 实例完成执行时退出。该方法添加了一个延续项以退出消息循环。你可以使用此方法在 WPF 应用程序的 UI 线程中等待任务完成，而不会阻塞该线程。此方法允许你在任务执行期间保持应用程序的响应性。\n\
  - `WithTimeout` — 该方法的两种定义创建并返回一个新的 `Task` 或 `Task<TResult>` 实例，该实例克隆了调用 `WithTimeout`\
  \ 的 `Task` 或 `Task<TResult>` 实例。新任务将在参数指定的超时后被取消。\n- `TaskSchedulerExtensions` —\
  \ 为 `TaskScheduler` 添加了一个新的扩展方法。新的 `ToSynchronizationContext` 扩展方法获取并返回一个针对 `TaskScheduler`\
  \ 实例的 `SynchronizationContext`。\n\n图 C-5\n\n![3.1](img/b03f005.jpg)\n\n图 C-6 显示了\
  \ `CoordinationDataStructures\\APM` 子文件夹内以下类的类图：\n\n- `FileAsync` — 此类提供了 `File`\
  \ 类成员的异步对应项。\n- `StreamExtensions` — 此类定义了用于处理异步流的扩展方法。这些扩展方法适用于 `Stream` 类。\n-\
  \ `WebRequestExtensions` — 此类定义了用于处理异步 Web 请求的扩展方法。这些扩展方法适用于 `WebRequest` 类。\n\n\
  图 C-6\n\n![3.1](img/b03f006.jpg)\n\n图 C-7 显示了 `CoordinationDataStructures\\EAP`\
  \ 子文件夹内以下类的类图：\n\n- `PingExtensions` — 此类定义了用于异步处理 `Ping` 类的扩展方法。\n- `SmtpClientExtensions`\
  \ — 此类定义了用于异步处理 `SmtpClient` 类的扩展方法。\n- `WebClientExtensions` — 此类定义了用于异步处理 `WebClient`\
  \ 类的扩展方法。\n\n图 C-7\n\n![3.1](img/b03f007.jpg)\n\n`CoordinationDataStructures\\TaskFactoryExtensions`\
  \ 子文件夹包含了许多文件，用于为 `TaskFactoryExtensions` 类添加方法。由于该类被定义为部分类（partial class），每个文件都添加了一个或多个带有\
  \ `Task` 类扩展方法的静态方法。图 C-8 显示了以下公共静态方法的类图：\n\n- `Create` — 定义在 `TaskFactoryExtensions_Create.cs`\
  \ 中。该方法的 12 种定义使用 `TaskFactory` 创建新的 `Task` 实例。多样化的定义允许你使用 `TaskFactory` 以不同的选项创建任务。\n\
  - `FromAsync` — 定义在 `TaskFactoryExtensions_FromAsync.cs` 中。该方法创建一个新的 `Task` 实例，该实例将在指定的\
  \ `WaitHandle` 收到信号时完成。\n- `FromException` — 定义在 `TaskFactoryExtensions_From.cs`\
  \ 中。该方法的三个定义创建一个新的 `Task` 或 `Task<TResult>` 实例，该实例在 `TaskStatus.Faulted` 最终状态下带有指定的\
  \ `Exception` 已完成。这些扩展方法在需要模拟 `Task` 实例中的异常时对测试非常有用。`TResult` 定义了结果的类型。\n- `FromResult<TResult>`\
  \ — 定义在 `TaskFactoryExtensions_From.cs` 中。该方法的两种定义创建一个新的 `Task` 或 `Task<TResult>`\
  \ 实例，该实例在 `TaskStatus.RanToCompletion` 最终状态下带有指定的 `TResult` 已完成。这些扩展方法在需要模拟 `Task`\
  \ 实例中的某些结果时对测试非常有用。当你已经有了结果但需要以 `Task` 实例的形式返回数据时，它们也有用。`TResult` 定义了结果的类型。\n- `GetTargetScheduler`\
  \ — 定义在 `TaskFactoryExtensions_Common.cs` 中。该方法的两种定义获取并返回用于调度任务的 `TaskScheduler`\
  \ 实例。\n- `Iterate` — 定义在 `TaskFactoryExtensions_Iterate.cs` 中。该方法的 10 种定义允许对枚举的\
  \ `Task` 实例进行异步迭代，并具有多种选项。你可以在迭代器中使用这些方法，在其中编写一个作为异步方法执行的 `iterate`。\n- `StartNewDelayed`\
  \ — 定义在 `TaskFactoryExtensions_Delayed.cs` 中。该方法的 18 种定义创建一个新的 `Task` 或 `Task<TResult>`\
  \ 实例，该实例将在指定的延迟后在 `TaskStatus.RanToCompletion` 最终状态下完成。这些扩展方法在需要模拟某些需要时间完成的 `Task`\
  \ 实例行为时对测试非常有用。`TResult` 定义了结果的类型。\n- `ToGeneric<TResult>` — 定义在 `TaskFactoryExtensions_Common.cs`\
  \ 中。该方法从非泛型创建一个泛型的 `TaskFactory<TResult>` 实例。`TResult` 定义了结果的类型。\n- `ToNonGeneric<TResult>`\
  \ — 定义在 `TaskFactoryExtensions_Common.cs` 中。该方法从泛型创建一个非泛型的 `TaskFactory` 实例。`TResult`\
  \ 定义了结果的类型。\n- `TrackedSequence` — 定义在 `TaskFactoryExtensions_TrackedSequence.cs`\
  \ 中。该方法异步执行 `Task` 实例序列并维护所有处理实例的列表。\n- `WhenAll` — 定义在 `TaskFactoryExtensions_ContinueAll.cs`\
  \ 中。该方法的两种定义创建一个延续项，在任务集合完成后运行。当集合中的所有任务完成执行时，该延续项将运行。\n- `WhenAny` — 定义在 `TaskFactoryExtensions_ContinueAll.cs`\
  \ 中。该方法的两种定义创建一个延续项，在任务集合中的任一任务完成后运行。当任务集合中至少有一个任务完成时，该延续项将运行。\n\n图 C-8\n\n![3.1](img/b03f008.jpg)\n\
  \n# 并行算法\n\n`ParallelAlgorithms` 文件夹包含了许多文件，用于为 `ParallelAlgorithms` 类添加方法。由于该类被定义为部分类，每个文件都添加了常用操作的并行算法静态方法。图\
  \ C-9 显示了带有以下公共静态方法的图：\n\n- `Filter<T>` — 定义在 `ParallelAlgorithms_Filter.cs` 中。该方法的两种定义通过对输入列表的每个元素运行谓词来过滤列表。这些方法返回一个新列表，包含输入列表中所有通过过滤的元素。`T`\
  \ 指定输入列表中存储元素类型。\n- `For` — 定义在 `ParallelAlgorithms_For.cs` 中。该方法的两种定义执行 `for` 循环，其中迭代可以并行运行。这些方法允许你使用\
  \ `BigInteger` 值作为起始索引（包含）和结束索引（不包含）来运行并行 `for`。\n- `ForRange` — 定义在 `ParallelAlgorithms_ForRange.cs`\
  \ 中。该方法的 12 种定义在范围上执行循环，其中迭代可能会并行运行。所有这些定义都返回一个 `ParallelLoopResult` 结构。\n- `InclusiveScanInPlaceParallel<T>`\
  \ — 定义在 `ParallelAlgorithms_Scan.cs` 中。使用指定的函数在数组上计算并行包含前缀扫描。该方法用结果覆盖接收到的参数数据。`T`\
  \ 指定数组中存储元素类型。\n\n\n\n\n\n* `Map<TInput, TOutput>` — 定义在 `ParallelAlgorithms_Map.cs`\
  \ 中。该方法的两种定义并行执行 map 操作。map 操作包括通过为每个元素调用指定的转换函数，将一个输入列表转换为输出列表。`TInput` 指定输入数据的类型，`TOutput`\
  \ 决定输出数据。这些方法对于在 Map Reduce 算法中执行映射非常有用。\n* `ParallelWhile` — 定义在 `ParallelAlgorithms_While.cs`\
  \ 中。该方法的两种定义在指定条件评估为真时重复并行执行某个操作。\n* `Reduce<T>` — 定义在 `ParallelAlgorithms_Reduce.cs`\
  \ 中。该方法的四种定义使用指定的聚合操作归约输入数据并返回归约值。归约操作必须满足结合律和交换律。`T` 指定聚合数据和累加值的类型。这些方法对于在 Map\
  \ Reduce 算法中执行归约计算非常有用。\n* `Scan<T>` — 定义在 `ParallelAlgorithms_Scan.cs` 中。该方法的两种定义使用指定的函数对源枚举进行并行前缀扫描（parallel\
  \ prefix scan），并返回扫描操作的结果。`T` 指定存储在源枚举中的元素类型。这些方法定义了一个通用的实现。在大多数情况下，当你处理非常小的函数（如加法）时，针对特定类型和操作的专用版本将比这种泛型前缀扫描提供更好的性能。\n\
  * `ScanInPlace<T>` — 定义在 `ParallelAlgorithms_Scan.cs` 中。该方法的两种定义使用指定的函数对数组进行并行前缀扫描。这些方法用结果覆盖作为参数接收的数据。`T`\
  \ 指定存储在数组中的元素类型。这些方法定义了并行前缀扫描的通用实现。在大多数情况下，当你处理非常小的函数（如加法）时，针对特定类型和操作的专用版本将比这种泛型前缀扫描提供更好的性能。\n\
  * `Sort<T>` 和 `Sort<TKey, TValue>` — 定义在 `ParallelAlgorithms_Sort.cs` 中。这些方法的八种定义能够并行排序数组。这些定义允许你指定自定义的比较器、开始排序的索引以及要排序的元素数量。在\
  \ `Sort<T>` 中，`T` 指定数组中数据的类型。在 `Sort<TKey, TValue>` 中，`TKey` 指定键数组的类型，`TValue` 决定项目数组的类型。\n\
  * `SpeculativeFor<TResult>` — 定义在 `ParallelAlgorithms_SpeculativeFor.cs` 中。该方法的两种定义为范围内的每个值执行一个函数，返回获得的结果并停止执行。`TResult`\
  \ 指定返回数据的类型。\n* `SpeculativeForEach<TSource, TResult>` — 定义在 `ParallelAlgorithms_SpeculativeForEach.cs`\
  \ 中。该方法的两种定义为源枚举中的每个元素执行一个函数，返回获得的结果并停止执行。`TSource` 指定要处理的输入元素的类型，`TResult` 指明返回数据的类型。\n\
  * `SpeculativeInvoke<T>` — 定义在 `ParallelAlgorithms_SpeculativeInvoke.cs` 中。该方法的两种定义调用指定的函数（可能并行执行），在其中一个函数执行完成后取消仍在执行的调用，并返回完成执行函数的结果。`T`\
  \ 指定返回数据的类型。\n* `Wavefront` — 定义在 `ParallelAlgorithms_Wavefront.cs` 中。该方法的两种定义并行处理矩阵，其中每个单元格都对其上方和左侧的单元格有依赖。其中一种定义需要定义单元格块以划分原始矩阵，并根据这些块调用指定的操作。另一种定义则为每个单元格调用指定的操作。\n\
  * `WhileNotEmpty<T>` — 定义在 `ParallelAlgorithms_WhileNotEmpty.cs` 中。该方法的两种定义通过为每个项目调用操作来并行处理源枚举数据。这些方法允许处理函数添加更多待处理的数据。这些方法使用两个\
  \ `ConcurrentStack` 实例来管理线程安全的源栈和目标栈。\n\n图 C-9\n\n![3.1](img/b03f009.jpg)\n\n# 分区器\
  \ (Partitioners)\n\nPartitioners 文件夹包含两个公共类，它们提供静态方法来创建自定义分区。图 C-10 显示了 Partitioners\
  \ 文件夹内以下两个公共类及其相关的私有类和内部类的类结构图：\n\n* `ChunkPartitioner` — 提供三个公共静态方法，根据用户提供的标准将枚举划分为分块（chunks）。`Create<TSource>`\
  \ 方法的每个实现都返回一个 `ChunkPartitioner<TSource>`，在图 C-10 中显示为 `ChunkPartitioner<T>`。`TSource`\
  \ 是分区数据的类型。\n* `SingleItemPartitioner` — 提供一个公共静态方法，一次划分一个数据源。`Create<T>` 方法返回一个\
  \ `OrderablePartitioner<T>`。`T` 是枚举中包含的数据类型。\n\n图 C-10\n\n![3.1](img/b03f010.jpg)\n\
  \n# 任务调度器 (Task Schedulers)\n\nTaskSchedulers 文件夹包含 13 个 `TaskScheduler` 的实现，提供了多种类型的调度器以及支持这些调度器的额外类。图\
  \ C-11 显示了 TaskSchedulers 文件夹内以下类的类结构图：\n\n* `LimitedConcurrencyLevelTaskScheduler`\
  \ — 在 `ThreadPool` 之上运行并限制并发级别。有必要设置此调度器期望的最大并行度。\n* `OrderedTaskScheduler` — 确保一次只有一个任务在执行。任务按入队顺序执行（FIFO）。它是\
  \ `LimitedConcurrencyLevelTaskScheduler` 的子类，向基类构造函数传递了 `1` 作为参数。\n* `ConcurrentExclusiveInterleave`\
  \ — 提供并发和排斥调度器。\n* `CurrentThreadTaskScheduler` — 在当前线程上运行任务。\n* `IOCompletionPortTaskScheduler`\
  \ — 使用 I/O 完成端口控制并发。这需要设置调度器中并发执行的最大线程数以及调度器执行任务所需的可用线程数。\n* `IOTaskScheduler` —\
  \ 针对 I/O `ThreadPool`。\n* `QueuedTaskScheduler` — 对公平性、优先级以及用于任务的底层线程提供控制。它提供了许多不同参数的构造函数，允许你控制创建和用于处理工作项目的线程。\n\
  * `ReprioritizableTaskScheduler` — 修改已入队任务的优先级。\n* `RoundRobinSchedulerGroup` —\
  \ 允许创建一个支持轮询调度以实现公平性的调度器组。\n* `RoundRobinTaskSchedulerQueue` — 使用轮询算法调度任务。\n* `StaTaskScheduler`\
  \ — 使用单线程单元 (STA) 线程以支持任务的执行。此任务调度器允许你使用带有 STA 组件的任务。你需要设置此调度器可以使用的最大线程数。\n* `SynchronizationContextTaskScheduler`\
  \ — 针对构造函数参数中指定的 `SynchronizationContext`。\n* `ThreadPerTaskScheduler` — 每个任务分配一个线程。当你需要尽可能让每个任务在不同的线程中运行时，此调度器特别有用。\n\
  \n\n\n\n\n- `WorkStealingTaskScheduler` — 提供了一个工作窃取任务调度器。其默认参数指定的线程数是逻辑核心数的两倍，以支持任务的执行。然而，也可以指定调度器中使用的线程数。该调度器使用\
  \ `WorkStealingQueue<Task>`。\n\n图 C-11A\n\n![3.1](img/b03f011a.jpg)\n\n图 C-11B\n\
