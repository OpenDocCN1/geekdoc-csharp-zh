  \ 实例向 `_keysQueue` 添加元素，并被存储在 `tasksHexStrings` 数组中。因此，每当 `ValidateKeys` 方法中的 `while`\
  \ 循环决定是否继续时，检查所有这些 `Task` 实例的状态将变得复杂且低效。因此，在将 AES 密钥转换为字符串的新 `Task` 启动之前，私有变量 `tasksHexStringsRunning`\
  \ 会增加。每当这个 `Task` 实例完成时，私有变量 `tasksHexStringsRunning` 就会减小。这样，如果 `_keysQueue` 中没有更多元素且\
  \ `tasksHexStringsRunning` 为零，那么最终的消费者就可以停止执行。随后的章节将解释其他并发集合，它们允许你避免在消费者中对该条件进行低效评估。\n\
  \n由于许多任务可能并发或并行启动或完成，你必须确保此共享变量中的两个操作都是作为原子操作执行。在创建并启动每个新的 `Task` 实例之前，调用 `System.Threading.Interlocked.Increment`\
  \ 会以原子操作增加 `tasksHexStringsRunning` 变量的值。该方法通过引用接收 `tasksHexStringsRunning`。一旦任务完成，它会在\
  \ `finally` 块中通过调用相同参数的 `System.Threading.Interlocked.Decrement` 来确保以原子操作减少 `tasksHexStringsRunning`\
  \ 变量的值。然而，你仍然需要为这些生产者和消费者添加更多的异常处理。以下代码行确保了 `tasksHexStringsRunning` 的值代表了并发运行 `ConvertAESKeysToHex`\
  \ 方法的 `Task` 实例真实数量：\n\n```\nSystem.Threading.Interlocked.Increment(ref tasksHexStringsRunning);\n\
  tasksHexStrings[i] = Task.Factory.StartNew(() =>\n{\n    try\n    {\n        ConvertAESKeysToHex(taskAESKeys);\n\
  \    }\n    finally\n    {\n        System.Threading.Interlocked.Decrement(ref tasksHexStringsRunning);\n\
  \    }\n});\n```\n代码段见列表 4_5\n\n## 使用并发集合设计流水线\n\n有时，`ConcurrentQueue` 并不是特定生产者-消费者场景中最方便的并发集合。事实上，它很容易变成瓶颈，因为它必须维护先入先出（FIFO）顺序。接下来的章节将解释其他适用于生产者-消费者场景以及线性或非线性流水线的有用并发集合。你还可以结合不同的并发集合来生成最合适的结果并简化你的代码。在实现生产者-消费者场景之前，请务必阅读涵盖\
  \ `BlockingCollection` 节的章节。\n\n一个完美的线性流水线其阶段数量应该与可用逻辑核心数相同，且每个阶段所需的工作量也应该是相同的。然而，这种流水线在现实生活中并不常见。大多数情况下，你需要测试不同的替代方案，并将某些作业分组到特定数量的阶段中。还要记住，流水线应该随着逻辑核心数量的增加而具有扩展性，并且与算法的顺序执行相比能够提供加速。\n\
  \n想象一个需要执行以下任务以模拟新宇宙的流水线：\n\n*   生成行星。\n*   生成卫星。卫星需要相关行星的数据。\n*   生成彗星。模拟彗星的轨道必须避免与行星及其卫星碰撞。\n\
  *   生成小行星。模拟的小行星将影响行星，但必须避免与行星卫星以及彗星碰撞。\n*   生成地形。地形模拟必须考虑小行星的影响。\n*   生成大气。大气模拟必须考虑小行星影响行星地形时产生。\n\
  *   生成天气状况。模拟的天气状况必须考虑大气、地形、小行星的影响、卫星以及行星的组成。\n\n你可以通过创建一个具有许多生产者和消费者的七阶段线性流水线来链起这些任务。[图\
  \ 4-5] 显示了四阶段线性流水线的不同分组方案之一，并用条形图表示每个阶段执行的总工作量。如果你并发启动这四个阶段且你有四个物理核心，那么这种组合并不是负载均衡的。[图\
  \ 4-6] 显示了另一个浪费大量处理时间的分组方案。\n\n\n\n\n所以，你还需要测试另一种分组方式，并尝试平衡每个阶段的负载。图 4-7 显示了最终的分组。它在第一阶段运行四个作业，在其他三个阶段中的每个阶段各运行一个作业。大多数情况下，很难预测在流水线中执行不同顺序作业作业的性能，因为后台运行的所有同步机制增加的额外开销可能会导致意料之外的最终分组。\n\
  \n图 4-7\n\n![4.7](img/c04f007.jpg)\n\n四阶段流水线可以利用四个以上的逻辑核心。正如之前解释的，每个阶段都可以并行化运行，以利用所有可用核心。然而，测试不同的场景同样重要，以确保每个阶段的并行化确实能带来速度提升。\n\
  \n## ConcurrentStack\n\n`ConcurrentStack` 是完全无锁的。它永远不会获取锁，但当 `CAS` 操作失败并面临竞争时，它可能会陷入自旋并重试操作。`ConcurrentStack`\
  \ 是 `System.Collections.Stack` 的并发版本。它与之前解释的 `ConcurrentQueue` 非常相似，但它使用了不同的方法名来更好地表示栈（后进先出\
  \ LIFO 集合）。\n\n`ConcurrentStack` 包含以下三个重要方法（在图 4-8 中的图所示）：\n\n*   `Push` — 将接收到的参数作为新元素添加到栈顶。\n\
  *   `TryPop` — 尝试从栈顶移除元素，并将其返回到 `out` 参数中。它返回一个 `bool` 值，表示操作是否成功，且 `out` 参数包含从栈中移除的对象。\n\
  *   `TryPeek` — 尝试将栈顶的元素返回到 `out` 参数中，但不将其从队列中移除。它返回一个 `bool` 值，表示操作是否成功，且 `out`\
  \ 参数包含队列顶的对象。\n\n图 4-8\n\n![4.8](img/c04f008.jpg)\n\n为了确定栈是否包含任何项目，你可以使用 `IsEmpty`\
  \ `bool` 属性，而不是从 `Count` 属性获取项目数量并与 0 进行比较。例如，考虑以下条件：\n\n```csharp\nif (_byteArraysStack.Count\
  \ > 0)\n```\n\n你需要将其替换为以下代码，因为目标是确定 `_byteArraysStack` 是否为空，因此没有必要通过相对昂贵的 `Count`\
  \ 属性调用来获取项目数量：\n\n```csharp\nif (!_byteArraysStack.IsEmpty)\n```\n\n在大 O 表示法中，`IsEmpty`\
  \ 是 `O(1)`，即常量时间算法，而对于 `ConcurrentStack<T>`，`Count` 是 `O(n)`，需要线性时间。代码列表 4-6 显示了之前示例的新版本。在此列表中，已进行了必要的更改，使用许多\
  \ `ConcurrentStack` 实例代替 `ConcurrentQueue` 实例。此版本通常与之前的 `ConcurrentQueue` 版本相比实现了\
  \ 1.30 倍的速度提升。然而，请记住元素添加和移除的顺序与队列不同。有时，栈比队列更合适。\n\n![download](img/download.gif)\n\
  \n代码列表 4-6： 使用多个 `ConcurrentStack` 实例实现的流水线\n\n```csharp\nprivate static ConcurrentStack<Byte[]>\
  \ _byteArraysStack;\n\nprivate static ConcurrentStack<string> _keysStack;\n\nprivate\
  \ static ConcurrentStack<string> _validKeys;\n\nprivate static void ParallelPartitionGenerateAESKeys(int\
  \ maxDegree)\n{\n    var parallelOptions = new ParallelOptions();\n    parallelOptions.MaxDegreeOfParallelism\
  \ = maxDegree;\n    var sw = Stopwatch.StartNew();\n    Parallel.ForEach(\n    \
  \    Partitioner.Create(1, NUM_AES_KEYS + 1),\n        parallelOptions, range =>\n\
  \        {\n            var aesM = new AesManaged();\n            byte[] result;\n\
  \            Debug.WriteLine(\"AES Range ({0}, {1}. Time: {2})\", range.Item1, range.Item2,\
  \ DateTime.Now.OfDay);\n            for (int i = range.Item1; i < range.Item2; i++)\n\
  \            {\n                aesM.GenerateKey();\n                result = aesM.Key;\n\
  \                _byteArraysStack.Push(result);\n            }\n        });\n  \
  \  Debug.WriteLine(\"AES: \" + sw.Elapsed.ToString());\n}\n\nprivate static void\
  \ ConvertKeysToHex(Task taskProducer)\n{\n    var sw = Stopwatch.StartNew();\n \
  \   // 此条件在循环中运行（自旋）非常低效\n    // 此示例出于教学目的使用了这种自旋\n    // 这不是最佳实践\n    // 后续章节将解释改进版本\n\
  \    while (taskProducer.Status == TaskStatus.Running ||\n           taskProducer.Status\
