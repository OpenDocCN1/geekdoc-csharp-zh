  \n## 在源代码中查看线程\n\n在调试并发代码时，知道每个任务或线程将执行的下一个代码语句是非常重要的。这可以帮助你理解多个并发任务和线程正在做什么。你可以使用节节节引入的窗口来获取调试器中断时状况的清晰快照。然而，你必须选择每个方法上下文来检查每个线程及其被分配支持的任务的下一个语句。有时，知道其他线程是否正在你关注的相同方法中运行代码是有帮助的。`Show\
  \ Threads In Source`（在源代码中显示线程）选项在调试期间在源代码编辑器中提供此类信息。\n\n按照以下步骤理解上述选项提供的信息及其在源代码编辑器中的效果：\n\
  \n1. 转到源代码编辑器中的 `Main` 方法。点击调试程序工具栏上的 `Show Threads In Source` 选项按钮。你也可以通过右键点击 `Threads`\
  \ 窗口并在上下文菜单中选择同名的选项来激活此选项。源代码编辑器左侧的行槽（gutter）将在后续行显示线程标记，且代码将以不同的背景颜色显示（运行代码线程的默认背景颜色为灰色）：\n\
  \n```\ntAsync.Wait();\n```\n\n![note](img/note.gif)\n\n线程标记是一个像两个线程的图标：一个蓝色线程和一个红色线程。它表示在该处有一个已停止的线程。\n\
  \n2. 将鼠标悬停在线程标记上，提示框将显示停止线程的名称和 ID。图 7-40 显示了线程标记和提示框。\n\n3. 转到源代码编辑器中的 `ParGen`\
  \ 方法。源代码编辑器左侧的行槽将显示线程标记，代码将以不同的背景颜色显示（运行代码线程的默认颜色为灰色）：\n\n```csharp\nfor (int i\
  \ = 0; i < range.Item2; i++)\n{\n    Console.WriteLine(\"AES {0}, {1}\", i, DateTime.Now);\n\
  \    byte[] result = aesM.Key();\n    string hexString = ConvertToHexString(result);\n\
  }\n```\n\n4. 图 7-41 显示带有 `+` 符号的线程标记。该符号表示有多个线程。将鼠标悬停在一个线程标记上，提示框将显示停止线程的名称和 ID。图\
  \ 7-40 显示了 `aesM.Key()` 行的线程。\n\n5. 右键点击线程标记，将显示上下文菜单，包含两个子菜单：`Switch To`（切换到）和\
  \ `Flag`（标记）。这两个子菜单将显示停止线程的名称和 ID。你可以使用这些子菜单切换其中一个线程或标记它。图 7-42 显示了 `Switch To`\
  \ 子菜单中显示的项。\n\n6. 源代码编辑器中显示的线程标记代表线程。然而，很容易找到线程标记中的线程被分配给哪个任务。你可以使用上述上下文菜单切换到线程标记处停止的线程之一，这将\
  \ `Parallel Stacks` 窗口切换到其所分配的任务。图 7-43 显示了切换到 `5212` 工作线程的结果。任务 ID 号 `9` 成为 `Parallel\
  \ Stacks` 窗口的当前任务，因为它被分配给了活动线程。\n\n7. 完成应用程序执行，然后分析在之前的节中学习的不同窗口的变化。\n\n\n\n\n死锁是指至少两个任务在等待对方的情况，但这种等待永远不会结束，因为其中一个任务在另一个任务释放其对某些资源的保护之前，无法继续执行其指令。另一个任务也在等待其对应任务所持有的资源以恢复执行。由于没有任务愿意释放其保护，没有任何一个任务可以取得进展，它们将永远地互相等待下去。\n\
  \n考虑以下情况：任务 `t1` 持有对资源 `A` 的保护，并正在等待获取资源 `B` 的独占访问。与此同时，任务 `t2` 持有对资源 `B` 的保护，并正在等待获取资源\
  \ `A` 的独占访问。这是最糟糕的 Bug 之一。\n\nListing 7-1 显示了一个生成死锁的非常简单的应用程序的代码。这段代码并没有代表良好的实践，因为它做了许多你不应该应该做的事情。`Main`\
  \ 方法创建了两个任务 `t1` 和 `t2`，然后对它们都调用 `Start` 方法并等待它们完成执行。`t1` 运行 `CountTasks1` 方法，而\
  \ `t2` 调用 `CountTasks2`。\n\n![download](img/download.gif)\n\nListing 7-1: 一个生成死锁的糟糕代码应用程序\n\
  \n```csharp\nusing System;\nusing System.Collections.Generic;\nusing System.Linq;\n\
  using System.Text;\nusing System.Threading;\nusing System.Threading.Tasks;\nnamespace\
  \ DeadlockTest\n{\n    class Program\n    {\n        private static Object _sharedVariable1\
  \ = new Object();\n        private static Object _sharedVariable2 = new Object();\n\
  \        private static int _tasksCounter1;\n        private static int _tasksCounter2;\n\
  \        private static void CountTasks1()\n        {\n            lock (_sharedVariable1)\n\
  \            {\n                _tasksCounter1++;\n                Thread.Sleep(5000);\n\
  \                lock (_sharedVariable2)\n                {\n                  \
  \  _tasksCounter2++;\n                }\n            }\n        }\n        private\
  \ static void CountTasks2()\n        {\n            lock (_sharedVariable2)\n  \
  \          {\n                _tasksCounter2++;\n                Thread.Sleep(5000);\n\
  \                lock (_sharedVariable1)\n                {\n                  \
  \  _tasksCounter1++;\n                }\n            }\n        }\n        static\
  \ void Main(string[] args)\n        {\n            _tasksCounter1 = 0;\n       \
  \     _tasksCounter2 = 0;\n            var t1 = new Task(() => CountTasks1());\n\
  \            var t2 = new Task(() => CountTasks2());\n            t1.Start();\n\
  \            t2.Start();\n            Task.WaitAll(t1, t2);\n        }\n    }\n\
  }\n```\n\n`CountTasks1` 锁定了 `_sharedVariable1`。当它获取锁时，它增加了 `_tasksCounter1` 并让底层线程睡眠\
  \ 5000 毫秒（5 秒）。在这 5 秒内，`_sharedVariable1` 将处于锁定状态，并且在不释放此锁的情况下，它锁定了 `_sharedVariable2`。当它获取第二个锁时，它增加了\
  \ `_tasksCounter2`，如下所示：\n\n```csharp\nlock (_sharedVariable1)\n{\n    _tasksCounter1++;\n\
  \    Thread.Sleep(5000);\n    lock (_sharedVariable2)\n    {\n        _tasksCounter2++;\n\
  \    }\n}\n```\n\n同样，这个示例的目的是解释新调试器提供的检测死锁的功能，但它并不代表良好的实践。`CountTasks2` 执行了类似的过程，但锁的顺序是反的。首先，它锁定了\
  \ `_sharedVariable2`。当它获取锁时，它增加了 `_tasksCounter2` 并让底层线程睡眠 5000 毫秒（5 秒）。在这 5 秒内，`_sharedVariable2`\
  \ 将处于锁定状态，并且在不释放此锁的情况下，它尝试获取 `_sharedVariable1` 的锁。当它获取第二个锁时，它增加了 `_tasksCounter1`。然而，由于\
  \ `CountTasks1` 将并发运行，当 `CountTasks1` 尝试获取 `_sharedVariable2` 的锁时，它会被 `CountTasks2`\
  \ 中的第一个锁锁住。当 `CountTasks2` 尝试获取 `_sharedVariable1` 的锁时，它会被 `CountTasks1` 中的第一个锁锁住。锁没有超时设置；因此，代码将永远等待获取每个锁。由于线程将持有锁睡眠\
  \ 5 秒，任务 `t1` 和 `t2` 之间会出现几秒钟的死锁。\n\n按照以下步骤理解并行堆栈（Parallel Stacks）窗口和并行任务（Parallel\
  \ Tasks）窗口在检测到死锁时提供的信息：\n\n1. 选择 `Debug → Start Debugging` 或按 `F5`。\n2. 等待 2 秒并选择\
  \ `Debug → Break All` 或点击调试工具栏中的暂停按钮。你可以不遵循这一步，而是修改 Listing 7-1 所示的代码，创建一个睡眠 2 秒后调用\
  \ `Debugger.Break` 的任务。然而，这个示例代表了最常见的场景。\n3. 查看并行堆栈和并行任务窗口。两个任务都显示为 `Waiting` 状态，因为它们正在运行\
  \ `Thread.Sleep` 指令。图 7-44 显示了并行堆栈窗口中两个任务的堆栈帧。\n4. 选择 `Debug → Continue` 或按 `F5`。\n\
  5. 等待 3 秒并选择 `Debug → Break All` 或点击调试工具栏中的暂停按钮。查看并行堆栈和并行任务窗口。两个任务的状态都变为 `Waiting-Deadlocked`，因为由\
  \ `t1` 调用的 `CountTasks1` 正在获取 `_sharedVariable2` 的锁，与此同时，由 `t2` 调用的 `CountTasks2`\
  \ 正在获取 `_sharedVariable1` 的锁。死锁的发生是因为 `_sharedVariable1` 被 `CountTasks1` 锁定，而 `_sharedVariable2`\
  \ 被 `CountTasks2` 锁定。图 7-45 显示了并行堆栈窗口中两个任务的堆栈帧，并且并行任务窗口显示两个任务的 `Waiting-Deadlocked`\
  \ 状态。将鼠标指针悬停在任务 ID 2 的状态单元格上，将显示关于死锁原因的其他信息。由于并行堆栈窗口显示了外部代码，可以看到两个任务都在运行 `Monitor.Enter`\
  \ 方法。这意味着它们正在尝试获取锁。在第 5 章“协调数据结构”中，你学习了 `lock` 关键字调用的 `Monitor` 方法。因此，当你检测到死锁时，必须为调试窗口启用外部代码。以下列表显示了每个任务的提示信息及其解释：\n\
  \n* 任务 1 显示此提示信息：`'Task 1 is waiting on object: Object of type ‘System.Object’ (Owned\
  \ by thread 6044).`。这意味着任务 1 正在等待由线程 6044 持有的 `System.Object` 对象。\n* 任务 2 显示此提示信息：`'Task\
  \ 2 is waiting on object: Object of type ‘System.Object’ (Owned by thread 7800).`。这意味着任务\
  \ 2 正在等待由线程 7800 持有的 `System.Object` 对象。\n\n每个提示框都能让你知道哪个线程持有锁并产生了死锁任务。因此，你可以切换到该线程，进入其支持的任务，并检查持有锁的代码。\n\
  \n\n\n6. 转到任务视图（Tasks View）中的并行堆栈（Parallel Stacks）窗口。双击由 `t1` 任务调用的匿名方法：`Program.Main.AnonymousMethod4`。`Main`\
  \ 方法中该行的后续部分将以不同的背景突出显示：\n\n```cs\nvar t1 = new Task(() => CountTasks1());\n```\n\
  \n7. 点击位于并行堆栈窗口顶部的“切换方法视图”（Toggle Method View）选项按钮。方法视图将显示匿名方法，其带有通向 `CountTasks1`\
  \ 方法的调用路径以及一个定义任务状态为 `Waiting-DeadLocked`（等待-死锁）的图标。图 7-46 显示了图 7-35 中之前显示的并行堆栈窗口的方法视图。可以清楚地看出，`CountTasks1`\
  \ 正在调用 `Monitor.Enter`。\n\nFigure 7-46\n\n![7.46](img/c07f046.jpg)\n\n8. 切换到 `Monitor.Enter`\
  \ 方法。现在，方法视图将显示两个调用了 `Monitor.Enter` 的任务。方法视图显示了完整值是因为所选方法（`Monitor.Enter`）下方有两个分支路径。图\
  \ 7-47 显示了带有两个调用 `Monitor.Enter` 任务的并行堆栈窗口方法视图。\n\nFigure 7-47\n\n![7.47](img/c07f047.jpg)\n\
  \n9. 右键点击 `Monitor.Enter` 的方法上下文，并在上下文菜单中选择“切换到帧”（Switch To Frame）。点击对 `Monitor.Enter`\
  \ 的调用之一的完整名称，源代码编辑器中带有 `lock` 关键字的代码将以不同的背景颜色突出显示。图 7-48 显示了 `CountTasks1` 中尝试锁定\
  \ `_sharedVariable2` 的行。这一行是导致死锁的原因之一。\n\nFigure 7-48\n\n![7.48](img/c07f048.jpg)\n\
  \n# 总结\n\n本章详细介绍了由 Visual Studio 2010 引入的许多新调试功能的详细信息。关于调试并行任务以及支持其执行的线程，还有许多其他高级主题，但本章提供了最重要的窗口及其特性的简单用法示例。本章总结如下：\n\
  \n* 你可以使用多个监器来增强你的调试体验。\n* 你可以将断点与并行任务（Parallel Tasks）窗口和并行堆栈（Parallel Stacks）窗口结合起来来调试并发代码。\n\
  * 你可以通过观察并行任务、并行堆栈和线程窗口来理解任务与支持其执行的线程之间的关系。\n* 你可以通过并行堆栈窗口中显示的交互式图表在堆栈帧之间导航。\n*\
  \ 你可以冻结和恢复支持任务执行的线程，以减少并发性并以顺序执行的方式来调试代码。\n* 你必须注意并行任务和并行堆栈窗口中显示的匿名方法信息。\n* 你可以使用并行任务和并行堆栈窗口来检测死锁产生。\n\
  \n# 第 8 章：线程池\n\n## 本章包含哪些内容？\n\n* 了解改进后的线程池引擎\n* 请求在线程池的线程中运行工作项\n* 在线程上使用轻量级同步原语\n\
  * 协调工作线程\n* 使用任务代替线程来排队作业\n* 理解本地队列、工作窃取（work-stealing）机制和细粒度并行化\n* 指定自定义的任务调度器\n\
  \n本章介绍了由 .NET Framework 4 引入的公共语言运行时（CLR）线程池引擎的更改。理解使用任务与直接请求在线程池线程中运行工作项之间的差异是非常重要的。如果你以前用过线程池，可以利用新的改进并将你的代码迁移到基于任务的编程模型。本章还提供了一个自定义任务调度器的示例。\n\
  \n# 从任务层向下\n\n在之前的章节中，你创建了任务来并行化代码的执行。在某些情况下，你没有编写创建 `Task` 实例的语句；而是使用了 .NET Framework\
  \ 4 的新类和方法来创建创建并行化执行所需的任务。例如，`Parallel.Invoke`、`Parallel.For`、`Parallel.ForEach`\
  \ 和 `PLINQ`（等）在底层创建了任务。\n\n图 8-1 显示了一个带有三层的简单楼梯：任务（Tasks）、线程（Threads）和 CLR 线程池引擎。任务层通常有一些任务分配给线程，另一些任务正在等待分配给线程。如果你从任务层向下走，通常会发现分配给任务的线程。\n\
  \nFigure 8-1\n\n![8.1](img/c08f001.jpg)\n\n线程池引擎管理一个线程池来处理工作项。而不是为每个需要执行的工作项创建一个新线程，工作项会被队列并由不同的线程获取。\n\
  \n创建一个新的托管线程需要数千个 CPU 周期并消耗内存。线程之间的切换也有巨大的开销，因此你需要一个池作为并发限制机制。因此，线程池引擎使用高效且精细的算法允许你排队工作项，而不必担心线程的创建或销毁。线程池维持的空闲线程数通常等于逻辑核心数。然而，空闲线程可能会低于此水平。实际上，线程池中至少有\
  \ `n` 个线程，其中 `n` 是逻辑核心数和队列工作项数量的最小值。例如，如果逻辑核心数为 8，队列工作项数为 2，则最小空闲线程数将为 2。\n\n.NET\
  \ Framework 4 将此线程池用于标记：\n\n* 将任务分配给线程\n* 处理异步 I/O 完成\n* 处理 `System.Threading.Timer`\
  \ 类定义的定时器回调函数![note](img/note.gif)\n\n    不要将 `System.Threading.Timer` 类中定义的定时器与\
  \ `System.Windows.Forms.Timer` 类定义的定时器组件混淆。前者在创建定时器的 UI 线程不同的工作线程中运行回调函数，而后者在 Windows\
  \ Forms 应用程序中在 UI 线程中触发事件。如果线程池线程创建了 `System.Threading.Timer` 实例，创建定时器的线程完全有可能也执行其回调。\n\
  \n* 使用委托运行异步方法调用\n* 处理注册的等待操作\n\n# 了解新的 CLR 4 线程池\n\n在处理任务时，你已经间接使用了该引擎提供的服务。你也可以通过使用\
  \ `System.Threading.ThreadPool` 类提供的方法直接请求在线程池线程中运行工作项。然而，如果你这样做，你将无法访问 `Task` 实例及其特性。\n\
  \n\n\n\n将工作项请求在线程池的线程中运行的唯一优势是避免了创建和管理 `Task` 实例所需的额外开销。如果你不需要 `Task` 实例所提供的功能，在某些特定情况下，你可能会以增加代码复杂性为代价来提高整体性能。然而，新的\
  \ CLR 4 线程池引擎已经从之前的版本进行了改进，在将工作分配给任务时提供最佳性能。此外，新的线程池引擎为进一步的可扩展性做好了准备，并经过优化以利用最新的多核微处理器架构。因此，只要可能，尽量使用新的任务，而不是直接请求在线程池的线程中运行工作项——除非你确定这将显著提高性能。本章的后续章节将提供使用任务而非线程在线程池中队列作业的示例。\n\
  \n## 理解全局队列\n\n代码列表 8-1 显示了 Windows Presentation Foundation (WPF) 应用程序主窗口的 XAML\
  \ 代码，该窗口在窗口上显示两个 `Button` 控件和一个 `Label`。。你可以在图 8-2 中查看此窗口的设计视图。代码列表 8-1 还显示了主窗口的\
  \ C# 代码，其中包含了定义为两个按钮的 `Click` 事件处理程序代码。\n\n图 8-2\n\n![8.2](img/c08f002.jpg)![下载](img/download.gif)\n\
  \n代码列表 8-1: 请求工作项在线程池的线程中运行\n\n### MainWindow.xaml\n```xml\n<Window x:Class=\"Listing8_1.MainWindow\"\
  \n  xmlns=\"http://schemas.microsoft.com/winfx/2006/xaml/presentation\"\n  xmlns:x=\"\
