  \ `int`。\n\n以下行调用了 `Parallel.ForEach`，传入了源（`inputData`）以及一个每次迭代接收数字的 lambda 委托方法：\n\
  \n```csharp\nParallel.ForEach(inputData, (int number) =>\n```\n代码片段为 Listing2_11\n\
