  \ 下载免费试用版。\n\n`DFT1DRealToComplex` 方法对 `Generate1DInput` 方法生成的双精度数据执行实数到复数的一维 离散傅里叶变换。`Generate1DInput`\
  \ 方法返回一个具有 `INPUT_SIZE` 个元素的 `double` 数组。\n\n\n\n\n\n`DFT1DRealToComplex` 方法调用了\
  \ `DFTI` 类中定义的静态方法来配置离散傅里叶变换的参数。首先，它创建一个 `DFTI` 描述符（`descriptor`），然后调用一些方法来设置 `DFTI.BACKWARD_SCALE`、`DFTI.PLACEMENT`\
  \ 和 `DFTI.PACKED_FORMAT` 参数的值。当定义了与 `DFTI` 描述符相关的参数后，代码调用 `DFTI.DftiCommitDescriptor`\
  \ 方法根据定义的配置提交描述符。代码使用了在 `DFTI` 类中定义的封装器，这些封装器包含在 `MKL_dfti.cs` 文件。该类根据 `mkl_dfti.h`\
  \ 文件定义常量，并调用 `DFTINative` 类中声明的 `mkl_rt.dll` 原生方法。对 `DFTINative` 方法的每次调用都需要平台调用（P/Invoke），这会引入开销。\n\
  \n然后，`DFT1DRealToComplex` 方法调用 `DFTI.DftiComputeForward` 方法，该方法随后调用相应的 `mkl_rt.dll`\
  \ 函数来计算输入数组的正向离散傅里叶变换，并将结果存储在输出数组中。\n\n![download](img/download.gif)\n\n```\nvar\
