  \        // 增加活跃线程数\n                Interlocked.Increment(ref _activeWorkers);\n\
  \                try\n                {\n                    Debug.WriteLine(\"\
  Worker {0} started \", workerNum);\n                    DoSomeWork(workerNum);\n\
  \                    Debug.WriteLine(\"Worker {0} finished \", workerNum);\n   \
  \             }\n                finally\n                {\n                  \
  \  // 使用原子操作\n                    // 减少活跃线程数\n                    Interlocked.Decrement(ref\
  \ _activeWorkers);\n                }\n            }, _workerCount);\n         \
  \   // 将新的任务实例\n            // 添加到 _workerTasks 列表\n            _workerTasks.Add(workerTask);\n\
  \        }\n\n        private void butCheckActive_Click(object sender, RoutedEventArgs\
  \ e)\n        {\n            lblActiveWorkers.Content = String.Format(\"Active workers:\
  \ {0}\", _activeWorkers);\n        }\n\n        private void WaitAll_Click(object\
  \ sender, RoutedEventArgs e)\n        {\n            // 等待 _workerTasks 中的所有任务\n\
  \            // 完成它们的工作\n            // 像这样阻塞 UI 线程\n            // 显然是一个非常糟糕的做法\n\
  \            // 这仅用于示例\n            Task.WaitAll(_workerTasks.ToArray());\n    \
  \        butAll.Content = \"Done!\";\n        }\n    }\n}\n```\n\n采用之前的 WPF 解决方案。在\
  \ `ThreadPerTaskScheduler.cs` 类中添加 `ThreadPerTaskScheduler` 类的代码，如 Listing 8-6 所示。然后，将\
  \ `MainWindow.xaml.cs` 文件的代码替换为 Listing 8-7 所示的内容。最后，将 `MainWindow.xaml` 文件中指定的命名空间从\
  \ `Listing8_4` 更改为 `Listing8_7` 以运行新应用程序。`MainWindow.xaml` 的第一行应如下：\n\n![下载](img/download.gif)\n\
  \n<Window x:Class=\"Listing8_7.MainWindow\"\n\n以下行将使用默认的 `TaskFactory` 创建并启动新任务：\n\
  \n```csharp\nvar workerTask = Task.Factory.StartNew((num) =>\n```\n\n\n\n\n然而，代码使用此行通过\
  \ `_threadFactory` 创建并启动了新任务。因此，新任务在构造函数中使用了为 `_threadFactory` 指定调度器：`_taskScheduler`。\n\
  \n```csharp\nvar workerTask = _threadFactory.StartNew((num) =>\n```\n\n![note](img/note.gif)\n\
  \n若要测试使用自定义调度器的结果，你只需要像上一个示例那样更改几行代码即可。\n\n代码在私有变量 `_workerTasks` 中维护了一个工作任务的列表。`_workerTasks`\
  \ 是一个 `List<Task>`，且 UI 线程是唯一对该列表进行更改的线程。因此，当代码创建、启动新任务并将其添加到 `_workerTasks` 时，不需要使用并发集合或添加锁。\n\
  \n当你点击“等待所有工作人员完成”（Wait For All Workers To Finish）按钮时，`butWaitAll_Click` 事件处理器中的代码会调用\
  \ `Task.WaitAll` 方法并传递一个 `Task` 数组——即 `_workerTasks` 转换为数组。当你使用任务并赋予它们一个身份标识时，代码通常比调用\
  \ `ThreadPool` 类方法的等效版本更简单。\n\n# 总结\n\n还有许多其他关于将任务队列到线程中的底层工作的高级主题。本章解释了线程池引擎与 TPL\
  \ 之间的关系。由于本章聚焦于基于任务的编程模型的优势，因此并没有假装是 `ThreadPool` 类的参考手册。本章的主要重点是讨论如何利用 .NET Framework\
  \ 4 中的新特性来支持 TPL。总结本章如下：\n\n*   如果你从任务楼层向下走，你将发现线程和 CLR 线程池。\n*   你可以使用任务代替线程，以简化使用\
  \ `ThreadPool` 类服务的代码。\n*   当你使用任务时，可以利用本地队列和工作窃取（work-stealing）机制。\n*   当你面对细粒度并行场景时，应该使用任务。\n\
  *   当你认为默认调度器不适用于特定算法时，可以测试不同的任务调度器。\n\n# 第 9 章：异步编程模型\n\n## 本章内容包含：\n\n*   将异步编程与任务混合\n\
  *   使用 `TaskFactory.FromAsync`\n*   在异步方法结束后编写延续（continuations）\n*   合并多个并发异步操作的结果\n\
  *   创建响应式 UI\n*   执行异步 WPF UI 更新\n*   执行异步 Windows Forms UI 更新\n*   创建执行 EAP 操作的任务\n\
  *   使用 `TaskCompletionSource`\n\n本章主要介绍了将现有的异步编程模型与任务混合的优势。异步编程模型并不是新事物，它们从第一个版本起就作为\
  \ .NET 的一部分。然而，基于任务的编程模型是完全全新的。因此，将旧模型与新模型混合会有些复杂。本章提供了真实的示例，利用 `Task` 实例的简单性及其任务延续功能，来执行与现有异步编程模型相关的并发异步作业。\n\
  \n此外，本章还教授了并发编程中最复杂的主题之一：从不同的任务和线程更新用户界面（UI）的过程。本章解释了在 Windows Forms 和 Windows Presentation\
  \ Foundation (WPF) 中更新 UI 的模式。\n\n# 混合异步编程与任务\n\n正如第 2 章“命令式数据并行”所解释的，`Task` 代表一个异步操作。因此，如果你想执行许多计算密集型异步操作、I/O\
  \ 密集型异步操作或两者的结合，可以使用任务并行库（TPL）所提供的简单性和强大功能。\n\nI/O 密集型工作流通常会留下一个线程等待直到 I/O 操作完成。当你使用任务代替线程时，可以利用第\
  \ 8 章“线程池”中解释的任务调度算法，在不需要大量线程的情况下支持许多并发 I/O 操作。然而，如果你使用任务来调用同步 I/O 操作，该操作将在整个 I/O\
  \ 操作持续期间内阻塞分配给任务的线程。\n\n线程是昂贵的（资源开销大），你可能不希望为每个异步 I/O 操作都创建一个新线程。等待 I/O 操作完成的阻塞线程会浪费宝资源，因为它没有在执行实际工作。你可以使用\
  \ `Task.Factory.FromAsync` 方法运行任意数量的并发异步 I/O 操作，以充分利用并行性并在更短时间内完成工作。在异步 I/O 操作运行期间完全不会使用任何线程。当\
  \ I/O 操作完成时，必须使用线程资源，因为必须处理结果。\n\n如果你使用 `Task.Factory.FromAsync` 调用异步操作而不是处理线程，你的代码扩展性会更好，消耗资源也更少。任务调度器将任务分配给正在等待的线程，并在不需要时避免创建额外的线程。通过这种方式，你可以编写代码执行并发异步\
  \ I/O 操作，并将复杂的工作留给 CLR 4 线程池引擎。第 8 章解释了线程池引擎如何根据需要注入和退休线程以便在许多异构场景中实现最大吞吐量。`Task.Factory.FromAsync`\
  \ 允许你创建执行并发异步 I/O 操作的响应式且可扩展的应用程序。\n\n此外，通过在并发 I/O 操作运行时释放 UI 线程，你可以为用户提供响应式 UI。如果你必须从头创建一个新应用程序，可以使用任务、其延续功能和等待操作。这样这样，代码易于理解，并且能够根据最大的\
  \ I/O 性能实现所需的扩展性。\n\n然而，有时你需要与以前 .NET 版本中引入的以下两种异步操作标准模式进行交互：\n\n*   异步编程模型 (APM)\
  \ —— .NET Framework 1 引入了这种异步操作模式，也称为 Begin/End 模式。带有 `Begin` 前缀的方法启动异步执行，并返回一个表示该异步操作状态的\
  \ `System.IAsyncResult`。该方法通常接收与异步操作相关的附加参数，以及一个指定在异步操作执行完成时必须调用的 `System.AsyncCallback`。然后，你可以调用带有\
  \ `End` 前缀的方法，并传递挂起的异步操作状态的 `System.IAsyncResult`。带有 `End` 前缀的方法允许你等待作为参数传入的异步操作完成。带有\
  \ `End` 前缀的方法会汇并阻塞当前任务或线程，直到 I/O 操作完成。此外，该方法通常会返回与异步结果相关的信息。例如，`System.IO.FileStream`\
  \ 类中执行异步读取的 Begin/End 方法对由 `BeginRead` 和 `EndRead` 方法组成。`EndRead` 方法返回从流中读取的字节数。\n\
  \n\n\n\n\n*   基于事件的异步模式 (EAP) — .NET Framework 2 引入了这种模式用于异步操作。带有 `Async` 后缀的方法会启动异步执行。当执行完成或被取消时，异步操作会引发一个事件，通常带有\
  \ `Completed` 后缀。委托提供了一个回调方法，该方法在事件被引发时被调用。例如，`System.Net.NetworkInformation.Ping`\
  \ 类的方法/事件对由 `SendAsync` 方法和 `PingCompleted` 事件组成。\n\n你可以使用任务（tasks）在类中实现 `APM` 或\
  \ `EAP` 模式。此外，你还可以将现有类中的 `APM` 或 `EAP` 操作以任务的形式暴露，以简化代码并使其与新的基于任务的编程模型兼容。\n\n![note](img/note.gif)\n\
  \n附录 C，“并行扩展附加项”引入了为现有类提供新扩展方法的类。这些扩展方法添加了新的异步对应项，这些对应项使用并返回任务。这些返回的任务代表异步操作并包含它们的结果。新的扩展方法利用任务来与实现\
  \ `APM` 或 `EPA` 模式的类进行交互。这些扩展方法并非生产级质量，但它们是由微软开发的，并且是 .NET Framework 4 并行编程示例的一部分。如果你有特定需求，务必在尝试从头创建自己的方法之前，检查这些扩展方法中是否有合适的。\n\
  \n## 使用 TaskFactory.FromAsync\n\nListing 9-1 显示了 WPF 主窗口的 XAML 代码，该窗口在窗口上显示了一个 `Button`\
  \ 控件。你可以在图 9-1 中查看此窗口的设计视图。Listing 9-1 还显示了主窗口的 C# 代码，其中包含了定义按钮 `Click` 事件处理程序的代码。\n\
  \n图 9-1\n\n![9.1](img/c09f001.jpg)![download](img/download.gif)\n\nListing 9-1:\
  \ 在任务中封装许多异步读取操作\n\nMainWindow.xaml\n\n```xml\n<Window x:Class=\"Listing9_1.MainWindow\"\
  \n  xmlns=\"http://schemas.microsoft.com/winfx/2006/xaml/presentation\"\n  xmlns:x=\"\
  http://schemas.microsoft.com/winfx/2006/xaml\"\n  Title=\"Performing Concurrent\
  \ Read Operations\" \n  Height=\"350\" Width=\"525\">\n    <Grid>\n        <Button\
  \ Content=\"Concatenate Text Files\" Height=\"43\" \n                HorizontalAlignment=\"\
  Left\" Margin=\"12,12,0,0\" \n                Name=\"butConcatTextFiles\" VerticalAlignment=\"\
  Top\" \n                Width=\"190\" Click=\"butConcatTextFiles_Click\" />\n  \
  \  </Grid>\n</Window>\n```\n\nMainWindow.xaml.cs\n\n```csharp\nusing System;\nusing\
  \ System.Collections.Generic;\nusing System.Linq;\nusing System.Text;\nusing System.Windows;\n\
  using System.Windows.Controls;\nusing System.Windows.Data;\nusing System.Windows.Documents;\n\
  using System.Windows.Input;\nusing System.Windows.Media;\nusing System.Windows.Media.Imaging;\n\
  using System.Windows.Navigation;\nusing System.Windows.Shapes;\n// Added\nusing\
  \ System.Threading.Tasks;\nusing System.IO;\n\nnamespace Listing9_1\n{\n    ///\
  \ <summary>\n    /// MainWindow.xaml 的交互逻辑\n    /// </summary>\n    public partial\
  \ class MainWindow : Window\n    {\n        public MainWindow()\n        {\n   \
  \         InitializeComponent();\n        }\n        // 需要读取的文件名\n        private\
  \ string[] fileNames = {\n            \"file01.txt\", \n            \"file02.txt\"\
  , \n            \"file03.txt\", \n            \"file04.txt\", \n            \"file05.txt\"\
  , \n            \"file06.txt\", \n            \"file07.txt\", \n            \"file08.txt\"\
  , \n            \"file09.txt\", \n            \"file10.txt\", \n            \"file11.txt\"\
  , \n            \"file13.txt\", \n            \"file14.txt\", \n            \"file15.txt\"\
  , \n            \"file16.txt\"\n        };\n        // 任务列表\n        // 每个 Task\
  \ 实例返回一个字符串\n        // 并使用 APM 操作读取文件\n        private List<Task<string>> fileTasks;\n\
  \        // 流读取器的缓冲区大小\n        private const int BUFFER_SIZE = 0x200;\n       \
  \ private Task<string> ReadAllTextAsync(string path)\n        {\n            //\
  \ 获取文件信息\n            FileInfo info = new FileInfo(path);\n            if (!info.Exists)\n\
  \            {\n                // 文件不存在\n                throw new FileNotFoundException(\n\
  \                  String.Format(\"{0} does not exist.\", path),\n             \
  \     path);\n            }\n            // 此数组将持有从文件\n            // 读取的数据\n  \
  \          byte[] data = new byte[info.Length];\n            // 创建新的 FileStream\n\
  \            // 以从文件中读取，\n            // 将 useAsync 设置为 true\n            // 以使用异步输入\n\
  \            FileStream stream =\n              new FileStream(path, FileMode.Open,\n\
  \                  FileAccess.Read, FileShare.Read,\n                  BUFFER_SIZE,\
  \ true);\n            // 将 APM 读取操作封装在 Task 中\n            // 在任务中封装 APM 流的 BeginRead\n\
  \            // 和 stream.EndRead 方法\n            Task<int> task =\n            \
  \  Task<int>.FromAsync(\n              stream.BeginRead, stream.EndRead, \n    \
  \          data, 0, data.Length, null, \n              TaskCreationOptions.None);\n\
  \            // Task 将持有读取的\n            // 字节数作为结果\n            // 为任务添加一个连续任务\n\
  \            // 并返回它\n            return task.ContinueWith((t) =>\n            {\n\
  \                stream.Close();\n                Console.WriteLine(\n         \
  \         \"One task has read {0} bytes from {1}.\",\n                  t.Result,\
  \ stream.Name);\n                // 此连续任务返回\n                // 从文件中读取的数据\n    \
  \            // 使用 UTF8 编码转换为字符串\n                return (t.Result > 0) ?\n    \
  \              new UTF8Encoding().GetString(data) : \"\";\n            }, TaskContinuationOptions.ExecuteSynchronously);\n\
  \        }\n        private void butConcatTextFiles_Click(object sender, RoutedEventArgs\
  \ e)\n        {\n            fileTasks =\n              new List<Task<string>>(fileNames.Length);\n\
  \            foreach (string fileName in fileNames)\n            {\n           \
  \     // 启动一个 Task<string>\n                // 将从文件中读取的所有数据\n                //\
  \ 以字符串形式持有作为任务的结果\n                var readTask =\n                ReadAllTextAsync(@\"\
  C:\\MYFILES\\\" + fileName);\n                // 将 Task<string> 添加到 fileTasks\n\
  \                // 无需调用 Start 方法\n                // 因为任务是用 FromAsync 方法创建的\n \
  \               fileTasks.Add(readTask);\n            }\n            // 阻塞此线程\n\
  \            // 直到所有任务完成工作\n            Task.WaitAll(fileTasks.ToArray());\n   \
  \         // 写入从文件中读取的所有数据\n            foreach (Task<string> fileTask in fileTasks)\n\
  \            {\n                Console.WriteLine(fileTask.Result);\n          \
  \  }\n        }\n    }\n}\n```\n\n要运行 Listing 9-1 所示的代码，你需要在 `fileNames` 私有字符串数组中指定许多文本文件。这些文本文件的默认位置是\
  \ C:\\MYFILES 文件夹。不过，你可以根据自己的喜好替换此路径。\n\n\n\n\n\n当你点击“合并文本文件”（Concatenate Text Files）按钮时，`butConcatTextFiles_Click`\
  \ 事件处理程序中的代码会为 `string` 类型的数组 `fileNames` 中的每个文件启动一个新的 `Task<string>`。。一个 `foreach`\
  \ 循环会为每个文件名调用 `ReadAllTextAsync` 方法，然后将该方法返回的 `Task<string>` 添加到 `fileTasks` 中。每个\
  \ `Task<string>` 都会从文件中读取所有数据，并将结果生成的字符串存储在它的 `Result` 属性中。\n\n根据可用硬件资源和 I/O 速度，这些许多读取操作将并行运行。然后，代码通过调用\
  \ `Task.WaitAll` 方法阻塞 UI 线程，等待所有任务完成工作。由于每个文件读取操作都有其相关联的 `Task` 实例，因此编写代码来等待所有必要的并发读取操作完成执行是非常简单的。\n\
  \n最后，代码将从所有文件中读取的文本写入输出。在这个示例中，重点是 `ReadAllTextAsync` 方法，该方法将一个 APM 操作封装在 `Task<string>`\
  \ 中。阻塞 UI 线程直到多个并发任务完成并不是最佳实践。本章将向你展示此简单示例的其他版本，它们不会阻塞 UI 线程，并用这些异步并发 I/O 操作的结果更新\
  \ UI 控件。\n\n`ReadAllTextAsync` 方法接收要读取文件的完整路径作为参数并返回一个 `Task<string>`。该方法检查文件是否存在，并定义了一个名为\
  \ `data` 的 `byte` 数组来存放从该文件中读取的所有数据。然后，该方法创建一个新的 `System.IO.FileStream` 实例（称为 `stream`）来读取文件。`FileStream`\
  \ 构造函数的最后一个参数 `useAsync` 被设置为 `true` 以使用异步输入。下面的代码片段显示了将 APM 读取操作封装在 `Task<int>`\
  \ 中的行：\n\n![download](img/download.gif)\n\n```csharp\nTask<int> task =\n    Task<int>.Factory.FromAsync(\n\
  \    stream.BeginRead, stream.EndRead, \n    data, 0, data.Length, null,  \n   \
  \ TaskCreationOptions.None);\n```\n来自列表 9_1 的代码片段\n\n`TaskFactory.FromAsync` 和 `TaskFactory<TResult>.FromAsync`\
  \ 方法提供了许多返回 `Task` 或 `Task<TResult>` 的定义。前面的代码片段使用一个重载来创建一个 `Task<int>`，该任务代表一对\
  \ `Begin/End` 方法。这对方法符合之前介绍的 APM 模式。该代码将 `stream.BeginRead` 和 `stream.EndRead` 方法封装在\
  \ `Task<int>` 中，即本地变量 `task`。然后，`stream.EndRead` 返回一个带有已读取字节数的 `int` 值，代码调用了 `Task<int>.Factory.FromAsync`\
  \ 方法。`stream.EndRead` 方法的结果将在封装 APM 操作的 `Task<int>`（即 `task`）的 `Result` 属性中可用。接下来的列表显示了参数的类型和名称，以及代码传递给\
  \ `FromAsync` 方法的值：\n\n*   `Func<byte[], int, AsyncCallBack, object, IAsyncResult>\
  \ beginMethod` — `stream.BeginRead`\n*   `Func<IAsyncResult, int> endMethod` — `stream.EndRead`\n\
  *   `byte[] arg1` — `data`\n*   `int arg2` — `0`\n*   `int arg3` — `data.Length`\n\
  *   `object state` — `null`\n*   `TaskCreationOptions creationOptions` — `TaskCreationOptions.None`\n\
  \n`FromAsync` 方法将上述的参数发送到 `stream.BeginRead` 方法，然后使用 `BeginRead` 返回的 `IAsyncResult`\
  \ 调用 `EndRead` 方法。接下来的列表显示了参数的类型和名称，以及 `stream.BeginRead` 从上一个列表中接收到的变量名和实际值：\n\n\
  *   `byte[] array` — `arg1`，本地变量 `data`。该变量将用作读取数据的缓冲区。\n*   `int offset` — `arg2`,\
  \ `0`。代码将从字节偏移量 0 开始读取。\n*   `int numBytes` — `arg3`, `data.Length`。代码将读取整个文件。\n\
  *   `Object stateObject` — `state`, `null`。代码不会将此异步请求与其他请求区分开。\n\n不需要为新的 `Task<int>`\
  \ 调用 `Start` 方法，因为没有任务被调度。`FromAsync` 方法调用 `begin` 方法，并在操作完成后调用 `end` 方法并使用其结果来完成任务。事实上，如果你对使用\
  \ `FromAsync` 方法创建的 `Task` 实例调用 `Start` 方法，代码将抛出异常。`Task<int>` 在 `TaskStatus.Created`\
  \ 状态下启动，但在向 `FromAsync` 调用者返回 `Task<int>` 实例引用之前，该状态会被更改为 `TaskStatus.WaitingForActivation`。这发生在你使用\
  \ `FromAsync` 方法创建任务时。\n\n由于对这个新的 `Task<int>` 没有特殊需求，`TaskCreationOptions.None`\
  \ 值是 `FromAsync` 方法的最后一个参数。但在需要时，你可以为此参数使用另一个值。\n\n## 异步方法结束后的程序延续\n\n`ReadAllTextAsync`\
  \ 方法为使用 `FromAsync` 创建的 `Task<int>` (`task`) 添加了一个延续任务。事实上，该方法通过 `ContinueWith`\
  \ 方法链了一个 `Task<string>`。接下来的代码片段显示了返回文件内容的延续任务：\n\n![download](img/download.gif)\n\
  \n```csharp\nreturn task.ContinueWith((t) =>\n    {\n        stream.Close();\n \
  \       Console.WriteLine(\n            \"One task has read {0} bytes from {1}.\"\
  ,\n            t.Result, stream.Name);\n        // 此延续任务返回\n        // 从文件中读取的数据\n\
  \        // 以 UTF8 编码的字符串\n        return t.Result > 0 ? new UTF8Encoding().GetString(data)\
  \ : \"\";\n    }, TaskCreationOptions.ExecuteSynchronously);\n```\n来自列表 9_1 的代码片段\n\
  \n\n\n\n\n```csharp\n// 将存储所有数据\n// 从文件中读取并转换为字符串\n// 作为任务的结果\nvar readTask =\n\
  \    ReadAllTextAsync(\n        @\"C:\\MYFILES\\\" + fileName);\n// 将新的 Task<string>\
  \ 添加到 fileTasks 集合\n// 不需要调用 Start 方法\n// 因为该任务是通过 FromAsync 方法\n// 创建的\nfileTasks.Add(readTask);\n\
  }\n\n// 编写一个延续任务\n// 在所有异步操作\n// 完成后启动\nTask.Factory.ContinueWhenAll(\n    fileTasks.ToArray(),\n\
  \    (antecedentTasks) =>\n    {\n        // 等待所有前置任务完成\n        // 以确保任何前置任务中\n\
  \        // 发生的异常都能被传播\n        Task.WaitAll(antecedentTasks);\n        var sb =\
  \ new StringBuilder();\n        // 所有从文件中读取的数据\n        foreach (Task<string> fileTask\n\
  \            in antecedentTasks)\n        {\n            sb.Append(fileTask.Result);\n\
  \        }\n        Console.WriteLine(sb);\n    });\n}\n```\n\n来自 Snippet9_1 的代码片段\n\
  \n`butConcatTextFiles_Click` 事件处理程序中的新代码为字符串数组 `fileNames` 中的每个文件启动了一个新的 `Task<string>`。它调用了之前解释过的使用\
  \ `FromAsync` 的 `ReadAllTextAsync` 方法。当 `foreach` 循环创建并调度所有任务时，代码使用 `Task.Factory.ContinueWhenAll`\
  \ 编写了一个在所有这些任务完成异步读取操作后运行的延续任务。为 `ContinueWhenAll` 指定的操作将在新任务中运行，作为另一段异步代码，不会阻塞\
  \ UI 线程。事件处理程序中的代码不会等待此新的延续任务完成；因此，UI 线程中没有更多代码在运行，在所有这些异步操作和延续任务运行时，用户可以使用 UI 控件。\n\
  \n现在，延续任务创建了一个新的 `StringBuilder` 实例 `sb`，并使用它来拼接来自所有文件的文本。然后，代码将所有文本写入控制台。在此期间，用户可以与\
  \ UI 交互，因为 WPF 可以在 UI 线程中运行代码并处理相应的事件。代码调用了 `Console.WriteLine`；因此，从文件中读取的文本将出现在\
  \ IDE 的输出窗口中。图 9-2 显示了 WPF 应用程序的窗口，其中有一个文本框控件，用户正在其中输入内容，同时输出窗口显示了所有文件的文本。\n\n在\
  \ UI 控件事件中编写的代码执行了许多操作，这些操作应该放在独立类中，将一个或多个层与 UI 解耦。然而，这些示例尽可能简单，专注于 TPL 和 .NET Framework\
  \ 4 提供的可能性。在实际应用程序中，你可以将这些可能性与面向对象的编程相结合。\n\n## 执行异步 WPF 更新\n\n`FromAsync` 方法允许你将\
  \ APM 操作封装在 `Task` 中。通过使用此方法，你可以使用任务执行许多并发操作，而不会消耗过多的线程。\n\n当你在 WPF 窗口的 XAML 代码中声明控件时，UI\
  \ 线程会在运行时创建这些控件。只有创建控件的线程才能更新它们。因此，默认必须在 UI 线程中编写代码来更改这些控件的值。你已经知道任务调度器会将新任务分配给不同的线程。任务在这些工作线程中运行，它们无法更新在\
  \ UI 线程中创建的控件。\n\n在实际应用程序中，你不会写入控制台。相反，你必须更新控件并为用户提供响应式的 UI。因此，你需要在 UI 线程中运行某些代码，并在其他工作线程中运行其他代码。列表\
  \ 9-2 显示了 WPF 应用程序主窗口新版本的 XAML 代码，它显示了两个新控件：`txtAllText` 和 `pgbFiles`。你可以在图 9-3\
  \ 中看到此窗口的设计视图。\n\n列表 9-2：为 UI 提供反馈的新控件\n```xml\n<Window x:Class=\"Listing_2.MainWindow\"\
  \n    xmlns=\"http://schemas.microsoft.com/winfx/2006/xaml/presentation\"\n    xmlns:x=\"\
  http://schemas.microsoft.com/winfx/2006/xaml\"\n    Title=\"Performing Concurrent\
  \ Read Operations\" \n    Height=\"350\" Width=\"525\">\n    <Grid>\n        <Button\
  \ Content=\"Concatenate Text Files\" Height=\"43\" \n            HorizontalAlignment=\"\
  Left\" Margin=\"12,12,0,0\" \n            Name=\"butConcatTextFiles\" VerticalAlignment=\"\
  Top\" \n            Width=\"190\" Click=\"butConcatTextFiles_Click\" />\n      \
  \  <TextBox Margin=\"12,61,12,0\" Name=\"txtAllText\"\n            AcceptsReturn=\"\
  True\" Height=\"205\"\n            VerticalAlignment=\"Top\" />\n        <ProgressBar\
  \ Height=\"27\" HorizontalAlignment=\"Left\"\n            Margin=\"12,272,0,0\"\
  \ Name=\"pgbFiles\"\n            VerticalAlignment=\"Top\" Width=\"479\" />\n  \
  \  </Grid>\n</Window>\n```\n图 9-3\n\n当你在工作线程中有代码并想要更新在 UI 线程中创建的控件时，可以使用 UI `Dispatcher`。如果你想将工作封回\
  \ UI 线程以便安全地访问控件，可以如下所示调用 `Dispatcher` 的 `Invoke` 或 `BeginInvoke` 方法：\n\n- `Invoke`\
  \ 同步执行委托。这调用了 `SynchronizationContext` 的 `Send` 方法。\n- `BeginInvoke` 异步执行委托，并允许为队列中的该委托指定优先级。这调用了\
  \ `SynchronizationContext` 的 `Post` 方法。\n\n例如，你可以调用异步执行的 `pgbFiles.Dispatcher.BeginInvoke`，将工作封送到创建\
  \ `pgbFiles` 的线程。该方法在将委托添加到 `SynchronizationContext`（调用其 `Post` 方法）后会立即返回；它不会等待委托完成。\n\
  \n`TaskScheduler` 类提供了 `FromSynchronizationContext` 静态方法，这使得创建与当前 `SynchronizationContext`\
  \ 关联的 `TaskScheduler` 变得简单。因此，你可以创建一个特定的 `TaskScheduler` 来运行对 UI 进行异步更新的任务，而无需处理\
  \ `Dispatcher`。你可以简化代码并利用调度为在适当同步上下文中运行的延续任务。\n\n以下代码片段显示了点击“合并文本文件”按钮运行时代码的新版本。此代码创建了一个新的\
  \ `TaskScheduler` 实例，调度更新 UI 控件的延续任务：\n\n```csharp\nprivate void AdvanceProgressBar()\n\
  {\n    // 此代码在 UI 线程中运行\n    // 不存在可能的并发\n    // 无需锁或原子操作\n    pgbFiles.Value++;\n\
  }\n\nprivate void butConcatTextFiles_Click(object sender, RoutedEventArgs e)\n{\n\
  \    // 此调度器将在当前 SynchronizationContext 上执行任务\n    // 即，它可以安全地访问 UI 控件\n    var\
  \ uiScheduler = TaskScheduler.FromCurrentSynchronizationContext();\n    fileTasks\
  \ =\n```\n\n\n\n\n\n```csharp\nnew List<Task<string>>(fileNames.Length);\n\n// 重置进度条\n\
  pgbFiles.Value = 0;\n\n// 设置进度条的最大值\npgbFiles.Maximum = fileNames.Length;\nforeach\
  \ (string fileName in fileNames)\n{\n    // 启动一个 Task<string>\n    // 它将包含从文件中读取的所有数据\n\
  \    // 以字符串的形式\n    // 作为任务的结果返回\n    var readTask =\n        ReadAllTextAsync(\n\
  \            @\"C:\\MYFILES\\\" + fileName);\n    readTask.ContinueWith(\n     \
  \   (t) =>\n        {\n            // 此代码在\n            // UI 线程中运行\n          \
  \  AdvanceProgressBar();\n        }, uiScheduler);\n    // 将新的 Task<string> 添加到\
  \ fileTasks\n    // 无需调用 Start 方法\n    // 因为该任务是通过\n    // FromAsync 方法创建的\n   \
  \ fileTasks.Add(readTask);\n}\n\n// 程序化后续任务\n// 在所有异步\n// 操作完成后启动\nvar builderTask\
  \ =\n    Task.Factory.ContinueWhenAll(\n    fileTasks.ToArray(),\n    (antecedentTasks)\
  \ =>\n    {\n        // 等待所有前置\n        // 任务完成，以确保\n        // 传播在任何前置任务\n    \
  \    // 中发生的异常\n        Task.WaitAll(antecedentTasks);\n        var sb = new StringBuilder();\n\
  \        // 写入从文件中读取的所有数据\n        foreach (Task<string> fileTask in antecedentTasks)\n\
  \        {\n            sb.Append(fileTask.Result);\n        }\n        return sb.ToString();\n\
  \    });\nbuilderTask.ContinueWith(\n    (antecedentTask) =>\n    {\n        //\
  \ 此代码在\n        // UI 线程中运行\n        txtAllText.Text = antecedentTask.Result;\n\
  \    }, uiScheduler);\n```\n\n\n\n\n\n```csharp\n// 在任何前置任务中 发生任何异常\nTask.WaitAll(antecedentTasks);\n\
  var sb = new StringBuilder();\n// 从文件中读取的所有数据\nforeach (Task<string> fileTask in\
  \ antecedentTasks)\n{\n    sb.Append(fileTask.Result);\n}\nreturn sb.ToString();\n\
  });\nbuilderTask.ContinueWith(\n    (antecedentTask) =>\n    {\n        // 这段代码在\
  \ UI 线程中运行\n        txtAllText.Text = antecedentTask.Result;\n    }, uiScheduler);\n\
  });\n}\n```\n\n来自 Snippet9_5 的代码片段\n\n现在，当用户点击 `Concatenate Text Files`（合并文本文件）按钮时，UI\
  \ 线程保持响应，因为大部分代码都在分配给任务的工作线程中运行。。重构后的代码增加了一个微小的开销，因为它创建并启动了另一个任务。然而，它提供了响应式的 UI。\n\
  \n![note](img/note.gif)\n\n为了保持示例尽可能简单，代码列表和片段没有包含所有必要的异常处理机制。你已经在第 3 章“命令式任务并行”中学习了如何处理具有多个延续任务的任务中的异常。\n\
  \n## 执行异步 Windows Forms UI 更新\n\n当你在 Windows Forms 设计器中添加控件时，UI 线程会在运行时创建这些控件。与\
  \ WPF 窗口一样，只有创建控件的线程才能更新这些控件。然而，Windows Forms UI 框架没有提供 WPF 中解释的 `Dispatcher`，而是使用不同的模型将工作调度到特定的同步上下文。\n\
  \n如果你想将更新 UI 的工作封回 UI 线程以便安全地访问控件，可以调用目标控件的 `Invoke` 或 `BeginInvoke` 方法。你也可以对在同一线程中创建的、你想要更新的另一个控件调用这些方法。这两个方法与\
  \ WPF `Dispatcher` 提供的方法相似，工作原理如下：\n\n1. `Invoke` 方法同步执行委托。\n2. `BeginInvoke` 方法异步执行委托。\n\
  \n你可以带入异步执行调用 `pgbFiles.BeginInvoke`，将工作封回到创建 `pgbFiles` 控件的线程。该方法在将委托添加到相应的同步上下文队列后立即返回，而无需等待委托完成。\n\
  \n你可以利用 `TaskScheduler.FromSynchronizationContext` 静态方法对 UI 控件进行异步更新，而无需担心每个 UI\
  \ 框架的调度模型。这意味着你可以使用在 WPF 示例中创建延续任务的相同代码在新的 Forms 应用程序中更新 UI。\n\n`Listing 9-3` 显示之前应用程序作为\
  \ Windows Forms 应用程序的新版本代码。该 Windows Forms 应用程序有一个主窗口（`MainForm.cs`），显示三个控件：一个 `Button`（`butConcatTextFiles`）、一个\
  \ `TextBox`（`txtAllText`）和一个 `ProgressBar`（`pgbFiles`）。你可以在图 9-5 中看到此窗口的设计视图。`Listing\
  \ 9-3` 还显示了主窗口的 C# 代码，以及定义按钮 `Click` 事件处理器的代码。\n\n![download](img/download.gif)\n\
