  \ PLINQ 查询创建的任务。\n\n图 10-17\n\n![10.17](img/c10f017.jpg)\n\n# 常见模式的解决方案\n\n你可以利用提供多线程应用程序行为信息的各种图表来检测并行化应用程序中的常见问题模式。然而，在控制台中隔离可疑算法是一个好主意，可以简化其详细分析。如果你尝试对复杂应用程序进行性能分析，将需要更多的时间精力来检测某些问题。\n\
  \n后续章节使用了简单的示例，在之前解释的并发性能分析方法提供的某些视图中，提供易于识别的可视化模式。但是，你应该分析每个模式，以确保它与你的特定问题相关。\n\
  \n## 串化执行\n\n列表 10-3 显示了列表 10-1 中引入的控制台应用程序新版本的代码。该应用程序运行 PLINQ 查询，该查询创建了许多任务以并行执行运行。然而，应用程序以串化执行运行，没有利用可用的核心。应用程序启动了必要的线程，但在任何给定时间通常只有一个线程在执行。使用串化执行是因为\
  \ `CalculateX` 方法中定义的临界区域运行时间很长。PLINQ 查询对每个过滤后的整数调用此方法；因此，查询的运行性能非常缓慢。\n\n![download](img/download.gif)\n\
  \n列表 10-3： 以串化执行运行简单 PLINQ 查询的应用程序\n\n```csharp\nusing System;\nusing System.Collections.Generic;\n\
  using System.Linq;\nusing System.Text;\nusing System.Diagnostics;\nusing System.Threading.Tasks;\n\
  \n// 此段代码存在性能问题 \n// 不要将此代码视为最佳实践\n\nnamespace Listing10_3\n{\n    class Program\n\
  \    {\n        private static int NUM_INTS = 500;\n        private static ParallelQuery<int>\
  \ GenerateData()\n        {\n            return ParallelEnumerable.Range(1, NUM_INTS);\n\
  \        }\n        private static object _syncCalc = new Object();\n        private\
  \ static double CalculateX(int Num)\n        {\n            double result = 0;\n\
  \            lock (_syncCalc)\n            {\n                for (int i = 0; i\
  \ < 500; i++)\n                {\n                    double newResult = Math.Pow(Math.Sqrt(Num),\
  \ 3);\n                    if (newResult > result)\n                    {\n    \
  \                    result = newResult;\n                    }\n              \
  \  }\n            }\n            return result;\n        }\n        static void\
  \ Main(string[] args)\n        {\n            var sw = Stopwatch.StartNew();\n \
  \           var inputIntegers = GenerateData();\n            var parReductionQuery\
  \ =\n                from intNum in inputIntegers.AsParallel()\n               \
  \ where ((intNum % 5) == 0) ||\n                      ((intNum % 7) == 0) ||\n \
  \                     ((intNum % 9) == 0)\n                select CalculateX(intNum)).Average();\n\
  \            Console.WriteLine(\"Average value: {0}\", parReductionQuery);\n   \
  \         // 性能分析时注释掉下面两行\n            Console.WriteLine(\"Elapsed time: {0}\",\
  \ sw.TotalSeconds);\n            Console.ReadLine();\n        }\n    }\n}\n```\n\
  \n图 10-18 显示了此应用程序的 CPU 利用视图。平均 CPU 利用率为 26%，很容易看出该应用程序只使用了四个核心中的一个。这是串化执行的症状之一。\n\
  \n图 10-18\n\n![10.18](img/c10f018.jpg)\n\n图 10-19 显示了运行 PLINQ 查询的线程的视图。如果你放大这些线程的时间图，你会注意到串化执行的典型视化模式。代表执行块的绿色条从一个线程移动到另一个，这意味着一次只有一个线程在执行代码。图\
  \ 10-20 显示了多线程之间串化执行的典型视化模式。\n\n图 10-19\n\n![10.19](img/c10f019.jpg)\n\n图 10-20\n\
  \n![10.20](img/c10f020.jpg)\n\n## 锁竞争\n\n之前的串化执行问题是由过度同步和锁竞争引起的。线程竞争获取锁以进入临界区域。由于在临界区域中运行的代码需要一些毫秒才能运行，等待获取锁的线程在此期间会被阻塞。在对列表\
  \ 10-1 的性能分析会话中，你学习了如何检测负责交叉阻塞时间的代码。当你面对锁竞争场景时，也可以使用其他功能。\n\n\n\n\n点击代表同步段的红色条之一。IDE\
  \ 将在 `Current Stack`（当前堆栈）选项卡中显示阻塞线程的调用栈。图 10-21 显示，阻塞线程的方法调用是 `Monitor.Enter`，这是代码中尝试进入长时间运行临界区的\
  \ `lock` 语句。你还可以通过点击 `Unblocking Stack`（解锁堆栈）来检查移除阻塞条件的线程。图 10-22 显示了 `Thread Ready`（线程就绪）连接器，它会在你点击同步段时出现，因为解除阻塞的事件发生在应用程序进程中的另一个线程线程中。由此连接器标识的执行段允许被阻塞线程恢复执行。你可以右键点击\
  \ `Current Stack` 或 `Unblocking Stack` 中显示的方法，并选择 `View Source`（查看源代码）以显示阻塞或解锁线程的代码。\n\
  \n图 10-21\n\n![10.21](img/c10f021.jpg)\n\n图 10-22\n\n![10.22](img/c10f022.jpg)![note](img/note.gif)\n\
  \n应该移除不必要的临界区，临界区应只运行需要序列化执行的代码。\n\n## 锁并发 (Lock Convoys)\n\nListing 10-3 中的代码使用\
  \ `lock` 关键字来定义临界区。`lock` 关键字调用 `Monitor.Enter` 来获取非公平互斥锁。它是不公平的互斥锁，因为第一个尝试获取锁的线程并不一定是最终获取锁的线程。`Monitor`\
  \ 不对等待锁的线程强制先入先出（FIFO）顺序。因此，第一个发现锁空闲的线程可以获取锁，即使有其他线程在等待它。`lock` 不是公平的，但它通常比公平锁提供更高的性能，因为它允许那些不需要唤醒即可获取锁的线程运行。不公平锁有助于缓解锁并发场景。\n\
  \n![note](img/note.gif)\n\n公平锁强制 FIFO 顺序，可能会导致锁并发场景。\n\n如果许多线程尝试获取锁，且临界区需要一些时间运行，那么许多线程将无法获取锁。当这种情况与强制\
  \ FIFO 顺序的公平锁结合使用时，会导致线程虽然在进展但需要频繁的上下文切换。锁并发场景与之前解释的锁竞争类似，但由于公平性的存在，性能更差。\n\nListing\
  \ 10-4 显示了一个新版本的控制台应用程序，该程序呈现了 Listing 10-3 中的锁竞争问题。该应用程序使用本地 `System.Threading.Mutex`\
  \ 实例来控制对临界区的访问，而不是使用 `lock` 关键字。`Mutex` 提供了一种同步原语，一次允许单个线程或任务对共享资源进行独占访问。\n\n![download](img/download.gif)\n\
  \nListing 10-4: 一个生成锁并发场景的应用程序\n\n```c\nusing System;\n\nusing System.Collections.Generic;\n\
  using System.Linq;\nusing System.Text;\nusing System.Diagnostics;\nusing System.Threading;\n\
  using System.Threading.Tasks;\n\nnamespace Listing10_4\n{\n    class Program\n \
  \   {\n        private static int NUM_INTS = 5000;\n        private static ParallelQuery<int>\
  \ GenerateInputData()\n        {\n            return ParallelEnumerable.Range(1,\
  \ NUM_INTS);\n        }\n        private static Mutex _mut = new Mutex();\n    \
  \    private static double CalculateX(int intNum)\n        {\n            double\
  \ result = 0;\n            // Wait until it is safe to enter\n            // the\
  \ critical section protected by a Mutex\n            _mut.WaitOne();\n         \
  \   try\n            {\n                for (int i = 0; i < 500; i++)\n        \
  \        {\n                    double newResult = Math.Pow(Math.Sqrt(intNum / Math.PI),\
  \ 3) * i;\n                    if (newResult > result)\n                    {\n\
  \                        result = newResult;\n                    }\n          \
  \      }\n            }\n            finally\n            {\n                //\
  \ Release the Mutex\n                _mut.ReleaseMutex();\n            }\n     \
  \       return result;\n        }\n        static void Main(string[] args)\n   \
  \     {\n            var sw = Stopwatch.StartNew();\n            var inputIntegers\
  \ = GenerateInputData();\n            var parReductionQuery =\n                (from\
  \ intNum in inputIntegers.AsParallel()\n                 where ((intNum % 5) ==\
  \ 0) ||\n                       ((intNum % 7) == 0) ||\n                       ((intNum\
  \ % 9) == 0)\n                 select CalculateX(intNum)).Average();\n         \
  \   Console.WriteLine(\"Elapsed time: {0}\", sw.Elapsed.TotalSeconds);\n       \
  \ }\n    }\n}\n```\n\n\n\n\nListing 10-5 显示了控制台应用程序的新版本代码，该程序启动许多任务来运行相同的顺序 LINQ\
