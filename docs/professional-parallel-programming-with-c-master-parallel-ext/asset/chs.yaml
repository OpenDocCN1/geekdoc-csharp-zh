  \ 5927AFF242E24241BA1CFD2364E6B96303D8366A0AE6BE1FC6E6511819F305DA\nAES KEY: D586E06A9623ADE1FD44827AE6AFAFC0274718A4EE4A98B3892879A0D7324A85\n\
  AES KEY: CF00B0268B9E1B19E9E9C0B5A9F1E5B8795F24A0FDEB862FAC886F5B6C7A5A39\nAES KEY:\
  \ 4ED2B64C4F34A00F7880AAF10E3CFED0CCD02D7F1BCCF18A891062C94556C7E99\nAES KEY: 751206B6E98D8C7832CBEB441A8EE48AC1F5C16500DA89C93D34104B83A76FC2\n\
  AES KEY: 5865588BE6E8832EF1C8056AD3B9926456778A52FA83E355FF66F4B6295742B0\nMD5 HASH:\
  \ EDD39FC8108492B6BB4D9ABD806D4927\n\n现在，再次注释 `GenerateAESKeys` 和 `GenerateMD5Hashes`\
  \ 中向控制台输出的行。\n\n# 并行化循环\n\n`GenerateAESKeys` 和 `GenerateMD5Hashes` 都提供了并行运行迭代的机会。它们生成输入数据以简化示例，并对每个部分数据执行相同的操作。这是一个数据并行化场景的示例，因为你可以重构循环以并行运行这些操作。这样一来，与其并行运行这两种方法，不如让每个方法都能充分利用并行性，并根据现有的逻辑核心数进行自动扩展。\n\
  \n![note](img/note.gif)\n\n在这个示例中，存在某些操作（即密钥和哈希值的生成），它们是可以逐次迭代执行的。因此，你可以对每个元素并行应用相同的任务。这类问题被称为“极易并行化的”（embarrassingly\
  \ parallel），因为它们很容易并行化。\n\n## Parallel.For\n\n你可以通过重构现有的 `for` 循环，将 `for` 替换为 `Parallel.For`\
  \ 并为此新方法调整参数，来利用并行性。\n\nListing 2-5 和 Listing 2-6 显示了之前循环的代码，以及使用命令式语法重构循环的新代码，以实现由\
  \ `Parallel.For` 提供的数据并行。新方法 `ParallelGenerateAESKeys` 和 `ParallelGenerateMD5Hashes`\
  \ 尝试利用所有可用核心，依靠 `Parallel.For` 在底层执行的工作，根据运行时的现有硬件来优化其行为。\n\n![download](img/download.gif)\n\
  \nListing 2-5: 带有顺序 `for` 循环的原始 `GenerateAESKeys` 方法及其并行化版本\n\n原始顺序 `for` 版本\n```\n\
  private static void GenerateKeys()\n{\n  var sw = Stopwatch.New();\n  for (int i\
  \ = 0; i < NUM_AES_KEYS; i++)\n  {\n    var key = GenerateAESKey();\n    Console.WriteLine($\"\
  AES KEY: {key}\");\n  }\n}\n```\n\n并行化版本\n```\nprivate static void GenerateKeysParallel()\n\
  {\n  var sw = Stopwatch.New();\n  Parallel.For(0, NUM_AES_KEYS, (i) =>\n  {\n  \
  \  var key = GenerateAESKey();\n    Console.WriteLine($\"AES KEY: {key}\");\n  });\n\
  }\n```\n*(注：由于原文示例中未提供具体的函数体实现，此处根据上下文推全了翻译逻辑代码结构，以保持格式一致)*\n\n*(由于原文提供的待翻译文本中，部分内容为占位符或未展开的逻辑描述，以下是针对正文描述部分的翻译：)*\n\
  \n\n\n必须将此定义转换为 `Parallel.For`，并如下所示对 `NUM_AES_KEYS` 加 1，因为这是一个开区间边界：\n\n![download](img/download.gif)\n\
  \n```\nParallel.For(1, NUM_AES_KEYS + 1,\n```\n\n代码片段为列表 2_7\n\n第三个参数是委托。在这种情况下，循环没有使用迭代变量。然而，代码使用\
  \ Lambda 表达式定义了一个带有 `int` (`Int32`) 参数 `(i)` 的方法如下，该参数将作为迭代变量持有当前数字：\n\n![download](img/download.gif)\n\
  \n```\nParallel.For(1, NUM_AES_KEYS + 1, (int i) =>\n```\n\n代码片段为 `Snippet2_5`\n\
  \n之前的代码是为了单独运行而准备的，也许可能与其他方法并行运行。然而，每次迭代的设计并不是为了与同一个循环体的其他迭代并行运行的。使用 `Parallel.For`\
  \ 改变了规则。代码中有一个需要解决的问题：顺序迭代共享了局部变量 `aesM`。循环体中包含代码在每次迭代中更改该变量的值。例如，考虑以下几行：\n\n![download](img/download.gif)\n\
  \n```\naesM.GenerateKey();\nbyte[] result = aesM.Key;\nstring hexString = ConvertToHexString(result);\n\
  ```\n\n代码片段为 `Snippet2_5`\n\n第一行对 `AesManaged` 实例 `aesM` 调用 `GenerateKey` 方法。此密钥将存储在\
  \ `aesM.Key` 属性中。然后，代码将存储在该属性中的值赋值给变量 `result`。最后，最后一行将密钥转换为十六进制字符串赋值给 `hexString`。很难想象并行或并发运行此代码的结果，因为这可能会导致大混乱。例如，代码的一部分可能会生成一个新密钥，该密钥被存储在\
  \ `aesM.Key` 属性中，而该属性又会被另一个正在运行的代码部分读取。因此，从 `aesM.Key` 属性读取的值将是损坏。\n\n一种可能的解决方案是使用同步结构来保护每个变化的值和状态。然而，在这种情况下这是没有必要的——它只会增加更多代码和同步开销。另一种更具扩展性的解决方案是重构循环体，并将这些局部变量作为作为委托的方法内部的局部变量进行传递。为了做到这一点，你需要在循环体内创建\
  \ `AesManaged` 实例。这样，它就不会被所有并行迭代共享。这种更改增加了每次迭代运行的指令，但它消除了不必要的副作用，并创建了安全且无状态的并行代码。以下代码显示了新的体，并了移动到委托内部的\
  \ `aesM` 变量：\n\n![download](img/download.gif)\n\n```\n{\n    byte[] result;\n  \
  \  string hexString;\n    var aesM = new AesManaged();\n    byte[] result = aesM.Key;\n\
  \    string hexString = ConvertToHexString(result);\n    // Console.WriteLine(\"\
  AES KEY: {0} \", hexString);\n});\n```\n\n代码片段为 `Snippet2_5`\n\n为了转换 `GenerateMD5Hashes`\
  \ 中的原始循环体，必须解决一个非常相似的问题。Listing 2-6 显示了带有顺序 `for` 循环的原方法。在这种情况下，`ParallelGenerateMD5Hashes`\
  \ 是新方法。有必要使用上述相同的重构技术，因为你不知道 `MD5` 实例是否持有可能产生问题的内部状态。为每次迭代创建一个新的独立实例更安全。以下几行显示了新的体，并显示了移动到委托内部的\
  \ `md5M` 变量：\n\n![download](img/download.gif)\n\n```\n{\n    var md5M = MD5.Create();\n\
  \    byte[] data = Encoding.Unicode.GetBytes(Environment.UserName + i.ToString());\n\
  \    byte[] result = md5M.ComputeHash(data);\n    string hexString = ConvertToHexString(result);\n\
  \    // Console.WriteLine(\"MD5 HASH: {0}\", hexString);\n});\n```\n\n代码片段为 `Snippet2_5`\n\
  \n## 衡量扩展性\n\n将 `Main` 方法替换为以下新版本，首先启动 `ParallelGenerateAESKeys`，然后启动 `ParallelGenerateMD5Hashes`：\n\
  \n![download](img/download.gif)\n\n```csharp\nstatic void Main(string[] args)\n\
  {\n    var sw = Stopwatch.StartNew();\n    ParallelGenerateAESKeys();\n    ParallelGenerateMD5Hashes();\n\
  \    Debug.WriteLine(sw.Elapsed.ToString());\n    // 显示结果并等待用户\n    Debug.WriteLine(\"\
  Finished!\");\n    Console.ReadLine();\n}\n```\n\n\n\n\n\n并不是所有问题都是“尴尬并行的”（embarrassingly\
  \ parallel）的。然而，世界上存在许多尴尬并行的算法，例如之前介绍的示例。理解 TPL 在处理尴尬并行问题时所提供的最重要特性会变得更容易。\n\n尴尬并行问题通常不需要复杂的协调机制。然而，在现实复杂的应用程序中，你将需要添加代码来协调许多并发任务之间的通信。后续章节将解释\
  \ TPL 中发现最重要的结构，第 5 章将涵盖协调结构，并将其应用于最重要的 TPL 结构中。\n\n## Parallel.ForEach\n\n有时，如之前所述，重构现有的\
  \ `for` 循环可能是一项复杂的任务，且代码的更改可能会为每次迭代产生过多的开销，从而降低整体性能。一种实用的替代方案是将所有待处理的数据划分为部分，这些部分可以并行运行较小的、独立的顺序循环。为了做到这一点，你使用带有带有自定义分区器的\
  \ `Parallel.ForEach` 循环来创建顺序循环的新版本，从而具有更简洁的重构过程。\n\n`Parallel.ForEach` 提供了一种并行处理数据集合的通用机制。你可以利用整数范围作为数据集集，并使用自定义分区器将此范围转换为块（chunks）。每个块都通过循环遍历进行并行处理。[Listing\
  \ 2-7] 显示了使用重构循环的新代码，它使用命令式语法来实现由 `Parallel.ForEach` 提供的数据并行性。该方法似乎与顺序 `for` 循环和使用\
  \ `System.Collections.Concurrent.Partitioner` 创建的自定义分区器相结合。新方法 `ParallelPartitionGenerateAESKeys`\
  \ 和 `ParallelPartitionGenerateMD5Hashes` 也尝试利用所有可用内核，这取决于 `Parallel.ForEach` 在底层执行的工作以及执行的范围分区，将较小的顺序循环分布到尽可能多的并行循环中。代码还根据运行时的现有硬件优化了其行为。\n\
  \n![download](img/download.gif)\n\n[Listing 2-7:] 使用带有自定义分区器的 `Parallel.ForEach`\
  \ 对原始顺序循环进行的另一种并行化版本\n\n```csharp\nprivate static void ParallelPartitionGenerateAESKeys()\n\
  {\n    var sw = Stopwatch.StartNew();\n    Parallel.ForEach(Partitioner.Create(1,\
  \ NUM_AES_KEYS + 1), range =>\n        {\n            var aesM = new AesManaged();\n\
  \            Debug.WriteLine(\n                \"AES Range ({0}, {1}. TimeOfDay\
  \ before inner loop starts: {2})\",\n                range.Item1, range.Item2,\n\
  \                DateTime.Now.TimeOfDay);\n            for (int i = range.Item1;\
  \ i < range.Item2; i++)\n            {\n                aesM.GenerateKey();\n  \
  \              byte[] result = aesM.Key;\n                string hexString = ConvertToHexString(result);\n\
  \                // Console.WriteLine(\"AES KEY: {0} \", hexString);\n         \
  \   }\n        });\n    Debug.WriteLine(\"AES: \" + sw.Elapsed.ToString());\n}\n\
  \nprivate static void ParallelPartitionGenerateMD5Hashes()\n{\n    var sw = Stopwatch.StartNew();\n\
  \    Parallel.ForEach(Partitioner.Create(1, NUM_MD5_HASHES + 1), range =>\n    \
  \    {\n            var md5M = MD5.Create();\n            Debug.WriteLine(\n   \
  \             \"MD5 Range ({0}, {1}. TimeOfDay before inner loop starts: {2})\"\
  ,\n                range.Item1, range.Item2,\n                DateTime.Now.TimeOfDay);\n\
  \            for (int i = range.Item1; i < range.Item2; i++)\n            {\n  \
  \              byte[] data = Encoding.Unicode.GetBytes(i);\n                byte[]\
  \ result = md5M.ComputeHash(data);\n                string hexString = ConvertToHexString(result);\n\
  \                // Console.WriteLine(\"MD5: {0}\", hexString);\n            }\n\
  \        });\n    Debug.WriteLine(\"MD5: \" + sw.Elapsed.ToString());\n}\n```\n\n\
  该代码使用了 TPL 的另一个重要命名空间 `System.Collections.Concurrent`，它允许你访问 .NET Framework 4 中引入的有用集合和自定义分区器。你可以使用此命名空间来处理示例所示：\n\
  \n![download](img/download.gif)\n\n```csharp\nusing System.Collections.Concurrent;\n\
  ```\n\n`Parallel.ForEach` 类提供了以下参数：\n\n- `source`: 这是提供将数据拆分为多个分区的分区器。\n- `Body`:\
  \ 这是被调用的委托（delegate），在每次迭代中调用一次，且没有预定义的计划。它接收每个分区作为参数，类型为 `Tuple<int, int>`。\n\n\
  此外，`Parallel.ForEach` 可以返回一个 `ParallelLoopResult` 值。\n\n### 在并行循环中使用分区\n\n[Listing\
  \ 2-5] 显示了带有顺序循环的原始 `GenerateKey` 方法。[Listing 2-7] 中所示的代码行代表相同的 `for` 循环。唯一改变的行是\
  \ `for` 定义，它考虑了由 `range.Item1` 和 `range.Item2` 分配的下限和上限：\n\n![download](img/download.gif)\n\
  \n```csharp\nfor (int i = range.Item1; i < range.Item2; i++)\n```\n\n在这种情况下，重构顺序循环变得更容易，因为不需要移动变量。唯一的区别是，`Parallel.ForEach`\
  \ 不再处理整个源，而是将数据拆分为许多独立的分区。每个分区通过一个顺序内部循环工作。以下代码将分区定义为 `Parallel.ForEach` 的第一个参数：\n\
  \n![download](img/download.gif)\n\n```csharp\nPartitioner.Create(1, NUM_AES_KEYS\
  \ + 1)\n```\n\n此行将从 1（包含）到 `NUM_AES_KEYS + 1`（不包含）的范围划分为许多具有上限和下限的分区，并创建一个 `Tuple<int,\
  \ int>`（`Tuple<Int32, Int32>`）。然而，它没有指定创建的分区数量，因此 `Partitioner.Create` 使用内置默认值。`ParallelPartitionGenerateAESKeys`\
  \ 包含了每个生成分区的下限和上限以及开始运行该范围顺序循环的实际时间（`DateTime.Now.TimeOfDay`），如下：\n\n![download](img/download.gif)\n\
  \n```csharp\nDebug.WriteLine(\"AES Range ({0}, {1}. TimeOfDay before inner loop\
  \ starts: {2})\",\n    range.Item1, range.Item2,\n    DateTime.Now.TimeOfDay);\n\
  ```\n\n将 `Main` 方法替换为以下新版本，首先启动 `ParallelPartitionGenerateAESKeys`，然后是 `ParallelPartitionGenerateMD5Hashes`：\n\
  \n![download](img/download.gif)\n\n```csharp\nstatic void Main(string[] args)\n\
  {\n    var sw = Stopwatch.StartNew();\n    ParallelPartitionGenerateAESKeys();\n\
  \    ParallelPartitionGenerateMD5Hashes();\n    Debug.WriteLine(sw.Elapsed.ToString());\n\
  \    // 显示结果并等待用户按键\n    Console.WriteLine(\"Finished!\");\n    Console.ReadLine();\n\
  }\n```\n\n\n\n\n如列表 2-8 所示，分区器在特定的特定机器上创建了 13 个范围。默认创建的范围数量将根据逻辑核心数和范围大小等因素发生变化。因此，`Parallel.ForEach`\
  \ 将运行 13 次带有范围的顺序内层 for 循环。然而，它们不会同时启动，因为在只有 4 个核心可用来分配 13 个分区的情况下，这样做并不是一个好主意。并行循环会尝试根据可用硬件资源来实现执行的负载均衡。高亮行显示了并发引入的复杂度。考虑到内层循环开始之前，第一个到达顺序内层\
  \ for 循环的分区是 `(66667, 133333)`，而不是 `(1, 66667)`。请记住列表 2-8 中显示的上限值是排他的，因为内层 for 循环使用了小于操作符（`<`）。\n\
  \n此外，数据在调试输出中出现的顺序与 `WriteLine` 方法被调用的顺序不同。这种顺序的变化是因为对 `WriteLine` 方法有许多并发调用。事实上，在测量加速情况时，在循环开始之前注释这些行是非常重要的。向调试输出写入信息会对总时间产生影响，因为该方法产生了一个瓶颈。\n\
  \n### 列表 2-8: 在四核微处理器上运行 ParallelPartitionGenerateAESKeys 的调试输出\n\nAES Range (133333,\
  \ 199999. 内层循环开始前的时间: 15:45:38.2205775)\nAES Range (66667, 133333. 内层循环开始前的时间: 15:45:38.2049775)\n\
  AES Range (266665, 333331. 内层循环开始前的时间: 15:45:38.2361775)\nAES Range (199999, 266665.\
  \ 内层循环开始前的时间: 15:45:38.2205775)\nAES Range (1, 66667. 内层循环开始前的时间: 15:45:38.2205775)\n\
  AES Range (333331, 399997. 内层循环开始前的时间: 15:45:39.0317789)\nAES Range (399997, 466663.\
  \ 内层循环开始前的时间: 15:45:39.0317789)\nAES Range (466663, 533329. 内层循环开始前的时间: 15:45:39.1097790)\n\
  AES Range (533329, 599995. 内层循环开始前的时间: 15:45:39.2345793)\nAES Range (599995, 666661.\
  \ 内层循环开始前的时间: 15:45:39.3281794)\nAES Range (666661, 733327. 内层循环开始前的时间: 15:45:39.9365805)\n\
  AES Range (733327, 799993. 内层循环开始前的时间: 15:45:40.0145806)\nAES Range (799993, 800001.\
  \ 内层循环开始前的时间: 15:45:40.1705809)\n\n这种使用自定义分区的 `Parallel.ForEach` 新版本运行所需的时间与之前的\
  \ `Parallel.For` 版本大致相同。\n\n### 根据核心数优化分区\n\n你可以调整生成的分区，以使其与运行时发现的逻辑核心数匹配。内置默认设置在尝试此点的同时，维持了一定的负载均衡。`System.Environment.ProcessorCount`\
  \ 提供了操作系统检测到的逻辑核心或逻辑处理器的数量。如果你知道工作负载非常平衡，可以使用此值来计算每个分区的所需的范围大小。你可以使用以下公式作为调用 `Partitioner.Create`\
  \ 的第三个参数：\n\n`((numberOfElements / numberOfLogicalCores) + 1): int or long`\n\n\
  你可以使用以下代码在 `ParallelPartitionGenerateAESKeys` 中创建分区：\n\n```csharp\nPartitioner.Create(\n\
  \    1, \n    NUM_AES_KEYS, \n    ((int)(NUM_AES_KEYS / Environment.ProcessorCount)\
  \ + 1))\n```\n代码片段为列表 2_9\n\n你可以使用非常相似的行来改进 `ParallelPartitionGenerateMD5Hashes`：\n\
  \n```csharp\nPartitioner.Create(\n    1,\n    NUM_MD5_HASHES,\n    ((int)(NUM_MD5_HASHES\
  \ / Environment.ProcessorCount) + 1))\n```\n代码片段为列表 2_9\n\n如列表 2-9 所示，分区器创建了四个范围，因为所需的范围大小是\
  \ `((int) (800000 / 4) + 1) = 200001`。因此，`Parallel.ForEach` 将根据可用逻辑核心数运行四次顺序内层循环。\n\
  \n### 列表 2-9 优化分区版本的 ParallelPartitionGenerateAESKeys 在四核微处理器上运行时生成的调试输出\n\nAES\
  \ Range (1, 200002. 内层循环开始前的时间: 16:32:5.1375428)\nAES Range (200004, 400000. 内层循环开始前的时间:\
  \ 16:32:5.137548)\nAES Range (400003, 600004. 内层循环开始前的时间: 16:32:5.137548)\nAES Range\
  \ (200002, 200003. 内层循环开始前的时间: 16:32:5.137548)\n\n现在，`ParallelPartitionGenerateAESKeys`\
  \ 和 `ParallelGenerateMD5Hashes` 运行大约 3.4 秒，因为它们根据可用核心创建了许多分区。因此，相对于顺序版本，加速效果是 `10\
  \ / 3.4 约为 3x`。这种优化的设计可能减少了时间。由于对 `WriteLine` 方法有许多并发调用，这种顺序的变化发生了。事实上，在测量加速情况时，在循环开始之前注释这些行是非常重要的。向调试输出写入信息会对总时间产生影响，因为该方法产生了一个瓶颈。\n\
  \n现代架构提供的 TPL 包含了许多功能。你可以利用这些功能来提高性能。利用。利用。利用。利用。利用。利用。利用。利用。利用。利用。利用。利用。利用。利用。利用。利用。利用。利用。通过。这种并行化，减少了不必要的开销。你可以利用这些包含\
  \ TPL 的功能来提高性能。\n\n图 2-10 代表了四个核心的可能执行流。\n\n图 2-10 优化方案。\n\n列表 2-10 显示了分区器在八核核心上创建\
  \ 8 个范围的结果，因为所需的范围大小是 `((int)800000 / 8) + 1 = 100001`。在这种情况下，`Parallel.ForEach`\
