  \     // 你想以牺牲公平性换取性能\n        // 因此，你为 useMemoryBarrier 传递了 false\n        sl.Exit(false);\n\
  \    }\n}\n```\n来自 Snippet5_12 的代码片段\n\n### 基于自旋的等待\n\n当你必须等待短时间直到满足特定条件，且不希望发生昂贵的上下文切换时，基于自旋的等待（spin-based\
  \ waiting）是一个很好的替代方案。`SpinWait` 类型提供了基本的自旋功能，并提供了 `SpinUntil` 方法自旋直到满足特定条件。此外，`SpinWait`\
  \ 是一个 `struct`，大小仅为单个 `Int32`。它不会产生不必要的开销。从内存角度来看，它的使用成本很低。\n\n长时间自旋不是一个好主意，因为它会阻塞高优先级的线程及其相关任务。相反，`SpinWait`\
  \ 在自旋足够长时间后会产生内核转换所需的切换片。`SpinLock` 只是 `SpinWait` 的薄封装。\n\n当线程自旋时，它会将一个核心置于密集循环中，不会释放处理器的时间片。然而，正如之前解释的，`SpinWait`\
  \ 结构中包含的智能逻辑会在自旋足够长时间后停止自旋并产生上下文切换。这种上下文切换是昂贵的，但长时间自旋反而更昂贵。因此，在大多数情况下，你不应该在循环内部调用\
  \ `Thread.Sleep` 来等待特定条件的满足。然而，需要注意的是如果你向 `Thread.Sleep` 传递 0，当前线程可能会挂起以允许其他等待线程执行。\n\
