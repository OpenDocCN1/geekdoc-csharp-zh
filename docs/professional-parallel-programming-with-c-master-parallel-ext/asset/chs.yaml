  ```\n\n\n\n\n\n```csharp\nprivate Task<string> ReadAllTextAsync(string path)\n{\n\
  \    // 获取文件信息\n    FileInfo info = new FileInfo(path);\n    if (!info.Exists)\n\
  \    {\n        // 文件不存在\n        throw new FileNotFoundException(\n           \
  \ String.Format(\"{0} does not exist.\", path),\n            path);\n    }\n   \
  \ // 此数组将存储从\n    // 文件读取的数据\n    byte[] data = new byte[info.Length];\n    // 创建新的\
  \ FileStream\n    // 从文件读取，并\n    // 将 useAsync 设置为 true\n    // 以使用异步输入\n    FileStream\
  \ stream =\n        new FileStream(path, FileMode.Open,\n            FileAccess.Read,\
  \ FileShare.Read,\n            BUFFER_SIZE, true);\n    // 将 APM 读取操作封装在 Task 中\n\
  \    // 将 APM 流的 stream.BeginRead 和\n    // stream.EndRead 方法封装在任务 中\n    Task<int>\
  \ task =\n        Task<int>.Factory.FromAsync(\n            stream.BeginRead, stream.EndRead,\n\
  \            data, 0, data.Length, null,\n            TaskCreationOptions.None);\n\
  \    // Task 将持有读取的\n    // 字节数\n    // 为 task 添加一个延续任务\n    // 并返回它\n    return\
  \ task.ContinueWith((t) =>\n    {\n        stream.Close();\n        Console.WriteLine(\n\
  \            \"One task has read {0} bytes from {1}.\",\n            t.Result, stream.Name);\n\
  \        // 此延续任务返回\n        // 从文件中读取的数据\n        // 作为 UTF8 编码的字符串\n        return\
  \ (t.Result > 0) ?\n            new UTF8Encoding().GetString(data) : \"\";\n   \
  \ }, TaskContinuationOptions.ExecuteSynchronously);\n}\n\nprivate void AdvanceProgressBar()\n\
  {\n    // 此代码在 UI 线程中运行\n    // 不存在可能的并发情况\n    // 无需锁，也不需要\n    // 原子子操作\n    pgbFiles.Value++;\n\
  }\n\nprivate void butConcatTextFiles_Click(object sender, EventArgs e)\n{\n    //\
  \ 此调度器将在当前的 SynchronizationContext\n    // 上执行任务\n    // 也就是说，它将安全地访问 UI 控件\n  \
  \  var uiScheduler = Task.FromSynchronizationContext();\n    // 重置进度条\n    pgbFiles.Value\
  \ = 0;\n    // 设置进度条的最大值\n    pgbFiles.Maximum = fileNames.Length;\n    Task.Factory.StartNew(()\
  \ =>\n    {\n        fileTasks = new List<Task<string>>(fileNames.Length);\n   \
  \     foreach (string fileName in fileNames)\n        {\n            // 启动一个 Task<string>\n\
  \            // 它将从文件中\n            // 读取的所有数据以字符串形式存储\n            // 并作为任务的结果\n\
  \            var readTask = ReadAllTextAsync(@\"C:\\MYFILES\\\" + fileName);\n \
  \           readTask.ContinueWith((t) =>\n            {\n                // 此代码在\n\
  \                // UI 线程中运行\n                AdvanceProgressBar();\n          \
  \  }, uiScheduler);\n            // 将新的 Task<string> 添加到 fileTasks\n           \
  \ // 无需调用 Start 方法\n            // 因为任务是通过\n            // FromAsync 方法创建的\n   \
  \         fileTasks.Add(readTask);\n        }\n        // 编写一个延续任务\n        // 在所有异步操作完成后启动\n\
  \        var builderTask = Task.Factory.ContinueAll(\n            fileTasks.ToArray(),\n\
  \            (antecedentTasks) =>\n            {\n                // 等待所有前置任务\n\
  \                // 以确保传播\n                // 任何前置任务中发生的\n                // 异常\n\
  \                Task.WaitAll(antecedentTasks);\n                var sb = new StringBuilder();\n\
  \                // 从文件中读取的所有数据\n                foreach (Task<string> fileTask\
  \ in antecedentTasks)\n                {\n                    sb.Append(fileTask.Result);\n\
  \                }\n                return sb.ToString();\n            });\n   \
  \     builderTask.ContinueWith((antecedentTask) =>\n        {\n            // 此代码在\n\
  \            // UI 线程中运行\n            txtAllText.Text = antecedentTask.Result;\n\
  \        }, uiScheduler);\n    });\n}\n```\n\n当用户点击“合并文件”按钮时，UI 线程仍然保持响应，因为大多数代码都运行在分配给任务的工作线程线程中，正如之前为\
  \ WPF 应用所解释的那样。必须更新 UI 控件的任务在 UI 线程中运行，因为它们指定了 `uiScheduler` 作为它们的 `TaskScheduler`。图\
