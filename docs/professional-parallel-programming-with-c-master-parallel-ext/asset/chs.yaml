  \ {\n            _output = antecedentTask.Result;\n            lstOutput.ItemsSource\
  \ = _output;\n        }\n```\n来自 Listing11_1 的片段\n\n图 11-5 显示了 WPF 应用程序窗口，列表框中显示了离散傅里叶变换输出数组的内容。\n\
  \n图 11-5\n\n![11.5](img/c11f005.jpg)\n\n## 使用多核就、高度优化的软件函数\n\n当 Listing 11-1 中的代码调用\
  \ `DFTI.DftiComputeForward` 方法时，定义的 P/Invoke 方法允许你运行用于 MKL DLL (`mkl_rt.dll`) 的未托管\
  \ `DftiComputeForward` 函数。该函数使用多个线程和 SIMD 指令来优化计算。\n\n由于该示例使用了适用于多核就绪的优化软件函数，它在托管代码范围之外创建了线程。因此，检查这些优化软件函数的文档是非常重要的。如果它们已经针对多核进行了优化，你不应该从多个线程中调用它们，因为这可能会导致过度争用（oversubscription）问题并降低整体性能。\n\
  \n例如，假设你从托管代码调用 `DftiComputeForward` 函数来处理一个巨大的数据集，而 MKL DLL 创建了四个线程来优化执行以利用四个逻辑核心。如果你需要在四个独立的巨大数据集上计算四个离散傅里叶变换，而你不知道该函数已经针对多核进行了优化且是线程安全的，你可能会决定从四个独立任务运行四次\
  \ `DftiComputeForward` 函数来优化你的应用程序。然而，由于每个 `DftiComputeForward` 函数都使用四个线程来优化其执行，你将拥有\
  \ 4 x 4 = 16 个具有密集计算需求的线程，这将导致过度争用问题。\n\n然而，如果你按照建议阅读了文档，你会发现该函数已针对多核进行了优化并使用多个线程；因此，你应该一个接一个调用\
  \ `DftiComputeForward` 函数。`DftiComputeForward` 函数的每次执行都会通过使用必要的线程利用多核优势。附录 B，“并发\
  \ UML 模型”解释了如何在 UML 图中添加并发文档。\n\n## 将基于任务编程与外部优化库混合\n\nListing 11-1 显示了如何将基于任务的编程优势与已针对多核优化的外部库函数执行的示例。代码创建一个新任务来配置外部库的参数并异步执行该函数。代码将外部调用封装在\
  \ `Task<TResult>` 中，其中 `TResult` 是外部函数的输出。\n\n代码并没有保持 UI 线程阻塞，而是使用任务和后续操作在 UI 线程中运行必要的代码。你可以在任务中执行\
  \ P-Invoke；因此，你可以在任务执行的委托委托中调用 MKL 函数。\n\n在这个示例中，优化后的库允许你在 C# 应用程序中利用 SIMD 指令，而基于任务的编程使你能够用简单的代码创建响应式\
  \ UI。\n\n## 并行生成伪随机数\n\n`System.Random` 类表示一个伪随机数生成器。然而，如果你需要并行生成伪随机数序列，应该避免使用共享的\
  \ `Random` 实例。由于 `System.Random` 类持有状态，它不是线程安全的——这意味着如果你并发调用返回伪随机数的方法，该状态将会被损坏。\n\
  \n你可以在调用返回每个伪随机数的方法之前使用互斥锁（mutual-exclusion lock）来解决这个问题，但这会导致数的生成序列化并导致性能非常糟糕。\n\
  \n你可以在每次生成伪随机数时创建一个新的 `System.Random` 实例，但同样，为每个数创建新实例会导致性能低下。然而，还有一个更严重的问题：与串行执行此伪随机数生成的结果相比，其质量可能不如预期。默认情况下，当你使用无参数构造函数创建新的\
  \ `Random` 实例时，该类使用与时间相关的值作为种子。这个数字在不断变化，但增加其计数需要几毫秒。如果你运行之前解释的并行化代码，在具有多核处理器的计算机上运行时，极有可能会有许多具有相同种子的\
  \ `Random` 类。多个实例可能会共享相同的种子；因此，它们可能会产生完全相同的伪随机数。如果你想要良好的伪随机数，你需要找到一个更好的替代方案。\n\n\
  \n\n\n\n# 附录 C，“并行扩展附加（Parallel Extensions Extras）”提供了关于补充并行扩展的有用类和结构的信息。其中一个类是\
  \ `System.Threading.ThreadSafeRandom` 类。该类提供了一个简单线程安全的 `Random` 实现，允许你并发地生成伪随机数。\n\
  \nListing 11-2 显示了 `ThreadSafeRandom` 类的代码，它是 `Random` 的子类。该代码在 `System.Threading`\
  \ 命名空间内定义了 `ThreadSafeRandom` 类。此代码 .NET Framework 4 并行编程示例中包含的协调数据结构的一部分。\n\nListing\
  \ 11-2: 为并发准备的伪随机数生成器\n\n```csharp\n//  此代码是的一部分 \n\n//  .NET Framework 4 并行编程示例\n\
  //  Copyright (c) Microsoft Corporation. 保留所有权利. \n// \n//  文件: ThreadSafeRandom.cs\n\
  //  这些注释不是原始文件的一部分\nusing System;\nusing System.Security.Cryptography;\n\nnamespace\
  \ System.Threading\n{\n    public class ThreadSafeRandom : Random\n    {\n     \
  \   // 这是一个种子提供者\n        private static readonly RNGCryptoServiceProvider _global\n\
  \            = new RNGCryptoServiceProvider();\n        // 这是随机性提供者\n        //\
  \ 每个线程将有一个\n        // Random 实例\n        // 因为它被声明为 ThreadLocal<Random>\n     \
  \   private ThreadLocal<Random> _local =\n            new ThreadLocal<Random>(()\
  \ =>\n            {\n                // 这是一个 valueFactory 函数\n                //\
  \ 这段代码将为每个线程运行\n                // 以初始化每个独立的 Random 实例\n                var buffer\
  \ = new byte[4];\n                // 调用 RNGCryptoServiceProvider 的 GetBytes 方法\n\
  \                // 因为该类在此种用法下是线程安全的\n                _global.GetBytes(buffer);\n\
  \                // 返回用生成的种子初始化的\n                // 新线程本地 Random 实例\n         \
  \       return new Random(\n                BitConverter.ToInt32(buffer, 0));\n\
  \            });\n        public override int Next()\n        {\n            return\
  \ _local.Value.Next();\n        }\n        public override int Next(int maxValue)\n\
  \        {\n            return _local.Value.Next(maxValue);\n        }\n       \
  \ public override int Next(int minValue, int maxValue)\n        {\n            return\
  \ _local.Value.Next(minValue, maxValue);\n        }\n        public override double\
  \ NextDouble()\n        {\n            return _local.Value.NextDouble();\n     \
  \   }\n        public override void NextBytes(byte[] buffer)\n        {\n      \
  \      _local.Value.NextBytes(buffer);\n        }\n    }\n}\n```\n\n`ThreadSafeRandom`\
  \ 类使用了 .NET Framework 4 中引入的 `System.Threading.ThreadLocal<T>` 类为每个线程初始化一个 `Random`\
  \ 实例。`ThreadLocal<T>` 类以高效的方式提供线程本地数据的存储，并允许你指定一个被调用的 `Func<T>` 来生成延迟初始的值。这意味着当你指定了此\
  \ `Func<T>` 并尝试获取当前线程实例的值时，如果该实例尚未初始化，则会调用初始化函数。这样，指定的 `Func<T>` 代码就会根据需要返回值，因为每个新线程都需要访问它。这种机制被称为延迟初始化。\n\
  \n以下行定义了私有 `ThreadLocal<Random>` 变量 `_local`：\n\n![download](img/download.gif)\n\
  \n```csharp\nprivate ThreadLocal<Random> _local = new ThreadLocal<Random>(() =>\n\
  {\n    var buffer = new byte[4];\n    _global.GetBytes(buffer);\n    return new\
  \ Random(BitConverter.ToInt32(buffer, 0));\n});\n```\n来自 Listing11_2 的代码片段\n\n如果你在分配给线程\
  \ #0 的任务中创建 `ThreadSafeRandom` 的新实例，并且该实例访问了 `_local`，则作为 `ThreadLocal<Random>`\
  \ 参数指定的 `Func<Random>` 将运行。代码创建一个带有种子的新 `Random` 实例并作为 `_local` 的值返回。如果分配给线程 #0\
  \ 的同一任务调用 `ThreadSafeRandom` 实例的访问 `_local` 的方法，则初始化代码将不会再次运行，控制 `_local` 变量值的 `ThreadLocal<Random>`\
  \ 实例将提供之前创建的 `Random` 实例访问。延迟初始化代码不会再次运行，因为为当前线程（线程 #0）已经创建了一个实例。\n\n如果你在分配给线程 #1\
  \ 的不同任务中访问之前创建的 `ThreadSafeRandom` 实例，并调用访问 `_local` 的方法，作为 `ThreadLocal<Random>`\
  \ 参数指定的 `Func<Random>` 将运行。这是因为 `ThreadLocal` 负责为每个不同的线程初始化一个独立的值。代码创建一个带有种子的新 `Random`\
  \ 实例并作为 `_local` 的值返回。如果分配给线程 #1 的同一任务调用 `ThreadSafeRandom` 实例的访问 `_local` 的方法，则初始化代码将不会再次运行，控制\
  \ `_local` 变量值的 `ThreadLocal<Random>` 实例将提供之前创建的 `Random` 实例访问。\n\n![download](img/note.gif)\n\
  `ThreadLocal<T>` 提供高效的线程本地存储实现。然而，访问其值存在开销。`ThreadLocal<Random>` 解决了每个线程具有独立 `Random`\
  \ 实例的问题。`ThreadSafeRandom` 类通过使用共享的 `System.Security.Cryptography.RNGCryptoServiceProvider`\
  \ 实例（`_global`）作为种子来解决这个问题。每当 `Random` 实例的延迟初始化代码运行时，它都会调用 `GetBytes` 方法填充字节数组（`buffer`）加密强随机值。延迟初始化函数返回一个用字节数组转换为整数的新\
  \ `Random` 实例。这种方式，每个线程都有完全不同的种子。因此，分配给不同线程的多个任务可以共享同一个 `ThreadSafeRandom` 实例并发执行。\n\
  \n`ThreadSafeRandom` 类重写了生成并返回伪数值的方法：`Next`、`NextDouble` 和 `NextBytes`。新方法使用由 `ThreadLocal`\
  \ 控制并在访问 `_local` 时返回的 `Random` 实例来生成相应的伪数值。\n\nListing 11-3 显示了 `Generate1Input`\
  \ 方法的新版本，该方法使用 `ThreadSafeRandom` 实例通过并行循环为离散里叶变换生成伪随机双精度值。\n\n\n\n\n\n```csharp\n\
  private double[] Generate1DInput()\n{\n    var randomNumbers = new ConcurrentBag<double>();\n\
  \    var tsRandom = new ThreadSafeRandom();\n    Parallel.For(0, INPUT_SIZE, (int\
  \ i) =>\n    {\n        // 每个线程都有自己的\n        // 独立的 Random \n        // 实例，因为它\n\
  \        // 使用了 ThreadLocalStorage<Random>\n        randomNumbers.Add(tsRandom.NextDouble());\n\
  \    });\n    return randomNumbers.ToArray<double>();\n}\n```\n\n新的 `Generate1DInput`\
  \ 方法创建一个新的 `ThreadSafeRandom` 实例（`tsRandom`），然后运行 `Parallel.For` 循环，使用 `tsRandom.NextDouble()`\
  \ 方法的结果填充 `ConcurrentBag`（`randomNumbers`）。由 `Parallel.For` 循环创建的多样化任务将在不同的线程上运行，每个线程的底层\
  \ `Random` 实例将使用一个非常不同的种子值初始化，且该值与滴答数（ticks）无关。然后，代码将 `ConcurrentBag` 转换为 `double`\
  \ 数组并返回并行生成的伪随机数。\n\n# 使用 Intel 集成性能库 (Intel IPP)\n\nIntel IPP 是一个针对数字媒体和数据处理应用程序的高度优化数学软件函数库。这些函数使用多线程和\
  \ SIMD 指令，根据底层硬件实现最佳性能。IPP 包含多个 DLL，你可以通过平台调用服务（P/Invokes）从 C# 代码中调用其函数。\n\n代码列表\
