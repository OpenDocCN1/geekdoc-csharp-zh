  \ Forms 应用，充分利用基于任务的编程模型。\n\n## 创建执行 EAP 操作的任务\n\n你不能使用 `FromAsync` 方法将现有类中找到的 EAP\
  \ 操作暴暴露为任务。但是，你可以使用 `System.Threading.Task.TaskCompletionSource<TResult>` 实例将 EAP\
