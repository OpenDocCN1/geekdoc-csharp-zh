  \ 垂直滤波器并在屏幕上显示结果。默认图像为 `C:\\Pictures\\Test.jpg`。\n\n当你点击 `Apply Sobel Filter Vertical`\
  \ 按钮时，`butProcessImage_Click` 事件处理器中的代码会启动 `filterTask`，这是一个调用 `ApplyFilterSobelVert`\
  \ 方法的 `Task<Bitmap>`。然后，代码为 `filterTask` 编写了一个延续任务，在 `imgProcessedImage` 图像控件中显示应用于\
  \ JPEG 图像的 Sobel 垂直滤波结果。为了保持示例简单，代码没有检查可能发生的错误。相反，代码使用任务和延续任务以异步执行运行 Sobel 垂直滤波器，并在需要显示结果图像之前保持\
  \ UI 线程非阻塞状态。\n\n`ApplyFilterSobelVert` unsafe 方法为 `C:\\Pictures\\Test.jpg` 位图运行\
  \ Sobel 垂直滤波器。该方法准备了源和目标数据以及指针，以调用应用滤波器的图像处理 IPP 方法 `ipp.ip.ippiFilterSobelVert_8u_C3R`。\n\
  \n首先，该方法通过读取本地变量 `fileName` 指定路径创建一个新的 `Bitmap`（`originalImage`），并通过调用 `GetBitmapData`\
  \ 方法将位锁定到系统内存。只读位可以通过 `srcBitmapData` 使用。\n\n由于你需要一个目标位图，该方法创建了一个名为 `destinationImage`\
  \ 的新 `Bitmap`，其宽度和高度与原始位图相同。然后，代码通过 `GetBitmapData` 方法将位锁定到系统内存。这些位可以通过 `dstBitmapData`\
  \ 进行读写。\n\n新的 `roi IppiSize` 结构指定了图像的感兴趣区域（ROI）。然后，代码定义了字节指针 `pSrc` 和 `pDst`，用于访问源和目标位图的像素数据。此时，Sobel\
  \ 滤波的所有必要参数都已就绪；因此，代码按如下方式调用 `ipp.ip.ippiFilterSobelVert_8u_C3R` 方法：\n\n![download](img/download.gif)\n\
  \n```\nIppStatus status = ipp.ip.ippiFilterSobelVert_8u_C3R(pSrc, srcBitmapData.Stride,\n\
  \                               pDst, dstBitmapData.Stride, roi);\n```\n来自 `Listing11_4`\
  \ 的代码片段\n\n该方法应用滤波器并将生成的像素存储在目标位图中。然后，无论 `IPP` 滤波器的结果如何，代码都会解锁源和目标位图的位并返回 `destinationImage`。但如果发生错误，方法应该检查\
  \ `status` 变量的值并抛出必要的异常。你已经知道如何在带有延续的任务中处理异常。\n\n`filterTask` 任务被定义为 `Task<Bitmap>`，它返回调用\
  \ `ApplyFilterSobelVert` 方法的结果。链接到 `filterTask` 任务上的延续任务接收此任务作为 `antecedentTask`。如果发生异常，代码会直接捕获它。如果图像处理滤波器运行正常，运行在创建\
  \ UI 控件的同一线程中的代码将如下在 `imgProcessedImage` 控件中显示生成的位图：\n\n![download](img/download.gif)\n\
  \n```\nfilterTask.ContinueWith(\n    (antecedentTask) => =>\n    {\n        try\n\
  \        {\n            var outBitmap = antecedentTask.Result;\n            imgProcessedImage.Source\
  \ = Imaging.CreateBitmapSourceFromHBitmap(\n                outBitmap.GetHbitmap(),\
  \ IntPtr.Zero, System.Windows.Int32Rect.Empty,\n                outBitmap.Width,\
  \ outBitmap.Height));\n        }\n        catch (AggregateException ex)\n      \
  \  {\n            foreach (Exception innerEx in ex.InnerExceptions)\n          \
  \  {\n                // 处理异常\n            }\n        }\n    });\n```\n\n\n\n\n\n\
