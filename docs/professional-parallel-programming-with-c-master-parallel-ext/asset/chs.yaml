  \ `Parallel.Invoke` 将让您在出现问题时能够更细致地控制取消信号向 `Task` 实例的传播。\n\n例如，如果消费者任务达到超时时间，它将向生产者任务发送信号以取消它。如果您没有取消生产者，那么当后续阶段没有活跃的消费者来处理生成的数据时，它将继续工作。如果您需要取消\
  \ `ManualResetEventSlim` 实例中的 `Wait` 方法，可以使用上一节中学到的技术。\n\n## 与 ManualResetEvent\
  \ 协作\n\n当您需要进行跨进程或跨 AppDomain 同步时，您必须使用 `ManualResetEvent` 而不是 `ManualResetEventSlim`。`ManualResetEvent`\
  \ 不具备与 `ManualResetEventSlim` 相同的成员——例如，它没有用于检查事件是否为真（已设置/已信号）的 `IsSet` 属性，而且它不支持取消令牌。`ManualResetEvent`\
  \ 实例提供了以下方法，这些方法与为 `ManualResetEventSlim` 解释的方法等效：\n\n- `Reset` — 将事件设置为 false（未信号）。\n\
  - `Set` — 将事件设置为 true（已信号）。如果任务调用了 `WaitOne` 方法，一旦此方法被调用，这些任务将解解除阻塞。\n- `WaitOne`\
  \ — 等同于 `ManualResetEventSlim` 的 `Wait` 方法。该方法会阻塞当前任务或线程，直到另一个任务或线程通过调用 `Set` 方法为此\
  \ `ManualResetEvent` 实例设置 `EventWaitHandle` 事件。如果事件已经处于信号状态，它将立即返回。它将始终执行基于内核的等待。`WaitOne`\
  \ 方法许多定义，允许您以 `int` 或 `TimeSpan` 形式发送超时时间。\n\n![note](img/note.gif)\n\n`ManualResetEvent`\
  \ 提供了更多方法。然而，上述列表解释了当您只需要在任务中发送信号并等待事件时会用到的最常用方法。\n\n`ManualResetEvent` 实例暴露了 `SafeWaitHandle`\
  \ 属性，允许您获取或设置原生操作系统的句柄。\n\n# 限制并发访问资源\n\n有时，您需要限制可以访问资源或资源池的并发任务或线程数量。在这种情况下，表示计数信号量的\
  \ `System.Threading.Semaphore` 类通常会很有帮助。它代表一个 Windows 内核信号量对象。然而，当您预计等待时间非常短时，新的\
  \ `SemaphoreSlim` 开销更小，且更适合与任务配合，因为它提供了一个不使用 Windows 内核信号量对象的计数信号量。\n\n计数信号量在 .NET\
  \ Framework 中被称为 `semaphore`，它通过跟踪进入和离开的任务或线程来协调对资源的访问。信号量需要知道通过其协调功能能够访问共享资源的最大数量。然后，它使用一个计数，根据进入和离开信号量控制区域的任务对该计数进行递减和递增。\n\
  \n每当任务进入信号量时，其计数就会减 1。这样，当计数达到 0 时，到达的新请求将将被阻塞，直到其他任务离开信号量。每当任务离开由信号量协调的资源时，任务必须释放信号量，并且信号量的计数将加\
  \ 1。此时，被阻塞并等待信号量允许其访问共享资源的任务之一将能够进入信号量，其计数将减 1。\n\n![note](img/note.gif)\n\n信号量会降低可扩展性，而这正是它的设计目的。因此，您必须非常小心地使用它，并且仅在需要时使用。释放受信号量控制的资源将限制访问这些资源的代码的可扩展性。与任何其他同步技术一样，在您确定它们是最佳选择时才使用信号量。\n\
  \n图 5-15 展示了信号量如何通过计算进入和释放、并在需要时阻塞来控制对资源的访问。有四个任务请求进入信号量，该信号量的最大并发任务数设置为 3，初始计数也为\
  \ 3。前三个请求进入信号量的任务能够访问共享资源，结果导致信号量的计数减至 0。此时，第四个任务 Task #3 请求进入信号量。该任务被阻塞，直到其他三个任务之一释放信号量。然后，Task\
  \ #0 释放了信号量，其计数加 1，信号量允许 #3 访问。信号量的计数随之减 1。\n\n图 5-15\n\n![15](img/c15)\n\n## 与\
  \ SemaphoreSlim 协作\n\n`SemaphoreSlim` 实例允许您控制资源。每个任务必须使用其方法进入和释放信号量。`SemaphoreSlim`\
  \ 的构造函数之一接收一个 `int` 值，表示初始允许请求的数量。该值是初始值，也用于设置最大请求数。另一个构造函数接收两个参数：初始值和最大请求数。当您指定一个不同于最大请求数的初始值时，可以使用此构造函数。\n\
  \n列表 5-3 显示了模拟并发攻击的代码。为了保持示例简单，代码通过使用 `Thread.Sleep` 来模拟负载。记住，随机数生成应该改进，以便在并发任务中生成真实的数字。附录\
  \ C，“并行扩展”提供了关于 `ThreadSafe` 类的信息。然而，示例使用了标准的 `Random` 类来保持简单。\n\n![下载](img/download.gif)\n\
  \n列表 5-3\n使用 SemaphoreSlim 模拟最大并发攻击\n```csharp\nprivate static SemaphoreSlim _semaphore;\n\
  private static Task[] _tasks;\nprivate const int MAX_MACHINES = 3;\nprivate static\
  \ int _attacks = Environment.ProcessorCount;\nprivate static void SimulateAttacks(int\
  \ attackerNumber)\n{\n    // 模拟负载\n    var sw = Stopwatch.StartNew();\n    // 生成随机毫秒数进行等待\n\
  \    var rnd = new Random();\n    Thread.Sleep(rnd.Next(2000,5000));\n    // 在此点，方法拥有模拟攻击\n\
  \    // 所需的数据\n    // 需要进入信号量\n    // 等待 _semaphore 授予访问\n    Console.WriteLine(\"\
  WAIT #### Attacker {0} 请求进入信号量.\", attackerNumber);\n    _semaphore.Wait();\n  \
  \  // 当进入信号量时，此代码运行\n    try\n    {\n        Console.WriteLine(\"ENTER ---> Attacker\
  \ {0} 进入了信号量.\", attackerNumber);\n    }\n```\n\n\n\n\n\n```csharp\n// 模拟攻击\n\n\
  // 模拟负载\n\nsw.Restart();\n\nThread.Sleep(rnd.Next(2000,5000));\n\n}\n\nfinally\n\
  {\n    // 退出信号量\n    _semaphore.Release();\n    Console.WriteLine(\n        \"RELEASE\
  \ <--- Attacker {0} released the semaphore.\",\n        attackerNumber);\n}\n}\n\
  \nstatic void Main(string[] args)\n{\n    _tasks = new Task[_attackers]; // 创建 SemaphoreSlim\
  \ 实例\n    // 其初始计数设置为 MAX_MACHINES\n    // 其最大并发访问数\n    // 也将被设置为 MAX_MACHINES\n\
  \    _semaphore = new SemaphoreSlim(MAX_MACHINES);\n    Console.WriteLine(\n   \
  \     \"{0} attackers are going to be able to enter the semaphore.\",\n        _semaphore.CurrentCount);\n\
  \    for (int i = 0; i < _attackers; i++)\n    {\n        _tasks[i] = Task.Factory.StartNew((num)\
  \ =>\n        {\n            var attackerNumber = (int)num;\n            for (int\
  \ j = 0; j < 10; j++)\n            {\n                SimulateAttacks(attackerNumber);\n\
  \            }\n        }, i);\n    }\n    var finalTask =\n        Task.Factory.ContinueWhenAll(_tasks,\
  \ (tasks) =>\n    {\n        // 等待所有任务完成，以确保\n        // 任何在 _tasks 中发生的\n     \
  \   // 异常已传播\n        Task.WaitAll(_tasks);\n        Console.WriteLine(\n      \
  \      \"The simulation was executed.\");\n        // 释放 SemaphoreSlim 实例\n    \
  \    _semaphore.Dispose();\n    });\n    // 等待 finalTask 完成\n    finalTask.Wait();\n\
  \    Console.ReadLine();\n}\n```\n\n`Main` 方法创建了一个名为 `_semaphore` 的 `SemaphoreSlim`\
  \ 实例，其初始计数设置为 `MAX_MACHINES`，代表该信号量允许的最大并发访问数。它创建的 `Task` 实例数量与逻辑核心数相同。`SimulateAttacks`\
  \ 方法中的代码假设攻击在运行受信号量限制的代码之前，需要处理大量的复杂数据。因此，此代码可以利用所有可用的逻辑核心。事实上，当为每次攻击准备数据的指令不同时，代码可以从额外的并行性中受益。\n\
  \n当每个任务需要访问需要限制并发数的代码时，它会调用 `_semaphore.Wait()` 方法。一旦完成，它就会调用 `_semaphore.Release()`\
  \ 方法。`SimulateAttacks` 方法将此调用包含在 `try...finally` 块的 `finally` 部分。确保即使发生异常时也调用了 `Release`\
  \ 方法是非常关重要的（你已经在之前的章节中学习了被阻塞的任务所带来的头疼问题）。此外，在完成对 `SemaphoreSlim` 实例的使用后对其进行 `Dispose`（释放资源）处理也是一种良好的实践习惯。\n\
  \n`SemaphoreSlim` 实例提供以下方法：\n\n* `Release` — 退出信号量并增加其计数。该方法返回信号量之前的计数。你也可以通过一个\
  \ `int` 类型参数调用此方法，以指定退出信号量的次数。\n* `Wait` — 阻塞当前任务或线程，直到其计数大于 0 能够进入信号量。如果信号量的计数大于\
  \ 0，此方法将减少其计数并在执行此操作后立即返回。它提供了许多定义，允许你向其发送 `CancellationToken` 实例或作为 `int` 或 `TimeSpan`\
  \ 的超时时间。\n\n`SemaphoreSlim` 实例暴露了以下只读属性：\n\n* `CurrentCount` — 获取将获得许可进入信号量的任务或线程数。由于此值始终在变化，因此当信号量执行\
  \ `Release` 和 `Wait` 方法时，`CurrentCount > 0` 在某一时刻并不意味着它在任务或线程的下一条指令中仍保持为真。因此，使用\
  \ `Wait` 和 `Release` 方法进入和离开受信号量保护的资源是非常关重要的。\n* `WaitHandle` — 提供封装了操作对象的 `WaitHandle`\
  \ 对象。该对象允许等待信号量，但不会改变信号量的计数。这种行为与 `Semaphore` 不同，在 `Semaphore` 中，对 `WaitHandle`\
  \ 对象调用 `WaitOne` 会改变其计数。如果你需要这种行为，则需要使用 `Semaphore` 而不是 `SemaphoreSlim`。\n\n以下演示了在具有四个逻辑核心的计算机上运行代码，且四个攻击者请求进入信号量时发生的情况。其中三个获得了访问权限，在其中一个释放信号量后，第四个攻击者\
  \ `Attacker 3` 就可以进入信号量。\n\n* 3 attackers are going to be able to enter the semaphore.\n\
  * `WAIT` `Attacker 1` requested to enter the semaphore.\n* `WAIT` `Attacker 0` requested\
  \ to enter the semaphore.\n* `WAIT` `Attacker 2` requested to enter the semaphore.\n\
  * `WAIT` `Attacker 3` requested to enter the semaphore.\n* `ENTER` `Attacker 2`\
  \ entered the semaphore.\n* `ENTER` `Attacker 0` entered the semaphore.\n* `ENTER`\
  \ `Attacker 1` entered the semaphore.\n* `RELEASE` ← `Attacker 1` released the semaphore.\n\
  * `RELEASE` ← `Attacker 0` released the semaphore.\n* `RELEASE` ← `Attacker 2` released\
  \ the semaphore.\n* `ENTER` `Attacker 3` entered the semaphore.\n* `RELEASE` ← `Attacker\
  \ 3` released the semaphore.\n\n[图 5-16] 显示了通过调用 `Wait` 方法请求进入信号量的行，以及显示 `_semaphore`\
  \ `Current Count = 0` 的窗口。\n\n`SemaphoreSlim` 实例不保证等待进入信号量的任务或线程的顺序。它没有 LIFO（后进先出）或\
  \ FIFO（先进先出）队列。\n\n## 超与取消\n\n与你之前学习协调结构一样，信号量可能会阻塞任务或线程。如果一个或多个任务没有调用 `Release`\
  \ 方法，其他任务可能无法进入信号量。为了保持之前的示例简单，它没有包含处理任务异常的必要代码。\n\n你可以通过向 `SemaphoreSlim` 实例的 `Wait`\
  \ 方法发送毫秒数参数来建立超时，你也可以发送 `CancellationToken` 实例。之前的章节提供了其他协调结构处理超时和取消的详细示例。这些技术也适用于\
  \ `SemaphoreSlim` 实例。\n\n## 使用 Semaphore\n\n当你需要跨进程或跨 AppDomain 同步，或者需要 `WaitHandle`\
  \ 操作来减少信号量的计数时，你必须使用 `Semaphore` 而不是 `SemaphoreSlim`。`Semaphore` 不具有与 `SemaphoreSlim`\
  \ 相同的成员——例如，它没有获取将获得许可进入信号量的任务或线程数的 `CurrentCount` 属性，并且不支持取消令牌。`Semaphore` 实例提供以下与\
  \ `SemaphoreSlim` 说明的方法对应的方法：\n\n* `Release` — 退出信号量并增加其计数。该方法返回信号量之前的计数。你也可以通过一个\
  \ `int` 类型参数调用此方法，以指定退出信号量的次数。\n* `WaitOne` — 等同于 `SemaphoreSlim` 的 `Wait` 方法。此方法阻塞当前任务或线程，直到其计数大于\
  \ 0 能够进入信号量。这在 `WaitHandle` 接收到信号时发生。如果信号量的计数大于 0，此方法将减少其计数并在执行此操作后立即返回。它提供了许多定义，允许你向其发送作为\
  \ `int` 或 `TimeSpan` 的超时时间。\n\n\n\n\n\n`Semaphore` 提供了更多方法。然而，前面的列表解释了当你需要计数信号量的基本功能时会用到的最常用方法。\n\
  \n`Semaphore` 实例暴露了 `SafeWaitHandle` 属性，允许你获取或设置原生操作系统的句柄。\n\n[Listing 5-4] 显示了一个模拟攻击者尝试获取机器访问权限的代码。这段新代码使用\
  \ `Semaphore` 代替 `SemaphoreSlim` 来允许最大数量的并发攻击任务访问。\n\n![download](img/download.gif)\n\
  \n### Listing 5-4: 使用 Semaphore 模拟最大并发攻击数\n\n```csharp\nprivate static Semaphore\
  \ _semaphore;\n\nprivate static Task[] _tasks;\n\nprivate const int MAX_MACHINES\
  \ = 3;\n\nprivate static int _attackers =\n    Environment.ProcessorCount;\n\nprivate\
  \ static void SimulateAttacks(int attackerNumber)\n{\n    // 模拟工作负载\n    var sw\
  \ = Stopwatch.StartNew();\n    // 生成一个随机的毫秒等待时间\n    var rnd = new Random();\n \
  \   Thread.Sleep(rnd.Next(2000,5000));\n    // 在此节点，方法已经有了模拟攻击// 所需的数据\n    // 需要进入信号量\n\
  \    // 等待 _semaphore 授予访问\n    Console.WriteLine(\n\"WAIT #### 攻击者 {0} 请求进入信号量。\"\
  ,\n        attackerNumber);\n    _semaphore.WaitOne();\n    // 此代码在进入信号量后执行\n  \
  \  try\n    {\n        Console.WriteLine(\n            \"ENTER ---> 攻击者 {0} 进入了信号量。\"\
  ,\n            attackerNumber);\n        // 模拟攻击\n        // 模拟工作负载\n        sw.Restart();\n\
  \        Thread.Sleep(rnd.Next(2000,5000));\n    }\n    finally\n    {\n       \
  \ // 退出信号量\n        _semaphore.Release();\n        Console.WriteLine(\n        \
  \    \"RELEASE <--- 攻击者 {0} 释放了信号量。\",\n            attackerNumber);\n    }\n}\n\
  \nstatic void Main(string[] args)\n{\n    _tasks = new Task[_attackers];\n    //\
  \ 创建 Semaphore 实例\n    // 将初始计数设置为 MAX_MACHINES\n    // 将最大并发访问数\n    // 也设置为 MAX_MACHINES\n\
  \    _semaphore = new Semaphore(MAX_MACHINES, MAX_MACHINES);\n    Console.WriteLine(\n\
  \"{0} 个攻击者将能够进入信号量。\",\n        MAX_MACHINES);\n    for (int i = 0; i < _attackers;\
  \ i++)\n    {\n        _tasks[i] = Task.Factory.StartNew((num) =>\n        {\n \
  \           var attackerNumber = (int)num;\n            for (int j = 0; j < 10;\
  \ j++)\n            {\n                SimulateAttacks(attackerNumber);\n      \
  \      }\n        }, i);\n    }\n    var finalTask = Task.Factory.ContinueWhenAll(_tasks,\
  \ (tasks) =>\n    {\n        // 等待所有任务完成，以确保\n        // 任何 _tasks 中发生的异常\n    \
  \    // 都能被传播\n        Task.WaitAll(_tasks);\n        Console.WriteLine(\n     \
  \       \"模拟已执行.\");\n        // 释放 Semaphore 实例\n        _semaphore.Dispose();\n\
  \    });\n    // 等待 finalTask 完成\n    finalTask.Wait();\n    Console.ReadLine();\n\
  }\n```\n\n`Semaphore` 最简单的构造函数需要两个 `Int32` 参数：初始并发请求数和最大并发进入数。在 [Listing 5-4] 中，`Semaphore`\
  \ 实例没有预留项，因此代码在调用构造函数时对两个参数都传递了 `MAX_MACHINES`，如下：\n`_semaphore = new Semaphore(MAX_MACHINES,\
  \ MAX_MACHINES);`\n\n# 使用 CountdownEvent 简化动态和合并场景\n\n有时，你需要随时间跟踪动态数量的任务。`CountdownEvent`\
  \ 是一个非常轻量级的同步原语，比使用 `Task.WaitAll` 或 `TaskFactory.ContinueWhenAll` 在其他任务执行完成后运行代码开销更小。\n\
  \n`CountdownEvent` 实例有一个初始信号计数。在典型的 fork/join 场景中，任务每次完成工作时，都会向 `CountdownEvent`\
  \ 实例发送信号并将计数减一。调用 `CountdownEvent` 实例 `Wait` 方法的任务将阻塞，直到信号计数达到 0。你可以通过新的所需信号计数重置它来重用\
  \ `CountdownEvent` 实例。`CountdownEvent` 构造函数接收一个带有初始信号计数的 `int` 值。\n\n[Listing 5-5]\
  \ 显示了一个启动动态数量并发任务以模拟路径的应用程序。为了保持示例简单，代码通过 `Thread.Sleep` 方法阻塞任务几秒随机时间，来模拟路径模拟的工作负载。\n\
  \n![download](img/download.gif)\n\n### Listing 5-5: 使用 CountdownEvent 用并发任务模拟动态数量的路径\n\
  \n```csharp\nprivate static CountdownEvent _countdown;\n\nprivate static int MIN_PATHS\
  \ =\n    Environment.ProcessorCount;\n\nprivate static int MAX_PATHS =\n    Environment.ProcessorCount\
  \ * 3;\n\nprivate static void SimulatePaths(int pathCount)\n{\n    for (int i =0;\
  \ i < pathCount; i++)\n    {\n        Task.Factory.StartNew((num) =>\n        {\n\
  \            try\n            {\n                var pathNumber = (int)num;\n  \
  \              // 模拟工作负载\n                var sw = Stopwatch.StartNew();\n     \
  \           // 生成一个随机\n                // 毫秒等待时间\n                var rnd = new\
  \ Random();\n                Thread.Sleep(rnd.Next(200,500));\n                Console.WriteLine(\n\
  \                    \"路径 {0} 模拟完成。\",\n                    pathNumber);\n     \
  \       }\n            finally\n            {\n                // 通知 CountdownEvent\
  \ \n                // 减少计数\n                _countdown.Signal();\n            }\n\
  \        }, i);\n    }\n}\n\nstatic void Main(string[] args)\n{\n    _countdown\
  \ = new CountdownEvent(MIN_PATHS);\n    var t1 = Task.Factory.StartNew(() =>\n \
  \   {\n        for (int i = MIN_PATHS; i <= MAX_PATHS; i++)\n        {\n       \
  \     Console.WriteLine(\n                >>>> {0} 并发路径开始。\",\n                i);\n\
  \            // 重置计数为 i\n            _countdown.Reset(i);\n        }\n        //\
  \ 合并\n        _countdown.Wait();\n    });\n}\n```\n\n\n\n\n\n3. 它调用 `SimulatePaths`\
  \ 方法，并将循环变量 `i` 作为参数传递。`SimulatePaths` 创建并启动了作为参数接收到的数量的任务。该方法在创建并启动任务后立即返回——它不会等待任务完成执行。每当一个任务完成工作时，它都会调用\
  \ `_countdown` 的 `Signal` 方法，信号计数将减一。\n\n4. 它调用 `_countdown` 的 `Wait` 方法进行等待（join）。该任务将阻塞，直到信号计数达到\
  \ 0。当循环的当前迭代中中由 `SimulatePaths` 启动的所有任务都向 `_countdown` 发送信号时，信号计数将达到 0。\n\n5. 在所有任务向\
  \ `_countdown` 发送信号后，该任务解除阻塞并写入一行显示已模拟路径数量的内容。\n\n以下几行显示了使用八个逻辑核心运行 Listing 5-5\
  \ 所示代码的首次结果：\n\n```\n>>>> 8 Concurrent paths start.\nPath 1 simulated.\nPath 2 simulated.\n\
  Path 3 simulated.\nPath 5 simulated.\nPath 4 simulated.\nPath 6 simulated.\nPath\
  \ 0 simulated.\nPath 7 simulated.\n<<<< 8 Concurrent paths end.\n\n>>>> 9 Concurrent\
  \ paths start.\nPath 0 simulated.\nPath 1 simulated.\nPath 3 simulated.\nPath 8\
  \ simulated.\nPath 7 simulated.\nPath 6 simulated.\nPath 4 simulated.\nPath 5 simulated.\n\
  Path 2 simulated.\n<<<< 9 Concurrent paths end.\n\n>>>> 10 Concurrent paths start.\n\
  Path 5 simulated.\nPath 4 simulated.\nPath 8 simulated.\nPath 0 simulated.\nPath\
  \ 6 simulated.\nPath 2 simulated.\nPath 7 simulated.\nPath 9 simulated.\nPath 3\
  \ simulated.\nPath 1 simulated.\n<<<< 10 Concurrent paths end.\n\n>>>> 11 Concurrent\
  \ paths start.\n…\n…\n```\n\n当由 `SimulatePaths` 创建并启动的每个任务完成工作时，它会调用 `_countdown.Signal`\
  \ 方法。`SimulatePaths` 方法将此调用包含 `try...finally` 块的 `finally` 部分中。即使发生异常，确保调用了 `Signal`\
  \ 方法也是非常重要的。（你已经在之前的节中学习了被阻塞任务带来的头疼问题。）在完成对 `CountdownEvent` 实例的使用后，对其进行释放（dispose）\
  \ 也是一种良好的做法。\n\n`CountdownEvent` 实例提供以下方法：\n\n*   `AddCount` — 将当前计数加 1 或加由 `int`\
  \ 参数指定的数值。\n*   `Reset` — 将解除调用 `Wait` 方法的任务或线程阻塞所需的剩余信号数重置为初始计数，或重置为 `int` 参数指定的值。你应该只在没有其他任务或线程访问\
  \ `CountdownEvent` 的时候调用此方法。\n*   `Signal` — 注册一个信号，并减少解除调用 `Wait` 方法的任务或线程阻塞所需的剩余信号数。默认情况下，该方法将当前计数减\
  \ 1。然而，该方法还有另一种定义，允许你指定一个 `int` 参数，表示在单次调用中注册的信号数量，并按指定的数量减少计数。\n*   `TryAddCount`\
  \ — 尝试将当前计数加 1 或加由 `int` 参数指定的数值。返回一个指示递加是否成功的 `bool` 值。\n*   `Wait` — 阻塞当前任务或线程直到\
  \ `CountdownEvent` 被设置；即信号计数达到 0。如果信号计数已经为 0，该方法将立即返回。`Wait` 方法有许多定义，允许向其发送一个 `CancellationToken`\
  \ 实例和/或作为 `int` 或 `TimeSpan` 的超时时间。\n\n`CountdownEvent` 实例暴露了以下四个只读属性：\n\n*   `CurrentCount`\
  \ — 获取解除调用 `Wait` 方法的任务或线程阻塞所需的剩余信号数。\n*   `InitialCount` — 获取解除调用 `Wait` 方法的任务或线程阻塞所需的初始数量。\n\
  *   `IsSet` — 提供一个 `bool` 值，指示事件是否为真（已设置）。\n*   `WaitHandle` — 提供封装了操作系统对象的 `WaitHandle`\
  \ 对象。该操作系统对象允许你等待事件被设置。\n\n与你之前学过的协调结构一样，`CountdownEvent` 可能会阻塞一个永久等待（join）的任务或线程。如果一个或多个任务没有调用\
  \ `Signal` 方法，调用 `Wait` 方法的任务将保持阻塞状态。为了保持简单，上一个示例没有包含处理 `Task` 实例异常或超时的必要代码。\n\n\
  你可以通过将毫秒数作为参数发送给 `CountdownEvent` 实例的 `Wait` 方法来建立超时。你也可以发送一个 `CancellationToken`\
  \ 实例。之前的节提供了关于如何处理其他协调结构的超时和取消的详细示例。相同的技术可以用于 `CountdownEvent` 实例。\n\n# 使用原子操作工作\n\
  \nListing 5-1 展示了许多运行不同阶段以渲染场景的并发任务的示例。对于统计这些任务运行必要方法的次数，你有许多替代方案。考虑一种必须使用共享变量的算法。许多并发任务运行以渲染场景的方法组。你不能使用传统的递增操作增加共享变量，因为它们不是线程安全的。因此，如果你想对共享\
  \ `int` 进行序列化，必须获取一个互斥锁并在关键区域内执行操作。事实上，使用独立的同步对象是一种常见的做法。递增操作是非常廉价的，因此你可能会认为 `SpinLock`\
  \ 是序列化递增的一个很好的替代方案。尽管它不是最佳方案，但以下行展示了 Listing 5-1 中 `Main` 方法的第一部分的的新版本。这个新版本使用名为\
  \ `sl` 的 `SpinLock` 实例来获取锁并在关键区域执行代码，并由所有参与者增加 `totalRenders` `int` 变量。也有必要添加几行代码以任务安全和线程安全的方式增加值。\n\
  \n\n\n\n\n```csharp\n{\n    // You need to make sure that\n    // you release the\
  \ lock\n    if (lockTaken)\n    {\n        // 如果实际获取了锁，则释放锁\n        // 你希望牺牲公平性换取性能\n\
  \        // 因此，你为 useMemoryBarrier 传递 false\n        sl.Exit(false);\n    }\n}\n\
  }, i);\n\nvar finalTask = Task.Factory.ContinueWhenAll(_tasks, (tasks) =>\n{\n \
  \   // 等待所有任务完成，以确保\n    // 任何 _tasks 中发生的任何异常\n    // 都能被传播\n    Task.WaitAll(_tasks);\n\
  \    Console.WriteLine(\n        \"{0} renders were executed.\",\n        totalRenders);\n\
  \    // 释放 Barrier 实例\n    _barrier.Dispose();\n});\n\n// 等待 finalTask 完成\nfinalTask.Wait();\n\
  Console.ReadLine();\n```\n\n来自 Snippet5_21 的代码片段\n\n当 barrier 的所有参与者完成工作时，`finalTask`\
  \ 运行代码显示 `totalRenders` 的最终值。该代码运行正常，因为递增操作是序列化的。然而，与其使用互斥锁来对共享变量执行简单操作，你可以使用更简单的原子操作。你已经在本章开始通过汽车、车道和标志的示例学习了原子操作的简单性。现在，是时候编写执行原子操作的代码了。\n\
  \n`System.Threading.Interlocked` 类为多个任务和线程共享的变量提供了原子操作。该类提供的方法可以将对共享变量的操作视为一个单一操作，该操作要么完全成功，要么完全失败。使用\
  \ `Interlocked` 类提供的原子操作的主要优势是它们是廉价、高效且线程安全的。\n\n你已经知道在不同核心上运行并发代码的问题。递增共享实例变量的值通常需要以下低级步骤：\n\
  \n1. 将共享实例变量的值加载到寄存器中。\n2. 增寄存器的值。\n3. 将新值存储在共享实例变量中。\n\n如果两个或多个线程按照这些步骤递增值而没有序列化执行，则变量的最终值将是不可预测的。\n\
  \n`Interlocked.Increment` 方法递增整数变量，并将新结果作为原子且线程安全的操作存储。以下几行显示了之前代码的新版本，没有使用锁。此版本使用\
  \ `Interlocked.Increment` 以原子操作递增 `totalRenders`。\n\n![download](img/download.gif)\n\
  \n```csharp\nstatic void Main(string[] args)\n{\n    _tasks = new Task[_participants];\n\
  \    _barrier = new Barrier(_participants, (barrier) =>\n    {\n        Console.WriteLine(\"\
  phase: {0}\", barrier.CurrentPhase);\n    });\n    int totalRenders = 0;\n    for\
  \ (int i = 0; i < _participants; i++)\n    {\n        _tasks[i] = Task.Factory.Start((num)\
  \ =>\n        {\n            var participantNumber = (int)num;\n            for\
  \ (int j = 0; j < 10; j++)\n            {\n                CreatePlanets(participantNumber);\n\
  \                _barrier.AndWait();\n                CreateStars(participantNumber);\n\
  \                _barrier.AndWait();\n                CheckCollisionsBetweenPlanets(participantNumber);\n\
  \                _barrier.AndWait();\n                CheckCollisionsBetweenStars(participantNumber);\n\
  \                _barrier.AndWait();\n                RenderCollisions(participantNumber);\n\
  \                _barrier.AndWait();\n                // 使用原子操作递增 totalRenders\n\
  \                Interlocked.Increment(ref totalRenders);\n            }\n     \
  \   }, i);\n    }\n    var finalTask = Task.Factory.ContinueWhenAll(_tasks, (tasks)\
  \ =>\n    {\n        // 等待所有任务完成，以确保\n        // 任何 _tasks 中发生的任何异常\n        //\
  \ 都能被传播\n        Task.WaitAll(_tasks);\n        Console.WriteLine(\n           \
  \ \"{0} renders were executed.\",\n            totalRenders);\n        // 释放 Barrier\
  \ 实例\n        _barrier.Dispose();\n    });\n\n    // 等待 finalTask 完成\n    finalTask.Wait();\n\
  \    Console.ReadLine();\n}\n```\n\n\n\n\n\n*   可以使用新的轻量级同步原语，除非从功能角度来看，必须使用相应的重量级原语，例如当需要跨进程同步时。\n\
  *   可以使用超时机制（timeouts）和取消令牌（cancellation tokens）来避免任务在无通知的情况下永久阻塞。\n*   你应该尽可能利用新\
  \ `Task` 类提供的新可能性。但是，请记住使用性能分析工具来为每个场景确定最方便的选项。\n*   当等待时间很短时，可以使用自旋（spin）来避免不必要的上下文切换。\n\
  *   为了效率和最大可扩展性，请尽可能避免锁。但是，为了编码方便起见，请使用锁，不要试图一直尝试编写无锁代码。如果你没有必要的经验，编写无锁代码本身非常困难且非常容易出错。\n\
  *   尽可能使用原子操作代替锁。但是，请记住，正确性比良好的性能更重要。只有在你清楚自己在做什么，并且确定不需要锁时，才使用原子操作。\n\n# 第 6 章：PLINQ：声明式数据并行化\n\
  \n## 本章包含哪些内容？\n\n*   将 LINQ 转换为并行 LINQ\n*   理解 PLINQ 中的分区（partitioning）\n*   使用\
  \ PLINQ 执行还原操作（reduction operations）\n*   创建自定义 PLINQ 聚合函数\n*   处理并发 PLINQ 任务\n\
  *   取消 PLINQ 并衡量其可扩展性\n*   指定所需的并行度\n*   使用 `ForAll` 并理解它与 `foreach` 的区别\n*   通过使用\
  \ `WithMergeOptions` 配置 PLINQ 结果返回方式\n*   处理 PLINQ 抛出的异常\n*   使用 PLINQ 执行 Map Reduce\
  \ 算法\n\n本章解释了如何使用并行语言集成查询（PLINQ）处理声明式数据并行以及任务与数据分解的混合体。在阅读本章之前，理解前几章节中解释的所有内容非常重要，因为本章结合了之前学过的许多主题。\n\
  \n本章解释了如何将 LINQ 查询转换为 PLINQ 查询，以及根据不同场景调整其并行执行的各种技术。此外，它还解释了如何使用 PLINQ 及其聚合函数执行经典的并行\
  \ Map Reduce 算法。有时，PLINQ 提供的结果并不是开发者预期的。因此，理解潜在的性能瓶颈以及解决它们的不同方法也同样重要。\n\n# 将 LINQ\
  \ 转换为 PLINQ\n\n你已经知道语言集成查询（LINQ）非常有助于查询和处理不同的数据源。如果你正在使用 LINQ to Objects，现在你可以利用其并行实现——并行\
  \ LINQ（PLINQ）来利用并行优势。\n\n![note](img/note.gif)\n\nPLINQ 实现了全套 LINQ 操作符，并增加了用于并行执行的新操作符。PLINQ\
  \ 与其 LINQ 对应可以实现显著的加速，但这取决于场景，并行化一向如此。如果查询涉及大量的计算和内存密集型操作，且不在乎顺序，那么加速可能会是巨大的。然而，当顺序很重要时，加速可能会减少。\n\
  \n正如你所预期的，LINQ 和 PLINQ 可以与第 4 章“并发集合”中解释的新并发集合配合。以下代码定义了一个简单但密集型的方法，用于计算并返回作为参数的字符串中的字母数量：\n\
  \n![download](img/download.gif)\n\n```csharp\nstatic int CountLetters(String key)\n\
  {\n    int letters = 0;\n    for (int i = 0; i < key.Length; i++)\n    {\n     \
  \   if (Char.IsLetter(key, i))\n        {\n            letters++;\n        }\n \
  \   }\n    return letters;\n}\n```\n代码片段自 Snippet6_1\n\n一个用于返回所有至少 10 个字母且包含 A、F\
  \ 和 9，但不包含 B 的 AES 密钥的简单 LINQ 表达式看起来如下：\n\n```csharp\nvar keysWith10Letters = from\
  \ key in Keys\n                        where (CountLetters(key) >= 10) \n      \
  \                        && (key.Contains('A')) \n                             \
  \ && (key.Contains('F')) \n                              && (key.Contains('9'))\
  \ \n                              && (!key.Contains('B'))\n                    \
  \    select key;\n```\n\n为了将上述 LINQ 表达式转换为可以利用并行优势的 PLINQ 表达式，必须使用 `AsParallel`\
  \ 方法，如下：\n\n```csharp\nvar keysWith10Letters = from key in Keys.AsParallel()\n \
  \                       where (CountLetters(key) >= 10) \n                     \
  \         && (key.Contains('A')) \n                              && (key.Contains('F'))\
  \ \n                              && (key.Contains('9')) \n                    \
  \          && (!key.Contains('B'))\n                        select key;\n```\n\n\
  这样，当执行查询时，它将尝试在运行时利用所有逻辑核心，运行速度比原来的版本更快。\n\n你可以在 `Main` 方法末尾添加代码，使用第 4 章“并发集合”中定义的\
  \ `ParallelGenerateAESKeys` 方法填充 `ConcurrentQueue (Keys)` AES 密钥，以便根据 PLINQ 查询返回某些结果。以下代码显示了新的\
  \ `Main` 方法：\n\n![download](img/download.gif)\n\n```csharp\nstatic void Main(string[]\
  \ args)\n{\n    Console.ReadLine();\n    Console.WriteLine(\"Started\");\n    var\
  \ cts = new System.Threading.CancellationTokenSource();\n    var ct = cts.Token;\n\
  \    var sw = Stopwatch.StartNew();\n    Keys = new ConcurrentQueue<String>();\n\
  \    var tAsync = new Task(() => ParallelGenerateAESKeys(ct, 'A'));\n    tAsync.Start();\n\
  \    // 执行一些操作\n    // 等待 tAsync 完成\n    tAsync.Wait();\n    // 定义并行运行的查询\n    var\
  \ keysWith10Letters = from key in Keys.AsParallel()\n                          \
  \  where (CountLetters(key) >= 10)\n                               && (key.Contains('A'))\n\
  \                               && (key.Contains('F'))\n                       \
  \        && (key.Contains('9'))\n                               && (!key.Contains('B'))\n\
  \                            select key;\n    // 输出查询的某些结果\n    // 当需要结果时 PLINQ\
  \ 查询执行\n    var keysList = keysWith10Letters.ToList();\n    Console.WriteLine(\"\
  生成了 {0} 个至少 10 个字母、包含 A、F 和 9 但不包含 B 的十六进制密钥。\", keysList.Count());\n    Console.WriteLine(\"\
  第一个密钥: {0} \", keysList.ElementAt(0));\n    Console.WriteLine(\"最后一个密钥: {0} \",\
  \ keysList.ElementAt(keysWith10Letters.Count() - 1));\n    Console.WriteLine(\"\
  耗时: {0}\", sw.Elapsed.ToString());\n    Console.ReadLine();\n}\n```\n代码片段自 Sni6_1\n\
  \n此代码显示了符合条件的密钥数量、第一个和最后一个，存储在针对 `Keys` 的 PLINQ 查询结果中。以下代码表示控制台输出示例：\n\nStarted\n\
  生成了 834 个至少 10 个字母、包含 A、F 和 9 但不包含 B 的十六进制密钥。\n第一个密钥: ACAEFE9D07EE894E03D62D87A65D18A6F9F0C6458D41A00168F429CE109D9\n\
  最后一个密钥: A3DF422312C02E8F4079648071E1C8C8CE82C3C01103DE3207F57495C7A3F9\n耗时: 00:00:02.9270689\n\
  \n## ParallelEnumerable 及其 AsParallel 方法\n\n`System.Linq.ParallelEnumerable` 类负责暴露大部分\
  \ PLINQ 功能功能，包括最重要的 `AsParallel` 方法。表 6.1 总结了 PLINQ 特有的方法。\n\n\n\n\n\n### 表 6.1\
  \ ParallelEnumerable 暴露的 PLINQ 运算符\n\n| 值 | 描述 |\n| :--- | :--- |\n| `AsOrdered()`\
  \ | PLINQ 在查询的剩余部分必须保留源序列的顺序，直到使用 `orderby` 子句更改顺序，或通过 `AsUnordered` 禁用。 |\n| `AsParallel()`\
  \ | 尽可能对查询的剩余部分进行并行处理。 |\n| `AsSequential()` | 查询的剩余部分应按顺序运行，就像传统的 LINQ 一样。 |\n\
  | `AsUnordered()` | PLINQ 不需要在查询的剩余部分保留源序列的顺序。 |\n| `ForAll()` | 此列举方法允许使用多个任务并行处理结果。\
  \ |\n| `WithCancellation` | 此方法与取消令牌配合使用，允许取消查询执行，正如你在之前的章节中在并行循环和任务中所学习的那样。 |\n\
  | `WithDegreeOfParallelism` | PLINQ 的优化方式将使得总可用核心数等于作为此方法参数所指定的并行度。 |\n| `WithExecutionMode`\
  \ | 当默认行为为像传统 LINQ 一样顺序运行时，此方法可以强制并行执行。 |\n| `WithMergeOptions` | 这可以提供关于 PLINQ\
  \ 如何在消费查询的线程上合并并行结果片段的提示。 |\n\n## AsOrdered 和 orderby 子句\n\n之前的示例显示了在没有特定顺序的情况下执行查询时得到的第一个键和最后一个键。这意味着无法保证结果中的第一个键就是数据源\
  \ `Keys ConcurrentCollection<String>` 中的第一个键，因为结果是并行添加的。\n\n为了在源集合中显示匹配查询定义的真实“第一个”键，你需要告诉\
  \ PLINQ 保留源的顺序。你通过添加 `AsOrdered()` 运算符来实现这一点，如下所示的行代码：\n\n```csharp\nvar keysWith10Letters\
  \ = from key in Keys.AsParallel().AsOrdered()\n                        where (CountLetters(key)\
  \ >= 10)\n                        && (key.Contains('A'))\n                     \
  \   && (key.Contains('F'))\n                        && (key.Contains('9'))\n   \
  \                     && (!key.Contains('B'))\n                        select key;\n\
  ```\n// 代码片段来自 Snippet6_2\n\n另一种方法是根据升序排序的结果键来显示第一个键。你通过添加 `orderby` 子句并移除 `AsOrdered()`\
  \ 运算符来实现这一点，如下所示的行代码：\n\n```csharp\nvar keysWith10Letters = from key in Keys.AsParallel()\n\
  \                        where (CountLetters(key) >= 10)\n                     \
  \   && (key.Contains('A'))\n                        && (key.Contains('F'))\n   \
  \                     && (key.Contains('9'))\n                        && (!key.Contains('B'))\n\
  \                        orderby key\n                        select key;\n```\n\
  // 代码片段来自 Snippet6_3\n\n`AsOrdered()` 运算符不再需要了，因为结果将根据每个键的字母数字值按升序排序。不需要告诉 PLINQ\
  \ 保留源的顺序。通过这种方式，PLINQ 可以通过运行其高效算法来排序结果数据来优化其执行。仅在需要时添加运算符和子句是方便的。如果不需要，请将其移除，并让\
  \ PLINQ 决定利用并行性的最佳方式。\n\n列表 6-1 所示的简单示例可以帮助理解 PLINQ 和 LINQ 在源数据顺序和查询结果之间的差异。代码定义了一个包含九个未排序字符串的数组。一个简单的\
  \ LINQ 查询过滤出包含特定字符的单词。然后，代码将匹配查询的单词写入输出。在九个字符串上执行简单的 LINQ 不会提供显著的加速提升。在这种情况下，重点在于结果及其顺序的重要性。\n\
  \n```csharp\nusing System;\nusing System.Collections.Generic;\nusing System.Linq;\n\
  using System.Text;\n\nnamespace Listing6_1\n{\n    class Program\n    {\n      \
  \  static string[] words = {\n            \"Day\",\n            \"Car\",\n     \
  \       \"Land\",\n            \"Road\",\n            \"Mountain\",\n          \
  \  \"River\",\n            \"Sea\",\n            \"Shore\",\n            \"Mouse\"\
  \n        };\n        static void Main(string[] args)\n        {\n            var\
  \ query = from word in words.AsParallel()\n                        where (word.Contains(\"\
  a\"))\n                        select word;\n            foreach (var result in\
  \ query)\n            {\n                Console.WriteLine(result);\n          \
  \  }\n            Console.ReadLine();\n        }\n    }\n}\n```\n源数据的初始顺序如下：\n1.\
  \ Day\n2. Car\n3. Land\n4. Road\n5. Mountain\n6. River\n7. Sea\n8. Shore\n9. Mouse\n\
  \n由于 PLINQ 定义没有指定所需的顺序，该简单查询的并行执行结果之一将显示以下结果：\n1. Day\n2. Car\n3. Road\n4. Mountain\n\
  5. Sea\n6. Land\n\n如果查询必须保留数据源顺序，那么 Land 应该是第三个单词，而不是最后一个。第二次运行同一个应用程序将产生以下结果：\n\
  1. Day\n2. Land\n3. Road\n4. Mountain\n5. Sea\n6. Car\n\n这次，Land 是第二个单词，但它应该是第三个。如果你添加了\
  \ `AsOrdered()` 运算符，如下所示的代码行，结果将保留数据源顺序。\n\n```csharp\nvar query = from word in\
  \ words.AsParallel().AsOrdered()\n            where (word.Contains(\"a\"))\n   \
  \         select word;\n```\n// 代码片段来自 Snippet6_4\n\n无论运行应用程序多少次，结果都如下：\n1. Day\n\
  2. Car\n3. Land\n4. Road\n5. Mountain\n6. Sea\n\n最后，如果你从 PLINQ 查询中移除 `AsOrdered()`\
  \ 运算符并添加 `orderby` 和 `descending` 子句，如下所示的代码行，结果将按照每个字符串的内容按降序排序。\n\n```csharp\n\
  var query = from word in words.AsParallel()\n            where (word.Contains(\"\
  a\"))\n            orderby word descending\n            select word;\n```\n// 代码片段来自\
  \ Snippet6_5\n\n无论运行应用程序多少次，结果都如下：\n1. Sea\n2. Road\n3. Mountain\n4. Land\n5. Day\n\
  6. Car\n\n由于在 PLINQ 查询中使用 `AsOrdered` 和 `orderby` 子句可能会减少任何加速收益，因此在不要求顺序结果时，将所实现的加速效果与顺序版本进行比较是非常重要的。\n\
  \n# 指定执行模式\n\n你已经知道，为了将顺序代码并行化，需要添加一些开销。PLINQ 为了并行化查询所做的工作也是如此。事实上，PLINQ 使用了支持并行执行查询不同部分的任务和线程。\n\
  \n\n\n\n\n默认情况下，当必须执行 `PLINQ` 查询时，`.NET` 会尝试避免使用高开销的并行算法，因为这些算法可能会导致性能变得比串行执行更慢。这种分析被应用于复杂查询的许多部分。`.NET`\
  \ 根据查询的形状（shape）做出决策，它不考虑数据集的大小或委托的执行时间。然而，无论执行引擎所做的分析结果如何，你都可以强制使用并行实现。你可以通过调用\
  \ `WithExecutionMode` 方法并传入 `ParallelExecutionMode.ForceParallelism` 来实现这一点，如下所示\
  \ PLINQ 查询所示：\n\n![download](img/download.gif)\n\n```csharp\nvar query =\n     \
  \        from word in\n             words.AsParallel().WithExecutionMode(ParallelExecutionMode.ForceParallelism)\n\
  \             where (word.Contains(\"a\"))\n             orderby word descending\n\
  \             select word;\n```\n摘自代码片段 Snippet6_6 的代码片段\n\n`ParallelExecutionMode`\
  \ 枚举提供了另一个值 `ParallelExecutionMode.Default`。如果你在调用 `WithExecutionMode` 方法时将此值作为参数，则\
  \ PLINQ 查询将按照之前说明的默认行为执行。\n\n# 理解 PLINQ 中的分区\n\n以下代码行显示了一个 PLINQ 查询，用于计算包含 \"a\"\
  \ 的单词中的字母总数。它使用了 `sum` 聚合函数并对每个单词调用了 `CountLetters` 方法。\n\n![download](img/download.gif)\n\
  \n```csharp\nstatic void Main(string[] args)\n{\n    var query = (from word in words.AsParallel()\n\
  \                  where (word.Contains('a'))\n                  select CountLetters(word)).Sum();\n\
  \n    Console.WriteLine(\n        \"The total number of letters for the words that\
  \ contain an ‘a’ is {0}\", query);\n\n    Console.ReadLine();\n}\n```\n摘自代码片段 Snippet6_7\
  \ 的代码片段\n\n当 `.NET` 决定并行运行 PLINQ 查询时，第一步是对数据源进行分区。然而，非常重要的是你需要理解复杂查询在执行过程中可能会重新分区。PLINQ\
  \ 获取输入数据源并根据可用逻辑核心的数量将其分成多个部分。它使用任务在不同的核心上处理每个部分。例如，如果你在具有四个逻辑核心的计算机上运行之前所示的包含八千个单词的\
  \ PLINQ 查询，PLINQ 可以将八千个单词分成四个每个两千个单词的分区。每个分区可以由四个任务之一进行消费，处理数据并对每个分区的的结果进行部分和。最后，必须将这四个部分和加起来得到最终结果，如\
  \ 图 6-1 所示。\n\n图 6-1\n\n![6.1](img/c06f001.jpg)\n\nPLINQ 执行引擎必须在极短的时间内做出非常重要的决策，以避免给查询执行带来巨大的开销。因此，根据查询的形状，它使用以下四种主要算法对数据进行分区：\n\
  \n- **范围分区 (Range partitioning)** —— 这适用于列表和数组等可索引数据源。当 PLINQ 针对 `IEnumerable` 或\
  \ `IEnumerable<T>` 工作时，它会查询 `IList<T>` 接口。如果发现此接口，它将使用范围分区的实现，根据发现的逻辑核心数量将数据分成相应范围，如\
  \ 图 6-2 所示。在这些情况下，PLINQ 知晓数据源的精确长度，并可以直接访问列表或数组中的任何元素。正如你在前面的章节中学到的，在大多数情况下，这种分区机制提供了有趣的性能益处。可以使用\
  \ `Partitioner.Create` 接受 `IList<TSource>` 和 `Boolean` 作为参数的重载来覆盖此默认分区方案。`Boolean`\
  \ 参数为 `true` 表示创建的分区器将在分区之间进行动态负载均衡，而不是静态分区。\n\n图 6-2\n\n![6.2](img/c06f002.jpg)\n\
  \n- **分块分区 (Chunk partitioning)** —— 这适用于任何数据源。当 PLINQ 针对非索引数据源时，它将数据划分为不同的块，如 图\
  \ 6-3 所示。\n\n图 6-3\n\n![6.3](img/c06f003.jpg)\n\n- **条带分区 (Striped partitioning)**\
  \ —— 这针对实现了 `IList` 的类型进行了优化。它是之前说明的范围分区的一种特例，如 图 6-4 所示。\n\n图 6-4\n\n![6.4](img/c06f004.jpg)\n\
  \n- **哈希分区 (Hash partitioning)** —— 这用于比较具有相同哈希值的元素。通过这种方式，所有匹配项都将进入同一个分区，如 图 6-5\
  \ 所示。\n\n图 6-5\n\n![6.5](img/c06f005.jpg)\n\n等一下，让我重新验证一下哈希分区的描述：PLINQ 必须为每个元素的键计算哈希并将其分配给相应的分区。这用于以下查询操作符：\n\
  - `distinct`\n- `except`\n- `groupjoin`\n- `groupby`\n- `intersect`\n- `join`\n\
  - `union`\n\n# 使用 PLINQ 执行归约操作\n\nPLINQ 简化了在序列或组的所有成员上应用函数的过程，这被称为归约操作（reduction\
  \ operation）。你可以通过在 PLINQ 查询中使用聚合函数（如 `Average`、`Min` 和 `Sum`）来利用并行性。事实上，上一个示例并行执行了一个归约操作，即\
  \ `Sum`。\n\n并行执行的归约结果可能与串行归约不同，因为当操作不满足交换律和结合律时，存在舍入误差。序列或组元素在不同并行任务中的分布在每次执行中可能不同，这会导致此类操作的最终结果产生差异。因此，使用并行等效项来定义原始数据源是非常重要的，以帮助\
  \ PLINQ 实现最佳执行。列表 6-2 显示了在 LINQ 中执行的归约操作（平均值）的代码，而 列表 6-3 显示了其 PLINQ 版本。\n\n\n\n\
  \n```csharp\nvar seqReductionQuery = (from intNum in inputIntegers\n           \
  \               where ((intNum % 5) == 0)\n                          select (intNum\
  \ / Math.PI)).Average();\nConsole.WriteLine(\"Average {0}\", seqReductionQuery);\n\
  Console.ReadLine();\n}\n```\n\n![download](img/download.gif)\n\nListing 6-3 一个演示规约操作（平均值）的\
  \ PLINQ 查询。\n\n```csharp\nstatic int NUM_INTS = 50000000;\n\nstatic ParallelQuery<int>\
  \ GenerateInputData()\n{\n    return ParallelEnumerable.Range(1, NUM_INTS);\n}\n\
  \nstatic void Main(string[] args)\n{\n    var inputIntegers = GenerateInputData();\n\
  \    var parReductionQuery = (from intNum in inputIntegers.AsParallel()\n      \
  \                        where ((intNum % 5) == 0)\n                           \
  \   select (intNum / Math.PI)).Average();\n    Console.WriteLine(\"Average {0}\"\
  , parReductionQuery);\n    Console.ReadLine();\n}\n```\n\n`seqReductionQuery` 是一个\
  \ LINQ 查询，用于计算从 1 到 50000000 (`NUM_INTS`) 之间能被 5 整除的每个整数除以 `π` 的结果平均值。`parReductionQuery`\
  \ 以 PLINQ 的形式定义了相同的查询。生成查询数据源的 `GenerateInputData` 方法在两个版本中不同，如下：\n\n- 在 LINQ 版本中，它返回一个\
  \ `IEnumerable<int>`，这是调用 `Enumerable.Range` 方法生成指定范围内整数序列的结果。\n- 在 PLINQ 版本中，它返回一个\
  \ `ParallelQuery<int>`，这是使用 `System.Linq.Enumerable` 和 `System.Linq.ParallelEnumerable`\
  \ 的并行等效项，并调用 `ParallelEnumerable.Range` 方法来生成指定范围内并行整数序列的结果。通过这种方式，结果表示一个并行序列，准备好与\
  \ PLINQ 并行运行。\n\n![note](img/note.gif)\n\n可以使用 Listing 6-2 中为 LINQ 版本定义的相同 `GenerateInputData`\
  \ 方法来运行 PLINQ 查询 `parReductionQuery`。然而，运行需要更多时间。因此，Listing 6-3 所示的代码将提供最好的结果。\n\
  \n如果你想定义针对 `Customer` 类型数据源的 LINQ 查询，并将其存储在 `seqCustomerQuery` 变量中，通常定义如下：\n\n`private\
  \ IEnumerable<Customer> seqCustomerQuery;`\n\n如果你想将相同的查询定义为 PLINQ 查询，将必须使用 `ParallelQuery<Customer>`\
  \ 代替 `IEnumerable<Customer>`，如下行所示：\n\n`private ParallelQuery<Customer> parCustomerQuery;`\n\
  \n# 创建自定义 PLINQ 聚合函数\n\nPLINQ 提供了一个 `Aggregate` 重载，允许实现自定义的并行规约算法。其一个重载在序列上并行应用累加器函数。该重载允许在查询的每个并行分区上进行中间聚合，并使用最终聚合函数来合并在分区中生成的结果。Listing\
  \ 6-4 显示了使用自定义 PLINQ 聚合函数在序列上计算以下三个统计函数的示例：\n\n- **标准差** —— 衡量数值偏离均值（平均值）的离散程度。\n\
  - **偏度** —— 它表征了分布围绕其均值的不对称程度。正偏度表示分布具有向更正值方向延伸的不对称尾部。负偏度表示分布具有向更负值方向延伸的不对称尾部。\n\
  - **峰度** —— 它表征了分布与正态分布相比的尖峰程度或平坦程度。正峰度表示分布相对尖峰。负峰度表示分布相对较平坦。\n\n![download](img/download.gif)\n\
  \nListing 6-4 使用 LINQ Aggregate 函数计算并行序列的标准差、偏度和峰度\n\n```csharp\nstatic void Main(string[]\
  \ args)\n{\n    int[] integers = {0, 3, 4, 8, 1, 5, 2, 4, 7, 6, 3, 2, 1, 0};\n \
  \   var mean = integers.AsParallel().Average();\n    var standardDeviation = integers.AsParallel().Aggregate(\n\
  \        0d,\n        (subTotal, thisNumber) => subTotal + Math.Pow((thisNumber\
  \ - mean), 2),\n        (total, thisTask) => total + thisTask,\n        (finalSum)\
  \ => Math.Sqrt(finalSum / (integers.Count() - 1)));\n    var skewness = integers.AsParallel().Aggregate(\n\
  \        0d,\n        (subTotal, thisNumber) => subTotal + Math.Pow(((thisNumber\
  \ - mean) / standardDeviation), 3),\n        (total, thisTask) => total + thisTask,\n\
  \        (finalSum) => (finalSum / (integers.Count() - 1))));\n    var kurtosis\
  \ = integers.AsParallel().Aggregate(\n        0d,\n        (subTotal, thisNumber)\
  \ => subTotal + Math.Pow(((thisNumber - mean) / standardDeviation), 4),\n      \
  \  (total, thisTask) => total + thisTask,\n        (finalSum) => (finalSum / (integers.Count()\
  \ - 1))));\n\n    Console.WriteLine(\"Mean {0}\", mean);\n    Console.WriteLine(\"\
  Standard deviation {0}\", standardDeviation);\n    Console.WriteLine(\"Skewness\
  \ {0}\", skewness);\n    Console.WriteLine(\"Kurtosis {0}\", kurtosis);\n    Console.ReadLine();\n\
  }\n```\n\n该代码并行计算整数数据源 `integers` 的标准差、偏度和峰度。将所有操作作为一次 `Aggregate` 调用的一部分可能会比每个操作都调用一次更高效。然而，此示例的目的是帮助你理解如何定义多个\
  \ PLINQ 聚合函数。计算偏度和峰度有许多替代方案，但此代码使用了对应 Excel 统计函数的公式：STDEV、SKEW 和 KURT。Figure 6-6\
  \ 显示了三个公式，其中：\n\n- $X_i$ 是样本中的每个元素\n- $s$ 是样本标准差\n- $n$ 是样本量\n- $\\bar{X}$ 是样本均值（平均值）\n\
  \nFigure 6-6\n\n![6.6](img/c06f006.jpg)\n\n由于三个计算都需要样本均值，代码的第一步是并行计算均值（数据集的平均值），并存储在\
  \ `mean` 中：\n\n`var mean = integers.AsParallel().Average();`\n\n然后，通过定义自定义并行规约算法来实现其公式，计算标准差。`Aggregate`\
  \ 扩展方法的参数在 Figure 6-7 中所示。\n\nFigure 6-7\n\n![6.7](img/c06f007.jpg)\n\n如图中所示，`Aggregate`\
  \ 使用以下四个参数来计算标准差：\n\n- 累加器函数的初始值 —— 在此例中，它是被表示为双类型的 0：\n\n    0d\n\n\n\n\n- **更新累加函数\
  \ (Update accumulator function)** — 该函数在分区的每个元素上被调用。在这种情况下，它计算元素 `thisNumber` 与之前计算出的平均值\
  \ `mean` 之间的差值。然后，它将该结果平方，并加到存储在 `subTotal` 变量中的实际值中。该代码会在每个不同分区的每个元素上运行。\n\n  ```\n\
  \  (subTotal, thisNumber) => subTotal + Math.Pow((thisNumber - mean), 2)\n  ```\n\
  \n- **合并累加器函数 (Combine accumulators function)** — 该函数被用于根据每个分区的最终结果计算值。在这种情况下，它将来自每个分区的产出元素\
  \ `thisTask` 进行相加，并将结果累加到 `total` 变量中。该代码在每个分区的结果计算完毕后运行，每个分区运行一次。\n\n  ```\n  (total,\
  \ thisTask) => total + thisTask\n  ```\n\n- **结果选择器 (Result selector)** — 在计算出所有分区的累加值后，它将其转换为所需的最终结果。在这种情况下，代码计算了最终和\
  \ `finalSum` 除以总元素数减 1 后的平方根。\n\n  ```\n  (finalSum) => Math.Sqrt((finalSum / (inputIntegers.Count()\
  \ - 1))));\n  ```\n\n这段代码在返回自定义聚合操作的结果之前运行一次，如图 6-8 所示。\n\n图 6-8\n\n![6.8](img/c06f008.jpg)\n\
  \n你可以使用类似的方法来计算更复杂的并行归约算法。然而，将所有操作作为一次 `Aggregate` 调用的部分，比每个操作都调用一次可能更高效。事实上，偏度（skewness）和峰度（kurtosis）的计算使用了相同的四个参数调用\
  \ `Aggregate` 扩展方法，执行不同的计算以表示它们的公式。在列表 6-4 中显示的代码似乎过于复杂；然而，如果你在阅读代码时查看公式，你会发现将此类公式转换为\
  \ PLINQ 并行归约算法是非常容易的。\n\n代码如下定义了一个包含 12 个整数的数组：\n\n```\nint[] inputIntegers = {0,\
  \ 3, 4, 8, 15, 22, 34, 57, 68, 32, 21, 30};\n```\n\n要生成一个包含一亿个整数的并行序列，你只需要将该行替换为以下调用\
  \ `ParallelEnumerable.Range` 方法的行：\n\n```csharp\nvar inputIntegers = ParallelEnumerable.Range(1,\
  \ 100000000);\n```\n\n# 并发 PLINQ 任务\n\n列表 6-4 使用许多 PLINQ 查询进行了许多计算。然而，这些并行查询是以同步方式运行的，一个接一个在主线程中执行。图\
  \ 6-9 显示了一个甘特图，表示了在列表 6-4 中执行的不同 PLINQ 查询以及它们之间的依赖关系。\n\n图 6-9\n\n![6.9](img/c06f009.jpg)\n\
  \n标准差的计算需要平均值。偏度和峰度的计算都需要平均值和标准差的结果。如果并行计算偏度和峰度的扩展性受限，则可以并行运行它们，但限制每个 PLINQ 查询使用的的核心数数量。\n\
  \n你还可以将 PLINQ 查询包含在任务中，并使用延续任务（continuations）链接这些任务，正如你在第三章“命令式任务并行化”中所学习的那样。图 6-10\
  \ 显示了一个新的甘特图，展示了可能的新的执行方案，考虑了在图 6-9 中之前分析的依赖关系。\n\n图 6-10\n\n![6.10](img/c06f010.jpg)\n\
  \n列表 6-5 显示了前一个示例的新版本，该版本根据图 6-10 所示的图表创建了许多链式任务。\n\n\n\n\n\n[content]\n\n```csharp\n\
  cts.Cancel();\n\n    });\n\n    try\n    {\n        // Start taskMean and then all\
  \ the chained tasks\n        taskMean.Start();\n        // Wait for both taskSkewness\
  \ and taskKurtosis to finish\n        Task.WaitAll(taskSkewness, taskKurtosis);\n\
  \        Console.WriteLine(\"Mean: {0}\", taskMean.Result);\n        Console.WriteLine(\"\
  Standard deviation: {0}\", taskSTDev.Result);\n        Console.WriteLine(\"Skewness:\
  \ {0}\", taskSkewness.Result);\n        Console.WriteLine(\"Kurtosis: {0}\", taskKurtosis.Result);\n\
  \        Console.ReadLine();\n    }\n    catch (AggregateException ex)\n    {\n\
  \        foreach (Exception innerEx in ex.InnerExceptions)\n        {\n        \
  \    Debug.WriteLine(innerEx.ToString());\n            // Do something considering\
  \ the innerEx Exception\n            if (ex.InnerException is OperationCanceledException)\n\
  \            {\n                // A task was cancelled\n                // Write\
  \ each task status to the console\n                Console.WriteLine(\"Mean task:\
  \ {0}\", \n                    taskMean.Status);\n                Console.WriteLine(\"\
  Standard deviation task: {0}\",\n                    taskSTDev.Status);\n      \
  \          Console.WriteLine(\"Skewness task: {0}\",\n                    taskSkewness.Status);\n\
  \                Console.WriteLine(\"Kurtosis task: {0}\",\n                   \
  \ taskKurtosis.Status);\n                Console.ReadLine();\n            }\n  \
  \      }\n    }\n}\n```\n\n以下每个任务都会运行一个 PLINQ 查询并生成一个 `double` 结果：\n\n- `taskMean`\
  \ — 计算平均值。\n- `taskSTDev` — 在计算平均值后计算标准差。\n- `taskSkewness` — 在平均值和标准差都计算后计算偏度。\n\
  - `taskKurtosis` — 在平均值和标准差都计算后计算峰度。\n\n在这种情况下，每个链式任务都需要获取其前置任务的结果。因此，指定了 `TaskContinuationOptions.OnlyRanToCompletion`\
  \ 作为参数。这样，只有当前置任务执行完成后，每个链式任务才会运行。由于 `taskSkewness` 和 `taskKurtosis` 都被安排在 `taskSTDev`\
  \ 完成执行后启动，它们的 PLINQ 查询可以并行运行，并尝试利用逻辑核心的数量。你可以通过为每个与其它任务并发运行的任务（`taskSkewness` 和\
  \ `taskKurtosis`）指定并行度来优化此方案的并行执行。\n\n# 取消 PLINQ\n\n某些 PLINQ 查询可能运行很长时间。因此，提供一种中断其执行的机制是一个好主意。你可以通过使用取消令牌来实现这一点，就像你在第\
  \ 3 章“命令式并行”中学习 `Task` 实例那样样。\n\n列表 6-5 显示了许多 PLINQ 查询的代码，并为了支持取消执行了必要的更改。每个运行 PLINQ\
  \ 查询的方法都会接收一个 `System.Threading.CancellationToken` 实例 `ct`，并抛出 `OperationCanceledException`。取消请求可能发生在\
  \ PLINQ 查询开始执行后。因此，每个 PLINQ 查询通过使用 `ParallelEnumerable` 中定义的 `WithCancellation`\
  \ 方法接收此 `CancellationToken` 实例 `ct`。\n\n`return integers.AsParallel().WithCancellation(ct).Aggregate(...)`\n\
  \n通过这种方式，PLINQ 查询会在执行时增加一个微小的开销，以观察 `OperationCanceledException` 并将其令牌与 `WithCancellation`\
  \ 方法中接收的令牌进行比较。如果两个令牌相同且 `IsCancellationRequested` 为真，则 PLINQ 执行将理解为存在取消请求并中断其执行。由于在\
  \ `Task` 委托内部没有捕获此异常的代码，该异常将被抛出并封装在 `AggregateException` 中。结果是运行此查询的 `Task` 实例将切换到\
  \ `TaskStatus.Faulted` 状态，且 `IsFaulted` 属性将为真。\n\n如果你使用 Visual Studio 2010 的默认选项运行该示例，将出现一个指示\
  \ `OperationCanceledException` 未被用户代码处理的消息，如图 6-11 所示。你只需要选择 `Tools` -> `Options`\
  \ -> `Debugging` -> `General` 并取消勾选 `Enable My Code`（启用我的代码）框。这样，IDE 就不会通过 PLINQ\
  \ 捕获用户代码中的异常。你也可以选择 `Debug` -> `Continue` 或按 `F5`。\n\n![6.11](img/c06f011.jpg)\n\
  \n取决于你运行此示例的硬件，结果可能会不同。在某些情况下，当 `deferredCancelTask` 在睡眠 5 秒后通过 `cts.Cancel()` 方法发送取消信号时，`skewness`\
  \ 和 `kurtosis` PLINQ 查询都将被取消，它们相关的 `Task` 实例 `taskSkewness` 和 `taskKurtosis` 将变为\
  \ faulted（故障），如下控制台输出所示：\n\nMean task: RanToCompletion\nStandard deviation task:\
  \ RanToCompletion\nSkewness task: Faulted\nKurtosis task: Faulted\n\n如果你将定义并启动 `deferredCancelTask`\
  \ 的代码替换为以下行，它将在睡眠 2 秒后发送取消信号：\n\n```csharp\nvar deferredCancelTask = Task.Factory.StartNew(()\
  \ =>\n{\n    // 让运行此任务的线程睡眠 2 秒\n    System.Threading.Thread.Sleep(2000);\n    //\
  \ 发送取消信号\n    cts.Cancel();\n});\n```\n\n来自 Snippet_8 的代码片段\n\n当前运行的标准差 PLINQ 查询将被取消，其关联的\
  \ `Task` 实例 `taskSTDev` 将变为 faulted。由于 `taskSkewness` 和 `taskKurtosis` 链式到 `taskSTDev`\
  \ 且选项定义为 `OnlyRanToCompletion`，而 `taskSTDev` 已故障（未执行完成），这两个链式任务将由调度引擎取消，如下控制台输出：\n\
  \nMean task: RanToCompletion\nStandard deviation task: Faulted\nSkewness task: Canceled\n\
  Kurtosis task: Canceled\n\n# 指定并行度\n\n默认情况下，PLINQ 总是尝试使用所有可用逻辑核心来实现最佳结果。然而，你可以通过\
  \ `WithDegreeOfParallelism` 方法指定不同的最大并行度。\n\n With DegreeOfParallelism\n\n以下代码运行计算偏度和峰度的\
  \ PLINQ 查询，指定它们使用最多一半逻辑核心作为并发任务。由于两个查询都在同时启动的任务中运行，每个查询将利用一半的核心。\n\n![download](img/download.gif)\n\
  \n```csharp\n// Environment.ProcessorCount 需要平台调用 (P/Invoke)\n// 此变量缓存了它的值\n// 然而，某些硬件上的逻辑核心可能会变化\n\
  static int processorCount = Environment.ProcessorCount;\n\nprivate static double\
  \ CalculateSkewness(\n    System.Threading.CancellationToken ct,\n    double mean,\n\
  \    double standardDeviation)\n{\n    return integers.AsParallel().WithCancellation(ct)\n\
  \        .WithDegreeOfParallelism(processorCount / 2)\n        .Aggregate(\n   \
  \         // Seed\n            0d,\n            // 更新累加器函数\n            (subTotal,\
  \ thisNumber) => subTotal + Math.Pow(((thisNumber - mean) / standardDeviation),\
  \ 3),\n            // 合并累加器函数\n            (total, thisTask) => total + thisTask,\n\
  \            // 结果选择\n            (finalSum) => (finalSum * integers.Count()) /\n\
  \                ((integers.Count() - 1) * (integers.Count() - 2))));\n}\n\nprivate\
  \ static double CalculateKurtosis(\n    System.Threading.CancellationToken ct,\n\
  \    double mean,\n    double standardDeviation)\n{\n    return integers.AsParallel().WithCancellation(ct)\n\
  \    .WithDegreeOfParallelism(processorCount / 2);\n}\n```\n\n[/content]\n\n\n\n\
  \n```csharp\n.Aggregate(\n    // 种子\n    0d,\n    // 更新累加器函数\n    (subTotal, thisNumber)\
  \ => subTotal +\n        Math.Pow(((thisNumber - mean) /\n            standardDeviation),\
  \ 4),\n    // 合并累加器函数\n    (total, thisTask) => total + thisTask,\n    // 结果选择器\n\
  \    (finalSum) =>\n        ((finalSum * inputIntegers.Count() *\n          (inputIntegers.Count()\
  \ + 1)) /\n          ((inputIntegers.Count() - 1) *\n          (inputIntegers.Count()\
  \ - 2) *\n          (inputIntegers.Count() - 3))) -\n          ((3 *\n         \
  \   Math.Pow((inputIntegers.Count() - 1), 2)) /\n            ((inputIntegers.Count()\
  \ - 2) *\n            (inputIntegers.Count() - 3))));\n```\n代码片段来自 Snippet6_9\n\n\
  `Environment.ProcessorCount` 需要平台调用（P/Invoke）；因此，调用它的成本并不低。私有静态变量 `processorCount`\
  \ 缓存了 `Environment.ProcessorCount` 的结果。在某些特定硬件（最可能是服务器）上，逻辑核心的数量可能会发生。因此，在运行长时间的并行化算法之前，你应该获取\
  \ `Environment.ProcessorCount` 的值。然后，你可以在运行另一个算法之前刷新此值。\n\n如果代码在具有八个逻辑核心的微处理器上运行，则每个\
  \ PLINQ 查询将以最多四个并发任务进行运行。你还可以使用 `Parallel.Invoke` 启动许多具有不同最大并行度的 PLINQ 查询。某些 PLINQ\
  \ 查询的可扩展性有限的，因此这些选项允许你利用额外的核心。\n\n![note](img/note.gif)\n\n你不应该使用逻辑核心数的一半进行工作，因为对于某些计算机来说，这个数字可能是奇数（例如，三个逻辑核心）。当你像上一个示例那样做出调度决策时，应该始终使用适用于偶数和奇数核心数的动态值。下面的行显示了一个示例，用于判断逻辑核心数是偶数还是奇数，如果是奇数则多分配一个核心：\n\
  \n```csharp\nint maxDegree = (processorCount % 2 == 0) ? (processorCount / 2) :\
  \ ((processorCount / 2) + 1);\n```\n代码片段来自 Snippet6_9_Enhanced\n\n此外，有时你可能希望留出一个核心以创建一个响应迅速的应用程序。这个核心可以帮助你并行运行另一部分代码，在计算密集型和长时间运行的查询时提供更具响应性的\
  \ UI。为了实现这一点，你可以添加以下行：\n\n```csharp\n.WithDegreeOfParallelism(processorCount - 1)\n\
  ```\n\n##测量可扩展性\n\n正如你之前学习并行循环中学的那样，有时使用许多不同并行度运行 PLINQ 查询来衡量其可扩展性是很有用的。表 6.2 汇总了使用两个数据源计算平均值的\
  \ PLINQ 查询的运行结果。该查询在具有四个物理核心和八个逻辑核心的计算机上以八种不同的并行度运行。\n\n表 6.2 使用多个数据源计算平均值的 PLINQ\
  \ 查询\n\n| 并行度 执行时间（秒） | 数据源 = 800,000,000 个整数 | 数据源 = 1,600,000,000 个整数 |\n| :---\
  \ | :--- | :--- |\n| 1 | 7.80 | 15.60 |\n| 2 | 4.83 | 10.30 |\n| 3 | 4.27 | 8.41\
  \ |\n| 4 | 3.60 | 7.09 |\n| 5 | 3.55 | 6.95 |\n| 6 | 3.55 | 6.58 |\n| 7 | 3.14 |\
  \ 6.25 |\n| 8 | 3.14 | 5.97 |\n\n图 6-12 显示了一张运行每个查询所需时间的折线图，图 6-13 显示了另一张显示加速比的折线图。\n\
  \n![6.12](img/c06f012.jpg)\n\n![13](img/c06f13.jpg)\n\n该计算机有四个物理核心；因此，并行查询为四个核心提供了重要的可扩展性。在四个核心之外，额外的任务运行在共享相同物理核心的超线程核心中。一旦并行度超过了物理核心数（如本例所示），你就可以预期加速比会变得真正小得多。第\
  \ 1 章解释了物理核心和逻辑核心之间的区别。\n\n根据使用不同并行度运行 PLINQ 查询获得的结果，你可以决定将其与其他查询结合，或者尝试其他替代方案来运行算法。在这个示例中，查询仅计算一个平均值，并且当它将工作分配到额外的物理核心上时，它的扩展性非常好。\n\
  \n# 使用 ForAll\n\n正如你从第四章“并发集合”中所学的那样，`Systems.Collections.Concurrent.ConcurrentBag`\
  \ 是并发集合之一，允许多个任务并行添加许多元素。`ParallelEnumerable` 暴露的 `ForAll` 扩展方法对于并行处理查询结果非常有用，而不需要你编写并行循环。它接收一个操作作为参数，提供的可能性与第\
  \ 3 章“命令式任务”中 `Task` 构造函数接收的参数相同。因此，使用 lambda 表达式，你可以结合 PLINQ 查询结果的并行化处理。\n\n列表\
  \ 6-6 显示了著名的 MD5 哈希生成器的代码。`GenerateMD5Data` 方法通过调用 `ParallelEnumerable.Range` 返回一个\
  \ `ParallelQuery<int>`。然后，简单地调用 `ForAll` 并行处理整数序列，并将数字作为参数调用 `GenerateMD5Hash` 的结果。\n\
  \n![download](img/download.gif)\n\n列表 6-6： 使用 ForAll 和 ConcurrentBag 生成 MD5 哈希\n\
  \n```csharp\nprivate const int NUM_MD5_HASHES = 100000;\nprivate static ParallelQuery<int>\
  \ GenerateMD5Data()\n{\n    return ParallelEnumerable.Range(1, NUM_MD5_HASHES);\n\
  }\nprivate static string ConvertToHexString(Byte[] byteArray)\n{\n    // 将字节数组转换为十六进制字符串\n\
  \    var sb = new StringBuilder(byteArray.Length);\n    for (int i = 0; i < byteArray.Length;\
  \ i++)\n    {\n        sb.Append(byteArray[i].ToString(\"X2\"));\n    }\n    return\
  \ sb.ToString();\n}\n\nprivate static string GenerateMD5Hash(int number)\n{\n  \
  \  var md5M = MD5.Create();\n    byte[] data =\n        Encoding.Unicode.GetBytes(\n\
  \            Environment.UserName + number.ToString());\n    byte[] result = md5M.ComputeHash(data);\n\
  \    string hexString = ConvertToHexString(result);\n    return hexString;\n}\n\n\
  static void Main(string[] args)\n{\n    Console.ReadLine();\n    Console.WriteLine(\"\
  Started\");\n    var sw = Stopwatch.StartNew();\n    var inputIntegers = GenerateMD5Data();\n\
  \    var hashesBag = new ConcurrentBag<string>();\n    inputIntegers.ForAll((i)\
  \ => hashesBag.Add(GenerateMD5Hash(i)));\n    Console.WriteLine(\"Finished in {0}\"\
  , sw.Elapsed);\n    Console.WriteLine(\"{0} MD5 hashes generated in {1}\", hashesBag.Count(),\
  \ sw.Elapsed.ToString());\n    Console.WriteLine(\"First MD5 hash: {0}\", hashesBag.First());\n\
  \    Console.WriteLine(\"Last MD5 hash: {0}\", hashesBag.Last());\n    Console.ReadLine();\n\
  }\n```\n\n然后，Main 方法显示了经过的时间、生成的 MD5 哈希数量以及 `ConcurrentBag` 中的第一个和最后一个项目。接下来的代码行向新的\
  \ `ConcurrentBag` `hashesBag`（一个无序字符串集合）中并行添加元素：\n\n\n\n\n\n`inputIntegers` 是一个\
  \ `ParallelQuery<int>`，而 `hashesBag` 将存储所有并行生成的 MD5 哈希值。这个 `ConcurrentBag` 允许大多数添加操作以无锁的方式完成。其他更高效的方法可以产生类似的结果。本示例的目的是帮助你理解如何从\
  \ `ForAll` 在并发数据结构中存储项。\n\n![note](img/note.gif)\n\n没有必要添加 `.AsParallel()`，因为 `ForAll`\
  \ 扩展方法已经准备好并行运行。\n\n## `foreach` 与 `ForAll` 的区别\n\n当你定义一个 PLINQ 查询，然后使用 `foreach`\
  \ 或 `for` 循环来执行它并遍历结果时，该部分代码并不是并行运行的。事实上，它需要将 PLINQ 查询的输出合并到运行循环的线程中，如图图 6-14 所示。当你调用方法来生成特定输出（如\
  \ `ToArray`、`ToDictionary` 或 `ToList`）时，情况也是如此。\n\n图 6-14\n\n![6.14](img/c06f014.jpg)\n\
  \n当你需要按照特定的顺序顺序处理数据时，必须使用上述的顺序循环或方法。然而，如果你不需要特定的顺序，可以像之前解释的那样通过 `ForAll` 获得最佳性能。`ForAll`如图图\
  \ 6-15 所示并行处理结果，并且它不需要执行最后的合并步骤。\n\n图 6-15\n\n![6.15](img/c06f015.jpg)\n\n## 衡量扩展性\n\
  \n你可以将应用于 `ParallelQuery<int>` 的 `inputIntegers` 的 `ForAll` 扩展方法与 `WithDegreeOfParallelism`\
  \ 方法结合起来，以衡量其扩展性。以下行显示了定义并行度为 4 的示例：\n\n![download](img/download.gif)\n\n```csharp\n\
  inputIntegers.WithDegreeOfParallelism(4).ForAll((i) =>\n    hashesBag.Add(GenerateMD5Hash(i)));\n\
  ```\n\n来自 Listing6_6_Speedup 的代码片段\n\n在这种情况下，由于每个元素执行的工作量高于平均值计算 PLINQ 查询，因此扩展性更好。表\
  \ 6.3 总结了使用 `ForAll` 和 `ConcurrentBag` 生成 MD5 哈希的代码运行结果。该测试在具有四个物理核心和八个逻辑核心的计算机上以八种不同的最大并行度运行。\n\
  \n表 6.3 使用 `ForAll` 扩展方法计算 MD5 哈希运行的结果\n\n| 并行度 | 执行时间（秒） | 加速倍数 |\n| :--- | :---\
  \ | :--- |\n| 1 | 19.26 | 1.00x |\n| 2 | 7.32 | 2.63x |\n| 3 | 2.70 | 7.13x |\n\
  | 4 | 2.36 | 8.16x |\n| 5 | 2.10 | 9.17x |\n| 6 | 2.00 | 9.63x |\n| 7 | 1.93 | 9.98x\
  \ |\n| 8 | 1.88 | 10.24x |\n\n图 6-16 显示了运行每个查询所需时间的折线图，而图 6-17 显示了所实现的加速的折线图。正如之前的示例所示，计算机具有四个物理核心；因此，并行的\
  \ MD5 哈希生成在四个核心以内提供了极佳的扩展性。超过四个核心后，额外的任务运行在共享相同物理核心的超线程核心中。因此，一旦并行度超过物理核心数，加速效果就会变得非常小。\n\
  \n图 6-16\n\n![6.16](img/c06f016.jpg)\n\n图 6-17\n\n![6.17](img/c06f017.jpg)\n\n##\
  \ 使用 WithMergeOptions 配置结果的返回方式\n\nPLINQ 将数据源拆分为许多个并行部分，然后必须在消费查询的线程上合并生成的部分。执行是并行的，但结果必须串行流回给消费者，这引入了开销并需要由执行引擎执行同步处理。\n\
  \n你可以使用 `WithMergeOptions` 扩展方法向 PLINQ 提供关于合并并行结果的首选方法的提示。该方法接收一个 `ParallelMergeOptions`\
  \ 参数。表 6.4 总结了该参数的四个值及其对 PLINQ 查询的影响。\n\n表 6.4 ParallelMergeOptions\n\n| 值 | 描述\
  \ |\n| :--- | :--- |\n| `AutoBuffered` | `PLINQ` 使用输出缓冲区在结果提供给消费者之前累积结果。`PLINQ`\
  \ 决定最合适的缓冲区大小。它以分块方式返回结果并保持良好的吞吐量。 |\n| `Default` | `PLINQ` 使用默认合并类型，即 `ParallelMergeOptions.AutoBuffered`。\
  \ |\n| `NotBuffered` | `PLINQ` 不使用输出缓冲区。因此，每个项在合并时都会产生开销。如果查询作为流式返回，此选项可以减少显示第一个元素所需的时间。\
  \ |\n| `Fully` | `PLINQ` 使用全缓冲区在结果提供给消费者之前累积结果。因此，调用线程在所有结果可用后才能访问数据。在不需要部分结果时，`Fully`\
  \ 选项提供了最佳性能。 |\n\n即使 `MergeOptions` 扩展方法为 PLINQ 提示，执行引擎并不总是尊重它。当 PLINQ 需要排序数据时，它会忽略无缓冲区运行的建议。以下代码行说明了如何使用此扩展方法。代码片段提供了本章第一个示例的不同版本，以为\
  \ PLINQ 提供无缓冲区运行查询并尽快显示第一个结果的提示。因为消费者想要看到匹配查询的第一个元素，`ParallelMergeOptions.NotBuffered`\
  \ 减少了显示该部分结果的时间。该选项无缓冲区地运行 PLINQ 查询。\n\n\n\n\n\n```csharp\n// 记住，PLINQ 查询将在此点执行，\n\
  \    // 当代码需要结果时\n    Console.WriteLine(\"第一个键值: {0} \",\n        keysWith10Letters.ElementAt(0));\n\
  \    Console.WriteLine(\"显示第一个结果耗时: {0}\", sw.Elapsed.ToString());\n    Console.ReadLine();\n\
  }\n```\n来自 Snippet6_10 的代码片段\n\n![note](img/note.gif)\n\n每个选项都有其优缺点，因此测量显示第一个结果所需的时间以及完成查询所需的总时间是非常重要的。\n\
  \n# 处理 PLINQ 抛出的异常\n\n正如同许多任务并行运行以支持 PLINQ 查询的并行执行，许多异常也可能并行发生。PLINQ 查询与一组异常工作，这些异常由之前解释过的\
  \ `System.AggregateException` 类进行处理。列表 6-7 显示了高亮的行，这些行代码在 `GenerateMD5Hash` 方法中添加了一个未处理的\
  \ `InvalidOperationException` 异常。\n\n![download](img/download.gif)\n\n列表 6-7: 处理\
  \ PLINQ 查询及其消费者代码中的异常\n\n```csharp\nprivate static string GenerateMD5Hash(int number)\n\
  {\n    if ((number % 10000) == 0)\n    {\n        throw new InvalidOperationException(\n\
  \            String.Format(\n                \"MD5 哈希生成器无法处理被 {0} 整除的输入数字。收到的数字为\
  \ {1}\", \n                10000, number));\n    }\n    var md5M = MD5.Create();\n\
  \    byte[] data = Encoding.Unicode.GetBytes(Environment.UserName + number.ToString());\n\
  \    byte[] result = md5M.ComputeHash(data);\n    string hexString = ConvertToHexString(result);\n\
  \    return hexString;\n}\n\nstatic void Main(string[] args)\n{\n    Console.ReadLine();\n\
  \    Console.WriteLine(\"Started\");\n    var sw = Stopwatch.StartNew();\n    var\
  \ inputIntegers = GenerateMD5InputData();\n    var hashesBag = new ConcurrentBag<string>();\n\
  \n    try\n    {\n        inputIntegers.ForAll((i) => \n            hashesBag.Add(GenerateMD5Hash(i)));\n\
  \        Console.WriteLine(\"第一个 MD5 哈希: {0}\", hashesBag.First());\n        Console.WriteLine(\"\
  开始显示结果耗时: {0}\",\n            sw.Elapsed);\n        Console.WriteLine(\"最后一个 MD5\
  \ 哈希: {0}\", hashesBag.Last());\n        Console.WriteLine(\"{生成了 {1} 个 MD5 哈希\"\
  ,\n            hashesBag.Count(), sw.Elapsed.ToString());\n    }\n    catch (AggregateException\
  \ ex)\n    {\n        foreach (Exception innerEx in ex.InnerExceptions)\n      \
  \  {\n            Debug.WriteLine(innerEx.ToString());\n            // 考虑 innerEx\
  \ 执行操作\n            if (innerEx is InvalidOperationException)\n            {\n \
  \               Console.WriteLine(\n                    String.Format(\n       \
  \                 \"MD5 生成器失败。异常详情: {0}\", \n                        innerEx.Message));\n\
  \            }\n        }\n        // 出了一些问题\n        // 创建一个新的无结果空 ConcurrentBag\n\
  \        hashesBag = new ConcurrentBag<string>();\n    }\n    Console.ReadLine();\n\
  }\n```由于 PLINQ 查询具有延迟执行特性，因此捕获在消费由查询生成的数据时可能发生的异常是非常重要的。此外，由于没有执行顺序，当你多次运行代码时，`Exception`\
  \ 的只读集合 `InnerExceptions` 中的第一个异常并不总是相同的。PLINQ 查询的执行一旦出现 任何一个未处理的异常就会尝试停止。然而，由于可能有很多任务在并行运行部分内容，`InnerExceptions`\
  \ 中可能存在多个异常。一个 `try` 块包围了 PLINQ 查询和消费该查询的代码。由于有很多数字可以被 10,000 整除，因此在 PLINQ 查询停止执行之前，可能会出现不止一个异常。列表\
  \ 6-8 显示了执行四次相同代码的结果。\n\n列表 6-8: 运行列表 6-7 中代码四次的结果\n第一次\nStarted MD5 生成器失败。异常详情:\
  \ MD5 哈希生成器无法处理被 10000 整除的输入数字。收到的数字为 40000\n第二次\nStarted MD5 生成器失败。异常详情: MD5 哈希生成器无法处理被\
  \ 10000 整除的输入数字。收到的数字为 90000\n第三次\nStarted MD5 生成器失败。异常详情: MD5 哈希生成器无法处理被 10000\
  \ 整除的输入数字。收到的数字为 40000\nMD5 生成器失败。异常详情: MD5 哈希生成器无法处理被 10000 整除的输入数字。收到的数字为 90000\n\
  第四次\nStarted MD5 生成器失败。异常详情: MD5 哈希生成器无法处理被 10000 整除的输入数字。收到的数字为 30000\n\n在一次执行中，`try`\
  \ 块捕获了 `Exception` 实例。这是因为许多任务在并行运行，在 PLINQ 停止执行以需要取消任务时，异常可能同时发生。\n\n# 使用 PLINQ\
  \ 执行 MapReduce\n\nMapReduce 是一种非常流行的框架，可以利用并行性来处理大规模数据集。它的基本思想非常简单，由以下可并行化的操作组成：\n\
  * `Map` —— 获取数据源并为每个项目计算键值对。\n* `Reduce` —— 接收按键分组的键值对并对组进行归约。它可以返回一个或多个值。\n\n图\
  \ 6-18 显示了带有 `Map` 和 `Reduce` 操作及其结果的图 6-18](#9781118029770c06.xhtml_c06_anc_018)\n\
  上述定义是 MapReduce 的简单实现。某些实现可以定义额外的阶段，将问题分成更小部分并在不同的计算机（工作节点）上运行它们。然后使用两个 PLINQ 查询来计算单词在\
  \ `map` 操作中出现的次数。\n\n\n\n\n\n```csharp\nConsole.ReadLine();\n\n}\n```\n\n`map` 操作生成了由单词和\
  \ `1` 组成的键值对。这意味着代码将每个单词添加作为一个键，并将 `1` 作为值。它在并行中创建一个 `ILookup<string, int>`（即 map），将键（在此例中为单词）映射到值的的可枚举序列。\n\
  \n![download](img/download.gif)\n\n```csharp\nILookup<string, int> map = words.AsParallel().ToLookup(p\
  \ => p, k => 1);\n```\n\n来自列表 6_9 的代码片段\n\n`reduce` 操作计算单词出现的次数，并过滤出出现超过一次的单词。PLINQ\
  \ 查询使用 `IGrouping<string, int>` 从具有共同键的元素集合中选择。通过这种方式，它可以访问 `Key` 属性和 `Count` 扩展方法。\n\
  \n![download](img/download.gif)\n\n```csharp\nvar reduce = from IGrouping<string,\
  \ int> wordMap \n             in map.AsParallel()\n             where wordMap.Count()\
  \ > 1\n             select new \n             { Word = wordMap.Key, Count = wordMap.Count()\
  \ };\n```\n\n来自列表 6_9 的代码片段\n\n然后，使用顺序 `foreach` 遍历 `reduce` 操作的结果，并显示每个单词及其出现的次数。以下是运行列表\
  \ 6-9 中所示示例的结果：\n\n单词：‘a’；计数：4\n\n单词：‘great’；计数：2\n\n单词：‘there’；计数：3\n\n单词：‘and’；计数：2\n\
  \n单词：‘is’；计数：3\n\n由于 PLINQ 查询的延迟执行，列表 6-9 中所示的代码并不代表 MapReduce 算法的纯实现。你可以通过使用不同类型的\
  \ PLINQ 查询来解决这个问题。然而，由于 MapReduce 非常流行，学习 PLINQ 提供的选项以来实现其算法框架的某些变体是一个好主意。你也可以使用并行循环来解决这个问题。\n\
  \n# 使用 PLINQ 设计串行阶段\n\n你可以利用到目前为止学到的 PLINQ 知识来并行执行一组带有数据流的串行阶段。考虑以下任务：\n\n*   `CreatePoints`\
  \ — 根据接收到的中心位置位置参数，创建四个点。\n*   `CreateLines` — 使用这四个点创建两条线。\n*   `CreateEllipse`\
  \ — 使用两条线，以其中一条作为半长轴，另一条作为半短轴来计算椭圆。\n*   `CreateCircle` — 在椭圆中间创建一个圆。\n*   `CreateBoundingBox`\
  \ — 为椭圆创建一个边界包盒。\n*   `FillBoundingBox` — 使用渐变填充边界包盒。\n\n图 6-19 显示了上述任务像流水线一样完成的工作。如果每个任务都由接收来自上一个阶段参数的不同类和方法表示，并且你需要根据数据源多次执行此工作，那么你可以根据\
  \ PLINQ 提供的并行化可能性来设计这些阶段集。\n\n图 6-19\n\n![6.19](img/c06f019.jpg)\n\n你可以创建一个能够管理所有任务之间数据流的类或方法，并使用\
  \ `ForAll` 扩展方法或在 PLINQ 查询内部运行它。以下代码显示了一个处理带有不同任务的每个阶段的方法示例：\n\n![download](img/download.gif)\n\
  \n```csharp\npublic static ComplexGeometry ExecuteStages(Point centerLocation)\n\
  {\n    var finalGeometry = new List<Geometry>();\n    List<Point> pointsList = GeomPoint.CreatePoints();\n\
  \    finalGeometry.Add(pointsList);\n\n    List<Line> linesList = GeomLine.CreateLines(pointsList);\n\
  \    finalGeometry.Add(linesList);\n\n    Ellipse ellipse = GeomEllipse.CreateEllipse(linesList);\n\
  \    finalGeometry.Add(ellipse);\n\n    Circle circle = GeomCircle.CreateCircle(ellipse);\n\
  \    finalGeometry.Add(circle);\n\n    BoundingBox boundingBox = GeomBoundingBox.CreateBoundingBox(ellipse);\n\
  \    finalGeometry.Add(boundingBox);\n\n    return finalGeometry;\n}\n```\n\n\n\n\
