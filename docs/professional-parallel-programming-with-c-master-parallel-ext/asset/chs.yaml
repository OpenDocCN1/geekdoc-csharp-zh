  \n## 从任务返回值\n\n到目前为止，任务实例没有返回结果——它们是运行无返回值方法的委托。然而，也可以从任务返回结果，调用函数并使用 `Task<TResult>`\
  \ 实例，其中 `TResult` 必须替换为返回类型。Listing 3-5 显示了一个新函数的代码，该函数生成著名的 AES 密钥，然后返回以参数之一接收到的字符（前缀）开头的密钥列表。`GenerateKeysWithPrefix`\
