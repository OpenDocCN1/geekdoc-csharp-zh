  \n## 使用 Volatile 修饰符\n\n在之前的自旋和让出示例中，有一个任务监控 `_producingSentences` 变量的值，另一个并发任务则修改其\
  \ `bool` 值。这些任务每个都运行在不同的并发线程中。运行 `ProduceSentences` 方法的线程更改了 `_producingSentences`\
  \ 的值。代码没有使用互斥锁或原子更新来序列化此共享变量 `bool` 值的更新。\n\n声明此变量的代码使用 `volatile` 关键字作为修饰符，以避免编译器假设该字段将被单个线程访问的优化：\n\
  \n```csharp\nprivate static volatile bool _producingSentences = false;\n```\n\n\
  `volatile` 关键字确保了当从不同线程访问且在不使用锁或原子操作的情况下进行更新时，共享变量中始终存在最新的值。在这个示例中，消费生成句子的线程读取该\
  \ `bool` 变量变化变化的速度将比受默认编译器优化的相同代码更快。\n\n![note](img/note.gif)\n\n你可以将此修饰符应用于类或结构体的字段。你不能使用\
  \ `volatile` 关键字声明局部变量。\n\n你可以将 `volatile` 修饰符应用于 `bool`、整数类型、具有整数基类型的 `enum` 类型、引用类型、已知引用类型的泛型类型参数、unsafe\
  \ 上下文中的指针类型，以及表示指针或句柄（如 `IntPtr` 和 `UIntPtr`）的平台特定类型。volatile 指针只影响指针本身——而不影响它所指向的对象。volatile\
  \ 引用也是如此。\n\n# 使用轻量级手动重置事件\n\n如果你预计等待时间非常短，新的轻量级手动重置事件 `ManualResetEventSlim` 允许你发送信号并等待事件句柄。由于它的重量级对应项\
  \ `ManualResetEvent` 更高，当等待时间不长时，可以使用这个新精简版本提供的自旋和内核等待的结合。此版本更适用于基于任务的编程模型。\n\n\
  手动重置事件是一个具有两种可能的事件对象：设置/已信号（`true`）或未设置/无信号（`false`）。此对象允许一个任务向另一个任务发送信号，指示事件已发生。这种信号机制发生在底层线程层级；然而，你已经知道每个任务都需要一个线程来运行其并发代码。当一个任务发送信号时，另一个任务可以使用\
  \ `Wait` 函数等待事件状态变为信号状态。`Wait` 函数会阻塞任务及其底层线程，直到事件被触发。\n\n## 使用 ManualResetEventSlim\
  \ 自旋和等待\n\n`ManualResetEventSlim` 提供了自旋和基于内核等待的结合。你可以使用该类的实例在任务之间发送信号并等待它们。Listing\
