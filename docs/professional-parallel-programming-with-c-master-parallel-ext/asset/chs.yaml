  \n*我将严格根据最后一个 [content] 块中的文本进行最终输出。*\n\n\n\n\n*   **分叉节点（Fork node）** — 定义一个分叉节点，其中每个输入的任务或线程都会拆分成多个并发任务或线程。由于原始定义仅与线程相关，你可以添加注释，说明该设计将一个输入任务拆分为多个任务。\n\
  *   **合并节点（Join node）** — 定义一个合并节点，它将多个线程汇在一起，等待它们完成后再继续后续操作。由于原始定义仅与线程相关，你可以添加注释，说明该设计允许单个任务从输出流中产生。此单个任务将由一个线程支持。\n\
  *   **泳道（Swim lane）** — 定义一个水平或垂直区域，允许根据组成活动图的子过程对活动图元素进行分组。它也可以用于表示不同的线程或任务，但 Visual\
  \ Studio 2010 Ultimate 的建模功能不支持泳道。因此，你必须添加一个矩形和注释来构建泳道。它也被称为 swimlane（一个单词）。\n\n\
  图 B-5\n\n![3.1](img/b02f005.jpg)\n\n图 B-6 显示了一个带有分叉节点的活动图，该节点启动了四个运行并发操作的任务：`ConvertEllipses`、`ConvertRectangles`、`ConvertLines`\
  \ 和 `ConvertText`。此外，还有一个合并节点，它等待这四个任务完成，然后继续执行 `MergeConversions` 操作。两个注释为模型添加了信息，说明分叉节点和合并节点与任务相关而非线程。\n\
  \n图 B-6\n\n![3.1](img/b02f006.jpg)\n\n## 用例图\n\nVisual Studio 2010 Ultimate 的建模功能支持\
  \ UML 用例图。用例图为你提供了一个绝佳的机会，让你开始考虑可能并行发生并从从并行中受益的潜在场景。\n\n用例的经典定义是它描述了一系列为执行者提供可衡量价值的动作。然而，如果为了实现时考虑了并行性，它也可以描述并行动作的序列。此外，许多用例可以并发执行。当然，用例图不需要包含有关技术实现的细节，但使用此图来规划并行化是一个好主意。\n\
  \n图 B-7 显示了一个简单的用例图，其中包含许多与订单处理系统相关的用例。注释表明，执行者 `Customer`（客户）应该能够并行执行以下两个用例：\n\n\
  * 浏览目录并选择项目\n* 预览 3D 模型\n\n图 B-7\n\n![3.1](img/b02f007.jpg)\n\n该用例图提供了关于通过考虑并行化来实现这两个用例的可能性的有用信息。用户可能需要同时执行这两个用例；因此，有并行运行这两个用例的绝佳机会。用例图对于对于优先考虑必须利用并行性以提供最佳响应时间的用例特别有用。\n\
  \n# 交互图\n\n交互图从不同的视角描述了被建模系统内部各种元素之间的数据流和控制操作。它们是之前阐述的行为图的子集。以下两个行为图如果能增加与并发和并行相关的符号，将从中受益：\n\
  \n*   交互概览图\n*   时序图\n\n## 交互概览图\n\n此图类似于活动图；因此，为活动图所解释的所有添加也适用于此图。交互概览图强调高层控制流，并可以包含引用其他图的节点。包含注释来解释这些节点是顺序执行还是并行执行是有用的。\n\
  \n图 B-8 显示了一个简单的交互概览图，其中包含三个引用时序图的节点：`CreateCollections`、`ConvertCollections` 和\
  \ `MergeConversions`。这些节点包含了注释，提供了有关所实现的执行类型的信息。`ConvertCollections` 节点使用多个任务并行化运行。\n\
  \n图 B-8\n\n![3.1](img/b02f008.jpg)\n\n## 时序图\n\nVisual Studio 2010 Ultimate 的建模功能支持\
  \ UML 时序图。时序图对于描述在不同任务和线程中运行的实例与方法之间的交互非常重要。因此，为对象添加对象生命线所代表的任务或线程信息是非常重要的。事实上，线程安全的实例可以同时在许多不同的任务或线程中运行代码。因此，有时你需要为单个对象添加许多生命线，每个生命线代表不同的任务或线程。这样，时序图就可以表示并行序列。\n\
  \n例如，图 B-9 显示了一个简单的时序图，其中对 `OptimizedMath` 有多次调用，分布在主线程和两个任务中。\n\n图 B-9\n\n![3.1](img/b02f009.jpg)\n\
  \n在图中，`OptimizedMath` 对象出现在以下生命线中：\n\n* OptimizedMath（主线程）\n* OptimizedMath（任务 t1）\n\
  * OptimizedMath（任务 t2）\n\n很容易可视化这些序列中发生的并发任务和潜在并行化，因为并行化是通过 `OptimizedMath` 的不同实例实现的。\n\
  \n# 附录 C\n\nParallel Extensions 是一个并非 .NET Framework 4 的补充项目，但它是微软开发的 .NET Framework\
  \ 4 的并行编程示例。这些扩展并不是生产级的，因为它们既没有经过充分测试也不是稳定的代码。然而，它们包含了源代码，你可以根据特定需求对其进行定制。本附录包含了组成并行扩展的类和结构的描述。\n\
  \n## 检查 Parallel Extensions\n\nParallel Extensions 比较隐藏，因为它们包含在并行示例的一个项目中。下载最新版本的直接链接是\
  \ `http://code.msdn.microsoft.com/ParExtSamples/ProjectReleases.aspx`。\n\n```\n\
  http://code.msdn.microsoft.com/ParExtSamples/ProjectReleases.aspx\n```\n\n因此，如果你下载了这些示例，就可以找到并检查包含在许多文件夹中的\
