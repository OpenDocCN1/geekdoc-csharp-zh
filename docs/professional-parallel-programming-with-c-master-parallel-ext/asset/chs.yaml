  \ lines）中，以便在主内存之间传输数据。缓存行的大小通常为 64 字节或更多。这意味着从主内存传输到其中一个缓存的最小数据量就是缓存行的大小。这种分组可能会在你的并行算法中导致意想不到的问题。\n\
  \n如果运行在不同核心上的多个线程必须修改位于共享同一缓存行的连续地址空间中的数据，缓存一致性机制会在每次写操作时都使整行缓存失效。这种发生在硬件层面的缓存行失效会导致被称为“伪共享”（false\
  \ sharing）的性能问题。这个问题也被称为“缓存行乒乓”（cache line ping-ponging）。这个问题不仅是写-写冲突，也是写-读冲突。它对应用程序的影响类似于由带有互斥锁的临界区域所产生的序列化执行。然而，性能惩罚仅在独占访问的需求共享该较小的缓存行时才会出现。\n\
  \n列表 10-10 显示了一个控制台应用程序的代码，该程序使用简单的 `NumberGenerator` 类来生成新数字。`_lastNumber` 私有变量是该类的内部状态。因此，当它与并行更新的数组结合时，可能会重现伪共享的场景。\n\
  \n![下载](img/download.gif)\n\n列表 10-10: 一个共享缓存行的应用程序\n\n```csharp\nusing System;\n\
  using System.Collections.Generic;\nusing System.Linq;\nusing System.Text;\nusing\
  \ System.Threading.Tasks;\nusing System.Diagnostics;\n\nnamespace Listing10_10\n\
  {\n    class NumberGenerator\n    {\n        private int _lastNumber = 0;\n\n  \
  \      public int GenerateNext()\n        {\n            _lastNumber++;\n      \
  \      return _lastNumber;\n        }\n    }\n    class Program\n    {\n       \
  \ private static int NUM_INTS = 50000000;\n        private static void GenerateNumbersSharedLine()\n\
  \        {\n            NumberGenerator ng1 = new NumberGenerator();\n         \
  \   NumberGenerator ng2 = new NumberGenerator();\n            int[] numbers1 = new\
  \ int[NUM_INTS];\n            int[] numbers2 = new int[NUM_INTS];\n            //\
  \ 并行生成数字\n            // 有高概率\n            // 共享缓存行\n            Parallel.Invoke(\n\
  \                () =>\n                {\n                    for (int i = 0; i\
  \ < NUM_INTS; i++)\n                    {\n                        numbers1[i] =\
  \ ng1.GenerateNext();\n                    }\n                },\n             \
  \   () =>\n                {\n                    for (int i = 0; i < NUM_INTS;\
  \ i++)\n                    {\n                        numbers2[i] = ng2.GenerateNext();\n\
  \                    }\n                }\n            );\n            Console.WriteLine(\"\
  numbers1: {0}\", numbers1.Max());\n            Console.WriteLine(\"numbers2: {0}\"\
  , numbers2.Max());\n        }\n        static void Main(string[] args)\n       \
  \ {\n            var sw = Stopwatch.StartNew();\n            GenerateNumbersSharedLine();\n\
  \            Console.WriteLine(sw.Elapsed.TotalSeconds);\n            Console.ReadLine();\n\
  \        }\n    }\n}\n```\n\n该应用程序测量了运行 `GenerateNumbersSharedLine` 方法所需的时间。该方法声明并创建了两个\
  \ `NumberGenerator` 实例以及两个容量为 `NUM_INTS` 的 `int` 数组。问题开始的地方，因为每个 `NumberGenerator`\
  \ 实例都有内部状态，并且当代码需要更新这些值时，数组将共享缓存行。\n\n然后，代码启动了两个并行任务，用由两个 `NumberGenerator` 实例生成的数字来填充之前创建的两个数组。\n\
  \n在你运行一个避免了共享缓存行的类似应用程序版本之前，你不会注意到这个性能问题。列表 10-11 显示了这个新版本，它只是改变了数组和 `NumberGenerator`\
  \ 实例声明和创建的位置。由于新代码在定义并行运行操作的委托内部创建每个 `NumberGenerator` 实例，因此内部状态更新产生缓存行问题的概率要小得多。此外，代码在委托内部初始化每个数组以避免伪共享问题。两个数字生成器实例仍然可能最终在堆上相邻，但使用新代码后发生这种情况的可能性较低。\n\
  \n![下载](img/download.gif)\n\n列表 10-11: 一个避免共享缓存行的应用程序\n\n```csharp\nusing System;\n\
  using System.Collections.Generic;\nusing System.Linq;\nusing System.Text;\nusing\
  \ System.Threading.Tasks;\nusing System.Diagnostics;\n\nnamespace Listing10_11\n\
  {\n    class NumberGenerator\n    {\n        private int _lastNumber = 0;\n    \
  \    public int GenerateNext()\n        {\n            _lastNumber++;\n        \
  \    return _lastNumber;\n        }\n    }\n    class Program\n    {\n        private\
  \ static int NUM_INTS = 50000000;\n        private static void GenerateNumbersSharedLine()\n\
  \        {\n            NumberGenerator ng1 = new NumberGenerator();\n         \
  \   NumberGenerator ng2 = new NumberGenerator();\n            int[] numbers1 = new\
  \ int[NUM_INTS];\n            int[] numbers2 = new int[NUM_INTS];\n            //\
  \ 并行生成数字\n            // 有高概率\n            // 共享缓存行\n            Parallel.Invoke(\n\
  \                () =>\n                {\n                    for (int i = 0; i\
  \ < NUM_INTS; i++)\n                    {\n                        numbers1[i] =\
  \ ng1.GenerateNext();\n                    }\n                },\n             \
  \   () =>\n                {\n                    for (int i = 0; i < NUM_INTS;\
  \ i++)\n                    {\n                        numbers2[i] = ng2.GenerateNext();\n\
  \                    }\n                }\n            );\n            Console.WriteLine(\"\
  numbers1: {0}\", numbers1.Max());\n            Console.WriteLine(\"numbers2: {0}\"\
  , numbers2.Max());\n        }\n        static void Main(string[] args)\n       \
  \ {\n            var sw = Stopwatch.StartNew();\n            GenerateNumbersSharedLine();\n\
  \            Console.WriteLine(sw.Elapsed.TotalSeconds);\n            Console.ReadLine();\n\
  \        }\n    }\n}\n```\n\n# 总结\n\n本章解释了在使用 .NET Framework 4 进行并行化代码时发现的一些常见问题。本章还介绍了性能分析功能的用法，以识别这些问题并提高并行化应用程序的性能和可扩展性。本章总结如下：\n\
  \n*   你必须运行必要的测试以确保应用程序的正确性、预期的加速效果和可扩展性。\n*   有时，你的并行化应用程序应该与单核心计算机兼容。如果不是，请务必指定适当的要求。\n\
  *   可以使用适当的性能分析方法检测与并行化代码相关的常见问题。\n*   你可以隔离并行化算法以简化你的分析工作。\n\n# 第 11 章\n\n向量化、SIMD\
  \ 指令以及额外的并行库\n\n### 本章内容\n\n*   理解 SIMD 和向量化\n*   理解扩展指令集\n*   使用 Intel Math Kernel\
  \ Library\n\n\n\n\n\n*   处理适用于多核的、高度优化的软件函数\n*   将基于任务的编程与外部优化库结合\n*   并行生成伪随机数\n\
  *   使用 `ThreadLocal<T>` 类\n*   使用 Intel 集成性能原语（Intel Integrated Performance Primitives）\n\
  \n在之前的 10 章中，你学习了如何创建和协调并行运行许多任务的代码以提高性能。如果你想进一步提高吞吐量，可以利用现代硬件在并行方面提供的其他可能性。本章将介绍其他性能库的使用，并包含它们与\
  \ .NET Framework 4 以及新的基于任务的编程模型的集成示例。此外，本章还提供了新的线程本地存储类以及这些类所提供的延迟初始化能力的的用法示例。\n\
  \n# 理解 SIMD 和向量化\n\n第 1 章“基于任务的编程”中的“并行编程与多核编程”部分介绍了不同的并行架构。该部分还解释了大多数现代微处理器都可以执行单指令、多数据（SIMD）指令。由于\
  \ SIMD 指令的执行单元通常属于某个物理核心，因此可以根据可用物理核心的数量并行运行相应数量 D 指令。并行使用这些向量处理能力可以为某些算法提供重要的加速。\n\
  \n这里有一个简单的示例，可以帮助你理解 SIMD 指令的力量。图 11-1 显示了表示 `PABSD` 指令的图。该指令是 Intel Core 2 架构引入的补充流式\
  \ SIMD 扩展 3（SSSE 3）的一部分。\n\n图 11-1\n\n![11.1](img/c11f001.jpg)\n\n`PABSD` 助记符意思是双字的打包绝对值（packed\
  \ absolute value for double-word）。该汇编指令接收一个 128 位的输入参数，其中包含四个 32 位符号整数。该指令返回一个 128\
  \ 位的输出，其中包含四个 32 位符号整数的每个绝对值，并封装在 128 位输出中。\n\n你可以通过单次调用 `PABSD` 指令计算四个 32 位符号整数的绝对值。如果你需要计算\
  \ 1,000 个 32 位符号整数的绝对值，你可以通过该指令 250 次来完成，而不是为每个 32 位符号整数使用单独指令。你可以实现非常重要的加速。然而，由于在调用\
  \ SIMD 指令之前需要对数据进行打包，之后需要解包，因此测量这些额外代码带来的开销也是重要的。\n\n如果你只需要计算四个 32 位符号整数的绝对值，额外的开销将减少整体加速。但是，如果你需要计算\
  \ 100 个 32 位符号整数的绝对值，你通常会从这种 SIMD 指令的用法中获益。\n\n如果你需要计算 1,000 个 32 位符号整数的绝对值，并且在支持\
  \ SSSE3 扩展指令集的双物理核心 CPU 上运行代码，你可以通过并行运行 `PABSD` 指令来增加吞吐量。你可以在每个物理核心上调用该指令 125 次来计算这些值，并通过并行结合\
  \ SIMD 指令的执行来实现加速。绝对值的计算如下：\n\n125 次调用 x 2 个物理核心 x 每次 PABSD 指令调用 4 个整数 = 1,000 个\
  \ 32 位符号整数 图 11-2 显示了表示在两个物理核心上并行执行 `PABSD` 的图。\n\n图 11-2\n\n![11.2](img/c11f002.jpg)\n\
  \n每个 SIMD 指令通常可以与不同的打包数据类型工作。例如，SSSE3 扩展指令集包含了三个汇编 SIMD 指令，用于计算以下数据类型的打包绝对值：\n\n\
  *   `PABSB` — 计算 16 个符号字节的绝对值\n*   `PABSW` — 计算 8 个 16 位符号整数（字）的绝对值\n*   `PABSD`\
  \ — 计算 4 个 32 位符号整数（双字）的绝对值\n\n![note](img/note.gif)\n\n上述 SIMD 指令也可以计算较少打包值的绝对值。例如，`PABSB`\
  \ 可以计算 8 个符号字节的绝对值而非 16 个。\n\n许多用 C 和 C++ 编写的应用程序利用这些指令集来处理向量和矩阵。它们对于提高需要在许多数据块上执行多次计算的算法的性能非常有用。大多数现代\
  \ C 和 C++ 编译器都会优化循环以利用 SIMD 指令集。因此，当你遵循某些编写对数组执行操作循环的指南时，它们能够执行自动向量化。\n\n.NET Framework\
  \ 4 不提供对 SIMD 或自动向量化的直接支持。这意味着你的 C# 代码无法调用 SIMD 指令，且 C# 编译器没有提供在对数组执行操作时启用 SIMD\
  \ 的选项。然而，你可以使用利用并行和 SIMD 指令的库。后续章节提供了针对多个领域的库示例。这些库是 Intel 数学库（MKL）和 Intel 原语（IPP）。\n\
  \n# 从 MMX 到 SSE4.x 和 AVX\n\n大多数微处理器都可以执行 SIMD 指令。然而，这些指令属于不同的指令集。随着对更高计算需求的不断增长，许多处理器制造商在其新的\
  \ CPU 模型中加入了扩展指令集。在本书期间，最先进的 Intel CPU 支持以下指令集：\n\n*   MMX — 多媒体扩展\n*   SSE — 流式\
  \ SIMD 扩展\n*   SSE2 — 流式 SIMD 扩展 2\n*   SSE3 — 流式 SIMD 扩展 3\n*   SSSE3 — 补充流式 SIMD\
  \ 扩展 3\n*   SSE4.1 — 流式 SIMD 扩展 4.1\n*   SSE4.2 — 流式 SIMD 扩展 4.2\n*   AES-NI — 高级加密标准指令\n\
  *   AVX — 向量扩展\n\n![note](img/note.gif)\n\n上述 MKL 和 IPP 性能库检测可用的扩展指令集，并根据底层硬件提供的可能性优化执行。因此，如果你在两个类似的双微处理器上运行相同的代码，但它们支持不同的扩展指令集，你可能会获得不同的性能结果。例如，如果\
  \ CPU 支持向量扩展（AVX），它可以通过单个指令对 256 位打包类型执行某些操作。\n\n在 Windows 32 位和 64 位版本中检查 CPU 支持的指令集有一种非常简单的方法。你可以使用\
  \ CPU-Z，由 CPUID 开发的免费工具。你只需要从 [www.cpuid.com](http://www.cpuid.com) 下载相应的版本并安装或运行压缩执行文件\
  \ `cpuz.exe`。然后，选择 CPU 选项卡并检查字段列表。图 11-3 显示了 CPU 选项卡的示例及其显示的值。\n\n图 11-3\n\n![11.3](img/c11f003.jpg)\n\
  \n此示例中的 Instructions 字段包含以下值：\n\n\n\n\n\nMMX, SSE(1, 2, 3, 3S, 4.1, 4.2), EM64T,\
  \ VT-x\n\n这意味着 Intel Core i7 Q820 CPU 支持以下 SIMD 指令集：\n\n* MMX\n* SSE (SSE 标记为 1)\n\
  * SSE2\n* SSE3\n* SSSE3 (SSE 标记为 3S)\n* SSE4.1\n* SSE4.2\n\nIntel Core i7 Q820 CPU\
  \ 不支持 AES 指令集或 AVX 指令集。\n\n# 使用 Intel 数学库 (MKL)\n\nIntel MKL 是一个针对科学、工程和金融应用程序的高度优化数学例程库。这些数学例程利用多线程和\
  \ SIMD 指令根据硬件实现最佳性能。MKL 10.3 引入了一个名为 `mkl_rt.dll` 的简单 DLL，您可以通过平台调用服务（P/Invokes）\
  \ 在 C# 代码中调用它。\n\n代码列表 11-1 显示了 WPF 主窗口的 XAML 代码，该窗口在窗口上显示了一个 `Button` 控件和一个 `ListBox`。您可以在\
  \ 图 11-4 中查看此窗口的设计视图。此外，代码列表 11-1 显示了主窗口的 C# 代码，包含了定义按钮 `Click` 事件处理程序的代码，以及在 `MKL_dtfi.cs`\
  \ 文件中定义 MKL 封装器的代码。\n\n图 11-4\n\n![11.4](img/c11f004.jpg)![note](img/note.gif)\n\
