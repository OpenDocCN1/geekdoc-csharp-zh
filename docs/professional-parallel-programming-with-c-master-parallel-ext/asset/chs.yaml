  \ workerNum)\n        {\n            // 模拟一些工作\n            // 在 7 秒到 2 秒之间\n  \
  \          var seconds = new Random().Next(700, 200);\n            Debug.WriteLine(\"\
  Worker {0} 将模拟工作 {1} 秒\", workerNum, seconds);\n            var sw = Stopwatch.Start();\n\
  \            // 模拟一些 CPU 密集型工作\n            while (sw.Elapsed.Milliseconds < milli)\n\
  \            {\n                // 继续模拟 CPU 密集型工作\n                double calc =\
  \ Math.Pow(Math.PI * sw.Elapsed.TotalMilliseconds, 2);\n            }\n        }\n\
  \n        private void LaunchWorker_Click(object sender, RoutedEventArgs e)\n  \
  \      {\n            // 增加工作线程计数\n            // 这里不需要原子操作\n            // 因为此代码始终运行在\
  \ UI 线程上\n            _workerCount++;\n            // 创建并启动一个新的任务\n            //\
  \ 将 _workerCount 作为参数\n            // 传递给 de 委托\n            // 使用 _threadFactory\
  \ 而不是 Task.Factory\n            var workerTask = _threadFactory.StartNew((num) =>\n\
  \            {\n                // 获取作为对象参数\n                // 接收的 workerNum\n\
