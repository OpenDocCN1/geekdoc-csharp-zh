  \ lastKey))\n{\n    Console.WriteLine(\n        \"The first key in the queue is:\
  \ {0}\", lastKey);\n}\n```\n\n代码段包含在列表 4_3\n\n## 理解并行生产者-消费者模式\n\n`ParallelPartitionGenerateAESKeys`\
  \ 并行运行许多循环以生成 `Byte` 数组形式的 AES 密钥，然后它调用 `ConvertToHexString` 方法并将数组作为参数将其转换为十六进制值的字符串。然后，它将结果添加到\
  \ `ConcurrentQueue` `_keysQueue` 中。你可以通过生产者-消费者模式将此算法拆分为两个阶段的线性流水线。\n\n![note](img/note.gif)\n\
  \n本节及后续章节涵盖了一些不代表最佳实践的并发集合场景。示例提供了必须改进的简单示例。你将能够在本章中学到的关于并发集合的所有知识，与后续章节解释的额外机制相结合，以实现正确性和可扩展性。\n\
  \nListing 4-4 显示了通过使用两个共享的 `ConcurrentQueue` 实例 `_byteArraysQueue` 和 `_keysQueue`\
  \ 实现两个阶段线性流水线的代码，如图 4-2 所示。\n\n![download](img/download.gif)\n\n### 列表 4-4：与两个 ConcurrentQueue\
  \ 实例协作的一个并行生产者和一个消费者\n\n```c\nprivate static ConcurrentQueue<Byte[]> _byteArraysQueue;\n\
  private static ConcurrentQueue<string> _keysQueue;\n\nprivate static void ParallelPartitionGenerateAESKeys(int\
  \ maxDegree)\n{\n    var parallelOptions = new ParallelOptions();\n    parallelOptions.MaxDegreeOfParallelism\
  \ = maxDegree;\n    var sw = Stopwatch.StartNew();\n    Parallel.ForEach(\n    \
  \    Partitioner.Create(1, NUM_AES_KEYS + 1), \n        parallelOptions, range =>\n\
