  \ `Wait` 方法的任务将保持阻塞直到状态发生变化。\n\n`ManualResetEventSlim` 实例提供了以下方法：\n* `Reset()`：将事件设置为\
  \ `false`（未设置/非信号）。\n* `Set()`：将事件设置为 `true`（设置/信号）。如果任务调用了 `Wait` 方法，它们将在此方法被调用后被解除阻塞。\n\
  * `Wait()`：阻塞当前任务或线程，直到另一个任务或线程通过调用 `Set` 方法将此 `ManualResetEventSlim` 实例的事件设置为 `true`（设置/信号）。如果事件已经设置/信号，它将立即返回。它始终会执行自旋等待过程，然后执行基于内核的等待，即使在构造函数中没有指定\
  \ `spincount`。构造函数中的 `spincount` 值对使用的自旋次数提供了更多控制，以便你能够根据性能分析来调优自己的用法。`Wait` 方法提供了许多重载，允许你向其发送\
  \ `CancellationToken` 实例和/或作为 `int` 或 `TimeSpan` 的超时时间。\n\n`ManualResetEventSlim`\
  \ 实例暴露了以下三个只读属性：\n* `IsSet`：提供一个 `bool` 值，指示事件为 `true`（设置/信号）。\n* `SpinCount`：提供在开始基于内核的等待之前将执行的自旋等待次数。它是构造函数指定的值。\n\
  * `WaitHandle`：提供封装操作系统对象的 `WaitHandle` 对象。该对象允许等待共享资源的独占访问。\n\n在 `ProduceSentences`\
  \ 方法开始向 `_sentencesBag` `ConcurrentBag` 添加元素之前，它通过调用 `Set` 方法设置/信号初始为非信号/未设置的 `_mresProduceSentences`\
  \ `ManualResetEventSlim`。\n\n\n\n\n\n不需要添加共享变量作为标记，因为当 `ManualResetEventSlim` 被信号时，`_mresProduceSentences.IsSet`\
