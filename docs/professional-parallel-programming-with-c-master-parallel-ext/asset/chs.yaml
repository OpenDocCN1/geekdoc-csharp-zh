  \n## 测量并发性\n\n列表 10-1 显示了一个控制台应用程序的代码，该程序运行了一个简单的并行语言集成查询 (`PLINQ`) 表达式，以并行执行的方式过滤数字并计算平均值。这个简单的应用程序为学习\
  \ `Visual Studio 2010` 中引入的性能分析方法之一提供了一个极佳的机会。\n\n![download](img/download.gif)\n\
  \n列表 10-1: 一个带有不必要锁的简单 PLINQ 查询的应用程序\n\n```c\nusing System;\nusing System.Collections.Generic;\n\
  using System.Linq;\nusing System.Text;\nusing System.Diagnostics;\nusing System.Threading.Tasks;\n\
  \n// 此代码存在性能问题 \n// 不要将此代码视为最佳实践\n\nnamespace Listing10_1\n{\n    class Program\n\
  \    {\n        // 500,000,000 个整数\n        private static int NUM_INTS = 500000000;\n\
  \        private static ParallelQuery<int> GenerateInputData()\n        {\n    \
  \        return ParallelEnumerable.Range(1, NUM_INTS);\n        }\n        private\
  \ static object _syncCalc = new Object();\n        private static double CalculateX(int\
  \ intNum)\n        {\n            // 此代码有一个不必要的锁\n            double result;\n \
  \           lock (_syncCalc)\n            {\n                result = Math.Pow(Math.Sqrt(intNum\
  \ / Math.PI), 3);\n            }\n            return result;\n        }\n      \
  \  static void Main(string[] args)\n        {\n            var sw = Stopwatch.StartNew();\n\
  \            var inputIntegers = GenerateInputData();\n            var parReductionQuery\
  \ =\n                from intNum in inputIntegers.AsParallel()\n               \
  \ where ((intNum % 5) == 0) ||\n                      ((intNum % 7) == 0) ||\n \
  \                     ((intNum % 9) == 0)\n                select (CalculateX(intNum)).Average();\n\
  \            Console.WriteLine(\"Average {0}\", parReductionQuery);\n          \
  \  // 在性能分析时注释掉以下两行\n            Console.WriteLine(\"Elapsed time {0}\", sw.Elapsed.TotalSeconds.ToString());\n\
  \            Console.ReadLine();\n        }\n    }\n}\n```\n\n`GenerateInputData`\
  \ 方法返回一个包含 5 亿个整数的并行序列——也就是说，一个 `ParallelQuery<int>`。`Main` 方法调用了 `GenerateInputData`\
  \ 方法并将 5 亿个整数保留在 `inputIntegers` 中。然后，代码通过声明一个 PLINQ 查询来执行归约操作（即计算平均值），该查询会为每个过滤后的整数调用\
  \ `CalculateX` 方法。`CalculateX` 方法接收一个整数 `intNum`，并返回某些数学运算的结果，以消耗一些 CPU 时间处理数字。然而，此方法使用了一个不必要的\
  \ `lock` 在临界区中执行数学运算。这段错误的代码将帮助你理解与并发相关的非常重要的概念。\n\n按照以下步骤可视化列表 10-1 中所示应用程序的行为，以收集其详细信息：\n\
  \n1. 你希望应用程序在查询完成后立即结束，而不是等待按键。为了这一点，注释掉 `Main` 方法的最后两行：\n\n```csharp\n// Console.WriteLine(\"\
  Elapsed time {0}\", sw.Elapsed.TotalSeconds.ToString());\n// Console.ReadLine();\n\
  ```\n2. 选择 `分析` → `启动性能向导`。显示可用性能方法的对话框。选择`并发`单选按钮，然后勾选`可视化多线程行为`。然后点击`下一步`。\n\n\
  3. `性能向导`对话框显示创建新性能会话的信息。勾选显示的信息，确保勾选了`向导完成后启动性能分析`，然后点击`完成`。\n\n4. IDE 启动控制台并根据指定的性能方法收集数据。IDE\
  \ 显示如图 10-5 所示的消息。当应用程序执行完毕后，`输出`窗口指示收集的数据已写入跟踪文件，分析器开始处理该文件。在处理跟踪文件时，分析器加载先前的符号文件。跟踪分析完成后，`并发可视化`窗口将显示多线程应用程序的报告。\n\
  \n\n\n\n该应用程序的 CPU 利用率很高。然而，这并不是高效的代码，因为它使用了大量不必要的锁，这些锁消耗了无用的 CPU 周期。这是 CPU 利用率分析的问题之一：它可能会导致对并行算法产生错误的假设。该应用程序大部分时间都在消耗四个逻辑核心的\
  \ CPU 周期。然而，你希望并行算法既能提供性能又能保证正确性。并行优化是利用并行处理能力来缩短运行算法的总时间。你的主要目标是减少运行算法所需的时间。因此，在分析\
  \ CPU 利用率图时必须小心。你的主要目标不是为了生成一个漂亮的 CPU 利用率图而消耗不必要的 CPU 周期。在这种情况下，你已经知道该应用程序存在不锁。\n\
