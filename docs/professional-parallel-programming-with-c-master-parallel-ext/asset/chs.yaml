  \n## 工作站垃圾回收开销\n\n当循环或并行查询创建了过多随后被丢弃的临时对象时，应用程序可能会面临工作站回收（workstation-collection）开销场景。\n\
  \n示例 10-8 显示了一个创建了过多字符串的糟糕代码的控制台应用程序。这段代码并不是最佳实践，但在这里展示是为了演示当频繁发生垃圾回收并阻塞所有线程直到其完成时的一种常见模式。当然，你应该避免在循环或查询中创建不必要的临时对象。\n\
