  \            // 阻塞 UI 线程，直到\n            // 信号计数\n            _countdown.Wait();\n\
  \        }\n    }\n}\n```\n\n## 理解任务与线程池之间的关系\n\n当你创建一个新任务时，你通过任务并行库 (TPL) 使用 CLR\
  \ 线程池。作为参数发送的操作委托指定了必须在任务中运行的方法，该任务被分配给线程池中的一个线程。此任务被放入全局队列中，并以异步执行的方式运行。然而，线程池中分配给任务的每个线程除了单一全局队列外，都有自己的本地队列。本章解释了这些本地队列的用处。图\
  \ 8-12 显示了线程池的全局队列，第一个任务已添加到队列中并等待被分配给线程执行。请注意，每个工作线程都有自己的本地队列。\n\n当你创建并启动任务时，`Task.Factory.New`\
  \ 方法等同于调用 `ThreadPool` 的 `QueueWorkItem`，但它在底层线程池引擎上产生不同的结果。使用 `CountdownEvent`\
  \ 原语从线程切换到任务以等待任务完成是很容易。本章展示了使用 `CountdownEvent` 代替 `ThreadPool` 的应用程序版本。\n\n每当你点击“启动工作线程”按钮时，就会向线程池的全局队列添加新任务。每个操作委托执行时\
  \ `num` 参数将具有不同的值。图 8-13 显示了线程池的全局队列，两个任务已添加到队列中并等待执行。代码在 UI 线程（即主线程）的上下文中创建了这些任务。\n\
  \n\n\n\n\nCLR 线程池会注入许多空闲的工作线程，这些线程负责获取并开始执行队列中的每个任务。这通常按照先进先出（FIFO）的顺序进行，但无法保证特定的顺序。图\
  \ 8-14 显示了在具有空闲工作线程的线程池的两个不同线程中运行两个任务。获取任务执行的两个线程的本地队列是空闲的，因为在这些运行任务的范围内没有创建新任务。每当你点击“启动工作”（Launch\
  \ Worker）按钮时，代码都会在 UI 线程上下创建一个新任务，该任务将成为全局队列的一部分。\n\n图 8-14\n\n![8.14](img/c08f014.jpg)\n\
  \n当线程池的所有可用工作线程都已分配给任务时，添加到线程池全局队列的新任务将一直等待，直到工作线程变为可用。图 8-15 显示了分配给线程池三个不同线程的三个任务以及在全局队列中等待的四个任务。图\
  \ 8-16 显示了当工作线程 #1 完成任务 #1 的执行并获取队列中的第一个任务（任务 #4）进行执行时，全局队列是如何变化的。\n\n图 8-15\n\n\
  ![8.15](img/c08f015.jpg)\n\n图 8-16\n\n![8.16](img/c08f016.jpg)\n\n点击五次“启动工作”按钮，等待\
  \ 1 秒，然后使用“全部停止”（Break All）命令停止执行。因为你等待了 1 秒，许多任务将分配给由线程池引擎管理的工作线程。结果将根据你计算机上的可用逻辑核心数而异。通过选择“调试\
  \ → 窗口 → 线程”来显示线程窗口，网格将显示许多名称为“工作线程”（Worker Thread）且“位置”列中为 `DoSomeWork` 方法的线程。这些工作线程正在运行\
  \ `DoSomeWork` 方法的代码，该方法是由作为参数传递给 `Task.Factory.StartNew` 方法的委托委托所调用的。图 8-17 显示了五个正在运行\
  \ `DoSomeWork` 方法的工作线程。在线程池级别，结果与使用 `ThreadPool.QueueUserWorkItem` 方法的示例相似。\n\n\
  图 8-17\n\n![8.17](img/c08f017.jpg)\n\n当你在主线程或其他未分配给特定任务的线程上下文中创建并启动任务时，这些任务将竞争全局队列中的工作项。这些任务被称为顶层任务（top-level\
  \ tasks）。\n\n然而，当你在其他任务上下文中创建任务时，情况发生了变化，因为你可以利用本地队列带来的改进。\n\n## 理解本地队列和工作窃取算法\n\
  \n之前的示例表示了粗粒度并行的场景，其中代码创建了许多长时间运行顶层任务。列表 8-5 显示了 `DoSomeWork` 方法的新版本，该方法在运行此方法的顶层任务上下文中创建了三个嵌套任务。这是一个细粒度并行的示例。\n\
  \n![download](img/download.gif)\n\n列表 8-5： 启动使用本地队列的嵌套任务\n\n```csharp\nprivate void\
  \ DoSomeWorkAtZone(\n    int workerNum, \n    string zone)\n{\n    // 一些工作\n   \
  \ // 在 1 到 3 秒之间\n    var milliSecs =\n        new Random(\n            Thread.CurrentThread.ManagedThreadId).Next(\n\
  \                1000, 3000);\n    Debug.WriteLine(\n        \"Worker #{0} works\
  \ at {1}{2} seconds\",\n        workerNum,\n        zone,\n        milliSecs);\n\
  \    var sw = Stopwatch.Start();\n    // 一些 CPU 密集型工作\n    while (sw.Elapsed.Milliseconds\
  \ < milliSecs)\n    {\n        // 执行 CPU 密集型工作\n        double calc = Math.Pow(\n\
  \            Math.PI *\n            sw.Elapsed.Milliseconds, 2);\n    }\n}\n\nprivate\
  \ void DoSomeWork(int workerNum)\n{\n    var taskLeft =\n    new Task(() =>\n  \
  \  {\n        DoSomeWorkAtZone(\n            workerNum,\n            \"left\");\n\
  \    });\n    var taskCenter =\n    new Task(() =>\n    {\n        DoSomeWorkAtZone(\n\
  \            workerNum,\n            \"center\");\n    });\n    var taskRight =\n\
  \    new Task(() =>\n    {\n        DoSomeWorkAtZone(\n            workerNum,\n\
  \            \"right\");\n    });\n    taskLeft.Start();\n    taskCenter.Start();\n\
  \    taskRight.Start();\n    Task.WaitAll(\n        new[] { taskLeft,\n        \
  \    taskCenter,\n            taskRight });\n}\n```\n\n采用之前的 WFP 应用程序解决方案。添加新的 `DoSomeWorkAtZone`\
  \ 方法的代码，并用现有的 `DoSomeWork` 方法替换为 列表 8-5 所示的代码。\n\n新的 `DoSomeWork` 方法创建了以下三个完成较快的任务：\n\
  \n* `taskLeft`\n* `taskCenter`\n* `taskRight`\n\n然后，它启动上述每个任务，并通过调用 `Task.WaitAll`\
  \ 方法等待它们完成。每个任务都调用 `DoSomeWorkAtZone` 方法，并传入不同的 `zone` 参数值。\n\n该方法模拟了一些工作，以保持示例应用程序易于理解。\n\
  \n\n\n\n本地队列通常以 LIFO（后进先出）顺序获取待执行的任务，而不是全局队列所解释的 FIFO（先入先）顺序。LIFO 顺序通常有利于数据局部性，并在牺牲一定程度的公平性的代价下提高了性能。这意味着\
  \ LIFO 顺序对于任务的到达顺序来说是不公平的，但通常能提供性能收益。数据局部性意味着运行最后到达的任务所需的所需的必要数据访问成本很低。在大多数情况下，发送到本地队列的最后一个任务的数据仍然位于\
  \ CPU 缓存的任何层级中。由于数据在缓存中仍然是“热”的，立即执行最后一个任务可能会带来性能收益。在示例中，`taskRight` 通常在 `taskCenter`\
  \ 之前开始执行。以下行是点击 Launch Worker 按钮后出现在输出窗口的结果：\n\n```\nWorker #1 started \nWorker\
  \ #1 works at the right 2990 seconds\nWorker #1 works at the left 2035 seconds\n\
  Worker #1 works at the center 1080 seconds\nWorker #1 finished\n```\n\n在这种情况下，`taskRight`\
  \ 是三个嵌套任务中第一个开始执行的，这是 LIFO 顺序的一个示例。然而，请记住，尽管 LIFO 顺序是本地队列的典型选择，但无法保证线程池引擎会使用这种顺序。\n\
  \n为了帮助你理解工作窃取算法，图 8-19 展示了一个有趣的场景。首先，工作线程 #1 完成了其分配任务的执行。然后，工作线程 #1 进入其本地队列，但发现它是空的。于是，工作线程\
  \ #1 进入全局队列，但发现那里也是空的。\n\n图 8-19\n\n![8.19](img/c08f019.jpg)\n\n当另一个工作线程的本地队列中有许多等待处理的任务时，保持线程空闲并不是一个好主意。在这种情况下，工作线程\
  \ #1 进入另一个线程（工作线程 #2）的本地队列，窃取该队列中等待中的一个任务并执行它。图 8-20 显示了 `taskLeft` 是如何被工作线程 #1\
  \ 获取的。\n\n图 8-20\n\n![8.20](img/c08f020.jpg)\n\n该算法通常以 FIFO 顺序从其他本地队列中窃取任务。被窃取任务所需的数据在缓存中通常是“冷”的或完全不在缓存中。因此，提取旧的任务可以让较新的任务留在队列中并保持数据“热”状态，以便被能够利用这种数据局部性的最合适的工作线程获取。\n\
  \n![note](img/note.gif)\n\n当所需数据仍在缓存中但访问成本高昂时，称该数据为“缓存中冷”。相反，当所需数据仍在缓存中且访问成本低廉时，称该数据为“缓存中热”。\n\
  \n大多数典型的分治法场景的工作方式是上述工作窃取机制使用典型 FIFO 顺序的另一个原因。在这些场景中，旧的任务有更多机会产生更多的子工人（subworkers）——即嵌套或子任务。当这种情况发生时，额外的线程最终进入窃取了该任务的工作线程的本地队列，这减少了进一步窃取的需要，并利于数据局部性。\n\
  \n本地队列和工作窃取通常使得在细粒度并行场景下实现负载均衡成为可能。因此，你应该尽可能使用 TPL 提供的服务，而不是 `ThreadPool` 方法。\n\n\
  ![note](img/note.gif)\n\n子任务和嵌套任务都使用本地队列和工作窃取算法。如果你不想让特定任务被放入本地队列，可以指定 `TaskCreationOptions.PreferFairness`\
  \ 或 `TaskContinuationOptions.PreferFairness`。\n\n## 指定自定义任务调度器\n\n默认的 `TaskFactory`\
  \ 使用之前解释的调度技术来创建和调度任务。此默认调度器基于 CLR 4 线程池引擎。该调度器根据需要注入和退役线程，以便在许多异构场景下实现最大吞吐量。工作窃取算法提供了一种智能的负载均衡方案，并为大多数场景保证了良好的整体性能。然而，当你发现某个特定场景可以从特殊的任务调度方式中受益时，你可以为某些任务或并行循环创建并使用自定义的任务调度器。\n\
  \n你可以通过创建 `System.Threading.Tasks.TaskScheduler` 的子类并重写它的许多方法来创建一个自定义的任务调度器。`TaskScheduler`\
  \ 实例代表一个管理将任务队列到线程上的底层工作的对象。`TaskScheduler` 的工作并不简单；因此，除非你确定它能为你的特定场景提供收益，否则你不应该创建自定义调度器。\n\
  \n![note](img/note.gif)\n\n附录 C 介绍了 13 种 `TaskScheduler` 的实现，提供了多种类型的任务调度器。这些任务调度器不是生产级的，但它们由微软开发并是示例的一部分。如果你有特殊需求，在尝试创建自己的之前，应该先找出这些调度器中是否有适用于。\n\
  \n列表 6 显示了 `ThreadPerScheduler` 的代码，它是 `TaskScheduler` 的子类。该代码在 `System.Threading.Tasks.Schedulers`\
  \ 命名空间内定义了 `ThreadPerScheduler`。\n\n```\n// File: ThreadPerScheduler.cs\nusing System.Collections.Generic;\n\
  using System.Linq;\n\nnamespace System.Threading.Tasks.Schedulers\n{\n    public\
  \ class ThreadPerScheduler : TaskScheduler\n    {\n        protected override IEnumerable<Task>\
  \ GetScheduledTasks()\n        {\n            return Enumerable.Empty<Task>();\n\
  \        }\n\n        protected override void QueueTask(Task task)\n        {\n\
  \            new Thread(() => TryExecuteTask(task))\n            { IsBackground\
  \ = true }.Start();\n        }\n\n        protected override bool TryExecuteTaskInline(Task\
  \ task, bool taskWasPreviouslyQueued)\n        {\n            return TryExecuteTask(task);\n\
  \        }\n    }\n}\n```\n\n`ThreadPerScheduler` 在每次需要处理任务时都会启动一个新的线程。这样，调度器算法确保每个任务都在不同的线程中运行。该调度器既不使用本地队列也不使用工作窃取技术。\n\
  \n\n\n\n* `QueueTask` — 将作为参数接收的 `Task` 实例放入调度器队列中。由于此调度器不使用队列，该方法的实现创建了一个新的后台线程来执行作为参数接收的\
  \ `Task` 实例。该方法在新的线程中调用继承自 `TaskScheduler` 的 `TryExecuteTask` 方法。`TryExecuteTask`\
  \ 方法接收 `Task` 实例作为参数，并尝试在新线程的上下文中在此调度器上执行该 `Task` 实例。该新线程是一个后台线程，并在创建后立即启动。\n\n\
  * `TryExecuteTaskInLine` — 确定作为参数接收的 `Task` 实例是否可以在此调用中同步执行，如果是，则该方法将执行此 `Task`\
  \ 实例。该方法接收一个 `Boolean` 值作为第二个参数，指示 `Task` 实例之前是否已入队列。由于此调度器不使用队列，该方法的实现忽略第二个参数，并返回从当前线程调用继承自\
  \ `TaskScheduler` 的 `TryExecuteTask` 方法时得到的 `Boolean` 值。`TryExecuteTask` 方法接收 `Task`\
  \ 实例作为参数，并返回一个 `Boolean` 值，表示在当前线程上下文中是否可以执行此 `Task` 实例。\n\nListing 8-7 显示了 WPF\
  \ 应用程序新版本的代码，它使用自定义的 `ThreadPerTaskScheduler` 调度器在不同的线程中运行每个工作项。为了保持示例简单，新代码使用了之前版本的\
  \ `DoSomeWork` 方法，该方法通过执行一些数学运算来模拟几秒的 CPU 密集型工作。此版本没有创建额外的嵌套任务。\n\n![下载](img/download.gif)\n\
  \nListing 8-7: 使用自定义的调度器\n\nMainWindow.xaml.cs\n\n```csharp\nusing System;\nusing\
