  \ | 布尔值，表示是否已为该令牌请求了取消 |\n| WaitHandle | 与 `ancellationToken` 关联的 `WaitHandle` 实例，定义了传播取消的信号机制\
  \ |\n\n## TaskFactory\n\nListing 3-2 中的 `Main` 方法使用 `Task` 类的 `Factory` 属性来获取 `TaskFactory`\
