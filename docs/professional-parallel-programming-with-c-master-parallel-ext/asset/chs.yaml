  \ 方法应该检查状态并捕获 `AggregateException`，如前所述。\n\n### 自旋与让出切片\n\n上一个示例使用了 `SpinWait.SpinUntil`\
  \ 方法。你可以创建一个 `SpinWait` 实例并使用它的方法和属性来提供基本的自旋，并判断自旋是否会释放底层线程的时间片并启动上下文切换。`SpinWait`\
  \ 实例提供以下两个方法：\n\n- `Reset`：重置自旋计数器。这样，`Count` 属性将变为 0，即使没有调用 `SpinOnce`，它也会重新计数。\n\
  - `SpinOnce`：执行单次自旋。然而，在 `SpinWait` 实例执行了一定次数的自旋后，如果有必要，它将释放底层线程的时间片并启动上下文切换。因此，它的行为会根据执行的次数而改变。\n\
  \n`SpinWait` 实例暴露以下两个只读属性：\n\n- `Count`：提供 `SpinWait` 实例通过 `SpinOnce` 方法执行单次自旋的次数。\n\
  - `NextSpinWillYield`：提供一个 `bool` 值，指示通过 `SpinOnce` 方法进行的下一次自旋是否会释放底层线程的时间片并启动上下文切换。\n\
  \n![note](img/note.gif)\n\n`SpinWait` 设计并不是供多个任务或线程并发使用的。因此，如果多个任务或线程必须使用它的方法进行自旋，每个任务都应该使用自己的\
  \ `SpinWait` 实例。然而，由于其退避逻辑（back-off logic），你不希望在多个线程中使用它。\n\n以下行显示了 `ProduceSentences`\
