  \n无序字符串日志\n\n# 使用自旋锁 (Spin Locks)\n\n当锁的持续时间短短，某些情况下使用 `Monitor` 机制的开销很大。为了性能，可以使用\
  \ `SpinLock` 替代 `Monitor`。\n\ndownload\n\n```csharp\nstatic void Main(string[] args)\n\
  {\n    int participants = 3;\n    Barrier barrier = new Barrier(participants, (barrier)\
  \ =>\n    {\n        Console.WriteLine(\"Current phase: {0}\", barrier.PhaseNumber);\n\
  \    });\n    // 你希望牺牲公平性为性能\n    // 因此，你对 useBarrier 传递了 false\n    var sl = new\
  \ SpinLock(false);\n    var sb = new StringBuilder();\n    Task[] tasks = new Task[participants];\n\
  \    for (int i = 0; i < participants; i++)\n    {\n        tasks[i] = Task.Factory.StartNew((num)\
  \ =>\n        {\n            var participantNumber = (int)num;\n            for\
  \ (int j = 0; j < 10; j++)\n            {\n                CreatePlanets(participantNumber);\n\
  \                barrier.AndWait();\n                CreateStars(participantNumber);\n\
  \                barrier.AndWait();\n                CheckCollisionsPlanets(participantNumber);\n\
  \                barrier.AndWait();\n                CheckCollisionsStars(participantNumber);\n\
  \                barrier.AndWait();\n                RenderCollisions(participantNumber);\n\
  \                barrier.AndWait();\n                var logLine =\n           \
  \     String.Format(\"Time: {0}, Phase: {1}, Participant: {2}, Phase completed OK\\\
  n\",\n                    DateTime.Now.TimeOfDay,\n                    barrier.PhaseNumber,\n\
  \                    participantNumber);\n                bool lockTaken = false;\n\
  \                try\n                {\n                    sl.Enter(ref lockTaken);\n\
  \                    // SpinLock 获取了锁\n                    // 临界区域\n           \
  \         sb.Append(logLine);\n                    // 临界区域结束\n                }\n\
  \                finally\n                {\n                    // 你需要确保\n    \
  \                // 释放锁\n                    if (lockTaken)\n                  \
  \  {\n                        // 如果它确实获取了锁，则放弃锁\n                        // 你为了性能牺牲了公平性\n\
  \                        // 因此，你对 Exit 传递了 false\n                        sl.Exit(false);\n\
  \                    }\n                }\n            }\n        }, i);\n    }\n\
  \    var finalTask = Task.Factory.ContinueWhenAll(tasks, (tasks) =>\n    {\n   \
  \     // 等待所有任务完成，以确保\n        // 任何发生在任何 _tasks 中的\n        // 异常都被传播\n       \
  \ Task.WaitAll(tasks);\n        Console.WriteLine(\"所有阶段已执行完毕.\");\n        Console.WriteLine(sb);\n\
  \        // 释放 Barrier 实例\n        barrier.Dispose();\n    });\n    // 等待 finalTask\
  \ 完成\n    finalTask.Wait();\n    Console.ReadLine();\n}\n```\n\n代码片段来自 Snippet5_10\n\
  \n输出将等同于使用 `Monitor` 获取和释放锁的示例显示的结果。`StringBuilder` 实例的最终内容包含了临界区域中所有参与者的信息。\n\n\
  \n\n\n\n`SpinLock` 确保了临界区域将是序列化的，因此，在 `SpinLock` 获取到互斥锁后调用 `Append` 方法是安全的。每个参与者都将\
  \ `lockTaken` 布尔变量设置为 `false`，然后调用 `SpinLock sl` 实例的 `Enter` 方法，并将 `lockTaken` 以引用作为参数传递。`try…finally`\
  \ 块可以确保在发生问题时释放锁。此时，`Enter` 方法将尝试获取锁，如果无法获取，任务将在循环中等待，并反复检查锁是否变得可用。它将一直自旋（spin）直到它能够获取锁为止。一旦它获取了锁，`lockTaken`\
  \ 将变为 `true`，随后 `// Critical section` 之后的代码将执行。如果此时有其他任务调用了 `Enter` 方法，它们将开始自旋，直到正在运行临界区域的任务调用\
  \ `SpinLock sl` 实例的 `Exit` 方法来释放锁。因此，确保此方法始终被调用是非常重要的，即使在临界区域内发生异常也是如此。`finally`\
  \ 节中的代码会检查 `lockTaken` 是否为 `true`，只有在实际获取了锁的情况下才通过 `Exit` 方法释放锁。执行此行代码后，其他任务之一将能够获取锁并执行相同的序列。为了立即向其他线程发布退出操作，代码将\
  \ `false` 传递给 `Exit` 方法的参数，以表示不应发布内存屏（memory fence）。由于 `SpinLock` 不使用内存屏，你通过牺牲公平性来换取性能。\n\
  \n![download](img/download.gif)\n\n```cs\nbool lockTaken = false;\n\ntry\n{\n  \
  \  sl.Enter(ref lockTaken);\n    // SpinLock acquired a lock\n    // Critical section\n\
  \    sb.Append(logLine);\n    // End of critical section\n}\nfinally\n{\n    //\
  \ 你需要确保 \n    // 你释放了锁\n    if (lockTaken)\n    {\n        // 如果它实际获取了锁，则放弃锁\n \
  \       // 你想以牺牲公平性换取性能\n        // 因此，你为 useMemoryBarrier 传递了 false\n        sl.Exit(false);\n\
  \    }\n}\n```\n来自 Snippet5_11 的代码片段\n\n![note](img/note.gif)\n\n不要将 `SpinLock`\
  \ 声明为只读字段，因为这样做会导致对该字段的每次调用返回 `SpinLock` 的新副本而不是原始副本。所有对 `Enter` 方法的调用都会成功获取锁，导致受保护的临界区域没有按预期序列化。\n\
  \n## 使用超时\n\n正如你之前通过 `Monitor` 锁学习的那样，`SpinLock` 提供了在指定的超时时间内尝试获取锁的方法。你可以为 `SpinLock\
