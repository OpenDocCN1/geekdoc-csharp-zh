  \n![note](img/note.gif)\n\n上一个示例实现了一个并行生产者-消费者模式。你可以通过使用其他并发集合并添加一些协调数据结构来提高性能并减少开销。由于要实现更优的生产者-消费者模式需要学习许多主题，后续章节和章节将深入探讨以改进每个并行算法的所有必要主题。\n\
  \n### 与多个生产者和消费者协作\n\n使用 `ConcurrentQueue` 实现并行生产者-消费者模式或多阶段线性流水线是可能的。然而，衡量整体性能以及这些方案引入的延迟是非常重要的。在上一个示例中，生产者在具有预期并行密度的并行循环中运行代码。它包含了许多产生元素并将其添加到\
  \ `ConcurrentQueue` 的并发任务，以及一个从该队列中移除元素并处理它们的消费者。\n\n你也可以通过使用多个任务将消费者并行化。你不需要更改\
  \ `ConvertAESKeysToHex` 方法中的代码，因为它已经准备好执行一个原子操作：从 `ConcurrentQueue` 中移除一个 `_byteArraysQueue`\
  \ 项，并将每个处理过的元素添加到另一个 `ConcurrentQueue`（`_keysQueue`中。两个或多个独立的并发任务运行 `ConvertAESKeysToHex`\
  \ 方法可能会同时为 `ConcurrentQueue`（`_byteArraysQueue`）中的最后一个元素调用 `TryDequeue` 方法。这种情况可能会发生，是因为所有任务都同时满足了\
  \ `while` 条件。想象一下在此时，消费者已经完成了它的执行。由于 `ConcurrentQueue` 将每个 `TryDequeue` 方法的执行序列化为原子操作，其中一个任务将接收到移除的元素，且\
  \ `TryDequeue` 方法将返回 `true` 值。现在，队列中没有更多元素了，因为最后一个已经被之前解释的原子操作移除；因此，其他任务中的 `TryDequeue`\
  \ 方法将返回 `false`。结果是可预测的，消费者也是可扩展的，因为你可以根据需要并行运行多个消费者来优化整体性能。\n\n以下代码行显示了 `Main`\
