  ```\n\n来自 Snippet5_8 的代码片段\n\n此示例使执行 `SpinWait.SpinUntil` 方法的任务一直运行。事实上，该任务一直运行是为了能够对其他任务的超时情况进行测试，而这些任务想要获取锁，但那个正在自旋并等待的任务永远不会释放该锁。你已经知道当发生错误时如何添加代码来取消任务，以及如何添加清理代码。\n\
  \n![note](img/note.gif)\n\n尽可能情况下，你应该使用超时时间来避免难以检测的死锁情况。当无法在指定的时间内获取锁时，你可以使用 `CancellationToken`\
  \ 实例来取消导致问题的任务。添加必要的清理代码也是重要的。\n\n`Monitor` 类提供了以下三个额外方法，允许你向其他线程发送锁的通知，并阻塞线程直到它们重新获取锁。然而，在使用这些方法时必须非常小心，因为通知错误可能导致任务或线程永久阻塞。\n\
  \n* `Pulse` — 通知等待队列中调用 `Monitor.Wait`（以对象作为参数）的线程，其作为参数接收的对象的状态发生了变化。\n* `PulseAll`\
  \ — 通知等待队列中所有调用 `Monitor.Wait`（以对象作为参数）的线程，其作为参数接收的对象的状态发生了变化。\n* `Wait` — 释放作为参数的对象的锁，并阻塞当前线程直到其重新获取该锁。这只有在等待被脉冲触发后才会发生。`Wait`\
  \ 方法有许多重写，允许你定义超时时间，以避免线程无限等待重新获取锁。\n\n## 重构代码以避免锁\n\n你可以通过重构之前的示例来生成日志字符串而不创建临界区，从而避免使用锁。以下行显示了代码的新版本，它为每个参与者创建一个独立的字符串日志，并将其作为每个\
