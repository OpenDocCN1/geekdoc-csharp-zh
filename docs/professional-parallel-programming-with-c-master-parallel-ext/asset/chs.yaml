  \ Settings) | 显示位于调试（Debugging）→ 符号（Symbols）页面上的选项对话框。 |\n\n图 7-32 显示了 `Switch To\
  \ Frame` 的子菜单，它显示了方法上下文的八个堆栈帧。这八个方法上下文显示了 `range` 参数的值。这使能够能够定位任务中运行 `Parallel.ForEach`\
  \ 特定部分的代码。\n\n图 7-32\n\n![7.32](img/c07f032.jpg)\n\n当你需要调试由 `Parallel.ForEach` 方法创建的每个并行任务调用的\
  \ for 循环时，你希望逐步执行代码。然而，如果调试器在每次步入（Step Into）或逐过程（Step Over）之后从一个任务切换到另一个任务，这将很难。你可以暂停一个或多个并发任务的执行，以便将调试会的一部分集中在一个或多个任务上。按照以下步骤暂停所有支持执行某些任务的线程：\n\
  \n1. 转到`并行任务 (Parallel Tasks)` 窗口并选择由 `Parallel.ForEach` 方法创建的任务之一。右键点击它，并在键菜单中选择`冻结此以外的所有线程\
  \ (Freeze All Threads But This)`。此选项会挂起分配给不同所选任务的所有线程的执行。分配给冻结线程的任务将在 `Parallel\
  \ Tasks` 窗口的第二列中带有蓝色的暂停图标显示。`线程 (Threads)` 窗口将显示支持这些任务执行的冻结线程，在第二列也带有相同的蓝色暂停图标。图\
  \ 7-33 显示了 `Parallel Tasks` 窗口和 `Threads` 窗口，由于冻结线程，许多行出现了蓝色暂停图标。\n\n图 7-33\n\n\
  ![7.33](img/c07f033.jpg)\n\n2. 在 `Parallel Tasks` 窗口中双击未冻结的任务，代码窗口将显示其下一个语句。\n\n\
  3. 逐过程。当前语句将运行，下一个语句将按顺序移动到下一行，因为当前任务是唯一正在运行的任务。其他任务在你解冻（Thaw）分配支持其执行的线程之前将保持挂起。这使你能够单独运行并逐步调试方法。该方法像单线程代码一样以顺序执行运行。\n\
  \n![note](img/note.gif)\n\n当你通过只运行一个任务并冻结分配支持其他任务执行的线程来调试代码时，你必须考虑代码运行的结果在其他任务并发运行时可能会有所不同。当你冻结线程时，你限制了并发运行的代码。\n\
  \n4. 多次逐过程以逐步检查执行。\n\n5. 转到 `Parallel Tasks` 窗口并选择由 `Parallel.ForEach` 方法创建的显示为蓝色暂停图标冻结的任务之一。通过双击它切换到该任务，然后右键点击并在键菜单中选择`解冻分配的线程\
  \ (Thaw Assigned Thread)`。该任务的蓝色暂停图标将消失。再次右键点击此任务并在键菜单中选择`冻结此以外的所有线程`。支持你正在调试的活动任务执行的线程将被冻结，而支持新所选任务执行的线程将恢复执行。图\
  \ 7-34 显示了新当前任务的下一个语句，以及由于冻结线程导致 `Parallel Tasks` 窗口中许多行出现蓝色暂停图标。\n\n图 7-34\n\n\
  ![7.34](img/c07f034.jpg)![note](img/note.gif)\n\n要恢复单个任务的执行，在 `Parallel Tasks` 窗口中右键点击它，并在键菜单中选择`解冻分配的线程`。要挂起单个任务的执行，在\
  \ `Parallel Tasks` 窗口中右键点击它并在键菜单中选择`冻结分配的线程`。你可以在右键点击之前在 `Parallel Tasks` 窗口中选择多行对对多个任务执行这些操作。\n\
  \n你也可以在 `Threads` 窗口中冻结和解冻线程，但当你想要挂起或恢复分配给任务的线程执行时，需要检查`线程分配 (Thread Assignment)`\
  \ 列中的信息。当你在 `Threads` 窗口中右键点击线程时，键菜单会根据线程状态提供`冻结`或`解冻`选项。\n\n## 调试匿名方法\n\n当你处理并行化代码时，你需要定义操作和委托。Lambda\
  \ 表达式和匿名方法简化了代码，但增加了调试的复杂性。当代码使用 Lambda 表达式时，自动生成的方法名会出现在堆栈帧中、`Parallel Tasks` 窗口的`Location`\
  \ 和 `Task` 列中，以及 `Threads` 窗口的`Location` 列中。然而，在源代码中找不到这些自动生成的方法名。\n\n按照以下步骤在调试时跟踪匿名方法：\n\
  \n1. 转到 `Parallel Tasks` 窗口，选择所有任务，右键点击并选择`解冻分配的线程`。冻结所有线程。\n\n2. 转到 `Threads` 窗口，选择所有线程，右键点击并选择`冻结所有线程`。\n\
