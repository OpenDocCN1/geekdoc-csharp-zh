  \ Server GC 专用线程都为每个可用逻辑核心分配了适当的线程亲和性设置。当需要或触发收集时，Server GC 仍然会阻塞活动线程。然而，Server\
  \ GC 完成收集过程所需的时间更短，并随着核心数的增加而提高了扩展性。\n\n## 使用 Server 垃圾回收器\n\n如果你想为应用程序启用 Server\
