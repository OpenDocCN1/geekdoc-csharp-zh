  ## 并行的便利性\n\n有时，并行并不是优化算法的最佳选择。只有当并行与顺序执行相比能带来显著的性能提升时，它才有意义。判断并行是否方便并没有银弹，这取决于功能和性能需求。例如，如果一个并行算法减少了\
  \ 30% 的执行时间，而其顺序版本只需要几秒钟，那么这种改进是不足道的。但是，如果你在一个需要运行 18 小时的批处理任务中实现了同样的改进，使其可以在 13\
  \ 小时内完成，那么这样做非常有意义。\n\n你可以考虑并行执行额外的功能来改进应用程序。可以通过异步任务和线程设计解决方案，对用户做出更好的响应。\n\n并行编程比传统的顺序编程更复杂。然而，一旦你开始基于任务的设计并编写并行代码，就很难避免思考并行了。\n\
  \n\n\n\n*   你可以将算法拆分为并行任务，以利用多个硬件线程。\n*   你可以使用更简单、高效的轻量级并发模型。\n*   你可以改进设计，以避免阿姆达尔（Amdahl's\
  \ Law）所解释的扩展性限制。\n*   你可以考虑古尔夫森法则（Gustafson's Law）。\n*   你必须尽量减少扩展性的临界区域。\n*   你在设计时必须考虑并发、交错并发和并行。\n\
  *   你必须考虑并行代码所需的开销。\n*   在 NUMA 架构中，可能会遇到意外的性能问题。\n*   在编写并行代码时，必须考虑目前所学的关于现代硬件架构的所有知识。\n\
  \n# 第 2 章：命令式数据并行\n\n## 本章内容概览\n\n*   理解纯数据并行问题\n*   启动并行任务\n*   理解并行与并发之间的区别\n\
  *   使用 `Parallel.For` 和 `Parallel.ForEach` 将循环重构为并行运行\n*   使用不同的技术在并行循环中划分输入数据\n\
  *   控制并行循环\n*   将现有的顺序代码转换为并行代码\n*   测量并行代码提供的加速效果和扩展性\n*   处理不同程度的并行\n\nVisual\
  \ C# 2010 (C# 4.0) 和 .NET Framework 4 提供了应对多核和许多核复杂性的精彩特性。然而，由于它们包含了全新的特性，程序员和架构师必须学习新的编程模型。\n\
  \n本章介绍了一些新的类、结构和枚举，它们允许你处理数据并行场景。本章并没有关注与并行编程相关的最复杂的问题，而是向你展示如何创建并行代码并描述与每个场景相关的新概念。这样，你将更充分地理解性能的。\n\
  \n# 启动并行任务\n\n在之前的 .NET Framework 版本中，很难开发充分利用多核微处理器的应用程序。需要使用复杂的结构来启动、控制、管理和同步多个线程，这些结构可以处理某些并发，但无法适用于多核系统。\n\
  \n.NET Framework 4 引入了新的任务并行库（TPL），它诞生于多核时代，并准备与第 1 章“基于任务的编程”中解释的新量级并发模型配合。\n\n\
  ### 支持数据并行、任务并行和流水线\n\n`TPL` 提供了一个轻量级框架，使开发者能够处理不同的并行场景，实现基于任务的设计，而不是使用重量级且复杂的线程。这些场景包括：\n\
  \n*   **数据并行** —— 有大量数据，并且必须对每部分数据执行相同的操作，如图 2-1 所示。例如，使用带有 256 位密钥的高级加密标准（AES）算法对\
  \ 100 个 Unicode 字符串加密。\n\n图 2-1\n\n![2.1](img/c02f001.jpg)\n\n*   **任务并行** —— 有许多可以并发运行的不同操作，利用并行性，如图\
  \ 2-2 所示。例如，为文件生成哈希值、加密 Unicode 字符串以及创建图像的缩略图表示。\n\n图 2-2\n\n![2.2](img/c02f002.jpg)\n\
  \n*   **流水线** —— 这是任务并行和数据并行的混合，如图 2-3 所示。这是最复杂的场景，因为它始终需要多个并发专用任务之间的协调。例如，使用带有\
  \ 256 位密钥的 AES 算法对 100 个 Unicode 字符串进行加密，然后为每个加密后的字符串生成哈希值。该流水线可以通过运行两个并发任务来实现：加密和哈希值生成。每个加密后的\
  \ Unicode 字符串将按顺序进入队列，由哈希值生成算法处理。\n\n图 2-3\n\n![2.3](img/c02f003.jpg)\n\n还有将上述场景相结合的混合场景。理解如何处理并行任务的最简单方法就是直接使用它们。后续章节将通过详细示例涵盖最常见的场景。\n\
  \n## System.Threading.Tasks.Parallel 类\n\n`TPL` 引入了一个新的命名空间 `System.Threading.Tasks`。它提供了对\
  \ .NET Framework 4 中引入的类、结构和枚举的访问。因此，当你想要使用 `TPL` 时，使用此命名空间是个主意：\n\n![download](img/download.gif)\n\
  \n```csharp\nusing System.Threading.Tasks;\n```\n\n代码片段是 Snippet2_1\n\n通过这种方式，你可以避免大量的引用。例如，与其编写\
  \ `System.Threading.Tasks.Parallel.Invoke`，不如编写 `Parallel.Invoke`。为了简化起，本章中的代码片段假设正在使用\
  \ `Parallel.Invoke` 指令。\n\n主类是 `Task`，它代表一个异步和并发操作。然而，并没有必要直接与 `Task` 实例工作。有时，最好的选择是创建并行循环。在这种情况下，你可以使用\
  \ `Parallel` 类（`System.Threading.Tasks.Parallel`）提供的以下方法：\n\n*   `Parallel.For`\
  \ —— 提供固定次数迭代的负载均衡执行![note](img/note.gif) 负载均衡将尝试分发工作，以保持所有任务忙碌状态。它试图减少空闲时间。\n*\
  \   `Parallel.ForEach` —— 提供固定次数迭代的负载均衡执行。该方法支持分区，允许你对数据进行完全控制。\n*   `Parallel.Invoke`\
  \ —— 提供提供的操作的并行执行。\n\n这些方法在重构现有代码以利用潜在并行性时非常有用。然而，非常重要的是要理解这并不是简单地将 `for` 语句替换为它。\n\
  \n## Parallel.Invoke\n\n尝试并行运行多个方法的最简单方法是使用 `Parallel` 类提供的新 `Invoke` 方法。例如，假设你有以下执行格式转换的独立方法，并且你确定并发运行它们安全的：\n\
  \n*   `ConvertEllipses`\n*   `ConvertRectangles`\n*   `ConvertLines`\n*   `ConvertText`\n\
  \n你可以使用以下行启动这些无参数且返回 `void` 的方法，并利用潜在并行性：\n\n![download](img/download.gif)\n\n```csharp\n\
  Parallel.Invoke(ConvertEllipses,\n                ConvertRectangles,\n         \
  \       ConvertLines,\n                ConvertText);\n```\n\n在在这种情况下，代码将创建一个指向每个方法的委托。`Invoke`\
  \ 方法的定义接收一个 `Action`（`System.Action[]`）参数数组进行并行执行。\n\n使用 Lambda 表达式运行方法可以产生相同的结果：\n\
  \n![download](img/download.gif)\n\n```csharp\nParallel.Invoke(() => ConvertEllipses(),\n\
  \                () => ConvertRectangles(),\n                () => ConvertLines(),\n\
  \                () => ConvertText());\n```\n\n代码片段是 Snippet2_2\n\n你也可以使用 Lambda\
  \ 表达式和匿名委托来运行方法，如下代码示例所示：\n\n![download](img/download.gif)\n\n```csharp\nParallel.Invoke(\n\
  \    () =>\n    {\n        ConvertEllipses();\n        // 执行其他事情添加更多行\n    },\n\
  \    () =>\n```\n\n\n\n\n\n```csharp\n        ConvertRectangles();\n\n        //\
  \ Do something else adding more lines\n\n    },\n\n    delegate()\n\n    {\n   \
  \     ConvertLines();\n        // Do something else adding more lines\n\n    },\n\
  \n    delegate()\n\n    {\n        ConvertText();\n});\n```\n代码片段为 `Snippet2_3`\n\
  \n![note](img/note.gif)\n\n使用 lambda 表达式或匿名委托的一个巨大优势是，它们允许你定义复杂的复杂的多行方法并并行运行，而无需创建额外的方法。如果你打算使用\
  \ TPL 进行并行编程，那么掌握委托（delegates）和 lambda 表达式是非常重要的。\n\n### 没有特定的执行顺序\n\n以下解释适用于之前展示的任何代码列表。`Parallel.Invoke`\
  \ 方法在之前显示的任何代码列表中的四个方法中的每一个都完成之前，它将不会返回。然而，即使发生异常，执行也可能完成。\n\n该方法将尝试并发启动这四个方法，利用由一个或多个物理微处理器提供的多个逻辑核心。然而，它们的实际并发执行将取决于许多因素。在这种情况下，这里有四个方法。这意味着\
  \ `Parallel.Invoke` 至少需要四个可用的逻辑核心才能并发运行这四个方法。逻辑核心（也称为硬件线程）在第 1 章中进行了解释。记住，理解运行你并行代码的新多核硬件是非常重要的。\n\
  \n拥有四个逻辑核心并不能保证四个方法会同时启动。如果一个或多个核心太忙，底层的调度逻辑可能会延迟某些提供的方法的初始执行。要对执行顺序做出准确预测非常困难，因为底层逻辑将尝试根据运行时的可用资源创建合适的执行计划。\n\
  \n图 2-4 显示了仅根据不同的硬件配置或多样化的工作负载可能发生的几种可能的并发执行场景中的三种。请注意，相同的代码不需要固定的时间来运行；因此，`ConvertText`\
  \ 方法花费的时间可能比 `ConvertLines` 方法更长，即使使用相同的硬件配置和输入数据流。\n\n图 2-4\n\n![3.1](img/c02f004.jpg)\n\
  \n第一张图表示一种几乎理想的情况：四个方法并行运行。考虑调度并发任务所需的时间是非常重要的，这会给总时间增加一个初始开销。\n\n第二张图显示了不同的场景。只有两条并发通道，而有四个方法要运行。在一条通道上，当\
  \ `ConvertEllipses` 完成时，`ConvertRectangles` 开始。在另一条通道上，当 `ConvertLines` 完成时，`ConvertText`\
  \ 开始。`Parallel.Invoke` 所有方法所需的时间比之前的场景更长。\n\n第三张图显示了另一个具有三个并发通道的场景。然而，它花费的时间与第二张图几乎相同，因为在这种情况下，`ConvertLines`\
  \ 方法运行的时间更多。因此，`Parallel.Invoke` 运行所有方法的时间与之前的场景几乎相同，即使使用了一个额外的并行通道。\n\n![note](img/note.gif)\n\
  \n使用 `Parallel.Invoke` 并发运行的代码不能依赖于特定的执行顺序。如果你有需要特定执行顺序的并发代码，可以使用 TPL 提供的其他机制。我将在本章稍后部分详细介绍它们，并在后续章节中通过许多高级主题进行讨论。\n\
  \n如果你在具有至少两个物理核心的计算机上多次运行 示例 2-1 所示的控制台应用程序，将很容易理解执行顺序问题。\n\n![download](img/download.gif)\n\
  \n示例 2-1: 显示带有 Parallel.Invoke 的并发代码的执行顺序问题的简单控制台应用程序\n```csharp\nusing System;\n\
  using System.Collections.Generic;\nusing System.Linq;\nusing System.Text;\nusing\
  \ System.Threading.Tasks;\nnamespace Listing2-1\n{\n    class Program\n    {\n \
  \       static void Main(string[] args)\n        {\n            Parallel.Invoke(\n\
  \                () => ConvertEllipses(),\n                () => ConvertRectangles(),\n\
  \                () => ConvertLines(),\n                () => ConvertText());\n\
  \            Console.ReadLine();\n        }\n        static void ConvertEllipses()\n\
  \        {\n            Console.WriteLine(\"Ellipses converted.\");\n        }\n\
  \        static void ConvertRectangles()\n        {\n            Console.WriteLine(\"\
  Rectangles converted.\");\n        }\n        static void ConvertLines()\n     \
  \   {\n            Console.WriteLine(\"Lines converted.\");\n        }\n       \
  \ static void ConvertText()\n        {\n            Console.WriteLine(\"Text converted.\"\
  );\n        }\n    }\n}\n```\n\n例如，考虑以下 `Parallel.Invoke` 行的顺序代码版本：\n\n![download](img/download.gif)\n\
  ```csharp\nConvertEllipses();\nConvertRectangles();\nConvertLines();\nConvertText();\n\
  ```\n代码片段为 `Snippet2_4`\n\n写入输出控制台的结果在多核计算机上将是相同的，如下所示，因为执行顺序完全相同：\nEllipses converted.\n\
  Rectangles converted.\nLines converted.\nText converted.\n\n然而，如果你运行 `Parallel.Invoke`\
  \ 版本，结果将是不同的，即使在相同的硬件配置下。列表 22 显示了在同一台多核计算机上运行多次的结果。输出中对应于执行顺序的行已高亮。\n\n![download](img/download.gif)\n\
  \n列表 2-2: 在同一台多核计算机上多次运行 示例 2-1 所示相同并发代码的结果\n\n第一次：\nEllipses converted.\nRectangles\
  \ converted.\nLines converted.\nText converted.\n\n第二次：\nEllipses converted.\nLines\
  \ converted.\nRectangles converted.\nText converted.\n\n第三次：\nEllipses converted.\n\
  Lines converted.\nText converted.\nRectangles converted.\n\n第一次，此并发代码产生与顺序版本相同的输出。然而，第二次和第三次，执行顺序是不同的。例如，第三次，矩形输出是最后出现的，而不是第二个。这个简单的例子说明了顺序和并发代码之间的区别之一。\n\
  \n### 优势与权衡\n\n使用 `Parallel.Invoke` 的关键优势是它提供了一种简单运行许多方法并行的方法，而无需担心任务或线程。然而，它并不适用于所有场景。`Parallel.Invoke`\
  \ 有许多权衡，包括以下内容：\n\n- 如果用它来启动运行时间差异很大的方法，它需要最长的时间来返回控制。这可能导致许多逻辑核心空闲很长时间。因此，衡量使用该方法的结果、实现的加速比以及逻辑核心的使用情况是非常重要的。\n\
  \n- 它限制了并行可扩展性，因为它调用了固定数量的委托。在之前的示例中，如果你在具有 16 个逻辑核心的计算机上运行它，它将只会并行启动四个方法。因此，12\
  \ 个逻辑核心可能保持空闲。\n\n- 每次调用此方法在运行潜在的并行方法之前都会增加额外的开销。\n\n\n\n\n\n*   与任何并行化代码一样，不同方法之间的依赖关系或不受控制的交互可能会导致难以检测的并发\
  \ bug 和意想不到的副作用。然而，这种权衡适用于任何并发代码，而不仅仅是使用 `Parallel.Invoke` 产生的问题。本书将帮助你找到解决大多数此类问题的机制。\n\
  \n*   对于方法的执行顺序不提供任何保证；因此，`Parallel.Invoke` 不适用于运行需要特定并发执行计划的复杂算法。\n\n*   任何使用不同并行执行计划启动的委托都可能抛出异常；因此，捕获和处理这些异常的代码比传统的顺序异常处理代码更复杂。\n\
  \n![note](img/note.gif)\n\n上述权衡适用于示例中所解释的 `Parallel.Invoke` 的使用。然而，可以结合不同的机制来解决许多此类权衡。你将在本章以及本书的其余部分学习其中许多机制。\n\
  \n### 交错并发与并发\n\n正如你在上一个示例中看到的，并且如图 2-5 所示，交错并发与并发是不同的概念。\n\n图 2-5\n\n![3.1](img/c02f005.jpg)\n\
  \n交错并发意味着代码的不同部分可以在重叠的时间段内启动、运行并完成。即使在只有一个逻辑核心的计算机上也会发生交错并发。当许多代码部分在单逻辑核心计算机上运行交错并发时，时间分片机制和快速上下文切换可以提供并行执行的印象。然而，在这种硬件上，运行许多交错并发的部分比单独运行单个部分需要更多时间，因为并发代码正在竞争硬件资源，如之前的图形所示。你可以将交错并发视为许多汽车共用一条车道。这就是为什么交错并发也被定义为虚拟并行的形式。\n\
  \n并发意味着代码的不同部分可以同时运行，利用底层硬件中真实的并行处理能力，正如第 1 章所示。并发在只有单个逻辑核心的计算机上无法发生。你需要至少两个逻辑核心来运行并行代码。当发生真实的并行时，你可以获得加速，因为并行运行的许多代码部分可以缩短完成某些算法所需的总时间。之前的图形提供了以下潜在的并行场景：\n\
  \n*   并发；在四个逻辑核心（四条车道）上的完美并行—— 在这种理想情况下，四个方法的每个指令都运行在不同的逻辑核心上。\n\n*   交错并发与并发的结合；使用四个方法但仅利用两个逻辑核心（两条车道）的不完美并行——\
  \ 有时，四个方法的每个指令在不同的逻辑核心上并行运行，而有时它们必须等待自己的时间分片。在这种情况下，并发与并行结合在一起。这是最常见的情况，因为即使在实时操作系统\
  \ (RTOS) 上，实现完美并行也是非常困难。\n\n![note](img/note.gif)\n\n当某些代码部分在完全相同运行时，可能会出现新的 bug。幸运的是，TPL\
  \ 提供了许多结构和调试功能，可以帮助你避免许多并行噩梦。你将能够在本章中学到的关于命令式任务并行的所有知识与后续章节解释的额外机制相结合，以应对并行编程带来的挑战。\n\
  \n# 将顺序代码转换为并行代码\n\n在过去的十年里，大多数 C# 代码是使用顺序和同步执行的方法编写的。因此，许多算法在设计时既没有考虑并发也没有考虑并行。大多数时候，你找不到可以完全转换为全并行化且完美可扩展代码的算法。（这可能发生，但不是最常见的情况。）\n\
  \n当你拥有顺序代码并想要利用潜在的并行性来实现加速时，你必须找到可并化的热点（hotspots）。然后，你可以将其转换为并行代码，测量加速效果，识别潜在的可扩展性，并确保在将现有顺序代码转换为并行代码时没有引入新的\
  \ bug。\n\n![note](img/note.gif)\n\n热点是运行耗费大量时间的代码，是算法性能的瓶颈。如果一个可并化的热点被拆分为许多并行运行的部分，就可以实现加速。然而，必须能够将代码分成不同的部分（至少两个），以便利用潜在的并行性。如果代码部分运行不需要大量时间，TPL\
  \ 引入的开销可能会将加速降低为零，甚至让并行代码运行比顺序版本更慢。一旦你开始使用 TPL 提供的不同选项，你就能检测顺序代码中可并化的热点。\n\n## 检测可并化的热点\n\
  \nListing 2-3 是一个简单的控制台应用程序示例，它运行以下两个顺序方法：\n\n*   `GenerateAESKeys` — 它运行一个 for\
  \ 循环来生成由 `NUM_AES_KEYS` 常量指定的数量 AES 密钥。它使用 `System.Security.Cryptography.AesManaged`\
  \ 类提供的 `GenerateKey` 方法。一旦生成密钥，它将 `Byte` 数组转换为十六进制字符串表示 (`ConvertToHexString`) 的结果存储在\
  \ `hexString` 变量中。\n*   `GenerateMD5Hashes` — 它运行一个 for 循环使用 `NUM_MD5_HASH` 常量指定的\
  \ MD5 算法计算多个哈希。它使用参数调用 `System.Security.Cryptography.MD5` 类提供的 `ComputeHash` 方法。一旦生成哈希，它将字节数组转换为十六进制字符串的结果存储。\n\
  \n```csharp\nusing System;\nusing System.Collections.Generic;\nusing System.Linq;\n\
  using System.Text;\nusing System.Diagnostics;\nusing System.Security.Cryptography;\n\
  using System.Tasks;\n\nnamespace Listing23\n{\n    class Program\n    {\n      \
  \  const int NUM_AES_KEYS = 8000;\n        const int NUM_MD5_HASH = 1000;\n\n  \
  \      static string ConvertToHexString(byte[] byteArray)\n        {\n         \
  \   // Convert the byte array to hexadecimal string\n            var sb = new StringBuilder(byteArray.Length);\n\
  \            for (int i = 0; i < byteArray.Length; i++)\n            {\n       \
  \         sb.Append(byteArray[i].ToString(\"X2\"));\n            }\n           \
  \ return sb.ToString();\n        }\n\n        static void GenerateAESKeys()\n  \
  \      {\n            var sw = Stopwatch.StartNew();\n            var aesM = new\
  \ AesManaged();\n            for (int i = 1; i <= NUM_AES_KEYS; i++)\n         \
  \   {\n                aesM.GenerateKey();\n                byte[] result = aesM.Key;\n\
  \                string hexString = ConvertToHexString(result);\n              \
  \  // Console.WriteLine(\"AES KEY: {0} \", hexString);\n            }\n        \
  \    Debug.WriteLine(\"AES: \" + sw.Elapsed.ToString());\n        }\n    }\n}\n\
  ```\n\n\n\n\n\n```csharp\nprivate static void GenerateMD5Hashes()\n{\n    var sw\
  \ = Stopwatch.StartNew();\n    var md5M = MD5.Create();\n    for (int i = 1; i <=\
  \ NUM_MD5_HASHES; i++)\n    {\n        byte[] data =\n            Encoding.Unicode.GetBytes(\n\
  \                Environment.UserName + i.ToString());\n        byte[] result =\
  \ md5M.ComputeHash(data);\n        string hexString = ConvertToHexString(result);\n\
  \        // Console.WriteLine(\"MD5 HASH: {0}\", hexString);\n    }\n    Debug.WriteLine(\"\
  MD5: \" + sw.Elapsed.ToString());\n}\nstatic void Main(string[] args)\n{\n    var\
  \ sw = Stopwatch.StartNew();\n    GenerateAESKeys();\n    GenerateMD5Hashes();\n\
  \    Debug.WriteLine(sw.Elapsed.ToString());\n    // Display the results and wait\
  \ for the user to press a key\n    Console.ReadLine();\n}\n```\n\n`GenerateAESKeys`\
  \ 方法中的 for 循环没有在代码中使用其控制变量（`i`），因为它仅仅用于控制生成随机 AES 的次数。然而，`GenerateMD5Hashes` 方法中的\
  \ for 循环使用了其控制变量（`i`）为计算机用户名添加一个数字。然后，它将此字符串作为输入数据调用计算哈希的方法，如下面代码所示：\n\n![download](img/download.gif)\n\
  \n```csharp\nfor (int i = 1; i <= NUM_MD5_HASHES; i++)\n{\n    byte[] data = Encoding.Unicode.GetBytes(Environment.UserName\
  \ + i.ToString());\n    byte[] result = md5M.ComputeHash(data);\n    string hexString\
  \ = ConvertToHexString(result);\n    // Console.WriteLine(hexString);\n}\n```\n\n\
  代码片段是 Listing 2-3。\n\nListing 2-3 中高亮的代码行是用于测量运行每个方法所需的时间以及总耗时的代码。它在每个方法的开始处启动一个新的\
  \ `Stopwatch` 并调用其 `StartNew` 方法，然后将经过的时间写入 `Debug` 输出。\n\nListing 2-3 也显示了被注释掉的写入生成的密钥和哈希的代码，因为这些向控制台发送字符串的操作会扭曲时间测量。\n\
  \nFigure 2-6 显示了该应用程序的顺序执行流，以及在具有双核微处理器的特定计算机上运行两个方法之一所需的时间。\n\nFigure 2-6![3.1](img/c02f006.jpg)\n\
  \n`GenerateAESKeys` 和 `GenerateMD5Hashes` 大约需要 14 秒来运行。第一个花费 8 秒，后者花费 6 秒。当然，这些时间会根据底层硬件发生巨大变化。这两个方法之间没有交互；因此，它们是完全独立的。由于方法是顺序执行的，它们没有利用额外核心提供的并行处理能力。因此，这两个方法代表了一个明显的的热点，在该热点中，并行化可以帮助比顺序执行显著的加速。例如，你可以使用\
  \ `Parallel.Invoke` 同时运行这两个方法。\n\n## 测量并行执行实现的加速\n\n将 Listing 2-3 所示的 `Main` 方法替换为以下新版本，该版本使用\
  \ `Parallel.Invoke` 并并行启动 `GenerateAESKeys` 和 `GenerateMD5Hashes`：\n\n![download](img/download.gif)\n\
  \n```csharp\nstatic void Main(string[] args)\n{\n    var sw = Stopwatch.StartNew();\n\
  \    Parallel.Invoke(\n        () => GenerateAESKeys(),\n        () => GenerateMD5Hashes()\n\
  \    );\n    Debug.WriteLine(sw.Elapsed.ToString());\n    // Display the results\
  \ and wait for the user to press a key\n    Console.WriteLine(\"Finished!\");\n\
  \    Console.ReadLine();\n}\n```\n\n代码片段是 Listing2_3_withParallelInvoke。\n\nFigure\
  \ 2-7 显示了该应用程序新版本的并行执行流，以及在具有双核微处理器的特定计算机上运行两个方法之一所需的时间。\n\nFigure 2-7![3.1](img/c02f007.jpg)\n\
  \n现在，`GenerateAESKeys` 和 `GenerateMD5Hashes` 大约需要 9 秒来运行，因为它们利用了微处理器提供的两个核心。因此，你可以使用以下公式计算实现的加速：\n\
  \n`Speedup = (顺序执行时间) / (并行执行时间)`\n\n在此例中，计算结果为：14 / 9 = 1.56 倍。\n\n你可以看到，`GenerateAESKeys`\
  \ 运行比 `GenerateMD5` 慢（花费 9 秒）。然而，`Parallel.Invoke` 只需 3 秒即可完成，该应用程序利用了一个核心。Figure\
  \ 2-8![3.1](img/c02f008.jpg) 如果此应用程序在具有四核微处理器的计算机上运行，加速将与顺序版本非常接近。因此，该应用程序利用了两个核心。在这个例中，通过并行化某些代码可以获得更好的加速效果。note\
  \ 无需初始化 TPL 即可工作，TPL 已经处理了调度。\n\n## 理解并行执行\n\n接下来，取消 `GenerateAESKeys` 和 `GenerateMD5`\
  \ 中写入控制台的行：\n\n*   `Console.WriteLine(\"AES KEY: {0}\")`\n*   `Console.WriteLine(\"\
  MD5 HASH: {0}\")`\n\n写入控制台会产生瓶颈。Listing 2-4 显示了该应用程序生成的示例输出。AES 密钥生成 800,000 个，MD5\
  \ 哈希生成 100,000 个。Listing 2-4 显示了 AES 密钥。\n\n\n\n\nAES KEY: 26C2EB68720236CC15C2426378108BDAB0F6C29931930C864A692AE4D6BE62FC\n\
