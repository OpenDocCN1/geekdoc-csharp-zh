  \ | 任务将运行很长时间；因此，调度器可以将其作为粗粒度操作来处理。如果任务可能运行很多秒钟，则可以使用此选项。相反，当任务运行时间少于 1 秒时，不应使用此选项。\
  \ |\n| `TaskCreationOptions.PreferFairness` | 此选项告诉调度器，较早调度的任务更有可能较早执行，反之亦然。 |\n\
  \n![note](img/note.gif)\n\n你可以使用位运算来组合多个值。\n\n## 使用延续（Continuations）链接多个任务\n\n上一个案例是链式任务的示例。任务\
  \ `t1` 生成一个结果，而 `t2` 需要该结果作为输入以开始处理。在这种情况下，与其添加许多行来检查前一个任务是否成功完成并然后调度新任务，TPL 允许你使用延续来链接任务。\n\
  \n你可以对任何任务实例调用 `ContinueWith` 方法，并创建一个在该任务成功完成执行时执行的延续。该方法有许多定义，具有不同数量的参数。最简单的场景是在创建任务实例时定义一个简单的完成动作（action）。\n\
  \n列表 3-6 显示了之前在列表 3-5 中使用的代码的简化版本。这段简化代码显示了由 `t1` 生成的结果，并用延续链接了两个任务。\n\n![download](img/download.gif)\n\
  \n### [列表 3-6：] 使用延续链接两个任务\n\n```static\nstatic void Main(string[] args)\n{\n  \
  \  Console.ReadLine();\n    Console.WriteLine(\"Started\");\n    var cts = new System.Threading.CancellationTokenSource();\n\
  \    var ct = cts.Token;\n    var sw = Stopwatch.StartNew();\n    var t1 = Task.Factory.StartNew(\n\
  \        () => GenerateAESKeysWithCharPrefix(ct, 'A'), ct);\n    var t2 = t1.ContinueWith((t)\
  \ =>\n    {\n        // 对任务委托返回的执行 \n        // 执行某些操作\n        for (int i = 0;\
  \ i < t.Result.Count; i++)\n        {\n            Console.WriteLine(t.Result[i]);\n\
  \        }\n    });\n    try\n    {\n        // 等待 t2 完成\n        t2.Wait();\n \
  \   }\n...\n```\n\n你可以链接许多任务，然后等待最后一个任务（在本例中为 `t2`）执行。然而，在检查所有这些异步操作的状态时，必须小心。你必须考虑所有可能抛出的潜在异常。\n\
  \n下行代码创建了链接到 `t1` 的新任务 `t2`。在此例中，委托接收到的 `t` 是一个 `Task<List<String>>` 实例。`t1` 是必须完成才能使此新任务（`t2`）启动的任务。\n\
  \n```var\nvar t2 = t1.ContinueWith((t) =>\n```\n\n因此，可以访问 `t` 的 `Result` 属性。`t`\
  \ 代表委托中的前一个任务 `t1`。在委托内部，运行 `t2` 的以下 `for` 循环访问了 `t.Result`：\n\n![download](img/download.gif)\n\
  \n```c\nfor (int i = 0; i < t.Result.Count; i++)\n{\n    Console.WriteLine(t.Result[i]);\n\
  }\n```\n代码片段为 Listing_6\n\n### 使用延续混合并行和顺序执行的代码\n\n在第 2 章中，你学习了甘特图在检测关键区域和分析任务调度方面的可能性。现在你已经知道如何创建和管理任务，并使用延续将它们链接起来。图\
  \ 3-13 显示了甘特图中带有延续和关键区域的混合并行和顺序代码。关键区域必须等待所有前一个任务完成以执行无法并行的顺序代码。\n\n图 3-13\n![3.13](img/c03f013.jpg)\n\
  \n当 `t1` 完成时，`t2`、`t3`、`t4` 和 `t5` 继续执行。当 `t6` 完成后，有一段顺序代码等待所有前一个任务完成以执行无法并行的顺序代码。因此，使用甘特图有助于理解任务之间的关系以及任务调度。\n\
  \n### 复杂的延续工作\n\n以下代码片段展示了如何在图 3-13 中通过延续定义任务。为了简化起见，`TaskMethod` 运行在任务执行之后。\n\n\
  ![download](img/download.gif)\n\n```csharp\nvar t1 = Task.Factory.StartNew(() =>\
  \ TaskMethod());\nvar t2 = t1.ContinueWith((t) => TaskMethod2(t));\nvar t3 = t1.ContinueWith((t)\
  \ => TaskMethod3(t));\nvar t4 = t1.ContinueWith((t) => TaskMethod4(t));\nvar t5\
  \ = t1.ContinueWith((t) => TaskMethod5(t));\nTask.WaitAll(t2, t3, t4, t5);\n// 此代码是关键区域\n\
  // 主线程中的顺序代码\nvar myNewList = new List<String>();\n// 根据任务的任务填充 myNewList\n// 关键区域结束\n\
  var t6 = Task<List<String>>.Factory.StartNew(() => TaskMethod(myNewList));\nvar\
  \ t7 = t6.ContinueWith((t) => TaskMethod7(t));\nvar t8 = t6.ContinueWith((t) =>\
  \ TaskMethod8(t));\nTask.WaitAll(t7, t8);\n// 此代码是关键区域\n// 结束\n```\n代码片段为 Snippet_4\n\
  \n### TaskContinuationOptions\n\n当你添加代码创建并启动任务时，可以使用带有 `TaskCreationOptions` 参数的定义。当你创建一个作为另一个任务的延续时，可以指定一个\
  \ `TaskContinuationOptions` 参数，以控制后继任务的调度和执行的可选行为。例如，下行指定了只有当 `t9` 未取消时，`t10` 才会启动：\n\
  \n![download](img/download.gif)\n\n```csharp\nvar t10 = t9.ContinueWith(\n    (t)\
  \ => TaskMethod10(t), \n    TaskContinuationOptions.NotOnCanceled);\n```\n代码片段为\
  \ Snippet_5\n\n通过这种方式，你可以建立某些条件并为调度器提供更多关于后续任务的信息。\n\n`TaskContinuationOptions`\
  \ 枚举具有 11 个成员，详见表 3.7。当未指定此参数时，默认值为 `TaskContinuationOptions.None`。\n\n### 表 3.7\
  \ 链式任务的可选延续选项\n\n| 值 | 描述 |\n| :--- | :--- |\n| `TaskContinuationOptions.AttachedToParent`\
  \ | 延续任务被附加到父任务上。 |\n| `TaskContinuationOptions.ExecuteSynchronously` | 此选项告诉调度器应该与前一个任务同步执行延续任务。这意味着强烈建议延续任务使用将前一个任务转换为最终状态的底层线程。\
  \ |\n\n\n\n\n\n| 选项 | 描述 |\n| :--- | :--- |\n| `TaskContinuationOptions.LongRunning`\
  \ | 任务将运行较长时间。因此，调度器可以将其作为粗粒度操作来处理。如果任务可能运行很多秒钟，则可以使用此选项。相反，当任务运行时间少于 1 秒时，使用此选项并不方便。\
  \ |\n| `TaskContinuationOptions.None` | 在在前置任务完成执行时调度延续任务，无论其最终的 `TaskStatus` 属性值为何。有关此属性可能的值，请参见表\
  \ 3.2。 |\n| `TaskContinuationOptions.NotOnCanceled` | 如果前提任务被取消（`TaskStatus == TaskStatus.Canceled`），则不应调度延续任务。\
  \ |\n| `TaskContinuationOptions.NotOnFaulted` | 如果前提任务抛出了未处理的异常并完成（`TaskStatus ==\
  \ TaskStatus.Faulted`），则不应调度延续任务。 |\n| `TaskContinuationOptions.NotOnRanToCompletion`\
  \ | 如果前提任务运行完成（`TaskStatus == TaskStatus.RanToCompletion`），则不应调度延续任务。 |\n| `TaskContinuationOptions.OnlyOnCanceled`\
  \ | 只有在前提任务被取消（`TaskStatus == TaskStatus.Canceled`）时，才调度延续任务。 |\n| `TaskContinuationOptions.OnlyOnFaulted`\
  \ | 只有在前提任务抛出了未处理的异常并完成（`TaskStatus == TaskStatus.Faulted`）时，才调度延续任务。 |\n| `TaskContinuationOptions.OnlyOnRanToCompletion`\
  \ | 只有在前提任务运行完成（`TaskStatus == TaskStatus.RanToCompletion`）时，才调度延续任务。 |\n| `TaskContinuationOptions.PreferFairness`\
  \ | 此选项告诉调度器，较早调的任务更有可能早期运行，反之亦然。 |\n\n![note](img/note.gif)\n\n你可以使用位操作组合多个值。\n\
  \n以下值对于多任务延续无效：\n\n- `TaskContinuationOptions.NotOnRanToCompletion`\n- `TaskContinuationOptions.NotOnFaulted`\n\
  - `TaskContinuationOptions.NotOnCanceled`\n- `TaskContinuationOptions.OnlyOnRanToCompletion`\n\
  - `TaskContinuationOptions.OnlyOnFaulted`\n- `TaskContinuationOptions.OnlyOnCanceled`\n\
  \n如果你使用默认选项 `TaskContinuationOptions.None` 且前提任务被取消，延续任务仍会被调度并启动。因此，你必须特别注意可能的选项，以创建可靠的代码。\n\
  \n此外，`TaskCreationOptions` 的值在 `TaskContinuationOptions` 中重复了，因为对于延续任务，你只能指定后者枚举。你可以通过位或操作将一个\
  \ `TaskContinuationOptions` 值（`TaskContinuationOptions.NotOnCanceled`）与等效的 `TaskCreationOptions`\
  \ 值（`TaskContinuationOptions.LongRunning`）组合作为参数，如下所示：\n\n![download](img/download.gif)\n\
  \n```csharp\nvar t10 = t9.ContinueWith(\n    (t) => TaskMethod10(t),\n    TaskContinuationOptions.NotOnCanceled\
  \ |\n    TaskContinuationOptions.LongRunning);\n```\n代码片段是 Snippet3_6\n\n### 使用任务结合临界区域编写复杂的并行算法\n\
  \n你可以通过将延续与临界区域结合来编写复杂的并行算法。如前所述，TPL 在你创建新任务时并不一定会创建一个新线程，但如果认为合适，它可能会决定注入一个新线程。因此，如果你使用延续任务，你正在向调度器提供关于任务的价值额外信息，以便其在前置任务完成后分配这些任务。然而，创建一个良好的设计至关重要，以避免不必要的额外开销，这可能会降低性能或产生意外结果。\n\
  \n延续任务是非常强大的。如果你知道某个任务或任务必须在另一个任务之后运行，那么使用延续链接这些任务是一种很好的做法。底层调度器能够充分利用工作窃取机制，并根据运行时的可用资源优化调度机制。\n\
  \n![note](img/note.gif)\n\n延续任务简化了代码，但它们也很重要，因为它们帮助底层调度器根据在不久将来必须启动的任务采取正确的行动。\n\
  \n## 为并发和并行准备代码\n\n将并行和并发编程在应用于某些复杂算法时，并不像之前的示例所示的那么简单。有时，可靠且无 bug 的并行化版本与其顺序对应版本之间的差异可能会揭示出最初意料之外的复杂性。即使利用了\
  \ TPL 提供的新功能，代码也可能变得过于复杂。事实上，一个复杂的顺序算法可能是一个更复杂的并行算法。因此，.NET 4 的并行编程支持为并行编程提供了以下新数据结构，简化了许多复杂的同步问题：\n\
  \n- 并发集合类\n- 轻轻量级同步原语\n- 用于延迟初始化的类型\n\n这些数据结构的设计是为了尽可能避免锁，并在必要时使用细粒度锁。锁会产生许多潜在的\
  \ bug 并可能显著降低可扩展性。然而，编写无锁代码并不总是可能的。\n\n有了这些数据结构，在某些情况下你可以忘记锁（lock）机制，因为它们在底层已经包含了所有必要的同步机制。因此，尽可能使用这些数据结构是一个好主意。\n\
  \n在接下来的章节中，你将深入研究更复杂的并行算法，并学习掌握复杂的同步问题。\n\n# 总结\n\n有许多关于创建、管理和调度任务的高级主题。本章通过提供某些类、结构和枚举的使用示例，引入了\
  \ .NET 4 任务编程模型。本章还讨论了顺序代码与并行代码的结合，以及良好的设计的重要性。总结本章：\n\n- 你可以创建任务来并行运行。TPL 提供了新的\
  \ `Task` 类，允许你用简单的代码调度和启动任务。\n- 你必须检查任务的状态以了解其异步执行发生的情况。此外，你必须特别注意未处理异常的可能性。\n-\
  \ 你可以从任务返回值并使用延续链接多个任务。\n- 你可以使用一个简单的信号机制来取消任务的执行。\n- 你可以使用不同的调度选项启动多个任务并链接多个任务。甘特图可以帮助创建任务执行计划。\n\
  - 你可以使用 Lambda 表达式和匿名委托来指定由任务异步运行的操作。\n\n# 第 4 章：并发集合\n\n### 本章内容\n\n- 理解并发集合提供的功能\n\
  - 处理位于新的 `System.Collection.Concurrent` 命名空间中的并发集合\n- 使用 `ConcurrentQueue`\n- 实现并行生产者-消费者模式\n\
  - 处理多个生产者和消费者\n- 使用并发集合设计流水线\n- 使用 `ConcurrentStack`\n- 将数组和不安全集合转换为并发集合\n- 使用 `ConcurrentBag`\n\
  - 理解 `IProducerConsumerCollection` 接口\n- 理解阻塞并发集合提供的边界和阻塞能力\n\n\n\n\n\n*   取消并发集合上的操作\n\
  *   使用多个 `BlockingCollection` 实例实现过滤管道\n\n基于任务的编程、命令式数据和任务并行需要能够支持并发更新的数组、列表和集合。在\
  \ .NET Framework 4 之前，当多个线程更新共享的数组、列表和集合时，必须添加复杂的代码来同步所执行的操作。现在，你可以使用新的并发集合来简化代码并获得最佳性能。这些集合允许你用更简单的代码解决复杂的算法。然而，由于它们是随着\
  \ .NET Framework 4 刚引入的，你需要学习五个新类和一个新接口。\n\n本章将介绍新的类和新接口，这些组件允许你从多个任务或线程处理共享的并发集合。它解释了如何创建并行代码，在具有不同排序方案和结构的列表中添加、删除和更新不同类型的值。在本章结束时，你将了解如何使用新并发集合提供的基础和复杂功能，实现能够并行访问和更新列表的现有算法。\n\
  \n# 理解并发集合提供的功能\n\n列表、集合和数组是当需要并发和并行访问时需要复杂同步管理的极佳示例。如果你必须编写一个并行循环，以无序的方式向共享集合中添加元素，你必须添加一种同步机制来生成线程安全的集合。在\
  \ `System.Collections` 和 `System.Collections.Generic` 命名空间中的经典列表、集合和数组不是线程安全的，因为它们没有准备好接收添加或删除元素的并发指令。因此，创建一个线程安全的确实是一项非常复杂的工作。\n\
  \n如果你需要在一个创建许多并发任务的并行循环中向共享的 `System.Collections.Generic.List` 添加元素，在不不同步其执行的情况下，你无法使用它的\
  \ `Add` 方法。因为许多线程将并发访问它，而且由于不是线程安全的，它没有准备好接收并发请求，因此你需要将 `Add` 方法的执行序列化。\n\nListing\
  \ 4-1 显示了一个新版本的高级加密标准（AES）密钥生成器。\n\n![download](img/download.gif)\n\nListing 4-1:\
  \ 在关键代码段中向列表添加元素\n\n```csharp\nprivate static List<string> _keysList;\n\nprivate\
  \ static void ParallelPartitionGenerateAESKeys()\n{\n    var sw = Stopwatch.StartNew();\n\
  \    Parallel.ForEach(Partitioner.Create(1, NUM_AES_KEYS + 1), range =>\n    {\n\
  \        var aesM = new AesManaged();\n        Debug.WriteLine(\"AES Range ({0},\
  \ {1}. Time: {2})\",\n                          range.Item1, range.Item2,\n    \
  \                      DateTime.Now.TimeOfDay);\n        for (int i = range.Item1;\
  \ i < range.Item2; i++)\n        {\n            aesM.GenerateKey();\n          \
  \  byte[] result = aesM.Key;\n            string hexString = ConvertToHexString(result);\n\
  \            lock (_keysList)\n            {\n                // Critical code section\n\
  \                // It is safe to add elements to the List\n                _keysList.Add(hexString);\n\
  \            }\n            // Console.WriteLine(\"AES KEY: {0} \", hexString);\n\
  \        }\n    });\n    Debug.WriteLine(\"AES: \" + sw.Elapsed.ToString());\n}\n\
  \nstatic void Main(string[] args)\n{\n    var sw = Stopwatch.StartNew();\n    _keysList\
  \ = new List<string>(NUM_AES_KEYS);\n    ParallelPartitionGenerateAESKeys();\n \
  \   Console.WriteLine(\"Number of keys in the list: {0}\",\n          _keysList.Count);\n\
  }\n```\n\n\n\n\n## System.Collections.Concurrent\n\nNET Framework 4 提供了一个新的命名空间\
  \ `System.Collections.Concurrent`，用于处理线程安全问题。正如你之前学过的，此命名空间提供了对并行循环和 PLINQ 的自定义分区器的访问。然而，它还提供了对为并发准备的以下集合的访问：\n\
  \n* `BlockingCollection<T>` — 类似于经典的阻塞队列数据结构；在这种情况下，它是为许多任务添加和移除数据的生产者-消费者场景准备的。它是\
  \ `IProducerConsumer<T>` 实例的封装，提供了阻塞和边界能力。\n* `ConcurrentBag<T>` — 提供一个无序的对象集合。当顺序不重要时，它非常有用。\n\
  * `ConcurrentDictionary<TKey, TValue>` — 类似于经典的键值对字典，但可以并发地进行访问。\n* `ConcurrentQueue<T>`\
  \ — 一个 FIFO（先进先出）集合，许多任务可以并发地入队和出队元素。\n* `ConcurrentStack<T>` — 一个 LIFO（后进先出）集合，许多任务可以并发地推入和弹出元素。\n\
  \n所有这些新集合在某种程度上采用了无锁技术以实现性能优势。这意味着它们通过使用比较并交换 (CAS) 指令和内存屏障，避免了典型的互斥和重量级锁。然而，在某些情况下它们也会使用锁。后续章节将提供有关上述每个集合所用同步技术的详细信息。\n\
  \n## ConcurrentQueue\n\n`ConcurrentQueue` 是完全无锁的。它从不获取锁，但当 `CAS` 操作失败并面临竞争时，它们可能会最终进入自并重试操作。竞争是指许多任务或线程尝试同时使用单个资源时产生的条件。`ConcurrentQueue`\
  \ 是 `System.Collections.Queue` 的并发版本。\n\n正如之前解释过的，要使用经典的共享列表来从由 `Parallel.ForEach`\
  \ 方法创建的许多独立任务添加元素是困难的。你需要添加同步代码，这在不限制整体可扩展性的情况下将是一个巨大的挑战。然而，你可以在并行化代码内部的共享 `ConcurrentQueue`\
  \ 中向队列添加字符串（入队字符串），因为 `ConcurrentQueue` 是为并发添加元素而准备的。[图 4-1] 显示了 `ConcurrentQueue`\
  \ 提供的三个重要方法的图表，如下所示：\n\n* `Enqueue` — 将接收到的作为参数的新元素添加到队列末尾。\n* `TryDequeue` — 尝试从队列开头移除元素并将其返回到\
  \ `out` 参数中。它返回一个 `bool` 值表示操作是否成功，且 `out` 参数包含从队列中移除的对象。\n* `TryPeek` — 尝试将队列开头的元素返回到\
  \ `out` 参数中，但并不将其从队列中移除。它返回一个 `bool` 值表示操作是否成功，且 `out` 参数包含队列顶部的对象。\n\n[图 4-1]\n\
  \n![4.1](img/c04f001.jpg)\n\n[代码列表 4-2] 使用名为 `_keysQueue` 的共享 `ConcurrentQueue<string>`\
  \ 来存储一个字符串队列，该队列包含了在带有自定义分区的并行循环中生成的 AES 密钥。\n\n![download](img/download.gif)\n\n\
  [代码列表 4-2:] 在并行循环中向 ConcurrentQueue 添加元素\n\n```csharp\nprivate static void ParallelPartitionGenerateAESKeys()\n\
  {\n    var sw = Stopwatch.StartNew();\n    Parallel.ForEach(Partitioner.Create(1,\
  \ NUM_AES_KEYS + 1), range =>\n    {\n        var aesM = new AesManaged();\n   \
  \     Debug.WriteLine(\n            \"AES Range ({0}, {1}. TimeOfDay before inner\
  \ loop starts: {2})\",\n            range.Item1, range.Item2,\n            DateTime.Now.TimeOfDay);\n\
  \        for (int i = range.Item1; i < range.Item2; i++)\n        {\n          \
  \  aesM.GenerateKey();\n            byte[] result = aesM.Key;\n            string\
  \ hexString = ConvertHexString(result);\n            _keysQueue.Enqueue(hexString);\n\
  \            // Console.WriteLine(\"AES: {0}\", hexString);\n        }\n    });\n\
  \    Debug.WriteLine(\"AES: \" + sw.Elapsed());\n}\nprivate static ConcurrentQueue<string>\
  \ _keysQueue;\nstatic void Main(string[] args)\n{\n    var sw = Stopwatch.StartNew();\n\
  \    _keysQueue = new ConcurrentQueue<string>();\n    ParallelPartitionGenerateAESKeys();\n\
  \    Console.WriteLine(\"Number of keys in the list: {0}\", _keysQueue.Count);\n\
  \    Debug.WriteLine(sw.Elapsed());\n    Console.WriteLine(\"Finished!\");\n   \
  \ Console.ReadLine();\n}\n```\n\n所有通过 `Parallel.ForEach` 创建的任务都会通过 `Enqueue` 方法将字符串添加到队列末尾，如下：![download](img/download.gif)\
  \ `_keysQueue.Enqueue(hexString)` 代码段位于 _2\n\n使用 `ConcurrentQueue` 是非常简单的。你不需要担心同步问题，因为一切都是内部处理的。你可以并发地添加、读取和移除元素，例如，你可以运行许多\
  \ LINQ 查询来显示 `ConcurrentQueue` 运行时的统计数据。![download](img/download.gif)\n\n[代码列表 4-3]\
  \ 从 ConcurrentQueue 读取并查看元素\n\n```csharp\nstatic void Main(string[] args)\n{\n \
  \   var sw = Stopwatch.StartNew();\n    _keysQueue = new ConcurrentQueue<string>();\n\
  \    var tAsync = Task.Factory.StartNew(() => ParallelPartitionGenerateAESKeys());\n\
  \    string lastKey;\n    whiletAsync.Status == TaskStatus.Running) || (tAsync.Status\
  \ == TaskStatus.WaitingToRun))\n    {\n        // 显示部分结果\n        var countResult\
