  \ 方法返回 `output`。然而，如果发生错误，方法将抛出 `MKLException`。\n\n`fourierTask` 任务被定义为 `Task<double[]>`，并返回调用\
  \ `DFT1DRealToComplex` 方法的结果。链在 `fourierTask` 上的后续任务接收此任务作为 `antecedentTask`。如果发生异常，代码会捕获异常并将其显示在\
  \ `lstOutput` ListBox 中。如果离散傅里叶变换的运行没有问题，在创建 UI 控件的同一线程中运行的代码将结果显示为 `lstOutput`\
