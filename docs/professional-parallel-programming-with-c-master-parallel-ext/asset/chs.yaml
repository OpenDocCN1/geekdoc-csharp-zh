  ### 来自 Snippet5_3 的代码片段\n\n在这种情况下，同一个 `ct`（`CancellationToken`）实例被关联到参与者的任务以及通过\
  \ `ContinueWhenAll` 方法调度的 `finalTask` 中。在 `CreatePlanets` 方法执行完毕后，参与者调用 `_barrier.SignalAndWait()`\
  \ 方法并等待 `TIMEOUT` 秒。在该时间之后（即 2 秒后），`SignalAndWait` 方法返回 false，因为有一个参与者需要超过 2 秒的时间才能向屏障发送到达信号。因此，除了尚未信号到达的参与者外，所有参与者都会抛出一个新的\
  \ `OperationCanceledException`，并将 `ct`（`CancellationToken`）实例作为参数之一。相应的 `Task` 实例由于存在未处理的异常而处于故障（faulted）状态。\n\
  \n等待 `finalTask` 完成的代码还以毫秒为单位将超时参数传递给 `Wait` 方法。在这种情况下，超时时间是 `_barrier.SignalAndWait()`\
  \ 方法指定毫秒数的两倍。由于其中一个参与者将在 `SpinWait.SpinUntil` 这一行停留比 `_barrier.SignalAndWait()`\
  \ 指定毫秒数三倍的时间，`Wait()` 方法将返回 false。当发生这种情况时，代码会检查每个作为屏障参与者的 `Task` 实例的 `Status` 属性值。代码将遍历\
  \ `Status` 属性持有 `TaskStatus.Faulted` 值的 `Task` 实例的 `InnerExceptions` 属性，并显示与异常相关的消息。由于至少有一个\
  \ `Task` 实例的 `Status` 属性持有 `TaskStatus.Faulted` 值，`faulted == true`，代码会写入一条解释阶段执行失败的消息。释放\
  \ `Barrier` 实例的代码位于 `try...catch...finally` 块的 `finally` 部分。\n\n![note](img/note.gif)\n\
  \n在处理屏障（barriers）时，包含超时和取消是非常重要的。\n\n### 处理动态数量的参与者\n\n`Barrier` 类提供了四个方法，允许你动态添加和移除参与者。然而在使用这些方法时必须小心，因为它们会改变屏障期望的信号数量。\n\
  \n* `AddParticipant`:向 Barrier 添加一个参与者。\n* `AddParticipants`:向 Barrier 添加指定数量的参与者。\n\
  * `RemoveParticipant`:从 Barrier 移除一个参与者。\n* `RemoveParticipants`:从 Barrier 移除指定数量的参与者。\n\
  \n### 使用互斥锁\n\n当你有一个有一个只有一个任务可以同时访问但必须被许多任务调用的关键区域，且使用延续（continuations）不是良好选择时，一种替代方案是使用互斥锁。`lock`\
  \ 关键字获取对象的互斥锁，将语句块作为关键区域执行，然后释放锁。下面的代码显示了 `lock` 关键字的典型用法，用于独占访问代码块：\n\n```csharp\n\
  lock (_myObject)\n{\n    // 关键区域开始\n    // 这些语句在对 myObject 独占的情况下运行\n    _myObject.Add(newMessage1);\n\
  \    _myObject.Add(newMessage2);\n    // 关键区域结束\n}\n```\n\n`lock` 关键字在执行语句块之前调用带对象的对象的\
  \ `System.Threading.Monitor.Enter` 获取该对象的独占锁。然后，如果确实获取了锁，则作为关键区域执行代码，`lock` 调用 `System.Threading.Monitor.Exit`\
  \ 来释放之前获取的对象独占锁并离开关键区域。因此，之前所示的代码片段等同于以下使用 `Monitor.Enter` 和 `Monitor.Exit` 代替 `lock`\
  \ 关键字的代码：\n\n```csharp\nbool lockTaken = false;\ntry\n{\n    Monitor.Enter(_myObject,\
  \ ref lockTaken);\n    // Monitor 获取了 myObject 的锁\n    // 关键区域开始\n    // 这些语句在对\
  \ myObject 独占的情况下运行\n    _myObject.Add(newMessage1);\n    _myObject.Add(newMessage2);\n\
  \    // 关键区域结束\n}\nfinally\n{\n    if (lockTaken)\n    {\n        Monitor.Exit(_myObject);\n\
  \    }\n}\n```\n\n\n\n\n\n```cs\n// 你需要确保你释放了在 myObject 上的锁\nif (lockTaken)\n  \
  \  Monitor.Exit(_myObject);\n```\n\n![note](img/note.gif)\n\n上面的代码片段是 .NET Framework\
  \ 4 中 `lock` 生成的代码，也是推荐的模式。在 .NET Framework 4 之前，有另一种推荐模式。\n\n`System.Threading.Monitor`\
  \ 类提供了通过互斥锁同步对象访问的机制。使用 `lock` 关键字的等效代码用起来更简单，因为你不需要编写 `try…finally` 块来确保释放之前获取的锁。然而，`Monitor`\
  \ 类提供了额外的方法，允许你对锁获取过程进行更多控制，并支持处理超时。如果传递给 `Monitor.Exit` 方法的对象与用于 `Monitor.Enter`\
  \ 的对象不同，`Monitor` 将抛出 `SynchronizationLockException`。\n\n![note](img/note.gif)\n\
  \n`lock` 关键字和 `Monitor` 类仍然是提供互斥的首选方法。但是，在某些场景下，你可能会发现其他互斥锁原语（如 `SpinLock`）提供更好的性能或更低的开销。\n\
  \n![note](img/note.gif)\n\n`lock` 关键字和 `Monitor` 类允许你锁定对象，即引用类型。不要对值类型使用 `lock`\
  \ 或 `Monitor`。如果你需要同步对值类型的访问，必须使用单独的同步对象，并在需要作为关键区域运行代码时对其进行锁定。\n\n接下来的行显示了 列表 5-1\
  \ 中 `Main` 方法第一部分的新版本。这个新版本使用 `lock` 关键字来获取锁并在关键区域运行代码，并通过名为 `sb` 的 `StringBuilder`\
  \ 在所有屏障参与者向日志字符串中添加信息。\n\n![download](img/download.gif)\n\n```cs\nstatic void Main(string[]\
