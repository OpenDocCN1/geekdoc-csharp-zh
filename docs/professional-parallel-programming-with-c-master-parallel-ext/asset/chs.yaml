  \ To Current Stack Frame` 选项按钮，窗口将在其可视区域中自动显示当前堆栈帧。此外，当图形所需的空间大于窗口可用的视口且存在滚动条时，滚动条之间的空间会显示一个提供鸟瞰的按钮。当你点击此按钮时，它会显示整个图形的缩略图视图，可以使用它来在图片周围快速滚动。图\
