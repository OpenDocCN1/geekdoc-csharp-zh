  using System;\nusing System.Collections.Generic;\nusing System.Linq;\nusing System.Text;\n\
  using System.Windows;\nusing System.Windows.Controls;\nusing System.Windows.Data;\n\
  using System.Windows.Documents;\nusing System.Windows.Input;\nusing System.Windows.Media;\n\
  using System.Windows.Media.Imaging;\nusing System.Windows.Navigation;\nusing System.Windows.Shapes;\n\
  // 添加\nusing System.Diagnostics;\nusing System.Threading;\nnamespace Listing8_1\n\
  {\n    /// <summary>\n    /// MainWindow.xaml 的交互逻辑\n    /// </summary>\n    public\
  \ partial class MainWindow : Window\n    {\n        public MainWindow()\n      \
  \  {\n          InitializeComponent();\n        }\n        // 工作线程总数\n        private\
  \ int _workerCount = 0;\n        // 活跃工作线程数\n        private int _activeWorkers\
  \ = 0;\n        private void DoSomeWork(int workerNum)\n        {\n          //\
  \ 模拟一些工作\n          // 在 7 到 2 秒之间\n          var milliSec = new Random().Next(700,\
  \ 200);\n          Debug.WriteLine(\"Worker #{0} will simulate work for {1} milliseconds\
  \ \", workerNum, milliSec);\n          var sw = Stopwatch.StartNew();\n        \
  \  // 模拟一些 CPU 密集型工作\n          while (sw.Elapsed.TotalMilliseconds < milliSec)\n\
  \          {\n            // 继续模拟 CPU 密集型工作\n            double calc = Math.Pow(Math.PI\
  \ * sw.Elapsed.TotalMilliseconds, 2);\n          }\n        }\n        private void\
  \ butLaunchWorker_Click(object sender, RoutedEventArgs e)\n        {\n         \
  \ // 增加工作计数\n          // 这里不需要原子操作\n          // 因为此代码始终运行在 UI 线程上\n          _workerCount++;\n\
  \          // 请求线程池队列\n          // 一个工作项（一个 WaitCallback）\n          //并将 _workerCount\
  \ 作为参数发送给 WaitCallback\n          ThreadPool.QueueUserItem(state) =>\n         \
  \ {\n            // 从对象状态中获取接收到的 workerNum\n            int workerNum = (int)state;\n\
  \            // 使用原子操作增加活跃工作线程数\n            Interlocked.Increment(ref _activeWorkers);\n\
  \            try\n            {\n              Debug.WriteLine(\"Worker #{0} started\
  \ \", workerNum);\n              DoSomeWork(workerNum);\n              Debug.WriteLine(\"\
  Worker #{0} finished \", workerNum);\n            }\n            finally\n     \
  \       {\n              // 使用原子操作减少活跃工作线程数\n              Interlocked.Decrement(ref\
  \ _activeWorkers);\n            }\n          }, _workerCount);\n        }\n    \
  \    private void butCheckActive_Click(object sender, RoutedEventArgs e)\n     \
  \   {\n          lblActiveWorkers.Content = String.Format(\"Active workers: {0}\"\
  , _activeWorkers);\n        }\n    }\n}\n```\n\n\n\n\n随后，事件处理程序的代码调用了 `ThreadPool`\
  \ 类的 `QueueUserWorkItem` 方法。该方法请求在线程池的线程中运行一个工作项。当你调用 `QueueUserWorkItem` 时，作为参数传递的\
  \ `WaitCallback` 委托指定了要在线程池线程中运行的回调方法。该委托被置于全局队列中，因此以异步方式执行。`QueueUserWorkItem`\
  \ 方法立即返回；因此，主线程继续执行事件处理程序代码中的下一条语句。此时，回调方法尚未运行，用户可以操作 UI 控件，因为主线程没有工作项任务。线程池不会使用主线程来调度工作项的执行。图\
  \ 8-3 显示了线程池的全局队列以及已添加到该队列并等待执行的第一个工作项。\n\n图 8-3\n\n![8.3](img/c08f003.jpg)\n\n\
  当代码调用 `ThreadPool.QueueUserWorkItem` 方法时，它使用了其定义中允许你向 `WaitCallback` 委托传递参数的一个定义。事件处理程序将\
  \ `_workerCount` 的当前值作为参数传递，委托将作为状态对象接收。\n\n每当你点击“启动工作线程”（Launch Worker）按钮时，都会有一个新的工作项添加到线程池的全局队列中。每个回调方法将带有不同的\
  \ `state` 参数值运行。图 8-4 显示了线程池的全局队列，其中已添加了两个等待执行的工作项。\n\n图 8-4\n\n![8.4](img/c08f004.jpg)\n\
  \nCLR 线程池会注入许多空闲的工作线程，它们按照先进先出（FIFO）的顺序从队列中取出并开始执行等待中的每个工作项。图 8-5 显示了在具有空闲工作线程的线程池的两个不同线程中运行的两个工作项。\n\
  \n图 8-5\n\n![8.5](img/c08f005.jpg)\n\n当线程池所有可用的工作线程都在执行工作项时，添加到线程池全局队列的新工作项将等待直到某个工作线程可用。图\
  \ 8-6 显示了在线程池的三个不同线程中运行的三个工作项以及在全局队列中等待的四个工作项。图 8-7 显示了当工作线程 #1 完成工作项 #1 的执行并从队列中取出第一个工作项（工作项\
  \ #4）进行执行时，全局队列发生了变化。\n\n图 8-6\n\n![8.6](img/c08f006.jpg)\n\n图 8-7\n\n![8.7](img/c08f007.jpg)\n\
  \n.NET Framework 4 引入的改进之一是实现了一种无锁算法来队列和出队工作项。CLR 4 线程池引擎使用了一种与 `ConcurrentQueue`\
  \ 类相似的算法（你在第 4 章中学习过该类）。这种无锁算法减少了队列和出队工作项所需的时间；因此它提升了线程池的性能和可扩展性。此外，该算法消除了或至少显著减少了由以前版本线程池引擎中全局队列锁产生的瓶颈。\n\
  \n![note](img/note.gif)\n\n线程池引擎可以定期创建额外的空闲线程，以便取出等待在全局队列中的工作项并执行它们。你应该避免更改默认的最大工作线程（maximum\
  \ worker threads）和完成端口线程（completion port threads）参数，除非你的应用程序需要特定的调优，并且你确定新的最大值对你的特定需求有益。静态方法\
  \ `ThreadPool.SetMaxThread` 允许你为上述参数指定新值。\n\nCLR 4 线程池引擎使用了一种爬山算法（hill-climbing\
  \ algorithm）。该算法监控吞吐量并判断增加线程是否会导致完成更多工作项。该算法基于这样一个观点：工作项需要某种资源来处理，无论是 CPU、网络带宽还是其他资源。此外，算法还考虑了饱和点的存在，即更多线程实际上会降低吞吐量。\n\
  \n在作为示例的 WPF 应用中，当线程池的一个工作线程变为可用时，它运行以下代码：\n\n```csharp\nint workerNum = (int)state;\n\
  Interlocked.Increment(ref _activeWorkers);\ntry\n{\n    Debug.WriteLine(\"Worker\
  \ {0} started\", workerNum);\n    DoWork(workerNum);\n    Debug.WriteLine(\"Worker\
  \ {0} finished\", workerNum);\n}\nfinally\n{\n    Interlocked.Decrement(ref _activeWorkers);\n\
  }\n```\n\n委托接收 `state` 对象作为参数。代码必须将此对象转换为 `int` 以检索它并将其存储在 `workerNum` 变量中。然后，代码调用\
  \ `Interlocked.Increment` 来增加声明为 `MainWindow` 类私有变量的活动工作线程数。主线程可以访问此变量以显示线程池中运行的活动工作线程数量。`try...finally`\
  \ 块确保代码在执行工作后调用 `Interlocked.Decrement` 来减少计数。在增加 `_activeWorkers` 之后，`try` 块中的代码执行以下操作：\n\
  \n1. 它写入关于工作线程启动的信息。\n2. 它调用 `DoWork` 并传递 `workerNum` 作为参数。\n3. 它写入工作线程结束的信息。\n\n\
  以下行显示了 `DoWork` 方法的代码，它接收一个 `int workerNum` 参数并模拟工作以保持示例易理解。该方法生成一个 7000 到 12000\
  \ 毫秒之间的随机数，并将其保存在局部变量 `ms` 中。然后，该方法写入该工作线程模拟 CPU 密集型工作所需的毫秒数：\n\n```csharp\nprivate\
  \ void DoWork(int workerNum)\n{\n    int ms = new Random().Next(7000, 12000);\n\
  \    Debug.WriteLine(\"Worker {0} will simulate work for {1} milliseconds\", workerNum,\
  \ ms);\n    var sw = Stopwatch.StartNew();\n    // 一些 CPU 密集型工作\n    while (sw.Elapsed.TotalMilliseconds\
  \ < ms)\n    {\n        // Go 模拟 CPU 密集型工作\n        double calc = Math.Pow(Math.PI\
  \ * sw.Elapsed.TotalMilliseconds, 2);\n    }\n}\n```\n\n点击 Launch Worker 按钮五次后，输出窗口会出现以下行：\n\
  \n```\nWorker #1 started\nWorker #1 will simulate work for 10436 milliseconds\n\
  Worker #2 started\nWorker #2 will simulate work for 11919 milliseconds\nWorker #3\
  \ started\nWorker #3 will simulate work for 8560 milliseconds\nWorker #4 started\n\
  Worker #4 will simulate work for 11836 milliseconds\nWorker #5 started\nWorker #5\
  \ will simulate work for 11787 milliseconds\n```\n\n\n\n你可以无限制地多次点击“启动工作”（Launch\
  \ Worker）按钮，因为它的点击事件处理程序在 UI 线程中运行代码，只是执行了几条语句并调用了 `ThreadPool.QueueUserWorkItem`。如之前所述，UI\
  \ 线程不会等待工作项完成执行。每个工作线程在执行完指定毫秒数的数学运算后，都会宣布其已完成工作。随着每个工作线程完成任务，以下行将出现在输出窗口中：\n\n\
  Worker #3 finished\nWorker #1 finished\nWorker #2 finished\nWorker #4 finished\n\
  Worker #5 finished\n\nWorker #3 是第一个完成任务的，因为它的线程花费了 8,560 毫秒执行数学运算。该线程的工作模拟时间是最短的。\n\
  \n点击“启动工作”按钮五次，等待 1 秒钟，然后使用“全部中断”（Break All）命令停止执行。由于你等待了 1 秒，许多工作项将在线程池引擎管理的工作线程中运行。结果将根据你计算机上可用的逻辑核心数而异。通过选择**调试\
  \ → 窗口 → 线程**（Debug → Windows → Threads）显示线程窗口，网格将显示许多名称为“工作线程”（Worker Thread）且位置列为\
  \ `DoSomeWork` 方法的线程。这些工作线程正在运行由调度到线程池线程中运行的回调委托所调用的 `DoSomeWork` 方法的代码。图 8-8 显示了五个正在运行\
  \ `DoSomeWork` 方法的工作线程。\n\n图 8-8\n\n![8.8](img/c08f008.jpg)\n\n通过选择**调试 → 窗口 → 并行堆栈**（Debug\
  \ → Windows → Parallel Stacks）显示并行堆栈窗口，并切换到线程视图。图 8-9 显示了正在 `DoSomeWork` 方法中运行 `while`\
  \ 块的五个工作线程的堆栈帧。主线程是正在等待 UI 控件新消息的线程，位于 `App.Main` 方法。\n\n图 8-9\n\n当你随时点击“检查工作线程”（Check\
  \ Workers）按钮时，`butActive_Click` 事件处理程序中的代码会在标签中显示活动工作线程的数量。此代码运行在 UI 线程中，并将私有变量\
  \ `_activeWorkers` 存储的值格式化为指示活动工作线程数量的字符串。记住，工作线程使用原子操作来增加和减少私有变量 `_activeWorkers`\
  \ 的值。由于 UI 线程可以运行代码，你可以多次点击“检查工作线程”按钮，查看工作线程完成执行并导致 `_activeWorkers` 变量减少的效果。图 8-10\
  \ 显示了指示有九个活动工作线程的标签。\n\n图 8-10\n\n![8.10](img/c08f010.jpg)\n\n## 等待工作线程完成工作\n\n\
  如果你在工作线程运行代码时关闭应用程序窗口，所有这些线程将停止执行，主进程将退出。这是因为由线程池管理的线程是后台线程，如果所有前景线程退出，后台线程不会保持应用程序运行。当你关闭应用程序窗口时，所有前景线程都会退出；因此，后台线程也会停止执行代码并销毁。\n\
  \n当你使用 `ThreadPool.QueueUserWorkItem` 方法在线程池线程中运行代码时，你无法为每个执行的工作项获取标识。因此，如果你想等待所有工作项完成，必须使用协调数据结构和信号机制。列表\
  \ 8-2 显示了 WPF 主窗口新版本的 XAML 代码，该窗口显示了一个名为 `butWaitAll` 的额外按钮。列表 8-2 还显示了主窗口的 C# 代码，并高亮了新的代码行。\n\
  \n![download](img/download.gif)\n\n### 列表 8-2：使用 ManualResetEvent 的并发集合等待工作项完成\n\
  \n```xml\nMainWindow.xaml\n<Window x:Class=\"Listing8_2.MainWindow\"\n        xmlns=\"\
  http://schemas.microsoft.com/winfx/2006/xaml/presentation\"\n        xmlns:x=\"\
  http://schemas.microsoft.com/winfx/2006/xaml\"\n        Title=\"Requesting work\
  \ items to run in a thread in the thread pool\"\n        Height=\"283\" Width=\"\
  498\">\n  <Grid>\n    <Button Content=\"Launch Worker\" Height=\"50\"\n        \
  \    HorizontalAlignment=\"Left\" Margin=\"12,12,0,0\"/>\n    <Button Content=\"\
  Check Workers\" Height=\"51\"\n            HorizontalAlignment=\"Left\" Margin=\"\
  12,179,0,0\"/>\n    <Label Content=\"Active workers: 0\" Height=\"32\"\n       \
  \    HorizontalAlignment=\"Left\" Margin=\"269,192,0,0\"/>\n    <Button Content=\"\
  Wait for All\" Height=\"4\"\n            HorizontalAlignment=\"Left\" Margin=\"\
  281,2,0,0\"/>\n  </Grid>\n</Window>\n```\n\n```csharp\nMainWindow.xaml.cs\nusing\
  \ System;\nusing System.Collections.Generic;\nusing System.Linq;\nusing System.Text;\n\
  using System.Windows;\nusing System.Windows.Controls;\nusing System.Windows.Data;\n\
  using System.Windows.Input;\nusing System.Windows.Media;\nusing System.Windows.Media.Imaging;\n\
  using System.Windows.Navigation;\nusing System.Windows.Shapes;\nusing System.Diagnostics;\n\
  using System.Threading;\nusing System.Threading.Tasks;\nusing System.Collections.Concurrent;\n\
  \nnamespace Listing8_2\n{\n    /// <summary>\n    /// Interaction logic for MainWindow.xaml\n\
  \    /// </summary>\n    public partial class MainWindow : Window\n    {\n     \
  \   public MainWindow()\n        {\n            InitializeComponent();\n       \
  \ }\n        // The total number of workers\n        private int _workerCount =\
  \ 0;\n        // The number of active workers\n        private int _activeWorkers\
  \ = 0;\n        // The concurrent collection of ManualResetEvent\n        private\
  \ ConcurrentQueue<ManualResetEvent> _handlesQueue =\n            new ConcurrentQueue<ManualResetEvent>();\n\
  \n        private void DoSomeWork(int workerNum)\n        {\n            // Simulate\
  \ some work\n            // between 7 and 12 seconds\n            var milliSecs\
  \ =\n                new Random().Next(7000, 12000);\n            Debug.WriteLine(\n\
  \                \"Worker #{0} will simulate work for {1} milliseconds \",\n   \
  \             workerNum,\n                milliSecs);\n            var sw = Stopwatch.StartNew();\n\
  \            // Simulate some CPU-bound work\n            while (sw.Elapsed.TotalMilliseconds\
  \ < milliSecs)\n            {\n                // Go on simulating-bound work\n\
  \                double calc = Math.Pow(\n                    Math.PI * \n     \
  \               sw.Elapsed.TotalMilliseconds, 2);\n            }\n        }\n\n\
  \        private void butLaunchWorker_Click(\n            object sender, RoutedEventArgs\
  \ e)\n        {\n            // Increment the worker count\n            // There\
  \ is no need for an atomic operation here\n            // because this code runs\
  \ always on the UI thread\n            _workerCount++;\n            // Request ThreadPool\
  \ to queue\n            // a work item (a WaitCallback)\n            // and send\
  \ _workerCount as a\n            // parameter to the WaitCallback\n            ThreadPool.QueueUserWorkItem(state\
  \ =>\n            {\n                DoSomeWork((int)state);\n            }, _workerCount);\n\
  \        }\n\n        private void butCheckWorkers_Click(\n            object sender,\
  \ RoutedEventArgs e)\n        {\n            // Increment active workers count using\
  \ atomic operation\n            Interlocked.Increment(ref _activeWorkers);\n   \
  \         // Format the value and update the label\n            lblActiveWorkers.Content\
  \ = $\"Active workers: {_activeWorkers}\";\n        }\n\n        private void butWaitAll_Click(object\
  \ sender, RoutedEventArgs e)\n        {\n            // Implementation for waiting\
  \ for all workers would go here\n        }\n    }\n}\n```\n\n\n\n\n```csharp\n(state)\
  \ =>\n{\n    // 获取作为对象 state 参数\n    // 接收到的 workerNum\n    int workerNum = (int)state;\n\
  \    // 使用原子操作增加活跃工作线程\n    // 的数量\n    Interlocked.Increment(ref _activeWorkers);\n\
  \    // 创建一个新的未信号的 ManualResetEvent\n    // 并将其添加到\n    // _handlesQueue ConcurrentQueue\n\
  \    var handle = new ManualResetEvent(false);\n    _handlesQueue.Enqueue(handle);\n\
  \    try\n    {\n        Debug.WriteLine(\"Worker #{0} started \", workerNum);\n\
  \        DoSomeWork(workerNum);\n        Debug.WriteLine(\"Worker #{0} finished\
  \ \", workerNum);\n        // 信号（设置）ManualResetEvent\n        handle.Set();\n  \
  \  }\n    finally\n    {\n        // 使用原子操作减少活跃工作线程\n        // 的数量\n        Interlocked.Decrement(ref\
  \ _activeWorkers);\n    }\n}, _workerCount);\n\nprivate void butActive_Click(object\
  \ sender, RoutedEventArgs e)\n{\n    lblActiveWorkers.Content = String.Format(\"\
  Active workers: {0}\", _activeWorkers);\n}\n\nprivate void butWaitAll_Click(object\
  \ sender, RoutedEventArgs e)\n{\n    // 创建并启动一个新任务，等待\n    // 所有事件被设置\n    var t1\
  \ = Task.Factory.StartNew(() =>\n    {\n        if (_handlesQueue.Count > 0)\n \
  \       {\n            // 等待所有事件被设置\n            WaitHandle.WaitAll(_handlesQueue.ToArray());\n\
  \        }\n    });\n    // 阻塞此线程 - 即 UI 线程 - 直到\n    // t1 任务完成\n    // 阻塞 UI 线程显然是一个非常糟糕的做法\n\
  \    // 这样做仅仅是为了示例目的\n    t1.Wait();\n    // 更新按钮的标题\n    butWaitAll.Content = \"\
  Done!\";\n}\n```\n\n现在，如果你启动了许多工作线程并点击“等待工作线程完成”（Wait For Workers To Finish）按钮，UI\
  \ 线程将阻塞直到所有工作线程完成。发生这种情况是因为应用程序为每个工作线程项使用了一个 `ManualResetEvent` 实例。图 8-11 显示了 UI\
  \ 如何被冻结，以及“等待工作线程完成”按钮为何保持按下状态，因为 UI 线程被阻塞，在所有工作线程完成之前不会释放按钮。\n\n图 8-11\n\n![8.11](img/c08f011.jpg)\n\
  \n当线程池中的工作线程可用时，以下代码将创建一个新的未信号的 `ManualResetEvent` 并将其添加到 `_handlesQueue` `ConcurrentQueue`\
  \ 中：\n\n![download](img/download.gif)\n\n```c\nvar handle = new ManualResetEvent(false);\n\
  _handlesQueue.Enqueue(handle);\n```\n来自列表 8_2 的代码片段\n\n`_handlesQueue` 被声明为 `MainWindow`\
  \ 类的私有变量。由于线程池中的许多线程可以并发创建并添加 `ManualResetEvent` 实例，因此代码使用了 `ConcurrentQueue`。\n\
  \n当在线程池线程中运行的代码从 `DoSomeWork` 方法返回时，它通过调用 `Set` 方法将 `ManualResetEvent` 的状态设置为已信号，如下行所示：\n\
  \n![download](img/download.gif)\n\n```c\nhandle.Set();\n```\n来自列表 8_2 的代码片段\n\n\
  当你点击“等待工作线程完成”按钮时，`butWaitAll_Click` 事件处理程序中的代码创建并启动了一个名为 `t1` 的新任务。此新任务调用 `WaitHandle.WaitAll`\
  \ 方法并传递 `ManualResetEvent` 数组——即将 `_handlesQueue` 转换为数组。`WaitHandle.WaitAll` 方法会阻塞，直到数组中的所有事件都被设置为信号状态。因此，`t1`\
  \ 将等待所有工作项设置它们的 `ManualResetEvent`。\n\n事件处理程序中的代码通过调用 `t1.Wait` 阻塞 UI 线程，直到 `t1`\
  \ 完成其工作。因此，UI 线程将停止处理事件，直到所有工作项都了它们的 `ManualResetEvent`。当这种情况发生时，按钮的标题将更改为 Done!\n\
  \n事件处理程序中的代码创建并启动了一个新任务，因为 WPF 应用中的 UI 线程是单线程单元（STA）线程。如果你在 UI 线程中运行 `WaitHandle.WaitAll`\
  \ 方法并传递包含多个句柄的数组作为参数，将抛出 `NotSupportedException`。`WaitHandle.WaitAll` 方法不支持在 STA\
  \ 线程上等待多个句柄。由于事件处理程序中的代码运行在 UI 线程中，它创建了一个分配并运行在线程池多线程单元（MTA）线程中的新任务。因此，你可以使用 `WaitHandle.WaitAll`\
  \ 方法阻塞任务，直到新任务中的所有工作线程完成。\n\n![note](img/note.gif)\n\nWPF 和 Windows Forms 应用的 UI\
  \ 线程都是 STA 线程。因此，你在事件处理程序中编写的代码运行在 STA 线程中。然而，线程池创建 MTA 线程。\n\n代码使用了 `ManualResetEvent`，是因为它必须等待许多事件被设置为信号状态。例如，`WaitHandle.WaitAll`\
  \ 方法需要 `WaitHandle` 数组，而 `ManualResetEvent` 是 `WaitHandle` 的子类；因此，你可以使用 `ManualResetEvent`\
  \ 数组调用 `WaitHandle.WaitAll` 方法。在这种情况下，你无法使用 `ManualResetSlim` 来替换 `ManualResetEvent`，因为\
  \ `ManualResetSlim` 不是 `WaitHandle` 的子类。\n\n## 跟踪动态数量的工作线程\n\n之前的示例是一个典型的 fork/join\
  \ 场景。因此，你可以通过 `CountdownEvent` 跟踪动态数量的工作线程，从而简化同步代码。\n\n列表 8-3 显示了 WPF 应用新版本的代码，该版本使用\
  \ `CountdownEvent` 等待所有项完成。新的代码行已高亮显示。\n\n\n\n\n\n```csharp\npublic MainWindow()\n\
  {\n    InitializeComponent();\n}\n// 线程总数\nprivate int _workerCount = 0;\n// 活跃线程数\n\
  private int _activeWorkers = 0;\n// 一个 CountdownEvent \n// 其初始计数设置为 1\nprivate CountdownEvent\
  \ _countdown =\n    new CountdownEvent(1);\n\nprivate void DoSomeWork(int workerNum)\n\
  {\n    // 模拟一些工作\n    // 时间在 7 到 12 秒之间\n    var milliSecs =\n        new Random().Next(7000,\
  \ 12000);\n    Debug.WriteLine(\n        \"Worker #{0} will simulate work for {1}\
  \ milliseconds \",\n        workerNum,\n        milliSecs);\n    var sw = Stopwatch.StartNew();\n\
  \    // 模拟一些 CPU 密集型工作\n    while (sw.Elapsed.TotalMilliseconds < milliSecs)\n \
  \   {\n        // 继续模拟 CPU 密集型工作\n        double calc = Math.Pow(\n            Math.PI\
  \ * \n            sw.Elapsed.TotalMilliseconds, 2);\n    }\n}\n\nprivate void butLaunchWorker_Click(\n\
  \    object sender, RoutedEventArgs e)\n{\n    // 增加线程计数\n    // 此处不需要原子操作，\n  \
  \  // 因为此代码始终运行在 UI 线程上\n    _workerCount++;\n    // 请求线程池队列\n    // 一个工作项（一个 WaitCallback）\n\
  \    // 并将 _workerCount 作为\n    // 参数传递给 WaitCallback\n    ThreadPool.QueueUserWorkItem(\n\
  \        (state) =>\n        {\n            // 从对象状态中 \n            // 作为参数获取 workerNum\n\
  \            int workerNum = (int)state;\n            // 使用原子操作\n            //\
  \ 增加活跃线程数\n            Interlocked.Increment(\n            ref _activeWorkers);\n\
  \            // 增加共享 CountdownEvent\n            // 的当前计数\n            _countdown.Add(1);\n\
  \            try\n            {\n                Debug.WriteLine(\n            \
  \        \"Worker #{0} started \", workerNum);\n                DoSomeWork(workerNum);\n\
  \                Debug.WriteLine(\n                    \"Worker #{0} finished \"\
  , workerNum);\n                // 为共享的 CountdownEvent\n                // 注册一个信号\n\
  \                // 并减少解阻塞调用\n                // Wait 方法的线程所需的 剩余信号数\n         \
  \       _countdown.Signal();\n            }\n            finally\n            {\n\
  \                // 使用原子操作\n                // 减少活跃线程数\n                Interlocked.Decrement(\n\
  \                ref _activeWorkers);\n            }\n        }, _workerCount);\n\
  }\n\nprivate void butActive_Click(\n    object sender, RoutedEventArgs e)\n{\n \
  \   lblActiveWorkers.Content =\n        String.Format(\n        \"Active workers:\
  \ {0}\",\n        _activeWorkers);\n}\n\nprivate void butWaitAll_Click(\n    object\
  \ sender, RoutedEventArgs e)\n{\n    // 发送一次信号以等于线程数\n    _countdown.Signal();\n\
  \    // 阻塞 UI 线程，直到\n    // CountdownEvent 的信号计数降为 0\n    // 这样阻塞 UI 线程\n    //\
  \ 显然是一个非常糟糕的做法\n    // 这样做仅用于演示目的\n    _countdown.Wait();\n    // 将剩余信号数\n    //\
  \ 重置为 1\n    _countdown.Reset(1);\n    butWaitAll.Content = \"Done!\";\n}\n}\n```\n\
  \n为了运行新应用程序，你必须将 `MainWindow.xaml` 文件中指定的命名空间从 `Listing8_2` 更改为 `Listing8_3`。`MainWindow.xaml`\
  \ 的第一行应如下：\n\n```xml\n<Window x:Class=\"Listing8_3.MainWindow\"\n```\n\n如果你启动许多线程并点击“等待线程完成”（Wait\
  \ For Workers To Finish）按钮，UI 线程将阻塞直到所有线程完成。结果与之前的示例相同。然而，这个新版本没有为每个工作项使用 `ManualResetEvent`\
  \ 实例。新代码使用单个 `CountdownEvent` 实例，它是轻量级的并减少了 `ManualResetEvent` 引入的开销。\n\n共享 `CountdownEvent`\
  \ (`_countdown`) 的初始计数为 1，以避免它被触发。由于 `_countdown` 的初始计数为 1，工作线程可以增加其当前计数。`_countdown`\
  \ 声明为 `MainWindow` 类的私有变量。当线程池中的线程可用时，下行代码增加了 `_countdown` `CountdownEvent` 的当前计数：\n\
  \n```csharp\n_countdown.AddCount(1);\n```\n\n当作为线程池线程运行的代码从 `DoSomeWork` 方法返回时，它会减少解阻塞调用\
  \ `_countdown` `CountdownEvent` `Wait` 方法的线程所需的剩余信号。下行代码调用 `Signal` 方法：\n\n```csharp\n\
  _countdown.Signal();\n```\n\n\n\n\n\nListing 8-4 显示了 WPF 应用主窗口新版本的 C# 代码，它使用 `tasks`\
