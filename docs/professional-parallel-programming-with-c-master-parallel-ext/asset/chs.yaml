  \ Visual Studio 2010 中，如果你断开一个显示器，IDE 将显示这些元素。...（此处略）\n\n# 理解并行任务调试器\n\n在第 3 章“命令式并行”中，你使用了\
  \ Visual Studio 2010 引入的新窗口：并行任务和并行堆栈。现在是学习如何使用这些窗口来调试启动任务的任务了。\n\n按照以下步骤使用并行任务窗口调试示例：\n\
  \n1. 打开项目 `Snippet6_1`。\n2. 将所有的 `ParallelGenerateCP` 替换为 `ParGenAES`。`ParallelGenerateCP`\
  \ 方法名太长，无法在调试器窗口中清晰显示。较短的 `ParGenAES` 名称将使其更容易理解。\n3. 在 `Main` 方法中，在以下代码片段所示的高亮行插入三个断点：\n\
  \n（代码略）\n\n4. 在 `ParGenAES` 方法中，在以下代码片段所示的高亮行插入两个断点：\n\n```csharp\nprivate static\
  \ void ParGenAES(\n    System.Threading.CancellationToken ct,\n    char prefix)\n\
  {\n```\n\n\n\n\n\n```csharp\nvar sw = Stopwatch.StartNew();\n\nvar parallelOptions\
  \ = new ParallelOptions();\n\n// 为 ParallelOptions 实例设置取消取消令牌\nparallelOptions.CancellationToken\
  \ = ct;\n\nParallel.ForEach(Partitioner.Create(1, NUM_AES_KEYS + 1), parallelOptions,\
  \ range =>\n{\n    var aesM = new AesManaged();\n    Debug.WriteLine(\"AES Range\
  \ ({0}, {1}. TimeOfDay before inner loop starts: {2})\",\n                    range.Item1,\
  \ range.Item2,\n                    DateTime.Now.TimeOfDay);\n    for (int i = range.Item1;\
  \ i < range.Item2; i++)\n    {\n        aesM.GenerateKey();\n        byte[] result\
  \ = aesM.Key;\n        string hexString = ConvertToHexString(result);\n        //\
  \ Console.WriteLine(\"AES KEY: {0} \", hexString);\n        if (hexString[0] ==\
  \ prefix)\n        {\n            Keys.Enqueue(hexString);\n        }\n        parallelOptions.CancellationToken.ThrowIfCancellationRequested();\n\
  \    }\n});\n\nDebug.WriteLine(\"AES: \" + sw.Elapsed.ToString());\n```\n\n### 来自\
  \ Snippet7_1 的代码片段\n\n5. 选择 `Debug`调试 → `Start Debugging`开始调试，或按 `F5`。然后，当应用程序的`Console`控制台窗口出现时，按任意键，等待命中第一个断点。\n\
  \n6. 选择 `Debug`调试 → `Windows`窗口 → `Parallel Tasks`并行任务（`Ctrl+D, K`）。IDE 将显示一个新窗口\
  \ `Parallel Tasks`。此时，此窗口显示“无可显示的任务”，因为当前没有正在运行或等待状态的 `Task` 实例。图 7-8 显示了将作为下一语句创建新\
  \ `Task` 实例 `tAsync` 的行，以及没有任何任务的 `Parallel Tasks` 窗口。\n\n图 7-8\n\n![7.8](img/c07f008.jpg)\n\
  \n7. 选择 `Debug`调试 → `Step Over`逐过程执行，或按 `F10`。接下来的行将执行，`tAsync` 将创建：\n\n```csharp\n\
  var tAsync = new Task(() => ParGenAES(ct, 'A'));\n```\n\n8. 再次逐过程执行。接下来的行将执行，`tAsync`\
  \ 将被调度尽快开始执行：\n\n```csharp\ntAsync.Start();\n```\n\n如果你足够幸运，将能够在`Parallel Tasks`窗口中看到列出的任务，并在其\
  \ `Status`状态列中显示调度值。图 7-9 显示了处于已调度状态但尚未运行且未分配线程的任务。表 7.1 解释了 `Parallel Stacks`并行堆栈窗口中\
  \ `Status`状态列的四种可能值。\n\n图 7-9\n\n![7.9](img/c07f009.jpg)\n\n[表 7.1] Parallel Tasks\
  \ 窗口中 Status 列的可能值\n\n| 值 | 描述 |\n| :--- | :--- |\n| Scheduled (已调度) | 一个尚未运行的任务。它没有分配线程、调用堆栈或当前位置信息。\
  \ |\n| Running (运行中) | 在进入调试器中断之前正在执行的任务。它已分配线程，拥有调用堆栈，且窗口显示了其当前位置信息。 |\n| Waiting（等待，线程分配列不为空）\
  \ | 阻塞的任务，正在等待另一个任务完成执行、事件信号触发或锁释放。此状态是 `Running` 任务的特化。该任务已分配线程且正在执行，但调试器在程序进入中断状态时检测到它被阻塞。`Blocked`被定义为任何\
  \ `wait`、`sleep` 或 `join` 状态，例如等待锁。任何 `wait`、`sleep` 或 `join` 状态都可能触发此条件。 |\n| Waiting（等待，线程分配列为空）\
  \ | 一个已经运行过但现在正隐式等待其子任务完成的任务。 |\n| Waiting-Deadlocked（等待-死锁） | 与另一个任务或线程发生死死的阻塞任务。此状态是\
  \ `Waiting` 任务的特化。发现若干任务以循环方式处于等待状态，导致如果它们保持这样，没有任何任务将取得进展。 |\n\n有时，当你逐过程执行上一行时，任务可能会被调度并开始执行，而不仅仅是被调度。在这种情况下，`Parallel\
  \ Tasks`窗口将列出新任务，并在 `Status`状态列中显示`running`运行值。图 7-10 显示了处于运行状态的任务，已分配线程 8868（工作线程）。然而，`Location`位置列中没有显示当前位置，因为任务还没有开始运行托管代码——相反，它正在运行外部代码。\n\
  \n图 7-10\n\n![7.10](img/c07f010.jpg)\n\n如果你将鼠标指针悬停在`Location`位置列中该任务的单元格上，将出现带有[External\
  \ code]外部代码标签的工具提示。为了查看实际堆栈帧，选择 `Tools`工具 → `Options`选项 → `Debugging`调试 → `General`通用并取消勾选`Enable\
  \ My Code`启用我的代码复框。取消此选项后，将鼠标指针悬停在`Location`位置列中任务的单元格上，即可显示正在运行的外部代码的工具提示。\n\n\
  当在任务实例的`Start`方法后逐过程执行时，显示的外部代码将取决于当时运行的外部代码方法。例如，标签可能会显示如图 7-10 所示的值：`mscorlib.dll!System.Threading.Tasks.Execute()\
  \ +0x43 bytes`，因为当前位置位于`Execute`方法。然而，你可以重复上述步骤 5-8 多次，并在工具提示中看到不同的值。表 7-2 解释了可以在`Parallel\
  \ Tasks`窗口中查看的所有列。你可以通过右键点击列标题并在右键菜单中勾选所需的列标题来选择可见的列。\n\n9. 再次逐过程执行。接下来的行将执行，直到`tAsync`完成执行：\n\
  \n```csharp\ntAsync.Wait();\n```\n\n调试器将命中`ParGenAES`方法中的第一个断点。定义新`Task`实例的操作并作为其构造函数参数的匿名方法会在任务开始执行后调用该方法。现在，调试器正在向你显示在`tAsync`任务和工作线程中运行的代码。`Thread\
  \ Assignment`列指定的线程与主线程独立。`Parallel Tasks`窗口在`Task`列中显示初始方法名：`Main.AnonymousMethod\
  \ 15()`。由于代码使用 Lambda 表达式生成委托，因此显示了自动生成的匿名方法名和编号。\n\n`Location`位置列指示`Snippet6_1.ParGenAES`，因为这是任务调用堆栈中的当前方法。图\
  \ 7-11 显示了`Parallel Tasks`窗口显示的信息，以及由于鼠标悬停在`Location`单元格上产生的整个调用堆栈（即堆栈提示）。堆栈允许你看到任务到达当前位置的执行流，相同的执行流也会出现在`Threads`窗口中。如果你想切换到特定的堆栈帧，可以在堆栈列表中双击它。\n\
  \n\n\n\n\n10. 选择 `Debug` → `Windows` → `Call Stack` (Ctrl+D, C)。IDE 将显示 `Call Stack`\
  \ 窗口，其中包含当前任务或线程当前在栈上的方法调用。这些信息与 图 7-11 中 `Parallel Tasks` 窗口中显示的信息相同，但在这种情况下，它以网格形式显示，你可以双击每个方法调用来查看相关代码。图\
  \ 7-12 显示了显示 `tAsync` 任务调用栈的 `Call Stack` 窗口。\n\nFigure 7-12\n\n![7.12](img/c07f012.jpg)\n\
  \n你可以右键点击 `Call Stack` 窗口中的标题行或网格，并使用右键菜单配置栈帧显示的详细程度。图 7-13 显示了勾选了默认选项的右键菜单。你可以选择是否显示模块名称、参数类型、名称和值、行号以及字节偏移。`Parallel\
  \ Tasks` 窗口中的栈顶和 `Parallel Stacks` 窗口中的工具提示也使用此配置来显示信息。\n\nFigure 7-13\n\n![7.13](img/c07f013.jpg)\n\
  \n`Parallel Tasks` 窗口显示了一一列带有图标的列，位于 `ID` 列的左侧。此图标列也出现在 `Threads` 窗口中。该列中可能出现的三个图标如下：\n\
  \n*   白色箭头 — 表示调用调试器时当前执行的任务。该任务被称为断点任务（breaking task）。\n*   黄色箭头 — 表示正在运行代码的当前任务。当前任务是当前线程最顶部的任务。\n\
  *   暂停图标 — 分配给任务的线程已冻结（暂停了执行），在取消冻结之前不会运行代码。你将在本章后面的部分学习如何冻结和恢复任务及其相关线程。\n\nTable\
  \ 7.2 Parallel Tasks 窗口中的列\n\n| 列标题 | 描述 |\n| :--- | :--- |\n| ID | 系统为此任务提供的数字。这是它的唯一标识符，在任务的生命周期内保持不变。\
  \ |\n| Status | 在调试器中中点前的任务状态。每种可能的状态在 表 7.1 中都有解释。 |\n| Location | 任务在调用栈中的当前位置。\
  \ |\n| Task | 创建任务时传递给任务的初始方法及其参数。 |\n| Parent | 创建该任务作为子任务的父任务 ID。当任务没有父任务时，此项为空。不要将\
  \ `Parent` 任务与 `Thread Assignment` 混淆。默认情况下，`Parent` 列是隐藏的。要显示此列，请右键点击 `Parallel\
  \ Tasks` 窗口内的列标题，并在右键菜单中选择 `Parent`。 |\n| Thread Assignment | 分配给支持此任务执行的线程唯一标识符、ID\
  \ 和名称。支持任务执行的线程名称通常为 `Worker Thread`，除非它被内联到 `Main Thread` 上。然而，你可以在调试过程中对其重命名。请记住，用于支持任务执行的线程在任务的生命周期内不会改变。一旦线程被分配用于支持任务，它将一直保持分配直到任务结束。然而，同一个线程可以分配给多个任务，但只有线程栈最顶部的任务在进展。\
  \ |\n| AppDomain | 执行任务的应用程序域。它即进程。 |\n\n# 查看并行堆栈图\n\n按照以下步骤使用 `Parallel Stacks`\
