  \ to complete.\n\nat Listing2_13.Program.<>c_____DisplayClassd.\n\n<ParallelForEachGenerateMD5HashesException>b_____b\n\
  (Int32 number, ParallelLoopState loopState) in\n\nc:\\users\\gaston\\documents\\\
  visual studio 2010\\\nProjects\\Listing2_13\\Listing2_13\\Program.cs:line 220\n\n\
  at System.Threading.Tasks.Parallel.<>c_____DisplayClass32`2.\n<PartitionerForEachWorker>b_____30()\n\
  \nat System.Threading.Tasks.Task.InnerInvoke()\nat System.Threading.Tasks.Task.InnerInvokeWithArg(Task\
  \ childTask)\nat System.Threading.Tasks.Task.<>c_____DisplayClass7.\n<ExecuteSelfReplicating>b_____6(Object\
  \ )\n```\n\n# 指定期望的并行度\n\n有时候，你并不希望在并行循环中使用所有可用的核心，因为你对剩余的可用核心有特定的需求和更好的计划。因此，你想要为并行循环指定最大并行度。TPL\
  \ 方法总是尝试使用所有可用的逻辑核心来获得最佳结果。遗憾的是，在某些情况下，`.NET Framework` 的内部启发式算法会导致注入并利用的线程多于实际所需的数量。在这样的情况下，一种很好的变通方法是指定最大并行度。在其他情况下，你可能想留出一个核心可用，因为你想创建一个响应式的应用程序，而这个核心可以帮助你并行运行另一部分代码。\n\
  \n## ParallelOptions\n\nTPL 允许你通过创建 `ParallelOptions` 类的实例并更改其 `MaxDegreeOfParallelism`\
  \ 属性的值来指定最大并行度。插录 2-15 显示了 `ParallelGenerateAESKeysMaxDegree` 和 `ParallelGenerateMD5HashesMaxDegree`\
  \ 的新版本，这两个是使用 `Parallel.For` 的常用方法。\n\n![download](img/download.gif)\n\n插录 2-15:\
  \ 为 `Parallel.For` 循环指定最大期望并行度\n\n```sharp\nprivate static void ParallelGenerateAESKeysMaxDegree(int\
  \ maxDegree)\n{\n    var parallelOptions = new ParallelOptions();\n    parallelOptions.MaxDegreeOfParallelism\
  \ = maxDegree;\n    var sw = Stopwatch.StartNew();\n    Parallel.For(1, NUM_AES_KEYS\
  \ + 1, parallelOptions, (int i) =>\n    {\n        var aesM = new AesManaged();\n\
  \        byte[] result = aesM.Key;\n        string hexString = ConvertToHexString(result);\n\
  \        // Console.WriteLine(\"AES KEY: {0} \", hexString);\n    });\n    Debug.WriteLine(\"\
  AES: \" + sw.Elapsed.ToString());\n}\n\nprivate static void ParallelGenerateMD5HashesMaxDegree(int\
  \ maxDegree)\n{\n    var parallelOptions = new ParallelOptions();\n    parallelOptions.MaxDegreeOfParallelism\
  \ = maxDegree;\n    var sw = Stopwatch.StartNew();\n    Parallel.For(1, NUM_MD5_HASHES\
  \ + 1, parallelOptions, (int i) =>\n    {\n        var md5M = MD5.Create();\n  \
  \      byte[] data =\n            Encoding.Unicode.GetBytes(\n                Environment.UserName\
  \ + i.ToString());\n        byte[] result = md5M.ComputeHash(data);\n        string\
  \ hexString = ConvertToHexString(result);\n        // Console.WriteLine(\"AES KEY:\
  \ {0} \", hexString);\n    });\n    Debug.WriteLine(\"AES: \" + sw.Elapsed.ToString());\n\
  }\n```\n\n\n\n\n\n所有使用 TPL 创建的代码都运行在多个软件线程上。线程是并行运行许多代码部分的低级通道，它们利用了底层硬件中多个核心的优势。然而，在大多数情况下，运行在这些通道中的代码存在某些缺陷。它会产生延迟影响，需要等待从微处理器中可用的缓存或系统内存中获取数据。这意味着存在执行单元处于空闲状态。一个利用这些空闲单元的简单示例是：让两个线程执行不同类型的数学运算，以便它们可以利用芯片上不同的资源几乎同时地执行任务。\n\
  \n超线程技术（Hyper-Threading Technology）提供了更高的指令级并行性，它通过复制架构状态以便在第一个线程等待时，利用从第二个线程运行的并行代码的缺陷。通过这种方式，微处理器看起来像是一个物理核心数量翻倍的处理器。逻辑核心也被称为硬件线程。\n\
  \n图 2-11 所示的 Windows 任务管理器和图 2-12 所示的资源监视器显示了每个硬件线程的 CPU 使用率。这些图显示了通过超线程具有八个硬件线程的四核微处理器的八个图表。\n\
  \n图 2-11\n\n![3.1](img/c02f011.jpg)\n\n图 2-12\n\n![3.1](img/c02f012.jpg)\n\n## 逻辑核心不是物理核心\n\
  \n理解逻辑核心不同真实的物理核心是非常重要的。有时，当每个物理核心有两个具有独立指令流的线程时，这种技术通过增加指令级并行性来提高性能。然而，如果软件线程之间没有过多的数据依赖，性能提升可能会低于预期。这取决于应用程序的类型。\n\
  \n默认情况下，TPL 使用硬件线程或逻辑核心的数量来优化其执行，而不是物理核心的数量。因此，有时你会发现，随着更多核心的出现，某些算法并没有提供预期的可扩展性，因为它们不是真实的物理核心。\n\
  \n例如，如果一个算法在八个物理核心上执行时提供了 6.5 倍的加速，那么超线程技术将使其在具有四个物理核心和八个逻辑核心的微处理器上提供更保守的 4.5 倍加速。\n\
  \n为了提高性能，你可以同时调用两个方法 `ParallelGenerateAESKeysMaxDegree` 和 `ParallelGenerateMD5HashesMaxDegree`，先使用物理核心的数量，然后使用逻辑核心的数量（硬件线程），并测量使用额外逻辑核心所实现的加速。在具有四核微处理器和八个硬件线程的计算机上，你可以运行这些行：\n\
  \n![download](img/download.gif)\n\n```csharp\nParallelGenerateAESKeysMaxDegree(4);\n\
  ParallelGenerateMD5HashesMaxDegree(4);\n```\n代码片段是 Snippet2_7\n\n然后，运行这些行：\n\n![download](img/download.gif)\n\
  \n```csharp\nParallelGenerateAESKeysMaxDegree(8);\nParallelGenerateMD5HashesMaxDegree(8);\n\
  ```\n代码片段是 Snippet2_8\n\n然而，在相似的条件下运行上述两个代码片段是非常重要的。在某些特定的硬件配置中，当并行程度设置为 4 时，这个简单的示例运行了\
  \ 5.20 秒，而设置为 8 时运行了 4.60 秒。当添加四个逻辑核心时，额外的加速比率为 5.20 / 4.60 = 1.13 倍。这个示例表明，理解底层硬件对于测试可扩展性和避免得出错误结论非常重要。\n\
  \n# 使用甘特图检测临界区域\n\n一旦你根据具有数据并行性的循环检测出可并行的热点，你就可以使用之前学习的 TPL 结构来尝试利用多个逻辑核心。然而，如第\
  \ 1 节所述，临界区域始终存在，并可能尽可能地减少通过并行实现的加速。\n\n与传统的顺序编程一样，并行编程不仅仅是编写代码。良好的设计总是有帮助。甘特图是一种通常用于说明项目进度和关联任务之间依赖关系的条形图。因此，它是帮助检测临界区域的有用图表，在这些区域中并行化极其困难或几乎是不可能的。\n\
  \n你可以通过甘特图来理解任务之间的依赖关系，并决定哪些任务可以并行运行，哪些不能。这样，就很容易找到临界区域了。图 2-13 描述了如何利用甘特图实现此目的。\n\
  \n![note](img/note.gif)\n\n在设计解决方案时，考虑并发执行的可能性是非常重要的。甘特图是帮助你在复杂算法中寻找并行可能性的强大工具。\n\
  \n图 2-13\n\n![3.1](img/c02f013.jpg)\n\n# 总结\n\n还有许多关于数据并行的高级主题。本章通过概述 .NET 4 引入的基于任务模型的某些类、结构和枚举，仅触及了表面。本章还讨论了使用命令式语法进行并发并行设计的相关概念。总结本章：\n\
  \n* 你必须考虑到并发和并行性进行规划和设计。TPL 提供的结构简化了创建利用多核架构代码的过程。\n* 你不需要重新编译代码即可利用额外的核心。TPL 根据运行时硬件资源通过负载均衡调度优化并行循环和任务分配。\n\
  * 你可以创建并行循环。\n* 在处理并行循环时，必须考虑到执行顺序的缺失。\n* 你可以使用简单的代码行启动并行任务。然而，你还必须为进一步的可扩展性做好代码准备。\n\
  * 在设计解决方案时，你必须考虑临界区域并考虑并行可能性。\n* 你必须考虑物理核心的数量和硬件线程的数量来衡量可扩展性并得出正确的结论。\n* 你可以使用 Lambda\
  \ 表达式和匿名委托来简化并行代码的创建。\n\n# 第 3 章：命令式任务并行\n\n本章包含哪些内容？\n\n* 理解任务并行问题\n* 理解 .NET 4\
  \ 引入的新型基于任务的模型，以及 TPL 提供的任务特定实现\n* 启动、控制、管理和同步并行任务\n* 将现有的顺序代码转换为并行化代码\n* 从异步任务返回值\n\
  * 将同步代码与异步代码结合\n* 使用延续（continuations）混合并行和顺序代码\n* 使用任务带有临界区域编写复杂的并行算法\n\n正如第 2 节“命令式数据并行”所述，数据并行并不是并行性的唯一形式。在\
  \ .NET Framework 4 之前，需要创建和管理多个线程或使用线程池来利用多核技术或多处理器。现在，你可以使用新的 Task 实例用简单的代码解决命令式任务并行问题和复杂的算法。在本章中，你将学习这个新的\
  \ .NET Framework 4 模型。\n\n\n\n\n\n本章介绍了新的类、结构和枚举，这些内容允许你处理命令式的任务并行化场景。它解释了如何使用任务（tasks）而不是线程来创建并行代码，并描述了与每个场景相关的新概念。在本章结束时，你将理解如何使用新的基于任务编程模型提供的基础和复杂功能，来并行实现现有算法。\n\
  \n## 创建和管理任务\n\nTPL 引入了新的基于任务的编程模型，将多核优势转化为应用程序性能，而无需处理底层、更复杂且重量级的线程。非常重要的一点是，任务并不是线程。任务使用线程运行。但这并不意味着它们替代了线程。事实上，第\
  \ 2 章中使用的所有并行循环都在创建任务，它们的并行和并发执行由图 3-1 所示的底层线程提供支持。\n\n图 3-1\n\n![3.1](img/c03f001.jpg)\n\
  \n任务代码使用底层线程（软件线程，调度在特定的硬件线程或逻辑核心上）运行。然而，任务和线程之间并不是 1 1 的关系。这意味着你不需要在每次创建一个新任务时创建一个新线程。通用语言运行时\
  \ (`CLR`) 会创建必要的线程来支持任务的执行需求。当然，这只是创建任务时发生情况的简化视图。\n\n在多个线程中运行同步代码确实是复杂的。因此，基于任务的方法提供了一种极佳的替代方案来忽略某些同步问题，特别是关于工作调度机制的问题。`CLR`\
  \ 使用工作窃取队列（work-stealing queues）来减少锁并在不增加显著开销的情况下调度小工作块。创建新线程会引入巨大的开销，但创建新任务则是从现有线程中“窃取”工作，如图\
  \ 3-2 所示。因此，任务提供了一种新的轻量级机制，用于创建许多能够利用多核的代码部分。\n\n图 3-2\n\n![3.2](img/c03f002.jpg)\n\
  \n默认任务调度器依赖于底层的线程池引擎。因此，当你创建一个新任务时，它使用工作窃取队列来找到最合适的线程将其入队。任务中的代码将在一个线程中运行；然而，这会在底层发生，而且开销实际上比手动创建一个新线程要小。\n\
  \n## System.Threading.Tasks.Task\n\nTPL 在底层创建 `System.Threading.Tasks.Task` 实例，以支持第\
  \ 2 章中解释的迭代的并行执行。当你调用 `Parallel.Invoke` 时，它还会创建与委托调用次数相等的 `Task` 实例。\n\n`Task` 代表一个异步操作。它提供了许多方法和属性，允许你控制其执行并获取有关状态的信息。`Task`\
  \ 的创建与其执行是独立的。这意味着你对关联操作的执行具有完全控制权。表 3.1 了 `Task` 实例的只读属性。\n\n表 3.1 Task 只读属性\n\n\
  | 属性 | 解释 |\n| :--- | :--- |\n| `AsyncState` | 创建 `Task` 实例时提供的状态对象。 |\n| `CreationOptions`\
  \ | 使用的 `TaskCreationOptions` 值用于向任务调度器提供提示，帮助其做出正确的调度操作。 |\n| `CurrentId` | 正在执行的\
  \ `Task` 的唯一 ID。它不等于未托管代码中的线程 ID。这是一个静态属性。你只应将其用于调试。 |\n| `Exception` | 导致 `Task`\
  \ 提前结束的 `AggregateException`。如果 `Task` 在没有抛出异常的情况下完成，则值为空。 |\n| `Factory` | 提供对工厂方法的访问，允许创建带结果或不带结果的\
  \ `Task` 实例。这是一个静态属性。 |\n| `Id` | `Task` 实例的唯一 ID。 |\n| `IsCanceled` | 表示 `Task`\
  \ 实例是否被取消的布尔值。 |\n| `IsCompleted` | 表示 `Task` 是否已完成执行的布尔值。 |\n| `IsFaulted` | 表示\
  \ `Task` 是否由于未处理的异常而中止执行的布尔值。 |\n| `Status` | `TaskStatus` 值，指示 `Task` 实例生命周期中的当前阶段。\
  \ |\n\n![note](img/note.gif)\n\n当你作为 `Task` 实例启动许多异步操作时，任务调度器将尝试并行运行它们，以利用运行时可用的逻辑核心。它将尝试负载均衡所有可用核心的工作。然而，非常重要的一点是，使用任务运行任何代码片段并不方便的，因为任务会增加开销。这种开销比线程增加的开销要小；但它仍然是必须考虑的开销。例如，创建任务来运行两行代码作为两个独立的、解决非常简单计算的异步任务，是没有任何意义的。记住测量并行执行与顺序版本之间所实现的加速比，以决定并行化是否合适。如第\
  \ 1 章“基于任务的编程”和第 2 章所述，在测量加速比时考虑底层硬件也是非常重要的，以避免错误的结论。\n\n## 理解任务的状态和生命周期\n\n理解每个\
  \ `Task` 实例都经历着一个生命周期是非常重要的。`Task` 代表根据底层硬件提供的可能性和运行时资源的可用性执行的并发代码。因此，关于 `Task`\
  \ 实例的任何信息在你检索它时都可能发生，因为它的状态正在并发地变化。\n\n`Task` 实例只完成一次其生命周期。当它到达三个可能的最终状态之一时，它不会回到任何之前的状态，如图\
  \ 3-3 所示。\n\n图 3-3\n\n![3.3](img/c03f003.jpg)\n\n### TaskStatus：初始状态\n\n根据创建方式，`Task`\
  \ 实例有三种可能的初始状态。表 3.2 详细描述了这三种可能性。\n\n| 值 | 描述 |\n| :--- | :--- |\n| `TaskStatus.Created`\
  \ | 使用 `Task` 构造函数创建的 `Task` 实例的初始状态。一旦调用 `Start` 或 `RunSynchronously` 或者任务被取消，该状态将改变。\
  \ |\n| `TaskStatus.WaitForActivation` | 等待其他依赖任务执行后才调度的任务的初始状态。此类任务使用定义延续的方法创建。任务的真实起点是\
  \ `TaskStatus.Created` 状态，但在将任务实例的的引用返回给调用者之前，该状态会变为 `TaskStatus.WaitForActivation`。\
  \ |\n| `TaskStatus.WaitingToRun` | 通过 `TaskFactory.StartNew` 创建的任务的初始状态。它正在等待指定的调度器拾取并运行它。任务的真实起点是\
  \ `TaskStatus.Created` 状态，但在将任务实例的的引用返回给调用者之前，该状态会变为 `TaskStatus.WaitingToRun`。\
  \ |\n\n### TaskStatus：最终状态\n\n\n\n\n随后，Task 实例可以转换到 `TaskStatus.Running` 状态并最终移动到一个最终状态。如果\
  \ Task 实例挂载了子任务，它将不会被认为已完成，而是转换到 `TaskStatus.WaitingForChildrenToComplete` 状态。一旦\
  \ Task 实例的子任务完成，它将移动到 表 3.3 中详细描述的三种可能的最终状态之一。\n\n#### 表 3.3 Task 实例的最终状态\n\n| 值\
  \ | 描述 |\n| :--- | :--- |\n| `TaskStatus.Canceled` | 在任务开始执行之前或执行期间收到了取消请求。如果请求在任务执行期间到达，任务协作确认取消。`IsCanceled`\
  \ 属性将为 true。 |\n| `TaskStatus.Faulted` | 其正体或其挂载子任务的主体中未处理的异常导致任务结束。`IsFaulted`\
  \ 属性将为 true，且 `Exception` 属性非空，并将持有导致任务或其挂载子任务提前结束的 `AggregateException`。 |\n| `TaskStatus.RanToCompletion`\
  \ | 任务完成了执行。它运行到主体末尾，没有被取消或抛出未处理的异常。`IsCompleted` 属性将为 true；`IsCanceled` 和 `IsFaulted`\
  \ 为 false。 |\n\n## 使用 Task 并行化代码\n\n在第 2 章中，你使用了 `Parallel.Invoke` 来并行启动以下两个方法：\n\
  \n![download](img/download.gif)\n\n```csharp\nParallel.Invoke(\n    () => GenerateAESKeys(),\n\
  \    () => GenerateMD5Hashes());\n```\n\n代码段为 `Snippet 3_1`\n\n你可以使用两个 `Task` 实例来完成相同的工作，如\
  \ 列表 3-1 所示。\n\n![download](img/download.gif)\n\n列表 3-1: 使用任务\n\n```csharp\nvar\
  \ t1 = new Task(() => GenerateAESKeys());\nvar t2 = new Task(() => GenerateMD5Hashes());\n\
  // 开始任务\nt1.Start();\nt2.Start();\n// 等待所有任务完成\nTask.WaitAll(t1, t2);\n```\n\n前两行创建了两个\
  \ `Task` 实例，使用 lambda 表达式为 `GenerateAESKeys` 和 `GenerateMD5Hashes` 创建委托。`t1` 与第一个方法关联，`t2`\
  \ 与后一个方法关联。这些方法尚未运行，但任务已准备就绪，因此两个 `Task` 实例的 `Status` 均为 `TaskStatus.Created`。\n\
  \n![note](img/note.gif)\n\n也可以使用带有多行的 lambda 表达式来定义作为参数由 `Task` 构造函数接收的操作。\n\n###\
  \ 启动任务\n\n以下行启动了 `t1` 的异步执行：\n\n```csharp\nt1.Start();\n```\n\n`Start` 方法以独立的方式启动委托的执行，程序流将继续执行该方法之后的指令，即使委托尚未完成执行。与任务关联的委托中的代码与主程序流（也称为主线程）并发运行。此时，有一个主线程以及另一个（或多个）线程在支持此新任务的执行。\n\
  \n主线程的执行是同步的。这意味着它将继续执行下一条指令，即启动 `t2` 异步执行的行代码：\n\n```csharp\nt2.Start();\n```\n\
  \n现在，`Start` 方法以另一种独立的方式启动委托的执行，程序流将继续执行该方法之后的指令，即使另一个委托尚未完成执行。与任务关联的委托中的代码与主线程以及已经在运行的\
  \ `GenerateAESKeys` 内部的代码并发运行。这意味着此时，有一个主线程以及其他线程在支持两个任务的执行。\n\n![note](img/note.gif)\n\
  \n使用 `Task` 实例和 C# 中添加的最新语言改进来运行异步代码是非常简单的。只需几行代码，你就可以创建异步运行的代码，控制其执行流，并利用多核微处理器或多个处理器的优势。\n\
  \n图 3-4 所示的序列图显示了主线程和两个任务的并行及异步执行流。\n\n图 3-4\n\n![3.4](img/c03f004.jpg)\n\n### 使用并行任务和并行栈可视化任务\n\
  \nVisual C# 2010 集成开发环境（IDE）提供了两个新的调试窗口：`Parallel Task` 和 `Parallel Stacks`（并行栈）。这些窗口显示了正在运行的任务的信息、它们的状态以及与底层线程之间的关系。理解新任务与底层线程之间的关系非常容易。\n\
  \n\n\n\n与 Visual C# 以前版本处理线程的方式类似，你可以检查每个并发任务的运行情况。然而，当前版本的 IDE 提供了更好的信息，因为你可以检查任务是处于调度状态还是等待-死锁状态。你可以像使用任何其他\
  \ Visual C# IDE 功能一样，对窗口中显示的信息进行排序和分组。\n\n“并行任务（Parallel Tasks）”网格包含一个“线程分配（Thread\
  \ Assignment）”列，其中包含线程 ID。该 ID 从“线程”窗口获取，该窗口显示所有线程的列表、其类别和位置，如图图 3-9 所示。你可以通过选择`Debug\
  \ → Windows → Threads` 来访问此窗口，并使用它来检查哪个托管线程正在支持某个任务的执行，找出下一条语句是什么，并获取每个线程的其他详细信息。\n\
  \n图 3-9\n\n![3.9](img/c03f009.jpg)![note](img/note.gif)\n\n如你在图中所示，“线程”窗口使用不同的颜色和名称来区分不同类型的线程。通常运行用户界面\
  \ (UI) 代码或支持 `Main` 方法的线程被称为“主线程（Main Thread）”，旁边显示一个绿色正方形，而其他线程被称为“工作线程（Worker\
  \ Threads）”，旁边有黄色正方形。工作线程支持任务的执行。因此，工作线程必须使用委托来更新 UI，以便为了此目的在主线程中运行代码。事实上，更新 UI\
  \ 是基于任务的编程模型中的一个复杂话题，你将在接后的章节中学习相关的详细技术。\n\n有一种更简单的方法来可视化任务和线程之间的关系。你可以选择`Debug\
  \ → Windows → Parallel Stacks`。IDE 将显示一个新窗口（“并行栈（Parallel Stacks）”），显示包含所有任务或线程及其状态和关系的图表。默认视图是“线程（Threads）”，如图图\
  \ 3-10 所示。\n\n图 3-10\n\n![3.10](img/c03f010.jpg)\n\n图表右侧的两个线程正在运行两个任务调度的代码。每个线程都显示其调用栈。支持\
  \ `Module1.<lambda12>` 的线程正在运行 `GenerateAESKeys` 方法，具体是调用 `ConvertToHexString` 方法内部的代码。支持\
  \ `Module1.<lambda13>` 的线程正在运行 `GenerateMD5Hashes` 方法，它显示了许多原生代码到托管代码的转换反之亦然。此图表让你以非常详细的程度了解每个线程正在做什么。\n\
  \n你可以将左上角组合框的值从 `Threads` 更改为 `Tasks`，IDE 将显示一个包含所有任务及其状态、关系和调用栈的图表，如图图 3-11 所示。\n\
  \n图 3-11\n\n![3.11](img/c03f011.jpg)![note](img/note.gif)\n\n你可以使用之前说明的窗口来理解任务和线程之间的关系。你必须学习新技术来调试基于任务的代码。第\
  \ 7 章“Visual Studio 2010 任务调试能力”将深入探讨 IDE 提供的新功能，允许你调试任务、线程以及并发和并行代码。\n\n## 等待任务完成\n\
  \n在某些时刻，你需要等待通过异步执行启动的某些任务完成。\n\n下行代码调用了 `Task.WaitAll` 方法，它将等待作为 `params` 数组接收的、用逗号分隔的\
  \ `Task` (`Task[]`)  实例。该方法是同步执行的。这意味着在作为参数的 `Task` 实例完成执行之前，主线程不会继续执行后续语句。\n\n\
  ```\nTask.WaitAll(t1, t2);\n```\n\n在这种情况下，`t1` 和 `t2` 必须完成它们的执行。当前线程（在这种情况下是主线程）将等待两个任务都完成执行。等待任务完成的时间使用轻量级机制，以尽可能减少对\
  \ CPU 周期的需求。一旦这些任务完成执行，下一条语句就会运行。\n\n## 忘记复杂线程\n\n如前所述，`Task.WaitAll` 方法使用同步执行，因此如果任务运行需要\
  \ 1 分钟，当前线程在此期间将一直等待。然而，如果你想限制等待任务完成的毫秒数，可以使用 `Task.WaitAll` 方法的定义，该方法接受 `Task`\
  \ 实例数组和要等待的毫秒数。该方法返回一个 `bool` 值，指示任务是否能在指定的超时时间内完成。以下代码如下：\n\n在这种情况下，`t1` 和 `t2`\
  \ 必须完成它们的执行。当前线程（在这种情况下是主线程）将等待两个任务都完成执行。等待任务完成的时间使用轻量级机制，以尽可能减少对 CPU 周期的需求。一旦这些任务完成执行，下一条语句就会运行。\n\
