  \ 方法的线程所占用。没有其他核心能够运行并发代码来更改自旋正在监控的条件。请记住第一章“基于任务的编程”中解释的交错并发（interleaved concurrency）与并发（concurrency）之间的区别。\n\
  \n在大多数情况下，你可以决定在让出之前停止自旋，并可以使用一个轻量级手动重置事件（lightweight manual reset event）通过信号来通知其他任务或线程事件已发生。信号的成本比自旋高。然而，你可以结合“自旋直到需要让出”以及“发送信号”。让出是昂贵的，由于开销原因，一直自旋和让出是没有意义的。记住\
  \ `SpinWait.SpinUntil` 方法提供了一种智能行为，当等待时间极短时可以提供良好的结果。\n\n![note](img/note.gif)\n\
