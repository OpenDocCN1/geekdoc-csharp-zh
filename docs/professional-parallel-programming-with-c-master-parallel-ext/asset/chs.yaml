  Michael Trent\n\n## 关于作者\n\n![2.1](img/f05uf001.jpg)\n\nGASTÓN C. HILL 从八岁起就开始接触电脑。他在\
  \ 20 世纪 80 年代初开始使用传奇的 `TI-99/4A` 和 Commodore `64` 家用电脑进行编程。他在 UADE 大学获得学士学位并优异毕业，在\
  \ UCEMA 大学获得工商管理硕士学位，其论文表现出色。\n\nGastón 自 1997 年以来一直研究并行编程、多处理器和多核技术。他拥有 14 年的经验，用于设计和开发利用\
  \ `C#` 和 `.NET Framework` 多核优势的各种复杂并行解决方案。从第一个社区技术预览（CTP）开始，他一直在使用 `Parallel Extensions`。他深度参与了\
  \ `.NET` 平台的咨询、培训和开发，专注于为现代硬件创建高效的软件。他经常在世界各会议上就软件开发进行演讲。2009 年，他获得了 Intel® 黑带软件开发者奖。\n\
  \nGastón 编写了四本英文书，为其他两本书贡献了章节，并用西班牙语写了 40 多本书。他为 [www.drdobbs.com](http://www.drdobbs.com)\
  \ 的 Dr Dobb's 以及 GoParallel 编程门户 [www.ddj.com/go-parallel/](http://www.ddj.com/go-parallel/)\
  \ 稿，并在 Intel Software Network ([`software.intel.com`](http://software.intel.com))\
  \ 当客座博客。\n\n他曾在阿根廷布宜诺斯艾利斯的许多公司担任过开发者、架构师和项目经理。现在，他是一名独立顾问，为多家美国、德国、西班牙和拉丁美洲公司工作，并是一名自由作家。他一直在寻找世界各地的新冒险。\n\
  \n他与妻子 Vanesa 和儿子 Kevin 一起生活。\n\n你可以通过 gastonhillar@hotmail.com 联系他，并在 Twitter 上关注他：[`twitter.com/gastonhillar`](http://twitter.com/gastonhillar)。Gastón\
  \ 的博客地址是 [`csharpmulticore.blogspot.com`](http://csharpmulticore.blogspot.com)。\n\
  \n## 关于技术编辑\n\nDoug Parsons 是一位软件架构师，担任 NJI New Media 的俄亥州运营总监。他的专长是 Web 开发，特别是政治网站。最重要的是，他曾参与过\
  \ 2008 年约翰·凯恩总统竞选网站，以及米特·罗姆尼官方书籍巡回网站。在空闲时，他喜欢与可爱的未婚妻 Marisa 以及他们的小狗度过时光。\n\n## 致谢\n\
  \n并行编程是最难编写的主题之一。通常，在不引用许多密切相关主题的情况下孤立主题是非常困难的。然而，在制作这一极挑战性主题书籍的所有必要阶段，我得到了巨大的帮助。\n\
  \n特别感谢 Paul Reese、Edward Connor、Ginny Munroe 和 Rosemarie Graham —— 他们非常有耐心，并允许我对章节进行必要的修改，以包含最准确和适当的信息。这本书需要大量工作，他们也理解编写关于并行编程的高级书籍与编写其他编程主题书籍有所不同。他们的努力使这本书成为可能。此外，我必须感谢\
  \ Doug Parsons 和 Kathryn Duggan。当你阅读每个句子时都会注意到他们的改进。\n\n\n\n\n我要感谢微软并行计算平台（Parallel\
  \ Computing Platform）团队首席计划经理 Stephen Toub，他为所有的章节都提供了宝贵的反馈。通过吸收 Stephen 深刻的见解，我改进了示例和内容。如果没有\
  \ Stephen 的帮助，这本书将非常难完成。他团队的博客地址为 `blogs.msdn.com/b/pfxteam/`）的编辑 Jon Erickson。Jon\
  \ 给了我机会为 Dr. Dobb's 和 Dr. Dobb's Go Parallel（[www.ddj.com/go-parallel/](）贡献，以便与其他开发者和架构师分享我的经验。这本书包含了从我的贡献中获得的绝佳反馈。\n\
  \n我要感谢 Hector A. Algarra，他一直帮助我提高写作水平。\n\n特别感谢我的妻子 Vanesa S. Olsen、我的儿子 Kevin、我的侄子\
  \ Nicolas、我的父亲 Jose Carlos、我的姐姐 Silvina 和我的母亲 Susana。在本书的制作期间，他们是我最大的支持者。\n\n最后，感谢你们选择这本书。我希望你们从书中获得的并行编程知识能帮助你们开发出强大、高性能的应用程序以及响应良好的用户界面。\n\
  \n# 前言\n\naParllel prgoamrmnig s i ahdr. 嗯，让我重试一次。并行编程是困难的。\n\n虽然这是一个非常愚蠢的例子，但我的第一句话概括了我们作为开发者在编写多线程代码时面临的一些困难。当我写这篇序言时，在我笔记本电脑上打字的手手实际上是两个不同的物理过程，如果你进一步考虑我的每个手指都是一个独立的实体，那么计数将变为\
  \ `10`。我通常被认为是一个打字很快的人，为了达到每分钟超过 100 个单词的速度，我的大脑能够协调所有的手指，让它们并发地流向下一个目标，同时（在大多数情况下）确保它们的输出根据我大脑想要让手呈现的单词拼写进行正确的序列化。为了写第一句话，我刻意悬停了这种协调，导致我的手不再正确同步。结果是一个几乎不可读的思想表述。幸运的是，它很容易被调试。\n\
  \n并行编程确实很困难，或者至少在历史上一直是如此。凭借现有的工具，只有极少数的软件开发者在这一门艺术上足够精通，能够成功地开发和调试多线程应用程序。然而，自现代计算机出现以来，需要编写响应式用户界面、构建可扩展服务或利用多个处理器核心提升性能的开发者被迫处理并发问题，被迫在线程、`mutexes`（互斥锁）和\
  \ `semaphores`（信号量）层级开发软件。这里的困难随处可见：过度订阅（oversubscription）、竞态条件、死锁、活锁（live locks）、双步舞、优先级反转、锁争队、竞争和假共享，这只是列举一斑。\n\
  \n由于所有这些复杂性以及近期行业向多核和许多核的转变，并行编程受到了构建开发平台的公司的的高度关注，其中微软首首。几年前，微软的并行计算平台团队带着明确的愿景和目标出现：让构建并行化软件变得简单。开发者应该能够轻松地表达应用程序中存在的并行性，并允许底层框架、运行时操作系统为他们实现这种并行性，将表达的并行性映射到硬件以实现正确高效的执行。并行计算平台团队支持的第一批组件于\
  \ 2010 年 4 月作为 `Visual Studio 2010` 的一部分发布；无论你使用的是原生代码还是托管代码，此版本都为简化并行应用程序的提供了基础工作。对于使用托管代码的开发者，这包括\
  \ `Task Parallel Library`（任务并行库）、`Parallel LINQ`、新的 `Parallel Stacks`（并行栈）和 `Parallel\
  \ Tasks`（并行任务）调试窗口，一个可以对你的多线程应用程序执行提供深层见解的 `Concurrency Visualizer`（并发可视化器）等。\n\n\
  尽管有了所有这些支持，并行编程仍然需要深入的知识。在这个以 140 字格言形式进行大量交流的时代，我个人认为没有比高质量书籍更能传达这种深度知识的媒介了。幸运的是，你现在正在读其中一本。在这里，Gastón\
  \ Hillar 提供了一本详尽的书，涵盖了使用 `Visual Studio 2010` 和 `.NET Framework 4` 开发并行应用程序的所有方面。从基于任务的编程到数据并行，从管理共享状态到调试并行程序，从\
  \ `Task Parallel Library` 到 `Parallel LINQ`、`ThreadPool` 以及新的同步原语，Gastón 为 `.NET\
  \ Framework 4` 和 `Visual Studio 2010` 中现有的海量并行编程支持提供了一个非常受欢迎且深入的导览。这本书包含了一些信息，可以为你提供开发并行应用程序时所需的坚实基础知识。祝喜你进入了这一勇敢的许多核世界。\n\
  \n—Stephen Toub\n首席计划经理\n并行计算平台\n微软公司\n华盛顿红德\n2010 年 9 月\n\n# 引言\n\n2007 年，微软发布了\
  \ `.NET Framework` 并行扩展的首个社区技术预览（CTP）。旧的 `.NET Framework` 多线程编程模型对于即将到来的多核和许多核 CPU\
  \ 来说太复杂、太重了。我从 1997 年就开始研究并行编程、多处理器和多核，因此我不禁安装了第一个 CTP 并进行了尝试。显然，这将是未来 C# 版本中表达并行的一种令人兴奋的新方式。\n\
  \n\n\n\nVisual Studio 2010 带有第 4 版本的 `.NET Framework`，这是第一个包含并行扩展（Parallel Extensions）的发行。`C#\
  \ 4` 和 `.NET Framework 4` 允许你转向现代基于任务的编程模型来表示并行性。编写利用多核微处理器的代码变得更加简单。现在，你可以编写随可用核心数量增加而扩展的代码，而无需处理处理复杂的托管线程。你能够编写运行任务的代码，而公共语言运行时（`CLR`）将为你注入必要的线程。运行利用多核优势的数据并行算法变得非常容易。\n\
  \n在写本文时，多核微处理器已无处不在。服务器、桌面电脑、笔记本电脑、笔记本本、上网电脑、移动互联网设备（MIDs）、平板电脑甚至智能手机都在使用多核微处理器。在未来的几年里，每个微处理器的平均核心数将增加。你打算错失将这种多核力量转化为应用程序性能的机会吗？\n\
  \n并行编程必须成为你技能 set 的一部分，以便在 `C#` 中为现代硬件高效开发应用程序。在 Visual Studio 2010 正式发布之前，我花了三个多的时间研究不同版本的并行扩展。我喜欢用\
  \ `C#` 开发并行化应用程序，并尽力在书中对最常见的场景提供解释。\n\nVisual Studio 2010 提供了一个为并行开发人员准备的 IDE，而\
  \ `C#` 是新的基于任务的编程模型的完美契合。\n\n# 本书的读者群\n\n本书的编写旨在帮助经验丰富的 `C#` 开发者通过使用 `.NET Framework\
  \ 4` 中引入的并行扩展，将现代微处理器中发现的多核力量转化为应用程序性能。对于那些刚刚开始从以前的多线程模型进行过渡的人，以及那些已经处理过并发和并行代码一段时间并需要获得更深理解的人，本书提供了你所需的最常见的并行编程技能和概念信息。\n\
  \n本书对并行编程概念进行了广泛的介绍，但使用 `C#` 和 `.NET Framework 4` 的并行编程可能性如此巨大且全面，没有任何一本书能够涵盖所有内容。本书的目标是为关键技术提供可操作的知识，这些技术对于想要利用多核和许多核架构的\
  \ `C#` 开发者至关重要。它为经验丰富的 `C#` 开发者在许多高级并行领域工作提供了足够的知识。本书涵盖了新的基于任务的编程模型。一些对分布式并行和低级并发编程主题感兴趣的开发者，可能会通过其他专门针对这些技术领域的书籍来补充本书的知识。\n\
  \n本书提供了避免常见的并行编程陷阱非常重要的背景信息；因此，最好不要跳过章节进行阅读。此外，在考虑该章节中间的代码为最佳实践之前，你应该完成该章节的阅读。由于每个都引入了并行扩展的新功能，示例通过更简单更高效的编码技术得到了增强。\n\
  \n本书假设你是一个经验丰富的 `C#` 和 `.NET Framework 4` 开发者，并专注于并行编程主题。如果你没有高级面向对象编程、列表、数组、闭包、委托、lambda\
  \ 表达式、`LINQ`、类型转换和基础调试技术的经验，你可能需要额外的培训才能完全理解所示的示例。\n\n# 本书涵盖\n\n本书涵盖了以下关键技术和概念：\n\
  \n* 现代多核和许多核共享内存架构\n* 使用任务并行库 (`TPL`)、`C#` 和 `.NET Framework 4` 进行高级、基于任务的编程\n*\
  \ 并行集成查询 (`PLINQ`)\n* 任务编程中最常用的协调数据结构和同步原语\n* 与并行编程相关的 Visual Studio 2010 调试和分析功能\n\
  * 帮助你在实际应用中掌握多核编程的其他库、工具和额外\n\n本书不涵盖旧的多线程编程模型或分布式并行。\n\n# 本书的结构\n\n首先掌握某些主题至关重要。除非你以前具有\
  \ `.NET Framework 4` 中引入的基于任务的编程模型的经验，否则你应该逐章节阅读本书。每个章节的编写都假设你已经阅读了上一个章节。然而，如果你以前使用过\
  \ `TPL` 和 `PLINQ`，你将能够阅读并理解并行调试和调优相关的章节内容。\n\n本书分为以下 11 章和三个附录：\n\n**第 1 章，“基于任务的编程”**\
  \ —— 探索新的基于任务的编程模型，该模型允许你在 `.NET Framework 4` 应用程序中引入并行性。并行对于利用现代多核和许多核架构至关重要。本章描述了新的轻量级并发模型以及与并发并行相关的重要概念。阅读这一章很重要，因为它包含了必要的背景信息，以便为接下来的\
  \ 10 章和三个附录做好心理准备。\n\n**第 2 章，“命令式数据并行”** —— 开始学习 `C# 4` 和 `.NET Framework 4` 引入的新编程模型，并将它们应用于纯数据并行问题。本章涉及一些新的类、结构体和枚举，这些元素允许你处理数据并行场景。运行示例以理解性能的提升。\n\
  \n**第 3 章，“命令式任务并行”** —— 开始使用新的 `Task` 实例用简单的代码解决命令式任务并行问题和复杂算法。本章涉及新的类、结构体和枚举，这些元素允许你处理命令式任务并行场景。使用新的基于任务的编程模型提供的基础和复杂特性并行实现现有算法。使用任务而不是线程创建并行代码。\n\
  \n**第 4 章，“并发集合”** —— 基于任务的编程、命令式数据和任务并行需要能够并发更新的数组、列表和集合。使用新的并发集合来简化代码并实现最佳性能。本章涉及允许你从多个任务处理共享并发集合的新类和新接口。它解释了如何创建并行代码，在不同排序方案和结构的列表中添加、删除和更新不同类型的值。\n\
  \n**第 5 章，“协调数据结构”** —— 同步不同并发任务执行的工作。本章涵盖了一些经典的同步原语和 `.NET Framework 4` 引入的新的轻量级协调数据结构。学习不同的方案很重要，以便为每个需要在多个任务之间进行通信和/或同步的并发场景选择合适的一个。这是书中最复杂的章节，也是最重要的章节之一。在编写复杂的并行化算法之前，务必阅读它。\n\
  \n\n\n\n\n## 第 6 章，“PLINQ：声明式数据并行化” —— 使用并行语言集成查询 (`PLINQ`) 及其聚合函数进行声明式数据并行化工作。你可以使用\
  \ `PLINQ` 来简化运行混合了任务分解和数据分解任务的代码。你还可以执行经典的并行 Map Reduce 算法。本章结合了之前章节中介绍的许多主题，并解释了如何将\
  \ `LINQ` 查询转换为 `PLINQ` 查询。此外，本章还教授了根据不同场景调整 `PLINQ` 并行执行的不同技术。\n\n## 第 7 章，“Visual\
  \ Studio 2010 任务调试能力” —— 充分利用 Visual Studio 2010 中引入的新任务调试功能。本章介绍了新窗口如何显示有关任务的重要信息，以及任务与源代码和支持其执行的线程之间的关系。在\
  \ `.NET Framework 4` 中处理并行化代码时，使用这些新窗口检测并解决潜在的错误。\n\n## 第 8 章，“线程池” —— 理解使用任务与直接请求在线程池中运行的工作项之间的区别。如果你在使用线程池，可以利用新的改进并将代码迁移到基于任务的编程模型。本章介绍了在\
  \ `.NET Framework 4` 中引入的 `CLR` 线程池引擎的变化，并提供了一个自定义任务调度器的示例。\n\n## 第 9 章，“异步编程模型”\
  \ —— 利用将现有异步编程模型与任务混合的优势。本章提供了真实示例，利用任务和延续的简单性来执行与现有异步编程模型相关的并发异步作业。此外，本章还教授了并发编程相关的最复杂的话之一：从不同的任务和线程更新用户界面\
  \ (UI)的过程。本章解释了在 Windows Forms 和 Windows Presentation Foundation (`WPF`) 应用程序中更新\
  \ UI 的模式。\n\n## 第 10 章，“并行测试与调优” —— 利用 Visual Studio 2010 专业版和旗舰版引入的新并发性能分析功能。学习与\
  \ `.NET Framework 4` 并行代码相关的常见且易于检测的问题是非常重要的。本章解释了用于创建和运行并行测试及基准测试的不同技术。它还教你如何根据每次分析会议的结果重构现有应用程序。\n\
  \n## 第 11 章，“向量化、SIMD 指令和额外的并行库” —— 利用现代硬件提供的与并行相关的其他可能性。`.NET Framework 4` 未提供对\
  \ `SIMD` 或向量化的直接支持。然而，大多数现代微处理器提供了这些强大的额外指令。因此，你可以使用优化过的库来利用这些指令带来的性能提升。本章解释了如何使用\
  \ `C#` 将 Intel Math Kernel Library 集成到基于任务的编程代码中。此外还解释了如何使用 Intel Integrated Performance\
  \ Primitives 优化关键区域。\n\n## 附录 A，“.NET 4 并行类图” —— 本附录包含了支持新型轻级并发模型和底层线程模型并行的类、接口、结构、委托、枚举和异常的图表。还引用了详细解释这些图表内容的章节。\n\
  \n## 附录 B，“并发 UML 模型” —— 本附录提供了一些示例，说明如何使用 UML 模型表示为并发准备的设计和代码。你可以通过添加一些简单且标准的视觉元素来扩展经典模型。\n\
  \n## 附录 C，“Parallel Extensions Extras” —— Parallel Extensions Extras 是一个补充项目，它不属于\
  \ `.NET Framework 4` 的类，但它是微软作为 `.NET Framework 4` 并行编程示例的一部分而开发的。本附录包含了构成 Parallel\
  \ Extensions Extras 的类和结构的图表及简要描述。\n\n# 使用本书的必要条件\n\n为了从书中获得最大的收益，你需要 Visual Studio\
  \ 2010 专业版或旗舰版，这些版本包含了 `.NET Framework 4` 和并发性能分析功能。你也可以使用 Visual Studio 2010 标准版，但该版本不提供并发性能分析功能。你不应该使用\
