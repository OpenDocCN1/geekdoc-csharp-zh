  \n# 跟踪并发代码\n\n在运行并行代码的应用程序调试会话中，调试器每次执行许多任务中的指令。这与单线程应用程序的调试会话非常不同。在并行化代码中，单次步入或跳过意味着许多任务中许多语句的执行。调试器会步入或跳过当前语句，但其他活动任务或线程会在步入或跳过的期间恢复执行。这会改变它们的调用堆栈。\n\
  \n默认情况下，在具有多个运行任务或线程的应用程序中进行步入或跳过时，当前任务或线程会在每个步进之间切换。因此，你必须特别注意并行任务窗口中显示的黄色箭头，以确定你的当前任务。当你使用线程而不是任务时，必须检查线程窗口中显示的黄色箭头。\n\
  \n按照以下步骤查看在调试并行化代码时，并行任务、并行堆栈和线程窗口中的信息如何变化：\n\n1.  多次步入代码，直到进入`ConvertToHexString`方法。你会发现，每次步入代码时，调试器都会从一个任务切换到另一个任务，并且程序流并没有按顺序从一个语句移动到下一个语句。\n\
