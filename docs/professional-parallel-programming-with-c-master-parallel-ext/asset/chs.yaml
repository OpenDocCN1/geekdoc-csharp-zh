  \ 将禁用执行分页（executive paging）并重启你的计算机。当禁用执行分页时，内核模式驱动程序和系统代码将始终留在物理内存中，而无法分页到磁盘。此设置防止了磁盘读取获取性能分析会话至关的代码或数据，因为所有代码和数据始终存在于物理内存中。下次运行性能分析方法时，该对话框将不再显示。你可以通过更改注册表项的值来启用执行分页，如在[`go.microsoft\
  \ .com/fwlink/?LinkId=157265`](http://go.microsoft%20.com/fwlink/?LinkId=157265)中所示。\n\
