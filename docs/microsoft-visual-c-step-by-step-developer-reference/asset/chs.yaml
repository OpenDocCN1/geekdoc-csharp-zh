  );\n    }\n}\n```\n\n**16.** 你将编辑第二个 `Point` 构造函数，将 `x` 和 `y` 字段赋值为参数 `x` 和 `y`\
  \ 的值。当你这样做时存在一个潜在陷阱。如果你不小心，构造函数将如下所示：\n\n点击此处查看代码图像\n\n```csharp\npublic Point(int\
  \ x, int y) // 不要输入这种代码！\n{\n    x = x;\n    y = y;\n}\n```\n\n虽然这段代码可以编译，但这些语句看起来具有歧义。在\
  \ `x = x;` 语句中，编译器如何知道第一个 `x` 是字段而第二个 `x` 是参数呢？答案是它并不知道！与字段同名的方法参数会隐藏方法中所有语句的字段。这段代码实际上只是是将参数赋值给自己；完全没有修改字段。\n\
  \n解决方案是使用 `this` 关键字来限定哪些变量是参数，哪些是字段。在变量前加上 `this` 意味着“该对象中的字段”。\n\n\n\n\n**16.**\
  \ 修改接受两个参数的 `Point` 构造函数，将 `Console.WriteLine` 语句替换为下方粗体所示的代码：\n\n```csharp\npublic\
  \ Point(int x, int y)\n{\n    this.x = x;\n    this.y = y;\n}\n```\n\n**17.** 编辑默认的\
  \ `Point` 构造函数，将 `x` 和 `y` 字段初始化为 –1，如下粗体所示。请注意，虽然没有参数会引起混淆，但使用 `this` 来限定字段引用仍然是一个良好的习惯：\n\
  \n```csharp\npublic Point()\n{\n    this.x = -1;\n    this.y = -1;\n}\n```\n\n**18.**\
