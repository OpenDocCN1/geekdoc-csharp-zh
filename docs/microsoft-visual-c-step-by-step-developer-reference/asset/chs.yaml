  \n### 10. 在属性页上，点击左列的 `Web` 选项卡。\n\n### 11. 在 Web 上，点击 `Don’t open a page. Wait\
  \ for a request from an external application.`（不要打开页面。等待外部应用程序的请求。）\n\n通常，当你从 Visual\
  \ Studio 运行 Web 应用程序时，浏览器（Microsoft Edge）会打开并尝试显示应用程序的首页。但 `AdventureWorksService`\
  \ 没有首页；此应用程序的目的是托管 Web 服务，客户端应用可以连接并从 `AdventureWorks` 数据库中检索数据。\n\n### 12. 在 Project\
