  \ Source）框中选择 `Microsoft SQL Server`，然后点击确定（OK）。\n\n***\n\n![Image](img/Image00005.jpg)\
  \ 注意\n\n只有当您之前没有使用过数据连接向导并选择数据源时，才会出现选择数据源对话框。\n\n***\n\n19. 在连接属性（Connection Properties）对话框中，在服务器名称（Server\
  \ Name）框中输入以下内容：`tcp:<servername>.database.windows.net,1433,`，其中 `<<servername>`\
