  \n## 第 21 章. 使用查询表达式查询内存数据\n\n**完成本章后，你将能够：**\n\n![Image](img/Image00001.jpg) 定义语言集成查询（LINQ）查询以检查枚举集合的内容。\n\
  \n![Image](img/Image00001.jpg) 使用 LINQ 扩展方法和查询运算符。\n\n![Image](img/Image00001.jpg)\
  \ 解释 LINQ 如何延迟评估查询，以及你如何强制立即执行并缓存 LINQ 查询的结果。\n\n你现在已经掌握了 C# 语言的大部分特性。然而，到目前为止，我带过了语言中一个可能被许多应用程序使用的重要方面：C#\
  \ 为查询数据的支持。你已经看到可以定义结构和类来为数据建模，可以使用集合和数组在内存中临时存储数据。然而，你如何执行常见任务，例如在集合中搜索符合特定标准的项目项呢？例如，如果你有一个\
  \ `Customer` 对象集合，你如何找到所有位于伦敦的客户，或者你如何发现哪个城镇的获得你服务的客户最多？你可以编写自己的代码来遍历集合并检查每个对象中的字段，但这类任务发生得如此频繁，以至于\
  \ C# 的设计者决定在语言中包含相应特性，以减少你需要编写的代码量。在本章中，你将学习如何使用这些高级 C# 语言特性来查询和操作数据。\n\n### 什么是\
  \ LINQ？\n\n除了最简单的应用程序外，所有应用程序都需要处理数据。从历史上来看，大多数应用程序都为执行这些操作提供自己的逻辑。然而，这种策略会导致应用程序中的代码与其处理的数据结构紧密耦合。如果数据结构发生变化，你可能需要对处理数据的代码进行大量更改。Microsoft\
  \ .NET Framework 的设计者对这些问题进行了深思考，并决定通过提供抽象应用程序代码本身查询数据机制的特性，让应用程序开发人员的工作变得轻松。这些特性被称为语言集成查询（Language-Integrated\
  \ Query），简称 LINQ。\n\nLINQ 的创建者坦然审视了如 Microsoft SQL Server 等关系型数据库管理系统如何将查询数据库的语言与数据库内部的数据格式隔离开。访问\
  \ SQL Server 数据库的开发者向数据库管理系统发出结构化查询语言（SQL）语句。SQL 为开发者想要检索的数据提供了高级描述，但没有指示数据库管理系统应该具体如何检索这些数据。这些细节由数据库管理系统本身控制。因此，调用\
  \ SQL 语句的应用程序并不关心数据库管理系统如何在物理上存储或检索数据。数据库管理系统使用的格式可以更改（例如，当发布新版本时），而无需应用程序开发人员修改应用程序所使用的\
  \ SQL 语句。\n\nLINQ 提供的语法和语义与 SQL 非常相似，并具有许多相同的优点。你可以更改被查询数据的底层结构，而无需更改实际执行查询的代码。你应该意识到，尽管\
  \ LINQ 看起来像 SQL，但它灵活得多，并且可以处理更广泛的逻辑数据结构。例如，LINQ 可以处理层次化的数据，例如 XML 文档中的数据。然而，本章侧重于以关系方式使用\
  \ LINQ。\n\n### 在 C# 应用程序中使用 LINQ\n\n解释如何使用支持 LINQ 的 C# 特性的最简单方法可能是基于以下一组客户和地址信息完成一些简单的示例：\n\
  \n客户信息\n\n![Image](img/Image00141.jpg)\n\n地址信息\n\n![Image](img/Image00142.jpg)\n\
  \nLINQ 要求数据存储在实现了 `IEnumerable` 或 `IEnumerable<T>` 的结构中，如第 19 章 所示。使用什么结构（数组、`HashSet<T>`、`Queue<T>`\
  \ 或任何集合类型，甚至是你定义的）只要它是可枚举的即可。然而，为了简单起见，本章中的示例假设客户和地址信息存储在以下代码所示所示 `customers` 和\
  \ `addresses` 数组中。\n\n* *\n\n![Image](img/Image00005.jpg) 注意：在实际应用程序中，你会通过从文件或数据库读取数据来填充这些数组。\n\
  \n* *\n\n点击此处查看代码图像\n\n```csharp\nvar customers = new[] {\n\nnew { CustomerID =\
  \ 1, FirstName = \"Kim\", LastName = \"Abercrombie\",\n\nCompanyName = \"Alpine\
  \ Ski House\" },\n\nnew { CustomerID = 2, FirstName = \"Jeff\", LastName = \"Hay\"\
  ,\n\nCompanyName = \"Coho Winery\" },\n\nnew { CustomerID = 3, FirstName = \"Charlie\"\
  , LastName = \"Herb\",\n\nCompanyName = \"Alpine Ski House\" },\n\nnew { CustomerID\
  \ = 4, FirstName = \"Chris\", LastName = \"Preston\",\n\nCompanyName = \"Trey Research\"\
  \ },\n\nnew { CustomerID = 5, FirstName = \"Dave\", LastName = \"Barnett\",\n\n\
  CompanyName = \"Wingtip Toys\" },\n\nnew { CustomerID = 6, FirstName = \"Ann\",\
  \ LastName = \"Beebe\",\n\nCompanyName = \"Coho Winery\" },\n\nnew { CustomerID\
  \ = 7, FirstName = \"John\", LastName = \"Kane\",\n\nCompanyName = \"Wingtip Toys\"\
  \ },\n\nnew { CustomerID = 8, FirstName = \"David\", LastName = \"Simpson\",\n\n\
  CompanyName = \"Trey Research\" },\n\nnew { CustomerID = 9, FirstName = \"Greg\"\
  , LastName = \"Chapman\",\n\nCompanyName = \"Wingtip Toys\" },\n\nnew { CustomerID\
  \ = 10, FirstName = \"Tim\", LastName = \"Litton\",\n\nCompanyName = \"Wide World\
  \ Importers\" }\n\n};\n\nvar addresses = new[] {\n\nnew { CompanyName = \"Alpine\
  \ Ski House\", City = \"Berne\",\n\nCountry = \"Switzerland\" },\n\nnew { CompanyName\
