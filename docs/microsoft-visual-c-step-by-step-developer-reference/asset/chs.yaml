  \ 应用程序\n\n## 1. 在调试（Debug）菜单上，点击开始调试以生成并运行应用程序。\n\n当 Customers 表单出现时，请注意由于视图处于浏览模式，`TextBox`\
  \ 和 `ComboBox` 控件是禁用的。\n\n## 2. 右键点击表单，并验证顶部和底部命令栏均已出现。\n\n\n\n\n\n你可以像以前一样使用上方命令栏中的“第一个”、“下一个”、“上一个”和“最后一个”按钮（请记住，在离开第一个客户之前，“第一个”和“上一个”按钮将不会启用）。在下方的命令栏中，“添加”和“编辑”按钮应该是启用的，但“保存”按钮和“丢弃”按钮应该是禁用的，因为当\
  \ `ViewModel` 处于浏览（Browsing）模式时，`AddCustomer` 和 `EditCustomer` 命令是启用的，而只有当 `ViewModel`\
  \ 处于添加（Adding）或编辑（Editing）模式时，`SaveChanges` 和 `DiscardChanges` 命令才被启用。\n\n![Image](img/Image00238.jpg)\n\
  \n### 3. 在底部命令栏中，点击“编辑客户”按钮。\n\n### 4. 上方命令栏中的按钮变为禁用状态，因为 `ViewModel` 现在处于编辑（Editing）模式。此外，“添加”和“编辑”按钮也是禁用的，但“保存”和“丢弃”按钮现在应该是启用的。此外，表单上的数据输入字段应该是启用的，用户可以修改客户的详情。\n\
  \n![Image](img/Image00239.jpg)\n\n### 5. 修改客户详情：清空名字，在电子邮件地址处输入 `Test`，在电话号码处输入\
  \ `Test 2`，然后点击保存。\n\n这些更改违反了由 `ValidateCustomer` 方法实现的验证规则。`ValidateCustomer` 方法向\
  \ `ViewModel` 的 `LastError` 属性中填充验证消息，这些消息显示在表单上绑定到 `LastError` 属性的 `TextBlock`\
  \ 中：\n\n![Image](img/Image00240.jpg)\n\n### 6. 点击“丢弃”，并验证表单上的原始数据已恢复。验证消息消失，`ViewModel`\
  \ 回到浏览（Browsing）模式。\n\n### 7. 点击“添加”。表单上的字段应该被清空（ID 字段显示值为 0 除外）。输入新客户的详情。务必提供姓、名、符合表单\
  \ `[name@organization.com]` 的有效电子邮件地址，以及数字电话号码（你也可以包含括号、连字符和空格）。\n\n### 8. 点击“保存”。如果数据有效（没有验证错误），你的数据将保存到数据库中。你应该能在\
  \ ID 字段中看到为新客户生成的 ID，且 `ViewModel` 应该切换回浏览（Browsing）模式。\n\n### 9. 通过添加和编辑更多客户来尝试应用程序。注意，你可以调整视图大小以显示列布局，且表单仍然可以正常工作。\n\
  \n### 10. 完成后，返回 Visual Studio 并停止调试。\n\n## 总结\n\n在本章中，你学习了如何使用 Entity Framework\
  \ 创建一个实体模型，并可以使用该模型连接到 SQL Server 数据库。数据库可以运行在本地，也可以运行在云端。你还看到了如何创建一个 REST Web 服务，UWP\
  \ 应用可以使用该服务通过实体模型查询和更新数据库中的数据，并且你学习了如何将调用该服务的代码集成到 `ViewModel` 中。\n\n你现在已经完成了书中的所有练习。我希望你已经熟练掌握\
  \ C# 语言，并理解如何使用 Visual Studio 2015 为 Windows 10 构建专业应用程序。然而，这个故事还没有结束。你已经越过了第一道障碍，但最优秀的\
  \ C# 程序员从持续的经验中学习，而你只有通过构建 C# 应用程序才能获得这种经验。在这一过程中，你将发现使用 C# 语言的新方法，以及 Visual Studio\
  \ 2015 中许多我没有在书中介绍的功能。此外，请记住 C# 是一门不断演进的语言。回到 2001 年我写这本书的第一版时，C# 引入了构建利用 Microsoft\
  \ .NET Framework 1.0 的应用程序所需的语法和语义。2003 年，Visual Studio 和 .NET Framework 1.1 增加了增强功能，接着在\
  \ 2005 年，C# 2.0 问世并支持泛型和 .NET Framework 2.0。C# 3.0 增加了许多功能，例如匿名类型、Lambda 表达式，以及最重要的\
  \ LINQ。C# 4.0 进一步扩展了语言，支持命名参数、可选参数、逆变和协变接口，以及与动态语言的集成。C# 5.0 增加了对通过 `async` 关键字和\
  \ `await` 操作符进行异步处理的完全支持。C# 6.0 对语言进行了进一步微调，例如表达式主体方法、字符串插值、`nameof` 操作符、异常过滤器等许多项。\n\
  \n在 C# 编程语言演进的同时，Windows 操作系统自本书的第一版发布以来发生了巨大变化。可以说，从 Windows 8 开始引发的变化是这一时期最激进的，而熟悉\
  \ Windows 早期版本的开发者现在正面临着令人兴奋的新挑战，即为 Windows 10 提供的现代、以触摸为中心的移动平台构建应用程序。Visual Studio\
  \ 2015 和 C# 无疑将在协助你应对这些挑战起到关键作用。\n\n下一版本的 C# 和 Visual Studio 将带来什么？请持续关注！\n\n##\
