  \ is July 4 2015\nNew value of Anniversary is August 4 2015\nValue of copy is still\
  \ August 4 2015\n\n前三条消息与之前相同。然而，第四条消息显示 `AnniversaryCopy` 变量的值已变为 2015 年 8 月 4\
  \ 日。\n\n## 12. 按回车键返回 Visual Studio 2015。\n\n***\n\n# 结构与 Windows 运行时的兼容性\n\n所有\
  \ C# 应用程序通过使用 .NET Framework 的公共语言运行时 (`CLR`) 来执行。`CLR` 负责以`虚拟机`的形式为你的应用程序代码提供安全、可靠的环境（如果你有\
  \ Java 背景，这个概念对你来说应该熟悉）。当你编译 C# 应用程序时，编译器会将你的 C# 代码转换为一组使用称为公共中间语言 (`CIL`) 的伪机器代码的指令。这些是存储在程序集中的指令。当你运行\
  \ C# 应用程序时，`CLR` 负责将 `CIL` 指令转换为计算机上的处理器可以理解并执行的真实机器指令。整个环境被称为`托管执行环境`，C# 程序通常被称为`托管代码`。你也可以使用\
  \ .NET Framework 支持的其他语言（如 Visual Basic 和 F#）编写托管代码。\n\n在 Windows 7 及更早版本中，你还可以基于\
  \ Win32 API 编写未托管应用程序，也称为`原生代码`，Win32 API 是直接与 Windows 操作系统接口的 API。（虽然 `CLR` 可以将托管代码转换为\
  \ Win32 API，但这一过程是透明的。）为了实现这一点，可以使用 C++ 等语言。Windows 后版本通过 Windows Runtime（WinRT）提供了另一种策略。WinRT\
  \ 在 Win32（以及其他选定的 API）之上引入了一个层，为从服务器到手机的不同硬件类型提供了一致的功能。当你构建通用 Windows 平台 (UWP) 应用时，使用的是\
  \ WinRT 暴露的 API 而不是 Win32。同样，Windows 10 上的 `CLR` 也使用 WinRT；由 C# 或任何托管语言编写的所有代码仍由\
  \ `CLR` 执行，但在运行时 `CLR` 将你的代码转换为 WinRT 调用而非 Win32 调用。\n\nWinRT 的主要目的是简化语言之间的互操作性，以便你更轻松地集成不同语言开发的组件。然而，这种简单性是有代价的，你必须准备根据不同语言的功能集做出一些妥协。\n\
  \n## 总结\n\n在本章中，你学习了如何创建和使用枚举和结构体。你了解了结构体和类之间的一些相似点，并学习了如何定义构造函数来初始化结构体的字段。你还学习了如何通过重写\
  \ `ToString` 方法将结构体表示为字符串。\n\n\n\n\n\n![Image](img/Image00001.jpg) 如果你想继续阅读下一章，请保持\
  \ Visual Studio 2015 运行并到第 10 章“使用数组](#text00016.html_ch10)”。\n\n![Image](img/Image00001.jpg)\
