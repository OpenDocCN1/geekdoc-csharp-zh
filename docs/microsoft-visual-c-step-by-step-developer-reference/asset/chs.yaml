  \n***\n\n应用程序完成并结束运行。注意调试工具栏会在程序运行时消失——默认情况下，工具栏仅在调试模式运行时显示。\n\n### 使用可选参数和命名参数\n\
  \n你已经看到通过定义重载方法可以实现具有不同参数的方法版本。当你构建使用重载方法的应用程序时，编译器决定使用哪些特定的方法实例来满足每次方法调用。这是许多面向对象语言的共同特征，而不只是\
  \ C#。\n\n然而，开发者可以使用不遵循这些规则的其他语言和技术来构建 Windows 应用程序和组件。C# 以及其他为 .NET 设计设计的语言能够与其他编写的应用程序和组件进行交互。支撑\
  \ .NET 框架之外许多 Windows 应用程序和服务的主要技术之一是组件对象模型（COM）。事实上，NET 框架使用的公共语言运行时（CLR）高度依赖 COM，Windows\
  \ 10 的 Windows Runtime 也是如此。COM 不支持重载方法；它使用可以使用可选参数的方法。为了方便将 COM 库和组件集成到 C# 解决方案中，C#\
  \ 也支持可选参数。\n\n\n\n\n可选参数在其他情况下也很有用。当无法使用重载（因为参数类型差异不足以让编译器区分不同的实现）时，它们提供了一个紧凑且简单的解决方案。例如，考虑以下方法：\n\
  \n点击此处查看代码图片\n\n```csharp\npublic void DoWorkWithData(int intData, float floatData,\
  \ int moreIntData)\n{\n    ...\n}\n```\n\n`DoWorkWithData` 方法接受三个参数：两个 `int` 和一个\
  \ `float`。现在假设你想提供一个只接受两个参数（`intData` 和 `floatData`）的 `DoWorkWithData` 实现方案。你可以像下面这样对重载该方法：\n\
  \n点击此处查看代码图片\n\n```csharp\npublic void DoWorkWithData(int intData, float floatData)\n\
  {\n    ...\n}\n```\n\n如果你编写了一个调用 `DoWorkWithData` 方法的语句，你可以提供两个或三个适当类型的参数，编译器将使用类型信息来确定调用哪个重载：\n\
  \n点击此处查看代码图片\n\n```csharp\nint arg1 = 99;\nfloat arg2 = 100.0F;\nint arg3 = 101;\n\
  DoWorkWithData(arg1, arg2, arg3); // 调用带有三个参数的重载\nDoWorkWithData(arg1, arg2); //\
  \ 调用带有两个参数的重载\n```\n\n然而，假设你想实现两个额外的 `DoWorkWithData` 版本，它们分别只接受第一个参数和第三个参数。你可能想尝试这样做：\n\
  \n点击此处查看代码图片\n\n```csharp\npublic void DoWorkWithData(int intData)\n{\n    ...\n\
  }\n\npublic void DoWorkWithData(int moreIntData)\n{\n    ...\n}\n```\n\n这里的问题在于，对于编译器来说，这两个重载版本看起来是完全相同的。你的代码将无法编译，而是会生成错误“类型‘typename’已定义了具有相同参数类型的成员‘DoWorkWithData’”。为了理解为什么，请思考如果这段代码是合法的会发生什么。考虑以下语句：\n\
  \n```csharp\nint arg1 = 99;\nint arg3 = 101;\nDoWorkWithData(arg1);\nDoWorkWithData(arg3);\n\
  ```\n\n调用 `DoWorkWithData` 会触发哪个或哪些重载？使用可选参数和命名参数可以帮助解决这个问题。\n\n### 定义可选参数\n\n当你在定义方法并为参数提供默认值时，你就指定该参数是可选的。你通过使用赋值运算符指定默认值。在接下来所示的\
  \ `optMethod` 方法中，`first` 参数是强制性的因为它没有指定默认值，但 `second` 和 `third` 参数是可选的：\n\n点击此处查看代码图片\n\
  \n```csharp\nvoid optMethod(int first, double second = 0.0, string third = \"Hello\"\
  )\n{\n    ...\n}\n```\n\n你必须在任何可选参数之前指定所有强制性参数。\n\n你可以像调用任何其他方法一样调用带有可选参数的方法：指定方法名并提供任何必要的参数。带有可选参数的方法与其他方法的区别在于你可以省略相应的参数，方法在运行时将使用默认值。在接下来的示例中，对\
  \ `optMethod` 方法的第一次调用为三个参数都提供了值。第二次调用仅指定了两个参数，这些值被应用于 `first` 和 `second` 参数。当方法运行时，`third`\
  \ 参数将接收到默认值“Hello”。\n\n点击此处查看代码图片\n\n```csharp\noptMethod(99, 123.45, \"World\"\
  ); // 为三个参数都提供了参数\noptMethod(100, 54.321); // 仅为前两个参数提供了参数\n```\n\n### 传递命名参数\n\n\
  默认情况下，C# 使用每个参数在方法调用中的位置来确定该参数适用于哪个参数。因此，上一一节所示的 `OptMethod` 方法的第二个示例将两个参数传递给方法中的\
  \ `first` 和 `second` 参数，因为这是它们在方法声明中出现的顺序。在 C# 中，你还可以通过名称指定参数。\n\n此功能允许你以不同的顺序传递参数。要将参数作为命名参数传递，你需要指定参数名，后跟冒号和要使用的值。以下示例执行的功能与上一节所示的相同，只是参数是通过名称来指定的：\n\
  \n点击此处查看代码图片\n\n```csharp\noptMethod(first : 99, second : 123.45, third : \"World\"\
  );\noptMethod(first : 100, second : 54.321);\n```\n\n命名参数赋予了你以任何顺序传递参数的能力。你可以像这里重写调用\
  \ `optMethod` 方法的代码：\n\n点击此处查看代码图片\n\n```csharp\noptMethod(third : \"World\", second\
  \ : 123.45, first : 99);\noptMethod(second : 54.321, first : 100);\n```\n\n这种功能还让你能够省略参数。例如，你可以调用\
  \ `optMethod` 方法并仅为 `first` 和 `third` 参数指定值，而 `second` 参数使用默认值：\n\n点击此处查看代码图片\n\n\
  ```csharp\noptMethod(first : 99, third : \"World\");\n```\n\n此外，你可以混合使用位置参数和命名参数。然而，如果你使用这种技术，必须在命名参数之前指定所有的位置参数。\n\
  \n点击此处查看代码图片\n\n```csharp\noptMethod(99, third : \"World\"); // 第一个参数是位置参数\n```\n\
  \n### 使用可选参数和命名参数解决歧义\n\n使用可选参数和命名参数可能会导致代码产生歧义。你需要理解编译器如何解决这些歧义，否则你的应用程序可能会出现意外行为。假设你如下例所示定义\
  \ `optMethod` 方法为重载方法：\n\n点击此处查看代码图片\n\n```csharp\nvoid optMethod(int first, double\
  \ second = 0.0, string third = \"Hello\")\n{\n    ...\n}\n\nvoid optMethod(int first,\
  \ double second = 1.0, string third = \"Goodbye\", int fourth = 100)\n{\n    ...\n\
  }\n```\n\n这是完全合法的 C# 代码，遵循重载方法的规则。编译器可以根据参数列表区分这些方法。然而，如接下来的示例所示，如果你尝试调用 `optMethod`\
  \ 方法并省略对应一个或多个可选参数的参数，就会出现问题：\n\n```csharp\noptMethod(1, 2.5, \"World\");\n```\n\
  \n再次，这是完全合法的代码，但它运行的是哪个版本的 `optMethod` 方法？答案是与方法调用最匹配的版本，因此代码调用了接受三个参数的方法而不是接受四个参数的版本。这很有道理，那么考虑这个：\n\
  \n```csharp\noptMethod(1, fourth : 101);\n```\n\n在这段代码中，`optMethod` 的调用省略了 `second`\
  \ 和 `third` 参数的参数，但它通过名称指定了 `fourth` 参数。只有一个 `optMethod` 版本匹配此调用，所以这不是问题。不过，下一个示例会让你开始思考：\n\
  \n```csharp\noptMethod(1, 2.5);\n```\n\n\n\n\n这一次，`optMethod` 方法的两个版本都无法完全匹配提供的参数列表。`optMethod`\
  \ 方法的两个版本对第二、第三和第四个参数都有可选参数。那么，此语句是调用了三个参数的 `optMethod` 版本并对 `third` 参数使用默认值，还是调用了四个参数的\
  \ `optMethod` 版本并对 `third` 和 `fourth` 参数使用默认值呢？答案是，两者都不是。这是一个无法解决的歧义，编译器不允许你编译应用程序。如果你尝试像下面任何一条语句那样调用\
  \ `optMethod` 方法，将会出现相同的情况和结果：\n\n点击此处查看代码图像\n\n```\noptMethod(1, third : \"World\"\
  );\n\noptMethod(1);\n\noptMethod(second : 2.5, first : 1);\n```\n\n在本章的最后一个练习中，你将练习实现带有可选参数的方法，并使用具名参数来调用它们。你还将测试\
  \ C# 编译器解析涉及可选参数和具名参数的方法调用的常见示例。\n\n### 定义并调用带有可选参数的方法\n\n1. 使用 Visual Studio 2015，打开\
  \ `DailyRate` 项目，该项目位于文档文件夹中的 `\\Microsoft Press\\VCSBS\\Chapter 3\\DailyRate Using\
  \ Optional Parameters` 文件夹。\n\n2. 在解决方案资源管理器中，在 `DailyRate` 项目中，双击 `Program.cs`\
  \ 文件，在代码和文本编辑器窗口中显示程序的代码。此版本的应用程序除了 `Main` 方法和 `run` 方法的骨架版本外，是空的。\n\n3. 在 `Program`\
  \ 类中，在 `run` 方法之后，在 `run` 方法下方添加下面的 `calculateFee` 方法。这与你在上一个练习中实现的方法版本相同，不同之处它接受两个带有默认值的可选参数。该方法还会打印一条消息，指示调用的是哪个\
  \ `calculateFee` 方法版本。（你将在接后的步骤中添加此方法的重载实现。）\n\n点击此处查看代码图像\n\n```csharp\nprivate\
  \ double calculateFee(double dailyRate = 500.0, int noOfDays = 1)\n{\n    Console.WriteLine(\"\
  calculateFee using two optional parameters\");\n    return dailyRate * noOfDays;\n\
  }\n```\n\n4. 在 `Program` 类中添加另一个 `calculateFee` 方法的实现，如下所示所示。此版本接受一个类型为 `double`\
  \ 的可选参数 `dailyRate`。该方法体仅计算并返回单日的费用。\n\n点击此处查看代码图像\n\n```csharp\nprivate double\
  \ calculateFee(double dailyRate = 500.0)\n{\n    Console.WriteLine(\"calculateFee\
  \ using one optional parameter\");\n    int defaultNoOfDays = 1;\n    return dailyRate\
  \ * defaultNoOfDays;\n}\n```\n\n5. 在 `Program` 类中添加第三个 `calculateFee` 方法的实现。此版本不接受参数，并对日速率和天数使用硬编码值。\n\
  \n点击此处查看代码图像\n\n```csharp\nprivate double calculateFee()\n{\n    Console.WriteLine(\"\
  calculateFee using hardcoded values\");\n    double defaultDailyRate = 400.0;\n\
