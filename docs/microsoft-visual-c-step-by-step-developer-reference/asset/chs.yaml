  \ 方法来确定当前节点的值是否大于新项：\n\n点击此处查看代码图像\n\n```csharp\npublic void Insert()\n{\n    TItem\
  \ currentNodeValue = this.NodeData;\n    if (currentNodeValue.CompareTo(newItem)\
  \ > 0)\n    {\n        // 将新项插入到左子树\n    }\n    else\n    {\n```\n\n\n\n\n```cs\n\
  // 将新项插入到右子树\n\n}\n\n}\n```\n\n**12.** 在代码的 `if` 部分，紧接注释 `// Insert the new item\
