  \ 文件，其中 `nnnnnn` 是标识新订单的数字。检查这些文件并确认它们是否包含订单详情。\n5. 返回到 `Visual Studio 2015` 并停止调试。\n\
  \n### Lambda 表达式和委托\n\n到目前为止，你看到的所有向委托添加方法的示例都使用了该方法的名称。例如，在之前描述的自动化工厂场景中，你通过如下方式将\
  \ `folder` 对象的 `StopFolding` 方法添加到 `stopMachinery` 委托中：\n\n点击此处查看代码图像\n\n```\nthis.stopMachinery\
  \ += folder.StopFolding;\n```\n\n如果存在与委托签名匹配的便捷方法，这种方法将非常有用。但如果 `StopFolding` 方法实际上具有以下签名将会呢：\n\
  \n点击此处查看代码图像\n\n```cs\nvoid StopFolding(int shutDownTime); // 在指定的秒数内关机\n```\n\n\
  此签名现在与 `FinishWelding` 和 `PaintOff` 方法的签名不同，因此你无法使用同一个委托来处理所有这三个方法。你该怎么办？\n\n####\
  \ 创建方法适配器\n\n解决此问题的一种方法是创建另一个调用 `StopFolding` 但其本身不接受参数的方法，如下所示：\n\n点击此处查看代码图像\n\
  \n```cs\nvoid FinishFolding()\n{\n    folder.StopFolding(0); // 立即关机\n}\n```\n\n\
  然后你可以使用相同的语法，将 `FinishFolding` 方法代替 `StopFolding` 方法添加到 `stopMachinery` 委托中：\n\n\
  点击此处查看代码图像\n\n```\nthis.stopMachinery += folder.FinishFolding;\n```\n\n当调用 `stopMachinery`\
  \ 委托时，它会调用 `FinishFolding`，转而调用 `StopFolding` 方法并传递参数 `0`。\n\n***\n\n![Image](img/Image00005.jpg)\
  \ 注意\n\n`FinishFolding` 方法是适配器的经典示例：一个转换（或适配）方法以赋予其不同签名的方法。这种模式非常常见，是 Erich Gamma、Richard\
  \ Helm、Ralph Johnson 和 John Vlissides 编写的书中 *Design Patterns：可重用面向对象软件的元素* (Addison-Wesley\
  \ Professional, 1994) 中记录的模式集之一。\n\n***\n\n在许多情况下，像这样的适配器方法非常短小，很容易在方法的海洋中丢失，特别是在一个大类中。此外，除了该方法用于适配\
  \ `StopFolding` 方法以供委托使用外，否则它不太可能被调用。C# 为此类情况提供了 Lambda 表达式。Lambda 表达式在第 18 章 中描述，在本章的前面有更多它们的示例。在工厂场景中，你可以使用以下\
  \ Lambda 表达式：\n\n点击此处查看代码图像\n\n```\nthis.stopMachinery += (() => folder.StopFolding(0));\n\
  ```\n\n当你调用 `stopMachinery` 委托时，它将运行 Lambda 表达式定义的代码，该代码转而使用适当的参数调用 `StopFolding`\
  \ 方法。\n\n### 使用事件启用通知\n\n你现在已经看到了如何声明委托类型、调用委托以及创建委托实例。然而，这只是故事的一半。尽管你可以使用委托间接调用任意数量的方法，但你仍然必须显式调用委托。在许多情况下，当发生重大事件时，让委托自动运行将很有用。例如，在自动化工厂场景中，如果系统检测到机器过热，能够调用\
  \ `stopMachinery` 委托并停止设备可能是至关重要的。\n\n.NET Framework 提供了 `events`，你可以使用它定义和捕获重大操作，并安排调用委托来处理这种情况。.NET\
  \ Framework 中的许多类暴露了事件。你在 UWP 应用表单上放置的大多数控件以及 `Windows` 类本身都使用事件在例如用户点击按钮或在字段中输入内容时运行代码。你也可以声明自己的事件。\n\
  \n#### 声明事件\n\n你在作为事件源的类中声明事件。`event source` 通常是一个监控其环境并在发生重大事件时引发事件的类。在自动化工厂中，事件源可能是一个监控温度并在机器超过边界时引发事件的类。事件维护了一个在它引发时调用的方法列表（这些方法有时被称为订阅者准备好处理必要的行动：停止机器）。\n\
  \n你声明事件的方式类似于声明字段。然而，由于事件旨在与委托配合，事件的类型必须是委托，并且必须在声明时加上 `event` 关键字。使用以下语法声明事件：\n\
  \n点击此处查看代码图像\n\n```cs\nevent delegateTypeName eventName\n```\n\n作为一个示例，这里是自动化工厂中的\
  \ `StopMachineryDelegate`。它被移动到了一个名为 `TemperatureMonitor` 的类中（将事件放在这里比放在 `Controller`\
  \ 类中更有逻辑）：\n\n点击此处查看代码图像\n\n```cs\nclass TemperatureMonitor\n{\n    public delegate\
  \ void StopMachineryDelegate();\n}\n```\n\n你可以定义 `MachineOverheating` 事件，它将如下调用\
  \ `stopMachineryDelegate`：\n\n点击此处查看代码图像\n\n```cs\nclass TemperatureMonitor\n{\n\
  \    public delegate void StopMachineryDelegate();\n    public event StopMachineryDelegate\
  \ MachineOverheating;\n}\n```\n\n`TemperatureMonitor` 类逻辑（未显示）必要时引发 `MachineOverheating`\
  \ 事件（将在后续章节看到如何引发事件）。此外，你是将方法添加到事件（一个被称为订阅事件的过程），而不是将它们添加到事件所基于的委托上。接下来我们将查看事件的这一方面。\n\
  \n#### 订阅事件\n\n像委托一样，事件自带 `+=` 运算符。你通过使用此 `+=` 运算符订阅事件。在自动化工厂中，控制每台机器的软件可以安排在 `MachineOverheating`\
  \ 事件引发时调用关机方法，如下：\n\n点击此处查看代码图像\n\n```cs\nclass TemperatureMonitor\n{\n    public\
  \ delegate void StopMachineryDelegate();\n    public event StopMachineryDelegate\
  \ MachineOverheating;\n}\n```\n\n...\n\n```\nTemperatureMonitor tempMonitor = new\
  \ TemperatureMonitor();\n\n...\n\ntempMonitor.MachineOverheating += (() => { folder.StopFolding(0);\
  \ });\ntempMonitor.MachineOverheating += welder.FinishWelding;\n```\n\n\n\n\n```\n\
  tempMonitor.MachineOverheating += painter.PaintOff;\n```\n\n注意，该语法与向委托添加方法的语法是相同的。你甚至可以使用\
  \ Lambda 表达式进行订阅。当 `tempMonitor.MachineOverheating` 事件运行时运行时，它将调用所有订阅的方法并关闭机器。\n\
  \n## 从事件中取消订阅\n\n既然你知道使用 `+=` 运算符将委托附加到事件，你可能已经猜到使用 `-=` 运算符将委托从事件中分离出来。调用 `-=`\
  \ 运算符会将该方法从事件的内部委托集合中移除。此操作通常被称为从事件*取消订阅*（unsubscribing）。\n\n## 触发事件\n\n你可以通过像调用方法一样调用事件来触发事件。当你触发事件时，所有附加的委托都会按顺序调用。例如，这里是\
  \ `TemperatureMonitor` 类，它包含一个私有的 `Notify` 方法，用于触发 `MachineOverheating` 事件：\n\n\
  点击此处查看代码图片\n\n```csharp\nclass TemperatureMonitor\n{\n    public delegate void StopMachineryDelegate();\n\
  \    public event StopMachineryDelegate MachineOverheating;\n    ...\n    private\
  \ void Notify()\n    {\n        if (this.MachineOverheating != null)\n        {\n\
  \            this.MachineOverheating();\n        }\n    }\n    ...\n}\n```\n\n这是一个常用的用法。`null`\
  \ 检查是必要的，因为事件字段是隐式空值，只有当方法使用 `+=` 运算符订阅它时，它才会变为非空。如果你尝试触发空事件，将得到 `NullReferenceException`\
  \ 异常。如果定义事件的委托需要任何参数，则在触发事件时必须提供相应的参数。你稍后会看到一些示例。\n\n***\n\n![Image](img/Image00004.jpg)\
  \ **重要**\n\n事件具有非常实用的内置安全功能。公共事件（如 `MachineOverheating`）只能由定义它的类（即 `TemperatureMonitor`\
  \ 类）中的方法触发。任何在类外部触发事件的尝试都会导致编译错误。\n\n***\n\n## 理解用户界面事件\n\n如前所述，用于构建 GUI 的 .NET\
  \ Framework 类和控件广泛使用了事件。例如，`Button` 类派生自 `ButtonBase` 类，继承了一个类型为 `RoutedEventHandler`\
  \ 的公共事件 `Click`。`RoutedEventHandler` 委托期望两个参数：导致事件触发的对象的引用，以及一个包含事件附加信息的 `RoutedEventArgs`\
  \ 对象：\n\n点击此处查看代码图片\n\n```csharp\npublic delegate void RoutedEventHandler(Object\
  \ sender, RoutedEventArgs e);\n```\n\n`Button` 类看起来如下：\n\n点击此处查看代码图片\n\n```csharp\n\
  public class ButtonBase: ...\n{\n    public event RoutedEventHandler Click;\n  \
  \  ...\n}\n\npublic class Button : ButtonBase\n{\n    ...\n}\n```\n\n当你在点击屏幕上的按钮时，`Button`\
  \ 类会自动触发 `Click` 事件。这种安排可以很轻松地为选定的方法创建委托，并将该委托附加到所需的事件。以下示例显示了一个 UWP 表单的代码，该表单包含一个名为\
  \ `okay` 的按钮，以及将 `okay` 按钮的 `Click` 事件连接到 `okayClick` 方法的代码：\n\n点击此处查看代码图片\n\n```csharp\n\
  partial class MainPage :\nglobal::Windows.UI.Xaml.Controls.Page,\nglobal::Windows.UI.Xaml.Markup.IComponentConnector,\n\
  global::Windows.UI.Xaml.Markup.IComponentConnector2\n{\n    ...\n    public void\
  \ Connect(int connectionId, object target)\n    {\n        switch(connectionId)\n\
  \        {\n            case 1:\n            {\n                this.okay = (global::Windows.UI.Xaml.Controls.Button)(target);\n\
  \                ...\n                ((global::Windows.UI.Xaml.Controls.Button)this.okay).Click\
  \ += this.okayClick;\n                ...\n            }\n            break;\n \
  \           default:\n                break;\n        }\n        this._contentLoaded\
  \ = true;\n    }\n    ...\n}\n```\n\n这段代码通常对你隐藏。当你使用 Visual Studio 2015 中的设计视图窗口，并在表单的可扩展应用程序标记语言\
  \ (XAML) 描述中将 `okay` 按钮的 `Click` 属性设置为 `okayClick` 时，Visual Studio 2015 会为你生成这段代码。你所做的就是在你有权访问的代码部分在事件处理方法\
  \ `okayClick` 中编写你的应用程序逻辑，在这种情况下，该部分是 `MainPage.xaml.cs` 文件：\n\n点击此处查看代码图片\n\n```csharp\n\
  public sealed partial class MainPage : Page\n{\n    ...\n    private void okayClick(object\
  \ sender, RoutedEventArgs e)\n    {\n        // 处理 Click 事件的代码\n    }\n}\n```\n\n\
  各种 GUI 控件生成的事件始终遵循相同的模式。事件是委托类型，其签名具有 `void` 返回类型和两个参数。第一个参数总是事件的 `sender`（源），第二个参数总是\
  \ `EventArgs` 参数（或派生自 `EventArgs` 的类）。通过 `sender` 参数，你可以为多个事件重用同一个方法。\n\n## 使用事件\n\
  \n在之前的练习中，你修改了应用程序以将审计逻辑与结算过程解耦。你构建的 `CheckoutController` 类通过委托调用审计和运输组件，并且对这些组件一无所知；这是创建\
  \ `CheckoutController` 的应用程序的责任。但是，如果组件在处理完成后能够通知应用程序，可能会很有用。\n\n起初听起来可能有点奇怪——当应用程序调用\
  \ `CheckoutController` 对象中的委托时，方法会运行，应用程序只有在这些方法完成后才会继续执行语句。但事实并非如此！第 24 章，“通过异步操作提高响应时间](#text0032.html_ch24)”演示了方法可以异步运行，当你调用一个方法时，在执行后续语句之前，它可能尚未完成。这在后台线程上执行长时间操作以保持用户界面响应的\
  \ UWP 应用中尤为常见。在 Importers 应用程序中，在 `CheckoutButtonClicked` 方法中，调用委托的代码后面是一个显示已放置订单的对话框语句：\n\
  \n点击此处查看代码图片\n\n```csharp\nprivate void CheckoutButtonClicked(object sender, RoutedEventArgs\
  \ e)\n{\n    try\n    {\n        // 执行结算处理\n        this.checkoutController.StartCheckoutProcessing(this.order);\n\
  \        // 显示订单摘要\n        MessageDialog dlg = new MessageDialog(...);\n      \
  \  dlg.ShowAsync();\n    }\n    ...\n}\n}\n}\n```\n\n事实上，在对话框出现之前，无法保证委托方法所执行的处理已经完成，因此消息实际上可能具有误导性。这正是事件价值连城的地方。`Auditor`\
  \ 和 `Shipper` 组件都可以发布一个应用程序订阅的事件。这些组件只有在完成处理后才会触发事件。当应用程序接收到此事件时，就可以显示消息，并确信它现在是准确的。\n\
  \n\n\n\n\n在接下来的练习中，你将修改 `Auditor` 和 `Shipper` 类，以便在它们完成处理时触发一个事件。应用程序将订阅每个组件的该事件，并在事件发生时显示适当的消息。\n\
  \n### 为 `CheckoutController` 类添加一个事件\n\n1. 回到 Visual Studio 2015 并显示 Delegates 解决方案。\n\
  \n2. 在 `AuditService` 项目中，在代码和文本编辑器窗口中打开 `Auditor.cs` 文件。\n\n3. 在 `Auditor` 类中添加一个名为\
  \ `AuditingCompleteDelegate` 的公共委托。该委托应指定一个接受名为 `message` 的字符串参数并返回 `void` 的方法。以下示例中的粗体代码显示了委托的定义：\n\
  \n```csharp\nclass Auditor\n{\n    public delegate void AuditingCompleteDelegate(string\
  \ message);\n    ...\n}\n```\n\n4. 在 `AuditingCompleteDelegate` 委托之后，向 `Auditor`\
  \ 类中添加一个名为 `AuditProcessingComplete` 的公共事件。该事件应基于 `AuditingCompleteDelegate` 委托，如下代码加粗所示：\n\
  \n```csharp\nclass Auditor\n{\n    public delegate void AuditingCompleteDelegate(string\
  \ message);\n    public event AuditingCompleteDelegate AuditProcessingComplete;\n\
  \    ...\n}\n```\n\n5. 定位 `AuditOrder` 方法。这是通过 `CheckoutController` 对象中使用委托运行的方法。它调用了另一个名为\
  \ `doAuditing` 的私有方法来实际执行审计操作。该方法如下：\n\n```csharp\npublic void AuditOrder(Order\
  \ order)\n{\n    this.doAuditing(order);\n}\n```\n\n6. 滚动到 `doAuditing` 方法。该方法中的代码封装在\
  \ `try`/`catch` 块中；它使用 .NET Framework 类库的 XML API 来生成正在审计订单的 XML 表示，并将其保存到文件中。（工作原理的准确细节超出了本章的讨论范围。）\n\
  \n在 `catch` 块之后，添加一个 `finally` 块来触发 `AuditProcessingComplete` 事件，如下文加粗部分所示：\n\n\
  ```csharp\nprivate async void doAuditing(Order order)\n{\n    List<OrderItem> ageRestrictedItems\
  \ = findAgeRestrictedItems(order);\n    if (ageRestrictedItems.Count > 0)\n    {\n\
  \        try\n        {\n            ...\n        }\n        catch (Exception ex)\n\
  \        {\n            ...\n        }\n        finally\n        {\n           \
  \ if (this.AuditProcessingComplete != null)\n            {\n                this.AuditProcessingComplete(\n\
  \                    $\"Audit record written for Order {order.OrderID}\");\n   \
  \         }\n        }\n    }\n}\n```\n\n7. 在 `DeliveryService` 项目中，在代码和文本编辑器窗口中打开\
  \ `Shipper.cs` 文件。\n\n8. 为 `Shipper` 类添加一个名为 `ShippingCompleteDelegate` 的公共委托。该委托应指定一个接受名为\
  \ `message` 的字符串参数并返回 `void` 的方法。以下示例中的粗体代码显示了委托的定义：\n\n```csharp\nclass Shipper\n\
  {\n    public delegate void ShippingCompleteDelegate(string message);\n    ...\n\
  }\n```\n\n9. 在 `Shipper` 类中基于 `ShippingCompleteDelegate` 委托添加一个名为 `ShipProcessingComplete`\
  \ 的公共事件，如下文加粗所示：\n\n```csharp\nclass Shipper\n{\n    public delegate void ShippingCompleteDelegate(string\
  \ message);\n    public event ShippingCompleteDelegate ShipProcessingComplete;\n\
  \    ...\n}\n```\n\n10. 定位 `doShipping` 方法。这是执行运输逻辑的方法。在方法中，`catch` 块之后，添加一个 `finally`\
  \ 块来触发 `ShipProcessingComplete` 事件，如下文加粗所示：\n\n```csharp\nprivate async void doShipping(Order\
  \ order)\n{\n    try\n    {\n        ...\n    }\n    catch (Exception ex)\n    {\n\
  \        ...\n    }\n    finally\n    {\n        if (this.ShipProcessingComplete\
  \ != null)\n        {\n            this.ShipProcessingComplete(\n              \
  \  $\"Dispatch note for Order {order.OrderID}\");\n        }\n    }\n}\n```\n\n\
  11. 在 `Delegates` 项目中，在设计视图中显示 `MainPage.xaml` 文件。在 XAML 窗格中，滚动到第一组 `RowDefinition`\
  \ 项。XAML 代码所示：\n\n```xml\n<Grid Background=\"{StaticResource ApplicationBackgroundBrush}\"\
  >\n    <Grid.RowDefinitions>\n        <RowDefinition Height=\"*\"/>\n        <RowDefinition\
  \ Height=\"2*\"/>\n        <RowDefinition Height=\"*\"/>\n        <RowDefinition\
  \ Height=\"10*\"/>\n    </Grid.RowDefinitions>\n    ...\n```\n\n12. 将最后一个 `RowDefinition`\
  \ 的 `Height` 属性更改为 `2*`，如下：\n\n```xml\n<Grid.RowDefinitions>\n    ...\n    <RowDefinition\
  \ Height=\"2*\"/>\n</Grid.RowDefinitions>\n```\n此更改在表单底部提供了一个空间。你将使用该空间通过 `Grid`\
  \ 控件来布局用户界面。\n\n13. 滚动到 XAML 窗格的底部。在 `</Grid>` 标签之前添加以下 `ScrollViewer` 和 `TextBlock`\
  \ 元素：\n\n```xml\n<ScrollViewer Grid.Row=\"4\" VerticalScrollBar=\"Visible\">\n \
