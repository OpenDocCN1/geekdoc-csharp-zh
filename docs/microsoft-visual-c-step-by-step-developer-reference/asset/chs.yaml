  \ World You You\n\n![Image](img/Image00124.jpg)\n\n### 创建泛型方法\n\n除了定义泛型类之外，你还可以创建泛型方法。\n\
  \n\n\n\n通过泛型方法，你可以使用类似于定义泛型类的方法，通过类型参数来指定参数的类型和返回类型。通过这种方式，你可以定义类型安全的泛化方法，并避免类型转换的开销（在某些情况下还包括装箱的开销）。泛型方法经常与泛型类结合使用；当你需要接受泛型类型作为参数或返回类型为泛型类型的方法时，你就需要这些方法。\n\
  \n你使用与创建泛型类时相同的类型参数语法来定义泛型方法。（你也可以指定约束）。例如，后续代码中的泛型方法 `Swap<T>` 会交换其参数中的值。由于此功能无论交换的数据类型如何都很有用，因此将其定义为泛型方法是有帮助的：\n\
  \n点击此处查看代码图像\n\n```cs\nstatic void Swap<T>(ref T first, ref T second)\n{\n    T\
  \ temp = first;\n    first = second;\n    second = temp;\n}\n```\n\n你通过为其类型参数指定合适的类型来调用该方法。以下示例显示了如何调用\
  \ `Swap<T>` 方法来交换两个 `int` 和两个 `string`：\n\n点击此处查看代码图像\n\n```cs\nint a = 1, b = 2;\n\
  Swap<int>(ref a, ref b);\n\n...\n\nstring s1 = \" Hello\" , s2 = \" World\" ;\n\
  Swap<string>(ref s1, ref s2);\n```\n\n***\n\n![Image](img/Image00005.jpg) 备注\n\n\
  就像使用不同的类型参数实例化泛型类会导致编译器生成不同的类型一样，`Swap<T>` 方法的每次不同使用都会导致编译器生成该方法的不同版本。`Swap<int>`\
  \ 和 `Swap<string>` 并不是同一个方法——这两个方法恰好都是从同一个泛型模板生成的，因此它们表现出相同的行为，尽管作用于不同的类型。\n\n***\n\
  \n## 定义用于构建二叉树的泛型方法\n\n在在上一个练习中，你创建了一个用于实现二叉树的泛型类。`Tree<TItem>` 类提供了 `Insert` 方法来向树中添加数据项。然而，如果你想添加大量项目，重复调用\
  \ `Insert` 方法将非常不利。在接下来的练习中，你定义定义名为 `InsertIntoTree` 的泛型方法，可以使用它通过单个方法调用将数据项列表插入树中。你将通过使用该方法将字符列表插入字符树来测试此方法。\n\
  \n### 编写 `InsertIntoTree` 方法\n\n**1.** 使用 Visual Studio 2015，使用“控制台应用程序”模板创建一个新项目。在“新建项目”对话框中，将项目命名为\
  \ `BuildTree`。将位置设为你文档文件夹下的 `\\Microsoft Press\\VCSBS\\Chapter 17`。在“解决方案”下拉列表中，点击“创建新解决方案”，然后点击“确定”。\n\
  \n**2.** 在“项目”菜单上，点击“添加引用”。在“引用管理器 – BuildTree”对话框中，点击“浏览”按钮（注意不是左侧窗格中的“浏览”选项卡）。\n\
  \n**3.** 在“选择要引文件”对话框中，浏览到你文档文件夹下的 `\\Microsoft Press\\VCSBS\\Chapter 17\\BinaryTree\\\
  BinaryTree\\bin\\Debug` 文件夹，点击 `BinaryTree.dll`，然后点击“添加”。\n\n**4.** 在“引用管理器 – BuildTree”对话框中，验证\
  \ `BinaryTree.dll` 程序集已在列表中，且该程序集的复选框已选中，然后点击“确定”。\n\n`BinaryTree` 程序集已添加到“解决方案资源”显示的引用列表中。\n\
  \n**5.** 在显示 `Program.cs` 文件的“代码和文本编辑器”窗口中，在 `Program.cs` 顶部添加以下 `using` 指令：\n\n\
  ```cs\nusing BinaryTree;\n```\n\n记住，此命名空间包含 `Tree<TItem>` 类。\n\n**6.** 在 `Program`\
  \ 类的 `Main` 方法之后，添加一个名为 `InsertIntoTree` 的方法。该方法应声明为 `static void` 方法，接受一个 `Tree<TItem>`\
  \ 参数和一个名为 `data` 的 `TItem` 元素的 `params` 数组。树参数应该按引用传递，其原因将在稍稍后的步骤中描述。\n\n该方法的定义应该像这样：\n\
  \n点击此处查看代码图像\n\n```cs\nstatic void InsertIntoTree<TItem>(ref Tree<TItem> tree,\n\
  params TItem[] data)\n{\n}\n```\n\n**7.** 用于插入二叉树的元素的 `TItem` 类型必须实现 `IComparable<TItem>`\
  \ 接口。修改 `InsertIntoTree` 方法的定义并在后续代码中添加加粗显示的 `where` 子句：\n\n点击此处查看代码图像\n\n```cs\n\
  static void InsertIntoTree<TItem>(ref Tree<TItem> tree,\nparams TItem[] data) where\
  \ TItem :IComparable<TItem>\n{\n}\n```\n\n**8.** 在 `InsertIntoTree` 方法中添加后续示例中加粗显示的语句。\n\
  \n这些语句遍历 `params` 列表，通过使用 `Insert` 方法将每个项添加到树中。如果树参数指定的值为 `null`，则创建一个新的 `Tree`；这就是为什么树是按引用传递的。\n\
  \n点击此处查看代码图像\n\n```cs\nstatic void InsertIntoTree<TItem>(ref Tree<TItem> tree,\n\
  params TItem[] data) where TItem :IComparable<TItem>\n{\n    foreach (TItem datum\
  \ in data)\n    {\n        if (tree == null)\n        {\n            tree = new\
  \ Tree<TItem>();\n        }\n        else\n        {\n            tree.Insert(datum);\n\
  \        }\n    }\n}\n```\n\n### 测试 `InsertIntoTree` 方法\n\n**1.** 在 `Program` 类的\
  \ `Main` 方法中，添加后续加粗显示的语句，为字符创建一个 `Tree`，使用 `InsertIntoTree` 方法填充示例数据，然后通过 `WalkTree`\
  \ 方法显示它。\n\n点击此处查看代码图像\n\n```cs\nstatic void Main(string[] args)\n{\n    Tree<char>\
  \ charTree = null;\n    InsertIntoTree(ref charTree, 'M', 'X', 'A', 'M', 'Z', 'N');\n\
  \    Console.WriteLine($\"Sorted data is {charTree.WalkTree()}\");\n}\n```\n\n**2.**\
  \ 在“生成”菜单上，点击“生成解决方案”，验证解决方案已编译，然后修正任何错误。\n\n**3.** 在“调试”菜单上，点击“启动调试”。\n\n程序运行并按顺序显示字符：\n\
  \nA M N X Z\n\n**4.** 按 Enter 返回 Visual Studio 2015。\n\n### 变体与泛型接口\n\n8 章 展示了你可以使用\
  \ `object` 类型来持有任何类型的值或引用。例如，以下代码是完全合：\n\n```cs\nstring myString = \"Hello\";\n\
  object myObject = myString;\n```\n\n记住在继承关系中，`String` 类派自 `Object` 类，因此所有字符串都是对象。\n\
  \n现在考虑以下泛型接口和类：\n\n点击此处查看代码图像\n\n```cs\ninterface IWrapper<T>\n{\n    void SetData(T\
  \ data);\n    T GetData();\n}\n\nclass Wrapper<T> : IWrapper<T>\n{\n    private\
  \ T storedData;\n    void IWrapper<T>.SetData(T data)\n    {\n        this.storedData\
  \ = data;\n    }\n    T IWrapper<T>.GetData()\n    {\n        return this.storedData;\n\
  \    }\n}\n```\n\n`Wrapper<T>` 类为指定类型提供了一个简单的封装。`IWrapper` 接口定义了 `Wrapper<T>` 类实现的存储数据的\
  \ `SetData` 方法以及 `Wrapper<T>` 类实现的检索数据的 `GetData` 方法。你可以创建该类的实例并用它包装字符串，如下：\n\n\
  点击此处查看代码图像\n\n```cs\nWrapper<string> stringWrapper = new Wrapper<string>();\nIWrapper<string>\
  \ storedStringWrapper = stringWrapper;\nstoredStringWrapper.SetData(\" Hello\" );\n\
  Console.WriteLine($\" Stored value is {storedStringWrapper.GetData()}\" );\n```\n\
  \n\n\n这段代码创建了 `Wrapper<string>` 类型的实例。它通过 `IWrapper<string>` 接口引用该对象以调用 `SetData`\
  \ 方法。（`Wrapper<T>` 类型显式实现了它的接口，因此你必须通过适当的接口引用来调用这些方法。）代码还通过 `IWrapper<string>` 接口调用了\
  \ `GetData` 方法。如果你运行这段代码，它将输出消息“Stored value is Hello”。\n\n查看下行代码：\n\n点击此处查看代码图像\n\
  \n```cs\nIWrapper<object> storedObjectWrapper = stringWrapper;\n```\n\n此语句与上一个代码示例中创建\
  \ `IWrapper<string>` 引用的语句相似，区别在于类型参数是 `object` 而不是 `string`。这段代码是合法的吗？记住所有的字符串都是对象（如之前所示，你可以将\
  \ `string` 值赋值给 `object` 引用），因此从理论上来说这条语句看起来是行的。然而，如果你尝试这样做，该语句将编译失败，并显示消息“无法隐式将类型‘Wrapper<string>’转换为‘IWrapper<object>’”。\n\
  \n你可以尝试进行显式转换，如下：\n\n点击此处查看代码图像\n\n```cs\nIWrapper<object> storedObjectWrapper =\
  \ (IWrapper<object>)stringWrapper;\n```\n\n这段代码可以编译，但在运行时会失败抛出 `InvalidCastException`\
  \ 异常。问题在于，虽然所有的字符串都是对象，但反之则不然。如果允许这条语句，你可以编写像下面的代码，它最终尝试将一个 `Circle` 对象存储在 `string`\
  \ 字段中：\n\n点击此处查看代码图像\n\n```cs\nIWrapper<object> storedObjectWrapper = (IWrapper<object>)stringWrapper;\n\
  \nCircle myCircle = new Circle();\n\nstoredObjectWrapper.SetData(myCircle);\n```\n\
  \n`IWrapper<T>` 接口被称为是**不变的（invariant）**。你不能将 `IWrapper<A>` 对象赋值给 `IWrapper<B>`\
  \ 类型的引用，即使类型 `A` 派生自类型 `B`。默认情况下，C# 实现了这一限制以确保代码的类型安全。\n\n### 协变接口\n\n假设你定义了下例所示的\
  \ `IStoreWrapper<T>` 和 `IRetrieveWrapper<T>` 接口来代替 `IWrapper<T>`，并在 `Wrapper<T>`\
  \ 类中如下实现这些接口：\n\n点击此处查看代码图像\n\n```cs\ninterface IStoreWrapper<T>\n{\n    void SetData(T\
  \ data);\n}\n\ninterface IRetrieveWrapper<T>\n{\n    T GetData();\n}\n\nclass Wrapper<T>\
  \ : IStoreWrapper<T>, IRetrieveWrapper<T>\n{\n    private T storedData;\n    void\
  \ IStoreWrapper<T>.SetData(T data)\n    {\n        this.storedData = data;\n   \
  \ }\n\n    T IRetrieveWrapper<T>.GetData()\n    {\n        return this.storedData;\n\
  \    }\n}\n```\n\n从功能上讲，`Wrapper<T>` 类与之前相同，只是你通过不同的接口访问 `SetData` 和 `GetData` 方法。\n\
  \n点击此处查看代码图像\n\n```cs\nWrapper<string> stringWrapper = new Wrapper<string>();\n\n\
  IStoreWrapper<string> storedStringWrapper = stringWrapper;\n\nstoredStringWrapper.SetData(\"\
  Hello\");\n\nIRetrieveWrapper<string> retrievedStringWrapper = stringWrapper;\n\n\
  Console.WriteLine($\"Stored value is {retrievedStringWrapper.GetData()}\");\n```\n\
  \n那么，下面的代码是合法的吗？\n\n点击此处查看代码图像\n\n```cs\nIRetrieveWrapper<object> retrievedObjectWrapper\
  \ = stringWrapper;\n```\n\n简单的回答是不，并且它会由于之前相同的错误报错。但如果你仔细考虑，虽然 C# 编译器认为这条语句不是类型安全的，但假设此点的理由已不再有效。`IRetrieveWrapper<T>`\
  \ 接口仅允许你通过 `GetData` 方法读取 `Wrapper<T>` 对象中持有的数据，不提供任何更改数据的方法。在类似此类类型参数仅作为泛型接口方法的返回值的情况下，你可以告知编译器某些隐式转换是合法的，且它不需要强制执行严格类型安全。你可以在声明类型参数时指定\
  \ `out` 关键字来实现此，如下：\n\n点击此处查看代码图像\n\n```cs\ninterface IRetrieveWrapper<out T>\n\
  {\n    T GetData();\n}\n```\n\n这一特性被称为**协变（covariance）**。只要从类型 `A` 到类型 `B` 有有效的转换，或者类型\
  \ `A` 派生自类型 `B`，你就可以将 `IRetrieveWrapper<A>` 对象赋值给 `IRetrieveWrapper<B>` 引用。下面的代码现在按预期编译并运行：\n\
  \n点击此处查看代码图像\n\n```cs\n// string 衍生 object，所以现在是合法的\nIRetrieveWrapper<object> retrievedObjectWrapper\
  \ = stringWrapper;\n```\n\n只有当类型参数作为泛型接口方法的返回值时，你才能对类型参数指定 `out` 修饰符。如果你在泛型类中使用\
  \ `out` 修饰符，协变仅对引用类型有效。这是因为值类型无法形成层次结构。因此，下面的代码将无法编译，因为 `int` 是值类型：\n\n```cs\nIEnumerable<int>\
  \ list = new List<int>();\nIEnumerable<object> objList = list;\n```\n\n.NET Framework\
  \ 定义的几个接口表现出协变性，包括第 19 章详细介绍的 `IEnumerable<T>` 接口![Image](img/Image0005.jpg) 注意，只有接口和委托类型（第\
  \ 18 章涵盖）可以被声明为协变的。\n\n### 逆变接口\n\n逆变（contravariance）遵循与协变类似的原理，但其作用方向相反；只要类型 `B`\
  \ 派生自类型 `A`，它允许你通过类型 `A` 的引用使用泛型接口来引用类型 `B` 对象。这听起来很复杂，因此值得查看 .NET Framework 类库中的示例。\n\
  \n.NET Framework 的 `System.Collections.Generic` 命名空间提供了名为 `IComparer<T>` 的接口，如下所示：\n\
  \n点击此处查看代码图像\n\n```cs\npublic interface IComparer<in T>\n{\n    int Compare(T x,\
  \ T y);\n}\n```\n\n实现此接口的类必须定义 `Compare` 方法，该方法用于比较类型参数 `T` 指定的对象。`Compare` 方法预期返回一个整数：如果参数\
  \ `x` 和 `y` 相返回零，如果 `x` 小于 `y` 返回负，如果 `x` 大于 `y` 返回正。下面的代码展示了一个根据哈希值排序对象的示例。（`GetHashCode`\
  \ 方法由 `Object` 类实现。它只是返回一个标识对象的整数值。所有引用类型都继承此方法并可以使用自己的实现进行重写。）\n\n点击此处查看代码图像\n\n\
  ```cs\nclass ObjectComparer : IComparer<Object>\n{\n    int IComparer<Object>.Compare(Object\
  \ x, Object y)\n    {\n        int xHash = x.GetHashCode();\n        int yHash =\
  \ y.GetHashCode();\n        if (xHash == yHash)\n            return 0;\n       \
  \ if (xHash < yHash)\n            return -1;\n        return 1;\n    }\n}\n```\n\
  \n你可以创建一个 `ObjectComparer` 对象并通过 `IComparer<Object>` 接口调用 `Compare` 方法来比较两个对象，如下：\n\
  \n点击此处查看代码图像\n\n```cs\nObject x = ...;\nObject y = ...;\n\nObjectComparer objectComparer\
  \ = new ObjectComparer();\n\nIComparer<Object> objectComparator = objectComparer;\n\
  \nint result = objectComparator.Compare(x, y);\n```\n\n\n\n\n那是无聊的部分。更有趣的是，你可以通过一个比较字符串的\
  \ `IComparer` 接口版本来引用同一个对象，如下所示：\n\n点击此处查看代码图片\n\n```sharp\nIComparer<String> stringComparator\
  \ = objectComparer;\n```\n\n乍一看，这条语句似乎违反了你所想象到的所有类型安全规则。然而，如果你考虑一下 `IComparer<T>`\
  \ 接口的作用，这种方法就很有道理了。`Compare` 方法的目的是根据传入的参数之间的比较结果返回一个值。如果你可以比较 `Objects`，那么你一定能够比较\
  \ `Strings`，因为 `Strings` 只是 `Objects` 的特化类型。毕竟，`String` 应该能够执行 `Object` 能做的任何事情——这正是继承的意义。\n\
  \n然而，这听起来仍然有些主观臆。C# 编译器如何知道你不会在 `Compare` 方法的代码中执行任何特定类型的操作呢？因为如果你通过一个基于不同类型的接口调用该方法，这些操作可能会失败。如果你重新查看\
  \ `IComparer` 接口的定义，你会看到类型参数之前有一个 `in` 限定符：\n\n点击此处查看代码图片\n\n```sharp\npublic interface\
  \ IComparer<in T>\n{\n    int Compare(T x, T y);\n}\n```\n\n`in` 关键字告诉 C# 编译器，你可以将类型\
  \ `T` 作为参数类型传递给方法，也可以传递任何派自 `T` 的类型。你不能将 `T` 作为任何方法的返回类型。本质上，这让你能够通过基于对象类型的泛型接口，或者通过基于派自对象类型的泛型接口来引用一个对象。基本上，如果类型\
  \ `A` 暴露了一些操作、属性或字段，那么如果类型 `B` 派自类型 `A`，它也必须暴露相同的操作（如果它们被重写了，行为可能会不同）、属性和字段。因此，用类型\
  \ `B` 的对象替换类型 `A` 的对象应该是安全的。\n\n协变（Covariance）和逆协变（Contravariance）在泛型世界中似乎是边缘话题，但它们非常有用。例如，`List<T>`\
  \ 泛型集合类（位于 `System.Collections.Generic` 命名空间中）使用 `IComparer<T>` 对象来实现 `Sort` 和 `BinarySearch`\
  \ 方法。一个 `List<Object>` 对象可以包含任何类型的对象的集合，因此 `Sort` 和 `BinarySearch` 方法需要能够排序任何类型的对象。如果不使用逆协变，`Sort`\
  \ 和 `BinarySearch` 方法将需要包含逻辑，以确定正在排序或搜索的项的真实类型，然后实现特定类型的排序或搜索机制。然而，除非你是数学家，否则很难记住协变和逆协变实际上是做什么的。根据本节的示例，我记住的记忆方式如下：\n\
  \n![Image](img/Image00001.jpg) **协变示例** 如果泛型接口中的方法可以返回字符串，那么它们也可以返回对象。（所有字符串都是对象。）\n\
  \n![Image](img/Image00001.jpg) **逆协变示例** 如果泛型接口中的方法可以接受对象参数，那么它们就可以接受字符串参数。（如果你可以使用对象执行某项操作，那么你就可以使用字符串执行相同的操作，因为所有字符串都是对象。）\n\
  \n* * *\n\n![Image](img/Image00005.jpg) 注意\n\n与协变一样，只有接口和委托类型可以声明为逆协变的。你不能为泛型类指定\
  \ `in` 修饰符。\n\n* * *\n\n## 总结\n\n在本章中，你学习了如何使用泛型来创建类型安全的类。你看到了如何通过指定类型参数来实例化泛型类型。你还看到了如何实现泛型接口并定义泛型方法。最后，你学习了如何定义协变和逆协变的泛型接口，以便可以对类型层次结构进行操作。\n\
