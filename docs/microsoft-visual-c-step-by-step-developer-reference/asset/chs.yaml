  \n## 快速参考\n\n![Image](img/Image00047.jpg)![Image](img/Image00048.jpg)\n\n## 第 4\
  \ 章。使用判断语句\n\n完成本章后，你将能够：\n\n![Image](img/Image00001.jpg) 声明布尔变量。\n\n![Image](img/Image00001.jpg)\
  \ 使用布尔运算符创建结果为真或否的表达式。\n\n![Image](img/Image00001.jpg) 编写 `if` 语句根据布尔表达式的结果做出决策。\n\
  \n![Image](img/Image00001.jpg) 编写 `switch` 语句以做出更复杂的决策。\n\n第 3 章，“编写方法和应用作用域](#text00008.html_ch03)”显示了如何将相关语句分组为方法。它还演示了如何使用参数向方法传递信息，以及如何使用\
  \ `return` 语句将信息传出方法。将程序划分为一组独立的方法（每个方法设计用于执行特定的任务或计算）是一种必要的设计策略。许多程序需要解决大型且复杂的问题。将程序拆分成方法有助于你理解这些问题，并专注于如何一次一次地解决它们。\n\
  \n第 3 章中的方法非常直观，每条语句在前条语句完成后按顺序执行。然而，为了解决许多现实世界的问题，你还需要能够编写选择性地执行不同动作、并根据情况在方法中采取不同路径的代码。在本章中，你将学习如何完成这项任务。\n\
  \n### 声明布尔变量\n\n在 C# 编程世界（与现实世界不同），一切都是黑即白的、对即错的、真即假的。例如，如果你创建一个名为 `x` 的整数变量，为其赋值值\
  \ 99，然后询问 `x` 是否包含值 99，答案无疑是真。如果你问 `x` 是否小于 10，答案无疑是否。这些都是`布尔表达式`的示例。布尔表达式始终求值为真或假。\n\
  \n* *\n\n![Image](img/Image00005.jpg) 注意这些问题的答案对于所有编程语言并不都是肯定的。C# 编译器通过确保你在检查变量之前对其赋值来解决这个问题。\n\
  \n如果你尝试检查未赋值变量的内容，程序将无法编译。\n\n* *\n\nC# 提供了一种名为 `bool` 的类型。`bool` 变量可以持有两个值之一：`true`\
  \ 或 `false`。例如，以下三条语句声明了一个名为 `areYouReady` 的 `bool` 变量，为其赋值 `true`，然后将其值写入控制台：\n\
  \n点击此处查看代码\n\n```csharp\nbool areYouReady;\nareYouReady = true;\nConsole.WriteLine(areYouReady);\
  \ // 在控制台输出 True\n```\n\n### 使用布尔运算符\n\n布尔运算符是执行结果为真或假的计算的运算符。C# 有许多实用的布尔运算符，最简单的是由感叹号（`!`）表示的取反运算符。在前一个例子中，如果变量\
  \ `areYouReady` 的值为真，表达式 `!areYouReady` 的值为假。\n\n#### 理解相等和关系运算符\n\n你经常使用的两个布尔运算符是相等\
  \ (`==`) 和不等 (`!=`)。这些是二元运算符，可以通过它们判断两个相同类型的值是否相等，产生布尔结果。下表总结了这些运算符的工作原理，并以名为 `age`\
  \ 的 `int` 变量为例。\n\n![Image](img/Image00049.jpg)\n\n与 `==` 和 `!=` 紧密相关的是`关系`运算符。你使用这些运算符来发现一个值是否小于或大于相同类型的值。下表显示了如何使用这些运算符。\n\
  \n![Image](img/Image00050.jpg)\n\n不要将*相等*运算符 `==` 与*赋值*运算符 `=` 混淆。表达式 `x==y` 比较\
  \ `x` 和 `y`，如果值相同则值为 `true`。表达式 `x=y` 将 `y` 的值赋值给 `x` 并返回 `y` 的值作为其结果。\n\n#### 理解条件逻辑运算符\n\
  \n\n\n\n\nC# 还提供了另外两个二元布尔运算符：逻辑与运算符（AND），用 `&&` 符号表示，以及逻辑或运算符（OR），用 `||` 符号表示。这些运算符统称为\
  \ `条件逻辑运算符`。它们的目的是将两个布尔表达式或值合并为一个布尔结果。这些运算符与相等运算符和关系运算符的相似之处在于，它们所处的表达式的值要么为真为假，但不同之处在于，它们所操作的值也必须是真或假二者一。\n\
  \n`&&` 运算符的结果当且仅当它所评估的两个布尔表达式均为 `true` 时为 `true`。例如，以下语句仅当 `percent` 的值大于等于 0 且\
  \ `percent` 的值小于等于 100 时，将值 `true` 赋值给 `validPercentage`：\n\n点击此处查看代码图片\n\n```\n\
  bool validPercentage;\n\nvalidPercentage = (percent >= 0) && (percent <= 100);\n\
  ```\n\n![Image](img/Image00013.jpg) 提示\n\n初学者常见的错误错误是尝试通过只命名一次 `percent` 变量来结合两个测试，如下所示：\n\
  \n点击此处查看代码图片\n\n```\npercent >= 0 && <= 100 // 此语句将无法编译\n```\n\n使用括号有助于避免此类错误，并明确表达式的意图。例如，比较\n\
  \n点击此处查看代码图片\n\n```\nvalidPercentage = percent >= 0 && percent <= 100\n```\n\n和\n\
  \n点击此处查看代码图片\n\n```\nvalidPercentage = (percent >= 0) && (percent <= 100)\n```\n\
  \n这两个表达式返回相同的值，因为 `&&` 运算符的优先级低于 `>=` 和 `<=`。然而，第二个表达式以一种更具可读性的方式传达了它的意图。\n\n`||`\
  \ 运算符的结果当它所评估的布尔表达式中任一为 `true` 时为 `true`。你使用 `||` 运算符来确定组合布尔表达式中是否有任意一个为 `true`。例如，以下语句当\
  \ `percent` 的值小于 0 或 `percent` 的值大于 100 时，将值 `true` 赋值给 `invalidPercentage`：\n\n\
  点击此处查看代码图片\n\n```\nbool invalidPercentage;\n\ninvalidPercentage = (percent < 0)\
  \ || (percent > 100);\n```\n\n### 短路逻辑\n\n`&&` 和 `||` 运算符都表现出名为`短路逻辑`的特性。有时，在确定条件逻辑表达式的结果时，没有必要评估两个操作数。例如，如果\
  \ `&&` 运算符的左操作数评估为 `false`，则整个表达式的结果必须为 `false`，无论右操作数的值是什么。同样，如果 `||` 运算符的左操作数的值评估为\
  \ `true`，则整个表达式的结果必须为 `true`，无论右操作数的值如何。在这些情况下，`&&` 和 `||` 运算符跳过了对右侧操作数的评估。以下是一些示例：\n\
  \n点击此处查看代码图片\n\n```\n(percent >= 0) && (percent <= 100)\n```\n\n在此表达式中，如果 `percent`\
  \ 的值小于 0，`&&` 左侧的布尔表达式评估为 `false`。这个值意味着整个表达式的结果必须为 `false`，`&&` 运算符右侧的布尔表达式不会评估。\n\
  \n点击此处查看代码图片\n\n```\n(percent < 0) || (percent > 100)\n```\n\n在此表达式中，如果 `percent`\
  \ 的值小于 0，`||` 左侧的布尔表达式评估为 `true`。这个值意味着整个表达式的结果必须为 `true`，`||` 运算符右侧的布尔表达式不会评估。\n\
  \n如果你仔细设计使用条件逻辑运算符的表达式，就可以通过避免不必要的工作来提高代码性能。将易评估的简单布尔表达式放在条件逻辑运算符的左侧。\n\n\n\n\n\
  在下面的示例中，将 `seconds` 变量重置为 0 并增加 `minutes` 变量的两个语句被组合在一个块中，如果 `seconds` 的值等于 59，则执行整个代码块：\n\
  \n```csharp\nint seconds = 0;\n\nint minutes = 0;\n\n...\n\nif (seconds == 59)\n\
  {\n    seconds = 0;\n    minutes++;\n}\nelse\n{\n    seconds++;\n}\n```\n\n***\n\
  \n![Image](img/Image00004.jpg) 重要提示\n\n如果你省略了大括号，C# 编译器仅会将第一个语句（`seconds = 0;`）与\
  \ `if` 语句关联。当程序编译时，随后的语句（`minutes++;`）不会被编译器识别为 `if` 语句的一部分。此外，当编译器遇到 `else` 关键字时，它不会将其与之前的\
  \ `if` 语句关联；而是会报告语法错误。因此，良好的做法是始终在块内定义 `if` 语句每个分支的语句，即使该块只包含一个单一语句。如果你以后想添加额外的代码，这可能会为你节省很多麻烦。\n\
  \n***\n\n代码块还会开启一个新的作用域。你可以在块内部定义变量，但它们会在块结束时消失。下面的代码片段说明了这一点：\n\n点击此处查看代码图像\n\n\
  ```csharp\nif (...)\n{\n    int myVar = 0;\n    ... // 在此处可以使用 myVar\n} // myVar\
  \ 在此处消失\nelse\n{\n    // 在此处无法使用 myVar\n    ...\n}\n\n// 在此处无法使用 myVar\n```\n\n\
  ### 级联 if 语句\n\n你可以将 `if` 语句嵌套在其他 `if` 语句内部。通过这种方式，你可以连接一系列布尔表达式，按顺序测试这些表达式，直到其中一个结果为\
  \ `true`。在下面的示例中，如果 `day` 的值为 0，第一个测试结果为 `true` 并为 `dayName` 赋值字符串 `\"Sunday\"`。如果\
  \ `day` 的值不为 0，第一个测试失败，控制传递到 `else` 子句，该子句运行第二个 `if` 语句并将 `day` 的值与 1 进行比较。只有当第一个测试结果为\
  \ `false` 时，才会执行第二个 `if` 语句。同样，第三个 `if` 语句只有在第一个和第二个测试都为 `false` 时才会执行。\n\n```csharp\n\
  if (day == 0)\n{\n    dayName = \"Sunday\";\n}\nelse if (day == 1)\n{\n    dayName\
  \ = \"Monday\";\n}\nelse if (day == 2)\n{\n    dayName = \"Tuesday\";\n}\nelse if\
  \ (day == 3)\n{\n    dayName = \"Wednesday\";\n}\nelse if (day == 4)\n{\n    dayName\
  \ = \"Thursday\";\n}\nelse if (day == 5)\n{\n    dayName = \"Friday\";\n}\nelse\
  \ if (day == 6)\n{\n    dayName = \"Saturday\";\n}\nelse\n{\n    dayName = \"unknown\"\
  ;\n}\n```\n\n在下面的练习中，你将编写一个方法，使用级联 `if` 语句来比较两个日期。\n\n#### 编写 if 语句\n\n**1.** 如果\
  \ Microsoft Visual Studio 2015 尚未运行，请启动它。\n\n**2.** 打开 Selection 项目，它位于你文档文件夹中的\
  \ `\\Microsoft Press\\VCSBS\\Chapter 4\\Selection` 文件夹。\n\n**3.** 在 Debug（调试）菜单上，点击\
