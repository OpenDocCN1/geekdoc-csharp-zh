  \n**14.** 按回车键结束程序并返回 Visual Studio 2015。\n\n**15.** 在 `Point.cs` 文件中编辑 `Point`\
  \ 类，添加两个类型为 `int` 的私有字段 `x` 和 `y` 来表示点的坐标。你将修改构造函数以初始化这些字段。`Point` 类现在应该如下：\n\n\
  点击此处查看代码图像\n\n```csharp\nclass Point\n{\n    private int x, y;\n    public Point()\n\
  \    {\n        Console.WriteLine(\"default constructor called\");\n    }\n\n  \
