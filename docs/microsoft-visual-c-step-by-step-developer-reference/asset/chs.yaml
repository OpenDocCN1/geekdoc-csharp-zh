  \ `Program.cs` 文件中 `Program` 类的代码编辑器窗口中，在类顶部列表中添加以下 `using` 指令：\n\n```cs\nusing\
  \ BinaryTree;\n```\n\n**7.** 在 `Main` 方法中添加后续代码中加粗所示的语句：\n\n点击此处查看代码图像\n\n```cs\n\
  static void Main(string[] args)\n{\n    Tree<int> tree1 = new Tree<int>(10);\n \
  \   tree1.Insert(5);\n    tree1.Insert(11);\n    tree1.Insert(5);\n    tree1.Insert(-12);\n\
