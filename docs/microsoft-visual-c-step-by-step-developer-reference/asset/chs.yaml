  \    void SetColor(Color color);\n}\n```\n\n## 13. 删除此方法，并将其替换为名为 `Color` 的属性的定义，如下所示：\n\
  \n```csharp\ninterface IColor\n{\n    Color Color { set; }\n}\n```\n\n这是一个只写属性，提供了\
  \ `set` 访问器但没有 `get` 访问器。你之所以这样定义属性，是因为颜色实际上并没有存储在 `DrawingShape` 类中，而是在是在绘制每个形状时才指定的；你无法实际地通过查询形状来查找它是什么颜色。\n\
  \n* *\n\n![Image](img/Image00005.jpg) 备注\n属性与类型共享相同的名称（在本例中为 `Color`）是一种常见的做法。\n\
  \n* * *\n\n## 14. 回到代码和文本编辑器中的 `DrawingShape` 类。将该类中的 `SetColor` 方法替换为此处所示的 `Color`\
  \ 属性：\n\n点击此处查看代码图像\n\n```csharp\npublic Color Color\n{\n    set\n    {\n      \
  \  if (this.shape != null)\n        {\n            SolidColorBrush brush = new SolidColorBrush(value);\n\
  \            this.shape.Fill = brush;\n        }\n    }\n}\n```\n\n* * *\n\n![Image](img/Image00005.jpg)\
  \ 备注\n`set` 访问器的代码与原始的 `SetColor` 方法几乎相同，只是创建 `SolidColorBrush` 对象的语句传递了 `value`\
  \ 参数。\n\n* * *\n\n## 15. 回到代码和文本编辑器中的 `DrawingPad.xaml.cs` 文件。在 `drawingCanvas_Tapped`\
  \ 方法中，修改设置 `Square` 对象颜色的语句，使其与下面的加粗代码匹配：\n\n点击此处查看代码图像\n\n```csharp\nif (mySquare\
  \ is IColor)\n{\n    IColor colorSquare = mySquare;\n    colorSquare.Color = Colors.BlueViolet;\n\
  }\n```\n\n## 16. 同样，在 `drawingCanvas_RightTapped` 方法中，修改设置 `Circle` 对象颜色的语句。\n\n\
  点击此处查看代码图像\n\n```csharp\nif (myCircle is IColor)\n{\n    IColor colorCircle = myCircle;\n\
  \    colorCircle.Color = Colors.HotPink;\n}\n```\n\n## 17. 验证应用程序运行正常。\n\n## 18.\
  \ 在调试（Debug）菜单上，点击启动（Start）。\n\n## 19. 生成自动属性\n\n正如本章早期提到的，属性的主要目的是隐藏字段的实现细节。然而，至少有两个正当的理由说明你应该定义属性而不是暴露字段：\n\
  \n### 与应用程序的兼容性\n如果你以后决定确实需要将这些字段更改为属性，现有的应用程序在不重新编译的情况下无法使用更新版本。如果你已经在大量设备上部署了该应用程序，这将会很尴尬。虽然有办法解决这个问题，但通常最好是从源上避免陷入这种情况。\n\
  \n### 与接口的兼容性\n如果你正在实现一个接口，并且接口将某项定义为属性，你必须编写一个匹配接口的属性，即使该属性只是读取和写入字段中的数据。你不能简单地通过暴露同名的公共字段来实现属性。\n\
  \nC# 语言的设计者意识到程序员是忙碌的人，不应该浪费时间编写比需要更多的代码。为此，C# 编译器可以自动生成属性的代码，如下所示：\n\n```csharp\n\
  class Circle\n{\n    public int Radius{ get; set; }\n    ...\n}\n```\n\n在此示例中，`Circle`\
  \ 类包含名为 `Radius` 的属性。除了该属性的类型外，你没有指定属性如何工作——`get` 和 `set` 访问器是空的。C# 编译器会将此定义转换为一个私有字段和一个类似于下面的默认实现：\n\
  \n```csharp\nclass Circle\n{\n    private int _radius;\n    public int Radius\n\
  \    {\n        get\n        {\n            return this._radius;\n        }\n  \
  \      set\n        {\n            this._radius = value;\n        }\n    }\n   \
  \ ...\n}\n```\n\n因此，只需少量努力你就可以使用自动生成的代码来实现简单的属性，如果你以后需要额外的逻辑，可以这样做而不会破坏任何现有的应用程序。\n\
  \n\n\n\n\n定义自动属性的语法与在接口中定义属性的语法几乎相同。区别在于，自动属性可以指定访问修饰符，如 `private`、`public` 或 `protected`。\n\
  \n***\n\n你可以通过从属性声明中省略空的 `set` 访问器来创建一个只读自动属性，如下所示：\n\n点击此处查看代码图片\n\n```csharp\n\
  class Circle\n{\npublic DateTime CircleCreatedDate { get; }\n...\n}\n```\n\n这在在你想要创建一个不可变属性的场景下非常有用；即一个在对象构造时设置且随后无法更改的属性。例如，你可能想要设置对象创建的日期或创建该对象的用户名，或者你可能想为对象生成一个唯一的标识符值。这些通常是你只想要设置一次，然后防止它们被修改的值。考虑到这一点，C#\
  \ 允许你通过两种方式之一初始化只读自动属性。你可以从构造函数初始化属性，如下所示：\n\n点击此处查看代码图片\n\n```csharp\nclass Circle\n\
  {\npublic Circle()\n{\nCircleCreatedDate = DateTime.Now;\n}\npublic DateTime CircleCreatedDate\
  \ { get; }\n...\n}\n```\n\n或者，你也可以作为声明的一部分来初始化属性，如下所示：\n\n点击此处查看代码图片\n\n```csharp\n\
  class Circle\n{\npublic DateTime CircleCreatedDate { get; } = DateTime.Now;\n...\n\
  }\n```\n\n请注意，如果你以此种方式初始化属性，并且在构造函数中设置了它的值，则构造函数提供的值将覆盖属性初始化器指定的值；请使用其中一种方法，而不要两者都用！\n\
  \n***\n\n![Image](img/Image00005.jpg) 注意\n\n你不能创建只写入的自动属性。如果你尝试创建一个不带 `get` 访问器的自动属性，你将看到编译时错误。\n\
  \n***\n\n### 使用属性初始化对象\n\n在第 7 章中，你学习了如何定义构造函数来初始化对象。一个对象可以有多个构造函数，你可以定义具有不同参数的构造函数来初始化对象中的不同元素。例如，你可以定义一个模拟三角形的类，如下：\n\
  \n点击此处查看代码图片\n\n```csharp\npublic class Triangle\n{\nprivate int side1Length;\n\
  private int side2Length;\nprivate int side3Length;\n// 默认构造函数 - 所有边的边的默认值\npublic\
  \ Triangle()\n{\nthis.side1Length = this.side2Length = this.side3Length = 10;\n\
  }\n// 为 side1Length 指定长度，其他边使用默认值\npublic Triangle(int length1)\n{\nthis.side1Length\
  \ = length1;\nthis.side2Length = this.side3Length = 10;\n}\n// 为 side1Length 和 side2Length\
  \ 指定长度，\n// side3Length 使用默认值\npublic Triangle(int length1, int length2)\n{\nthis.side1Length\
  \ = length1;\nthis.side2Length = length2;\nthis.side3Length = 10;\n}\n// 为所有边指定长度\n\
  public Triangle(int length1, int length2, int length3)\n{\nthis.side1Length = length1;\n\
  this.side2Length = length2;\nthis.side3Length = length3;\n}\n}\n```\n\n取决于类包含的字段数量以及你想要启用的字段化的各种组合，你最终可能会编写很多构造函数。如果许多字段具有相同类型，也存在潜在问题：你可能无法为所有字段组合编写一个唯一的构造函数。例如，在前面的\
  \ `Triangle` 类中，你无法轻松地添加一个仅初始化 `side1Length` 和 `side3Length` 字段的构造函数，因为它没有唯一的签名；它将接受两个\
  \ `int` 参数，而初始化 `side1Length` 和 `side2Length` 的构造函数已经有了这个签名。一种可能的解决方案是定义一个接受可选参数的构造函数，并在创建\
  \ `Triangle` 对象时以具命名参数的形式为参数指定值。然而，一个更且且更透明的解决方案是将私有字段初始化为一组默认值，并将它们暴露为属性，如下所示：\n\
  \n点击此处查看代码图片\n\n```csharp\npublic class Triangle\n{\nprivate int side1Length = 10;\n\
  private int side2Length = 10;\nprivate int side3Length = 10;\npublic int Side1Length\n\
  {\nset { this.side1Length = value; }\n}\npublic int Side2Length\n{\nset { this.side2Length\
  \ = value; }\n}\npublic int Side3Length\n{\nset { this.side3Length = value; }\n\
  }\n}\n```\n\n当你创建一个类的实例时，你可以通过指定任何具有 `set` 访问器的公共属性的名称和值来初始化它。例如，你可以创建 `Triangle`\
  \ 对象并初始化三边的任何组合，如下所示：\n\n点击此处查看代码图片\n\n```csharp\nTriangle tri1 = new Triangle()\
  \ { Side1Length = 10, Side2Length = 20, Side3Length = 30 };\nTriangle tri2 = new\
  \ Triangle() { Side1Length = 15, Side2Length = 15, Side3Length = 15 };\nTriangle\
  \ tri3 = new Triangle() { Side1Length = 5, Side2Length = 10, Side3Length = 15 };\n\
  ```\n\n这种语法被称为对象初始化器。当你以这种方式调用对象初始化器时，C# 编译器生成的代码调用默认构造函数，然后调用每个命名属性的 `set` 访问器来初始化它。你可以结合非默认构造函数指定对象初始化器。例如，如果\
  \ `Triangle` 类还提供接受单个参数描述类型的构造函数，你可以调用此构造函数并初始化其他属性，如下：\n\n```csharp\nTriangle tri5\
  \ = new Triangle(\"Equilateral triangle\") { Side1Length = 3, Side2Length = 3, Side3Length\
  \ = 3 };\n```\n\n要点是构造函数首先运行，然后设置属性。如果构造函数将对象的字段设置为特定值，而你指定的属性更改了这些值，那么理解这种顺序是非常重要的。你也可以对非只读的自动属性使用对象初始化器，正如你将在下一个练习中看到的。在这个练习中，你将定义一个正多边形类，该类包含提供有关多边形包含边数以及这些边长度信息的自动属性。\n\
  \n\n\n\n\n```csharp\nthis.NumSides = 4;\nthis.SideLength = 10.0;\n}\n```\n\n此构造函数用默认值初始化\
  \ `NumSides` 和 `SideLength` 字段。在练习中，默认的多边形是一个边长为 10 个单位的正方形。\n\n**5.** 在“代码和文本编辑器”窗口中显示\
  \ `Program.cs` 文件。\n\n**6.** 在 `doWork` 方法中添加此处所示的加粗语句，替换掉 `// TODO:` 注释：\n\n点击此处查看代码图像\n\
  \n```csharp\nstatic void doWork()\n{\n    Polygon square = new Polygon();\n    Polygon\
  \ triangle = new Polygon { NumSides = 3 };\n    Polygon pentagon = new Polygon {\
  \ SideLength = 15.5, NumSides = 5 };\n}\n```\n\n这些语句创建了 `Polygon` 对象。`square` 变量使用默认构造函数初始化。`triangle`\
  \ 和 `pentagon` 变量也使用默认构造函数初始化，然后这些代码更改了 `Polygon` 类暴露的属性值。对于 `triangle` 变量，`NumSides`\
  \ 属性被设置为 3，但 `SideLength` 属性保留了其默认值 10.0。对于 `pentagon` 变量，代码更改了 `SideLength` 和 `NumSides`\
  \ 属性的值。\n\n**7.** 在 `doWork` 方法末尾添加此处所示的加粗代码：\n\n点击此处查看代码图像\n\n```csharp\nstatic\
  \ void doWork()\n{\n    ...\n    Console.WriteLine($\"Square: number of sides is\
  \ {square.NumSides}, length of each side is {square.SideLength}\");\n    Console.WriteLine($\"\
  Triangle: number of sides is {triangle.NumSides}, length of each side is {triangle.SideLength}\"\
  );\n    Console.WriteLine($\"Pentagon: number of sides is {pentagon.NumSides}, length\
  \ of each side is {pentagon.SideLength}\");\n}\n```\n\n这些语句显示了每个 `Polygon` 对象的 `NumSides`\
  \ 和 `SideLength` 属性的值。\n\n**8.** 在“调试”菜单上，点击“不调试启动”。验证程序是否生成并运行，并将此处所示的消息写入控制台窗口：\n\
