  \n## 28. 按回车键关闭应用程序并返回 Visual Studio 2015。\n\n### 理解扩展方法\n\n继承是一项强大的功能，它允许你通过创建一个派生自该类的新类来扩展该类的功能。然而，有时使用继承并不是添加新行为的最合适机制，特别是当你需要快速扩展一个类型而不影响现有代码时。\n\
  \n例如，假设你想为 `int` 类型添加一个新功能，例如一个名为 `Negate` 的方法，该方法返回整数所包含的负值。（我知道你可以简单地使用单目运算符 `–`\
  \ 来完成相同的任务，请听我说。）实现这一点的一种方法是定义一个名为 `NegInt32` 的新类型，它继承自 `System.Int32`（`int` 是 `System.Int32`\
  \ 的别名）并添加 `Negate` 方法：\n\n点击此处查看代码图像\n\n```csharp\nclass NegInt32 : System.32 //\
  \ 不要尝试这个！\n{\npublic int Negate()\n{\n...\n}\n```\n\n理论上 `NegInt32` 将继承与 `System.Int32`\
  \ 类型相关的所有功能，外加 `Negate` 方法。有两个原因导致你可能不想采用这种方法：\n\n![Image](img/Image00001.jpg) 此方法仅适用于\
  \ `NegInt32` 类型，如果你想对现有的 `int` 变量使用它，你必须将每个 `int` 变量的定义更改为 `NegInt32` 类型。\n\n![Image](img/Image00001.jpg)\
  \ `System.Int32` 类型实际上是一个结构（struct），而不是类，你不能对结构使用继承。\n\n这就是扩展方法变得非常有用的地方。\n\n使用扩展方法，你可以通过额外的静态方法扩展现有的类型（类或结构）。这些静态方法在任何引用被扩展类型数据的语句中，都会立即对你的代码可用。\n\
  \n你在一个静态类中定义扩展方法，并将该方法适用的类型作为方法的第一个参数，并带有 `this` 关键字。这里有一个示例显示了你如何实现 `Negate` 方法：\n\
  \n```csharp\nstatic class Util\n{\npublic static int Negate(this int i)\n{\n}\n\
  ```\n\n这种理论上是 `NegInt32` 将继承与 `System.Int32` 类型相关的所有功能，外加 `Negate` 方法。有两个原因导致你可能不想遵循这种方法：\n\
  \n![Image](img/Image00001.jpg) 此方法仅适用于 `NegInt32` 类型，如果你想对现有的 `int` 变量使用它，你必须将每个\
  \ `int` 变量的定义更改为 `NegInt32` 类型。\n\n![Image](img/Image00001.jpg) `System.Int32` 类型实际上是一个结构（struct），而不是类，你不能对结构使用继承。\n\
  \n这就是扩展方法变得非常有用的地方。\n\n使用扩展方法，你可以通过额外的静态方法扩展现有的类型（类或结构）。这些静态方法在任何引用被扩展类型数据的语句中，都会立即对你的代码可用。\n\
  \n你在一个静态类中定义扩展方法，并将该方法适用的类型作为方法的第一个参数，并带有 `this` 关键字。这里有一个示例显示了你如何实现 `Negate` 方法：\n\
  \n```csharp\nstatic class Util\n{\npublic static int Negate(this int i)\n{\nreturn\
  \ -i;\n}\n```\n\n这种语法看起来有点奇怪，但 `this` 关键字修饰 `Negate` 标识了它是一个扩展方法，而 `this` 修饰 `int`\
  \ 意味着你正在扩展 `int` 类型。\n\n要使用该扩展方法，将 `Util` 类引入作用域。（如有必要，添加一个指定 `Util` 类所属命名空间的 `using`\
  \ 语句。）然后你可以直接使用点符号（`.`）引用该方法，如下：\n\n```csharp\nint x = 591;\nConsole.WriteLine(x.Negate());\n\
  ```\n\n注意，你不需要在调用该方法的任何语句中引用 `Util` 类。C# 编译器会自动检测来自给定类型的所有静态类的扩展方法。你也可以通过传递一个 `int`\
  \ 来调用 `Util.Negate` 方法，尽管这种用法消除了将其定义为扩展方法的意义：\n\n```csharp\nint x = 591;\nConsole.WriteLine(Util.Negate(x));\n\
  ```\n\n在接下来的练习中，你将为 `int` 类型添加一个扩展方法。通过这个扩展方法，你可以将 `int` 变量中的值从进制转换为该值在不同基数下的表示。\n\
  \n### 创建扩展方法\n\n1. 在 Visual Studio 2015 中，打开 `ExtensionMethod` 项目，该项目位于文档文件夹中的 `Microsoft\
  \ Press\\VCSBS\\Chapter 12\\ExtensionMethod` 文件夹下。\n\n2. 在代码和文本编辑器窗口中显示 `Util.cs`\
  \ 文件。\n\n该文件在一个名为 `Extensions` 的命名空间中包含一个静态类 `Util`。记住你要在静态类内部定义扩展方法。除了 `// TODO:`\
  \ 注释外，类是空的。\n\n3. 删除注释并在 `Util` 类中声明一个公共静态方法 `ConvertToBase`。该方法接收两个参数：一个名为 `i`\
  \ 的 `int` 参数，由 `this` 关键字修饰以指示它是针对 `int` 类型的扩展方法；另一个普通的 `int` 参数名为 `baseToConvertTo`。\n\
  \n该方法将 `i` 中的值转换为由 `baseToConvertTo` 指定的基。该方法应返回一个包含转换值的 `int`。\n\n`ConvertToBase`\
  \ 方法应该是这样的：\n\n```csharp\nstatic class Util\n{\npublic static int ConvertToBase(this\
  \ int i, int baseToConvertTo)\n{\n\n}\n}\n```\n\n4. 在 `ConvertToBase` 方法中添加 `if`\
  \ 语句，检查 `baseToConvertTo` 参数的值是否在 2 到 10 之间。\n\n\n\n\n\n本练习中使用的算法在该值范围之外无法可靠地工作。如果\
  \ `baseToConvertTo` 的值超出此范围，请抛出一个带有适当消息的 `ArgumentException` 异常。\n\n`ConvertToBase`\
  \ 方法应该如下：\n\n点击此处查看代码图像\n\n```sharp\npublic static int ConvertToBase(this int i,\
  \ int baseToConvertTo)\n{\n    if (baseToConvertTo < 2 || baseToConvertTo > 10)\n\
  \    {\n        throw new ArgumentException(\"Value cannot be converted to base\
  \ \" + baseToConvertTo.ToString());\n    }\n}\n```\n\n### 5. 在 `ConvertToBase` 方法中，将**加粗显示的以下语句**添加到抛出\
  \ `ArgumentException` 异常的语句之后。\n\n这段代码实现了一种著名的算法，可以将数字从基 10 转换为不同的基数。（第 5 章，“使用复合赋值和迭代语句，”展示了该算法的一个版本，用于将十进制转换为八进制。）\n\
  \n点击此处查看代码图像\n\n```sharp\npublic static int ConvertToBase(this int i, int baseToConvertTo)\n\
  {\n    ...\n    int result = 0;\n    int iterations = 0;\n    do\n    {\n      \
  \  int nextDigit = i % baseToConvertTo;\n        i /= baseToConvertTo;\n       \
  \ result += nextDigit * (int)Math.Pow(10, iterations);\n        iterations++;\n\
  \    }\n    while (i != 0);\n    return result;\n}\n```\n\n### 6. 在代码和文本编辑器窗口中显示\
  \ `Program.cs` 文件。\n\n### 7. 在文件顶部的 `using System;` 指令之后添加以下 `using` 指令：\n\n```csharp\n\
