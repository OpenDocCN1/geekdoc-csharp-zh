  \ 随机数生成对象的 `Next` 方法返回一个对应于花色的随机数。`Next` 方法的参数指定了所用范围的开区间上限；选中的值在 0 和该值减 1 之间。注意返回的值是一个\
  \ `int`，因此在将其赋值给 `Suit` 变量之前必须对其进行强制转换。\n\n始终存在所选花色没有剩余牌牌的情况。你需要处理这种情况，并在必要时选择另一个花色。\n\
  \n### 13. 处理空花色\n在随机选择花色的代码之后，添加随后的（**加粗**）`while` 循环。\n\n此循环调用 `IsSuitEmpty` 方法来确定牌组中是否还有指定花色的牌（你稍后将实现该方法的逻辑）。如果没有，它将随机选择另一个花色（实际上可能会再次选到同一个花色）并再次检查。循环重复此过程，直到找到至少留一张牌的花色。\n\
  \n点击此处查看代码图像\n\n```csharp\npublic PlayingCard DealCardFromPack()\n{\n    Suit suit\
  \ = (Suit)randomCardSelector.Next(NumSuits);\n    while (this.IsSuitEmpty(suit))\n\
  \    {\n        suit = (Suit)randomCardSelector.Next(NumSuits);\n    }\n}\n```\n\
  \n### 14. 随机选择值\n你现在已经随机选择了一个至少剩一张牌的花色。下一个任务是在此花色中随机选择一张牌。你可以使用随机数生成器来选择一个牌的值，但和之前一样，无法保证所选点数的牌还没有发过。然而，你可以像之前一样使用\
  \ `IsCardAlreadyDealt` 方法（你稍后会完成）来判断该牌是否已经发过，如果是，则随机选择另一个牌并再次尝试，直到找到为止。为了实现这一点，在\
  \ `DealCardFromPack` 方法中现有代码之后添加此处**加粗**的语句：\n\n点击此处查看代码图像\n\n```csharp\npublic\
  \ PlayingCard DealCardFromPack()\n{\n    ...\n    Value value = (Value)randomCardSelector.Next(CardsPerSuit);\n\
  \    while (IsCardAlreadyDealt(suit, value))\n    {\n        value = (Value)randomCardSelector.Next(CardsPerSuit);\n\
  \    }\n}\n```\n\n### 15. 返回牌\n你现在已经选择了一张没有发过的随机牌。在 `DealCardFromPack` 方法末尾添加以下代码以返回此牌，并将\
  \ `cardPack` 数组中的相应元素设置为 `null`：\n\n点击此处查看代码图像\n\n```csharp\npublic PlayingCard\
  \ DealCardFromPack()\n{\n    ...\n    PlayingCard card = this.cardPack[(int)suit,\
  \ (int)value];\n    this.cardPack[(int)suit, (int)value] = null;\n    return card;\n\
  }\n```\n\n### 16. 实现 IsSuitEmpty\n定位 `IsSuitEmpty` 方法。记住，该方法的目的是接收 `Suit` 参数并返回一个布尔值，表示牌组中是否还有该花色的牌。删除该方法中的注释以及抛出\
  \ `NotImplementedException` 异常的语句，然后添加此处**加粗**的代码：\n\n点击此处查看代码图像\n\n```csharp\n\
  private bool IsSuitEmpty(Suit suit)\n{\n    bool result = true;\n    for (Value\
  \ value = Value.Two; value <= Value.Ace; value++)\n    {\n        if (!IsCardAlreadyDealt(suit,\
  \ value))\n        {\n            result = false;\n            break;\n        }\n\
  \    }\n    return result;\n}\n```\n\n此代码遍历所有的牌值，并使用 `IsCardAlreadyDealt` 方法（你将在下一步完成）来确定\
  \ `cardPack` 数组中是否存在具有指定花色值的牌。如果循环找到了牌，`result` 变量的值将设置为 `false`，`break` 语句将终止循环。如果循环在未找到牌的情况下完成，`result`\
  \ 变量将保持其初始值 `true`。`result` 变量的值作为方法的返回值传。\n\n### 17. 实现 IsCardAlreadyDealt\n找到\
  \ `IsCardAlreadyDealt` 方法。该方法的目的是确定指定花色和点数的牌是否已经发过并从牌组中移除。你稍后会看到 `DealCardFromPack`\
  \ 方法发牌，它从 `cardPack` 数组中移除该牌并将相应元素设置为 `null`。用此处加粗的代码替换方法体：\n\n点击此处查看代码图像\n\n```csharp\n\
  private bool IsCardAlreadyDealt(Suit suit, Value value)\n    => (this.cardPack[(int)suit,\
  \ (int)value] == null);\n```\n\n如果 `cardPack` 数组中对应花色和点值的元素为 `null`，则该方法返回 `true`，否则返回\
  \ `false`。\n\n\n\n\n# 18. 下一步是将选定的卡牌添加到手牌中。打开 `Hand.cs` 文件并在代码和文本编辑器窗口中显示它。此文件包含\
