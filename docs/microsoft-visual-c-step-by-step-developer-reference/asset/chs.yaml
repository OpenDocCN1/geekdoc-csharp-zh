  \ 实现泛型接口。\n\n![Image](img/Image00001.jpg) 定义一个泛型方法，实现一个独立于其操作数据类型类型的算法。\n\n第 8 章，“理解值和引用](#text00014.html_ch08)”，向你展示了如何使用\
  \ `object` 类型来引用任何类的实例。你可以使用 `object` 类型存储任何类型的值，并且在需要向方法传递任何类型的值时，可以使用 `object`\
  \ 类型来定义参数。方法也可以通过指定 `object` 为返回类型来返回任何类型的值。尽管这种做法非常灵活，但它将记忆实际使用了什么种数据的责任放在了程序员身上。如果程序员犯了错误，可能会导致运行时错误。在本章中，你将学习泛型，这是一种旨在帮助你防止此类错误的特性。\n\
  \n### `object` 类型的问题\n\n为了理解泛型，有必要详细查看它们设计用来解决的问题。\n\n假设你需要建模一个先进先出的结构，例如队列（queue）。你可以创建一个如下类：\n\
  \n点击此处查看代码图像\n\n```csharp\nclass Queue\n{\n    private const int DEFAULTQUEUESIZE\
  \ = 100;\n    private int[] data;\n    private int head = 0, tail = 0;\n    private\
  \ int numElements = 0;\n\n    public Queue()\n    {\n        this.data = new int[DEFAULTQUEUESIZE];\n\
  \    }\n\n    public Queue(int size)\n    {\n        if (size > 0)\n        {\n\
  \            this.data = new int[size];\n        }\n        else\n        {\n  \
  \          throw new ArgumentOutOfRangeException(\"size\", \"必须大于零\");\n       \
  \ }\n    }\n\n    public void Enqueue(int item)\n    {\n        if (this.numElements\
  \ == this.data.Length)\n        {\n            throw new Exception(\"队列满\");\n \
  \       }\n        this.data[this.head] = item;\n        this.head++;\n        this.head\
  \ %= this.data.Length;\n        this.numElements++;\n    }\n\n    public int Dequeue()\n\
  \    {\n        if (this.numElements == 0)\n        {\n            throw new Exception(\"\
  队列空\");\n        }\n        int queueItem = this.data[this.tail];\n        this.tail++;\n\
  \        this.tail %= this.data.Length;\n        this.numElements--;\n        return\
  \ queueItem;\n    }\n}\n```\n\n该类使用数组来提供一个存储数据的循环缓冲区。数组的大小由构造函数指定。应用程序使用 `Enqueue`\
  \ 方法向队列中添加项，使用 `Dequeue` 方法从队列中取出项。私有字段 `head` 和 `tail` 跟踪位置，`numElements` 字段指示队列中的元素数量。`Enqueue`\
  \ 方法将项插入到数组中，`Dequeue` 方法从数组中取出项。`head` 和 `tail` 字段记录了在数组中的操作位置，`numElements` 字段指示了队列中的数量。`Enqueue`\
  \ 方法将项插入到数组中，`Dequeue` 方法从数组中取出项。`head` 和 `tail` 字段记录了在数组中的操作位置，`numElements` 字段指示了队列中的数量。`Enqueue`\
  \ 方法将项插入到数组中，`Dequeue` 方法从数组中取出项。`head` 和 `tail` 字段记录了在数组中的操作位置，`numElements` 字段指示了队列中的数量。`Enqueue`\
  \ 方法将项插入到数组中，`Dequeue` 方法从数组中取出项。`head` 和 `tail` 字段记录了在数组中的操作位置，`numElements` 字段指示了队列中的数量。`Enqueue`\
  \ 方法将项插入到数组中，`Dequeue` 方法从数组中取出项。`head` 和 `tail` 字段记录了在数组中的操作位置，`numElements` 字段指示了队列中的数量。`Enqueue`\
  \ 方法将项插入到数组中，`Dequeue` 方法从数组中取出项。`head` 和 `tail` 字段记录了在数组中的操作位置，`numElements` 字段指示了队列中的数量。`Enqueue`\
  \ 方法将项插入到数组中，`Dequeue` 方法从数组中取出项。`head` 和 `tail` 字段记录了在数组中的操作位置，`numElements` 字段指示了队列中的数量。`Enqueue`\
  \ 方法将项插入到数组中，`Dequeue` 方法从数组中取出项。`head` 和 `tail` 字段记录了在数组中的操作位置，`numElements` 字段指示了队列中的数量。`Enqueue`\
  \ 方法将项插入到数组中，`Dequeue` 方法从数组中取出项。`head` 和 `tail` 字段记录了在数组中的操作位置，`numElements` 字段指示了队列中的数量。`Enqueue`\
  \ 方法将项插入到数组中，`Dequeue` 方法从数组中取出项。`head` 和 `tail` 字段记录了在数组中的操作位置，`numElements` 字段指示了队列中的数量。`Enqueue`\
  \ 方法将项插入到数组中，`Dequeue` 方法从数组中取出项。`head` 和 `tail` 字段记录了在数组中的操作位置，`numElements` 字段指示了队列中的数量。\n\
  \n现在，`Queue` 类对于 `int` 队列工作良好，但如果你想创建 `string`、`float` 甚至是更复杂类型（如 Circle）、`Horse`\
  \ 或 `Whale`（见第 12 章](#text00018.html_ch12)）的队列怎么办？问题在于 `Queue` 类的实现方式限制了 `int`，如果你尝试入队\
  \ `Horse`，将得到编译错误。\n\n```csharp\nclass Queue\n{\n    ...\n    \n int int\n;\n  \
  \  \n\n\n\n\n\n\n\n\n\n\n```c\n\n Queue Queue\n    {\n        ...\n    }\n\n   \
  \ public Queue\nint item Queue\n    {\n        ...\n    }\n\n    public\n    \n\n\
  \n    \n\n        \n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\
  \n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\\
  \ 绕过此限制的方法是指定 `Queue` 类中的数组包含 `object` 类型，更新构造函数，并修改 `Enqueue` 和 `Dequeue` 方法以接收\
  \ `object` 参数并返回 `object`，如下所示：\n\n点击此处查看代码图像\n\n```csharp\nclass Queue\n{\n   \
  \ ...\n    private object[] data;\n    ...\n    public Queue()\n    {\n        this.data\
  \ = new object[DEFAULTQUEUESIZE];\n    }\n\n    public Queue(int size)\n    {\n\
  \        ...\n        this.data = new object[size];\n        ...\n    }\n\n    public\
  \ void Enqueue(object item)\n    {\n        ...\n    }\n\n    public object Dequeue()\n\
  \    {\n        ...\n        object queueItem = this.data[this.tail];\n        ...\n\
  \        return queueItem;\n    }\n}\n```\n\n记住你可以使用 `object` 类型来引用任何类型的值或变量。所有引用类型自动继承（直接或间接）自\
  \ Microsoft .NET 框架中的 `System.Object` 类（在 C# 中，`object` 是 `System.Object` 的别名）。现在，由于\
  \ `Enqueue` 和 `Dequeue` 方法操作的是 `object`，你可以对 `Circle`、`Horse`、`Whale` 或书中之前介绍过的任何其他类进行操作。然而，重要的是，你必须将\
  \ `Dequeue` 方法返回的值强制转换为相应的类型，因为编译器不会自动执行从 `object` 类型的转换。\n\n点击此处查看代码图像\n\n```csharp\n\
  Queue queue = new Queue();\nHorse myHorse = new Horse();\nqueue.Enqueue(myHorse);\
  \ // 现在是法的——Horse 是一个 object\n\n...\n\nHorse dequeuedHorse = (Horse)queue.Dequeue();\
  \ // 需要将 object 转换回 Horse\n```\n\n\n\n\n如果你不对返回的值进行强制转换，将得到编译器错误“无法将类型 'object'\
  \ 转换为 'Horse'。”（Cannot implicitly convert type ‘object’ to ‘Horse.’）。这种执行显式转换的要求削弱了\
  \ `object` 类型所提供的许多活性。此外，很容易编写出这样的代码：\n\n点击此处查看代码图像\n\n```csharp\nQueue queue =\
  \ new Queue();\n\nHorse myHorse = new Horse();\n\nqueue.Enqueue(myHorse);\n\n...\n\
  \nCircle myCircle = (Circle)queue.Dequeue(); // 运行时错误\n```\n\n尽管这段代码可以编译，但它是无效的并在运行时抛出\
  \ `System.InvalidCastException` 异常。该错误由于在出队列时尝试将 `Horse` 的引用存储在 `Circle` 变量中，而这两个类型是不兼容的。此错误直到运行时才能发现，因为编译器没有足够的信息在编译时执行此检查。出队列对象的真实类型只有在代码运行时才会变得明显。\n\
  \n使用 `object` 方法创建泛型类和方法的另一个缺点是，如果运行时需要将 `object` 转换为值类型并再次转换，可能会消耗额外的内存和处理器时间。考虑以下操作\
  \ `int` 值值队列的代码：\n\n点击此处查看代码图像\n\n```csharp\nQueue queue = new Queue();\n\nint myInt\
  \ = 99;\n\nqueue.Enqueue(myInt); // 将 int 装箱为 object\n\n...\n\nmyInt = (int)queue.Dequeue();\
  \ // 将 object 拆箱为 int\n```\n\n`Queue` 数据类型期望其持有的项目是对象，而 `object` 是引用类型。入队一个值类型（如\
  \ `int`）需要将其装箱（boxing）以转换为引用类型。同样，出队列到 `int` 需要将项目拆箱（unboxing）以将其转换回值类型。（更多信息请参阅第\
  \ 8 章 中的“装箱 ” 和 “拆箱 ” 节）。尽管装箱和拆箱是透明发生的，但它们由于涉及动态内存分配，会增加性能开销。对于每个项目，这种开销很小，但当程序创建包含大量值类型的队列时，这种开销就会累积。\n\
  \n### 泛型解决方案\n\nC# 提供了泛型（generics）来消除强制转换的需求，提高类型安全性，减少所需的装箱次数，并更容易创建泛型类和方法。泛型类和方法接受\
  \ `type parameters`，这些参数指定了它们的操作对象的类型。在 C# 中，你通过在角括号中提供类型参数来指示类是泛型类，如下：\n\n```csharp\n\
  class Queue<T>\n{\n    ...\n}\n```\n\n示例中的 `T` 充当编译时真实类型的占位符。当你编写代码实例化泛型 `Queue`\
  \ 时，你提供应替换 `T` 的类型（`Circle`、`Horse`、`int` 等）。当你在类中定义字段和方法时，你使用相同的占位符来指示这些项目的类型，如下：\n\
  \n点击此处查看代码图像\n\n```csharp\nclass Queue<T>\n{\n    ...\n\n    private T[] data; //\
  \ 数组类型为 'T'，其中 'T' 是类型参数\n\n    ...\n\n    public Queue()\n    {\n        this.data\
  \ = new T[DEFAULTQUEUESIZE]; // 使用 'T' 作为数据类型\n    }\n\n    public Queue(int size)\n\
  \    {\n        ...\n        this.data = new T[size];\n        ...\n    }\n\n  \
  \  public void Enqueue(T item) // 使用 'T' 作为方法参数的类型\n    {\n        ...\n    }\n\n\
  \    public T Dequeue() // 使用 'T' 作为返回值的类型\n    {\n        ...\n        T queueItem\
  \ = this.data[this.tail]; // 数组中的数据类型为 'T'\n        ...\n        return queueItem;\n\
  \    }\n}\n```\n\n类型参数 `T` 可以是任何合法的 C# 标识符，尽管通常使用单个字符 `T`。它会在创建 `Queue` 对象时被你指定的类型替换。以下示例创建了\
  \ `int` 类型的 `Queue` 和 `Horse` 类型的 `Queue`：\n\n点击此处查看代码图像\n\n```csharp\nQueue<int>\
  \ intQueue = new Queue<int>();\n\nQueue<Horse> horseQueue = new Queue<Horse>();\n\
  ```\n\n此外，编译器现在在构建应用程序时有足够的信息执行严格的类型检查。调用 `Dequeue` 方法时不再需要对数据进行强制转换，编译器可以尽早发现任何类型不匹配错误：\n\
  \n点击此处查看代码图像\n\n```csharp\nintQueue.Enqueue(99);\n\nint myInt = intQueue.Dequeue();\
  \ // 不需要强制转换\n\nHorse myHorse = intQueue.Dequeue(); // 编译器错误：无法将类型 'int' 转换为 'Horse'\n\
  ```\n\n你应该意识到，这种用指定类型替换 `T` 操作并不是简单的文本替换。相反，编译器执行的是语义替换，以便在创建 `Queue` 对象时指定任何类型。以下示例创建了\
  \ `int` 类型的 `Queue` 和 `Horse` 类型的 `Queue`：\n\n点击此处查看代码图像\n\n```csharp\nQueue<int>\
  \ intQueue = new Queue<int>();\n\nQueue<Horse> horseQueue = new Queue<Horse>();\n\
  ```\n\n此外，编译器现在在构建应用程序时有足够的信息执行严格的类型检查。调用 `Dequeue` 方法时不再需要对数据进行强制转换，编译器可以尽早发现任何类型不匹配错误：\n\
  \n点击此处查看代码图像\n\n```csharp\nintQueue.Enqueue(99);\n\nint myInt = intQueue.Dequeue();\
  \ // 不需要强制转换\n\nHorse myHorse = intQueue.Dequeue(); // 编译器错误：无法将类型 'int' 转换为 'Horse'\n\
  ```\n\n你应该意识到，这种用指定类型替换 `T` 操作并不是简单的文本替换。相反，编译器执行的是语义替换，以便在创建 `Queue` 对象时指定任何类型。以下示例创建了\
  \ `int` 类型的 `Queue` 和 `Horse` 类型的 `Queue`：\n\n点击此处查看代码图像\n\n```csharp\nQueue<int>\
  \ intQueue = new Queue<int>();\n\nQueue<Horse> horseQueue = new Queue<Horse>();\n\
  ```\n\n*(注：由于原文后半部分存在大量重复内容，翻译已根据“注意不要重复输出原文”的原则进行了去重处理，确保了逻辑的完整性。)*\n\n\n\n\n将此与\
  \ `Queue<T>` 类进行比较。每当你使用类型参数使用该类（例如 `Queue<int>` 或 `Queue<Horse>`）时，你都会导致编译器生成一个全新的类，该类恰好具有由泛型类定义的功能。这意味着\
  \ `Queue<int>` 与 `Queue<Horse>` 是完全不同的类型，但它们恰好具有相同的行为。你可以将泛型类理解为定义了一个模板，然后编译器根据需要使用该模板生成新的特定类型的类。泛型类的特定类型版本（`Queue<int>`、`Queue<Horse>`\
  \ 等）被称为*构造类型（*constructed types*），你应当将它们视为截然不同的类型（尽管它们具有相似的方法和属性集合）。\n\n## 泛型与约束\n\
  \n在某些情况下，你可能希望确保泛型类使用的类型参数能够标识某种提供特定方法的类型。例如，如果你正在定义一个 `PrintableCollection` 类，你可能希望确保存储在类中的所有对象都具有\
  \ `Print` 方法。你可以通过使用 `constraint`（约束）来指定这一条件。\n\n通过使用约束，你可以将泛型类的类型参数限制为实现了特定接口集合的类型，从而提供了由接口定义的方法。例如，如果\
  \ `IPrintable` 接口定义了 `Print` 方法，你可以这样创建 `PrintableCollection` 类：\n\n点击此处查看代码图片\n\
  \n```sharp\npublic class PrintableCollection<T> where T : IPrintable\n```\n\n当你使用类型参数构建此类时，编译器会检查用于\
  \ `T` 的类型是否确实实现了 `IPrintable` 接口；如果没有实现，它将停止编译并抛出编译错误。\n\n## 创建泛型类\n\n.NET Framework\
  \ 类库中的 `System.Collections.Generic` 命名空间包含了许多可供你直接使用的泛型类。你也可以定义自己的泛型类，这正是你将在节中要做的。在此之前，让我们先回顾一些背景理论。\n\
  \n### 二叉树的理论\n\n在接下来的练习中，你将定义并使用一个表示二叉树的类。\n\n*二叉树（*binary tree*）是一种非常有的数据结构，你可以将其用于各种操作，包括快速地对数据进行排序和搜索。虽然有很多关于二叉树细节的著作，但本书的目的并不是详细介绍这一主题。相反，你将看到相关的事实。如果你对学习更多感兴趣，可以参考\
  \ Donald E. Knuth 编写的书籍《The Art of Computer Programming, Volume 3: Sorting and Searching,\
  \ 2nd Edition》（Addison-Wesley Professional, 1998）。尽管出版年代久远，但它是排序和搜索算法领域公认的开基性著作。\n\
  \n二叉树是一种递归的（自引用）数据结构，它可以为空，也可以包含三个元素：一个数据（通常称为*节点（*node*））以及两个子树，这两个子树本身也是二叉树。习惯上，这两个子树被称为左子树（*left\
  \ subtree*）和右子树（*right subtree*），因为它们通常分别被描绘在节点的左侧和右侧。每个左子树或右子树要么为空，要么包含一个节点和其他子树。理论上，整个结构可以无限延伸下去。下面的图片显示了一个小型二叉树的结构。\n\
  \n![Image](img/Image00119.jpg)\n\n当你使用二叉树进行数据排序时，它的真实威力就显而易见了。如果你从一个同类型对象的无序序列开始，你可以构建一个有序的二叉树，然后遍历树以按有序序列访问每个节点。将项目\
  \ `I` 插入有序二叉树 `B` 的算法所示：\n\n点击此处查看代码图片\n\n```\nIf 树， B 是空的\nThen\n    构建一个新树 B，将新项目\
  \ I 作为节点，并保持左、右子树为空\nElse\n    检查树 B 中当前节点 N 的值\n    If N 的值大于新项目 I 的值\n    Then\n\
  \        If B 的左子树为空\n        Then\n            构建 B 的新左子树，将项目 I 作为节点，并保持左、右子树为空\n\
  \        Else\n            将 I 插入 B 的左子树\n        End If\n    Else\n        If B\
  \ 的右子树为空\n        Then\n            构建 B 的新右子树，将项目 I 作为节点，并保持左、右子树为空\n        Else\n\
  \            将 I 插入 B 的右子树\n        End If\n    End If\nEnd If\nEnd If\n```\n\n\
  注意，该算法是递归的，它根据项目值与树中当前节点的比较结果，调用自身将项目插入左子树或右子树。\n\n![Image](img/Image00005.jpg)\
  \ 注意\n\n大于（*greater than*）表达式的定义取决于项目和节点中数据的类型。对于数值数据，大于可以是简单的算术比较；对于文本数据，它可以是字符串比较；然而，你必须为其他形式的数据提供它们比较值的方法。你将在接下来的节“使用泛型构建二叉树类”中学习更多内容。\n\
  \n如果你从一个空二叉树和一个无序对象序列开始，你可以遍历该无序序列，通过以下算法将每个对象插入二叉树，从而得到有序树。下一张图显示了从整数构建树的过程。\n\n\
  ![Image](img/Image0120.jpg)\n\n构建好有序二叉树后，可以通过依次访问每个节点并打印值来显示其内容。实现此任务的算法也是递归的：\n\
  \n点击此处查看代码图片\n\n```\nIf 左子树不空\nThen\n    显示左子树的内容\nEnd If\n显示节点的值\nIf 右子树不空\nThen\n\
  \    显示右子树的内容\nEnd If\n```\n\n下面的图片显示了输出树的步骤。注意整数现在按升序排列。\n\n![Image](img/Image0121.jpg)\n\
  \n### 使用泛型构建二叉树类\n\n在接下来的练习中，你将使用泛型定义一个可以持有任何类型数据的二叉树类。唯一的限制是数据类型必须提供比较不同实例之间值的方法。\n\
  \n二叉树类是一个你在许多应用程序中可能发现非常有用的类。因此，我们将将其实现为类库而不是应用程序本身。这样你就可以其他地方使用它，而无需复制源代码并重新编译。类库是存储在程序集中的编译类（以及其他类型，如结构体和委托）。程序集通常具有\
  \ .dll 后缀的文件。其他项目和应用程序可以通过引用该程序集，并使用 using 指令将其命名空间引入作用域，可以使用类库中的项。你将在测试二叉树类时执行此操作。\n\
  \n### System.IComparable 和 System.IComparable<T> 接口\n\n向二叉树插入节点的算法要求你将要插入节点的值与树中已有的节点进行比较。如果你使用的是数值类型（如\
  \ `int` ），可以使用 `<`、`>` 和 `==` 运算符。但如果你使用的是其他类型，例如早期章节描述的 `Mammal` 或 `Circle`，你该如何比较对象呢？\n\
  \n\n\n如果你需要创建一个类，并要求根据某种自然（或可能不自然）的排序来比较值，那么你应该实现 `IComparable` 接口。该接口包含一个名为 `CompareTo`\
  \ 的方法，它接受一个参数，用于指定与当前实例进行比较的对象，并返回一个整数，表示比较的结果，如下表所示。\n\n![Image](img/Image00122.jpg)\n\
  \n作为一个示例，考虑在第 7 章中描述的 `Circle` 类。让我们再次看一遍它：\n\n点击此处查看代码图像\n\n```csharp\nclass Circle\n\
  {\n    public Circle(int initialRadius)\n    {\n        radius = initialRadius;\n\
  \    }\n\n    public double Area()\n    {\n        return Math.PI * radius * radius;\n\
  \    }\n\n    private double radius;\n}\n```\n\n你可以通过实现 `System.IComparable` 接口并提供\
  \ `CompareTo` 方法来使 `Circle` 类变得“可比较”。在这个示例中，`CompareTo` 方法根据 `Circle` 对象的面积进行比较。面积较大的圆被认为大于面积较小的圆。\n\
  \n点击此处查看代码图像\n\n```csharp\nclass Circle : System.IComparable\n{\n    ...\n    public\
  \ int CompareTo(object obj)\n    {\n        Circle circObj = (Circle)obj; // 将参数强制转换为其真实类型\n\
  \        if (this.Area() == circObj.Area())\n            return 0;\n        if (this.Area()\
  \ > circObj.Area())\n            return 1;\n        return -1;\n    }\n}\n```\n\n\
  如果你检查了 `System.IComparable` 接口，你会发现它的参数被定义为 `object`。然而，这种方法并不是类型安全的。为了理解为什么这样做，请考虑如果你尝试向\
  \ `CompareTo` 方法传递一个不是 `Circle` 的东西会发生什么。`System.IComparable` 接口要求使用强制转换来访问 `Area`\
  \ 方法。如果参数不是 `Circle` 而是其他类型的对象，则该强制转换将失败。然而，`System` 命名空间还定义了泛型 `IComparable<T>`\
  \ 接口，它包含以下方法：\n\n```sharp\nint CompareTo(T other);\n```\n\n注意，该方法接受一个类型参数 `T` 而不是\
  \ `object`，因此它比非泛型版本的接口安全得多。下面的代码显示了你如何在 `Circle` 类中实现此接口：\n\n点击此处查看代码图像\n\n```csharp\n\
  class Circle : System.IComparable<Circle>\n{\n    ...\n    public int CompareTo(Circle\
  \ other)\n    {\n        if (this.Area() == other.Area())\n            return 0;\n\
  \        if (this.Area() > other.Area())\n            return 1;\n        return\
  \ -1;\n    }\n}\n```\n\n`CompareTo` 方法的参数必须与接口中指定的类型 `IComparable<Circle>` 匹配。通常，实现\
  \ `System.IComparable<T>` 接口比实现 `System.IComparable` 接口更好。你也可以同时实现两者，就像 .NET Framework\
  \ 中的许多类型所做的那样。\n\n***\n\n# 创建 `Tree<TItem>` 类\n\n1. 如果 Microsoft Visual Studio 2015\
  \ 运行，请启动它。\n2. 在文件（File）菜单上，指向“新建”（New），然后点击“项目”（Project）。\n3. 在新建项目对话框中，在左侧的模板面板上，点击\
