  \n如果你的代码跨越多个文件，或者即使在同一个文件中但文件非常长，此功能也极其有用。\n\n***\n\n7. 在“调试”菜单上，点击“不调试启动”（Start\
  \ Without Debugging）来生成并运行程序。程序在控制台窗口中运行并显示以下消息：\n\n点击此处查看代码图像\n\n```\ncalculateFee\
  \ using hardcoded values\nFee is 400\n```\n\n`run` 方法调用了不接受参数的 `calculateFee` 版本，而不是接受可选参数的两个实现，因为该版本与方法调用最匹配。按任意键关闭控制台窗口并返回\
  \ Visual Studio。\n\n8. 在 `run` 方法中，修改调用 `calculateFee` 的语句，以匹配此处加粗所示的代码：\n\n点击此处查看代码图像\n\
  \n```csharp\npublic void run()\n{\n    double fee = calculateFee(650);\n    Console.WriteLine($\"\
  Fee is {fee}\");\n}\n```\n\n9. 在“调试”菜单上，点击“不调试启动”来生成并运行程序。程序显示以下消息：\n\n点击此处查看代码图像\n\
  \n```\ncalculateFee using one parameter\nFee is 650\n```\n\n`run` 方法调用了接受一个参数的 `calculateFee`\
  \ 版本，而不是接受可选参数的两个实现，因为该版本与方法调用最匹配。按任意键关闭控制台窗口并返回 Visual Studio。\n\n10. 在 `run` 方法中，修改调用\
  \ `calculateFee` 的语句以匹配此处加粗所示的代码：\n\n点击此处查看代码图像\n\n```csharp\npublic void run()\n\
  {\n    double fee = calculateFee(500.0, 3);\n    Console.WriteLine($\"Fee is {fee}\"\
  );\n}\n```\n\n11. 在“调试”菜单上，点击“不调试启动”来生成并运行程序。程序显示以下消息：\n\n点击此处查看代码图像\n\n```\ncalculateFee\
  \ using two optional parameters\nFee is 1500\n```\n\n`run` 方法调用了接受两个可选参数的 `calculateFee`\
  \ 版本，因为该版本与方法调用最匹配。按任意键关闭控制台窗口并返回 Visual Studio。\n\n12. 在 `run` 方法中，修改调用 `calculateFee`\
  \ 的语句，使用具名参数指定 `dailyRate`：\n\n点击此处查看代码图像\n\n```csharp\npublic void run()\n{\n \
  \   double fee = calculateFee(dailyRate : 375.0);\n    Console.WriteLine($\"Fee\
  \ is {fee}\");\n}\n```\n\n13. 在“调试”菜单上，点击“不调试启动”来生成并运行程序。程序显示以下消息：\n\n点击此处查看代码图像\n\
  \n```\ncalculateFee using one optional parameter\nFee is 375\n```\n\n如之前一样，`run`\
  \ 方法调用接受一个可选参数的 `calculateFee`。将代码改为具名参数不会改变编译器解析方法调用的方式。按任意键关闭控制台窗口并返回 Visual Studio。\n\
  \n14. 在 `run` 方法中，修改调用 `calculateFee` 的语句，使用具名参数指定 `noOfDays`：\n\n点击此处查看代码图像\n\n\
  ```csharp\npublic void run()\n{\n    double fee = calculateFee(noOfDays : 4);\n\
  \    Console.WriteLine($\"Fee is {fee}\");\n}\n```\n\n15. 在“调试”菜单上，点击“不调试启动”来生成并运行程序。程序显示以下消息：\n\
  \n点击此处查看代码图像\n\n```\ncalculateFee using two optional parameters\nFee is 2000\n```\n\
  \n这一次，`run` 方法调用了接受两个可选参数的 `calculateFee` 版本。方法调用省略了第一个参数（`dailyRate`）并具名指定了第二个参数。接受两个可选参数的\
  \ `calculateFee` 方法是唯一匹配调用的版本。\n\n\n\n\n\n### 16. 修改 `calculateFee` 方法的实现，该方法接受两个可选参数。将第一个参数重命名为\
  \ `theDailyRate` 并更新 `return` 语句以匹配下方代码中**粗体**显示的内容：\n\n点击此处查看代码\n\n```csharp\n\
  private double calculateFee(double theDailyRate = 500.0, int noOfDays = 1)\n{\n\
  \    Console.WriteLine(\"calculateFee using two optional parameters\");\n    return\
  \ theDailyRate * noOfDays;\n}\n```\n\n### 17. 在 `run` 方法中，修改调用 `calculateFee` 的语句，并通过名称指定\
  \ `theDailyRate` 参数。\n\n点击此处查看图片\n\n```csharp\npublic void run()\n{\n    double\
  \ fee = calculateFee(theDailyRate : 375.0);\n    Console.WriteLine(\"Fee is {fee}\"\
  );\n}\n```\n\n### 18. 在“调试”菜单上，点击“不调试启动”以编译并运行程序。\n\n程序显示以下消息：\n\n点击此处查看图片\n\ncalculateFee\
  \ using two optional parameters\nFee is 375\n\n上一次你指定了费用但没有指定费率时（第 12 步），`run` 方法调用了接受一个可选参数的\
  \ `calculateFee` 版本。这一次，`run` 方法调用了接受两个可选参数的 `calculateFee` 版本。在这种情况下，使用具名参数更改了编译器解析方法调用的方式。如果你指定了具名参数，编译器会将参数名称与方法声明中指定的参数名称进行比较，并选择具有具有匹配名称参数的方法。如果你在调用\
  \ `calculateFee` 方法时将参数指定为 `aDailyRate: 375.0`，程序将无法编译，因为没有版本的方法具有匹配此名称的参数。\n\n\
  按任意键关闭控制台窗口并返回 Visual Studio。\n\n## 总结\n\n在本章中，你学习了如何通过定义方法来实现具名代码块。你了解了如何向方法传递参数以及如何从方法返回数据。你还学习了如何调用方法、传递参数并获取返回值。你学习了如何定义具有不同参数列表的重载方法，并了解了变量的作用域如何决定它可以在哪里被访问。然后，你使用\
  \ Visual Studio 2015 调试器在代码运行时进行单步。最后，你学习了如何编写接受可选参数的方法以及如何使用具名参数调用方法。\n\n![Image](img/Image00001.jpg)\
