  \n## 总结\n\n在本章中，你学习了如何创建和使用属性来对对象中的数据提供受控访问。你还学习了如何创建自动属性以及在初始化对象时如何使用属性。\n\n![Image](img/Image00001.jpg)\
  \ 如果你想继续阅读下一章，请保持 Visual Studio 2015 运行并转到第 16 章，“使用索引器](#text00023.html_ch16)”。\n\
  \n![Image](img/Image00001.jpg) 如果你现在想退出 Visual Studio 2015，在“文件”菜单上点击“退出”。如果看到保存对话框，点击“是”并保存项目。\n\
  \n## 快速参考\n\n![Image](img/Image00114.jpg)![Image](img/Image00115.jpg)\n\n## 第 16\
  \ 章。使用索引器\n\n完成本章后，你将能够：\n\n![Image](img/Image00001.jpg) 通过使用索引器对对象封装逻辑数组类的访问。\n\
  \n![Image](img/Image00001.jpg) 通过声明 `get` 访问器来控制对索引器的读取访问。\n\n![Image](img/Image00001.jpg)\
  \ 通过声明 `set` 访问器来控制对索引器的写入访问。\n\n![Image](img/Image00001.jpg) 创建声明索引器的接口。\n\n![Image](img/Image0001.jpg)\
  \ 在继承接口的结构体和类中实现索引器。\n\n第 15 章，“通过实现属性来访问字段](#text00022.html_ch15)”，描述了如何实现和使用属性作为对类中字段提供受控访问的手段。属性对于镜像包含单个值的字段非常有用。然而，如果你想对包含多个值的项提供访问，并通过使用自然且熟悉的语法来实现这一点，那么索引器将是无价之宝。\n\
  \n### 什么是索引器？\n\n你可以将 `indexer`（索引器）想象成一个智能数组，就像将属性想象成智能字段一样。属性在类中封装了单个值，而索引器封装了一组值。你用于索引器的语法与你用于数组的语法完全相同。\n\
  \n理解索引器的最佳方法是运行示例。首先，你将考虑一个问题并检查一个不使用索引器的解决方案。然后，你将处理相同的问题并查看一个使用索引器的更好解决方案。该问题涉及整数，更准确地说，涉及\
  \ `int` 类型。\n\n#### 一个不使用索引器的示例\n\n你通常使用 `int` 来存储整数值。在内部，`int` 将其值存储为 32 位的序列，其中每个位可以是\
  \ 0 或 1。在大多数情况下，你并不关心这种内部的二进制表示；你只需要使用 `int` 即可。\n\n\n\n\n\n你可以结合使用这些运算符来确定 `int`\
  \ 中单个位的值。例如，下面的表达式使用左移运算符（`<<`）和位与运算符（`&`）来确定名为 `bits` 的 `byte` 变量从右数第六个位是被设置为 `0`\
  \ 还是 `1`：\n\n```bash\n(bits & (1 << 5)) != 0\n```\n\n***\n\n![Image](img/Image00005.jpg)\
  \ 注意\n\n位运算符从右到左计算位的位置，且位从 `0` 开始编号。因此，位 `0` 是最右边的位，而位置 `5` 的位是从右数第六个位。\n\n***\n\
  \n假设变量 `bits` 包含十进制值 `42`。在二进制中，它是 `00101010`。十进制值 `1` 在二进制中是 `00000001`，而表达式 `1\
  \ << 5` 的值为 `00100000`；第六个位是 `1`。在二进制中，表达式 `bits & (1 << 5)` 是 `00101010 & 00100000`，该表达式的值为二进制\
  \ `00100000`，非零。如果变量 `bits` 包含值 `65`，即二进制的 `01000001`，则表达式的值为 `01000001 & 00100000`，得到的二进制结果为\
  \ `00000000`，即零。\n\n这是一个相当复杂的例子，但与下面的表达式相比，它就微而易见了，后者使用复合赋值运算符 `&=` 将位置 6 的位设置为\
  \ `0`：\n\n```bash\nbits &= ~(1 << 5)\n```\n\n同样，如果你想将位置 6 的位设置为 `1`，可以使用位或运算符（`|`）。下面的复杂表达式基于复合赋值运算符\
  \ `|=`：\n\n```bash\nbits |= (1 << 5)\n```\n\n这些示例的困难之处在于，尽管它们可以运行，但极其难以理解。它们非常复杂，而且解决方案是一个非常底层的方案：它未能为自己所解决的问题创建一个抽象，因此维护执行此类操作的代码将非常困难。\n\
  \n### 使用索引器的相同示例\n\n让我们暂时离开上述底层的解决方案，回想一下问题是什么。你希望将一个 `int` 不仅仅是一个 `int`，而是看作一个位数组。因此，解决这个问题的最好方法是将\
  \ `int` 像位数组一样使用；换句话说，为了访问 `bits` 变量中从右数第六位的位，你希望能够写出如下的表达式（记住数组从索引 0 开始）：\n\n```bash\n\
  bits[5]\n```\n\n并且，为了将从右数第四个位设置为 `true`，你希望能够写下：\n\n```bash\nbits[3] = true\n```\n\
  \n***\n\n![Image](img/Image00005.jpg) 注意\n\n对于资深 C 开发者来说，布尔值 `true` 与二进制值 `1` 同义，而布尔值\
  \ `false` 与二进制值 `0` 同义。因此，表达式 `bits[3] = true` 意味着“将 `bits` 变量从右数第四个位设置为 1”。\n\n\
  ***\n\n遗憾的是，你不能在 `int` 上使用方括号符号；它只适用于数组或行为类似于数组的类型。因此，解决问题的办法是创建一个新类型，该类型像、感觉像且用法像一个\
  \ `bool` 变量数组，但内部通过使用 `int` 实现。你可以通过定义一个索引器（indexer）来实现这一目标。我们将这个新类型命名为 `IntBits`。`IntBits`\
  \ 将包含一个 `int` 值（在构造函数中初始化），但核心思想是你将 `IntBits` 作为 `bool` 变量数组使用。\n\n***\n\n![Image](img/Image00013.jpg)\
  \ 提示\n\n`IntBits` 类型很小且轻量，因此将其创建为结构体（struct）而不是类（class）是合理的。\n\n***\n\n点击此处查看代码\n\
  \n```cs\nstruct IntBits\n{\n    private int bits;\n\n    public IntBits(int initialBitValue)\n\
  \n{\n        bits = initialBitValue;\n    }\n    // 在此处编写索引器\n}\n```\n\n要定义索引器，你需要使用一种介于属性和数组之间的符号。你通过\
  \ `this` 关键字引入索引器，指定索引器返回值的类型，并指定方括号内作为索引器索引值的类型。`IntBits` 结构体的索引器使用整数作为索引类型并返回布尔值。它看起来如下：\n\
  \n点击此处查看代码\n\n```cs\nstruct IntBits\n{\n    ...\n\n    public bool this [ int index\
  \ ]\n    {\n        get\n        {\n            return (bits & (1 << index)) !=\
  \ 0;\n        }\n        set\n        {\n            if (value) // 如果 value 为 true\
  \ 则开启位；否则关闭位\n            bits |= (1 << index);\n        }\n    }\n}\n```\n\n\n\n\
  \n当你使用索引器时，其语法故意设计得非常像数组。然而，索引器和数组之间存在一些重要的区别：\n\n![Image](img/Image00001.jpg) 索引器可以使用非数字下标，例如字符串（如下例所示），而数组只能使用整数下标。\n\
  \n点击此处查看代码图片\n\n```csharp\npublic int this [ string name ] { ... } // OK\n```\n\n\
  ![Image](img/Image00001.jpg) 索引器是可以被重载的（就像方法一样），而数组不能重载。\n\n点击此处查看代码图片\n\n```csharp\n\
  public Name this [ PhoneNumber number ] { ... }\npublic PhoneNumber this [ Name\
  \ name ] { ... }\n```\n\n![Image](img/Image00001.jpg) 索引器不能作为`ref` 或`out` 参数，但数组元素可以。\n\
  \n点击此处查看代码图片\n\n```csharp\nIntBits bits; // bits 包含一个索引器\nMethod(ref bits[1]); //\
  \ 编译错误\n```\n\n***\n\n# 属性、数组和索引器\n\n属性是可以返回数组的，但请记住，数组是引用类型，因此将数组作为属性暴露会产生意外覆盖大量数据的可能性。观察以下结构，它暴露了一个名为\
  \ `Data` 的数组属性：\n\n点击此处查看代码图片\n\n```csharp\nstruct Wrapper\n{\n    private int[]\
  \ data;\n    ...\n    public int[] Data\n    {\n        get { return this.data;\
  \ }\n        set { this.data = value; }\n    }\n}\n```\n\n现在，考虑以下使用该属性的代码：\n\n```csharp\n\
  Wrapper wrap = new Wrapper();\n...\nint[] myData = wrap.Data;\nmyData[0]++;\nmyData[1]++;\n\
  ```\n\n这看起来很无害。然而，因为数组是引用类型，变量 `myData` 指向与 `Wrapper` 结构体中的私有变量 `data` 相同的对象。你对\
  \ `myData` 元素所做的任何更改都会应用于 `data` 数组；表达式 `myData[0]++` 的效果与 `data[0]++` 完全相同。如果这不是你的意图，你应该在\
  \ `Data` 属性的 `get` 和 `set` 访问器中使用 `Clone` 方法返回 `data` 数组的副本，或者对正在设置的值进行拷贝，如下面的代码所示。（第\
  \ 8 章，“理解值和引用”讨论了用于复制数组的 `Clone` 方法。）注意，`Clone` 方法返回一个对象，你必须将其强制转换为整数数组。\n\n点击此处查看代码图片\n\
  \n```csharp\nstruct Wrapper\n{\n    private int[] data;\n    ...\n    public int[]\
  \ Data\n    {\n        get { return this.data. Clone() as int[]; }\n        set\
  \ { this.data = value. Clone() as int[]; }\n    }\n}\n```\n\n然而，这种方法在内存使用方面可能会变得非常混乱且昂贵。索引器为此问题提供了一个自然的解决方案——不要将整个数组作为属性暴露；只需通过索引器提供其单个元素的可用性：\n\
  \n点击此处查看代码图片\n\n```csharp\nstruct Wrapper\n{\n    private int[] data;\n    ...\n\
  \    public int this [int i]\n    {\n        get { return this.data[i]; }\n    \
  \    set { this.data[i] = value; }\n    }\n}\n```\n\n以下代码使用索引器的方式与之前所示的属性类似：\n\n\
  ```csharp\nWrapper wrap = new Wrapper();\n...\nint[] myData = new int[2];\nmyData[0]\
  \ = wrap[0];\nmyData[1] = wrap[1];\nmyData[0]++;\nmyData[1]++;\n```\n\n这一次，增加 `myData`\
  \ 数组中的值不会对 `Wrapper` 对象中的原始数组产生影响。如果你真的想修改 `Wrapper` 对象中的数据，你必须编写类似这样的语句：\n\n```csharp\n\
  wrap[0]++;\n```\n\n这种方式要得多且更安全！\n\n***\n\n### 接口中的索引器\n\n你可以在接口中声明索引器。要这样做，请指定 `get`\
  \ 关键字、`set` 关键字或两者，但将 `get` 或 `set` 访问器的体替换为分号。任何实现该接口的类或结构体必须实现接口中声明的 `indexer`\
  \ 访问器，在此处所示：\n\n点击此处查看代码图片\n\n```csharp\ninterface IRawInt\n{\n    bool this [ int\
  \ index ] { get; set; }\n}\n\nstruct RawInt : IRawInt\n{\n    ...\n    public bool\
  \ this [ int index ]\n    {\n        get { ... }\n        set { ... }\n    }\n \
  \   ...\n}\n```\n\n如果你在类中实现接口索引器，可以将索引器声明为 `virtual`。这允许派生类重写 `get` 和 `set` 访问器，如下所示：\n\
  \n点击此处查看代码图片\n\n```csharp\nclass RawInt : IRawInt\n{\n    public virtual bool this\
  \ [ int index ]\n    {\n        get { ... }\n        set { ... }\n    }\n}\n```\n\
  \n你还可以通过使用显式实现语法来实现索引器，这在第 8 章中有所介绍。显式实现是非虚的（无法重写），如下：\n\n```csharp\n// 索引器的显式实现\n\
  bool IRawInt.this [ int index ]\n{\n    get { ... }\n    set { ... }\n}\n```\n\n\
  ### 在 应用程序中使用索引器\n\n在下面的练习中，你将检查一个简单的电话簿并完成其实现。你将在 `PhoneBook` 类中编写索引器：一个接受 `Name`\
  \ 并返回 `PhoneNumber`，另一个接受 `PhoneNumber` 并返回 `Name`。你还需要在正确的地方调用这些索引器。\n\n1. 如果尚未运行，请启动\
  \ Visual Studio 2015。\n2. 打开 Indexers 项目。\n3. 在调试菜单上，点击“调试”。\n\n项目将生成并运行。出现一个表单，显示两个文本框：姓名和电话号码。表单最初显示两个按钮：一个根据姓名查找电话号码，另一个根据电话号码查找姓名。扩展表单底部的命令栏会显示一个“添加”按钮，可以将姓名/电话号码对添加到列表中。所有按钮（包括添加按钮）目前都没有功能。应用程序如下：\n\
  \n![Image](img/Image0116.jpg)\n\n你的任务是完成应用程序使按钮能够工作。\n\n4. 返回 Visual Studio 2015\
  \ 并停止调试。\n5. 显示 Indexers 项目中的 `Name.cs` 文件。检查 `Name` 结构。它的目的是作为姓名的持有者。\n\n姓名作为字符串提供给构造函数。可以通过只读字符串属性\
  \ `Text` 获取姓名。（`Equals` 和 `GetHashCode` 方法用于在搜索 `Name` 值数组时比较 `Name` 对象——现在可以忽略它们。）\n\
  6. 显示 `PhoneNumber.cs` 文件，检查 `PhoneNumber` 结构。它与 `Name` 结构相似。\n7. 显示 `PhoneBook.cs`\
  \ 文件，检查 `PhoneBook` 类。\n\n该类包含两个私有数组：一个 `Name` 值的数组 `names` 和一个 `PhoneNumber` 值的数组\
  \ `phoneNumbers`。`PhoneBook` 类还包含一个 `Add` 方法，将电话号码和姓名添加到电话簿中。该方法在点击表单上的“添加”按钮时被调用。`enlargeIfFull`\
  \ 方法由 `Add` 调用以便在添加新条目时检查数组是否已满。\n\n\n\n`Add` 方法被刻意保持简单，不会检查名称或电话号码是否已添加到电话簿中。\n\
  \n`PhoneBook` 类目前没有提供任何允许用户查找名称或电话号码的功能；你将在下一次练习中添加两个索引器（indexers）来提供此功能。\n\n##\
  \ 编写索引器\n\n1. 在 `PhoneBook.cs` 文件中删除注释 `// TODO: write 1st indexer here`，并将其替换为\
  \ `PhoneBook` 类的公共只读索引器，如下所示代码中**加粗**部分所示。该索引器应返回一个 `Name`，并接受一个 `PhoneNumber` 项作为其索引。将\
  \ `get` 访问器的体留为空。\n\n索引器应该如下所示：\n\n点击此处查看代码图像\n\n```csharp\nsealed class PhoneBook\n\
  {\n    ...\n\n    public Name this[PhoneNumber number]\n    {\n        get\n   \
  \     {\n        }\n    }\n    ...\n}\n```\n\n2. 按照后续代码中**加粗**所示的方式实现 `get` 访问器。\n\
  \n该访问器的目的是找到与指定电话号码匹配的名称。为了完成，你需要调用 `Array` 类的静态方法 `IndexOf`。`IndexOf` 方法对数组进行搜索，返回数组中匹配指定值的第一个项的索引。`IndexOf`\
  \ 的第一个参数是要进行搜索的数组（`phoneNumbers`）。`IndexOf` 的第二个参数是你正在查找的项。如果 `IndexOf` 找到了该元素，则返回该元素的整数索引；否则，`IndexOf`\
  \ 返回 `-1`。如果索引器找到了电话号码，它应该返回相应的名称，否则它应该返回一个空的 `Name` 值。（注意 `Name` 是一个结构体，因此默认构造函数会将其私有\
  \ `name` 字段设置为 `null`。）\n\n点击此处查看代码图像\n\n```csharp\nsealed class PhoneBook\n{\n\
  \    ...\n\n    public Name this [PhoneNumber number]\n    {\n        get\n    \
  \    {\n            int i = Array.IndexOf(this.phoneNumbers, number);\n        \
  \    if (i != -1)\n            {\n                return this.names[i];\n      \
  \      }\n            else\n            {\n                return new Name();\n\
  \            }\n        }\n    }\n    ...\n}\n```\n\n3. 删除注释 `// TODO: write 2nd\
  \ indexer here`，并将其替换为 `PhoneBook` 类的第二个公共只读索引器，该索引器返回一个 `PhoneNumber` 并接受单个 `Name`\
  \ 参数。以与第一个相同的方式实现此索引器。（再次注意 `PhoneNumber` 是一个结构体，因此始终有一个默认构造函数。）\n\n第二个索引器应该如下所示：\n\
  \n点击此处查看代码图像\n\n```csharp\nsealed class PhoneBook\n{\n    ...\n\n    public PhoneNumber\
  \ this [Name name]\n    {\n        get\n        {\n            int i = Array.IndexOf(this.names,\
  \ name);\n            if (i != -1)\n            {\n                return this.phoneNumbers[i];\n\
  \            }\n            else\n            {\n                return new PhoneNumber();\n\
