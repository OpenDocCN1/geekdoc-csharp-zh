  \ `Edit` 方法。\n\n### 12. 在“Methods For Fetching And Updating Data”（获取和更新数据的方法）区域的\
  \ `Edit` 方法之后，为 `ViewModel` 类添加一个名为 `Discard` 的方法，如下所示：\n\n点击此处查看代码图像\n\n```csharp\n\
  // 放弃在添加或编辑模式下所做的更改\n//并将表单返回到浏览（Browsing）模式\nprivate void Discard ()\n\n{\n// 如果用户正在添加新客户，则将其移除\n\
  if (this.IsAdding)\n{\nthis.customers.Remove(this.Current);\nthis.OnPropertyChanged(nameof(Current));\n\
  }\n// 如果用户正在编辑现有客户，\n// 则恢复保存的详情\nif (this.IsEditing)\n{\nthis.CopyCustomer(this.oldCustomer,\
  \ this.Current);\n}\nthis.IsBrowsing = true;\n}\n```\n\n此方法的目的是使用户能够放弃 ViewModel\
  \ 在处于添加或编辑模式时所做的任何更改。如果 ViewModel 处于添加模式，则从列表中移除当前客户（这是由 `Add` 方法创建的新客户），并抛出 `PropertyChanged`\
  \ 事件以指示 `customers` 列表中的当前客户已更改。如果 ViewModel 处于编辑模式，则将 `oldCustomer` 变量中的原始详情复制回当前显示的客户中。最后，ViewModel\
  \ 返回到浏览模式。\n\n### 13. 将 `DiscardChanges Command` 变量添加到 `ViewModel` 类开头的列表中，并更新构造函数以实例化该命令，如此处**加粗**所示：\n\
  \n点击此处查看代码图像\n\n```csharp\npublic class ViewModel : INotifyPropertyChanged\n\n{\n\
  ...\n\npublic Command EditCustomer { get; private set; }\n\npublic Command DiscardChanges\
  \ { get; private set; }\n\n...\npublic ViewModel()\n\n{\n...\nthis.EditCustomer\
  \ = new Command(this.Edit, ...);\n\nthis.DiscardChanges = new Command(this.Discard,\n\
  \n() => { return this.CanSaveOrDiscardChanges; });\n}\n...\n}\n```\n\n注意，只有当 `CanSaveOrDiscardChanges`\
  \ 属性为 `true`、ViewModel 有到网络服务的连接且 ViewModel 处于添加或编辑模式时，`DiscardChanges` 命令才被启用。\n\
  \n### 14. 在“Methods For Fetching And Updating Data”（获取和更新数据的方法）区域，`Discard` 方法之后再添加一个名为\
  \ `SaveAsync` 的方法，如下所示所示。该方法应标记有 `async` 修饰符。\n\n点击此处查看代码图像\n\n```csharp\n// 将新或更新的客户保存回网络服务\n\
  //并将表单返回到浏览模式\nprivate async void SaveAsync()\n{\n// 验证客户的详情\nif (this.ValidateCustomer(this.Current))\n\
  {\n// 仅在客户详情有效时才继续\nthis.IsBusy = true;\ntry\n{\n// 将当前客户转换为 JSON 格式负载\nvar serializedData\
  \ = JsonConvert.SerializeObject(this.Current);\nStringContent content = new StringContent(serializedData,\
  \ Encoding.UTF8, \"text/json\");\n// 如果用户正在添加新客户，\n// 向网络服务发送 HTTP 请求\nif (this.IsAdding)\n\
  {\nvar response = await client.PostAsync(\"api/customers\", content);\nif (response.IsSuccessStatusCode)\n\
  {\n// TODO: 显示新客户的详情\n}\n// TODO: 处理 POST 失败\n}\n// 用户正在编辑现有客户，\n// 因此使用 PUT 请求发送详情\n\
  else\n{\nstring path = $\"api/customers/{this.Current.CustomerID}\";\nvar response\
  \ = await client.PutAsync(path, content);\nif (response.IsSuccessStatusCode)\n{\n\
  this.IsEditing = false;\nthis.IsBrowsing = true;\n}\n// TODO: 处理 PUT 失败\n}\n}\n\
  catch (Exception e)\n{\n// TODO: 处理异常\n}\nfinally\n{\nthis.IsBusy = false;\n}\n\
  }\n}\n```\n\n此方法尚未完成。你输入的代码验证了客户详情是否有效。如果是，则可以将 ViewModel 的 `IsBusy` 属性设置为 `true`，以指示保存操作可能需要一些时间，因为信息正在通过网络发送到服务。（记住，Customers\
  \ 表单上 `ProgressRing` 控件的 `IsActive` 属性绑定到此属性，因此在保存期间将显示进度环。）\n\n`try` 块中的代码确定用户是在添加新客户还是编辑现有客户的详情。如果用户正在添加新客户，代码使用\
  \ `HttpClient` 对象的 `PostAsync` 方法向网络服务发送 POST 消息。请记住，POST 请求被发送到网络服务 `CustomersController`\
  \ 类中的 `PostCustomer` 方法，该方法期望一个 `Customer` 对象作为参数。详情以 JSON 格式传输。\n\n\n\n\n\n如果用户正在编辑现有的客户，应用程序将调用\
  \ `HttpClient` 对象的 `PutAsync` 方法。该方法生成一个 PUT 请求，并将其传递给 Web 服务中 `CustomersController`\
  \ 类的 `PutCustomer` 方法。`PutCustomer` 方法更新数据库中的客户详细信息，并期望客户 ID 和客户详情作为参数。同样，这些数据以\
  \ JSON 格式传输到 Web 服务。\n\n当数据发送后，`IsBusy` 属性被设置为 `false`，这将导致 `ProgressRing` 控件从显示中消失。\n\
  \n**15.** 在 `SaveAsync` 方法中，将注释 `// TODO: Display the details of the new customer`\
  \ 替换为下方加粗的代码：\n\n点击此处查看代码图像\n\n```c\nif (response.IsSuccessStatusCode)\n{\n    //\
  \ 获取新创建的客户的 ID 并显示它\n    Uri customerUri = response.Headers.Location;\n    var newCust\
  \ = await this.client.GetAsync(customerUri);\n    if (newCust.IsSuccessStatusCode)\n\
  \    {\n        var customerData = await newCust.Content.ReadAsStringAsync();\n\
  \        this.CopyCustomer(\n            JsonConvert.DeserializeObject<Customer>(customerData),\
  \ this.Current);\n        this.OnPropertyChanged(nameof(Current));\n        this.IsAdding\
  \ = false;\n        this.IsBrowsing = true;\n    }\n    else\n    {\n        //\
  \ TODO: 处理 GET 失败\n    }\n}\n```\n\nAdventureWorks 数据库 Customer 表中的 `CustomerID`\
  \ 列包含自动生成的值。在创建客户时，用户并不提供此数据的值；而是数据库在将客户添加到数据库时自动生成该值。通过这种方式，数据库可以确保每个客户都具有唯一的客户\
  \ ID。因此，在向 Web 服务发送 POST 请求之后，你必须发送 GET 请求以获取客户 ID。幸运的是，Web 服务作为 POST 请求结果的 `HttpResponseMessage`\
  \ 对象包含一个应用程序可以使用查询新数据的 URL。该 URL 位于响应的 `Headers.Location` 属性中，其格式为 `api/Customers/n`，其中\
  \ `n` 是客户的 ID。你刚刚添加的代码使用 `HttpClient` 对象的 `GetAsync` 方法向此 URL 发送 GET 请求；并使用响应的 `ReadAsStringAsync`\
  \ 方法读取新客户的数据。然后代码使用这些数据更新客户集合中持有的客户详细信息。\n\n***\n\n![Image](img/Image00005.jpg)\
  \ 注意\n\n这段代码看起来似乎是在对 Web 服务进行不必要的往返，以获取客户 ID，而该 ID 已经存在于 POST 请求响应的 `Headers.Location`\
  \ 属性中。然而，此步骤验证了数据已正确保存，而且在保存数据时，Web 服务可能对其他字段进行了转换，因此此过程确保了应用程序显示的数据与数据库中显示的数据一致。\n\
  \n***\n\n**16.** 将此处所示的 `SaveChanges Command` 变量添加到 `ViewModel` 类开头的列表中，并更新构造函数以实例化该命令，如下所示：\n\
  \n点击此处查看代码图像\n\n```c\npublic class ViewModel : INotifyPropertyChanged\n{\n    ...\n\
  \    public Command DiscardChanges { get; private set; }\n    public Command SaveChanges\
  \ { get; private set; }\n    ...\n    public ViewModel()\n    {\n        ...\n \
  \       this.DiscardChanges = new Command(this.Discard, ...);\n        this.SaveChanges\
  \ = new Command(this.SaveAsync,\n        () => { return this.CanSaveOrDiscardChanges;\
  \ });\n        ...\n    }\n    ...\n}\n```\n\n**17.** 在“生成”菜单上，点击“生成解决方案”，并验证你的应用程序是否在没有任何错误的情况下编译。\n\
  \n需要更新 Web 服务以支持编辑功能。具体来说，如果你正在添加或编辑客户，应该设置客户的 `ModifiedDate` 属性以反映进行更改的日期。此外，如果你正在创建一个新客户，在保存它之前，必须为\
  \ `Customer` 对象的 `rowguid` 属性填充一个新的 GUID。（这是 Customer 表中的一个强制性列；AdventureWorks 组织内部其他应用程序使用此列来跟踪客户信息。）\n\
  \n***\n\n![Image](img/Image00005.jpg) 注意\n\nGUID 代表 `globally unique identifier`（全局唯一标识符）。GUID\
  \ 是由 Windows 生成的字符串，其唯一性几乎是肯保证的（虽然有极小的概率 Windows 可能会生成非唯一的 GUID，但这种概率微小到可以忽略不计）。数据库经常使用\
  \ GUID 作为标识单独行的键值，例如 AdventureWorks 数据库中的 Customer 表。\n\n***\n\n## 更新 Web 服务以支持添加和编辑功能\n\
  \n**1.** 在解决方案资源管理器中，找到 AdventureWorksService 项目，展开 `Controllers` 文件夹并打开 `CustomersController.cs`\
  \ 文件以在代码文本编辑器窗口中显示。\n\n**2.** 在 `PostCustomer` 方法中，在向数据库保存新客户的语句之前，添加下方加粗的代码。\n\n\
  点击此处查看代码图像\n\n```c\n// POST api/Customers\n[ResponseType(typeof(Customer))]\npublic\
  \ async Task<IHttpActionResult> PostCustomer(Customer customer)\n{\n    if (!ModelState.IsValid)\n\
  \    {\n        ...\n    }\n    customer.ModifiedDate = DateTime.Now;\n    customer.rowguid\
  \ = Guid.NewGuid();\n    db.Customers.Add(customer);\n    await db.SaveChangesAsync();\n\
  \    ...\n}\n```\n\n**3.** 在 `PutCustomer` 方法中，在指示客户修改的语句之前，更新客户的 `ModifiedDate`\
  \ 属性，如下所示：\n\n点击此处查看代码图像\n\n```csharp\n// PUT api/Customers/5\n[ResponseType(typeof(void))]\n\
  public async Task<IHttpActionResult> PutCustomer(int id, Customer customer)\n{\n\
  \    ...\n    customer.ModifiedDate = DateTime.Now;\n    db.Entry(customer).State\
  \ = EntityState.Modified;\n    ...\n}\n```\n\n**4.** 按照本章之前的“将 Web 服务部署到云端”的操作，将\
  \ Web 服务部署到现有的云应用程序而不是新的。\n\n## 报告错误并更新 UI\n\n你已经添加了用户可以检索、添加和保存客户信息的命令。然而，如果发生问题并产生错误，用户将不知道发生了什么，因为\
  \ `ViewModel` 类没有包含任何报告功能。添加此类功能的方法是捕获发生的异常并将其作为 `ViewModel` 类的属性。视图可以使用数据绑定到此属性并显示错误消息。\n\
  \n### 在 ViewModel 类中添加错误报告\n\n**1.** 返回 Customers 项目并在代码文本编辑器窗口中显示 `ViewModel.cs`\
  \ 文件。\n\n**2.** 找到（如有必要请展开）命名为“Busy And Message Handling”的区域。\n\n**3.** 在 `IsBusy`\
  \ 属性之后，添加此处所示的私有 `_lastError` 字符串变量和公共 `LastError` 字符串属性：\n\n点击此处查看代码图像\n\n```csharp\n\
  private string _lastError = null;\npublic string LastError\n{\n    get { return\
  \ this._lastError; }\n    private set\n    {\n        this._lastError = value;\n\
  \        this.OnPropertyChanged(nameof(LastError));\n    }\n}\n```\n\n**4.** 在“Fetching\
  \ And Updating Data”方法区域找到 `GetDataAsync` 方法。该方法包含以下异常处理器：\n\n点击此处查看代码图像\n\n```csharp\n\
  catch (Exception e)\n{\n    // TODO: Handle exceptions\n}\n```\n\n**5.** 将 `// TODO:\
