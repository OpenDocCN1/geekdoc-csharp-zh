  \n第 3 章，“编写方法和应用作用域，” 阐述了如何定义接收可选参数的方法。乍一看，使用参数数组的方法与接收可选参数的方法之间似乎存在某种重叠。然而，它们之间存在本质区别：\n\
  \n![Image](img/Image00001.jpg) 接收可选参数的方法仍然有一个固定的参数列表，你不能传递任意的参数列表。编译器会生成代码，在方法运行之前将任何缺失参数的默认值插入到栈中，且该方法并不知道哪些参数是调用者提供的，哪些是编译器生成的默认值。\n\
  \n![Image](img/Image00001.jpg) 使用参数数组的方法实际上拥有一个完全任意的参数列表，且其中任何一个都没有默认值。此外，通常情况下，使用参数数组是为了接收任意数量的参数，而使用可选参数是为了允许调用者可以不提供某些参数。\n\
  \n有一种值得考虑的情况是：如果定义了一个接收可选参数的方法，调用者可以提供任意数量的参数；而使用接收参数数组的方法，则可以确定调用者提供了哪些参数。\n\n\
  比较参数数组和可选参数\n\n第 3 章，“编写方法和应用作用域](#text00008.html_ch03)，” 1. 在“代码和文本编辑器”窗口中显示 `Util`\
  \ 类的实现。\n\n2. 在“代码和文本编辑器”窗口中，为 `Util` 类添加一个 `params` 方法：\n\n```csharp\npublic static\
  \ class Util\n{\n    public static int Sum(params int[] paramList)\n    {\n    \
  \    int sumTotal = 0;\n        foreach (int i in paramList)\n        {\n      \
  \      sumTotal += i;\n        }\n        return sumTotal;\n    }\n}\n```\n\n3.\
  \ 在 `Util` 类中添加接收可选参数的重载：\n\n```csharp\npublic static class Util\n{\n    public\
  \ static int Sum(int param1 = 0, int param2 = 0, int param3 = 0, int param4 = 0)\n\
  \    {\n        return param1 + param2 + param3 + param4;\n    }\n}\n```\n\n4. 在\
  \ `Program.cs` 文件中显示 `doWork` 方法实现。\n\n5. 在 `doWork` 方法中，添加以下 `Console.WriteLine`\
  \ 语句：\n\n```csharp\nstatic void doWork()\n{\n    Console.WriteLine(Util.Sum());\n\
  }\n```\n\n6. 运行程序并查看控制台输出。输出应为 `0`。\n\n7. 在 `doWork` 方法中，传递一个参数调用：\n\n```csharp\n\
  static void doWork()\n{\n    Console.WriteLine(Util.Sum(10));\n}\n```\n\n8. 运行程序并查看控制台输出。输出应为\
  \ `10`。\n\n9. 在 `doWork` 方法中，传递两个参数：\n\n```csharp\nstatic void doWork()\n{\n   \
  \ Console.WriteLine(Util.Sum(10, 20));\n}\n```\n\n10. 运行程序并查看控制台输出。输出应为 `30`。\n\n\
  11. 在 `doWork` 方法中，传递三个参数：\n\n```csharp\nstatic void doWork()\n{\n    Console.WriteLine(Util.Sum(10,\
  \ 20, 30));\n}\n```\n\n12. 运行程序并查看控制台输出。输出应为 `60`。\n\n13. 在 `doWork` 方法中，传递四个参数：\n\
  \n```csharp\nstatic void doWork()\n{\n    Console.WriteLine(Util.Sum(10, 20, 30,\
  \ 40));\n}\n```\n\n14. 运行程序并查看控制台输出。输出应为 `100`。\n\n15. 在 `doWork` 方法中，传递五个参数：\n\n\
  ```csharp\nstatic void doWork()\n{\n    Console.WriteLine(Util.Sum(10, 20, 30, 40,\
  \ 50));\n}\n```\n\n16. 运行程序并查看控制台输出。输出应为 `150`。\n\n17. 在 `doWork` 方法中，传递五个参数：\n\n\
  ```csharp\nstatic void doWork()\n{\n    Console.WriteLine(Util.Sum(10, 20, 30, 40,\
  \ 50, 60));\n}\n```\n\n18. 运行程序并查看控制台输出。输出应为 `210`。\n\n19. 在 `doWork` 方法中，传递一个数组：\n\
  \n```csharp\nstatic void doWork()\n{\n    int[] numbers = { 10, 20, 30, 40, 50,\
  \ 60 };\n    Console.WriteLine(Util.Sum(numbers));\n}\n```\n\n20. 运行程序并查看控制台输出。输出应为\
  \ `210`。这就是为什么 `params` 关键字非常有用，因为它允许你以多个参数或单个数组的形式来调用方法。\n\n\n\n\n\n![Image](img/Image00001.jpg)\
  \ 如果你现在想退出 Visual Studio 2015，在“文件”菜单上点击“退出”。如果你看到保存对话框，点击“是”并保存项目。\n\n## 快速参考\n\
  \n![Image](img/Image00096.jpg)\n\n# 第 12 章 使用继承\n\n完成本章后，你将能够：\n\n![Image](img/Image00001.jpg)\
  \ 创建一个继承自基类特征的派生类。\n\n![Image](img/Image00001.jpg) 使用 `new`、`virtual` 和 `override`\
  \ 关键字控制方法的隐藏和重写。\n\n![Image](img/Image00001.jpg) 使用 `protected` 关键字限制继承层次结构中的可访问性。\n\
  \n![Image](img/Image00001.jpg) 将扩展方法定义为使用继承的替代机制。\n\n继承是面向对象编程世界中的一个核心概念。你可以将继承作为一种工具，在定义具有许多共同特征且关系非常密切的不同类时避免重复代码。也许它们是同类型的不同类，每种类都有自己的独特特征——例如工厂中的`经理`、`工人`和`所有员工`。如果你正在编写一个模拟工厂的应用程序，你该如何指定经理和工人既有很多共同特征，又有许多不同特征呢？例如，他们都有员工参考编号，但经理有不同的责任，执行的任务也与工人不同。\n\
  \n这正是继承大用武的地方。\n\n## 什么是继承？\n\n如果你询问几位经验丰富的程序员 `inheritance`（继承）一词的含义，你通常会得到不同且矛盾的答案。困惑的来源源于“继承”这个词本身有几个细微不同的含义。如果有人在遗嘱中给你留下了某物，我们就说继承了它。同样，我们说你从母亲那里继承了一半基因，从父亲那里继承了一半基因。这个词的这两个用法与编程中的继承几乎没有关系。\n\
  \n编程中的继承完全关乎分类——它是类与类之间的关系。例如，当你上学时，你可能学习过哺乳动物，你了解到马和鲸鱼是哺乳动物的例子。每种动物都拥有哺乳动物的所有属性（呼吸空气、哺乳养幼崽、温血动物等），但每种动物也有自己的特殊特征（马有蹄子，而鲸鱼有鳍和尾鳍）。\n\
  \n你如何在程序中为马和鲸鱼建模？一种方法是创建两个名为 `Horse` 和 `Whale` 的不同类。每个类都可以以自己的方式实现该类型哺乳动物特有的行为，例如\
  \ `Trot`（马小跑）或 `Swim`（游泳）。但你如何处理马和鲸鱼共有的行为，例如 `Breathe`（呼吸）或 `SuckleYoung`（哺乳）呢？你可以向这两个类都添加这些同名的重复方法，但这种情况会变成维护的噩梦，特别是当你还决定开始建模其他类型的哺乳动物（如\
  \ `Human` 和 `Aardvark`）时。\n\n在 C# 中，你可以使用类继承来解决这些问题。马、鲸、人类和狱都是哺乳动物，所以你可以创建一个名为 `Mammal`\
  \ 的类，提供这些类型展示的共同功能。然后你可以声明 `Horse`、`Whale`、`Human` 和 `Aardvark` 类都继承自 `Mammal`。这些类会自动包含\
  \ `Mammal` 类的功能（`Breathe`、`SuckleYoung` 等），你也可以为每个类增加特定类型哺乳动物特有的功能——`Horse` 类的 `Trot`\
  \ 方法和 `Whale` 类的 `Swim` 方法。如果你需要修改如 `Breathe` 这样的常用方法的工作方式，你只需要在一个地方进行更改，即 `Mammal`\
  \ 类。\n\n### 使用继承\n\n你通过以下语法声明一个类继承自另一个类：\n\n```csharp\nclass DerivedClass : BaseClass\n\
  {\n    ...\n}\n```\n\n派生类继承自基类，基类中的方法成为派生类的一部分。在 C# 中，一个类最多允许派自一个基类；不允许一个类派自两个或多个类。然而，除非\
  \ `DerivedClass` 被声明为 `sealed`（密封的），否则你可以使用相同的语法派生其他继承自 `DerivedClass` 的类。（你将在第\
  \ 13 章，“创建接口和定义抽象类 ”中学习密封类。）\n\n```csharp\nclass DerivedSubClass : DerivedClass\n\
  {\n    ...\n}\n```\n\n继续前面描述的示例，你可以如下声明 `Mammal` 类。`Breathe` 和 `SuckleYoung` 是所有哺乳动物共有的。\n\
  \n```csharp\nclass Mammal\n{\n    public void Breathe()\n    {\n        ...\n  \
  \  }\n    public void SuckleYoung()\n    {\n        ...\n    }\n    ...\n}\n```\n\
  \n然后你可以为每种不同的哺乳动物定义类，根据需要添加更多方法，如下例所示：\n\n```csharp\nclass Horse : Mammal\n{\n \
  \   ...\n    public void Trot()\n    {\n        ...\n    }\n}\n\nclass Whale : Mammal\n\
  {\n    ...\n    public void Swim()\n    {\n        ...\n    }\n}\n```\n\n![Image](img/Image00005.jpg)\
  \ 注意\n\n如果你是 C++ 程序员，你应该注意不需要显式指定继承是公有的、私有的还是保护的。C# 的继承总是公有的。如果你熟悉 Java，请注意冒号的使用以及没有\
  \ `extends` 关键字。\n\n如果你在应用程序中创建一个 `Horse` 对象，你可以调用 `Trot`、`Breathe` 和 `SuckleYoung`\
  \ 方法：\n\n```csharp\nHorse myHorse = new Horse();\nmyHorse.Trot();\nmyHorse.Breathe();\n\
  myHorse.SuckleYoung();\n```\n\n同样，你可以创建一个 `Whale` 对象，但这次你可以调用 `Swim`、`Breathe` 和\
  \ `SuckleYoung` 方法；`Trot` 是不可用的，因为它只定义在 `Horse` 类中。\n\n![Image](img/Image0004.jpg)\
  \ 重要\n\n继承适用于类，不适用于结构。你不能为结构定义自己的继承层次结构，也不能定义派自类或另一个结构的结构。\n\n所有结构实际上继承自一个名为 `System.ValueType`\
  \ 的抽象类。（第 13 章探讨了抽象类。）这完全是 Microsoft .NET 框架定义栈值类型通用行为的一种实现细节；你不太会在自己的应用程序中直接使用\
  \ `ValueType`。\n\n### 重温 System.Object 类\n\n`System.Object` 类是所有类的根。所有类都隐式派自 `System.Object`。因此，C#\
  \ 编译器静静地将 `Mammal` 类重写为如下代码（如果你真的想写，可以显式编写）：\n\n```csharp\nclass Mammal : System.Object\n\
  {\n    ...\n}\n```\n\n`System.Object` 类中的任何方法都会通过继承链自动传递给派自 `Mammal` 的类，例如 `Horse`\
  \ 和 `Whale`。在实际中，这意味着你定义的所有类都自动继承了 `System.Object` 类的所有特征。这包括诸如 `ToString`（在第 2\
  \ 章，“使用变量、运算符和表达式 ”中讨论过）的方法，它用于将对象转换为字符串，通常用于显示。\n\n\n\n\n\n除了继承的方法外，派生类还自动包含基类的所有字段。这些字段在创建对象时通常需要初始化。你通常在构造函数中执行这种初始化。请记住，所有类都至少有一个构造函数。（如果你不提供，编译器将为你生成一个默认构造函数。）\n\
  \n在派生类的构造函数中，作为初始化的一部分调用其基类的构造函数是一个良好的做法，这使得基类构造函数能够执行它所需的任何额外初始化。在为继承类定义构造函数时，你可以指定\
  \ `base` 关键字来调用基类构造函数，如下例所示：\n\n点击此处查看代码图像\n\n```csharp\nclass Mammal // 基类\n{\n\
  \    public Mammal(string name) // 基类的构造函数\n    {\n        ...\n    }\n    ...\n\
  }\n\nclass Horse : Mammal // 派生类\n{\n    public Horse(string name)\n    : base(name)\
  \ // 调用 Mammal(name)\n    {\n        ...\n    }\n    ...\n}\n```\n\n如果你不在派生类的构造函数中显式调用基类构造函数，编译器会尝试在执行派生类构造函数中的代码之前，静默插入对基类默认构造函数的调用。参考前面的例子，编译器会将此代码重写：\n\
  \n```csharp\nclass Horse : Mammal\n{\n    public Horse(string name)\n    {\n   \
  \     ...\n    }\n    ...\n}\n```\n\n重写为：\n\n```csharp\nclass Horse : Mammal\n{\n\
  \    public Horse(string name)\n    : base()\n    {\n        ...\n    }\n    ...\n\
  }\n```\n\n如果 `Mammal` 有一个公共的默认构造函数，这种方法就能生效。然而，并不是所有类都有公共的默认构造函数（例如，请记住编译器只有在你没有编写任何非默认构造函数时才会生成默认构造函数），在这种情况下，忘记调用正确的基类构造函数会导致编译时错误。\n\
  \n## 类的赋值\n\n书中之前的示例展示了如何使用类类型来声明变量，以及如何使用 `new` 关键字创建对象。示例中还说明了 C# 的类型检查规则如何防止你将一种类型的对象赋值给声明为不同类型的变量。例如，根据此处显示的\
  \ `Mammal`、`Horse` 和 `Whale` 类的定义，紧随这些定义之后代码是非法的：\n\n点击此处查看代码图像\n\n```csharp\nclass\
  \ Mammal\n{\n    ...\n}\n\nclass Horse : Mammal\n{\n    ...\n}\n\nclass Whale :\
  \ Mammal\n{\n    ...\n}\n...\n\nHorse myHorse = new Horse(...);\n\nWhale myWhale\
  \ = myHorse; // 错误 - 类型不同\n```\n\n然而，只要使用的类型是继承层次结构中更别的类，就可以通过不同类型的变量引用该对象。因此，以下语句是合法的：\n\
  \n点击此处查看代码图像\n\n```csharp\nHorse myHorse = new Horse(...);\nMammal myMammal = myHorse;\
  \ // 合法，Mammal 是 Horse 的基类\n```\n\n从逻辑角度考虑，所有的 `Horse` 都是 `Mammal`，因此你可以安全地将类型为\
  \ `Horse` 的对象赋值给类型为 `Mammal` 的变量。继承层次结构意味着你可以将 `Horse` 简单地视为一种特殊的 `Mammal`；它拥有 `Mammal`\
  \ 拥有的所有内容，加上你添加到 `Horse` 类中的任何方法和字段所定义的额外部分。你也可以让一个 `Mammal` 变量引用一个 `Whale` 对象。然而，有一个重要的限制：当使用\
  \ `Mammal` 变量引用 `Horse` 或 `Whale` 对象时，你只能访问由 `Mammal` 类定义的方法和字段。`Horse` 或 `Whale`\
  \ 类定义的任何额外方法都无法通过 `Mammal` 类视到。\n\n点击此处查看代码图像\n\n```csharp\nHorse myHorse = new\
  \ Horse(...);\nMammal myMammal = myHorse;\n\nmyMammal.Breathe(); // 没问题 - Breathe\
  \ 是 Mammal 类的一部分\nmyMammal.Trot(); // 错误 - Trot 不是 Mammal 类的一部分\n```\n\n***\n\n\
  ![Image](img/Image00005.jpg) 注释\n\n之前的讨论解释了为什么你可以将几乎任何内容赋值给 `object` 变量。记住 `object`\
  \ 是 `System.Object` 的别名，所有类都直接或间接地继承自 `System.Object`。\n\n***\n\n请注意，相反的情况并不成立。你不能无保留地将\
  \ `Mammal` 对象赋值给 `Horse` 变量：\n\n点击此处查看代码图像\n\n```csharp\nMammal myMammal = new Mammal(...);\n\
  Horse myHorse = myMammal; // 错误\n```\n\n这看起来是一个奇怪的限制，但请记住并不是所有的 `Mammal` 对象都是 `Horse`——有些可能是\
  \ `Whale`。只要你先检查该 `Mammal` 是否真的是 `Horse`，你就可以将 `Mammal` 对象赋值给 `Horse` 变量，通过使用 `as`\
  \ 或 `is` 运算符（创建和管理类 讨论了这些运算符和转换）。如果是，它会返回该对象，否则返回 `null`。\n\n```csharp\nHorse myHorse\
  \ = new Horse(...);\nMammal myMammal = myHorse as Horse; // 没问题 - 它是 Horse\n\nWhale\
  \ myWhale = new Whale(...);\nMammal myMammal = myWhale as Horse; // null - 它是 Whale\n\
  ```\n\n## 定义新方法\n\n计算机编程领域最困难的任务之一就是为标识符命名有意义的名字。如果你在一个类中定义方法，且该类属于继承层次结构，迟早你会尝试重用一个已经被其他类使用的名称。大多数情况下，这种巧合是混淆的根源，你应该考虑重命名方法以避免冲突。然而，如果你确定两个方法具有相同的签名，从而隐藏基类方法，你可以通过\
  \ `new` 关键字来消除警告。\n\n派生类中的方法会遮蔽（或隐藏）基类中具有相同签名的方法。例如，编译以下代码，编译器会生成一条警告信息，告知 `Horse.Talk`\
  \ 隐藏了继承的方法 `Mammal.Talk`：\n\n点击此处查看代码图像\n\n```csharp\nclass Mammal\n{\n    ...\n\
  \    public void Talk() // 假设所有哺乳动物都会说话\n    {\n        ...\n    }\n}\n\nclass Horse\
  \ : Mammal\n{\n    ...\n    public void Talk() // 马的说话方式与其他哺乳动物不同！\n    {\n    \
  \    ...\n    }\n}\n```\n\n尽管你的代码可以编译并运行，但你应该认真对待这个警告。如果另一个类派自 `Horse` 并调用 `Talk`\
  \ 方法，它可能期望调用在 `Mammal` 类中实现的方法。然而，`Horse` 类中的 `Talk` 方法隐藏了 `Mammal` 类中的 `Talk` 方法，取而代之的是\
  \ `Horse.Talk`。大多数情况下，这种巧合是混淆的根源，你应该考虑重命名方法以避免冲突。然而，如果你确定两个方法具有相同的签名，从而隐藏 `Mammal.Talk`\
  \ 方法，你可以使用 `new` 关键字来消除警告，如下：\n\n```csharp\nclass Mammal\n{\n    ...\n    public\
  \ void Talk()\n    {\n        ...\n    }\n}\n\nclass Horse : Mammal\n{\n    ...\n\
  \    new public void Talk()\n    {\n        ...\n    }\n}\n```\n\n\n\n\n像这样使用 `new`\
  \ 关键字并不能改变这两个方法完全无关的事实，隐藏（hiding）现象仍然会发生。它只是关闭了警告。实际上，`new` 关键字的作用是：“我知道我在做什么，所以停止向我显示这些警告吧。”\n\
  \n## 声明虚方法\n\n有时，你确实想要隐藏基类中某个方法的实现方式。例如，考虑 `System.Object` 中的 `ToString` 方法。`ToString`\
  \ 的目的是将对象转换为其字符串表示。因为这个方法非常有用，它是 `System.Object` 类的一个成员，从而为所有类都提供了 `ToString` 方法。然而，由\
  \ `System.Object` 实现的 `ToString` 版本又是如何知道如何将派生类的实例转换为字符串的呢？派生类可能包含许多具有有趣值的字段，而这些值本应该是字符串的一部分。答案是，`System.Object`\
  \ 中 `ToString` 的实现实际上有点简单。它能做的只是将对象转换为一个包含其类型名称的字符串，例如“Mammal”或“Horse”。毕竟，这并不非常用用。那么，为什么要提供一个毫无用处方法呢？这第二个问题的答案需要一些详细的思考。\n\
  \n显然，`ToString` 在概念上是一个好主意，所有类都应该提供一个可以将对象转换为字符串以便显示或调试的方法。只有实现方式需要注意。事实上，并不期望你调用由\
  \ `System.Object` 定义的 `ToString` 方法；它只是一个占位符。相反，你可能会发现在你定义的每个类中提供你自己的 `ToString`\
  \ 方法版本并覆盖 `System.Object` 中的默认实现更有用。`System.Object` 中的版本仅作为安全网，以防某个类没有实现或不需要它特有的\
  \ `ToString` 方法版本。\n\n旨在被重写的方法被称为 `virtual`（虚）方法。你应该清楚“重写”（overriding）方法与“隐藏”（hiding）方法之间的区别。重写方法是为同一种方法提供不同实现的机制——这些方法都是相关的，因为它们旨在执行相同的任务，但以特定类的方式执行。隐藏方法是用一种方法替换另一种方法的手段——这些方法通常无关，可能执行完全不同的任务。重写方法是一个实用的编程概念；而隐藏方法通常是一个错误。\n\
  \n你可以通过 `virtual` 关键字将方法标记为虚方法。例如，`System.Object` 类中的 `ToString` 方法定义如下：\n\n```csharp\n\
  namespace System\n{\n\nclass Object\n{\n\npublic virtual string ToString()\n{\n\
  ...\n}\n\n...\n}\n\n...\n}\n```\n\n注意：如果你具有 Java 开发经验，你应该注意 C# 方法默认不是虚的。\n\n## 声明重写方法\n\
  \n如果基类声明某个方法是虚的，则派生类可以使用 `override` 关键字来声明该方法的另一种实现，如此处所示：\n\n```csharp\nclass Horse\
  \ : Mammal\n{\n...\npublic override string ToString()\n{\n...\n}\n}\n```\n\n派生类中方法的新实现可以使用\
  \ `base` 关键字调用基类中该方法的原始实现，如下：\n\n```csharp\npublic override string ToString()\n\
  {\nstring temp = base.ToString();\n...\n}\n```\n\n当使用 `virtual` 和 `override` 关键字声明多态方法时（如侧边栏讨论的“虚方法与多态”所示），你必须遵循一些重要的规则：\n\
  \n- 虚方法不能是私有的（private）；它旨在通过继承暴露给其他类。同样，重写方法不能是私有的，因为类不能更改它继承的方法的保护级别。然而，重写方法可以具有一种特殊的隐私形式，即\
  \ `protected access`，你将在下一节中发现这一点。\n- 虚方法和重写方法的签名必须完全相同；它们必须具有相同的名称、参数的数量和类型。此外，两个方法都必须返回相同的类型。\n\
  - 你只能重写虚方法。如果基类方法不是虚的，而你尝试重写它，你将得到编译错误。这是合理的；应该由基类类设计者来决定其方法是否可以被重写。\n- 如果派生类没有使用\
  \ `override` 关键字声明该方法，它就没有重写基类方法；而是隐藏了方法。换句话说，它变成了一个完全不同方法的实现，恰好名字相同。和之前一样，这将导致编译警告，你可以像之前描述的那样使用\
  \ `new` 关键字消除它。\n- 重写方法隐式是虚的，并且可以在进一步的派生类中再次被重写。但是，你不允许使用 `virtual` 关键字显式声明重写方法是虚的。\n\
  \n## 虚方法与多态\n\n使用虚方法，你可以根据运行时确定的对象类型调用同一方法的不同版本。考虑以下定义 `GetTypeName` 的类示例：\n\n```csharp\n\
  class Mammal\n{\n\npublic virtual string GetTypeName()\n{\nreturn \"This is a mammal\"\
  ;\n}\n}\n\nclass Horse : Mammal\n{\n...\npublic override string GetTypeName()\n\
  {\nreturn \"This is a horse\";\n}\n}\n\nclass Whale : Mammal\n{\n...\npublic override\
  \ string GetTypeName()\n{\nreturn \"This is a whale\";\n}\n}\n\nclass Aardvk : Mammal\n\
  {\n...\n}\n```\n\n现在检查以下代码块：\n\n```csharp\nMammal myMammal;\n\nHorse myHorse = new\
  \ Horse();\nWhale myWhale = new Whale();\n\nAardvark myAardvark = new Aardvark();\n\
  \nmyMammal = myHorse;\nConsole.WriteLine(myMammal.GetTypeName()); // Horse\n\nmyMammal\
  \ = myWhale;\nConsole.WriteLine(myMammal.GetTypeName()); // Whale\n\nmyMammal =\
  \ myAardvark;\nConsole.WriteLine(myMammal.GetTypeName()); // Aardvark\n```\n\n这三个不同的\
  \ `Console.WriteLine` 语句将输出什么？初看，你可能会认为它们都会打印“This is a mammal”，因为每个语句都是调用 `myMammal`\
  \ 变量 `GetTypeName` 方法，而它是一个 `Mammal`。然而，在第一情况下，你可以看到 `myMammal` 实际上是一个 `Horse`。（记住，可以将\
  \ `Horse` 赋值给 `Mammal` 变量，因为 `Horse` 类继承自 `Mammal` 类）。由于 `GetTypeName` 方法被定义为虚方法，运行时确定应该调用\
  \ `Horse.GetTypeName` 方法，因此语句实际上打印了“This is a horse”。相同的逻辑适用于第二个 `Console.WriteLine`\
  \ 语句，它输出消息“This is a whale”。第三条语句对 `Aardvark` 对象调用 `Console.WriteLine`。然而，`Aardvk`\
  \ 类没有 `GetTypeName` 方法，因此调用了 `Mammal` 类中的默认方法，返回字符串“This is a mammal”。\n\n\n\n\n\
  \n这种根据上下文对同一语句调用不同方法的现象被称为 `polymorphism`（多态），其字面上的意思是“许多形式”。\n\n## 了解 `protected`\
  \ 访问权限\n\n`public` 和 `private` 访问权限关键字创建了访问范围的两个极端情况：类的公共字段和方法对所有人可见，而类的私有字段和方法仅对类本身可见。\n\
  \n在考虑孤立的类时，这两个极端情况就足够了。然而，正如所有丰富的面向对象程序员所 true 的，孤立的类无法解决复杂问题。继承是连接类的强大方式，派生类与其基类之间显然存在特殊且紧密的关系。通常情况下，让基类允许派生类访问某些成员，同时对不属于继承层次体系的类隐藏这些成员，是非常有用的。在这种情况下，你可以使用\
  \ `protected` 关键字标记成员。其工作原理如下：\n\n![Image](img/Image00001.jpg) 如果类 `A` 派生自另一个类 `B`，它就可以访问类\
  \ `B` 的 `protected` 类成员。换句话说，在派生类 `A` 内部，类 `B` 的 `protected` 成员实际上是公共的。\n\n![Image](img/Image00001.jpg)\
  \ 如果类 `A` 没有派生自另一个类 `B`，它无法访问类 `B` 的任何 `protected` 成员。因此，在类 `A` 内部，类 `B` 的 `protected`\
  \ 成员实际上是私有的。\n\nC# 让程序员完全自由并将方法和字段声明为 `protected`。然而，大多数面向对象编程指南建议你尽可能将字段严格设为私有，仅在绝对必要时才放宽限制。公共字段违反了封装，因为类的所有用户都可以对字段进行直接、无限制的访问。保护性字段为类的用户维护了封装，对于这些用户来说，`protected`\
  \ 字段是不可访问的。然而，`protected` 字段仍然允许继承自基类的其他类破坏封装。\n\n![Image](img/Image00005.jpg) 注意\n\
  \n你不仅可以在派生类中访问保护基类成员，还可以在派生自该派生类的类中访问。\n\n### 在接下来的练习中，你将定义一个简单的类层次结构来模拟不同类型的车辆。你将定义一个名为\
  \ `Vehicle` 的基类，以及名为 `Airplane` 和 `Car` 的派生类。你将在 `Vehicle` 类中定义名为 `StartEngine`\
  \ 和 `StopEngine` 的通用方法，并在两个派生类中添加一些特定于这些类的方法。最后，你将在 `Vehicle` 类中添加一个名为 `Drive` 的虚拟方法，并在两个派生类中重写该方法的默认实现。\n\
