  \ C# 对象的生命周期。第三部分 中的章节将基于这些信息，向你展示如何使用 C# 创建可扩展的组件——即你可以在许多应用程序中重用的高功能数据类型。\n\n\
  在第三部分中，你将学习 C# 的更多高级特性，如属性、索引器、泛型和集合类。你将看到如何使用事件来构建响应式系统，以及如何使用委托从一个类中调用另一个类的应用程序逻辑，而不会导致类之间的紧密耦合——这种强大的技术使你能够构建出高度可扩展的系统。你还将学习语言集成查询\
  \ (LINQ)，它允许你以一种清晰、自然的方式对对象集合执行复杂查询。你并将看到如何重载运算符，以自定义常用 C# 运算符在你自己的类和结构体上的功能方式。\n\
  \n## 第 15 章：实现属性以访问字段\n\n完成本章后，你将能够：\n\n- ![Image](img/Image00001.jpg) 使用属性封装逻辑字段。\n\
  - ![Image](img/Image00001.jpg) 通过声明 `get` 访问器来控制对属性的读取访问。\n- ![Image](img/Image00001.jpg)\
  \ 通过声明 `set` 访问器来控制对属性的写入访问。\n- ![Image](img/Image00001.jpg) 创建声明属性的接口。\n- ![Image](img/Image00001.jpg)\
  \ 使用结构体和类实现包含属性的接口。\n- ![Image](img/Image00001.jpg) 根据字段定义自动生成属性。\n- ![Image](img/Image00001.jpg)\
  \ 使用属性初始化对象。\n\n本章介绍了如何定义和使用属性来封装类中的字段和数据。之前的章节强调，你应该将类中的字段设为私有，并提供方法来在其中存储值并检索这些值。这种方法确保了对字段的安全且受控的访问，你可以用它来封装有关允许值的额外逻辑和规则。然而，这种方式访问字段的语法并不够自然。当你想要读取或写入变量时，通常使用赋值语句，因此调用方法来实现对字段的相同的效果（毕竟字段终究只是一个变量）感觉有些笨拙。属性的设计就是为了缓解这种不自然感。\n\
  \n## 使用方法实现封装\n\n首先，让我们回顾一下使用方法隐藏字段的原始初衷。\n\n考虑以下结构体，它用计算机屏幕上的位置表示为坐标对 `x` 和 `y`。假设\
  \ x 坐标的有效值范围在 0 到 1280 之间，y 坐标的有效值范围在 0 到 1024 之间。\n\n点击此处查看代码图像\n\n```csharp\n\
  struct ScreenPosition\n{\n    public int X;\n    public int Y;\n\n    public ScreenPosition(int\
  \ x, int y)\n    {\n        this.X = rangeCheckedX(x);\n        this.Y = rangeCheckedY(y);\n\
  \    }\n\n    private static int rangeCheckedX(int x)\n    {\n        if (x < 0\
  \ || x > 1280)\n        {\n            throw new ArgumentOutOfRangeException(\"\
  X\");\n        }\n        return x;\n    }\n\n    private static int rangeCheckedY(int\
  \ y)\n    {\n        if (y < 0 || y > 1024)\n        {\n            throw new ArgumentOutOfRangeException(\"\
  Y\");\n        }\n        return y;\n    }\n}\n```\n\n该结构体的一个问题是它没有遵循封装的黄金法则——即它没有保持数据的私有性。公开数据通常是一个糟糕的主意，因为类无法控制应用程序指定的值。例如，`ScreenPosition`\
  \ 构造函数检查了参数以确保它们在指定的范围内，但对公共字段的“原始”访问无法进行此类检查。迟晚（可能更早），开发者在应用程序中使用该类时所犯的错误或误解都可能导致\
  \ `X` 或 `Y` 偏出此范围：\n\n点击此处查看代码图像\n\n```csharp\nScreenPosition origin = new ScreenPosition(0,\
  \ 0);\n...\nint xpos = origin.X;\norigin.Y = -100; // 哎\n```\n\n解决此问题的常用方法是将字段设为私有，并分别添加一个访问器方法和一个修改方法，用于读取和写入每个私有字段的值。修改方法随后可以检查新字段值的范围。例如，接下来的代码包含了针对\
  \ `X` 字段的访问器 `GetX()` 和修改器 `SetX()`。注意 `SetX` 检查了传入的参数。\n\n点击此处查看代码图像\n\n```csharp\n\
  struct ScreenPosition\n{\n    ...\n    public int GetX()\n    {\n        return\
  \ this.x;\n    }\n\n    public void SetX(int newX)\n    {\n        this.x = rangeCheckedX(newX);\n\
  \    }\n    ...\n    private static int rangeCheckedX(int x) { ... }\n    private\
  \ static int rangeCheckedY(int y) { ... }\n    private int x, y;\n}\n```\n\n代码现在成功地强制了范围限制，这是好的。然而，这种宝贵的保证是需要代价的——`ScreenPosition`\
  \ 不再具有自然的字段式语法；取而代之的是笨拙的方法语法。接下来的示例将 `X` 的值增加了 10。为了这样做，它必须读取 `X` 的值。它通过 `GetX()`\
  \ 方法读取 `X` 的值，然后通过 `SetX()` 方法写入 `X` 的值。\n\n```csharp\nint xpos = origin.GetX();\n\
  origin.SetX(xpos + 10);\n```\n\n将其与 `X` 字段公开时的等效代码比较：\n\n```csharp\norigin.X +=\
  \ 10;\n```\n\n毫无疑问，在这种情况下，使用公共字段在语法上更简洁、更短且更容易。然而，公共字段破坏了封装。通过使用属性，你可以结合字段和方法的优点，在保持封装的同时提供字段式的语法。\n\
  \n## 什么是属性？\n\n`属性` 是字段和方法的一种交叉——它看起来像字段，但用起来像方法。你使用与字段相同的语法来访问属性。然而，编译器会将这种字段语法翻译为访问器方法（有时称为\
  \ `属性访问器` 和 `属性设置器`）。\n\n属性定义的语法如下：\n\n点击此处查看代码图像\n\n```csharp\n访问修饰符 类型 属性名\n{\n\
  \    get\n    {\n        // 读取代码\n    }\n    set\n    {\n        // 写入代码\n    }\n\
  }\n```\n\n属性可以包含两个代码块，以 `get` 和 `set` 关键字开头。`get` 块在读取属性时执行`set` 块在写入属性时运行。属性的类型指定了由\
  \ `get` 和 `set` 访问器读取和写入的数据类型。\n\n下一个示例展示了使用属性重写的 `ScreenPosition` 结构体。观察这段代码，注意以下几点：\n\
  \n- ![Image](img/Image00001.jpg) 小写的 `_x` 和 `_y` 是私有字段。\n- ![Image](img/Image00001.jpg)\
  \ 大写的 `X` 和 `Y` 是公共属性。\n- ![Image](img/Image00001.jpg) 所有的 `set` 访问器通过使用名为 `value`\
  \ 的隐藏内置参数传递要写入的数据。\n\n点击此处查看代码图像\n\n```csharp\nstruct ScreenPosition\n{\n    private\
  \ int _x, _y;\n\n    public ScreenPosition(int X, int Y)\n    {\n        this._x\
  \ = rangeCheckedX(X);\n        this._y = rangeCheckedY(Y);\n    }\n\n    public\
  \ int X\n    {\n        get { return this._x; }\n        set { this._x = rangeCheckedX(value);\
  \ }\n    }\n\n    public int Y\n    {\n        get { return this._y; }\n       \
  \ set { this._y = rangeCheckedY(value); }\n    }\n}\n```\n\n\n\n\n\n```csharp\n\
  public int Y\n{\n    get { return this._y; }\n    set { this._y = rangeCheckedY(value);\
  \ }\n}\n\nprivate static int rangeCheckedX(int x) { ... }\nprivate static int rangeCheckedY(int\
  \ y) { ... }\n}\n```\n\n在这个示例中，一个私有字段直接实现了每个属性，但这只是实现属性的一种方法。所有的要求就是 `get` 访问器返回一个指定类型的值。这种值可以很容易地动态计算，而不是简单地从存储的数据中检索，在这种情况下，就不需要物理字段了。\n\
  \n***\n\n![Image](img/Image00005.jpg) 注意\n\n虽然本章的示例展示了如何为结构体定义属性，但它们对于类同样适用；语法是相同的。\n\
  \n***\n\n## 属性与字段名：警告\n\n`第 2 章` 中的 `命名变量` 节以及 `变量、运算符和表达式` 描述了一些关于变量命名的建议。特别是，它指出你不应该避免以下划线开头标识符。然而，你可以看到\
  \ `ScreenPosition` 结构体并没有完全遵循这一指导；它包含了名为 `_x` 和 `_y` 的字段。这种异常现象有一个充分的原因。`第 7 章`\
  \ 中的 `创建和管理类与对象` 侧边栏 `命名与访问性` 描述了通常使用大写字母开头的标识符用于公共方法和字段，使用小写字母开头的标识符用于私有方法和字段。结合做法结合会导致属性和私有字段名称仅首字母大小写不同，许多组织正是这样做的。\n\
  \n如果你的组织遵循这种方法，你应该意识到一个重要的缺点。检查下面的代码，它实现了一个名为 `Employee` 的类。`employeeID` 字段是私有的，但\
  \ `EmployeeID` 属性提供了该字段的公共访问。\n\n点击此处查看代码图像\n\n```csharp\nclass Employee\n{\n  \
  \  private int employeeID;\n    public int EmployeeID\n    {\n        get { return\
  \ this.EmployeeID; }\n        set { this.EmployeeID = value; }\n    }\n}\n```\n\n\
  这段代码可以完美编译，但每当访问 `EmployeeID` 属性时，程序都会抛出 `StackOverflowException` 异常。异常发生是因为 `get`\
  \ 和 `set` 访问器引用了属性（大写 `E`）而不是私有字段（小写 `e`），这导致了无限递归循环，最终导致进程耗尽可用内存。这种 bug 很难发现！出于这个原因，书中的示例为属性提供数据的私有字段以下划线开头；这使得它们更容易与属性名称区分开。所有其他私有字段将继续使用不带下划线的驼峰命名标识符。\n\
  \n***\n\n## 使用属性\n\n当你在表达式中使用属性时，你可以在读取上下文中（当你检索其值时）和在写入上下文中（当你修改其值时）使用它。接下来的示例展示了如何从\
  \ `ScreenPosition` 结构的 `X` 和 `Y` 属性中读取值：\n\n点击此处查看代码图像\n\n```csharp\nScreenPosition\
  \ origin = new ScreenPosition(0, 0);\nint xpos = origin.X; // 调用 origin.X.get\n\
  int ypos = origin.Y; // 调用 origin.Y.get\n```\n\n注意，你使用相同的语法来访问属性和字段。当你在读取上下文中使用属性时，编译器会自动将你的类字段代码翻译为对该属性的\
  \ `get` 访问器的调用。同样，如果你在写入上下文中使用属性，编译器会自动将你的类字段代码翻译为对该属性的 `set` 访问器的调用。\n\n点击此处查看代码图像\n\
  \n```csharp\norigin.X = 40; // 调用 origin.X.set，值设置为 40\norigin.Y = 100; // 调用 origin.Y.Set，值设置为\
  \ 100\n```\n\n如上一节所述，赋值的值通过 `value` 变量传递给 `set` 访问器。运行时会自动完成这一点。\n\n也可以在读/写上下中使用属性。在这种情况下，`get`\
  \ 访问器和 `set` 访问器都会被使用。例如，编译器会自动将如下语句翻译为对 `get` 和 `set` 访问器的调用：\n\n```csharp\norigin.X\
  \ += 10;\n```\n\n***\n\n![Image](img/Image00013.jpg) 提示\n\n你可以像声明静态字段和方法一样声明静态属性。你可以通过类或结构体的名称而不是类或结构的实例来访问静态属性。\n\
  \n***\n\n## 只读属性\n\n你可以声明一个仅包含 `get` 访问器的属性。在这种情况下，你只能在读取上下文中使用该属性。例如，这里是 `ScreenPosition`\
  \ 结构的 `X` 属性被声明为只读属性：\n\n```csharp\nstruct ScreenPosition\n{\n    private int _x;\n\
  \    ...\n    public int X\n    {\n        get { return this._x; }\n    }\n}\n```\n\
  \n`X` 属性不包含 `set` 访问器；因此，任何在写入上下文中使用 `X` 的尝试都将失败，如下所示：\n\n点击此处查看代码图像\n\n```csharp\n\
  origin.X = 40; // 编译错误\n```\n\n## 只写属性\n\n同样，你可以声明一个仅包含 `set` 访问器的属性。在这种情况下，你只能在写入上下文中使用该属性。例如，这里是\
  \ `ScreenPosition` 结构的 `X` 属性被声明为只写属性：\n\n```csharp\nstruct ScreenPosition\n{\n\
  \    private int _x;\n    ...\n    public int X\n    {\n        set { this._x =\
  \ rangeCheckedX(value); }\n    }\n}\n```\n\n`X` 属性不包含 `get` 访问器；任何在读取上下文中使用 `X`\
  \ 的尝试都将失败，如下所示：\n\n点击此处查看代码图像\n\n```csharp\nConsole.WriteLine(origin.X); // 编译错误\n\
  origin.X = 200; // 编译 OK\norigin.X += 10; // 编译错误\n```\n\n***\n\n![Image](img/Image00005.jpg)\
  \ 注意\n\n只写属性对于密码等安全数据非常有用。理想情况下，实现安全性的应用程序应该允许你设置密码，但永远不允许你回读它。当用户尝试登录时，用户可以提供密码。登录方法可以将此密码与存储的密码进行比较，并仅返回它们是否匹配的指示。\n\
  \n***\n\n## 属性访问性\n\n可以在声明属性时指定属性的访问性（使用 `public`、`private` 或 `protected` 关键字）。然而，在属性声明内部可以覆盖\
  \ `get` 和 `set` 访问器的属性访问性。例如，后续代码所示的 `ScreenPosition` 结构版本将 `X` 和 `Y` 属性的 `set`\
  \ 访问器定义为私有。（get 访问器是公共的，因为属性是公共的。）\n\n点击此处查看代码图像\n\n```csharp\nstruct ScreenPosition\n\
  {\n    private int _x, _y;\n    ...\n    public int X\n    {\n        get { return\
  \ this._x; }\n        private set { this._x = rangeCheckedX(value); }\n    }\n \
  \   public int Y\n    {\n        get { return this._y; }\n        private set {\
  \ this._y = rangeCheckedY(value); }\n    }\n    ...\n}\n```\n\n当你定义访问性不同的访问器时，你必须遵守一些规则：\n\
  \n![Image](img/Image00001.jpg) 你可以在定义时仅更改其中一个访问器的访问性。如果你打算将属性定义为公共，然后又要将两个访问器的访问性都改为私有，那么这样做毫无意义。\n\
  \n\n\n\n\n\n![Image](img/Image00001.jpg) 修饰符指定的访问权限级别不能比属性本身的访问级别更低。例如，如果属性被声明为\
  \ `private`，则你不能将读取访问器指定为 `public`。（相反，你可以将属性设为 `public`，并将写入访问器设为 `private`。）\n\
  \n## 理解属性的限制\n\n当你使用属性读取或写入数据时，属性的外观、操作方式和感觉都像字段。然而，它们并不是真正的字段，对它们施加某些限制：\n\n![Image](img/Image00001.jpg)\
  \ 只有在结构体或类初始化后，你才能通过结构体或类的属性赋值。下面的代码示例是非法的，因为 `location` 变量尚未初始化（未使用 `new`）：\n\n\
  点击此处查看代码图像\n\n```sharp\nScreenPosition location;\n\nlocation.X = 40; // 编译错误，location\
  \ 未赋值\n```\n\n***\n\n![Image](img/Image00005.jpg) 注意\n\n这看起来可能很微不足道，但如果 `X` 是字段而不是属性，那么代码将是法的。出于这个原因，你应该从一开始就使用属性定义结构体和类，而不是使用稍后迁移到属性的字段。在你将字段改为属性后，使用你的类和结构体的代码可能不再能够工作。你将在本章节后面的“生成自动属性”部分中重新回到这个问题。\n\
  \n***\n\n![Image](img/Image00001.jpg) 你不能将属性作为方法的 `ref` 或 `out` 参数（尽管你可以将可写字段作为\
  \ `ref` 或 `out` 参数）。这是合理的，因为属性并没有真正指向某个内存位置；相反，它指向一个访问器方法，如下例所示：\n\n点击此处查看代码图像\n\
  \n```sharp\nMyMethod(ref location.X); // 编译错误\n```\n\n![Image](img/Image00001.jpg)\
  \ 属性最多可以包含一个 `get` 访问器和一个 `set` 访问器。属性不能包含其他方法、字段或属性。\n\n![Image](img/Image00001.jpg)\
  \ `get` 和 `set` 访问器不能接受任何参数。被赋值的数据通过使用 `value` 变量自动传递给 `set` 访问器。\n\n![Image](img/Image00001.jpg)\
  \ 你不能使用 `const` 来声明属性，此处演示所示：\n\n点击此处查看代码图像\n\n```sharp\nconst int X { get { ...\
  \ } set { ... } } // 编译错误\n```\n\n***\n\n## 适当使用属性\n\n属性是一项强大的功能，如果使用正确，它们可以帮助代码更易理解和维护。然而，它们并不能取代为了谨的面向对象设计，这种设计应该关注对象的行为而不是对象的属性。通过普通方法或属性访问私有字段本身（这本身）并不能让你的代码设计良好。例如，一个银行账户持有一个余额，表示账户中的可用资金。因此，你可能倾向于在\
  \ `BankAccount` 类上创建一个 `Balance` 属性，如下所示：\n\n点击此处查看代码图像\n\n```csharp\nclass BankAccount\n\
  {\n    private decimal _balance;\n    ...\n    public decimal Balance\n    {\n \
  \       get { return this._balance; }\n        set { this._balance = value; }\n\
  \    }\n}\n```\n\n这是一个糟糕的设计，因为它没有表示当有人从账户取款或向账户存款时所需的功能。（如果你知道哪家银行允许你在不物理性地向账户存钱的情况下直接更改账户余额，请告诉我！）当你编程时，尝试在解决方案中表达你正在解决的问题，不要迷失在大量的低级语法中。如接下来的示例所示，为\
  \ `BankAccount` 类提供 `Deposit` 和 `Withdraw` 方法，而不是属性设置器：\n\n点击此处查看代码图像\n\n```csharp\n\
  class BankAccount\n{\n    private decimal _balance;\n    ...\n    public decimal\
  \ Balance { get { return this._balance; } }\n    public void Deposit(decimal amount)\
  \ { ... }\n    public bool Withdraw(decimal amount) { ... }\n}\n```\n\n***\n\n##\
  \ 接口属性\n\n你在第 13 章“创建接口和定义抽象类”中遇到过接口。接口可以定义属性也可以定义方法。要实现这一点，你指定 `get` 或 `set` 关键字或两者，但你需要将\
  \ `get` 或 `set` 访问器的体替换为分号，如下：\n\n```csharp\ninterface IScreenPosition\n{\n    int\
  \ X { get; set; }\n    int Y { get; set; }\n}\n```\n\n实现此接口的任何类或结构体必须使用 `get` 和\
  \ `set` 访问器方法实现 `X` 和 `Y` 属性。\n\n点击此处查看代码图像\n\n```csharp\nstruct ScreenPosition\
  \ : IScreenPosition\n{\n    ...\n    public int X { get; set; }\n    ...\n}\n```\n\
  \n如果你在类中实现接口，可以将属性声明为 `virtual`，从而允许派生类覆盖这些实现。\n\n点击此处查看代码图像\n\n```csharp\nclass\
  \ ScreenPosition : IScreenPosition\n{\n    ...\n    public virtual int X { get;\
  \ set; }\n    public virtual int Y { get; set; }\n}\n```\n\n***\n\n![Image](img/Image00005.jpg)\
  \ 注意\n\n此示例显示了一个类。记住，由于结构体不支持继承，`virtual` 关键字是无效的。你也可以通过第 13 章涵盖的显式实现来选择属性。显式实现是非公开且非虚的。\n\
  \n点击此处查看代码图像\n\n```csharp\nstruct ScreenPosition : IScreenPosition\n{\n    ...\n\
  \    int IScreenPosition.X\n    {\n        get { ... }\n        set { ... }\n  \
  \  }\n    int IScreenPosition.Y\n    {\n        get { ... }\n        set { ... }\n\
  \    }\n}\n```\n\n\n\n\n\n## 5. 删除此方法，并将其替换为名为 `X` 和 `Y` 的一对属性的定义，如下加粗所示：\n\n```csharp\n\
  interface IDraw\n{\n    int X { get; set; }\n    int Y { get; set; }\n    ...\n\
  }\n```\n\n## 6. 在 `DrawingShape` 类中，删除 `SetLocation` 方法并将其替换为以下 `X` 和 `Y` 属性的实现：\n\
