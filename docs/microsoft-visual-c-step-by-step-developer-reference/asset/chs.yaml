  \n## 11. 在此方法中，将调用 `Circle` 对象 `SetLocation` 方法的语句替换为设置 `X` 和 `Y` 属性，如下例中加粗所示：\n\
  \n点击此处查看代码图像\n\n```csharp\nif (myCircle is IDraw)\n{\n    IDraw drawCircle = myCircle;\n\
