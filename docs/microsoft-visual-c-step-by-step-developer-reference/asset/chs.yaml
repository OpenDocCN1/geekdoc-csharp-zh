  \ 窗口中，点击绘制图形（Plot Graph）但不要点击取消（Cancel）。验证显示的消息报告任务状态为 `RanToCompletion`（两次）。\n\n\
  **6.** 在 GraphDemo 窗口中，再次点击绘制图形，然后快速点击取消。\n\n惊讶的是，出现的消息仍然报告每个任务的状态为 `RanToCompletion`，尽管图表出现了空洞。\n\
  \n![Image](img/Image00158.jpg)\n\n这种行为的发生是因为，虽然你通过取消令牌（cancellation token）向每个任务发送了取消请求，但它们运行的方法只是简单地返回了。.NET\
  \ Framework 运行时不知道任务是否真的被取消，或者是否被允许运行完成，它简单地忽略了取消请求。\n\n**7.** 回到 Visual Studio\
  \ 并停止调试。\n\n那么，你如何指示任务已被取消而不是允许其运行完成呢？答案在于作为参数传递给任务运行方法的 `CancellationToken` 对象。`CancellationToken`\
  \ 类提供了一个名为 `ThrowIfCancellationRequested` 的方法。该方法测试取消令牌的 `IsCancellationRequested`\
  \ 属性；如果为 `true`，则该方法将抛出 `OperationCanceledException` 异常并终止任务运行的方法。\n\n启动线程的应用程序应该准备好捕获并处理此异常，但这会导致另一个问题。如果任务通过抛出异常来终止，它实际上会恢复到\
  \ `Faulted` 状态。即使异常是 `OperationCanceledException` 也是如此。任务只有在不抛出异常的情况下被取消时，才会进入 `Canceled`\
  \ 状态。那么，任务如何抛出 `OperationCanceledException` 而不被视为异常呢？\n\n这次，答案在于任务本身。为了让任务识别 `OperationCanceledException`\
  \ 异常是受控取消任务的结果，而不是由其他情况引起的异常，它必须知道操作实际上已被取消。只有当它能够检查取消令牌时才能做到这一点。你将此令牌作为参数传递给任务运行的方法，但任务并没有实际检查它。相反，你在创建并运行任务时指定取消令牌。下面的代码显示了基于\
  \ GraphDemo 的示例。注意 `token` 是传递给 `generateData` 方法的（如之前），但也作为 `Run` 方法的独立参数。\n\n\
  点击此处查看代码图像\n\n```csharp\ntokenSource = new CancellationTokenSource();\nCancellationToken\
  \ token = tokenSource.Token;\n...\nTask first = Task.Run(() => generateData(data,\
  \ 0, pixelWidth / 4, token), token);\n```\n\n现在，当任务运行的方法抛出 `OperationCanceledException`\
  \ 异常时，基础设施会检查 `CancellationToken`。如果它指示任务已被取消，基础设施会将任务状态设置为 `Canceled`。如果你使用 `await`\
  \ 操作等待任务完成，你还需要准备好捕获并处理 `OperationCanceledException` 异常。这是你在下一个练习中要做的。\n\n### 确认取消并处理\
  \ OperationCanceledException 异常\n\n**1.** 在 Visual Studio 中返回显示 `MainPage.xaml.cs`\
  \ 文件的代码和文本编辑器窗口。在 `plotButton_Click` 方法中，修改创建和运行任务的语句，并指定取消令牌对象作为 `generateData`\
  \ 方法的参数，如下文加粗所示：\n\n点击此处查看代码图像\n\n```csharp\nprivate async void plotButton_Click(object\
  \ sender, RoutedEventArgs e)\n{\n    ...\n    tokenSource = new CancellationTokenSource();\n\
  \    CancellationToken token = tokenSource.Token;\n    ...\n    Task first = Task.Run(()\
  \ => generateData(data, 0, pixelWidth / 4, token), token);\n    Task second = Task.Run(()\
  \ => generateData(data, pixelWidth / 4, pixelWidth / 2, token), token);\n    ...\n\
  }\n```\n\n**2.** 在创建和运行任务、等待它们完成以及显示经过的时间语句周围添加 `try` 块。添加一个处理 `OperationCanceledException`\
  \ 异常的 `catch` 块。在此异常处理器中，将异常对象的 `Message` 属性报告的异常原因显示在 `duration` `TextBlock` 控件中。以下加粗的代码显示了你应该做的更改：\n\
  \n```csharp\nprivate async void plotButton_Click(object sender, RoutedEventArgs\
  \ e)\n{\n    ...\n    try\n    {\n        await first;\n        await second;\n\
  \        duration.Text = $\"Duration (ms): {watch.ElapsedMilliseconds}\";\n    }\n\
  \    catch (OperationCanceledException oce)\n    {\n        duration.Text = oce.Message;\n\
  \    }\n    ...\n}\n```\n\n\n\n\n\n```csharp\nstring message = $\"Status of tasks\
  \ is {first.Status, {second.Status}\";\n```\n\n...\n\n}\n\n3. 在 `generateGraphData`\
  \ 方法中，注释掉检查 `CancellationToken` 对象 `IsCancellationRequested` 属性的 `if` 语句，并添加一个调用\
  \ `ThrowIfCancellationRequested` 方法的语句，如此处加粗所示：\n\n点击此处查看代码图像\n\n```csharp\nprivate\
  \ void generateGraphData(byte[] data, int partitionStart, int partitionEnd, CancellationToken\
  \ token)\n{\n    ...\n    for (int x = partitionStart; x < partitionEnd; x++);\n\
  \    {\n        ...\n        for (double i = -p; i < p; i += 3)\n        {\n   \
  \         //if (token.IsCancellationRequested)\n            //{\n            //\
  \ return;\n            ////}\n            token.ThrowIfCancellationRequested();\n\
  \            ...\n        }\n    }\n    ...\n}\n```\n\n\n\n4. 在 `Debug` 菜单上，鼠标指向\
  \ `Windows`，然后点击 `Exception Settings`。在 `Exception Settings` 窗口中，取消勾选 `Common Language\
  \ Runtime Exceptions` 复选框。右键点击 `Common Language Runtime Exceptions`，然后确保启用了 `Continue\
  \ When Unhandled In User Code`。\n\n![Image](img/Image00159.jpg)\n\n此配置是为了防止 Visual\
  \ Studio 调试器拦截你在调试模式下运行应用程序时生成的 `OperationCanceledException` 异常。\n\n5. 在 `Debug`\
  \ 菜单上，点击 `Start Debugging`。\n\n6. 在 `Graph Demo` 窗口中，点击 `Plot Graph`，等待图形出现，并验证两个任务的状态是否都报告为\
  \ `RanToCompletion` 且图形已生成。\n\n7. 再次点击 `Plot Graph`，然后快速点击 `Cancel`。\n\n如果你足够快，一个或两个任务的状态都应该报告为\
  \ `Canceled`，`duration TextBox` 控件应该显示文本“The operation was canceled”，并且应该显示一个带有空洞的图形。如果你速度不够快，请重复此步骤再次尝试。\n\
  \n![Image](img/Image00160.jpg)\n\n8. 返回 Visual Studio 并停止调试。\n\n9. 在 `Debug` 菜单上，鼠标指向\
  \ `Windows`，然后点击 `Exception Settings`。在 `Exception Settings` 窗口的工具栏上，点击 `Restore\
  \ The List To The Default Settings` 按钮，然后点击 `OK`。\n\n***\n\n使用 `AggregateException`\
  \ 类处理任务异常\n\n你在整书中已经看到，异常处理是任何商业应用程序中的一个重要元素。到目前为止你遇到的异常处理结构易于使用，如果你仔细使用它们，捕获异常并确定是哪部分代码抛出它是简单的事情。然而，当你开始将工作分为多个并发任务时，跟踪和处理异常就变成了一个更复杂的问题。上一个练习展示了如何捕获取消任务时抛出的\
  \ `OperationCanceledException` 异常。然而，还有许多其他异常可能发生，不同的任务可能会各自产生异常。因此，你需要一种方法来捕获并处理并发抛出的多个异常。\n\
  \n如果你正在使用 `Task` 等待方法之一来等待多个任务完成（使用实例 `Wait` 方法或静态的 `Task.WaitAll` 和 `Task.WaitAny`\
  \ 方法），这些任务正在运行的方法抛出的任何异常都将汇总到一个称为 `AggregateException` 异常的单个异常中。`AggregateException`\
  \ 异常充当异常集合的包装器。集合中的每个异常可能由不同的任务抛出。在你的应用程序中，你可以捕获 `AggregateException` 异常，然后遍历此集合并执行任何必要的处理。为了帮助你，`AggregateException`\
  \ 类提供了 `Handle` 方法。`Handle` 方法接收一个 `Func<Exception, bool>` 委托，该委托引用一个接受 `Exception`\
  \ 对象作为参数并返回布尔值的方法。当你调用 `Handle` 时，引用的方法会为 `AggregateException` 对象中集合中的每个异常运行一次。引用的方法可以检查异常并采取适当的行动。如果引用的方法处理了异常，它应该返回\
  \ `true`。如果不是，它应该返回 `false`。当 `Handle` 方法完成后，任何未处理的异常将将被捆成一个新的新的 `AggregateException`\
  \ 异常，并抛出该异常。随后的外层异常处理器可以捕获此异常并对其进行处理。\n\n接下来的代码片段展示了一个可以与 `AggregateException` 异常处理器注册的方法示例。如果该方法检测到\
  \ `DivideByZeroException` 异常，它将简单显示消息“Division by zero occurred”；如果发生 `IndexOutOfRangeException`\
  \ 异常，则显示消息“Array index out of bounds”。任何其他异常将保持未处理。\n\n点击此处查看代码图像\n\n```csharp\n\
  private bool handleException(Exception e)\n{\n    if (e is DivideByZeroException)\n\
  \    {\n        displayErrorMessage(\"Division by zero occurred\");\n        return\
  \ true;\n    }\n    if (e is IndexOutOfRangeException)\n    {\n        displayErrorMessage(\"\
  Array index out of bounds\");\n        return true;\n    }\n    return false;\n\
  }\n```\n\n当你使用 `Task` 等待方法之一时，可以这样捕获 `AggregateException` 异常并注册 `handleException`\
  \ 方法：\n\n点击此处查看代码图像\n\n```csharp\ntry\n{\n    Task first = Task.Run(...);\n    Task\
  \ second = Task.Run(...);\n    Task.WaitAll(first, second);\n}\ncatch (AggregateException\
  \ ae)\n{\n    ae.Handle(handleException);\n}\n```\n\n如果任何任务生成了 `DivideByZeroException`\
  \ 异常或 `IndexOutOfRangeException` 异常，`handleException` 方法将显示适当的消息并确认该异常已处理。任何其他异常将被归类为未处理，并将传播到\
  \ `AggregateException` 处理器之外。\n\n你应该注意的一个额外复杂情况。当你取消任务时，你已经看到 CLR 抛出了 `OperationCanceled`\
  \ 异常，如果你在使用 `await` 操作符等待任务，那么这就是所报告的异常。然而，如果你正在使用 `Task` 等待方法之一，此异常将转换为 `TaskCanceledException`\
  \ 异常，而这才是你应该在 `AggregateException` 处理器中准备好处理的异常类型。\n\n***\n\n#### 对已取消和故障任务使用延续任务\n\
  \n如果你需要在任务被取消或抛出未处理异常时执行额外工作，请记住你可以使用带有适当 `TaskContinuationOptions` 值的 `ContinueWith`\
  \ 方法。例如，下面的代码创建运行 `doWork` 方法的任务。如果任务被取消，`ContinueWith` 方法将指定创建另一个任务并运行 `doCancellationWork`\
  \ 方法。该方法可以执行一些简单的日志或清理工作。如果任务未被取消，则延续任务不会运行。\n\n点击此处查看代码图像\n\n```csharp\nTask task\
  \ = new Task(doWork);\ntask.ContinueWith(doCancellationWork, TaskContinuationOptions.OnlyOnCanceled);\n\
  task.Start();\n\n...\n\nprivate void doWork()\n{\n    // 任务在启动时运行此代码\n    ...\n\
  }\n\n...\n\nprivate void doCancellationWork(Task task)\n{\n    // 任务在 doWork 完成时运行此代码\n\
  \    ...\n}\n```\n\n同样，你可以指定值 `TaskContinuationOptions.OnlyOnFaulted` 来指定一个在任务运行的原始方法抛出未处理异常时运行的延续任务。\n\
