  \n比较结构体和类的行为\n\n**1.** 在 StructsAndEnums 项目中，在代码和文本编辑器中显示 Date.cs 文件。\n\n\n\n\n\n\
  ## 2. 向 `Date` 结构体添加以下方法。该方法将结构体中的日期增加一个月。如果增加月份后 `month` 字段的值超过了十二月，代码将将其重置为一月并将\
  \ `year` 字段的值加 1。点击此处查看代码图片\n\n```csharp\nstruct Date\n{\n...\npublic void AdvanceMonth()\n\
  {\n    this.month++;\n    if (this.month == Month.December)\n    {\n        this.month\
  \ = Month.January;\n        this.year++;\n    }\n}\n```\n\n## 3. 在编辑器窗口中显示 `Program.cs`\
  \ 文件。\n\n## 4. 在 `doWork` 方法中，注释掉创建和显示 `default` 变量值的两个语句。\n\n## 5. 在 `doWork` 方法末尾添加以下加粗代码。此代码创建了一个名为\
  \ `AnniversaryCopy` 的 `Anniversary` 变量的副本，并打印了该新变量的值。点击此处查看代码图片\n\n```csharp\nstatic\
  \ void doWork()\n{\n...\nDate AnniversaryCopy = Anniversary;\nConsole.WriteLine($\"\
  Value of copy is {AnniversaryCopy}\");\n}\n```\n\n## 6. 在 `doWork` 方法末尾添加以下加粗语句。这些语句调用\
