  \ Data` 区域（如有请展开该区域）。在此区域中，`ValidateCustomer` 方法上方，创建所示的 `Add` 方法：\n\n点击此处查看代码图像\n\
  \n```csharp\n// 创建一个新的（空的）客户\n// 并表单进入添加模式\nprivate void Add()\n{\n\nCustomer newCustomer\
  \ = new Customer { CustomerID = 0 };\nthis.customers.Insert(currentCustomer, newCustomer);\n\
  this.IsAdding = true;\nthis.OnPropertyChanged(nameof(Current));\n}\n```\n\n\n\n\n\
  \n此方法创建了一个新的 `Customer` 对象。除了 `CustomerID` 属性外，它是空的，该属性为了显示目的被临时设置为 `0`。该属性的真实值将在客户保存到数据库时生成，如前文所述。该客户被添加到客户\
  \ `customers` 列表中（视图使用数据绑定来显示此列表中的数据），ViewModel 被置于添加（Adding）模式，并触发 `PropertyChanged`\
  \ 事件以指示 `Current` 客户已发生更改。\n\n### 7. 在 `ViewModel` 类开头的列表中添加以下**加粗**显示的 `Command`\
