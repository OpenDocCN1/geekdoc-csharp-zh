  \n![Image](img/Image0105.jpg)\n\n14. 返回 Visual Studio 并停止调试。\n\n### 抽象类\n\n你之前讨论的\
  \ `ILandBound` 和 `IGrazable` 接口可以在许多不同的类中实现，取决于你想在 C# 应用程序中建模多少种类型的哺乳动物。在这种情况下，派生类共享通用实现是非常常见的。例如，以下两个类中的重复是显而易见的：\n\
  \n点击此处查看代码图像\n\n```csharp\nclass Horse : Mammal, ILandBound, IGrazable\n{\n  ...\n\
  \  void IGrazable.ChewGrass()\n  {\n    Console.WriteLine(\"Chewing grass\");\n\
  \    // 用于吃草的代码\n  }\n}\n\nclass Sheep : Mammal, ILandBound, IGrazable\n{\n  ...\n\
  \  void IGrazable.ChewGrass()\n  {\n    Console.WriteLine(\"Chewing grass\");\n\
  \    // 与马相同的吃草代码\n  }\n}\n```\n\n代码重复是一个警告信号。如果可能，你应该重构代码以避免重复并减少相关的维护成本。实现这种重构的一种方法是将通用实现放在专门为此目的创建的新类中。实际上，你可以将新类插入到类层次结构中，如下代码示例所示：\n\
  \n点击此处查看代码图像\n\n```csharp\nclass GrazingMammal : Mammal, IGrazable\n{\n  ...\n \
  \ void IGrazable.ChewGrass()\n  {\n    // 通用的吃草代码\n    Console.WriteLine(\"Chewing\
  \ grass\");\n  }\n}\n\nclass Horse : GrazingMammal, ILandBound\n{\n  ...\n}\n\n\
  class Sheep : GrazingMammal, ILandBound\n{\n  ...\n}\n```\n\n\n\n\n这是一个很好的解决方案，但仍有一点不太对：你实际上可以创建\
  \ `GrazingMammal` 类的实例（同样地，还有 `Mammal` 类）。这实际上并没有意义。`GrazingMammal` 类的存在是为了提供一个通用的默认实现。它的唯一目的是作为一个供人继承的类。`GrazingMammal`\
  \ 类是通用功能的抽象，而不是其本身的一个实体。\n\n若要声明不允许创建类的实例，你可以通过 `abstract` 关键字将该类声明为抽象类，如下例所示：\n\
  \n点击此处查看代码图像\n\n```\nabstract class GrazingMammal : Mammal, IGrazable\n{\n    ...\n\
  }\n```\n\n如果你现在尝试实例化一个 `GrazingMammal` 对象，代码将无法编译：\n\n点击此处查看代码图像\n\n```\nGrazingMammal\
  \ myGrazingMammal = new GrazingMammal(...); // illegal\n```\n\n## 抽象方法\n\n抽象类可以包含抽象方法。抽象方法在原理上类似于虚方法（在第\
  \ 12 章中介绍），但它不包含方法体。派生类*必须*重写此方法。抽象方法不能是私有的。以下示例将 `GrazingMammal` 类中的 `DigestGrass`\
  \ 方法定义为抽象方法；食草动物可能使用相同的代码来咀嚼草，但它们必须为 `DigestGrass` 方法提供各自自有的实现。如果为抽象类中提供默认实现没有意义，但你又想确保继承类提供该方法的自有实现，那么抽象方法就是非常有用的。\n\
  \n点击此处查看代码图像\n\n```\nabstract class GrazingMammal : Mammal, IGrazable\n{\n    public\
  \ abstract void DigestGrass();\n    ...\n}\n```\n\n### 密封类\n\n使用继承并不总是容易的，并且需要深思熟虑。如果你创建一个接口或抽象类，你是有意识地在编写将来会被继承的内容。问题在于，预测未来是一项困难的任务。通过实践和经验，你可以培养出构建灵活、易用的接口、抽象类和类层级结构的技能，但这需要付出努力，而且你还需要对正在建模的问题有深入的理解。换句话说，除非你有意识地设计一个类并打算将其作为基类，否则它极不可能作为基类良好工作。在\
  \ C# 中，如果你决定某个类不应该作为基类，可以使用 `sealed` 关键字来防止该类被用基类。例如：\n\n点击此处查看代码图像\n\n```\nsealed\
  \ class Horse : GrazingMammal, ILandBound\n{\n    ...\n}\n```\n\n如果任何类尝试使用 `Horse`\
  \ 作为基类，将产生编译时错误。注意，密封类不能声明任何虚方法，且抽象类不能被密封。\n\n## 密封方法\n\n你也可以使用 `sealed` 关键字来声明一个方法是密封的。这意味着派生类不能重写它。\n\
  \n### 实现和使用抽象类\n\n以下练习使用抽象类从 `Square` 和 `Circle` 类之间提取出通用代码。`DrawingShape` 抽象类使用\
  \ `Shape` 字段来表示这两种类型。\n\n1. 在解决方案管理器中，点击 Drawing 项目。\n2. 在“添加项 – Drawing”对话框中，点击“类”。\n\
  3. 在名称框中，输入 `DrawingShape.cs`，并点击“添加”。\n4. 在 `DrawingShape.cs` 文件顶部，添加以下 `using`\
  \ 指令：\n\n```csharp\nusing Windows.UI;\nusing Windows.Xaml.Media;\nusing Windows.Xaml.Shapes;\n\
  using Windows.Xaml.Controls;\n```\n\n5. 修改 `DrawingShape` 的定义将其声明为抽象类，如下所示：\n\n\
  ```csharp\nabstract class DrawingShape\n{\n    protected int size;\n    protected\
  \ int locX = 0, locY = 0;\n    protected Shape shape = null;\n}\n```\n\n6. 为 `DrawingShape`\
  \ 类添加以下私有变量：\n\n点击此处查看代码图像\n\n7. 向 `DrawingShape` 类添加以下构造函数：\n\n```csharp\npublic\
  \ DrawingShape(int size)\n{\n    this.size = size;\n}\n```\n\n8. 向 `DrawingShape`\
  \ 类添加 `SetLocation` 和 `SetColor` 方法，如下后续代码中加粗部分所示：\n\n```csharp\npublic void SetLocation(int\
  \ xCoord, int yCoord)\n{\n    this.locX = xCoord;\n    this.locY = yCoord;\n}\n\n\
  public void SetColor(Color color)\n{\n    if (this.shape != null)\n    {\n     \
  \   SolidColorBrush brush = new SolidColorBrush(color);\n        this.shape.Fill\
  \ = brush;\n    }\n}\n```\n\n\n\n\n## 9. 在 `DrawingShape` 类中添加 `Draw` 方法\n\n与之前的方法不同，此方法被声明为虚方法（virtual），任何派生类都应该重写它以扩展其功能。该方法中的代码会验证\
  \ `shape` 字段不为空，然后将其绘制在画布上。继承此方法的类必须提供它们自己的代码来实例化 `shape` 对象。（记住，`Square` 类会创建一个\
  \ `Rectangle` 对象，而 `Circle` 类会创建一个 `Ellipse` 对象。）\n\n点击此处查看代码图像\n\n```csharp\nabstract\
  \ class DrawingShape\n{\n  ...\n\n  public virtual void Draw(Canvas canvas)\n  {\n\
  \    if (this.shape == null)\n    {\n      throw new InvalidOperationException(\"\
  Shape is null\");\n    }\n    this.shape.Height = this.size;\n    this.shape.Width\
  \ = this.size;\n    Canvas.SetTop(this.shape, this.locY);\n    Canvas.SetLeft(this.shape,\
  \ this.locX);\n    canvas.Children.Add(this.shape);\n  }\n}\n```\n\n你现在已经完成了 `DrawingShape`\
  \ 抽象类。后续步骤是修改 `Square` 和 `Circle` 类，使其继承此类，然后从 `Square` 和 `Circle` 类中移除重复代码\n\n\
  ### 修改 `Square` 和 `Circle` 类以继承 `DrawingShape` 类\n\n1. 在“代码和文本编辑器”窗口中显示 `Square`\
  \ 类的代码。\n\n2. 修改 `Square` 类的定义，使其在实现 `IDraw` 和 `IColor` 接口的同时，也继承 `DrawingShape`\
  \ 类。\n\n点击此处查看代码图像\n\n```csharp\nclass Square : DrawingShape , IDraw, IColor\n{\n\
  \  ...\n}\n```\n\n注意，你必须在指定 `Square` 类实现的任何接口之前，指定它继承的类。\n\n3. 在 `Square` 类中，删除\
  \ `sideLength`、`rect`、`locX` 和 `locY` 字段的定义。这些字段不再需要了，因为它们现在由 `DrawingShape` 类提供。\n\
  \n4. 使用以下代码替换现有构造函数，该代码会调用基类的构造函数：\n\n点击此处查看代码图像\n\n```csharp\nclass Square : DrawingShape,\
  \ IDraw, IColor\n{\n  public Square(int sideLength)\n  : base(sideLength)\n  {\n\
  \  }\n  ...\n}\n```\n\n注意，此构造函数的体是空的，因为基类构造函数执行了所有所需的初始化。\n\n5. 从 `Square` 类中移除\
  \ `IDraw.SetLocation` 和 `IColor.SetColor` 方法。`DrawingShape` 类提供了这些方法的实现。\n\n6. 修改\
  \ `Draw` 方法的定义。使用 `public override` 进行声明，并移除对 `IDraw` 接口的引用。同样，`DrawingShape` 类已经提供了此方法的基础功能，但你用\
  \ `Square` 类所需的特定代码对其进行扩展。\n\n点击此处查看代码图像\n\n```csharp\npublic override void Draw(Canvas\
  \ canvas)\n{\n  ...\n}\n```\n\n7. 用此处加粗所示的代码替换 `Draw` 方法的体：\n\n点击此处查看代码图像\n\n```csharp\n\
  public override void Draw(Canvas canvas)\n{\n  if (this.shape != null)\n  {\n  \
  \  canvas.Children.Remove(this.shape);\n  }\n  else\n  {\n    this.shape = new Rectangle();\n\
  \  }\n  base.Draw(canvas);\n}\n```\n\n这些语句会在 `shape` 字段尚未实例化时，将其继承自 `DrawingShape`\
  \ 的 `shape` 字段实例化为 `Rectangle` 类的新实例。然后它们会调用 `DrawingShape` 类中的 `Draw` 方法。\n\n8.\
  \ 对 `Circle` 类重复步骤 2 到 7，但构造函数应命名为 `Circle` 并带有一个名为 `diameter` 的参数，在 `Draw` 方法中，你应该将\
  \ `shape` 字段实例化为新的 `Ellipse` 对象。`Circle` 类的完整代码所示：\n\n点击此处查看代码图像\n\n```csharp\n\
  class Circle : DrawingShape, IDraw, IColor\n{\n  public Circle(int diameter)\n \
  \ : base(diameter)\n  {\n  }\n  public override void Draw(Canvas canvas)\n  {\n\
  \    if (this.shape != null)\n    {\n      canvas.Children.Remove(this.shape);\n\
  \    }\n    else\n    {\n      this.shape = new Ellipse();\n    }\n    base.Draw(canvas);\n\
  \  }\n}\n```\n\n9. 在“调试”菜单上，点击“启动调试”。当 Drawing Pad 窗口打开时，验证在窗口中左键点击时出现 `Square`\
  \ 对象，在窗口中右键点击时出现 `Circle` 对象。应用程序的行为应与之前相同。\n\n10. 返回 Visual Studio 并停止调试。\n\n***\n\
  \n## 与 Windows Runtime 的兼容性\n\n第 9 章 描述了从 Windows 8 开始，平台如何在通用语言运行时（CLR）之上实现 Windows\
  \ Runtime。使用枚举和结构创建值类型 说明了 Windows Runtime 如何使用 .NET Framework。非托管应用程序是不使用 .NET\
  \ Framework 运行的应用程序；它们使用 C++ 构建。.NET Framework 提供了大量的库和功能。在 Windows 7 及更早版本中，CLR\
  \ 使用原生 Windows API 实现这些功能。\n\n在 Windows10 上，UWP 应用始终通过 WinRT 运行。这意味着如果你使用 C# 等托管语言构建\
  \ UWP 应用，CLR 调用的是 WinRT 而不是原生 Windows API。微软在 CLR 和 WinRT 之间提供了一个映射层，可以将对 .NET Framework\
  \ 的对象请求和方法调用翻译为相应的 WinRT 请求和方法调用。例如，当你创建一个 .NET Framework `Int32` 值（C# 中的 `int`）时，该代码被翻译为使用相应的\
  \ WinRT 数据类型创建值。然而，尽管 CLR 和 WinRT 有大量重复的功能，但 .NET Framework 4.6 的所有功能在 WinRT 中并没有对应的功能。因此，UWP\
  \ 应用只能访问 .NET Framework 4.6 提供的部分类型和方法。（在 Visual Studio 2015 中，当你使用 C# 构建 UWP 应用时，IntelliSense\
  \ 会显示通过 WinRT 可用的的性视图，省略了无法通过 WinRT 使用的类型和方法。）\n\n另一方面，WinRT 提供了一系列在 .NET Framework\
  \ 中没有直接对应物或其工作方式与 .NET Framework 中的对应功能显著不同的功能，因此无法轻松翻译。WinRT 通过映射层为 CLR 提供这些功能，使其看起来像\
  \ .NET Framework 类型和方法，你可以从托管代码直接调用它们。\n\nCLR 和 WinRT 的集成使得 CLR 能够透明地使用 WinRT 类型，但也支持反向互操作性：你可以使用托管代码定义类型，只要这些类型符合\
  \ WinRT 的预期，就可以让非托管应用程序可用。\n\n\n\n\n\n![Image](img/Image00001.jpg) 任何公共字段，以及任何公共方法的参数和返回值，都必须是\
  \ WinRT 类型，或者是可以被 WinRT 透明地转换为 WinRT 类型的 .NET Framework 类型。支持的 .NET Framework 类型包括符合规范的值类型（如结构体和枚举）以及与\
  \ C# 基本数据类型（`int`、`long`、`float`、`double`、`string` 等）对应的类型。类支持私有字段，它们可以是 .NET Framework\
  \ 中的任何可用类型；不需要符合 WinRT 标准。\n\n![Image](img/Image00001.jpg) 类不能重写 `System.Object`\
  \ 以外的其他方法，且不能声明受保护构造函数。\n\n![Image](img/Image00001.jpg) 定义类的命名空间必须与实现该类的程序集名称相同。此外，命名空间名称（因此程序集名称）不能以“Windows”开头。\n\
  \n![Image](img/Image00001.jpg) 你无法通过 WinRT 在非托管应用程序中继承托管类型。因此，所有公共类都必须是密封的（sealed）。如果你需要实现多态，可以创建一个公共接口，并在必须实现多态的类上实现该接口。\n\
  \n![Image](img/Image00001.jpg) 你可以抛出 UWP 应用可用 .NET Framework 子集中的任何异常类型；你不能自定义异常类。如果你的代码在从非托管应用程序调用时抛出未处理的异常，WinRT\
  \ 会非托管代码中抛出一个等效异常。\n\nWinRT 对本书后续介绍的 C# 代码特性还有其他要求。这些要求将在描述每个特性时进行突出显示。\n\n***\n\
  \n## 总结\n\n在本章中，你学习了如何定义和实现接口以及抽象类。下表总结了在为接口、类和结构体定义方法时，各种有效（是）和无效（否）的关键字组合。\n\n\
  ![Image](img/Image00106.jpg)\n\n如果你想继续下一章节，请保持 Visual Studio 2015 运行并转到第 14 章。\n\
  \n![Image](img/Image00001.jpg) 如果你现在想退出 Visual Studio 2015，请在“文件”菜单上点击“退出”。如果你看到“保存”对话框，请点击“是”并保存项目。\n\
  \n## 快速参考\n\n![Image](img/Image00107.jpg)\n\n## 第 14 章. 使用垃圾回收和资源管理\n\n完成本章后，你将能够：\n\
  \n- 使用垃圾回收管理系统资源。\n- 编写在对象销毁时运行的代码。\n- 通过编写 `try` `finally` 语句，以异常安全的方式在已知时间释放资源。\n\
  - 通过编写 `using` 语句，以异常安全的方式在已知时间释放资源。\n- 实现 `IDisposable` 接口以在类中支持异常安全的销毁。\n\n你已经在早的章节中看到过如何创建变量和对象，并且应该理解在创建变量和对象时内存是如何分配的。（如果你不记得了，值类型创建在栈栈上，而引用类型则从堆上分配内存。）计算机的内存不是无限的，因此当变量或对象不再需要内存时，必须回收这些内存。值类型在超出作用域时会被销毁，其内存会被回收。这是简单部分。那么引用类型呢？你通过\
  \ `new` 关键字创建对象，但对象是如何以及何时被销毁的？这就是本章要讨论的核心。\n\n## 对象的生命周期\n\n首先，让我们回顾一下创建对象时发生了什么。\n\
  \n你通过使用 `new` 操作符创建对象。下面的示例创建了第 13 章中讨论的“创建接口和定义抽象类”中 `Square` 类的新实例。\n\n点击此处查看代码图片\n\
  \n```csharp\nint sizeOfSquare = 99;\nSquare mySquare = new Square(sizeOfSquare);\
  \ // Square 是引用类型\n```\n\n从你的角度来看，`new` 操作是一个单一步骤，但在底层，对象的创建实际上是一个两个阶段的过程：\n\n1.\
  \ `new` 操作从堆上分配一块 `raw`（原始）内存。你无法控制对象创建的这一阶段。\n2. `new` 操作将这块原始内存转换为对象；它必须初始化对象。你可以通过使用构造函数来控制这一阶段。\n\
  \n***\n\n![Image](img/Image00005.jpg) 注意\n\n如果你是 C++ 程序员，你应该注意，在 C# 中，你不能重载 `new`\
  \ 操作来控制分配。\n\n***\n\n在创建对象后，你可以使用点运算符（.）访问它的成员。例如，`Square` 类包含一个名为 `Draw` 的方法，你可以调用它：\n\
  \n```csharp\nmySquare.Draw();\n```\n\n***\n\n![Image](img/Image00005.jpg) 注意\n\n\
  此代码基于继承自 `Shape` 的 `Square` 类，且没有实现 `IDisposable`。更多信息请参阅 13 章。\n\n***\n\n当 `mySquare`\
  \ 变量超出作用域时，该对象不再被活动引用。此时，该对象就可以被销毁，它使用的内存也可以被回收。（这可能不会立即发生，正如你稍将看到的。）和对象创建一样，销毁也是两个阶段的过程。\n\
  \n1. 公用语言运行时（CLR）必须执行一些清理工作。你可以通过编写析构函数来控制此操作。\n2. CLR 必须将之前属于对象的内存返回给堆。你无法控制这一阶段。\n\
  \n销毁对象并将内存返回堆的过程被称为 `garbage collection`（垃圾回收）。\n\n***\n\n![Image](img/Image00005.jpg)\
  \ 注意\n\n如果你用 C++ 编程，请记住 C# 没有 `delete` 运算符。CLR 控制对象何时被销毁。\n\n***\n\n## 编写析构函数\n\n\
  你可以使用析构函数来执行对象被垃圾回收时所需的任何清理工作。CLR 会自动清理对象所使用的任何托管资源，因此在许多此类情况下，编写析构函数是不必要的。然而，如果一个托管资源很大（例如多维数组），那么通过将对象对该资源的任何引用设置为\
  \ `null`，使该资源可以被立即销毁可能是有意义的。此外，如果对象直接或间接地引用了非托管资源，析构函数可能被证明有用。\n\n***\n\n![Image](img/Image00005.jpg)\
  \ 注意\n\n间接非托管资源相当常见。包括文件流、网络连接、数据库连接以及由 Windows 管理的其他资源。例如，如果你在方法中打开了一个文件，你可能想添加一个析构函数在对象销毁时关闭文件。然而，取决于类中代码的结构，可能有更好、更及时关闭文件的方法。（参见本章稍后对\
  \ `using` 语句的讨论。）\n\n***\n\n析构函数是一种特殊方法，类似于构造函数，区别在于 CLR 在对象引用消失后调用它。编写析构函数的语法是一个波浪号（~）后跟类名。例如，这里有一个简单的类，在构造函数中打开文件进行读取，并在析构函数中关闭文件。（注意，这只是一个示例，我不建议你总是遵循这种打开和关闭文件的模式。）\n\
  \n```csharp\nclass FileProcessor\n{\n    FileStream file = null;\n}\n```\n\n\n\n\
  \n\n```csharp\npublic FileProcessor(string fileName)\n{\n    this.file = File.OpenRead(fileName);\
  \ // 打开文件进行读取\n}\n\n~FileProcessor()\n{\n    this.file.Close(); // 关闭文件\n}\n```\n\
  \n析构函数存在一些非常重要的限制：\n\n![Image](img/Image00001.jpg) 析构函数仅适用于引用类型；你不能在值类型（例如 `struct`）中声明析构函数。\n\
  \n点击此处查看代码图像\n\n```csharp\nstruct MyStruct\n{\n    ~MyStruct() { ... } // 编译错误\n\
  }\n```\n\n![Image](img/Image00001.jpg) 你不能为析构函数指定访问修饰符（例如 `public`）。你永远不会在自己的代码中调用析构函数；CLR\
  \ 中一个称为 `garbage collector`（垃圾回收器）的部分会为你完成这项工作。\n\n点击此处查看代码图像\n\n```csharp\npublic\
  \ ~FileProcessor() { ... } // 编译错误\n```\n\n![Image](img/Image00001.jpg) 析构函数不能接受任何参数。同样，这是因为你永远不会自己调用析构函数。\n\
  \n点击此处查看代码图像\n\n```csharp\n~FileProcessor(int parameter) { ... } // 编译错误\n```\n\n\
  在内部，C# 编译器会自动将析构函数翻译为对 `Object.Finalize` 方法的重写。编译器将此析构函数\n\n点击此处查看代码图像\n\n```csharp\n\
  class FileProcessor\n{\n    ~FileProcessor() { // 你的代码写在这里 }\n}\n```\n\n转换为如下内容：\n\
  \n点击此处查看代码图像\n\n```csharp\nclass FileProcessor\n{\n    protected override void Finalize()\n\
  \    {\n        try { // 你的代码写在这里 }\n        finally { base.Finalize(); }\n    }\n\
  }\n```\n\n编译器生成的 `Finalize` 方法在 `try` 块中包含析构函数体，随后是一个调用基类中 `Finalize` 方法的 `finally`\
  \ 块。（`try` 和 `finally` 关键字在第 6 章“管理错误和异常](#text00011.html_ch06)”中有所描述。）这确保了即使在执行析构函数代码期间发生异常，析构函数始终调用其基类析构函数。\n\
  \n重要的是，只有编译器可以进行这种翻译。你不能编写自己的方法来重写 `Finalize`，也无法自己调用 `Finalize`。\n\n## 为什么要使用垃圾回收器？\n\
  \n你永远无法通过 C# 代码自己销毁对象。没有没有语法可以做到。相反，CLR 会在它选择的时间为你完成这项工作。此外，请记住，你还可以让多个引用变量指向同一个对象。在下面的代码示例中，变量\
  \ `myFp` 和 `referenceToMyFp` 指向同一个 `FileProcessor` 对象：\n\n点击此处查看代码图像\n\n```csharp\n\
  FileProcessor myFp = new FileProcessor();\nFileProcessor referenceToMyFp = myFp;\n\
  ```\n\n你可以为一个对象创建多少个引用？随你所欲！但这种缺乏限制对对象的生命周期有影响。CLR 必须跟踪所有这些引用。如果变量 `myFp` 消失（超出范围），其他变量（如\
  \ `referenceToMyFp`）可能仍然存在，此时 `FileProcessor` 对象使用的资源无法被回收（文件不应被关闭）。因此，对象的生命周期不能绑定到特定的引用变量。只有当指向该对象的*所有*引用都消失时，对象才能被销毁，其内存才能释放供重用。\n\
  \n你可以看到管理对象的生命周期是复杂的，这就是为什么 C# 的设计者决定防止你的代码承担这项责任。如果销毁对象是你的责任，早晚会发生以下情况之一：\n\n![Image](img/Image00001.jpg)\
  \ 你会忘记销毁对象。这意味着对象的析构函数（如果有的话）将不会运行，清理工作不会发生，内存也不会返回堆。你可能会很容易地耗尽内存。\n\n![Image](img/Image00001.jpg)\
  \ 你会尝试销毁一个活动对象，并可能导致一个或多个变量持有指向已销毁对象的引用，这被称为 `dangling reference`（悬空引用）。悬空引用指向未使用的内存，也可能指向现在恰好占用同一块内存的完全不同的对象。无论何种，使用悬空引用的结果最好是未定义的，最坏的情况下是安全风险。一切将失去控制。\n\
  \n![Image](img/Image00001.jpg) 你会尝试多次销毁同一个对象。这可能是灾难性的，也可能不是，取决于析构函数中的代码。\n\n这些问题在像\
  \ C# 这样这样的语言中是不可接受的，这种语言将健壮性和安全性放在设计目标的高位。相反，垃圾回收器会为你销毁对象。垃圾回收器做出了以下保证：\n\n![Image](img/Image00001.jpg)\
  \ 每个对象都会被销毁，并且析构函数会被执行。当程序结束时，所有对象都将销毁。\n\n![Image](img/Image00001.jpg) 每个对象只会被销毁一次。\n\
  \n![Image](img/Image00001.jpg) 每个对象只有在变得不可达时才会被销毁——即在运行应用程序的进程中没有指向该对象的引用。\n\n这些保证非常有用，它们将你（程序员）从容易出错的家务工作中解放出来。它们让你能够专注于程序的逻辑本身并提高效率。\n\
  \n垃圾回收何时发生？这听起来像个奇怪的问题。毕竟，垃圾回收应该在对象不再被需要时发生吗？是的，但并不立即发生。垃圾回收是一个昂贵的过程，所以 CLR 只在需要时收集垃圾（例如当可用内存开始不足或堆的大小超过系统定义的阈值时），然后尽可能收集。进行几次大清理比进行多次小扫要高效得多。\n\
  \n***\n\n![Image](img/Image00005.jpg) Note\n\n你可以通过调用 `System` 命名空间 `GC` 类的静态方法\
  \ `Collect` 在程序调用垃圾回收器。然而，除了少数情况外，不建议这样做。`GC.Collect` 方法启动垃圾回收器，但该过程是异步运行的——该方法在垃圾回收完成之前返回，因此你仍然不知道对象是否已被销毁。让\
  \ CLR 决定何时收集垃圾最佳。\n\n***\n\n垃圾回收器的一个特性是，你不知道也不应该依赖对象被销毁的顺序。最后一点需要理解的可能是最重要的：析构函数直到对象被垃圾回收时才会运行。如果你写了一个析构函数，你知道它会被执行，但你不知道何时执行。因此，你永远不要编写依赖于析构函数按特定顺序或在特定点运行的代码。\n\
  \n\n\n\n垃圾回收器是一个复杂的软件，它具有自我调优功能，并实现了许多优化，试图在保持内存可用性与维持应用程序性能的需求之间取得平衡。垃圾回收器使用的内部算法和结构的细节超出了本书的范围（而且微软不断改进垃圾回收器执行工作的方式），但从高层来说，垃圾回收器采取的步骤如下：\n\
  \n1. 它构建一个所有可达对象的映射。它通过反复跟踪对象内部的引用字段来实现。垃圾回收器非常小心地构建此映射，并确保循环引用不会导致无限递归。任何`不在`此映射中的对象都被认为是不可达的。\n\
  \n2. 它检查任何不可达对象是否有需要运行的析构函数（此过程称为 `finalization`，终化）。任何需要终化的不可达对象都会被放入一个名为 `freachable\
  \ queue`（读作“F-reachable”）的特殊队列中。\n\n3. 它通过将`reachable` 对象移动到堆底部来释放剩余的不可达对象（那些不需要终化的对象），从而整理碎片并释放堆顶部的内存。当垃圾回收器移动可达对象时，它还会更新对该对象的任何引用。\n\
  \n4. 此时，它允许其他线程恢复运行。\n\n5. 它通过在自己的线程上运行 `Finalize` 方法来终化需要终化的不可达对象（现在位于 `freachable`\
  \ 队列中）。\n\n## 建议\n\n编写包含析构函数的类会增加代码和垃圾回收过程的复杂性，并使你的程序运行变慢。如果你的程序不包含任何析构函数，垃圾回收器就不需要将不可达对象放入\
  \ `freachable queue` 并对其进行终化。显然，不不做某事比做某事要快。因此，除非真的需要，否则尽量避免使用析构函数——仅将其用于回收未托管资源。（你可以考虑使用\
  \ `using` 语句，这将在本章稍后的部分进行描述。）\n\n编写析构函数时需要非常小心。特别要注意，如果你的析构函数调用了其他对象，那些其他对象的析构函数可能已经被垃圾回收器调用过了。记住，终化的顺序是不保证的。因此，确保析构函数之间互不依赖或不重叠——例如，不要让两个析构函数尝试释放同一个资源。\n\
  \n## 资源管理\n\n有时在析构函数中释放资源是不明智的；某些资源太宝贵了，不能就放在那里等待任意长度的时间直到垃圾回收器实际释放它们。内存、数据库连接或文件句柄等稀缺资源需要释放，而且需要尽快释放。在这些情况下，你唯一的选择是自己释放资源。你可以通过创建一个\
  \ `disposal method`（释放方法）来实现这一点——一个显式释放资源的方法。如果一个类具有释放方法，你可以调用它并控制资源释放的时机。\n\n***\n\
  \n![Image](img/Image00005.jpg) 注意\n\n`disposal method` 术语指的是方法的目的而不是其名称。释放方法可以使用任何有效的\
  \ C# 标识符命名。\n\n***\n\n## 释放方法\n\n实现释放方法的类示例是来自 `System.IO` 命名空间的的 `TextReader` 类。该类提供了一种从顺序输入流中读取字符的机制。`TextReader`\
  \ 类包含一个名为 `Close` 的虚拟方法，用于关闭流。`StreamReader` 类（从流，如打开的文件，中读取字符）和 `StringReader`\
  \ 类（从字符串中读取字符）都派生自 `TextReader`，并且都重写了 `Close` 方法。以下是一个使用 `StreamReader` 类从文件读取文本行并在屏幕上显示它们的示例：\n\
  \n点击此处查看代码图像\n\n```\nTextReader reader = new StreamReader(filename);\n\nstring line;\n\
  \nwhile ((line = reader.ReadLine()) != null)\n{\n    Console.WriteLine(line);\n\
  }\n\nreader.Close();\n```\n\n`ReadLine` 方法从流中读取下一行文本到字符串中。如果流中没有剩余内容，`ReadLine`\
  \ 方法将返回 `null`。在完成对 `reader`的操作后调用 `Close` 以释放文件句柄和相关资源是非常重要的。然而，这个示例存在一个问题：它不是异常安全的。如果调用\
  \ `ReadLine` 或 `WriteLine` 抛出异常，则 `Close` 的调用将发生；它会被跳过。如果这种情况发生得足够，你将耗尽文件句柄并无法打开任何更多文件。\n\
  \n## 异常安全的释放\n\n确保释放方法（如 `Close`）无论是否发生异常都能被调用的一种方法是在 `finally` 块中调用释放方法。以下是使用此技术编写的前述示例：\n\
  \n点击此处查看代码图像\n\n```\nTextReader reader = new StreamReader(filename);\n\ntry\n{\n\
  \    string line;\n    while ((line = reader.ReadLine()) != null)\n    {\n     \
  \   Console.WriteLine(line);\n    }\n}\nfinally\n{\n    reader.Close();\n}\n```\n\
  \n像这样使用 `finally` 块是有效的，但它有几个缺点，使其成为一个不理想的解决方案：\n\n![Image](img/Image00001.jpg)\
  \ 如果你必须释放多个资源，它会迅速变得难以处理。（你会得到嵌套的 `try` 和 `finally` 块。）\n\n![Image](img/Image00001.jpg)\
  \ 在某些情况下，你可能需要修改代码以适应这种习惯。（例如，你可能需要重新调整资源的声明，初始化为 `null`，并在 `finally` 块中检查它是否为 `null`。）\n\
  \n![Image](img/Image00001.jpg) 它未能创建一个抽象。这意味着你在任何需要此功能的地方都必须重复代码。\n\n![Image](img/Image00001.jpg)\
  \ 资源的引用在 `finally` 块之后仍然有效。这意味着你可以无意中尝试使用已经释放的资源。\n\n`using` 语句旨在解决所有这些问题。\n\n##\
  \ `using` 语句与 `IDisposable` 接口\n\n`using` 语句提供了控制资源生命周期的清晰机制。你可以创建一个对象，该对象在 `using`\
  \ 语句结束时会被销。\n\n***\n\n![Image](img/Image00004.jpg) 重要\n\n不要将本节所示的 `using` 语句与引入命名空间的\
  \ `using` 指混淆。同一个关键词具有两个含义是很遗憾的。\n\n***\n\n`using` 语句的语法如下：\n\n点击此处查看代码图像\n\n```\n\
  using ( type variable = initialization )\n{\n    StatementBlock\n}\n```\n\n以下是确保你的代码始终对\
  \ `TextReader` 调用 `Close` 的最佳方法：\n\n点击此处查看代码图像\n\n```\nusing (TextReader reader\
  \ = new StreamReader(filename))\n{\n    string line;\n    while ((line = reader.ReadLine())\
  \ != null)\n    {\n        Console.WriteLine(line);\n    }\n}\n```\n\n此 `using`\
  \ 语句完全等同于以下变换：\n\n点击此处查看代码图像\n\n```\n{\n    TextReader reader = new StreamReader(filename);\n\
  \    try\n    {\n        string line;\n        while ((line = reader.ReadLine())\
  \ != null)\n        {\n            Console.WriteLine(line);\n        }\n    }\n\
  \    finally\n    {\n        if (reader != null)\n        {\n            ((IDisposable)reader).Dispose();\n\
  \        }\n    }\n}\n```\n\n\n\n\n`using` 语句引入了它自己的块用于作用域。这种安排意味着你在 `using` 语句中声明的变量在嵌入语句结束时会自动离开作用域，并且你不会意外地尝试访问已释放的资源。\n\
  \n***\n\n你在 `using` 语句中声明的变量必须是实现了 `IDisposable` 接口的类型。`IDisposable` 接口位于 `System`\
  \ 命名空间，并且仅包含一个名为 `Dispose` 的方法：\n\n```csharp\nnamespace System\n{\n\ninterface IDisposable\n\
  {\nvoid Dispose();\n}\n}\n```\n\n`Dispose` 方法的作用是释放对象使用的任何资源。恰好 `StreamReader` 类实现了\
  \ `IDisposable` 接口，并且它的 `Dispose` 方法调用了 `Close` 来关闭流。你可以使用 `using` 语句作为一种清洁、异常安全且健壮的方式来确保资源始终被释放。这种方法解决了手动\
  \ `try` /*finally* 解决方案中存在的所有问题。你现在有了一个可以执行以下操作的解决方案：\n\n![Image](img/Image00001.jpg)\
  \ 需要释放多个资源，它的扩展性良好。\n\n![Image](img/Image00001.jpg) 不扭曲程序代码逻辑。\n\n![Image](img/Image00001.jpg)\
  \ 抽象了问题并避免了重复。\n\n![Image](img/Image00001.jpg) 是健壮的。在 `using` 语句结束后，你无法意外引用在其中声明的变量（在此例中为\
  \ `reader`），因为它已经不在作用域内了——你会得到编译时错误。\n\n### 从析构函数中调用 Dispose 方法\n\n在编写自己的类时，你应该编写析构函数还是实现\
  \ `IDisposable` 接口，以便你的类实例可以被 `using` 语句管理？对析构函数的调用*会*发生，但你并不知道它何时发生。另一方面，你确切知道何时调用\
  \ `Dispose` 方法，但你无法确定它是否真的会发生，因为这取决于使用你类的程序员是否记得写 `using` 语句。然而，通过从析构函数调用它，可以确保\
  \ `Dispose` 方法始终运行。这充当了有用的备份。你可能会忘记调用 `Dispose` 方法，但至少可以确定它会被调用，即使只是在程序关闭时。你将在章节末尾的练习中详细研究这一功能，但这里有一个如何实现\
  \ `IDisposable` 接口的示例：\n\n点击此处查看代码图像\n\n```csharp\nclass Example : IDisposable\n\
  {\n\nprivate Resource scarce; // 需要管理和释放的稀缺资源\n\nprivate bool disposed = false;\
  \ // 用于指示资源是否\n// 已经释放\n\n...\n\n~Example()\n{\n\nthis.Dispose(false);\n}\n\npublic\
  \ virtual void Dispose()\n{\n\nthis.Dispose(true);\n\nGC.SuppressFinalize(this);\n\
  }\n\nprotected virtual void Dispose(bool disposing)\n{\n\nif (!this.disposed)\n\
  {\n\nif (disposing)\n{\n// 在处释放大型托管资源\n...\n}\n// 在处释放未托管资源\n...\nthis.disposed\
  \ = true;\n}\n}\n}\n\npublic void SomeBehavior() // 示例方法\n{\n\ncheckIfDisposed();\n\
  ...\n}\n\n...\n\nprivate void checkIfDisposed()\n{\n\nif (this.disposed)\n{\n\n\
  throw new ObjectDisposedException(\"Example: object has been disposed of\");\n}\n\
  }\n}\n```\n\n注意 `Example` 类的以下特征：\n\n![Image](img/Image00001.jpg) 该类实现了 `IDisposable`\
  \ 接口。\n\n![Image](img/Image00001.jpg) 公共 `Dispose` 方法可以被你的应用程序代码随时调用。\n\n![Image](img/Image00001.jpg)\
  \ 公共 `Dispose` 方法调用了接收布尔参数的受保护且重载的 `Dispose` 方法，并将值 `true` 作为参数传递。此方法实际上执行了资源释放。\n\
  \n![Image](img/Image00001.jpg) 析构函数调用了接收布尔参数的受保护且重载的 `Dispose` 方法，传递值 `false` 作为参数。析构函数仅在你的对象进行终结时由垃圾回收器调用。\n\
  \n![Image](img/Image00001.jpg) 你可以安全多次调用受保护的 `Dispose` 方法。变量 `disposed` 表示该方法是否已经运行，这是一项安全功能，防止该方法在并发调用时尝试多次释放资源。（你的应用程序可能会调用\
  \ `Dispose`，但在方法完成之前，你的对象可能会被垃圾回收，并且 CLR 会从析构函数再次运行 `Dispose` 方法。）资源只在方法第一次运行时释放。\n\
  \n![Image](img/Image00001.jpg) 受保护的 `Dispose` 方法支持释放托管资源（如大型数组）和未托管资源（如文件句柄）。如果\
  \ `disposing` 参数为真，则此方法一定是从公共 `Dispose` 方法调用的。在这种情况下，托管资源和未托管资源都将被释放。如果 `disposing`\
  \ 参数为假，则此方法一定是从析构函数调用的，垃圾回收器正在终结该对象。在这种情况下，没有必要（或异常安全）释放托管资源，因为它们已经由垃圾回收器处理过了，只需释放未托管资源。\n\
  \n![Image](img/Image00001.jpg) 公共 `Dispose` 方法调用了静态 `GC.SuppressFinalize` 方法。此方法阻止垃圾回收器调用该对象。\n\
  \n## 实现异常安全的释放\n\n在接下来的练习中，你将研究 `using` 语句如何帮助确保应用程序使用的资源可以及时释放，即使发生了异常异常。最初，你将实现一个带有析构函数的简单类，并观察垃圾回收何时调用该析构函数。\n\
  \n![Image](img/Image00005.jpg) 注意练习中的类仅用于说明垃圾收集的基本原理。该类没有实际消耗托管或未托管资源。你通常不会为这样的简单类创建析构函数或实现\
  \ `IDisposable` 接口。\n\n### 创建使用析构函数的简单类\n\n1. 如果尚未运行，启动 Visual Studio 2015。\n\n\
  2. 在 File 菜单上，指向 New，然后点击 Project。\n\n3. 在 New Project 对话框中，在左面板的 Templates 下点击\
  \ Visual C#。在中间面板选择 Console Application 模板。在对话框底部的 Name 框中输入 `GarbageCollectionDemo`。在\
  \ Location 字段中指定你的文档文件夹中的 Microsoft Press\\VCSBS\\Chapter14 ，然后点击 OK。\n\n![Image](img/Image00013.jpg)\
  \ 提示 使用 Location 字段旁边的 Browse 导航到 Microsoft Press\\VCSBS\\Chapter14 文件夹，而不是手动输入路径。\n\
  \nVisual Studio 创建一个新的控制台应用程序并在代码和文本编辑器中显示 Program.cs 文件。\n\n4. 在 Project 菜单上，点击\
  \ Add Class。\n\nAdd New Item – GarbageCollectionDemo 对话框打开。\n\n5. 在 Add New Item\
  \ – GarbageCollectionDemo 对话框中，确保选择了 Class 模板。在 Name 框中输入 `Calculator.cs`，然后点击 Add。\n\
  \n`Calculator` 类被创建并在代码和文本编辑器中显示。\n\n6. 在 `Calculator` 类中添加以下公共 `Divide` 方法（加粗所示）：\n\
  \n\n\n\n\n点击此处查看代码图像\n\n```csharp\nclass Calculator\n{\n    public int Divide(int\
  \ first, int second)\n    {\n        return first / second;\n    }\n}\n```\n\n这是一个非常直观的方法，它将第一个参数除以第二个参数并返回结果。提供它只是为了给应用程序添加一些可以被调用的功能。\n\
  \n**7.** 在 `Divide` 方法上方，在 `Calculator` 类的开头添加后续代码中**加粗**所示的公共构造函数：\n\n点击此处查看代码图像\n\
  \n```csharp\nclass Calculator\n{\n    public Calculator()\n    {\n        Console.WriteLine(\"\
  Calculator being created\");\n    }\n    ...\n}\n```\n\n此构造函数的目的是为了使你能够验证 `Calculator`\
  \ 对象是否已成功创建。\n\n**8.** 在 `Calculator` 类中，在构造函数之后添加后续代码中**加粗**所示的析构函数：\n\n点击此处查看代码图像\n\
  \n```csharp\nclass Calculator\n{\n    ...\n    ~Calculator()\n    {\n        Console.WriteLine(\"\
  Calculator being finalized\");\n    }\n    ...\n}\n```\n\n此析构函数仅显示一条消息，以便你可以看到垃圾回收器何时运行并终结此类的实例。在为实际应用程序编写类时，通常不会在析构函数中输出文本。\n\
  \n**9.** 在代码和文本编辑器窗口中显示 `Program.cs` 文件。\n\n**10.** 在 `Program` 类中在 `Main` 方法中添加以下**加粗**所示的语句：\n\
  \n点击此处查看代码图像\n\n```csharp\nstatic void Main(string[] args)\n{\n    Calculator calculator\
  \ = new Calculator();\n    Console.WriteLine($\"120 / 15 = {calculator.Divide(120,\
  \ 15)}\");\n    Console.WriteLine(\"Program finishing\");\n}\n```\n\n这段代码创建了一个 `Calculator`\
  \ 对象，调用该对象的 `Divide` 方法（并显示结果），然后在程序结束时输出一条消息。\n\n**11.** 在“调试”菜单上，点击“不调试启动”。验证程序显示了以下系列消息：\n\
  \n```\nCalculator being created\n120 / 15 = 8\nProgram finishing\nCalculator being\
  \ finalized\n```\n\n注意，`Calculator` 对象的终结器仅在应用程序即将结束时、在 `Main` 方法完成后运行。\n\n**12.**\
  \ 在控制台窗口中，按 Enter 键返回 Visual Studio 2015。\n\nCLR 保证由你的应用程序创建的所有对象都将接受垃圾回收，但你并不能总是确定这何时会发生。在练习中，该程序运行时间很短，当程序结束且\
  \ CLR 进行理理工作时，`Calculator` 对象就被终结了。然而，你可能也会发现，在某些消耗稀缺资源的更大型应用程序中情况也是如此，除非你采取了必要的步骤提供释放机制，否则你的应用程序创建的对象可能会保留其资源，直到应用程序结束。如果资源是文件，这可能会阻止其他用户访问该文件；如果资源是数据库连接，你的应用程序可能会阻止其他用户连接到同一个数据库。理想情况下，你希望在完成使用资源后立即释放它们，而不是等待应用程序终止。\n\
  \n在下一次练习中，你将在 `Calculator` 类中实现 `IDisposable` 接口，并允许程序在它选择的时间终结 `Calculator` 对象。\n\
  \n## 实现 IDisposable 接口\n\n**1.** 在代码和文本编辑器窗口中显示 `Calculator.cs` 文件。\n\n**2.** 修改\
  \ `Calculator` 类的定义，使其实现 `IDisposable` 接口，如下所示**加粗**所示：\n\n点击此处查看代码图像\n\n```csharp\n\
  class Calculator : IDisposable\n{\n    ...\n}\n```\n\n**3.** 在 `Calculator` 类末尾添加以下方法（命名为\
  \ `Dispose`）。该方法由 `IDisposable` 接口定义：\n\n点击此处查看代码图像\n\n```csharp\nclass Calculator\
  \ : IDisposable\n{\n    ...\n    public void Dispose()\n    {\n        Console.WriteLine(\"\
  Calculator being disposed\");\n    }\n}\n```\n\n你通常会在 `Dispose` 方法中添加代码来释放对象持有的资源。在这种情况下没有资源，该方法中\
  \ `Console.WriteLine` 语句的目的只是为了让你看到 `Dispose` 方法何时运行。然而，你可以看到，在实际应用程序中，析构函数和 `Dispose`\
  \ 方法之间可能会存在某些代码重复。为了消除这种重复，你通常会将这些代码放在一个地方，并从另一个地方调用它。但由于你无法在 `Dispose` 方法中显式地调用析构函数，因此更好的做法是从析构函数中调用\
  \ `Dispose` 方法，并将释放资源的逻辑放在 `Dispose` 方法中。\n\n**4.** 修改析构函数，使其调用 `Dispose` 方法，如下所示中**加粗**所示。（在终结器中保留显示消息的语句，以便你可以看到它何时运行）。\n\
  \n点击此处查看代码图像\n\n```csharp\n~Calculator()\n{\n    Console.WriteLine(\"Calculator\
  \ being finalized\");\n    this.Dispose();\n}\n```\n\n当你在应用程序中销毁 `Calculator` 对象时，`Dispose`\
  \ 方法不会运行；你必须显式地调用它，例如在 `using` 语句中，或者在垃圾回收器运行时运行。在你的程序将采用后者。\n\n**5.** 在代码和文本编辑器窗口中显示\
  \ `Program.cs` 文件。修改 `Main` 方法中创建 `Calculator` 对象的语句并调用 `Divide` 方法，如下所示**加粗**所示：\n\
  \n点击此处查看代码图像\n\n```csharp\nstatic void Main(string[] args)\n{\n    using (Calculator\
  \ calculator = new Calculator())\n    {\n        Console.WriteLine($\"120 / 15 =\
  \ {calculator.Divide(120, 15)}\");\n    }\n    Console.WriteLine(\"Program finishing\"\
  );\n}\n```\n\n**6.** 在“调试”菜单上，点击“不调试启动”。验证程序显示了以下系列消息：\n\n```\nCalculator being\
  \ created\n120 / 15 = 8\nCalculator being disposed\nProgram finishing\nCalculator\
  \ being finalized\nCalculator being disposed\n```\n\n`using` 语句在显示“Program finishing”的语句之前运行\
  \ `Dispose` 方法。然而，你可以看到当应用程序结束时，`Calculator` 对象的析构器仍然运行，并且它再次调用了 `Dispose` 方法。这显然是浪费资源。\n\
  \n**7.** 在控制台窗口中，按 Enter 键返回 Visual Studio 2015。\n\n多次释放对象持有的资源可能可能不是灾难性的，但绝对不是好的做法。解决此问题的推荐方法是在类中添加一个私有字段以指示\
  \ `Dispose` 方法是否已被调用，然后在 `Dispose` 方法中检查该字段。\n\n## 防止对象被多次释放\n\n**1.** 在代码和文本编辑器窗口中显示\
  \ `Calculator.cs` 文件。\n\n**2.** 在 `Calculator` 类中添加一个名为 `disposed` 的私有布尔字段，并将该字段的值初始化为\
  \ `false`，如下文所示**加粗**所示：\n\n点击此处查看代码图像\n\n```csharp\nclass Calculator : IDisposable\n\
  {\n    private bool disposed = false;\n    ...\n}\n```\n\n此字段的目的是跟踪对象的状态，并指示 `Dispose`\
  \ 方法是否已被调用。\n\n**3.** 修改 `Dispose` 方法中的代码，仅当 `disposed` 字段为假时显示消息。在显示消息后，将 `disposed`\
  \ 字段设置为真，如下所示**加粗**所示：\n\n点击此处查看代码图像\n\n```csharp\npublic void Dispose()\n{\n  \
  \  if (!this.disposed)\n    {\n        Console.WriteLine(\"Calculator being disposed\"\
  );\n    }\n    this.disposed = true;\n}\n```\n\n\n\n\n\n```csharp\nthis.disposed\
  \ = true;\n\n}\n```\n\n 4. 在“调试”（Debug）菜单上，点击“不调试启动”（Start Without Debugging）。注意程序显示了以下系列消息：\n\
  \nCalculator being created\n120 / 15 = 8\nCalculator being disposed\nProgram finishing\n\
  Calculator being finalized\n\n`Calculator` 对象现在只被丢弃一次，但析构函数仍在运行。同样，这是一种浪费；对于一个已经释放了资源的对象，运行析构函数没有意义。\n\
  \n#### 5. 在控制窗口中，按回车键（Enter）返回 Visual Studio 2015。\n\n#### 6. 在 `Calculator` 类中，在\
  \ `Dispose` 方法的末尾添加此处**粗体**所示语句：\n\n点击此处查看代码图像\n\n```csharp\npublic void Dispose()\n\
  {\n    if (!this.disposed)\n    {\n        Console.WriteLine(\"Calculator being\
  \ disposed\");\n    }\n    this.disposed = true;\n    GC.SuppressFinalize(this);\n\
  }\n```\n\n`GC` 类提供了对垃圾回收器的访问，并实现了几个静态方法，你可以通过这些方法控制它执行的一些操作。使用 `SuppressFinalize`\
  \ 方法，你可以指示垃圾回收器不要对指定对象执行终结（finalization），这可以防止析构函数的运行。\n\n***\n\n![Image](img/Image00004.jpg)\
  \ 重要\n\n`GC` 类暴露了许多方法，你可以通过这些方法配置垃圾回收器。然而，通常让 CLR 自己管理垃圾回收器更好，因为如果你不加考虑地调用这些方法，可能会严重损害应用程序的性能。你应该以极其谨慎的态度对待\
  \ `SuppressFinalize` 方法，因为如果你未能释放一个对象，就会面临丢失数据的风险（例如，如果你未能正确关闭文件，内存中缓冲但尚未写入磁盘的任何数据都可能会丢失）。仅在像本练习所示的情况下调用此方法，即当你确定一个对象已经被丢弃时。\n\
  \n***\n\n#### 7. 在“调试”（Debug）菜单上，点击“不调试启动”。注意程序显示了以下系列消息：\n\nCalculator being created\n\
  120 / 15 = 8\nCalculator being disposed\nProgram finishing\n\n你可以看到析构函数不再运行了，因为\
  \ `Calculator` 对象在程序结束之前已经被释放了。\n\n#### 8. 在控制窗口中，按回车键（Enter）返回 Visual Studio 2015。\n\
  \n***\n\n## 线程安全与 `Dispose` 方法\n\n使用 `disposed` 字段防止对象被多次丢弃的示例在大多数情况下运行良好良好，但请记住，你无法控制终结函数的何时运行。在本章的练习中，它总是在程序结束时执行，但情况并不总是如此的——它可以在对象的最后一个引用消失后的任何时间运行。因此，在正在运行\
  \ `Dispose` 方法时，垃圾回收器可能会在它自己的线程上实际上被调用了终结函数，特别是当 `Dispose` 方法需要执行大量工作时。你可以通过将设置\
  \ `disposed` 字段置为 `true` 的语句移动到靠近 `Dispose` 方法的开头，来减少资源被多次释放的可能性，但在这种情况下，如果你在设置该变量之后释放资源之前发生了异常，你将面临完全没有释放资源的风险。\n\
  \n为了完全消除两个并发线程同时释放同一个对象中相同资源的可能性，你可以通过将代码嵌入 C# 的 `lock` 语句中以线程安全的方式编写代码，如下：\n\n\
  点击此处查看代码图像\n\n```csharp\npublic void Dispose()\n{\n    lock(this)\n    {\n     \
  \   if (!disposed)\n        {\n            Console.WriteLine(\"Calculator being\
  \ disposed\");\n        }\n        this.disposed = true;\n        GC.SuppressFinalize(this);\n\
  \    }\n}\n```\n\n`lock` 语句的目的是防止同一块代码在不同的线程上同时运行。`lock` 语句的参数（在上述例中的 `this`）应该是对对象的引用。大括号之间的代码定义了\
  \ `lock` 语句的作用范围。当执行到 `lock` 语句时，如果指定的对象当前被锁定，请求锁的线程将被阻塞，代码在此处暂停。当当前持有锁的线程到达 `lock`\
  \ 语句的结束大括号时，锁会被释放，使被阻塞的线程能够获取锁并继续执行。然而，当这种情况发生时，`disposed` 字段已经被设置为 `true`，因此第二个线程将不会尝试执行\
  \ `if (!disposed)` 块中的代码。\n\n以此方式使用锁是安全的，但它可能会损害性能。另一种方法是使用本章稍早时候描述的策略，即只对托管资源的重复释放进行抑制。（多次释放托管资源不是异常安全的；你不会危及计算机的安全性，但如果你尝试释放一个不再存在的托管对象，可能会影响应用程序的逻辑完整性。）这种策略实现了\
  \ `Dispose` 方法的重载版本；`using` 语句调用 `Dispose()`，后者反过来运行 `Dispose(true)` 语句，而析构函数调用\
  \ `Dispose(false)`。只有当 `Dispose` 方法重载版本的参数为 `true` 时，托管资源才会释放。有关更多信息，请参阅“从析构函数调用\
  \ dispose 方法”部分。\n\n***\n\n## 验证异常发生后对象被释放\n\n`using` 语句的目的是即使发生异常也能确保对象被释放。在本章的最后一个练习中，你将通过生成异常来验证这一点。\n\
  \n**1.** 在代码和编辑器窗口中显示 `Program.cs` 文件。\n\n**2.** 如下**粗体**所示修改 `Calculator` 对象的 `Divide`\
  \ 方法调用：\n\n点击此处查看代码图像\n\n```csharp\nstatic void Main(string[] args)\n{\n    using\
  \ (Calculator calculator = new Calculator())\n    {\n        Console.WriteLine($\"\
  120 / 0 = {calculator.Divide(120, 0)}\");\n    }\n    Console.WriteLine(\"Program\
  \ finishing\");\n}\n```\n\n修改后的语句尝试将 120 除以 0。\n\n**3.** 在“调试”（Debug）菜单上，点击“不调试启动”。\n\
  \n正如你预期的，应用程序抛出了未处理的 `DivideByZeroException` 异常。\n\n**4.** 在 `GarbageCollection`\
  \ 对话框中，点击“取消”（需要在调试和关闭按钮出现之前这样做。）\n\n![Image](img/Image00108.jpg)\n\n**5.** 验证控制窗口在未处理的异常后出现了“Calculator\
  \ being disposed”的消息。\n\n![Image](img/Image00109.jpg)\n\n***\n\n![Image](img/Image00005.jpg)\
  \ 注意\n\n如果你太慢了，调试和关闭按钮已经出现，请点击“关闭程序”并再次不调试运行应用程序。\n\n***\n\n**6.** 在控制窗口中，按回车键（Enter）返回\
  \ Visual Studio 2015。\n\n## 总结\n\n在本章中，你了解了垃圾回收器的工作原理以及 .NET 框架如何使用它释放对象并回收内存。你学习了如何编写析构函数以便垃圾回收器回收内存时清理对象使用的资源。你还学习了如何使用\
  \ `using` 语句来实现异常安全的资源释放，以及如何实现 `IDisposable` 接口以便这种形式的对象释放。\n\n![Image](img/Image00001.jpg)\
