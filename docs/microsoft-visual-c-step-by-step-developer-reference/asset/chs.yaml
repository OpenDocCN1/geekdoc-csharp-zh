  \ 文件。\n\n**4.** 为 `Complex` 类添加自动整数属性 `Real` 和 `Imaginary`，如其后文的**加粗**代码所示。\n\n\
  点击此处查看代码图像\n\n```csharp\nclass Complex\n{\n\npublic int Real { get; set; }\n\npublic\
