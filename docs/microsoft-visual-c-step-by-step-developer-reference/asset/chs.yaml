  James\n\nCustomers:\nJohn\nSid\nHarry\nDiana\nFrancesca\n\nCustomers who are employees:\n\
  John\nHarry\n\n***\n\n### 使用集合初始化器\n\n前面的小节展示了如何使用适用于集合的方法添加单个元素（`List<T>` 集合使用\
  \ `Add`，`Queue<T>` 集合使用 `Enqueue`，`Stack<T>` 集合使用 `Push` 等）。你也可以在声明时使用类似于数组的语法初始化集合。例如，以下语句创建并初始化了\
  \ `numbers` `List<int>`：\n\n```csharp\nList<int> numbers = new List<int>{10, 9,\
  \ 8, 7, 7, 6, 5, 10, 4, 3, 2, 1};\n```\n\n内部，C# 编译器将此初始化转换为一系列对 `Add` 方法的调用。因此，你只能对支持\
  \ `Add` 方法的集合使用这种语法（`Stack<T>` 和 `Queue<T>` 类不支持）。\n\n对于键键值对的复杂集合，例如 `Dictionary<TKey,\
  \ TValue>` 类，你可以使用索引表示法为每个键指定值，如下所示：\n\n```csharp\nDictionary<string, int> ages\
  \ = new Dictionary<string, int>()\n{\n    [\"John\"] = 51,\n    [\"Diana\"] = 50,\n\
  \    [\"James\"] = 23,\n    [\"Francesca\"] = 21\n};\n```\n\n如果你喜欢，你也可以在初始化列表中将每个键/值对指定为匿名类型，如下所示：\n\
  \n```csharp\nDictionary<string, int> ages = new Dictionary<string, int>()\n{\n \
  \   {\"John\", 51},\n    {\"Diana\", 50},\n    {\"James\", 23},\n    {\"Francesca\"\
  , 21}\n};\n```\n\n在这种情况下，每个对中的第一个项是键，第二个是值。为了使代码尽可能可读，我建议在初始化字典类型时尽可能使用索引表示法。\n\n\
  ### *Find* 方法、谓词和 Lambda 表达式\n\n\n\n\n使用面向字典的集合（`Dictionary<TKey, TValue>`、`SortedDictionary<TKey,\
  \ TValue>` 和 `SortedList<TKey, TValue>`），你可以通过指定要搜索的键来快速查找值，并且如你在前面的示例所示，你可以使用数组表示法来访问该值。其他支持非键随机访问的集合（例如\
  \ `List<T>` 和 `LinkedList<T>` 类）不支持数组表示法，而是提供 `Find` 方法来定位项目。对于这些类，`Find` 方法的参数是一个谓词，它用于指定要使用的搜索准则。谓词的形式是一个方法，该方法检查集合中的每个项并返回一个指示该项是否匹配的\
  \ `Boolean` 值。在 `Find` 方法的情况下，一旦找到第一个匹配项，就会返回相应的项。请注意，`List<T>` 和 `LinkedList<T>`\
  \ 类还支持其他方法，例如 `FindLast`（它返回最后一个匹配的对象），而 `List<T>` 类还额外提供了 `FindAll` 方法，该方法返回包含所有匹配对象的\
  \ `List<T>` 集合。\n\n指定谓词最简单的方法是使用 `lambda 表达式`（lambda expression）。lambda 表达式是一个返回方法的表达式。这听起来相当奇怪，因为你到目前为止在\
  \ C# 中遇到的大多数表达式实际上返回一个值。如果你熟悉 Haskell 等函数式编程语言，你可能对这个概念非常熟悉。如果不熟悉，不要担心：lambda 表达式并不特别复杂，在你习惯了这种新语法之后，你会发现它们非常有用。\n\
  \n***\n\n![Image](img/Image00005.jpg) 注意\n\n如果你对了解更多关于 Haskell 的函数式编程感兴趣，请访问 Haskell\
  \ 编程语言网站：`[`www.haskell.org/haskellwiki/Haskell`](http://www.haskell.org/haskellwiki/Haskell)`。\n\
  \n***\n\n第 3 章，“编写方法和应用作用域”] 解释了典型的一个方法由四个元素组成：返回类型、方法名、参数列表和方法体。lambda 表达式包含这些元素中的两个：参数列表和方法体。lambda\
  \ 表达式不定义方法名，且返回类型（如果有）是从 lambda 表达式使用的上下文推断出来的。在 `Find` 方法的情况下，谓词逐个处理集合中的每个项；谓词体必须检查该项并根据其是否匹配搜索准则返回\
  \ true 或 false。接下来的示例显示了 `List<Person>` 集合上的 **`Find`** 方法（用粗体标记），其中 `Person` 是一个结构体。`Find`\
  \ 方法返回列表中 `ID` 属性设置为 3 的第一个项：\n\n点击此处查看代码图像\n\n```csharp\nstruct Person\n{\n   \
  \ public int ID { get; set; }\n    public string Name { get; set; }\n    public\
  \ int Age { get; set; }\n}\n\n// 创建并填充人员列表\nList<Person> personnel = new List<Person>()\n\
  {\n    new Person() { ID = 1, Name = \"John\", Age = 51 },\n    new Person() { ID\
  \ = 2, Name = \"Sid\", Age = 28 },\n    new Person() { ID = 3, Name = \"Fred\",\
  \ Age = 34 },\n    new Person() { ID = 4, Name = \"Paul\", Age = 22 },\n};\n\n//\
  \ 查找列表中 ID 为 3 的成员\nPerson match = personnel.Find((Person p) => { return p.ID ==\
  \ 3; });\nConsole.WriteLine($\"ID: {match.ID}\\nName: {match.Name}\\nAge: {match.Age}\"\
  );\n```\n\n以下是此代码生成的输出：\nID: 3\nName: Fred\nAge: 34\n\n在调用 `Find` 方法时，参数 `(Person\
  \ p) => { return p.ID == 3; }` 是一个实际执行工作的 lambda 表达式。它具有以下语法项：\n\n![Image](img/Image00001.jpg)\
  \ 用圆括号括起来的参数列表。与普通方法一样，如果你定义的方法（如前面的示例所示）没有参数，你仍然必须提供圆括号。在 `Find` 方法的情况下，谓词逐个接收集合中的每个项，该项将作为参数传递给\
  \ lambda 表达式。\n\n![Image](img/Image00001.jpg) `=>` 运算符，它告诉 C# 编译器这是一个 lambda 表达式。\n\
  \n![Image](img/Image00001.jpg) 方法体。此处显示的示例非常简单，包含一个返回 Boolean 值的语句，指示参数中指定的项是否匹配搜索准则。然而，lambda\
  \ 表达式可以包含多个语句，你可以以你认为最具可读性的任何方式对其进行格式化。只需记住在每个语句后添加分号，就像在普通方法中一样。\n\n***\n\n![Image](img/Image00004.jpg)\
  \ 重要\n\n你已经在 第 3 章 中看到过如何使用 `=>` 运算符来定义表达式体方法（expression-bodied methods）。令人困惑的是，这是\
  \ `=>` 运算符的一种重载用法。\n\n***\n\n严格来说，lambda 表达式体可以是包含多个语句的方法体，也可以是单个表达式。如果 lambda 表达式体只包含单个表达式，你可以省略大括号（但整个语句仍需要分号）。此外，如果表达式只有一个参数，你可以省略围绕参数的圆括号。在许多情况下，你可以根据调用\
  \ lambda 表达式的上下文省略参数类型。之前所示的 `Find` 语句的简化形式如下（更容易阅读和理解）：\n\n点击此处查看代码图像\n\n```csharp\n\
  Person match = personnel.Find(p => p.ID == 3);\n```\n\n### lambda 表达式的形式\n\nlambda\
  \ 表达式是非常强大的结构，随着你深入学习 C#你会越来越多地遇到它们。表达式本身可以有细微不同的形式。lambda 表达式最初是称为 `lambda 演算`\
  \ 的数学符号的一部分，它提供了一种描述函数的符号。（你可以将函数理解为返回值的方法。）尽管 C# 语言在实现 lambda 表达式时扩展了 lambda 演算的语法和语义，许多原始原理仍然适用。以下是\
  \ C# 中可用的 lambda 表达式形式示例：\n\n点击此处查看代码图像\n\n```csharp\nx => x * x // 返回参数平方的简单表达式；x\
  \ 的类型从上下文推断\n\nx => { return x ; } // 与前面的表达式相同，但使用 C# 语句块作为体而不是简单表达式\n\n(int x)\
  \ => x / 2 // 返回参数除以 2 的值的简单表达式；显式声明了参数 x 的类型\n\n() => folder.StopFolding(0) //\
  \ 调用方法；表达式没有参数；表达式可能返回或不返回返回值\n\n(x, y) => {x++; return x / y;} // 多个参数；编译器推断了参数类型；参数\
  \ x 按值传递，因此 ++ 操作的影响是局部的\n\n(ref int x, int y) => {x++; return x / y;} // 多个参数并带有显式类型；参数\
  \ x 按引用传递，因此 ++ 操作的影响是永久的\n```\n\n总结来说，这里你应该注意的 lambda 表达式特性：\n\n\n\n\n\n![Image](img/Image00001.jpg)\
  \ 如果 lambda 表达式带有参数，你需要在 `=>` 运算符左侧的括号中指定它们。你可以省略参数的类型，`C#` 编译器将根据 lambda 表达式的上下文推断它们的类型。如果你希望\
  \ lambda 表达式能够修改本地以外的值（通过使用 `ref` 关键字），可以按引用传递参数，但并不建议这样做。\n\n![Image](img/Image00001.jpg)\
  \ Lambda 表达式可以返回结果，但返回类型必须与相应的委托类型匹配。\n\n![Image](img/Image00001.jpg) Lambda 表达式的体可以是一个简单的表达式，也可以是一个由多个语句、方法调用、变量定义和其他代码项组成的\
  \ `C#` 块。\n\n![Image](img/Image00001.jpg) 在 lambda 表达式方法中定义的变量在方法执行结束时将超出作用范围。\n\
  \n![Image](img/Image00001.jpg) Lambda 表达式可以访问并修改 lambda 表达式定义时在作用范围内的 lambda 外部的所有变量。请务必小心使用此功能！\n\
  \n***\n\n## Lambda 表达式和匿名方法\n\nLambda 表达式在 `C#` 语言的 `3.0` 版本中引入。`C#` `2.0` 版本引入了匿名方法，它可以执行类似的任务，但没有那么灵活。引入匿名方法主要是为了让你可以在无需创建命名方法的情况下定义委托——你只需要提供方法体的定义来代替方法名，如下：\n\
  \n点击此处查看代码图像\n\n```\nthis.stopMachinery += delegate { folder.StopFolding(0); };\n\
  ```\n\n你也可以将匿名方法作为参数传递以代替委托，如下：\n\n点击此处查看代码图像\n\n```\ncontrol.Add(delegate { folder.StopFolding(0);\
  \ } );\n```\n\n注意，每当你引入匿名方法时，都必须以 `delegate` 关键字作为前缀。此外，所需的任何参数都应在 `delegate` 关键字后的括号中指定，如下例所示：\n\
  \n点击此处查看代码图像\n\n```\ncontrol.Add(delegate(int param1, string param2)\n{ /* 使用 param1\
  \ 和 param2 的代码 */ ... });\n```\n\nLambda 表达式比匿名方法提供了更简洁、更自然的语法，并且它们渗透到 `C#` 的许多高级特性中，正如你将在本书随后的章节中看到的那样。通常情况下，你应该在代码中使用\
  \ lambda 表达式而不是匿名方法。\n\n***\n\n## 比较数组和集合\n\n以下是数组和集合之间重要区别总结：\n\n![Image](img/Image00001.jpg)\
  \ 数组实例具有固定大小，不能增长或缩小。集合可以根据需要动态调整大小。\n\n![Image](img/Image00001.jpg) 数组可以有多个维度。集合是线性的。然而，集合中的项本身可以是集合，因此你可以通过“集合的集合”来模仿多维数组。\n\
  \n![Image](img/Image00001.jpg) 你通过索引在数组中存储和检索项。并不是所有集合都支持这一概念。例如，要在 `List<T>` 集合中存储一个项，你使用\
  \ `Add` 或 `Insert` 方法；要检索一个项，则使用 `Find` 方法。\n\n![Image](img/Image00001.jpg) 许多集合类提供\
  \ `ToArray` 方法，该方法创建并填充一个包含集合中项的数组。项被复制到数组中而不会从集合中移除。此外，这些集合还提供了构造函数，可以直接从数组填充集合。\n\
  \n### 使用集合类玩纸牌\n\n在下一个练习中，你将把第 10 章中开发的纸牌游戏改为使用集合而不是数组。\n\n#### 使用集合实现纸牌游戏\n\n**1.**\
