  \n![Image](img/Image00001.jpg) 使用 `ref` 和 `out` 关键字修改传递方法参数的方式。\n\n![Image](img/Image00001.jpg)\
  \ 使用装箱将值引用。\n\n![Image](img/Image00001.jpg) 使用拆箱和强制转换将引用转换为值。\n\n第 7 章，“创建管理类和对象”演示了如何声明自己的类以及如何使用\
  \ `new` 关键字创建对象。该章还展示了如何使用构造函数初始化对象。在本章中，你将学习原始类型（如 `int`、`double` 和 `char`）的特征与类类型之间的差异。\n\
  \n## 复制值类型变量和类\n\n\n\n\nC# 内置的大多数原始类型，例如 `int`、`float`、`double` 和 `char`（但不包括 `string`，原因稍后介绍），统称为`值类型`（value\
  \ types）。这些类型具有固定的大小，当你将一个变量声明为值类型时，编译器会生成代码，分配一个足够容纳对应值的内存块。例如，声明一个 `int` 变量会导致编译器分配\
  \ 4 字节（32 位）的内存来存储整数值。一个给 `int` 赋值值（如 42）的语句会将该值复制到此内存块中。\n\n类类型（如 `Circle`，在第 7\
  \ 章 中描述））的处理方式则不同。当你声明一个 `Circle` 变量时，编译器*不会*生成分配足够容纳 `Circle` 的内存块的代码；它仅仅分配一小块内存，这块内存可能可以存储指向包含\
  \ `Circle` 的另一个内存块的地址（或引用）。（地址指定了内存中项的位置）。只有当使用 `new` 关键字创建对象时，才会为实际的 `Circle` 对象分配内存。类是`引用类型`（reference\
  \ type）的一个示例。引用类型持有对内存块的引用。为了编写充分利用 Microsoft .NET Framework 的高效 C# 程序，你需要理解值类型和引用类型之间的区别。\n\
  \n***\n\n![Image](img/Image00005.jpg) 备注\n\nC# 中的 `string` 类型实际上是一个类。这是因为字符串没有标准大小（不同的字符串包含不同数量的字符），而且在程序运行时动态地为字符串分配内存比在编译时静态地分配要高效得多。本章中对引用类型（如类）的描述也适用于\
  \ `string` 类型。事实上，C# 中的 `string` 关键字只是 `System.String` 类的别名。\n\n***\n\n考虑这样一种情况：你声明了一个名为\
  \ `i` 的 `int` 变量并给它赋值为 42。如果你声明了另一个名为 `copyi` 的 `int` 变量，并将 `i` 赋值给 `copyi`，`copyi`\
  \ 将持有与 `i` 相同的值（42）。然而，尽管 `copyi` 和 `i` 恰好持有相同的值，但有两个内存块包含了值 42：一个块用于 `i`，另一个块用于\
  \ `copyi`。如果你修改了 `i` 的值，`copyi` 的值不会改变。让我们通过代码来看：\n\n点击此处查看代码图像\n\n```cs\nint i\
  \ = 42; // 声明并初始化 i\n\nint copyi = i; /* copyi 包含了 i 中数据的拷贝：\n\ni 和 copyi 都包含值 42\
  \ */\n\ni++; /* 增加 i 对 copyi 没有影响；\n\ni 现在包含 43，但 copyi 仍然包含 42 */\n```\n\n将变量 `c`\
  \ 声明为类类型（如 `Circle`）所产生的影响是完全不同的。当你将 `c` 声明为 `Circle` 时，`c` 可以引用一个 `Circle` 对象；`c`\
  \ 持有的实际值是内存中 `Circle` 对象的地址。如果你额外声明了另一个名为 `refc` 的变量（同样为 `Circle`）并将 `c` 赋值给 `refc`，`refc`\
  \ 将拥有与 `c` 相同的地址的拷贝；换句话说，只有一个 `Circle` 对象，且 `refc` 和 `c` 现在都引用它。以下是代码示例：\n\n```cs\n\
  Circle c = new Circle(42);\n\nCircle refc = c;\n```\n\n下面的插图展示了这两个示例。`Circle` 对象中的\
  \ 符号（`@`）表示持有内存地址的引用：\n\n![Image](img/Image00074.jpg)\n\n这种区别非常重要。这意味着方法参数的行为取决于它们是值类型还是引用类型。你将在下一个练习中探索这种区别。\n\
  \n***\n\n### 复制引用类型和数据隐私\n\n如果你实际上想将 `Circle` 对象 `c` 的内容复制到另一个 `Circle` 对象 `refc`\
  \ 中，而不是仅仅是复制引用，你必须让 `refc` 引用 `Circle` 类的新实例，然后逐字段地将数据从 `c` 拷贝到 `refc`，如下所示：\n\n\
  点击此处查看代码图像\n\n```cs\nCircle refc = new Circle();\n\nrefc.radius = c.radius; // 不要尝试这样做\n\
  ```\n\n然而，如果 `Circle` 类的任何成员是私有的（如 `radius` 字段），你将无法拷贝这些数据。相反，你可以通过将它们暴露为属性来使私有字段的数据可访问，然后使用这些属性从\
  \ `c` 读取数据并将其拷贝到 `refc`。你将在第 15 章 的“实现属性以访问字段](#text00022.html_ch15)”中学习如何这样做。\n\
  \n或者，类可以提供一个 `Clone` 方法，返回另一个同类实例，但其中填充了相同的数据。`Clone` 方法可以访问对象中的私有数据，并可以将这些数据直接拷贝到另一个实例。例如，`Circle`\
  \ 类可以定义如下的 `Clone` 方法：\n\n```cs\nclass Circle\n{\n    private int radius;\n    //\
  \ 构造函数和其他方法省略\n\n    public Circle Clone()\n    {\n        // 创建一个新的 Circle 对象\n\
  \        Circle clone = new Circle();\n        // 将此数据拷贝到 clone\n        clone.radius\
  \ = this.radius;\n        // 返回包含拷贝数据的 Circle 对象\n        return clone;\n    }\n\
  }\n```\n\n如果所有私有数据都是值，这种方法是直接的；但如果一个或字段本身是引用类型（例如，第 7 章中指示 Circle 位置的 Point 对象），这些引用类型也需要一个\
  \ `Clone` 方法；否则 `Circle` 类的 `Clone` 方法将仅仅拷贝这些引用。这种过程被称为深拷贝（deep copy）。而 `Clone`\
  \ 方法仅拷贝引用的替代方案被称为浅拷贝（shallow copy）。\n\n上述代码示例提出了一个有趣的问题：私有数据到底有多私有？你之前见过 `private`\
  \ 关键字使得字段或方法从类外部不可。但这并不意味着它只能被单个对象访问。如果你创建了同类的两个对象，它们可以访问彼此的私有数据。这听起来很奇怪，但事实上，`Clone`\
  \ 方法依赖于此特性。因此，私有意味着“对类可见”，而不是“对对象可见”。然而，不要将私有与静态混淆。如果你只是将一个字段声明为 `private`，类的每个实例都有自己的数据。如果字段被声明为\
  \ `static`，类的每个实例都共享相同的数据。\n\n***\n\n### 使用值参数和引用参数\n\n**1.** 如果尚未运行，请启动 Visual\
