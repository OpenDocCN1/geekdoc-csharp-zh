  public void run()\n{\n    double fee = calculateFee();\n    Console.WriteLine($\"\
  Fee is {fee}\");\n}\n```\n\n***\n\n![Image](img/Image00013.jpg) **提示**\n\n你可以从调用该方法的语句快速查看该方法的定义。要这样做，请右键点击该方法调用，然后点击“查看定义”（Peek\
