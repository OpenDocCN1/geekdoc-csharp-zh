  出现一个标题为 Card Game 的表单和四个文本框（标记为 North、South、East 和 West）。底部有一个带有省略号 (...) 的命令栏。点击省略号以展开命令栏。应该出现一个标题为\
  \ Deal 的按钮：\n\n![Image](img/Image00092.jpg)\n\n***\n\n![Image](img/Image00005.jpg)\
  \ 注意\n\n这里使用的技术是通用 Windows 平台 (UWP) 应用中定位按钮的首选机制，从现在开始将遵循这种风格。\n\n***\n\n**4.**\
  \ 点击 Deal。\n\n什么都没有发生。你还没有实现发牌的代码；这正是你将在练习中要做的。\n\n**5.** 回到 Visual Studio。停止调试。\n\
  \n**6.** 在解决方案资源管理器（Solution Explorer）中找到 `Value.cs` 文件。在代码编辑器窗口中打开此文件。\n\n此文件包含一个枚举\
  \ `Value`，它代表牌可以拥有的值，按升排列：\n\n点击此处查看代码图像\n\n```csharp\nenum Value { Two, Three,\
  \ Four, Five, Six, Seven, Eight, Nine, Ten, Jack, Queen, King, Ace }\n```\n\n**7.**\
  \ 在代码编辑器窗口中打开 `Suit.cs` 文件。\n\n此文件包含一个枚举 `Suit`，它代表标准牌组中的花色：\n\n点击此处查看代码图像\n\n```csharp\n\
