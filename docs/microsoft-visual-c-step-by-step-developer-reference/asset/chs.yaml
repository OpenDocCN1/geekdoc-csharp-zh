  ![Image](img/Image00033.jpg)\n## 使用变量\n`variable`（变量）是一个存储值的存储位置。你可以将变量看作计算机内存中的一个盒子，用于存放临时信息。你必须为程序中的每个变量提供一个明确的名称，以便在使用的上下文中唯一地标识它。你使用变量名来引用它所持有的值。例如，如果你想存储商店中某个物品的价格，你可以创建一个简单名为\
  \ `cost` 的变量，并将物品的价格存储在该变量中。稍后，如果你引用 `cost` 变量，检索到的值将是你早先存储在该处的物品价格。\n### 变量的命名\n\
  你应该为变量采用一种命名规范，以帮助你避免对已定义的变量产生混淆。如果你是一个项目团队的一员，有多个开发人员正在编写应用程序的不同部分，这一点尤为重要；一致的命名规范有助于避免混淆并可以减少\
  \ bug 的发生范围。以下列表包含了一些通用建议：\n![Image](img/Image000001.jpg) 不要以下划线开头标识符。虽然在 C# 中这是合法的，但它可能会限制你的代码与其他使用语言（如\
  \ Microsoft Visual Basic）构建的应用程序之间的互操作性。\n![Image](img/Image000001.jpg) 不要创建仅在大小写上不同的标识符。例如，不要同时创建一个名为\
  \ `myVariable` 的变量和另一个名为 `MyVariable` 的变量，因为这很容易将两者混淆。此外，定义仅在大小写上不同的标识符可能会限制在其他不区分大小写的语言（如\
  \ Visual Basic）开发的应用程序中重用类的能力。\n![Image](img/Image000001.jpg) 以小写字母开头名称。\n![Image](img/Image000001.jpg)\
  \ 在多单词标识符中，第二个及随后的每个单词都以大写字母开头。（这被称为 `camelCase notation` 驼峰命名法。）\n![Image](img/Image000001.jpg)\
  \ 不要使用匈牙利命名法。（如果你是 Microsoft Visual C++ 开发人员，你可能熟悉匈牙利命名法。如果你不知道什么是匈牙利命名法，就不用担心它！）\n\
  例如，`score`、`footballTeam`、`score` 和 `FootballTeam` 都是有效的变量名，但只有前两个是推荐的。\n### 声明变量\n\
  变量持有值。C# 有许多种它可以存储和处理的不同类型的值——举三个来说，整数、浮点数和字符字符串。当你声明变量时，必须指定它将持有的数据类型。\n你在声明语句中声明变量的类型和名称。例如，接下来的语句声明了名为\
  \ `age` 的变量持有 `int`（整数）值。一如既往，你必须用分号结束语句。\n```csharp\n```\n变量类型 `int` 是 C# 的 `primitive`（原始）类型之一\
