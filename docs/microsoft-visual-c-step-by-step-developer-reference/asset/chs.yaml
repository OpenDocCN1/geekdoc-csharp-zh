  \ Visual Studio 2015 环境。\n\n你现在创建了一个模拟复数并支持算术运算的类型。在下一个练习中，你将扩展 `Complex` 类并提供相等性运算符\
  \ `==` 和 `!=`。\n\n### 实现相等性运算符\n\n**1.** 在 Visual Studio 2015 中，在代码和文本编辑器中显示 `Complex.cs`\
  \ 文件。\n\n**2.** 如下方示例**加粗**所示，为 `Complex` 类添加 `==` 和 `!=` 运算符。\n\n点击此处查看代码图像\n\n\
  ```csharp\nclass Complex\n{\n...\n\npublic static bool operator ==(Complex lhs,\
  \ Complex rhs)\n{\n\nreturn lhs.Equals(rhs);\n}\n\npublic static bool operator !=(Complex\
  \ lhs, Complex rhs)\n{\n\nreturn !(lhs.Equals(rhs));\n\n}\n\n}\n```\n\n注意这两个运算符都使用了\
  \ `Equals` 方法。`Equals` 方法将类实例与指定的另一个实例进行比较。\n\n**3.** 在生成（Build）”菜单上，点击“重新生成解决方案”。\n\
  \n错误列表窗口显示以下警告消息：\n\n点击此处查看代码图像\n\n'ComplexNumbers.Complex' 定义了 operator == 或 operator\
  \ != 但未重写 Object.Equals(object o)\n\n'ComplexNumbers.Complex' 定义了 operator == 或\
  \ operator != 但未重写 Object.GetHashCode()\n\n如果你定义了 `!=` 和 `==` 运算符，还应该重写继承自 `System.Object`\
  \ 的 `Equals` 和 `GetHashCode` 方法。\n\n* * *\n\n![Image](img/Image00005.jpg)  说明\n\n\
  如果错误列表窗口可见，点击视图（View）菜单上的“错误列表”。\n\n* * *\n\n**4.** 在 `Complex` 类中重写 `Equals` 方法，如此处**加粗**所示：\n\
  \n点击此处查看代码图像\n\n```csharp\nclass Complex\n{\n...\n\npublic override bool Equals(Object\
  \ obj)\n{\n\nif (obj is Complex)\n{\n\nComplex compare = (Complex)obj;\n\nreturn\
  \ (this.Real == compare.Real) &&\n\n(this.Imaginary == compare.Imaginary);\n\n}\n\
  \nelse\n\n{\n\nreturn false;\n\n}\n\n}\n\n```\n\n\n\n\n\n`Equals` 方法接收一个 `Object`\
  \ 作为参数。此代码验证了参数的类型实际上是否为 `Complex` 对象。如果是，此代码将比较当前实例和传入参数中 `Real` 和 `Imaginary`\
  \ 属性的值。如果它们相同，则该方法返回 `true`；否则，返回 `false`。如果传入的参数不是 `Complex` 对象，则该方法返回 `false`。\n\
  \n***\n\n![Image](img/Image00004.jpg) 重要\n\n人们很容易像这样写 `Equals` 方法：\n\n点击此处查看代码图像\n\
  \n```csharp\npublic override bool Equals(Object obj)\n{\n  Complex compare = obj\
  \ as Complex;\n  if (compare != null)\n  {\n    return (this.Real == compare.Real)\
  \ &&\n    (this.Imaginary == compare.Imaginary);\n  }\n  else\n  {\n    return false;\n\
  \  }\n}\n```\n\n然而，表达式 `compare != null` 调用了 `Complex` 类的 `!=` 运算符，而该运算符会再次调用 `Equals`\
  \ 方法，从而导致递归循环。\n\n***\n\n### 5. 重写 `GetHashCode` 方法。此实现只是简单地调用了继承自 `Object` 类的方法，但如果你愿意，也可以提供自己的机制为对象生成哈希值。\n\
  \n点击此处查看代码图像\n\n```csharp\nclass Complex\n{\n  ...\n  public override int GetHashCode()\n\
  \  {\n    return base.GetHashCode();\n  }\n}\n```\n\n### 6. 在“生成”（Build）菜单上，点击“重新生成解决方案”（Rebuild\
