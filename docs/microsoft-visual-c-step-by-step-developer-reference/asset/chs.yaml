  \ (int real, int imaginary)\n{\n\nthis.Real = real;\n\nthis.Imaginary = imaginary;\n\
  \n}\n\n}\n```\n\n此构造函数接收两个 `int` 参数并使用它们来填充 `Real` 和 `Imaginary` 属性。\n\n**6.** 如后文**加粗**所示，重写\
