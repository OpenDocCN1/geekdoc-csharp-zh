  \n**8.** 按回车键关闭程序并返回到 Visual Studio 2015 编程环境。\n\n**9.** 在 `doWork` 方法中再添加两个语句来递增\
  \ `first` 变量并将其新值显示到控制台，如下所示**粗体**所示：\n\n点击此处查看代码图像\n\n```cs\nstatic void doWork()\n\
  {\n    Month first = Month.January;\n    Console.WriteLine(first);\n    first++;\n\
  \    Console.WriteLine(first);\n}\n```\n\n**10.** 在“调试 (Debug)”菜单上，点击“转而不调试启动”。\n\
  \nVisual Studio 2015 编译并运行程序。确认单词 `January` 和 `February` 已写入控制台。\n\n注意，在枚举变量上执行数学运算（如递增操作）会更改变量的内部整数值。当变量写入控制台时，会显示相应的枚举值。\n\
  \n**11.** 按回车键关闭程序并返回到 Visual Studio 2015 编程环境。\n\n**12.** 修改 `doWork` 方法中的第一个语句，将\
  \ `first` 变量初始化为 `Month.December`，如下所示**粗体**所示：\n\n点击此处查看代码图像\n\n```cs\nstatic void\
  \ doWork()\n{\n    Month first = Month.December;\n    Console.WriteLine(first);\n\
  \    first++;\n    Console.WriteLine(first);\n}\n```\n\n**13.** 在“调试 (Debug)”菜单上，点击“转而不调试启动”。\n\
