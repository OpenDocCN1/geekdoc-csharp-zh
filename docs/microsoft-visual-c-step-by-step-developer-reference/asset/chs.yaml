  \ 虽然你可以在枚举上进行算术运算，但如果结果超出枚举的范围，运行时会将该值解释为整数值。\n\n**14.** 按回车键关闭程序并返回 Visual Studio\
  \ 环境。\n\n### 使用结构\n\n第 8 章 说明类是始终在堆上创建的引用类型。在某些情况下，类包含的数据很少，导致管理堆的开销变得不比例。在这种情况下，将类型定义为结构更好。结构是一种值类型。由于结构在栈上，只要结构足够小，内存开销就会减少。\n\
  \n你可能没有意识到，你在之前的练习中已经使用了结构。在 C# 中，基本类型 `int`、`long` 和 `float` 分别是结构 `System.Int32`、`System.Int64`\
  \ 和 `System.Single` 的别名。这些结构具有字段和方法，你可以在变量上调用方法。例如，所有这些结构都提供了 `ToString` 方法，可以将数值转换为字符串表示。你并不经常看到这种\
  \ `ToString` 方法的使用，因为 `Console.WriteLine` 方法在需要时会自动调用它。以下语句在 C# 中都是合法的：\n\n```cs\n\
  int i = 55;\nConsole.WriteLine(i.ToString());\nConsole.WriteLine(55.ToString());\n\
  \nfloat f = 98.765F;\nConsole.WriteLine(f.ToString());\nConsole.WriteLine(98.765F.ToString());\n\
  ```\n\n更常见的是使用这些结构暴露的一些静态方法。例如，在之前的章节中，你使用了静态 `int.Parse` 方法将字符串转换为相应的整数值。你实际上执行的是调用\
  \ `Int32` 结构的 `Parse` 方法：\n\n```cs\nstring s = \"42\";\nint i = int.Parse(s); //\
  \ 等同于 Int32.Parse\n```\n\n这些结构还包含一些有静态字段。例如，`Int32.MaxValue` 是 `int` 能保存的最大值，而 `Int32.MinValue`\
  \ 是你可以存储在 `int` 中的最小值。\n\n下表显示了 C# 基本类型及其在 Microsoft .NET Framework 中的对应类型。注意，字符串和对象类型是类（引用类型），而不是结构。\n\
  \n![Image](img/Image00084.jpg)\n\n\n\n\n要声明你自己的结构类型，你需要使用 `struct` 关键字，后面跟上类型名称，然后用大括号\
  \ `{}` 将结构的主体括起来。在语法上，此过程与声明类相似。例如，这里有一个名为 `Time` 的结构，它包含了三个名为 `hours`、`minutes`\
  \ 和 `seconds` 的公共 `int` 字段：\n\n点击此处查看代码图片\n\n```csharp\nstruct Time\n{\npublic int\
  \ hours, minutes, seconds;\n}\n```\n\n与类一样，在大多数情况下，并不建议将结构的字段设为公共（public）；因为你没有方法可以控制公共字段中持有的值。例如，任何人都可以将\
  \ `minutes` 或 `seconds` 的值设置为大于 60 的值。更好的想法是将字段设为私有，并为你的结构提供构造函数和方法来初始化和操作这些字段，如下例所示：\n\
  \n点击此处查看代码图片\n\n```csharp\nstruct Time\n{\nprivate int hours, minutes, seconds;\n\
  ...\npublic Time(int hh, int mm, int ss)\n{\nthis.hours = hh % 24;\nthis.minutes\
  \ = mm % 60;\nthis.seconds = ss % 60;\n}\n\npublic int Hours()\n{\nreturn this.hours;\n\
  }\n}\n```\n\n***\n\n![Image](img/Image00005.jpg) 注意\n\n默认情况下，你无法在你自己的结构类型上使用许多常用运算符。例如，你不能在你自己的结构类型变量上使用诸如相等运算符（`==`）和不等运算符（`!=`）。然而，你可以使用所有结构都公开的内建\
  \ `Equals()` 方法来比较结构类型变量，你也可以显式地为你自己的结构类型声明并实现运算符。执行此操作的语法涵盖在第 21 章“使用查询表达式查询内存中的数据”中。\n\
  \n***\n\n当你复制一个值类型变量时，你会得到两个值的副本。相反，当你复制引用类型变量时，你会得到两个指向同一个对象的引用。总之，对于小型数据值，使用结构来复制该值的效率与复制地址相同或几乎相同。对于由于过大而无法高效复制的复杂数据，请使用类。\n\
  \n***\n\n![Image](img/Image00013.jpg) 提示\n\n使用结构来实现简单的概念，这些概念的主要特征是其值，而不是它们所提供的功能。\n\
  \n***\n\n### 理解结构与类之间的差异\n\n结构和类在语法上相似，但它们有一些重要的区别。让我们来看其中的一些差异：\n\n![Image](img/Image00001.jpg)\
  \ 你不能为结构声明默认构造函数（不带参数的构造函数）。如果 `Time` 是一个类，下面的示例将可以通过编译，但由于 `Time` 是一个结构，它无法通过：\n\
  \n点击此处查看代码图片\n\n```csharp\nstruct Time\n{\npublic Time() { ... } // 编译时错误\n...\n\
  }\n```\n\n你不能为结构声明自己的默认构造函数的原因是编译器 `always` 会生成一个。在类中，只有当你没有自己写构造函数时，编译器才会生成默认构造函数。结构的编译器生成的默认构造函数总是将字段设置为\
  \ `0`、`false` 或 `null`——就像类一样。因此，你应该确保由默认构造函数创建的结构值在逻辑上是合理的，并且这些默认值是有意义的。这将产生影响，你将在下一个练习中探索它们。\n\
  \n你可以通过提供非默认构造函数来将字段初始化为不同的值。然而当你这样做时，你的非默认构造函数必须显式地初始化结构中的所有字段；默认初始化不再发生。如果你没有这样做，将得到编译时错误。例如，尽管如果\
  \ `Time` 是一个类，下面的示例将编译并静默地将 `seconds` 初始化为 `0`，但由于 `Time` 是一个结构，它无法编译：\n\n点击此处查看代码图片\n\
  \n```csharp\nstruct Time\n{\nprivate int hours, minutes, seconds;\n...\npublic Time(int\
  \ hh, int mm)\n{\nthis.hours = hh;\nthis.minutes = mm;\n} // 编译时错误：seconds 未初始化\n\
  }\n```\n\n![Image](img/Image00001.jpg) 在类中，你可以在声明点初始化实例字段。在结构中，你不能这样做。如果 `Time`\
  \ 是一个类，下面的示例将可以通过编译，但由于 `Time` 是一个结构，它会导致编译时错误：\n\n点击此处查看代码图片\n\n```csharp\nstruct\
  \ Time\n{\nprivate int hours = 0; // 编译时错误\nprivate int minutes;\nprivate int seconds;\n\
  ...\n}\n```\n\n下面的表总结了结构和类之间的主要区别。\n\n![Image](img/Image00085.jpg)\n\n类和结构在继承方面还有其他差异。这些差异在第\
  \ 12 章“处理继承”中。\n\n### 结构变量\n\n一旦你定义了结构，就可以像使用任何类型一样使用它。例如，如果你定义了 `Time` 结构，你可以在如下所示的情况下创建变量、字段和参数：\n\
  \n```csharp\nstruct Time\n{\nprivate int hours, minutes, seconds;\n...\n}\n\nclass\
  \ Example\n{\nprivate Time currentTime;\npublic void Method(Time parameter)\n{\n\
  Time localVariable;\n...\n}\n```\n\n***\n\n![Image](img/Image00005.jpg) 注意\n\n与枚举一样，你可以通过\
  \ `?` 修饰符创建结构的空版本。你可以将 `null` 值赋值给变量：\n\n`Time? currentTime = null;`\n\n***\n\n\
  ### 理解结构初始化\n\n在本章前面的部分，你看到了如何通过构造函数初始化结构。如果你调用了构造函数，之前提到的各种规则将确保结构的所有字段都已初始化：\n\
  \n`Time now = new Time();`\n\n下面的图描绘了这种情况：\n\n![Image](img/Image00086.jpg)\n\n然而，由于结构是值类型，你也可以在不调用构造函数的情况下创建结构变量，如下所示：\n\
  \n`Time now;`\n\n这一次，变量被创建但其字段处于未初始化状态。尝试访问这些字段将导致编译器错误：\n\n![Image](img/Image00087.jpg)\n\
  \n注意，在这情况下 `now` 变量都在栈上创建。\n\n如果你编写了自己的结构构造函数，也可以使用它来初始化结构变量。正如在本章早期所述的，结构构造函数必须显式地初始化所有字段。例如：\n\
  \n```csharp\nstruct Time\n{\nprivate int hours, minutes, seconds;\n...\npublic Time(int\
  \ hh, int mm)\n{\nhours = hh;\nminutes = mm;\nseconds = 0;\n}\n```\n\n下面的示例通过调用用户定义的构造函数来初始化\
  \ `now`：\n\n`Time now = new Time(12, 30);`\n\n下图显示了该示例的效果：\n\n![Image](img/Image00088.jpg)\n\
  \n是是将这些知识付诸实践。在下面的练习中，你将创建一个结构来表示日期。\n\n#### 创建并使用结构类型\n\n1. 在 StructsAndEnums 项目中，在代码和文本编辑器中显示\
  \ `Date.cs` 文件。\n\n2. 将 `StructsAndEnums` 命名空间内的 TODO 注释替换为名为 `Date` 的结构。该结构应包含三个私有字段：一个名为\
  \ `year` 的 `int` 类型字段，一个名为 `month` 的 `Month` 类型字段（使用你在上一个练习中创建的枚举），以及一个名为 `day`\
  \ 的 `int` 类型字段。`Date` 结构看起来完全如下：\n\n```csharp\nstruct Date\n{\nprivate int year;\n\
  }\n```\n\n\n\n\n```csharp\nprivate Month month;\n\nprivate int day;\n\n}\n```\n\n\
  考虑编译器为 `Date` 生成的默认构造函数。该构造函数将 `year` 设置为 `0`，将 `month` 设置为 `0`（1 月份的值），并将 `day`\
  \ 设置为 `0`。`year` 的值 `0` 是无效的（因为没有 0 年），`day` 的值 `0` 也是无效的（因为每个月都从 1 号开始）。解决此问题的方法是通过实现\
  \ `Date` 结构体来转换 `year` 和 `day` 的值：当 `year` 字段持有值 `Y` 时，该值代表年份 `Y + 1900`（或者你可以根据喜好选择世纪），而当\
  \ `day` 字段持有值 `D` 时，该值代表第 `D + 1` 天。这样，默认构造函数会将三个字段设置为代表 1900 年 1 月 1 日的值。\n\n如果你可以重写默认构造函数并编写自己的构造函数，这个问题就不是问题，因为你可以直接将\
  \ `year` 和 `day` 字段初始化为有效值。然而，你无法做到这一点，因此你必须在结构体中实现逻辑，将编译器生成的默认值转换为你的问题领域中有意义的值。\n\
  \n然而，尽管你不能重写默认构造函数，但定义非默认构造函数仍然良好的做法，允许用户显式地将结构体的字段初始化为有意义的非默认值。\n\n**3.** 为 `Date`\
  \ 结构体添加一个公共构造函数。该构造函数接受三个参数：一个名为 `ccyy` 的 `int` 表示年份，一个名为 `mm` 的 `Month` 表示月份，以及一个名为\
  \ `dd` 的 `int` 表示日期。使用这三个参数初始化相应的字段。值为 `Y` 的 `year` 字段代表年份 `Y + 1900`，因此你需要将 `year`\
  \ 字段初始化为值 `ccyy - 1900`。值为 `D` 的 `day` 字段代表 `D + 1` 天，因此你需要将 `day` 字段初始化为值 `dd -\
  \ 1`。\n\n`Date` 结构体现在看起来应该是这样（构造函数加粗显示）：\n\n点击此处查看代码图像\n\n```csharp\nstruct Date\n\
  {\nprivate int year;\n\nprivate Month month;\nprivate int day;\n\npublic Date(int\
  \ ccyy, Month mm, int dd)\n{\nthis.year = ccyy - 1900;\nthis.month = mm;\nthis.day\
  \ = dd - 1;\n}\n\n}\n```\n\n**4.** 在构造函数之后，为 `Date` 结构体添加一个名为 `ToString` 的公共方法。该方法不接受参数，并返回日期的字符串表示。记住，`year`\
  \ 字段的值代表 `year + 1900`，`day` 字段的值代表 `day + 1`。\n\n* * *\n\n![Image](img/Image00005.jpg)\
  \  注意\n\n`ToString` 方法与你目前为止看到的的方法略有不同。每个类型（包括你定义的结构体和类）无论你是否想要，都自动拥有 `ToString`\
  \ 方法。它的默认行为是将变量中的数据转换为该数据的字符串表示。有时默认行为是有意义的；而在其他时候则意义不大。例如，为 `Date` 结构体生成的 `ToString`\
  \ 方法的默认行为只是生成字符串“StructsAndEnums.Date”。引用道格拉斯·亚当斯在《宇宙尽头的餐厅》（Pan Macmillan, 1980）中\
  \ Zaphod Beeblebrox 的话，这是“精明的，但乏味的”。你需要使用 `override` 关键字定义该方法的新版本以重写默认行为。重写方法将在第\
  \ 12 章中进行详细讨论。\n\n* * *\n\n`ToString` 方法看起来应该是这样的：\n\n点击此处查看代码图像\n\n```csharp\n\
  struct Date\n{\n...\npublic override string ToString()\n{\nstring data = $\"{this.month}\
  \ {this.day + 1} {this.year + 1900}\";\nreturn data;\n}\n\n}\n```\n\n在此方法中，你使用 `month`\
  \ 字段字段的文本表示、表达式 `this.day + 1` 以及表达式 `this.year + 1900` 构建了一个格式化字符串。`ToString` 方法将其格式化字符串作为结果返回。\n\
