  \ `TestHello.exe` 的文件。这是编译后的程序，当你点击“调试”菜单上的“无调试启动”时运行的文件。其他文件包含了你在调试模式（当你点击“调试”菜单上的“调试”）运行程序时\
  \ Visual Studio 使用的信息。\n### 使用命名空间\n你目前看到的示例是一个非常小的程序。然而，小程序很快就会变成大程序。随着程序的增长，会出现两个问题。首先，理解和维护大程序比理解和维护小程序困难。其次，更多的代码意味着更多的类、更多的方法，你需要记住更多的名称。随着名称数量的增加，构建失败的可能性也会增加；例如，你可能会尝试创建两个同名的类。当程序引用其他开发者使用的各种名称的程序集时，情况变得更加复杂。\n\
  过去，程序员尝试通过在名称前加上某种限定符（或一组限定符）来解决名称冲突问题。这不是一个好的解决方案，因为它不可扩展；名称会变得越来越长，你编写软件的时间减少了，打字的时间增加了（这者有区别），而且阅读和反复阅读难以理解的长名称的时间增加了。\n\
  \n\n命名空间（Namespaces）通过为类等项创建一个容器来帮助解决这个问题。两个同名的类如果位于不同的命名空间，就不会相互混淆。你可以像这样使用 `namespace`\
  \ 关键字在名为 `TestHello` 的命名空间内创建一个名为 `Greeting` 的类：\n```csharp\n{\nclass Greeting\n\
  ...\n}\n\n\n\n\n\nusing System;\nusing System.Linq;\nusing System.Threading.Tasks;\n\
  \n\n\n\n\n//using System;\n\n\n\n\n\n\n\n\n\n\nstatic void Main(string[] args)\n\
  \    System.Console.WriteLine(\"Hello World!\");\n```\n* * *\n![图像](img/Image00005.jpg)\
