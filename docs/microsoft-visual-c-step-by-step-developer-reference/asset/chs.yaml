  \ 4 2015\nValue of copy is still July 4 2015\n\n第一条消息显示 `Anniversary` 变量的初始值（2015\
  \ 年 7 月 4 日）。第二条消息显示 `AnniversaryCopy` 变量的值。你可以看到包含与 `Anniversary` 变量相同的日期（2015\
