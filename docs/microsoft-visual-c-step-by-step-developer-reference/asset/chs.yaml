  Comparison: temp != first\nComparison: temp == temp\n\n### 9. 关闭应用程序并返回 Visual Studio\
  \ 2015。\n\n### 理解转换运算符\n\n有时，你需要将一种类型的表达式转换为另一种类型。例如，以下方法声明时带有一个 `double` 参数：\n\n\
  点击此处查看代码图像\n\n```csharp\nclass Example\n{\n  public static void MyDoubleMethod(double\
  \ parameter)\n  {\n    ...\n  }\n}\n```\n\n你可能会合理地认为，当代码调用 `MyDoubleMethod` 时，只有\
  \ `double` 类型的值可以作为参数，但事实并非如此。C# 编译器也允许使用其他类型的参数调用 `MyDoubleMethod`，但前提是该参数的值可以转换为\
  \ `double`。例如，如果你提供了一个 `int` 参数，编译器会在调用该方法时生成代码，将参数的值转换为 `double`。\n\n#### 提供内置转换\n\
  \n内置类型具有某些内置转换功能。例如，如之前提到的，`int` 可以隐式地转换为 `double`。隐式转换不需要特殊的语法，并且永远不会抛出异常。\n\n\
  点击此处查看代码图像\n\n```csharp\nExample.MyDoubleMethod(42); // 隐式 int-to-double 转换\n```\n\
  \n隐式转换有时被称为“宽式转换”（widening conversion），因为结果比原始值“宽”，它包含至少与原始值一样的信息，且没有任何丢失。在 `int`\
  \ 和 `double` 的情况下，`double` 的范围大于 `int`，所有的 `int` 值都有等效的 `double` 值。然而，反过来则不然，`double`\
  \ 值不能隐式地转换为 `int`：\n\n点击此处查看代码图像\n\n```csharp\nclass Example\n{\n  public static\
  \ void MyIntMethod(int parameter)\n  {\n    ...\n  }\n}\n...\nExample.MyIntMethod(42.0);\
  \ // 编译错误\n```\n\n当你将 `double` 转换为 `int` 时，你面临丢失信息的风险，因此转换不会自动执行。（考虑一下如果 `MyIntMethod`\
  \ 的参数是 `double` 会发生什么）将 `double` 转换为 `int` 时，你面临丢失信息的风险，因此转换不会自动执行。需要显式转换：\n\n点击此处查看代码图像\n\
  \n```csharp\nExample.MyIntMethod((int)42.0);\n```\n\n显式转换有时被称为“窄式转换”（narrowing conversion），因为结果比原始值“窄”——它包含的信息至少与原始值一样，且没有任何丢失。在\
  \ `int` 和 `double` 的情况下，`double` 的范围大于 `int`，所有的 `int` 值都有等效的 `double` 值。然而，反过来则不然，`double`\
  \ 值不能隐式地转换为 `int`。\n\n#### 实现转换运算符\n\n定义转换运算符的语法与重载运算符有相似之处，但也有一些重要的区别。这里有一个允许 `Hour`\
  \ 对象隐式转换为 `int` 的转换运算符：\n\n转换运算符必须是 `static` 的。在定义自己的转换运算符时，必须指定它们是隐式转换运算符还是显式转换运算符。你通过使用\
  \ `implicit` 和 `explicit` 关键字来实现这一点。前一个示例所示的 `Hour` 到 `int` 的转换运算符是隐式的，这意味着 C# 编译器可以在不需要强制类型转换的情况下使用它。\n\
  \n点击此处查看代码图像\n\n```csharp\nclass Example\n{\n  public static void MyOtherMethod(int\
  \ parameter) { ... }\n  public static void Main()\n  {\n    Hour lunch = new Hour(12);\n\
  \    Example.MyOtherMethod(lunch); // 隐式 Hour to int 转换\n  }\n}\n```\n\n如果转换运算符是用\
  \ `explicit` 声明的，前一个示例将无法编译，因为显式转换运算符需要强制类型转换。\n\n点击此处查看代码图像\n\n```csharp\nExample.MyOtherMethod((int)lunch);\
  \ // 显式 Hour to int 转换\n```\n\n何时应该将转换运算符声明为显式或隐式？如果转换总是安全的、没有丢失信息的风险，并且不会抛出异常，就可以将其定义为隐式转换。否则，它应该声明为显式转换。从\
  \ `Hour` 转换为 `int` 总是安全的——每个 `Hour` 都有一个对应的 `int` 值——因此将其定义为隐式是合理的。将 `string` 转换为\
  \ `Hour` 的运算符应该是显式的，因为并不是所有的字符串都代表有效的 `Hour`。（字符串 “7 ” 是没问题的，但你如何将字符串 “Hello, World\
  \ ” 转换为 `Hour` ？）\n\n#### 创建对称运算符，回顾\n\n\n\n\n转换运算符为你提供了一种另一种解决提供对称运算符问题的方法。例如，你不需要像之前的那样为\
  \ `Hour` 结构体提供三个版本的 `operator+`（`Hour + Hour`、`Hour + int` 和 `int + Hour`），而是只需要提供一个单一版本的\
  \ `operator+`（接受两个 `Hour` 参数）以及一个隐式的 `int` 到 `Hour` 的转换，如下所示：\n\n点击此处此处查看代码图片\n\n\
  ```csharp\nstruct Hour\n{\n    public Hour(int initialValue)\n    {\n        this.value\
  \ = initialValue;\n    }\n\n    public static Hour operator +(Hour lhs, Hour rhs)\n\
  \    {\n        return new Hour(lhs.value + rhs.value);\n    }\n\n    public static\
  \ implicit operator Hour (int from)\n    {\n        return new Hour (from);\n  \
  \  }\n    ...\n\n    private int value;\n}\n```\n\n如果你将一个 `Hour` 加到 `int` 上（无论何种顺序），C#\
  \ 编译器会自动将 `int` 转换为 `Hour`，然后调用带有两个 `Hour` 参数的 `operator+`，此处所示：\n\n点击此处此处查看代码图片\n\
  \n```csharp\nvoid Example(Hour a, int b)\n{\n    Hour eg1 = a + b; // b 转换为一个 Hour\n\
  \    Hour eg2 = b + a; // b 转换为一个 Hour\n}\n```\n\n### 编写转换运算符\n\n在本章的最后一个练习中，你将为\
  \ `Complex` 类添加转换运算符。你将首先编写一对转换运算符，用于在 `int` 类型和 `Complex` 类型之间进行转换。将 `int` 转换为\
  \ `Complex` 对象始终是一个安全过程，并且不会丢失信息（因为 `int` 实际上只是一个不带虚部的复数）。你将将其实现为隐式转换运算符。然而，反过来并非如此——要将\
  \ `Complex` 对象转换为 `int`，你必须舍弃虚部元素。因此，你将把此转换运算符实现为显式。\n\n### 实现转换运算符\n\n**1.** 返回到\
  \ Visual Studio 2015，并在代码和文本编辑器窗口中显示 `Complex.cs` 文件。将后续代码中**加粗**显示的构造函数添加到 `Complex`\
  \ 类中，紧跟在现有构造函数之后，并在 `ToString` 方法之前。此新构造函数接受单个 `int` 参数，并用它初始化 `Real` 属性。`Imaginary`\
  \ 属性被设置为 `0`。\n\n点击此处此处查看代码图片\n\n```csharp\nclass Complex\n{\n    ...\n\n    public\
  \ Complex(int real)\n    {\n        this.Real = real;\n        this.Imaginary =\
  \ 0;\n    }\n    ...\n}\n```\n\n**2.** 向 `Complex` 类中添加以下隐式转换运算符。\n\n点击此处此处查看代码图片\n\
  \n```csharp\nclass Complex\n{\n    ...\n\n    public static implicit operator Complex(int\
  \ from)\n    {\n        return new Complex(from);\n    }\n    ...\n}\n```\n\n该运算符通过返回使用你在上一步中创建的构造函数构建的\
  \ `Complex` 类的新实例，从 `int` 转换为 `Complex` 对象。\n\n**3.** 向 `Complex` 类中添加此处**加粗**显示的显式转换运算符。\n\
  \n点击此处此处查看代码图片\n\n```csharp\nclass Complex\n{\n    ...\n\n    public static explicit\
  \ operator int(Complex from)\n    {\n        return from.Real;\n    }\n    ...\n\
  }\n```\n\n该运算符接收一个 `Complex` 对象并返回 `Real` 属性的值。此转换舍弃了复数的虚部元素。\n\n**4.** 在代码和文本编辑器窗口中显示\
  \ `Program.cs` 文件。在 `doWork` 方法的末尾添加以下**加粗**的代码：\n\n点击此处此处查看代码图片\n\n```csharp\n\
  static void doWork()\n{\n    ...\n    Console.WriteLine($\"Current value of temp\
  \ is {temp}\");\n    if (temp == 2)\n    {\n        Console.WriteLine(\"Comparison\
  \ after conversion: temp == 2\");\n    }\n    else\n    {\n        Console.WriteLine(\"\
  Comparison after conversion: temp != 2\");\n    }\n    temp += 2;\n    Console.WriteLine($\"\
  Value after adding 2: temp = {temp}\");\n}\n```\n\n这些语句测试了将 `int` 转换为 `Complex`\
  \ 对象的隐式运算符。`if` 语句将 `Complex` 对象与 `int` 进行比较。编译器生成的代码首先将 `int` 转换为 `Complex` 对象，然后调用\
  \ `Complex` 类的 `==` 运算符。为 `temp` 变量加 2 的语句将整数值 2 转换为 `Complex` 对象，然后使用 `Complex`\
  \ 类的 `+` 运算符。\n\n**5.** 在 `doWork` 方法的末尾添加以下语句：\n\n点击此处此处查看代码图片\n\n```csharp\nstatic\
  \ void doWork()\n{\n    ...\n    int tempInt = temp;\n    Console.WriteLine($\"\
  Int value after conversion: tempInt == {tempInt}\");\n}\n```\n\n第一条语句尝试将 `Complex`\
  \ 对象分配给 `int` 变量。\n\n**6.** 在生成菜单中，点击“重新生成”。\n\n生成失败，编译器在错误列表窗口中报告以下错误。\n\n**7.**\
  \ 使用强制转换修改尝试将 `Complex` 对象分配给 `int` 变量的语句：\n\n```csharp\nint tempInt = (int)temp;\n\
  ```\n\n**8.** 在调试菜单中，点击“转调试启动”。验证解决方案现在可以生成，并且最终的消息看起来如下：\n\n点击此处此处查看代码图片\n\nCurrent\
  \ value of temp is 2\nComparison after conversion: temp == 2\nValue after adding\
  \ 2: temp = 4\nInt value after conversion: tempInt == 4\n\n**9.** 关闭应用程序，并返回到 Visual\
  \ Studio 2015。\n\n## 总结\n\n在本章中，你学习了如何重载运算符并为类或结构体提供特定功能。你实现了许多常用的算术运算符，还创建了用于比较实例的运算符。最后，你学习了如何创建隐式和显式转换运算符。\n\
  \n\n\n\n\n完成本章后，你将能够：\n\n* 描述在应用程序中实现并行操作的优势。\n* 使用 `Task` 类在应用程序中创建并运行并行操作。\n*\
  \ 使用 `Parallel` 类对某些常见的编程结构进行并行化。\n* 取消长时间运行的任务并处理由并行操作抛出的异常。\n\n在本书前面的大部分章节中，你已经学习了如何使用\
  \ C# 编写单线程方式运行的程序。我所说的 `single-threaded`（单线程）是指在任何一个时刻，程序都在执行单条指令。这并不总是应用程序采取的最高效方法。如果你有适当的处理资源，某些应用程序如果将它们划分为可以并发运行的并行执行路径，可能会运行得更快。本章关注如何通过最大化对可用处理能力的利用来提高应用程序的吞吐量。具体而言，在本章中，你将学习如何使用\
  \ `Task` 对象为计算密集型应用程序应用高效的多任务处理。\n\n### 为什么要通过使用并行处理执行多任务处理？\n\n你可能想在应用程序中执行多任务处理有两个主要原因：\n\
  \n#### **提高响应性**\n长时间运行的操作可能涉及不需要处理器时间的任务。常见的示例包括 I/O 密集型操作，例如从本地磁盘读取或写入，或者跨网络发送和接收数据。在这两种情况下，如果程序可以做其他更有用的事情（例如响应用户输入），那么让程序白白\
  \ CPU 周期来等待操作完成是没有意义的。移动设备的大多数用户认为这种响应是理所当然的，他们不期望自己的平板电脑在发送和接收电子邮件时简单停止。例如。第 24\
  \ 章，“通过执行异步操作提高响应时间”更详细地讨论了这些特性。\n\n#### **提高可扩展性**\n如果一个操作是 CPU 密集型的，你可以通过有效利用可用的处理资源并使用这些资源来缩短执行该操作所需，从而提高可扩展性。开发者可以确定哪些操作包含可以并行执行的任务，并安排这些元素并发运行。随着更多计算资源的增加，可以并行运行更多此类任务的实例。直到最近，这种模型仅适用于具有多个\
  \ CPU 或能够将处理分散到不同网络连接计算机上的科学和工程系统。然而，大多数现代计算设备现在都包含强大的 CPU，能够支持真正的多任务处理，并且许多操作系统提供了让你能够轻松实现任务并行化的原语。\n\
  \n#### 多核处理器的兴起\n\n在世纪之交，一台良好的个人电脑的价格在 800 美元到 1500 美元之间。今天，在 15 年的通货膨胀后，一台良好的个人电脑的价格仍然相似。今天典型计算机的规格可能包括运行速度在\
  \ 2 GHz 到 3 GHz 之间的处理器、超过 1000 GB 的硬盘存储、4–8 GB 的内存、高速高分辨率显示图形、快速的网络接口以及一个可重写的 DVD\
  \ 光驱。十五年前，一台典型机器的处理器速度在 500 MHz 到 1 GHz 之间，80 GB 是一个大硬盘，Windows 在 256 MB 或更少的内存上运行得相当轻松，而可重写\
  \ CD 光驱的价格远高于 100 美元。（可重写 DVD 光驱稀有且极其昂贵。）这就是技术进步的乐趣：越来越快的硬件和越来越廉廉的价格。\n\n这不是一个新趋势。1965\
  \ 年，英特尔联合创始人戈登·摩尔（Gordon E. Moore）写了一篇名为《在集成电路上挤更多组件》的论文，讨论了组件不断的小型化如何使更多的晶体管被嵌入硅芯片中，以及随着技术的普及，生产成本的下降如何导致经济学决定在\
  \ 1975 年之前尽可能将 65,000 个组件挤到单个芯片上。摩尔的观察导致了经常被称为“摩尔定律”的格言，该定律基本上指出，集成电路上可以廉价放置的晶体管数量将指数级增长，每两年翻一倍。（实际上，戈登·摩尔最初比这更乐观，假设晶体管数量可能每年翻倍，但他后来修改了自己的计算方法。）晶体管封装在一起的能力导致了它们之间更快传递数据的能力。这意味着我们可以看到芯片制造商以几乎永不停歇的速度生产出更快、更强大的微处理器，使软件开发者能够编写越来越复杂且运行越来越快的软件。\n\
  \n关于电子元件微型化的摩尔定律在半个世纪后仍然成立。然而，物理学已经开始干预。当单个芯片上的晶体管之间的信号无论多么微小或密密，都无法更快地传输时，限制就出现了。对于软件开发者来说，这种限制最明显的结果是处理器已经停止变快。十年前，一个快速处理器运行频率为\
  \ 3 GHz。今天，一个快速处理器运行频率仍然是 3 GHz。\n\n处理器在组件之间传输数据的速度限制导致芯片公司寻找替代机制来增加处理器可以的工作量。结果是，大多数现代处理器现在都有两个或多个\
  \ `processor cores`（处理器内核）。实际上，芯片制造商在同一芯片上放置了多个处理器，并添加了必要的逻辑使它们能够相互通信和协调。四核（四个核心）和八核处理器现在已很常见。16\
  \ 核、32 核和 64 核芯片已经可用，双核和四核处理器的价格现在低到足以它们成为笔记本电脑、平板电脑和智能手机的预期配置。因此，尽管处理器停止了加速，但你现在可以预期在芯片上获得更多核心。\n\
  \n这对编写 C# 应用程序的开发者意味着什么？\n\n在多核处理器出现之前，你只需要通过运行在更快的处理器上来加速单线程应用程序。有了多核处理器后，情况不再如此。单线程应用程序在主频相同的单核、双核或四核处理器上的运行速度相同。区别在于，对于双核处理器而言，就你的应用程序来说，其中一个处理器内核将处于闲置状态，而对于四核处理器，三个内核将只是在那里空转等待工作。为了充分利用多核处理器，你需要编写你的应用程序以利用多任务处理。\n\
  \n### 使用 Microsoft .NET 框架实现多任务处理\n\n多任务处理是同时做多事情的能力。这是一个描述起来容易但直到最近实现起来都很困难的概念。\n\
  \n在理想情况下，运行在多核处理器上的应用程序会执行与可用处理器内核数量等量的并发任务，使每个内核都保持忙碌。然而，为了实现并发你需要考虑许多问题，包括以下内容：\n\
  \n\n\n\n\n![Image](img/Image00001.jpg) 你如何将应用程序划分为一组并发操作？\n\n![Image](img/Image00001.jpg)\
  \ 你如何安排一组操作在多个处理器上并发执行？\n\n![Image](img/Image00001.jpg) 你如何确保你尝试执行的并发操作数量与可用处理器的数量一致？\n\
  \n![Image](img/Image00001.jpg) 如果某个操作被阻塞（例如在等待 I/O 完成时），你如何检测到这一点并安排处理器运行另一个操作，而不是让它空闲？\n\
  \n![Image](img/Image00001.jpg) 你如何判断一个或多个并发操作何时完成？\n\n对于应用程序开发者来说，第一个问题属于应用程序设计范围。其余问题则取决于编程基础设施。微软提供了\
  \ `Task` 类以及 `System.Threading.Tasks` 命名空间中的一组相关类型来帮助解决这些问题。\n\n***\n\n![Image](img/Image00004.jpg)\
  \ 重要提示\n\n关于应用程序设计的这一点是至关重要的。如果实现应用程序时没有考虑多任务处理，那么无论你向它投入多少个处理器核心，它的运行速度都不会比在单核机器上快。\n\
  \n### 任务、线程和线程池 (ThreadPool)\n\n`Task` 类是并发操作的抽象。你创建一个 `Task` 对象来运行一段代码。如果有足够的处理器或处理器核心可用，你可以实例化多个\
  \ `Task` 对象并启动它们并行运行。\n\n***\n\n![Image](img/Image00005.jpg) 注意\n\n从现在起，我将使用 `processor`（处理器）一词来指代单核处理器或多核处理器上的单个处理器核心。\n\
  \n***\n\n在内部，Windows 运行时 (WinRT) 使用 `Thread` 对象和 `ThreadPool` 类来实现任务并调度它们的执行。.NET\
  \ Framework 从 1.0 版本开始就支持多线程和线程池，由于你正在构建传统的桌面应用程序，可以在代码中直接使用 `System.Threading`\
  \ 命名空间中的 `Thread` 类。然而，`Thread` 类不支持通用 Windows Platform (UWP) 应用程序；相反，你应该使用 `Task`\
  \ 类。\n\n`Task` 类为线程提供了一个强大的抽象，通过它你可以轻松地区分应用程序的并行程度（任务）和并行单元（线程）。在单处理器计算机上，这些项通常是相同的。但在具有多个处理器或多核处理器的计算机上，它们是不同的。如果你直接基于线程设计程序，你会发现你的应用程序可能扩展性不佳；程序将使用你显式创建的线程数量，而操作系统只会调度该数量的线程。如果线程数量远大于可用处理器的数量，可能会导致过载和响应时间变差；如果线程数量少于处理器数量，则会导致效率低下和吞吐量低。\n\
  \nWinRT 优化了实现一组并发任务所需的线程数量，并根据可用处理器的数量高效地调度它们。它实现了一种队列机制，将工作负载分配到分配线程池（通过使用 `ThreadPool`\
  \ 对象实现）的一组线程上。当程序创建一个 `Task` 对象时，该任务被添加到全局队列。当某个线程可用时，该任务从全局队列中移除并由该线程执行。`ThreadPool`\
  \ 类实现了许多优化，并使用工作窃取算法来确保线程被高效调度。\n\n***\n\n![Image](img/Image00005.jpg) 注意\n\n`ThreadPool`\
  \ 类在之前的 .NET Framework 版本中是可用的，但在 .NET Framework 4.0 中得到了显著增强，以支持 `Task`。\n\n***\n\
  \n你应该注意，处理你的任务而创建的线程数量并不一定与处理器的数量相同。取决于工作负载的性质，一个或多个处理器可能忙于为其他应用程序和服务执行高优先级工作。因此，你的应用程序的最佳线程数可能少于机器处理器的数量。或者，应用程序中的一个或多个线程可能在等待长时间内存访问、I/O\
  \ 或网络操作完成，从而导致相应的处理器空闲。在这种情况下，最佳线程数可能超过可用处理器的数量。WinRT 遵循一种被称为“爬山算法”（hill-climbing\
  \ algorithm）的迭代策略来动态确定当前工作负载的理想线程数。\n\n重要的点是，你在代码中需要做的只是将你的应用程序划分或分区为可以并行运行的任务。WinRT\
  \ 负责根据你计算机的处理器架构和工作负载创建相应数量的线程，将你的任务与这些线程关联，并安排它们高效运行。你将工作划分为过多的任务也没关系，因为 WinRT\
  \ 会尝试仅运行实际的并发线程；事实上，我们鼓励你对工作进行“过度分区”（overpartition），因为这有助于确保当你将应用程序移动到具有更多处理器的计算机时，它具有良好的扩展性。\n\
  \n### 创建、运行和控制任务\n\n你可以使用 `Task` 构造函数创建 `Task` 对象。`Task` 构造函数是重载，但所有版本都要求你提供一个 `Action`\
  \ 委托作为参数。第 20 章，“解耦应用程序逻辑和处理事件](#text00027.html_ch20)”说明了 `Action` 委托引用了一个不返回值的方法。当\
  \ `Task` 对象被调度运行时，会调用此委托。以下示例创建一个使用委托运行 `doWork` 方法的 `Task` 对象：\n\n点击此处查看代码\n\n\
  ```csharp\nTask task = new Task(doWork);\n\nprivate void doWork()\n{\n// 任务启动时运行此处代码\n\
  }\n```\n\n***\n\n![Image](img/Image00013.jpg) 提示\n\n默认的 `Action` 类型引用无参数的方法。`Task`\
  \ 构造函数的其他重载接受 `Action<object>` 参数，代表引用单个 `object` 参数的委托。通过这些重载，你可以向任务运行的方法传递数据。以下代码显示了一个示例：\n\
  \n点击此处查看代码\n\n```csharp\nAction<object> action;\naction = doWorkWithObject;\n\n\
  object parameterData = ...;\nTask task = new Task(action, parameterData);\n\nprivate\
  \ void doWorkWithObject(object o)\n{\n}\n```\n\n***\n\n创建 `Task` 对象后，你可以使用 `Start`\
  \ 方法将其设置为运行状态：\n\n```csharp\nTask task = new Task(...);\ntask.Start();\n```\n\n\
  `Start` 方法是重载的，你可以可选指定 `TaskCreationOptions` 对象以提供有关调度和运行任务的提示。\n\n***\n\n![Image](img/Image00148.jpg)\
  \ 更多信息\n\n有关 `TaskCreationOptions` 枚举的更多信息，请参阅 Visual Studio 提供的 .NET Framework\
  \ 类库文档。\n\n创建并运行任务是非常常见的过程，`Task` 类提供了静态 `Run` 方法可以让你组合这些操作。`Run` 方法接受 `Action`\
  \ 委托来指定要执行的操作（类似于 `Task` 构造函数），但会立即启动任务运行。它返回 `Task` 对象的引用。你可以这样使用它：\n\n点击此处查看代码\n\
  \n```csharp\nTask task = Task.Run(() => doWork());\n```\n\n\n\n\n当任务运行的方法完成后，该任务即结束，用于运行任务的线程可以被回收以执行另一个任务。\n\
  \n当一个任务完成时，你可以通过创建一个 `continuation`（延续）来安排调度另一个任务。执行此操作，请调用 `Task` 对象的 `ContinueWith`\
  \ 方法。当 `Task` 对象执行的操作完成时，调度器会自动创建一个新的 `Task` 对象来运行由 `ContinueWith` 方法指定的操作。延续中指定的方法接收一个\
  \ `Task` 参数，调度器会将已完成任务的引用传递给该方法。`ContinueWith` 返回的值是指向新 `Task` 对象的引用。下面的代码示例创建了一个\
  \ `Task` 对象，该对象会运行 `doWork` 方法，并指定了一个延续，该延续会在第一个任务完成后在一个新任务中运行 `doMoreWork` 方法：\n\
  \n点击此处查看代码图像\n\n```\nTask task = new Task(doWork);\n\ntask.Start();\n\nTask newTask\
  \ = task.ContinueWith(doMoreWork);\n\n...\n\nprivate void doWork()\n{\n\n// 任务在启动时运行此代码\n\
  \n...\n}\n\n...\n\nprivate void doMoreWork(Task task)\n{\n\n// 延续在 doWork 完成时运行此代码\n\
  \n...\n}\n```\n\n`ContinueWith` 方法有大量的重载，你可以提供多个参数来指定其他项目，包括一个 `TaskContinuationOptions`\
  \ 值。`TaskContinuationOptions` 类型是一个枚举，它包含了 `TaskCreationOptions` 枚举中所有值的超集。可用的附加值包括：\n\
  \n![Image](img/Image00001.jpg) `NotOnCanceled` 和 `OnlyOnCanceled` `NotOnCanceled`\
  \ 选项指定，只有在前一个操作完成且未被取消时，延续才会运行；而 `OnlyOnCanceled` 选项指定只有在前一个操作被取消时，延续才会运行。本章稍后的\
  \ “取消任务和处理异常 ” 部分描述了如何取消任务。\n\n![Image](img/Image00001.jpg) `NotOnFaulted` 和 `OnlyOnFaulted`\
  \ `NotOnFaulted` 选项表示，只有在前一个操作完成且没有抛出未处理的异常时，延续才会运行。`OnlyOnFaulted` 选项导致延续仅在前一个操作抛出未处理的异常时运行。“取消任务和处理异常\
  \ ” 部分提供了更多关于如何管理任务中异常的信息。\n\n![Image](img/Image00001.jpg) `NotOnRanToCompletion`\
  \ 和 `OnlyOnRanToCompletion` `NotOnRanToCompletion` 选项指定，只有在前一个操作没有成功完成时，延续才会运行；它必须被取消或抛出异常。`OnlyOnRanToCompletion`\
  \ 导致延续仅在前一个操作成功完成时运行。\n\n下面的代码示例展示了如何向任务添加一个延续，该延续仅在初始操作没有抛出未处理的异常时才运行：\n\n点击此处查看代码图像\n\
  \n```\nTask task = new Task(doWork);\n\ntask.ContinueWith(doMoreWork, TaskContinuationOptions.NotOnFaulted);\n\
  \ntask.Start();\n```\n\n调用并行操作的应用程序的一个常见需求是同步任务。`Task` 类提供了 `Wait` 方法，它实现了一种简单的任务协调机制。使用此方法，你可以挂起当前线程的执行直到指定的任务完成，如下：\n\
  \n点击此处查看代码图像\n\n```\nTask task2 = ...\n\ntask2.Start();\n\n...\n\ntask2.Wait();\
  \ // 在此处等待，直到 task2 完成\n```\n\n你可以使用 `Task` 类的静态方法 `WaitAll` 和 `WaitAny` 方法来等待一组任务。这两个方法都接受一个包含一组\
  \ `Task` 对象的 `params` 数组。`WaitAll` 方法会等待所有指定的任务都完成，而 `WaitAny` 则会一直等待，直到至少有一个指定的任务已完成。你可以这样使用它们：\n\
  \n点击此处查看代码图像\n\n```\nTask.WaitAll(task, task2); // 等待 task 和 task2 完成\n\nTask.WaitAny(task,\
  \ task2); // 等待 task 或 task2 其中之一完成\n```\n\n### 使用 `Task` 类实现并行性\n\n在下一个练习中，你将使用\
  \ `Task` 类将应用程序中的处理器密集型代码并行化，并将看到这种并行化如何通过将计算分布在多个处理器核心上来减少应用程序运行所需的时间。\n\n该名为 GraphDemo\
  \ 的应用程序包含一个使用 `Image` 控件显示图表的页面。应用程序通过执行复杂的计算来绘制图表的数据点。\n\n***\n\n![Image](img/Image00005.jpg)\
  \ 注意事项\n\n本章的练习旨在在具有多核处理器的计算机上运行。如果你只有一个单核 CPU，将无法观察到相同的效果。此外，你不应该在练习之间启动任何额外的程序或服务，因为这些可能会影响你看到的结果。\n\
  \n***\n\n### 检查并运行 GraphDemo 单线程应用程序\n\n**1.** 如果尚未启动 Microsoft Visual Studio，请启动它。\n\
  \n**2.** 打开 GraphDemo 解决方案，它位于 `Microsoft Press\\Chapter23\\GraphDemo` 文件夹。\n\n\
  **3.** 在解决方案中，双击 `MainPage.xaml` 以设计视图显示表单。\n\n除了 `Grid` 控件外，表单包含以下重要控件：\n\n- 一个名为\
  \ `graphImage` 的 `Image` 控件。它显示由应用程序渲染的图表。\n- 一个名为 `plotButton` 的 `Button` 控件。用户点击此按钮生成图表数据显示在\
  \ `graphImage` 中。\n\n***\n\n![Image](img/Image00005.jpg) 注意事项\n\n为了保持本练习操作的简单，它将按钮显示在页面上。在生产级应用中，这样的按钮应该位于命令栏上。\n\
  \n***\n\n- 一个名为 `duration` 的 `TextBlock` 控件。应用程序显示生成图表数据所需的时间。\n\n**4.** 在解决方案中，展开\
  \ `MainPage.xaml` 文件，然后双击 `MainPage.xaml.cs` 在代码和文本编辑器中显示表单的代码。\n\n表单使用一个名为 `graphBitmap`\
  \ 的 `WriteableBitmap` 对象（定义在 `Windows.UI.Xaml.Media.Imaging` 命名空间）来渲染图表。变量 `pixelWidth`\
  \ 和 `pixelHeight` 分别指定 `WriteableBitmap` 对象的水平和垂直分辨率：\n\n```csharp\n// 如果可可用内存不足，请减小\
  \ pixelWidth 和 pixelHeight\nprivate int pixelWidth = 15000;\n\nprivate int pixelHeight\
  \ = 10000;\n\nprivate WriteableBitmap graphBitmap = null;\n\n...\n```\n\n***\n\n\
  ![Image](img/Image00005.jpg) 注意事项\n\n此应用程序是在具有 8 GB 内存的桌面级计算机上开发和测试的。如果你的计算机可用内存少于此，你可能需要减小\
  \ `pixelWidth` 和 `pixelHeight` 变量的值；否则应用程序可能会产生 `OutOfMemoryException` 异常。同样，如果你有更多的可用内存，可能想增加这些变量的值以查看本练习的效果。\n\
  \n***\n\n**5.** 检查 `MainPage` 构造函数的最后三行，它们如下：\n\n```csharp\nint dataSize = bytesPerPixel\
  \ * pixelWidth * pixelHeight;\n\ndata = new byte[dataSize];\n\ngraphBitmap = new\
  \ WriteableBitmap(pixelWidth, pixelHeight);\n```\n\n\n\n\n前两行实例化了一个字节数组，该数组将存储图表的数据。此数组的大小取决于\
  \ `WriteableBitmap` 对象的分辨率，由 `pixelWidth` 和 `pixelHeight` 字段决定。此外，此大小必须根据渲染每个像素所需的内存量进行缩放；`WriteableBitmap`\
  \ 类每个像素使用 4 个字节，这些字节指定了每个像素的相对红、绿、蓝强度以及像素的 alpha 混合值。（alpha 混合值决定了像素的透明度和亮度。）\n\n\
  最后一条语句创建了指定分辨率的 `WriteableBitmap` 对象。\n\n### 6. 检查 `plotButton_Click` 方法的代码：\n\n\
  点击此处查看代码图像\n\n```csharp\nprivate void plotButton_Click(object sender, RoutedEventArgs\
  \ e)\n{\n    Random rand = new Random();\n    redValue = (byte)rand.Next(0xFF);\n\
  \    greenValue = (byte)rand.Next(0xFF);\n    blueValue = (byte)rand.Next(0xFF);\n\
  \    Stopwatch watch = Stopwatch.StartNew();\n    generateGraphData(data);\n   \
  \ duration.Text = $\"Duration (ms): {watch.ElapsedMilliseconds}\";\n    Stream pixelStream\
  \ = graphBitmap.PixelBuffer.AsStream();\n    pixelStream.Seek(0, SeekOrigin.Begin);\n\
  \    pixelStream.Write(data, 0, data.Length);\n    graphBitmap.Invalidate();\n \
  \   graphImage.Source = graphBitmap;\n}\n```\n\n此方法在用户点击 `plotButton` 按钮时运行。\n\n\
  稍后练习中你将多次点击此按钮，这将让你看到每当此方法为绘制的点的红、绿、蓝强度生成一组随机值时，都会绘制出一个新版本的图形。（每次点击此按钮时，图表的颜色都会所不同。）\n\
  \n`watch` 变量是一个 `System.Diagnostics.Stopwatch` 对象。`StopWatch` 类型用于对操作计时。`StopWatch`\
  \ 类型的静态方法 `StartNew` 会创建一个新的 `StopWatch` 对象实例并启动其运行。你可以通过检查 `ElapsedMilliseconds`\
  \ 属性来查询 `StopWatch` 对象的运行时间。\n\n`generateGraphData` 方法向 `data` 数组中填充数据，供 `WriteableBitmap`\
  \ 对象显示图表。你将在下一步中检查此方法。\n\n当 `generateGraphData` 方法完成后，经过的时间（毫秒）将出现在持续 `TextBox`\
  \ 控件中。\n\n最后的代码块获取 `data` 数组中的信息并将其复制到 `WriteableBitmap` 对象以进行渲染。简单的方法是创建一个内存流，用于填充\
  \ `WriteableBitmap` 对象的 `PixelBuffer` 属性。然后你可以使用该流的 `Write` 方法将 `data` 数组的内容拷贝到缓冲区。`WriteableBitmap`\
  \ 类的 `Invalidate` 方法请求操作系统使用缓冲区中的信息重绘位图。`Image` 控件的 `Source` 属性指定了 `Image` 控件应该显示的数据。最后语句将\
  \ `Source` 属性设置为 `WriteableBitmap` 对象。\n\n### 7. 检查此处所示 `generateGraphData` 方法的代码：\n\
  \n点击此处查看代码图像\n\n```csharp\nprivate void generateGraphData(byte[] data)\n{\n    int\
  \ a = pixelWidth / 2;\n    int b = a * a;\n    int c = pixelHeight / 2;\n    for\
  \ (int x = 0; x < a; x ++)\n    {\n        int s = x * x;\n        double p = Math.Sqrt(b\
  \ - s);\n        for (double i = -p; i < p; i += 3)\n        {\n            double\
  \ r = Math.Sqrt(s + i * i) / a;\n            double q = (r - 1) * Math.Sin(24 *\
  \ r);\n            double y = i / 3 + (q * c);\n            plotXY(data, (int)(-x\
  \ + (pixelWidth / 2)), (int)(y + (pixelHeight / 2)));\n            plotXY(data,\
  \ (int)(x + (pixelWidth / 2)), (int)(y + (pixelHeight / 2)));\n        }\n    }\n\
  }\n```\n\n此方法执行一系列计算来为相当复杂的图表绘制点。（实际计算并不重要——它只是生成一个看起来具有吸引力的图表。）在计算每个点时，它调用 `plotXY`\
  \ 方法来设置 `data` 数组中对应于这些点的适当字节。图表的点关于 x 轴对称反射，因此每次计算都会调用两次 `plotXY` 方法：一次针对 x 坐标的正值，一次针对负值。\n\
  \n### 8. 检查 `plotXY` 方法：\n\n点击此处查看代码图像\n\n```csharp\nprivate void plotXY(byte[]\
  \ data, int x, int y)\n{\n    int pixelIndex = (x + y * pixelWidth) * bytesPerPixel;\n\
  \    data[pixelIndex] = blueValue;\n    data[pixelIndex + 1] = greenValue;\n   \
  \ data[pixelIndex + 2] = redValue;\n    data[pixelIndex + 3] = 0xBF;\n}\n```\n\n\
  此方法设置 `data` 数组中对应于 x 和 y 坐标的适当字节。\n\n### 9. 在 Debug 菜单中，点击 Start Debugging 以编译并运行应用程序。\n\
  \n### 10. 当 Graph Demo 窗口出现时，点击 Plot Graph，然后等待。\n\n请耐心。应用程序需要几秒钟来生成并显示图表，在此期间应用程序处于无响应状态。\n\
  \n\n\n\n\n## 18. 在任务管理器窗口中，观察 CPU 占用率。你的结果会有所不同，但在双核处理器上，生成图表时的 CPU 占用率可能在 50–55%\
  \ 左右。在四核机器上，CPU 占用率可能在 25% 到 30% 之间，如下图所示。请注意，其他因素（例如你电脑中显卡的类型）也会影响性能：\n\n![Image](img/Image00151.jpg)\n\
  \n## 19. 返回到 Visual Studio 2015 并停止调试。\n\n你现在已经有了应用程序执行计算所需时间的基准。然而，从任务管理器显示的 CPU\
  \ 使用情况可以明显看出，应用程序并没有充分利用可用处理资源。在双核机器上，它只使用了一半以上的 CPU 功率；在四核机器上，它仅使用了略高于四分之一的 CPU。这种现象发生发生是因为应用程序是单线程的，而在\
  \ Windows 应用程序中，单个线程只能为多核处理器上的单个核心提供工作。为了将负载分散到所有可用核心上，你需要将应用程序拆分为多个任务，并安排每个任务由单独线程执行，每个线程运行在不同的核心上。这就是你接下来要做的。\n\
  \n## 使用 Performance Explorer 识别 CPU 瓶颈\n\n`GraphDemo` 应用程序专门设计用于在已知点（在 `generateGraphData`\
  \ 方法中）创建 CPU 瓶颈。在现实世界中，你可能意识到某些问题导致应用程序运行缓慢且无响应，但你可能不知道错误代码位于何处。这就是 Visual Studio\
  \ Performance Explorer 和 Profiler（性能分析器）证明其价值的地方。\n\nProfiler 可以定期对应用程序的运行时状态进行采样，并捕捉当时正在运行语句的信息。某行代码执行的频率越高、该行运行时间越长，该语句被观察到的频率就越高。Profiler\
  \ 使用这些数据生成应用程序的运行时概况，并生成一份详细列出你代码中热点的报告。这些热点对于识别你应该关注优化的区域非常有帮助。接下来的可选步骤将引导你完成这一过程。\n\
  \n![Image](img/Image00005.jpg) 注意：\n\nVisual Studio 2015 社区版中不提供 Performance Explorer\
  \ 和 Profiler。\n\n## 1. 在 Visual Studio 中，在调试 菜单中，指向 Profiler，指向 Performance Explorer，然后点击\
  \ New Performance Session（新建性能会话）。Performance Explorer 窗口应该出现在 Visual Studio 中：\n\
  \n![Image](img/Image00152.jpg)\n\n## 2. 在 Performance Explorer 中，右键点击 `Targets`\
  \ 然后点击 Add Target Project（添加目标项目）。`GraphDemo` 应用程序将被作为目标添加。\n\n## 3. 在 Performance\
  \ Explorer 菜单栏中，点击 `Actions` 然后点击 Start Profiling（开始性能分析）。`GraphDemo` 应用程序开始运行。\n\
  \n## 4. 点击 `Plot Graph`（绘图）并等待图表生成。重复此过程几次，然后关闭 `GraphDemo` 应用程序。\n\n## 5. 返回 Visual\
  \ Studio，等待 Profiler 分析收集到的采样数据并生成报告，该报告看起来应该像所示：\n\n![Image](img/Image00153.jpg)\n\
  \n此报告显示了 CPU 占用率（应该与你之前使用任务管理器观察到的相似，每当你点击 Plot Graph 时就会出现峰值）以及应用程序的 Hot Path（热路径）。该路径识别了应用程序中消耗最多处理资源的序列。在这种情况下，应用程序\
  \ 98% 的时间花在了 `plotButton_Click` 方法中，91.06% 的时间花在了执行 `generateGraphData` 方法上，35.93%\
  \ 的时间花在了 `plotXY` 方法中。运行时（`coreclr.dll`）也消耗了大量时间（23.54%）。\n\n你可以放大 CPU 占用率图表的特定区域（使用鼠标点击并拖动），并过滤报告以仅涵盖采样数据的放大部分。\n\
  \n## 6. 在报告的 Hot Path 部分，点击 `GraphDemo.MainPage.generateGraphData` 方法。Report 窗口显示方法的详细信息，以及执行最耗时语句占\
  \ CPU 时间的比例：\n\n![Image](img/Image00154.jpg)\n\n在这种情况下，你可以看到 `for` 循环中的代码应该是任何优化工作的首要目标。\n\
  \n## 修改 GraphDemo 应用程序使用 Task 对象\n\n## 1. 返回到 Visual Studio 2015，如果 `MainPage.xaml.cs`\
  \ 文件未打开，请在代码和文本编辑器窗口中显示它。\n\n## 2. 检查 `generateGraphData` 方法。\n\n该方法的目的是填充 `data`\
  \ 数组中的项。它通过基于 `x` 循环控制变量（此处加粗显示）的外部 `for` 循环来遍历数组：\n\n点击此处查看代码图像\n\n```cs\nprivate\
  \ void generateGraphData(byte[] data)\n{\n    int a = pixelWidth / 2;\n    int b\
  \ = a * a;\n    int c = pixelHeight / 2;\n    for (int x = 0; x < a; x ++)\n   \
  \ {\n        int s = x * x;\n        double p = Math.Sqrt(b - s);\n        for (double\
  \ i = -p; i < p; i += 3)\n        {\n            double r = Math.Sqrt(s + i) / a;\n\
  \        }\n    }\n}\n```\n（注：提供的源代码代码片段是不完整的；我已根据上下文进行了清理）。\n\n由于该循环中一次迭代的计算与其他迭代的计算是独立的，因此，将工作拆分并在单独的处理器上运行是合理的。\n\
  \n## 3. 修改 `generateGraphData` 方法的定义以接收两个额外的 `int` 参数，即 `partitionStart` 和 `partitionEnd`，如下所示粗所示：\n\
  \n点击此处查看代码图像\n\n```cs\nprivate void generateGraphData(byte[] data, int partitionStart,\
  \ int partitionEnd)\n{\n    // ...\n}\n```\n\n## 4. 在 `generateGraphData` 方法中，更改外部\
  \ `for` 循环以便在 `partitionStart` 和 `partitionEnd` 的值之间迭代，如下加粗所示：\n\n点击此处查看代码图像\n\n\
  ```cs\nprivate void generateGraphData(byte[] data, int partitionStart, int partitionEnd)\n\
  {\n    // ...\n    for (int x = partitionStart; x < partitionEnd; x++)\n    {\n\
  \        // ...\n    }\n}\n```\n\n## 5. 在代码和文本编辑器中，在 `MainPage.xaml.cs` 文件顶部的列表中添加以下\
  \ `using` 指令：\n\n`using System.Threading.Tasks;`\n\n## 6. 在 `plotButton_Click` 方法中，注释掉调用\
  \ `generateGraphData` 方法的语句，并添加后续代码中加粗所示创建并启动 `Task` 对象的语句：\n\n点击此处查看代码图像\n\n```cs\n\
  Stopwatch watch = Stopwatch.StartNew();\n// generateGraphData(data);\nTask first\
  \ = Task.Run(() => generateGraphData(data, 0, pixelWidth / 4));\n```\n\n任务运行由表达式指定的代码。`partitionStart`\
  \ 和 `partitionEnd` 参数的值表明 `Task` 对象计算图表前半部分的数据。（完整图表的数据由在 0 到 `pixelWidth / 2` 之间范围内绘制的点组成。）\n\
  \n## 7. 添加另一个在另一个线程上创建并运行第二个 `Task` 对象的语句，如下加粗代码所示：\n\n点击此处查看代码图像\n\n```cs\nTask\
  \ first = Task.Run(() => generateGraphData(data, 0, pixelWidth / 4));\nTask second\
  \ = Task.Run(() => generateGraphData(data, pixelWidth / 4, pixelWidth / 2));\n```\n\
  \n此 `Task` 对象调用 `generateGraphData` 方法并计算 `pixelWidth / 4` 到 `pixelWidth / 2` 之间的数据。\n\
  \n\n\n\n\n## 8. 添加以下加粗所示语句，该语句将等待两个 `Task` 对象完成其工作后再继续：\n\n点击此处查看代码图像\n\n```c\n\
  Task second = Task.Run(() => generateGraphData(data, pixelWidth / 4, pixelWidth\
  \ / 2));\n\nTask.WaitAll(first, second);\n```\n\n...\n\n## 9. 在“调试”（Debug）菜单上，点击“开始调试”（Start\
  \ Debugging）来编译并运行应用程序。调整显示，确保你可以看到任务管理器窗口显示 CPU 利用率。\n\n## 10. 在 Graph Demo 窗口中，点击“绘制图表”（Plot\
  \ Graph）。在任务管理器窗口中，等待 CPU 利用率趋于平稳。\n\n## 11. 重复步骤 10 几次，在每次点击之间等待 CPU 利用率趋于稳定。记录每次点击按钮时记录的持续时间，然后计算平均值。\n\
  \n你会发现应用程序的运行速度比以前快得多。在我的电脑上，典型时间缩短到了 2858 毫秒——时间减少了大约 40%。\n\n在大多数情况下，执行计算所需的时间将缩减近一半，但应用程序仍然包含一些单线程元素，例如在数据生成后实际显示图表的逻辑。这就是为什么总时间仍然比上一个版本所需的一半以上。\n\
  \n## 12. 切换到任务管理器窗口。\n\n你应该发现应用程序使用了更多的 CPU 核心。在我的四核机器上，每当我点击一次“绘制图表”时，CPU 使用率都会达到约\
  \ 50% 的峰值。这是因为两个任务分别运行在不同的核心上，但剩余的两个核心处于空闲状态。如果你有一台双核机器，你可能会在每次生成图表时看到处理器利用率短时间内地接近\
  \ 100%。\n\n![Image](img/Image00155.jpg)\n\n如果你有一台四核电脑，可以通过额外添加两个 `Task` 对象并在 `plotButton_Click`\
  \ 方法中将工作分为四部分来进一步增加 CPU 利用率并进一步缩短时间，如下所示加粗所示：\n\n点击此处查看代码图像\n\n...\n\n```c\nTask\
  \ first = Task.Run(() => generateGraphData(data, 0, pixelWidth / 8));\n\nTask second\
  \ = Task.Run(() => generateGraphData(data, pixelWidth / 8, pixelWidth / 4));\n\n\
  Task third = Task.Run(() => generateGraphData(data, pixelWidth / 4, pixelWidth *\
  \ 3 / 8));\n\nTask fourth = Task.Run(() => generateGraphData(data, pixelWidth *\
  \ 3 / 8, pixelWidth / 2));\n\nTask.WaitAll(first, second, third, fourth);\n```\n\
  \n...\n\n如果你只有一个双核处理器，你仍然可以尝试这种修改，你应该会注意到时间上微小的有益影响。这主要是因为 CLR 使用的算法优化了每个任务线程调度的方式。\n\
  \n#### 使用 `Parallel` 类抽象任务\n\n通过使用 `Task` 类，你可以完全控制应用程序创建的任务的任务数量。然而，你必须修改应用程序的设计以适应\
  \ `Task` 对象的使用。你还必须添加代码来同步操作；应用程序只有在所有任务完成后才能渲染图表。在复杂的应用程序中，任务的同步可能会变成一个非平凡且容易出错的过程。\n\
  \n使用 `Parallel` 类，你可以在无需重新设计应用程序的情况下将某些常见的编程结构并行化。在内部，`Parallel` 类会创建它自己的 `Task`\
  \ 对象，并在它们完成时自动同步这些任务。`Parallel` 类位于 `System.Threading.Tasks` 命名空间，并提供了一组静态方法，你可以使用这些方法来指示尽可能并行方式运行代码。这些方法如下：\n\
  \n![Image](img/Image00001.jpg) **Parallel.For** 你可以使用此方法代替 C# 的 `for` 语句。它定义了一个循环，该循环中的迭代可以通过任务并行运行。此方法有许多重载，但每个重载的通用原理是相同的：你指定一个起始值、一个结束值以及一个接收整数参数的方法的引用。该方法将在起始值和指定的结束值减\
  \ 1 之间的每个值上执行，并且参数将用一个指定当前值的整数进行填充。例如，考虑以下顺序执行每次迭代的简单 `for` 循环：\n\n点击此处查看代码图像\n\n\
  ```c\nfor (int x = 0; x < 100; x++)\n{\n    // 执行循环处理\n}\n```\n\n取决于循环体执行的处理操作，你可能可以将此循环替换为\
  \ `Parallel.For` 结构，该结构可以并行执行迭代，如下：\n\n点击此处查看代码图像\n\n```c\nParallel.For(0, 100,\
  \ performLoopProcessing);\n```\n\n...\n\n```c\nprivate void performLoopProcessing(int\
  \ x)\n{\n    // 执行循环处理\n}\n```\n\n使用 `Parallel.For` 方法的重载，你可以提供每个线程私有的本地数据，为由 `For`\
  \ 方法运行的任务指定各种选项，并创建一个用于传递状态的 `ParallelLoopState` 对象。（*ParallelLoopState* 将在本章稍后介绍。）\n\
  \n![Image](img/Image00155.jpg) [注：此处图片编号可能有误，根据上文推断应为 Image00001.jpg] **Parallel.ForEach<T>**\
  \ 你可以使用此方法代替 C# 的 `foreach` 语句。像 `For` 方法一样， `ForEach` 定义了一个可以通过任务并行运行迭代的循环。你指定一个实现泛型\
  \ `IEnumerable<T>` 的集合和一个接收类型为 `T` 参数的方法引用。该方法会对集合中的每个项执行一次，并将项作为参数传递。\n\n![Image](img/Image00001.jpg)\
  \ **Parallel.Invoke** 你可以使用此方法并行任务执行一组无参数的方法调用。你指定一组无参数且无返回值的委托方法（或 Lambda 表达式）。每个方法调用可以在单独线程上运行，顺序任意。例如，以下代码执行了一系列方法调用：\n\
  \n```c\ndoWork();\ndoMoreWork();\ndoYetWork();\n```\n\n你可以用以下代码替换这些语句，它通过一系列任务来调用这些方法：\n\
  \n```c\nParallel.Invoke(doWork, doMoreWork, doYetWork);\n```\n\n\n\n\n这是 GraphDemo\
  \ 程序的副本。它目前尚未使用任务功能。\n\n2. 在解决方案管理器（Solution Explorer）中，找到 `GraphDemo` 项目，展开 `MainPage.xaml`\
  \ 节点，然后双击 `MainPage.xaml.cs`，在代码和文本编辑器中显示表单的代码。\n\n3. 在文件顶部的指令列表中添加以下 `using` 指令：\n\
  \n```csharp\nusing System.Threading.Tasks;\n```\n\n4. 找到 `generateGraphData` 方法。它看起来如下：\n\
  \n点击此处查看代码图像\n\n```csharp\nprivate void generateGraphData(byte[] data)\n{\n    int\
  \ a = pixelWidth / 2;\n    int b = a * a;\n    int c = pixelHeight / 2;\n    for\
  \ (int x = 0; x < a; x++)\n    {\n        int s = x * x;\n        double p = Math.Sqrt(b\
  \ - s);\n        for (double i = -p; i < p; i += 3)\n        {\n            double\
  \ r = Math.Sqrt(s + i * i) / a;\n            double q = (r - 1) * Math.Sin(24 *\
  \ r);\n            double y = i / 3 + (q * c);\n            plotXY(data, (int)(-x\
  \ + (pixelWidth / 2)), (int)(y + (pixelHeight / 2)));\n            plotXY(data,\
  \ (int)(x + (pixelWidth / 2)), (int)(y + (pixelHeight / 2)));\n        }\n    }\n\
  }\n```\n\n遍历整数变量 `x` 值的外层 `for` 循环是并行化的理想选择。你可能也会考虑基于变量 `i` 的内部循环，但由于 `i` 的类型，并行化该循环需要更多精力（`Parallel`\
  \ 类中的方法期望控制变量为整数）。此外，如果你有像这段代码中这样的嵌套循环，良好的做法是先并行化外层循环，然后测试应用程序的性能是否足够。如果不足，则按照从外层到内层的顺序处理嵌套循环并进行并行化，在修改每一层后测试性能。你会发现，在许多情况下，并行化外层循环对性能的影响最大，而修改内部循环的影响会变得微不足道。\n\
  \n5. 剪切 `for` 循环体内的代码，并使用这些代码创建一个名为 `calculateData` 的私有 `void` 方法。`calculateData`\
  \ 方法应一个名为 `x` 的 `int` 参数和一个名为 `data` 的字节数组。此外，将声明本地变量 `a`、`b` 和 `c` 的语句从 `generateGraphData`\
  \ 方法移动到 `calculateData` 方法的开头。下面的代码显示了移除这些代码后的 `generateGraphData` 方法以及 `calculateData`\
  \ 方法（请勿尝试编译此代码）：\n\n点击此处查看代码图像\n\n```csharp\nprivate void generateGraphData(byte[]\
  \ data)\n{\n    for (int x = 0; x < a; x++)\n    {\n    }\n}\n\nprivate void calculateData(int\
  \ x, byte[] data)\n{\n    int a = pixelWidth / 2;\n    int b = a * a;\n    int c\
  \ = pixelHeight / 2;\n    int s = x * x;\n    double p = Math.Sqrt(b - s);\n   \
  \ for (double i = -p; i < p; i += 3)\n    {\n        double r = Math.Sqrt(s + i\
  \ * i) / a;\n        double q = (r - 1) * Math.Sin(24 * r);\n        double y =\
  \ i / 3 + (q * c);\n        plotXY(data, (int)(-x + (pixelWidth / 2)), (int)(y +\
  \ (pixelHeight / 2)));\n        plotXY(data, (int)(x + (pixelWidth / 2)), (int)(y\
  \ + (pixelHeight / 2)));\n    }\n}\n```\n\n6. 在 `generateGraphData` 方法中，将 `for`\
  \ 循环替换为调用静态 `Parallel.For` 方法的语句：\n\n点击此处查看代码图像\n\n```csharp\nprivate void generateGraphData(byte[]\
  \ data)\n{\n    Parallel.For(0, pixelWidth / 2, x => calculateData(x, data));\n\
  }\n```\n\n此代码是原始 `for` 循环的并行等效实现。它遍历从 0 到 `pixelWidth / 2 – 1` 的所有值。每次调用都通过一个任务运行，每个任务可能会运行多次迭代。`Parallel.For`\
  \ 方法仅在它创建的所有任务完成工作后才会结束。请记住，`Parallel.For` 方法期望最后一个参数是一个接受单个整数参数的方法。它将当前循环索引作为参数传递给该方法。在这个示例中，`calculateData`\
  \ 方法不符合所需的签名，因为它有两个参数：一个整数和一个字节数组。由于这个原因，代码使用了 Lambda 表达式作为适配器，使用适当的参数调用 `calculateData`\
  \ 方法。\n\n7. 在调试（Debug）菜单上，点击开始调试（Start Debugging）以生成并运行应用程序。\n\n8. 在 Graph Demo\
  \ 窗口中，点击绘图（Plot Graph）。当图表出现在 Graph Demo 窗口中时，记录生成图表所需的时间。重复此操作几次以获得平均值。\n\n在 Graph\
  \ Demo 窗口中，点击绘图。你会注意到，无论你使用的是双核还是四核计算机，CPU 使用率都会更接近 100%。![Image0156)\n\n9. 返回 Visual\
  \ Studio 并停止调试。\n\n#### 何时不应使用 Parallel\n\n使用 `Parallel` 类的另一个关键考虑因素是并行操作应该是独立的。例如，如果你尝试使用\
  \ `Parallel.For` 来并行化一个迭代之间存在相互依赖的循环，结果将是不可预测的。\n\n要理解我的意思，请查看以下代码（你可以在 `ParallelLoop`\
  \ 解决方案中找到此示例，该方案位于 `\\Microsoft Press\\VCS\\Chapter23\\ParallelLoop` 文件夹）：\n\n点击此处查看代码图像\n\
  \n```csharp\nusing System;\nusing System.Threading;\nusing System.Threading.Tasks;\n\
  \nnamespace ParallelLoop\n{\n    class Program\n    {\n        private static int\
  \ accumulator = 0;\n\n        static void Main(string[] args)\n        {\n     \
  \       for (int i = 0; i < 100; i++)\n            {\n                AddToAccumulator(i);\n\
  \            }\n            Console.WriteLine($\"Accumulator is {accumulator}\"\
  );\n        }\n\n        private static void AddToAccumulator(int data)\n      \
  \  {\n            if ((accumulator % 2) == 0)\n            {\n                accumulator\
  \ += data;\n            }\n            else\n            {\n                accumulator\
  \ -= data;\n            }\n        }\n    }\n}\n```\n\n此程序遍历从 0 到 99 的值，并依次用每个值调用\
  \ `AddToAccumulator` 方法。`AddToAccumulator` 方法检查 `accumulator` 变量当前值，如果是偶数，则将参数值加到\
  \ `accumulator` 变量上；否则减去参数值。程序结束后显示结果。如果你运行此程序，输出值应该是 -100。\n\n为了增加这个简单应用程序的并行程度，你可能会尝试将\
  \ `Main` 方法中的 `for` 循环替换为 `Parallel.For`，如下：\n\n点击此处查看代码图像\n\n```csharp\nstatic\
  \ void Main(string[] args)\n{\n    Parallel.For(0, 100, AddToAccumulator);\n   \
  \ Console.WriteLine($\"Accumulator is {accumulator}\");\n}\n```\n\n\n\n然而，无法保证为运行\
  \ `AddToAccumulator` 方法的多次调用而创建的任务会按照特定顺序执行。（该代码也不是线程安全的，因为运行任务的多个线程可能会尝试并发修改 `accumulator`\
  \ 变量。）`AddToAccumulator` 方法计算出的值取决于所维护的顺序，因此，这种修改的结果是，应用程序现在每次运行时都可能生成不同的值。在某种简单的情况下，你可能并不会实际看到计算出的值有任何变化，因为\
  \ `AddToAccumulator` 方法运行非常快，且 .NET Framework 可能会选择使用同一个线程按顺序执行每次调用。但是，如果你对 `AddToAccumulator`\
  \ 方法进行以下更改（如**加粗**所示），你将得到不同的结果：\n\n点击此处查看代码图像\n\n```csharp\nprivate static void\
  \ AddToAccumulator(int data)\n{\n    if ((accumulator % 2) == 0)\n    {\n      \
  \  accumulator += data;\n        Thread.Sleep(10); // 等待 10 毫秒\n    }\n    else\n\
  \    {\n        accumulator -= data;\n    }\n}\n```\n\n`Thread.Sleep` 方法仅仅是导致当前线程等待指定的时间。此修改模拟了线程执行额外的处理，并影响了\
  \ `Parallel` 类调度任务的方式，这些任务现在运行在不同的线程上，导致了不同的顺序。\n\n通用规则是，只有当你能够保证循环的每次迭代都是独立的，并且对代码进行了彻底测试时，才使用\
  \ `Parallel.For` 和 `Parallel.ForEach`。类似的考虑也适用于 `Parallel.Invoke`：只有当方法调用是独立的且应用程序不依赖于它们按特定顺序运行运行时，才使用此结构进行方法调用。\n\
  \n## 取消任务和处理异常\n\n执行长时间运行的应用程序的一个常见需求是在必要时停止这些操作的能力。然而，你不应该简单地中止任务，因为这会导致应用程序中的数据处于不确定状态。相反，`Task`\
  \ 类实现了一种协作取消策略。协作取消允许任务选择一个方便的时间点停止处理，并允许它在需要时撤销取消之前已执行的任何工作。\n\n### 协作取消的机制\n\n\
  协作取消基于 `cancellation token`（取消令牌）的概念。取消令牌是一个表示表示取消一个或多个任务请求的结构。任务运行的方法应该包含一个 `System.Threading.CancellationToken`\
  \ 参数。想要取消任务的应用程序会将该参数的布尔属性 `IsCancellationRequested` 设置为 `true`。在任务中运行的方法可以在处理过程的各个点查询此属性。如果该属性在任何点被设置为\
  \ `true`，它就知道应用程序已请求取消该任务。此外，方法知道它到为止做了哪些工作，因此在需要时它可以撤销任何更改并完成。或者，方法也可以简单地忽略该请求并继续运行。\n\
  \n***\n\n![图像](img/Image00013.jpg) 提示\n\n你应该频繁检查任务中的取消令牌，但频率不要高到会对任务的性能产生不利影响。如果可能，你的目标应该是至少每\
  \ 10 毫秒检查一次取消情况，但频率不能高于每 1 毫秒一次。\n\n***\n\n应用程序通过创建 `System.Threading.CancellationTokenSource`\
  \ 对象并查询该对象的 `Token` 属性来获取 `CancellationToken`。然后应用程序可以将此 `CancellationToken` 对象作为参数传递给应用程序创建并运行的任务所启动的任何方法。如果应用程序需要取消任务，它会调用\
  \ `CancellationTokenSource` 对象的 `Cancel` 方法。此方法会将传递给所有任务的 `CancellationToken` 的\
  \ `IsCancellationRequested` 属性设置为 `true`。\n\n以下代码示例显示了如何创建取消令牌并使用它取消任务。`initiateTasks`\
  \ 方法实例化 `cancellationTokenSource` 变量，并获取通过该变量提供的 `CancellationToken` 对象的引用。随后代码创建并运行了一个执行\
  \ `doWork` 方法的任务。稍后，代码调用取消令牌源的 `Cancel` 方法，从而设置取消令牌。`doWork` 方法查询取消令牌的 `IsCancellationRequested`\
  \ 属性。如果该属性被设置，方法将终止；否则，它将继续运行。\n\n点击此处查看代码图像\n\n```csharp\npublic class MyApplication\n\
  {\n    ...\n    // 创建并管理任务的方法\n    private void initiateTasks()\n    {\n       \
  \ // 创建取消令牌源并获取取消令牌\n        CancellationTokenSource cancellationTokenSource = new\
  \ CancellationTokenSource();\n        CancellationToken cancellationToken = cancellationTokenSource.Token;\n\
  \        // 创建任务并启动运行 doWork 方法\n        Task myTask = Task.Run(() => doWork(cancellationToken));\n\
  \        ...\n        if (...)\n        {\n            // 取消任务\n            cancellationTokenSource.Cancel();\n\
  \        }\n        ...\n    }\n\n    // 由任务运行的方法\n    private void doWork(CancellationToken\
  \ token)\n    {\n        ...\n        // 如果应用程序已设置取消令牌，则完成处理\n        if (token.IsCancellationRequested)\n\
  \        {\n            // 清理并完成\n            ...\n            return;\n       \
  \ }\n        // 如果任务未被取消，则按常继续运行\n        ...\n    }\n}\n```\n\n除了对取消处理提供高程度的控制外，这种方法可以扩展到任意数量的任务；你可以启动多个任务并将同一个\
  \ `CancellationToken` 对象传递给它们。如果对 `CancellationTokenSource` 对象调用 `Cancel` 方法，每个任务都会检查\
  \ `IsCancellationRequested` 属性是否被设置并相应处理。\n\n你还可以使用 `Register` 方法向取消令牌注册一个回调方法（`Action`\
  \ 委托的形式）。当应用程序调用相应的 `CancellationTokenSource` 对象的 `Cancel` 方法时，该回调就会运行。但无法无法它何时执行；它可能在任务执行自己的处理之前或之后执行。\n\
  \n点击此处查看代码图像\n\n```csharp\n...\ncancellationToken.Register(doAdditionalWork);\n\
  ...\nprivate void doAdditionalWork()\n{\n    // 执行额外的取消处理\n}\n```\n\n在下一个练习中，你为\
  \ GraphDemo 应用程序添加取消功能。\n\n## 为 GraphDemo 应用程序添加取消功能\n\n**1.** 使用 Visual Studio\
