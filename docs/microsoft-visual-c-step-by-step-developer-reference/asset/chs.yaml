  \ 变量的值。注意它没有从原始的 7 月 4 日发生变化。\n\n如果 `Date` 是一个类，创建副本将引用内存中与原始实例相同的对象。因此，更改原始实例中的月份也会更改副本引用的日期。你将在下面的步骤中验证这一结论。\n\
