  这在屏幕底部添加了一个名为 `messageBar` 的 `TextBlock` 控件。你将使用此控件显示来自 `Auditor` 和 `Shipper` 对象的消息。\n\
  \n14. 在代码编辑器窗口中显示 `MainPage.xaml.cs` 文件。找到 `CheckoutButtonClicked` 方法，并删除显示订单摘要的代码。删除代码后，`try`\
  \ 块如下：\n\n```csharp\nprivate void CheckoutButtonClicked(object sender, RoutedEventArgs\
  \ e)\n{\n    try\n    {\n        // 执行结账\n        this.checkoutController.StartCheckout(this.order);\n\
  \        // 清空订单，以便用户可以使用新订单重新开始\n        this.order = new Order { Date = DateTime.Now,\
  \ Items = new List<OrderItem>(),\n            OrderID = Guid.NewGuid(), TotalValue\
  \ = 0 };\n        this.orderDetails.DataContext = null;\n        this.orderValue.Text\
  \ = $\"{this.order.TotalValue:C}\";\n        this.listViewHeader.Visibility = Visibility.Collapsed;\n\
  \        this.checkout.IsEnabled = false;\n    }\n    catch (Exception ex)\n   \
  \ {\n        ...\n    }\n}\n```\n\n15. 为 `MainPage` 类添加一个名为 `displayMessage` 的私有方法。该方法接受一个名为\
  \ `message` 的字符串参数并返回 `void`。在该体内，添加一条语句将 `message` 参数的值追加到 `messageBar` `TextBlock`\
  \ 控件的 `Text` 属性中，并在后面跟一个换行符，如下文加粗所示：\n\n```csharp\nprivate void displayMessage(string\
  \ message)\n{\n    this.messageBar.Text += message + \"\\n\";\n}\n```\n这段代码使得消息出现在表单底部的消息区域。\n\
  \n16. 找到 `MainPage` 类的构造函数，并添加所示的代码：\n\n```csharp\npublic MainPage()\n{\n    ...\n\
  \    this.auditor = new Auditor();\n    this.shipper = new Shipper();\n    this.checkoutController\
  \ = new CheckoutController();\n    this.checkoutController.CheckoutProcessing +=\
  \ this.auditor.AuditOrder;\n    this.checkoutController.CheckoutProcessing += this.shipper.ShipOrder;\n\
  }\n```\n\n\n\n\n\n```csharp\nthis.auditor.AuditProcessingComplete += this.displayMessage;\n\
  \nthis.shipper.ShipProcessingComplete += this.displayMessage;\n```\n\n这些语句订阅了 `Auditor`\
  \ 和 `Shipper` 对象暴露的事件。当事件被触发时，`displayMessage` 方法就会运行。注意，同一个方法处理了这两个事件。\n\n17. 在调试（Debug）菜单上，点击开始调试（Start\
  \ Debugging）以编译并运行应用程序。\n\n**18.** 当 Wide World Importers 表单出现，选择某些项目（包含一个年龄限制项目），然后点击结账（Checkout）。\n\
  \n**19.** 验证表单底部 `TextBlock` 中出现“Audit record written”（审计记录已写入）消息，随后出现“Dispatch\
  \ note generated”（发货单已生成）消息：\n\n![Image](img/Image00137.jpg)\n\n**20.** 下订单并注意每次点击结账时出现的新消息（当消息区域填满时，你可能需要向下滚动才能看到）。\n\
  \n**21.** 完成后，返回 Visual Studio 2015 并停止调试。\n\n## 总结\n\n在本章中，你学习了如何使用委托来引用方法并调用这些方法。你还学习了如何定义可以使用委托运行的\
  \ lambda 表达式。最后，你学习了如何定义和使用事件来触发方法的执行。\n\n![Image](img/Image00001.jpg) 如果你想继续阅读下一章，请保持\
