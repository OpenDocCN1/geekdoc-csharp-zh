  \ `Tree.cs`。当提示时，允许 Visual Studio 同时更改类名和文件名。\n5. 在代码和文本编辑器窗口中，将 `Tree` 类的定义更改 `Tree<TItem>`，如下代码中的**加粗**所示：\n\
