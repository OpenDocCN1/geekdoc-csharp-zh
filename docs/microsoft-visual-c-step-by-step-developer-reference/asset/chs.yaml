  \n### 5. 在“更改身份验证”对话框中，选择 `No Authentication`（无身份验证），然后点击 `OK` 返回“新建 ASP.NET 项目”对话框。\n\
  \n***\n\n![Image](img/Image00005.jpg) 备注\n\n`ASP.NET Web API` 模板可以生成处理用户登录的代码，但如果你将服务部署到云端，Azure\
  \ 提供了了自己的可扩展身份和访问管理系统，这比将安全处理嵌入你自己的代码中更优。Azure 安全不在本书的范围之内，但有关更多信息，请参阅 `http://azure.microsoft.com/services/active-directory/`\
  \ 中的“Azure Active Directory”以及 `http://azure.microsoft.com/services/active-directory/`\
  \ 中的“Azure Multi-Factor Authentication”。\n\n***\n\n### 6. 在“新建 ASP.NET 项目”对话框中，确保\
