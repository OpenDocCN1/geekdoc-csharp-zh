  \ C# 中表达式评估的方式。\n## 快速参考\n![Image](img/Image00040.jpg)\n## 第 3 章 编写方法和应用作用域\n完成本章后，你将能够：\n\
  - 声明并调用方法。\n- 从方法返回信息。\n- 使用集成调试器进入和跳出方法。\n在第 2 章 中“处理变量、运算符和表达式”，你学习了如何声明变量、如何使用运算符创建表达式，以及优先级和结合性如何控制表达式评估的方式。在本章中，你将学习方法。你将看到如何声明和调用方法，如何使用参数和参数向方法传递信息，以及如何通过\
  \ `return` 语句从方法返回信息。你还将看到如何使用 Microsoft Visual Studio 2015 集成调试器进入和跳出方法。当方法执行不符合预期而需要追踪执行过程时，这些信息非常有用。\n\
  ### 创建方法\n*方法*是命名的语句序列。如果你以前使用过 C、C++ 或 Microsoft Visual Basic 等语言编程，你会发现方法类似于函数或子程序。方法有一个名称和方法体。方法名应该是有意义的标识符，指示方法的整体目的（例如\
  \ `calculateIncomeTax`）。方法体包含调用方法时执行的实际语句。此外，方法可以接收某些数据进行处理，并返回信息，这些通常是处理的结果。方法是一种基础且强大的机制。\n\
  ## 声明方法\nC# 方法的声明语法如下：\n点击此处查看代码图像\n\n\n```csharp\n{\n}\n\n\n\n\n\n\n\n\n\n\n\n\n\
  \nint addValues(int leftHandSide, int rightHandSide)\n    // ...\n    // ...\n```\n\
  ***\n![Image](img/Image00005.jpg) # 注意\n你必须显式地指定任何参数的类型以及方法的返回类型。你不能使用 `var` 关键字。\n\
  ***\n下面是一个名为 `showResult` 的方法的定义，它不返回值并有一个单一的 `int` 参数名为 `answer`：\n```csharp\n\
  {\n}\n\n\n\n\n\n\n\n\n\nint addValues(int leftHandSide, int rightHandSide)\n   \
  \ // ...\n    // ...\n```\n如果你想让一个方法返回信息（即其返回类型不是 `void`），你必须在方法体处理的末尾包含一个 `return`\
  \ 语句。`return` 语句由关键字 `return` 后面跟上一个指定返回值的表达式和一个分号组成。该表达式的类型必须与方法声明中指定的类型相同。例如，如果方法返回\
  \ `int`，则 `return` 语句必须返回一个 `int`；否则，你的程序将无法编译。这是一个带有 `return` 语句的方法示例：\n点击此处查看代码图片\n\
  ```csharp\n{\n    // method body statements go here\n}\n\n\n\n\nreturnType methodName\
  \ ( parameterList )\n    // method body statements go here\n```\n### 方法声明\n以下是构成声明的元素描述：\n\
  ![Image](img/Image00001.jpg) ![Image](img/Image00001.jpg) `returnType` 是一个类型的名称，它指定了方法在处理后返回的信息的种类。它可以是任何类型，例如\
  \ `int` 或 `string`。如果你正在编写一个不返回值的方法，你必须使用关键字 `void` 来替替返回类型。\n![Image](img/Image00001.jpg)\
  \ `methodName` 是用于调用方法的名称。方法名遵循与变量名相同的相同的标识符规则。例如，`addValues` 是一个有效的方法名，而 `add$Values`\
  \ 则不是。目前，你应该对方法名遵循驼峰命名法（camelCase）规范；例如，`displayCustomer`。\n![Image](img/Image00001.jpg)\
  \ `parameterList` 是可选的，它描述了你可以传递方法进行处理的信息类型和名称。你在左括号和右括号 `()` 之间编写参数，就像声明变量一样，类型名称后跟着参数名称。如果你编写的方法有两个或多个参数，你必须用逗号将它们分隔开。\n\
  ![Image](img/Image00001.jpg) 方法体语句是在调用方法时运行的代码行。它们被包含在左大括号和右大括号 `{ }` 之间。\n***\n\
