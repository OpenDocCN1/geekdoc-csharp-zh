  \n## 快速参考\n\n![Image](img/Image00161.jpg)![Image](img/Image00162.jpg)![Image](img/Image00163.jpg)\n\
  \n## 第 24 章 通过执行异步操作提高响应时间\n\n完成本章后，你将能够：\n\n![Image](img/Image00001.jpg) 定义并使用异步方法，提高执行长时间运行和\
  \ I/O 密集型操作应用程序的交互响应时间。\n\n![Image](img/Image00001.jpg) 解释如何通过并行化来减少执行复杂 LINQ 查询所需的时间。\n\
  \n![Image](img/Image00001.jpg) 使用并发集合类在并行任务之间安全地共享数据。\n\n第 23 章，“使用任务提高吞吐量”演示了如何使用\
  \ `Task` 类执行并行操作并提高计算密集型应用程序的吞吐量。然而，虽然最大化应用程序可用的处理能力可以使其运行得更快，但响应能力同样重要。记住，Windows\
  \ 用户界面是通过使用单个执行线程运行的，但用户期望在他们点击表单上的按钮时应用程序能够做出响应，即使应用程序当前正在执行大型且复杂的计算。此外，某些任务即使不是计算密集型的也可能需要很长时间运行（例如，等待从远程网站跨网络接收信息的\
  \ I/O 密集型任务），在等待可能在不确定何时发生的事件时阻塞用户交互，显然不是良好的设计实践。这两个问题的解决方案是相同的：异步执行任务，并留出用户界面线程来处理用户交互。\n\
  \n响应时间问题不仅限于用户界面。例如，第 21 章，“使用查询表达式查询内存数据”展示了你如何使用语言集成查询 (LINQ) 以声明式方式访问存储在内存中的数据。典型的\
  \ LINQ 查询会生成一个可枚举的结果集，你可以串行迭代该集合以检索数据。如果用于生成结果集的数据源很大，运行 LINQ 查询可能会花费很长时间。许多面临查询优化挑战的数据库管理系统通过使用算法来解决此问题，这些算法将识别查询数据的过程分解为一系列任务，然后并行运行这些任务，并在任务完成后合并结果以生成完整的结果集。Microsoft\
  \ .NET Framework 的设计者决定为 LINQ 提供提供类似的功能，结果就是并行 LINQ，或 PLINQ。你将在本章的第二部分学习 PLINQ。\n\
  \n### 异步性与可扩展性\n\n如果你正在构建企业级 Web 应用程序和服务等大型解决方案，异步性是你需要理解的重要概念。Web 服务器通常资源有限，需要处理来自可能大量的受众的请求，每个成员都期望其请求能被快速处理。在许多情况下，用户请求可能会调用一系列操作，这些操作单独可能花费大量时间（可能长达一或两秒）。考虑一个电子商务系统，例如用户正在查询产品目录或下单。这两个操作通常涉及读取和写入存储在数据库中的数据，该数据库可能由远程\
  \ Web 服务器的数据库服务器管理。许多 Web 服务器只能支持有限的并发连接，如果与连接关联的线程正在等待 I/O 操作完成，该连接实际上就被阻塞了。如果线程创建一个单独的任务来异步处理\
  \ I/O，那么线程就可以被释放，连接也可以供其他用户使用。这种方法比同步实现此类操作具有多得的可扩展性。\n\n要了解为什么在这种情况下执行同步 I/O 是糟糕的示例和详细说明，请阅读公共\
  \ Microsoft Patterns & Practices Git 仓库中的“同步 I/O 反模式”，地址为：`https://github.com/mspnp/performance-optimization/tree/master/SynchronousIO`。\n\
  \n### 实现异步方法\n\n`async` 方法是一种不会阻塞其开始运行的当前线程的方法。当应用程序调用异步方法时，一个隐含的契约期望该方法很快地将控制权返回给调用环境，并在单独的线程上执行其工作。“很快*的定义并不是一个数学上的量，但预期是，如果异步方法执行了可能导致调用者出现明显延迟的操作，它应该通过使用后台线程来实现，从而允许调用者在当前线程上继续运行。这个过程听起来很复杂，而且在早期的\
  \ .NET Framework 版本中确实如此。然而，C# 现在提供了 `async` 方法修饰符和 `await` 运算符，它们将许多复杂性抽象给了编译器，这意味着（大多数时候）你不再需要担心多线程的复杂细节了。\n\
  \n#### 定义异步方法：问题所在\n\n你已经看到过如何使用 `Task` 对象实现并发操作。简单回顾一下，当你使用 `Task` 类型的 `Start`\
  \ 或 `Run` 方法启动任务时，公共语言运行时 (CLR) 会使用它自己的调度算法将任务分配给线程，并在操作系统方便的时间（即资源可用时）设置该线程运行。这种方法使你的代码能够了识别和管理计算机工作负载的需求。如果你需要在特定任务完成后执行另一个操作，你有以下几种选择：\n\
  \n![Image](img/Image00001.jpg) 你可以使用 `Task` 类型暴露的任一 `Wait` 方法来手动等待任务完成。然后你可以启动新操作，可能通过定义另一个任务。\n\
  \n![Image](img/Image00001.jpg) 你可以定义一个延续（continuation）。延续操作只需指定在给定任务完成时要执行的操作。.NET\
  \ Framework 会自动将延续操作作为一个任务执行，并在原始任务结束时对其调度。延续操作将重用与原始任务相同的线程。\n\n\n\n\n然而，尽管 `Task`\
  \ 类型为操作提供了方便的泛化，但你仍然经常需要编写一些可能很拙的代码来解决开发者在使用后台线程时遇到的一些常见问题。例如，假设你定义了以下方法，该方法执行一系列必须串行运行的耗时操作，然后在屏幕上的\
  \ `TextBox` 控件中显示消息：\n\n点击此处查看代码图像\n\n```sharp\nprivate void slowMethod()\n{\n \
  \   doFirstLongRunningOperation();\n    doSecondLongRunningOperation();\n    doThirdLongRunningOperation();\n\
  \    message.Text = \"Processing Completed\";\n}\n\nprivate void doFirstLongRunningOperation()\n\
  {\n    ...\n}\n\nprivate void doSecondLongRunningOperation()\n{\n    ...\n}\n\n\
  private void doThirdLongRunningOperation()\n{\n    ...\n}\n```\n\n如果你在用户界面代码（例如按钮控件的\
  \ `Click` 事件处理程序）中调用 `slowMethod()`，那么在该方法完成之前，用户界面将一直处于无响应状态。你可以通过使用 `Task` 对象来运行\
  \ `doFirstLongRunningOperation()` 方法，并为同一个 `Task` 定义后续操作，按顺序运行 `doSecondLongRunningOperation()`\
  \ 和 `doThirdLongRunningOperation()` 方法，从而让 `slowMethod()` 方法更具响应性，如下：\n\n点击此处查看代码图像\n\
  \n```sharp\nprivate void slowMethod()\n{\n    Task task = new Task(doFirstLongRunningOperation);\n\
  \    task.ContinueWith(doSecondLongRunningOperation);\n    task.ContinueWith(doThirdLongRunningOperation);\n\
  \    task.Start();\n    message.Text = \"Processing Completed\"; // 消息什么时候出现？\n\
  }\n\nprivate void doFirstLongRunningOperation()\n{\n    ...\n}\n\nprivate void doSecondLongRunningOperation(Task\
  \ t)\n{\n    ...\n}\n\nprivate void doThirdLongRunningOperation(Task t)\n{\n   \
  \ ...\n}\n```\n\n尽管这种重构看起来非常简单，但有几点需要注意。特别是 `doSecondLongRunningOperation` 和 `doThirdLongRunningOperation`\
  \ 方法的签名已经发生了变化，以适应后续操作的要求（触发后续操作的 `Task` 对象被作为参数传递给后续方法）。更重要的是，你需要问自己：“`TextBox`\
  \ 控件中的消息是什么时候的？”第二个点的问题在于，虽然 `Start()` 方法启动了一个 `Task`，但它不会等待其完成，因此消息在处理执行期间就出现了，而不是在完成后出现。\n\
  \n这是一个有些微不足道的例子，但通用原理非常重要，而且至少有两种解决方案。第一种是在显示消息之前等待 `Task` 完成，如下：\n\n点击此处查看代码图像\n\
  \n```sharp\nprivate void slowMethod()\n{\n    Task task = new Task(doFirstLongRunningOperation);\n\
  \    task.ContinueWith(doSecondLongRunningOperation);\n    task.ContinueWith(doThirdLongRunningOperation);\n\
  \    task.Start();\n    task.Wait();\n    message.Text = \"Processing Completed\"\
  ;\n}\n```\n\n然而，现在对 `Wait()` 方法的调用会阻塞执行 `slowMethod()` 方法的线程，这违背了最初使用 `Task` 的目的。\n\
  \n***\n\n![Image](img/Image00004.jpg) 重要\n\n通常情况下，你**永远不要**在用户界面线程中直接调用 `Wait()`\
  \ 方法。\n\n***\n\n更好的解决方案是定义一个显示消息的后续操作，并安排它仅在 `doThirdLongRunningOperation()` 方法完成后运行，在这种情况下，你可以移除对\
  \ `Wait()` 方法的调用。你可能想将此后续操作实现为委托，如下面代码中的**加粗**部分所示（记住，后续操作接收一个 `Task` 对象作为参数；这就是委托中参数\
  \ `t` 的目的）：\n\n点击此处查看代码图像\n\n```sharp\nprivate void slowMethod()\n{\n    Task task\
  \ = new Task(doFirstLongRunningOperation);\n    task.ContinueWith(doSecondLongRunningOperation);\n\
  \    task.ContinueWith(doThirdLongRunningOperation);\n    task.ContinueWith((t)\
  \ => message.Text = \"Processing Complete\");\n    task.Start();\n}\n```\n\n遗憾的是，这种方法暴露了另一个问题。如果你尝试在\
  \ Debug 模式下运行此代码，你会发现最后的后续操作生成了一个 `System.Exception` 异常，其信息相当晦涩：“应用程序调用了为不同的线程封的接口。”这里的问题在于，只有用户界面线程可以操纵用户界面控件，而你现在正尝试从不同的线程（用于运行\
  \ `Task` 的线程）向 `TextBox` 控件写入。你可以通过使用 `Dispatcher` 对象来解决这个问题。`Dispatcher` 对象是用户界面基础设施的一个组件，你可以通过调用它的\
  \ `RunAsync()` 方法向它发送请求，以便在用户界面线程上执行工作。该方法接收一个 `Action` 委托，指定要运行的代码。`Dispatcher`\
  \ 对象和 `RunAsync()` 方法的细节超出了本书的范围，但下面的示例显示了你如何使用它们从后续操作中显示 `slowMethod()` 方法所需的的消息：\n\
  \n点击此处查看代码图像\n\n```sharp\nprivate void slowMethod()\n{\n    Task task = new Task(doFirstLongRunningOperation);\n\
  \    task.ContinueWith(doSecondLongRunningOperation);\n    task.ContinueWith(doThirdLongRunningOperation);\n\
  \    task.ContinueWith((t) => this.Dispatcher.RunAsync(\n        DispatcherPriority.Normal,\n\
  \        () => message.Text = \"Processing Complete\"));\n    task.Start();\n}\n\
  ```\n\n这种方法虽然可行，但它很混乱且难以维护。你现在为 `RunAsync` 指定了一个委托（后续操作）。\n\n***\n\n![Image](img/Image00148.jpg)\
  \ 更多信息\n\n你可以在微软网站上找到关于 `Dispatcher` 对象和 `RunAsync` 方法的更多信息：[`msdn.microsoft.com/library/windows.ui.dispatcher`](https://msdn.microsoft.com/library/windows.ui.dispatcher\n\
  \n***\n\n#### 定义异步方法：解决方案\n\nC# 中 `async` 和 `await` 关键字的目的是允许你定义和调用可以异步运行的方法。这意味着你不需要担心指定后续操作或在\
  \ `Dispatcher` 对象上调度代码以确保在正确的线程上处理数据。简单来说：\n\n![Image](img/Image00001.jpg) `async`\
  \ 修饰符表示该方法包含可以异步运行的功能。\n\n![Image](img/Image00001.jpg) `await` 运算符指定了应该执行异步功能点。\n\
  \n下面的代码示例显示了使用 `async` 修饰符和 `await` 运算符实现的 `slowMethod()` 方法：\n\n点击此处查看代码图像\n\n\
  ```sharp\nprivate async void slowMethod()\n{\n    await doFirstLongRunningOperation();\n\
  \    await doSecondLongRunningOperation();\n    await doThirdLongRunningOperation();\n\
  \    message.Text = \"Processing Complete\";\n}\n```\n\n该方法现在看起来与原始版本非常相似，这就是 `async`\
  \ 和 `await` 的威力。事实上，这种魔法仅仅是 C# 编译器对你的代码进行的重构。当 C# 编译器在 `async` 方法中遇到 `await` 运算符时，它实际上是将其后面的的操作数重新格式化为在\
  \ `async` 方法相同线程上运行的任务。剩余的代码被转换为任务完成后运行的后续操作，再次在相同线程上运行。现在，由于运行 `async` 方法的线程是运行用户界面的线程，它可以直接访问窗口中的控件，这意味着它可以直接更新它们，而无需通过\
  \ `Dispatcher` 对象进行路由。\n\n\n\n尽管这种方法乍看起来非常简单，但请务必记住以下几点，并避免一些可能的误解：\n\n![Image](img/Image00001.jpg)\
  \ `async` 修饰符并不意味着方法会在单独的线程上异步运行。它所的作用只是指定方法中的代码可以被划分为一个或多个续体（continuations）。当这些续体执行时，它们在与原始方法调用的同一个线程上执行。\n\
  \n![Image](img/Image00001.jpg) `await` 标识符指定了 C# 编译器可以将代码拆分为续体的点。`await` 标识符本身期望其操作数是一个\
  \ `awaitable` 对象。`awaitable` 对象是一种提供了 `GetAwaiter` 方法的类型，该方法返回一个对象，该对象反过来提供了运行代码和等待其完成的方法。C#\
  \ 编译器会将你的代码转换为使用这些方法来创建适当续体的语句。\n\n***\n\n### 重要性\n\n![Image](img/Image00004.jpg)\n\
  \n你只能在标记为 `async` 的方法中使用 `await` 操作符。在 `async` 方法之外，`await` 关键字被视为一个普通的标识符（你甚至可以创建一个名为\
  \ `await` 的变量，尽管不建议这样做）。\n\n***\n\n在 `await` 操作符的当前实现中，它期望你指定作为操作数的 `awaitable`\
  \ 对象是一个 `Task`。这意味着你必须对 `doFirstLongRunningOperation`、`doSecondLongRunningOperation`\
  \ 和 `doThirdLongRunningOperation` 方法进行一些修改。具体来说，每个方法现在必须创建并运行一个 `Task` 来执行其工作，并返回该\
  \ `Task` 的引用。以下示例显示 `doFirstLongRunningOperation` 方法的修改版本：\n\n点击此处查看代码图像\n\n```\n\
  private Task doFirstLongRunningOperation()\n{\n    Task t = Task.Run(() => { /*\
  \ 此方法的原始代码放在这里 */ });\n    return t;\n}\n```\n\n同样值得考虑是否有机会将 `doFirstLongRunningOperation`\
  \ 方法执行的工作拆分为一系列并行操作。如果是的话，你可以像第 23 章描述那样将工作划分为一组 `Task`。然而，你应该将这些 `Task` 对象中的哪一个作为方法的返回值？\n\
  \n点击此处查看代码图像\n\n```\nprivate Task doFirstLongRunningOperation()\n{\n    Task first\
  \ = Task.Run(() => { /* 第第一次操作的代码 */ });\n    Task second = Task.Run(() => { /*\
  \ 第二次操作的代码 */ });\n    return ...; // 你返回 first 还是 second？\n}\n```\n\n如果方法返回 `first`，则\
  \ `slowMethod` 中的 `await` 操作符将只等待该 `Task` 完成，而不等待 `second`。如果方法返回 `second`，也适用类似的逻辑。解决方案是使用\
  \ `async` 定义 `doFirstLongRunningOperation` 方法并 `await` 每个 `Task`，如下所示：\n\n点击此处查看代码图像\n\
  \n```\nprivate async Task doFirstLongRunningOperation()\n{\n    Task first = Task.Run(()\
  \ => { /* 第第一次操作的代码 */ });\n    Task second = Task.Run(() => { /* 第二次操作的代码 */ });\n\
  \    await first;\n    await second;\n}\n```\n\n记住，当编译器遇到 `await` 操作符时，它会生成等待参数指定的项目完成的代码，连同一个运行后续语句的续体。你可以将\
  \ `async` 方法返回的值视为指向运行此续体的 `Task` 的引用（这个描述并不完全准确，但对于本章的目的来说是一个很好的模型）。因此，`doFirstLongRunningOperation`\
  \ 方法创建并启动并行运行的任务 `first` 和 `second`，编译器将 `await` 语句重新格式化为等待 `first` 完成的代码，随后是等待\
  \ `second` 完成的续体，而 `async` 修饰符导致编译器返回此续体的引用。请注意，由于编译器现在确定了方法的返回值，你不再需要自己指定返回值（事实上，如果你在这种情况下尝试返回一个值，你的代码将无法编译）。\n\
  \n***\n\n### 注意事项\n\n![Image](img/Image00005.jpg)\n\n如果你在 `async` 方法中没有包含 `await`\
  \ 语句，该方法仅仅是执行方法体中代码的 `Task` 的引用。因此，当你调用该方法时，它并不会实际异步运行。在这种情况下，编译器将向你发出警告信息：“此异步方法缺少\
  \ await 操作符，并将同步运行。”\n\n***\n\n***\n\n### 提示\n\n![Image](img/Image00013.jpg)\n\n\
  你可以使用 `async` 修饰符来修饰委托，从而能够通过使用 `await` 操作符创建包含异步处理的委托。\n\n***\n\n在接下来的练习中，你将使用第\
  \ 23 章中的 GraphDemo ，并修改它以使用异步方法生成图表数据。\n\n#### 修改 GraphDemo 以使用异步方法\n\n**1.** 使用\
  \ Microsoft Visual Studio 2015，打开 GraphDemo 解决方案，它位于\n\n**2.** 在解决方案管理器（Solution\
  \ Explorer）中，展开 `MainPage` 节点并打开 `MainPage.xaml`。\n\n**3.** 在 `MainPage.cs` 中，找到\
  \ `plotButton_Click` 方法。该方法的代码如下：\n\n```csharp\nprivate void plotButton_Click(object\
  \ sender, RoutedEventArgs e)\n{\n    Random rand = new Random();\n    tokenSource\
  \ = new CancellationTokenSource();\n    Stopwatch watch = Stopwatch.StartNew();\n\
  \    try\n    {\n        generateGraphData(data, 0, pixelWidth / 2, token);\n  \
  \      duration.Text = $\"Duration (ms): {watch.ElapsedMilliseconds}\";\n    }\n\
  \    catch (OperationCanceledException oce)\n    {\n        duration.Text = oce.Message;\n\
  \    }\n    Stream pixelStream = graphBitmap.PixelBuffer.AsStream();\n    pixelStream.Seek(0,\
  \ SeekOrigin.Begin);\n    pixelStream.Write(data, 0, data.Length);\n    graphBitmap.Invalidate();\n\
  \    graphImage.Source = graphBitmap;\n}\n```\n\n这是上一章节应用程序的简化版本。它直接从界面线程调用 `generateGraphData`\
  \ 方法，并且使用 `Task` 对象并行生成数据。\n\n***\n\n### 注意事项\n\n![Image](img/Image00005.jpg)\n\n\
  如果你在第 23 章练习中减小了 `pixelWidth` 和 `pixelHeight` 字段的大小以节省内存，请在此步骤之前再次这样做。\n\n**4.**\
  \ 在调试菜单中，点击“启动调试”。\n\n**5.** 在 GraphDemo 窗口中，点击“绘图”。在生成数据期间，尝试点击“取消”。\n\n注意在图表生成期间用户界面完全没有响应。这是因为\
  \ `plotButton_Click` 方法同步执行了所有工作。\n\n**6.** 返回 Visual Studio 并停止调试。\n\n**7.** 在显示\
  \ `MainPage` 类的代码编辑器中，在 `generateGraphData` 方法上方添加一个名为 `generateGraphDataAsync`\
  \ 的新方法。\n\n该方法应该与 `generateGraphData` 方法具有相同的参数列表，但它应该返回一个 `Task` 对象而不是 `void`。该方法也应该标记为\
  \ `async`，并且如下：\n\n```csharp\nprivate async Task generateGraphDataAsync(byte[] data,\
  \ int partitionStart, int partitionEnd, CancellationToken token)\n{\n}\n```\n\n\
  ***\n\n### 注意事项\n\n为异步方法命名 `Async` 后缀是一种推荐的做法。\n\n\n\n\n## 8. 在 `generateGraphDataAsync`\
  \ 方法中，添加此处所示的粗体语句。\n\n点击此处查看代码图像\n\n```cs\nprivate async Task generateGraphDataAsync(byte[]\
  \ data, int partitionStart, int partitionEnd, CancellationToken token)\n{\n    Task\
  \ task = Task.Run(() => generateGraphData(data, partitionStart, partitionEnd, token));\n\
  \    await task;\n}\n```\n\n此代码创建了一个 `Task` 对象，用于运行 `generateGraphData` 方法，并使用 `await`\
  \ 运算符等待 `Task` 完成。编译器由于 `await` 运算符生成的任务是该方法返回的值。\n\n## 9. 返回到 `plotButton_Click`\
  \ 方法，并修改该方法的定义以包含 `async` 修饰符，如下所示代码中的粗体所示：\n\n点击此处查看代码图像\n\n```csharp\nprivate\
  \ async void plotButton_Click(object sender, RoutedEventArgs e)\n{\n    ...\n}\n\
  ```\n\n## 10. 在 `plotButton_Click` 方法的 `try` 块中，修改生成图形数据的语句，以异步调用 `generateGraphDataAsync`\
  \ 方法，如下粗体所示：\n\n点击此处查看代码图像\n\n```csharp\ntry\n{\n    await generateGraphDataAsync(data,\
  \ 0, pixelWidth / 2, token);\n    duration.Text = $\"Duration (ms): {watch.ElapsedMilliseconds}\"\
  ;\n}\n...\n```\n\n## 11. 在“调试”菜单上，鼠标指向“Windows”，然后点击“异常设置”。在“异常设置”窗口中，取消勾选“公共语言运行时异常”。右键点击“公共语言运行时异常”，然后确保已启用“当在用户代码中未处理时继续”。\n\
  \n## 12. 在“调试”菜单上，点击“启动调试”。\n\n## 13. 在 GraphDemo 窗口中，点击“绘制图表（Plot Graph）”，并验证应用程序是否正确生成了图形。\n\
