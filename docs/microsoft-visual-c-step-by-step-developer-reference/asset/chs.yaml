  \ Debugging（停止调试）。\n\n**6.** 在 Code and Text Editor（代码和文本编辑器）窗口中显示 `MainPage.xaml.cs`文件的代码。\n\
  \n**7.** 找到 `compareClick` 方法，它看起来应该是这样的：\n\n点击此处查看代码图像\n\n```csharp\nprivate void\
