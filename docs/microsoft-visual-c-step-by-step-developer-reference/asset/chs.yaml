  \n### 6. 在 SQL Server 对象资源管理器窗格中，展开 `AdventureWorks` 数据库，展开 `Tables`，展开 `SalesLT.Customer`，然后展开\
  \ `Columns`。\n\n列出了表中的列。必须移除三个应用程序未使用且不允许空值的列（否则应用程序将无法创建新客户）。\n\n### 7. 点击 `NameStyle`\
  \ 列，按住 `Ctrl` 键，点击 `PasswordHash` 和 `PasswordSalt` 列。右键点击 `PasswordSalt` 列，然后点击\
  \ `Delete`（删除）。\n\n### 8. Visual Studio 分析这些列。在“预览数据库更新”（Preview Database Updates）对话框中，它会显示如果删除这些列，可能会出现的警告和其他问题列表。\n\
  \n![Image](img/Image00223.jpg)\n\n### 9. 在“预览数据库更新”对话框中，点击 `Update Database`（更新数据库）。\n\
  \n### 10. 关闭 SQL Server 对象资源管理器窗格，但保持 Visual Studio 2015 打开状态。\n\n## 创建实体模型\n\n\
  现在你已经在云端创建了 `AdventureWorks` 数据库，你可以使用 Entity Framework 创建一个实体模型，应用程序可以使用该模型来查询和更新此数据库中的信息。如果你以前接触过数据库，你可能熟悉如\
  \ `ADO.NET` 等技术，它提供了一个类库，你可以用它连接到数据库并运行 SQL 命令。`ADO.NET` 是很有用的，但它要求你对 `SQL` 有深入了解，而且如果你不小心，它可能会迫使你围绕执行\
  \ SQL 命令所需的逻辑来构建你的代码，而不是关注应用程序的业务操作。Entity Framework 提供了一层抽象，减少了应用程序对 `SQL` 的依赖。\n\
  \n本质上讲，Entity Framework 在关系型数据库和你的应用程序之间实现了一个映射层；它生成一个实体模型，该模型由对象集合组成，应用程序可以像使用其他集合一样使用它们。集合通常对应于数据库中的表，表中的每一行对应集合中的一个项。你通过遍历集合中的项来执行查询，通常使用集成语言查询（`LINQ`）。在后台，实体模型会将你的查询转换为用于获取数据的\
  \ `SQL SELECT` 命令。你可以修改集合中的数据，然后可以安排实体模型生成并执行相应的 `SQL INSERT`、`UPDATE` 和 `DELETE`\
  \ 命令，以在数据库中执行等效的操作。简而言之，Entity Framework 是连接数据库以及检索和管理数据的极佳工具，无需你在代码中嵌入 SQL 命令。\n\
  \n在接下来的练习中，你将为 `AdventureWorks` 数据库中的 `Customer` 表创建一个非常简单的实体模型。你将遵循所谓的“数据库优先”（database-first）实体建模方法。在这种方法中，Entity\
  \ Framework 根据数据库中表的定义生成类。Entity Framework 还提供了一种“代码优先”（code-first）方法；该策略可以根据你在应用程序中实现的类在数据库中生成一组表。\n\
  \n***\n\n![Image](img/Image00005.jpg) 备注\n\n如果你想了解更多关于使用代码优先方法创建实体模型的信息，请参阅 Microsoft\
  \ 网站上的 `http://msdn.microsoft.com/data/jj200620` 中的“Code First to an Existing Database”。\n\
  \n***\n\n## 创建 AdventureWorks 实体模型\n\n### 1. 在 Visual Studio 中，打开 `Customers` 项目，该项目位于文档文件夹中的\
  \ `\\Microsoft Press\\VCSBS\\Chapter 27\\Web Service` 文件夹下。\n\n该项目包含第 26 节 中 `Customers`\
  \ 应用程序修改版本。`ViewModel` 实现了额外的命令，允许用户导航到客户集合中的第一个或最后一个客户，且命令栏包含调用这些命令的 `First` 和\
  \ `Last` 按钮。此外，删除了 Cortana 搜索功能，以便你能够专注于手头的任务。（如果你想为应用程序添加一个语音控制版本，非常欢迎重新添加此功能。）\n\
  \n### 2. 在解决方案管理器中，右键点击 `Customers` 解决方案（不是 `Customers` 项目），指向 `Add`（添加），然后点击 `New\
