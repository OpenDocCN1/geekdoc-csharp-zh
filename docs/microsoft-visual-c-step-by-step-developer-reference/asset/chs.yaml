  , City = \"London\",\n\nCountry = \"United Kingdom\"},\n\nnew { CompanyName = \"\
  Wide World Importers\", City = \"Tetbury\",\n\nCountry = \"United Kingdom\"}\n};\n\
  ```\n\n![Image](img/Image00005.jpg) 注意\n\n接下来的`选择数据,` `过滤数据,` `数据的排序、分组和聚合,` 以及\
  \ `连接连接连接` 章节将向你展示使用 LINQ 方法查询数据的基本能力和语法。语法有时会变得有点复杂，当你到达`使用查询运算符` 章节时，你会发现实际上并不需要记住所有语法是如何运作的。然而，你至少看一眼这些章节是有用的，这样你就能充分理解\
  \ C# 提供的查询运算符是如何执行任务的。\n\n### 选择数据\n\n假设你想显示一个包含 `customers` 数组中每个客户名字（first name）的列表。你可以通过以下代码完成此任务：\n\
  \n点击此处查看代码图像\n\n```csharp\nIEnumerable<string> customerFirstNames =\n\ncustomers.Select(cust\
  \ => cust.FirstName);\n\nforeach (string name in customerFirstNames)\n\n{\n\nConsole.WriteLine(name);\n\
  \n}\n```\n\n虽然这段代码非常短，但它做了很多工作，需要一定程度解释，首先从使用 `customers` 数组的 `Select` 方法开始。\n\n\
  使用 `Select` 方法，你可以从数组中检索特定数据——在这种情况下，只需获取数组中每个项的 `FirstName` 字段的值。它是如何工作的呢？`Select`\
  \ 方法的参数实际上是另一个方法，它接收 `customers` 数组中的行，并返回该行中的被选数据。你可以定义自己的自定义方法来执行此任务，但最简单的机制是使用\
  \ lambda 表达式来定义匿名方法，如前面的示例所示。在这一点上，你需要理解三件重要的事情：\n\n![Image](img/Image00001.jpg)\
  \ 变量 `cust` 是传递给方法的参数。你可以将 `cust` 视为 `customers` 数组中每一行的别名。编译器根据你正在 `customers`\
  \ 数组上调用 `Select` 方法推断出这一点。你可以使用任何合法的 C# 标识符来代替 `cust`。\n\n![Image](img/Image00001.jpg)\
  \ `Select` 方法此时并没有实际检索数据；它只是返回一个可枚举对象，当你以后遍历它时，它将获取由 `Select` 方法确定的数据。我们将在本章稍后的`LINQ\
  \ 和延迟计算` 章节中回到 LINQ 的这一方面。\n\n![Image](img/Image00001.jpg) `Select` 方法实际上不是 `Array`\
  \ 类型的方法。它是 `Enumerable` 类的扩展方法。`Enumerable` 类位于 `System.Linq` 命名空间，并为查询实现泛型 `IEnumerable<T>`\
  \ 接口的对象提供了大量的静态方法。\n\n前一个示例使用 `customers` 数组的 `Select` 方法生成了一个名为 `customerFirstNames`\
  \ 的 `IEnumerable<string>` 对象。（它是 `IEnumerable<string>` 类型，是因为 `Select` 方法返回一个可枚举的客户名字的集合，这些名字是字符串。）`foreach`\
  \ 语句遍历这个字符串集合，按照以下顺序打印每个客户的姓名：\n\nKim\nJeff\nCharlie\nChris\nDave\nAnn\nJohn\nDavid\n\
  Greg\nTim\n\n你现在可以显示每个客户的名字了。你如何获取每个客户的姓和名呢？这个任务稍微困难。如果你在 Microsoft Visual Studio\
  \ 2015 附带文档中查看 `System.Linq` 命名空间中 `Enumerable.Select` 方法的定义，你会看到它像这样：\n\n点击此处查看代码图像\n\
  \n```csharp\npublic static IEnumerable<TResult> Select<TSource, TResult> (\n\n \
  \   this IEnumerable<TSource> source,\n\n    Func<TSource, TResult> selector\n\n\
  )\n```\n\n这实际上是 `Select` 是一个泛型方法，它接受两个名为 `TSource` 和 `TResult` 的类型参数，以及两个名为 `source`\
  \ 和 `selector` 的普通参数。`TSource` 是你正在生成的可枚举结果集的集合类型（在本例中为 `customer` 对象），而 `TResult`\
  \ 是可枚举结果集中的数据类型（在本例中为 `string` 对象）。记住 `Select` 是一个扩展方法，因此 `source` 参数实际上是对被扩展类型的引用（在示例中，它是实现\
  \ `IEnumerable` 接口的 `customer` 对象的泛型集合）。`selector` 参数指定了一个标识要检索字段的泛型方法。（记住 `Func`\
  \ 是 .NET Framework 中一种泛型委托类型的名称，你可以用它来封装返回结果的泛型方法。）`selector` 参数接收 `TSource`（在本例中为\
  \ `customer` 对象）并产生 `TResult`（在本例中为 `string` 对象）。`Select` 方法返回 `string` 对象的可枚举集合。\n\
  \n![Image](img/Image00005.jpg) 注意\n\n第 12 章,` `与继承工作,` 解释了扩展方法如何工作以及 `Select` 方法的第一个参数的作用。\n\
  \n从上一段需要理解的重要点是，`Select` 方法返回基于单一类型的可枚举集合。如果你想要枚举器返回多个项，例如每个客户的姓和名，你至少有两种选择：\n\n\
  ![Image](img/Image00001.jpg) 你可以在 `Select` 方法中将姓名合并成单个字符串，如下：\n\n点击此处查看代码图像\n\n\
  ```csharp\nIEnumerable<string> customerNames =\n\ncustomers.Select(cust => $\"{cust.FirstName}\
  \ {cust.LastName}\");\n```\n\n![Image](img/Image00001.jpg) 你可以定义一个封装姓名的类型，并使用 `Select`\
  \ 方法构造该类型的实例，如下：\n\n点击此处查看代码图像\n\n```csharp\nclass FullName\n\n{\n\n    public string\
  \ FirstName{ get; set; }\n\n    public string LastName{ get; set; }\n}\n\n...\n\n\
  IEnumerable<FullName> customerNames =\n\ncustomers.Select(cust => new FullName\n\
  \n{\n\n    FirstName = cust.FirstName,\n\n    LastName = cust.LastName\n\n} );\n\
  ```\n\n第二种方案可能是更好的，但如果这是应用程序对 `Names` 类型的唯一使用，你可能倾向于使用匿名类型，而不是为单个操作定义新类型：\n\n点击此处查看代码图像\n\
  \n```csharp\nvar customerNames =\n\ncustomers.Select(cust => new { FirstName = cust.FirstName,\
  \ LastName = cust.LastName } );\n```\n\n注意这里使用 `var` 关键字来定义可枚举集合的类型。集合对象的类型是匿的，因此你不知道集合对象的特定类型。\n\
  \n### 过滤数据\n\n通过 `Select` 方法，你可以指定（或*投影*）你想包含在可枚举集合中的字段。然而，你可能还想限制枚举集合包含的行。例如，假设你想列出\
  \ `addresses` 数组中所有位于美国的公司名称。为了实现这一点，你可以使用 `Where` 方法，如下所示：\n\n点击此处查看代码图像\n\n```csharp\n\
  IEnumerable<string> usCompanies =\n\naddresses.Where(addr => String.Equals(addr.Country,\
  \ \"United States\"))\n\n.Select(usComp => usComp.CompanyName);\n\nforeach (string\
  \ name in usCompanies)\n\n{\n\nConsole.WriteLine(name);\n\n}\n```\n\n\n\n\n在语法上，`Where`\
  \ 方法与 `Select` 类似。它期望一个参数，该参数定义了一个根据你指定的标准过滤数据的方法。此示例使用了另一个 Lambda 表达式。变量 `addr`\
  \ 是 `addresses` 数组中某行的别名，该 Lambda 表达式返回所有 `Country` 字段匹配字符串“United States States”的行。`Where`\
  \ 方法返回一个可枚举的行集合，其中包含原始集合中的每个字段。随后，对这些行应用 `Select` 方法，从该可枚举集合中仅投影出 `CompanyName`\
  \ 字段，并返回另一个包含 `string` 对象的可枚举集合。（变量 `usComp` 是 `Where` 方法返回的可枚举集合中每行的类型的别名。）因此，此完整表达式的结果类型为\
  \ `IEnumerable<string>`。理解这一系列操作至关重要——首先应用 `Where` 方法过滤行，然后应用 `Select` 方法指定字段。用于遍历此集合的\
  \ `foreach` 语句显示了以下公司：\n\n- Coho Winery\n- Trey Research\n\n### 数据的排序、分组和聚合\n\n\
  如果你熟悉 SQL，那么你就知道它允许你执行除简单投影和过滤之外的各种关系操作。例如，你可以指定按特定顺序返回数据，根据一个或多个键字段对返回的行进行分组，并根据每组的行计算摘要。LINQ\
  \ 提供了相同的功能。\n\n要按特定顺序检索数据，你可以使用 `OrderBy` 方法。与 `Select` 和 `Where` 方法一样，`OrderBy`\
  \ 期望一个方法作为参数。该方法识别你想要用于对数据排序表达式。例如，你可以按升序显示 `addresses` 数组中每家公司的名称，如下：\n\n点击此处查看代码图片\n\
  \n```csharp\nIEnumerable<string> companyNames =\n    addresses.OrderBy(addr => addr.CompanyName).Select(comp\
  \ => comp.CompanyName);\n\nforeach (string name in companyNames)\n{\n    Console.WriteLine(name);\n\
  }\n```\n\n此代码块按字母顺序显示 addresses 表中的公司：\n\n- Alpine Ski House\n- Coho Winery\n- Trey\
  \ Research\n- Wide World Importers\n- Wingtip Toys\n\n如果你想按降序顺序枚举数据，可以使用 `OrderByDescending`\
  \ 方法。如果你想按多个键值进行排序，可以在 `OrderBy` 或 `OrderByDescending` 之后使用 `ThenBy` 或 `ThenByDescending`\
  \ 方法。\n\n根据一个或多个字段中的共同值对数据进行分组，可以使用 `GroupBy` 方法。以下示例了如何按国家对 `addresses` 数组中的公司分组：\n\
  \n点击此处查看代码图片\n\n```csharp\nvar companiesGroupedByCountry =\n    addresses.GroupBy(addrs\
  \ => addrs.Country);\n\nforeach (var companiesPerCountry in companiesGroupedByCountry)\n\
  {\n    Console.WriteLine(\n        $\"Country: {companiesPerCountry.Key}\\t{companiesPerCountry.Count()}\
  \ companies\");\n\n    foreach (var companies in companiesPerCountry)\n    {\n \
  \       Console.WriteLine($\"\\t{companies.CompanyName}\");\n    }\n}\n```\n\n到此时，你应该已经识别出这种模式。`GroupBy`\
  \ 方法期望一个指定分组数据字段的方法。然而，`GroupBy` 方法与你目前看到的其他方法之间存在一些细微的。\n\n主要的关注点在于，你不需要使用 `Select`\
  \ 方法将字段投影到结果中。`GroupBy` 返回的可枚举集合包含原始源集合中的所有字段，但行根据 `GroupBy` 指定方法确定的字段被组织成一组可枚举集合。换句话说，`GroupBy`\
  \ 方法的结果是一个可枚举的组，每个组都是一个可枚举的行集合。在上面的示例中，可枚举集合 `companiesGroupedByCountry` 是一个国家集合。该集合中的项本身是可枚举集合，依次包含每个国家的公司。显示每个国家公司的代码使用\
  \ `foreach` 循环遍历 `companiesGroupedByCountry` 集合，逐个产生并显示每个国家，然后它使用嵌套的 `foreach` 循环来遍历每个国家的公司集合。注意在外层\
  \ `foreach` 循环中，你可以通过每个项目的 `Key` 字段访问你正在分组的值，还可以使用 `Count`、`Max`、`Min` 等许多方法为每个组计算摘要数据。示例代码生成的输出如下：\n\
  \n点击此处查看代码图片\n\nCountry: Switzerland 1 companies\n- Alpine Ski House\nCountry: United\
  \ States 2 companies\n- Coho Winery\n- Trey Research\nCountry: United Kingdom 2\
  \ companies\n- Wingtip Toys\n- Wide World Importers\n\n你可以直接在 `Select` 方法的结果上使用许多如\
  \ `Count`、`Max` 和 `Min` 等摘要方法。如果你想知道 `addresses` 数组中有多少家公司，可以使用如下代码块：\n\n点击此处查看代码图片\n\
  \n```csharp\nint numberOfCompanies = addresses.Select(addr => addr.CompanyName).Count();\n\
  Console.WriteLine($\"Number of companies: {numberOfCompanies}\");\n```\n\n注意这些方法的结果是一个单个标量值而不是可枚举集合。上述代码块的输出如下：\n\
  \nNumber of companies: 5\n\n在这里我应该给出警告。这些摘要方法并不区分底层集合中重复的行。这意味着严格来说，先前的示例显示的是 `addresses`\
  \ 数组中有多少行包含 `CompanyName` 字段的值。如果你想找出此表中提到了多少个不同的国家，你可能会尝试这样做：\n\n点击此处查看代码图片\n\n\
  ```csharp\nint numberOfCountries = addresses.Select(addr => addr.Country).Count();\n\
  Console.WriteLine($\"Number of countries: {numberOfCountries}\");\n```\n\n输出看起来如下：\n\
  \nNumber of countries: 5\n\n事实上，`addresses` 数组包含的是不同的国家——只是 United States 和 United\
  \ Kingdom 都出现了两次。你可以通过使用 `Distinct` 方法消除计算中的重复项，如下：\n\n点击此处查看代码图片\n\n```csharp\n\
  int numberOfCountries = addresses.Select(addr => addr.Country).Distinct().Count();\n\
  Console.WriteLine($\"Number of countries: {numberOfCountries}\");\n```\n\n`Console.WriteLine`\
  \ 语句现在输出了预期的结果：\n\nNumber of countries: 3\n\n#### 连接数据\n\n就像 SQL 一样，LINQ 允许你通过多个公共键字段连接多个数据集。以下示例显示了如何显示每个客户的姓和名，以及该客户所在的国家名称：\n\
  \n点击此处查看代码图片\n\n```csharp\nvar companiesAndCustomers = customers\n    .Select(c\
  \ => new { c.FirstName, c.LastName, c.CompanyName })\n    .Join(addresses, custs\
  \ => custs.CompanyName, addrs => addrs.CompanyName,\n        (custs, addrs) => new\
  \ { custs.FirstName, custs.LastName, addrs.Country });\n\nforeach (var row in companiesAndCustomers)\n\
  {\n    Console.WriteLine(row);\n}\n```\n\n\n\n\n客户的姓和名可以在 `customers` 数组中获取，但客户所属每个公司的国家存储在\
  \ `addresses` 数组中。`customers` 数组与 `addresses` 数组之间的公共键是公司名称。`Select` 方法指定了 `customers`\
  \ 数组中感兴趣的字段（`FirstName` 和 `LastName`），以及包含公共键的字段（`CompanyName`）。你使用 `Join` 方法将 `Select`\
  \ 方法标识的数据与另一个可枚举集合进行连接。`Join` 方法的参数如下：\n\n![Image](img/Image00001.jpg)  用于进行连接的可枚举集合\n\
  \n![Image](img/Image00001.jpg)  用于从 `Select` 方法标识的数据中识别公共键字段的方法\n\n![Image](img/Image00001.jpg)\
  \  用于指定在所选数据上进行连接的公共键字段的方法\n\n![Image](img/Image00001.jpg)  用于指定 `Join` 方法返回的可枚举结果集中所需的列的方法\n\
  \n在例例中，`Join` 方法将来自 `customers` 数组的包含 `FirstName`、`LastName` 和 `CompanyName` 字段的可枚举集合与\
  \ `addresses` 数组中的行进行连接。当 `customers` 数组中的 `CompanyName` 字段的值与 `addresses` 数组中的\
  \ `CompanyName` 字段的值匹配时，这两组数据就会连接。结果集包含了来自 `customers` 数组的 `FirstName` 和 `LastName`\
  \ 字段以及来自 `addresses` 数组的 `Country` 字段。输出 `companiesAndCustomers` 集合数据的代码显示了以下信息：\n\
  \n点击此处查看代码\n\n{ FirstName = Kim, LastName = Abercrombie, Country = Switzerland }\n\
  { FirstName = Jeff, LastName = Hay, Country = United States }\n{ FirstName = Charlie,\
  \ LastName = Herb, Country = Switzerland }\n{ FirstName = Chris, LastName = Preston,\
  \ Country = United States }\n{ FirstName = Dave, LastName = Barnett, Country = United\
  \ Kingdom }\n{ FirstName = Ann, LastName = Beebe, Country = United States }\n{ FirstName\
  \ = John, LastName = Kane, Country = United Kingdom }\n{ FirstName = David, LastName\
  \ = Simpson, Country = United States }\n{ FirstName = Greg, LastName = Chapman,\
  \ Country = United Kingdom }\n{ FirstName = Tim, LastName = Litton, Country = United\
  \ Kingdom }\n\n* * *\n\n![Image](img/Image00005.jpg)  注意\n\n请记住，内存中的集合与关系型数据库中的表不同，且它们包含的数据不受限于相同的数据完整性约束。在关系型数据库中，假设每个客户都有一个对应的公司，且每个公司都有自己唯一的地址是可以接受的。集合不强制执行相同的数据完整性，这意味着你可以很容易地让一个客户引用在\
  \ `addresses` 数组中不存在的公司，你甚至可能同一个公司在 `addresses` 数组中出现多次。在这些情况下，你获得的结果可能是准确的但乎意之外的。当你完全理解所正在连接的数据之间的关系时，Join\
  \ 操作的效果最好。\n\n* * *\n\n### 使用查询操作符\n\n前面的部分向你展示了许多使用 `System.Linq` 命名空间中定义的 `Enumerable`\
  \ 类的扩展方法对内存数据进行查询的可用功能。该语法利用了若干项高级 C# 语言特性，生成的代码有时可能难以理解和维护。为了减轻你的负担，C# 的设计者在语言中添加了查询运算符，让你可以使用更类似于\
  \ SQL 的语法来利用 LINQ 特性。\n\n正如你在本章较早示例中所示，你可以这样获取每个客户的姓：\n\n点击此处查看代码\n\n```csharp\n\
  IEnumerable<string> customerFirstNames =\ncustomers.Select(cust => cust.FirstName);\n\
  ```\n\n你可以通过使用 `from` 和 `select` 查询运算符来重新表述此语句，如下：\n\n点击此处查看代码\n\n```csharp\nvar\
  \ customerFirstNames = from cust in customers\nselect cust.FirstName;\n```\n\n在编译时，C#\
  \ 编译器会将此表达式解析为相应的 `Select` 方法。`from` 运算符为源集合定义了一个别名，而 `select` 运算符使用该别名指定了要检索的字段。结果是一个包含客户姓名的可枚举集合。如果你熟悉\
  \ SQL，请注意 `from` 运算符出现在 `select` 运算符之前。\n\n继续同样的思路，要获取每个客户的姓和名，你可以使用以下语句。（你可能想参考较早之前基于\
  \ `Select` 扩展方法的相同语句示例。）\n\n点击此处查看代码\n\n```csharp\nvar customerNames = from cust\
  \ in customers\nselect new { cust.FirstName, cust.LastName };\n```\n\n你使用 `where`\
  \ 运算符来过滤数据。以下示例显示了如何从 `addresses` 数组中返回位于美国的公司名称：\n\n点击此处查看代码\n\n```csharp\nvar\
  \ usCompanies = from a in addresses\nwhere String.Equals(a.Country, \"United States\"\
  )\nselect a.CompanyName;\n```\n\n要对数据进行排序，使用 `orderby` 运算符，如下：\n\n点击此处查看代码\n\n```csharp\n\
  var companyNames = from a in addresses\norderby a.CompanyName\nselect a.CompanyName;\n\
  ```\n\n你可以通过以下方式使用 `group` 运算符对数据进行分组：\n\n点击此处查看代码\n\n```csharp\nvar companiesGroupCountry\
  \ = from a in addresses\ngroup a by a.Country;\n```\n\n注意，与之前分组数据的示例一样，你不需要提供 `select`\
  \ 运算符，并可以使用相同的代码遍历结果：\n\n点击此处查看代码\n\n```csharp\nforeach (var companiesPerCountry\
  \ in companiesGrouped)\n{\n    Console.WriteLine($\"Country: {companiesPerCountry.Key}\\\
  t{companiesPerCountry.Count()} companies\");\n    foreach (var companies in companiesPerCountry)\n\
  \    {\n        Console.WriteLine($\"\\t{companies.CompanyName}\");\n    }\n}\n\
  ```\n\n你可以这样对可枚举的集合调用 `Count` 等汇总函数：\n\n点击此处查看代码\n\n```csharp\nint numberOfCompanies\
  \ = (from a in addresses\nselect a.CompanyName).Count();\n```\n\n注意将表达式括起来。如果你想忽略重复值，使用\
  \ `Distinct` 方法：\n\n点击此处查看代码\n\n```csharp\nint numberOfCountries = (from a in addresses\n\
  select a.Country).Distinct().Count();\n```\n\n* * *\n\n![Image](img/Image00013.jpg)\
  \  提示\n\n在许多情况下，你可能只想统计集合中的行数，而不是所有行中某个字段的值。在这种情况下，你可以直接对原始集合调用 `Count` 方法，如下：\n\
  \n点击此处查看代码\n\n```csharp\nint numberOfCompanies = addresses.Count();\n```\n\n* *\
  \ *\n\n你可以使用 `join` 运算符跨公共键连接两个集合。以下示例显示了跨每个集合的 `CompanyName` 列返回客户和地址，这次是通过使用 `join`\
  \ 运算符重新表述的。你使用 `on` 子句配合等号 运算符来指定两个集合之间的关系。\n\n* * *\n\nLINQ 目前仅支持等值连接（基于等等的连接）。如果你是熟悉\
  \ SQL 的数据库开发人员，你可能熟悉基于其他运算符（如 `>` 和 `<`）的连接，但 LINQ 尚未提供这些功能。\n\n\n\n\n\n点击此处查看代码图像\n\
  \n```csharp\nvar countriesAndCustomers = from a in addresses\njoin c in customers\n\
  on a.CompanyName equals c.CompanyName\nselect new { c.FirstName, c.LastName, a.Country\
  \ };\n```\n\n***\n\n![Image](img/Image00005.jpg) 注意\n\n与 SQL 不同，LINQ 表达式中 `on` 子句的表达式的顺序是重要的。你必须将正在进行连接的项（引用\
  \ `from` 子句中集合中的数据）放在 `equals` 运算符的左侧，并将要与之进行连接的项（引用 `join` 子句中集合中的数据）放在右侧。\n\n\
  ***\n\nLINQ 提供了许多其他方法用于汇总信息以及对数据进行连接、分组和搜索。本节仅涵盖了最常用的功能。例如，LINQ 提供了 `Intersect`\
  \ 和 `Union` 方法，你可以使用它们来执行集合范围操作。它还提供了如 `Any` 和 `All` 等方法，你可以使用这些方法来判断集合中至少有一个项目或集合中的每个项目是否匹配指定的谓词。你可以使用\
  \ `Take` 和 `Skip` 方法对可枚举集合中的值进行分区。更多信息，请参见 Visual Studio 2015 提供的文档中的 LINQ 部分。\n\
  \n### 在 `Tree<TItem>` 对象中查询数据\n\n本章到目前为止的示例展示了如何查询数组数据。对于任何实现泛型 `IEnumerable<T>`\
  \ 接口的集合类可以使用相同的技术。在接下来的练习中，你将为公司的员工建模创建一个新类。你创建一个包含 `Employee` 对象集合的 `BinaryTree`\
  \ 对象，然后将使用 LINQ 查询这些信息。你最初将直接调用 LINQ 扩展方法，然后修改代码以使用查询操作符。\n\n#### 使用扩展方法从 `BinaryTree`\
  \ 获取数据\n\n1. 如果 Visual Studio 2015 尚未运行，请启动它。\n\n2. 打开 `QueryBinaryTree` 解决方案，它位于文档文件夹中的\
  \ `\\Microsoft Press\\VCSBS\\Chapter 21\\QueryBinaryTree` 文件夹。该项目包含 `Program.cs`\
  \ 文件，该文件定义了 `Program` 类，以及你在之前的练习中看到的 `Main` 和 `doWork` 方法。\n\n3. 在解决方案资源管理器中，右键点击\
  \ `QueryBinaryTree` 项目，指向“添加”，然后点击“类”。在“添加新项 – QueryBinaryTree”对话框中，在“名称”框中输入 `Employee.cs`，然后点击“添加”。\n\
  \n4. 将以下代码中加粗所示的自动属性添加到 `Employee` 类中：\n\n点击此处查看代码图像\n\n```csharp\nclass Employee\n\
  {\n    public string FirstName { get; set; }\n    public string LastName { get;\
  \ set; }\n    public string Department { get; set; }\n    public int Id { get; set;\
  \ }\n}\n```\n\n5. 将后续代码中加粗的 `ToString` 方法添加到 `Employee` 类中。.NET Framework 中的类型在将对象转换为字符串表示时使用此方法，例如当使用\
  \ `Console.WriteLine` 语句显示它时。\n\n点击此处查看代码图像\n\n```csharp\nclass Employee\n{\n  \
  \  ...\n    public override string ToString()\n    {\n        return $\"Id: {this.Id},\
  \ Name: {this.FirstName} {this.LastName}, Dept: {this.Department}\";\n    }\n}\n\
