  ## 致谢\n尽管我的名字在封面上，但编写这样本书绝非一个人的工作。我要感谢在整个练习过程中提供无遗留的支持和帮助的人员。\n首先，是 Microsoft Press\
  \ 的 Devon Musgrave，他将我从版本间的睡眠中唤醒。（实际上，我当时忙于为 Microsoft Patterns & Practices 编写材料，但还是抽空休假来编写这一版本的书籍。）他敦促、劝说并通常确保我意识到\
  \ Windows 10 和 `Visual Studio 2015` 即将面临，起草了合同，并确保我按约定的交付日期签了字！\n\n\n\n\n\n\n\n\n\
  \n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n* 创建一个 C# 控制台应用程序。\n* 创建一个简单的图形化 C# 应用程序。\n本章介绍了\
  \ Visual Studio 2015，这是一种旨在帮助你为 Microsoft Windows 构建应用程序的编程环境和工具集。Visual Studio\
  \ 2015 是编写 C# 代码的理想工具，它提供了许多你在学习本书的过程中将不断学到的功能。在本章中，你将使用 Visual Studio 2015 构建一些简单的\
  \ C# 应用程序，并开启构建 Windows 高功能解决方案的历程。\n使用 使用 Visual Studio 2015 环境开始编程\nVisual Studio\
  \ 2015 是一个功能丰富的编程环境，包含了你在 Windows 上创建大型或小型 C# 项目所需的功能。你甚至可以构建无缝结合不同编程语言编写的模块的项目，例如\
  \ C++、Visual Basic 和 F#。在第一个练习中，你将打开 Visual Studio 2015 编程环境，并学习如何创建一个控制台应用程序。\n\
  **注意**\n\n\n\n\n如果这是你第一次运行 Visual Studio 2015，可能会看到一个对话框提示你选择开发设置。Visual Studio\
  \ 2015 可以根据你的偏好语言进行定制。集成开发环境 (IDE)中各种对话框和工具的默认选择将根据你选择的语言进行设置。从开发设置列表中选择 Visual\
  \ C#，然后点击“启动 Visual Studio”按钮。稍等片，IDE 出现了。\n2. 在“文件”菜单上，指向“新建”，然后点击“项目”。\n打开“新建项目”对话框。该对话框列出了作为构建应用程序起点的模板。\n\
  3. 在左侧窗格中，展开`安装`节点，展开`模板`，然后点击 Visual C#。在中间窗格中，验证顶部的组合框显示为 `.NET Framework 4.6`，以及“控制台应用程序”。\n\
  4. 在“位置”框中，输入 `C:\\Users\\*YourName*\\Documents\\Microsoft Press\\VCSBS\\Chapter\
  \ 1`。将此路径中的文本 *YourName* 替换为你的 Windows 用户名。\n**注意**\n\n如果你指定的文件夹不存在，Visual Studio\
  \ 2015 会为你创建它。\n5. 在“名称”框中，输入 `TestHello`（覆盖现有名称 ConsoleApplication1）。\n6. 确保“为解决方案创建目录”复选框已勾选，且“添加到源代码控制”复选框已取消勾选，然后点击“确定”。\n\
  \n\n\n\n\n\n\n\n\n\n\n\n- **TestHello**：这是 C# 项目文件。每个项目文件引用一个或多个包含源代码以及项目其他产物（如图形图像）的文件。你必须在同一个项目中使用相同的编程语言编写所有源代码。在文件资源管理器中，此文件实际名为\
  \ `TestHello.csproj`，它存储在文档文件夹的 `\\Microsoft Press\\VCSBS\\Chapter 1\\TestHello\\\
  TestHello` 文件夹中。\n- **References**：此文件夹包含你的应用程序可以使用编译代码库的引用。当你的 C# 代码被编译时，它会被转换为库并赋予一个唯一名称。在\
  \ Microsoft .NET Framework 中，这些库被称为程序集（assemblies）。开发者使用程序集打包他们编写的有用功能，以便将其分发给可能想在自己的应用程序中使用这些功能的其他开发者。如果你展开\
  \ References 文件夹，你会看到 Visual Studio 2015 添加到项目的默认引用集。这些程序集提供了对 .NET Framework 许多常用功能的访问，并由\
  \ Microsoft 随 Visual Studio 2015 提供。随着你对书中练习的进行，你将学习其中许多程序集。\n- **Program.cs**：这是一个\
  \ C# 源文件，项目首次创建时显示在代码和文本编辑器窗口中。你将在此文件中编写控制台应用程序的代码。它还包含一些 Visual Studio 2015 自动提供的代码，稍后我们将进行检查。\n\
  ### 编写你的第一个程序\n`Program.cs` 文件定义了一个名为 `Program` 的类，该类包含一个名为 `Main` 的方法。在 C# 中，所有可执行代码必须定义在方法内部，所有方法必须属于一个类或结构体。你将在第\
  \ 7 章“创建和管理类和对象”中学习更多关于类的知识，并将在第 9 章“使用枚举和结构创建值类型]”中学习结构体。\n`Main` 方法指定了程序的入口。该方法应该按照\
  \ `Program` 类中指定的方式作为静态方法定义；否则，当你运行程序时，.NET Framework 可能无法将其识别为应用程序的起点。（你将在第 3 章“编写方法和应用范围”中详细查看方法，并在第\
  \ 7 章中获取关于静态方法的更多信息。）\n- `Main` 方法指定了程序的入口。\n\n\n\n\n2. 在新行上输入单词 `Console`；这是程序集提供的另一个类的名称。它提供了在控制台窗口显示消息和从键盘读取输入的方法。\n\
  当你在单词 `Console` 开始输入字母 `C` 时，会出现一个 IntelliSense 列表。此列表包含了在该语境下有效的所有 C# 关键字和数据类型。你可以继续输入，也可以滚动列表并用鼠标双击该项。或者，在你输入\
  \ `Cons` 之后，IntelliSense 列表会自动定位到 Console 项，你可以按 Tab 或 Enter 键选择它。\n![Image](img/Image00017.jpg)\n\
  *Main* 应该像这样：\n点击查看代码图像\n```csharp\n{\n}\n\n\n\n\n\n\n\n\nstatic void Main(string[]\
  \ args)\n    Console.WriteLine\n```\n5. 输入一个左括号 `(`。另一个 IntelliSense 提示出现。\n\n\n\
  此提示显示了 `WriteLine` 方法可以接受的参数。实际上，`WriteLine` 是一个**重载方法**，这意味着 `Console` 类包含多个同名为\
  \ `WriteLine` 的方法——它实际上提供了该方法的 19 种不同版本。你可以使用 `WriteLine` 方法的每个版本来输出不同类型的数据。（第 3\
  \ 章）中更详细地描述了重载方法。）`Main` 现在看起来应该像这样：\n点击此处查看代码图像\n```csharp\n{\n}\n\n\n\n\n\n\n\n\
  \nstatic void Main(string[] args)\n    Console.WriteLine();\n```\n**7.** 移动光标，在\
