  \n属于某个类并操作该类特定实例的数据的方法称为`实例方法（instance methods)`。（你将在本章的晚些部分学习其他类型的方法）。在接下来的练习中，你将为\
  \ `Point` 类编写一个实例方法，名为 `DistanceTo`，用于计算两个点之间的距离。\n\n## 编写和调用实例方法\n\n**1.** 在 Visual\
  \ Studio 2015 的 `Classes` 项目中，在构造函数之后，为 `Point` 类添加以下名为 `DistanceTo` 的 `public`\
  \ 实例方法。该方法接受一个名为 `other` 的 `Point` 参数并返回一个 `double` 类型。\n\n`DistanceTo` 方法应该如下：\n\
  \n点击此处查看代码图片\n\n```csharp\nclass Point\n{\n    ...\n    public double DistanceTo(Point\
  \ other)\n    {\n    }\n}\n```\n\n在接下来的步骤中，你将向 `DistanceTo` 实例方法的体中添加代码，以计算并返回调用的\
  \ `Point` 对象与作为参数传递的 `Point` 对象之间的距离。要实现这一点，你必须计算 x 坐标和 y 坐标之间的差。\n\n**2.** 在 `DistanceTo`\
  \ 方法中，声明一个名为 `xDiff` 的局部 `int` 变量，并按照下方粗体所示将其初始化为 `this.x` 和 `other.x` 之差：\n\n点击此处查看代码图片\n\
  \n```csharp\npublic double DistanceTo(Point other)\n{\n    int xDiff = this.x -\
  \ other.x;\n}\n```\n\n**3.** 声明另一个名为 `yDiff` 的局部 `int` 变量，并按照此处粗体所示将其初始化为 `this.y`\
  \ 和 `other.y` 之差：\n\n点击此处查看代码图片\n\n```csharp\npublic double DistanceTo(Point other)\n\
  {\n    int xDiff = this.x - other.x;\n    int yDiff = this.y - other.y;\n}\n```\n\
  \n***\n\n![Image](img/Image00005.jpg) 备注\n\n尽管 `x` 和 `y` 字段是私有的（private），但同一类的其他实例仍然可以访问它们。重要的一点是，`private`\
  \ 术语作用于类级别，而不是对象级别；作为同一类实例的两个对象可以访问彼此的私有数据，但另一个类实例的对象则不能访问。\n\n***\n\n要计算距离，你可以使用勾股定理并计算\
  \ `xDiff` 平方与 `yDiff` 平方和的平方根。`System.Math` 类提供了 `Sqrt` 方法，可以使用它来计算平方根。\n\n**4.**\
  \ 声明一个类型为 `double` 的变量 `distance`，并用它存储上述计算的结果。\n\n点击此处查看代码图片\n\n```csharp\npublic\
  \ double DistanceTo(Point other)\n{\n    int xDiff = this.x - other.x;\n    int\
  \ yDiff = this.y - other.y;\n    double distance = Math.Sqrt((xDiff * xDiff) + (yDiff\
  \ * yDiff));\n}\n```\n\n**5.** 在 `DistanceTo` 方法的末尾添加 `return` 语句，并返回 `distance`\
  \ 变量中的值：\n\n点击此处查看代码图片\n\n```csharp\npublic double DistanceTo(Point other)\n{\n\
  \    int xDiff = this.x - other.x;\n    int yDiff = this.y - other.y;\n    double\
  \ distance = Math.Sqrt((xDiff * xDiff) + (yDiff * yDiff));\n    return distance;\n\
  }\n```\n\n你现在将测试 `DistanceTo` 方法。\n\n**6.** 回到 `Program` 类中的 `doWork` 方法。在声明并初始化\
  \ `origin` 和 `bottomRight Point` 变量的语句之后，声明一个类型为 `double` 的变量 `distance`。通过在 `origin`\
  \ 对象上调用 `DistanceTo` 方法并将 `bottomRight` 对象作为参数传递，将该 `double` 变量初始化为获得的结果。\n\n`doWork`\
  \ 方法现在应该如下：\n\n点击此处查看代码图片\n\n```csharp\nstatic void doWork()\n{\n    Point origin;\n\
  \    Point bottomRight;\n    double distance = origin.DistanceTo(bottomRight);\n\
  }\n```\n\n***\n\n![Image](img/Image00005.jpg) 备注\n\n尽管 `x` 和 `y` 字段是私有的（private），同一类的其他实例仍然可以访问它们。重要的一点是，`private`\
  \ 术语作用于类级别，而不是对象级别；作为同一类实例的两个对象可以访问彼此的私有数据，但另一个类实例的对象则不能访问。\n\n**7.** 在 `doWork`\
  \ 方法中添加另一个语句，使用 `Console.WriteLine` 输出 `distance` 的值。\n\n完成后的 `doWork` 方法如下：\n\n\
  点击此处查看代码图片\n\n```csharp\nstatic void doWork()\n{\n    Point origin;\n    Point bottomRight;\n\
  \    double distance = origin.DistanceTo(bottomRight);\n    Console.WriteLine($\"\
  Distance is: {distance}\");\n}\n```\n\n**8.** 在“生成（Build）”菜单上，点击“生成解决方案（Build Solution）”。**9.**\
  \ 在“调试（Debug）”菜单上，点击“启动调试”。\n\n## 理解静态方法\n\n在前面的练习中，你使用了 `Math` 类的 `Sqrt` 方法。同样，在查看\
  \ `Circle` 类时，你读取了 `Math` 类的 `PI` 字段。调用 `Sqrt` 或读取 `PI` 的方式都是针对类，而不是对象。那么到底发生了什么，它是如何工作的？\n\
  \n你经常会发现并不是所有方法都属于实例；它们提供了独立于任何实例的有用函数。整个书中使用的 `Console.WriteLine` 方法就是一个常见的例子。`Sqrt`\
  \ 方法也是另一个。如果 `Sqrt` 是一个实例方法，你就必须创建一个 `Math` 对象来调用 `Sqrt`：\n\n```csharp\nMath m =\
  \ new Math();\ndouble d = m.Sqrt(42);\n```\n\n这将非常繁琐。`Math` 对象对平方根的计算没有任何贡献。`Sqrt`\
  \ 需要的所有输入数据都通过参数列表提供，结果通过方法的返回值传给调用者。这里并不需要对象，因此将 `Sqrt` 强加于实例枷锁中并不是明智之。\n\n***\n\
  \n![Image](img/Image00005.jpg) 备注\n\n除了包含 `Sqrt` 方法和 `PI` 字段外，`Math` 类还包含许多数学工具方法，如\
  \ `Sin、Cos、Tan` 和 `Log`。\n\n***\n\n在 C# 中，所有方法必须声明在类内部。然而，如果你将一个方法或字段声明为 `static`（静态），你就可以使用类名调用该方法或访问该字段。不需要实例。这就是\
  \ `Math` 类 `Sqrt` 方法的声明方式：\n\n```csharp\nclass Math\n{\n    public static double\
  \ Sqrt(double d)\n    {\n        ...\n    }\n}\n```\n\n静态方法不依赖实例，它无法访问类中定义的任何实例字段或实例方法；它只能使用标记为\
  \ `static` 的字段和其他方法。\n\n## 创建共享字段\n\n\n\n\n将字段定义为 `static` 允许你创建一个字段实例，该实例由从同一个类创建的所有对象共享。（非静态字段是每个对象实例私有的。）在接下来的示例中，每当创建一个新的\
  \ `Circle` 对象时，`Circle` 类中的静态字段 `NumCircles` 都会被 `Circle` 构造函数递增：\n\n点击此处查看代码图像\n\
  \n```java\nclass Circle\n{\n    private int radius;\n    public static int NumCircles\
  \ = 0;\n\n    public Circle() // default 构造函数\n    {\n        radius = 0;\n    \
  \    NumCircles++;\n    }\n\n    public Circle(int initialRadius) // 重载构造函数\n  \
  \  {\n        radius = initialRadius;\n        NumCircles++;\n    }\n}\n```\n\n\
  所有的 `Circle` 对象共享 `NumCircles` 字段的同一个实例，因此语句 `NumCircles++;` 在每次创建新实例时都会增加同一份数据。请注意，你不能用\
  \ `this` 关键字前缀 `NumCircles`，因为 `NumCircles` 不属于某个特定的对象。\n\n你可以通过指定 `Circle` 类而不是\
  \ `Circle` 对象从类外部访问 `NumCircles` 字段，如下所示：\n\n点击此处查看代码图像\n\n```csharp\nConsole.WriteLine($\"\
  Number of Circle objects: {Circle.NumCircles}\");\n```\n\n* *\n\n![Image](img/Image00005.jpg)\
  \ 注意\n\n请记住，静态方法也被称为*类方法*。然而，静态字段通常不被称为*类字段*；它们仅被称为*静态字段*（有时称为*静态变量*）。\n\n## 使用\
  \ `const` 关键字创建静态字段\n\n通过在字段前加上 `const` 关键字，你可以声明一个字段是静态的，但其值永远不会改变。关键字 `const`\
  \ 是 *constant*（常量）的缩写。`const` 字段在声明时不使用 `static` 关键字，但它仍然是静态的。然而，由于超出本书范围的原因，只有当字段为数值类型（如\
  \ `int` 或 `double`）、字符串或枚举时，你才能将其声明为 `const`。（你将在第 9 章“使用枚举和结构创建值类型”中学习枚举。）例如，这里是\
  \ `Math` 类将 `PI` 声明为 `const` 字段的方式：\n\n点击此处查看代码图像\n\n```csharp\nclass Math\n{\n\
  \    ...\n    public const double PI = 3.14159265358979;\n}\n```\n\n## 理解静态类\n\n\
  C# 语言的另一个特性是可以将一个类声明为 `static`。静态类只能包含静态成员。（使用该类创建的所有对象都共享这些成员的单一副本。）静态类的目的仅仅是作为实用方法和字段的容器。静态类不能包含任何实例数据或方法，而且尝试使用\
  \ `new` 运算符创建静态类的实例是没有意义的。如果你尝试这样做，编译器将生成错误。\n\n如果你想访问静态类的成员，必须使用类名而不是实例。例如：\n\n\
  ```csharp\npublic static class Calculator\n{\n    public static int Square(int x)\n\
  \    {\n        return x * x;\n    }\n}\n\n// 使用\nint result = Calculator.Square(5);\n\
  ```\n\n（注：提供的静态类部分原始文本包含重复/乱码短语；我已根据要求根据标准 C# 文档重构了逻辑流。）\n\n\n\n现在的问题是：`Point` 类的用户如何发现创建了多少个\
  \ `Point` 对象？目前，`objectCount` 字段是私有的，在类外部无法访问。一个糟糕的解决方案是让 `objectCount` 字段设为公开访问。这种策略会破坏类的封装性，并且你将无法保证\
  \ `objectCount` 字段的值是正确的，因为任何人都可以更改该字段的值。好得多的办法是提供一个公共静态方法，返回 `objectCount` 字段的值。这正是你现在要做的。\n\
  \n**4.** 向 `Point` 类中添加一个名为 `ObjectCount` 的公共静态方法，该方法返回一个 `int` 但不接受任何参数。该方法应该返回\
  \ `objectCount` 字段的值，如此处粗体字体所示：\n\n点击此处查看代码图像\n\n```csharp\nclass Point\n{\n   \
  \ ...\n\n    public static int ObjectCount() => objectCount;\n}\n```\n\n**5.** 在代码和文本编辑器中显示\
  \ `Program` 类。在 `doWork` 方法中添加一条语句，将从 `Point` 类的 `ObjectCount` 方法返回的值写入屏幕，如下所示代码示例中的粗体字体所示：\n\
  \n点击此处查看代码图像\n\n```csharp\nstatic void doWork()\n{\n    Point origin = new Point();\n\
  \    Point bottomRight = new Point(1366, 768);\n    double distance = origin.distanceTo(bottomRight);\n\
  \    Console.WriteLine($\"Distance is: {distance}\");\n    Console.WriteLine($\"\
  Number of Point objects: {Point.ObjectCount()}\");\n}\n```\n\n通过引用类名 `Point` 来调用\
  \ `ObjectCount` 方法，而不是引用 `Point` 变量名（如 `origin` 或 `bottomRight`）。因为在调用 `ObjectCount`\
  \ 时已经创建了两个 `Point` 对象，所以该方法应该返回值 2。\n\n**6.** 在调试（Debug）菜单上，点击转转调试启动（Start Without\
  \ Debugging）。\n\n确认消息“Number of Point objects: 2”已写入控制台窗口（在显示 `distance` 变量值的消息之后）。\n\
  \n**7.** 按回车键关闭程序并返回 Visual Studio 2015。\n\n## 匿名类\n\n*匿名类*是一个没有名称的类。这听起来相当奇怪，但在你将在本书后面看到的某些情况下，它实际上非常有用，特别是在使用查询表达式时。（你将在第\
  \ 20 章 的“解耦应用程序逻辑和处理事件”中中学习查询表达式。目前，你只需确信它们是有用的。）\n\n你只需使用 `new` 关键字和一对定义类要包含的字段和值的大括号即可创建匿名类，如下所示：\n\
  \n点击此处查看代码图像\n\n```csharp\nmyAnonymousObject = new { Name = \"John\", Age = 47 };\n\
  ```\n\n该类包含名为 `Name`（初始化为字符串 *“John”*）和 `Age`（初始化为整数 *47*）的公共字段。编译器根据你指定的用于初始化字段的数据类型来推断字段的类型。\n\
  \n当你定义一个匿名类时，编译器会为该类生成自己的名称，但它不会告诉你是什么。因此，匿名类带来了一个潜在的有趣难题：如果你不知道类的名称，你如何创建适当类型的对象并将该类的实例赋值给它呢？在之前显示的代码示例中，变量\
  \ `myAnonymousObject` 的类型应该是什么？答案是你并不知道——这就是匿名类的意义所在！但是，如果你使用 `var` 关键字将 `myAnonymousObject`\
  \ 声明为隐式类型变量，这就不是一个问题了，如下所示：\n\n点击此处查看代码图像\n\n```csharp\nvar myAnonymousObject =\
  \ new { Name = \"John\", Age = 47 };\n```\n\n记住 `var` 关键字会导致编译器创建一个与初始化它的表达式具有相同类型的变量。在这种情况下，该表达式的类型是编译器恰好为匿名类生成的任何名称。\n\
  \n你可以使用熟悉的点表示法来访问对象中的字段，在此处演示：\n\n点击此处查看代码图像\n\n```csharp\nConsole.WriteLine($\"\
  Name: {myAnonymousObject.Name} Age: {myAnonymousObject.Age}\"};\n```\n\n你甚至可以创建同一个匿名类的其他实例，但具有不同的值，如下所示：\n\
  \n点击此处查看代码图像\n\n```csharp\nvar anotherAnonymousObject = new { Name = \"Diana\",\
  \ Age = 46 };\n```\n\nC# 编译器使用字段的名称、类型、数量和顺序来确定两个匿名类实例是否具有相同类型。在这种情况下，变量 `myAnonymousObject`\
  \ 和 `anotherAnonymousObject` 具有相同数量的字段、相同的名称和类型以及相同的顺序，因此两个变量都是同一个匿名类的实例。这意味着你可以执行如下的赋值语句：\n\
  \n点击此处查看代码图像\n\n```csharp\nanotherAnonymousObject = myAnonymousObject;\n```\n\n\
  ***\n\n![Image](img/Image00005.jpg) 注意\n\n请注意，此赋值语句可能无法实现你预期的效果。你将在第 8 章中学习更多关于赋值对象变量的知识。\n\
  \n***\n\n匿名类的内容有许多限制。例如，匿名类只能包含公共字段，所有字段必须经过初始化，它们不能是静态的，而且你不能为它们定义任何方法。你将在本书中定期使用匿名类，并在在此过程中学习更多关于它们的知识。\n\
  \n## 总结\n\n在本章中，你看到了如何定义新类。你学到了默认情况下，类的字段和方法是私有的，类外部代码无法访问，但你可以使用 `public` 关键字将字段和方法暴露给外部世界。你看到了如何使用\
  \ `new` 关键字创建类的实例，以及如何定义初始化实例的构造函数。最后，你看到了如何实现静态字段和方法，以提供独立于任何实例的数据和操作。\n\n![Image](img/Image00001.jpg)\
