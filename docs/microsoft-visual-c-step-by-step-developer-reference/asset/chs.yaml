  \ C# 的语法和语义，包括语句、关键字和标识符。你将看到最重要的 C# 语句。\n### 语句\n*语句*（statement）是执行操作的命令，例如计算值或显示消息。在\
  \ C# 中，语句遵循描述其格式和构造定义的规则。这些规则统称为语法（syntax）。与之相反，语句*做什么*的规范统称为语义（semantics）。C# 最简单的语法规则之一是必须用分号终止所有语句。正如示例\
  \ 1 所示，如果没有终止符，语句将无法编译：\n```csharp\n``````\n* * *\n### 标识符\n*标识符*（identifiers）是你用于识别程序中元素的名称，例如命名空间、类、方法和变量。（你很快就会学到变量。）在\
  \ C# 中，在选择标识符时必须遵守以下语法规则：\n- ![Image](img/Image00001.jpg) 你可以使用字母（大小写字母）、数字和下划线字符。\n\
