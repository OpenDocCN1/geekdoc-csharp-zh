  \n![Image](img/Image00090.jpg)\n\n## 第 10 章 使用数组\n\n完成本章后，你将能够：\n\n![Image](img/Image00001.jpg)\
  \ 声明数组变量。\n![Image](img/Image00001.jpg) 用一组数据项填充数组。\n![Image](img/Image00001.jpg)\
  \ 访问数组中存储的数据项。\n![Image](img/Image00001.jpg) 遍历数组中的数据项。\n\n你已经学习了如何创建和使用许多不同类型的变量。然而，到目前为止你看到的所有变量示例都有共同点——它们存储关于单个项目的信息（一个\
  \ `int`、一个 `float`、一个 `Circle`、一个 `Date` 等）。如果你需要处理一组项目会怎样？一种解决方案是为集合中的每个项目创建一个变量，但这会导致许多后续问题：你需要多少变量？你应该如何命名它们？如果你需要对集合中的每个项目执行相同的操作（例如对整数集合中的每个变量加\
  \ 1），你该如何避免非常重复的代码？为单独的项使用变量假设你在编写程序时已经知道需要多少个项目了。但这种情况发生的频率有多高呢？例如，如果你正在编写一个从数据库读取并处理记录的应用程序，数据库中有多少条记录，这个数字变化的概率有多大？\n\
  \n数组提供了一种帮助解决这些问题的机制。\n\n### 声明和创建数组\n\n`array` 是项的无序序列。数组中的所有项具有相同类型，这与结构体或类中的字段不同，后者的字段可以有不同的类型。数组中的项存储在连续的内存块中，并通过索引进行访问，而结构体或类中的字段是通过名称访问的。\n\
  \n## 声明数组变量\n\n你通过指定元素类型的名称、后跟一对方括号、以及变量名称来声明数组变量。方括号表示该变量是一个数组。例如，要声明一个名为 `pins`\
  \ 的 `int` 变量数组（用于存储一组个人识别码），你可以写下如下代码：\n\n点击此处查看代码图像\n\n```java\nint[] pins; //\
  \ 个人识别码\n```\n\n* *\n\n![Image](img/Image00005.jpg) 注意事项\n\n如果你是 Microsoft Visual\
  \ Basic 程序员，你应该注意到在声明中使用的是方括号而不是圆括号。如果你熟悉 C 和 C++，也请注意数组的大小不是声明的一部分。此外，方括号必须放置在变量名的\
  \ `before`（之前）。\n\n* *\n\n你并不限制仅使用原始类型作为数组元素。你还可以创建结构体、枚举和类的数组。例如，你可以像这样创建一个 `Date`\
  \ 结构体的数组：\n\n```java\nDate[] dates;\n```\n\n* *\n\n![Image](img/Image00013.jpg)\
  \ 提示\n\n给数组变量起复数形式的名称通常是有帮助的，例如 `places`（其中每个元素都是一个 `Place`）、`people`（其中每个元素都是一个\
  \ `Person`）或 `times`（其中每个元素都是一个 `Time`）。\n\n* *\n\n#### 创建数组实例\n\n无论其元素类型如何，数组都是引用类型。这意味着数组变量\
  \ `refers`（引用）堆上存储数组元素的连续内存块，就像类变量引用堆上的对象一样。（有关值和引用的描述以及栈与堆之间的差异，请参阅第 8 章中的“理解值和引用”。）此规则适用于数组中数据项的任何类型。即使数组包含如\
  \ `int` 这样的值类型，内存仍分配在堆上；这是值类型未在栈上分配内存的唯一情况。\n\n请记住，当你声明类变量时，在通过 `new` 创建实例之前，不会为对象分配内存。数组遵循相同的模式：当你声明数组变量时，你没有声明它的大小，也不会分配内存（除了在栈上保留引用之外）。只有在创建实例时，数组才会被赋予内存，这也是你指定数组大小的时间点。\n\
  \n要创建一个数组实例，你使用 `new` 关键字，后跟元素类型，然后是在方括号内包含要创建的数组的大小。创建数组还会使用现在熟悉的默认值（`0`、`null`\
  \ 或 `false`，取决于类型类型是数值型、引用型还是布尔型）来初始化其元素。例如，要为早先声明的 `pins` 变量创建并初始化一个包含四个整数的新数组，你可以这样写：\n\
  \n```java\npins = new int[4];\n```\n\n下面的插图显示了声明数组时发生了什么，以及稍后创建数组实例的情况：\n\n![Image](img/Image00090.jpg)\n\
  \n由于内存是动态分配的，数组的大小不需要是常量；它可以在运行时计算，如下所示：\n\n点击此处查看代码图像\n\n```java\nint size = int.Parse(Console.ReadLine());\n\
  int[] pins = new int[size];\n```\n\n你也可以创建一个大小为 0 的数组。这听起来可能很奇怪，但对于数组大小动态确定的情况很有用。大小为\
  \ 0 的数组不是 `null` 数组；它是一个包含零元素的数组。\n\n## 填充和使用数组\n\n当你创建数组实例时，数组的所有元素根据其类型初始化为默认值。例如，数值值默认为\
  \ `0`，对象初始化为 `null`，`DateTime` 值设置为 `01/01/0001 00:00:00`，字符串初始化为 `null`。你可以修改这种行为并为数组初始化特定值。通过在括号之间提供逗号分隔的值列表来实现。例如，要将\
  \ `pins` 初始化为值为 `9`、`3`、`7` 和 `2` 的 `int` 数组，你可以这样写：\n\n点击此处查看代码图像\n\n```java\n\
  int[] pins = new int[4]{ 9, 3, 7, 2 };\n```\n\n括号之间的值不需要是常量；它们可以是运行时计算的值，如下例所示，该示例使用随机数填充\
  \ `pins` 数组：\n\n点击此处查看代码图像\n\n```java\nRandom r = new Random();\nint[] pins = new\
  \ int[4]{ r.Next() % 10, r.Next() % 10,\nr.Next() % 10, r.Next() % 10 };\n```\n\n\
  * *\n\n`System.Random` 类是一个伪随机数生成器。`Next` 方法默认返回 `0` 到 `Int32.MaxValue` 之间的非负随机整数。`Next`\
  \ 方法经过重载，其他版本允许你指定范围的最小值和最大值。`Random` 类的默认构造函数使用时间种子值对随机生成器，减少了该类重复随机数序列的可能性。使用重载的构造函数，你可以提供自己的种子值。这样你就可以为测试生成可重复的随机数序列。\n\
  \n* *\n\n括号之间的值数量必须与创建的数组实例的大小完全匹配：\n\n点击此处查看代码图像\n\n```java\nint[] pins = new int[3]{\
  \ 9, 3, 7, 2 }; // 编译错误\n```\n\n\n\n\n\n```csharp\nint[] pins = new int[4]{ 9, 3,\
  \ 7 }; // 编译错误\n\nint[] pins = new int[4]{ 9, 3, 7, 2 }; // 正确\n```\n\n当你以这种方式初始化数组变量时，实际上可以省略\
  \ `new` 表达式和数组的长度。在这种情况下，编译器会根据初始化器的数量计算长度，并生成创建数组的代码，如下例所示：\n\n```csharp\nint[]\
  \ pins = { 9, 3, 7, 2 };\n```\n\n如果你创建了一个结构结构体或对象的数组，可以通过调用结构体或类的构造函数来初始化数组中的每个结构体，如下例所示：\n\
  \n点击此处查看代码图像\n\n```csharp\nTime[] schedule = { new Time(12,30), new Time(5,30) };\n\
  ```\n\n### 创建隐式类型数组\n\n在声明数组时，元素类型必须与你尝试存储在数组中的元素类型匹配。例如，如果你将 `pins` 声明为 `int` 数组（如前面的示例所示），则你无法在该数组中存储\
  \ `double`、`string`、`struct` 或任何不是 `int` 的内容。如果你在声明数组时指定初始化器列表，你可以让 C# 编译器为你推断数组中元素的实际类型，如下所示：\n\
  \n点击此处查看代码图像\n\n```csharp\nvar names = new[]{\"John\", \"Diana\", \"James\", \"\
  Francesca\"};\n```\n\n在这个示例中，C# 编译器确定 `names` 变量是一个字符串数组。值得注意的是此声明中的几个语法上的特殊之处。首先，你从类型中省略了方括号；此示例中的\
  \ `names` 变量简单地声明为 `var`，而不是 `var[]`。其次，你必须在初始化列表之前指定 `new` 运算符和方括号。\n\n如果你使用这种语法，必须确保所有的初始化器都具有相同的类型。接下来的示例会导致编译错误“未找到隐式类型数组的最佳类型”（No\
  \ best type found for implicitly-typed array）：\n\n点击此处查看代码图像\n\n```csharp\nvar bad\
  \ = new[]{\"John\", \"Diana\", 99, 100};\n```\n\n然而，在某些情况下，如果这样做合理，编译器会将元素转换为不同的类型。在接下来的代码中，`numbers`\
  \ 数组是一个 `double` 数组，因为常量 `3.5` 和 `99.999` 都是 `double`，且 C# 编译器可以将整数值 `1` 和 `2` 转换为\
  \ `double` 值：\n\n点击此处查看代码图像\n\n```csharp\nvar numbers = new[]{1, 2, 3.5, 99.999};\n\
  ```\n\n通常，最好避免混合类型，不要寄于编译器会为你转换。\n\n当你处理匿名类型时，隐式类型数组最为有用，正如第 7 章 中“创建和管理类和对象”所述。接下来的代码创建了一个匿名对象数组，每个对象都包含两个字段，用于指定我家人成员的姓名和年龄：\n\
  \n点击此处查看代码图像\n\n```csharp\nvar names = new[] { new { Name = \"John\", Age = 50 },\n\
  \nnew { Name = \"Diana\", Age = 50 },\n\nnew { Name = \"James\", Age = 23 },\n\n\
  new { Name = \"Francesca\", Age = 21 } };\n```\n\n匿名类型中的字段对于数组的每个元素必须是相同的。\n\n##\
  \ 访问单个数组元素\n\n要访问单个数组元素，必须提供一个指示你所需元素的索引。数组索引是从 0 开始的；因此，数组的第一个元素位于索引 0 而不是索引 1。索引值\
  \ `1` 访问第二个元素。例如，你可以使用以下代码将 `pins` 数组的元素 2（第三个元素）的内容读取到 `int` 变量中：\n\n```csharp\n\
  int myPin;\n\nmyPin = pins[2];\n```\n\n同样，你可以通过给带索引元素赋值来更改数组的内容：\n\n```csharp\n\
  myPin = 1645;\n\npins[2] = myPin;\n```\n\n所有数组元素的访问都经过边界检查。如果你指定的索引小于 0 或大于或等于数组的长度，编译器将抛出\
  \ `IndexOutOfRangeException` 异常，如下例：\n\n点击此处查看代码图像\n\n```csharp\ntry\n{\n\nint[]\
  \ pins = { 9, 3, 7, 2 };\n\nConsole.WriteLine(pins[4]); // 错误，第 4 个也是最后一个元素位于索引\
  \ 3\n}\n\ncatch (IndexOutOfRangeException ex)\n{\n\n...\n}\n```\n\n### 遍历数组\n\n\
  所有数组实际上都是 `System.Array` 的实例。`foreach` 语句实际上是 `System.Array` 的实例，你可以通过 `Length`\
  \ 属性来遍历数组包含的元素。例如，以下代码通过 `for` 遍历数组：\n\n点击此处查看代码图像\n\n```csharp\nint[] pins = {\
  \ 9, 3, 7, 2 };\n\nfor (int index = 0; index < pins.Length; index++)\n{\n\n    int\
  \ pin = pins[index];\n\n    Console.WriteLine(pin);\n}\n```\n\n\n\n\n你可以定义接受数组作为参数的方法，或将数组作为返回值返回。\n\
  \n将数组作为参数传递的语法与声明数组非常相似。例如，下面的代码示例定义了一个名为 `ProcessData` 的方法，它接受一个整数数组作为参数。该方法的体遍历数组并对每个元素执行某些未指定的处理：\n\
  \n点击此处查看代码图像\n\n```java\npublic void ProcessData(int[] data)\n{\n    foreach (int\
  \ i in data)\n    {\n        ...\n    }\n}\n```\n\n需要注意的是，数组是引用对象，因此如果你在像 `ProcessData`这样的方法内部修改了作为参数传递的数组的内容，该修改对于所有该数组的引用都是可见的，包括作为参数传递的原始参数。\n\
  \n要从方法返回数组，你需要指定数组的类型作为返回类型。在方法中，你创建并填充数组。下面的示例提示用户输入数组的大小，然后输入每个元素的数据。由方法创建的数组将作为返回值返回：\n\
  \n点击此处查看代码图像\n\n```java\npublic int[] ReadData()\n{\n    Console.WriteLine(\"How\
  \ many elements?\");\n    string reply = Console.ReadLine();\n    int numElements\
  \ = int.Parse(reply);\n    int[] data = new int[numElements];\n    for (int i =\
  \ 0; i < numElements; i++)\n    {\n        Console.WriteLine($\"Enter data for element\
  \ {i}\");\n        reply = Console.ReadLine();\n        int elementData = int.Parse(reply);\n\
  \        data[i] = elementData;\n    }\n    return data;\n}\n```\n\n你可以像这样调用 `ReadData`\
  \ 方法：\n\n```java\nint[] data = ReadData();\n```\n\n***\n\n# 数组参数和 Main 方法\n\n你可能已经注意到应用程序的\
  \ `Main` 方法接受一个字符串数组作为参数：\n\n点击此处查看代码图像\n\n```java\nstatic void Main(string[] args)\n\
  {\n    ...\n}\n```\n\n记住，`Main` 方法是在你的程序开始运行时被调用的；它是应用程序的入口点。如果你从命令行启动应用程序，可以指定额外的命令行参数。Windows\
  \ 操作系统会将这些参数传递给公共语言运行时 (CLR)，随后 CLR 将它们作为参数传递给 `Main` 方法。这种机制为你提供了一种简单的方法，允许用户在应用程序开始运行时提供信息，而不是通过交互方式提示用户。如果你想构建可以从自动化脚本运行的工具，这种方法非常有用。\n\
  \n下面的示例来自一个名为 `MyFileUtil` 的实用工具应用程序，该程序处理文件。它在命令行上期望一组文件名，并调用 `ProcessFile` 方法（未显示）来处理指定的每个文件：\n\
  \n点击此处查看代码图像\n\n```java\nstatic void Main(string[] args)\n{\n    foreach (string\
  \ filename in args)\n    {\n        ProcessFile(filename);\n    }\n}\n```\n\n用户可以这样从命令行运行\
  \ `MyFileUtil` 应用程序：\n\n`MyFileUtil C:\\Temp\\TestData.dat C:\\Users\\John\\Documents\\\
  MyDoc.txt`\n\n每个命令行参数由空格分隔。验证这些参数是否有效取决于 `MyFileUtil` 应用程序。\n\n***\n\n### 复制数组\n\
  \n数组是引用类型（记住数组是 `System.Array` 类的实例）。数组变量包含一个指向数组实例的引用。这意味着当你复制一个数组变量时，你实际上得到了两个指向同一个数组实例的引用，如下例所示：\n\
  \n点击此处查看代码图像\n\n```java\nint[] pins = { 9, 3, 7, 2 };\nint[] alias = pins; // alias\
  \ 和 pins 指向同一个数组实例\n```\n\n在这个示例中，如果你修改了 `pins[1]` 的值，则该更改在读取 `alias[1]` 时也将是可见的。\n\
  \n如果你想复制数组变量所引用的数组实例（堆上的数据），你必须做两件事。第一，你创建一个与你正在复制的数组类型相同且长度相同的新数组实例。其次，你将数据从原始数组逐个元素地复制到新数组，如下例所示：\n\
  \n点击此处查看代码图像\n\n```java\nint[] pins = { 9, 3, 7, 2 };\nint[] copy = new int[pins.Length];\n\
  for (int i = 0; i < pins.Length; i++)\n{\n    copy[i] = pins[i];\n}\n```\n\n注意，此代码使用原始数组的\
  \ `Length` 属性来指定新数组的大小。\n\n复制数组实际上是许多应用程序的共同需求——以至于 `System.Array` 类提供了一些你可以使用的有用方法来复制数组。例如，`CopyTo`\
  \ 方法在给定起始索引的情况下，将一个数组的内容复制到另一个数组。例如，`CopyTo` 方法将 `pins` 数组的内容从索引零复制到 `copy` 数组：\n\
  \n点击此处查看代码图像\n\n```java\nint[] pins = { 9, 3, 7, 2 };\nint[] copy = new int[pins.Length];\n\
  pins.CopyTo(copy, 0);\n```\n\n另一种复制方法是使用名为 `Copy` 的 `System.Array` 静态方法。与 `CopyTo`\
  \ 一样，在调用前必须初始化目标数组：\n\n点击此处查看代码图像\n\n```java\nint[] pins = { 9, 3, 7, 2 };\nint[]\
  \ copy = new int[pins.Length];\nArray.Copy(pins, copy);\n```\n\n确保为 `Copy` 指定一个有效的长度值。如果你提供负值，方法将抛出\
  \ `ArgumentOutOfRangeException`。如果你的值大于数组中的元素数量，方法将抛出 `ArgumentException`。\n\n另一种替代方案是使用名为\
  \ `Clone` 的 `System.Array` 实例方法。你可以调用此方法创建一个并复制整个数组：\n\n点击此处查看代码图像\n\n```java\n\
  int[] pins = { 9, 3, 7, 2 };\nint[] copy = (int[])pins.Clone();\n```\n\n`Clone`\
  \ 方法在第 8 章 中描述。`Array` 类的 `Clone` 方法返回的是 `object` 而不是 `Array`，这就是为什么在使用它时必须转换为相应的类型的数组。此外，`Clone`、`CopyTo`\
  \ 和 `Copy` 方法都创建数组的浅拷贝。如果被复制的元素包含引用，`Clone` 方法仅复制引用而不是所引用的对象。\n\n***\n\n***\n\n\
  ## 使用多维数组\n\n到目前为止的数组包含一个维度，你可以将它们视为值的简单列表。你可以创建多个维度的数组。例如，要创建一个二维数组，你需要指定一个两个整数索引的数组。下面的代码创建了一个包含\
  \ 24 个整数的二维数组 `items`。如果有帮助，你可以将数组视为表格，第一个维度指定行数，第二个维度指定列数。\n\n```java\nint[,] items\
  \ = new int[4, 6];\n```\n\n要访问数组中的元素，你需要提供两个索引值来指定持有元素的单元格（行和列的交叉点）。下面的代码显示了使用 `items`\
  \ 数组的一些示例：\n\n点击此处查看代码图像\n\n```java\nitems[2, 3] = 99; // 将单元格(2,3) 设置为 99\nitems[2,\
  \ 4] = items[2,3]; // 将单元格(2,3)元素复制到单元格(2,4)\nitems[2, 4]++; // 将单元格(2,4)的整数值加 1\n\
  ```\n\n\n\n你可以指定的数组维度没有限制。接下来的代码示例创建并使用了一个名为 `cube` 的数组，该数组包含三个维度。注意，你必须指定三个索引来访问数组中的每个元素。\n\
  \n点击此处查看代码图像\n\n```csharp\nint[, ,] cube = new int[5, 5, 5];\n\ncube[1, 2, 1] =\
  \ 101;\n\ncube[1, 2, 2] = cube[1, 2, 1] * 3;\n```\n\n此时，值得对创建超过三个维度的数组提供一性的警告。具体来说，数组可能会消耗大量内存。`cube`\
  \ 数组包含 125 个元素（5 * 5 * 5）。一个每个维度大小为 5 的四维数组包含 625 个元素。如果你开始创建三个或更多维度的数组，很快就会耗尽内存。因此，在使用多维数组时，你应该始终准备好捕获并处理\
  \ `OutOfMemoryException` 异常。\n\n### 创建交错数组\n\n在 C# 中，普通的多维数组有时被称为 `rectangular`（矩形）数组。每个维度都有规则的形状。例如，在下面的表格化二维\
  \ `items` 数组中，每一行都有一个包含 40 个元素的列，总共有 160 个元素：\n\n点击此处查看代码图像\n\n```csharp\nint[,]\
  \ items = new int[4, 40];\n```\n\n如上一节所述，多维数组可能会消耗大量内存。如果应用程序只使用每列中的部分数据，那么为未使用的元素分配内存将是浪费。在这种情况下，你可以使用\
  \ `jagged`（交错）数组，其每一列的长度可以，如下所示：\n\n点击此处查看代码图像\n\n```csharp\nint[][] items = new\
  \ int[4][];\n\nint[] columnForRow0 = new int[3];\n\nint[] columnForRow1 = new int[10];\n\
  \nint[] columnForRow2 = new int[40];\n\nint[] columnForRow3 = new int[25];\n\nitems[0]\
  \ = columnForRow0;\n\nitems[1] = columnForRow1;\n\nitems[2] = columnForRow2;\n\n\
  items[3] = columnForRow3;\n\n...\n```\n\n在这个示例中，应用程序第一列只需要 3 个元素，第二列 10 个元素，第三列\
  \ 40 个元素，最后一列 25 个元素。这段代码说明了一个数组的数组——`items` 并不是一个二维数组，它只有一个有一个维度，但该维度中的元素本身也是数组。此外，`items`\
  \ 数组的总大小为 78 个元素，而不是 160 个；没有为应用程序不会使用的元素分配空间。\n\n值得强调的是此示例中的某些语法。以下声明指定 `items`\
  \ 是一个 `int` 数组的数组。\n\n```csharp\nint[][] items;\n```\n\n接下来的语句初始化 `items` 以包含四个元素，每个元素都是一个长度不定的数组：\n\
  \n```csharp\nitems = new int[4][];\n```\n\n数组 `columnForRow0` 到 `columnForRow3`\
  \ 都是单维 `int` 数组，初始化为包含每列所需的数据量。最后，每个列数组被赋值给 `items` 数组中的相应元素，如下：\n\n```csharp\n\
  items[0] = columnForRow0;\n```\n\n记住数组是引用对象，因此此语句只是将 `columnForRow0` 的引用添加到 `items`\
  \ 数组的第一个元素；它并没有实际复制任何数据。你可以通过给 `columnForRow0` 中的索引元素赋值，或者或者通过 `items` 数组引用它来填充该列的数据。以下语句是等价的：\n\
  \n```csharp\ncolumnForRow0[1] = 99;\n\nitems[0][1] = 99;\n```\n\n如果你想创建数组的数组的数组而不是矩形三维数组等等，你可以进一步扩展这个想法。\n\
  \n***\n\n![Image](img/Image00005.jpg) 注意\n\n如果你过去用过 Java 编程语言编写代码，那么你应该对这个概念非常熟悉。Java\
  \ 没有多维数组；相反，你可以按照刚刚描述的那样创建数组的数组。\n\n***\n\n在接下来的练习中，你将使用数组来实现一个处理扑克游戏的纸牌应用程序。该应用程序将显示一个表单，其中从一副标准的（52\
  \ 张）扑克牌中随机发了四手牌。你将完成为每手牌发牌的代码。\n\n### 使用数组实现纸牌游戏\n\n**1.** 如果 Microsoft Visual Studio\
