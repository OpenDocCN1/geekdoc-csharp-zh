  在 `Pack` 类中找到 `DealCardFromPack` 方法。该方法的目的是从牌组中随机抽取一张牌，从牌组中移除该牌以防止其被再次选中，然后将其作为方法的返回值传回。\n\
  \n该方法中的第一个任务是随机选择一个花色。从该方法中删除注释以及抛出 `NotImplementedException` 异常的语句，并将其替换为此处**加粗**的语句：\n\
