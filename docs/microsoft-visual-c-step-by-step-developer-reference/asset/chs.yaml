  点击此处查看代码图像\n```\n```\n### 应用作用域\n你创建变量来存储值。你可以在应用程序的范围内创建变量。例如，Methods 项目中的 `calculateClick`\
  \ 方法创建了一个名为 `calculatedValue` 的 `int` 变量并为其分配初始值零，如下所示：\n点击此处查看代码图像\n```\n{\n  \
  \  ...\n```\n\n该变量在定义处被创建，随后 `calculateClick` 方法中的后续语句就可以使用该变量。这是一个重要的点：变量只有在创建后才能被使用。当方法执行完毕后，该变量就会消失且无法在其他地方使用。\n\
  当变量可以在程序的某个特定位置被访问时，我们就说该变量在该位置处于 `scope`（作用域）。`calculatedValue` 变量具有方法作用域；它可以在整个\
  \ `calculateClick` 方法中被访问，但在该方法之外不能。你也可以定义不同作用域的变量；例如，你可以在方法之外但类内部定义一个变量，该变量可以被类中的任何方法访问。这样的变量被称为具有\
  \ `class scope`（类作用域）。\n换句话说，变量的作用域就是该变量可使用的程序区域。作用域不仅适用于变量，也适用于方法。标识符（变量或方法）的作用域与在程序中引入该标识符的声明位置相关，正如你接下来将学到的。\n\
  ### 定义局部作用域\n构成方法体的左括号和右括号定义了方法的作用域。你在方法体内部声明的任何变量作用域都属于该方法；它们在方法结束时消失，并且只能由在该方法运行的代码访问。这些变量被称为\
  \ `local variables`（局部变量），因为它们对于声明它们的方法是局部的；它们在任何其他方法中都不在作用范围内。\n局部变量的作用域意味着你不能使用它们在方法之间共享信息。考虑这个示例：\n\
