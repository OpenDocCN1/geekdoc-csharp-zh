  \n#### 16. 返回 Visual Studio\n\n## 总结\n\n在本章中，你学习了如何使用某些集合类。特别是，学习了如何使用泛型集合。你还学习了如何使用\
  \ Lambda 表达式来搜索项目。\n\n\n\n\n\n`GetEnumerator` 方法应返回一个实现 `System.Collections.IEnumerator`\
  \ 接口的枚举器对象。该枚举器对象用于遍历（枚举）集合中的元素。`IEnumerator` 接口指定了以下属性和方法：\n\n```csharp\nobject\
  \ Current { get; }\nbool MoveNext();\nvoid Reset();\n```\n\n将枚举器想象成一个指向列表中元素的指针。初始时，指针指向第一个元素*之前*。你调用\
  \ `MoveNext` 方法将指针移动到列表中的下一个（第一个）项目；如果实际上存在另一个项目，则 `MoveNext` 方法应返回 `true`，如果没有，则返回\
  \ `false`。你使用 `Current` 属性来访问当前指向的项，并使用 `Reset` 方法将指针返回到列表第一个项目*之前*。通过使用集合的 `GetEnumerator`\
  \ 方法创建枚举器，反复调用 `MoveNext` 方法，并使用枚举器检索 `Current` 属性的值，你可以一次一个项目地向后遍历集合中的元素。这正好是 `foreach`\
  \ 语句所所做的事情。因此，如果你想创建自己的可枚举集合类，你必须在集合类中实现 `IEnumerable` 接口，并提供一个由集合类 `GetEnumerator`\
  \ 方法返回的 `IEnumerator` 接口实现。\n\n* * *\n\n![Image](img/Image00004.jpg) 重要\n\n乍一看，很容易混淆\
  \ `IEnumerable` 和 `IEnumerator` 接口，因为它们的名称非常相似。务必不要搞混。\n\n* * *\n\n如果你观察仔细，你会注意到\
  \ `IEnumerator` 接口的 `Current` 属性表现出非类型安全的行为，因为它返回的是 `object` 而不是特定类型。然而，你应该高兴地知道，Microsoft\
  \ .NET Framework 类库还提供了泛型的 `IEnumerator<T>` 接口，它的 `Current` 属性返回的是 `T` 而不是其他。同样，还有一个一个\
  \ `IEnumerable<T>` 接口，它包含一个返回 `Enumerator<T>` 对象的 `GetEnumerator` 方法。这两个接口都定义在 `System.Collections.Generic`\
  \ 命名空间中，如果你正在为 .NET Framework 2.0 或更高版本构建应用程序，在定义可枚举集合时，应该使用这些泛型接口而不是非泛型版本。\n\n\
  ## 手动实现枚举器\n\n在以下练习中，你将定义一个实现泛型 `IEnumerator<T>` 接口的类，并为第 17 章中演示二叉树类创建一个枚举器，“引入泛型](#text00024.html_ch17)。”\n\
  \n第 17 章说明了遍历二叉树并显示其内容有多简单。因此，你可能会认为定义一个按相同顺序检索二叉树中每个元素的枚举器是一件简单的事。遗憾的是，你错了。主要问题是，在定义枚举器时，你需要记住自己在结构中的位置，以便后续对\
  \ `MoveNext` 方法的调用能够相应更新位置。递归算法（例如遍历二叉树时使用的算法）并不便于在方法调用之间维护状态信息。出于这个原因，你将首先将二叉树中的数据预处理为更易处理的数据结构（队列），并实际上枚举这个数据结构。当然，这种花招对于遍历二叉树元素的用户来说是隐藏的！\n\
  \n### 创建 `TreeEnumerator` 类\n\n**1.** 如果 Microsoft Visual Studio 2015 尚未运行，请启动它。\n\
  \n**2.** 打开 `BinaryTree` 解决方案，它位于文档文件夹中的 `\\Microsoft Press\\VCSBS\\Chapter 19\\\
  BinaryTree` 文件夹。该解决方案包含了你在第 17 章中创建的 `BinaryTree` 项目的可运行副本。你将向此项目添加新类，并在其中实现 `BinaryTree`\
  \ 类的枚举器。\n\n**3.** 在解决方案资源管理器中，点击 `BinaryTree` 项目。在项目菜单上，点击“添加类”，打开“添加新项 - BinaryTree”对话框。在中间面板中，选择“类”模板，在名称框中输入\
  \ `TreeEnumerator.cs`，然后点击添加。\n\n`TreeEnumerator` 类为 `Tree<TItem>` 对象生成枚举器。为了确保类是类型安全的，你必须提供类型参数并实现\
  \ `IEnumerator<T>` 接口。此外，类型参数必须是类所枚举的 `Tree<TItem>` 对象的有效类型，因此它必须约束为实现 `IComparable<TItem>`\
  \ 接口（`BinaryTree` 类要求树中的项提供一种用于排序的比较方法）。\n\n**4.** 在显示 `TreeEnumerator.cs` 文件的代码和文本编辑器中，修改\
  \ `TreeEnumerator` 类的定义以满足这些要求，如下例加粗所示：\n\n点击此处查看代码图像\n\n```csharp\nclass TreeEnumerator<TItem>\
  \ : IEnumerator<TItem> where TItem : IComparable<TItem>\n{\n}\n```\n\n**5.** 在 `TreeEnumerator<TItem>`\
  \ 类中添加以下三个私有变量，如下文代码加粗所示：\n\n点击此处查看代码图像\n\n```csharp\nclass TreeEnumerator<TItem>\
  \ : IEnumerator<TItem> where TItem : IComparable<TItem>\n{\n    private Tree<TItem>\
  \ currentData = null;\n    private TItem currentItem = default;\n    private Queue<TItem>\
  \ enumData = null;\n}\n```\n\n`currentData` 变量将用于持有枚举树的引用，`currentItem` 变量将持有 `Current`\
  \ 属性返回的值。你将用提取出的值填充 `enumData` 队列，而 `MoveNext` 方法将从该队列返回每个项目。`default` 关键字在本章后面的“使用类型参数初始化变量”节中进行了解释。\n\
  \n**6.** 为 `TreeEnumerator<TItem>` 类添加一个接受 `Tree<TItem>` 参数 `data` 的构造函数。在构造函数的体内，添加一条语句将\
  \ `currentData` 变量初始化为 `data`：\n\n点击此处查看代码图像\n\n```csharp\nclass TreeEnumerator<TItem>\
  \ : IEnumerator<TItem> where TItem : IComparable<TItem>\n{\n    ...\n    public\
  \ TreeEnumerator(Tree<TItem> data)\n    {\n        this.currentData = data;\n  \
  \  }\n}\n```\n\n**7.** 在构造函数之后，向 `TreeEnumerator<TItem>` 类添加以下私有方法 `populate`：\n\
  \n点击此处查看代码图像\n\n```csharp\nclass TreeEnumerator<TItem> : IEnumerator<TItem> where\
  \ TItem : IComparable<TItem>\n{\n    ...\n    private void populate(Queue<TItem>\
  \ enumQueue, Tree<TItem> tree)\n    {\n        if (tree.LeftTree != null)\n    \
  \    {\n            populate(enumQueue, tree.LeftTree);\n        }\n        enumData.Enqueue(tree.NodeData);\n\
  \        if (tree.RightTree != null)\n        {\n            populate(enumQueue,\
  \ tree.RightTree);\n        }\n    }\n}\n```\n\n该方法遍历二叉树，将其包含的数据添加到队列中。使用的算法与 `Tree<TItem>`\
  \ 类中的 `WalkTree` 方法类似，该方法在[第 17 章]中有所描述。主要区别在于，该方法不是将 `NodeData` 值附加到字符串上，而是将这些值存储在队列中。\n\
  \n**8.** 回到 `TreeEnumerator<TItem>` 类的定义处。在类声明中，悬停在 `IEnumerator<TItem>`` 文本上。在出现的下拉上下文菜单（带有灯泡图标）中，点击“显式实现接口”。\n\
  \n此操作为 `IEnumerator<T>` 接口和 `IEnumerator` 接口的方法生成存根并将它们添加到类末尾。它还为 `IDisposable`\
  \ 接口生成 `Dispose` 方法。\n\n\n\n\n\n![Image](img/Image00005.jpg) 注意\n\n`IEnumerator<TItem>`\
  \ 接口继承自 `IEnumerator` 和 `IDisposable` 接口，这就是为什么它们的方法也会出现的原因。事实上，唯一属于 `IEnumerator<TItem>`\
  \ 接口的项是泛型属性 `Current`。`MoveNext` 和 `Reset` 方法属于非泛型的 `IEnumerator` 接口。[第 14 章，“使用垃圾回收和资源管理”]描述了\
  \ `IDisposable` 接口。\n\n* * *\n\n### 9. 检查生成的代码。\n\n属性和方法的主体包含默认实现，该实现仅简单地抛出一个 `NotImplementedException`\
  \ 异常。你将在接下来的步骤中用实际实现替换这些代码。\n\n### 10. 使用此处加粗的代码更新 `MoveNext` 方法的主体：\n\n点击此处查看代码图像\n\
  \n```csharp\nbool IEnumerator.MoveNext()\n{\n    if (this.enumData == null)\n  \
  \  {\n        this.enumData = new Queue<TItem>();\n        populate(this.enumData,\
  \ this.currentData);\n    }\n    if (this.enumData.Count > 0)\n    {\n        this.currentItem\
  \ = this.enumData.Dequeue();\n        return true;\n    }\n    return false;\n}\n\
  ```\n\n枚举器 `MoveNext` 方法的作用实际上是双的。当它第一次被调用时，它应该初始化枚举器使用的数据，并移动到第一条要返回的数据上。（在第一次调用\
  \ `MoveNext` 之前，`Current` 属性返回的值是未定义的，并且会导致异常异常。）在这种情况下，初始化过程包括实例化队列，然后调用 `populate`\
  \ 方法用从树中提取出的数据填充队列。\n\n后续对 `MoveNext` 方法的调用应只需移动数据项，直到没有剩余项为止，如本示例所示，从队列中取出项直到队列为空。重要的是，`MoveNext`\
  \ 实际上并没有返回数据项——那是 `Current` 属性的作用。`MoveNext` 所做的只是更新枚举器中的内部状态（即将 `currentItem` 变量的值设置为从队列中提取的数据项），供\
  \ `Current` 属性使用，如果有下一个值则返回 `true`，否则返回 `false`。\n\n### 11. 按如下加粗所示修改泛型属性 `Current`\
  \ 的 `get` 访问器的定义：\n\n点击此处查看代码图像\n\n```csharp\nTItem IEnumerator<TItem>.Current\n\
  {\n    get\n    {\n        if (this.enumData == null)\n        {\n            throw\
  \ new InvalidOperationException(\"Use MoveNext before calling Current\");\n    \
  \    }\n        return this.currentItem;\n    }\n}\n```\n\n* * *\n\n![Image](img/Image00004.jpg)\
  \ 重要\n\n确保将代码添加到 `Current` 属性的正确实现中。保留非泛型版本 `System.Collections.IEnumerator.Current`\
  \ 及其抛出 `NotImplementedException` 异常的默认实现。\n\n* * *\n\n`Current` 属性检查 `enumData`\
  \ 变量以确保已调用了 `MoveNext`。（在第一次调用 `MoveNext` 之前，该变量将为 `null`。）如果并非如此，该属性将抛出 `InvalidOperationException`——这是\
  \ .NET Framework 应用程序使用的约定机制，用于指示在当前状态下无法执行操作。如果之前已调用过 `MoveNext`，它已经更新了 `currentItem`\
  \ 变量，因此 `Current` 属性只需要返回该变量中的值。\n\n### 12. 找到 `IDisposable.Dispose` 方法。按照后续代码中加粗所示，注释掉\
  \ `throw new NotImplementedException();` 语句。枚举器没有使用任何需要显式释放的资源，因此此方法不需要执行任何操作。然而，它必须存在。有关\
  \ `Dispose` 方法的更多信息，请参阅[第 14 章]\n\n点击此处查看代码图像\n\n```csharp\nvoid IDisposable.Dispose()\n\
  {\n    // throw new NotImplementedException();\n}\n```\n\n### 13. 生成解决方案，如果报告了任何错误则进行纠正。\n\
  \n* * *\n\n### 初始化带有类型参数定义的变量\n\n你应该已经注意到定义并初始化 `currentItem` 变量的语句使用了 `default`\
  \ 关键字。`currentItem` 变量是通过使用类型参数 `TItem` 定义的。当程序编写和编译时，替换 `TItem` 的实际类型可能是未知的——这个问题只有在代码执行时才能得到解决。这使得指定如何初始化该变量变得困难。人们的诱惑是将其设置为\
  \ `null`。然而，如果替换 `TItem` 的类型是值类型，则这种赋值是非法的。（你不能将值类型设置为 `null`，只能设置为引用类型。）同样，如果你由于期望类型是数值型而将其设置为\
  \ `0`，那么如果所使用的类型实际上是引用类型，这将是非法的。还有其他可能性——例如，`TItem` 可能是布尔类型。`default` 关键字解决了这个问题。初始化变量的值将在语句执行时确定。如果\
  \ `TItem` 是引用类型，`default(TItem)` 返回 `null`；如果 `TItem` 是数值型，`default(TItem)` 返回 `0`；如果\
  \ `TItem` 是布尔型，`default(TItem)` 返回 `false`。\n\n* * *\n\n### 实现 IEnumerable 接口\n\n\
  在接下来的练习中，你将修改二叉树类以实现 `IEnumerable<>` 接口。`GetEnumerator` 方法将返回一个 `TreeEnumerator<TItem>`\
