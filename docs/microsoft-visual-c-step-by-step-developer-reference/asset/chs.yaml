  \n## 快速参考\n\n![Image](img/Image00132.jpg)![Image](img/Image00133.jpg)\n\n## 第 20\
  \ 章 解耦应用逻辑和处理事件\n\n完成本章后，你将能够：\n\n-   声明委托类型（delegate type）以创建方法签的抽象。\n-   创建委托实例以引用特定方法。\n\
  -   通过委托调用方法。\n-   定义 Lambda 表达式以指定委托执行的代码。\n-   声明事件字段（event field）。\n-   使用委托处理事件。\n\
  -   引发事件。\n\n书中的许多示例和练习都非常强调对类和结构的仔细定义，以强制封装。通过这种方式，方法的实现可以改变，而不会过度影响使用它们的应用程序。然而，有时封装一个类型的完整功能是不可能或理想的。例如，方法的逻辑可能取决于调用它的哪个组件或应用程序，而这些程序可能需要执行特定特定的处理。但是，当你构建此类类时，你可能不知道哪些应用程序将使用它，并且你需要避免在代码中引入可能会限制你的类使用的依赖关系。委托提供了理想的解决方案，使你能够将方法中的应用逻辑与调用它们的应用程序完全解耦。\n\
  \nC# 中的事件支持一种相关的场景。你在书中练习中编写的大部分代码都假设语句是按顺序执行的。虽然这是最常见的情况，但你会发现有时有必要中断当前的执行流以执行另一个更重要的任务。当该任务完成后，程序可以从之前停止的地方继续。这种风格程序的经典示例是你在涉及图形应用程序的练习中使用的通用\
  \ Windows 平台（UWP）表单。表单显示按钮和文本框等控件。当你点击按钮或在文本框中输入文本时，你期望表单立即做出响应。应用程序必须暂时停止正在做的事情并处理你的输入。这种操作不仅适用于图形用户界面（GUI），还适用于任何必须执行紧急操作的应用程序——例如，当核电站温度过高时关闭反应堆。为了处理这种操作，运行时必须提供两点：一种指示紧急情况发生的机制，以及一种指定在紧急事件发生时应该运行代码的方法。事件结合委托，为你提供了实现遵循这种方法的基础设施。\n\
  \n我们将从查看委托开始。\n\n### 理解委托\n\n委托是对方法的引用。这是一个非常简单的概念，具有极其强大的影响。让我解释一下。\n\n委托之所以被称为委托，是因为它们在被调用时将委托（delegate）给引用的方法。\n\
  \n\n\n通常，当你编写一个调用方法的语句时，你会指定方法的名称（并可能指定该方法所属的对象或结构）。从你的代码中，可以清楚地看到你正在运行哪个方法以及何时运行它。请看下面这个简单的示例，它调用了\
  \ `Processor` 对象的 `performCalculation` 方法（该方法的具体功能或 `Processor` 类如何定义对于本文讨论并不重要）：\n\
  \n点击此处查看代码图片\n\n```javascript\nProcessor p = new Processor();\n\np.performCalculation();\n\
  ```\n\n`delegate`（委托）是一个引用方法的对象。你可以像将 `int` 值赋值给 `int` 变量一样，将对一个方法的引用赋值给委托。接下来的示例创建了一个名为\
  \ `performCalculationDelegate` 的委托，该委托引用了 `Processor` 对象的 `performCalculation` 方法。我刻意省略了声明该委托的语句中的某些元素，因为理解这一概念比担心语法更重要（你很快就会看到完整的语法）。\n\
  \n点击此处查看代码图片\n\n```javascript\nProcessor p = new Processor();\n\ndelegate ... performCalculationDelegate\
  \ ...;\n\nperformCalculationDelegate = p.performCalculation;\n```\n\n请记住，将方法引用赋值给委托的语句并不会在该点运行该方法；方法名后面没有括号，你不需要指定任何参数（如果该方法接收参数的话）。这仅仅是一个赋值语句。\n\
  \n在委托中存储了 `Processor` 对象的 `performCalculation` 方法的引用后，应用程序可以通过委托调用该方法，如下：\n\n```javascript\n\
  performCalculationDelegate();\n```\n\n这看起来像是一个普通的方法调用；如果你不知道真相，看起来就像你实际上在运行一个名为\
  \ `performCalculationDelegate` 的方法。然而，公共语言运行时 (CLR) 知道这是一个委托，因此它会检索委托引用的方法并改为运行它。稍后，你可以更改委托引用的方法，因此调用委托的语句在每次执行时实际上可能会运行不同的方法。此外，一个委托可以同时引用多个方法（可以将其看作方法引用的集合），当你调用委托时，它所引用的所有方法都会运行。\n\
  \n***\n\n![Image](img/Image00005.jpg) 注意\n\n如果你熟悉 C++，委托类似于函数指针。但是，与函数指针不同，委托是完全类型安全的。你可以让委托仅引用与委托签名匹配的方法，而且你不能调用未引用有效方法的委托。\n\
  \n***\n\n### .NET Framework 类库中的委托示例\n\nMicrosoft .NET Framework 类库在它的许多类型中广泛使用了委托，其中两个示例包含在第\
  \ 18 章 的“使用集合”中：`List<T>` 类的 `Find` 方法和 `Exists` 方法。如果你还记得，这些方法会搜索 `List<T>` 集合，要么返回一个匹配的项，要么测试是否存在匹配的项。当\
  \ `List<T>` 类的设计者在实现它时，他们完全不知道在你的应用程序代码中究竟什么才算作“匹配”，因此他们让你通过以谓词（predicate）的形式提供你自己的代码来定义它。谓词实际上只是恰好返回布尔（Boolean）值的委托。\n\
  \n下面的代码应该帮助你回想起如何使用 `Find` 方法：\n\n点击此处查看代码图片\n\n```javascript\nstruct Person\n{\n\
  \    public int ID { get; set; }\n    public string Name { get; set; }\n    public\
  \ int Age { get; set; }\n}\n\n...\n\nList<Person> personnel = new List<Person>()\n\
  {\n    new Person() { ID = 1, Name = \"John\", Age = 47 },\n    new Person() { ID\
  \ = 2, Name = \"Sid\", Age = 28 },\n    new Person() { ID = 3, Name = \"Fred\",\
  \ Age = 34 },\n    new Person() { ID = 4, Name = \"Paul\", Age = 22 },\n};\n\n...\n\
  \n// 查找列表中 ID 为 3 的成员\nPerson match = personnel.Find(p => p.ID == 3);\n```\n\n`List<T>`\
  \ 类暴露的其他使用委托执行其操作的方法示例包括 `Average`、`Max`、`Min`、`Count` 和 `Sum`。这些方法接受一个 `Func` 委托作为参数。`Func`\
  \ 委托引用一个返回值的方法（函数）。在下面的示例中，使用 `Average` 方法计算人员集合中项的平均年龄（`Func<T>` 委托只需返回集合中每个项的\
  \ `Age` 字段的值），使用 `Max` 方法确定 ID 最高的项，而 `Count` 方法计算有多少项的 `Age` 在 30 到 39 之间（包含边界）。\n\
  \n点击此处查看代码图片\n\n```javascript\ndouble averageAge = personnel.Average(p => p.Age);\n\
  Console.WriteLine($\"Average age is {averageAge}\");\n\n...\n\nint id = personnel.Max(p\
  \ => p.ID);\nConsole.WriteLine($\"Person ID is {id}\");\n\n...\n\nint thirties =\
  \ personnel.Count(p => p.Age >= 30 && p.Age <= 39);\nConsole.WriteLine($\"Number\
  \ of personnel in thirties is {thirties}\");\n```\n\n这段代码产生以下输出：\n\n点击此处查看代码图片\n\
  Average age is 32.75\nPerson ID is 4\nNumber of personnel in thirties is 1\n\n在本书的剩余部分，你将遇到这些和其他委托类型的许多示例。你也可以定义自己的委托。完全理解你可能何时想要这样做的最佳方法是看到它们运行，所以接下来我们将通过一个示例。\n\
  \n***\n\n### Func<T, ...> 和 Action<T, ...> 委托类型\n\n`List<T>` 方法 `Average`、`Max`、Count\
  \ 接受的参数实际上是一个泛型 `Func<T, TResult>` 委托；类型参数引用传递给委托的类型以及返回值的类型。对于文中所示的 `Average`、`Max`、Count\
  \ 方法第一个类型参数 `T` 是数据的类型（`Person` 结构体），而 `TResult` 类型参数由委托使用的上下文决定。在下面的示例中，`TResult`\
  \ 的类型是 `int`，因为 `Count` 方法返回的值应该是整数：\n\n```javascript\nint thirties = personnel.Count(p\
  \ => p.Age >= 30 && p.Age <= 39);\n```\n\n因此，在这个示例中，`Count` 方法期望的委托类型是 `Func<Person,\
  \ int>`。\n\n由于编译器根据 `List<T>` 的类型自动生成委托，这一点可能看起来有些学术化，但熟悉这种惯用法是值得的，因为它在 .NET Framework\
  \ 类库中处处出现。事实上，`System` 命名空间定义了一整族 `Func` 委托类型，从用于不带任何参数返回结果的 `Func<TResult>` 到用于接受\
  \ 16 个参数函数的 `Func<T1, T2, T3, T4, ..., T16, TResult>`。如果你发现自己处于需要创建一个与此模式匹配的自定义委托类型的情况下，你应该考虑使用适当的\
  \ `Func` 委托类型。\n\n\n\n\n除了 `Func` 之外，`System` 命名空间还定义了一系列 `Action` 委托类型。`Action`\
  \ 委托用于引用执行操作但不返回结果的方法（即 `void` 方法）。同样，还有一系列 `Action` 委托类型可供选择，范围从 `Action<T>`（指定一个接收单个参数的委托）到\
  \ `Action<T1, T2, T3, T4, ..., T16>`。\n\n***\n\n### 自动化工厂场景\n\n假设你正在为一个自动化工厂编写控制系统。该工厂包含许多不同的机器，每台机器在工厂制造的产品生产过程中执行不同的任务——金属板的成型和折叠、板材焊接、板材喷漆等等。每台机器都由专门的供应商制造并安装。所有机器都由计算机控制，每个供应商都提供了一组函数，供你控制其机器。你的任务是将机器所使用的不同系统集成到一个单一的控制程序中。你决定关注的一个方面是提供一种关闭所有机器的方法——如果需要，越快越好！\n\
  \n每台机器都有自己独特的计算机控制流程（以及函数）用于安全关机，此处总结如下：\n\n点击此处查看代码图像\n\n```text\nStopFolding();\
  \ // 折叠和成型机\nFinishWelding(); // 焊接机\nPaintOff(); // 喷漆机\n```\n\n### 不使用委托实现工厂控制系统\n\
  \n在控制程序中实现关机功能的简单方法如下：\n\n点击此处查看代码图像\n\n```csharp\nclass Controller\n{\n    // 代表不同机器的字段\n\
  \    private FoldingMachine folder;\n    private WeldingMachine welder;\n    private\
  \ PaintingMachine painter;\n    ...\n\n    public void ShutDown()\n    {\n     \
  \   folder.StopFolding();\n        welder.FinishWelding();\n        painter.PaintOff();\n\
  \    }\n    ...\n}\n```\n\n虽然这种方法有效，但它并不具有很好的扩展性或灵活性。如果工厂购买了新机器，你必须修改这段代码；`Controller`\
  \ 类和管理机器的代码是紧耦合的。\n\n### 使用委托实现工厂\n\n尽管每个方法的名称不同，但它们具有相同的“形状”：它们不接受任何参数，且不返回值。（稍后我们会考虑如果不是这种情况会发生什么，请稍等。）因此，每个方法的通用格式如下：\n\
  \n`void methodName();`\n\n这就是委托可以派上用场的地方。你可以使用匹配此形状的委托来引用任何机器的关机方法。你可以像如下所示声明委托：\n\
  \n点击此处查看代码图像\n\n```csharp\ndelegate void stopMachineryDelegate();\n```\n\n注意以下几点：\n\
  \n![图像](img/Image00001.jpg) 你使用了 `delegate` 关键字。\n\n![图像](img/Image00001.jpg) 你指定了返回类型（此例中为\
  \ `void`）、委托的名称（`stopMachineryDelegate`）以及任何参数（在这种情况下没有）。\n\n声明委托后，你可以创建一个实例，并使用\
  \ `+=` 复合赋值运算符使其引用匹配的方法。你可以像这样在 `Controller` 类的构造函数中执行：\n\n点击此处查看代码图像\n\n```csharp\n\
  class Controller\n{\n    delegate void stopMachineryDelegate(); // 委托类型\n    private\
  \ stopMachineryDelegate stopMachinery; // 委托的实例\n    ...\n\n    public Controller()\n\
  \    {\n        this.stopMachinery += folder.StopFolding;\n    }\n    ...\n}\n```\n\
  \n习惯这种语法需要一些时间研究。你将方法“添加”到委托中——记住，此时你并没有实际调用该方法。`+` 运算符在与委托配合使用时被重载以具有这种新含义。（你将在第\
  \ 22 章 中的“运算符重载”中学习更多内容。）注意，你只需指定方法名，而不包含任何括号或参数。\n\n在未初始化的委托上使用 `+=` 运算符是安全的。它会自动初始化。或者，你可以使用\
  \ `new` 关键字显式地用单个特定方法初始化委托，如下所示：\n\n点击此处查看代码图像\n\n```csharp\nthis.stopMachinery\
  \ = new stopMachineryDelegate(folder.StopFolding);\n```\n\n你可以通过调用委托来调用该方法，如下：\n\
  \n```csharp\npublic void ShutDown()\n{\n    this.stopMachinery();\n    ...\n}\n\
  ```\n\n调用委托的语法与你调用方法的语法相同。如果委托引用的方法接受任何参数，你应该在此时的括号之间指定它们。\n\n***\n\n![图像](img/Image00005.jpg)\
  \ 注意\n\n如果你尝试调用一个未初始化且未引用任何方法的委托，你将得到 `NullReferenceException` 异常。\n\n***\n\n使用委托的一个重要优势是，它可以同时引用多个一个方法。你只需要使用\
  \ `+=` 运算符将方法添加到委托中即可，如下所示：\n\n点击此处查看代码图像\n\n```csharp\npublic Controller()\n{\n\
  \    this.stopMachinery += folder.StopFolding;\n    this.stopMachinery += welder.FinishWelding;\n\
  \    this.stopMachinery += painter.PaintOff;\n}\n```\n\n在 `Shutdown` 方法中调用 `this.stopMachinery()`\
  \ 会自动调用每个方法。`Shutdown` 方法不需要知道有多少台机器，也不需要知道方法名称是什么。你可以使用 `-=` 复合赋值运算符从委托中移除方法，此处所示：\n\
  \n点击此处查看代码图像\n\n```csharp\nthis.stopMachinery -= folder.StopFolding;\n```\n\n当前的方案在\
  \ `Controller` 构造函数中将机器方法添加到委托。为了让 `Controller` 类完全独立于各种机器，你需要将 `stopMachineryDelegate`\
  \ 类型设为公共，并为 `Controller` 外部的类提供一种向委托添加方法的方法。你有几种选择：\n\n![图像](img/Image00001.jpg)\
  \ 将 `stopMachinery` 委托设为公共：\n\n点击此处查看代码图像\n\n```csharp\npublic stopMachineryDelegate\
  \ stopMachinery;\n```\n\n![图像](img/Image00001.jpg) 将 `stopMachinery` 委托变量设为私有，但创建一个读写属性来访问它：\n\
  \n点击此处查看代码图像\n\n```csharp\nprivate stopMachineryDelegate stopMachinery;\n...\n\n\
  public stopMachineryDelegate StopMachinery\n{\n    get\n    {\n        return this.stopMachinery;\n\
  \    }\n    set\n    {\n        this.stopMachinery = value;\n    }\n}\n```\n\n![图像](img/Image00001.jpg)\
  \ 通过实现单独 `Add` 和 `Remove` 方法来实现完全封装。`Add` 方法接收方法并将其添加到委托，而 `Remove` 方法从委托中移除指定的方法（注意通过使用委托类型指定方法作为参数）：\n\
  \n点击此处查看代码图像\n\n```csharp\npublic void Add(stopMachineryDelegate stopMethod)\n{\n\
  \    this.stopMachinery += stopMethod;\n}\n\npublic void Remove(stopMachineryDelegate\
  \ stopMethod)\n{\n    this.stopMachinery -= stopMethod;\n}\n```\n\n面向对象的纯主义者可能会选择\
  \ `Add/Remove` 方法。然而，其他方法是经常使用的可行替代方案，这就是为什么在这里展示它们的原因。\n\n无论你选择哪种技术，都应该从 `Controller`\
  \ 构造函数删除删除机器方法添加到委托的代码。然后你可以这样实例化 `Controller` 和代表其他机器的对象（此示例使用了 `Add/Remove` 方法）：\n\
  \n点击此处查看代码图像\n\n```csharp\nController control = new Controller();\nFoldingMachine\
  \ folder = new FoldingMachine();\nWeldingMachine welder = new WeldingMachine();\n\
  ```\n\n\n\n\n\n```cs\nPaintingMachine painter = new PaintingMachine();\n\n...\n\n\
  control.Add(folder.StopFolding);\n\ncontrol.Add(welder.FinishWelding);\n\ncontrol.Add(painter.PaintOff);\n\
  \n...\n\ncontrol.ShutDown();\n\n...\n```\n\n## 声明和使用委托\n\n在接下来的练习中，你将完成一个应用程序，该程序是一个名为\
  \ Wide World Importers 公司系统的一部分。Wide World Importers 进口并销售建筑材料和工具，你将开发的应用程序允许客户浏览\
  \ Wide World Importers 目前的库存商品，并对这些商品下单。该应用程序包含一个显示当前可用商品的表单，以及一个列出客户已选项目的窗格。当客户想要下单时，可以点击表单上的结账（Checkout）按钮。随后系统将处理订单，窗格将被清空。\n\
  \n目前，当客户下单时，会发生几个操作：\n\n![Image](img/Image00001.jpg) 向客户请求付款。\n\n![Image](img/Image00001.jpg)\
  \ 检查订单中的物品，如果其中任何物品受年龄限制（例如电动工具），则会对比订单详情进行审计和跟踪。\n\n![Image](img/Image00001.jpg)\
  \ 为出货目的生成发货单。该发货单包含订单摘要。\n\n审计和发货过程的逻辑独立于结账逻辑，尽管这些过程发生的顺序并不重要。此外，这些元素中的任何一个将来都可能被修改，而且随着未来业务情况或监管要求的变化，结账操作可能需要额外的处理。因此，将付款和结账逻辑与审计及发货过程解耦是理想的，这样更容易维护和升级。你将首先检查该应用程序，看它目前未能实现这一目标。然后你将修改应用程序的结构，以消除结账逻辑与审计发货逻辑之间的依赖关系。\n\
  \n### 检查 Wide World Importers 应用程序\n\n1. 如果 Microsoft Visual Studio 2015 没有运行，请启动它。\n\
  2. 打开 `Delegates` 项目，它位于你文档文件夹中的 `\\Microsoft Press\\VCSBS\\Chapter 20\\Delegates`\
  \ 文件夹中。\n3. 在调试（Debug）菜单上，点击“开始调试（Start Debugging）”。\n\n项目生成并运行。出现一个表单，显示可用物品，以及一个显示订单详情的面板（初始为空）。该应用在一个可以水平滚动的\
  \ `GridView` 控件中显示物品：\n\n![Image](img/Image00134.jpg)\n\n4. 选择一个或多个物品，然后点击“添加（Add）”将其加入购物车。确保你至少选择了一个受年龄限制的物品。\n\
  \n当你添加一个物品时，它会出现在右侧的订单详情窗格中。注意，如果你多次添加同一个物品，每次点击数量都会增加。（此版本的应用程序没有实现从购物车中移除物品的功能。）\n\
  5. 在订单详情窗格中，点击“结账（Checkout）”。\n\n出现一条消息表示订单已提交。订单被赋予一个唯一的 ID，该 ID 将与订单金额一起显示。\n\
  6. 点击“关闭（Close）”关闭消息，然后返回 Visual Studio 2015 环境并停止调试。\n7. 在解决方案资源管理器（Solution Explorer）中，展开\
  \ `Delegates` 项目节点，然后打开 `Package.appxmanifest` 文件。\n\n程序包清单编辑器。\n8. 在程序包清单编辑器中，点击“打包（Packaging）”选项卡。\n\
  \n注意“包名称（Package Name）”字段中的值。它采用全局唯一标识符（GUID）的形式。\n9. 使用文件资源管理器浏览到 `%USERPROFILE%\\\
  AppData\\Local\\Packages\\*yyy* \\LocalState`，其中 `yyy` 是以你上一步注意到的 GUID 开头的标识符值。这是\
  \ Wide World Importers 应用程序的本地文件夹。你应该看到两个文件，一个命名为 `audit-nnnnnn.xml`（`nnnnnn` 是之前显示的订单\
  \ ID），另一个是 `dispatch-nnnnnn.txt`。第一个文件是由应用程序的审计组件生成的，第二个文件是由发货组件生成的发货单。\n\n![Image](img/Image00005.jpg)\
  \ 注意\n如果没有 `audit-nnnnnn.xml` 文件，说明你在下单时没有选择任何受年龄限制的物品。在这种情况下，切换回应用程序并创建一个包含一个或多个此类物品的新订单。\n\
  \n10. 使用 Visual Studio 打开 `audit-nnnnnn.xml` 文件。该文件包含订单中受年龄限制物品的列表，以及订单号和日期。它看起来像这样：\n\
  \n![Image](img/Image00135.jpg)\n\n检查完此列表后，在 Visual Studio 中关闭该文件。\n11. 使用记事本打开 `dispatch-nnnnnn.txt`\
  \ 文件。该文件包含订单摘要，列出了订单 ID 和金额。它看起来像这样：\n\n![Image](img/Image00136.jpg)\n\n关闭记事本，返回\
  \ Visual Studio 2015 并停止调试。\n12. 在 Visual Studio 中，注意解决方案由以下项目组成：\n\n- **Delegates**:\
  \ 该项目包含应用程序本身。`MainPage.xaml` 文件定义了用户界面，应用程序逻辑包含在 `MainPage.xaml.cs` 文件中。\n- **AuditService**:\
  \ 该项目包含实现审计过程的组件。它被封装为类库，并包含一个名为 `Auditor` 的类。该类暴露了一个公共方法 `AuditOrder`，如果订单包含受年龄限制的物品，它会检查订单并生成\
  \ `audit-nnnnnn.xml` 文件。\n- **DeliveryService**: 该项目包含执行发货逻辑的组件，封装为类库。发货功能包含在 `Shipper`\
  \ 类中，它提供一个名为 `ShipOrder` 的方法来处理订单并生成发货单。你可以查看 `Auditor` 和 `Shipper` 类中的代码，但不需要完全理解这些组件的内部工作原理。\n\
  - **DataTypes**: 该项目包含其他项目使用的数据类型。`Product` 类定义了应用程序显示的商品详情，商品数据在 `ProductsDataSource`\
  \ 类中。（应用程序目前使用一组硬编码的商品。）`Order` 和 `OrderItem` 类实现了订单的结构；每个订单包含一个或多个订单项。\n\n13. 在\
  \ `Delegates` 项目中，在代码和文本窗口显示 `MainPage.xaml.cs` 文件，并检查该文件中的私有字段和 `MainPage` 构造函数。重要的元素如下：\n\
  \n点击此处查看代码图像\n\n```cs\n...\nprivate Auditor auditor = null;\n\nprivate Shipper shipper\
  \ = null;\n\npublic MainPage()\n{\n    ...\n    this.auditor = new Auditor();\n\
  \    this.shipper = new Shipper();\n}\n```\n\n`auditor` 和 `shipper` 字段包含 `Auditor`\
  \ 和 `Shipper` 类的引用，构造函数实例化了这些对象。\n\n14. 定位 `CheckoutButtonClicked` 方法。当用户点击结账下单时，将运行该方法。前几行代码如下：\n\
  \n点击此处查看代码图像\n\n```cs\nprivate void CheckoutButtonClicked(object sender, RoutedEventArgs\
  \ e)\n{\n    try\n    {\n        // 执行结账处理\n        if (this.requestPayment())\n\
  \        {\n            this.auditor.AuditOrder(this.order);\n            this.shipper.ShipOrder(this.order);\n\
  \        }\n\n        ...\n    }\n\n    ...\n}\n```\n\n\n\n\n此方法实现了结账处理。它向客户请求付款，然后调用\
  \ `auditor` 对象的 `AuditOrder` 方法，随后调用 `shipper` 对象的 `ShipOrder` 方法。未来任何所需的额外业务逻辑都可以添加到此处。该方法中的剩余代码（`if`\
  \ 语句之后）涉及用户界面的管理：向用户显示消息框并清除订单详情窗格。\n\n![Image](img/Image00005.jpg) 注意\n\n为了简单起见，此应用程序中的\
  \ `requestPayment` 方法目前仅返回 `true` 表示已收到付款。在现实世界中，此方法将执行完整的付款处理。\n\n尽管应用程序按照预期方式运行，但\
  \ `Auditor` 和 `Shipper` 组件与结账处理紧密集成在一起。如果这些组件发生变化，则需要更新应用程序。同样，如果你需要在结账过程中整合额外的逻辑（可能通过使用其他组件来实现），将需要修改应用程序的这部分。\n\
  \n在下一个练习中，你将看到如何将结账操作的业务处理与应用程序解耦。结账处理仍然需要调用 `Auditor` 和 `Shipper` 组件，但它必须具有足够的扩展性，以便于纳入额外的组件。你将通过创建一个名为\
  \ `CheckoutController` 的组件来实现此。`CheckoutController` 组件将实现结账过程的业务逻辑，并暴露一个委托，允许应用程序指定应在该过程内包含哪些组件和方法。`CheckoutController`\
  \ 组件将使用该委托调用这些方法。\n\n### 创建 CheckoutController 组件\n\n1. 在解决方案管理器中，右键点击 `Delegates`\
  \ 解决方案，指向`添加`，然后点击`新建项目`。\n\n2. 在“添加新项目”对话框中，在左侧面板中展开 `Windows`，然后点击 `Universal`\
  \ 节点。在中间面板中，选择`类库 (Universal Windows)` 模板。在`名称` 框中输入 `CheckoutService`，然后点击`确定`。\n\
  \n3. 在解决方案管理器中，展开 `CheckoutService` 项目，右键点击 `Class1.cs` 文件，然后点击`重命名`。将文件名更改为 `CheckoutController.cs`\
  \ 并按回车。在系统提示时，允许 Visual Studio 将所有对 `Class1` 的引用重命名为 `CheckoutController`。\n\n4.\
  \ 右键点击 `CheckoutService` 项目中的 `References` 节点，然后点击`添加引用`。\n\n5. 在“引用管理器 – CheckoutService”对话框中，在左侧面板中，点击`解决方案`。在中间面板中，选择\
  \ `DataTypes` 项目，然后点击`确定`。\n\n`CheckoutController` 类将使用在 `DataTypes` 项目中定义的 `Order`\
  \ 类。\n\n6. 在显示 `CheckoutController.cs` 文件的代码和文本编辑器中，在文件顶列表中添加以下 `using` 指令：\n\n\
  ```csharp\nusing DataTypes;\n```\n\n7. 在 `CheckoutController` 类中添加一个名为 `CheckoutDelegate`\
