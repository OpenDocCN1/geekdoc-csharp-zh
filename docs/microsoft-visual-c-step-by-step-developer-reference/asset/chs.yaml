  实体数据模型向导启动。可以使用此向导从现有数据库生成实体模型。\n\n16. 在向导的选择模型内容（Choose Model Contents）页面上，点击`从数据库创建\
  \ EF 设计器（EF Designer From Database）”，然后点击下一步（Next）。\n\n17. 在选择数据连接（Choose Your Data\
