  \ 方法。\n\n\n\n\n\n此方法从牌组中随机抽取一张牌，将其从牌组中移除并返回该牌。选择牌的逻辑不需要任何更改，但方法末尾从数组中检索牌的语句必须更新为使用\
  \ `Dictionary` 集合。此外，从数组中移除牌（现在它已被分发）的代码也必须对其进行修改；你需要在列表中查找该牌然后将其从列表中删除。要定位该牌，请使用\
  \ `Find` 方法并指定一个用于找到匹配值牌的谓词表达式。谓词表达式的参数应该是一个 `PlayingCard` 对象（列表包含 `PlayingCard`\
  \ 项目）。\n\n更新后的语句位于第二个 `while` 循环的右括号之后，如下代码中的**粗体**所示：\n\n点击此处查看代码图像\n\n```csharp\n\
  public PlayingCard DealCardFromPack()\n{\n    Suit suit = (Suit)randomCardSelector.Next(NumSuits);\n\
  \n    while (this.IsSuitEmpty(suit))\n    {\n        suit = (Suit)randomCardSelector.Next(NumSuits);\n\
