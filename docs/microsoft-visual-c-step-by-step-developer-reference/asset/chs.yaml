  \ Visual Studio 2015。\n* * *\n### 命名空间和程序集\n`using` 指令仅是将命名空间中的项引入作用范围，使你无需在代码中完全限定类的名称。类被编译为**程序集（assemblies）**。\n\
  一个程序集通常是一个具有 `.dll` 文件扩展名的文件，尽管严格来说，具有 `.exe` 文件扩展名的可执行程序也是程序集。\n一个程序集可以包含许多类。.NET\
  \ Framework 类库包含的类（如 `System.Console`）是在与 Visual Studio 一起安装在计算机上的程序集中提供的。你会发现 .NET\
  \ Framework 类库包含了数千万个类。如果它们都存在同一个程序集中，该程序集将变得巨大且难以维护。（如果 Microsoft 仅更新单个类中的单个方法，它将不得不向所有开发者分发整个类库！）\n\
  出于此原因，.NET Framework 类库被分成若干程序集，并根据包含的类所相关的功能区域进行划分。例如，一个“核心”程序集（实际上称为 `mscorlib.dll`）包含所有常用类，如\
  \ `System.Console`，其他程序集包含用于操作数据库、访问 Web 服务、构建 GUI 等的类。如果你想使用程序集中的类，必须向你的项目添加该程序集的引用。然后你可以在代码中添加\
  \ `using` 指令将命名空间引入作用范围。\n你应该注意，程序集和命名空间之间并不一定是一一对应的等关系：一个程序集可以包含多个命名空间的类，而一个命名空间可以跨越多个程序集。例如，`System`\
  \ 命名空间中的类和项实际上由多个程序集实现，包括 `mscorlib.dll`、`System.dll` 和 `System.Core.dll` 等。起听起来很复杂，但你很快就会习惯。\n\
  当你使用 Visual Studio 创建应用程序时，选择的模板会自动包含所需程序集的引用。例如，在 TestHello 项目的解决方案管理器中，展开引用（References）文件夹。你会发现控制台应用程序包含了对\
  \ `Microsoft.CSharp`、`System`、`System.Core`、`System.Data`、`System.Data.DataSetExtensions`、`System.Net.Http`、`System.Xml`\
  \ 和 `System.Xml.Linq` 程序集的引用。你可能会惊讶列表中没有 `mscorlib.dll`。这是因为所有 .NET Framework 应用程序都必须使用该程序集。引用文件夹仅列出了可选的程序集；你可以根据需要添加或删除程序集。\n\
  要为项目添加其他程序集的引用，右键点击引用文件夹并点击“添加引用”—你将在后面的练习中执行此任务。你可以通过右键点击引用文件夹中的程序集并点击“删除”。\n*\
