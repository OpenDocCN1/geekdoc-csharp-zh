  \ Visual Studio。\n\n#### 复制结构体\n\n你允许初始化或将一个结构体变量赋值给另一个，但前提是右侧的结构体已完全初始化（即其所有字段都填充了有效数据而非未定义的值）。下面的示例可以通过，因为\
  \ `now` 已完全初始化。插图显示了此类赋值的结果。\n\n点击此处查看代码图像\n\n```csharp\nDate now = new Date(2012,\
  \ Month.March, 19);\nDate copy = now;\n```\n\n![Image](img/Image00089.jpg)\n\n下面的示例失败是因为\
  \ `now` 未初始化：\n\n点击此处查看代码图像\n\n```csharp\nDate now;\nDate copy = now; // 编译错误：now\
  \ 未赋值\n```\n\n当你复制结构体变量时，左侧的每个字段直接从右侧相应的字段设置。这种复制是作为一个快速的单操作完成的，复制了整个结构体的内容，并且永远不会抛出异常。将此行为与如果\
  \ `Time` 是类时的相应操作进行比较，在这种情况下两个变量（`now` 和 `copy`）将指向堆上的*同一个*对象。\n\n* * *\n\n![Image](img/Image00005.jpg)\
