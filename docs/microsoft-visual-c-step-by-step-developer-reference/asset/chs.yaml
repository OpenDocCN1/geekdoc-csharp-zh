  \ Visual Studio 2015。\n\n### LINQ 与延迟计算\n\n当你使用 LINQ 定义一个可枚举集合时（无论是使用 LINQ 扩展方法还是使用查询操作符），都应该记住：应用程序在执行\
  \ LINQ 扩展方法时并不会实际构建集合；只有在你遍历集合时才会进行计算。这意味着在执行 LINQ 查询与检索数据之间，原始集合的数据可能会发生变化。例如，之前看到的以下查询定义了一个美国公司的枚举集合：\n\
  \n点击此处查看代码图像\n\n```cs\nvar usCompanies = from a in addresses\nwhere String.Equals(a.Country,\
  \ \"United States\")\nselect a;\n```\n\n`addresses` 数组中指定的 `Where` 条件直到你遍历 `usCompanies`\
  \ 集合时才会计算：\n\n点击此处查看代码图像\n\n```cs\nforeach (string name in usCompanies)\n{\nConsole.WriteLine(name);\n\
  }\n```\n\n如果在定义 `usCompanies` 集合与遍历之间修改了 `addresses` 数组（例如添加了新的美国公司），你将看到这些新数据。这种策略被称为**延迟计算**。\n\
  \n你可以在定义查询时强制计算并生成静态的缓存集合。该集合是原始数据的副本，当集合发生变化时不会改变。LINQ 提供了 `ToList` 方法来构建包含缓存数据的静态\
  \ `List` 对象。你可以这样使用：\n\n点击此处查看代码图像\n\n```cs\nvar usCompanies = from a in addresses.ToList()\n\
  where String.Equals(a.Country, \"United States\")\nselect a.CompanyName;\n```\n\n\
  这一次，公司列表在你创建查询时就已经固定了。如果你向 `addresses` 数组添加更多美国公司，当你遍历 `usCompanies` 集合时将看不到它们。LINQ\
  \ 还提供了 `ToArray` 方法将缓存集合存储为数组。\n\n在本章的最后一个练习中，你将比较使用 LINQ 查询延迟计算与生成缓存集合的影响。\n\n\
