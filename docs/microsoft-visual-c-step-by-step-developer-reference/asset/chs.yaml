  \ 找到 `dateCompare` 方法，它看起来应该是这样的：\n\n点击此处查看代码图像\n\n```csharp\nprivate int dateCompare(DateTime\
  \ leftHandSide, DateTime rightHandSide)\n{\n    // TO DO\n    return 0;\n}\n```\n\
  \n该方法无论参数如何都返回相同的值，而不是 0、-1 或 1。这解释了为什么应用程序无法工作。你需要实现比较日期的逻辑。\n\n**9.** 删除 `dateCompare`\
  \ 方法中的 `// TO DO` 注释和 `return` 语句。\n\n**10.** 在 `dateCompare` 方法体中添加以下语句：\n\n```csharp\n\
  private int dateCompare(DateTime leftHandSide, DateTime rightHandSide)\n{\n    int\
  \ result = 0;\n    if (leftHandSide.Year < rightHandSide.Year)\n    {\n        result\
  \ = -1;\n    }\n    else if (leftHandSide.Year > rightHandSide.Year)\n    {\n  \
  \      result = 1;\n    }\n}\n```\n\n如果表达式 `leftHandSide.Year < rightHandSide.Year`\
  \ 为 `true`，则 `leftHandSide` 的日期早于 `rightHandSide` 的日期，因此程序将 `result` 变量设置为 `-1`。否则，如果表达式\
