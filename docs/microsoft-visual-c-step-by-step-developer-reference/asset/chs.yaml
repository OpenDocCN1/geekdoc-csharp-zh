  \ TextBlock` 应该显示消息“操作已取消”。\n\n![Image](img/Image00164.jpg)\n\n## 15. 返回到 Visual\
  \ Studio 并停止调试。\n\n### 定义返回返回值的异步方法\n\n到目前为止，你看到的所有示例都使用 `Task` 对象来执行一项不返回值的工作。然而，你也会使用任务来运行计算结果的方法。为了实现这一点，你使用泛型\
  \ `Task<TResult>` 类，其中类型参数 `TResult` 指定了结果的类型。\n\n你以与普通 `Task` 类似的方式创建并启动 `Task<TResult>`\
  \ 对象。主要的区别在于，你执行的代码应该返回一个值。例如，接下来的代码示例中，名为 `calculateValue` 的方法生成一个整数结果。要使用任务调用此方法，你需要创建并运行一个\
  \ `Task<int>` 对象。你通过查询 `Task<int>` 对象的 `Result` 属性来获取方法返回的值。如果任务尚未完成方法运行且结果尚用，`Result`\
  \ 属性将阻塞调用者。这意味着你不需要自己执行任何同步操作，并且知道当 `Result` 属性返回值时，任务已经完成了它的工作。\n\n点击此处查看代码图像\n\
  \n```cs\nTask<int> calculateValueTask = Task.Run(() => calculateValue(...));\n...\n\
  int calculatedData = calculateValueTask.Result; // 阻塞直到 calculateValueTask 完成\n\
  ...\nprivate int calculateValue(...)\n{\n    int someValue;\n    // 执行计算并填充 someValue\n\
  \    ...\n    return someValue;\n}\n```\n\n泛型 `Task<TResult>` 类型也是定义返回返回值的异步方法机制的基础。在之前的示例中，你看到通过返回一个\
  \ `Task` 来实现异步 `void` 方法。如果异步方法实际上生成了结果，它应该返回一个 `Task<TResult>`，如下例所示，该示例创建了 `calculateValue`\
  \ 方法的异步版本：\n\n点击此处查看代码图像\n\n```csharp\nprivate async Task<int> calculateValueAsync(...)\n\
  {\n    // 使用 Task 调用 calculateValue\n    Task<int> generateResultTask = Task.Run(()\
  \ => calculateValue(...));\n    await generateResultTask;\n    return generateResultTask.Result;\n\
  }\n```\n\n此方法看起来有点困惑，因为返回类型被指定为 `Task<int>`，但 `return` 语句实际上返回一个 `int`。记住，当你定义 `async`\
  \ 方法时，编译器会对你的代码进行某些重构，它本质上返回一个指向 `Task` 的引用，用于运行 `return generateResultTask.Result;`\
  \ 语句的延续。此延续返回的表达式类型是 `int`，因此方法的返回类型是 `Task<int>`。\n\n要调用返回返回值的异步方法，请使用 `await`\
  \ 运算符，如下：\n\n点击此处查看代码图像\n\n```csharp\nint result = await calculateValueAsync();\n\
  ```\n\n`await` 运算符从 `calculateValueAsync` 返回的 `Task` 中提取值，并在这种情况下赋值给变量。\n\n### 异步方法的坑（gotchas）\n\
  \n`async` 和 `await` 运算符已知会让程序员感到困惑。理解以下内容非常重要：\n\n![Image](img/Image0001.jpg) 将方法标记为\
  \ `async` 并不意味着它是异步运行的。这意味着该方法可以包含异步运行的语句。\n\n![Image](img/Image0001.jpg) `await`\
  \ 运算符表示应由单独的任务运行，调用代码将挂起直到方法完成。调用代码使用的线程被释放并可以重用。如果该线程是用户界面线程，这很重要，因为它允许用户界面保持响应。\n\
  \n![Image](img/Image0001.jpg) `await` 运算符不同于使用任务的 `Wait` 方法。`Wait` 方法总是阻塞当前线程，并在任务完成不允许重用。\n\
  \n![Image](img/Image0001.jpg) 默认情况下，`await` 运算符后恢复的代码会尝试获取调用异步方法时的原始线程。如果此线程忙碌，代码将被阻塞。你可以使用\
  \ `ConfigureAwait(false)` 方法来指定代码可以在任何线程上恢复，从而减少阻塞概率。这对于需要处理大量并发请求的 Web 应用程序和服务特别有用。\n\
  \n![Image](img/Image0001.jpg) 如果 `await` 运算符后运行的代码必须在原始线程上执行，则你不应该使用 `ConfigureAwait(false)`。在之前讨论的示例中，对每个等待的操作添加\
  \ `ConfigureAwait(false)` 将导致编译器生成的延续在单独线程上运行。这包括尝试设置 `message` 的 `Text` 属性的延续，再次导致“应用程序调用了针对不同线程调的接口”异常。\n\
  \n点击此处查看代码图像\n\n```csharp\nprivate async void slowMethod()\n{\n    await doFirstLongRunningOperation().ConfigureAwait(false);\n\
  \    await doSecondLongRunningOperation().ConfigureAwait(false);\n    await doThirdLongRunningOperation().ConfigureAwait(false);\n\
  \    message.Text = \"Processing Complete\";\n}\n```\n\n\n\n\n\n在此代码中，`generateResult`\
  \ 方法返回一个字符串值。然而，`myMethod` 方法在尝试访问 `data.Result` 属性之前，实际上并没有启动运行 `generateResult`\
  \ 方法的任务；`data` 是该任务的引用，如果由于任务尚未运行导致 `Result` 属性不可用，那么访问该属性将阻塞当前线程，直到 `generateResult`\
  \ 方法完成。此外，用于运行 `generateResult` 方法的任务在方法完成后会尝试恢复到调用该方法时所的线程（即用户界面线程），但该线程现在正处于阻塞状态。结果是，`myMethod`\
  \ 方法在 `generateResult` 方法完成之前无法结束，而 `generateResult` 方法在 `myMethod` 方法完成之前无法结束。\n\
  \n解决此问题的方法等待（await）运行 `generateResult` 方法的任务。你可以如下所示操作：\n\n点击此处查看代码图像\n\n```csharp\n\
  private async void myMethod()\n{\nvar data = generateResult();\n...\nmessage.Text\
  \ = $\"result: {await data}\";\n}\n```\n\n### 异步方法与 Windows Runtime APIs\n\nWindows\
  \ 8 及其更高版本的设计者希望确保应用程序尽可能具有响应性，因此他们在实现 WinRT 时做出了决定：任何可能执行时间超过 50 毫秒的操作都应该仅通过异步\
  \ API 提供。你可能已经在本书书中注意到一两个处这种方法的应用了。例如，为了向用户显示消息，你可以使用 `MessageDialog` 对象。然而，当你显示此消息时，必须使用\
  \ `ShowAsync` 方法，如下所示：\n\n点击此处查看代码图像\n\n```csharp\nusing Windows.UI.Popups;\n...\n\
  MessageDialog dlg = new MessageDialog(\"Message to user\");\nawait dlg.ShowAsync();\n\
  ```\n\n`MessageDialog` 对象显示消息并等待用户点击作为该对话框一部分出现的“关闭”按钮。任何形式的用户交互都可能花费不确定的时间（用户在点击“关闭”之前可能去吃午饭了），因此在对话框显示期间，不阻塞应用程序或防止其执行其他操作（如响应事件）通常是非常重要的。`MessageDialog`\
  \ 类没有提供 `ShowAsync` 方法的同步版本，但如果你需要同步显示对话框，可以只需调用 `dlg.ShowAsync()` 而不使用 `await`\
  \ 运算符。\n\n另一个异步处理的常见示例涉及 `FileOpenPicker` 类，你可以在第 5 章 中的“使用复合赋值和迭代语句 ”中看到它。`FileOpenPicker`\
  \ 类显示一个文件列表，用户可以从中选择文件。与 `MessageDialog` 类一样，用户可能会花费大量时间浏览和选择文件，因此此操作不应阻塞应用程序。以下示例显示了如何使用\
  \ `FileOpenPicker` 类显示用户“文档”文件夹中的文件，并在用户从此列表中选择单个文件时等待：\n\n点击此处查看代码图像\n\n```csharp\n\
  using Windows.Storage;\nusing Windows.Storage.Pickers;\n...\nFileOpenPicker fp =\
  \ new FileOpenPicker();\nfp.SuggestedStartLocation = PickerLocationId.DocumentsLibrary;\n\
  fp.ViewMode = PickerViewMode.List;\nfp.FileTypeFilter.Add(\"*\");\nStorageFile file\
  \ = await fp.PickSingleFileAsync();\n```\n\n关键语句是调用 `PickSingleFileAsync` 方法的行行。该方法负责显示文件列表并允许用户在文件系统中导航并选择文件。（`FileOpenPicker`\
  \ 类还提供了 `PickMultipleFilesAsync` 方法，用户可以通过该方法选择多个文件。）该方法返回的值是 `Task<StorageFile>`，`await`\
  \ 运算符从该结果中提取出 `StorageFile` 对象。`StorageFile` 类提供了磁盘上存储文件的抽象，通过使用此类类，你可以打开文件并对其进行读取或写入。\n\
  \n* *\n\n![图像](img/Image00005.jpg) 备注\n\n严格来说，`PickSingleFileAsync` 方法返回的是一个类型为\
  \ `IAsyncOperation<StorageFile>` 的对象。WinRT 使用它自己的异步操作抽象，并将 .NET Framework `Task`\
  \ 对象映射到该抽象上；`Task` 类实现了 `IAsyncOperation` 接口。如果你在 C# 中进行编程，你的代码不受此转换的影响，你可以直接使用\
  \ `Task` 对象，而不必担心它们是如何映射到 WinRT 异步操作的。\n\n* *\n\n文件输入/输出 (I/O) 是另一个潜在的慢速操作来源，`StorageFile`\
  \ 类实现了一系列异步方法，通过这些方法可以执行操作而不影响应用程序的响应性。例如，在第 5 章 中，用户使用 `FileOpenPicker` 对象选择文件后，代码随后以异步方式打开该文件进行读取：\n\
  \n点击此处查看代码图像\n\n```csharp\nStorageFile file = await fp.PickSingleFileAsync();\n\
  ...\nvar fileStream = await file.OpenAsync(FileAccessMode.Read);\n```\n\n最后一个直接适用于你在本章和上一章练习的示例涉及写入流。你可能注意到，尽管生成图表数据花费了几秒钟，但在图形出现之前可能会额外花费双倍的时间。这是由于数据写入位图的方式造成的。位图渲染存储在\
  \ `WriteableBitmap` 对象缓冲区中的，而 `AsStream` 扩展方法为该缓冲区提供了 `Stream` 接口。通过该流使用 `Write`\
  \ 方法将数据写入缓冲区，如下所示：\n\n点击此处查看代码图像\n\n```csharp\n...\nStream pixelStream = graphBitmap.PixelBuffer.AsStream();\n\
  pixelStream.Seek(0, SeekOrigin.Begin);\npixelStream.Write(data, 0, data.Length);\n\
  ...\n```\n\n除非你减少了 `pixelWidth` 和 `pixelHeight` 字段的值以便内存，否则写入缓冲区的数据量略大于 570 MB (15000\
  \ * 10000 * 4 字节)，因此此 `Write` 操作可能会花费几秒钟。为了提高响应时间，你可以通过 `WriteAsync` 方法异步执行此操作：\n\
  \n点击此处查看代码图像\n\n```csharp\nawait pixelStream.WriteAsync(data, 0, data.Length);\n\
  ```\n\n总之，在为 Windows 构建应用程序时，你应该尽可能地利用异步性。\n\n* *\n\n.NET Framework 早期版本的 `IAsyncResult`\
  \ 设计模式\n\n\n\n\n异步性长期以来被认为是使用 .NET Framework 构建响应式应用程序的关键要素，且这一概念远早于 .NET Framework\
  \ 4.0 版本引入 `Task` 类之前。微软引入了基于 `AsyncCallback` 委托类型的 `IAsyncResult` 设计模式来处理这些情况。该模式工作原理的确切细节在书中并不适合详尽介绍，但从程序员的角度来看，该模式的实现意味着\
  \ .NET Framework 类库中的许多类型以两种方式暴露了耗时操作：一种是包含单个方法的同步形式；另一种另一种是使用一对名为 `BeginOperationName`\
  \ 和 `EndOperationName` 的方法组成的异步形式，其中 `OperationName` 指定了正在执行的操作。例如，`System.IO` 命名空间下的\
  \ `MemoryStream` 类提供了 `Write` 方法以同步方式向内存流写入数据，但它也提供了 `BeginWrite` 和 `EndWrite` 方法来异步地执行相同的操作。`BeginWrite`\
  \ 方法启动在新线程上执行的写入操作。`BeginWrite` 方法要求程序员提供一个回调方法的引用，该方法会在写入操作完成后运行；该引用的形式为 `AsyncCallback`\
  \ 委托。在此方法中，程序员应该实现任何适当的清理工作，并调用 `EndWrite` 方法表示操作已完成。下面的代码示例了该模式的用法：\n\n点击此处查看代码图像\n\
  \n```\nByte[] buffer = ...; // 填充了要写入 MemoryStream 的数据\n\nMemoryStream ms = new\
  \ MemoryStream();\n\nAsyncCallback callback = new AsyncCallback(handleWriteCompleted);\n\
  \nms.BeginWrite(buffer, 0, buffer.Length, callback, ms);\n\n...\n\nprivate void\
  \ handleWriteCompleted(IAsyncResult ar)\n{\n\nMemoryStream ms = ar.AsyncState as\
  \ MemoryStream;\n\n... // 执行任何适当的清理\n\nms.EndWrite(ar);\n}\n```\n\n回调方法 `handleWriteCompleted`\
  \ 的参数是一个 `IAsyncResult` 对象，它包含了有关异步操作状态的信息以及任何其他状态信息。你可以通过此参数向回调传递用户定义的信息；传递给 `BeginOperationName`\
  \ 方法的最后一个参数会被封装在此参数中。在示例中，向回调传递了 `MemoryStream` 的引用。\n\n尽管这种序列可以工作，但它是一种混乱的范式，掩盖了你正在执行的操作。操作的代码被分成了两个方法，如果你必须维护这些代码，很容易丢失这些方法之间的逻辑联系。如果你正在使用\
  \ `Task` 对象，可以通过调用 `TaskFactory` 类的静态方法 `FromAsync` 来简化这种模型。该方法接收 `BeginOperationName`\
  \ 和 `EndOperationName` 方法，并将它们封装成通过使用 `Task` 执行的代码。不需要创建 `AsyncCallback` 委托，因为这是由\
  \ `FromAsync` 方法在后台生成的。因此，你可以像这样执行上一个示例所示的相同操作：\n\n点击此处查看代码图像\n\n```\nByte[] buffer\
  \ = ...;\n\nMemoryStream s = new MemoryStream();\n\nTask t = Task<int>.Factory.FromAsync(s.Beginwrite,\
  \ s.EndWrite, buffer, 0,\n\nbuffer.Length, null);\n\nt.Start();\n\nawait t;\n```\n\
  \n如果你需要访问由早期版本的 .NET Framework 开发的类型所暴露的异步功能，这种技术将非常有用。\n\n***\n\n### 使用 PLINQ 将声明式数据访问并行化\n\
  \n数据访问是另一个对响应时间很重要的领域，特别是当你正在构建必须搜索长数据结构的应用程序时。在前面的章节中，你已经看到 LINQ 从可枚举数据结构中检索数据是多么强大，但所展示的示例本质上是单线程的。PLINQ\
  \ 为 LINQ 提供了一组基于 `Task` 的扩展，可以帮助你提升性能并使某些查询操作并行化。\n\nPLINQ 的工作是将数据集划分为多个分区，然后使用任务并行地为每个分区检索符合查询指定标准的数据。当任务完成后，为每个分区检索的结果将组合成单一的可枚举结果集。对于涉及包含大量元素的数据集的场景，或者为匹配数据指定的标准涉及复杂且计算密集型操作的场景，PLINQ\
  \ 是理想的选择。\n\nPLINQ 的一个重要目标是尽可能保持其非侵入性。要将 LINQ 查询转换为 PLINQ 查询，你需要使用 `AsParallel`\
  \ 扩展方法。`AsParallel` 方法返回一个 `ParallelQuery` 对象，其工作方式与原始枚举对象类似，但它提供了许多 LINQ 操作符（如\
  \ `join` 和 `where`）的并行实现。这些 LINQ 操作符的实现是基于任务的，并使用各种算法尝试在尽可能的情况下并行运行你的 LINQ 查询部分。然而，正如并行计算世界中常一样，`AsParallel`\
  \ 方法并不是魔法。你无法保证代码会变快；这完全取决于你的 LINQ 查询的性质以及它们所执行的任务是否适合并行化。\n\n为了理解 PLINQ 如何工作以及在什么情况下很有用，查看一些示例会有帮助。接下来的章节中的练习演示了两个简单的场景。\n\
  \n#### 使用 PLINQ 在遍历集合时提高性能\n\n第一个场景非常简单。考虑一个 LINQ 查询，它遍历集合并根据处理器密集型计算从集合中检索元素。只要计算是独立的，这种形式的查询就可以从并行执行中获益。集合中的元素可以被分为若干分区；具体数量取决于计算机的当前负载和可用\
  \ CPU 的数量。每个分区的元素可以由单独的线程处理。当所有分区处理完成后，可以合并结果。任何通过索引访问元素的集合（如数组或实现 `IList<T>` 接口的集合）都可以以此方式进行管理。\n\
  \n对简单集合并行化 LINQ 查询\n\n1. 使用 Visual Studio 2015 打开 PLINQ 解决方案，它位于文档文件夹中的 Microsoft\
  \ Press\\VCSBS\\Chapter24\\PLINQ 文件夹下。\n\n2. 在解决方案资源管理器中，双击 PLINQ 项目中的 `Program.cs`\
  \ 将文件显示在代码和文本窗口。\n\n这是一个控制台应用程序。应用程序的骨架结构已经为你创建。`Program` 类包含名为 `Test1` 和 `Test2`\
  \ 的方法，它们说明了两个常见场景。`Main` 方法轮流调用这些测试方法。\n\n这两个测试方法具有相同的通用结构：它们创建一个 LINQ 查询（你将在本组练习稍后添加相应的代码）、运行它并显示所需的时间。每个方法的代码与实际创建和运行查询的语句几乎完全分离。\n\
  \n3. 检查 `Test1` 方法。\n\n该方法创建了一个大型整数数组，并填充了一组 0 到 200 之间的随机数。随机数生成器经过了初始化，因此每次运行应用程序时都应该得到相同的结果。\n\
  \n4. 紧接在该方法中的第一个 `TO DO` 注释之后，添加此处所示的粗体 LINQ 查询：\n\n```csharp\n// 创建一个 LINQ 查询来检索所有大于\
  \ 100 的数字\n\nvar over100 = from n in numbers\n\nwhere TestIfTrue(n > 100)\n\nselect\
  \ n;\n```\n\n\n\n\n此 LINQ 查询检索了 `numbers` 数组中所有值大于 100 的项。`n > 100` 测试本身的计算密集程度并不足以，足以展示并行化此查询的好处，因此代码调用了一个名为\
  \ `TestIfTrue` 的方法，该方法通过执行 `SpinWait` 操作稍微减慢运行速度。`SpinWait` 方法使处理器在短时间内持续执行一个特殊的“无操作”指令循环，使处理器保持忙碌状态但实际上没有执行任何工作（这被称为\
  \ `spinning`，自旋）。`TestIfTrue` 方法如下：\n\n点击此处查看代码图像\n\n```csharp\npublic static bool\
  \ TestIfTrue(bool expr)\n{\n    Thread.SpinWait(1000);\n    return expr;\n}\n```\n\
  \n5. 在 `Test1` 方法的第二个 `TO DO` 注释之后，添加以下加粗显示的代码：\n\n点击此处查看代码图像\n\n```csharp\n// TO\
  \ DO: Run the LINQ query, and save the results in a List<int> object\nList<int>\
  \ numbersOver100 = new List<int>(over100);\n```\n\n记住 LINQ 查询使用延迟执行，因此在您从它们检索结果之前，它们不会运行。此语句创建了一个\
  \ `List<int>` 对象并用运行 `over100` 查询的结果填充了它。\n\n6. 在 `Test1` 方法的第三个 `TO DO` 注释之后，添加以下加粗显示的语句：\n\
  \n点击此处查看代码图像\n\n```csharp\n// TO DO: Display the results\nConsole.WriteLine($\"\
  There are {numbersOver100.Count} numbers over 100\");\n```\n\n7. 在“调试”（Debug）菜单上，点击“无调试启动”（Start\
  \ Without Debugging）。注意运行 `Test 1` 所的时间以及数组中大于 100 的项数。\n\n8. 运行应用程序几次，并对时间取平均值。验证大于\
  \ 100 的项数每次都是相同的（应用程序在每次运行时都使用相同的随机数种子以确保测试的可重复性）。完成后返回 Visual Studio。\n\n9. 选择\
  \ LINQ 查询返回的每个项的逻辑与所有其他项的选择逻辑是独立的，因此此查询是分区（partitioning）的理想选择。修改定义 LINQ 查询的语句，并为\
  \ `numbers` 数组指定 `AsParallel` 扩展方法，如下加粗所示：\n\n点击此处查看代码图像\n\n```csharp\nvar over100\
  \ = from n in numbers.AsParallel()\nwhere TestIfTrue(n > 100)\nselect n;\n```\n\n\
  ![Image](img/Image00005.jpg) 注意\n\n如果选择逻辑或计算需要访问共享数据，则你必须同步并行运行的任务；否则，结果可能是不可预测的。然而，同步可能会带来开销，并可能抵消并行化查询的好处。\n\
  \n10. 在“调试”（Debug）菜单上，点击“无调试启动”。验证 `Test1` 报告的项数与之前相同，但执行测试所需的时间显著减少。运行测试几次，并对测试所需的持续时间取平均值。\n\
  \n如果你在双核处理器（或双处理器计算机）上运行，你应该能看到时间减少了 40% 到 45%。如果你有更多处理器内核，减少幅度应该更加剧烈（在我的四核机器上，处理时间从\
  \ 10.3 秒降到了 2.8 秒）。\n\n11. 关闭应用程序并返回 Visual Studio。\n\n前面的练习显示了你通过对 LINQ 查询进行微小更改可以获得的性能提措。然而，请记住，只有当查询执行的计算需要一些时间时，你才会看到这样的结果。我通过让处理器自旋稍微作弊。如果没有这个开销，查询的并行版本实际上比串行版本慢。在下一个练习中，你将看到一个在内存中连接两个数组的\
  \ LINQ 查询。这次，练习使用了更真实的数据量，因此不需要人为减慢查询。\n\n# 并行化连接两个集合的 LINQ 查询\n\n1. 在“解决方案管理器”（Solution\
  \ Explorer）中，在代码和文本编辑器窗口中打开 `Data.cs` 文件并定位到 `CustomersInMemory` 类。\n\n该类包含一个名为\
  \ `Customers` 的公共字符串数组。`Customers` 数组中的每个 `string` 存储单个客户的数据，字段之间用逗号分隔；这种格式对于应用程序可能从使用逗号分隔的文本文件中读取的数据是典型的。第一个字段包含客户\
  \ ID，第二个字段包含客户代表的公司名称，其余字段保存地址、城市、国家或地区以及邮政编码。\n\n2. 找到 `OrdersInMemory` 类。\n\n\
  该类与 `CustomersInMemory` 类类似，但包含一个名为 `Orders` 的字符串数组。每个字符串的第一个字段是订单号，第二个字段是客户 ID，第三个字段是下单的日期。\n\
  \n3. 找到 `OrderInfo` 类。该类包含四个字段：订单的客户 ID、公司名称、订单 ID 和订单日期。你将使用这些字段来处理订单。\n\n4. 在代码和文本编辑器窗口中显示\
  \ `Program.cs` 文件并找到 `Test2` 方法。\n\n在该方法中，你将使用 LINQ 查询连接 `Customers` 和 `Orders`\
  \ 数组。在 `try` 块中，在第一个 `TO DO` 注释之后，添加如下加粗代码：\n\np579pro01a)\n\n```csharp\nvar orderInfoQuery\
  \ = from c in CustomersInMemory.Customers\njoin o in OrdersInMemory.Orders\non c.Split(',')[0]\
  \ equals o.Split(',')[1]\nselect new OrderInfo\n{\n    CustomerID = c.Split(',')[0],\n\
  \    CompanyName = c.Split(',')[1],\n    OrderID = Convert.ToInt32(o.Split(',')[0]),\n\
  \    OrderDate = Convert.ToDateTime(o.Split(',')[2], new CultureInfo(\"en-US\"))\n\
  };\n```\n\n此语句定义了 LINQ 查询。注意它使用 `String` 类的 `Split` 方法将字符串拆分为数组。字符串根据逗号进行分割（逗号被去除了）。一个问题是数组中的日期是以美国英语格式存储的，因此将它们转换为\
  \ `DateTime` 对象的代码指定了美国英语格式。总而言之，此查询为每个项生成数据执行了大量工作。\n\n6. 在 `Test2` 方法中，在第二个 `TO\
  \ DO` 语句之后，添加以下加粗代码：\n\np579pro02a)\n\n```csharp\n// TO DO: Run the LINQ query,\
  \ and save the results in a List<int> object\nList<OrderInfo> orderInfo = new List<OrderInfo>(orderInfoQuery);\n\
  ```\n\n此语句运行查询并填充 `orderInfo` 集合。\n\n7. 在第三个 `TO DO` 语句之后，添加此处加粗的语句：\n\np579pro03a)\n\
  \n```csharp\n// TO DO: Display the results\nConsole.WriteLine($\"There are {orderInfo.Count}\
  \ orders\");\n```\n\n8. 在 `Main` 方法中，注释掉调用 `Test1` 方法的语句，并取消注释调用 `Test2` 方法的语句，如下加粗代码所示：\n\
  \np579pro04a)\n\n```csharp\nstatic void Main(string[] args)\n{\n    // Test1();\n\
  \    Test2();\n}\n```\n\n\n\n\n10. 验证 `Test2` 检索了 830 个订单，并记录测试持续时间。多次运行应用程序以获取平均持续时间，然后返回\
  \ Visual Studio。\n\n11. 在 `Test2` 方法中，修改 LINQ 查询并为 `Customers` 和 `Orders` 数组添加 `AsParallel`\
  \ 扩展方法，如此处**粗体**所示：\n\n点击此处查看代码图片\n\n```c\nvar orderInfoQuery = from c in CustomersInMemory.Customers.AsParallel()\n\
  join o in OrdersInMemory.Orders.AsParallel()\non c.Split(',')[0] equals o.Split(',')[1]\n\
  select new OrderInfo\n{\nCustomerID = c.Split(',')[0],\nCompanyName = c.Split(',')[1],\n\
  OrderID = Convert.ToInt32(o.Split(',')[0]),\nOrderDate = Convert.ToDateTime(o.Split(',')[2],\n\
  New CultureInfo(\"en-US\"))\n};\n```\n\n![Image](img/Image00165.jpg) 警告\n\n当你以这种方式连接两个数据源时，它们都必须是\
  \ `IEnumerable` 对象或 `ParallelQuery` 对象。这意味着如果你为一个源指定了 `AsParallel` 方法，也也应该为另一个源指定\
  \ `AsParallel`。如果你没有这样做，你的代码将无法运行——它会报错停止。\n\n12. 多次运行应用程序。注意 `Test2` 所花费的时间应该显著少于之前。PLINQ\
  \ 可以利用多个线程，通过并行获取连接的每个部分的数据来优化连接操作。\n\n13. 关闭应用程序并返回 Visual Studio。\n\n这两个简单的练习已经向你展示了\
  \ `AsParallel` 扩展方法和 PLINQ 的威力。请注意，PLINQ 是一项不断演进的技术，其内部实现可能会随着时间的推移而发生。此外，你在查询中执行的数据量和处理量也会影响使用\
  \ PLINQ 的有效性。因此，你不应该将这些练习视为你应该始终遵循的固定规则。相反，它们说明了这一点：你应该根据自己的数据、在自己的运行环境中，仔细地测量并评估使用\
  \ PLINQ 可能带来的性能或其他益处。\n\n### 取消 PLINQ 查询\n\n与普通的 LINQ 查询不同，你可以取消 PLINQ 查询。要做到这一点，你需要从\
  \ `CancellationTokenSource` 指定一个 `CancellationToken` 对象，并使用 `ParallelQuery` 的 `WithCancellation`\
  \ 扩展方法。\n\n点击此处查看代码图片\n\n```c\nCancellationToken tok = ...;\n...\nvar orderInfoQuery\
  \ =\nfrom c in CustomersInMemory.Customers.AsParallel().WithCancellation(tok)\n\
  join o in OrdersInMemory.Orders.AsParallel()\non ...\n```\n\n你在查询中只需指定一次 `WithCancellation`。取消适用于查询中的所有源。如果用于生成\
  \ `CancellationToken` 的 `CancellationTokenSource` 对象被取消，查询将带有 `OperationCanceledException`\
  \ 异常停止。\n\n### 同步并发访问数据\n\nPLINQ 并不总是应用程序最合适的技术。如果你手动创建任务，需要确保这些任务能够正确协调它们的活动。.NET\
  \ Framework 类库提供了可以等待任务完成的方法，你可以使用这些方法在非常粗粒度的级别上协调任务。但请考虑如果两个任务尝试访问并修改相同的数据会发生什么。如果两个任务同时运行，它们的重叠操作可能会损坏数据。这种情况会导致难以修复的错误，主要是因为它们的不可预测性。\n\
  \n`Task` 类提供了一个强大的框架，通过你可以设计并构建利用多个 CPU 内并行执行任务的应用程序。然而，在构建执行并发操作的解决方案时，你需要小心，特别是当这些操作共享数据访问时。你对并行操作如何调度，甚至对操作系统可能为使用任务构建的应用程序提供的并行程度，几乎没有控制权。这些决策被留给运行时考虑，并取决于运行你应用程序的计算机的工作负载和硬件能力。这种级别的抽象是微软开发团队的一项有意的设计决策，它让你在构建需要并发任务的应用程序时，不需要理解底层的线程和调度细节。但这种抽象是有代价的。尽管一切看起来都像魔法一样有效，但你必须花努力理解你的代码是如何运行的；否则，你可能会得到表现出不可预测（且错误）行为的应用程序，如下例所示（此示例可在第\
  \ 24 章代码文件夹中的 ParallelTest 项目可用）：\n\n点击此处查看代码图片\n\n```sharp\nusing System;\nusing\
  \ System.Threading;\n\nclass Program\n{\n    private const int NUMELEMENTS = 10;\n\
  \n    static void Main(string[] args)\n    {\n        SerialTest();\n    }\n\n \
  \   static void SerialTest()\n    {\n        int[] data = new int[NUMELEMENTS];\n\
  \        int j = 0;\n        for (int i = 0; i < NUMELEMENTS; i++)\n        {\n\
  \            j = i;\n            doAdditionalProcessing();\n            data[i]\
  \ = j;\n            doMoreAdditionalProcessing();\n        }\n        for (int i\
  \ = 0; i < NUMELEMENTS; i++)\n        {\n            Console.WriteLine($\"Element\
  \ {i} has value {data[i]}\");\n        }\n    }\n\n    static void doAdditionalProcessing()\n\
  \    {\n        Thread.Sleep(10);\n    }\n\n    static void doMoreAdditionalProcessing()\n\
  \    {\n        Thread.Sleep(10);\n    }\n}\n```\n\n`SerialTest` 方法通过一种长时间的方式填充整数数组，然后遍历该数组，打印数组中的索引及其对应的值。`doAdditionalProcessing`\
  \ 和 `doMoreAdditionalProcessing` 方法模拟了耗时操作，这会导致运行时让出控制权。该程序的输出如下所示所示：\n\nElement\
  \ 0 has value 0\nElement 1 has value 1\nElement 2 has value 2\nElement 3 has value\
  \ 3\nElement 4 has value 4\nElement 5 has value 5\nElement 6 has value 6\nElement\
  \ 7 has value 7\nElement 8 has value 8\nElement 9 has value 9\n\n现在考虑下面的 `ParallelTest`\
  \ 方法。它与 `SerialTest` 方法相同，只是使用并发任务来填充 `data` 数组。每个任务执行的 表达式中的代码与 `SerialTest` 方法中的初始\
  \ `for` 循环相同。\n\n点击此处查看代码图片\n\n```csharp\nusing System.Threading.Tasks;\n...\nstatic\
  \ void ParallelTest()\n{\n    int[] data = new int[NUMELEMENTS];\n    int j = 0;\n\
  \    Parallel.For(0, NUMELEMENTS, (i) =>\n    {\n        j = i;\n        doAdditionalProcessing();\n\
  \        data[i] = j;\n        doMoreAdditionalProcessing();\n    });\n    for (int\
  \ i = 0; i < NUMELEMENTS; i++)\n    {\n        Console.WriteLine($\"Element {i}\
  \ has value {data[i]}\");\n    }\n}\n```\n\n意图是让 `ParallelTest` 方法执行与 `SerialTest`\
  \ 方法相同的操作，只是通过使用并发任务并（如果运气好的话）运行得快一点。问题是它可能并不总是按照预期方式工作。`ParallelTest` 方法生成的某些示例输出如下：\n\
  \nElement 0 has value 1\nElement 1 has value 1\nElement 2 has value 4\nElement 3\
  \ has value 8\nElement 4 has value 4\nElement 5 has value 1\nElement 6 has value\
  \ 4\nElement 7 has value 8\nElement 8 has value 8\nElement 9 has value 9\n\n分配给\
  \ `data` 数组中每个项的值并不与使用 `SerialTest` 方法生成的值相同。此外，进一步运行 `ParallelTest` 方法可能会产生不同的结果。\n\
  \n如果你检查 `Parallel.For` 构造中的逻辑，你应该能看到问题所在。Lambda 表达式包含了以下语句：\n\n```c\nj = i;\ndoAdditionalProcessing();\n\
  data[i] = j;\ndoMoreAdditionalProcessing();\n```\n\n\n\n\n```\ndoMoreAdditionalProcessing();\n\
  ```\n\n这段代码看起来足够无害。它将变量 `i` 的当前值（标识循环正在运行哪一次迭代的索引变量）复制到变量 `j`，随后将 `j` 的值存储在数据数组由\
  \ `i` 索引的元素中。如果 `i` 为 5，则 `j` 被赋值为 5，随后 `j` 的值被存储在 `data[5]` 中。但在给 `j` 赋值和读取之间，代码执行了更多工作；它调用了\
  \ `doAdditionalProcessing` 方法。如果此方法的执行时间较，运行时可能会挂起线程并调度另一个任务。运行 `Parallel.For` 另一个迭代的并发任务可能会运行并给\
  \ `j` 分配新值。因此，当原始任务恢复时，它分配给 `data[5]` 的 `j` 值并不是它之前存储的值，导致数据损坏。更棘手的是，有时这段代码可能会按预期运行并产生正确的结果，而其他时候可能不会；这完全取决于计算机的繁忙程度以及各种任务的调度时间。因此，这类错误在测试期间可能处于潜伏状态，然后突然在生产环境中显现。\n\
  \n变量 `j` 被所有并发任务共享。如果一个任务在 `j` 中存储了一个值并在后读取它，它必须确保在此期间没有其他任务修改 `j`。这需要对所有可以访问该变量的并发任务进行同步访问。实现同步访问的一种方法是锁定数据。\n\
  \n### 锁定数据\n\nC# 语言通过 `lock` 关键字提供了锁定语义，你可以使用它来保证对资源的独占访问。你可以像下面这样使用 `lock` 关键字：\n\
  \n点击此处查看代码图像\n\n```csharp\nobject myLockObject = new object();\n\n...\n\nlock (myLockObject)\n\
  {\n    // 需要对共享资源进行独占访问的代码\n    ...\n}\n```\n\n`lock` 语句尝试获取指定对象上的互斥锁（你实际上可以使用任何引用类型，而不仅仅是\
  \ `object`），如果该对象当前被另一个线程锁定，它将会被阻塞。当线程获取锁时，`lock` 语句后的块中的代码将运行。在该代码块结束时，锁会被释放。如果另一个线程阻塞等待锁，它就可以获取锁并继续其处理。\n\
  \n### 用于协调任务的同步原语\n\n`lock` 关键字对于许多简单场景都是很好的，但在某些情况下，你可能会有更复杂的需求。`System.Threading`\
  \ 命名空间包含了许多额外的同步原语，你可以用它们来处理这些情况。这些同步原语是为任务设计的类；它们暴露了锁定机制，用于在任务持有锁时限制对资源的访问。它们支持多种锁定技术，你可以利用这些技术来实现不同风格的并发访问，从简单的独占锁（单个任务对资源拥有唯一访问权限）到信号量（多个任务可以同时访问资源，但是受控的），再到读取者/写者锁（它允许不同任务共享对资源的只读访问，同时保证对需要修改资源的线程具有独占访问权限）。\n\
  \n以下列表总结了其中一些原语。如需了解更多信息和示例，请参阅 Visual Studio 2015 提供的文档。\n\n***\n\n![Image](img/Image00005.jpg)\
  \ 注意\n\n.NET Framework 自其初始发布以来就包含了一套相当丰富的同步原语。以下列表仅描述了包含在 `System.Threading` 命名空间中较新的原语。新原语与之前提供的原语之间存在重叠。在功能重叠的情况下，你应该使用较新的替代方案，因为它们是针对具有多个\
  \ CPU 的计算机进行了设计和优化的。\n\n***\n\n关于用于构建多线程应用程序的所有可能的同步机制理论的详细讨论超出了本书的范围。有关多线程和同步的通用理论的更多信息，请参阅\
  \ Visual Studio 2015 提供的文档中的“多线程数据同步”（Synchronizing Data for Multithreading）主题。\n\
  \n![Image](img/Image00001.jpg) **ManualResetEventSlim** `ManualResetEventSlim` 类提供了让一个或多个任务等待事件的功能。\n\
  \n`ManualResetEventSlim` 对象可以处于两种状态之一：`signaled`（已信号，true）和 `unsignaled`（未信号，false）。一个任务创建一个\
  \ `ManualResetEventSlim` 对象并指定其初始状态。其他任务可以通过调用 `Wait` 方法等待 `ManualResetEventSlim`\
  \ 对象被信号。如果 `ManualResetEventSlim` 对象处于 `unsignaled` 状态，`Wait` 方法将阻塞任务。另一个任务可以通过调用\
  \ `Set` 方法将 `ManualResetEventSlim` 对象的状态更改为 `signaled`。此操作会释放所有等待 `ManualResetEventSlim`\
  \ 对象的任务，它们可以恢复运行。`Reset` 方法将 `ManualResetEventSlim` 对象的状态改回 `unsignaled`。\n\n![Image](img/Image00001.jpg)\
  \ **SemaphoreSlim** 你可以使用 `SemaphoreSlim` 类来控制对资源池的访问。\n\n`SemaphoreSlim` 对象有一个初始值（非负整数）和一个可选的最大值。通常，`SemaphoreSlim`\
  \ 对象的初始值是池中资源的数量。访问池中资源的任务首先调用 `Wait` 方法。该方法尝试减少 `SemaphoreSlim` 对象的值，如果结果不为零，则允许线程继续并从池中获取资源。当任务完成后，任务应该调用\
  \ `SemaphoreSlim` 对象的 `Release` 方法。此操作会增加 `SemaphoreSlim` 的值。\n\n如果任务调用 `Wait` 方法，且减少\
  \ `SemaphoreSlim` 对象值的结果会导致负值，则任务将等待另一个任务调用 `Release`。\n\n`SemaphoreSlim` 类还提供了\
  \ `CurrentCount` 属性，你可以用它来判断 `Wait` 操作可能成功还是会导致阻塞。\n\n![Image](img/Image00001.jpg)\
  \ **CountdownEvent** 你可以认为 `CountdownEvent` 类是信号量的反向与手动重置事件的交叉体。\n\n当任务创建一个 `CountdownEvent`\
  \ 对象时，它指定一个初始值（非负整数）。一个或多个任务可以调用 `CountdownEvent` 对象的 `Wait` 方法，如果其值不为零，任务将被阻塞。`Wait`\
  \ 不减少 `CountdownEvent` 对象的值；相反，其他任务可以调用 `Signal` 方法来减少该值。当 `CountdownEvent` 对象的值达到零时，所有阻塞的任务都会被信号并可以恢复运行。\n\
  \n任务可以使用 `Reset` 方法将 `CountdownEvent` 对象的值设置回构造函数中指定的值，并且任务可以通过调用 `AddCount` 方法增加此值。你可以通过检查\
  \ `CurrentCount` 属性来确定调用 `Wait` 是否可能被阻塞。\n\n![Image](img/Image00001.jpg) **ReaderWriterLockSlim**\
  \ `ReaderWriterLockSlim` 类是一种支持单写者和多读者的进级同步原语。其核心思想是修改（写入）资源需要独占访问，但读取资源不需要；多个读取者可以同时访问同一资源，但不能与写者同时访问。\n\
  \n\n\n\n\n想要读取资源的任务会调用 `ReaderWriterSlim` 对象的 `EnterReadLock` 方法。此操作会获取该对象上的一个读锁。当任务完成对资源的操作后，它会调用\
  \ `ExitReadLock` 方法释放锁。此时，多个任务可以同时读取同一个资源，每个任务都获取它自己的读锁。\n\n当任务修改资源时，它可以调用同一个 `ReaderWriterSlim`\
  \ 对象的 `EnterWriteLock` 方法来获取写锁。如果当前有一个或多个任务持有该对象的读锁，`EnterWriteLock` 方法将被阻塞，直到这些锁都被释放。任务获取锁后，它就可以修改资源并调用\
  \ `ExitWriteLock` 方法释放锁。\n\n为了确保写入任务不会被无限阻塞，一旦任务请求了锁，其他任务执行的所有后续 `EnterReadLock`\
  \ 调用都将被阻塞，直到锁被获取并释放。\n\n![Image](img/Image0001.jpg) 使用 `Barrier` 类，你可以在特定点临时停止一组任务的执行，并仅在所有任务都到达该点时继续执行。这对于需要彼此之间执行一系列并发操作的任务的同步非常有用。\n\
  \n当任务创建一个 `Barrier` 对象时，它指定了集合中将同步的任务数量。你可以将此值认为在 `Barrier` 类内部维护的计数器。该值以后可以通过调用\
  \ `AddParticipant` 或 `RemoveParticipant` 方法进行修改。当任务到达同步点时，它会调用 `Barrier` 对象的 `SignalAndWait`\
  \ 方法，该方法会将计数器减 1。如果计数器大于零，任务将被阻塞。只有当计数器达到零时，所有等待 `Barrier` 对象的任务才会被释放，它们才能继续运行。\n\
  \n`Barrier` 类提供了 `ParticipantCount` 属性，指定了它所同步的任务数量。你还可以在 `Barrier` 构造函数中指定一个委托。该委托可以引用一个在所有任务都到达屏障时运行的方法。`Barrier`\
  \ 对象将作为参数传递给该方法。在方法完成之前，屏障不会触发，任务也不会被释放。\n\n### 取消同步\n\n`ManualResetEventSlim`、`SemaphoreSlim`、`CountdownEvent`\
  \ 和 `Barrier` 类都支持遵循第 23 章 中描述的取消模型。这些类中的每个等待操作都可以接受一个可选的 `CancellationToken` 参数，该参数是从\
  \ `CancellationTokenSource` 对象获取的。如果你调用 `CancellationTokenSource` 对象的 `Cancel` 方法，每个引用从此源生成的\
  \ `CancellationToken` 的等待操作都将带有 `OperationCanceledException` 异常终止（可能封装在 `AggregateException`\
  \ 异常中，取决于等待操作的上下文）。\n\n下面的代码展示了如何调用 `SemaphoreSlim` 对象的 `Wait` 方法并指定取消令牌。如果等待操作取消，将运行\
  \ `OperationCanceledException` 捕获处理器。\n\n点击此处查看代码图片\n\n```\nCancellationToken cancellation\
  \ cancellationSource = new CancellationTokenSource();\nCancellationToken cancellationToken\
  \ = cancellationTokenSource.Token;\n\n...\n\n// 保护包含 3 个资源池的信号量\nSemaphoreSlim semaphoreSlim\
  \ = new SemaphoreSlim(3);\n...\n\n// 等待信号量，如果另一个线程对 cancellationTokenSource 调用了\
  \ Cancel\n// 则捕获 OperationCanceledException\ntry\n{\n    semaphoreSlim.Wait(cancellationToken);\n\
  }\ncatch (OperationCanceledException e)\n{\n    ...\n}\n```\n\n### 并发集合类\n\n许多多线程应用程序的一个共同需求是在集合中存储和检索数据。.NET\
  \ Framework 提供的标准集合类默认不是线程安全的，尽管你可以使用上一节中描述的同步原语来封装在集合中添加、查询和删除元素的代码。然而，这个过程可能会产生错误且可扩展性不佳，因此\
  \ .NET Framework 类库在 `System.Collections.Concurrent` 命名空间中包含了一小部分线程安全的集合类和接口，它们专门为为任务而设计。以下列表简要概述了该命名空间中的关键类型：\n\
  \n![Image](img/Image0001.jpg) `Bag<T>` 是用于持有无序项目集合的通用类。它包含了 `Add`、`TryTake` 和 `Count`\
  \ 等方法。该类也是枚举的，因此你可以遍历其内容。\n\n![Image](img/Image0001.jpg) `Dictionary<TKey, TValue>`\
  \ 是泛型 `Dictionary<TKey, TValue>` 类的线程安全实现。它提供了 `TryAdd`、`ContainsKey`、`TryGetValue`、`TryRemove`\
  \ 和 `TryUpdate` 方法。该集合也是枚举的，因此你可以使用 `foreach` 语句。\n\n![Image](img/Image0001.jpg)\
  \ `Queue<T>` 是泛型 `Queue<T>` 类的线程安全版本。它包含了 `Enqueue`、`TryDequeue` 和 `TryPeek` 来添加、移除和查询项目。\n\
  \n![Image](img/Image0001.jpg) `Stack<T>` 是泛型 `Stack<T>` 类的线程安全实现。它提供了 `Push`、`TryPop`\
  \ 和 `TryPeek` 来推送、弹出和查询项目。\n\n**注意**：为集合类的方法添加线程安全性会带来额外的运行时开销，因此这些类没有普通的集合类快。在决定是否并行化一组需要访问共享集合的操作时，你需要记住这一点。\n\
  \n### 使用并发集合和锁实现线程安全访问\n\n在接下来的练习中，你将实现一个通过几何近似计算 pi 的应用程序。最初，你将以单线程方式执行计算，然后你将修改代码使用并行任务执行计算。在此过程中，你将发现一些需要解决的数据同步问题，并将通过使用并发集合类和锁来解决这些问题。\n\
  \n你将实现的算法基于简单的数学和统计采样计算 pi。如果你画一个半径为 *r* 的圆，并画一个与圆相切的正方形，正方形的边长为 *2 * r*，如下所示：\n\
  \n![Image](img/Image0016.jpg)\n\n你可以像这样计算正方形的面积 *S*：\n\n`S = (2 * r) * (2 * r)`\n\
  \n或者\n\n`S = 4 * r * r`\n\n圆的面积 *C* 的计算方式如下：\n\n`C = pi * r * r`\n\n通过排列这些公式，你可以看到：\n\
  \n`r * r = C / pi`\n\n以及\n\n`r * r = S / 4`\n\n结合这些方程，得到：\n\n`pi = 4 * C / S`\n\n\
  \n\n\n此技巧的关键在于确定圆 `C` 的面积相对于正方形 `S` 面积的比例值。这就是统计采样用用场。你可以生成一组位于正方形内的随机点，并统计这些点中有多少个落在圆内。如果你生成了足够大且随机的样本，落在圆内的点与落在正方形内（且在圆内）的点数比例，就接近于这两个形状面积的比例\
  \ `C / S`。你所做的就是统计它们。\n\n如何确定一个点是否在圆内？为了帮助可视化解决方案，请在网格纸上画一个正方形，并将正方形的中心位于原点 (0,0)。然后，你可以生成位于\
  \ `(r, r)` 到 `(+r, +r)` 范围内的值对（即坐标）。你可以通过应用勾股定理来确定这些坐标 `(x, y)` 原点的距离 `d`，从而判断任何一组坐标是否位于圆内。你可以将\
  \ `d` 计算为 `((x * x) + (y * y))` 的平方根。如果 `d` 小于或等于圆半径 `r`，则坐标 `(x, y)` 指定了圆内的一个点，如下图所示：\n\
  \n![Image](img/Image00167.jpg)\n\n你可以通过生成仅位于图表右上象限的坐标来进一步简化问题，这样你只需要生成 0 到 `r` 之间的随机数对。这就是你将在练习中采用的方法。\n\
  \n***\n\n![Image](img/Image00005.jpg) 注意事项\n\n本章的练习旨在设计在具有多核处理器的计算机上运行。如果你只有一个单核\
  \ CPU，将无法观察到相同的效果。此外，你不应该在练习之间启动任何额外的程序或服务，因为这些可能会影响你看到的结果。\n\n***\n\n# 使用单线程计算\
  \ pi\n\n**1.** 如果 Visual Studio 2015 尚未运行，请启动它。\n\n**2.** 打开 `CalculatePI` 解决方案，它位于你文档文件夹中的\
  \ `\\Microsoft Press\\VCSBS\\Chapter 24\\CalculatePI` 文件夹中。\n\n**3.** 在解决方案管理器（Solution\
  \ Explorer）中，找到 `CalculatePI` 项目，双击 `Program.cs` 在代码和文本编辑器窗口中显示该文件。\n\n这是一个控制台应用程序。应用程序的骨架结构已经为你创建好了。\n\
  \n**4.** 滚动到文件底部并检查 `Main` 方法。它看起来如下：\n\n点击此处查看代码图像\n\n```cs\nstatic void Main(string[]\
  \ args)\n{\n    double pi = SerialPI();\n    Console.WriteLine($\"Geometric approximation\
  \ of PI calculated serially: {pi}\");\n    Console.WriteLine();\n    // pi = ParallelPI();\n\
  \    // Console.WriteLine($\"Geometric approximation of PI calculated in parallel:\
  \ {pi}\");\n}\n```\n\n此代码调用了 `SerialPI` 方法，该方法通过本练习之前描述的几何算法计算 pi。结果以 `double` 类型返回并显示。目前注释掉的代码调用了\
  \ `ParallelPI` 方法，它执行相同的计算，但使用了并发任务。显示的结果应该与 `SerialPI` 方法返回的结果相同。\n\n**5.** 检查\
  \ `SerialPI` 方法。\n\n点击此处查看代码图像\n\n```cs\nstatic double SerialPI()\n{\n    List<double>\
  \ pointsList = new List<double>();\n    Random random = new Random(SEED);\n    int\
  \ numPointsInCircle = 0;\n    Stopwatch timer = new Stopwatch();\n    timer.Start();\n\
  \    try\n    {\n        // TO DO: Implement the geometric approximation of PI\n\
  \        return 0;\n    }\n    finally\n    {\n        long milliseconds = timer.ElapsedMilliseconds;\n\
  \        Console.WriteLine($\"SerialPI complete: Duration: {milliseconds} ms\",);\n\
  \        Console.WriteLine(\n        $\"Points in pointsList: {pointsList.Count}.\
  \ Points within circle: {numPointsInCircle}\");\n    }\n}\n```\n\n该方法生成了大量坐标，并计算每组坐标到原点的距离。集合的大小由\
  \ `Program` 类顶部的常量 `NUMPOINTS` 决定。该值越大，坐标集越多，该方法计算出的 pi 值就越精确。如果你的计算机有足够的内存，你可以增加\
  \ `NUMPOINTS` 的值。同样，如果你发现应用程序运行时抛出 `OutOfMemoryException` 异常，可以减小此值。\n\n你将每个点到原点的距离存储在\
  \ `pointsList List<double>` 集合中。坐标数据通过 `random` 变量生成。这是一个 `Random` 对象，使用常量种子，以便在每次运行程序时生成相同的随机数集。（这有助于你判断运行是否正常。）如果你想为随机数生成器设置不同的种子，可以更改\
  \ `Program` 类顶部的 `SEED` 常量。\n\n你使用 `numPointsInCircle` 变量来统计 `pointsList` 集合中位于圆边界内的点数。圆半径由\
  \ `Program` 类顶部的常量 `RADIUS` 指定。\n\n为了帮助你比较此方法与 `ParallelPI` 方法之间的性能，代码创建了一个名为 `timer`\
  \ 的 `Stopwatch` 变量并启动运行。`finally` 块确定了计算所需的时间并显示结果。\n\n**6.** 在 `try` 块中，删除注释并移除\
  \ `return` 语句。（该语句仅提供以确保代码能够编译。）在 `try` 块中添加下文加粗显示的 `for` 块和语句：\n\n点击此处查看代码图像\n\n\
  ```cs\ntry\n{\n    for (int points = 0; points < NUMPOINTS; points++)\n    {\n \
  \       int xCoord = random.Next(RADIUS);\n        int yCoord = random.Next(RADIUS);\n\
  \        double distanceFromOrigin = Math.Sqrt(xCoord * xCoord + yCoord * yCoord);\n\
  \        pointsList.Add(distanceFromOrigin);\n        doAdditionalProcessing();\n\
  \    }\n}\n```\n\n这段代码生成了一对位于 0 到 `RADIUS` 范围内的坐标值，并将其存储在 `xCoord` 和 `yCoord` 变量中。然后代码利用勾股定理计算这些坐标到原点的距离，并将结果添加到\
  \ `pointsList` 集合中。\n\n***\n\n虽然这段代码执行了一定的计算工作，但在真实的科学应用程序中，你可能会包含更复杂的计算，使处理器占用更长时间。为了模拟这种情况，这段代码调用了另一个方法\
  \ `doAdditionalProcessing`。该方法会占用如下代码示例所示的 CPU 周期：\n\n点击此处查看代码图像\n\n```cs\nprivate\
  \ static void doAdditionalProcessing()\n{\n    Thread.SpinWait(SPINWAITS);\n}\n\
  ```\n\n`SPINWAITS` 是 `Program` 类顶部定义的另一个常量。\n\n***\n\n**7.** 在 `SerialPI` 方法的 `try`\
  \ 块中，在 `for` 块之后添加下方示例中加粗显示的 `foreach` 语句。\n\n点击此处查看代码图像\n\n```cs\ntry\n{\n    for\
  \ (int points = 0; points < NUMPOINTS; points++)\n    {\n        ...\n    }\n  \
  \  foreach (double datum in pointsList)\n    {\n        if (datum <= RADIUS)\n \
  \       {\n            numPointsInCircle++;\n        }\n    }\n}\n```\n\n\n\n\n\
  这段代码遍历 `pointsList` 集合并逐一检查每个值。如果该值小于或等于圆的半径，则增加 `numPointsInCircle` 变量的值。在此循环结束时，`numPointsInCircle`\
  \ 应包含发现位于圆边界内的坐标总数。\n\n### 8. 在 `foreach` 语句之后，在 `try` 块中添加以下**加粗显示**的语句：\n\n点击此处查看代码图像\n\
  \n```c\ntry\n{\n    for (int points = 0; points < NUMPOINTS; points++)\n    {\n\
  \        ...\n    }\n    foreach (double datum in pointsList)\n    {\n        ...\n\
  \    }\n    double pi = 4.0 * numPointsInCircle / NUMPOINTS;\n    return pi;\n}\n\
  ```\n\n第一条语句根据之前描述的公式，根据圆内点数与总点数的比例来计算 `pi`。该值将作为方法的的结果返回。\n\n### 9. 在“调试”（Debug）菜单上，点击“转调试启动”（Start\
  \ Without Debugging）。\n\n程序运行并显示其对 `pi` 的近似值，如下图所示。（在我的电脑上花了略多于 46 秒，所以请准备好等待一会儿。）计算结果所需的时间也会显示。\n\
  \n![图像](img/Image00168.jpg)\n\n***\n\n![图像](img/Image00005.jpg) **注意**\n\n除非你更改了\
  \ `NUMPOINTS`、`RADIUS` 或 `SEED` 常量，否则你的运行结果应该是相同的。\n\n***\n\n### 10. 关闭控制台窗口并返回\
  \ Visual Studio。\n\n在 `SerialPI` 方法中，`for` 循环中生成点并计算它们到原点距离的代码是一个明显的可以并行化的区域。这正是你在下一次练习中将要做的操作。\n\
  \n## 使用并行任务计算 pi\n\n### 1. 在“解决方案管理器”（Solution Explorer）中，双击 `Program.cs`，如果该文件尚未打开，则在代码和文本编辑器窗口中显示。\n\
  \n### 2. 找到 `ParallelPI` 方法。它包含的代码与你在向 `try` 块添加计算 `pi` 的代码之前的初始 `SerialPI` 方法版本相同。\n\
  \n### 3. 在 `try` 块中，删除注释并移除 `return` 语句。在 `try` 块中添加此处**加粗显示**的 `Parallel.For` 语句：\n\
  \n点击此处查看代码图像\n\n```csharp\ntry\n{\n    Parallel.For (0, NUMPOINTS, (x) =>\n    {\n\
  \        int xCoord = random.Next(RADIUS);\n        int yCoord = random.Next(RADIUS);\n\
  \        double distanceFromOrigin = Math.Sqrt(xCoord * xCoord + yCoord * yCoord);\n\
  \        pointsList.Add(distanceFromOrigin);\n        doAdditionalProcessing();\n\
  \    });\n}\n```\n\n此构造是 `SerialPI` 方法中 `for` 循环代码的并行对应。原始 `for` 循环的体被封装在一个 lambda\
  \ 表达式中。记住，循环的每次迭代都是通过任务执行的，并且任务可以并行运行。并行程度取决于计算机上的处理器核心数和其他可用资源。\n\n### 4. 在 `Parallel.For`\
  \ 语句之后，在 `try` 块中添加以下**加粗显示**的代码。这段代码与 `SerialPI` 方法中相应的语句相同。\n\n点击此处查看代码图像\n\n\
  ```csharp\ntry\n{\n    Parallel.For (...\n    {\n        ...\n    });\n    foreach\
  \ (double datum in pointsList)\n    {\n        if (datum <= RADIUS)\n        {\n\
  \            numPointsInCircle++;\n        }\n    }\n    double pi = 4.0 * numPointsInCircle\
  \ / NUMPOINTS;\n    return pi;\n}\n```\n\n### 5. 在 `Program.cs` 文件末尾的 `Main` 方法中，取消调用\
  \ `ParallelPI` 方法的代码以及显示结果的 `Console.WriteLine` 语句的注释。\n\n### 6. 在“调试”（Debug）菜单上，点击“转调试启动”。\n\
  \n程序运行。下面的图像显示了典型的输出（你的计时可能会不同；我使用的是四核处理器）：\n\n![图像](img/Image00169.jpg)\n\n`SerialPI`\
  \ 方法计算出的值应该与之前完全相同，但 `ParallelPI` 方法的结果实际上看起来有些可疑。随机数生成器使用的种子值与 `SerialPI` 方法使用的相同，因此它应该产生相同的随机数序列、相同的结果以及相同数量的圆内点。另一个奇怪的点是，`ParallelPI`\
  \ 方法中的 `pointsList` 集合包含的点似乎少于 `SerialPI` 方法中的相同集合。\n\n***\n\n![图像](img/Image00005.jpg)\
  \ **注意**\n\n如果 `pointsList` 集合实际上包含了预期的项目数量，请再次运行应用程序。你应该发现，在大多数（但并非所有）运行中，它包含的项少于预期。\n\
  \n***\n\n### 7. 关闭控制台窗口并返回 Visual Studio。\n\n并行计算哪里出了什么问题？一个好的起点是查看 `pointsList`\
  \ 集合中的项目数量。该集合是一个 `List<double>` 对象，但这种类型不是线程安全的。`Parallel.For` 语句调用 `Add` 方法但记住这段代码是由任务执行的，由于添加的项目很多，某些\
  \ `Add` 调用可能会相互干扰并导致损坏。解决方案是使用 `System.Concurrent` 命名空间中的集合。\n\n## 使用线程安全的集合\n\n\
  ### 1. 在“解决方案管理器”中，双击 `Program.cs`，如果该文件尚未打开，则在代码和文本编辑器窗口中显示。\n\n### 2. 在文件顶部添加以下\
  \ `using` 指令：\n\n点击此处查看代码图像\n\n```csharp\nusing System.Concurrent;\n```\n\n### 3.\
  \ 找到 `ParallelPI` 方法。在该方法的开头，将实例化 `List<double>` 集合的语句替换为创建 `ConcurrentBag<double>`\
  \ 集合的代码，如下代码示例所示**加粗显示**：\n\n点击此处查看代码图像\n\n```csharp\nstatic double ParallelPI()\n\
  {\n    ConcurrentBag<double> pointsList = new ConcurrentBag<double>();\n    Random\
  \ random = ...;\n    ...\n```\n\n注意该类无法指定默认容量，因此构造函数不接受参数。你不需要更改该方法的其他代码；你通过 `Add`\
  \ 方法向 `ConcurrentBag<T>` 集合添加项，这与你向 `List<T>` 集合添加项的机制相同。\n\n### 4. 在“调试”（Debug）菜单上，点击“转调试启动”。\n\
  \n程序运行并通过 `SerialPI` 和 `ParallelPI` 方法显示其对 `pi` 的近似值。下面的图像显示了典型的输出。\n\n![图像](img/Image00170.jpg)\n\
  \n这次，`ParallelPI` 方法中的 `pointsList` 集合包含了正确数量，但圆内点数仍然很高；它应该与 `SerialPI` 方法报告的相同。\n\
  \n你还应该注意到，`ParallelPI` 方法花费的时间与之前的练习相比增加了。这是因为 `ConcurrentBag<T>` 类的方法必须锁定和解锁数据以保证线程安全，这一过程增加了调用这些方法的开销。当你考虑是否适当并行化操作时，请记住这一点。\n\
  \n### 5. 关闭控制台窗口并返回 Visual Studio。\n\n\n\n你目前在 `pointsList` 集合中的点数量是正确的，但现在为这些每个点记录的值变得值得怀疑。`Parallel.For`\
  \ 结构中的代码调用了 `Random` 对象的 `Next` 方法，但与泛型 `List<T>` 类中的方法一样，该方法不是线程安全的。遗憾的是，`Random`\
  \ 类没有并发版本，因此你必须求助于使用替代技术来对 `Next` 方法的调用进行序列化。由于每次调用都相对简短，因此使用简单的 `lock` 来保护对该方法的调用是合理的。\n\
  \n## 使用 lock 序列化方法调用\n\n1. **在解决方案管理器中，双击 `Program.cs` 以在代码和文本编辑器窗口中显示该文件（如果它尚未打开）。**\n\
  \n2. **找到 `ParallelPI` 方法。修改 `Parallel.For` 语句中 lambda 表达式中的代码，使用 `lock` 语句来保护对\
  \ `random.Next` 的调用。将 `pointsList` 集合指定为 lock 的主体，如下加粗所示：**\n\n点击此处查看代码图像\n\n```cs\n\
  static double ParallelPI()\n{\n...\n    Parallel.For(0, NUMPOINTS, (x) =>\n    {\n\
  \        int xCoord;\n        int yCoord;\n        lock(pointsList)\n        {\n\
  \            xCoord = random.Next(RADIUS);\n            yCoord = random.Next(RADIUS);\n\
  \        }\n        double distanceFromOrigin = Math.Sqrt(xCoord * xCoord + yCoord\
  \ * yCoord);\n        pointsList.Add(distanceFromOrigin);\n        doAdditionalProcessing();\n\
  \    });\n...\n}\n```\n\n注意 `xCoord` 和 `yCoord` 变量是在 `lock` 语句之外声明的。你这样做是因为 `lock`\
  \ 语句定义了自己的作用域，任何在指定 lock 语句作用域的块内定义的变量在结构退出时都会消失。\n\n3. **在调试菜单上，点击“转调试调试”。**\n\n\
  这一次，`SerialPI` 和 `ParallelPI` 方法计算出的 pi 值是相同的。唯一的区别是 `ParallelPI` 方法运行得更快。\n\n![Image](img/Image00171.jpg)\n\
  \n4. **关闭控制台窗口，返回 Visual Studio。\n\n## 总结\n\n在本章中，你学习了如何使用 `async` 修饰符和 `await`\
  \ 运算符来定义异步方法。异步方法基于任务，而 `await` 运算符指定了可以使用任务执行异步处理的节点。\n\n你还了解了一些关于 PLINQ 的知识以及如何使用\
  \ `AsParallel` 扩展方法将某些 LINQ 查询并行化。然而，PLINQ 本身是一个大课题，本章仅向你展示了如何入门。更多信息，请参阅 Visual\
  \ Studio 提供的文档中的“并行 LINQ (PLINQ)”主题。\n\n本章还展示了如何使用为任务提供的同步原语来同步并发任务中的数据访问。你学习了如何使用并发集合类来以线程安全的方式维护数据集合。\n\
  \n![Image](img/Image00001.jpg) 如果你想继续阅读下一章，请保持 Visual Studio 2015 运行并转到第 25 章。\n\
  \n\n\n\n\n# 通用 Windows 平台应用程序的特性\n\n许多现代手持设备和平板电脑使得使用户可以通过触摸操作与应用程序进行交互。您应该根据这种用户体验（UX）风格来设计您的\
  \ UWP 应用。`Windows 10` 包含大量基于触摸的控件，这些控件也可以与鼠标和键盘共同工作。您不需要在应用中区分触摸和鼠标功能；只需为触摸设计您的应用，如果用户倾向于使用鼠标和键盘，或者他们在使用不支持触摸交互的设备时，他们仍然可以使用鼠标和键盘进行操作。\n\
  \n图形用户界面（GUI）响应手势并向用户提供反馈的方式可以极大地提升应用程序的专业感。`Visual Studio 2015` 包含的 UWP 应用模板包含一个动画库，您可以在应用中使用该库来标准化这种反馈，并与微软提供的操作系统和软件无缝衔接。\n\
  \n***\n\n![Image](img/Image00005.jpg) 注意\n\n`gesture`（手势）一词是指用户执行的以触摸为向的操作。例如，用户可以用手指点击某个项目，这种`gesture`\
  \ 的响应方式通常与您预期的鼠标点击行为相同。然而，手势可以比使用鼠标捕捉的简单操作表达丰富得多。例如，`rotate`（旋转）手势涉及用户将两个手指放在屏幕上，并用它们划出一个圆弧；在典型的\
  \ `Windows 10` 应用中，这种`gesture`应该导致 UI 根据用户手指移动的方向旋转选定的对象。其他手势还包括：缩放以某个项目以显示更多细节、长按以显示有关项目的更多信息（类似于鼠标右键点击），以及滑动以选择项目并将其跨屏幕移动。\n\
  \n***\n\nUWP 旨在运行在具有不同屏幕尺寸和分辨率的各种设备上。因此，当您实现 UWP 应用时，您需要构建软件，使其适应运行的环境，并自动缩放以适应设备的屏幕尺寸和方向向。这种方法让您的软件能够触及日益广阔的市场。此外，许多现代设备还可以通过内置传感器和加速度计检测其朝向以及用户更改此朝向的速度。当用户倾斜或旋转设备时，UWP\
  \ 应用可以调整其布局，使用户能够以最符合其个人习惯的模式工作。您还应该理解，移动性是许多现代应用的关键需求，通过 UWP 应用，用户可以漫游，其数据可以通过云端迁移到他们在特定时刻运行您应用程序的任何设备上。\n\
  \nUWP 应用的生命周期与传统的桌面应用有所不同。您应该设计可以在智能手机等设备上运行的应用，在用户切换到另一个应用时挂起执行，并在焦点返回时恢复运行。这种方法有助于节省受限设备上的资源和电量。如果\
  \ `Windows` 确定需要释放内存等系统资源，它实际上可能会决定关闭一个挂起的应用。当应用下次运行时，它应该能够从上次离开的地方继续。这意味着您需要准备在代码中管理应用状态信息，将其保存到硬盘，并在适当的时机进行恢复。\n\
  \n***\n\n![Image](img/Image00005.jpg) 注意\n\n您可以在微软网站上的“Guidelines for app suspend\
  \ and resume”页面找到更多关于如何管理 UWP 应用生命周期的信息，网址为 `[`msdn.microsoft.com/library/windows/apps/hh465088.aspx`](https://msdn.microsoft.com/library/windows/apps/hh465088.aspx)`。\n\
  \n***\n\n当您构建新的 UWP 应用时，可以使用 `Visual Studio 2015` 提供的工具对其进行打包，并上传到 `Windows Store`。其他用户随后可以连接到\
  \ `Store`，下载您的应用并安装它。您可以对您的应用收费，也可以免费提供。这种分发和部署机制取决于您的应用是值得信赖的并符合微软指定的安全策略。当您将应用上传到\
  \ `Windows Store` 时，它将通过一系列检查，以验证其是否不包含恶意代码以及是否符合 UWP 应用的安全要求。这些安全限制规定了您的应用访问安装其的计算机上资源的方式。例如，默认情况下，UWP\
  \ 应用无法直接写入文件系统或无法监听来自网络的入站请求（这是病毒和其他恶意软件通常表现出的两种行为）。但是，如果您的应用需要执行受限操作，您可以在存储在 `Package.appxmanifest`\
  \ 文件中的应用清单数据中将它们指定为“能力”（capabilities）。这些信息记录在您的应用的元数据中，并指示微软执行额外的测试，以验证您的应用使用这些功能的方式。\n\
  \n`Package.appxmanifest` 文件是一个 XML 文档，但您可以在 `Visual Studio` 中使用 `Manifest Designer`\
  \ 对其进行编辑。下面的图片显示了一个示例。在这里，正在使用 `Capabilities` 选项卡来指定应用程序可以执行的受限操作。\n\n![Image](img/Image00175.jpg)\n\
  \n在此示例中，应用程序声明它需要：\n\n![Image](img/Image00001.jpg) 接收来自互联网的入站数据，但不能作为服务器，且没有本地网络访问。\n\
  \n![Image](img/Image00001.jpg) 读取和写入用户“文档”文件夹中的文件。\n\n![Image](img/Image00001.jpg)\
  \ 访问提供设备位置 GPS 信息。\n\n`Image00001.jpg` 访问摄像头或外部摄像头的视频流。用户会被告知这些要求，在任何情况下，用户都安装应用后禁用这些设置；应用程序必须做好采取替代方案或禁用相应功能的准备。\n\
  \n***\n\n理论足够了——让我们开始构建 UWP 应用。\n\n## 使用 Blank App 模板构建通用平台应用\n\n构建 UWP 应用最简单的方法是使用带有\
  \ `Windows 10` 的 `Visual Studio 2015` 提供的应用模板。在章节中实现的许多 GUI 应用程序都使用了 `Blank App`\
  \ 模板，这是一个很好的开始。\n\n在接下来的练习中，您将为一家名为 `Adventure Works` 的虚构公司设计用户界面。该公司制造并供应自行车及相关配件。该应用将允许用户输入和修改客户的详情。\n\
  \n### 创建 Adventure Works Customers 应用\n\n1. 如果 `Visual Studio 2015`尚未运行，请启动它。\n\
  2. 在 `File` 菜单上，指向 `New`，然后点击 `Project`。\n3. 在 `New Project` 对话框中，在左窗格中，展开 `Templates`，展开\
  \ `Visual C#，展开 `Windows`，然后点击 `Universal`。\n4. 在中间面板中，点击 `Blank App (Windows Universal)`\
  \ 图标。\n5. 在 `Name` 字段中输入 `Customers`。\n6. 在 `Location` 字段中输入文档文件夹中的 `\\Microsoft\
  \ Press\\VCSBS\\Chapter 25`。\n7. 点击 `OK`。\n\n新应用已创建，`App.xaml.cs` 文件显示在 `Code and\
  \ Text Editor` 窗口中。目前您可以忽略此文件。\n\n\n\n\n\n### 8. 在“解决方案资源管理器”中，双击 `MainPage.xaml`。\n\
  \n设计视图窗口出现并显示一个空白页。你可以从工具箱拖入控件来添加应用程序所需的各种控件，如第 1 章中“欢迎来到 C#”所示所示。然而，为了本次练习的目的，将精力放在定义表单布局的\
  \ XAML 标记上更有启发性。如果你检查这些标记，它们看起来应该是这样的：\n\n点击此处此处查看代码图像\n\n```xml\n<Page\n  x:Class=\"\
  Customers.MainPage\"\n  xmlns=\"http://schemas.microsoft.com/winfx/2006/xaml/presentation\"\
  \n  xmlns:x=\"http://schemas.microsoft.com/winfx/2006/xaml\"\n  xmlns:local=\"using:Customers\"\
  \n  xmlns:d=\"http://schemas.microsoft.com/expression/blend/2008\"\n  xmlns:mc=\"\
  http://schemas.openxmlformats.org/markup-compatibility/2006\"\n  mc:Ignorable=\"\
  d\">\n  <Grid Background=\"{ThemeResource ApplicationPageBackgroundThemeBrush}\"\
  >\n  </Grid>\n</Page>\n```\n\n表单以 XAML `<Page>` 标签开始，并闭合 `</Page>` 标签结束。这些标签之间的内容定义了页的内容。\n\
  \n`<Page>` 标签的属性包含许多格式为 `xmlns:id = “...”` 的声明。这些是 XAML 命名空间声明，它们的操作与 C# `using`\
  \ 指令类似，因为它们将项目引入作用范围。你可以添加到页面中的许多控件和其他项目都定义在这些 XAML 命名空间中，你可以忽略大部分此类声明。然而，有一个看起来相当奇怪的声明需要你注意：\n\
  \n`xmlns:local=\"using:Customers\"`\n\n此声明将 C# `Customers` 命名空间中的项目引入作用范围。你可以在 XAML\
  \ 代码中通过在类和其他类型名前加上 `local` 前缀，来引用该命名空间中的内容。`Customers` 命名空间是为你的应用程序中的代码生成的命名空间。\n\
  \n### 9. 在“解决方案资源管理器”中，展开 `MainPage.xaml`，然后双击 `MainPage.xaml.cs` 以在“代码和文本编辑器”窗口中显示它。\n\
  \n### 10. 回想书中之前的练习，记住这个 C# 文件包含了应用程序的逻辑和表单的事件处理程序。它如下如下（为了节省空间，省略了文件顶部的 `using`\
  \ 指令）：\n\n点击此处查看代码图像\n\n```csharp\n// The Blank Page item template is documented\
  \ at http://go.microsoft.com/fwlink/?LinkId\n=402352&clcid=0x409\nnamespace Customers\n\
  {\n    /// <summary>\n    /// 一个可以单独使用或在 Frame 内进行导航的空页。\n    /// </summary>\n \
  \   public sealed partial class MainPage : Page\n    {\n        public MainPage()\n\
  \        {\n            this.InitializeComponent();\n        }\n    }\n}\n```\n\n\
  此文件定义了 `Customers` 命名空间中的类型。页面由一个名为 `MainPage` 的类实现，并继承自 `Page` 类。`Page` 类实现了 UWP\
  \ 应用中 XAML 页面的默认功能，因此你只需要在 `MainPage` 类中编写定义你应用程序特定逻辑的代码。\n\n### 11. 回到设计视图窗口中的\
  \ `MainPage.xaml` 文件。如果你查看页面的 XAML 标记，你应该会注意到 `<Page>` 标签包含了以下属性：\n\n`x:Class=\"\
  Customers.MainPage\"`\n\n此属性将定义页面布局的 XAML 标记与提供页面背后逻辑的 `MainPage` 类连接起来。\n\n这就是一个简单\
  \ UWP 应用程序的基础构建工作。当然，让一个图形应用程序变得有价值的是它向用户呈现信息的方式。这并不像听起来那么简单。设计一个吸引人且易于使用的图形界面需要并非所有开发者都具备的专业技能（我知道，因为我自己也缺乏这些技能）。然而，许多拥有这些技能的图形艺术家并不是程序员，因此尽管他们可能设计出极佳的用户界面，但可能无法实现使其变得实用的逻辑。幸运的是，Visual\
  \ Studio 2015 使你能够将用户界面设计与业务逻辑分离，这样图形艺术家和开发者就可以合作构建出一个既外观酷又运行良好的应用程序。开发者只需要专注于应用程序的基础布局，让图形艺术家提供样式即可。\n\
  \n#### 实现可扩展的用户界面\n\n为 UWP 应用程序布局用户界的关键在于理解如何使其缩放并适应用户可能运行应用程序的设备的不同形状因子。在接下来的练习中，你将研究如何实现这种缩放。\n\
  \n##### 为 Customers 应用程序布局页面\n\n**1.** 在设计视图窗口顶部工具栏中，注意下拉列表框，它允许你选择设计表面的分辨率和形状因子，以及一对按钮，允许你为支持旋转的设备（平板电脑和手机支持）选择方向（竖屏或横屏）（桌面电脑不支持）。其意图是你可以使用这些选项快速查看用户界面在不同设备上的显示。\n\
  \n![Image](img/Image0176.jpg)\n\n默认布局是 5 英寸屏幕竖屏。在下拉列表框中，选择 13.3 桌面（1280x720）100%\
  \ 缩放。注意此形状因子默认为横屏。\n\n**2.** 查看页面的 XAML 标记。\n\n页面包含一个 `Grid` 控件：\n\n点击此处查看代码图像\n\
  \n```xml\n<Grid Background=\"{ThemeResource ApplicationPageBackgroundThemeBrush}\"\
  >\n</Grid>\n```\n\n![Image](img/Image0005.jpg) 注意为 `Grid` 指定 `Background` 属性。这是使用样式示例，你将在本章后面学习样式。\n\
  \n理解 `Grid` 控件如何工作是构建可扩展用户界面的基础。`<Page>` 只能包含一个项目，如果你愿意，可以将 `Grid` 控件替换为 `Button`，如下例所示：\n\
  \n![Image](img/Image0005.jpg) 注意不要输入以下代码。它仅用于说明目的。\n\n点击此处查看代码图像\n\n```xml\n<Page\n\
  ...\n  <Button Content=\"Click Me\"/>\n</Page>\n```\n\n然而，生成的应用程序可能没什么用——一个包含按钮而不显示任何其他内容的表单不太获得伟大应用程序奖。如果你尝试向页面添加第二个控件（例如\
  \ `TextBox`），你的代码将无法编译，并会出现图中所示的错误：\n\n![Image](img/Image0177.jpg)\n\n`Grid` 控件的目的是方便向页面添加多个项目。`Grid`\
  \ 控件是容器控件的一个示例；它可以包含许多其他控件，你可以指定这些其他控件在网格中的位置。还有其他容器控件。例如，`StackPanel` 控件会自动将其包含的控件按垂直排列，每个控件直接放置在其前一个控件的下方。\n\
  \n在此应用程序中，你将使用 `Grid` 来容纳用户输入和查看客户数据所需的控件。\n\n**3.** 向页面添加一个 `TextBlock` 控件，可以通过从工具箱拖入，也可以直接在\
  \ XAML 格中输入文本 `<TextBlock />`，放置在起始 `<Grid>` 标签之后的空白行上，如下所示：\n\n点击此处查看代码图像\n\n```xml\n\
  <Grid Background=\"{ThemeResource ApplicationPageBackgroundThemeBrush}\">\n  <TextBlock\
  \ />\n</Grid>\n```\n\n![Image](img/Image00013.jpg) 提示\n\n\n\n\n如果工具箱（Toolbox）未出现，请点击“视图”菜单上的`工具箱`，它将显示在左侧的工具栏中。此外，请注意你可以直接在页面的\
  \ XAML 窗口中输入控件代码，不需要从工具箱中拖放控件。\n\n## 4. 此 `TextBlock` 提供了页面标题。使用下表中的值设置 `TextBlock`\
  \ 控件的属性：\n\n![Image](img/Image00178.jpg)\n\n你可以通过“属性”窗口或在 XAML 窗口中输入等效 XAML 标记来设置这些属性，如下加粗所示：\n\
  \n点击此处查看代码图像\n\n```xml\n<TextBlock HorizontalAlignment=\"Left\" Margin=\"400,90,0,0\"\
  \ TextWrapping=\"Wrap\" Text=\"Adventure Works Customers\" VerticalAlignment=\"\
  Top\" FontSize=\"50\"/>\n```\n\n生成的文本应显示在设计视图中，如下：\n\n![Image](img/Image00179.jpg)\n\
  \n注意，当你从工具箱拖一个控件到表单时，会出现连接器，指定控件两条边相对于其所在容器控件边缘的距离。在前面的示例中，`TextBlock` 控件的这些连接器标记为值\
  \ `400`（距离网格左边缘）和 `90`（距离网格顶部）。在运行时，如果调整了 `Grid` 控件的大小，`TextBlock` 将移动以保持这些距离，这可能会导致\
  \ `TextBlock`  `Grid` 右边缘和底部的像素距离发生变化。你可以通过设置`HorizontalAlignment`水平对齐）和`VerticalAlignment`垂直对齐）属性来指定控件锚定的边缘。`Margin`外边距）属性指定距离锚定边缘的距离。在此示例中，`TextBlock`\
  \ 的 `HorizontalAlignment` 属性设置为 `Left`，`VerticalAlignment` 属性设置为 `Top`，这就是控件锚定在网格左侧和顶部边缘的原因。`Margin`\
  \ 属性包含四个值，按顺序指定控件左、上、右、下侧距离容器相应边缘的距离。如果控件的某侧未锚定容器边缘，你可以将 `Margin` 属性中的相应值设置为 `0`。\n\
  \n## 5. 在页面上再添加四个 `TextBlock` 控件。这些 `TextBlock` 控件是标签，帮助用户识别页面上显示的数据。使用下表中的值设置这些控件的属性：\n\
  \n![Image](img/Image00180.jpg)\n\n与之前一样，你可以从工具箱拖放控件并使用“属性”窗口设置其属性，也可以在现有的 `TextBlock`\
  \ 控件之后、闭合 `</Grid>` 标签之前在 XAML 格中输入以下 XAML 标记：\n\n点击此处查看代码图像\n\n```xml\n<TextBlock\
  \ HorizontalAlignment=\"Left\" Margin=\"330,190,0,0\" TextWrapping=\"Wrap\" Text=\"\
  ID\" VerticalAlignment=\"Top\" FontSize=\"20\"/>\n<TextBlock HorizontalAlignment=\"\
  Left\" Margin=\"460,190,0,0\" TextWrapping=\"Wrap\" Text=\"Title\" VerticalAlignment=\"\
  Top\" FontSize=\"20\"/>\n<TextBlock HorizontalAlignment=\"Left\" Margin=\"620,190,0,0\"\
  \ TextWrapping=\"Wrap\" Text=\"First Name\" VerticalAlignment=\"Top\" FontSize=\"\
  20\"/>\n<TextBlock HorizontalAlignment=\"Left\" Margin=\"975,190,0,0\" TextWrapping=\"\
  Wrap\" Text=\"Last Name\" VerticalAlignment=\"Top\" FontSize=\"20\"/>\n```\n\n##\
  \ 6. 在 `TextBlock` 控件下方，添加三个显示文本 ID、名（FirstName）和姓（LastName）的 `TextBox` 控件。使用下表设置这些控件的值。注意\
  \ `Text` 属性应设置为空字符串（`\"\"`）。还要注意 `id TextBox` 控件被标记为只读。这是因为客户 ID 将在你后添加的代码中自动生成：\n\
  \n![Image](img/Image00181.jpg)\n\n以下代码显示了这些控件的等效 XAML 标记：\n\n点击此处查看代码图像\n\n```xml\n\
  <TextBox HorizontalAlignment=\"Left\" Margin=\"330,190,0,0\" TextWrapping=\"Wrap\"\
  \ Text=\"\" VerticalAlignment=\"Top\" FontSize=\"20\" IsReadOnly=\"True\"/>\n<TextBox\
  \ HorizontalAlignment=\"Left\" Margin=\"460,190,0,0\" TextWrapping=\"Wrap\" Text=\"\
  \" VerticalAlignment=\"Top\" FontSize=\"20\"/>\n<TextBox HorizontalAlignment=\"\
  Left\" Margin=\"620,190,0,0\" TextWrapping=\"Wrap\" Text=\"\" VerticalAlignment=\"\
  Top\" FontSize=\"20\"/>\n<TextBox HorizontalAlignment=\"Left\" Margin=\"975,190,0,0\"\
  \ TextWrapping=\"Wrap\" Text=\"\" VerticalAlignment=\"Top\" FontSize=\"20\"/>\n\
  ```\n\n\n\n\n![Image](img/Image00005.jpg) 注意\n\n`ComboBox` 控件可以显示简单的元素，例如一组显示文本的\
  \ `ComboBoxItem` 控件，但它也可以包含更复杂的元素，如按钮、复选框和单选按钮。如果你添加的是简单的 `ComboBoxItem` 控件，手动输入\
  \ XAML 标记可能更简单；但如果你添加的是复杂的控件，对象集合编辑器（Object Collection Editor）可能会非常有用。然而，你应该避免在组合框中表现得过于聪明；最好的应用程序是那些提供最直观\
  \ UI 的程序，在组合框中嵌入复杂的控件会让用户感到困惑。\n\n***\n\n### 12. 在表单上再添加两个 `TextBox` 控件和两个 `TextBlock`\
  \ 控件。通过 `TextBox` 控件，用户能够为客户输入电子邮件地址和电话号码，`TextBlock` 控件则为文本框提供标签。使用下表中的值设置控件的属性。\n\
  \n![Image](img/Image00184.jpg)![Image](img/Image00185.jpg)\n\n这些控件的 XAML 标记应该如下所示：\n\
  \n点击此处查看代码图片\n\n```xml\n<TextBlock HorizontalAlignment=\"Left\" Margin=\"300,390,0,0\"\
  \ TextWrapping=\"Wrap\" Text=\"Email\" VerticalAlignment=\"Top\" FontSize=\"20\"\
  />\n<TextBox x:Name=\"email\" HorizontalAlignment=\"Left\" Margin=\"450,390,0,0\"\
  \ TextWrapping=\"Wrap\" Text=\"\" VerticalAlignment=\"Top\" Width=\"400\" FontSize=\"\
  20\"/>\n<TextBlock HorizontalAlignment=\"Left\" Margin=\"300,540,0,0\" TextWrapping=\"\
  Wrap\" Text=\"Phone\" VerticalAlignment=\"Top\" FontSize=\"20\"/>\n<TextBox x:Name=\"\
  phone\" HorizontalAlignment=\"Left\" Margin=\"450,540,0,0\" TextWrapping=\"Wrap\"\
  \ Text=\"\" VerticalAlignment=\"Top\" Width=\"200\" FontSize=\"20\"/>\n```\n\n设计视图窗口中完成的表单应该如下：\n\
  \n![Image](img/Image00186.jpg)\n\n### 13. 在“调试”（Debug）菜单上，点击“启动调试”（Start Debugging）来生成并运行应用程序。\n\
  \n应用程序启动并显示表单。你可以向表单输入数据并从组合框中选择标题，但你还无法进行其他许多操作。然而，一个大得的问题是表单看起来非常糟糕。显示右侧被截断了，大部分文本发生了换行，而且“姓”（Last\
  \ Name）文本框被截断了：\n\n![Image](img/Image00187.jpg)\n\n### 14. 点击并拖动窗口的右侧以扩展显示，使文本和控件的显示与在\
  \ Visual Studio 设计视图窗口中显示的一。这是表单设计时的最佳尺寸。\n\n### 15. 调整显示客户应用程序的窗口大小至其最小宽度。这一次，表单的大部分内容消失了。部分\
  \ `TextBlock` 内容发生了换行，但表单在此视图下显然是不可用的。\n\n### 16. 回到 Visual Studio，在“调试”菜单上，点击“停止调试”（Stop\
  \ Debugging）。\n\n这是一次关于小心布局应用程序的引有益的教训。尽管应用程序在与设计视图大小相同的窗口中运行时看起来良好，但只要你将窗口调整为更窄的视图，它就会变得没那么好用（甚至完全没用）。此外，应用程序假设用户将在处于横向模式的设备上查看屏幕。如果你临时将设计视图窗口切换到\
  \ 12 英寸平板电脑尺寸并点击纵向（Portrait）按钮，你就可以看到如果用户在支持不同方向的平板上运行应用程序并旋转设备切换到纵向模式时，表单会什么样。（之后忘了切换回\
  \ 13.3 英寸桌面尺寸。）\n\n![Image](img/Image00188.jpg)\n\n问题在于，到目前为止所示布局技术无法扩展并适应不同的设备尺寸和方向。幸运的是，你可以使用\
  \ `Grid` 控件的属性以及称为“视觉状态管理器”（Visual State Manager）的功能来解决这些问题。\n\n***\n\n## 使用模拟器测试通用\
  \ Windows 平台应用程序\n\n即使你没有平板电脑，仍然可以使用 Visual Studio 2015 提供的模拟器测试你的 UWP 应用程序，并查看它们在移动设备上的表现。模拟器模拟了一个平板设备，让你能够模拟用户手势，如缩放捏合和滑动对象，以及旋转和更改设备分辨率。\n\
  \n要在模拟器中运行应用程序，请打开 Visual Studio 工具栏上的“调试目标”（Debug Target）下拉列表。默认情况下，调试目标设置为“本地机器”（Local\
  \ Machine），这会导致应用程序在你的计算机上全屏运行，但你可以从列表中选择“模拟器”，这会在你调试应用程序时启动模拟器。请注意，如果你需要进行远程调试，也可以将调试目标设置为不同的计算机（当你选择此选项时，系统会提示输入远程计算机的网络地址）。下面的图片显示了调试目标列表：\n\
  \n![Image](img/Image00189.jpg)\n\n选择模拟器后，当你从 Visual Studio 的“调试”菜单运行应用程序时，模拟器将启动并显示你的应用程序。模拟器窗口右侧的工具栏包含一组工具，你可以通过鼠标模拟用户手势。如果应用程序需要设备地理位置信息，你甚至可以模拟用户的位置。然而，对于测试应用程序的布局，最重要的工具是“顺时针旋转”（Rotate\
  \ Clockwise）、“反时针旋转”（Rotate Counterclockwise）和“更改分辨率”（Change Resolution）。下面的图片显示了在模拟器中运行客户应用程序。应用程序已最大化以占据整个屏幕。标签描述了每个按钮的功能。\n\
  \n![Image](img/Image00190.jpg)\n\n***\n\n![Image](img/Image00005.jpg) 注意\n\n本节中的屏幕截图是在分辨率为\
  \ 1366x768 的计算机上截取的（代表 10.6 英寸显示）。如果你使用的是不同的分辨率，可能需要点击“更改分辨率”按钮切换到 1366×768 以获得所示的结果。\n\
  \n***\n\n下面的图片显示了用户点击“顺时针旋转”按钮后的相同应用程序，导致应用程序在纵向模式下运行：\n\n![Image](img/Image00191.jpg)\n\
  \n你还可以尝试更改模拟器的分辨率查看应用程序如何表现。下面的图片显示了当模拟器设置为高分辨率设备（2560×1440，27 英寸显示器的典型分辨率）时运行客户应用程序。可以看到应用程序显示被压缩在屏幕的左上角：\n\
  \n![Image](img/Image00192.jpg)\n\n模拟器的行为与 Windows 10 计算机完全相同（实际上它是到你计算机的远程桌面）。要停止模拟器，点击\
  \ Windows 按钮（在模拟器中，而不是你的桌面上），点击“电源”，然后点击“断开连接”。\n\n你应该注意到 Visual Studio 还支持特定移动设备的模拟器。某些可能列在模拟器下拉列表中，但你可以通过选择“下载新模拟器”来下载新可用的模拟器。\n\
  \n***\n\n##### 使用 *Grid* 控件实现表格化布局\n\n\n\n\n你可以使用 `Grid` 控件来实现表格状布局。`Grid` 包含行和列，你可以指定其他控件应该放置在哪些行和列中。`Grid`\
  \ 控件的美妙之处在于，你可以将其包含的行和列的大小指定为相对值；当网格缩小或增大以适应用户可能切换的不同窗体和方向时，行和列会按照网格的比例缩小或增大。网格中行和列的交点定义了一个单元格，如果你将控件放在单元格中，它们将随着行和列的缩小和增大而移动。因此，实现可扩展\
  \ UI 的关键在于将其拆分为单元格集合，并将相关元素放在同一个单元格中。单元格可以包含另一个网格，让你能够精细地调整每个元素的精确位置。\n\n如果你考虑 Customers（客户）应用程序，你可以看到\
  \ UI 分为两个主要区域：包含标题的头部和包含客户详情的正文。通过在这些区域之间留出空间并在表单底部留出边距，你可以为这些区域的每一个分配相对大小，如图所示：\n\
  \n![Image](img/Image00193.jpg)\n\n该图仅显示了粗略的近似值，但标题行的内容是其下方间距行的两倍。正文行的高度是间距行的十倍，而底部边距的高度是间距高度的两倍。\n\
  \n为了放置每个区域中的元素，你可以定义一个具有四行的网格，并在每行中放置相应的项目。然而，表单的正文可以用另一个更复杂的网格来描述，如图所示：\n\n![Image](img/Image001994.jpg)\n\
  \n同样，每行的高度都是以相对方式指定的，每列的宽度也是如此。此外，你可以清楚地看到，电子邮件和电话（Phone）的 `TextBox` 元素并不完全符合这种网格模式。如果你非常严谨，可能会选择在表单正文内部定义更多的网格以使这些项目适应。。然而，你应该记住此网格的目的，即定义元素的相对位置和间距。因此，元素延伸到网格布局中单元格边界之外是可以接受的。\n\
  \n在接下来的练习中，你将修改 Customers 应用程序的布局，使用这种网格格式来定位控件。\n\n### 修改布局以适应不同的窗体和方向\n\n**1.**\
  \ 在 Customers 应用程序的 XAML 窗格中，在现有的 `Grid` 元素内部添加另一个 `Grid`。为这个新的 `Grid` 设置距离父 `Grid`\
  \ 左边缘和右边缘 10 像素的边距，距离顶部和底部 20 像素的边距，如下代码加粗所示：\n\n点击此处查看代码图像\n\n```xml\n<Grid Background=\"\
  {ThemeResource ApplicationPageBackgroundThemeBrush}\">\n  <Grid Margin=\"10,20,10,20\"\
  >\n  </Grid>\n  <TextBlock HorizontalAlignment=\"Left\" TextWrapping=\"Wrap\" Text=\"\
  Adventure Works Customers\" ... />\n  ...\n</Grid>\n```\n\n你可以将行和列定义为现有 `Grid` 的一部分，但为了与其他\
  \ UWP 应用程序保持一致的观，你应该在页面的左侧和顶部留一些空白。\n\n**2.** 在新的 `Grid` 元素中添加加粗所示的 `<Grid.RowDefinitions>`\
  \ 部分。\n\n点击此处查看代码图像\n\n```xml\n<Grid Margin=\"10,20,10,20\">\n  <Grid.RowDefinitions>\n\
  \    <RowDefinition Height=\"2*\"/>\n    <RowDefinition Height=\"*\"/>\n    <RowDefinition\
  \ Height=\"10*\"/>\n    <RowDefinition Height=\"2*\"/>\n  </Grid.RowDefinitions>\n\
  </Grid>\n```\n\n`<Grid.RowDefinitions>` 部分定义了网格的行。在这个示例中，你定义了四行。你可以以像素为单位指定绝对值指定行的大小，也可以使用\
  \ `*` 运算符表示大小是相对的，并让 Windows 在应用程序运行时根据屏幕的窗体尺寸和分辨率自行计算行的大小。此示例中使用的值对应于之前图表所示的 Customers\
  \ 表单的头部、正文、间距和底部边距的相对行大小。\n\n**3.** 将包含文本“Adventure Works Customers”的 `TextBlock`\
  \ 控件移动到 `Grid` 中，紧跟在 `</Grid.RowDefinitions>` 标签之后。\n\n**4.** 为 `TextBlock` 控件添加\
  \ `Grid.Row` 属性并将值设置为 `0`。\n\n这表示 `TextBlock` 应该置于 `Grid` 的第一行内（`Grid` 控件从零开始对行和列计数）。\n\
  \n***\n\n![Image](img/Image00005.jpg) 注意\n\n`Grid.Row` 属性是附加属性（attached property）的一个示例。`附加属性`是控件从其所处的容器控件中接收的属性。在网格之外，`TextBlock`\
  \ 没有 `Row` 属性（那是没有意义的），但当置于网格内部时，`Row` 属性被附加到 `TextBlock` 上，`TextBlock` 控件可以为其分配值。`Grid`\
  \ 控件随后使用此值来确定在哪里显示 `TextBlock` 控件。附加属性很容易识别，因为它们具有 `ContainerType.PropertyName`\
  \ 的形式。\n\n***\n\n**5.**  `Margin` 属性，并将 `HorizontalAlignment` 和 `VerticalAlignment`\
  \ 属性设置为 `Center`。\n\n这将使 `TextBlock` 在行中居中。\n\n`Grid` 和 `TextBlock` 控件的 XAML 标记所示（`TextBlock`\
  \ 的更改已加粗）：\n\n点击此处查看代码图像\n\n```xml\n<Grid Margin=\"10,20,10,20\">\n  <Grid.RowDefinitions>\n\
  \    <RowDefinition Height=\"2*\"/>\n    <RowDefinition Height=\"*\"/>\n    <RowDefinition\
  \ Height=\"10*\"/>\n    <RowDefinition Height=\"2*\"/>\n  </Grid.RowDefinitions>\n\
  \  <TextBlock Grid.Row=\"0\" HorizontalAlignment=\"Center\" TextWrapping=\"Wrap\"\
  \ Text=\"Adventure Works Customers\" VerticalAlignment=\"Center\"/>\n  ...\n</Grid>\n\
  ```\n\n**6.** 在 `TextBlock` 控件之后另一个嵌套的 `Grid` 控件。此 `Grid` 将用于布局表单正文中的控件，并应该出现在外部\
  \ `Grid` 的第三行（大小为 `10*` 的行），因此将 `Grid.Row` 属性设置为 `2`，如下代码加粗所示：\n\n点击此处查看代码图像\n\n\
  ```xml\n<Grid Margin=\"10,20,10,20\">\n  <Grid.RowDefinitions>\n    <RowDefinition\
  \ Height=\"2*\"/>\n    <RowDefinition Height=\"*\"/>\n    <RowDefinition Height=\"\
  10*\"/>\n    <RowDefinition Height=\"2*\"/>\n  </Grid.RowDefinitions>\n  <TextBlock\
  \ Grid.Row=\"0\" HorizontalAlignment=\"Center\" TextWrapping=\"Wrap\" Text=\"Adventure\
  \ Works Customers\" VerticalAlignment=\"Center\"/>\n  <Grid Grid.Row=\"2\">\n  </Grid>\n\
  \  ...\n</Grid>\n```\n\n**7.** 为新的 `Grid` 控件添加以下 `<Grid.RowDefinitions>` 和 `<Grid.ColumnDefinitions>`\
  \ 部分：\n\n点击此处查看代码图像\n\n```xml\n<Grid Grid.Row=\"2\">\n  <Grid.RowDefinitions>\n\
  \    <RowDefinition Height=\"*\"/>\n    <RowDefinition Height=\"*\"/>\n    <RowDefinition\
  \ Height=\"2*\"/>\n    <RowDefinition Height=\"*\"/>\n    <RowDefinition Height=\"\
  2*\"/>\n    <RowDefinition Height=\"*\"/>\n    <RowDefinition Height=\"4*\"/>\n\
  \  </Grid.RowDefinitions>\n  <Grid.ColumnDefinitions>\n    <ColumnDefinition Width=\"\
  *\"/>\n    <ColumnDefinition Width=\"*\"/>\n    <ColumnDefinition Width=\"20\"/>\n\
  \    <ColumnDefinition Width=\"*\"/>\n    <ColumnDefinition Width=\"20\"/>\n   \
  \ <ColumnDefinition Width=\"2*\"/>\n    <ColumnDefinition Width=\"20\"/>\n    <ColumnDefinition\
  \ Width=\"2*\"/>\n    <ColumnDefinition Width=\"*\"/>\n  </Grid.ColumnDefinitions>\n\
  </Grid>\n```\n\n这些行和列定义了之前在图中所示描述表单正文结构的每行每列的高度和宽度。在将放置控件的每列之间留有 20 像素的小间距。\n\n\
  **8.** 将显示 ID、标题、姓氏和名字标签的 `TextBlock` 控件移动到嵌套的 `Grid` 控件内部，紧跟在 `</Grid.ColumnDefinitions>`\
  \ 标签之后。\n\n\n\n\n\n## 9. 将每个 `TextBlock` 控件的 `Grid.Row` 属性设置为 `0`（这些标签将出现在网格的第一行）。将\
  \ ID 标签的 `Grid.Column` 属性设置为 `1`，Title 标签的 `Grid.Column` 属性设置为 `3`，First Name 标签的\
  \ `Grid.Column` 属性设置为 `5`，以及 Last Name 标签的 `Grid.Column` 属性设置为 `7`。\n\n## 10. 移除每个\
  \ `TextBlock` 控件的 `Margin` 属性，并将 `HorizontalAlignment` 和 `VerticalAlignment` 属性设置为\
  \ `Center`。这些控件的 XAML 标记应该如下（更改部分已用**粗体**标记）：\n\n点击此处查看代码图片\n\n```xml\n<Grid Grid.Row=\"\
  2\">\n<Grid.RowDefinitions>\n...\n</Grid.RowDefinitions>\n<Grid.ColumnDefinitions>\n\
  ...\n</Grid.ColumnDefinitions>\n<TextBlock Grid.Row=\"0\" Grid.Column=\"1\" HorizontalAlignment=\"\
  Center\"\nTextWrapping=\"Wrap\" Text=\"ID\" VerticalAlignment=\"Center\" FontSize=\"\
  20\"/>\n<TextBlock Grid.Row=\"0\" Grid.Column=\"3\" HorizontalAlignment=\"Center\"\
  \nTextWrapping=\"Wrap\" Text=\"Title\" VerticalAlignment=\"Center\" FontSize=\"\
  20\"/>\n<TextBlock Grid.Row=\"0\" Grid.Column=\"5\" HorizontalAlignment=\"Center\"\
  \nTextWrapping=\"Wrap\" Text=\"First Name\" VerticalAlignment=\"Center \" FontSize=\"\
  20\"/>\n<TextBlock Grid.Row=\"0\" Grid.Column=\"7\" HorizontalAlignment=\"Center\"\
  \nTextWrapping=\"Wrap\" Text=\"Last Name\" VerticalAlignment=\"Center\" FontSize=\"\
  20\"/>\n</Grid>\n```\n\n## 11. 将 `id`, `firstName`, 和 `lastName TextBox` 控件以及 `title\
  \ ComboBox` 控件移动到嵌套的 `Grid` 控件内部，紧随 `Last Name TextBlock` 控件之后。\n\n将这些控件放在 `Grid`\
  \ 控件的第 1 行。将 `id` 控件放在第 1 列，`title` 控件放在第 3 列，`firstName` 控件放在第 5 列，`lastName` 控件放在第\
  \ 7 列。\n\n移除这些每个控件的 `Margin` 属性，并将 `VerticalAlignment` 属性设置为 `Center`。移除 `Width`\
  \ 属性，并将 `HorizontalAlignment` 属性设置为 `Stretch`。这使得控件在显示时占据整个单元格，并且控件会随单元格大小的变化而收缩或扩大。\n\
  \n这些控件完成后的 XAML 标记如下，更改部分已用**粗体**标记：\n\n点击此处查看代码图片\n\n```xml\n<Grid Grid.Row=\"\
  2\">\n<Grid.RowDefinitions>\n...\n</Grid.RowDefinitions>\n<Grid.ColumnDefinitions>\n\
  ...\n</Grid.ColumnDefinitions>\n...\n<TextBlock Grid.Row=\"0\" Grid.Column=\"7\"\
  \ ... Text=\"Last Name\" .../>\n<TextBox Grid.Row=\"1\" Grid.Column=\"1\" x:Name=\"\
  id\" HorizontalAlignment=\"Stretch\"\nTextWrapping=\"Wrap\" Text=\"\" VerticalAlignment=\"\
  Center\" FontSize=\"20\" IsReadOnly=\"True\"/>\n<TextBox Grid.Row=\"1\" Grid.Column=\"\
  5\" x:Name=\"firstName\" HorizontalAlignment=\"Stretch \"\nTextWrapping=\"Wrap\"\
  \ Text=\"\" VerticalAlignment=\"Center\" FontSize=\"20\"/>\n<TextBox Grid.Row=\"\
  1\" Grid.Column=\"7\" x:Name=\"lastName\" HorizontalAlignment=\"Stretch\"\nTextWrapping=\"\
  Wrap\" Text=\"\" VerticalAlignment=\"Center\" FontSize=\"20\"/>\n<ComboBox Grid.Row=\"\
  1\" Grid.Column=\"3\" x:Name=\"title\" HorizontalAlignment=\"Stretch\"\nVerticalAlignment=\"\
  Center\" FontSize=\"20\">\n<ComboBoxItem Content=\"Mr\"/>\n<ComboBoxItem Content=\"\
  Mrs\"/>\n<ComboBoxItem Content=\"Ms\"/>\n<ComboBoxItem Content=\"Miss\"/>\n</ComboBox>\n\
  </Grid>\n```\n\n## 12. 将 Email 标签的 `TextBlock` 控件和 `email TextBox` 控件移动到嵌套的 `Grid`\
  \ 控件中，紧随 `title ComboBox` 控件的结束标签之后。\n\n将这些控件放在 `Grid` 控件的第 3 行。将 Email 标签放在第 1\
  \ 列，`email TextBox` 控件放在第 3 列。此外，将 `email TextBox` 控件的 `Grid.ColumnSpan` 属性设置为 5；这样，该列就可以根据其\
  \ `Width` 属性指定的值跨越五列，如之前的图表所示。\n\n将 Email 标签控件的 `HorizontalAlignment` 属性设置为 `Center`，但将\
  \ `email TextBox` 的 `HorizontalAlignment` 属性设置为 `Left`；该控件应相对于其所跨越的第一列保持左对齐，而不是在所有列中居中。\n\
  \n将 Email 标签和 `email TextBox` 控件的 `VerticalAlignment` 属性均设置为 `Center`。\n\n移除这两个控件的\
  \ `Margin` 属性。\n\n接的 XAML 标记显示这些控件的完成定义：\n\n点击此处查看代码图片\n\n```xml\n<Grid Grid.Row=\"\
  2\">\n<Grid.RowDefinitions>\n...\n</Grid.RowDefinitions>\n<Grid.ColumnDefinitions>\n\
  ...\n</Grid.ColumnDefinitions>\n...\n<ComboBox Grid.Row=\"1\" Grid.Column=\"3\"\
  \ x:Name=\"title\" ...>\n...\n</ComboBox>\n<TextBlock Grid.Row=\"3\" Grid.Column=\"\
  1\" HorizontalAlignment=\"Center\" TextWrapping=\"Wrap\" Text=\"Email\" VerticalAlignment=\"\
  Center\" FontSize=\"20\"/>\n<TextBox Grid.Row=\"3\" Grid.Column=\"3\" x:Name=\"\
  email\" Grid.ColumnSpan=\"5\" HorizontalAlignment=\"Left\"\nTextWrapping=\"Wrap\"\
  \ Text=\"\" VerticalAlignment=\"Center\" FontSize=\"20\" Width=\"200\"/>\n</Grid>\n\
  ```\n\n\n\n\n\n## 20. 在模拟器中，双击表单的顶部边缘将视图还原为窗口，然后拖动并调整窗口大小，使表单显示在屏幕左半部分。将窗口宽度缩小到最小。这就是应用程序在智能手机等设备上可能的样子。\n\
  \n所有控件仍然可见，但 `Phone` 标签的文本和标题会换行，导致它们难以阅读，而且控件也不再特别易于使用了：\n\n![Image](img/Image00197.jpg)\n\
  \n## 21. 在模拟器中，点击 Start（启动）按钮，点击 Settings（设置），点击 Power（电源），然后点击 Disconnect（断）。\n\
  \n模拟器关闭，你返回 Visual Studio。\n\n## 22. 在 Visual Studio 工具栏上，在 Debug Target（调试目标）下拉列表框中，选择\
  \ `Local Machine`。\n\n### 使用视觉视觉状态管理器（Visual State Manager）调整布局\n\n`Customers` 应用的用户界面会根据不同的分辨率和窗因子进行缩放，但如果你缩小视图宽度，它仍然无法良好工作，而且在宽度更窄的手机上可能看起来也不太好。想一下，这些情况下问题的解决方案与其说是缩放控件，不如说是实际上以不同的方式布局它们。例如，如果\
  \ `Customers` 表单在窄视图中看起来像这样，将更有意义：\n\n![Image](img/Image00198.jpg)\n\n你可以通过以下几种方式实现这种效果：\n\
  \n![Image](img/Image00001.jpg) 你可以为每个设备族创建 `MainPage.xaml` 文件的多个版本。这些 XAML 文件中的每一个都可以链接到相同的代码后代码文件（`MainPage.xaml.cs`），以便它们都运行相同的代码。例如，要为手机创建一个\
  \ XAML 文件，向项目添加一个名为 `DeviceFamily-Mobile` 的文件夹（此名称非常重要），然后使用 Add New Item（添加新项）菜单命令向文件夹中添加名为\
  \ `MainPage.xaml` 的新 XAML 视图。按照它们在智能手机上显示的方式在该页面上布局控件。XAML 视图将自动链接到现 `MainPage.xaml.cs`\
  \ 文件。在运行时，UWP 将根据运行应用程序的设备类型选择合适的视图。\n\n![Image](img/Image00001.jpg) 你可以使用 Visual\
  \ State Manager 在运行时修改页面的布局。所有 UWP 应用都实现了一个跟踪应用视觉状态的 Visual State Manager。它可以检测窗口高度和宽度的变化，你可以添加\
  \ XAML 标记，根据窗口的大小对控件进行定位。这些标记可以移动控件，也可以显示和隐藏控件。\n\n![Image](img/Image00001.jpg)\
  \ 你可以使用 Visual State Manager 根据窗口的高度和宽度在视图之间切换。这种方法是此处描述的前两种选项的混合组合，但它是最不混乱的（你不需要编写大量复杂的\
  \ XAML 代码来计算每个控件的最佳位置），而且是最灵活的（如果在同一设备上缩小了窗口，它仍然有效）。\n\n你将在接下来的练习中遵循这些方法中的第三种。第一步是为应该出现在窄视图中的客户数据定义一种布局。\n\
  \n### 为窄视图定义布局\n\n#### 1. 在 Customers 应用的 XAML 格中，为 `Grid` 控件添加下方**加粗**所示的 `x:Name`\
  \ 和 `Visibility` 属性：\n\n点击此处查看代码图像\n\n```xml\n<Grid Background=\"{ThemeResource\
  \ ApplicationPageBackgroundThemeBrush}\">\n\n<Grid x:Name=\"customersTabularView\"\
  \ Margin=\"10,20,10,20\" Visibility=\"Collapsed\" >\n\n...\n\n</Grid>\n\n</Grid>\n\
  ```\n\n此 `Grid` 控件将包含表单的默认视图。你将在本系列练习的后续 XAML 标记中引用此 `Grid` 控件，因此需要给它命名。`Visibility`\
  \ 属性指定控件是显示（`Visible`）还是隐藏（`Collapsed`）。默认值为 `Visible`，但在你定义另一个用于以列格式显示数据的 Grid\
  \ 期间，你将隐藏此 `Grid`。\n\n#### 2. 在 `customersTabularView` Grid 控件的闭合标签 `</Grid>` 之后，添加另一个\
  \ `Grid` 控件。将 `x:Name` 属性设置为 `customersColumnarView`，将 `Margin` 属性设置为 `10,20,10,20`，并将\
  \ `Visibility` 属性设置为 `Visible`。\n\n* * *\n\n![Image](img/Image00013.jpg) 提示\n\n\
  你可以在设计视图窗口的 XAML 格中展开和收起元素，通过点击出现在 XAML 标记左侧边缘的 + 和 – 号，使结构更易读。\n\n* * *\n\n点击此处查看代码图像\n\
  \n```xml\n<Grid Background=\"{ThemeResource ApplicationPageBackgroundThemeBrush}\"\
  >\n\n<Grid x:Name=\"customersTabularView\" Margin=\"10,20,10,20\" Visibility=\"\
  Collapsed\">\n\n...\n\n</Grid>\n\n< Grid x:Name=\"customersColumnarView\" Margin=\"\
  10,20,10,20\" Visibility=\"Visible\">\n\n</Grid>\n\n</Grid>\n```\n\n此 `Grid` 控件将包含表单的“窄”视图。此格中的字段将按之前描述的方式布局。\n\
  \n#### 3. 在 `customersColumnarView` Grid 控件中，添加行：\n\n点击此处查看代码图像\n\n```xml\n<Grid\
  \ x:Name=\"customersColumnarView\" Margin=\"10,20,10,20\" Visibility=\"Visible\"\
  >\n\n<Grid.RowDefinitions>\n\n<RowDefinition=\"\"/>\n\n</Grid.RowDefinitions>\n\
  ```\n\n你将使用第一行显示标题，使用第二行显示输入数据的控件。\n\n#### 4. 在行定义之后，添加下方所示的 `TextBlock` 控件。此控件在\
  \ `Grid` 的第一行显示截断标题 Customers。将 `FontSize` 设置为 30。\n\n点击此处查看代码图像\n\n```xml\n<Grid\
  \ x:Name=\"customersColumnarView\" Margin=\"10,20,10,20\" Visibility=\"Visible\"\
  >\n\n<Grid.RowDefinitions>\n\n...\n\n</Grid.RowDefinitions>\n\n<TextBlock Grid.Row=\"\
  0\" HorizontalAlignment=\"Center\" TextWrapping=\"Wrap\" Text=\"Customers\" VerticalAlignment=\"\
  Center\" FontSize=\"30\"/>\n```\n\n#### 5. 在 Grid 的第 1 行添加另一个 `Grid` 控件，位于包含标题的\
  \ `TextBlock` 控件之后。此 `Grid` 控件将列显示标签和数据输入控件，因此为此 Grid 添加示例所示的行和列定义。\n\n点击此处查看代码图像\n\
  \n```xml\n<TextBlock Grid.Row=\"0\" ... />\n\n<Grid Grid.Row=\"1\">\n\n<Grid.ColumnDefinitions>\n\
  \n<ColumnDefinition/>\n\n<ColumnDefinition/>\n</Grid.ColumnDefinitions>\n\n<Grid.RowDefinitions>\n\
  \n<RowDefinition/>\n\n<RowDefinition/>\n\n<RowDefinition/>\n\n<RowDefinition/>\n\
  \n<RowDefinition/>\n\n<RowDefinition/>\n</Grid.RowDefinitions>\n\n</Grid>\n```\n\
  \n注意，如果一组行或列的高度相同，你不需要指定它们的大小。\n\n#### 6. 从 `customersTabularView` Grid 控件中复制 ID、Title、First\
  \ Name 和 Last Name `TextBlock` 控件的 XAML 标记到新的 `Grid` 控件中，紧接在你刚刚添加的行之后。将 ID 控件放在第\
  \ 0 行，Title 控件放在第 1 行，First Name 控件放在第 2 行，Last Name 控件放在第 3 行。将所有控件放在第 0 列。\n\n\
  点击此处查看代码图像\n\n```xml\n<Grid.RowDefinitions>\n\n...\n\n</Grid.RowDefinitions>\n\n\
  <TextBlock Grid.Row=\"0\" Grid.Column=\"0\" HorizontalAlignment=\"Center\" TextWrapping=\"\
  Wrap\" Text=\"ID\" VerticalAlignment=\"Center\" FontSize=\"20\"/>\n\n<TextBlock\
  \ Grid.Row=\"1\" Grid.Column=\"0\" HorizontalAlignment=\"Center\" TextWrapping=\"\
  Wrap\" Text=\"Title\" VerticalAlignment=\"Center\" FontSize=\"20\"/>\n\n<TextBlock\
  \ Grid.Row=\"2\" Grid.Column=\"0\" HorizontalAlignment=\"Center\" TextWrapping=\"\
  Wrap\" Text=\"First Name\" VerticalAlignment=\"Center\" FontSize=\"20\"/>\n\n<TextBlock\
  \ Grid.Row=\"3\" Grid.Column=\"0\" HorizontalAlignment=\"Center\" TextWrapping=\"\
  Wrap\" Text=\"Last Name\" VerticalAlignment=\"Center\" FontSize=\"20\"/>\n```\n\n\
  \n\n\n\n### 7. 将 `customersTabularView Grid` 控制中 `id`、`title`、`firstName` 和 `lastName\
  \ TextBox` 以及 `ComboBox` 控件的 XAML 标记复制到新的 `Grid` 控制中，紧跟在 `TextBox` 控件之后。将 `id` 控件放在第\
  \ 0 行，`title` 控件放在第 1 行，`firstName` 放在第 2 行，`lastName` 放在第 3 行。将所有四个控件放在第 1 列。同时，通过在名称前加上字母\
  \ `c`（代表 column）来更改控件名称。此最终更改是为了避免与 `customersTabularView Grid` 控制中的现有控件名称冲突。\n\n\
  点击此处查看代码图像\n\n```xml\n<TextBlock Grid.Row=\"3\" Grid.Column=\"0\" HorizontalAlignment=\"\
  Center\" TextWrapping=\"Wrap\" Text=\"Last Name\" .../>\n<TextBox Grid.Row=\"0\"\
  \ Grid.Column=\"1\" x:Name=\"cId\" HorizontalAlignment=\"Stretch\" TextWrapping=\"\
  Wrap\" Text=\"\" VerticalAlignment=\"Center\" FontSize=\"20\" IsReadOnly=\"True\"\
  />\n<TextBox Grid.Row=\"2\" Grid.Column=\"1\" x:Name=\"cFirstName\" HorizontalAlignment=\"\
  Stretch\" TextWrapping=\"Wrap\" Text=\"\" VerticalAlignment=\"Center\" FontSize=\"\
  20\"/>\n<TextBox Grid.Row=\"3\" Grid.Column=\"1\" x:Name=\"cLastName\" HorizontalAlignment=\"\
  Stretch\" TextWrapping=\"Wrap\" Text=\"\" VerticalAlignment=\"Center\" FontSize=\"\
  20\"/>\n<ComboBox Grid.Row=\"1\" Grid.Column=\"1\" x:Name=\"cTitle\" HorizontalAlignment=\"\
  Stretch\" VerticalAlignment=\"Center\" FontSize=\"20\">\n    <ComboBoxItem Content=\"\
  Mr\"/>\n    <ComboBoxItem Content=\"Mrs\"/>\n    <ComboBoxItem Content=\"Ms\"/>\n\
  \    <ComboBoxItem Content=\"Miss\"/>\n</ComboBox>\n```\n\n### 8. 将 `customersTabularView\
  \ Grid` 控制中电子邮件和电话号码的 `TextBlock` 和 `TextBox` 控件复制到新的 `Grid` 控制中，放在 `cTitle ComboBox`\
  \ 控件之后。将 `TextBlock` 控件放在第 0 列的第 4 和第 5 行，将 `TextBox` 控件放在第 1 列的第 4 和第 5 行。将 `email\
  \ TextBox` 控件的名称更改为 `cEmail`，`phone TextBox` 控件的名称更改为 `cPhone`。删除 `cEmail` 和 `cPhone`\
  \ 控件的 `Width` 属性，并将它们的 `HorizontalAlignment` 属性设置为 `Stretch`。\n\n点击此处查看代码图像\n\n\
  ```xml\n<ComboBox ...>\n...\n</ComboBox>\n<TextBlock Grid.Row=\"4\" Grid.Column=\"\
  0\" HorizontalAlignment=\"Center\" TextWrapping=\"Wrap\" Text=\"Email\" VerticalAlignment=\"\
  Center\" FontSize=\"20\"/>\n<TextBox Grid.Row=\"4\" Grid.Column=\"1\" x:Name=\"\
  cEmail\" HorizontalAlignment=\"Stretch\" TextWrapping=\"Wrap\" Text=\"\" VerticalAlignment=\"\
  Center\" FontSize=\"20\"/>\n<TextBlock Grid.Row=\"5\" Grid.Column=\"0\" HorizontalAlignment=\"\
  Center\" TextWrapping=\"Wrap\" Text=\"Phone\" VerticalAlignment=\"Center\" FontSize=\"\
  20\"/>\n<TextBox Grid.Row=\"5\" Grid.Column=\"1\" x:Name=\"cPhone\" HorizontalAlignment=\"\
  Stretch\" TextWrapping=\"Wrap\" Text=\"\" VerticalAlignment=\"Center\" FontSize=\"\
  20\"/>\n```\n\n设计视图窗口应该显示如下的列式布局：\n\n![图像](img/Image00199.jpg)\n\n### 9. 返回 `customersTabularView\
  \ Grid` 控件的 XAML 标记，并将 `Visibility` 属性设置为 `Visible`。\n\n点击此处查看代码图像\n\n```xml\n<Grid\
  \ x:Name=\"customersTabularView\" Margin=\"10,20,10,20\" Visibility=\"Visible\"\
  \ >\n```\n\n### 10. 在 `customersColumnarView Grid` 控制的 XAML 标记中，将 `Visibility` 属性设置为\
  \ `Collapsed`。\n\n点击此处查看代码图像\n\n```xml\n<Grid x:Name=\"customersColumnarView\" Margin=\"\
  10,20,10,20\" Visibility=\"Collapsed\" >\n```\n\n设计视图窗口应该显示 Customers 表单原始的表格状布局。这是应用程序将使用的默认视图。\n\
  \n你现在已经定义了在窄视图下显示的布局。你可能担心，本质上你只是复制了许多控件并以不同的方式排列了它们。如果你运行表单并在视图之间切换，一个视图中的数据将如何传输到另一个视图中？例如，如果在应用程序在全屏运行时输入了客户详情，然后切换到窄视图，新显示的控件将不会包含你刚刚输入的数据。UWP\
  \ 应用通过使用 `data binding`（数据绑定）来解决这个问题。这种技术允许你将同一份数据关联到多个控件，随着数据的更改，所有控件都会显示更新后的信息。你将在第\
  \ 26 章中看到它是如何工作的。目前，你只需要考虑如何使用 Visual State Manager（视觉状态管理器）在视图更改时切换布局。\n\n你可以使用触发器（triggers），当显示的某些方面（如高度或宽度）发生时提醒\
  \ Visual State Manager。你可以在应用程序的 XAML 标记中定义由触发器执行的视觉状态转换。这就是你在下一个练习中要做的操作。\n\n##\
  \ 使用 Visual State Manager 修改布局\n\n### 1. 在 Customers 应用程序的 XAML 格中，在 `customersColumnarView\
  \ Grid` 控件的结束标记 `</Grid>` 之后，添加以下标记：\n\n点击此处查看代码图像\n\n```xml\n<Grid x:Name=\"customersColumnarView\"\
  \ Margin=\"10,20,10,20\" Visibility=\"Visible\">\n...\n</Grid>\n<VisualStateManager.VisualStateGroups>\n\
  \    <VisualStateGroup>\n        <VisualState x:Name=\"TabularLayout\">\n      \
  \  </VisualState>\n    </VisualStateGroup>\n</VisualStateManager.VisualStateGroups>\n\
  ```\n\n你通过实现一个或多个视觉状态组来定义视觉状态转换。每个视觉状态组指定 Visual State Manager 切换到此状态时应发生的转换。每个状态都应该赋予一个有意义的名称，以帮助识别其用途。\n\
  \n### 2. 在视觉状态中添加加粗显示的视觉状态触发器：\n\n点击此处查看代码图像\n\n```xml\n<VisualStateManager.VisualStateGroups>\n\
  \    <VisualStateGroup>\n        <VisualState x:Name=\"TabularLayout\">\n      \
  \      <VisualState.Triggers>\n                <AdaptiveTrigger MinWindowWidth=\"\
  660\"/>\n            </VisualState.Triggers>\n        </VisualState>\n    </VisualStateGroup>\n\
  </VisualStateManager.VisualStateGroups>\n```\n\n此触发器会在窗口宽度低于 660 像素时触发。在该宽度，Customers\
  \ 表上的控件和标签开始换行并变得难以使用。\n\n### 3. 在触发器定义之后，向 XAML 标记添加加粗显示的代码：\n\n点击此处查看代码图像\n\n\
  ```xml\n<VisualStateManager.VisualStateGroups>\n    <VisualStateGroup>\n       \
  \ <VisualState x:Name=\"TabularLayout\">\n            <VisualState.Triggers>\n \
  \               <AdaptiveTrigger MinWindowWidth=\"660\"/>\n            </VisualState.Triggers>\n\
  \            <VisualState.Setters>\n                <Setter Target=\"customersTabularView.Visibility\"\
  \ Value=\"Visible\"/>\n                <Setter Target=\"customersColumnarView.Visibility\"\
  \ Value=\"Collapsed\"/>\n            </VisualState.Setters>\n        </VisualState>\n\
  \    </VisualStateGroup>\n</VisualStateManager.VisualStateGroups>\n```\n\n此代码指定了触发器触发时发生的操作。在示例中，操作是通过使用\
  \ `Setter` 元素定义的。`Setter` 元素指定了要设置的属性以及要设置的值。对于此视图，`Setter` 命令更改指定属性的值；`customersTabularView\
  \ Grid` 控件可见，`customersColumnarView Grid` 控件折叠（隐藏）。\n\n### 4. 在 `TabularLayout`\
  \ 视觉状态定义之后，添加加粗显示的以下标记，它定义了窄视图等等的功能：\n\n点击此处查看代码图像\n\n```xml\n<VisualStateManager.VisualStateGroups>\n\
  \    <VisualStateGroup>\n        <VisualState x:Name=\"TabularLayout\">\n      \
  \      ...\n        </VisualState>\n        <VisualState x:Name=\"ColumnarLayout\"\
  >\n            <VisualState.Triggers>\n                <AdaptiveTrigger MinWindowWidth=\"\
  0\"/>\n            </VisualState.Triggers>\n            <VisualState.Setters>\n\
  \                <Setter Target=\"customersTabularView.Visibility\" Value=\"Collapsed\"\
  />\n                <Setter Target=\"customersColumnarView.Visibility\" Value=\"\
  Visible\"/>\n            </VisualState.Setters>\n        </VisualState>\n    </VisualStateGroup>\n\
  </VisualStateManager.VisualStateGroups>\n```\n\n\n\n\n\n```xml\n</VisualState.Setters>\n\
  </VisualState>\n</VisualStateGroup>\n</VisualStateManager.VisualStateGroups>\n```\n\
  \n当窗口宽度低于 660 像素时，将发生此转换。应用程序切换到 `ColumnarLayout` 状态；`customersTabularView Grid`\
  \ 控件被折叠，`customersColumnarView Grid` 控件变为可见。\n\n**5.** 在 `Debug` 菜单上，点击 `Start Debugging`。\n\
  \n应用启动并全屏显示 Customer 表单。数据使用表格布局进行显示。\n\n***\n\n![Image](img/Image00005.jpg) 注意事项\n\
  \n如果您使用的显示器分辨率低于 1366 × 768，请按照前面的说明在 `Simulator` 中启动运行应用。将 `Simulator` 的分辨率配置为\
  \ 1366 × 768。\n\n***\n\n**6.** 调整 Customer 应用窗口的大小，以在窄屏视图中显示表单。当窗口宽度低于 660 像素时，显示器将切换到列布局。\n\
  \n**7.** 调整 Customer 应用窗口的大小，使其宽度大于 660 像素（或将其最大化为全屏）。\n\nCustomer 表单恢复为表格布局。\n\n\
  **8.** 返回 `Visual Studio` 并停止调试。\n\n### 为 UI 应用样式\n\n现在你已经解决了应用程序基本布局的机制，下一步是应用某些样式以使\
  \ UI 看起来更具吸引力。UWP 应用中的控件具有多种属性，你可以使用这些属性来更改元素的字体、颜色、大小和其他属性等特征。你可以为每个控件单独设置这些属性，但如果你需要对多个控件应用相同的样式，这种方法可能会变得繁琐且重复。此外，最佳的应用程序会在整个\
  \ UI 上应用一致的样式，如果你在添加或更改控件时必须反复设置相同的属性和值，那么就很难保持一致性。你必须执行相同事情的次数越多，至少出错一次的概率就越大！\n\
  \n在 UWP 应用中，你可以定义可重用的样式。你可以通过创建 `resource dictionary`（资源字典）将它们实现为范围资源，这样它们对应用中所有页的所有控件都可用。你也可以在该页面的\
  \ XAML 标记中定义仅适用于单个页面的本地资源。在接下来的练习中，你将为 Customers 应用定义一些简单的样式，并将这些样式应用到 Customers\
  \ 表单的控件上。\n\n#### 为 Customers 表单定义样式\n\n**1.** 在 `Solution Explorer` 中，右键点击 `Customers`\
  \ 项目，指向到 `Add`，然后点击 `New Item`。\n\n**2.** 在 `Add New Item – Customers` 对话框中，点击 `Resource\
  \ Dictionary`。在 `Name` 框中输入 `AppStyles.xaml`，然后点击 `Add`。\n\n`AppStyles.xaml` 文件出现在\
  \ `Code and Text Editor` 窗口中。`resource dictionary` 是一个包含应用程序可以使用的资源的 XAML 文件。`AppStyles.xaml`\
  \ 文件看起来如下：\n\n点击此处查看代码图像\n\n```xml\n<ResourceDictionary\nxmlns=\"http://schemas.microsoft.com/winfx/2006/xaml/presentation\"\
  \nxmlns:x=\"http://schemas.microsoft.com/winfx/2006/xaml\"\nxmlns:local=\"using:Customers\"\
  >\n</ResourceDictionary>\n```\n\n样式是资源的一个示例，但你也可以添加其他项目。事实上，你将添加的第一个资源实际上不是样式，而是一个\
  \ `ImageBrush`，它将用于绘制 Customers 表单上外层 `Grid` 控件的背景。\n\n**3.** 在 `Solution Explorer`\
  \ 中，右键点击 `Customers` 项目，指向到 `Add`，然后点击 `New Folder`。将新文件夹重命名为 `Images`。\n\n**4.**\
  \ 右键点击 `Images` 文件夹，指向到 `Add`，然后点击 `Existing Item`。\n\n**5.** 在 `Add Existing Item\
  \ – Customers` 对话框中，浏览到文档文件夹中的 `\\Microsoft Press\\VCSBS\\Chapter 25\\Resources`\
  \ 文件夹，点击 `wood.jpg`，然后点击 `Add`。\n\n`wood.jpg` 文件被添加到 `Customers` 项目的 `Images` 文件夹中。该文件包含一张雅美的木纹图像，你将其用于\
  \ Customers 表单。\n\n**6.** 在显示 `AppStyles.xaml` 文件的 `Code and Text Editor` 窗口中，添加如下加粗所示\
  \ XAML 标记：\n\n点击此处查看代码图像\n\n```xml\n<ResourceDictionary\nxmlns=\"http://schemas.microsoft.com/winfx/2006/xaml/presentation\"\
  \nxmlns:x=\"http://schemas.microsoft.com/winfx/2006/xaml\"\nxmlns:local=\"using:Customers\"\
  >\n<ImageBrush x:Key=\"WoodBrush\" ImageSource=\"Images/wood.jpg\"/>\n</ResourceDictionary>\n\
  ```\n\n此标记创建了一个基于 `wood.jpg` 文件的名为 `WoodBrush` 的图像资源。你可以使用此画刷设置控件的背景，它将显示 `wood.jpg`\
  \ 文件中的图像。\n\n**7.** 在 `ImageBrush` 资源下方，向 `AppStyles.xaml` 文件中添加如下加粗所示的样式：\n\n点击此处查看代码图像\n\
  \n```xml\n<ResourceDictionary ...>\n<ImageBrush x:Key=\"WoodBrush\" ImageSource=\"\
  Images/wood.jpg\"/>\n<Style x:Key=\"GridStyle\" TargetType=\"Grid\">\n<Setter Property=\"\
  Background\" Value=\"{StaticResource WoodBrush}\"/>\n</Style>\n</ResourceDictionary>\n\
  ```\n\n此标记显示了如何定义样式。`Style` 元素应该有一个名称（键，以便在其他地方引用），并且应该指定样式可以应用的控件类型。你将此样式用于 `Grid`\
  \ 控件。样式的主体由一个或多个 `Setter` 元素组成。在此示例中，`Background` 属性设置为 `WoodBrush` 资源。\n\n**8.**\
  \ 在使用此样式之前，你必须通过对 `AppStyles.xaml` 的引用来更新 `App.xaml` 中的全局资源字典。在 `Solution Explorer`\
  \ 中，双击 `App.xaml` 以在 `Code and Editor` 窗口中显示它。`App.xaml` 文件看起来如下：\n\n点击此处查看代码图像\n\
  \n```xml\n<Application\nx:Class=\"Customers.App\"\nxmlns=\"http://schemas.microsoft.com/winfx/2006/xaml/presentation\"\
  \nxmlns:x=\"http://schemas.microsoft.com/winfx/2006/xaml\"\nxmlns:local=\"using:Customers\"\
  \nRequestedTheme=\"Light\">\n</Application>\n```\n\n目前，`App.xaml` 文件仅定义了应用对象并引入了几个命名空间；全局资源字典是空的。\n\
  \n**9.** 在 `App.xaml` 文件中添加此处的代码：\n\n点击此处查看代码图像\n\n```xml\n<Application\nx:Class=\"\
  Customers.App\"\nxmlns=\"http://schemas.microsoft.com/winfx/2006/xaml/presentation\"\
  \nxmlns:x=\"http://schemas.microsoft.com/winfx/2006/xaml\"\nxmlns:local=\"using:Customers\"\
  \nRequestedTheme=\"Light\">\n<Application.Resources>\n<ResourceDictionary>\n<ResourceDictionary.MergedDictionaries>\n\
  <ResourceDictionary Source=\"AppStyles.xaml\"/>\n</ResourceDictionary.MergedDictionaries>\n\
  </ResourceDictionary>\n</Application.Resources>\n</Application>\n```\n\n此标记将 `AppStyles.xaml`\
  \ 中定义的资源添加到全局资源字典可用的资源列表中。这些资源现在整个应用程序中都可用。\n\n**10.** 切换到显示 Customers 表单 UI 的 `MainPage.xaml`\
  \ 文件。在 XAML 格中，找到最外层的 `Grid` 控件：\n\n点击此处查看代码图像\n\n```xml\n<Grid Background=\"{ThemeResource\
  \ ApplicationPageBackgroundThemeBrush}\">\n```\n\n在该控件的 XAML 标记中，将 `Background`\
  \ 属性替换为引用 `GridStyle` 样式的 `Style` 属性，如下所示代码中加粗所示：\n\n点击此处查看代码图像\n\n```xml\n<Grid\
  \ Style=\"{StaticResource GridStyle}\" >\n```\n\n\n\n\n设计视图（Design View）窗口中 `Grid`\
  \ 控件的背景应该切换并显示木质面板，如下：\n\n![Image](img/Image00200.jpg)\n\n![Image](img/Image00005.jpg)\
  \ 注意\n\n理想情况下，您应该确保应用于页面或控件的任何背景图像在设备形状因子和方向发生变化时都能保持其美学效果。在 30 英寸显示器上看起来酷的图像在 Windows\
  \ 手机上可能会显得失真和压缩。可能需要为不同的视图和方向提供备用背景，并使用视觉状态管理器（Visual State Manager）修改控件的 `Background`\
  \ 属性，以便在视觉状态更改时进行切换。\n\n### 11. 返回代码和文本编辑器窗口中的 AppStyles.xaml\n在 `GridStyle` 样式之后添加以下\
  \ `FontStyle` 样式：\n\n点击此处查看代码图像\n\n```xml\n<Style x:Key=\"GridStyle\" TargetType=\"\
  Grid\">\n...\n</Style>\n\n<Style x:Key=\"FontStyle\" TargetType=\"TextBlock\">\n\
  <Setter Property=\"FontFamily\" Value=\"Segoe Print\"/>\n</Style>\n```\n\n此样式应用于\
  \ `TextBlock` 元素并将字体更改为 `Segoe Print`。这种字体类似于手写体。\n\n在现阶段，可以在每个需要此字体的 `TextBlock`\
  \ 控件中引用 `FontStyle` 样式，但这种方法与直接在每个控件的标记中设置 `FontFamily` 相比并不会提供任何优势。样式的真正威力体现在您组合多个属性时，正如在接下来的几个步骤中看到的那样。\n\
  \n点击此处查看代码图像\n\n在 AppStyles.xaml 文件中添加所示的 `HeaderStyle` 样式：\n\n```xml\n<Style x:Key=\"\
  FontStyle\" TargetType=\"TextBlock\">\n...\n</Style>\n\n<Style x:Key=\"HeaderStyle\"\
  \ TargetType=\"TextBlock\" BasedOn=\"{StaticResource FontStyle}\">\n<Setter Property=\"\
  HorizontalAlignment\" Value=\"Center\"/>\n<Setter Property=\"TextWrapping\" Value=\"\
  Wrap\"/>\n<Setter Property=\"VerticalAlignment\" Value=\"Center\"/>\n<Setter Property=\"\
  Foreground\" Value=\"SteelBlue\"/>\n</Style>\n```\n\n这是一个复合样式，设置了 `TextBlock` 的\
  \ `HorizontalAlignment`、`TextWrapping`、`VerticalAlignment` 和 `Foreground` 属性。此外，`HeaderStyle`\
  \ 样式通过 `BasedOn` 属性引用了 `FontStyle` 样式。`BasedOn` 属性提供了简单的样式继承形式。\n\n您将使用此样式来格式化出现在\
  \ `tabularView` 和 `columnView` 控件顶部的标签。然而，这些标题的字体大小不同（表格布局的标题比列布局的大），因此您将创建两个扩展\
  \ `HeaderStyle` 样式的。\n\n### 12. 向 AppStyles.xaml 文件添加以下样式\n\n点击此处查看代码图像\n\n```xml\n\
  <Style x:Key=\"HeaderStyle\" TargetType=\"TextBlock\" BasedOn=\"{StaticResource\
  \ FontStyle}\">\n...\n</Style>\n\n<Style x:Key=\"TabularHeaderStyle\" TargetType=\"\
  TextBlock\" BasedOn=\"{StaticResource HeaderStyle}\">\n<Setter Property=\"FontSize\"\
  \ Value=\"40\"/>\n</Style>\n\n<Style x:Key=\"ColumnarHeaderStyle\" TargetType=\"\
  TextBlock\" BasedOn=\"{StaticResource HeaderStyle}\">\n<Setter Property=\"FontSize\"\
  \ Value=\"30\"/>\n</Style>\n```\n\n注意，这些样式的字体大小比 `Grid` 控件中使用的字体略小。这是因为 Segoe Print\
  \ 字体比默认字体大。\n\n### 13. 切回 MainPage.xaml 文件\n找到 `tabularView Grid` 控件中 Adventure\
  \ Works Customers 标签的 `TextBlock` 控件 XAML 标记：\n\n点击此处查看代码图像\n\n```xml\n<TextBlock\
  \ Grid.Row=\"0\" HorizontalAlignment=\"Center\" TextWrapping=\"Wrap\" Text=\"Adventure\
  \ Works Customers\" VerticalAlignment=\"Center\" FontSize=\"50\"/>\n```\n\n### 14.\
  \ 修改此控件的属性\n引用 `TabularHeaderStyle` 样式，如下代码所示：\n\n点击此处查看代码图像\n\n```xml\n<TextBlock\
  \ Grid.Row=\"0\" Style=\"{StaticResource TabularHeaderStyle}\" Text=\"Adventure\
  \ Works Customers\"/>\n```\n\n设计视图中显示的标题应该改变颜色、大小和字体，看起来如下：\n\n![Image](img/Image00201.jpg)\n\
  \n### 15. 找到 `columnView Grid` 控件中 Customers 标签的 `TextBlock` 控件 XAML 标记：\n\n点击此处查看代码图像\n\
  \n```xml\n<TextBlock Grid.Row=\"0\" HorizontalAlignment=\"Center\" TextWrapping=\"\
  Wrap\" Text=\"Customers\" VerticalAlignment=\"Center\" FontSize=\"30\"/>\n```\n\n\
  修改此控件的标记以引用 `ColumnarHeaderStyle` 样式，如下：\n\n点击此处查看代码图像\n\n```xml\n<TextBlock Grid.Row=\"\
  0\" Style=\"{StaticResource ColumnarHeaderStyle}\" Text=\"Customers\"/>\n```\n\n\
  注意，您不会在设计视图中看到此更改，因为 `columnView Grid` 控件默认是折叠的。但在稍后运行应用程序时，您将看到此更改的效果。\n\n### 16.\
  \ 返回 AppStyles.xaml 文件\n使用后续示例所示的额外属性 `Setter` 元素修改 `HeaderStyle` 样式：\n\n点击此处查看代码图像\n\
  \n```xml\n<Style x:Key=\"HeaderStyle\" TargetType=\"TextBlock\" BasedOn=\"{StaticResource\
  \ FontStyle}\">\n<Setter Property=\"HorizontalAlignment\" Value=\"Center\"/>\n<Setter\
  \ Property=\"TextWrapping\" Value=\"Wrap\"/>\n<Setter Property=\"VerticalAlignment\"\
  \ Value=\"Center\"/>\n<Setter Property=\"Foreground\" Value=\"SteelBlue\"/>\n<Setter\
  \ Property=\"RenderTransformOrigin\" Value=\"0.5,0.5\"/>\n<Setter Property=\"RenderTransform\"\
  >\n<Setter.Value>\n<CompositeTransform Rotation=\"-5\"/>\n</Setter.Value>\n</Setter>\n\
  </Style>\n```\n\n这些元素通过变换将标题中的文字绕其中心点旋转 5 度。\n\n![Image](img/Image00005.jpg) 注意\n\
  \n此示例显示了一个简单的变换。使用 `RenderTransform` 属性，您可以对项目执行多种其他变换，并组合多个变换。例如，您可以在 x 轴和 y 轴上移动项目、倾斜（使其倾斜）以及缩放元素。\n\
  \n您还应该注意到 `RenderTransform` 属性的值本身是另一个属性/值对（属性为 `Rotation`，值为 –5）。在这种情况下，您通过使用 `<Setter.Value>`\
  \ 标签指定值。\n\n### 17. 切换到 MainPage.xaml 文件\n在设计视图中，标题现在应该以一个倾斜的角度显示：\n\n![Image](img/Image00202.jpg)\n\
  \n### 18. 在 AppStyles.xaml 文件中，添加以下样式\n\n点击此处查看代码图像\n\n```xml\n<Style x:Key=\"LabelStyle\"\
  \ TargetType=\"TextBlock\" BasedOn=\"{StaticResource FontStyle}\">\n<Setter Property=\"\
  FontSize\" Value=\"30\"/>\n<Setter Property=\"HorizontalAlignment\" Value=\"Center\"\
  />\n<Setter Property=\"TextWrapping\" Value=\"Wrap\"/>\n<Setter Property=\"VerticalAlignment\"\
  \ Value=\"Center\"/>\n<Setter Property=\"Foreground\" Value=\"AntiqueWhite\"/>\n\
  </Style>\n```\n\n您将此样式应用于为各种 `TextBox` 和 `ComboBox` 控件提供标签的 `TextBlock` 元素。该样式引用了与标题相同的字体样式，但将其他属性设置为更适合标签的值。\n\
  \n### 19. 返回 MainPage.xaml 文件\n在 XAML 窗格中，修改 `tabularView` 和 `columnView Grid` 控件中每个标签的\
  \ `TextBlock` 控件标记。移除 `HorizontalAlignment`、`TextWrapping`、`VerticalAlignment` 和\
  \ `FontSize` 属性，并引用 `LabelStyle` 样式，如下所示：\n\n点击此处查看代码图像\n\n\n\n\n```xml\n<Grid x:Name=\"\
  customersTabularView\" Margin=\"10,20,10,20\" Visibility=\"Visible\">\n...\n<Grid\
  \ Grid.Row=\"2\">\n...\n<TextBlock Grid.Row=\"0\" Grid.Column=\"1\" Style=\"{StaticResource\
  \ LabelStyle}\" Text=\"ID\"/>\n<TextBlock Grid.Row=\"0\" Grid.Column=\"3\" Style=\"\
  {StaticResource LabelStyle}\" Text=\"Title\"/>\n<TextBlock Grid.Row=\"0\" Grid.Column=\"\
  5\" Style=\"{StaticResource LabelStyle}\" Text=\"First Name\"/>\n<TextBlock Grid.Row=\"\
  0\" Grid.Column=\"7\" Style=\"{StaticResource LabelStyle}\" Text=\"Last Name\"/>\n\
  ...\n<TextBlock Grid.Row=\"3\" Grid.Column=\"1\" Style=\"{StaticResource LabelStyle}\"\
  \ Text=\"Email\"/>\n...\n<TextBlock Grid.Row=\"5\" Grid.Column=\"1\" Style=\"{StaticResource\
  \ LabelStyle}\" Text=\"Phone\"/>\n...\n</Grid>\n</Grid>\n\n<Grid x:Name=\"customersColumnarView\"\
  \ Margin=\"10,20,10,20\" Visibility=\"Collapsed\">\n...\n<Grid Grid.Row=\"1\">\n\
  ...\n<TextBlock Grid.Row=\"0\" Grid.Column=\"0\" Style=\"{StaticResource LabelStyle}\"\
  \ Text=\"ID\"/>\n<TextBlock Grid.Row=\"1\" Grid.Column=\"0\" Style=\"{StaticResource\
  \ LabelStyle}\" Text=\"Title\"/>\n<TextBlock Grid.Row=\"2\" Grid.Column=\"0\" Style=\"\
  {StaticResource LabelStyle}\" Text=\"First Name\"/>\n<TextBlock Grid.Row=\"3\" Grid.Column=\"\
  0\" Style=\"{StaticResource LabelStyle}\" Text=\"Last Name\"/>\n...\n<TextBlock\
  \ Grid.Row=\"4\" Grid.Column=\"0\" Style=\"{StaticResource LabelStyle}\" Text=\"\
  Email\"/>\n...\n<TextBlock Grid.Row=\"5\" Grid.Column=\"0\" Style=\"{StaticResource\
  \ LabelStyle}\" Text=\"Phone\"/>\n...\n</Grid>\n</Grid>\n```\n\n表单上的标签应更改为 `Segoe\
  \ Print` 字体并显示为白色，字体大小为 30 点：\n\n![Image](img/Image00203.jpg)\n\n**20.** 在“调试”菜单上，点击“启动调试”以生成并运行应用程序。\n\
  \n***\n\n![Image](img/Image00005.jpg) 注意\n\n如果你在分辨率低于 1366 × 768 的显示上运行，请使用模拟器。\n\
  \n***\n\n客户表单应该出现，并且样式与它在 Visual Studio 设计视图窗口中显示的样式一致。请注意，如果你在表单的各种字段中输入任何文本，它们将使用\
  \ `TextBox` 控件的默认字体和样式。\n\n***\n\n![Image](img/Image00005.jpg) 注意\n\n尽管 `Segoe Print`\
  \ 字体适用于标签和标题，但不建议将其作为数据输入字段的字体，因为某些字符很难相互区分。例如，小写字母 `l` 与数字 1 非常相似，而大写字母 `O` 几乎无法与数字\
  \ 0 区分。因此，坚持使用 `TextBox` 控件的默认字体是有意义的。\n\n***\n\n**21.** 调整窗口使其变窄，并验证样式已应用到 `customersColumnarView`\
  \ 网格中的控件上。表单看起来应该是这样的：\n\n![Image](img/Image00204.jpg)\n\n**22.** 返回到 Visual Studio\
  \ 并停止调试。\n\n为了完整起见，下面的图片显示了客户应用程序在 Windows Phone 10 模拟器上运行：\n\n![Image](img/Image00205.jpg)\n\
  \n你可以看到，通过使用样式，你可以轻松实现许多非常酷的效果。此外，仔细使用样式使得你的代码比在单个控件上设置属性要更具可维护性。例如，如果你想切换客户应用程序中标签和标题使用的字体，只需对样式进行更改。通常情况下，尽可能使用样式；除了有助于可维护性外，样式的使用还能让你的\
  \ XAML 代码更加整洁，表单的 XAML 只需要指定控件及其外观。你还可以使用 Blend 来定义复杂的样式，并将这些样式提供给开发应用程序的开发者。开发者只需要为界面引用相应的样式。\n\
  \n## 总结\n\n在本章中，你学习了如何使用 `Grid` 控件来实现适应不同设备尺寸和方向的用户界面。你还学习了如何使用视觉状态管理器在用户更改窗口大时调整控件的布局。最后，你学习了如何创建自定义样式并应用于控件。现在你已经定义了用户界面，下一个挑战是为应用程序添加功能，使用户显示并更新数据，这将在最后的章节中完成。\n\
  \n![Image](img/Image00001.jpg) 如果你想继续下一章节，请保持 Visual Studio 2015 运行并转到第 26 章。\n\n\
  ![Image](img/Image00001.jpg) 如果你现在退出 Visual Studio 2015，请保存。\n\n## 快速参考\n\n![Image](img/Image206.jpg)\n\
  \n## 第 26 章 在通用应用程序中显示和搜索数据\n\n完成本章后，你能够：\n\n![Image](img/Image00001.jpg) 解释如何使用\
  \ Model-View-ViewModel 模式来实现通用应用程序的逻辑。\n\n![Image](img/Image00001.jpg) 使用数据绑定在视图中显示和修改数据。\n\
  \n![Image](img/Image00001.jpg) 创建可以让视图与模型交互的 ViewModel。\n\n![Image](img/Image00001.jpg)\
  \ 将通用应用程序与 Cortana 集成以提供语音搜索。\n\n### 实现 Model-View-ViewModel 模式\n\n良好的图形化应用程序将用户界面设计与应用程序使用的数据以及组成应用程序功能的业务逻辑分离。这种分离有助于消除各个组件之间的依赖关系，能够在不更改业务逻辑或底层数据模型的情况下实现数据的不同呈现方式。这种方法还为具有相应专业技能的人设计和实现不同元素扫清了道路。例如，图形艺术家可以专注于设计吸引人且直观的\
  \ UI，数据库专家可以专注于实现用于存储和访问数据的优化数据结构，而 C# 开发者可以将她的精力投入到实现业务逻辑中。\n\n\n\n\n\n认为最流行的方法是遵循\
  \ Model-View-ViewModel (MVVM) 设计模式。在这种设计模式中，模型（Model）提供应用程序使用的数据，视图（View）代表数据在 UI\
  \ 中的显示方式。ViewModel 包含了连接两者的逻辑，它接收用户输入并将其转换为对模型执行业务操作的命令，同时从模型获取数据并按视图期望的方式进行格式化。下面的图显示了\
  \ MVVM 模式元素之间的简化关系。请注意，应用程序可能会为同一份数据提供多个视图。例如，在 UWP 应用中，你可能实现不同的视图状态，通过不同的屏幕布局来呈现信息。ViewModel\
  \ 的工作之一是确保来自相同模型的数据可以被许多不同的视图显示和操作。在 UWP 应用中，视图可以使用数据绑定来连接到 ViewModel 显示的数据。此外，视图可以通过调用\
  \ ViewModel 实现的命令，请求 ViewModel 更新模型中的数据或执行业务任务。\n\n![Image](img/Image00207.jpg)\n\
  \n## 使用数据绑定显示数据\n\n在开始为 Customers 应用程序实现 ViewModel 之前，进一步了解数据绑定以及如何应用此技术在 UI 中显示数据将会有帮助。使用数据绑定，你可以将控件的属性链接到对象的属性；如果对象的指定属性值发生变化，链接到该对象的控件属性也会随之发生变化。此外，数据绑定可以是双向的：如果使用数据绑定的控件属性值发生变化，该修改将传播到控件所链接的对象上。下面的练习简要介绍了如何使用数据绑定来显示数据。它基于第\
  \ 25 章中的 Customers 应用程序。\n\n### 使用数据绑定显示客户信息\n\n1. 如果 Visual Studio 2015 尚未运行，请启动它。\n\
  \n2. 打开 Customers 项目，该项目位于你文档文件夹中的 `\\Microsoft Press\\VCSBS\\Chapter 26\\Data Binding`\
  \ 文件夹。这是在第 25 章中开发的 Customers 应用程序版本，但 UI 布局经过微调——控件显示在蓝色背景上，使它们更容易突出。\n\n![Image](img/Image00005.jpg)\
  \ 注意\n\n蓝色背景是通过使用 `Rectangle` 控件创建的，该控件与显示标题和数据的 `TextBlock` 以及 `TextBox` 控件跨相同的行和列。该矩形使用\
  \ `LinearGradientBrush` 填充，该画刷逐渐将矩形的颜色从顶部的中蓝色变为底部的极深蓝色。显示在 `customersTabularView\
  \ Grid` 控件视图中的 `Rectangle` 控件的 XAML 标记如下（`customersColumnarView Grid` 控件的 XAML 标记包含类似的\
  \ `Rectangle` 控件，跨越该布局使用的行和列）：\n\n点击此处查看代码图像\n\n```xml\n<Rectangle Grid.Row=\"0\"\
  \ Grid.RowSpan=\"6\" Grid.Column=\"1\" Grid.ColumnSpan=\"7\" ...>\n  <Rectangle.Fill>\n\
  \    <LinearGradientBrush EndPoint=\"0.5,1\" StartPoint=\"0.5,0\">\n      <GradientStop\
  \ Color=\"#FF0E3895\"/>\n      <GradientStop Color=\"#FF141415\" Offset=\"0.929\"\
  />\n    </LinearGradientBrush>\n  </Rectangle.Fill>\n</Rectangle>\n```\n\n3. 在解决方案管理器中，右键点击\
  \ Customers 项目，指向“添加”，并点击“类”。\n\n4. 在“新建项”对话框中，确保选择了类模板。在“名称”框中，输入 `Customer.cs`，然后点击“添加”。你将使用此类来实现\
  \ `Customer` 数据类型，然后实现数据绑定以在 UI 中显示 `Customer` 对象的详细信息。\n\n5. 在显示 `Customer.cs`\
  \ 的代码编辑器窗口中，将 `Customer` 类设置为公共，并添加以下私有字段和属性：\n\n```csharp\npublic class Customer\n\
  {\n    private int _customerID;\n    public int CustomerID\n    {\n        get {\
  \ return _customerID; }\n        set { _customerID = value; }\n    }\n    private\
  \ string _title;\n    public string Title\n    {\n        get { return _title; }\n\
  \        set { _title = value; }\n    }\n    private string _firstName;\n    public\
  \ string FirstName\n    {\n        get { return _firstName; }\n        set { _firstName\
  \ = value; }\n    }\n    private string _lastName;\n    public string LastName\n\
  \    {\n        get { return _lastName; }\n        set { _lastName = value; }\n\
  \    }\n    private string _emailAddress;\n    public string EmailAddress\n    {\n\
  \        get { return _emailAddress; }\n        set { _emailAddress = value; }\n\
  \    }\n    private string _phone;\n    public string Phone\n    {\n        get\
  \ { return _phone; }\n        set { _phone = value; }\n    }\n}\n```\n\n你可能会奇怪，为什么这些属性没有实现为自动属性，因为它们所做的只是获取和设置私有字段中的值。你将在后的练习中为这些属性添加额外代码。\n\
  \n6. 在解决方案管理器中，在 Customers 项目中，双击 `MainPage.xaml` 以在设计视图中显示用户界面。\n\n7. 在 XAML 格中，找到\
  \ `id` TextBox 控件。修改 XAML 标记，以设置该控件的 `Text` 属性，如下：\n\n```xml\n<TextBox Grid.Row=\"\
  1\" Grid.Column=\"1\" x:Name=\"id\" Text=\"{Binding}\"\n```\n\n`Text=\"{Binding}\"\
  ` 语法指定 `Text` 属性的值由运行时提供。在这种情况下，`Path` 被设置为 `CustomerID`，因此 `CustomerID` 值将由该控件显示。然而，你需要提供更多信息以指示\
  \ `CustomerID` 实际上 `Customer` 对象的属性。为了这一点，你需要设置控件的 `DataContext` 属性，你很快会这样做。\n\n\
  8. 为表单其他文本控件添加以下绑定表达式。为 `customersTabularView` 和 `customersColumnarView Grid` 控件中的\
  \ `TextBox` 控件应用数据绑定，如下文代码所示。（`ComboBox` 控件需要不同的处理方式，你将在本章的使用 ComboBox 使用数据绑定 部分介绍。）\n\
  \n点击此处查看代码图像\n\n```xml\n<Grid x:Name=\"customersTabularView\" ...>\n  <TextBox Grid.Row=\"\
  1\" Grid.Column=\"1\" x:Name=\"id\" Text=\"{Binding CustomerID}\" />\n  <TextBox\
  \ Grid.Row=\"1\" Grid.Column=\"5\" x:Name=\"firstName\" Text=\"{Binding FirstName}\"\
  \ />\n  <TextBox Grid.Row=\"1\" Grid.Column=\"7\" x:Name=\"lastName\" Text=\"{Binding\
  \ LastName}\" />\n  <TextBox Grid.Row=\"3\" Grid.Column=\"3\" Grid.ColumnSpan=\"\
  3\" x:Name=\"email\" Text=\"{Binding EmailAddress}\" />\n  <TextBox Grid.Row=\"\
  5\" Grid.Column=\"3\" Grid.ColumnSpan=\"3\" x:Name=\"phone\" Text=\"{Binding Phone}\"\
  \ />\n</Grid>\n\n<Grid x:Name=\"customersColumnarView\" Margin=\"10,20,10,20\" Visibility=\"\
  Collapsed\">\n  <TextBox Grid.Row=\"0\" Grid.Column=\"1\" x:Name=\"cId\" Text=\"\
  {Binding CustomerID}\" />\n  <TextBox Grid.Row=\"2\" Grid.Column=\"1\" x:Name=\"\
  cFirstName\" Text=\"{Binding FirstName}\" />\n  <TextBox Grid.Row=\"3\" Grid.Column=\"\
  1\" x:Name=\"cLastName\" Text=\"{Binding LastName}\" />\n  <TextBox Grid.Row=\"\
  4\" Grid.Column=\"1\" x:Name=\"cEmail\" Text=\"{Binding EmailAddress}\" />\n  <TextBox\
  \ Grid.Row=\"5\" Grid.Column=\"1\" x:Name=\"cPhone\" Text=\"{Binding Phone}\" />\n\
  </Grid>\n```\n\n\n\n注意同一个绑定表达式如何用于多个控件。例如，表达式 `{Binding CustomerID}` 被 `id TextBox`\
  \ 和 `cId TextBox` 控件共同引用，这会导致两个控件都显示相同的数据。\n\n### 9. 在解决方案管理器中，展开 `MainPage.xaml`\
  \ 文件，然后双击 `MainPage.xaml.cs` 文件，以在代码和文本编辑器窗口中显示 `MainPage.xaml` 表单的代码。在 `MainPage`\
  \ 构造函数中添加下方**加粗**的语句。\n\n点击此处查看代码图像\n\n```csharp\npublic MainPage()\n{\n    this.InitializeComponent();\n\
  \    Customer customer = new Customer\n    {\n        CustomerID = 1,\n        Title\
  \ = \"Mr\",\n        FirstName = \"John\",\n        LastName = \"Sharp\",\n    \
  \    EmailAddress = \"john@contoso.com\",\n        Phone = \"111-1111\"\n    };\n\
  }\n```\n\n此代码创建了 `Customer` 类的新实例，并为其填充了一些示例数据。\n\n### 10. 在创建新 `Customer` 对象代码之后，添加下方**加粗**的语句：\n\
  \n点击此处查看代码图像\n\n```csharp\nCustomer customer = new Customer\n{\n    ...\n};\n\n\
  this.DataContext = customer;\n```\n\n该语句指定了 `MainPage` 表单上的控件应该绑定的对象。在每个控件中，XAML\
  \ 标记 `Text=\"{Binding Path}\"` 将将针对此对象进行解析。例如，`id TextBox` 和 `cId TextBox` 控件都指定了\
  \ `Text=\"{Binding CustomerID}\"`，因此它们将显示表单所绑定的 `Customer` 对象中 `CustomerID` 属性的值。\n\
  \n![Image](img/Image00005.jpg) **注意**：在此示例中，你设置了表单的 `DataContext` 属性，因此相同的数据绑定会自动应用于表单上的所有控件。如果你需要将特定控件绑定到不同的对象，也可以为单个控件设置\
  \ `DataContext` 属性。\n\n### 11. 在“调试”菜单上，点击“启动调试”以生成并运行应用程序。\n\n验证表单是否占据全屏，并如下图所示显示客户\
  \ John Sharp 的详情：\n\n![Image](img/Image00208.jpg)\n\n### 12. 调整应用程序窗口的大小以在窄视图下显示。验证如此处所示它显示了相同的数据：\n\
  \n![Image](img/Image00209.jpg)\n\n在窄视图下显示的控件与全屏视图下显示的控件绑定到相同的数据。\n\n### 13. 在窄视图中，将电子邮件地址更改为\
  \ john@treyresearch.com 。\n\n### 14. 扩展应用程序窗口以切换到宽视图。\n\n注意到此视图中显示的电子邮件地址没有发生变化。\n\
  \n### 15. 返回 Visual Studio 并停止调试。\n\n### 16. 在 Visual Studio 中，在代码和文本编辑器窗口中显示 `Customer`\
  \ 类的代码，并在 `EmailAddress` 属性的 `set` 属性访问器中设置一个断点。\n\n### 17. 在“调试”菜单上，点击“启动调试”以再次生成并运行应用程序。\n\
  \n### 18. 当调试器第一次到达断点时，按 F5 继续运行应用程序。\n\n### 19. 当 Customers 程序的 UI 出现时，调整应用程序窗口大小以显示窄视图，并将电子邮件地址更改为\
  \ john@treyresearch.com 。\n\n### 20. 将应用程序窗口扩展回宽视图。\n\n注意调试器没有到达 `EmailAddress`\
  \ 属性的 `set` 访问器断点；当电子邮件 `TextBox` 失去焦点时，更新的值并没有被写回 `Customer` 对象。\n\n### 21. 返回\
  \ Visual Studio 并停止调试。\n\n### 22. 移除 `Customer` 类中 `EmailAddress` 属性 `set` 访问器中的断点。\n\
  \n#### 使用数据绑定进行修改数据\n\n在上一个练习中，你看到了如何使用数据绑定可以轻松地显示对象中的数据。然而，默认情况下数据绑定是单向操作，你对显示的数据所做的任何更改都不会回写到数据源。在练习中，当你更改窄视图中显示的电子邮件地址时，你看到了这一点；当你切换回宽视图时，数据并没有发生变化。你可以通过修改控件\
  \ XAML 标记中 `Binding` 规范的 `Mode` 参数来实现双向数据绑定。`Mode` 参数指示数据绑定是单向还是双向的。这就是你接下来要做的。\n\
  \n#### 实现 TwoWay 数据绑定以修改客户信息\n\n### 1. 在设计窗口中显示 `MainPage.xaml` 文件，并按照下方代码中**加粗**所示修改每个\
  \ `TextBox` 控件的 XAML 标记：\n\n点击此处查看代码图像\n\n```xml\n<Grid x:Name=\"customersTabularView\"\
  \ ...>\n...\n<TextBox Grid.Row=\"1\" Grid.Column=\"1\" x:Name=\"id\" ...\nText=\"\
  {Binding CustomerID, Mode=TwoWay }\" .../>\n...\n<TextBox Grid.Row=\"1\" Grid.Column=\"\
  5\" x:Name=\"firstName\" ...\nText=\"{Binding FirstName, Mode=TwoWay }\"/>\n<TextBox\
  \ Grid.Row=\"1\" Grid.Column=\"7\" x:Name=\"lastName\" ...\nText=\"{Binding LastName,\
  \ Mode=TwoWay }\"/>\n<TextBox Grid.Row=\"3\" Grid.Column=\"3\" x:Name=\"email\"\
  \ ...\nText=\"{Binding EmailAddress, Mode=TwoWay }\"/>\n...\n<TextBox Grid.Row=\"\
  5\" Grid.Column=\"3\" x:Name=\"phone\" ...\nText=\"{Binding Phone, Mode=TwoWay }\"\
  />\n</Grid>\n```\n\n`Mode` 参数到 `Binding` 规范指示数据绑定是单向（默认）还是双向的。将 `Mode` 设置为 `TwoWay`\
  \ 会导致用户所做的任何更改传递回绑定的对象。\n\n### 2. 在“调试”菜单上，点击“启动调试”再次生成并运行应用程序。\n\n### 3. 在宽视图下，将电子邮件地址更改为\
  \ john@treyresearch.com，然后调整窗口大小在窄视图下显示应用程序。\n\n注意，尽管数据绑定更改了 `TwoWay` 模式，窄视图中显示的电子邮件地址还没有更新——它仍然是\
  \ john@contoso.com 。\n\n### 4. 返回 Visual Studio 并停止调试。\n\n显然，某些地方没有正常工作！现在的问题不是数据没有更新，而是视图没有显示最新版本。（如果你重新在\
  \ `Customer` 类 `EmailAddress` 属性的 `set` 访问器中设置断点并在调试器中运行应用程序，当你更改电子邮件地址的值并离开 `TextBox`\
  \ 控件焦点时，你会看到调试器到达断点。）尽管如此，数据绑定过程并不是魔法，数据绑定不知道它绑定的数据何时已更改。对象需要通过向 UI 发 `PropertyChanged`\
  \ 事件来通知任何修改。此事件是 `INotifyPropertyChanged` 接口的一部分，所有支持双向数据绑定的对象应该实现此接口。你将在下一个练习中实现此接口。\n\
  \n#### 在 Customer 类中实现 INotifyPropertyChanged 接口\n\n### 1. 在 Visual Studio 中，在代码和文本编辑器窗口中显示\
  \ `Customer.cs` 文件。\n\n### 2. 在文件顶部的列表中添加以下 *using* 指令：\n\n```csharp\nusing System.ComponentModel;\n\
  ```\n\n\n\n\n`INotifyPropertyChanged` 接口定义在此命名空间中。\n\n### 3. 修改 `Customer` 类的定义，指定它实现了\
  \ `INotifyPropertyChanged` 接口，如下所示加粗所示：\n\n点击此处查看代码图像\n\n```csharp\nclass Customer\
  \ : INotifyPropertyChanged\n```\n\n### 4. 在 `Customer` 类的 `Phone` 属性之后，在下面的代码中添加**加粗所示**的\
  \ `PropertyChanged` 事件：\n\n点击此处查看代码图像\n\n```csharp\nclass Customer : INotifyPropertyChanged\n\
  {\n...\n\npublic string _phone;\npublic string Phone {\nget { return this._phone;\
  \ }\nset { this._phone = value; }\n}\n\npublic event PropertyChangedEventHandler\
  \ PropertyChanged;\n\n}\n```\n\n此事件是 `INotifyPropertyChanged` 接口定义的唯一项。所有实现此接口的对象必须提供此事件，并且当它们想要向外部世界通知属性值的更改时，都应该引发此事件。\n\
  \n### 5. 在 `PropertyChanged` 事件之后，向 `Customer` 类中添加下方**加粗所示**的 `OnPropertyChanged`\
  \ 方法：\n\n点击此处查看代码图像\n\n```csharp\nclass Customer : INotifyPropertyChanged\n{\n...\n\
  \npublic event PropertyChangedEventHandler PropertyChanged;\nprotected virtual void\
  \ OnPropertyChanged(string propertyName)\n{\nif (PropertyChanged != null)\n{\nPropertyChanged(this,\n\
  new PropertyChangedEventArgs(propertyName));\n}\n}\n\n}\n```\n\n`OnPropertyChanged`\
  \ 方法引发 `PropertyChanged` 事件。`PropertyChanged` 事件的 `PropertyChangedEventArgs` 参数应该指定发生更改的属性的名称。此值将作为参数传递给\
  \ `OnPropertyChanged` 方法。\n\n### 6. 修改 `Customer` 类中每个属性的属性 `set` 访问器，以便在当它们包含的值被修改时，始终调用\
  \ `OnPropertyChanged` 方法，如此处的**加粗所示**：\n\n点击此处查看代码图像\n\n```csharp\nclass Customer\
  \ : INotifyPropertyChanged\n{\npublic int _customerID;\npublic int CustomerID\n\
  {\nget { return this._customerID; }\nset\n{\nthis._customerID = value;\nthis.OnPropertyChanged(nameof(CustomerID));\n\
  }\n}\n\npublic string _title;\npublic string Title\n{\nget { return this._title;\
  \ }\nset\n{\nthis._title = value;\nthis.OnPropertyChanged(nameof(Title));\n}\n}\n\
  \npublic string _firstName;\npublic string FirstName\n{\nget { return this._firstName;\
  \ }\nset\n{\nthis._firstName = value;\nthis.OnPropertyChanged(nameof(FirstName));\n\
  }\n}\n\npublic string _lastName;\npublic string LastName\n{\nget { return this._lastName;\
  \ }\nset\n{\nthis._lastName = value;\nthis.OnPropertyChanged(nameof(LastName));\n\
  }\n}\n\npublic string _emailAddress;\npublic string EmailAddress\n{\nget { return\
  \ this._emailAddress; }\nset\n{\nthis._emailAddress = value;\nthis.OnPropertyChanged(nameof(EmailAddress));\n\
  }\n}\n\npublic string _phone;\npublic string Phone\n{\nget { return this._phone;\
  \ }\nset\n{\nthis._phone = value;\nthis.OnPropertyChanged(nameof(Phone));\n}\n}\n\
  ...\n}\n```\n\n***\n\n### `nameof` 运算符\n\n在 `Customer` 类中演示的 `nameof` 运算符是 C# 在此类代码中一个较少使用但非常有用的特性。它将作为参数传递的变量名称以字符串形式返回。如果不使用\
  \ `nameof` 运算符，你将不得不使用硬编码的字符串值。例如：\n\n点击此处查看代码图像\n\n```csharp\npublic int CustomerID\n\
  {\nget { return this._customerID; }\nset\n{\nthis._customerID = value;\nthis.OnPropertyChanged(\"\
  CustomerID\");\n}\n}\n```\n\n虽然使用字符串值需要的输入较少，但请考虑一下如果你在未来的某个时刻需要更改属性名称会发生什么。如果使用字符串方法，你也将需要修改字符串值。如果不这样做，代码仍然可以编译和运行，但运行时对属性值的任何更改都将不会通知，导致难以发现的错误。使用\
  \ `nameof` 运算符，如果你更改了属性名称但忘记更改 `nameof` 的参数，代码将无法编译，立即会你一个可以快速快捷地修复的错误。\n\n***\n\
  \n### 7. 在“调试”菜单上，点击“启动调试”重新生成并运行应用程序。\n\n### 8. 当“Customers”表单出现时，将电子邮件地址更改为 john@treyresearch.com，并将电话号码更改为\
  \ 222-2222。\n\n### 9. 调整窗口大小以在窄视图显示应用程序，并验证电子邮件地址和电话号码已更改。\n\n### 10. 将名字更改为 James，扩展窗口以显示宽视图，并验证名字已更改。\n\
  \n### 11. 返回到 Visual Studio 并停止调试。\n\n#### 与 `ComboBox` 控件使用数据绑定\n\n与 `TextBox`\
  \ 或 `TextBlock` 等控件使用数据绑定是相对简单的。另一方面，`ComboBox` 控件需要更多的关注。问题是 `ComboBox` 控件实际上显示了两个内容：用户从中选择项目的列表，以及当前选中项的值。如果你为\
  \ `ComboBox` 绑定数据以显示项目列表，选中的值必须是该列表的成员。\n\n你可以尝试像这样配置 `SelectedValue` 的绑定：\n\n点击此处查看代码图像\n\
  \n```xml\n<ComboBox ... x:Name=\"title\" ... SelectedValue=\"{Binding Title}\" />\n\
  ```\n\n然而，注意下拉列表的值是硬编码在 XAML 中的，如下所示：\n\n点击此处查看代码图像\n\n```xml\n<ComboBox ... x:Name=\"\
  title\" ... >\n<ComboBoxItem Content=\"Mr\"/>\n<ComboBoxItem Content=\"Mrs\"/>\n\
  <ComboBoxItem Content=\"Ms\"/>\n<ComboBoxItem Content=\"Miss\"/>\n</ComboBox>\n\
  ```\n\n这种标记在控件创建之前尚未应用，因此尽管客户是 Mr，列表也是空的。\n\n这个问题有多种解决方法，但简单的方法是创建一个包含有效列表的数据源，然后指定\
  \ `ComboBox` 控件使用此列表作为值集。此外，你需要在应用 `ComboBox` 数据绑定之前执行此操作。\n\n##### 为 `title` ComboBox\
  \ 实现数据绑定\n\n1. 在 Visual Studio 中，在代码和文本编辑器窗口中显示 `MainPage.xaml.cs` 文件。\n\n2. 在 `MainPage`\
  \ 构造函数中添加下方**加粗所示**的代码：\n\n点击此处查看代码图像\n\n```csharp\npublic MainPage()\n{\n    this.InitializeComponent();\n\
  \n    List<string> titles = new List<string>\n    {\n        \"Mr\", \"Mrs\", \"\
  Ms\", \"Miss\"\n    };\n\n    this.title.ItemsSource = titles;\n    this.cTitle.ItemsSource\
  \ = titles;\n\n    Customer customer = new Customer\n    {\n        ...\n    };\n\
  \n    this.DataContext = customer;\n}\n```\n\n此代码创建了一个包含客户可能拥有的有效标题的字符串列表。代码将两个\
  \ `title` ComboBox 控件的 `ItemsSource` 属性引用此列表（记得每个视图有一个 `ComboBox` 控件）。\n\n***\n\n\
  ![Image](img/Image00005.jpg) 注意\n\n在商业应用程序中，你很可能会从数据库或其他数据源检索 `ComboBox` 控件显示的数值列表，而不是像本示例那样使用硬编码列表。\n\
  \n\n\n\n\n这段代码的位置至关重要。它必须在设置 `MainPage` 表单的 `DataContext` 属性的语句之前运行，因为该语句会触发表单上控件的数据绑定。\n\
  \n3. 在设计视图（Design View）窗口中显示 `MainPage.xaml` 文件。\n\n4. 修改 `title` 和 `cTitle` ComboBox\
  \ 控件的 XAML 标记，如下面的加粗部分所示：\n\n点击此处查看代码图像\n\n```xml\n<Grid x:Name=\"customersTabularView\"\
  \ ...>\n\n...\n\n<ComboBox Grid.Row=\"1\" Grid.Column=\"3\" x:Name=\"title\" ...\n\
  \nSelectedValue=\"{Binding Title, Mode=TwoWay}\">\n\n</ComboBox>\n\n...\n\n</Grid>\n\
  \n<Grid x:Name=\"customersColumnarView\" ...>\n\n...\n\n<ComboBox Grid.Row=\"1\"\
  \ Grid.Column=\"1\" x:Name=\"cTitle\" ...\n\nSelectedValue=\"{Binding Title, Mode=TwoWay}\"\
  >\n\n</ComboBox>\n\n...\n\n</Grid>\n```\n\n注意，每个控件的 `ComboBoxItem` 元素列表已被移除，且 `SelectedValue`\
  \ 属性配置为与 `Customer` 对象中的 `Title` 字段进行数据绑定。\n\n5. 在调试菜单上，点击“开始调试”以生成并运行应用程序。\n\n\
  6. 验证客户标题的值是否显示正确（应为 Mr）。点击 `ComboBox` 控件的下拉箭头，验证它是否包含 `Mr`、`Mrs`、`Ms` 和 `Miss`\
  \ 值。\n\n7. 调整窗口大小以窄视图模式显示应用，并执行相同的检查。注意，你可以更改标题，当切换回宽视图时，将显示新标题。\n\n8. 回到 Visual\
  \ Studio 并停止调试。\n\n## 创建 ViewModel\n\n你现在已经了解了如何配置数据绑定以将数据源连接到用户界面中的控件，但你一直以来使用的数据源非常简单，只包含一个客户。在现实世界中，数据源可能会复杂得多，由不同对象的集合组成。记住，在\
  \ MVVM 术语中，数据源通常由模型（model）提供，而 UI（视图）仅通过 `ViewModel` 对象间接与模型通信。这种方法的合理原理是：模型与显示模型所提供的数据的视图应该是独立的；如果修改了用户界面，你不必更改模型；如果底层模型发生变化，你也不必需要调整\
  \ UI。\n\n`ViewModel` 提供了视图与模型之间的连接，并实现了应用程序的业务逻辑。同样，这种业务逻辑应该独立于视图和模型。`ViewModel`\
  \ 通过实现一组命令将业务逻辑暴露给视图。UI 可以根据用户在应用程序中的导航触发这些命令。在接下来的练习中，你将通过实现一个包含 `Customer` 对象列表的模型，并创建一个\
  \ `ViewModel` 来扩展 Customers 应用，该 ViewModel 提供允许用户在视图中的客户之间切换的命令。\n\n### 创建管理客户信息的\
  \ ViewModel\n\n1. 打开 Customers 项目，它位于你文档文件夹的 `\\Microsoft Press\\VCSBS\\Chapter\
  \ 26\\ViewModel` 文件夹中。该项目包含了上一组练习中 Customers 应用的完成版本；如果你愿意，也可以继续使用你自己的项目版本。\n\n\
  2. 在解决方案管理器（Solution Explorer）中，右键点击 Customers 项目，指向“添加”，然后点击“类”。\n\n3. 在“添加新建项\
  \ – Customers”对话框中，在“名称”框中输入 `ViewModel.cs`，然后点击“添加”。\n\n此类提供了一个包含 `Customer` 对象集合的基础\
  \ `ViewModel`。用户界面将绑定到此 ViewModel 暴露的数据。\n\n4. 在显示 `ViewModel.cs` 文件的代码和文本编辑器中，将类标记为公有（public），并将后续示例所示的加粗代码添加到\
  \ `ViewModel` 类中：\n\n点击此处查看代码图像\n\n```csharp\npublic class ViewModel\n{\n\n    private\
  \ List<Customer> customers;\n\n    public ViewModel()\n    {\n        this.customers\
  \ = new List<Customer>\n        {\n            new Customer\n            {\n   \
  \             CustomerID = 1,\n                Title = \"Mr\",\n               \
  \ FirstName=\"John\",\n                LastName=\"Sharp\",\n                EmailAddress=\"\
  john@contoso.com\",\n                Phone=\"111-1111\"\n            },\n      \
  \      new Customer\n            {\n                CustomerID = 2,\n          \
  \      Title = \"Mrs\",\n                FirstName=\"Diana\",\n                LastName=\"\
  Sharp\",\n                EmailAddress=\"diana@contoso.com\",\n                Phone=\"\
  111-1112\"\n            },\n            new Customer\n            {\n          \
  \      CustomerID = 3,\n                Title = \"Ms\",\n                FirstName=\"\
  Francesca\",\n                LastName=\"Sharp\",\n                EmailAddress=\"\
  frankie@contoso.com\",\n                Phone=\"111-1113\"\n            }\n    \
  \    };\n    }\n}\n```\n\n`ViewModel` 类使用 `List<Customer>` 对象作为它的模型，构造函数向此列表填充了一些示例数据。严格来说，这些数据应该存储在单独的\
  \ `Model` 类中，但为了练习目的，我们暂且使用这些示例数据。\n\n5. 将后续代码中加粗所示的私有变量 `currentCustomer` 添加到 `ViewModel`\
  \ 类中，并在构造函数中初始化该变量为零：\n\n点击此处查看代码图像\n\n```csharp\nclass ViewModel\n{\n    private\
  \ List<Customer> customers;\n    private int currentCustomer;\n\n    public ViewModel()\n\
  \    {\n        this.currentCustomer = 0;\n        this.customers = new List<Customer>();\n\
  \    }\n```\n\n`ViewModel` 类将使用此变量来跟踪视图正在显示的 `Customer` 对象。\n\n6. 将下方加粗所示的 `Current`\
  \ 属性添加到 `ViewModel` 类中，位于构造函数之后：\n\n点击此处查看代码图像\n\n```csharp\nclass ViewModel\n{\n\
  \    ...\n    public Customer Current\n    {\n        get { return this.customers.Count\
  \ > 0 ? this.customers[currentCustomer] : null; }\n    }\n}\n```\n\n`Current` 属性提供了模型的访问。如果没有客户，它将返回\
  \ `null`。良好的做法是提供受控制的访问；然而，这种限制并没有阻止视图能够更新模型。\n\n7. 在代码和文本编辑器中打开 `MainPage.xaml.cs`\
  \ 文件。\n\n8. 在 `MainPage` 构造函数中，移除创建 `Customer` 对象的代码，并替换为创建 `ViewModel` 类的语句。将设置\
  \ `MainPage` 对象的 `DataContext` 属性的语句引用新的 `ViewModel` 对象，如下加粗所示：\n\n点击此处查看代码图像\n\n\
  ```csharp\npublic MainPage()\n{\n    ...\n    ViewModel viewModel = new ViewModel();\n\
  \    this.DataContext = viewModel;\n}\n```\n\n9. 在设计视图窗口中打开 `MainPage.xaml` 文件。\n\
  \n10. 在 XAML 格中，修改 `TextBox` 和 `ComboBox` 控件的数据绑定，通过 ViewModel 提供的 `Current` 对象来引用属性，如下面代码加粗所示：\n\
  \n点击此处查看代码图像\n\n```xml\n<Grid x:Name=\"customersTabularView\" ...>\n\n...\n\n<TextBox\
  \ Grid.Row=\"1\" Grid.Column=\"1\" x:Name=\"id\" ...\n\nText=\"{Binding Current.CustomerID,\
  \ Mode=TwoWay}\" .../>\n\n<TextBox Grid.Row=\"1\" Grid.Column=\"5\" x:Name=\"firstName\"\
  \ ...\n\nText=\"{Binding Current.FirstName, Mode=TwoWay }\" .../>\n\n<TextBox Grid.Row=\"\
  1\" Grid.Column=\"7\" x:Name=\"lastName\" ...\n\nText=\"{Binding Current.LastName,\
  \ Mode=TwoWay }\" .../>\n\n<ComboBox Grid.Row=\"1\" Grid.Column=\"3\" x:Name=\"\
  title\" ...\n\nSelectedValue=\"{Binding Current.Title, Mode=TwoWay}\">\n\n</ComboBox>\n\
  \n...\n\n<TextBox Grid.Row=\"3\" Grid.Column=\"3\" ... x:Name=\"email\" ...\n\n\
  Text=\"{Binding Current.EmailAddress, Mode=TwoWay }\" .../>\n\n...\n\n<TextBox Grid.Row=\"\
  5\" Grid.Column=\"3\" ... x:Name=\"phone\" ...\n\nText=\"{Binding Current.Phone,\
  \ Mode=TwoWay }\" .../>\n\n</Grid>\n\n<Grid x:Name=\"customersColumnarView\" ...>\n\
  \n...\n```\n\n\n\n\n\n```xml\n<TextBox Grid.Row=\"0\" Grid.Column=\"1\" x:Name=\"\
  cId\" ... Text=\"{Binding Current .CustomerID, Mode=TwoWay }\" .../>\n<TextBox Grid.Row=\"\
  2\" Grid.Column=\"1\" x:Name=\"cFirstName\" ... Text=\"{Binding Current .FirstName,\
  \ Mode=TwoWay }\" .../>\n<TextBox Grid.Row=\"3\" Grid.Column=\"1\" x:Name=\"cLastName\"\
  \ ... Text=\"{Binding Current .LastName, Mode=TwoWay }\" .../>\n<ComboBox Grid.Row=\"\
  1\" Grid.Column=\"1\" x:Name=\"cTitle\" ... SelectedValue=\"{Binding Current .Title,\
  \ Mode=TwoWay}\"></ComboBox>\n<TextBox Grid.Row=\"4\" Grid.Column=\"1\" x:Name=\"\
  cEmail\" ... Text=\"{Binding Current .EmailAddress, Mode=TwoWay }\" .../>\n<TextBox\
  \ Grid.Row=\"5\" Grid.Column=\"1\" x:Name=\"cPhone\" ... Text=\"{Binding Current\
  \ .Phone, Mode=TwoWay }\" .../>\n</Grid>\n```\n\n11. 在 `Debug` 菜单上，点击 `Start Debugging`\
  \ 以生成并运行应用程序。\n12. 验证应用程序是否显示了 `John Sharp` 的详情（客户列表中的第一个客户）。更改客户详情并在视图之间切换，以证明数据绑定仍在正常工作。\n\
  13. 返回到 `Visual Studio` 并停止调试。\n\nViewModel 通过 `Current` 属性访问客户信息，但目前它没有提供任何在客户之间进行导航的方法。你可以实现增加和减少\
  \ `currentCustomer` 变量的方法，以便 `Current` 属性能够检索不同的客户，但你应该以一种不将视图与 ViewModel 耦合的方式来操作。最被广泛接受的技术是使用\
  \ `Command` 模式。在这种模式中，ViewModel 以命令的形式暴露方法，视图可以调用这些方法。此处的诀窍在于避免在视图代码中显式地通过名称引用这些方法。为了实现这一点，XAML\
  \ 允许你以声明式的方式将命令绑定到由 UI 控件触发的操作上，正如你将在下一节节的练习中看到的那样。\n\n### 向 ViewModel 中添加命令\n\n\
  将控件的操作绑定到命令的 XAML 标记要求 ViewModel 暴露的命令必须实现 `ICommand` 接口。该接口定义了以下项目：\n\n![Image](img/Image00001.jpg)\
  \ `CanExecute` 此方法返回一个布尔值，指示命令是否可以运行。使用此方法，ViewModel 可以根据上下文启用或禁用命令。例如，一个从列表中获取下一个客户的命令应该只有在有下一个客户可以获取时才能运行；如果没有更多客户了，则该命令应该被禁用。\n\
  \n![Image](img/Image00001.jpg) `Execute` 此方法在命令被调用时运行。\n\n![Image](img/Image00001.jpg)\
  \ `CanExecuteChanged` 此事件在 ViewModel 状态发生变化时被触发。在这些情况下，之前可以运行的命令现在可能会被禁用，反之亦然。例如，如果\
  \ UI 调用了一个从列表中获取下一个客户的命令，如果该客户是最后一个客户，那么后续对 `CanExecute` 的调用将返回 `false`。在这些情况下，应该触发\
  \ `CanExecuteChanged` 事件以指示该命令已被禁用。\n\n在接接的练习中，你将创建一个实现 `ICommand` 接口的泛型类。\n\n###\
  \ 实现 Command 类\n\n1. 在 Visual Studio 中，右键点击 `Customers` 项目，指向 `Add`，然后点击 `Class`。\n\
  2. 在 `Add New Item – Customers` 对话框中，选择 `Class` 模板。在 `Name` 框中输入 `Command.cs`，然后点击\
  \ `Add`。\n3. 在显示 `Command.cs` 文件的 `Code and Text Editor` 窗口中，向文件顶部列表添加以下 `using`\
  \ 指令：\n```csharp\nusing System.Windows.Input;\n```\n`ICommand` 接口定义在此命名空间中。\n4.\
  \ 将 `Command` 类设置为 `public`，并指定它实现了 `ICommand` 接口，如下所示：\n\n点击此处查看代码图片\n```csharp\n\
  public class Command : ICommand\n{\n\n}\n```\n5. 向 `Command` 类添加以下私有字段：\n点击此处查看代码图片\n\
  ```csharp\npublic class Command : ICommand\n{\n    private Action methodToExecute\
  \ = null;\n    private Func<bool> methodToDetectCanExecute = null;\n}\n```\n`Action`\
  \ 和 `Func` 类型在 第 20 章，“解耦应用程序逻辑和处理事件](#text00027.html_ch20)” 中有简要描述。`Action` 类型是一个委托，你可以用它引用一个无参数且没有返回值的方法，而\
  \ `Func<T>` 类型也是一个委托，可以引用一个无参数但返回类型参数 `T` 指定类型值的方法。在此类中，你将使用 `methodToExecute` 字段来引用\
  \ `Command` 对象在被视图调用时运行的代码。`methodToDetectCanExecute` 字段将用于引用检测命令是否可以运行的方法（根据应用程序状态或数据，可能会由于某些原因被禁用）。\n\
  6. 为 `Command` 添加一个构造函数。该构造函数应接收两个参数：一个 `Action` 对象和一个 `Func<bool>` 对象。将这些参数赋值给\
  \ `methodToExecute` 和 `methodToDetectCanExecute` 字段，如下所示：\n点击此处查看代码图片\n```csharp\n\
  public class Command : ICommand\n{\n    public Command(Action methodToExecute, Func<bool>\
  \ methodToDetectCanExecute)\n    {\n        this.methodToExecute = methodToExecute;\n\
  \        this.methodToDetectCanExecute = methodToDetectCanExecute;\n    }\n}\n```\n\
  ViewModel 将创建此类的实例。ViewModel 提供运行命令的方法以及检测命令应该启用的方法。\n7. 使用 `methodToExecute` 和\
  \ `methodToDetectCanExecute` 引用的方法实现 `Command` 类的 `Execute` 和 `CanExecute` 方法，如下：\n\
  点击此处查看代码图片\n```csharp\npublic class Command : ICommand\n{\n    public void Execute(object\
  \ parameter)\n    {\n        this.methodToExecute();\n    }\n\n    public bool CanExecute(object\
  \ parameter)\n    {\n        if (this.methodToDetectCanExecute == null)\n      \
  \  {\n            return true;\n        }\n        else\n        {\n           \
  \ return this.methodToDetectCanExecute();\n        }\n    }\n}\n```\n注意，如果 ViewModel\
  \ 为构造函数的 `methodToDetectExecute` 参数提供了 `null` 引用，默认操作是假设命令可以运行，`CanExecute` 方法返回\
  \ `true`。\n8. 为 `Command` 类添加公共 `CanExecuteChanged` 事件：\n点击此处查看代码图片\n```csharp\n\
  public class Command : ICommand\n{\n    public event EventHandler CanExecuteChanged;\n\
  }\n```\n当你将命令绑定到控件时，控件会自动订阅此事件。当 ViewModel 的状态更新且 `CanExecute` 方法的返回值变化时，应由 `Command`\
  \ 对象触发此事件。简单的策略是使用计时器每秒触发一次 `CanExecuteChanged` 事件。控件随后调用 `CanExecute` 来判断命令是否仍可以执行，并根据结果采取启用或禁用自身的措施。\n\
  9. 在文件顶部列表添加显示的 `using` 指令：\n```csharp\nusing Windows.UI.Xaml;\n```\n10. 在 `Command`\
  \ 类构造函数上方添加以下字段：\n点击此处查看代码图片\n```csharp\npublic class Command : ICommand\n{\n  \
  \  private Func<bool> methodToDetectCanExecute = null;\n    private DispatcherTimer\
  \ canExecuteChangedEventTimer = null;\n}\n```\n\n\n\n\n\n`DispatcherTimer` 类定义在\
  \ `Windows.UI.Xaml` 命名空间中，实现了一个可以在指定间隔触发事件的定时器。你将使用 `canExecuteChangedEventTimer`\
  \ 字段来每隔一秒触发一次 `CanExecuteChanged` 事件。\n\n### 11. 将以下代码中**粗体显示**的 `canExecuteChangedEventTimer_Tick`\
  \ 方法添加到 `Command` 类的末尾：\n\n点击此处查看代码图像\n\n```csharp\npublic class Command : ICommand\n\
  {\n    ...\n\n    public event EventHandler CanExecuteChanged;\n\n    void canExecuteChangedEventTimer_Tick(object\
  \ sender, object e)\n    {\n        if (this.CanExecuteChanged != null)\n      \
  \  {\n            this.CanExecuteChanged(this, EventArgs.Empty);\n        }\n  \
  \  }\n}\n```\n\n该方法仅在至少有一个控件绑定到该命令时，就会简单地触发 `CanExecuteChanged` 事件。严格来说，此方法在触发事件之前还应该检查对象的状态是否发生了变化。然而，你将定时器间隔设置为很长时间（从处理角度而言），以最大限度地减少不检查状态变化带来的任何效率低下。\n\
  \n### 12. 在 `Command` 构造函数中添加以下**粗体显示**的语句。\n\n点击此处查看代码图像\n\n```csharp\npublic class\
  \ Command : ICommand\n{\n    ...\n\n    public Command(Action methodToExecute, Func<bool>\
  \ methodToDetectCanExecute)\n    {\n        this.methodToExecute = methodToExecute;\n\
  \        this.methodToDetectCanExecute = methodToDetectCanExecute;\n        this.canExecuteChangedEventTimer\
  \ = new DispatcherTimer();\n        this.canExecuteChangedEventTimer.Tick += canExecuteChangedEventTimer_Tick;\n\
  \        this.canExecuteChangedEventTimer.Interval = new TimeSpan(0, 0, 1);\n  \
  \      this.canExecuteChangedEventTimer.Start();\n    }\n    ...\n}\n```\n\n此代码初始化了\
  \ `DispatcherTimer` 对象，并在启动定时器之前将定时器事件的间隔设置为一秒。\n\n### 13. 在“生成”（Build）菜单上，点击“生成解决方案”（Build\
  \ Solution），并确保你的应用在没有错误的情况下生成。\n\n你现在可以使用 `Command` 类为 `ViewModel` 类添加命令了。在下一个练习中，你将定义命令以允许使用户在视图中的不同客户之间移动。\n\
  \n## 在 `ViewModel` 类中添加 `NextCustomer` 和 `PreviousCustomer` 命令\n\n### 1. 在 Visual\
  \ Studio 中，在代码和文本编辑器窗口中打开 `ViewModel.cs` 文件。\n\n### 2. 在文件顶部添加以下 `using` 指令，并修改\
  \ `ViewModel` 类的定义以实现 `INotifyPropertyChanged` 接口。\n\n点击此处查看代码图像\n\n```csharp\n\
  ...\nusing System.ComponentModel;\n\nnamespace Customers\n{\n    public class ViewModel\
  \ : INotifyPropertyChanged\n    {\n        ...\n    }\n}\n```\n\n### 3. 在 `ViewModel`\
  \ 类的末尾添加 `PropertyChanged` 事件和 `OnPropertyChanged` 方法。这与你在 `Customer` 类中包含的代码是相同的。\n\
  \n点击此处查看代码图像\n\n```csharp\npublic class ViewModel : INotifyPropertyChanged\n{\n\
  \    ...\n\n    public event PropertyChangedEventHandler PropertyChanged;\n\n  \
  \  protected virtual void OnPropertyChanged(string propertyName)\n    {\n      \
  \  if (PropertyChanged != null)\n        {\n            PropertyChanged(this, new\
  \ PropertyChangedEventArgs(propertyName));\n        }\n    }\n}\n```\n\n记住，视图通过其包含的各种控件的数据绑定表达式中的\
  \ `Current` 属性来引用数据。当 `ViewModel` 类移动到不同的客户时，它必须触发 `PropertyChanged` 事件以通知视图要显示的数据已更改。\n\
  \n### 4. 在 `ViewModel` 类中构造函数之后立即添加以下字段和属性：\n\n点击此处查看代码图像\n\n```csharp\npublic class\
  \ ViewModel : INotifyPropertyChanged\n{\n    ...\n\n    public ViewModel()\n   \
  \ {\n        ...\n    }\n\n    private bool _isAtStart;\n    public bool IsAtStart\n\
  \    {\n        get { return this._isAtStart; }\n        set\n        {\n      \
  \      this._isAtStart = value;\n            this.OnPropertyChanged(nameof(IsAtStart));\n\
  \        }\n    }\n\n    private bool _isAtEnd;\n    public bool IsAtEnd\n    {\n\
  \        get { return this._isAtEnd; }\n        set\n        {\n            this._isAtEnd\
  \ = value;\n            this.OnPropertyChanged(nameof(IsAtEnd));\n        }\n  \
  \  }\n    ...\n}\n```\n\n你将使用这两个属性来跟踪 `ViewModel` 的状态。当 `ViewModel` 中的 `currentCustomer`\
  \ 字段位于客户集合的开头时，`IsAtStart` 属性将被设置为 `true`；当 `ViewModel` 位于客户集合的末尾时，`IsAtEnd` 属性将被设置为\
  \ `true`。\n\n### 5. 修改构造函数以设置 `IsAtStart` 和 `IsAtEnd` 属性，如下方的**粗体**所示：\n\n点击此处查看代码图像\n\
  \n```csharp\npublic ViewModel()\n{\n    this.currentCustomer = 0;\n    this.IsAtStart\
  \ = true;\n    this.IsAtEnd = false;\n    this.customers = new List<Customer>();\n\
  }\n```\n\n### 6. 在 `Current` 属性之后，向 `ViewModel` 类添加此处**粗体显示**的 `Next` 和 `Previous`\
  \ 私有方法：\n\n点击此处查看代码图像\n\n```csharp\npublic class ViewModel : INotifyPropertyChanged\n\
  {\n    ...\n\n    public Customer Current\n    {\n        ...\n    }\n\n    private\
  \ void Next()\n    {\n        if (this.customers.Count - 1 > this.currentCustomer)\n\
  \        {\n            this.currentCustomer++;\n            this.OnPropertyChanged(nameof(Current));\n\
  \            this.IsAtStart = false;\n        }\n    }\n\n    private void Previous()\n\
  \    {\n        if (this.currentCustomer > 0)\n        {\n            this.currentCustomer--;\n\
  \            this.OnPropertyChanged(nameof(Current));\n            this.IsAtEnd\
  \ = false;\n        }\n    }\n    ...\n}\n```\n\n![Image](img/Image0005.jpg) 注意\
  \ `Count` 属性返回集合中的项数，但请记住集合中的项是从 `0` 到 `Count – 1` 的。\n\n这些方法更新 `currentCustomer`\
  \ 变量指向下一个（或上一个）客户。注意这些方法通过触发 `Current` 属性的 `PropertyChanged` 事件来维护 `IsAtStart` 和\
  \ `IsAtEnd` 属性的值。这些方法之所以是私有的，是因为因为外部类将通过命令运行这些方法。\n\n### 7. 在 `ViewModel` 类中添加 `NextCustomer`\
  \ 和 `PreviousCustomer` 自动属性，如下方的**粗体显示**所示：\n\n点击此处查看代码图像\n\n```csharp\npublic class\
  \ ViewModel : INotifyPropertyChanged\n{\n    private List<Customer> customers;\n\
  \    private int currentCustomer;\n    public Command NextCustomer { get; private\
  \ set; }\n    public Command PreviousCustomer { get; private set; }\n    ...\n}\n\
  ```\n\n视图将绑定到这些 `Command` 对象，以便使用户可以在客户之间导航。\n\n### 8. 在 `ViewModel` 构造函数中，将 `NextCustomer`\
  \ 和 `PreviousCustomer` 属性设置为新的 `Command` 对象，如下：\n\n点击此处查看代码图像\n\n```csharp\npublic\
  \ ViewModel()\n{\n    this.currentCustomer = 0;\n    this.IsAtStart = true;\n  \
  \  this.IsAtEnd = false;\n    this.customers = new List<Customer>();\n    this.NextCustomer\
  \ = new Command(this.Next, () =>\n    { return this.customers.Count > 1 && !this.IsAtEnd;\
  \ });\n    this.PreviousCustomer = new Command(this.Previous, () =>\n    { return\
  \ this.customers.Count > 0 && !this.IsAtStart; });\n    ...\n}\n```\n\n`NextCustomer\
  \ Command` 指定了 `Next` 方法为 `Execute` 方法被调用时的操作。Lambda 表达式 `() => { return this.customers.Count\
  \ > 1 && !this.IsAtEnd; }` 被指定为 `CanExecute method` 运行时调用的函数。\n\n\n\n\n只要客户列表包含一个以上的客户，且\
  \ `ViewModel` 未位于该列表中的最后一个客户，此表达式就会返回 `true`。`PreviousCustomer Command` 遵循相同的模式：它调用\
  \ `Previous` 方法从列表中检索上一个客户，而 `CanExecute` 方法引用了表达式 `() => { return this.customers.Count\
  \ > 0 && !this.IsAtStart; }`，只要客户列表包含至少一个客户且 `ViewModel` 未位于该列表中的第一个客户，该表达式就会返回\
  \ `true`。\n\n### 9. 在“生成 (Build)”菜单中，点击“生成解决方案 (Build Solution)”，并验证你的应用程序仍然无错误地生成。\n\
  \n现在你已经向 `ViewModel` 中添加了 `NextCustomer` 和 `PreviousCustomer` 命令，你可以将这些命令绑定到视图（view）中的按钮上。当用户点击按钮时，将运行相应的命令。\n\
  \n微软发布了在 UWP 的视图中添加按钮的指南，通用建议是将调用命令的按钮放置在命令栏（command bar）上。UWP 应用提供了两个命令栏：一个显示在表单顶部，另一个在底部。在应用程序或数据之间导航的按钮通常放置在顶部命令栏，这也是你将在下一个练习中采用的方法。\n\
  \n* * *\n\n![Image](img/Image00005.jpg) 注意\n\n你可以在此处找到实现命令栏的微软指南：`[`msdn.microsoft.com/library/windows/apps/hh465302.aspx`](http://msdn.microsoft.com/library/windows/apps/hh465302.aspx)`。\n\
  \n* * *\n\n#### 为 Customers 表单添加“下一个”和“上一个”按钮\n\n#### 1. 在设计视图窗口中打开 `MainPage.xaml`\
  \ 文件。\n\n#### 2. 滚动到 XAML 格底部，并添加以下加粗显示的标记，紧挨在闭合的 `</Page>` 标签上方：\n\n点击此处查看代码图像\n\
  \n...\n\n```xml\n<Page.TopAppBar>\n  <CommandBar>\n    <AppBarButton x:Name=\"previousCustomer\"\
  \ Icon=\"Previous\"\n    Label=\"Previous\" Command=\"{Binding Path=PreviousCustomer}\"\
  />\n    <AppBarButton x:Name=\"nextCustomer\" Icon=\"Next\"\n    Label=\"Next\"\
  \ Command=\"{Binding Path=NextCustomer}\"/>\n  </CommandBar>\n</Page.TopAppBar>\n\
  ```\n\n在此段 XAML 标记中有几点需要注意：\n\n- 默认情况下，命令栏出现在屏幕顶部，并显示其包含的按钮的图标。每个按钮的标签仅在用户点击命令栏右侧显示的“更多\
  \ (...)...”按钮时才会显示。然而，如果你正在设计一个可能用于多种语言的应用程序，你不应该使用硬编码的值作为标签，而应该将这些标签的文本存储在特定语言的资源文件中，并在应用程序运行时动态绑定\
  \ `Label` 属性。如需更多信息，请访问微软网站上的“快速入门：翻译 UI 资源 (XAML)”页面：`[`msdn.microsoft.com/library/windows/apps/xaml/hh965329.aspx`](https://msdn.microsoft.com/library/windows/apps/xaml/hh965329.aspx)`。\n\
  \n- `CommandBar` 控件只能包含一组有限的控件（实现 `ICommandBarElement` 接口的控件）。该集合包括 `AppBarButton`、`AppBarToggleButton`\
  \ 和 `AppBarSeparator` 控件。这些控件专门设计用于在 `CommandBar` 中运行。如果你尝试将按钮等控件添加到命令栏中，你将收到错误消息“无法将指定的值分配给集合”。\n\
  \n- UWP 应用模板包含各种内置图标（如上面示例代码中的“上一个”和“下一个”），你可以将它们显示在 `AppBarButton` 控件上。你可以通过“属性\
  \ (Properties)”窗口浏览完整的可用内置图标集。在 `Icon` 部分，点击 `Symbol Icon`。可用的内置图标将出现在显示的列表框中。你也可以定义自己的图标和位图。\n\
  \n- 每个按钮都有一个 `Command` 属性，你可以将其绑定到实现 `ICommand` 接口的对象的。在此应用程序中，你已将按钮绑定到 `ViewModel`\
  \ 类中的 `PreviousCustomer` 和 `NextCustomer` 命令。当用户在运行时点击这些按钮中的任一个时，相应的命令将运行。\n\n####\
  \ 3. 在“调试 (Debug)”菜单中，点击“启动调试 (Start Debugging)”。\n\nCustomers 表单应该出现并显示 John Sharp\
  \ 的详情。命令栏应该显示在表单顶部，并包含“下一个”和“上一个”按钮，如下图所示：\n\n![Image](img/Image0021.jpg)\n\n注意，“上一个”按钮是不可用的。这是因为\
  \ `ViewModel` 的 `IsAtStart` 属性为 `true`，而“上一个”按钮引用的 `Command` 对象的 `CanExecute` 方法指示命令无法运行。\n\
  \n#### 4. 点击命令栏上的省略按钮。按钮标签应该出现。这些标签将一直显示，直到你点击命令栏上的任一个按钮。\n\n#### 5. 在命令栏上，点击“下一个\
  \ (Next)”。\n\n客户 2 Diana Sharp 的详情应该出现，在短暂的延迟（长达一秒）之后，“上一个”按钮应该变为可用。`IsAtStart`\
  \ 属性不再为 `true`，因此命令的 `CanExecute` 方法返回 `true`。然而，在计时器触发之前，按钮不会收到此更改通知。\n\n* * *\n\
  \n![Image](img/Image0005.jpg) 注意\n\n如果你需要对状态更改做出更即时的反应，可以让命令类中的计时器更频繁地过期。然而，频繁触发\
  \ `CanExecuteChanged` 事件可能会影响 UI 性能。\n\n* * *\n\n#### 6. 在命令栏上，点击“下一个 (Next)”。\n\
  \n#### 7. 客户 3 Francesca Sharp 的详情应该出现，在短暂延迟后，“下一个”按钮将不再可用。这一次，`ViewModel` 的 `IsAtEnd`\
  \ 属性为 `true`，因此 `CanExecute` 方法返回 `false`，命令禁用。\n\n#### 8. 调整窗口大小以窄视图显示应用程序，并验证应用程序继续正常运行。“下一个”和“上一个”按钮应该在客户列表中前后步进。\n\
  \n#### 9. 返回 Visual Studio 并停止调试。\n\n### 使用 Cortana 搜索数据\n\nWindows 10 应用的一个关键功能是与语音激活数字助手（也称为\
  \ Cortana）集成。通过 Cortana，你可以激活应用程序并向其传递命令。常见的需求是使用 Cortana 启动搜索请求，并让应用程序对此做出响应。应用程序可以将结果传回\
  \ Cortana 进行显示（称为*后台激活*），或者由应用程序本身显示结果（称为*前台激活*）。在本节中，你将扩展 Customers 应用以允许使用户按名称搜索特定客户。你可以将此示例扩展到其他属性，或者可能将搜索元素组合成更复杂的查询。\n\
  \n* * *\n\n![Image](img/Image00005.jpg) 注意\n\n本节的练习假设你已启用 Cortana。要执行此操作，点击 Windows\
  \ 任务栏上的搜索。在窗口左侧的工具栏，点击设置（齿轮图标）。在设置菜单中，将 Cortana 从关闭滑动到开启。\n\n![Image](img/Image00211.jpg)\n\
  \nCortana 还需要你使用 Microsoft 账户登录计算机，并在必要时提示你连接。此此要求是因为语音识别是由位于云端的外部服务处理的，而不是在你的本地设备上。\n\
  \n* * *\n\n为应用程序添加语音激活是一个三个阶段的过程：\n\n\n\n\n\n**1.** 创建一个语音命令定义（VCD）文件，描述你的应用程序可以响应的命令。这是一个作为应用程序的一部分部署的\
  \ XML 文件。\n\n**2.** 向 Cortana 注册语音命令。你通常在应用程序启动时执行此操作。在 Cortana 识别它之前，你必须至少运行一次应用程序。之后，如果\
  \ Cortana 将特定命令与你的应用程序关联起来，它将自动启动你的程序。为了避免词汇库混乱，如果应用程序几周内没有被激活，Cortana 将“忘记”与该程序关联的命令，这些命令需要重新注册才能被识别。因此，通常的做法是每次启动应用程序时都注册语音命令——以重置“忘记”计数器，并为程序提供额外的几周宽限期。\n\
  \n**3.** 在你的应用程序中处理语音激活。应用程序将接收来自 Cortana 关于触发程序激活的命令的信息。由你的代码负责解析此命令、提取任何参数并执行相应的操作。这是实现语音集成中最复杂的部分。\n\
  \n以下练习将使用 Customers 应用程序带你完成这一过程。\n\n### 为 Customers 应用程序创建语音命令定义（VCD）文件\n\n**1.**\
  \ 在 Visual Studio 中，打开文档文件夹中 `\\Microsoft Press\\VCSBS\\Chapter 26\\Cortana` 文件夹下的\
  \ Customers 项目。\n\n此版本的 Customers 应用程序具有与上一个练习中创建相同的 `ViewModel`，但数据源包含了更多客户的详细信息。客户信息仍然存储在\
  \ `List<Customer>` 对象中，但该对象是由 `DataSource.cs` 文件中的 `DataSource` 类创建的。`ViewModel`\
  \ 类引用此列表，而不是创建上一个练习中使用的三个客户的小集合。\n\n**2.** 在解决方案资源管理器中，右键点击 Customers 项目，指向“添加”（Add），然后点击“新建项”（New\
  \ Item）。\n\n**3.** 在“添加新项 – Customers”对话框中，在左侧窗格中点击 Visual C#。在中间窗格中滚动并选择 XML 文件模板。在“名称”框中输入\
  \ `CustomerVoiceCommands.xml`，然后点击“添加”，如下图像所示：\n\n![Image](img/Image00212.jpg)\n\
  \nVisual Studio 会生成一个默认的 XML 文件并在代码和文本编辑器窗口中打开它。\n\n**4.** 向 XML 文件中添加以下加粗显示的标记。\n\
  \n点击此处查看代码图像\n\n```xml\n<?xml version=\"1.0\" encoding=\"utf-8\"?>\n<VoiceCommands\
  \ xmlns=\"http://schemas.microsoft.com/voicecommands/1.2\">\n  <CommandSet xml:lang=\"\
  en-us\" Name=\"CustomersCommands\">\n    <CommandPrefix>Customers</CommandPrefix>\n\
  \    <Example>Show details of John Sharp</Example>\n  </CommandSet>\n</VoiceCommands>\n\
  ```\n\n语音命令定义在命令集中。每个命令集都有一个命令前缀（由 `CommandPrefix` 元素指定），Cortana 可用在运行时识别应用程序。命令前缀不需要与应用程序的名称相同。例如，如果你的应用程序名称很或包含数字字符，Cortana\
  \ 可能会难以识别它，因此你可以使用命令前缀提供一个更短且更易发音的别名。`Example` 元素包含一个显示用户如何调用应用程序的短语。\n\n![Image](img/Image0005.jpg)\n\
  \n注意：`CommandSet` 元素有一个 `Name` 属性。如果程序旨在在后台运行并将数据传回给 Cortana 显示，则应指定 `VoiceCommandService`\
  \ 元素而不是 `Navigate`。\n\n**5.** 如果你位于美国，将 `CommandSet` 的 `lang` 属性更改为 `en-us`。`ListenFor`\
  \ 元素用于 Cortana 应该调用此应用程序的请求。\n\n**6.** 向 `CommandSet` 添加以下加粗显示的 `Command` 和 `PhraseTopic`\
  \ 元素：\n\n点击此处查看代码图像\n\n```xml\n<?xml version=\"1.0\" encoding=\"utf-8\"?>\n<VoiceCommands\
  \ xmlns=\"http://schemas.microsoft.com/voicecommands/1.2\">\n  <CommandSet xml:lang=\"\
  en-us\" Name=\"CustomersCommands\">\n    <CommandPrefix>Customers</CommandPrefix>\n\
  \    <Example>Show details of John Sharp</Example>\n    <Command Name=\"showDetails\"\
  >\n      <Example>Show details of John Sharp</Example>\n      <ListenFor RequireAppName=\"\
  BeforeAfterPhrase\">show details of {customer}</ListenFor>\n      <ListenFor RequireAppName=\"\
  BeforeAfterPhrase\">details for {customer}</ListenFor>\n      <ListenFor RequireAppName=\"\
  BeforeAfterPhrase\">search for {customer}</ListenFor>\n      <Feedback>Looking for\
  \ {customer}</Feedback>\n      <Navigate/>\n    </Command>\n    <PhraseTopic Label=\"\
  customer\" Scenario=\"Search\">\n      <Subject>Person Names</Subject>\n    </PhraseTopic>\n\
  \  </CommandSet>\n</VoiceCommands>\n```\n\n你可以向命令集中添加一个或多个命令，每个命令都可以调用不同的操作。每个命令都有一个唯一的标识符（`Name`\
  \ 属性）。此标识符会被传递给 Cortana 调用的应用程序，以便应用程序能够确定用户说的是哪个命令，从而确定要执行哪种操作。\n\n如果用户在响应“我可以说什么？”（What\
  \ can I say?）查询时选择了你的应用程序，Cortana 将显示 `Example` 元素中的文本。Cortana 将为你应用程序所理解的每个命令显示示例短语。\n\
  \n\n\n\n`PhraseTopic` 元素用于在口语短语中定义占位符。`Label` 属性指定该元素与哪个占位符关联。在运行时，Cortana 将短语中此处所说的单词或多个单词替换到短语主题中。`Scenario`\
  \ 属性和 `Subject` 元素是的，它们为 Cortana 提供有关如何解释这些词的提示。在此示例中，这些词被用作搜索参数并代表人类。你可以指定其他场景，例如\
  \ `Short Message`（短消息）或 `Natural Language`（自然语言），在这种情况下 Cortana 可能会尝试以不同的方式解析这些词。你还可以指定其他主题，如地址、电话号码或城市和州。\n\
  \n**7.** 在文件菜单上，点击 `SaveCustomerVoiceCommands.xml`，然后关闭文件。\n\n**8.** 在解决方案管理器中，选择\
  \ `CustomerVoiceCommands.xml` 文件。在属性窗口中，将 `Copy To Output Directory`（复制到输出目录）属性更改为\
  \ `Copy If Newer`（较新复制）。此操作会导致 XML 文件在发生更改时复制到应用程序文件夹并随程序一起部署。\n\n下一步是在应用程序运行时向\
  \ Cortana 注册语音命令。你可以在 `App.xaml.cs` 文件中的 `OnLaunched` 方法代码中执行此操作。每当应用程序启动发生 `Launched`\
  \ 事件时，`OnLaunched` 方法就会触发。当应用程序关闭时，你可以保存有关应用程序状态的信息（例如，用户正在查看哪个客户），并可以使用此事件在应用程序重新启动时恢复应用程序状态（通过显示相同的客户）。你还可以使用此事件来执行每次运行应用程序都应该执行的操作。\n\
  \n### 向 Cortana 注册语音命令\n\n**1.** 在解决方案管理器中，展开 `App.xaml`，然后双击 `App.xaml.cs` 以在代码和文本窗口中显示该文件。\n\
  \n**2.** 在文件顶部的列表中添加以下 `using` 指令。\n\n点击此处查看代码图像\n\n```csharp\nusing Windows.Storage;\n\
  using Windows.ApplicationModel.VoiceCommands;\nusing System.Diagnostics;\n```\n\n\
  **3.** 找到 `OnLaunched` 方法并通过添加 `async` 修饰符来启用异步操作：\n\n点击此处查看代码图像\n\n```csharp\n\
  protected async override void OnLaunched(LaunchActivatedEventArgs e)\n{\n    ...\n\
  }\n```\n\n**4.** 将所示的加粗代码添加到 `OnLaunched` 方法的末尾：\n\n点击此处查看代码图像\n\n```csharp\nprotected\
  \ async override void OnLaunched(LaunchActivatedEventArgs e)\n{\n    ...\n    //\
  \ Ensure the current window is active\n    Window.Current.Activate();\n    try\n\
  \    {\n        var storageFile = await Package.Current.InstalledLocation.GetFileAsync(@\"\
  CustomerVoiceCommands.xml\");\n        await VoiceCommandDefinitionManager.InstallCommandDefinitionsFromStorageFileAsync(storageFile);\n\
  \    }\n    catch (Exception ex)\n    {\n        Debug.WriteLine($\"\"Installing\
  \ Voice Commands Failed: {ex.ToString()}\");\n    }\n}\n```\n\n第一个语句从应用程序文件夹检索包含语音命令定义的\
  \ XML 文件。然后将该文件传递给 `VoiceCommandDefinitionManager` 管理。该类提供了与操作系统交互的接口，用于注册和查询语音命令定义。静态方法\
  \ `InstallCommandDefinitionsFromStorageFileAsync` 注册在指定的存储文件中找到的语音命令。如果在此过程中发生异常，将记录异常，但允许应用程序继续运行（它只是不会对语音命令做出响应）。\n\
  \n最后一步是当 Cortana 识别用于应用程序的语音命令时，让应用程序做出响应。在这种情况下，你可以通过 `App` 类的 `OnActivated` 方法来捕获\
  \ `Activated` 事件。该方法传递一个类型为 `IActivatedEventArgs` 的参数，其中包含传递给应用程序的数据信息，包括任何语音激活命令的细节。\n\
  \n### 在 Customers 中处理语音激活\n\n**1.** 在代码和文本窗口中，将所示的 `OnActivated` 事件方法添加到 `App` 类的末尾：\n\
  \n点击此处查看代码图像\n\n```csharp\nprotected override void OnActivated(IActivatedEventArgs\
  \ args)\n{\n    base.OnActivated(args);\n}\n```\n\n此语句调用重写的 `OnActivated` 方法，以便在处理语音激活之前执行任何所需的默认激活处理。\n\
  \n**2.** 在 `OnActivated` 方法中添加所示的加粗 `if` 语句块：\n\n点击此处查看代码图像\n\n```csharp\nprotected\
  \ override void OnActivated(IActivatedEventArgs args)\n{\n    base.OnActivated(args);\n\
  \    if (args.Kind == ActivationKind.VoiceCommand)\n    {\n        var commandArgs\
  \ = args as VoiceCommandActivatedEventArgs;\n        var speechRecognitionResult\
  \ = commandArgs.Result;\n        var commandName = speechRecognitionResult.RulePath.First();\n\
  \    }\n}\n```\n\n此块确定应用程序是否由于语音命令的结果而被 Cortana 激活。如果是，则 `args` 参数将包含一个 `VoiceCommandActivatedEventArgs`\
  \ 对象。`Result` 属性包含一个 `speechRecognitionResult` 对象，该对象包含有关命令的信息。该对象中的 `RulePath`\
  \ 列表包含触发激活的短语元素，列表中的第一个项包含 Cortana 识别的命令名称。在 Customers 应用程序中，`CustomerVoiceCommands.xml`\
  \ 文件中定义的唯一命令是 `showDetailsOf` 命令。\n\n**3.** 在 `OnActivated` 方法中添加所示的加粗代码：\n\n点击此处查看代码图像\n\
  \n```csharp\nif (args.Kind == ActivationKind.VoiceCommand)\n{\n    ...\n    var\
  \ commandName = speechRecognitionResult.RulePath.First();\n    string customerName\
  \ = \"\";\n    switch (commandName)\n    {\n        case \"showDetailsOf\":\n  \
  \          customerName = speechRecognitionResult.SemanticInterpretation.Properties[\"\
  customer\"].FirstOrDefault();\n            break;\n        default:\n          \
  \  break;\n    }\n}\n```\n\n`switch` 语句验证语音命令是否为 `showDetailsOf` 命令。如果你添加更多语音命令，应该扩展此\
  \ `switch` 语句。如果语音数据包含某些未知命令，则将其忽略。\n\n`speechRecognitionResult` 对象的 `SemanticInterpretation`\
  \ 属性包含有关 Cortana 识别的短语属性的信息。Customers 应用程序的命令包括 `{customer}` 占位符，此代码获取用户说出并由 Cortana\
  \ 解释的该占位符的值。\n\n**4.** 将以下代码添加到 `OnActivated` 方法的末尾，位于 `switch` 语句之后：\n\n点击此处查看代码图像\n\
  \n```csharp\nFrame rootFrame = Window.Current.Content as Frame;\nif (rootFrame ==\
  \ null)\n{\n    rootFrame = new Frame();\n    rootFrame.NavigationFailed += OnNavigationFailed;\n\
  \    Window.Current.Content = rootFrame;\n}\nrootFrame.Navigate(typeof(MainPage),\
  \ customerName);\nWindow.Current.Activate();\n```\n\n这里的第一个块是模板代码，确保打开了一个窗口以显示页面。第二个块在此窗口中显示\
  \ `MainPage` 页面。`Frame` 对象的 `Navigate` 方法使 `MainPage` 成为活动页面。第二个参数作为对象传递，页面可以使用它来提供上下文信息。在此代码中，参数是包含客户名称的字符串。\n\
  \n**5.** 在代码和文本窗口中打开 `ViewModel.cs` 文件并找到 `ViewModel` 构造函数。构造函数中的代码经过了重构，初始化视图状态的语句已移动到名为\
  \ `_initializeState` 的独立方法中，如下所示：\n\n\n\n\n\n点击此处查看代码图像\n\n```csharp\npublic ViewModel()\n\
  {\n    _initializeState();\n    this.customers = DataSource.Customers;\n}\n\nprivate\
  \ void _initializeState()\n{\n    this.currentCustomer = 0;\n    this.IsAtStart\
  \ = true;\n    this.IsAtEnd = false;\n    this.NextCustomer = new Command(this.Next,\
  \ () =>\n    { return this.customers.Count > 1 && !this.IsAtEnd; });\n    this.PreviousCustomer\
  \ = new Command(this.Previous, () =>\n    { return this.customers.Count > 0 && !this.IsAtStart;\
  \ });\n}\n```\n\n**6.** 在 `ViewModel` 类中添加另一个构造函数。该构造函数应接收一个包含客户名称的字符串，并使用该名称过滤数据源中的记录，如下：\n\
  \n点击此处查看代码图像\n\n```csharp\npublic ViewModel(string customerName)\n{\n    _initializeState();\n\
  \    string[] names = customerName.Split(new[] {' '}, 2,\n    StringSplitOptions.RemoveEmptyEntries);\n\
  \    this.customers =\n    (from c in DataSource.Customers\n    where string.Compare(c.FirstName.ToUpper(),\
  \ names[0].ToUpper()) == 0 &&\n    (names.Length > 1 ?\n    string.Compare(c.LastName.ToUpper(),\
  \ names[1].ToUpper()) == 0 : true)\n    select c).ToList();\n}\n```\n\n客户名称可以包含两个部分：名和姓。`String`\
  \ 类的 `Split` 方法可以根据分隔符字符列表将字符串拆分为子字符串。在这种情况下，如果用户提供了由一个或多个空格字符分隔的名和姓，`Split` 方法将客户名称拆分成最多两个部分。结果存储在\
  \ `names` 数组中。LINQ 查询使用这些数据来查找所有名匹配 `names` 数组中第一个项且姓匹配 `names` 数组中第二个项的客户。如果用户指定了单个名称，`names`\
  \ 数组将只包含一个项，且 LINQ 查询将仅与名进行匹配。为了消除任何大小写敏感性，所有字符串比较都是针对字符串的大写版本进行的。匹配的客户列表被赋值给视图模型中的\
  \ `customers` 列表。\n\n**7.** 返回到代码和文本编辑器窗口中的 `MainPage.xaml.cs` 文件。\n\n**8.** 将此处所示\
  \ `OnNavigatedTo` 方法添加到 `MainPage` 类的末尾，紧接构造函数之后：\n\n点击此处查看代码图像\n\n```csharp\npublic\
  \ sealed partial class MainPage : Page\n{\n    public MainPage()\n    {\n      \
  \  ...\n    }\n\n    protected override void OnNavigatedTo(NavigationEventArgs e)\n\
  \    {\n        string customerName = e.Parameter as string;\n        if (!string.IsNullOrEmpty(customerName))\n\
  \        {\n            ViewModel viewModel = new ViewModel(customerName);\n   \
  \         this.DataContext = viewModel;\n        }\n    }\n}\n```\n\n当应用程序使用 `Navigate`\
  \ 方法显示（导航到）此页面时，会运行 `OnNavigatedTo` 方法。提供的任何参数都会出现在 `NavigationEventArgs` 参数的 `Parameter`\
  \ 属性中。此代码尝试将 `Parameter` 属性中的数据转换为字符串，如果成功，则将此字符串作为客户名称传递给 `ViewModel` 构造函数。生成的\
  \ `ViewModel`（应仅包含匹配此名称的客户）随后被设置为页面的数据上下文。\n\n**9.** 在生成（Build）菜单上，点击“生成解决方案”（Build\
  \ Solution），并验证解决方案成功编译。\n\n作为最后的润色，下一个练习将添加一组图标，Windows 10 和 Cortana 可以使用这些图标来视觉表示应用程序。这些图标比空白应用模板提供的默认灰白色交叉图像更丰富。\n\
  \n## 为 Customers 应用程序添加图标\n\n**1.** 在解决方案资源管理器（Solution Explorer）中，右键点击 `Assets`\
  \ 文件夹，指向“添加（Add），然后点击“现有项（Existing Item）”。\n\n**2.** 在“添加现有项 – Customers”对话框中，移动到你文档文件夹中的\
  \ `\\Microsoft Press\\VCSBS\\Chapter 26\\Resources` 文件夹，选择此文件夹中的三个 AdventureWorks\
  \ Logo 文件，然后点击“添加（Add）”。\n\n**3.** 在解决方案资源管理器中，双击 `Package.appxmanifest` 文件以在程序包设计器窗口中显示它。\n\
  \n**4.** 点击“视觉资产（Visual Assets）”选项卡。然后，在左窗格中点击“所有图像资产（All Image Assets）”。\n\n**5.**\
  \ 滚动到 `Square 150x150` Logo 部分。点击 `Scale 100` 图像正下省略号按钮，浏览到 `Assets` 文件夹，点击 `AdventureWorksLogo150x150.png`，然后点击“打开（Open）”。该资产的图像应显示在框中。\n\
  \n**6.** 按照步骤 5 相同的步骤，将 `Square 44x44` Logo 的 `Scale 100` 图像设置为 `Assets` 文件夹中的 `AdventureWorksLogo44x44.png`，并将启动屏幕的\
  \ `Scale 100` 图像更改为 `AdventureWorksLogo620x300.png`，同样在 `Assets` 文件夹中。\n\n**7.**\
  \ 点击调试菜单上的“无调试启动（Start Without Debugging）”来生成并运行。验证启动时会出现启动屏幕，然后显示客户 Gee 的详细信息。你可以像以前一样在客户列表中移动。**8.**\
  \ 关闭应用程序。\n\n现在可以测试语音激活由于你注册了语音命令\n\n## 测试搜索功能\n\n**1.** 激活 Cortana，然后说或输入以下查询：`Customers\
  \ show details for Brian` 注意无论你是说话还是输入，Cortana 将以相同的方式响应。Cortana 应该识别出此命令指向 Customers\
  \ 应用。随后将启动 Customers 应用并显示 Brian 的详细信息。\n\n**2.** 返回 Cortana，然后说或输入以下查询：`Search\
  \ for John in Customers` 现在应用程序找到了所有名为 John 的客户。返回了多个匹配，可以使用命令栏中的上一个和下一个在结果之间移动。\n\
  \n**3.** 尝试其他搜索。注意你可以使用“Search for ...”、“Show details for ...”和“Show details of\
  \ ...”格式，并将应用程序名称位于开头或结尾（以“in”为前）。注意如果你输入不同格式的查询，Cortana 将无法理解它，转而执行 Bing 搜索。\n\n\
  **4.** 完成后，返回 Visual Studio。\n\n## 为语音命令提供语音响应\n\n除了向应用程序发送语音命令外，你还可以让应用程序做出响应。为了实现这一点，UWP\
  \ 应用程序利用 Windows 10 提供的语音合成功能。此功能实际上相当简单，但有一个限制：应用程序只有在被说话时才应做出响应。如果用户是输入而不是说出，应用程序应该保持沉默。幸运的是，你可以通过检查执行命令语义解释后返回的\
  \ `commandMode` 属性来检测命令是说的还是输入的，如下：\n\n```csharp\nSpeechRecognitionResult speechRecognitionResult\
  \ = ...;\nstring commandMode = speechRecognitionResult.SemanticInterpretation.Properties[\"\
  commandMode\"].FirstOrDefault();\n```\n\n`commandMode` 属性的值将根据用户输入命令的方式包含“text”或“voice”。在接下来的练习中，你将使用此字符串来确定应用程序应该语音响应还是保持沉默。\n\
  \n### 为搜索请求添加语音响应\n\n**1.** 在 Visual Studio 中，打开 `App.xaml.cs` 文件并在代码和文本编辑器窗口中显示它。\n\
  \n**2.** 在 `OnActivated` 方法中，添加此处加粗的语句：\n\n\n\n\n\n```csharp\nprotected override\
  \ void OnActivated(IActivatedEventArgs args)\n{\n    ...\n\n    if (args.Kind ==\
  \ ActivationKind.VoiceCommand)\n    {\n        var commandArgs = args as VoiceCommandActivatedEventArgs;\n\
  \        var speechRecognitionResult = commandArgs.Result;\n        var commandName\
  \ = speechRecognitionResult.RulePath.First();\n        string commandMode = speechRecognitionResult.SemanticInterpretation.Properties[\"\
  commandMode\"].FirstOrDefault();\n        string customerName = \"\";\n        ...\n\
  \    }\n}\n```\n\n### 3. 在方法的末尾，修改调用 `Navigate` 方法的语句，将 `NavigationArgs` 对象作为第二个参数传入。该对象封装了客户名称和命令模式。\n\
  \n点击此处查看代码图像\n\n```csharp\nprotected override void OnActivated(IActivatedEventArgs\
  \ args)\n{\n    ...\n\n    if (args.Kind == ActivationKind.VoiceCommand)\n    {\n\
  \        ...\n\n        switch (commandName)\n        {\n            ...\n     \
  \   }\n        ...\n\n        rootFrame.Navigate(typeof(MainPage), new NavigationArgs(customerName,\
  \ commandMode));\n        Window.Current.Activate();\n    }\n}\n```\n\nVisual Studio\
  \ 将报告找不到 `NavigationArgs` 类型。这是因为 `NavigationArgs` 类型尚不存在；你需要先创建它。\n\n### 4. 在代码中右键点击\
  \ `NavigationArgs` 对象的引用，然后点击“快速操作”（Quick Actions）。在快速操作弹出窗口中，点击“在 Customers (在新文件中)\
  \ 中为 NavigationArgs 生成类”，如下所示：\n\n![Image](img/Image00215.jpg)\n\n此操作将创建一个名为 `NavigationArgs.cs`\
  \ 的新文件，其中包含一个带有名为 `commandMode` 和 `customerName` 私有字段的类，以及一个填充这些字段的公共构造函数。你必须修改此类以使字段对外部世界可见。实现此目标的最佳方法是将字段转换为只读属性。\n\
  \n### 5. 在解决方案管理器（Solution Explorer）中，双击 `NavigationArgs.cs` 文件，以在代码和文本编辑器窗口中显示它。\n\
  \n### 6. 修改 `commandMode` 和 `customerName` 字段，使其成为可以被应用程序中其他类型访问的只读字段，如下所示代码中的**粗体**所示：\n\
  \n点击此处查看代码图像\n\n```csharp\ninternal class NavigationArgs\n{\n    internal string\
  \ commandMode { get; }\n    internal string customerName { get; }\n\n    public\
  \ NavigationArgs(string customerName, string commandMode)\n    {\n        this.customerName\
  \ = customerName;\n        this.commandMode = commandMode;\n    }\n}\n```\n\n###\
  \ 7. 返回代码和文本编辑器窗口中的 `MainPage.xaml.cs` 并找到 `OnNavigatedTo` 方法。按如下方式修改该方法：\n\n点击此处查看代码图像\n\
  \n```csharp\nprotected override async void OnNavigatedTo(NavigationEventArgs e)\n\
  {\n    NavigationArgs args = e.Parameter as NavigationArgs;\n    if (args != null)\n\
  \    {\n        string customerName = args.customerName;\n        ViewModel viewModel\
  \ = new ViewModel(customerName);\n        this.DataContext = viewModel;\n      \
  \  if (args.commandMode == \"voice\")\n        {\n            if (viewModel.Current\
  \ != null)\n            {\n                await Say($\"Here are the details for\
  \ {customerName}\");\n            }\n            else\n            {\n         \
  \       await Say($\"{customerName} was not found\");\n            }\n        }\n\
  \    }\n}\n```\n\n注意，`Say` 方法尚未实现。你稍后将创建此方法。\n\n### 8. 在文件顶部的列表中添加以下 `using` 指令：\n\
  \n点击此处查看代码图像\n\n```csharp\nusing Windows.Media.SpeechSynthesis;\nusing System.Threading.Tasks;\n\
  ```\n\n### 9. 将所示的 `Say` 方法添加到 `MainPage` 类的末尾：\n\n点击此处查看代码图像\n\n```csharp\nprivate\
  \ async Task Say(string message)\n{\n    MediaElement mediaElement = new MediaElement();\n\
  \    var synth = new SpeechSynthesizer();\n    SpeechSynthesisStream stream = await\
  \ synth.SynthesizeTextToStreamAsync(message);\n    mediaElement.SetSource(stream,\
  \ stream.ContentType);\n    mediaElement.Play();\n}\n```\n\n`Windows.Media.SpeechSynthesis`\
  \ 命名空间中的 `SpeechSynthesizer` 类可以生成包含文本合成语音的媒体流。该流随后被传递给 `MediaElement` 对象并由其播放。\n\
  \n### 10. 在调试菜单上，点击“转调试运行”以生成并运行应用程序。\n\n### 11. 激活 Cortana，然后说以下查询：\n\n*Customers\
  \ show details for Brian Johnson*\n\nCortana 应该通过在 Customers 应用中显示 Brian Johnson\
  \ 的详情并说“Here are the details for Brian Johnson.”。\n\n### 12. 在 Cortana 搜索框中输入以下查询：\n\
  \n*Customers show details for John*\n\n验证这一次在显示了名字为 John 的客户列表后，应用程序是否保持静音。\n\n\
  ### 13. 尝试通过输入和语音执行其他查询进行实验。完成后关闭应用程序。\n\n## 总结\n\n在本章中，你学习了如何使用数据绑定在表单上显示数据。你看到了如何为表单设置数据上下文，以及如何通过实现\
  \ `INotifyPropertyChanged` 接口创建支持数据绑定的数据源。你还学习了如何使用模型-视图-视图（MVVM）模式创建 UWP 应用程序，并看到了如何将应用程序与\
  \ Cortana 集成。\n\n\n\n\n\n到目前为止，你使用的数据仅局限于嵌入在应用程序 `ViewModel` 中的简单集合。在现实世界中，应用程序显示和维护的数据更有可能存储在关系型数据库等数据源中。\n\
  \nUWP 应用程序无法使用微软提供的技术直接访问关系型数据库（尽管有一些第三方数据库解决方案）。这听起来可能是一项严格的限制，但这种限制有其合理之处。首先，它消除了\
  \ UWP 应用对外部资源可能的依赖，使应用程序成为一个独立的项，可以轻松地从 Windows Store 进行打包和下载，而不需要用户在计算机上安装和配置数据库管理系统。此外，许多\
  \ Windows 10 设备的资源受限，没有足够的内存或磁盘空间来运行本地数据库管理系统。然而，许多业务应用程序仍然有访问数据库的需求，为了应对这种场景，你可以使用\
  \ Web 服务。\n\nWeb 服务可以实现多种功能，但一种常见的场景是提供一个接口，应用程序可以通过它连接到远程数据源以检索和更新数据。Web 服务可以位于任何地方，从运行应用程序的计算机到托管在另一个大洲计算机上的\
  \ Web 服务器。只要你能连接到 Web 服务，就可以使用它来访问你的信息存储库。Microsoft Visual Studio 提供了模板和工具，让你能够快速、方便地构建\
  \ Web 服务。最简单的策略是基于使用 `Entity Framework` 生成的实体模型构建 Web 服务，如下所示：\n\n![Image](img/Image00217.jpg)\n\
  \n`Entity Framework`是一项强大的技术，通过你可以连接到关系型数据库。它可以减少大多数开发者为应用程序添加数据访问功能所需编写的代码量。这将是你开始的地方，但首先你需要设置\
  \ `AdventureWorks` 数据库，它包含了 AdventureWorks 客户的详情。\n\n***\n\n![Image](img/Image00005.jpg)\
  \ 注意\n\n书中没有足够的空间来详细介绍如何使用 `Entity Framework`，本节的练习仅引导你完成入门的最关键步骤。如果你想获取更多信息，请查看微软网站上\
  \ `http://msdn.microsoft.com/data/aa937723` 上的“Entity Framework”。\n\n***\n\n为了使场景更加真实，本章的练习将向你展示如何使用\
  \ `Microsoft Azure SQL Database` 在云端创建数据库，以及如何将 Web 服务部署到 Azure。这种架构在许多商业应用程序中常见，包括电子商务应用程序、移动银行服务，甚至视频流系统。\n\
  \n***\n\n![Image](img/Image00005.jpg) 注意\n\n练习要求你拥有 Azure 账户和订阅。如果你还没有 Azure 账户，可以在\
  \ `https://azure.microsoft.com/pricing/free-trial/` 注册免费试用账户。此外，Azure 要求你拥有一个有效的\
  \ Microsoft 账户以便与你的 Azure 账户关联。你可以在 `https://signup.live.com/` 注册 Microsoft 账户。\n\
  \n***\n\n### 创建 Azure SQL 数据库服务器并安装 AdventureWorks 示例数据库\n\n1. 使用网页浏览器，连接到 Azure\
  \ 门户 `https://portal.azure.com`。使用你的 Microsoft 账户登录。\n\n2. 在门户左侧的工具栏中，点击 `New`。\n\
  \n3. 在 Create 页面上，点击 `Data + Storage`，然后点击 `SQL Database`。\n\n4. 在 `SQL Database`\
  \ 格中，执行以下任务：\n\n   **a.** 在 `Name` 框中，输入 `AdventureWorks`。\n\n   **b.** 点击 `Server`，然后点击\
  \ `Create A New Server`。在 `New Server` 格中，为你的服务器输入一个唯一名称。（可以使用你的公司名称甚至你自己的名字——我使用了\
  \ `csharpstepbystep`。如果你输入的名称已被他人使用，你会收到警告，此时请输入另一个名称。）为管理员登录输入名称和密码（记下这些项目——我使用了\
  \ `JohnSharp`，但我不会告诉你是我的密码），选择离你最近的位置，然后点击 `OK`。\n\n   **c.** 点击 `Select Source`，然后点击\
  \ `Sample`。验证 `AdventureWorksLT [V12]` 已被选中。\n\n   **d.** 点击 `Pricing Tier`。在 `Choose\
  \ Your Pricing Tier` 格中，点击 `Basic` 然后点击 `Select`。（如果你是自己为数据库付费，这是最便宜的选项，并且足够完成本章的练习。如果你正在构建一个大型商业应用程序，你可能需要使用\
  \ `Premium` 定价层级，它提供了更大的空间和更高的性能，但成本更高。）下面的图片显示了这些设置。\n\n***\n\n![Image](img/Image00004.jpg)\
  \ 重要\n\n除非你想在月底收到一份可能巨大的账单，否则不要选择 `Basic` 以外的任何定价层级。有关 SQL Database 定价的信息，请参阅 `https://azure.microsoft.com/en-us/pricing/details/sql-database/`。\n\
  \n***\n\n![Image](img/Image00218.jpg)\n\n   **e.** 点击 `Create`，并等待数据库服务器和数据库的创建。你可以通过点击工具栏中的\
  \ `Notifications` 来监控进度。\n\n5. 在门户左侧的工具栏中，点击 `Browse All`。\n\n6. 在 Browse 页面，在 `All\
  \ Resources` 格中，点击你的数据库服务器（而不是数据库）。\n\n7. 在 `Database Server` 格上工具栏上，点击 `Settings`。\n\
  \n8. 在 `Settings` 格中，点击 `Firewall`，如下。\n\n![Image](img/Image00219.jpg)\n\n9. 在 `Firewall\
  \ Settings` 格的工具栏上，点击 `Add Client IP`。\n\n10. 点击 `Save`。验证出现“Successfully updated\
  \ server firewall rules”消息，然后点击 `OK`。\n\n***\n\n![Image](img/Image00005.jpg) 注意\n\
  \n这些步骤非常重要。没有这些步骤，你将无法从运行在你计算机上的应用程序连接到数据库。如果你需要为一组计算机开放访问权限，也可以创建跨越 IP 地址范围的防火墙。\n\
  \n***\n\n11. 关闭 `Firewall Settings` 格，关闭 `Settings` 格，然后关闭数据库服务器格。\n\n示例 `AdventureWorks`\
  \ 数据库在 `SalesRT` 架构中包含一个名为 `Customer` 的表。该表包含 `Customers` UWP 应用程序显示的数据列，以及其他几列。使用\
  \ `Entity Framework`，你可以选择忽略不相关的列，但如果你忽略的任何一列不允许为空且没有默认值，你将无法创建新客户。在 `Customer`\
  \ 表中，此限制适用于 `NameStyle`、`PasswordHash` 和 `PasswordSalt` 列（用于加密用户密码）。为了避免复杂性并让你专注于应用程序本身的功能，在下一个练习中，将从\
  \ `Customer` 表中删除这些列。\n\n### 从 AdventureWorks 数据库中删除不需要的列\n\n1. 在 Azure 门户中，在 `All\
  \ Resources` 格中，点击 `AdventureWorks` 数据库。\n\n2. 在 `AdventureWorks SQL Database` 格上工具栏上，点击\
  \ `Open In Visual Studio`。\n\n3. 在 `Open In Visual Studio` 格中，点击 `Open In Visual\
