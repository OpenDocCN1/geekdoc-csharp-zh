  \n# 27. 返回 Visual Studio 并停止调试。\n\n## 总结\n在本章中，你学习了如何创建和使用数组来处理数据。你了解了如何声明和初始化数组、访问数据、将数组作为参数以及从方法返回数组。你还学习了如何创建多维数组。\n\
  \n## 第 11 章 理解参数数组\n\n## 快速参考\n完成本章后，你将能够：\n- 使用 `params` 关键字编写可以接受任意数量参数的方法。\n\
  - 使用 `params` 关键字结合 `object` 类型编写可以接受任意数量任意类型参数的方法。\n- 解释接受参数数组的方法与接受可选参数的方法之间的区别。\n\
  \n### 重载——回顾\n*重载（Overloading）* 是在同一作用域内声明两个或多个同名方法的专业术语。当你需要对不同类型的参数执行相同操作时，重载方法非常有用。Microsoft\
  \ Visual C# 中重载的经典示例是 `Console.WriteLine` 方法。该方法被重载了无数次，以便你能够传递任何基本类型参数。以下代码示例说明了\
  \ `Console` 类中 `WriteLine` 方法的一些定义方式：\n\n\n\n\n\n```cs\nclass Console\n{\n    public\
  \ static void WriteLine(Int32 value)\n    public static void WriteLine(Double value)\n\
  \    public static void WriteLine(Decimal value)\n    public static void WriteLine(Boolean\
  \ value)\n    public static void WriteLine(String value)\n    ...\n}\n```\n\n***\n\
  \n![Image](img/Image00005.jpg) 注意\n\n`WriteLine` 方法的文档使用了 `System` 命名空间定义的结构类型作为其参数，而不是这些类型的\
  \ C# 别名。例如，打印 `int` 值的重载版本实际上取 `Int32` 作为参数。请参阅第 9 章“使用枚举和结构体创建值类型”，以获取结构类型及其到 C#\
  \ 别名映射的列表。\n\n***\n\n尽管重载非常有用，但它并没有涵盖所有情况。特别是，重载无法轻松处理参数类型未变但参数数量发生变化的情况。例如，如果你想向控制台写入许多值怎么办？你是否必须提供可以接受各种组合参数的\
  \ `Console.WriteLine` 版本、其他可以接受三个参数的版本，以此此类推？那会迅速变得繁琐。而且，这些重载方法的大量重复难道不会让你担心吗？确实应该。幸运的是，有一种方法可以编写接收可变数量参数的方法（*变长方法*）：你可以使用参数数组，它是通过使用\
  \ `params` 关键字声明的。\n\n要理解 `params` 数组如何解决这个问题，首先理解普通数组的用途和缺点是有帮助的。\n\n## 使用数组参数\n\
  \n假设你想写一个方法来确定作为参数的一组值中的最小值。一种方法是使用数组。例如，为了找到几个 `int` 值中的最小值，你可以写一个名为 `Min` 的静态方法，它带有一个表示\
  \ `int` 值数组的单个参数：\n\n点击此处查看代码图像\n\n```cs\nclass Util\n{\n    public static int Min(int[]\
  \ paramList)\n    {\n        // 验证调用者是否至少提供了一个参数。\n        // 如果没有，抛出 ArgumentException\
  \ 异常——在空列表中\n        // 找到最小值是不可能的。\n        if (paramList == null || paramList.Length\
  \ == 0)\n        {\n            throw new ArgumentException(\"Util.Min: not enough\
  \ arguments\");\n        }\n        // 将参数列表中找到的当前最小值设为第一个项\n        int currentMin\
  \ = paramList[0];\n        // 遍历参数列表，搜索是否有任何参数\n        // 小于 currentMin 中存储的值\n\
  \        foreach (int i in paramList)\n        {\n            // 如果循环找到了比 currentMin\
  \ 中存储\n            // 值更小的项，则将 currentMin 设置为该值\n            if (i < currentMin)\n\
  \            {\n                currentMin = i;\n            }\n        }\n    \
  \    // 循环结束后，currentMin 持有参数列表中\n        // 最小项的值，因此返回此值。\n        return currentMin;\n\
  \    }\n}\n```\n\n***\n\n![Image](img/Image00005.jpg) 注意\n\n`ArgumentException`\
  \ 类专门设计用于在提供的参数不符合方法要求时，由方法抛出。\n\n***\n\n要使用 `Min` 方法找到名为 `first` 和 `second` 的两个\
  \ `int` 变量的最小值，你可以这样写：\n\n```cs\nint[] array = new int[2];\narray[0] = first;\n\
  array[1] = second;\nint min = Util.Min(array);\n```\n\n要使用 `Min` 方法找到三个 `int` 变量（命名为\
  \ `first`、`second` 和 `third`）的最小值，你可以这样写：\n\n```cs\nint[] array = new int[3];\n\
  array[0] = first;\narray[1] = second;\narray[2] = third;\nint min = Util.Min(array);\n\
  ```\n\n你可以看到，这种解决方案避免了大量重载的需求，但它是付出了代价的：你必须编写额外的代码来填充你传递的数组。当然，如果你愿意，可以使用匿名数组，如下所示：\n\
  \n点击此处查看代码图像\n\n```cs\nint min = Util.Min(new int[] {first, second, third});\n```\n\
  \n然而，点在于你仍然需要创建并填充一个数组，而且语法可能会有点困惑。解决方案是使用 `params` 数组作为 `Min` 方法的参数，让编译器为你写出部分代码。\n\
  \n### 声明 `params` 数组\n\n使用 `params` 数组，你可以向方法传递可变数量的参数。你在定义方法参数时通过使用 `params` 关键字作为参数修饰符来指示\
  \ `params` 数组。例如，这里是 `Min`——这次它的数组参数被声明为 `params` 数组：\n\n点击此处查看代码图像\n\n```cs\nclass\
  \ Util\n{\n    public static int Min(params int[] paramList)\n    {\n        //\
  \ 代码与之前相同\n    }\n}\n```\n\n`params` 关键字对 `Min` 方法的作用是允许你使用任何数量的参数调用该方法，而无需担心创建数组。例如，要找到两个整数值的最小值，你只需要这样写：\n\
  \n点击此处查看代码图像\n\n```cs\nint min = Util.Min(first, second);\n```\n\n编译器将此调用翻译为类似下面的代码：\n\
  \n```cs\nint[] array = new int[2];\narray[0] = first;\narray[1] = second;\nint min\
  \ = Util.Min(array);\n```\n\n要找到三个整数值的最小值，你编写以下内容，编译器也会将其转换为：\n\n点击此处查看代码图像\n\n\
  ```cs\nint min = Util.Min(first, second, third);\n```\n\n编译器只需计算 `int` 参数的数量，创建一个对应的\
  \ `int` 数组，用参数填充数组，然后调用方法。\n\n***\n\n![Image](img/Image00005.jpg) 注意\n\n如果你是 C 或\
  \ C++ 程序员，你可能认出 `params` 是 `stdarg.h` 中 `varargs` 的类型安全等物。Java 也有变长参数机制，其工作方式与 C#\
  \ 中的 `params` 关键字相似。\n\n***\n\n关于 `params` 数组有几点需要注意：\n\n![Image](img/Image00001.jpg)\
  \ 你不能对多维数组使用 `params` 关键字。以下代码无法编译：\n\n点击此处查看代码图像\n\n```cs\npublic static int Min(params[,]\
  \ table);\n```\n\n![Image](img/Image00001.jpg) 你不能仅根据 `params` 关键字来重载方法。如示例所示，`params`\
  \ 关键字并不是方法签名的一部分。在这里，编译器在调用这些方法时无法区分它们：\n\n点击此处查看代码图像\n\n```cs\npublic static int\
  \ Min(int[] paramList);\npublic static int Min(params int[] paramList);\n```\n\n\
  ![Image](img/Image00001.jpg) 你不允许对 `params` 数组指定 `ref` 或 `out` 修饰符，如下所示：\n\n点击此处查看代码图像\n\
  \n```cs\npublic static int Min(ref params int[] paramList);\npublic static int Min(out\
  \ params int[] paramList);\n```\n\n![Image](img/Image00001.jpg) `params` 数组必须是最后一个参数。（这意味着每个方法只能有一个\
  \ `params` 数组。）考虑这个示例：\n\n点击此处查看代码图像\n\n```cs\npublic static int Min(params int[]\
  \ paramList, int i);\n```\n\n![Image](img/Image00001.jpg) 非 *params* 方法总是优先于 *params*\
  \ 方法。这意味着你仍然可以为常见情况创建方法的重载版本，如下例所示：\n\n\n\n\n\n点击此处查看代码图像\n\n```csharp\npublic static\
  \ int Min(int leftHandSide, int rightHandSide)\n\n...\n\npublic static int Min(params\
  \ int[] paramList)\n\n...\n```\n\n`Min` 方法的第一个版本在通过两个 `int` 参数调用它时使用。第二个版本在提供任何其他数量的\
  \ `int` 参数时使用。这包括在调用该方法时未提供任何参数的情况。添加一个非 `params` 数组的方法可能是一种有用的优化技术，因为编译器将不再需要创建并填充大量的数组。\n\
  \n## 使用 `params object[]`\n\n`int` 类型的参数数组非常有用。通过它，你可以在方法调用中传递任意数量的 `int` 参数。然而，如果不仅参数的数量会变化，而且参数的类型也发生变化呢？C#\
  \ 也有解决这个问题的方法。该技术基于两个事实：`object` 是所有类的根类型，并且编译器可以生成代码，通过“装箱”（boxing）将值类型（非类对象）转换为\
  \ `object`，正如第 8 章中“理解值和引用”所述的那样。你可以使用 `object` 类型的参数数组来声明一个接受任意数量 `object` 参数的方法，允许传递的参数是任何类型。请看这个示例：\n\
  \n点击此处查看代码图像\n\n```csharp\nclass Black\n{\n    public static void Hole(params object[]\
  \ paramList)\n    ...\n}\n```\n\n我将此方法命名为 `Black.Hole`，因为没有任何参数可以逃脱它：\n\n![图像](img/Image00001.jpg)\
  \ 你可以完全不给方法传递任何参数，在这种情况下，编译器将传递一个长度为 0 的对象数组：\n\n点击此处查看代码图像\n\n```csharp\nBlack.Hole();\n\
  // 转换为 Black.Hole(new object[0]);\n```\n\n![图像](img/Image00001.jpg) 你可以通过传递 `null`\
  \ 作为参数来调用 `Black.Hole` 方法。数组是一种引用类型，因此你被将数组初始化为 `null`：\n\n```csharp\nBlack.Hole(null);\n\
  ```\n\n![图像](img/Image00001.jpg) 你可以向 `Black.Hole` 方法传递一个实际数组。换句话说，你可以手动创建编译器生成的数组：\n\
  \n点击此处查看代码图像\n\n```csharp\nobject[] array = new object[2];\narray[0] = \"forty two\"\
  ;\narray[1] = 42;\nBlack.Hole(array);\n```\n\n![图像](img/Image00001.jpg) 你可以向 `Black.Hole`\
  \ 方法传递不同类型的参数，这些参数将自动封装在 `object` 数组中：\n\n点击此处查看代码图像\n\n```csharp\nBlack.Hole(\"\
  forty two\", 42);\n// 转换为 Black.Hole(new object[]{\"forty two\", 42});\n```\n\n\
  ### `Console.WriteLine` 方法\n\n`Console` 类包含许多个 `WriteLine` 方法的重载。其中一个重载形式如下：\n\n\
  点击此处查看代码图像\n\n```csharp\npublic static void WriteLine(string format, params object[]\
  \ arg);\n```\n\n尽管字符串插值已几乎让这个版本的 `WriteLine` 方法变得多余，但该重载在 C# 语言的早期版本中曾被频繁使用。该重载允许\
  \ `WriteLine` 方法支持一个包含数字占位符的格式参数，每个占位符可以在运行时替换为任何类型的变量（占位符 `{i}` 被替换为随其后的第 `i` 个变量）。以下是调用该方法的示例（变量\
  \ `fname` 和 `lname` 是 `string`，`mi` 是 `char`，`age` 是 `int`）：\n\n点击此处查看代码图像\n\n```csharp\n\
  Console.WriteLine(\"Forename:{0}, Middle Initial:{1}, Last name:{2}\", fname, mi,\
  \ age);\n```\n\n编译器将此调用转换为以下内容：\n\n点击此处查看代码图像\n\n```csharp\nConsole.WriteLine(\"\
  Forename:{0}, Middle Initial:{1}, Last name:{2}\", new object[]{fname, mi, age});\n\
