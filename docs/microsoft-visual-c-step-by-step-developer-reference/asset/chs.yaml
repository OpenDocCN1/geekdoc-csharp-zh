  \ 的日期，程序将 `result` 变量设置为 `1`。如果 `Year` 属性相同，程序需要比较月份。\n\n***\n\n![Image](img/Image00005.jpg)\
  \ 注意事项\n\n现在不要尝试构建应用程序。`dateCompare` 方法尚未完成，构建将会失败。\n\n***\n\n如果表达式 `leftHandSide.Year\
  \ < rightHandSide.Year` 为 `false` 且表达式 `leftHandSide.Year > rightHandSide.Year`\
  \ 也为 `false`，则两个日期的 `Year` 属性必须相同，因此程序需要比较每个日期中的月份。\n\n**11.** 在 `dateCompare` 方法体中添加以下语句。将它们输入在你在上中中输入的代码之后：\n\
  \n点击此处查看代码图像\n\n```csharp\nprivate int dateCompare(DateTime leftHandSide, DateTime\
  \ rightHandSide)\n{\n    ...\n    else if (leftHandSide.Month < rightHandSide.Month)\n\
  \    {\n        result = -1;\n    }\n    else if (leftHandSide.Month > rightHandSide.Month)\n\
  \    {\n        result = 1;\n    }\n}\n```\n\n这些语句比较月份的逻辑与上一步中比较年份的逻辑相似。\n\n\n\n\
  \n如果表达式 `leftHandSide.Month < rightHandSide.Month` 为 `false` 且表达式 `leftHandSide.Month\
  \ > rightHandSide.Month` 同样为 `false`，则两个日期的 `Month` 属性必须相同，因此程序最终需要比较每个日期的天。\n\n\
  ### 12. 在你前两个步骤中输入的代码之后，向 `dateCompare` 方法体中添加以下语句：\n\n点击此处查看代码图像\n\n```c\nprivate\
  \ int dateCompare(DateTime leftHandSide, DateTime rightHandSide)\n{\n...\nelse if\
  \ (leftHandSide.Day < rightHandSide.Day)\n{\nresult = -1;\n}\nelse if (leftHandSide.Day\
  \ > rightHandSide.Day)\n{\nresult = 1;\n}\nelse\n{\nresult = 0;\n}\nreturn result;\n\
  }\n```\n\n你现在应该识别出此逻辑中的模式了。\n\n如果 `leftHandSide.Day < rightHandSide.Day` 和 `leftHandSide.Day\
  \ > rightHandSide.Day` 均为 `false`，则两个变量中 `Day` 属性的值必须相同。为了程序逻辑能够运行到此处，`Month` 值和\
  \ `Year` 值也必须对应相同，因此两个日期相同，程序将 `result` 的值设置为 `0`。\n\n最后的语句返回存储在 `result` 变量中的值。\n\
