  \n### 16. 返回 Visual Studio 并停止调试。\n\n你可以通过检查任务对象的 `Status` 属性来确定任务是完成还是被取消。`Status`\
  \ 属性包含 `System.Threading.Tasks.TaskStatus` 枚举值。以下列表描述了你可能会遇到的一些状态（还有其他）：\n\n- `Created`:\
  \ 这是任务的初始状态。它已被创建但尚未调度运行。\n- `WaitingToRun`: 任务已调度但尚未开始运行。\n- `Running`: 任务正在由线程执行。\n\
  - `RanToCompletion`: 任务成功完成，没有未处理的异常。\n- `Canceled`: 任务在开始运行之前被取消，或者它确认了取消且未抛出异常。\n\
  - `Faulted`: 任务由于异常终止。\n\n在下一个练习中，你将尝试报告每个任务的状态，以便查看它们何时完成或被取消。\n\n***\n\n### 取消并行\
  \ For 或 ForEach 循环\n\n`Parallel.For` 和 `Parallel.ForEach` 方法没有提供让你直接访问已创建的 `Task`\
  \ 对象。事实上，你甚至不知道有多少个任务正在运行——.NET Framework 使用它自己的启发式算法，根据可用资源和计算机的当前负载计算出最佳数量。\n\n\
  \n\n\n\n如果你想提前停止 `Parallel.For` 或 `Parallel.ForEach` 方法，必须使用 `ParallelLoopState`\
  \ 对象。你指定作为循环体的方法必须包含一个额外的 `ParallelLoopState` 参数。`Parallel` 类会创建一个 `ParallelLoopState`\
  \ 对象，并将其作为此参数传递给方法。`Parallel` 类使用此对象来保存有关每次方法调用的信息。该方法可以调用此对象的 `Stop` 方法，以指示 `Parallel`\
  \ 类不应尝试执行任何已启动并完成的迭代之外的。下面的示例显示了 `Parallel.For` 方法在每次迭代中调用 `doLoopWork` 方法。`doLoopWork`\
  \ 方法检查迭代变量；如果它大于 600，则该方法调用 `ParallelLoopState` 参数的 `Stop` 方法。这将导致 `Parallel.For`\
  \ 方法停止运行循环的后续迭代。（当前正在运行的迭代可能会继续运行完成。）\n\n![Image](img/Image00005.jpg) **注意**\n\n\
  请记住，`Parallel.For` 循环中的迭代并不是按照特定顺序运行的。因此，当迭代变量值为 600 时取消循环，并不能之前的 599 次迭代已经运行。同样，某些值大于\
  \ 600 的迭代可能已经完成。\n\n点击此处查看代码图像\n\n```csharp\nParallel.For(0, 1000, doLoopWork);\n\
  \n...\n\nprivate void doLoopWork(int i, ParallelLoopState p)\n{\n    ...\n    if\
  \ (i > 600)\n    {\n        p.Stop();\n    }\n}\n```\n\n### 显示每个任务的状态\n\n**1.**\
  \ 在 Visual Studio 中，在设计视图（Design View）窗口中显示 `MainPage.xaml` 文件。在 XAML 格中，在倒数第二个\
