  \ != secondDate: True\nfirstDate < secondDate: True\nfirstDate <= secondDate: True\n\
  firstDate > secondDate: False\nfirstDate >= secondDate: False\n```\n\n再次，这些是第一个日期早于第二个日期时的正确结果。\n\
  \n### 16. 测试其他日期，并验证结果是否符合预期。完成后，返回 Visual Studio 2015 并停止调试。\n\n***\n\n## 在真实世界应用中比较日期\n\
  \n现在你已经看到了了如何使用一系列相当长且复杂的 `if` 和 `else` 语句，我应该提到，这并不是你在在真实世界应用中比较日期时会采用的技巧。如果你查看上一个练习中的\
  \ `dateCompare` 方法，你会发现两个参数 `leftHandSide` 和 `rightHandSide` 是 `DateTime` 值。你编写的逻辑只比较了这些参数的日期部分，但它们还包含一个你没有考虑（或显示）的时间元素。要使两个\
  \ `DateTime` 值被视为相等，它们不仅应该具有相同的日期，还应该具有相同的时间。比较日期和时间是一个如此常见的操作，以至于 `DateTime` 类型实际上内置了一个名为\
  \ `Compare` 的方法专门用于此：它接受两个 `DateTime` 参数并对它们进行比较，返回一个值指示第一个参数是否小于第二个（在这种情况下结果将为负）；第一个参数是否大于第二个（在这种情况下结果将为正）；或两个参数是否代表相同的日期和时间（在这种情况下结果将为\
  \ 0）。\n\n***\n\n# 使用 `switch` 语句\n\n有时当你编写级联的 `if` 语句时，每个 `if` 语句看起来都很相似，因为它们都在评估一个相同的表达式。唯一的区别是每个\
  \ `if` 都会将表达式的结果与不同的值进行比较。例如，考虑以下代码块，它使用 `if` 语句来检查 `day` 变量的值并确定它是星期几哪几：\n\n```csharp\n\
  if (day == 0)\n{\ndayName = \"Sunday\";\n}\nelse if (day == 1)\n{\ndayName = \"\
  Monday\";\n}\nelse if (day == 2)\n{\ndayName = \"Tuesday\";\n}\nelse if (day ==\
  \ 3)\n{\n...\n}\nelse\n{\ndayName = \"Unknown\";\n}\n```\n\n在这些情况下，你可以将级联的 `if`\
  \ 语句重写为 `switch` 语句，使你的程序更高效且具可读性。\n\n#### 理解 `switch` 语句语法\n\n`switch` 语句的语法如下（`switch`、`case`\
  \ 和 `default` 是关键字）：\n\n点击此处查看代码图像\n\n```csharp\nswitch ( controllingExpression\
  \ )\n{\ncase constantExpression :\n    statements\n    break;\ncase constantExpression\
  \ :\n    statements\n    break;\n...\ndefault :\n    statements\n    break;\n}\n\
  ```\n\n`controllingExpression` 必须括在括号内，会被计算一次。然后控制跳转到由 `constantExpression` 确定的代码块。`constantExpression`\
  \ 等于 `controllingExpression`。执行持续到 `break` 语句，此时 `switch` 语句结束；`constantExpression`\
  \ 标识符称为 `case` 标签。如果 `controllingExpression` 不匹配任何 `constantExpression` 值且没有 `default`\
  \ 标签，程序继续执行 `switch` 语句括号后的第一个语句。如果有 `default` 标签，其下方的语句将执行。\n\n***\n\n![Image](img/Image00005.jpg)\
  \ 注意\n\n每个 `constantExpression` 值必须是唯一的。也就是说，两个 `case` 标签不能具有相同的值。\n\n你可以通过提供一组\
  \ `case` 标签且没有中间语句，来指定为多个值运行相同的语句，在这种情况下，最后一个标签的代码将适用于列表中的所有情况。然而，如果一个标签有一个或多个关联语句，执行无法穿透到后续标签；在这种情况下，编译器会生成错误。以下代码片段说明了这些点：\n\
  \n点击此处查看代码图像\n\n```csharp\nswitch (trumps)\n{\ncase Hearts :\ncase Diamonds : //\
  \ 允许穿透 - 标签间没有代码\n    color = \"Red\"; // Hearts 和 Diamonds 执行\n    break;\ncase\
  \ Clubs :\n    color = \"Black\";\ncase Spades : // 错误 - 标签间有代码\n    color = \"\
  Black\";\n    break;\n}\n```\n\n***\n\n所以，你可以将之前的级联 `if` 语句重写为以下 `switch` 语句：\n\n\
  ```csharp\nswitch (day)\n{\ncase 0 :\n    dayName = \"Sunday\";\n    break;\ncase\
  \ 1 :\n    dayName = \"Monday\";\n    break;\ncase 2 :\n    dayName = \"Tuesday\"\
  ;\n    break;\n...\ndefault :\n    dayName = \"Unknown\";\n    break;\n}\n```\n\n\
  ## 遵循 `switch` 语句规则\n\n`switch` 语句非常有用，但遗憾的是，你并不总能在需要的时候使用它。你编写的任何 `switch` 语句必须遵守以下规则：\n\
  \n![Image](img/Image00001.jpg) 你只能对某些数据类型使用 `switch`，例如 `int`、`char` 或 `string`。对于任何其他类型（包括\
  \ `float` 和 `double`），你必须使用 `if` 语句。\n\n![Image](img/Image00001.jpg) `case` 标签必须是常量表达式，例如，如果\
  \ `switch` 数据类型是 `int`，则为 42；如果 `switch` 数据类型是 `char`，则为 ‘4’；如果 `switch` 数据类型是 `string`，则为\
  \ “42”。如果你需要在运行时计算你的 `case` 标签值，你必须使用 `if` 语句。\n\n\n\n\n\n`break` 语句是停止贯穿（fall-through）最常见的方法，但你也可以使用\
  \ `return` 语句退出包含 `switch` 语句的方法，或者使用 `throw` 语句生成异常并终止 `switch` 语句。`throw` 语句在第\
  \ 6 章 中介绍，“管理错误和异常。”\n\n## switch 贯穿规则\n\n因为如果在两个 `case` 标签之间存在任何中间代码，你就不会意外地从一个标签贯穿到下一个，所以你可以自由地重新排列\
  \ `switch` 语句的各个部分而不影响其含义（包括 `default` 标签，按照惯例，它通常——但不必——被放在最后一个标签）。\n\nC 和 C++\
  \ 程序员应该注意，`switch` 语句中的每个 `case` 必须强制使用 `break` 语句（即使是 `default` 情况）。这一要求是一件好事——在\
  \ C 或 C++ 程序中，忘记写 `break` 语句是很常见的，这会导致执行贯穿到下一个标签，从而引发难以发现的错误。\n\n如果你真的想这样做，可以使用\
  \ `goto` 语句跳转到下一个 `case` 或 `default` 标签，在 C# 中模拟 C/C++ 的贯穿行为。不过，通常不建议使用 `goto`，而且本书也不会向你展示如何这样做。\n\
  \n在接下来的练习中，你将完成一个程序，该程序读取字符串的字符并将每个字符映射到其 XML 表示形式。例如，左角括号字符 (<) 在 XML 中具有特殊含义（用于构建元素）。如果你有包含此字符的数据，则必须将其转换为文本实体\
  \ `&lt;`，这样 XML 处理器就知道它是数据而不是 XML 指令的一部分。类似的规则也适用于右角括号 (`>`)、安培符号 (`&` )）、单引号（‘`）和双引号（“`）字符。你将编写一个\
  \ `switch` 语句来测试字符的值，并将特殊的 XML 字符捕获 `case` 标签。\n\n### 编写 switch 语句\n\n1. 如果 Visual\
  \ Studio 2015 运行，请启动它。\n2. 打开 `SwitchStatement` 项目，该项目位于你文档文件夹中的 `\\Microsoft Press\\\
  VCSBS\\Chapter 4\\SwitchStatement` 文件夹下。\n3. 在调试 菜单上，点击启动调试。Visual Studio 2015 会生成并运行应用程序。该应用程序显示一个包含两个文本框的表单，两个文本框之间有一个\
  \ Copy 按钮。\n4. 在上方文本框中输入以下示例文本：\n`inRange = (lo <= number) && (hi >= number);`\n\
  5. 点击 Copy。该语句逐字地复制到下方的文本框中，且不对 `<`, `&` 或 `>` 字符进行任何翻译，如下屏所示。\n   ![Image](img/Image00053.jpg)\n\
  6. 回到 Visual Studio 2015 并停止调试。\n7. 在代码和文本编辑器中显示 `MainPage.xaml.cs` 的代码并找到 `copyOne`\
  \ 方法。`copyOne` 方法将指定作为输入参数的字符复制到下方文本框显示文本的末尾。目前，`copyOne` 包含一个带有单一 `default` 动作的\
  \ `switch` 语句。在接下来的几步中，你将修改此 `switch` 语句，将 XML 中有意义的字符转换为它们的 XML 映射。例如，`<` 字符将被转换为字符串\
  \ `&lt;`。\n8. 在 `switch` 语句左大括号之后、`default` 标签之前，添加以下加粗显示的语句：\n\n```csharp\nswitch\
  \ (current)\n{\ncase '<' :\n    target.Text += \"&lt;\";\n    break;\ndefault:\n\
  \    target.Text += current;\n    break;\n}\n```\n如果正在复制的当前字符是左角括号 (<)，则前面的代码会将字符串\
  \ \"&lt;\" 追加到其位置的输出文本中。\n9. 在你刚刚添加的 `break` 语句之后、`default` 标签之前，向 `switch` 语句中添加以下语句：\n\
  ```csharp\ncase '>' :\n    target.Text += \"&gt;\";\n    break;\ncase '&' :\n  \
  \  target.Text += \"&amp;\";\n    break;\ncase '\\\"' :\n    target.Text += \"&#34;\"\
  ;\n    break;\ncase '\\'' :\n    target.Text += \"&#39;\";\n    break;\n```\n  \
  \ ![Image](img/Image00005.jpg) 注意：单引号（‘）和双引号（“）在 C# 中具有特殊含义——它们用于界定字符和字符串常量。最后两个\
  \ `case` 标签中的反斜杠 (`\\`) 是转义字符，它导致 C# 编译器将这些字符视为字量而不是分隔符。\n10. 在调试 菜单上，点击启动调试。\n\
  11. 在上方文本框中输入以下文本：\n`inRange = (lo <= number) && (hi >= number);`\n12. 点击 Copy。该语句被复制到下方文本框中。这次，每个字符都经历了\
  \ `switch` 语句中实现的 XML 映射。目标文本框显示以下文本：\n`inRange = (lo &lt;= number) &amp;&amp; (hi\
  \ &gt;= number);`\n13. 使用其他字符串进行实验，并验证 `<`, `>`, `&` 和 `\"` 是否被正确处理。\n14. 回到 Visual\
  \ Studio 并停止调试。\n\n## 总结\n在本章中，你学习了布尔表达式。你了解了如何使用 `if` 和 `switch` 语句进行决策，并通过使用运算符组合了布尔表达式![Image](img/Image0001.jpg)\
  \ 如果你想继续，请转到第 5 章，“复合赋值和迭代](#text00010.html_ch05)。”\n\n## 第 5 章复合赋值和迭代\n\n完成本章后，你将能够：\n\
  - 使用复合赋值运算符更新变量的值。\n- 编写 `while`、`for` 和 `do` 迭代语句。\n- 执行 `do` 语句并观察值的变化。\n\n第 4\
  \ 章，“决策语句](#text00009.html_ch04)”演示了如何使用 `if` 和 `switch` 结构选择性地运行语句。在本章中，你将看到如何使用各种迭代（或*循环*）语句来重复运行一个或多个语句。\n\
  \n编写迭代语句时，通常需要控制迭代的次数。你可以通过使用变量、在每次迭代时更新其值并在变量达到特定值时停止过程来实现。为了简化这一过程，我们将从学习在这些情况下更新变量值的特殊赋值运算符开始。\n\
  \n## 使用复合赋值运算符\n\n你已经看到过如何使用算术运算符创建新值。例如，以下语句使用加法运算符 (`+` )向控制台输出一个比变量 `answer`\
  \ 大 42 的值：\n\n点击查看代码图像\n```csharp\nConsole.WriteLine(answer + 42);\n```\n\n你看到过如何使用赋值语句来更改变量的值。以下语句使用赋值运算符\
  \ (`=` ) 将 `answer` 的值更改为 42：\n\n```csharp\nanswer = 42;\n```\n\n如果你想给变量加上 42，可以组合赋值运算符和加法运算符。例如，以下语句将\
  \ 42 加到 `answer`。在该语句运行后，`answer` 的值比之前增加了 42：\n\n```csharp\nanswer = answer + 42;\n\
  ```\n\n\n\n\n\n虽然这个语句可以工作，但你可能永远不会看到经验丰富的程序员这样写代码。给变量增加值是一个非常常见的操作，因此 `C#` 提供了一种方法，让你通过使用运算符\
  \ `+=` 以一种简便的方式完成此任务。要向 `answer` 添加 `42`，你可以编写以下语句：\n\n```csharp\nanswer += 42;\n\
  ```\n\n你可以如表所示，使用这种表示符号将任何算术运算符与赋值运算符结合。这些运算符统称为`复合赋值运算符`（compound assignment operators）。\n\
  \n![Image](img/Image00055.jpg)\n\n* * *\n\n![Image](img/Image00013.jpg)  提示\n\n\
  复合赋值运算符与简单赋值运算符（`=`）具有相同的优先级和从右的结合性。\n\n* * *\n\n`+=` 运算符也适用于字符串；它将一个字符串附加到另一个字符串的末尾。例如，以下代码会在控制台上显示“Hello\
  \ John”：\n\n```csharp\nstring name = \"John\";\nstring greeting = \"Hello \";\n\
  greeting += name;\nConsole.WriteLine(greeting);\n```\n\n你不能在字符串上使用任何其他的复合赋值运算符。\n\
  \n* * *\n\n![Image](img/Image00013.jpg)  提示\n\n当将变量加或减 1 时，请使用递增（`++`）和递减（`--`）运算符代替复合赋值运算符。例如，将\n\
  \n```csharp\ncount += 1;\n```\n\n替换为\n\n```csharp\ncount++;\n```\n\n* * *\n\n###\
  \ while 语句\n\n你使用 `while` 语句在条件为真时反复运行某个语句。`while` 语句的语法如下：\n\n```csharp\nwhile\
  \ ( booleanExpression )\nstatement\n```\n\n布尔表达式（必须在括号内）会被求值，如果为真，则执行该语句，然后再次求布尔表达式。如果表达式仍然为真，则重复该语句，然后再次求布尔表达式。这个过程一直持续，直到布尔表达式求值为假，此时\
  \ `while` 语句退出。随后执行程序将从 `while` 语句之后的第一个语句继续。`while` 语句与 `if` 语句具有以下语法上的相似性（事实上，除了关键字外，语法是完全相同的）：\n\
  \n![Image](img/Image00001.jpg)  表达式必须是一个布尔表达式。\n\n![Image](img/Image00001.jpg) \
  \ 布尔表达式必须写在括号内。\n\n![Image](img/Image00001.jpg)  如果布尔表达式在第一次求值时为假，则语句不执行。\n\n![Image](img/Image00001.jpg)\
  \  如果你想在 `while` 语句的控制下执行两个多个语句，必须使用大括号将这些语句分组在一个块中。\n\n这是一个向控制台写入值 0 到 9 的 `while`\
  \ 语句。请注意，一旦变量 `i` 达到值 10，`while` 语句就会结束，语句块中的代码就不会执行：\n\n```csharp\nint i = 0;\n\
  while (i < 10)\n{\n    Console.WriteLine(i);\n    i++;\n}\n```\n\n所有的 `while` 语句都应该在某个点终止。初学者的一个常见错误是忘记包含一个语句使布尔表达式最终求值为假并终止循环，这会导致程序无限运行。在示例中，`i++;`\
  \ 语句就起到了这一作用。\n\n* * *\n\n![Image](img/Image00005.jpg)  注意\n\n`while` 循环中的变量 `i`\
  \ 控制循环执行的次数。这是一种常见的用法，执行此角色的变量有时被称为`哨兵`（sentinel）变量。你也可以创建嵌套循环（一个循环内部循环），在这种情况下，通常会将这种命名模式扩展，使用字母\
  \ `j`、`k` 甚至 `l` 作为控制这些循环迭代的哨兵变量名。\n\n* * *\n\n* * *\n\n![Image](img/Image00013.jpg)\
  \  提示\n\n与 `if` 语句一样，建议在使用 `while` 语句时始终使用代码块，即使该块只包含一个语句。这样，如果你以后决定向 `while` 结构的主体中添加更多语句，就很清楚你应该将它们添加到块中。如果你不这样做，只有紧跟在\
  \ `while` 结构中布尔表达式之后的第一个语句将作为循环的一部分执行，从而导致难以察觉的错误，例如：\n\n```csharp\nint i = 0;\n\
  while (i < 10)\nConsole.WriteLine(i);\ni++;\n```\n\n这段代码将无限迭代，显示无限数量的零，因为只有 `Console.WriteLine`\
  \ 语句——而不是 `i++;` 语句——作为 `while` 结构的一部分执行。\n\n* * *\n\n在下面的练习中，你将编写一个 `while` 循环逐行遍历文本文件的内容，并将每行写入表单的文本框中。\n\
  \n### 编写 while 语句\n\n**1.** 使用 Microsoft Visual Studio 2015 打开 `WhileStatement`\
  \ 项目，它位于“文档”文件夹中的 `Microsoft Press\\VCSBS\\Chapter 5\\WhileStatement` 文件夹中。\n\n\
  **2.** 在“调试”菜单上，点击“启动调试”。\n\nVisual Studio 2015 将生成并运行该应用程序。该应用程序是一个简单的文本文件查看器，你可以用它选择文本文件并显示其内容。\n\
  \n**3.** 点击“打开文件”。\n\n出现文件选择器并显示“文档”文件夹中的文件，如下文所示。\n\n![Image](img/Image00056.jpg)\n\
  \n你可以使用此对话框来选择文件。\n\n**4.** 移动到你“文档”文件夹中的 `Microsoft Press\\VCSBS\\Chapter 5\\WhileStatement`。\n\
  \n**5.** 选择文件 `MainPage.cs`，然后点击“打开”。\n\n文件名 `MainPage.cs` 出现在表单顶部的文本框中，但文件内容并没有显示。这是因为你还没有实现读取并显示文件的代码。\n\
  \n**6.** 返回到 Visual Studio 2015 并停止调试。\n\n**7.** 在代码窗口中显示文件的代码，并找到 `openFileClick`\
  \ 方法。\n\n当用户点击“打开”按钮选择文件时，此方法会运行。目前你不需要理解此方法的确切细节——只需接受该方法会提示用户选择文件（使用 `FileOpenPicker`\
  \ 或 `OpenFileDialog` 窗口）并打开文件进行读取。\n\n然而，`openFileClick` 方法的最后两个语句是重要的。它们如下：\n\n\
  ```csharp\nTextReader reader = new StreamReader(inputStream.AsStreamRead());\ndisplayData(reader);\n\
  ```\n\n第一个语句声明了一个名为 `reader` 的 `TextReader` 变量。`TextReader` 是 .NET 提供的一个类，你可以它从文件等源读取字符流。它位于\
  \ `System.IO` 命名空间。此语句使得用户在 `FileOpenPicker` 中指定的文件数据对 `TextReader` 对象可用，随后该对象可以用于读取数据。最后一个语句调用了名为\
  \ `displayData` 的方法，并将 `reader` 作为参数传递给该方法。`displayData` 方法通过 `reader` 对象读取数据并显示在屏幕上（一旦你编写了实现此操作的代码它就会这样做）。\n\
  \n**8.** 检查 `displayData` 方法。它目前如下：\n\n```csharp\nprivate void displayData(TextReader\
  \ reader)\n{\n    // TODO: add while loop here\n}\n```\n\n你可以看到，除了注释外，该方法是空的。你需要在这里添加获取和显示数据的代码。\n\
  \n**9.** 将 `// TODO: add while loop here` 注释替换为以下语句：\n\n```csharp\nsource.Text =\
  \ \"\";\n```\n\n\n\n\n\n`source` 变量指向表单上的大型文本框。将它的 `Text` 属性设置为空字符串（`\"\"`）可以清除此文本框中当前显示的任何文本。\n\
  \n**10.** 在你之前添加到 `displayData` 方法的上一行代码之后，添加以下语句：\n\n点击此处查看代码图像\n\n```cs\nstring\
  \ line = reader.ReadLine();\n```\n\n此语句声明了一个名为 `line` 的 `string` 变量，并调用 `reader.ReadLine`\
  \ 方法从文件中读取第一行并存入该变量。该方法返回文件中的下一行文本，或者在没有更多行可读时返回一个名为 `null` 的特殊值。\n\n**11.** 在 `displayData`\
  \ 方法中，紧接在你刚刚输入的代码之后，添加以下语句：\n\n点击此处查看代码图像\n\n```cs\nwhile (line != null)\n{\n  \
  \  source.Text += line + '\\n';\n    line = reader.ReadLine();\n}\n```\n\n这是一个 `while`\
  \ 循环，它逐行遍历文件，直到没有更多可用行为止。\n\n`while` 循环开始处的布尔表达式检查 `line` 变量的值。如果它不是 `null`，循环体会将当前行文本追加到\
  \ `source` 文本框的 `Text` 属性中，并附带一个换行符（`'\\n'`——由于 `TextReader` 对象的 `ReadLine` 方法在读取每行时会剥离换行符，因此代码需要将其重新加上）。然后，`while`\
  \ 循环在执行下一次迭代之前读取下一行文本。当文件中没有更多文本可读且 `ReadLine` 方法返回 `null` 值时，`while` 循环结束。\n\n\
  **12.** 在 `while` 循环结束的大括号之后，输入以下语句：\n\n```cs\nreader.Dispose();\n```\n\n此语句释放与文件相关的资源并将其关闭。这是一个良好的习惯，因为它允许其他应用程序使用该文件，并释放了访问文件时使用的任何内存和其他资源。\n\
  \n**13.** 在 Debug（调试）菜单上，点击 Start Debugging（启动调试）。\n\n**14.** 当表单出现时，点击 Open File（打开文件）。\n\
  \n**15.** 在打开文件选择器或对话框中，移动到文档文件夹中的 `\\Microsoft Press\\VCSBS\\Chapter 5\\WhileStatement\\\
  WhileStatement` 文件夹，选择 `MainPage.xaml.cs` 文件，然后点击 Open（打开）。\n\n***\n\n![Image](img/Image00005.jpg)\
  \ 注意\n\n不要尝试打开不包含文本的文件。如果你尝试打开一个可执行程序或图形文件，应用程序将仅显示该文件中二进制信息的文本表示。如果文件很大，可能会挂起应用程序，需要你强制终止它。\n\
  \n***\n\n这一次，所选文件的内容出现在文本框中——你应该认出你一直在编辑的代码。下面的图像显示了正在运行应用程序：\n\n![Image](img/Image00057.jpg)\n\
  \n**16.** 滚动文本框中的文本并找到 `displayData` 方法。验证该方法包含你刚刚添加的代码。\n\n**17.** 返回 Visual Studio\
  \ 并停止调试。\n\n## 编写 `for` 语句\n\n在 C# 中，大多数 `while` 语句具有以下通用结构：\n\n```cs\ninitialization\n\
  while (Boolean expression)\n{\n    statement\nupdate control variable\n}\n```\n\n\
  C# 中的 `for` 语句通过结合初始化、布尔表达式和更新控制变量的代码，提供了这种构造的更正式的版本。你会发现 `for` 语句非常有用，因为在 `for`\
  \ 语句中，很难不小心漏掉初始化或更新控制变量的代码，所以你不可能写出无限循环的代码。以下是 `for` 语句的语法：\n\n点击此处查看代码图像\n\n```cs\n\
  for (initialization; Boolean expression; update control variable)\n    statement\n\
  ```\n\n构成 `for` 结构体体的语句可以是单行代码，也可以是用大括号括起来的代码块。\n\n你可以将之前显示的显示 0 到 9 整数的 `while`\
  \ 循环重写为以下 `for` 循环：\n\n```cs\nfor (int i = 0; i < 10; i++)\n{\n    Console.WriteLine(i);\n\
  }\n```\n\n初始化只发生一次，位于循环的最开始处。然后，如果布尔表达式结果为 `true`，则执行语句。发生控制变量的更新，然后重新评估布尔表达式。如果条件仍然为\
  \ `true`，则再次执行语句，更新控制变量，再次评估布尔表达式，以此此类推。\n\n注意初始化只发生一次，循环体中的语句始终在更新之前执行，而更新在布尔表达式重新评估之前发生。\n\
  \n***\n\n![Image](img/Image00013.jpg) 提示\n\n与 `while` 语句一样，即使 `for` 循环体只包含单条语句，始终使用代码块也被认为是一种良好的习惯。如果你以后向\
  \ `for` 循环体中添加额外的语句，这种方法将有助于确保你的代码始终作为每次迭代的一部分执行。\n\n***\n\n你可以省略 `for` 语句的三个部分中的任何部分。如果你省略了布尔表达式，它默认为\
  \ `true`，因此以下 `for` 语句将无限运行：\n\n点击此处查看代码图像\n\n```cs\nfor (int i = 0; ; i++)\n{\n\
  \    somebody stop me!\n}\n```\n\n如果你省略了初始化和更新部分，你将得到一个拼写奇怪的 `while` 循环：\n\n```cs\n\
  int i = 0;\nfor (; i < 10; )\n    ++;\n```\n\n***\n\n![Image](img/Image0005.jpg)\
  \ 注意\n\n`for` 语句的初始化、布尔表达式和更新控制变量部分必须始终用分号分隔，即使它们被省略了也是如此。\n\n***\n\n你可以在 `for`\
  \ 循环中提供多个初始化和多个更新（尽管你只能有一个布尔表达式）。要实现这一点，请用逗号分隔各种初始化和更新，如下例所示：\n\n点击此处查看代码图像\n\n\
  ```cs\nfor (int i = 0, j = 10; i <= j; i--)\n    ...\n```\n\n作为最后一个示例，这里是将之前的 `while`\
  \ 循环重写为 `for` 循环：\n\n点击此处查看代码图像\n\n```cs\nfor (string line = reader.ReadLine();\
  \ line != null; line = reader.ReadLine())\n{\n    source.Text += line + '\\n';\n\
  }\n```\n\n#### `for` 语句的作用域\n\n你可能注意到可以在 `for` 语句的初始化部分声明变量。该变量的作用域限于 `for` 语句体，并在\
  \ `for` 语句结束时就会消失。这一规则有两个重要的后果。首先，在 `for` 语句结束后你无法再次使用该变量，因为它不再处于作用域内。这是一个示例：\n\n\
  点击此处查看代码图像\n\n```cs\nfor (int i = 0; i < 10; i++)\n{\n    ...\n}\nConsole.WriteLine(i);\
  \ // 编译错误\n```\n\n其次，你可以编写多个使用相同变量名的 `for` 语句，因为每个变量都在不同的作用域内，如下所示：\n\n点击此处查看代码图像\n\
  \n```cs\nfor (int i = 0; i < 10; i++)\n{\n    ...\n}\n\nfor (int i = 0; i < 20;\
  \ i += 2) // 正确\n{\n    ...\n}\n```\n\n## 编写 `do` 语句\n\n`while` 和 `for` 语句都在循环开始时测试它们的布尔表达式。这意味着如果表达式在第一次测试时为\
  \ `false`，循环体就不会执行——即使一次次。`do` 语句不同：它的布尔表达式在每次迭代后评估，因此循环体至少执行一次。\n\n`do` 语句的语法如下（不要忘记最后的分号）：\n\
  \n```\ndo\n    statement\nwhile (booleanExpression);\n```\n\n\n\n如果循环体包含多条语句，你必须使用\
  \ `statement` 语句块（如果不这样做，编译器将报告语法错误）。这里是一个示例版本，用于向控制台写入 0 到 9 的值，这次是通过 `do` 语句构建的：\n\
  \n```csharp\nint i = 0;\n\ndo\n{\n    Console.WriteLine(i);\n    i++;\n}\nwhile\
  \ (i < 10);\n```\n\n***\n\n### `break` 和 `continue` 语句\n\n在第 4 章中，你学习了如何使用 `break`\
  \ 语句跳出 `switch` 语句。你也可以使用 `break` 语句跳出迭代语句的体。当你跳出循环时，循环会立即退出，程序将继续执行循环后的第一条语句。循环的更新部分或继续条件都不会重新执行。\n\
  \n相比之下，`continue` 语句会导致程序立即执行循环的下一次迭代（在重新评估布尔表达式之后）。这是另一个示例版本，用于向控制台写入 0 到 9 的值，这次使用了\
  \ `break` 和 `continue` 语句：\n\n```csharp\nint i = 0;\n\nwhile (true)\n{\n    Console.WriteLine(i);\n\
  \    i++;\n    if (i < 10)\n        continue;\n    else\n        break;\n}\n```\n\
  \n这段代码非常糟糕。许多编程准则建议谨慎使用 `continue` 或完全不使用它，因为它通常与难以理解的代码相关。`continue` 的行为也相当微妙。例如，如果你在\
  \ `for` 语句内部执行 `continue` 语句，更新部分会在执行循环下一次迭代之前运行。\n\n***\n\n在接下来的练习中，你将编写一个 `do`\
  \ 语句，将正十进制整数转换为八进制表示字符串。该程序基于以下算法，该算法基于一种著名的数学步骤：\n\n点击此处查看代码图像\n\n1. 将十进制存储存储变量\
  \ `dec` 中\n2. 执行以下操作：\n   - 将 `dec` 除以 8 并存储余数\n   - 将 `dec` 设置为上一步的商\n3. 只要 `dec`\
  \ 不等于零\n4. 逆序组合每次计算存储的余数值\n\n例如，假设你想将十进制数字 999 转换为八进制。你执行以下步骤：\n\n**1.** 将 999 除以\
  \ 8。商是 124，余数是 7。\n**2.** 将 124 除以 8。商是 15，余数是 4。\n**3.** 将 15 除以 8。商是 1，余数是 7。\n\
  **4.** 将 1 除以 8。商是 0，余数是 1。\n**5.** 逆序组合每一步计算出的余数。结果为 1747。这就是十进制值 999 的八进制表示。\n\
  \n## 编写 `do` 语句\n\n**1.** 使用 Visual Studio 2015 打开 `DoStatement` 项目，它位于文档文件夹中的 `\\\
  Microsoft Press\\VCSBS\\Chapter 5\\DoStatement` 文件夹下。\n\n**2.** 在设计视图中显示 `MainPage.xaml`\
  \ 表单。\n\n表单包含一个名为 `number` 的文本框，用户可以在其中输入十进制数字。当用户点击 Show Steps 按钮时，将生成输入数字的八进制表示。右侧名为\
  \ `steps` 的文本框显示计算的每个阶段的结果。\n\n**3.** 在代码和文本编辑器中显示 `MainPage.xaml.cs` 的代码并找到 `showStepsClick`\
  \ 方法。\n\n该方法在用户点击表单上的 Show Steps 按钮时运行。目前它是空的。\n\n**4.** 在 `showStepsClick` 方法中添加以下加粗显示的语句：\n\
  \n点击此处查看代码图像\n\n```csharp\nprivate void showStepsClick(object sender, RoutedEventArgs\
  \ e)\n{\n    int amount = int.Parse(number.Text);\n    steps.Text = \"\";\n    string\
  \ current = \"\";\n}\n```\n\n第一条语句使用 `int` 类型的 `Parse` 方法将 `number` 文本框 `Text` 属性中的字符串值转换为\
  \ `int`，并将其存储在名为 `amount` 的局部变量中。\n\n第二条语句通过将其 `Text` 属性设置为空字符串，清除下方文本框中显示的文本。\n\
  \n第三条语句声明了一个名为 `current` 的 `string` 变量并初始化为空字符串。你将使用此字符串来存储用于将十进制数转换为八进制表示的循环每次迭代中生成的数字。\n\
  \n**5.** 在 `showStepsClick` 方法中添加以下 `do` 语句（加粗显示）：\n\n点击此处查看代码图像\n\n```csharp\n\
  private void showStepsClick(object sender, RoutedEventArgs e)\n{\n    int amount\
