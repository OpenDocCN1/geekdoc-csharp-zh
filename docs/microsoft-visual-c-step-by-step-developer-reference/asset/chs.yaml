  \ 二叉树之前就已经执行了求值并缓存了结果。\n\n### 9. 按回车键返回 Visual Studio 2015。\n\n## 总结\n\n在本章中，你学习了\
  \ LINQ 如何使用 `IEnumerable<T>` 接口和扩展方法来提供查询数据的机制。你还看到了这些功能如何支持 C# 中的查询表达式语法。\n\n![Image](img/Image00001.jpg)\n\
  \n\n\n\n\n![Image](img/Image00001.jpg) 你不能更改运算符的重载次数（操作数的数量）。例如，`*`（乘法符号）是一个二元运算符。如果你为自己的类型声明了\
  \ `*` 运算符，它也必须是一个二元运算符。\n\n![Image](img/Image00001.jpg) 你不能发明新的运算符符号。例如，你不能创建一个诸如\
  \ `**` 这样的运算符符号来表示一个数字的另一个数字的次方。你必须定义一个方法来实现该功能。\n\n![Image](img/Image00001.jpg)\
  \ 当运算符应用于内置类型时，你不能更改它们的含义。例如，表达式 `1 + 2` 具有预定义的含义，你不被允许重写这个含义。如果你可以这样做，那么事情将会变得过于复杂。\n\
  \n![Image](img/Image00001.jpg) 有些运算符符号是不能重载的。例如，你不能重载点 `.*` 运算符，它表示访问类的成员。同样，如果你可以这样做，将会导致不必要的复杂性。\n\
  \n***\n\n![Image](img/Image00013.jpg) 提示\n\n你可以使用索引器来模拟 `[]` 运算符。类似于，你可以使用属性来模拟赋值\
  \ `==` 运算符，并可以使用委托来模拟函数调用作为运算符。\n\n***\n\n### 重载运算符\n\n要定义你自己的运算符行为，你必须重载一个选定的运算符。你使用类似方法的语法，并带有返回类型和参数，但方法的名称是关键字\
  \ `operator` 加上你正在声明的运算符符号。例如，以下代码显示了一个名为 `Hour` 的用户定义结构体，它定义了一个二元 `+` 运算符，用于将两个\
  \ `Hour` 实例相加：\n\n点击此处查看代码图片\n\n```cs\nstruct Hour\n{\n    public Hour(int initialValue)\n\
  \    {\n        this.value = initialValue;\n    }\n\n    public static Hour operator\
  \ +(Hour lhs, Hour rhs)\n    {\n        return new Hour(lhs.value + rhs.value);\n\
  \    }\n    ...\n\n    private int value;\n}\n```\n\n注意以下几点：\n\n![Image](img/Image00001.jpg)\
  \ 运算符是公共的（public）。所有运算符必须是公共的。\n\n![Image](img/Image00001.jpg) 运算符是静态的（static）。所有运算符必须是静态的。运算符永远不是多态的，不能使用\
  \ `virtual`、`abstract`、`override` 或 `sealed` 修饰符。\n\n二元运算符（例如示例所示的 `+` 运算符）有两个显式参数，单元运算符有一个显式参数。（C++\
  \ 程序员应该注意，运算符永远没有隐藏的 `this` 参数。）\n\n***\n\n![Image](img/Image00013.jpg) 提示\n\n当你声明高度风格化的功能（如运算符）时，采用参数的命名约定是有帮助的。例如，开发者经常为二元运算符使用\
  \ `lhs` 和 `rhs`（分别是左侧和右侧的缩写）。\n\n***\n\n当你对两个 `Hour` 类型的表达式使用 `+` 运算符时，C# 编译器会自动将你的代码转换为对你的\
  \ `operator +` 方法的调用。C# 编译器转换这段代码：\n\n```cs\nHour Example(Hour a, Hour b)\n{\n \
  \   return a + b;\n}\n```\n\n将其转换为：\n\n点击此处查看代码图片\n\n```cs\nHour Example(Hour a,\
  \ Hour b)\n{\n    return Hour.operator +(a,b); // 伪代码\n}\n```\n\n但注意，这种语法是伪代码，不是有效的\
  \ C#。你只能在标准的中间形式表示法（符号位于操作数之间）中使用二元运算符。\n\n在声明运算符时，你必须遵循的最后一个规则：参数中至少有一个必须始终是包含类型的类型。在前面的\
  \ `Hour` 类的 `operator+` 示例中，参数之一 `a` 或 `b` 必须是 `Hour` 对象。在这个示例中，两个参数都是 `Hour` 对象。然而，在某些情况下你可能想要定义\
  \ `operator+` 的额外实现，例如将一个整数（小时数）加到 `Hour` 对象上——第一个参数可以是 `Hour`，第二个参数可以是整数。此规则使得编译器在尝试解析运算符调用时更容易知道去哪里查找，而且它确保了你不能更改内置运算符的含义。\n\
  \n### 创建对称运算符\n\n在前面的节中，你已经了如何声明一个二元 `+` 运算符来将两个 `Hour` 类型实例相加。`Hour` 结构体还通过构造函数，可以从\
  \ `int` 创建 `Hour`。这意味着你可以将一个 `Hour` 和一个 `int` 相加；你只需要先使用 `Hour` 构造函数将 `int` 转换为\
  \ `Hour`，如下例：\n\n```cs\nHour a = ...;\nint b = ...;\nHour sum = a + new Hour(b);\n\
  ```\n\n这无疑是有效代码，但它不如直接相加 `Hour` 和 `int` 那么清晰或简洁，例如：\n\n```cs\nHour a = ...;\nint\
  \ b = ...;\nHour sum = a + b;\n```\n\n为了使表达式 `(a + b)` 有效，你必须指定将 `Hour` 作为左操作数相加的含义。你应该声明一个以\
  \ `Hour` 为左操作数、以 `int` 为右操作数的 `+` 运算符。以下代码显示了推荐的方法：\n\n点击此处查看代码图片\n\n```cs\nstruct\
  \ Hour\n{\n    public Hour(int initialValue)\n    {\n        this.value = initialValue;\n\
  \    }\n    ...\n\n    public static Hour operator +(Hour lhs, int rhs)\n    {\n\
  \        return new Hour(lhs.value + rhs);\n    }\n}\n```\n\n注意运算符背后的逻辑保持在一个处。这个\
  \ `operator+` 只是将 `Hour` 作为左操作数、`int` 作为右操作数。它没有声明将 `int` 作为左操作数、`Hour` 作为右操作数相加：\n\
  \n点击此处查看代码图片\n\n```cs\nint a = ...;\nHour b = ...;\nHour sum = a + b; // 编译错误\n\
  ```\n\n这是违反直觉的。如果你可以写 `a + b`，你预期也能写 `b + a`。因此，你应该提供另一个 `operator` 重载：\n\n点击此处查看代码图片\n\
  \n```cs\nstruct Hour\n{\n    public Hour(int initialValue)\n    {\n        this.value\
  \ = initialValue;\n    }\n    ...\n\n    public static Hour operator +(Hour lhs,\
  \ int rhs)\n    {\n        return new Hour(lhs.value + rhs);\n    }\n\n    public\
  \ static Hour operator +(int lhs, Hour rhs)\n    {\n        return new Hour(lhs\
  \ + rhs.value);\n    }\n}\n```\n\n***\n\n![Image](img/Image00005.jpg) 注意\n\nC++\
  \ 程序员应该注意你必须自己提供重载。编译器不会为你编写重载，也不会交换两个操作数的顺序来寻找匹配的运算符。\n\n***\n\n### 运算符与语言互操作\n\
  \n并不是所有使用通用语言运行时（CLR）执行的语言都支持或理解运算符重载。如果你重载了运算符，你应该提供一种实现相同功能的替代机制，以便不支持运算符重载的语言可以使用该类。例如，假设你为\
  \ `Hour` 结构体实现了 `operator+`，如下所示：\n\n点击此处查看代码图片\n\n```cs\npublic static Hour operator\
  \ +(Hour lhs, int rhs)\n{\n    ...\n}\n```\n\n如果你需要从 Microsoft Visual Basic 应用程序中使用你的类，你还应该提供一个实现相同功能的\
  \ `Add` 方法，如下所示：\n\n点击此处查看代码图片\n\n```cs\npublic Hour Add(Hour lhs, int rhs)\n{\n\
  \    ...\n}\n```\n\n\n\n\n\n```csharp\npublic static Hour Add(Hour lhs, int rhs)\n\
  {\n\n...\n}\n```\n\n* *\n\n### 理解复合赋值的求值\n\n复合赋值运算符（例如 `+=`）始终根据其相关的简单运算符（如 `+`）进行求值。换句话说，语句\n\
  \n```csharp\na += b;\n```\n\n会自动按照如下方式进行求值：\n\n```csharp\na = a + b;\n```\n\n通常，表达式\
  \ `a @= b`（其中 `@` 代表任何有效的运算符）始终被求值值为 `a = a @ b`。如果你重载了相应的简单运算符，那么在使用其相关的复合赋值运算符时，会自动调用重载后的版本，例所示：\n\
  \n```csharp\nHour a = ...;\nint b = ...;\n\na += a; // 等同于 a = a + a\n\na += b;\
  \ // 等同于 a = a + b\n```\n\n第一个复合赋值表达式 `(a += a)` 是合法的，因为 `a` 的类型是 `Hour`，并且 `Hour`\
  \ 类型声明了一个二元运算符 `operator+`，其参数都是 `Hour`。同样，第二个复合赋值表达式 `(a += b)` 也是有效的，因为 `a` 的类型是\
  \ `Hour` 且 `b` 的类型是 `int`。`Hour` 类型还声明了一个二元运算符 `operator+`，其第一个参数是 `Hour`，第二个参数是\
  \ `int`。但请注意，你不能编写表达式 `b += a`，因为这等同于 `b = b + a`。虽然加法是有效的，但赋值无效，因为没有办法将 `Hour`\
  \ 赋值给内置的 `int` 类型。\n\n### 声明递增和递减运算符\n\n在 C# 中，你可以声明自己的递增（`++`）和递减（`--`）运算符。声明这些运算符时遵循通常规则：它们必须是公共的、静态的，并且必须是单元的（它们只能接受单个参数）。以下是\
  \ `Hour` 结构的递增运算符：\n\n点击此处查看代码图像\n\n```csharp\nstruct Hour\n{\n...\n\npublic static\
  \ Hour operator ++(Hour arg)\n{\narg.value++;\n\nreturn arg;\n}\n\n...\n\nprivate\
  \ int value;\n}\n```\n\n递增和递减运算符的独特之处在于它们可以以前缀和后置的形式使用。C# 巧妙地对同一个单元运算符用于前缀和后置版本。后置表达式的结果是操作数在表达式执行*之前*的值。换句话说，编译器实际上将代码\n\
  \n```csharp\nHour now = new Hour(9);\n\nHour postfix = now++;\n```\n\n转换为如下形式：\n\
  \n点击此处查看代码图像\n\n```csharp\nHour now = new Hour(9);\n\nHour postfix = now;\n\nnow\
  \ = Hour.operator ++(now); // 伪代码，不是合法的 C# 代码\n```\n\n前缀表达式的结果是运算符的返回值，因此 C# 编译器实际上将代码\n\
  \n```csharp\nHour now = new Hour(9);\n\nHour prefix = ++now;\n```\n\n转换为如下形式：\n\n\
  点击此处查看代码图像\n\n```csharp\nHour now = new Hour(9);\n\nnow = Hour.operator ++(now);\
  \ // 伪代码，不是合法的 C# 代码\n\nHour prefix = now;\n```\n\n这种等效性意味着递增和递减运算符的返回类型必须参数类型相同。\n\
  \n### 结构和类中的比较运算符\n\n请注意，`Hour` 结构中递增运算符的实现之所以有效是因为 `Hour` 是一个结构。如果你将 `Hour` 改为类但保持其递增运算符的实现不变，你会发现后置转换将不会给出正确答案。如果你记住类是引用类型，并重新回顾之前解释的编译器翻译，你可以在下面的示例中为什么\
  \ `Hour` 类的运算符不再按预期方式工作：\n\n点击此处查看代码图像\n\n```csharp\nHour now = new Hour(9);\n\n\
  Hour postfix = now;\n\nnow = Hour.operator ++(now); // 伪代码，不是合法的 C# 代码\n```\n\n\
  如果 `Hour` 是一个类，赋值语句 `postfix = now` 会让变量 `postfix` 指向与 `now` 相同的对象。更新 `now` 会自动更新\
  \ `postfix`！如果 `Hour` 是一个结构，赋值语句会在 `postfix` 中创建 `now` 的拷贝，对 `now` 的任何更改都不会改变 `postfix`，这正是你所希望的。\n\
  \n当 `Hour` 为类时，递增运算符的正确实现如下：\n\n点击此处查看代码图像\n\n```csharp\nclass Hour\n{\n\npublic\
  \ Hour(int initialValue)\n{\nthis.value = initialValue;\n}\n...\n\npublic static\
  \ Hour operator ++(Hour arg)\n{\nreturn new Hour(arg.value + 1);\n}\n\n...\n\nprivate\
  \ int value;\n}\n```\n\n注意 `operator ++` 现在根据原始对象中的数据创建一个新对象。新对象中的数据被增加了，但原始对象中的数据保持不变。虽然这种方法可行，但递增运算符的编译器翻译会导致每次使用时都创建一个新对象。这在内存消耗方面可能是昂贵的。\n\
  \n### 运算符对\n\n请注意，某些运算符是成对出现的。例如，如果你通过 `!=` 运算符比较两个 `Hour` 值，你期望也能通过 `==` 运算符比较两个\
  \ `Hour` 值。这种成对规则也适用于 `<` 和 `>`、<= 和 `>=`。C# 编译器不会为你编写这些运算符，你必须手动编写。以下是 `Hour` 结构的\
  \ `==` 和 `!=` 运算符：\n\n点击此处查看代码图像\n\n```csharp\nstruct Hour\n{\n\npublic Hour(int\
  \ initialValue)\n{\nthis.value = initialValue;\n}\n...\n\npublic static bool operator\
  \ ==(Hour lhs, Hour rhs)\n{\nreturn lhs.value == rhs.value;\n}\n\npublic static\
  \ bool operator !=(Hour lhs, Hour rhs)\n{\nreturn lhs.value != rhs.value;\n}\n\n\
  ...\n\nprivate int value;\n}\n```\n\n这些运算符的返回类型实际上不需要是布尔类型，否则这些运算符可能会变得混淆。\n\n###\
  \ 重写相等运算符\n\n如果你在类中定义了 `operator ==` 和 `operator !=`，你还应该重写继承自 `System.Object`（如果你创建的是结构则继承自\
  \ `System.ValueType`）的 `Equals` 和 `GetHashCode` 方法。`Equals` 方法的行为应该与 `operator ==`\
  \ 相同（你应该根据其中一个来定义另一个）。`GetHashCode` 方法被 .NET 框架中的其他类使用（例如，当你将对象作为哈希表的键时，会调用该对象的\
  \ `GetHashCode` 方法来帮助计算哈希值。更多信息请参阅 Visual Studio 2015 提供的 .NET 框架参考）。此方法只需要返回一个区分性的整数值。但是，不要从所有对象的\
  \ `GetHashCode` 方法中返回相同的整数，否则这将使哈希算法失效。\n\n### 实现运算符\n\n在接接的练习中，你将开发一个模拟复数的类。\n\n\
  \n\n\n\n![Image](img/Image00005.jpg)  说明\n\nMicrosoft .NET Framework 4.0 及更高版本在\
  \ `System.Numerics` 命名空间中包含一个名为 `Complex` 的类型，它实现了复数，因此你不再真正需要定义该类型的自定义版本。然而，查看如何实现该类型的某些常用运算符仍然具有教益意义。\n\
  \n* *\n\n你将复数实现为一对整数，分别代表实部和虚部元素的系数 `x` 和 `y`。你还将实现使用复数进行简单算术运算所需的运算符。下表总结了如何对一对复数\
  \ `(a + b*i )` 和 `(c + d*i )` 执行四种基本的算术运算。\n\n![Image](img/Image00145.jpg)\n\n###\
  \ 创建 `Complex` 类并实现算术运算符\n\n**1.** 如果 Visual Studio 2015 尚未运行，请启动它。\n\n**2.** 打开\
  \ `ComplexNumbers` 项目，它位于你文档文件夹中的 `\\Microsoft Press\\VCSBS\\Chapter 22\\ComplexNumbers`\
  \ 文件夹。这是一个控制台应用程序，你将用它来构建和测试代码。`Program.cs` 文件包含了熟悉的 `doWork` 方法。\n\n**3.** 在解决方案资源管理器中，点击\
  \ `ComplexNumbers` 项目。在项目菜单上，点击“添加类（Add Class）”。在“添加新建项 – ComplexNumbers”对话框中，在“名称”框中输入\
