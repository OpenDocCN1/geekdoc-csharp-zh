  \ `// TODO:` 注释：\n\n点击此处查看代码图像\n\n```csharp\nstatic void doWork()\n{\n    int x\
  \ = 591;\n    for (int i = 2; i <= 10; i++)\n    {\n        Console.WriteLine($\"\
  {x} in base {i} is {x.ConvertToBase(i)}\");\n    }\n}\n```\n\n这段代码创建了一个名为 `x` 的\
  \ `int` 变量并将其设置为 `591`。（你可以选择任何你想要的整数值。）然后代码使用循环打印出 2 到 10 之间所有数字基下的 591 值。注意，当你在\
  \ `Console.WriteLine` 语句中输入 `x` 后输入点（`.`）时，`ConvertToBase` 会作为扩展方法显示在 IntelliSense\
  \ 中。\n\n![Image](img/Image00100.jpg)\n\n### 9. 在“调试”（Debug）菜单上，点击“不调试启动”（Start Without\
  \ Debugging）。确认程序向控制台显示消息，显示不同数字基下的 591 值，如下：\n\n![Image](img/Image00101.jpg)\n\n\
  ### 10. 按回车键关闭程序并返回 Visual Studio 2015。\n\n## 总结\n\n在本章中，你学习了如何使用继承来定义类的层次结构，现在你应该理解如何重写继承的方法以及实现虚方法。你还学习了如何为现有类型添加扩展方法。\n\
  \n![Image](img/Image00001.jpg) 如果你想继续阅读下一章，请保持 Visual Studio 2015 运行并转到第 13 章。\n\
  \n![Image](img/Image00001.jpg) 如果你现在想退出 Visual Studio 2015，在“文件”（File）菜单上，点击“退出”（Exit）。如果你看到“保存”（Save）对话框，点击它。\n\
  \n## 章节回顾\n\n（此处为后续章节内容，按要求翻译）\n\n### 第 13 章. 创建接口和抽象类\n\n完成本章后，你将能够：\n\n- 定义接口并实现它们\n\
  - 声明接口中的方法签名\n- 通过接口引用类\n- 使用接口捕获通用性\n- 使用接口实现密封类\n\n抽象类在许多方面与接口相似，不同之处在于它们可以包含代码和数据。接口不包含任何代码；它只是指定了类必须从中提供的方法。你经常结合使用抽象类和接口，通过将抽象类的某些方法声明为虚，以便类可以提供自己的实现。\n\
  \n### 理解接口\n\n假设你想定义一个可以存储对象的类，类似于使用数组。但是，与数组不同，你需要提供方法。如果集合包含字符串对象，集合应该能够按照排序顺序处理这些字符串；如果集合包含整数对象，集合应该能够按数值顺序处理。\n\
  \n当你定义集合类时，你不想限制它可以包含的对象类型（对象可以是类或结构），因此你不知道如何对这些对象进行排序。那么，如何为集合类提供方法呢？初看起来，这个问题与第\
  \ 12 章 中的 `ToString` 问题相似，“使用继承，”该问题可以通过在子类中重写方法来解决。然而，任何相似性都是误导性的。集合类与它持有的对象之间没有继承关系，因此虚方法将毫无用处。如果你仔细思考，问题在于，集合中对象的排序方式取决于对象的类型，而不是取决于集合本身。解决方案是要求所有对象都提供一个方法，如下例所示的\
  \ `CompareTo` 方法，集合的 `RetrieveOrder` 方法可以调用该方法，使集合能够在对象之间进行比较：\n\n点击此处查看代码图像\n\n\
  ```sharp\nint CompareTo(object obj)\n{\n    // 如果当前实例与 obj 等，返回 0\n    // 如果当前实例小于\
  \ obj，返回小于 0\n    // 如果当前实例大于 obj，返回大于 0\n    ...\n}\n```\n\n为可集合对象定义一个接口，其中包含 `CompareTo`\
  \ 方法，并指定集合类只能包含实现该接口的类。在这种情况下，接口类似于合同。如果一个类实现了接口，接口就保证该类包含了接口指定的所有方法。\n\n\n\n\n\
  通过接口，你可以真正将“做什么”与“如何做”分离开。接口只为你提供方法的名称、返回类型和参数。方法的具体实现方式并不是接口关注的问题。接口描述了类应该提供的功能，而不是这些功能是如何被实现的。\n\
  \n### 定义接口\n\n定义接口在语法上与定义类相似，区别在于你使用 `interface` 关键字而不是 `class` 关键字。在接口内部，你声明方法的方式与在类或结构体中完全相同，不同之处在于你永远不需要指定访问修饰符（`public`、`private`\
  \ 或 `protected`）。此外，接口中的方法没有实现；它们仅仅是声明，所有实现该接口的类型必须提供它们自己的实现。因此，你用分号替换方法体。以下是一个示例：\n\
  \n```csharp\ninterface IComparable\n{\nint CompareTo(object obj);\n}\n```\n\n![Image](img/Image0001.jpg)\
  \ 提示\n\nMicrosoft .NET Framework 文档建议你将接口名称以大写字母 `I` 开头。这种约定是 C# 中匈牙利表示法的最后的遗迹。顺便提一下，`System`\
  \ 命名空间已经如所示定义了 `IComparable` 接口。\n\n接口不能包含任何数据；你不能向接口添加字段（即使是私有字段也不行）。\n\n### 实现接口\n\
  \n要实现接口，你需要声明一个继承接口的类或结构体，并实现接口中指定的*所有*方法。这并不是真正意义上的继承，尽管语法是相同的，而且你在本章后面章节中看到的某些语义带有许多继承的特征。你应当注意，与类继承不同，结构体（struct）也可以实现接口。\n\
  \n例如，假设你正在定义第 12 章中描述的哺乳动物（Mammal）层次结构，但你需要指定陆生哺乳动物提供一个名为 `NumberOfLegs` 的方法，该方法返回哺乳动物腿的数量作为\
  \ `int`。（海洋哺乳动物不实现此接口。）你可以如下所示定义包含该方法的 `ILandBound` 接口：\n\n```csharp\ninterface\
  \ ILandBound\n{\nint NumberOfLegs();\n}\n```\n\n你可以在 `Horse` 类中实现这个接口。你继承该接口并为接口定义的每个方法提供实现（在这种情况下，只有一个方法\
  \ `NumberOfLegs`）。\n\n```csharp\nclass Horse : ILandBound\n{\n...\npublic int NumberOfLegs()\n\
  {\nreturn 4;\n}\n}\n```\n\n实现接口时，你必须根据以下规则确保每个方法与其对应的接口方法完全匹配：\n\n![Image](img/Image00001.jpg)\
  \ 方法名和返回类型完全匹配。\n\n![Image](img/Image00001.jpg) 任何参数（包括 `ref` 和 `out` 关键字修饰符）完全匹配。\n\
  \n![Image](img/Image00001.jpg) 所有实现接口的方法必须是公开的。然而，如果你在使用显式接口实现，则方法不应有访问限定符。\n\n\
  如果接口定义与其声明的实现之间存在任何差异，类将无法编译。\n\n![Image](img/Image0013.jpg) 提示\n\nMicrosoft Visual\
  \ Studio 集成开发环境（IDE）可以帮助减少由于未实现接口方法导致的编码错误。实现向导（Implement Interface Wizard）可以为类实现的接口中的每个项目生成存根代码（stubs）。然后你用适当的代码填充这些存根。你将在本章稍后的练习中看到如何使用此向导。\n\
  \n一个类可以同时继承另一个类并实现一个接口。在这种情况下，C# 像 Java 那样使用特定的关键字来区分基类和接口。相反，C# 使用位置表示法。基类名称始终排在第一个，后面跟着逗号，然后是接口。接下来的示例定义\
  \ `Horse` 为一个 `Mammal` 类，但它额外实现了 `ILandBound` 接口：\n\n```csharp\ninterface ILandBound\n\
  {\n...\n}\n\nclass Mammal\n{\n...\n}\n\nclass Horse : Mammal, ILandBound\n{\n...\n\
  }\n```\n\n![Image](img/Image00005.jpg) 注意\n\n接口 `InterfaceA` 可以继承另一个接口 `InterfaceB`。从技术上讲，这被称为*接口扩展*（interface\
  \ extension）而不是继承。在这种情况下，任何实现 `InterfaceA` 的类或结构体都必须提供 `InterfaceB` 和 `InterfaceA`\
  \ 中所有方法的实现。\n\n### 通过接口引用类\n\n正如你可以通过定义为层次结构中较高类的变量来引用对象一样，你也可以通过定义为对象类所实现的接口变量来引用对象。以前述示例，你可以使用\
  \ `ILandBound` 变量来引用 `Horse` 对象，如下：\n\n```csharp\nHorse myHorse = new Horse(...);\n\
  ILandBound iMyHorse = myHorse; // 合法\n```\n\n这之所以有效，是因为所有的马都是陆生哺乳动物，尽管反过来并不成立——如果不先进行类型转换，你无法将\
  \ `ILandBound` 对象赋值给 `Horse` 变量。\n\n通过接口引用对象的技巧非常有用，因为可以用它来定义接受不同类型作为参数的方法，只要这些类型实现了指定的接口。例如，这里显示的\
  \ `FindLandSpeed` 方法可以接受任何实现 `ILandBound` 的参数：\n\n```csharp\nint FindLandSpeed(ILandBound\
  \ landMammal)\n{\n...\n}\n```\n\n你可以使用 `is` 运算符来验证对象是否为实现特定接口类的实例，该运算符在第 8 章“理解值和引用”中有演示。你使用\
  \ `is` 运算符判断对象是否具有指定的类型，它既适用于接口也适用于类和结构体。例如，以下代码块在尝试将 `myHorse` 赋值给 `ILandBound`\
  \ 变量之前，检查变量 `myHorse` 是否实际上实现了 `ILandBound` 接口：\n\n```csharp\nif (myHorse is ILandBound)\n\
  {\nILandBound iLandBoundAnimal = myHorse;\n}\n```\n\n注意，通过接口引用对象时，只能调用接口可见的方法。\n\
  \n### 使用多个接口\n\n一个类最多有一个基类，但允许实现无限数量的接口。类必须实现这些接口声明的所有方法。\n\n如果结构体或类实现了多个接口，你可以使用逗号分隔列表来指定这些接口。如果类还有一个基类，则接口列在基类*之后*。例如，假设你定义了另一个名为\
  \ `IGrazable` 的接口，它包含所有食草动物的 `ChewGrass` 方法。你可以这样定义 `Horse` 类：\n\n```csharp\nclass\
  \ Horse : Mammal, ILandBound, IGrazable\n{\n...\n}\n```\n\n\n\n\n之前的示例展示了隐式实现接口的类。如果你回顾\
  \ `ILandBound` 接口和 `Horse` 类（如接文所示），你会发现，尽管 `Horse` 类实现了 `ILandBound` 接口，但在 `Horse`\
  \ 类中 `NumberOfLegs` 方法的实现中，并没有任何地方说明它它是 `ILandBound` 接口的一部分：\n\n```csharp\ninterface\
  \ ILandBound\n{\n    int NumberOfLegs();\n}\n\nclass Horse : ILandBound\n{\n   \
  \ ...\n    public int NumberOfLegs()\n    {\n        return 4;\n    }\n}\n```\n\n\
  这在简单的情况下可能不是一个问题，但假设 `Horse` 类实现了多个接口。没有任何机制可以阻止多个接口指定具有相同名称的方法，尽管它们的语义可能不同。例如，假设你想实现一个基于马车的运输系统。一次长途旅程可以被拆分为几个阶段，或者说几个“路程（legs）”。如果你想跟踪每匹马为马车拉了多少段路程，你可能会定义以下接口：\n\
  \n```csharp\ninterface IJourney\n{\n    int NumberOfLegs();\n}\n```\n\n现在，如果你在 `Horse`\
  \ 类中实现这个接口，你就遇到了一个有趣的问题：\n\n点击此处查看代码图片\n\n```csharp\nclass Horse : ILandBound, IJourney\n\
  {\n    ...\n    public int NumberOfLegs()\n    {\n        return 4;\n    }\n}\n\
  ```\n\n这是合法的代码，但马是有四条腿，还是它已经为马车拉了四段路程？从 C# 的角度来看，答案是两者都是！默认情况下，C# 不区分该方法实现的是哪个接口，因此同一个方法实际上同时实现了两个接口。\n\
  \n为了解决这个问题并区分哪个方法属于哪个接口实现，你可以**显式实现**接口。要这样做，你需要在实现方法时指定该方法属于哪个接口，如下所示：\n\n点击此处查看代码图片\n\
  \n```csharp\nclass Horse : ILandBound, IJourney\n{\n    ...\n    int ILandBound.NumberOfLegs()\n\
  \    {\n        return 4;\n    }\n    int IJourney.NumberOfLegs()\n    {\n     \
  \   return 3;\n    }\n}\n```\n\n现在你可以看到，马有四条腿，并且已经为马车拉了三段路程。\n\n除了在方法名前前加上接口名称外，这种语法中还有另一个细微的差别：方法没有被标记为\
  \ `public`。你不能对显式接口实现的方法指定访问饰器。这导致了另一个有趣的现象。如果你在代码中创建一个 `Horse` 变量，你实际上无法调用 `NumberOfLegs`\
  \ 方法的任何一个，因为它们是不可见的。对于 `Horse` 类来说，它们都是私有的（`private`）。事实上，这是有意义。如果这些方法通过 `Horse`\
  \ 类可见，那么以下代码实际上会调用哪一个方法？是 `ILandBound` 接口的，还是 `IJourney` 接口的？\n\n点击此处查看代码图片\n\n\
  ```csharp\nHorse horse = new Horse();\n...\n// 以下语句将无法编译\nint legs = horse.NumberOfLegs();\n\
  ```\n\n那么，你如何访问这些方法呢？答案是通过适当的接口引用 `Horse` 对象，如下所示：\n\n点击此处查看代码图片\n\n```csharp\n\
  Horse horse = new Horse();\n...\nIJourney journeyHorse = horse;\nint legsInJourney\
  \ = journeyHorse.NumberOfLegs();\n\nILandBound landBoundHorse = horse;\nint legsOnHorse\
  \ = landBoundHorse.NumberOfLegs();\n```\n\n我建议在可能的情况下显式实现接口。\n\n### 接口限制\n\n要记住的核心思想是，接口永远不包含任何实现。以下限制是此的自然结果：\n\
  \n![Image](img/Image00001.jpg) 你不允许在接口中定义任何字段（fields），即使是静态字段（static fields）。字段是类或结构体的实现细节。\n\
  \n![Image](img/Image00001.jpg) 你不允许在接口中定义任何构造函数。构造函数也被认为是类或结构体的实现细节。\n\n![Image](img/Image00001.jpg)\
  \ 你不允许在接口中定义析构函数（destructor）。析构函数包含用于销毁对象实例的语句。（析构函数在第 14 章，“使用垃圾回收和资源管理””中描述。）\n\
  \n![Image](img/Image00001.jpg) 你不能为任何方法指定访问饰器。接口中的所有方法都是隐式公开的（`public`）。\n\n![Image](img/Image00001.jpg)\
  \ 你不能在接口内部嵌套任何类型（例如，枚举、结构体、类或接口）。\n\n![Image](img/Image00001.jpg) 接口不允许继承自结构体或类，尽管接口可以继承另一个接口。结构体和类包含实现；如果允许接口继承任何一种，它将会继承某些实现。\n\
  \n### 定义和使用接口\n\n在接下来的练习中，你将定义并实现构成简单图形包的接口。你将定义两个接口 `IDraw` 和 `IColor`，然后定义实现它们的类。\n\
  \n**1.** 启动 Visual Studio 2015，如果没有运行的话。\n\n**2.** 打开 Drawing 项目，它位于 Microsoft Press\\\
  VCS\\Chapter13\\Drawing 文件夹。Drawing 项目是一个图形应用程序。它包含一个名为 `DrawingPad` 的表单。该表单包含一个名为\
  \ `drawingCanvas` 的画布。你将使用这个表单和画布来测试代码。\n\n**3.** 在解决方案资源管理器中，点击 Drawing 项目。在项目菜单上，点击“新建项”。\n\
  \n新建项对话框打开了。\n\n**4.** 在新建项对话框的左侧窗格中点击 C#，然后在中间面板点击接口模板。在名称框中输入 `IDraw.cs`，然后点击“添加”。\n\
  \nVisual Studio 创建 `IDraw.cs` 文件并将其添加到你的项目中。`IDraw.cs` 文件出现在代码文本窗口中，内容所示：\n\n点击此处查看代码图片\n\
  \n```csharp\nusing System;\nusing System.Collections.Generic;\nusing System.Linq;\n\
  using System.Text;\nusing System.Threading.Tasks;\n\nnamespace Drawing\n{\n    interface\
  \ IDraw\n    {\n    }\n}\n```\n\n**5.** 在 `IDraw.cs` 文件中，在顶部的列表中添加以下 `using` 指令：\n\
  \n点击此处查看代码图片\n\n```csharp\nusing Windows.UI.Xaml.Controls;\n```\n\n你将在接口中引用 `Canvas`\
  \ 类。`Canvas` 类位于通用 平台（UWP）应用的 `Windows.UI.Xaml.Controls` 命名空间中。\n\n**6.** 向 `IDraw`\
  \ 接口添加此处加粗所示的方法：\n\n点击此处查看代码图片\n\n```csharp\ninterface IDraw\n{\n    void SetLocation(int\
  \ xCoord, int yCoord);\n    void Draw(Canvas canvas);\n}\n```\n\n**7.** 在项目菜单上，再次点击“新建项”。\n\
  \n**8.** 在新建项对话框中，在中间面板中点击接口模板。在名称框中输入 `IColor.cs`，然后点击“添加”。\n\n\n\n\nVisual Studio\
  \ 会创建 `IColor.cs` 文件并将其添加到你的项目中。`IColor.cs` 文件将显示在代码和文本窗口中。\n\n### 9. 在 `IColor.cs`\
  \ 文件的顶部，向列表添加以下 `using` 指令：\n\n```sharp\nusing Windows.UI;\n```\n\n你将在此接口中引用 `Color`\
  \ 类，该类位于 UWP 应用的 `Windows.UI` 命名空间中。\n\n### 10. 在 `IColor` 接口定义中添加此处**粗体**显示的方法：\n\
  \n点击此处查看代码图片\n\n```csharp\ninterface IColor\n{\n\nvoid SetColor(Color color);\n\
  }\n```\n\n你现在已经定义了 `IDraw` 和 `IColor` 接口。下一步是创建实现这些接口的类。在接下来的练习中，你将创建两个新的形状类，分别为\
  \ `Square` 和 `Circle`。这些类将实现这两个接口。\n\n### 创建 `Square` 和 `Circle` 类并实现接口\n\n####\
  \ 1. 在项目（Project）菜单上，点击添加类（Add Class）。\n\n#### 2. 在“添加新建项 – 绘制”（Add New Item – Drawing）对话框的中间面板中，确认已选择“类”（Class）模板。在名称（Name）框中输入\
  \ `Square.cs`，然后点击添加。\n\nVisual Studio 会创建 `Square.cs` 文件并将其显示在代码和文本窗口中。\n\n####\
  \ 3. 在 `Square.cs` 顶部，向列表添加以下 `using` 指令：\n\n点击此处查看代码图片\n\n```sharp\nusing Windows.UI;\n\
  using Windows.UI.Xaml.Media;\nusing Windows.UI.Xaml.Shapes;\nusing Windows.UI.Xaml.Controls;\n\
  ```\n\n#### 4. 修改 `Square` 类的定义，使其实现 `IDraw` 和 `IColor` 接口，如下粗体所示：\n\n点击此处查看代码图片\n\
  \n```csharp\nclass Square : IDraw, IColor\n{\n\n}\n```\n\n#### 5. 在 `Square` 类中添加此处**粗体**显示的以下私有变量：\n\
  \n点击此处查看代码图片\n\n```csharp\nclass Square : IDraw, IColor\n{\n\nprivate int sideLength;\n\
  \nprivate int locX = 0, locY = 0;\n\nprivate Rectangle rect = null;\n\n}\n```\n\n\
  这些变量将存储 `Square` 对象在画布上的位置和大小。`Rectangle` 类位于 UWP 应用的 `Windows.UI.Xaml.Shapes` 命名空间。你将使用该类来绘制正方形。\n\
  \n#### 6. 在 `Square` 类中添加此处**粗体**显示的以下构造函数：\n\n点击此处查看代码图片\n\n```csharp\nclass Square\
  \ : IDraw, IColor\n{\n\n...\n\npublic Square(int sideLength)\n{\n\nthis.sideLength\
  \ = sideLength;\n}\n\n}\n```\n\n此构造函数初始化了 `sideLength` 字段并指定了正方形每边的长度。\n\n#### 7.\
