  \ Or Enter A Database Name）框中，输入 `AdventureWorks` ，然后点击确定。\n\n![Image](img/Image00225.jpg)\n\
  \n此操作创建了到云端运行的 `AdventureWorks` 数据库的连接。\n\n20. 在选择数据连接页面上，点击“不（No），从连接字符串中排除敏感数据（Exclude\
  \ Sensitive Data From The Connection String）。我将在应用程序代码中设置（I Will Set It In My Application\
  \ Code）”。验证已选择将连接设置保存到 Web.Config（Save Connection Settings In Web.Config As），并确认连接字符串名称为\
  \ `AdventureWorksEntities`。\n\n![Image](img/Image00226.jpg)\n\n21. 在选择版本（Choose\
  \ Your Version）页面上，选择 `Entity Framework 6.x`，然后点击下一步。\n\n22. 在选择数据库对象和设置（Choose\
  \ Your Database Objects And Settings）页面上，展开 `Tables`，展开 `SalesLT`，然后选择 `Customer`。验证“生成对象名称复数或单数化（Pluralize\
  \ Or Singularize Generated Object Names）”复框已勾选。（此页上的其他两个选项也将默认勾选。）观察 Entity Framework\
  \ 在 `AdventureWorksModel` 命名空间为实体模型生成类，然后点击完成（Finish）。\n\n![Image](img/Image00227.jpg)\n\
  \n实体数据模型向导为 `Customer` 表生成实体模型，并在屏幕上的实体模型编辑器中显示图形表示，如下所示：\n\n![Image](img/Image00028.jpg)\n\
  \n如果出现以下安全警告（Security Warning）消息框，勾选“不再显示此消息（Do Not Show This Message Again）”，然后点击确定。出现此安全警告是因为\
  \ Entity Framework 使用了名为 `T4 templates` 的技术来生成您的实体模型代码，并且它已通过 `NuGet` 从网络下载了这些模板。Entity\
  \ Framework 模板已经过微软的验证，是安全的。\n\n![Image](img/Image00229.jpg)\n\n23. 在实体模型编辑器中，右键点击\
  \ `MiddleName` 列，然后点击“从模型删除（Delete From Model）”。使用相同的过程，从实体模型中删除 `Suffix`、`CompanyName`\
  \ 和 `SalesPerson` 列。\n\n`Customers` 应用程序未使用这些列，因此无需从数据库中检索它们。它们允许空值，因此可以安全地作为数据库表的一部分保留。然而，你不应该删除\
  \ `rowguid` 和 `ModifiedDate` 列。这些列被数据库用于识别 `Customer` 表中的行，并在多用户环境中跟踪这些行的更改。如果您删除了这些列，将无法正确地将数据保存回数据库。\n\
  \n24. 在生成（Build）菜单上，点击生成解决方案（Build Solution）。\n\n25. 在解决方案管理器中，找到 `AdventureWorksService`\
  \ 项目，展开 `Models` 文件夹，展开 `AdventureWorksModel.edmx`，展开 `AdventureWorksModel.tt`，然后双击\
  \ `Customer.cs`。\n\n此文件包含实体数据模型向导生成的表示客户的类。该类包含您包含在实体模型中的 `Customer` 表中每一列的自动属性：\n\
  \n点击此处查看代码图像\n\n```csharp\npublic partial class Customer\n{\n    public int CustomerID\
  \ { get; set; }\n    public string Title { get; set; }\n    public string FirstName\
  \ { get; set; }\n    public string LastName { get; set; }\n    public string EmailAddress\
  \ { get; set; }\n    public string Phone { get; set; }\n    public System.Guid rowguid\
  \ { get; set; }\n    public System.DateTime ModifiedDate { get; set; }\n}\n```\n\
  \n26. 在解决方案管理器中，在 `AdventureWorksModel.edmx` 项下，展开 `AdventureWorksModel.Context.tt`，然后双击\
  \ `AdventureWorksModel.Context.cs`。\n\n此文件包含一个名为 `AdventureWorksEntities` 的类的定义。（它的名称与您在实体数据模型向导生成数据库连接时使用的名称相同。）\n\
  \n点击此处查看代码图像\n\n```csharp\npublic partial class AdventureWorksEntities : DbContext\n\
  {\n    public AdventureWorksEntities()\n        : base(\"name=AdventureWorksEntities\"\
  )\n    {\n    }\n    protected override void OnModelCreating(DbModelBuilder modelBuilder)\n\
  \    {\n        throw new UnintentionalCodeFirstException();\n    }\n    public\
  \ DbSet<Customer> Customers { get; set; }\n}\n```\n\n`AdventureWorksEntities` 类继承自\
  \ `DbContext` 类，提供了功能。默认构造函数向基类构造函数传递了一个参数，指定连接数据库的连接字符串名称。如果您查看 `web.config` 文件，将在\
  \ `<ConnectionStrings>` 部分找到此字符串。它包含了您在运行实体数据模型向导时指定的参数（以及其他内容）。但是，此字符串不包含身份验证连接所需的密码，因为您选择在运行时提供这些数据。您将在后续步骤中处理这些。\n\
  \n您可以忽略 `AdventureWorksEntities` 类中的 `OnModelCreating` 方法。另一个项是 `Customers` 集合。该集合的类型为\
  \ `DbSet<Customer>`。`DbSet` 泛型提供了用于添加、插入、删除和查询数据库对象的方法。它与 `DbContext` 类协作，生成从数据库获取客户信息并填充集合所需的适当\
  \ 命令。当 `Customer` 对象被添加、修改或从集合中删除时，它还用于创建 SQL INSERT、UPDATE 和 DELETE 命令。`DbSet`\
  \ 集合通常被称为“实体集（entity set）”。\n\n\n\n\n\n项目中添加了一个名为 `AdventureWorksEntities` 的新类，并将其显示在代码和文本编辑器窗口中。该类目前与\
  \ Entity Framework 生成的同名现有类冲突，但你将通过将该类转换为部分类（partial class）来增强 Entity Framework\
  \ 代码。部分类是指代码分布在一个或多个源文件中的类。这种方法对于像 Entity Framework 这样的工具非常有用，因为它允许你添加自己的代码，而无需担心在未来某个时刻重新生成\
  \ Entity Framework 代码时你的代码会被意外覆盖的风险。\n\n### 29. 在代码和文本编辑器窗口中，修改 `AdventureWorksEntities`\
  \ 类的定义使其成为部分类，如下文中的**粗体**所示。\n\n点击此处查看代码图像\n\n```csharp\npublic partial class AdventureWorksEntities\n\
  {\n\n}\n```\n\n### 30. 在 `AdventureWorksEntities` 类中，添加一个接受名为 `password` 的字符串参数的构造函数。该构造函数应该调用基类构造函数，并传入之前由\
  \ Entity Data 模型向导写入到 `web.config` 文件的连接字符串名称（在“选择数据连接”页面上指定）。\n\n点击此处查看代码图像\n\n\
  ```csharp\npublic partial class AdventureWorksEntities\n{\n    public AdventureWorksEntities(string\
  \ password)\n    : base(\"name=AdventureWorksEntities\")\n    {\n}\n}\n```\n\n###\
  \ 31. 在构造函数中添加下方**粗体**所示的代码。此代码修改了 Entity Framework 使用的连接字符串以包含密码。Customers 将在运行时调用此构造函数并提供密码。\n\
  \n点击此处查看代码图像\n\n```csharp\npublic partial class AdventureWorksEntities\n{\n    public\
  \ AdventureWorksEntities(string password)\n    : base(\"name=AdventureWorksEntities\"\
  )\n    {\n        this.Database.Connection.ConnectionString += $\";Password={password}\"\
  ;\n    }\n}\n```\n\n## 创建和使用 REST Web 服务\n\n你已经创建了一个实体模型，该模型提供了检索和维护客户信息的操作。下一步是实现\
  \ Web 服务，以便 UWP 应用可以访问该实体模型。\n\n使用 Visual Studio 2015，你可以直接基于 Entity Framework 生成的实体模型在\
  \ ASP.NET Web 应用中创建 Web 服务。该 Web 服务使用实体模型从数据库检索数据并更新数据库。你可以通过“添加脚架”（Add Scaffold）向导创建\
  \ Web 服务。此向导可以生成实现 REST 模型的 Web 服务，该模型使用导航方案在网络上表示业务对象和服务，并使用 HTTP 协议传输用于访问这些对象和服务的请求。访问资源的客户端应用以\
  \ URL 形式提交请求，Web 服务对该请求进行解析和处理。例如，Adventure Works 可能会使用类似下方的方案发布客户信息，将每个客户的详情作为单个资源暴露：\n\
  \n点击此处查看代码图像\n\n```\nhttp://Adventure-Works.com/DataService/Customers/1\n```\n\n\
  访问此 URL 会导致 Web 服务检索客户 1 的数据。这些数据可以用多种格式返回，但为了可移植性，最常见的格式包括 XML 和 JavaScript 对象表示\
  \ (JSON)。REST Web 服务请求发布上述查询时生成的典型 JSON 响应如下：\n\n点击此处查看代码图像\n\n```json\n{\n\"CustomerID\"\
  :1,\n\"Title\":\"Mr\",\n\"FirstName\":\"Orlando\",\n\"LastName\":\"Gee\",\n\"EmailAddress\"\
  :\"orlando0@adventure-works.com\",\n\"Phone\":\"245-555-0173\"\n}\n```\n\nREST 模型依赖于访问数据的应用程序在访问请求中发送适当的\
  \ HTTP 动词。例如，之前显示的简单请求应该向 Web 服务发送 HTTP GET 请求。HTTP 还支持其他动词，如 POST、PUT 和 DELETE，你可以分别使用它们创建、修改和删除资源。编写生成相应\
  \ HTTP 请求并解析 REST Web 服务返回响应的代码听起来相当复杂。幸运的是，“添加脚架”向导可以为你生成大部分此类代码。\n\n在接下来的练习中，你将为\
  \ AdventureWorks 实体模型创建一个简单的 REST Web 服务。该 Web 服务将允许客户端应用查询和维护客户信息。\n\n### 创建 AdventureWorks\
  \ Web 服务\n\n**1.** 在 Visual Studio 中，在 `AdventureWorksService` 项目中，右键点击 `Controllers`\
  \ 文件夹，指向“添加”，然后点击“新建脚架项”。\n\n**2.** 在“添加脚架”向导中，在中间面板中，点击 `Web API 2 Controller With\
  \ Actions, Using Entity Framework` 模板，然后点击“添加”。\n\n![图像](img/Image00230.jpg)\n\n\
  **3.** 在“添加控制器”对话框中，在“模型类”下拉列表中选择 `Customer` (`AdventureWorksService.Models`)。在“数据上下文类”下拉列表中选择\
  \ `AdventureWorksEntities` (`AdventureWorksService.Models`)。勾选“使用异步控制器操作”复框。验证控制器名称设置为\
  \ `CustomersController`，然后点击“添加”。\n\n![图像](img/Image00231.jpg)\n\n在使用 ASP.NET Web\
  \ API 模板创建的 Web 服务中，所有传入的 Web 请求都由一个或多个控制器类处理，每个控制器类都暴露映射到不同类型请求的方法。例如，`CustomersController`\
  \ 如下所示：点击此处查看代码图像\n\n```csharp\npublic class CustomersController : ApiController\n\
  {\n    private AdventureWorksEntities db = new AdventureWorksEntities();\n\n   \
  \ // GET: api/Customers\n    public IQueryable<Customer> GetCustomers()\n    {\n\
  \        return db.Customers;\n    }\n\n    // GET: api/Customers/5\n    [ResponseType(typeof(Customer))]\n\
  \    public async Task<IHttpActionResult> GetCustomer(int id)\n    {\n        Customer\
  \ customer = await db.Customers.FindAsync(id);\n        if (customer == null)\n\
  \        {\n            return NotFound();\n        }\n        return Ok(customer);\n\
  \    }\n\n    // PUT: api/Customers/5\n    [ResponseType(typeof(void))]\n    public\
  \ async Task<IHttpActionResult> PutCustomer(int id, Customer customer)\n    {\n\
  \        if (!ModelState.IsValid)\n        {\n            return BadRequest(ModelState);\n\
  \        }\n        if (id != customer.CustomerID)\n        {\n            return\
  \ BadRequest();\n        }\n        db.Entry(customer).State = EntityState.Modified;\n\
  \        try\n        {\n            await db.SaveChangesAsync();\n        }\n \
  \       catch (DbUpdateConcurrencyException)\n        {\n            if (!CustomerExists(id))\n\
  \            {\n                return NotFound();\n            }\n            else\n\
  \            {\n                throw;\n            }\n        }\n        return\
  \ StatusCode(HttpStatusCode.NoContent);\n    }\n\n    // POST: api/Customers\n \
  \   [ResponseType(typeof(Customer))]\n    public async Task<IHttpActionResult> PostCustomer(Customer\
  \ customer)\n    {\n        //...\n    }\n\n    // DELETE: api/Customers/5\n   \
  \ [ResponseType(typeof(Customer))]\n    public async Task<IHttpActionResult> DeleteCustomer(int\
  \ id)\n    {\n        //...\n    }\n\n    private bool CustomerExists(int id)\n\
  \    {\n        return db.Customers.Any(c => c.CustomerID == id);\n    }\n\n   \
  \ ...\n}\n```\n\n`GetCustomers` 方法处理检索所有客户的请求，它通过简单返回之前创建的 Entity Framework 数据模型中的整个\
  \ `Customers` 集合来满足该请求。在后台，Entity Framework 从数据库获取所有客户并使用这些信息填充 `Customers` 集合。如果应用程序向\
  \ Web 服务的 `api/Customers` URL 发送 HTTP GET 请求，就会调用此方法。\n\n`GetCustomer` 方法（不要与 `GetCustomers`\
  \ 混淆）接受一个整数参数。该参数指定特定客户的 `CustomerID`，该方法使用 Entity Framework 查找该客户的详情然后返回。当应用程序向\
  \ `api/Customers/* n` URL 发送 HTTP GET 请求时（*n* 是要检索的 ID），就会运行 `GetCustomer`。\n\n\n\
  \n\n\n当应用程序向 Web 服务发送 HTTP PUT 请求时，会运行 `PutCustomer` 方法。该请求指定了客户 ID 和客户详细信息，此方法中的代码使用\
  \ `Entity Framework` 用这些详细信息更新指定的客户。`PostCustomer` 方法响应 HTTP POST 请求，并将客户详细信息作为其参数。此方法将带有这些详细信息的新客户添加到数据库中（详细信息在前面的代码示例中未显示）。最后，`DeleteCustomer`\
  \ 方法处理 HTTP DELETE 请求并删除具有指定客户 ID 的客户。\n\n![Image](img/Image00005.jpg) 注意\n\nWeb\
  \ API 模板生成的代码乐观地假设它始终能够连接到数据库。在分布式系统世界中，数据库和 Web 服务位于不同的服务器上，情况可能并不总是如此。网络容易出现瞬态错误和超时；连接尝试可能会因为暂时的故障而失败，但在短时间后重试时可能会成功。将临时故障作为错误报告给客户端可能会让用户感到困惑。如果可能的话，对于失败的操作，只要重试次数不过过多，就静默地重试失败的操作可能会更好（你不希望在数据库真的不可用时\
  \ Web 服务冻结）。有关此策略的详细信息，请参阅 `[http://social.technet.microsoft.com/wiki/contents/articles/18665.cloud-service-fundamentals-data-access-layer-transient-fault-handling.aspx]`\
  \ 中的“云服务基础数据访问层——临时故障处理”。\n\nASP.NET Web API 模板会自动生成代码，将请求定向到控制器类中的相应方法，如果你需要管理其他资源（例如产品或订单），可以添加更多的控制器类。\n\
  \n![Image](img/Image00005.jpg) 注意\n\n有关如何使用 ASP.NET Web API 模板实现 REST Web 服务的详细信息，请参阅\
  \ `[http://www.asp.net/web-api]` 中的“Web API”。\n\n你也可以通过与 `CustomersController` 类所示的相同模式手动创建控制器类——你不一定需要使用\
  \ `Entity Framework` 在数据库中获取和存储数据。ASP.Net Web API 模板在 `ValuesController.cs` 文件中包含一个示例控制器，你可以复制它并用自己的代码对其进行扩展。\n\
  \n### 4. 在 `CustomersController` 类中，修改创建 `AdventureWorksEntities` 上文对象的语句，以使用带有密码作为参数的构造函数。在构造函数的参数处，提供你在创建数据库时指定的管理员密码。（在下面的代码示例中，将字符串\
  \ `YourPassword` 替换为你自己的密码。）\n\n点击此处查看代码图像\n\n```c\npublic class CustomersController\
  \ : ApiController\n{\n    private AdventureWorksEntities db = new AdventureWorksEntities(\"\
  YourPassword\" );\n\n    // GET: api/Customers\n    public IQueryable<Customer>\
  \ GetCustomers()\n    {\n        return db.Customers;\n    }\n\n    ...\n\n}\n```\n\
  \n![Image](img/Image00005.jpg) 注意\n\n在现实世界中，你可以提示运行 Customers 应用程序的用户提供此信息（或允许应用程序将密码本地保存到用户的本地设备上，作为应用程序配置数据的一部分）。然后\
  \ Customers 应用程序将把此信息传递给 Web 服务。\n\n### 5. 在 Controllers 文件夹中，右键点击 `ValuesController.cs`\
  \ 文件，然后点击删除。在消息框中，点击确定以确认你想要删除此文件。\n\n你将在本次练习中不会使用示例 `ValuesController` 类。\n\n![Image](img/Image00005.jpg)\
  \ 注意\n\n不要删除 `HomeController` 类。此控制器作为托管 Web 服务的 Web 应用程序入口。\n\n### 6. 在解决方案管理器中，右键点击\
  \ `AdventureWorksService` 项目，点击“查看”，然后点击“在浏览器中查看 (Microsoft Edge)”。\n\n如果 Web 服务配置正确，你的浏览器应该应该启动并显示以下页面：\n\
  \n![Image](img/Image00232.jpg)\n\n### 7. 在标题栏上，点击 API。\n\n出现另一个页面，总结了应用程序可以向 Web\
  \ 服务发送的 REST 请求：\n\n![Image](img/Image00233.jpg)\n\n### 8. 在地址栏中输入 `http://localhost:50000/api/Customers/1`，然后按回车。\n\
  \n此请求被指向 `CustomersController` 类中重载的 `GetCustomer` 方法，值 1 作为参数传递给该方法。注意，Web API\
  \ 使用服务器地址之后以路径“api”开头的路由。\n\n`GetCustomer` 方法从数据库中检索客户 1 的详细信息，并以 JSON 格式的对象返回它们，显示在浏览器中。数据看起来如下（`ModifiedDate`\
  \ 的值可能与此处所示不同）：\n\n点击此处查看代码图像\n\n```json\n{\"CustomerID\":1,\"Title\":\"Mr\",\"\
  FirstName\":\"Orlando\",\"LastName\":\"Gee\",\"EmailAddress\":\"orlando0@adventure-works.com\"\
  ,\"Phone\":\"245-555-0173\",\"rowguid\":\"3f5ae95e-b87d-4aed-95b4-c3797afcb74f\"\
  ,\"ModifiedDate\":\"2001-08-01T00:00:00\"}\n```\n\n### 9. 关闭 浏览器并返回 Visual Studio。\n\
  \n你现在可以将 Web 服务部署到 Azure 而不是在本地运行。你可以使用 Visual Studio 2015 提供的发布向导在云端创建 Web 并上传\
  \ Web 服务。\n\n#### 将 Web 服务部署到云端\n\n1. 在解决方案管理器中，右键点击 `AdventureWorksService` 项目，点击“发布”。\n\
  \n发布向导启动了。\n\n![Image](img/Image00234.jpg)\n\n2. 在“选择发布目标”下，点击“Azure Web Apps”。\n\
  \n3. 在“选择现有 Web 应用程序”对话框中，选择你的 Azure 账户。如果出现“添加账户”而不是账户列表，点击此选项，然后点击“添加账户”。在“登录\
  \ Visual Studio”对话框中，使用你的 Microsoft 详细登录。\n\n4. 在“选择现有 Web 应用程序”对话框中，点击“新建”。\n\n\
  5. 在“在 Azure 上创建 Web 应用程序”对话框中，为 Web 应用程序提供唯一的名称，并指定靠近你的区域。不要指定数据库服务器（你 Web 服务中的\
  \ `Entity Framework` 代码将处理数据库连接）。在“App 服务计划”框中，点击“新建 App 服务计划”并命名。同样，在“资源组”框中，点击“新建资源组”并命名。当你输入了所有数据后，点击“创建”。\n\
  \n![Image](img/Image00235.jpg)\n\n6. 在发布向导的“连接”页面，接受默认值，点击“验证连接”以验证托管 Web 服务的 Web\
  \ 应用程序已成功创建，然后点击“下一步”。\n\n7. 在“设置”页面，接受默认值，然后点击“下一步”。\n\n8. 在“预览”页面，点击“发布”。\n\n\
  Web 服务应该已上传。浏览器应该打开并显示网站的主页，正如你之前在本地运行服务时看到的那样。\n\n\n\n\n这段旅程的下一阶段是从 Customers UWP\
  \ 应用连接到 Web 服务，然后使用该 Web 服务获取某些数据。.NET Framework 提供了 `HttpClient` 类，应用程序可以使用它来构建并向\
  \ Web 服务发送 HTTP REST 请求；以及 `HttpResponseMessage` 类，应用程序可以使用它来处理来自 Web 服务的响应结果。这些类将\
  \ HTTP 协议的细节从你的应用程序代码中抽象了。。这样，你就可以专注于显示和操作通过 Web 服务发布的对象的业务逻辑了。你将在接下来的练习中使用这些类。你还将使用由\
  \ `Json.NET` 程序包实现的 JSON 解析器。你必须将此包添加到 Customers 项目中。\n\n* * *\n\n![Image](img/Image00004.jpg)\
  \  重要\n\n此练习检索了每个客户的数据。作为一个原型，这非常有用，因为它证明了通过位于云端的 Web 服务检索数据的可行性，但在现实世界中，你应该更具选择性。如果数据库包含大量数据，这种方法在网络带宽和运行在用户设备上的应用程序的内存需求方面可能会非常浪费资源。更好的方法是使用分页，即分块获取客户数据（例如每次\
  \ 20 个客户）。Web 服务需要更新以支持这种方法，而 Customers 应用中的 `ViewModel` 则需要透明地管理客户块的获取。这留给读者作为练习\
  \ ![Image](img/Image00236.jpg) 。\n\n* * *\n\n### 从 AdventureWorks Web 服务获取数据\n\n\
  1. 在解决方案资源管理器中，找到 Customers 项目，右键点击 `DataSource.cs` 文件，然后点击“删除”。在消息框中，点击“确定”以确认要删除该文件。\n\
  \n此文件包含了 Customers 应用使用的示例数据。你将修改 `ViewModel` 类以从 Web 服务获取这些数据，因此该文件不再需要了。\n\n2.\
  \ 右键点击 Customers 项目，然后点击“管理 NuGet 包”。\n\n* * *\n\n![Image](img/Image00005.jpg) \
  \ 注意\n\n如果提示你输入连接 SQL Server 的密码，请关闭对话框。密码信息已由 Web 服务提供。\n\n* * *\n\n3. 在“NuGet\
  \ 包管理器：Customers”窗口中，确保“筛选”下拉列表设置为“所有”，然后在搜索框中输入 `Json.NET`。\n\n4. 在显示搜索结果的窗格中，选择\
  \ `Newtonsoft.Json` 包。在右侧窗格中，将“操作”设置为“安装”，然后点击“安装”。\n\n5. 在“预览”窗口中，点击“确定”。\n\n6.\
  \ 等待包安装完成，然后关闭“NuGet 包管理器：Customers”窗口。\n\n7. 在解决方案资源管理器中，双击 `ViewModel.cs` 以在代码和文本编辑器窗口中显示该文件。\n\
  \n8. 在文件顶部的列表中添加以下 `using` 指令：\n\n点击此处查看代码图片\n\n```\nusing System.Net.Http;\n\n\
  using System.Net.Http.Headers;\n\nusing Newtonsoft.Json;\n```\n\n9. 在 `ViewModel`\
  \ 类中，在 `ViewModel` 构造函数之前添加以下加粗显示的变量。将 `<webappname>` 替换为你在上一个练习中创建的用于托管 Web 服务的\
  \ Web 应用名称。\n\n点击此处查看代码图片\n\n```cs\npublic class ViewModel : INotifyPropertyChanged\n\
  \n{\n\n...\n\nprivate const string ServerUrl = \"http://<webappname>.azurewebsites.net/\"\
  ;\n\nprivate HttpClient client = null;\n\npublic ViewModel()\n\n{\n\n...\n}\n\n\
  ...\n\n}\n```\n\n`ServerUrl` 变量包含 Web 服务的基地址。你将使用 `client` 变量连接到 Web 服务。\n\n10.\
  \ 在 `ViewModel` 构造函数中，将 `customers` 列表初始化为 null，并添加以下加粗语句来配置 `client` 变量：\n\n点击此处查看代码图片\n\
  \n```cs\npublic ViewModel()\n{\n...\nthis.customers = null;\nthis.client = new HttpClient();\n\
  this.client.BaseAddress = new Uri(ServerUrl);\nthis.client.DefaultRequestHeaders.Accept.\n\
  Add(new MediaTypeWithQualityHeaderValue(\"application/json\"));\n}\n```\n\n`customers`\
  \ 列表包含应用程序显示的客户；它之前是用你删除的 `DataSource.cs` 文件中的数据填充的。`client` 变量被初始化为向其发送请求的 Web\
  \ 服务器地址。REST Web 服务可以以多种格式接收请求并发送响应，但 Customers 应用将使用 JSON。前述代码中的最后语句配置了 `client`\
  \ 变量，以这种格式提交请求。\n\n11. 在解决方案资源管理器中，双击 Customers 项目根文件夹下的 `Customer.cs` 文件以在代码和文本编辑器窗口中显示它。\n\
  \n12. 紧接 `Phone` 属性，在 `Customer` 类中添加以下加粗显示的公共属性：\n\n点击此处查看代码图片\n\n```cs\npublic\
  \ class Customer : INotifyPropertyChanged\n\n{\n...\n\npublic string Phone\n{\n\
  ...\n}\npublic System.Guid rowguid { get; set; }\n\npublic System.DateTime ModifiedDate\
  \ { get; set; }\n\n...\n\n}\n```\n\nWeb 服务从数据库检索这些字段，应用程序必须准备好处理它们；否则，在修改客户详情时它们将会丢失。（你将在本章之后为\
  \ Customers 应用添加此功能。）\n\n13. 返回 `ViewModel` 类。在构造函数之后，添加此处显示的公共 `GetDataAsync` 方法：\n\
  \n点击此处查看代码图片\n\n```cs\npublic async Task GetDataAsync()\n{\ntry\n{\nvar response\
  \ = await this.client.GetAsync(\"api/customers\");\nif (response.IsSuccessStatusCode)\n\
  {\nvar customerData = await response.Content.ReadAsStringAsync();\nthis.customers\
  \ = JsonConvert.DeserializeObject<List<Customer>>(customerData);\nthis.currentCustomer\
  \ = 0;\nthis.OnPropertyChanged(nameof(CurrentCustomer));\nthis.IsAtStart = true;\n\
  this.IsAtEnd = (this.customers.Count == 0);\n}\nelse\n{\n// TODO: 处理 GET 失败\n}\n\
  }\ncatch (Exception e)\n{\n// TODO: 处理异常\n}\n}\n```\n\n该方法是异步的；它使用 `HttpClient`\
  \ 对象的 `GetAsync` 方法调用 Web 服务中的 `api/customers` 操作。该操作从数据库检索客户详情。`GetAsync` 方法本身是异步的，并返回封装在\
  \ `Task` 中的 `HttpResponseMessage` 对象。`HttpResponseMessage` 对象包含一个指示请求是否成功的状态码，如果是，则使用\
  \ `HttpResponseMessage` 对象的 `Content` 属性的 `ReadAsStringAsync` 方法来实际检索 Web 服务返回的数据。这些数据由每个客户详情的\
  \ JSON 格式字符串组成，因此通过 `JsonConvert` 类的静态 `DeserializeObject` 方法（它是 Json.NET 包的一部分）将其转换为\
  \ `Customer` 对象列表并赋值给 `customers` 集合。然后将 ViewModel 的 `currentCustomer` 属性指向集合中的第一个客户，并初始化\
  \ `IsAtStart` 和 `IsAtEnd` 属性以指示 ViewModel 的状态。\n\n* * *\n\n![Image](img/Image00005.jpg)\
  \  注意\n\nASP.NET Web API 客户端库假设所有 Web 服务请求可能运行不确定的时间。因此，`HttpClient` 和 `HttpResponseMessage`\
  \ 等类设计为支持异步操作，以防止应用程序在等待响应时被阻塞。事实上，这些类只支持异步操作；没有 `GetAsync` 或 `ReadAsStringAsync`\
  \ 的同步版本。\n\n\n\n\n\n请注意，目前 `GetDataAsync` 方法除了静默消耗之外，不会处理任何异常或失败。在本章的后面部分，你将看到一种在\
  \ UWP 应用中报告异常的技术。\n\n![Image](img/Image00005.jpg) 注意\n\n在生产环境应用中，你不应该不必要地通过网络获取数据。相反，你应该对检索的数据进行选择性获取。然而，在此应用程序中，AdventureWorks\
  \ 数据库仅包含几百名客户，因此它们都被检索并缓存在 `customers` 列表中。\n\n### 14. 如下所示，修改 `Current` 属性的 `get`\
  \ 访问器：\n\n点击此处查看代码图像\n\n```csharp\npublic Customer Current\n{\n    get\n    {\n\
  \        if (this.customers != null)\n        {\n            return this.customers[currentCustomer];\n\
  \        }\n        else\n        {\n            return null;\n        }\n    }\n\
  }\n```\n\n`GetDataAsync` 方法是异步的，因此当 MainPage 表单上的控件尝试绑定到客户时，`customers` 集合可能尚未填充。在这种情况下，此修改可以防止数据绑定在访问\
  \ customers 集合时生成 `null` 引用异常。\n\n### 15. 在 `ViewModel` 构造函数中，更新启用每个命令运行的条件，如下面的代码中的加粗部分所示：\n\
  \n点击此处查看代码图像\n\n```csharp\npublic ViewModel()\n{\n    ...\n    this.NextCustomer\
  \ = new Command(this.Next,\n    () => { return this.customers != null &&\n    this.customers.Count\
  \ > 1 && !this.IsAtEnd; });\n    this.PreviousCustomer = new Command(this.Previous,\n\
  \    () => { return this.customers != null &&\n    this.customers.Count > 0 && !this.IsAtStart;\
  \ });\n    this.FirstCustomer = new Command(this.First,\n    () => { return this.customers\
  \ != null &&\n    this.customers.Count > 0 && !this.IsAtStart; });\n    this.LastCustomer\
  \ = new Command(this.Last,\n    () => { return this.customers != null &&\n    this.customers.Count\
  \ > 1 && !this.IsAtEnd; });\n}\n```\n\n这些更改确保了命令栏上的按钮在有某些数据可以显示之前不会被启用。\n\n### 16.\
  \ 在解决方案管理器中，展开 `MainPage.xaml` 并双击 `MainPage.xaml.cs` 以在代码和文本编辑器窗口中打开它。\n\n### 17.\
  \ 在 `MainPage` 构造函数中添加如下加粗语句：\n\n点击此处查看代码图像\n\n```csharp\npublic MainPage()\n{\n\
  \    ...\n    ViewModel viewModel = new ViewModel();\n    viewModel.GetDataAsync();\n\
  \    this.DataContext = viewModel;\n}\n```\n\n该语句填充了 `ViewModel`。\n\n### 18. 在“调试”菜单上，点击“启动调试”来生成并运行应用程序。\n\
  \n当 `GetDataAsync` 方法运行时，表单最初显示为空，但几秒钟后，应该显示第一个客户 Orlando Gee 的详情：\n\n![Image](img/Image00237.jpg)\n\
  \n### 19. 使用命令栏中的导航按钮遍历客户列表，以验证表单是否按预期工作。\n\n### 20. 返回 Visual Studio 并停止调试。\n\n\
  作为本节的最后一个点缀，让用户知道在表单最初显示时，尽管表单看起来是空的，但应用程序实际上正在获取数据的过程中，这将是有帮助的。在 UWP 应用中，你可以使用\
  \ `ProgressRing` 控件提供这种反馈。当 `ViewModel` 忙于与网络服务通信时显示此控件，否则处于非活动状态。\n\n## 为 Customers\
  \ 表单添加忙碌指示器\n\n### 1. 在代码和文本编辑器窗口中打开 `ViewModel.cs` 文件。在 `GetDataAsync` 方法之后，向 `ViewModel`\
  \ 类添加私有 `_isBusy` 字段和公共 `IsBusy` 属性，如下所示：\n\n点击此处查看代码图像\n\n```csharp\nprivate bool\
  \ _isBusy;\npublic bool IsBusy\n{\n    get { return this._isBusy; }\n    set\n \
  \   {\n        this._isBusy = value;\n        this.OnPropertyChanged(nameof(IsBusy));\n\
  \    }\n}\n```\n\n### 2. 在 `GetDataAsync` 方法中，添加如下加粗语句：\n\n点击此处查看代码图像\n\n```csharp\n\
  public async Task GetDataAsync()\n{\n    try\n    {\n        this.IsBusy = true;\n\
  \        var response = await this.client.GetAsync(\"api/customers\");\n       \
  \ ...\n    }\n    catch (Exception e)\n    {\n        // TODO: Handle exceptions\n\
  \    }\n    finally\n    {\n        this.IsBusy = false;\n    }\n}\n```\n\n`GetData`\
  \ 方法在运行获取客户信息的查询之前将 `IsBusy` 属性设置为 `true`。`finally` 块确保即使发生异常，`IsBusy` 属性也会被设回 `false`。\n\
  \n### 3. 在设计视图中打开 `MainPage.xaml`。\n\n### 4. 在 XAML 格中，添加如下粗所示的 `ProgressRing` 控件作为\
  \ `Grid` 的第一个项：\n\n点击此处查看代码图像\n\n```xml\n<Grid Style=\"{StaticResource}\">\n   \
  \ <ProgressRing HorizontalAlignment=\"Center\"\n                  VerticalAlignment=\"\
  Center\" Foreground=\"AntiqueWhite\"\n                  Height=\"100\" Width=\"\
  100\" IsActive=\"{Binding IsBusy}\"\n                  Canvas.ZIndex=\"1\"/>\n \
  \   <Grid x:Name=\"customers\" Margin=\"40,0,0,0\" ...\n</Grid>\n```\n\n将 `Canvas.ZIndex`\
  \ 设置为 `1` 可以确保 `ProgressRing` 显示在 `Grid` 控件前面。\n\n### 5. 在“调试”菜单上，点击“启动调试”来生成并运行应用程序。\n\
  \n注意，在显示第一个客户之前，进度环会短暂出现。如果你发现第一个客户出现得太快，可以在 `GetDataAsync` 方法中引入较小的延迟以确认进度环正在工作。添加以下语句，使方法暂停五秒：\n\
  \n点击此处查看代码图像\n\n```csharp\npublic async Task GetDataAsync()\n{\n    try\n    {\n\
  \        this.IsBusy = true;\n        await Task.Delay(5000);\n        var response\
  \ = await this.client.GetAsync(...);\n        ...\n    }\n    ...\n}\n```\n\n测试完进度环后，务必删除此语句。\n\
  \n### 6. 返回 Visual Studio 并停止调试。\n\n### 通过 REST 服务插入、更新和删除数据\n\n除了允许用户查询和显示数据外，许多应用程序还需要让用户插入、更新和删除信息。ASP.NET\
  \ Web API 通过使用 PUT、POST 和 DELETE 请求来实现这些操作。按照约定，PUT 请求修改现有的资源，而 POST 请求创建新实例。DELETE\
  \ 请求删除资源。ASP.NET Web API 模板生成的代码遵循这些约定。\n\n### REST Web 服务中的等幂性\n\n在 REST Web 服务中，PUT\
  \ 请求应该是等幂的，这意味着如果你多次执行相同的更新，结果始终相同。在 AdventureWorksService 示例中，如果你修改客户并将电话号码设置为“888-888-8888”，无论你执行多少次该操作，结果都是一样的。这似乎是显而易见的，但你应该根据这一要求来设计\
  \ REST Web 服务。通过这种设计方法，当面临并发请求时，Web 服务可以是健壮的，即使在发生网络故障时也是（如果客户端丢失了与 Web 服务的连接，它可以重新连接并执行相同的请求，而无需担心之前的请求是否成功）。\n\
  \n\n\n\n\n例如，如果你正在构建一个银行系统，你可能会产生这种冲动：提供一个 `CreditAccount` 方法来为客户账户的余额增加金额，并将此方法暴露为\
  \ PUT 操作。然而，每当你调用此操作时，其结果都是对账户进行增量式贷记。因此，跟踪操作调用是否成功是必要的。如果你的应用程序认为之前的某个调用失败或超时，它就不能重复调用此操作，因为结果可能会导致同一个账户产生多次重复的贷记。\n\
  \n有关在云端应用程序中管理数据一致性的更多信息，请参阅 `[`msdn.microsoft.com/library/dn589800.aspx`](https://msdn.microsoft.com/library/dn589800.aspx)`\
  \ 上的“数据一致性原理”。\n\n在接下来的练习中，你将扩展 Customers 应用程序并添加功能，使用户可以添加新客户并修改现有客户的详情。应用程序将构建适当的\
  \ REST 请求并发送到 `AdventureWorksService` Web 服务。你不会提供任何删除客户的功能。此限制确保了你拥有所有与 Adventure\
  \ Works 组织进行过业务往来的客户的记录，这可能是出于审计目的的需要。此外，即使客户已经长时间没有活跃，客户也有可能在未来的某个时刻下订单。\n\n![Image](img/Image00005.jpg)\
  \ 注意\n\n业务应用程序日益普遍的一种做法是：永远删除数据，而是简单地执行更新，以某种方式将数据标记为“已删除”并防止其显示。这主要是由于保留完整数据记录的要求，通常是为了满足合规性。\n\
  \n## 在 `ViewModel` 类中实现添加和编辑功能\n\n1. 返回 Visual Studio。\n2. 在 Customers 项目中，删除 `ViewModel.cs`\
  \ 文件以从项目中移除它。允许 Visual Studio 永久删除此文件。\n3. 右键点击 Customers 项目，指向“添加”，然后点击“现有项”。选择位于你“文档”文件夹中\
  \ `\\Microsoft Press\\VCSBS\\Chapter 27` 文件夹下的 `ViewModel.cs` 文件，然后点击“添加”。\n\n`ViewModel.cs`\
  \ 文件中的代码变得变得相当冗长，因此已重新组织为多个区域（regions）以便于管理。`ViewModel` 类还扩展了以下布尔属性，这些属性指示 `ViewModel`\
  \ 运行的模式：浏览、添加或编辑。这些属性定义在名为 `Properties For Managing The Edit Mode` 的区域中：\n\n- `IsBrowsing`\
  \ 此属性指示 `ViewModel` 是否处于浏览模式。当 `ViewModel` 处于浏览模式时，`FirstCustomer`、`LastCustomer`、`PreviousCustomer`\
  \ 和 `NextCustomer` 命令被启用，视图可以调用这些命令来浏览数据。\n- `IsAdding` 此属性指示 `ViewModel` 是否处于添加模式。在此模式下，`FirstCustomer`、`LastCustomer`、`PreviousCustomer`\
  \ 和 `NextCustomer` 命令被禁用。你将定义一个 `AddCustomer` 命令、一个 `SaveChanges` 命令和一个 `DiscardChanges`\
  \ 命令，它们在此模式下将被启用。\n- `IsEditing` 此属性指示 `ViewModel` 是否处于编辑模式。与添加模式一样，在此模式下，`FirstCustomer`、`LastCustomer`、`PreviousCustomer`\
  \ 和 `NextCustomer` 命令被禁用。你将定义一个 `EditCustomer` 命令，该命令在此模式下将被启用。`SaveChanges` 命令和\
  \ `DiscardChanges` 命令也将启用，但 `AddCustomer` 命令将被禁用。在添加模式下，`EditCustomer` 命令将被禁用。\n\
  - `IsAddingOrEditing` 此属性指示 `ViewModel` 是否处于添加或编辑模式。你将在本次练习中定义的的方法中使用此属性。\n- `CanBrowse`\
  \ 如果 `ViewModel` 处于浏览模式且与 Web 服务有连接，则此属性返回 `true`。构造函数中创建 `FirstCustomer`、`LastCustomer`、`PreviousCustomer`\
  \ 和 `NextCustomer` 命令的代码已更新，使用此属性来确定这些命令应该启用还是禁用，如下所示：\n\n点击此处查看代码图像\n\n```csharp\n\
  public ViewModel()\n{\n\n...\n\nthis.NextCustomer = new Command(this.Next,\n\n()\
  \ => { return this.CanBrowse &&\nthis.customers != null && !this.IsAtEnd; });\n\
  this.PreviousCustomer = new Command(this.Previous,\n\n() => { return this.CanBrowse\
  \ &&\nthis.customers != null && !this.IsAtStart; });\nthis.FirstCustomer = new Command(this.First,\n\
  \n() => { return this.CanBrowse &&\nthis.customers != null && !this.IsAtStart; });\n\
  this.LastCustomer = new Command(this.Last,\n\n() => { return this.CanBrowse &&\n\
  this.customers != null && !this.IsAtEnd; });\n}\n```\n\n- `CanSaveOrDiscardChanges`\
  \ 如果 `ViewModel` 处于添加或编辑模式且与 Web 服务有连接，则此属性返回 `true`。\n\n`Methods For Fetching And\
  \ Updating Data` 区域包含以下方法：\n\n- `GetDataAsync` 这是你在本章稍早创建的相同方法。它连接到 Web 服务并检索每个客户的详情。\n\
  - `ValidateCustomer` 此方法接收一个 `Customer` 对象并检查 `FirstName` 和 `LastName` 属性以确保它们不为空。它还检查\
  \ `EmailAddress` 和 `Phone` 属性以验证它们包含有效格式。如果数据有效，该方法返回 `true`，否则返回 `false`。你将在稍后创建\
  \ `SaveChanges` 命令时使用此方法。\n\n![Image](img/Image00005.jpg) 注意\n\n验证 `EmailAddress`\
  \ 和 `Phone` 属性的代码通过使用 `System.Text.RegularExpressions` 命名空间中定义的 `Regex` 类执行正表达式匹配。要使用此类，你需要在\
  \ `Regex` 对象中定义数据应匹配的模式。有关正则表达式和 `Regex` 类的更多信息，请参阅 Microsoft 网站上的“正则表达式模型”：`[`msdn.microsoft.com/library/30wbz966`](http://msdn.microsoft.com/library/30wbz966)`。\n\
  \n- `CopyCustomer` 此方法的目的是创建 `Customer` 对象的浅拷贝。你将在创建 `EditCustomer` 命令时使用它，以便在更改数据之前制作客户原始数据的副本。如果用户决定放弃更改，则只需从此方法创建的副本复制回原始数据。\n\
  \n4. 在解决方案管理器中，展开 Customers 项目并双击 `ViewModel.cs` 文件以在代码文本窗口中打开它。\n5. `ViewModel`\
