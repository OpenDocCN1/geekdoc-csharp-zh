  \ `Parallel` 类对某些常见的编程结构进行并行化，还了解了什么时候不适合对代码进行并行化。你在图形用户界面中结合使用了任务和线程来提高响应速度和吞吐量，并了解了如何以整洁且受的方式取消任务。\n\
