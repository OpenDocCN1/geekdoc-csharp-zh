  \ }\n}\n\npublic int Y\n{\n    get { return this._y; }\n    set { this._y = value;\
  \ }\n}\n```\n\n## 7. 在代码和文本编辑器中显示 `DrawingPad.xaml.cs` 文件，并找到 `drawingCanvas_Tapped`\
  \ 方法。\n\n当用户点击屏幕或点击左鼠标键时会运行此方法。它会在用户点击或触摸的位置在屏幕上画一个正方形。\n\n## 8. 找到调用 `SetLocation`\
