  }\n```\n\n该方法返回一个以 `(x + y*i )` 形式表示复数的字符串。\n\n**7.** 如后文代码中加粗所示，为 `Complex` 类添加重载的\
  \ `+` 运算符：\n\n点击此处查看代码图像\n\n```csharp\nclass Complex\n{\n...\n\npublic static Complex\
  \ operator +(Complex lhs, Complex rhs)\n{\n\nreturn new Complex(lhs.Real + rhs.Real,\
  \ lhs.Imaginary + rhs.Imaginary);\n\n}\n\n}\n```\n\n这是二元加法运算符。它接收两个 `Complex` 对象并通过执行练习开始时表格所示的计算将它们相加。该运算符返回一个包含此计算结果的新\
  \ `Complex` 对象。\n\n**8.** 为 `Complex` 类添加重载的 `–` 运算符。\n\n点击此处查看代码图像\n\n```csharp\n\
  class Complex\n{\n...\n\npublic static Complex operator -(Complex lhs, Complex rhs)\n\
  {\n\nreturn new Complex(lhs.Real - rhs.Real, lhs.Imaginary - rhs.Imaginary);\n\n\
  }\n\n}\n```\n\n此运算符的格式与重载的 `+` 运算符相同。\n\n**9.** 实现 `*` 和 `/` 运算符。\n\n点击此处查看代码图像\n\
  \n```csharp\nclass Complex\n{\n...\n\npublic static Complex operator *(Complex lhs,\
  \ Complex rhs)\n{\n\nreturn new Complex(lhs.Real * rhs.Real - lhs.Imaginary * rhs.Imaginary,\n\
  \nlhs.Imaginary * rhs.Real + lhs.Real * rhs.Imaginary);\n\n}\n\npublic static Complex\
  \ operator /(Complex lhs, Complex rhs)\n{\n\nint realElement = (lhs.Real * rhs.Real\
  \ + lhs.Imaginary * rhs.Imaginary) /\n\n(rhs.Real * rhs.Real + rhs.Imaginary * rhs.Imaginary);\n\
  \nint imaginaryElement = (lhs.Imaginary * rhs.Real - lhs.Real * rhs.Imaginary) /\n\
  \n(rhs.Real * rhs.Real + rhs.Imaginary * rhs.Imaginary);\n\nreturn new Complex(realElement,\
  \ imaginaryElement);\n\n}\n\n}\n```\n\n这些运算符的格式与前两个运算符相同，尽管计算要复杂一些。（对于 `/` 运算符的计算被分成了两个步骤，以避免过长的代码行。）\n\
  \n**10.** 在代码和文本编辑器中显示 `Program.cs` 文件。在 `Program` 类的 `doWork` 方法中添加下方**加粗**所示的语句，并删除\
