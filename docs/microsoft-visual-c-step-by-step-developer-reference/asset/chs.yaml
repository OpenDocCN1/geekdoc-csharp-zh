  \    }\n\n    List<PlayingCard> cardsInSuit = this.cardPack[suit];\n    PlayingCard\
  \ card = cardsInSuit.Find(c => c.CardValue == value);\n    cardsInSuit.Remove(card);\n\
  \n    return card;\n}\n```\n\n#### 10. 定位 `IsCardAlreadyDealt` 方法。\n\n该方法通过检查数组中相应的元素是否被设置为\
  \ `null` 来判断牌是否已经过分发。你需要修改此方法，以判断 `cardPack` `Dictionary` 集合中对应花色的列表中是否存在指定值的牌。\n\
  \n要判断 `List<T>` 集合是否存在某个项，你使用 `Exists` 方法。该方法与 `Find` 相似，因为它也接受一个谓词作为参数。谓词会依次传递集合中的每个项目，如果项目符合某些指定标准，则返回\
  \ `true`，否则返回 `false`。在这种情况下，`List<T>` 集合持有 `PlayingCard` 对象，如果传递给 `Exists` 谓词的\
  \ `PlayingCard` 项目的花色和点值与传递给 `IsCardAlreadyDealt` 方法的参数匹配，则谓词应返回 `true`。\n\n更新该方法，如下例所示中的**粗体**所示：\n\
  \n点击此处查看代码图像\n\n```csharp\nprivate bool IsCardAlreadyDealt(Suit suit, Value value)\n\
  {\n    List<PlayingCard> cardsInSuit = this.cardPack[suit];\n    return (!cardsInSuit.Exists(c\
  \ => c.CardSuit == suit && c.CardValue == value));\n}\n```\n\n#### 11. 在代码和文本编辑器窗口中打开\
