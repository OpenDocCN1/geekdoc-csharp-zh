  \n```csharp\nstatic void doWork()\n{\n...\nAnniversary.AdvanceMonth();\nConsole.WriteLine($\"\
  New value of Anniversary is {Anniversary}\");\nConsole.WriteLine($\"Value of copy\
  \ is {AnniversaryCopy}\");\n}\n```\n\n## 7. 在调试菜单中，点击“开始调试启动”来编译并运行应用程序。验证控制台显示以下消息：点击此处查看代码图片\n\
