  \n2. 恭喜！你现在已经完成了你的第一个程序并成功运行了它！\n\n## 第一个程序 - 它是做什么的？\n\n程序所做的就是在屏幕上打印一条消息，并等待按下回车键。更多细节如下所示：\n\
  \n1. `main()` - 表示程序的开始。\n2. `{`（左括号）意味着一个“块”的开始。\n3. `printf` 是一个打印“函数”——输出。\n\
  4. `getchar()` 是一个键盘读取“函数”——读取字符输入并等待回车键被按下。\n5. `}`（右括号）意味着一个块的结束。\n6. `/* */`\
  \ 意味着“注释”。“标记符”之间的文本会被编译器忽略——这些文本用于记录每一步的操作。\n\n在本指南结束时，你应该能够理解程序中所有行代码的作用。\n\n\
  ## 第一个程序 – 观察\n\n我们从这个第一个程序看到：\n\n* ‘C’是“自由格式的”—— 程序中不包含输入的行号（某些文本编辑器会在左侧边距显示行号）。\n\
  * ‘C’是“块结构化的”—— 所有内容都在大括号 `{ }` 之间的“块”中指定。\n\n我们还应该注意 C 是区分大小写的。这意味着如果你使用 `Printf`（大写字母“P”）而不是\
  \ `printf`，程序将无法运行。\n\n在接后的示例中，并不总是列出整个程序。除非另有说明，否则你应该始终在以下“骨架”中输入程序：\n\n```c\n\
  int main ( )\n{\n    <你的程序代码>\n}\n```\n\n## 关于“控制应用程序”和控制窗口的说明\n\n我们刚刚输入的程序，以及在本指南中将看到的其他程序一样，运行在`控制窗口`中。`控制窗口`本质上是对交互式计算早期的回顾——那时你有一个基础计算机控制台，只能显示字符或非常有限的图形。没有图形用户界面，几乎没有实际的图形。如果你学习到《高级\
