  ### 目标系统\n\n在这里，我们的目标系统是树莓派或 Windows PC——但你可以在运行不同类型系统的 PC 或树莓派上编译代码。这通常是通过所谓的“嵌入式系统”来完成的。对于这类开发任务，你需要用到交叉编译器。\n\
  \n## 什么是编译？\n\n*   它是将一段文本转换为“目标代码”的过程，而后者会被进一步转换成一个可运行的、或称**为** *executable* （可执行）的程序。\n\
  *   编译器会针对相关语言（在我们的例子中是‘C’语言）的规则检查这段文本是否符合规范指令集合。\n*   当编译器发现某处违反了该语言的规则时，它会显示如下信息：-\n\
  \n> “错误 X 行 Y 列:……描述……”\n\n或者不太严重的情况则是：\n\n> “警告 Z 行 W 列 : ……描述 ……”\n\n##  编辑 -\
