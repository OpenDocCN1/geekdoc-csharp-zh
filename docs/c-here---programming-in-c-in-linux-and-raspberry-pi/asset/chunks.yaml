    As we discussed in section [15.5](#part0006_split_006.html_id_Toc483576777), it
    is good ''C'' practice to predeclare all functions that are used in your program
    – indeed, most compilers tend to enforce this practice by default. We have actually
    used some functions already - “printf”, “scanf”, `clrscr` and `getch`. Strictly
    speaking, we should have pre-declared these functions in our programs before we
    called them. However, there is a short cut for doing this. For `printf` and `scanf`
    pre-declarations, we can add the following line to the very top of our program.


    ```c

    #include “stdio.h”

    ```


    This line tells the compiler to “insert” the file `stdio.h` into the current file
    (but only during compilation). If you look in this file, you will find the pre-declarations
    for `printf` and `scanf`, along with many other “Input and Output” (I/O) functions.
    That is why this file is called `stdio.h` it is short for “standard I/O” header
    file.


    There are other header files which should be included when you use other pre-defined
    system functions. We will cover these as we come across them. You can define your
    own header files, for functions you define, but this is only really necessary
    when your ''C'' program is split across a number of files.


    ## Input Output Functions


    * `printf` can take a variable number of parameters (not covered in this course).
    It returns no value.


    * `scanf` can also take a variable number of parameters, and returns a value representing
    the number of input items matched and assigned.


    * `getch` is a function which takes no parameters and waits for a key to be pressed.
    It returns a value representing the key pressed. (For letters and numbers this
    is the ASCII value of the letter or number.)


    ## String Handling Functions


    One of the most commonly used groups of library functions are the String Manipulation
    functions. When using string library functions in your ''C'' program put the line


    ```c

    #include <string.h>

    ```


    at the top of your listing.


    Many standard ''C'' functions (for historical reasons) have somewhat cryptic names.
    String handling functions are no exception.


    ### Copy String Function - “strcpy”


    In most other high level languages we can “copy” strings from one variable to
    another by simple assignment:-


    ```c

    First_string=Second_string

    ```


    This would COPY all the characters from the variable `First_string` to the variable
    `Second_string`.


    If in ''C'' we did the following:-


    ```c

    /* Declare 2 strings */

    main ( )

    {

    char text_string_1[ ] = “You are awful, but I like you”;

    char text_string_2[ ] = “It''s all done in the best POSSIBLE taste”;

    text_string_1 = text_string_2;

    }

    ```


    This would not have the desired effect. Indeed, it may not even compile! This
    is one example of where C is revealed as a low level language.


    ### String Copy Function - “strcpy”


    To COPY characters from one string to another, we have to use a function; the
    ''C'' function `strcpy`. The general form is:-


    ```c

    strcpy (<destination string>, <source string>);

    ```


    In our example, we could do


    ```c

    strcpy (text_string_1, text_string_2);

    ```


    The action of `strcpy` is to copy each character from `text_string_2` to `text_string_1`
    up until a “NULL” (0) character is reached - the end of the string.


    WARNING: There MUST be enough space in the destination area to hold the string
    being copied e.g. make sure this `NEVER` happens:-


    ```c

    /* Any old string. */

    char source_string[ ] = “Be careful using strcpy”;

    char destination_string[11] = “Too Small!”;

    /* Above is 10 characters + 1 NULL character.” */

    strcpy (destination_string, source_string);

    /* This may cause your program to **CRASH!***/

    ```


    ### String copy “n” Characters - “strncpy”


    This works in an identical way to string copy, but only copies the first “n” characters,
    or until a NULL character is encountered in the source string e.g.


    ```c

    strncpy (text_string_1, text_string_2, 10);

    ```


    will copy the first 10 characters of `text_string_2` to `text_string_1` (or just
    `text_string_1`, if it is less than 10 characters long).


    ### String Length - “strlen”


    This function returns the length of the string as an integer e.g.


    ```c

    strlen (“Reeves & Mortimer”);

    ```


    would return a value of 17.


    The value returned does not include the null i.e


    ```c

    strlen (“\0”);

    ```


    ### String Compare - “strcmp”


    This function compares 2 strings. It is used as follows:-


    ```c

    strcmp (string_1, string_2);

    ```


    and returns 1 of 3 possible results:-


    0 if the strings are `IDENTICAL`.


    < 0 if `string_1` is “alphabetically” less than `string_2`


    > 0 if `string_1` is “alphabetically” greater than `string_2`


    Example call:-


    ```c

    char string_1[ ]=“Only Me!", string_2[ ]=“Only Me!”;

    .

    .

    if (!strcmp (string_1, string_2))

    {

    printf (“The strings are identical”);

    }

    .

    .

    ```


    (Of course, you wouldn''t set up an assignment of 2 strings and then check if
    they were equal - one would normally be read from the keyboard and then)


    ## String to Number Conversion


    To use these functions, put


    ```c

    #include <stdlib.h>

    ```


    at the top of your file.


    ### String to Integer Conversion - atoi


    This function will convert an ASCII string of digits to an integer e.g.


    ```c

    int answer_to_u_e;

    answer_to_u_e = atoi (“42”);

    ```


    ### String to Float Conversion - atof


    This function will convert an ASCII string of digits to a float e.g.


    ```c

    float body_temp;

    body_temp = atof (“98.4”);

    ```


    ### “Print” into a String - “sprintf”


    `sprintf` is a very useful function. It can do all `printf` can do, but it puts
    the result in a string. It is used in the following:-


    ```c

    sprintf (destination_string, <control string>, parameters);

    ```


    Want to convert a number to a string? Use `sprintf`


    ## Codecracker Game – Finishing The Program


    We have now covered or mentioned most or all the aspects of C that are used for
    our “Codecracker/Mastermind” game and you can find the finished program in [Appendix
    1 – Codecracker Program Listing](#part008_split_001.html_id_Toc483576798). There
    are quite a few comments in the program and these should, when read after you
    have been through this guide, allow you to understand the operation of the program.


    # ''C'' This Pointer - That''s You, That Is


    One of the things that is almost unavoidable when learning C is the use of pointers.
    This can make it much harder, initially, to understand what is happening, but
    hopefully, this next paragraph will help!


    ## Computer Memory and Addressing


    All digital computer memory is made of bytes (for the sake of argument, even computer
    memory which may only be accessed in 16, 32 or even 64 bit operations can just
    be considered as groups of 2,4 or 8 bytes). For the computer to access each byte
    (or word etc), there must be a mechanism within the system for identifying individual
    bytes of memory. This mechanism is known as *addressing*. It is a simple enough
    concept and the name is quite appropriate. On a street, each house is uniquely
    identified by its number, and the *address* of the house is the thing which is
    used to uniquely distinguish it from any other house on the planet.


    Terrestrial Addresses can become quite messy and complicated and often have extra
    safety features "built in", such as a postal code, to assist or facilitate unique
    identification. With computer memory *each location is said to have a different
    address*. The address is normally a single number, written in decimal or, more
    commonly, hexadecimal format.

