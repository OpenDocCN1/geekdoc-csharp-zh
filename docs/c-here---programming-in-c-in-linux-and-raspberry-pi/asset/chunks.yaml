    7. 数组元素最终存储了 0 到 9 的值。\n\n我们实际上可以稍微重写之前的程序。\n\n```c\nint main( )\n{\n    char\
    \ character_array[10];\n    char *character_ptr;\n    char i;\n    character_ptr\
    \ = character_array;\n    for (i=0; i < 10; i++)\n    {\n        *character_ptr++\
    \ = i;\n    }\n}\n```\n\n### 程序说明\n\n1. 在这里，我们直接使用数组名 `character_array` 初始化了 `character_ptr`。如果你只引用数组名，它意味着数组中第一个元素的地址（无论该类型是什么类型）。如果你回头看我们对\
    \ `strcpy`（字符串拷贝）库函数的使用，这实际上就是我们在那里所做的。\n2. 我们在赋值中递增加了字符指针（这种操作在许多程序中非常常见）。\n\n\
    ## 更高级的指针用法\n\n下一个程序实现了它自己的 `strcpy` 库函数版本。它是指针如何在“C”语言中经常被使用的良好示例。\n\n```c\n\
    void string_copy (char *destination_ptr, char *source_ptr)\n{\n    /* 从源地址拷贝到目的地，直到遇到\
    \ NULL - 此时条件将失败！ */\n    do\n    {\n        *destination_ptr++ = *source_ptr;\n\
    \    }\n    while (*source_ptr++);\n}\n\nint main( )\n{\n    char source_string[\
    \ ] = “Reg Holsworth for PM!”\n    char destination_string[50];\n    string_copy\
    \ (destination_string, source_string);\n    printf (“My vote is ... %s\\n”, destination_string);\n\
    }\n```\n\n### 程序说明\n\n1. 我们定义了一个函数 `string_copy`，它有两个字符指针参数（`char *`）。\n2. 我们启动了一个\
    \ `do` 循环。\n3. 我们将目标指针指向的字符赋值为源指针指向的字符，并（隐式地通过 `++`）递增目标指针。\n4. 我们测试源指针指向的内容是否为\
    \ NULL（零）字符，并隐式地递增源指针。如果我们找到一个 NULL 字符，它会被拷贝，但循环将终止。\n5. 通常不建议重写库函数！这个示例纯粹是为了演示指针用法。\n\
    6. 这个示例说明了如何用几行简短的“C”语句编写一组相当复杂的操作。\n7. 库函数 `strcpy` 的类型实际上是指向 `char` 的指针。它返回指向目标字符串的指针（换句话说，即第一个参数的值）。\n\
    \n**注意**：在“C”程序中使用指针时应格外小心。这是又一个“C”语言假设你知道自己在做什么的领域。错误的指针使用可能会导致数据丢失或你的程序正在使用的任何文件发生文件损坏。\n\
    \n# 文件处理\n\n编程语言的重要特性之一是它们在宿主系统的主内存与其磁盘存储之间传输数据的能力。例如，假设你写了一个“C”程序来存储实验结果，你希望程序首先允许用户输入值，然后将它们保存到磁盘上的文件中。在较后的阶段，你可能又希望将这些数据检索到程序中，用于其他用途。或者，你可能希望将数据加载到另一个软件包中\
    \ - 例如文字处理器或电子表格。\n\n## 文件输入与输出 - 文件 I/O\n\n用于程序操作文件的通用术语是“文件 I/O”。在“C”语言中，文件\
    \ I/O 通过使用库函数完成，这里展示了几个:-\n\n| 函数 | 描述 |\n| :--- | :--- |\n| `fopen (<filename>,\
    \ <mode>)` | 准备文件备用 - 返回用于 `<stream>` 的值 |\n| `feof (<stream>)` | 检查文件末尾。 |\n\
    | `fprintf (<stream>, control string, variables)` | 将内容输出到文件。 |\n| `fputc (<stream>,\
    \ char);` | 向文件输出单个字符。 |\n| `fgetc (<stream>);` | 返回从文件中读取的单个字符。 |\n| `fscanf\
    \ (<stream>, control string, variables)` | 从文件（读取）内容 - 类似于“scanf”。 |\n| `fclose\
    \ (<stream>)` | 结束文件使用 |\n\n文件 I/O 有许多方法，并不是所有的都会在这里列出。\n\n### `fopen`\n\n该函数接受\
    \ 2 个字符串作为参数，请求系统为你的程序准备文件并设置就绪。该函数的第二个参数是一个字符串，指示你希望以哪种“模式”访问文件:-\n\n### `fopen`\
    \ 模式\n\n| 模式字符串 | 动作/描述 |\n| :--- | :--- |\n| `r` | 打开以读取 |\n| `w` | 创建以写入。如果文件存在，它将被覆盖。\
    \ |\n| `a` | 追加模式；在末尾打开。如果文件不存在则创建。 |\n| `r+` | 打开以读和写 |\n| `w+` | 创建以写入。如果文件存在，它将被覆盖。\
    \ |\n| `a+` | 追加模式；在末尾打开。如果文件不存在则创建。 |\n\n例如，`fopen(“otis.txt”, “w”)` 会尝试打开文件。返回的值是一个用于访问文件的指针（`stream`）。\n\
    \n### 文件 I/O 与控制台的关系\n\n到为止，我们查看了如何向屏幕输出信息（使用 `printf`）以及如何从键盘读取信息（使用 `scanf`）。“C”语言的一个特点是，输出到文件与输出到屏幕非常相似。\n\
    \n## ASCII 输出\n\n这意味着向文件输出字母和数字（以及特殊字符，如制表符、回车）。这是通过使用 `fprintf` 完成的。它的工作方式与 `printf`\
    \ 完全相同，只是输出目标是文件而不是屏幕。\n\n```c\n#include <stdio.h>\nint main(void)\n{\n    FILE\
    \ *stream;\n    int i = 100;\n    char c = 'C';\n    float f = 1.234;\n\n    /*\
    \ 打开文件写入 */\n    stream = fopen(“otis.txt”, “w”);\n\n    /* 向文件写入数据 */\n    fprintf(stream,\
    \ “%d %c %f”, i, c, f);\n\n    /* 关闭文件 */\n    fclose(stream);\n}\n```\n\n程序的动作如下：\n\
    1. 声明变量 `stream` 用于存储访问文件的指针（代码号）。\n2. 声明 `int`、`char` 和 `float` 变量并对其进行初始化。\n\
    3. 打开文件写入并存储返回的指针。\n4. 将变量的值打印到 `stream` 指向的文件。\n5. 关闭文件。\n\n运行此程序后，你可以从命令行执行：\n\
    `pi@raspberrypi:~> cat otis.txt`\n这将显示由程序生成的文件内容:-\n`100 C 1.234`\n\n如果你将 `fprintf`\
    \ 语句改为：\n`fprintf(stream, “%d\\n%c\\n%f\\n”, i, c, f);`\n重新编译并运行程序，你将在 `otis.txt`\
    \ 中看到：\n`100`\n`C`\n`1.234`\n\n## ASCII 文件输入\n\n可以从文件中读取数据，就像是从键盘输入一样 - 这是通过使用\
    \ `fscanf` 函数实现的 - 这是一个与 `scanf` 非常相似的函数 - 它只是期望从文件而非键盘获取数据。考虑以下示例:-\n\n```c\n\
    #include <stdio.h>\nint main(void)\n{\n    FILE *stream;\n    int i = 100;\n \
    \   char c = 'C';\n    float f = 1.234;\n\n    /* 打开文件以读取 */\n    stream = fopen(“otis.txt”,\
    \ “r”);\n}\n```\n"
- fmt: "\n```c\n/* Check we have access to the file. */\n\nif (stream != NULL)\n{\n\
    \    /*OK, Read some data from the file */\n    fscanf(stream, “%d%c%f”, &i, &c,\
    \ &f);\n}\n\n/* close the file */\nfclose(stream);\n}\n```\n\nThe action of the\
    \ program is as follows:-\n\n1. Declare some variables - including one to hold\
    \ the file `stream`.\n2. Attempt to open the file for reading from. If the file\
    \ cannot be opened, `stream` will have a value of `0` (`NULL`).\n3. Check if the\
    \ file was opened correctly.\n4. Read the three data items from the file and into\
    \ the variables named `i`, `c` and `f`.\n5. Close the file and finish.\n\nThe\
    \ file would have to have data in it which matched what the `fscanf` was trying\
    \ to read in hence, a file which contained\n\n147 z 9.81\n\nOr\n\n147\nz\n9.81\n\
    \nwould be OK (each thing separated by space or New Line). Once the `fscanf` in\
    \ the program had executed, `i` would have a value `147`, `c` would hold the character\
    \ `z` and `f` would have the value `9.81`. However, if the file contained\n\n\
    z\n147\n9.81\n\nthings would get “messed up,” because the example `fscanf` was\
    \ expecting to see a number first - what it actually saw was a character, so the\
    \ variables would be set to the correct values.\n\n## Command Line Arguments\n\
    \nConsider the Linux command `cp`, it could actually be written as a C program\
    \ (as has been alluded to before when we were covering file / stream manipulation).\
    \ The pseudo code for it might be as follows:-\n\nCheck `>2nd File<` (destination)\
    \ is not same as first. If it is, quit immediately.\n\nOpen `>1st file<` - “source”\
    \ file.\n\n(***Someone missed out a line of pseudo code here)\n\nOpen destination\
    \ file.\n\nRepeat\n    Read chunk of source file.\n    Write chunk to destination\
    \ file.\nUntil (All source file has been read).\n\nWhen we run the program the\
    \ things marked like `>this<` are pieces of information which are on the Command\
    \ Line. They are `PARAMETERS` to the `copy` command - the names of the files to\
    \ be copied are supplied to the `copy` program as `COMMAND LINE PARAMETERS`. When\
    \ the `copy` program runs, it takes the `2` strings supplied on the command line\
    \ as being filenames. It then tries to open these files and actually do the copying.\n\
    \n(***The line of pseudo code which, years ago, was missed out in the original\
    \ design of the `cp` command was the one which checks the destination drive /\
    \ device to see if there is enough space to hold the destination file - if there\
    \ isn't, the program should IMMEDIATELY quit.)\n\nThe command line arguments to\
    \ copy are shown below:-\n\n`cp mavis.txt jack.txt`\n`argument [0]` `argument[1]`\
    \ `argument[2]`\n\nIn fact, most terminal commands - which are programs in their\
    \ own right - take some form of command line argument.\n\n### Accessing Command\
    \ Line Arguments from a C program\n\nTo access command line arguments from a C\
    \ program is relatively straightforward. They are treated by a C program as a\
    \ set of strings - an array. The following C program demonstrates this.\n\n```c\n\
    /*\nThis is a program to demonstrate the use of command line arguments\n*/\n#include\
    \ <iostream.h>\n#include <conio.h>\n\n// We modify the declaration of “main” so\
    \ that we can access command line\n//parameters...\n/* The system organises them\
    \ in the following way:-\nString String Number\n+----------------+\n| Program\
    \ Name | 0\n+----------------+\n| | 1\n+----------------+\n| | 2\n+----------------+\
    \ .\n. . .\n. . .\n+----------------+ .\n| | no_of_strings (first parameter in\n\
    +----------------+ declaration of “main” below).\n*/\n//Note, the use of the “char\
    \ *” VERY important.\nint main(int no_of_strings, char *command_line_strings[])\n\
    {\n    int i;\n    printf(“\\033[2J”); // A special command to Clear the console\
    \ “screen” area\n    //Print out the name of our test program - this is held as\
    \ the\n    //first string in the array:-\n    printf (“The program executable\
    \ filename is: \\t”);\n    printf (“%s\\n\\n”, mmand_line_strings[0]);\n\n   \
    \ if (no_of_strings > 1)\n    {\n        printf (“Command line arguments are:\\\
    n”);\n        //Now we print out each of the command line strings in turn.\n \
    \       for (i = 1; i < no_of_strings; i++)\n        {\n            printf (“\\\
    t%s\\n”, command_line_strings[i]);\n        }\n    }\n    else\n    {\n      \
    \  printf (“No command line arguments given.\\n”);\n    }\n}\n```\n\nIt is fairly\
    \ simple to “bolt together” the things we used when accessing files to the above\
    \ program to produce a new version of the linux `cat` command (which just displays\
