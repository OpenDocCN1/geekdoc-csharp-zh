  trans: "\n想象一下你房间里的书架，上面放着一些书。如果你走进另一个房间，（比如关上门），就看不到那些书了。然而，如果把书架放到外面的花园里，你可能就能透过窗户从两个房间都看到它。\n\
    \n在 C 程序中，我们可以对数据做类似的事情——将数据声明在所有函数都能看到的位置。具体做法是把数据声明放在所有函数之外。\n\n```c\nchar some_text[\
    \ ]=\"This can be accessed by all functions.”;\n\nvoid print_the_text( )\n{\n\
    \    printf (“Printing from the function...”);\n    printf (some_text);\n}\n\n\
    int main ( )\n{\n    printf (“Printing from 'Main'“);\n    printf (some_text);\n\
    \    print_the_text( );\n}\n```\n\n以这种方式（即位于所有函数外部）声明的、能被所有函数访问的数据称为**全局数据**。\n\
    \n## 带参数的函数\n\n### 向参数传递数值\n通常我们会向过程传递数值：例如将一个摄氏温度值传给某个数并输出华氏度结果。以下示例定义了一个名为 `c_to_f`\
    \ 的新 C **类型参数（也称为`实参`）**\n\n/*\n类型名 形式参数名,  形参类别 （也称“实际传入的参数”）\n*/\n\n```c\nvoid\
    \ c_to_f (int degrees_c)\n{ \n　printf(“%d Degrees C = %d degrees F”，degrees_c，，((degrees_c\
    \ *9)/5)+32);　　    \n} \n\nInt Main(void)     \n｛      \n    \tc_To_F(20)；   \
