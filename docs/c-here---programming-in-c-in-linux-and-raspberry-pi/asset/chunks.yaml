    }


          /* Stuff to Add here!*/


    /* Now ask if the user wants another game. */


    printf ("Another Game (enter Y or N)?");


    response_entered = getch();


    /* Use "**toupper**" to convert it to upper case. */


    if (**toupper**(response_entered) == ''Y'')


    {


    continue_game = 1;


    }


    else


    {


    continue_game = 0;


    }


    }


    while (continue_game == 1);


    Note the use to “**toupper**” which converts the character to Upper Case, before
    we check it.


    ## “break” AND “continue”


    ### “break”


    Can be used to break out of a loop when some condition occurs. Consider the following
    example:-


    for (i = 0; i < 20; i++)


    {


    if (array[i] == 0)


    break;


    array[i] = 1/array[i];


    }


    If an array element with a zero value is found, the for loop is terminated (the
    “break” is executed), and execution of the program continues at the end of the
    “for” loop.


    ### “continue”


    Causes control to pass to the end of the innermost enclosing while, do, or for
    statement, at which point the loop continuation condition is re-evaluated.


    Example:


    for (i = 0; i < 20; i++)


    {


    if (array[i] == 0)


    continue;


    array[i] = 1/array[i];


    }


    If the array element had a value of 0, the division by 0 would *not* be done and
    the for loop would continue and processing of the next array element would take
    place. In other words, any statements following the “continue” are *skipped* and
    a return is made to the beginning of the loop.


    # Functions


    Up until now, all the examples and programs we have looked at have been small
    and more or less self contained. One of the things about Computer Programs is
    that normally, they grow - and grow - and grow. If we always tried to do as we
    have done so far & write all our program between the { and } of “main”, we would
    end up in a dreadful mess.


    Initially, in considering the problem of writing a program, we said we had to
    break up the problem into smaller pieces. One of the ways we do this is to begin
    to use *subroutines*.


    ### Subroutines


    Almost all programming languages have ways of defining *subroutines* or *procedures*
    or *functions* - these are like small self-contained programs which we *call*
    from our “main” program. Subroutines would normally do one little job each - e.g.
    set up the screen or display a menu. For programs which are more than about 100
    lines long, it is very important to try and consider how to break a program up
    into subroutines. This is called “structured programming”.


    In ''C'', subroutines are called “functions”. An example of how they are specified
    in ''C'' is given below.


    /* Define a function to print a line of stars. */


    void stars()


    {


    char some_stars[] = “**********”;


    printf (“%s\n”, some_stars);


    }


    /* Define a function to print a different line of stars. */


    void edge_stars()


    {


    printf (“* *\n”);


    }


    int main ()


    {


    //A special command to Clear the console “screen” area


    printf(“\033[2J”);


    /* Call the “stars” function. */


    stars();


    /* Call the “edge_stars” function 3 times. */


    edge_stars();


    edge_stars();


    edge_stars();


    /* Call the “stars” function a 2nd time. */


    stars();


    }


    ### Program Notes


    1.  We define 2 functions called “stars” and “edge stars”.


    2.  the functions just print out some asterisks.


    3.  We call the 2 functions repeatedly from the “main” program to produce the
    following output:-


    | ********** | <-- stars |


    | * * | <-- edge_stars |


    | * * | <-- edge_stars |


    | * * | <-- edge_stars |


    | ********** | <-- stars |


    1.  The function “stars” declares its own data - **this data cannot be accessed
    from “main”**. i.e. if we were to add the line


    printf (“%s”, some_stars);


    anywhere inside “main”, this would not work - *the program would not even compile.
    Why?*


    ## Subroutines and “Local Data”


    As we already mentioned, subroutines are like programs in their own right. As
    such, any data (variables) declared in a function can not be used by other functions,
    unless we take explicit action make this so.'
