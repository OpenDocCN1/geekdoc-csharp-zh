    ## Command Line Arguments


    Consider the Linux command “cp”, it could actually be written as a C program (as
    has been alluded to before when we were covering file / stream manipulation).
    The pseudo code for it might be as follows:-


    Check >2nd File< (destination) is not same as first. If it is, quit immediately.


    Open >1st file< - “source” file.


    (***Someone missed out a line of pseudo code here)


    Open destination file.


    Repeat


          Read chunk of source file.


          Write chunk to destination file.


    Until (All source file has been read).


    When we run the program the things marked like >this< are pieces of information
    which are on the Command Line. They are PARAMETERS to the copy command - the names
    of the files to be copied are supplied to the copy program as COMMAND LINE PARAMETERS.
    When the “copy” program runs, it takes the 2 strings supplied on the command line
    as being filenames. It then tries to open these files and actually do the copying.


    (***The line of pseudo code which, years ago, was missed out in the original design
    of the cp command was the one which checks the destination drive / device to see
    if there is enough space to hold the destination file - if there isn''t, the program
    should IMMEDIATELY quit.)


    The command line arguments to copy are shown below:-


    cp mavis.txt       jack.txt


    ^argument [0] ^argument[1] ^argument[2]


    In fact, most terminal commands - which are programs in their own right - take
    some form of command line argument.


    ### Accessing Command Line Arguments from a C program


    To access command line arguments from a C program is relatively straightforward.
    They are treated by a C program as a set of strings - an array. The following
    C program demonstrates this.


    /*


    This is a program to demonstrate the use of command line arguments


    */


    #include <iostream.h>


    #include <conio.h>


    // We modify the declaration of “main” so that we can access command line


    //parameters...


    /* The system organises them in the following way:-


    String String Number


    +----------------+


    | Program Name | 0


    +----------------+


    | | 1


    +----------------+


    | | 2


    +----------------+ .


    . . .


    . . .


    +----------------+ .


    | | no_of_strings (first parameter in


    +----------------+ declaration of “main” below).


    */


    //Note, the use of the “char *” VERY important.


    int main(int no_of_strings, char *command_line_strings[])


    {


    int i;


    printf(“\033[2J”); // A special command to Clear the console “screen” area


    //Print out the name of our test program - this is held as the


    //first string in the array:-


    printf (“The program executable filename is: \t”);


    printf (“%s\n\n”, mmand_line_strings[0]);


    if (no_of_strings > 1)


    {


    printf (“Command line arguments are:\n”);


    //Now we print out each of the command line strings in turn.


    for (i = 1; i < no_of_strings; i++)


    {


    printf (“\t%s\n”, command_line_strings[i]);


    }


    }


    else


    {


    printf (“No command line arguments given.\n”);


    }


    }


    It is fairly simple to “bolt together” the things we used when accessing files
    to the above program to produce a new version of the linux “cat” command (which
    just displays files on the screen). The program for this is given below.


    /*


    This is a program to demonstrate further use of command line arguments


    and is a simple version of the Linux/Unix “cat” command.


    */


    #include <stdio.h>


    // We modify the declaration of “main” so that we can access command line


    //parameters...


    int main(int no_of_strings, char *command_line_strings[])


    {


    int i;


    char line_store[81];


    FILE *file_to_type;


    //Test the number of command line arguments which were supplied.


    if (no_of_strings > 1)


    {


    //Now we use each of the command line strings in turn:-


    for (i = 1; i < no_of_strings; i++)


    {


    printf (“Typing %s\t\n”, command_line_strings[i]);


    /* Open the file. */


    file_to_type = fopen (command_line_strings[i],”r”);


    //Check we were able to access it


    if (file_to_type == 0)


    {


    fprintf (stderr, “*** Couldn''t open %s\n”, command_line_strings[i]);


    }


    else


    {


    //Loop till the end of the file. */


    do


    {


    //Read a single line of the file into our buffer.


    fgets(line_store,80,file_to_type);


    //Print the contents of the buffer on the screen!


    printf (“%s”,line_store);


    }


    while (!feof(file_to_type));


    // ^^^^ Continue until the end of the file is reached.


    //Close the file we have just read.


    fclose (file_to_type);


    }


    }


    }


    else


    {


    printf (“No command line arguments given.\n”);


    }


    }


    As you can see, the above is a fairly short program - it will even type a number
    of files one after another - you just need to supply the names of the files you
    wish to type as command line parameters. If this were compiled into a file called
    “newcat”, stored in the home folder, this can be achieved by:


    pi@raspberrypi:~./newtype .profile .bash_history


    this will show the contents of .profile .bash_history (2 files created by the
    system).


    **Note** - it is common to see the use of the names “argc” and “argv” in the “main(
    )” declaration where “no_of_strings” and “command_line_strings” are used in the
    example above. The only reason they are called this is that whoever wrote the
    first ''C'' program to access command line arguments referred to the parameters
    in the “main” declaration by these rather obscure names. Because “main” is a ''C''
    function like any other, we can give the parameters any name we like and make
    them as readable as possible. “argc” and “argv” probably (!) stand for “argument
    count” and “arguments vector”.


    # ''C'' Programming Style


    Because ''C'' is a “free format” language, it is quite easy to just “bash in”
    code without worrying about using a consistent or sensible layout, although most
    text editors of any sophistication have some kind of auto-formatting function,
    to help with layout. When writing programs, it is important to try and make them
    as readable as possible. This can be done by following simple guidelines:-


    1.      Use sensible variable and function names with underscores for “spaces”.
    e.g. use a name “centigrade_value” rather than “c” or “c_val”. Or, if you do not
    like using the underscore, use capital letters in variable names e.g. “CentigradeValue”.
    Remember that ''C'' is case sensitive so get your capitals right!


    2.      Space lines out well and indent sensibly e.g. put


    if (centigrade_value == 30)


    {


    printf (“Rather Warm”);


    average_value += centigrade_value;


    }


    rather than:


    if (centigrade_value==30){printf(“Rather warm”);


    average_value += centigrade_value;}


    3.      Use comments liberally and sensibly and align them to the code they relate
    to e.g.


    /* Read in the Centigrade value. */


    scanf (“%d”, &centigrade_value);


    4.      At the top of each program (before anything else), put a comment box saying
    what the program does, and put in the date and name of the author. e.g.'
