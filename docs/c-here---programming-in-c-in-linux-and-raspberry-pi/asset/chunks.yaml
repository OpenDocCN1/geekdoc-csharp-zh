    ### Target System


    Here, our target system is either a Raspberry Pi or Windows PC – but you can compile
    code on a PC or a Raspberry Pi that runs on a different type of system. This is
    commonly done with what are called **embedded systems**. For this sort of development,
    you use a cross-compiler.


    ## What is Compilation?


    *   It is the process of converting a body of text into “object code” which in
    turn is converted into a “runnable” or **executable** program.


    *   The compiler checks the text against the rules for the language in question
    (in our case the ''C'' Language) to see if it forms a valid set of instructions.


    *   Where the compiler finds that the rules for the language have been broken,
    it displays a message:-


    “Error X line Y: ... Description ...”


    or, less severe is:-


    “Warning X line Z : ... Description ...”


    ## **Edit Compile** **Link**


    There are actually 3 distinct stages to producing a working ''C'' program they
    are:-


    | Editing | The program is entered into the computer using a text editor. The
    text that is entered is called *source code* or just *the source.* |


    | Compilation | The program is converted into “object” code, similar to machine
    code. |


    | Link | A program called the linker combines the object code for your program
    with “run time library” object code to make your program a fully working “stand
    alone” unit which can be run independently of the editor, linker and compiler.
    |


    Often, these stages are hidden from the user – particularly if you use an Integrated
    Development Environment – IDE, such as is mentioned in Section Chapter 4 - . Nowadays,
    “compilation” and “linking” are typically done in one step, as shown in Section
    [Chapter 5 -](#part0003_split_001.html_id_Toc483576728) .


    # More about Our Project


    ## Requirements


    As mentioned above, we will be building a simple game, based on the idea of “Mastermind.”
    To do this, then, we have a problem to solve – which we will break down into the
    following parts (some would call the column on the left “User Requirements” or
    “Functional Requirements”).


    | Code / Instructions needed to… | Data Needed |


    | Drawing the Board | Simple Board Layout |


    | Read in a code guess | Number in the guess |


    | Generate a secret code | Number in the secret code |


    | Check the code and guess | Compare “guess storage” and “secret code storage”
    |


    | Display Marks for each guess |  |


    | Count guesses as we play | A single number/counter (the guess counter) |


    | Check whether we have had too many guesses | The Guess counter |


    | Display “Game Won” or Lost |  |


    | Restart the Game |  |


