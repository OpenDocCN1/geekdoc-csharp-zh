    If you don’t have Linux and don’t want to install it on your computer, you can
    still use Linux and C fairly easily, providing you have plenty of Disk Space.
    Just search for “Installing `Virtual Box`” and “Ubuntu Linux and Virtual Box.”
    If you can successfully install these on your Windows or Mac Computer, you can
    still use the instructions in Section [Chapter 5 -](#part0003_split_001.html_id_Toc483576728)
    and the rest of this guide to get you going. You will need approximately 20GB
    of space to install everything. To use VirtualBox successfully, you may need to
    change a “Virtualisation” setting in your BIOS. Research online for further details.


    ## Be Aware!


    Linux is updated almost daily – with the result that features in applications
    software get moved around, deleted and/or changed. Graphics get re-designed and
    applications become superseded or outdated.


    `This means that instructions given in section [Chapter 5 -](#part0003_split_001.html_id_Toc483576728)
    may not be quite up to date when you read them, or the results they give might
    be slightly different. You may therefore need to experiment a bit and also search
    online for updated instructions or notes about new features and enhancements or
    changes.`


    You have been warned!


    ## Rationale of Examples


    Some of the example programs may seem pointless or unrealistic - in such cases,
    they are written to illustrate features of the language rather than being useful
    programs in their own right.


    You can of course download all the sample programs and compile and run them, but
    you may find you will learn the language better if you actually type them (as
    was more common place when this guide was originally created in the early 1990’s).
    If you type and compile the programs yourself, you will learn more about what
    the error messages mean and you will get better at spotting errors in your code,
    when you start to write some!


    ## Course Theme


    When I originally began programming, back in 1981 on a Sinclair ZX81, I was motivated
    to write a simple game. A similar thing happened a year later when I got the legendary
    Spectrum (16K model). In this guide, then, we will adopt a similar “plan”. We
    will be building up our knowledge to write a simple “code cracking” game – known
    to many as “Mastermind”.


    ### Code Cracking Game – “Mastermind”


    ![Image](images/00002.jpeg)


    This is a game I used to enjoy playing as a child – I even had a pocket electronic
    version. A sequence of digits (in the range 0 – 9) is set as a "secret code" (it
    is normally set by a human – the code setter, but we''ll get the computer to do
    it). The "code breaker" then tries to guess the code as quickly as possible. He
    or she makes guesses by placing them on a board – typically, the user has 10 attempts
    at guessing the code before the game is over. The "code setter" then "marks" the
    guess according to certain rules:-


    *   If, in the guess, there is a certain number which is also in the code, but
    it is in a `DIFFERENT` position, a `WHITE` peg is awarded.

    *   If, in the guess, there is a certain number which is also in the code, but
    it is in the `SAME` position, a `BLACK` peg is awarded.

    *   Only 1 white or black peg per correct digit is awarded.


    ### Example


    *   If the secret code was "1234" and the guess was "4255", one black peg (for
    the "2") and one white peg (for the "4") would be awarded.

    *   In the example shown below (grabbed from the working version of the program
    we will develop), there is either a 3 or 4 in the code, and the secret code does
    *not* end in a 4, may have a 3 in it, but if it does have a 3 in it, it’s not
    in the first 3 positions.


    ### Rationale


    By developing an easily understandable game, which is actually quite good fun,
    we will be able to introduce fundamental programming concepts such as input and
    output, data storage (in arrays), counting, conditional tests and looping (also
    called iteration).


    A complete listing is provided in Appendix 1.


    ![Image](images/00003.jpeg)


    This is what our finished, running game will look like.


    ## Simple Programming Exercises


    Appendix 2 lists some very simple ideas for programs that you can write – based
    on the examples given in the guide. No solutions are given.


    ## Other Languages


    If you can master what is in this guide and you understand what you have done,
    you will have a solid basis for developing an understanding the concepts involved
    in the most commonly used methods in what is called procedural computer programming.
    A logical next step then would be to develop an understanding of object-oriented
    computer programming, which is used inherently and throughout more modern programming
    languages such as C++, Java, Python and even in variants of BASIC.


    # The Programming Process – A Quick Summary


    ### Some people would call this “algorithm development” or “algorithm design”
    or even “systems thinking”. For the purposes of this guide, I will call it “the
    programming process”. Whole books are available which go into minute detail about
    these concepts. Here, we present the essential fundamentals.


    ### The Programming Process involves


    *   Considering a problem.

    *   Breaking up the problem into small pieces.

    *   Considering how to express the solution to each part of the problem in the
    form of a Computer Program.


    ### A Program


    Can be split into 2 main parts:-


    *   Instructions - Code

    *   Information - Data


    In solving the problem, we have to consider what and Instructions are required.


    ## Instructions/Code in a Program


    Can be categorised into 3 main types:-


    1.  Information (Data) Manipulation.

    2.  Conditional Test.

    3.  Jump/Branch.


    You will see different examples of each these types in this guide, although the
    Jump/Branch is often done implicitly, by structuring the program in a certain
    way.


    ## Information/Data in a Program


    Can take many different forms. e.g


    *   Simple whole number values

    *   Floating point values (with a decimal point)

    *   Text / Strings / Characters

    *   Graphics

    *   Sound


    C is just another programming language and it has its particular way of expressing
    Code & Data.


    ## Compiled Languages


    *   Once a program has been written, it has to be Compiled before being run. If
    an error is seen, the program has to be, terminated, corrected, re-compiled and
    run from the beginning.

    *   The conversion process in only done once, unless changes are made to the program.


    ## Interpreted Languages


    *   Once a program has been written, it can be run straight away. If an error
    occurs, the program may stop completely or just stop temporarily, following an
    “alert” message of some kind. The program can be interrupted, corrected and the
    program can continue running from the point it was stopped at.

    *   The “conversion” process happens every time the program runs - this slows
    things down, although early in the 21st century, computer processors (CPU’s) are
    often thousands of times faster than they were near the end of the 20th century.


    ## Hybrid Languages


    Some more modern languages use a combination of compilation and interpreting which
    can provide certain advantages in some situations.


    ## How do we enter a ''C'' program into a Computer?


    To write a C program we need to be able to enter and store text in the computer.
    To do this we use a `Text Editor.*


    ### A Text Editor


    Is a program which we run on the computer that allows us to enter, modify and
    save some text to disk. This text can be anything - a letter, a book, a load of
    rubbish, or a C program.


    ### A Compiler


    Is a program which we run on a computer which converts some text into an “object
    code”. This is code that will run on the system you have written the code for
    (called “the target system”.) There is also another program called a “linker”
    which adds other “standard” code to the object code to create an “executable program.”

