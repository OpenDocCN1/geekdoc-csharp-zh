  raw: 'Perhaps the most important feature of any computer program is its ability
    to make decisions - to do a conditional test. The way conditional tests are made
    in ''C'' is similar to other high level languages.


    ## Conditional Statements


    There are a number of ways in ''C'' to do conditional tests, but by far the most
    common is “if..else”, which is shown below.


    if (condition)


    one line statement;


    else


    one line statement;


    NOTE: Unlike some other programming languages, “THEN” is assumed and this word
    is not included in the “if” statement.


    “if .. else” can also take a slightly different form using a “multi-line statement”.
    This is shown below.


    if (condition)


    {


    statement 1;


    statement 2;


    .


    .


    statement n;


    }


    else


    {


    statement 1;


    statement 2;


    .


    .


    statement n;


    }


    NOTE: Equality is tested for using “= =“ e.g.


    if (warp_factor == 10)


    {


    printf (“The Engines can nae take it cap''n!!\n”);


    }


    As with other languages, “inequalities” can be tested for. The following symbols
    can be used, where a “= =“ (“double equals”) might otherwise be used:-


    | Symbol | Meaning |


    | != | not equal to. |


    | > | greater than. |


    | >= | greater than or equal to. |


    | < | less than. |


    | <= | less than or equal to. |


    e.g.


    if (i != 0)


    {


    printf (“The number is non-zero.\n”);


    }


    ### Another Example


    Suppose we wished to check for a resistance value being greater than 1000 ohms,
    we could use the following conditional test.


    if (resistance_value > 1000)


    {


    printf (“Value is over 1 kilohm.\n”);


    }


    To test for a number of conditions at once, the “AND” and “OR” keywords are required.
    In ''C'', these are expressed thus:-


    && - Logical AND.


    || - Logical OR.


    e.g.


    if ((character >= ''0'') && (character <= ''9''))


    {


    printf (“The character is a number. “);


    }


    ### Hints on Conditional Testing


    A conditional test can be negated by placing a “!” in front of it e.g.


    if (**!**((i >= 6) && (i <= 12)))


    {


    printf (“Number is outside range 6 - 12”);


    }


    Conditional tests can become quite complex. To keep them clear, it may be useful
    to follow these guidelines:-


    *   Each conditional test should be enclosed in (round) brackets.


    *   Try to stick to using the multi-line form of the conditional statement.


    *   Always align braces “{ }” which form the start and end of a block.


    *   If conditional tests become complicated, split them over a number of lines
    and align them sensibly.


    ## More Complex Conditional Tests - The “switch..case” Statement


    Consider the idea of writing a ''C'' program to play a card game. Suppose you
    want to print out the card value in the form of its number, for cards 2 to 10,
    or A, J, Q, K for the others. If we assume an “int” called “card_value” contains
    a number in the range 1 to 13, we could do this in ''C'' in the following way:-


    if ((card_value >= 2) && (card_value <=10))


    printf (“%d”, card_value);


    else


    if (card_value == 1)


          printf (“A”);


    else


          if (card_value == 11)


                printf (“J”);


          else


                if (card_value == 12)


                      printf (“Q”);


                else


                      if (card_value == 13)


                            printf (“K”);


    As we can see, this gives a somewhat large and unwieldy set of “if” statements.
    If we wished to do something as well as “printf” for each case, we would have
    to use the { } with each “if”, making the whole thing more troublesome. Another
    way of doing the example would be...


    The “switch..case” statement can be used to test a given variable for a number
    of discrete values. Other languages tend to use the “Case” statement alone. The
    previous example could be re-written thus:-


    switch (card_value)


    {            /* Control Variable */


    case 1:


          printf (“A”);


          break;


    case 11:


          printf (“J”);


          break;


    case 12:


          printf (“Q”);


          break;


    case 13:


          printf (“K”);


          break;


    default:


          printf (“%d”, card_value);


          break;


    }


    ### Notes:


    1.  The “switch” statement takes the specified action for the specified value
    of the control variable.


    1.  After each action, the word “break;” is inserted to cause execution of instructions
    to carry on after the “}” of the “switch” statement. If the “break” is not included,
    execution continues into the next “case” action (which is occasionally useful).


    1.  The “default:” case specifies the action to be taken if the control variable''s
    value is none of those listed in the other cases (this is optional).


    1.  Perhaps surprisingly, the statements in each “case” need not be included in
    { }. (Though any “if”, “do...while”, “for” statements contained in a “case” would
    follow the normal rules.)


    ### Limitations of “switch..case”


    *   The control variable should be of type “int” or “char”.


    *   The values being tested must be constants - i.e. you cannot use “switch” to
    test the value of one variable against another.


    ## Codecracker Game – Some Conditional Tests


    In our code cracker game, we need to do some tests.


    1.  Check whether we have had too many guesses.


    2.  Check whether the user wants to play again or finish the game.


    3.  Check whether the code the user entered matches any of the digits in the secret
    code.


    The “checking against the secret code” step, we will leave till later, as there
    is a little more we need to learn before we can easily do this. For checking whether
    the user wants to continue the game we could do:


    char response;


    response=getch();


    if ((response==”y”) || (response==”Y”))


    {


    /*start a new game!*/


    }


    else


    {


    /* exit from the game – end program!! */


    }


    But for checking the number of guesses, we can do:


    int guess_counter = 0;


    /* Still things to do/think about here! */


    guess_counter++;


    /* We will allow 10 guesses


    if (guess_counter > 10)


    {


    printf (“You have lost!”);


    }


    else


    {


    /* Still things to do/think about here! */


    }


    We will see that our final code will be slightly different to this, but “we’re
    getting there”!


    # Looping The Loop - Iteration


    One of the things it is often necessary to do in a program is repeat something
    a number of times. We need to *iterate.* There are 2 main forms of iteration:-


    1.  Iterating a set number of times.


    2.  Iterating until a certain condition changes.


    We can illustrate these forms as shown:-


    ### 1\. Iterating a set number of times.


    Initialise a count to minimum value.


    Start


          Execute some instructions.


          Increase the count.


          Test if the count is greater than the maximum value.


                If No- Go To Start


                If Yes- Go To End


    End


    NOTE: The count could also be initialised to a maximum value and decreased to
    a minimum value.


    ### 2\. Iteration until condition changes


    Start


    Execute some Instructions (which affect the *Condition*).


    Test Condition.


    Is *Condition* True?


          No-Go To Start


          Yes-Go To End


    End


    NOTE: If the iteration is to be “finite” (i.e. finish at some point), the instructions
    which are executed must affect the condition in some way.


    ### Other Languages


    Other programming languages have constructs for types (1) & (2) of iteration.
    Form (1) is expressed in BASIC as *FOR...NEXT*. In both BASIC and some other languages,
    (2) is in the form of the *REPEAT ... UNTIL* statement. We will now look at the
    ‘C’ equivalents.


    ## Iteration Form (1) - The “for” Loop


    It has this general form:-


    initialisation continuation iteration


    expr. condition expr.


    for ( i=0;        i < 10; i++ )


    printf (“Spectrum is green!\n”);


    The action of the example is as follows:-


    1.  The “loop control variable”, i, (which must be declared as any other data
    item) is set to zero.


    2.  The condition “i < 10” is tested, and evaluates to TRUE.


    3.  The “printf” is done.


    4.  i is incremented by 1.


    5.  Steps 2-4 are repeated until “i” reaches 10.


    NOTE: The loop only continues to execute while the Continuation Condition evaluates
    to TRUE.


    ### More Advanced “for” Loops


    All parts of the “for” statement can have more than one part e.g. Assume i, j,
    k have been declared as “int”:'
