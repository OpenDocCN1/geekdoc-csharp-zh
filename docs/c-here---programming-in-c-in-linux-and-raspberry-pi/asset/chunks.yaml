    ![Image](images/00016.jpeg)You will be presented with some explanatory text so
    click “Next”.


    1. It asks you Language you want to create your application in – “C” should be
    selected already – so click `Next`.


    ![Image](images/00017.jpeg)


    1. Type a name for your project such as `Hello` or `HelloUniverse` (thing big!)
