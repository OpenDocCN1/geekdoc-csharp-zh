    I therefore hope the comments in the code provide sufficient explanation of how
    the program works.


    There are many ways to improve the program and many ways to code it. Remember,
    it has been presented as a learning exercise and is not meant to be the best,
    most complete or most optimised code listing. Additionally, it could be split
    into 2 or 3 modules. This “splitting” is one of the topics covered in the **Advanced
