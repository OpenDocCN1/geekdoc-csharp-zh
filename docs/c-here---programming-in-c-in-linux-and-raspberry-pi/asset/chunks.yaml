  trans: "\n任何计算机程序最重要的特性之一，就是具备做出决策的能力——即执行条件判断。C 语言中实现条件判断的方式与其他高级语言类似。\n\n## 条件语句\n\
    \n在 C 语言中有多种方式可实现条件测试，但最常见的是“if..else”结构，如下所示：\n\n```c\nif (condition)\n一行语句;\n\
    else\n一行语句;\n```\n\n注意：与某些编程语言不同，“THEN”是隐含的，`if` 声明中不包含该关键词。\n\n`if .. else`还有一种略微不同的形式（多行格式），如下所示：\n\
    \n```c\nif (condition)\n{\n    语句 1;\n    语句 2；\n    .\n    第 n 条句子；\n}\n否则，\n\
    {\n    第一句话；\n   第二份发言稿。\n    n.\n} \n```\n请注意：相等性使用 `==进行检验例如：\n`\n# if( warp_factor\
    \ ==10 )\n {\n printf(“发动机承受不住了船长!!\\n ”);  \n }\n ```\n\n  其他语言的字符串一样也可以对不等关系使用的符号表给出了当需要用到两个等号表示时常可替换的一些常用标志符也未尝不可请见下表格:\n\
    \n| Symbol | Meaning |\n|---|---|\n|---等于.| --\n大于或以上均为和常见字符一致无特别补充部分因此不再重复叙述直接给出完整译文内容:-----以下开始为实际翻译输出------"
- fmt: "\n```c\nfor (i=0, j=0; (j<=9) || (k != 1); i+=2, j++)\n{\n    <statements>\n\
    }\n```\n\nIn the above example, `i` & `j` are both initialised to zero, the Continuation\
    \ Condition is evaluated (and is TRUE), the `<statements>` are executed, `i` is\
    \ increased by 2 and `j` by 1. The loop terminates when `j` reaches 10, or when\
    \ a 3rd variable, “k” gets set to 1 (happens somewhere in “<statements>“).\n\n\
    ### NOTES:\n\n1. With `for` statements, it is possible that the code inside the\
    \ loop may never be executed (if the continuation condition always evaluates to\
    \ FALSE).\n2. All parts inside the `( )` of a `for` statement are `optional`,\
    \ in other words this\n\n```c\nfor (      ;      ;      )\n{\n}\n```\n\nis a legal\
    \ piece of code - it represents an infinite loop (some times useful in “control”\
    \ type programs).\n\n## Iteration Form (2) Do...While\n\nThis is very similar\
    \ in form to the `REPEAT...UNTIL` statements used in BASIC and similar languages.\
    \ e.g.\n\n```c\ni=0;\ndo\n{\n    printf (“Spectrum is green!\\n”);\n    i++;\n\
    }\nwhile (i<10);\n```\n\nThe action of the program is as follows:-\n\n1. The “loop\
    \ control variable”, `i`, (which must be declared as any other data item) is set\
    \ to zero.\n2. The `printf` is done.\n3. `i` is incremented by 1.\n4. The condition\
    \ `i < 10` is tested, and evaluates to TRUE.\n5. Steps 2-4 are repeated until\
    \ `i` reaches 10.\n\nThe only effective difference in operation to the `for` loop\
    \ is that the condition is tested AFTER the action (rather than BEFORE).\n\n###\
    \ MORE NOTES:\n\n1. The code inside the `do` loop always executes at least once.\n\
    2. The main difference to `REPEAT..UNTIL` is that the condition tested is the\
    \ `Continuation` condition (not the `Termination` condition).\n\n### Iteration\
    \ Form (2) - “Reprise” - “While..”\n\nThere is a second form using `while`, which\
    \ is used in situations where you wish to test a condition BEFORE an action:-\n\
    \n```c\ni = 0;\nwhile (i < 10)\n{\n    printf (“Spectrum is green\\n”);\n    i++;\n\
    }\n```\n\n1. The “loop control variable”, `i`, (which must be declared as any\
    \ other data item) is set to zero.\n2. The condition `i < 10` is tested, and evaluates\
    \ to TRUE.\n3. The `printf` is done.\n4. `i` is incremented by 1.\n5. Steps 2-4\
    \ are repeated until `i` reaches 10.\n\nNOTE: The action here is identical to\
    \ that of the `for` loop, except we initialise `i` outside the loop. This form\
    \ can be used wherever a `for` loop seems a bit Over-The-Top.\n\n### Iteration\
    \ Summary\n\nAs we have seen, there are three “looping” or “iteration” constructs\
    \ in `C`. Examples are shown below\n\n```c\nfor (i = 0; i < 10; i++)\n{\n    <statements>\n\
    }\n```\n\n------------------------------------------------\n\n```c\ndo\n{\n  \
    \  <statements>\n}\nwhile (<condition TRUE>);\n```\n\n------------------------------------------------\n\
    \n```c\nwhile (<condition TRUE>)\n{\n    <statements>\n}\n```\n\nNOTE: Watch for\
    \ the differing use of the semi-colon with the `while` statement.\n\nThey are\
    \ each quite flexible, and which one you use may depend on personal choice, although\
    \ you should consider whether your iteration must be carried out at least once.\
    \ (In which case choose `do..while`).\n\n## Codecracker Game – Using Loops\n\n\
    We can now revise our earlier code to include a loop for each guess and also a\
    \ loop for the whole game. It will look like this:\n\n```c\n/* Start a loop in\
    \ which we will play the game. */\ndo\n{\n    /*Stuff will be added here later.\n\
    \    /* Now loop for 10 guesses. */\n    for (guess_no=1; guess_no <= MAX_GUESSES;\
    \ guess_no++)\n    {\n        /* TO DO */\n        /* Read in the guess - pass\
    \ the current guess number. */\n        /* TO DO */\n        /* Mark the guess.\
    \ */\n        /* If we guessed correctly, break out of the \"for\" loop. */\n\
    \        if (guess_correct == 1)\n        {\n            break;\n        }\n \
    \   }\n    /* When we get to here, we will either have run out of goes, or\n \
    \   \"guess_correct\" will have been set to 1 - the guess has been\n    marked\
    \ and found to be correct. */\n    /* Check if we guessed it! */\n    if (guess_correct\
    \ == 1)\n    {\n        printf (\"*** You Win! ***\");\n    }\n    else\n    {\n\
    \        printf (\"*** You have failed! ***\");\n    }\n    /* Stuff to Add here!*/\n\
    \    /* Now ask if the user wants another game. */\n    printf (\"Another Game\
    \ (enter Y or N)?\");\n    response_entered = getch();\n    /* Use “toupper” to\
    \ convert it to upper case. */\n    if (toupper(response_entered) == 'Y')\n  \
    \  {\n        continue_game = 1;\n    }\n    else\n    {\n        continue_game\
    \ = 0;\n    }\n}\nwhile (continue_game == 1);\n```\n\nNote `toupper` converts\
    \ it to upper case.\n\n## “break” AND “continue”\n\n### “break”\n\nCan be used\
    \ to break out of a loop when some condition occurs. Consider the following:-\n\
    \nIf array element had a value of 0, the loop is terminated.\n\n```c\nfor (i =\
    \ 0; i < 20; i++)\n{\n    if (array[i] == 0)\n        break;\n}\n```\n\n### “continue”\n\
    \nCauses control to pass to the end of the loop. Example:\n\n```c\nfor (i = 0;\
    \ i < 20; i++)\n{\n    if (array[i] == 0)\n        continue;\n}\n```\n\nIf array\
    \ element had a value of 0, the loop would continue.\n\n# Functions\n\nUp until\
    \ now, all the examples have been small and more contained. One of the things\
    \ about Computer Programs is that normally, they grow - and grow. If we always\
    \ tried to do all program between the { } of “main”, we would end up in a dreadful\
    \ mess.\n\n### Subroutines\n\nAlmost all programming languages have ways of defining\
    \ *subroutines* or *procedures* or *functions* - these are like small contained\
    \ programs which we *call* from our “main”. For programs which are more than 100\
    \ lines long, it is very important to try and consider how to break up program\
    \ into subroutines. This is called “structured programming”.\n\nIn 'C', subroutines\
    \ are called “functions”. An example of how they are specified in 'C' is given\
    \ below.\n\n```c\n/* Define a function to print a line of stars. */\nvoid stars()\n\
    {\n    char some_stars[] = “**********”;\n    printf (“%s\\n”, some_stars);\n\
    }\n\n/* Define a function to print a different line of stars. */\nvoid edge_stars()\n\
    {\n    printf (“* *\\n”);\n}\n\nint main ()\n{\n//A special command to Clear the\
    \ console “screen” area\n    printf(\"\\033[2J”);\n\n    /* Call the “stars” function.\
    \ */\n    stars();\n\n    /* Call the “edge_stars” function 3 times. */\n    edge_stars();\n\
    \    edge_stars();\n    edge_stars();\n\n    /* Call the “stars” function a 2nd\
    \ time. */\n    stars();\n}\n```\n\n### Program Notes\n\n1.  We define 2 functions\
    \ called “stars” and “edge_stars”.\n2.  the functions just print out some asterisks.\n\
    3.  We call the 2 functions repeatedly from the “main” program to produce the\
    \ following output:-\n\n| ********** | <-- stars |\n| * * | <-- edge_stars |\n\
    | * * | <-- edge_stars |\n| * * | <-- edge_stars |\n| ********** | <-- stars |\n\
    \n1.  The function `stars` declares its own data - **this data cannot be accessed\
    \ from “main”**. i.e. if we were to add the line\n\n`printf (“%s”, some_stars);`\n\
    \nanywhere inside “main”, this would not work - the program would not even compile.\n\
    \n## Subroutines and “Local Data”\n\nAs we already mentioned, subroutines are\
    \ like programs in their own right. As such, any data (variables) declared in\
    \ a function can not be used by other functions, unless we take explicit action\
    \ make this so.\n"
