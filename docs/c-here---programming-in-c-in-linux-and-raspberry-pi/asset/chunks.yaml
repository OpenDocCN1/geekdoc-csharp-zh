- fmt: "\n6. The only reason we haven't referred to `character_array` as a string\
    \ is because it is not NULL-terminated - it does not have a zero character at\
    \ the end.\n\n7. The array elements end up with values from 0 to 9.\n\nWe could\
    \ actually re-write the previous program slightly.\n\n```c\nint main( )\n{\n \
    \   char character_array[10];\n    char *character_ptr;\n    char i;\n    character_ptr\
    \ = character_array;\n    for (i=0; i < 10; i++)\n    {\n        *character_ptr++\
    \ = i;\n    }\n}\n```\n\n### Program Notes\n\n1. Here, we have initialised `character_ptr`\
    \ using just the array name `character_array`. If you refer to just the array\
    \ name, it means the address of the first element in the array (whatever type\
    \ it is). If you look back at our use of the `strcpy` (string copy) library function,\
    \ this is actually what we were doing there.\n2. We increment the character pointer\
    \ in the assignment (this sort of thing is quite common in many programs).\n\n\
    ## More Advanced Pointer Usage\n\nThe next program implements its own version\
    \ of the `strcpy` library function. It is a good example of how pointers are often\
    \ used in 'C'.\n\n```c\nvoid string_copy (char *destination_ptr, char *source_ptr)\n\
    {\n    /* Just copy from source to destination until a NULL is reached - at which\
    \ time the condition will fail! */\n    do\n    {\n        *destination_ptr++\
    \ = *source_ptr;\n    }\n    while (*source_ptr++);\n}\n\nint main( )\n{\n   \
    \ char source_string[ ] = “Reg Holsworth for PM!”\n    char destination_string[50];\n\
    \    string_copy (destination_string, source_string);\n    printf (“My vote is\
    \ ... %s\\n”, destination_string);\n}\n```\n\n### Program Notes\n\n1. We define\
    \ a function `string_copy` which has two character pointer parameters (`char *`).\
    \ \n2. We start a `do` loop.\n3. We assign the character pointed to by the destination\
    \ pointer to be the character pointed to by the source pointer, and (implicitly\
    \ with the `++`) increment the destination pointer.\n4. We test to see if what\
    \ the source pointer is pointing to is a NULL (zero) character, and implicitly\
    \ increment the source pointer. If we find a NULL character, it will be copied,\
    \ but the loop will terminate.\n5. It is not generally recommended that library\
    \ functions be re-written! This example is purely a demonstration of the way pointers\
    \ can be used.\n6. This example illustrates the way in which quite a complex set\
    \ of operations can be coded in a few short 'C' statements.\n7. The library `strcpy`\
    \ function is actually of type pointer to `char`. It returns a pointer to the\
    \ destination string (in other words, the value of the first parameter).\n\n**NOTE**:\
    \ Great care should be taken when using pointers in 'C' programs. It is yet another\
    \ area where 'C' assumes you know what you are doing. Incorrect pointer usage\
    \ could result in loss of data or file corruption of any files your program is\
    \ using.\n\n# File Handling\n\nOne of the important features of programming languages\
    \ is their ability to transfer data between the main memory of the host system\
    \ and its disk storage e.g. say you had written a 'C' program to store results\
    \ from an experiment, you would want the program to first allow the user to enter\
    \ the values, then save them to a file on the disk. At a later stage, you then\
    \ wish to retrieve this data into your program to use it for another purpose.\
    \ Alternatively, you may wish to load the data into another package altogether\
    \ - such as a Word Processor or Spreadsheet.\n\n## File Input and Output - File\
    \ I/O\n\nThe general term applied to manipulating files from programs is “File\
    \ I/O”. In 'C' file I/O is done through the use of library functions, several\
    \ of which are shown here:-\n\n| Function | Description |\n| :--- | :--- |\n|\
    \ `fopen (<filename>, <mode>)` | Prepare file for use - returns value used for\
    \ `<stream>` |\n| `feof (<stream>)` | Check for end of file. |\n| `fprintf (<stream>,\
    \ control string, variables)` | Output stuff to file. |\n| `fputc (<stream>, char);`\
    \ | Output a single character to the file. |\n| `fgetc (<stream>);` | Returns\
    \ single character read from the file. |\n| `fscanf (<stream>, control string,\
    \ variables)` | Input (Read) stuff from file - like “scanf”. |\n| `fclose (<stream>)`\
    \ | End use of file |\n\nThere are a number of ways to do file I/O, not all of\
    \ which will be shown here.\n\n### `fopen`\n\nThis is the function which, given\
    \ 2 strings as parameters, will ask the system to prepare the file for use by\
    \ your program and set things ready. The 2nd parameter to this function is a string\
    \ indicating which “mode” you wish to access the file in:-\n\n### `fopen` modes\n\
    \n| Mode String | Action/Description |\n| :--- | :--- |\n| `r` | Open for reading\
    \ |\n| `w` | Create for writing. If the file exists, it will be overwritten. |\n\
    | `a` | Append; open at end. Create if file does not exist. |\n| `r+` | Open for\
