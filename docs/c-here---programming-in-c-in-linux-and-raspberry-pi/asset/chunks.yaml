    ```c

    /********************************************

    这是一个设置数字序列的游戏（通常由人类设置，但我们将让计算机来设置），“破解者”尝试尽快猜测代码。他通过将猜测放在棋板上来进行猜测。“设置者”然后根据以下规则“标记”猜测：

    如果猜测的某个数字在代码中，但位于**不同**位置，则获得一个白色棋子。

    如果猜测的某个数字在代码中，且位于**相同**位置，则获得一个黑色棋子。

    每个正确的数字获得一个白色或黑色棋子。

    示例

    如果代码为“1234”，而猜测为“4255”，将获得一个黑色棋子（针对“2”）和一个白色棋子（针对“4”）。

    **********************************************/

    ```


