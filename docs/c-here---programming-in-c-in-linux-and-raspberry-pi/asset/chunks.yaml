    # Different Types Of Data In ''C''


    ## What is Data in a program?


    It is the information required by the program to perform its function. e.g. the
    names and addresses of employees in a company''s personnel records, the titles
    and artists of records in someone''s collection.


    Data in the real world has infinite variety. In ''C'', like other programming
    languages, there are only certain ways to express data.


    ## Using Data In a ''C'' Program


    To use data in a program, we have to declare it, by putting in a special line
    e.g.


    int number_of_items;


    to declare a piece of data - an integer, a “whole number”, to store the number
    of items


    for some kind of counting operation. *Code has to know what data it will be using,
    hence:*-


    Data declarations always come before code.


    ### Notes on Data Declaration


    The data declaration shown is in 3 parts:-


    int number_of_items       ;


    (1)            (2)       (3)


    They are


    1.  Data type


    2.  Name for data item


    3.  Terminator


    We call the data items we declare *variables***.** The “Name” is often referred
    to as an *identifier.*


    ### Names for Data Items (variables)


    The naming of variables follows certain rules:-


    *   The variable name can''t start with a number.


    *   The variable name cannot have spaces in it (use underscore “_” instead).


    *   Variable names are “case sensitive”.


    *   They cannot use any of the following characters:- $ - + % & * ! “ # ? / =
    ( ) ^ ~ [ ] { } | \


    *   The names used can not be ''C'' reserved words (i.e. ones that are already
    used by the language such as **int, char, printf** etc.


    Within any program, there is a need to store different **types** data/information.
    This is, most commonly, numbers or text.


    ## Basic Data Types in C


    Each piece of data then, must have a type. In C, there are particular names for
    each of these types, which are explained below.


    1\. **int**


    “int” is used to store whole number data. Because of the way ''C'' works, only
    numbers in the range +32,767 to - 32,768 can be stored in an “int”.


    2\. **long**


    “long” is used to store larger whole numbers from +2,147,483,647 to -2,147,483,648.


    Example:-      


    long number_of_viewers;


    3\. **char**


    “char” is used to store single characters e.g. `A'', `z'', `q''.


    Example:-


    char first_initial;


    4\. **float** or **double**


    “**float**” or “**double”** is used store floating point numbers - those with
    decimal places such as 3.1415926.


    Example:-


    float       ft_index;


    double      exchange_rate;


    ### Reasons for Having Different Data Types


    It is sometimes asked why it is necessary to have different data types. The reason
    is not to make the language complicated and awkward to use, it is to improve the
    efficiency with which a program can utilise system resources. All data items use
    up an amount of System Memory. If we were to just say “each item of data will
    use 50 bytes of memory”, this could be very wasteful and we would exhaust our
    memory earlier than necessary if we only needed one byte per item for our particular
    program.


    Also, generally speaking, items of data which are larger take longer to process,
    so if we choose our data item size accordingly, we can improve the execution speed
    of our programs.


    When C was first developed, in the 1970’s, computer storage (both RAM and Disk)
    was/were extremely expensive, so efficient use of storage was a primary concern.
    In 2017, most computers have vast amounts of storage and very high speed processors
    – so more modern programming languages are less concerned with efficient usage
    of storage than C is – and they provide much better data processing facilities,
    within the language itself (especially when processing arrays – covered later
    – and lists).


    ## Initialising Data or “Variable” Values


    We can give a variable a specific value when we declare it:-


    int current_temperature = 25;


    This is called initialisation**.**


    ## Assigning Values to Variables


    In our program, we can set variables or “assign” them to particular values in
    a similar way to initialisation:-


    int main( )


    {


    int number_of_items;


    number_of_items = 0;


    }


    ### Using Data Types


    A good chunk of writing a ''C'' program is working out how to express the data
    required in terms of the types used in ''C''.


    We already saw, in the first program, how to print out some text. How do we print
    out the values of variables?


    ## Printing Out Variables


    Consider the following program:-


    #include "stdio.h"


    int main( )


    {


    int number_of_items = 0;


    printf (“No. of items = %d “, number_of_items);


    number_of_items = number_of_items + 1;


    printf (“New No. of items = %d”, number_of_items);


    }


    The program produces the following result:-


    No. of items = 0 New No of items = 1


    ### Action of the Program


    1.  Variable “number_of_items” is set to 0.


    2.  Value of variable is printed out.


    3.  Value of variable is increased by 1.


    4.  New value of variable is printed out.'
