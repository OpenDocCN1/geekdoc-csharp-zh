  trans: "\n如果你已经进入了命令行界面，可以忽略后续步骤。\n\n1. 在菜单中寻找“终端”（terminal）图标 ![Image](img/00024.jpeg)\
    \ 并点击它。输入\n\n```bash\nnano hello.c\n```\n\n并按回车\n\n1. 你应该看到此显示\n\n![Image](img/00025.jpeg)\n\
    \n1. 输入此程序\n\n![Image](img/00026.jpeg)\n\n1. 按下 `Ctrl-X` 接着按“Y”\n\n1. 输入以下行并按回车\n\
    \n```bash\ngcc hello.c -o hello\n```\n\n1. 如果你看到任何错误信息，或者收到了命令提示符以外的任何内容，你需要通过再次输入\
    \ `nano hello.c` 来检查你的程序，并将输入的内容与上方显示的进行比较。确保它们是`完全`一致的。如果没有看到任何错误信息，直接输入\n\n\
    ```bash\n./hello\n```\n\n1. 你应该看到下面的显示。\n\n![Image](img/00027.jpeg)\n\n1. 按回车返回命令行。\n\
    \n2. 恭喜！你现在已经完成了你的第一个程序并成功运行了它！\n\n## 第一个程序 - 它是做什么的？\n\n程序所做的就是在屏幕上打印一条消息，并等待按下回车键。更多细节如下所示：\n\
    \n1. `main()` - 表示程序的开始。\n2. `{`（左括号）意味着一个“块”的开始。\n3. `printf` 是一个打印“函数”——输出。\n\
    4. `getchar()` 是一个键盘读取“函数”——读取字符输入并等待回车键被按下。\n5. `}`（右括号）意味着一个块的结束。\n6. `/* */`\
    \ 意味着“注释”。“标记符”之间的文本会被编译器忽略——这些文本用于记录每一步的操作。\n\n在本指南结束时，你应该能够理解程序中所有行代码的作用。\n\n\
    ## 第一个程序 – 观察\n\n我们从这个第一个程序看到：\n\n* ‘C’是“自由格式的”—— 程序中不包含输入的行号（某些文本编辑器会在左侧边距显示行号）。\n\
    * ‘C’是“块结构化的”—— 所有内容都在大括号 `{ }` 之间的“块”中指定。\n\n我们还应该注意 C 是区分大小写的。这意味着如果你使用 `Printf`（大写字母“P”）而不是\
    \ `printf`，程序将无法运行。\n\n在接后的示例中，并不总是列出整个程序。除非另有说明，否则你应该始终在以下“骨架”中输入程序：\n\n```c\n\
    int main ( )\n{\n    <你的程序代码>\n}\n```\n\n## 关于“控制应用程序”和控制窗口的说明\n\n我们刚刚输入的程序，以及在本指南中将看到的其他程序一样，运行在`控制窗口`中。`控制窗口`本质上是对交互式计算早期的回顾——那时你有一个基础计算机控制台，只能显示字符或非常有限的图形。没有图形用户界面，几乎没有实际的图形。如果你学习到《高级\
    \ C 编程指南》，我们将查看一些基础 Linux 图形功能，但不是 GUI 编程。完整的 GUI 编程通常通过结合 C++ 等面向对象的编程语言来更好地理解。\n\
    \n# 'C' 中不同类型的数据\n\n## 程序中的数据是什么？\n\n它是程序执行其功能所需的信息。例如，公司人事记录中员工的姓名和地址，某人收藏中唱片的标题和艺术家。\n\
    \n现实世界中的数据具有无限的变化性。在'C' 中，与其他编程语言一样，只有特定的方式来数据。\n\n## 在 'C' 程序中使用数据\n\n要在程序中使用数据，我们必须声明它，通过输入一个特殊行，例如：\n\
    \n```c\nint number_of_items;\n```\n\n为了声明一个数据——一个整数，“整数”，用于存储某些计数操作的物品数量。代码必须知道它将要使用什么数据，因此：\n\
    \n数据声明始终位于代码之前。\n\n### 关于数据声明的说明\n\n显示的数据声明分为三部分：\n\n```c\nint number_of_items\
    \ ;\n```\n(1) (2) (3)\n\n它们是：\n\n1. 数据类型\n2. 数据项名称\n3. 终止符\n\n我们将声明的数据项称为`变量`。`名称`通常被称为`标识符`。\n\
    \n### 数据项（变量）名称\n\n变量命名遵循某些规则：\n\n* 变量名不能以数字开头。\n* 变量名不能包含空格（使用下划线 `_` 代替）。\n\
    * 变量名“区分大小写”。\n* 它们不能使用以下任何字符：`$ - +`。\n"
