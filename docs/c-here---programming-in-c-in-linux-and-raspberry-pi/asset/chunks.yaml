- fmt: "\nPerhaps the most important feature of any computer program is its ability\
    \ to make decisions - to do a conditional test. The way conditional tests are\
    \ made in 'C' is similar to other high level languages.\n\n## Conditional Statements\n\
    \nThere are a number of ways in 'C' to do conditional tests, but by far the most\
    \ common is “if..else”, which is shown below.\n\n```c\nif (condition)\none line\
    \ statement;\nelse\none line statement;\n```\n\nNOTE: Unlike some other programming\
    \ languages, “THEN” is assumed and this word is not included in the `if` statement.\n\
    \n`if .. else` can also take a slightly different form using a “multi-line statement”.\
    \ This is shown below.\n\n```c\nif (condition)\n{\n    statement 1;\n    statement\
    \ 2;\n    .\n    statement n;\n}\nelse\n{\n    statement 1;\n    statement 2;\n\
    \    .\n    statement n;\n}\n```\n\nNOTE: Equality is tested for using `==` e.g.\n\
    \n```c\nif (warp_factor == 10)\n{\n    printf (“The Engines can nae take it cap'n!!\\\
    n”);\n}\n```\n\nAs with other languages, “inequalities” can be tested for. The\
    \ following symbols can be used, where a `==` (“double equals”) might otherwise\
    \ be used:-\n\n| Symbol | Meaning |\n| :--- | :--- |\n| `!=` | not equal to. |\n\
    | `>` | greater than. |\n| `>=` | greater than or equal to. |\n| `<` | less than.\
    \ |\n| `<=` | less than or equal to. |\n\ne.g.\n\n```c\nif (i != 0)\n{\n    printf\
    \ (“The number is non-zero.\\n”);\n}\n```\n\n### Another Example\n\nSuppose we\
    \ wished to check for a resistance value being greater than `1000` ohms, we could\
    \ use the following conditional test.\n\n```c\nif (resistance_value > 1000)\n\
    {\n    printf (“Value is over 1 kilohm.\\n”);\n}\n```\n\nTo test for a number\
    \ of conditions at once, the “AND” and “OR” keywords are required. In 'C', these\
    \ are expressed thus:-\n\n- `&&` - Logical AND.\n- `||` - Logical OR.\n\ne.g.\n\
    \n```c\nif ((character >= '0') && (character <= '9'))\n{\n    printf (“The character\
    \ is a number. “);\n}\n```\n\n### Hints on Conditional Testing\n\nA conditional\
    \ test can be negated by placing a `!` in front of it e.g.\n\n`if (!!((i >= 6)\
    \ && (i <= 12)))`\n\n```c\nif (!!((i >= 6) && (i <= 12)))\n{\n    printf (“Number\
    \ is outside range 6 - 12”);\n}\n```\n\nConditional tests can become quite complex.\
    \ To keep them clear, it may be useful to follow these guidelines:-\n\n- Each\
    \ conditional test should be enclosed in (round) brackets.\n- Try to stick to\
    \ using the multi-line form of the conditional statement.\n- Always align braces\
    \ `{ }` which form the start and end of a block.\n- If conditional tests become\
    \ complicated, split them over a number of lines and align them sensibly.\n\n\
    ## More Complex Conditional Tests - The “switch..case” Statement\n\nConsider the\
    \ idea of writing a 'C' program to play a card game. Suppose you want to print\
    \ out the card value in the form of its number, for cards 2 to 10, or A, J, Q,\
    \ K for the others. If we assume an “int” called `card_value` contains a number\
    \ in the range 1 to 13, we could do this in 'C' in the following way:-\n\n```c\n\
    if ((card_value >= 2) && (card_value <=10))\n    printf (“%d”, card_value);\n\
    else\n    if (card_value == 1)\n        printf (“A”);\n    else\n        if (card_value\
    \ == 11)\n            printf (“J”);\n        else\n            if (card_value\
    \ == 12)\n                printf (“Q”);\n            else\n                if\
    \ (card_value == 13)\n                    printf (“K”);\n```\n\nAs we can see,\
    \ this gives a somewhat large and unwieldy set of “if” statements. If we wished\
    \ to do something as well as `printf` for each case, we would have to use the\
    \ `{ }` with each `if`, making the whole thing more troublesome. Another way of\
    \ doing the example would be...\n\nThe `switch..case` statement can be used to\
    \ test a given variable for a number of discrete values. Other languages tend\
    \ to use the “Case” statement alone. The previous example could be re-written\
    \ thus:-\n\n```c\nswitch (card_value)\n{\n    case 1:\n        printf (“A”);\n\
    \        break;\n    case 1:\n        printf (“J”);\n        break;\n    case\
    \ 12:\n        printf (“Q”);\n        break;\n    case 13:\n        printf (“K”);\n\
    \        break;\n    default:\n        printf (“%d”, card_value);\n        break;\n\
    }\n```\n\n### Notes:\n\n1. The `switch` statement takes the specified action for\
    \ the specified value.\n2. After each action, `break;` is inserted to cause execution\
    \ to carry on after the `}` of the `switch` statement. If `break` is not included,\
    \ execution continues into the next `case` (which is occasionally useful).\n3.\
    \ `default:` case specifies the action to be taken if the control variable's value\
    \ is none of those listed (this is optional).\n4. Perhaps surprisingly, the statements\
    \ in each `case` need not be included in `{}`. (Though any `if`, `do...while`,\
    \ `for` statements contained in a `case` would follow the normal rules.)\n\n###\
    \ Limitations of “switch..case”\n\n- The control variable should be of type `int`\
    \ or `char`.\n- The values being tested must be constants - i.e you cannot use\
    \ `switch` to test the value of another.\n\n## Codecracker – Some Tests\n\nIn\
    \ our code cracker, we need to do some tests:\n\n1. Check whether we had too many\
    \ guesses.\n2. Check whether the user wants to play again or finish the game.\n\
    3. Check whether the code the user entered matches any of the digits.\n\nThe “checking\
    \ against the secret code” step we will leave till later, as there is a little\
    \ more we need before we can easily do this. For checking whether the user wants\
    \ to continue the game we could do:\n\n```c\nchar response;\nresponse=getch();\n\
    if ((response==”y”) || (response==”Y”))\n{\n    /*start a new game*/\n}\nelse\n\
    {\n    /* exit from the game – end program */\n}\n```\n\nBut for checking the\
    \ number of guesses, we can do:\n\n```c\nint guess_counter = 0;\n/* Still things\
    \ to do/think about! */\nguess_counter++;\nif (guess_counter > 10)\n{\n    printf\
    \ (“You have lost!”);\n}\nelse\n{\n    /* Still things to do/think about! */\n\
    }\n```\n\nWe will see that our final code will be slightly different to this,\
