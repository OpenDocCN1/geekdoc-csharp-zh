    \ continuation, iteration expression.\n\n```c\nfor (i = 1; i <= 4; i++)\n{\n \
    \   printf (“This appears 4 times!”);\n}\n```\n\n### `while` Loop\n\n```c\ni =\
    \ 0;\nwhile (i < 10)\n{\n    i++;\n    printf (“i is now %d, i”, i);\n}\n```\n\
    \n### `do` Loop\n\n```c\ni=0;\ndo\n{\n    i++;\n    printf (“i is now %d, i”,\
    \ i);\n}\nwhile (i < 10);\n```\nCode always executes at least once.\n\n### `switch`\
    \ statement\n\nUse integer for control variable:\n\n```c\nswitch (card_value)\n\
    {\n    case 1:\n        printf (“Ace”);\n        break;\n    case 11:\n      \
    \  printf (“Jack”);\n        break;\n    .\n    .\n    default:\n        printf\
    \ (“%d”, card_value);\n}\n```\n\n### Functions\n\n```c\n/* 3 functions will be\
    \ declared below. */\nint global_integer; /* Global data declared outside*/\n\
    /* all functions. */\nvoid function_b(void); /* Predecl. for function_b */\nvoid\
    \ function_a(int any_number) /* returns nothing*/\n{ /* takes integer ^^ parameter\
    \ */\n    /* Integer only used in this function. */\n    int local_integer;\n\
    \    printf (“The number is %d”, any_number);\n}\n\nint function_c (int any_number)\
    \ /* returns an integer*/\n{ /* ^^ takes integer parameter */\n    function_b(\
    \ ); /* Call “function b” */\n    printf (“The number is %d”, any_number);\n \
    \   /* Just add 10 and return the value. */\n    any_number += 10;\n    return\
    \ (any_number);\n}\n\n/* Function which has no parameters and no return\nvalue.*/\n\
    void function_b ( )\n{\n    printf (“This is function b! “);\n}\n\nint main (\
    \ )\n{\n    /* Call function a. */\n    function_a(10);\n    /* Call function\
    \ c. */\n    function_c( );\n}\n```\n\n### Library Functions\n\nAt top of program\
    \ put:\n\n```c\n#include “stdio.h”      /*For printf, scanf etc. */\n#include\
    \ “string.h”      /*For string functions. */\n#include “stdlib.h”      /*For standard\
    \ 'C' library */\n```\n\n### String Functions\n\n- `strlen(string)`: String length\n\
    - `strcpy(dest, source)`: String copy\n- `strncpy(dest, source, number)`: Copy\
    \ n characters\n- `strcmp(string1, string2)`: String compare (returns 0 if equal)\n\
    - `strncmp(string1, string2, n)`: String compare 1st n\n- `stricmp(string1, string2)`:\
    \ Compare without case\n- `strncmpi(string1, string2)`: Comp 1st n - no case\n\
    - `sprintf(string, control sting, etc)`: “printf” into a string.\n- `centigrade_value\
    \ = atoi(string)`: Convert string to int\n\n### Standard 'C' Library\n\n- `srand(long)`:\
    \ Set seed for “rand”.\n- `rand()`: returns random value 0-65535.\n"
