  , user, message);\n    }\n}\n\n// In Startup.cs or Program.cs\napp.UseEndpoints(endpoints\
  \ =>\n{\n    endpoints.MapHub<ChatHub>(\"/chatHub\");\n});\n```\n\n**性能亮点**：\n*\
  \ **低延迟**：与传统的 HTTP 请求相比，`WebSockets` 降低了延迟，提供了更快速响应的用户体验。\n* **可扩展性**：得益于 `Kestrel`\
  \ 和 `WebSocket` 连接的异步特性，应用程序可以处理大量用户。\n\n## 2. 视频流平台\n\n**用例**：视频流平台需要向用户提供高性能的视频内容传输，具备基于网络条件进行自适应流传输等功能。\n\
  \n**实现**：\n* **HTTP/2 支持**：应用程序利用 `HTTP/2` 服务视频分段，允许在单个连接上发送多个流。\n* **自适应比特率流**：服务器监控用户带宽并动态调整视频流的质量，增强用户体验。\n\
  \n### 示例代码：提供视频分段\n\n```csharp\napp.MapGet(\"/video/{id}\", async (HttpContext context,\
  \ string id) =>\n{\n    var filePath = GetVideoFilePath(id); // Logic to retrieve\
  \ video file path\n    context.Response.ContentType = \"video/mp4\";\n    await\
  \ context.Response.SendFileAsync(filePath);\n});\n```\n\n**性能亮点**：\n* **提高吞吐量**：`HTTP/2`\
  \ 多路复用能力降低了延迟并提高了视频分段交付的速度。\n* **用户体验**：自适应流确保了不同网络状况下的流畅播放，减少了缓冲时间。\n\n## 3. 在线游戏服务器\n\
  \n**用例**：在线多人游戏需要一个能够处理玩家之间实时通信、维护游戏状态并处理玩家动作的服务器。\n\n**实现**：\n* **UDP Sockets**：游戏服务器使用\
  \ `UDP` 快速通信玩家动作和游戏事件，优先考虑速度而非可靠性。\n* **异步处理**：服务器异步处理玩家输入，确保游戏状态更新和事件处理不会阻塞通信。\n\
