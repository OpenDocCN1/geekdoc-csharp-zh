  * **可扩展性**：`Kestrel` 允许应用程序在高负载下进行扩展。\n\n## 5. IoT 数据采集平台\n\n**用例**：IoT 采集平台从部署在各个位置的传感器收集数据。系统需要高效的摄取和实时处理。\n\
