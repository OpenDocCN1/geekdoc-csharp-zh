    \ CHAPTER 1. (INTRO TO C#)\n\n`C#` ( PRONOUNCED \"CSHARP\") IS AN OBJECT- ORIENTED\
    \ PROGRAMMING LANGUAGE FROM MICROSOFT THAT AIMS TO COMBINE THE COMPUTING POWER\
    \ OF `C++` WITH THE PROGRAMMINGEASE OF VISUAL BASIC. `C#` IS BASED ON `C++` AND\
    \ CONTAINS FEATURES SIMILAR TO THOSE OF `JAVA`. `C#` IS DESIGNED TO WORK WITH\
    \ MICROSOFT'S `.NET` PLATFORM.\n\n## WHY C#.\n`C#` IS AN ELEGANT, SIMPLE, TYPE-SAFE,\
    \ OBJECT-ORIENTED LANGUAGE THAT ALLOWS ENTERPRISE PROGRAMMERS TO BUILD A BREADTH\
    \ OF APPLICATIONS.\n\n`C#` is used in famous game engines `C#` is used Worldwide:\n\
    - Simple command line utilities. Input stuff. Convert stuff. Output stuff.\n-\
    \ Desktop applications.\n- Windows service\n- Web services And many more.\n\n\
    ## C# VS .NET\n`C#` is a programming language. `.NET` `.Net` is framework for\
    \ Building applications on windows.\n\n## History OF C Language\nBefore `c#` we\
    \ had two languages in c family `c` and `c++` and when we compile our code compiler\
    \ converts our code into the native code of the machine on which we were running\
    \ on.\n\nIt means if I wrote a application on windows machine it will no longer\
    \ run on other os (linux ,mac etc).\n\nWhen Microsoft was designing `c#` they\
    \ came with the idea to borrow from java community. In `java` code is First translated\
    \ into byte code and then into machine code.\n\nIn `c#` code is first translated\
    \ into `il`(`intermediate language`) and then translated into the machine code\
    \ independent of computer we are running on . It’s the job of `clr`(`Common language\
    \ runtime`) to translate `il` code to machine code.\n\n## Architecture of .NET\
    \ applications\nApplication is consist of classes and these classes are the main\
    \ building blocks of applications . These classes interact with each other to\
    \ give us desired functionality.\n\n### What is a class.\nA class is a container\
    \ which has data which is also called attributes and functions which is also called\
    \ methods.\n\n### Functions Or Methods\nFunctions and methods have behaviors and\
    \ they do things for us.\n\n### Data.\nData represents state of our application.\n\
    \n### Example:\n Car\nA car can have attributes alike model Color Brand Speed\
    \ And a car can have functionality alike `Start()` `Break()` Take this car as\
    \ a class In real world applications we have many classes each for some specific\
    \ task and these classes Interact with each other to provide desired functionality.\n\
    \n### Namespaces.\nAs number of classes grow in our project we need a way to organize\
    \ related classes so we use `namespace`. `namespace` is a container of same classes.\n\
    \n### Assembly.\nAs number of namespaces grow we need a way to partition our application\
    \ so here `assemblies` come handy. `Assembly` is a container of same namespaces\
    \ Physically it is a file on disk it could be (`exe` or `dll`).\n\n## Our First\
    \ C Program.\nIn this book we will use visual studio so open visual studio.\n\n\
    On top go to file:\n`file>new>project>installed>templates>visual c#>windows>console\
    \ application`\n\nAnd here we have 3 fields we can give name to our project just\
    \ name the project `HelloWorld`.\n\nWe can also set the location of the project\
    \ by clicking browse button.\n\nThird we can name solution in visual studio we\
    \ have solutions one solution can have more than one project.\n\nFinally click\
    \ ok to create console application.\n\nSee the screen shoot below\n![](images/00002.jpeg)\
    \ **Lets look at some windows and tabs of visual studio**\n\n### Few common windows\
    \ and tabs\n- Solution Explorer\n- Coding Editior\n\nstart with solution explorer\
    \ to show solution explorer or any window go to view on the top and select that\
    \ window you want to show in solution explorer window first we have Solution name\
    \ and number of projects in this solution.\n- `properties>AssemblyInfo.cs`\n-\
    \ `assemblyinfo` is produced when application will compile it is the identification\
    \ of application.\n\n### References\nUnder references we see `assemblies` linked\
    \ with this project to do some job . these `assemblies` comes with console application\
    \ template in visual studio.\n\n### App.config\nHere the configurations of the\
    \ application is stored. it has fields like title, description, ![](images/00003.jpeg)\n\
    \n### Program.cs\nHere in `program.cs` we can start coding.\n\nTHIS FILE `PROGRAM.CS`\
    \ WE HAVE BUNCH OF USING STATEMENTS ON TOP. Our Project Name is `HELLOWORLD` so\
    \ visual studio by default creates a namespace `HELLOWORLD`. When we write code\
    \ in this `namespace` we have access to all classes defined in this `namespace`.\
    \ If we want to use a class from different namespace we have to import that in\
    \ our code file that is why we use `using` statement by default visual studio\
    \ adds 5 `using` statements:\n\n```csharp\nusing System;\nusing System.Collections.Generic;\n\
    using System.Linq;\nusing System.Text;\nusing System.Threading.Tasks;\n```\n`System`\
    \ is namespace in `.NET` framework where we have all handy classes.\n"
