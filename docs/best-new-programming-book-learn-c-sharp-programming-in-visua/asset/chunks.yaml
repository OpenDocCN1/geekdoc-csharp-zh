    # For loop


    ## SYNTAX


    The syntax of a **for** loop in C# is:


    for ( init; condition; increment )


    {


    statement(s);


    }


    Here is the flow of control in a for loop:


     The **init** step is executed first, and only once. This step allows you to
    declare and initialize any loop control variables. You are not required to put
    a statement here, as long as a semicolon appears.


     Next, the **condition** is evaluated. If it is true, the body of the loop is
    executed. If it is false, the body of the loop does not execute and flow of control
    jumps to the next statement just after the for loop.


     After the body of the for loop executes, the flow of control jumps back up to
    the **increment** statement. This statement allows you to update any loop control
    variables. This statement can be left blank, as long as a semicolon appears after
    the condition.


     The condition is now evaluated again. If it is true, the loop executes and the
    process repeats itself (body of loop, then increment step, and then again testing
    for a condition). After the condition becomes false, the for loop terminates.


    ## **EXAMPLE**


    using System;


    namespace Loops {


    class Program {


    static void Main(string[] args) {


    /* for loop execution */ for (int a = 10; a < 20; a = a + 1) {


    Console.WriteLine("value of a: {0}", a); }


    Console.ReadLine();


    }


    }


    }


    When the above code is compiled and executed, it produces the following result:


    value of a: 10


    value of a: 11


    value of a: 12


    value of a: 13


    value of a: 14


    value of a: 15


    value of a: 16


    value of a: 17


    value of a: 19


    ## While loop


    A **while** loop statement in C# repeatedly executes a target statement as long
    as a given condition is true.


    ## **SYNTAX**


    The syntax of a **while** loop in C# is:


    while(condition)


    {


    statement(s);


    }


    Here, **statement(s)** may be a single statement or a block of statements. The
    **condition** may be any expression, and true is any non-zero value. The loop
    iterates while the condition is true.


    When the condition becomes false, program control passes to the line immediately
    following the loop.


    ## **EXAMPLE**


    using System;


    namespace Loops {


    class Program


    { static void Main(string[] args) {


    /* local variable definition */ int a = 10;


    /* while loop execution */ while (a < 20)


    {


    Console .WriteLine("value of a: {0}", a); a++;


    }


    Console.ReadLine();


    }


    }


    }


    When the above code is compiled and executed, it produces the following result:


    value of a: 10


    value of a: 11


    value of a: 12


    value of a: 13


    value of a: 14


    value of a: 15


    value of a: 16


    value of a: 17


    value of a: 18


    ## **Do While Loop**


    Unlike **for** and **while** loops, which test the loop condition at the start
    of the loop, the **do...while** loop checks its condition at the end of the loop.


    A **do...while** loop is similar to a while loop, except that a do...while loop
    is guaranteed to execute at least one time.


    ## **SYNTAX**


    The syntax of a **do...while** loop in C# is:


    do


    {


    statement(s);


    }while( condition );


    Notice that the conditional expression appears at the end of the loop, so the
    statement(s) in the loop execute once before the condition is tested.


    If the condition is true, the flow of control jumps back up to do, and the statement(s)
    in the loop execute again. This process repeats until the given condition becomes
    false.


    ## **EXAMPLE**


    using System; namespace Loops {


    class Program { static void Main(string[] args) {


    /* local variable definition */ int a = 10;


    /* do loop execution */ do


    {


    Console .WriteLine("value of a: {0}", a); a = a + 1;


    }


    while (a < 20);


    Console.ReadLine();


    }


    }


    }


    When the above code is compiled and executed, it produces the following result:


    value of a: 10


    value of a: 11


    value of a: 12


    value of a: 13


    value of a: 14


    value of a: 16


    value of a: 17


    value of a: 18


    value of a: 19


    ## Foreach loop


    Foreach loop is used to iterate from the elemenst of object which have list nature
    ie arrays.


    ![](images/00042.jpeg)First we create a local variable and then iterate the object
    whose elements we want to access


    In this example we are iterating all the element of the array and displaying it
    onto console


