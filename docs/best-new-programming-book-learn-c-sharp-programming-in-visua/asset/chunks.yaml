    Faisalnaziarali@gmail.com


    ## **CHAPTER 1**.


    (INTRO TO C#)


    C# ( PRONOUNCED "CSHARP") IS AN OBJECT- ORIENTED PROGRAMMING LANGUAGE FROM MICROSOFT
    THAT AIMS TO COMBINE THE COMPUTING POWER OF C++ WITH THE PROGRAMMINGEASE OF VISUAL
    BASIC. C# IS BASED ON C++ AND CONTAINS FEATURES SIMILAR TO THOSE OF JAVA. C# IS
    DESIGNED TO WORK WITH MICROSOFT''S .NET PLATFORM.


    ## WHY C#.


    ### C# IS AN ELEGANT, SIMPLE, TYPE-SAFE, OBJECT-*•*


    ORIENTED LANGUAGE THAT ALLOWS ENTERPRISE


    ### PROGRAMMERS TO BUILD A BREADTH OF APPLICATIONS.


    C# is used in famous game engines[**•


    •**] C# is used Worldwide


    **• Simple command line utilities. Input stuff. Convert stuff. Output stuff.


    •Desktop applications.


    •Windows service


    •Web services And many more.**


    ## C# VS .NET


    **C#


    C# is a programming language


    .NET** .**Net is framework for Building applications on windows**


    ## History OF C Language


    Before c# we had two languages in c family c and c++ and when we compile our code
    compiler converts our code into the native code of the machine on which we were
    running on.


    It means if I wrote a application on windows machine it will no longer run on
    other os (linux ,mac etc).


    When Microsoft was designing c# they came with the idea to borrow from java community.
    In java code is First translated into byte code and then into machine code


    In c# code is first translated into il(intermediate language) and then translated
    into the machine code independent of computer we are running on . It’s the job
    of clr(Common


    language runtime) to translate il code to machine code.


    ## Architecture of .NET applications


    Application is consist of classes and these classes are the main building blocks
    of applications . These classes interact with each other to give us desired functionality


    # What is a class.


    A class is a container which has data which is also called attributes and functions
    which is also called methods


    # Functions Or Methods


    Functions and methods have behaviors and they do things for us


    # Data.


    Data represents state of our application


    # Example:


    ## Car A car can have attributes alike model Color Brand Speed And a car can have
    functionality alike Start() Break() Take this car as a class In real world applications
    we have many classes each for some specific task and these classes Interact with
    each other to provide desired functionality.


    # Namespaces.


    As number of classes grow in our project we need a way to organize related classes
    so we use namespace. namespace is a container of same classes


    # Assembly.


    As number of namespaces grow we need a way to partition our application so here
    assemblies come handy. Assembly is a container of same namespaces


    Physically it is a file on disk it could be (exe or dll).


    # Our First C Program.


    In this book we will use visual studio so open visual studio


    On top go to file


    >new>project>installed>templates>visual c#>windows>console application


    And here we have 3 fields we can give name to our project just name the project
    HelloWorld


    We can also set the location of the project by clicking browse button


    Third we can name solution in visual studio we have solutions one solution can
    have more than one project


    Finally click ok to create console application


    See the screen shoot below


    ![](images/00002.jpeg)**Lets look at some windows and tabs of visual studio**


    ## Few common windows and tabs


    Solution Explorer


    Coding Editior


    start with solution explorer to show solution explorer or any window go to view
    on the top and select that window you want to show in solution explorer window
    first we have Solution name and number of projects in this solution


    properties>Assemblyinfo.cs


    assemblyinfo is produced when application will compile it is the identification
    of application


    ## References


    Under references we see assemblies linked with this project to do some job . these
    assemblies comes with console application template in visual studio.


    ## App.config


    Here the configurations of the application is stored


    it has fields like title, description, ![](images/00003.jpeg)


    ## Program.cs


    Here in program.cs we can start coding


    THIS FILE PROGRAM.CS WE HAVE BUNCH OF USING STATEMENTS ON TOP. Our Project Name
    is HELLOWORLD so visual studio by default creates a namespace HELLOWORLD. When
    we write code in this namespace we have access to all classes defined in this
    namespace. If we want to use a class from different namespace we have to import
    that in our code file that is why we use using statement by default visual studio
    adds 5 using statements


    using System;


    using System.Collections.Generic; using System.Linq;


    using System.Text;


    using System.Threading.Tasks;


    **System is namespace in .NET framework where we have all handy utility classes**


    ![](images/00004.jpeg)**Every console application we create in visual studios
    has one class called program.cs


    In this class we have one method/function and this is the entery point of our
    application**


    static void Main(string[] args)


    {


    }


    This method starts with static which we will later cover in this course


    Then return type which is void and void means this function returns nothing.


    And then the Name of the function Main .note that c# is a case sensitive language
    So Main has to Start With upper Case M.


    Functions can have input and output which we are called arguments this function
    takes a string[] array input which we will cover later


    And finally we close a code block with curly braces{}.


    Now lets write helloworld to the console


    ## Console Application


    A console application is a simple application with no graphics . To Display Heloworld
    to the console we can use Console Class which is used to write on console and
    take input from console.


    So inside Main Method Type the code below Console.WriteLine("HelloWorld");


    Console is a class and WriteLine is the function of Console Class. we can access
    a method of class with . (dot) and the name of the function . WriteLine is used
    to write a line on console .in () we give the input to that function . we can
    write anything inside to print on console in this case we will print helloworld
    to the console.


    To run and see the result press shortcut key to run application in visual studio
    is


    Ctrl + F5


    Finished Code :


    static void Main(string[] args) {


    Console.WriteLine("HelloWorld"); }


    **Congrats you have just finished the first chapter.**


    ## CHAPTER 2\. PRIMITIVE TYPES AND EXPRESSIONS


    Now we will dive into some basic c# stuff


    ## **VARIABLES AND CONSTANTS** :


    **VARIABLE**.


    A name given to a storage location in memory


    Declaring a variable


    Datatype Name of the variable =value we want to assign ;


    Every statement in c sharp ends with ;


    Example


    Int a =10;


    Int is datatype , a is name and we assign value 10 with equal sign =


    ## **Constant**.


    An immutable value. This value will not change throughout the lifetime of the
    application Example


    pi =3.14 which we use to calculate area of circle it should be constant.


    Declaring a constant


    Const keyword Datatype Name of the constant =value we want to assign ;


    Example of pi.


    Const float pi=3.14f;'
