    ## A Beginner’s Guide To C# Programming


    ### *PROGRAMMING MADE EASY TO LEARN*


    By


    ### *FAISAL NAZEER*


    Copyright © 2016


    ## ABOUT AUTHOR:


    Faisal has more than 4 years of


    experience in *Programming*...He started To learn to code at the age of 14.he
    is currently making games for mobile platform.


