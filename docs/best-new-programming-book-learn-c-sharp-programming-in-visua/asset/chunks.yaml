    ## CHAPTER 3. NON-PRIMITIVE TYPES

    Chapter Text


    ## CLASSES

    Combines related variables(fields) and functions(methods)


    Let lear classes with a example


    ![](images/00024.jpeg) Here we a a class named `person` with four fields and four
    methods


    Classes are blueprint from which we create objects


    ### Object

    Object is a instance of a class


    With this example we can create three instance of persons

    - Marry

    - John

