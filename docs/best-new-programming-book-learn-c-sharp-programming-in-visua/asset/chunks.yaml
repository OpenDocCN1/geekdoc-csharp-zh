  trans: "\n\n![](img/00043.jpeg)\n![](img/00001.jpeg)\n\n# C# 编程入门指南\n\n### 让编程变得简单\n\
    \n作者：\n\n### FAISAL NAZEER\n\n版权 © 2016\n\n## 关于作者：\nFaisal 拥有超过 4 年的`Programming`\
    \ 经验……他在 14 岁开始学习编程。目前他正在为移动平台开发游戏。\n\n## 目录\n- 引言\n- 法律声明\n- 第 1 章（C# 简介）\n-\
    \ 第 2 章（基本类型与表达式）\n- 第 3 章 非基本类型\n- 第 4 章 控制流\n- 关于作者\n\n## 法律声明\n本书的任何部分均不能在任何地方重用或分发，请勿从任何未知来源下载。如果您发现此类活动，请通过以下邮箱告知我们：\n\
    \nFaisalnaziarali@gmail.com \n\n## 第 1 章（C# 简介）\n\n`C#`（读作 \"C SHARP\"）是微软的一种面向对象的编程语言，旨在结合\
    \ `C++` 的计算能力与 Visual Basic 的编程易性。`C#` 基于 `C++` 并包含了与 `JAVA` 相似的特性。`C#` 设计用于与微软的\
    \ `.NET` 平台配合。\n\n## 为什么选择 C#\n`C#` 是一种优雅、简单、类型安全的面向对象的语言，允许企业级人员构建各种应用程序。\n\n\
    `C#` 用于著名的游戏引擎，在全球范围内用于：\n- 简单的命令行工具。输入处理、转换处理、输出处理。\n- 桌面应用程序。\n- Windows 服务\n\
    - Web 服务等。\n\n## C# VS .NET\n`C#` 是一种编程语言。`.NET` 是在 Windows 上构建应用程序的框架。\n\n##\
    \ C 语言的历史\n在 `c#` 之前，我们在 C 家族中有两种语言：`c` 和 `c++`。当我们编译代码时，编译器会将代码转换为我们运行的机器的本地代码。\n\
    \n这意味着如果我在 Windows 机器上编写了一个程序，它将无法在其他操作系统（如 Linux、mac 等）上运行。\n\n当微软在设计 `c#` 时，他们借鉴了\
    \ Java 社区的想法。在 `java` 中，代码首先被翻译成字节码，然后翻译成机器码。\n\n在 `c#` 中，代码首先被翻译成 `il`（中间语言），然后翻译成独立于我们运行的计算机的机器码。`clr`（公共语言运行时）负责将\
    \ `il` 代码翻译成机器码。\n\n## .NET 应用程序架构\n应用程序由类组成，这些类是应用程序的主要构建模块。这些类相互作用以为我们提供所需的功能。\n\
    \n### 什么是类。\n类是一个容器，其中包含数据（也称为属性）和函数（也称为方法）。\n\n### 函数或方法\n函数和方法具有行为，它们为我们执行任务。\n\
    \n### 数据。\n数据代表我们应用程序的状态。\n\n### 示例：\n汽车\n汽车可以拥有型号、颜色、品牌、速度等属性，并且可以像 `Start()`、`Break()`\
    \ 等的功能。将这辆车视为一个类，在现实应用中，我们有很多类，每个类负责某些特定任务，这些类相互作用以提供所需的功能。\n\n### 命名空间。\n随着项目中类的数量增加，我们需要一种方法来组织相关的类，因此我们使用\
    \ `namespace`。`namespace` 是相同类的容器。\n\n### 程序集。\n随着命名空间数量的增加，我们需要方法来划分应用程序，这里 `assemblies`\
    \ 就派上用场了。`Assembly` 是相同命名空间的容器。物理上它是磁盘上的文件，可以是（`exe` 或 `dll`）。\n\n## 我们的第一个 C\
    \ 程序。\n在本书中我们将使用 Visual Studio，所以请打开 Visual Studio。\n\n在顶部点击文件：\n`file>new>project>installed>templates>visual\
    \ c#>windows>console application`\n\n在这里有 3 个字段，我们可以为项目命名，只需将项目命名为 `HelloWorld`。\n\
    \n我们还可以通过点击浏览按钮设置项目的位置。\n\n第三，我们可以在 Visual Studio 中命名解决方案，我们有解决方案，一个解决方案可以包含多个项目。\n\
    \n最后点击确定创建控制台应用程序。\n\n查看下面的截图\n![](img/00002.jpeg) **让我们看看 Visual Studio 的一些窗口和标签**\n\
    \n### 几个常用窗口和标签\n- 解决方案管理器 (Solution Explorer)\n- 代码编辑器 (Coding Editor)\n\n从解决方案管理器开始，要显示解决方案管理器或任何窗口，请点击顶部的“视图”并选择您想在解决方案管理器窗口中显示的窗口。首先是解决方案名称和此解决方案中的项目数量。\n\
    - `properties>AssemblyInfo.cs`\n- `assemblyinfo` 在应用程序编译时产生，它是应用程序的标识。\n\n###\
    \ 引用 (References)\n在引用下，我们看到与此项目链接以执行某些任务的 `assemblies`。这些 `assemblies` 是随 Visual\
    \ Studio 控制台应用程序模板自带的。\n\n### App.config\n在这里存储应用程序的配置。它有标题、描述等字段，![](img/00003.jpeg)\n\
    \n### Program.cs\n在 `program.cs` 中，我们可以开始编写代码。\n\n在 `PROGRAM.CS` 文件中，顶部有一堆 `using`\
    \ 语句。我们的项目名称是 `HELLOWORLD`，所以 Visual Studio 默认创建一个名为 `HELLOWORLD` 的命名空间。当我们在这个\
    \ `namespace` 中编写代码时，我们可以访问此命名空间定义的所有类。如果我们想使用来自不同命名空间的类，必须在我们的代码文件中导入它，这就是我们使用\
    \ `using` 语句的原因，Visual Studio 默认添加了 5 个 `using` 语句：\n\n```csharp\nusing System;\n\
    using System.Collections.Generic;\nusing System.Linq;\nusing System.Text;\nusing\
    \ System.Threading.Tasks;\n```\n`System` 是 `.NET` 框架中的一个命名空间，其中包含了所有方便的类。\n\n"
