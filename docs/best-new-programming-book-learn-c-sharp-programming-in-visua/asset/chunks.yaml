  trans: "\n查看下方代码 ![](img/00036.jpeg) 现在运行应用程序并查看结果。\n\n# 字符串\n\n字符串是字符序列，我们用 `\"\
    double quotes helloworld\"` 将其括起来。\n\n## 字符串拼接\n\n我们可以使用下面的语法将字符串拼接在一起：\n\n![](img/00037.jpeg)\n\
    \n在此示例中：\n我们正使用字符串字面量（这是一个空字符串）和 `+` 号将 `firstname` 和 `anme` 字符串拼接在一起。\n\n# 字符串练习\n\
    \n打开 visual studio\n\n创建一个字符串：\n`String keyword name of string =string” Example`\n\
    `String firstname=faisal”`\n`String secondname=nazeer”`\n\n// 现在我们可以拼接两个字符串\n\n\
    `Var fullname=firstname + +secondname”` 现在在控制台上显示它 Console.WriteLine(fullname);`\n\
    \n# 第 4 章. 控制流\n\n### 条件条件语句\n\n![](img/00038.jpeg)\n\n### IF/ELSE 语句\n\n![](img/00039.jpeg)\n\
    \n在第一行我们有一个条件 IF，如果条件为真，则执行 IF 代码块。如果条件为假，则将检查 ELSE IF 块，如果 ELSE IF 条件为真，则执行 ELSE\
    \ IF 块，否则执行 ELSE 语句。\n\n## SWITCH CASE 语句\n\n![](img/00040.jpeg)\n\n在 switch case\
    \ 语句中，我们在 cases 中比较变量的值，如果条件为真，则将运行该代码块；否则跳到下一个；如果所有条件都不为真，则将执行 default 块。\n\n\
    ## switch/case 语句的语法\n\n首先我们创建一个变量，然后创建 cases 并比较变量的值，我们可以拥有任意数量的 cases，最后执行 default\
    \ 块。\n\n## Switch Case 练习：\n\n```sharp\nchar grade = 'A';\n\nswitch (grade)\n\
    {\ncase 'A':\nConsole.WriteLine(\"Excellent!\"); break;\ncase 'B':\nConsole.WriteLine(\"\
    nice\");\nbreak;\ncase 'C':\nConsole.WriteLine(\"Well done\"); break;\ncase 'D':\n\
    Console.WriteLine(\"You passed\"); break;\ncase 'F':\nConsole.WriteLine(\"Better\
    \ try again\"); break;\ndefault:\nConsole .WriteLine(\"Invalid grade\");\nbreak;\n\
    }\nConsole.WriteLine(\"Your grade is {0}\", grade);\n```\n\n这里我们在每个 case 中检查等级，即\
    \ `A`，如果任何 case 等于 `a`，它将运行；在这种情况下，第一个 case 是 `A`，所以将运行第一个代码块。\n\n## 迭代语句\n\n\
    这些语句用于重复一系列语句，直到给条件为真。\n\n迭代语句的类型\n\n![](img/00041.jpeg)\n\n# For 循环\n\n## 语法\n\
    \nC# 中 `for` 循环的语法如下：\n\n```csharp\nfor ( init; condition; increment )\n{\n  \
    \  statement(s);\n}\n```\n\n这里是 for 循环中的控制流：\n\n- 首先执行 `init` 步骤，且只执行一次。此步骤允许你声明并初始化任何循环控制变量。你不需要在此处放置语句，只要出现分号即可。\n\
    - 接下来，评估 `condition`。如果它为真，则执行循环体。如果为假，则不执行循环体，控制流跳转到 for 循环之后的的第一条语句。\n- 在执行完\
    \ for 循环体后，控制流跳转回 `increment` 语句。此语句允许你更新任何循环控制变量。只要在条件后出现分号，此语句可以留空。\n- 现在再次评估条件。如果它为真，则循环执行并重复该过程（循环体、然后增量步骤、然后再次测试条件）。在条件变为假后，for\
    \ 循环终止。\n\n## 示例\n\n```csharp\nusing System;\n\nnamespace Loops {\nclass Program\
    \ {\n    static void Main(string[] args) {\n        /* for 循环执行 */ for (int a\
    \ = 10; a < 20; a = a + 1) {\n            Console.WriteLine(\"value of a: {0}\"\
    , a); \n        }\n        Console.ReadLine();\n    }\n}\n}\n```\n\n当上述代码被编译并执行时，它产生以下结果：\n\
    \nvalue of a: 10\nvalue of a: 11\nvalue of a: 12\nvalue of a: 13\nvalue of a:\
    \ 14\nvalue of a: 15\nvalue of a: 16\nvalue of a: 17\nvalue of a: 19\n\n## While\
    \ 循环\n\nC# 中的 `while` 循环语句只要给定条件为真，就会重复执行目标语句。\n\n## 语法\n\nC# 中 `while` 循环的语法如下：\n\
    \n```csharp\nwhile(condition)\n{\n    statement(s);\n}\n```\n\n在这里，`statement(s)`\
    \ 可能是单个语句或一个语句块。`condition` 可以是任何表达式，true 是任何非零值。循环在条件为真时进行迭代。\n\n当条件变为假时，程序控制传递到紧随循环的行。\n\
    \n## 示例\n\n```csharp\nusing System;\n\nnamespace Loops {\nclass Program\n{\n \
    \   static void Main(string[] args) {\n        /* 局部变量定义 */ int a = 10;\n    \
    \    /* while 循环执行 */ while (a < 20)\n        {\n            Console .WriteLine(\"\
    value of a: {0}\", a); a++;\n        }\n        Console.ReadLine();\n    }\n}\n\
    }\n```\n\n当上述代码被编译并执行时，它产生以下结果：\n\nvalue of a: 10\nvalue of a: 11\nvalue of a:\
    \ 12\nvalue of a: 13\nvalue of a: 14\nvalue of a: 15\nvalue of a: 16\nvalue of\
    \ a: 17\nvalue of a: 18\n\n## Do While Loop\n\n与 `for` 和 `while` 循环在循环开始时测试条件不同，`do...while`\
    \ 循环在循环结束时检查条件。\n\n`do...while` 循环类似于 while 循环，但 `do...while` 循环保证至少执行一次。\n\n\
    ## 语法\n\nC# 中 `do...while` 循环的语法如下：\n\n```csharp\ndo\n{\n    statement(s);\n}while(\
    \ condition );\n```\n\n注意条件表达式出现在循环末尾，因此在测试条件之前会执行循环中的 `statement(s)`。\n\n如果条件为真，控制流跳转回\
    \ `do`，再次执行 `statement(s)`。此过程重复直到给定条件变为假。\n\n## 示例\n\n```csharp\nusing System;\n\
    \nnamespace Loops {\nclass Program {\n    static void Main(string[] args) {\n\
    \        /* 局部变量定义 */ int a = 10;\n        /* do 循环执行 */ do\n        {\n     \
    \       Console .WriteLine(\"value of a: {0}\", a); a = a + 1;\n        }\nwhile\
    \ (a < 20);\n        Console.ReadLine();\n    }\n}\n}\n```\n\n当上述代码被编译并执行时，它产生以下结果：\n\
    \nvalue of a: 10\nvalue of a: 11\nvalue of a: 12\nvalue of a: 13\nvalue of a:\
    \ 14\nvalue of a: 16\nvalue of a: 17\nvalue of a: 18\nvalue of a: 19\n\n## Foreach\
    \ 循环\n\nForeach 循环用于遍历具有列表性质对象的元素，例如数组。\n\n![](img/00042.jpeg)首先创建一个局部变量，然后遍历我们想要访问元素的对象。\n\
    \n在此示例中，我们正在遍历数组的所有元素并将其显示在控制台上。\n\n# **恭喜，书写完成了**\n\n"
