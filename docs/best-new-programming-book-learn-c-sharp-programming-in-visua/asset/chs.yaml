- "# 最佳新编程书：在 Visual Studio 2016 中学习 C# 编程 - 学习应用与游戏编程基础，C# 语言基础：C# 编程训练营\n\n\n\n\
  ![](img/00043.jpeg)\n![](img/00001.jpeg)\n\n\n\n\n\n版权 © 2016\n\n## 关于作者：\nFaisal\
  \ 拥有超过 4 年的`Programming` 经验……他在 14 岁开始学习编程。目前他正在为移动平台开发游戏。\n\n\n\n# 第 1 章（C# 简介）\n\
  \n`C#`（读作 \"C SHARP\"）是微软的一种面向对象的编程语言，旨在结合 `C++` 的计算能力与 Visual Basic 的编程易性。`C#`\
  \ 基于 `C++` 并包含了与 `JAVA` 相似的特性。`C#` 设计用于与微软的 `.NET` 平台配合。\n\n## 为什么选择 C#\n`C#` 是一种优雅、简单、类型安全的面向对象的语言，允许企业级人员构建各种应用程序。\n\
  \n`C#` 用于著名的游戏引擎，在全球范围内用于：\n- 简单的命令行工具。输入处理、转换处理、输出处理。\n- 桌面应用程序。\n- Windows 服务\n\
  - Web 服务等。\n\n## C# VS .NET\n`C#` 是一种编程语言。`.NET` 是在 Windows 上构建应用程序的框架。\n\n## C\
  \ 语言的历史\n在 `c#` 之前，我们在 C 家族中有两种语言：`c` 和 `c++`。当我们编译代码时，编译器会将代码转换为我们运行的机器的本地代码。\n\
  \n这意味着如果我在 Windows 机器上编写了一个程序，它将无法在其他操作系统（如 Linux、mac 等）上运行。\n\n当微软在设计 `c#` 时，他们借鉴了\
  \ Java 社区的想法。在 `java` 中，代码首先被翻译成字节码，然后翻译成机器码。\n\n在 `c#` 中，代码首先被翻译成 `il`（中间语言），然后翻译成独立于我们运行的计算机的机器码。`clr`（公共语言运行时）负责将\
  \ `il` 代码翻译成机器码。\n\n## .NET 应用程序架构\n应用程序由类组成，这些类是应用程序的主要构建模块。这些类相互作用以为我们提供所需的功能。\n\
  \n### 什么是类。\n类是一个容器，其中包含数据（也称为属性）和函数（也称为方法）。\n\n### 函数或方法\n函数和方法具有行为，它们为我们执行任务。\n\
  \n### 数据。\n数据代表我们应用程序的状态。\n\n### 示例：\n汽车\n汽车可以拥有型号、颜色、品牌、速度等属性，并且可以像 `Start()`、`Break()`\
  \ 等的功能。将这辆车视为一个类，在现实应用中，我们有很多类，每个类负责某些特定任务，这些类相互作用以提供所需的功能。\n\n### 命名空间。\n随着项目中类的数量增加，我们需要一种方法来组织相关的类，因此我们使用\
  \ `namespace`。`namespace` 是相同类的容器。\n\n### 程序集。\n随着命名空间数量的增加，我们需要方法来划分应用程序，这里 `assemblies`\
  \ 就派上用场了。`Assembly` 是相同命名空间的容器。物理上它是磁盘上的文件，可以是（`exe` 或 `dll`）。\n\n## 我们的第一个 C 程序。\n\
  在本书中我们将使用 Visual Studio，所以请打开 Visual Studio。\n\n在顶部点击文件：\n`file>new>project>installed>templates>visual\
  \ c#>windows>console application`\n\n在这里有 3 个字段，我们可以为项目命名，只需将项目命名为 `HelloWorld`。\n\
  \n我们还可以通过点击浏览按钮设置项目的位置。\n\n第三，我们可以在 Visual Studio 中命名解决方案，我们有解决方案，一个解决方案可以包含多个项目。\n\
  \n最后点击确定创建控制台应用程序。\n\n查看下面的截图\n![](img/00002.jpeg) **让我们看看 Visual Studio 的一些窗口和标签**\n\
  \n### 几个常用窗口和标签\n- 解决方案管理器 (Solution Explorer)\n- 代码编辑器 (Coding Editor)\n\n从解决方案管理器开始，要显示解决方案管理器或任何窗口，请点击顶部的“视图”并选择您想在解决方案管理器窗口中显示的窗口。首先是解决方案名称和此解决方案中的项目数量。\n\
  - `properties>AssemblyInfo.cs`\n- `assemblyinfo` 在应用程序编译时产生，它是应用程序的标识。\n\n### 引用\
