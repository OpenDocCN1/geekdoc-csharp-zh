  \n图 13-10\n\n![f1310.tif](img/f1310_fmt.jpg)\n\n## 识别手势\n\n触摸手势是 iPhone 和 iPad 用户界面的重要部分；然而，之前的版本的\
  \ iPhone OS 需要一些编程来响应手势。iPhone OS 3.2 引入了 表 13-4 所示的六种手势，以简化响应这些类型用户交互所需的代码。\n\n\
  ### 表 13-4: UIGestureRecognizer 类型\n\n| 类 | 手势 |\n| --- | --- |\n| `UITapGestureRecognizer`\
  \ | 点击配置数量的次数 |\n| `UIPinchGestureRecognizer` | 手指捏合或分开（用于缩放） |\n| `UIPanGestureRecognizer`\
  \ | 通过在屏幕上移动手指进行平移 |\n| `UISwipeGestureRecognizer` | 向任何方向滑动 |\n| `UIRotationGestureRecognizer`\
  \ | 使用相反方向移动的手指进行旋转 |\n| `UIRongPressGestureRecognizer` | 按住手指 |\n\nListing 13-9\
  \ 显示了如何使用 `UITapGestureRecognizer` 来检测并响应双击。重要的行如下：\n\n*   创建一个 `UITapGestureRecognizer`\
  \ 实例来监视此类类型的手势。\n*   将 `NumberOfTapsRequired` 属性设置为 `2` 以检测双击。你也可以选择响应“三击”或“四击”。\n\
  *   调用 `AddTarget()` 方法以通知识别器在检测到手势时调用哪种方法。通常，你将将其指定为该类，并创建一个新的 `Selector` 来指示是哪种方法。\n\
  *   使用 `AddGestureRecognizer()` 方法将手势识别器“注册”到你想要可以双击的 `UIView` 上。注意，`UIImageView`\
  \ 也需要 `UserInteractionEnabled=true`。\n*   声明处理双击的方法，并使用与传递给 `AddTarget()` 相同的 `Selector`\
  \ 将其标记为 `export` 属性。C# 方法名并不重要，只要导出字符串和选择器字符串匹配即可。\n*   在方法内部，你可以从 `UIGestureRecognizer`\
  \ 发送者获取有关双击事件的详细信息，例如点击发生的位置。你必须传入你想要相对于哪个 `UIView` 的坐标 —— 在大多数情况下，这将检测事件的视图（在示例中是\
  \ `UIImageView`）。你的代码随后可以使用这些坐标来响应双击。\n\n![download.eps](img/download_fmt.gif)\n\
  \n### Listing 13-9 双击手势 (iPad06\\MyViewController)\n\n```csharp\n// 此处原文为示例代码且不完整，根据逻辑保持代码块不翻译\n\
  ```\n\n\n\n\n\n| 状态 | 手势说明 |\n| --- | --- |\n| Possible (可能) | 默认状态 ——尚未识别出手手势。\
  \ |\n| Began (开始) | 表示手势已被识别。你应该在此状态下捕获手势所影响的属性的起始值。 |\n| Changed (已更改) | 根据手势类型，消息包含更新后的手势数据（如位置、缩放、平移、速度）。这些数据不是以自上次消息的增量值发送，而是自手势开始（Began）以来的变化。\
  \ |\n| Ended (结束) | 执行与手势相关的任何最终操作，例如在滑动手势结束（Ended）后执行页面动画。 |\n| Recognized (已识别)\
  \ | 对于多触控手势，与 Ended 同义（例如，由缩放产生但未由平移产生势）。 |\n| Failed (失败) | 识别失败。此状态不发送任何操作消息。\
  \ |\n| Cancelled (已取消) | 识别被取消。你的代码应该丢弃手势期间应用的所有属性更改（例如，将更新后的视觉对象捕捉回之前的尺寸/位置）。 |\n\
  \nListing 13-11 中的平移手势代码略有不同：除了位置外，它还有 `Translation`（平移）和 `Velocity`（速度）属性。\n\n\
  ![download.eps](img/download_fmt.gif)\n\n#### Listing 13-11: 平移手势 (iPad06\\MyViewController.cs)\n\
  \n```csharp\npublic Initialize ()\n{\n   // ... image setup code ...\n   UIPanGestureRecognizer\
  \ pan = new UIPanGestureRecognizer();\n   pan.AddTarget(this, new MonoTouch.ObjCRuntime.Selector(\"\
  PanSelector\"));\n   appd.Image.AddGestureRecognizer(pan);\n}\n\n[Export(\"PanSelector\"\
  )]\npublic void Pan (UIGestureRecognizer sender)\n{\n   UIPanGestureRecognizer pan\
  \ = (UIPanGestureRecognizer)sender;\n   var locInView = sender.LocationInView(sender.View);\n\
  \   System.Drawing.PointF translate = pan.Translation;\n   switch (sender.State)\n\
  \   {\n       case UIGestureRecognizerState.Began:\n         appd.Text.Text += \"\
  \\n[Pinch] Began-store the start value\";\n         break;\n       case UIGestureRecognizerState.Changed:\n\
  \         appd.Text.Text += \"\\n[Pan] \" + sender.State +\n             \"\\t\\\
  tTranslate: \" + translate.X + \",\" + translate.Y + \n             \"\\t\\tVelocity:\
  \ \" + pan.Velocity + \n             \"\\t\\tLocation: \" + locInView.X + \",\"\
  \ + locInView.Y;\n         break;\n       case UIGestureRecognizerState.Cancelled:\n\
  \         // revert\n         break;\n       case UIGestureRecognizerState.Recognized:\n\
  \         appd.Text.Text += \"\\n[Pinch] Recognized-now do pan content \";\n   \
  \      break;\n   }\n}\n```\n\n这些手势识别器的输出所示于 图 13-11。你的代码将对每个手势做出相应响应，而不是仅仅将变化的属性值发送到屏幕上。\n\
  \n## 构建通用应用 (Universal App)\n\n通用应用可以同时运行在 iPad 和 iPhone 类设备上。通用应用的关键要素是：\n\n* \
  \  在 `Info.plist` 文件中通知 App Store 和操作系统同时支持两个平台（使用 MonoDevelop 项目选项窗口选择“iPhone and\
  \ iPad”，如图 13-2 所示）。\n*   为每个平台指定支持的方向（注意 `Portrait`（竖屏）是默认设置）。\n*   提供自动调整大小的视图，使其在两个平台上都能正常工作，或者在检查使用的是哪种设备后使用不同的布局。\n\
  \n图 13-11\n![f1311.tif](img/f1311_jpg)\n\n你还应该从 表 13-1 中提供至少三个启动图像：\n\n*   `Default.png`，将显示在\
  \ iPhone 和 iPod Touch 设备上。\n*   `Default-Portrait.png` 和 `Default-Landscape.png`，将由\
  \ iPad 使用（取决于其方向）。\n\n你还可以在 `Info.plist` 中设置应用程序图标。`CFBundleIconFiles` 键可以包含一个图标文件名数组，以便在\
  \ iPhone 和 iPad 上显示不同的图标。只需创建两个图标图像并将它们添加到 MonoDevelop 项目中：为 iPhone 准备一张 57×57 像素的图像，为\
  \ iPad 准备一张 72×72 像素的图像。然后在 `CFBundleIconFiles` 数组中添加两个文件名（如 Listing 13-12 所示）。iOS\
  \ 系统将根据尺寸自动选择正确的图像。\n\n#### Listing 13-12: iPhone 和 iPad 图标设置 (iPad07\\Info.plist)\n\
  \n```xml\n<key>CFBundleIconFiles</key>\n<array>\n  <string>Icon.png</string>\n \
  \ <string>iPad.png</string>\n</array>\n```\n\n使用 `AutoresizingMask` 和 `ShouldotateToInterface`\
  \ 可以确保界面在每个设备上都正常工作。为了让 Listing 13-13 中的代码在 iPad 上运行，需要特定的视图控制器。\n\nListing 13-13:\
  \ 通用启动 (iPad07\\AppDelegate)\n\n```csharp\npublic override bool FinishedLaunching\
  \ (UIApplication app, NSDictionary options)\n{\n   tv = new UITableView();\n   tv.Source\
  \ = new TableViewController();\n   navigationController = new UINavigationController(tv);\n\
  \   navigationController.RootViewController(tv);\n   window = new UIWindow(UIScreen.MainScreen.Bounds);\n\
  \   window.AddSubview(navigationController.View);\n   window.MakeKeyAndVisible();\n\
  \   return true;\n}\n```\n\n\n\n\n\n*   然后，通过比较 `MainScreen.Bounds` 属性来检测设备类型。`768x1024`\
  \ 意味着设备是 iPad。\n*   如果设备是 iPhone（或 iPod Touch），则会创建一个 `UINavigationController` 并将其添加到窗口中。随后将像普通的\
  \ iPhone 应用程序一样展示表格和图像。\n*   如果设备是 iPad，代码会创建一个 `Toolbar` 并将其添加到 `DetailViewController`\
  \ 中，然后在将拆分视图添加到窗口之前，先创建并分配 `DetailViewController` 和 `SplitViewController`。\n\n###\
  \ 代码列表 13-14: 优化的 FinishedLaunching (iPad08\\AppDelegate.cs)\n\n```csharp\npublic\
  \ override bool FinishedLaunching (UIApplication app, NSDictionary options)\n{\n\
  \    window = new UIWindow (UIScreen.MainScreen.Bounds);\n    // the table view\
  \ is used regardless of which device is targetted\n    tv = new UITableView ();\n\
  \    tvs = new MyTableViewSource (this);\n    tv.Source = tvs;\n    TableViewController\
  \ = new MyTableViewController (tv);\n    TableViewController.Title = \"My Photos\"\
  ;\n    IsIPad = (UIScreen.MainScreen.Bounds == new RectangleF (0, 0, 768, 1024));\n\
