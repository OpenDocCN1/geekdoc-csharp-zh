  \n图 4-1 显示了这些类在 Interface Builder 中的外观，这样你就知道去哪里找到它们了。\n\n图 4-1\n\n![f0401.tif](img/f0401_fmt.jpg)\n\
  \n# 窗口与视图\n\n窗口和视图是所有 iPhone OS 应用的基础。它们是布局系统的基础，负责捕获和处理用户输入。iPhone OS 中的 `UIWindow`\
  \ 类相对简单，不需要大量的自定义，而 `UIView` 及其子类则成了你用户界面每个部分的基础。\n\n## UIWindow\n\n一个 iPhone OS\
  \ 应用程序通常只有一个窗口 —— 它提供了显示用户界面其余部分的背景。与桌面操作系统中的窗口不同，`UIWindow` 类没有“外壳”（没有标题栏；调整大小柄；边框；最小化、最大化或关闭按钮），并且始终填充整个屏幕。唯一的装饰是窗口顶部的状态栏，你可以选择显示或隐藏它。\n\
  \n当你在 MonoDevelop 中创建一个新的应用程序解决方案时，它会自动将 `MainWindow.xib` 添加到项目中，其中包含一个名为 `window`\
  \ 的 `UIWindow` 实例。它还添加了 `AppDelegate.FinishedLaunching` 方法，其中包含 `window.MakeKeyAndVisible()`\
  \ 这一行，用于显示窗口。\n\n可以直接在代码中创建窗口。列表 4-1 显示了最简单的 MonoTouch 应用，它不需要 Interface Builder\
  \ 文件即可在屏幕上显示某些文本。书中的大多数示例都使用了 Interface Builder，但值得记住，你始终可以通过在代码中构建 `UIView` 对象来实现相同的效果。\n\
  \n![download.eps](img/download_fmt.gif)\n\n列表 4-1: 在代码中创建 `UIWindow` (`Window01\\\
  AppController.cs`)\n\n```csharp\nusing System;\n\nusing MonoTouch.Foundation;\n\
  using MonoTouch.UIKit;\nnamespace Window01\n{\n\n[Register(\"AppController\")]\n\
  public class AppController : UIApplicationDelegate\n{\n   UIWindow window;\n\n \
  \  public override void FinishedLaunching (UIApplication app)\n   {\n      window\
  \ = new UIWindow (UIScreen.MainScreen.Bounds)\n      {\n         new UILabel(new\
  \ System.Drawing.RectangleF (50,150,230,100))\n         { Text = \"Hello world\"\
  \ }\n      };\n      window.MakeKeyAndVisible();\n   }\n}\nclass HelloWorld\n{\n\
  \   static void Main (string[] args)\n   { UIApplication.Main (args, null, \"AppController\"\
  ); }\n}}\n```\n\n`UIWindow` 应该始终填充整个屏幕，因此使用 `UIScreen.MainScreen.Bounds` 来设置窗口大小。\n\
  \n## UIView\n\n虽然不是完全等同，但 `UIView` 类与 ASP.NET、WinForms 和 WPF 中的用户控件（User Control）概念有一些相似的特征。\n\
  \n`UIView` 是 `UIKit` 框架中每个其他控件的基类 —— 它负责向屏幕渲染内容，并响应其边界内的触摸事件。`UIView` 还可以包含其他 `UIView`\
  \ 实例 —— 称为子视图（sub-views） —— 并根据需要构建深层层次结构。父视图（或超视图）管理子视图的大小和位置，并可能响应未被子视图处理的事件。\n\
  \n在非常简单的应用程序中（例如书中的许多特定控件示例），`UIView`（或其子类）可以直接添加到窗口中进行显示和用户交互。大多数应用程序需要更复杂的视图处理，这由\
  \ `UIViewControllers` 完成，例如本章涵盖的 `UINavigationController` 和第 6 章涵盖的 `UITableViewController`。`UIViewControllers`\
  \ 协调你应用程序中所有不同的视图：根据情况显示和隐藏它们，并在设备方向改变时调整它们的大小。\n\n如前所述，应用程序应该只有一个 `UIWindow`；你添加到项目中的其余视图将是\
  \ `UIView`、`UIViewController` 或它们其中任一子类。`UIView` 上需要了解的关键成员有：\n\n*   `Bounds`：视图在其所在坐标系中的位置和大小。\n\
  *   `Frame`：视图的位置和大小。\n*   `UIView(frame)`：`UIView` 的构造函数。\n*   `AddSubview`：将提供的\
  \ `UIView` 实例作为子视图添加。\n\n![note.ai](img/note.gif)\n\n## 数据视图\n\nInterface Builder\
  \ 数据视图库包含许多不同类型的视图，其中一些重要的类拥有自己的章节：`UITableView`（第 6 章）、`UIMapView`（第 8 章）以及第 10\
  \ 章涵盖的 `UIImageView`。其余部分在本节讨论。\n\n### UIWebView\n\n`UIWebView` 控件允许你在应用程序中嵌入网络内容：基于网络的站点、应用程序中的\
  \ HTML 文件或动态生成的 HTML 字符串。它与 Windows Forms 中的 .NET WebBrowser 控件非常相似，基本上就像在应用程序内部有一个\
  \ Safari 实例。\n\n 基于网络的内容\n\n`UIWebView` 最明显的用途是在应用程序中显示网页。该控件的成员不多；主要的有：\n\n*  \
  \ `LoadRequest()`：此方法传递 URL（在 `NSUrlRequest` 对象中）从互联网加载该地址。在下面的示例中，通过按钮调用此方法。\n\
  *   `ScalesPageToFit`：此属性控制内容是自动缩放适应（允许缩放）还是强制始终保持“实际大小”。默认值为 false，这意味着网页不会为你缩小。熟悉\
  \ Mobile Safari 的用户会期望能够缩放网页，因此对于网络内容，你通常应该将其设置为 true，或者在 Interface Builder 中勾选\
  \ Scales To Fit 选项。\n*   `LoadStarted`：每当浏览器加载新内容时都会触发此事件。下面的示例显示了网络活动动画，以提供某些正在处理的视觉反馈。\n\
  *   `LoadFinished`：当内容加载完成（整个页面及其所有内容，包括图像和脚本）时触发此事件。用于隐藏网络活动动画。\n*   `LoadError`：当页面无法加载时触发此事件。下面的示例停止网络活动动画并向用户显示错误消息。\n\
  \n为了演示加载网页，本章下载中的一个示例 —— WebView01 在窗口上放置了三个控件：`UIWebView`、`UITextField` 和一个 `UIButton`。添加到\
  \ `FinishedLaunching()` 中的这段代码使其能够工作：\n\n```csharp\nGoButton.TouchUpInside += delegate\n\
  \n{\n```\n\n\n\n\n\n```cs\nWebBrowser.LoadRequest(new NSUrlRequest(new NSUrl(UrlInput.Text)));\n\
  };\n\nWebBrowser.LoadStarted += delegate\n{\n    UIApplication.SharedApplication.NetworkActivityIndicatorVisible\
  \ = true;\n};\n\nWebBrowser.LoadFinished += delegate\n{\n    UIApplication.SharedApplication.NetworkActivityIndicatorVisible\
  \ = false;\n};\n\nWebBrowser.LoadError += delegate(object sender, UIWebErrorArgs\
  \ e)\n{\n    UIApplication.SharedApplication.NetworkActivityIndicatorVisible = false;\n\
  \    using (var alert = new UIAlertView(\"WebView Error\"\n            e.Error.LocalizedDescription,null,\"\
  OK\",null))\n    { alert.Show(); }\n};\n```\n\n### `WebView01\\Main.cs`\n\n结果如图\
  \ 4-2 所示。尝试导航到一个无效的 URL（例如，`http://wrox.co`）或在没有网络连接的情况下进行测试，以触发 `LoadError` 委托。\n\
