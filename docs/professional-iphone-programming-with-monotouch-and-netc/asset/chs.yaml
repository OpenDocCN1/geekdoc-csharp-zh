  \            row = data;\n        }\n        SingleColorTableViewController controller;\n\
  \        MyColor row;\n        public override int NumberOfSections(UITableView\
  \ tableView)\n        {\n            return 2; // 是的，硬编码为我们想要的布局\n        }\n  \
  \      public override int RowsInSection(UITableView tableview, int section)\n \
  \       { // 硬编码以拆分单元格\n            if (section == 0)\n                return 1;\n\
  \            else\n                return 2;\n        }\n        public override\
