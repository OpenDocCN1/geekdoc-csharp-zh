  ```\n\n导航控制器是一个特别强大的类，它让你能够轻松创建友好的信息层次结构。它们被广泛用于内置应用程序。`UINavigationController`\
  \ 将第 6 章再次介绍，因为它经常与 `UITableView` 配合使用，其中表格行用于展示导航选项列表。\n\n## 总结\n\n本章介绍了一些基础构建块：\n\
  \n- `UIWindow`, `UIView`, `UIViewController`\n- `UINavigationController`, `UITableView`,\
  \ `UINavigationBar`\n- `UITabBarController`, `-`\n\n### 第 5 章\n\n#### 在 iPhone 上处理数据\n\
  \n数据是应用程序的生命线。本章将介绍 SQLite 数据库以及存储数据的策略。\n\n**本章内容包括：**\n\n- 与 SQLite 引擎交互\n- 使用\
  \ XML 存储数据\n\n## 使用 SQLite\n\nSQLite 是一个运行在 iPhone 上的嵌入式引擎，它是设备原生的。它与 SQL Server、Oracle\
  \ 等客户端/服务器数据库不同。在客户端/服务器数据库中，查询或操作会被发送到数据库引擎，执行并将结果返回给客户端。对于这种数据库引擎，它运行与应用程序相同的进程中。SQLite\
  \ 使用 SQL（结构化查询语言）与之交互。SQLite 的另一个优点是它是完全免费的。\n\n本章的目的并不是介绍 SQL 语言、数据库、表、列、数据类型、外键、行或任何其他特性。读者应该理解这些概念。\n\
  \n## 使用 Mono.Data.Sqlite\n\nSQLite 的数据提供程序包含在 `Mono.Data.Sqlite` 程序集中。该程序集支持 SQLite\
  \ 版本 3。该程序适用于 ADO.NET 2.0，对于使用 MonoTouch 编写应用程序来说这不是问题。在本章中，我们使用连接字符串 `Data Source=filename.db3`。\n\
  \n## 设置数据库\n\n让应用程序与 SQLite 工作的第一步是设置数据库。对于基于服务器的数据库，这由 DBA 一次性完成。对于 SQLite，数据库的创建必须在应用程序在设备上首次运行时完成，并且在运行该应用程序的每个设备上完成。由于应用程序必须在终端设备上运行，因此数据库设置过程必须在没有用户干预的情况下运行，并且在设备的时间限制内运行。查看创建数据库的代码：\n\
  \n\n\n\n\n```cs\nstring DatabaseName = \"TwitterData.db3\";\n\nstring documents\
  \ = Environment.GetFolderPath(Environment.SpecialFolder.Personal);\n\nstring db\
  \ = Path.Combine(documents, DatabaseName);\n\nbool exists = File.Exists(db);\n\n\
  if (!exists)\n{\n    SqliteConnection.CreateFile(db);\n}\n```\n\n### 位于下载的 `Sqlite/Main.cs`\
  \ 文件\n\n这段代码通过以下步骤创建一个数据库：\n\n1. 确定一个包含 iPhone 个人文件夹名称的字符串。\n2. 创建一个包含数据库完整路径加文件名的字符串。\n\
  3. 如果文件不存在，则通过调用 `SqliteConnection` 对象的 `CreateFile()` 静态方法来创建数据库。\n\n## 设置表\n\n\
  现在你的数据库已经创建完成，下一步是设置表、索引、触发器以及其他所需的特定数据库对象。附录 5-1 显示了某些创建表、触发器和索引的代码：\n\n![download.eps](img/download_fmt.gif)\n\
  \n附录 5-1: 创建表和其他对象\n\n```cs\nstring DatabaseName = \"TwitterData.db3\";\n\nstring\
  \ documents = Environment.GetFolderPath (Environment.SpecialFolder.Personal);\n\n\
  string db = Path.Combine (documents, DatabaseName);\n\nvar conn = new SqliteConnection(\"\
  Data Source=\" + db);\n\nvar commands = new[] {\n    \"DROP TABLE IF EXISTS TWITTERDATA\"\
  ,\n    \"DROP TRIGGER IF EXISTS TWITTERDATA_INSERT\",\n    \"CREATE TABLE TWITTERDATA\
  \ (STATUSID BIGINT PRIMARY KEY, \" +\n        \"TWITTERID VARCHAR(20), STATUS VARCHAR(140),\
  \ TWEETDATE DATETIME, \" +\n        \"DATEENTERED DATETIME)\",\n    \"CREATE TRIGGER\
  \ TWITTERDATA_INSERT INSERT ON TWITTERDATA \" +\n    \"BEGIN UPDATE TWITTERDATA\
  \ SET DATEENTERED=DATE('now') \" +\n        \"WHERE STATUSID=NEW.STATUSID; END;\"\
  ,\n    \"CREATE INDEX IDX_TWITTERID ON TWITTERDATA (TWITTERID)\",\n    \"CREATE\
  \ INDEX IDX_DATEENTERED ON TWITTERDATA (DATEENTERED)\",\n    \"CREATE INDEX IDX_TWEETDATE\
  \ ON TWITTERDATA (TWEETDATE)\"\n};\n\nforeach (var cmd in commands)\n    using (var\
  \ sqlitecmd = conn.CreateCommand()) {\n        sqlitecmd.CommandText = cmd;\n  \
  \      sqlitecmd.CommandType = CommandType.Text;\n        conn.Open ();\n      \
  \  sqlitecmd.ExecuteNonQuery ();\n        conn.Close();\n    }\n```\n\n### 位于下载的\
  \ `Sqlite/Main.cs` 文件\n\n这段代码创建了一组数据库对象。具体细节如下：\n\n* 创建了一个 `SqliteConnection` 对象。\n\
  * 将一组 SQL 命令放置在一个字符串数组中。数组中的每个字符串都是一个数据库命令。\n* 这些命令会先检查表是否存在（如果存在则删除），然后创建一个表，创建一个触发器，最后创建一组索引。\n\
  * 使用 `foreach` 迭代来遍历命令，并执行字符串数组中的每个命令。\n\n你会注意到的一点是，在 SQLite 中没有用于创建文件的 GUI 工具。此外，开发者不应期望用户能够按照一系列命令来手动创建数据库、表和其他对象。\n\
  \n## 使用 SQL 语句\n\n创建、修改和删除数据库对象是非常有趣的。然而，CRUD（创建、读取、更新、删除）是应用程序的灵魂。通过 SQL 进行查询、更新和删除数据的能力是应用程序的核心。\n\
  \n## 使用 Read/Select 读取数据\n\n读取数据对于应用程序来说是一项重要操作。从数据库表中读取数据是执行频率占 95% 以上的操作。.NET\
  \ Framework 为我们提供了读取器、连接以及一系列允许我们访问数据库表的对象。MonoTouch 为 iPhone 提供了这些 .NET 方法实现。附录\
  \ 5-2 显示了一些展示如何从表中读取数据的代码：\n\n![download.eps](img/download_fmt.gif)\n\n附录 5-2: 从表中读取数据\n\
  \n```cs\nstring documents = Environment.GetFolderPath (Environment.SpecialFolder.Personal);\n\
  string db = Path.Combine (documents, DatabaseName);\nstring strSql = \"select Max(TweetDate)\
  \ as MaxTweetDate, Count(Status) from TwitterData\";\nstring output = String.Empty;\n\
  var conn = new SqliteConnection(\"Data Source=\" + db);\nSqliteDataReader dr;\n\
  var cmd = new SqliteCommand(strSql, conn);\nconn.Open();\ndr = cmd.ExecuteReader();\n\
  if (dr.HasRows == true) {\n    while(dr.Read()) {\n        output = \"Number of\
  \ records: \" + Convert.ToString(dr[\"StatusCount\"]) +\n        \" Most post date:\
  \ \" + Convert.ToString(dr[\"MaxTweetDate\"]);\n    }\n}\nelse {\n    output=\"\
  No records found.\";\n}\nconn.Close();\nStatus.Text = output;\n```\n\n### 位于下载的\
  \ `Sqlite/Main.cs` 文件\n\n如你所见，使用你熟悉的对象是可能的。你可以创建一个连接对象 `SqliteConnection`，然后创建一个读取器。通过读取器，你可以像在\
  \ .NET 中一样遍历记录。\n\n![note.ai](img/note_gif)\n\n在编写本书期间，`SqliteDataAdapter` 在调用 `Fill()`\
  \ 时存在 bug。该 bug 已提交给 MonoTouch 的 bug 系统，但尚未确定修复时间。\n\n## 使用 SQL 语句获取数据\n\n既然你已经知道如何从表中读取数据，下一个明显的问题是“如何将数据放入表中？”你的第一步是获取数据。参考附录\
  \ 5-3：\n\n1. 调用 Twitter API 获取 XML 数据。\n2. 使用 LINQ to XML 将数据转换为对象。有了这些对象，代码就可以很容易地处理数据。\n\
  3. 一旦创建了查询，下一步就是遍历结果。记住，LINQ 在需要数据时才会执行。\n4. 下一步是保存数据。这是在自定义的 `SaveData` 方法中完成的。\n\
  \n![download.eps](img/download_fmt.gif)\n\n附录 5-3: 从 Twitter 获取数据并保存到 SQLite\n\n\
  ```cs\nstring url = \"http://twitter.com/statuses/friends_timeline.xml\";\nHttpWebRequest\
  \ request = (HttpWebRequest)HttpWebRequest.Create(url);\nrequest.Method = \"GET\"\
  ;\nrequest.Credentials = new NetworkCredential(TwitterUserId, TwitterPassWord);\n\
  WebResponse response = request.GetResponse();\nStreamReader reader = new StreamReader(response.GetResponseStream());\n\
  string responseString = reader.ReadToEnd();\nreader.Close();\nXDocument document\
  \ = XDocument.Parse(responseString);\nvar query = from e in document.Root.Descendants()\n\
  \    where e.Element(\"user\") != null\n    select new UserStatusSvc {\n       \
  \ StatusId = Convert.ToInt64(e.Element(\"id\").Value),\n        UserName = e.Element(\"\
  user\").Element(\"screen_name\").Value,\n        ProfileImage = e.Element(\"user\"\
  ).Element(\"profile_image_url\").Value,\n        Status = e.Element(\"text\").Value,\n\
  \        StatusDate = e.Value.ParseDateTime().ToString()\n    };\nforeach(UserStatusSvc\
