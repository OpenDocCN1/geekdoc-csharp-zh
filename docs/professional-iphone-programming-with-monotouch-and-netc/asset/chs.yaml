  \ 上，当选择某行时，你需要将一个新的图像视图推送到导航控制器栈中（有关使用表格进行导航的更多信息请参见第 4 和第 6 章）。对于 iPad，图像视图已经在拆分视图的另一部分创建了，因此你只需要在每次选择行时重置图像文件即可。\n\
  \n代码列表 13-15 展示了两种不同的方法。针对 iPad 的代码使用了 `AppDelegate` 上的公共字段 `ViewPort`，以便从此方法访问拆分视图的另一部分。\n\
  \n### 代码列表 13-15: RowSelected (iPad08\\AppDelegate.cs)\n\n```csharp\npublic override\
  \ void RowSelected (UITableView tableView, NSIndexPath indexPath)\n{\n    if (!appd.IsIPad)\n\
  \    {\n      // iPhone, need to create and push new view controller\n      var\
  \ ivc = new MyDetailViewController (imagePath[indexPath.Row]);\n      appd.navigationController.PushViewController\
  \ (ivc, true);\n    }\n    else\n    {\n      // iPad, use a splitview, and add\
  \ a toolbar to the image view controller\n      DetailViewController.ViewPort.Image\
  \ = UIImage.FromFile(imagePath[indexPath.Row]);\n      appd.ViewPort = imagePath[indexPath.Row];\n\
  \    }\n}\n```\n\n\n\n\n\n理解 `Objective-C` 的能力将是非常有用的。本章的目标是为你提供一份 `Objective-C`\
  \ 的参考和介绍，帮助你获得这种理解能力。\n\n## 如何使用本章\n\n你不需要从头到尾彻底 `Objective-C` 就能读懂并理解它。如果你对面向对象编程（OOP）概念和\
  \ `C`-风格语言表示熟悉（如果你正在使用 `MonoTouch`，你很可能已经熟悉这些），那么你需要投入的时间会少得惊人。尽管如此，在学习新事物时保持现实的态度也很重要。根据情况设定预期有助于你避免产生气馁。\n\
  \n从现实角度考虑，这里有几点需要注意，以及关于你如何最好利用这里信息的建议。\n\n许多 `Objective-C` 教程和书籍都在反复赘述 `Objective-C`\
  \ 有多简单。如果符合以下情况，这确实有些道理：\n\n1. 你已经认识 `C`。不仅仅是某种类 `C` 的语言，而是 `C` 本身。\n2. 你熟悉 `Smalltalk`（`Objective-C`\
  \ 受 `Smalltalk` 影响，并具有 `Smalltalk` 风格的消息机制）。\n\n对于来自 `C#` 的开发者来说，`Objective-C` 看起来确实有些奇怪。一些用于描述该语言的术语将是陌生的。`Objective-C`\
  \ 运行时的方面、`Objective-C` 规范等，可能会让你暂时觉得像在重新学习编程。\n\n如果你打算一辈子都用 `Objective-C` 工作，那么它与（比如）`C#`\
  \ 的工作方式之间存在非常真实的差异，学习这些差异将令你获益。然而，语法、术语、运行时等，在大多数情况下在 `C#` 中都有对应的类比。就像西班牙语语者可以通过阅读葡萄牙语来应付一样，`C#`\
  \ 开发者在稍加帮助下，也可以通过读懂 `Objective-C`。\n\n如果你兴趣学习更多关于 `Objective-C` 而不仅仅是学会读它，你可以从头到尾读完本章。\n\
  \n如果你赶时间并试图满足某个截止日期，而且满足截止日期的一部分涉及理解 `Objective-C`，那么你的首选目标应该是本章末尾的“速查表”。在那里，你会找到按关键字、语法、概念等分类的“翻译表”。这些表格中的信息可能足以让你顺利过关。如果你需要更多信息，本章中的每个表都有对应的章节进行更详细的介绍。\n\
  \n最终，无论你选择哪条路线，不要被学习一种对你来说是全新的、可能与你习惯的不同的语言所吓倒。做好面对挑战的准备。但你是一个程序员，程序员的生计就是处理大多数人永远不会见过或无法理解的工具。你完全可以理解外来语法和规范。`C#`\
  \ 对你来说也曾很陌生（如果不是 `C#`，就是你开始的其他任何语言）。\n\n记住：你不需要学会编写 `Objective-C`；你只需要学会读懂它。配备有一本不错的短语本和多语言字典，你就能很好地在一个外国国家行走。如果你要搬到另一个国家，精通当地语言是值得的。但当你只是访问时，没有必要进一步。\n\
  \n因此，请把本章当作旅行指南一样。\n\n## 简述 Objective-C 和 Cocoa\n\n在学习阅读/理解 `Objective-C` 和 `Cocoa`\
  \ 之前，了解它们是什么会有帮助。从名字可以清楚地看出 `Objective-C` 是 `C` 的面向对象版本。\n\n为了明确一点，`Objective-C`\
  \ 是 `C`，但在其之上构建了一个面向对象的层。那么你可能预期 `Objective-C` 的外观和行为与 `C` 本身非常相似。虽然这是一个合理的假设，但当你深入研究时，最初发现它们之间所有的不同之处会让你感到惊讶。\n\
  \n`C` 是一种简单但可能笨拙的语言。它可能感觉死板、古怪且固执；它可能是无情且不留情的。某人第一次接触 `C` 会让他领略 `C` 的简洁，但也会让他发现它像一个设计得对新生婴儿危险的房子。电源插触手可及，炉灶开着火，你偶尔还会遇到一把可以射自己脚的枪。它通过当你的训练教官且不留任何余地来教你编写良好的代码。\n\
  \n`Objective-C`（本章稍后会详细介绍）是强大的，而且对于大多数开发者来说，它是比直接用 `C` 编写应用程序更快、更容易的方法。你仍然可能射到自己的脚或偶尔烧到自己，但它的设计初衷之一就是通过更具包容性来实现生产力的提高。它带有\
  \ `C` 的潜在危险，某些 iPhone 的 API 是严格的 `C`（没有对应的 `Objective-C` 框架），但一个典型 iPhone 应用的大部分源码将\
  \ `C` 和 `Objective-C` 的结合，借用前者提供构建基础（基本数据类型如整数、`if/for` 块等），而后者则创建了一种更对开发者友好的方式来利用该基础。\n\
  \n与 `C` 甚至 `C#` 相比，`Objective-C` 在某些事情的实现方式上也要松散得多。在 `C#` 中，许多功能由编译器强制执行。在 `Objective-C`\
  \ 中，许多事情并不是遵循硬性规则，而是通过约定完成的。构造函数是这种差异的极佳例子。在 `C#` 中，创建构造函数有一种单一正式的方法。在 `Objective-C`\
  \ 中，根据约定，人们在初始化器中实现等的功能。不是通过调用构造函数过程来创建对象，而是在开发者的一点帮助下（`Objective-C` 的内存管理很简单，但不是自动的）创建一个对象，然后开发者显式地调用新创建对象上的一个方法——它的初始化器之一——来执行\
  \ `C#` 开发者通常会放在构造函数中的职责。\n\n如此多通过约定完成这一事实，如果你习惯于一个由规则运行的世界，这就是 `Objective-C` 最棘手的方面之一。这种灵活性可以让你对代码拥有更多控制力，但也带来了很多责任。它让开发者负责那些在正式环境中由语法和编译器管理的事情。\n\
  \n至于 `Cocoa`，从它的名字来看并不清楚它是什么。你可能已经知道的一点是，在 `Objective-C` 的世界里无论走到哪里，你一定都会遇到 `Cocoa`。两者之间的联系很容易让你将其中一个混为一谈。\n\
  \n### 为什么这样？如果说 Objective-C 是语言，那么 Cocoa 是什么？\n\n幸运的是，由于已经学习了 `C#`（或类似 Java 的类似语言），你熟悉语言（`C#`）与其框架（`.NET`）的分离。`C#`\
  \ 外的人倾向于假设 `C#` 和 `.NET Framework` 是同一个东西。当然，`.NET Framework` 是为你的应用程序执行繁重工作的库集，而\
  \ `C#` 是你可以用来针对该框架编码的语言之一。\n\n`Objective-C` 和 `Cocoa` 有着相似的关系。`Objective-C` 是语言，而\
  \ `Cocoa` 基本上是 `Objective-C` 开发者编写应用程序的框架。\n\n`Cocoa` 之于 `Objective-C` 就像 `.NET\
  \ Framework` 之于 `C#`。\n\n在 `Objective-C` 的术语中，框架被称为 kits。当你探索各种 iPhone 框架（`UIKit`、`Game\
  \ Kit`、`Map Kit`）时，你会很快学会并记住。\n\n`Cocoa` 这个名字也被用作统术语，指代核心框架以及提供额外功能的框架。就像 `C#` 开发者可能会将\
  \ ASP.NET 项目简单地称为 .NET 项目一样，`Objective-C` 开发者可能会称为 `Cocoa` 而不是他们正在使用的特定 kit。\n\n\
  \n\n\n为了让情况变得稍微复杂，iPhone 上的 Cocoa 实际上被称为 `Cocoa Touch`。`Cocoa Touch` 是 `Cocoa` 的一个版本，专门针对\
  \ iPhone、iPod 以及最近的 iPad 的外形和功能而设计。大部分核心功能保持不变，但设计上的差异导致了依赖关系的转移，而且 Cocoa 各种工具包的桌面版本在\
  \ iPhone 上有对应的版本，但它们的名称完全不同（例如，`AppKit` 为桌面应用开发提供了大量核心支持，在 iPhone 上对应的版本被称为 `UIKit`）。\n\
  \n抛开这些差异，简单将 `Cocoa Touch` 称为 `Cocoa` 是完全可以的。对话的背景会清楚地表明讨论的不是 `Cocoa` 的桌面版本。\n\n\
  纯洁主义可能不喜欢以技术上不正确的方式使用某些术语，这引出了我们本章的下一节。\n\n## 学术方法与务实方法\n\n`MonoTouch` 是一个有趣的地方。\n\
  \n尽管 `Objective-C` 是构建在普通的 `C` 基础上的，但它的独特之处在于它是在消息传递的动态范式中实现的一层面向对象。通过 `Objective-C`，你基本上可以拿起电话，调用一个对象，对它说任何你想说的，它要么接听，要么不接。\n\
  \n另一方面，`C#` 起源时是一门静态类型语言。你不能在运行时拿起电话调用一个 `C#` 对象，告诉它你想说的任何话，然后期望它按预期方式运行。在大多数情况下，如果你能给一个\
  \ `C#` 对象拨打电话，你必须说：“按 1 下单，按 2 检查状态，按 3 取消订单，如果您想做任何其他操作，请拨打另一个对象。”功能是在编译时就已经固化了。\n\
  \n`Objective-C` 构建在 `C` 之上，并不是纯动态的。而多年来不断获取动态特性的 `C#` 也不再是纯静态的。每一者都是方法论的混合体，融合了一些这种和一些那种。\n\
  \n处于中间位置的是 `MonoTouch`。\n\n你现在可以编写静态类型代码，这让你获得了编译时错误检查的优势。一些开发者认为这是一种障碍，而另一些人则喜欢在应用交付给客户之前捕获由于拼写错误导致的简单错误。\n\
  \n尽管 `MonoTouch` 并没有苹果原生的开发技术栈那样广为人知，但 `Objective-C` 开发者倾向于在论坛、演讲、给编辑的信以及任何你可能发现这两个世界重叠的地方与\
  \ `C#`/MonoTouch` 开发者发生冲突。\n\n当争论中的情感和品牌忠诚被剥离后，通常什么都不剩。然而，在讨论技术栈及其实际技术细节的情况下，它们可以进一步精简。\n\
  \n最终，死忠的 `Objective-C` 开发者倾向于不喜欢用不属于基于消息的语言范的术语来讨论 `Objective-C`（`Smalltalk` 是 `Objective-C`\
  \ 的灵感来源，也是其中一类语言）。这是完全合理的。`Objective-C` 的工作方式与 `C#` 的工作方式存在显著差异。\n\n引起争议的一个常见差异是，当一个\
  \ `C#` 开发者说类似的话：“我有一个 `NSString` 对象，我正尝试调用它的 `intValue` 方法，但我得到了一个错误……”\n\n在 `Objective-C`\
  \ 中，人们并不“调用方法”。相反，是向对象“发送”“消息”。在运行时，如果该对象所属的类具有可以通过所发送的消息触达的方法实现，该对象实例将处理它并完成它的工作。如果一个对象（或“接收者”）不“响应”消息，意味着它没有相应的方法实现，那么该消息可能就会被忽略。\n\
  \n如果你习惯于 `C#` 等语言，并且如果那段对你来说没有太大意义，你并不孤单。开发者可能会对任何一种范式的优势进行争论，但开发者也以将自己的观点陈述为事实而闻名。\n\
  \n一个系统是否优于另一个系统最终并不重要。推测你是一个 `C#` 开发者，并且你想使用 `C#` 为 iPhone 编写应用。考虑到这一点，这里的目标不是教你用\
  \ `Objective-C` 代码，而是教你足够的知识，让你能够在脑海中解析 `Objective-C` 代码，并在阅读文档时将相关的术语“翻译”成你熟悉的术语。\n\
  \n因此，这里采用的方法是务实的，而非学术的。你有工作要完成。如果你选择出于此处未列举之外的原因继续学习这门语言，那么 `Objective-C` 背后的哲学和更深层的解释也是可用的。\n\
  \n在这种情况下，务实方法的一个方面是尝试在两种语言、它们的运行时和框架之间映射最接近的概念和术语。回到早前的例子，尽管发送消息与调用方法非常不同，但对于应用开发者来说，发送消息和调用方法基本上是同一件事。\n\
  \n## 基础语法和概念\n\n正如之前讨论的，`Objective-C` 是一套构建在 `C` 之上的面向对象功能集。因此，`Objective-C` 应用中的大部分代码尽管看起来很不同，其实都是\
  \ `C`。\n\n在这些情况下，`C#`、`Java`、`Python` 或任何其他语言已经让你熟悉了变量创建、流程控制和其他编码细节。`Objective-C`\
  \ 中的 `if` 块将是易于识别。\n\n`Objective-C` 最让你感到困惑的方面是：\n\n*   初始化与构造函数\n*   发送消息与调用方法\n\
  \n`MonoTouch` 的优点在于它很大程度上让你像往常一样编写 `C#`：\n\n*   初始化是通过构造函数实现的。\n*   你像往常一样调用方法，无需担心发送消息意味着什么（更多信息请见第\
  \ 11 章）。\n*   垃圾回收对你是隐藏的。\n\n为了阅读 `Objective-C`，你仍然需要稍微了解它的含义以及如何解析它。\n\n此时，代码是演示差异以及\
  \ `Objective-C` 概念如何映射到 `C#` 的简单方法。\n\n列表 14-1 了一段 `Objective-C`。观察它，让自己困惑，并在脑中产生问题。这将帮助你快速学会将这段代码视为\
  \ `C#`。\n\n```objc\n// 创建并初始化我们的对象\nNSString *aString = @\"Hello, World\";\nUILabel\
  \ *aLabel = [[UILabel alloc] init];\n\n// 向\"aLabel\"发送带参数的“消息”\n[aLabel setTextAlignment:UITextAlignmentLeft];\n\
  \n// 将字符串赋值给标签的 text 属性\naLabel.text = aString;\n\n// 将格式化输出到控制台，包括我们赋值给标签的 text\
  \ 属性的字符串\nNSLog(@\"The label's text: %@\", aLabel.text);\n```\n\n正如示例代码通常的情况，这段代码并没有做什么，但它确实引入了一些\
  \ `Objective-C` 的特殊之处。\n\n在我解释这里发生了什么之前，请看 列表 14-2 中 `C#`（使用 `MonoTouch`）的对应代码。\n\
  \n```csharp\n// 使用构造函数创建我们的对象\nstring aString = \"Hello, World\";\nUILabel aLabel\
  \ = new UILabel();\n\n// 赋值一个封装了 Objective-C“消息”的属性\naLabel.text = aString;\n```\n\
  \n\n\n\n```csharp\naLabel.TextAlignment = UITextAlignment.Left;\n\n// 给标签的 \"text\"\
  \ 属性分配一个字符串值\naLabel.Text = aString;\n\n// 向控制台打印格式化输出，包含\n// 我们分配给标签 \"text\" 属性的字符串\n\
  Console.WriteLine(\"The label's text: {0}\", aLabel.Text);\n```\n\n这些示例非常简单，并没有展示出\
  \ MonoTouch 的许多优势，但它们足够为你提供一个基础，让你据此对 Objective-C 进行心理解析。\n\n## 初始化\n\n来自列表 14-1\
  \ 的这一行是 Objective-C 中的字符串初始化：\n\n```objectivec\nNSString *aString = @\"Hello, World\"\
  ;\n```\n\n这是来自列表 14-2 的 C# 版本：\n\n```csharp\nstring aString = \"Hello, World\";\n\
  ```\n\n数据类型 `NSString` 和 `string`（“string” 是 C# 中引用 `System.String` 的快捷方式）在功能上是等的。由于字符串在应用程序中使用频率很高，它们在对象构造方面都受到了特殊处理。\n\
  \n在 Objective-C 版本中，你声明变量的类型（`NSString`），然后给它分配字符串值。不需要手动分配内存，也不需要调用构造函数，就像 C# 一样。\n\
  \n在 Objective-C 中，字符串字面量始终采用 `@\"字符串内容.\"` 的格式。`@` 符号表示这是一个编译器指令，所有的指令都以 `@` 符号开头。这些指令的目的是通知编译器必须为你完成一些工作。在这种情况下，这项工作是处理字符串字面量的便利快捷方式。`@`\
  \ 符号并非专门用于此目的（正如你在向控制台输出字符串值的行的字符串格式化部分看到的那样），但在字符串字面量之外，单词前的 `@` 符号表示编译器必须介入并帮助。它主要用于为你处理繁琐的工作（没人想再次反复手动创建字符串对象）。\n\
  \n`*` 符号表示你正在创建的变量是指向存储对象的内存位置的指针。在功能上，你可以将其认为是 C# 中的普通对象。从未处理过指针的开发者往往会害怕它们，但由于你在阅读这段代码而不是编写它，不要让\
  \ `*` 吓到你。\n\n在 C# 版本中，仅凭引号就充了快捷方式。C# 编译器“知道”在这里应该做什么。你不需要添加 `*`，因为你不需要告诉 C# 你的变量最终是存储对象的内存的引用。这是被所理解的。\n\
  \n下一行（在后续代码段中重复出现）带你直接进入构造函数和初始化器的区别。它还展示了“发送消息”与“调用方法”之间的语法差异。\n\n```objectivec\n\
  UILabel *aLabel = [[UILabel alloc] init];\n```\n\n这样的代码在 Objective-C 中随处可见。\n\n\
  你声明变量及其类型，就像你在 C# 中做的那样。巨大不同之处在于赋值运算符（`=`）另一侧的代码。\n\n你没有使用 `new` 来创建对象。内存分配和对象创建发生在你向\
  \ `UILabel` 类“发送” `alloc` “消息”时。在链条的某处，Objective-C 运行时为你的对象留出内存并返回指向该对象空间的指针。\n\n\
  由于 Objective-C 的语法（稍后会提到），这看起来令人困惑，但在收到新创建对象的指针后，你向它发送 `init` 消息。如前，`init` 是 Objective-C\
  \ 的约定，用于执行你通常在 C# 构造函数中处理的职责。Objective-C 类可能有许多初始化器，它们根据每个可能包含的特殊集合而命名不同。在 C# 中，你会创建多个构造函数，每个构造函数包含不同的参数集以完成相同的工作。示例如所示。\n\
  \n如果你有一个如下定义的 C# 构造函数：\n\n```csharp\npublic MyClass(string theString)\n```\n\n那么在\
  \ Objective-C 中它看起来像：\n\n```objectivec\n-(id)initWithString: (NSString *)theString;\n\
  ```\n\n对于 C# 中带有额外变量的构造函数，它看起来像：\n\n```csharp\npublic MyClass(string theString,\
  \ DateTime theDate)\n```\n\n在 Objective-C 中，它看起来像：\n\n```objectivec\n-(id)initWithStringAndDate:\
  \ (NSString *)theString date:(NSDate *)theDate;\n```\n\n## 消息与方法\n\n回到 Objective-C\
  \ 语法中对你来说最陌生的部分，看看方括号（`[...]`）。\n\n由于 Objective-C 是构建在 C 之上的，而且因为点符号（在 C# 中用于各种用途，包括访问对象的成员）已经用于\
  \ C 来访问结构体的值，因此需要做一些处理来告诉编译器你正在使用 Objective-C 对象，并且你需要它为你做某些操作。\n\n方括号就是区分这些代码的。通用格式为\
  \ `[变量名 要发送的消息];`。\n\n当编译器看到方括号时，它知道你正在使用 Objective-C 对象并且你需要它执行某些操作。\n\n\n\n\n\
  以下是对应的 C# 等效代码（尽管 MonoTouch 绑定将 `setTextAlignment:` 消息封装在一个属性中，但为了本示例，你将假装它是被绑定为一个方法的）。\n\
  \n```csharp\n// 在 \"aLabel\" 对象上调用 SetTextAlignment 方法并传入一个参数\naLabel.SetTextAlignment(UITextAlignment.Left);\n\
  ```\n\n一个重要的区别是，在 Objective-C 中，紧跟参数之前的冒号是消息名称的一部分。如果一个 Objective-C 消息可以接受参数，那么在输入消息名称时，必须包含该冒号。Objective-C\
  \ 的某些动态功能允许你在运行时选择要发送给接收者的消息。如果你利用这一动态功能的方法需要先通知运行时消息名称（通常以字符串值形式提供），如果该消息接收参数，你必须在末尾加上冒号。因此，冒号是方法签名的一部分。\n\
  \n![note.ai](img/note_fmt.gif)\n\n如果没有这个冒号，Objective-C 运行时将不知道你正在调用的消息接收一个参数，结果通常是一个难以追踪的错误。这个规则很容易被忘记，所以请尽力将其刻在脑海中。\n\
  \n接下来，Objective-C 中为属性赋值和从属性值的语法与 C# 足够相似，无需解释。这是 Objective-C 中唯一使用点符号（dot-notation）的地方，因此很容易识别。唯一需要注意的是，涉及的操作是针对\
  \ Objective-C 对象还是 C 结构体（struct）。通常这不会产生太大问题，因为从上下文可以清楚看出是哪一个。例如，如果你访问标签的 text 属性，你显然是在处理一个\
  \ Objective-C 对象。C 结构体严格作为数据模型运行；它们没有方法。在示例代码中，`aLabel` 被发送了消息，所以你可以看到它不是一个结构体。在\
  \ Objective-C 2.0 中，增加了属性值的点符号表示，因此你现在不再写：\n\n```objectivec\n[label setText:aString];\n\
  ```\n\n而是可以直接写：\n\n```objectivec\nlabel.Text = aString;\n```\n\n另一个线索是，由于标签是常见的\
  \ UI 组件，而且大多数 iPhone 应用 UI 都是使用基于 Objective-C 的 `UIKit`  创建的，你可以推断出 `aLabel` 是一个\
  \ Objective-C 对象。\n\nObjective-C 示例的最后一行显示了 C 和 Objective-C 可以混合使用的地方。`NSLog` 在括号内接收参数，因此它是一个普通的\
  \ C 函数。但由于它是专门为 Objective-C 编写的函数，它“知道”如何处理它所接收的 Objective-C 对象和值。作为一个正在学习阅读 Objective-C\
  \ 的 MonoTouch 开发者，你不需要担心这是如何实现的。尽管如此，对 Objective-C 和 C 如何这样共存有一定的了解并无坏处。简单来说，Objective-C\
  \ 运行时是用 C 编写的库。任何你可以用 Objective-C 语法完成的事情，你也可以通过直接针对 Objective-C 运行时库编码来实现。这既枯燥又麻烦，很少有应用开发者需要这样做，但这就是他们会做的方式。\n\
  \n## 内存管理\n\nObjective-C 最可能让你最初困惑的最后一个方面是它的内存管理。\n\n基于引用计数（reference-counting），Objective-C\
  \ 的内存管理方法让开发者对对象何时创建和何时销毁拥有了大量的控制权和责任。在桌面端，Objective-C 支持垃圾回收（从 Objective-C 2.0\
  \ 开始）。然而，这种功能在 iPhone 上是不可用的。这是 MonoTouch 为我们做的许多事情之一。虽然与其他非 GC 内存管理方法相比，引用计数非常简单，但它仍然要求开发者在用\
  \ Objective-C 编写 iPhone 应用时保持谨慎且极有条理。\n\n如果你曾经用过某个 iPhone 应用几分钟后它就崩溃了，那很可能是因为开发者没有足够关注内存，导致泄漏引发了系统资源耗尽。这种情况会促使操作系统在接管所有资源并导致设备停止之前关闭应用程序，并且可能需要重启。这就是崩溃的原因。\n\
  \n作为一名 MonoTouch 开发者，你很幸运，因为你通常可以安全地忽略在你正在阅读的 Objective-C 源码中看到的任何引用计数。以下是涉及引用计数的消息列表：\n\
  \n*   `retain`\n*   `release`\n*   `autorelease`\n\n当你看到这些消息时，在脑中翻译为 C# 时，尽管随意忽略它们。\n\
  \n从实现方面来说，引用计数并没有因为有了 MonoTouch 就消失，但因为 MonoTouch 为你处理了它，你可以跳过这三个消息并继续无忧地进行心理解析。\n\
  \n在某些情况下，你确实需要意识到特定的 Objective-C 代码块中是如何处理内存的，但目前，为这些负担几乎完全从你肩上卸下而感到高兴吧。\n\n顺带提一下，由于\
  \ MonoTouch 的所做，你应用中的 Bug 数量以及用户可能遇到的崩溃次数会大大减少。即使是经验丰富的专家 Objective-C 开发者也经常会在内存管理方面出错。\n\
  \n\n\n\n| 特性 (Attributes) | N/A | 在 C# 中，特性（attributes）用于提供有关类的元数据。在 Objective-C\
  \ 中，特性专门应用于属性（properties）。它们为编译器提供了有关如何生成属性的信息（例如它应该被视为值类型、引用类型等）。 |\n| 分类 (Categories)\
  \ | 扩展方法 | 使用上几乎相同。你可能还会遇到“分类方法”（category method）这一术语。Objective-C 中的“categories”词通常指的是一组“分类方法”。还要注意，惯例是将类别定义在遵循\
  \ `ExtendedType+CategoryName.h/.m` 命名规范的文件中。对于 `NSString`，你可能会看到 `NSString+JSONParsing.h/.m`。`+`\
  \ 之后的是描述该分类方法用途的短名称。在这种情况下，你应该预期该类别为 `NSString` 添加用于解析 JSON 的方法。不过，这并不总是如此清晰，因为某些开发者比其他开发者更擅长描述性命名。\
  \ |\n| “遵循…” (Conforms to…) | “实现接口…” (Implements interface…) | 在 C# 中，我们说一个类实现了一个接口。在\
  \ Objective-C 中，接口被称为协议（protocols），类被认为“遵循”（conform）一个协议。因此，如果一个 Objective-C 类“遵循\
  \ XYZ 协议”，基本上等同于说一个 C# 类“实现了 XYZ 接口”。 |\n| 代理 (Delegates) | 事件 (Events) | 许多 Objective-C\
  \ 类型都有名为“delegate”的属性，其中分配了一个协议（C# 中的接口）的实现。该实现可以存在于当前类中（`someObject.delegate =\
  \ self`），也可以完全位于另一个对象中。从功能上讲，Objective-C 代理实现了在 C# 中应为事件的方法。在合理的情况下，MonoTouch 将某些\
  \ Objective-C 代理绑定为 C# 事件，这让 C# 开发者的体验感觉更加自然。 |\n| 接口 (Interfaces) | 类定义 (Class\
  \ definition) | 在 Objective-C 中，接口（参见 表 14-2 中的 `@interface`）指定了类名、父类、它实现的协议（C#\
  \ 中的接口）、本地实例变量、方法定义和属性。它位于类的头文件中。在 C# 中，类定义和它的实现是同一个。 |\n| 消息 (Messages) | 方法 (Methods)\
  \ | 在任何讨论“消息”的地方，都可以安全地将它们视为 C# 方法。尽管存在差异，但为了阅读 Objective-C，你通常不需要考虑这些差异即可。 |\n\
  | 属性 (Properties) | 属性 (Properties) | 虽然 Objective-C 和 C# 之间的属性非常相似，但它们的目的可能完全不同。在\
  \ Objective-C 中，属性不仅为本地实例变量生成 getter 和 setter，还可以处理 Objective-C 的一些重复性性工作，例如引用计数。因为\
  \ C# 是垃圾回收的，而且因为 MonoTouch 为我们处理了引用计数，所以 Objective-C 属性实现的细节对 C# 开发者来说并不重要。需要记住的一点是，Objective-C\
  \ 属性始终通过“self”（等同于 C# 的“this”）进行访问。这也是 Objective-C 使用点符号表示法（`self.propertyName =\
  \ someVariable`）的唯一地方。 |\n| 协议 (Protocols) | 接口 (Interfaces) | Objective-C 协议与 C#\
  \ 接口非常相似，但有一个重要的例外：Objective-C 协议可以被部分实现。从 Objective-C 2.0 开始，开发者现在可以指定某个方法是要求的（参见\
  \ 表 14-2 中的 `@optional` 和 `@required`）。然而，传统上，Objective-C 协议不需要完整实现。 |\n| 接收者 (Receivers)\
  \ | 对象实例 | 在 Objective-C 中，你“发送消息”，这些消息发送到“接收者”。在 C# 中，你是在“对象”上“调用方法”。 |\n| 选择器\
  \ (Selectors) | 方法 (Methods) | 与消息一样，C# 开发者可以安全地将选择器视为方法。在处理 Objective-C 运行时，这种区别变得变得重要。有关更多信息，请参见第\
  \ 11 章“创建 MonoTouch 绑定”。 |\n\n### 编译器指令 (Compiler Directives)\n\n正如在“基础语法和概念”部分讨论过的，以\
  \ `@` 符号开头的编译器指令告诉编译器有工作需要要做。\n\n有时，编译器指令旨在替换代码，如果这些代码是由开发者编写的，无论编写的是哪个应用，它们或或少都是相同的。列出的第一个指令——针对字符串字面量的——就是一个很好的例子。字符串在应用开发中经常被使用，开发者不应该编写代码来手动实例化字符串（除非有特定原因，对于字符串来说，通常不是如此）。因此，`@\"\
  \"` 指令让开发者从编写那些重复代码中解放出来。\n\n在其他情况下，编译器指令可以提供元数据。它们可以代表编写起来非常麻烦的代码，而编译器可以安全地为你这些代码。\n\
  \n无论它们执行什么函数，它们都是在编译时起作用的指令。表 14-2 包含了这些编译器指令。\n\n#### 表 14-2： Objective-C 和 C#\
  \ 中的编译器指令\n\n![](img/table1402a.gif) ![](img/table1402b.gif) ![](img/table1402c.gif)\n\
  \n### 数据类型 (Data Types)\n\n在大多数情况下，Objective-C 类型的 C# 等价物可以通过名称或上下文推断出来。当你遇到没有对应项的\
  \ Objective-C 类型时，情况就会变得复杂。表 14-3 用于这些情况。\n\n#### 表 14-3： Objective-C 和 C# 中的未知类型\n\
  \n| Objective-C | C# | 说明（如果需要） |\n| --- | --- | --- |\n| `BOOL` | `bool` | |\n\
  | `IBAction` | 无 | 用于 Interface Builder 将 UI 组件事件连接到 Objective-C 方法。 |\n| `IBOutlet`\
  \ | 无 | 用于 Interface Builder 将 UI 组件连接到本地实例变量。 |\n| `id` | `var/object` | 随处可用的通用指针。\
  \ |\n| `nil` | `null` | |\n| `NO` | `false` | |\n| `YES` | `true` | |\n\n### 总结\
  \ (Summary)\n\nObjective-C 对于阅读和学习各种 Objective-C 文章和书籍非常有帮助。虽然完全没有学习 Objective-C，但对于理解基于\
  \ Objective-C 的 iPhone SDK 以及 Apple 提供的文档是关键。这让你能够快速将 Objective-C 示例代码转换为 C#。\n\n\
  # App Store：提交和营销你的应用\n\n## 本章内容\n\n*   准备提交应用\n*   提交你的应用\n*   推广并从应用中盈利\n\n在经历了大量的线框图、设计、开发和测试之后，你终于可以与世界分享你的应用了。本章将讨论有关\
  \ App Store 的一切。首先，它讨论了在提交之前需要经过的过程——包括使用 Ad-Hoc 构建进行最终测试以及提交前的检查列表。接下来它介绍了如何实际提交到\
  \ App Store，以及在应用进入 App Store 后该做什么。本章还触及了其他的变现策略，例如广告或应用内购买。\n\n\n\n\n\n现在，大多数人手头并没有整套\
  \ iDevices。这时 Ad-Hoc（内部）构建就派上用场了。Ad-Hoc 构建允许你将应用发送给最多 100 个人，让他们在自己的设备上安装。如果可能，请尝试寻找各种设备来测试你的应用，至少要在\
  \ iPhone 和 iPod Touch 上进行测试；但如果你能联系到更多，尽量确保目前发布的每代 iDevices 至少都有一个。\n\n当我尝试寻找用户来测试我的\
  \ Ad-Hoc 构建时，我第一个查看的地方是我的 Twitter 或 Facebook 朋友。如果你在这些服务上拥有相当规模的人脉，很有可能在这些人中找到几种类型的\
  \ iDevices。因此，我通常会发送信息请求志愿者帮助我进行测试。人们通常非常乐意帮助；他们喜欢在软件进入 App Store 之前就用上的那种感觉，这让他们觉得自己很特别。此外，去一些\
  \ iPhone 开发者论坛看看，我最喜欢的是 [`iphonedevsdk.com/forum/`](http://iphonedevsdk.com/forum/)。许多此类论坛都有专门板块，人们可以在那里请求或自愿成为\
  \ Ad-Hoc 测试员。如果你在寻找可以面对面交流并反馈的本地人员，可以尝试 Craigslist。另一个寻找本地测试员的极佳资源是 Tweetups。这些是通过\
  \ Twitter 组织的聚会。里面通常充满了精通技术的人士，他们非常愿意加入并帮助某个项目。\n\n然而，在让别人测试你的应用之前，你需要他们的 `UDID`（唯一设备标识符）。每个\
  \ iPhone 或 iPod Touch 都有有一串字母和数字，对每个设备都是唯一的。`UDID` 的示例可能像这样：`7bkls09tqep3674lp0747hxzp4d9k301nf523jh7`。我确定你奇怪为什么安装程序需要\
  \ `UDID` —— 这是因为 Apple 要求只有经过 App Store 审核的应用才能安装在 iPhone/iPod Touch 上。通过提供 `UDID`，Apple\
  \ 即可授权应用在特定设备上运行。这是 Apple 允许进行测试的方法，而无需批准你应用的每一个版本。\n\n## 如何从测试者处获取 UDID\n\n你可以通过两种方式轻松地从测试者那里获取\
  \ `UDID`。\n\n最简单的方法让他们指向 Erica Sudan 的免费 Ad Hoc Helper 应用（[`appsto.re/adhochelper`](http://appsto.re/adhochelper)）。你的测试者可以安装此应用，一旦运行，就会弹出一个组合邮件对话框，邮件正文中包含他们的\
  \ `UDID`。给他们一个用于发送 `UDID` 的电子邮件地址，他们就完成了。\n\n另一种获取 `UDID` 的方法是使用 iTunes。\n\n1. 指示你的测试者打开\
  \ iTunes 并连接手机（查看图 15-1）。\n\nFigure 15-1\n\n![f1501.tif](img/f1501_fmt.jpg)\n\n\
  2. 引导他们点击右侧面板中的 `Summary`（摘要）标签页。该标签页包含有关他们手机的信息，如名称、容量、软件版本、序列号和电话号码。\n\n3. 当他们点击序列号时，就会显示其设备的\
  \ `UDID`（查看图 15-2）。\n\nFigure 15-2\n\n![f1502.tif](img/f1502_fmt.jpg)\n\n4. 他们现在可以通过选择\
  \ `Edit ⇒ Copy`（编辑 ⇒ 复制）将 `UDID` 复制到剪贴板（查看图 15-3）。\n\nFigure 15-3\n\n![f1503.tif](img/f1503_fmt.jpg)\n\
  \n5. 现在他们可以将其粘贴到电子邮件中或使用联系表单将 `UDID` 给你。\n\n## 创建 Ad-Hoc 配置文件 (Provisioning Profiles)\n\
  \n现在你已经从用户那里收集了 `UDID`，你需要登录 iPhone Dev Center ([`developer.apple.com/iphone`](http://developer.apple.com/iphone))。到达后，导航到\
  \ `Devices`（设备）并选择 `Add Device`（添加设备）。查看图 15-4）。\n\nFigure 15-4\n\n![f1504.tif](img/f1504_fmt.jpg)\n\
  \n在 `Device Name`（设备名称）下添加测试者的姓名（这仅供你个人参考）。在 `Device ID`（设备 ID）下输入该用户的 `UDID`。如果你需要添加更多用户，点击加号；完成后点击提交（注：此处原文此处似乎漏掉了\
  \ If you need to add more users，已根据语境补全或按原文意译处理，此处原文为：Under `Device ID` input the\
  \ `UDID` for that user. If you need to add [users]...）。 \n\n*修正：原文此处为 \"Under Device\
  \ ID input the UDID for that user. If you need to add\" 后面在原文似乎有截断，按逻辑翻译为：*\n在 `Device\
  \ ID` 下输入该用户的 `UDID`。如果你需要添加……（此处原文不完整）。\n\n在 `Device Name` 下添加测试者的姓名（这仅供你个人参考）。在\
  \ `Device ID` 下输入该用户的 `UDID`。如果你需要添加……（注：原文在此处确实存在截断，翻译按逻辑尽可能还原）。\n\n此处：在 Apple\
  \ 开发者中心的操作。\n\n完成后点击提交。\n\n制作 Ad-Hoc 配置文件的最后一步是创建配置文件。在 iPhone 开发者中心导航到 `Provisioning\
  \ ⇒ Distribution`，点击 `New`（新建），并选择 `AdHoc`。在 `Profile Name` 中输入你的应用名称。选择希望在此运行的所有设备，完成后点击“提交”。\n\
  \n## 构建应用的 Ad-Hoc 版本\n\n你需要为应用创建一个与你创建的配置文件配合的特殊版本。\n\n### 添加新的 Ad-Hoc 配置\n\n在制作\
  \ Ad-Hoc 构建之前，你需要为分发添加一个新的发布配置。你必须对解决方案中的每个项目都执行此操作。\n\n从菜单选择 `Project ⇒ Solution\
  \ Options`，将弹出 `Solution Options` 对话框。选择 `Configurations` 面板并点击 `Add` 按钮。在 `New\
  \ Configuration` 对话框中为配置命名，例如 `AdHoc`，并确保 `Platform` 字段设置为 `iPhone`。\n\n![note.ai](img/note.ai)\n\
  \n为了节省对解决方案中每个项目执行此操作的时间，只需勾选 `Create configurations for all solution items`。\n\n\
  ### 修改配置的签名选项\n\n一种差异方法是通过选择 `File ⇒ New ⇒ File ⇒ iPhone ⇒ iPhone Entitlements`\
  \ 为你的项目添加一个新的 `Entitlements.plist` 文件。然后，你需要打开 `Entitlements.plist` 并禁用 `get-tasks-allow`\
  \ 权限。这会阻止调试器附加到你的应用程序，这是 Ad-Hoc 分发的要求的。\n\n### 检查 Bundle 设置\n\n在实际构建应用之前，你需要检查 Bundle\
  \ 设置，以确保它们对于该应用是正确的。操作如下：\n\n1. 选择 `iPhone Application` 面板。\n\n\n\n\n2. 在此界面，您需要确保已设置了显示名称和版本号，并且包标识符（bundle\
  \ identifier）与描述文件（provisioning profile）中的包标识符匹配。您还在此屏幕上指定了 `57x57` 的应用图标。\n\n3.\
  \ 现在，您需要切换到 iPhone 构建签名（Build Signing）面板，并将您上一步中创建的 `Entitlements.plist` 文件添加到代码签名选项中的“自定义权限”（Custom\
  \ Entitlements）字段中。请确保仅对 `Ad-Hoc` 分发配置执行此操作。\n\n# 构建项目\n\n完成上述步骤后，你现在可以继续进行你的 `Ad-Hoc`\
  \ 构建了。在 `MonoDevelop` 中启动构建过程之前，将你的活动构建配置切换到你之前设置的新描述文件（`AdHoc`）。\n\n然后构建项目。你可以通过进入项目文件夹\
  \ `/bin`（默认位置）或你为 `Ad-Hoc` 配置指定的输出位置来找到构建包。这将显示在 `MonoDevelop` 的“输出（Output）”窗格中。你需要将\
  \ app 和你创建的 `Ad-Hoc` 描述文件一起发送给任何想要测试此应用的人。\n\n# 打包你的 Ad-Hoc 构建\n\n你已经准备好了 `Ad-Hoc`\
  \ 构建；现在你需要实际将其交付给你的测试者。你的测试者将需要 app 和你的 `Ad-Hoc` 描述文件。你有两个选项：你可以为应用制作一个 `.ipa` 文件，由\
  \ `iTunes` 处理解压；或者你可以为应用制作一个 `.zip` 文件。\n\n![note.ai](img/note_fmt.gif)\n\n如果你的测试者使用的是\
  \ Windows 机器，那么包含一个 `.ipa` 文件是首选方法，因为 `iTunes` 会处理解压缩。\n\n## .zip 方法\n\n如果你选择了 `.zip`\
  \ 方法，你需要向测试者发送以下内容：压缩在 `.zip` 文件中的 `YourApp.app`，以及名为 `YourApp_AdHoc_Provisioning_Profile.mobileprovision`\
  \ 的文件。\n\n我通常通过电子邮件将这两个文件发送给测试者。但请注意，某些电子邮件提供商可能不允许你发送 `AppName.zip`，因为它包含二进制文件。如果是这种情况，请将你的文件上传到\
  \ FTP 服务器并向测试者发送链接。安装 `Ad-Hoc` 构建与安装普通的 iPhone 应用非常相似。\n\n1. 如果你在电子邮件中拥有 `.zip`\
  \ 和 `.mobileprovision` 文件，请将它们保存到方便的位置，例如桌面。\n\n2. 将 `.mobileprovision` 文件拖放到 `iTunes`\
  \ 中的 `Library ⇒ Applications`。在 Mac 上，你只需将其拖到 dock 栏上的 `iTunes` 图标即可（图 15-5 在 Windows\
  \ 中显示了这一操作）。\n\n#图 15-5\n\n![f1505.tif](img/f1505_fmt.jpg)\n\n3. 解压 `.zip` 文件。要执行此操作，右键点击\
  \ `.zip` 文件并选择“解压所有...”（参见图 15-6）。按照向导步骤操作并点击“下一步”接受默认设置。Windows Vista 用户：内置的“解压所有...”命令会损坏应用程序导致其无法安装。你应该尝试使用不同的\
  \ zip 程序（如 `WinZip` 或 `WinRar`）来解压 zip 文件。\n\n#图 15-6\n\n![f1506.tif](img/f1506_fmt.jpg)\n\
  \n4. 找到 `.app` 文件夹（通常为 `AppName.app`）（参见图 15-7）。\n\n#图 15-7\n\n![f1507.tif](img/f1507_fmt.jpg)\n\
  \n5. 将整个 `.app` 文件夹拖放到 `iTunes` 中的 `Library ⇒ Applications`。在 Mac 上，你只需将其拖到 dock\
  \ 栏上的 `iTunes` 图标上（参考图 15-5）。\n\n6. 验证应用程序是否显示在 `Library ⇒ Applications` 中。注意，它将没有正常的图标（参见图\
  \ 15-8）。\n\n#图 15-8\n\n![f1508.tif](img/f1508_fmt.jpg)\n\n7. 在 `iTunes` 中，在“设备（Devices）”下选择你的设备，选择“应用程序（Application）”选项卡，并确保勾选了新应用程序（参见图\
  \ 15-9）。\n\n#图 15-9\n\n![f1509.tif](img/f1509_fmt.jpg)\n\n\n\n\n# 检查 Bundle 设置\n\
  \n在实际构建应用程序之前，你需要检查 Bundle 设置，以确保它们对于此应用是正确的。要为此操作，请选择 iPhone 应用（iPhone Application）窗格。在这里，请确保你已经设置了显示名称（display\
  \ name）和版本号，并且束标识符（bundle identifier）与配置文件（provisioning profile）中的束标识符匹配。你还需要在此屏幕上指定你的\
  \ 57x57 应用图标。\n\n# 构建项目\n\n完成上述步骤后，你现在可以进行发布构建了。在 MonoDevelop 中开始构建过程之前，将你的活动构建配置切换到你之前设置的新配置文件（Distribution）。\n\
  \n然后构建项目。你可以通过进入项目文件夹 `/bin` 找到构建包。你只需要向 Apple 提交压缩在 `.zip` 文件中的应用程序即可。\n\n![note.ai](img/note_fmt.gif)\n\
  \n再次强调一下，应用程序可能位于 `/bin` 文件夹以外的其他地方：它位于你决定存放的地方，显示在项目选项的输出（Output）窗格中。\n\n# 提交前清单\n\
  \n以下清单涵盖了你在提交应用之前需要处理的基本步骤。\n\n1. 完成所有 Ad-Hoc 测试。\n2. 在 Xcode 应用中，这里是你需要确保更新应用中\
  \ `Info.plist` 文件的地方。幸运的是，MonoDevelop 会根据你在应用程序包（Application Bundle）和应用签名（Application\
  \ Signing）窗格中填写的的信息为你处理好这一切。\n3. 将束标识符（如果你尚未设置）设置为 `YourAppName`。该标识符不应包含空格或特殊字符——字母、数字和连字符是允许的。\n\
  4. 如果你想让应用在实际设备上的名称与在 MonoDevelop 中的名称不同，请同时更改束显示名称（Bundle Display Name）。\n5. 更新束版本（bundle\
  \ version）。如果这是你第一次提交此应用，版本号可能应该是 `1.0`。\n6. 确保图标文件已设置（这应该是一个 57x57 的 `.png` 文件）。\n\
  7. 为你的应用编写 App Store 描述。应用上传页面显示描述应在 700 个字符以内，但该限制似乎并没有被强制执行。\n8. 为你的应用选择一个数字 SKU。这不能留空，并且对于你的每个应用必须是一个唯一的数字。（我通常使用\
  \ `YYMM`，例如 `0902`，但你可以使用任何数字，只要它是数字即可。）\n9. 整理你的截图。你至少需要一张主截图，最多还需要四张辅助截图。确保它们的尺寸正确（竖屏\
  \ 320x480 或横屏 320x460）。\n10. 准备你的 iTunes 艺术设计。这是一个 512x512 像素、72dpi 的 JPEG。它应该与你的图标艺术设计尽可能匹配——如果这两个图像不相似，应用有时会被拒绝。\n\
  \n# 通过 iTunes Connect 提交\n\n现在你已经过完了提交前清单并处理了所有事项，你可以准备好通过 iTunes Connect 提交应用了。当你登录\
  \ `developer.apple.com/iphone` 时，右侧有一个指向 iTunes Connect 的链接。登录 iTunes Connect 后，点击“管理您的应用程序”（Manage\
  \ Your Applications），然后“添加新应用程序”（Add New Application）。\n\n应用信息页面要求提供应用名称、描述、版权信息、版本号、SKU、应用\
  \ URL、支持 URL 以及支持电子邮件地址（这些都是必填的）。你输入的 URL 翻译如下：\n\n| iTunes Connect 的称法： | 在 iTunes\
  \ 的 应用页面上的显示内容： |\n| --- | --- |\n| Application URL | 公司名称网站 (Company Name Web Site)\
  \ |\n| Support URL | 应用支持 (Appname Support) |\n\n如果这是你第一次向 App Store 上传应用，并且你是以个人开发者身份注册的，系统会询问你想要设置公司名称（Company\
  \ Name）。请仔细考虑——一旦设置，你无法在不拨打 Apple 并通过其电话支持热线的情况下更改。如果你设置了公司名称，你所有的应用都将显示它。\n\n应用上传页面是你上传商品的地方：你的应用（编译后的二进制文件的\
  \ `.zip` 文件）、iTunes 艺术设计 JPG 以及你的主、辅助截图。在上传辅助截图时，你应该按照你希望它们在 App Store 中出现的反向顺序进行上传。例如，如果你有命名为\
  \ `ss1.jpg`、`ss2.jpg`、`ss3.jpg` 和 `ss4.jpg` 的截图，你输入 `ss1.jpg` 作为主截图，然后（一次一个）将 `ss4.jpg`、`ss3.jpg`\
  \ 和 `ss2.jpg` 添加到辅助截图字段中。\n\n你还需要在上传页面提供以下信息：\n\n*   分级（Ratings）：你会被要求通过指示应用是否包含任何攻击性内容来为你的应用评分。\n\
  *   价格和可用性（Pricing and availability）：这是你设置应用的价格和发布日期的地方。在选择定价层级后，你将有机会审核此内容。页面应该显示指向定价层级的链接，但如果最初没有显示，只需将价格设置为任意值并让它刷新。此时链接应该会出现。Apple\
  \ 提供的定价层级如下：\n    *   免费（Free）\n    *   Tier 1 — 0.99\n    *   Tier 2 — 1.99\n \
  \   *   Tier 3 — 2.99\n    *   Tier 4 — 3.99\n    *   Tier 5 — 4.99\n    *   Tier\
  \ 6 — 5.99\n    *   依此类推。\n*   发布日期（Release date）：默认为今天，但如果你喜欢，可以将其设置为未来。\n\n![note.ai](img/note_fmt.gif)\n\
  \n然而，如果你是在提交更新，在收到更新已批准的消息之前，你不应该触动发布日期。如果你将应用的发布日期设置为未来，你的当前应用将从 App Store 中消失！\n\
  \n最后你到达摘要页面，你可以在提交之前审核所有的应用信息。检查一切无误，然后点击提交（Submit）。\n\n现在你只需要等待。Apple 的审核过程可能是一个谜题；你的应用可能一周后、一个月后或永远不会通过。他们通常会发送电子邮件通知你的应用已准备就绪。（他们也会给你发邮件说“你的审核时间延长”，这意味着你的应用可能还需要几周。）\n\
  \n# 推广你的应用\n\n现在你的应用已经进入 App Store，但你的工作只完成了一半。优秀的应用不会自我推销。在 App Store 中获得关注本身就是一项工作。本节介绍了一些帮助你的应用脱颖而出的方法。\n\
  \n# 支持你的应用推广\n\n当你发布应用时，需要一些支持：\n\n*   网站和博客\n*   Twitter 账号\n*   Facebook 粉丝页\n\
  *   YouTube 频道\n\n接下来的章节将简要讨论如何以有效的方式设置这些支持，为你管理应用推广提供最佳平台。\n\n\n\n\n\n使用来自 Atebites\
  \ ([`bit.ly/SimFinger`](http://bit.ly/SimFinger)) 的强大 `SimFinger` 工具来创建一个展示你应用运行情况的录屏。你不仅可以将其发布在自己的网站上，还可以分发到视频分享网站。这可以增加你的曝光率，也有助于搜索引擎排名。\n\
  \n## 你的 Twitter 账户\n\n与用户保持密切联系可能是获得好评和口碑推荐的关键。如今大众传播的首选武器似乎是 Twitter，因此请确保在你的网站显著位置显示你的\
  \ Twitter 账户。使用你的 `Twitter` 账户收集用户反馈、保持用户更新、举办活动，以及纯粹享受乐趣。你不希望你的 `Twitter` 账户仅仅是博客的动态源；你需要与用户互动并参与对话。如果你没有关于你自己、你的应用或未来计划的内容可以分享，请寻找可能与你的应用相关或符合你应用关注的细分领域的内容。通过提供这些内容，你可能会吸引新的粉丝，他们可能会转化为新客户。你应该尝试阅读并在可能的情况下回答任何与你的应用相关的推文。做这一点不仅要查看\
  \ `Twitter` 上的提及（mentions）标签页，还要利用 `Twitter` 搜索查找你的应用名称、你的名字、你的公司或任何与你的应用相关的内容。\n\
  \n![note.ai](img/note_fmt.gif)\n\n你可能会遇到一些负面评论以及一些建设性的批评。如果发生这种情况，不要失去冷静；尝试缓解局势，并尽一切努力为批评者解决问题。这看起来可能有些过度，但一个不开心的客户可能会迅速变成几条推文、一篇博客文章、几个\
  \ YouTube 视频、糟糕的 App Store 评价，在你意识到之前，这些事情就会影响你的销售并最终影响你的品牌。\n\n## 你的应用 Facebook\
  \ \n\n除了 `Twitter`，`Facebook` 是另一个非常流行的社交平台，很多人不仅用它与朋友家人交流，还与其喜欢的品牌交流。为你的应用建立一个\
  \ `Facebook` 粉丝页。鼓励你的 `Twitter` 粉丝也成为粉丝。你会发现使用粉丝页就像使用你的 `Twitter` 账户一样。记住，这不仅仅是为了推销你的内容——利用这个平台与你的用户和潜在客户建立沟通渠道。\n\
  \n## YouTube 频道\n\n继续应用的社交媒体必经之路，前往 `YouTube` 为你的应用建立一个官方的 `YouTube` 频道。用它来制作教程视频、功能演示以及未来版本的预览。你的\
  \ `YouTube` 频道可能不像 `Facebook` 和 `Twitter` 那样注重与用户进行双向交流，但它同样重要，因为可以作为你应用的活销售页。随着\
  \ Google 和其他搜索引擎适应于互联网用户消耗的视频量不断增加，它们已开始将视频作为其搜索结果页的一部分，因此拥有带有你应用名称和其他相关关键词的视频很可能在这些搜索查询中获得高排名。用户也很有可能去\
  \ `YouTube` 尝试寻找关于某功能如何运作的视频。为你的应用制作教程可以帮助减少支持邮件、推文、电话或论坛帖子。\n\n## 关键应用推广技术\n\n\
  现在你已经回顾了为你的应用建立支持结构所需要的基础知识，本节将讨论一些特定的应用推广技术。\n\n### 举办活动\n\n在应用的每个版本中，你都将获得 50\
  \ 个促销码（promo codes）。这将允许你给出的任何促销码的人在 App Store 上兑换你的应用的免费副本。因此，我建议的第一要务是保留五个促销码，并在\
  \ `Twitter` 上举办一个活动，这是一个简单的活动，用户只需关注你并转发一条推广该活动的推文。活动结束时，你将促销码颁给随机粉丝或随机转发者。网站 `twitRand`\
  \ ([`twitrand.com`](http://twitrand.com)) 是选择粉丝或转发者的极佳且简单的方法。你也可以将其调整为获取更多 `Facebook`\
  \ 粉丝的活动。\n\n在送出所有 50 个促销码之前，你需要保留几个并将它们提交给应用评审网站：\n\n* [`gizmodo.com`](http://gizmodo.com)\n\
  * [`arstechnica.com/apple/iphone/apps/`](http://arstechnica.com/apple/iphone/apps/)\n\
  * [`www.macworld.com/appguide/index.html`](http://www.macworld.com/appguide/index.html)\n\
  * [`toucharcade.com`](http://toucharcade.com)\n* [`appsafari.com`](http://appsafari.com)\n\
  * [`148apps.com`](http://148apps.com)\n* [`appadvice.com`](http://appadvice.com)\n\
  * [`appcraver.com`](http://appcraver.com)\n* [`iphoneapplicationlist.com`](http://iphoneapplicationlist.com)\n\
  * [`iphonealley.com/reviews/apps/`](http://iphonealley.com/reviews/apps/)\n* [`appleiphoneschool.com\
  \ `](http://appleiphoneschool.com/%C2%A0)\n* [`appvee.com `](http://appvee.com%C2%A0)\n\
  * [`apptism.com `](http://apptism.com)\n\n### 启动公关活动\n\n许多开发者忽略了围绕他们的应用开展良好的公关活动。有几个公关网站你可以在那里撰写新闻稿并一键将其分发到成百上千个网站。博客、杂志、报纸——它们都需要内容来尝试吸引读者访问他们的网站，所以让让他们报道关于你的应用变得容易。在你的公关稿中包含指向你网站的链接，以及指向媒体包的直接链接，在其中你可以准备好网络和打印的应用\
  \ Logo 和截图。\n\n### 使用应用内广告\n\n应用内广告也是推广应用的极佳方法。许多移动广告网络提供精确的受众定位，包括年龄、性别、地理、类别、运营商、设备和手机。定价模式包括按点击付费和按交互付费。转化跟踪和报告是标准功能。通过使用受众定位，你可以确保触达的是更有可能查看你应用的人。大多数供应商也允许选择按点击付费或按交互付费。\n\
  \n\n\n\n\n# 通过社交媒体网站进行营销\n\n你不仅可以自己利用社交媒体推广你的 App，还可以利用它来众包你的 App 的营销和推广。在“关于”或设置视图中使用“告诉给朋友”（Tell-A-Friend）功能可能是最好的推销工具。当有人向朋友或家人推荐某个产品时，他们购买该物品的概率比看到广告或广告要高。我喜欢为用户提供几种分享这些信息的方式。首先，我实现了通过电子邮件和短信分享给朋友；这允许我利用他们的联系人立即分享他们新喜爱的\
  \ App。你为他们做得越方便，他们就越可能使用。接下来是社交媒体的巨头——是的，你猜对了——`Facebook` 和 `Twitter`。在 `App Store`\
  \ 中包含几段预写的简介和指向你 App 的短链接，或者留出空间让他们写自己的内容。\n\n## 总结\n\n本章探讨了让你的 App 在终端用户手机上运行的最后一个流程。记住在多种真实设备上进行测试的重要性；这将帮助你避免任何技术性的拒绝。如果你的\
  \ App 在真实设备上的表现不正常，Apple 会迅速拒绝它。\n\n推广是你的 App 的关键，确保使用社交媒体和评论网站来最大化你的曝光率。在你的 App\
  \ 内部包含让用户联系的方式；他们告诉朋友越容易，他们就越可能这样做。免费 App 也可以变现；广告甚至赞助都是让免费 App 变现的好方法。\n\n## 索引\n\
