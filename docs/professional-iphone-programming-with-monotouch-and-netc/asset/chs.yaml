  ## 关于作者\n\n![ffirsg01.tif](img/ffirsg01_fmt.jpg)\n\nWallace B. (Wally) McClure 于\
  \ 1990 年毕业于佐治亚理工学院（Georgia Tech），获得电气工程学士学位。他在那里继续深造，于 1991 年获得了相同领域的硕士学位。从那时起，他一直为教育部、可口可乐、贝德尔国际、Magnatron\
  \ 和光纤科技等公司提供咨询和开发服务。产品和服务包括涉及 `ASP`、`ADO`、`XML` 和 `SQL Server` 的工作，以及在 Microsoft\
  \ `.NET Framework` 中的众多应用。Wally 编写过关于架构、`ADO.NET` 和 `SQL Server`、`AJAX` 以及使用 Mono/MonoTouch\
  \ 进行 iPhone 编程的书。Wally 专门负责构建拥有大量用户和数据的应用程序。他是 Microsoft MVP 和 `ASPInsider`，也是 Scalable\
  \ Development, Inc. 的合伙人。你可以在 [www.morewally.com](http://www.morewally.com) 阅读 Wally\
  \ 的博客。Wally 已婚并有两个孩子。在不写软件时，他打高尔夫、锻炼并和家人待在一起。\n\n![ffirsg02.tif](img/ffirsg02_fmt.jpg)\n\
  \nMartin Bowling 是 27 Creative 的创始人/总裁，这是一家位于西弗吉尼亚州查尔斯顿的互联网营销和移动开发咨询公司。Martin 因其网络营销才华受到认可，为许多财富\
  \ 500 公司和美国一些顶尖教育机构提供咨询。Martin 作为演讲者、研讨会负责人和顾问，在从社交媒体营销到应用开发的各种主题上非常受市场欢迎。他目前专注于几个将他的许多爱好结合在一起的项目，与领先的社交媒体营销和\
  \ SEO 公司 Search & Social 合作，建立一个为中小型企业提供可扩展的 SEO 和社交媒体营销的平台。他的项目 `Tweetcaching.com`\
  \ 将移动开发、社交媒体和户外活动结合成一个伟大的项目，让地理藏宝者（Geocachers）在外出时能够轻松地与朋友家人分享他们的发现。Martin 继续寻找新方法，将社交媒体与移动开发相结合，以为用户提供丰富的体验，并为他合作的公司提供最大的投资回报率（ROI）。他与妻子住在西弗吉尼亚州查尔斯顿。他的黑色拉拉犬\
  \ Brewski 在他编写代码时一直陪伴他。Martin 喜爱美食和精酿啤酒。可以通过 [www.martinbowling.com](http://www.martinbowling.com)\
  \ 联系他，他偶尔会在那里写博客。如需更深入地了解 Martin，可以在 Twitter 上关注 [`twitter.com/MartinBowling`](http://twitter.com/MartinBowling)。\n\
  \n![ffirsg03.tif](img/ffirsg03_fmt.jpg)\n\nCraig Dunn 自 2001 年以来一直在澳大利亚和加拿大使用 `.NET\
  \ Framework` 进行开发。他最初从独立承包商开始，随后共同主持了流行的 `.Net Rocks` 播客，担任微软公共演讲员，加入微软的 `Channel9`，并在其他公司/会议上就从网上银行到仓库自动化系统的各种主题进行多次演讲。自\
  \ 2009 年 8 月测试版以来一直参与 `MonoTouch`，在 [`conceptdev.blogspot.com`](http://conceptdev.blogspot.com)\
  \ 发布教程，并与 Chris Hardy 合作为微软 2010 年 MIX 大会制作了 iPhone 会议日程应用程序。Craig 也是首批第 15 位 iPad\
  \ 用户。\n\n![ffirsg04.tif](img/ffirsg04_fmt.jpg)\n\n\n\n\nAlex York 毕业于英国曼彻斯特大学，在那里学习了计算机科学。从那时起他一直在开发软件解决方案——几乎完全使用\
  \ `C#` 和 `.NET Framework`。毕业后，Alex 在曼彻斯特的一家移动游戏公司工作，每天使用 `ASP.NET` 和 `WCF`。他于 2008\
  \ 年搬到挪威，开始在 Bennett 工作，使用 `C#` 和 `ASP.NET` 为挪威知名品牌构建客户解决方案。在闲暇时间，他是使用 `MonoTouch`\
  \ 进行 iPhone 开发的早期者，也是该社区的活跃成员。他目前在特龙赫姆的 Capgemini 担任技术顾问。\n\nJohn Mandia 在伦敦长 way，自\
  \ 1999 年从市场营销转行开发以来一直从事开发工作。期间，他曾任职于一家增值分销商 (VAR)、一家 `.com` 公司、一个门户网站、一家设计机构、一家咨询公司，目前在一家领先的全球投资银行工作。从\
  \ `.NET` 处于测试阶段起他就在使用它，在过去的多年里，他是一个名为 `Portal` 的开源项目的主要贡献者（2002–2005 年），该项目下载量超过\
  \ 13 万次。他目前的兴趣之一是移动开发，自 `MonoTouch` 处于测试阶段起他一直在关注它，并建立了 `MonoTouch` 社区网站 [`monotouch.info`](http://monotouch.info)\
  \ 和 Twitter 账号 `@monotouchinfo`，以帮助那些决定将他们的 `.NET` 技能应用于 iPhone/iPad 开发的人们。\n\n\
  Jim Zimmerman 是 `ASP.NET` MVP，也是佛罗里达州坦帕市 Thuzi 和 TeamZoneSports 的 CTO。他去年决定学习 `Objective-C`，目的是学习为他的四个孩子和他的公司创建\
  \ iPhone 应用。从那以后，他深信 `MonoTouch` 是正确的选择，它让他能够带上自己的 `C#` 技能，获得更快的开发体验。他期待着有一天可以至少有\
  \ 90% 的相同代码运行在所有相关的移动设备上。\n\n## 制作谢\n\n### 执行编辑\nBob Elliott\n\n### 高级项目编辑\nKevin\
