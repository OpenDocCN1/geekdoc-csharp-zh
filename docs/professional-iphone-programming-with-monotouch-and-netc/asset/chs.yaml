  \          pinView = new MKPinAnnotationView(mapAnnotation, \"search\");\n     \
  \       }\n            else\n            {\n                // 复用视图，使用新注解\n    \
  \            annView.Annotation = annotation;\n            }\n            pinView.AnimatesDrop\
  \ = true;\n            pinView.PinColor = MKPinAnnotationColor.Red;\n          \
  \  pinView.CanShowCallout = true;\n            return annView;\n        };\n   \
  \     Search.Delegate = new MySearchBarDelegate(this);\n        window.MakeKeyAndVisible\
  \ ();\n        return true;\n    }\n    // 来自 Listing 7-6 的 MKAnnotation\n    //\
  \ 来自 Listing 7-11 的 SearchBarDelegate...\n}\n```\n\nFigure 7-18 显示了 Geocoder 的工作。它应该能够成功定位。图\
  \ 7-18\n\n![f018.tif](img/download_fmt.gif)\n\n\n\n\n\n在大多数情况下，你并不真正需要编辑此文件或操作这些值。MonoDevelop\
  \ 在“iPhone 应用设置”（iPhone Application Settings）选项对话框中处理这些任务，见图 8-1，你可以通过右键点击 iPhone\
  \ 项目并选择“选项”（Options）然后选择“iPhone 应用设置”来找到它。\n\n图 8-1\n\n![f0801.tif](img/f0801_fmt.jpg)\n\
  \n以下章节介绍了你可能需要编辑的一些值及其功能。\n\n### UIStatusBarHidden\n\n这是一个 `Boolean` 值，当设置为 `true`\
  \ 时，应用程序启动时将隐藏状态栏。另一种实现方法是在应用程序代理（application delegate）的 `FinishedLaunching` 事件下。在该方法中，你可以添加以下代码：\n\
  \n```objc\n// Hide the StatusBar\nUIApplication.SharedApplication.StatusBarHidden\
  \ = true;\n```\n\n此操作会隐藏状态栏，但仅在应用程序完成启动后生效。因此，你的启动界面（splash screen）在大部分显示时间内都会带有状态栏。然而，如果你使用\
  \ `Info.plist` 设置，你的状态栏将始终隐藏。\n\n### UIInterfaceOrientation\n\n这是一个带有字符串值的键（key）。可用选项是\
  \ iPhone 的方向选项。如果你希望应用程序以横屏模式启动，则设置此键。此处的默认值为标准竖屏（portrait）。\n\n如果你想以横屏启动应用程序，请使用\
  \ `UIInterfaceOrientationLandscapeLeft` 或 `UIInterfaceOrientationLandscapeRight`。\n\
  \n你也可以使用 `UIInterfaceOrientationPortraitUpsideDown` 倒置启动。\n\n这些值是手机在整个应用程序运行期间可用的方向。\n\
  \n### UIRequiresPersistentWiFi\n\n这是一个 `Boolean` 键，当设置为 `true` 时，应用程序启动时将运行 Wi-Fi\
  \ 连接。如果你的应用程序在没有 Wi-Fi 时无法工作，请使用此项。这对于在没有 Wi-Fi 时向用户显示错误特别有帮助。\n\n![note.ai](img/note_fmt.gif)\n\
  \nApple 希望你在 Wi-Fi 不可用时通知用户（换句话说，如果你不这样做，他们会拒绝你的应用），而且由于此键会在启动时开启连接，它会为你处理好用户通知。\n\
  \n如果此值设置为 `false`（默认值），操作系统会在 30 分钟后关闭任何活动连接。\n\n### UIPrerenderedIcon\n\n当你将 57×57\
  \ 的图标放入应用程序时，你会发现当它到达主屏幕（springboard）时，增加了一个光泽效果并且看起来很亮。嗯，有时你并不想要那样。如果你希望图标按照你设计的方式显示，而不带光泽和亮度，请将此\
  \ `Boolean` 键设置为 `true`，这将关闭渲染效果。\n\n## 查看设置包（Settings Bundle）\n\n用户已经习惯了他们所有的程序和网站提供一个偏好窗口，可以在其中设置应用程序特定的选项。iPhone\
  \ OS 为用户提供了一个名为“设置”的专用应用程序，允许用户控制其 iPhone 以及安装在上面的单个应用的偏好。本节将向你展示如何为你的应用程序向“设置”应用添加设置，并如何从应用程序内部访问这些设置。\n\
  \n### 设置应用程序\n\n“设置”应用程序允许用户进入并更改任何带有设置包（settings bundle）的应用程序偏好。设置包是构建在应用程序包中的一组文件，它告诉“设置”应用程序应用程序希望从用户那里收集哪些偏好。\n\
  \n图 8-2 显示了打开的“设置”应用程序，用户可以在其中为 iPhone 或特定应用程序设置偏好。\n\n图 8-2\n\n![f0802.tif](img/f0802_fmt.jpg)\n\
  \n“设置”应用程序充当了 iPhone User Defaults 机制的通用用户界面。User Defaults 是应用程序偏好的一部分，用于存储和检索偏好，由\
  \ `NSUserDefaults` 类实现。你的应用程序使用 `NSUserDefaults` 通过键值对读取和存储偏好数据，就像你从 `NSDictionary`\
  \ 访问键值数据一样。区别在于，`NSUserDefaults` 数据被持久化到文件系统中，而不是存储在内存中的对象实例中。\n\n如果你在应用中使用设置包，你就可以免费获得来自“设置”应用程序的\
  \ UI。你只需要创建一个属性列表（property list）来定义应用程序可用的设置，“设置”应用程序就会为你创建界面。\n\n然而，使用“设置”应用程序进行的操作是有限制的。用户在你的应用程序运行时可能需要更改的任何偏好都不应局限于“设置”应用程序，因为你的用户将被强制退出你的应用程序才能更改这些值。如果你构建了一个沉浸式应用程序，你通常希望从应用程序内部提供一个偏好视图，以便用户无需退出即可进行更改。这在游戏中尤为如此；然而，有时即使工具类和生产力应用也可能拥有用户可以在不离开应用程序的情况下更改的偏好。在章节的后后部分，你将学习如何在你的应用程序中直接从用户那里收集偏好并将它们存储在\
  \ iPhone 的 User Defaults 中。\n\n### 将你的应用添加到设置应用程序\n\n你想做的第一件事是实现一个设置包，这样当用户启动“设置”应用程序时，就能找到你的应用程序条目。一旦进入“设置”应用程序，如果用户选择了你的应用程序，他们将进入一个视图，该视图仅显示与你的应用程序相关的偏好。\n\
  \n### 使用设置包\n\n“设置”应用程序根据设置包的内容来显示任何给定应用程序的偏好。每个设置包都必须有一个名为 `Root.plist` 的属性列表，它定义了根级别的偏好。该属性列表必须遵循精确的格式。当“设置”应用程序找到带有适当\
  \ `Root.plist` 的设置包时，它会为你的应用程序构建设置视图。如果你希望偏好包含任何子视图，你必须向包中添加额外的属性列表，并为每个子项在 `Root.plist`\
  \ 中添加条目。这将在后面详细介绍。\n\n### 将你的应用添加到设置应用程序（等等，此处文字是“向项目添加设置包”——此处遵循原文流）\n\n### 向项目添加设置包\n\
  \n目前在 MonoDevelop 中，添加设置包是一个两步过程：\n\n1. 首先，你必须创建 `Settings.bundle`。要执行此操作，你需要右点击\
  \ `Project ⇒ Add ⇒ New Folder`，然后将此文件夹命名为 `Settings.bundle`\n2. 然后右点击 `Settings.bundle`\
  \ 并选择 `Add ⇒ New File ⇒ XML ⇒ Empty File`，将其命名为 `Root.plist`。\n\n图 8-3 显示了 iPhone\
  \ 主屏幕上的新建 XML 文件对话框。\n\n### 设置你的属性列表\n\n双击 `Root.plist`，将打开属性列表编辑器。在这里，你可以编辑文件并确保它符合“设置”应用程序识别的正确格式。在深入介绍格式细节之前，回顾一下属性列表的基础知识会很好。所有的属性列表都有一个类型为\
  \ `Dictionary` 的根节点。这意味着该节点使用键/值对存储项，就像 `NSDictionary` 一样。`Dictionary` 节点的所有子项都需要一个键和一个值。\n\
  \n\n\n\n多种不同类型的节点可以放入属性列表（property list）。除了允许你存储子节点的 `Dictionary` 节点外，还有 `Array`\
  \ 节点，它存储一个类似于 `NSArray` 的其他节点的有序列表。`Dictionary` 和 `Array` 类型是唯一可以包含其他节点的属性列表节点类型。此外，还有许多其他用于存储数据的节点类型。数据节点类型包括\
  \ `Boolean`、`Data`（Base64 编码数据，例如 `NSData`）、`Date`、`Number` 和 `String`。\n\n根节点下的第一个项目必须是\
  \ `PreferenceSpecifiers`，它是一个数组。该数组节点设计用于包含一组字典节点，每个节点代表用户可以输入的单个偏好设置，或者用户可以进入层级的单个子视图。\n\
  \n在用属性列表编辑器编辑 `Root.plist` 之前，你必须在文本编辑器中打开此文件以设置好基础。接后的代码显示了创建一个有效的 `Root.plist`\
  \ 所需的所有。设置好这些代码后，你就可以保存文件。如前所述，当双击 `Root.plist` 时，会打开属性列表编辑器，你的应用程序设置基础已准备就绪。\n\n\
  ```xml\n<?xml version=\"1.0\" encoding=\"UTF-8\"?>\n<!DOCTYPE plist PUBLIC \"-//Apple//DTD\
  \ PLIST 1.0//EN\" \"http://www.apple.com/DTDs/PropertyList-1.0.dtd\">\n<plist version=\"\
  1.0\">\n<dict>\n    <key>Title</key>\n    <string>AppSettings</string>\n    <key>StringsTable</key>\n\
  \    <string>Root</string>\n    <key>PreferenceSpecifiers</key>\n    <array>\n \
  \       <dict>\n            <key>Type</key>\n            <string>PSGroupSpecifier</string>\n\
  \            <key>Title</key>\n            <string>Optional Title</string>\n   \
  \     </dict>\n    </array>\n</dict>\n</plist>\n```\n\n图 8-4 显示了带有 `Root.plist`\
  \ 基础的属性列表编辑器。\n\n图 8-4\n\n![f0804.tif](img/f0804_fmt.jpg)\n\n你现在需要为你的 `PreferenceSpecifiers`\
  \ 节点添加一个子项。\n\n1. 选中 `PreferenceSpecifiers` 节点并点击左上角的“添加子项”（Add Child）按钮。\n2. 属性列表编辑器将为你创建一个名为\
  \ `Item 0` 的项目。你需要确保它的类型是 `Dictionary`。\n3. 你需要告诉 Settings 应用这将是一个什么种类型的项目，因此你需要选中这个新创建的项目并再次点击“添加子项”按钮。该项目的键（key）为\
  \ `Type`，类型为 `String`，值（value）为 `PSGroupSpecifier`。\n\n`PSGroupSpecifier` 用于指示一个新组的开始。该项目之后的每个项目都属于同一个组，直到找到下一个\
  \ `PSGroupSpecifier`。Settings 应用使用分组的 `UITableView` 来显示设置，`PSGroupSpecifier` 项目的\
  \ `Title` 键用作 `UITableView` 节头部文本。然而，`Title` 键是可选的，不是必须。\n\n![note.ai](img/note_fmt.gif)\n\
  \n你需要确保你的 `PreferenceSpecifiers` 节点中的第一个项目始终是 `PSGroupSpecifier` 项目，因为每个有效的 `Root.plist`\
  \ 都至少需要一个 `PSGroupSpecifier` 项目。\n\n图 8-5 显示了带有你的 `PSGroupSpecifier` 项目基础的属性列表编辑器。\n\
  \n图 8-5\n\n![f0805.tif](img/f0805_fmt.jpg)\n\n### 添加文本字段\n\n现在你已经处理好了 `Root.plist`\
  \ 的所有基础，可以开始添加一些字段来收集输入了。你可以从最简单且最常用的项目——文本字段开始。\n\n1. 你需要为 `PreferenceSpecifiers`\
  \ 节点添加另一个子项；然而，你不能简单地选择 `PreferenceSpecifiers` 节点并点击“添加子项”，因为会将新项目插入到你的 `PSGroupSpecifier`\
  \ 项目之上，这会导致你的 `Root.plist` 无效，因为项目必须位于组内。为了解决这个问题，你需要确保 `PSGroupSpecifier` 项目处于关闭状态。你可以通过点击项目旁边的展开指示器（disclosure\
  \ indicator）来实现。选中该项目，然后……\n\n2. 属性列表编辑器将为你创建一个名为 `Item 0` 的项目。你需要确保它的类型是 `Dictionary`。\n\
  3. 你需要告诉 Settings 应用这将是一个什么种类型的项目，因此你需要选中这个新创建的项目并再次点击“添加子项”按钮。该项目的键（key）为 `Type`，类型为\
  \ `String`，值（value）为 `PSGroupSpecifier`。\n\n`PSGroupSpecifier` 用于指示一个新组的开始。该项目之后的每个项目都属于同一个组，直到找到下一个\
  \ `PSGroupSpecifier`。Settings 应用使用分组的 `UITableView` 来显示设置，`PSGroupSpecifier` 项目的\
  \ `Title` 键用作 `UITableView` 节头部文本。然而，`Title` 键是可选的，不是必须。\n\n图 8-6 显示了带有你的 `PSGroupSpecifier`\
  \ 项目的属性列表编辑器。\n\n图 8-6\n\n![f0806.tif](img/f0806_fmt.jpg)\n\n\n\n要将此字段变为安全文本字段，你需要为该字段添加一个子节点。该节点的键（key）需要为\
  \ `IsSecure`。你需要将它的类型从 `String` 更改为 `Boolean`。注意，值不再是一个字符串，而是一个勾选框：`Checked` 表示\
  \ `true`，未勾选则表示 `false`。\n\n图 8-9 显示了属性列表编辑器，其中包含一个 `PSTextFieldSpecifier`，它会在设置应用中创建一个标签为“Password”的安全文本字段。图\
  \ 8-10 显示了视觉结果。\n\n图 8-9\n\n![f0809.tif](img/f0809_fmt.jpg)\n\n图 8-10\n\n![f0810.tif](img/f0810_fmt.jpg)\n\
  \n### 添加多值字段\n\n`MultiValue` 字段允许你的用户从一组预定义的选项中进行选择。它呈现出一行带有披露指示器的界面，点击后可进入可用选项。\n\
  \n1. 你可以像处理其他元素一样，通过向 `PreferenceSpecifiers` 节点添加一个子行开始。点击新创建的最后一个项的披露按钮使其关闭，然后点击行末尾的加号按钮。新创建的子行需要一个键为\
  \ `Type` 且值为 `PSMultiValueSpecifier` 的属性。\n\n2. 添加第二行，键为 `Title`，值为 `Service`。\n\
  \n3. 创建第三行，键为 `Key`，值为 `service`。\n\n4. 现在你进入了实际建立要显示和存储的值的这一部分。这是通过两个不同的数组来实现的：一个数组包含显示给用户的值，另一个数组包含实际实际存储的值。这样做是为了你可以向用户提供非常友好的文本，而在后台，你存储的是可能不太便于显示的数字或内部\
  \ ID。很棒的一点是，如果你希望标题和值相同，只需要创建一个数组并复制粘贴即可！\n\n向你当前的项中再添加另一个子项。此项需要一个键为 `Values` 且类型为\
  \ `Array`。在该项项下，你需要创建持有实际值的节点。对于此示例，所有节点都将是 `String`，并且它们的值将是 `Twitter`、`Facebook`\
  \ 和 `Email`。由于你想向用户显示与你存储的相同的值，你可以复制此项、粘贴它，并将键名更改为 `Titles`。\n\n5. `MultiValue`\
  \ 字段必须有且只有一个值，因此你对该字段需要做的最后一件事是如果没有选择任何值，则设置一个默认值。为此，你需向 `PSMultiValueSpecifier`\
  \ 项添加一个新的子项，并给它一个键为 `DefaultValue` 值为 `Twitter` 的属性。你在 `DefaultValue` 中提供的值必须是 `Values`\
  \ 数组中的有效值（如果与 `Titles` 数组不同，则不能使用后者）。\n\n图 8-12\n\n![f0812.tif](img/f0812_fmt.jpg)\n\
  \n图 8-13\n\n![f0813.tif](img/f0813_fmt.jpg)\n\n图 8-11 显示了属性列表编辑器，其中包含一个 `PSMultiValueSpecifier`，它创建了一个用户可以选择的服务列表（`Twitter`、`Facebook`、`Email`）。图\
  \ 8-12 和 8-13 显示了视觉结果。\n\n图 8-11\n\n![f0811.tif](img/f0811_fmt.jpg)\n\n### 添加切换开关\n\
  \n你需要从用户处获取下一个项是一个布尔值，表示应用是否与朋友共享。为了在偏好设置获取布尔值，你将通过向 `PreferenceSpecifiers` 数组添加另一个类型为\
  \ `PSToggleSwitchSpecifier` 的项来告诉设置应用使用 `UISwitch`。\n\n1. 创建一个新的子项，并将其类型更改为字典（dictionary）。\n\
  \n2. 然后在新创建的项中添加一个子项。给该子行一个键为 `Type` 值为 `PSToggleSwitchSpecifier` 的属性。\n\n3. 添加另一个子行，键为\
  \ `Title`，值为 `Share With Friends`。\n\n4. 接下来，添加另一个子行，键为 `Key`，值为 `share`。\n\n默认情况下，切换开关会将布尔值\
  \ `true` 或 `false` 保存到用户默认设置中。你可以通过指定可选的键 `on` 和 `off` 来覆盖此行为，并为开启和关闭位置分配不同的值。\n\
  \n5. 你可以允许用户在你指定的范围内选择一个值。对于此实例，让用户在 1 到 10 之间选择一个值。\n```\n\n\n\n## 6. 正如前面所述，你还可以对\
  \ `PSSliderSpecifier` 进行一种额外的自定义：为 `MinimumValue` 和 `MaximumValue` 提供图像。你需要另外两个子行：一个\
  \ `MinimumValueImage` 和另一个 `MaximumValueImage`。在它们的键（key）中放入图像名称。你需要将这些图像文件拷贝到与\
  \ `Root.plist` 相同的 `Settings.bundle` 目录。\n\n图 8-16 显示了属性列表编辑器，其中一个 `PSGroupSpecifier`\
  \ 为 `PSSliderSpecifier` 显示了标签“刷新率”（Refresh Rate），这允许用户选择他们想要刷新数据的频率。图 8-17 显示了视觉结果。\n\
