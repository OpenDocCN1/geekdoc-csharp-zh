  \ 方法允许程序检索 Web 服务调用的结果。\n*   最后一个问题是如何将值返回给用户界面，以便用户可以使用这些数据。这是通过 `InvokeOnMainThread`\
  \ 方法实现的。必须使用 `InvokeOnMainThread` 的原因是 Web 服务的响应是在与主线程不同的线程中处理的。要写入用户界面，必须在主线程上编写命令。\n\
  *   最后一行结果会将调试信息发送到连接的计算机。\n\n图 5-4 显示了对 Web 服务异步调用的输出。\n\n图 5-4\n\n![f0504.tif](img/f0504_fmt.jpg)\n\
  \n## 使用 Windows 通信框架 (WCF)\n\n本节探讨了基于 WCF 的 Web 服务。WCF 随 `.NET 3.5` 发布，是一种旨在构建面向服务的应用程序的\
  \ API。\n\nVisual Studio 隐藏了基于 SOAP 的 Web 许多复杂性。这些代理允许开发者像使用本地库一样使用 Web 服务。遗憾的是，iPhone\
  \ 不允许在运行时生成代码。这产生了一个问题，我们必须手动生成代理。\n\n1.  手动生成代理。此工具随 Silverlight 3 提供，位于 `C:\\\
  Program Files\\Microsoft\\Silverlight\\3.0\\Tools\\SUtil.exe`。\n2.  将代理添加到项目中。\n\
