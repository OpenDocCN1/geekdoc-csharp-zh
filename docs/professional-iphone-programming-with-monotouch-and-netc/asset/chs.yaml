  ```\n\n## 读取你的设置\n\n现在你已经设置好了所有的指定符，用户可以通过 Settings 应用程序访问你的设置，你需要一种方法在自己的应用程序中访问这些设置。事实证明这非常简单。\n\
  \n1. 首先，你需要确保你有了对 `MonoTouch.Foundation` 的引用。你就像处理任何其他类一样处理它：\n```\nusing MonoTouch.Foundation;\n\
  ```\n2. （可选）你将使用 `NSUserDefaults` 类来处理与已保存偏好的通信，因此你需要为该类创建一个引用：\n```\nvar prefs\
  \ = NSUserDefaults.StandardUserDefaults;\n```\n3. 拥有 `NSUserDefaults` 实例后，你可以进行一些非常简单的调用来获取所需键的值。你将读取在本章上一节中创建的设置；注意，对于你可能需要的每种变量类型都有对应的方法：`StringForKey`、`IntForKey`、`BooleanForKey`、`FloatForKey`、`DoubleForKey`、`DictionaryForKey`\
  \ 和 `ArrayForKey`。你只需要使用与你预期的变量类型对应的方法：\n```cs\nstring username = prefs.StringForKey(\"\
  username\");\nstring password = prefs.StringForKey(\"password\");\nstring sharingService\
  \ = prefs.StringForKey(\"service\");\nstring shareEnabled = prefs.StringForKey(\"\
  share\");\nint refreshRate = prefs.IntForKey(\"refreshRate\");\n```\n\n## 更新你的设置\n\
  \n现在已经知道如何读取设置，但如果你需要在应用程序内部进行更改呢？\n\n1. （可选）再次，你需要确保你有了对 `MonoTouch.Foundation`\
  \ 的引用。这让你能够访问 `NSUserDefaults` 类，它为你处理了所有的复杂工作。像之前一样，你需要为该类创建一个引用：\n```cs\nvar prefs\
  \ = NSUserDefaults.StandardUserDefaults;\n```\n2. 拥有 `NSUserDefaults` 实例后，你只需要使用设置的键来设置值，并如所示调用\
  \ `Synchronize` 方法：\n```cs\nprefs[\"username\"] = new NSString(username.ToString());\n\
  prefs[\"password\"] = new NSString(password.ToString());\nprefs[\"service\"] = new\
  \ NSString(sharingService.ToString());\nprefs[\"share\"] = new NSString(shareEnabled.ToString());\n\
  // ... \nprefs.Synchronize();\n```\n\n你可以将这些知识结合之前章节中中学到的关于屏幕控件的知识，创建一个应用内的设置视图，以便用户在应用程序运行时调整可能需要的设置。\n\
  \n## 总结\n\n本章介绍了 `NSUserDefaults` 类和 `Settings.bundle`，以便允许用户轻松地更改应用程序的偏好。你还学习了在应用程序内部读取和更改这些设置是有多么简单。\n\
  \n\n\n\n\n*   程序可以测试通过任何连接（`WiFi`、`3G` 或 `EDGE`）的网络连接是否可用。如果连接不存在，在尝试上传信息时，与其显示错误消息，不如通知用户未连接到服务。\n\
  \n*   加速度计可以从数据源中提取随机数据。当设备被摇动时，应用程序可以通过从数据源读取随机数据来做出响应。\n\n*   当用户将设备从竖屏模式切换到横屏模式时，应用程序可以更改向用户显示内容的方式。\n\
  \n大部分设备支持都来自 `MonoTouch.UIKit.UIDevice` 类。`UIDevice` 类暴露了 `CurrentDevice` 实例，该实例代表当前设备。`CurrentDevice`\
  \ 是 `UIDevice` 类的一个静态只读成员。`UIDevice` 类允许开发者获取有关当前设备的信息，例如其唯一 ID（用于唯一标识 iPhone）、分配的名称、设备型号、操作系统名称、操作系统版本以及其物理设备特性。这些物理设备特性包括设备方向、电池状态和接近距离传感器。iPhone\
  \ 的其他部分也提供了支持，例如允许程序测试地址是否可达的网络栈，以及让程序知道设备是否正在被摇动的加速度计。\n\n### 响应加速度\n\n加速度计是 iPhone\
  \ 最引人的功能之一。`UrbanSpoon.com` iPhone 应用程序是 iPhone 的原始原生应用之一，它是利用加速度返回随机餐厅数据的绝佳示例。通过该程序，你只需要摇晃\
  \ iPhone，程序就会为你找到附近的一家好餐厅。加速度计通常与用户界面元素（如 `UIPicker`）配合使用，以随机检索数据。通过编写 iPhone 响应\
  \ `Acceleration` 事件，你可以在用户每次摇晃 iPhone 时刷新显示给用户的数据。\n\n### 加速度计\n\n通常而言，加速度计测量的是设备相对于自由落体的固有有加速度。iPhone\
  \ 中的加速度计提供 `XYZ` 轴的变化，这允许程序检测设备的方向和移动。由于变化是在 `XYZ` 轴上提供的，因此可以以向量的形式计算加速度。\n\n`MonoTouch`\
  \ 框架通过 `MonoTouch.UIKit` 命名空间轻松访问加速度计，该命名空间暴露了 `UIAccelerometer.SharedAccelerometer`\
  \ 成员。该类的实例作为 `UIAccelerometer` 类的一个静态只读成员被访问。\n\n### 使用 XYZ 坐标系\n\n理解数据如何从加速度计返回非常重要。可以使用多个坐标系。最终，Apple\
  \ 实现了 `XYZ` 坐标系来提供加速度信息。图 9-1 显示了坐标系中的 iPhone。\n\n图 9-1\n\n![f0901.eps](img/f0901_fmt.gif)\n\
  \n假设用户位于 `Z-axis` 沿，如果 iPhone 向用户或远离用户移动，加速度将沿着 `Z-axis` 发生。如果 iPhone 向左或向右移动，加速度将沿着\
  \ `X-axis` 发生。如果 iPhone 向上或向下移动，加速度沿着 `Y-axis` 发生。可以确定每个轴上的加速度值。在已知每个轴上的值并在数学帮助下，可以计算出加速度的总幅度以及在任何时刻该加速度的方向。\n\
  \n### 使用加速度计进行编码\n\n加速度计允许程序读取 iPhone 是否正在移动，并返回有关设备移动的数据。iPhone OS 和 `MonoTouch`\
  \ 提供了一个软件解决方案来与 `Accelerometer` 集成并处理加速度事件。`SharedAccelerometer` 是一个共享的 C# 对象，提供对设备上加速度硬件的访问。列表\
  \ 9-1 显示了如何处理加速度事件并将这些信息显示给用户。\n\n![download.eps](img/download_fmt.gif)\n\n列表 9-1:\
  \ 读取加速度计\n\n```csharp\n// AppDelegate 在 MainWindow.xib 文件中被引用。\n\npublic partial\
  \ class AppDelegate : UIApplicationDelegate\n{\n    // 当应用程序加载其 UI 并准备好运行时会调用此方法\n\
  \    public override bool FinishedLaunching (UIApplication app, NSDictionary options)\n\
  \    {\n        // 如果你定义了视图，在这里添加它：\n        // window.AddSubview (navigationController.View);\n\
  \        window.MakeKeyAndVisible ();\n\n        // 加速度在模拟器中不起作用。\n        UIAccelerometer.SharedAccelerometer.UpdateInterval\
  \ = 1 / 10;\n        dataLabel.Text = String.Empty;\n        UIAccelerometer.SharedAccelerometer.Acceleration\
  \ += delegate(object sender, UIAccelerometerEventArgs e)\n        {\n          \
  \  UIAccelerometer acc = e.Acceleration;\n            double thresholdValue = 2.0;\n\
  \            double Velocity = Math.Sqrt(Math.Pow(acc.X, 2) + Math.Pow(acc.Y, 2)\
  \ + Math.Pow(acc.Z, 2));\n            string strReturn = Environment.NewLine;\n\
  \            if (Velocity > thresholdValue)\n            {\n                dataLabel.Text\
  \ = \"Velocity: \" + Velocity.ToString() + strReturn +\n                    \"X:\
  \ \" + acc.X.ToString() + strReturn +\n                    \"Y: \" + acc.Y.ToString()\
  \ + strReturn +\n                    \"Z: \" + acc.Z.ToString();\n            }\n\
  \        };\n        return true;\n    }\n}\n```\n\n\n\n\n如前所述，加速度计可用于用户输入。UrbanSpoon\
  \ App 拥有一个区域餐厅数据库，它利用加速度计对区域内的餐厅进行随机搜索。当摇晃 iPhone 时，会显示随机的餐厅类型。用户随后可以更改值并执行搜索。\n\
  \nListing 9-2 显示了一个值正在旋转的 `UIPicker`。这些图像被加载并显示在 `UIImagePicker` 中。在此示例中，显示了九张图像，这些图像通过\
  \ `UIImages` 数组加载。\n\n![download.eps](img/download_fmt.gif)\n\nListing 9-2: 使用加速度创建\
  \ UrbanSpoon UI 效果\n\n```csharp\n//缩短动画时长会让动画倾向于\n//运行得更快。\nimageViewPicker.AnimationDuration\
  \ = .1;\nimageViewPicker.Hidden = true;\n\n//加载图像。\nimageViewPicker.AnimationImages\
  \ = new UIImage [] {\n    UIImage.FromFile (\"images/blur01.png\"),\n    UIImage.FromFile\
  \ (\"images/blur02.png\"),\n    UIImage.FromFile (\"images/blur03.png\"),\n    UIImage.FromFile\
  \ (\"images/blur04.png\"),\n    UIImage.FromFile (\"images/blur05.png\"),\n    UIImage.FromFile\
  \ (\"images/blur06.png\"),\n    UIImage.FromFile (\"images/blur07.png\"),\n    UIImage.FromFile\
  \ (\"images/blur08.png\"),\n    UIImage.FromFile (\"images/blur09.png\")\n};\n\n\
  UIAccelerometer.SharedAccelerometer.UpdateInterval = 1/10;\n\nUIAccelerometer.SharedAccelerometer.Acceleration\
  \ +=\n    delegate(object sender, UIAccelerometerEventArgs e) {\n    double Threshold\
  \ = 1.5;\n    double magnitude;\n    UIAcceleration acc = e.Acceleration;\n    magnitude\
  \ = Math.Sqrt(Math.Pow(acc.X, 2) + Math.Pow(acc.Y, 2) + Math.Pow(acc.Z, 2));\n \
  \   if ( magnitude >= Threshold ) {\n        if ( PreviousRun == false ) {\n   \
  \         // 显示 imageViewPicker 并开始动画\n            imageViewPicker.Hidden = false;\n\
  \            imageViewPicker.StartAnimating ();\n            PreviousRun = true;\n\
  \        }\n    }\n    else{\n        if (PreviousRun == true ){\n            System.Threading.Thread.Sleep(150);\n\
  \            // 隐藏 imageViewPicker 并停止动画\n            imageViewPicker.Hidden = true;\n\
  \            imageViewPicker.StopAnimating (); \n            // 获取一个随机值\n      \
  \      int n = r.Next(pickerChoices.Rows);\n            // 让我们选择随机索引并将动画\n     \
  \       // 设置为 true，这样看起来看起来很“酷”\n            pickerChoices.Select(n,true);\n  \
  \      }\n        PreviousRun = false;\n    }\n};\n```\n\n### 在下载的 UrbanSpoon\\\
  Main.cs 中\n\n代码中需要注意的几点包括：\n- 使用了阈值来测量加速度的大小。通过设置该值，iPhone 的微小移动会被忽略。\n- 有一个名为 `PreviousRun`\
  \ 的布尔值。它用于确定加速度的最后状态。如果没有它，iPhone 的任何微小移动都会触发加速度事件，导致显示不同的值。\n- 当前运行的线程会被睡眠几毫秒。通过让\
  \ UI 线程睡眠一小会儿，`UIPicker` 在用户停止 iPhone 后似乎仍在旋转。\n\nFigure 9-2 显示了旋转的 `UIPicker`。\n\
  \nFigure 9-2\n\n![f0902.tif](img/f0902_fmt.jpg)![note.ai](img/note_fmt.gif)\n\n\
  `UIPicker` 旋转示例是由 Martin Bowling 发起的。随后代码经过修改以提供对加速度计的支持。\n\n### 确定设备方向\n\n在编写桌面应用程序时，很少会出现屏幕旋转或以任何可感知的方式移动的情况。移动设备并非如此，它有多种方向。iPhone\
  \ 的七种方向（六种方向加上未知）是：\n- `Unknown`：设备方向未知。\n- `Portrait`：设备处于竖屏模式。设备竖直，主 键位于底部。\n\
  - `PortraitUpsideDown`：设备处于竖屏模式。设备倒置握，主 键位于顶部。\n- `LandscapeLeft`：设备处于横屏模式。设备竖直，主\
  \ 键位于设备右侧。\n- `LandscapeRight`：设备处于横屏模式。设备竖直，主 键位于设备左侧。\n- `FaceUp`：设备屏幕朝上并与地面平行。\n\
  - `FaceDown`：设备屏幕朝下并与地面平行。\n\n### 开始通知\n\n获取有关设备方向信息的第一步是开启设备通知。你通过调用 `UIDevice.CurrentDevice.BeginGeneratingOrientationNotifications()`\
  \ 来实现。\n\n一旦进行了此调用，调用程序即可获取方向通知信息。\n\n在开启此信息的同时，在不需要时关闭通知很重要。你可以通过调用 `UIDevice.CurrentDevice.EndGeneratingOrientationNotifications()`\
  \ 完成。\n\n![note.ai](img/note_fmt.gif)\n\n设备通知在启动后并非立即可用，但在短暂延迟后可用。`BeginOrientationNotifications()`\
  \ 与启动通知不是同步的。\n\n### 确定静态方向\n\n虽然不是最常见的场景，但有时开发者需要获取设备方向的情况。先学习静态情况，再学习动态情况更为简单。获取设备方向有两个步骤。第一步是确定方向通知是否开启。如果未开启方向，则返回\
  \ `Unknown` 值。参见 Listing 9-3。\n\n![download.eps](img/download_fmt.gif)\n\nListing\
  \ 9-3: 确定方向\n\n```csharp\nvoid HandleOrientationTouchUpInside (object sender, EventArgs\
  \ e)\n{\n    if (UIDevice.CurrentDevice.GeneratesOrientationNotifications == true\
  \ ) \n    {\n        OrientationLabel.Text = UIDevice.CurrentDevice.\n         \
  \   GeneratesOrientationNotifications.ToString() + \n            \": \" + UIDevice.CurrentDevice.Orientation.ToString();\n\
  \    }\n}\n```\n\n### 在下载的 DeviceSupport\\Main.cs 中\n\n一旦确定设备通知开启，即可获取当前的设备方向。在这种情况下，它会被显示给用户。\n\
  \n### 确定事件驱动方向\n\n更有趣的情况是开启设备方向更改通知。一旦开启了方向更改通知，应用程序可以通过 `UIDeviceOrientationDidChangeNotification`\
  \ 监控事件。参见 Listing 9-4。\n\n```csharp\nNSNotificationCenter.DefaultCenter.\n    AddObserver\
  \ (\"UIDeviceOrientationDidChangeNotification\", \n    delegate { \n        OrientationLabel.Text\
  \ = UIDevice.CurrentDevice.Orientation.ToString(); \n    });\n```\n\n在下载的 DeviceSupport\\\
  Main.cs 文件中\n\n在这个短代码示例中，每当设备方向发生时，标签上都会显示一条消息，以便向用户传达该变化。Figure 9-3 显示了事件驱动方向的输出。\n\
  \n\n\n此过程的下一步是实际上在应用程序中对此更改进行操作。当 iPhone 的方向发生变化时，应用程序可能需要相应。这是通过重写 `ShouldAutorotateToInterfaceOrientation`\
  \ 方法并返回 `true` 来的。该方法在显示当前数据的视图控制器上重写。\n\n```csharp\npublic override bool ShouldAutorotateToInterfaceOrientation\
  \ (UIInterfaceOrientation toInterfaceOrientation)\n{\n    return(true);\n}\n```\n\
  \n这段代码需要放置在视图控制器中。这段代码指示视图控制器是否支持指定的方向。默认情况下，该方法对 `Portrait`（竖屏）方向返回 `true`。如果应用程序需要支持其他方向，则应该重写该方法。\n\
  \n### 读取距离传感器\n\n用户将 iPhone 视为 iPod、Web 浏览器、应用设备，有时也是手机电话。对于软件开发者来说，电话可能是 iPhone\
  \ 上最少被考虑的功能。iPhone 拥有一个距离传感器，它在 iPhone OS 中被用于在用户将 iPhone 举起在耳边拨打电话时停用屏幕和显示器。\n\n\
  当应用程序运行时，可能会出现需要执行相同类型操作的情况。iPhone 的距离传感器通过 `UIDevice` 类向开发者暴露。可以在距离传感器上设置通知，如列表\
  \ 9-5 所示。\n\n![download.eps](img/download_fmt.gif)\n\n列表 9-5: 读取距离传感器\n\n```csharp\n\
  UIDevice.CurrentDevice.ProximityMonitoringEnabled = true;\n\nNSNotificationCenter.DefaultCenter.AddObserver\
  \ (\"UIDeviceProximityStateDidChangeNotification\", delegate {\n    ProximityLabel.Text\
  \ = UIDevice.CurrentDevice.ProximityState.ToString();\n});\n```\n\n位于下载包的 `DeviceSupport/Main.cs`\
  \ 文件中\n\n并不是所有的 iPhone 都支持距离传感器。要对其进行测试，以下代码将启用距离传感器。\n\n```csharp\nUIDevice.CurrentDevice.ProximityMonitoringEnabled\
  \ = true;\nif ( UIDevice.CurrentDevice.ProximityMonitoringEnabled == true ) {\n\
  \    // 在此处放置代码。\n    // 此段代码将测试距离传感器。\n    // 如果代码检测到距离传感器，\n    // 则执行 if 语句内的代码。\n\
  }\n```\n\n如果在启用距离传感器后，`ProximityState` 的值仍为 `false`，则说明该设备不支持距离传感器。图 9-4 显示了距离传感器在移离用户脸部后的裁剪输出。\n\
  \n图 9-4\n\n![f0904.tif](img/f0904_fmt.jpg)![note.ai](img/note_fmt.gif)\n\n`ProximityState`\
  \ 返回一个 `Boolean` 值。如果值为 `true`，则设备靠近用户脸部。如果 `ProximityState` 的值为 `false`，则设备不在用户脸部附近。\n\
  \n### 网络\n\n虽然与 iPhone 设备集成的大部分工作是通过 `UIDevice.CurrentDevice` 类完成的，但网络是通过 `NetworkReachability`\
  \ 类完成的。该类检查连接性并返回一组标志。请参见列表 9-6。检查网络连接性的标志之间并不是互斥的。\n\n![download.eps](img/download_fmt.gif)\n\
  \n列表 9-6: 确定与网站的连接\n\n```csharp\nvoid HandleNetworkingTouchUpInside (object sender,\
  \ EventArgs e)\n{\n    NetworkReachability nr = new NetworkReachability(\"www.apple.com\"\
  );\n    NetworkReachabilityFlags flgs = new NetworkReachabilityFlags();\n    nr.TryGetFlags(out\
  \ flgs);\n    NetworkingLabel.Text = String.Empty;\n    if ( (flgs & NetworkReachabilityFlags.IsWWAN)\
  \ == NetworkReachabilityFlags.IsWWAN )\n    {\n        NetworkingLabel.Text += \"\
  IsWWAN\";\n    }\n    NetworkingLabel.Text += \"Network Flag: \" + flgs.ToString();\n\
  }\n```\n\n位于下载包的 `DeviceSupport/Main.cs` 文件中\n\n可达性的标志有：\n\n- `Automatic`: 连接正在发生。\n\
  - `ConnectionOnDemand`: 连接正在发生。\n- `ConnectionTraffic`: 连接是。\n- `ConnectionRequired`:\
  \ 连接是。\n- `InterventionRequired`: 连接是。\n- `IsDirect`: 状态。\n- `ISocal`: 状态。\n- `IsWWAN`:\
  \ 连接是。\n- `Reachable`: 连接是。\n- `Transient`: 连接。\n\n测试连接可能会有些令人困惑。为了提供帮助，Miguel Icaza\
  \ 在 `http://github.com/migueldeaza/itouch-samples/tree/master` 上放置了一些代码以供辅助。图 9-5\
  \ 显示了通过 WiFi 连接的 `www.apple.com`。\n\n图 9-5\n\n![f0904.tif](img/f0904_fmt.jpg)\n\n\
  ### 考虑电池寿命\n\n电池是移动设备的重要部分。与通常只离开电源短时间（1-2 小时）的笔记本电脑不同，移动设备可以离开电源几天。正如此，有几点需要注意：\n\
  \n- 应用程序不应在不对用户产生收益的情况下持续使用耗电功能。这些功能包括网络、方向或任何消耗额外电源的功能。一个很好的问题是：“用户或应用程序真的一直需要这些功能吗？还是只需要在这一点？”\n\
  - 应用程序了解特定时间点的电池状况是非常重要的。\n\n### 确定静态电池\n\n确定电池当前状态的一种方法是专门请求信息。这是通过两个步骤完成的。在此代码（列表\
  \ 9-7）中，开启电池监控，一旦开启，就可以确定电池的电量和状态。\n\n电池电量是一个从 0.0（完全放电）到 1.0（充满）之间的浮点数。\n\n电池状态是\
  \ `BatteryState` 枚举中的四个值之一。这些值是：\n\n- `Unknown`: 电池状态未知。这通常在 `UIDevice.CurrentDevice.BatteryMonitoringEnabled`\
  \ 被设置为 `false` 时发生。`BatteryMonitoringEnabled` 的默认状态为 `false`。\n- `Unplugged`: 当用户正在使用\
  \ iPhone 且未连接充电器时的状态。\n- `Charging`: iPhone 连接到充电器时的电池状态。\n- `Full`: iPhone 电量达到\
  \ 100% 时的电池状态。\n\n![download.eps](img/download_fmt.gif)\n\n列表 9-7: 读取电池电量\n\n```csharp\n\
  void HandleBatteryTouchUpInside (object sender, EventArgs e)\n{\n    try\n    {\n\
  \        UIDevice.CurrentDevice.BatteryMonitoringEnabled = true;\n        BatteryLabel.Text\
  \ = \"Battery: \" + UIDevice.CurrentDevice.BatteryLevel.ToString() + \" \" + \"\
  Battery Status: \"  \n    }\n}\n```\n\n\n\n\n```csharp\nUIDevice.CurrentDevice.BatteryState.ToString();\n\
  }\nfinally\n{\n    UIDevice.CurrentDevice.BatteryMonitoringEnabled = false;\n}\n\
  }\n```\n\n位于下载包的 `DeviceSupport\\Main.cs` 文件中\n\n# 使用电池变化事件\n\n就像处理 iPhone 的其他部分一样，某些事件是基于\
  \ iPhone 电池的变化的。当电池发生变化时，会触发一个事件。列表 9-8 显示了如何监听电池状态变化事件。\n\n在此段代码中，挂钩了 `UIDeviceBatteryStateDidChangeEventNotification`，这样当电池状态发生变化时，开发者就可以收到更改通知。以下代码展示如何跟踪电池状态的变化。\n\
  \n![download.eps](img/download_fmt.gif)\n\n列表 9-8: 处理电池变化通知\n\n```csharp\nNSNotificationCenter.DefaultCenter.AddObserver\
  \ \n    (\"UIDeviceBatteryStateDidChangeNotification\",\n    delegate {\n      \
  \  BatteryLabel.Text = UIDevice.CurrentDevice.BatteryLevel.ToString() + \n     \
  \       \", \" + UIDevice.CurrentDevice.BatteryState.ToString(); \n    });\n```\n\
  \n位于下载包的 `DeviceSupport\\Main.cs` 文件中\n\n图 9-6 和 9-7 分别显示了 iPhone 在插入电源和拔掉电源时电池状态变化通知的输出。\n\
  \n图 9-6\n\n![f0906.tif](img/f0906_fmt.jpg)\n\n图 9-7\n\n![f0907.tif](img/f0907_fmt.jpg)\n\
  \n# 访问系统信息\n\n`UIDevice` 类提供了访问设备功能之外的当前设备信息。`UIDevice.CurrentDevice` 类暴露了一组属性，允许确定系统级信息。这些属性是：\n\
  \n*   `LocalizedModel`：本地化模型属性是一个本地化字符串，代表有关特定型号的信息。\n*   `Model`：模型属性返回一个包含特定型号信息的字符串。\n\
  *   `Name`：名称属性返回设备名称的字符串。这是来自“通用 ⇒ 关于”设置中的值。\n*   `SystemName`：系统名称是当前运行在 iPhone\
  \ 上的操作系统名称。\n*   `SystemVersion`：系统版本是当前运行在 iPhone 上的操作系统版本号。\n*   `UniqueIdentifier`：唯一标识符是一个基于硬件值的唯一字符串。\n\
  \n列表 9-9 显示了如何获取系统信息：\n\n![download.eps](img/download_fmt.gif)\n\n列表 9-9: 读取系统信息\n\
  \n```csharp\nstring Output = String.Empty;\nOutput += \"System Name: \" + UIDevice.CurrentDevice.SystemName\
  \ + Environment.NewLine;\nOutput += \"System Version: \" + UIDevice.CurrentDevice.SystemVersion\
  \ + \n    Environment.NewLine;\nOutput += \"Unique ID: \" + UIDevice.CurrentDevice.UniqueIdentifier\
  \ + \n    Environment.NewLine;\nOutput += \"Localized Model: \" + UIDevice.CurrentDevice.LocalizedModel\
  \ + \n    Environment.NewLine;\nOutput += \"Name: \" + UIDevice.CurrentDevice.Name\
  \ + Environment.NewLine;\nSystemInformationText.Text = Output;\n```\n\n位于下载包的 `DeviceSupport\\\
  Main.cs` 文件中\n\n图 9-8 显示了此代码在模拟器中运行的输出。\n\n图 9-8\n\n![f0908.tif](img/f0908_fmt.jpg)\n\
  \n## 移动开发\n\n在为 iPhone 开发开发时，有几点需要记住：\n\n*   `UIDevice` 类具有许多功能。\n*   `UIDevice.CurrentDevice`\
  \ 用于访问设备属性。\n*   监控电池状态涉及监听通知事件。\n\n## 总结\n\n`UIDevice` 类提供了访问设备功能之外的当前设备信息。`UIDevice.CurrentDevice`\
  \ 类暴露了一组属性，允许确定系统级信息。\n\n\n\n\n\n除了可以使用图像视图显示单个图像外，你还可以允许图像视图在一系列图像之间进行动画播放。要实现这一点，你需要传入一个\
  \ `UIImage` 对象的数组，并使用 `StartAnimating` 和 `StopAnimating` 方法来控制动画的开始与停止。你可以设置额外的属性来确定动画的长度和重复次数。当图像未进行动画处理时，它将显示默认图像。此默认图像就是你传递到构造函数的图像；如果你想让它出现在动画中，则需要重用\
  \ `UIImage` 数组中的该图像对象。列表 10-2 展示了如何创建一个 `UIImage` 对象的列表并启动 `UIImageView` 的动画播放。\n\
  \n![download.eps](img/download_fmt.gif)\n\n#### 列表 10-2: 使用 UIImageView 用于动画\n\n\
  ```csharp\npublic override bool FinishedLaunching (UIApplication app, NSDictionary\
  \ options)\n{\n    var image = UIImage.FromFile(\"image.png\");\n    var image2\
  \ = UIImage.FromFile(\"image2.png\");\n    var image3 = UIImage.FromFile(\"image3.png\"\
  );\n    var imageViewRectangle = new RectangleF(0f, 20f, image.Size.Width, image.Size.Height);\n\
  \    var imageView = new UIImageView(image);\n    imageView.Frame = imageViewRectangle;\n\
  \    imageView.AnimationImages = new [] {image, image2, image3};\n    imageView.AnimationDuration\
  \ = 4;\n    imageView.AnimationRepeatCount = 2;\n    imageView.StartAnimating();\n\
  \    window.AddSubview(imageView);\n    window.MakeKeyAndVisible();\n    return\
  \ true;\n}\n```\n\n`UIImageView` 类还提供了一种通过 `Highlighted` 属性为设置图像显示高亮图像的方法。通常，你希望在用户触摸图像时提供一个高亮图像。要实现这一点，你可以创建自己的\
  \ `UIImageView` 类并重写 `TouchesBegan` 和 `TouchesEnded` 方法，分别将该属性设置为 `true` 和 `false`。你必须将\
  \ `UserInteractionEnabled` 属性设置为 `true`，以便它监听触摸事件。列表 10-3 展示了如何使用带有 `UIImageView`\
  \ 基类的新的 `MyImageView` 创建的初始设置。\n\n![download.eps](img/download_fmt.gif)\n\n####\
  \ 列表 10-3: 重写默认 UIImageView 方法\n\n```csharp\npublic override bool FinishedLaunching\
  \ (UIApplication app, NSDictionary options)\n{\n    var image = UIImage.FromFile(\"\
  image.png\");\n    var imageHighlighted = UIImage.FromFile(\"image2.png\");\n  \
  \  var imageView = new MyImageView(image, imageHighlighted);\n    imageView.Frame\
  \ = new RectangleF(0f, 20f, image.Size.Width, image.Size.Height);\n    imageView.UserInteractionEnabled\
  \ = true;\n    window.AddSubview(imageView);\n    window.MakeKeyAndVisible();\n\
  \    return true;\n}\n\n...\n\npublic class MyImageView : UIImageView\n{\n    public\
  \ MyImageView(UIImage image, UIImage imageHighlighted) : base(image, imageHighlighted)\n\
  \    {\n    }\n    public override void TouchesBegan (NSSet touches, UIEvent evt)\n\
  \    {\n        Console.WriteLine (\"Touches began\");\n        this.Highlighted\
  \ = true;\n    }\n    public override void TouchesEnded (NSSet touches, UIEvent\
  \ evt)\n    {\n        Console.WriteLine (\"Touches ended\");\n        this.Highlighted\
  \ = false;\n    }\n}\n```\n\n### 选择图像\n\n在许多应用程序中，上传图像的功能经常被用到。你想要的是允许用户上传他们相册中有的照片。`UIImagePickerController`\
  \ 被用作模态视图；这意味着用户只有选择图像或取消选择器的选项。\n\n当你创建 `UIImagePickerController` 时，你想要定义自己的代理（delegate），该代理将继承\
  \ `UIImageDelegate`。这使你能够重写类中的方法，并在需要重写这些方法的默认操作时进行操作。`UIImageDelegate` 提供了两个有用的重写方法和一个已弃用的方法：`Canceled`\
  \ 和 `FinishedPickingMedia`。`Canceled` 方法返回调用该方法的选择器。`FinishedPickingMedia` 方法也返回调用该方法的选择器以及一个信息字典。该字典包含了有关所选图像的键值对，你之后用它处理该图像。`FinishedPickingImage`\
  \ 方法已弃用；`FinishedPickingMedia` 接管了选择图像和视频的功能。列表 10-4 展示了如何使用 `UIImagePickerController`\
  \ 和 `UIImageDelegate` 显示你相册中的所有照片。\n\n![download.eps](img/download_fmt.gif)\n\n\
  #### 列表 10-4: 开始使用 UIImagePickerController\n\n```csharp\npublic partial MainViewController\
  \ : UIViewController\n{\n    public override void ViewDidLoad ()\n    {\n      \
  \  base.ViewDidLoad (); \n        UIButton button = UIButton.FromType(UIButtonType.RoundedRect);\n\
  \        button.Frame = new RectangleF(0f, 30f, 320, 40f);\n        button.SetTitle(\"\
  Select Image\", UIState.Normal);\n        button.TouchUpInside += delegate(object\
  \ sender, EventArgs e) {\n            UIImagePickerController picker = new UIImagePickerController();\n\
  \            picker.Delegate = new MyImagePickerDelegate(this);\n            this.PresentModalViewController(picker,\
  \ true);\n        };\n        this.View.AddSubview(button);\n    }\n}\n\npublic\
  \ class MyImagePickerDelegate : UIImagePickerControllerDelegate\n{\n    MainViewController\
  \ _mvc;\n    public MyImagePickerDelegate(MainViewController mvc)\n    {\n     \
  \   _mvc = mvc;\n    }\n    public override void Canceled (UIImagePickerController\
  \ picker)\n    {\n        _mvc.DismissModalViewControllerAnimated(true);\n     \
  \   Console.WriteLine (\"Cancelled picking an image\");\n    }\n    public override\
  \ void FinishedPickingMedia (UIImagePickerController picker, NSDictionary info)\n\
  \    {\n        _mvc.DismissModalViewControllerAnimated(true);\n        foreach\
  \ (var key in info.Keys)\n            Console.WriteLine(key + \" = \" + info[key]);\n\
  \    }\n}\n```\n\n列表 10-4 使用按钮显示图像选择器；然而，这可以连接到任何类型的控件上。你可能会注意到自定义图像选择器代理将当前视图控制器传递到代理构造函数。这样当图像选择器被取消或选择了图像时，你可以修改当前视图以反映这一点，例如从屏幕上移除图像选择器并显示所选图像。在事件触发后移除图像选择器，只需对传递的视图控制器使用\
  \ `DismissModalViewControllerAnimated` 方法即可。图 10-2 展示了默认 `UIImagePickerController`\
  \ 的外观。\n\n图 10-2\n\n![f1002.tif](img/f1002_fmt.jpg)\n\n图像选择与模拟器\n\n模拟器默认不包含任何图像。导致导致无法从图像选择器中选择图像。要添加图像，你可以使用内置的\
  \ Safari 选择图像并将其保存到模拟器。保存的图像随后就会出现在模拟器中。\n\n\n\n\n\n一旦选取了图像，你就想要从 `info` 字典中获取信息，并处理对所选图像的操作。该字典使用了\
  \ `UIImagePickerControllerMediaType`、`UIImagePickerControllerOriginalImage`、`UIImagePickerControllerEditedImage`、`UIImagePickerControllerCropRect`\
  \ 和 `UIImagePickerControllerMediaURL` 键。该字典并不包含列出的所有键，因此在使用它们之前，你需要检查它们是否存在。这些键的存在取决于图像是否经过编辑以及该图像实际上是否为视频。\n\
  \n目前，你将只会使用 `UIImagePickerControllerMediaType` 和 `UIImagePickerControllerOriginalImage`\
  \ 键，因为当你从相册中选择图像时，提供的仅这些信息。在 `info` 字典上使用 `UIImagePickerControllerOriginalImage`\
  \ 键会返回一个 `NSObject`。你需要将键创建为 Objective-C 风格的对象，由于你正在直接与 Objective-C 绑定交互，因此必须使用\
  \ `NSString` 而不仅仅是 `String`。由于你知道这是一个 `UIImage` 对象，可以将其转换为该类型。为了显示这张被选取的图像，Listing\
  \ 10-5 还将新选取的图像放置在图像视图中。\n\n![download.eps](img/download_fmt.gif)\n\nListing 10-5:\
  \ 处理选取的图像\n\n```csharp\npublic override void FinishedPickingMedia (UIImagePickerController\
  \ picker, NSDictionary info)\n{\n    var originalImage = new NSString(\"UIImagePickerControllerOriginalImage\"\
  );\n    UIImage image = (UIImage) info[originalImage];\n    UIImageView imageView\
  \ = new UIImageView(new RectangleF(0f, 0f, 320f, 460f));\n    imageView.Image =\
  \ image;\n    _mvc.View.AddSubview(imageView);\n    _mvc.DismissModalViewControllerAnimated(true);\n\
  \    Console.WriteLine (\"Did finish picking media\");\n}\n```\n\n有时，你可能希望在提供图像选择器时限制用户获取图像的来源。三种不同的源类型在\
  \ `UIImagePickerControllerSourceType` 枚举中定义为 `SavedPhotosAlbum`、`PhotoLibrary` 和\
  \ `Camera`。\n\n- `SavedPhotosAlbum` 是从外部源（如 `Safari` 或通过其他应用程序）保存的图像列表，并且不是从相机创建的。\n\
  - `PhotoLibrary` 包含所有用相机拍摄的照片以及所有可能同步到设备上的照片。\n- `Camera` 源触发器表示图像源将是直接从相机拍摄的照片。\n\
  \n![warning.ai](img/warning_fmt.gif)\n\n通过应用程序使用相机拍摄的图像不会持久存在其他照片库中，因此保存原始图像是一个好主意。\n\
  \n### 从相机创建图像\n\n使用相机拍摄图像可以是根据需要从用户那里获取即时图像的一种极方法。由于 iPod Touch 设备不包含相机，因此你需要检查用户是否可以在应用程序内部使用相机功能。`UIImagePickerController`\
  \ 提供了通过编程实现此功能的方法，因此你可以在发生这种情况时进行处理。\n\n![note.ai](img/note_fmt.gif)\n\niPhone 模拟器不支持相机功能；因此，你需要在实际设备上进行任何摄像机的测试。\n\
  \n要通过编程方式检查此功能，你使用静态方法 `IsSourceTypeAvailable` 并传递你想要确定是否可用的源类型。在这个示例中，你传递了 `UIImagePickerControllerSourceType`\
  \ 枚举中的 `Camera` 源类型。一旦你成功发现相机存在，只需将 `UIImagePickerController` 的源类型设置为 `Camera`。如果相机不存在，你只需显示错误消息。Listing\
  \ 10-6 展示了验证相机存在并显示它的方法。\n\n![download.eps](img/download_fmt.gif)\n\nListing 10-6:\
  \ 从相机选取图像\n\n```csharp\nvar cameraType = UIImagePickerControllerSourceType.Camera;\n\
  if(UIImagePickerController.IsSourceTypeAvailable(cameraType))\n{\n    UIImagePickerController\
  \ picker = new UIImagePickerController();\n    picker.SourceType = cameraType;\n\
  \    picker.Delegate = new ImagePickerDelegate(this);\n    this.PresentModalViewController(picker,\
  \ true);\n}\nelse\n{\n    using (var alert = new UIAlertView(\"Whoops\", \"No camera\"\
  , null))\n    {\n        alert.Show();\n    }\n}\n```\n\n\n\n\n\n# 在使用相机时叠加视图\n\n\
  Listing 10-7\n\n```cs\nvar cameraType = UIImagePickerControllerSourceType.Camera;\n\
  \npicker = new UIImagePickerController();\n\npicker.SourceType = cameraType;\n\n\
  picker.ShowsCameraControls = false;\n\npicker.CameraOverlayView = new MyOverlayView(this);\n\
  \npicker.Delegate = new MyImagePickerDelegate(this);\n\nthis.PresentModalViewController(picker,\
  \ true);\n\n...\n\npublic class MyOverlayView : UIView\n{\n   public MyOverlayView\
  \ (MainViewController mvc)\n   {\n      this.Frame = new RectangleF(0f, 0f, 320f,\
  \ 480f);\n      UIButton button = UIButton.FromType(UIButtonType.RoundedRect);\n\
  \      button.SetTitle(\"Take a Photo\",UIControlState.Normal);\n      button.Frame\
  \ = new RectangleF(0f, 420f, 320f, 40f);\n      button.TouchUpInside += delegate(object\
  \ sender, EventArgs e) {\n         mvc.picker.TakePicture();\n         Console.WriteLine\
  \ (\"Took a picture!\");\n      };\n      this.AddSubview(button);\n   }\n}\n```\n\
  \nListing 10-7 使用了一个继承自 `UIView` 基类的简单自定义视图。要将自定义视图设置为相机叠加层，你需要创建你的叠加视图的新实例，并将其传递给\
  \ `CameraOverlayView` 属性。在构造函数中，你传入了正在选择器控件内部使用的视图。这允许你调用当前控制器并使用 `TakePicture`\
  \ 方法程序化地拍摄照片。这在 Listing 10-7 中的**粗体行**所示。Figure 10-6 显示了叠加后的按钮图像。\n\n`UIImagePickerController`\
  \ 还提供了 `CameraViewTransform` 属性。这允许你使用 `CGAffineTransform` 方法（如 `MakeScale` 和 `MakeRotate`）传递一个变换。你可能已经注意到移除相机控件后屏幕底部会留下一黑条。这是因为相机与屏幕的宽高比不同。你可以选择地使用以下片段中的代码通过\
  \ `CameraViewTransform` 属性缩放相机视图，使相机适应整个屏幕。然而，这可能会略微扭曲图像。`MakeScale` 方法的第一个参数是 x\
  \ 坐标的缩放比例，第二个参数是 y 坐标的缩放比例。要让相机填充屏幕，你只需按 1.13 的比例缩放 y 坐标。\n\n```cs\npicker.CameraViewTransform\
  \ = CGAffineTransform.MakeScale(1f, 1.13f);\n```\n\nFigure 10-6\n\n![f1006.tif](img/f1006_fmt.jpg)\n\
  \n使用此变换的结果如 Figure 10-7 所示。\n\nFigure 10-7\n\n![f1007.tif](img/f1007_fmt.jpg)\n\n\
  ## 保存图像到相册\n\n要将图像保存到照片库，你首先想要实例化一个新的 `UIImage` 对象。在 `UIImage` 类上有一个名为 `SaveToPhotosAlbum`\
  \ 的方法。相册有一个特殊的文件夹，专门用于从外部源（例如 Safari 或通过应用程序）保存的图像，而不是通过内置相机拍摄的。\n\n`SaveToPhotosAlbum`\
  \ 方法接收委托，允许它回传保存的图像，或者在尝试保存图像时发生错误返回一个 `NSError` 对象。你可以检查 `NSError` 是否返回空；如果是，你就知道图像已保存成功。Listing\
  \ 10-8 显示了你如何将项目中的一个静态文件保存到相册。\n\n![note.ai](img/note_fmt.gif)\n\n确保图像包含在项目中，并将其生成操作设置为\
  \ `Content`。\n\nFigure 10-8 显示了没有任何照片的选取器。在使用 Listing 10-8 中的代码保存照片后，你可以看到 Figure\
  \ 10-9 显示了带有新增图像的相同选取器。\n\nFigure 10-8\n\n![f1008.tif](img/f1008_fmt.jpg)\n\nFigure\
  \ 10-9\n\n![f1009.tif](img/f1009_fmt.jpg)\n\nListing 10-8 保存图像到相册\n\n```cs\nUIImage\
  \ imageFile = UIImage.FromFile(\"image.png\");\n\nimageFile.SaveToPhotosAlbum(delegate\
  \ (UIImage image, NSError error) {\n   Console.WriteLine (\"Saved to photo album\"\
  );\n});\n\n## 视频\n\n视频功能因设备而异。所有设备都允许播放视频，但只有 iPhone 3GS 设备允许录制视频。API 允许你检测设备情况，从而创建一个良好的体验。本节将讨论如何将视频集成到应用程序中以及如何使用某些设备录制视频。\n\
  \n### 播放视频\n\niOS 提供了一个简单的控制器在应用程序内播放视频。`MPovieController` 类位于 `MonoTouch.MediaPlayer`\
  \ 命名空间，提供了播放、准备播放和停止电影的功能。Listing 10-9 显示了如何启动视频。第一行显示了实例化一个新的播放器，在构造函数中传入视频文件路径，第二行简单地调用\
  \ `Play` 方法，它会显示播放器并开始播放视频。\n\n```cs\nvar player = new MPMovieController(NSUrl.FromFilename(\"\
  video.mp4\"));\n\nplayer.Play();\n```\n\nListing 10-9 从文件播放视频\n\n如果你更愿意使用外部视频并渐进式下载而不是直接从设备播放，你可以使用\
  \ `NSUrl` 方法 `FromString` 代替 `FromFilename` 并传入视频的 URL 位置。当然，你需要将 URL 字符串替换为你自己的外部视频。\n\
  \n```cs\nvar videoUrl = NSUrl.FromString(\"http://example.com/video.mp4\")\n\nvar\
  \ player = new MPMovieController(videoUrl);\n\nplayer.Play();\n```\n\n\n\n\n\n你使用\
  \ `NSNotificationCenter` 类中的 `DefaultCenter` 属性来添加观察者，这样当通知发生时，你的消息就会触发。你可以将观察者理解为在特定操作上添加事件的方法，使用字符串作为创建这些事件的方式，而不是你可能在\
  \ C# 中习惯的强类型事件。在这个示例中，你只需要使用通知 `MPMoviePlayerContentPreloadDidFinishNotification`\
  \ 和 `MPMoviePlayerPlaybackDidFinishNotification`。另一个通知名为 `MPMoviePlayerScalingModeDidChangeNotification`。你可以添加两个\
  \ `NSObject` 类型的类变量，它们可以是你的 `preload`（预加载）和 `playback`（播放完成观察者。使用 `AddObserver`\
  \ 方法，你为每个观察者传递一个动作方法，该方法会在通知被调用时运行。你可以使用 Lambda 表达式将此代码内联放置。当预加载通知触发时，你只想开始播放视频，因此你在你的\
  \ `MPMoviePlayerController` 上调用 `Play`；当播放完成通知触发时，你想要移除观察者并清理播放器实例。你可以使用活动指示器（activity\
  \ indicator）来确保用户在应用程序启动时知道你正在预加载视频。Listing 10-10 显示了实现此操作的示例代码。再次，你需要确保更改第八行的 URL\
  \ 以指向你选择的外部视频。\n\n![download.eps](img/download_fmt.gif)\n\n### Listing 10-10](#9780470908594c10.xhtml_listinganchor10-10):\
  \ 使用电影播放器观察者\n\n```csharp\nMPMoviePlayerController moviePlayer;\n\nNSObject didFinishPreload,\
  \ didFinishPlayback;\n\npublic override void ViewDidLoad()\n{\n    base.ViewDidLoad\
  \ ();\n    var videoUrl = NSUrl.FromString(\"http://example.com/video.mp4\");\n\
  \    moviePlayer = new MPMoviePlayerController(videoUrl);\n    activityIndicator.StartAnimating();\n\
  \    var centre = NSNotificationCenter.DefaultCenter;\n    var preloadFinish = \"\
  MPMoviePlayerContentPreloadDidFinishNotification\";\n    didFinishPreload = centre.AddObserver(preloadFinish,\n\
  \        (notify) => {\n            Console.WriteLine (\"Start playing movie\");\n\
  \            activityIndicator.StopAnimating();\n            moviePlayer.Play();\n\
  \        });\n    var playbackFinished = \"MPMoviePlayerPlaybackDidFinishNotification\"\
  ;\n    didFinishPlayback = centre.AddObserver(playbackFinished,\n        (notify)\
  \ => {\n            Console.WriteLine (\"Movie finished, Clean up\");\n        \
  \    centre.RemoveObserver(didFinishPreload);\n            centre.RemoveObserver(didFinishPlayback);\n\
  \            activityIndicator.Hidden = true;\n            moviePlayer.Dispose();\n\
  \            moviePlayer = null;\n        }); }}\n```\n\n## 定制视频播放器\n\n电影播放器提供的功能相当有限，仅允许根据你的需要微调两个属性。这些属性是\
  \ `ScalingMode`（缩放模式）和 `MovieControlMode`（电影控制模式）。\n\n缩放模式设置播放视频的宽高比例。可选选项有 `Fill`、`AspectFill`、`AspectFit`\
  \ 和 `None`。\n\n*   `Fill` 正如其名，用你的视频填充屏幕，使视频的两个边缘都适应屏幕，但宽高比例可能保持不变。\n*   `AspectFill`\
  \ 在填充屏幕时不会歪斜你的视频，但它会裁剪你的视频，使视频完全充满屏幕而不留任何间隙。\n*   `AspectFit` 保持视频相同的宽高比例，并尽可能让视频的一条边适应屏幕，但如果视频不能完全拟合，它可能会暴露背景视图。\n\
  *   `None` 完全不尝试适应视频，并以其原始尺寸播放。\n\n使用 `MPMovieScalingMode` 枚举，你可以将 `ScalingMode`\
  \ 设置为列表中的任何选项。请参见图 10-10 到 10-13 获取每种缩放模式的示例。播放器的背景被设置为蓝色（在你查看的图表的打印版本中显示为浅灰色），这样你就可以看到视频尺寸与播放器尺寸之间的差异。注意，在这个例中，Aspect\
  \ Fit 和 Fill 是相同的。这是因为视频的比例允许视频边缘适应屏幕，而不需要更改宽高比例。\n\nFigure 10-10\n![f1010.tif](img/f1010_fmt.jpg)\
  \ 图 10-1\n![f1011.tif](img/f1011_fmt.jpg) 图 10-2\n![f1012.tif](img/f1012_fmt.jpg)\
  \ 图 10-3\n![f1013.tif](img/f1013_fmt.jpg) 图 10-4\n\n你可以为视频播放器修改的另一个属性是 `MovieControlMode`\
  \ 属性。使用 `MPovieControlMode` 枚举，你可以将控制模式设置为 `Default`（默认）、`Hidden`（隐藏）或 `VolumeOnly`（仅音量）。图\
  \ 10-14 到 10-15 显示了这些模式。`Default`、`Hidden` 和 `VolumeOnly` 模式允许你控制控件的显示。`Hidden`\
  \ 会隐藏所有控制控件，`VolumeOnly` 只保留音量控制。\n\n\n\n\n为了允许用户从存储在设备上的视频列表中进行选择，你使用了在本章早些部分熟悉的\
  \ `UIImagePickerController`。由于 iPhone 的视频功能与相机功能非常相似，看到视频功能是 `UIImagePickerController`\
  \ 类的一部分并不为意外。在代码列表 10-6 中，你使用了 `IsSourceTypeAvailable` 方法来判断设备是否具有相机。由于视频功能仅限于 iPhone\
  \ 3GS 型，仅仅知道是否有相机是不够的。这时 `UIImagePickerController` 类上的静态方法 `AvailableMediaTypes`\
  \ 就派上用场了。\n\n`AvailableMediaTypes` 方法接受一个源类型，并返回设备可用的媒体类型数组。图像的媒体类型为 `public.image`，视频的类型为\
  \ `public.movie`。如果该方法返回 `public.movie` 类型，你可以将 `UIImagePickerController` 实例的 `MediaTypes`\
  \ 属性设置为仅包含 `public.movie` 媒体类型。代码列表 10-12 展示了如何这样设置选择器。\n\n![download.eps](img/download_fmt.gif)\n\
  \n代码列表 10-12: 使用图像选择器控制器选取视频\n\n```objc\nif (HasVideoSupport())\n{\n    UIImagePickerController\
  \ picker = new UIImagePickerController();\n    picker.SourceType = UIImagePickerControllerSourceType.PhotoLibrary;\n\
  \    picker.MediaTypes = new []{\"public.movie\"};\n    picker.Delegate = new MyImagePickerDelegate(this);\n\
  \    this.PresentModalViewController(picker, true);\n}\nelse\n{\n    using (var\
  \ alert = new UIAlertView(\"Whoops\", \"No video support found\", null, \"Ok!\"\
  , null))\n    {\n        alert.Show();\n    }\n}\n...\n\nbool HasVideoSupport()\n\
  {\n    var cameraType = UIImagePickerControllerSourceType.Camera;\n    var cameraSupport\
  \ =\n        UIImagePickerController.IsSourceTypeAvailable(cameraType);\n    return\
  \ (!cameraSupport) ? false :\n        UIImagePickerController.AvailableMediaTypes(cameraType).Contains(\"\
  public.movie\");\n}\n```\n\n当你显示选择器时，请注意你只看到视频，因为它们是你唯一可以选择的媒体类型。图 10-17 显示了如何显示一个仅限视频的选择器。\n\
  \n图 10-17\n\n![f1017.tif](img/f1017_fmt.jpg)\n\n当选取视频时，它将使用与图像选择器相同的回调：`FinishedPickingMedia`。`NSDictionary`\
  \ 被填充了两个键：`UIImagePickerControllerMediaURL` 和 `UIImagePickerControllerMediaType`。媒体\
  \ URL 包含一个 `NSUrl` 对象，指向所选视频的临时位置。这就是你可以处理视频的地方——可以通过将其移动到 Documents 目录或以其他方式使用。临时视频存储在应用程序的\
  \ `tmp` 目录中，并由操作系统在认为合适的时间进行清理。\n\n### 录制视频\n\n使用 iPhone 录制视频与使用 iPhone 拍摄照片非常相似。从上一个示例中，你只需要将源类型设置为相机而不是默认的照片库，就可以准备好录制视频而不是拍照了。当然，这前提是你已经使用\
  \ `AvailableMediaTypes` 方法检查了设备是否可以录制视频。请注意，相机控件会发生变化，以反映你正在录制视频而不是拍照。你可以选择性地通过将\
  \ `ShowsCameraControls` 设置为 `false` 来隐藏相机控件；然而，在写作期间，没有方法在不使用默认相机控件的情况下通过编程录制视频。代码列表\
  \ 10-13 是设置 `UIImagePickerController` 以录制视频的示例。图 10-18 显示了视频录制屏幕。\n\n![download.eps](img/download_fmt.gif)\n\
  \n代码列表 10-13: 录制视频\n\n```objc\npublic override void ViewDidLoad ()\n{\n    base.ViewDidLoad\
  \ ();\n    UIButton button = UIButton.FromType(UIButtonType.RoundedRect);\n    button.Frame\
  \ = new RectangleF(0f, 30f, 320, 40f);\n    button.SetTitle(\"Record Video\", UIState.Normal);\n\
  \    button.TouchUpInside += delegate (object sender, EventArgs e) {\n        var\
  \ cameraType = UIImagePickerControllerSourceType.Camera;\n        if (HasVideoSupport())\n\
  \        {\n            UIImagePickerController picker = new UIImagePickerController();\n\
  \            picker.SourceType = cameraType;\n            picker.MediaTypes = new\
  \ []{\"public.movie\"};\n            picker.Delegate = new MyImagePickerDelegate(this);\n\
  \            picker.PresentModalViewController(picker, true);\n        }\n     \
  \   else\n        {\n            using (var alert = new UIAlertView(\"Whoops\",\
  \ \"No video support found\", null, \"Ok!\", null))\n            {\n           \
  \     alert.Show();\n            }\n        }\n    };\n    this.View.AddSubview(button);\n\
  }\n\nbool HasVideoSupport()\n{\n    var cameraType = UIImagePickerControllerSourceType.Camera;\n\
  \    var cameraSupport =\n        UIImagePickerController.IsSourceTypeAvailable(cameraType);\n\
  \    return (!cameraSupport) ? false :\n        UIImagePickerController.AvailableMediaTypes(cameraType).Contains(\"\
  public.movie\");\n}\n```\n\n图 10-18\n\n![f1018.tif](img/f1018_fmt.jpg)\n---\n\n\
  ### 编辑视频\n\n正如你通过 `UIImagePickerController` 允许编辑图像一样，你在录制或选取视频时也可以将 `AllowEditing`\
  \ 属性设置为 `true`。这在你从图像选择器中选取时提供了一个剪辑视频的界面。与编辑图像不同，当编辑完成后，你只会得到一个临时剪辑或编辑过的视频，而不是原始视频。创建的视频最终会被设备自动清理，因此你想将视频保存到另一个地方。`UIImagePickerControllerMediaURL`\
  \ 对象类型为 `NSUrl`，你需要将该对象转换为 `NSUrl` 以提取定位文件所需的 `Path` 属性。图 10-19 显示了图像选择器视频编辑器的界面。\n\
  \n![f1019.tif](img/f1019_fmt.jpg)\n\n然而，视频选择器不是推荐的视频编辑方式。对于编辑，最好使用专门的 `UIVideoEditorController`\
  \ 类。视频编辑器控制器向你展示了一个与图像选择器器类似的编辑窗口。然而，请注意用户有两个选项可以选择：取消和保存。你在 `UIVideoEditorController`\
  \ 类中暴露了三个不同的事件：\n\n\n\n\n\n*   `UserCancelled`: 处理用户点击“取消”的情况。\n*   `Saved`: 处理用户点击“保存”的情况。\n\
  *   `Failed`: 当发生意外错误时触发，例如视频格式不，无法编辑。\n\n`Saved` 事件返回编辑后的视频文件路径，`Failed` 事件返回一个\
  \ `NSError` 对象，而 `UserCancelled` 事件不返回任何额外信息。如果你需要获取原始文件路径，可以始终将 `sender` 强制转换为\
  \ `UIVideoEditorController` 对象并使用 `VideoPath` 属性。\n\n![note.ai](img/note_fmt.gif)\n\
  \n视频编辑器只能在竖屏模式下使用。\n\n通过视频编辑器，你可以通过分别设置 `VideoQuality` 和 `VideoMaximumDuration`，将编辑后的视频设置为较低画质，并强制使编辑后的视频达到设定的最大长度。\n\
  \n创建一个视频编辑界面非常简单。你只需要实例化一个新的 `UIVideoEditorController`，将 `VideoPath` 属性设置为你想要编辑的视频路径，然后以模态视图的形式显示视频编辑器。由于你不知道运行应用程序的\
  \ iPhone 是否支持编辑视频，因此你想要使用视频编辑器的静态方法 `CanEditVideoAtPath`。传入视频路径，如果该视频可以编辑，则返回 `true`。代码列表\
  \ 10-14 显示了创建一个专用视频编辑界面的示例，图 10-20 显示了 `UIVideoEditorController` 界面的界观。\n\n图 10-20\n\
  \n![f1020.tif](img/f1020_fmt.jpg)![download.eps](img/download_fmt.gif)\n\n代码列表 10-14:\
  \ 使用专用的视频编辑界面\n\n```\nif(UIVideoEditorController.CanEditVideoAtPath(ChosenVideoPath))\n\
  {\n    var videoEditor = new UIVideoEditorController();\n    videoEditor.VideoPath\
  \ = ChosenVideoPath;\n    videoEditor.Saved += delegate(object sender, UIPathEventArgs\
  \ e) {\n        this.DismissModalViewControllerAnimated(true);\n        // Handle\
  \ edited video with e.Path\n    };\n    videoEditor.Failed += delegate(object sender,\
  \ NSErrorEventArgs e) {\n        this.DismissModalViewControllerAnimated(true);\n\
  \        // Handle error here with e.Error\n    };\n    videoEditor.UserCancelled\
  \ += delegate(object sender, EventArgs e) {\n        this.DismissModalViewControllerAnimated(true);\n\
  \        // Handle cancel\n    };\n    this.PresentModalViewController(videoEditor,\
  \ true);\n}\n```\n\n### 将视频保存到保存的照片册\n\n在将图像保存到保存的相册时，你使用 `UIImage` 类上的静态方法来保存文件。由于对视频文件的所有引用都是使用路径而不是内存中的对象，`UIVideo`\
  \ 静态类提供了你将视频保存到相册所需的方法。如你所知，视频功能仅限于某些设备，因此在将视频保存到相册之前，你需要检查设备是否真的可以将视频保存到其相册。静态方法\
  \ `IsCompatibleWithSavedPhotosAlbum` 提供了此功能，如果你传入一个可以保存到相册的视频路径，它将返回 `true`。\n\n\
  要将视频保存到相册，一旦你确认设备确实可以保存视频，你就可以使用 `UIVideo` 类上的 `SaveToPhotosAlbum` 静态方法。你传入想要保存的视频路径以及一个在视频保存后触发的回调。代码列表\
  \ 10-15\n\n代码列表 10-15: 将视频保存到相册\n\n```\nvar videoPath = videoSavePath;\nif(UIVideo.IsCompatibleWithSavedPhotosAlbum(videoPath))\n\
  {\n    UIVideo.SaveToPhotosAlbum(videoPath, delegate (string path, \n    {\n   \
  \     // ... implementation details\n    });\n}\n```\n（注：代码列表 10-15 提供的源代码在输入中是碎片化的；已根据提供的逻辑进行了清理。）\n\
  \n\n\n\n\n| 方法 | 说明 |\n| :--- | :--- |\n| `PrepareToPlay()` | 准备播放的音频。如果没有显式调用此方法，则\
  \ `Play()` 方法会调用此方法。 |\n| `Stop()` | 停止音频播放并要求再次调用 `PrepareToPlay()`。 |\n| `UpdateMeters()`\
  \ | 更新 `AveragePower` 和 `PeakPower` 的值。需要将 `MeteringEnabled` 设置为 true。 |\n\n要播放一个简单的音轨，你可以通过静态方法\
  \ `FromUrl` 实例化一个新的 `AVAudioPlayer`。使用此方法时，你传递了想要播放的音频文件的位置，类似于你使用 `SystemSound`\
  \ 类的方式。你可以选择性地使用 `FromData` 方法传递一个包含音频数据的 `NSData` 对象。一旦实例化该类，你就可以直接调用 `Play` 方法，该方法反过来会先调用\
  \ `PrepareToPlay` 方法开始播放音频。你使用 `FinishedPlaying` 代理在音频文件播放完成后清理音频播放器。Listing 10-17\
  \ 展示了播放长音频文件的方法。\n\n![download.eps](img/download_fmt.gif)\n\nListing 10-17: 播放较长的音频\n\
  \n```csharp\nvar audioFile = NSUrl.FromFilename(\"audio.caf\");\n\nvar audioPlayer\
  \ = AVAudioPlayer.FromUrl(audioFile);\n\naudioPlayer.Play();\n\n// ... 代码保持不变 ...\n\
  ```\n\n# 录制音频\n\n为了在你的应用程序中使用录制功能，你需要使用 `AVAudioRecorder` 类。要创建一个新的音频录制器，你使用静态方法\
  \ `ToUrl`，它期望一个保存录制音频的路径、一个包含录制设置的 `NSDictionary` 以及一个 `NSError` 对象。\n\n首先，你构造两个\
  \ `Object` 数组。第一个对象数组包含表示设置值的 `NSNumber` 对象，第二个数组表示设置的键。使用 `NSDictionary` 的静态方法\
  \ `FromObjectsAndKeys`，你传入这两个数组，从而填充设置 `NSDictionary`。\n\n现在设置字典已经设置好，你需要为录制的音频文件设置一个位置。因为在进行\
  \ iPhone 备份时会保存 Documents 文件夹，所以在示例中我们将其保在那里。你可以使用 `Environment.GetFolderPath` 方法获取\
  \ Documents 文件夹，然后简单地使用 `Path.Combine` 方法将 Documents 文件夹与要保存的音频文件名拼接。\n\n一旦设置好 `AVAudioRecorder`，你就可以调用\
  \ `Record` 开始录制，然后调用 `Stop` 停止录制；或者你可以使用 `RecordFor` 方法并传入你想要录制的秒数。你使用 `FinishedRecording`\
  \ 事件来通知你录制何时完成，以便你清理所创建的 `AVAudioRecorder`。你还可以检查刚刚录制的音频文件是否存在，并创建一个按钮允许你播放录制的文件。Listing\
  \ 10-18 展示了如何录制 5 秒钟的音频。\n\n![download.eps](img/download_fmt.gif)\n\nListing 10-18:\
  \ 在代码中录制音频\n\n```csharp\n// ... 代码保持不变 ...\n```\n\n# 动画\n\n使用 iPhone 进行动画是一个大课题，并且可以很容易地实现视图。以下示例展示了如何创建动画。\n\
  \n## 创建基础动画\n\n作为一个简单的动画示例，你要创建一个新的动画，让它从屏幕顶部移动到底部。为了执行这种基础动画，你需要熟悉以下概念：\n\n- 键路径（Key\
  \ path）：指向控制器的属性。你可以通过字符串路径而不是强类型属性来访问它。\n- `CALayer`：层包含对象的属性，例如位置和透明度。\n- `CABasicAnimation`：一个用于动画对象属性的类，例如标签的透明度或\
  \ Y 位置。\n\n要开始，你需要根据特定的键路径创建一个 `CABasicAnimation` 对象。键路径是代表 `CALayer` 属性的字符串。键路径示例包括\
  \ `position.y`、`transform.translation.x` 和 `opacity`。以下是你可以动画的 `CALayer` 属性列表：\n\
  \n- `anchorPoint`\n- `backgroundColor`\n- `borderColor`\n- `borderWidth`\n- `bounds`\n\
  - `contents`\n- `contentsRect`\n- `cornerRadius`\n- `doubleSided`\n- `hidden`\n\
  - `masksToBounds`\n- `opacity`\n- `position`\n- `sublayers`\n- `sublayerTransform`\n\
  - `transform`\n- `zPosition`\n\n当你对层进行动画时，使用键路径以及 `From`、`To` 和 `By` 属性来设置动画。\n\n\
  因为你想让标签从屏幕顶部移动到底部，你首先应该创建标签并将其放在视图上。为了让标签从视图顶部移动到视图底部，你想要在 Y 轴上平移标签 420 像素（这位于 iPhone\
  \ 的底部）。在创建 `CABasicAnimation` 对象时，使用静态方法 `FromKeyPath` 并传入 `transform.translation.y`\
  \ 作为将使用的键路径。\n\n所有动画都有明确的时间，所以你需要设置 `Duration` 属性。对于这个示例，它将是 3 秒。你可能不希望标签留在屏幕底部，因此你可以将\
  \ `AutoReverses` 属性设置为 `true`，这样当动画完成后，它会返回顶部。\n\n\n\n\n\n# 动画\n\n现在动画已经创建完成，你可以将其应用于你先创建的标签上。每个\
  \ `UIView` 对象都有一个 `Layer` 属性，它允许你动画化任何你想要的 `UIView` 对象。在本示例中，你将使用 `Layer` 属性上的 `AddAnimation`\
  \ 方法，并传入你新创建的动画以及该动画的唯一键（key）。将动画添加到层将立即启动动画。\n\n你可能想在动画开始或结束时触发一个事件。你可以通过创建自己的\
  \ `CAAnimationDelegate` 类并将其作为所创建动画的代理来实现。通过重写 `AnimationStarted` 和 `AnimationStopped`\
  \ 方法，可以更新标签的文本以反映动画状态。\n\nListing 10-19 显示了标签简单动画的代码，标签从屏幕顶部移动到底部再回到顶部。\n\n![download.eps](img/download_fmt.gif)\n\
  \nListing 10-19: 简单动画\n\n```csharp\npublic override void ViewDidLoad()\n{\n    base.ViewDidLoad();\n\
  \    var label = new UILabel(new RectangleF(0f, 20f, 320f, 40f));\n    label.TextAlignment\
  \ = UITextAlignment.Center;\n    label.Text = \"Example Label\";\n    this.View.AddSubview(label);\n\
  \    var animation = CABasicAnimation.FromKeyPath(\"transform.translation.y\");\n\
  \    animation.To = NSNumber.FromFloat(420f);\n    animation.Duration = 3;\n   \
  \ animation.AutoReverses = true;\n    animation.Delegate = new MyAnimationDelegate(label);\n\
  \    label.Layer.AddAnimation(animation, \"moveToBottomAndBack\");\n}\n\n...\n\n\
  public class MyAnimationDelegate : CAAnimationDelegate\n{\n    public UILabel Label\
  \ { get; set; }\n    public MyAnimationDelegate(UILabel label)\n    {\n        Label\
  \ = label;\n    }\n    public override void AnimationStarted(CAAnimation anim)\n\
  \    {\n        Console.WriteLine(\"Animation Started\");\n        Label.Text =\
  \ \"Animation Started\";\n    }\n    public override void AnimationStopped(CAAnimation\
  \ anim, bool finished)\n    {\n        Console.WriteLine(\"Animation stopped.\"\
  );\n        Label.Text = \"Animation Stopped\";\n    }\n}\n```\n\n## 使用 UIView 动画\n\
  \n使用基础动画类是为 `UIView` 属性提供简单动画的良好方法。然而，为每个想要修改的属性都创建一个独立的动画可能会非常繁琐。通过使用 `UIView`\
  \ 类上的静态方法，你可以在一个动画中对一组控件和属性进行动画处理。\n\n在 Listing 10-19 中，你演示了标签到屏幕底部并返回顶部的动画。在本示例中，你将让之前创建的标签旋转并淡出，同时显示一个之前隐藏的按钮。Listing\
  \ 10-20 展示了如何在代码中实现此操作的示例。\n\n![download.eps](img/download_fmt.gif)\n\nListing 10-20:\
  \ 使用 UIView 的动画\n\n```csharp\nUILabel label;\nUIButton hiddenButton;\n\npublic override\
  \ void ViewDidLoad()\n{\n    base.ViewDidLoad();\n    label = new UILabel(new RectangleF(0f,\
  \ 20f, 320f, 40f));\n    label.TextAlignment = UITextAlignment.Center;\n    label.Text\
  \ = \"Example Label\";\n    this.View.AddSubview(label);\n    hiddenButton = UIButton.FromType(UIButtonType.RoundedRect);\n\
  \    hiddenButton.Frame = new RectangleF(0f, 60f, 320f, 40f);\n    hiddenButton.SetTitle(\"\
  Surprise!\", ControlState.Normal);\n    hiddenButton.Alpha = 0;\n    this.View.AddSubview(hiddenButton);\n\
  \n    UIView.Animate(3, () => {\n        label.Alpha = 0;\n        hiddenButton.Alpha\
  \ = 1;\n    }, () => {\n        label.Transform = CGAffineTransform.MakeRotation((float)Math.PI);\n\
  \    });\n}\n```\n\n\n\n\n\n你可能注意到，我们在这里使用的是 `NSUrl.FromString()` 而不是简单地 `new NSUrl()`。这是因为如果发生错误，使用构造函数会抛出异常，而\
  \ `FromString` 则会返回 `null`。\n\n你可以通过使用 `UIWebView` 将网站直接包含在你的应用程序中，而无需关闭应用程序，从而实现类似的解决方案。这在本书的前面的第\
  \ 4 章中介绍过。\n\n## 打开电子邮件\n\n打开电子邮件的操作与你期望通过 `mailto:` 协议运行的方式非常相似：\n\n```csharp\n\
  var url = NSUrl.FromString(\"mailto:chris@example.com\");\nUIApplication.SharedApplication.OpenUrl(url)\n\
  ```\n\n![warning.ai](img/warning_fmt.gif)\n\n哎。这段代码在模拟器上无法运行。模拟器没有内置邮件功能，因此你需要在设备上测试这段代码。你会发现，在拨打电话、发送短信以及与其他应用程序（包括第三方应用）进行交互时，情况也是一样的，因为这些应用程序可能没有安装在设备上。\n\
  \n`OpenUrl` 方法返回一个 `Boolean` 值，告诉你该方法是否成功运行。当方法没有成功运行时，你应该使用此信息来显示适当错误消息。\n\n正如\
  \ `mailto:` 协议所示，你还可以传递这些其他命令：`bcc`、`cc`、`subject` 和 `body`。这些会填充标准邮件模板中的必要字段。通常用于\
  \ `mailto:` 协议的 `from` 命令会被 iPhone SDK 忽略，因此它无法工作。这里有一个使用额外命令的示例：\n\n```csharp\n\
  var url = NSUrl.FromString(\"mailto:chris@example.com?cc=other@example.com&subject=Wrox&body=Monotouch\"\
  );\nUIApplication.SharedApplication.OpenUrl(url);\n```\n\n## 拨打电话\n\n使用 `tel:` 协议，你可以通过下面的\
  \ `NSUrl` 示例使用 iPhone 的内置电话功能。此示例显示了号码中的连字符，这些连字符会根据需要自动去除。\n\n```csharp\nvar url\
  \ = NSUrl.FromString(\"tel:+1-408-867-5309\");\nUIApplication.SharedApplication.OpenUrl(url);\n\
  ```\n\n## 发送短信/SMS\n\n`sms:` 协议允许你打开信息应用程序并为指定号码打开新消息。目前没有选项向新短信传递预定义的消息。第一个代码示例显示了如何直接在设备上打开短信列表：\n\
  \n```csharp\nvar url = NSUrl.FromString(\"sms:\");\nUIApplication.SharedApplication.OpenUrl(url);\n\
  ```\n\n下一个示例显示了如何使用传递的号码打开一条新短信：\n\n```csharp\nvar url = NSUrl.FromString(\"sms:1-408-537-6309\"\
  );\nUIApplication.SharedApplication.OpenUrl(url);\n```\n\n## 在地图应用中打开位置\n\n要从原生\
  \ iPhone 应用程序内部加载地图应用程序，你只需要使用指向 Google Maps 的普通网站链接即可。在创建 Google Maps URL 时，可以使用一些查询字符串参数，例如用于搜索查询的\
  \ `q`，以及分别用于源地址和目的地址的 `saddr` 和 `daddr`。此示例加载了英国曼彻的地图：\n\n```csharp\nvar url = NSUrl.FromString(\"\
  http://maps.google.com/maps?q=Manchester,UK\");\nUIApplication.SharedApplication.OpenUrl(url);\n\
  ```\n\n![note.ai](img/note_fmt.gif)\n\n如果你在模拟器中运行此代码，由于模拟器没有 Google Maps 应用程序，地图将在\
  \ Safari 中加载。在设备上，链接将在 Google Maps 应用程序中加载。\n\n在不关闭应用程序的情况下在自己的应用程序中包含网站的功能也可以 `MapKit`\
  \ API 实现。你可以在第 7 章查看如何使用它。\n\n## 打开 YouTube 视频\n\n正如你之前在地图示例中看到的，你只需要使用普通 URL 打开地图应用程序；当你想要播放\
  \ YouTube 视频时，这个原理也是相同的。你可以使用以下示例代码中两个 YouTube URL 中的任意一个。你需要使用视频标识符来播放视频。代码片段中的两个变量——`youTubeUrl1`\
  \ 和 `youTubeUrl2` 显示了可以打开 YouTube 视频的两种类型 URL 的示例。\n\n```csharp\nvar videoId = \"\
  QHy0nBYwIKM\";\nvar youTubeUrl1 = String.Format(\"http://youtube.com/watch?v={0}\"\
  , videoId);\nvar youTubeUrl2 = String.Format(\"http://youtube.com/v/{0}\", videoId);\n\
  var url = NSUrl.FromString(youTubeUrl2);\nUIApplication.SharedApplication.OpenUrl(url);\n\
  ```\n\n![note.ai](img/note_fmt.gif)\n\n就像上一节的 Google Maps 示例一样，在模拟器中，此示例中的链接会打开\
  \ Safari 并在其中播放视频，而在设备上它会打开 YouTube 应用程序。\n\n## 打开 iTunes Store 和 App Store\n\n\
  要在应用程序中打开 iTunes Store 和 App Store，你可以使用与你在桌面端 iTunes 或 App Store 上使用的相同的 URL。\n\
  \n```csharp\n// 这个 appStoreUrl 将打开 AppStore。\nvar appStoreString = \"http://itunes.apple.com/gb/app/34247961?mt=8\"\
  ;\nvar appStoreUrl = NSUrl.FromString(appStoreString);\n\n// 这个 iTunesUrl 将打开 iTunes\
  \ Store。\nvar iTunesString = \"http://itunes.apple.com/album/2751889\";\nvar iTunesUrl\
  \ = NSUrl.FromString(iTunesString);\nUIApplication.SharedApplication.OpenUrl(iTunesUrl);\n\
  ```\n\n## 第三方应用程序集成\n\n除了打开原生 Apple 应用程序，你还可以打开由第三方公司编写的应用程序。这些第三方应用程序需要暴露协议以允许这种交互（该方法将在下一节中解释）。因为应用程序可以自行选择实现协议的方式，所以它们也需要提供如何使用它们的文档。\n\
  \n寻找特定应用程序的网站以及如何实现其协议可能很难。幸运的是，名为 `www.handleurl.com` 的网站提供了很好的资源。这是一个社区驱动的网站，你可以在其中搜索想要交互的应用程序。以下示例显示了如何与来自\
  \ AppStore 的两个免费应用程序交互。\n\n## 与 Google Earth 的简单集成\n\niPhone 版 Google Earth 是你可能熟悉的桌面版\
  \ Google Earth 程序。通过 `www.handleurl.com` 上的信息，你可以看到打开 Google Earth 应用程序需要使用 `comgoogleearth:`\
  \ 协议。由于你无法依赖用户是否安装了该应用程序，是否有允许调用的版本，你可以使用 `CanOpenUrl` 方法进行判断。这个在 `UIApplication`\
  \ 实例上的静态方法在你只想在确定应用程序存在时才才情境地显示打开链接时非常有用。以下代码显示了如何使用它：\n\n```csharp\nvar application\
  \ = UIApplication.SharedApplication;\nvar url = NSUrl.FromString(\"comgoogleearth:\"\
  );\n\nif(application.CanOpenUrl(url))\n{\n    // 显示打开 Google Earth 应用的按钮。\n}\n```\n\
  \n由于你已经在在本章前面学习了 Apple 应用程序协议，加载 Google Earth 的运行方式正如你预期的一样，你可以使用下面的示例调用它：\n\n```csharp\n\
  var url = NSUrl.FromString(\"comgoogleearth:\");\nUIApplication.SharedApplication.OpenUrl(url);\n\
  ```\n\n## 进一步集成 Skype\n\n\n\n\n\n与 Google Earth 应用不同，Skype 应用在你想在 iPhone 上打开该应用时，提供了几个不同的选项供选择。Skype\
  \ 开发者区域列出了 Windows 版本的 Skype 处理的 URL 列表（完整列表请参见 [`bit.ly/skypeopenurl`](http://bit.ly/skypeopenurl)），但它没有提到任何关于\
  \ iPhone 上处理的 URL。通过一些尝试，该列表中可以在 iPhone 应用中完成正确操作的 URL 已所示在表 11-1 中。任何以 `skype:`\
  \ 开头的 URL 无论如何都会打开该应用。\n\nTable 11-1: Skype iPhone URL\n\n| URL | 动作 |\n| --- |\
  \ --- |\n| `skype:` | 打开 Skype 应用程序 |\n| `skype:echo123?call` | 拨打用户 echo123 |\n\
  | `skype:echo123?chat` | 与用户 echo123 开始聊天 |\n\n由于对于 Skype iPhone 应用支持何种 URL 结构没有官方说明，这可能会在任何时候在不经通知的情况下发生变化。可能会添加支持更多功能的额外\
  \ URL，因此最好不要过度依赖这些现有的内容。\n\n## 从其他应用程序接收调用\n\n让你的应用程序能够打开其他应用程序是非常有用的；然而，让你的应用程序能够被其他应用程序打开则可以创建许多其他有用的场景。\n\
  \n### 配置你的 Info.plist 文件\n\n要允许其他应用打开你的应用程序，你需要更新你的 `Info.plist` 文件。plist 文件本质上是一个由键值对组成的\
  \ XML 文件，描述了有关你应用程序的信息。在第 8 章中会有更详细的介绍。MonoDevelop 在你构建和运行应用程序时会自动生成此文件，但如果你想添加自定义设置，则需要从头开始创建。要操作，右键点击你的项目，并如图\
  \ 11-1 所示转到 Add ⇒ New File。\n\nFigure 11-1\n\n![f1101.tif](img/f1101_fmt.jpg)\n\n\
  此时会出现 New File 模板对话框。选择 iPhone Application Manifest Template 图标（参见图 11-2）。你会发现它已经命名为\
  \ `Info.plist`。\n\nFigure 11-2\n\n![f1102.tif](img/f1102_fmt.jpg)\n\n双击 `Info.plist`\
  \ 文件会弹出 Apple 的 Property List Editor（属性列表编辑器）。该程序有助于向 plist 文件中添加父节点和子 XML 节点。为了确保你的应用能正确响应来自其他应用程序的调用，你需要在\
  \ plist 文件中添加一个 URL 类型（URL types）的父节点。你还需要添加一个 URL 标识符字符串。当你调用它的 open URL schema\
  \ 时，此值会被发送到应用程序——这在章节的后续部分会变得更加清晰。通常，你会使用反向域名来保持 URL 标识符值的唯一性（例如，`com.chrisntr.myapp`）。除了添加\
  \ URL 标识符，你还需要在 URL Schemes 中添加一个节点。URL Schemes 是另一个应用在访问你的应用时调用的协议，例如 `skype` 或\
  \ `comgoogleearth`。对于本示例，该 scheme 是 `myapp:`。由于 `myapp:` 可能不是一个非常唯一的 scheme，最好也使用你的\
  \ URL 标识符作为额外的 scheme 来使用，以防发生冲突。图 11-3 显示了你的 plist 文件应该是什么样子。\n\nFigure 11-3\n\n\
  ![f1103.tif](img/f1103_fmt.jpg)\n\n我经常觉得 Property List Editor 有点繁琐，很难让它完全按照我的意愿运行。幸运的是，plist\
  \ 文件只是简单的 XML 文件——如果你在普通的文本编辑器中打开该文件，就可以很容易通过这种方式修改文件。Listing 11-1 是之前所示 `Info.plist`\
  \ 文件的原始文本示例。\n\n![download.eps](img/download_fmt.gif)\n\nListing 11-1: 原始 Info.plist\
  \ 文件\n\n```xml\n<?xml version=\"1.0\" encoding=\"UTF-8\"?>\n<!DOCTYPE plist PUBLIC\
  \ \"-//Apple//DTD PLIST 1.0//EN\"\n \"http://www.apple.com/DTDs/PropertyList-1.0.dtd\"\
  >\n<plist version=\"1.0\">\n<dict>\n    <key>CFBundleURLTypes</key>\n    <array>\n\
  \        <dict>\n            <key>CFBundleURLTypes</key>\n            <dict>\n \
  \               <key>CFBundleIdentifier</key>\n                <string>com.chrisntr.myapp</string>\n\
  \                <key>CFBundleURLSchemes</key>\n                <array>\n      \
  \              <string>myapp</string>\n                </array>\n            </dict>\n\
  \        </dict>\n    </array>\n</dict>\n</plist>\n```\n\n你可以在下载 的部分中找到这个 `Info.plist`。\n\
  \n### 实现 OpenURL Schema\n\n如果你已经尝试过 `UIApplication` 对象，你可能已经注意到 `HandleURL` 是暴露的。在\
  \ SDK 的第二个版本中，该方法是处理传入请求推荐的方法。在 SDK 的最新版本中（编写时为版本 3.1），`HandleURL` 已被带有 `NSDictionary`\
  \ 参数的 `FinishedLaunching` 方法所取代。该方法是 MonoDevelop 模板中的默认方法，因此你不需要更改任何代码即可添加此功能。\n\
  \n当一个应用程序调用你的应用时，`options` 字典包含两个键：`UIApplicationLaunchOptionsKey` 和 `UIApplicationLaunchSourceKey`。Listing\
  \ 11-2 显示了如何提取用于调用你的应用的 URL 以及如何确定来源。\n\n```cs\npublic override bool FinishedLaunching(UIApplication\
  \ app, NSDictionary options) {\n    if(options != null) {\n        var urlOptionKey\
  \ = new NSString(\"UIApplicationLaunchOptionsKey\");\n        var urlSourceKey =\
  \ new NSString(\"UIApplicationLaunchSourceApplicationKey\");\n        var url =\
  \ (NSUrl)options[urlOptionKey];\n        var source = options[urlSourceKey].ToString();\n\
  \        // 从 NSUrl 对象中获取信息。\n        Console.WriteLine(\"Url = \" + url.AbsoluteString);\n\
  \        // 调用此应用的 URL 标识符。\n        Console.WriteLine(\"Source = \" + source);\n\
  \    }\n...\n}\n```\n\n你收到的 URL 可以被解析，以实现对应用的深度链接（deep linking）。为了测试这是否有效以及你的应用是否按预期打开，你可以使用模拟器上的\
  \ Safari 作为调用 URL 的方法。这样做，你需要在 Safari 应用的地址栏中输入 URL，然后就会关闭 Safari 并打开你的应用程序。这适用于之前提到的所有\
  \ URL 和协议。\n\n## 与通讯录集成\n\n\n\n\n\n通讯录（Address Book）是 iPhone 现有功能的关键部分。用户手机中可能所有的联系人都存储在这里。在你的应用程序中访问这些信息可能非常有用。例如，你可能希望允许用户查看朋友列表，以便他们向你的应用程序发送链接。\n\
  \n要访问通讯录，你需要创建一个新的 `ABAddressBook` 对象。该对象类型暴露了几个不同的方法来从通讯录中收集数据。这些方法在 Listing 11-3\
  \ 中以**粗体**显示。\n\n![download.eps](img/download_fmt.gif)\n\nListing 11-3: 访问通讯录对象\n\
  \n```csharp\nusing MonoTouch.AddressBook;\n\n...\n\nABAddressBook adBook = new ABAddressBook();\n\
  \n// Groups 可以定义联系人的一个区域\n// 如果你从其他机器同步了联系人则使用。\nABGroup[] allGroups = adBook.GetGroups();\n\
  Console.WriteLine (\"Group Count: \" + allGroups.Count());\n\n// 获取 ABPerson 对象的数组\n\
  ABPerson[] allPeople = adBook.GetPeople();\nConsole.WriteLine (\"People Count: \"\
  \ + allPeople.Count());\n\n// 获取名字或姓氏为 \"Fred\" 的人员\nABPerson[] allFreds = adBook.GetPeopleWithName(\"\
  Fred\");\nConsole.WriteLine (\"Fred Count: \" + allFreds.Count());\n\n// 如果你已经知道\
  \ Id，可以获取单个个人\nint personRecordId = 57;\nABPerson person = adBook.GetPerson(personRecordId);\n\
  ```\n\n![note.ai](img/note_fmt.gif)\n\n当你开始进行 iPhone 开发时，iPhone 模拟器的通讯录将是空的。为了确保\
  \ Listing 11-3 中的代码可以运行，你想要添加一个名为“Fred”的人作为联系人。你可能没有某个特定人的 ID，所以你可能也想将这部分代码注释掉。\n\
  \n如果你查看创建的 person 对象，你会看到许多预期的属性，例如 `FirstName`、`LastName` 和 `Birthday`；然而，请注意没有\
  \ `TelephoneNo` 属性。这是因为电子邮件地址、电话号码和 URL 等属性的数据是以类型化的 `ABMultiValue` 对象形式提供的。你需要调用几个方法来根据需要提取这些信息。Listing\
  \ 11-4 展示了当你已经有一个人员数组时，获取电话号码和电子邮件列表的示例。\n\n![download.eps](img/download_fmt.gif)\n\
  \nListing 11-4: 访问电话和邮箱信息\n\n```csharp\nforeach(var person in allPeople)\n{\n  \
  \  var phones = person.GetPhones();\n    if(phones.Count > 0)\n    {\n        foreach(var\
  \ phone in phones)\n        {\n            Console.WriteLine(\"Phone Type \" + phone.Label);\n\
  \            Console.WriteLine(\"Phone Number \" + phone.Value);\n        }\n  \
  \  }\n    var emails = person.GetEmails();\n    if(emails.Count > 0)\n    {\n  \
  \      foreach(var email in emails)\n        {\n            Console.WriteLine(\"\
  E-mail Type \" + email.Label);\n            Console.WriteLine(\"E-mail Address \"\
  \ + email.Value);\n        }\n    }\n}\n```\n\n在运行示例时你可能注意到，标签返回为“Mobile!”或“Home!”，除了自定义标签外，所有标签都会出现这种情况。这是因为标签可以本地化到设备的区域设置。要通过编程方式访问这些，请使用\
  \ `ABAddressBook` 上的静态方法 `LocalizedLabel`。通过传入从原始标签获取的标签，将返回本地化后的字符串。\n\n通过编程访问通讯录在大多数情况下是有用的，但如果你只是想要用户期望的\
  \ iPhone 行为，在此基础上手动构建 UI 需要花费长时间。幸运的是，`Mono.AddressBook` 涵盖了这一点，并提供了几个视图控制器使这种交互变得更容易。提供此功能的四个类是\
  \ `ABPersonViewController`、`ABPeoplePickerNavigationController`、`ABNewPersonViewController`\
  \ 和 `UnknownPersonViewController`。\n\n![note.ai](img/note_fmt.gif)\n\n除 `ABPeoplePickerNavigationController`\
  \ 之外的所有视图都需要配合导航控制器使用；否则它们无法工作。\n\n### ABPersonViewController\n\n`ABPersonViewController`\
  \ 是一个提供显示和编辑单个通讯录联系人能力的视图控制器。Figure 11-4 显示了默认人员的外观，而 Figure 11-5 显示了编辑视图。默认情况下未启用编辑，但你可以通过将\
  \ `AllowsEditing` 设置为 `true` 来启用它。`DisplayedPerson` 属性需要一个 `ABPerson` 变量并设置视图控制器显示此人员。Listing\
  \ 11-5 显示了如何使用该视图控制器。确保你有一个名字为“Example”的人，以便示例运行。\n\nFigure 11-4\n![f114.tif](img/f114.tif)\n\
  \nFigure 11-5\n![f115.tif](img/f115.tif)\n![download.eps](img/download_fmt.gif)\n\
  \nListing 11-5: 添加人员控制器\n\n```csharp\nvar adBook = new ABAddressBook();\nvar personvc\
  \ = new ABPersonViewController();\npersonvc.DisplayedPerson = adBook.GetPeopleWithName(\"\
  Example\")[0];\npersonvc.AllowsEditing = true;\nnavigationController.PushViewController(personvc,\
  \ true);\n```\n\n![note.ai](img/note_fmt.gif)\n\n通讯录对象仅用于填充人员，不需要使用视图控制器。确保你添加了一个名为“Example”的联系人以便示例运行。\n\
  \n### ABPeoplePickerNavigationController\n\n要允许用户从所有联系人列表中选择特定人员，请使用 `ABPeoplePickerNavigationController`。选择器通常作为模态视图使用，而不是推送到导航控制器。当视图加载时，你将看到所有用户的列表，类似于电话应用程序中所示（参见\
  \ Figure 11-6）。在使用选择器处理联系人时，你有两种：\n\n- 如果你想以自动方式处理选择器并进入人员控制器，请在 `SelectPerson`\
  \ 事件回调中将事件参数 `Continue` 设置为 `true`。\n- 默认情况下 `Continue` 设置为 `false`，一旦选择了人员，将由你处理操作。\n\
  \n`Person` 事件参数将填充所选人员。如果用户选择取消，将触发 `Cancelled` 事件。参见 Listing 11-6 有关如何实例化选择器控制器以及如何处理上述事件的示例。\n\
  \n![download.eps](img/download_fmt.gif)\n\nListing 11-6: 使用人员选择器导航控制器\n\n```csharp\n\
  var ppvc = new ABPeoplePickerNavigationController();\nppvc.Cancelled += delegate(object\
  \ sender, EventArgs e) {\n    Console.WriteLine(\"Picker cancelled\");\n    navigationController.DismissModalViewControllerAnimated(true);\n\
  };\nppvc.SelectPerson += delegate(object sender, ABPeoplePickerSelectPersonEventArgs\
  \ e) {\n    // 注消以允许选择器显示人员视图控制器\n    // e.Continue = true;\n    Console.WriteLine(\"\
  Selected \" + e.Person.FirstName);\n    if(!e.Continue)\n        navigationController.DismissModalViewControllerAnimated(true);\n\
  };\n\nnavigationController.PresentModalViewController(ppvc, true);\n```\n\n\n\n\n\
  \n在列表 11-6 中，你首先创建一个 `ABPeoplePickerNavigationController` 的新实例。这创建了你的视图控制器，随后你可以使用导航控制器来显示它（参见最后一行）。由于你想要处理取消事件或选择人员事件的发生方式，因此你在这些事件上创建了委托方法。取消事件简单地使用导航控制器并撤回你最初传递给它的视图控制器。它的效果就像选择器被关闭了。选择人员事件则会在关闭选择器之前尝试处理被选中的人员，因此你再次为该事件创建了一个委托方法来处理。\n\
  \n### ABNewPersonViewController\n\n正如你从视图控制器的名称所预期的那样，如果你想让用户创建一个新人员并添加到通讯录，就会使用\
  \ `ABNewPersonViewController`。该视图控制器提供了你在“联系人”应用中看到的相同视图（参见图 11-7）。\n\n由于使用新人员视图控制器唯一能做的就是添加新人员，因此只有一个名为\
  \ `NewPersonComplete` 的事件。在事件参数中，它通过 `Completed` 属性返回是否已添加了人员。如果 `Completed` 为 `true`，则\
  \ `Person` 属性将填充为刚刚添加到通讯录的人员。如何使用新人员视图控制器的示例可见列表 11-7。\n\n![download.eps](img/download_fmt.gif)\n\
  \n列表 11-7: 使用新人员视图控制器\n\n```csharp\nvar pvc = new ABNewPersonViewController();\n\
  \npvc.NewPersonComplete += delegate(object sender, ABNewPersonCompleteEventArgs\
  \ e) {\n    if(e.Completed) \n        Console.WriteLine (\"Added new person \" +\
  \ e.Person.ToString());\n    else\n        Console.WriteLine (\"Cancelled View\"\
  );\n\n    navigationController.PopViewControllerAnimated(true);\n};\n\nnavigationController.PushViewController(pvc,\
  \ true);\n```\n\n图 11-6\n\n![f1106.tif](img/f1106_fmt.jpg)\n\n图 11-7\n\n![f1107.tif](img/f1107_fmt.jpg)\n\
  \n### ABUnknownPersonViewController\n\n当人员可能存在但你没有从通讯录中检索其信息时，使用 `ABUnknownPersonViewController`。例如，当你收到未知号码的电话时，会使用此未知人员视图控制器，你可能想用该号码创建一个新联系人，或将该号码添加到现有联系人中。你想创建一个新的\
  \ `ABPerson` 对象来填充你已知的关于人员的信息。如果你没有该人员的姓名，`AlternativeName` 属性将显示为名称占位符，但在创建新联系人或添加到现有联系人时，它不会被使用。如果你只有一个属性，则最好将其用作替代标题。列表\
  \ 11-8 展示了如何实例化和使用未知人员视图控制器。\n\n![download.eps](img/download_fmt.gif)\n\n列表 11-8:\
  \ 使用未知人员视图控制器\n\n```csharp\nvar upvc = new ABUnknownPersonViewController();\n\n\
  // 创建一个新人员\nupvc.DisplayedPerson = new ABPerson();\n\n// 将电话号码设置为替代名称和\n// 预定义的人员属性。\n\
  var phoneNumber = \"0123456789\";\nupvc.AlternateName = phoneNumber;\nvar numberProperty\
  \ = new ABMutableStringMultiValue();\nnumberProperty.Add(phoneNumber, ABLabel.Home);\n\
  upvc.DisplayedPerson.SetPhones(numberProperty);\n\n// 允许操作并添加到通讯录\nupvc.AllowsActions\
  \ = true;\nupvc.AllowsAddingToAddressBook = true;\n\n// 处理人员创建事件回调\nupvc.PersonCreated\
  \ += delegate(object sender, ABPersonCreatedEventArgs e) {\n    if(e.Person != null)\
  \ {\n        Console.WriteLine(\"Person Created\");\n        upvc.ModalViewController.DismissViewControllerAnimated(true);\n\
  \        // 创建人员后可选地关闭视图控制器\n    } else {\n        Console.WriteLine(\"Cancelled\"\
  );\n        upvc.ModalViewController.DismissViewControllerAnimated(true);\n    }\n\
  };\nthis.NavigationController.PushViewController(upvc, true);\n```\n\n在列表 11-8 中，你首先实例化了一个新的人员视图控制器。该视图控制器将用于显示可用的人员详细信息。要显示人员，你首先需要创建一个新的人员对象并设置值；此人员将是\
  \ `DisplayedPerson`。开始时，创建一个新的 `ABPerson` 对象并将其分配给该属性。在现实情况下，你可能已经有了关于人员的某些信息。为了显示一个人员，你需要先创建一个新的人员对象来设置值；此人员将是\
  \ `DisplayedPerson`。对于 `DisplayedPerson` 属性，由于你不知道该人员的姓名，你可以设置 `AlternativeName`\
  \ 为已知号码。为了设置电话号码，你首先创建一个空的 `ABMutableStringMultiValue` 对象。这允许输入多个电话号码，并将电话号码添加到\
  \ `ABMutableStringMultiValue` 中，并将此对象传递给 `SetPhones` 方法。\n\n将 `AllowsActions` 和\
  \ `AllowsAddingToAddressBook` 设置为 `true` 可以使图 11-8 视图控制器底部的按钮可见。默认情况下这些被设置为 `false`。由于创建人员会弹出一个模态视图控制器，当用户决定取消创建或完成创建并在处理完他们的选择后，你需要撤回模态视图控制器返回未知人员控制器。\n\
  \n图 11-8\n\n![f1108.tif](img/f1108_fmt.jpg)\n\n### 处理属性的选择\n\n在最后几个示例的大多数视图中，注意到某些属性（如电话号码或电子邮件地址）是可以选择的，但当选择它们时，什么都没有发生。这是因为你需要决定是否发生该属性的默认操作（例如选择电话号码会开始拨号）。在允许你处理此问题的视图控制器上，你可以看到\
  \ `PerformDefaultAction` 事件。该事件的参数包含一个名为 `ShouldDefaultAction` 的属性。要允许默认操作发生，你只需将属性设置为\
  \ `true`。与事件参数中的其他几个属性一起，被选中的属性也被传入。这意味着你可以选择让某些类型的属性执行其默认操作。这很有用，例如，如果你不想让应用程序在点击电话号码时退出，而是提供应用内功能。列表\
  \ 11-9 展示了实现此点的示例。\n\n![download.eps](img/download_fmt.gif)\n\n列表 11-9: 处理默认操作\n\
  \n```csharp\n// ABPersonViewController 示例\npersonvc.PerformDefaultAction += delegate(object\
  \ sender, ABPersonViewDefaultActionEventArgs e) {\n    // 仅允许电子邮件点击\n    if(e.Property\
  \ == ABPersonProperty.Email) {\n        if (MFMailComposeViewController.CanSendMail)\
  \ {\n            var email = e.Person.GetEmails()[e.Identifier.Value];\n       \
  \     var mail = new MFMailComposeViewController();\n            mail.SetToRecipients(new\
  \ [] { email.Value });\n            mail.Finished += delegate {\n        }\n   \
  \ }\n};\n```\n\n\n\n` 标签中似乎不完整（只有代码片段结尾），但根据你提供的文本内容，我将对给出的部分进行了完整的翻译：\n\n[content]\n\
  \n```csharp\npersonvc.DismissModalViewControllerAnimated(true);\n};\n\npersonvc.PresentModalViewController(mail,\
  \ true);\n\n}\n\nelse\n    e.ShouldPerformDefaultAction = true;\n\n};\n```\n\n![note.ai](img/note_fmt.gif)\n\
  \n请确保你的通讯录中有一个名为“Example”且带有电子邮箱地址的联系人，这样此示例才能正常工作。\n\nListing 11-9 显示了如何在点击人员视图控制器（person\
  \ view controller）上的属性时创建一个默认操作。`ABPersonViewPerformDefaultActionEventArgs` 事件参数有一个名为\
  \ `Property` 的属性。该属性类型为 `ABPersonProperty`，因此你可以在处理默认操作之前检查其类型。在这个示例中，请注意它处理了点击电子邮件属性时的操作。通过使用\
  \ `MFMailComposeViewController` 上的 `CanSendMail` 方法，你可以检查设备是否可以发送电子邮件；如果是的话，你可以提供\
  \ `MFMailComposeViewController` 以允许用户在应用程序内部发送电子邮件。如果用户无法在应用程序内发送电子邮件，你希望将 `ShouldPerformDefaultAction`\
  \ 设置为 `true`。这意味着设备将以它认为必要的方式处理该点击——对于电子邮件字段，这意味着应用程序将关闭并打开电子邮件应用程序。\n\n## 与 iPod\
  \ 音乐库集成\n\n在应用程序中使用用户的 iPod 音乐是提供额外功能的一种极佳方式，特别是当你可能将其作为付费功能添加时。类似于通讯录（Address Book）允许你对其中存储的数据进行程序化编码的方式，iPod\
  \ 音乐库提供了类似的能力，并提供了两种播放这些内容的不同方式。你还可以访问音乐播放器中通常期望的方法，例如 `Play`、`Pause`、`Stop`、`SkipToBeginning`、`SkipToPreviousItem`、`SkipToNextItem`、`BeginSeekingForward`\
  \ 和 `BeginSeekingBackward`以及属性 `CurrentPlaybackTime`，你可以设置该属性使其跳过到当前曲目的时间点，或者读取该值以便使用此信息设置滑块的值，以指示当前曲目的进度。\n\
  \n![note.ai](img/note_fmt.gif)\n\niPod 集成仅允许播放音频内容，不会播放视频内容。\n\n`MPMusicPlayerController`\
  \ 有两个音乐播放器属性：`ApplicationMusicPlayer` 和 `iPodMusicPlayer`。\n\n*   应用程序音乐播放器在你的应用程序内部是独立的。这意味着如果你退出程序，音乐也会停止。\n\
  *   然而，iPod 音乐播放器通过内置 iPod 功能开始播放，当你的应用程序退出时，音乐将继续播放。\n\nListing 11-10 和 11-11 显示了如何创建两种类型的音乐播放器并开始播放设备上所有歌曲队列。\n\
  \n![warning.ai](img/warning_fmt.gif)\n\n由于模拟器没有 iPod 功能或未包含任何音乐，你将只能在设备上测试和开发具有\
  \ iPod 集成功能的应用程序。你需要安装完整版的 MonoTouch 并拥有来自 Apple 的正确证书才能做到这一点。你还需要设备上至少有一首歌。\n\n\
  ### Listing 11-10: 创建应用程序音乐播放器\n\n```csharp\nvar musicPlayer = MPMPlayerController.ApplicationMusicPlayer;\n\
  musicPlayer.SetQueue(MPMediaQuery.songsQuery);\nmusicPlayer.Play();\n```\n\n###\
  \ Listing 11-11: 创建 iPod 音乐播放器\n\n```csharp\nvar musicPlayer = MPMPlayerController.iPodMusicPlayer;\n\
  musicPlayer.SetQueue(MPMediaQuery.songsQuery);\nmusicPlayer.Play();\n```\n\n`NowPlayingItem`\
  \ 属性提供了当前正在播放的项目的信息。你可以使用此属性在屏幕上显示信息。为了做到这一点，你使用 `ValueForProperty` 方法并传入一个 `MPMediaItemProperty`\
  \ 属性：\n\n```csharp\nMusicPlayer.NowPlayingItem.ValueForProperty(MPMediaItemProperty.Title);\n\
  ```\n\n它返回一个 `NSObject`，因此你可能需要将其转换为适当类型，例如用于专辑标题的 `NSString` 或用于专辑封面的 `MPMediaItemArtwork`。要显示当前正在播放项目的封面，你需要创建一个\
  \ `UIImageView` 来放置封面。在这个示例中，我的 `UIImageView` 命名为 `albumArtworkView`。它可以在 Interface\
  \ Builder 中创建，也可以在代码中创建。一旦图像视图就绪，你就可以从 `NowPlayingItem` 中的封面媒体项中提取图像，并将 `UIImageView`\
  \ 的 `Image` 属性设置为新创建的封面。Listing 11-12 显示了代码中的专辑封面设置。\n\n![note.ai](img/note_fmt.gif)\n\
  \n### Listing 11-12: 设置封面\n\n```csharp\nvar albumArtwork = (MPMediaItem)MusicPlayer.NowPlayingItem.ValueForProperty(MPMediaItemProperty.Title);\n\
  if(albumArtwork != null)\n{\n    var size = new PointF(albumArtworkView.Frame.Width,\
  \ albumArtworkView.Frame.Height);\n    UIImage image = albumArtwork.ImageWithSize(size);\n\
  \    albumArtworkView.Image = image;\n}\nelse\n{\n    albumArtworkView.Image = UIImage.FromFile(\"\
  emptyArtwork.png\");\n}\n```\n\n你可能会发现，当新歌曲开始播放时，UI 仍然显示旧信息且没有更新。为了解决这个问题，你可以使用通知在播放器状态改变（例如进入暂停状态）以及当新歌曲播放时向你提供反馈，以便你可以更新曲目。你可以将观察者（监听通知）声明为类变量；这使得它们更容易添加和删除，从而避免重复监听。\n\
  \n```csharp\nNSObject NowPlayingItem, PlayStateChanged;\nMPMusicPlayerController\
  \ MusicPlayer;\n\npublic override void ViewDidLoad()\n{\n    base.ViewDidLoad();\n\
  }\n```\n\n\n\n\n\n希望你现在已经熟悉了如何使用通知，而 `MPMusicPlayerController` 使用通知的方法与其他通知的工作方式非常相似。你可能在之前的代码列表中注意到一个不同之处，即你需要显式地开始和结束通知，而其他通知在添加和移除观察者时会自动启动。第\
  \ 27 行显示了调用了 `BeginGeneratingPlaybackNotifications`，第 39 行显示了调用了 `EndGeneratingPlaybackNotifications`\
  \ 以停止调用观察者。\n\n目前，你仍然只是在播放设备上的所有歌曲。这并不真正有用，因此你可能希望通过程序过滤来筛选正在播放的音乐。你应该注意，除了 `songsQuery`\
  \ 之外，还有其他方便的预定义媒体查询可以使用。为了实现这一点，你将使用 `MPMediaPropertyPredicate` 过滤器创建你自己的 `MPMediaQuery`。由于并不是所有的媒体项目属性都可以作为过滤条件，你还应该检查你正在过滤的媒体项目实际上是否可以过滤。例如，你无法对\
  \ `artwork` 媒体项目属性进行过滤。Listing 11-14 显示了如何通过媒体项目属性过滤 iPod 音乐集合。\n\n![download.eps](img/download_fmt.gif)\n\
  \nListing 11-14: 创建媒体查询\n\n```csharp\nvar musicPlayer = MPMPlayerController.iPodMusicPlayer;\n\
  \nvar mediaQuery = new MPMediaQuery();  \n\nif(MPMediaItem.CanFilterByProperty(MPMediaItemProperty.Artist))\n\
  {\n   var artistFilter = MPMediaPropertyPredicate.PredicateWithValue\n         \
  \               (new NSString(\"Mew\"), MPMediaItemProperty.Artist);\n   mediaQuery.AddFilterPredicate(artistFilter);\n\
  }\n\nif(MPMediaItem.CanFilterByProperty(MPMediaItemProperty.AlbumTitle))\n{\n  \
  \ var albumFilter = MPMediaPropertyPredicate.PredicateWithValue\n              \
  \          (new NSString(\"Frengers\"), MPMediaItemProperty.AlbumTitle);\n   mediaQuery.AddFilterPredicate(albumFilter);\n\
  }\n\nmusicPlayer.SetQueue(mediaQuery);\n\nmusicPlayer.Play();\n```\n\nListing 11-14\
  \ 显示了你如何使用 `AddFilterPredicate` 方法来过滤你 iTunes 库中所有歌曲的 `MediaQuery`。你可能想将艺术家 \"Mew\"\
  \ 和专辑名称 \"Frengers\" 更改为你 iTunes 集合中的艺术家和专辑。要过滤 `MediaQuery`，你首先通过提供想要过滤的值（在第一个谓词中示例使用了\
  \ \"Mew\"）和媒体的属性类型（在此情况下 `MPMediaItemProperty` 是 `Artist`）来创建一个 `MPMediaPropertyPredicate`。在为\
  \ `MPMediaPropertyPredicate` 填充内容后，你接着使用 `AddFilterPredicate` 将该谓词添加到 `MediaQuery`\
  \ 中，并像以前那样继续使用 `MediaQuery`。这会让你获得过滤后的媒体项目列表。\n\n正如你在通讯录功能中看到的那样，有一个非常有用的选择控件允许使用熟悉的界面轻松地选择人员。在\
  \ iPod 功能中，有一个媒体选择器，它允许为 iPod 音频选择提供默认的用户界面。Listing 11-15 显示了如何创建该选择器。\n\n![download.eps](img/download_fmt.gif)\n\
  \nListing 11-15: 使用 iPod 媒体选择器控制器\n\n```csharp\nusing(MPMediaPickerController mediaPicker\
  \ = new MPMediaPickerController())\n{\n   mediaPicker.AllowsPickingMultipleItems\
  \ = true;\n   mediaPicker.ItemsPicked += delegate(object sender, \n            \
  \                          ItemsPickedEventArgs e)\n   {\n      if(e.MediaItemCollection\
  \ != null)\n      {\n         foreach(var item in e.MediaItemCollection.Items)\n\
  \         {\n            Console.WriteLine (\"Title: \" + \n                   \
  \           item.ValueForProperty(MPMediaItemProperty.Title));\n         }\n   \
  \   }\n   }\n}\n```\n\n\n\n\n\n# 创建 C# 接口\n\n接下来，你需要创建一个 C# 接口，它被 `btouch` 用于自动生成\
  \ Objective-C 绑定。为了让 `btouch` 知道要绑定什么，你需要使用定义绑定的不同属性来装饰接口。你需要查看静态编译库中包含的头文件，以了解你如何将其翻译为\
  \ C#。Objective-C 中的头文件本质上是一种允许你针对静态库进行编码的方法，因此在尝试对其进行绑定时也非常有用。Listing 11-16 显示了\
  \ Flurry 1.4 SDK 中的 Flurry 头文件。\n\n![download.eps](img/download_fmt.gif)\n\nListing\
  \ 11-16: Flurry Objective-C 头文件\n\n```objectivec\n//\n//  FlurryAPI.h\n\n//  Flurry\
  \ iPhone Analytics Agent\n\n//\n//  Copyright 2009 Flurry, Inc. All rights reserved.\n\
  \n//\n#import <UIKit/UIKit.h>\n\n@class CLLocationManager;\n\n@class CLLocation;\n\
  \n@interface FlurryAPI : NSObject {\n\n}\n\n+ (void)startSession:(NSString *)apiKey;\n\
  \n+ (void)logEvent:(NSString *)eventName;\n\n+ (void)logEvent:(NSString *)\n   \
  \ eventName withParameters:(NSDictionary *)parameters;\n\n+ (void)logError:(NSString\
  \ *)\n    errorID message:(NSString *)message exception:(NSException *)exception;\n\
  \n+ (void)setUserID:(NSString *)userID;\n\n+ (void)setEventLoggingEnabled:(BOOL)value;\n\
  \n+ (void)setServerURL:(NSString *)url;\n\n+ (void)setSessionReportsOnCloseEnabled:(BOOL)sendSessionReportsOnClose;\n\
  \n@end\n```\n\n关于这个头文件有几点需要注意，以及在为其创建 C# 接口文件时需要考虑的事。这些这些：\n\n* 使用了 `UIKit` 命名空间。\n\
  * `@class CLLocationManager` 和 `CLLocation` 并没有实际使用，所以你不需要它们。\n* `FlurryAPI` 的基类是\
  \ `NSObject`。\n* 所有方法都是静态的。\n\n![note.ai](img/note_fmt.gif)\n\n另一个需要注意的是方法名；如果方法没有参数，那么方法名看起来将像\
  \ `methodName.`。如果方法有一个参数，你只需在末尾附加一个分号，方法名为 `methodName:.`。最后，如果方法有多个参数，那么方法名将是\
  \ `methodName:secondParameter:.`。你需要将导出的 Objective-C 方法名修正为 C# 方法，所以记住这一点很好。\n\n\
  现在你已经查看了头文件，就可以去创建 C# 接口了。Listing 11-17 显示了我们将与 `btouch` 使用的完成接口文件。\n\n![download.eps](img/download_fmt.gif)\n\
  \nListing 11-17: Flurry C# 接口\n\n```csharp\n///\n// Binding to the FlurryAPI Analytics\
  \ SDK from Flurry\n//\n// MIT X11 licensed\n//\n// Copyright 2009 ChrisNTR\n//\n\
  using System;\nusing MonoTouch.Foundation;\nusing MonoTouch.UIKit;\n\nnamespace\
  \ MonoTouch.Binding\n{\n    [Static][BaseType (typeof (NSObject))]\n    interface\
  \ FlurryAPI\n    {\n        [Static][Export (\"startSession:\")]\n        void StartSession(string\
  \ apiKey);\n        [Static][Export (\"logEvent:\")]\n        void LogEvent(string\
  \ eventName);\n        [Static][Export (\"logEvent:withParameters:\")]\n       \
  \ void LogEvent(string eventName, NSDictionary parameters);\n        [Static][Export\
  \ (\"logEvent:message:\")]\n        void LogEvent(string errorId, string message);\n\
  \        [Static][Export (\"setUserID:\")]\n        void SetUserId(string userId);\n\
  \        [Static][Export (\"setEventLoggingEnabled:\")]\n        void SetEventLoggingEnabled(bool\
  \ enabled);\n        [Static][Export (\"setServerURL:\")]\n        void SetServerUrl(string\
  \ url);\n        [Static][Export (\"setSessionReportsOnCloseEnabled:\")]\n     \
  \   void SetSessionReportsOnCloseEnabled(bool enabled);\n    }\n}\n```\n\n你应该从接口文件中注意到几点。你看到的大部分内容在接续\
  \ Objective-C 头文件后应该是合理的。由于 Objective-C 没有命名空间，你可以看到添加了一个命名空间。由于 `Flurry API` 是一个完全的静态类，所有方法都装饰了\
  \ `[Static]` 属性，这样当 `btouch` 遍历接口以创建绑定时，它会将此类和对应的方法创建为静态。由于 API 同样具有 `NSObject`\
  \ 基类型，你只需要添加 `[BaseType()]` 属性并传入 `NSObject` 类型。另一个唯一需要添加的属性是 `[Export ()]` 属性。延续本节之前提到的关于方法名的说明，你可以在\
  \ Listing 11-17 中看到是如何做的。\n\n等等，抱歉，在上面的处理中漏掉了你文本的最后部分。我将根据你的规则提供整个文本的**完整且重新格式化的版本**。\n\
  \n\n\n\n\n# 面向国际观众的本地化\n\n## 本章内容简介\n\n* 定义国际化（Internationalization）和本地化（Localization）\n\
  * 显示翻译后的文本和图像\n* 格式化日期、时间和数字\n* 提取用于翻译的文本\n\n本地化（Localization）和国际化（Internationalization）听起来很相似；但它们描述的是多语言软件开发过程中的不同阶段。\n\
  \n国际化指的是编写支持多种语言和显示格式的软件。这项任务通常由软件架构师和开发人员承担，并影响应用程序存储和表示用户界面及数据的方式。国际化代码的属性包括：\n\
  \n* 所有显示文本都与代码分开存储，以便于更新。\n* 图像、视频、颜色和图标可以轻松更新。\n* 列表的排序具有语言敏感性。\n* 日期和时间格式（以及度量）以及时间计算考虑了当前用户的设置。\n\
  * 数字和货币格式（符号、逗号和点号）是灵活的且符合用户习惯。\n* 测量值（温度、重量、距离）可以用不同的单位表示。\n* 地址、电话号码和政府身份标识的正确输入和显示。\n\
  \n一旦应用程序完成本地化，就应该能够在许多不同的国家/语言中发布。\n\n本地化是将文本翻译成目标语言、更新图像和其他文化引用的过程。这项任务通常由翻译人员和/或目标语言的母语者执行。本地化的重要方面包括：\n\
  \n* 将文本翻译成目标语言。\n* 使用适当的文化引用（颜色、图像、写作风格）。\n* 为本地化需求提供参数/指导，例如税率和适用性（假设应用程序的国际化过程已使其足够灵活，可以处理此类本地化业务规则）。\n\
  \n全球化（Globalization）是有时用来描述国际化和本地化的另一个术语。在 `.NET Framework` 中，`System.Globalization`\
  \ 命名空间包含了创建多语言应用程序的类。\n\n图 12-1 显示了一些具有不同语言和区域设置的内置应用程序。本章将向你展示如何为应用程序实现类似的结果，极大扩展你的\
  \ iPhone OS 应用程序的市场！\n\n图 12-1\n\n![f1201.tif](img/f1201_fmt.jpg)![note.ai](img/note_fmt.gif)\n\
  \n国际化和本地化术语通常分别缩写为 `i18n` 和 `L10n` —— 数字指的是每个单词第一个字母和最后一个字母之间的字符数。\n\n## 应用程序的国际化\n\
  \n要对应用程序进行国际化，你必须能够：\n\n* 检测用户想要查看的语言。\n* 检测用户选择了哪些区域设置（也称为 `locale`，区域设置）。\n* 根据这些设置显示所有文本、数字、日期、图像、颜色等。\n\
  * 以用户偏好的语言接受并验证用户输入。\n\niPhone OS 和 `.NET SDK` 提供了可以帮助你完成所有这些任务的框架，只要你的代码结构能够利用它们。本章重点关注\
  \ `MonoTouch` 暴露/支持的内置 iPhone 国际化和本地化功能，并在相关处提到 `.NET` `System.Globalization` 类。\n\
  \n## 更改语言和区域设置\n\n你通过 `设置 ⇒ 通用 ⇒ 语言与区域 (Settings ⇒ General ⇒ International)`屏幕配置\
  \ iPhone 的语言和区域信息。\n\n更改 iPhone 上的语言会导致操作系统显示主界面，所有文本都翻译为所选语言。支持该语言的应用程序也将以该语言显示内容。\n\
  \n![note.ai](img/note_fmt.gif)\n\n选择语言并不意味着任何特定的区域/本地设置。\n\n在你的 iPhone 上启用键盘允许输入不同的语言（及其相应的字符）。\n\
  \n更改 iPhone 上的区域格式会影响日期、数字和日历的格式。\n\n在编写使用这些设置的代码之前，图 12-2 向你展示了如何在模拟器上更改它们（真实设备上存在更多不相关的选项）。在更改语言之前先设置区域格式会更简单，因为更改语言会导致操作系统重新加载主界面（这需要一两秒钟）。\n\
  \n图 12-2\n\n![f1202.tif](img/f1202_fmt.jpg)\n\n在你将手机或模拟器更改为你读不懂的语言之前，记住这些选项的位置，否则将它们改回你的母语言可能会很困难。如果你忘记了，可以始终使用模拟器中的“重置内容和设置”菜单选项。\n\
  \n你在这些屏幕上的选择会影响 iPhone 原生类和 `.NET` 显示内容的方式，它们都使用相同的标准来识别语言和区域。标准由两部分组成：\n\n* 语言代码：双字母\
  \ ISO 639-1 代码是识别语言的首选方法。常见示例包括英语的 `en`、日语的 `ja`、西班牙语的 `es`、法语的 `fr` 和德语的 `de`。\n\
  * 区域代码：双字符的 ISO 3166-1 代码，用于识别使用特定语言的区域或位置（例如，美国的 `US`、法国的 `FR` 和西班牙的 `ES`）。\n\n\
  这两个值组合起来构成了一个 `locale`。有时区域代码与语言代码相同，例如 `fr-FR` 表示法国的法语，`es-ES` 表示西班牙的西班牙语。相比之下，某些\
  \ iPhone 用户将使用 `fr-CA`（加拿法语）或 `es-US`（美国的西班牙语）。英语的常见区域代码包括 `en-US`、`en-GB`、`en-CA`、`en-AU`\
  \ 和 `en-NZ`（分别代表美国、英国、加拿大、澳大利亚和新西兰）。\n\n除了由语言和区域代码定义的本地之外，还有一些自定义标签，如 `zh-Hans`简体中文）和\
  \ `zh-Hant`繁体中文），它们未关联特定区域。\n\n![note.ai](img/note_fmt.gif)\n\n前文中本地标识符使用了 `.NET`\
  \ 格式，用连字符 `-` 分隔语言和区域。iPhone OS 方法使用下划线 `_`。\n\n两者遵循语言代码小写、区域代码大写的规范。\n\n## 显示多种语言\n\
  \n在考虑其他语言的情况下构建应用程序的开发者经常会将文本硬编码到应用程序中——对于 iPhone，文本可能在常量或变量中，直接赋值给 `UIKit` 对象\n\
  \n```\nvar greeting = \"Hello world\";\nMyLabel.Text = \"First name:\";\n```\n\n\
  甚至嵌入在定义视图的 XIB 文件中。图像、音频和视频资源也存在类似的硬编码。这样的应用程序没有国际化，因此无法本地化（除非开发人员进入代码并将每个语言特定的部分替换为另一种语言的等效项）。\n\
  \n国际化过程需要将文本、图像等内容从代码中分离，以便为每个本地设置创建该内容的不同版本。一旦分离了内容，你只需要根据用户的语言和区域设置加载正确的值即可。\n\
  \niPhone OS 通过这些功能促进国际化：\n\n\n\n\n## 本地化概述\n\n-   **特定语言的 (.lproj) 文件夹**：你可以将某些内容（如图像和\
  \ `.strings` 文件，稍后会详细介绍）放在这些文件夹中，当调用以下两个方法时，操作系统将知道去哪里查找这些内容。文件夹根据其内容的两个字母语言代码进行命名，例如\
  \ `en.lproj`、`fr.lproj` 和 `es.lproj`。\n-   **.strings 文件**：一种特殊格式的文本文件，包含单个字符串片段的翻译。每个特定语言文件夹中的默认文件名为\
  \ `Localizable.strings`。\n-   **LocalizedString() 方法**：从 `.strings` 文件加载本地化字符串。\n\
  -   **PathForResource() 方法**：解析到特定语言文件夹中本地化图像或其他文件类型的路径。\n\n图 12-3 显示了特定语言的文件夹和\
  \ `.strings` 文件的结构。接下来的章节将描述它们的工作原理。\n\n图 12-3\n\n![f1203.tif](img/f1203_fmt.jpg)\n\
  \n## .strings 文件格式\n\n`.strings` 文件格式是一组允许包含注释的键值对。“标准”格式的示例显示在 列表 12-1 中——注意键和值都被引号括起来，并且行以分号结束。文件中允许使用\
  \ C 风格的注释，为翻译人员提供说明或解释，翻译人员应应编辑加粗的文本。Apple 建议使用 UTF-16 编码保存这些文件（尽管 UTF-8 编码也可以用）。\n\
  \n列表 12-1: `.strings` 标准文件格式\n\n```c\n/* comment to aid translation */\n\n\"text\
  \ to translate (key)\" = \"translation (value)\";\n\n/* this text has a newline\
  \ */\n\n\"text with escaped\\nnewline\" = \"translation with escaped\\nnewline\"\
  ;\n\n/* this text has quotes */\n\n\"text with escaped \\\"quotes\\\"\" = \"translation\
  \ with escaped \\\"quotes\\\"\";\n\n/* this text has greaterthan and lessthan */\n\
  \n\"text with angles\" = \"this text has < angle brackets >\";\n```\n\n`.strings`\
  \ 文件也可以使用属性列表（`.plist`）格式，尽管它仍应具有相同的 `.strings` 文件扩展名。列表 12-2 以属性列表 XML 格式显示了相同的数据——注意这种格式下不同字符需要进行“转义”：允许引号和换行符，但大于/小于号必须进行\
  \ XML 实体编码。此类文件使用 UTF-8 编码保存（如 XML 中指定的）。\n\n```xml\n<?xml version=\"1.0\" encoding=\"\
  UTF-8\"?>\n\n<!DOCTYPE plist PUBLIC \"-//Apple//DTD PLIST 1.0//EN\" \n\n\"http://www.apple.com/DTDs/PropertyList-1.0.dtd\"\
  >\n\n<plist version=\"1.0\">\n    <dict>\n      <!-- comment to aid translation\
  \ -->\n      <key>text to translate (key)</key>\n      <string>translation (value)</string>\n\
  \      <!-- this text has a newline -->\n      <key>text with escaped\nnewline</key>\n\
  \      <string>translation with escaped\nnewline</string>\n      <!-- this text\
  \ has quotes -->\n      <key>text with escaped \"quotes\"</key>\n      <string>translation\
  \ with escaped \"quotes\"</string>\n      <!-- this text has greaterthan and lessthan\
  \ -->\n      <key>text with angles</key>\n      <string>this text has &lt; angle\
  \ brackets &gt; </string>\n    </dict>\n</plist>\n```\n\n大多数 Apple 提供的示例都使用标准格式，但这两种格式在\
  \ MonoTouch/MonoDevelop 中运行良好。在使用属性列表编辑器应用程序时，请记住另存为正确的文件类型（在此情况下为 XML）。\n\n![note.ai](img/note_fmt.gif)\n\
  \n## 实现细节\n\nApple 的 SDK 参考文档特别指出：“在 iPhone OS 中，在查找本地化资源时，包接口不考虑方言或脚本信息；只考虑特定语言的。”这意味着你应该创建特定语言的文件夹（如\
  \ en、fr、ja）并将你的 `.strings` 文件放在其中。\n\n## 本地化文件基础\n\n-   **特定语言的 (.lproj) 文件夹**：你可以将某些内容（如图像和\
  \ `.strings` 文件，稍后会详细介绍）放在这些文件夹中，当调用以下两个方法时，操作系统将知道去哪里查找这些内容。文件夹根据其内容的两个字母语言代码进行命名，例如\
  \ `en.lproj`、`fr.lproj` 和 `es.lproj`。\n-   **.strings 文件**：一种特殊格式的文本文件，包含单个字符串片段的翻译。每个特定语言文件夹中的默认文件名为\
  \ `Localizable.strings`。\n-   **LocalizedString() 方法**：从 `.strings` 文件加载本地化字符串。\n\
  -   **PathForResource() 方法**：解析到特定语言文件夹中本地化图像或其他文件类型的路径。\n\n\n\n操作系统将在 `More.strings`\
  \ 而不是 `Localizable.strings` 中搜索 \"Hello\" 的翻译，如果没有找到任何内容，则将由 `HelloLabel` 显示 \"\
  Hi there\"。这允许你创建多个较小的文件来帮助管理你的翻译内容。\n\n当传递四个参数时，它们分别是：\n\n\n\n* `key`：用于在默认 `.strings`\
  \ 文件中查找翻译的字符串。\n* `value`：如果在任何 `.strings` 文件中未找到翻译，则使用的回退值。当使用此重载版本时，`key` 永远不会显示给用户。此参数允许使用扩展\
  \ ASCII（包括带重音的字符，如 `é`）。\n* `table`：允许你指定使用不同的 `.strings` 文件。你应该指定不带 `.strings`\
  \ 扩展的文件名。\n* `comment`：描述文本的注释，以帮助翻译人员。\n\n![note.ai](img/note_fmt.gif)\n\n注意 `LocalizedString`\
  \ 的 `key` 和 `table` 参数是区分大小写的。你还应该尽可能使用 `comment` 参数为翻译人员提供上下文，以确保他们为你的应用程序选择最合适的单词或短语。\n\
  \n要为示例提供翻译，请创建特定语言的文件夹 `es.lproj` 和 `fr.lproj`，然后在每个文件夹中创建一个名为 `Localizable.strings`\
  \ 的新文本文件（文件夹结构如图 12-3 所示所示）。按照表 12-1 所示为这些字符串提供翻译。\n\nTable 12-1: 本地化字符串文件\n\n|\
  \ es.lproj/Localizable.strings | fr.lproj/Localizable.strings |\n| --- | --- |\n\
  | \"Hello\" = \"Hola\"; \"Goodbye\" = \"Adiós\"; \"OK\" = \"Si\"; \"Cancel\" = \"\
  Cancelar\"; \"One\" = \"Uno\"; \"Two\" = \"Dos\"; \"Three\" = \"Tres\"; | \"Hello\"\
  \ = \"Bonjour\"; \"Goodbye\" = \"Au revoir\"; \"OK\" = \"Oui\"; \"Cancel\" = \"\
  Annuler\"; \"One\" = \"Un\"; \"Two\" = \"Deux\"; \"Three\" = \"Trois\"; |\n\n图 12-5\
  \ 显示了应用程序以英语、西班牙语和法语运行。注意 \"Bonjour\" 是如何调整大小的——元素大小调整是软件国际化的重要部分，因为等效文本所需的空间差异很大。英语中的一个单词（如\
  \ \"Hello\"）可能会翻译成另一种语言中更长的单词（如法语中的 \"Bonjour\"），如果你将 `UILabel` 的大小设置为恰好适应英语文本，那么其他语言可能会被重新调整大小甚至被截断。没有解决这个问题的“魔术规则”；你需要意识到文本大小问题，并尝试设计你的视图布局以适应你打算支持的所有语言。\n\
  \n图 12-5\n\n![f1205.tif](img/f1205_fmt.jpg)\n\n### 翻译按钮\n\n翻译 `UIButtons` 可能与你预期的略有不同，因为设置按钮\
  \ `Title` 属性的常用方法无法如你预期那样工作——它只为按钮的一种可能的显示状态设置了文本值。如果你像这样本地化按钮的文本：\n\n![download.eps](img/download_fmt.gif)\n\
  \n```\nOkButton.TitleLabel.Text = \n    NSBundle.MainBundle.LocalizedString(\"OK\"\
  ,\"Affirmative\");\n```\n\n翻译最初将显示，但在被触摸/启用/禁用或应用了任何其他状态更改时，它将恢复为英语（或任何基础语言）。\n\n\
  按钮有六种状态（由 `UIControlState` 枚举定义：`Normal`、`Disabled`、`Highlighted`、`Selected`、`Application`\
  \ 和 `Reserved`），每个状态都可以有自己的文本。要正确本地化按钮，请使用 `SetTitle()` 方法，以便所有状态都能反映本地化文本：\n\n\
  ```objc\nOkButton.SetTitle(\n    NSBundle.MainBundle.LocalizedString(\"OK\",\"Affirmative\
  \ button\"), \n    UIControlState.Normal);\n\nCancelButton.SetTitle(\n    NSBundle.MainBundle.LocalizedString(\"\
  Cancel\",\"Negative button\"), \n    UIControlState.Normal);\n```\n\n或者，你也可以显式为其他状态设置标题，可能对每个状态使用不同的文本（但要小心不要这样做让你的用户界面变得更加混乱）：\n\
  \n```objc\nOkButton.SetTitle(\n    NSBundle.MainBundle.LocalizedString(\n      \"\
  OK\",\"Affirmative button\"), \n    UIControlState.Normal);\n\nOkButton.SetTitle(\n\
  \    NSBundle.MainBundle.LocalizedString(\n      \"OK (unavailable)\",\"Affirmative\
  \ button disabled\"), \n    UIControlState.Normal);\n```\n\n`Localization01\\Main.cs`\
  \ 图 12-6 显示了带有标签和按钮的示例。\n\n图 12-6 ![f206.tif](img/f206_fmt.jpg)\n\n### 显示图像\n\n\
  `Localization02` 中的第二个代码示例显示了如何处理图像。图像通常是通过路径加载的，因此要本地化图像，你需要使用 `PathResource` 获取路径。\n\
  \n在以下示例中，我们创建了三张图像（分别是英语、西班牙语和法语），并将它们放在相应的语言文件夹（`en.lproj`、`es.lproj`、`fr.lproj`）中，所有名称相同：`MyImage.jpg`。我们然后使用\
  \ `PathResource()` 方法为要显示的本地化图像提供路径：\n\n```objc\nvar imageName = NSBundle.MainBundle.PathResource(\"\
  MyImage\",\"jpg\");\nUIImage image = UIImage.FromFile(imageName);\nMyImage.Image\
  \ = image;\n```\n\n`Localization02\\Main.cs` 图 12-7 显示了结果。\n\n图 12-7 ![f1207.tif](img/f1207_fmt.jpg)\n\
  \n这种方法的缺点是，必须在每个特定语言目录中提供本地化图像——否则将产生 `ArgumentNullException`。`PathResource` 只根据语言设置确定路径；它并不验证图像是否存在。\n\
  \n如果特定图像只需要在你支持的少数语言中本地化，你可以考虑将图像路径作为本地化字符串；例如，将图像放置在 `en.lproj` 文件夹中并在 `Localizable.strings`\
  \ 中引用其完整路径：\n\n```\n/* 通常不本地化的图像路径 */\n\"en.lproj/CommonImage.jpg\" = \"en.lproj/CommonImage.jpg\"\
  ;\n```\n\n然后在你的代码中像这样创建图像：\n\n```objc\nvar imageName = NSBundle.MainBundle.LocalizedString(\"\
  en.lproj/CommonImage.jpg\", \"Path to image that isn't usually localized\");\nUIImage\
  \ image = UIImage.FromFileUncached(imageName);\nMyImage.Image = image;\n```\n\n\n\
  \n这意味着对于任何没有为该键分配值的语言，将自动显示英文图片。对于需要自定义图片的语言（例如此示例中的日语），请将本地化的 `CommonImage.jpg`\
  \ 放置在 `ja.lproj` 文件夹中，并在 `ja.lproj/Localizable.strings` 中添加此键值对：\n\n```strings\n\
  /* Path to image that isn't usually localized  */\n\"en.lproj/CommonImage.jpg\"\
  \ = \"ja.lproj/CommonImage.jpg\";\n```\n\n![note.ai](img/note_fmt.gif)\n\n如果你在 `Localizable.strings`\
  \ 文件包含了图像路径，请务必指示翻译人员如何处理这些路径，以免他们尝试将字符串作为短语进行翻译。如果你的翻译人员也负责翻译并提供更新后的图像，请务必提前就正确的尺寸、文件格式、字体、样式和颜色达成一致，以确保翻译后的图像无缝融入到你的应用程序中。\n\
  \n## 本地化应用图标和名称\n\n本地化应用程序图标并不总是必要的——由于在 iPhone 上渲染时的尺寸限制，图标很少包含文本——尽管如此，你可能仍然希望根据用户的语言显示不同的图标。\n\
  \n只需将本地化的应用程序图标放置在相关的语言特定目录中并命名为 `icon.png` 即可。章节下载的 `Localization02` 示例已添加了本地化图标。\n\
  \n应用程序名称通常在 `MonoDevelop Project Properties` 或手动添加的 `Info.plist` 文件中设置（如第 8 章所述）。通过向语言特定目录添加一个特殊命名的\
  \ `InfoPlist.strings` 文件，可以本地化 `Info.plist` 文件中的条目。\n\n表 12-2 显示了为提供本地化应用程序名称向项目中添加的两个额外文件。\n\
  \n### 表 12-2：](#9780470908594c12.xhtml_tableanchor12-2) 本地化字符串文件\n\n| es.lproj/InfoPlist.strings\
  \ | fr.lproj/InfoPlist.strings |\n| --- | --- |\n| `\"CFBundleDisplayName\" = \"\
  L10n-es\";` | `\"CFBundleDisplayName\" = \"L10n-fr\";` |\n\n图 12-8 显示了带有 `Plist`\
  \ 和图标文件的目录结构，以及本地化图标和应用程序名称的最终结果。iPhone OS 会缓存图标图像，因此如果在测试过程中来回切换时不总是看到更新后的图像，请完全删除应用程序并重新安装。\n\
  \n图 12-8\n\n![f1208.eps](img/f1208_fmt.gif)\n\n## 显示“双字节”字符\n\n“双字节字符集”（double byte\
  \ character-set）一术通常用于指中文、日语和韩语等脚本，因为从历史上看，这些语言需要两个字节来存储大多数字符，而大多数西方语言只需要一个字节。随着\
  \ Unicode 及其各种编码（`UTF-8` 最常见）的广泛接受，“双字节”的区别已不再重要——iPhone 支持包括日语、韩语和中文在内的多种复杂脚本。\n\
  \n遗憾的是，`MonoDevelop`（版本 2.2）似乎不喜欢编辑包含某些字符的 `.strings` 文件。解决方案是使用 `Xcode` —— 图 12-9\
  \ 显示了来自 代码下载中的 `ja.lproj/Localizable.strings` 文件以及在 iPhone 模拟器上生成的输出。\n\n图 12-9\n\
  \n![f1209.tif](img/f1209_fmt.jpg)\n\n## 格式化日期、时间、数字和货币\n\n另一个需要根据用户偏好进行自定义的重要事项是用于显示日期、时间和数字的格式。当数据根据其格式具有完全不同的含义时，这一点尤为关键；例如，显示为\
  \ `3/12` 的日期在美国意味着 3 月 12 日，但在许多其他国家则是 12 月 3 日。\n\n由于 MonoTouch C# 代码通常会使用 `.NET\
  \ Framework` 类来处理字符串和日期/时间，这些方法需要尊重用户设置的偏好。`System.Globalization` 中的 `CultureInfo`\
  \ 类是 .NET 中 `NSLocale` 的“等效项”。`CurrentCulture` 和 `CurrentUICulture` 两个属性告诉我们 `.NET\
  \ Framework` 在格式化输出时使用哪个区域。\n\n代码下载中的第三个示例 `Localization03` 增加了更多显示标签以展示本地化格式的工作原理。首先使用两个标签显示正在使用的当前\
  \ `CultureInfo` 设置。这些值通常（但并非总是）与你之前学到的 `LocaleIdentifier` 相同——`.NET` 和 iPhone 支持的集合并不相同，这就是为什么它们有时会有差异（例如，在\
  \ iPhone 上可以选择 `es-US`，但 `.NET` 不支持它）。\n\n![download.eps](img/download_fmt.gif)\n\
  \n```csharp\nMonoCultureLabel.Text = System.Globalization.CultureInfo.CurrentCulture.ToString();\n\
  MonoUICultureLabel.Text = System.Globalization.CultureInfo.CurrentUICulture.ToString();\n\
  ```\n\n在验证 `.NET Framework` 确实反映了 iPhone 的设置后，以下代码显示了输出本地化日期的简单方法：\n\n```csharp\n\
  DateLabel.Text = \"LongDate\" + DateTime.Now.ToLongDate();\nDateLabel2.Text = \"\
  ShortDate\" + DateTime.Now.ToShortDate();\nDateLabel3.Text = \"LongTime\" + DateTime.Now.ToLongTimeString();\n\
  DateLabel4.Text = \"ShortTime\" + DateTime.Now.ToShortTimeString();\n```\n\n许多未国际化的应用程序使用自定义格式字符串来实现特定的输出（例如\
  \ `ToString(\"dd-MMM-yyyy\")`，它会输出 `03-Mar-2010`）。使用感知区域设置的内置格式是所有用户都能理解的最佳方式。同样的考虑也适用于显示货币和数字。未国际化的代码可能会使用\
  \ `$\" + someValue` 来显示价格，然而许多国家有不同的货币符号，且在某些地方，习惯将符号放在末尾（而不是前面）。小数点和千分位分隔符也随文化而异——有时点是逗号，分隔符是空格。这两行显示了显示货币和数字的语法：\n\
  \n```csharp\nNumberLabel.Text = \"Currency\" + String.Format(\"{0:c}\", 5432.11);\n\
  NumberLabel2.Text = \"Thousands\" + String.Format(\"{0:n}\", 123456789.01);\n```\n\
  \n这些示例的本地化输出所示在 图 12-10 中。\n\n![note.ai](img/note_fmt.gif)\n\n在显示不同货币时，记住你的代码负责进行任何转换以确保金额正确。\n\
  \n图 12-10\n\n![f1210.tif](img/f1210_fmt.jpg)\n\n## 在现实应用中管理 Localizable.strings\n\
  \n在章节下载的示例应用程序中，只有少量 `LocalizedString` 调用，这使得更新 `Localizable.strings` 文件包含所有使用的键相对容易。\n\
  \n然而，在大型应用程序中，跟踪所有需要翻译的字符串将变得困难，因为 `LocalizedString` 调用分布在整个代码库中。每添加、删除或更改本地化字符串时，都需要记得更新\
  \ `.strings` 文件以反映代码中的更改。手动提取所有键和注释以创建发送出去翻译的基础 `.strings` 文件可能成为一项非常耗时的任务。\n\n\
  ### genstrings\n\n为了帮助 Objective-C 程序员从代码中提取所有本地化字符串，Apple 提供了一个名为 `genstrings`\
  \ 的工具。开发者使用 `genstrings` 解析源代码以查找 `LocalizedString` 方法调用，提取参数并创建用于翻译的 `Localizable.strings`\
  \ 文件（或多个文件）。\n\n\n\n\n\n遗憾的是，`genstrings` 工具只能解析 C、Objective-C 和 Java 代码，因此它无法用于\
  \ MonoTouch。\n\n# ngenstrings\n\n本章节的下载包含一个名为 `ngenstrings` 项目，它的功能与 Apple 的工具相同，但适用于\
  \ MonoTouch 项目。它的工作方式略有不同——它不是解析源代码，而是解析由 `MonoDevelop` 编译的 `.NET` 程序集——但输出是相同的：`.strings`\
  \ 文件，你可以对其进行翻译并将其包含在应用程序中。\n\n`ngenstrings` 不仅能从你的代码中提取键和默认值，还能提取你在某些 `LocalizedString()`\
  \ 方法重载中包含的任何注释。这有助于翻译人员理解每段文本的上下文（假设你的注释是良好的），并最终提高他们的翻译质量，从而提高你的本地化应用程序的质量。\n\n\
  ## 使用 ngenstrings\n\n在章节下载内容中找到 `ngenstrings.exe` 和 `lib.dll`，并将它们保存到 Mac 的文件夹中。然后，你可以按照以下步骤从你的国际化应用程序自动生成\
  \ `.strings` 文件：\n\n1. 在 `Debug` 模式下为 iPhone 模拟器编译你的应用程序。（`Release` 模式也可以用，但步骤 3\
  \ 中指定的文件夹会不同。）\n2. 使用 `MonoDevelop` 右键菜单找到你的应用程序文件所在，如图 12-11 所示。该目录将包含一个 `/bin/`\
  \ 文件夹；`.NET` 程序集位于 `/bin/iPhoneSimulator/Debug/`。\n\nFigure 12-11\n\n![f1211.eps](img/f1211_fmt.gif)\n\
  3. 将 `.NET` 程序集拷贝到你保存 `ngenstrings.exe` 的文件夹中。\n4. 从工具（Utilities）文件夹打开 `MacOS Terminal`\
  \ （图标如图 12-12\n\n![f1212.eps](img/f1212_fmt.gif)\n5. 在 `Terminal` 应用中导航到 `ngenstrings`\
  \ 文件夹。\n6. 使用 `Mono` 执行 `ngenstrings`，并将你的 `.NET` 程序集作为参数传递如下：\n\n```\nmono ngenstrings.exe\
  \ <yourapplication>.exe\n```\n\n或者使用本章中的示例：\n\n```\nmono ngenstrings.exe Localization03.exe\n\
  ```\n\n`Terminal` 的输出将类似于图 12-13（每个字符串在处理时都会写入 `Terminal`），并且生成的 `Localizable.strings`\
  \ 文件如图 12-14\n\n![f1213.tif](img/f1213_fmt.jpg)\n\nFigure 12-14\n\n![f1214.tif](img/f1214_fmt.jpg)\n\
  \n然后你可以为你想要支持的每种语言向翻译人员提供 `.strings` 文件。当他们提供完成的翻译时，只需将文件放置在 `MonoDevelop` 项目中正确的\
  \ `.lproj` 文件夹内，并重新生成你的应用程序。\n\n![note.ai](img/note_fmt.gif)\n\n`.strings` 文件的内容按键（key）字母顺序排序，因此你可以使用文件比较工具轻松查看随时间的变化、新增和删除。\n\
  \n## ngenstrings 的局限性\n\n`ngenstrings` 通过检查编译代码中对 `LocalizedString` 方法的调用来工作，然后从该方法中提取参数以构建\
  \ `.strings` 输出文件。\n\n正如此，你应该始终将实际字符串嵌入到方法调用中，如下：\n\n```\nNSBundle.MainBundle.LocalizedString\
  \ (\"First name:\",\"Label for firstname\");\nNSBundle.MainBundle.LocalizedString\
  \ (\"Greeting\",\"Hi {0}\",\"\");\nNSBundle.MainBundle.LocalizedString (\"One\"\
  ,\"1\",\"Nums\",\"The number one\");\n```\n\n你不应该向此方法传递变量，因为 `ngenstrings` 工具无法解析它们。以下可本地化字符串将无法被成功提取：\n\
  \n```\nvar key = \"Firstname\";\nvar product = \"iPad\";\nNSBundle.MainBundle.LocalizedString(key,\"\
  Label for firstname\");\nNSBundle.MainBundle.LocalizedString(\"Product\",\"The \"\
  \ + product,\"\");\n```\n\nApple 的 `genstrings` 工具也有相同的局限性。\n\n![note.ai](img/note_fmt.gif)\n\
  \n`ngenstrings` 是一个使用 `C#` 和 `Mono` 编写的开源工具。你可以自由修改下载提供的源代码，或从 http://github.com/conceptdev/ngenstrings\
  \ 在线获取最新版本。\n\n## 总结\n\n`App Store` 在 70 多个国家可用，这意味着原生语言应用程序有巨大的市场。如果你从开始就花时间对代码进行国际化——使用\
  \ `.strings` 文件和具有文化意识的内容——将为你带来最大的成功机会。\n\n\n\n\n[content]\n\n*   手势识别现在是 `UIKit`\
  \ 框架的一部分，使得在应用程序中轻松支持缩放、平移、点击、旋转和长按。\n*   现在支持自定义输入视图。当视图成为第一响应者时（就像屏幕上键盘那样），自定义输入视图会从屏幕底部向上滑出。此前，文本字段和文本视图仅支持键盘作为输入视图，但在\
  \ iPad 上，你可以提供自己的自定义输入方法。\n*   现在可以使用自定义输入辅助视图。输入辅助视图是附加在输入视图顶部的视图（例如在 Safari 网页表单中输入数据时附加在键盘上的“上一个”和“下一个”按钮）。当对象成为第一响应者时，它会随着输入视图一起滑入。这允许你在虚拟键盘顶部添加自定义工具栏。\n\
  *   对文本显示和输入有了新的支持：\n    *   `Core Text` 框架中增加了复杂的文本显示和布局。\n    *   `UIKit` 框架包含了支持自定义视图的增强、用于拼写检查的新类\
  \ `UITextChecker` 类，以及对编辑菜单中新自定义命令的支持。\n*   可以检测外部显示器和投影仪，并可以在第二个屏幕上显示内容。\n*   支持文件和文档。这对于生产力类应用是必要的。\n\
  *   `UIKit` 框架已增强，支持从应用程序中创建 PDF 内容。\n\n# 什么是 iPad 应用程序？\n\niPhone OS 应用程序通过 `Info.plist`\
  \ 配置中的 `UIDeviceFamily` 条目自标识为 iPad 应用程序。数字“1”表示支持 iPhone/iPod Touch，数字“2”表示支持 iPad，同时提供两者意味着应用程序运行在所有\
  \ iPhone OS 设备上。\n\n```xml\n<key>UIDeviceFamily</key>\n<array>\n���<string>1</string>\n\
  ���<string>2</string>\n</array>\n```\n\n当你在 `MonoTouch` 中创建 iPad 应用程序时，系统会自动为你创建此文件和条目。你可以通过项目选项选择支持\
  \ iPhone、iPad 或两者（如图 13-2 所示），`Info.plist` 条目会自动调整。除非另有说明，本章中的示例下载目标仅针对 iPad。\n\n\
  图 13-2\n\n![f1302.tif](img/f1302_fmt.jpg)\n\n如果你在编写良好的现有 iPhone 应用程序（已具有灵活的用户界面布局）中更改此设置，它应该在不进行进一步更改的情况下以全\
  \ iPad 分辨率运行。此配置条目是 iPhone 和 iPad 应用程序之间最小的区别。\n\n当然，你希望你的 iPad 应用程序针对设备进行优化——本章的其余部分将展示如何实现。\n\
  \n## 设备方向支持\n\niPad 人机交互指南的一个重要特性是，所有 iPad 应用程序必须在任何设备方向上运行。虽然某些 iPhone 应用程序已经支持竖屏和横屏（内置应用如\
  \ Mail 和 Safari 就是很好的例子），但它们也只支持三种视图：Portrait（竖屏）、LandscapeRight（右横）和 LandscapeLeft（左）。为了符合\
  \ Apple 的指南，iPad 应用程序预计在 `PortraitUpsideDown`（倒竖屏）位置也能工作。\n\n当你的应用程序旋转时，你必须确保视图将适当调整大小，这取决于你如何构建用户界面可能是简单的可能是复杂的。在开发\
  \ iPhone 应用程序时，你通常可以直接创建并使用 `UIViewController` 对象；然而，要覆盖 iPad 应用程序的自动旋转行为，你始终需要创建一个子类，如列表\
  \ 13-1 所示。\n\n![download.eps](img/download_fmt.gif)\n\n列表 13-1: 重写 `ShouldAutorotateToInterfaceOrientation`\
  \ (`iPad01\\MyViewController.cs`)\n\n```csharp\n[Register(\"MyViewController\")]\n\
  public class MyViewController : UIViewController\n{\n   public MyViewController\
  \ () {}\n\n   public override bool ShouldAutorotateToInterfaceOrientation\n    \
  \  (UIInterfaceOrientation toInterfaceOrientation)\n   {\n      return true;\n \
  \  }\n}\n```\n\n要看到此效果，你需要在此 `UIViewController` 上放置一些控件并将其添加到窗口中。在每个控件上，你都需要设置 `AutizingMask`\
  \ 属性，以指示当设备旋转时控件的形状和位置应如何变化。列表 13-2 包含两个自动调整大小的示例：\n\n*   一个 `UITextView` 具有灵活的左、上、右、下边距。这意味着控件保持相同的\
  \ `Height` 和 `Width`，但位置相对于其在窗口中的原始位置比例变化。\n*   一个 `UIScrollView` 具有灵活的 `Height`\
  \ 和 `Width`，这意味着边距是“固定”的，无论方向如何，它们将保持“锚定”在窗口边缘。\n\n![download.eps](img/download_fmt.gif)\n\
  \n列表 13-2: `FinishedLaunching` (`iPad01\\Main.cs`)\n\n```csharp\ntext = new UITextView();\n\
  text.Text = \"Golden Gate,\\nSan Francisco\";\ntext.Font = UIFont.FromName(\"Helvetica\"\
  , 36);\ntext.Frame = new Rectangle(200,40,400,100);\ntext.AutoresizingMask = UIViewAutoresizing.FlexibleLeft\
  \ | UIViewAutoresizing.TopMargin | UIViewAutoresizing.RightMargin | UIViewAutoresizing.BottomMargin;\n\
  text.ScrollEnabled = false;\ntext.Editable = false;\n\nimage = UIImage.FromFile(\"\
  GoldenGate.jpg\");\nimageView = new UIImageView(image);\n\ncustomScrollView = new\
  \ UIScrollView(window.Bounds);\ncustomScrollView.AutoresizingMask = UIViewAutoresizing.FlexibleHeight\
  \ | UIViewAutoresizing.FlexibleWidth;\ncustomScrollView.AddSubview(imageView);\n\
  customScrollView.ContentSize = imageView.Frame.Size;\ncustomScrollView.ViewForZooming\
  \ = (UIScrollView sender)\n{\n   return imageView;\n};\n\ncustomViewController =\
  \ new MyViewController();\ncustomViewController.Add(customScrollView);\ncustomViewController.Add(text);\n\
  window.AddSubview(customViewController.View);\n```\n\n图 13-3 显示图像旋转并居中以匹配设备方向。\n\
  \n图 13-3\n\n![f1303.tif](img/f1303_fmt.jpg)\n\n你可以使用 `UIViewAutoresizing` 值的组合来创建所需的布局行为，如果没有提供足够的控制，你可以订阅方向更改事件通知并编写自定义代码手动调整类的大小。\n\
  \n![note.ai](img/note_fmt.gif)\n\n你的 `FinishedLaunching` 代码不应在构建原始布局之前尝试确定设备方向。相反，为单个方向（在代码或\
  \ `MainWindow.xib` 文件中）构建用户界面——一旦应用程序加载完成，操作系统将通知你的应用设备方向，并在首次显示之前更改布局。\n\n## 启动图像\n\
  \n现在你的应用程序支持所有可用方向，你应该确保你的启动图像同样适应屏幕。图像应该填充屏幕，并在顶部留出 20 像素用于状态栏。\n\n提供此支持需要两个元素：首先，使用\
  \ `Info.plist` 文件告知操作系统你的应用程序支持哪些方向，然后向项目中添加特殊命名的图像以便每个方向显示。\n\n你的 `Info.plist`\
  \ 文件应包含以下键和值数组：\n\n```xml\n<key>UISupportedInterfaceOrientations</key>\n<array>\n\
  ���<string>UIInterfaceOrientationPortrait</string>\n���<string>UIInterfaceOrientationLandscapeLeft</string>\n\
  ���<string>UIInterfaceOrientationLandscapeRight</string>\n</array>\n```\n\n\n\n\n\
  ```xml\n<string>UIInterfaceOrientationPortraitUpsideDown</string>\n</array>\n```\n\
  \n并且你的 MonoDevelop 项目应该包含表 13-1 中描述的特殊命名的图像（将它们的 `Build Action` 设置为 `Content`）。\n\
  \n### 表 13-1: 针对特定方向的启动图像\n\n| 键名 | 描述 |\n| --- | --- |\n| Default.png | iPhone\
  \ OS 中在 iPad 发布前用于识别启动图的文件名。你不应该在 iPad 应用程序中使用此文件名，但如果你构建了运行在两种类型设备上的通用应用程序（Universal\
  \ Application），请提供一个 320x460 像素的图像；此图像将用于 iPhone 和 iPod Touch。对于 iPad 应用程序，你应该至少提供两张图像：下文描述的\
  \ `Default-Portrait.png` 和 `Default-Landscape.png`。 |\n| Default-Portrait.png |\
  \ 当设备处于垂直方向（即 Home 键在顶部或底部）时显示的 768x1004 像素的图像，除非也提供了 `Default-PortraitUpsideDown.png`，在这种情况下，当\
  \ Home 键在顶部时将使用该图像。 |\n| Default-PortraitUpsideDown.png | 当设备倒置时（即 Home 键在顶部）显示的\
  \ 768x1004 像素的图像。此图像将取代已提供的 `Default-Portrait.png`，并用于 Home 键在顶部时使用。 |\n| Default-Landscape.png\
  \ | 当设备处于左右任一侧时显示的 1024x748 像素的图像。你可以根据 Home 键在设备的左侧还是右侧，选择提供这张单张图像，或创建以下两张图像。 |\n\
  | Default-LandscapeLeft.png | 覆盖 `Default-Landscape.png` 的 1024x748 像素的图像。 |\n|\
  \ Default-LandscapeRight.png | 覆盖 `Default-Landscape.png` 的 1024x748 像素的图像。 |\n\n\
  章节下载中的示例 iPad02 使用特定方向的名称来演示它们是如何运作的。图 13-4 显示了四种可能方向中使用了 `Default-Portrait.png`\
  \ 和 `Default-Landscape.png` 图像的两种情况。\n\n图 13-4\n\n![f1304.tif](img/f1304_fmt.jpg)\n\
  \n## 新 iPad 特性\n\n除了第 3 和第 4 章涵盖的控件外，iPad 还支持一些新的用户界面控件，这些控件利用了更大的屏幕和“任意方向”的用户界面。图\
  \ 13-5 显示了 iPad Mail 使用新的方向感知分视图控件（split view control）。在 iPhone 上，你必须在收件箱和消息之间来回；然而，iPad\
  \ 允许你同时查看两者。在横屏模式下，收件箱和消息并排显示，而在竖屏模式下，收件箱在一个新的弹出视图控件（popover view control）中可用。\n\
  \n图 13-5\n\n![f1305.tif](img/f1305_fmt.jpg)\n\n## 使用 UISplitViewController\n\n分视图管理另外两个视图控制器，并根据设备的方向显示其中一个或两个。在横屏模式下，第一个视图的固定宽度为\
  \ 320 像素（iPhone 屏幕的宽度），第二个视图占据显示器的其余。在竖屏模式下，宽 320 像素的视图默认隐藏，但可以通过弹出控件（popover control）访问。\n\
  \n要使用 `UISplitViewController` 类，你只需要告诉它使用哪些控制器；它会检测设备的方向并根据需要显示或隐藏第一个视图。列表 13-3\
  \ 显示了设置分视图有多简单（在 Interface Builder 中将 `UISplitViewController` 拖到窗口上，并为其他控件创建了 outlet）。\n\
  \n另外两个视图控制器的唯一要求是它们支持任何方向，如列表 13-1 所示。\n\n![download.eps](img/download_fmt.gif)\n\
  \n列表 13-3: 创建分视图 (iPad03\\Main.cs)\n\n```cs\npublic override void FinishedLaunching\
  \ (UIApplication app, NSDictionary options)\n{\n    DetailViewController = new MyDetailViewController();\n\
  \    MasterViewController = new MyMasterViewController(this);\n    SplitViewController\
  \ = new UISplitViewController();\n    SplitViewController.ViewControllers = \n \
  \       new UIViewController[] {MasterViewController, DetailViewController};\n \
  \   window.AddSubview(SplitViewController.View);\n}\n```\n\n两个视图控制器的完整代码可以在章节下载的\
  \ iPad03 文件 `MyMasterViewController.cs` 和 `MyDetailViewController.cs` 中找到。它们都不包含新内容：详细视图控制器使用了列表\
  \ 13-1 和列表 13-2 合并后的单个类，而主视图控制器包含第 6 章过的简单 `UITableView`。\n\n示例在图 13-6 中所示，横屏模式下显示但在竖屏模式下隐藏。注意图\
  \ 13-6 ![f1306.tif](img/f1306_fmt.jpg) 虽然尚未实现，但建议在竖屏模式下为工具栏提供一个按钮。\n\n1. 首先，你必须在视图中添加工具栏以便放置按钮。\n\
  2. 其次，你必须分配一个 `UISplitDelegate` 来管理按钮的显示和隐藏。在你的 `FinishedLaunching` 方法中放置此行：`SplitViewController.Delegate\
  \ = new MySplitDelegate(this);`。\n\n列表 13-3 显示了如何实现代理。你不需要了解弹出控件的任何知识来使其工作。\n\n\
  ```cs\nclass MySplitDelegate : UISplitViewControllerDelegate\n{\n    AppDelegate\
  \ appd;\n    public MySplitDelegate(AppDelegate app)\n    {\n        appd = app;\
  \ // 传入以便访问工具栏\n    }\n    public override void WillHideViewController (UISplitViewController\
  \ svc, UIViewController aViewController, UIBarButtonItem barButtonItem, UIPoverController\
  \ pc)\n    { // 当视图在 otherwise 隐藏时显示按钮\n        appd.Toolbar.SetItems(new UIBarButtonItem[]{barButtonItem},false);\n\
  \    }\n    public override void WillShowViewController (UISplitViewController svc,\
  \ UIViewController aViewController, UIBarButtonItem button)\n    { // 当视图被显示时用空数组移除所有按钮\n\
  \        // 你可以使用传入的那个从数组中移除\n        appd.Toolbar.SetItems(new UIBarButtonItem[0],false);\n\
  \    }\n}\n```\n\n\n\n通过在分屏视图代理类中实现 `WillPresentViewController` 方法，你可以对弹出框（popover）进行更细控制。在列表\
  \ 13-5 中，该方法被用于设置弹出框的高度为 140 像素。然而，在视图在弹出框中显示之前，你可以执行任何其他需要的操作。\n\n![download.eps](img/download_fmt.gif)\n\
  \nListing 13-5: `UISplitViewDelegate` (`iPad05\\Main.cs`)\n\n```csharp\nclass MySplitViewDelegate\
  \ : UISplitViewControllerDelegate\n{\n    AppDelegate appd;\n    public MySplitViewDelegate(AppDelegate\
  \ app)\n    {\n        appd = app;\n    }\n    // ...WillHideViewController implementation...\n\
  \    // ...WillShowViewController implementation...\n    public override void WillPresentViewController\
  \ (\n      UISplitViewController svc, \n      UIPopoverController pc, \n      UIViewController\
  \ aViewController)\n    {\n        // 设置大小，否则它默认为 320x1100; \n        pc.SetPopoverContentSize(new\
  \ System.Drawing.SizeF(320,140),true);\n    }\n}\n```\n\n## 创建自定义 UIPopover\n\n\
  `UISplitViewController` 会自动为它的一个视图创建一个弹出框，但 `UIPopover` 控件在整个 iPad 内置应用中被用于各种其他目的（其中一些显示在图\
  \ 13-8 中）：\n\n*   通过在触摸对象时显示弹出框，来显示屏幕上某项项目的信息（类似于地图应用程序中的注释）\n*   呈现针对特定对象可以执行的操作（类似于上下文相关菜单）\n\
  *   作为输入助手（例如联系人应用中的生日字段，它会在 `UIPopover` 中呈现一个 `UIDatePicker`）\n\nFigure 13-8\n\n\
  ![f1308.tif](img/f1308_fmt.jpg)\n\n章节下载示例 `iPad05` 为工具栏添加了一个按钮，用于显示自定义的弹出框。列表 13-5\
  \ 显示了如何创建按钮、将其添加到工具栏，并分配一个显示弹出框的代理（稍后定义）。该代理将弹出框分配给 `AppDelegate` 类上的一个公共字段，该字段的声明如下：\n\
  \n```csharp\npublic UIPopoverController CustomPopover;\n```\n\n这样其他代码就可以引用它（例如，为了关闭它）。\n\
  \n列表 13-6 中的高亮代码工作原理如下：\n\n*   创建一个你想要在弹出框中显示的 `UIViewController` 实例。此视图控制器可以简单到只有几个按钮（例如邮件的回复/转发弹出框），也可以包含复杂的\
  \ `UINavigationController` 层次结构（例如邮件收件箱）。\n*   创建一个 `UIPopover` 实例，并为其传递要显示的视图控制器。\n\
  *   调用 `PresentFromBarButtonItem` 方法，传递按钮和方向，以便弹出框知道在何处绘制自己。通常你应该将方向留为 `Any`，让弹出框决定如何最佳渲染。\n\
  \n![download.eps](img/download_fmt.gif)\n\nListing 13-6: 创建弹出框 (`iPad05\\Main.cs`)\n\
  \n```csharp\nbarButton = new UIBarButtonItem();\nbarButton.Title = \"Popover\";\n\
  barButton.Style = UIBarButtonItemStyle.Bordered;\nbarButton.Clicked += delegate(object\
  \ sender, EventArgs e)\n{\n    MyCustomPopoverViewController content = \n      \
  \  new MyCustomPopoverViewController(this);\n    CustomPopover = new UIPopoverController(content);\n\
  \    CustomPopover.PresentFromBarButtonItem (\n        (UIBarButtonItem)sender,\
  \ \n        UIPopoverArrowDirection.Any, true);\n};\nToolbarItems = new UIBarButtonItem[]{barButton};\n\
  customToolbar.Items = ToolbarItems;\n```\n\nListing 13-7 显示了弹出框视图的实现。在大多数方面，它是一个普通的视图控制器——在这种情况下包含三个按钮——额外设置了\
  \ `ContentSizeForInPopover` 属性来控制弹出框的大小。按钮引用 `AppDelegate` 上的 `CustomPopover` 字段来调用\
  \ `Dismiss()` 方法并隐藏弹出框。\n\n![download.eps](img/download_fmt.gif)\n\nListing 13-7:\
  \ `iPad05\\MyCustomPopoverViewController.cs`\n\n```csharp\n[Register(\"CustomPopoverViewController\"\
  )]\npublic partial class MyCustomPopoverViewController : UIViewController\n{\n \
  \   AppDelegate appd;\n    public MyCustomPopoverViewController(AppDelegate app)\n\
  \    {\n        appd = app;\n    }\n    readonly UIButton button1 = UIButton.FromType(UIButtonType.Normal);\n\
  \    readonly UIButton button2 = UIButton.FromType(UIButtonType.Normal);\n    readonly\
  \ UIButton button3 = UIButton.FromType(UIButtonType.Normal);\n    public override\
  \ void ViewDidLoad()\n    {\n        base.ViewDidLoad();\n        button1.SetTitle(\"\
  Button 1\", ControlState.Normal);\n        button2.SetTitle(\"Button 2\", ControlState.Normal);\n\
  \        button3.SetTitle(\"Button 3\", ControlState.Normal);\n        View.addSubview(button1);\n\
  \        View.addSubview(button2);\n        View.addSubview(button3);\n        button1.TouchUpInside\
  \ += (s, e) =>\n        {\n            CustomPopover.Dismiss();\n        };\n  \
  \      button2.TouchUpInside += (s, e) =>\n        {\n            CustomPopover.Dismiss();\n\
  \        };\n        button3.TouchUpInside += (s, e) =>\n        {\n           \
  \ CustomPopover.Dismiss();\n        };\n    }\n    public override SizeF ContentSizeForInPopover()\n\
  \    {\n        return new SizeF(320, 140);\n    }\n}\n```\n\n注意，如果用户点击弹出框外部，它会自动关闭。图\
  \ 13-9 显示了弹出框在屏幕上的样子。\n\n\n\n\n\nListing 13-8 为你的 `AppDelegate` 包含了两个新方法，用于 `UIViewController`\
