  \ 用户触发的导航类型，列在 表 4-1 中。\n\n如果 `ShouldStartLoad` 返回 `true`，则允许请求的导航；如果返回 `false`，则取消导航。你的代码可以执行某些替代操作，例如显示另一个视图或向用户显示警报。\n\
  \n![download.eps](img/download_fmt.gif)\n\n```csharp\nWebBrowser.ShouldStartLoad\
  \ = delegate (UIWebView webView, \n    NSUrlRequest request, UIWebViewNavigationType\
  \ navigationType)\n{\n   if (navigationType == UIWebViewNavigationType.LinkClicked)\n\
  \   {  // 在 Safari 中打开链接而不是在 UIWebView 中\n       UIApplication.SharedApplication.OpenUrl(request.Url);\n\
  \       return false;  // 已经处理\n   }\n   return true;  // 在 UIWebView 中显示其他所有内容\n\
  }\n```\n\n`WebView04\\Main.cs`\n\n![note.ai](img/note_fmt.gif)\n\n注意，由于委托必须有一个返回值，因此它应该使用等号\
  \ (`=`) 赋值给 `ShouldStartLoad`，而不是使用 `+=` 附加。\n\n委托的返回类型必须与它赋值的类型匹配（在本示例中，`WebBrowser.ShouldStartLoad`\
  \ 是布尔值，与委托方法的返回类型匹配）。\n\n你可以通过 `request` 参数查询目标位置，并通过 `navigationType` 参数查询请求的导航类型，以便进行不同的处理（例如，在\
  \ Safari 中打开链接，但允许表单提交在 UIWebView 中继续）。`navigationType` 的可能值见 表 4-1。\n\n表 4-1: UIWebViewNavigationType\n\
  \n| 值 | 描述 |\n| --- | --- |\n| LinkClicked | 点击了链接。 |\n| FormSubmitted | 提交了 HTML\
  \ 表单。 |\n| BackForward | 触发了 `GoBack()` 或 `GoForward()` 方法。 |\n| Reload | 正在重新加载当前显示的内容。\
  \ |\n| FormResubmitted | 表单被重新提交。 |\n| Other | 发生了另一个导航操作。 |\n\n## 其他内容\n\nUIWebView\
  \ 也可以用于显示其他内容。使用加载本地 HTML 文件的相同 C# 代码，你可以显示：\n\n*   你的应用程序可能包含或从互联网下载的 PDF 文档\n\
  *   图像（你也可以使用 `UIImageView` 和 `UIScrollView` 显示，后文会介绍）\n\n### UIScrollView\n\n`UIScrollView`\
  \ 允许你显示和导航比控件本身更大的内容（通常尺寸为整个设备屏幕）。它提供了对滑动移动内容和双指缩放缩放的内置支持（取决于 `UIScrollView` 的类型）。它还是需要滚动比其显示\
  \ `Frame` 更大内容的控件的基类，例如 `UITableView` 和 `UITextView`。\n\n### 图像滚动\n\n内置的照片 应用程序是\
  \ `UIScrollView` 接口最常用的示例。代码列表 4-3 显示了将大图像加载到 `UIScrollView` 并允许用户在其周围平移和缩放所需的代码。\n\
  \n*   `Bounces`: 如果为 `true`，滚动到图像边缘将会在停止前超出图像边缘产生“回弹”效果。\n*   `BouncesZoom`: 如果为\
  \ `true`，当缩放到最小或最大尺寸时，内容在动画到正确尺寸之前临时超出限制。\n*   `ContentSize`: 正在显示内容的真实大小。`UIScrollView`\
  \ 需要知道此值，以便它可以计算滚动条的大小和位置。\n*   `IndicatorStyle`: 使用 `UIScrollViewIndicatorStyle`\
  \ 枚举来选择黑色或白色滚动条（或留为 `Default`）。\n*   `MaximumZoomScale`: 应用于内容的最大缩放因子。接的示例允许将内容扩展到原始大小的四倍。\n\
  *   `MinimumZoomScale`: 应用于内容的最小缩放因子。接的示例允许缩小到原始大小的四分之一。\n*   `ContentOffset`: 内容视图左上角相对于\
  \ `UIScrollView` 的当前位置，表示为 `System.Drawing.PointF`。\n*   `ZoomScale`: 应用于内容的当前缩放比例（默认为\
  \ `1.0`）。代码列表 4-3 最初将图像显示为实际大小的 80%。\n\n`MaximumZoomScale` 和 `MinimumZoomScale`\
  \ 的默认值为 `1.0`，这意味着如果两个都不设置，缩放功能将实际上被禁用。\n\n![download.eps](img/download_fmt.gif)\n\
  \n代码列表 4-3: 使用 UIScrollView 查看图像 (ScrollView01\\Main.cs)\n\n```csharp\nUIImage image\
  \ = UIImage.FromFile(\"GoldenGate.jpg\");\nUIImageView imageView = new UIImageView(image);\n\
  MyScrollView.AddSubview(imageView);\nMyScrollView.ContentSize = imageView.Frame;\n\
  MyScrollView.MaximumZoomScale = 4f;\nMyScrollView.MinimumZoomScale = 0.25f;\nMyScrollView.Bounces\
  \ = false;\nMyScrollView.BouncesZoom = false;\nMyScrollView.IndicatorStyle = UIScrollViewIndicatorStyle.White;\n\
  MyScrollView.ForZooming = delegate (UIScrollView sender)\n{\n   MyScrollView.ContentOffset\
  \ = new System.Drawing.PointF(250, 20);\n   MyScrollView.ZoomScale = 0.8f;\n   return\
  \ imageView;\n};\n```\n\n图 4-6 显示了设备显示与 `UIScrollView` 被裁剪的关系。\n\n### 分页\n\n使用 UIScrollView\
  \ 的分页提供了类似于 iPhone 主屏幕和天气应用程序的行为。不同于上一个示例中在图像周围自由滚动，`UIScrollView` 可以跳转到定义的“页”。此示例与\
  \ 代码列表 4-4 的区别在于设置了 `PagingEnabled = true`（可以通过代码或 Interface Builder 完成）。图 4-7 显示了三者与\
  \ UIScrollView 的关系。\n\n代码列表 4-4: 使用 UIScrollView 分页 (ScrollView02\\Main.cs)\n\n\
  ```csharp\nRectangleF scrollFrame = MyScrollView.Frame;\nscrollFrame.Width = scrollFrame.Width\
  \ * 3;\nMyScrollView.PagingEnabled = true;\nMyScrollView.ContentSize = scrollFrame;\n\
  MyScrollView.HorizontalScrollIndicator = false;\nRectangleF frame = MyScrollView.Frame;\n\
  frame.X = 0;\nUITextView textView = new UITextView(frame);\ntextView.Editable =\
  \ false;\ntextView.Text = \"This is page one\";\nMyScrollView.AddSubview(textView);\n\
  frame.X = frame.Width + 1;\ntextView = new UITextView(frame);\ntextView.Editable\
  \ = false;\ntextView.Text = \"This is page two\";\nMyScrollView.AddSubview(textView);\n\
  frame.X = frame.Width * 2 + 1;\ntextView = new UITextView(frame);\ntextView.Editable\
  \ = false;\ntextView.Text = \"This is page three\";\nMyScrollView.AddSubview(textView);\n\
  ```\n\n### UITextView\n\n`UITextView` 类类似于 WPF 程序员熟悉的 `TextBox` —— 它提供了可编辑（或只读）的可滚动多行文本显示。你可以为视图中的所有文本指定字体、样式、颜色和对齐方式；但是你无法对单个单词或字符进行样式设置。要显示样式化文本，你需要使用\
  \ `UIWebView`。遗憾的是，没有内置控件可以编辑样式化文本（即混合字体、颜色或大小的文本）。\n\n\n\n\n要显示多行文本，你可以直接在 Interface\
  \ Builder 中将 `UITextView` 拖到你的窗口或视图中，并在属性（Attributes）窗口中输入文本。你也可以在代码中创建 `UITextView`，并分别使用\
  \ `Add` 或 `AddSubview` 方法将其添加到窗口或视图中。代码下载项 TextView01 演示了以下属性。\n\n某些属性在 Interface\
  \ Builder 中通过简单的勾选框即可设置，例如：\n\n*   检测电话号码（Detects Phone Numbers）：勾选后，`UITextView`\
  \ 会自动将文本中的电话号码转换为超链接；如果视图不可编辑，点击时将启动拨号。识别的格式包括 `1-800-555-1234` 和 `555-1234`。\n\
  *   检测链接（Detects Links）：勾选后，文本中的任何 URL 都将显示为超链接，点击时将在 `Safari` 中打开。识别的格式包括 `http://wrox.com`\
  \ 和 `www.wrox.com`。\n\n以下属性可以通过 Interface Builder 或代码进行设置：\n\n*   可编辑（Editable）：默认为\
  \ `true`，意味着文本是可编辑的，点击时会显示键盘。将其设置为 `false` 可使文本变为只读。\n*   文本对齐（TextAlignment）：使用\
  \ `UITextAlignment` 枚举选择 `Left`（左对）、`Center`（居中）或 `Right`（右对）。\n*   文本颜色（TextColor）：分配命名颜色（如\
  \ `UIColor.Blue`）、系统颜色（如 `UIColor.DarkTextColor`），或使用“From”方法使用任何其他颜色（`UIColor`\
  \ 有许多方法如 `FromRGB` 和 `FromHSB` 用于根据红/绿/蓝或色调/饱和/亮度值创建特定颜色）。\n*   滚动到顶部（ScrollsToTop）：启用“快捷方式”，点击状态栏（如果显示）会自动将\
  \ `UITextView` 滚动到内容顶部。如果你的文本视图是屏幕上的主控件，应将其设置为 `true`。\n*   指示样式（IndicatorStyle）：由于\
  \ `UITextView` 继承自 `UIScrollView`，你可以使用 `UIScrollViewIndicatorStyle` 将滚动条颜色设置为 `Black`（黑色）或\
  \ `White`（白色），无论你选择何种背景颜色，它都清晰可见。\n\n在代码中，你还可以修改：\n\n*   字体（Font）：设置文本的字体类型和大小。\n\
  \n使用这些属性的代码显示此处：\n\n![download.eps](img/download_fmt.gif)\n\n```csharp\n// UITextView\
  \ outlet is named TextBox\nTextBox.Font = UIFont.FromName(\"Times New Roman\", 24f);\n\
  TextBox.TextAlignment = UITextextAlignment.Left;\nTextBox.TextColor = UIColor.White;\n\
  TextBox.BackgroundColor = UIColor.DarkGray;\nTextBox.ScrollsToTop = true;\nTextBox.IndicatorStyle\
  \ = UIScrollViewIndicatorStyle.White;\n```\n\n`TextView01\\Main.cs`\n\n图 4-8 显示了\
  \ Interface Builder 中的 `UITextView` 选项以及一个显示电话号码和链接的示例。请返回第 2 章回顾如何使用 Interface\
  \ Builder 创建输出（outlets）。\n\n图 4-8\n\n![f0408.tif](img/f0408_fmt.jpg)\n\n### 可编辑文本视图\n\
  \n要使 `UITextView` 可编辑，只需在 Interface Builder 中勾选 `Editable` 复选框，或设置 `Editable = true`。当视图首次显示时，它仅显示可滚动的内容——不会立即接受输入。点击视图将启用编辑，iPhone\
  \ OS 会显示键盘（根据所选的 `KeyboardType`）准备开始输入。列表 4-5 显示了如何使用通知来响应键盘事件，并动态调整输入大小，以便其部分不被键盘遮挡。\n\
  \n![download.eps](img/download_fmt.gif)\n\n列表 4-5: `TextView02\\Main.cs`\n\n```csharp\n\
  NSObject observer1, observer2; // for notifications\n\npublic override bool FinishedLaunching\
  \ (UIApplication app, NSDictionary options)\n{\n    TextBox.Font = UIFont.FromName(\"\
  Helvetica\", 24f);\n    TextBox.ScrollsToTop = true;\n    DoneButton.Enabled = false;\
  \ // set in notification\n    DoneButton.TouchUpInside += delegate \n    {\n   \
  \     TextBox.ResignFirstResponder(); // similar to 'losing focus' in .NET\n   \
  \ };\n\n    // usually created in ViewWillAppear\n    // on a ViewController, rather\
  \ than AppDelegate\n    observer1 = NSNotificationCenter.DefaultCenter.AddObserver\
  \ \n        (UIKeyboard.WillShowNotification, delegate (NSNotification n)\n    {\n\
  \        var kbdRect = UIKeyboard.BoundsFromNotification (n);\n        var frame\
  \ = TextBox.Frame;\n        frame.Height -= kbdRect.Height;\n        TextBox.Frame\
  \ = frame;\n        DoneButton.Enabled = true;\n    });\n\n    observer2 = NSNotificationCenter.DefaultCenter.AddObserver\
  \ \n        (UIKeyboard.WillHideNotification, delegate (NSNotification n)\n    {\n\
  \        var kbdRect = UIKeyboard.BoundsFromNotification (n);\n        var frame\
  \ = TextBox.Frame;\n        frame.Height += kbdRect.Height;\n        TextBox.Frame\
  \ = frame;\n        DoneButton.Enabled = false;\n    });\n\n    return true;\n}\n\
  \npublic override void WillTerminate(UIApplication application)\n{\n    NSNotificationCenter.DefaultCenter.RemoveObserver(observer1);\n\
  \    NSNotificationCenter.DefaultCenter.RemoveObserver(observer2);\n}\n```\n\n![note.ai](img/note.gif)\n\
  \n当处于 `FirstResponder` 状态时，点击视图将启用编辑，iPhone OS 会显示键盘（根据所选的 `KeyboardType`）准备开始输入。等等，文字说：当\
  \ `UITextView` 可编辑时，它将变为 `FirstResponder` 并显示键盘。要隐藏键盘，必须调用 `ResignFirstResponder()`。\n\
  \n图 4-9 显示了读取模式下的 `UITextView``UITextView` 与 `TextField` 共享某些功能：\n\n*   自动大写（AutocapitalizationType）：决定何时自动使用\
  \ Shift 键（例如句首）。默认为 `None`。\n*   自动纠正（AutocorrectionType）：在打字时启用自动纠正。默认为 `correction`。\n\
  *   返回键类型（ReturnKeyType）：注意 `UITextView` 不支持 `TextField` 的行为。\n*   键盘类型（KeyboardType）：允许根据预期的数据类型显示键盘，例如纯文本、电子邮件地址或数字数据。\n\
  \n图 4-9\n\n![f0409.tif](img/f0409_fmt.jpg)\n\n### UIPickerView\n\n`UIPickerView`\
  \ 类似于 Windows Forms 或 WPF 中的列表以及 ASP.NET 中的 `asp:DropDownList` 元素；iPhone OS 提供了独特的显示方式。它提供一组供用户滚动的固定选项，仅支持单项选择——即选择器中心显示的行。图\
  \ 4-10 显示了 Safari 中的示例选择器，该网页使用 `<select>` 元素来捕用户输入。\n\n图 4-10\n\n![f0410.tif](img/f0410_fmt.jpg)\n\
  \n### 单组件选择器\n\n`UIPickerView` 实例应该始终位于窗口边缘（通常是底部）并占据整个屏幕宽度。它只有两个重要的成员：\n\n*   显示选择指示器（ShowsSelectionIndicator）：是否在控件的中心行上显示透明蓝色引导线。\n\
  *   模型（Model）：需要一个代理类，为选择器提供显示和响应用户选择所需的所有信息。模型必须包含或引用你用于选择器的数据。\n\n模型（Model）必须是\
  \ `UIPickerViewModel` 的子类，并实现以下方法：\n\n*   GetComponentCount：在控件中显示的轮盘数量。以下示例显示了单个轮盘，因此硬编码返回\
  \ `1`。\n*   GetRowsInComponent：在轮盘中显示的数据项数量。\n*   GetTitle：返回每行显示的文本。\n*   Selected：当用户更改行时调用。\n\
  \n\n\n\nListing 4-6 显示了本章节代码下载中 `PickerView01` 示例的代码。它要求使用 Interface Builder 在窗口上放置一个\
  \ `UIPickerView` 和一个 `UITextBox`。\n\n![download.eps](img/download_fmt.gif)\n\nListing\
  \ 4-6: `PickerView01\\Main.cs`\n\n```csharp\npublic override bool FinishedLaunching\
  \ (UIApplication app, NSDictionary options)\n{\n    ListBox.Model = new ListBoxModel(this);\n\
  \    ListBox.ShowSelectionIndicator = true;\n    window.MakeKeyAndVisible();\n \
  \   return true;\n}\n\nclass ListBoxModel : UIPickerViewModel\n{\n    AppDelegate\
  \ app;\n    List<string> data;\n    public ListBoxModel(AppDelegate appDelegate)\n\
  \    {\n        app = appDelegate;\n        data = new List<string> {\"Cirrus\"\
  ,\"Stratus\",\"Cumulus\",\"Fog\"};\n    }\n    public override int GetComponentCount\
  \ (UIPickerView picker)\n    {\n        return 1;\n    }\n    public override int\
  \ GetRowsInComponent (UIPickerView picker, int component)\n    {\n        return\
  \ data.Count;\n    }\n    public override string GetTitle (UIPickerView picker,\
  \ int row, int component)\n    {\n        return data[row];\n    }\n    public override\
  \ void Selected (UIPickerView picker, int row, int component)\n    {\n        app.DisplayText.Text\
  \ = \"You selected \" + data[row];\n    }\n}\n```\n\nFigure 4-11 显示了前述单组件选择器和一个多组件选择器的示例（将在接下来的节中解释）。\n\
  \n### 多组件选择器\n\n`UIPickers` 也可以显示多个组件，这些组件可以是相互独立的，也可以是相关的。\n\n多组件选择器使用与之前相同的方法，不同之处在于返回值取决于传入的是哪个组件而改变。还有一个额外的方法\
  \ `GetComponentWidth` 用于设置每个组件的宽度。\n\nListing 4-7 显示了启用 Figure 4-11 中三轮示例所需的代码。\n\
  \nFigure 4-11\n\n![f0411.tif](img/f0411_fmt.jpg)![download.eps](img/download_fmt.gif)\n\
  \nListing 4-7: `PickerView02\\Main.cs`\n\n```csharp\nclass ListBoxModel : UIPickerViewModel\n\
  {\n    AppDelegate app;\n    List<List<string>> data;\n    public ListBoxModel(AppDelegate\
  \ appDelegate)\n    {\n        app = appDelegate;\n        data = new List<List<string>>();\n\
  \        data.Add(new List<string> {\"Coffee\",\"Tea\",\"Chocolate\"});\n      \
  \  data.Add(new List<string> {\"Black\",\"Milk\",\"Skim\",\"Soy\"});\n        data.Add(new\
  \ List<string> {\"straight\",\"1 sugar\",\"2 sugars\",\"3 sugars\"});\n    }\n \
  \   public override int GetComponentCount (UIPickerView picker)\n    {\n       \
  \ return data.Count;\n    }\n    public override int GetRowsInComponent (UIPickerView\
  \ picker, int component)\n    {\n        return data[component].Count;\n    }\n\
  \    public override string GetTitle (UIPickerView picker, int row, int component)\n\
  \    {\n        return data[component][row];\n    }\n    public override float GetComponentWidth\
  \ (UIPickerView picker, int component)\n    {\n        switch (component)\n    \
  \    {\n            case 0: return 10;\n            case 1: return 80;\n       \
  \     default: return 100; // 3rd wheel\n        }\n    }\n    public override void\
  \ Selected (UIPickerView picker, int row, int component)\n    {\n        app.DisplayText.Text\
  \ = \"You selected \" + data[0][picker.SelectedRowComponent(0)] + \" \" + data[1][picker.SelectedRowComponent(1)]\
  \ + \" \" + data[2][picker.SelectedRowComponent(2)];\n    }\n}\n```\n\n如果你的组件是相互依赖的，你可能会在\
  \ `Selected` 方法中调用以下两个方法：\n\n* `ReloadComponent`：如果一个组件中的选择影响了其他组件显示的内容，则对每个组件调用此方法。\n\
  * `Select`：强制选择某个组件中的特定行。如果你使用了 `ReloadComponent`，你可能还想将该组件的被选中行重置为第一项，或者你可以跟踪之前的选择。\n\
  \nListing 4-8 显示了你如何在 `UIPickerView` 中实现双级层次结构，其中第二个组件中的不同选项取决于第一个组件中的选择，如 Figure\
  \ 4-12 所示。\n\n![download.eps](img/download_fmt.gif)\n\nListing 4-8: `PickerView03\\\
  Main.cs`\n\n```csharp\nclass ListBoxModel : UIPickerViewModel\n{\n    AppDelegate\
  \ app;\n    List<string> data1;\n    List<List<string>> data2;\n    public ListBoxModel(AppDelegate\
  \ appDelegate)\n    {\n        app = appDelegate;\n        // 每个组件独立的数据\n      \
  \  data1 = new List<string> {\"Coffee\", \"Tea\"};\n        data2 = new List<List<string>>();\n\
  \        data2.Add(new List<string> {\"Espresso\",\"Latte\",\"Cappuccino\",\"Macchiato\"\
  });\n        data2.Add(new List<string> {\"Black\",\"Green\",\"Peppermint\",\"Chai\"\
  });\n    }\n    public override int GetComponentCount (UIPickerView picker)\n  \
  \  {\n        return 2;\n    }\n    public override int GetRowsInComponent (UIPickerView\
  \ picker, int component)\n    {\n        if (component == 0)\n            return\
  \ data1.Count;\n        else // 使用的数据取决于组件 0 的选择\n            return data2[picker.SelectedRowComponent(0)].Count;\n\
  \    }\n    public override string GetTitle (UIPickerView picker, int row, int component)\n\
  \    {\n        if (component == 0)\n            return data1[row];\n        else\
  \ // 使用的数据取决于组件 0 的选择\n            return data2[picker.SelectedRowComponent(0)][row];\n\
  \    }\n    public override float GetComponentWidth (UIPickerView picker, int component)\n\
  \    {\n        switch (component)\n        {\n            case 0: return 10;\n\
  \            case 1: return 80;\n            default: return 100; // 3rd wheel\n\
  \        }\n    }\n    public override void Selected (UIPickerView picker, int row,\
  \ int component)\n    {\n        if (component == 0)\n        {\n            //\
  \ 当第一个轮发生变化时，重载第二个\n            picker.ReloadComponent(1);\n        }\n        else\n\
  \        {\n            // 当第二个轮发生变化时，选择第一行\n            picker.Select(0, true);\n\
  \        }\n        app.DisplayText.Text = \"You selected \" + data1[picker.SelectedRowComponent(0)]\
  \ + \" \" + data2[picker.SelectedRowComponent(0)][picker.SelectedRowComponent(1)];\n\
  \    }\n}\n```\n\nFigure 4-12\n\n![f012.tif](img/f012_fmt.jpg)\n\n### UIDatePicker\n\
  \n`UIDatePicker` 控件是 `UIPickerView` 的一个特殊版本，但它的要简单得多，因为不需要 `Model` 类——数据源仅由日期和时间组成。iPhone\
  \ OS 用户在内置的日历和时钟应用程序可以看到此视图。\n\nFigure 4-13 显示了 `UIDatePicker` 的四种不同类型：时钟中的倒计时、日期视图、日历中使用的日期与时间视图，以及也用于时钟的时间视图。\n\
  \n\n\n\n\n* `Mode`: 表 4-2 中显示的 `UIDatePickerMode` 值之一。\n\n#### 表 4-2： UIDatePickerMode\
  \ 值\n\n| 举举 | 描述 |\n| --- | --- |\n| `CountDownTimer` | 选择小时和分钟。适用于选择与一天时间不直接相关的\
  \ `TimeSpan`。 |\n| `Date` | 显示月份、日期和年份（但不显示星期）。用于选择生日、节假日或其他具有年份的日期。 |\n| `DateAndTime`\
  \ | （默认值）显示星期、月份、日期、小时、分钟和 am/pm 选择。不显示年份。适用于选择预约和提醒事项。 |\n| `Time` | 选择小时、分钟和 am/pm。用于设置闹钟或时间。\
  \ |\n\n章节下载的示例 `DatePicker01` 展示了一个类似于“日历”应用程序的基本“预约选择器”，在该应用程序中，你使用同一个 `UIDatePicker`\
  \ 选择开始和结束时间。在 Interface Builder 中，你需要在窗口上两个按钮、两个标签和一个日期选择器，并在 `FinishedLaunching`\
  \ 中包含以下代码：\n\n![download.eps](img/download_fmt.gif)\n\n```csharp\nDateSelection.MinuteInterval\
  \ = 6; // default 5\nDateSelection.MinimumDate = new DateTime (2010,05,01);\nDateSelection.MaximumDate\
  \ = new DateTime (2011,01,01);\nDateSelection.Mode = UIDatePickerMode.DateAndTime;\n\
  FromDate.Text = DateTime.Now.ToString(\"ddd dd MMM yyyy h:mm tt\");\nToDate.Text\
  \ = DateTime.Now.AddHours(1).ToString(\"ddd dd MMM yyyy h:mm tt\");\n\nFromButton.TouchUpInside\
  \ += delegate\n{  // 编辑开始时间\n  editingStart = true; \n  DateSelection.Date = DateTime.Parse(FromDate.Text);\n\
  };\n\nToButton.TouchUpInside += delegate\n{  // 编辑结束时间\n  editingStart = false;\
  \ \n  DateSelection.SetDate(DateTime.Parse(ToDate.Text),false);\n};\n\nDateSelection.ValueChanged\
  \ += delegate(object sender, EventArgs e)\n{  // 更新显示\n  var ctrl = (UIDatePicker)sender;\n\
  \  var dateString = DateTime.Parse(ctrl.Date.ToString())\n                  .ToString(\"\
  ddd dd MMM yyyy h:mm tt\");\n  if (editingStart) FromDate.Text = dateString;\n \
  \ else ToDate.Text = dateString;\n};\n```\n\n`DatePicker01\\Main.cs`\n\n结果如图 4-14](#9780470908594c04.xhtml_figure4-14)\
  \ 所示——触摸两个日期中的任意一个即可使用 `UIDatePicker` 编辑它们。\n\n图 4-14\n\n![f0414.tif](img/f0414_fmt.jpg)\n\
  \n### 控制器与栏\n\n除了章节开头提到的 `Window` 和 `View` 类外，`UIViewController` 及其子类构成了所有 iPhone\
  \ OS 应用程序的基础。`UIViewController` 类本身用于显示单个全屏视图（以及子视图）。自定义子类是在你的应用程序中复用常用视图相关代码的好方法。\n\
  \n本节的另外两个类——`UITabBarController` 和 `INavigationController`——用于协调应用程序中的多个不同视图。标签页栏（tab\
  \ bar）的作用与 WPF 或 Windows Forms 中的 `TabControl` 相同：允许用户在不同视图之间来回导航。导航控制器在本质上是分级的，允许用户在“返回”按钮的支持下进行“下钻”。它们都使用若干支持性类来提供其功能，分别为\
  \ `UITabBarItem` 以及 `UINavigation` 和 `INavigationItem`。\n\n`UIToolbar` 略有不同——它设计用于使用\
  \ `UIBarButtonItem` 以及固定和灵活间距选项来显示适用于单个视图的选项。\n\n### UIViewController\n\n`UIViewController`\
  \ 最常用的方法和属性是：\n\n* `ViewDidLoad`: 在任何关联视图加载完成后后调用。该方法通常是你放置初始化代码（例如接线事件委托程序）的地方。它在对象的生命周期内被调用一次。\n\
  * `ViewWillAppear`: 执行与显示视图相关的任何额外任务。该方法在 `ViewDidLoad` 之后直接调用，然后在每次视图重新显示时再次调用。在你的实现中始终要调用\
  \ `base.ViewWillAppear()`。\n* `ViewWillDisappear`: 视图即将隐藏的通知。你可以使用此方法来提交编辑更改，因为你不知道视图是否还会再次显示。在你的实现中始终要调用\
  \ `base.ViewWillDisappear()`。\n* `Title`: 用于设置视图标题的属性。\n* `View`: 返回控制器主视图的属性。\n\
  \n`UIViewController` 类本身用于显示单个全屏视图（以及子视图）。自定义子类是在你的应用程序中复用常用视图相关代码的好方法。\n\n其他属性包括：\n\
  \n* `NavigationController`: 除非此控制器被推送到导航栈上，否则为 null。\n* `INavigationItem`: 指向表示此控制器的\
  \ `INavigationItem`。\n* `TabBarController`: 除非此控制器已添加到标签页栏，否则为 null。\n* `TabBarItem`:\
  \ 指向表示此控制器的 `UITabBarItem`。\n* `ToolbarItems`: `UIBarButtonItem` 数组。\n\n### UIToolbar\n\
  \n工具栏的一个例子是 Safari。为了演示 `UIToolbar` 的用法，你将在 `WebView` 示例中添加按钮——图 4-15](#9780470908594c04.xhtml_figure4-15)\
  \ 显示了左侧的 Safari 和右侧的示例。\n\n图 4-15\n\n![f0415.tif](img/f0415_fmt.jpg)\n\n从 `WebView02`\
  \ 示例代码开始，删除后和前进按钮，并将 `UIToolbar` 控件拖到窗口上。然后添加四个 `UIBarButtonItem` 和间距项以匹配图 4-16](#9780470908594c04.xhtml_figure4-16)。\n\
  \n图 4-16\n\n![f0416.tif](img/f0416_fmt.jpg)\n\n在 Interface Builder 中按以下方式更新项目：\n\
  \n* 后退和前进按钮可以连接到示例代码中的现有输出属性。这些按钮使用 `Bordered` 样式，并将它们的标题设为文本。\n* 为刷新和停止按钮创建两个额外的输出属性。它们应更新为使用\
  \ `Plain` 样式，并且不再显示文本，而是选择一个内置的标识符（分别为 `Refresh` 和 `Stop`）。\n* 使用 `Fixed`（固定）和 `Flexible`（灵活）间距控件将图标排列在你想要的位置。\n\
  \n\n\n\n\n[表 4-4] 显示了工具栏按钮可用的系统值——如果您的应用程序功能与这些选项描述的相似，您应该使用系统图标以遵循 Apple 的一致性用户界面。相反，你不应该对不等同于内置功能的功能使用系统图标——这会误导用户，应该用自定义图标或文本来表示。\n\
