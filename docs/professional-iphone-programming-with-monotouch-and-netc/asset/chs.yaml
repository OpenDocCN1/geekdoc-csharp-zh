  ```\n\n## 使用基于 REST 的 Web 服务\n\nREST 代表表现层状态转换，它是分布式系统（如万维网）的一种通用架构。REST 架构由客户端服务器组成。服务器处理来自客户端的请求。\n\
  \n基于 REST 的 Web 服务通常具有三个特征：\n\n1.  资源的可寻性。部分数据可以通过 URL 访问。\n2.  数据通过不同的 HTTP 动词传输。这些动词通常用于：\n\
  \    *   `GET`：`GET` 操作将输入数据通过 URL 传输。这被认为是对数据的请求。\n    *   `POST`：`POST` 操作将输入数据通过请求体传输。`POST`\
  \ 用于添加/插入数据。\n    *   `PUT`：`PUT` 操作将输入数据通过请求体传输。`PUT` 用于更新数据。\n    *   `DELETE`：`DELETE`\
  \ 操作将所有数据通过请求体传输。`DELETE` 用于删除数据。\n\n\n\n\n\n尽管一些纯主义者可能会对此有异议，但使用不同的 HTTP 动词执行 REST\
  \ 风格的操作可能有合理的理由。此外，某些操作系统和设备不支持所有的 HTTP 动词。这里的示例使用了 `GET` 和 `POST` 动词进行操作。\n\n###\
  \ 3. 数据可以以各种格式编码发送，例如文本、`XML` 以及任何其他有效数据类型。在官方范围内，这被称为 MIME 类型。\n\n### 使用 JavaScript\
  \ 对象表示 (JSON)\n\n大多数开发者都熟悉可扩展标记语言（`XML`），它被用于数据交换。`JSON` 是一种类似的技术；它是一种基于 JavaScript\
  \ 脚本语言的数据交换格式。`JSON` 格式使用了一系列大多数使用 C 系语言的程序员都熟悉的约定。`JSON` 构建在两个概念之上：\n\n*   数据以一系列键值对的形式传输。这些值可以是单个值，也可以是一系列值（例如数组）。\n\
  *   数据存储在一种可以被看作序列的结构中。\n\n由于这些概念被广泛接受，它们在几乎所有现代编程语言中都是通用的。因此，几乎所有的编程语言对 `JSON`\
  \ 都有某种支持。在 `.NET` 中，微软通过 2007 年发布的 `ASP.NET 2` AJAX 库引入了对 `JSON` 的支持。现在得益于 `WCF`、流行的\
  \ `JSON.NET` 库以及其他各种库，程序员在 `.NET` 中拥有多种 `JSON` 选项。\n\n以下是一个 `JSON` 数据包的示例：\n\n```json\n\
  {\n    \"ld\":{\n        \"UserName\":\"tiger\",\n        \"PassWord\":\"scott\"\
  ,\n        \"AppKey\":\"blah\"\n    },\n    \"TwitterId\":\"wbm\",\n    \"PageIndex\"\
  :\"1\"\n}\n```\n\n在此示例显示了三个参数：\n\n*   `ld`: 该对象内部三个属性：\n    *   `UserName`: `UserName`\
  \ 属性的值为 `tiger`。\n    *   `PassWord`: `PassWord` 属性的值为 `scott`。\n    *   `AppKey`:\
  \ `AppKey` 属性的值为 `blah`。\n*   `TwitterId`: `TwitterId` 属性的值为 `wbm`。\n*   `PageIndex`:\
  \ `PageIndex` 属性的值为 `1`。\n\n### 获取数据\n\n本节介绍了如何使用 `Twitter Search API` 从 Twitter\
  \ 获取数据。\n\n##### 使用 LINQ to XML\n\n语言集成查询（`LINQ`）是方法、操作、规则和类型的集合，允许在 `Visual Basic`\
  \ 或 `C#` 等 `.NET` 语言中进行数据查询。`LINQ` 发布于 `.NET 3.5` 框架中，并且 `Mono` 项目中存在对多个数据提供者的 `LINQ`\
  \ 支持。\n\n`LINQ` to `XML` 是一技术，允许将 `XML` 文档转换为 `XElement` 对象，根据某些标准进行查询，并转换为对象集合。查询在本地执行引擎中执行。\n\
