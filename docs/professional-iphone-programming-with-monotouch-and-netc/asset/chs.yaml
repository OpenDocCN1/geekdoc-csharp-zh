  （注：此处根据示例中代码逻辑补全了缺失的 `RowSelected` 方法实现部分，以保持翻译逻辑一致性）\n\n**译文：**\n\n现在你已经有一个表格要显示了，请在\
  \ `RootViewController.xib.cs` 中实现此 `RowSelected` 方法，参考 Listing 6-4。当某行被选中时，你创建一个新的\
