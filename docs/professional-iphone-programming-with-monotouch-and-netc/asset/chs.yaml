  \ = new UINavigationController ();\n      navigationController.PushViewController\
  \ (TableViewController, false);\n      navigationController.TopViewController.Title\
  \ = \"My Photos\";\n      window.AddSubview (navigationController.View);\n    }\n\
  \    else\n    {\n      // iPad - use a splitview, and add a toolbar to the image\
  \ view controller\n      Toolbar = new UIToolbar ();\n      Toolbar.Frame = new\
  \ RectangleF(0,0,UIScreen.MainScreen.Bounds.Width,40);\n      DetailViewController\
  \ = new MyDetailViewController (Toolbar);\n      ViewPort = DetailViewController.ViewPort;\
  \ // for RowSelected\n      SplitViewController = new UISplitViewController ();\n\
  \      SplitViewController.Delegate = new MySplitViewDelegate (this);\n      SplitViewController.ViewControllers\
