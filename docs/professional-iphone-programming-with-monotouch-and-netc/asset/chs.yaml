  \ FAQ，请点击任何 P2P 页面上的 `FAQ` 链接。\n\n# 第 1 章：C# 开发者使用 MonoTouch 进行 iPhone 开发简介\n\n\
  ## 本章内容\n\n* iPhone 的历史及其心智占有率\n* Mono 的简史及其与 .NET Framework 的关系\n* MonoTouch 如何为\
  \ .NET 开发者开启 iPhone 大门\n* 为什么 MonoTouch 对开发者如此有吸引力\n\n过去几年里，智能手机的使用增长惊人，《今日美国》最近报道了智能手机如何成为人们生活中不可或缺的一部分。\n\
  \n尽管运行 `x86` 或 `x64` 处理器的 Windows 电脑主导了桌面电脑，且 `.NET Framework` 是 Windows 平台主要的开发环境，但并没有单一供应商或平台主导移动设备；基于\
  \ `Symbian`、`Blackberry`、`Windows Mobile`、`Android` 的设备可用。此外，设备可能运行相同的操作系统并以不同的形式呈现给用户。市场的碎片化对开发者来说是有问题的——他们如何将已经熟悉并使用的开发框架或工具应用到一个市场巨大且不断增长的设备中呢？\n\
  \n本章探讨了最大的开发者群体如何针对心智占有率最高的智能手机，以及手机的增长如何快于任何其他设备。\n\n## 产品比较\n\n本节简要查看了 `.NET Framework`、Mono\
  \ 和 MonoTouch —— 这三个产品让最大的开发者群体能够针对目前市场上最令人兴奋的移动平台 iPhone。\n\n### .NET Framework\n\
  \n在 20 世纪 90 年代末期，微软开始开发 `.NET Framework`。该框架的第一版本于 2002 年发布。微软继续引入了后续的 `.NET Framework`\
  \ 版本，并在最近引入了 `.NET Framework 4`。`.NET Framework` 有多个版本，包括 32 位版本、64 位版本、针对 `XBOX`\
  \ 游戏平台的版本，以及针对微软移动设备的版本（称为 Compact Framework (CF)）。关于 `.NET Framework` 的一些事实：\n\n\
  * 微软随框架一起发布了一个开发工具 `Visual Studio .NET`。该工具是 .NET 的集成开发环境。\n* 它基于一个虚拟机，用于执行为该框架编写的软件。该虚拟机环境被称为\
  \ `Common Language Runtime (CLR)`，它负责安全、内存管理、程序执行和异常处理。\n* 在 `.NET Framework` 中编写的应用最初从源代码（如\
  \ `Visual Basic` 或 `C#`）编译为中间语言，称为 `MSIL`。初始编译通过调用特定语言的命令行编译器 `Visual Studio` 或其他构建工具完成。当在执行应用程序时，通常会进行第二次编译。第二次编译获取中间语言并将其编译成可以在操作系统上运行的可执行代码。这种第二次编译被称为即时编译（JIT\
  \ compilation）。\n* 它是语言无关的，该框架支持多种语言。在 `Visual Studio` 中，微软发布了多种语言，包括 `Visual Basic`、`F#`、`C++`\
  \ 和 `C#`。\n\n\n\n\n\n-   它拥有一系列库，可以在各种语言中提供一致的功能。这些库被称为`基类库`（Base Class Libraries）。\n\
  -   微软已将 `.NET Framework` 的各个部分提交给不同的标准组织。其中包含 `C#` 语言、`通用语言基础`(Common Language\
  \ Infrastructure）、`通用类型系统`（CTS）、`通用语言规范`(CLS）以及`虚拟执行系统`（VES）。\n-   它是目前所有开发框架中开发者人数最多的框架。因此，相比任何其他开发框架，有更多开发者对\
  \ `.NET Framework` 熟悉。\n-   `.NET Framework` 的一个缺点是不支持非微软平台。\n\n# Mono\n\nMono 是一个开源项目，在非\
  \ Windows 操作系统上提供 `C#` 编译器和`通用语言运行时`(Common Language Runtime）。Mono 目前根据 `GPL` 版本\
  \ 2、`LGPL` 版本 2、`MIT` 以及双重许可进行授权。Mono 运行在 Mac、Linux、`BSD` 以及其他操作系统上。\n\nMono 于 2001\
  \ 年正式发布，是 Miguel de Icaza 的心血结晶。Mono `1.0` 版本于 2004 年发布，目前 Mono 处于 `2.6` 版本。Mono\
  \ 持续由 Miguel de Icaza 领导，并在 Novell 的总体领导和支持下运行。\n\n尽管有匹配 .NET Framework 功能的愿望，但由于微软在开发这些功能方面拥有更多资源和先发优势，这是无法实现的。同时，Mono\
  \ 项目在许多 `.NET Framework` 功能上是等同的。\n\n除了 Mono 之外还有一个名为 `MonoDevelop` 的开源 IDE，它最初是\
  \ `SharpDevelop` IDE 的移植版。`MonoDevelop` 起是一个允许在 Linux 上进行 Mono 开发的项目，但随着 `MonoDevelop`\
  \ `2.2` 版本的发布，使用 Mono 进行开发的能力扩展到了 Mac、Windows 以及其他几个非 Linux 的 UNIX 平台。\n\n尽管 `.NET\
  \ Framework` 非常流行，但有两个问题使其不适合运行在 iPhone 上：\n\n*   在某种程度上，苹果和微软是竞争对手，可能不太热衷于合作。\n\
  *   `.NET Framework` 从根本上是在运行时进行动态编译的。这就是 `.NET Framework` 的即时编译（just-in-time compilation）。这违反了苹果的许可和\
  \ iPhone OS 的运行原则。\n\n鉴于运行在微软 .NET Framework 上的代码在运行时通过即时编译编译为机器码，人们预计为 Mono 编写的应用程序具有相同的行为，因此不适合运行在\
  \ iPhone 上。然而，Mono 拥有一项允许应用程序提前编译的技术，被称为 `AOT` 技术。\n\n`.NET/Mono` 和 iPhone 的一个缺点是，.NET/Mono\
  \ 开发者无法将他们的 .NET/Mono/C#` 知识应用于 iPhone 平台。如图图 1-1 所示，你可以看到 .NET/Mono 开发者无法针对 iPhone\
  \ 的原因是它们是两个独立的实体。\n\n图 1-1\n\n![f0101.eps](img/f0101_fmt.gif)\n\n# MonoTouch\n\n\
  2009 年，Novell 发布并交付了 `MonoTouch`，它允许 .NET 开发者使用 `C#` 创建原生 iPhone 应用程序。通过 `MonoTouch`，应用程序被编译为运行在\
  \ iPhone 上的可执行代码。其意义不应被忽视：.NET/Mono 开发者可以通过 `MonoTouch` 针对 iPhone。如图图 1-2 所示。\n\n\
  图 1-2\n\n![f0102.eps](img/f0102_fmt.gif)\n\n`MonoTouch` 如何实现这一点的？它是否某种方式允许 Windows\
  \ Forms 应用程序翻译或重新编译并部署到 iPhone 上？`MonoTouch` 在 iPhone OS 存在的原生 iPhone 编程层之上提供了一个\
  \ .NET 层，被称为 `Cocoa Touch`。`Cocoa Touch` 基于 Mac OS X 中的 `Cocoa` 层，并可在 iPhone、iPod\
  \ Touch 和 iPad 上使用。`MonoTouch` 不提供交叉编译 Windows Forms 应用程序的机制，但允许开发者构建在 iPhone 上原生运行的应用程序。\n\
  \n总的来说，`MonoTouch SDK` 暴露的应用程序编程接口 (API) 是 `.NET 2.0 Framework` 核心功能、`Silverlight\
  \ 2.0 API` 以及 iPhone 上 API 的组合。`MonoTouch` 在 iPhone 基于 `Objective-C` 的原生 API 与 `C#`\
  \ 开发者熟悉的基于 C 的 API 到 .NET 世界之间提供了一个桥梁（互操作）。\n\n## MonoTouch 组件\n\n`MonoTouch` 由以下四个组件组成：\n\
  \n*   `Monotouch.dll` 是一个 `C#` 程序集，提供了连接到 iPhone 原生 API 的绑定 API。\n*   一个编译 `C#`\
  \ 和`通用中间语言`(CIL) 代码的命令行工具。这些编译后的代码可以在模拟器或实际 iPhone 上运行。\n*   `MonoDevelop` 的一个插件，允许\
  \ iPhone 开发以及使用 `Interface Builder` 创建图形化应用程序。\n*   Mono 运行时商业许可，允许与开发的代码进行静态链接。\n\
  \n## 命名空间与类\n\n`MonoTouch` 提供了一套用于构建 iPhone 应用程序的丰富命名空间和类。最常用的命名空间和类包括：\n\n*   `MonoTouch.ObjCRuntime`:\
  \ 提供连接到 iPhone 原生 API 的绑定 API。\n*   `MonoTouch.Foundation`: 该命名空间提供与 `Objective-C`\
  \ 通信所需的数据类型。大多数类型都是直接映射。某些类没有直接映射，而是映射到 .NET 类型。例如，“NSString` 映射到基本字符串类型，“NSArray`\
  \ 映射到强类型数组。\n*   `MonoTouch.UIKit`: 该命名空间为 `Cocoa Touch` 中的 UI 组件提供了直接映射。映射是通过为每个\
  \ UI 组件提供 .NET 类实现的，这是开发者可能会花费时间的命名空间。\n*   `MonoTouch.OpenTK`: 该命名空间是 `OpenTK`\
  \ API 的修改版本。`OpenTK` 是 `OpenGL` 的面向对象的绑定，`OpenGL` 是一个用于使用三维图形形的 API。`OpenTK` 是 `OpenGL`、`OpenAL`\
  \ 和 `OpenCL` 的库。它用 `C#` 编写并运行在 Windows、Mac 和 Linux 上。iPhone 上的 `OpenTK` 实现已更新为使用\
  \ `CoreGraphics` 并仅暴露 iPhone 可用的功能。\n\n此外，`MonoTouch` 还了一些对你重要的额外命名空间。这些是：\n\n*\
  \   `MonoTouch.AddressBook`\n*   `MonoTouch.CoreGraphics`\n*   `MonoTouch.AddressBookUI`\n\
  *   `MonoTouch.AudioToolbox`\n*   `MonoTouch.MapKit`\n*   `MonoTouch.MediaPlayer`\n\
  *   `MonoTouch.AVFoundation`\n*   `MonoTouch.MediaPlayer`\n*   `MonoTouch.CoreAnimation`\n\
  *   `MonoTouch.SystemConfiguration`\n\n这些命名空间在其功能上通而易懂，并且是 iPhone 特有的。\n\n# MonoDevelop\n\
  \n`MonoDevelop` 是一个用于 Mono 开发的免费 IDE，是 `SharpDevelop` IDE 的早期分支。最初 `MonoDevelop`\
  \ 只运行在 Linux 上，但从 `2.2` 版本开始，`MonoDevelop` 开始在 Mac 上运行。Mac 上的 `MonoDevelop` 允许 iPhone\
  \ 项目的创建和管理，以及到模拟器和设备上的调试和部署。\n\n\n\n\n\n毫无疑问，自 2001 年推出初代 iPod 以来，Apple 已经改变了移动设备市场。虽然\
  \ iPod 不是第一个播放 mp3 文件的设备，但它是第一个播放 mp3 文件、易于使用，并提供易于购买音频文件的市场的产品。iPod 确实导致了 mp3 设备市场的爆发式增长。\n\
  \n2007 年 1 月，Apple 在正式发布第一代 iPhone 时彻底颠覆了智能手机的格局。iPhone 被设计为一种提供网页浏览、电子邮件和多媒体功能的智能手机。第一代\
  \ iPhone 连接到无线网络，应用程序通过 `Safari` 的移动版本向用户交付。\n\n为 iPhone 编写基于 Web 的应用程序非常简单。`Safari`\
  \ 浏览器是一个很好的工具——它在将 Web 应用程序缩放到适合 iPhone 大小的屏幕运行方面做得出色。它在运行高度依赖 `JavaScript` 的应用程序方面也很好。升级\
  \ iPhone Web 应用程序也只需向 Web 服务器部署应用程序的新版本即可。许多应用程序都采用了这种方法。\n\n![note.ai](img/note_fmt.gif)\n\
  \n遗憾的是，Web 应用程序并不所有的所有的——需要某些后台处理、访问本地资源、在无网络连接时也必须工作以及其他某些类型的应用程序在这种模式下运行得并不良好。\n\
  \n因此，问题变成了：如何编写一个适合 iPhone 的应用程序呢？\n\n第一代 iPhone 不支持用户在设备上加载应用程序。对于某些用户来说，这是不可接受的，他们开始对\
  \ iPhone 进行“越狱”（jailbreaking），越狱是指用户在设备上运行 Apple 未批准的软件的过程。\n\n越狱存在几个问题：\n\n* **技术问题**：越狱需要\
  \ iPhone 所有者执行操作，而许多 iPhone 用户在技术上并不精长完成此操作。\n* **合法性**：在本文期间，越狱的合法性尚不明确。尚不清楚越狱在《数字千年版权法》中处于什么位置。电子前沿基金（Electronic\
  \ Frontier Foundation）已请求美国版权局承认 `DMCA` 的某项例外，允许 iPhone 所有者越狱其设备。Apple 回应辩称，越狱 iPhone\
  \ 是侵犯版权的行为。\n* **未知性**：它带来了一系列未知因素。越狱后的 iPhone 能顺利升级到新的 iPhone 操作系统（OS）版本吗？越狱 iPhone\
  \ 会使其面临安全问题吗？\n\n2008 年，Apple 推出了第二代 iPhone，称为 iPhone 3G。随着这一代产品和新的 iPhone OS 版本，Apple\
  \ 发布了多项增强功能，包括在设备上原生运行应用程序的能力。此外，Apple 还构建了一个生态系统，用户可以在其 iPhone 设备上查找并安装应用程序，这就是\
  \ `App Store`。\n\n这些原生应用程序是相比 Web 应用程序的巨大改进，后者在设备上的功能受到限制。从根本上说，它们必须通过 Web 加载，无法访问所有设备功能。原生应用程序通常对设备功能支持更好，例如加速度计、文件系统、摄像头、跨域\
  \ Web 服务以及其他 `HTML` 和 `JavaScript` 之外的功能。此外，原生应用程序加载不需要无线网络，而 Web 应用程序加载依赖无线网络。\n\
  \n2009 年，Apple 推出了 iPhone 3GS 和第 3 版 iPhone 操作系统。iPhone 3GS 是 iPhone 3G 的改进版，支持比\
  \ iPhone 3G 更快的数据传输、改进的摄像头、更新的 CPU 以及语音控制。\n\n2010 年，Apple 发布并发了 iPad。iPad 平板设备，屏幕比\
  \ iPhone 大。同样重要的是，它配备了 iPhone 操作系统，这与 iPhone 有本质上的不同。\n\n随着每一款新 iPhone 的发布，Apple\
  \ 都推出了新款 iPod touch。iPod touch 可以被看作是一个去掉了电话、摄像头和 3G 数据服务支持的 iPhone；然而，iPod touch\
  \ 确实支持使用 `WiFi` 的无线网络。\n\n自三年前上市以来，Apple 已售出超过 6000 万台 iPhone。估计 iPad 在上市的第一年将售出数百万，这可能会导致\
  \ iPad 成为 2010 年最受欢迎的平板电脑。\n\n遗憾的是，对于开发者来说，在设备上运行时必须考虑三个问题：\n\n* iPhone 操作系统不允许任何形式的解释型或动态编译的软件代码。\n\
  * Apple 对 `SDK` 的许可以及使用 iPhone 进行开发不允许应用程序具有解释型或动态编译的代码。\n* Apple 对 iPhone 应用程序有广泛的验证流程。应用程序的某些自动化测试将检查动态编译和解释型代码。\n\
  \n这些问题和许可规定是开发者需要了解的，并在某种程度上限制了开发者在编写运行在 iPhone 上的应用程序时的选择。\n\n## 移动开发\n\n使用 `MonoTouch`\
  \ 在 iPhone 上构建应用程序时，开发者需要了解以下几点：\n\n* iPhone 有一个启动计时器。如果应用程序启动时间超过 20 秒，iPhone OS\
  \ 会将其杀掉。\n* 当应用程序运行时，iPhone OS 会杀掉任何无响应超过 20 秒的应用程序。为了解决这个问题，你需要执行某种类型的异步操作。\n*\
  \ 处理 `FinishedLaunching()` 事件花费的时间会计入启动计时器。因此，你不希望在 `FinishedLaunching()` 事件中进行任何长期的同步处理。\n\
  * iPhone 模拟器适合初始测试；然而，它对于所有测试来说并不一定准确。仅仅因为在模拟器中运行良好，并不意味着它在 iPhone 上以相同的方式运行。最终测试应该在\
  \ iPhone 上完成。\n* 使用 `.NET`，可执行文件很小。每个应用程序共享 `.NET Framework`，因此应用程序没有自己的框架的副本。`MonoTouch`\
  \ 未内置在 iPhone 中，其应用程序必须拥有框架的副本；`MonoTouch` 被编译到你的应用程序中。结果是 `MonoTouch` 应用程序在磁盘上比类似的\
  \ `Objective-C` 应用程序大。\n\n尽管 `MonoTouch` 是一个商业许可的产品，但它仍然处于持续开发中，`MonoTouch` 可能不支持特定的命名空间或程序集。对于这种情况，你有两种选择：\n\
  \n* 等待 `MonoTouch` 产品实现该程序集。\n* 将必要的代码或程序集引入到你的项目中。如果应用程序需要使用 `System.Web.*` 命名空间中的代码，这非常常见。\n\
  \n除了为 iPhone 构建应用程序的技术问题外，开发者应该注意的某些设计问题还包括：\n\n* 不要为桌面环境设计应用程序，然后认为可以将其缩小到 iPhone\
  \ 或任何移动设备。iPhone 不具备桌面电脑的显示器、硬件或存储空间。iPhone 和移动设备应用程序非常适合简单、有限的功能，但它们不应该做桌面应用程序能做的所有事情。\n\
  \n\n\n\n\n- iPhone 模拟器是一个很好的工具，但不要将测试局限于 iPhone 模拟器。模拟器仅仅只是一个模拟器。iPhone 模拟器关联了键盘和鼠标。要真正测试复杂的设计，必须在实体\
  \ iPhone 上进行测试。\n\n# Apple iPhone SDK 工具\n\n当 iPhone 最初发货时，你无法直接在设备上运行第三方原生应用——直到\
  \ 2008 年 3 月 6 日，Apple 发布了 SDK 的第一个测试版。iPhone SDK 允许第三方编写应用程序并在设备上原生运行。从那时日期起，iPhone\
  \ SDK 持续不断推出更新的测试版和正式版。最初，iPhone SDK 同时支持 iPhone 和 iPod Touch。随着 iPhone SDK 3.2\
  \ 版本测试版的发布，Apple 增加了对 iPad 平板设备的支持。\n\n## 工具\n\nApple SDK 包含许多对 MonoTouch 开发者至重要的工具。这些工具包括：\n\
  \n*   `Xcode`：一套用于 Apple 环境下开发的工具套件，主工具是 IDE。虽然 MonoTouch 不直接使用 `Xcode` IDE，但它可以帮助你创建一个简单的应用并部署到设备。你还可以用它来验证关联设备上的证书和配置信息是否工作正常。\n\
  *   `Interface Builder`：`Interface Builder` (`IB`) 允许图形化创建用户界面。`MonoDevelop` IDE\
  \ 与 `IB` 集成，并将 `IB` 中创建的界面转换为 `MonoTouch` 可调用的用户界面。\n*   `Simulator`：允许模拟 iPhone、ipod\
  \ Touch 和 iPad。注意，模拟器不运行 ARM 代码。它运行的是 x86 代码。\n*   目标设备所需的库：包括用于 `Cocoa Touch`、音频、视频、网络、`SQLite`、线程、电源管理以及通用\
  \ `OS X Kernel` 的库。\n\n## 许可\n\nSDK 免费下载。遗憾的是，要为 iPhone 发布软件，开发者必须加入 iPhone 开发计划。在本文编写时，加入费用为每年\
  \ 99 美元。加入费用因国家而异。向设备分发应用的能力取决于拥有必要的开发证书。一旦开发者加入 iPhone 开发计划，就可以通过 Apple 网站获取这些证书。\n\
  \n## 总结\n\n本章查看了市场中的以下项目：\n\n*   iPhone、其许可协议及其操作系统\n*   `.NET Framework` 和 `Mono`\n\
  *   `MonoTouch`，它允许 `.NET` 开发者针对 iPhone 进行开发\n*   `MonoDevelop`，允许开发者拥有一个良好的 IDE\
  \ 来使用 `MonoTouch` 编写代码\n\n现在你应该已经熟悉使用 `.NET/C#` 为 iPhone 构建原生应用所需的工具。下一章将探索使用 `MonoDevelop`\
  \ 构建 `MonoTouch` 应用的细节。第 3 章和第 4 章描述了如何处理用于用户输入以及以标准形式因子向用户展示数据的用户控件。书中的其他章节将探索\
  \ iPhone 的特定部分，例如地图、加速度和 iPad。\n\n# 第 2 章：MonoTouch 简介\n\n## 本章内容概要\n\n*   开始使用\
  \ `MonoTouch`\n*   在 `MonoTouch` 中配合 `MonoDevelop`\n*   `MonoTouch` 与 `Interface\
  \ Builder`\n*   调试与部署\n\n什么是 `MonoTouch`？如果你买了这本书，你可能至少有一些基本概念，但本章完全是为了提供关于这个问题的核心答案，以便你拥有一个坚实的基础，去尝试并将你的开发技能应用到\
  \ iPhone 应用开发中。\n\n简单来说，`MonoTouch`是一组工具，允许开发者利用现有的 `.NET Framework` 知识在 Mac 上构建\
  \ iPhone 和 iPod Touch 应用。`MonoTouch` 应用程序接口 (`API`) 提供了核心 `.NET 3.5 Framework` 特性与\
  \ iPhone SDK 提供的核心 API 的组合。为了实现这一点，`.NET Framework` 被编译为 ARM 代码以便在 iPhone 设备上运行，而\
  \ iPhone 原生 API（即用 `Objective-C` 和 `C` 编写的 API）则通过 `C#` 与原生 API 之间的互操作进行暴露。这允许开发者以他们熟悉的方式以及根据他们对\
  \ `C#` 的知识感到舒适的方式对这些外部 API 进行编码。\n\n## 在开始开发之前\n\n我从一开始就打算做一个假设，这个假设是你拥有一台 Intel\
  \  Mac。这背后的原因是 Apple iPhone SDK 仅支持此类类型的机器进行开发。由于 `MonoTouch` 使用了 iPhone SDK，你还需要遵守\
  \ Apple 施加的开发限制。要让你的第一个 `MonoTouch` 应用运行起来，你需要完成几件事：\n\n1.  确保你的 Intel Mac 运行至少\
  \ 10.5.7 版本系统。\n2.  下载并安装 `Mono` 框架：[www.go-mono.com/mono-downloads/download.html](http://www.go-mono.com/mono-downloads/download.html)。\n\
  3.  下载并安装 `MonoTouch`：[`monotouch.net/`](http://monotouch.net/)。\n4.  下载并安装 `MonoDevelop`：[`monodevelop.com/Download`](http://monodevelop.com/Download)。\n\
  5.  下载并安装 iPhone SDK：[www.apple.com/downloads/macosx/development_tools/iphonesdk.html](http://www.apple.com/downloads/macosx/development_tools/iphonesdk.html)。\n\
  \n![note.ai](img/note_fmt.gif)\n\n安装顺序很重要，因为 `MonoTouch` 和 `MonoDevelop` 依赖于 `Mono`\
  \ 框架。确保按照上述编号列表列出的顺序安装这些项目。\n\n现在你已经安装了所有组件，可以深入研究 `MonoTouch` 了。首先，我们希望你看一眼 MonoTouch\
  \ 包含的内容。\n\n## MonoTouch 的组件\n\nMonoTouch 的四个组件如下：\n\n*   `monotouch.dll`：一个 C#\
  \ 程序集，提供了一个连接到 iPhone 原生 API 的绑定 API。（绑定的 API 完整列表可以在本章稍后的 表 2-2 中找到。）\n*   `mtouch`：一个命令行\
  \ SDK，将被编译为 `C#` 和公共中间语言 (`CIL`) 代码。这些编译后的代码可以在模拟器或实际 iPhone 上运行。\n*   `MonoDevelop`\
  \ 的插件，允许进行 iPhone 开发，允许 `MonoDevelop` 使用命令行工具 `mtouch` 并允许与 `Interface Builder`\
  \ 和 iPhone 模拟器集成。它还允许部署到设备，并为向 App Store 分发和临时发布进行构建。\n*   `Mono` 运行时的商业许可，允许将 `Mono`\
  \ 运行时与开发并在 App Store 销售的代码进行静态链接。\n\n## 什么是 Mono？\n\n`MonoTouch` 的核心是 `Mono`。`Mono`（在西班牙语中是猴子）是\
  \ `.NET Framework` 的开源实现。它由 Novell 创建，旨在实现跨平台的 `.NET Framework`。这意味着该框架可以在许多不同的平台上运行，如\
  \ Apple OS X、Linux、任天堂 Wii、索尼 PlayStation 3 以及包括 Windows 在内的许多平台。由于 `Mono` 是开源的，这使得任何人都可以根据自己的需求使用和修改框架，如果你想针对限制性较大的平台，这将非常有用。考虑到这一点，`MonoTouch`\
  \ 使用修改过的 `Mono` 框架进行开发，然后在应用程序代码（以及框架）上运行链接器，以减小应用程序中整体代码的。链接器的概念将在本章稍后的“理解链接器”部分中进一步解释。\n\
  \n## MonoTouch 的命名空间和类\n\n\n\n\n\n本节进一步讨论了 MonoTouch 中包含的核心命名空间和类。MonoTouch 使用的是\
  \ Silverlight .NET 程序集的超集，这意味着在 MonoTouch 中，Silverlight .NET 程序集的基础上添加了额外的功能。表 2-1\
  \ 显示了可用的 .NET 程序集列表。\n\n### 表 2-1： MonoTouch 中可用的 .NET 程序集\n\n| 程序集 | API 兼容性 |\n\
  | --- | --- |\n| `Mono.CompilerServices.SymbolWriter.dll` | 供编译器编写者使用 |\n| `Mono.Data.Sqlite.dll`\
  \ | 用于 SQLite 的 ADO.NET 提供程序；由于 iPhone OS SQLite 版本存在某些限制 |\n| `Mono.Data.Tds.dll`\
  \ | TDS 协议支持；用于 `System.Data` 内的 `System.Data.SqlClient` 支持 |\n| `Mono.Security.dll`\
  \ | 加密 API |\n| `mscorlib.dll` | Silverlight |\n| `System.dll` | Silverlight，以及以下命名空间的类型：`System.Collections.Specialized`,\
  \ `System.ComponentModel`, `System.ComponentModel.Design`, `System.Diagnostics`,\
  \ `System.IO.Compression`, `System.Net`, `System.Net.Cache`, `System.Net.Net.Mail`,\
  \ `System.Net.Mime`, `System.Net.NetworkInformation`, `System.Net.Security`, `System.Net.Sockets`,\
  \ `System.Security.Authentication`, `System.Security.Cryptography`, `System.Timers`\
  \ |\n| `System.Core.dll` | Silverlight |\n| `System.Data.dll` | .NET 3.5，包含 `System.CodeDom`\
  \ 等功能，支持 XML 配置，已移除了 `OleDb` 和 `Odbc` |\n| `System.Json.dll` | Silverlight |\n|\
  \ `System.ServiceModel.dll` | Silverlight 中存在的 WCF 栈 |\n| `System.Transactions.dll`\
  \ | .NET 3.5；`System.Data` 支持的一部分 |\n| `System.Web.Services.dll` | 来自 .NET 3.5 配置的基础\
  \ Web 服务，移除了服务器端功能 |\n| `System.Xml.dll` | .NET 3.5 |\n| `System.Xml.Linq.dll` |\
  \ .NET 3.5 |\n| `System.Linq` | .NET 3.5 |\n| 取自 [www.MonoTouch.Net/Documentation/Assemblies](http://www.MonoTouch.Net/Documentation/Assemblies)\
  \ |\n\nMonoTouch 产品随着每次发布都在成长，因此在本文编写之后，可能包含了额外的功能。检查表格的源文件以获取任何额外的更改和更新是值得的。\n\n\
  除了 .NET 程序集外，MonoTouch 还提供了 `monotouch.dll` 程序集，它包含了针对 Objective-C 和基于 C 的 API 绑定\
  \ API。该程序集中的核心命名空间如下：\n\n* `MonoTouch.ObjCRuntime`: 该命名空间提供了 .NET/C# 世界与 iPhone\
  \ 的 Objective-C 世界之间的互操作/桥接。这将在第 11 章中进一步讨论。\n* `MonoTouch.Foundation`: 该命名空间提供了与\
  \ iPhone 的 Objective-C 世界通信所需的数据类型支持。大多数类型都是直接映射的。例如，`NSObject` Objective-C 基类映射到\
  \ C# 中的 `MonoTouch.Foundation.NSObject` 类。某些类没有直接映射到其 Objective-C 类名（例如 `NSArray`）。相反，如果数组包含一个\
  \ `UIViewControllers` 集合，则 `NSArray` 会映射到强类型数组，如 `UIViewController[]`。\n* `MonoTouch.UIKit`:\
  \ 该命名空间提供了 Cocoa Touch 内部 UIKit 组件的直接绑定。这种绑定通过为每个可用的 UIKit 组件提供 .NET 类来实现。这是开发者花费大部分时间进行操作的命名空间。\n\
  \n![note.ai](img/note_fmt.gif)\n\n对于 .NET 开发者来说，Cocoa Touch 是一个用于构建在 iPhone 上运行程序的抽象层或\
  \ API。Cocoa 是用于构建在 Mac OS X 操作系统上运行程序的 API。Cocoa Touch 可以被认为是是针对触摸的 iPhone 操作系统优化的\
  \ Cocoa。在第 14 章中阅读更多关于 Cocoa 的信息。\n\n* `OpenTK`: 该命名空间是 `OpenTK` API 的修改版本。`OpenTK`\
  \ 是针对 `OpenGL`（开放图形库）的面向对象的绑定。`OpenGL` 是用于三维图形的 API。`OpenTK` 是执行 `OpenGL`、`OpenAL`\
  \ 和 `OpenCL` 的库。它用 C# 编写并运行在 Windows、Mac OS X 和 Linux 上。iPhone 上的 `OpenTK` 实现已更新为使用\
  \ `Core Graphics` 并仅暴露 iPhone 上可用的功能。\n\n`monotouch.dll` 中从 Objective-C 绑定的其他命名空间列在表\
  \ 2-2 中。你会发现除了 `MonoTouch.CoreData`，它本应该从 Objective-C 的 `CoreData` 类绑定。之所以排除它是因为它与\
  \ Objective-C 的处理方式以及用于处理持久化存储的工具具有紧密耦合。相反，可以使用 `Mono.Data.Sqlite` 作为替代方案。\n\n###\
  \ 表 2-2： 从 Objective-C 绑定的 .NET 程序集\n\n| 命名空间 | 描述 |\n| --- | --- |\n| `MonoTouch.AddressBook`\
  \ | 提供访问 iPhone 通讯录 |\n| `MonoTouch.AddressBookUI` | 用于访问 iPhone 通讯录的用户界面组件 |\n\
  | `MonoTouch.AudioToolbox` | 底层音频 |\n| `MonoTouch.AVFoundation` | 通用音频和视频 |\n| `MonoTouch.CoreAnimation`\
  \ | 提供制作动画的能力 |\n| `MonoTouch.CoreFoundation` | 底层 C 的绑定 |\n| `MonoTouch.CoreGraphics`\
  \ | 对 Quartz 2D 图形的绑定 |\n| `MonoTouch.CoreLocation` | 提供位置功能 |\n| `MonoTouch.GameKit`\
  \ | 允许 P2P 等游戏功能 |\n| `MonoTouch.MapKit` | 提供丰富的地图功能 |\n| `MonoTouch.MediaPlayer`\
  \ | 提供音频和视频能力 |\n| `MonoTouch.MessageUI` | 用于应用内发送邮件的用户界面组件 |\n| `MonoTouch.OpenGLES`\
  \ | 提供将 GL 嵌入应用程序的能力 |\n| `MonoTouch.StoreKit` | 处理支付的 API |\n| `MonoTouch.SystemConfiguration`\
  \ | 提供网络可达性 |\n\n使用 MonoDevelop\n\nMonoDevelop 是一个开源集成开发环境 (IDE)，在本书中我们将使用该工具。MonoDevelop\
  \ 是一个跨平台 IDE，这意味着它可以运行在 Linux、Mac 和 Windows 上。该 IDE 与仅供 Windows 用户使用的 Visual Studio\
  \ 有许多相似之处。这种情况，在进入代码之前了解 MonoDevelop 是值得的。\n\n当你首次启动 MonoDevelop 时，你会看到一个与打开 Visual\
  \ Studio 时非常类似的界面。请参考图 2-1](#9780470908594c02.xhtml_figure2-1)的主屏幕截图。该屏幕非常好用，因为它列出了你所有的最近项目，对于切换项目非常方便。\n\
  \n要创建一个新的 MonoTouch 项目，可以通过屏幕顶部菜单栏点击 `File ⇒ New ⇒ Solution`，或者直接在主屏幕上点击 `Start\
  \ a New Solution` 按钮。这将带你进入图 2-2](#9780470908594c02.xhtml_figure2-2)所示的 `New Solution`\
  \ 文件对话框。\n\n图 2-1\n\n![f0201.tif](img/f0201_fmt.jpg)\n\n图 2-2\n\n![f0202.tif](img/f0202_fmt.jpg)\n\
  \n表 2-3 列出了你可以创建的不同项目类型。\n\n| 项目类型 | 描述 |\n| --- | --- |\n| iPhone Window-based\
  \ Project | 创建一个窗口供你开始在其上加载视图和其他模板代码。 |\n\n\n\n\n\n| 项目类型 | 描述 |\n| --- | --- |\n\
  | iPhone OpenGL Project | 创建用于旋转正方形的 OpenGL 模板代码。 |\n| iPhone Navigation-based Project\
  \ | 创建一个默认带有导航视图（navigation view）的项目。 |\n| iPhone Utility Project | 该工具项目是一个基于两个视图的简单项目，你可以翻转视图显示“关于”信息。\
  \ |\n| MonoTouch Library Project | 用于封装库代码以供 MonoTouch 使用的项目。 |\n| Empty MonoTouch\
  \ Project | 一个完全空的 MonoTouch 项目。 |\n\n在本示例中，你只需选择 iPhone 窗口项目（Window-based project），因为这是\
  \ MonoTouch 项目最常见的布局。为项目命名并点击 `Forward`。\n\n你看到的下一个屏幕是项目特性（Project Features）屏幕，如图\
  \ 2-3 所示所示你不需要使用这些特性中的任何一个，因为它们更多适用于其他类型的 Mono 项目（例如桌面应用程序），因此你可以跳过此屏幕直接点击 `OK`。\n\
  \n图 2-3\n\n![f0203.tif](img/f0203_fmt.jpg)\n\n深入观察 MonoTouch 项目布局，你会发现一些不同之处。图 2-4\
  \ 显示了默认 Windows 窗口项目的项目结构。你的解决方案文件包含一个项目——一个 MonoTouch 项目。任何额外使用的库项目也需要是 MonoTouch\
  \ 项目。\n\n图 2-4\n\n![f0204.tif](img/f0204_fmt.jpg)\n\n*   `References` 文件夹是一个熟悉的景象；但请注意\
  \ `monotouch.dll` 会自动作为引用包含进来。\n*   名为 `Main.cs` 的 `.cs` 文件是 MonoTouch 使用的默认启动模板，其中包含\
  \ `Main` 方法。`Main` 方法是 iPhone 程序的起点，它同时也启动应用程序的事件循环，用于处理 iPhone 与应用程序之间的交互。\n* \
  \  名为 `MainWindow.xib` 的 XIB 文件（基于 XML 的 Interface Builder 文件）是包含应用程序用户界面的文件。该文件通常通过\
  \ Interface Builder 修改。Interface Builder 具有一些有趣的概念，将在接下来的章节中探讨。\n*   `MainWindow.xib.designer.cs`\
  \ 文件包含了用户界面中视图（views）、控件（controls）、输出（outlets）和动作（actions）的定义。（视图、输出和将在在本章稍后介绍。）每当通过\
  \ Interface Builder 更新用户界面时，该文件都会更新。不应手动更新。\n\n现在你已经掌握了 MonoDevelop 和 MonoTouch\
  \ 项目的基础知识，可以深入学习 Interface Builder 并开始创建一个“Hello World”应用程序了。\n\n## 使用 Interface\
  \ Builder\n\niPhone SDK  Interface Builder 工具。该工具常用于 Mac OS X 开发和 iPhone 应用程序开发。Interface\
  \ Builder 为开发者提供了一个拖放界面，用于在屏幕上布局控件。使用 Interface Builder 是一种让人爱又恨的事，特别是对于那些来自 Visual\
  \ Studio 背景的人来说；它与 Visual Studio 内部的设计器有许多相似之处，但它的工作方式以及设置控件的方法非常不同。\n\n![note.ai](img/note_fmt.gif)\n\
  \n使用 Interface Builder 是完全可选的，所有控件都可以直接通过代码使用，但它是创建布局的一个非常有用的工具。\n\nInterface Builder\
  \ 直接集成在 MonoDevelop 中，双击任何 `.xib` 文件会自动为你打开 Interface Builder 并加载选定的 `.xib` 文件。\n\
  \n当你打开 Interface Builder 时，你会看到几个不同的窗口，如图 2-5 所示。\n\n*   **Library（库）**：此窗口包含 `Objects`（对象）、`Classes`（类）和\
  \ `Media`（媒体）标签页。这些包含了你可以点击并拖到视图上的控件。\n*   **View（视图）**：此窗口是你点击并拖入不同控件的视图。这允许你以所见即所得（WYSIWYG）的方式布局用户界面。\n\
  *   **Connections（连接）**：此标签页用于设置控件之间的连接并允许通过程序进行修改。如你所示，这是三个其他标签之一。另外三个标签是 `Attributes`（属性）、`Size`（尺寸）和\
  \ `Identity`（标识），它们都用于修改控件的细节。总之，此窗口被称为 `Inspector`（检查器）。\n*   第四个窗口在图 2-5 中名为 `Untitled`（无标题），它是\
  \ Interface Builder 的菜单。它提供了视图上所有控件的层级视图。\n\n    图 2-5\n\n    ![f0205.tif](img/f0205_fmt.jpg)\n\
  \n接下来的几节将讨论在使用 Interface Builder 和仅通过代码使用控件时，你可以使用哪些类型的控件。\n\n## 使用库控件\n\nLibrary\
  \ 窗口包含许多在 Interface Builder 中可用的控件。这些控件在代码中也可用；括号代表控件的类。\n\n*   **Controllers（控制器）**：控制器是控制某些活动的控制器族。\n\
  *   **Data Views（数据视图）**：数据视图通常向用户展示某种类型的信息。\n    *   `UITableView`：以表格形式呈现数据。用户可以滚动查看。\n\
  \    *   `UITableViewCell`：表格单元格允许自定义外观、属性和行为。\n    *   `UIImageView`：图像视图显示图像或动画。\n\
  \    *   `UIWebView`：网页视图显示显示网页内容。\n    *   `MKMapView`：地图视图显示显示地图内容。\n    *   `UITextView`：文本视图显示多行可编辑文本。\n\
  \    *   `UIScrollView`：滚动视图为无法完全适应单个窗口的内容提供了显示方式。\n    *   `UIPickerView`：选择器视图显示旋转轮。对于新接触\
  \ MonoTouch 的 .NET 开发者来说，该控件的概念类似于下拉列表。\n    *   `UIDatePicker`：日期选择器是一组用于选择日期和时间的旋转轮。\n\
  *   **Inputs & Values（输入与值）**：一组为用户输入设计的 UI 控件。这些包括：\n    *   `UISegmentedControl`：分段控件可以被视为按钮，按钮的不同部分作为独立的控件运行。\n\
  \    *   `UILabel`：显示文本的标签。\n    *   `UIButton`：圆角按钮控件实现触摸事件。触摸事件类似于 .NET 中的“点击”事件。这等同于\
  \ .NET 中的按钮。\n    *   `UITextField`：文本字段允许用户通过虚拟键盘添加文本或数据。\n    *   `UISwitch`：开关控件允许用户切换用户界面中的值。概念上，该控件类似于复选框。\n\
  \    *   `UISlider`：滑块允许用户从值范围中输入单个值。\n    *   `UIProgressView`：进度视图允许显示运行任务的进度。\n\
  \    *   `UIActivityIndicatorView`：活动指示器视图提供任务正在运行的反馈。\n\n\n\n\n\n# UI 控制\n\n- **页码控制\
  \ (`UIPageControl`)**: 页码控件向用户提供应用程序中还有页面的信息。\n- **窗口、视图与栏 (Windows, Views, & Bars)**:\
  \ 这些是 Interface Builder 和代码中提供的窗口、视图和栏。\n\n- **窗口 (`UIWindow`)**: 窗口包含多个视图，并且是第一个在屏幕上显示的界面。由于所有视图都在窗口中，因此你只能有一个窗口实例。\n\
  - **视图 (`UIView`)**: 视图控件是用于放置控件和处理事件的矩形区域。\n- **搜索栏 (`UISearchBar`)**: 搜索栏是一个带有圆角和搜索图标的文本字段。其\
  \ UI 外观旨在告诉用户该字段将用于搜索。\n- **搜索栏和搜索显示控制器 (`UISearchDisplayController`)**: 搜索栏和搜索显示控制器包含搜索栏、书签按钮、取消按钮以及显示搜索结果的表格视图（Table\
  \ View）。\n- **导航栏 (`UINavigationBar`)**: 导航栏是一种支持以层级方式导航内容的 UI 控制。\n- **导航项目 (`UINavigationItem`)**:\
  \ 导航项目控件包含在导航栏内的导航项目的信息。\n- **工具栏 (`UIToolbar`)**: 工具栏控件在屏幕底部显示一个工具栏。它支持工具栏内的工具栏项。\n\
  - **栏按钮项 (`UIBarButtonItem`)**: 栏按钮项代表工具栏控件或导航栏中的项。\n- **弹性空间栏按钮 (`UIBarButtonItem`)**:\
  \ 弹性空间栏按钮代表工具栏内的空间大小。\n- **标签栏 (`UITabBar`)**: 标签栏控件允许在屏幕底部显示标签栏。标签栏控件允许选择标签栏项。\n\
  - **标签栏项 (`UITabBarItem`)**: 标签栏项是标签栏控件中的一个项。\n\n# 设置输出 (Setting Outlets)\n\n为了能够使用你拖放到\
  \ Interface Builder 视图上的控件，你需要为每个控件创建一个输出（outlet）。在 MonoTouch 中，输出是在你分配给控件的类上的实例变量，而这些变量是在你在\
  \ Interface Builder 中定义的。该实例变量让你能够通过程序访问访问该控件。为了演示这一点，你将使用一个基于窗口的 iPhone 项目，并在 Interface\
  \ Builder 中打开 `MainWindow.xib` 文件。\n\n![note.ai](img/note_fmt.gif)\n\n大多数情况下，你可能希望直接在窗口上使用控件，而是使用一个作为窗口子视图添加的视图来连接你的控件。这是因为在实际应用程序中，你只会使用窗口来添加视图，而不是显示控件。\n\
  \n1. 首先，从对象库（Library Objects）选项卡拖一个圆角矩形按钮（Rounded Rect Button）到你的窗口上。你可以通过双击按钮中间并输入文本来设置按钮的文本。你应该得到看起来像图\
  \ 2-6 这样的效果。\n\n图 2-6\n\n![f0206.tif](img/f0206_fmt.jpg)\n\n2. 即使按钮控件位于你的窗口上，如果不为它创建一个输出，你也无法在代码中使用该控件。在库中，选择\
  \ `Classes` 选项卡，然后选择 `AppDelegate`（这是你希望访问新创建的按钮的类）。\n\n3. 现在库窗口的底部有一个四个选项卡的列表：继承（Inheritance）、定义（Definitions）、输出（Outlets）和动作（Actions）。现在，你想选择\
  \ `Outlets` 选项卡并点击 `+` 按钮添加新输出。将输出命名为 `myButton` 并按回车键保存。你可以选择性地输入类型，也可以将此类型留为“id”。你应该得到得到看起来像图\
  \ 2-7 这样的效果。\n\n图 2-7\n\n![f0207.tif](img/f0207_fmt.jpg)\n\n4. 你可能已经注意到你还没有告诉输出需要与哪个按钮关联。要做到这一点，你使用检查器（Inspector，图\
  \ 2-8 中最右侧的窗口）从 `AppDelegate` 类输出到窗口上的实际按钮创建连接。首先，从主 Interface Builder 窗口中选择 `AppDelegate`（左侧第三个窗口）。然后，选择检查器中的\
  \ `Connections` 选项卡（带有白色箭头的蓝色图标的选项卡）。你的输出在这里显示；然后你需要从检查器的输出点击并拖动（以创建连接）到窗口上的实际按钮。图\
  \ 2-8 显示了这一操作。\n\n图 2-8\n\n![f0208.tif](img/f0208_fmt.jpg)\n\n现在你已经创建了这个连接，输出已设置好，并可以在代码中使用。请参见后文的“使用\
  \ Interface Builder 实现 Hello World”部分。\n\n# 设置动作 (Setting Up Actions)\n\n动作（action）是在特定事件发生时触发的消息。在\
  \ .NET 中，这与事件非常相似。MonoTouch 通过这种方式暴露这些动作。你可以在下一节了解更多。\n\n1. 就像你创建输出一样，创建一个新动作并给它一个名称。\n\
  \n2. 再次，像创建输出一样，通过库创建新动作，选择 `Actions` 选项卡并点击 `+` 按钮添加新动作。你应该将此动作命名为 `buttonPressed`。\n\
  \n3. 你应该会在 `AppDelegate` 的 `Connections` 选项卡看到一个名为 `Received Actions` 的部分，它包含了新动作。将此新动作拖动到按钮。这时你应该看到按钮的可用动作列表。请参见图\
  \ 2-9 的示例。\n\n图 2-9\n\n![f0209.tif](img/f0209_fmt.jpg)\n\n你可能想要与按钮关联的动作是 `TouchUpInside`\
  \ 方法。这意味着用户触摸并松开了按钮。\n\n这就是在 Interface Builder 中关联动作的所有需要的工作。\n\n# 使用 Interface\
  \ Builder 实现 Hello World\n\n现在你已经对输出和动作有了良好的理解，本节将展示你现在如何在 MonoTouch 中使用这些输出和动作来执行某些操作，例如在点击按钮时更改按钮文本。如果你还没有跟进输出和动作章节，我建议你现在这样做，因为本节解释了如何使用它们。\n\
  \n一旦你保存了创建的 `MainWindow.xib` 文件，打开 `MainWindow.xib.designer.cs` 文件查看自动生成的内容。你的设计文件应该看起来像列表\
  \ 2-1。\n\n```csharp\n// 列表 2-1: MonoTouch 生成的 AppDelegate 设计文件\n[MonoTouch.Foundation.Register(\"\
  AppDelegate\")]\npublic partial class AppDelegate {\n    private MonoTouch.UIKit.Window\
  \ __mt_window;\n    private MonoTouch.UIKit.UIButton __mt_myButton;\n\n    #pragma\
  \ warning disable 0169\n    [MonoTouch.Foundation.Export(\"buttonPressed:\")]\n\
  \    partial void buttonPressed(MonoTouch.UIKit.UIButton sender);\n\n    [MonoTouch.Foundation.Connect(\"\
  window\")]\n    private MonoTouch.UIKit.UIWindow window {\n        get {\n     \
  \       this.__mt_window = ((MonoTouch.UIKit.UIWindow)(this.GetNativeField(\"window\"\
  )));\n            return this.__mt_window;\n        }\n        set {\n```\n\n\n\n\
  \n\n```csharp\n            this.__mt_window = value;\n\n            this.SetNativeField(\"\
  window\", value);\n        }\n\n    }\n\n    [MonoTouch.Foundation.Connect(\"myButton\"\
  )]\n\n    private MonoTouch.UIKit.UIButton myButton {\n        get {\n         \
  \   this.__mt_myButton =\n                ((MonoTouch.UIKit.UIButton)(this.GetNativeField(\"\
  myButton\")));\n            return this.__mt_myButton;\n        }\n        set {\n\
  \            this.__mt_myButton = value;\n            this.SetNativeField(\"myButton\"\
  , value);\n        }\n    }\n}\n```\n\n从这个设计文件中你可以看到它创建了一个部分类（partial class），与 `Main.cs`\
  \ 文件中的 `AppDelegate` 类配合使用。你还可以看到有一个名为 `buttonPressed` 的部分方法，它代表你创建的操作。你还有一个实例变量\
  \ `myButton`，它代表你为按钮创建的输出控件（outlet）。\n\n![warning.ai](img/warning_fmt.gif)\n\n你不应该编辑这个设计文件，因为该文件每次在\
  \ Interface Builder 中编辑 `.xib` 时都会自动生成。\n\n如果你转到包含另一个部分 `AppDelegate` 类 `Main.cs`\
  \ 文件，你就可以开始针对 `myButton` 变量编写代码。由于你知道它的类型是 `UIButton`，你可以获得完整的 IntelliSense 智能提示。因为你是通过\
  \ Interface Builder 添加的按钮，所以你不需要添加任何额外的代码来初始化按钮——这是自动完成的。\n\n为了获取按钮被点击的事实，你需要创建一个部分方法\
  \ `buttonPressed`并通过运行一些你自己的代码来处理该操作。在本示例中，只需使用 `SetTitle` 方法将按钮文本更改为“Clicked”，在该方法中传递按钮的标题以及它应该显示的控件状态——在本示例中直接使用\
  \ `Normal` 即可。最终你的 `Main.cs` 看起来应该像 Listing 2-2。\n\n![download.eps](img/download_fmt.gif)\n\
  \nListing 2-2: 使用 Interface Builder 控件\n\n```csharp\n// MainWindow.xib 文件中引用了 AppDelegate\
  \ 类。\n\npublic partial class AppDelegate : UIApplicationDelegate\n{\n    public\
  \ override bool FinishedLaunching (UIApplication app,\n                        \
  \                  NSDictionary options)\n    {\n        // 如果你定义了一个视图，请将其添加到这里：\n\
  \        // window.AddSubview (navigationController.View);\n        window.MakeKeyAndVisible\
  \ ();\n        return true;\n    }\n\n    partial void buttonPressed (UIButton sender)\n\
  \    {\n        myButton.SetTitle(\"Clicked\", UIState.Normal);\n    }\n\n    //\
  \ iPhoneOS 3.0 中需要此方法\n    public override void OnActivated (UIApplication application)\n\
  \    {\n    }\n}\n```\n\n要运行代码，你只需点击 MonoDevelop 中的齿轮图标（如 Figure 2-10 所示）。键盘快捷键粉丝可以使用\
  \ `Alt+Cmd+Enter` 执行相同的操作。这将编译你的应用程序，自动打开 iPhone 模拟器，在模拟器上安装你的应用程序，并启动你的程序。\n\n\
  Figure 2-10\n\n![f0210.tif](img/f0210_fmt.jpg)\n\n如果一切顺利，你应该看到一个看起来像 Figure 2-11\
  \ 的样的屏幕。当你点击按钮时，文本应该变为 Clicked，应用程序最终看起来会像 Figure 2-12。\n\nFigure 2-11\n![f0211.tif](img/f0211_fmt.jpg)\n\
  \nFigure 2-12\n![f0212.tif](img/f0212_fmt.jpg)\n\n## 代码中的 Hello World\n\n由于使用 Interface\
  \ Builder 开发完全是可选的，本节展示了如何使用代码构建与前一节相同的应用程序。首先，再次创建一个基于 iPhone 的项目。这会自动创建 `MainWindow.xib`\
  \ 和设计文件，但你将不会使用它们。相反，你将在你的 `FinishedLaunching` 方法中编写所有代码。\n\n![note.ai](img/note_fmt.gif)\n\
  \n如果 `FinishedLaunching` 方法在 10 秒内没有返回，iPhone OS 将杀死你的应用程序。管理此情况的最佳方法是创建一个主窗口的子视图（subview），并将要执行的任务添加到此视图中，而不是直接在\
  \ `FinishedLaunching` 方法中。因为这是一个简单的示例，这并不重要。\n\n首先，创建一个显示在屏幕上的新按钮。要做到这一点，你只需通过调用\
  \ `UIButton` 类上的静态方法 `FromType` 来创建一个按钮的新实例。使用 `UIButtonType` 枚举中的 `RoundedRect`\
  \ 按钮类型，以便它与上一个示例中使用的按钮匹配。\n\n由于按钮是通过编程创建的，它在 `UIWindow` 中的位置也必须通过编程来设置。要做到这一点，你需要设置按钮的\
  \ `Frame`。你可以创建一个新的 `System.Drawing.RectangleF` 矩形并将其传递给按钮的 `frame` 属性。为了让示例更贴合，你还想使用\
  \ `SetTitle` 方法将按钮的初始文本设置为 My Button。\n\n如果你决定立即运行代码，实际上根本看不到按钮的显示。这是因为你需要将其添加到窗口。你可以简单地通过在你的窗口上调用\
  \ `AddSubview` 并传递你创建的按钮来实现。编程添加按钮的代码看起来应该像 Listing 2-3，并且应该位于 `FinishedLaunching`\
  \ 方法中。\n\n![download.eps](img/download_fmt.gif)\n\nListing 2-3: 编程添加按钮\n\n```csharp\n\
  var button = UIButton.FromType(UIButtonType.RoundedRect);\nvar frame = new System.Drawing.RectangleF(35f,\
  \ 30f, 250f, 40f);\nbutton.Frame = frame;\nbutton.SetTitle(\"My Button\", UIState.Normal);\n\
  window.AddSubview(button);\n```\n\n当你现在运行程序时，按钮会出现，但当有人点击按钮时，什么都不会发生。这就是你需要处理 `TouchUpInside`\
  \ 事件的地方。幸运的是，你不需要深入就能让它工作；你可以像在 .NET 中那样处理事件。按钮实例暴露了你之前在使用 Interface Builder 时看到的所有事件。当你添加\
  \ `TouchUpInside` 事件时，你的代码看起来应该像 Listing 2-4。显然，这取决于你如何实现事件，但无论你采用哪种方式都应该得到相同的结果。此示例使用\
  \ lambda 创建匿名委托。\n\nListing 2-4: 给按钮添加触摸事件\n\n```csharp\nvar button = UIButton.FromType(UIButtonType.RoundedRect);\n\
  var frame = new System.Drawing.RectangleF(35f, 30f, 250f, 40f);\nbutton.Frame =\
  \ frame;\nbutton.SetTitle(\"My Button\", UIState.Normal);\nbutton.TouchUpInside\
  \ += (sender, e) => {\n    button.SetTitle(\"Clicked\", UIState.Normal);\n};\nwindow.AddSubview(button);\n\
  ```\n\n对比之下，注意使用 Interface Builder 需要编写的代码是少少的。然而，你可以看到使用代码创建新对象比让 `.xib` 文件为你这样做要明确得多。\n\
  \n## 调试\n\nMonoTouch 支持在 iPhone 模拟器中调试以及在设备上调试。正如你预期的那样，调试体验与通过 Visual Studio 调试非常，并支持调试断点、捕获点、检查、监视、立即/表达式评估器、调用栈和逐步调试。\n\
  \n### 在模拟器上\n\n你可能注意到在 MonoDevelop 中“运行”齿轮旁边有一个类似的图标；但这个图标上面覆盖了一个绿色的虫子图标（参见 Figure\
  \ 2-13）。这就是你用于调试模式运行应用程序的图标。如果你想使用键盘执行此操作，可以按下 `Cmd+Enter`。\n\n\n\n\n\n![f0213.tif](img/f0213_fmt.jpg)\n\
  \n你通过 `MonoDevelop` 设置断点的方法与在 `Visual Studio` 中相同——只需点击想要调试的行左侧即可。当你的应用程序运行时，它会命中断点并用黄色高亮该行。然后，你可以像在调试中预期的那样，将鼠标悬停在变量上以检查单个属性。你可以在图\
  \ 2-14 中看到这一点。\n\n图 2-14\n\n![f0214.tif](img/f0214_fmt.jpg)\n\n在设备上\n\n在设备上调试与在模拟器上调试相似。当你在\
  \ `MonoDevelop` 中选择 `Debug|iPhone` 配置配置文件（如图 2-15 所示）时，将只剩下一个可点击的调试图标。当你点击它时，应用程序将以调试模式编译并上传到连接的设备上。它会弹出一个调试窗口（如图\
  \ 2-16 所示），显示设备应该指向的 IP 地址和端口。这是因为你将通过 Wi-Fi 调试设备，所以你需要确保设备与你的机器处于同一个网络中。\n\n图 2-15\n\
  \n![f0215.tif](img/f0215_fmt.jpg)\n\n图 2-16\n\n![f0216.tif](img/f0216_fmt.jpg)\n\
  \n启调试功能的应用程序在配置中启用了额外的设置。你可以通过点击 `Settings` 然后你的应用程序名称来查看这些设置。你应该看到一个类似于图 2-17 的屏幕。你想要确保电脑上调试窗口弹出的\
  \ IP 地址与设备调试设置中显示的 IP 地址相匹配。\n\n图 2-17\n\n![f0217.tif](img/f0217_fmt.jpg)\n\n当应用程序处于调试模式时，设备可能会振动。这是\
  \ `MonoTouch` 通知你存在问题的一种，问题取决于你收到多少振动：\n\n*   振动一次：应用程序无法连接到等待设备连接的机器。\n*   振动两次：应用程序无法解析配置的主机地址。\n\
  *   振动三次：标准输出流（`stdout` 和 `stderr`）无法设置。\n\n![note.ai](img/note_fmt.gif)\n\n要在设备上启用调试，你需要拥有完整版本的\
  \ `MonoTouch` 并安装正确的证书。请参见本章稍后的“部署你的应用程序”以获取更多信息。\n\n## 理解链接器\n\n由于你无法在 iPhone 上重用库，每当你将一个版本的\
  \ `MonoTouch` 应用程序放入设备或 App Store 时，你也就安装了 `Mono` 框架。你可能认为为每个应用程序在设备上准备相同的 `Mono`\
  \ 框架是一种浪费，如果是那样的话那确实是浪费。`MonoTouch` 实际上使用链接器工具来遍历 `Mono` 框架程序集，并移除应用程序中未使用的代码。这意味着每个应用程序都使用其独特且精简的\
  \ `Mono` 框架版本，因此当新版本的 `MonoTouch` 出版时，你不需要升级每个使用 `MonoTouch` 的应用程序来支持最新版本，无需测试可能出现的任何回归问题。每个应用程序都将继续运行它自己的框架版本。\n\
  \n链接器还有助于减小应用程序的尺寸，这很重要，尤其是在移动设备上。如果你的应用程序小于 20 兆字节，Apple 允许你通过 Edge/3G 下载；如果应用程序超过此限制，你需要连接到\
  \ WiFi 才能下载应用程序。因为如果你没有在应用程序中使用 `Mono` 框架的整个基类库和核心组件，那么你不会用未使用的代码占用应用程序的空间。\n\n\
  链接器已集成到 `MonoTouch` 和 `MonoDevelop` 中，因此不需要额外工作即可启用。默认情况下，`MonoDevelop` 设置 iPhone\
  \ 模拟器配置文件（`Debug|iPhone Simulator` 和 `Release|iPhone Simulator`）不使用链接器，而在设备配置文件（`Debug|iPhone`\
  \ 和 `Release|iPhone`）上，它选择“仅链接 SDK 程序集”配置。这意味着链接器会遍历 SDK 并移除未使用的代码，但它不会链接你创建的程序集。另一种配置是“链接所有程序集”，它会遍历\
  \ SDK 和你创建的程序集。如果涉及 Web 服务、反射或序列化的代码在你的代码中没有被静态调用，这通常会导致问题。你可能希望对可能被移除的成员使用 `[Preserve]`\
  \ 属性。\n\n## 部署你的应用程序\n\n你已经完成了 Hello World 应用程序，现在是时候通过将应用程序部署到 iPhone 向世界展示这个应用程序有多棒（或\
  \ `MonoTouch` 有多酷）了。按照步骤允许应用程序进入设备：\n\n1. 你需要成为 Apple iPhone 开发者计划的成员。在写作期间，该计划的费用为每年\
  \ 99 美元。注册位置在本节末尾的列表中找到。\n2. 请求并安装从 Apple 获得的开发者证书。该证书应该出现在开发用 Mac 的`钥匙串访问`（Keychain\
  \ Access）中，其路径为 `/Applications/Utilities/Keychain Access`。\n3. 请求并安装从 Apple 获得的部署证书。该证书应该出现在开发用\
  \ Mac 的`安全工具`（security utility）中。\n4. iPhone 必须经过适当配置。这意味着 iPhone 已被允许运行不是从 App\
  \ Store 下载的调试或测试应用程序。幸运的是，Apple 通过其开发者网站提供了一个向导工具来帮助 iPhone 的设置和配置。\n5. 一旦开发系统设置，必须配置\
  \ `MonoDevelop` 项目将应用程序部署到 iPhone。这通过设置项目选项来实现。要进入此屏幕，右键点击 iPhone 项目并选择选项。当项目窗口打开时，选择\
  \ iPhone 签名（iPhone Bundle Signing）。默认，它使用找到的第一个开发者证书。参见图 2-18。\n\n图 2-18\n\n![f0218.tif](img/f0218_fmt.jpg)\n\
  \nApple 为 Mac 开发者提供了多个设置密钥和部署的优质资源。要访问这些资源，你需要是 iPhone 开发者计划的成员（要查看最后两个资源需要登录）：\n\
  \n*   iPhone 开发者网站：`http://developer.apple.com/iphone/program`\n*   iPhone 开发者计划的配置网站：`http://developer.apple.com/iphone/manage/overview/index.action`\n\
  *   一份详尽描述证书过程的 Apple PDF 文档：`http://developer.apple.com/iphone/download.action?path=/iphone/iphone_developer_program_user_guide/iphone_developer_program_user_guide__standard_program_v2.5__final.pdf`\n\
  \n\n\n\n本章向你展示了如何配置 MonoTouch 和 MonoDevelop，并证明了使用 MonoTouch 非常直观，可以让你快速开始编写 iPhone\
  \ 应用程序。MonoDevelop 与现有的 Apple 工具完美集成，其外观和操作体验与 Visual Studio 相似，让你能够快速上手开发工具。\n\n\
  # 第 3 章：规划你的应用 UI：探索屏幕控件\n\n## 本章包含哪些？\n\n* 创建 iPhone UI\n* 探索 Interface Builder\
  \ 中的输入（Input）与值（Value）对象\n\n在本章中，你将学习如何创建应用程序的 UI，特别是 iPhone 上的 UI 与你之前可能创建的 UI\
  \ 有何不同。你还将探索 Interface Builder 对象库中的输入与值对象。\n\n图 3-1 显示了 Interface Builder 中的输入与值对象。我们将在本章稍后的部分讨论这些对象。不过，你首先需要熟悉\
  \ iPhone UI 的一般外观样式，以及它通常遵循的交互模式。\n\n图 3-1\n\n![f0301.tif](img/f0301_fmt.jpg)\n\n\
  ## 创建 iPhone UI 和应用交互模式\n\n对于 iPhone 应用开发而言，最重要的方面之一就是用户界面。这是因为对大多数用户来说，界面就是应用程序。设计师和开发者花费大量时间来决定常见的界面元素应该长什么样，以及交互应该如何发生。棒的一点是，MonoTouch\
  \ 团队移植了所有的 `CocoaTouch` 类，让你的应用看起来和用就像原生 `CocoaTouch` 应用一样。除了探索这些类之外，作者还敦促你查看 Apple\
  \ 的《人机交互指南》（Human Interface Guidelines）；它为开发者提供了常见问题的交互模式描述。\n\nApple 在 iPhone SDK\
  \ 文档中提供了适用于 iPhone OS 的《视图控制器编程指南》（View Controller Programming Guide）。该文档探索了用于用户交互的几种高级设计模式。Apple\
  \ 创建了语义，用于描述应用程序中特定屏幕或一组屏幕的整体交互风格——几乎所有的应用程序都实现了根据这些词汇描述的设计。通过理解这些通用模式，你就可以根据用户需求来规划你的用户界面。\n\
  \n### 命令界面 (Command Interfaces)\n\n命令界面是指向用户提供一个包含一个或多个按钮的工具栏，这些按钮代表用户可以执行的操作。命令界面通常不使用视图控制器，而是直接将按钮的操作连接到其他对象。你通过向应用程序中添加\
  \ `UIToolbar` 来实现命令界面。\n\n如果满足以下情况，命令界面可能适用于你的应用：\n* 你有一组非常小且数量有限的操作供用户执行。\n* 你正在向用户展示一个可编辑视图（可能是绘图画布），并且你想提供一组工具或操作。\n\
  * 你有一个主屏幕，用户通过该屏幕执行应用程序的所有操作。\n\n图 3-2 显示了命令界面的示例。\n\n图 3-2\n\n![f0302.tif](img/f0302_fmt.jpg)\n\
  \n### 单选框界面 (Radio Interfaces)\n\n单选框界面提供一组按钮，用户点击它们时会在视图之间切换。这些按钮显示在窗口底部的标签栏（tab\
  \ bar）上，每次点击都会切换到一个不同的视图，而视图之间没有动画效果。这种界面非常适合显示非层级数据。你可以使用 `UITabBar` 来创建单选框界面。\n\
  \n如果满足以下情况，单选框界面可能适用于你的应用：\n* 你有一组相关但不同的屏幕。如果你的屏幕本质上没有关联，你应该考虑构建多个应用程序，以遵循协作单任务的概念。\n\
  * 你的视图是同级关系。也就是说，它们不代表数据层级中的不同层次，而是对数据的不同视图，这些数据可能重叠。\n* 你有一组密切相关的功能子集，可以按任何顺序访问。本质上，每个视图都需要一个独立的主视图控制器，因此功能划分时应该考虑架构设计。\n\
  \n图 3-3 显示了单选框界面的示例。\n\n图 3-3\n\n![f0303.tif](img/f0303_fmt.jpg)\n\n### 导航界面 (Navigation\
  \ Interfaces)\n\n导航界面显示对象的层级结构。用户点击控件以向更具体的细节移动。通常使用 `UINavigationController` 类来导航\
  \ `UIViewController` 实例的层级结构。视图之间的切换时，更具体的视图会从右侧滑入，而较不具体的视图则向左侧移出。沿层级向上移动则会让视图向反方向进入。\n\
  \n如果你有一组层级数据或功能，并允许用户进行遍历，那么导航界面可能适用于你的应用。如果你的数据符合任何树形数据结构，导航界面很可能是合适的，并且遵循 Apple\
  \ 作为 `Cocoa Touch` 平台一部分所建立的标准。\n\n图 3-4 显示了导航界面的示例。\n\n图 3-4\n\n![f0304.tif](img/f0304_fmt.jpg)\n\
  \n### 模态界面 (Modal Interfaces)\n\n模态界面在视图上方显示一个辅助视图。这在呈现辅助屏幕（如编辑屏幕）时最有用。模态界面与导航界面的相似之处在于它们都会处理视图切换。导航界面通过水平切换\
  \ `UIViewController` 栈，而模态界面通过垂直切换将新视图置于栈之上。`UIAlertView` 是混合在多种类型界面中的模态界面极佳示例。\n\
  \n你需要：\n* 多步骤的工作流。\n* 某个屏幕视图的可编辑界面。\n* 需要在保持当前视图上下文的情况下让用户参与次要功能。例如，如果你想触发相机拍摄照片或从通讯录中选择联系人，可以使用模态界面，并将结果数据提供给当前视图。\n\
  \n图 3-5 显示了模态界面的示例。\n\n### 组合界面 (Combination Interfaces)\n\n你应该始终记住，单选框、导航和模态界面并不是相互排斥的。事实上，各种类型的界面经常组合在一起，为用户提供一个展示多组层级数据的界面。如果你熟悉任何热门应用，就会发现组合界面的非常常见。导航和模态界面可以轻松组合，创建一个可以在多个层级数据集中进行导航的应用。你可以通过屏幕底部的标签栏识别模态-导航界面，它可以切换屏幕顶部的表格视图。\n\
  \n如果满足以下情况，组合界面可能适用于你的应用：\n* 你有复杂的数据或功能，可以从不同用户界面的受益。\n* 用户将使用不同的模式对同一数据集与你的程序交互。\n\
  \n图 3-5\n\n![f0305.tif](img/f0305_fmt.jpg)\n\n图 3-6 显示了组合界面的示例。\n\n图 3-6\n\n![f0306.tif](img/f0306_fmt.jpg)\n\
  \n\n\n\n现在你已经对 iPhone 应用程序常用的交互模式有了初步了解，可以准备好熟悉 Interface Builder 中作为“输入与数值”（Input\
  \ & Value）对象提供的可用控件了。本章将从库中最基础的控件开始：`UILabel`。`UILabel` 代表一个只读文本视图。`UILabel` 可以包含不同数量的文本，并根据边界框的大小和你设置的属性，对文本进行缩小、换行或截断。通过它的属性，你可以控制标签中文本的字体、颜色、对齐方式、高亮和阴影。请遵循以下步骤操作：\n\
  \n1. 打开 Interface Builder。\n2. 导航到 Input & Value 对象，选择 `UILabel`。将其拖入你的窗口/视图中并放置。\n\
  3. 为此 `UILabel` 创建一个出口（outlet），以便你能够从代码中访问该对象。\n\n你在 `UILabel` 中最频繁使用的成员有：\n\n*\
  \ `Text`：标签要显示的实际文本。\n* `TextAlignment`：使用 `UITextAlignment` 枚举选择左、居中或右。\n* `TextColor`：分配命名颜色（如\
  \ `UIColor.Blue`）、系统颜色（如 `UIColor.DarkTextColor`）或使用 `From` 方法使用任何其他颜色。\n* `Font`：设置文本的字体类型和大小。\n\
  * `Lines`：用于渲染文本的最大行数。\n\n图 3-7 显示了 Interface Builder 中的 `UILabel` 选项。\n\n图 3-7\n\
  \n![f0307.tif](img/f0307_fmt.jpg)\n\n你不仅可以在 Interface Builder 内部设置这些属性，还可以在代码内部设置它们。`UILabel`\
  \ 用于显示只读信息，不具备任何响应点击或触摸事件的事件。这是一个非常静态的控件，很可能被用其他控件的子视图来显示你的数据。以下是在代码中使用这些基本属性的示例：\n\
  \n```\n// UILabel outlet is named Label\nLabel.Font = UIFont.FromName(\"Times New\
  \ Roman\", 17f);\nLabel.TextAlignment = UITextAlignment.Left;\nLabel.TextColor =\
  \ UIColor.Red;\nLabel.Lines = 3;\nLabel.Text = \"It's a UILabel from inside code\
  \ with MonoTouch\";\n```\n\n### UIButton\n\n`UIButton` 是你用于收集用户触摸输入的控件。`UIButton`\
  \ 的用例与网页上的按钮或 Windows Forms 应用程序中的按钮相似，你希望用户执行某种操作。`UIButton` 类可以通过显示属性或专门的绘制代码进行自定义。在讨论这些之前，你应该了解\
  \ Interface Builder 中的一些基本属性：\n\n* `Title`：按钮上显示的实际文本。\n* `Image`：显示在按钮上的图像。\n*\
  \ `Background`：用按钮背景的图像。\n* `TextColor`：分配命名颜色（如 `UIColor.Blue`）、系统颜色（如 `UIColor.DarkTextColor`）或使用\
  \ `From` 方法使用任何其他颜色。\n* `Shadow`：分配命名颜色（如 `UIColor.Blue`）、系统颜色（如 `UIColor.DarkTextColor`）或使用\
  \ `From` 方法使用任何其他颜色。\n\n图 3-8 显示了 Interface Builder 中的 `UIButton` 选项。\n\n图 3-8\n\
  \n![f0308.tif](img/f0308_fmt.jpg)\n\n每个属性都可以为 `UIButton` 的不同状态进行设置；这些状态在 `UIControlState`\
  \ 枚举中定义，可以选择常规（Normal）、选中（Selected）、高亮（Highlighted）或禁用（Disabled）。在 Interface Builder\
  \ 中，你可以选择这些状态并相应设置属性；在代码中，将使用对应属性的 `SetXxx` 方法。\n\n你可以创建几种类型的按钮：\n\n* `UIButtonTypeCustom`：无按钮样式。相反，应该定义自定义的\
  \ `drawRect:` 方法。\n* `UIButtonTypeRoundedRect`：带有圆角和居中标题的矩形按钮。用于所有通用按钮。\n* `UIButtonTypeDetailDisclosure`：带有居中箭头（（>）的圆形按钮。用于显示关联对象或记录的详情。\n\
  * `UIButtonTypeInfoLight`：浅色圆形按钮，带有斜体小写字母“i”。用于翻转视图以显示设置或额外信息。\n* `UIButtonTypeInfoDark`：深色圆形按钮，带有斜体小写字母“i”。用于翻转视图以显示设置或额外信息。\n\
  * `UIButtonTypeContactAdd`：带有圆角和居中标题的矩形按钮。用于显示联系人列表或添加新联系人的表单。\n\n以下是设置某些 `UIButton`\
  \ 属性并响应点击事件的示例，对于 `UIButton` 来说就是 `TouchUpInside` 事件：\n\n```\n// UIButton outlet\
  \ is named button\nUIImage bgImage = UIImage.FromFile(\"buttonBackground.png\");\n\
  button.SetBackgroundImage(bgImage, UIState.Normal);\nbutton.SetTitle(\"Click Me\"\
  , UIState.Normal);\nbutton.SetTitleColor(UIColor.White, UIState.Normal);\nbutton.TouchUpInside\
  \ += delegate(object sender, EventArgs e) {\n    Label.Text = \"Button Clicked!\"\
  ;\n    Label.TextColor = UIColor.Brown;\n};\n```\n\n### UITextField\n\n`UITextField`\
  \ 类提供了单行编辑功能，并对编辑安全数据（如密码或其他敏感项目提供了内置支持。当用户点击文本字段时，会出现键盘；当用户点击键盘上的 Return（返回）键时，键盘消失，文本字段可以以应用程序特定的方式处理输入。`UITextField`\
  \ 还提供了一个清除文本控件，用户点击它可以擦除文本字段的内容。通过 `UITextField` 的属性，你可以控制文本的字体、样式、颜色和对齐方式。\n\n\
  以下是 `UITextField` 的一些属性：\n\n* `Text`：文本框显示的实际文本。\n* `Placeholder`：用户未输入实际文本时显示的文本。你可以将其用作视觉提示，告诉用户你期望什么数据。\n\
  * `TextAlignment`：使用 `UITextAlignment` 枚举选择左、居中或右。\n* `TextColor`：分配命名颜色（如 `UIColor.Blue`）、系统颜色（如\
  \ `UIColor.DarkTextColor`）或使用 `From` 方法使用任何其他颜色。\n* `SecureTextEntry`：决定是否使用掩码隐藏显示的文本。\n\
  * `AutocapitalizationType`：决定何时自动使用 Shift 键（例如，在开始输入和新句子时）。默认为 None（无）。\n* `AutocorrectionType`：显示在输入期间是否启用了自动纠正。默认开启。\n\
  * `ReturnKeyType`：注意 `UITextView` 不支持与 `UITextField` 相同的完成编辑行为。\n* `KeyboardType`：允许控件显示与你预期数据类型匹配的键盘，例如，纯文本、电子邮件地址或数字数据。\n\
  \n使用这些属性的代码所示：\n\n```\n// UITextField outlet is named TextField\nTextField.Font\
  \ = UIFont.FromName(\"Times New Roman\", 17f);\nTextField.TextAlignment = UITextAlignment.Left;\n\
  TextField.TextColor = UIColor.Black;\nTextField.SecureTextEntry = false;\n```\n\n\
  图 3-9 显示了 Interface Builder 中的 `UITextField` 选项。\n\n图 3-9\n\n![f0309.tif](img/f0309_fmt.jpg)\n\
  \n\n\n\n\n正如本章早期提到的，`UITextField` 在用户点击文本字段时会做出响应并出现键盘；当用户点击键盘上的 Return（返回）时，键盘会消失。然而，需要注意的是，如果\
  \ `UITextField` 出现在模态键盘视图的下方，除非你滚动视图将 `UITextField` 移动到可视区域，否则 `UITextField` 本身将被隐藏。尽管如此，通常的通认做法是不在\
  \ `UITableViews` 之外使用 `UITextField`。当你在 `UITableView` 内部使用 `UITextField` 时，`UITableView`\
  \ 会完成所有的繁重工作，以确保 `UITextField` 在用户的可视范围内。\n\n### UISwitch\n\n`UISwitch` 是一个相当简单的控件，它显示一个元素并向用户显示给定值的布尔状态。点击控件可以切换状态。在不通过子类化并基于\
  \ `UISwitch` 创建你自己的控件的情况下，你只能在控件上显示 On（开启）或 Off（关闭）。`UISwitch` 的属性也非常少；你最可能用的是 `State`\
  \ 属性，它告诉你代表的是 On 还是 Off。\n\n图 3-10 显示了 Interface Builder 中的 `UISwitch` 选项。\n\n图\
  \ 3-10\n\n![f0310.tif](img/f0310_fmt.jpg)\n\n### UISlider\n\n`UISlider` 显示一个水平条，称为轨道（track），它代表一个有限范围的值。当前值由指示器（或称滑块，thumb）的位置显示。用户通过沿轨道滑动滑块来选择值。你可以自定义轨道和滑块的外观：\n\
  \n* `MinValue`：控件将运行的最小值。\n* `MaxValue`：控件将显示的最大值。\n* `MinValueImage`：包含绘制在滑块一侧的代表最小值的图像。\n\
  * `MaxValueImage`：包含绘制在滑块另一侧的代表最大值的图像。\n\n图 3-11 显示了 Interface Builder 中的 `UISlider`\
  \ 选项。\n\n以下显示了使用这些属性并为值更新时创建代理的代码：\n\n```csharp\n// UISlider outlet 命名为 slider\n\
  slider.MinValue = 0.0f;\nslider.MaxValue = 10.0f;\nslider.SetValue(10.0f, false);\n\
  slider.ValueChanged += delegate(object sender, EventArgs e) {\n    Console.WriteLine(\"\
  New Value: \" + slider.Value);\n};\n```\n\n### UIActivityIndicatorView\n\n`UIActivityIndicatorView`\
  \ 显示一个元素，为未知持续的任务或过程的进度提供用户反馈（若要显示已知持续时间的任务进度，请使用 `UIProgressView`）。只要任务或过程持续，活动指示器就会旋转。用户不与活动指示器交互。以下是\
  \ `UIActivityIndicatorView` 最频繁使用的属性列表。\n\n* `HidesWhenStopped`：一个布尔值，决定控件在非动画状态时是否显示。\n\
  * `ActivityIndicatorViewStyle`：使用 `UIActivityIndicatorViewStyle` 枚举选择 Gray（灰色）、White（白色）或\
  \ WhiteLarge（大白色）。\n\n图 3-11\n\n![f0311.tif](img/f0311_fmt.jpg)\n\n图 3-12 显示了 Interface\
  \ Builder 中的 `UIActivityIndicatorView` 选项。\n\n图 3-12\n\n![f0312.tif](img/f0312_fmt.jpg)\n\
  \n以下代码使用这些属性来启动和停止动画：\n\n```csharp\n// UIActivityIndicatorView outlet 命名为 activity\n\
  activity.ActivityIndicatorViewStyle = UIActivityIndicatorViewStyle.WhiteLarge;\n\
  activity.HidesWhenStopped = true;\nactivity.StartAnimating();\n//执行一些操作\nactivity.StopAnimating();\n\
  ```\n\n### UISegmentedControl\n\n`UISegmentedControl` 提供了一个紧凑、持久的按钮组，用于切换视图切换。根据移动端\
  \ HIG（人界面指南），分段控件应该通过切换视图或其他适当的 UI 更新来向用户提供反馈。反馈应该是即时的，避免动画效果。尽管如此，可以想象你也可以可以使用分段控件进行更复杂的视图管理。它显示一个由多个段组成的元素，每个段都充当一个独立的按钮。每个段可以显示文本或图像，但不能二者兼有。`UISegmentedControl`\
  \ 确保每个段的宽度根据分段总数成比例，除非你设置了特定宽度。\n\n* `NumberOfSegements`：这是代码内部的只读属性；但使用 Interface\
  \ Builder 时你可以使用它来设置想要显示的分段数量。\n* `ControlStyle`：使用 `UISegmentedControlStyle` 枚举选择\
  \ Plain（普通）、Bordered（带边框）或 Bar（条形）。\n\n图 3-13 显示了 Interface Builder 中的 `UISegmentedControl`\
  \ 选项。\n\n图 3-13\n\n![f0313.tif](img/f0313_fmt.jpg)\n\n以下代码使用这些属性并使用代理来响应值的改变：\n\n\
  ```csharp\n// UISegmentedControl outlet 命名为 segmentedControl\nsegmentedControl.InsertSegment(\"\
  First\", 0, false);\nsegmentedControl.InsertSegment(\"Second\", 1, false);\nsegmentedControl.InsertSegment(\"\
  Third\", 2, false);\nsegmentedControl.SelectedSegment = 0;\nsegmentedControl.ControlStyle\
  \ = UISegmentedControlStyle.Plain;\nsegmentedControl.ValueChanged += delegate {\n\
  \    if (segmentedControl.SelectedSegment == 0)\n        Console.WriteLine(\"First\
  \ Selected\");\n        //显示视图\n    else if (segmentedControl.SelectedSegment ==\
  \ 1)\n        Console.WriteLine(\"Second Selected\");\n        //显示视图\n    else\
  \ if (segmentedControl.SelectedSegment == 2)\n        Console.WriteLine(\"Third\
  \ Selected\");\n        //显示视图\n};\n```\n\n### UIPageControl\n\n`UIPageControl`\
  \ 通过为每个打开的页面显示一个点来指示应用程序中打开的页面数量。对应于当前视图的点会被高亮。`UIPageControl` 通过在点击高亮点右侧或左侧时向代理发送事件来支持导航。该控件通常与\
  \ `UIScrollView` 配合使用（`UIScrollView` 将第 4 章介绍）。\n\n图 3-14 显示了 Interface Builder\
  \ 中的 `UIPageControl` 选项。\n\n图 3-14\n\n![f0314.tif](img/f0314_fmt.jpg)\n\n### Summary\n\
  \n本章介绍了建议的各种界面模式：\n\n* 命令界面适用于有限的功能。\n* 广播界面使用 `UITabBar` 提供对相关视图的访问。\n* 导航界面使用\
  \ `UINavigationController` 提供你希望用户遍历的层次结构数据或功能。\n* 模态界面使用 `UIViewController` 提供一组次要功能，用户可以在保持当前视图上下文的同时可选地参与这些功能。\n\
  * 组合界面适用于当你拥有复杂的数据或功能，且从使用不同的用户界面中获益时。\n\n你还接触了 Interface Builder 对象库中的输入与值对象，这让你对创建用户界面时使用的一些控件有了很好的了解。\n\
