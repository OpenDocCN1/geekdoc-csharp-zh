  Michael E. Trent\n\n### 封面图片\n©Marilyn Nieves/istockphoto\n\n## 致谢\n\n我一直对移动开发很感兴趣。直到\
  \ 2009 年夏天，`Wrox` 和我才同意创建一个移动开发/iPhone 项目。该项目是 `Wrox Blox` 系列的一部分，也是这本书的第一个版本；它于\
  \ 2009 年 11 月出版。在该项目发布两周后，副发行 Jim Minatel 对电子书的销量非常满意，并想知道是否出一本关于 `MonoTouch` 的更大的纸质书。由于我的日程安排，我需要寻找其他几个作者。我最初想到了\
  \ Craig Dunn、Chris Hardy 和 Martin Bowling。在写我的第一本书期间，我曾与他们每个人都谈过，所以与他们讨论合写纸质书是合理的。一个下午，我与\
  \ Novell 的 Joseph Hill 谈过，他也推荐了这些人。在对最初的选择进行某种水平衡量后，我与他们每个人都交流了，他们都接受了。我欣喜若狂。Rory\
  \ Blyth 在我们写书不久后加入了我们的我们。感谢 Jim Minatel 让我开始编写关于 `MonoTouch` 的内容。感谢 Bob Elliott\
  \ 让我们保持目标，并非常感谢 Kevin Kent 承担了让我们按时完成任务的脏活累活。\n\n鉴于我的合作者位于不同的大陆和半球，我想感谢他们的出色工作。Craig\
  \ 和 Chris 做得非常好，对细节非常关注，并且始终掌控着进展。\n\n我想感谢我的家人。他们非常给力，让我专注于这本书同时也让我为客户工作。我欠他们一个巨大的“谢谢”。\n\
  \n最后，感谢你们购买这本书。我们希望你们喜欢这本书，就像我们喜欢编写它一样。\n—Wallace B. McClure\n\n特别感谢我出色的妻子 Mandi\
  \ Rae。没有她，我不知道我会在哪里。感谢我的妈妈 CK、Sarah 以及所有多年来支持我的人。还要感谢 Brewski Firkin 在我写代码时陪伴我。\n\
  —Martin Bowling\n\n感谢 Karl、Mike 和 Chris 提供的灵感，感谢妈妈提供的一切。给 Jack、Lilliana、Will、Sam\
  \ 和 Marcus —— 永远尽你们全力。\n—Craig Dunn\n\n感谢我的妻子 Cara 忍受了漫长的夜晚，感谢我的父母 Hazel 和 Bob。\n\
  —Chris Hardy\n\n## 前言\n\n`MonoTouch` 是两个迷人且极其令人快乐世界的结合：`C#` 语言和 iPhone。我们设计 `MonoTouch`\
  \ 是为了将这两个宇宙融合在一起，我们通过利用在设计和实现语言、API 和绑定方面的多年经验来实现。\n\n我们对 iPhone 的热情非常容易解释：像其他人一样，我们被美的用户界面、深思的设计和强大的平台所吸引。这种组合令人难以抗。\n\
  \n我们对 `C#` 的热爱追溯到 2000 年微软发布这种新语言的时候。正如 `C#` 震撼了 Windows 世界，它也震撼了我们的世界。在 2000 年，我们已经在\
  \ GNOME 桌面和 Evolution 邮件客户端工作了几年，并积累了开发桌面应用的经验。我们在一个竞争激烈的领域开发软件，我们需要更少的开发者生产软件。一种方案是更努力、工作更长时间。相反，我们选择了提高编程水平。\n\
  \n当微软宣布 `C#` 和 `.NET Framework` 时，这种语言是一项立竿有效的改进。另一方面，`.NET` 语言确保了我们的手不会受限于单一语言，同时也确保了我们可以继续重用用\
  \ `C` 或 `C++` 编写的任何代码。`C#` 让我们世界变得更高效。\n\n`Mono` 在过去几年里向所有可能的方向发展。它离开了最初的桌面舒适区，被应用于从嵌入式控制器、mp3\
  \ 播放器到服务器、游戏以及工业控制。\n\n`Mono` 在 iPhone 上的应用源于用户的需求。我们的 mono@novell.com 邮箱地址在 2008\
  \ 年和 2009 年被大量将 `Mono` 引入 iPhone 的请求轰炸，到 2009 年夏天，我们已经有了一个在 9 月发布的完整技术栈方案。\n\n这本书的作者是\
  \ `MonoTouch` 的早期测试人员之一：在 `MonoTouch` 发布的第一几天就在那里，他们与我们一起探索原始的 API 设计，他们帮助我们塑造了最终产品，并继续帮助我们为目标\
  \ iPhone 的开发者考虑最重要的事项。\n\n你可能已经认识了其中的一些作者。Wally 以创纪录的速度推出了第一本关于 `MonoTouch` 的电子书，它帮助了数百名程序员在产品发布后的几个月内上手了\
  \ `MonoTouch`。\n\nChris 和 Rory 在 Windows/ASP.NET 世界都非常有名，是 `MonoTouch` 社区的活跃成员：在我们的\
  \ IRC 聊天室、Stackoverflow 以及我们的论坛上，他们回答了新开发者的问题，并帮助开发者做出更好的应用程序。\n\n\n\n\nChris 以一种只有曼彻斯特摇滚青年才能表现出的热情投入到\
  \ MonoTouch 中，并启动了 Scott Hanselman 的开源“Hanselminutes” MonoTouch iPhone 应用程序。\n\n\
  Rory 对世界有独特的视角；他深入接触过 `.NET` 和 `Objective-C` 的工作。他是 `.NET` 世界的名人，但他也是 Barnes and\
  \ Noble iPhone 应用程序的幕后功臣，正是他将这些实战检验的知识带入了 MonoTouch 社区。在这段旅程中，你找不到更好的精神导师了。\n\n\
  你可能通过 Craig 那系列非常出色的博客认识过他，这些博客不仅帮助新学者上手 MonoTouch，而且成为我需要解决自己 iPhone 应用中的问题时经常求助的参考资料。Craig\
  \ 提出了 iPhone 应用程序最实用的想法之一：会议应用程序。他利用自己的博客花了一段时间探索什么能让一个会议应用变得好用，并制作了两个开源会议应用：MonoSpace\
  \ App 和 PDC App。\n\n在 Mix 2010 大会召开时，Craig 和 Chris 制作了供 MIX 会议者使用的 `MIX2010` 应用。当你看到人们在每场会议开始前都在手机上使用该应用时，你就知道这是一个绝佳的主意了。\n\
  \nMartin 是 MonoTouch 自发布以来的早期采用者。他为社交网站 DailyBooth 启动了第一个 iPhone 应用，并且是各种开源 MonoTouch\
  \ 项目的贡献者。\n\n使用 `C#` 和 iPhone 开发应用程序是两者的完美结合。你既可以使用一种强类型、类型安全且带垃圾回收的语言，配合移动应用最前沿的\
  \ API；又可以使用为 `Objective-C` 的 iPhone 创建的最优库，以及为 `.NET` 的 `C#` 创建的最优库。\n\n我把你们交给了\
  \ Wally、Martin、Craig、Chris 和 Rory 这些靠谱的人。\n\n—Miguel de Icaza\n开发者平台副总裁\nNovell\n\
  \n# 引言\n\niPhone 是目前移动设备市场上最令人兴奋的智能手机。在 3 年时间里，它的安装量从 0 增长到了 8000 万台。伴随这一增长的是人们对编写在设备上原生运行的应用程序的兴趣日益增加。当\
  \ Apple 最初发布 iPhone 时，它并不具备在设备上运行自定义应用程序的能力。Apple 听取了开发者市场的意见，增加了在设备上运行原生应用的能力。最初，这些应用是用\
  \ `Objective-C` 编写的。随着时间的推移，创建了额外的框架，让不通 `Objective-C` 的开发者也能针对 iPhone。\n\n自 2002\
  \ 年 1 月发布 `.NET Framework` 以来，它的增长令人印象深刻。目前，`.NET Framework` 是今天最流行的开发框架。由于 `.NET\
  \ Framework` 的流行，Ximian（后被 Novell 收购）宣布了 `Mono Project`。`Mono Project` 构建了一个可以在多个非\
  \ Windows 平台运行的 `.NET Framework` 实现。2009 年夏天，Novell 宣布了 MonoTouch。MonoTouch 让 `.NET`\
  \ 开发者（主要是编写 `C#` 应用程序的开发者）能够创建在 iPhone 上原生运行的应用程序。\n\n对于 `.NET` 开发者来说，能够编写在 iPhone\
  \ 上原生运行的应用程序是非常奇妙且兴奋的事情，因为它为他们和他们的技能开启了 iPhone 之门。`.NET` 开发者不需要花费精力学习 `Objective-C`。我们对能够使用\
  \ `.NET/C#` 为 iPhone 编写原生应用感到非常兴奋。它为许多开发者开启了一个全新的世界。\n\n## 本书读者读者\n\n本书适用于对创建使用\
  \ `.NET/C#` 编写的原生 iPhone 应用感兴趣的 `.NET` 开发者。这些开发者希望利用现有的知识。虽然 `.NET` 开发者总是对学习感兴趣，但也意识到学习\
  \ `Objective-C` 和 iPhone 的细节可能会让人力不从心。对 MonoTouch 感兴趣的开发者会发现，MonoTouch 的成本可以通过使用他们已经熟悉的语言快速针对\
  \ iPhone 来轻松抵消。\n\n本书专为想要针对 iPhone 的 `.NET` 开发者设计。它的目的是帮助你快速熟悉 iPhone，而不是真正教你 `.NET\
  \ Framework` 或 `C#` 语言，我们假设你已经掌握了它们。\n\n本书的第 1 至第 4 章包含了介绍性内容。你应该顺序阅读第 1 至第 4 章。这些章节介绍了\
  \ MonoTouch 产品、使用 MonoTouch 和 `MonoDevelop` 进行开发的基础知识，最后是介绍了如何通过屏幕和数据控件向用户展示数据，以及如何为\
  \ iPhone 开发用户界面。一旦你熟悉了这些概念，通常可以在不同章节之间移动，而不一定需要按顺序阅读。\n\n## 本书涵盖内容\n\n本书涵盖了使用 MonoTouch\
  \ 进行 `.NET/C#` 开发。MonoTouch 针对 iPhone、iPod touch 和 iPad。除非特别说明，否则 iPhone 和 iPod\
  \ touch 的内容是相同的。iPad 在第 13 章中进行了专门介绍。\n\n## 本书结构\n\n如我们之前指出的，本书基本上分为两个部分。第一部分包含第\
  \ 1 至第 4 章。这部分是对 iPhone 开发体验和 `MonoDevelop` IDE 的介绍。这部分建议从头到尾阅读。一旦你觉得对第一部分熟悉了，就可以进入书的第二部分，该部分包含你可以根据需要选择的独立章节。\n\
  \n## 使用本书所需的工具\n\n本书的读者需要几样工具才能有效使用。这些是：\n\n*   一台 iPhone、iPod 或 iPad。\n*   Apple\
  \ Macintosh：你需要一台 Apple Macintosh 在你的 iPhone 设备上构建并部署应用。\n*   Apple iPhone SDK：你需要下载并安装\
  \ Apple iPhone SDK。该工具仅运行在 Apple Macintosh 上。\n*   Mono Framework：你需要在 Macintosh\
  \ 上下载并安装 Mono Framework。可以从 `www.mono-project.com/` 下载。\n*   MonoTouch：可以在 `http://monotouch.net/`\
  \ 下载 MonoTouch。免费版 MonoTouch 允许开发者创建应用、构建应用并在模拟器中运行。要部署到设备，开发者必须购买专业版或企业版 MonoTouch。\n\
  *   MonoDevelop：可以在 `http://monodevelop.com/` 下载 `MonoDevelop` IDE。\n\n注意，本书使用 MonoTouch\
  \ 在 SDK 3.X 许可下开发部署到 App Store 和企业内部的应用。使用 MonoTouch 开发的 SDK 4 应用可以在企业内部部署。将 SDK\
  \ 4 的 MonoTouch 应用部署到 App Store 可能受到 Apple 开发者计划协议的限制。\n\n# 规范\n\n为了帮助你从文本中获得最大的收益并跟踪进度，我们在书中使用了多种规范。\n\
  \n带有警告图标的框包含重要的、不容忽视的信息，与周围文本直接相关。\n\n铅笔图标表示注释、提示、技巧以及当前讨论的补充。\n\n对于文中的样式：\n\n*\
  \   我们在引入新术语和重要词汇时会进行标记。\n*   我们会显示按键组合，如 `Ctrl+A`。\n*   我们在文中显示文件名、URL 和代码，例如：`persistence.properties`。\n\
