  \        response.GetResponseStream());\n    response.Close();\n}\n```\n\n## 负责任地使用\
  \ Web 服务\n\n\n\n\n\n现在你已经学习了如何在 MonoTouch 中以各种形式使用 Web 服务，让我们来看一些问题。Web 服务是极佳的工具，用于：\n\
  \n* 构建在 Internet 上运行的应用程序。由于它们运行在端口 `80`，因此通信被阻塞的概率非常小。\n* 保持信息的集中化。\n* 轻松地允许不同的系统进行通信。\n\
  \n同时，Web 服务也有其缺点。在无线网络上使用 Web 某些缺点包括：\n\n* Web 服务往往很慢。通过文本格式（如 `JSON` 或 `XML`）发送信息可能比通过二进制/压缩协议发送相同信息要慢。\n\
  * 无线通信往往是不可靠的。\n* 在众多网络（Internet 正是如此）上传输数据往往是不可靠的。\n\n因此，记住以负责任的方式使用 Web 服务非常重要：\n\
  \n* 对于发送到 Web 服务和传回 iPhone 的数据量要保持高效。没有理由让 iPhone 或到 Web 服务的连接过载。\n* iPhone 有 20\
  \ 秒的限制来等待用户代码执行完毕。20 秒后，正在执行的代码将终止。因此，在调用 Web 服务时，使用异步调用或在另一个线程中调用是有意义的。\n\n## 总结\n\
  \n本章查看了 iPhone 上的数据策略。通过使用这些技术，开发者可以构建在没有网络连接时运行的原生应用程序。你学习了如何：\n\n* 在 iPhone 上的\
  \ `SQLite` 中设置本地数据库\n* 在 iPhone 上的 `SQLite` 数据库上运行命令\n* 在 iPhone 上使用基于 SOAP 的 Web\
  \ 服务\n* 在 iPhone 上使用基于 REST 的 Web 服务\n\n当他们加入调用 Web 服务的能力时，iPhone 开发者及其应用程序就可以与中央数据存储集成。这允许应用程序的用户与其他用户进行交互。例如，iPhone\
  \ 上的 Twitter 用户可以与其他 Twitter 用户进行交互，而无需永远访问 `Twitter.com` 网站。通过利用 iPhone 的功能，开发者可以创建出为用户提供更多功能的应用程序，并且在连接\
  \ Internet 及其数据源时具有更强的抗问题能力。\n\n# 第 6 章：使用表格显示数据\n\n## 本章包含什么？\n\n* 在表格中显示信息\n*\
  \ 使用表格进行导航\n* 利用 `UITableView` 的内置编辑功能\n* 在表格中添加搜索栏\n\n大多数程序员将“表格”可视化为一个网格：一组用于显示类似于电子表格的结构化信息的行和列。`C#/.NET`\
  \ 开发者可能会考虑到他们专业领域（`WinForms`、`ASP.NET` 或 `WPF`）中的 `DataGrid` 或 `GridView` 控件。\n\n\
  iPhone 上的表格更像 ASP.NET 中的 `Repeater` 控件，具有几乎无限灵活的 `ItemTemplate`。两个关键类是 `UITableView`\
  \ 和 `UITableViewCell`。它们都提供了实用的默认功能，并且可以通过 Interface Builder 或代码进行高度自定义，以产生几乎任何你可以想象的结构化内容显示。配合\
  \ `UINavigationController` 帮助管理多级导航，`UITableView` 成了你所熟悉的许多 iPhone OS UI 的基础。表格以及你在\
  \ iPhone OS 中如何使用和管理它们就是本章的核心。\n\n表格贯穿整个 iPhone OS，从显而易见的地方如 iPod 专辑/艺术家/曲目和联系人列表到消息应用程序以及\
  \ `设置` 中值的显示/编辑。[图 6-1] 显示了各种不同的示例，突出了 `UITableView` 控件可以多么灵活和可定制。\n\n[图 6-1]\n\n\
  ![f0601.tif](img/f0601_fmt.jpg)\n\n创建这些用户界面所需的主要类是 `UITableView` 及其关联的 `UITableViewSource`\
  \ 代理。在内置选项之外自定义显示时也会使用 `UITableViewCell`，而 `UISearchBar` 和搜索显示控制器提供了一种在表格中设置带有结果搜索功能的简单方法。`UITableView`\
  \ 还可以与 `NavigationController` 结合，以便在具有内置“返回”功能的层级选项之间进行导航。\n\n## 在表格中显示数据\n\n表格的最简单形式是使用内置的单元格样式在屏幕上渲染数据列表。在\
  \ `MonoDevelop` 中创建一个新解决方案 `Tables01`，使用 Interface Builder 将 `UITableView` 拖到主窗口上，并为它创建一个名为\
  \ `Table` 的输出（outlet）。在 `Main.cs` 中添加 [列表 6-1] 中的代码来创建一个基础表格。代码的关键方面是：\n\n* 创建一些要显示的数据，在这种情况下是一个名为\
  \ `colors` 的简单字符串数组。数据可以来自任何地方——硬编码列表、数据库查询或 Web 服务调用。\n* 将 `UITableView.Source`\
  \ 属性赋值为 `UITableViewSource` 实例。这是委托模式的关键——`UITableView` 实例向 `UITableViewSource`\
  \ 索取渲染所需的信息，包括行数以及每个单元格显示的视图对象。\n* 在 `UITableViewSource` 子类中实现两个需要的方法：\n    * `RowsInSection`:\
  \ 告诉表格需要多少行来整个数据集。\n    * `GetCell`: 渲染用户界面时调用。在这里你每次都创建一个新的 `UITableViewCell` 并将数据赋值给\
  \ `TextLabel`。注意构造函数中传递了标识符 `\"mycell\"`——它在代码的其他地方没有使用，但在本章后面的表格中将变得非常重要。\n\n![download.eps](img/download_gif)\n\
  \n[列表 6-1]: 基础表格 (Tables01\\Main.cs)\n\n```csharp\nusing System;\nusing System.Collections.Generic;\n\
  using System.Linq;\nusing MonoTouch.Foundation;\nusing MonoTouch.UIKit;\n\nnamespace\
  \ Tables01\n{\n\npublic class Application\n{\n   static void Main (string[] args)\n\
  \   { UIApplication.Main (args);}\n}\n\npublic partial class AppDelegate : UIApplicationDelegate\n\
  {\n   // 此方法在 iPhoneOS 3.0 中是需要的\n   public override void OnActivated (UIApplication\
  \ application) {}\n\n   private List<string> colors;\n\n   public override bool\
  \ FinishedLaunching\n                               (UIApplication app, NSDictionary\
  \ options)\n   {\n      colors = new List<string>\n         {\"Red\",\"Orange\"\
  ,\"Yellow\",\"Green\",\"Blue\",\"Indigo\",\"Violet\"};\n\n      Table.Source = new\
  \ MyTableViewSource (colors);\n\n      window.MakeKeyAndVisible ();\n\n      return\
  \ true;\n\n   }\n\n   // 替换/结合 UITableViewDataSource 和 UITableViewDelegate\n   private\
  \ class MyTableViewSource : UITableViewSource \n   {\n      private List<string>\
  \ rows;\n\n      public MyTableViewSource (List<string> list)\n      { // 将数据存储在此类中\n\
  \         rows = list;\n      }\n\n      public override int RowsInSection (UITableView\
  \ tableview, int section)\n      { // 告诉表格需要多少行来显示\n         return rows.Count;\n\
  \      }\n\n      public override UITableViewCell GetCell \n                (UITableView\
  \ tableView, NSIndexPath indexPath)\n      { // 我们将在本章后面的部分学习 \"mycell\" 是干用的……\n\
  \         UITableViewCell cell = new \n            UITableViewCell(UITableViewCellStyle.Default,\"\
  mycell\");\n\n         cell.TextLabel.Text = rows[indexPath.Row];\n\n         return\
  \ cell;\n      }\n\n   }\n\n}\n\n}\n```\n\n\n\n\n数据的“格式”（例如，你使用的底层类或集合类型）并不重要，因为你负责确定行数，并通过\
  \ `GetCell` 方法指示表格如何显示每一行。这段非常简单的代码的结果如 图 6-2 所示。\n\n图 6-2\n\n![f0602.tif](img/f0602_fmt.jpg)![note.ai](img/note_fmt.gif)\n\
  \n如果你正在转换 Objective-C 示例或正在阅读 Apple 的文档，你会发现对 `UITableView` 的 `Delegate` 和 `DataSource`\
  \ 属性的引用。在 Objective-C 中，`UITableViewDelegate` 和 `UITableViewDataSource` 是协议，同一个类可以同时实现这两个协议，但在\
  \ C# 中，它们被暴露为抽象类，这意味着你必须为创建的每个表格都实现两个子类。\n\n在 MonoTouch 中，为了方便 C# 开发者，这两个类的属性和方法已“合并”到\
  \ `UITableViewSource` 中。MonoTouch 允许你使用任一种方法：仅实现 `UITableViewSource` 或者同时实现 `UITableViewDelegate`\
  \ 和 `UITableViewDataSource`。功能上没有区别——在本章中仅使用了 `UITableViewSource` 方法，因为它需要编写的代码更少。\n\
  \n## 选择单元格\n\n`UITableView` 提供了许多默认功能，几乎不需要额外的代码——该示例通过继承默认字体和文本设置并支持平滑滚动，已经表现得像一个\
  \ iPhone OS 应用程序了。响应用户触摸单元格只需要几行代码——首先在 `UITableViewSource` 子类中创建此辅助方法来弹出消息：\n\n\
  ```csharp\npublic void ShowAlert (string title, string message)\n{\n    using(var\
  \ alert=new UIAlertView(title,message,null,\"OK\",null))\n    {\n        alert.Show();\n\
  \    }\n}\n```\n\n然后在 `UITableViewSource` 子类中实现 `RowSelected` 方法。`NSIndexPath` 对象包含了关于选择了哪一行的信息——`Row`\
  \ 属性告诉你用于从行数组中检索值的索引：\n\n```csharp\npublic override void RowSelected (UITableView\
  \ tableView, NSIndexPath indexPath)\n{\n    ShowAlert(\"RowSelected\",\"You selected\
  \ \"+rows[indexPath.Row]);\n}\n```\n\n![note.ai](img/note_fmt.gif)\n\n`NSIndexPath`\
  \ 实例包含了用于识别 `UITableView` 中特定行的足够信息。在这些简单的示例中，只使用了 `Row` 属性，但在使用分组时（在本章稍后部分），也需要\
  \ `Section` 属性。\n\n当表格单元格被触碰时，你可以执行许多操作：在单元格上添加勾选标记、打开一个新视图、导航到应用程序的其他地方，或你想到的任何其他操作。其中一些其他操作将在本章稍后部分介绍。\n\
  \n`UITableView` 提供了另一种类型的“行选择”——`DetailDisclosureButton`——这在电话（Phone）应用程序中最常见。这个用户界面元素具有特殊含义：它表示触摸单元格的主部分可以执行一个操作（例如拨打电话），而触摸蓝色圆圈箭头则执行不同的操作（例如打开详情）。要使用此功能，请在\
  \ `GetCell` 方法中设置单元格的 `Accessory` 属性。\n\n```csharp\ncell.Accessory=UITableViewCell.DetailDisclosureButton;\n\
  ```\n\n并在 `UITableViewSource` 子类中实现此方法：\n\n```csharp\npublic override void AccessoryButtonTapped\
  \ (UITableView tableView, NSIndexPath indexPath)\n{\n    app.ShowAlert(\"AccessoryButton\"\
  ,\"You tapped \"+text[indexPath.Row]);\n}\n```\n\n图 6-3 显示了 `RowSelected` 和 `AccessoryButtonTapped`\
  \ 方法的运行——触摸行会调用 `RowSelected`，触摸 `DetailDisclosureButton` 会调用 `AccessoryButtonTapped`，因此你可以对行的两种操作做出响应。\n\
  \n图 6-3\n\n![f0603.tif](img/f0603_fmt.jpg)\n\n除了特殊的 `DetailDisclosureButton` 之外，如\
  \ 表 6-1 所示，`cell.Accessory` 还有两个可能的值，每种值在 iPhone 界面指南中都有特定的用途。\n\n#### UITableViewCellAccess\n\
  \n| 类型 | 说明 |\n| :--- | :--- |\n| None | 默认值——不显示配件。该单元格要么是只读数据项，要么对触摸有响应。 |\n|\
  \ Checkmark | 用此指示表格中的单选或多选。请不要使用蓝色的选择状态，该状态仅作为单元格已被触摸的视觉指示。 |\n| Disclosure | 简单的灰色\
  \ > 箭头，用于表示触摸此单元格会导致某种导航。 |\n| DetailDisclosure | 带有小型白色 > 箭头的蓝色圆圈，表示触摸配件的行为与单元格其他部分不同。\
  \ |\n\n### 更改单元格布局\n\n如果你不能在每个单元格中包含一些额外的文本或图像，表格将非常单调。提供了四种预定义的布局（参见 表 6-2），它们被内置应用程序使用。\n\
  \n### UITableViewCellStyle\n\n| 样式 | 说明 |\n| :--- | :--- |\n| Default | 显示单个黑色 `TextLabel`\
  \ 以及左侧可选的图像。不支持 `DetailTextLabel`。该样式用于 iPod 应用程序。 |\n| Subtitle | 显示两个左对齐的字段：`TextLabel`\
  \ 使用较大的字体；`DetailTextLabel` 使用较小的字体。可以可选添加图像。该样式用于 iPod 应用程序。 |\n| Value1 | `TextLabel`\
  \ 比 `Default` 小，右对齐且蓝色。`DetailTextLabel` 左对齐且黑色。不支持图像。该样式用于联系人列表。 |\n| Value2 |\
  \ `TextLabel` 左对齐黑色文本。`DetailTextLabel` 右对齐蓝色文本。不支持图像。该样式用于设置应用程序。 |\n\n![warning.ai](img/warning_fmt.gif)\n\
  \n在使用这些样式时，不要尝试设置不支持的属性（例如，Default 不支持 `DetailTextLabel`；Value1 不 `ImageView`），因为会导致空引用异常。\n\
  \n本章代码下载文件夹 `Tables02` 包含七张 PNG 图像（每个颜色一张），并且 `Color` 类添加了额外的 `Hex` 属性以演示不同的样式。在\
  \ `GetCell` 方法中更改每个 `UITableView` 的实例化以使用不同的样式：\n\n```csharp\nvar cell = new UITableViewCell\
  \ (UITableViewCellStyle.Subtitle, \"mycell\");\nColor display = sectionColors[indexPath.Section][indexPath.Row];\n\
  cell.TextLabel.Text = display.Name;\ncell.DetailTextLabel.Text = display.Hex;\n\
  cell.ImageView.Image = UIImage.FromFile(display.Name + \".png\");\n```\n\n图 6-4\
  \ 显示了使用上述代码的四种不同单元格样式选项，以及内置应用程序中每种样式的示例。\n\n图 6-4\n\n![f0604.eps](img/f0604_fmt.gif)\n\
  \n内置视图的视觉样式如字体字体大小颜色也可以在 `GetCell` 中更改：\n\n```csharp\ncell.DetailTextLabel.Font\
  \ = UIFont.SystemFontOfSize(20); // 更大\ncell.DetailTextLabel.TextColor = new UIColor(0,0,255,255);\
  \ // 蓝色\n```\n\n\n\n\n\n短列表（如之前示例中的七种颜色）易于导航，且不太引起性能问题。然而，当你需要显示几十、数百或数千行数据时（例如\
  \ iPod 应用中的 `Songs` 列表），则需要更多的代码来确保你的应用程序具有响应性并符合 iPhone 人机界面指南。为了解决这些问题，你需要：\n\n\
  *   在你的表格中实现可重用的单元格对象\n*   使用分组并可能使用索引来使你的表格更易导航\n\n每当新行滚动到视图中时，都会调用 `GetCell` 方法，因此\
  \ Listing 6-1 所示的代码将为每个进入视野的行返回一个新的 `UITableViewCell` 对象。在默认布局和单元格大小下，表格在 iPhone\
  \ 尺寸的屏幕上仅显示约 10 行，但如果不重用单元格对象，当你滚动一个长列表时，可能会创建数百（或数千）个对象——你的应用程序将会变慢并可能耗尽内存。\n\n\
  iPhone OS 为这个问题提供了一个巧妙的解决方案，类似于 .NET/WPF 开发者熟悉的 `VirtualizingStackPanel`。当一行移出屏幕时，该行的视图对象会被放入重用队列中，`UITableView`\
  \ 提供了一个方法在创建新对象之前查找该队列中的对象。接下来的代码显示使用了这种方法的改进型 `GetCell` 方法：\n\n```csharp\npublic\
  \ override UITableViewCell GetCell (UITableView tableView, NSIndexPath indexPath)\n\
  {\n    UITableViewCell cell = tableView.DequeueReusableCell(\"mycell\");\n    if\
  \ (cell == null)\n    {  // 无可重用对象，创建一个新对象\n        cell = new UITableViewCell (UITableViewCellStyle.Value1,\
  \ \"mycell\");\n    }\n    Element display = sectionElements[indexPath.Section][indexPath.Row];\n\
  \    cell.TextLabel.Text = display.Symbol;\n    return cell;\n}\n```\n\n`DequeueReusableCell`\
  \ 方法询问表格是否有任何可以重用的空闲 `UITableViewCell` 对象，如果没有，则返回 `null`。在这种情况下，你的代码将创建一个新的 `UITableViewCell`\
  \ 对象并在方法结束时返回它（如果它滚动出屏幕，最终会回到队列）。\n\n`\"mycell\"` 参数用于区分可以互换重用的单元格布局。因为此示例只有一个单元格布局，所以你向\
  \ `UITableViewCell` 构造函数和 `DequeueReusableCell` 传递相同的字符串。信息应用使用表格来显示每个对话，使用灰色和绿色的“气泡泡”单元格，它们需要不同的标识符，因为当你需要灰色单元格时，显然无法重用绿色的单元格。在这种情况下，你可能会先检查\
  \ `indexPath` 的内容以确定需要什么种类型的单元格，并可能使用 `\"greycell\"` 或 `\"greencell\"` 标识符从队列或实例化不同的\
  \ `UITableViewCell` 实现。你选择的实际字符串并不重要；重要的是不同的单元格布局具有不同的标识符。\n\n为了演示 `DequeueReusableCell`\
  \ 以及分组/索引，接下来的几个示例使用了一个 `Elements` 集合（此处太长，不再重新打印），该集合包含在本章的代码下载包中（文件夹 `Tables03`）。该集合的初始化如下：\n\
  \n```csharp\nelements = new List<Element>{\n    new Element{Name=\"hydrogen\",Number=\"\
  1\",Symbol=\"H\", Family=\"Hydrogen\"},\n    new Element{Name=\"helium\", Number=\"\
  2\",Symbol=\"He\",Family=\"Noble gas\"},\n    // 等等...\n};\n```\n\n在大多数情况下，你在表格中呈现的数据将是类似于\
  \ `Elements` 列表这样的单一扁平结构。使用 `UITableView` 的分组功能需要你重构数据，以便你的 `UITableViewSource`\
  \ 代理可以告诉表格显示多少组以及每个组中有多少项目。\n\nFigure 6-5 显示了用于普通表格和分组表格的数据结构之间的。对于之前的示例，简单的数组足以显示表格，因为有一个“隐式”的单节，行索引足以标识每个单元格。当使用分组时，`UITableView`\
  \ 使用 `Section` 和 `Row` 来标识每个单元格（`NSIndexPath` 的两个属性），因此二维数组类型的结构效果更好。\n\nFigure\
  \ 6-5\n\n![f0605.tif](img/f0605_fmt.jpg)\n\nListing 6-2 包含一个 `UITableViewSource`\
  \ 实现的示例，它使用 LINQ 创建了一个符合 `Section-Row` 层级结构的 `SortedDictionary`，并使分组变得简单：\n\n* \
  \  在 `MyTableViewSource` 的构造函数中，`Element` 对象列表被转换为两级层次结构：\n    *   首先，它使用 `Distinct`\
  \ LINQ 查询和 `Sort()` 方法提取每个组的准则，创建一个每个 `Element` 首字母数组。这创建了 `sectionTitles` 列表，用于填充索引并帮助将\
  \ `Elements` 分为组。\n    *   然后它遍历 `Elements` 以创建一个 `SortedDictionary`，其中键是起始字母的整数位置，元素是要显示在该组中的\
  \ `Element` 集合。\n    结果是两个可以通过节和行参数轻松引用的集合。\n*   `NumberOfSections`：要显示的组数。\n* \
  \  `TitleForHeader`：组的标题，在本例中是字母。\n*   `RowsInSection`：指定组中的项目数量。\n*   `RowSelected`：之前的示例通过检查\
  \ `indexPath` 来确定碰了哪个单元格。现在单元格分组了，你需要同时检查 `Section` 和 `Row` 值。\n*   `GetCell`：类似于\
  \ `RowSelected` 方法，你需要 `Row` 和 `Section` 属性。\n\n![download.gif](img/download.gif)\
  \ 分组数据 (Tables3.cs)\n\n```csharp\nprivate class MyTableViewSource : UITableViewSource\n\
  {\n    private AppDelegate app;\n    private List<string> sectionTitles;\n    private\
  \ SortedDictionary<int,List<Element>> sectionElements = new SortedDictionary<int,List<Element>>();\n\
  \n    public MyTableViewSource(AppDelegate appDelegate, List<Element> list)\n  \
  \  {\n        sectionTitles = (from c in list select c.StartsWith).Distinct().ToList();\n\
  \        sectionTitles.Sort();\n        foreach (var c in list)\n        {\n   \
  \         int sectionNum = sectionTitles.IndexOf(c.StartsWith);\n            if\
  \ (sectionElements.ContainsKey(sectionNum))\n                sectionElements[sectionNum].Add(c);\n\
  \            else\n                sectionElements.Add(sectionNum, new List<Element>{c});\n\
  \        }\n        app = appDelegate;\n    }\n\n    public override int NumberOfSections(UITableView\
  \ tableView)\n    {\n        // ie. 26 如果你使用英语字母表\n        return sectionTitles.Count;\n\
  \    }\n\n    public override string TitleForHeader(UITableView tableView, int section)\n\
  \    {\n        // ie. \"A\", \"B\", \"C\" 等 如果你使用字母表\n        // 但也可以是单词/标题\n \
  \       return sectionTitles[section];\n    }\n\n    public override int RowsInSection(UITableView\
  \ tableview, int section)\n    {\n        return sectionElements[section].Count;\n\
  \    }\n\n    public override void RowSelected(UITableView tableView, NSIndexPath\
  \ indexPath)\n    {\n        Element display = sectionElements[indexPath.Section][indexPath.Row];\n\
  \        app.ShowAlert(\"RowSelected\", \"You selected \" + display.Name);\n   \
  \ }\n\n    public override UITableViewCell GetCell(UITableView tableView, NSIndexPath\
  \ indexPath)\n    {\n        UITableViewCell cell = tableView.DequeueReusableCell(\"\
  mycell\");\n        if (cell == null)\n        {\n            cell = new UITableViewCell\
  \ (UITableViewCellStyle.Value2, \"mycell\");\n        }\n        Element display\
