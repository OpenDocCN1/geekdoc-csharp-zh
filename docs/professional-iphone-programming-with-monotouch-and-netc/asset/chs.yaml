  \    tableView.DeselectRow(indexPath, true);\n}\n```\n\n![note.ai](img/note_fmt.gif)\n\
  \n调用 `DeselectRow()` 是为了移除此表格中的蓝色选中指示器。如果没有调用 `DeselectRow()` 且用户返回此表格（使用导航控制器的返回功能），该行将仍然显示为已选中状态——这并不是\
  \ iPhone OS 应用程序的行为。\n\n现在运行应用程序将显示一个两级层次结构，你可以通过触摸行和导航控制器提供的“返回”按钮轻松进行导航。\n\n###\
  \ 创建静态行内容\n\n此示例的最后一步是另一种类型的表格——使用表格单元格的“详情视图”，用于层级结构的第三级。在 MonoDevelop 中创建另一个新文件（New\
  \ File），选择带控制器的视图接口定义（View Interface Definition with Controller）来添加 ColorsTableViewController。然后双击在\
  \ Interface Builder 中打开它。这些将是本章涉及最复杂的 Interface Builder 步骤——图 6-13 显示了快照，后续是详细说明。目标是在单个\
  \ XIB 文件中创建一个表格及其将使用的单元格，并在 `GetCell` 方法中使用对你创建的输出（outputs）的硬编码引用进行连接。\n\n图 6-13\n\
  \n![f0613.tif](img/f0613_fmt.jpg)\n\n要创建此表格及其单元格：\n\n1. 从 XIB 中删除 `UIView`。\n2.\
  \ 从对象库（Objects Library）拖入一个 `UITableView` 到 XIB。\n3. 点击表格并在属性检查器（Attributes Inspector）中将其样式更改为\
  \ `Grouped`（分组）。\n4. 从对象库拖入三个 `UITableViewCells` 到 XIB。点击每个单元格并为它们命名（`CellGroup`、`CellHex`\
  \ 和 `Cellname`）。\n5. 打开所有三个单元格，并在每个单元格中拖入一个 `UILabel`。对每个标签应用一些格式（例如，斜体或灰色）以区分它们。\n\
  6. 在类库（Classes Library）中选择 `SingleColorTableViewController` 并添加以下输出：`CellGroup`、`CellHex`、`Cellname`、`LabelGroup`、`LabelHex`、`LabelName`。\n\
  7. 在 XIB 中选择 `File's Owner`，连接检查器（Connections Inspector）中连接单元格和标签输出。\n\n此表格的代码在\
  \ Listing 6-6 所示。它与之前的 `UITableViewControllers` 结构相同；但有一个重要的区别：大多数 `UITableViewSource`\
  \ 方法都是硬编码的以反映特定的单元格和数据布局。`NumberOfSections` 和 `RowsInSection` 都返回显示非常特定设计的数字。`GetCell`\
  \ 更加不寻常——没有对象实例化，也没有 `DequeueReusableCell` 调用。相反，你通过输出直接从 XIB 引用标签和单元格。在之前的示例中，你使用\
  \ `UITableView` 来展示数据列表，其中每个单元格都使用相同的布局来显示行数据。而这段代码恰恰反之：每个单元格都可以有完全不同的布局——它们可以在\
  \ Interface Builder 中独立设计，并可以显示不同的数据。\n\n![download.eps](img/download_fmt.gif)\n\
  \nListing 6-6: Tables05\\SingleColorTableViewController.xib.cs\n\n```csharp\npublic\
  \ partial class SingleColorTableViewController : UITableViewController\n{\n    public\
