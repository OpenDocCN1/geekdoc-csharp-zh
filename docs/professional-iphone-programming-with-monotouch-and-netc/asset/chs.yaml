  \ += delegate\n{\n   WebBrowser.StopLoading();\n};\n```\n\n### `Toolbar01\\Main.cs`\n\
  \n### `UITabBarController`\n\n标签栏最明显的例子是 iPod 应用程序（如图 4-17 所示），它包含艺术家、专辑、视频等标签。\n\
  \n![f0417.tif](img/f0417_fmt.jpg)\n\n回想一下 `UIViewController` 的 `ViewWillAppear`\
  \ 和 `ViewWillDisappear` 方法——每当用户触摸标签时，当前标签的 `ViewWillDisappear` 方法就会被调用，然后调用所选标签的\
  \ `ViewWillAppear` 方法。当用户在标签视图之间导航时，这两个方法会被调用，以便您的视图能够响应隐藏和显示。\n\n##### 简单标签\n\n\
  第一个 `UITabBarController` 示例使用 Interface Builder 来构建标签及其内容。这是构建用户界面的简单方法，但需要小心，因为每个标签的\
  \ XIB 文件名输入到 Attributes（属性）中，因此您必须确保它们与文件匹配。另一个问题是 Interface Builder 目前在设计中不显示自定义图像。MonoDevelop\
  \ 的解决方案以及代码中 `TabBar01` 的 Interface Builder `MainWindow.xib` 如图 4-18 所示。\n\n创建此项目需要以下步骤：\n\
  * 作为 MonoDevelop 解决方案的一部分创建 `MainWindow.xib` 并在 Interface Builder 中打开。\n* 将 `UITabBarController`（库中橙圈图标）拖到\
  \ `MainWindow.xib`（而不是拖到“window”设计表面上）。这会自动创建图 4-18 所示的标签栏和两个标签项。\n![f0418.tif](img/f0418_fmt.jpg)\n\
  * 在 MonoDevelop 中添加两个带有 XIB 的视图定义：`MyScrollViewController` 和 `MyTextViewController`。\n\
  * 随后在 Interface Builder 中，将标签连接到每个标签的新 XIB 文件：\n    * 点击一次标签，分别在 Attributes 和 Identity\
  \ Inspectors 中设置 XIB 名称和类名，如图 4-19 所示。\n    ![f0419.tif](img/f0419_fmt.jpg)\n  \
  \  * 双击标签以在 Attributes Inspector 中选择其 `Title`（标题）和 `Image`（图像）。图 4-20 显示了两个标签设置。第一个标签使用内置的\
  \ `Identifier`，它设置了特定的 `Image` 和 `Title`——完整列表见表 4-5。为 `UITabBarItems` 创建自定义图像是复杂的。图像应该是\
