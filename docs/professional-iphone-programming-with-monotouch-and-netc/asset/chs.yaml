  \ = display.Name;\n\nreturn cell;\n}\n}\n```\n\n## 添加索引\n\n添加索引（表格右侧的字母列表，允许你直接跳转到表格的任何部分）非常简单，只需实现一个方法来描述每个部分应该显示哪些值：`SectionIndexTitles`\
  \ 即可。你有责任确保此数组中的元素数量与你数据中的组数相同。\n\n```csharp\npublic override string[] SectionIndexTitles\
  \ (UITableView tableView)\n{\n  // 用于右侧的垂直索引：最好只包含一个字符\n  // 例如，如果你使用字母表，则为 \"A\"\
  , \"B\", \"C\" 等\n  return sectionTitles.ToArray();\n}\n```\n\n在 iPhone 尺寸的设备上，索引留的垂直空间有限，因此请仔细选择你的索引策略——索引最常用于显示字母表（例如在联系人和\
  \ iPod 应用程序中）。如果项目太少，看起来会很稀疏且让用户感到陌生；如果项目过多，则会显得拥挤且无法使用。图 6-6 显示了带有索引和不索引的表格——有了索引，快速滚动到“Z”要容易得多。\n\
  \n图 6-6\n\n![f0606.tif](img/f0606_fmt.jpg)![note.ai](img/note_fmt.gif)\n\n要显示内置应用程序在索引中使用的搜索放大镜，请将\
  \ `\"{search}\"` 作为 `SectionIndexTitles` 数组的一个元素返回。这等于在 Objective-C 中使用常量 `UITableViewIndexSearch`。\n\
  \n# 分组表格样式\n\n当你在 Interface Builder 中放置 `UITableView` 时，它默认使用如上一个示例所示的 `Plain`（普通）样式。还有另一种样式——`Grouped`（分组），它在分组的元素之间提供了更直观的联系。`Grouped`\
  \ 样式可以用于长列表，但也常用于显示包含短列表的可能无关的信息的表格（例如在设置应用程序中）。\n\n由于表格的样式是在初始化期间设置的，因此 `Style`\
  \ 属性是只读的，无法在 `FinishedLaunching` 中更改。除非你在代码中创建 `UITableView`（这超出了本章范围），否则你应该在设计窗口时在\
  \ Interface Builder 中选择样式（如图 6-7 所示）。\n\n图 6-7\n\n![f0607.eps](img/f0607_fmt.gif)\n\
  \n`UITableView` 还允许在每个部分的末尾显示页脚。可以在 `Plain` 和 `Grouped` 样式中添加，尽管它在 `Grouped` 表格上看起来更好。你可以通过代理类中的另一个方法轻松地为表格添加页脚：`TitleForFooter`。\n\
  \n```csharp\npublic override string TitleForFooter (UITableView tableView, int section)\n\
  {  \n  int count = sectionElements[section].Count;\n  return String.Format(\"{0}\
  \ elements start with {1}\", \n                       count, sectionTitles[section]);\n\
  }\n```\n\n分组表格通常不用于字母分组，而是用于当你想显示较小的数据集，或者表格被用于显示表单时。iPhone 人机交互指南指出，你不应该在 `Grouped`\
  \ 表格样式上使用索引（即实现 `SectionIndexTitles`）。\n\n# 自定义单元格布局\n\n除了图 6-4 所示的四种内置单元格布局外，还有许多其他示例（内置和第三方）具有更复杂的单元格布局的表格。这些布局可以通过在\
  \ Interface Builder 中创建自定义的 `UITableViewCell`然后在 `UITableViewSource.GetCell` 方法中动态加载它来设计。这需要仔细使用\
  \ Interface Builder，以确保你的 `XIB` 设置正确以便通过 MonoTouch 访问。\n\n要构建具有自定义单元格的表格，请使用 MonoDevelop\
  \ 创建名为 `Tables04` 的新 iPhone Window 项目，并在 `MainWindow.xib` 中添加一个全屏 `UITableView`（或在本章的代码下载中查找它）。在\
  \ MonoDevelop 内部右键点击项目，选择 `Add ⇒ New File`，选择 `View Interface Definition`，并命名为 `MyTableViewCell.xib`。\n\
  \n在 Interface Builder 中执行以下步骤，部分如图 6-8 所示：\n\n1. 从 `XIB` 中删除默认的 `UIView`——需要更具体的视图类。\n\
  2. 从对象库将 `UITableViewCell` 拖入 `MyTableViewCell.xib`。打开它并从库中拖入四个 `UILabels`；放置它们。\n\
  \   - 在 Identity Inspector（身份检查器）中将 Class 设置为 `UITableViewCell`。\n   - 在 Attributes\
  \ Inspector（属性检查器）中将 Identifier 设置为 `MyCell`。这是 `DequeueReusableCell()` 中引用的标识符。\n\
  \   - 在 Connections Inspector（连接检查器）中连接好 outlets。\n3. 对 File Owner 进行以下更改：\n   -\
  \ 在 Identity Inspector 中将 Class 设置为 `UITableView`。\n   - 在 Connections Inspector\
  \ 中添加一个名为 `Cell` 的 outlet。\n   - 在 Connections Inspector 中“连线” `Cell`。\n\n图 6-8\n\
  \n![f0608.tif](img/f0608_fmt.jpg)\n\n在 Interface Builder 中保存 `XIB` 并返回 MonoDevelop\
  \ 后，`designer.cs` 文件包含部分定义：`UIViewController` 应有一个 `Cell` 属性，`UITableViewCell` 有四个标签。`designer.cs`\
  \ 永远不应该被编辑；但注意 MonoTouch 为每个类添加了以下注释：\n- `// Base type should be ViewController`\n\
  - `// Base type should be UITableViewCell`\n\n这些生成的注释为如何完成类提供了指导。列表 6-3 显示了你需要完成部分类的代码，分别继承\
  \ `UIViewController` 和 `UITableViewCell`。你还需要为私定义的 outlets 添加公共属性以及从 `XIB` 加载 `UITableViewCell`\
  \ 所需的构造函数（重要的是它们调用了基类构造函数）。\n\n```csharp\npublic partial class UITableViewCell :\
  \ UITableViewCell\n{\n  // 对于需要从 xib 而不是托管代码创建的控制器，\n  // IntPtr 和 NSCoder 构造函数是必要的\n\
  \  public UITableViewCell (IntPtr handle) : base(handle)\n  {\n    Initialize();\n\
  \  }\n  [Export(\"initWithCoder:\")]\n  public UITableViewCell (NSCoder coder) :\
  \ base(coder)\n  {\n    Initialize();\n  }\n\n  void Initialize() {}\n\n  public\
  \ string ElementName\n  {\n    get {return Name.Text;}\n    set {Name.Text = value;}\n\
  \  }\n\n  #region 其他属性：ElementSymbol, ElementNumber, ElementFamily\n}\n```\n\n在\
  \ `Main.cs` 中只需进行少量更改即可完成实现。`AppDelegate` 需要一个通过 Interface Builder “创建”的 `UITableViewViewController`\
  \ 字段：\n\n```csharp\nUITableViewViewController myTVC = new UITableViewViewController();\n\
  ```\n\n`GetCell` 方法使用该字段通过 `LoadNib()` 加载 `XIB`。在这种情况下，控制器并没有连接到表格，它仅为了从 `XIB` 加载其\
  \ `MyCell` 属性而存在。\n\n```csharp\npublic override UITableViewCell GetCell (UITableView\
  \ tableView, NSPath indexPath)\n{\n  UITableViewCell cell = tableView.DequeueReusableCell\n\
  ```\n\n\n\n\n\n```csharp\n(\"MyCellIdentifier\"); // 在 XIB 中设置\n\nMyTableViewCell\
  \ mycell = null;\n\nif (cell == null)\n{  // 没有可重用单元，加载新对象（来自 XIB 文件）\n    NSBundle.MainBundle.LoadNib(\"\
  MyTableViewCell\", app.myTVC, null);\n    mycell = app.myTVC.MyCell;\n    app.myTVC.MyCell\
  \ = null;\n}\nelse\n{\n    mycell = (MyTableViewCell)cell;\n}\n// 现在我们有了一个单元格，设置显示属性\n\
  Element display = sectionElements[indexPath.Section][indexPath.Row];\nmycell.ElementName\
  \   = display.Name;\nmycell.ElementSymbol = display.Symbol;\nmycell.ElementNumber\
  \ = display.Number;\nmycell.ElementFamily = display.Family;\nreturn mycell;\n```\n\
  \n带有自定义单元格的完成表格在图 6-9 所示。\n\n图 6-9\n\n![f0609.tif](img/f0609_fmt.jpg)\n\n## 使用表格导航\n\
  \n许多 iPhone iOS 应用使用表格来在层级数据结构中进行导航，例如 iPod 艺术家列表，它可以带你进入专辑列表，然后进入歌曲列表。本章之前的示例将\
  \ `UITableView` 作为窗口的唯一视图。要使用表格进行导航，你需要引入一个新类——`UINavigationController`——它管理一组 `UITableViews`\
  \ 作为子视图，并根据需要显示或隐藏它们。图 6-10 展示了两个层级的表格导航，通向一个作为“详情视图”的静态表格。\n\n图 6-10\n\n![f0610.tif](img/f0610_fmt.jpg)\n\
  \n## 使用 UINavigationController\n\n此示例使用了一个小型列表以保持简单——本章之前示例中的七种颜色。你从三个颜色组的列表开始，深入颜色的子集，然后显示“颜色详情”视图。\n\
  \n要创建一个示例表格导航，在 MonoDevelop 中创建一个名为 `Tables05` 的新“iPhone 导航应用程序”（iPhone Navigation\
  \ Application）（你可以在本章的下载中找到它）。\n\n新解决方案已经包含了一些所需的类，如图 6-11 所示。\n\n图 6-11\n\n![f0611.tif](img/f0611_fmt.jpg)\n\
  \n`MainWindow.xib` 已经包含一个 `UINavigationController`、`UINavigationBar`、一个名为 `RootViewController`\
  \ 的类以及一个 `UINavigationItem`，如图 6-12 所示。这些类中的任何一个都不需要在 Interface Builder 中进行更改——如果你点击导航控制器，设计器会在窗口顶部显示导航栏，并显示带有“来自\
  \ 'RootViewController'”消息的内容区域（如图 6-12\n\n![f0612.tif](img/f0612_fmt.jpg)\n\n图 6-12\
  \ 还显示如果你点击 App Delegate，在连接检查器（Connections Inspector）中已经定义了两个输出口：`window` 和 `navigationController`。这两个对象已经在\
  \ `FinishedLaunching` 中被引用，并允许窗口引用导航控制器——如果你现在启动/调试应用程序——它将显示一个空表格。\n\n```csharp\n\
  public override bool FinishedLaunching (UIApplication app, NSDictionary options)\n\
  {\n    window.AddSubview (navigationController.View);\n    window.MakeKeyAndVisible\
  \ ();\n    return true;\n}\n```\n\n要让第一个表格视图工作起来，你需要“完成”模板提供的 `RootViewController`。Interface\
  \ Builder 中不需要编辑任何内容——`RootViewController.xib` 已经包含一个 `UITableView`——但你需要提供 `UITableViewSource`\
  \ 的实现，以便它有数据可以显示。代码如列表 6-4 所示，看起来应该非常熟悉。唯一的新代码是 `Title = \"Colors\";`，它出现在屏幕顶部的导航栏中。\n\
  \n![download.eps](img/download_fmt.gif)\n\n列表 6-4: Tables05\\RootViewController.xib.cs\n\
  \n```csharp\npartial class RootViewController : UITViewController // 需要构造函数来创建类\n\
  \    public RootViewController (IntPtr handle) : base(handle) {}\n    public override\
  \ void ViewDidLoad()\n    {\n        base.ViewDidLoad();\n        Title = \"Colors\"\
  ; // 出现在屏幕顶部的导航栏中\n    }\n    class DataSource : UITableViewSource\n    {\n    \
  \    RootViewController controller;\n        List<string> rows;\n        public\
  \ DataSource (RootViewController controller, List<string> data)\n        {\n   \
  \         this.controller = controller;\n            rows = data;\n        }\n \
  \       public override int RowsInSection (UITableView tableview, int section)\n\
  \        {\n            return rows.Count;\n        }\n        public override UITableViewCell\
  \ GetCell (UITableView tableView, NSIndexPath indexPath)\n        {\n          \
  \  string cellIdentifier = \"Cell\";\n            var cell = tableView.DequeueReusableCell(cellIdentifier);\n\
  \            if (cell == null)\n            {\n                cell = new UITableViewCell\
  \ (UITableViewCellStyle.Default, cellIdentifier);\n            }\n            cell.TextLabel.Text\
  \ = rows[indexPath.Row];\n            return cell;\n        }\n    }\n}\n```\n\n\
  应用程序现在会显示一个颜色组的列表，但注意在 RowSelected 方法处有一个 //TODO 占位符。你需要创建下一层导航。\n\n## 实现第二层导航\n\
  \n在 MonoDevelop 中选择添加新文件并选择带有控制器的接口定义（Interface Definition with Controller）来添加 `TableViewController`。然后双击在\
  \ Interface Builder 中打开它。\n\n*   从 XIB 删除 `UIView`。\n*   将 `UITableView` 拖入 XIB。\n\
  *   将 File's Owner 输出连接到 `UITableView`。注意 File's Owner 类型已经是 `TableViewController`。\n\
  \n关闭 Interface Builder 并在 MonoDevelop 中打开 `TableViewController.xib.cs`，以便完成由你的 Interface\
  \ Builder XIB 文件生成的部分类。完整的类应该与列表 6-4 非常相似，只需将构造函数和 ViewDidLoad 方法替换为如列表 6-5 所示的内容。\n\
  \n![download.eps](img/download_fmt.gif)\n\n列表 6-5: Tables05\\TableViewController.xib.cs\n\
  \n```csharp\npartial class TableViewController : UITableViewController // 构造函数：base\
  \ 引用 XIB 文件名进行加载\n    public TableViewController (IntPtr handle) : base(handle)\
  \ {}\n    public TableViewController (List<MyColor> data, string key) : base (\"\
  TableViewController\", null)\n    {\n        // 找到与颜色组键值匹配的颜色\n        colors =\
  \ (from c in data \n                  where c.Group == key\n                  select\
  \ c).ToList();\n        this.TableView.Source = new DataSource (this, groups);\n\
  \    }\n    private List<MyColor> colors;\n    // TODO: 在创建第二层后插入列表 6-4 中的 DataSource（不带\
  \ RowSelected）\n}\n```\n\n\n\n\n\n现在你已经有一个表格要显示了，请在 `RootViewController.xib.cs`\
  \ 中实现此 `RowSelected` 方法，参考 Listing 6-4。当某行被选中时，你创建一个新的 `ColorsTableViewController`\
  \ 实例，并它传递数据引用（`controller.colors`）和所选行的值（`rows[indexPath]`），以便它能够显示正确的数据集。它还会设置\
  \ `Title` 属性（该属性会显示在表格的导航区域），然后调用 `PushViewController`，告诉 `UINavigationController`\
  \ 将该视图放在“栈顶端”并显示它。\n\n```csharp\n// for Listing 6-4 RootViewController.xib.cs\n\n\
  public override void RowSelected \n      (UITableView tableView, MonoTouch.Foundation.NSIndexPath\
  \ indexPath)\n{\n    var colorsViewController = new ColorsTableViewController \n\
  \                              (controller.colors, rows[indexPath.Row]);\n    colorsViewController.Title\
  \ = rows[indexPath.Row];\n    controller.NavigationController.PushViewController\
