  \ 将该视图放在“栈顶端”并显示它。\n\n```csharp\n// for Listing 6-4 RootViewController.xib.cs\n\n\
  public override void RowSelected \n      (UITableView tableView, MonoTouch.Foundation.NSIndexPath\
  \ indexPath)\n{\n    var colorsViewController = new ColorsTableViewController \n\
  \                              (controller.colors, rows[indexPath.Row]);\n    colorsViewController.Title\
  \ = rows[indexPath.Row];\n    controller.NavigationController.PushViewController\
  \ \n                                              (colorsViewController, true);\n\
  \    tableView.DeselectRow(indexPath, true);\n}\n```\n\n![note.ai](img/note_fmt.gif)\n\
  \n调用 `DeselectRow()` 是为了移除此表格中的蓝色选中指示器。如果没有调用 `DeselectRow()` 且用户返回此表格（使用导航控制器的返回功能），该行将仍然显示为已选中状态——这并不是\
  \ iPhone OS 应用程序的行为。\n\n现在运行应用程序将显示一个两级层次结构，你可以通过触摸行和导航控制器提供的“返回”按钮轻松进行导航。\n\n###\
  \ 创建静态行内容\n\n此示例的最后一步是另一种类型的表格——使用表格单元格的“详情视图”，用于层级结构的第三级。在 MonoDevelop 中创建另一个新文件（New\
  \ File），选择带控制器的视图接口定义（View Interface Definition with Controller）来添加 ColorsTableViewController。然后双击在\
  \ Interface Builder 中打开它。这些将是本章涉及最复杂的 Interface Builder 步骤——图 6-13 显示了快照，后续是详细说明。目标是在单个\
  \ XIB 文件中创建一个表格及其将使用的单元格，并在 `GetCell` 方法中使用对你创建的输出（outputs）的硬编码引用进行连接。\n\n图 6-13\n\
  \n![f0613.tif](img/f0613_fmt.jpg)\n\n要创建此表格及其单元格：\n\n1. 从 XIB 中删除 `UIView`。\n2.\
  \ 从对象库（Objects Library）拖入一个 `UITableView` 到 XIB。\n3. 点击表格并在属性检查器（Attributes Inspector）中将其样式更改为\
  \ `Grouped`（分组）。\n4. 从对象库拖入三个 `UITableViewCells` 到 XIB。点击每个单元格并为它们命名（`CellGroup`、`CellHex`\
  \ 和 `Cellname`）。\n5. 打开所有三个单元格，并在每个单元格中拖入一个 `UILabel`。对每个标签应用一些格式（例如，斜体或灰色）以区分它们。\n\
  6. 在类库（Classes Library）中选择 `SingleColorTableViewController` 并添加以下输出：`CellGroup`、`CellHex`、`Cellname`、`LabelGroup`、`LabelHex`、`LabelName`。\n\
  7. 在 XIB 中选择 `File's Owner`，连接检查器（Connections Inspector）中连接单元格和标签输出。\n\n此表格的代码在\
  \ Listing 6-6 所示。它与之前的 `UITableViewControllers` 结构相同；但有一个重要的区别：大多数 `UITableViewSource`\
  \ 方法都是硬编码的以反映特定的单元格和数据布局。`NumberOfSections` 和 `RowsInSection` 都返回显示非常特定设计的数字。`GetCell`\
  \ 更加不寻常——没有对象实例化，也没有 `DequeueReusableCell` 调用。相反，你通过输出直接从 XIB 引用标签和单元格。在之前的示例中，你使用\
  \ `UITableView` 来展示数据列表，其中每个单元格都使用相同的布局来显示行数据。而这段代码恰恰反之：每个单元格都可以有完全不同的布局——它们可以在\
  \ Interface Builder 中独立设计，并可以显示不同的数据。\n\n![download.eps](img/download_fmt.gif)\n\
  \nListing 6-6: Tables05\\SingleColorTableViewController.xib.cs\n\n```csharp\npublic\
  \ partial class SingleColorTableViewController : UITableViewController\n{\n    public\
  \ SingleColorTableViewController() : base()\n    public SingleColorTableViewController(MyColor\
  \ data)\n              : base(\"SingleColorTableViewController\", null)\n    { //\
  \ 从 XIB 加载，然后是 DataSource\n        this.TableView.Source = new DataSource(this,\
  \ data);\n        this.TableView.Selection = false;\n    }\n    class DataSource\
  \ : UITableViewSource\n    {\n        public DataSource (SingleColorTableViewController\
  \ controller, MyColor data)\n        {\n            this.controller = controller;\n\
  \            row = data;\n        }\n        SingleColorTableViewController controller;\n\
  \        MyColor row;\n        public override int NumberOfSections(UITableView\
  \ tableView)\n        {\n            return 2; // 是的，硬编码为我们想要的布局\n        }\n  \
  \      public override int RowsInSection(UITableView tableview, int section)\n \
  \       { // 硬编码以拆分单元格\n            if (section == 0)\n                return 1;\n\
  \            else\n                return 2;\n        }\n        public override\
  \ UITableViewCell GetCell (UITableView tableView, indexPath indexPath)\n       \
  \ { // 更加硬编码以正确布局\n            if (indexPath.Section == 0)\n            {\n    \
  \            controller.LabelName.Text = row.Name;\n                return controller.CellName;\n\
  \            }\n            else // Section == 1\n            if (indexPath.Row\
  \ == 0)\n            {\n                controller.LabelHex.Text = row.Hex;\n  \
  \              return controller.CellHex;\n            }\n            else\n   \
  \         {\n                controller.LabelGroup.Text = row.Group;\n         \
  \       return controller.CellGroup;\n            }\n        }\n    }\n}\n```\n\n\
  ### 编辑表格行\n\n`UITableView` 的另一个功能是内置编辑功能：删除单元格、重新排序单元格以及提供一致的用户界面来添加新行。这些元素中的每一个都可以通过实现\
  \ `UITableViewSource` 委托类的方法来单独启用。\n\n你将再次从此示例的 Colors 列表开始。Tables06 的代码在本章的下载包中。\n\
  \n### 添加滑动删除\n\n\n\n\n最容易实现的编辑功能是滑动删除。表格上没有视觉指示器显示启用了任何编辑功能，但当用户跨越某行进行滑动时，就会出现一个\
  \ `Delete`（删除）按钮。点击该按钮会立即删除该行。`UITableViewSource` 子类使用以下三种方法来启用此功能：\n\n*   `CanEditRow`：此方法在表格渲染时被调用，以便其响应“编辑输入”（如滑动）。`indexPath`\
  \ 是一个参数，因此可以为每一行设置不同的响应。不过，在本示例中，它是硬编码的 `true`。表格中的每一行都将对滑动手势做出响应并显示 `Delete` 按钮。\n\
  *   `CommitEditingStyle`：在发生“编辑”操作时调用。因为在这个简单示例中只有 `Delete` 是有效的，因此代码仅展示了 `Delete`\
  \ 是如何工作的。首先从底层数据结构中删除数据（在此例中调用了 `rows.RemoveAt`），然后在在表格上调用 `DeleteRows` 以从表格中移除相应的单元格。\n\
  *   `TitleForDeleteConfirmation`：按钮上文本的可选自定义。\n\n```csharp\npublic override int\
  \ RowsInSection (UITableView tableview, int section)\n{\n    return rows.Count;\n\
  }\n\npublic override bool CanEditRow (UITableView tableView,\n                 \
  \               MonoTouch.Foundation.NSIndexPath indexPath)\n{\n    return true;\n\
  }\n\n// Override to support editing the table view.\npublic override void CommitEditingStyle\
  \ (UITableView tableView,\n    UITableViewCellEditingStyle editingStyle, NSIndexPath\
  \ indexPath)\n{\n    rows.RemoveAt(indexPath.Row);\n    tableView.DeleteRows (\n\
  \      new NSIndexPath[] { indexPath }, UITableViewRowAnimation.Fade);\n}\n\npublic\
  \ override string TitleForDeleteConfirmation\n                     (UITableView\
  \ tableView, NSIndexPath indexPath)\n{  // OPTIONAL: Defaults to Delete\n    return\
  \ \"Trash this\";\n}\n```\n\n`DeleteRows` 接收一个 `indexPaths` 数组，因此它知道要将哪些视觉表示（单元格）从表格中动画淡出；它还接受一个参数来选择如何动画删除。动画选项列在\
  \ 表 6-3 中，并适用于行插入，行插入将在本章节稍后介绍。\n\nTable 6-3: UITableViewRowAnimation\n\n| 动画 |\
  \ 行为（插入和删除） |\n| --- | --- |\n| None | 无动画 |\n| Fade | 单元格淡入或淡出 |\n| Right | 从右侧滑入或向右侧滑出\
  \ |\n| Left | 从左侧滑入或向左侧滑出 |\n| Top | 从顶部向下滑动 |\n| Bottom | 从底部向向上滑动 |\n\n## 启用编辑“模式”\n\
  \n`UITableView` 还提供了一个更明显的编辑 UI，通过 `SetEditing` 方法启用。此模式在每行中使用一个红色的停止符号开关，这会导致 `Delete`\
  \ 按钮出现。大多数应用程序都提供一个 `Edit` 按钮来显示这些开关，`UINavigationController` 可以方便地如如下代码所示添加按钮。`ViewDidLoad`\
  \ 创建了两个外观略有不同的按钮，`Clicked` 切换 `Editing` 模式并显示相应的按钮。\n\n```csharp\npublic override\
  \ void ViewDidLoad ()\n{\n    // ... initialization code here ...\n    editButton\
  \ = new UIBarButtonItem\n                  (\"Edit\", UIBarButtonItemStyle.Bordered,\
  \ Clicked);\n    doneButton = new UIBarButtonItem\n                  (\"Done\",\
  \ UIBarButtonItemStyle.Done, Clicked);\n    NavigationItem.RightBarButtonItem =\
  \ editButton;\n    TableView.Source = new DataSource (this, colors);\n}\n\nvoid\
  \ Clicked (object sender, EventArgs ea)\n{\n    if (TableView.Editing)\n    {  //\
  \ 切换关闭，显示编辑\n        TableView.SetEditing (false, true);\n        NavigationItem.RightBarButtonItem\
  \ = editButton;\n    }\n    else\n    {  // 切换开启，显示完成\n        TableView.SetEditing\
  \ (true, true);\n        NavigationItem.RightBarButtonItem = doneButton;\n    }\n\
  }\n```\n\n在调用 `SetEditing` 后，表格通常会同时显示删除和移动指示。`CanMoveRow` 会为每一行被调用，以确定它是否可以移动——如果你不想支持重排序（如\
  \ 图 6-14 所示），请返回 `false`。\n\n```csharp\nclass DataSource : UITableViewSource\n{\n\
  \    // ... other methods ...\n    public override bool CanMoveRow (UITableView\
  \ tableView, NSIndexPath indexPath)\n    {\n        return false; // （暂）不可移动\n \
  \   }\n}\n```\n\n## 重排序单元格\n\n某些表格确实需要重排序（例如 `Stocks` 应用），这需要以下两个方法：\n\n*   `CanMoveRow`：对每一行返回\
  \ `true`，导致移动指示器显示并使行可移动。\n*   `MoveRow`：接收关于行旧位置位置的两个参数，便于更新底层数据。`UITableView`\
  \ 不需要更新，因为它已经知道移动并在用户界面中反映了它（这与在 `CommitEditingStyle` 中调用表格的 `DeleteRows` 方法不同）。\n\
  \n```csharp\npublic override bool CanMoveRow (UITableView tableView, NSIndexPath\
  \ indexPath)\n{ // 所有行均可移动，始终返回 true\n    return true;\n}\n\npublic override void\
  \ MoveRow (UITableView tableView, NSIndexPath sourceIndexPath, NSIndexPath destinationIndexPath)\n\
  {\n    var tempRow = rows[sourceIndexPath.Row];\n    rows.Remove(sourceIndexPath.Row);\
  \ // 从此处删除\n    int targetRowIndex = destinationIndexPath.Row;\n    rows.Insert(targetRowIndex,\
  \ tempRow); // 在此处插入\n}\n```\n\n图 6-15 显示了正在移动的行。在模拟器中移动行可能有些困难——移动指示（三条横线）是为手指设计的，微小的鼠标指针很难捕捉。在设备上测试容易得多。\n\
  \n## 创建插入图标\n\n`UITableView` 支持的最后一个编辑功能是添加新行。`Contacts` 应用使用绿色加 (+) 图标添加项目，因此你将在表格末尾放置类似的选项。实现\
  \ (+) 行需要修改 `UITableViewSource` 中的几乎所有方法，因为除了显示数据外，你必须跟踪新的非数据单元格。每个方法现在都包含一个 `if-else`\
  \ 子句，检查它是为数据行还是为 (+) 行调用的。更改在此处描述，并在 列表 6-7 中所示：\n\n*   `GetCell`：创建两种不同的单元格样式——用于数据的\
  \ `Subtitle` 和用于“添加新”行的 `Value2`。\n*   `EditingForRow`：对所有数据行设置 `Delete` 样式，对最后一行设置\
  \ `Insert` 样式。\n*   `RowSelected`：如果点击数据行，将显示警告。然而，如果点击 (+) 行，则会调用 `AddNewRows`。在实际应用程序中，这可能会打开一个数据输入视图，但在示例中你将插入一些硬编码的数据。\n\
  *   `CommitEditingStyle`：在触发编辑操作时调用——无论是点击 `Delete` 按钮还是 (+) 图标。方法参数包含在特定行上请求的操作。\n\
  \n```csharp\npublic override UITableViewCell GetCell (UITableView tableView, NSIndexPath\
  \ indexPath)\n{\n    UITableViewCell cell = null;\n    if (indexPath.Row < rows.Count)\n\
  \    {  // 正常数据 \n        cell = tableView.DequeueReusableCell (\"Cell\");\n   \
  \     if (cell == null)\n        {\n            cell = new UITableViewCell (UITableViewCellStyle.Subtitle,\
  \ \"Cell\");\n        }\n        cell.TextLabel.Text = rows[indexPath.Row].Name;\n\
  \        cell.DetailTextLabel.Text = rows[indexPath.Row].Hex;\n    }\n    return\
  \ cell;\n}\n```\n\n\n\n\n```csharp\n{  // 使用 (+) 添加新单元格\n    cell = tableView.DequeueReusableCell\
  \ (\"Cell2\");\n    if (cell == null)\n    {\n      cell = new UITableViewCell (UITableViewCellStyle.Value2,\
  \ \"Cell2\");\n    }\n    cell.TextLabel.Text = \"add new color\";\n  }\nreturn\
  \ cell;\n}\n\npublic override UITableViewCellEditingStyle EditingStyleForRow(UITableView\
  \ tableView, NSIndexPath indexPath)\n{\n   if (indexPath.Row < rows.Count)     \
  \   // 数据行\n     return UITableViewCellEditingStyle.Delete;\n   else           \
  \                    // (+) “添加新”行\n     return UITableViewCellEditingStyle.Insert;\n\
  }\n\npublic override void RowSelected(UITableView tableView, NSIndexPath indexPath)\n\
  {\n   if (indexPath.Row < rows.Count)\n   {   // 触碰了一个数据行\n     displayText = rows[indexPath.Row].Name;\n\
  \     ShowAlert (\"RowSelected\",\"你选择了 \"+displayText);\n   }\n   else\n   {  //\
  \ 触碰了“添加新”行\n     AddNewRows(tableView, indexPath); // 或者显示数据输入视图\n   }\n   tableView.DeselectRow(indexPath,true);\n\
  }\n\npublic override void CommitEditingStyle (UITableView tableView, UITableViewCellEditingStyle\
  \ editingStyle, NSIndexPath indexPath)\n{\n   if (editingStyle == UITableViewCellEditingStyle.Delete)\n\
  \   {  // 触碰了这一行的删除按钮\n     rows.RemoveAt(indexPath.Row);\n     tableView.DeleteRows(new\
  \ NSIndexPath[] {indexPath}, UITableViewRowAnimation.Fade);\n   }\n   else if (editingStyle\
  \ == UITableViewCellEditingStyle.Insert)\n   {  // 触碰了这一行的插入图标 (+)\n     AddNewRows\
  \ (tableView, indexPath);\n   }\n}\n```\n\n图 6-16 显示了一个表格，其中最后一个单元格通过插入（`+` 图标）渲染。在你的代码中，`RowSelected`\
  \ 方法可能会显示一个新的数据输入视图，而不是像示例那样直接插入数据。\n\n图 6-16\n\n![f0616.tif](img/f0616_fmt.jpg)\n\
  \n## 添加新行\n\n`InsertRows` 方法允许你向表格添加多个行，并利用内置动画更新表格的外观。如果你正在创建一个可编辑的表格，例如联系人应用程序的用户界面（动画发生在图\
  \ 6-17 所示的“视图”和“编辑联系人”之间），或者如果你的底层数据源正在从外部更新（例如新的电子邮件或推文出现在收件箱或 Twitter 客户端的顶部），你可能需要添加多个行。\n\
  \n图 6-17\n\n![f0617.tif](img/f0617_fmt.jpg)\n\n下方所示 `AddNewRows` 方法演示了如何使用 `InsertRows`。该方法最重要的方面是：\n\
  \n*   在对表格和数据的修改周围调用 `BeginUpdates` 和 `EndUpdates`。\n*   创建并传递 `NSIndexPath` 实例，以告知表格要插入哪些行。在这里，你从被触碰的行的索引开始向表格添加三行，因此数组包含了传入的\
  \ `indexPath` 以及另外两个偏移了 1 和 2 的额外 `NSIndexPaths`。\n*   确保你向数据中添加的行数与传递给 `InsertRows`\
  \ 的行数相同，这样当表格执行这些行出现的的动画时，它们已经存在于集合中，并供 `GetCell` 访问。在这种情况下，你使用 `rows.Add()` 将对象添加到集合的末尾，但如果你使用\
  \ `NSIndexPath` 数组指定了不同的位置，你还应该确保数据也精确地插入到那些位置中。\n*   选择要使用的动画类型。\n\n```csharp\n\
  void AddNewRows (UITableView tableView, NSIndexPath indexPath)\n{\n   tableView.BeginUpdates();\
  \               // 正在插入行的数据\n   rows.Add(new MyColor{Name=\"Puce\", Group=\"Other\"\
  , Hex=\"#CC8899\"});\n   rows.Add(new MyColor{Name=\"Avocado\", Group=\"Other\"\
  , Hex=\"#98A148\"});\n   rows.Add(new MyColor{Name=\"Azure\", Group=\"Other\", Hex=\"\
  #F0FFFF\"});\n   NSIndexPath indexPath1, i2indexPath2; // 插入行的位置\n   indexPath1\
  \ = NSIndexPath.FromRowSection(indexPath.Row + 1, 0);\n   indexPath2 = NSIndexPath.FromRowSection(indexPath.Row\
  \ + 2, 0);\n   controller.TableView.InsertRows(\n             new NSIndexPath[]\
  \ {indexPath, indexPath1, indexPath2},\n             UITableViewRowAnimation.Fade);\n\
  \   tableView.EndUpdates();\n}\n```\n\n这个显示插入三个硬编码对象的示例并不十分真实。大多数应用程序会使用插入图标来显示新的数据输入视图，更新表格数据，并在导航回此视图时调用\
  \ `ReloadData`。当表格的大部分数据发生变化，或者你不想显示动画时，你也应该使用 `ReloadData` 而不是 `InsertRows`。\n\n\
  你在本章中实现的编辑命令确保了在用户与应用程序交互时，底层数据（在本例中为 `List<>`）会被修改。然而，你还需要记住要提供一种机制来保存这些更改。\n\n\
  ## 在表格中添加搜索栏\n\n许多内置应用程序的表格都包含一个搜索栏，以便在长列表（如邮件收件箱和所有标签）中导航。触碰搜索输入会让底层变灰并显示键盘。\n\n\
  搜索栏示例基于之前使用的 Elements 数据。图 6-18 显示了如何将控制器拖到你的表格上。确保选择搜索栏显示器类（而不是普通的搜索栏）。\n\n图 6-18\n\
  \n![f0618.tif](img/f0618_fmt.jpg)\n\n注意，该对象应该拖到 `UITableView` 上（而不是视图的其他地方）；这样做会导致\
  \ Interface Builder 连接多个输出（outlets），包括 `UISearchDisplayController`。图 6-19 显示了 App\
  \ Delegate、表格控制器和搜索显示器的所有自动生成的输出。你需要定义的唯一两个输出被圈出了：`MyTableView` 和 `MySearchDisplayController`。\n\
  \n图 6-19\n\n![f0619.eps](img/f0619_fmt.gif)\n\n## 启用搜索栏\n\n将控件拖到表格视图后，你需要添加以下三项来启用搜索栏：\n\
  \n*   一个存储匹配搜索标准的标准的集合。该集合会在搜索标准更改时进行更新。\n*   一个用于由搜索器创建的 `UITableView` 的 `UITableViewSource`\
  \ 子类。该类负责显示结果行。\n*   一个可以响应 `UISBarController` 事件的 `UISearchDisplayDelegate` 子类。你必须使用该类中的方法来响应搜索事件，例如更新结果集合以便\
  \ `UITableView` 显示它们。\n\n首先，在 `AppDelegate` 中添加一个 `FilteredElements` 属性用于存储搜索结果。它将由搜索器填充，并由搜索器的表格视图显示。\n\
  \n```csharp\nList<Element> FilteredElements { get; set; }\n```\n\n\n\n\n\n你随后必须实现一个\
  \ `UITableViewSource`，使用 `FilteredElements` 集合作为其数据源，如 Listing 6-8 所示。要访问该集合，你可以将\
  \ `AppDelegate` 传入该类并引用 `FilteredElements` 属性。\n\n![download.eps](img/download_fmt.gif)\n\
  \nListing 6-8: 支持搜索的 `UITableViewSource` (`Tables07\\Main.cs`)\n\n```csharp\nclass\
  \ MySearchResultsSource : UITableViewSource\n{\n    AppDelegate _appd;\n\n    public\
  \ MySearchResultsSource (AppDelegate appd)\n    {\n      _appd = appd; // to access\
  \ FilteredElements for display\n    }\n\n    public override int RowsInSection(UITableView\
  \ tableview, int section)\n    {\n        return _appd.FilteredElements.Count;\n\
  \    }\n\n    public override UITableViewCell GetCell\n      (UITableView tableView,\
  \ NSIndexPath indexPath)\n    {\n      string kCellIdentifier = \"mycell\";\n  \
  \    UITableViewCell cell = tableView.DequeueReusableCell(kCellIdentifier);\n  \
  \    if (cell == null)\n      {  // No re-usable cell found, create a new one\n\
  \        cell = new UITableViewCell \n            (UITableViewCellStyle.Default,\
  \ kCellIdentifier);\n      }\n      Element display = _appd.FilteredElements[indexPath.Row];\n\
  \      cell.TextLabel.Text = display.Name;\n      return cell;\n    }\n\n    public\
  \ override void RowSelected\n      (UITableView tableView, NSIndexPath indexPath)\n\
  \    {\n      Element display = _appd.FilteredElements[indexPath.Row];\n      ShowAlert\
  \ (\"RowSelected\", \"You selected \" + display.Name);\n      tableView.DeselectRow(indexPath,true);\
  \ \n    }\n\n    public void ShowAlert (string title, string message)\n    {\n \
  \     using (var alert = new UIAlertView(title,message,null,\"OK\",null))\n    \
  \  { alert.Show(); }\n    }\n}\n```\n\n下一步是创建 `UISearchDisplayDelegate` 来响应搜索栏中的输入并设置\
  \ `FilteredElements` 属性，如 Listing 6-9 所示。你必须重写 `ShouldReloadForSearchString()` 方法对源数据（`Elements`\
  \ 集合）执行实际搜索，并填充 `FilteredElements` 搜索结果。该方法必须返回 `true`，这将指示搜索控制器为 `UITableView`\
  \ 调用 `ReloadData()`，从而获取更新后的 `FilteredElements` 集合并显示搜索结果。\n\n![download.eps](img/download_fmt.gif)\n\
  \nListing 6-9: 自定义 `UISearchDisplayDelegate` 类 (`Tables07\\Main.cs`)\n\n```csharp\n\
  class MySearchDisplayDelegate : UISearchDisplayDelegate\n{\n    AppDelegate _appd;\n\
  \n    public MySearchDisplayDelegate(AppDelegate appd)\n    {\n      _appd = appd;\n\
  \    }\n\n    public override bool ShouldReloadForSearchString\n      (UISearchDisplayController\
  \ controller, string forSearchString)\n    {\n    // updated the filtered list on\
  \ the AppDelegate\n      _appd.FilteredElements = _appd.Elements.Where(\n      \
  \    r => r.Name.ToLower().StartsWith(forSearchString.ToLower())\n      ).ToList();\
  \ // sort the filtered list\n      _appd.FilteredElements.Sort((e1, e2) =>\n   \
  \   {\n        return e1.Name.CompareTo(e2.Name);\n      });\n      return true;\
  \ // instructs the controller to call ReloadData()\n    }\n}\n```\n\n最后，在 `Launching`\
  \ 中添加以下行来连接这些类：\n\n`TableView.Source = myTableView...` \n`SearchBar.Delegate = mySearchDelegate...`\n\
  \n\n\n\n\n*   `Geocode`（地理编码）：将搜索字符串（例如地址、商家名称或地标名称）解析为地理位置（`latitude/longitude`）。\n\
  *   `Reverse geocode`（反地理编码）：为特定的 `latitude/longitude` 位置查找“人类可读”的地址。\n\niPhone\
  \ SDK 提供了两个框架用于在你的应用程序中启用地图相关功能：\n\n*   `MapKit`提供了一个用于显示地图图像的控件，允许你添加标记（大头）并对位置进行反地理编码。\n\
  *   `CoreLocation`使用设备支持的所有功能来确定用户的 `location`（位置）和 `heading`（方向，如果可能的话）。\n\n两者结合使用，你可以为\
  \ iPhone 应用程序添加地图和基于位置的服务，而 `MonoTouch` 轻松访问它们提供的所有功能。\n\n## 介绍 MapKit\n`MapKit`\
  \ 框架使用 Google Maps 图像和数据提供地理信息的视觉表示。用户可以访问与他们在网络地图应用中熟悉的道路、卫星和混合地图；而且你可以为给定的 `latitude/longitude`\
  \ 位置查找最近的“真实”地址。地图可以使用与 iPhone OS 相同的拖拽和缩放手势进行导航，无需任何额外的编码。\n\n`MapKit` 框架通过 `MonoTouch.MapKit`\
  \ 命名空间在 `MonoTouch` 中暴露。\n\n## 介绍 CoreLocation\n`CoreLocation` 在多个 iPhone OS 设备上运行，使用多种技术确定位置，并使用较新设备的内置罗针提供设备指向的\
  \ `heading`。使用这些信息，你可以确定用户在哪里以及他们的设备朝哪个方向，并通过监控这些数据的变化来确定他们移动有多快以及旅行了多远。\n\n`CoreLocation`\
  \ 框架通过 `MonoTouch.CoreLocation` 命名空间在 `MonoTouch` 中暴露，处理两种类型的信息：\n\n*   `Location`（位置）\n\
  *   `Heading`（方向）\n\n### Location\n设备的 `location` 用 `latitude`（纬度）和 `longitude`（经度）表示，通常由\
  \ `GPS` 设备确定。消费级 `GPS` 设备以前仅限于笨重的汽车导航系统，但现在小到可以放入手机中！\n\n没有 `GPS` 能力的设备（例如第一代 iPhone\
  \ 和 `iPod Touch` 系列）仍然可以通过手机基站三角测定和 Wi-Fi 网络查找来计算位置信息。这意味着很大比例的 iPhone OS 设备具有某种你可以编写代码的\
  \ `Location Services` 能力。\n\n由于 `CoreLocation` 使用这些不同的技术来确定设备的位置，数据的可用性和准确性会有很大差异。具有\
  \ `GPS` 能力的设备在适当条件下（通常是视野开阔的室外）下）可以确定非常准确的 `latitude/longitude` 位置。当没有 `GPS` 可用且使用基站或无线网络信息时，数据的准确性要低得多。每个不同的数据源都提供不同程度的准确性：从几英尺到几公里不等。启用了位置服务的应用程序应该考虑它们接收到的数据的准确性，以确保不会提供误导性信息。`CoreLocation`\
  \ 每次读取都会提供一个精度估值——以米为单位的位置信息的“误差范围”，这在你的代码中应该被考虑。\n\n有时 `CoreLocation` 将无法提供数据——这可能是由于多个原因造成的：\n\
  \n*   无法获取 `GPS` 读取（用户在室内或在 `GPS` 信号范围之外）。\n*   无法访问其他位置提供程序（例如手机基站或 Wi-Fi 网络信息）。\n\
  *   用户阻止了 `CoreLocation` 向你的应用程序提供数据。为了防止应用程序在用户不知情的情况下访问其位置，操作系统将在向你的应用程序发送数据之前请求他们的许可。在你的应用程序使用的前几次中，会显示图\
  \ 7-2 中的警告；之后，操作系统会记住用户的偏好。\n\n    图 7-2\n\n    ![f0702.tif](img/f0702_fmt.jpg)\n\
  \n*   用户禁用了 `Location Services`。出于隐私或省电考虑，可以在设置中关闭 `Location Services`。在代码中使用位置数据之前，你应该始终检查\
  \ `Location Services` 是否可用以及是否存在任何错误情况（包括用户拒绝访问）。使用 `CLLocationManager` 类的布尔属性 `LocationServicesEnabled`\
  \ 来确定 `Location Services` 是否可用。如果它们被关闭且你的应用程序尝试访问位置数据，将显示图 7-3 中的消息，提示用户重新开启 `Location\
  \ Services`。\n\n    图 7-3\n\n    ![f0703.tif](img/f0703_fmt.jpg)\n\n应用程序代码应该优雅地处理没有位置信息的情况。如果你的应用程序在没有\
  \ `Location Services` 的情况下无法运行，可以在 `Info.plist` 中添加一个条目，以防止它在设备上具备正确能力的情况下安装或运行。表\
  \ 7-1 描述了你可以包含的以控制此行为的条目。请参考第 8 章有关如何配置 `Info.plist` 的详情。\n\n表 7-1： Info.plist 中的\
  \ UIRequiredDeviceCapabilities\n\n| 键 | 描述 |\n| --- | --- |\n| `location-services`\
  \ | 在应用程序运行之前，设备必须支持 `Location Services` 且必须在设置中启用。 |\n| `gps` | 在应用程序运行之前，设备必须支持\
  \ `GPS` 硬件。 |\n| `magnometer` | 在应用程序运行之前，设备必须支持 `compass` 硬件。 |\n\n## iPhone 编程指南\n\
  \n### Heading\n只有较新的 iPhone OS 设备（例如 3GS）具有内置罗盘来提供方向信息。你应该使用 `CLLocationManager`\
  \ 类的 `HeadingAvailable` 属性来确定是否可以访问方向数据，以确保应用程序在没有罗盘的设备上显示相关信息。\n\n![note.ai](img/note_gif)\n\
  \n与真实设备测试相比，模拟器有很多限制。在模拟器中测试 `Location Services` 时，位置将始终为 `37.331689, –122.030731`，这是苹果位于库比蒂的总部。方向将始终返回\
  \ 103.27 度。这意味着某些和位置功能（例如跟踪用户移动以测量速度或距离）只能在设备上测试。\n\n### 使用 CoreLocation\n主要的 `CoreLocation`\
  \ 类如图 7-4 所示。\n\n图 7-4\n\n![f0704.tif](img/f0704_fmt.jpg)\n\n`CLLocationManager`\
  \ 是负责与硬件交互的类，需要 `CLLocationManagerDelegate` 的子类来接收它的“事件”。iPhone SDK 中的代理类和方法的功能与\
  \ .NET 中的事件处理程序类似。代理子类实现某些方法，然后分配给负责与硬件交互的框架类。当数据从硬件可用时，会在你的子类上调用代理方法。\n\n获取位置信息需要时间（可能是几秒），因此使用代理类允许你的\
  \ FinishedLaunching “启动代码”调用 `StartUpdatingLocation()` 然后继续运行，知道当数据可用时，你的代理方法将被调用以便你进行处理。\n\
  \n\n\n\n本章的第一个示例使用 `CLLocationManager` 配合自定义委托类来构建一个在屏幕上显示纬度、经度、朝向和最近地址的应用程序。`CoreLocation`\
  \ 没有任何视觉类，因此要开始使用它，你需要使用 Interface Builder 创建一些按钮和标签。在 `MonoDevelop` 中创建一个名为 `Mapping01`\
  \ 的新 `MonoTouch` iPhone ，并将控件拖到窗口中，如图 7-5 所示（确保将输出连接到正确的控件）。\n\n图 7-5\n\n![f0705.tif](img/f0705_fmt.jpg)\n\
  \n### 在 `Main.cs` 中实现\n\n一旦在 `Interface Builder` 中构建了 `MainWindow.xib`，你就需要将列表 7-1\
  \ 中的代码添加到 `Main.cs` 中。\n\n首先显示的是自定义子类 `MyLocationManagerDelegate`。它通过重写的 `UpdatedLocation`\
  \ 和 `UpdatedHeading` 方法接收更新数据的通知，并使用 `UILabel` 控件显示数据。每个方法随后通过 `StopUpdatingLocation()`\
  \ 和 `StopUpdatingHeading()` 方法告诉 `CLLocationManager` 不再发送任何通知。\n\n`Failed` 方法通过对比\
  \ `CLError` 枚举检查 `NSError.Code` 来决定采取什么行动。如果值为 `Denied`，则你应该始终停止位置管理器尝试进一步更新；然而，其他错误可以忽略，因为操作系统会继续尝试获取读数。\n\
  \n![download.eps](img/download_fmt.gif)\n\n列表 7-1: `CLLocationManagerDelegate` 子类\
  \ (`Mapping01\\Main.cs`)\n\n```csharp\nprivate class MyLocationManagerDelegate:\
  \ CLLocationManagerDelegate\n{\n    private AppDelegate app;\n\n    public MyLocationManagerDelegate\
  \ (AppDelegate appd):base() \n    {\n        app = appd;\n    }\n\n    public override\
  \ void UpdatedLocation (CLLocationManager locationMgr,\n                       \
  \   CLLocation newLocation, CLLocation oldLocation)\n    {\n        app.LocationLabel.Text\
  \ = newLocation.Coordinate.Latitude\n                              + \",\" + newLocation.Coordinate.Longitude;\n\
  \        app.AccuracyLabel.Text = newLocation.HorizontalAccuracy.ToString();\n \
  \       app.TimestampLabel.Text = newLocation.Timestamp.ToString();\n        locationMgr.StopUpdatingLocation();\
  \ // 第一次后停止更新\n        app.ActivityIndicator.StopAnimating();\n        app.AddressButton.Hidden\
  \ = false;\n    }\n\n    public override void UpdatedHeading (CLLocationManager\
  \ locationMgr, CLHeading h)\n    {\n        app.HeadingLabel.Text = h.TrueHeading.ToString();\n\
  \        locationMgr.StopUpdatingHeading();\n        app.ActivityIndicator2.StopAnimating();\n\
  \    }\n\n    public override void Failed (CLLocationManager locationMgr, NSError\
  \ e)\n    {\n        switch (e.Code)\n        {\n            case (int)CLError.LocationUnknown:\n\
  \                app.LocationLabel.Text = \"Failed to get location, still trying\"\
  ;\n                break;\n            case (int)CLError.Denied:\n             \
  \   locationMgr.StopUpdatingHeading ();\n                app.ActivityIndicator.StopAnimating\
  \ ();\n                app.LocationLabel.Text = \"Access to location denied. Stop\
  \ trying.\";\n                break;\n            case (int)CLError.Network:\n \
  \               app.LocationLabel.Text = \"Failed to get location, still trying\"\
  ;\n                break;\n            case (int)CLError.Failure:\n            \
  \    app.LocationLabel.Text = \"Heading not determined (magnetic interference)\"\
  ;\n                break;\n        }\n    }\n}\n```\n\n如果不将委托分配给 `CLLocationManager`\
  \ 并调用 `StartUpdatingLocation()` 和 `StartUpdatingHeading()` 方法，它将无法工作。列表 7-2 展示了如何操作——在\
  \ `TODO:` 注释所在的地方添加上述委托代码。\n\n![download.eps](img/download_fmt.gif)\n\n列表 7-2: 显示位置\
  \ (`Mapping01\\Main.cs`)\n\n```csharp\npublic partial class AppDelegate : UIApplicationDelegate\n\
  {\n    public override void Activated (UIApplication application) {}\n    CLLocationManager\
  \ locationMgr;\n    public override bool FinishedLaunching (UIApplication a, NSDictionary\
  \ o)\n    {\n        locationMgr=new CLLocationManager();\n        locationMgr.Delegate=\
  \ new MyLocationDelegate(this);\n        WhereButton.TouchUpInside += delegate \n\
  \        { \n            // 纬度,经度\n            if (locationMgr.LocationServicesEnabled)\n\
  \            {\n                ActivityIndicator.Hidden = false;\n            \
  \    ActivityIndicator.StartAnimating();\n                locationMgr.StartUpdatingLocation();\n\
  \            }\n            else ShowAlert (\"Not Supported\",\"LocationServicesEnabled==false\"\
  );\n        };\n        HeadingButton.TouchUpInside += delegate \n        { \n \
  \           // 罗针方向\n            if (locationMgr.HeadingAvailable) \n          \
  \  {\n                ActivityIndicator2.Hidden = false;\n                ActivityIndicator2.StartAnimating();\n\
  \                locationMgr.StartUpdatingHeading();\n            }\n          \
  \  else ShowAlert (\"Not Supported\",\"HeadingAvailable==false\");\n        };\n\
  \        window.MakeKeyAndVisible();\n        return true;\n    }\n\n    private\
  \ void ShowAlert (string title, string message)\n    {\n        using (var alert\
  \ = new UIAlertView(title, message, \"OK\", null))\n        { alert.Show(); }\n\
  \    }\n    //TODO: 在此处实现委托\n}\n```\n\n`WhereButton.TouchUpInside` 委托首先检查位置服务是否开启，然后调用\
  \ `StartUpdatingLocation()`。`HeadingButton.TouchUpInside` 为罗盘执行类似的工作。两者都需要在 `AppDelegate`\
  \ 级别声明 `CLLocationManager`。当设备计算出信息后，将调用委托类的 `Updated` 方法，然后将其显示在屏幕上。运行应用程序几秒后将显示位置和朝向（模拟器会显示为\
  \ Cupertino）。\n\n在使用 `CoreLocation` 确定经纬度后，可以使用 `MapKit` 确定“真实”地址。所需的类如图 7-6 所示。图\
  \ 7-6 ![f0705.tif](img/f0705_fmt.jpg)\n\n对 `Main.cs` 需要进行以下更改（同时确保在 `Interface Builder`\
  \ 中有一个 `AddressLabel`）：首先，必须添加 `MapKit` 命名空间：\n\n```csharp\nusing MapKit;\n```\n\
  \n然后在 `AppDelegate` 类中定义实例变量：\n\n```csharp\nMKGeocoder geocoder;\n```\n\n在 `FinishedLaunching`\
  \ 方法中添加以下代码：\n\n```csharp\nAddressButton.TouchUpInside += delegate \n{ \n    //\
  \ 反向地理编码\n    geocoder=new MKGeocoder(locationMgr.Coordinate);\n    geocoder.Delegate=\
  \ new MyGeocoderDelegate(this);\n    geocoder.Start();\n};\n```\n\n并在 `AppDelegate`\
  \ 中声明此委托：\n\n```csharp\nprivate class MyGeocoderDelegate : MKGeocoderDelegate\n\
  {\n    AppDelegate app;\n    public MyGeocoderDelegate (AppDelegate appd)\n    {\n\
  \        app = appd;\n    }\n    public override void FoundWithPlacemark (MKGeocoder\
  \ geocoder, MKPlacemark place)\n    {\n        app.AddressLabel.Text = place.SubThoroughfare\
  \ + \" \" + place.Thoroughfare + \" \" + place.Locality + \" \" + place.AdministrativeArea\
  \ + \" \" + place.Country;\n    }\n    public override void FailedWithError (MKGeocoder\
  \ geocoder, NSError e)\n    {\n        app.AddressLabel.Text = \"Geocode error:\
  \ \" + e.LocalizedDescription;\n    }\n}\n```\n\n\n\n\n当点击 `AddressButton` 时，它会调用\
  \ `MKReverseGeocoder` 的 `Start()` 方法，该方法会启动网络服务请求以对经纬度进行反地理编码。网络服务由框架管理，并使用 Google\
  \ Maps 数据来确定地址。当网络服务返回时，它会调用 `FoundWithPlacemark` 代理方法，该方法会在屏幕上显示信息。\n\n完成后的应用程序如图图\
  \ 7-7 所示，显示了模拟器始终返回的硬编码位置信息。\n\n图 7-7\n\n![f0707.tif](img/f0707_fmt.jpg)\n\n# 跟踪设备移动\n\
  \n`CoreLocation` 不仅仅提供单一的位置读取——它可以配置为在设备移动时持续为应用程序提供位置更新流。你可以通过设置 `CLLocationManager`\
  \ 的以下属性来影响这些更新的频率：\n\n* `DistanceFilter`：设备在生成更新的位置事件之前必须移动的米数。默认值是通知所有事件。\n* `HeadingFilter`：设备在生成更新的指南针读数之前需要旋转的度数。默认值是通知所有事件。\n\
  * `DesiredAccuracy`：你的应用程序所需的位置数据精确级别。如果你只是尝试确定用户所在的城市或国家，那么 `ThreeKilometers` 就足够了；如果你正尝试确定街道地址，则需要可用的\
  \ `Best` 精度。默认值是要求最佳可可用精度，否则使用以下枚举来选择值：\n\n```cs\nenum CLLocationAccuracy \n{\n\
  \   Best = -1,\n   NearestTenMeters = 10,\n   HundredMeters = 100,\n   Kilometer\
  \ = 1000,\n   ThreeKilometers = 3000\n}\n```\n\n![note.ai](img/note_fmt.gif)\n\n\
  `MyLocationManagerDelegate` 和 `MyGeocoderDelegate` 实现为 `AppDelegate` 类内部的“嵌套类型”，这是有原因的。因为在\
  \ Interface Builder 中创建的按钮和标签具有 MonoTouch 在 `MainWindow.xib.designer.cs` 中自动生成的私有属性引用，定义在\
  \ `AppDelegate` 之外的类无法访问它们。嵌套类可以访问其包含类的私有属性（例如，`app.LocationLabel` 和 `app.Addresslabel`），这就是为什么\
  \ MonoTouch 中的代理子类通常声明在使用它们的类内部。\n\n要查看其如何工作，请创建一个新的 MonoTouch iPhone 应用程序 `Mapping02`，并在\
  \ Interface Builder 中创建一个如图 7-8 所示的窗口。\n\n图 7-8\n\n![f0708.tif](img/f0708_fmt.jpg)\n\
  \n与上一个示例一样，需要一个代理子类来处理记录期间的位置数据。在这种情况下，我们更改了 `UpdatedLocation` 方法，将每次读取的内容附加到 `UITextView`\
  \ 中，这样它就会设备移动时在屏幕上持续更新。为了方便在 iPhone 设备有限的屏幕空间阅读，已进行了四舍五入处理。新的代理类如列表 7-3 所示。\n\n\
  ![download.eps](img/download_fmt.gif)\n\n列表 7-3: 使用 `CLLocationManagerDelegate`\
  \ 跟踪位置 (Mapping02\\Main.cs)\n\n```cs\nprivate class MyLocationManagerDelegate: CLLocationManagerDelegate\n\
  {\n   private AppDelegate app;\n   int updateCount = 0;\n   public LocationManagerDelegate(AppDelegate\
  \ appd):base() {\n   {\n      app = appd;\n   }\n   public override void UpdatedLocation\
  \ (CLLocationManager locManager,\n                                        CLLocation\
  \ newLocation, CLLocation oldLocation)\n   {\n      var latLong = Math.Round(newLocation.Coordinate.Latitude,4)\n\
  \             + \",\" + Math.Round(newLocation.Coordinate.Longitude,4);\n      app.LocationLabel.Text\
  \ = latLong;\n      app.AccuracyLabel.Text = newLocation.HorizontalAccuracy.ToString();\n\
  \      app.TimestampLabel.Text = newLocation.Timestamp.ToString();\n      var dist\
  \ = 0.0;\n      if (oldLocation != null)\n      {\n         dist = Math.Round(newLocation.Distance(oldLocation),1);\n\
  \      }\n      var text = \"Location: \" + latLong + Environment.NewLine;\n   \
  \   text += \"Accuracy: \" + newLocation.HorizontalAccuracy + Environment.NewLine;\n\
  \      text += dist + \"m from reading\" + Environment.NewLine;\n      text += newLocation.Timestamp\
  \ + Environment.NewLine;\n      text += \"__________\" + Environment.NewLine;\n\
  \      app.HistoryText.Text += text;\n   }\n   public override void UpdatedHeading\
  \ (CLLocationManager locManager, CLHeading newHeading)\n   {\n      app.HeadingLabel.Text\
  \ = newHeading.TrueHeading.ToString();\n      app.AccuracyLabel.Text = Math.Round(newHeading.HeadingAccuracy,2).ToString();\n\
  \   }\n   public override void Failed (CLLocationManager locManager, NSError e)\n\
  \   {\n      switch (e.Code)\n      {\n         case (int)CLLocation.LocationUnknown:\n\
  \            app.LocationLabel.Text = \"Failed to get location, still trying\";\n\
  \            break;\n         case (int)CLLocation.Denied:\n            locationMgr.StopUpdatingHeading();\n\
  \            app.ActivityIndicator.StopAnimating();\n            app.LocationLabel.Text\
  \ = \"Access to location denied. Stop trying.\";\n            break;\n         case\
  \ (int)CLLocation.Network:\n            app.LocationLabel.Text = \"Failed to get\
  \ location, still trying\";\n            break;\n         case (int)CLLocation.HeadingFailure:\n\
  \            app.LocationLabel.Text = \"Heading could not be determined (magnetic\
  \ interference)\";\n            break;\n      }\n   }\n}\n```\n\n`AppDelegate` 类的代码如列表\
  \ 7-4 所示，除了用于启动和停止位置更新的按钮处理器外，还有设置 `DesiredAccuracy`、`DistanceFilter` 和 `HeadingFilter`\
  \ 属性的行。\n\n![download.eps](img/download_fmt.gif)\n\n列表 7-4: 启动和停止位置更新 (Mapping02\\\
  Main.cs)\n\n```cs\npublic partial class AppDelegate : UIApplicationDelegate \n{\
  \ \n   public override void Activated (UIApplication application) {}\n   CLLocationManager\
  \ locationMgr;\n   public override bool FinishedLaunching(UIApplication a, NSDictionary\
  \ o)\n   {\n      button.TouchUpInside += (sender, e) =>\n      {\n         locationMgr.StartUpdatingLocation();\n\
  \         if (locationMgr.HeadingAvailable)\n         {\n            locationMgr.StartUpdatingHeading();\n\
  \         }\n         button.Hidden = true; stopButton.Hidden = false;\n      };\n\
  \      button.TouchUpInside += (sender, e) =>\n      {\n         locationMgr.StopUpdatingLocation();\n\
  \         locationMgr.StopUpdatingHeading();\n         button.Hidden = false; stopButton.Hidden\
  \ = true;\n      };\n      locationMgr = new CLLocationManager();\n      locationMgr.DesiredAccuracy\
  \ = 10;\n      locationMgr.DistanceFilter = 10;\n      locationMgr.HeadingFilter\
  \ = 1;\n      locationMgr.Delegate = new MyLocationManagerDelegate(this);\n    \
  \  window.MakeKeyAndVisible();\n      return true;\n   }\n}\n```\n\n\n\n\n\n此示例强调了使用位置数据时的一个问题——读取值的准确性存在差异，以及应用程序应该如何解释这些值。请注意使用\
  \ `newLocation.Distancefrom(oldLocation)` 报告距离的代码，它计算并显示了当前位置与上次记录位置之间的距离（单位为米）。直观上，这似乎是跟踪用户移动距离的一种简单方法（例如，在应用程序运行期间他们步行或行驶了多远）。\n\
  \n然而，并没有那么简单！当在支持 GPS 的设备上测试此示例时，前几次读取结果可能像表 7-2 所示，即使设备处于完全静止状态。\n\n### 表 7-2：\
  \ Mapping02 示例输出\n\n| 位置（舍五入） | 准确度 | 距离上次读取的距离（舍五入） |\n| --- | --- | --- |\n| –33.8898,151.249\
  \ | 2917 | 0 |\n| –33.8909,151.251 | 2283 | 227.2 |\n| –33.8907,151.2486 | 162 |\
  \ 223.9 |\n| –33.8911,151.2488 | 76 | 43.9 |\n| –33.8911,151.2497 | 17 | 7.4 |\n\
  \n发生了什么？代码正在收到了多个准确度水平不同的通知，这影响了报告的位置。随着准确度的提高，位置（可能）会更接近设备的实际位置。尽管设备没有移动，报告的位置仍在移动。除非你的代码具有处理不同准确度的某种智能逻辑，否则在在这种情况下，它可能会告诉用户他已经旅行了\
  \ 502.4 米，而实际上他一寸路都没动！\n\n解决此问题的策略包括：\n\n*   将距离和准确度过滤器设置为您所需的详细程度。\n*   评估位置数据的准确性，以查看其是否符合您的要求：如果您需要高精度的位置，可能可以忽略不准确的读取值。\n\
  *   将位置数据与最近的历史报告进行比较，以确定它们是否在合理范围内（特别是对于经过的时间段）。\n*   向用户传达误差范围（例如内置地图应用程序中在“当前位置”标记周围显示的蓝色不确定性“光晕”）。\n\
  *   检查位置报告上的 `Timestamp`：通常返回的第一个位置将是之前的 `CoreLocation` 请求的缓存。如果用户刚下飞机就打开了手机，而缓存的位置数据来自另一个城市或国家，这可能会导致明显的“错误”。\n\
  \n## 使用 MapKit\n\n`MapKit` 框架由 `MKMapView` 视觉控件和若干个支持类组成，这些类用于操作和对地图显示进行标注。图 7-10\
  \ 显示了最常用的 MapKit 类。\n\n图 7-10\n\n![f0710.tif](img/f0710_fmt.jpg)![note.ai](img/note_fmt.gif)\n\
  \n由于 `MapKit` 使用的数据（包括图像和反向地理编码服务）由 Google 提供，因此在应用程序中使用这些数据必须遵守某些条款。Apple 开发者网站包含以下信息：\n\
  \n**重要**：MapKit 框架使用 Google 服务提供地图数据。使用此类类及相关接口将受到 Google Maps/Google Earth API\
  \ 服务条款的约束。您可以在 [`code.google.com/apis/maps/iphone/terms.html`](http://code.google.com/apis/maps/iphone/terms.html)\
  \ 找到这些服务条款。\n\n## 显示地图\n\n`MKMapView` 控件提供了一个复杂的用户界面，无需额外编码即可在设备上呈现映射数据。一旦将 `MKMapView`\
  \ 控件放置在 Interface Builder 的窗口中，您的应用程序立即具备了显示、和平和平放 Google Maps 图像以及显示设备当前位置的能力（当然是使用\
  \ `CoreLocation`）。\n\n唯一的注意事项，由于地图图像是从互联网下载的，使用 `MKMapView` 需要网络连接（蜂窝数据或无线网络）。控件本身会缓存图像，因此当设备离线时，它将显示最近查看位置的地图数据，但无法下载新的地图数据。这对于\
  \ iPod Touch 上的应用程序特别有用，因为它们不太可能持续联网。\n\n`MKMapView` 有许多控制用户如何与其交互的属性：\n\n*   `UserInteractionEnabled`：设置为\
  \ `false` 时，地图不响应任何用户输入；它不能滚动或缩放，且大钉（包括当前用户位置）在触摸时不会显示弹出气泡。此属性覆盖了 `ZoomEnabled`\
  \ 和 `ScrollEnabled`。\n*   `ZoomEnabled`：设置为 `false` 时，用户无法通过双指缩放放大或缩小地图，尽管滚动和大钉弹出气泡仍然有效。\n\
  *   `ScrollEnabled`：设置为 `false` 时，用户无法在地图上滚动（即无法更改代码中设置的任何中心点）。缩放和大钉弹出气泡仍然工作。\n\
  *   `ShowsUserLocation`：这是一个简单的属性，如果可以确定位置，则会在地图上显示蓝点（以及“准确性光晕”）。地图将居中并缩放到该位置。可以通过\
  \ Interface Builder 设置，也可以在 `MKMapView` 实例上程序化设置。\n*   `MapType`：这是一个枚举，定义了可用的地图图像类型；Internet\
  \ 用户所熟悉的三个选项：\n    *   `Standard`：道路地图\n    *   `Satellite`：航空图像\n    *   `Hybrid`：叠加了道路的航空图像\n\
  \n下面的 `MapKit` 示例演示了这些属性。创建一个 MonoTouch 应用 `Mapping03` 并使用 Interface Builder 将 `MKMapView`\
  \ 和 `UISegmentedControl` 拖入窗口，如图 7-11 所示。\n\n然后将列表 7-5 中的代码添加到 `Main.cs` 中，以连接地图类型并设置上述属性。\n\
  \n![download.eps](img/download_fmt.gif)\n\n列表 7-5: 简单的地图显示 (Mapping03\\Main.cs)\n\
  \n```csharp\npublic partial class AppDelegate : UIApplicationDelegate\n{\n  public\
  \ override void OnActivated (UIApplication application) {}\n\n  public override\
  \ bool FinishedLaunching (UIApplication a, NSDictionary o) \n  {\n      MapType.ValueChanged\
  \ += delegate \n      {\n        if (MapType.SelectedSegment == 0)\n           \
  \ Map.MapType = MKMapType.Standard;\n        else if (MapType.SelectedSegment ==\
  \ 1)\n            Map.MapType = MKMapType.Satellite;\n        else if (MapType.SelectedSegment\
  \ == 2)\n            Map.MapType = MKMapType.Hybrid;\n      };\n      Map.ShowsUserLocation\
  \ = true;\n      Map.MapType = MonoTouch.MapType.Standard; // Hybrid | Satellite\n\
  \      Map.Region = new MKCoordinateRegion(\n        new CLLocation2D(37.331689,\
  \ -122.030731),\n        new MKCoordinateSpan(0.5,0.5));\n      Map.ZoomEnabled\
  \ = true; // false cannot zoom\n      Map.ScrollEnabled = true; // false cannot\
  \ scroll\n      Map.UserInteractionEnabled = true; // false cannot even click on\
  \ pin\n      window.MakeKeyAndVisible();\n      return true;\n  }\n}\n```\n\n\n\n\
  \n在地图上添加大头标记需要创建 `MKAnnotations` 并将其添加到 `MKMapView` 中。当使用 Objective-C 的 `MapKit`\
  \ 框架时，`MKAnnotation` 是一个协议（protocol）——这与 `C#` 中的接口类似，不同之处协议可以包含可选成员。在 MonoTouch\
  \ 中，像 `MKAnnotation` 这样的协议被建模为抽象类，以便在应用程序中进行实现。对于 `MKAnnotation`，需要三个属性：`Coordinate`、`Title`\
  \ 和 `Subtitle`。代码列表 7-6 中的子类添加了私有备份变量和一个用于设置这些变量的构造函数；然而其他的实现可能会有所不同。\n\n![download.eps](img/download_fmt.gif)\n\
  \nListing 7-6: `MKAnnotation` 子类 (`Mapping04\\Main.cs`)\n\n```csharp\npublic class\
  \ MyAnnotation : MKAnnotation\n{\n    private CLLocationCoordinate2D coordinate;\n\
  \    private string title, subtitle;\n    public override CLLocationCoordinate2D\
  \ Coordinate\n    {\n        get { return coordinate; }\n    }\n    public override\
  \ string Title\n    {\n        get { return title; }\n    }\n    public override\
  \ string Subtitle\n    {\n        get { return subtitle; }\n    }\n    public MyAnnotation(CLLocationCoordinate2D\
  \ l, string t, string s)\n    {\n        coordinate = l;\n        title = t;\n \
  \       subtitle = s;\n    }\n}\n```\n\n要尝试 `MyAnnotation`，请创建一个新的 MonoTouch 应用程序\
  \ `Mapping04`（已为此用例进行了更新），使用 Interface Builder 在图 7-12 中绘制控件，并连接 `MKMapView` 和两个\
  \ `UIButtons` 的输出端（outlets）。\n\n将代码列表 7-7 中的代码添加到 `Main.cs` 中，并在 `//TODO:` 注释指示的地方包含\
  \ `MyAnnotation` 类。代码的关键元素有：\n\n*   硬编码了一个 `MyAnnotation` 对象列表以供应用程序使用。该列表可以是 Web\
  \ 服务调用的结果、应用程序中自定义的数据集，或者你可以找到的任何其他位置数据源。\n*   `AddButton.TouchUpInside` 调用 `Map.AddAnnotationObject()`，导致大头标记出现在地图上。\n\
  *   `CenterButton.TouchUpInside` 调用 `Map.SetCenterCoordinate()`，使地图移动到显示标记中心的位置。第二个参数会导致更改产生动画；如果设置为\
  \ `false`，地图将会在新位置重新绘制。\n*   `Map.GetViewForAnnotation` 允许在标记出现在地图之前对其自定义标记和相关的气泡（callout）。注意该委托是使用等号赋值的，而不是像按钮委托那样使用加等号（+=）附加。这是一个重要的区别：`GetViewForAnnotation`\
  \ 是 `MKMapView` 类的属性，而不是事件。\n*   自定义了两个 `UserLocation` 属性，更改了触摸蓝色 `Current Location`（当前位置）标记时显示的文本。\n\
  \n图 7-12\n\n![f0712.tif](img/f0712_fmt.jpg)![download.eps](img/download_fmt.gif)\n\
  \nListing 7-7: 标记地图 (`Mapping04\\Main.cs`)\n\n```csharp\npublic partial class AppDelegate\
  \ : UIApplicationDelegate\n{\n    // 此方法在 iPhoneOS 3.0 中是必须\n    public override\
  \ void OnActivated (UIApplication application) {}\n    List<MyAnnotation> pins =\
  \ new List<MyAnnotation>();\n    public override bool FinishedLaunching (UIApplication\
  \ a, NSDictionary o)\n    {\n        MapType.ValueChanged += delegate\n{\n     \
  \       if (MapType.Segment == 0)\n                Map.MapType = MKMapType.Standard;\n\
  \            else if (MapType.Segment == 1)\n                Map.MapType = MKMapType.Satellite;\n\
  \            else if (MapType.Segment == 2)\n                Map.MapType = MKMapType.Hybrid;\n\
  \        };\n        int pinCount = 0;\n        // initialize Pins\n        pins.Add(new\
  \ MyAnnotation(CLLocationCoordinate2D(37.2, -22.4), \"Annotation#1\", \"Red pin\"\
  ));\n        pins.Add(new MyAnnotation(CLLocationCoordinate2D(37.6, -22.2), \"Annotation#2\"\
  , \"Red pin\"));\n        pins.Add(new MyAnnotation(CLLocationCoordinate2D(37.4,\
  \ -22.0), \"Annotation#3\", \"Red pin\"));\n        AddButton.TouchUpInside += delegate\n\
  { // 添加一个标记\n            if (pinCount < pins.Count)\n                Map.AddAnnotationObject(pins[pinCount++]);\n\
  };\n        CenterButton.TouchUpInside += delegate\n{ // 导航到标记位置\n            if\
  \ (pinCount > 0)\n                Map.SetCenterCoordinate(pins[pinCount-1].Coordinate,\
  \ true);\n};\n        Map.GetViewForAnnotation = delegate (MKMapView mapView, NSObject\
  \ annotation)\n{\n            if (annotation is MKUserLocation) return null; //\
  \ line 1\n            var mapAnnotation = (MyAnnotation)annotation; // line 2\n\
  \            var pinView = new MKPinAnnotationView(mapAnnotation,\"mypin\"); //\
  \ line 3\n            pinView.AnimatesDrop = true;\n            pinView.CanShowCallout\
  \ = true;\n            return pinView; // line 8\n        };\n        Map.Region\
  \ = MKCoordinateRegion(CLLocationCoordinate2D(37.3169, -122.03211), MKCoordinateSpan(.05,\
  \ .05));\n        window.MakeKeyAndVisible();\n        return true;\n    }\n}\n\
  ```\n\n\n\n\n在之前的代码中设置区域（Region）使用了 `MKCoordinateSpan` 结构体，这等于设置“缩放级别”。传递给 `MKCoordinateSpan`\
  \ 的单位是经纬度——在赤道附近，1 度纬度或 1 度经度大约是 111 公里/70 英里。随着你靠近极点，经度会收敛，经度线之间的距离会缩小，而纬度之间的距离保持大致不变。你不需要为屏幕计算精确的纵宽高比，因为地图控件将自动尝试适应你请求的跨度（span），并将其匹配到最近的可用“实际”缩放级别。例如，列表\
  \ 7-5 中的代码使用了 `MKCoordinateSpan(0.5,0.5)`；然而，在地图绘制后查询 `Map.Region.Span.LatitudeDelta`\
  \ 和 `LongitudeDelta` 发现实际值为 `0.88447,0.87890`。这大约是 95 公里/61 英里的可视区域，与你在屏幕上看到的非常接近。\n\
  \n从另一个角度看，流行的基于 Web 的地图工具通常将它们的“最远缩放”显示视为级别 1，并每一个缩放级别将视口大小减半。表 7-3 显示了这些级别与你可以传递给\
  \ `MKCoordinateSpan` 的度之间的粗略对比——注意级别 13 是如何与前文描述的地图分辨率 `(0.5, 0.5)` 非常接近的。\n\n表\
  \ 7-3: 与 Web 地图缩放级别的粗略对比\n\n![](img/table0703.gif)\n\n图 7-14 显示了使用这些参数 (180, 180),\
  \ (10, 10), (0.5, 0.5), (0.02, 0.02) 和 (0.00275, 0.00275) 的地图。\n\n图 7-14\n\n![f0714.tif](img/f0714_fmt.jpg)\n\
  \n你可以使用上表来选择一个合适的缩放级别来显示单个点，或者如果你有一组位置，可以计算一个合适的 `Span`。将 `CenterButton.TouchUpInside`\
  \ 委托替换为以下代码，以计算一个包含地图上放置的所有当前 `Annotations`（注释/标记）的合适 `Span`：\n\n![download.eps](img/download_fmt.gif)\n\
  \n```csharp\n// 针对一组位置进行居中\n\nCenterButton.TouchUpInside += delegate\n{  // 预期至少有一个\
  \ Annotation\n\n    var userWasVisible = Map.ShowsUserLocation;\n\n    Map.ShowsUserLocation\
  \ = false; // 忽略蓝色光标点\n\n    // 从尽可能最大的视口开始\n    var tl = new CLLocationCoordinate2D\
  \ (-90,180); // 左上\n    var br = new CLLocationCoordinate2D (90,-180); // 右下\n \
  \   foreach (var an in Map.Annotations)\n    {  // 逐位缩小视口\n        tl.Longitude\
  \ = Math.Min(tl.Longitude, an.Coordinate.Longitude);\n        tl.Latitude = Math.Max(tl.Latitude,\
  \ an.Coordinate.Latitude);\n        br.Longitude = Math.Max(br.Longitude, an.Coordinate.Longitude);\n\
  \        br.Latitude = Math.Min(br.Latitude, an.Coordinate.Latitude);\n    }\n\n\
  \    var center = new CLLocationCoordinate2D\n    {  // 将范围除以二得到中心点\n      Latitude\
  \ = tl.Latitude - (tl.Latitude - br.Latitude) * 0.5\n    , Longitude = tl.Longitude\
  \ + (br.Longitude - tl.Longitude) * 0.5\n    };\n\n    var span = new MKCoordinateSpan\n\
  \    {  // 计算跨度，留出 20% 的边距，大钉不会位于边缘\n      LatitudeDelta = Math.Abs(tl.Latitude\
  \ - br.Latitude) * 1.2\n    , LongitudeDelta = Math.Abs(br.Longitude - tl.Longitude)\
  \ * 1.2\n    };\n    var region = new MKCoordinateRegion { Center = center, Span\
  \ = span };\n    region = Map.RegionThatFits(region); // 调整缩放级别\n    Map.SetRegion(region,\
  \ true); // 动画\n    Map.ShowsUserLocation = userWasVisible;\n};\n```\n`Mapping04a.cs`\n\
  \n这些数学原理非常浅俗易懂——最后你计算了一个中心点和一个由最外层 `Annotations` 边界定义的矩形（加上 20% 的缓冲区以防钉被遮挡）。`RegionThatFits`\
  \ 方法获取这些信息并进行调整，返回一个适合地图视图的 `Region`，然后将其提供给 `SetRegion` 以动画形式改变视图。\n\n![note.ai](img/note_fmt.gif)\n\
  \n用于寻找合适缩放级别和边界框的算法灵感来自该网站上的 Objective-C 示例：[`codisllc.com/blog/zoom-mapview-to-fit-annotations`](http://codisllc.com/blog/zoom-mapview-to_fit-annotations)\n\
  \n\n\n```csharp\nget { return color; }\n}\n\npublic MyAnnotation(CLLocationCoordinate2D\
  \ l, string t, string s, MKPinAnnotationColor c)\n{\n    coordinate = l;\n    title\
  \ = t;\n    subtitle = s;\n    color = c;\n}\n}\n```\n\n然后用颜色值初始化示例大头——目前 `MKPinAnnotationColor`\
  \ 枚举中仅支持三种颜色：紫色、绿色和红色。\n\n```csharp\npins.Add(new MyAnnotation(new CLLocationCoordinate2D(37.2,\
  \ -122.4), \"Annotation #1\", \"Purple pin\", MKPinAnnotationColor.Purple));\npins.Add(new\
  \ MyAnnotation(new CLLocationCoordinate2D(37.6, -122.2), \"Annotation #2\", \"Green\
  \ pin\", MKPinAnnotationColor.Green));\npins.Add(new MyAnnotation(new CLLocationCoordinate2D(37.4,\
  \ -122.0), \"Annotation #3\", \"Red pin\", MKPinAnnotationColor.Red));\n```\n\n\
  最后，在 `GetViewForAnnotation` 委托中设置颜色，现在代码应该会在地图上显示三个不同颜色的大头。\n\n```csharp\npinView.PinColor\
  \ = mapAnnotation.Color;\n```\n\n`Mapping05\\Main.cs`\n\n## 性能优化的注解\n\n之前的示例仅向地图上添加了三个注解，因此不太可能引起内存压力或性能问题。然而，某些应用程序将使用几十甚至数百个注解，在这些情况下，如果在任何时刻只有一小部分显示在屏幕上，你就不希望创建那么多视图。\n\
  \nMapKit 通过仅在注释需要显示在屏幕上时调用 `Map.GetViewForAnnotation` 来解决这一问题。如果你的数据包含大量注解，你可以安全地将它们全部添加到\
  \ `MKMapView` 中 —— 它只会在需要时才尝试渲染它们（即当它们的 `Coordinate` 落在当前的 `MKMapRegion` 范围内）。随着地图的平移和缩放，某些注释会离开视线，而另一些则会进入视线——MapKit\
  \ 还提供了一种重用 `MKPinAnnotationViews` 的机制（与第 6 章中 `UITableView` 重用单元格的方式非常；并且类似于 Windows\
  \ Presentation Foundation 中的虚拟化列表控件）。\n\n[Listing 7-9] 中更新的 `GetViewForAnnotation`\
  \ 代码展示了其工作原理。\n\n![download.eps](img/download_fmt.gif)\n\n[Listing 7-9]: GetViewForAnnotation\
  \ 中的可重用注解 (`Mapping05\\Main.cs`)\n\n```csharp\nMap.GetViewForAnnotation = delegate\
  \ (MKMapView mapView, NSObject annotation)\n{\n    if (annotation is MKUserLocation)\
  \ return null; // 第 1 行\n    MyAnnotation ma = annotation as MyAnnotation; // 第\
  \ 2 行\n    var pinView = mapView.DequeueReusableAnnotation(\"mypin\"); // 第 3 行\n\
  \    if (pinView == null) // 第 4 行\n    { // 创建具有相同标识符的新对象，传入注释\n        pinView\
  \ = new MKPinAnnotationView(ma, \"mypin\"); // 第 5 行\n    }\n    else \n    { //\
  \ 重用具有 'mypin' 标识符的 MKPinAnnotationView\n        pinView.Annotation = annotation;\
  \ // 第 7 行\n    }\n    pinView.AnimatesDrop = true; // 第 8 行\n    pinView.CanShowCallout\
  \ = true;\n    pinView.PinColor = ma.Color;\n    return pinView;\n};\n```\n\n与之前的\
  \ `GetViewForAnnotation` 实现相比，变化如下：\n\n* 第 3 行显示 `DequeueReusableAnnotation` 使用标识符\
  \ \"mypin\" 从 `MKMapViews` 的未使用对象队列中请求现有的 `MKPinAnnotationView`。\n* 第 5 行显示如果返回空，则创建一个新对象（意味着没有可重用的对象）。将标识符\
  \ \"mypin\" 传递给新对象：这就是 `MKMapView` 区分不同类型视图的方式。\n* 第 7 行显示要分配给重用对象的注释。\n* 第 8、9\
  \ 和 10 行在将视图返回地图显示之前，对视图设置了属性。\n\n为了符合 Apple 的用户界面指南，大多数地图应用程序都使用标准的 `MKAnnotationView`\
  \ 来放置标记，这意味着你可以使用单一重用标识符从队列中检索这些对象。如果你创建了 `AnnotationView` 自己的子类，你应该为每种类型的视图使用不同的重用字符串，否则你可能会得到意外的结果。代码将检查注释的某些属性以确定需要什么视图，然后在尝试创建对象之前使用正确的标识符调用\
  \ `DequeueReusableAnnotation`。\n\n### 使用地理编码功能\n\n地理编码功能并不是由任何内置框架直接提供的，但它是位置感知应用程序的一项实用功能。MonoTouch\
  \ 的巨大优势之一是海量的现有 .NET 代码和示例，你可以将它们带到 iPhone OS。[Listing 7-9] 中简单的 `Geocoder` 类使用了许多熟悉的\
  \ .NET 库，如 `System.Xml`、`System.IO` 和 `System.Net`。要实现地理编码示例，创建一个新的 MonoTouch  Mapping06，并将\
  \ [Listing 7-10] 中的代码添加到新的 C# 文件 `Geocoder.cs` 中。\n\n![download.eps](img/download_fmt.gif)\n\
  \n[Listing 7-10]: 使用 Google API 对地址地理编码 (`Mapping06\\Geocoder.cs`)\n\n```csharp\n\
  /// <summary>\n/// 服务文档\n/// http://google.com/apis/maps/documentation/geocoding/\n\
  /// </summary>\npublic class Geocoder\n{\n    /// <summary>\n    /// 注册 Google Maps\
  \ 密钥以通过\n    /// http://google.com/apis/maps/signup.html\n    /// </summary>\n \
  \   public Geocoder(string key)\n    {\n        _GoogleMapsKey = key;\n    }\n \
  \   private string _GoogleMapsKey = \"\";\n    private string xmlString = \"\";\n\
  \    public bool LocateGoogle(string query, out CLLocation2D result)\n    {\n  \
  \      string url = \"http://google.com/maps/geo?q={0}&output=xml&key=\" + _GoogleMapsKey;\n\
  \        url = String.Format(url, query);\n        XmlNode coords = null;\n    \
  \    result = new CLLocation2D(0,0);\n        try\n        {\n            xmlString\
  \ = GetUrl(url);\n            XmlDocument xd = new XmlDocument();\n            xd.LoadXml(xmlString);\n\
  \            XmlNamespaceManager xnm = new XmlNamespaceManager(xd.NameTable);\n\
  \            coords = xd.GetElementsByTagName(\"coordinates\")[0];\n        }\n\
  \        catch { }\n        string gl = \"\";\n        if (coords != null)\n   \
  \     {\n            string[] coordinateArray = coords.InnerText.Split(',');\n \
  \           if (coordinateArray.Length >= 2)\n            {\n                result\
  \ = new CLLocation2D(Convert.ToDouble(coordinateArray[1].ToString()), Convert.ToDouble(coordinateArray[0].ToString()));\n\
  \                return true;\n            }\n        }\n        return false;\n\
  \    }\n    private static string GetUrl(string url)\n    {\n        string result\
  \ = string.Empty;\n        System.Net.WebClient Client = new WebClient();\n    \
  \    using (Stream strm = Client.OpenRead(url))\n        {\n            StreamReader\
  \ sr = new StreamReader(strm);\n            result = sr.ReadToEnd();\n        }\n\
  \        return result;\n    }\n}\n```\n\n要构建用户界面，使用 Interface Builder 在 `MainWindow.xib`\
  \ 中添加一个 `UISearchBar` 和 `MKMapView`（见 [图 7-17]），并创建必要的输出。\n\n[图 7-17] ![f0717.tif](img/f0717_fmt.jpg)\n\
  \n\n\n\n\n就像 `CLLocationManagerDelegate` 一样，搜索栏需要一个代理子类来处理它生成的事件。Listing 7-11 并不是\
  \ `UISearchBarDelegate` 的完整实现，但它实现了启用地图搜索所需的行为。它使用自定义的 `Geocoder`（Listing 7-10）从\
  \ Google Web 服务检索纬度和经度，并使用来自 Listing 7-6 的 `MyAnnotation` 子类将位置添加到地图上。一旦 `Geocoder`\
  \ 类返回了一个位置，你就可以将地图中心置于该位置，并添加一个标记来指示该点。\n\n![download.eps](img/download_fmt.gif)\n\
  \n### Listing 7-11:  UISearchBarDelegate (Mapping06\\Main.cs)\n\n```csharp\npublic\
  \ class MySearchBarDelegate : UISearchBarDelegate\n{\n    private AppDelegate app;\n\
  \n    private MyAnnotation lastResult;\n\n    public MySearchBarDelegate (AppDelegate\
  \ a)\n    {\n        app = a;\n    }\n\n    public override void SearchButtonClicked\
  \ (UISearchBar searchBar)\n    {\n        var g = new Geocoder(GoogleMapsKey);\n\
  \        CLLocationCoordinate2D location;\n        if (g.LocateGoogle(searchBar.Text,\
  \ out location))\n        {\n            if (lastResult != null)\n             \
  \   app.Map.RemoveAnnotation(lastResult);\n            app.Map.SetCenterCoordinate(location,true);\n\
  \            var pin = new MyAnnotation(\n                              location,\n\
  \                              searchBar.Text,\n                              location.Latitude\
  \ + \",\" + location.Longitude\n                            );\n            app.Map.AddAnnotationObject(pin);\n\
  \            lastResult = pin;\n        }\n        else\n        {\n           \
  \ using (var alert = new UIAlertView(\"Not found\",\n            \"No match found\
  \ for \" + searchBar.Text, null, \"OK\", null))\n            {\n               \
  \ alert.Show();\n            }\n        }\n    }\n}\n```\n\n将 Listing 7-12 输入到 `Main.cs`\
  \ 中。注意，要使用此类你需要在 [`code.google.com/apis/maps/signup.html`](http://code.google.com/apis/maps/signup.html)\
  \ 注册 Google Maps Key。当你收到 Key 后，将其粘贴到代码中的相应位置。\n\n![download.eps](img/download_fmt.gif)\n\
  \n### Listing 7-12: 地理编码 (Mapping06\\Main.cs)\n\n```csharp\npublic partial class\
  \ AppDelegate : UIApplicationDelegate \n{\n    // 此方法在 iPhoneOS 3.0 中是要求的\n    public\
