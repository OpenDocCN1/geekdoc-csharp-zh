    \ |  | ![image](img/chapter_title_corner_decoration_right.png) |\n\n![image](img/chapter_title_above.png)\n\
    \n# 结论\n\n![image](img/chapter_title_below.png)\n\n在本章中，我们简要介绍了 C# 中的数组。我们学习了如何��在\
    \ C# 中创建和初始化数组，以及如何访问数组元素。在下一章中，我们将开始讨论一种更高级的编程概念，即 `Functions`（函数）。祝编码愉快！！！\n\
    \n| ![image](img/chapter_title_corner_decoration_left.png) |  | ![image](img/chapter_title_corner_decoration_right.png)\
    \ |\n\n![image](img/chapter_title_above.png)\n\n# 第 8 章 – C# 中的函数\n\n![image](img/chapter_title_below.png)\n\
    \n函数（也称为方法）是任何编程语言中最重要的构造结构之一。函数用于执行一段需要重复执行且具有自包含逻辑的代码。\n\n考虑这样一种场景：你必须计算某个金额的税率。百分比和金额都由用户输入。你需要重复执行此任务。一种方法是编写逻辑，在每次需要执行此任务时计算该金额的税。这可能非常繁琐。如果你每天需要执行\
    \ 1000 次怎么办？你将花费整整的时间写这样的逻辑。更好的方法是将此类逻辑封装在函数内部，然后实现一种执行该函数及其内部逻辑的机制。\n\n在本章中，我们将看到\
    \ C# 函数是如何实现的，我们如何从函数中传递和检索数据，以及不同类型的函数有哪些。\n\n| ![image](img/chapter_title_corner_decoration_left.png)\
    \ |  | ![image](img/chapter_title_corner_decoration_right.png) |\n\n![image](img/chapter_title_above.png)\n\
    \n# 声明函数\n\n![image](img/chapter_title_below.png)\n\n声明函数的语法如下：\n\n```text\nmodifier\
    \ return-type function-name(p1, p2, p3 ...)\n{\n    //function logic\n}\n```\n\
    \n––––––––\n\n![image](img/scene_break.png)\n\n要声明一个函数，首先必须指定函数的修饰符或访问类型。我们将在后面的章节中详细学习访问修饰符，现在我们将使用\
    \ `public` 作为访问修饰符。`public` 访问修饰符指定我们的函数可以从任何地方访问。接下来，我们需要定义函数的返回类型。返回类型指定了函数返回的值类型。接下来，我们需要指定函数名称，后面跟着左括号和右括号。在括号内部，我们传递参数。参数基本上用于将数据传递给函数。之后，在花括号内指定函数体，其中包含了将由函数执行的逻辑。\n\
    \n这里需要说明的是，你已经有一个名为 `Main` 的函数，其返回类型为 `void`（无），它接受一个 `string` 数组作为参数，且类型为 `static`。静态函数是指不需要通过类的对象调用的函数。我们将在后面的章节中详细介绍对象和类。现在，只需记住，要直接调用函数而不使用对象名，我们必须使用\
    \ `static` 关键字。\n\n让我们定义一个简单的函数，它不返回内容，没有参数，只需在屏幕上显示一些文本。\n\n```csharp\nusing\
    \ System;\nusing System.Collections.Generic;\nusing System.Linq;\nusing System.Text;\n\
    using System.Threading.Tasks;\n\nnamespace MyProgram\n{\n    class Program\n \
    \   {\n        static void Main(string[] args)\n        {\n            Console.ReadKey();\n\
    \        }\n\n        public static void ShowText()\n        {\n            Console.WriteLine(\"\
    I am inside a function\");\n        }\n    }\n}\n```\n\n在上面的脚本中，我们创建了一个名为 `ShowText()`\
    \ 的函数，它如 `Console.WriteLine()` 函数所示简单地在屏幕上打印一些文本。返回类型为 `void`，且函数是 `static` 和\
    \ `public` 的。\n\n| ![image](img/chapter_title_corner_decoration_left.png) |  |\
    \ ![image](img/chapter_title_corner_decoration_right.png) |\n\n![image](img/chapter_title_above.png)\n\
    \n# 调用函数\n\n![image](img/chapter_title_below.png)\n\n我们已经成功创建了函数，然而，为了执行该函数，我们需要调用它。调用函数是指执行触发函数的代码段。\n\
    \n在 C# 中调用函数，你只需要指定函数名称，后面跟着左括号和右括号。在括号内部，你需要指定函数接受的参数（如果有）。\n\n让我们从 `Main()`\
    \ 函数中调用我们刚刚创建的 `ShowText()` 函数。执行以下脚本：\n\n```csharp\nusing System;\nusing System.Collections.Generic;\n\
    using System.Linq;\nusing System.Text;\nusing System.Threading.Tasks;\n\nnamespace\
    \ MyProgram\n{\n    class Program\n    {\n        static void Main(string[] args)\n\
    \        {\n            ShowText();\n            Console.ReadKey();\n        }\n\
    \n        public static void ShowText()\n        {\n            Console.WriteLine(\"\
    I am inside a function\");\n        }\n    }\n}\n```\n\n在上面的脚本中，我们从 `Main` 函数中调用了\
    \ `ShowText()` 函数。这是因为默认情况下，当 C# 程序运行时，`Main` 函数会被执行。\n\n在输出中，你应该看到 `ShowText`\
    \ 函数在控制台上打印的的消息。\n\n![image](img/image007.png)\n\n| ![image](img/chapter_title_corner_decoration_left.png)\
    \ |  | ![image](img/chapter_title_corner_decoration_right.png) |\n\n![image](img/chapter_title_above.png)\n\
    \n# 非静态函数\n\n![image](img/chapter_title_below.png)\n\n在上一节中，我们创建了一个静态函数。在现实世界中，大多数情况下会有非静态函数。要访问非静态函数，我们需要创建类的对象。我们将在后面的章节中详细学习面向对象的编程。现在，只是为了体验非静态函数的行为，请执行以下脚本：\n\
    \n```csharp\nusing System;\nusing System.Collections.Generic;\nusing System.Linq;\n\
    using System.Text;\nusing System.Threading.Tasks;\n\nnamespace MyProgram\n{\n\
    \    class Program\n    {\n        static void Main(string[] args)\n        {\n\
    \            Program p = new Program();\n            p.ShowText();\n         \
    \   Console.ReadKey();\n        }\n\n        public void ShowText()\n        {\n\
    \            Console.WriteLine(\"I am inside a function\");\n        }\n    }\n\
    }\n```\n\n在上面的脚本中，我们对上一个脚本做了两个更改。首先，我们从 `ShowText()` 函数的声明中删除了 `static` 关键字。接下来，在\
    \ `Main` 函数内部，我们创建了 `Program` 类的对象 `p`，包含了 `ShowText()` 和 `Main` 函数。使用该对象，我们可以通过点运算符调用非静态的\
    \ `ShowText()` 函数。输出如下：\n\n![image](img/image038.png)\n\n| ![image](img/chapter_title_corner_decoration_left.png)\
    \ |  | ![image](img/chapter_title_corner_decoration_right.png) |\n\n![image](img/chapter_title_above.png)\n\
    \n# 带参数方法\n\n![image](img/chapter_title_below.png)\n\n带参数的方法是带有某些参数的方法类型。参数用于将数据传递给方法。参数的数量和类型没有限制。调用函数时，必须在函数调用时传递参数值。需要说明的是，函数调用和函数声明中参数的数量、顺序和类型必须匹配。\n\
    \n"
- fmt: "\nLet’s declare a function that accepts two integer type parameters. The first\
    \ parameter is the amount and the second parameter is the percentage of the tax\
    \ on that amount. The function value for the tax percentage and then prints that\
    \ on the screen. Look at the following script:\n\n```csharp\nusing System.Collections.Generic;\n\
    using System.Linq;\nusing System.Text;\nusing System.Threading.Tasks;\n\nnamespace\
    \ MyProgram\n{\nclass Program\n{\n    static void Main(string[] args)\n    {\n\
    \        PrintTax(125, 20);\n        Console.ReadKey();\n    }\n\n    public static\
    \ void PrintTax(float amount, float percentage)\n    {\n        float tax = (percentage\
    \ * amount) / 100;\n        Console.WriteLine(tax);\n    }\n}\n}\n```\n\nIn the\
    \ script above, we declare a function called `PrintTax()`, which accepts two float\
    \ type parameters: `amount` and `percentage`. Inside the function, the percentage\
    \ of tax is calculated and printed using the `Console` function.\n\nIn the function\
    \ call to the `PrintTax()` function, the values for both the parameters are passed.\
    \ The value for the `amount` is `125` and for `percentage` is `20`. In the result,\
    \ you will see 25 since 20% of 125 is 25 as shown below:\n\n![image](d2d_images/image049.png)\n\
    \n| ![image](d2d_images/chapter_title_corner_decoration_left.png) |  | ![image](d2d_images/chapter_title_corner_decoration_right.png)\
    \ |\n\n![image](d2d_images/chapter_title_above.png)\n\n# Returning Values from\
    \ a Function\n\n![image](d2d_images/chapter_title_below.png)\n\nIn addition to\
    \ passing values to the function, we can also return values from a function. To\
    \ do so, we need to make two changes in our script. The first change is that we\
    \ need to change the return type of a function from `void` to the type of value\
    \ that we want our function to return. The second change is that we need to add\
    \ `return` keyword in our script which returns the actual value.\n\nLet’s see\
    \ how we can modify the `PrintTax()` function so that it returns the value of\
    \ the percentage of tax instead of directly printing it on the console:\n\n```csharp\n\
    using System;\nusing System.Collections.Generic;\nusing System.Linq;\nusing System.Text;\n\
    using System.Threading.Tasks;\n\nnamespace MyProgram\n{\nclass Program\n{\n  \
    \  static void Main(string[] args)\n    {\n        float tax = PrintTax(125, 20);\n\
    \        Console.WriteLine(tax);\n        Console.ReadKey();\n    }\n\n    public\
    \ static float PrintTax(float amount, float percentage)\n    {\n        float\
