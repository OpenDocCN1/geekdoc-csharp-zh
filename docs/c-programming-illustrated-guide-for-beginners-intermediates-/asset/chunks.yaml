    \ you wrote your first Program\");\n        Console.ReadKey();\n    }\n}\n}\n\
    ```\n\nThe `using` statements at the top of the code are used to import any libraries.\
    \ Libraries are basically set of pre-built functions that we can directly use\
    \ in our code. Every code snippet in C# has to be inside a class which in turn\
    \ lies inside a namespace. In the script above our class name is `Program` and\
    \ it lies inside the `MyProgram` namespace.\n\nInside the `Program` class, we\
    \ have method `Main` whose return type is `void` and method type is `static`.\
    \ This is the starting point of our code. Do not worry much about the terms `void`\
    \ and `static` at the moment. We will see these terms in detail in a later chapter.\
    \ For now, just remember that the `Main` method is the starting point of C# code.\n\
    \nNext, we write a simple line on the screen. To do so, we used `WriteLine` method\
    \ of the `Console` class and passed it the text that we wanted to display on the\
    \ console window. Finally, we used `ReadKey` method of the `Console` class so\
    \ that our console window doesn’t disappear immediately after printing the text.\
    \ And that’s pretty much it. Congratulations on successfully executing your first\
    \ program.\n\n| ![image](d2d_images/chapter_title_corner_decoration_left.png)\
    \ |  | ![image](d2d_images/chapter_title_corner_decoration_right.png) |\n\n![image](d2d_images/chapter_title_above.png)\n\
    \n# Conclusion\n\n![image](d2d_images/chapter_title_below.png)\n\nC# is one of\
    \ the most frequently used programming languages in the world. In this chapter,\
    \ we studied some of the salient features of C# followed by the environment setup.\
    \ To get our feet wet, we actually ran a very small program to see how C# program\
    \ executes. In the next chapter, we will start our discussion about Data types\
    \ in C#.\n\n| ![image](d2d_images/chapter_title_corner_decoration_left.png) |\
    \  | ![image](d2d_images/chapter_title_corner_decoration_right.png) |\n\n![image](d2d_images/chapter_title_above.png)\n\
    \n# Chapter 2 – Variables and Data Types\n\n![image](d2d_images/chapter_title_below.png)\n\
    \nType safety is one of the most important features of C# language. In C#, the\
    \ type of the data is specified at compile time which makes the application robust.\
    \ In this chapter, we will see how C# handles a variety of data ranging from numbers\
    \ to texts and dates to Boolean. However, before that, we will define what is\
    \ a variable is.\n\n| ![image](d2d_images/chapter_title_corner_decoration_left.png)\
    \ |  | ![image](d2d_images/chapter_title_corner_decoration_right.png) |\n\n![image](d2d_images/chapter_title_above.png)\n\
    \n# Variable\n\n![image](d2d_images/chapter_title_below.png)\n\nA variable in\
    \ C# is a code feature that is used to store data that is changed repeatedly.\
    \ A variable in C# is similar to the variable in Mathematics to which a new value\
    \ can be assigned, updated and deleted. Normally a variable is used to store data\
    \ that is required throughout the application execution time. A type is associated\
    \ with a variable. For instance, a variable that stores textual data in C#, cannot\
    \ store numeric data. Similarly, if a variable stores a Boolean value i.e. true\
    \ or false, you cannot store a numeric or text value to that variable. This is\
    \ what makes C# strongly typed. A variable is declared in C# by simple prefixing\
    \ the data type before the name of the variable. Throughout this book, we will\
    \ make extensive use of the variables. But before that, we need to understand\
    \ the different data types.\n\n| ![image](d2d_images/chapter_title_corner_decoration_left.png)\
    \ |  | ![image](d2d_images/chapter_title_corner_decoration_right.png) |\n\n![image](d2d_images/chapter_title_above.png)\n\
    \n# Data Types\n\n![image](d2d_images/chapter_title_below.png)\n\nC# data types\
    \ have been divided into five categories. They are as follows:\n\n| ![image](d2d_images/chapter_title_corner_decoration_left.png)\
    \ |  | ![image](d2d_images/chapter_title_corner_decoration_right.png) |\n\n![image](d2d_images/chapter_title_above.png)\n\
    \n# 1. Numeric Types\n\n![image](d2d_images/chapter_title_below.png)\n\nThese\
    \ types are used to store integer numbers. They include `int`, `uint`, `long`,\
    \ `ulong`, `sbyte`, `byte`, `short`, `ushort`.\n\nThe following table shows the\
    \ value that these integer type variables can take along with their default values.\n\
    \n| Data Type | Default | Min Value | Max Value |\n| :--- | :--- | :--- | :---\
    \ |\n| sbyte | 0 | -128 | 127 |\n| byte | 0 | 0 | 255 |\n| short | 0 | -32768\
    \ | 32767 |\n| ushort | 0 | 0 | 65535 |\n| int | 0 | -2147483648 | 2147483647\
    \ |\n| uint | 0u | 0 | 4294967295 |\n| long | 0L | -9223372036854775808 | 9223372036854775807\
    \ |\n| ulong | 0UL | 0 | 18446744073709551615 |\n| float | 0.0f | -3.402823e+38\
    \ | 3.402823e+38 |\n| double | 0.0d | -1.7976931348623157e+308 | 1.7976931348623157e+308\
    \ |\n| decimal | 0.0m | -7.9228162514264335e+28 | 7.9228162514264335e+28 |\n\n\
    Let’s take a simple example of integer type. Execute the following script:\n\n\
    ```c\nusing System;\nusing System.Collections.Generic;\nusing System.Linq;\nusing\
    \ System.Text;\nusing System.Threading.Tasks;\n\nnamespace MyProgram\n{\nclass\
    \ Program\n{\n    static void Main(string[] args)\n    {\n        int age = 10;\n\
    \        long balance = 5464646;\n        decimal weight = 5.5M;\n        Console.Write(\"\
    Age:\" + age + \"- balance:\" + balance + \" - weight\" + weight);\n        Console.ReadKey();\n\
    \    }\n}\n}\n```\n\nIn the script above, we create three variables `age`, `balance`\
    \ and `weight`. The first variable is `int` type, the second variable is `long`\
    \ type while the third variable is `decimal` type. We then print the three values\
    \ on the console. The output looks like this:\n\n![image](d2d_images/image069.png)\n\
    \n| ![image](d2d_images/chapter_title_corner_decoration_left.png) |  | ![image](d2d_images/chapter_title_corner_decoration_right.png)\
    \ |\n\n![image](d2d_images/chapter_title_above.png)\n\n# 2. Boolean Type\n\n![image](d2d_images/chapter_title_below.png)\n\
    \nThe Boolean type variables can only have one of the two values: `true` and `false`.\
    \ Let’s take a simple example of a Boolean variable:\n\n```c\nusing System;\n\
    using System.Collections.Generic;\nusing System.Linq;\nusing System.Text;\nusing\
    \ System.Threading.Tasks;\n\nnamespace MyProgram\n{\nclass Program\n{\n    static\
    \ void Main(string[] args)\n    {\n        bool comparison = 10 > 20;\n      \
    \  Console.WriteLine(comparison);\n        comparison = 20 > 10;\n        Console.WriteLine(comparison);\n\
    \        Console.ReadKey();\n    }\n}\n}\n```\n\nIn the script above we create\
    \ a Boolean variable `comparison`. The variable can contain only `true` or `false`\
    \ values. We then evaluated an expression where we say that 10 is greater than\
