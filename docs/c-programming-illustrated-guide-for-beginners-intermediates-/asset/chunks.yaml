    # Conclusion


    ![image](d2d_images/chapter_title_below.png)


    Polymorphism and encapsulation are two of the founding pillars of object oriented
    programming with Inheritance being the third. We studied Inheritance in the last
    chapter, In this chapter we studied polymorphism and encapsulation. We studied
    the different types of polymorphism with the help of examples. Finally we discussed
    how encapsulation can be implemented in C#. With this we completed our discussion
    about object oriented programming. In the next chapter, we will see how errors
    and exceptions are handled in C#.


    | ![image](d2d_images/chapter_title_corner_decoration_left.png) |  | ![image](d2d_images/chapter_title_corner_decoration_right.png)
