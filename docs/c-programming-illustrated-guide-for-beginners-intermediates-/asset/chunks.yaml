    # 3\. Logical Operators


    ![image](d2d_images/chapter_title_below.png)


    Logical operators in C# are used to perform logical AND, OR and NOT operations.
    Suppose you have two Boolean variables x = true and y = false, the following table
    demonstrates the usage of logical operators:


    | Operator | Symbol | Description | Example |


    | AND | && | Performs logical AND operation between two or more operands. Returns
    true if all the operands are true, else returns false | x && y = false |


    | OR | &#124;&#124; | Performs logical OR operation between two or more operands.
    Returns true if one of the operands are true, else returns false | x &#124;&#124;
    y = true |


    | NOT | ! | Reverses the logical state of the operand. | !x = false!y = true |


    Take a look at the following example to see logical operators in action:


    using System;


    using System.Collections.Generic;


    using System.Linq;


    using System.Text;


    using System.Threading.Tasks;


    namespace MyProgram


    {


    class Program


    {


    static void Main(string[] args)


    {


    Boolean x = true;


    Boolean y = false;


    Console.WriteLine(x + " AND " + y + " = "+ (x && y));


    Console.WriteLine(x + " OR " + y + " = " + (x || y));


    Console.WriteLine("NOT " + x + " = " + (!x));


    Console.ReadKey();


    }


    }


    }


    The output of the script above look like this:


    ![image](d2d_images/image066.png)


    | ![image](d2d_images/chapter_title_corner_decoration_left.png) |  | ![image](d2d_images/chapter_title_corner_decoration_right.png)
    |


    ![image](d2d_images/chapter_title_above.png)


    # 4\. Assignment Operators


    ![image](d2d_images/chapter_title_below.png)


    The assignment operators are used to assign value of one operant to another. Following
    are some of the most commonly used assignment operators in C#:


    | Operator | Symbol | Description | Example |


    | Assignment | = | Assigns the value of operand on right to the operand on left
    | x = y, assigns value of y to x |


    | Add and assign | += | Add the value of operand on right to the operand on left
    and assigns the result to the operand on left | x += y is equal tox = x +y |


    | Subtract and assign | -= | Subtracts the value of the operand on right from
    the operand on left and assigns the result to the operand on left | x -= y is
    equal tox = x - y |


    | Multiply and assign | *= | Multiplies the value of the operand on right to 
    the operand on left and the assign the result to the operand on left | x *= y
    is equal tox = x * y |


    | Divide and assign | /= | Divides the value of the operand on right from the
    operand on left and  assigns the result to the operand on left | x /= y is equal
    tox = x / y |


    | Take modulus  and assign | %= | Take the modulus of the operand on right with
    respect to the operand on left and  assigns the result to the operand on left
    | x %= y is equal tox = x % y |


    Take a look at the following example to see assignment operators in action:


    using System;


    using System.Collections.Generic;


    using System.Linq;


    using System.Text;


    using System.Threading.Tasks;


    namespace MyProgram


    {


    class Program


    {


    static void Main(string[] args)


    {


    int x = 30;


    int y = 20;


    x = y;


    Console.WriteLine(x);


    x = 30;


    x += y;


    Console.WriteLine(x);


    x = 30;


    x -= y;


    Console.WriteLine(x);


    x = 30;


    x *= y;


    Console.WriteLine(x);


    x = 30;


    x /= y;


    Console.WriteLine(x);


    x = 30;


    x %= y;


    Console.WriteLine(x);


    Console.ReadKey();


    }


    }


    }


