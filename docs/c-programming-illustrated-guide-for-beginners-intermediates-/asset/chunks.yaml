    # 第 7 章 – C# 中的数组


    ![image](img/chapter_title_below.png)


    在上一章中，我们开始讨论了 C# 中不同类型的迭代语句。在本章中，我们将更进一步，开始探索 C# 数组。数组是用于存储数据集合的最基础的编程数据结构。


    想象你必须存储班级 100 名学生的名字。如果没有数组，你将不得不声明 100 个字符串类型的变量，然后必须逐个在每个变量中存储学生。如果你有数千条记录要存储，这可能会产生问题。数组就是解决这个问题的方案。


    数组在连续的内存位置存储相似类型的数据集合。C# 数组是强类型的，这意味着在定义数组时，你必须也定义存储在数组中的数据类型。在本章中，我们将详细学习数组。


    | ![image](img/chapter_title_corner_decoration_left.png) |  | ![image](img/chapter_title_corner_decoration_right.png)
    |


    ![image](img/chapter_title_above.png)


    # 创建数组


    ![image](img/chapter_title_below.png)


    在 C# 中，创建数组（也称为声明数组）非常简单。语法如下：


    `type [] array_name`


    要创建一个数组，你从数组将包含的元素类型开始，后面跟着左括号和右括号。一对括号表示该变量是一个数组。在括号之后，你必须给数组命名。请注意，此时此时数组的内存尚未被预留。在这里你只是定义了一个数组类型变量。


    要实际初始化数组，使用以下语法：


    `new type [integer]`


    初始化数组时使用关键字 `new`，后面跟着数组的类型。记住，数组变量的类型与正在初始化的实际数组必须匹配。最后，数组类型后面是包含一个整数值的方括号。该整数定义了数组内部可以存储的元素数量。


    让我们来看一个 C# 数组的运行示例。


    ```csharp

    using System;

    using System.Collections.Generic;

    using System.Linq;

    using System.Text;

    using System.Threading.Tasks;

    namespace MyProgram

    {

    class Program

    {

    static void Main(string[] args)

    {

    int[] years = new int[5];

    Console.WriteLine(years.GetType());

    Console.ReadKey();

    }

    }

    }

    ```


    在上面的脚本中，我们创建了一个名为 `years` 的整数数组，数组的大小为 5，这意味着我们可以在数组中存储 5 个元素。接下来，我们打印 `years`
    变量的类型以检查它是否真的是数组。输出如下：


    ![image](img/image030.png)


    从输出中，你可以看到 `System.Int32` 后面跟着方括号。这意味着 `years` 变量是一个 `Int` 类型的数组。


    现在创建一个另一个字符串类型的数组：


    ```csharp

    using System;

    using System.Collections.Generic;

    using System.Linq;

    using System.Text;

    using System.Threading.Tasks;

    namespace MyProgram

    {

    class Program

    {

    static void Main(string[] args)

    {

    int[] years = new int[5];

    string[] colors = new string[5];

    Console.WriteLine(years.GetType());

    Console.WriteLine(colors.GetType());

    Console.ReadKey();

    }

    }

    }

    ```


    在上面的脚本中，我们引入了一个名为 `colors` 的字符串类型数组。现在如果你检查两个数组的类型，你会发现第一个数组是整数类型，第二个数组是字符串类型，如上述脚本的输出所示：


    ![image](img/image081.png)


    除了使用 `new` 关键字，你也可以通过在大括号内传递数组元素来直接创建数组。每个元素之间应该用逗号分隔。请看以下示例：


    ```csharp

    using System;

    using System.Collections.Generic;

    using System.Linq;

    using System.Text;

    using System.Threading.Tasks;

    namespace MyProgram

    {

    class Program

    {

    static void Main(string[] args)

    {

    int[] years = { 10, 20, 30, 40, 50 };

    string[] colors = { "red", "green", "blue", "yellow", "green" };

    Console.WriteLine(years.GetType());

    Console.WriteLine(colors.GetType());

    Console.ReadKey();

    }

    }

    }

    ```


    在上面的脚本中，你可以看到我们直接在大括号内传递值来初始化 `years` 和 `colors` 数组。使用这种方法的处是，你不需要指定想要存储在数组中的元素数量。


    这里需要提到的是，C# 数组遵循零基索引，这意味着数组的第一个元素将存储在索引 0 。同样，第二个元素将存储在第一个索引，以此此类推。


    | ![image](img/chapter_title_corner_decoration_left.png) |  | ![image](img/chapter_title_corner_decoration_right.png)
    |


    ![image](img/chapter_title_above.png)


    # 访问数组元素


    ![image](img/chapter_title_below.png)


    '
