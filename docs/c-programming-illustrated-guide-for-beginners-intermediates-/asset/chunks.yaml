    # Conclusion


    ![image](d2d_images/chapter_title_below.png)


    Conditional statements are used to execute a piece of code based on a certain
    condition. In this chapter, we saw what the different types of conditional statements
    are with the help of examples. In the next chapter, we will start our discussion
    about the iteration statements or also known as loops.


    | ![image](d2d_images/chapter_title_corner_decoration_left.png) |  | ![image](d2d_images/chapter_title_corner_decoration_right.png)
    |


    ![image](d2d_images/chapter_title_above.png)


    # Chapter 6 – Iteration Statements


    ![image](d2d_images/chapter_title_below.png)


    Iteration statements or also known as loops are programming constructs used to
    repeatedly execute a piece of code specific number of times or until a specific
    condition becomes true. Consider a scenario, where you have to print a statement
    ten thousand times on console; it will take you ages to write ten thousand Console.WriteLine
    statements which can be cumbersome. A better way is to use loops. In this chapter,
    we will study different types of loops or iteration statements in C#.


    There are four main types of iteration statements in C#:


    1.  The for loop


    2.  The while loop


    3.  The do while loop


    4.  The foreach loop


    We will study the first three of them in this chapter, we will see foreach loop
    in the next chapter where we will study C# arrays.


    | ![image](d2d_images/chapter_title_corner_decoration_left.png) |  | ![image](d2d_images/chapter_title_corner_decoration_right.png)
    |


    ![image](d2d_images/chapter_title_above.png)


    # The for loop


    ![image](d2d_images/chapter_title_below.png)


    The for loop is used to repeatedly execute a piece of code for a specific number
    of times. If you know the exact number of times that you want your code to execute,
    you should use a for loop. The syntax of the for loop is as follows


    for( initialization value, condition, increment value)


    {


    // keep executing


    }


    Let’s use the for loop to print the “Welcome to C#” 10 times on console. Execute
    the following script:


    using System;


    using System.Collections.Generic;


    using System.Linq;


    using System.Text;


    using System.Threading.Tasks;


    namespace MyProgram


    {


    class Program


    {


    static void Main(string[] args)


    {


    int i;


    for (i=1; i < 11; i++)


    {


    Console.WriteLine("Welcome to C#");


    }


    Console.ReadKey();


    }


    }


    }


    In the above script, we execute for loop that starts from 1 ( i =1) and will execute
    until ( i < 11) after each iteration or each execution of the code the value of
    the variable i will be incremented by 1.


    As a first step in the for loop, the condition is checked. Therefore, when the
    for loop starts in the above script it will be checked if i < 11, if the condition
    becomes true, the code block for the loop executes and the variable i will become
    2\. However, 2 is still less than 11 and the loop will execute once more. The
    loop will keep executing until i becomes 11\. At that point the condition i <
    11 becomes false and the loop terminates. The output of the script above looks
    like this:


    ![image](d2d_images/image064.png)


    Let’s do something more complex. Let’s print the table of the number entered by
    the user on the console using the for loop. Take a look at the following script:


    using System;


    using System.Collections.Generic;


    using System.Linq;


    using System.Text;


    using System.Threading.Tasks;


    namespace MyProgram


    {


    class Program


    {


    static void Main(string[] args)


    {


    Console.Write("Enter a number: ");


    int num = Int32.Parse(Console.ReadLine());


    for(int i=1; i<11; i++)


    {


    int result = num * i;


    Console.WriteLine("{0} x {1} = {2} ", num, i, result);


    }


    Console.ReadKey();


    }


    }


    }


    The output of the script above looks like this:


    ![image](d2d_images/image025.png)


    | ![image](d2d_images/chapter_title_corner_decoration_left.png) |  | ![image](d2d_images/chapter_title_corner_decoration_right.png)
    |


    ![image](d2d_images/chapter_title_above.png)


    # The while loop


    ![image](d2d_images/chapter_title_below.png)


    The while loop is also used to repeatedly execute a piece of code, however, unlike
    for loop, which executes a specific number of times, the while loop executes until
    a specific condition becomes false. The syntax of while loop is as follows:


    while ( condition == true)


    {


    /// Keep executing


    }


    Let’s use while loop to print a message on the console 10 times. Execute the following
    script:


    using System;


    using System.Collections.Generic;


    using System.Linq;


    using System.Text;


    using System.Threading.Tasks;


    namespace MyProgram


    {


    class Program


    {


    static void Main(string[] args)


    {


    int i = 1;


    while ( i < 11)


    {


    Console.WriteLine("Welcome to C#");


    i++;


    }


    ––––––––


    ![image](d2d_images/scene_break.png)


    Console.ReadKey();


    }


    }


    }


    In the above script, we initialize a variable i with value 1\. In the while loop
    condition we check whether the value is less than 11 or not; if it is less than
    11, execute the code block for while loop. Inside the code block, a statement
    is printed on the console and then the value of i is incremented by 1\. The loop
    keeps executing until the variable i becomes is equal to 11\. The output looks
    like this:


    ![image](d2d_images/image075.png)


    Let’s see how while loop can be used to print the table of any number as we did
    in the for loop section:


    using System;


    using System.Collections.Generic;


    using System.Linq;


    using System.Text;


    using System.Threading.Tasks;


    namespace MyProgram


    {


    class Program


    {


    static void Main(string[] args)


    {


    Console.Write("Enter a number: ");


    int num = Int32.Parse(Console.ReadLine());


    int i = 1;


    while (i < 11 )


    {


    int result = num * i;


    Console.WriteLine("{0} x {1} = {2} ", num, i, result);


    i++;


    }


    Console.ReadKey();


    }


    }


    }


    The output of the script above looks like this:


    ![image](d2d_images/image034.png)


    | ![image](d2d_images/chapter_title_corner_decoration_left.png) |  | ![image](d2d_images/chapter_title_corner_decoration_right.png)
    |


    ![image](d2d_images/chapter_title_above.png)


    # The do-while loop


    ![image](d2d_images/chapter_title_below.png)


    The do-while loop is similar to while loop in essence that it also terminates
    when a certain condition becomes false. However, unlike while, the condition to
    terminate the loop is checked at the end of the do-while loop after every iteration.
    This means that the do-while loop executes at least once.


    Let’s write a message on console 10 times using do-while loop. Take a look at
    the following script:


    using System;


    using System.Collections.Generic;


    using System.Linq;


    using System.Text;


    using System.Threading.Tasks;


    namespace MyProgram


    {


    class Program


    {


    static void Main(string[] args)


    {


    int i = 1;


    do


    {


    Console.WriteLine("Welcome to C#");


    i++;


    }


    while (i < 11);


    ––––––––


    ![image](d2d_images/scene_break.png)


    Console.ReadKey();


    }


    }


    }


    You can see in the script that while condition has moved to the end and the do
    keyword is being used at the beginning. In the output, you will see a text printed
    on the console as shown below:


    ![image](d2d_images/image041.png)


    Now let’s see how do-while loop can be used to print the table of a number on
    the screen. Take a look at the following script:


    using System;


    using System.Collections.Generic;


    using System.Linq;


    using System.Text;


    using System.Threading.Tasks;


    namespace MyProgram


    {


    class Program


    {


    static void Main(string[] args)


    {


    Console.Write("Enter a number: ");


    int num = Int32.Parse(Console.ReadLine());


    int i = 1;


    do


    {


    int result = num * i;


    Console.WriteLine("{0} x {1} = {2} ", num, i, result);


    i++;


    }


    while (i < 11) ;


    Console.ReadKey();


    ––––––––


    ![image](d2d_images/scene_break.png)


    }


    }


    }


    The output looks like this:


    ![image](d2d_images/image076.png)


