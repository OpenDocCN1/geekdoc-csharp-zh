    # 使用 for 循环遍历数组


    ![image](img/chapter_title_below)


    如果数组有很多元素，更好的方法是使用 `for` 循环来遍历数组。让我们看看如何这样做：


    ```csharp

    using System;


    using System.Collections.Generic;

    using System.Linq;

    using System.Text;

    using System.Threading.Tasks;


    namespace MyProgram


    {


    class Program

    {


    static void Main(string[] args)

    {


    string[] colors = { "red", "green", "blue", "yellow", "green" };


    for (int i = 0; i < 5; i++)


    {


    Console.WriteLine(colors[i]);


    }


    Console.ReadKey();


    }


    }

    ```


    在上面的脚本中，我们使用 `for` 循环从 0 迭代到 4（共 5 次），在每次迭代期间，迭代变量 `i` 被作为索引值传递给数组。通过这种方式，`colors`
    中的所有元素都被逐一访问。这个过程被称为遍历数组。上述脚本的输出如下：


    ![image](img/image052.png)


    重要的是，如果你尝试访问数组中不存在的索引元素，将会发生数组越界异常（array out of bound exception）。我们将在后面的章节中讨论异常，现在只需将异常视为错误即可。


    我们的 `colors` 数组有 5 个元素，存储从索引 0 到 4。让我们执行一个从索引 0 到 5 遍历 `colors` 数组的循环，看看会发生什么。执行以下脚本：


    ```csharp

    using System;


    using System.Collections.Generic;

    using System.Linq;

    using System.Text;

    using System.Threading.Tasks;


    namespace MyProgram


    {


    class Program

    {


    static void Main(string[] args)

    {


    string[] colors = { "red", "green", "blue", "yellow", "green" };


    for (int i = 0; i < 6; i++)


    {


    Console.WriteLine(colors[i]);


    }


    Console.ReadKey();


    }


    }

    }

    ```


    在上面的脚本中，`for` 循环从 0 运行到 5，但在 `colors` 数组的第 5 索引处没有元素。因此，抛出一个发生了 `IndexOutOfRangeException`
    的错误，如下脚本所示：


    ![image](img/image026.png)


    避免此错误的方法之一是动态设置数组的范围为数组中元素的数量。可以使用 `Length` 属性找到数组中元素的总数。查看以下脚本：


    ```csharp

    using System;


    using System.Collections.Generic;

    using System.Linq;

    using System.Text;

    using System.Threading.Tasks;


    namespace MyProgram


    {


    class Program

    {


    static void Main(string[] args)

    {


    string[] colors = { "red", "green", "blue", "yellow", "green" };


    int length = colors.Length;


    for (int i = 0; i < length; i++)


    {


    Console.WriteLine(colors[i]);


    }


    Console.ReadKey();


    }


    }


    }

    ```


