    \  | ![image](img/chapter_title_corner_decoration_right.png) |\n\n![image](img/chapter_title_above.png)\n\
    \n# 第 4 章 – 获取用户输入和控制台输出\n\n![image](img/chapter_title_below.png)\n\n软件应用程序的主要目的是为用户提供服务。应用程序应该尽可能地具有交互性，以便更好地促进用户交互。使应用程序交互性的方法之一是从用户获取输入并根据该输入显示输出。在本章中，我们将学习如何使用控制窗口从用户获取输入并向用户显示输出。\n\
    \n| ![image](img/chapter_title_corner_decoration_left.png) |  | ![image](img/chapter_title_corner_decoration_right.png)\
    \ |\n\n![image](img/chapter_title_above.png)\n\n# 控制窗口\n\n![image](img/chapter_title_below.png)\n\
    \n控制窗口是一种命令行界面，用户通过键盘输入命令，输出则以文本形式在同一个控制窗口上表示。让我们先讨论如何在控制台上打印数据，然后我们将学习如何使用控制窗口获取用户输入。\n\
    \n# 在控制台上打印数据\n\nWrite 函数\n\n"
- fmt: "\nThe `Write` function of the `Console` class prints whatever you pass it\
    \ as a parameter on the console. Since every object has a string representation,\
    \ therefore you can pass objects of all types to the `Write` function. Take a\
    \ look at a very simple example of the `Write` function.\n\n```csharp\nnamespace\
    \ MyProgram\n{\n    class Program\n    {\n        static void Main(string[] args)\n\
    \        {\n            bool test = true;\n            string msg = \"Hello from\
    \ C#\";\n            int num = 10;\n            Console.Write(test);\n       \
    \     Console.Write(msg);\n            Console.Write(num);\n            Console.ReadKey();\n\
    \        }\n    }\n}\n```\n\nThe output of the above script looks like that:\n\
    \n![image](d2d_images/image061.png)\n\nThe output looks strange? Isn’t it? All\
    \ the variables have been printed on the same line without any space. This is\
    \ how the `Write` function works. It prints the values passed to it on the console\
    \ and leaves the cursor on the same line. The next `Write` statement will be printed\
    \ on the same line.\n\nThis is where the `WriteLine` function comes handy.\n\n\
    ## The WriteLine Function\n\nThe `WriteLine` function on the other hand prints\
    \ whatever is passed to it o a new line. Look at the following example:\n\n```csharp\n\
    namespace MyProgram\n{\n    class Program\n    {\n        static void Main(string[]\
    \ args)\n        {\n            bool test = true;\n            string msg = \"\
    Hello from C#\";\n            int num = 10;\n            Console.WriteLine(test);\n\
    \            Console.WriteLine(msg);\n            Console.WriteLine(num);\n  \
    \          Console.ReadKey();\n        }\n    }\n}\n```\n\nThe output of the script\
    \ above looks like this:\n\n![image](d2d_images/image078.png)\n\n## Place Holder\
    \ for Console Output\n\nIn addition to directly printing strings in the output,\
    \ you can also use placeholders that define the position of the corresponding\
    \ strings in the output. The place holder is defined using curly brackets and\
    \ inside the curly brackets, you specify the position of the place holder. Take\
    \ a look at the following example to see placeholders in action:\n\n```csharp\n\
    namespace MyProgram\n{\n    class Program\n    {\n        static void Main(string[]\
    \ args)\n        {\n            string name = \"Mike\";\n            int age =\
    \ 20;\n            string location = \"London\";\n            ––––––––\n![image](d2d_images/scene_break.png)\n\
    \            Console.WriteLine(\"I am {0}, I am {1} years and I am from {2}\"\
    , name, age, location);\n            Console.ReadKey();\n        }\n    }\n}\n\
    ```\n\nIn the script above, we first define three variables: `name`, `age`, and\
    \ `location`. We print a string on the console. Inside the string, we use placeholders\
    \ for the name, age and location. We then simply pass the variables in the same\
    \ order to the `Console.WriteLine` function, separated by a comma. Here the placeholder\
    \ `{0}` corresponds to `name`, `{1}` corresponds to `age` and `{2}` corresponds\
    \ to `location`. The output looks like this:\n\n![image](d2d_images/image080.png)\n\
    \n| ![image](d2d_images/chapter_title_corner_decoration_left.png) |  | ![image](d2d_images/chapter_title_corner_decoration_right.png)\
    \ |\n\n![image](d2d_images/chapter_title_above.png)\n\n# Getting User Input\n\n\
    ![image](d2d_images/chapter_title_below.png)\n\nThere are multiple ways to get\
    \ user input through console in C#. We will see some of them in this section.\n\
    \n## The ReadLine Function\n\nThe `ReadLine` function is used to read complete\
    \ user input. Take a look at the following example:\n\n```csharp\nusing System;\n\
    using System.Collections.Generic;\nusing System.Linq;\nusing System.Text;\nusing\
    \ System.Threading.Tasks;\nnamespace MyProgram\n{\n    class Program\n    {\n\
    \        static void Main(string[] args)\n        {\n            Console.WriteLine(\"\
    What is your name:\");\n            string name = Console.ReadLine();\n      \
    \      Console.WriteLine(\"What is your city:\");\n            string location\
    \ = Console.ReadLine();\n            Console.WriteLine(\"Your name is {0} and\
    \ you live in {1} \", name, location);\n            Console.ReadKey();\n     \
    \   }\n    }\n}\n```\n\nWhen the above script is executed, the user will be prompted\
    \ to enter his name. The user will enter his name and press enter. The `ReadLine`\
    \ function executes which takes the user input and store it in the `name` variable.\
    \ In the same way, the location of the user will be taken as input and stored\
    \ in the `location` variable. Finally, both the `name` and `location` variables\
    \ are printed on the console using the `WriteLine` function.\n\nThe output of\
    \ the script above looks like this:\n\n![image](d2d_images/image014.png)\n\n##\
    \ Getting Integer Input\n\nThough string type data entered by the user as input\
    \ can directly be used, integer and other types need to be converted to their\
    \ corresponding types before they can be used. For instance, if a user enters\
    \ an integer in response to the `ReadLine` function, that integer will be considered\
    \ string. To perform arithmetic operations using that number, it first has to\
    \ be converted into string type.\n\nTake a look at the following example:\n\n\
