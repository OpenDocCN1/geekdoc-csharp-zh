    # Chapter 12 – Exception Handling in C#


    ![image](d2d_images/chapter_title_below.png)


    Exceptions in C# are errors that stop the execution of a program. There are different
    types of exceptions for instance: divide by zero exceptions, which occurs when
    an integer is divided by a zero. Other type of exceptions include index out of
    bound exception which occurs when you try to access array index which doesn’t
    actually exist. The exception handling is the mechanism of avoiding exceptions
    and preventing computer program from crashing. In this chapter, we will study
    C# exception handling in detail.'
