    在上面的脚本中，我们有两个类 `Y` 和 `X`。类 `X` 继承自 `Y`。在类 `Y` 中我们有一个虚方法 `MethodA`，而在类 `X` 中我们也有一个覆盖了父类方法的
    `MethodA`。在 `Program` 类的 `Main` 方法中，我们创建了父类 `Y` 的对象。现在，如果你通过子类对象 `X` 调用 `MethodA`，你将看到执行的是重写的方法。然而，如果你使用类
