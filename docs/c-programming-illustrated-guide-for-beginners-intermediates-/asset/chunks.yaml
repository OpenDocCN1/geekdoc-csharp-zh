  trans: "\n\n处理异常和错误对于程序的无缝和成功执行至关重要。在本章中，我们了解了 C# 异常是什么、它们的不同类型，以及如何使用 `try`、`catch`\
    \ 和 `finally` 块来处理它们。在下一章中，我们将开始讨论 C# 中的字符串处理。\n\n# 第 13 章 – C# 中的字符串操作\n\n字符串是任何编程语言中最重要的数据类型之一。虽然整数和小数用于执行算术运算，但字符串对于获取用户信息和向用户显示信息极其有用。正因如此，我们专门用了一章来介绍\
    \ C# 中的字符串操作。\n\n在本章中，我们将学习 C# 字符串的基础知识、它们的创建方法以及一些常用的字符串函数。\n\n# 创建字符串\n\n字符串本质上是字符序列。在\
    \ C# 中，字符串是 `System.String` 类的实例。然而，我们可以简单地使用关键字 `string` 来声明一个字符串，它是 `System.String`\
    \ 的别名。\n\n创建字符串有两种主要方法。你可以创建一个字符串字面量并将其存储在所示的字符串类型变量中：\n\n```csharp\nstatic void\
    \ Main(string[] args)\n{\n    string color = \"red\";\n    Console.WriteLine(color);\n\
    \    Console.ReadKey();\n}\n```\n\n在输出中，你应该能在控制窗口中看到的字符串“red”。这里需要提到，`string`\
    \ 是唯一可以在不使用 `new` 关键字的情况下创建的对象。在上面的脚本中，当你创建一个对象字面量“red”时，它基本上创建了一个字符串类型对象并将其存储在变量\
    \ `color` 中。\n\n有一种使用 `new` 关键字创建字符串对象的方法。看看下面的示例：\n\n```csharp\nstatic void Main(string[]\
    \ args)\n{\n    char[] col = new char[] { 'b', 'l', 'u', 'e' };\n    string color\
    \ = new string(col);\n    Console.WriteLine(color);\n    Console.ReadKey();\n\
    }\n```\n\n在上面的脚本中，我们创建了一个字符数组 `col`。然后我们使用关键字 `new` 调用 `string` 类的构造函数，并传入字符类型数组，作为返回，我们得到了字符数组中所有字符的字符串。如果你执行上面的脚本，将看到控制台上打印出“blue”。\n\
    \n为了确认字符串实际上是字符数组，让我们使用 `for-each` 循环来遍历字符串字符。看看下面的脚本：\n\n```csharp\nstatic void\
    \ Main(string[] args)\n{\n    string message = \"C# is awesome\";\n    foreach(char\
    \ c in message)\n    {\n        Console.WriteLine(c);\n    }\n    Console.ReadKey();\n\
    }\n```\n\n在输出中，你应该看到字符串的每个字符单独显示一行，如下所示：\n\n# 使用单引号和双引号\n\n要使用单引号和双引号，你需要在单引号和双引号之前放置一个反斜杠。看看下边的示例：\n\
    \n```csharp\nstatic void Main(string[] args)\n{\n    string message = \"This is\
    \ Jame\\'s \\\"Car\\\"\";\n    Console.WriteLine(message);\n    Console.ReadKey();\n\
    }\n```\n\n输出：\n\n# 字符串拼接\n\n字符串拼接是将两个或多个字符串连接在一起。在 C# 中，有两种方法连接字符串。你可以使用拼接运算符\
    \ `+`、`Join()` 方法和 `Concat()` 方法。下面的示例演示了字符串拼接的操作：\n\n```csharp\nstatic void Main(string[]\
    \ args)\n{\n    string message1 = \"Welcome to\";\n    string message2 = \" C#\"\
    ;\n    string result1 = message1 + message2;\n    string result2 = string.Join(\"\
    \ \", message1, message2);\n    string result3 = string.Concat(message1, message2);\n\
    \    Console.WriteLine(result1);\n    Console.WriteLine(result2);\n    Console.WriteLine(result3);\n\
    \    Console.ReadKey();\n}\n```\n\n在上面的脚本中，我们有两个字符串 `message1` 和 `message2`。在第一个实例中，我们使用加号运算符拼接两个字符串。接下来，我们使用\
    \ `Join()` 函数拼接字符串。这里需要提到，`join` 函数的第一个参数实际上是用作两个字符串之间分隔符的字符串。其余参数是待拼接的字符串。最后，`Concat()`\
    \ 方法也接收要连接的字符串作为参数并返回一个拼接后的字符串。\n\n# 将字符串转换为小写和大大写\n\n将字符串转换为大写或小写是字符串操作中的另一项基础任务。幸运的是，C#\
    \ 提供了 `ToUpper()` 和 `ToLower()` 方法，可以分别将字符串转换为大写或小写。看看下面的示例：\n\n```csharp\nstatic\
    \ void Main(string[] args)\n{\n    string message1 = \"HELLO TO C#\";\n    string\
    \ message2 = \"it is the best language\";\n    Console.WriteLine(message1.ToLower());\n\
    \    Console.WriteLine(message2.ToUpper());\n    Console.ReadKey();\n}\n```\n\n\
    在上面的脚本中，`message1` 是一个全大写字符串，`message2` 是一个全小写字符串。然而，当我们在控制台上显示这些字符串时，使用 `ToLower()`\
    \ 方法将大写字符串转换为小写。同样，全小写字符串使用 `ToUpper()` 方法转换为大写字符串。\n\n# 查找子串\n\n子串是另一个字符串内部的字符串。C#\
    \ 有多种方法可以查找字符串在另一个字符串中的出现位置、提取字符串、查找索引等。在本节中，我们将学习一些子串方法。\n\n要检查一个字符串是否存在于另一个字符串中，我们可以如下使用\
    \ `IndexOf()` 方法。看看下面的示例：\n\n```csharp\nstatic void Main(string[] args)\n{\n \
    \   string message1 = \"HELLO TO C#\";\n    int index1 = message1.IndexOf(\"C#\"\
    );\n    int index2 = message1.IndexOf(\"Java\");\n    Console.WriteLine(index1);\n\
    \    Console.WriteLine(index2);\n    Console.ReadKey();\n}\n```\n\n在上面的脚本中，我们有一个字符串“HELLO\
    \ TO C#”。我们首先使用 `IndexOf()` 方法检查字符串是否包含“C#”。如果找到了该字符串，`IndexOf()` 方法将返回被搜索字符串的起始位置索引。字符串“C#”在字符串“HELLO\
