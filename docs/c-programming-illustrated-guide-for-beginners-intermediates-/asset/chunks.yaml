    ![image](d2d_images/chapter_title_above.png)


    # Creating a String


    ![image](d2d_images/chapter_title_below.png)


    A string is basically a sequence of characters. In C#, strings are instances of
    System.String class. However, we can simply declare a string using keyword string
    which is an alias for System.String.


    There are two main ways of creating a string. You can create a string literal
    and store it in a string type variable as shown below:


    static void Main(string[] args)


    {


    string color = "red";


    Console.WriteLine(color);


    Console.ReadKey();


    }


    In the output, you should see string “red” displayed in the console window. It
    is important to mention here that string is the only object that can be created
    without the new keyword. In the above script, when you create an object literal
    “red”, it basically creates a string type object and stores it in the “color”
    variable.


    There is a way to create a string object using the new keyword. Take a look at
    the following example:


    static void Main(string[] args)


    {


    char[] col = new char[] { ''b'', ''l'', ''u'', ''e'' };


    string color = new string(col);


    Console.WriteLine(color);


    Console.ReadKey();


    }


    In the script above, we create a character array “col”. We then use keyword new
    to call the constructor of the string class and pass it the character type array
    and in return, we get a string of all the characters in the character array. If
    you execute the script above, you will see “blue” printed on the console.


    Just to confirm that a string is actually an array of characters, let’s use the
    for each loop to iterate through string characters. Take a look at the following
    script:


    static void Main(string[] args)


    {


    string message = "C# is awesome";


    foreach(char c in message)


    {


    Console.WriteLine(c);


    }


    Console.ReadKey();


    }


    In the output, you should see characters of the string displayed on a separate
    line as shown below:


    ![image](d2d_images/image057.png)


    | ![image](d2d_images/chapter_title_corner_decoration_left.png) |  | ![image](d2d_images/chapter_title_corner_decoration_right.png)
    |


    ![image](d2d_images/chapter_title_above.png)


    # Using Single and Double Quotes


    ![image](d2d_images/chapter_title_below.png)


    To use single and double quotes, you need to put a backward slash before single
    and double quotes. Take a look at the following example:


    ––––––––


    ![image](d2d_images/scene_break.png)


    static void Main(string[] args)


    {


    string message = "This is Jame\''s \"Car\"";


    Console.WriteLine(message);


    Console.ReadKey();


    }


    Output:


    ![image](d2d_images/image012.png)


    | ![image](d2d_images/chapter_title_corner_decoration_left.png) |  | ![image](d2d_images/chapter_title_corner_decoration_right.png)
    |


    ![image](d2d_images/chapter_title_above.png)


    # String Concatenation


    ![image](d2d_images/chapter_title_below.png)


    String concatenation refers to joining two or more than two strings. In C#, there
    are two ways to join strings. You can use the concatenation operator “+”, the
    “Join()” and the “Concat()” methods. The following example demonstrates string
    concatenation in action:


    static void Main(string[] args)


    {


    string message1 = "Welcome to";


    string message2 = " C#";


    string result1 = message1 + message2;


    string result2 = string.Join(" ", message1, message2);


    string result3 = string.Concat(message1, message2);


    Console.WriteLine(result1);


    Console.WriteLine(result2);


    Console.WriteLine(result3);


    Console.ReadKey();


    }


    In the script above, we have two strings message1 and message2\. In the first
    instance, we use the plus operator to concatenate the two strings. Next, we use
    the Join() function to concatenate the strings. It is important to mention that
    the first parameter to the join function is actually the string which is used
    as a separator between the two strings. The rest of the parameters are the strings
    to be concatenated. Finally, the Concat() method also takes the string to join
    as parameters and return a concatenated string. The output of the script above
    looks like this:


    ![image](d2d_images/image040.png)


    | ![image](d2d_images/chapter_title_corner_decoration_left.png) |  | ![image](d2d_images/chapter_title_corner_decoration_right.png)
    |


    ![image](d2d_images/chapter_title_above.png)


    # Converting String to Lowercase and Uppercase


    ![image](d2d_images/chapter_title_below.png)


    Converting a string into uppercase or lower case is another fundamental task in
    string manipulation. Luckily, C# comes with ToUpper() and ToLower() methods that
    can be used to convert a string to upper or lowercase respectively. Take a look
    at the following example:


    static void Main(string[] args)


    {


    string message1 = "HELLO TO C#";


    string message2 = "it is the best language";


    Console.WriteLine(message1.ToLower());


    Console.WriteLine(message2.ToUpper());


    Console.ReadKey();


    }


    In the script above we have an all uppercase string in message1 and an all lowercase
    string in message2\. However, when we display these strings on the console, we
    convert the uppercase string to lowercase using the ToLower() method. Similarly,
    the all-lowercase string is converted to an uppercase string using the ToUpper()
    method. The output of the script above looks like this:


    ![image](d2d_images/image037.png)


    | ![image](d2d_images/chapter_title_corner_decoration_left.png) |  | ![image](d2d_images/chapter_title_corner_decoration_right.png)
    |


    ![image](d2d_images/chapter_title_above.png)


    # Finding Substring


    ![image](d2d_images/chapter_title_below.png)


    A substring is a string within another string. C# has a variety of methods that
    can be used to find the occurrence of a string within another string, extracting
    a string, finding the index of a string and so on. In this section, we will see
    some of the substring methods.


    To see if a string exists inside another string, we can use IndexOf() method as
    follows. Take a look at the following example:


    static void Main(string[] args)


    {


    string message1 = "HELLO TO C#";


    int index1 = message1.IndexOf("C#");


    int index2 = message1.IndexOf("Java");


    Console.WriteLine(index1);


    Console.WriteLine(index2);


    Console.ReadKey();


    }


    In the script above we have a string “HELLO TO C#”. We use the IndexOf() method
    to first check if the string contains “C#”. If the string is found, the IndexOff()
    method returns the index of the starting position of the string being searched.
    The starting position of the string “C#” in the string “HELLO TO C#” is 9\. Next,
    we again use the IndexOf() method to search for the string “Java”, however since
    the string “HELLO TO C#” doesn’t contain a substring “Java”, the IndexOf() method
    will return -1 which means that the string was not found.'
