    \    }\n\n    public static void PrintSquares (int[] nums)\n    {\n        nums[0]\
    \ = nums[0] * nums[0];\n        nums[1] = nums[1] * nums[1];\n        Console.WriteLine(\"\
    Squares are: {0} and {1}\", nums[0], nums[1]);\n    }\n}\n}\n```\n\n在上面的脚本中我们将数组作为参数传递给\
    \ `PrintSquares()` 函数。在函数内部我们更新了数组元素的值。在输出中你将看到函数调用后值被更新了，如下所示：\n\n![image](img/chapter_title_corner_decoration_left.png)\
    \ |  | ![image](img/chapter_title_corner_decoration_right.png) |\n\n![image](img/chapter_title_above.png)\n\
    \n# 总结\n\n![image](img/chapter_title_below.png)\n\n在本章中我们涵盖了函数。我们看到了不同类型的函数以及如何在函数之间传递和返回数据。函数的真正威力来自于对象，我们将在下一章开始讨论面向对象编程（OOP）时看到它们。\n"
- fmt: 'It is important to mention that OOP is not a new technology, rather it is
    an approach to where every component of a computer program is implemented in the
    form of objects and classes. Consider a scenario where you have to develop a flight
    simulator using OOP principles. The first task will be to identify the objects
    in a flight simulator. An object is an entity that has some characteristics and
    can perform some functionalities. In a flight simulator, the first possible object
    that should come to your mind is an `Airplane`. An `Airplane` has some characteristics
    such as `make`, `model` etc. It also has a few functionalities such as `start
    airplane`, `stop the airplane`, `take off`, `land` etc. Therefore it is an ideal
    candidate for being implemented as an object. Other objects in a flight simulator
    can be pilots, missiles etc.


    It is also pertinent to mention that object-oriented programming is a general
    programming principle and is not limited to `C#. However, in this chapter, we
    will see how OOP can be implemented in `C#.


    ![image](d2d_images/chapter_title_corner_decoration_left.png) |  | ![image](d2d_images/chapter_title_corner_decoration_right.png)

    ![image](d2d_images/chapter_title_above.png)


    # Advantages of OOP


    ![image](d2d_images/chapter_title_below.png)


    Following are some of the advantages of object-oriented programming.


    ![image](d2d_images/chapter_title_corner_decoration_left.png) |  | ![image](d2d_images/chapter_title_corner_decoration_right.png)

    ![image](d2d_images/chapter_title_above.png)


    # Reusability


    ![image](d2d_images/chapter_title_below.png)


    In OOP, applications are developed in the form of objects and classes. These objects
    and classes can be reused in other applications as well.


    ![image](d2d_images/chapter_title_corner_decoration_left.png) |  | ![image](d2d_images/chapter_title_corner_decoration_right.png)

    ![image](d2d_images/chapter_title_above.png)


    # Modular Approach


    ![image](d2d_images/chapter_title_below.png)


    OOP applications are developed in the form of modules where each module has its
    own functionality. The modular approach makes application development simple and
    less complex.


    ![image](d2d_images/chapter_title_corner_decoration_left.png) |  | ![image](d2d_images/chapter_title_corner_decoration_right.png)

    ![image](d2d_images/chapter_title_above.png)


    # Maintainability


    ![image](d2d_images/chapter_title_below.png)


    Since OOP applications are developed in the form of modules, it is easy to make
    changes in one module without affecting the other resulting in maintainable code.


    ![image](d2d_images/chapter_title_corner_decoration_left.png) |  | ![image](d2d_images/chapter_title_corner_decoration_right.png)

    ![image](d2d_images/chapter_title_above.png)


    # Easy Debugging


    ![image](d2d_images/chapter_title_below.png)


    OOP applications are easy to debug since an error in one part of the application
    is usually local and doesn’t affect other application areas.


    ![image](d2d_images/chapter_title_corner_decoration_left.png) |  | ![image](d2d_images/chapter_title_corner_decoration_right.png)

    ![image](d2d_images/chapter_title_above.png)


    # Security


    ![image](d2d_images/chapter_title_below.png)


    OOP applications focus on data security via encapsulation which we will study
    in a later chapter. In simple words, the access to data in OOP applications is
    controlled.


    ![image](d2d_images/chapter_title_corner_decoration_left.png) |  | ![image](d2d_images/chapter_title_corner_decoration_right.png)

    ![image](d2d_images/chapter_title_above.png)


    # A Class


    ![image](d2d_images/chapter_title_below.png)


    A class serves as a cornerstone for object-oriented programming. It is a blueprint
    for the object. It contains information about how an object will look like. How
    many methods will the object contain, what will be the return type of the method,
    the type of arguments the method will accept. Similarly, it will also specify
    the variables that the object will contain. In short, a class is a map for the
    object. When you see a map, you can easily tell how the house will look like,
