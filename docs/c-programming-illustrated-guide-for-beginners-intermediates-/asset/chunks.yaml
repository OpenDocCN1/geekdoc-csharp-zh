    {

    class Program

    {

    static void Main(string[] args)

    {

    Console.WriteLine("Enter the content you want to write to file:");

    string text = Console.ReadLine();

    File.AppendAllText("D:/myfile2.txt", text);

    Console.ReadLine();

    }

    }

    }

    ```


    In the script above, the text entered by the user is appended at the end of the
    already existing text in `myfile2.txt`.


