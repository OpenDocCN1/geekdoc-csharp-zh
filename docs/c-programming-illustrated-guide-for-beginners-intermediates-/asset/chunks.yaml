    ![image](d2d_images/chapter_title_above.png)


    # Chapter 8 – Functions in C#


    ![image](d2d_images/chapter_title_below.png)


    Function (also known as method) is one of the most important constructs in any
    programming language. Functions are used to execute a piece of code that needs
    to be executed repeatedly and has self-contained logic.


    Consider a scenario where you have to calculate the percentage of tax on a certain
    amount. Both the percentage and the amount will be entered by the user. And you
    need to do this task repeatedly. One way is to write a logic that calculates the
    tax on the amount every time you need to perform this task. This can be really
    cumbersome. What if you need to do this 1000 times a day? You will be spending
    all your day writing such logic. A better approach is to encapsulate such logic
    inside a function and then implement a mechanism that executes the function and
    the logic inside it.


    In this chapter, we will see how C# functions are implemented, how we can pass
    and retrieve data from the functions and what the different types of functions
    are.


    | ![image](d2d_images/chapter_title_corner_decoration_left.png) |  | ![image](d2d_images/chapter_title_corner_decoration_right.png)
    |


    ![image](d2d_images/chapter_title_above.png)


    # Declaring a Function


    ![image](d2d_images/chapter_title_below.png)


    The syntax for declaring a function is as follows


    modifier return-type function-name(p1, p2, p3 ...)


    {


    //function logic


    }


    ––––––––


    ![image](d2d_images/scene_break.png)


    To declare a function, you first have to specify the modifier or access type of
    function. We will study access modifiers in detail in a later chapter, for now,
    we will use public as access modifier. Public access modifier specifies that our
    function can be accessed from anywhere. Next, we need to define the return type
    of the function. The return type specifies the type of the value returned by the
    function. Next, we need to specify the name of the function followed by opening
    and closing parameters. Inside the opening and closing parameters, we pass the
    parameters. The parameters are basically used to pass data to a function. After
    that, the body of the function is specified inside the opening and closing curly
    brackets that contain the logic that will be executed by the function.


    It is important to mention here that you already have a function named Main whose
    return type is void (nothing), and which takes an array of string as an argument
    and is of type static. A static function is a function that doesn’t require to
    be called via an object of a class. We will see objects and classes in detail
    in a later chapter. For now, just bear in mind that to call a function directly,
    without object name, we have to use the keyword static.


    Let’s define a simple function that returns nothing, has no parameters and simply
    displays some text on the screen.


    using System;


    using System.Collections.Generic;


    using System.Linq;


    using System.Text;


    using System.Threading.Tasks;


    namespace MyProgram


    {


    class Program


    {


    static void Main(string[] args)


    {


    Console.ReadKey();


    }


    public static void ShowText()


    {


    Console.WriteLine("I am inside a function");


    }


    }


    }


    In the script above we created  a function named ShowText() which simply prints
    some text on the screen as shown by the Console.WriteLine() function. The return
    type is void and the function is static and public.


    | ![image](d2d_images/chapter_title_corner_decoration_left.png) |  | ![image](d2d_images/chapter_title_corner_decoration_right.png)
    |


    ![image](d2d_images/chapter_title_above.png)


    # Calling a Function


    ![image](d2d_images/chapter_title_below.png)


    We have successfully created our function, however, to execute this function,
    we need to call it. Calling a function refers to executing the piece of code that
    triggers the function.


    To a call a function in C#, you simply have to specify the name of the function
    followed by the opening and closing brackets. Inside the opening and closing brackets,
    you need to specify the parameters that the function accepts (if any).


    Let’s call the ShowText() function that we just created from the Main() function.
    Execute the following script:


    using System;


    using System.Collections.Generic;


    using System.Linq;


    using System.Text;


    using System.Threading.Tasks;


    namespace MyProgram


    {


    class Program


    {


    static void Main(string[] args)


    {


    ShowText();


    Console.ReadKey();


    }


    public static void ShowText()


    {


    Console.WriteLine("I am inside a function");


    }


    }


    }


    In the script above, we call the ShowText() function from the Main function. This
    is because by default the Main function is executed when a C# program runs.


    In the output, you should see the message printed on the console by the ShowText
    function.


    ![image](d2d_images/image007.png)


    | ![image](d2d_images/chapter_title_corner_decoration_left.png) |  | ![image](d2d_images/chapter_title_corner_decoration_right.png)
    |


    ![image](d2d_images/chapter_title_above.png)


    # Non-Static Function


    ![image](d2d_images/chapter_title_below.png)


    In the previous section, we created a static function. In the real world, most
    of the time, we will be having non-static functions. To access a non-static function,
    we need to create Object of the class. We will study object-oriented programming
    in detail in a later chapter. For now, just to have a taste of how non-static
    functions behave, execute the following script:


    using System;


    using System.Collections.Generic;


    using System.Linq;


    using System.Text;


    using System.Threading.Tasks;


    namespace MyProgram


    {


    class Program


    {


    static void Main(string[] args)


    {


    Program p = new Program();


    p.ShowText();


    Console.ReadKey();


    }


    public void ShowText()


    {


    Console.WriteLine("I am inside a function");


    }


    }


    }


    In the script above, we made two changes from the last script. First, we removed
    the static keyword from the declaration of our ShowText() function. Next, inside
    the Main function, we created an object “p” of the Program class which contains
    both the ShowText() and the Main functions. Using this object, we can call the
    non-static ShowText() function with the dot operator. The output looks like this:


    ![image](d2d_images/image038.png)


    | ![image](d2d_images/chapter_title_corner_decoration_left.png) |  | ![image](d2d_images/chapter_title_corner_decoration_right.png)
    |


    ![image](d2d_images/chapter_title_above.png)


    # Parameterized Methods


    ![image](d2d_images/chapter_title_below.png)


    Parameterized methods are the type of methods that have some parameters. The parameters
    are used to pass data to the methods. There is no limit on the number and types
    of the parameters. When the function is called, the values for the parameters
    are required to be passed with the function call. It is important to mention that
    the number, order, and type of the parameters in the function call and the function
    declaration must match.'
