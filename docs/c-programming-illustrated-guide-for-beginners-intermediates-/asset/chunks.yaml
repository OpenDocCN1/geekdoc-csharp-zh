    # Chapter 11 – Polymorphism and Encapsulation in C#


    ![image](d2d_images/chapter_title_below.png)


    In the last chapter, we studied inheritance which is one of the building blocks
    of object oriented programming. In this chapter, we will discuss Polymorphism
    which is another important concept in object oriented programming. We will also
    briefly review encapsulation which is considered the third pillar of object oriented
    programming.


    | ![image](d2d_images/chapter_title_corner_decoration_left.png) |  | ![image](d2d_images/chapter_title_corner_decoration_right.png)
    |


    ![image](d2d_images/chapter_title_above.png)


    # Polymorphism


    ![image](d2d_images/chapter_title_below.png)


    Polymorphism means having multiple forms. In terms of object oriented programming,
    polymorphism refers to the ability of an object to behave in different ways.


    In C#, there are two ways to implement polymorphism: via method overloading and
    via method overriding.


    | ![image](d2d_images/chapter_title_corner_decoration_left.png) |  | ![image](d2d_images/chapter_title_corner_decoration_right.png)
    |


    ![image](d2d_images/chapter_title_above.png)


    # Polymorphism via Method Overloading


    ![image](d2d_images/chapter_title_below.png)


    Polymorphism can be implemented by overloading methods of a class. Such type of
    polymorphism is known as compile time or static polymorphism, since the logic
    for method overloading is evaluated at compile time.  We have already studied
    method overloading in a previous chapter.


    Let’s take a look at a very simple example of polymorphism via method overloading.


    Example1:


    using System;


    using System.Collections.Generic;


    using System.Linq;


    using System.Text;


    using System.Threading.Tasks;


    namespace MyProgram


    {


    class Program


    {


    static void Main(string[] args)


    {


    X x = new X();


    x.MethodA();


    x.MethodA(10);


    Console.ReadKey();


    }


    }


    class X


    {


    public void MethodA()


    {


    Console.WriteLine("This is method A in class X");


    }


    public void MethodA(int n)


    {


    Console.WriteLine("This is overloaded method A in class X");


    }


    }


