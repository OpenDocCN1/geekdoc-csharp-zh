    # Replacing a String


    ![image](d2d_images/chapter_title_below.png)


    A substring can be replaced by another string using the Replace() method. The
    first parameter to the replace() method is the string that you want to be replaced
    and the second parameter is the new string which you want to append in place of
    the string passed as the first parameter. Take a look at the following script:


    static void Main(string[] args)


    {


    string message1 = "HELLO TO C#";


    string message2 = message1.Replace("C#", "JAVA");


    Console.WriteLine(message2);


    Console.ReadKey();


    }


