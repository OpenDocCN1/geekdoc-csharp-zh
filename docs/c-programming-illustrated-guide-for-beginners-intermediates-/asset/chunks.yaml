    # Traversing Arrays with foreach loop


    ![image](d2d_images/chapter_title_below.png)


    The foreach loop is a loop that iterates exactly the same number of times as the
    number of items in an array. The foreach loop is the most recommended way of iterating
    through arrays in C#. Take a look at the following script:


    ```csharp

    using System;


    using System.Collections.Generic;

    using System.Linq;

    using System.Text;

    using System.Threading.Tasks;


    namespace MyProgram


    {


    class Program

    {


    static void Main(string[] args)

    {


    string[] colors = { "red", "green", "blue", "yellow", "green" };


    ––––––––


    ![image](d2d_images/scene_break.png)


    foreach (string color in colors)


    {


    Console.WriteLine(color);


    }


    Console.ReadKey();


    }


    }

    }

    ```


    In the script above, we use a foreach loop to traverse through the `colors` array.
    Pay close attention to the foreach loop part.


    For every iteration in the foreach loop, the corresponding array element is stored
    in a temporary variable which is “color” in the above case. The `color` variable
    will hold items from the `colors` array during each iteration. Inside the foreach
    loop, we simply print the value of the temporary `color` variable. The output
    of the above script looks like this:


    ![image](d2d_images/image046.png)


    | ![image](d2d_images/chapter_title_corner_decoration_left.png) |  | ![image](d2d_images/chapter_title_corner_decoration_right.png)
    |


    ![image](d2d_images/chapter_title_above.png)


    # Multidimensional Arrays


    ![image](d2d_images/chapter_title_below.png)


    Till now, we have studied one-dimensional array in this chapter, such arrays are
    called vectors in mathematics. We can have higher dimensional arrays as well.
    For instance, to create a two-dimensional array in C#, you can use the following
    syntax:


    ```csharp

    using System;


    using System.Collections.Generic;

    using System.Linq;

    using System.Text;

    using System.Threading.Tasks;


    namespace MyProgram


    {


    class Program

    {


    static void Main(string[] args)

    {


    int[,] identity = {


    { 1, 0, 0},

    { 0, 1, 0},

    { 0, 0, 1}

    };


    Console.WriteLine(identity[1, 1]);


    Console.ReadKey();


    }


    }

    }

    ```


    In the script above, we create a two-dimensional array which looks like an identity
    matrix ( A matrix where diagonal contains 1 while all the remaining indexes are
    0). This is a two-dimensional array. In a two dimensional array, every row is
    basically an individual array.


    To access the element in a two-dimensional array, you have to specify the value
    for the indexes of both the rows and columns. For instance, In the script above,
    we access the element from the first row index and first column index. Remember,
    arrays follow zero based indexing. Therefore, first row index, first column index
    actually means the element in the second row, second column which is 1\. In the
    output you should see 1 as shown below:


    ![image](d2d_images/image070.png)


    Loops can also be used to iterate through a two-dimensional arrays. For each dimension,
    you will need a dedicated for loop. For instance, to iterate through a two-dimensional
    or matrix array, you need two for loops. The outer for loop will iterate through
    each row in the two-dimensional array while the inner for loop will iterate through
    each element within that row. Let’s see how two for loops can be used to iterate
    through each element in the two-dimensional array. Execute the following script:


    ```csharp

    using System;


    using System.Collections.Generic;

    using System.Linq;

    using System.Text;

    using System.Threading.Tasks;


    namespace MyProgram


    {


    class Program

    {


    static void Main(string[] args)

    {


    int[,] identity = {


    { 1, 0, 0},

    { 0, 1, 0},

    { 0, 0, 1}

    };


    for (int i = 0; i < identity.GetLength(0); i++)


    {


    for (int j = 0; j < identity.GetLength(1); j++)


    {


    Console.Write(identity[i, j] + " ");


    }


    Console.WriteLine();


    }


    Console.ReadKey();


    }


    }

    }

    ```

