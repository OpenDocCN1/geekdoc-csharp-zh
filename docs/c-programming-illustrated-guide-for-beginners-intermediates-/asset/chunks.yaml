    # Chapter 15 – Collections in C#


    ![image](d2d_images/chapter_title_below.png)


    In a previous chapter, we studied arrays in detail. We know that arrays are used
    to store a collection of data in contagious memory locations. In addition to arrays,
    C# contains more specialized collections that are used to store data in a specific
    format. C# collections come in two formats: Generic Collections and Non-Generic
    collections. The name collection is by default used for non-generic collections.
    On the other hand, generic collections are simply called generics. In this chapter,
    we will study non-generic collections or simply known as collections.


    | ![image](d2d_images/chapter_title_corner_decoration_left.png) |  | ![image](d2d_images/chapter_title_corner_decoration_right.png)
    |


    ![image](d2d_images/chapter_title_above.png)


    # What are Collections?


    ![image](d2d_images/chapter_title_below.png)


    Collections are special data structures that store data in a specific format.
    The collections are stored in `System.Collections` namespace. All the collection
    classes inherit `IEnumerator`, `IEnumerable` and `ICollection` interfaces. The
    `IEnumerator` interface allows iteration over items in the collections. The `IEnumerable`
    interface is used to return the next item in the collection and the `ICollections`
    interface define general collection functions such as size definition etc.


    Following are the most commonly used classes in the `System.Collections` namespace:


    * `ArrayList`: An `ArrayList` collection is similar to the basic C# array. However,
    in case of `ArrayList`, you don’t have to specify the size of the `ArrayList`.

    * `SortedList`: `SortedList` stores item in the form of key and value pairs and
    by default sorts the item in ascending order of the keys.

    * `Stack`: A `Stack` follows principle of LIFO( Last in, First Out). The item
    inserted last will be removed first. The `Stack` has a method `Push()` which pushes
    the item on top of the stack. Similarly, it has a method `Pop()` which removes
    the data from the top of the stack.

    * `Queue`: A `queue` follows the principle of FIFO where the item inserted first
    is removed first.


    In this chapter, we will see these collections in detail.


