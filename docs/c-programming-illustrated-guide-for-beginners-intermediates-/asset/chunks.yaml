  raw: 'Let’s declare a function that accepts two integer type parameters. The first
    parameter is the amount and the second parameter is the percentage of the tax
    on that amount. The function value for the tax percentage and then prints that
    on the screen. Look at the following script:


    using System.Collections.Generic;


    using System.Linq;


    using System.Text;


    using System.Threading.Tasks;


    namespace MyProgram


    {


    class Program


    {


    static void Main(string[] args)


    {


    PrintTax(125, 20);


    Console.ReadKey();


    }


    public static void PrintTax(float amount, float percentage)


    {


    float tax = (percentage * amount) / 100;


    Console.WriteLine(tax);


    }


    }


    }


    In the script above, we declare a function called PrintTax(), which accepts two
    float type parameters: amount and percentage. Inside the function, the percentage
    of tax is calculated and printed using the Console function.


    In the function call to the PrintTax() function, the values for both the parameters
    are passed. The value for the amount is 125 and for percentage is 20\. In the
    result, you will see 25 since 20% of 125 is 25 as shown below:


    ![image](d2d_images/image049.png)


    | ![image](d2d_images/chapter_title_corner_decoration_left.png) |  | ![image](d2d_images/chapter_title_corner_decoration_right.png)
    |


    ![image](d2d_images/chapter_title_above.png)


    # Returning Values from a Function


    ![image](d2d_images/chapter_title_below.png)


    In addition to passing values to the function, we can also return values from
    a function. To do so, we need to make two changes in our script. The first change
    is that we need to change the return type of a function from void to the type
    of value that we want our function to return. The second change is that we need
    to add return keyword in our script which returns the actual value.


    Let’s see how we can modify the PrintTax() function so that it returns the value
    of the percentage of tax instead of directly printing it on the console:


    using System;


    using System.Collections.Generic;


    using System.Linq;


    using System.Text;


    using System.Threading.Tasks;


    namespace MyProgram


    {


    class Program


    {


    static void Main(string[] args)


    {


    float tax = PrintTax(125, 20);


    Console.WriteLine(tax);


    Console.ReadKey();


    }


    public static float PrintTax(float amount, float percentage)


    {


    float tax = (percentage * amount) / 100;


    return tax;


    }


    }


    }


    In the script above, the return type of the PrintTax() function has been changed
    to float and inside the function the tax variable is being returned using the
    return keyword. In the output, you will see 25 printed again on the console.


    | ![image](d2d_images/chapter_title_corner_decoration_left.png) |  | ![image](d2d_images/chapter_title_corner_decoration_right.png)
    |


    ![image](d2d_images/chapter_title_above.png)


    # Passing Variable By Reference and By Value


    ![image](d2d_images/chapter_title_below.png)


    There are two ways that you can pass values to the function parameters: by value
    and by reference.


    | ![image](d2d_images/chapter_title_corner_decoration_left.png) |  | ![image](d2d_images/chapter_title_corner_decoration_right.png)
    |


    ![image](d2d_images/chapter_title_above.png)


    # Passing by Value


    ![image](d2d_images/chapter_title_below.png)


    When data is passed to the function by value, the copies of the data passed are
    created inside the function and the original values are not changed. All the primitive
    data types are passed by values in C#. Let’s see an example of how data can be
    passed by value in C#:


    using System;


    using System.Collections.Generic;


    using System.Linq;


    using System.Text;


    using System.Threading.Tasks;


    namespace MyProgram


    {


    class Program


    {


    static void Main(string[] args)


    {


    int num1 = 10;


    int num2 = 20;


    Console.WriteLine("Numbers before function call {0} and {1}", num1, num2);


    PrintSquares(num1, num2);


    Console.WriteLine("Numbers after function call {0} and {1}", num1, num2);


    Console.ReadKey();


    }


    public static void PrintSquares (int a, int b)


    {


    a = a * a;


    b = b * b;


    Console.WriteLine("Squares are: {0} and {1}", a, b);


    }


    }


    }


    In the script above we declared two integer variables num1 and num2, we then pass
    these two variables as a parameter to the PrintSquares() function which takes
    squares of both the numbers and print them on the screen. In the code above we
    print the value of num1 and num2 variables before and after passing them to the
    PrintSquares() function. You will see that the values are not updated. This is
    because an integer is a primitive type and is passed as values. Inside the PrintSquares()
    function, a copy of these variables is created and the originally passed values
    are not updated. The output looks like this:


    ![image](d2d_images/image060.png)


    | ![image](d2d_images/chapter_title_corner_decoration_left.png) |  | ![image](d2d_images/chapter_title_corner_decoration_right.png)
    |


    ![image](d2d_images/chapter_title_above.png)


    # Passing by Reference


    ![image](d2d_images/chapter_title_below.png)


    When a variable is passed by reference to a function, the actual reference or
    the memory location is passed to the function. Any update on the reference, causes
    an update on the originally passed variable. All the custom types are passed by
    reference in C#. Arrays are also passed by reference. Let’s see an example of
    arrays being passed as reference:


    using System;


    using System.Collections.Generic;


    using System.Linq;


    using System.Text;


    using System.Threading.Tasks;


    namespace MyProgram


    {


    class Program


    {


    static void Main(string[] args)


    {


    int [] nums = { 10, 20 };


    Console.WriteLine("Numbers before function call {0} and {1}", nums[0], nums[1]);


    PrintSquares(nums);


    Console.WriteLine("Numbers after function call {0} and {1}", nums[0], nums[1]);


    Console.ReadKey();


    }


    public static void PrintSquares (int[] nums)


    {


    nums[0] = nums[0] * nums[0];


    nums[1] = nums[1] * nums[1];


    Console.WriteLine("Squares are: {0} and {1}", nums[0], nums[1]);


    }


    }


    }


    In the script above we pass an array as a parameter to the PrintSquares() function.
    Inside the function, we update the values of elements of the array. In the output
    you will see that the values are updated after the function call as shown below:


    ![image](d2d_images/image010.png)


    | ![image](d2d_images/chapter_title_corner_decoration_left.png) |  | ![image](d2d_images/chapter_title_corner_decoration_right.png)
    |


    ![image](d2d_images/chapter_title_above.png)


    # Conclusion


    ![image](d2d_images/chapter_title_below.png)


    In this chapter we covered functions. We saw what the different types of functions
    are and how to pass and return data from functions. The true power of functions
    comes from objects which we will see in the next chapter when we start our discussion
    about Object Oriented Programming (OOP).


    | ![image](d2d_images/chapter_title_corner_decoration_left.png) |  | ![image](d2d_images/chapter_title_corner_decoration_right.png)
    |


    ![image](d2d_images/chapter_title_above.png)


    # Chapter 9 – Object Oriented Programming in C#


    ![image](d2d_images/chapter_title_below.png)


    In the previous chapter, we completed our discussion about functions in C#. With
    that, we covered most of the fundamental C# programming concepts. Starting from
    this chapter, we will switch to more advanced C# concepts. In this chapter, we
    will start our discussion about Object Oriented Programming (OOP).'
