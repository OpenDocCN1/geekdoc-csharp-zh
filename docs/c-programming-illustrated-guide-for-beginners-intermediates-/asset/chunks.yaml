    # Encapsulation in Python


    ![image](d2d_images/chapter_title_below.png)


    In simple words, encapsulation refers to hiding the internal class data. As a
    rule of thumb, in object oriented programming, class data should not be directly
    accessible outside the class. Rather, a mechanism should be implemented that ensures
    secure access to the data. There are different ways to implement encapsulation
    in Python. In this chapter, we will study two of them.


    | ![image](d2d_images/chapter_title_corner_decoration_left.png) |  | ![image](d2d_images/chapter_title_corner_decoration_right.png)
    |


    ![image](d2d_images/chapter_title_above.png)


    # Encapsulation via Customized Methods


    ![image](d2d_images/chapter_title_below.png)


    One of the ways to implement encapsulation is by implementing customized methods
    that can be used to retrieve and set values for the class variables. Take a look
    at the following example to see how customized methods can be used for implementing
    encapsulation in C#.


    using System;


    using System.Collections.Generic;


    using System.Linq;


    using System.Text;


    using System.Threading.Tasks;


    namespace MyProgram


    {


    class Program


    {


    static void Main(string[] args)


    {


    Y y = new Y();


    y.seta("abc");


    y.setb("xyz");


    Console.WriteLine(y.geta());


    Console.WriteLine(y.getb());


    }


    }


    class Y


    {


    private string a;


    private string b;


    public string geta()


    {


    return a;


    }


    public void seta(string a)


    {


    this.a = a;


    }


    public string getb()


    {


    return b;


    }


    public void setb(string b)


    {


    this.b = b;


    }


    }


    } 


    In the example above, you can see that class Y has two member variables a and
    b and four methods geta(), getb() and seta(), and setb(). The geta() and getb()
    methods are used to retrieve the values of a and b variables, respectively. While
    the seta() and setb() methods are used to set the values of a and b variables
    respectively.


    | ![image](d2d_images/chapter_title_corner_decoration_left.png) |  | ![image](d2d_images/chapter_title_corner_decoration_right.png)
    |


    ![image](d2d_images/chapter_title_above.png)


    # Encapsulation via Properties


    ![image](d2d_images/chapter_title_below.png)


    Another way to implement encapsulation is via properties, which contain setters
    and getters by default. Take a look at the following example to see properties
    in action:


    using System;


    using System.Collections.Generic;


    using System.Linq;


    using System.Text;


    using System.Threading.Tasks;


    namespace MyProgram


    {


    class Program


    {


    static void Main(string[] args)


    {


    Y y = new Y();


    y.A = "abc";


    y.B = "xyz";


    Console.WriteLine(y.A);


    Console.WriteLine(y.B);


    Console.ReadKey();


    }


    }


    class Y


    {


    private string a;


    private string b;


    public string A


    {


    get


    {


    return this.a;


    }


    set


    {


    this.a = value;


    }


    }


    public string B


    {


    get


    {


    return this.b;


    }


    set


    {


    this.b = value;


    }


    }


    }


    }


