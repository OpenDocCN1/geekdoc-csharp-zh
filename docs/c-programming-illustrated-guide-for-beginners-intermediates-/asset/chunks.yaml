    # Finding String Length


    ![image](d2d_images/chapter_title_below.png)


    Length of a string is equal to a number of characters in a string including empty
    spaces. To find the length of a string in C#, you can either use the “length”
    attribute of string object or you can use Count() function. The following script
    explains both the ways:


    static void Main(string[] args)


    {


    string message1 = "HELLO TO C#";


    int length1 = message1.Length;


    int length2 = message1.Count();


    Console.WriteLine(length1);


    Console.WriteLine(length2);


    Console.ReadKey();


    }


