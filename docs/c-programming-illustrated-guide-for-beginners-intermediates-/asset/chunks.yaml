    \n![image](d2d_images/image008.png)\n\n| ![image](d2d_images/chapter_title_corner_decoration_left.png)\
    \ |  | ![image](d2d_images/chapter_title_corner_decoration_right.png) |\n\n![image](d2d_images/chapter_title_above.png)\n\
    \n# Constructor Overloading\n\n![image](d2d_images/chapter_title_below.png)\n\n\
    You can have more than one constructor per class. The names of all the constructors\
    \ will always be exactly the same as the name of the class; the difference lies\
    \ in the numbers and types of parameters. Having more than one constructor in\
    \ a class refers to constructor overloading. Let’s see this in action:\n\n```csharp\n\
    using System;\nusing System.Collections.Generic;\nusing System.Linq;\nusing System.Text;\n\
    using System.Threading.Tasks;\nnamespace MyProgram\n{\nclass Program\n{\n    static\
    \ void Main(string[] args)\n    {\n        // Creating Object of the Airplane\
    \ Class\n        AirPlane plane1 = new AirPlane(\"Airbus\", \"A-380\");\n    \
    \    AirPlane plane2 = new AirPlane();\n        // Accessing class members from\
    \ plane1 object\n        Console.WriteLine(plane1.planeMake);\n        Console.WriteLine(plane1.planeModel);\n\
    \        // Accessing class members from plane2 object\n        Console.WriteLine(plane2.planeMake);\n\
    \        Console.WriteLine(plane2.planeModel);\n        Console.ReadKey();\n \
    \   }\n}\n\nclass AirPlane\n{\n    public string planeMake;\n    public string\
