    \ |\n\n![image](img/chapter_title_above.png)\n\n# 第 14 章 – C# 中的文件处理\n\n![image](img/chapter_title_below.png)\n\
    \n向文件写入数据和从文件中读取数据是计算机应用程序最基础的任务之一。为了保持数据的持久化，我们需要将数据写入文件以便稍后读取。虽然数据库主要用于存储持久化数据，但平文件的重要性仍然不能忽视，特别是当你想要存储非结构化、无关联的数据时。在本节中，我们将学习如何使用\
    \ C# 进行文件处理。我们将学习各种访问、读取、写入和更新文件的方法。\n\n| ![image](img/chapter_title_corner_decoration_left.png)\
    \ |  | ![image](img/chapter_title_corner_decoration_right.png) |\n\n![image](img/chapter_title_above.png)\n\
