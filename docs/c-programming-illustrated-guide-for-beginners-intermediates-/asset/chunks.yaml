    # Polymorphism via Method Overriding


    ![image](d2d_images/chapter_title_below.png)


    Another way to implement polymorphism in C# is via method overriding. This type
    of polymorphism is also known as dynamic polymorphism. Before we actually see
    dynamic polymorphism in action, let’s first study method overriding.


    ## Method Overriding


    Method overriding refers to overriding the definition of a method in the parent’s
    class by providing a different definition in the child class. It is important
    to note that a method has to be declared `virtual` in the parent class in order
    for it to be overridden in the child class. To declare a method as `virtual`,
    the keyword `virtual` is used. In the child class, the keyword `override` is used
    to override the virtual method.


    Take a look at a simple example of method overriding.


    ```csharp

    using System;

    using System.Collections.Generic;

    using System.Linq;

    using System.Text;

    using System.Threading.Tasks;

    namespace MyProgram

    {

    class Program

    {

    static void Main(string[] args)

    {

    Y y = new Y();

    y.MethodA();

    X x = new X();

    x.MethodA();

    Console.ReadKey();

    }

    }

    class Y

    {

    public virtual void MethodA()

    {

    Console.WriteLine("This is a virtual method in the parent class");

    }

    }

    class X:Y

    {

    public override void MethodA()

    {

    Console.WriteLine("This is an overriden method in the child class");

    }

    }

    }

    ```


    In the script above, we have two classes `Y` and `X`. The class `X` inherits the
    class `Y`. In the class `Y` we have a virtual method `MethodA` and inside class
    `X` we also have a `MethodA` which overrides the parent class method. In the `Main`
    method of the `Program` class, we create objects of parent class `Y` and child
    class `X`. Now, if you call the `MethodA` from the object of the child class `X`,
    you will see that the overridden method will be executed. However, if you call
    the `MethodA` using the object of class `Y`, you will see that the parent class
    `Y`’s `MethodA` will be executed. The output of the script above looks like this:


    ![image](d2d_images/image017.png)


    ### Storing Child Class Object in Parent Class Reference


    Before we can actually see Polymorphism in action, it is important to understand
    that an object of child class can be stored in Parent class variable or reference.
    Take a look at the following script:


    ```csharp

    using System;

    using System.Collections.Generic;

    using System.Linq;

    using System.Text;

    using System.Threading.Tasks;

    namespace MyProgram

    {

    class Program

    {

    static void Main(string[] args)

    {

    Y y = new Y();

    y.MethodA();

    Y x = new X();

    y.MethodA();

    Console.ReadKey();

    }

    }

    class Y

    {

    public virtual void MethodA()

    {

    Console.WriteLine("This is a virtual method in the parent class");

    }

    }

    class X:Y

    {

    public override void MethodA()

    {

    Console.WriteLine("This is an overriden method in the child class");

    }

    }

    }

    ```


    The script above is a slight modification of the previous example. Here in the
    `Main` method of the `Program` class, you can see that the object reference `x`
    is actually of type `Y` which is the parent class of `X`. However the object of
    class `X` is being stored in the reference of class `Y`. This shows that child
    class object can be stored in the parent class reference.


    | ![image](d2d_images/chapter_title_corner_decoration_left.png) |  | ![image](d2d_images/chapter_title_corner_decoration_right.png)
    |


