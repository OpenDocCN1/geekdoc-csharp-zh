    # 1\. Arithmetic Operators


    ![image](d2d_images/chapter_title_below.png)


    Arithmetic operators in C# are used to perform mathematical operations on numeric
    data. They are similar to real-world arithmetic operators. Suppose, you have two
    variables x= 30 and y = 20, the following table demonstrates how different arithmetic
    operators function.


    | Operator | Symbol | Description | Example |


    | Addition | + | Adds the two numbers and concatenates two strings | x + y = 50“Good”
    + “Luck”= “Good Luck” |


    | Subtraction | -![image](d2d_images/scene_break.png) | Subtracts the two numbers
    | x – y = 10 |


    | Multiplication | *![image](d2d_images/scene_break.png) | Multiplies the two
    numbers | x * y = 600 |


    | Division | / | Divides the number in numerator by the one in the denominator
    | x / y = 1.5 |


    | Increment | ++ | Increases a number by 1 | x++ = 31 |


    | Decrement | —![image](d2d_images/scene_break.png) | Decreases a number by 1
    | x—= 29 |


    | Modulus | % | Divide the two numbers and returns the remainder | x % y = 10
    |


    using System;


    using System.Collections.Generic;


    using System.Linq;


    using System.Text;


    using System.Threading.Tasks;


    namespace MyProgram


    {


    class Program


    {


    static void Main(string[] args)


    {


    int x = 30;


    int y = 20;


    Console.WriteLine("Addition of " + x + " and " + y + " : " + (x + y));


    Console.WriteLine("Subtraction of " + x + " and " + y + " : " + (x - y));


    Console.WriteLine("Multiplication of " + x + " and " + y + " : " + (x * y));


    Console.WriteLine("Division of " + x + " and " + y + " : " + (x / y));


    Console.WriteLine("Increment of " + x + " : " + (++x));


    x = 30;


    Console.WriteLine("Decrement of " + x + " : " + (—x));


    x = 30;


    Console.WriteLine("Modulus of " + x + " and " + y + " : " + (x % y));


    Console.ReadKey();


    }


    }


    }


    The output of the script above looks like this:


    ![image](d2d_images/image045.png)


    It is important to mention here the difference between ++x and x++. If the increment
    or decrement operator precedes the operand, then the increment or decrement is
    performed and then the incremented and decremented value is used in the expression.
    On the other hand, if the increment operator proceeds the operand, the operand
    is first used in the expression and then incremented. The following script explains
    the difference.


    using System;


    using System.Collections.Generic;


    using System.Linq;


    using System.Text;


    using System.Threading.Tasks;


    namespace MyProgram


    {


    class Program


    {


    static void Main(string[] args)


    {


    int x = 30;


    ––––––––


    ![image](d2d_images/scene_break.png)


    Console.WriteLine(++x);


    x = 30;


    Console.WriteLine(x++);


    Console.WriteLine(x++);


    Console.ReadKey();


    }


    }


    }


    In the script above, an integer variable x is assigned a value of 30. It is then
    incremented using ++x and displayed on the screen. You will see 31 printed on
