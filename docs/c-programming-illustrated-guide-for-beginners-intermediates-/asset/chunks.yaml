    # Adding Elements to an ArrayList


    ![image](d2d_images/chapter_title_below.png)


    You can use `Add()`, `AddRange()` and `Insert()` methods to add elements to an
    `ArrayList`. The `Add()` and `AddRange()` methods add the elements at the end,
    while the `Insert()` method inserts the element at the specified index. Look at
    the following example:


    ```cs

    using System;


    using System.Collections.Generic;

    using System.IO;

    using System.Linq;

    using System.Text;

    using System.Threading.Tasks;

    using System.Collections;


    namespace MyProgram


    {


    class Program

    {


    static void Main(string[] args)

    {


    ArrayList items = new ArrayList();

    items.Add("abc");

    items.Add(13);

    items.Add(true);


    IList nums = new ArrayList()

    {


    10, 20, 30

    };


    items.AddRange(nums);

    items.Insert(2, "False");


    foreach(var item in items)


    {


    Console.WriteLine(item);


    }


    Console.ReadLine();


    }


    }


    }

    ```


    In the script above, we create an `ArrayList` `items` and add a string, an integer,
    and a Boolean value into it. We then use `AddRange()` method to add three integers.
    Finally, we used `Insert()` method to insert a Boolean value `False` at the second
    index. Next, a `foreach` loop has is used to iterate through the ArrayList. The
    output of the script above looks like this:


    ![image](d2d_images/image074.png)


    In addition to `AddRange()`, you can also use `InsertRange()` function to add
    a range of elements to an array. The first parameter is the index where you want
    to insert the range and the second parameter is the list of elements to be added.


