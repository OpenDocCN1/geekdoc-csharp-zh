    # ReadAllLines()


    ![image](d2d_images/chapter_title_below.png)


    Another way to read the contents of a file is by using `ReadAllLines()` method
    which returns an array of string where each string corresponds to one line in
    the text file. Take a look at the following script:


    ```csharp

    using System.Linq;

    using System.Text;

    using System.Threading.Tasks;

    namespace MyProgram

    {

    class Program

    {

    static void Main(string[] args)

    {

    if (File.Exists("D:/myfile.txt"))

    {

    string [] text = File.ReadAllLines("D:/myfile.txt");

    Console.WriteLine("The file has following content");

    foreach(string line in text)

    {

    Console.WriteLine(line);

    }

    }

    Console.ReadLine();

    }

    }

    }

    ```


    In the script above, we again first check if the file exists or not. If the file
    exists we use the `ReadAllLines()` method of the `File` class to read the contents
    of the file. The method takes file path as parameter and returns an array of string.
    Next, we use the `foreach` loop to iterate through all the lines in the text file.
    The output will look like:


    ![image](d2d_images/image054.png)


    | ![image](d2d_images/chapter_title_corner_decoration_left.png) |  | ![image](d2d_images/chapter_title_corner_decoration_right.png)
    |


    ![image](d2d_images/chapter_title_above.png)


    # ReadLines()


    ![image](d2d_images/chapter_title_below.png)


    In addition to `ReadAllText()` and `ReadAllLines()`, the `File` class also contains
    a method `ReadLines()` which reads the content of the file line by line. The `ReadLines()`
    method should be preferred if the text file has a large number of data since `ReadLines()`
    method returns the line as soon as it reads it. On the other hand, the `ReadAllLines()`
    method first read all the lines from the text file and then return an array of
    all lines at once to the user. The return type of `ReadLines()` method is `IEnumerable<string>`.
    Take a look at the following script top see `ReadLines()` function in action.


    ```csharp

    using System;

    using System.Collections.Generic;

    using System.IO;

    using System.Linq;

    using System.Text;

    using System.Threading.Tasks;

    namespace MyProgram

    {

    class Program

    {

    static void Main(string[] args)

    {

    if (File.Exists("D:/myfile.txt"))

    {

    foreach(string line in File.ReadLines("D:/myfile.txt"))

    {

    Console.WriteLine(line);

    }

    }

    Console.ReadLine();

    }

    }

    }

    ```


    In the script above, you can see that as soon as a line of text is read, it is
    being displayed on the console using the `foreach` loop.


