    # Chapter 2 – Variables and Data Types


    ![image](d2d_images/chapter_title_below.png)


    Type safety is one of the most important features of C# language. In C#, the type
    of the data is specified at compile time which makes the application robust. In
    this chapter, we will see how C# handles a variety of data ranging from numbers
    to texts and dates to Boolean. However, before that, we will define what is a
    variable is.


    | ![image](d2d_images/chapter_title_corner_decoration_left.png) |  | ![image](d2d_images/chapter_title_corner_decoration_right.png)
    |


    ![image](d2d_images/chapter_title_above.png)


    # Variable


    ![image](d2d_images/chapter_title_below.png)


    A variable in C# is a code feature that is used to store data that is changed
    repeatedly. A variable in C# is similar to the variable in Mathematics to which
    a new value can be assigned, updated and deleted. Normally a variable is used
    to store data that is required throughout the application execution time. A type
    is associated with a variable. For instance, a variable that stores textual data
    in C#, cannot store numeric data. Similarly, if a variable stores a Boolean value
    i.e. true or false, you cannot store a numeric or text value to that variable.
    This is what makes C# strongly typed. A variable is declared in C# by simple prefixing
    the data type before the name of the variable. Throughout this book, we will make
    extensive use of the variables. But before that, we need to understand the different
    data types.


    | ![image](d2d_images/chapter_title_corner_decoration_left.png) |  | ![image](d2d_images/chapter_title_corner_decoration_right.png)
    |


    ![image](d2d_images/chapter_title_above.png)


    # Data Types


    ![image](d2d_images/chapter_title_below.png)


    C# data types have been divided into five categories. They are as follows:


    | ![image](d2d_images/chapter_title_corner_decoration_left.png) |  | ![image](d2d_images/chapter_title_corner_decoration_right.png)
    |


    ![image](d2d_images/chapter_title_above.png)


    # 1.  Numeric Types


    ![image](d2d_images/chapter_title_below.png)


    These types are used to store integer numbers. They include int, unint, long,
    ulong, sbyte, byte, short, ushort.


    The following table shows the value that these integer type variables can take
    along with their default values.


    | Data Type | Default | Min Value | Max Value |


    | sbyte | 0 | -128 | 127 |


    | byte | 0 | 0 | 255 |


    | short | 0 | -32768 | 32767 |


    | ushort | 0 | 0 | 65535 |


    | int | 0 | -2147483648 | 2147483647 |


    | uint | 0u | 0 | 4294967295 |


    | long | 0L | -9223372036854775808 | 9223372036854775807 |


    | ulong | 0u | 0 | 18446744073709551615 |


    | float | 0.0f | ±1.5×10-45 | ±3.4×1038 |


    | double | 0.0d | ±5.0×10-324 | ±1.7×10308 |


    | decimal | 0.0m | ±1.0×10-28 | ±7.9×1028 |


    |  |  |  |  |


    |  |  |  |  |


    |  |  |  |  |


    |  |  |  |  |


    Let’s take a simple example of integer type data. Execute the following script:


    using System;


    using System.Collections.Generic;


    using System.Linq;


    using System.Text;


    using System.Threading.Tasks;


    namespace MyProgram


    {


    class Program


    {


    static void Main(string[] args)


    {


    int age = 10;


    long balance = 5464646466;


    decimal weight = 55.5M;


    Console.Write("Age:" + age + "-  balance:" + balance + "  - weight" + weight);


    Console.ReadKey();


    }


    }


    }


    In the script above, we create three variables age, balance and weight. The first
    variable is integer type, the second variable is long type while the third variable
    is decimal type. We then print the three values on the console. The output looks
    like this:


