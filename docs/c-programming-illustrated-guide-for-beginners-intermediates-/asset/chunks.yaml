    {

    static void Main(string[] args)

    {

    SortedList slist = new SortedList();

    slist.Add(2, "Red");

    slist.Add(4, "Blue");

    slist.Add(5, "Green");

    slist.Add(1, "Orange");

    slist.Add(3, "Pink");

