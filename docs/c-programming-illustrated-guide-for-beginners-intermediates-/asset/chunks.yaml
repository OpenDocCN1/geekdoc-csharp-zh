    需要提到的是，OOP 并不是一种新技术，而是一种将计算机程序中的每个组件都以对象和类的形式进行实现的方法。考虑这样一个场景：你必须使用 OOP 原则开发一个飞行模拟器。第一个任务是识别飞行模拟器中的对象。对象是一个具有某些特征并能执行某些功能的实体。在飞行模拟器中，你脑海中第一个出现的可能对象应该是
    `Airplane`（飞机）。`Airplane` 具有一些特征，如 `make`（品牌）、`model`（型号）等。它还有一些功能，如 `start airplane`（启动飞机）、`stop
    the airplane`（停止飞机）、`take off`（起飞）、`land`（落地）等。因此，它是实现对象的理想候选。飞行模拟器的其他对象可以是飞行员、导弹等。


    同样值得提到，面向对象编程是一种通用编程原则，并不限于 `C#`。然而，在本章中，我们将看到如何在 `C#` 中实现 OOP。


