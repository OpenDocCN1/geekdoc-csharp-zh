    \ 的函数，它接受两个 `float` 类型参数：`amount` 和 `percentage`。在函数内部，使用 `Console` 函数计算并打印税率百分比。\n\
    \n在对 `PrintTax()` 函数的调用中，传递了两个参数的值。`amount` 的值为 `125`，`percentage` 的值为 `20`。在结果中，你将看到\
    \ 25，因为 125 的 20% 是 25，如下所示：\n\n![image](img/image049.png)\n\n| ![image](img/chapter_title_corner_decoration_left.png)\
