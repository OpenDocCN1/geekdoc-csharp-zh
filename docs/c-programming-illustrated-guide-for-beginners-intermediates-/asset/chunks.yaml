    # Chapter 5 – Conditional Statements in C#


    ![image](d2d_images/chapter_title_below.png)


    Conditional statements are programming constructs that are used to alter the execution
    path of the code depending upon certain conditions. Consider an example where
    you are asked to build an online ticketing app and you are told that if the user
    is a student,  he should be given a ticket at half price. On the other hand, if
    the user is not a student, sale the ticket at full price. Here the application
    is dependent on the condition that if the user is a student or not. Such conditional
    logic is implemented with the help of conditional statements.


    In C#, there are three types of conditional statements:


    1.  If Statements


    2.  If-else Statements


    3.  Switch Statements


    In this chapter, we will study each of the aforementioned conditional statements
    in detail.


    | ![image](d2d_images/chapter_title_corner_decoration_left.png) |  | ![image](d2d_images/chapter_title_corner_decoration_right.png)
    |


    ![image](d2d_images/chapter_title_above.png)


    # If statement


    ![image](d2d_images/chapter_title_below.png)


    The “if” statement is simplest of the conditional statement. It has two possible
    return values: true or false. It returns true if the condition satisfies, else
    it returns false. The syntax of the “if” statement is simple:


    if(condition == true)


    // execute this


    ––––––––


    ![image](d2d_images/scene_break.png)


