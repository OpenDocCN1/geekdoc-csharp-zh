    );\n    }\n}\n}\n```\n\n在上面的脚本中，我们在 `AirPlane` 类中创建了一个构造函数。在构造函数内部，我们为 `planeMake`\
    \ 和 `planeModel` 变量赋值了一些值。你可以看到构造函数的名称与类名相同。然而，构造函数没有返回类型，甚至连 `void` 返回类型都没有。构造函数应该始终是\
    \ `public` 的，因为大多数时候类的对象是在另一个类内部创建的。上述脚本的输出如下：\n\n![image](img/image056.png)\n\
    \n| ![image](img/chapter_title_corner_decoration_left.png) |  | ![image](img/chapter_title_corner_decoration_right.png)\
    \ |\n\n![image](img/chapter_title_above.png)\n\n# 参数构造函数 (Parameterized Constructor)\n\
    \n![image](img/chapter_title_below.png)\n\n像方法一样，你也可以通过参数将数据传递给构造函数。这样的构造函数被称为参数构造函数。当你想要从类外部传递数据来初始化成员变量时，参数构造函数非常有用。请看以下示例：\n\
    \n```csharp\nusing System;\nusing System.Collections.Generic;\nusing System.Linq;\n\
    using System.Text;\nusing System.Threading.Tasks;\nnamespace MyProgram\n{\nclass\
    \ Program\n{\n    static void Main(string[] args)\n    {\n        // 创建 AirPlane\
    \ 类的对象\n        AirPlane plane1 = new AirPlane(\"Airbus\", \"A-380\");\n     \
    \   // 从 plane1 对象访问类成员\n        Console.WriteLine(plane1.planeMake);\n      \
    \  Console.WriteLine(plane1.planeModel);\n        // 从 plane1 对象访问类方法\n      \
    \  plane1.StartPlane();\n        plane1.StopPlane();\n        Console.ReadKey();\n\
    \    }\n}\n\nclass AirPlane\n{\n    public string planeMake;\n    public string\
    \ planeModel;\n    public AirPlane(string make, string model)\n    {\n       \
    \ planeMake = make;\n        planeModel = model;\n    }\n    public void StartPlane()\n\
    \    {\n        Console.WriteLine(\"Plane Started\");\n    }\n    public void\
    \ StopPlane()\n    {\n        Console.WriteLine(\"Plane Stopped\");\n    }\n}\n\
    }\n```\n\n在上面的脚本中，我们为 `AirPlane` 类创建了一个参数构造函数。该构造函数有两个参数：`make` 和 `model`，它们分别用于初始化两个成员变量\
    \ `planeMake` 和 `planeModel`。\n\n如果你查看 `Program` 类的 `Main` 方法，你可以看到当我们创建一个 `AirPlane`\
    \ 类的对象时，我们调用了参数构造函数并为构造函数传递了 `make` 和 `model` 参数的值。上述脚本的输出如下：\n\n![image](img/image008.png)\n\
    \n| ![image](img/chapter_title_corner_decoration_left.png) |  | ![image](img/chapter_title_corner_decoration_right.png)\
    \ |\n\n# 构造函数重载 (Constructor Overloading)\n\n![image](img/chapter_title_below.png)\n\
    \n你可以在一个类中拥有多个构造函数。所有构造函数的名称将始终与类名相同；区别在于参数的数量和类型。在一个类中拥有多个构造函数指的是构造函数重载。让我们来看实际操作：\n\
    \n```csharp\nusing System;\nusing System.Collections.Generic;\nusing System.Linq;\n\
    using System.Text;\nusing System.Threading.Tasks;\nnamespace MyProgram\n{\nclass\
