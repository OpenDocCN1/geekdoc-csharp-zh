    # Chapter 1 - Introduction


    ![image](d2d_images/chapter_title_below.png)


    C# is the Microsoft’s premier language for software development. Microsoft developed
    `C#` between 1999 and 2002. In the year 2002, the first version of `C#` was released
    to the general public as an integral part of the `.NET` framework. Since then
    `C#` has taken over Visual Basic as the default language of choice for `.NET`
    programmers.


    C# is one of the most powerful programming languages on the planet. Fully object-oriented
    and strongly typed, `C#` is currently being used for web development as backend
    language for `ASP.NET` web development framework. It is also widely being as backend
    language for Windows Forms and Windows Presentation Framework applications. In
    the world of mobile application development, `C#` is ruling the Windows Phone
    development arena.


    | ![image](d2d_images/chapter_title_corner_decoration_left.png) |  | ![image](d2d_images/chapter_title_corner_decoration_right.png)
    |


    ![image](d2d_images/chapter_title_above.png)


    # Salient Features of C#


    ![image](d2d_images/chapter_title_below.png)


    Following are some of the most important features that make `C#` so powerful and
    versatile:


    | ![image](d2d_images/chapter_title_corner_decoration_left.png) |  | ![image](d2d_images/chapter_title_corner_decoration_right.png)
    |


    ![image](d2d_images/chapter_title_above.png)


    ## 1. Object-Oriented Language


    ![image](d2d_images/chapter_title_below.png)


    C# is 99.9% object oriented. Like Java, apart from the primitive data types, everything
    in `C#` is an object. An object has some properties and can perform some functions.
    We will see object-oriented programming in detail in a future chapter. For now,
    just remember that it is the object-oriented programming owing to which `C#` is
    modular and maintainable.


    | ![image](d2d_images/chapter_title_corner_decoration_left.png) |  | ![image](d2d_images/chapter_title_corner_decoration_right.png)
    |


    ![image](d2d_images/chapter_title_above.png)


    ## 2. Strongly Types


    ![image](d2d_images/chapter_title_below.png)


    C# is a strongly typed language which means that you have to specify the type
    of data before the program compiles. This is also known as type-safety, which
    makes `C#` applications more robust and less prone to run-time errors.


    | ![image](d2d_images/chapter_title_corner_decoration_left.png) |  | ![image](d2d_images/chapter_title_corner_decoration_right.png)
    |


    ![image](d2d_images/chapter_title_above.png)


    ## 3. Automatic Garbage Collection


    ![image](d2d_images/chapter_title_below.png)


    In `C#, the garbage collection is performed automatically. After a certain amount
    of time, `.NET` framework runs garbage collector automatically which removes all
    the unused objects and dangling pointers from the memory.


    | ![image](d2d_images/chapter_title_corner_decoration_left.png) |  | ![image](d2d_images/chapter_title_corner_decoration_right.png)
    |


    ![image](d2d_images/chapter_title_above.png)


    ## 4. Easy to Learn


    ![image](d2d_images/chapter_title_below.png)


    Unlike C or C++, which are considered mid-level programming languages, `C#` is
    very high level. Most of the functionalities that require careful handling in
    C or C++ such as pointers and memory management are handled by default in `C#`.
    You can literally set yourself up and write a `C#` program in less than 10 minutes.


    | ![image](d2d_images/chapter_title_corner_decoration_left.png) |  | ![image](d2d_images/chapter_title_corner_decoration_right.png)
    |


    ![image](d2d_images/chapter_title_above.png)


    ## 5. Application Range


    ![image](d2d_images/chapter_title_below.png)


    Since C# is Microsoft’s premier programming language, almost every Microsoft technology
    depends upon it. For instance, `ASP.NET` framework runs `C#` as backend language,
    Windows Phone development also utilizes `C#` and, Windows Form and Windows Presentation
    Framework (WPF) also depend heavily on `C#`.


    | ![image](d2d_images/chapter_title_corner_decoration_left.png) |  | ![image](d2d_images/chapter_title_corner_decoration_right.png)
    |


    ![image](d2d_images/chapter_title_above.png)


    ## 6. Part of Visual Studio


    ![image](d2d_images/chapter_title_below.png)


    Microsoft’s Visual Studio is one of the most widely used IDEs in the world and
    `C#` is the part of Visual Studio languages which highlights the importance and
    power of the language.


