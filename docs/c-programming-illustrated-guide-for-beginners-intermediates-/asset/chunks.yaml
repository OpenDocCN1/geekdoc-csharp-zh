    \ newqueue.Enqueue(1.65);\n        Console.WriteLine(newqueue.Peek());\n     \
    \   Console.WriteLine(newqueue.Dequeue());\n        Console.WriteLine(newqueue.Count);\n\
    \        Console.ReadLine();\n    }\n}\n}\n```\n\n在上面的脚本中，我们使用 `Peek()` 方法返回第一个元素，结果将是“true”。接下来，我们使用\
    \ `Dequeue()` 方法返回第一个元素，结果将再次返回“true”，但它也会从列表中移除该第一个元素。接下来，我们统计 `Queue` 中的元素数量，由于已经删除了一个元素，现在数量应该是\
