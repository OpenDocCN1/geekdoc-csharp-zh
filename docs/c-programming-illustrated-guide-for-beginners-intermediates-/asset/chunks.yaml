    # Getting User Input


    ![image](d2d_images/chapter_title_below.png)


    There are multiple ways to get user input through console in C#. We will see some
    of them in this section.


    The ReadLine Function


    The ReadLine function is used to read complete user input.  Take a look at the
    following example:


    using System;


    using System.Collections.Generic;


    using System.Linq;


    using System.Text;


    using System.Threading.Tasks;


    namespace MyProgram


    {


    class Program


    {


    static void Main(string[] args)


    {


    Console.WriteLine("What is your  name:");


    string name = Console.ReadLine();


    Console.WriteLine("What is your city:");


    string location = Console.ReadLine();


    Console.WriteLine("Your name is {0} and you live in {1} ", name, location);


    Console.ReadKey();


    }


    }


    }


    When the above script is executed, the user will be prompted to enter his name.
    The user will enter his name and press enter. The ReadLine function executes which
    takes the user input and store it in the name variable. In the same way, the location
    of the user will be taken as input and stored in the location variable. Finally,
    both the name and location variables are printed on the console using the WriteLine
    function.


    The output of the script above looks like this:


    ![image](d2d_images/image014.png)


    Getting Integer Input


    Though string type data entered by the user as input can directly be used, integer
    and other types need to be converted to their corresponding types before they
    can be used. For instance, if a user enters an integer in response to the ReadLine
    function, that integer will be considered string. To perform arithmetic operations
    using that number, it first has to be converted into string type.


    Take a look at the following example:


    using System;


    using System.Collections.Generic;


    using System.Linq;


    using System.Text;


    using System.Threading.Tasks;


    namespace MyProgram


    {


    class Program


    {


    static void Main(string[] args)


    {


    Console.WriteLine("Enter the first Number:");


    int num1 = int.Parse( Console.ReadLine());


    Console.WriteLine("Enter the second Number:");


    int num2 = int.Parse(Console.ReadLine());


    int sum = num1 + num2;


    Console.WriteLine("The sum of the numbers {0} and {1} is: {2} :", num1, num2,
    sum  );


    Console.ReadKey();


    }


    }


    }


    In the script above, we use the int.Parse function to convert the number entered
    by the user from string to an integer. The user enters two numbers and the sum
    of the numbers is then printed on the console using the WriteLine function. The
    output of the script above looks like this:


