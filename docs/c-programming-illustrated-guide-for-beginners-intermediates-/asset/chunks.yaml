  raw: '![image](d2d_images/chapter_title_below.png)


    To access class members and methods using an object, you can simply use the object
    name followed by the dot operator (.) and the name of the public member of an
    object that you want to access. Take a look at the following script:


    using System;


    using System.Collections.Generic;


    using System.Linq;


    using System.Text;


    using System.Threading.Tasks;


    namespace MyProgram


    {


    class Program


    {


    static void Main(string[] args)


    {


    // Creating Object of the Airplane Class


    AirPlane plane1 = new AirPlane();


    // Accessing class members from plane1 object


    Console.WriteLine(plane1.planeMake);


    Console.WriteLine(plane1.planeModel);


    // Accessing class methods from plane1 object


    plane1.StartPlane();


    plane1.StopPlane();


    Console.ReadKey();


    }


    }


    class AirPlane


    {


    public string planeMake = "Airbus";


    public string planeModel = "A320";


    public void StartPlane()


    {


    Console.WriteLine("Plane Started");


    }


    public void StopPlane()


    {


    Console.WriteLine("Plane Stopped");


    }


    }


    }


    In the script above, we use the “plane1” object to display the value of the “planeMake”
    and “planeModel” variables. Similarly, we also executed the “StartPlane” and “StopPlane”
    methods by calling them using the “plane1” object. The output of the script above
    looks like this:


    ![image](d2d_images/image059.png)


    | ![image](d2d_images/chapter_title_corner_decoration_left.png) |  | ![image](d2d_images/chapter_title_corner_decoration_right.png)
    |


    ![image](d2d_images/chapter_title_above.png)


    # The Constructor


    ![image](d2d_images/chapter_title_below.png)


    A constructor is a method that executes automatically whenever an object of a
    class is created. In fact, when you create an object of a class, you use the new
    keyword followed by the name of the constructor. For instance, when we created
    “plane1” object using the syntax “new AirPlane()”, here “AirPlane()”is basically
    a constructor which is created by default when we created the “AirPlane” class.


    A constructor is normally used to initialize class variables. We can override
    default constructor and provide our own implantation of the constructor. Take
    a look at the following script:


    using System;


    using System.Collections.Generic;


    using System.Linq;


    using System.Text;


    using System.Threading.Tasks;


    namespace MyProgram


    {


    class Program


    {


    static void Main(string[] args)


    {


    // Creating Object of the Airplane Class


    AirPlane plane1 = new AirPlane();


    // Accessing class members from plane1 object


    Console.WriteLine(plane1.planeMake);


    Console.WriteLine(plane1.planeModel);


    // Accessing class methods from plane1 object


    plane1.StartPlane();


    plane1.StopPlane();


    Console.ReadKey();


    }


    }


    class AirPlane


    {


    public string planeMake;


    public string planeModel;


    public AirPlane()


    {


    planeMake = "Airbus";


    planeModel = "A350";


    }


    public void StartPlane()


    {


    Console.WriteLine("Plane Started");


    }


    public void StopPlane()


    {


    Console.WriteLine("Plane Stopped");


    }


    }


    }


    In the script above, we created a constructor in the “AirPlane” class. Inside
    the constructor, we assigned some values to the “planeMake” and “planeModel” variables.
    You can see that the name of the constructor is the same as the name of the class.
    However, a constructor has no return type, not even void return type. A constructor
    should always be public since most of the time an object of a class is being created
    inside another class. The output of the script above looks like this:


    ![image](d2d_images/image056.png)


    | ![image](d2d_images/chapter_title_corner_decoration_left.png) |  | ![image](d2d_images/chapter_title_corner_decoration_right.png)
    |


    ![image](d2d_images/chapter_title_above.png)


    # Parameterized Constructor


    ![image](d2d_images/chapter_title_below.png)


    Like methods, you can also pass data to the constructors via parameters. Such
    constructors are called parameterized constructors. Parameterized constructors
    are handy when you want to initialize member variables with the data passed from
    outside the class. Take a look at the following example:


    using System;


    using System.Collections.Generic;


    using System.Linq;


    using System.Text;


    using System.Threading.Tasks;


    namespace MyProgram


    {


    class Program


    {


    static void Main(string[] args)


    {


    // Creating Object of the Airplane Class


    AirPlane plane1 = new AirPlane("Airbus", "A-380");


    // Accessing class members from plane1 object


    Console.WriteLine(plane1.planeMake);


    Console.WriteLine(plane1.planeModel);


    // Accessing class methods from plane1 object


    plane1.StartPlane();


    plane1.StopPlane();


    Console.ReadKey();


    }


    }


    class AirPlane


    {


    public string planeMake;


    public string planeModel;


    public AirPlane(string make, string model)


    {


    planeMake = make;


    planeModel = model;


    }


    public void StartPlane()


    {


    Console.WriteLine("Plane Started");


    }


    public void StopPlane()


    {


    Console.WriteLine("Plane Stopped");


    }


    }


    }


    In the script above, we have a parameterized constructor for the “AirPlane” class.
    The constructor has two parameters: make and model, which are used to initialize
    the two member variables “planeMake” and “planeModel” respectively.


    If you look at the “Main” method of the “Program” class, you can see that when
    we create an object of the “AirPlane” class, we call the parameterized constructor
    and pass the value for the “make” and “model” parameters for the constructor.
    The output of the script above looks like this:


    ![image](d2d_images/image008.png)


    | ![image](d2d_images/chapter_title_corner_decoration_left.png) |  | ![image](d2d_images/chapter_title_corner_decoration_right.png)
    |


    ![image](d2d_images/chapter_title_above.png)


    # Constructor Overloading


    ![image](d2d_images/chapter_title_below.png)


    You can have more than one constructor per class. The names of all the constructors
    will always be exactly the same as the name of the class; the difference lies
    in the numbers and types of parameters. Having more than one constructor in a
    class refers to constructor overloading. Let’s see this in action:


    using System;


    using System.Collections.Generic;


    using System.Linq;


    using System.Text;


    using System.Threading.Tasks;


    namespace MyProgram


    {


    class Program


    {


    static void Main(string[] args)


    {


    // Creating Object of the Airplane Class


    AirPlane plane1 = new AirPlane("Airbus", "A-380");


    AirPlane plane2 = new AirPlane();


    // Accessing class members from plane1 object


    Console.WriteLine(plane1.planeMake);


    Console.WriteLine(plane1.planeModel);


    // Accessing class members from plane2 object


    Console.WriteLine(plane2.planeMake);


    Console.WriteLine(plane2.planeModel);


    Console.ReadKey();


    }


    }


    class AirPlane


    {


    public string planeMake;


    public string planeModel;


    public AirPlane(string make, string model)


    {


    planeMake = make;


    planeModel = model;


    }


    public AirPlane()


    {


    planeMake = "Lockhead Martin";


    planeModel = "F-16";


    }


    public void StartPlane()


    {


    Console.WriteLine("Plane Started");


    }


    public void StopPlane()


    {


    Console.WriteLine("Plane Stopped");


    }


    }


    }


    In the script above, we have two constructors in our “AirPlane” class, one of
    the constructors is parameterized while the other constructor doesn’t accept any
    parameters.


    In the “Main” method, we create two objects of the “AirPlane” class: plane1 and
    plane2\. The former is created using the parameterized constructor while the latter
    is created using the simple non-parameterized constructor. The output of the script
    above looks like this:


    ![image](d2d_images/image029.png)


    | ![image](d2d_images/chapter_title_corner_decoration_left.png) |  | ![image](d2d_images/chapter_title_corner_decoration_right.png)
    |


    ![image](d2d_images/chapter_title_above.png)


    # Conclusion


