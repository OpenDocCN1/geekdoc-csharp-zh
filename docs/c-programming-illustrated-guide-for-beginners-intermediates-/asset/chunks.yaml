    # 第 15 章 – C# 中的集合


    ![image](img/chapter_title_below.png)


    在之前的一个章节中，我们详细学习了数组。我们知道数组用于在连续的内存位置存储数据集合。除了数组外，C# 还包含更专门的集合，用于以特定格式存储数据。C# 集合有两种格式：泛型集合（Generic
    Collections）和非泛型集合（Non-Generic collections）。`collection` 名称默认用于非泛型集合。另一方面，泛型集合简单称为泛型（generics）。在本章中，我们将学习非泛型集合，简单称为集合。


    | ![image](img/chapter_title_corner_decoration_left.png) |  | ![image](img/chapter_title_corner_decoration_right.png)
    |


    ![image](img/chapter_title_above.png)


    # 什么是集合？


    ![image](img/chapter_title_below.png)


    集合是以特定格式存储数据的特殊数据结构。集合存储在 `System.Collections` 命名空间中。所有的集合类都继承 `IEnumerator`、`IEnumerable`
    和 `ICollection` 接口。`IEnumerator` 接口允许对集合中的项进行迭代。`IEnumerable` 接口用于返回集合中的下一个项，而
    `ICollections` 接口定义了通用集合函数，如大小定义等。以下是 `System.Collections` 命名空间中最常用的类：


    * `ArrayList`：`ArrayList` 集合类似于基础 C# 数组。然而，在 `ArrayList` 的情况下，你不需要指定 `ArrayList`
    的大小。

    * `SortedList`：`SortedList` 以键值对的形式存储项，并默认按键的升序对项进行排序。

    * `Stack`：`Stack` 遵循 LIFO（后进先出）原则。最后插入的项将首先移除。`Stack` 有一个 `Push()` 方法可以将项推到栈顶。同样，它有一个
    `Pop()` 方法，可以从栈顶移除数据。

    * `Queue`：`queue` 遵循 FIFO（先进先出）原则，先插入的项首先移除。


    在本章中，我们将详细查看这些集合。


    | ![image](img/chapter_title_corner_decoration_left.png) |  | ![image](img/chapter_title_corner_decoration_right.png)
    |


    ![image](img/chapter_title_above.png)


