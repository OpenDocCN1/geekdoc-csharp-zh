    {

    Stack newstack = new Stack();

    newstack.Push(true);

    newstack.Push(20);

    newstack.Push("Hello");

    newstack.Push(1.56);

    Console.WriteLine(newstack.Count);

    Console.ReadLine();

    }

    }

    }

    ```


