  trans: "\n\n在我们查看异常如何发生和被处理之前，首先要明确一点：程序中发生的所有错误并不是异常。C# 程序中可能发生两种类型的错误：编译时错误和运行时错误。运行时错误被称为异常。\n\
    \n在转向运行时错误处理或异常之前，让我们简要回顾一下编译时错误。\n\n# 编译时错误\n\n编译时错误是在你编译程序时捕获的错误。例如，如果你忘记在 C#\
    \ 语句末尾添加分号，就会发生编译时错误并并你缺少分号。同样，如果你尝试在没有先导入其命名空间的情况下使用某个函数，编译器将抛出错误。下面的示例演示了编译时错误。\n\
    \n```csharp\nusing System;\nusing System.Collections.Generic;\nusing System.Linq;\n\
    using System.Text;\nusing System.Threading.Tasks;\nnamespace MyProgram\n{\nclass\
    \ Program\n{\nstatic void Main(string[] args)\n{ \nConsole.WriteLine(\"abcd\"\
    )\nWriteCSV(\"myfile.csv\");\nConsole.ReadKey();\n}\n}\n}\n```\n\n在上面的示例中，有两个错误。\n\
    \n在这一行中：\n`Console.WriteLine(\"abcd\")`\n末尾没有分号。在这一行中：\n`WriteCSV(\"myfile.csv\"\
    );`\n`WriteCSV` 函数不存在，且我们没有导入任何包含该函数的命名空间。\n\n当你尝试通过 Visual Studio 运行上述代码时，你将看到以下错误：\n\
    \n你可以清楚地看到，程序中的两个错误在程序运行之前就被捕获了。与运行时错误或异常相比，编译时错误的威胁性较小，因为它们可以在程序执行之前捕获。运行时错误或异常极其危险，因为除非程序实际运行，否则它们不会被捕获。\n\
    \n# 运行时错误（异常）\n\n异常发生在运行时。如果在程序执行过程中发生了系统无法处理的意外事件，就会抛出异常。例如，如果你尝试读取一个实际上不存在的文件，就会发生异常。这种错误在编译时是无法捕获，因为没有人能在编译时知道文件是否存在。让我们来看这种异常或运行时错误的运行。执行以下脚本：\n\
    \n```csharp\nusing System;\nusing System.Collections.Generic;\nusing System.IO;\n\
    using System.Linq;\nusing System.Text;\nusing System.Threading.Tasks;\nnamespace\
    \ MyProgram\n{\nclass Program\n{\nstatic void Main(string[] args)\n{\nTextReader\
    \ reader = new StreamReader(\"abc.txt\");\nConsole.ReadKey();\n}\n}\n}\n```\n\n\
    在上面的脚本中，使用了 `StreamReader` 来读取实际上不存在的文件 `\"abc.txt\"`。因此，当运行上述程序时，会抛出一个异常，如下所示：\n\
    \n异常的名称即 `FileNotFoundException` 是不言自喻的。\n\n# 异常是如何被处理的\n\n要理解异常处理，理解调用栈（call\
    \ stack）的概念是必要的。正如之前解释的那样，C# 程序从 `Main` 方法开始。在 `Main` 方法内部，我们可能会调用 `Method1`，然后它又调用\
    \ `Method2`，以此此类推，直到 `MethodN`。后调用的方法被放置在栈上，当方法执行完成时，方法会从栈中弹出。现在，如果 `MethodN`\
    \ 发生异常，C# 运行时会在 `MethodN` 中寻找异常处理器，如果在 `MethodN` 中没有找到异常处理器，它将在方法调用栈中的下一个方法中查找处理器。它会继续在栈中的后续方法中查找处理器，直到到达\
    \ `Main` 方法为止。如果在任何方法中找到了处理器，则执行处理器的代码，否则应用程序将崩溃。\n\n让我们来看看异常处理的运行。\n\n```csharp\n\
    using System;\nusing System.Collections.Generic;\nusing System.IO;\nusing System.Linq;\n\
    using System.Text;\nusing System.Threading.Tasks;\nnamespace MyProgram\n{\nclass\
    \ Program\n{\nstatic void Main(string[] args)\n{\ntry\n{\nMethod1();\n}\ncatch\
    \ (Exception e)\n{\nConsole.WriteLine(e.Message);\n}\nConsole.ReadKey();\n}\n\
    public static void Method1()\n{\nTextReader reader = new StreamReader(\"abc.txt\"\
    );\n}\n}\n}\n```\n\n### Try 块\n\n为了实现异常处理，将可能抛异常的代码封装在 `try` 块中。可以使用 `try` 关键字创建\
    \ `try` 块。在上面的脚本中，我们知道 `Method1()` 抛出异常，因此我们将对 `Method1()` 的调用封装在 `try` 块中。\n\n\
    ### Catch 块\n\n`catch` 块包含异常处理代码。`catch` 块必须紧随在 `try` 块之后。可以使用 `catch` 关键字创建 `catch`\
    \ 块。异常以异常对象的的形式抛出，其基类是 `Exception`。在 `catch` 块中，你可以捕获异常并在控制台上打印异常详情。在上面的脚本中，将发生如下所示的文件未异常：\n\
    \n### Finally 块\n\n`finally` 块跟在 `try` 或 `catch` 块（如果有）之后，无论是否发生异常都会执行。`finally`\
    \ 块通常用于释放抛出异常的对象所占资源。让我们修改上一个示例来查看 `finally` 块的工作。执行以下脚本：\n\n```csharp\nusing\
    \ System;\nusing System.Collections.Generic;\nusing System.IO;\nusing System.Linq;\n\
    using System.Text;\nusing System.Threading.Tasks;\nnamespace MyProgram\n{\nclass\
    \ Program\n{\nstatic void Main(string[] args)\n{\ntry\n{\nMethod1();\n}\ncatch\
    \ (Exception e)\n{\nConsole.WriteLine(e.Message);\n}\nfinally\n{\nConsole.WriteLine(\"\
    Try block executed\");\n}\nConsole.ReadKey();\n}\npublic static void Method1()\n\
    {\nTextReader reader = new StreamReader(\"abc.txt\");\n}\n}\n}\n```\n\n上述脚本的输出如下：\n\
    \n在上面的示例中，你会注意到抛出异常的代码实际上在 `Method1` 中（即读取文件的地方），但异常是在 `Main` 方法中被捕获的。这是因为 `Method1`\
    \ 内部没有 `try` 和 `catch` 块。\n\n让我们修改之前的示例，在 `Method1` 内部添加 `try` 和 `catch` 块，并查看异常是如何处理的。查看以下脚本：\n\
    \n```csharp\nusing System;\nusing System.Collections.Generic;\nusing System.IO;\n\
    using System.Linq;\nusing System.Text;\nusing System.Threading.Tasks;\nnamespace\
    \ MyProgram\n{\nclass Program\n{\nstatic void Main(string[] args)\n{\nMethod1();\n\
    Console.ReadKey();\n}\npublic static void Method1()\n{\ntry\n{\nTextReader reader\
    \ = new StreamReader(\"abc.txt\");\n}\ncatch (Exception e)\n{\nConsole.WriteLine(e.Message);\n\
    }\nfinally\n{\nConsole.WriteLine(\"Try block executed inside Method1\");\n}\n\
    }\n}\n}\n```\n\n上述脚本的输出如下：\n\n你可以清楚地看到异常是在 `Method1` 的 `catch` 块中被处理的。\n\n# 结论\n\
    \n"
- fmt: "\nHandling exceptions and errors is crucial to the seamless and successful\
    \ execution of a program. In this chapter, we saw what C# exceptions are, what\
    \ their different types are and how they can be handled using `try`, `catch` and\
    \ `finally` blocks. In the next chapter, we will start our discussion about string\
    \ handling in C#.\n\n# Chapter 13 – String Manipulation in C#\n\nA string is one\
    \ of the most important data type in any programming language. While integers\
    \ and decimals are useful for performing arithmetic operations, strings are extremely\
    \ useful for getting information from the user and displaying information to the\
    \ user. It is for this reason that we have dedicated a full chapter to string\
    \ manipulation in C#.\n\nIn this chapter, we will see the basics of C# strings\
    \ along with how they are created and what are some of the most commonly used\
    \ string function.\n\n# Creating a String\n\nA string is basically a sequence\
    \ of characters. In C#, strings are instances of `System.String` class. However,\
    \ we can simply declare a string using keyword `string` which is an alias for\
    \ `System.String`.\n\nThere are two main ways of creating a string. You can create\
    \ a string literal and store it in a string type variable variable shown below:\n\
    \n```csharp\nstatic void Main(string[] args)\n{\n    string color = \"red\";\n\
    \    Console.WriteLine(color);\n    Console.ReadKey();\n}\n```\n\nIn the output,\
    \ you should see string “red” displayed in the console window. It is important\
    \ to mention here that `string` is the only object that can be created without\
    \ the `new` keyword. In the above script, when you create an object literal “red”,\
    \ it basically creates a string type object and stores it in the `color` variable.\n\
    \nThere is a way to create a string object using the `new` keyword. Take a look\
    \ at the following example:\n\n```csharp\nstatic void Main(string[] args)\n{\n\
    \    char[] col = new char[] { 'b', 'l', 'u', 'e' };\n    string color = new string(col);\n\
    \    Console.WriteLine(color);\n    Console.ReadKey();\n}\n```\n\nIn the script\
    \ above, we create a character array `col`. We then use keyword `new` to call\
    \ the constructor of the `string` class and pass it the character type array and\
    \ in return, we get a string of all the characters in the character array. If\
    \ you execute the script above, you will see “blue” printed on the console.\n\n\
    Just to confirm that a string is actually an array of characters, let’s use the\
    \ for-each loop to iterate through string characters. Take a look at the following\
    \ script:\n\n```csharp\nstatic void Main(string[] args)\n{\n    string message\
    \ = \"C# is awesome\";\n    foreach(char c in message)\n    {\n        Console.WriteLine(c);\n\
    \    }\n    Console.ReadKey();\n}\n```\n\nIn the output, you should see characters\
    \ of the string displayed on a separate line as shown below:\n\n# Using Single\
    \ and Double Quotes\n\nTo use single and double quotes, you need to put a backward\
    \ slash before single and double quotes. Take a look at the following example:\n\
    \n```csharp\nstatic void Main(string[] args)\n{\n    string message = \"This is\
    \ Jame\\'s \\\"Car\\\"\";\n    Console.WriteLine(message);\n    Console.ReadKey();\n\
    }\n```\n\nOutput:\n\n# String Concatenation\n\nString concatenation refers to\
    \ joining two or more than two strings. In C#, there are two ways to join strings.\
    \ You can use the concatenation operator `+`, the `Join()` and the `Concat()`\
    \ methods. The following example demonstrates string concatenation in action:\n\
    \n```csharp\nstatic void Main(string[] args)\n{\n    string message1 = \"Welcome\
    \ to\";\n    string message2 = \" C#\";\n    string result1 = message1 + message2;\n\
    \    string result2 = string.Join(\" \", message1, message2);\n    string result3\
    \ = string.Concat(message1, message2);\n    Console.WriteLine(result1);\n    Console.WriteLine(result2);\n\
    \    Console.WriteLine(result3);\n    Console.ReadKey();\n}\n```\n\nIn the script\
    \ above, we have two strings `message1` and `message2`. In the first instance,\
    \ we use the plus operator to concatenate the two strings. Next, we use the `Join()`\
    \ function to concatenate the strings. It is important to mention that the first\
    \ parameter to the `join` function is actually the string which is used as a separator\
    \ between the two strings. The rest of the parameters are the strings to be concatenated.\
    \ Finally, the `Concat()` method also takes the string to join as parameters and\
    \ return a concatenated string.\n\n# Converting String to Lowercase and Uppercase\n\
    \nConverting a string into uppercase or lower case is another fundamental task\
    \ in string manipulation. Luckily, C# comes with `ToUpper()` and `ToLower()` methods\
    \ that can be used to convert a string to upper or lowercase respectively. Take\
    \ a look at the following example:\n\n```csharp\nstatic void Main(string[] args)\n\
    {\n    string message1 = \"HELLO TO C#\";\n    string message2 = \"it is the best\
    \ language\";\n    Console.WriteLine(message1.ToLower());\n    Console.WriteLine(message2.ToUpper());\n\
    \    Console.ReadKey();\n}\n```\n\nIn the script above we have an all uppercase\
    \ string in `message1` and an all lowercase string in `message2`. However, when\
    \ we display these strings on the console, we convert the uppercase string to\
    \ lowercase using the `ToLower()` method. Similarly, the all-lowercase string\
    \ is converted to an uppercase string using the `ToUpper()` method.\n\n# Finding\
    \ Substring\n\nA substring is a string within another string. C# has a variety\
    \ of methods that can be used to find the occurrence of a string within another\
    \ string, extracting a string, finding the index of a string and so on. In this\
    \ section, we will see some of the substring methods.\n\nTo see if a string exists\
    \ inside another string, we can use `IndexOf()` method as follows. Take a look\
    \ at the following example:\n\n```csharp\nstatic void Main(string[] args)\n{\n\
    \    string message1 = \"HELLO TO C#\";\n    int index1 = message1.IndexOf(\"\
    C#\");\n    int index2 = message1.IndexOf(\"Java\");\n    Console.WriteLine(index1);\n\
    \    Console.WriteLine(index2);\n    Console.ReadKey();\n}\n```\n\nIn the script\
    \ above we have a string “HELLO TO C#”. We use the `IndexOf()` method to first\
    \ check if the string contains “C#”. If the string is found, the `IndexOf()` method\
    \ returns the index of the starting position of the string being searched. The\
    \ starting position of the string “C#” in the string “HELLO TO C#” is 9. Next,\
    \ we again use the `IndexOf()` method to search for the string “Java”, however\
    \ since the string “HELLO TO C#” doesn’t contain a substring “Java”, the `IndexOf()`\
    \ method will return -1 which means that the string was not found.\n"
