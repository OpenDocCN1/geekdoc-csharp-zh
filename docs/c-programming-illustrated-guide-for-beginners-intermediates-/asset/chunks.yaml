    # 在 SortedList 中访问元素


    ![image](img/chapter_title_below.png)


    访问 `SortedList` 中的项有多种方法。简单的方法是将键作为索引传递给 `SortedList`，如下所示：


    ```csharp

    using System;

    using System.Collections.Generic;

    using System.IO;

    using System.Linq;

    using System.Text;

    using System.Threading.Tasks;

    using System.Collections;

    namespace MyProgram

    {


