    # Switch 语句


    ![image](img/chapter_title_below.png)


    当有大量条件需要检查时，`switch` 语句会非常有用。下面的示例演示了 switch 语句的使用：


    ```csharp

    using System;


    using System.Collections.Generic;

    using System.Linq;

    using System.Text;

    using System.Threading.Tasks;

    namespace MyProgram


    {


    class Program

    {


    static void Main(string[] args)

    {


    Console.WriteLine("Enter your favourite color");

    string color = Console.ReadLine();

    switch (color)

    {


    case "green":

    Console.WriteLine("You got 10 points");

    break;


    case "red":

    Console.WriteLine("You got 8 points");

    break;


    case "blue":

    Console.WriteLine("You got 6 points");

    break;


    case "yellow":

    Console.WriteLine("You got 4 points");

    break;


    case "pink":

    Console.WriteLine("You got 2 points");

    break;


    default:

    Console.WriteLine("You got 00 points");

    break;


    }


    Console.ReadKey();


    }


    }


    }

    ```


    `switch` 语句以关键字 `switch` 开始，后面跟着包含你想要比较的变量或值的左右括号。在 `switch` 语句内部有多个 `case` 语句。值与
    `switch` 语句中的值匹配的 `case` 将执行。


    在上面的脚本中，用户被要求输入其喜欢的颜色。颜色选择存储在 `color` 变量中并传递给 `switch` 语句。在 `switch` 语句内部，每个 `case`
    语句将其值与传递给 `switch` 语句的颜色进行比较；匹配颜色的 `case` 语句将被执行。`break` 关键字用于退出 `switch` 语句。上述代码的输出如下：


    ![image](img/image023.png)


    从输出可以看出，当用户输入颜色“red”时，对应“red”的 `case` 语句执行，并提示用户他获得了 8 分。


