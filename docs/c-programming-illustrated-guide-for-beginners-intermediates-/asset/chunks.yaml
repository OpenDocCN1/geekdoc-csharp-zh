    # Accessing Elements from Queue


    ![image](d2d_images/chapter_title_below.png)


    To access elements from a Queue, you can use Peek() or Dequeue() methods. The
    Peek() method returns the first element from the Queue, whereas Dequeue() removes
    and returns the first item from the Queue. Take a look at the following example.


    ––––––––


    ![image](d2d_images/scene_break.png)


    using System;


    using System.Collections.Generic;


    using System.IO;


    using System.Linq;


    using System.Text;


    using System.Threading.Tasks;


    using System.Collections;


    namespace MyProgram


    {


    class Program


    {


    static void Main(string[] args)


    {


    Queue newqueue = new Queue();


    newqueue.Enqueue(true);


    newqueue.Enqueue(10);


    newqueue.Enqueue("hello");


    newqueue.Enqueue(1.65);


    Console.WriteLine(newqueue.Peek());


    Console.WriteLine(newqueue.Dequeue());


    Console.WriteLine(newqueue.Count);


    Console.ReadLine();


    }


    }


    }


    In the script above, we use the Peek() method to return the first element which
    will be “true”. Next, we use the Dequeue() method to return the first element
    which will again return “true” but it will remove the first element from the list
    as well. Next, we count the number of elements in our Queue which should be 3
    now since one of the items have been removed.  The output of the script above
    looks like this:


    ![image](d2d_images/image005.png)


