    \ System.Linq;\nusing System.Text;\nusing System.Threading.Tasks;\n\nnamespace\
    \ MyProgram\n{\nclass Program\n{\n    static void Main(string[] args)\n    {\n\
    \        Y y = new Y();\n        y.seta(\"abc\");\n        y.setb(\"xyz\");\n\
    \        Console.WriteLine(y.geta());\n        Console.WriteLine(y.getb());\n\
    \    }\n}\nclass Y\n{\n    private string a;\n    private string b;\n    public\
    \ string geta()\n    {\n        return a;\n    }\n    public void seta(string\
    \ a)\n    {\n        this.a = a;\n    }\n    public string getb()\n    {\n   \
    \     return b;\n    }\n    public void setb(string b)\n    {\n        this.b\
    \ = b;\n    }\n}\n}\n```\n\n在上面的示例中，你可以看到类 `Y` 有两个成员变量 `a` 和 `b` 以及四个方法 `geta()`、`getb()`、`seta()`\
    \ 和 `setb()`。`geta()` 和 `getb()` 方法分别用于获取 `a` 和 `b` 变量的值。而 `seta()` 和 `setb()`\
    \ 方法分别用于设置 `a` 和 `b` 变量的值。\n\n| ![image](img/chapter_title_corner_decoration_left.png)\
    \ |  | ![image](img/chapter_title_corner_decoration_right.png) |\n\n![image](img/chapter_title_above.png)\n\
    \n# 通过属性实现封装\n\n![image](img/chapter_title_below.png)\n\n实现封装的另一种方法是通过属性，属性默认包含设置器（setters）和访问器（getters）。请看下面的示例以了解属性的作用：\n\
    \n```csharp\nusing System;\nusing System.Collections.Generic;\nusing System.Linq;\n\
    using System.Text;\nusing System.Threading.Tasks;\n\nnamespace MyProgram\n{\n\
    class Program\n{\n    static void Main(string[] args)\n    {\n        Y y = new\
    \ Y();\n        y.A = \"abc\";\n        y.B = \"xyz\";\n        Console.WriteLine(y.A);\n\
    \        Console.WriteLine(y.B);\n        Console.ReadKey();\n    }\n}\nclass\
    \ Y\n{\n    private string a;\n    private string b;\n    public string A\n  \
    \  {\n        get\n        {\n            return this.a;\n        }\n        set\n\
    \        {\n            this.a = value;\n        }\n    }\n    public string B\n\
    \    {\n        get\n        {\n            return this.b;\n        }\n      \
    \  set\n        {\n            this.b = value;\n        }\n    }\n}\n}\n```\n\n\
    上述脚本的输出如下：\n\n![image](img/image033.png)\n\n| ![image](img/chapter_title_corner_decoration_left.png)\
    \ |  | ![image](img/chapter_title_corner_decoration_right.png) |\n\n![image](img/chapter_title_above.png)\n\
    \n# 总结\n\n![image](img/chapter_title_below.png)\n\n多态和封装是面向对象编程的三大基柱之一，继承是第三大。我们在上一章学习了继承，在本章中我们学习了多态和封装。我们通过示例学习了多态的形式。最后我们讨论了如何实现封装。到此，我们完成了对面向对象编程的讨论。在下一章中，我们将看到\
    \ C# 中如何处理错误和异常。\n\n![image](img/chapter_title_corner_decoration_left.png) | \
    \ | ![image](img/chapter_title_corner_decoration_right.png) |\n\n![image](img/chapter_title_above.png)\n\
    \n# 第 12 章 – C# 中的异常处理\n\n![image](img/chapter_title_below.png)\n\n异常在 C# 中是停止程序执行的错误。有不同类型的异常，例如：除零异常，当整数被除以\
    \ 0 时发生。其他类型的异常包括索引越界异常，它在你尝试访问实际上不存在的数组索引时发生。异常处理是避免异常并防止计算机程序崩溃的机制。在本章中，我们将详细学习\
    \ C# 异常处理。\n\n"
- fmt: "\nBefore we see how exceptions occur and handled, let’s first make it clear\
    \ that all the errors that occur in a program are not exceptions. There are two\
    \ types of errors that may occur in C# program: Compile time errors and run time\
    \ errors. Run time errors are called exceptions.\n\nLet’s briefly review compile\
    \ time errors before we move to run time error handling or exceptions.\n\n# Compile\
    \ Time Errors\n\nCompile time errors are the errors which are caught when you\
    \ compile the program. For instance, if you forget to add a semi-colon at the\
    \ end of a C# statement, a compile time error will occur telling you that a semi\
    \ colon is missing. Similarly, if you try to use a function without first importing\
    \ its namespace, compiler will through an error. The following example demonstrates\
    \ compile time errors.\n\n```csharp\nusing System;\nusing System.Collections.Generic;\n\
    using System.Linq;\nusing System.Text;\nusing System.Threading.Tasks;\nnamespace\
    \ MyProgram\n{\nclass Program\n{\nstatic void Main(string[] args)\n{ \nConsole.WriteLine(\"\
    abcd\")\nWriteCSV(\"myfile.csv\");\nConsole.ReadKey();\n}\n}\n}\n```\n\nIn the\
    \ above example, there are two errors.\n\nIn the line:\n`Console.WriteLine(\"\
    abcd\")`\nThere is no semicolon at the end. And in the line:\n`WriteCSV(\"myfile.csv\"\
    );`\nThe `WriteCSV` function doesn’t exist and we did not import any namespace\
    \ that contains this function.\n\nWhen you try to run the above code via Visual\
    \ Studio, you will see the following errors:\n\nYou can clearly see that both\
    \ the errors in the program have been caught before the program runs. Compile\
    \ time errors are less threatening when compared to run time errors or exceptions,\
    \ since the former can be caught before the program executes. Runtime errors or\
    \ exceptions are extremely dangerous since they are not caught unless the program\
    \ actually runs.\n\n# Runtime Errors (Exceptions)\n\nExceptions occur at runtime.\
    \ If during the execution of a program an unexpected event occurs which cannot\
    \ be handled by a system, an exception is thrown. For instance, if you try to\
    \ read a file which doesn’t actually exist, an exception will occur. Such an error\
    \ cannot be caught at compile time since nobody knows at compile time whether\
    \ or not the file exists. Let’s see such exception or run time errors in action.\
    \ Execute the following script:\n\n```csharp\nusing System;\nusing System.Collections.Generic;\n\
    using System.IO;\nusing System.Linq;\nusing System.Text;\nusing System.Threading.Tasks;\n\
    namespace MyProgram\n{\nclass Program\n{\nstatic void Main(string[] args)\n{\n\
    TextReader reader = new StreamReader(\"abc.txt\");\nConsole.ReadKey();\n}\n}\n\
    }\n```\n\nIn the script above the `StreamReader` is used to read the file `\"\
    abc.txt\"` which actually doesn’t exit. Therefore, when the above program is run,\
    \ an exception is thrown as shown below:\n\nThe name of the exception i.e. `FileNotFoundException`\
    \ is self-explanatory.\n\n# How Exceptions are handled\n\nTo understand exception\
    \ handling, it is pertinent to understand the concept of call stack. As explained\
    \ earlier, a C# program starts from the `Main` method. Inside the `Main` method\
    \ we may call `Method1` which in turn calls `Method2` and so on up to `MethodN`.\
    \ The method that are called later are placed on the stack and when the method\
    \ execution completes, the methods are pulled out of the stack. Now If an exception\
    \ occurs in `MethodN`, the C#’s runtime looks for exception handler in `MethodN`,\
    \ if it doesn’t find exception handler in `MethodN`, it looks for the handler\
    \ on the next method down the method call stack. It keeps looking for handler\
    \ in the subsequent methods down the stack unless the `Main` method is reached.\
    \ If handler is found in any of the methods, the code for the handler executes,\
    \ else the application crashes.\n\nLet’s see exception handling in Action.\n\n\
    ```csharp\nusing System;\nusing System.Collections.Generic;\nusing System.IO;\n\
    using System.Linq;\nusing System.Text;\nusing System.Threading.Tasks;\nnamespace\
    \ MyProgram\n{\nclass Program\n{\nstatic void Main(string[] args)\n{\ntry\n{\n\
    Method1();\n}\ncatch (Exception e)\n{\nConsole.WriteLine(e.Message);\n}\nConsole.ReadKey();\n\
    }\npublic static void Method1()\n{\nTextReader reader = new StreamReader(\"abc.txt\"\
    );\n}\n}\n}\n```\n\n### The Try Block\n\nTo implement exception handling, the\
    \ code which is likely to throw exception is surrounded with a `try` block. The\
    \ `try` block can be created using `try` keyword. In the script above, we know\
    \ that `Method1()` can throw an exception, therefore we surrounded the call to\
    \ `Method1()` in `try` block.\n\n### The Catch Block\n\nThe `catch` block contains\
    \ the exception handling code. The `catch` block must immediately follow the `try`\
    \ block. The `catch` block is created using the `catch` keyword. The exception\
    \ is thrown in the form of exception object, the base class of which is `Exception`.\
    \ In the `catch` block, you can catch the exception and print the exception detail\
    \ on the console. In the script above, the file not found exception will occur\
    \ as shown below:\n\n### The Finally Block\n\nThe `finally` block follows the\
    \ `try` or `catch` block (if any) and executes irrespective of the exception.\
    \ The `finally` block is normally used to relieve the resources occupied by the\
    \ objects that threw exception. Let’s modify the last example to see the working\
    \ of `finally` block. Execute the following script:\n\n```csharp\nusing System;\n\
    using System.Collections.Generic;\nusing System.IO;\nusing System.Linq;\nusing\
    \ System.Text;\nusing System.Threading.Tasks;\nnamespace MyProgram\n{\nclass Program\n\
    {\nstatic void Main(string[] args)\n{\ntry\n{\nMethod1();\n}\ncatch (Exception\
    \ e)\n{\nConsole.WriteLine(e.Message);\n}\nfinally\n{\nConsole.WriteLine(\"Try\
    \ block executed\");\n}\nConsole.ReadKey();\n}\npublic static void Method1()\n\
    {\nTextReader reader = new StreamReader(\"abc.txt\");\n}\n}\n}\n```\n\nThe output\
    \ of the script above looks like this:\n\nIn the example above, you would have\
    \ noticed that the code that raises the exception is actually in `Method1` where\
    \ the file is being read, however the exception is being caught in the `Main`\
    \ method. This is because of the fact that there is no `try` and `catch` block\
    \ in the `Method1` itself.\n\nLet’s modify the previous example to add `try` and\
    \ `catch` block inside `Method1` and see how the exception is handled. Take a\
    \ look at the following script:\n\n```csharp\nusing System;\nusing System.Collections.Generic;\n\
    using System.IO;\nusing System.Linq;\nusing System.Text;\nusing System.Threading.Tasks;\n\
    namespace MyProgram\n{\nclass Program\n{\nstatic void Main(string[] args)\n{\n\
    Method1();\nConsole.ReadKey();\n}\npublic static void Method1()\n{\ntry\n{\nTextReader\
    \ reader = new StreamReader(\"abc.txt\");\n}\ncatch (Exception e)\n{\nConsole.WriteLine(e.Message);\n\
    }\nfinally\n{\nConsole.WriteLine(\"Try block executed inside Method1\");\n}\n\
    }\n}\n}\n```\n\nThe output of the script above looks like this:\n\nYou can clearly\
    \ see that the exception is being handled in the `catch` block of the `Method1`.\n\
    \n# Conclusion\n"
  raw: 'Before we see how exceptions occur and handled, let’s first make it clear
    that all the errors that occur in a program are not exceptions. There are two
    types of errors that may occur in C# program: Compile time errors and run time
    errors. Run time errors are called exceptions.


    Let’s briefly review compile time errors before we move to run time error handling
    or exceptions.


    | ![image](d2d_images/chapter_title_corner_decoration_left.png) |  | ![image](d2d_images/chapter_title_corner_decoration_right.png)
    |


    ![image](d2d_images/chapter_title_above.png)


    # Compile Time Errors


    ![image](d2d_images/chapter_title_below.png)


    Compile time errors are the errors which are caught when you compile the program.
    For instance, if you forget to add a semi-colon at the end of a C# statement,
    a compile time error will occur telling you that a semi colon is missing. Similarly,
    if you try to use a function without first importing its namespace, compiler will
    through an error. The following example demonstrates compile time errors.


    using System;


    using System.Collections.Generic;


    using System.Linq;


    using System.Text;


    using System.Threading.Tasks;


    namespace MyProgram


    {


    class Program


    {


    static void Main(string[] args)


    { 


    Console.WriteLine("abcd")


    WriteCSV("myfile.csv");


    Console.ReadKey();


    }


    }


    }


    In the above example, there are two errors.


    In the line:


    Console.WriteLine("abcd")


    There is no semicolon at the end. And in the line:


    WriteCSV("myfile.csv");


    The WriteCSV function doesn’t exist and we did not import any namespace that contains
    this function.


    When you try to run the above code via Visual Studio, you will see the following
    errors:


    ![image](d2d_images/image032.png)


    You can clearly see that both the errors in the program have been caught before
    the program runs. Compile time errors are less threatening when compared to run
    time errors or exceptions, since the former can be caught before the program executes.
    Runtime errors or exceptions are extremely dangerous since they are not caught
    unless the program actually runs.


    | ![image](d2d_images/chapter_title_corner_decoration_left.png) |  | ![image](d2d_images/chapter_title_corner_decoration_right.png)
    |


    ![image](d2d_images/chapter_title_above.png)


    # Runtime Errors (Exceptions)


    ![image](d2d_images/chapter_title_below.png)


    Exceptions occur at runtime. If during the execution of a program an unexpected
    event occurs which cannot be handled by a system, an exception is thrown. For
    instance, if you try to read a file which doesn’t actually exist, an exception
    will occur. Such an error cannot be caught at compile time since nobody knows
    at compile time whether or not the file exists. Let’s see such exception or run
    time errors in action. Execute the following script:


    using System;


    using System.Collections.Generic;


    using System.IO;


    using System.Linq;


    using System.Text;


    using System.Threading.Tasks;


    namespace MyProgram


    {


    class Program


    {


    static void Main(string[] args)


    {


    TextReader reader = new StreamReader("abc.txt");


    Console.ReadKey();


    }


    }


    }


    In the script above the StreamReader is used to read the file “abc.txt” which
    actually doesn’t exit. Therefore, when the above program is run, an exception
    is thrown as shown below:


    ![image](d2d_images/image003.png)


    The name of the exception i.e. “FileNotFoundException” is self-explanatory.


    | ![image](d2d_images/chapter_title_corner_decoration_left.png) |  | ![image](d2d_images/chapter_title_corner_decoration_right.png)
    |


    ![image](d2d_images/chapter_title_above.png)


    # How Exceptions are handled


    ![image](d2d_images/chapter_title_below.png)


    To understand exception handling, it is pertinent to understand the concept of
    call stack. As explained earlier, a C# program starts from the Main method. Inside
    the Main method we may call Method1 which in turn calls Method2 and so on up to
    MethodN. The method that are called later are placed on the stack and when the
    method execution completes, the methods are pulled out of the stack. Now If an
    exception occurs in MethodN, the C#’s runtime looks for exception handler in MethodN,
    if it doesn’t find exception handler in MethodN, it looks for the handler on the
    next method down the method call stack. It keeps looking for handler in the subsequent
    methods down the stack unless the Main method is reached. If handler is found
    in any of the methods, the code for the handler executes, else the application
    crashes.


    Let’s see exception handling in Action.


    using System;


    using System.Collections.Generic;


    using System.IO;


    using System.Linq;


    using System.Text;


    using System.Threading.Tasks;


    namespace MyProgram


    {


    class Program


    {


    static void Main(string[] args)


    {


    try


    {


    Method1();


    }


    catch (Exception e)


    {


    Console.WriteLine(e.Message);


    }


    Console.ReadKey();


    }


    public static void Method1()


    {


    TextReader reader = new StreamReader("abc.txt");


    }


    }


    }


    The Try Block


    To implement exception handling, the code which is likely to throw exception is
    surrounded with a try block. The try block can be created using try keyword. In
    the script above, we know that Method1() can throw an exception, therefore we
    surrounded the call to Method1() in try block.


    The Catch Block


    The catch block contains the exception handling code. The catch block must immediately
    follow the try block. The catch block is created using the catch keyword. The
    exception is thrown in the form of exception object, the base class of which is
    Exception. In the catch block, you can catch the exception and print the exception
    detail on the console. In the script above, the file not found exception will
    occur as shown below:


    ![image](d2d_images/image043.png)


    The Finally Block


    The finally block follows the try or catch block (if any) and executes irrespective
    of the exception. The finally block is normally used to relieve the resources
    occupied by the objects that threw exception. Let’s modify the last example to
    see the working of finally block. Execute the following script:


    using System;


    using System.Collections.Generic;


    using System.IO;


    using System.Linq;


    using System.Text;


    using System.Threading.Tasks;


    namespace MyProgram


    {


    class Program


    {


    static void Main(string[] args)


    {


    try


    {


    Method1();


    }


    catch (Exception e)


    {


    Console.WriteLine(e.Message);


    }


    finally


    {


    Console.WriteLine("Try block executed");


    }


    Console.ReadKey();


    }


    public static void Method1()


    {


    TextReader reader = new StreamReader("abc.txt");


    }


    }


    }


    The output of the script above looks like this:


    ![image](d2d_images/image002.png)


    In the example above, you would have noticed that the code that raises the exception
    is actually in Method1 where the file is being read, however the exception is
    being caught in the Main method. This is because of the fact that there is no
    try and catch block in the Method1 itself.


    Let’s modify the previous example to add try and catch block inside Method1 and
    see how the exception is handled. Take a look at the following script:


    using System;


    using System.Collections.Generic;


    using System.IO;


    using System.Linq;


    using System.Text;


    using System.Threading.Tasks;


    namespace MyProgram


    {


    class Program


    {


    static void Main(string[] args)


    {


    Method1();


    Console.ReadKey();


    }


    public static void Method1()


    {


    try


    {


    TextReader reader = new StreamReader("abc.txt");


    }


    catch (Exception e)


    {


    Console.WriteLine(e.Message);


    }


    finally


    {


    Console.WriteLine("Try block executed inside Method1");


    }


    }


    }


    }


    The output of the script above looks like this:


    ![image](d2d_images/image000.png)


    You can clearly see that the exception is being handled in the catch block of
    the Method1.


    | ![image](d2d_images/chapter_title_corner_decoration_left.png) |  | ![image](d2d_images/chapter_title_corner_decoration_right.png)
    |


    ![image](d2d_images/chapter_title_above.png)


    # Conclusion


    ![image](d2d_images/chapter_title_below.png)'
