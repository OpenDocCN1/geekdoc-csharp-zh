    # Conclusion


    ![image](d2d_images/chapter_title_below.png)


    Knowledge of C# operators is crucial if you want to learn advanced C# concepts.
    In this chapter, we studied some of the most commonly used C# operators with the
    help of different example. In the next chapter, we will see how we can make our
    C# application interactive by getting input from the user of the application.


    | ![image](d2d_images/chapter_title_corner_decoration_left.png) |  | ![image](d2d_images/chapter_title_corner_decoration_right.png)
    |


    ![image](d2d_images/chapter_title_above.png)


    # Chapter 4 –Getting User Input and Console Output


    ![image](d2d_images/chapter_title_below.png)


    The main purpose of a software application is to provide some service to the user.
    An application should be as much interactive as it can be in order to better facilitate
    the user interaction. One of the ways to make an application interactive is to
    take input from the user and present an output according to that input. In this
    chapter, we will study how we can get input from the user and display output to
    the user using the console window.


    | ![image](d2d_images/chapter_title_corner_decoration_left.png) |  | ![image](d2d_images/chapter_title_corner_decoration_right.png)
    |


    ![image](d2d_images/chapter_title_above.png)


    # Console Window


    ![image](d2d_images/chapter_title_below.png)


    A console window is a type of command line interface where the user enters commands
    via keyboards and the output is represented in the form of text on the same console
    window.  Let’s first discuss how data can be printed on the console and then we
    will see how we can get user input using the console window.


    | ![image](d2d_images/chapter_title_corner_decoration_left.png) |  | ![image](d2d_images/chapter_title_corner_decoration_right.png)
    |


    ![image](d2d_images/chapter_title_above.png)


    # Printing Data on Console


    ![image](d2d_images/chapter_title_below.png)


    There are two ways to print data on the console window. Either you can use program
    code that produces some content which can then be printed on the console or data
    can be read from a local file, database or over the network and then printed on
    the console. There are two main ways to print data on the console in C#: Write
    and WriteLine function.


