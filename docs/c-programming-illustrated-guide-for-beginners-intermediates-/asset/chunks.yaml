    \n# 从函数返回值\n\n![image](img/chapter_title_below.png)\n\n除了向函数传递值之外，我们还可以从函数返回值。为了做到这一点，我们需要对脚本进行两个更改。第一个更改是我们需要将函数的返回类型从\
    \ `void` 改为我们希望函数返回的值类型。第二个更改是我们需要在脚本中添加 `return` 关键字来返回实际的值。\n\n让我们看看如何修改 `PrintTax()`\
    \ 函数，使其返回税率百分比的值而不是直接将其打印到控制台上：\n\n```csharp\nusing System;\nusing System.Collections.Generic;\n\
