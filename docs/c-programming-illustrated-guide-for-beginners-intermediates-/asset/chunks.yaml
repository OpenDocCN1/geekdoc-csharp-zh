    \ script above looks like this:\n\n![image](d2d_images/image058.png)\n\n# Calling\
    \ Parent Class Constructor from Children Classes\n\nIn the previous examples,\
    \ we did not have parameterized constructors for parent and children classes.\
    \ What if we want to have parameterized constructors for the child as well as\
    \ parent classes? How will we pass data from child class constructor to parent\
    \ class constructor?\n\nTo do so the `base` function is used and the parent class\
    \ parameters are passed to this function. In the following example, the child,\
    \ as well as parent classes, have parameterized constructors. The `base` method\
    \ is being used to pass data for the constructor from children to parent class.\n\
    \n```csharp\nusing System;\nusing System.Collections.Generic;\nusing System.Linq;\n\
    using System.Text;\nusing System.Threading.Tasks;\n\nnamespace MyProgram\n{\n\n\
    class Program\n{\n\nstatic void Main(string[] args)\n{\n\n// Creating Object of\
    \ the CommercialPlane Class\nCommercialPlane plane1 = new CommercialPlane(\"Airbus\"\
    , \"A350\", 400 );\n// Creating Object of the CommercialPlane Class\nFighterPlane\
    \ plane2 = new FighterPlane(\"Lockhead Martin\", \"F-16\", 50);\n\n// Accessing\
    \ parent class members from plane1 object\nConsole.WriteLine(plane1.planeMake);\n\
    Console.WriteLine(plane1.planeModel);\n\n// Accessing parent class methods from\
    \ plane1 object\nplane1.StartPlane();\nplane1.StartPlane();\n\n// Accessing child\
    \ class members from plane1 object\nConsole.WriteLine(plane1.passengerCapacity);\n\
    \n// Accessing child class methods from plane1 object\nplane1.BoardPassenger();\n\
    \n// Accessing parent class members from plane2 object\nConsole.WriteLine(plane2.planeMake);\n\
    Console.WriteLine(plane2.planeModel);\n\n// Accessing parent class methods from\
    \ plane2 object\nplane1.StartPlane();\nplane1.StartPlane();\n\n// Accessing child\
    \ class members from plane2 object\nConsole.WriteLine(plane2.totalMissiles);\n\
    \n// Accessing child class methods from plane1 object\nplane2.FireMissile();\n\
    Console.ReadKey();\n}\n\n}\n\nclass AirPlane\n{\n\n    public string planeMake;\n\
