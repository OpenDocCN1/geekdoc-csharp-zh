    # 从 SortedList 中移除元素


    ![image](img/chapter_title_below.png)


    要从 `SortedList` 中移除元素，你可以同时使用 `Remove()` 和 `RemoveAt()` 函数。`Remove()` 函数接受要移除元素的键，而
    `RemoveAt()` 函数则接受索引。请看下面的脚本：


    ```csharp

    using System;

    using System.Collections.Generic;

    using System.IO;

    using System.Linq;

    using System.Text;

    using System.Threading.Tasks;

    using System.Collections;

    namespace MyProgram

    {


    class Program

    {

    static void Main(string[] args)

    {

    SortedList slist = new SortedList();

    slist.Add(2, "Red");

    slist.Add(4, "Blue");

    slist.Add(5, "Green");

    slist.Add(1, "Orange");

    slist.Add(3, "Pink");

    slist.Remove(1);

    slist.RemoveAt(0);

    for (int i = 0; i < slist.Count; i++)

    {

    Console.WriteLine("Key:" + slist.GetKey(i) + ", Value:" + slist.GetByIndex(i));

    }

    Console.ReadLine();

    }

    }

    }

    ```


    在上面的脚本中，我们首先移除了键为 1 的元素。接着，我们移除了索引 0 处的元素，基本上就是键为 2 的元素，因为在移除键 1 之后，键 2 的元素移动到了索引
    0。最后，我们在屏幕上打印剩余的元素。你将看到键为 3、4 和 5 的元素被打印在屏幕上。


    ![image](img/image031.png)


