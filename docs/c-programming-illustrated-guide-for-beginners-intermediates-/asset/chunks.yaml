    \ `return` 关键字返回了 `tax` 变量。在输出中，你将再次在控制台上看到出 25。\n\n| ![image](img/chapter_title_corner_decoration_left.png)\
    \ |  | ![image](img/chapter_title_corner_decoration_right.png) |\n\n![image](img/chapter_title_above.png)\n\
    \n# 按引用和按值传递变量\n\n![image](img/chapter_title_below.png)\n\n你有两种方式向函数参数传递值：按值传递和按引用。\n\
    \n| ![image](img/chapter_title_corner_decoration_left.png) |  | ![image](img/chapter_title_corner_decoration_right.png)\
    \ |\n\n![image](img/chapter_title_above.png)\n\n# 按值传递\n\n![image](img/chapter_title_below.png)\n\
    \n当数据按值传递给函数时，函数内部会创建所传递数据的副本，原始值不会发生改变。在 C# 中，所有基本数据类型都是按值传递的。让我们看看在 C# 中按值传递数据的示例：\n\
    \n```csharp\nusing System;\nusing System.Collections.Generic;\nusing System.Linq;\n\
    using System.Text;\nusing System.Threading.Tasks;\n\nnamespace MyProgram\n{\n\
