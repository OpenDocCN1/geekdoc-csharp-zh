    # 2.  Boolean Type


    ![image](d2d_images/chapter_title_below.png)


    The Boolean type variables can only have one of the two values: true and false.
    Let’s take a simple example of a Boolean variable:


    using System;


    using System.Collections.Generic;


    using System.Linq;


    using System.Text;


    using System.Threading.Tasks;


    namespace MyProgram


    {


    class Program


    {


    static void Main(string[] args)


    {


    bool comparison = 10 > 20;


    Console.WriteLine(comparison);


    comparison = 20 > 10;


    Console.WriteLine(comparison);


    Console.ReadKey();


    }


    }


    }


    In the script above we create a Boolean variable comparison. The variable can
    contain only true or false values. We then evaluated an expression where we say
    that 10 is greater than 20\. Since, this is not true, false will be stored in
    the comparison variable and will be printed on the console. Next, we evaluate
    the expression 20 is greater than 10 which will return true this time and hence
    true will be printed on the console. The output of the script above look likes
    this:


