    To access the elements of an array, you need to use the name of the array followed
    by opening and closing square brackets. Inside the pair of square brackets you
    need to specify the index of the element that you want to access. Suppose you
    have to access the second color from the `colors` array that you created in the
    last example, you can write the following script:


    ```csharp

    using System;


    using System.Collections.Generic;

    using System.Linq;

    using System.Text;

    using System.Threading.Tasks;


    namespace MyProgram


    {


    class Program

    {


    static void Main(string[] args)

    {


