    \        Console.WriteLine(plane1.planeModel);\n        // 从 plane2 对象访问类成员\n\
    \        Console.WriteLine(plane2.planeMake);\n        Console.WriteLine(plane2.planeModel);\n\
    \        Console.ReadKey();\n    }\n}\n\nclass AirPlane\n{\n    public string\
    \ planeMake;\n    public string planeModel;\n    public AirPlane(string make,\
    \ string model)\n    {\n        planeMake = make;\n        planeModel = model;\n\
    \    }\n    public AirPlane()\n    {\n        planeMake = \"Lockhead Martin\"\
    ;\n        planeModel = \"F-16\";\n    }\n    public void StartPlane()\n    {\n\
    \        Console.WriteLine(\"Plane Started\");\n    }\n    public void StopPlane()\n\
    \    {\n        Console.WriteLine(\"Plane Stopped\");\n    }\n}\n}\n```\n\n在上面的脚本中，我们在\
    \ `AirPlane` 类中有两个构造函数，其中一个构造函数是参数化的，而另一个构造函数不接受任何参数。\n\n"
- fmt: 'Object-Oriented Programming (OOP) is one of the most widely used programming
    approaches in the world. In this chapter, we studied the basics of object-oriented
    programming - we saw what OOP programming is, what its benefits are and how classes
    and objects are created. Finally, we rounded up our discussion with the introduction
    of the constructor and its types. In the next chapter, we will start our discussion
    about Inheritance which is one the fundamental pillars of OOP.


    # Chapter 10 – Inheritance in C#


    In the previous chapter, we started our discussion about Object Oriented Programming
    (OOP) in C#. In this chapter, we will study Inheritance which is one of the three
    fundamental pillars of object-oriented programming, with encapsulation and polymorphism
    being the other two.


    Inheritance in OOP is similar to real-world inheritance. In the real world, a
    child inherits some of the characteristics of its parents in addition to having
    his/her own unique characteristics. In programming, a class inherits characteristics
    of another class. A class that inherits another class is called child class or
    derived class. On the other hand, a class that is inherited by other classes is
    called a base class or parent class.


    As a rule of thumb, characteristics that are common in more than one classes should
    be packaged in the parent class while the characteristics unique to individual
    classes should be left intrinsic to the individual classes. It is important to
    mention here that when we talk about characteristics in inheritance, as a programming
    term, we talk about the member variables and the member methods of a class.


    Inheritance fosters code reusability and modularity. In this chapter, we will
    see inheritance in C#.


    # Inheritance: A Simple Example


    Before we see the actual C# code for inheritance, it is important to mention that
    Inheritance implements the IS-A relationship between the classes. For instance,
    a car is a vehicle; a bike is also a vehicle. A manager is an employee; a cashier
    is also an employee. To implement inheritance, the more general characteristics
    such as name, age, salary can be packaged in a parent `Employee` class, while
    more specialized characteristics such as a list of employees being managed can
    be added to the child `Manager` class.


    In the following example, we will create a parent class `AirPlane` and its child
    class `CommercialPlane`. The parent class `AirPlane` will have member variables
    `planeMake`, `planeModel` and member methods `StartPlane` and `StopPlane`. The
    class `CommercialPlane` will inherit the `AirPlane` class, therefore it will explicitly
    have the two member variables and the two methods of the parent class. In addition,
    we will add a variable `passengerCapacity` to the `CommercialPlane` class. We
    will also add a method `BoardPassenger` to the `CommercialPlane` class. We did
    not add the `passengerCapacity` variable and the `BoardPassenger` method to the
    parent `AirPlane` class since there can be another child class `FighterPlane`
    and fighter planes do not have any passengers. Therefore, we will implement the
    `passengerCapacity` variable and the `BoardPassenger` method in the child `CommercialPlane`
    class.


    Take a look at the following script:


    ```c

    using System;


    using System.Collections.Generic;

    using System.Linq;

    using System.Text;

    using System.Threading.Tasks;


    namespace MyProgram

    {


    class Program

    {

    static void Main(string[] args)

    {

    // Creating Object of the CommercialPlane Class

    CommercialPlane plane1 = new  CommercialPlane();


    // Accessing parent class members from plane1 object

    Console.WriteLine(plane1.planeMake);

    Console.WriteLine(plane1.planeModel);


    ––––––––


    // Accessing parent class methods from plane1 object

    plane1.StartPlane();

    plane1.StartPlane();


    // Accessing child class members from plane1 object

    Console.WriteLine(plane1.passengerCapacity);


    ––––––––


