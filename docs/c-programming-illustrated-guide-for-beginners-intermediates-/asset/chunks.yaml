    of the `CommercialPlane` class has been instantiated. Next, the values of the
    parent class have been printed on the console followed by a call to the parent
    method. You will see that the compiler will not give any error since parent variables
    are accessible to the child class. The script is executed.


    # Multiple Inheritance


    In C#, one-way multiple inheritance is possible, which means that one parent class
    can have multiple child classes. However, one child class cannot have multiple
    parents.


    In the previous section, we created `CommercialPlane` child class of the parent
