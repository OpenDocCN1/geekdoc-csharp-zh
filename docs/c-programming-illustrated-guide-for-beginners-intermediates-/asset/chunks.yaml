    # 向 ArrayList 添加元素


    ![image](img/chapter_title_below.png)


    你可以使用 `Add()`、`AddRange()` 和 `Insert()` 方法向 `ArrayList` 添加元素。`Add()` 和 `AddRange()`
    方法将元素添加在末尾，而 `Insert()` 方法在指定的索引处插入元素。查看以下示例：


    ```cs

    using System;


    using System.Collections.Generic;

    using System.IO;

    using System.Linq;

    using System.Text;

    using System.Threading.Tasks;

    using System.Collections;


    namespace MyProgram


    {


    class Program

    {


    static void Main(string[] args)

    {


    ArrayList items = new ArrayList();

    items.Add("abc");

    items.Add(13);

    items.Add(true);


    IList nums = new ArrayList()

    {


    10, 20, 30

    };


    items.AddRange(nums);

    items.Insert(2, "False");


    foreach(var item in items)


    {


    Console.WriteLine(item);


    }


    Console.ReadLine();


    }


    }


    }

    ```


    在上述脚本中，我们创建了一个 `ArrayList` `items` 并向其添加了一个字符串、一个整数和一个布尔值。然后我们使用 `AddRange()`
    方法添加了三个整数。最后，我们使用 `Insert()` 方法在第二个索引处插入了布尔值 `False`。接下来，使用 `foreach` 循环来遍历 ArrayList。上述脚本的输出如下：


    ![image](img/image074.png)


