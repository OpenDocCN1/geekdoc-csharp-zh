    面向对象编程（OOP）是世界上最广泛使用的编程方法之一。在本章中，我们学习了面向对象编程的基础知识——我们了解什么是 OOP 编程、它的优点，以及类和对象是如何创建的。最后，我们通过介绍构造函数及其类型结束了讨论。在下一章中，我们将开始讨论继承，这是
    OOP 的三大基本支柱之一。


    # 第 10 章 – C# 中的继承


    在上一节中，我们开始了关于在 C# 中面向对象编程（OOP）的讨论。在本章中，我们将学习继承，它是面向对象编程的三大支柱之一，封装和多态是另外两个。


    OOP 中的继承类似于现实世界中的继承。在现实世界中，孩子继承了父母的一些特征，同时也拥有自己独特的特征。在编程中，一个类继承另一个类的特征。继承另一个类的类被称为子类或派生类。另一方面，被其他类继承的类被称为基类或父类。


    根据通俗法则，多个类之间共有的特征应该封装在父类中，而每个类特有的特征则应该保留在各自的类中。在这里需要说明的是，当我们谈论继承中的特征时，作为一个编程术语，我们指的是类的成员变量和成员方法。


    继承促进了代码的重用和模块化。在本章中，我们将学习 C# 中的继承。


    # 继承：简单示例


    在查看实际的继承 C# 代码之前，重要的是提到继承实现了类之间的“是一种”（IS-A）关系。例如，汽车是一种车辆；自行车也是一种车辆。经理是一个员工；收银员也是员工。为了实现继承，可以将更通用的特征（如姓名、年龄、工资）封装在父类
    `Employee` 中，而将更具体的特征（如所管理的员工列表）添加到子类 `Manager` 中。


    在接下来的示例中，我们将创建一个父类 `AirPlane` 及其子类 `CommercialPlane`。父类 `AirPlane` 将具有成员变量 `planeMake`、`planeModel`
    以及成员方法 `StartPlane` 和 `StopPlane`。`CommercialPlane` 类将继承 `AirPlane` 类，因此它将显式地拥有父类的这两个成员变量两个方法。此外，我们为
    `CommercialPlane` 类添加了一个变量 `passengerCapacity`。我们还为 `CommercialPlane` 类添加了一个方法
    `BoardPassenger`。我们没有向父类 `AirPlane` 添加 `passengerCapacity` 变量和 `BoardPassenger`
    方法，因为可能存在另一个子类 `FighterPlane`，而战斗机没有乘客。因此，我们将在子类 `CommercialPlane` 中实现 `passengerCapacity`
    变量和 `BoardPassenger` 方法。


    ####看以下脚本：


    ```c

    using System;


    using System.Collections.Generic;

    using System.Linq;

    using System.Text;

    using System.Threading.Tasks;


    namespace MyProgram

    {


    class Program

    {

    static void Main(string[] args)

    {

    // Creating Object of the CommercialPlane Class

    CommercialPlane plane1 = new  CommercialPlane();


    // Accessing parent class members from plane1 object

    Console.WriteLine(plane1.planeMake);

    Console.WriteLine(plane1.planeModel);


    ––––––––


    // Accessing parent class methods from plane1 object

    plane1.StartPlane();

    plane1.StartPlane();


    // Accessing child class members from plane1 object

    Console.WriteLine(plane1.passengerCapacity);


    ––––––––


    // Accessing child class methods from plane1 object

    plane1.BoardPassenger();

    Console.ReadKey();

    }

    }


    class AirPlane

    {

    public string planeMake = "Boeing";

    public string planeModel=  "A330";


    ––––––––


    public void StartPlane()

    {

    Console.WriteLine("Plane Started");

    }


    public void StopPlane()

    {

    Console.WriteLine("Plane Stopped");

    }

    }


    class CommercialPlane: AirPlane

    {

    public int passengerCapacity = 180;

    public void BoardPassenger()

    {

    Console.WriteLine("Boarding Started");

    }

    }


    }

    ```


    在上面的脚本中，我们有三个类：包含 `Main` 方法的 `Program`、父类 `AirPlane` 以及继承 `AirPlane` 类的子类 `CommercialPlane`。


    你可以看到，要从一个类继承另一个类，只需要在子类名后添加冒号，并在冒号后添加父类的名称。


    在上面的脚本中，在 `Program` 类的 `Main` 方法中实例化了一个 `CommercialPlane` 类的对象 `plane1`。接下来，在控制台上打印了父类的值，然后调用了父方法。你会发现编译器不会给出任何错误，因为父类变量对子类是可的。脚本执行。


    # 多继承


    在 C# 中，单向多继承是可能的，这意味着一个父类可以有多个子类。然而，一个子类不能有多个父类。


    在上一节中，我们创建了父类 `AirPlane` 的子类 `CommercialPlane`。在本节中，我们将创建另一个名为 `FighterPlane`
    的子类，它有一个固有变量 `totalMissiles` 和一个方法 `FireMissile`。同样，这个成员变量和方法太具体了，因此我们无法在父类 `AirPlane`
    中声明它们。看下面的示例：


    ```csharp

    using System;


    using System.Collections.Generic;

    using System.Linq;

    using System.Text;

    using System.Threading.Tasks;


    namespace MyProgram

    {


    class Program

    {

    static void Main(string[] args)

    {

    // Creating Object of the CommercialPlane Class

    CommercialPlane plane1 = new  CommercialPlane();


    // Creating Object of the CommercialPlane Class

    FighterPlane plane2 = new FighterPlane();


    // Accessing parent class members from plane1 object

    Console.WriteLine(plane1.planeMake);

    Console.WriteLine(plane1.planeModel);


    ––––––––


    // Accessing parent class methods from plane1 object

    plane1.StartPlane();

    plane1.StartPlane();


    // Accessing child class members from plane1 object

    Console.WriteLine(plane1.passengerCapacity);


    ––––––––


    // Accessing child class methods from plane1 object

    plane1.BoardPassenger();


    ––––––––


    // Accessing parent class members from plane2 object

    Console.WriteLine(plane2.planeMake);

    Console.WriteLine(plane2.planeModel);


    ––––––––


    // Accessing parent class methods from plane2 object

    plane1.StartPlane();

    plane1.StartPlane();

    }

    }

    }

    ```

