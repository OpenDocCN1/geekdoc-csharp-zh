    # Chapter 7 – Arrays in C#


    ![image](d2d_images/chapter_title_below.png)


    In the previous chapter, we started our discussion about different types of iteration
    statements in C#. In this chapter, we will move a step forward and will start
    exploring C# Arrays. An array is the most fundamental programming data structure
    used to store a collection of data. 


    Imagine you have to store names of 100 students in your class. Without an array,
    you will have to declare 100 string type variables and then will have to individually
    store the name of the student in each variable. This can be problematic if you
    have thousands of records to store. The array is the solution to this problem.


    Arrays store collection of data of similar type on contagious memory locations.
    C# arrays are strongly typed which means that while defining an array, you also
    have to define the type of data that can be stored in that array. In this chapter,
    we will study arrays in detail.


    | ![image](d2d_images/chapter_title_corner_decoration_left.png) |  | ![image](d2d_images/chapter_title_corner_decoration_right.png)
    |


    ![image](d2d_images/chapter_title_above.png)


    # Creating an Array


    ![image](d2d_images/chapter_title_below.png)


    Creating an array, also known as declaring an array is very straightforward in
    C#. The syntax is as follows:


    type [] array_name


    To create an array, you start with the type of the elements that the array will
    contain followed by the opening and closing square brackets. The pair of square
    brackets signifies that the variable is an array.  After the square brackets,
    you have to give a name to the array. Notice at this point of time the memory
    for the array is not reserved. Here you only have defined an array type variable.


    To actually initialize an array, the following syntax is used:


    new type [integer]


    To initialize an array the keyword new is used followed by the type of the array.
    Remember the type of the array variable and the actual array which is being initialized
    must match. Finally, the type of the array is followed by opening and closing
    square brackets that contain an integer value. The integer defines the number
    of elements that can be stored inside an array.


    Let’s take a look at a working example of an array in C#.


    using System;


    using System.Collections.Generic;


    using System.Linq;


    using System.Text;


    using System.Threading.Tasks;


    namespace MyProgram


    {


    class Program


    {


    static void Main(string[] args)


    {


    int[] years = new int[5];


    Console.WriteLine(years.GetType());


    Console.ReadKey();


    }


    }


    }


    In the script above, we create an integer array called years, the size of the
    array is 5 which means that we can store 5 elements in this array. Next, we print
    the type of the years variable to see if it actually is an array. The output looks
    like that:


    ![image](d2d_images/image030.png)


    From the output, you can see that the square brackets that follow System.Int32\.
    This signifies that years variable is an array of type Int.


    Let’s now create another array of type string:


    using System;


    using System.Collections.Generic;


    using System.Linq;


    using System.Text;


    using System.Threading.Tasks;


    namespace MyProgram


    {


    class Program


    {


    static void Main(string[] args)


    {


    int[] years = new int[5];


    string[] colors = new string[5];


    Console.WriteLine(years.GetType());


    Console.WriteLine(colors.GetType());


    Console.ReadKey();


    }


    }


    }


    In the script above, we introduced a string type array named colors. Now if you
    check the type of two arrays you will see that the first array is of type integer
    and the second array is of type string as shown in the output of the above script:


    ![image](d2d_images/image081.png)


    Instead of using the new keyword, you can also directly create an array by passing
    the elements of an array inside curly brackets. Each element should be separated
    by a comma. Take a look at the following example:


    using System;


    using System.Collections.Generic;


    using System.Linq;


    using System.Text;


    using System.Threading.Tasks;


    namespace MyProgram


    {


    class Program


    {


    static void Main(string[] args)


    {


    int[] years = { 10, 20, 30, 40, 50 };


    string[] colors = { "red", "green", "blue", "yellow", "green" };


    Console.WriteLine(years.GetType());


    Console.WriteLine(colors.GetType());


    Console.ReadKey();


    }


    }


    }


    In the script above, you can see that we directly pass the values inside the curly
    brackets to initialize the years and colors array.  A benefit of using this approach
    is that you don’t have to specify the number of elements that you want to store
    in an array.


    It is important to mention here that C# arrays follow zero based indexing which
    means that the first element of the array will be stored at index 0\. Similarly,
    the second element will be stored at the first index and so on.


