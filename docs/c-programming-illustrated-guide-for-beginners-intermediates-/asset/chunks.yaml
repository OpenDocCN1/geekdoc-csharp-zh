    In the script, there is a nested `if-else` statement inside multiple outer `if-else`
    statements. The outer `if` statement checks the `age` of the user, while the inner
    `if else` statement asks the user whether he is a student or not. It is important
    to mention here in in case of a single line of code, you do not need to enclose
