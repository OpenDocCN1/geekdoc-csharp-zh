    # Chapter 13 – String Manipulation in C#


    ![image](d2d_images/chapter_title_below.png)


    A string is one of the most important data type in any programming language. While
    integers and decimals are useful for performing arithmetic operations, strings
    are extremely useful for getting information from the user and displaying information
    to the user. It is for this reason that we have dedicated a full chapter to string
    manipulation in C#.


    In this chapter, we will see the basics of C# strings along with how they are
    created and what are some of the most commonly used string function.


    | ![image](d2d_images/chapter_title_corner_decoration_left.png) |  | ![image](d2d_images/chapter_title_corner_decoration_right.png)
