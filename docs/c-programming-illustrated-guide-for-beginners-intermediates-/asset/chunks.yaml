    Console.WriteLine(item);

    Console.ReadLine();

    }

    }

    }

    ```


    在上面的脚本中，我们从 `SortedList` `slist` 中访问键为 5 的元素。键 5 的值为“green”。因此，在控制台输出中，你将看到打印出的
    green。


    要访问数组中的所有元素，你可以结合 for 循环、 `GetKey()` 方法和 `GetByIndex(i)` 方法。这两个方法都接受索引作为参数，并分别返回指定索引处的键和值。请看下面的示例：


    ```csharp

    using System;

    using System.Collections.Generic;

    using System.IO;

    using System.Linq;

    using System.Text;

    using System.Threading.Tasks;

    using System.Collections;

    namespace MyProgram

    {


    class Program

    {

    static void Main(string[] args)

    {

    SortedList slist = new SortedList();

    slist.Add(2, "Red");

    slist.Add(4, "Blue");

    slist.Add(5, "Green");

    slist.Add(1, "Orange");

    slist.Add(3, "Pink");

    for (int i = 0; i < slist.Count; i++)

    {

    Console.WriteLine("Key:" + slist.GetKey(i) + ", Value:" + slist.GetByIndex(i));

    }

    Console.ReadLine();

    }

    }

    }

    ```


    在上面的脚本中，我们使用 for 循环遍历了 `slist` 中的所有项。上述脚本的输出如下：


    ![image](img/image063.png)


    从输出中可以看出，项是按键的升序顺序显示的。这是因为 `SortedList` 中的项默认是按键的升序排序的。


