    the operator are equal, else returns false | x == y returns false |


    | Inequality | != | Returns true if the values on the left and right side of the
    operator are not equal, else returns false | x != y returns true |


    | Greater than | > | Returns true if the values on the left side of the operator
    is greater than the value on the right, else returns false | x > y returns true
    |


    | less than | < | Returns true if the values on the left side of the operator
    is smaller than the value on the right, else returns false | x < y returns false
    |


    | Greater than or equal to | >= | Returns true if the values on the left side
    of the operator is greater than or equal to the value on the right, else returns
    false | x >= y returns true |


    | Less than or equal to | <= | Returns true if the values on the left side of
    the operator is less than or equal to the value on the right, else returns false
    | x <= y returns false |


    Take a look at the following example to see relational operators in action:


    using System;


    using System.Collections.Generic;


    using System.Linq;


    using System.Text;


    using System.Threading.Tasks;


    namespace MyProgram


    {


    class Program


    {


    static void Main(string[] args)


    {


    int x = 30;


    int y = 20;


    Console.WriteLine(x + " is equal to " + y + " = "+ (x == y));


    Console.WriteLine(x + " is not equal to " + y + " = " + (x != y));


    Console.WriteLine(x + " is greater than " + y + " = " + (x > y));


    Console.WriteLine(x + " is less than " + y + " = " + (x < y));


    Console.WriteLine(x + " is greater than or equal to " + y + " = " + (x >= y));


    Console.WriteLine(x + " is less than or equal to " + y + " = " + (x <= y));


