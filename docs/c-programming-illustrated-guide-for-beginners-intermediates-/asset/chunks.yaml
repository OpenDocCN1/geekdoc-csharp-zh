    # If-else Statement


    ![image](d2d_images/chapter_title_below.png)


    The “if” block executes if the “if” condition returns true. What if you want to
    execute a piece of code when the “if” condition returns false? This is where the
    “else” statement comes into play. Basically the “if else” statement implicates
    that if the condition is true, do this, else do that. The syntax of the “if else”
    statement looks like this:


    if(condition == true)


    // execute this


    else // if condition is false


    // execute this


    Let’s take a simple example of the “if else” statements in action. Execute the
    following script:


    using System;


    using System.Collections.Generic;


    using System.Linq;


    using System.Text;


    using System.Threading.Tasks;


    namespace MyProgram


    {


    class Program


    {


    static void Main(string[] args)


    {


    Console.WriteLine("Are you a student? yes/no");


    string student = Console.ReadLine();


    if (student == "yes")


    Console.WriteLine("You are a student");


    else


    Console.WriteLine("You are not a student");


    Console.ReadKey();


    }


    }


    }


    The above example is the extension of the last example. In the above example,
    we have added else statement to the previously existing “if” statement. Now if
    the user enters anything other than “yes”,  the if condition will return false
    and the else statement will be executed. The output of the script above looks
    like this:


    ![image](d2d_images/image073.png)


    You can use multiple if and else conditions in your code if you want to check
    for multiple conditions. Take a look at the following example for details:


    using System;


    using System.Collections.Generic;


    using System.Linq;


    using System.Text;


    using System.Threading.Tasks;


    namespace MyProgram


    {


    class Program


    {


    static void Main(string[] args)


    {


    Console.WriteLine("Enter your age");


    int age = Int32.Parse(Console.ReadLine());


    if (age < 20)


    Console.WriteLine("You are in category A");


    else if (age > 20 && age < 40)


    Console.WriteLine("You are in category B");


    else if (age > 40 && age < 60)


    Console.Write("You are in category C");


    else


    Console.Write("You do not qualify for the offer");


    Console.ReadKey();


    }


    }


    }


    In the script above, the user is prompted to enter his/her age. If the user age
    is less than 20, the first if condition will return true and he will be prompted
    that he is in category A. If the user age is greater than 20 but less than 40,
    the first if statement will return false but the following else if statement will
    return true and the user will be prompted that he is in category B. If the age
    is greater than 60, the code after the else block will execute, prompting the
    user that he doesn’t qualify for the offer.


    Another very important point to learn from the above example is that multiple
    conditions can be checked inside if and else if statements. For instance, in the
    first else if statement we check that the age is greater than 20 and less than
    40.  Similarly, in the second else if statement, it is checked that the age is
    between 40 and and 60\. A sample result from the above application is shown in
    the following screen shot:


    ![image](d2d_images/image047.png)


    In addition to multiple if and else statements, you can also have nested if else
    statements. A nested if-else statement is a statement where if else statement
    is used another if else statement. The following example explains the nested if-else
    statements:


    using System;


    using System.Collections.Generic;


    using System.Linq;


    using System.Text;


    using System.Threading.Tasks;


    namespace MyProgram


    {


