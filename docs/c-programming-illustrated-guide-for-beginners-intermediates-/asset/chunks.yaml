    # continue 语句


    ![image](img/chapter_title_below.png)


    `continue` 语句会将控制权传回循环开头，而不执行循环中剩余的代码。让我们使用 `continue` 语句打印出 20 之前的所有偶数。请看以下示例：


    ```csharp

    using System;

    using System.Collections.Generic;

    using System.Linq;

    using System.Text;

    using System.Threading.Tasks;

    namespace MyProgram

    {

    class Program

    {

    static void Main(string[] args)

    {

    for(int i = 1; i <21; i++)

    {

    int rem = i % 2;

    if (rem != 0)

    continue;

    else

    Console.WriteLine(i);

    }

    Console.ReadKey();

    }

    }

    }

    ```


    在上面的脚本中，我们遍历了从 1 到 20 的整数。在每次迭代中，我们检查变量 `i` 除以 2 的余数是否不为零，如果不为零，我们就不执行循环的剩余部分并返回循环顶部。如果变量
    `i` 实际上能被 2 整除，意味着它是一个偶数，我们只需将其打印在屏幕上。


