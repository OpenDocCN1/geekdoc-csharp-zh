    # Traversing Arrays with the for Loop


    ![image](d2d_images/chapter_title_below.png)


    If there are a huge number of elements in an array, a better approach is to use
    the for loop to iterate over the array.


    Let’s see how we can do this:


    ```csharp

    using System;


    using System.Collections.Generic;

    using System.Linq;

    using System.Text;

    using System.Threading.Tasks;


    namespace MyProgram


    {


    class Program

    {


    static void Main(string[] args)

    {


    string[] colors = { "red", "green", "blue", "yellow", "green" };


    for (int i = 0; i < 5; i++)


    {


    Console.WriteLine(colors[i]);


    }


    Console.ReadKey();


    }


    }

    }

    ```


    In the above script, we use a for loop that that iterates from 0 to 1 less than
    5 (5 times in total), during each iteration the iteration variable `i`, is passed
    as an index value to the array. This way, all the elements in the `colors` are
    accessed one by one. This process is called traversing an array. The output of
    the above script looks like this:


    ![image](d2d_images/image052.png)


    It is important to mention that if you try to access an element at the array index
    which doesn’t exist, an array out of bound exception will occur. We will discuss
    exceptions in a later chapter, for now just consider exceptions as errors.


    Our `colors` array have 5 elements, stored from index 0 to 4\. Let’s execute a
    loop that traverses the `colors` array from index 0 to 5 and see what happens.
    Execute the following script:


    ```csharp

    using System;


    using System.Collections.Generic;

    using System.Linq;

    using System.Text;

    using System.Threading.Tasks;


    namespace MyProgram


    {


    class Program

    {


    static void Main(string[] args)

    {


    string[] colors = { "red", "green", "blue", "yellow", "green" };


    for (int i = 0; i < 6; i++)


    {


    Console.WriteLine(colors[i]);


    }


    Console.ReadKey();


    }


    }

    }

    ```


    In the above script, the for loop runs from 0 to 5, however there is no element
    at the 5^(th) index of the `colors` array. Therefore, an error is thrown stating
    that `IndexOutOfRangeException` occurred as shown in the following script.


    ![image](d2d_images/image026.png)


    One way to avoid this error is by dynamically setting the range of the array to
    the number of elements in the array. The `Length` attribute can be used to find
    the total number of elements in an array. Take a look at the following script:


    ```csharp

    using System;


    using System.Collections.Generic;

    using System.Linq;

    using System.Text;

    using System.Threading.Tasks;


    namespace MyProgram


    {


    class Program

    {


    static void Main(string[] args)

    {


    string[] colors = { "red", "green", "blue", "yellow", "green" };


    int length = colors.Length;


    for (int i = 0; i < length; i++)


    {


    Console.WriteLine(colors[i]);


    }


    Console.ReadKey();


    }


    }


    }

    ```


