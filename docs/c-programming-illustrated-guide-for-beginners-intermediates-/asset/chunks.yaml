    # Accessing Elements in a SortedList


    ![image](d2d_images/chapter_title_below.png)


    There are multiple ways to access items in a `SortedList`. The simples way is
    to pass the key as an index to the `SortedList` as shown below:


    ```csharp

    using System;

    using System.Collections.Generic;

    using System.IO;

    using System.Linq;

    using System.Text;

    using System.Threading.Tasks;

    using System.Collections;

    namespace MyProgram

    {


    class Program

    {

    static void Main(string[] args)

    {

    SortedList slist = new SortedList();

    slist.Add(2, "Red");

    slist.Add(4, "Blue");

    slist.Add(5, "Green");

    slist.Add(1, "Orange");

    slist.Add(3, "Pink");

    string item = (string)slist[5];

    Console.WriteLine(item);

    Console.ReadLine();

    }

    }

    }

    ```


    In the above script, we access the element with the key of 5 from the `SortedList`
    `slist`. The value for the key 5 is “green”. Therefore, in the console output,
    you will see green printed.


    To access all the elements in an array, you can make use of a for loop in combination
    with the `GetKey()` method and the `GetByIndex(i)` method. Both these methods
    take an index as a parameter and return the key and value at the specified index,
    respectively. Take a look at the following example:


    ```csharp

    using System;

    using System.Collections.Generic;

    using System.IO;

    using System.Linq;

    using System.Text;

    using System.Threading.Tasks;

    using System.Collections;

    namespace MyProgram

    {


    class Program

    {

    static void Main(string[] args)

    {

    SortedList slist = new SortedList();

    slist.Add(2, "Red");

    slist.Add(4, "Blue");

    slist.Add(5, "Green");

    slist.Add(1, "Orange");

    slist.Add(3, "Pink");

    for (int i = 0; i < slist.Count; i++)

    {

    Console.WriteLine("Key:" + slist.GetKey(i) + ", Value:" + slist.GetByIndex(i));

    }

    Console.ReadLine();

    }

    }

    }

    ```


    In the script above, we iterate through all the items in the `slist` using a for
    loop. The output of the script above looks like this:


    ![image](d2d_images/image063.png)


    From the output, you can see that the items have been displayed in the ascending
    order of the key. This is due to the fact that items in the `SortedList` are by
    default sorted by the ascending order of the keys.


    | ![image](d2d_images/chapter_title_corner_decoration_left.png) |  | ![image](d2d_images/chapter_title_corner_decoration_right.png)
    |


    ![image](d2d_images/chapter_title_above.png)


    # Removing Elements from SortedList


    ![image](d2d_images/chapter_title_below.png)


    To remove elements from a `SortedList`, you can use both `Remove()` and `RemoveAt()`
    functions. The `Remove()` function takes the key of the element to be removed
    while the `RemoveAt()` function takes the index. Look at the following script:


    ```csharp

    using System;

    using System.Collections.Generic;

    using System.IO;

    using System.Linq;

    using System.Text;

    using System.Threading.Tasks;

    using System.Collections;

    namespace MyProgram

    {


    class Program

    {

    static void Main(string[] args)

    {

    SortedList slist = new SortedList();

    slist.Add(2, "Red");

    slist.Add(4, "Blue");

    slist.Add(5, "Green");

    slist.Add(1, "Orange");

    slist.Add(3, "Pink");

    slist.Remove(1);

    slist.RemoveAt(0);

    for (int i = 0; i < slist.Count; i++)

    {

    Console.WriteLine("Key:" + slist.GetKey(i) + ", Value:" + slist.GetByIndex(i));

    }

    Console.ReadLine();

    }

    }

    }

    ```


    In the script above, we first remove the element with key 1. Next, we remove the
    element at 0^{th} index which is basically the element with key 2, since after
    removing key 1, the element with key 2 moves to index 0. Finally, we print the
    remaining elements on the screen. You will see the elements with key 3,4 and 5
    will be printed on the screen.


    ![image](d2d_images/image031.png)


