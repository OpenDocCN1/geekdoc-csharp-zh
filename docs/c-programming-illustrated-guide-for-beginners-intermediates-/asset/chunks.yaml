    # Writing Data to File


    ![image](d2d_images/chapter_title_below.png)


    Just as there are multiple ways to read a file, there are several ways to write
    data to file. In this section, we will see how we can write content to a text
    file.


    | ![image](d2d_images/chapter_title_corner_decoration_left.png) |  | ![image](d2d_images/chapter_title_corner_decoration_right.png)
    |


    ![image](d2d_images/chapter_title_above.png)


    # WriteAllText()


    ![image](d2d_images/chapter_title_below.png)


    The main way to write all the content to a text file is via the `WriteAllText()`
    method. The method takes two arguments. The first argument is the path of the
    file that you want your data written to and the second argument is the content
    that you want to write. Take a look at the following example:


    ```csharp

    using System;

    using System.Collections.Generic;

    using System.IO;

    using System.Linq;

    using System.Text;

    using System.Threading.Tasks;

    namespace MyProgram

    {

    class Program

    {

    static void Main(string[] args)

    {

    Console.WriteLine("Enter the content you want to write to file:");

    string text = Console.ReadLine();

    File.WriteAllText("D:/myfile2.txt", text);

    Console.ReadLine();

    }

    }

    }

    ```


    In the script above, we ask the user to enter the content that he wants to write
    in the file. Next, we use the `WriteAllText()` method to write the contents entered
    by the user to the file `myfile.txt`. If the `myfile.txt` doesn’t already exist,
    you will see that the `WriteAllText()` method will automatically create a new
    file named `myfile.txt` and will write the text to the file. If the file already
    exists, the existing text will be overwritten. Once you execute the script above,
    you should see a file named `myfile.txt` containing the content you entered in
    the console window.


    | ![image](d2d_images/chapter_title_corner_decoration_left.png) |  | ![image](d2d_images/chapter_title_corner_decoration_right.png)
    |


    ![image](d2d_images/chapter_title_above.png)


    # WriteAllLines()


    ![image](d2d_images/chapter_title_below.png)


    In addition to `WriteAllText()` which writes all the data to file at once, you
    can also use the `WriteAllLines()` method which takes an array of string as the
    second argument. In the text file, it creates a new line for each item in the
    string array. Look at the following script to see `WriteAllLines()` method in
    action:


    ```csharp

    using System;

    using System.Collections.Generic;

    using System.IO;

    using System.Linq;

    using System.Text;

    using System.Threading.Tasks;

    namespace MyProgram

    {

    class Program

    {

    static void Main(string[] args)

    {

    Console.WriteLine("Enter first line");

    string text = Console.ReadLine();

    Console.WriteLine("Enter second line");

    string text2 = Console.ReadLine();

    ––––––––

    ![image](d2d_images/scene_break.png)

    Console.WriteLine("Enter third line");

    string text3 = Console.ReadLine();

    string[] texts = { text, text2, text3 };

    File.WriteAllLines("D:/myfile2.txt", texts);

    Console.ReadLine();

    }

    }

    }

    ```


    In the script above, the user is asked thrice to enter any text. The texts are
    stored in three string type variables. The string type variables are then used
    to create an array of string which is passed to the `WriteAllLines()` method.
    Once you execute the script above, you should see three lines that you entered
    in the `myfile2.txt` file.


    | ![image](d2d_images/chapter_title_corner_decoration_left.png) |  | ![image](d2d_images/chapter_title_corner_decoration_right.png)
    |


