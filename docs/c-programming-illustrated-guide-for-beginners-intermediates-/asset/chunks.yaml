    using System.Threading.Tasks;

    namespace MyProgram

    {

    class Program

    {

    static void Main(string[] args)

    {

    char sign = ''+'';

    char bloodgroup = ''O'';

    Console.Write(bloodgroup);

    Console.Write(sign);

    Console.ReadKey();

    }

    }

    }

    ```


    In the script above, we declare two character type variables `sign` and `bloodgrpup`.
    We assigned some values to these variables and then printed them on the screen.
    It is important to mention here that a character can only hold a single value.
    For instance, you cannot assign a value ‘O+’ at once to one character. You will
