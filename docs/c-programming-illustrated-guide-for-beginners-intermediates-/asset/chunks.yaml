    \n# 构造函数 (The Constructor)\n\n![image](img/chapter_title_below.png)\n\n构造函数是一个每当类的对象被创建时自动执行的方法。事实上，当你创建一个类的对象时，你使用\
    \ `new` 关键字后跟构造函数的名称。例如，当我们使用使用 `new AirPlane()` 语法创建 `plane1` 对象时，这里的 `AirPlane()`\
    \ 基本上是一个在我们创建 `AirPlane` 类时默认创建构造函数。\n\n构造函数通常用于初始化类变量。我们可以重写默认构造函数并提供我们自己的构造函数实现。请看以下脚本：\n\
    \n```csharp\nusing System;\nusing System.Collections.Generic;\nusing System.Linq;\n\
