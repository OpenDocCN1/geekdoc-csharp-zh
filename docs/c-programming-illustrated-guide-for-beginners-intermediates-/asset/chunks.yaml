    foreach (string s in split1)


    {


    Console.WriteLine(s);


    }


    Console.WriteLine("======================================");


    foreach (string s in split2)


    {


    Console.WriteLine(s);


    }


    Console.ReadKey();


    }


    In the script above we split the string “Hello to C#” twice. First, we split the
    string by a single space. Next, we use a char array of two characters “T” and
    “E” and use this array to split the string. It is important to mention that the
    Split() method returns an array of strings that are split as a result of the Split()
    function. In the script above, we iterate through the arrays of the string returned
    by the Split() function. The output of the script above looks like this:


    ![image](d2d_images/image020.png)


    You can see that since the first string was split using space, we have individual
