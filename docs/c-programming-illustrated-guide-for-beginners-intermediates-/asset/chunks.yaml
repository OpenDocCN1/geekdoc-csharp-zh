    \n要访问 `Queue` 中的元素，你可以使用 `Peek()` 或 `Dequeue()` 方法。`Peek()` 方法返回 `Queue` 中的第一个元素，而\
    \ `Dequeue()` 则移除并返回 `Queue` 中的第一个元素。请看下面的示例：\n\n––––––––\n\n![image](img/scene_break.png)\n\
    \n```csharp\nusing System;\nusing System.Collections.Generic;\nusing System.IO;\n\
