    \ data to the constructors via parameters. Such constructors are called parameterized\
    \ constructors. Parameterized constructors are handy when you want to initialize\
    \ member variables with the data passed from outside the class. Take a look at\
    \ the following example:\n\n```csharp\nusing System;\nusing System.Collections.Generic;\n\
    using System.Linq;\nusing System.Text;\nusing System.Threading.Tasks;\nnamespace\
    \ MyProgram\n{\nclass Program\n{\n    static void Main(string[] args)\n    {\n\
    \        // Creating Object of the Airplane Class\n        AirPlane plane1 = new\
    \ AirPlane(\"Airbus\", \"A-380\");\n        // Accessing class members from plane1\
    \ object\n        Console.WriteLine(plane1.planeMake);\n        Console.WriteLine(plane1.planeModel);\n\
    \        // Accessing class methods from plane1 object\n        plane1.StartPlane();\n\
    \        plane1.StopPlane();\n        Console.ReadKey();\n    }\n}\n\nclass AirPlane\n\
    {\n    public string planeMake;\n    public string planeModel;\n    public AirPlane(string\
    \ make, string model)\n    {\n        planeMake = make;\n        planeModel =\
    \ model;\n    }\n    public void StartPlane()\n    {\n        Console.WriteLine(\"\
    Plane Started\");\n    }\n    public void StopPlane()\n    {\n        Console.WriteLine(\"\
    Plane Stopped\");\n    }\n}\n}\n```\n\nIn the script above, we have a parameterized\
    \ constructor for the `AirPlane` class. The constructor has two parameters: `make`\
    \ and `model`, which are used to initialize the two member variables `planeMake`\
    \ and `planeModel` respectively.\n\nIf you look at the `Main` method of the `Program`\
    \ class, you can see that when we create an object of the `AirPlane` class, we\
