    namespace MyProgram


    {


    class Program

    {


    static void Main(string[] args)

    {


    string[] colors = { "red", "green", "blue", "yellow", "green" };


    string mycolor = colors[1];


    Console.WriteLine(mycolor);


    Console.ReadKey();


    }

    }

    ```


    在上面的脚本中，我们创建了一个带有元素的字符串数组 `colors`。我们将数组中的第二个元素存储在变量 `mycolor` 中。最后，在控制台上打印 `mycolor`
    变量。输出为 green，如下所示：


    ![image](img/image022.png)


