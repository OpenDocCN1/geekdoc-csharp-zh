    William Sullivan 在软件/编程领域拥有超过 25 年的经验。他于 1978 年出生于华盛顿州西雅图。他曾在许多领先的美国和国际公司工作，在那里展现了他的才华、备受青睐的技能、创造力和创新精神。从底层开始，William
    Sullivan 在企业阶梯上不断努力，成为一名富有影响力的程序员。他是独生子，由单妈妈长大，母亲总是鼓励他接受高等教育并追求更好的生活。他们过着紧缩的生活，母亲通过加班和不规律的班次工作。母亲总是确保他拥有生活必需品，如食物、衣服和住所。William
    一对技术着迷，从零开始组装计算机、编程等。他的母亲尽一切满足他永无的好奇心，为他购买关于软件、编程、硬件以及几乎任何与计算机技术相关的书籍。他表示，利用母亲有限收入所提供的资源在闲暇时间阅读，真的是他获得今天成功的真正基石。他主修计算机科学，并获得了全额奖学金，最后以优异成绩毕业。从那以后他搬到了加利福尼亚，已婚并有三个孩子。他以合同工从事各种高薪工作，并在空闲时间写作。他热爱旅行、品尝不同的美食和体验不同的文化。他感激所获得的改变生活的机会，并希望通过编写大众书籍来回馈，这些书籍对任何想要变得精通技术的人来说都是负担得起的。


