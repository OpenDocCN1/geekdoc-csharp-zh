    # Chapter 10 – Inheritance in C#


    ![image](d2d_images/chapter_title_below.png)


    In the previous chapter, we started our discussion about Object Oriented Programming
    (OOP) in C#. In this chapter, we will study Inheritance which is one of the three
    fundamental pillars of object-oriented programming, with encapsulation and polymorphism
    being the other two.


    Inheritance in OOP is similar to real-world inheritance. In the real world, a
    child inherits some of the characteristics of its parents in addition to having
    his/her own unique characteristics. In programming, a class inherits characteristics
    of another class. A class that inherits another class is called child class or
    derived class. On the other hand, a class that is inherited by other classes is
    called a base class or parent class.


    As a rule of thumb, characteristics that are common in more than one classes should
    be packaged in the parent class while the characteristics unique to individual
    classes should be left intrinsic to the individual classes. It is important to
    mention here that when we talk about characteristics in inheritance, as a programming
    term, we talk about the member variables and the member methods of a class.


    Inheritance fosters code reusability and modularity. In this chapter, we will
    see inheritance in C#.


    | ![image](d2d_images/chapter_title_corner_decoration_left.png) |  | ![image](d2d_images/chapter_title_corner_decoration_right.png)
    |


    ![image](d2d_images/chapter_title_above.png)


    # Inheritance: A Simple Example


    ![image](d2d_images/chapter_title_below.png)


    Before we see the actual C# code for inheritance, it is important to mention that
    Inheritance implements the IS-A relationship between the classes. For instance,
    a car is a vehicle; a bike is also a vehicle. A manager is an employee; a cashier
    is also an employee. To implement inheritance, the more general characteristics
    such as name, age, salary can be packaged in a parent Employee class, while more
    specialized characteristics such as a list of employees being managed can be added
    to the child Manager class.


    In the following example, we will create a parent class “AirPlane” and its child
    class “CommercialPlane”. The parent class “AirPlane” will have member variables
    planeMake, planeModel and member methods StartPlane and StopPlane. The class “CommercialPlane”
    will inherit the “AirPlane” class, therefore it will explicitly have the two member
    variables and the two methods of the parent class. In addition, we will add a
    variable passengerCapacity to the “CommercialPlane” class. We will also add a
    method BoardPassenger to the “CommercialPlane” class.  We did not add the passengerCapacity
    variable and the BoardPassenger method to the parent “AirPlane” class since there
    can be another child class “FighterPlane” and fighter planes do not have any passengers.
    Therefore, we will implement the passengerCapacity variable and the BoardPassenger
    method in the child “CommercialPlane” class.


    Take a look at the following script:


    using System;


    using System.Collections.Generic;


    using System.Linq;


    using System.Text;


    using System.Threading.Tasks;


    namespace MyProgram


    {


    class Program


    {


    static void Main(string[] args)


    {


    // Creating Object of the CommercialPlane Class


    CommercialPlane plane1 = new  CommercialPlane();


    // Accessing parent class members from plane1 object


    Console.WriteLine(plane1.planeMake);


    Console.WriteLine(plane1.planeModel);


    ––––––––


    ![image](d2d_images/scene_break.png)


    // Accessing parent class methods from plane1 object


    plane1.StartPlane();


    plane1.StartPlane();


    // Accessing child class members from plane1 object


    Console.WriteLine(plane1.passengerCapacity);


    ––––––––


    ![image](d2d_images/scene_break.png)


    // Accessing child class methods from plane1 object


    plane1.BoardPassenger();


    Console.ReadKey();


    }


    }


    class AirPlane


    {


    public string planeMake = "Boeing";


    public string planeModel=  "A330";


    ––––––––


    ![image](d2d_images/scene_break.png)


    public void StartPlane()


    {


    Console.WriteLine("Plane Started");


    }


    public void StopPlane()


    {


    Console.WriteLine("Plane Stopped");


    }


    }


    class CommercialPlane: AirPlane


    {


    public int passengerCapacity = 180;


    public void BoardPassenger()


    {


    Console.WriteLine("Boarding Started");


    }


    }


    }


    In the script above we have three classes: “Program” which contains the “Main”
    method, the parent “AirPlane” class, and the child “CommercialPlane” class which
    inherits the “AirPlane” class.


    You can see that to inherit one class from another, all you have to do is to add
    colon after the name of the child class and after the colon, you need to add the
    name of the parent class.


    In the above script, in the “Main” method of the “Program” class, an object “plane1”
    of the “CommercialPlane” class has been instantiated. Next, the values of the
    variables from the parent class have been printed on the console followed by a
    call to the parent class method. You will see that the compiler will not give
    any error since parent class variables are accessible to the child class. After
    that, the value of the member variable of the child class has been printed and
    the call to the member method of the child class is executed. The output of the
    script above looks like this:


    ![image](d2d_images/image079.png)


    | ![image](d2d_images/chapter_title_corner_decoration_left.png) |  | ![image](d2d_images/chapter_title_corner_decoration_right.png)
    |


    ![image](d2d_images/chapter_title_above.png)


    # Multiple Inheritance


    ![image](d2d_images/chapter_title_below.png)


    In C#, one-way multiple inheritance is possible, which means that one parent class
    can have multiple child classes. However, one child class cannot have multiple
    parents.


    In the previous section, we created “CommercialPlane” child class of the parent
    “AirPlane” class. In this section, we will create another child class named, “FighterPlane” 
    with one intrinsic variable “totalMissiles” and one method “FireMissile”. Again,
    this member variable and method is too specific, hence we cannot declare them
