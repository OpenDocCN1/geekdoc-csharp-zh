    {


    static void Main(string[] args)


    {


    Console.WriteLine("Enter your age");


    int age = Int32.Parse(Console.ReadLine());


    if (age < 20)


    {


    Console.WriteLine("You are in category A");


    Console.WriteLine("Are you a student");


    string student = Console.ReadLine();


    if (student == "yes")


    Console.WriteLine("You are a student");


    else


    Console.WriteLine("You are not a student");


    }


    else if (age > 20 && age < 40)


    {


    Console.WriteLine("You are in category B");


    Console.WriteLine("Are you a student");


    string student = Console.ReadLine();


    if (student == "yes")


    Console.WriteLine("You are a student");


    else


    Console.WriteLine("You are not a student");


    }


    else if (age > 40 && age < 60)


    {


    Console.WriteLine("You are in category C");


    Console.WriteLine("Are you a student? yes/no");


    string student = Console.ReadLine();


    if (student == "yes")


    Console.WriteLine("You are a student");


    else


    Console.WriteLine("You are not a student");


    }


    else


    Console.Write("You do not qualify for the offer");


    Console.ReadKey();


    }


    }


    }


    In the script, there is a nested if-else statement inside multiple outer if-else
    statements. The outer if statement checks the age of the user, while the inner
    if else statement asks the user whether he is a student or not. It is important
    to mention here that in case of a single line of code, you do not need to enclose
    your if else block inside curly brackets. However, if you want to execute multiple
    lines of codes inside an if-else block, you need to enclose your code inside the
    curly brackets.


