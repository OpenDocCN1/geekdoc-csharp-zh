    # Calling Parent Class Constructor from Children Classes


    ![image](d2d_images/chapter_title_below.png)


    In the previous examples, we did not have parameterized constructors for parent
    and children classes. What if we want to have parameterized constructors for the
    child as well as parent classes? How will we pass data from child class constructor
    to parent class constructor?


    To do so the “base” function is used and the parent class parameters are passed
    to this function. In the following example, the child, as well as parent classes,
    have parameterized constructors. The “base” method is being used to pass data
    for the constructor from children to parent class.


