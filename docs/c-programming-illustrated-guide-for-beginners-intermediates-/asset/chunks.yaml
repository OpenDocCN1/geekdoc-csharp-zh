    # If-else 语句


    ![image](img/chapter_title_below.png)


    当 `if` 条件返回 `true` 时，会执行 `if` 块中的内容。如果你想在 `if` 条件返回 `false` 时执行某些代码呢？这时 `else`
    语句派上用场了。基本上，`if else` 语句的意思是：如果条件为真，则执行此操作否则否则执行操作。`if else` 语句的语法如下：


    ```text

    if(condition == true)


    // execute this


    else // if condition is false


    // execute this

    ```


    让我们来看一个简单的 `if else` 语句运行示例。执行以下脚本：


    ```csharp

    using System;


    using System.Collections.Generic;

    using System.Linq;

    using System.Text;

    using System.Threading.Tasks;

    namespace MyProgram


    {


    class Program

    {


    static void Main(string[] args)

    {


    Console.WriteLine("Are you a student? yes/no");


    string student = Console.ReadLine();

    if (student == "yes")

    Console.WriteLine("You are a student");

    else

    Console.WriteLine("You are not a student");


    Console.ReadKey();


    }


    }


    }

    ```


    上面的示例是上一个示例的扩展。在上面的示例中，我们在原来的 `if` 语句添加了 `else` 语句。现在，如果用户输入“yes”以外的任何内容，`if`
    条件将返回 `false` 并执行 `else` 语句。上述脚本的输出如下：


    ![image](img/image073.png)


    如果你想在代码中检查多个条件，可以使用多个 `if` 和 `else` 条件。详情请参考以下示例：


    ```csharp

    using System;


    using System.Collections.Generic;

    using System.Linq;

    using System.Text;

    using System.Threading.Tasks;

    namespace MyProgram


    {


    class Program

    {


    static void Main(string[] args)

    {


    Console.WriteLine("Enter your age");


    int age = Int32.Parse(Console.ReadLine());

    if (age < 20)

    Console.WriteLine("You are in category A");

    else if (age > 20 && age < 40)

    Console.WriteLine("You are in category B");

    else if (age > 40 && age < 60)

    Console.Write("You are in category C");

    else

    Console.Write("You do not qualify for the offer");


    Console.ReadKey();


    }


    }

    }

    ```


    在上面的脚本中，用户被提示输入其年龄。如果用户年龄小于 20，第一个 `if` 条件将返回 `true`，并提示用户他属于 A 类。如果用户年龄大于 20
    但小于 40，第一个 `if` 语句将返回 `false`，但后续的 `else if` 语句将返回 `true`，提示用户他属于 B 类。如果年龄大于 60，`else`
    块后的代码将执行，提示用户不符合优惠条件。


    从上面的示例中学习的另一个非常重要的点是，可以在 `if` 和 `else if` 语句中检查多个条件。例如，在第一个 `else if` 语句中，我们检查
    `age` 是否大于 20 且小于 40。同样，在第二个 `else if` 语句中，检查了 `age` 是否在 40 到 60 之间。上述应用程序的示例结果如下所示：


    ![image](img/image047.png)


    除了多个 `if` 和 `else` 语句外，你还可以使用嵌套的 `if else` 语句。嵌套的 `if-else` 语句是指在一个 `if else`
    语句内部另一个 `if else` 语句的语句。下面的示例解释了嵌套的 `if-else` 语句：


    ```csharp

    using System;


    using System.Collections.Generic;

    using System.Linq;

    using System.Text;

    using System.Threading.Tasks;

    namespace MyProgram


    {


    class Program

    {


    static void Main(string[] args)

    {


    Console.WriteLine("Enter your age");


    int age = Int32.Parse(Console.ReadLine());

    if (age < 20)

    {


    Console.WriteLine("You are in category A");

    Console.WriteLine("Are you a student");

    string student = Console.ReadLine();

    if (student == "yes")

    Console.WriteLine("You are a student");

    else

    Console.WriteLine("You are not a student");

    }

    else if (age > 20 && age < 40)

    {


    Console.WriteLine("You are in category B");

    Console.WriteLine("Are you a student");

    string student = Console.ReadLine();

    if (student == "yes")

    Console.WriteLine("You are a student");

    else

    Console.WriteLine("You are not a student");

    }

    else if (age > 40 && age < 60)

    {


    Console.WriteLine("You are in category C");

    Console.WriteLine("Are you a student? yes/no");

    string student = Console.ReadLine();

    if (student == "yes")

    Console.WriteLine("You are a student");

    else

    Console.WriteLine("You are not a student");

    }

    else

    Console.Write("You do not qualify for the offer");


    Console.ReadKey();


    }


    }

    }

    ```


    在脚本中，多个外层 `if-else` 语句内部有一个嵌套的 `if-else` 语句。外层的 `if` 语句检查用户的 `age`，而内部的 `if else`
    语句询问用户是否是学生。这里需要提到的是，如果是单行代码，你不需要将 `if else` 块封装在大括号内。然而，如果你想在 `if-else` 块中执行多行代码，你需要将代码封装在大括号内。


