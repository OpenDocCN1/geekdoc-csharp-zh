    \n![image](d2d_images/image042.png)\n\nOnce you execute the script above, you\
    \ will see that a console window, like the command line, will appear that will\
    \ contain the message “Congratulations, you wrote your first Program” as shown\
    \ below:\n\n![image](d2d_images/image053.png)\n\nNow let’s see what is actually\
