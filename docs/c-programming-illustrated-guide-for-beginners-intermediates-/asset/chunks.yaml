    on the console. Since every object has a string representation, therefore you
    can pass objects of all types to the Write function. Take a look at a very simple
    example of the Write function.


    namespace MyProgram


    {


    class Program


    {


    static void Main(string[] args)


    {


    bool test = true;


    string msg = "Hello from C#";


    int num = 10;


    Console.Write(test);


    Console.Write(msg);


