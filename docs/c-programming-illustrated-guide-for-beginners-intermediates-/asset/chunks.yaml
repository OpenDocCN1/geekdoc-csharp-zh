    # OOP 的优势


    ![image](img/chapter_title_below.png)


    以下是面向对象编程的一些优势。


    ![image](img/chapter_title_corner_decoration_left.png) |  | ![image](img/chapter_title_corner_decoration_right.png)

    ![image](img/chapter_title_above.png)


    # 可重用性


    ![image](img/chapter_title_below.png)


    在 OOP 中，应用程序是以对象和类的形式开发的。这些对象和类也可以在其他应用程序中重用。


    ![image](img/chapter_title_corner_decoration_left.png) |  | ![image](img/chapter_title_corner_decoration_right.png)

    ![image](img/chapter_title_above.png)


    # 模块化方法


    ![image](img/chapter_title_below.png)


    OOP 应用程序是以模块化的形式开发的，每个模块都有自己的功能。模块化方法使得应用程序开发变得简单且复杂性降低。


    ![image](img/chapter_title_corner_decoration_left.png) |  | ![image](img/chapter_title_corner_decoration_right.png)

    ![image](img/chapter_title_above.png)


    # 可维护性


    ![image](img/chapter_title_below.png)


    由于 OOP 应用程序是以模块形式开发的，因此很容易在一个模块中进行更改而不影响其他模块，从而产生可维护的代码。


    ![image](img/chapter_title_corner_decoration_left.png) |  | ![image](img/chapter_title_corner_decoration_right.png)

    ![image](img/chapter_title_above.png)


    # 易于调试


    ![image](img/chapter_title_below.png)


    OOP 应用程序很容易调试，因为应用程序某某部分的错误通常是局部的，不会影响应用程序的其他区域。


    ![image](img/chapter_title_corner_decoration_left.png) |  | ![image](img/chapter_title_corner_decoration_right.png)

    ![image](img/chapter_title_above.png)


    # 安全性


    ![image](img/chapter_title_below.png)


    OOP 应用程序通过封装关注数据安全，我们将在稍后的章节中学习这一点。简单来说，OOP 应用程序对数据的访问是受控制的。


    ![image](img/chapter_title_corner_decoration_left.png) |  | ![image](img/chapter_title_corner_decoration_right.png)

    ![image](img/chapter_title_above.png)


    # 类


    ![image](img/chapter_title_below.png)


    类是面向对象编程的基石。它是对象的蓝图。它包含了关于对象看起来是什么样的的信息。对象将包含多少个方法、方法的返回类型是什么、方法接受的参数类型是什么。同样，它还将指定对象将包含的变量。简而言之，类是对象的地图。当你看到一张地图时，你可以很容易看出房子看起来是什么样子的，会有多少房间等。同样，只需看一眼类，就能知道对象能够做什么以及它存储了什么类型的信息。


    理论部分足够了——让我们看看如何在 `C#` 中创建一个简单的类。请看以下脚本：


    ```csharp

    using System;


    using System.Collections.Generic;

    using System.Linq;

    using System.Text;

    using System.Threading.Tasks;


    namespace MyProgram


    {


    class Program

    {


    static void Main(string[] args)

    {


    }


    }


    class AirPlane

    {


    public string planeMake = "Airbus";


    public string planeModel = "A320";


    public void StartPlane()

    {

    Console.WriteLine("Plane Started");

    }


    public void StopPlane()

    {

    Console.WriteLine("Plane Stopped");

    }


    }


    }

    ```


    在上面的脚本中，我们创建了一个名为 `AirPlane` 的新类，有两个成员变量 `planeMake` 和 `planeModel` 以及两个成员方法 `StartPlane`
    和 `StopPlane`。要创建一个类，使用关键字 `class` 后跟类名。接下来，在花括号内声明成员变量和成员方法。


    这里需要提到，`C# 是一门 100% 面向对象的语言，这意味着除了 `string`、`int`、`char` 等原始数据类型外，`C#` 中的一切都实现为
    `Class`。当你创建一个新的控制台应用程序时，应用程序的名称将成为包含 `Program` 类的命名空间的名称。在 `Program` 类内部，我们有
    `Main` 方法，它是应用程序的起点。因此，如果你查看上面的代码，你会看到有一个 `Program` 类用于启动程序，以及我们刚刚创建的自定义类 `AirPlane`。


    这里需要记住的另一个点是命名规范。类和方法名使用 Pascal case（帕斯卡命名法），每个单词的首字母大写。类变量使用 camel case（驼峰命名法），第一个单词的首字母小写，其余单词的首字母大写。


    现在我们知道如何在 `C#` 中创建类了。然而，类本身在内存中并不存在。对象在物理上实现类。让我们看看如何在 `C#` 中创建对象。


    ![image](img/chapter_title_corner_decoration_left.png) |  | ![image](img/chapter_title_corner_decoration_right.png)

    ![image](img/chapter_title_above.png)


    # 对象


    ![image](img/chapter_title_below.png)


    `C#` 中的对象是类的物理实现，并在系统内存中具有物理存在。对象也被称为实例（instance），创建类对象的过程被称为实例化（instantiation）。在上节中，我们创建了一个名为
    `AirPlane` 的类，让我们看看如何创建该类的对象


    ```csharp

