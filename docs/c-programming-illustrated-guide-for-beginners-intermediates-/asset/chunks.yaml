    Squares are: {0} and {1}\", a, b);\n    }\n}\n}\n```\n\n在上面的脚本中我们声明了两个整数变量 `num1`\
    \ 和 `num2`，然后将这两个变量作为参数传递给 `PrintSquares()` 函数，该函数获取两个数的平方并将其打印在屏幕上。在上面的代码中，我们在调用函数前后打印了\
    \ `num1` 和 `num2` 的值。因为整数是按值传递的，在 `PrintSquares()` 函数内部创建了这些变量的副本，原始值没有被更新。输出如下：\n\
    \n![image](img/chapter_title_corner_decoration_left.png) |  | ![image](img/chapter_title_corner_decoration_right.png)\
    \ |\n\n![image](img/chapter_title_above.png)\n\n# 按引用传递\n\n![image](img/chapter_title_below.png)\n\
    \n当变量按引用传递给函数时，传递的是变量的内存位置，对引用的任何更新都会导致原始变量的更新。在 C# 中，自定义类型按引用传递的。数组也是如此。让我们看看按引用传递的示例：\n\
    \n```csharp\nusing System;\nusing System.Collections.Generic;\nusing System.Linq;\n\
    using System.Text;\nusing System.Threading.Tasks;\n\nnamespace MyProgram\n{\n\
    class Program\n{\n    static void Main(string[] args)\n    {\n        int [] nums\
