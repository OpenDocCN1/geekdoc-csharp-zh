    The output of the above script looks like that:


    ![image](d2d_images/image061.png)


    The output looks strange? Isn’t it? All the variables have been printed on the
    same line without any space. This is how the Write function works. It prints the
    values passed to it on the console and leaves the cursor on the same line. The
    next Write statement will be printed on the same line.


    This is where the WriteLine function comes handy.


    The WriteLine Function


    The WriteLine function on the other hand prints whatever is passed to it o a new
    line. Look at the following example:


    namespace MyProgram


    {


    class Program


    {


    static void Main(string[] args)


    {


    bool test = true;


    string msg = "Hello from C#";


    int num = 10;


    Console.WriteLine(test);


    Console.WriteLine(msg);


    Console.WriteLine(num);


    Console.ReadKey();


    }


    }


    }


    The output of the script above looks like this:


    ![image](d2d_images/image078.png)


    Place Holder for Console Output


    In addition to directly printing strings in the output, you can also use placeholders
    that define the position of the corresponding strings in the output. The place
    holder is defined using curly brackets and inside the curly brackets, you specify
    the position of the place holder. Take a look at the following example to see
    placeholders in action:


    namespace MyProgram


    {


    class Program


    {


    static void Main(string[] args)


    {


    string name = "Mike";


    int age = 20;


    string location = "London";


    ––––––––


    ![image](d2d_images/scene_break.png)


    Console.WriteLine("I am {0}, I am {1} years and I am from {2}", name, age, location);


    Console.ReadKey();


    }


    }


    }


    In the script above, we first define three variables: name, age, and location.
    We print a string on the console. Inside the string, we use placeholders for the
    name, age and location. We then simply pass the variables in the same order to
    the Console.WriteLine function, separated by a comma. Here the placeholder {0}
    corresponds to name, {1} corresponds to age and {2} corresponds to location. The
    output looks like this:


    ![image](d2d_images/image080.png)


    | ![image](d2d_images/chapter_title_corner_decoration_left.png) |  | ![image](d2d_images/chapter_title_corner_decoration_right.png)
    |


