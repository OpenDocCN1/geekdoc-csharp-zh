    \ planeMake = make;\n        planeModel = model;\n    }\n    public AirPlane()\n\
    \    {\n        planeMake = \"Lockhead Martin\";\n        planeModel = \"F-16\"\
    ;\n    }\n    public void StartPlane()\n    {\n        Console.WriteLine(\"Plane\
    \ Started\");\n    }\n    public void StopPlane()\n    {\n        Console.WriteLine(\"\
    Plane Stopped\");\n    }\n}\n}\n```\n\nIn the script above, we have two constructors\
    \ in our `AirPlane` class, one of the constructors is parameterized while the\
    \ other constructor doesn’t accept any parameters.\n\nIn the `Main` method, we\
