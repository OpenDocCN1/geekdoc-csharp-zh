    \n# Chapter 8 – Functions in C#\n\n![image](d2d_images/chapter_title_below.png)\n\
    \nFunction (also known as method) is one of the most important constructs in any\
    \ programming language. Functions are used to execute a piece of code that needs\
    \ to be executed repeatedly and has self-contained logic.\n\nConsider a scenario\
    \ where you have to calculate the percentage of tax on a certain amount. Both\
    \ the percentage and the amount will be entered by the user. And you need to do\
    \ this task repeatedly. One way is to write a logic that calculates the tax on\
    \ the amount every time you need to perform this task. This can be really cumbersome.\
    \ What if you need to do this 1000 times a day? You will be spending all your\
    \ day writing such logic. A better approach is to encapsulate such logic inside\
    \ a function and then implement a mechanism that executes the function and the\
    \ logic inside it.\n\nIn this chapter, we will see how C# functions are implemented,\
    \ how we can pass and retrieve data from the functions and what the different\
    \ types of functions are.\n\n| ![image](d2d_images/chapter_title_corner_decoration_left.png)\
    \ |  | ![image](d2d_images/chapter_title_corner_decoration_right.png) |\n\n![image](d2d_images/chapter_title_above.png)\n\
    \n# Declaring a Function\n\n![image](d2d_images/chapter_title_below.png)\n\nThe\
    \ syntax for declaring a function is as follows\n\n```text\nmodifier return-type\
    \ function-name(p1, p2, p3 ...)\n{\n    //function logic\n}\n```\n\n––––––––\n\
    \n![image](d2d_images/scene_break.png)\n\nTo declare a function, you first have\
