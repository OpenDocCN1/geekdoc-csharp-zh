    # Switch Statements


    ![image](d2d_images/chapter_title_below.png)


    Switch come handy when there are a large number of conditions to be checked. The
    following example illustrates the usage of switch statements:


    ```csharp

    using System;


    using System.Collections.Generic;

    using System.Linq;

    using System.Text;

    using System.Threading.Tasks;

    namespace MyProgram


    {


    class Program

    {


    static void Main(string[] args)

    {


    Console.WriteLine("Enter your favourite color");

    string color = Console.ReadLine();

    switch (color)

    {


    case "green":

    Console.WriteLine("You got 10 points");

    break;


    case "red":

    Console.WriteLine("You got 8 points");

    break;


    case "blue":

    Console.WriteLine("You got 6 points");

    break;


    case "yellow":

    Console.WriteLine("You got 4 points");

    break;


    case "pink":

    Console.WriteLine("You got 2 points");

    break;


    default:

    Console.WriteLine("You got 00 points");

    break;


    }


    Console.ReadKey();


    }


    }


    }

    ```


    The switch statement starts with the keyword `switch`, followed by opening and
    closing brackets that contain the variable or the value that you want to compare.
    Inside the switch statement there are multiple `case` statements. The `case` whose
    value matches the value in the switch statement executes.


    In the script above, the user is asked to enter his favorite color. The color
    choice is then stored in the `color` variable which is passed to the switch statement.
    Inside the switch statement, each `case` statement compares its value to the color
    passed in the switch statement; the `case` statement for the color that matches
    the switch statement is executed. The `break` keyword is used to come out of the
    switch statement. The output of for the code above looks like this:


    ![image](d2d_images/image023.png)


    From the output, you can see that when the user enters the color “red”, the `case`
    statement for “red” executes and the user is prompted that he got 8 points.

