    # 第 3 章 - C# 运算符


    ![image](img/chapter_title_below.png)


    在上一章中，我们开始了对 C# 中数据类型的讨论。在本章中，我们将学习 C# 中的运算符。运算符是任何编程语言中不可或缺的一部分。运算符作用于数据产生产生结果。运算符的结果取决于数据和运算符。


    C# 运算符被分为 4 大类，如下所示：


    * 算术运算符

    * 关系运算符

    * 逻辑运算符

    * 赋值运算符


    在本章中，我们将详细查看这些运算符并结合不同的示例。


    | ![image](img/chapter_title_corner_decoration_left.png) |  | ![image](img/chapter_title_corner_decoration_right.png)
    |


    ![image](img/chapter_title_above.png)


    # 1. 算术运算符


    ![image](img/chapter_title_below.png)


    C# 中的算术运算符用于对数值数据执行数学操作。它们与现实世界中的算术运算符相似。假设你有两个变量 `x= 30` 和 `y = 20`，下表演示了不同的算术运算符如何工作。


    | 运算符 | 符号 | 说明 | 示例 |

    | :--- | :--- | :--- | :--- |

    | 加法 | `+` | 将两个数字相加并拼接两个字符串 | `x + y = 50`“Good” + “Luck”= “Good Luck” |

    | 减法 | `-` | 将两个数字相减 | `x – y = 10` |

    | 乘法 | `*` | 将两个数字相乘 | `x * y = 600` |

    | 除法 | `/` | 将分子中的数字除以分母中的数字 | `x / y = 1.5` |

    | 递增 | `++` | 将数字加 1 | `x++ = 31` |

    | 递减 | `—` | 将数字减 1 | `x—= 29` |

    | 取模 | `%` | 将两个数字相除并返回余数 | `x % y = 10` |


    ```csharp

    using System;

    using System.Collections.Generic;

    using System.Linq;

    using System.Text;

    using System.Threading.Tasks;

    namespace MyProgram

    {

    class Program

    {

    static void Main(string[] args)

    {

    int x = 30;

    int y = 20;

    Console.WriteLine("Addition of " + x + " and " + y + " : " + (x + y));

    Console.WriteLine("Subtraction of " + x + " and " + y + " : " + (x - y));

    Console.WriteLine("Multiplication of " + x + " and " + y + " : " + (x * y));

    Console.WriteLine("Division of " + x + " and " + y + " : " + (x / y));

    Console.WriteLine("Increment of " + x + " : " + (++x));

    x = 30;

    Console.WriteLine("Decrement of " + x + " : " + (—x));

    x = 30;

    Console.WriteLine("Modulus of " + x + " and " + y + " : " + (x % y));

    Console.ReadKey();

    }

    }

    }

    ```


    上面脚本的输出如下：


    ![image](img/image045.png)


    这里需要说明 `++x` 和 `x++` 区别。如果递增或递减运算符在操作数之前，则先执行递增或递减，然后在表达式中使用递增递减后的值。相反，如果递增运算符在操作数之后，则先在表达式中使用操作数，然后再递增。下面的脚本解释了这种差异。


    ```csharp

    using System;

    using System.Collections.Generic;

    using System.Linq;

    using System.Text;

    using System.Threading.Tasks;

    namespace MyProgram

    {

    class Program

    {

    static void Main(string[] args)

    {

    int x = 30;

    Console.WriteLine(++x);

    x = 30;

    Console.WriteLine(x++);

    Console.WriteLine(x++);

    Console.ReadKey();

    }

    }

    }

    ```


    在上面的脚本中，整数变量 `x` 被赋值为 30。然后使用 `++x` 对其递增并显示在屏幕上。你会在屏幕上看到 31。我们再次将其赋值为 30，然后使用表达式
    `x++` 将其打印到控制台上。这次你会看到打印的是 30，因为递增运算符在 `x` 之后。然而，在打印 `x` 的值之后，它的值会递增。现在如果你再次在屏幕上打印
    `x`，你会看到更新后的值 31。输出如下：


    ![image](img/image065.png)


