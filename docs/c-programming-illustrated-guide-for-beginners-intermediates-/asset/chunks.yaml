    # Adding Elements to a Stack


    ![image](d2d_images/chapter_title_below.png)


    To add elements to `Stack`, you can use the `Push()` method which stores elements
    at the top of a stack as shown below:


    ```csharp

    using System;

    using System.Collections.Generic;

    using System.IO;

    using System.Linq;

    using System.Text;

    using System.Threading.Tasks;

    using System.Collections;

    namespace MyProgram

    {


    class Program

    {

    static void Main(string[] args)

    {

    Stack newstack = new Stack();

    newstack.Push(true);

    newstack.Push(20);

    newstack.Push("Hello");

    newstack.Push(1.56);

    Console.WriteLine(newstack.Count);

    Console.ReadLine();

    }

    }

    }

    ```


    In the script above, we add four items to the `Stack` `mystack`. You can see that
    a `Stack` can contain items of different data types. Next, we printed the number
    of items in the stack on the console.


    | ![image](d2d_images/chapter_title_corner_decoration_left.png) |  | ![image](d2d_images/chapter_title_corner_decoration_right.png)
    |


    ![image](d2d_images/chapter_title_above.png)


    # Accessing Elements from a Stack


    ![image](d2d_images/chapter_title_below.png)


    There are multiple ways to access elements from a `Stack`. You can use the `Peek()`
    method which returns a single item from the top of the stack. Take a look at the
    following example.


    ```csharp

    using System;

    using System.Collections.Generic;

    using System.IO;

    using System.Linq;

    using System.Text;

    using System.Threading.Tasks;

    using System.Collections;

    namespace MyProgram

    {


    class Program

    {

    static void Main(string[] args)

    {

    Stack newstack = new Stack();

    newstack.Push(true);

    newstack.Push(20);

    newstack.Push("Hello");

    newstack.Push(1.56);

    Console.WriteLine(newstack.Count);

    Console.ReadLine();

    }

    }

    }

    ```


    In the script above, we call the `Peek()` method twice which will return 1.56
    twice since it is the last item in the stack. The output looks like this:


    ![image](d2d_images/image077.png)


    Another way to access elements from a `Stack` is by using the `Pop()`. The `Pop()`
    method removes the last item from the stack and returns the item to the calling
    function. Calling `Pop()` method twice returns last two elements from the stack.
    Take a look at the following example:


    ```csharp

    using System;

    using System.Collections.Generic;

    using System.IO;

    using System.Linq;

    using System.Text;

    using System.Threading.Tasks;

    using System.Collections;

    namespace MyProgram

    {


    class Program

    {

    static void Main(string[] args)

    {

    Stack newstack = new Stack();

    newstack.Push(true);

    newstack.Push(20);

    newstack.Push("Hello");

    newstack.Push(1.56);

    Console.WriteLine(newstack.Count);

    Console.ReadLine();

    }

    }

    }

    ```


    ```csharp

    Console.WriteLine(newstack.Pop());

    Console.WriteLine(newstack.Pop());

    Console.WriteLine(newstack.Count);

    Console.ReadLine();

    ```

