    # WriteAllLines()


    ![image](img/chapter_title_below.png)


    除了一次性将所有数据写入文件的 `WriteAllText()` 之外，你还可以使用 `WriteAllLines()` 方法，它接受一个字符串数组作为第二个参数。在文本文件中，它会为字符串数组中的每个项创建一个新行。看下面的脚本查看
    `WriteAllLines()` 方法的作用：


    ```csharp

    using System;

    using System.Collections.Generic;

    using System.IO;

    using System.Linq;

    using System.Text;

    using System.Threading.Tasks;

    namespace MyProgram

    {

    class Program

