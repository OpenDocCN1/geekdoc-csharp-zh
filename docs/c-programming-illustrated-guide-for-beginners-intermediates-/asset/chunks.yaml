    Missile Fired\");\n    }\n}\n\n}\n``````\n\nThe output of the script above looks\
    \ like this:\n\n![image](d2d_images/image015.png)\n\n# Conclusion\n\nInheritance\
    \ is one of the pillars of object-oriented programming. In this chapter, we started\
    \ our discussion about inheritance in C#. We also saw multiple inheritance with\
    \ the help of examples. Finally, we saw how to pass parameters from a child class\
    \ constructors to parent class constructor. In the next chapter, we will start\
    \ our discussion about polymorphism which is another extremely important concept\
    \ of object-oriented programming!\n\n# Chapter 11 – Polymorphism and Encapsulation\
    \ in C#\n\nIn the last chapter, we studied inheritance which is one of the building\
    \ blocks of object oriented programming. In this chapter, we will discuss Polymorphism\
    \ which is another important concept in object oriented programming. We will also\
    \ briefly review encapsulation which is considered the third pillar of object\
    \ oriented programming.\n\n# Polymorphism\n\nPolymorphism means having multiple\
    \ forms. In terms of object oriented programming, polymorphism refers to the ability\
    \ of an object to behave in different ways.\n\nIn C#, there are two ways to implement\
    \ polymorphism: via method overloading and via method overriding.\n\n# Polymorphism\
    \ via Method Overloading\n\nPolymorphism can be implemented by overloading methods\
    \ of a class. Such type of polymorphism is known as compile time or static polymorphism,\
    \ since the logic for method overloading is evaluated at compile time. We have\
    \ already studied method overloading in a previous chapter.\n\nLet’s take a look\
    \ at a very simple example of polymorphism via method overloading.\n\nExample1:\n\
    \n```csharp\nusing System;\nusing System.Collections.Generic;\nusing System.Linq;\n\
    using System.Text;\nusing System.Threading.Tasks;\n\nnamespace MyProgram\n{\n\n\
    class Program\n{\n\nstatic void Main(string[] args)\n{\n\nX x = new X();\nx.MethodA();\n\
    x.MethodA(10);\nConsole.ReadKey();\n}\n\n}\n\nclass X\n{\n\n    public void MethodA()\n\
    \    {\n        Console.WriteLine(\"This is method A in class X\");\n    }\n\n\
    \    public void MethodA(int n)\n    {\n        Console.WriteLine(\"This is overloaded\
    \ method A in class X\");\n    }\n}\n\n}\n\n}\n```\n"
