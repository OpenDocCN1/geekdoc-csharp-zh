    # 第 1 章 - 引言


    ![image](img/chapter_title_below.png)


    C# 是微软最领先的软件开发语言。微软在 1999 年到 2002 年之间开发了 `C#`。2002 年，`C#` 的第一个版本作为 `.NET` 框架不可或缺的一部分向公众发布。从那时起，`C#`
    取代 Visual Basic 成为 `.NET` 程序员的首选语言。


    C# 是世界上最强大的编程语言之一。`C#` 是完全面向对象且强类型的，目前被用于 `ASP.NET` Web 开发框架的后端语言进行 Web 开发。它也被广泛用
    Windows Forms 和 Windows Presentation Framework 应用程序的后端语言。在移动应用开发领域，`C#` 统治着 Windows
    Phone 开发领域。


    | ![image](img/chapter_title_corner_decoration_left.png) |  | ![image](img/chapter_title_corner_decoration_right.png)
    |


    ![image](img/chapter_title_above.png)


    # C# 的显著特性


    ![image](img/chapter_title_below.png)


    以下是让 `C#` 如此强大且多功能的的一些重要特性：


    | ![image](img/chapter_title_corner_decoration_left.png) |  | ![image](img/chapter_title_corner_decoration_right.png)
    |


    ![image](img/chapter_title_above.png)


    ## 1. 面向对象的语言


    ![image](img/chapter_title_below.png)


    C# 是 99.9% 面向对象的。与 Java 类似，除了基本数据类型外，`C#` 中的一切都是对象。一个对象具有某些属性并可以执行某些功能。我们将在未来的章节中详细介绍面向对象编程。现在，只需记住，正是由于面向对象的编程，`C#`
    才具有了模块化和可维护性。


    | ![image](img/chapter_title_corner_decoration_left.png) |  | ![image](img/chapter_title_corner_decoration_right.png)
    |


    ![image](img/chapter_title_above.png)


    ## 2. 强类型


    ![image](img/chapter_title_below.png)


    C# 是一种强类型语言，这意味着在程序编译之前必须指定数据的类型。这也被称为类型安全，它使得 `C#` 应用程序更加健壮，并且不容易发生运行时错误。


    | ![image](img/chapter_title_corner_decoration_left.png) |  | ![image](img/chapter_title_corner_decoration_right.png)
    |


    ![image](img/chapter_title_above.png)


    ## 3. 自动垃圾回收


    ![image](img/chapter_title_below.png)


    在 `C#` 中，垃圾回收是自动执行的。在一段时间后，`.NET` 框架会自动运行垃圾回收器，从内存中移除所有未使用的对象和悬空指针。


    | ![image](img/chapter_title_corner_decoration_left.png) |  | ![image](img/chapter_title_corner_decoration_right.png)
    |


    ![image](img/chapter_title_above.png)


    ## 4. 易于学习


    ![image](img/chapter_title_below.png)


    与认为是中级编程语言的 C 或 C++ 不同，`C#` 是非常高级的。在 C 或 C++ 中需要仔细处理的大多数功能（如指针和内存管理）在 `C#` 中都是默认处理的。你
    literally 可以在不到 10 分钟内完成环境搭建并编写一个 `C#` 程序。


    | ![image](img/chapter_title_corner_decoration_left.png) |  | ![image](img/chapter_title_corner_decoration_right.png)
    |


    ![image](img/chapter_title_above.png)


    ## 5. 应用范围


    ![image](img/chapter_title_below.png)


    由于 `C#` 是微软最领先的语言，几乎所有技术都依赖于它。例如，`ASP.NET` 框架运行 `C#` 作为后端语言，Windows Phone 开发也利用
    `C#`，Windows Forms 和 Windows Presentation Framework (WPF) 也依赖于 `C#`。


    | ![image](img/chapter_title_corner_decoration_left.png) |  | ![image](img/chapter_title_corner_decoration_right.png)
    |


    ![image](img/chapter_title_above.png)


    ## 6. Visual Studio 的组成


    ![image](img/chapter_title_below.png)


    微软的 Visual Studio 是世界上最常用的 IDE 之一，`C#` 是 Visual Studio 的一部分，这突显了该语言的重要性。


    | ![image](img/chapter_title_corner_decoration_left.png) |  | ![image](img/chapter_title_corner_decoration_right.png)
    |


    ![image](img/chapter_title_above.png)


    ## 7. 巨大的开发者社区


    ![image](img/chapter_title_below.png)


    C# 拥有庞大的开发者社区。在 `C#` 开发过程中遇到的任何问题，你几乎可以立即获得帮助。不用说 www.stackoverflow.com 也是使用 `C#`
    开发的。


    简而言之，`C#` 包含了成为程序员所需的一切。理论部分到此为止，在下一节我们将安装运行应用程序的环境。


