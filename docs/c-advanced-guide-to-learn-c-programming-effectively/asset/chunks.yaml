  trans: "\n\n`OutlineControl` 修改 `Graphics` 对象以将 `SmoothingMode` 参数设置为 `AntiAlias`，这通过混合多边形中的多个像素来使其平滑。随后，使用\
    \ `GetPoints()` 返回新的、经过平滑的形状。`DrawTrademark` 通过应用多层文本创建阴影和内凹效果。这些文本层是通过使用名为 `DrawShadowText`\
    \ 方法创建的，该方法会将文本偏移到一侧或贯穿。内凹效果是通过写入偏移了 `-1` 的文本并输入更亮的颜色来实现的。\n\n### 重载 OnPaint\n\
    人们可以在每次图形实例化时，在表单上创建多个自定义效果，也可以通过创建自定义控件来处理所有这些。为了做到这一点，我们需要重载 `OnPaint` 方法。这是我们在每次绘制控件（例如我们的\
    \ `RoundButton`）时用于重绘控件的方法。\n\n在我们的 `PlayControl` 代码列表中，我们注意到 `OnPaint` 并不是一个事件处理程序，因为该方法是用于创建自定义绘图的类的一部分。我们不需要为它提供事件标记，但我们需要为它提供一个\
    \ `PaintEventArgs` 对象，并带有我们正在使用的 `Graphic` 对象。如果你想遵循默认绘制方法，可以使用继承的 `OnPaint` 方法，该方法也会调用事件处理程序。在我们完成基础绘图后，我们将插入这段代码来创建我们的自定义绘图，正如我们在\
    \ `PlayControl` 列表中使用 `DrawButton` 和 `DrawGraphic` 所示。我们将很快介绍用于实现此点的 GDI+ 工具。\n\
    \n### 使控件失效（Invalidating）\n我们使用 `Invalidate` 方法来更改控件的图形。它会调用 `OnPaint`，触发 `Paint`\
    \ 事件，并强制控件重绘。在 `PlayControl` 列表中，这显示在第 72 行的 `HasOutline` 子程序中。\n\n### 绘制形状并填充\n\
    在与 `Graphics` 类协作时，我们有很多方法来创建多边形和圆形图形，以及填充这些绘图的方法。例如，在制作我们的按钮时，我们使用 `DrawEllipse`\
    \ 绘制按钮的外圆轮廓（取决于 `HasOutline` 是否返回 `true`），并使用 `FillEllipse` 为该区域填充。\n\n这些方法通过使用\
    \ `Pen`（对于 `Draw` 方法）或 `Brush`（对于 `Fill` 方法）来创建相应的图形。你可以使用整数参数或浮点数输入来定义它们需要遵循或填充的路径（区别在于浮点数输入中的数学计算更准确）。这些图形的创建特别取决于这些方法接收什么种类型的参数。对于每种形状都有多个重载函数，它们由编译器选择并使用。\n\
    \n对于矩形区域，你可以使用两个点来定义其输入而不是四个点，它们分别被称为 `Rectangle` 结构和 `Point` 结构（对于整数输入，或者是 `RectangleF`\
    \ 和 `PointF`）。\n\n### 使用变换（Transforms）在屏幕上移动图形对象\nGDI+ 使用多组坐标定义其位置，例如世界坐标、页面坐标和设备坐标。`Graphics`\
    \ 方法在被调用执行时接收世界坐标，这些坐标被转换为页面坐标，然后转换为设备坐标。这一切都在内部完成，并允许我们程序员对原点位置、像素大小等进行更改。我们使用这些变换来提供移动的幻觉。具体来说，对于我们的\
    \ `RoundButton` 示例，我们使用 `Graphics` 对象的位置和大小的缩放矩阵变换来实现这一点。\n\n```csharp\nprotected\
    \ virtual void DrawDownGraphic(Graphics graphics){Matrix m = new Matrix();m.Scale(1.03F,1.03F);graphics.Transform\
    \ = m;}protected virtual void DrawGraphic(Graphics graphics){if(down) DrawDownGraphic(graphics);}protected\
    \ override void DrawGraphic(Graphics graphics){base.DrawGraphic(graphics);graphics.FillPolygon(GraphicBrush(),\
    \ GetPoints());}protected override void OnPaint(System.Windows.Forms.PaintEventArgs\
    \ e){base.OnPaint(e);DrawButton(e.Graphics);DrawGraphic(e.Graphics);}protected\
    \ override void OnMouseDown(System.Windows.Forms.MouseEventArgs e){base.OnMouseDown(e);down\
    \ = true;Invalidate();} \n```\n\n当按钮被点击时，`RoundButton` 控件调用 `OnMouseDown` 方法（在这种情况下，我们使用基类的\
    \ `OnMouseDown` 方法，这允许用户拦截该事件），导致 `down` 字段被设置为 `True` 以失效并更新按钮。这会调用 `OnPaint`\
    \ 来重绘控件；首先调用 `base.OnPaint` 方法，然后是自定义方法。当 `down` 为 `True` 时（即按钮被按下时），`DrawDownGraphic`\
    \ 方法创建一个矩阵对象。该对象被缩放并通过 `graphics.Transform` 传递给 `Graphics` 对象以创建所需的效果。使用变换在某种是一种艺术，你需要良好的眼光、练习和反复尝试才能获得最适合你的效果。\n\
    \n### 使用 GraphicsPath 对象创建形状表单\n`GraphicsPath` 是存储在 `System.Drawing.Drawing2D`\
    \ 命名空间中的类，用于创建一系列连接的线条和曲线。基本上，它是 Windows Forms 的以曲线为中心的对应物。\n\n该类的对象结合了直线和不直的曲线创建一个形状表单。这种组合被发送给对象并用于定义形状的裁剪区域。例如，`PlayControl`\
    \ 的圆角这样创建的：\n\n```csharp\nprivate void ShapeForm(){GraphicsPath path = new GraphicsPath();path.AddPolygon(GetPoints(0));Region\
    \ = new Region(path); } \n```\n\n这段代码创建了一个 `GraphicsPath` 对象 `Path`。该对象使用 `GetPoints`\
    \ 接收点，并发送到 `Region` 中定义一个裁剪区域以创建一个形状。这是一个简单的示例，帮助你理解它在我们的 `PlayControl` 背景下的基本功能，但它本身是单薄的。我们将在下面详细阐述这种形状表单。\n\
    \n### 定义裁剪区域\nWindows Forms 包含一个 `Region` 属性类，代表控件的裁剪区域。这些类对象非常有用，因为它们是用字坐标表示的，缩放它们相当容易。定义一个区域产生一个表单，而不仅仅是任意形状。\n\
    \n下面的代码块重新定义了表单的裁剪区域并将其更改为所示。它的裁剪方式也将框架包含在内。表单对用户的输入做出响应，并在像原始图像一样被拖动时移动裁剪区域。\n\
    \n```csharp\nprivate void Form1_Load(object sender, System.EventArgs e){BackColor\
    \ = Color.Red;GraphicsPath path = new GraphicsPath();path.AddString(\"C#\", Font.FontFamily,\
    \ 1,75,new Point(0, 0), new StringFormat());Region = new Region(path); }private\
    \ void Form1_Click(object sender, System.EventArgs e){MessageBox.Show(\"Clicked!\"\
    ); } \n```\n\n这段代码在 Form Load 事件中更改了背景颜色。我们初始化一个新的 `GraphicsPath` 对象并为其提供字符串和一些字体信息。该对象用于创建一个区域并赋值给表单的\
    \ `Region` 字段。\n\n### 线性比例渐变画刷\n正如我们之前提到的，我们使用 `Brush` 对象来填充和着色形状。有几种类型，例如 `HatchBrush`、`LinearGradientBrush`、`PathGradientBrush`、`SolidBrush`\
    \ 和 `TextureBrush`。所有这些在填充图形形状时都会产生不同的效果。使用画刷时，我们要创建一个画刷类型的实例，要么显式使用 `Brushes`\
    \ 类。\n\n首先，让我们谈谈 `LinearGradientBrush`。这种画刷类型在区域内产生从一种颜色到另一种颜色的渐变。在 `PlayControl`\
    \ 列表中，第 45 行到第 50 行之间显示了这种使用的示例。提供了渐变的起始和结束点，并定义了两端的颜色。这种 Brush 可以通过多种方式进行修改：\n\
    \n*   `Blend` 定义了在渐变区域任意一点上颜色的混合比例。\n\n"
