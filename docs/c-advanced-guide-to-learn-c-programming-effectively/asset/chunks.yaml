  trans: "\n\n```csharp\npublic class ImageButton : DarkButton2 {\n    // TODO: Make\
    \ sure that the image can be deleted!\n    private Image graphic = null;\n\n \
    \   public ImageButton() \n    {\n    }\n\n    protected override Color Getcolor()\n\
    \    {\n        Color[] colors = {Color.MidnightBlue, Color.Black};\n        return\
    \ colors[Convert.ToInt32(down)];\n    }\n\n    private int GetX()\n    {\n   \
    \     return (Width - graphic.Size.Width) / 2;\n    }\n\n    private int GetY()\n\
    \    {\n        return (Height - graphic.Size.Height) / 2;\n    }\n\n    private\
    \ ImageAttributes GetImageAttribute()\n    {\n        ImageAttributes attribute\
    \ = new ImageAttributes();\n        attribute.SetcolorKey(Color.White, Color.White,\
    \ ColorAdjustType.Default);\n        return attribute;\n    }\n\n    private Rectangle\
    \ GetRectangle()\n    {\n        return new Rectangle(GetX() + 1, GetY() + 1,\
    \ graphic.Size.Width, graphic.Size.Height);\n    }\n\n    protected override void\
    \ DrawGraphic(Graphics graphics)\n    {\n        base.DrawGraphic(graphics);\n\
    \        if( graphic == null ) return;\n\n        graphics.DrawImage(graphic,\
    \ GetRectangle(), 0, 0, graphic.Size.Width, graphic.Size.Height, GraphicsUnit.Pixel,\
    \ GetImageAttribute());\n    }\n\n    public Image Graphic\n    {\n        get\
    \ \n        {\n            return graphic;\n        }\n        set \n        {\n\
    \            graphic = value;\n            Invalidate();\n        }\n    }\n}\n\
    ```\n\n关键在于如何修改图像以适应按钮的显示。例如，图像的某些部分可能是不需要显示的。为了移除这些部分，你可以通过定义一个 `ImageAttributes`\
    \ 对象来筛选它们，该对象定义了需要移除的颜色。此外，注意 `DrawImage` 是重载的，以便处理各种输入参数。`ImageButton` 现在使用我们创建的\
    \ `ImageAttributes` 对象来筛选我们所需的颜色（在本例中为白色）并将其移除。如果我们只想移除图像的特定部分，只需让该部分的颜色与传递给 `ImageAttributes`\
    \ 方法的颜色相同。\n\n## 次要话题\n\n我们已经向你概述了 `VideoKiosk.sln` 的工作原理，但请记住，该结构的列表（包括 `Control.dll`）代码远多于数百行。这些代码允许你简化操作，从一个基础的\
    \ `RoundButton` 对象创建所有的控制按钮，但我们想向你展示如何使用和欣赏 GDI+。不过，它确实使用了 `.NET` 中的几个结构来完善其功能，这些与我们的话题是边缘性的。我们在这里讨论它们以供你参阅。\n\
    \n### 运行时间钟\n\n`VideoKiosk.sln` 包含一个使用 `Timer` 滴答更新的运行时间钟。`Timer` 控件并不消耗资源，但对于一个小型时钟来说足够了。\n\
    \n它通过在毫秒定义的时间间隔内触发标记来工作。当此间隔（`Timer.Interval`）完成时，`SetPosition` 函数将使用由 `Player.Elapsed`\
    \ 定义的值更改 `Tracker` 对象的位置，同时更新显示 `Tracker` 时间的数字钟。这是通过定义秒为单位的位置来实现的，以便用于数字钟和 `Tracker`\
    \ 的极值。我们使用一个名为 `TimeSpan` 的方法创建时钟，最初提供以秒为单位的运行时间：\n\n```csharp\nprivate TimeSpan\
    \ GetSpan(int position){return new TimeSpan(0,0,0,position, 0);}\nprivate string\
    \ GetMask(){return \"{0}:{1,2:0#}:{2,2:0#}\";}private string GetFormatted(TimeSpan\
    \ span){return string.Format(GetMask(), span.Hours,span.Minutes, span.Seconds);}\
    \ evenprivate void ChangePosition(){labelElapsed.Text = GetFormatted(GetSpan(Position));}\n\
    ```\n\n该方法还知道如何将秒转换为其他更大的时间单位。秒会自动转换为分钟和小时。`GetMask` 提供了一个格式化字符串来控制 `TimeSpan`\
    \ 的外观，然后用于更新时。我们很快会讨论这个格式化字符串。\n\n### 使用 TimeSpan 计时\n\n`TimeSpan` 可以测量精确到 100\
    \ 纳秒的时间差。这是 `TimeSpan` 的一个“滴答”，就像其他时钟的滴答一样。`TimeSpan` 可以表示为正或负的时间跨度，度量可达天。`TimeSpan`\
    \ 存储时间的字符串格式为 `d:hh:mm:ss.ff`，其中 `ff` 指秒的分数。如果我们需要这个字符串，可以使用 `TimeSpan.ToString()`\
    \ 获取该格式的时间。对 `DateTime` 值进行算术运算也会产生类似的字符串。\n\n### 格式化字符串\n\n我们选择不使用 `TimeSpan.ToString()`，而是手动进行操作，以便从更具教育意义的角度查看字符串的内部工作原理。`Format`\
    \ 和格式化掩码。`GetMask` 为你提供了一个格式化掩码，用于接收字符串中的数据值。该掩码为“{0}:{1,2:0#}:{2,2:0#}”：括号中的值是可以修改的格式字符，其他所有都是字面量。第一个值表示要更改的从零开始的参数，逗号后的任何值代表参数的大小。第三个值代表数字，如果有空间则会在数字前添加一个零（当数字太短时）。例如，`{1,2:0#}`\
    \ 表示第一个可替换参数，长度为 2，且当前填充为 0。\n\n### 提示控件\n\nWindows Forms 包含一个 `ToolTip` 结构。该结构被添加到程序的组件区中，而不是主表单，这导致\
    \ `Form` 的控件增加了 `ToolTip` 属性：这允许你在鼠标悬停在控件上时显示提示文本框。它们是不可见的组件，在运行时不会自动显示。起初使用它似乎并不直观，从表面上看\
    \ Windows Forms 似乎并不支持它，但只需将其添加到组件区即可简单。\n\n### 向工具箱添加控件\n\n我们创建一个自定义控件来为容器添加一组功能。添加控件会自动将其添加到\
    \ Windows Forms 的工具箱选项卡中。\n\n向工具箱添加控件需要你创建一个 `Control` 类库，在其中添加你需要的方法。然后你可以从工具箱右键菜单中访问“自定义工具箱”选项，并将此库添加到你想在工具箱中显示的列表中。这将在书的后续章节详细介绍。\n\
    \n### 捕获和处理异常\n\n我们已经学习了如何使用资源保护块和 `try-finally` 结构处理异常标记。`VideoKiosk.sln` 使用了\
    \ `try-catch` 结构。`Try` 块是你放置运行主代码的地方，`Catch` 块是你添加异常处理代码的地方。如果在 `Try` 中抛出异常，将调用\
    \ `Catch` 块。其基本语法如下：\n\n```cs\ntry{// code to try}catch{// code to run if an error\
    \ occurs}\n```\n\n你可以使用多个 `Catch` 块来处理多个异常，每个块处理特定类别的异常。以下是这样做的示例——在方法中，`SetMaximum`\
    \ 是一个捕获 `OverflowMaximum` 异常的函数，输入整数大于 32 位。\n\n```csharp\nprivate void SetMaximum(double\
    \ duration){try{tracker1.Minimum = 0;tracker1.Maximum = Convert.ToInt32(duration);}catch(OverflowException\
    \ e){MessageBox.Show(e.Message, \"Media Error!\",MessageBoxButtons.OK, MessageBoxIcon.Exclamation);}}\n\
    ```\n\n"
- fmt: "\nAs a final note, do not use an exception handling structure if there isn’t\
    \ an exception to handle. This serves to clean up code and keep it lean.\n\n##\
    \ Making a TODO List\n\nYou can add comments as reminders or headings in Visual\
    \ Studio .NET using comment tokens, which are special keywords. These token keywords\
    \ include `TODO` and any other keyword we have defined. To use them, place them\
    \ immediately after your double forward-slash comment token (` //` ). This places\
    \ the comments in a task list. We can look through this task list by going through\
    \ `View > Show Tasks > All`, or `View > Show Tasks > Comment`, in the Visual Studio\
    \ environment. To make custom tokens, define them in the `Options` list or the\
    \ `Environment > Task List` page:\n\nThe following code demonstrates an update\
    \ to the previous code for the `ImageButton` class, where we remembered to edit\
    \ it using a comment. We’ll add the ability to delete the `Image` property in\
    \ the class, which is done by assigning it a `DefaultValueAttribute`.\n\n```csharp\n\
    public class ImageButton : DarkButton2 {\n    private Image graphic = null;\n\
    \    public ImageButton()\n    {\n    }\n    protected override Color Getcolor()\
    \ {\n        Color[] colors = {Color.MidnightBlue, Color.Black};\n        return\
    \ colors[Convert.ToInt32(down)];\n    }\n    private int GetX() {\n        return\
    \ (Width - graphic.Size.Width) / 2;\n    }\n    private int GetY() {\n       \
    \ return (Height - graphic.Size.Height) / 2;\n    }\n    private ImageAttributes\
    \ GetImageAttribute() {\n        ImageAttributes attribute = new ImageAttributes();\n\
    \        attribute.SetcolorKey(Color.White, Color.White, ColorAdjustType.Default);\n\
    \        return attribute;\n    }\n    private Rectangle GetRectangle() {\n  \
    \      return new Rectangle(GetX() + 1, GetY() + 1, graphic.Size.Width, graphic.Size.Height);\n\
    \    }\n    protected override void DrawGraphic(Graphics graphics) {\n       \
    \ base.DrawGraphic(graphics);\n        if( graphic == null ) return;\n       \
    \ graphics.DrawImage(graphic, GetRectangle(), 0, 0, graphic.Size.Width, graphic.Size.Height,\
    \ GraphicsUnit.Pixel, GetImageAttribute());\n    }\n    [DefaultValue(null)]\n\
    \    public Image Graphic {\n        get {\n            return graphic;\n    \
    \    }\n        set {\n            graphic = value;\n            Invalidate();\n\
    \        }\n    }\n}\n```\n\nThe problem is resolved in line 52 of the above code.\
    \ After this is done, remember to remove the `TODO` token from your code. A tip\
    \ for using comments is to add custom tokens to classify what kind of problem\
    \ something is, and how it should be handled.\n\n## The Process Class\n\nThe `Process`\
    \ Class, introduced in a previous section of the book, is used to actually receive\
    \ an impetus for the rest of the code to run. `Process.Start` is a static method\
    \ attached to the `Click` event handler for the leftmost `ImageButton` control\
    \ on the `PlayControl` interface.\n\n## COM Interop\n\nCOM Interop (for interoperability)\
    \ is a concept in .NET languages that uses COM libraries and controls in .NET\
    \ environments since .NET uses `Reflection` and metadata in its assemblies to\
    \ achieve the same goal. These concepts were explained in a previous section as\
    \ well if you would like to review them.\n\nLet's take the example of the ActiveX\
    \ Media Player from `VideoKiosk.sln`. This is a COM-based control, and to use\
    \ it we need to import these controls to our .NET toolbox by selecting `Customize\
    \ Toolbox` from the `Toolbox` menu. This will import the type library for that\
    \ COM control, and allows their usage in a .NET environment. This, of course,\
    \ comes with the caveat that you will be using outdated COM structures, and you\
    \ also will need to create an installer program to register these commands and\
    \ methods.\n\nTo conclude the discussion we made so far in this chapter, GDI+\
    \ is an improvement and a streamlining of Windows’ powerful GDI toolkit, making\
    \ it much easier and more lenient to handle due to the advent of .NET and the\
    \ addition of new methods and structures. GDI+ is used for imaging, typography,\
    \ and vector-based graphics. The structures GDI+ uses are stateless and require\
    \ constant streams of their information. Use `CreateGraphics` to create a `Graphics`\
    \ object, or take the object received by `Paint` event handlers.\n\n## Chapter\
    \ 4: Personalizing the Visual Studio .NET Framework Environment\n\nThere has been\
    \ considerable investment and research made towards code automation capabilities\
    \ for Visual Studio by Microsoft. This serves to provide quality-of-life changes\
    \ to the way programmers can code things. We are given the capability to replace\
    \ tedious and monotonous processes with automated Wizards, macros, and templates\
    \ that we can create and use ourselves. These macros are extremely flexible owing\
    \ to an extensibility model that lets you customize every detail of Visual Basic\
    \ .NET. This chapter will not go over every detail that you can customize, but\
    \ rather how to create objects such as Wizards and macros yourself, providing\
    \ you with practical information that you can apply and develop yourself.\n\n\
    In this chapter, we will create project templates. Specific topics we will cover\
    \ are:\n\n*   Creating Custom Wizards using `IDTWizard`.\n*   Creating a custom-fit\
    \ Project Template.\n*   Registering your Wizards and Testing them.\n*   Writing\
    \ Macros, using `Macros IDE`.\n\n## Making a Wizard\n\nA `Wizard`, colloquially,\
    \ refers to a series of dialogues that are fed information to create a result.\
    \ These structures have become immensely popular thanks to Windows, and the above\
    \ definition is a result of that fame. Another more accurate definition is that\
    \ a `Wizard` is a series of linear subprograms, as compared to spatial-based programming\
    \ that existed at the time. The advantage that the linear model offers is that\
    \ it reduces the accessibility of the program at a given step, which is beneficial\
    \ in cases such as outcome-based tasks.\n\nAn esoteric definition for programmers\
    \ is that a `Wizard` is an application or subprogram that breaks down a task or\
    \ goal into multiple steps for the user to follow and complete, which is accomplished\
    \ using `IDTWizard`. The user's interaction with the `Wizard` is very easy and\
    \ they only need to click a `Next` button to continue most of the time. Developers\
    \ have a harder time selecting a `Wizard`, since all of the back-end needs to\
    \ be reformulated in order to compress the commands into one button press. However,\
    \ it’s actually quite simple to use `IDTWizard` to create a `Wizard`, and the\
    \ artistic vision of the programmer can be implemented into the console.\n\nThe\
    \ following piece of code is a basic introduction to using `IDTWizard` to make\
    \ a `Wizard`. A more advanced example is also provided later in this chapter.\n\
    \n```csharp\nusing System;\nusing EnvDTE;\nusing System.Windows.Forms;\nnamespace\
    \ HelloWizard{\n    public class HelloWizard : IDTWizard{\n        public void\
    \ Execute(object Application,int hwndOwner, ref object[] ContextParams,ref object[]\
    \ CustomParams, ref WizardResult retval){\n            MessageBox.Show(\"Hello\
    \ Wizard\");\n            retval = EnvDTE.WizardResult.WizardResultSuccess;\n\
    \        }\n    }\n}\n```\n"
