    that examines ‘Type” data of every Control. Both the methodologies function admirably.
    It is not advised to execute a consistent procedure on the controls of a similar
    kind because the utilization of the ‘Controls’ array can lead to a complication
    on the off chance that the controls of UserControl are of the same kind.Surfacing
    Constituent EventsTo complete the task of visual effects of the cluster of buttons
    the thing that needed to be done is the adjustment of the Text property. Button.Image
    can also be utilized for a fine touch by assigning a realistic arrow.Technically,
    the task is not yet completed. The buttons are created so they can send a response
