    - `GammaCorrection` is a simple yes-or-no Boolean answer to the question of whether
    or not gamma correction is applied to the gradient.

    - `InterpolationColors` allows a user to create gradients of more colors than
    just two.

    - `LinearColors` is an array of the starting and ending colors of the gradient.

    - `Transform` allows us to positionally transform (skew, move, rotate, scale,
    etc.) a region.

    - `Rectangle` defines a rectangular region and a gradient between the two points
    used to define the region.


    We have used `LinearGradientBrush` to paint `RountButton` and have also added
    a condition to use different gradients depending on the state of the `down` field.
    The following listing shows how we can use `LinearGradientBrush` methods `RotateTransform`
    and `SetTriangularShape`.


    ```csharp

    1: using System;2: using System.Drawing;33: using System.Drawing.Drawing2D;

    4: using System.Collections;

    5: using System.ComponentModel;

    6: using System.Windows.Forms;

    7: using System.Data;

    8:

    9: namespace GradientBrushDemo10: {

    11: public class Form1 : System.Windows.Forms.Form12: {

    13:

    14: [ Chopped out code that was generated by the forms designer]

    15: private System.Windows.Forms.Timer timer1;

    16:

    17: private float angle = 0;

    18:

    19: private LinearGradientBrush GetBrush()

    20: {

    21: return new LinearGradientBrush(

    22: new Rectangle( 20, 20, 200, 100),

    23: Color.Orange,

    24: Color.Yellow,

    25: 0.0F,

    26: true);

    27: }

    28:

    29: private void Rotate( Graphics graphics,

    30: LinearGradientBrush brush )

    31: {

    32: brush.RotateTransform(angle);

    33: brush.SetBlendTriangularShape(.5F);

    34: graphics.FillEllipse(brush, brush.Rectangle);

    35: }

    36:

    37: private void Rotate(Graphics graphics)

    38: {

    39: angle += 5 % 360;

    40: Rotate(graphics, GetBrush());

    41: }

    42:

    43: private void timer1_Tick(object sender, System.EventArgs e)

    44: {

    45: Rotate(CreateGraphics());

    46: }

    47:

    48: private void Form1_Paint(object sender,

    49: System.Windows.Forms.PaintEventArgs e)

    50: {

    51: Rotate(e.Graphics);

    52: }

    53: }

    54: }

    ```


    Notice how we’ve used a `Timer` control to recreate an ellipse at regular intervals.
    We have used `Yellow` and `Orange` as the two gradient colors. Every time we use
    the `Rotate` method, we increment the floating-point value by five, which is kept
    in check using a modulo operator. `RotateTransform` rotates the brush and `SetBlendTriangularShape`
    creates a triangular-shaped gradient, the three outer points transitioning from
    one color to the other as it approaches the center. Finally, we use `FillEllipse`
    to fill an ellipse using this brush. `Pens` work similarly to `Brushes`; you can
    either create an instance of one to use or call one explicitly from the `Pens`
    class. The code below creates a `Pen` object, initializing it using a `LinearGradientBrush`,
    and uses it to draw an ellipse.


    ```csharp

    LinearGradientBrush brush =new LinearGradientBrush(new Rectangle(0, 0, 2, 2),Color.White,
    Color.Green, LinearGradientMode.ForwardDiagonal);

    Pen p = new Pen(brush, 10F);

    e.Graphics.DrawEllipse( p, 5, 5, 100, 200);

    ```


    ### Tracker Control

    We recall that we used the `Control` class to create our `RoundButton` class object.
    We could’ve improved by using a `ButtonBase` class, since its functionality and
    structures are similar and thus easier to modify. You should always consider what
    base class to use, so that the modification of your inherited structure is much
    easier to achieve. You can also create a `Control` class from scratch, which is
    described later in the book. Sometimes neither of these work and you will need
    to create an inherited class with a base that is tiered higher on the control
    hierarchy, such as `System.Windows.Forms.Control`.


    ### Defining Tracker Control

    Think of a tracker as a custom-made control. In the `PlayControl` example, it
    is the slider at the top of the interface. It looks and functions similarly to
    a progress bar to indicate a relative value between two extremes (i.e. there are
    three variables, a minimum value, a maximum value, and a current position). This
    is an example that will grant you a lot of insight into GDI+ methods and functionalities.
    For our tracker, the minimum defines the left, the maximum defines the right,
    and the progress indicator is somewhere in between, which can be determined using
    a percentage. A complete score listing for the tracker is included in `Tracker.cs`,
    part of `Controls.dll` package in `VideoKiosk.sln`. Consider the range between
    your minimum and maximum is `2000\`. To avoid invalidation and repaint calls (up
    to 2000 unique calls), we instead use an arbitrary number of subdivisions and
    only repaint the progress indicator when there’s a significant change.


    ### SetStyle

    We’ve made a considerable effort to create an appealing combination of foreground
    control elements and a background image in creating `PlayControl`. However, there
    is no native support for transparent backgrounds, which forces us into either
    making the controls look like the background or just let the background image
    show. The latter is a less resource-expensive option and happens to be the cleanest
    solution. To do this, we’ll need to set up an attribute of the control called
    `ControlStylesSupport.SupportsBackTransparentColor`. Setting this up for the tracker
    will allow the background to show through.


    ```csharp

    public Tracker(){this.SetStyle(ControlStyles.SupportsTransparentBackColor, true);}

    ```


    ### ControlPaint

    `ControlPaint` is a GDI+ class that contains methods to draw 3D shapes such as
    buttons or sliders. This class is defined in the `Systems.Windows.Forms` and consists
    of methods for designing buttons, checkboxes, menu glyphs, radio buttons, size
    grips, etc. We’ll use `ControlPaint` to make the visual interface of the `Tracker`.


    ### Drawing a 3D Border

    We want a 3D border for our `Tracker`. The `Tracker` class has a `DrawBar` method
    that draws a bar groove for the `Progress Indicator` to move along. This method
    takes a `Graphics` object as an argument and calls a `DrawBorder3D` method to
    operate on it.


    ```csharp

    protected virtual void DrawBar(Graphics graphics){ControlPaint.DrawBorder3D(graphics,
    GetX(), GetY(),GetWidth(), GetHeight(), Border3DStyle.Etched, Border3DSide.All);}

    ```


    This method is static, and thus requires no special `ControlPaint` object to be
    created for it. Boundaries for the region are specified using `GetX`, `GetY`,
    `GetWidth`, and `GetHeight` methods relative to the tracker’s size. The last two
    arguments are enumerated values, selected from a list of available members according
    to our design considerations. This helps create a visual style that indicates
    movement along the line, and thus we implement the etcborder-style along all sides
    of the border.


    ### Drawing a Button Control

    We can go about creating a button for the `Tracker` in multiple ways. One way
    involves scaling an image that is inserted into the control according to the size
    of the tracker. For instance, let this image be the shape of a button. To draw
    this, the control uses `Tracker.drawTracker` to call `ControlPaint.DrawButton`
    which draws the indicator.


    ```csharp

    protected virtual void DrawTracker(Graphics graphics){ControlPaint.DrawButton(graphics,TrackPosition(),
    (Height-8)/2, 5, 10, ButtonState.Normal);}

    ```


    The vertical offset is (Height – 8)/2, which puts the button squarely along the
    line. Tracking the horizontal position is more complex, and we will use `TrackPosition`
    to achieve this. `ButtonState.Normal` draws the button in an unpushed state.


    ### DrawImage

    The buttons included in the `PlayControl` are of various types, differing most
    visibly by the image. Thus, instead of creating unique classes for each button,
    we can make one class with a subroutine to change what image it needs to display.
    The following code describes an `ImageButton` object, which is a derivative of
    `RoundButton`.

