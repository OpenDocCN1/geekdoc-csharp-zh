    allows users to:


    *   Execute ‘IL ’ (Intermediate Language) code during a program’s run-time.


    *   Use special methods that allow for the viewing of metadata values recorded
    in attributes.


    *   Do some detective work, for instance, exploring the types defined in the corresponding
    assembly and uncovering the members.


