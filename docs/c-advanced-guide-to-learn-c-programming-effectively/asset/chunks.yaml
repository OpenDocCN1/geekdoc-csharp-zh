    请注意，此处的代码与我们原始的 HelloWizard 代码非常相似，只是增加了 `SAFE_CLASS_NAME` 可替换标记。再次，你不需要更改此文件夹中的任何文件，但你可以检查它们以了解其功能，并在需要时对它们进行修改。


    ### 修改 default.js

    `default.js` 存储在 `Scripts\1033\` 中。为了针对我们的模板修改它，我们需要对其进行一个微小但重要的修改，允许我们的 Wizard
    项目能够引用 `envdte.dll`。我们还需要配合 `common.js` 进行操作，这将在下一节中描述。现在，让我们看看如何修改 `default.js`：


    ```javascript

    1: // (c) 2001 Microsoft Corporation2:3: function OnFinish(selProj, selObj)4:
    {5: var oldSuppressUIValue = true;6: try7: {8: oldSuppressUIValue = dte.SuppressUI;9:
    var strProjectPath = wizard.FindSymbol("PROJECT_PATH");10: var strProjectName
    = wizard.FindSymbol("PROJECT_NAME");11: var strSafeProjectName = CreateSafeName(strProjectName);12:
    wizard.AddSymbol("SAFE_PROJECT_NAME", strSafeProjectName);13:14: var bEmptyProject
    = 0; //wizard.FindSymbol("EMPTY_PROJECT");15:16: var proj = CreateCSharpProject(strProjectName,17:
    strProjectPath, "defaultDll.csproj");18:19: var InfFile = CreateInfFile();20:
    if (!bEmptyProject)21: {22: AddReferencesForWizard(proj);23: AddFilesToCSharpProject(proj,24:
    strProjectName, strProjectPath, InfFile, false);25: }26: proj.Save();28: }29:
    catch(e)30: {31: if( e.description.length > 0 )32: SetErrorInfo(e);33: return
    e.number;34: }35: finally36: {37: dte.SuppressUI = oldSuppressUIValue;38: if(
    InfFile )39: InfFile.Delete();40: }41: }42:43: function GetcSharpTargetName(strName,
    strProjectName)44: {45: var strTarget = strName;46:47: switch (strName)48: {49:
    case "readme.txt":50: strTarget = "ReadMe.txt";51: break;52: case "File1.cs":53:
    strTarget = "Class1.cs";54: break;55: case "assemblyinfo.cs":56: strTarget = "AssemblyInfo.cs";57:
    break;58: }59: return strTarget;60: }61:62: function DoOpenFile(strName)63: {64:
    var bOpen = false;65:66: switch (strName)67: {68: case "Class1.cs":69: bOpen =
    true;70: break;71: }72: return bOpen;73: }74:75: function SetFileProperties(oFileItem,
    strFileName)76: {77: if(strFileName == "File1.cs" &#124;&#124; strFileName ==
    "assemblyinfo.cs")78: {79: oFileItem.Properties("SubType").Value = "Code";80:
    } |

    ```


    模板向导的设计使用外部的 JScript 函数。这里提到了四个：`OnFinish`、`GetcSharpTargetName`、`DoOpenFile`
    和 `SetFileProperties`。这些函数专门用于模板向导调用 Wizard Library。


    *   `SetFileProperties` 设置一个标记，说明 `.cs` 文件包含代码。

    *   `DoOpenFile` 在 Visual Studio .NET 中打开类模块文件。

    *   `GetcSharpTargetName` 修改文件名。我们用它将 `file1.cs` 的名称更改为 `class1.cs`。

    *   `OnFinish` 完成文件中方法和参数的替换，并完成包工作。


    我们需要对 `file1.cs` 进行的微小改动是将第 22 行的 `AddReferenceForClass(proj)` 替换为 `AddReferenceForWizard`。该方法尚未在任何地方定义，下一节将修改
    `common.js` 来定义并包含此方法。


    ### 修改 common.js

    项目模板的结构基于共享的向导引擎、文件夹结构、模板文件以及两个组合创建项目模板的 JScript 文件。这是一个复杂且难以处理的系统，但这就是我们所拥。


    `common.js` 是所有模板通用的脚本，存储在 `..\Microsoft Visual Studio .NET\VC#\VC#Wizards\1033\`
    中。我们必须修改此文件以包含对我们新模板及后续项目的引用。将以下代码添加到 `common.js` 以包含 `AddReferenceForWizard`
    方法。


    | 描述 |

    | :--- |

    | `oProj`: 项目对象 |

    | *************************************** |

    | `function AddReferencesForWizard(oProj){var refmanager = GetcSharpReferenceManager(oProj);var
    bExpanded = IsReferencesNodeExpanded(oProj)refmanager.Add("System");refmanager.Add("System.Data");refmanager.Add("System.XML");refmanager.Add("envdte");if(!bExpanded)CollapseReferencesNode(oProj);}`
    |


    我们使用 `AddReferenceForClass` 方法实现了这一点，添加了对 `refmanager` 的调用以引用 `envdte.dll`。我们可以这样做是因为类库的结构已经与我们的非常相似。如果我们从零开始创建模板，我们就需要创建其他方法和类。现在剩下的只需创建一个
    `VSDir` 文件和一个向导启动器文件了。


    ### 向导启动文件

    我们之前在名为“创建自定义向导”的章节中讨论过如何使用 `IDTWizard` 创建向导。然而，我们不需要从零开始创建向导。我们将修改类库模板的向导并使用它。我们只需要告诉“新建项目”对话框它需要选择的向导。


    所有项目模板的向导启动文件存储在目录 `...\Microsoft Visual Studio .NET\VC#\CSharpProjects` 中。类库的向导启动文件存储在
    `CSharpDLL.vsz` 中。复制此文件，将其重命名为类似 `CSharpDLLWiz.vsz` 的名称，并修改其中的代码以引用我们的模板，如下：


    ```

    VSWIZARD 7.0Wizard=VsWizard.VsWizardEngineParam="WIZARD_NAME = CSharpDLLWizWiz"Param="WIZARD_UI
    = FALSE"Param="PROJECT_TYPE = CSharpJ"

    ```


    我们对向导文件进行的唯一修改是让它引用我们的模板。其他参数只是值。


    ### 创建 VSDir 文件

    VSDir 文件定义了“新建项目”和“新建项”对话框接收的信息。这些文件需要两个东西：图标和名称。指定这些内容与模板的连接，它们如下：


    `CSharpDLLWiz.vsz|{FAE04EC1-301F-11d3-BF4B-00C479BC}|Wizard Library|20|#2323|{FAE04EC1-301F-11d3-BF4B-00C479BC}|4547|WizardLibrary`


    这一行包含了现有项目模板的项目。VSDir 文件存储在 `...\Microsoft Visual Studio .NET\VC#\CSharpProjects\CSharpEx.vsdir`，该文件夹也将包含你的向导启动文件。


    这一行通过管道（`|`）符号划分。下表按照出现顺序分解这些字段并描述了它们的作用。


    | 相对路径名称 | 描述 |

    | :--- | :--- |

    | `CSharpDLLWiz.vsz` | 使用相对路径指定向导启动文件。将 `.vsz` 文件与 `.vsdir` 文件存储在同一目录下。 |

    | `{FAE04EC1-301F-11d3-BF4B-00C479BC}` | CLSID 包 | 代表资源 DLL 的 GUID。此特定 GUID 指向名为
    C Sharp 编辑工厂的内容。 |

    | `Wizard Library` | 本地化名称 | 这是模板的本地化名称，以及在新建项目”对话框中显示的名称。 |

    | `20` | 排序优先级 | 决定元素的顺序。排序优先级 1 为最高。 |

    | `#2323` |  | 包含模板本地化文本描述的字符串或资源标识符。 |

    | `{FAE04EC1-301F-11d3-BF4B-00C479BC}` | DLLPath 或 CLSID 包 | 包含指向包含模板图标的 EXE 或
    DLL 资源的 GUID 引用。 |

    | `4547` | 图标资源 ID | 指明从上一个条目引用的资源文件中使用哪个图标。 |

    | `<blank>` | 标记 | 位标记，我们的模板未使用。你可以参考 Visual Studio .NET 关于 VSDir 文件的帮助获取单个标记值。
    |

    | `WizardLibrary` | 建议的基础名称 | 指定模板的默认名称。我们的条目代表一个项目，因此 Wizard Library 项目的根名称将是
    WizardLibrary。第一个项目将是 WizardLibrary1，以此类推。 |


