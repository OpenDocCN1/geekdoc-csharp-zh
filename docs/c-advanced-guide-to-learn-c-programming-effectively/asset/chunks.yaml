    .’ When we are creating a ‘MainMenu’ form control, we are basically taking a blank
    form control and placing the respective objects and elements on it, (although
    the IDE provides templates for this purpose as well).The interactive process of
    adding elements on a ‘MainMenu ’ form control is very intuitive, easy to understand,
    and doesn’t require any special coding so let’s move on to the next form.Implementing
    the ‘OpenFileDialog’ Form ControlThe ‘OpenFileDialog’ form control is something
    that you have come across when using Windows. When you are uploading something
    from your computer’s hard drive to cloud storage, you first need to specify the
    location of the file on your system. This opens a small pop-up window which is
    like a mini-file explorer, and you navigate to your desired file through this
    explorer. This is the ‘OpenFileDialog ’ form control being practically implemented.
    To implement this, we simply need to use a method that is defined in the ‘FormMain
    ’ module as shown below.public void OpenAssembly(){if( openFileDialog1.ShowDialog()
    == DialogResult.OK)OpenAssembly(openFileDialog1.FileName);}The statement ‘OpenAssembly
    ’ is responsible for loading the file we have just selected on to the AssemblyViewer.
    Remember that you will have to add corresponding functionality to the ‘OpenFileDialog’
