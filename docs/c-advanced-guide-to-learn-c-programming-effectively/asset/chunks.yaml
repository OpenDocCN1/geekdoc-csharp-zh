- fmt: "\nWhen exploring C sharp, we find out that the core of this object-oriented\
    \ programming language implements the principal elements with operator overloading,\
    \ inheritance, interfaces, exception handling, garbage collection, multiple interface\
    \ inheritance, reflection, and multi-threading, but you might notice that `C sharp`\
    \ shuns a few functionalities such as templates, raw pointers, and even multiple\
    \ class inheritance. The reason why these functionalities were not included within\
    \ the `C sharp` programming language is because of the argument, which, on one\
    \ side, supports the claim that these features introduce more problems than they\
    \ can potentially solve. On the other side, the belief is that these are key components\
    \ of any object-oriented programming language, and the features they bring to\
    \ the table are priceless, and they need to be included, but keep things simple\
    \ and straightforward, further complications were avoided by simply not adding\
    \ these features to `C sharp`. However, this does not give much confidence to\
    \ anybody who has any experience in programming. This is because the feature set\
    \ of templates, multiple inheritances, and pointers greatly facilitates the user\
    \ in Web application and Web Services projects. Hence, this might be a monumental\
    \ deal-breaker for some people, but `C sharp` does not disappoint their end-users.\
    \ In order to make up for the lack of such tools, `C sharp` includes its own feature\
    \ set that can help users to build Web Applications and Web Services. For instance,\
    \ `C sharp` features a tool that allows for hosting applications on the Windows\
    \ platform, namely, ‘COM interop ..’ Not only that, but `C sharp` also boasts\
    \ multilanguage programming as well as rapid application development.\n\nBut through\
    \ all this ramble, there is still good news. As we discussed before, all the object-oriented\
    \ programming languages have the same core principles with a difference in the\
    \ features implementing them. You will find that some features from other OOPLs\
    \ carry on to `C sharp`. For instance, if you are comfortable with the syntax\
    \ of `C++` or `Java`, then you’ll find that the syntax of `C sharp` is strikingly\
    \ familiar, thus allowing you to settle in considerably faster. This is just one\
    \ of the many similarities you’ll find in `C sharp` when comparing it to other\
    \ object-oriented programming languages, so it’s a good idea to make a quick comparison\
    \ if you’re coming from such languages.\n\nIn the upcoming sections, we will discuss\
    \ the object-oriented basics and discuss the relative features available in `C\
    \ sharp`.\n\n## Defining Classes\n\nCreating and defining classes is done the\
    \ same way as you would in `C++`, albeit the underlying construct of this action\
    \ is slightly different in `C sharp`. The following syntax demonstrates the construct\
    \ required to define a class in `C sharp`.\n\n```\nAccess-modifier class name{}\n\
    ```\n\nOne thing to be mindful of is that just like `C++`, `C sharp` is a case-sensitive\
    \ programming language. Thus, you need to be vigilant of the case in which your\
    \ classes have been defined when referencing them. Otherwise, the compiler will\
    \ not recognize which class you are referring to.\n\nThe syntax demonstrated above\
    \ has the potential of being confusing, so let’s clarify its elements. The syntax\
    \ has two elements - the ‘access modifier ’ and the ‘name ..’ The second element\
    \ is self-explanatory, i.e., it is the set of characters by which the class is\
    \ recognized, but the first element's purpose is to define the scope of the class\
    \ (you should already be familiar with ‘scopes’). Generally, classes are specified\
    \ as ‘public ’ (which is the same as ‘global ’ in other programming languages)\
    \ so that they can be accessed by any function in any program, as long as the\
    \ header file is included (where the classes have been already defined).\n\nSo,\
    \ if we replace the appropriate arguments in the syntax shown above, we will end\
    \ up with something like this:\n\n```\npublic class MyFirstClass{}\n```\n\nIn\
    \ the curly brackets, you fit in your class's contents (the functions, methods,\
    \ and objects it includes). If you look a bit closer, you will see that the class's\
    \ name has all the first letters of each word capitalized. This is not random\
    \ or a mistake. Instead, we follow a convention here when naming classes. The\
    \ purpose of a convention is to maintain consistency when programming, which can\
    \ be really impactful in the long run, but it is not mandatory to follow this\
    \ naming convention (known as ‘Pascal Casing’). It’s all up to you whether you\
    \ choose to use it or not (the same goes for other numerous conventions in programming).\n\
    \n## Using a Class in a Console Application\n\nAssuming that you have some knowledge\
    \ of programming or any amount of programming experience, then you must be familiar\
    \ with the term ‘console.’ When you are using IDE software to code, you will find\
    \ a small window in the bottom that looks similar to that of a command prompt,\
    \ giving the user feedback information when they execute certain commands (such\
    \ as compile, debug, etc.). Moreover, a console will also display syntax errors\
    \ in the code when asked to compile the project you have opened currently.\n\n\
    Similarly, suppose we want to work with `C sharp` to code applications, etc. In\
    \ that case, we will do so by using an Integrated Development Environment (such\
    \ as Microsoft Visual Studio), but we are not to confuse a ‘console’ with a ‘console\
    \ application.’ While a console is natively open in an IDE at all times, a ‘console\
    \ application’ on the other hand, is simply an executable file that does not have\
    \ a fancy GUI. The interface through which the user interacts with the application\
    \ is like a simple command prompt.\n\nIn such tasks, the most common action that\
    \ you will likely perform during `C sharp` programming is implementing the classes\
    \ you have defined in a certain console application. We can easily create a fresh\
    \ console application by opening a ‘New Project’ within the IDE. The underlying\
    \ code for the newly created console application is as follows:\n\n```\nusing\
    \ System;\nnamespace HelloWorld\n{\n    /// <summary>\n    /// Summary description\
    \ for Class1.\n    /// </summary>\n    class Class1\n    {\n        /// <summary>\n\
    \        /// The main entry point for the application.\n        /// </summary>\n\
    \        [STAThread]\n        static void Main(string[] args)\n        {\n   \
    \         // TODO: Add code to start the application here\n        }\n    }\n\
    }\n```\n\nNow let’s break this code down a bit. At the very start of this code\
    \ block, we notice a statement being used, which is ‘using ..’ The argument passed\
    \ to this statement is ‘System ..’ In this block of code, `System` actually refers\
    \ to a `.dll` assembly file available through the `.NET Framework` installed on\
    \ our computer (using Windows, obviously). We do not need to go into the details\
    \ as to ‘why’ a fresh console application is using the `System.dll` assembly file.\
    \ A simple answer to this question of ‘why’ is that this file contains the necessary\
    \ elements required for ‘Common Language Runtime.’ It wouldn't be wrong if we\
    \ even said that the `.dll` file is the console application itself. The `using`\
    \ statement we use in `C sharp` is synonymous with the `include` statement in\
    \ `C++` and the `uses` statement in Delphi.\n\nIn the next step, we specify the\
    \ ‘name ’ of the console application through the `namespace` statement. The argument\
    \ passed to this statement will be the name we assign the project, which in this\
    \ case, would be the conventional name of the very first program created by a\
    \ user, i.e., ‘Hello World.’ However, in the argument, we do not add spaces in\
    \ between a single namespace.\n\nThe ‘slash’ symbols that you see in the middle\
    \ of this block of code represent comments. Anything that is written after three/two\
    \ slashes (`\\\\\\` or `\\\\`) is considered as additional commentary made by\
    \ the programmer. Comments can be really helpful either when you need to go through\
    \ the program's code later on its life cycle or if somebody else is exploring\
    \ it.\n\nAfter the initial three comments, we will see the very first class is\
    \ defined. Since this is a code generated when we create a default console application,\
    \ the classes' names and constructs are standard. It is recommended that you name\
    \ a class you create something that is self-explanatory, short, and easy to recall\
    \ (although not every name can have all three of these elements).\n\nUp next,\
    \ we have the core element of the entire application, the `Main()` member. If\
    \ you have experience with `C++`, then you will be quite familiar with this member.\
    \ `Main` is not a standard member. In fact, it has a special property that turns\
    \ it into what we call a ‘static member . The property associated with a `static`\
    \ member is pretty useful. It allows us to use the method(s) associated with such\
    \ a member without having an ‘enclosing class’ to exist. In addition, an argument\
    \ known as `string[] args` tells us that a bunch of strings (in the form of an\
    \ array) are passed to the `Main` static member. These strings are basically the\
    \ ‘Command Line Arguments’ that you will generally pass during a coding session.\n\
    \n## Printing a Statement in a Console Application\n\nNow that we understand the\
    \ underlying elements of a console application let’s build one to display a simple\
    \ phrase, ‘Hello World!.’ To do this, we will simply be filling in the necessary\
    \ arguments to the statements shown in the code of a console application.\n\n\
    ```\nusing System;\nnamespace HelloWorld\n{\n    /// <summary>\n    /// Summary\
    \ description for Class1.\n    /// </summary>\n    class Class1\n    {\n     \
    \   /// <summary>\n        /// The main entry point for the application.\n   \
    \     /// </summary>\n        [STAThread]\n        static void Main(string[] args)\n\
    \        {\n            Console.WriteLine(\"Hello World!\");\n            Console.ReadLine();\n\
    \        }\n    }\n}\n```\n\nTo print out the phrase, we use two basic functions,\
    \ namely, `Console.WriteLine()` and `Console.ReadLine()`. We specify the phrase\
    \ or sentence we want the console application to display and pass it as an argument\
    \ to the `Console.WriteLine()` function. Once this is done, the `Console.ReadLine()`\
    \ function then stands by until it receives the carriage return it expects before\
    \ it continues with its job. The purpose of the `Console.WriteLine()` function\
    \ is the same as the `cout>>` statement in the `C++` programming language.When\
    \ analyzing the usage of the methods to print out the phrase “Hello World!”, you\
    \ might notice that these methods were used without including an instance of the\
    \ ‘Console object.’ If this were a normal scenario, then you would be absolutely\
    \ right, but the truth is that these methods are actually static members present\
    \ in a class named `Console .`. So, if we want to call upon and use these methods,\
    \ then we don’t need to create an instance of the corresponding class’s object.\n\
    \n## Performing a ‘Read’ on the Command Prompt\n\nWe will now go over the approach\
    \ through which we can effectively intercept the arguments specified to the console\
    \ application. To do this, we simply pass a special argument to the `Console.WriteLine()`\
    \ method. This argument is `args[0]`, and you can see it being implemented in\
    \ the following block of code:\n\n```\nusing System;\nnamespace HelloWorld\n{\n\
    \    /// <summary>\n    /// Summary description for Class1.\n    /// </summary>\n\
    \    class Class1\n    {\n        /// <summary>\n        /// The main entry point\
    \ for the application.\n        /// </summary>\n        [STAThread]\n        static\
    \ void Main(string[] args)\n        {\n            Console.WriteLine(args[0]);\n\
    \            Console.ReadLine();\n        }\n    }\n}\n```\n\nWhen we execute\
    \ this block of code, whenever we pass an argument to the command prompt, it is\
    \ intercepted by the console application displayed on the console.Passing an argument\
    \ to the command prompt can be done in two ways (there are other ways as well,\
    \ but for the sake of simplicity, we will just stick with two).\n"
