    ```\n\nOf key importance is how to alter the image so that it fits into the button’s\
    \ display. For example, some parts of an image are perhaps unnecessary to display.\
    \ To remove these parts, you can screen them out by defining an `ImageAttributes`\
    \ object which defines what colors need to be removed. Also, notice how overloaded\
    \ `DrawImage` is so as account for a variety of input arguments. `ImageButton`,\
    \ now, uses the `ImageAttributes` object we created to screen our desired color\
    \ (white, in this case) and removes it. If we want only to remove a specific part\
    \ of the image, make that part match the same color as given to the `ImageAttributes`\
    \ method.\n\n## Secondary Topics\n\nWe’ve given you a fairly solid overview of\
    \ how `VideoKiosk.sln` works but do keep in mind that the listing for this structure,\
    \ which includes `Control.dll` as well, is well over a few hundred lines of code.\
    \ These would allow you to simplify your operation of making all of your control\
    \ buttons from one base `RoundButton` object, but we wanted to show you how to\
    \ use and appreciate GDI+. However, it does use a few structures from `.NET` to\
    \ round out its functionality, which is tangential to our topic. We’ll discuss\
    \ them here for your perusal.\n\n### The Elapsed Time Clock\n\n`VideoKiosk.sln`\
    \ contains an Elapsed Time clock that is updated using a `Timer` tick. The `Timer`\
    \ control isn’t very resource-intensive, but it does get the job done for one\
    \ small clock.\n\nIt works by raising a flag at time intervals defined in milliseconds.\
    \ When this interval (`Timer.Interval`) completes, a `SetPosition` function changes\
    \ the `Tracker` object's position using a value defined by `Player.Elapsed` that\
    \ also updates the digital clock that expresses the `Tracker`’s time. This works\
    \ by defining a position in seconds so it can be used for the digital clock and\
    \ the extreme values of the `Tracker`. We create the clock using a method called\
    \ `TimeSpan`, which is initially provided the elapsed time in seconds:\n\n```csharp\n\
    private TimeSpan GetSpan(int position){return new TimeSpan(0,0,0,position, 0);}\n\
    private string GetMask(){return \"{0}:{1,2:0#}:{2,2:0#}\";}private string GetFormatted(TimeSpan\
    \ span){return string.Format(GetMask(), span.Hours,span.Minutes, span.Seconds);}\
    \ evenprivate void ChangePosition(){labelElapsed.Text = GetFormatted(GetSpan(Position));}\n\
    ```\n\nThis method also knows how to convert seconds to other larger units of\
    \ time. Seconds are converted to minutes and hours automatically. `GetMask` provides\
    \ a formatting string to control the appearance of `TimeSpan`, which is then used\
    \ to update the clock. We’ll discuss this formatting string soon.\n\n### Using\
    \ TimeSpan to Tell Time\n\n`TimeSpan` can measure time differences to an accuracy\
    \ of 100 nanoseconds. This is a ”tick” of the `TimeSpan`, like the tick of any\
    \ other clock. `TimeSpan` can be represented as either a positive or negative\
    \ span of time that can measure out to days. The string that `TimeSpan` stores\
    \ its time in is `d:hh:mm:ss.ff`, where `ff` refers to fractions of a second.\
    \ If we needed this string we could use `TimeSpan.ToString()` to get time in that\
    \ format. Performing arithmetic on `DateTime` values also yields a string like\
    \ that.\n\n### Formatting Strings\n\nWe choose not to use `TimeSpan.ToString()`\
    \ and instead do it manually for a more educational view into the string's inner\
    \ workings. `Format` and formatting masks. `GetMask` provides you with a formatting\
    \ mask , which serves to receive data values from the string. This mask is“{0}:{1,2:0#}:{2,2:0#}`”:\
    \ values in the bracket are format characters that can be modified, and everything\
    \ else is literals. The first value represents the zero-based argument to be changed,\
    \ and any value after the comma represents the size of the argument. The third\
    \ value represents the number and adds a zero to the number if there’s space for\
    \ it (in the case of the number being too short). For example, `{1,2:0#}` represents\
    \ the first replaceable parameter, length 2, and currently filled with 0.\n\n\
    ### Tooltip Control\n\nWindows Forms contains a `ToolTip` structure. This structure\
    \ is added to the component tray of a program, rather than the main form, which\
    \ causes the `Form`’s controls to have the `ToolTip` property added: this allows\
    \ you to display a tooltip textbox when the mouse hovers over a control. They\
    \ are invisible components and do not show up during runtime automatically. Using\
    \ it seems unintitive at first, and Windows Forms does not seem to support it\
    \ at a cursory glance, but it is as simple as adding it to the Component Tray.\n\
    \n### Adding Controls to a Toolbox\n\nWe create a custom control to add a set\
    \ of functionalities to a container. Adding a control automatically adds it to\
    \ the Windows Forms tab of a toolbox.\n\nAdding controls to a Toolbox requires\
    \ you to create a `Control` Class library, into which you will add the methods\
    \ you need. You can then access the `Customise Toolbox` option from the Toolbox\
    \ context menu and add this library to the list you want to display in the Toolbox.\
    \ This will be expounded upon in later sections of the book.\n\n### Catching and\
    \ Handling Exceptions\n\nWe’ve learned how to work with exception flags using\
    \ the resource protection block and the `try-finally` structure. `VideoKiosk.sln`\
    \ used the `try-catch` structure instead. The `Try` block is the place where you\
    \ place your main code to run, and the `Catch` block is where you add exception-handling\
    \ code. If an exception is raised in `Try`, the `Catch` block is called. The basic\
    \ syntax for this is:\n\n```cs\ntry{// code to try}catch{// code to run if an\
    \ error occurs}\n```\n\nYou can use multiple `Catch` blocks for multiple exceptions\
    \ that each work for a particular class of exceptions. The following is an example\
    \ of how to do so - in the method, `SetMaximum` is a function to catch an exception\
    \ called `OverflowMaximum` the input integer is larger than 32 bits.\n\n```csharp\n\
    private void SetMaximum(double duration){try{tracker1.Minimum = 0;tracker1.Maximum\
    \ = Convert.ToInt32(duration);}catch(OverflowException e){MessageBox.Show(e.Message,\
    \ \"Media Error!\",MessageBoxButtons.OK, MessageBoxIcon.Exclamation);}}\n```\n"
