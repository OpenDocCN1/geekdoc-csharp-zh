  trans: "\n\n# 条件逻辑与数组的使用\n\n有一种技术可以不使用 `if-else` 逻辑，而是而使用数组。这使得代码更加精简干练，且条件语句的 IL\
    \ 代码比使用数组的代码更短。考虑以下示例，它检查一个 `down` 字段并返回颜色。我们有两种方式来实现：\n\n```csharp\nprotected\
    \ virtual Color Getcolor(){Color[] colors = {Color.Silver, Color.Gray};return\
    \ colors[Convert.ToInt32(down)];}\n```\n\n```csharp\nprotected virtual Color Getcolor(){if(\
    \ down )return Color.Gray;else return Color.Silver;}\n```\n\n前者利用了我们的方法，而后者使用基本语句来实现相同的目的，并且更易理解。两者的\
    \ IL 代码有所不同，因为 C# 不允许泛型数组，且 `Boolean` 必须先转换为整数才能用于数组索引。此外，对于非常简单的条件，存在三元运算符（`?:`）。它将变量求值为一个\
    \ `Boolean`——如果为真，则应用第一个选项；如果为假，则应用第二个选项。这产生的 IL 代码最少，但难以用于多个复杂的条件（人们可以使用 `case`\
    \ 代替）。\n\n```csharp\nprotected virtual Color Getcolor(){return down ? Color.Gray\
    \ : Color.Silver;}\n```\n\n关于颜色的说明：带有名称的颜色列表存储在 `Color` 结构中，可以通过 `Getcolor` 方法调用。我们还可以指定\
    \ Alpha 混合（颜色的透明度）、红色、蓝色和绿色色调（范围从 0 到 255，或八进制）来创建颜色。另一个是：我们在 `Getcolor` 中使用了\
    \ `Convert` 类。该类包含用于将数据类型转换为特定类型的方法，例如 `Convert.ToInt32` 将数据转换为 32 位整数。正如我们之前解释过的，由于这些方法经过重载，因此接受大多数数据类型。如果无法转换，则会抛出\
    \ `InvalidCastException`。\n\n# 使用 Graphics 对象\n\nGDI+ 中的 `Graphics` 对象就像一块画布，在上面进行绘画需要对对象进行多次迭代。要创建自定义图形，你需要首先通过以下方式创建\
    \ `Graphics` 对象：使用具有画布的对象（如 Windows Forms）的 `CreateGraphics` 方法，或者作为传递给 `Paint`\
    \ 事件处理程序的 `PaintEventArgs` 参数的属性，或其他方法。一旦创建了对象的实例，就可以使用类方法来创建所需的图形。注意不要缓存此对象，也不要在调用之前方法的递归方法中使用它，因为这些对象是无状态的，不会记住任何内容。我们在下方展示如何从\
    \ `Paint` 事件处理程序请求 `Graphics` 对象，并在每次执行 `Paint` 操作时进行。\n\n## Paint 事件处理器\n\n此处理器接收两个输入参数：\n\
    \n- 一个对象。\n- 一个 `PaintEventArgs` 实例。\n\n该处理器最常见的情况是用户想要创建自己的图形。现在，让我们关注两个直接实现在\
    \ `PlayControl` 接口上的方法。\n\n```csharp\nprivate void PlayControl_Paint(object sender,\
    \ System.Windows.Forms.PaintEventArgs e){OutlineControl(e.Graphics);DrawTrademark(e.Graphics);}\n\
    ```\n\n上述代码中的重构方法描述了它们的功能。然后，为了创建一个漂亮的圆角形状，我们添加了第一条语句以这样使用 `PlayControl`（否则我们无法创建此形状）。最后，为了添加商标“VK”，我们编写了第二条语句。以下代码详细说明了这些函数：\n\
    \n```csharp\nprivate Point[] GetPoints(int shift) \n{\n    return new Point[]\n\
    \    {\n        new Point(3 + shift, 0 + shift),\n        new Point(Bounds.Width\
    \ - 3 + shift, 0 + shift),\n        new Point(Bounds.Width + shift, 3),\n    \
    \    new Point(Bounds.Width + shift, Bounds.Height - 3 + shift),\n        new\
    \ Point(Bounds.Width - 3 + shift, Bounds.Height + shift),\n        new Point(3\
    \ + shift, Bounds.Height + shift),\n        new Point(0 + shift, Bounds.Height\
    \ - 3 + shift),\n        new Point(0 + shift, 3 + shift),\n        new Point(3\
    \ + shift, 0 + shift)\n    };\n}\n\nprivate void OutlineControl(Graphics graphics)\
    \ \n{\n    graphics.SmoothingMode = SmoothingMode.AntiAlias;\n    graphics.DrawPolygon(new\
    \ Pen(Brushes.Black, 2), GetPoints(-1));\n    graphics.DrawPolygon(new Pen(Brushes.White,\
    \ 2), GetPoints(1));\n}\n\nprivate void DrawShadowText(Graphics graphics, string\
    \ s, Font font, Brush foreBrush, Brush backBrush, int x, int y) \n{\n    graphics.DrawString(s,\
    \ font, backBrush, new Point(x, y));\n    graphics.DrawString(s, font, foreBrush,\
    \ new Point(x-1, y-1));\n}\n\nprivate void DrawTrademark(Graphics graphics) \n\
    {\n    Font font = new Font(\"Haettenschweiler\", 24, FontStyle.Bold);\n    DrawShadowText(graphics,\
    \ \"VK\", font, Brushes.DarkSlateBlue, Brushes.White, 5, 5);\n}\n```\n\n"
- fmt: "\n`OutlineControl` modifies the `Graphics` object to set the `SmoothingMode`\
    \ parameter to `AntiAlias`, which blends multiple pixels in a polygon to smoothen\
    \ it out. The new, smoothened shape is then returned using `GetPoints()`. `DrawTrademark`\
    \ creates shadows and an inset effect by applying multiple layers of text. These\
    \ text layers are created using a method called `DrawShadowText` that offsets\
    \ the text to a side or throughout. The inset effect is created by writing that\
    \ text offset by `-1` and inputting a brighter color.\n\n### Overloading OnPaint\n\
    One can either create multiple custom effects on a form every time the graphic\
    \ is instanced or create custom controls to handle all of that. To do so, we would\
    \ need to overload the `OnPaint` method. This is the method we use to remake a\
    \ control (such as our `RoundButton`) every time it is painted. \n\nIn our `PlayControl`\
    \ code listing, we notice that `OnPaint` is not an event handler, as this method\
    \ is a part of the class that is being used to create a custom painting. We do\
    \ not need to give it an event flag, but we need to give it a `PaintEventArgs`\
    \ object, with the `Graphic` object we’re using. If you want a default drawing\
    \ method followed, you can use an inherited `OnPaint` method instead that will\
    \ also call the event handler. After we’ve made the base drawing, we will insert\
    \ this code that makes our custom painting, as we’ve shown in the `PlayControl`\
    \ listing by using `DrawButton` and `DrawGraphic`. We’ll go over GDI+ tools to\
    \ do this soon. \n\n### Invalidating a Control\nWe use the `Invalidate` method\
    \ to change a control’s graphics. It calls `OnPaint`, causing a `Paint` event,\
    \ and forces the control to be repainted. In the `PlayControl` listing, this is\
    \ shown on line 72, in the `HasOutline` subroutine.\n\n### Drawing Shapes and\
    \ Filling Them\nWhile working with the `Graphics` class we have many methods to\
    \ create polygonal and circular drawings and methods to fill said drawings. For\
    \ example, for making our buttons we used `DrawEllipse` to draw the outline circle\
    \ of the button (depending on whether `HasOutline` returns `true`) and `FillEllipse`\
    \ to color in this region. \n\nThese methods work by using a `Pen` (in the case\
    \ of `Draw` methods) or `Brush` (for `Fill` methods) to create their respective\
    \ graphics. You can use either integer arguments or floating-point inputs to define\
    \ the path they need to follow or fill, the difference being that the math in\
    \ floating-point inputs is more accurate). How these graphics are created is particularly\
    \ dependent on what kind of arguments these methods receive. There are multiple\
    \ overloaded functions for each kind of shape, which are selected and used by\
    \ the compiler. \n\nFor rectangular regions, you can use two points to define\
    \ its input instead of four, which are called `Rectangle` structures and `Point`\
    \ structure, respectively (for integer inputs, or `RectangleF` and `PointF`).\n\
    \n### Moving Graphics Objects on the Screen using Transforms\nGDI+ defines its\
    \ position using multiple sets of coordinates, such as world coordinates, page\
    \ coordinates, and device coordinates. A `Graphics` method receives a world coordinate\
    \ when it is called to function, and these coordinates are translated into page\
    \ coordinates and then to device coordinates. All of this happens internally,\
    \ and allows us as programmers to make changes to things such as the origin location,\
    \ pixel size, etc. We use these transforms to provide an illusion of movement.\
    \ Specifically, for our example of `RoundButton`, we use a scaled matrix transform\
    \ of the `Graphics` object’s position and size to do so.\n\n```csharp\nprotected\
    \ virtual void DrawDownGraphic(Graphics graphics){Matrix m = new Matrix();m.Scale(1.03F,1.03F);graphics.Transform\
    \ = m;}protected virtual void DrawGraphic(Graphics graphics){if(down) DrawDownGraphic(graphics);}protected\
    \ override void DrawGraphic(Graphics graphics){base.DrawGraphic(graphics);graphics.FillPolygon(GraphicBrush(),\
    \ GetPoints());}protected override void OnPaint(System.Windows.Forms.PaintEventArgs\
    \ e){base.OnPaint(e);DrawButton(e.Graphics);DrawGraphic(e.Graphics);}protected\
    \ override void OnMouseDown(System.Windows.Forms.MouseEventArgs e){base.OnMouseDown(e);down\
    \ = true;Invalidate();} \n```\n\nWhen the button is clicked, the `RoundButton`\
    \ control calls the `OnMouseDown` method (in this case, we use the base class’s\
    \ `OnMouseDown` method, which allows the user to intercept that event), causing\
    \ the `down` field to be set to `True` to invalidate and update the button. This\
    \ calls `OnPaint` to repaint the control; the `base.OnPaint` method first, then\
    \ the custom method. When `down` is `True` (I.e. the button is pushed in), the\
    \ `DrawDownGraphic` method creates a matrix object. This object is scaled and\
    \ fed to the `Graphics` object via `graphics.Transform` to create the requisite\
    \ effect. Using transforms is something of an art and you’ll need a good eye,\
    \ practice, and retries to get the perfect fit for you.\n\n### Creating Shaped\
    \ Forms, using the GraphicsPath Object\n`GraphicsPath` is a class stored in the\
    \ `System.Drawing.Drawing2D` namespace, used to create a conjoined series of lines\
    \ and curves. Basically, it is the curve-centric analogue to Windows Forms. \n\
    \nThe objects of this class combine straight lines and not-as-straight curves\
    \ to create a shaped form. This combination is sent to the object and is used\
    \ to define a clipping region for a shape. For example, the `PlayControl`’s rounded\
    \ edges are created like so:\n\n```csharp\nprivate void ShapeForm(){GraphicsPath\
    \ path = new GraphicsPath();path.AddPolygon(GetPoints(0));Region = new Region(path);\
    \ } \n```\n\nThis code creates a `GraphicsPath` object `Path`. This object receives\
    \ points using `GetPoints`, and is sent into `Region` to define a region to clip\
    \ in in order to create a form. This is a simple example to help you understand\
    \ its basic functionality in the context of our `PlayControl`, but is fairly lacking\
    \ on its own. We will elaborate on this shaped form below.\n\n### Defining Clipping\
    \ Regions\nWindows Forms includes a `Region` property class which represents the\
    \ control’s clipping region. These class objects are useful because scaling them\
    \ is fairly easy owing to them being expressed in word coordinates. Defining a\
    \ region yields a form, not just an arbitrary shape.\n\nThe following block of\
    \ code redefines a form’s clipping region and changes it to the one shown below.\
    \ It is clipped in such a way that the frame is included as well. The form responds\
    \ to the user’s input and moves the clipping region when it is dragged around\
    \ like it was the original image.\n\n```csharp\nprivate void Form1_Load(object\
    \ sender, System.EventArgs e){BackColor = Color.Red;GraphicsPath path = new GraphicsPath();path.AddString(\"\
    C#\", Font.FontFamily, 1, 75,new Point(0, 0), new StringFormat());Region = new\
    \ Region(path); }private void Form1_Click(object sender, System.EventArgs e){MessageBox.Show(\"\
    Clicked!\"); } \n```\n\nThis block of code also changes the background color in\
    \ the Form Load event. We initialize a new `GraphicsPath` object and provide it\
    \ a string and some information on the font it is to use. This object is used\
    \ to create a `Region`, which is assigned to the form’s `Region` field.\n\n###\
    \ Linear-scaling Gradient Brushes\nAs we’ve mentioned previously, we fill and\
    \ color shapes using `Brush` objects. There’s a few kinds of these, such as `HatchBrush`,\
    \ `LinearGradientBrush`, `PathGradientBrush`, `SolidBrush`, and `TextureBrush`.\
    \ All of these produce a different effect when filling a graphic shape. To use\
    \ a brush, we either create an instance of a brush type or use the `Brushes` class\
    \ explicitly, which contains methods for these.\n\nTo begin with, let’s talk about\
    \ `LinearGradientBrush`. This brush type produces a gradient that transforms from\
    \ one color to another over a region in a user-defined direction. In the `PlayControl`\
    \ listing, between lines 45 and 50, an example of this in use is shown. The gradient’s\
    \ start and end points are provided, and the colors on either end defined. This\
    \ Brush can be modified in various ways:\n\n*   `Blend` defines how much of either\
    \ is to exist at any point along the gradient region.\n"
