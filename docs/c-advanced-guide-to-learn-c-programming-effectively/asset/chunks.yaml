    注意我们如何使用 `Timer` 控件以等间隔重新重新创建一个椭圆。我们使用了 `Yellow` 和 `Orange` 作为两种渐变色。每当我们使用 `Rotate`
    方法时，都会将浮点值增加五，并使用取模运算符对其进行限制。`RotateTransform` 旋转画笔，`SetBlendTriangularShape`
    创建一个三角形的渐变，三个外侧点在接近中心时从一种颜色过渡到另一种颜色。最后，我们使用 `FillEllipse` 使用此画笔填充椭圆。`Pens` 的工作方式与
    `Brushes` 类似；你可以创建其中一个的实例来使用，或者显式地从 `Pens` 类调用。下面的代码创建了一个 `Pen` 对象，使用 `LinearGradientBrush`
    对进行初始化，并使用它绘制椭圆。


    ```csharp

    LinearGradientBrush brush =new LinearGradientBrush(new Rectangle(0, 0, 2, 2),Color.White,
    Color.Green, LinearGradientMode.ForwardDiagonal);

    Pen p = new Pen(brush, 10F);

    e.Graphics.DrawEllipse( p, 5, 5, 100, 200);

    ```


    ### Tracker Control

    我们回记得使用了 `Control` 类来创建我们的 `RoundButton` 类对象。我们本可以使用 `ButtonBase` 类来改进，因为它的功能和结构相似，因此更容易修改。你应该始终考虑要使用哪个基类，这样对继承结构的修改将变得更容易实现。你也可以从头开始创建一个
    `Control` 类，这在书的后面会有描述。有时这两种方法都不起作用，你将需要创建一个在控件层次结构中层级更高的基继承类，例如 `System.Windows.Forms.Control`。


    ### Defining Tracker Control

    将追踪器想象成一个自定义的控件。在 `PlayControl` 示例中，它是界面顶部的滑块。它的外观和功能与进度条类似，用于指示两个极端值之间的相对值（即有三个变量：最小值、最大值和当前位置）。这个示例将让你对
    GDI+ 方法和功能有深入的见解。对于我们的追踪器，最小值定义左侧，最大值定义右侧，进度指示器位于中间某个地方，可以使用百分比确定。追踪器的完整评分列表包含在
    `Tracker.cs` 中，它是 `VideoKiosk.sln` 项目中 `Controls.dll` 包的一部分。考虑最小和最大之间的范围为 `2000\`。为了避免无效化和重绘调用（多达
    2000 次唯一调用），我们改为使用任意数量的划分，并仅在发生显著变化时才重绘进度指示器。


    ### SetStyle

    在创建 `PlayControl` 时，我们付出了巨大的努力创建一个吸引人的前景控件元素和背景图像的组合。然而，原生并不支持透明背景，这迫使我们么要让控件看起来像背景，要么直接让背景图像显示。后者是一个资源消耗较少的选项，而且恰好是最干净的解决方案。为了做到，我们需要设置控件的一个名为
    `ControlStylesSupport.SupportsBackTransparentColor` 的属性。为追踪器设置此项将允许背景显示。


    ```csharp

    public Tracker(){this.SetStyle(ControlStyles.SupportsTransparentBackColor, true);}

    ```


    ### ControlPaint

    `ControlPaint` 是一个 GDI+ 类，包含绘制 3D 形状（如按钮或滑块）的方法。该类定义在 `Systems.Windows.Forms`
    中，由设计按钮、复选框、菜单符号、单选按钮、尺寸柄等的方法组成。我们将使用 `ControlPaint` 来制作 `Tracker` 的视觉界面。


    ### Drawing a 3D Border

    我们想为 `Tracker` 创建一个 3D 边框。`Tracker` 类有一个 `DrawBar` 方法，用于为 `Progress Indicator`
    的移动绘制一条槽。该方法接受一个 `Graphics` 对象作为参数，并调用 `DrawBorder3D` 方法对其操作。


    ```csharp

    protected virtual void DrawBar(Graphics graphics){ControlPaint.DrawBorder3D(graphics,
    GetX(), GetY(), GetWidth(), GetHeight(), Border3DStyle.Etched, Border3DSide.All);}

    ```


    此方法是静态的，因此不需要为它创建特殊的 `ControlPaint` 对象。区域边界使用相对于追踪器大小的 `GetX`、`GetY`、`GetWidth`
    和 `GetHeight` 方法指定。最后两个参数是枚举值，根据我们的设计考虑从可用列表中选择。这有助于创建一种指示沿线移动的视觉样式，因此我们在边框的所有侧都实现了
    `etc-border-style` 样式。


    ### Drawing a Button Control

    我们可以通过多种方式为 `Tracker` 创建按钮。一种方法是根据追踪器的大小缩放插入控件的图像。例如，让此图像成为按钮的形状。为了绘制此，控件使用 `Tracker.drawTracker`
    调用 `ControlPaint.DrawButton` 来绘制指示器。


    ```csharp

    protected virtual void DrawTracker(Graphics graphics){ControlPaint.DrawButton(graphics,TrackPosition(),
    (Height-8)/2, 5, 10, ButtonState.Normal);}

    ```


    垂直偏移量为 (Height – 8)/2，这使得按钮正位于线上。跟踪水平位置更为复杂，我们将使用 `TrackPosition` 来实现这一点。`ButtonState.Normal`
    以未按下的状态绘制按钮。


    ### DrawImage

    `PlayControl` 中包含的按钮有各种类型，最可见的区别在于图像。因此，我们不为为每个按钮创建唯一的类，而是创建一个类，并带有一个子程序来更改它需要显示的图像。下面的代码描述了一个
    `ImageButton` 对象，它是 `RoundButton` 的派生类。


