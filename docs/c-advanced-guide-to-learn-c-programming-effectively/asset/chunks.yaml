    # Registering Wizards


    The Wizard requires access to the `Registry`, but does not need to be a member
    of the Global Assembly Cache (or `GAC`). To this end, we can register it using
    `regasm` as follows:


    ```c:\winnt\Microsoft.NET\v1.0.3705\regasm c:\temp\TypedCollectionWizard.dll /codebase

    ```


    This is the default path for the .NET framework. If there’s a different directory
    in place of `c:\temp`, use that. `/codebase` stores these path in the registry
    using `file://`. Again, the Wizard is still a .NET structure, only accessing the
    registry. It is not a COM component. There will be an explanation at the end of
    the chapter.


    A quick note, the `GAC` is a cache for all the assemblies being used by the machine.
    A Wizard is not a permanent part of that list, and thus it doesn’t need to be
    registered. The `GAC` is, in effect, a giant folder that contains and catalogues
    assemblies for easy use. We recommend looking into a .NET utility called `GACutil.exe`.


    ## Testing the Wizard using a Macro


    Let’s use our macro that we made at the beginning of the chapter to test our Wizard.
    Replace the macro’s `constPath` variable with the address to the `TypedCollectionWizard`,
    and run it.


    ## Running the Wizard from the Command Window


    We can use our macro from the previous section to run our Wizard from the Command
    Window. Select `View > Other Windows > Command Window`. We’ve created a test macro
    called `MyMacro`, stored it in a module named `Module1`, and named the method
    inside `TestCollectionWizard`. All of this combined, we call our Wizard with this
    line of code:


    ```Macros.MyMacros.Module1.TestCollectionWizard

    ```


    A list of commands will pop up when you type the word `Macros`, via `Intellisense`.


    ## Secondary Topics


    The chapter introduced into a wide variety of tools and concepts such as `JScript`,
    `gacutil.exe`, `regasm.exe`, etc. These are structures with extensive documentation,
    and a more thorough introduction to these concepts is in order:


    ### Returning to JScript


    We used a bit of `JScript` to implement our templates, which is done by calling
    an external compiler. However, `JScript` is a completely different and just-as-fleshed-out
    language as compared to `Visual Basic .NET` and `C#`. You’re likely to find code
    written in this language in things such as clientside code for webpages and `ACT`
    (a testing automation application developed by Microsoft). The following checklist
    describes how you may go about writing some `JScript` .NET code.


    *   Open `NotePad`.

    *   Write `print("Hello World!")`.

    *   Save this file as `HelloWorld.js`, and remember its directory. Close the file.

    *   Open the command prompt, and run the file by calling the compiler as follows:


    ```c:\winnt\Microsoft.NET\Framework\V1.0.3705\jsc Hello.js



    ### Using the regasm Utility


    Wizards are an important part of Visual Studio .NET that are attached to it using
    `COM`. To do so, we use the `regasm` utility. Two forms that works best for this
    are:


    ```regasm assemblyname /codebase

    ```

    ```regasm assemblyname /unregister

    ```


    1. `regasm` simply refers to the utility. `assemblyname` is the name of the assembly
    containing the Wizard DLL. `/codebase` adds the code to the registry. It is technically
    all that is required to make a complete call, though it does provide a warning
    to use a strongly-worded name (by using `sn.exe`, for example) to avoid version
    problems.

    2. Similar to the above, except it uses `/unregister` to unregister the Wizard
    from the registry.


    The wizard does not use `COM`. It is required to register the DLL into the registry
    to load it into the Visual Studio .NET environment. To read the registry assembly,
    do:


    ```regasm assemblyname /regfile:regfile

    ```


    where `assemblyname` would refer instead to your assembly and the second `regfile`
    refers to a `.reg` extension file.


    ## Conclusion


    Programming has come a long, long way from what it was ten years ago, and it continues
    to grow and develop at an exponential pace. We’ve developed things such as exception
    handlers, that have a contingency plan for pretty much every situation that we
    can imagine.


    As we’ve mentioned, the field of programming is ballooning at an extremely rapid
    pace, and it’s quickly becoming less and less probable that one person can know
    everything about programming. Specialization is the norm now as it is simply impossible
    for someone to know everything about everything. Just in this one chapter, we’ve
    touched on three massive languages - `Visual Basic .NET`, `JScript` (or JavaScript),
    `C#` - and utility programs `GACutil.exe` and `regasm.exe`. A programmer now only
    has a basic understanding of the underlying concepts but needs to opt in to one
    of these fields. They can focus on game development, or web design, or even more
    utilitarian application/software programming. Anything you can imagine.


    Automation also is beginning to form a real concern to programmers (and humans
    as a whole), based on the strength of modern computers and the speed at which
    they can grasp concepts given a ruleset. In games requiring intellect and complex
    decision-making, such as chess, the Chinese game Go, and `DotA 2`, programs that
    have used advanced automation to repeat processes and develop optimal strategy
    have far overtaken the capability of humans. Programming can be left to programs
    themselves, now.


    We have now come to the end of our journey. Even though you might have felt `C#`
    to be a bit difficult and at times, frustrating to understand, regardless you
    have increased your programming knowledge. In the world of programming, experience
    is the best teacher you can ever find. While we have tried our best to provide
    you with adequate explanations of concepts and advanced topics, you might still
    feel that something was missing. If that’s the case, then you are on the right
    track of learning. Anything that you feel is ambiguous, will serve as an impetus
    to a specific topic for research which will expose you to even more things, causing
    a domino effect. Every chapter in this book has tried to cover all of the aspects
    of `C#` programming to a certain extent, however, it is out of the scope of this
    book to completely dominate every advanced programming element of `C#`. Thus,
    it is important to provide the readers with the `C#` programming’s most important
    central information, if not the complete package. It is highly recommended that
    you research the aspects which confuse you, this will help clarify your concepts
    at a level which would otherwise have not been possible.


    In short, we have explored the fundamental principles of object-oriented programming
    in the first chapter and learned how `C#` implements these principles through
    various functions. In the next chapters, we discovered the extended functionalities
    in `C#` programming such as using the `Reflection` function in the .NET framework
    to extract information from assemblies and use them. Finally, we move on to truly
    advanced `C#` programming topics such as using `GDI+`, working with `Visual Studio
    .NET` and the `Event logger`, and last but not least, understanding how to effectively
    use `UserControls` to create the interface of an application. All of these topics
    collectively define the `C#` programming paradigm and we hope that the reader
    learns and understands the core concept of every topic and discussion in these
    chapters. Exposure to a programming language can go a long way in a person’s programming
    career as someone might have to reverse engineer a mechanism built using programming
    languages like `C#`, `C++`, etc. So it’s recommended always to have the eagerness
    to learn a programming language no matter how intriguing it may seem.


    ## References


    Advanced C# Programming by Author: Paul Kimmel

