    ## 4. Internal Access Modifier

    a class whose members and types have their access modifier specified to ‘internal
    ’ have their access restricted only to the assembly in which they are present.
    In this way, any external will not be able to access these classes, or members
    and the code will be able to communicate with the members and types of classes.


    ## 5. Protected Internal Modifier

    this access modifier is basically the result of slapping the protected modifier
    on top of the internal modifier. Just as how a protected access modifier would
    generally be used in nested classes, the protected internal modifier is mostly
    used with nested types as well. Only the assembly has unrestricted access to the
    members of the nested classes in a protected internal modifier.


    However, there are some rules you need to follow when using access modifiers in
    order to avoid generating errors.


    - Whenever you are defining a high-tier type, its access modifier must always
    be specified to ‘Public.’ Otherwise, it will surely cause complications when other
    types need to communicate with the high-tier type. If you do not want to use the
    ‘Public’ access modifier, then the only other option you have is to use the ‘Internal’
    access modifier.

    - Whenever you are dealing with nested classes or types (in a nested class, a
    class contains another class. Similarly, a nested type is a type that holds the
    definition of another type), you have to choose between either using the ‘Private’
    access modifier or the ‘Protected’ access modifier.

    - Even though ‘Protected Internal’ is a combination of two access modifiers (protected
    and internal), it is highly advised to avoid combining any other access modifiers
    in this way.

    - If a class or a type is not specified with any access modifier, then a ‘default
    access authorization’ will be given to the corresponding members, but it is not
    recommended to rely on this. Producers should always specify the appropriate access
    modifier.


    The concept of using modifiers with Classes and Members has already been discussed
    in one way or the other when we talked about access modifiers. Regardless, if
    you find that the class you have defined is enclosed within a namespace, it is
    best to set its access modifier to either ‘Public’ or ‘Internal.’ When working
    with nested classes, your options are limited as to which access modifiers you
    can use to define them. These options include ‘protected, protected internal or
    private’ access modifiers.Members give the producer the freedom of assigning any
    access modifier to them. If you do not specify any access modifier, then it will
    be set to private by default.


    ### Reflection

    This is basically a functionality that is largely used in the .’NET Framework
    .’ By using ‘reflection,’ a user can explore a program’s assembly to extract data
    in the code, which can include.


    - Namespaces

    - Interfaces

    - Classes

    - Methods

    - Properties

    - Fields


    Apart from that, reflection is an extremely useful object-oriented function that
    allows users to:


    - Execute ‘IL ’ (Intermediate Language) code during a program’s run-time.

    - Use special methods that allow for the viewing of metadata values recorded in
    attributes.

    - Do some detective work, for instance, exploring the types defined in the corresponding
    assembly and uncovering the members.


    ## Chapter 2: Working with the Assembly Viewer and UserControls

    In the very last section of the previous chapter, we briefly discussed the object-oriented
    function ‘Reflection.’ This chapter extends the discussion and allows the reader
    to explore the practical use of ‘Reflection’ to examine the data contained within
    the assemblies.This entire chapter''s core concept is based on dynamically loading
    the assemblies and using Reflection to explore this assembly using the assembly
    viewer. The main take away here is that understanding the process of loading assemblies
    and using them gives huge potential beneficial uses. For instance, we can wirelessly
    load assemblies using HTTP connections, and by lightly programming the client,
    we can automate two tasks:


    - Deploying applications that are based on the ‘Windows-Forms’ framework.

    - Roll out updates for these applications based on Windows Forms.


    Aside from this, we will also explore a number of other topics in this chapter,
    such as creating and declaring static methods, using interfaces like `IEnumerator`,
    and practically demonstrating the use of inheritance.In the end, we will also
    explore the functionality of UserControls to create the buttons, icons, and actions
    that you see designed in many Windows applications.


    ### Analyzing the Assembly Manager’s Code Listing

    In this section, we will explore one of the most important modules necessary for
    using the Reflection function to load assemblies and extract information. The
    necessary functions, methods, classes, and objects can be found within the `AssemblyManager.cs`
    module. Unfortunately, the website on which this module''s source code was hosted
    has been shut down, but the following list shown below has all the important bits
    and pieces you would need from the module itself (such as the methods or classes).


    ```c

    1: using System;

    2: using System.Reflection;

    3: using System.Diagnostics;

    4: using Diag = System.Diagnostics;

    5: using System.IO;

    6: using System.Collections;

    7: using System.Text;

    8: using System.Windows.Forms;

    9:

    10: namespace AssemblyViewer

    11: {

    12: /// <summary>

    13: /// Summary description for AssemblyManager.

    14: /// </summary>

    15: public class AssemblyManager

    16: {

    17: private string name = "";

    18: private Assembly;

    19:

    20: public AssemblyManager(string assemblyName)

    21: {

    22: Debug.Assert(File.Exists(assemblyName));

    23: Name = assemblyName;

    24: }

    25:

    26: public Assembly Assembly

    27: {

    28: get

    29: {

    30: return assembly;

    31: }

    32: }

