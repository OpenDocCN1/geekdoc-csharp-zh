    Notice how this is very similar to our original HelloWizard code, with the addition
    of `SAFE_CLASS_NAME` replaceable tokens. Again, you don’t need to change any files
    in this folder, but you can inspect them to see what they do and modify them if
    you want to.


    ### Modifying default.js

    `default.js` is stored in `Scripts\1033\`. To modify it for our template, we need
    to make one small but important modification to it that allows our Wizard projects
    to reference `envdte.dll`. We need to coordinate this with `common.js` as well,
    which is described in the next section. For now, let’s see how we will modify
    `default.js`:


    ```javascript

    1: // (c) 2001 Microsoft Corporation2:3: function OnFinish(selProj, selObj)4:
    {5: var oldSuppressUIValue = true;6: try7: {8: oldSuppressUIValue = dte.SuppressUI;9:
    var strProjectPath = wizard.FindSymbol("PROJECT_PATH");10: var strProjectName
    = wizard.FindSymbol("PROJECT_NAME");11: var strSafeProjectName = CreateSafeName(strProjectName);12:
    wizard.AddSymbol("SAFE_PROJECT_NAME", strSafeProjectName);13:14: var bEmptyProject
    = 0; //wizard.FindSymbol("EMPTY_PROJECT");15:16: var proj = CreateCSharpProject(strProjectName,17:
    strProjectPath, "defaultDll.csproj");18:19: var InfFile = CreateInfFile();20:
    if (!bEmptyProject)21: {22: AddReferencesForWizard(proj);23: AddFilesToCSharpProject(proj,24:
    strProjectName, strProjectPath, InfFile, false);25: }26: proj.Save();28: }29:
    catch(e)30: {31: if( e.description.length > 0 )32: SetErrorInfo(e);33: return
    e.number;34: }35: finally36: {37: dte.SuppressUI = oldSuppressUIValue;38: if(
    InfFile )39: InfFile.Delete();40: }41: }42:43: function GetcSharpTargetName(strName,
    strProjectName)44: {45: var strTarget = strName;46:47: switch (strName)48: {49:
    case "readme.txt":50: strTarget = "ReadMe.txt";51: break;52: case "File1.cs":53:
    strTarget = "Class1.cs";54: break;55: case "assemblyinfo.cs":56: strTarget = "AssemblyInfo.cs";57:
    break;58: }59: return strTarget;60: }61:62: function DoOpenFile(strName)63: {64:
    var bOpen = false;65:66: switch (strName)67: {68: case "Class1.cs":69: bOpen =
    true;70: break;71: }72: return bOpen;73: }74:75: function SetFileProperties(oFileItem,
    strFileName)76: {77: if(strFileName == "File1.cs" &#124;&#124; strFileName ==
    "assemblyinfo.cs")78: {79: oFileItem.Properties("SubType").Value = "Code";80:
    } |

    ```


    The template wizard is designed to use external JScript functions. There are four
    of them mentioned here: `OnFinish`, `GetcSharpTargetName`, `DoOpenFile`, and `SetFileProperties`.
    These are used exclusively by the template wizard to call for the Wizard Library.


    *   `SetFileProperties` sets up a flag to mention that the `.cs` files contain
    code.

    *   `DoOpenFile` opens the class module file in Visual Studio .NET.

    *   `GetcSharpTargetName` changes the name of the file. We use it to change `file1.cs`
    name to `class1.cs` instead.

    *   `OnFinish` completes the substitutions for the methods and parameters in the
    file, and ties up the package.


    The small change that we needed to make to `file1.cs` is replace `AddReferenceForClass(proj)`
    to `AddReferenceForWizard` on line 22. This method isn’t defined anywhere yet
    and the next section modifies `common.js` to define and include this method.


    ### Modifying common.js

    The structure of the Project Template is based on the shared wizard engine, the
    folder structure, the template files, and two JScript files that combine to create
    a project template. This is dense, unwieldy system, but it is what we have.


    `common.js` is a script common to all templates, stored in `..\Microsoft Visual
    Studio .NET\VC#\VC#Wizards\1033\`. We have to modify this file to include references
    to our new template and subsequent projects. Add the following code to `common.js`
    to include the `AddReferenceForWizard` method.


    | Description |

    | :--- |

    | `oProj`: Project object |

    | *************************************** |

    | `function AddReferencesForWizard(oProj){var refmanager = GetcSharpReferenceManager(oProj);var
    bExpanded = IsReferencesNodeExpanded(oProj)refmanager.Add("System");refmanager.Add("System.Data");refmanager.Add("System.XML");refmanager.Add("envdte");if(!bExpanded)CollapseReferencesNode(oProj);}`
    |


    We made this using the `AddReferenceForClass` method, adding a call to the `refmanager`
    to refer to `envdte.dll`. We can do this because the Class Library structure is
    already very similar to ours. If we’re making a template from scratch, we would
    need to create other methods and classes. Now all that’s left is to create a `VSDir`
    file and the Wizard Launcher file.


    ### The Wizard Launch File

    We’ve already discussed how to create a Wizard using `IDTWizard` in a previous
    section titled “Creating a Custom Wizard”. However, we do not need to create a
    Wizard from scratch. We’ll modify the Class Library template’s Wizard and use
    that. We will only be telling the New Project dialog the Wizard it needs to select.


    The Wizard Launch files for all Project Templates are stored at the directory
    `...\Microsoft Visual Studio .NET\VC#\CSharpProjects`. The Wizard Launch file
    for the Class Library is stored in `CSharpDLL.vsz`. Copy this file, rename it
    to something like `CSharpDLLWiz.vsz`, and modify the code within to refer to our
    template, as follows:


    ```

    VSWIZARD 7.0Wizard=VsWizard.VsWizardEngineParam="WIZARD_NAME = CSharpDLLWizWiz"Param="WIZARD_UI
    = FALSE"Param="PROJECT_TYPE = CSPROJ"

    ```


    The only change we made to the original file is to change the Wizard to refer
    to our template’s wizard. The other parameters are just conditional values. Now
    all that’s left is to create `VSDir` and test our template.


    ### Creating a VSDir File

    These files define what information is received by the New Project and Add Item
    dialogs and how items in those lists are displayed. They require two things -
    an icon and a name. Specify the connection between these two things and the template
    you want them to refer to. The listing for `VSDir` is as below, written in a single
    line - we will explain how this works after:


    `CSharpDLLWiz.vsz|{FAE04EC1-301F-11d3-BF4B-00C04F79EFBC}|Wizard Library|20|#2323|{FAE04EC1-301F-11d3-BF4B-00C04F79EFBC}|4547|
    WizardLibrary`


    This one line contains the existing project template’s items. `VSDir` files are
    stored in `...\Microsoft Visual Studio .NET\VC#\CShaprProjects\CSharpEx.vsdir`
    and this folder will also contain your Wizard Launch file.


    This one line is divided into fields by “pipes” (the `|` symbol). The following
    table breaks these fields down in order of appearance, and describes what they
    do.


    | Relative Path Name | Description |

    | :--- | :--- | :--- |

    | `CSharpDLLWiz.vsz` | - | Specifies the wizard launch file using a relative path.
    Store the `.vsz` file in the same directory as the `.vsdir` file. |

    | `{FAE04EC1-301F-11d3-BF4B-00C04F79EFBC}` | CLSID package | A GUID representing
    a resource DLL. This particular GUID refers to something named the C Sharp Editor
    Factory. |

    | `Wizard Library` | Localized name | This is the template''s localized name and
    the name that will appear in the New Project dialog. |

    | `20` | Sort priority | Determines the order in which elements are listed. A
    sort priority of 1 is the highest. |

    | `#2323` | Description | A string or resource identifier containing a localized
    text description of the template. |

    | `{FAE04EC1-301F-11d3-BF4B-00C04F79EFBC}` | DLLPath or CLSID package | Contains
    a GUID reference to an EXE or DLL resource that contains icons for the template.
    |

    | `4547` | Icon resource ID | Indicates which icon to use from the resource file
    referred to from the previous entry. |

    | `<blank>` | Flags | Bitwise flags, not used by our template. You can refer to
    the Visual Studio .NET help for VSDir files for individual flag values. |

    | `WizardLibrary` | Suggested base name | Specifies the default name for the template.
    Our entry represents a project, therefore,the root name for Wizard Library projects
    will be WizardLibrary. The first new project will be WizardLibrary1, and so on.
    |

