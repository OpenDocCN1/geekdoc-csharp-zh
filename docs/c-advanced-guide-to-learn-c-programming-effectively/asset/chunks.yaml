    * 通过命令行提示符执行程序并传递相应的参数。

    * 使用 Microsoft Visual Studio IDE 向命令行提示符传递参数。


    让我们详细介绍第二种方法。使用 `.NET Visual Studio` 集成开发环境并不复杂，因为到此时你已经具有使用其他 IDE 的经验。为了使用 IDE
    向命令行传递参数，我们需要执行以下操作：


    1. 打开 Visual Studio IDE，并在 `View`（视图）选项卡中找到 `Solution Explorer`（解决方案资源管理器）菜单。

    2. 进入 `Solution Explorer` 菜单后，你会看到你正在工作或放置在 IDE 浏览目录中的所有项目列表。在这里，你需要找到要为此任务操作的项目，然后右键点击它。这将打开一个下拉菜单，从中选择
    `Properties`（属性）选项。

    3. 这将打开一个如下所示的新窗口：


    ![](img/image_rsrc318.jpg)


    在左侧，你将看到一个小型文件导航界面。在这里，双击 `Configuration Properties`（配置属性），并在内部选择 `Debugging`（调试）。

    4. 在名为 `Start options`（启动选项）的第 3 类类别中，第一部分将是 `Command Line Arguments`（命令行参数）。在这里，你需要指定一个适当的值。在这种情况下，我们传递了一个参数
    `Debugging C#`。

    5. 一旦完成命令行参数的传递，我们可以手动重启在 IDE 中打开的应用程序，或者按快捷键 `F5 key` 进行重启。一旦应用程序在重启后通过 IDE 运行，我们就能看到传递给命令行提示符的参数。

