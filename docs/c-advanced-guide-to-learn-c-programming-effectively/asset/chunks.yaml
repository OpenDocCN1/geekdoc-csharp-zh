- fmt: "\nThis template is used to create the following entry in the New Project dialog\
    \ box:![](image_rsrc31D.jpg)\n\nNow that everything is done, lets test our template\
    \ by creating a new project. Go to `File > New > Project`, click on the Wizard\
    \ Library icon, and press OK. You should now have a new Class Library project\
    \ with an `assemblyinfo.cs` file and a file named `WizardLibrary1.cs`, which should\
    \ contain a basic execution of `IDTWizard`. Do double check that a reference to\
    \ `envdte.dll` exists. \n\nA final note for this section regarding the project’s\
    \ template is that it’s a combination of shared files from across the base class\
    \ and the environment. An important one of these is `DefaultDLL.csproj` file,\
    \ which is located in `…\\Microsoft Visual Studio .NET\\VC#\\VC#Wizards` folder.\
    \ All DLL-based projects refer to this template. Also, most of the process of\
    \ creating a template is copy and pasting things, rather than creating things\
    \ from scratch. Make a template if you are going to use a custom project structure\
    \ often to simplify tedious tasks and streamline your process.\n\nNow that all\
    \ of this works, let’s use these to make something that automates tasks for you.\n\
    \n## Extending Visual Studio .NET with Wizards\n\nA wizard is a simple way to\
    \ create a task automation that benefits newer programmers. Creating a wizard\
    \ allows your team to use the more unique aspects of .NET programming more easily.\n\
    \nLet’s make a wizard that creates a strongly-typed collection , a collection\
    \ that inherits from `ReadOnlyCollectionBase` or `CollectionBase`. Methods in\
    \ these classes include `IList`, `IListSource`, `IENumberable`, which results\
    \ in you creating a collection structure that behaves like an array and can be\
    \ sorted and used by a `DataGrid` control and can be compiled into an ADO.NET\
    \ dataset. This wizard already exists and it is named `TypedCollectionWizard`\
    \ and it implements methods from `System.Collections.CollectionBase`. It works\
    \ by creating a new class that inherits from the previous one, adding an indexer\
    \ and an `Add` method. We will use this example to understand how to make macros\
    \ and program against the Common Environment Object model.\n\n## Writing a Macro\n\
    \nWe now already have a basic understanding of how to create, write, and test\
    \ wizards, which will serve us well in writing macros as well, alongside things\
    \ such as C# programming and Windows Forms interfacing. Let’s continue with how\
    \ to write a macro.\n\nMacro support is a part of Visual Studio .NET’s extensibility\
    \ model, alongside but separate from Macros IDE. Macros are written using Visual\
    \ Basic .NET. Macros IDE is a project-centric environment, and the macro files\
    \ created are stored with `.vsmacro` extensions, though Visual Basic code can\
    \ also be communicated to it.\n\nTo start, open Macros IDE from `Tools > Macros\
    \ > Macros IDE`. Using this is similar to Visual Studio .NET. In this new environment,\
    \ select the `Project Manager` from the `View` menu. To create a new macro, select\
    \ an existing module or create a new one (a module is a sourcecode file). Add\
    \ a simple subroutine (read: method) to it and see if it works by starting a debug\
    \ process from `Debug > Start`. Here’s an example of a macro which simply produces\
    \ a message box that says “Hello World!”:\n\n```vb\n\nSub HelloWorld()\nMsgBox(\"\
    Hello World!\")\nEnd Sub\n```\n\nLet’s move on to a more practical example of\
    \ a macro that adds a new class to an existing project, similar to how we will\
    \ reconstruct `TypedCollectionWizard` later. The following macro does exactly\
    \ that: it adds a new class file to an active project’s directory, and the second\
    \ (empty) entry is where the name of the new class would go. By default, an appropriate\
    \ name is produced by the method itself:\n\n```vb\nSub TestNewFile()\nDTE.ItemOperations.AddNewItem(\
    \ _\n\"Local Project Items\\Class\", \"\")\nEnd Sub\n```\n\nNotice the `DTE` namespace\
    \ keyword. The following section is devoted to giving a brief overview of this\
    \ keyword, referring to the design-time environment.\n\n## The Common Environment\
    \ Model\n\nA `DTE` is a design-time environment object, referred to by internal\
    \ documentation as a Common Environment Model, or the automation model, or the\
    \ extensibility model. We will continue to refer to it as a `DTE`. It is the root\
    \ of a project, representing an object model allowing access to the capabilities\
    \ of Visual Studio .NET. `DTE` uses interfaces to create an object-oriented accessibility\
    \ within the Visual Studio .NET environment, which is, in effect, a method for\
    \ automation. The documentation for this model is very large, and perusal is at\
    \ one’s own risk.\n\nFor our current concern, we’ll only use a small section of\
    \ that manual to apply `DTE` for macros and C# code, which should serve to introduce\
    \ you to the core concepts of using it. A good way to think about `DTE` is as\
    \ a mask that interacts with Visual Studio .NET, including menus, documents, macros,\
    \ etc.\n\n## Writing Code, using Macros\n\nWe’ve learned how to reuse Project\
    \ templates to generate new code, but we can also change code on the fly during\
    \ runtime using `DTE`. This would look something like as follows:\n\n```vb\n1:\
    \ Public Sub TestWriteCode()\n2: Try\n3: Dim item As ProjectItem = _\n4: DTE.ItemOperations.AddNewItem(\
    \ _\n5: \"Local Project Items\\Code File\")\n6:\n7: Dim defaultNamespace = _\n\
    8: item.ContainingProject.Properties. _\n9: Item(\"DefaultNamespace\").Value\n\
    10:\n11: Dim code as CodeNamespace = _\n12: item.FileCodeModel.AddNamespace(defaultNamespace)\n\
    13:\n14: Dim editPoint as EditPoint = _\n15: code.StartPoint.CreateEditPoint\n\
    16:\n17: editPoint.LineDown(2)\n18:\n19: editPoint.Insert(DateTime.Now.ToString()\
    \ + vbCrLf)\n20:\n21: Catch e As Exception\n22: MsgBox(e.Message, MsgBoxStyle.OKOnly,\
    \ \"Error\")\n23: End Try\n24: End Sub\n```\n\nWhat this code does is that it:\n\
    \n* creates a C# file, by calling for a new one and obtaining a reference to the\
    \ `ProjectItem` for it.\n* adds a default namespace, and formats a namespace element.\n\
    * inserts text into that file, by assigning edit points. Text can be added here\
    \ either manually or using `Add` methods.\n\nThis file is added to the current\
    \ project, but it cannot create a project on its own. Running this code results\
    \ in the following:\n\n```csharp\nnamespace TestWizardOuput{5/9/2002 5:12:23 PM}\n\
    ```\n\nThe `TypedCollectionWizard` uses an incomplete template of code alongside\
    \ a `DTE` to generate its strongly-typed collection. Let’s move on to how we can\
    \ generate functional code automatically.\n\n## Code Generator\n\nYou can create\
    \ a code generator by centering it around structures that exist in all instances\
    \ of your code. Add string-based inputs to work with these structures and add\
    \ dynamic functionality to it. For example, the templates’ code generator `Wizard`\
    \ is written as follows:\n"
