    Only in the `FormMain.cs` module of the `AssemblyViewer`. We can use these controls
    to create interfaces for fully fledged applications using the .NET Framework,
    but we cannot fully list the module''s entire code since it contains over 400
    entries. Due to this, we will see portions of code shown from this module.


    Let’s start things off by simply adding the element of ‘Form Controls’ in an existing
    project. Whenever a form is included in a program, the primary namespace used
    in the project is essentially extended to cover the class responsible for defining
    the ‘form ’ as well. As such, we do not need to create a separate namespace when
    adding a form control. The syntax for including a Windows Form Control has been
    shown below:


    ```csharp

    public class FormMain : System.Windows.Forms.Form, IListener

    ```


    Once you begin using Form Controls in your programs, you will come to notice that
    the underlying syntax of adding a ‘form control’ is actually based on ‘Inheritance.’
    This is because for each ‘form control’ added to the project, the syntax creates
    a class that inherits from `System.Windows.Forms.Form`. If we were to explain
    just the syntax shown above, then it would essentially say that the class `FormMain`
    is supposed to inherit its members and types from the assembly file `System.Windows.Forms.Form`.
    Finally, this simple line of code also implements the `IListener` interface as
    well.


    If you use the `Visual Studio .NET` as an IDE for C# programming, then in this
    case, you will find great convenience in implementing Windows Forms in a project.
    This is because with Visual Studio .NET, you have two options when working with
    Windows Forms Controls:


    1. **Code view**: just as the name suggests, the IDE shows you the underlying
    codes responsible for the shape, size, and contents of the ‘form control.’ You
    can change its elements by manipulating the code directly and include additional
    controls by adding the corresponding code.

    2. **Form view**: in this option, Visual Studio .NET provides the programmer with
    a purely graphical view of form control being added. In this mode, you can manipulate
    the form control elements directly by interacting with the IDE interface. You
    can also add other form controls through the options provided within the IDE itself.
    This provides an intuitive way for people to work with form controls without having
    to interact with the corresponding code too much.

