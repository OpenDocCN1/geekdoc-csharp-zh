    to perform two tasks (using a different enumerator for each one):


    *   Going through every type which has been specified in the assembly and loads
    them.


    *   Going through the corresponding members of each type previously explored and
    then loading these members.


    By creating specialized looping structures in a program (for instance, a nested
    loop), we can effectively iterate over all of these types and their respective
    members, thus extracting this information. Once the function has gathered the
    necessary information, it then converts it into a tangible form, like a string,
    and then displays it to the user. This gives the end-user a much-needed insight
    for designing and creating elements such as an interface for a class.Before we
    move on, let’s briefly discuss enumerators. Consider that you are presented with
    data stored in the form of a list or an array, and you are asked to design a program
    that will go through each entry in the data structure and perform a certain task.
    Traditionally, the first approach that you might consider is to create a loop
    for such a task. To do this, you would create statements using either ‘for ’ or
    ‘while .’ However, we know that the construct of such a directive is essentially
    a ‘statement .’ If we want to use a method to execute a certain task when the
    program is iterating over the data, we will need to pass certain parameters to
    the corresponding method, but methods do not accept statements as their parameters.
    This is where ‘enumerators ’ come in. Enumerators are simply objects that can
    be used for special tasks such as looping through a table of data, an array, a
    collection of strings, etc. Basically, enumerators are used along with an algorithm.
    So, you take an enumerator, pass it to a method as its parameter, and specify
    the algorithm the method will use.If you want to use the ‘Load() ’ function, you
    will first have to know about its syntax and define it in your program. If you
    look at the Assembly Manager’s code listing at the beginning of this section,
    you will find the load function''s definition beginning from ‘line 69 to line
    90 .’ If we bring our attention to line number 70 on the code listing, we will
    find that the function definition includes creating an object instance named ‘StringBuilder
    .’ An instance of this object is created seemingly effortlessly because it has
    already been defined previously (you will find the definition if you look through
    the namespace ‘System.Text ’). The purpose of this object is to boost the logistics
    of the converted string characters. To be more precise, a lone string buffer available
    to the ‘StringBuilder ’ object has a considerably larger capacity. Thus, a larger
    volume of string information can flow through the buffer, making string operations
    even faster.Now let’s proceed with discussing how we can actually use Reflection.
    The first requirement is to select an appropriate instance of an object from the
    assembly file we are working with. Once we have the object instance in our sight,
    we essentially have the assembly’s reference. From this point, all we have to
    do is simply employ Reflection, and the assembly will reveal all the members that
    have been defined within it, but things are a bit different if we are dealing
    with a type instance instead of an object instance. As we know, the members of
    each type are specific to their unique elements (for instance, a type that only
    has members referring to ‘Methods’ and other types referring to ‘Field’ information,
    etc.). So, when we use Reflection on a type instance, then we will extract information
    that it refers to. Hence, if we want data regarding Methods, Fields, Events, Properties,
    etc. then we will have to use Reflection on the respective type instances.Although
    we know what to do when we have an object instance, however, we do not know how
    we can summon the object instance in the first place. Well, there are largely
    two methods through which we can extract an object instance.


    1.  Using a method ‘AssemblyLoadFrom() .’ The argument to be passed to this method
    is the name of the assembly we are working on.


    2.  Using a static method ‘Reflection.Assembly.GetcallingAssembly() .’'
