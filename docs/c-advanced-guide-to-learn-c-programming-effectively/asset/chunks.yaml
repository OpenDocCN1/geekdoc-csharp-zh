- fmt: "\nGenerally, it is a good habit not to write code into an event handler itself,\
    \ instead placing a call to a method `Play`, and using `PlayControl`’s current\
    \ context to determine what to do. It uses a sentinel structure (we may also alternate\
    \ towards using `if-else` or other conditional block statements) to make sure\
    \ that `PlayerState` is not `null`. For exception handling, this method is used\
    \ again, ensuring that nothing wrong happens to the player.\n\nIf the call `player.Play`\
    \ succeeds, `PlayerState` is updated and the player performs an action. However,\
    \ if it does not (for example, in the case of there not being a media file to\
    \ play) the `Catch` block (or else conditional, etc.) is called which runs a `PlayError`\
    \ method and stops the `PlayerState`. `PlayError` displays a message box, which\
    \ you can edit using previously discussed procedures.\n\nCreating the Graphics\
    \ for the PlayControl Interface\nCreating graphics for a computer program requires\
    \ one to be proficient at programming and have a level of artistic capability\
    \ and thought. Both these qualities are difficult and rare, and good graphical\
    \ interfaces are challenging, though interesting, to develop.\n\nWe can apply\
    \ a few different types of graphical inputs, such as vector art, photography,\
    \ drawing/sketching, and others. It would be a good idea to leave the art to the\
    \ artists and implement their vision into the interface and this means that creating\
    \ graphics becomes a two-person job: one artist and one programmer, working in\
    \ tandem.\n\nReturning to our example, the `PlayControl` graphics interface consists\
    \ of a background image with buttons, sliders, the tracker, and elapsed time (displayed\
    \ using text) stacked on top.\n\n### Background\nThe background graphic for a\
    \ `Form` is assigned using a variable called `BackgroundImage`. By default, this\
    \ is a grey background defined by Windows itself, though you can use any image\
    \ of your choosing and assign it to that variable. This also reduces the need\
    \ for using complex control to create graphics to use. It is easier to work on\
    \ a base of a predefined image and edit that instead instead of using custom control\
    \ methods to define something, and speeds up code by not making an excessive amount\
    \ of calls and keeping it lean.\n\nUsing the remaining `Form` controls to design\
    \ regions on top of the background results in straight lines and boxes, and does\
    \ not come off as very interesting. We will thus just limit our interaction to\
    \ it to adding a background for now. ![](image_rsrc31A.jpg)\n\n### Buttons and\
    \ Custom Controls\nLet us now look at how we can add buttons to the `PlayControl`\
    \ interface, for which we will use the `GDI+ Toolbox`. We would prefer to have\
    \ buttons with rounded edges, and elliptical shapes as borders, but this is not\
    \ offered straightforwardly by the toolbox. We’ll have to make some ourselves.\
    \ To do so, we will add a custom control to our project that contains all the\
    \ classes and methods we might need to implement into the button’s functionality.\
    \ The following code describes a basic button made using custom controls, which\
    \ serves as a basis to all the other buttons in our interface.\n\n```cs\npublic\
    \ class RoundButton : System.Windows.Forms.Control \n{\n    private bool hasOutline\
    \ = false;\n\n    protected bool down = false;\n\n    protected virtual Color\
    \ Getcolor()\n    {\n        Color[] colors = {Color.Silver, Color.Gray};\n  \
    \      return colors[Convert.ToInt32(down)];\n    }\n\n    protected virtual Brush\
    \ GetBrush(bool buttonState)\n    {\n        return new LinearGradientBrush(\n\
    \            new Point(2,2), new Point(Width -1 , Height - 1),\n            Color.White,\
    \ Getcolor());\n    }\n\n    private int GetPenWidth()\n    {\n        // use\
    \ button state to adjust pen width\n        return 1 + Convert.ToInt32(down);\n\
    \    }\n\n    private Pen GetPen()\n    {\n        return new Pen(Brushes.Black,\
    \ GetPenWidth());\n    }\n\n    public bool HasOutline\n    {\n        get\n \
    \       {\n            return hasOutline;\n        }\n        set\n        {\n\
    \            hasOutline = value;\n            Invalidate();\n        }\n    }\n\
    \n    private void DrawButtonOutline(Graphics graphics)\n    {\n        graphics.DrawEllipse(GetPen(),\
    \ 1, 1, Bounds.Width - 2, Bounds.Height - 2);\n    }\n\n    private void DrawButton(Graphics\
    \ graphics)\n    {\n        graphics.FillEllipse(GetBrush(down), 0, 0, Width,\
    \ Height);\n        if(hasOutline)DrawButtonOutline(graphics);\n    }\n\n    protected\
    \ override void OnPaint(System.Windows.Forms.PaintEventArgs e)\n    {\n      \
    \  base.OnPaint(e);\n        DrawButton(e.Graphics);\n        DrawGraphic(e.Graphics);\n\
    \    }\n\n    protected override void OnResize(System.EventArgs e)\n    {\n  \
    \      GraphicsPath path = new GraphicsPath();\n        path.AddEllipse(0, 0,\
    \ Bounds.Width, Bounds.Height);\n        Region = new Region(path);\n        Invalidate();\n\
    \        base.OnResize(e);\n    }\n\n    protected override void OnMouseDown(System.Windows.Forms.MouseEventArgs\
    \ e)\n    {\n        base.OnMouseDown(e);\n        down = true;\n        Invalidate();\n\
    \    }\n\n    protected override void OnMouseUp(System.Windows.Forms.MouseEventArgs\
    \ e)\n    {\n        base.OnMouseUp(e);\n        down = false;\n        Invalidate();\n\
    \    }\n}\n```\n\nLet’s break this down:\nConstructors, Destructors, and DisposeBecause\
    \ a control is nothing more than `Control.dll`, it will have its own constructors,\
    \ destructors, and a `Dispose` method. The `RoundButton` class does not use any\
    \ of these (aside from the defaults), but this is a specific case. In other classes\
    \ `VideoKiosk.dll` you will notice their presence.\n\n ConstructorsA constructor\
    \ serves to initialize any objects that a class requires. A control constructor\
    \ serves the same purpose. Defining a constructor can be ignored in situations\
    \ where new members do not require initialization, or no particular method is\
    \ required to be performed. For our `RoundButton` we do not need to have a constructor\
    \ since we do not need any special form of initialization. Constructors can be\
    \ overloaded (i.e. multiples of the same name can be defined and have different\
    \ functionalities, inputs, and outputs), and calls to the constructors are resolved\
    \ depending on what types of data are given as arguments. A good idea is to use\
    \ the constructor to call an initializer method instead of stuffing it full of\
    \ code. For example, `Form1` uses `InitializeComponent` using its constructor,\
    \ since it has multiple controls that need to be initialized. Dispose Methods\n\
    C#, being a .NET language, employs non-deterministic destruction, i.e. objects\
    \ are destroyed by predefined, and a programmer does not need to define a function\
    \ to do so. A “garbage collector” removes cached data, though using this explicitly\
    \ is tricky, inconvenient, and dangerous, and thus requires us to write a block\
    \ of code calling it. Oftentimes we write code that requires deterministic destruction\
    \ anyway. This is where we turn towards `Dispose` methods, as opposed to destructors.\n\
    \nDestructor\nTo cover our bases, we’ll describe what a destructor is. It serves\
    \ to remove and delete cached data after its use is complete. We won’t often see\
    \ it as compared to `Dispose`, but this is what it looks like:\n\n```cs\n~RoundButton(){}\n\
    ```\n"
