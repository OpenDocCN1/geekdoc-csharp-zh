  trans: "\n\n通过这两种方法中的任何一种，我们本质上都可以提取出想要操作的程序集的引用。一旦获取了该引用，你现在需要使用适当的方法对该程序集文件执行某些操作。例如，如果我们有一个程序集引用，并想要提取告诉我们该程序集中定义了所有类型的信息，我们必须使用使用适当的方法。在这种情况下，我们必须首先传递一个数组声明，并将该数组的“type”属性设置为我们想要从程序集中提取的类型。一旦设置好数组，我们所做的就是调用\
    \ `assembly.GetTypes()` 方法。然而，在使用此方法时，你始终需要记住，`assembly` 这部分基本上就是你之前获取的实际程序集引用。\n\
    \n`Reflection`（反射）的功能不仅仅是简单的解开程序集的内容。当我们使用反射来提取有关程序集所包含的类型和成员的信息时，此时，反射也能够直接使用它们，尽管它们的定义是在程序集文件中的。这里有一个关于如何加载程序集文件并使用反射执行一个原本源于程序集本身的静态方法的示例。\n\
    \n```cs\nconst string s =\"c:\\\\winnt\\\\Microsoft.NET\\\\Framework\" +\"\\\\\
    v1.0.3705\\\\System.Windows.Forms.dll\";\nAssembly = Assembly.LoadFrom(s);\nType\
    \ type = assembly.GetType(\"System.Windows.Forms.MessageBox\", true);\ntype.InvokeMember(\"\
    Show\", BindingFlags.Public |BindingFlags.InvokeMethod |BindingFlags.Static, null,\
    \ null,new object[] {\"Invoked by Reflection\"});\n```\n\n## Broadcaster 类\n\n\
    如果你查看 Assembly Manager 的代码列表，你将遇到一个相当独特的语句，它使用了一个你们大多数人之前没见过的类：`Broadcaster.Broadcast`。\n\
    \n该语句本质上使用 `Broadcaster` 类向指定目标字面地“广播”信息。任何其他截获此广播的用户都可以访问正在传播的信息。这种方法通常用于发送诸如正在进行的操作当前进度等信息。为此，该类本质上需要定义一个“主表单”作为接收广播并显示信息的应用程序。我们可以看到\
    \ `AssemblyViewer` 使用这种相同的方法在操作进行期间显示其当前状态。\n\n以下是 `Broadcaster` 类以及接收广播所需的接口。\n\
    \n```cs\nusing System;\nusing System.Collections;\n\nnamespace AssemblyViewer\n\
    {\n    /// <summary>\n    /// Broadcaster 的摘要描述。\n    /// </summary>\n    public\
    \ class Broadcaster\n    {\n        private static Broadcaster instance = null;\n\
    \        private ArrayList listeners = null;\n        protected Broadcaster()\n\
    \        {\n            listeners = new ArrayList();\n        }\n\n        static\
    \ private Broadcaster Instance\n        {\n            get\n            {\n  \
    \              if( instance == null )\n                    instance = new Broadcaster();\n\
    \                return instance;\n            }\n        }\n\n        public\
    \ static void Add(IListener listener)\n        {\n            Instance.listeners.Add(listener);\n\
    \        }\n\n        public static void Remove(IListener listener)\n        {\n\
    \            Instance.listeners.Remove(listener);\n        }\n\n        public\
    \ static void Broadcast(string message)\n        {\n            IEnumerator enumerator\
    \ = Instance.listeners.GetEnumerator();\n            while(enumerator.MoveNext())\n\
    \            {\n                if(((IListener)enumerator.Current).Listening())\n\
    \                    ((IListener)enumerator.Current).Listen(message);\n      \
    \      }\n        }\n    }\n\n    public interface IListener\n    {\n        bool\
    \ Listening();\n        void Listen(string message);\n    }\n}\n```\n\n本质上可以将任何带有\
    \ `IListener` 接口的类连接，该类将获得截获发送到目标位置字符串信息的能力，但要实现这一点，该类需要实现该接口并与正在“广播”的类注册。\n\n\
    ## 使用 Broadcaster 类\n\n现在让我们理解如何在应用程序中有效实现实现此类。在此之前，读者必须始终记住 `Broadcaster` 属于那些理想上只希望运行一个类实例的类组。这种组被称为\
    \ `Singleton`（单例）。因此，广播类的构建方式与其他类不同。为了让它像其他单例类一样工作，它有一个 `Private Instance Property`（私有实例属性）。\n\
    \n在整个类中，你会发现有很多公共方法可用，但我们必须记住，这些“公共方法”中的每一个实际上都是静态的（static）。每当调用广播类的公共成员时，相应的方法首先要要检查的是一个名为\
    \ `Instance` 的属性，该属性被设置为“只读”，因此方法可以访问它但不能修改它。然后，该属性会双重检查广播类是否创建了任何实例，如果是，那么有多少个。所以，如果\
    \ `Instance` 属性确认没有广播类的 `singleton`（单例）实例，它将继续创建一个。这个新创建的广播类实例将被传递给名为 `instance`\
    \ 的字段（设置为私有）。如果 `Instance` 属性确认已存在该类的单例实例，它将把该实例链接到同一个私有类中。完成后，通过 `Instance` 属性提供来自该类单例实例的对象。所有这些争斗的结果是，广播类最终获得了一个指向广播类单例实例的对象。\n\
    \n最后，还有两个重要元素：\n\n*   **IListener 接口** - 我们可以将此接口添加到数组中，用于定义接入广播的系统部分。一旦接口被添加到监听器的\
    \ `ArrayList` 中，我们现在就可以执行 `broadcast()` 方法。每当我们执行此操作时，数组中的每个监听器都会接收到广播器传播的信息。\n\
    *   **IEnumerator** - 我们使用枚举器而不是使用 `for, while` 循环语句，以便方法能够遍历 `ArrayList` 中定义的整个监听器列表。\n\
    \n## 为 Broadcaster 类定义接口\n\n正如我们之前提到的，主要与 `Broadcaster` 类一起使用的接口是 `IListener`\
    \ 接口。该接口有两个核心方法，帮助执行该类的核心功能。\n\n1.  **Listening**：这是一个输出为 True 或 False 值的函数。换句话说，一个“布尔值”。函数返回的这个布尔值实际上告诉接口对象（实现接口的对象）是否愿意拦截从广播器发送的消息。通过这种方式，对象可以静音广播，而无需从与其链接的广播器中移除注册。\n\
    2.  **Listen**：此方法负责截获以字符串形式广播的。。\n\n为了在你的应用程序中使用广播器，你所做的就是用想要接收广播的类实现 `IListener`\
    \ 接口。下面的代码块演示了如何使用 `IListener` 接口来使用广播类。\n\n```cs\npublic class FormMain : System.Windows.Forms.Form,\
    \ IListener\n{\n    private void FormMain_Load(object sender, System.EventArgs\
    \ e)\n    {\n        Broadcaster.Add(this);\n    }\n    protected override void\
    \ Dispose( bool disposing )\n    {\n        if( disposing )\n        {\n     \
    \       if(components != null)\n            {\n                components.Dispose();\n\
    \            }\n        }\n        Broadcaster.Remove(this);\n        base.Dispose(\
    \ disposing );\n    }\n    void IListener.Listen(string message)\n    {\n    \
    \    ChangeStatus(message.Trim());\n    }\n    bool IListener.Listening()\n  \
    \  {\n        return true;\n    }\n}\n```\n\n## 与 Windows Forms 控件工作\n\n`AssemblyViewer`\
    \ 中定义了许多我们可以使用的 Form 控件。例如，我们有：\n\n*   `StatusBar`、`MainMenu`、`OpenFileDialog`、`RichTextBox`\
    \ 控件等。\n\n"
