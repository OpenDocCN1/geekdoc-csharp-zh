- fmt: "\n# Using Fields and Properties\n\n`Fields` and `Properties` are elements\
    \ that are interestingly related to each other, but before we can discuss them,\
    \ let’s first understand the underlying concept of ‘consumers’ and ‘producers’\
    \ in programming. ‘Consumers ’ are those people that are the end-users of things\
    \ like classes. Similarly, ‘Producers ’ are those people who build these classes.\
    \ An interesting thing to note here that both a consumer and a producer are programmers.\n\
    \nNow with that clarified, let’s talk about ‘Fields.’ A `Field` is simply a bunch\
    \ of data that is contained within a class. Conventionally, the fields of a class\
    \ are never public. Instead, they are set to `private` by the producer, but there\
    \ are times when consumers need access to the fields of a class they are using,\
    \ but, since the fields are private, they are hindered. \n\nThis is where `Properties`\
    \ come in. Properties have the nature of duality. To elaborate, if a consumer\
    \ is using this ‘Property Method,’ it will be indistinguishable as if the consumer\
    \ were dealing with data. On the other hand, if the producer uses the same property\
    \ method, it will function as if it were a method.\n\nYou might ask why you would\
    \ even need access to the data fields of a class in the first place. Well, the\
    \ answer to that is very simple and straightforward, having access to the data\
    \ of a class allows the programmer to have the freedom to make changes to the\
    \ class’s methods and even perform some tweaks to the class's objects. Similarly,\
    \ using `Properties` allows us to control how the data in the class is accessed.\n\
    \n## Defining a Field\n\nThe nature of a field, i.e., the type of data it contains,\
    \ can generally be anything (it just needs to conform to the purpose of the class\
    \ in which it will be used). Since this data is important to the class, it is\
    \ generally kept private through the use of access modifiers (i.e., setting its\
    \ scope to `private`). In this way, only the programmer who created the field\
    \ (the producer) will be able to make changes to it. If anyone other than the\
    \ producer wants to access the fields in a class and make changes to it, they\
    \ will have to do so through ‘Property Methods.’\n\nIn the following block of\
    \ code, we are creating a field that stores string data:\n\n```csharp\nusing System;\n\
    namespace HelloWorld{\n    /// <summary>\n    /// Summary description for Class1.\n\
    \    /// </summary>\n    class Class1{\n        private static string arg0 = null;\n\
    \        /// <summary>\n        /// The main entry point for the application.\n\
    \        /// </summary>\n        [STAThread]\n        static void Main(string[]\
    \ args){\n            arg0 = args[0];\n            Console.WriteLine(arg0);\n\
    \            Console.ReadLine();\n        }\n    }\n}\n```\n\nIn this demonstration,\
    \ you can find that we are not using an instance of `Class1` in this program.\
    \ Now let’s modify this block of code a bit such that we actually use an instance\
    \ of the corresponding class while it essentially performs the same job:\n\n```csharp\n\
    using System;\nnamespace HelloWorld{\n    /// <summary>\n    /// Summary description\
    \ for Class1.\n    /// </summary>\n    class Class1{\n        private string arg0\
    \ = null;\n        public void WriteCommandLine( string arg ){\n            Console.WriteLine(arg);\n\
    \            Console.ReadLine();\n        }\n        /// <summary>\n        ///\
    \ The main entry point for the application.\n        /// </summary>\n        [STAThread]\n\
    \        static void Main(string[] args){\n            Class1 class1 = new Class1();\n\
    \            class1.arg0 = args[0];\n            class1.WriteCommandLine(class1.arg0);\n\
    \        }\n    }\n}\n```\n\nBasically, the revision involves how we use the `Main()`\
    \ method. Originally, this method handled the majority of the work to perform\
    \ the corresponding job, but we changed the purpose of the `Main()` method in\
    \ the revision such that it’s the only job would be to act as a ‘startup method’\
    \ only. To account for the changes in the way the code works, we implement an\
    \ instance of `Class1`.\n\n## Defining Properties\n\nDue to their nature and function,\
    \ `Properties` are basically considered as ‘methods’ (you might have guessed it\
    \ when we talked about ‘Property Methods’ in the previous sections). Generally,\
    \ properties can be used in one of two ways, either as a ‘right-hand side value\
    \ ’ or as a ‘left-hand-side value.’ If the property is being used as an RHS value,\
    \ we call a specific property method known as ‘getter.’ On the other hand, if\
    \ the property is being used as an LHS value, then the corresponding property\
    \ method we call is known as a ‘setter.’\n\nProperties also have access to modifiers\
    \ defining their scope. Conventionally, properties are set to public. Here’s how\
    \ a property would be defined:\n\n```csharp\nAccess-Modifier Type Property-Name\n\
    {\n    get{return field;}\n    set{field = value;}}\n}\n```\n\nIn essence, the\
    \ property has three basic elements - an access modifier (which is generally set\
    \ to `public`), a ‘type,’ and last but not least, a name. `Properties` can be\
    \ of three types based on their use and implementation, i.e., ‘Read-only Properties,’\
    \ ‘Indexed Properties’ and ‘Write-only Properties.’ Before moving on, let’s discuss\
    \ these different types of properties.\n\n### Read-Only Properties\n\nThe main\
    \ element through which we can distinguish a read-only property is from observing\
    \ if it possesses a ‘getter’ or a ‘setter.’ If the property only has a ‘getter’\
    \ then it is a ‘Read-only Property.’ Just like the name suggests, such properties\
    \ only allow the users to view the property elements, such as its values, and\
    \ the user has no authorization to make any changes.\n\nHere’s an example where\
    \ we access the value of a ‘Read-only Property’ for the temperature defined in\
    \ a class. This temperature class features readings in both Celsius and Fahrenheit\
    \ scale. Here’s how we can use the Read-only Property to fetch the scale in which\
    \ the corresponding class's temperature will be displayed:\n\n```csharp\npublic\
    \ enum TemperatureMode{Fahrenheit, celsius}\nclass Temperature{\n    private TemperatureMode\
    \ mode = TemperatureMode.fahrenheit;\n    private double celsius = 0;\n    private\
    \ double fahrenheit = 0;\n    public Temperature( double aTemperature, TemperatureMode\
    \ aMode ){\n        mode = aMode;\n        SetTemperature(aTemperature, aMode);\n\
    \    }\n    private void SetTemperature(double aTemperature, TemperatureMode aMode){\n\
    \        if( aMode == TemperatureMode.fahrenheit ){\n            fahrenheit =\
    \ aTemperature;\n            celsius = FahrenheitToCelsius(aTemperature);\n  \
    \      }\n        else{\n            celsius = aTemperature;\n            fahrenheit\
    \ = CelsiusToFahrenheit(aTemperature);\n        }\n    }\n    public static double\
    \ CelsiusToFahrenheit(double celsius){\n        return celsius * (9.0/5) + 32;\n\
    \    }\n    public static double FahrenheitToCelsius(double fahrenheit){\n   \
    \     return (fahrenheit - 32) * 5.0/9;\n    }\n    public TemperatureMode Mode{\n\
    \        get{return mode;}\n        set{mode = value;}}\n    }\n    public double\
    \ Value{\n        get{return mode == TemperatureMode.fahrenheit ?fahrenheit :\
    \ celsius;}}\n    }\n    public bool Test(){\n        return fahrenheit == FahrenheitToCelsius(celsius)&&\
    \ celsius == CelsiusToFahrenheit(fahrenheit);\n    }\n}\n```\n\nTo determine the\
    \ scale on which the temperature will be converted to (in simpler terms, determining\
    \ whether to use the Celsius scale or the Fahrenheit scale), the block of code\
    \ shown above executes a corresponding enumeration.\n\n### Write-Only Properties\n\
    \nJust as a property with only ‘getters’ is the defining feature of a ‘Read-only\
    \ Property,’ a property that only has ‘setters’ is primarily known as ‘Write-only\
    \ Property.’ In such a type of property, a user accessing the class can make changes\
    \ to it and even to the property itself. Usually, you won’t come across write-only\
    \ properties much because they are not used, as it can cause unnecessary complications\
    \ given to the end-user. However, this does not mean that write-only properties\
    \ are entirely useless. For example, you can use the functionality of write-only\
    \ properties for tasks such as requesting authentication from the user in the\
    \ form of a passcode. Instead of using a read-only property to display the authentication\
    \ code to the end-user, it would be better to use a write-only property and allow\
    \ the user to type the correct passcode themselves.\n\n### Indexed Properties\n\
    \nThis type of property is also simple, like the other two. Just as the name ‘Index’\
    \ suggests, this type of property is primarily used to communicate the items which\
    \ have been placed in the class. Since the main user will be a consumer, the form\
    \ in which the requested data is displayed is in the form of `object[index]`.\n\
    \n```csharp\nclass IndexedProperty{\n    private string[] args = null;\n    public\
    \ IndexedProperty(string[] args){\n        this.args = new string[args.Length];\n\
    \        args.CopyTo(this.args, 0);\n    }\n    [System.Runtime.CompilerServices.IndexerName(\"\
    Command\")]\n    public string this [int index]{\n        get{return args[index];}\n\
    \        set{args[index] = value;\n    }\n}\n```\n\n## Using an Instance of a\
    \ Class\n\nIn order to create an instance of an object and have it run in the\
    \ program where it was created, we need to call upon a ‘Constructor’ with the\
    \ help of an operator. When we create an instance of an object, we can take a\
    \ bunch of variables and link them to the instantiated object, but there’s a condition\
    \ to perform this action: whenever we try to assign a variable to an object, both\
    \ elements need to be compatible with another. The instantiated object’s type\
    \ and the variable’s type need to be similar; this process will fail if the types\
    \ of the object and variable do not match. This extends to objects whose features\
    \ inherited. So, if we have a variable that was previously declared to be of the\
    \ same type as an object, then we can use it with the same object’s child instance\
    \ as well. If we want to create an instance of an object, we will need to use\
    \ a constructor. A constructor is basically a method that is primarily used during\
    \ the process of creating an object (this includes creating an instance as well).\
    \ A constructor has three elements: a name, an access modifier, and parameters.\
    \ The name of the constructor is usually the name of the class to which it belongs.\n\
    \n```csharp\n// simple object creation\nFileStream fs = new FileStream(\"c:\\\\\
    temp\\\\killme.txt\", FileMode.CreateNew);\nfs.Write(new Byte[]{65, 66, 67, 68,\
    \ 69}, 0, 5);\nfs.Close();\n\n// array examples\nstring[] strings = new string[10];\n\
    strings[0] = \"Some Text!\";\nint[] integers = new int[]{0,1,2,3,4};\n```\n\n\
    ## Defining an Interface\n\nIn the context of object-oriented programming languages,\
    \ an interface isn’t any different from what you might be familiar with. The main\
    \ use of the interface is to create a method of interaction for a specific class.\
    \ To be more precise, an interface is an actualization of tapping into the functionality\
    \ of a class. Consider a sound system installed in a vehicle. This sound system\
    \ has two circular controllers that can be rotated to navigate through the menu,\
    \ increase or decrease the volume, change the radio station, or even shuffle through\
    \ songs being played through external media. Now, let’s narrow things down a bit.\
    \ Let’s say that these hardware controllers allow you to tune the radio station,\
    \ and you can also do this without having to use knobs as well. For instance,\
    \ you can have a small infrared controller that can do this task for you. In this\
    \ scenario, the tuning of the radio stations is done through an underlying interface,\
    \ and we can access the functionality of this interface through external tools.\
    \ If you think about it, the sound system's volume is controlled through a specific\
    \ ‘volume interface.’ We can connect to this interface to leverage its volume\
    \ changing functionality through remote, hardware buttons, or even voice control.\
    \ The aspect we are controlling is ‘volume,’ which is known as the ‘attribute.’\
    \ We manipulate this ‘attribute’ by implementing either ‘Methods’ or ‘Property\
    \ Methods’, and these methods act as the supporting framework of an interface.\n\
    \nHere’s how you can easily define an interface:\n\n```csharp\npublic interface\
    \ IAudio{\n    void AdjustVolume( int value );\n}\n```\n\n## Implementing an Interface\n\
    \nOnce we have created an interface, we still need to implement it properly in\
    \ a program or application. Generally, interfaces are implemented within classes.\
    \ When implementing an interface, it should always be remembered that all the\
    \ interface methods will be implemented as well. To implement an interface, simply\
    \ specify the class you want it to be in. The following block of code shows how\
    \ we can implement an interface within a class:\n\n```csharp\npublic interface\
    \ IAudio{\n    void AdjustVolume(int value );\n}\npublic class Radio : IAudio{\n\
    \    private int volume = 0;\n    void IAudio.AdjustVolume(int value){\n     \
    \   volume += value;\n    }\n}\n```\n\nIn this code, the interface we are implementing\
    \ is `IAudio`, and the class in which we are implementing it is `Radio`. The process\
    \ is simple. First, we write the access modifier of the concerned class, then\
    \ type its name, then place a colon after the class’s name (`:`) and finally,\
    \ specify the interface's name. This has been demonstrated in the 3rd line of\
    \ the code block.\n\n## Inheritance\n\nThe concept of inheritance is almost universal,\
    \ be it in biology or computers. Inheritance is basically when a class passes\
    \ on its features and certain characteristics to another class, but the result\
    \ is not going to be a completely identical copy of the original class. The inheritance\
    \ relationship usually involves two or more than two classes. The class whose\
    \ features are being inherited is known as the `superclass`, and the class which\
    \ is inheriting those features is known as the `subclass`. Think of it as the\
    \ relationship of a parent and a child, in this case, the first one (`superclass`)\
    \ would be the parent class and the second one (`subclass`) would be the child\
    \ class.\n\nLike we discussed before, we are not simply making an identical copy\
    \ of the original class. Instead, the subclass has its own unique features, and\
    \ it simply inherits the corresponding fields, properties, and methods belonging\
    \ to the original superclass. However, to make the inheritance work, we must also\
    \ know how to denote it in our code properly. Let’s say that we are dealing with\
    \ two classes, `Class X` and `Class Y`. If we say that class `Y` inherits the\
    \ members of class `X`, then we would denote this inheritance relationship in\
    \ the following syntax:\n\n```csharp\nPublic class B : A\n// Here is a list of\
    \ some important inheritance concepts that you always need to remember.\n```\n"
