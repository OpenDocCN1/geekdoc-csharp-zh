    \ expression)){control.Focus();throw new Exception(errorText);}}private void ValidateClassName(){DoValidateField(textBoxClassName,ClassName,\
    \ @\"^\\w$&#124;^\\w[A-Za-z0-9]+$\",\"Valid class name is required\");}\n```\n\
    \n#### 对话表单策略\n\n我们使用 `FormWizard` 创建对话表单。表单的一个技巧是创建一个名为 `Execute` 的静态方法，它接受输入并返回表单的输出。用户只需要关心输入和输出，而不需要关心，`Execute`\
    \ 会处理它们。以下演示了：\n\n```csharp\npublic static bool Execute(ref string generatedCode){using(Form1\
    \ form = new Form1()){if( form.ShowDialog() == DialogResult.OK){generatedCode\
    \ = form.Code;return true;}elsereturn false;}}\n```\n\n最终，用户将是 `TypedCollectionWizard`。当实现\
    \ `IDTWizard` 时，它只需要使用这个静态方法，提供一个输入，它就会返回一个输出，然后可以使用该输出。这也可以应用于 Windows Forms\
    \ 应用程序。替代方案涉及重写和重新评估代码，实际上是写了两遍代码。表单使用以下代码显示。\n\n```csharp\nstring generatedCode\
    \ = string.Empty;If(FormWizard.Execute(generatedCode))// do something\n```\n\n\
    ### 实现 Wizard\n\n我们使用一个静态方法设置了代码生成器，该方法只需要一个输入即可运行。一切都在内部处理。完成后，Wizard 的其余部分就相当容易实现了。向\
    \ Wizard 添加功能是通过使用 `IDTWizard.Execute` 方法来实现我们的代码，如下所示：\n\n```csharp\nusing System;\n\
    using System.IO;\nusing EnvDTE;\nusing System.Windows.Forms;\n\nnamespace TypedCollectionWizard\
    \ {\n    /// <summary>\n    /// Class1 的摘要描述。\n    /// </summary>\n    public\
    \ class CollectionWizard : IDTWizard {\n        // 实现 IDTWizard.Execute\n    \
    \    public void Execute(object Application, int hwndOwner, ref object[] ContextParams,\
    \ ref object[] CustomParams, ref wizardResult retval) {\n            string generatedCode\
    \ = string.Empty;\n            if( FormWizard.Execute(ref generatedCode)) {\n\
    \                WriteCode((DTE)Application, generatedCode);\n               \
    \ retval = EnvDTE.wizardResult.wizardResultSuccess;\n            }\n         \
    \   else {\n                retval = EnvDTE.wizardResult.wizardResultCancel;\n\
    \            }\n        }\n\n        private void WriteCode(DTE dte, string generatedCode)\
    \ {\n            try {\n                DoCode(dte, generatedCode);\n        \
    \    } catch(Exception e) {\n                MessageBox.Show(e.Message, \"写入代码\"\
    , MessageBoxButtons.OK, MessageBoxIcon.Error);\n            }\n        }\n\n \
    \       private void DoCode(DTE dte, string generatedCode) {\n            ProjectItem\
    \ item = dte.ItemOperations.AddNewItem(@\"Local Project Items\\Code File\", \"\
    \");\n            string defaultNamespace = (string)item.ContainingProject.Properties.Item(\"\
    DefaultNamespace\").Value;\n            CodeNamespace code = item.FileModel.AddNamespace(defaultNamespace,\
    \ 0);\n            EditPoint editPoint = code.StartPoint.CreateEditPoint();\n\
    \            editPoint.LineDown(2);\n            editPoint.Insert(generatedCode);\n\
    \        }\n    }\n}\n```\n\n这段代码完成了 `IDTWizard`，当 `Execute` 为真时使用 `WriteCode`\
    \ 显示表单，使用 `try-catch` 结构处理错误，并使用 `DoCode` 生成代码文件。我们通过将应用程序参数转换为 DTE 对象并在代码中使用它来生成源代码。现在来测试\
    \ Wizard！\n\n### 完成示例向导启动文件\n\n创建向导启动文件很简单，我们只需要提供向导名称并说明它不需要传递参数。该文件后缀名为 `.vsz`，并且每次加载\
    \ Wizard 时都会被读取。以下描述了 `TypedCollectionWizard` 的向导启动文件，它保存在库文件相同的目录下。\n\n```vsz\n\
    VSWIZARD 7.0Wizard=TypedCollectionWizard.CollectionWizardParam=<Nothing>\n```\n\
    \n1. 第一行必须添加。\n2. 第二行定义了程序名称以及实现 `IDWizard` 的类名。\n3. 其他参数定义了发送到 Wizard 的任何参数（如果有）。\n\
    \n"
