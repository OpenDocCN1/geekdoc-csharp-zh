  trans: "\n通常情况下，良好的习惯是不直接在事件处理器本身中编写代码，而是调用方法 `Play`，并使用 `PlayControl` 的当前上下文来决定执行的操作。它使用了一个哨兵结构（我们也可以交替使用\
    \ `if-else` 或其他条件块语句）来确保 `PlayerState` 不为 `null`。对于异常处理，再次使用此方法，以确保玩家不会发生任何错误。\n\
    \n如果调用 `player.Play` 成功，`PlayerState` 将被更新，玩家将执行动作。然而，如果没有成功（例如，在没有媒体文件可以播放的情况下），会调用\
    \ `Catch` 块（或 `else` 条件等），其中运行 `PlayError` 方法并停止 `PlayerState`。`PlayError` 会显示一个消息框，你可以使用之前讨论过的步骤对其进行编辑。\n\
    \n创建 PlayControl 界面的图形\n为计算机程序创建图形要求人们精通编程，并具备一定的艺术能力和思维。这两种特质都是困难且罕见的，开发良好的图形界面虽然很有趣，但具有挑战性。\n\
    \n我们可以应用几种不同类型的图形输入，例如矢量艺术、摄影、绘画/素描等。将艺术交给艺术家，并将他们的愿景实现在界面是一个好主意，这意味着创建图形变成了一项两人工作：一名艺术家和一名程序员协同工作。\n\
    \n回到我们的示例，`PlayControl` 图形界面由一张背景图像以及叠加在其上的按钮、滑块、进度条和已时间（使用文本显示）组成。\n\n### 背景\n\
    `Form` 的背景图形使用一个名为 `BackgroundImage` 的变量赋值。默认情况下，这是由 Windows 自己定义的灰色背景，但你可以使用任何选择的图像并将其分配给该变量。这减少了使用复杂控件来创建所需图形的需求。在预定义图像的基础上进行工作并对其编辑，比使用自定义控件方法定义某些内容要容易，而且通过减少过量的调用并保持代码精简来加速运行。\n\
    \n使用剩余的 `Form` 控件在背景上设计区域将导致直线和方框，看起来并不有趣。因此，我们现在仅将其交互限制在添加背景上![](img/image_rsrc31A.jpg)\n\
    \n### 按钮和自定义控件\n现在让我们看看如何为 `PlayControl` 界面添加按钮，我们将使用 `GDI+ Toolbox`。我们更倾向于具有圆角和椭圆形形状边框的按钮，但工具箱并没有直接提供这些功能。我们必须自己制作一些。为此，我们将向项目添加一个自定义控件，其中包含了我们可能需要实现到按钮功能中的所有类和方法。以下代码描述了使用自定义控件制作的基本按钮，它作为我们界面中所有其他按钮的基础。\n\
    \n```cs\npublic class RoundButton : System.Windows.Forms.Control \n{\n    private\
    \ bool hasOutline = false;\n\n    protected bool down = false;\n\n    protected\
    \ virtual Color Getcolor()\n    {\n        Color[] colors = {Color.Silver, Color.Gray};\n\
    \        return colors[Convert.ToInt32(down)];\n    }\n\n    protected virtual\
    \ Brush GetBrush(bool buttonState)\n    {\n        return new LinearGradientBrush(\n\
    \            new Point(2,2), new Point(Width -1 , Height - 1),\n            Color.White,\
    \ Getcolor());\n    }\n\n    private int GetPenWidth()\n    {\n        // 使用按钮状态来调整笔宽\n\
    \        return 1 + Convert.ToInt32(down);\n    }\n\n    private Pen GetPen()\n\
    \    {\n        return new Pen(Brushes.Black, GetPenWidth());\n    }\n\n    public\
    \ bool HasOutline\n    {\n        get\n        {\n            return hasOutline;\n\
    \        }\n        set\n        {\n            hasOutline = value;\n        \
    \    Invalidate();\n        }\n    }\n\n    private void DrawButtonOutline(Graphics\
    \ graphics)\n    {\n        graphics.DrawEllipse(GetPen(), 1, 1, Bounds.Width\
    \ - 2, Bounds.Height - 2);\n    }\n\n    private void DrawButton(Graphics graphics)\n\
    \    {\n        graphics.FillEllipse(GetBrush(down), 0, 0, Width, Height);\n \
    \       if(hasOutline)DrawButtonOutline(graphics);\n    }\n\n    protected override\
    \ void OnPaint(System.Windows.Forms.PaintEventArgs e)\n    {\n        base.OnPaint(e);\n\
    \        DrawButton(e.Graphics);\n        DrawGraphic(e.Graphics);\n    }\n\n\
    \    protected override void OnResize(System.EventArgs e)\n    {\n        GraphicsPath\
    \ path = new GraphicsPath();\n        path.AddEllipse(0, 0, Bounds.Width, Bounds.Height);\n\
    \        Region = new Region(path);\n        Invalidate();\n        base.OnResize(e);\n\
    \    }\n\n    protected override void OnMouseDown(System.Windows.Forms.MouseEventArgs\
    \ e)\n    {\n        base.OnMouseDown(e);\n        down = true;\n        Invalidate();\n\
    \    }\n\n    protected override void OnMouseUp(System.Windows.Forms.MouseEventArgs\
    \ e)\n    {\n        base.OnMouseUp(e);\n        down = false;\n        Invalidate();\n\
    \    }\n}\n```\n\n让我们来分解一下：\n构造函数、析构函数和 Dispose。由于控件无仅仅是 `Control.dll`，它将有自己的构造函数、析构函数和\
    \ `Dispose` 方法。`RoundButton` 类没有使用这些中的任何一个（默认值除外），但这是一个特殊情况。在其他类 `VideoKiosk.dll`\
    \ 中你会发现它们的存在。\n\n 构造函数 构造函数的作用是初始化类所需的任何对象。控件构造函数具有相同的目的。在新成员不需要初始化或不需要执行任何特定方法的情况下，可以忽略定义构造函数。对于我们的\
    \ `RoundButton`，我们不需要构造函数，因为我们不需要任何特殊形式的初始化。构造函数可以重载（即可以定义多个相同名称的并具有不同的功能、输入和输出），对构造函数的调用根据给出参数的数据类型来解析。一个好主意是使用构造函数调用初始化方法，而不是在里面塞满代码。例如，`Form1`\
    \ 在其构造函数未使用 `InitializeComponent`，因为它有多个需要初始化的控件。Dispose 方法\nC# 作为一种 .NET 语言，采用非确定性销毁，即对象是由预定义的销毁，程序员不需要定义函数来这样做。“垃圾回收器”会移除缓存数据，尽管显式地使用它是复杂、不便且危险的，因此需要我们编写代码来调用它。通常情况下，我们仍然编写需要确定性销毁的代码。这就是我们转向\
    \ `Dispose` 方法而不是析构函数的地方。\n\n析构函数\n为了保险起见，我们将描述什么是析构函数。它的作用是在在使用完成后移除并删除缓存数据。与\
    \ `Dispose` 相比，我们不会经常看到它，但它的看起来是这样的：\n\n```cs\n~RoundButton(){}\n```\n\n"
- fmt: "\n# Conditional Logic and using Arrays\n\nThere is a technique where instead\
    \ of using `if-else` logic, we can turn to arrays. This makes the code more streamlined\
    \ and lean and the IL code for conditional statements is shorter than that for\
    \ using arrays. Take the example of the following, which checks a down field and\
    \ returns a color. There’s two ways we can do it:\n\n```csharp\nprotected virtual\
    \ Color Getcolor(){Color[] colors = {Color.Silver, Color.Gray};return colors[Convert.ToInt32(down)];}\n\
    ```\n\n```csharp\nprotected virtual Color Getcolor(){if( down )return Color.Gray;else\
    \ return Color.Silver;}\n```\n\nThe former utilizes our method, whereas the latter\
    \ uses basic statements to achieve the same purpose and is clearer to understand.\
    \ The IL code is different between the two because C# doesn’t allow for typed\
    \ arrays, and the `Boolean` must be converted to an integer first before it will\
    \ work to index the array. Also, for very simple conditionals exists the ternary\
    \ operator (`?:`). It evaluates a variable as a `Boolean` - if true, the first\
    \ option applies, and if false, the second instead. This produces the least amount\
    \ of IL code, but it is difficult to use for multiple, complex conditionals (one\
    \ might use `case` instead).\n\n```csharp\nprotected virtual Color Getcolor(){return\
    \ down ? Color.Gray : Color.Silver;}\n```\n\nYou can use any of these methods\
    \ as you please, and since the method is well-named, you can code the routine\
    \ as densely as you like. To summarize, keep the following in mind when choosing\
    \ a method:\n\n- Array indexing produces concise and specific code.\n- `if-else`\
    \ statements are simple for a few conditions, but can get difficult to decipher\
    \ when nesting goes too deep and conditions get too many.\n- `case` statements\
    \ allow you to order multiple choices.\n- The ternary operator is a short and\
    \ sweet method for simple binary choices.\n\nA note about colors: a list of colors\
    \ with their names is stored in the `Color` structure, which can be called using\
    \ the `Getcolor` method. We can also specify alpha blend (transparency of the\
    \ color), red, blue, and green hues (on a scale of 0 to 255, or base 8) to create\
    \ a color. Another note: we have used a `Convert` class in `Getcolor`. This class\
    \ consists of methods to convert datatypes to a particular type, such as `Convert.ToInt32`\
    \ converting data to a 32-bit integer. These can accept most datatypes due to\
    \ them being overloaded, as we have explained previously. When it isn’t able to,\
    \ an `InvalidCastException` is called.\n\n# Using Graphics Objects\n\nA `Graphics`\
    \ object in GDI+ is like a canvas, and multiple iterations of the object are required\
    \ to paint on it. To create a custom drawing, you’ll need to start by creating\
    \ a `Graphics` object by either using a `CreateGraphics` method from something\
    \ that has a canvas, such as Windows Forms, or as a property of the `PaintEventArgs`\
    \ argument passed to the `Paint` event handler, or other methods. Once you’ve\
    \ created an instance of the object, you can use the class methods to create your\
    \ desired graphic. Take care not to cache this object nor use it in recursive\
    \ methods where a previous one is called since these objects are stateless and\
    \ remember nothing. We’ll show you how to request a `Graphics` object from the\
    \ `Paint` event handler, and every time a `Paint` operation is performed, below.\n\
    \n## Paint Event Handler\n\nThis handler receives two input arguments:\n\n- An\
    \ object.\n- A `PaintEventArgs` instance.\n\nThis handler is used most commonly\
    \ in cases where one wants to create their own drawing. For now, let us concern\
    \ ourselves with only two methods, which are directly implemented onto the `PlayControl`\
    \ interface.\n\n```csharp\nprivate void PlayControl_Paint(object sender, System.Windows.Forms.PaintEventArgs\
    \ e){OutlineControl(e.Graphics);DrawTrademark(e.Graphics);}\n```\n\nThe Refactored\
    \ methods in the code above describe their functionality. Then, to create a nice,\
    \ rounded shape, we add the first statement to use `PlayControl` in such a manner\
    \ (we could not have created this shape otherwise). Lastly, to add the trademark\
    \ “VK”, we write the second statement. The following code elaborates on these\
    \ functions:\n\n```csharp\nprivate Point[] GetPoints(int shift) \n{\n    return\
    \ new Point[]\n    {\n        new Point(3 + shift, 0 + shift),\n        new Point(Bounds.Width\
    \ - 3 + shift, 0 + shift),\n        new Point(Bounds.Width + shift, 3),\n    \
    \    new Point(Bounds.Width + shift, Bounds.Height - 3 + shift),\n        new\
    \ Point(Bounds.Width - 3 + shift, Bounds.Height + shift),\n        new Point(3\
    \ + shift, Bounds.Height + shift),\n        new Point(0 + shift, Bounds.Height\
    \ - 3 + shift),\n        new Point(0 + shift, 3 + shift),\n        new Point(3\
    \ + shift, 0 + shift)\n    };\n}\n\nprivate void OutlineControl(Graphics graphics)\
    \ \n{\n    graphics.SmoothingMode = SmoothingMode.AntiAlias;\n    graphics.DrawPolygon(new\
    \ Pen(Brushes.Black, 2), GetPoints(-1));\n    graphics.DrawPolygon(new Pen(Brushes.White,\
    \ 2), GetPoints(1));\n}\n\nprivate void DrawShadowText(Graphics graphics, string\
    \ s, Font font, Brush foreBrush, Brush backBrush, int x, int y) \n{\n    graphics.DrawString(s,\
    \ font, backBrush, new Point(x, y));\n    graphics.DrawString(s, font, foreBrush,\
    \ new Point(x-1, y-1));\n}\n\nprivate void DrawTrademark(Graphics graphics) \n\
    {\n    Font font = new Font(\"Haettenschweiler\", 24, FontStyle.Bold);\n    DrawShadowText(graphics,\
    \ \"VK\", font, Brushes.DarkSlateBlue, Brushes.White, 5, 5);\n}\n```\n"
