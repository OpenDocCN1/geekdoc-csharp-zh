    Let’s break this down:Constructors, Destructors, and DisposeBecause a control
    is nothing more than a class, it will have its own constructors, destructors,
    and a Dispose method, same as any class. The RoundButton class does not use any
    of these (aside from the defaults), but this is a specific case. In other classes
    in Control.dll (itself a part of VideoKiosk.dll ) you will notice their presence.
    Let’s go through what they do:Control ConstructorsA constructor serves to initialize
    any objects that a class requires. A control constructor serves the same purpose.
    Defining a constructor can be ignored in situations where new members do not require
    initialization, or no particular method is required to be performed during initialization.
    Constructors are usually public, have no return type, and have the same name as
    their class.  For our RoundButton class we do not need to have a constructor since
    we do not need any special form of initialization.Constructors can be overloaded
    (i.e. multiples of the same name can be defined and have different functionalities,
    inputs, and outputs), and calls to the constructors are resolved depending on
    what types of data are given as arguments.A good idea is to use the constructor
    to call an initializer method instead of stuffing it full of code. For example,
    Form1 uses the InitializeComponent method using its constructor, since it has
    multiple controls that need to be initialized.Control Dispose MethodsC#, being
    a .NET language, employs non-deterministic destruction, i.e. objects are destroyed
    by predefined, and a programmer does not need to define a function to do so. A
    “garbage collector” removes cached data, though using this explicitly is tricky,
    inconvenient, and dangerous, and thus requires us to write a block of code calling
    it. Oftentimes we write code that requires deterministic destruction anyway. This
    is where we turn towards Dispose methods, as opposed to destructors. Dispose is
    a public method that can be easily called, whereas destructors are unreliable
    to use in a .NET language.DestructorTo cover our bases, we’ll describe what a
    destructor is. It serves to remove and delete cached data after its use is complete.
    We won’t often see it as compared to Dispose, but this is what it looks like:


    | ~RoundButton(){} |


    A few rules about using destructors are:


    *   There can only be one destructor per class.


    *   It cannot take any arguments.


    *   It cannot be overloaded, nor inherited.


    *   It cannot be explicitly called.


    *   The garbage collector uses the destructor, and the user cannot call it.'
