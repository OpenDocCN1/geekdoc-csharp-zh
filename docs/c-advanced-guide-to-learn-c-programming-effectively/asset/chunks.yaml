  trans: "\n\n在上方显示的详细列表中，已经演示了如何实现 `using` 语句。如果你有任何 `C++` 经验，那么可以将 `using` 语句视为\
    \ `include` 语句。如果 `C#` 是你首次接触的对象对象编程语言，它将帮助你理解 `using` 语句的作用——即它作为一个帮助你向程序集引入外部引用的工具，但请注意，每当你处理程序集时，它会被存储在扩展名为\
    \ `.DLL` 的文件中。因此，如果我们使用 `using` 语句来添加程序集本身，我们本质上是在引入一个 `.DLL` 文件。此外，此语句还可以用于指向属于通用程序集文件的特定类或函数。如果我们想使用\
    \ `Reflection`，将必须引用相应的程序集文件。\n\n```\nusing System.Reflection;\n```\n\n我们引用的程序集是\
    \ `System.dll`，而我们正在使用的类 `System.Reflection` 是该程序集文件的一部分。如果我们想使用控件来访问 Windows\
    \ Forms 功能，必须先在程序中包含相应的程序集文件（`System.Windows.Forms`）。我们还可以实现 `using` 语句来为命名空间创建引用。每当我们指定这个\
    \ `reference` 时，代码将自动将其解释为其链接的命名空间。例如：\n\n```\nusing System.Diagnostics;\nusing\
    \ Diag = System.Diagnostics;\n```\n\n每当我们使用 `Diag` 术语时，程序都会将其视为 `System.Diagnostics`\
    \ 命名空间。在进入下一节之前，我们将讨论该指令的最后一个用途。假设你正在实现 `using` 语句，以使用你指定的对象创建一个代码块。如果 `using`\
    \ 指令显式地使用该块将要使用的对象实现，那么一旦该块结束，该对象将被程序丢弃。无论在块执行完成之前发生异常，这种情况都会持续发生。这里有一个演示。\n\n\
    ```\nusing (FormAbout form = new FormAbout()){\n    form.ShowDialog();\n}\n```\n\
    \n一旦这个简单的代码块执行完毕，该对象将被丢弃。\n\n## 使用反射处理程序集\n\n可以认为，整个 `AssemblyManager` 类中承担了大部分工作的核心元素，非\
    \ `Load()` 函数。该函数主要利用被称为“枚举器”（enumerators）的特殊对象来执行两项任务（每个任务使用不同的枚举器）：\n\n*   遍历程序集中已指定的每一个类型并加载它们。\n\
    *   遍历之前探索的每个类型的对应成员，然后加载这些成员。\n\n通过在程序中创建特殊的循环结构（例如，嵌套循环），我们可以有效地遍历所有这些类型及其相应的成员，从而提取这些信息。一旦函数收集了必要的信息，它就会将其转换为具体的形态（如字符串），然后将其显示给用户。这为终端用户为设计和创建元素（如类的接口）提供了急需的见解。\n\
    \n在继续之前，让我们简要讨论一下枚举器。假设你面对的是以列表（list）或数组形式存储的数据，你被要求设计一个程序来遍历数据结构中的每个条目并执行特定任务。传统上，你可能考虑的第一种方法是为此类任务创建一个循环。为了这样做，你将使用\
    \ `for` 或 `while` 创建语句。然而，我们知道这种指令的构造在本质上是一个 `statement`（语句）。如果我们想在程序遍历数据时使用某种方法来执行特定任务，我们能够向对应的方法传递某些参数，但方法不接受语句作为其参数。这就是\
    \ `enumerators` 用用场的地方。枚举器仅仅是用于执行特殊任务的对象，例如遍历数据表、数组、字符串集合等。基本上，枚举器与算法一起使用。因此，你获取一个枚举器，将其作为参数传递给方法，并指定该方法将使用的算法。\n\
    \n如果你想使用 `Load()` 函数，你必须首先了解它的语法并在程序中定义它。如果你查看本节开头的 Assembly Manager 代码列表，你会发现\
    \ `load` 函数的定义始于 `第 69 行到第 90 行`。如果我们关注代码列表的第 70 行，会发现函数定义包含了创建一个名为 `StringBuilder`\
    \ 的对象实例。该对象的实例的创建似乎是毫不费力，因为它在之前已经定义过了（如果你查阅命名空间 `System.Text` 就能找到该定义）。该对象的目的是加速转换字符串字符的逻辑处理。更准确地说，`StringBuilder`\
    \ 对象可用的单个字符串缓冲区容量大得多。因此，大量的字符串信息可以流经缓冲区，使字符串操作更快。\n\n现在让我们继续讨论如何实际使用反射。首要要求是从我们正在处理的程序集文件中选择一个合适的对象实例。一旦我们获取了该对象实例，我们本质上就拥有了程序集的引用。从现在起，我们所做的就是使用反射，程序集就会揭示其内部定义的所有成员，但如果我们处理的是类型实例而不是对象实例，情况就会稍有不同。正如我们所知，每个类型的成员特定于其唯一的元素（例如，一个只包含指向\
    \ `Methods` 的成员和其他类型指向 `Field` 信息的类型等）。因此，当我们对类型实例使用反射时，我们将提取它所引用的信息。因此，如果我们想要关于\
    \ `Methods`、`Fields`、`Events`、`Properties` 等的数据，我们必须在相应的类型实例上使用反射。\n\n虽然我们知道拥有对象实例时该做什么，但我们并不知道最初如何召唤该对象实例。嗯，我们主要可以通过以下两种方法来提取对象实例：\n\
    \n1.  使用方法 `AssemblyLoadFrom()`。传递给此方法的参数是我们正在处理的程序集名称。\n2.  使用静态方法 `Reflection.Assembly.GetcallingAssembly()`。\n\
    \n"
- fmt: "\nWith either of these two methods, we can essentially extract the reference\
    \ to the assembly we want to work on. Once you obtain the reference, you now need\
    \ to use appropriate methods to perform certain actions on this assembly file.\
    \ For instance, if we have an assembly reference and want to extract information\
    \ that tells us all the types defined in this assembly, we will have to use the\
    \ appropriate methods. In this case, we will first have to pass an array declaration\
    \ and set the ‘type’ of this array to the types we want to extract from the assembly.\
    \ Once the array is set up, all we have to do is call upon the method `assembly.GetTypes()`.\
    \ However, you need always to remember when using this method that the part `assembly`\
    \ basically is the actual assembly reference you previously obtained.\n\nThere’s\
    \ more to the functionality of `Reflection` than just simply unraveling the contents\
    \ of an assembly. When we use Reflection to extract information regarding the\
    \ types and members contained within the assembly, at this point, Reflection is\
    \ capable of using them as well, even though their definitions are in the assembly\
    \ file. Here’s a demonstration of how to load an assembly file and using reflection\
    \ to execute a static method which is originally from the assembly itself.\n\n\
    ```cs\nconst string s =\"c:\\\\winnt\\\\Microsoft.NET\\\\Framework\" +\"\\\\v1.0.3705\\\
    \\System.Windows.Forms.dll\";\nAssembly = Assembly.LoadFrom(s);\nType type = assembly.GetType(\"\
    System.Windows.Forms.MessageBox\", true);\ntype.InvokeMember(\"Show\", BindingFlags.Public\
    \ |BindingFlags.InvokeMethod |BindingFlags.Static, null, null,new object[] {\"\
    Invoked by Reflection\"});\n```\n\n## The Broadcaster Class\n\nIf you go through\
    \ the Assembly Manager’s code listing, you will come across this somewhat unique\
    \ statement utilizing a class which most of you would not have seen before: `Broadcaster.Broadcast`.\n\
    \nThis statement essentially uses the `Broadcaster` class to literally ‘broadcast’\
    \ information to a designated target. Any other user who intercepts this broadcast\
    \ can access the information being propagated as well. Such an approach is commonly\
    \ used to send out information such as an ongoing operation's current progress.\
    \ For this, the class would essentially need to define a ‘main form’ as the application\
    \ that will receive the broadcast and display the information. We can see the\
    \ `AssemblyViewer` use this same approach to display its current status while\
    \ an operation is ongoing.\n\nHere are the `Broadcaster` class and the necessary\
    \ interface for receiving the broadcast.\n\n```cs\nusing System;\nusing System.Collections;\n\
    \nnamespace AssemblyViewer\n{\n    /// <summary>\n    /// Summary description\
    \ for Broadcaster.\n    /// </summary>\n    public class Broadcaster\n    {\n\
    \        private static Broadcaster instance = null;\n        private ArrayList\
    \ listeners = null;\n        protected Broadcaster()\n        {\n            listeners\
    \ = new ArrayList();\n        }\n\n        static private Broadcaster Instance\n\
    \        {\n            get\n            {\n                if( instance == null\
    \ )\n                    instance = new Broadcaster();\n                return\
    \ instance;\n            }\n        }\n\n        public static void Add(IListener\
    \ listener)\n        {\n            Instance.listeners.Add(listener);\n      \
    \  }\n\n        public static void Remove(IListener listener)\n        {\n   \
    \         Instance.listeners.Remove(listener);\n        }\n\n        public static\
    \ void Broadcast(string message)\n        {\n            IEnumerator enumerator\
    \ = Instance.listeners.GetEnumerator();\n            while(enumerator.MoveNext())\n\
    \            {\n                if(((IListener)enumerator.Current).Listening())\n\
    \                    ((IListener)enumerator.Current).Listen(message);\n      \
    \      }\n        }\n    }\n\n    public interface IListener\n    {\n        bool\
    \ Listening();\n        void Listen(string message);\n    }\n}\n```\n\nCan essentially\
    \ link any class with the `IListener` interface and the class will gain the ability\
    \ to intercept the string information that is being sent to the target location,\
    \ but to do this, the class needs to implement the interface and register with\
    \ the class that is ‘Broadcasting.’\n\n## Using the Broadcaster Class\n\nNow let’s\
    \ understand how we can effectively implement this class in an application. Before\
    \ that, the reader must always remember that `Broadcaster` belongs to those groups\
    \ of classes that would ideally want only one instance of their respective class\
    \ running. Such a group is known as `Singleton`. So, the broadcaster class isn’t\
    \ built like other classes. In order for it to function as the other singleton\
    \ classes, it has a `Private Instance Property`.\n\nIn the entire class, you will\
    \ find that there are numerous public methods available, but we must keep in mind\
    \ that every single one of these ‘public methods’ is, in fact static. Whenever\
    \ a public member from the broadcaster class is called, the corresponding method\
    \ first and foremost checks with a property named `Instance`, and this property\
    \ is set to ‘read-only,’ so the method can access it but not modify it. This property\
    \ then double-checks whether the broadcaster class has any instances created and\
    \ if so, then how many are there. So, if the `Instance` property confirms that\
    \ there is no `singleton` instance of the broadcaster class, then it proceeds\
    \ to create one. This newly created instance of the broadcaster class is then\
    \ passed on to a field (set to private) whose name is `instance`. If the `Instance`\
    \ property confirms that a singleton instance of the class is already present,\
    \ it then links the instance to the same private class. Once done, an object from\
    \ the singleton instance of the class is given by the `Instance` property. The\
    \ end product of all this skirmish is that the broadcaster class ends up with\
    \ an object that refers to the broadcaster class's singleton instance.\n\nLastly,\
    \ there are two important elements left:\n\n*   **The IListener Interface** -\
    \ we can add this interface to an array defining the parts of the system that\
    \ are tapping into the broadcast. Once the interface is added to the listener’s\
    \ `ArrayList`, we can now execute the `broadcast()` method. Whenever we do so,\
    \ every listener in the array will have the broadcaster information propagated\
    \ to it.\n*   **The IEnumerator** - we use an enumerator as opposed to using a\
    \ ‘for, while’ loop statements to have the method loop through the entire list\
    \ of listeners defined in the `ArrayList`.\n\n## Defining the Interface for the\
    \ Broadcaster Class\n\nAs we have already mentioned before, the interface that\
    \ is primarily being used with the Broadcaster class is the `IListener` interface.\
    \ This interface has two essential methods that help carry out the core function\
    \ of the class.\n\n1.  **Listening**: this is a function whose output is a True\
    \ or False value. In other words, a ‘Boolean value.’ This Boolean value returned\
    \ by the function actually tells the interface if the object (in which the interface\
    \ was implemented) is willing to intercept the messages being sent from the broadcaster\
    \ or not. In this way, the object can mute the broadcast without having to remove\
    \ its registry with the broadcaster it is linked to.\n2.  **Listen**: this method\
    \ is responsible for intercepting the message being broadcasted in strings.\n\n\
    In order to use the broadcaster in your application, all you have to do is implement\
    \ the `IListener` interface with a class that you want to receive the broadcasts.\
    \ The following block of code demonstrates how to use the `IListener` interface\
    \ in order to use the broadcaster class.\n\n```cs\npublic class FormMain : System.Windows.Forms.Form,\
    \ IListener\n{\n    private void FormMain_Load(object sender, System.EventArgs\
    \ e)\n    {\n        Broadcaster.Add(this);\n    }\n    protected override void\
    \ Dispose( bool disposing )\n    {\n        if( disposing )\n        {\n     \
    \       if(components != null)\n            {\n                components.Dispose();\n\
    \            }\n        }\n        Broadcaster.Remove(this);\n        base.Dispose(\
    \ disposing );\n    }\n    void IListener.Listen(string message)\n    {\n    \
    \    ChangeStatus(message.Trim());\n    }\n    bool IListener.Listening()\n  \
    \  {\n        return true;\n    }\n}\n```\n\n## Working with Windows Forms Control\n\
    \nNumerous Form Controls have been defined in the `AssemblyViewer` that we can\
    \ use. For instance, we have the:\n\n*   `StatusBar`, `MainMenu`, `OpenFileDialog`,\
    \ `RichTextBox` controls, etc.\n"
