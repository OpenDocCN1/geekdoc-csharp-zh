- fmt: "\n# Implementing the ‘StatusBar’ Form Control\n\nAnyone with any experience\
    \ with using computers is familiar with the term ‘Status Bar.’ Generally, the\
    \ purpose of a status bar is to display the progress of anything, and these status\
    \ bars are usually present in an application. For example, take an installation\
    \ wizard application. When you click the ‘install ’ button (which is also a form\
    \ control if you hadn’t noticed), the application proceeds to copy the application\
    \ files to the specified destination. The installation progress is shown on the\
    \ ‘status bar.’ We can also use `StatusBar` as a live graphical feed shown the\
    \ application’s current status. To implement the `StatusBar` in an application,\
    \ we use the present in the module using the application known as `AssemblyViewer`.\
    \ The code that you will have to extract has already been shown below.\n\n```csharp\n\
    private void Initialize(){\n    openFileDialog1.InitialDirectory = GetInitialDirectory();\n\
    \    Broadcaster.Add(this);\n}\nprivate void ChangeStatus(string status){\n  \
    \  statusBar1.Text = status;\n    statusBar1.Refresh();\n}\nvoid IListener.Listen(string\
    \ message){\n    ChangeStatus(message.Trim());\n}\n```\n\nWe already talked about\
    \ how we can achieve this functionality using the `Broadcast` function in the\
    \ broadcast class and the corresponding interface `IListener`.\n\n# Implementing\
    \ the ‘MainMenu’ Form Control\n\nOn any standard windows application, you will\
    \ see a ‘main menu’ that features all possible features that a user might want\
    \ to access. Generally, a menu can be primarily made up of only menu items or\
    \ a bunch of button controls too. If we look at a menu from a technical viewpoint,\
    \ it will have two objects - `MainMenu` and `MenuItem`. When we are creating a\
    \ `MainMenu` form control, we are basically taking a blank form control and placing\
    \ the respective objects and elements on it, (although the IDE provides templates\
    \ for this purpose as well). The interactive process of adding elements on a `MainMenu`\
    \ form control is very intuitive, easy to understand, and doesn’t require any\
    \ special coding so let’s move on to the next form.\n\n# Implementing the ‘OpenFileDialog’\
    \ Form Control\n\nThe `OpenFileDialog` form control is something that you have\
    \ come across when using Windows. When you are uploading something from your computer’s\
    \ hard drive to cloud storage, you first need to specify the location of the file\
    \ on your system. This opens a small pop-up window which is like a mini-file explorer,\
    \ and you navigate to your desired file through this explorer. This is the `OpenFileDialog`\
    \ form control being practically implemented. To implement this, we simply need\
    \ to use a method that is defined in the `FormMain` module as shown below.\n\n\
    ```csharp\npublic void OpenAssembly(){\n    if( openFileDialog1.ShowDialog() ==\
    \ DialogResult.OK)\n        OpenAssembly(openFileDialog1.FileName);\n}\n```\n\n\
    The statement `OpenAssembly` is responsible for loading the file we have just\
    \ selected on to the `AssemblyViewer`. Remember that you will have to add corresponding\
    \ functionality to the `OpenFileDialog` form control for different purposes. For\
    \ instance, you might remember that some pop-up file explorers like this have\
    \ a special category named ‘File Type’ which allows the user to filter through\
    \ different file types. We can add this functionality to this form control as\
    \ well by using the following line of code:\n\n```csharp\nopenFileDialog1.Filter\
    \ = \"Class Library(*.dll)|*.dll|Executables(*.exe)|*.exe\";\n```\n\n# Multi-Threading\
    \ using the ThreadPool Class\n\nThe very subject of ‘multi-threading’ is not a\
    \ simple one but, almost every programmer or a computer enthusiast is familiar\
    \ with what this term insinuates. A thread basically defines a stream of code\
    \ execution that is given to an application by the CPU. A CPU has a finite number\
    \ of threads that are advertised as part of its specification (for example, 8\
    \ core and 16 threads CPU means each core has features 2 threads). In order to\
    \ ensure that an application initializes smoothly and then also runs without being\
    \ bottlenecked by aspects such as waiting for a portion of code to finish executing\
    \ before proceeding, programmers need to implement multi-threading. We can go\
    \ on talking about multi-threading for hundreds of pages and still not cover the\
    \ entire topic, thus let’s talk about multi-threading only when we work with `AssemblyViewer`.\
    \ Let’s discuss multi-threading inside the `AssemblyViewer` application itself.\
    \ When you run the application, you see a ‘splash-screen’ as the greeting animation.\
    \ Well, `AssemblyViewer` uses a total of 2 threads at this point, one thread is\
    \ used to execute the code for the splash-screen while the other thread is used\
    \ to initialize the application itself. The splash-screen itself serves other\
    \ purposes as well, but that’s a discussion for another day.\n\nIn this section,\
    \ we will talk about the class which is primarily designed to help programmers\
    \ implement and handle multi-threading inside their application. This class is\
    \ the `ThreadPool` class. Think of this class as a bank manager. Just as how the\
    \ bank manager ‘manages’ the employees at the branch, similarly, the threadpool\
    \ class manages the total number of threads that are available to the application,\
    \ but when you are implementing multi-threading on Windows Form Controls, it calls\
    \ for extra care because form controls can readily gobble up and hog a precious\
    \ resource, threads, for other applications or other processes in the same application.\n\
    \nThe following lines of code use the threadpool class to use multi-threading\
    \ to implement a different animation of the same splash-screen.\n\n```csharp\n\
    1: bool done = false;\n2: private void Increment()\n3: {\n4: Opacity += .05;\n\
    5: lock(this)\n6: {\n7: done = Opacity >= 1;\n8: }\n9: }\n10:\n11: private void\
    \ Show(Object state)\n12: {\n13: try\n14: {\n15: while(!done)\n16: {\n17: this.Invoke(new\
    \ MethodInvoker(Increment));\n18: Thread.Sleep(100);\n19: }\n20: Thread.Sleep(1500);\n\
    21: }\n22: finally\n23: {\n24: Close();\n25: }\n26: }\n27:\n28: public static\
    \ void Splash()\n29: {\n30: #if DEBUG\n31: FormSplash form = new FormSplash();\n\
    32: form.Opacity = 0;\n33: form.Show();\n34: ThreadPool.QueueUserItem(35: new\
    \ Callback(form.Show));\n36: #endif\n37: }\n```\n\n# Implementing a Control Library\n\
    \nIf you want to start building UserControls, the easiest way is to use the template\
    \ in Windows Control available in the New Project dialog. Using UserControl the\
    \ project will be made, and an assembly having DDL extension will be yielded by\
    \ Windows Control. There is another way, to begin with Class Library and later\
    \ add all UserControls yourself, but this method is not supported as there is\
    \ no motivation to use easy shortcuts if you have easy access to them. The yield\
    \ type you get will be Class Library at the point when Windows Control is made.\
    \ The Windows Control template will add modules like `UserControl.cs` and `AssemblyInfo.cs`.\
    \ It will likewise add namespace like `System`, `System.Drawing`, `System.Windows`,\
    \ and `System.Data`. To start working with the first UserControl, a class that\
    \ is present in UserControl module can be used. It is inherited from UserControl.\
    \ To add metadata, Info file can be used. The Windows Control allows you to add\
    \ unlimited UserControls as per your requirements. In light of the fact that the\
    \ `.resx` file is related to UserControl, it is preferred to restrict every module\
    \ to solitary UserControl. You can also build the UserControl by using some general\
    \ solution and later test it with the help of generic application. Many experts\
    \ mostly recommend this method. In this chapter, this method is used for building\
    \ UserControls. Considering the main control, it consists of pile of buttons.\
    \ These buttons are 4 in total. Based on UserControl’s size these 4 are consequently\
    \ resized. There is another control with the help of which UserControl is made\
    \ having two listboxes. This control also has buttons that allow component movement\
    \ between listboxes.\n\n# Creating a ButtonCluster\n\nOn UserControl holder, 4\
    \ buttons are normally used by `ButtonCluster`. These are present at the center\
    \ of the form. The components can be moved in direction and this is done by clicking\
    \ specific button. The norm is that the product designers must have some information\
    \ regarding their audience. Furthermore, if applications go astray from Windows\
    \ look and it feels excessive, the proficient clients will not understand what\
    \ to do. The methodology used currently requires custom-made practice for the\
    \ customers. It will help them in understanding new applications. Four buttons\
    \ combine to form UserControl. Buttons need to be aligned, and for this, some\
    \ points must be kept in mind. Resize events must be responded to when sent to\
    \ UserControl. The button’s text property must be adjusted. Button events must\
    \ be surfaced as it permits the customer to react to events.\n\n# Making the Graphical\
    \ Interface of UserControl\n\nFour buttons of similar size are arranged in the\
    \ form of vertical. These buttons play a vital role in the composition of the\
    \ visual appearance. These buttons may be aligned horizontally to make the user\
    \ control as common as expected. The button cluster will be kept basic. The genuine\
    \ buttons may be delivered using different types. The UserControl. It is required\
    \ to create a new project “Windows Control Library.” This will allow for the creation\
    \ of button cluster. By using .NET format from Visual Studio, create buttons which\
    \ have the same size. Now to align buttons vertically at the center use the Format.\
    \ After that, adjust size of UserControl. Make it long as height of all buttons\
    \ and keep its width equal to solitary button's width. Try not to stress over\
    \ exact estimating because it will be made perfect as we compose code for it.\
    \ The task will be performed.\n\n# Implementing UserControl Event Handler\n\n\
    At the point when size of UserControl is adjusted, it is informed because event\
    \ handlers are available to look after this task. This helps in executing code\
    \ for the similar resizing of the buttons. It is advised that when writing code,\
    \ finding out which answer is general enough to be reasonable in any other situation\
    \ can be helpful. Expertise says that finding out the decimal part of a shape\
    \ can be commonly helpful as this function can be used again when required. It\
    \ is a smart thought to take another class and execute the functioning in that\
    \ class at the point when the code might be commonly helpful. The following code\
    \ helps to ascertain another base and top for shape. This rectangle is a fragment\
    \ of an encircled rectangle.\n\n```csharp\nusing System;\nusing System.Drawing;\n\
    \nnamespace UserControlsExamples{\n    public class Rectangles{\n        private\
    \ Rectangles(){}\n        public static Rectangle GetVerticalRectangle(Rectangle\
    \ rectangle, int index, int segments ){\n            Rectangle r = rectangle;\n\
    \            r.Size = new Size( r.Width,NewBottom(rectangle, index, segments));\n\
    \            r.Location = new Point(0,NewTop(rectangle, index, segments));\n \
    \           return r;\n        }\n        public static int NewTop(Rectangle rectangle,\
