    of surfacing constituent events and a substitute method will be proved quite helpful.Promoting
    Events in Constituent ControlsNow, at times there is a need to add new controls
    in the UserControl. These new controls are added as fields. Two layers of profound
    UserControl’s controls have their properties enclosed. Now, make a few assumptions.
    First of all, assume an instance i.e. userControl1 for UserControl. Additionally,
    make an assumption that the instance has a control Button. Now, a code such as
    userControl1.Button.Text is required if the user wants to access the button’s
    Text property. The property is two layers profound. It is realized by the quantity
    of the member of operators which in this case are two. Thus, in the Properties
    window, the Text property of buttons will not appear.The user will be able to
    alter the UserControl’s Button properties technically by supposing that the Button
    is declared as public. Next, surfacing the constituent control’s properties and
    events is necessary if the user wishes to alter them in the Properties window.
    Furthermore, surfacing the events of Button Click is required if the user is to
    allow composing code that will react to the clicks of buttons separately.It is
    suggested to compose event handlers as they allow the surfacing of the constituent
    control events. At the point when the constituent control events are proposed
    these are then passed to the events in the new UserControl. So basically there
    is a need to execute new UserControl events. The code given below shows how constituent
    control events are bubbled up to the level of Interface.1: private void Initialize()2:
    {3: buttons = new Button[]{buttonAllRight, buttonRight,4: buttonLeft, buttonAllLeft};5:6:
    buttonAllRight.Click += new EventHandler(OnAllRightClick);7: buttonRight.Click
    += new EventHandler(OnRightClick);8: buttonAllLeft.Click += new EventHandler(OnAllLeftClick);9:
    buttonLeft.Click += new EventHandler(OnLeftClick);10: }11:12: private bool IsValidIndex(int
    index)13: {14: return (index >= buttons.GetLowerBound(0) &&15: index <= buttons.GetUpperBound(0));16:
    }17:18: public Button this[int index]19: {20: get21: {22: Debug.Assert(IsValidIndex(index));23:
    return buttons[index];24: }25: }26:27: public event EventHandler AllRightClick;28:
    public event EventHandler RightClick;29: public event EventHandler AllLeftClick;30:
    public event EventHandler LeftClick;31:32: private void OnAllRightClick(object
    sender, System.EventArgs e)33: {34: if(AllRightClick != null)35: AllRightClick(sender,
    e);36: }37:38: private void OnRightClick(object sender, System.EventArgs e)39:
    {40: if(RightClick != null)41: RightClick(sender, e);42: }43:44: private void
    OnAllLeftClick(object sender, System.EventArgs e)45: {46: if(AllLeftClick != null)47:
    AllLeftClick(sender, e);48: }49:50: private void OnLeftClick(object sender, System.EventArgs
    e)51: {52: if(LeftClick != null)53: LeftClick(sender, e);54: }In the above code,
    see line 6 to line 9\. This segment of code adds event handlers that are declared
    private. These event handlers are added for the constituent button controls to
    the Click events. In the above code, there are 4 events that are declared public
    i.e. from line 27 to line 30\. The names of these events are LeftClick, RightClick,
    AllLeftClick and AllRightClick. These events can be found in the Properties window
    in the Event view. Event handlers can be added to these public events by users.
    There is a time when the events of the Button Click are proposed. If the user
    has related the public events and the event handlers, then the inner events verify
    this situation. If the case is true, then the events are raised to the UserControl’s
    surface.Why surfacing events and constituent control properties is required is
    the genuine question that pops up in the mind. Because the event handlers can
    also be composed using Forms Designer. Yet the outcome is similar. It does not
    matter if the event handlers are composed using Forms Designer or were written.Other
    Choice for Member PromotionThe ButtonCluster’s buttons are declared public. It
    can be supposed that just like these buttons the declaration of the constituent
    control is also possible. As a matter of fact, the .NET IDE of Visual Studio permits
    the users to do so. When this constituent control is declared public, its events
    and properties are straightforwardly accessible to the users.Some properties have
    nested reference types. These do not appear in the Properties window and their
    property values can be altered, but their events cannot be changed. The altered
    properties of these nested reference types have not persevered effectively to
    the asset document. Basically, these altered properties are neither kept up during
    the run and compilation of the program nor when the IDE is closed. Programmatically,
    this is considered an error.In this case, if a person has some knowledge about
    C #''s historical background, he will be able to make a few inferences. The foremost
    is that it can be said that the C# is incompletely the contrivance of a similar
    person who assembled Borland’s Delphi. His name was Anders Hejlsberg. Borland’s
    Delphi is basically based on the Object Pascal Language. It is its ongoing forms
    assists the nested objects. Secondly, the nested properties should have the option
    to be altered at design time as in the case that they can be changed programmatically.
    It is advised to search for nested objects to perform appropriately in the IDE
    sooner rather than later. Until further notice, at the design time, the nested
    objects don’t persevere the state effectively.Have a look at the code written
    below it tells that the user can also attempt the surfacing of constituent events.public
    EventHandler AllRightClick{get{return buttonAllRight.Click;}}As shown in the above
    code the event property can be returned in that way if the constituent event is
    to be surfaced directly. This way the event property will be permitted to become
    the value for an assignment statement. This value will be the right-hand side
    value. Yet, for the events, the assignment is not characterized. If the regular
    tasks are kept in consideration, then the subtraction and addition assignments
    are not characterized for them, but they are characterized by events.Additionally,
    it may be attempted to over-burden the assignment operator. It may also be attempted
    to make the delegate class a sub-class. Be that as it may, the declaration of
    classes that are delegate is done by utilizing a sealed modifier. This implies
    that it is not possible to make a delegate class a sub-class.Creating a PickList
    ControlThe ButtonCluster which is present can be utilized in any application that
    consists of the ButtonCluster. This is done by referring to the DLL assembly.
    Likewise, in any UserControl, this ButtonCluster can be utilized as a control.
    Instead of making a solitary, solid control, the complication is layered and as
    a result of this, the independent controls are simpler to oversee.The following
    control that is constructed is the UserControl. This UserControl has three controls
    i.e. a ButtonCluster and two ListBox controls. The person using the ButtonCluster
    acts as a user of it and that user only has to concentrate on the new functioning.
    This is done when the PickList control is constructed for the ButtonCluster as
    it is a different UserControl. This is unmistakably less difficult than constructing
    a solid control that characterizes the ListBox and ButtonCluster functioning in
    a single class.Now build another UserControl. This is for the execution of the
    PickList. On the UserControl color the 2 ListBox. After that, put a panel in the
    middle. Next, a ButtonCluster is to be placed in the panel. Now, to keep up the
    overall arrangements change some settings. Change the Dock properties of Right
    ListBox and Left ListBox to right and left, respectively. Change the middle panel
    to Fill. At the point when all the adjustments of the UserControl are done, the
    ButtonClusters and Listbox keep up their positions in the panel. The code written
    below helps in keeping up the arrangement of ButtonCluster:buttonCluster1.Location
    = new Point(panel1.Left + (panel1.Width - buttonCluster1.Width) / 2,panel1.Top
    + (panel1.Height - buttonCluster1.Height) / 2);Adding and Removing ElementsThe
    four types of buttons each have their own functionality and behavior which can
    further be implemented in different ways. The “all right” button represented as
    >> is set to transfer all the elements contained in the left list to the right
    list whenever it is pressed. On the other hand, the “all left” button << does
    the exact opposite, that is moves the elements from the right to the left list.
    If it is required that only the selected elements are to be transferred, then
    the “right” button > is used to transfer them from left to the right list while
    the “left” button < does so from right to left.The ListBox is composed of items
    or elements which are defined as the nested type i.e., ObjectCollection. The ListBox
    controls responsible for moving the elements around are handled by the method
    shown below.1:  private void SourceToTarget(ListBox.ObjectCollection source,2:    ListBox.ObjectCollection
    target)3:    {4:      target.AddRange(source);5:      source.Clear(); 6:    }7:8:    private
    void MoveAllLeft()9:    {10:     SourceToTarget(listBoxRight.Items, listBoxLeft.Items);11:   }12:13:   private
    void MoveAllRight()14:   {15:    SourceToTarget(listBoxLeft.Items, listBoxRight.Items);16:   }17:18:   private
    void SourceToTarget(ListBox.SelectedObjectCollection19:     source, ListBox.ObjectCollection
    target)20:   {21:    IEnumerator e = source.GetEnumerator();22:     while(e.MoveNext())23:     {24:       target.Add(e.Current);25:     }26:   }27:28:   private
    void RemoveSelected(ListBox listBox)29:   {30:     for( int i=listBox.Items.Count
    - 1; i>=0; i--)31:       if(listBox.GetSelected(i))32:        listBox.Items.RemoveAt(i);33:   }34:35:   private
    void MoveLeft()36:   {37:     SourceToTarget(listBoxRight.SelectedItems,38:       listBoxLeft.Items);39:     RemoveSelected(listBoxRight);40:   }41:42:   private
    void MoveRight()43:   {44:     SourceToTarget(listBoxLeft.SelectedItems,45:       listBoxRight.Items);46:       RemoveSelected(listBoxLeft);47:   }Source
    ToTarget method is one which takes the two ListBox.ObjectCollection objects when
    it is called by MoveAllRight and MoveAllLeft. In accordance with the direction
    in which the items are moved, the lists are relocated as well. All the items present
    are represented by the ListBox.ObjectCollection. The object AddRange is set to
    clear up all the previous elements shown in the source list. SourceToTarget moves
    the selected part of the elements and makes use of two arguments which are:'
