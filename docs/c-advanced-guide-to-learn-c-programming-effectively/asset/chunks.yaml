    # 1. 封装

    # 2. 继承

    # 3. 聚合

    # 4. 多态


    因此，任何包含这些原则的编程语言都被归类为面向对象的编程语言。为了在核心部分正确实现这些原则性元素，编程语言使用了被称为 `idioms`（惯用法）和 `constructors`（构造函数）的工具。例如，这些包括：


    * 模板

    * 运算符重载

    * 接口

    * 多线程

    * 多重继承

    * 异常处理

    * 指针

    * 垃圾回收等

