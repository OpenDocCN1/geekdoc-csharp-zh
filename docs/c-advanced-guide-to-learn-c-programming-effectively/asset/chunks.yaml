    to this form control as well by using the following line of code:openFileDialog1.Filter
    = "Class Library(*.dll)|*.dll|Executables(*.exe)|*.exe";Multi-Threading using
    the ThreadPool ClassThe very subject of ‘multi-threading’ is not a simple one
    but, almost every programmer or a computer enthusiast is familiar with what this
    term insinuates. A thread basically defines a stream of code execution that is
