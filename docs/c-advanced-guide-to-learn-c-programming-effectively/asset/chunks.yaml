  trans: "\n正如你所见，Wizard 的功能性定义是一个实现了 `EnvDTE` 中定义的 `IDTWizard` 接口的类。`IDTWizard` 只定义了一个方法：`execute`。其余部分由程序员决定，包括测试是否运行正常。\n\
    \n## Wizard 项目\nWizard 本质上是类的集合，因此要创建一个 Wizard，我们需要创建一个类库。要开始创建一个 `Class Library\
    \ Project`（类库项目），请进入新建项目对话框，选择 `Class Library`（类库）模板，命名你的项目并点击 `OK`。现在你已经踏上了创建自己的\
    \ Wizard 的路程。\n\n## 使用 IDTWizard\n要使用 `IDTWizard` 来制作你的 Wizard，你需要引用设计时环境，即 Visual\
    \ Studio .NET 的扩展性模型。为此，请向项目的引用添加 `envdte.dll` 程序集的引用，并使用关键字引用该库。\n\n![](img/image_rsrc31C.jpg)\n\
    \n`IDTWizard` 中只有一个函数 `Execute`，它必须提供一个上下文数组、一个供其使用的自定义参数数组、一个所有句柄以及一个使用引用传递修饰的返回值。\n\
    \n### 引用传递 (Pass-By Referencing)\n我们需要创建一个返回非 `void` 数据类型值的方法。该方法返回的参数也可以赋予 `ref`\
    \ 关键字，由于它们可以受到调用者的影响，从而允许返回多个值。其他语言中 `ref` 的等效物包括 `C++` 中的传递传递、VisualBasic .NET\
    \ 中的 `ByRef` 以及 Delphi 中的 `var`。下方的示例代码将描述该方法。\n\n## 测试 Wizard\n在向 Wizard 添加了功能后，你可以运行它来检查其是否正常工作。单例对象\
    \ `DTE` 包含一个名为 `LaunchWizard` 的方法，其功能正是如此（具体细节将在章节稍后给出）。接下来的代码列表是我们之前创建的 HelloWorld\
    \ Wizard 的测试宏，随后的代码是你可以放入 Wizard 中的内容示例。\n\n```vbnet\nImports System\nImports\
    \ EnvDTE\nImports System.Diagnostics\nPublic Module Module1\n    Public Sub Test()\n\
    \        Const Path As String = _\"C:\\Temp\\HelloWizard.vsz\"\n        Debug.WriteLine(\"\
    This is running!\")\n        Dim ContextParams(1) As Object\n        ContextParams(0)\
    \ = Nothing\n        DTE.LaunchWizard(Path, ContextParams)\n    End Sub\nEnd Module\n\
    ```\n\n此宏可以在宏 IDE 中找到：转到 Tools > Macros > Macros IDE 打开菜单。现在我们需要创建一个 Wizard 启动文件。该启动文件的扩展名为\
    \ `.vsz`，且名称与 Wizard 的类库同名。\n\n```ini\nVSWIZARD 7.0\nWizard=HelloWizard\nHelloWizardParam=<Nothing>\n\
    ```\n\n将此代码存放在名为 `HelloWizard.vsz` 的文件中，并将该文件放在与 `HelloWizard.dll` 相同的目录下。`HelloWizard.dll`\
    \ 已使用 `regasm.exe`（一种 Visual Studio .NET 工具）进行了注册。注册你的 Wizards 的过程将在本章稍后探讨。\n\n\
    ## 为 Visual Studio .NET Wizards 创建项目模板\nVisual Studio .NET 包含了许多方法、教程、模板等，用于帮助你创建各种项目。然而，它并没有提供\
    \ Wizard 的模板。我们将向你展示如何自己创建一个模板，然后通过新建项目对话框来访问它。\n\nVisual Studio .NET 包含一个名为 `VsWizard.dll`\
    \ 的基础 Wizard，你可以用它来创建项目模板。可以在 `…/Microsoft Visual Studio .NET/Common7/IDE/VsWizard.dll`\
    \ 找到。该 Wizard 使用示例文件、脚本和其他输入从预定义的模板创建项目。因此，我们可以使用它来创建一个模板，从而避免编写另一个引擎来完成此工作，但我们还需要向它提供一组要遵循的规则、文件和示例。我们创建项目模板的过程包括以下步骤（顺序不限特定顺序）：\n\
    \n*   查找并使用一个与我们的目标模板尽可能接近的现有模板。我们将使用 `Class Library` 模板，因为 Wizard 本身已经是一个类库或\
    \ DLL。\n*   通过添加新文件来修改现有模板。对于我们的 Wizard，我们需要添加一个 `.cs` 文件，其中包含一个使用 `IDTWizard`\
    \ 的类。我们可以使用 `HelloWizard` 代码来实现此点。\n*   更新 `templates.inf` 列表，该列表包含了我们新模板所使用的文件。\n\
    *   重写 `common.js`（`.js` 为 Jscript .NET），这是一个包含 `VsWizard.dll` 使用的通用方法的结构文件。我们需要向其中添加代码，以便创建一个引用\
    \ `envdte.dll` 的类库项目。\n*   重写 `default.js` 以包含我们模板的通用方法。\n*   为我们的模板添加图标。\n* \
    \  修改 `VsWizard.dll` 启动器，使其与我们的模板关联。\n*   更新 `VSDir` 以包含我们的项目模板，使其显示在新建项目对话框中。\n\
    \n诚然，这个过程相当繁琐，但这是一个通用的且可扩展的列表，可以用于创建任何你需要的模板。接下来的章节将详细扩展此清单，并说明如何完成每个步骤要求的任务，以及对该过程的进一步描述。我们也将按顺序遵循该清单。\n\
    \n## 从现有模板创建新模板\n项目模板是新建项目对话框中由图标表示的方法。你也可以从文本文件从开始创建一个整个模板，但这样更容易。请注意考虑你将基于哪个项目模板来创建，因为不同版本的\
    \ Visual Studio 具有不同的模板。\n\n要创建一个模板，请选择一个与你的相似的，在我们的案例中是 `Class Library` 模板。要访问此模板，进入\
    \ `…Files\\Microsoft Visual Studio .NET\\VC#\\VC#Wizards`。在这里，类库由 `CSharpDLLWiz`\
    \ 表示。按照以下步骤使用此模板创建一个新模板。\n\n*   将库文件夹复制到相同目录，默认将将其命名为“Copy of CSharpDLLWiz”。\n\
    *   随你喜欢命名。我们建议将此文件夹命名为 `CSharpDLLWizWiz` 以保持惯。\n\n这些文件夹具有 `Scripts` 和 `Templates`\
    \ 子目录，其中包含一个语言标识符。对于英语用户，该标识符可能位于 `1033`。`scripts\\1033` 文件夹包含了模板的 `default.js`\
    \ 文件，我们稍后将学习修改它。`templates\\1033` 文件夹包含了引擎将用于创建模板的实际代码文件。我们将在本节之后讨论它是如何工作的。记住，现在这些仍然只是来自类库模板的相同文件。\n\
    \n你的文件夹看起来应该像这样：\n\n```text\n..\\Microsoft Visual Studio .NET\\VC#\\VC#Wizards\\\
    CSharpDLLWizWiz\\Scripts\\1033\\default.js\nCSharpDLLWizWiz\\Templates\\1033\\\
    assemblyinfo.cs\nfile1.cs\nTemplates.inf\n```\n\n## 向 Wizard 类库模板添加文件\n我们可以将模板所需的文件添加到\
    \ `Templates\\1033\\` 中。现在，我们不需要添加任何此类文件，只需使用现有内容。然而，我们需要更改此处的 `file1.cs` 文件，使其包含\
    \ Wizard 模板的代码。它看起来像这样：\n\n```csharp\nusing System;\nusing EnvDTE;\nnamespace\
    \ [!output SAFE_NAMESPACE_NAME]\n{\n    /// <summary>\n    /// [!output SAFE_CLASS_NAME]\
    \ 的摘要描述\n    /// </summary>\n    public class [!output SAFE_CLASS_NAME] : IDTWizard\n\
    \    {\n        public [!output SAFE_CLASS_NAME]()\n        {\n            //\
    \ TODO: 在处添加构造函数逻辑\n        }\n        public void Execute(object Application,\
    \ int hwndOwner, ref object[] ContextParams, ref object[] CustomParams, ref wizardResult\
    \ retval)\n        {\n            // TODO: 在处添加你的自定义代码\n            // retval\
    \ = EnvDTE.wizardResult.wizardResultSuccess;\n        }\n    }\n}\n```\n\n"
