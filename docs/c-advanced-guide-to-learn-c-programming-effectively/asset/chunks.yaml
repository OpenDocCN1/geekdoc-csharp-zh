  trans: "\n\n在探索 C sharp 时，我们发现这种面向对象的编程语言的核心通过运算符重载、继承、接口、异常处理、垃圾回收、多接口继承、反射和多线程实现了主要元素，但你可能会注意到，`C\
    \ sharp` 规避了一些功能，如模板、原始指针，甚至多重类继承。这些功能没有被包含在 `C sharp` 编程语言中的原因是存在一种争议：一方面，支持这种观点，认为这些特性引入的问题比它们可能解决的问题要多得多；另一方面，另一种观点认为这些是任何面向对象编程语言的核心组件，它们带来的特性是无价的，并且需要被包含在内，但为了保持简单直观，通过简单地不向\
    \ `C sharp` 中添加这些特性，从而避免了进一步的复杂性。然而，这并没有给任何有编程经验的人带来很大信心。这是因为模板、多重继承和指针的特性集极大地方便了\
    \ Web 应用程序和 Web 服务项目中的用户。因此，对于某些人来说，这可能是一个决定性的缺陷，但 `C sharp` 并没有让它们的终端用户失望。为了弥补此类工具的缺失，`C\
    \ sharp` 包含了了自己的功能集，可以帮助用户构建 Web 应用程序和 Web 服务。例如，`C sharp` 具有一个允许在 Windows 平台上托管应用程序的工具，即“COM\
    \ interop ..”。不仅如此，`C sharp` 还以多语言编程和快速应用开发著称。\n\n但在所有这些论述之后，仍然有一个好消息。正如我们之前讨论过的，所有的面向对象编程语言具有相同的核心原理，区别在于实现这些原理的特性。你会发现其他\
    \ OOPL 的某些特性延续到了 `C sharp`。例如，如果你熟悉 `C++` 或 `Java` 的语法，那么你会发现 `C sharp` 的语法非常熟悉，从而让你能够相当快地进入状态。这只是你在将\
    \ `C sharp` 与其他面向对象编程语言比较时会发现许多相似之处之一，所以如果你是从这些语言过渡过来的，进行快速的比较是一个好主意。\n\n在接下来的章节中，我们将讨论面向对象的基础，并讨论\
    \ `C sharp` 中提供的相应特性。\n\n## 定义类\n\n创建和定义类的方法与你在 `C++` 中相同，尽管此操作的底层结构在 `C sharp`\
    \ 中略有不同。以下语法演示了在 `C sharp` 中定义类所需的结构。\n\n```\nAccess-modifier class name{}\n```\n\
    \n需要注意的一点是，与 `C++` 一样，`C sharp` 是一种大小敏感的编程语言。因此，在引用类时，你需要警惕定义类的大小。否则，编译器将无法识别你指的是哪个类。\n\
    \n上述演示的语法具有混淆的可能，所以让我们澄清它的元素。该语法有两个元素——“访问修饰符”和“名称 ..”。第二个元素是自言自明的，即用于识别该类的字符集，但第一个元素的目的是定义类的作用域（你应该已经熟悉“作用域”了）。通常情况下，类被指定为“public”（这在其他编程语言中等同于“global”），这样只要包含了头文件（类已经在其中定义了），就可以被任何程序中的任何函数访问它们。\n\
    \n所以，如果我们替换上面所示语法中的适当参数，我们将得到类似下面的内容：\n\n```\npublic class MyFirstClass{}\n```\n\
    \n在花括号中，你填入类的内容（它包含的函数、方法和对象）。如果你观察得仔细一点，你会发现类名的每个单词的首字母都是大写的。这并不是随机的，也不是错误。相反，我们在命名类时遵循一种约定。约定的目的是在编程时保持一致性，这从长远来看可能产生巨大影响，但并不是强制遵循这种命名约定（被称为“帕斯卡命名法”Pascal\
    \ Casing）。是否选择使用它完全取决于你（编程中的其他许多约定也是如此）。\n\n## 在控制台应用程序中使用类\n\n假设你具备一些编程知识或任何程度编程经验，那么你一定熟悉“控制台”（console）这个术语。当你使用\
    \ IDE 软件编写代码时，你会发现底部有一个小窗口，看起来类似于命令提示符，在用户执行某些命令（如编译、调试等）时提供反馈信息。此外，当要求编译你当前打开的项目时，控制台还会显示代码中的语法错误。\n\
    \n同样，假设我们想使用 `C sharp` 来编写应用程序等。在这种情况下，我们将使用集成开发环境（例如 Microsoft Visual Studio）来完成，但我们不应将“控制台”与“控制台应用程序”混淆。虽然控制台在\
    \ IDE 中始终原生打开，但另一方面，“控制台应用程序”仅仅是一个没有 fancy GUI 的可执行文件。用户与应用程序交互的界面就像简单的命令提示符。\n\
    \n在这些任务中，你在 `C sharp` 编程期间可能执行的最常见操作是在特定的控制台应用程序中实现你定义的类。我们可以通过在 IDE 中打开“新建项目”轻松创建一个新的控制台应用程序。新创建的控制台应用程序的底层代码如下：\n\
    \n```\nusing System;\nnamespace HelloWorld\n{\n    /// <summary>\n    /// Class1\
    \ 的摘要描述。\n    /// </summary>\n    class Class1\n    {\n        /// <summary>\n\
    \        /// 应用程序的主入口点。\n        /// </summary>\n        [STAThread]\n       \
    \ static void Main(string[] args)\n        {\n            // TODO: 在此处添加代码启动应用程序\n\
    \        }\n    }\n}\n```\n\n现在让我们分解一下这段代码。在代码块的最开始，我们注意到使用了一个语句，即“using ..”。传递给该语句的参数是“System\
    \ ..”。在这段代码中，`System` 实际上通过我们计算机上安装的 `.NET Framework`显然是使用 Windows）可用的 `.dll`\
    \ 程序集文件。我们不需要详细说明“为什么”一个新的控制台应用程序要使用 `System.dll` 程序集文件。对这个“为什么”问题的简单回答是，该文件包含了“公共语言运行时”（Common\
    \ Language Runtime）所需的必要元素。即使说 `.dll` 文件本身就是控制台应用程序也是没错。我们在 `C sharp` 中使用的 `using`\
    \ 语句与 `C++` 中的 `include` 语句以及 Delphi 中的 `uses` 语句同义。\n\n下一步，我们通过 `namespace` 语句指定控制台应用程序的“名称”。传递给该语句的参数将是我们分配给项目的名称，在这种情况下，将是用户创建的第一个程序的约定名称，即“Hello\
    \ World”。然而，在参数中，我们不在单个命名空间之间添加空格。\n\n你在这段代码中间看到的“斜杠”符号表示注释。在三个/两个斜杠（`\\\\\\`\
    \ 或 `\\\\`）之后写的任何内容都被认为是程序员编写的额外注释。当你以后在程序生命周期中需要查看程序代码，或者当其他人在探索它时，注释会非常有帮助。\n\
    \n在初始的三个注释之后，我们将看到第一个类的定义。由于这是我们创建默认控制台应用程序时生成的代码，类名和结构是标准的。建议将你创建的类起一个简单易懂、简短且易记忆的名字（尽管并不是每个名字都能同时具备这三个元素）。\n\
    \n接下来我们是整个应用程序的核心元素，`Main()` 成员。如果你对控制台熟悉，你就会熟悉这个成员。`Main` 是一个静态成员。`string[] args`\
    \ 这种形式的参数告诉我们，这些字符串是数组的。。 ` `C++` `，`Main` 这种属性用的实用的。在任务任务，，是你在 `C sharp` 编程期间最可能执行的最常见操作。\n\
    \n## 在控制台应用程序中打印语句\n\n现在我们通过在控制台应用程序中填充参数来显示语句：\n\n```\nusing System;\nnamespace\
    \ HelloWorld\n{\n    /// <summary>\n    /// Class1 的摘要描述。\n    /// </summary>\n\
    \    class Class1\n    {\n        /// <summary>\n        /// 应用程序的主入口点。\n    \
    \    /// </summary>\n        [STAThread]\n        static void Main(string[] args)\n\
    \        {\n            Console.WriteLine(\"Hello World!\");\n            Console.ReadLine();\n\
    \        }\n    }\n}\n```\n\n为了打印短语，我们使用两个基本函数，即 `Console.WriteLine()` 和 `Console.ReadLine()`。我们指定想要控制台应用程序显示的短语或句子，并将其作为参数传递给\
    \ `Console.WriteLine()`。一旦完成，`Console.ReadLine()` 函数将一直等待它接收到的回车，然后继续它的工作。`Console.WriteLine()`\
    \ 函数的作用与 `C++` 语言中的 `cout` 语句相同。分析打印“Hello World!”短语的使用时，你可能会注意到这些方法是在没有包含“Console”实例的情况下使用的。但事实是这些方法是名为\
    \ `Console` 的类的静态成员。所以，如果我们想调用和使用这些方法，就不需要创建相应类的实例。## 在命令提示符上执行“读取”\n\n我们现在将概述有效拦截传递给控制台应用程序的参数的方法。要这样做，我们只需向\
    \ `Console.WriteLine()` 方法传递一个特殊参数。该参数是 `args[0]`，你可以看到它在代码块中的实现：\n\n```\nusing\
    \ System;\nnamespace HelloWorld\n{\n    /// <summary>\n    /// Class1 的摘要描述。\n\
    \    /// </summary>\n    class Class1\n    {\n        /// <summary>\n        ///\
    \ 应用程序的主入口点。\n        /// </summary>\n        [STAThread]\n        static void\
    \ Main(string[] args)\n        {\n            Console.WriteLine(args[0]);\n  \
    \          Console.ReadLine();\n        }\n    }\n}\n```\n\n当我们执行此代码块时，每当我们向命令提示符传递参数时，它就会被显示在控制台上的控制台拦截。向命令提示符传递参数有两种方法（也有其他方法，但为了简单起见，我们只坚持这两种）。\n\
    \n"
- fmt: '

    * Execute an assembly through the command prompt and pass a corresponding argument.

    * Using the Microsoft Visual Studio IDE to pass arguments to the command prompt.


    Let’s get into some details regarding the second method. Using the `.NET Visual
    Studio` Integrated Development Environment is not that complex since you must
    have experience with other IDEs at this point. In order to use the IDE to pass
    an argument to the command line, we need to perform the following actions:


    1. Open the Visual Studio IDE and look for the `Solution Explorer` menu inside
    the `View` tab.

    2. Once you are inside the `Solution Explorer` menu, you will find a list of all
    the projects that you have been working on or placed in the IDE’s browsing directory.
    Over here, you need to find the project you want to work on for this task and
    then just right-click it. This will open a drop-down menu, and from here, you
    select the `Properties` option.

    3. This will open a new window as shown below:


    ![](image_rsrc318.jpg)


    On the left-hand side, you will see a small file navigation interface. From here,
    double click `Configuration Properties`, and inside, select `Debugging`.

    4. In the 3rd category named `Start options`, the first section will be `Command
    Line Arguments`. Over here, you need to specify an appropriate value. In this
    case, we pass an argument `Debugging C#`.

    5. Once we are done with passing a command-line argument, we can reboot the application
    we have opened in the IDE manually or by pressing the `F5 key key as the shortcut
    key. Once the application runs using the IDE after a reboot, we will be able to
    see the argument passed to the command prompt.

