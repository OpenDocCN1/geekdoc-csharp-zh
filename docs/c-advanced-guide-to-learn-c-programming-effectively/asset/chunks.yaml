    A few things are going on, on the surface level: rounded shapes and buttons, gradients
    and colors, images contained in the button spaces, the VideoKiosk trademark logo,
    the slider on the top of the interface, etc. As one might expect, the buttons
    respond to Click events, causing a Click event handler to be called into function
    that passes its output to run the requisite code block.Two things contribute to
    the reusable design of these graphical controls: one, controls are implemented
    separately by the button, and two, the graphical design does not actually do anything
    - it only serves to call a function using an IPlayer interface (which will be
    discussed later). For example, pressing Play plays something by passing the respective
    command of the PlayControl, on the condition that the IPlayer interface is used.
    Classes allow repeatability of individual controls and the interface allows us
    to reuse the entire component. This interface and its subroutines is described
    below.


    | using System;namespace VideoKiosk{public interface IPlayer{void Close();void
    Play();void Pause();void Stop();void FastForward();void FastReverse();void VolumeUp();void
    VolumeDown();bool Open();double Duration();bool Mute();void Mute(bool state);double
    Elapsed();}} |


    Owing to this sizeable list of functions, we can conclude that the IPlayer interface
    can be used to emulate many modern devices on one computer instead.Form1.cs ,
    the main form in the VideoKiosk, is used to implement the interface, i.e. all
    functions named in the interface are handled by this form. Therefore, we can call
    Form1 as a player using PlayControl.  To do so, we pass a reference to the PlayControl,
    contained within its constructor, to the form as follows:


    | private PlayControl control = null;private void Form1_Load(object sender, System.EventArgs
    e){control = new PlayControl(this);control.Show();} |


    The PlayControl instances themselves associate and keep track of players. Its
    constructor is as follows:


    | private IPlayer player;public PlayControl(){InitializeComponent();}public PlayControl(IPlayer
    player) : this(){this.player = player;} |


    Since PlayControl is dependent on Form1, the PlayControl closes when Form1 does.
    The above constructor shows how to call for the default constructor, which is
    the PlayControl method itself, and takes no arguments. It must call this constructor
    since this is the function to initialize the component. Without doing so, the
    control objects we wanted to create will not be created, and the form will not
    work correctly.This default constructor is called by this() ,and the subsequent
    player controls are cached in the this.player variable field. This has now created
    a player that we can control using PlayControl.Let’s look at how, for example,
    the play functionality is handled when we press the play button. To begin with,
    the function player.Play() is called, which runs code in Form1\. Form1 contains
    the following in our example. This can be different for other sets of interfaces:


    | void IPlayer.Play(){axMediaPlayer1.Play();} |


    A more nuanced and practical implementation of a play functionality (as shown
    in this example code for VideoKiosk’s play command) would involve things such
    as event invocation and logic checks:


    | private void Play(){if(player==null) return;try{player.Play();PlayerState =
    PlayerState.playing;}catch{PlayError();PlayerState = PlayerState.stopped;}}private
    void playButton1_Click(object sender, System.EventArgs e){Play();} |'
