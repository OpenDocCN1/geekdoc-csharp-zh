    = GetInitialDirectory();Broadcaster.Add(this);}private void ChangeStatus(string
    status){statusBar1.Text = status;statusBar1.Refresh();}void IListener.Listen(string
    message){ChangeStatus(message.Trim());}We already talked about how we can achieve
    this functionality using the Broadcast function in the broadcast class and the
    corresponding interface ‘IListener .’Implementing the ‘MainMenu’ Form ControlOn
    any standard windows application, you will see a ‘main menu’ that features all
