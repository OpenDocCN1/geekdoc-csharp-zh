    Of key importance is how to alter the image so that it fits into the button’s
    display. For example, some parts of an image are perhaps unnecessary to display.
    To remove these parts, you can screen them out by defining an ImageAttributes
    object which defines what colors need to be removed. Also, notice how overloaded
    DrawImage is so as to account for a variety of input arguments. ImageButton, now,
    uses the ImageAttributes object we created to screen our desired color (white,
    in this case) and removes it. If we want only to remove a specific part of the
    image, make that part match the same color as given to the ImageAttributes method.Secondary
    TopicsWe’ve given you a fairly solid overview of how VideoKiosk.sln works but
    do keep in mind that the listing for this structure, which includes Control.dll
    as well, is well over a few hundred lines of code. These would allow you to simplify
    your operation of making all of your control buttons from one base RoundButton
    object, but we wanted to show you how to use and appreciate GDI+. However, it
    does use a few structures from .NET to round out its functionality, which is tangential
    to our topic. We’ll discuss them here for your perusal.The Elapsed Time ClockVideoKiosk.sln
    contains an Elapsed Time clock that is updated using a Timer tick. The Timer control
    isn’t very resource-intensive, but it does get the job done for one small clock.It
    works by raising a flag at time intervals defined in milliseconds. When this interval
    (Timer.Interval ) completes, a SetPosition function changes the Tracker object''s
    position using a value defined by Player.Elapsed that also updates the digital
    clock that expresses the Tracker’s time. This works by defining a position in
    seconds so it can be used for the digital clock and the extreme values of the
    Tracker. We create the clock using a method called TimeSpan , which is initially
    provided the elapsed time in seconds:


    | private TimeSpan GetSpan(int position){return new TimeSpan(0,0,0,position, 0);}private
    string GetMask(){return "{0}:{1,2:0#}:{2,2:0#}";}private string GetFormatted(TimeSpan
    span){return string.Format(GetMask(), span.Hours,span.Minutes, span.Seconds);}private
    void ChangePosition(){labelElapsed.Text = GetFormatted(GetSpan(Position));} |


    This method also knows how to convert seconds to other larger units of time. Seconds
    are converted to minutes and hours automatically. GetMask provides a formatting
    string to control the appearance of TimeSpan, which is then used to update the
    clock. We’ll discuss this formatting string soon.Using TimeSpan to Tell TimeTimeSpan
    can measure time differences to an accuracy of 100 nanoseconds. This is a ”tick”
    of the TimeSpan, like the tick of any other clock. TimeSpan can be represented
    as either a positive or negative span of time that can measure out to days. The
    string that TimeSpan stores its time in is d:hh:mm:ss.ff , where ff refers to
    fractions of a second. If we needed this string we could use TimeSpan.ToString()
    to get time in that format. Performing arithmetic on DateTime values also yields
    a string like that.Formatting StringsWe choose not to use TimeSpan.ToString()
    and instead do it manually for a more educational view into the string''s inner
    workings.Format and formatting masks.GetMask provides you with a formatting mask
    , which serves to receive data values from the string. This mask is “{0}:{1,2:0#}:{2,2:0#}”:
    values in the bracket are format characters that can be modified, and everything
    else is literals. The first value represents the zero-based argument to be changed,
    and any value after the comma represents the size of the argument. The third value
    represents the number and adds a zero to the number if there’s space for it (in
    the case of the number being too short). For example, {1,2:0#} represents the
    first replaceable parameter, length 2, and currently filled with 0.Tooltip ControlWindows
    Forms contains a ToolTip structure. This structure is added to the component tray
    of a program, rather than the main form, which causes the Form’s controls to have
    the ToolTip property added: this allows you to display a tooltip textbox when
