  trans: "\n\n# 使用字段和属性\n\n`Fields`（字段）和 `Properties`（属性）是两个之间存在有趣关系的元素，但在讨论它们之前，让我们先理解编程中“消费者”（consumers）和“生产者”（producers）的底层概念。“消费者”是指那些对类等对象的终端用户。同样，“生产者”是指那些构建这些类的人。这里值得注意的一个有趣点是，消费者和生产者都是程序员。\n\
    \n现在已经明确了这一点，让我们来谈谈“字段”。一个 `Field`（字段）简单来说就是包含类中的一组数据。按照惯例，类的字段从不是公有（public）的。相反，它们被生产者设置为\
    \ `private`（私有），但有时消费者需要访问他们正在使用的类的字段，然而，由于这些字段是私有的，他们受到了阻碍。\n\n这就是 `Properties`（属性）大显身场的地方。属性具有双重性质。详细来说，如果消费者正在使用这种“属性方法”，它看起来就像消费者在处理数据没有区别。另一方面，如果生产者使用相同的属性方法，它的功能就就像是一个方法（method）。\n\
    \n你可能会问，为什么起初需要访问类的数据字段呢？嗯，答案非常简单直接：访问类的数据允许程序员自由地更改类的方法，甚至对类的对象进行一些微调。同样，使用 `Properties`\
    \ 允许我们控制类中数据被访问的方式。\n\n## 定义字段\n\n字段的本质，即它包含的数据类型，通常可以是任何类型（它只需要符合它将要使用的类的目的）。由于这些数据对类很重要，因此它们通常通过使用访问修饰符来保持私有状态（即将其作用域设置为\
    \ `private`）。这样一来，只有创建该字段的程序员（生产者）才能对其进行更改。如果生产者以外的任何人想要访问类中的字段并对其进行更改，他们必须通过“属性方法”来完成。\n\
    \n在接下来的代码块中，我们正在创建一个存储字符串数据的字段：\n\n```csharp\nusing System;\nnamespace HelloWorld{\n\
    \    /// <summary>\n    /// 类 Class1 的摘要描述。\n    /// </summary>\n    class Class1{\n\
    \        private static string arg0 = null;\n        /// <summary>\n        ///\
    \ 应用程序的主入口点。\n        /// </summary>\n        [STAThread]\n        static void\
    \ Main(string[] args){\n            arg0 = args[0];\n            Console.WriteLine(arg0);\n\
    \            Console.ReadLine();\n        }\n    }\n}\n```\n\n在这次演示中，你可以发现我们没有在程序中使用\
    \ `Class1` 的实例。现在，让我们稍微修改这段代码块，以便我们实际上使用相应类的实例，同时它本质上执行相同的工作：\n\n```csharp\nusing\
    \ System;\nnamespace HelloWorld{\n    /// <summary>\n    /// 类 Class1 的摘要描述。\n\
    \    /// </summary>\n    class Class1{\n        private string arg0 = null;\n\
    \        public void WriteCommandLine( string arg ){\n            Console.WriteLine(arg);\n\
    \            Console.ReadLine();\n        }\n        /// <summary>\n        ///\
    \ 应用程序的主入口点。\n        /// </summary>\n        [STAThread]\n        static void\
    \ Main(string[] args){\n            Class1 class1 = new Class1();\n          \
    \  class1.arg0 = args[0];\n            class1.WriteCommandLine(class1.arg0);\n\
    \        }\n    }\n}\n```\n\n基本上，修改涉及我们如何使用 `Main()` 方法。最初，该方法处理了执行相应工作的大部分工作，但我们在修订中更改了\
    \ `Main()` 方法的目的，使其唯一的工作仅充当“启动方法”。为了适应代码工作方式的变化，我们实现了一个 `Class1` 的实例。\n\n## 定义属性\n\
    \n由于其性质和功能，`Properties`（属性）基本上被认为是“方法”（当我们在之前的章节节中讨论“属性方法”时，你可能已经猜到了）。通常，属性可以用两种方式之一使用，要么作为“右侧值”（right-hand\
    \ side value），要么作为“左侧值”（left-hand-side value）。如果属性被用作 RHS 值，我们调用一个特定的属性方法称为“getter”（获取器）。另一方面，如果属性被用作\
    \ LHS 值，我们调用的相应属性方法称为“setter”（设置器）。\n\n属性还有用于定义其作用域的访问修饰符。按照惯例，属性被设置为公有的（public）。以下是属性定义的方式：\n\
    \n```csharp\nAccess-Modifier Type Property-Name\n{\n    get{return field;}\n \
    \   set{field = value;}}\n}\n```\n\n本质上，属性有三个基本元素——一个访问修饰符（通常设置为 `public`）、一个“类型”，以及最后也是最重要的一点，一个名称。`Properties`\
    \ 根据其用法和实现分为三种，即：“只读属性”（Read-only Properties）、“索引属性”（Indexed Properties）和“只写属性”（Write-only\
    \ Properties）。在继续之前，让我们来讨论这些不同类型的属性。\n\n### 只读属性\n\n我们区分只读属性的主要元素是观察它是否拥有“getter”或“setter”。如果属性只有“getter”，那么它就是“只读属性”。正如其名称所示，此类属性只允许用户查看属性元素（如其值），而用户没有权限进行任何更改。这里有一个访问类中定义的“只读属性”值的示例。此温度类具有摄氏度和华氏刻度的特征。以下是我们如何使用只读属性来获取相应类将显示的温度刻度：\n\
    \n```csharp\npublic enum TemperatureMode{fahrenheit, celsius}\nclass Temperature{\n\
    \    private TemperatureMode mode = TemperatureMode.fahrenheit;\n    private double\
    \ celsius = 0;\n    private double fahrenheit = 0;\n    public Temperature( double\
    \ aTemperature, TemperatureMode aMode ){\n        mode = aMode;\n        SetTemperature(aTemperature);\n\
    \    }\n    private void SetTemperature(double aTemperature, TemperatureMode aMode){\n\
    \        if(aMode == TemperatureMode.fahrenheit ){\n            fahrenheit = aTemperature;\n\
    \            celsius = FahrenheitToCelsius(fahrenheit);\n        }\n        else{\n\
    \            celsius = aTemperature;\n            fahrenheit = CelsiusToFahrenheit(aTemperature);\n\
    \        }\n    }\n    public static double CelsiusToFahrenheit(double celsius){\n\
    \        return celsius * (9.0/5) + 32;\n    }\n    public static double FahrenheitToCelsius(double\
    \ fahrenheit){\n        return (fahrenheit - 32) * 5.0/9;\n    }\n    public TemperatureMode\
    \ Mode{\n        get{return mode;}\n        set{mode = value;}}\n    public double\
    \ Value{\n        get{return mode == TemperatureMode.fahrenheit ?fahrenheit :\
    \ celsius;}}\n    public bool Test(){\n        return fahrenheit == FahrenheitToCelsius(celsius)&&\
    \ celsius == CelsiusToFahrenheit(fahrenheit);\n}\n上面的代码块执行了确定温度将转换到的刻度（简单来说，是确定使用摄氏度刻度还是华氏度刻度）。\n\
    ```\n\n### 只写属性\n\n正如只有“getters”的属性是“只读属性”的特征一样，只有“setter”的属性主要被称为“只写属性”。在这种类型的属性中，访问类的用户可以对其甚至对属性本身进行更改。通常你不会遇到只写属性，因为它们会给终端用户带来不必要的复杂性。但并不意味着只写属性完全没用。例如，你可以使用只写属性来以密码的形式向用户请求身份验证。与其使用只读属性显示密码，不如让用户自己输入。\n\
    \n### 索引属性\n\n这种属性与其他两个一样简单。正如“Index”（索引）名称所示，这种属性主要用于通信放置在类中的项。由于主用户将是消费者，请求的数据以\
    \ `object[index]` 的形式显示。\n\n```csharp\nclass IndexedProperty{\n    private string[]\
    \ args = null;\n    public IndexedProperty(string[] args){\n        this.args\
    \ = new string[args.Length];\n        args.CopyTo(this.args, 0);\n    }\n    [System.Runtime.CompilerServices.IndexerName(\"\
    Command\")]\n    public string this [int index]{\n        get{return args[index];}\n\
    \        set{args[index] = value;\n    }\n}\n```\n\n## 使用类实例\n\n为了创建一个对象的实例并使其在创建它的程序中运行，我们需要通过运算符来调用“构造函数”（Constructor）。当我们创建一个对象的实例时，可以获取一组变量并将它们链接到实例化对象，但执行此操作有一个条件：当我们尝试将变量赋值给对象时，两个元素都需要相互兼容。实例化对象的类型和变量的类型需要相似；如果对象和变量的类型不匹配，此过程将失败。这扩展到了继承的对象。因此，如果我们有一个之前声明为与对象相同的变量，那么我们也可以在相同对象的子实例中使用它。如果我们想创建一个对象的实例，我们需要使用构造函数。构造函数基本上是一种在创建对象过程中主要使用的方法（包括创建实例）。构造函数有三个元素：名称、访问修饰符和参数。构造函数的名称通常是它所属类的名称。\n\
    \n```csharp\n// 简单的对象创建\nFileStream fs = new FileStream(\"c:\\\\temp\\\\killme.txt\"\
    , FileMode.CreateNew);\nfs.Write(new Byte[]{65, 66, 67, 68, 69}, 0, 5);\nfs.Close();\n\
    \n// 数组示例\nstring[] strings = new string[10];\nstrings[0] = \"Some Text!\";\n\
    int[] integers = new int[]{0,1,2,3,4};\n```\n\n## 定义接口\n\n在面向对象编程语言的语文中，接口（interface）与你可能熟悉的没有区别。接口的主要用途是为特定类创建交互方法。更准确地说，接口是接入类功能的实际实现。考虑安装在车辆上的音响系统。该音响系统有两个圆形控制器。接口是接入类功能的某种具体化。\n\
    \n"
- fmt: "\n* The class from which the features are inherited is the parent class, and\
    \ the class which inherits those said features is the child class. For example,\
    \ If `Class Y` inherits the members of `Class X`, then `X` is the Parent and `Y`\
    \ is the Child.\n* If `class Y` inherits the members of `class X`, then `class\
    \ X` is referred to as the `superclass`, and `class Y` is referred to as the `subclass`.\n\
    * The process of `Inheritance` is sometimes also referred to as `generalizing`.\n\
    * If the inheritance relationship has multiple children, then the relationship\
    \ of each child with each other would be termed as `siblings`. So, multiple classes\
    \ that inherit their members from the same superclass are termed as `siblings`.\n\
    \nHere’s an example of using the Inheritance feature, where multiple classes are\
    \ inheriting the members of the `Radio Class`, which, in this case, would be known\
    \ as the parent class.\n\n```csharp\npublic interface IAudio {\n    void AdjustVolume(int\
    \ value);\n}\npublic class Radio : IAudio {\n    private int volume = 0;\n   \
    \ void IAudio.AdjustVolume(int value) {\n        volume += value;\n    }\n   \
    \ public int Volume {\n        get { return volume; }\n        set { volume =\
    \ value; }\n    }\n    private double station = 94.1;\n    public double Station\
    \ {\n        get { return station; }\n        set { station = value; }\n    }\n\
    \    public void Receive() {}\n}\npublic enum RadioBand { AM, FM}\npublic class\
    \ AMFMRadio : Radio {\n    private int volume = 0;\n    void IAudio.AdjustVolume(int\
    \ value) {\n        volume += value;\n    }\n    public int Volume {\n       \
    \ get { return volume; }\n        set { volume = value; }\n    }\n    private\
    \ double station = 94.1;\n    public double Station {\n        get { return station;\
    \ }\n        set { station = value; }\n    }\n    public void Receive() {}\n}\n\
    ```\n\nThis might be a little confusing for you because there are multiple instances\
    \ of inheritance going on, but the core concept remains the same. In this example,\
    \ we have a parent class (superclass), `Radio`, and two child classes (subclasses),\
    \ `CommunicationsRadio` and `AMFMRadio`. These sibling classes inherit the important\
    \ members of their parent class in order to perform their own unique functions.\
    \ For the `CommunicationsRadio` class, it would be to enable the functionality\
    \ of transmitting and receiving radio signals, and for the `AMFMRadio` class,\
    \ it would be to support different Radio Bands, i.e., Amplitude Modular Bands\
    \ (AM) and Frequency Modular Bands (FM).\n\n### Encapsulation and Aggregation\n\
    Both `Encapsulation` and `Aggregation` indicate the affinity of a class (or any\
    \ data structure) to be stuffed with members, but both these terms are not the\
    \ same. While encapsulation refers to the affinity of a class to withhold members\
    \ within itself, aggregation includes those members that are classes themselves\
    \ (or data structures). If the concept of encapsulation is still confusing, then\
    \ consider an analogy. Think of the small leaflet that has small compartments\
    \ holding medicine tablets. The medicine is `encapsulated` in the leaflet. In\
    \ this analogy, the `medicine` is actually the `class`, which has the methods,\
    \ functions, and objects, and the leaflet represents the `encapsulation` method.\
    \ Through the use of encapsulation and aggregation, we can essentially put data\
    \ in a class while controlling the authorization to access it. With encapsulation,\
    \ we can add simple data types and structures. With aggregation, we can add more\
    \ complex data types and structures inside a class.\n\nHowever, we cannot just\
    \ throw data randomly inside classes. We need to think about which class is the\
    \ best container for our data. One way of going about this is to look through\
    \ the list of classes available to you and determine which is the most suitable\
    \ contender, i.e., which class is inherently responsible for holding a specific\
    \ type of data. For example, if we consider the human lungs as `data`, then it\
    \ would make more sense to put them inside a `human body (class)` rather than\
    \ in a plant (another class).\n\nLet’s use the `Radio` class to explore how we\
    \ can implement `Encapsulation` and `Aggregation`.\n\n```csharp\npublic class\
    \ BoomBox {\n    private AMFMRadio radio;\n    public AMFMRadio Radio {\n    \
    \    get { return radio; }\n    }\n    BoomBox() {\n        radio = new AMFMRadio();\n\
    \    }\n}\n```\n\nIn this code block, we are working with a new class that we\
    \ haven’t previously used called `BoomBox`. The interesting part is that this\
    \ class actually contains the `AMFMRadio` class. As such, the `AMFMRadio` class\
    \ is representing the process of encapsulation as well as aggregation.\n\n###\
    \ Polymorphism\nThe concept of `Polymorphism` in C sharp is actually not that\
    \ complicated. Polymorphism is basically involved when a programmer encounters\
    \ a problem that can be handled by any general `provider`. However, the catch\
    \ here is that the provider must be part of a bigger set of providers. This means\
    \ that our problem can be solved regardless of whichever provider we choose from\
    \ this collection. This is known as `Polymorphism`, but just understanding polymorphism\
    \ from this perspective might not do you any good so let’s take a more technical\
    \ approach.\n\nFirst, let’s take a class and declare it as a general type. When\
    \ we generalize a class, it basically inherits the type of its parent class (the\
    \ superclass). If we want to take this class and create several instances and\
    \ want each instance of the class to have a type, we specify and not a general\
    \ type, this is our `problem`. The notion of this being a `problem` might seem\
    \ silly, but it's to help you understand the concept of `polymorphism`. We can\
    \ solve this problem by choosing a type from a selection of different `types`.\
    \ Choosing any one type will solve the problem, but we still have a wide selection\
    \ we can choose from. This is `polymorphism` where we first declare a class of\
    \ a general type and then declare instances with `types`. This phenomenon can\
    \ be easily observed in the working of the `EventHandler` delegate The delegate\
    \ is instructed in a way such that its initial parameter will be an object. So,\
    \ this means that the class harboring the object will be considered as root.\n\
    \n### Access, Class, and Member Modifiers\nLet’s first talk about `Access Modifiers`.\
    \ To put it simply, access modifiers define what the users of a class can see\
    \ and access. If the access modifier of a class is set to `private`, then the\
    \ consumer will not be able to see the class, much less try to access it. If the\
    \ access modifier is set to `public`, then the consumer will be able to see the\
    \ class as well as access its contents and make changes to it. The practical use\
    \ of access modifiers is allowing for guiding a user during their programming\
    \ session. If someone is using your class in their code, then keeping those classes\
    \ `private` that do not require any attention from the consumer will focus the\
    \ concentration primarily on the classes that have been kept `public` by the producer.\
    \ In this way, the producer ensures that the consumer only tinkers with those\
    \ classes that need interaction in order to use them.\n\nIn C sharp, there are\
    \ a total of five access modifiers that you can use. These access modifiers have\
    \ been listed below, accompanied by brief explanations.\n\n1. **Public Access\
    \ Modifier**: this modifier provides the end-user with the freedom to access the\
    \ members of the corresponding class (this also includes the `types` in the class\
    \ as well).\n2. **Protected Access Modifier**: this access modifier is generally\
    \ used with classes that are nested (a class within a class). As such, the subclasses\
    \ (child classes) will be able to access the members of the superclass (parent\
    \ class) and other classes within the nest, but the same level of access is not\
    \ given to consumers. Instead, they will be restricted from accessing the members\
    \ of the nested classes.\n3. **Private Access Modifier**: any members of a class\
    \ that have a private access modifier cannot be accessed by any subclass (child\
    \ class) or any other user except for the one who created the class.\n"
