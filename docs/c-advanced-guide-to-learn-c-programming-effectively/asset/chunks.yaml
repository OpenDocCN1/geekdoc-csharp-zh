    The problem is resolved in line 52 of the above code. After this is done, remember
    to remove the TODO token from your code.A tip for using comments is to add custom
    tokens to classify what kind of problem something is, and how it should be handled.The
    Process ClassThe Process Class, introduced in a previous section of the book,
    is used to actually receive an impetus for the rest of the code to run. Process.Start
    is a static method attached to the Click event handler for the leftmost ImageButton
    control on the PlayControl interface.COM InteropCOM Interop (for interoperability)
    is a concept in .NET languages that uses COM libraries and controls in .NET environments
    since .NET uses Reflection and metadata in its assemblies to achieve the same
    goal. These concepts were explained in a previous section as well if you would
    like to review them.Let''s take the example of the ActiveX Media Player from VideoKiosk.sln.
    This is a COM-based control, and to use it we need to import these controls to
    our .NET toolbox by selecting Customize Toolbox from the Toolbox menu. This will
    import the type library for that COM control, and allows their usage in a .NET
    environment. This, of course, comes with the caveat that you will be using outdated
    COM structures, and you also will need to create an installer program to register
    these commands and methods.To conclude the discussion we made so far in this chapter,
    GDI+ is an improvement and a streamlining of Windows’ powerful GDI toolkit, making
    it much easier and more lenient to handle due to the advent of .NET and the addition
    of new methods and structures. GDI+ is used for imaging, typography, and vector-based
    graphics. The structures GDI+ uses are stateless and require constant streams
    of their information. Use CreateGraphics to create a Graphics object, or take
    the object received by Paint event handlers.Chapter 4: Personalizing the Visual
    Studio .NET Framework EnvironmentThere has been considerable investment and research
    made towards code automation capabilities for Visual Studio by Microsoft. This
    serves to provide quality-of-life changes to the way programmers can code things.
    We are given the capability to replace tedious and monotonous processes with automated
    Wizards, macros, and templates that we can create and use ourselves. These macros
    are extremely flexible owing to an extensibility model that lets you customize
    every detail of Visual Basic .NET. This chapter will not go over every detail
    that you can customize, but rather how to create objects such as Wizards and macros
    yourself, providing you with practical information that you can apply and develop
    yourself.In this chapter, we will create project templates. Specific topics we
    will cover are:


    *   Creating Custom Wizards using IDTWizard.


    *   Creating a custom-fit Project Template.


    *   Registering your Wizards and Testing them.


    *   Writing Macros, using Macros IDE


    Making a WizardA Wizard , colloquially, refers to a series of dialogues that are
    fed information to create a result. These structures have become immensely popular
    thanks to Windows, and the above definition is a result of that fame. Another
    more accurate definition is that a Wizard is a series of linear subprograms, as
    compared to spatial-based programming that existed at the time. The advantage
    that the linear model offers is that it reduces the accessibility of the program
    at a given step, which is beneficial in cases such as outcome-based tasks.An esoteric
    definition for programmers is that a Wizard is an application or subprogram that
    breaks down a task or goal into multiple steps for the user to follow and complete,
    which is accomplished using IDTWizard. The user’ interaction with the Wizard is
    very easy and they only need to click a Next button to continue most of the time.
    Developers have a harder time selecting a Wizard, since all of the back-end needs
    to be reformulated in order to compress the commands into one button press. However,
    it’s actually quite simple to use IDTWizard to create a Wizard, and the artistic
    vision of the programmer can be implemented into the console.The following piece
    of code is a basic introduction to using IDTWizard to make a Wizard. A more advanced
    example is also provided later in this chapter.


    | using System;using EnvDTE;using System.Windows.Forms;namespace HelloWizard{public
    class HelloWizard : IDTWizard{public void Execute(object Application,int hwndOwner,
    ref object[] ContextParams,ref object[] CustomParams, ref WizardResult retval){MessageBox.Show("Hello
    Wizard");retval = EnvDTE.WizardResult.WizardResultSuccess;}} |'
