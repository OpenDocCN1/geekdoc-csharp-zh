  trans: "\n\n作为最后的说明，如果没有需要处理的异常，请不要使用异常处理结构。这有助于清理代码并保持其简洁。\n\n## 创建 TODO 列表\n\n\
    在 Visual Studio .NET 中，你可以使用注释标记（comment tokens）来添加提醒性注释或标题，这些标记是特殊的关键字。这些标记关键字包括\
    \ `TODO` 以及我们定义的任何其他关键字。要使用它们，请将它们紧跟在你的双正斜杠注释标记（` //`）之后。这会将注释置于任务列表中。我们可以在 Visual\
    \ Studio 环境中通过进入 `View > Show Tasks > All` 或 `View > Show Tasks > Comment` 来查看此任务列表。要创建自定义标记，请在\
    \ `Options` 列表或 `Environment > Task List` 页面中定义它们：\n\n以下代码演示了对之前 `ImageButton`\
    \ 类代码的更新，其中我们记得使用注释对其对其了编辑。我们将添加删除类中 `Image` 属性的能力，这是通过为其分配一个 `DefaultValueAttribute`\
    \ 实现的。\n\n```csharp\npublic class ImageButton : DarkButton2 {\n    private Image\
    \ graphic = null;\n    public ImageButton()\n    {\n    }\n    protected override\
    \ Color Getcolor() {\n        Color[] colors = {Color.MidnightBlue, Color.Black};\n\
    \        return colors[Convert.ToInt32(down)];\n    }\n    private int GetX()\
    \ {\n        return (Width - graphic.Size.Width) / 2;\n    }\n    private int\
    \ GetY() {\n        return (Height - graphic.Size.Height) / 2;\n    }\n    private\
    \ ImageAttributes GetImageAttribute() {\n        ImageAttributes attribute = new\
    \ ImageAttributes();\n        attribute.SetcolorKey(Color.White, Color.White,\
    \ ColorAdjustType.Default);\n        return attribute;\n    }\n    private Rectangle\
    \ GetRectangle() {\n        return new Rectangle(GetX() + 1, GetY() + 1, graphic.Size.Width,\
    \ graphic.Size.Height);\n    }\n    protected override void DrawGraphic(Graphics\
    \ graphics) {\n        base.DrawGraphic(graphics);\n        if( graphic == null\
    \ ) return;\n        graphics.DrawImage(graphic, GetRectangle(), 0, 0, graphic.Size.Width,\
    \ graphic.Size.Height, GraphicsUnit.Pixel, GetImageAttribute());\n    }\n    [DefaultValue(null)]\n\
    \    public Image Graphic {\n        get {\n            return graphic;\n    \
    \    }\n        set {\n            graphic = value;\n            Invalidate();\n\
    \        }\n    }\n}\n```\n\n问题在上述代码的第 52 行得到解决。完成后，记得从你的代码中移除 `TODO` 标记。使用注释的一个技巧是添加自定义标记，以分类某事属于什么类型的问题，以及应该如何处理。\n\
    \n## Process 类\n\n在书中之前的章节中引入的 `Process` 类用于实际接收触发其余代码运行的动力。`Process.Start` 是附加到\
    \ `PlayControl` 界面上左侧 `ImageButton` 控件的 `Click` 事件处理程序的静态方法。\n\n## COM Interop\n\
    \nCOM Interop（为了互操作性）是 .NET 语言中的一个概念，它在 .NET 环境中使用 COM 库和控件，因为 .NET 在程序集中中使用 `Reflection`\
    \ 和元数据来达到相同的目标。这些概念在之前的章节中也解释过，如果你想回顾可以可以查看。\n\n以 `VideoKiosk.sln` 中的 ActiveX\
    \ Media Player 为例。这是一个基于 COM 的控件，为了使用它，我们需要通过从 `Toolbox` 菜单选择 `Customize Toolbox`\
    \ 将这些控件导入到我们的 .NET 工具箱中。这将导入 COM 控件的类型库，并允许在 .NET 环境中使用它们。当然，这有一个前提：你将使用过时的 COM\
    \ 结构，你还需要创建一个安装程序来注册这些命令和方法。\n\n总结我们在本章到为止的讨论，GDI+ 是 Windows 强大的 GDI 工具包的改进和精简化，由于\
    \ .NET 的出现以及新方法和结构的添加，使其处理变得更加容易和宽容。GDI+ 用于成像、排版和矢量图形。GDI+ 使用的结构是无状态的，需要持续的信息流。使用\
    \ `CreateGraphics` 创建 `Graphics` 对象，或者获取 `Paint` 事件处理程序接收的对象。\n\n## 第四章：个性化 Visual\
    \ Studio .NET 环境\n\n微软对 Visual Studio 的代码自动化能力投入了大量的资金和研究。这是为了改善编程体验。我们可以使用自己创建并使用的自动化向导、宏和模板来替换枯燥单调的过程。由于扩展性模型（该模型允许你自定义\
    \ Visual Basic .NET 的每一个细节），这些宏非常灵活。本章将不会介绍你可以自定义的每一个细节，而是介绍如何自己创建向导和宏等对象，为你提供可以自己应用和开发的实用信息。\n\
    \n在本章中，我们将创建项目模板。我们将涵盖的特定主题包括：\n\n*   使用 `IDTWizard` 创建自定义向导。\n*   创建定制的项目模板。\n\
    *   注册你的向导并对其进行测试。\n*   使用 `Macros IDE` 编写宏。\n\n## 创建向导\n\n通俗地说，`Wizard`（向导）是指一系列输入信息以创建结果的对话框。感谢\
    \ Windows，这些结构变得非常流行，上述定义正是这种成名的结果。另一个更准确的定义是 `Wizard` 是系列线性子程序，与当时存在的基于空间的编程相比。线性模型提供的优势是降低了程序在给定步骤的可访问性，这在基于结果的任务等情况下是有益的。\n\
    \n对于程序员来说，一个深奥的定义是 `Wizard` 是一种应用程序或子程序，将任务或目标分解为多个步骤供用户遵循并完成，这是通过 `IDTWizard`\
    \ 实现的。用户与 `Wizard` 的交互非常简单，大多数时候只需要点击 `Next` 按钮即可继续。开发者选择 `Wizard` 比较困难，因为所有的后端内容都需要重新制定，以便将命令压缩到一个按钮按下中。然而，使用\
    \ `IDTWizard` 创建 `Wizard` 实际上非常简单，程序员的艺术愿景可以实现在控制台中。\n\n以下代码段是关于使用 `IDTWizard`\
    \ 创建 `Wizard` 的基础介绍。在本章稍后的部分还提供了一个更高级的示例。\n\n```csharp\nusing System;\nusing EnvDTE;\n\
    using System.Windows.Forms;\nnamespace HelloWizard{\n    public class HelloWizard\
    \ : IDTWizard{\n        public void Execute(object Application,int hwndOwner,\
    \ ref object[] ContextParams,ref object[] CustomParams, ref WizardResult retval){\n\
    \            MessageBox.Show(\"Hello Wizard\");\n            retval = EnvDTE.WizardResult.WizardResultSuccess;\n\
    \        }\n    }\n}\n```\n\n"
- fmt: "\nAs you can see, a functional definition of a Wizard is a class that implements\
    \ the `IDTWizard` interface, as defined in `EnvDTE`. There is only one method\
    \ defined in `IDTWizard`: `execute`. Putting in the rest is up to the programmer,\
    \ as is testing if it works.\n\n## A Wizard Project\nWizards are basically a collection\
    \ of classes, so to make one we’ll need to create a class library. To start making\
    \ a `Class Library Project`, go to the New Project dialog, select the `Class Library`\
    \ template, name your project, and press `OK`. You’re now on your way to making\
    \ your own Wizard.\n\n## Using IDTWizard\nTo use `IDTWizard` to make your Wizard\
    \ you will need to reference the design-time environment, i.e. Visual Studio .NET’s\
    \ extensibility model. To do so, add a reference to the `envdte.dll` assembly\
    \ to the project’s references and refer to the library with the keyword.\n\n![](image_rsrc31C.jpg)\n\
    \nThere is only one function in `IDTWizard`, `Execute`, and it must be provided\
    \ an array of context, an array of custom parameters for it to use, an owner handle,\
    \ and a return value that uses a pass-by-reference modifier.\n\n### Pass-By Referencing\n\
    We need to create a method that returns a value of a datatype other than `void`.\
    \ The parameter that this method returns can also be given the keyword `ref` to\
    \ allow it to return multiple values, by virtue of them being able to be affected\
    \ by the caller. Equivalents to `ref` in other languages include passing pointers\
    \ in `C++`, `ByRef` in VisualBasic .NET, and `var` in Delphi. An example code\
    \ will describe this method below.\n\n## Testing the Wizard\nAfter adding your\
    \ functionality to the Wizard, you can run it to find out if it works. The Singleton\
    \ object `DTE` contains a method called `LaunchWizard`, which does exactly that\
    \ (specifics are given later in the chapter). The next listing of code is a macro\
    \ for testing the HelloWorld Wizard we made earlier, and the one after that is\
    \ an example of stuff that you can put in a Wizard.\n\n```vbnet\nImports System\n\
    Imports EnvDTE\nImports System.Diagnostics\nPublic Module Module1\n    Public\
    \ Sub Test()\n        Const Path As String = _\"C:\\Temp\\HelloWizard.vsz\"\n\
    \        Debug.WriteLine(\"This is running!\")\n        Dim ContextParams(1) As\
    \ Object\n        ContextParams(0) = Nothing\n        DTE.LaunchWizard(Path, ContextParams)\n\
    \    End Sub\nEnd Module\n```\n\nThis macro can be found in Macro IDE: go to Tools\
    \ > Macros > Macros IDE to open the menu. Now we need to create a Wizard launch\
    \ file. This launch file has the extension `.vsz` and has the same name as the\
    \ Wizard’s class library.\n\n```ini\nVSWIZARD 7.0\nWizard=HelloWizard\nHelloWizardParam=<Nothing>\n\
    ```\n\nPlace this code in a file named `HelloWizard.vsz`, and place the file in\
    \ the same directory as the `HelloWizard.dll`. `HelloWizard.dll` has been registered\
    \ using `regasm.exe`, a Visual Studio .NET utility. The process of registering\
    \ your Wizards will be explored later in the chapter.\n\n## Creating a Project\
    \ Template for Visual Studio .NET Wizards\nVisual Studio .NET contains a lot of\
    \ methods, tutorials, templates, etc. to help you create all kinds of projects.\
    \ It does not, however, have a template for a Wizard. We will show you how to\
    \ create a template yourself that you can then access using the New Project dialog.\n\
    \nVisual Studio .NET contains a basic Wizard called `VsWizard.dll` that you can\
    \ use to create project templates. It can be found in `…/Microsoft Visual Studio\
    \ .NET/Common7/IDE/VsWizard.dll`. This wizard uses sample files, scripts, and\
    \ other inputs to create a project from a predefined template. Thus, we can use\
    \ it to create a template which saves us from writing another engine to do so,\
    \ but we also need to feed it a set of rules, files, and samples to follow. Our\
    \ process for creating a project template includes, in no particular order, the\
    \ following steps:\n\n*   Find and use a pre-existing template that is as close\
    \ to our goal template as possible. We will use the `Class Library` template,\
    \ since a Wizard is already a class library or DLL.\n*   Modify the pre-existing\
    \ template by adding new files. For our Wizard we’ll need to add a `.cs` file,\
    \ containing a class that uses `IDTWizard`. We can use our `HelloWizard` code\
    \ for this.\n*   Update the `templates.inf` list that contains the files used\
    \ by our new template.\n*   Rewrite `common.js` (`.js` being Jscript .NET), a\
    \ structure containing generic methods used by `VsWizard.dll`. We will need to\
    \ add code to it, in order to make a Class Library project that references `envdte.dll`.\n\
    *   Rewrite `default.js` to include our template’s generic methods.\n*   Add an\
    \ icon for our template.\n*   Modify the `VsWizard.dll` launcher so that it is\
    \ associated with our template.\n*   Update `VSDir` to contain our project template,\
    \ so that it shows in the New Project Dialog.\n\nThis process is, admittedly,\
    \ quite tedious, but this is a generic and therefore extensible list, which can\
    \ be used to create any project template that you would like. The following sections\
    \ will expand upon this checklist, along with how to complete the task that each\
    \ asks of you, and a further description of the process. We will also follow the\
    \ checklist in order.\n\n## Creating a New Template from a Pre-Existing Template\n\
    Project templates are the methods represented by the icons in the New Project\
    \ dialog. You can also create an entire template from scratch as a text file,\
    \ but this is easier. Take care to consider what project template you will base\
    \ yours off as different versions of Visual Studio have different templates.\n\
    \nTo create a template, select one close to yours, which in our case the `Class\
    \ Library` template. To access this template, go to `…Files\\Microsoft Visual\
    \ Studio .NET\\VC#\\VC#Wizards`. Here, the Class Library is represented by `CSharpDLLWiz`.\
    \ Follow the below steps in order to create a new template using this one.\n\n\
    *   Copy the library folder to the same directory, which will name it “Copy of\
    \ CSharpDLLWiz” by default.\n*   Name it whatever you want. We recommend naming\
    \ this folder `CSharpDLLWizWiz`, keeping the convention.\n\nThese folders have\
    \ a `Scripts` and `Templates` subdirectory that contains a language identifier.\
    \ For English users, this identifier is most likely in `1033`. The `scripts\\\
    1033` folder contains the template’s `default.js` file, which we will learn to\
    \ modify later. The `templates\\1033` folder contains actual code files that the\
    \ engine will use to create a template. We will discuss how this works just after\
    \ this section. Remember that right now these are still just the same files from\
    \ the Class Library template.\n\nYour folder should start to look something like\
    \ this:\n\n```text\n..\\Microsoft Visual Studio .NET\\VC#\\VC#Wizards\\CSharpDLLWizWiz\\\
    Scripts\\1033\\default.js\nCSharpDLLWizWiz\\Templates\\1033\\assemblyinfo.cs\n\
    file1.cs\nTemplates.inf\n```\n\n## Adding Files to the Wizard Library Template\n\
    We can add files that we want for our template to `Templates\\1033\\`. For now,\
    \ we don’t need to add any such file and we can simply use the existing contents.\
    \ We do, however, need to change the `file1.cs` file here so that it contains\
    \ code for a Wizard template. It would look something like this:\n\n```csharp\n\
    using System;\nusing EnvDTE;\nnamespace [!output SAFE_NAMESPACE_NAME]\n{\n   \
    \ /// <summary>\n    /// Summary description for [!output SAFE_CLASS_NAME].\n\
    \    /// </summary>\n    public class [!output SAFE_CLASS_NAME] : IDTWizard\n\
    \    {\n        public [!output SAFE_CLASS_NAME]()\n        {\n            //\
    \ TODO: Add constructor logic here\n        }\n        public void Execute(object\
    \ Application, int hwndOwner, ref object[] ContextParams, ref object[] CustomParams,\
    \ ref wizardResult retval)\n        {\n            // TODO: Add your custom code\
    \ here\n            // retval = EnvDTE.wizardResult.wizardResultSuccess;\n   \
    \     }\n    }\n}\n```\n"
