    computers is familiar with the term ‘Status Bar .’ Generally, the purpose of a
    status bar is to display the progress of anything, and these status bars are usually
    present in an application. For example, take an installation wizard application.
    When you click the ‘install ’ button (which is also a form control if you hadn’t
