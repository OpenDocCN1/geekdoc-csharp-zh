    ## 4. 内部访问修饰符 (Internal)

    成员和类型访问修饰符指定为‘internal’的类，其访问权限仅限于它们所在的程序集（assembly）。通过这种方式，任何外部都无法访问这些类，但代码可以与这些类的成员和类型进行通信。


    ## 5. 保护内部修饰符 (Protected Internal)

    这种访问修饰符基本上是在 internal 修饰符的基础上加上 protected 修饰符的结果。就像保护 访问修饰符通常用于嵌套类一样，protected
    internal 修饰符也大多用于嵌套类型。只有程序集对保护 internal 修饰符中的嵌套类成员具有无限制的访问权限。


    然而，在使用访问修饰符时，你需要遵循一些规则以避免产生错误。


    - 每当你定义高层类型时，其访问修饰符必须指定为‘Public’。否则，当其他类型需要与高层类型通信时，一定会引起麻烦。如果你不想使用‘Public’访问修饰符，你唯一的其他选择就是使用‘Internal’访问修饰符。

    - 每当你处理嵌套类或类型时（在嵌套类中，一个类包含另一个类；类似地，嵌套类型是一个持有另一个类型定义的类型），你必须在使用‘Private’访问修饰符或‘Protected’访问修饰符之间做出选择。

    - 尽管‘Protected Internal’是两个访问修饰符（protected 和 internal）的组合，但强烈建议不要这样组合任何其他访问修饰符。

    - 如果类或类型没有指定任何访问修饰符，则将为相应的成员赋予‘默认访问授权’，但不建议依赖此。生产者应该始终指定适当的访问修饰符。


    在类和成员上使用修饰符的概念在我们讨论访问修饰符时，已经以某种方式讨论过了。无论如何，如果你发现定义的类被封装在命名空间（namespace）中，最好将它的访问修饰符设置为‘Public’或‘Internal’。在处理嵌套类时，你可以用于定义它们的访问修饰符选项是有限的。这些选项包括‘protected、protected
    internal 或 private’访问修饰符。成员赋予了生产者为其分配任何访问修饰符的自由。如果你不指定任何访问修饰符，它将默认设置为 private。


    ### 反射 (Reflection)

    这基本上是一种在 .NET Framework 中广泛使用的功能。通过使用‘reflection’，用户可以探索程序的程序集以提取代码中的数据，这些包括：


    - 命名空间 (Namespaces)

    - 接口 (Interfaces)

    - 类 (Classes)

    - 方法 (Methods)

    - 属性 (Properties)

    - 字段 (Fields)


    此外，反射是一个极其有用的对象函数，允许用户：


    - 在程序运行时执行‘IL ’（中间语言）代码。

    - 使用特殊方法查看记录在特性（attributes）中的元数据值。

    - 开展一些侦查工作，例如，探索在相应程序集中定义的类型并发现成员。


    ## 第 2 章：使用程序集查看器 (Assembly Viewer) 和用户控件 (UserControls)

    在上一章的最后部分，我们简要地讨论了面向对象的函数‘Reflection’。本章扩展了讨论，允许读者探索‘Reflection’的实际用途，以检查程序集内包含的数据。本章的核心概念基于动态加载程序集并使用反射通过程序集查看器探索该程序集。这里的主要收获是，理解加载程序集和使用它们的过程具有巨大的潜在益处。例如，我们可以使用
    HTTP 连接无线加载程序集，通过对客户端进行轻量级编程，我们可以自动化两个任务：


    - 部署基于‘Windows-Forms’框架的应用程序。

    - 基于 Windows Forms 为这些应用程序发布更新。


    除此之外，我们还将在本章中探索许多其他主题，例如创建和声明静态方法、使用如 `IEnumerator` 等接口，以及实际演示继承的使用。最后，我们还将探索
    UserControls 的功能，以创建你在许多 Windows 应用程序中看到的按钮、图标和操作。


