    # 注册向导


    向导需要访问注册表（Registry`），但不需要是全局程序集缓存（或 `GAC`）的成员。为此，我们可以使用 `regasm` 如下方式对其进行注册：


    ```c:\winnt\Microsoft.NET\v1.0.3705\regasm c:\temp\TypedCollectionWizard.dll /codebase

    ```


    这是 .NET 框架的默认路径。如果 `c:\temp` 处有不同的目录，请使用该目录。`/codebase` 使用 `file://` 将这些路径存储在注册表中。再次强调，向导仍然是一个
    .NET 结构，仅访问注册表。它不是一个 COM 组件。在章节末尾会有相关说明。


    简单来说，`GAC` 是机器上所有使用的程序集的缓存。向导并不是该列表的永久部分，因此不需要注册。`GAC` 实际上是一个包含并分类了程序集以方便使用的巨型文件夹。我们建议查看一个名为
    `GACutil.exe` 的 .NET 工具。


    ## 使用宏测试向导


    让我们使用在章节开头创建的宏来测试我们的向导。将宏的 `constPath` 变量替换为 `TypedCollectionWizard` 的地址并运行它。


    ## 从命令行窗口运行向导


    我们可以使用上一节中的宏从命令行窗口运行向导。选择 `View > Other Windows > Command Window`（视图 > 其他窗口 >
    命令行窗口）。我们创建了一个名为 `MyMacro` 的测试宏，将其存储在名为 `Module1` 的模块中，并将内部的方法命名为 `TestCollectionWizard`。结合这一切，我们通过此行代码调用向导：


    ```Macros.MyMacros.Module1.TestCollectionWizard

    ```


    当你通过 `Intellisense` 输入单词 `Macros` 时，会弹出命令列表。


    ## 次要话题


    本章介绍了各种工具和概念，如 `JScript`、`gacutil.exe`、`regasm.exe` 等。这些结构拥有丰富的文档，有对这些概念进行更深入的介绍：


    ### 回 JScript


    我们使用了一些 `JScript` 来实现模板，这是调用外部编译器完成的。然而，与 `Visual Basic .NET` 和 `C#` 相比，`JScript`
    是完全不同且同样的语言。你可能会在网页的客户端代码以及 `ACT`（微软开发的一种测试自动化应用）等处发现用这种语言编写的代码。以下清单描述了如何编写一些
    `JScript` .NET 代码。


    *   打开 `NotePad`（记事本）。

    *   编写 `print("Hello World!")`。

    *   将此文件保存为 `HelloWorld.js`，并记住它的目录。关闭文件。

    *   打开命令提示符，通过如下调用编译器运行文件：


    ```c:\winnt\Microsoft.NET\Framework\V1.0.3705\jsc Hello.js

    ```


    ### 使用 regasm 工具


    向导是 Visual Studio .NET 的部分，通过 `COM` 附加到它。为此，我们使用 `regasm` 工具。最有效的两种形式是：


    ```regasm assemblyname /codebase

    ```

    ```regasm assemblyname /unregister

    ```


    1. `regasm` 仅指该工具。`assemblyname` 是包含向导 DLL 的程序集名称。`/codebase` 将代码添加到注册表。从技术上讲，这是完成调用所需的所有内容，尽管它提供了一个警告，建议使用强名称（例如通过
    `sn.exe`）以避免版本问题。

    2. 与上述类似，但它使用 `/unregister` 从注册表中注销向导。


    向导并不使用 `COM`。需要将 DLL 注册到注册表中以便将其加载到 Visual Studio .NET 环境中。执行：


    ```regasm assemblyname /regfile:regfile

    ```


    其中 `assemblyname` 指你的程序集，而第二个 `regfile` 指扩展名为 `.reg` 的文件。


    ## 结论


    编程与十年前相比已经取得了长远的进步，并且继续以指数级速度增长和发展。我们开发了诸如异常处理器之类的工具，对于我们可以想象的几乎每种情况都有应急计划。


    正如我们所提到的，编程领域正在以极快的速度膨，一个人精通编程的一切正变得越来越不可能。专业化现在是常态，因为一个人不可能了解各方面的一切。仅仅在这一章中，我们就触及了三种大型语言——`Visual
    Basic .NET`、`JScript`（或 JavaScript）、`C#` 以及实用程序 `GACutil.exe` 和 `regasm.exe`。现在的程序员只需要对底层概念有基本的了解，但需要选择这些领域之一。他们。可以专注于游戏开发、网页设计，甚至是更具实用性的应用/软件编程。任何你能想象到的。


    基于现代计算机的强度以及它们在给定规则下理解概念的速度，自动化也开始成为程序员（以及整个人类）的一个真正问题。在需要智力和复杂决策的游戏中，例如国际象棋、中国围棋和
    `DotA 2`，使用高级自动化来重复过程和开发最佳策略的程序早已超过了人类的能力。现在，编程可以交给程序本身了。


    我们现在走到了旅程的终点。尽管你可能觉得 `C#` 有些困难，有时理解起来令人沮丧，无论如何，你都增加了自己的编程知识。在编程世界中，经验是你能找到最好的老师。虽然我们已尽力为你提供对概念和高级话题的充分解释，但你可能仍然觉得缺少了什么。如果是这样，说明你正处于学习的正确道路上。你任何觉得模糊的地方都将成为研究特定话题的动力，使你接触到更多事物，引发多米诺效应。书中的每一章都试图在某种程度上涵盖
    `C#` 编程的所有方面，然而，完全掌握 `C#` 的每一个高级编程元素已超出本书范围。因此，为读者提供 `C#` 编程最重要的核心信息（即使不是完整的包）是重要的。强烈建议你研究那些让你困惑的方面，这将帮助你在一个其他情况下无法实现的水平上澄清概念。


    简而言之，我们在第一章中探索了面向对象编程的基本原理，并学习了 `C#` 如何通过各种函数实现这些原理。在接下来的章节中，我们发现了 `C#` 编程的扩展功能，例如使用
    .NET 框架中的 `Reflection` 函数从程序集中提取信息并使用它们。最后，我们转向了真正高级的 `C#` 编程话题，如使用 `GDI+`、处理
    `Visual Studio .NET` 和事件日志器，最后重要的是理解如何有效使用 `UserControls` 来创建应用程序的界面。所有这些话题共同定义了
