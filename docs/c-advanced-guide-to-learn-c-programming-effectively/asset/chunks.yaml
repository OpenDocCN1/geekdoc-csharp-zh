  raw: '4.  Internal Access Modifier : a class whose members and types have their
    access modifier specified to ‘internal ’ have their access restricted only to
    the assembly in which they are present. In this way, any external will not be
    able to access these classes, or members and the code will be able to communicate
    with the members and types of classes.


    5.  Protected Internal Modifier : this access modifier is basically the result
    of slapping the protected modifier on top of the internal modifier. Just as how
    a protected access modifier would generally be used in nested classes, the protected
    internal modifier is mostly used with nested types as well. Only the assembly
    has unrestricted access to the members of the nested classes in a protected internal
    modifier.


    However, there are some rules you need to follow when using access modifiers in
    order to avoid generating errors.


    *   Whenever you are defining a high-tier type, its access modifier must always
    be specified to ‘Public.’ Otherwise, it will surely cause complications when other
    types need to communicate with the high-tier type. If you do not want to use the
    ‘Public’ access modifier, then the only other option you have is to use the ‘Internal’
    access modifier.


    *   Whenever you are dealing with nested classes or types (in a nested class,
    a class contains another class. Similarly, a nested type is a type that holds
    the definition of another type), you have to choose between either using the ‘Private’
    access modifier or the ‘Protected’ access modifier.


    *   Even though ‘Protected Internal’ is a combination of two access modifiers
    (protected and internal), it is highly advised to avoid combining any other access
    modifiers in this way.


    *   If a class or a type is not specified with any access modifier, then a ‘default
    access authorization’ will be given to the corresponding members, but it is not
    recommended to rely on this. Producers should always specify the appropriate access
    modifier.


    The concept of using modifiers with Classes and Members has already been discussed
    in one way or the other when we talked about access modifiers. Regardless, if
    you find that the class you have defined is enclosed within a namespace, it is
    best to set its access modifier to either ‘Public’ or ‘Internal.’ When working
    with nested classes, your options are limited as to which access modifiers you
    can use to define them. These options include ‘protected, protected internal or
    private’ access modifiers.Members give the producer the freedom of assigning any
    access modifier to them. If you do not specify any access modifier, then it will
    be set to private by default.ReflectionThis is basically a functionality that
