  trans: "\n\n- 继承特征的类是父类，而继承这些特征的类是子类。例如，如果 `Class Y` 继承了 `Class X` 的成员，那么 `X` 就是父类，`Y`\
    \ 就是子类。\n- 如果 `class Y` 继承了 `class X` 的成员，那么 `class X` 被称为 `superclass`（超类），`class\
    \ Y` 被称为 `subclass`（子类）。\n- `Inheritance`（继承）有时也被称为 `generalizing`（泛化）。\n- 如果继承关系有多个子类，那么每个子类之间的关系被称为\
    \ `siblings`（兄弟关系）。因此，多个从同一个超类继承成员的类被称为 `siblings`。\n\n这里有一个使用继承特性的示例，其中多个类都继承了\
    \ `Radio Class` 的成员，在这种情况下，该类被用作父类。\n\n```csharp\npublic interface IAudio {\n\
    \    void AdjustVolume(int value);\n}\npublic class Radio : IAudio {\n    private\
    \ int volume = 0;\n    void IAudio.AdjustVolume(int value) {\n        volume +=\
    \ value;\n    }\n    public int Volume {\n        get { return volume; }\n   \
    \     set { volume = value; }\n    }\n    private double station = 94.1;\n   \
    \ public double Station {\n        get { return station; }\n        set { station\
    \ = value; }\n    }\n    public void Receive() {}\n}\npublic enum RadioBand {\
    \ AM, FM}\npublic class AMFMRadio : Radio {\n    private int volume = 0;\n   \
    \ void IAudio.AdjustVolume(int value) {\n        volume += value;\n    }\n   \
    \ public int Volume {\n        get { return volume; }\n        set { volume =\
    \ value; }\n    }\n    private double station = 94.1;\n    public double Station\
    \ {\n        get { return station; }\n        set { station = value; }\n    }\n\
    \    public void Receive() {}\n}\n```\n\n这对于你来说可能有点困惑，因为这里发生了多处继承，但核心概念仍然保持不变。在这个示例中，我们有一个父类（超类）`Radio`\
    \ 和两个子类（子类）`CommunicationsRadio` 和 `AMFMRadio`。这些兄弟类继承了父类的重要成员，以执行它们特有的功能。对于 `CommunicationsRadio`\
    \ 类，目的是启用发射和接收无线电信号的功能；对于 `AMFMRadio` 类，则是支持不同的无线波段，即调幅波段（AM）和调频波段（FM）。\n\n###\
    \ 封装与聚合\n`Encapsulation`（封装）和 `Aggregation`（聚合）都表示一个类（或任何数据结构）填充成员的倾向，但这两个术语并不等同。虽然封装指的是一个类将成员保留在类内部的倾向，但聚合则包含了那些本身也是类（或数据结构）的成员。如果封装的概念仍然让你感到困惑，可以考虑一个类比。想象一个带有小隔层存放药片的小盒。药物被\
    \ `encapsulated`（封装）在药盒中。在这个类比中，`medicine` 实际上是 `class`，它拥有方法、函数和对象，而药盒代表了 `encapsulation`\
    \ 方法。通过使用封装和聚合，我们本质上可以将数据放入类中，同时控制访问这些数据的权限。通过封装，我们可以添加简单的数据类型和结构；通过聚合，我们可以在类内部添加更复杂的数据类型和结构。\n\
    \n然而，我们不能仅仅将数据随机丢进类中。我们需要思考哪个类是存储数据的最佳容器。实现一种方法是查看可用的类列表，并确定哪一个是最合适的竞争者，即哪个类本质上负责持有特定类型的数据。例如，如果我们把人肺视为\
    \ `data`（数据），那么将它们放在 `human body (class)` 中会比放在植物（另一个类）中更符合逻辑。\n\n让我们使用 `Radio`\
    \ 类来探索如何实现 `Encapsulation` 和 `Aggregation`。\n\n```csharp\npublic class BoomBox\
    \ {\n    private AMFMRadio radio;\n    public AMFMRadio Radio {\n        get {\
    \ return radio; }\n    }\n    BoomBox() {\n        radio = new AMFMRadio();\n\
    \    }\n}\n```\n\n在这个代码块中，我们正在处理一个之前没有用过的类，名为 `BoomBox`。有趣的地方在于，这个类实际上包含了 `AMFMRadio`\
    \ 类。因此，`AMFMRadio` 类代表了封装以及聚合的过程。\n\n### 多态\nC# 中 `Polymorphism`（多态）的概念其实并没有那么复杂。当程序员遇到一个可以由任何通用\
    \ `provider`（提供者）处理的问题时，基本上涉及到多态。但这里的关键在于，提供者必须是更大提供者集合的一部分。这意味着无论我们从集合中选择哪一个提供者，都可以解决这个问题。这被称为\
    \ `Polymorphism`，但仅从这个角度理解多态可能对你没有帮助，所以让我们采取更具技术的方法。\n\n首先，取一个类并将其声明为通用类型。当我们对类进行泛化时，它本质上继承了其父类（超类）的类型。如果我们想取这个类创建多个实例，并希望类的每个实例都具有特定类型，我们就指定一个而不是通用类型，这就是我们的\
    \ `problem`（问题）。这种被称为 `problem` 的想法可能看起来很傻，但它是为了帮助你理解 `polymorphism` 的概念。我们可以通过从不同的\
    \ `types`（类型）中选择一种类型来解决这个问题。选择任何一个类型都能解决问题，但我们仍然有广泛的选择。这就是 `polymorphism`，即我们先声明一个通用类型的类，然后声明带有特定\
    \ `types` 的实例。这种现象在 `EventHandler` 委托的工作中可以很容易观察到。该委托的指令方式使得其初始参数将是一个对象。因此，持有对象的类将被视为根。\n\
    \n### 访问修饰符、类和成员修饰符\n让我们先讨论 `Access Modifiers`（访问修饰符）。简单来说，访问修饰符定义了类的用户可以看到和访问的内容。如果类的访问修饰符设置为\
    \ `private`，那么消费者将无法看到类，更不用说尝试访问它。如果访问修饰符设置为 `public`，那么消费者就能看到该类，并访问其内容对其进行更改。访问修饰符的实际用途是在用户的编程过程中引导他们。如果有人在代码中使用你的类，那么将那些不需要消费者关注的类保持为\
    \ `private`，可以将注意力主要集中在生产者保持为 `public` 的类上。通过这种方式，生产者确保消费者只会碰那些为了使用它们而需要交互的类。\n\
    \n在 C# 中，总共有五种可以使用的访问修饰符。这些修饰符列如下，并附有简单的解释。\n\n1. **Public Access Modifier**（公共访问修饰符）：该修饰符赋予最终用户访问相应类成员的自由（这也包括类中的\
    \ `types`）。\n2. **Protected Access Modifier**（受保护访问修饰符）：该访问修饰符通常用于嵌套类（类内部的类）。因此，子类（subclasses）将能够访问父类（superclass）以及嵌套内部的其他类，但不会赋予消费者相同的访问权限。相反，他们被限制无法访问嵌套类的成员。\n\
    3. **Private Access Modifier**（私有访问修饰符）：类中任何具有私有访问修饰符的成员都无法被创建该类的之外的任何子类或其它用户访问。\n\
    \n"
