    ## Introduction

    Object-oriented programming is like a rabbit hole; once you start to explore it,
    the tunnel only seems to get deeper and deeper. This is especially true because
    of the family of programming languages whose cores are based on object-oriented
    techniques and principles. `C++`, `C`, `Java`, `Javascript`, `PHP`, `Visual Basic`,
    `Microsoft .NET`, `Ruby`, `Scala`, and a bunch of other programming languages
    are all classified as ‘OOPL’ (Object-Oriented Programming Languages). In this
    language family, `C#` is similar to that sibling who is difficult to get along
    with but incredibly resourceful. `C#` is alluring and fascinating to some people,
    while to others, it is a real hassle to learn and work with this language, but
    none of these two people at the opposite ends of the spectrum are to blame.


    People familiar with mainstream OOPL, such as `C++`, will find that `C#` has all
    those bells and whistles that you would find in other object-oriented languages,
    ultimately making it easier to learn `C#`, but even with these similarities, the
    implementation of the same techniques, tools, and concepts are radically different,
    and on top of that, `C#` does not have one defined IDE, anyway. At the same time,
    you can argue that no programming language has one IDE that’s better than the
    rest. Still, in the case of `C#`, the result is an inconsistency in the programming
    experience, not the case for other languages. Hence, trying to teach the reader
    a universal set of techniques and practices is quite literally impossible. Even
    the fundamental concepts may be different, even though you may be familiar with
    them from other object-oriented languages.


    For this very reason, the first chapter of the book is essentially a review of
    the most important programming concepts in `C#`. In this way, since all the readers
    will likely read this chapter before moving on, everyone will have the same idea
    of the concepts that are being explained and used in the upcoming chapters. This
    is very important because literally, every discussion being made after chapter
    1 builds upon the concepts that are highlighted at the very beginning. Even if
    the reader already knows about all the concepts discussed in the first chapter,
    the chapter itself does not become useless because it will still serve as an opportunity
    to review the knowledge that they already possess. If there’s something that is
    not clear or is ambiguously explained, then do a brief web-search. There’s a high
    chance that you might just need some detail to understand what’s being discussed.


    ## Chapter 1: Getting Familiar with the Foundations of C#

    This chapter will provide the reader with an overall review of the most important
    concepts in `C#`. This is necessary because the upcoming chapters will build upon
    the things we review here. This allows the readers to become familiar with the
    idioms commonly used in advanced `C#` programming. In this way, this chapter hopes
    to get the readers on the same page before we move on with advanced programming
    techniques and projects in the latter half of this book. However, if you already
    have experience with object-oriented programming languages like `Java`, `Javascript`,
    `C++`, `PHP`, `Visual Basic .NET`, etc., you might think this chapter will probably
    not be worth your time, but this chapter will prove to be a really useful checkpoint
    where you can review the concepts you are familiar with. On the other hand, most
    readers picking up this book will find this chapter to disclose certain aspects
    of not only `C#` but also `.NET` programming that they were unaware of. In short,
    the content here will provide the readers with foundations necessary for understanding
    the discussion of `C#` programming to create advanced applications throughout
    the course of this book.


    ## The Essentials of an Object-Oriented Programming Language

    There is a set of fundamental elements that form the core of the language itself
    in any object-oriented programming language. These elements are generally known
    as the object-oriented basics, but this title is quite misleading as these “basics”
    are not to be underestimated. To be more precise, these basics are wrapped around
    with an external shell that gives the object-oriented language its unique identity.
    This is why `C#`, even though it is an object-oriented language like `C++`, `Visual
    Basic`, and `Java`, has its own unique way of distinguishing itself from its family
    members. In any object-oriented programming language, the underlying functioning
    principles remain the same. These principles are essentially the “basics” of an
    object-oriented programming language, and they are a total of four. These basic
    principles are the following:

