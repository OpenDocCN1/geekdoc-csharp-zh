    综合来看，这些广泛涵盖了图形编程的三个重点：排版（使用不同的字形、字体、大小等绘制文本）、成像（复杂的图形对象，如图像、照片、位图等）以及 2D 矢量图形（相对简单的图形对象，如基本形状、线条和曲线）。


    # GDI+ 编程简介


    现代互联网开发时代的一个重要概念是“无状态性”（statelessness），即代码不保留信息，而是携带每次使用时都会访问的标记。这同样适用于使用 `GDI+`：使用这些类的代码需要提醒它们的属性和状态，例如字体大小、形状、位置、屏幕大小等。简而言之，几乎每一个与图形环境相关的信息，在代码与
    `DC`（即设备上下文，即你设计图形的“画布”）交互时，都必须显式地说明。你无法通过缓存 `DC` 本身来走捷径：


    ```csharp

    public class CacheGraphics : System.Windows.Forms.Form{Graphics graphics;public
    CacheGraphics(){graphics = new Graphics();}}

    ```


    这定义了一个继承自 `Form` 的类 `CacheGraphics`，并创建了一个新的 `Graphics` 对象存储在 `graphics` 变量中。这是不可行的，因为
    `GDI+` 是无状态的。`DC` 中的任何更改（包含在 `Graphics` 对象中）都不会传输到 `graphics` 变量中，因为它仅根据收到的信息显示图形——它没有存储上述任何数据。因此，请不要直接使用
    `new` 创建 `Graphics` 对象，也不要将此类对象存储在某些字段中。


    相反，请使用 `CreateGraphics` 在每次需要时创建一个新的 `Graphics` 对象进行工作（或者，从事件处理程序获取 `Graphics`
    对象参数）。创建一个 `Graphics` 对象比简单地调用一个新对象要复杂得多，使用这个预定义方法可以确保对象每次都能顺地初始化。每当调用新的图形操作时，你都必须提供它所需的所有状态数据。


    ## 现在让我们来看如何使用 `GDI+` 构建图形界面的示例：PlayControl


    ![](img/image_rsrc319.jpg)


    ### PlayControl


    `PlayControl` 是将图形与功能集成的简单示例。在表面层发生了几件事：圆角形状和按钮、渐变和颜色、包含在按钮空间内的图像、`VideoKiosk`
    徽标、界面顶部的滑块等。正如预期的那样，按钮响应 `Click` 事件，导致 `Click` 事件处理程序被调用，并将其输出传递给函数以运行必要的代码块。


    两点有助于这些图形控件的可重用设计：其一，控件由按钮分别实现；其二，图形设计实际上并没有做任何事情——它仅用于调用使用 `IPlayer` 接口的函数（将在稍后讨论）。例如，在使用了
    `IPlayer` 接口的情况下，按下播放将通过传递 `PlayControl` 的相应命令来播放内容。类允许单个控件的可重复性，而接口允许我们重用整个组件。该接口及其子程序在下文中进行了描述。


    ```csharp

    using System;namespace VideoKiosk{public interface IPlayer{void Close();void Play();void
    Pause();void Stop();void FastForward();void FastReverse();void VolumeUp();void
    VolumeDown();bool Open();double Duration();bool Mute();void Mute(bool state);double
    Elapsed();}}

    ```


    由于这一庞大的函数列表，我们可以得出 `IPlayer` 接口可以用于在一台计算机上模拟许多现代设备。`Form1.cs` 是 `VideoKiosk` 中的主表，用于实现该接口，即接口中命名的所有函数都由此表处理。因此，我们可以使用
    `PlayControl` 将 `Form1` 调用播放器。要实现这一点，我们将包含构造函数中的 `PlayControl` 引用如下传递给表单：


    ```csharp

    private PlayControl control = null;private void Form1_Load(object sender, System.EventArgs
    e){control = new PlayControl(this);control.Show();}

    ```


    `PlayControl` 实例本身关联并跟踪播放器。它的构造函数如下：


    ```csharp

    private IPlayer player;public PlayControl(){InitializeComponent();}public PlayControl(IPlayer
    player) : this(){this.player = player;}

    ```


    由于 `PlayControl` 依赖于 `Form1`，当 `Form1` 关闭时，`PlayControl` 也会关闭。上面的构造函数显示了如何调用默认构造函数（即
    `PlayControl` 方法本身且不接受参数）。它必须调用此构造函数，因为这是初始化组件的函数。如果不这样做，我们想要创建的控件对象将不会创建，表单也将无法正常工作。此默认构造函数由
    `this()` 调用，随后的播放器控件缓存在 `this.player` 变量字段中。这现在创建了一个我们可以使用 `PlayControl` 控制的播放器。


    让我们看看例如，当我们按下播放按钮时，播放功能是如何处理的。首先，调用了函数 `player.Play()`，它在 `Form1` 中运行代码。在我们的示例中，`Form1`
    包含以下内容。其他接口集可能会不同：


    ```csharp

    void IPlayer.Play(){axMediaPlayer1.Play();}

    ```


    更细致且实用的播放功能实现（如此 `VideoKiosk` 播放命令代码所示）将涉及事件调用和逻辑检查：


    ```csharp

    private void Play(){if(player==null) return;try{player.Play();PlayerState = PlayerState.playing;}catch{PlayError();PlayerState
    = PlayerState.stopped;}}private void playButton1_Click(object sender, System.EventArgs
    e){Play();}

    ```

