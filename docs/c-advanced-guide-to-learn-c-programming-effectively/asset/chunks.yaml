    ## 引言

    面向对象编程就像一个兔子洞；一旦你开始探索，隧道似乎越陷越深。这尤为如此，因为有一系列核心基于面向对象技术和原则的编程语言。`C++`、`C`、`Java`、`Javascript`、`PHP`、`Visual
    Basic`、`Microsoft .NET`、`Ruby`、`Scala` 以及许多其他语言被称为“OOPL”（面向对象编程语言）。在这个语言族中，`C#`
    类似于一个难以相处但资源极其丰富的同伴。对某些人来说，`C#` 是充满魅力且迷人的；而对另一些人来说，学习和使用这种语言是一件非常麻烦的事，但这两个处于光谱极端的人都没有错。


    熟悉主流 OOPL（如 `C++`）的人会发现 `C#` 具有你在其他面向对象语言中可以找到的所有花花哨，这最终使得学习 `C#` 变得更加容易，但尽管有这些相似之处，相同技术、工具和概念的实现方式是截然不同的，此外，`C#`
    本身并没有一个定义的 IDE。同时，你也可以认为没有哪种编程语言的某个 IDE 是比更好的。尽管如此，在 `C#` 的情况下，结果是编程体验的不一致，而其他语言则并非如此。因此，试图教读者一套通用的技术和实践实际上是不可能的。即使是基本概念也可能有所不同，尽管你可能已经通过其他面向对象语言熟悉了它们。


    正由于这个原因，本书的第一章本质是对 `C#` 中最重要的编程概念的回顾。这样，由于所有读者可能在进入后续章节之前阅读这一章，每个人将对后续章节中解释和使用的概念有相同的理解。这非常重要，因为从字面上说，第
    1 章之后的所有讨论都是建立在最开始时强调的概念之上的。即使读者已经了解第一章中讨论的所有概念，该章节本身也并非没用，因为它仍然作为一个回顾他们已有知识的机会。如果某些内容不清楚或解释得模糊，请进行简短的网页搜索。你极有可能只需要一些细节就能理解正在讨论的内容。


    ## 第 1 章：熟悉 C# 基础

    本章将为读者提供 `C#` 中最重要的概念的全面回顾。这是必要的，因为接下来的章节将建立在我们在这里回顾的内容的基础上。这使得读者能够熟悉高级 `C#` 编程中常用的惯用法。通过这种方式，本章希望在我们在书的后半部分进入高级技术和项目之前让读者达成共识。然而，如果你已经拥有
    `Java`、`Javascript`、`C++`、`PHP`、`Visual Basic .NET` 等面向对象编程语言的经验，你可能会认为这一章不值得花，但这一章将是一个非常有用的检查点，你可以回顾熟悉的概念。另一方面，大多数拿起这本书的读者会发现这一章揭示了
    `C#` 乃至 `.NET` 编程的某些他们未知的方面。简而言之，这里的内容将为读者在整个课程中理解 `C#` 编程提供必要的基础。


    '
