    此模板用于在“新建项目”对话框中创建以下条目：![](img/image_rsrc31D.jpg)


    现在一切都已完成，让我们通过创建一个新项目来测试我们的模板。进入 `File > New > Project`，点击向导库（Wizard Library）图标并按确定。现在你应该拥有了一个新的类库项目，其中包含
    `assemblyinfo.cs` 文件和一个名为 `WizardLibrary1.cs` 的文件，该文件应包含 `IDTWizard` 的基本执行。请双击是否存在对
    `envdte.dll` 的引用。


    关于本节项目模板的最后一点是，它是来自基类和环境的共享文件的组合。其中一个重要的文件是 `DefaultDLL.csproj` 文件，它位于 `…\Microsoft
    Visual Studio .NET\VC#\VC#Wizards` 文件夹中。所有基于 DLL 的项目都引用此模板。此外，创建模板的大部分过程是复制和粘贴，而不是从零开始创建。如果你经常需要使用自定义的项目结构，可以创建一个模板，以简化繁琐的任务并优化你的流程。


    既然这些功能都能正常工作，让我们使用这些工具来制作一些可以为你自动执行任务的东西。


    ## 使用向导扩展 Visual Studio .NET


    向导是创建任务自动化的一种简单方法，对初级程序员非常有益。创建向导允许你的团队更轻松地使用 .NET 编程中更独特的特性。


    让我们创建一个创建一个强类型集合的向导，该集合继承自 `ReadOnlyCollectionBase` 或 `CollectionBase`。在这些类中的方法包括
    `IList`、`IListSource`、`IENumberable`，这将让你创建一个行为类似于数组的集合结构，它可以被 `DataGrid` 控件排序和使用，并可以编译为
    ADO.NET 数据集。这个向导已经存在，命名为 `TypedCollectionWizard`，它实现了 `System.Collections.CollectionBase`
    中的方法。它的工作原理是创建一个继承自前一个类的类，添加一个索引器和一个 `Add` 方法。我们将使用这个示例来理解如何编写宏以及针对通用环境对象模型（Common
    Environment Object model）进行编程。


    ## 编写宏


    现在我们已经对如何创建、编写和测试向导有了基本的了解，这在编写宏时也将非常有帮助，同时还有 C# 编程和 Windows Forms 接口。让我们继续学习如何编写宏。


    宏支持是 Visual Studio .NET 可扩展模型的一部分，与宏 IDE 并列但相互独立。宏使用 Visual Basic .NET 编写。宏 IDE
    是一个以项目为中心的环境，创建的宏文件以 `.vsmacro` 扩展名存储，尽管 Visual Basic 代码也可以传递给它。


    首先，从 `Tools > Macros > Macros IDE` 打开宏 IDE。使用它与 Visual Studio .NET 类似。在新环境中，从
    `View` 菜单中选择 `Project Manager`。要创建一个新宏，选择一个现有模块或创建一个新的（模块是一个源代码文件）。为其添加一个简单的子程序（即方法），并通过
    `Debug > Start` 启动调试过程查看其是否有效。这是一个宏示例，它仅仅是产生一个显示“Hello World!”的消息框：


    ```vb


    Sub HelloWorld()

    MsgBox("Hello World!")

    End Sub

    ```


    让我们转向一个更实用的宏示例，该宏向现有项目添加一个新类，类似于我们稍后重构 `TypedCollectionWizard` 的方式。以下宏恰恰执行了这一操作：向活动项目的目录添加一个新的类文件，第二个（空）条目是填写新类名称的地方。默认情况下，方法本身会生成一个适当名称：


    ```vb

    Sub TestNewFile()

    DTE.ItemOperations.AddNewItem( _

    "Local Project Items\Class", "")

    End Sub

    ```


    注意 `DTE` 命名空间关键字。下一节将对该关键字进行简要概述，涉及设计时环境。


    ## 通用环境模型


    `DTE` 是一个设计时环境对象，内部文档称为通用环境模型（Common Environment Model）、自动化模型或扩展性模型。我们将继续称其为 `DTE`。它是项目的根节点，代表一个允许访问
    Visual Studio .NET 能力的对象模型。`DTE` 使用接口在 Visual Studio .NET 环境中创建面向对象的可访问性，这在实际上是一种自动化方法。该模型的文档非常庞大，查阅风险需自负。


    对于我们当前关注的内容，我们将仅使用手册的一小部分将 `DTE` 应用于宏和 C# 代码，这应该可以向你介绍使用它的核心概念。考虑 `DTE` 的良好方法是将其视为与
    Visual Studio .NET 交互的掩具，包括菜单、文档、宏等。


    ## 使用宏编写代码


    我们已经学习了如何重用项目模板来生成新代码，但我们也可以在运行时使用 `DTE` 更改代码。它看起来如下：


    ```vb

    1: Public Sub TestWriteCode()

    2: Try

    3: Dim item As ProjectItem = _

    4: DTE.ItemOperations.AddNewItem( _

    5: "Local Project Items\Code File")

    6:

    7: Dim defaultNamespace = _

    8: item.ContainingProject.Properties. _

    9: Item("DefaultNamespace").Value

    10:

    11: Dim code as CodeNamespace = _

    12: item.FileCodeModel.AddNamespace(defaultNamespace)

    13:

    14: Dim editPoint as EditPoint = _

    15: code.StartPoint.CreateEditPoint

    16:

    17: editPoint.LineDown(2)

    18:

    19: editPoint.Insert(DateTime.Now.ToString() + vbCrLf)

    20:

    21: Catch e As Exception

    22: MsgBox(e.Message, MsgBoxStyle.OKOnly, "Error")

    23: End Try

    24: End Sub

    ```


    这段代码的作用是：


    * 通过请求新文件来创建一个 C# 文件，并获取其 `ProjectItem` 引用。

    * 添加默认命名空间，并格式化命名空间元素。

    * 通过分配编辑点向该文件插入文本。可以在此处手动添加，也可以使用 `Add` 方法添加。


    该文件被添加到当前项目中，但它本身不能创建项目。运行此代码将得到以下结果：


    ```csharp

    namespace TestWizardOuput{5/9/2002 5:12:23 PM}

    ```


    `TypedCollectionWizard` 使用不完整的代码模板结合 `DTE` 来生成其强类型集合。让我们转向如何自动生成功能性代码。


    ## 代码生成器


    你可以通过以代码中所有实例都存在的结构为中心来创建一个代码生成器。添加基于字符串的输入来处理这些结构，并为其添加动态功能。例如，模板的代码生成器 `Wizard`
    编写如下：


