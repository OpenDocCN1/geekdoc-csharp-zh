    # 1. Encapsulation

    # 2. Inheritance

    # 3. Aggregation

    # 4. Polymorphism


    As such, any programming language that incorporates these principles is categorized
    as an object-oriented programming language. In order to implement each of these
    principal elements properly within their cores, programming languages use tools
    known as `idioms` and `constructors`. For instance, these include:


    * Templates

    * Operator overloading

    * Interfaces

    * Multithreading

    * Multiple Inheritance

    * Exception handling

    * Pointers

    * Garbage collection, etc.

