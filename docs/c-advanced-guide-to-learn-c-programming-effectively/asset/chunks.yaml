    Combined, these broadly cover the three foci of graphics programming: typography
    (drawing text using different glyphs, fonts, sizes, etc.), imaging (non-trivial
    graphical objects, such as images, photographs, bitmaps, etc.), and 2D vector
    graphics (comparatively trivial graphical objects, such as basic shapes, lines,
    and curves).


    # An Introduction to GDI+ Programming


    An important concept in the modern era of internet development is statelessness,
    i.e. code does not retain information but rather carries flags that are accessed
    every time it is used. This also applies to using `GDI+`: code using these classes
    require a reminder of their properties and states, such as font size, shape, position,
    screen size, etc. In short, almost every piece of information that relates to
    the graphics environment has to be explicitly stated every time the code interacts
    with a `DC`, or device context (the “canvas” on which you’re designing a graphic).
    You cannot cheat by caching the `DC` itself, either:


    ```csharp

    public class CacheGraphics : System.Windows.Forms.Form{Graphics graphics;public
    CacheGraphics(){graphics = new Graphics();}}

    ```


    This defines a class `CacheGraphics` that inherits information from `Form`, and
    creates a new `Graphics` object, storing it in the `graphics` variable. This does
    not work because `GDI+` is stateless. Any changes in the `DC` (which is contained
    in the `Graphics` object) will not be transferred over into the `graphics` variable
    as it is only displaying a graphics according to the information it has been given
    - it has stored none of said data. Thus, please do not try to create a `Graphics`
    object directly using `new`, nor store an object of this sort in some field.


    Instead, use `CreateGraphics` to make a new `Graphics` object to work on every
    time you need one (alternatively, get the `Graphics` object argument from an event
    handler). Creating a `Graphics` object is much more complex that simply calling
    for a new one, and using this predefined method ensures that an object is initialized
    smoothly every time. You will have to provide it all the state data it needs every
    time a new graphics operation is called for.


    ## Let’s now look at an example of how to make a graphical interface using `GDI+`:
    The PlayControl


    ![](image_rsrc319.jpg)


    ### The PlayControl


    The `PlayControl` is a simple example of how to integrate graphics with functionality.
    A few things are going on, on the surface level: rounded shapes and buttons, gradients
    and colors, images contained in the button spaces, the `VideoKiosk` trademark
    logo, the slider on the top of the interface, etc. As one might expect, the buttons
    respond to `Click` events, causing a `Click` event handler to be called into function
    that passes its output to run the requisite code block.


    Two things contribute to the reusable design of these graphical controls: one,
    controls are implemented separately by the button, and two, the graphical design
    does not actually do anything - it only serves to call a function using an `IPlayer`
    interface (which will be discussed later). For example, pressing Play plays something
    by passing the respective command of the `PlayControl`, on the condition that
    the `IPlayer` interface is used. Classes allow repeatability of individual controls
    and the interface allows us to reuse the entire component. This interface and
    its subroutines is described below.


    ```csharp

    using System;namespace VideoKiosk{public interface IPlayer{void Close();void Play();void
    Pause();void Stop();void FastForward();void FastReverse();void VolumeUp();void
    VolumeDown();bool Open();double Duration();bool Mute();void Mute(bool state);double
    Elapsed();}}

    ```


    Owing to this sizeable list of functions, we can conclude that the `IPlayer` interface
    can be used to emulate many modern devices on one computer instead. `Form1.cs`,
    the main form in the `VideoKiosk`, is used to implement the interface, i.e. all
    functions named in the interface are handled by this form. Therefore, we can call
    `Form1` as a player using `PlayControl`. To do so, we pass a reference to the
    `PlayControl`, contained within its constructor, to the form as follows:


    ```csharp

    private PlayControl control = null;private void Form1_Load(object sender, System.EventArgs
    e){control = new PlayControl(this);control.Show();}

    ```


    The `PlayControl` instances themselves associate and keep track of players. Its
    constructor is as follows:


    ```csharp

    private IPlayer player;public PlayControl(){InitializeComponent();}public PlayControl(IPlayer
    player) : this(){this.player = player;}

    ```


    Since `PlayControl` is dependent on `Form1`, the `PlayControl` closes when `Form1`
    does. The above constructor shows how to call for the default constructor, which
    is the `PlayControl` method itself, and takes no arguments. It must call this
    constructor since this is the function to initialize the component. Without doing
    so, the control objects we wanted to create will not be created, and the form
    will not work correctly. This default constructor is called by `this()`, and the
    subsequent player controls are cached in the `this.player` variable field. This
    has now created a player that we can control using `PlayControl`.


    Let’s look at how, for example, the play functionality is handled when we press
    the play button. To begin with, the function `player.Play()` is called, which
    runs code in `Form1`. `Form1` contains the following in our example. This can
    be different for other sets of interfaces:


    ```csharp

    void IPlayer.Play(){axMediaPlayer1.Play();}

    ```


    A more nuanced and practical implementation of a play functionality (as shown
    in this example code for `VideoKiosk`ss play command) would involve things such
    as event invocation and logic checks:


    ```csharp

    private void Play(){if(player==null) return;try{player.Play();PlayerState = PlayerState.playing;}catch{PlayError();PlayerState
    = PlayerState.stopped;}}private void playButton1_Click(object sender, System.EventArgs
    e){Play();}

    ```

