  trans: "\n\n# 实现“状态栏”（StatusBar）表单控件\n\n任何有计算机经验的人对“状态栏”这个术语都很熟悉。通常，状态栏的目的是显示任何操作的进度，这些状态栏通常出现在应用程序中。例如，取一个安装向导应用程序。当你点击“安装”按钮时（如果你没注意到，它也是一个表单控件），应用程序将开始将文件复制到指定的目录。安装进度将显示在“状态栏”上。我们还可以使用\
    \ `StatusBar` 作为显示应用程序当前状态的实时图形馈送。要在应用程序中实现 `StatusBar`，我们使用名为 `AssemblyViewer`\
    \ 的应用程序模块中的当前内容。你需要提取的代码已经下文所示。\n\n```csharp\nprivate void Initialize(){\n   \
    \ openFileDialog1.InitialDirectory = GetInitialDirectory();\n    Broadcaster.Add(this);\n\
    }\nprivate void ChangeStatus(string status){\n    statusBar1.Text = status;\n\
    \    statusBar1.Refresh();\n}\nvoid IListener.Listen(string message){\n    ChangeStatus(message.Trim());\n\
    }\n```\n\n我们已经讨论过如何使用广播类中的 `Broadcast` 函数和相应的接口 `IListener` 来实现此功能。\n\n# 实现“主菜单”（MainMenu）表单控件\n\
    \n在任何标准的 Windows 应用程序中，你都会看到“主菜单”，它包含了用户可能想要访问的所有可能功能。通常，菜单主要仅由菜单项组成，也可以由一组按钮控件组成。如果我们从技术角度看菜单，它有两个对象——`MainMenu`\
    \ 和 `MenuItem`。当我们创建一个 `MainMenu` 表单控件时，我们基本上是取一个空白的表单控件并在上面放置相应的对象和元素（尽管 IDE\
    \ 也为此目的提供了模板）。在 `MainMenu` 表单控件上添加元素的交互过程非常直观、易于理解，并且不需要任何特殊编码，因此让我们进入下一个表单。\n\
    \n# 实现“打开对话框”（OpenFileDialog）表单控件\n\n`OpenFileDialog` 表单控件是你使用 Windows 时遇到过的东西。当你从计算机硬盘上传内容到云存储时，你首先需要指定文件在系统中的位置。这会打开一个小的弹出窗口，类似于微型文件管理器，你通过该管理器导航到你所需的文件。这就是\
    \ `OpenFileDialog` 表单控件的实际实现。要实现这一点，我们只需要使用下所示在 `FormMain` 模块中定义的方法。\n\n```csharp\n\
    public void OpenAssembly(){\n    if( openFileDialog1.ShowDialog() == DialogResult.OK)\n\
    \        OpenAssembly(openFileDialog1.FileName);\n}\n```\n\n`OpenAssembly` 语句负责将我们刚刚选择的文件加载到\
    \ `AssemblyViewer` 上。记住，你需要根据不同的目的为 `OpenFileDialog` 表单控件添加相应的功能。例如，你可能记得某些此类弹出文件管理器有一个名为“文件类型”的特殊类别，允许用户过滤不同的文件类型。我们也可以通过使用以下代码向此表单控件添加此功能：\n\
    \n```csharp\nopenFileDialog1.Filter = \"Class Library(*.dll)|*.dll|Executables(*.exe)|*.exe\"\
    ;\n```\n\n# 使用 ThreadPool 类实现多线程\n\n“多线程”这个主题本身并不简单，但几乎每个程序员或计算机爱好者都熟悉这个术语所暗示的含义。线程基本上定义了由\
    \ CPU 分配给应用程序的一个代码执行流。CPU 拥有有限数量的线程，这些线程作为其规格的一部分进行宣传（例如，8 核 16 线程 CPU 意味着每个核心具有\
    \ 2 个线程）。为了确保应用程序顺利初始化，并在运行过程中不会因等待部分代码执行完毕再继续等因素而产生瓶颈，程序员需要实现多线程。我们可以继续讨论多线程几百页而仍然无法涵盖整个主题，因此让我们只在与\
    \ `AssemblyViewer` 工作时才讨论多线程。让我们在 `AssemblyViewer` 应用程序内部讨论多线程。当你运行应用程序时，你会看到一个“启动界面”作为欢迎动画。嗯，`AssemblyViewer`\
    \ 在此时总共使用了 2 个线程，一个线程用于执行启动界面的代码，而另一个线程用于初始化应用程序本身。启动界面本身还有其他用途，但那是另一天讨论的话题。\n\
    \n在本节中，我们将讨论主要设计用于帮助程序员在应用程序内部实现和处理多线程的类。这个类是 `ThreadPool` 类。将此类想象成一个银行经理。就像银行经理“管理”分行的员工一样，`threadpool`\
    \ 类管理应用程序可用的线程总数，但在你在 Windows Form 控件上实现多线程时，需要额外的关注，因为表单控件很容易吞噬并占用宝贵的资源——线程，供其他应用程序或同一应用程序中的其他进程使用。\n\
    \n以下代码使用 `threadpool` 类通过多线程实现同一个启动界面的不同动画。\n\n```csharp\n1: bool done = false;\n\
    2: private void Increment()\n3: {\n4: Opacity += .05;\n5: lock(this)\n6: {\n7:\
    \ done = Opacity >= 1;\n8: }\n9: }\n10:\n11: private void Show(Object state)\n\
    12: {\n13: try\n14: {\n15: while(!done)\n16: {\n17: this.Invoke(new MethodInvoker(Increment));\n\
    18: Thread.Sleep(100);\n19: }\n20: Thread.Sleep(1500);\n21: }\n22: finally\n23:\
    \ {\n24: Close();\n25: }\n26: }\n27:\n28: public static void Splash()\n29: {\n\
    30: #if DEBUG\n31: FormSplash form = new FormSplash();\n32: form.Opacity = 0;\n\
    33: form.Show();\n34: ThreadPool.QueueUserItem(35: new Callback(form.Show));\n\
    36: #endif\n37: }\n```\n\n# 实现控件库\n\n如果你想开始构建用户控件（UserControls），最简单的方法是使用“新建项目”对话框中\
    \ Windows Control 中的模板。使用 UserControl 将创建一个项目，Windows Control 将生成一个具有 DLL 扩展名的程序集。另一种方法是从类库（Class\
    \ Library）开始，稍后手动添加所有用户控件，但这种方法不受支持，因为如果你可以轻松地使用快捷方式，就没有动力去使用它们。在创建 Windows Control\
    \ 时，你得到的类型将是类库。Windows Control 模板会添加如 `UserControl.cs` 和 `AssemblyInfo.cs` 等模块。它会同样添加如\
    \ `System`、`System.Drawing`、`System.Windows` 和 `System.Data` 等命名空间。要开始使用第一个用户控件，可以使用\
    \ UserControl 模块中存在的一个类。它继承自 `UserControl`。要添加元数据，可以使用 Info 文件。Windows Control\
    \ 允许你根据需要添加无限的用户控件。考虑到 `.resx` 文件与 UserControl 相关，最好将每个模块限制为单一的 UserControl。你也可以通过一些通用解决方案构建\
    \ UserControl，稍后通过通用应用程序进行测试。许多专家大多推荐这种方法。在本章中，这种方法被用于构建用户控件。考虑到主控件，它由一组按钮组成。这些按钮总共\
    \ 4 个。根据 UserControl 的大小，这 4 个按钮相应地调整了大小。还有另一个控件帮助 UserControl 具有两个列表框。\n\n# 创建\
    \ ButtonCluster（按钮组）\n\n在 UserControl 宿主上，通过 `ButtonCluster` 使用 4 个按钮。这些按钮通常位于表单的中心。这些组件可以移动，这是通过点击特定按钮完成的。如果应用程序偏离\
    \ Windows 视图且过度，合格的客户将知道该做什么。这需要自定义实践。每当事件触发时，列表会通知 UserControl。按钮需要对齐，为了这一点，必须考虑某些点。按钮的文本必须显示，以允许用户响应事件。\n\
    \n# 构建 UserControl 的图形界面\n\n四个相同大小的按钮以垂直形式排列。这些按钮在视觉外观中起着至关重要的作用。这些按钮可以水平对齐以使控件符合预期。`button\
    \ cluster` 将保持简单。真实的按钮可能通过不同的类型提供。使用 .NET 格式创建具有相同大小的按钮。现在，调整 UserControl 的大小。在垂直方向上对齐按钮到中心。之后，调整\
    \ UserControl 的大小。让所有按钮的高度等于单个按钮的宽度。\n\n# 实现 UserControl 事件处理程序\n\n当 UserControl\
    \ 的大小调整时，会通知，因为事件处理程序是可用的。这有助于执行按钮的类似调整代码。在编写代码时，建议使用重写（override）方法，因为在任何其他情况下，这是足够的。智能的想法是使用另一个类并在需要时执行该函数。以下代码有助于确定形状的顶部。这是一个圆形矩形。\n\
    \n```csharp\nusing System;\nusing System.Drawing;\n\nnamespace UserControlsExamples{\n\
    \    public class Rectangles{\n        private Rectangles(){}\n        public\
    \ static Rectangle GetVerticalRectangle(Rectangle rectangle, int index, int segments){\n\
    \            Rectangle r = rectangle;\n            r.Size = new Size(r.Width,\
    \ NewBottom(rectangle, segments));\n            r.Location = new Point(0, NewTop(rectangle,\
    \ index));\n            return r;\n        }\n        public static int NewTop(Rectangle\
    \ rectangle, int index){\n            return (int)((float)index / segments * rectangle.Height);\n\
    \        }\n        public static int NewBottom(Rectangle rectangle, int segments){\n\
    \            return rectangle.Height / segments;\n        }\n    }\n}\n```\n\n\
    # 确定按钮的划分\n\n当 UserControl 的大小调整时，会通知，因为事件处理程序是可用的。这有助于执行按钮的类似调整代码。通过调用一个名为 `OnResize`\
    \ 的方法来实现事件处理程序。在任何情况下，重写（override）方法都是首选的。.NET 格式使用 `OnResize` 事件方法。\n\n```csharp\n\
    protected override void OnResize(System.EventArgs e){\n    base.OnResize(e);\n\
    \    ResizeButtons();\n}\n```\n\n# 在组成控件中提升事件\n\n`ButtonCluster` 的按钮被声明为 public。可以认为，对于这些按钮的组成控件声明也是可能的。事实上，.NET\
    \ IDE 允许用户这样做。当组成控件声明为 public 时，其事件和属性对用户是直接可见的。某些属性具有嵌套类型。这些在属性窗口中不会出现，其值可以更改。嵌套类型的属性在运行时和编译时不会保留。在这种，如果用户了解背景，他将进行推断。在编程中，这被视为错误。名字是\
    \ `Borland’s Delphi`。Delphi 基于 Pascal 语言。其次，嵌套属性应可以在设计时更改，以便尽早查找嵌套对象。\n\n# 添加和删除元素\n\
    \n四种类型的每个按钮都有自己的功能和行为，可以通过不同的方式实现。当点击“all right”按钮时，设置为将左列表中的所有元素传输到右侧。相反，“all\
    \ left”按钮执行相反操作，将元素从右侧移动到左侧。如果只传输选中元素，则使用 `right` 按钮将它们从左到右，而 `left` 按钮则相反。列表由定义为\
    \ `ObjectCollection` 的项组成。移动元素的列表控件由下面的方法处理。\n\n```csharp\nprivate void SourceToTarget(ListBox.ObjectCollection\
    \ source, ListBox.ObjectCollection target){\n    target.AddRange(source);\n  \
    \  source.Clear();\n}\nprivate void MoveAllLeft(){\n    SourceToTarget(listBoxRight.Items,\
    \ listBoxLeft.Items);\n}\nprivate void MoveAllRight(){\n    SourceToTarget(listBoxLeft.Items,\
    \ listBoxRight.Items);\n}\nprivate void SourceToTarget(ListBox.SelectedObjectCollection\
    \ source, ListBox.ObjectCollection target){\n    IEnumerator e = source.GetEnumerator();\n\
    \    while(e.MoveNext()){\n        target.Add(e.Current);\n    }\n}\nprivate void\
    \ RemoveSelected(ListBox listBox){\n    for(int i=listBox.Items.Count - 1; i>=0;\
    \ i--){\n        if(listBox.GetSelected(i))\n            listBox.Items.RemoveAt(i);\n\
    \    }\n}\nprivate void MoveLeft(){\n    SourceToTarget(listBoxRight.SelectedItems,\
    \ listBoxLeft.Items);\n    RemoveSelected(listBoxRight);\n}\nprivate void MoveRight(){\n\
