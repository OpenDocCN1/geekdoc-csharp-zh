    \ expression, string errorText){if( !Regex.IsMatch(value, expression)){control.Focus();throw\
    \ new Exception(errorText);}}private void ValidateClassName(){DoValidateField(textBoxClassName,ClassName,\
    \ @\"^\\w$&#124;^\\w[A-Za-z0-9]+$\",\"Valid class name is required\");}\n```\n\
    \n#### Dialog Form Strategies\n\nWe use `FormWizard` to create a dialog form.\
    \ A tip for dialog forms is to make a static method, called `Execute`, which accepts\
    \ inputs and returns outputs for the form. The user only needs to worry about\
    \ the inputs and outputs, not the form as `Execute` handles them. The following\
    \ demonstrates:\n\n```csharp\npublic static bool Execute(ref string generatedCode){using(Form1\
