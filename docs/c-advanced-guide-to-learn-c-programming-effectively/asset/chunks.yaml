    is invoked. The parameter determines the user control’s rectangle passes above
    i.e. ‘this.Bound.’ The array’s length demonstrates the quantity of partitions
    and the index ‘i’ shows a single partition. In this code, variables are used to
    decide the quantity of buttons and the index and it does not depend on the literal
    values. So this makes the above code pretty extensible.A last word on the procedure
    is altogether. In the case, that a user decides to utilize the Controls array
