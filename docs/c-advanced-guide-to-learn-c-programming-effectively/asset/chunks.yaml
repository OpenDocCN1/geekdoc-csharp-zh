    3: Working with Video Kiosk Using C#Windows has developed tools in the now not-so-recent
    past to allow users to use its flexible graphics programming structures and techniques,
    which were, frankly, dense and intimidating to use before then. We shall use the
    example of a Video Kiosk program to understand how this toolbox, named “GDI+”,
    functions, and in doing so learn how to apply these tools in making unique and
    creative graphical interfaces of our own, as well as simply using them effectively
    in more straightforward projects.We will cover the following sub-topics:


    *   Introduction to creating Custom Controls.


    *   Making a Control Library.


    *   The ControlPaint class and its implementation in customizing controls.


    *   Virtual Methods.


    *   Overriding Events via Controls.


    *   Exception Handling and caching Exception Flags.


    *   COM Interop and how to use it.


    *   Designing and Implementing Interfaces.


    *   TODO lists.


    *   TimeSpan and MessageBox Classes


    An Introduction to GDI+There has always been an exceptionally robust and capable
    graphics programming toolkit available in Windows, referred to as “GDI”, though
    as we have mentioned it has often been held back by the technical investment required
    to learn how to use it effectively. Specifically, GDI consists of a group of unorganized
    structures and subroutines and uses API methods that do not very simply fall in
    line with each other. In other words, GDI is implemented onto a “canvas” procedurally.In
    contrast, GDI+ is an object-oriented library of graphical tools that encapsulates
    all of the above into one structure, i.e. it is an ordered, categorized version
    of GDI. This lets us peruse one cleanly divided section of tools at a time, instead
    of spending half our time diving into a jumble of structures to find one that
    we need.Let’s learn about how GDI has been sorted into GDI+, and the resulting
    types, classes, and namespaces that it is made of.GDI+ NamespacesThe GDI+ Classes
    are stored in System.Drawing.dll , and are further divided using various namespaces:


    *   System.Drawing


    *   System.Drawing.Design


    *   System.Drawing.Drawing2D


    *   System.Drawing.Imaging


    *   System.Drawing.Printing


    *   System.Drawing.Text'
