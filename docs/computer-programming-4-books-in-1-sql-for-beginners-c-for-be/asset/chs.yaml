- "# 计算机编程：4合1：SQL 初学者指南、C# 初学者指南、C# 中级指南、Kali Linux 黑实战，掌握编程与网络安全所需的一切\n\n\n\n![](img/cover.jpeg)\n\
  \n\n\n\n\n\n\n\n\n\n# 第 14 章：轻松检索的十个技巧\n\n在本章中，我们将讨论一些你可以检索的最优技巧。首先首我们需要理解 `select`\
  \ 是什么：这指的是一种工具，帮助你从特定的数据库中挖掘隐藏信息。无论你是否知道想要检索什么，将该想法翻译成 `SQL` 都是一项困难的任务。你需要对它非常小心，因为微小的错误也会导致错误的结果。\n\
  \n## 1. 验证数据库结构\n\n当你成功从数据库中检索数据，但结果似乎不符合逻辑时，你应该检查数据库的设计。这可能是因为许多数据库设计得很糟糕；如果是这样，你必须先修复该设计，然后再考虑解决方案。你应该记住，良好的设计对于数据完整性至关重要。\n\
  \n大多数数据库管理员以及开发者通常在具有数字数据的列上分配字符数据类型。数字数据列包含任何数据且效果更好。\n\n\n\n\n创建各种数据集，为了确保准确性，你应该包含一些罕见的情况，例如空表以及远超允许成本的荒谱值。想象一些不太可能发生的场景，并检查在这些情况发生时是否会有完全的行为变化。在这个过程中，你更有可能预判出可能会出现什么问题，而且，你将准备得更充分。\n\
  \n## 3. 确认包含连接（Joins）的查询\n\n连接（Joins）众所周知通常是违背直觉的。如果你正在处理的查询包含了上述的连接之一，在将其添加到其他子句所在的位置之前，你必须确保它是按照你之前的指示在执行的。你还应该做的另一件事是避免分配过多的内存。\n\
  \n你应该知道，作为 `SQL` 管理和安装的一部分，它允许指定分配给 `SQL` 服务器的内存水平。然而，你应该知道，为 `SQL` 服务器分配过多的精力会增加通用服务器的负担，因为它阻止了获取用于执行操作系统和应用程序等其他任务所需的内存资源。\n\
  \n这个技巧非常适用，特别是对于长时间处于活动状态的数据库。其他一些检索技术可能很有用，但没有这种方法准确。请仔细遵循我们强调的步骤，观察你的数据集如何被检索。\n\
  \n## 4. 确认包含子查询（Subselects）的查询\n\n包含子查询的查询可以从表中获取数据，并且根据检索到的数据类型，可能会以不同的计划干扰集合数据。从这里，我们可以知道恢复此类类型的数据是非常困难的。你应该确保内部连接（`inner\
  \ join`）检索的数据类型与外部选择（outer select）输出所需结果的数据是相同的。在你有超过一层子查询的情况下，你需要更加小心。\n\n你还应该避免使用高度重复的电报（telexes）。因为高度重复的索引的唯一值有限。为了更好地理解这一点，让我们来看下面的例子。假设你在一组列上高亮了一个索引，该列包含少于三个值，这意味着该索引是一个高度重复值。大多数人不知道的是，与其完全没有索引相比，拥有高度重复的索引并不是好事。这是因为当索引高度重复时，它将强制数据库引擎在更新或删除数据等非常关键的操作期间更努力地处理它。\n\
  \n## 5. 使用 GROUP BY 汇总你的数据\n\n想象一下：你正在处理一个包含国家棒球联盟数据的表。它可能包含诸如球员名称、参加联盟的球队以及联盟中每个棒球运动员获得的首分总数等信息。你可以通过以下查询检索主队的总分。\n\
  \n```\nSelect team, Add (the home team from nation league group by team):\n```\n\
  \n此查询将显示主队总数列表、进球数以及进球的球员。在大多数已识别的实现中，此类查询可能会导致空结果或错误。在之前的类型数据检索方法中，我们看到更多使用按列对齐的数据集，而不是按行对齐的数据集。您有不同的方法通过一组特定的公式来应用该集合。本节讨论了两种方法，当使用适当时，可以得到所需的结果。\n\
  \n## 6. 分析 GROUP BY 的限制\n\n假设我们需要一个由联盟进球最高的球员组成的表。以下查询将帮助你得到目标结果。\n\n```\nSELECT\
  \ Player, Team they play for, Home Country they come from >= 25 GROUP BY Players:\n\
  ```\n\n在标准设置下，此查询将导致错误。然而，这并不意味着它不是一种有效的检索方法。通常，在这种方法中，应用于分组的选列或涉及用户查询的列更有可能出现在那个特定的列表中。在您倾向于查看该组数据的情况下，请使用以下函数集合。\n\
  \n```\nSELECT Player, Team they play for, Home Country they come from >= 25 GROUP\
  \ BY Players:\n```\n\n因为你想要在子句中显示的列似乎命名为 `GROUP BY`，它成功地交付了你反对并想要的结果。这是通过列出团队名称、然后是球员，最后是每个球员进球的总数实现的。\n\
  \n## 7. 在 NOT, OR & AND 子句中使用括号\n\n在某些情况下，当科学家混合使用 `AND` 和 `OR` 子句时，`SQL` 通常不会按照你预期的方式或计划的方式执行表达式。因此，建议在这些复杂的表达式中包含这些括号，以确保你获得所需的结果。输入额外的一组关键笔画将确保你对你所犯的错误进行较少的修复，作为回报，获得更准确的结果。\n\
  \n这组括号将确保子句的每个部分都按照你指示的关键字或术语进行应用。这不仅确保了更准确的信息集，还确保了一致性。\n\n从我们之前讨论的检索方法来看，这可以认为是所有方法中最廉价的之一。它不需要复杂的步骤或技术人员来完成；相反，你只需要基础知识就能完成。大多数科学家由于随之而来的效率和准确性而推荐它。尝试使用它，并观察改进、高效且更准确的结果！\n\
  \n## 8. 调节检索权限\n\n我们大多数人都没有利用 `DBMS` 中可用的安全机制。他们还没有准备好参与其中，因为经常，他们认为数据的误用和误解是只发生在没有经验的人身上的。\n\
  \n然而，事实并非如此；我建议你在系统中建立一个重大的安全设备并进行维护，以便你拥有更安全的信息集。\n\n此外，不要犹豫要总结你的数据集识别的所有指令。尽管许多人没有批准这种检索方法，但它是最高效的方法，我建议你尝试！\n\
  \n芝加哥一家领先公司进行的一项研究显示，这种检索方法更安全，不会让你的数据暴露在任何盗窃或漏洞中。正如我们之前提到的，这种方法既安全又便宜。\n\n## 9.\
  \ 定期备份你的数据库\n\n大多数人认为，在火灾、地震或任何可能破坏硬盘的自然灾害发生，数据的检索是困难的。你应该记住，有时计算机会毫无警告地自行死亡。建议经常备份你的数据以避免这些不便，并将备份媒体存储在安全的地方。\n\
  \n我们所说的安全位置意味着什么？嗯，这取决于你的数据有多关键及其重要性。它可以是任何地方：房子里的防火区域，可以是离你电脑几个街区的地方，或者是一个在山下挖掘并经过加固以防范核攻击等恐怖场景的混凝土地堡。因此，由你来决定要给你的数据集提供何种安全保护。\n\
  \n\n\n无论你是在工作站周围开发一组查询，还是将问题应用于特定的应用程序，很多时候 `SQL` 都会返回错误反馈或你预期之外的内容。在这种情况下，根据返回的消息类型，决定下一步要采取的操作至关重要。\n\
  \n然而，在应用程序中，情况通常略有不同。应用程序用户通常不知道应该采取什么适当的操作。为了处理此类不确定性，建议您在系统中安装一套完善的错误处理软件。它能有效处理可能发生的每一个错误。然而，你应该注意，创建错误管理代码需要大量的精力。这是最复杂的程序之一，需要你更加小心。但结果是值得的。尝试一下，见证你的数据获得安全！\n\
  \n# 第 15 章：变量与存储例程\n\n本章将讨论存储过程中的变量，以及你如何声明和使用它们。此外，我们还将讨论变量所包含的各种范围。\n\n让我们从定义变量开始。变量是指一个命名的数据对象，其值不是常量，并且可以在存储过程执行期间发生变化。在这种情况下，你可以使用已保存的程序来维护即时结果。这类结果或变量对于你存储的方法至关重要。你应该意识到，在使用任何变量之前，必须先对其进行声明。\n\
  \n## 声明变量\n\n要声明变量，建议你使用以下 `declare` 语句。声明 `variable_user`，数据方法（度量）`[Default default_type]`：\n\
  \n在此联系中，你必须在宣布关键字后立即开始指定每个变量的。你必须确保你的变量名符合 `MySQL` 列名的命名规则。\n\n其次，你需要确保已经指定了计划使用的变量的长度长度和类型。变量可以包含不同的数据类型集合，例如\
  \ `Datetime`、`INT` 和 `VARCHAR`。我们中的某些人可能好奇它们是什么意思。为了进一步说明，你应该知道这些变量指的是你在填充表格时所使用的基本规则集。到此，我们已经讨论了在实现预期目标时必须考虑的一系列规定。\n\
  \n第三，你被要求通过默认选项为一组变量分配一个初始值。当你在没有指定默认值的情况下声明变量时，该数值被标记为 `null`（空）。`MySQL` 数据集允许你使用之前识别的语句指定多个组具有标准数据集合的变量。你可以使用以下数据集合来声明一个包含相似数据集的变量。\n\
  \n同样，`MySQL` 系统有一个槽位允许你宣布多个组具有标准数据类型的变量。再次，大多数技术人员在此命令如何向相关数据库传递信息方面遇到过问题。在存储差异变量的各种方法中，这种被证明比其他的更安全。因此，它被认为是最流行的一种。\n\
  \n变量可以应用于数学表达式，例如，将值相加或合并并持有文本。它可以作为通用信息的一部分。供你参考，变量被用于存储信息，以便参与某种计算。此外，变量可以是参数的一部分，并用于过程化评估。这是一种二合一的方法，不仅让你声明变量，还为它设置具有相似数据类型的值。回到我们之前给出的示例，我们可以确认\
  \ `varchar` 是一种允许你在单个字符串中维持多种字符的数据类型。\n\n此时，你应该已经能够理解现有的各种数据集和不同类型了。这些知识不仅能让你在错误发生时处于极佳的地位来处理它们，还能防止它们的发生。当著名数据科学家、牛津大学毕业生\
  \ Hillary Bladiwn 首次使用 `varchar` 时，他因其高效和准确而推荐了它。他将其评为当今市场上最佳的数据集类型。它没有为潜在的错误发生分配空间。很难干预这种高度安全的数据类型。\n\
  \n自变量选项允许你在同一表上执行连接过程，节省你组织最终表格的时间。然而，在某些情况下，这是一个很好的选项。想象你之前创建的图表包含国家和大陆的列。\n\n\
  当面临列出位于同一大陆的国家的任务时，下面清晰概述的集合应该让你对预期结果一目一斑。\n\n这种类型的 `SQL` 变量可以进一步分为三种不同的类型：`left\
  \ join`（左连接）、`right join`（右连接）以及 `full outer join`（全外连接）。外连接的主要作用是从单表中返回所有已识别的行，一旦实现了连接目标，它就包含了另一张表的列。外连接与内连接的本质区别在于，内连接不会涉及最终结果集中的不匹配的行。\n\
  \n例如，当使用订单输入时，你可能会面临不可避免的情况，即列出每个员工，无论他们放置客户订单的位置在哪里。在这种情况下，这种连接是有益的。当你选择使用这种连接时，所有员工（包括那些匹配订单的员工）将包含在最终结果中。\n\
  \n让我们讨论之前强调的三种变量类型。\n\n这是一种外连接，负责从表格左侧的每一行以及从表格右侧匹配的行。如果右侧没有匹配项，`left join` 会为这些列中的每个列返回一个\
  \ `null` 值。另一种连接类型是将右侧的每一行合并到另一侧（左侧）。再次，如果这些列中没有数字值，连接将为它们返回 `null` 值。\n\n它的任务是从内连接的初始位置返回行，如果没有找到匹配项，该连接将为这些表返回\
  \ `null` 结果。\n\n\n\n我们自从小就认为，学习新概念最好的方式就是通过实践。这一点也不例外；你必须通过编写各种与 `SQL` 相关的等式（语句）来学习它们。本节旨在为你提供一系列练习题或语句，当你解决这些问题时，你将能够处理与此主题相关的问题。去看看吧！\n\
  \n## SQL 练习示例\n\n以下是你可以在 `SQL` 中完成的随机练习。假设你是某家特定研究公司的员工，任务是查找某个特定业务机构的客户数据。以下是你最可能遇到的一些查询语句。\n\
  \n- 你被要求构建一个查询，用以显示所有在酒店消费超过 100 美元的客户。这项练习将帮助你掌握 `SQL` 中的数学处理技能。\n- 编写查询语句，列出所有居住在纽约市且在该业务机构消费超过\
  \ 200 美元的客户。\n- 编写查询语句，显示所有居住在纽约市 **或者** 在该业务机构消费超过 200 美元的客户。\n- 编写查询语句，列出所有居住在纽约市\
  \ **或者没有** 在在该业务机构消费超过 200 美元的客户。\n- 编写查询语句，列出所有 **既不** 在纽约市 **又没有** 在业务机构消费超过 200\
  \ 美元的客户。\n- 编写查询语句，列出所有编号为 505 及以下的销售员在周末一天之前未发布的订单，且其消费金额在 1000 美元及以下的规则。\n- 编写一个\
  \ `SQL` 等式或语句，显示销售员的编号、姓名以及所属城市。同时，确保涉及的佣金范围大于 0.20% 但低于 0.15%。\n- 编写一个 `SQL` 查询，显示客户消费金额不超过\
  \ 200 美元的订单，不包括那些在 2 月 10 日之后创建的订单，并且由编号低于 5009 的客户购买的订单。\n- 编写 `SQL` 语句，筛选出符合 8\
  \ 月 1 日前下单且消费金额低于 1000 美元的订单行。其次，让其包含大于 1000 的客户 ID。\n- 编写一个 `SQL` 查询列表，显示订单号、消费金额、完成的目标数量以及未生成的订单。同时注明负责这些订单的销售员姓名及其成功率。\n\
  \n## SQL 编程项目\n\n以下是你在 `SQL` 编程中可能会遇到的随机项目。它们是随机挑选的，我相信如果你练习了它们，你将能够更好地应对此类情况。在列出项目之前，我们首先应该理解“练习”和“项目”之间的区别。从逻辑上讲，任务（task）更像是一个你可以完成的快速测试，没有太复杂：它与项目（project）相比要简单。另一方面，项目要更加复杂和精密。它需要高级技能以及数据研究来完成。\n\
  \n了解这些后，让我们讨论一下你在 `SQL` 编程中可能遇到的潜在项目。\n\n### i) 面谈\n为特定公司开发软件时，你需要了解该公司现有的系统。为了这些目的，你必须对在该公司的某些个人进行访谈并收集关键信息。你必须对了解该软件的人员进行访谈，这些人可能是旅馆管理员或培训师。\n\
  \n### ii) 讨论（小组）\n它们可以是你所工作的公司员工之间进行的某种小组讨论。刚开始，可能会出现许多聚集在一起的想法，或者被已有的概念填充。这些思想可能会由程序员引入。\n\
  \n此外，也可以通过在线观察来完成。这是一个从网上获取有关现有软件或 Web 应用程序更多本质细节的过程。该项目的主要目的是尽可能贴近系统。`SQL` 编程在确保系统按建议运行方面起着至关重要的作用。\n\
  \n# SQL 的应用\n\n`自变量`选项允许你在同一张表上执行连接过程，节省你组织最终表的时间。然而，在某些情况下这可能是一个很好的选择。想象你之前创建的图表包含国家和大陆列。\n\
  \n当面临列出位于相同大陆的国家的任务时，下面清晰列出的集合将让你对预期结果一目了然。`SQL` 变量进一步分为三种类型：`left join`（左连接）、`right\
  \ join`（右连接）以及 `full outer join`（全连接）。`outer join`（外连接）的主要作用是从单表中返回所有标识的行，一旦实现了连接目标，就会包含另一张表的列。`Outer\
  \ joins` 在本质上与 `inner joins`（内连接）的区别在于，`inner join` 不包含最终结果集中不匹配的行。\n\n例如，在使用订单输入时，你可能会面临必须列出每个员工的情况，无论他们放置客户订单在哪里。在这种情况下，这种连接是有益的。当你选择使用这种连接时，所有员工（包括那些接到指令的员工）将被包含在最终结果中。\n\
  \n这是一种 `outer join`，负责返回表格左侧的每一行以及与表格右侧匹配的行。如果右侧没有匹配项，`left join` 会为这些列中的每一列返回一个空值（null）。`outer\
  \ join` 类型的任务是返回表格右侧的每一行并与表的另一侧（左侧）合并。再次，如果这些列中没有对应数字的值，连接将为它们返回空值。\n\n\n\n\n变量可以应用于数学表达式中，例如将值相加，或者合并并保存文本。这可以作为通用信息的一个部分。供你参考，变量也用于存储信息，以便人们参与某种计算。此外，变量可以作为参数的一部分，并用于程序化评估。这是一种二合一的方法，不仅可以让你声明变量，还可以为其设置具有相似数据类型的值。回到我们之前给出的示例，我们可以肯定\
  \ `varchar` 是一种允许你在单条字符串中维持多种类型字符的数据类型。\n\n到目前为止，你应该能够理解各种 `SQL` 练习和程序，以及存在的各种类型了。这不仅能让你在错误发生时处于极佳的位置来处理这些错误，还能防止它们的发生。当著名数据科学家、哈佛大学毕业生马克·苏阿曼（Mark\
  \ Suaman）首次使用 `varchar` 时，他因其高效和准确而推荐了它。他将其评为当今市场上最佳的数据类型之一。它没有为潜在的错误发生分配空间。要干预这种高度安全的数据类型是非常困难的。\n\
  \n# SQL 的应用\n\n自从引入计算领域以来，`SQL` 在系统化数据数据存储以及直接检索方面发挥了重要作用。随着数字世界的持续稳定增长，存储的数据量迅速增加，导致组织和个人数据堆积。因此，`SQL`\
  \ 作为一个存储这些数据的平台，同时提供不产生限制的直接访问。因此，`SQL` 用于不同的领域，包括电信、金融、贸易、制造业、机构和运输。它的存在主要处理数据，但在应用中也带有其他益处。\n\
  \n### 数据集成\n\n在上述领域中，`SQL` 的主要应用之一是创建管理员和人员经常完成的数据集成脚本。`SQL` 数据库由多个表组成，这些表可能包含不同的数据。当这些数据整合时，它会创建一个对于提供有意义的信息所需的新体验，从而提高效率。数据集成脚本对于任何组织（包括政府）都是至关重要的，因为它提供了可以用于促进实现设定目标的可信数据。\n\
  \n### 分析性查询\n\n数据分析师经常利用结构化查询语言来简化他们的操作，特别是在建立和执行查询时。也就是说，正如之前讨论的，`SQL` 包含多个由不同数据集组成的表。当这些数据结合时，它会带来对任何个人或组织至关重要的更全面的信息。这对于数据分析师同样适用，因为他们使用了类似的方面。当他们使用分析查询结构时，`SQL`\
  \ 中的查询和表被输入到结构中，以从不同的来源交付关键结果。在这种情况下，数据分析师可以轻松获取不同的查询并对其进行自定义，以获得更全面的数据作为解决方案。\n\
  \n### 数据检索\n\n这是 `SQL` 的另一个重要应用，即从包含大数据的数据库中的不同子集里检索数据。这在金融领域和分析中至关重要，因为数值的使用通常包含混合的统计数据。最常用的\
  \ `SQL` 元素是 `create`、`select`、`delete` 和 `update` 等。当用户可以快速搜索数据库并获取数据时，这种技术变得可行，因为\
  \ `SQL` 会筛选信息以提取所需的数据。在某些情况下，当所需数据缺失时，语言可能会提供相似或相关的数据。这至关重要，因为人们可以比较结果并在需要时进行更改。\n\
  \n# 结论\n\n如上述，`SQL` 在全球不同领域中使用，并应用于不同的领域以帮助数据管理。其中之一包括索引结构的修改，涵盖了有助于收集数据的路径，从而快速追踪感兴趣的信息。`SQL`\
  \ 还可以作为一种修改和更改数据库表的技术。也就是说，它有助于保持存储的数据为最新，从而消除了往往具有误导性的过时数据实例。\n\n# C#\n\n一周学习 C#\
