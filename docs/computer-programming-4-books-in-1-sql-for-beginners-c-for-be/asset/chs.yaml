  \n# 第 1 章：C# 简介\n\n学习编码将在这一过程中给你带来许多益处。它将让你创建你喜欢的某些程序和应用程序变得更容易。它将帮助你提升职业，提供许多易于操作的选项，并让我们从这些新技能中获得最大收益并获得更多收入。而且在某些时候，学习如何使用\
  \ `C#` 将是重要的，因为它允许我们了解更多关于计算机以及它们如何工作的知识。\n\n在进行编程工作时，有很多很棒的选择。许多语言被开发用于不同的项目，有时它们也用于不同类型的进程和应用程序。虽然这些语言中的许多可以根据你最初想通过该语言实现的目标而变得有用，但我们将查看如何使用\
  \ `C#` 语言，以及这种语言对于我们的需求来说有多棒。让我们深入研究 `C#` 语言以及如何让它满足我们的编程需求。\n\n## 什么是 C# 语言？\n\n\
  我们在这里首先需要查看的是 `C#` 语言。`C#` 是一种优雅且面向对象的语言，它非常有帮助，因为它允许程序员编写并构建各种健壮且安全的应用程序，所有这些程序都将在\
  \ `.NET Framework` 上运行。可以在各种项目中使用 `C#`，包括 Windows 客户端应用程序、Web 服务、客户端-服务器应用程序、`XML`\
  \ 数据库应用程序等更多。\n\n当我们使用 `C#` 时，我们会发现从视觉上看，它为我们提供了一个高级代码编辑器，以及一些更方便使用的用户界面设计器、集成的调试器以及其他工具，这些工具将确保基于这种语言开发我们的某些应用程序变得更容易。\n\
  \n`C#` 语言的独特之处在于，它不仅具有很高的表达能力并帮助我们处理想要处理的许多复杂代码，而且易于学习且简单。`C#` 语法中的大括号（curly-braces）看起来会很熟悉，特别是如果你以前用过\
  \ `Java` 或 `C++`。`C#` 非常有用，因为它能够简化 `C++` 语言中的某些问题，并为我们提供了一些强大的功能，包括空值、委托、枚举、lambda\
  \ 表达式甚至是直接内存访问——这些在 `Java` 等语言中是不具备的。\n\n此外，你会发现 `C#` 语言支持某些泛型方法和类型，这将有助于我们提供更高的类型安全和性能，并且它带有一些迭代器，这使得集合类的实现者能够定义客户端易于使用的自定义迭代行为。\n\
  \n由于这种语言属于面向对象的范畴，它能够支持许多属于该类别的话题和选项，我们将在以后更详细地探讨，包括多态、继承和封装。我们使用的所有方法和变量都封装在这些类的定义中。类可以直接继承一个父类，但可以设置为实现任意数量的接口。\n\
  \n这种语言的方法可以覆盖意外的重定义。当我们使用 `C#` 时，结构体（`struct`）类似于轻量级类。这意味着它是一种栈分配的类型，可以加载并实现接口，但在支持继承方面它无法提供帮助。\n\
  \n除了我们刚刚查看的一些基本原则外，你会发现 `C#` 通过一些构造使得开发软件的某些组件变得更容易，这些构造包括以下内容：\n\n1. 它能够通过使用委托（`delegates`）来封装我们的某些方法签名。这些将启用我们所需的类型安全事件通知。\n\
  2. 属性（`Properties`）将作为私有成员变量的访问器。\n\n\n\n\n### 3. 属性\n属性在程序运行时将帮助为某些不同类型提供声明式的元数据。\n\
  \n### 4. LINQ\nLINQ 代表“语言集成查询”（`Language Integrated Query`）。这非常有用，因为无论我们处理何种数据源，它都能为我们提供一些内置的查询能力。\n\
  \n当我们使用 `C#` 语言并使其满足某些需求时，我们可以看到很多优势。它是一种面向对象的语言，使得组织代码和将内容保持在一起变得更容易。当我们能够利用合适的\
  \ IDE 以及稍后将讨论的 `.NET` 平台时，我们就能利用它来创建我们需要的强大程序，而无需面对其他类似语言中常见的由于功能缺失而带来的复杂性。\n\n\
  ## .NET 框架\n\n在使用 `C#` 语言时，我们需要关注的另一个方面是 `.NET` 框架。这是微软开发的一个用于在 Windows 上良好运行的框架。它包含一个非常大的类库，被称为\
  \ `FCL` 或 `框架类库`（Framework Class Library），它能为我们提供语言互操作性，这意味着每种语言都可以使用其他语言编写的代码，并且跨越多种语言。\n\
  \n在类此类框架下编写的程序能够在软件环境中执行，而不是硬件环境，该环境被称为 `CLR` 或“通用语言运行时”（Common Language Runtime）。`CLR`\
  \ 是一个应用程序虚拟机，帮助为我们提供不同的服务，包括安全性、异常处理和内存管理。正因如此，用此框架编写的代码被称为托管代码。我们说过的 `CLR` 和 `FCL`\
  \ 共同成了我们所讨论的 .NET 框架。\n\n首先，`FCL` 非常重要。它为我们提供了一些用户界面、数据库连接、数据访问、Web 应用程序开发、算法、网络通信等。当程序员将他们正在编写源代码与\
  \ `.NET` 框架以及其他可用库结合时，就能生产出软件。\n\n该框架旨在与我们在 Windows 平台上想要创建的大多数新应用程序良好协作。此外，微软还将出一个专门用于\
  \ `.NET` 软件的 IDE，被称为 `Visual Studio`。\n\n`.NET Framework` 最初作为专有软件开始的，尽管后来它已经标准化以帮助在其他选项上运行。尽管进行了一些标准化工作，但大多数开发者对开源和免费实现的某些术语和前景感到不安。因此，微软公司改变了\
  \ .NET 开发模式，以帮助紧密遵循社区开发的软件项目现代模型，包括发布其专利更新以帮助解决这些疑虑。\n\n在 .NET 框架方面，有很多我们可以处理的内容。已经开发了一些方法不仅可以在\
  \ Windows 系统上运行，还可以在 Linux 和 Mac 等其他操作系统上运行。它能够帮助我们使用各种语言，特别是 `C#`，同时具有可移植性、安全性、高性能，并且在编写特定代码时能够很好地管理我们所需的内存。\n\
  \n## C# IDE\n\n在我们详细讨论如何编写代码以及使用 `C#` 语言可以做事情之前，我们需要更好地了解 IDE 是什么，以及为什么它是我们想要进行的任何编码中如此重要的部分。首先，IDE\
  \ 是一个集成式开发环境（integrated Development Environment），它基本上是一个我们可以用来帮助应用程序开发的程序。通常情况下，这是一个\
  \ `GUI` 或图形用户界面，旨在让任何开发者都能更容易地构建软件应用程序。很多时候，这些工具包含你所需的更多工具。\n\n大多数常用功能，如数据结构浏览、版本控制甚至调试，都在那里，帮助开发者执行操作，而无需在正在工作的不同应用程序之间来回切换。这使得最大化生产力变得更容易，因为我们可以为相关的组件提供相似的用户界面，并且将减少学习新语言的时间。此外，取决于你选择的哪种\
  \ IDE，它有时只支持一种语言，而其他时候会支持多种语言。\n\nIDE 背后的概念是从一些简单的基于命令的软件演变而来的，在当时，它并不像菜单驱动的软件那样有用。一些现代\
  \ IDE 将更多地用于我们的视觉化编程背景，而这些应用程序将通过移动代码节点或编程构建块（这些区块会生成流程图和结构图）来快速高效地创建。然后，根据你希望从过程中获得的结果，对它们可以进行编译，也可以进行解释。\n\
  \n花时间选择一个良好的 IDE 是重要的，在我们完成这一过程中，有许多需要考虑的因素。例如，我们需要花时间查看语言支持、操作系统需求以及某些成本。有时我们想要使用的\
  \ IDE 是免费的，但有时这些工具的功能是有限的。这通常取决于你想用该语言设计什么，以及哪些功能对你的编码需求很重要。\n\n市面上有很多适用于 `C#` 语言的良好\
  \ IDE 可用。重要的是进行一些研究并更多地了解它们是如何工作的，以及哪些具有你喜欢的功能，以获得最佳结果。当你做到这一点时，编写你喜欢的代码将变得容易得多。\n\
  \n## 在 Linux 和 Mac 上使用 C#\n\n虽然 `C#` 被认为是一种 Windows 语言，但我们同样可以在 Linux 和 Mac 计算机上处理并使用它。我们可能需要经过一些额外的步骤，有时我们在\
  \ Windows 上熟悉的某些功能将会缺失，但在其他操作系统上使用这种方案仍然能带给我们很多好处。\n\n对于 Linux 系统，作为 Mono 项目一部分的\
  \ `MonoDevelop` IDE 正你在 Linux 计算机上开发某些 C#` 代码所需的工具。你安装它最简单的方法是使用为 `Ubuntu` 开发的 `MonoDevelop`\
  \ 程序包。有时建议使用 `WinForms` 工具包，但这个工具可能不会那么高效和易用。\n\n我们还可以在 Mac 上设置这种语言。第一步是下载一个 IDE，`Visual\
  \ Studio Code` 通常是最好的选择，因为它在 Mac 上运行良好，并且仍然提供你所需的功能，同时保持了易用性。只需访问 Visual Studio\
  \ 网站（我们下一章中将更多关于 Visual Studio 的细节），然后点击下载到 Mac 的按钮即可。这将以压缩包的形式下载你所需的内容。\n\n\n\n\
  \n一旦你完成了此设置，就可以解压文件并将其拖到“应用程序”（Applications）文件夹中。你应该能够从那里下载它。下一步是去浏览并下载 C# 扩展程序。你可以进入\
  \ Visual Studio Code 并打开实现此功能所需的扩展程序。\n\n现在，在你执行这一过程时，你会发现扩展程序视图的顶部有一个搜索栏。这就是你输入“C#”的地方。你需要的是由微软（Microsoft）提供的那个，所以请确保点击这一个。点击安装即可开始工作了。\n\
  \n但请记住这个过程，C# 语言是一种为了在 Windows 系统上运行得得最好而开发的。因此，如果你使用的是 Windows 系统，你更有可能发现这种语言易于使用，而且你在编码中寻找的所有特性和功能，也更有可能出现在你预期的位置。\n\
  \n这并不意味着你完全无法在 Mac 电脑上运行它。这仅仅意味着你只需要额外执行几个步骤来完成设置，而且实现你想要的一些某些事情可能不会那么简单。花些时间在 Linux\
  \ 或 Mac 计算机上熟悉 C# 语言，对于帮助你在过程中获得最佳结果至关重要。\n\n# 第 2 章：为 C# 做好准备\n\n现在我们对 C# 语言以及它的本质有了更多的了解，是时候让我们深入研究并看看这种语言的一些要点，以及我们如何让这一切为我们的需求而工作。在本章中，我们将把\
  \ C# 的环境全部配置好并准备就绪，然后转向一些用 C# 编写代码的方法，以及帮助我们充分利用其价值的基础知识。让我们从 C# 语言以及我们如何利用它满足需求开始吧。\n\
  \n## 如何安装 Visual Studio Community\n\n这里首先要考虑的是确保我们的电脑已准备就绪。在安装 Visual Studio 程序之前，有几个步骤需要执行，包括：\n\
  \n1.  花点时间检查一下系统要求。这些要求将让我们了解计算机是否已配置以支持 `Visual Studio 2019`。我们将关注这个版本的 Visual\
  \ Studio，但其他某些版本的步骤也会类似。\n2.  应用所有可用的 Windows 更新。这些更新非常重要，因为它们将确保计算机拥有所有的系统组件和正确的安全更新，以处理\
  \ Visual Studio。\n3.  更新完成后，是时候重启系统了。这将帮助我们确保待处理的更新或安装不会阻碍我们安装 Visual Studio 的工作。\n\
  4.  你可能还需要清理计算机以释放一些空间。花点时间删除系统中不需要的应用程序和文件。你可以使用`磁盘清理应用`Disk Cleanup App）快速高效地完成此操作。\n\
  \n配置完成后，就可以下载 Visual Studio 程序了。你可以通过 Visual Studio 启动程序（bootstrapper）下载它。但要执行此，你需要访问微软\
  \ Visual Studio 网站并点击“下载”按钮。你可以选择安装，然后在打开文件夹之前保存。\n\n在这一部分，我们想要安装 Visual Studio\
  \ 安装程序。运行我们之前谈论的文件，以安装 Visual Studio 所需的所有内容。这是一个全新的轻量级安装程序，它将包含我们安装并随后自定义所需的 Visual\
  \ Studio 文件所需的所有部分。\n\n要开始此操作，我们需要进入`Downloads`（下载）文件夹，双击与下方文件之一匹配或相似的启动程序：\n\n\
  1.  `Vs_community.exe`：如果你下载的是 Visual Studio Community，就是这一个。\n2.  `Vs_professional.exe`：如果你下载的是\
  \ Visual Studio 专业版，就是这一个。\n3.  `Vs_enterprise.exe`：如果你下载的是 Visual Studio 企业版，就是这一个。\n\
  \n如果你执行此操作，将出现用户账户控制通知。请确保点击“是”。然后你需要浏览并确认你看到了“许可条款”和“隐私声明”。仔细阅读这些内容，然后点击“继续”。\n\
  \n然后是时候让我们查看选择工作负载（workloads）需要采取的一些步骤了。安装程序设置完成后，你可以通过浏览并选择想要处理的功能集或工作负载，使用它来帮助对安装进行一些自定义。你现在可以查看所有内容，看看它们是什么样的，以及你想要处理哪些内容。如果你决定以后需要更多功能，可以随时进入\
  \ Visual Studio 并进入`Tools`（工具）来添加更多功能。\n\n取决于你想要如何使用此工具，接下来你还可以处理若干个可选部分。例如，你可以更改它能够支持的语言。花点时间查看这些选项，并决定它们是否适合你。\n\
  \n当我们能够开始执行这些操作时，有几个步骤可以利用来实现这一目标，包括：\n\n1.  安装完成后，你可以选择`Launch`（启动）按钮以开始某些编码。\n\
  2.  在启动窗口中，你可以选择“创建新项目”。\n3.  当搜索框出现时，你可以输入想要创建的应用程序类型以查看模板列表。那里显示的模板取决于你在安装期间选择了哪些工作负载。你还可以通过`语言`（Language）下拉列表筛选特定的编程语言。可以通过`平台`（Platform）列表或`项目类型`（Project\
  \ Type）列表进行筛选。\n4.  当你做出这些决定后，你会发现 Visual Studio 将打开新项目，你就可以开始工作了。\n\n## 在 C# 中编写你的第一个程序\n\
  \n我们接下来需要查看如何在 C# 中编写你的第一个程序。对于学习如何在 C# 中编写程序的一些方法（或者你正在学习的任何语言）是非常重要的，而且当我们能够实际编写一些代码时，这会让过程中的处理变得更容易。\n\
  \n为了帮助我们开始此操作，我们需要打开文本编辑器，如`记事本`（Notepad）和`Visual Studio`，以便我们准备好编写所需的代码。一旦你把它们都打开并准备就绪，请确保输入以下代码，以查看更多关于这种语言如何运作：\n\
  \n```csharp\nclass FirstProgram\n{\n    static void Main()\n    {\n        Console.WriteLine(\"\
  UsingC# is fun.\");\n    }\n}\n```\n\n现在访问命令提示符并输入：\n\n```\ncsc FirstProgram.cs\n\
  ```\n\n执行此命令后，C# 编译器将处理此文件，并在代码所在相同位置创建一个 `.exe` 文件。例如，如果你将原始文件保存在桌面上，你应该应该在同一个位置看到一个名为\
  \ `FirstProgram.exe` 的新程序。如果你编写的代码中有错误，你将看到错误消息。\n\n\n\n\n现在你可以通过在命令提示符中输入 `FirstProgram.exe`\
  \ 来运行此应用程序。如果一切操作正确，你应该能看到命令提示符将显示消息：“Using C# is fun.”\n\n## 你的代码基础\n\n有了上面关于如何编写代码的信息，现在是时候进一步回顾这些内容，并学习每个部分对于我们所做的工作有多么重要。这将使我们在在此过程中更容易编写我们正在寻找的一些代码，而且这真的可以确保我们以后能够编写出一些更复杂的代码。C#\
  \ 代码的不同部分包括：\n\n首先，我们需要查看第一行。这一行将包含我们的标识符以及关键字。关键字是代码中的任何单词，它也具有某些特殊功能，可以引导编译器开始工作。通过这个关键字，就像我们在上面的示例中所做的那样，我们正尝试在该程序中创建一个新类。标识符在代码中被用得当时，将负责列出类、方法和变量。特别是这一个被称为\
  \ `FirstProgram`。\n\n然后，我们将移动到上面代码的第三行。我们将花费时间来定义 `Main()` 方法。它是我们在计算机上看到的任何应用程序的起点。无论该方法在我们代码中的哪个位置，程序都将通过执行此方法来启动。这里有两个主要的单词适合这里，`static`\
  \ 和 `void`，就像你在上面看到的那样。这将帮助我们确定代码中将看到哪个对象。\n\n现在我们可以跳到代码的第五行。这是我们目前需要查看的最后部分，因为它包含了我们希望在整个程序执行后在计算机上显示的消息。这将依赖于\
  \ `WriteLine()` 方法，以便你实际上能让它显示在屏幕上。通过这部分的帮助，你还可以进一步，添加任何你想要数量的消息。\n\n除了我们刚刚介绍的话题外，你可能注意到代码中出现了许多大括号。这些大括号很重要，因为它们会将代码分成不同的块，这样你就可以更容易地分离部分。请记住，当你编写要在\
  \ C# 中使用的某些代码时，分号也很重要，就像我们在 Java 和 C 中看到的那样。\n\n# 第 3 章：C# 关键字\n\n另一个我们需要花些时间查看的课题是\
  \ C# 关键字。这些是被保留和预定义的标识符。它们被设定为对编译器具有特殊含义，并且基本上将是编译器应该遵循的命令。你不应该在程序中使用这些词汇作为标识符，除非它们带有\
  \ `@` 符号作为前缀。例如，`@if` 将是一个有值的标识符，但它将不会，因为这是一个关键字。\n\n我们将查看的第一个将包含你在编写 C# 程序时作为保留标识符的所有关键字。然后，我们将暂时离开这个话题，查看一些可用的上下文关键字（contextual\
  \ keywords）。\n\n普通关键字和上下文关键字之间存在区别。例如，上下文关键字具有某些特殊含义，但仅在限于程序上下文中，而我们可以在该上下文之外将它们用标识符。这使得它们与我们对某些普通关键字所做的操作有所不同。\n\
  \n通常情况下，随着我们未来向 C# 中添加更多此类关键字，我们会发现它们将作为上下文关键字添加到库中。这样做的目的是为了确保我们不会破坏或损坏程序员在早期版本中能够编写的某些程序。\n\
  \n我们能够利用许多关键字使 C# 程序按照我们想要的方式运行。我们能够处理的一些最常见的关键字包括：\n\n| While | Volatile | Void\
  \ | Virtual | Using static |\n| Using | Ushort | Unsafe | Unchecked | Ulong |\n\
  | Uint | Typeof | Try | True | Throw |\n| This | Switch | Struct | String | Static\
  \ |\n| Stackalloc | Sizeof | Short | Sealed | Sbyte |\n| Return | Ref | Readonly\
  \ | Public | Protected |\n| Private | Params | Override | Out | Operator |\n| Object\
  \ | Null | New | Namespace | Long |\n| Lock | Is | Internal | Interface | Int |\n\
  | In | Implicit | If | Goto | Foreach |\n| For | Float | Fixed | Finally | False\
  \ |\n| Extern | Explicit | Event | Enum | Else |\n| Double | Do | Delegate | Default\
  \ | Decimal |\n| Continue | Const | Class | Checked | Char |\n| Catch | Case | Byte\
  \ | Break | Bool |\n| Base | As | abstract | | |\n\n从那里一点开始，我们能够处理所谓的上下文关键字。这些与我们在某些其他选项中找到的有所不同。它们仍然很重要，但将取决于我们正在处理的代码部分，以及我们希望从中获得什么。\n\
  \n作为开始，上下文关键字将用于在我们的所的代码中提供一些特定的含义，但它不会像随后的其他关键字那样被保留。例如，我们看到的一些上下文关键字包括：\n\n| Yield\
  \ | Where (the clause) | Where (generic type constraint) | When (filter condition)\
  \ |\n| Var | Value | Unmanaged (generic type constraint) | Set |\n| Select | Remove\
  \ | Partial (method) | Partial (type) |\n| Orderby | On | Nameof | Let |\n| Join\
  \ | Into | Group | Global |\n| Get | From | Equals | Dynamic |\n| Descending | By\
  \ | Await | Async |\n| Ascending | Alias | add | |\n\n# 第 4 章：文件输入与输出\n\nC# 语言中的文件概念将是非常重要的，因为它们将确保我们能够在代码中看到我们想要的结果，并且我们能够根据我们实现的目标提取不同的部分。\n\
  \n这些文件很容易处理，但我们仍然对每个文件执行一些不同的操作，以确保它们将按照我们想要的方式工作。我们可以设置文件来保存我们想要做的工作，并组织我们想要处理的代码的不同部分。这需要一些编码和一些工作才能让这一切结合并以你喜欢的方式运行。\n\
  \n## 实现文件输入和输出运算符\n\n\n\n\n我们首先需要查看的是如何实现这些操作。能够接受用户某种类型输入的程序同样能够处理这些输入并产生某种输出。所有的编程语言都将支持这种功能以使其运行。文件将作为存储在我们磁盘上的、具有特定名称的数据集来提供帮助，还包括一个需要遵循的目录路径。我们供我们打开以进行读写数据的文件被称为\
  \ `stream`（流）。\n\n进一步来说，`stream` 将是一系列字节，这些字节从源头通过我们设置的通信路径到达终点。当然，两个基本的流是 `input`（输入）和\
  \ `output`（输出）。这些种流都将关联某种函数。`input` 流用于帮助执行 `read`（读取）操作，而 `output` 流则用于我们的 `write`（写入）操作。\n\
  \n`system` 的 `input` 和 `output` 命名空间通常与许多类一起工作，这些类旨在帮助我们完成代码中需要执行的任务。其中一些将包括读取操作、删除文件、创建文件以及写入操作。为了让我们更好地了解如何描述属于此类命名空间的一些类，我们可以查看以下信息：\n\
  \n1. `FileStream`：这将用于帮助我们在文件中的任何位置进行读取和写入。\n2. `BinaryReader`：这将用于帮助我们从 `binary\
  \ stream`（二进制流）读取一些更原始的数据类型。\n3. `BinaryWriter`：当我们想要将之前的原始数据类型写入二进制格式以便其进入 `binary\
  \ stream` 时，将使用此类。\n4. `StreamReader`：这是一个非常值得学习的类，因为它能够从 `byte stream`（字节流）中读取我们需要的字符。\n\
  5. `StreamWriter`：这将帮助我们将我们想要的字符写入到 `stream` 中。\n6. `StringReader`：这与我们说过的其他类类似，但它将用于帮助我们从\
  \ `string buffer`（字符串缓冲区）中读取内容。\n7. `stringWriter`：再次，这个与它类似，但这次我们将写入我们正在使用的那个 `string\
  \ buffer` 中。\n8. `DirectoryInfo`：这将用于对目录等等执行某些操作。\n9. `FileInfo`：这个非常重要，因为它将帮助我们对文件执行操作。\n\
  \n## FileStream 类\n\n现在我们已经讨论了这里的某些不同部分，我们还需要特别查看一下这个类。文件输入输出的操作将在我们之前讨论过的 `System\
  \ IO` 命名空间中实现。用户可以操作此类来读取、写入和关闭文件。\n\n从那里开始，我们过的类都继承自一个抽象类。这个抽象类被称为 `Stream`。在创建此类\
  \ `FileStream` 类中发现的对象时，我们可以使用的语法示例如下所示：\n\n```\nFileStream <objectname> = new FileStream\
  \ ( <file name>, <file Mode Enumerator>, <File Access Enumerator> , <FileShare Enumerator>\
  \ );\n```\n\n## FileMode 枚举\n\n我们需要查看的下一步是 `FileMode` 枚举。这非常重要，因为它将帮助我们定义打开所需文件的方法。它还被用于限制文件可以打开的模式，或者用户打开文件的方法。该枚举的参数将非常重要，因为它们将检查该特定文件是否可以被覆盖、创建或打开。你在这里将使用的枚举成员如下所示：\n\
  \n1. `Append`（追加）：我们使用此成员在文件已创建时帮助打开它，然后它会将光标置于末尾，以便我们可以添加一些想要的内容。如果文件不存在，它将为我们创建一个新文件。\n\
  2. `Create`（创建）：这是帮助我们创建新文件的成员。\n3. `CreateNew`（新建）：当我们想要指定新文件需要在哪个操作系统中创建时，将使用此成员。\n\
  4. `Open`（打开）：这将通过打开一个已经存在的文件来帮助我们。\n5. `OpenOrCreate`（打开或创建）：可以使用此成员，因为它有助于指示系统：如果文件存在则打开它，否则创建一个新文件。\n\
  6. `Truncate`（截断）：这很重要，因为它将为我们打开一个新文件。当它被打开时，文件将通过截断过程，该文件的大小从开始将为 0 字节。\n\n然后我们需要查看一些我们可以使用的\
  \ `FileAccess` 枚举。对于此项，文件将被打开以便我们对其进行操作。这里的枚举将帮助我们确定用户是想读取数据还是想写入数据。这是可能的。该枚举的成员包括\
  \ `ReadWrite`、`Write` 和 `Read`。\n\n最后我们需要花时间查看 `FileShare` 枚举。该枚举包含了一些 `FileStream`\
  \ 构造函数使用的常量。该枚举的作用是帮助我们定义其他应用程序是否同时读取同一个文件。\n\n1. `Inheritable`（可继承）：这将允许我们的句柄传递给子进程。\n\
  2. `Note`（注意）：此项将拒绝共享文件。\n3. `Read`（读取）：这将允许用户打开文件。但用户只能读取文件，而不能进行任何更改、添加或写入。\n\
  4. `ReadWrite`（读写）：这将允许用户对文件中执行他们想要的操作——读取、写入或两者的结合。\n5. `Write`（写入）：这将允许我们打开文件并对该文件进行更改。\n\
  \n## 如何在文件中实现读取和写入\n\n接下来我们需要查看如何设置文件，以便我们能够读取和写入找到其中的文本。对于这一点，`Stream` 类将非常重要。例如，该类将用于在文件中读取和写入我们需要的任何数据。`StreamWriter`\
  \ 和 `StreamReader` 类将帮助我们完成这项工作。\n\n我们需要查看的第一个选项将是 `StreamReader` 类。这是一个继承自 `TextReader`\
  \ 类的类，后者是抽象的但仍然很重要。该类在这里非常有帮助，因为它代表了读取器能够读取那里存在的字符。\n\n有一些方法可以配合此项来处理该类。其中一些包括：\n\
  \n\n\n\n1. `Close`: 此方法将关闭 `StreamReader` 类对象和 `stream`，然后释放与该读取器关联的系统资源。\n\n2.\
  \ `Peek`: 此方法将通过返回下一个可用的字符来帮助我们，但它不会消耗该字符。\n\n3. `Read`: 此方法将读取下一个到的字符，也可以是流中的一组字符。\n\
  \n4. `ReadLine`: 此方法将帮助我们从当前系统中读取一行字符，然后帮助我们将这些内容全部以数据字符串的形式返回。\n\n5. `Seek`: 此方法将允许我们处于读写位置，并允许我们将位置移动到文件内部的任何位置。\n\
  \n为了更好地了解我们如何操作这个特定的类，并让我们能够用这种语言轻松地从任何想要文件中读取数据，我们可以查看以下代码：\n\n```csharp\nclass\
  \ Program\n{\n    public void ReadData()\n    {\n        FileStream fs = new FileStream(\"\
  E:\\\\data.txt\", FileMode.Open, FileAccess.Read);\n        StreamReader sr = new\
  \ StreamReader(fs);\n        sr.BaseStream.Seek(0, SeekOrigin.Begin);\n        string\
  \ str = sr.ReadLine();\n        while (str != null)\n        {\n            Console.WriteLine(\"\
  {0}\", str);\n            str = sr.ReadLine();\n        }\n        sr.Close();\n\
  \        fr.Close();\n    }\n\n    static void Main(string[] args)\n    {\n    \
  \    Program p = new Program();\n        p.ReadData();\n        Console.Read();\n\
  \    }\n}\n```\n\n现在，我们可以更深入地查看并操作它。我们可以看到，有一个 `FileMode` 属性值被我们将用于打开文件，然后有一个 `FileAccess`\
  \ 属性值允许我们读取文件。文件 `data.txt` 将处于打开模式，并为读取操作准备好流。从那里开始，我们将看到读取器语句是为了创建该类的新实例，以便该文本文件能够使用它。\n\
  \n这里最后需要注意的一点是 `Seek()` 方法。这是一个重要的方法，因为它允许我们有机会将读取位置移动到文件的开头。这将允许我们一直读取，直到到达该文件的末尾。\n\
  \n列表中的下一个是 `StreamWriter` 类。这与我们讨论过的其他选项相似，但这个类允许我们更进一步向文本文件中写入内容，而不仅仅是读取。它继承自名为\
  \ `TextWriter` 的抽象类。该类代表一个写入器，随后能够向文件中写入任意数量的字符。当我们使用此类工作时，我们可以依赖的一些方法包括：\n\n1.\
  \ `Close`: 此方法将帮助我们关闭当前操作的对象和流。\n\n2. `Flush`: 此方法将帮助我们清除当前写入器的所有缓冲区，并将任何已缓冲的数据写入流中。\n\
  \n3. `Write`: 此方法将我们想要的内容写入流中。\n\n4. `WriteLine`: 这将帮助我们写入由重载参数指定的数据，随后是换行符。\n\n\
  下面的代码是一个很好的练习示例，因为它帮助我们实现此类，使其能够接收来自用户的数据，然后将所有数据写入我们选择的文件。\n\n```csharp\nclass\
  \ Program\n{\n    public void WriteData()\n    {\n        FileStream fs = new FileStream(\"\
  E://data.txt\", FileMode.Append, FileAccess.Write);\n        StreamWriter w = new\
  \ StreamWriter(fs);\n        Console.WriteLine(\"Enter the string\");\n        string\
  \ str = Console.ReadLine();\n        w.Write(str);\n        w.Flush();\n       \
  \ fs.Close();\n    }\n\n    static void Main(string[] args)\n    {\n        Program\
  \ p = new Program();\n        p.WriteData();\n        Console.Read();\n    }\n}\n\
  ```\n\n\n\n\n当你处理这个 `if` 语句时，你会发现当它运行时，只有当用户提供的输入与代码中设置的条件匹配时，代码才会向我们回复。当这种情况发生时，代码就可以执行，并且通常会显示某种消息，这取决于程序员在代码中编写了什么内容。有时你还会设置让它执行其他操作。\n\
  \n然而，如果用户输入的内容与我们设置的条件不匹配，那么屏幕上将什么都不显示。这可能会导致一些问题，这这就是为什么 `if` 语句可能不像其他一些选项那样被频繁使用。\n\
  \n这一切中的好消息是，你会发现，即使是初学者，这些 `if` 语句也很容易设置和使用。让我们来看下面的代码，看看我们如何在 `C#` 语言中为我们自己的需求创建一个这样的\
  \ `if` 语句：\n\n```csharp\nIf (x > 0)\n{\n    Console.Write(\"The value is positive.\"\
  );\n}\n```\n\n通过我们上面列出的示例，某些事情需要发生。如果用户输入的值大于零，程序将被设置为打印“The value is positive”。然而，如果表达式结果为假，或者输入小于零，那么程序将忽略\
  \ `Console.Write` 之后的整个语句并继续运行。\n\n## 深入了解 If Else 语句\n\n正如我们在处理 `if` 语句时很快就能发现的，在很多情况下，这些语句无法帮助我们按照想要的方式完成任务。你不想设置一些健性不足以处理你想要的工作的代码。设置一个让用户可以输入内容，然后程序直接结束或冻结的代码绝不是一个好主意。这就是我们将来看一种新的条件语句，被称为\
  \ `if else` 语句。\n\n`if else` 语句将是一个非常好用的工具，因为它为我们正在编写和构建的代码添加了大量功能，同时仍然允许我们添加多个选项，并处理用户添加到程序中的几乎任何内容。有时我们只只添加一或两个选项，但有时我们也可以使用\
  \ `if else` 语句来处理在此过程中大量的选项。\n\n直入主题，我们需要查看一下 `if else` 语句的语法，以便更好地理解它在 `C#` 语言中如何工作。下面是该语句语法的一个很好的示例：\n\
  \n```csharp\nIf (the Boolean expression)\n{\n    The statement/s you want to run\
  \ if the result is true;\n}\nElse\n{\n    The statement/s you want to run if the\
  \ result is false;\n}\n```\n\n正如你已经看到的那样，`if else` 语句将带来更多的功能。这是 `if else` 语句的一个基础选项，但你能够添加更多行来使其变得更强大。通过这些\
  \ `if else` 语句，如果答案为假，你的代码将继续执行语句的后续部分以检查该部分是否为。如果有两个以上的选项，它将继续向下执行 `if else` 语句直到答案变为真，然后它将显示出现的消息。\n\
  \n现在我们已经花了一些时间讨论它，是时候看看它是如何运行的示例了，这样你可以将其用于自己的代码中：\n\n```csharp\nIf (x > 0)\n{\n\
  \    Console.Write(\"This value will be positive.\");\n}\nElse\n{\n    Console.Write(\"\
  The value is less than or equal to zero.\");\n}\n```\n\n你会发现，当我们处理上面的示例工作时，`else`\
  \ 子句是非常重要的，或者至少在布尔表达式结果为假之前它是隐藏的。当过程实际上需要 `else` 语句时，它就在那里。但如果我们最终得到一个真值，那么第一个语句将是显示的那个，这样我们完全不需要\
  \ `else` 语句。\n\n## 嵌套条件语句到底是什么\n\n每当我们查看 `C#` 自带的一些新代码时，你都会发现使用我们上面的两个语句更容易操作，或者你也可以将它们组合起来，为某些代码创建一个嵌套条件语句。在嵌套条件语句中，我们将采取上述条件语句类型之一并将其放在另一个语句内部。这样做的目的是为我们想要看到的代码工作添加一些复杂性，并在需要时真正地为我们提供一链条件。\n\
  \n在处理任何嵌套条件语句时，我们必须关注的重点是，如果你在编写语句时发生任何错误，都会导致整个部分出错，并且可能需要时间来修复。这使得它们在过程中变得有些难以处理和操作，所以请小心。\n\
  \n然而，它们的独特之处，以及让它们非常有吸引力的一点是，它们允许我们根据需要添加尽可能多或尽可能少的级别。尽管如此，该语言的大多数专业人士建议嵌套语句保持在三层或以下，以防它们在处理过程中变得太混乱。\n\
  \n如果你在处理这些语句时最终超过了第三层，你可能会得到一个不受控且不按你想要的方式运行、且可能无法工作的东西。\n\n```csharp\nDouble r\
  \ = 60;\nDouble s = 70;\n\nIf (r == s)\n{\n    Console.WriteLine(\"These numbers\
  \ are equal.\");\n}\nElse\n{\n    If (r > s)\n    {\n        Console.WriteLine(\"\
  The value of the first variable is greater than the second.\");\n    }\n    Else\n\
  \    {\n        Console.WriteLine(\"The value of the second variable is greater\
  \ than the first.\");\n    }\n}\n```\n\n\n\n\n\n在本章中，我们将花费一些时间回顾 C# 运算符的基础知识，以便了解有分种类型、在何时需要使用每种类型以及更多内容。\n\
  \n## 什么是算术运算符？\n\n我们需要查看的第一种运算符是算术运算符。这些非常基础，你熟悉的任何数学符号（如加法、减法、乘法等）都属于这一类。你可能对此处出现的大部分运算符都非常熟悉。因此，每当我们想要使用这些算术运算符时，请记住，它们的作用是帮助我们告诉编译器现在是时候进行数学计算了。\n\
  \n使用这些运算符时，只要代码中出现了正确的数学符号，并且数字放在了正确的位置（这取决于你最终想要的答案），算术选项就能完美地满足你的需求。考虑到这一点，你可以使用的一些最优秀的算术运算符包括：\n\
  \n*   `+` 这是加法运算符。它将把两个操作数相加。例如，你会得到 `x+y=25`。\n*   `-` 这是减法运算符。它允许你从左侧操作数的值减去右侧操作数的值。例如，你会得到\
  \ `y-x=-5`。\n*   `*` 这是一个告诉计算机将两个操作数相乘的运算符。你可以执行 `x*y=150`。\n*   `/` 这个运算符告诉计算机将左侧操作数除以右侧操作数。例如，`y/x`。\n\
  *   `%` 通常称为取模运算符的取余部分。它将左侧操作数除以右侧操作数，然后返回余数。\n*   `++` 是递增运算符。它将操作数的值加一。例如，你会得到\
  \ `++x=16`。\n*   `--` 程序员通常称其为递减运算符。它将操作数的值减一。这意味着你会有 `–x=14`。\n\n在很多时候你都需要使用这些算术运算符，这通常取决于你的程序在过程中是否需要加法、减法或进行其他类型的数学计算。如果你尝试将代码的两个部分相加（即使它们不是数字），这很有帮助。当你查看本指南中我们将做的代码时，你可能也会看到其中一些运算符出现。\n\
  \n## 什么是赋值运算符？\n\n在编写的某些代码中，你会用到算术运算符。但这些并不是你可能想要使用的唯一运算符类型。既然我们已经对它们及其工作原理有所了解，是时候处理\
  \ C# 中我们可以使用的第二种运算符了，即赋值运算符。\n\n我们将在接下来的某些章节中更多地讨论变量。但这些变量基本上是我们代码的一部分，能够帮助我们在内存中为我们选择的值留出一个位置。这对于我们想要做的某些工作将非常有用。但我们需要确保能够为变量赋值。如果没有这样做，我们就会遇到问题，因为我们只是在计算机的内存中预留了一个空位。\n\
  \n在所有可选的赋值运算符中，最常见的非常简单。这意味着我们可以在代码中定义变量，然后只需要在变量和想要赋值给变量的值之间放一个等号。编译器会注意到等号并确切知道你正尝试做什么。\n\
  \n虽然等号是最常用的选项，但还有其他几个属于赋值运算符这一术语范围的可用运算符。其中一些包括以下内容：\n\n*   `=` 此运算符允许你执行简单的赋值操作。它将值分配给你当前正在处理的变量。例如，编写\
  \ `int sample = 100` 将告诉程序你想将 100 赋值给名为 `sample` 的变量。它不会对该变量或涉及的值执行任何额外处理。\n*  \
  \ `+=` 这是累加赋值运算符。它会将你的两个操作数的值相加，然后将和赋值给左侧操作数。\n*   `-=` 程序员通常称此为减法赋值运算符。它将右侧操作数的值减去左侧操作数的值，然后将差赋值给左侧操作数。\n\
  *   `*=` 此运算符将每个操作数的值相乘，然后将积赋值给左侧操作数。\n*   `/=` 这是你将两个变量相除，然后将结果赋值给左侧变量。\n\n当你决定在代码中添加一个赋值运算符时，你必须确保两个操作数都属于相同的数据类型类别。在某些情况下，编写代码时，你选择的操作数最终可能是不兼容的，使用它们将导致程序难以以你想要的方式运行。因此，如果你在代码中确实遇到了错误。\n\
  \n## 什么是关系运算符？\n\n到目前为止，我们查看了算术运算符。这些是帮助我们进行数学运算的运算符。然后我们介绍了赋值运算符。最常用的选项是等号，用于给一个值。现在是时候介绍关系运算符并看看它们是什么了。\n\
  \n关系运算符在许多代码中都很重要，因为它们确保我们有一种比较操作数值的简单方法。由于我们可以进行这种比较，这些通常出现在我们之前讨论过的条件语句中。\n\n\
  考虑到这一点，我们需要花时间仔细查看 C# 语言中可用的关系运算符类型，因为有很多供你选择。为了帮助确保这些运行良好，并让我们完全理解它们如何工作，假设现在 `d\
  \ = 100` 且 `e = 150`。考虑到这一点，C# 语言中的一些关系运算符包括：\n\n*   `==` 这是用于检查两个值是否相等的运算符。如果两个值最终相等，运算符将告诉你它是真。否则，运算符将告诉你它是假。例如，认为\
  \ `d == e` 将显示为假。\n*   `!=` 此运算符允许你测试两个值是否不相等。如果值最终不相等，它将告诉你这是真。例如，`e != d` 的结果为真。\n\
  *   `>` 此运算符用于检查左侧操作数是否大于右侧操作数。如果是，那么运算符将告诉你它是真。例如，认为 `e > d` 将是真。\n*   `<` 这是小于运算符，它允许你检查左侧操作数是否小于右侧操作数。如果是，你将得到真值结果，例如公式\
  \ `d < e`。\n\n\n\n\n\n*   `>=` 这是一个运算符，如果左侧的操作数大于或等于右侧的操作数，它将为真（true）。否则，它会告诉你该语句为假（false）。例如，`e\
  \ >=d` 求值结果为真。\n*   `<=` 使用此运算符，如果左侧的操作数小于或等于右侧的操作数，你将得到真值。例如，`d <= e` 是真的。\n\n\
  现在，对于这部分，我们并不想让它变得比必要的更复杂。但我们必须记住，当涉及到这些运算符时，我们最终得到的结果始终是布尔值（Boolean）。这并不复杂。它仅仅意味着我们通过这些关系运算符得到的任何答案要么为假（false），要么为真（true），而这取决于你添加到代码中的条件。\n\
  \n与这一想法一样，当我们使用关系运算符时，我们必须检查等号的数量是否正确。例如，如果你尝试使用我们在上面展示的相等运算符，那么需要两个等号而不是一个。如果你混淆了这些运算符，最终得到一个赋值运算符而不是关系运算符，代码要么不会按照你预想要的方式运行，要么会显示错误信息。\n\
  \n## 什么是逻辑运算符？\n\n我们已经愉快地查看了这种语言中能够处理的一些不同运算符，现在是时候让我们转向我们工作中也可用的一些逻辑运算符了。这些逻辑运算符也将依赖于布尔表达式，因为它们将接受一个布尔值，并在处理完成后为我们提供一个新的布尔值。这一个与其它一些运算符一样，当你将它们添加到代码中时，它们将接受并依赖于真（true）或假（false）的答案。\n\
  \n现在，当是处理这些可以添加到 C# 代码中的逻辑运算符时，你会发现有四个主要的运算符是可以花精力关注的。我们将在下面查看一些这些运算符如何运作的示例。但请记住，这里我们假设\
  \ `c` 是真的，`d` 是真的，而 `e` 是假的。在考虑到这些的基础上，我们可以查看可能出现在我们代码中的以下逻辑运算符：\n\n*   `&&` 这个运算符被称为逻辑与（AND）。只有当两个操作数都为真时，它的结果才为真。例如，`d\
  \ && c` 求值结果为真。\n*   `||` 这是逻辑或（OR）。只要你的操作数中至少有一个为真，这个运算符就会给你一个真值。例如，`c || e` 的结果为真。\n\
  *   `^` 这个运算符是逻辑异或（Exclusive OR），它对于二进制数据非常好。就像处理逻辑值一样，这种运算符只会在操作数为 1 的地方给你 1。如果两个操作数都是假或都是真，运算符将给你一个假。\n\
  *   `!` 使用这一个，你能够反转布尔变量的值。例如，如果你输入 `!d`，你将得到一个假值。\n\n## 什么是位运算符？\n\n现在我们已经花了一些时间过了几类运算符，特别是那些在其他情况下可能工作的编程语言中常见的运算符，现在是时候观察一种新类型的运算符，它可能不那么常见，你可能也不会经常使用它，但它对于帮助你代码中的工作将非常重要。这些将被称为位运算符（Bitwise\
  \ operators）。\n\n位运算符与逻辑运算符发现的非常相似，在开始时，看起来你正在处理完全相同的东西。这种位运算符与逻辑运算符之间的主要区别在于，前者将取一个二进制值然后将其转换为布尔值。\n\
  \n为了简单起见，二进制值将由 0 和 1 组成，看起来不像我们习惯从计算机中看到的单词。让我们来看看我们这里能够处理的不同类型的位运算符。\n\n为此，让我们假设\
  \ `I = 0`，`h = 1`，`j = 0` 且 `g = 1`\n\n*   `&` 这是被称为位与（Bitwise AND）的运算符。它会在两个操作数都为\
  \ 1 的位置赋值 1。例如，`g & h` 将给你 1。\n*   `|` 这是位或（Bitwise OR）。它会在至少有一个操作数为 1 的位置赋值 1。例如，执行\
  \ `h | 1` 将给你一个为 1 的结果。\n*   `^` 这是异或（exclusive OR），它在二进制数据上运行得很好。就像处理逻辑值一样，这种运算符只会在操作数为\
  \ 1 的地方给你 1。例如，如果你执行 `g^j`，你将得到为 1 的结果。\n\n你会发现，与我们讨论的其他运算符相比，位运算符在完成任务方面需要承担更多工作。确实，你在初学者代码中可能不会花费大量时间查看和研究这个运算符。但它仍然是一个值得进一步学习的重要运算符，我们花时间学习如何让它工作也是值得的。\n\
  \n正如我们所看到的，有很多不同类型的运算符我们可以处理，每一个都能帮助我们在长远未来完成工作。每个运算符的目标都是不同的，所以它通常取决于我们希望代码中看到什么。\n\
  \n# 第 7 章：观察多态\n\n当我们处理 C# 语言时，需要关注的下一个问题是多态（Polymorphism）。在很多情况下，它被视为面向对象编程的第三支柱，另外继承和封装。这是一个重要的主题，出现在我们将关注的一些更高级的部分。\n\
  \n从开始，多态基于希腊语单词“多种形状”。有两个主要方面使之成为一个我们需要关注的特定问题，这些包括：\n\n1.  在运行时，我们派生类中的对象将被视为基类的对象，包括数组、集合和方法参数。当这种情况发生时，对象的声明类型与其运行时的类型并不相同。\n\
  2.  我们看到的基类将定义并实现一些虚方法，然后派生类可以重写（override）它们。这意味着它们可以在处理过程中提供自己的实现和定义。\n\n虚方法的存在是为了让我们能够处理一组相关但方法统一的对象。例如，也许你可能正在编写一个绘图应用程序，允许你的用户在绘制画布上创建各种形状。当你开始时，你无法在编译时知道用户想要创建哪些形状，因为预测人类行为总是很困难。\n\
  \n\n\n\n然而，即使面临这种挑战，此程序仍然需要注意并保留我们能够处理的形状以及用户创建的形状的信息，然后它必须能够根据用户对鼠标的操作以恰当的方式更新它们。这里巧妙的思路是，我们可以利用多态性，通过两个基本步骤来解决这个问题。这两个步骤将包括：\n\
  \n1. 我们能做的第一步是创建我们自己的类层次结构，其中所有的形状类都派生自某个公共基类。\n2. 另一个我们可以采用的选项是引入虚方法（virtual method），这可以确保当我们仅通过基类方法进行调用时，派生类中正确的方法也能被执行。\n\
  \n考虑到这一点，我们需要首先开始创建一个名为 `Shape` 的基类，然后我们需要遍历并创建一些需要的派生类，例如 `Circle`（圆形）、`Triangle`（三角形）和\
  \ `Rectangle`（矩形）。我们可以给形状类提供一个名为 `Draw` 的虚方法，然后在所有派生自原始类的类中重写（override）它，以便我们能够实际上画出该类应该代表的且用户寻找的形状。\n\
  \n从那里开始，我们将通过创建自己的 `List<Shape>` 对象，并从中添加一个 `Circle`、一个 `Rectangle` 和一个 `Triangle`。如果我们想要更新应用程序内部的绘制表面，我们希望使用\
  \ `foreach` 循环来遍历列表，并调用列表中每个 `Shape` 对象的 `Draw` 方法。\n\n尽管列表中的所有对象都已声明它们所属的 `Shape`\
  \ 类型，但现在是时候查看运行时将要调用的类型了。如果我们愿意，这将是我们在处理过程中派生的每个类中找到的方法的重写版本。\n\n在处理这类过程时，我们需要记住的一点是，在这种语言中，每个类型都是多态的，因为所有的类型——甚至是用户可以自己定义的类型——都会继承自\
  \ `object`。这与我们看到的某些其他选项略有不同，因此我们需要跟踪这一点并确保我们以正确的方式使用它，因为它在我们想要关注的其他语言中并不存在这种特性。\n\
  \n我们还需要考虑的另一点是随这一过程而来的虚成员（virtual members）。当我们查看其中一个派生类以及它如何继承自基类时，它将获得基类的所有字段、方法、事件和属性。设计其中一个新类的人可以在几种操作之间进行选择，以便该类按照他们想要的方式运行。其中一些选项包括：\n\
  \n1. 他们可以重写基类中找到的一些虚成员。\n2. 他们可以并继承我们基类的某些方法，而完全不需要重写该基类。\n3. 他们可以并定义一些不被视为虚的新实现，而这些成员将帮助我们在某些时候隐藏基类的实现。\n\
  \n但我们必须记住的是，在某些情况下，派生类能够进入并重写基类成员，但仅当基类成员被声明为 `abstract`（抽象）或 `virtual`（虚）时。派生成员需要配合\
  \ `override` 关键字，以指示我们正在处理的特定方法应该参与我们在这里花费时间的调用。\n\n此外，字段（fields）不是我们可以转换为虚对象的东西。只有属性、索引、事件和方法可以变成虚的。当派生类能够重写一个虚成员时，即使我们通过我们使用的基类实例来访问该类时，该成员也会被调用。\n\
  \n虚方法以及随之而来的属性将使派生类能够执行，并使扩展基类变得，而无需实际上执行该方法上通常需要的某些实现工作。当我们想要定义正在处理的方法，或者当我们想要处理一组将实现留给派生类的方法时，接口（interface）也是一种很好的方法。\n\
  \n在多态性的概念上，我们可能想要处理的另一个问题是如何用我们想要处理的一些新成员来隐藏某些基类成员。如果你想处理某些派生成员并让它们以我们在基类成员中看到的完全名称出现，但我们将处理某些虚调用，你可以使用\
  \ `new` 关键字。这是一个我们将放在类成员之前的关键字，该成员将是我们尝试用它替换的返回类型。下面的代码将向我们展示这是如何实现的：\n\n```csharp\n\
  public class BaseClass\n{\n    public void DoWork() { WorkField++; }\n\n    public\
  \ int WorkField;\n\n    public int WorkProperty\n    {\n    }\n}\n\npublic class\
  \ DerivedClass : BaseClass\n{\n    public new void DoWork() { WorkField++; }\n\n\
  \    public new int WorkField;\n\n    public new int WorkProperty\n    {\n     \
  \   return 0;\n    }\n}\n```\n\n当你有一个隐藏的基类成员时，通过将该类的实例转换为我们正在使用的基类实例，仍然可以通过客户端代码访问它。\n\
  \n列表中下一个关注的重点是学习如何防止派生类进入并重写虚成员。这些虚成员将保持虚属性，无论你通过多少个类来声明它们。\n\n在这种情况下，如果我们想引出原始类或\
  \ `A` 类，并让该类成为声明虚成员的类，我们将让类 `B` 进入并获取类 `A` 的该成员。可以沿着链让类 `C` 获取它之前的类（即类 `B`），然后它也可以继承该虚成员，并且将执行重写过程，无论类\
  \ `B` 在最初是否执行了重写的声明。它们在整个过程中也将具有一定的独立性。这种工作方式的一个良好示例如下所示：\n\n```csharp\npublic class\
  \ A\n{\n    public virtual void DoWork() { }\n}\n\npublic class B : A\n{\n    public\
  \ override void DoWork() { }\n}\n```\n\n最后，我们将查看我们如何从派生类访问这些成员所属的任何基类。那么这个派生部分将是能够替换或重写属性或方法的类，并且它仍然有权访问该基类的属性。但它必须能够配合基类的关键字。我们能够使用为了我们的需求实现此操作的代码包括：\n\
  \n```csharp\npublic class Base\n{\n    public virtual void DoWork() { }\n}\n\npublic\
  \ class Derived : Base\n{\n}\n```\n\n\n\n\n```csharp\npublic override void DoWork()\n\
  {\n    //Perform Derived's work here\n    //...\n    // Call DoWork on base class\n\
  \    base.DoWork();\n}\n}\n```\n\n关于这个主题，我们还需要关注的最后一点是：通常建议我们花一些时间处理虚拟成员（virtual\
  \ members），并使用 `base` 关键字，这有助于在需要让该成员引入其自己的实现时，帮助我们调用基类的所有实现。允许基类的行为显示出来，将使派生类专注于实现某些你刚刚创建的类所特有的必要行为。但如果基类的实现完全没有发生，并且我们从未调用它，那么派生类就有全部责任去双重检查它正在使用的行为将与我们在基类中看到的行为保持兼容。\n\
  \n# 第 8 章：枚举 (Enumerations)\n\n在 C# 语言中，我们还可以处理被称为枚举（enumerations）的部分。如果我们需要，这将是我们可以处理的主要数据类型之一，但它们比我们看到的其他选项稍微专门一些。例如，`enum`\
  \ 类型（或枚举类型）是由一组底层整型数值类型的一系列命名常量定义的值类型之一。为了让我们更容易定义正在处理的枚举，我们只需要引出 `enum` 关键字，然后指定我们想要提供的该类型成员的名称。一个符合此要求的、可以帮助我们定义枚举器的良好代码示例包含以下内容：\n\
  \n```csharp\nenum Season\n{\n    Spring,\n    Summer,\n    Autumn,\n    Winter\n\
  }\n```\n\n我们在这里应该知道，默认情况下，与这些成员关联的常量值属于整数类型（integer）。这意味着它们将是某种数字，并且从零开始，按照我们在这一部分想要处理的文本顺序每次递增一。\n\
  \n此外，如果其他整型数值可以作为此类的底层类型，我们也可以显式地遍历并指定它们。我们还可以通过此指定关联的常量值，如我们在下面的代码中所所示：\n\n```csharp\n\
  enum ErrorCode : ushort\n{\n    None = 0,\n    Unknown = 1,\n    ConnectionLost\
  \ = 100,\n    OutlierReading = 200\n}\n```\n\n你不能在枚举类型的定义内部定义方法，所以尽量不要掉入这种做法的陷阱。要为此类型类型添加一些你想要的功能，我们需要创建所谓的扩展方法（extension\
  \ method）。好消息是，这实际上比看起来要容易处理得多。\n\n我们通过枚举类型 `E` 得到的默认值将是我们处理表达式 `(E) 0` 时得到的值，即使那里坐着一个零，它也完全不对应于我们枚举类型的成员。\n\
  \n我们也可以遍历并处理枚举类型，以帮助表示一组互斥值中的选择，或者我们也可以通过组合选择来做同样的事情。如果需要，为了让我们更容易遍历并执行选择组合的过程，那么我们需要采用稍有不同的方法，将枚举类型转换为位标志（bit\
  \ flags）。\n\n那么，枚举是这种语言中的一种数据类型值，它主要用于帮助我们为某些整数约束分配字符串值或名称。这样做是为了确保我们正在编写的程序随着时间的推移易于阅读和维护。\n\
  \n例如，我们在扑克牌中看到的四花可以是我们想要处理的四个枚举器，我们知道它们被命名为 `Club`（黑桃）、`Diamond`（方块）、`Heart`（红心）和\
  \ `Spade`（梅片），但它们将属于我们列出的作为 `suit` 的枚举类型。\n\n另一个例子是一些更自然的枚举类型，例如方向、颜色、星期、甚至是行星。这些的主要目标（无论其论点如何）都是为了帮助我们为自己的数据类型提供良好的定义。枚举的声明非常简单，因为我们只需要使用\
  \ `enum` 关键字，并确保它位于结构体、类或命名空间内部。\n\n## 我们如何将枚举类型转换为位标志\n\n我们刚刚查看了如何处理某些枚举类型，甚至讨论了在某些时候我们可能想要将这种类型转换为位标志。现在我们需要查看我们如何能够完成这种过程。\n\
  \n如果你想使用枚举类型来帮助我们表示选择的组合，我们需要为它们定义枚举成员...\n\n```csharp\n[Flags]\nenum Days\n{\n\
  \    None = 0b00000000\n    Monday = 0b00000001\n    Tuesday = 0b00000010\n    Wednesday\
  \ = 0b00000100\n    Thursday = 0b00001000\n    Friday = 0b00010000\n    Saturday\
  \ = 0b00100000\n    Sunday = 0b01000000\n    Weekend = Saturday | Sunday\n}\n\n\
  public class FlagsExample\n{\n    public static void Main()\n    {\n        Days\
  \ meetingDays = Days.Monday | Days.Wednesday | Days.Friday;\n        Console.WriteLine(meetingDays);\n\
  \        // 输出:\n        // Monday, Wednesday, Friday\n\n        Days workingHomeDays\
  \ = Days.Thursday | Days.Friday;\n        Console.WriteLine($\"Join a meeting by\
  \ phone {meetingDays & workingHomeDays}\");\n        // 输出:\n        // Join a meeting\
  \ by phone Friday\n\n        bool isMeetingOnTuesday = (meetingDays & Days.Tuesday)\
  \ == Days.Tuesday;\n        Console.WriteLine($\"Is there a meeting on Tuesday:\
  \ {isMeetingOnTuesday}\");\n        // 输出:\n        // Is there a meeting on Tuesday:\
  \ False\n\n        var a = (Days)37;\n        Console.WriteLine(a);\n        //\
  \ 输出:\n        // Monday, Wednesday, Saturday\n    }\n}\n```\n\n这就是我们在处理这些枚举时将看到的内容的开始，探索更多标志（flags）以及它们如何与此过程配合是很重要的。如果你想进行这项工作，进一步思考这些主意并看看它们将如何满足你的需求也是一个好主意。\n\
  \n## System.Enum 类型\n\n\n\n\n\n我们还可以查看一下 `System.Enum` 类型。这是该过程的一个重要部分，它将确保我们能够为用\
  \ C# 语言编写的一些代码添加更多功能。在开始，`System.Enum` 类型将作为我们处理的所有类型枚举的抽象基类。它将为我们提供许多方法，我们在在此过程中利用这些方法可以以获取更多关于枚举的信息、它是什么类型，以及内部包含哪些值。\n\
  \n从 C# 语言的 7.3 版本开始，你就可以在基类约束中使用 `System.Enum` 了。这通常被称为“枚举约束”（enum constraint）。当你想要指定某个类型参数实际上是一个枚举类型时，这种约束将非常有用。虽然它不会总是被使用，但在某些情况下，学习更多关于它的也会很有帮助。\n\
  \n## 处理某些转换\n\n我们还可以利用这些枚举器来帮助我们处理需要执行的一些转换。对于我们想要添加到代码中的任何类型的枚举，在我们所关注的枚举类型与其底层的整数类型之间，都会存在某种显式转换。\n\
  \n如果你决定遍历并将 `enum` 的值强制转换为其底层的类型，结果将是该成员关联的整数值。下面是一个关于我们如何处理枚举转换想法的好例子：\n\n```csharp\n\
  public enum Season\n{\n    Spring,\n    Summer,\n    Autumn,\n    Winter\n}\n\n\
  public class EnumConversionExample\n{\n    public static void Main()\n    {\n  \
  \      Season a = Season.Autumn;\n        Console.WriteLine($\"Integral value of\
  \ {a} is {(int)a}\");  // output: Integral value of Autumn is 2\n\n        var b\
  \ = (Season)1;\n        Console.WriteLine(b);  // output: Summer\n\n        var\
  \ c = (Season)4;\n        Console.WriteLine(c);  // output: 4\n    }\n}\n```\n\n\
  我们可以使用 `Enum.IsDefined` 方法来帮助我们判断所关注的枚举类型之一是否包含我们正在寻找的带有值的枚举成员。如果存在，它将帮助我们看到存在的内容；但如果我们想要关注的关联值不在我们的代码中，它将返回一个空答案。\n\
  \n对于我们处理的任何不同类型的枚举器，都有几种转换。这主要是我们可以执行的装箱（boxing）和拆箱（unboxing）转换，这些转换允许我们分别在 `System.Enum`\
  \ 类型之间往返转换。\n\n# 第 9 章：多线程\n\n多线程是一个我们在许多对象对象编程语言中都能发现的独特主题，包括 C# 语言。它稍微复杂一些，但对我们来说，多了解它是如何工作的以及我们总体上能用它做什么是有益的。\n\
  \n首先，线程基本上是程序程序的执行路径。存在的每个线程都将为我们定义一个独特的控制流。如果你正在开发一个涉及某些复杂操作或耗时较长的应用程序，你可能会发现，通过确保有不同的执行线程或路径，并且所有线程都能独立地执行它们想要的工作，将会有帮助得多。\n\
  \n线程是一个非常轻量级的进程。我们在编程中使用这些线程的一个例子是，当我们在我们在我们使用的现代操作系统中实现并发编程时。当我们选择使用线程来完成这一过程时，它将帮助我们节省一些\
  \ CPU 周期的浪费，并确保正在使用的应用程序尽可能高效。\n\n我们在其他一个章节中没有花很多时间讨论线程，但通常当提到线程时，它会被用作多线程，因为这允许总体上发生更多的进程。这是因为单线程只允许我们一次运行一个应用程序，而每个应用程序通过简单的单线程，一次只能处理一项工作。\n\
  \n正如我们可以想象的，我们开始时的一些简单项目可能使用其他选项中提供的简单单线程就足够了。但很多时候，我们处理的应用程序将能够同时处理多个任务。当这对你自己的进程也是如此时，就是时候将它们分成一些更小的线程了，而这就是多线程发挥作用的地方。\n\
  \n## 线程的生命周期\n\n我们在这里需要查看的是线程的生命周期概念。这是一个可以启动并确保线程在完成时能够结束的过程。\n\n在生命周期方面，我们会看到几种不同的状态，其中一些阶段包括：\n\
  \n1. **未启动状态（Un-started state）**：这是实例可以被创建但我们还没有调用 `Start()` 的情况。\n2. **就绪状态（Ready\
  \ State）**：这是线程已准备就绪并准备运行的情况，只需等待 CPU 周期就绪。\n3. **不可运行状态（Not Runnable State）**：这是一个我们无法执行的线程。这有几个原因，包括：\n\
  \    - 调用了 `Sleep()` 方法。\n    - I/O 操作存在阻塞。\n    - 取而调用了 `Wait()` 方法。\n4. **销毁状态（Dead\
  \ State）**：这是线程已经完成执行，或者在执行过程中被中止的情况。\n\n## 观察主线程\n\n我们还可以花些时间查看所谓的主线程（main thread）。当我们在\
  \ C# 中编写所需的某些代码时，我们会发现 `System.Threading.Thread` 类被用于处理代码中发现的所有不同线程。这不仅允许我们创建线程，还可以访问所需的单个线程。\n\
  \n当 C# 程序开始执行时，主线程将以自动方式创建。该线程是在我们名为 `Thread` 的类的帮助下创建的，然后可以被视为主线程的一个子线程。如果你愿意，可以通过该类中的\
  \ `CurrentThread` 属性来访问此线程。\n\n## Thread 类的属性\n\n既然我们在这里，我们需要花时间过一下在到目前为止的章节中，处理\
  \ `Thread` 类时最常用且最常见的属性。其中一些主要方法和属性包括：\n\n- `CurrentContext`：这将帮助我们查看当前正在执行的线程，并为我们提供当前的上下文。\n\
  \n\n\n\n\n### 2. `CurrentCulture`\n这将帮助我们从当前使用的线程上获取或设置我们想要找到的区域文化。\n\n### 3. `CurrentPrinciple`\n\
  这将帮助我们获取或设置当前线程中找到的主主体（Principal）。这很重要，因为它经常被用于该线程的安全。\n\n### 4. `CurrentThread`\n\
  此项将列出当前运行的线程。\n\n### 5. `CurrentUICulture`\n这将允许我们通过 `ResourceManager` 的帮助来获取或设置当前的\
  \ UI 文化。这可以帮助我们在运行程序时确定某些特定于文化的资源。\n\n### 6. `ExecutionContext`\n这将为我们提供所需的对象，以便查看我们正在处理的线程中找到关于不同上下文的所有信息。\n\
  \n### 7. `IsAlive`\n这将为我们提供一个值，用于指示当前线程的执行状态。\n\n### 8. `IsBackground`\n这将帮助我们获取或设置一个值，用于指示线程是否为后台线程。\n\
  \n### 9. `IsThreadPoolThread`\n这将为我们提供一个值，帮助我们知道正在处理的特定线程是否属于管理的线程池。\n\n### 10.\
  \ `ManagedThreadid`\n这将为我们当前正在处理的托管线程提供一个唯一标识符。\n\n### 11. `Name`\n当我们准备好设置时，这将帮助我们获取或设置线程名称。\n\
  \n### 12. `Priority`\n这将帮助我们获取甚至设置值，帮助我们知道该线程在调度任务时的优先级。\n\n### 13. `ThreadState`\n\
  这是我们将查看的属性的最后部分，在查看当前线程状态时，它将为我们提供所需的值。\n\n## 创建线程\n\n我们可以在代码的某些部分并在过程中创建我们需要的任何线程。代码需要多少个线程也取决于我们的判断。线程对于我们来说处理和创建是相对容易的，我们只需要确保能够处理并扩展我们一直讨论的\
  \ `Thread` 类即可。扩展后的 `Thread` 类将负责调用 `Start()` 方法的过程，这样我们就可以开始执行，然后转向子线程的执行。\n\n\
  在处理我们可以操作的许多不同部分时，有很多益处可以利用。如果你想在你选择的操作系统上运行程序，如果你希望同时处理多个应用程序而不必让它们在过程中相互等待，多线程将确保我们能够一次性完成所有工作。\n\
  \n我们需要确保完全理解线程和多线程带来的过程，特别是当我们使用 C# 语言时。在刚开始时，这似乎并不是什么大问题，但它绝对会影响代码行为的优劣，以及我们是否能够一次完成多件事。\n\
  \n如果我们在不支持多线程的系统上工作，那么将会有大量的停机等待时间。如果计算机或系统上已经有一个运行中的进程，那么所有其他进程都必须停止并等待轮到它们才能执行任何操作。一旦第一个进程完成，我们就可以处理第二个，然后第三个，以此类推，直到全部完成。\n\
  \n我们可以很快看出，为什么总的来说这将是一件非常痛苦的事情。以这种方式工作永远不会高效，因为迫使我们等待一个接一个进程完成，而且既缓慢又耗时。多线程将介入其中并让情况变得更好。它帮助我们实际上一次处理\
  \ hơn 多个进程。\n\n例如，你可以在计算机上运行防病毒软件，让它进行扫描，同时在网上进行搜索。你可以在计算机上下载一个新游戏或其他程序，然后在下载期间，你可以打开一个\
  \ Word 文档做一些工作或在社交媒体上搜索。如果没有多线程，你只能坐在那里等下载完成。有了多线程，你能够一次处理多个任务。\n\n### 需要记住的一点是，计算机的性能也会决定其中一些。如果你的计算机没有足够的性能或内存，那么这种多线程的效率不会像我们希望的那样。但如果有一个强大的计算机，多线程将以无缝的方式运行，帮助我们在过程中完成更多工作。\n\
  \n我们很多时候都会使用多线程，学习更多关于它的知识绝对值得花时间。考虑到我们在 C# 语言中的所有用途，使用这种多线程也是合理的。\n\n# 第 10 章：变量\n\
  \n在我们使用 C# 语言时，需要查看的下一个主题是变量。语言中可以看到两种类型，被称为引用类型和值类型。被视为值类型的变量以更直接的方式包含数据，而引用类型将存储引用。后者是我们之前见过的对象。\n\
  \n但对于引用类型，我们会发现两个变量可以引用同一个对象，同样，对其中一个的操作可能会影响另一个。但当我们处理值类型时，我们会注意到每个变量都拥有自己的数据副本，对其中一个的操作无法影响其他的。只有我们在代码中使用\
  \ `out` 和 `ref` 参数变量时，这是一个例外。\n\n所以，现在我们需要更深入地什么是变量。首先，变量只是我们在程序中找到的存储区域的名称，程序可以在过程中对其进行操作。我们在这种语言中找到的每个变量都有其特定的类型，这决定了变量内存的布局和大小。这还可以告诉我们关于存储在该内存位置的值及其范围范围的信息。它还告诉我们我们可以应用于该变量的操作。\n\
  \nC# 语言中的基础值类型如下：\n\n1. 整数类型：这些包括 `char`、`ulong`、`long`、`uint`、`short`、`byte` 等。\n\
  2. 浮点类型：这些包括我们目前看到的 `double` 和 `float` 类型。\n3. 布尔类型：这些基于值为真或假的概念。\n4. 小数类型：这些将是任何小数形式的值。\n\
  5. 可空类型：这些将包括在当时被认为可空的所有数据类型。\n\n\n\n\n\n随着这个理念，`C#` 语言将允许我们使用其他几种定义的数值类型。我们已经查看了其中几种，包括引用类型和变量的枚举器。这甚至可以算作我们讨论过的类。\n\
  \n这些变量处理起来比听起来可能要容易得多。它们的设计初衷是帮助我们在过程中完成大量工作，它们基本上会占用我们系统或计算机的一部分内存并将其保留。然后，我们可以在将一些不同的数据类型分配给已有的变量之前，先对它们进行遍历和查看。\n\
  \n我们必须确保为想要操作的变量分配了某种值。这将是一件坏事，因为如果我们有一个变量但没有给它分配任何值，我们只是在计算机内存中预留了一些空空间。当我们尝试调用此变量时，代码将无法提取出任何内容。尽早分配这个值是一个好主意，这样程序就能以正确的方式运行。\n\
  \n回想我们之前讨论过的一些操作符。我们可以使用赋值运算符来控制对这些变量所进行的一些工作。基本上，我们将使用赋值运算符（特别是等号），让编译器知道我们想将哪个值附加到该变量。\n\
  \n如果我们愿意，还可以给变量添加多个值。完成这项工作需要多花一点精力，但你只需要继续使用赋值运算符（或等号），让编译器知道如果你愿意，需要为同一个变量分配两个或多个值。\n\
  \n## 如何定义变量\n\n我们在这里需要查看的下一件事是如何定义我们的变量。我们将看到的语法如下：\n\n```\n<data_type> <variable_list>;\n\
  ```\n\n当然，这只是我们将看到的内容的一个简单示例，但它让我们对能够做什么以及如何在我们自己的代码中实现它有了一个初步的了解。\n\n使用上面的语法，我们需要确保数据类型部分是\
  \ `C#` 支持的有效数据类型之一。这包括 `double`、`float`、`int` 和 `char`。如果你定义了自己的某种数据类型，它也适用。此外，`variable_list`\
  \ 需要包含至少一个（如果更多）标识符名称，并在过程中用逗号分隔。\n\n## 初始化变量\n\n我们能够处理的另一件事是初始化变量。当我们使用等号并在其后跟随常量表达式时，这些变量将被初始化或分配一个值。我们将看到的通用形式如下：\n\
  \n```\nVariable_name = value;\n```\n\n变量的独特之处在于，它们可以在声明时进行初始化。这意味着我们可以对上面的代码进行修改，并实际加上我们想要操作的数据类型。就是如此简单。以正确的方式处理变量并确保你能够以适当的方式初始化变量一直是一个好主意。如果你不以正确的方式执行，程序可能会产生你起初没有预期的结果。\n\
  \n现在我们已经有机会对此进行了简单讨论，是时候查看一些我们能够编写的代码示例，以及我们如何让这些变量满足我们的需求了。\n\n## Lvalue 和 Rvalue\
  \ 表达式\n\n在这里我们还需要查看的其他内容在 `C#` 中被称为 `Rvalue` 和 `Lvalue`。在我们尝试编写的很多代码中将出现几种表达式，这些包括：\n\
  \n1. `lvalue`：这是一种出现在正在操作的赋值左侧或右侧的表达式。\n2. `Rvalue`：这是一种可能出现在赋值右侧的表达式，但它完全不会出现在表格的左侧。\n\
  \n变量可以作为 `lvalues`，这就是为什么如果我们在某个地方想要找到它们，它们经常出现在赋值的左侧。相反，数字字面量在此处被视为 `rvalues`，在这种情况下它们可能永远不会被赋值，而且它们绝对不会出现在此处的左部分。这就是为什么我们需要学习它们之间的区别，以及在我们执行想要的工作时，所有部分将落在什么位置。\n\
  \n正如我们看到的，在处理变量以及学习它们如何造于我们的工作时，有许多需要考虑的事情。我们经常会利用这些变量，因此花时间学习它们并练习一些代码是值得的，这样我们从中获得最大的收益。\n\
  \n# 第 11 章：封装\n\n在我们继续编写可以编写的不同代码之前，我们将查看的最后一个章节是封装的概念。这是我们用来将一个（有时是多个）项目封装进逻辑包或物理包中的过程。当我们查看像\
  \ `C#` 这样面向对象的编程语言中的封装时，它将防止对某些实现细节的访问。\n\n封装和抽象是与这类语言相关的特征。抽象稍有不同，因为它允许我们将某些相关信息对需要它的部分可见，而封装的过程将允许程序员决定存在多少程度的抽象。它允许我们根据想要隐藏这些部分的方式，将代码的某些设为可见或隐藏。\n\
  \n当我们使用访问修饰符时，封装就会实现。这在我们要处理的代码中是特别的，因为它负责帮助我们定义类成员的可见性和作用域。在 `C#` 语言中我们可以找到许多这样的访问修饰符，其中一些包括\
  \ `protected internal`、`internal`、`protected`、`private` 和 `public`。\n\n## Public\
  \ 访问\n\n虽然我们可以花时间查看所有这些，但我们将查看最常见的类型，以及与你想在 `C#` 中编写的很多代码相关的类型。我们将查看的第一个选项被称为 `public`\
  \ 访问修饰符。\n\n这种修饰符特别有助于我们想要编写的一些代码，因为它允许类的一个类将其成员变量甚至一些成员函数暴露给代码的其他部分，包括我们正在处理的一些对象和函数。任何\
  \ `public` 成员都可以从类外部轻松访问。如果你希望在代码的这一部分发生这种情况，那么你想要使用 `public` 访问修饰符。但如果不是，我们想要使用其他选项之一。\n\
  \n\n\n\n在我们的某些 C# 代码中，这种操作非常简单，但我们需要查看使用此功能可以执行的一些实际代码，以获得最佳结果。我们可以看到下面在 C# 中处理这些内容的代码：\n\
  \n```csharp\nusing System;\n\nnamespace RectangleApplication {\n\nclass Rectangle\
  \ {\n\n  //member variables\n  public double length;\n  public double width;\n\n\
  \  public double GetArea() {\n    return length * width;\n  }\n\n  public void Display()\
  \ {\n    Console.WriteLine(\"Length: {0}\", length);\n    Console.WriteLine(\"Width:\
  \ {0}\", width);\n    Console.WriteLine(\"Area: {0}\", GetArea());\n  }\n}//end\
  \ class Rectangle\n\nclass ExecuteRectangle {\n  static void Main(string[] args)\
  \ {\n    Rectangle r = new Rectangle();\n    r.length = 4.5;\n    r.width = 3.5;\n\
  \    r.Display();\n    Console.ReadLine();\n  }\n}\n\n}\n```\n\n花些时间将此代码输入到编译器中，看看通过这个过程可以得到什么样的答案。当我们观察这个时，我们会注意到这里变量的长度和宽度将被声明为\
  \ `public`（公共）。这意味着如果我们愿意，可以通过 `Main()` 函数使用我们命名为 `r` 的 `Rectangle` 类来访问它们。\n\n\
  `GetArea()` 和 `Display()` 的成员函数也可以帮助我们以更直接的方式访问这些一些变量，我们可以在完全不需要处理任何类实例的情况下实现这一点。此外，还有我们称为\
  \ `Display()` 的成员函数，我们也将它们声明为 `public`，因此我们也可以从该类中访问它们。\n\n我们编写的这种代码包含很多内容。但核心点在于，我们可以对其进行处理，使我们可以使用的不同函数和变量变为\
  \ `public`。这允许 `main` 函数访问该部分内容，并将帮助某些代码按照你想要的方式运行。\n\n## 私有访问 (Private Access)\n\
  \n除了我们刚刚做的公共访问外，是时候让我们检查并处理 `private`（私有）访问修饰符了。这与我们讨论公共选项时看到的情况恰相反。这将使得程序员能够将某些成员变量和函数从代码中的其他对象和函数中隐藏起来。\n\
  \n只有留在同一个类中的函数才能在此过程中对私有进行任何访问。在这个修饰符中，你会发现即使是类的实例也无法访问任何私有成员。此的一个很好的例子是下面的代码：\n\
  \n```csharp\nusing System;\n\nnamespace RectangleApplication {\n\n  class Rectangle\
  \ {\n    //member variables\n    private double length;\n    private double width;\n\
  \n    public void Acceptdetails() {\n      Console.WriteLine(\"Enter Length: \"\
  );\n      length = Convert.ToDouble(Console.ReadLine());\n      Console.WriteLine(\"\
  Enter Width: \");\n      width = Convert.ToDouble(Console.ReadLine());\n    }\n\n\
  \    public double GetArea() {\n      return length * width;\n    }\n\n    public\
  \ void Display() {\n      Console.WriteLine(\"Length: {0}\", length);\n      Console.WriteLine(\"\
  Width: {0}\", width);\n      Console.WriteLine(\"Area: {0}\", GetArea());\n    }\n\
  \  }//end class Rectangle\n  class ExecuteRectangle {\n    static void Main(string[]\
  \ args) {\n      Rectangle r = new Rectangle();\n      r.Acceptdetails();\n    \
  \  r.Display();\n      Console.ReadLine();\n    }\n  }\n}\n```\n\n你这里花一点时间输入代码，看看这一切的输出是什么。在这个例子中，我们花了一些时间隐藏了会在你某些代码中显示的不同属性。（注：原文有重复，我将仅保留核心信息）。\n\
  \n在这个例子中，我们花了一些时间隐藏了会在你某些代码中显示的不同属性。\n\n这意味着我们可以通过 `Main()` 函数使用 `Rectangle` 类来访问它们（如果我们愿意）。`GetArea()`\
  \ 和 `Display()` 的成员函数也可以帮助我们以更直接的方式访问这些一些变量，我们可以在完全不需要处理任何类实例的情况下实现这一点。\n\n\n\n\n\
  正如我们所看到的，很多时候我们需要处理封装这一概念，而确保我们为代码授予了正确的权限通常很有帮助。在某些情况下，我们希望拥有开放的公共访问，而在另一些情况下，我们倾向于不进行这种访问，并将不同的部分保持私有并相互隔离。这正是封装过程为我们所的事情。\n\
  \n# 第 12 章：用于练习的简单项目\n\n在本指南中，我们花费了大量时间查看可以用 C# 编写的许多代码，以及如何将所有这些部分结合起来以满足我们自己的需求。确保我们对想要在该语言中进行的某些编码变得非常精通，并确保它的行为符合我们的预期，最好的方法之一就是在在此过程中进行一些练习。\n\
  \n你想要编写的每个程序都会略有不同，因此在学习过程中，检查并了解我们想要编写的所有代码中不同方面是如何运作的至关重要的。\n\n这就是为什么这一章将再次通过一些练习代码来帮助我们，这些代码将产生一个我们能够自己创建的游戏。这些代码将帮助我们更多地学习在此之前收集和学习过的不同部分，并确保我们能够真正将这一切结合在一起，以满足我们的需求。\n\
  \n在代码中，你会注意到它将许多部分组合在一起，确保我们看到一些循环和条件语句，甚至可以以更实用的方式展示许多注释、关键字、运算符等，与我们之前所做的相比，将它们全部整合在代码的一个部分中。\n\
  \n考虑到这一点，让我们来看看如何创建一个我们自己的“猜字游戏”（Hangman Games），并让它运行，这不仅是对 C# 语言进行一些练习，而且确保我们能够从一个运行在我们自己代码上的游戏中获得最大的价值：\n\
  \n## 在 C# 中创建猜字游戏\n\n这是我们在本章中将花费一点时间的程序。当你第一次查看源码时，它会非常长。你可能会认为对于初学者来说学习如何这样做太难了。但实际上，考虑到它需要实现的所有部分，这个程序只是长，并不那么复杂。\n\
  \n想一下一个简单的猜字游戏包含哪些内容。你需要让它为你挑选一个随机单词，然后你需要确保它能够根据显示的单词知道哪些字母是正确的，哪些是错误的。通常在游戏结束或用户获胜之前，用户会有一定次数的尝试。所有这些都必须出现在我们在下面需要创建的代码中。\n\
  \n在下面的代码中，我们将设置一段代码，在窗口顶部会显示一些空框，这样你猜对的字母就会显示在那里。用户将猜测字母并看他们是否能猜对。当然，每当用户（或你）进入并做出错误的猜测时，程序就会显示吊人的另一个部分。如果你在这里犯了\
  \ 5 次错误，你就输了。但如果你猜出了所有的字母，你就获胜了。\n\n现在源码已经就绪，是时候对它的工作原理进行更详细的解释了。事件处理器首先会运行并帮助禁用被点击的按钮，这将确保用户无法再次进入并点击所有内容。从那里，它将花时间从按钮获取\
  \ `tag` 属性，将其转换为字母，然后花时间确定该字母是否实际上出现在我们正在处理的单词中。\n\n我们在这里不会介绍整个代码，因为看起来我们要处理的内容很多，但一小部分代码值得我们花时间查看。看看我们下面提供的代码，看看你是否能识别出其中的某些部分，以及你对程序其他部分还记得多少：\n\
  \n```csharp\n/// <summary>\n/// 读取文本文件随机化单词\n/// </summary>\nprivate void SelectWord()\
  \ {\n    string filePath = Path.Combine(Path.GetDirectoryName(System.Reflection.Assembly.GetExecutingAssembly().Location),\
  \ \"Words.txt\");\n    using (TextReader tr = new StreamReader(filePath, Encoding.ASCII))\
  \ {\n        Random r = new Random();\n        var allWords = tr.ReadToEnd().Split(new[]\
  \ { '\\n', '\\r' }, StringSplitOptions.RemoveEmptyEntries);\n        currentWord\
  \ = allWords[r.Next(0, allWords.Length - 1)];\n        // currentWord 是公共变量\n  \
  \  }\n}\n```\n\n如果程序确定在所选单词中找到了该字母，则程序将被设置为遍历字母标签。如果标签能够对应回该字母，那么这个字母就会显示在页面顶部单词空格的正确位置上。如果那里有任何标签是空的，说明用户还没有猜出所有的字母，游戏将继续。\n\
  \n然而，如果用户已经能够猜出所有的字母，程序将显示“you won”（你赢了）的消息，并禁用键盘上所有的按钮。\n\n现在，用户也可能进行此操作并猜出一个实际上不在单词中的字母。当这种情况发生时，程序将隐藏正在显示的骨架图像，对\
  \ `CurrentPictureIndex` 进行必要的递增以显示下一张图像，然后帮助显示该图像。\n\n通过这种方式，如果当前图像最终是最后一张，那么说明用户输了游戏，程序将在屏幕上显示“you\
  \ lost”（你输了）的消息。通过我们在上面过的代码，这将禁用键盘上所有的按钮，并让每个标签显示它们的字母，以便我们查看它们并看到单词是什么。\n\n当然，我们也可以为此添加更多功能。如果我们愿意，为这个游戏发明一种评分系统是相当容易的，甚至可以以此处理并保存一些你需要的统计数据，包括高分、胜负率以及该程序设置中的其他内容。上面的代码已经足够复杂了，使用了\
  \ C# 语言的许多不同组件，所以如果你只想停留在此并享受你创建的游戏，也是可以的。\n\n在我们结束这部分之前，我们还有最后一点说明作为结束。我们需要指出，我们基于此程序的字典将为我们提供运行游戏所需的单词，它还会导致使用出现在多个字典中的常用单词。在这种格式下，单词有时会是一些是不常见的单词，这会让游戏处理起来变得稍微困难一些。\n\
  \n\n\n这个程序的内容就此结束。当你能够将本指南中学习过的许多主题结合在一起时，就能创建属于我们自己的游戏了。当我们运用这种理念进行工作时，我们能够处理和创建许多其他部分，并展现出我们为止所学过的所有主题。猜单词游戏（Hangman）是一个练习这些主题的趣味方式，并确保你能够让它按照你的需求正常工作。\n\
  \n# 结\n\n感谢你读完 `C#` 的最后部分，希望这些内容对你有所益，并能为你提供实现目标所需的所有工具，无论这些目标是什么。\n\n下一步是开始学习本指南中的一些不同部分，以帮助我们更多地了解\
  \ `C#` 语言，并学习如何制作这种工具，以便你在在此过程中处理你想要编写的任何程序。\n\n在开始编码时，我们有很多不同的选项可以尝试，而 `C#` 语言将是实现你理想应用程序的极佳工具。它适用于\
  \ `Windows` 系统并与该系统自动关联，但我们也可以让它在其他一些选项上运行。这意味着我们可以在 `Linux` 和 `Mac` 等其他操作系统上运行。\n\
  \n本指南花费了一些时间来深入探讨使用 `C#` 语言可以做的不同事情。当我们使用这种语言时，可以处理许多不同的方面。我们将查看如何使用条件语句、循环、多态、枚举等。所有这些元素都可以结合在一起，帮助我们在编写自己的代码时创建出我们想要的各种内容。\n\
