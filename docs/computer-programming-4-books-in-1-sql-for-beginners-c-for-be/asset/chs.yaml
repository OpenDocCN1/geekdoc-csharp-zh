  \n# 引言\n\n祝喜你购买 `C#`，感谢你的购买。\n\n市场上有很多关于这个主题的书，再次感谢你选择这一本！我们已尽一切努力确保它包含尽可能有用的信息，请尽情享受！\n\
  \n在不知道运行环境的情况下编写程序，就像在没有地图的城市里开车。\n\n## 为什么选择 C#\n\n从语法上来说，`C#` 并不是一种新语言。`C#` 的语法与\
  \ `C++` 语言族相似。\n\n## .NET Framework\n\n为了有效地使用 `C#`，需要了解一些理论背景知识，即所谓的 `.NET Framework`。这就是为什么它是本书中不可或缺的一部分。\n\
  \n## 什么是.NET Framework？\n\n主要，它包含一个用于编写程序和服务的概念平台。在此基础上，我们已经为不同的平台技术提供了不同的框架。\n\n\
  \n\n\n\nC# 以及所有其他为 `.NET` 开发和现在正在开发的编程语言，都需要 `.NET Framework` 作为运行环境。更具体地说，`.NET\
  \ Framework` 的运行环境由通用语言运行时（Common Language Runtime，简称 `CLR`）组成。正如其名称所示，它是一个跨编程语言的运行时环境。\n\
  \n运行环境的任务本质上是执行用相应编程语言开发的代码。然而在过去，为了能够执行相应的程序，通常必须为每种编程语言（部分也为每个版本）提供一个独立的运行时库（runtime\
  \ library）。例如，`++`（即 C++）需要的 `MSVCRT.DLL` 文件，以及 Visual Basic 6 需要的 `MSVBVM60.DLL`\
  \ 文件。所提供的运行时环境概念在过去是、现在从根本上仍然不同的。跨语言支持提供了 `.NET Framework` 的核心优势：\n\n*   只需要一个框架。\n\
  *   可以根据知识水平和个人偏好使用不同的（且差异巨大的）编程语言。\n*   所有编程语言共有一个运行时环境。\n\n从这些优势中，可以推导出进一步的结论：\n\
  \n*   跨语言集成\n*   跨语言异常处理（异常处理指的是程序在发生非正常预期事件（如错误）时应如何反应）\n*   提高安全性（安全性可以控制到方法级）\n\
  *   简化的版本控制（多个版本可以并存）\n\n由于 `.NET Framework` 提供了跨语言的运行时环境，它确保了不同编程语言组件之间的交互和最佳协作。\n\
  \n你现在知道 `.NET Framework` 是 `.NET` 技术的一部分，以及它的作用了。`.NET Framework` 再次由三个主要组件组成：\n\
  \n1.  通用语言运行时（Common Language Runtime） - 跨语言运行时环境\n2.  类库（稍后将学习更多关于类和类库的知识）\n3.\
  \  `ASP.NET` - 用于 Web 的服务器端应用程序\n\n在本书中，我们将详细介绍这三个组件。通用语言运行时和类库将在书中反复出现，`ASP.NET`\
  \ 在 Web 服务语境下也会如此。`.NET Framework` 的这两个组件——通用语言运行时和类库——也被称为基础框架（Base Framework）。\n\
  \n# 第 1 章 - 创建类型\n\n## 通用语言运行时 - CLR\n\n通用语言运行时（简称 `CLR`）的任务是管理代码的执行，并额外提供简化在 `.NET\
  \ Framework` 上以及使用该框架开发的服务。\n\n通过通用语言运行时，开发者分担了大量工作。其中一个大优势是简化的内存管理，即对主内存的管理。作为程序员，他们可以更多地集中在实际任务上，而较少面对主内存组织方面的内部问题。此外，每种编程语言中存在相同的数据类型，这在在使用不同编程语言时非常有用，因为你不再需要不断考虑相应编程语言的特殊性。（数据类型决定了存储什么类型的数据，以及在适用的情况下——数值数据——其取值范围和精度。）\n\
  \n大部分或所有的内存管理以及许多其他任务都由通用语言运行时接管。\n\n`托管代码`（managed code）指的是受运行时控制的代码。它不被允许自己执行某些事情，例如直接访问工作内存；这就是为什么\
  \ `CLR` 作为一个中介和主导机构会负责处理这些工作。只有当你使用`托管代码`时，你才能从某些优势中受益，例如自动内存管理或跨语言集成。\n\n通用语言运行时有自己的内存管理机制，即所谓的垃圾回收（garbage\
  \ collector，字面意思是“对内存中无操作数据的垃圾收集”），简称 `GC`。\n\n如果不使用垃圾回收器，你就必须自己负责内存管理和释放，这非常耗时且容易出错，甚至可能导致系统崩溃。`垃圾回收器`（Garbage\
  \ Collector）会自动管理内存，也就是说它控制运行你程序的系统的所有内存需求，并从内存中移除所有不再引用的数据，使得引用不再存在，或者更简单地说——移除不再被使用的数据。\n\
  \n## 中间语言\n\n想象一下，全世界都说一种语言，并且这个星球上的每个居民都能听懂。这听起来非常有哲学哲学，在人类交流中很难想象。然而，转化到 `.NET\
  \ Framework`，却创建了这样的东西：一种被称为`中间语言`（Intermediate Language）的跨越中介语言。\n\n`.NET` 技术的理念之一是独立于操作系统。另一个优势是可用的编程语言很多，可以根据知识水平和个人偏好进行选择，而不受任何限制，因为可以使用来自另一种语言用特定编程语言编写的组件。\n\
  \n但是，用 `C#` 开发的代码部分如何与用 `Visual Basic.NET`或其他编程语言编写的代码部分结合呢？至少在这里你必须告别那些具有不同运行时环境的传统编程模式，并重新思考。\n\
  \n我们从前面的章节中知道，`.NET Framework` 只有一个运行时环境，且所有编程语言都可以被 `.NET Framework` 使用和理解。这里出现的问题是程序（用任何\
  \ .NET 编程语言编写）与最终可执行文件之间的中间步骤。这个中间步骤在 `.NET` 中通过中间代码解决。这种中间代码被称为“中间语言代码”（Intermediate\
  \ Language Code），简称 `IL code`。\n\n这种 `IL code` 被 `.NET Framework` 理解并可以翻译成可执行文件。由于\
  \ `.NET Framework` 处于程序和操作系统之间，操作系统通常在编程中起不起作用，因为 `.NET Framework` 充当了操作系统和程序之间的中介。\n\
  \n对于在 .NET 平台上进行编程的开发者来说，这意味着最初生成的不是机器码（针对特定的），而是 `IL code`。`IL code` 可以被视为一种虚拟处理器的代码，这种处理器在物理上并不存在，它是“思考的”，仅以软件的形式存在。这种处理器无关的代码并不是新鲜事物；在其他技术中通常被称为\
  \ `P-code` 或字节码（bytecode）。与 `IL code` 不同，`P-code` 通常只对应一种编程语言；因此你是与平台无关的，但被迫使用特定的编程语言。\n\
  \n`IL code` 的概念清楚地解释了为什么可以使用广泛的语言来实现程序。无论使用哪种编程语言，可读的源码（例如 `C#` 语句）都会转换为通用的 `IL\
  \ code`。执行这种转换的程序被称为编译器，转换过程被称为编译。\n\n除了 `IL code` 之外，编译器还会生成额外的信息文件，即所谓的元数据（metadata）。这些元数据包含了关于程序的类型、成员和引用的信息。通用语言运行时需要元数据来加载类。如图所示，数据与\
  \ `IL code` 存储在一起。`IL code` 是各种编译器的产物，作为 `JIT 编译器` 的执行代码是必要的。\n\n```\nJIT Compiler\n\
  ```\n\n\n\n\n\n.NET Framework 同样基于通用的 IL 代码。为了生成 z。例如，如果 C# 编译器使用 IL 代码，这些代码无法被计算机的物理处理器理解。每种类型的处理器都有其自己的机器语言。最终，计算机只能使用物理处理器的机器语言。这种代码被称为原生代码（Native\
  \ Code，在德语中称为 \"native code\"），大致意思是“天生的、原始的”。\n\n这意味着在某个时刻，IL 代码仍然必须被翻译成原生代码。通常，会使用一种解释器来实现类似目的（`P-code\
  \ 解释器`），但是以牺牲执行速度为代价的，因为即使程序没有发生变化，相同的指令总是会被重新编译。另一种，你也可以使用生成原生代码的编译器来转换代码。这将提供更高的速度，但程序员必须在进行任何更改后手动进行转换，并且会有其他会损害\
  \ .NET 平台无关性的缺点。\n\n因此，为了结合编译器和解释器的优点，使用了这两种方法的混合体形式，即所谓的即时编译器或 `jitter`。`JIT` 编译器自动将\
  \ IL 代码转换为机器码。这种转换只在需要时发生，具体是在调用程序时。这种转换非常彻底，以至于未使用的程序模块不会被 `JIT` 编译器翻译。只有当用户或程序中的其他函数调用程序模块时，翻译才会发生。其优点是速度损失非常微小；一旦程序模块完成过编译，它就会以原生代码的全执行速度运行。\n\
  \n同时，.NET 仍然保持无限的平台无关性，因此 IL 代码不依赖于特定的环境。\n\n## 执行 (The Execution)\n\n使用 C# 编译器\
  \ `csc.exe` 将现有代码编译为 IL 代码。我们稍后会详细介绍 C# 编译器。\n\n假设你开发了一个可以执行各种非常复杂类型计算的程序，并将这些计算实现为独立的模块，并将它们汇总在一个\
  \ `calculation class`（计算类）中。\n\n现在，当你执行某个特定的计算时，`JIT` 编译器会在 IL 代码中寻找入口，并将受影响的计算模块翻译成原生代码。其余计算模块仍然以\
  \ IL 代码的形式存在。如果再次执行同一个模块，`JIT` 编译器不需要再次翻译代码，它只需要重新执行已经翻译并存在的机器码。只有当调用进一步的、尚未翻译的模块时，`JIT-Com-Piler`\
  \ 才会将这些模块转换为机器码。通过这种方式，执行速度大大加快。这种加速在较大的程序中尤为明显，因为调用只翻译了实际需要的模块。`JIT` 编译器甚至能够响应计算机硬件的变化，并为此对机器码进行优化。\n\
  \n## 自成一类 (A Class Of Its Own)\n\n在我们开始实际编程之前，我们应该先处理面向对象编程的基础知识，特别是关于类（classes）。C#\
  \ 是一种面向对象的编程语言。在程序意义上什么构成了一个类，稍后会详细描述。但现在先用一个抽象的案例研究来传达类和类设计的基本思想。\n\n通常来说，类是（编程）日常生活中真实问题的抽象插图，它本身提供了一种解决方案，并/或与其环境通信或完成任务。为了这个目的，类具有方法和属性，这些方法和属性必须结合以解决提出的问题。（方法执行具体的动作\
  \ - 属性更像是一个特征，因此它返回关于其组成的信息。方法和属性的含义将在稍后详细描述。）\n\n同样很有趣的是，你不能在程序中直接使用类。现在，如果你有点困惑，并疑惑为什么要在\
  \ C# 中将问题封装在类中，以及是什么让面向对象编程变得有意义，我可以为你解答。当我第一次听到类和面向对象编程时，我并没有这种感觉。\n\n想象一位教授在第一节课上分发他的讲义。数百名学生急切地等待着，渴望获得自己的讲义。显然，教授并没有写了数百次这份讲义，而是对它进行了复印。原件只有教授拥有，他根据讲义在课程中教授材料，并指出哪些是重要的，哪些是不重要的。学生们使用自己的个人讲义进行工作，例如用荧光笔标出关键文本段落并在讲义中写笔记。\n\
  \n这个小讲座示例类似于一个类。计算机的工作内存可以被相当远程地看作是教授的阶教室，学生坐在那里。当教授将原件的第一份副本发给学生使用副本的那一刻，一份与原件不同的讲义就产生了。学生的这份讲义在面向对象编程中被称为实例（instance）。\n\
  \n你现在会好奇这些差异在哪里。为了明年能给新学生递交一份讲义副本，你让原件保持不变 - 这与学生使用的、可能标记段落并添加注释的副本相反。\n\n类类似于讲义的原件。所以，如果你想处理讲义的内容，你会得到原件的副本；学生在阶教室的座位类似于分配给类副本的空间。\n\
  \n在编程中，这个过程被称为类的实例化（instancing or instantiation）。从这个实例化过程，即创建教授讲义的副本中，产生了一个对象（object）。人们可以将对象想象成一个“工作副本”，实际上，对象是类抽象描述的具体表示。\n\
  \n现在，你不是在与类工作，而是通过形成类的实例来与对象工作，这个想法对你来说应该不难。\n\n## 布尔类型 (The Boolean Type)\n\n`boolean`\
  \ 类型（也称为 `boolean data type`）`data type`可以取 2 个值之一：`true`（真）或 `false`（假）。该数据类型与一个只能取两个值的位密切相关：0\
  \ 和 1。你可能会认为因此一个 `boolean` 类型的变量在工作内存中只占用 1 位。但由于主内存的特殊管理，实际上预留了一个完整的字节，即与 `byte`\
  \ 数据类型一样大的内存。\n\n`boolean` 数据类型主要出现在程序中的条件判断中。布尔类型基于正向逻辑工作：逻辑 1 表示真 - 真，逻辑 0 表示假。\n\
  \n## 是否是正确的类型？ (Is This The Right Type?)\n\n通常，使用什么数据类型由程序员决定。然而，在选择正确的数据类型时，你应该考虑未来，即，即使存储的数据量随时间推移而增加，程序仍然能够正常运行。在这种情况下，使用不再足够的数据类型将很尴尬。（你很了解千年虫问题，这很大程度上是因为相关程序中为年份预留的内存太少，导致随后的调整非常昂贵。）\n\
  \n\n\n\n如今，我们通常拥有足够的内存和快速硬件，因此在不确定时，你应该选择值范围相应较大的数据类型。然而，在任何情况下都不应该使用浪费的数据类型。如果\
  \ `z`。例如，如果绝对确定一个循环只会执行 10 次，那么对受影响的变量使用 `int` 数据类型就有些夸大了。值得考虑的是 `short` 类型甚至 `byte`\
  \ 类型是否足够。另一个方面是程序的性能（执行性能和速度）。由于性能不仅取决于运行程序的处理器，还取决于计算机所使用的和可用的内存量，因此你还必须担心你正在使用什么类型的数据类型。`long`\
  \ 数据类型比 `int` 数据类型慢，因为在第一次处理时需要处理更多的信息。这也意味着 `long` 数据类型比 `int` 数据类型需要更多的内存。\n\n\
  ## 隐式转换\n\n隐式转换出现在许多场景中。它们大多数情况下是程序员在无意识的情况下使用的，并没有对其进行思考。这有时会导致不那么理想的副作用。\n\n隐式转换是自动发生的，例如，可能会导致浮点类型的精度降低，直到变成没有小数小数的绝对表示形式。\n\
  \n## 类型转换\n\n与隐式转换形成严格对比的是，显式转换要求指定将变量转换的数据类型。C# 编程语言中的转换类型直接取决于各种数据类型的值范围。如果你尝试存储一个数据类型值范围大于目标变量的变量的内容，编译器将发出错误消息。\n\
  \n```\nint iNumber = 0;\nshort sNumber = 0;\nsNumber = iNumber; own\n```\n\n由此此生成的错误消息是：\n\
  \n`无法将类型 'int' 转换为 'short'。`\n\n在这里，必须对变量 `iNumber` 进行类型转换。变量 `iZahl` 必须通过显式转换指令（这种方法被称为\
  \ `cast`）被转换为正确的数据类型。要生成的数据类型写在变量前的括号中。\n\n显式转换或类型转换的语句如下：\n\n```\nsNumber = (short)\
  \ iNumber;\n```\n\n## 显式转换期间错误\n\n我们知道所有数据类型都使用一定数量的内存。因此很清楚，将值范围较大的数据类型转换为值范围较小的数据类型会导致错误。\n\
  \n`int` 数据类型在内存中占用 4 字节，而 `short` 数据类型占用 2 字节。如果你想将一个 `int` 类型变量的值转换为 `short` 类型变量并丢弃它会发生什么？下面的列表演示了涉及的问题。\n\
  \n## 避免转换错误\n\n由于转换问题和溢出在编程中随处可见，C# 赋予了你监控此类问题的能力。正如我们在上面看到的，如果显式转换触发了超出范围条件，编译器不会发出错误消息。我们必须告诉编译器我们的程序中的某个区域需要被监控。\n\
  \n转换错误通常只在运行时才被察觉，而且对于缺乏经验的程序员来说并不总是显而易见的。如果你想安全起见，可以将所有包含转换的语句放在 `checked` 块中。随着时间的推移，你将对转换形成惯性，并仅在需要的地方使用\
  \ `checked` 块。接下来的列表将向如何使用 `checked` 块。\n\n# 第 2 章 - Linq\n\n在开始学习一种编程语言时，写的第一个程序除了向控制台打印欢迎词“Hello\
  \ world!”之外什么都不做，这是一种传统。对我来说也是。在此期间发生了很多事情；所以我自己在这个互联网和 .NET 时代让这个问候稍微发生变化。\n\n\
  只需输入之后将要打印的代码，例如使用 Windows 编辑器 `WordPad` 或 `Notepad`（后者仅在 Windows 中被称为编辑器）。执行此操作，点击\
  \ `START` 按钮，然后点击 `ALL PROGRAMS`。在 `ZÜHÖR` 文件夹下你应该能找到这两个编辑器。\n\n如果你在那里没有找到任何编辑器（这不应该发生），请在\
  \ `START` / `ALL PROGRAMS` / `ZÜBEHÖR` 下点击 `USER` 条目并打开同名的对话框。在其中输入命令 `notepad`\
  \ 并按 OK 确认你的输入。\n\n起，我不想让你面对 Visual C# 开发环境，因为这使得很难掌握要点。我们将更多地讨论 Visual C# 开发环境。\n\
  \n对于我们在书中将创建的练习，请创建一个文件夹，最好在 `C:` 下。建议为书中的每一天都创建一个以章节编号命名的单独子文件夹。使用 `Windows Explorer`\
  \ 创建文件夹。现在的文件夹结构看起来像这样：\n\nC:\\Examples\\Chapter01\nC:\\Examples\\Chapter02\n\n\
  ## 创建库项目\n\n下一步将测试该类。然而，这需要一个使用库的应用程序，因为库本身不能直接执行。\n\n## 应用中的派生\n\n要在程序中切换到动态库 (DLL)\
  \ 以能够访问，你必须：\n\n- 在程序的源代码中包含库类的命名空间；或者，你可以使用以名称开头的完全限定标识符访问类。\n- 设置对库的引用。\n\n当你使用\
  \ Visual C# 编译器工作时，开发环境帮助你设置和管理引用。如果你遵循 `csc` 编译器的示例，只需创建一个名为 `Program.cs` 的文件，传输源代码，并使用\
  \ `/r:CKmerkasten.dll` 编译文件：\n\n```\ncsc /r:CKmerkasten.dll Program.cs\n```\n\n\
  如果 DLL 不在要创建的 EXE 文件相同的目录下，你必须指定 DLL 的路径。\n\n如果库的位置没有显示库的位置，你可能之前关闭了库。\n\n在派生类之前，你应该检查该类是否运行正常。\n\
