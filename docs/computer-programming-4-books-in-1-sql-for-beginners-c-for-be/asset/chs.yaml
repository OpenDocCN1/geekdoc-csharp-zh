  \n# 第 1 章：Kali Linux 简介\n\n## Kali Linux 概述\n\nKali 是 Linux 家族的一个发行版，基于 Debian 架构建立，专为安全审计和执行高级渗透测试而设计和制造。该发行版拥有数百种工具，面向许多与安全相关的任务，例如取证任务、安全研究、对各种安全系统的渗透测试以及逆向工程等。Kali\
  \ 由 Offensive Security 开发和管理，这是一家专门从事安全解决方案培训的信息安全公司。Kali 从 `BackTrack` 演变而来。`BackTrack`\
  \ 也是 Linux 发行版家族的软件，用于渗透测试。\n\n### 黑客偏爱 Linux 的原因\n\n作为介绍的一部分，我们将讨论 Linux 操作系统成为黑客首选的五个原因。\n\
  \na) 它是开源软件\n\n与 Windows 操作系统软件不同，Linux 发行版是`开源`的。Linux 用户可以访问操作系统的源代码。这意味着人们可以随意操纵和更改\
  \ Linux 操作系统以适应需求。假设用户想让特定系统以原始设计之外的方式运行，那么操纵和更改源代码的能力是至关重要的。\n\nb) 操作系统是透明的\n\n\
  为了有效地进行黑客攻击，需要深入理解用户的操作系统。同时，必须对你想要攻击的操作系统了解。与 Windows 不同，我们可以看到甚至操纵 Linux 的所有工作部分。也就是说，Linux\
  \ 是完全透明的。理解 Windows 操作系统的内部工作原理并不容易。透明性意味着使用 Linux 更有效。\n\nc) Linux 发行版为用户提供了细粒度的控制\n\
  \nLinux 用户对系统拥有无限控制权；换句话说，它是细粒度的。这与 Windows 操作系统相比非常显著，在 Windows 中，用户只能控制微软允许他们控制的内容。Linux\
  \ 中的一切，无论是微观还是宏观层面，都通过`terminal` 控制。此外，Linux 中的任何脚本语言编写脚本都是简单且有效的。\n\nd) 黑客资源是为\
  \ Linux 设计的\n\n大多数攻击工具都是专门为 Linux 编写的。某些工具如 `nmap` 或 `Metasploit` 可以在 Windows 平台上可用，但仍然并非所有功能都能移植到\
  \ Windows。与在 Linux 平台上运行相比，它们提供的功能非常有限。\n\ne) 未来属于 Linux/Unix\n\n\n\n\n多年来，你可能已经看到\
  \ Windows 正在变慢，在某些部门甚至陷入了停滞。自从互联网出现以来，`Linux/Unix` 一直是 Web 服务器的首选操作系统，这主要是因为它的可靠性、健壮性和稳定性。截至目前，几乎三分之二的\
  \ Web 服务器使用 Linux 操作系统。`Linux` 核的使用示例包括 Citrix 应用、`Vmware`、交换机和路由器中的嵌入式系统、移动设备等。人们说计算的未来在于手机和平板等移动设备。大多数手机使用的\
  \ `Android` 是 `Linux`，而 `iOS` 是 `Unix` 内核。因此，很难想象未来不是 `Linux/Unix`。微软 Windows 仅占据约\
  \ 7% 的微小市场份额。市场的其余部分是 `Linux` 或 `Unix`。总而言之，未来属于 `Linux/Unix`。\n\n## 使用 Kali Linux\n\
  \n这个操作系统 `Kali Linux` 专门用于测试计算机基础设施的安全性，以发掘需要解决的漏洞。以下是在计算机网络上进行渗透测试的主要步骤。书中也包含了在相应步骤中使用的工具。\n\
  \n### 1) 侦察\n\n首先，任何渗透测试都始于情报收集。在这个阶段，会收集有关特定目标的初步信息。这些信息将用于用于实际攻击的规划。\n\n`Kali\
  \ Linux` 中侦察工具的示例包括 `Nmap`、`DNSRecon`、`Hping3`、`Recon-ng` 等。\n\n### 2) 扫描\n第二步是对所考虑的目标扫描更多情报。在这一步使用漏洞扫描器来帮助渗透测试人员发现目标网络中可能存在的安全漏洞。\n\
  \n用于此目的的工具包括 `Nikto`、`Cisco-auditing-tool`、`WebSploit`、`jSQL Injection`、`Arp-scan`\
  \ 和 `Oscanner`。\n\n### 3) 获取访问\n获取目标网络的访问是第三步。在这里，黑客将尝试渗透网络。其目的是让黑客能够提取关键数据，并利用这些数据来破坏系统或将其作为发起更多攻击的平台。所需的工具包括\
  \ `John the Ripper`、`Browser Exploitation Framework (BeEF)`、`Metasploit Framework`、`Aircrack-ng`\
  \ 和 `Wireshark`。\n\n### 4) 维持访问\n\n测试人员需要维持其已进入系统的访问权限。这是为了能够尽可能长时间地造成更多破坏。为了完成这项任务，需要能够进行地下操作的隐藏工具。某些工具包括\
  \ `Dns2tcp`、`Webhells`、`Powersploit`、`Cryptcat` 和 `Weevely`。\n\n### 5) 掩盖踪\n\n在这里，渗透测试人员将尝试删除在目标网络上执行过的任何恶意活动迹象或足迹。一个很好的例子是将已提升或更改的访问权限恢复原始状态。`Kali\
  \ Linux` 有以下掩盖行的工具：`Smbexec`、`Meterpreter` 和 `Veil`。\n\n## 渗透测试简介\n\n继续介绍 `Kali\
  \ Linux`，我们将介绍渗透测试。这将为我们提供背景，使我们理解其在安全分析方面的重要性。渗透测试是一项非常有价值的工具，有助于安全规划人员理解并改进他们所管理的计算机或网络的安全性。然而，黑客可以利用渗透测试来利用系统中的漏洞，随后进行攻击并窃取宝贵信息。当安全专业人员理解为什么最初需要渗透测试，并且充分理解围绕它的流程和问题时，他们能够更好地使用渗透测试。我们将研究其使用条款、应用以及涉及的各种过程。本书并非提供关于如何进行渗透测试的逐步指南。这是一项需要大量实践练习才能掌握的技能。如果执行不当，实际上可能会损害目标，或者在某些情况下结果被认为无效。\n\
  \n## 什么是渗透测试？\n\n我们将其定义为一组约定的程序和流程，用于绕过预定或已知系统或组织的既定安全控制，目的是为了测试该系统或组织对此类攻击的抵御能力。渗透测试通常是为了发掘系统安全中的漏洞，并发现潜在攻击者突破系统安全架构的方法。通常，渗透测试包含针对特定目标的一系列攻击。渗透测试的结果（无论成功失败）取决于目标对攻击的反应。\n\
  \n确定目标抵抗或承受敌对入侵者发起攻击的能力，是执行此测试的总体意图。\n\n因此，渗透测试人员将利用实际攻击者可能使用的技术和技巧。换句话说，测试人员将对其目标模拟一次真实的攻击。通过这种方式，测试人员可以在恶意攻击者发现它们之前发现弱点并改进其安全性。组织正转向渗透测试，帮助他们确定为保护安全而采取的措施的有效性。在测试过程中，可能会发现有关组织安全的问题。然而，渗透测试人员需要详细说明导致测试成功的“促成因素”。测试人员仅说明他们能够获取组织的敏感数据是不够的。测试人员有责任给出为什么会出现疏漏使他们能够实现目标。\n\
  \n渗透测试具有以下基本要求：\n\n1) 与任何其他任务一样，渗透测试需要一个明确定义的目标或目的，并清晰记录。更具体的目标更容易判断测试成功与否。例如：\n\
  \n目标 1：访问 ABC 公司网络\n\n目标 2：通过互联网访问 ABC 公司网络并访问销售部门的文件服务器\n\n目标 1 不精确，尽管它是可实现的。目标\
  \ 2 是精确且具体的。这就是我们所讨论的。\n\n每个进行的测试都需要其独立的目标。\n\n2) 渗透测试是有时间限制的。它应该在有限的时间内执行，就像在现实世界中一样。任何现实世界的攻击者在尝试渗透失败后都会放弃。此外，受保护的信息具有有限的有效寿命。任何渗透测试都需要承认这一点。因此，测试的目标必须包含根据考虑的目标类型、有用信息的寿命和预期威胁水平而设定的时间限制。\n\
  \n3) 组织的管理层应该批准渗透测试。由于此活动涉及访问组织的网络和信息系统，因此必须获得管理层的授权。\n\n### 渗透测试中使用的术语\n\n让我们看看与渗透测试相关的常用术语。\n\
  \n在本书中，我们将经常使用它们。它们是：\n\n\n\n\n- **测试员 (Tester)**：这是执行渗透测试的实体。它可以是一个个人也可以是一个群体。它是计划并执行渗透测试的测试人员。\n\
  - **攻击者 (Attacker)**：这是渗透测试者的原始版本。区别在于，测试员意意在帮助提高公司的安全性，而攻击者的意图是恶意的，即窃取公司的资源或信息。\n\
  - **攻击 (Attack)**：我们可以认为这些黑客或渗透测试人员为了绕过目标安全控制而所做的尝试。大多数情况下，攻击的序列包含电子、物理或程序性的方法。\n\
  - **管理层 (Management)**：这是组织的领导层。测试过程可能包含多个层级的管理，特别是控制特定区域的管理层。涉及的管理层将对测试范围产生影响。\n\
  - **测试主体 (The Test Subject)**：这可以是公司内部的一个小型组织单元，也可以是进行渗透测试的整个公司。\n- **目标 (The target)**：目标是遭受攻击的组织或系统。它可能意识到正在对其进行测试，也可能没有。无论哪种情况，大多数目标都有自己的防御机制来保护自己。\n\
  \n### 渗透测试是必要的吗？\n\n首先，渗透测试有助于特定组织确定其既定安全协议的有效性。这些协议可以是操作性的、技术性的或物理性的。测试员的工作将是通过尝试克服这些控制来判断这些控制是否能够胜任。渗透测试员还将评估组织对特定威胁的脆弱性。作为测试员，最关键的角色是发现组织的防御措施是多么有效，并通知他们需要改进的区域。此外，组织可以识别针对自身的威胁，而验证或否定这些威胁则取决于测试员。\n\
  \n通常，公司会使用渗透测试来向其目标市场巩固其稳固的形象。在这里，公司可以表明它能够抵御攻击，因此是安全的且拥有稳健的基础设施。这种测试还可以警示组织的管理层，其运营或系统内部可能存在潜在的安全威胁。一次执行得当的渗透测试可以系统地揭示漏洞。管理层可能并不知道这些漏洞的存在。\n\
  \n## 渗透测试的类型\n\n第一类检查主体的物理基础设施。测试员可以利用组织的物理安全性。在大多数情况下，问题不在数据库和其他配置上，而在于已实施的物理防御措施。这里需要问的问题包括：是否有足够的访问控制？容纳组织的建筑是否有安保人员？他们受过良好培训吗？员工离开建筑时是否对敏感材料进行了检查？电子设备在进出建筑时是否经过注册和验证？为了回答这些问题，测试员将尝试在人们上班的时间段（例如早晨）进入建筑。假设入侵者可以在不经过检查的情况下进入公司大楼，他们将处于能够获取其所追求信息的境地。\n\
  \n第二类渗透测试关注组织的运营方面。运营测试通过绕过这些操作程序来确定组织内既定操作流程的有效性。这与物理测试不同，后者只检查对网络、设施或公司电脑的物理访问。\n\
  \n第三种也是最后一种类型是电子测试。在 във测试机制中，测试员将攻击公司的网络、通信设施或计算机系统。电子测试可以通过自动化工具完成，也可以手动进行。在这里，主要目标是破解所考虑主体所使用的通信设施和数据网络对攻击的脆弱性。\n\
  \n# 第 2 章：漏洞评估\n\n## 漏洞评估简介\n\n首先，让我们问自己这些问题：你们的计算资产是如何防范攻击的？它们能够抵御攻击吗？能达到什么种程度？为了圆满回答这些问题，我们需要确定组织安全链中的薄弱环节，以便我们能够准备充分的防御措施。漏洞评估有助于对给定通信基础设施或网络内的安全漏洞或差距进行描述、识别和分类。\n\
  \n`Kali Linux` 在涉及漏洞评估的问题上非常有用用。这是通过它随附的一系列令人印象深刻的分析工具实现的。通过这些工具，渗透测试员能够发现目标网络中的任何漏洞。这意味着我们执行安全测试可能需要的所有工具都存在于\
  \ `Kali Linux` 中。唯一的问题是，由于具备所有这些功能，这个发行版可能会让不熟悉的用户感到无从从。通过这本书，初级和中级安全工程师以及专家和分析师将学习如何利用\
  \ `Kali Linux` 识别操作系统、组织 Web 网站以及托管数据库的基础设施中的漏洞。\n\n我们执行漏洞映射来帮助我们挖掘可能导致系统被破解的安全缺陷。“漏洞映射”一术有时与“漏洞评估”互换使用。这是渗透测试员或恶意黑客在完成充分的信息收集和枚举后采取的下一步。我们将查看由\
  \ `Kali Linux` 操作系统提供的许多工具，这些工具可以帮助我们发现计算环境中的漏洞。正如我们之前指出的，漏洞可能会导致系统被破解，导致真实的黑客或测试员违反系统的完整性、可用性和机密性。\n\
  \n### 漏洞类型\n\n我们可以将漏洞分为三类截然不同的类别。这些类别包括：\n\n1. **设计漏洞 (Design vulnerabilities)**：这类漏洞是由于在给定系统中使用的软件规范产生的弱点导致的。它们最难解决，因为通常需要根据渗透测试员建议的安全要求应用软件补丁。\n\
  2. **实现漏洞 (Implementation vulnerabilities)**：这些漏洞通常源于运行中的软件代码的缺陷。一旦发现软件缺陷，就将其归类在此处。\n\
  3. **运行性漏洞 (Operational vulnerabilities)**：属于这一类的漏洞通常是由于各种应用程序软件的部署和配置不当导致的。\n\n\
  上述漏洞在目标环境范围内以本地或远程的方式发生。本地性漏洞需要测试员拥有目标系统的物理访问权限才能利用。相反，远程发生的漏洞在利用时不需要物理访问目标系统。\n\
  \n### 漏洞分类法 (Vulnerability Taxonomy)\n\n\n\n\n\n随着技术的日益发展，漏洞的数量也一直在增加。为了跟踪所有漏洞，我们需要一套分类系统。目前，人们在构建分类法方面付出了巨大努力，以帮助我们对常见的漏洞进行分类。如你所见，这是一项艰巨的任务，国际组织已同意采用以下标准。我将提供下方每个漏洞数据库的链接：\n\
  \na) Google 黑客数据库 – `https://www.exploit-db.com/google-hacking-database/`\n\nb)\
  \ 常见缺陷枚举 (CWE) - 可以在此处找到：`http://cwe.mitre.org/data/index.html`\n\nc) 国家漏洞数据库 (NVD)\
  \ – `https://nvd.nist.gov/vuln`\n\nd) WASC 威胁分类 – `http://projects.webappsec.org/w/page/13246978/Threat%20Classification`\n\
  \ne) OWASP – `https://www.owasp.org/index.php/`\n\n任何黑客爱好者都应该访问上述网站，以获取有关漏洞的更多见解。\n\
  \n## 使用 Kali Linux 进行漏洞扫描\n\nKali Linux 是渗透测试员喜爱的工具箱，因为它预装了可以用于许多任务的工具。在这些工具中，我们拥有可以用于执行漏洞映射练习的工具。\n\
  \n## Web 应用程序漏洞扫描\n\n每天都有新的 Web 应用程序出现。这些程序在编码时通常没有考虑任何安全流程。忽略安全编码原则会导致应用程序在许多方面存在漏洞。通过以下工具，渗透测试员能够暴露上述文档列出的漏洞。\n\
  \n1. `Nikto2`\n\n基于 `LibWhisker2` 设计，这是一个非常直接的 Web 漏洞扫描器。它具有许多增强功能，例如它可以支持 `SSL`；它还可以部署在多个平台上，我们也可以用它来管理主机的身份验证以及规避\
  \ `IDS`。\n\n2. `OWASP ZAP`\n\n即 `OWASP Zed Attack Proxy`。该代理工具是一个开源 Web 应用程序，为用户提供关键功能，包括\
  \ Web 应用漏洞扫描。\n\n3. `Nessus`\n\n如果你想要一个自动化的 Web 漏洞扫描工具，`Nessus` 就是首选。它非常快速且易于使用，在短时间内需要快速漏洞评估时非常有用。\n\
  \n## 网络漏洞扫描\n\n我们还拥有 Kali Linux 内置的用于扫描网络设备的工具。这些工具可以扫描交换机、数据库、路由器以及 `SMB` 等协议。这些工具是无尽的，但我们只描述常用的那些。\n\
  \n1. `CISCO Analysis`\n\n我们有很多 `CISCO` 设备存在漏洞，可以使用一些工具来揭示它们。Kali Linux 绑定了 `Cisco\
  \ Auditing Tool`，可以帮助我们对路由器进行审计。该实用程序帮助渗透测试员或攻击者映射从 `SNMP` 团体字符串、默认凭据到旧 `CISCO`\
  \ 漏洞的各种漏洞。\n\n2. `SNMP` 分析\n\n为了准备针对特定主机的攻击，渗透测试员和攻击者通常使用简单网络管理协议 (`SNMP`) 从主机获取信息。\n\
  \n## Kali Linux 中的数据库评估\n\nKali Linux 使测试员或黑客能够评估 Microsoft `MSSQL`、`MySQL` 和 `Oracle`\
  \ 数据库的漏洞。在这里，可以关注的漏洞包括 `SQL 注入`、默认密码检查和密码策略测试。\n\n### `SQLMap`\n\n可以使用 `SQLMap`\
  \ 工具对数据库进行 `SQL 注入` 测试。适用数据库示例包括 `MySQL`、`PostgreSQL`、`MSSQL` 和 `Oracle`。除了检测已发现的缺陷，`SQLMap`\
  \ 还能利用这些缺陷，因此测试员和黑客都倾向于使用它，因为它非常全面。如果没有这个工具，像 `UNION` 查询、堆叠查询 (`Stacked query`)、推断盲\
  \ `SQL 注入` 和基于时间的盲 `SQL 注入` 等攻击将非常耗时且费力。\n\n## 总结\n\n你现在可以进入下一个阶段了，在使用上述工具挖掘漏洞后，该阶段通常是漏洞利用。在某些情况下，只需要对漏洞进行枚举；上述工具能够充分完成任务。\n\
  \n# 第 3 章：无线网络攻击\n\n## 无线网络攻击引言\n\n无线网络如今已成为无处不在的特征。它们为家庭用户、工作场所以及公共场所提供了连接互联网的方式，使用户能够访问资源并开展业务。\n\
  \n总的来说，它们简化了业务并让生活变得更加容易。然而，这也带来了一些安全相关的风险。黑客已经能够通过 Wi-Fi 网络侵入公司、政府机构和银行。近期攻击数量显著增加，这使得网络安全管理员必须使无线网络更加安全、可靠和健壮。Kali\
  \ Linux 可用于破解无线网络，因此它是测试无线网络防御攻击的重要工具。\n\n## 理解和检查无线网络\n\n能够从你的设备扫描并连接到其他网络设备，是成为成功黑客的关键。发现并操纵\
  \ `Wi-Fi` 和 `蓝牙` 连接是一项基本技能。如果黑客能够获得无线连接的权限，他们就可以进入设备并访问机密。然而，第一步是学习如何找到这些设备。\n\n\
  ## Wi-Fi 网络\n\n我们将从 `Wi-Fi` 开始。首先，让我们看看书中将遇到的基础 `Wi-Fi` 术语。\n\n扩展 `SSID` – 它与服务集标识\
  \ (`SSID`) 相似，但可以用于多个 `AP`。\n\n基础服务集标识 (`BSSID`) – 它是识别每个 `AP` 的特定工具，等于设备的 MAC 地址。\n\
  \n服务集标识 (`SSID`) – 这就是网络的正确名称。\n\n功率 – 你离 `Wi-Fi` 接入点越近，功率越高，连接越容易破解。\n\n接入点 (`AP`)\
  \ – 无线用户在访问互联网时连接到`接入点`。\n\n安全性 – 这是所读取的 `Wi-Fi` 接入点上使用的安全协议。对于 Wi-Fi 有三种主要的安全协议：无线等效加密\
  \ (`WEP`)、Wi-Fi 保护访问 (`WPA`) 和 `WPA2PSK`。\n\n模式 – `Wi-Fi` 可以运行三种模式：管理模式 (managed)、主机模式\
  \ (master) 或监听模式 (monitor)。\n\n## 基础无线命令\n\n### `ifconfig`\n\n在 Unix 操作系统中执行网络接口配置需要\
  \ `ifconfig`。它是系统中的一种实用程序。具体来说，`ifconfig` 是一个用于让许多操作系统系统脚本可用的接口工具。\n\n\n\n\n此外，`ifconfig`\
  \ 通常用于更改网络接口的介质访问控制（MAC）地址。要执行此过程，必须首先使用 `ifconfig` 命令禁用接口（设置为 down）。接下来，必须输入以下\
  \ MAC 命令来更改它：\n\n```\nifconfig wlan0 down\nifconfig wlan0 hw ether 13:11:20:33:49:66\n\
  ifconfig wlan0 up\n```\n\n总而言，`ifconfig` 具有以下功能：\n\n* 启用查看所有网络设置\n* 显示任何网络接口的信息\n\
  * 查看特定网络接口的网络设置\n* 禁用和启用网络接口\n* 为接口分配 IP 地址\n* 为网络接口分配子网掩码\n* 为网络接口分配广播地址\n* 更改接口的\
  \ MTU\n* 启用和禁用混杂模式\n* 添加和删除别名\n* 更改网络接口的 MAC 地址\n\n### iwevent\n\n该命令显示由名为 `RTNetlink`\
  \ 的套接字接受的无线事件（Wireless Events）。每行显示一个特定的无线事件。这些事件解释了指定无线接口上发生的情况。它不接受任何参数。\n\n###\
  \ iwspy\n\n`iwspy` 是一个基础无线命令，可以监控特定的节点列表并评估每个单独节点的链路质量。`iwspy` 提供的信息与 `/proc/net/wireless`\
  \ 提供的信息相同。该命令还收集噪声水平和信号强度。因此，列表中的每个单独地址都会为驱动程序增加开销。需要注意的是，此功能仅适用于你关联的无线小区包含的节点；你将无法监控任何当前未关联的接入点（你可以仅利用扫描来实现此目的），以及任何其他小区的中的节点列表。在大多数情况下，当使用管理模式时，数据包将由接入点中继。在这种情况下，你将收到接入点的信号强度。这些原因解释了为什么此功能几乎总是用于\
  \ ad hoc（点点）模式和主模式。\n\n### iwlist\n\n该命令可以用于扫描可用的无线网络，还可以显示 `ifconfig` 无法提供的任何关于无线网络的其他信息。这个基础命令非常有用，因为它为你提供了一个精心筛选的附近无线接入点列表，以及它们的\
  \ MAC 地址和 SSID。\n\n### ifrename\n\n该命令用于根据多个静态标准重命名无线网络接口，以便为每个接口分配分配名称。\n\n每个网络适配器都会接收第一个可用的名称（`eth0`、`eth1`……）。这是因为网络接口名称本质上是不断变化的。然而，网络接口呈现的顺序可能会有所不同。最近，`ifrename`\
  \ 已更新，赋予了用户选择想要为网络接口命名的能力。此外，它还包含一个工具，可以选择与系统当前网络接口协调的接口名称。接口的 MAC 地址通常是 `ifrename`\
  \ 使用的选择器。注意，`ifrename` 需要在接口生效之前运行，这解释了为什么它的主要用途是不同的脚本（`init`、`hotplug`），但很少由用户亲自操作。`ifrename`\
  \ 使用 `/etc/iftab` 中的可用映射为网络适配器赋予新名称。\n\n### iwgetid\n\n这用于报告当前正在使用的无线网络的 NWID、ESSID\
  \ 或接入点地址。`iwgetid` 会自动显示每个设备的 ESSID。当出现 ESSID 不可用时，它将输出 NWID 代替它。提供的信息与 `ifconfig`\
  \ 的信息相同。相比之下，在各种脚本中完成集成更加简单且更高效。\n\n## 使用 Aircrack-ng 进行 Wi-Fi 侦察\n\n黑客总是想尝试的一件事是破解\
  \ Wi-Fi 接入点。如所述，在攻击 Wi-Fi AP 之前，你需要目标 AP 的 MAC 地址、客户端以及 AP 运行的通道。我们可以使用 `aircrack-ng`\
  \ 工具集的工具获取所有信息以及更多信息。要有效使用这些工具，你首先需要将你的无线网卡设置为监控模式（monitor mode），以便网卡能够查看百分之百经过的流量。网卡只捕获其正常情况下的流量。在有线网卡上，监控模式类似于混杂模式。使用\
  \ `aircrack-ng` 工具集中的 `airmon-ng` 命令可以将你的无线网卡设置为监控模式。\n\n## 检测和连接蓝牙\n\n最近，几乎所有的小设备、系统和设备都内置了蓝牙。这些设备可以是计算机、iPod、智能手机、扬声器、游戏控制器、键盘、平板电脑等。破解蓝牙网络的能力可能导致设备信息的泄露，假设涉及到对设备的控制以及获取了一个从设备向和向设备传输权限信息的平台等。因此，如果我们想要利用这项技术，就需要了解蓝牙的工作原理。通过这本书，你将获得一些基础知识，这些知识将在扫描和连接蓝牙设备以为破解它们做准备时非常有用。\n\
  \n### 蓝牙的工作原理\n\n首先，我们可以蓝牙定义为一种无线通信技术，它允许设备在较短距离内无线发送语音或数据。这项技术旨在取代连接设备的无处不在的电缆，同时确保通信的安全。连接两个蓝牙设备的过程被称为配对（pairing）。只要将两个设备设置为可发现模式，几乎两个设备都可以配对。在可发现模式下，特定的蓝牙设备将广播关于它们的以下信息：\n\
  \n* 技术信息\n* 名称\n* 服务列表\n* 类\n\n配对后，两个蓝牙设备将交换链路密钥。设备将存储该密钥，以便在未来的配对中识别对方。每个设备都有一个唯一标识符，通常还有一个制造商分配的名称。当我们想要识别和访问设备时，这些数据非常有用。\n\
  \n### 蓝牙扫描和侦察\n\nLinux 有一个名为 `BlueZ` 的蓝牙协议栈实现，我们用它来扫描信号。大多数 Linux 发行版（包括 Kali Linux）都内置了该功能。`BlueZ`\
  \ 拥有帮助我们扫描和管理蓝牙设备的工具。上述工具示例：\n\n* `hciconfig`；它是 Linux 中 `ifconfig` 的等物，但是为蓝牙设备设计的。\n\
  * `hcitool`；这是一个我们用于执行查询的工具。查询可以是设备 ID、名称、类，甚至是时钟信息。这有助于设备同步。\n* `hcidump`；蓝牙通信的嗅探由该工具执行；因此让我们有机会捕捉通过信号传输的数据。\n\
  \n进行蓝牙扫描和侦察的第一步是检查我们正在使用的蓝牙适配器是否被识别并启用，以便我们使用它扫描其他设备。\n\n\n\n\n\n- 无线渗透测试用于评估与访问无线网络相关的风险。\n\
  - 无线接入点为黑客渗透特定的内部网络提供了便捷的入口。\n- 在进行渗透测试或无线扫描后，可以对网络中的漏洞进行修复和加固。\n\n我们将在本书中介绍无线渗透测试的几个重要步骤：\n\
  \n### 渗透测试流程\n\n#### 1. 实验环境搭建\n\n首先，我们需要以下设备：\n\n一台安装了 Kali Linux 的笔记本电脑/电脑：该操作系统可以从\
  \ [`www.kali.org/downloads/`](https://www.kali.org/downloads/) 免费下载。\n请确保获取与你的电脑兼容的版本。\n\
  \n无线网卡：在进行无线测试时，这是最重要的一点。该网卡必须被你电脑上安装的操作系统支持。如果你的网卡不支持，可以使用外部无线网卡。在这里，需要具有数据包嗅探和数据包注入能力的\
  \ USB 无线网卡。\n\n密码列表：密码列表可以定义为黑客和渗透测试人员在破解无线网络时使用的密钥。密码短语（Passphrase）是网络用于加密的字符串。有时，短语被称为网络安全密钥，又称为预共享密钥（PSK）。当我们拥有详尽的密码库时，访问无线网络的概率就会增加。这是一个非常需要注意的点。\n\
  \n我们有许多选择，包括：\n- 我们可以从存储库利用密码列表文件。\n- 从 Google 下载密码列表文件。在这里我们可以获得更新后的列表。\n- 我们还可以使用简单或复杂的密码列表和字典。\n\
  \n在分析无线加密强度之前，我们首先需要不同类型的加密协议、无线渗透测试工具、如何更改 MAC 地址以及 WLAN 发现背后的流程。\n\n#### 2. 无线渗透测试所需的工具\n\
  \n用于半自动化攻击的无线工具包。\n\n用于发现无线网络的工具：`ministumbler`、`Wi-Fi hopper`、`airfart`、`karma`、`wirelessmon`、`wellenreiter`、`apradar`、`aerosol`、`kismet`、`netstumbler`、`aphopper`\
  \ 等。\n\n用于捕数据包的工具：包括 `Cain`、`Wireshark`、`airtraf`、`Airopeek` 和 `apsniff`。\n\nWPA/WEP\
  \ 密码工具：`wzcook`、`airsnort`、`wep attack`、`Aircrack-ng`、`Airbase`、`Aircrack-ptw`、`cowpatty`、`wep\
  \ crack`。\n\n用于帧生成的工具：`Commview`、`fake AP`、`Airgobbler`、`airsnarf`、`airpwn`。\n\n\
  用于全自动无线攻击的无线工具包\n\n在自动攻击中，我们可以使用 `Fern`、`Wi-Fi honey` 以及名为 `Wifite` 的无线网络审计工具。\n\
  \n#### 3. 无线网络加密协议\n\n以下是用于无线网络信息保护三个协议。保护是从接入点到系统。\n\na) WEP：这是有线等隐私的缩写。在无线网络中，这是最早开发的加密协议。WEP\
  \ 旨在为了提高 WLAN 的安全性。其目的是使无线网络的安全性达到有线网络。无线网络的一个关注问题是隐私。该加密协议的一个致命缺陷是未对密钥进行哈希处理。密钥还与初始化向量（IV）相关。这是一个非常大的缺陷。OS\
  \ 参考模型的底层（数据链路层和物理层）使用这种加密。WEP 不能为用户提供端到端的安全。这种加密协议有很多漏洞，并且在技术上已经过时。WEP 创建的密码由于在逻辑上薄弱，很容易被破解。\n\
  \nb) WPA：这是 Wi-Fi 保护的缩写。这种加密协议是对 WEP 的改进。它利用 `TKIP`，全称为临时密钥完整性协议。`TKIP` 在每次消息完整性检查和数据包时更改密钥。它还用于保护数据包的捕获、修改和重发，以确定数据包是否被修改。它使用\
  \ `EAP`（扩展身份验证协议）进行用户身份验证。这是因为 WEP 中的身份验证是通过易被嗅探的 `MAC` 地址执行的。WPA 被认为极受到受到计时攻击或字典攻击。\n\
  \nc) WPA2：它是带有某些增强功能的 `WPA`。目前，它是最常用的加密安全协议之一。这种加密协议采用了我们称为高级加密标准的、通常缩写为 `AES`。与临时密钥完整性协议相比，它是非常安全的。它可以支持自组织网络（ad-hoc\
  \ networks）。它的前身 `WPA` 仅限于基础设施网络。通常人们错误地认为 `AES` 是不可破解的。事实并非如此。只要密码简单，任何加密协议都可以被破解。也就是说，加密协议的优坏取决于使用的密码。WPA2\
  \ 可以进一步分为两类：\n- WPA2-PSK：此协议专为小型网络设计。例如服务于单个家庭的网络。\n- WPA2-ENT：这种加密协议是为了为企业实体服务的。与\
  \ `WPA2-PSK` 相比，我们可以说它是更安全的网络，因为加密中使用的短语没有存储在本地。\n\n#### 4. 客户端与接入点简述\n\n在考虑破解无线网络之前，我们需要知道客户端是如何与接入点交互的。正如你将在书中看到的，我们首先要执行的是开启无线网卡的设备。目的是为了对通信进行嗅探。该任务使用\
  \ `Wireshark`。为了这一点，应设置为杂杂模式。这样，传输的数据包都会被捕获。\n\n#### 5. 无线攻击\n\n我们将学习破解无线网络的技术。这些方法分为全自动和半自动。我们从后者开始，好吗？\n\
  \n### 半自动技术\n\n1. 启动接口：开启接口是破解任何无线网络的初始步骤。\n2. 修改 MAC 地址：这种手段有助于黑客或恶意用户在破解无线网络的过程中隐藏身份。黑客可以使用名为\
  \ `MAC changer` 的命令修改设备的 `MAC` 地址。\n3. 创建监控 (`mon0`) 接口：你必须将无线网卡设置为监控模式。\n4. 检测可用无线网络：为了搜索可用无线网络，黑客可以执行\
  \ `airodump-ng` 命令，以便发现潜在目标。\n5. 选择目标网络：从可用无线网络中选择一个目标。记住你所选无线网络运行的具体通道。同样，记录下它的\
  \ `MAC` 地址。\n6. 捕获目标数据包：一旦黑客决定攻击哪个无线网络，他们将启动数据包捕获。\n7. 断认证攻击：终止目标与接入点的连接直到攻击者发送断认证包。这将强制目标重新连接，从而能够捕获\
  \ `ARP` 数据包。\n8. 绕过无线密钥：通过使用 `aircrack-ng`，可以将捕获的密码文件与黑客拥有的密码文件运行。`captureddata`\
  \ 是目标捕获的密码文件名。\n\n\n\n\n\n### 9. 获取和破坏关键信息\n\n黑客/恶意用户能够嗅探对组织至关重要的信息。这在获取密码后是可以实现的。可以访问的关键信息示例包括密码、用户名和会话\
  \ ID。这些凭据可用于在整个无线网络中执行进一步的破坏攻击。\n\n## 全自动技术\n\n在破解无线网络时，全自动技术无疑是最佳方法。该方法使用 `Fern`\
  \ Wi-Fi 破解器，它能够破解如 `WPA2`、`WPA` 和 `WEP` 等多种加密协议。这种无线黑客工具利用命令行进入这些网络。`Fern` 有一个直观的图形界面，攻击者可以通过它选择各种参数以及输出显示的位置。整个过程是自动的。会话劫持和通过\
  \ MAC 地址对计算机进行地理定位是 `Fern` 的附加功能。\n\n一旦运行 `python` 脚本，`Fern` 将打开其图形界面。此时，黑客只需要选择一个无线接口，然后点击扫描按钮以获取访问点。在扫描并选择一个要攻击的网络后，点击攻击按钮开始。剩余步骤将由软件处理。在\
  \ `Fern` 捕获到握手包后，将开始暴力破解。简单且直接。如果发现的 `WPA` 密钥位于正在使用的密码列表中，它将以红色显示。\n\n# 6. 无线网络威胁\n\
  \n目前，我们有许多针对无线网络的攻击，能够影响任何组织 IT 基础设施的可用性、完整性和机性。\n\n- **AD-HOC 网络**：恶意用户能够连接到你的自组织网络，从而访问敏感文件。这到目前为止是黑客可以实施的最直接的攻击。\n\
  - **镜像访问点**：如名所示，恶意用户可以创建一个类似于合法访问点的伪造访问点。通过这个访问点，他们可以在受害者连接时获取受害的信息。伪造访问点发射的信号比真实访问点强。任何无线网络用户无疑都会连接到强信号。\n\
  - **无线嗅探**：我们可以说嗅探攻击是无线网络中执行的最危险的攻击之一。通过嗅探，恶意用户能够在传输过程中获取包。这将为他们提供查看所选网络详细信息的途径。假设发送的流量未加密，攻击者将能够访问包的所有细节。\n\
  - **缓冲区溢出**：在这种攻击策略中，恶意用户能够利用特定软件代码中存在的漏洞，以在目标机器上获得提升权限。\n- **病毒/蠕虫/间谍软件**：利用系统漏洞获取特权访问或操纵数据的恶意代码。\n\
  - **可远程控制软件**：使用此类软件，恶意用户能够接管并控制远程目标机器，从而破坏网络。\n- **欺骗/ARP 重定向**：恶意用户可以通过对你的系统实施欺骗攻击，将你的无线网络流量重重路由到他们的系统中。有时，我们把这种攻击称为\
  \ MAC 欺骗。\n- **拒绝服务攻击**：这是一种去认证攻击。攻击通常会断开目标客户端与 AP 的连接，直到发送去认证包为止。这种攻击的作用是断开特定的无线服务，其意图是使资源不可用。\n\
  \n# 7. 加固无线网络\n\n无线网络管理员可以采取以下措施，以防御网络免受恶意攻击。\n\n- **更改默认设置**：需要更改基础设施自带的默认设置；它们包括默认密码、弱算法和加密密钥。\n\
  - **使用强力加密算法**：利用强力算法进行加密符合你的最大利益。例如，它可以是至少八个字母，加上至少两个大小写字母和一个特殊字符的组合。\n- **将访问点设备放置在安全位置**：在决定访问点设备的位置时，你需要将其放置在大多数用户可以的地方。它应该给他们提供良好的信号强度。从安全角度考虑，它不应该“泄漏”或延伸到预期的使用点之外。\n\
  - **身份验证**：建议在授予用户访问权限之前验证任何用户的合法性或真实性。一个被证明最佳的解决方案是实施远程拨号用户认证服务 (`RADIUS`) 服务器来验证用户身份。\n\
  - **SSID 安全**：广播 SSID 会让潜在的无线网络攻击者工作变得简单。\n- **日志记录**：通过使用日志记录，组织能够轻松追踪攻击模式。\n-\
  \ **访问点更新**：为了缓解给定软件较旧版本中存在的漏洞，建议对访问点软件进行定期更新。这无疑会降低攻击发生的概率。\n- **无线审计**：这是一种检查给定无线网络安全强性的评估。审计结果可能包括安全策略漏洞、网络中存在未授权的设备等。\n\
  - **访客访问安全**：如果可能，组织可以为访客用户提供独立的访问点，或者在允许他们使用主网络之前对其进行身份验证。\n- **安全意识**：这是加固无线网络时需要考虑的一个重要方面。告知、教育和提高组织员工敏感性的责任在于组织本身。员工应该理解无线网络安全的影响，以便让安全工作从自己做起。\n\
  - **无线 IDS/IPS**：可以使用安全的配置来实现，以监控流量。一旦发生任何可疑行为，即可生成警报。该系统还可以用于管理无线设备，在任何一个设备丢失时，它能够提供报告。\n\
  \n## 最佳无线黑客资源\n\n以下无线黑客工具可用于测试我们个人无线网络是否存在潜在的安全威胁。让我们直接开始吧。\n\n### Aircrack-ng\n\
  \n这是用于 `WEP`/`WPA`/`WPA2` 破解的最常用的工具之一。`Aircrack-ng` 资源用于识别和捕获握手包及数据包。它还用于断开连接到网络的客户端，并获取执行暴力破解和字典攻击的所有材料。`aircrack-ng`\
  \ 套件包含以下列出的工具：\n\n- `Airodump-ng`：用于捕获数据包\n- `Airbase-ng`：用于配置伪造访问点的工具\n- `Aircrack-ng`：用于无线密码破解\n\
  - `Aireplay-ng`：用于生成流量和客户端去认证\n\n`Aicrack-ng` 套件是 `Kali Linux` 的标准配置。为了使用此工具，你的\
  \ Wi-Fi 卡需要支持数据包注入。\n\n### PixieWPS\n\n这是一个针对已知 WPS 漏洞的新工具。该工具使用 `C` 语言编写，通过利用漏洞访问点极低的（或有时不存在的）熵，用于离线暴力破解\
  \ `WPS` PIN。这被称为 pixie dust 攻击（粉尘攻击）。为了使其工作，它需要修改版的 `Wifite` 或 `Reaver` 配合使用。\n\n\
  ### Wifite\n\n\n\n\n\n这是一个自动化 Wi-Fi 攻击工具，用于攻击使用 WEP/WPA/WPA2 和 WPS 加密的无线网络。\n\n\
  ### Wireshark\n在我看来，这是目前最好的网络协议分析仪工具。通过 `Wireshark`，人们可以对网络进行全面分析。它可以用于实时数据包捕获、对协议进行仔细检查，以及跨平台浏览和过滤数据包。\n\
  \n### Reaver\n该工具针对 Wi-Fi 安全设置（WPS）注册器的 PIN 码并对其进行攻击以获取访问密码。由于许多路由器制造商和 ISP 默认开启\
  \ WPS，许多路由器在出厂时就容易受到这种攻击。为了正确地使用 `Reaver`，你需要确保到无线路由器的信号强度足够，并进行正确的配置。\n\n### oclHashcat\n\
  `oclHashcat` 未包含在 Kali Linux 中，它不是专门的 Wi-Fi 破解工具；然而，它能够利用 GPU 快速对捕获的握手包进行暴力破解和字典攻击。在使用\
  \ `Aircrack-ng` 套件或任何其他工具捕获 WPA 握手包后，你可以使用 `oclHashcat` 你的 GPU 成功破解它。\n\n### Crunch\n\
  `Crunch` 可用于基于字典的攻击。它也可以直接链接到其他工具，例如 `Aircrack-ng`。这种能力了一个大量时间，因为你不需要等待它生成详细的密码列表就可以使用它们。\n\
  \n### Macchanger\n`Macchanger` 是一个重要的工具，可以将你的 MAC 地址伪装为随机 MAC 地址。在进行 Wi-Fi 破解时，伪装\
  \ MAC 地址可能是为了避免 MAC 过滤或在无线网络上掩盖身份。\n\n### Fern Wi-Fi Cracker\n这是一个用 Python 编写的无线安全审计和攻击工具。`Fern`\
  \ 可以破解并恢复 WEP、WPA 和 WPS 密钥，并包含成功完成 MiTM 攻击的工具。`Fern Wi-Fi Cracker` 运行在任何 Linux 发行版上，包含了前提条件。Kali\
  \ Linux 包含了 `Fern Wi-Fi Cracker`。\n\n### Wash\n我们可以使用此工具检查特定的访问点是否启用了 WPS。它还可以检查在\
  \ `Reaver` 尝试之后，访问点是否锁定了 WPS 机制。这是因为许多 AP 在遭受暴力破解后通常会锁定。该实用程序与 `Reaver` 软件包一起一起，正如我们所说的，它是\
  \ Kali Linux 中的标准工具。\n\n# 第 4 章：网络分析与管理\n\n## 网络分析与管理简介\n理解网络对于任何渴望成为黑客的人来说都是关重要的。在许多情况下，你将通过网络对目标进行攻击，优秀的黑客需要知道如何连接并与该网络交互。例如，你可能需要连接到一台隐藏了\
  \ IP 地址的计算机，或者你可能需要将目标的域名系统（DNS）查询重定向到你的系统。这类任务相对简单，但需要一些 Linux 网络知识。本章将向你展示在网络攻击之旅中用于分析和管理网络的一些基本的\
  \ Linux 工具。\n\n### 使用 IFCONFIG 分析网络\n`ifconfig` 命令是检查和与活动网络交互的最基本的工具之一。你可以简单地在终端中输入\
  \ `ifconfig` 来查询你的活动网络连接。\n\n### 使用 IWCONFIG 检查无线网络设备\n如果你有一个无线适配器，可以使用 `iwconfig`\
  \ 命令收集无线破解的关键信息，例如适配器的 IP 地址、其 MAC 地址、它所处的模式等。当你使用如 `aircrack-ng` 等无线破解工具时，从此命令中可以获得的信息尤为重要。\n\
  \n### 修改你的网络信息\n能够更改你的 IP 地址和其他网络信息是一项实用的技能，因为它可以帮助你在访问其他网络的同时，在这些网络上显示为受信任设备。例如，在拒绝服务（DoS）攻击中，你可以伪造你的\
  \ IP，使攻击看起来来自另一个源，从而帮助你在取证分析期间规避 IP 捕获。这在 Linux 中是一个相对简单的任务，通过 `ifconfig` 命令即可。\n\
  \n### 修改 IP 地址\n要更改 IP 地址，输入 `ifconfig` 后跟你想要重新分配的接口，以及想要分配给该接口的新 IP 地址。例如，如果你想为接口\
  \ `eth0` 分配 IP 地址 `192.168.181.115`，你将输入：\n\n```\nkali >ifconfig eth0 192.168.181.115\n\
  kali >\n```\n\n当你正确操作时，Linux 将返回命令提示符且什么不说。然后，当你再次使用 `ifconfig` 检查网络连接时，你应该看到 IP\
  \ 地址已更改为你刚刚分配的新 IP 地址。\n\n### 修改网络掩码和广播地址\n你也可以通过 `ifconfig` 命令更改网络掩码和广播地址。例如，如果你想为\
  \ `eth0` 接口（假设 `101.172.101.14`）分配 `14.14.0.0` 的网络掩码和 `191.152.10.189` 的广播地址，你将输入：\n\
  \n```\nkali >ifconfig eth0 101.172.101.14 netmask 14.14.0.0 broadcast 191.152.10.189\n\
  kali >\n```\n\n如果你一切都做得正确，Linux 会返回新的命令提示符。现在再次输入 `ifconfig` 以验证每个参数是否已更改。\n\n###\
  \ MAC 地址伪装\n可以使用 `ifconfig` 更改 MAC 地址（hwaddr）。MAC 地址是全球唯一的，通常被用作防止黑客进入网络的安全措施。更改\
  \ MAC 地址以伪装不同的 MAC 地址非常简单，可以抵消这些安全措施。因此，它是绕过访问控制的一种非常有实用的技术。\n\n要伪装 MAC 地址，只需使用\
  \ `ifconfig` 命令的 `down` 选项关闭接口。然后输入 `ifconfig` 命令，后跟接口名称（硬件 hw，以太网用 ether）以及新的伪装\
  \ MAC 地址。最后，使用 `up` 选项重新开启接口使更改生效。\n\n### 从 DHCP 服务器分配新 IP 地址\nLinux 有一个动态主机配置协议服务器，它运行一个后台守护进程，称为\
  \ `dhcpd` 或 DHCP 守护进程。DHCP 服务器为子网上的所有系统分配 IP 地址，并记录任何时候哪个 IP 地址分配给了哪台机器。这使得取证分析师在攻击后追踪黑客有一个很好的资源。因此，理解\
  \ DHCP 服务器如何运作非常有帮助。通常，从局域网连接互联网需要 DHCP 分配的。因此，在设置静态 IP 地址后，你必须返回并获取新的 DHCP 分配。要这样做，你可以重启系统，但我将向你展示如何在不关闭和重启系统的情况下检索新的\
  \ DHCP 地址。要从 DHCP 请求 IP 地址，只需使用 `dhclient` 命令后跟想要分配地址的接口来调用 DHCP 服务器。\n\n```\nkali\
  \ >dhclient eth0\n```\n\n### 操纵域名系统\n黑客可以在目标系统的域名系统（DNS）中发现大量信息。尽管 DNS 的设计是将域名转换为\
  \ IP 地址，但黑客可以利用它获取有关目标的信息。\n\n### 使用 Dig 检查 DNS\n\n\n\n\nDNS 是将像 `Google.com` 这样的域名转换为相应\
  \ IP 地址的服务。通过这种，你的系统就知道了如何访问它。如果没有 DNS，我们将被迫记住许多常用网站的 IP 地址。对于有志的黑客来说，最有用的命令之一是\
  \ `dig`，它提供了一种收集目标域名 DNS 信息的方法。这些信息可能包括目标的名称服务器 IP 地址、邮件服务器以及任何 IP 地址和子域名。\n\n###\
  \ 更改你的 DNS 服务器\n\n在某些情况下，你可能想使用另一个 DNS 服务器。要这样做，你需要编辑系统上名为 `/etc/resolv.conf` 的纯文本文件。用文本编辑器打开该文件——我正在使用\
  \ `Leafpad`。然后，在命令行中输入你编辑器的准确名称，随后是文件的路径和文件名。\n\n### 映射你自己的 IP 地址\n\n你系统中一个名为 `hosts`\
  \ 的特殊文件也执行域名到 IP 地址的翻译。`hosts` 文件位于 `/etc/hosts`，与 DNS 类似，你可以用它来指定自己的 IP 地址与域名映射。换句话说，你可以决定当你在浏览器中输入\
  \ `www.microsoft.com`（或任何其他域名）时，浏览器访问到哪个 IP 地址，而不是让 DNS 服务器决定。作为一个黑客，这可以用于劫持局域网上的\
  \ TCP 连接，使用如 `dnsspoof` 等工具将流量重指向恶意 Web 服务器。默认情况下，`hosts` 文件仅包含到你的 `localhost`（位于\
  \ `127.0.0.1`）和你的系统主机名（在此例中 `Kali`，位于 `127.0.1.1`）的映射。但你可以添加映射到任何想要域名的任何 IP 地址。\n\
  \n# 第章：渗透测试与网络安全\n\n# 渗透测试\n\n随着组织对安全的意识日益增强，安全泄露的成本呈指数级增长，许多大型组织开始外包安全服务。这些关键安全服务之一就是渗透测试。渗透测试本质上是一种合法的、受委托的黑客攻击，旨在演示公司网络和系统的漏洞。通常，组织会先进行漏洞评估，以发现其网络、操作系统和业务中的潜在漏洞。我强调“潜在”二字，是因为这种漏洞扫描包含了大量的误报（即被识别为漏洞但实际上并非漏洞的内容）。渗透测试人员的角色是尝试攻击或渗透这些漏洞。只有这样，组织才能知道漏洞是否是真实的，并决定投入时间和金钱来修复漏洞。\n\
  \n### 进行渗透测试的重要性\n\n渗透测试作为一种主动的安全措施，将使能够能够以下操作：\n\n1. 能够在恶意用户之前发现漏洞\n\n通过对系统进行黑客攻击，是了解你安全水平高低的一种极佳方法。让我们用一种易于理解的方式来描述：源自外部源的黑客尝试使你能够以安全的方式测试系统的系统的抗性。这是因为该过程模拟了潜在恶意之者的行为。这可能利用由于设置不当、操作弱点、软件漏洞、代码中的错误、甚至是服务配置错误而导致的漏洞。与真实的黑客体验不同，渗透测试是在受控且安全的方式下执行的。它是对真实黑客攻击的精确模拟。\n\
  \n通过这种测试，恶意黑客活动可能造成的潜在危害可以显现出来。打算进行此类测试的公司通常会预先设定规则。大多数情况下，组织会在应用程序和基础设施部署后立即进行渗透测试，有时在对关键基础设施进行更改后进行。因此，渗透测试将有助于在黑客利用它们之前尽早识别并验证网络中可能的安全相关漏洞。\n\
  \n2. 在减少网络停机的同时节省修复成本\n\n从安全泄露中恢复并不是一件易事。这是一个昂贵且混乱的过程，可能会产生惊人的成本影响。这些成本源于监管罚款、保护客户计划的投资，在极端情况下可能导致业务全面损失。因此，这意味着需要执行全面的安全措施来恢复正常运行。因此，使用渗透测试来识别威胁并防止它们是一种主动的解决方案。因为由于网络攻击造成的损失不仅是财务上的，还有声誉上的。鉴于此，明智的做法是每年进行或两次渗透测试。\n\
  \n3. 制定高效的安全措施\n\n渗透测试报告提供了全面的结果，你可以利用它对组织的安全水平进行评估。通过报告，高层将获得有关 IT 安全的见解信息，并理解其对基础设施性能和整体运行的潜在影响。报告提供的建议和修复措施可用于开发可靠且安全的系统。\n\
  \n4. 促进符合安全监管政策\n\n正如我们提到的，保护宝贵的 IT 资产免受潜在攻击时，渗透测试至关重要。渗透测试的益处不仅限于安全方面。领先的标准如 `ISO\
  \ 27001` 和 `PCI` 要求符合安全标准。通常情况下，不合规会导致巨额罚款。任何组织都不希望因不合规而受到惩罚。\n\n其中一些标准要求组织定期进行渗透测试。还需要常规执行的是安全审计。专业的安全分析师可以对此提供帮助。政策法规还规定，处理大量交易的组织需要进行年度和定期渗透测试，特别是在系统重新配置后。\n\
  \n5. 维护公司形象与客户忠诚度\n\n在进行渗透测试后，公司可以宣布其系统能够抵御黑客攻击。这可以作为其目标客户的一个营销点，即他们与公司的交易以及所有其他互动都是安全的，不受任何形式的破坏。这有助于公司的声誉。声誉与忠诚度密不可分。\n\
  \n### 渗透测试的阶段\n\n1. 侦察与规划\n\n\n\n\n\n# 渗透测试\n\n在渗透测试中，我们首先开始计划并执行侦察。在这里，将完成以下工作：\n\
  \n*   定义测试的目标和范围。明确说明将要测试的系统以及将采用的测试方法。\n*   进行情报收集，以便测试人员能够更好地理解所考虑的目标对象的工作原理，并发现任何固有的漏洞。\n\
  \n## 2. 扫描\n\n在收集情报之后，测试人员想要了解目标如何对多次入侵尝试做出响应。为了做到这一点，测试人员可以使用以下工具：\n\n* 动态分析 –\
  \ 指在应用程序运行状态下对其代码进行检查。我们可以看到，这是一种更实用的扫描方法，因为对应用程序的性能进行了实时检查。\n* 静态分析 – 渗透测试人员将对应用程序的代码进行检查，以模拟其在运行时的行为。使用这些工具可以在单次扫描中遍历整个代码。\n\
  \n## 3. 获取访问权限\n\n在了解目标的缺陷和弱点之后，就是利用它们的时候了。利用手段可以包括拦截流量、提升权限，甚至窃取数据。这一切都是为了了解可能造成的损害后果。\n\
  \n## 4. 维持访问权限\n\n测试人员的目标是确定他们发现的漏洞是否能帮助他们在被攻击的系统中实现持久存在。通过维持对系统的访问权限，攻击者能够获得深度访问。这里的想法是模拟高级持续性威胁（APT）。这类威胁通常在组织系统中留存长时间，以便从组织中窃取敏感数据。\n\
  \n## 5. 分析结果\n\n在完成渗透测试活动后，测试人员需要提交一份报告，详细说明测试的以下方面：\n\n* 被特定利用的漏洞\n* 能够访问的任何关键信息\n\
  * 在系统中检测到渗透测试人员所花费的时间。\n\n高层管理将利用此报告为组织制定安全策略，并配置针对此类入侵的防御措施。根据此报告，将开发出缓解漏洞的补丁和安全解决方案。\n\
  \n## 渗透测试方法\n\n### 内部测试\n在这里，拥有应用程序访问权限的渗透测试人员将尝试模拟一种就像是由组织内部的恶意用户进行的攻击。这种模拟可能代表一种恶意用户通过钓鱼攻击窃取合法凭据的攻击。\n\
  \n### 外部测试\n这种渗透测试用于针对互联网上的公司资源；例如公司网站、Web 应用程序本身、电子邮件以及域名服务器。正如你现在所知道的，目标是访问上述系统并提取价值数据。\n\
  \n### 目标测试\n在这里，安全人员和测试人员共同工作。他们还会互相更新各自的行动和移动。这种方法为安全经理提供了实时的价值见解，从黑客的视角来看。\n\n\
  ### 盲测\n在这种情况下，测试人员仅被赋予目标组织的名称。这为安全经理提供了一个窥视即将发生的真实攻击的机会。\n\n### 双盲测试\n与上述盲测一样，组织中负责安全的人员将对要模拟的攻击没有预先知识。这类攻击最接近真实世界的攻击，在这种情况下，在漏洞发生之前，他们将没有时间来加固他们的保护机制。\n\
  \n## Web 安全\n\n就像实体商店、家庭、政府场所一样，Web 应用程序以及网站也容易受到安全安排和协议被绕过的影响。应对网络犯罪和 Web 应用程序破解需要稳健且可靠的安全措施。\n\
  \nWeb 安全正是是这一点。对我们来说，Web 安全的功能性定义可以是：它是一套在保护你的网站及其 Web 应用程序免受黑客攻击和未经授权的人员访问而采用的协议和保护措施。Web\
  \ 服务、网站和 Web 应用程序可以通过信息安全的完整划分来保护。这为在互联网上进行的任何操作提供了至关重要的安全。\n\n通常，我们在处理 Web 保护和或\
  \ Web 安全时涉及多个考虑因素。一个 Web 上的应用程序或网站要被认为是安全的，必须有各种技术和检查点的支持来保证其安全性。我们有随时需要遵守的标准。`OWASP`\
  \ 负责强调和实施这些标准。经验丰富的 Web 开发人员通常遵循 `ASP` 标准，并仔细研究 Web 黑客攻击事件数据库，以便了解导致网站被破解的漏洞以及它们是如何被破解的。\n\
  \n### 常见的网站安全威胁\n网站可以以多种方式受到攻击。在继续之前，我们需要了解一些常见的网站安全威胁。这些是我们在规划安全措施期间需要避免并防范的内容。其中一些包括\
  \ `Spam`、病毒和恶意软件、`WHOIS` 域名注册以及 `DDoS` 攻击等。\n\n## 如何保护你的网站\n\n在了解常见的安全威胁之后，让我们现在关注如何防止它们。假定你的网站是安全的是不正确的。只要你没有建立任何保护机制，它就有很大可能被攻击。以下是让你需要执行的若干步骤，以提高你网站的安全性。\n\
  \n* 限制文件上传\n让网站的访问者上传文件是有风险的。上传的文件可能包含旨在利用你网站上漏洞的脚本。所有上传的内容都需要被视为对网站安全的威胁。\n\n*\
  \ 使用 `HTTPS` 协议\n这告诉特定网站的访问者，他们实际上正在与正确的服务器进行交互。这意味着“没有人可以拦截他们的交互或他们查看的内容”。\n\n\
  * 保护你的个人电脑\n安全始于你！维护你的设备安全非常重要。黑客可以使用你的电脑作为进入你网站的网关。确保你拥有了最新定义的防病毒软件。这将保护你免受许多恶意攻击，包括文件下载。还可能通过窃取的\
  \ `FTP` 登录凭据向网站注入恶意软件。定期扫描设备中的恶意软件和病毒。\n\n* 更改你的默认 `CMS` 设置\n我们看到现在许多攻击通常是自动化的。恶意用户编写机器人帮助他们定位仍使用默认设置的站点。增加他们的难度。在安装你拥有的\
  \ `CMS` 时，修改仍处于默认模式的设置：\n- 评论所需的设置\n- 用户控制\n- 信息可见性\n- 文件权限\n以上都是你可以立即更改的设置。\n\n\
  \n\n\n\n## 选择安全的虚拟主机计划\n\n共享虚拟主机计划有更高的被攻击风险。尽管它们因为潜在的成本节省而吸引用户，但其保护水平也随之降低。因此，它们并不是一个安全的选择。请记住，廉价意味着昂贵！\n\
  \n网络安全攻击的大多数是由人为失误造成的。减少或限制人为干预可以极大地减少错误。并不是每位员工都需要访问你的网站。访客、网页设计师和顾问同样不应该获得自动访问权限。为了确保你的网站安全，需要实施“最小权限原则”。\n\
  \n## 更改密码\n\n更改密码是网络安全的一剂强心剂。所以，更改你的密码。仅仅更改密码是不够的，要养成经常更改的习惯。\n\n## 监控你的安全\n\n你可以获取一些工具来帮助你在线监控网站的安全性。这些工具可以帮助你进行安全审计，从而有助于暴露潜在的漏洞。通过这种方式，你可以在攻击发生之前采取应对措施。\n\
  \n## 为你的网站制作备份\n\n俗话说“有患于缪，备于未然”。随时做好最坏的打算是好的。在这种情况下，最坏的情况就是你的网站被入侵。备份可以让你感到安心，因为在发生入侵时不会丢失数据。\n\
  \n# 第 6 章：文本操作与 Bash 脚本编写\n\n## 文本操作\n\n正如我们之前看到的，在 Linux 中，几乎一切都是文件，准确地说是文本文件。一个很好的例子是，Linux\
  \ 中所有的配置文件都是文本文件。如果想对 Linux 中的应用程序进行重新配置，他们只需要打开配置文件、修改文本、重新保存，然后重启应用程序，这样重新配置就会生效。由于存在大量的文本文件，文本操作在管理\
  \ Linux 中变得至关重要。让我们来看一些用于在 Linux 中处理文本的命令和技术。我将使用 Snort 的文件进行演示。\n\n### 第 1 步：Cat\
  \ 命令\n\n`cat` 是最基本的文本显示命令。让我们 `cat` 一下通常位于 `/etc/snort` 的 Snort 配置文件。\n\n```bash\n\
  kali > cat /etc/snort/snort.conf\n```\n\n从上面可以看到，`snort.conf` 显示在我们的屏幕上，直到文件末尾。显然，这并不是处理该文件的方便方法。\n\
  \n### 第 2 步：使用 Head 命令\n\n假设我们只想查看文件的开头，可以使用 `head` 命令。默认情况下，该命令显示文件的前 10 行。\n\n\
  ```bash\nkali > head /etc/snort/snort.conf\n```\n\n在我们需要查看更多或更少行的情况下，可以在命令和文件名之间使用\
  \ `-` 选项。\n\n```bash\nkali > head -15 /etc/snort/snort.conf\n```\n\n在这里，只会显示 `snort.conf`\
  \ 的前 15 行。\n\n### 第 3 步：Tail 命令\n\n就像 `head` 命令一样，我们可以使用此命令查看文件的最后几行。该命令的语法如下：\n\
  \n```bash\nkali > tail -20 /etc/snort/snort.conf\n```\n\n### 第 4 步：行编号\n\n对于长文件，带有行号显示它们可能是理想的。例如，`snort.conf`\
  \ 有超过 600 行。编号使得引用更改变得简单得多，而且也容易回到文件的相同位置。要显示带有行号的文件，我们输入：\n\n```bash\nkali > nl\
  \ /etc/snort/snort.conf\n```\n\n现在每行都将有一个数字，使引用变得容易得多。\n\n### 第 5 步：Grep 命令\n\n\
  `grep` 是一个过滤命令；也就是说，它给了我们过滤文件内容进行显示的机会。`grep` 是 Linux 工作中一个至关重要且强大的命令，因为可以尽可能减少在搜索每个单词或命令出现处上花费的时间。\n\
  \n### 第 6 步：Sed 命令\n\n此命令允许我们查找单词或文本模式的出现并对其进行处理。它的名字是两个单词 stream（流）和 editor（编辑器）的缩写。简单来说，`sed`\
  \ 的工作方式与 Windows 中的查找和替换功能相同。\n\n### 第 7 步：Less 和 More 命令\n\n正如我们之前说的，`cat` 是一个很好的工具命令。然而，在涉及大文件显示时，它有许多缺点。还记得我们说\
  \ `cat` 并不方便吗？\n\n`more` 先出现，是手册页使用的工具。让我们用 `more` 命令打开 `snort.conf`。\n\n```bash\n\
  kali > more /etc/snort/snort.conf\n```\n\n你会发现 `more` 只显示第一页，并在左下角显示我们显示了文件的比例。`less`\
  \ 与 `more` 类似，尽管它具有一些额外的功能。要用 `less` 打开 `snort.conf`，输入以下：\n\n```bash\nkali > less\
  \ /etc/snort/snort.conf\n```\n\n你会在屏幕左下角看到 `less` 高亮了文件的路径。\n\n## Bash 脚本编写\n\n\
  Bash 脚本可以描述为一个由纯文本组成的文件，其中包含一系列命令。这些命令包括我们可以正常输入到命令行中的命令，以及我们通常不会输入的命令。注意：任何可以在终端中正常执行的命令都可以放在\
  \ bash 脚本中。反之亦然。通常，脚本会附带 `.sh` 扩展名。这在 Linux 系统中并不是必要的。\n\n### 这些脚本是如何工作的？\n\n如果你通常与计算机交互过，你就会理解我们称为程序的东西和其他称为进程的东西。我们认为程序是一组供计算机处理的指令组成的软件包，通常存储在硬盘上。\n\
  \n当程序运行时，实际运行的是它的副本。这个副本被称为进程。在这里正在进行的是指令和其他资源从硬盘复制到 `RAM`（即工作内存）。此外，还会分配 `RAM`\
  \ 中的临时空间供操作系统在执行过程中跟踪和管理进程。\n\n在正常情况下，我们有多个在计算机内存中同时运行的进程。在它们完成后，系统将销毁它们，以便我们不再有程序的进程。在终端处，我们将有一个运行的\
  \ Bash 进程来提供 Bash shell。\n\n### Bash 脚本是如何运行的？\n\n这非常简单。首先，运行脚本被称为执行脚本。我们必须为脚本设置权限。出于安全考虑，这些权限默认没有设置。跳过这一步会导致错误消息，但代码仍然可以运行。看一下示例脚本。\n\
  \n```bash\n#!/bin/bash\n# 这是一个 Bash 脚本示例，由 Sutherland 编写\n\necho Welcome to Kali\
  \ Linux!\n```\n\n我们将解释一下这里发生的情况：\n\n- 第 1 行 – 即我们所谓的 shebang。\n- 第 2 行 - 这是一个注释。`#`\
  \ 之后的任何内容都不会被执行。\n- 第 4 行 – 这是名为 `echo` 的命令。它会将消息打印到屏幕上。在第 4 行，你会看到它被高亮了。语法高亮仅为了易于阅读。你自己的文件里可能不需要它。\n\
  \n### ./ 的作用是什么？\n\n\n\n\n对于普通命令，我们只需要输入名称，见证！它就会开始执行。要运行一个 bash 脚本，我们在其前面加上 `./`。Bash\
  \ 将尝试在名为 `$PATH` 的变量包含的目录中查找你在命令行中输入（不带 `./`）的名称。目录之间的分隔使用 `\" : \"` 完成。此脚本将在这些特定目录中进行搜索，而不会查看你的当前目录或其他子目录。\n\
  \nBash 将在搜索上述上述目录后，运行它找到的第一个脚本或程序实例。值得注意的是，`$PATH` 变量会随每个用户而异，他们可以根据自己的喜好进行设置。\n\
  \n以下是这样做的原因：\n\n1.  通过这种方式，我们可以安装某个程序的多个不同版本。我们还能够根据它们在 `$PATH` 中的位置来决定执行哪一个。\n\
  2.  它提供了前所未有的便利性。从上面的冗长解释可以发现，`bin` 目录位于主目录下。用户可以将自己的程序和已安装的脚本放在那里。无论这些程序位于系统中的什么位置，用户只需简单地输入名称即可使用它们。如果你希望获得稍微不同的行为，也可以创建一个与程序名称相似的脚本。\n\
  3.  整体安全性提高了——看这个，恶意用户可能会制作一个旨在删除主目录下所有内容的脚本。不执行该脚本对你是有益的。只要脚本不在你的 `$PATH` 中，就不会出现任何问题。\n\
  \n你也可以告诉 bash 在哪里找到程序脚本，假设它不在你 `$PATH` 中的任何一个目录中。这可以通过在脚本名称或程序名称前面包含一个相对路径或绝对路径来实现。不要忘记点（`.`）指的是代你当前所处的目录。假设脚本位于主目录下，你可以通过使用绝对路径来执行它。\n\
  \n### Shebang (`#!`)\n\n从上面的脚本中，我们可以看到它位于第一行。\n\n井号（`#`）和感叹号（`!`）的字符序列被称为 Shebang。Shebang\
  \ 后面跟着的是通向程序或解释器的路径，它负责执行文本文件的剩余部分。在这里，我们确保格式正确至关重要。Shebang 必须放在文件的第一行。让我重复一遍，`#!`\
  \ 必须插入到文件的第 1 行。另一个需要注意的点是，在符号 `#`、感叹号 `!` 和解释器路径之间不应该有空格。省略 Shebang 也是不明智的，因为 Bash\
  \ 壳会假设它是一个 Bash 脚本。这意味着它仅会在脚本正在 Bash 壳中运行的假设下工作。\n\n\n\n\n你现在应该可以看到显示握手成功的指示输出。然而，如果你没有看到，那么有很多因素可能导致了它的失败。一个常见的问题是无线信号太弱，在这种情况下，你只需要将电脑移近无线路由器即可。此外，连接的设备可能没有配置为自动重新连接到网络。如果是这样，你将必须等待它们重新连接。\n\
  \n## 第 9 步\n\n在成功重连握手后，我们需要破解该协议。输入以下命令，并根据你的配置插入参数：\n\n```\naircrack-ng -a2 -b\
  \ [Router-BSSID] -w [Wordlist-File] /root/Desktop/*.cap\n```\n\n该命令中唯一的新参数是一个我们尚未讨论过的字典列表（wordlist）。从本质上，字典列表被识别为一个由许多字符组合组成的文件，这些组合将用于完成攻击。你可以从网上免费找到它们，只需记住你将数据存储在计算机的哪个位置，并使用文件的路径作为前一个命令的参数即可。一旦正确输入命令，软件将启动破解无线加密的进程。\n\
  \n## 第 10 步\n\n现在只需要等待软件破解密钥。请注意，为了成功破解加密，Wi-Fi 密码必须包含在字典列表中。这被称为字典攻击，它与暴力破解略有不同。字典攻击只是尝试列表或数据库中的所有密码，而暴力破解攻击方式则会尝试利用所有可能的字符组合。如果你的字典未能找到正确密码，你可以尝试使用额外的字典列表。还要注意，实际上破解密码可能需要很长时间，这取决于密码的强度和复杂性，以及你计算机硬件的速度。\n\
  \n## 第 11 步\n\n一旦软件成功破解密码，它将在终端中间附近显示密钥，内容如下所示的行：\n\n`KEY FOUND! [ wireless key\
  \ ]`\n\n去试着用这个密钥登录玩玩吧。\n\n## 最后……\n\n从安全攻击的角度来说，破解 WPA 和 WPA2 加密其实简单。但请记住负责任地使用这些信息，因为后果可能会非常严重。\n\
  \n### 使用帧网络进行攻击\n\n这种攻击也被称为去身份验证拒绝服务攻击（de-authentication DoS Attack）。在这里，攻击者向网络发送大量执行去身份验证的帧。目标接收到去身份验证帧时将从无线网络断开。如果攻击持续，网络用户将无法维持连接。攻击者有能力通过多种方式启动去身份验证拒绝服务攻击。常用的方法包括：\n\
  \n* 攻击者可以创建伪造的去身份验证帧，并将源 MAC 地址设置为受害者。这是通过将 MAC 地址和目标 MAC 地址设置为 AP（接入点）的 MAC 地址来实现的。，AP\
  \ 认为有一个真实用户想要退出网络，随后该用户就会断开。\n* 攻击者可以创建伪造的去身份验证帧，并将源 MAC 地址设置为 AP 的 MAC 地址，目标 MAC\
  \ 地址设置为受害者的 MAC 地址。然后，攻击者可以继续将这些伪造帧注入目标网络。这些伪造帧到达用户终端后，会将使用户从网络中断开。\n* 攻击者可以创建一个源\
  \ MAC 地址为 AP、目标为广播 MAC 地址的数据包。所有连接到特定接入点的用户都将断开连接。广播去身份验证拒绝服务攻击的影响非常严重，以至于网络中连接到目标接入点的所有用户都可以被去身份验证。\n\
  \n攻击者可以使用诸如 `scapy`、`aircrack-ng` 套件、`file2air` 等工具来启动拒绝服务类去身份验证攻击。攻击者只需要网络的 SSID、接入点的\
  \ BSSID、目标的 MAC 地址即可开始。`TCPdump`、`airodump-ng`、`Wireshark` 和 `kismet` 是攻击者可以用来获取这些信息的工具。无线网络攻击者可能会选择在传输去身份验证帧之间插入沉默期，以规避检测并使攻击更具隐性。\n\
  \n# 第 8 章：文件系统与存储设备管理\n\n## 文件系统\n\n### 什么是文件系统？\n\n我们将文件系统描述为特定操作系统用于跟踪存储在分区或磁盘上的文件的机制或数据结构。即：在磁盘上进行组织文件的方式。它也用于表示用于存储文件的分区或文件系统的类型。磁盘或分区与其包含的文件系统之间的区别至关重要。少数程序直接在磁盘或分区的原始扇区上操作；如果那里存在现有的文件系统，它将会被破坏或严重损坏。大多数程序在文件系统上运行，因此无法在不包含文件系统或类型错误的分区上运行。在分区或磁盘被用作文件系统之前，需要对其进行初始化，并并将记账所需的数据结构写入磁盘。这个过程被称为格式化文件系统。\n\
  \n大多数 UNIX 文件系统具有相似的通用结构。该结构包含一个超级块（superblock）、一个 `inode`、一个数据块（data block）、一个目录块（directory\
  \ block）和一个间接块（indirection block）。目录存储名称以及 `inode number`。目录中的一个条目由用于表示文件的 `inode\
  \ number` 和文件名组成。`inode` 拥有多个数据块的编号，这些编号用于存储特定文件中的数据。`inode` 中只有一小部分用于存储数据块编号。需要更多空间时的分配是动态进行的。动态分配的块被称为间接块。这意味着如果你想获取\
  \ `data block`，首先需要定位其位于间接块中的编号。\n\n用户可以在 UNIX 文件系统的文件中创建一个“空洞”。这是文件中一个零字节的地方。该地方没有分配实际的磁盘扇区。通常用于某些数据库、小型二进制文件和\
  \ Linux 共享库等特殊情况。Linux 支持多种类型的文件系统。最重要的文件系统包括：\n\n* Minix：这是最老的，无疑是最可靠的。然而，它的功能有限且能力受限；例如每个文件系统最多允许\
  \ 64 MB。\n* ext2：这种文件系统是专门为了向上兼容而设计的。\n* Ext：`ext` 不向上兼容，是 `ext2` 的旧版本。它在目前的安装中已很少被使用。\n\
  * ReiserFS：这种文件系统非常健壮。它利用日志（journaling），从而使得数据丢失的可能性极低。我们多次提到的日志通常是一种记录的机制。通过存储这些记录，文件系统在发生某些损坏后能够轻松、快速地自我修复。例如，由于系统不正常关机导致的损坏。\n\
  * Xia：这只是一个改进后的 minix 文件系统。它不再对文件名和文件系统的大小有限制。这是它与 minix 的唯一区别。没有添加新功能。尽管它运行良好，但它并不受欢迎。\n\
  \n\n\n\n\n`ext3` – 就像 `ext2` 一样，该文件系统拥有 `ext2` 的所有特性并增加了一个功能。这就是日志功能（journaling）。因此，恢复时间和性能得到了极大提高。\n\
  \n`jfs` – 是一种带日志的文件系统，由 IBM 创建，用于对高性能有高要求的环境。\n\n`NFS` – 这是一个网络文件系统，允许在多台计算机之间共享文件系统，从而授权对其中文件的访问。\n\
  \n`smbfs` - 一种兼容 Windows 文件共享协议的网络文件系统，允许 MS Windows 计算机共享文件系统。\n\n`umsdos` – 简单来说，`umsdos`\
  \ 允许将普通的 msdos 文件系统像 Linux 文件系统一样使用。这消除了为 Linux 准备独立分的需求。\n\n`xfs` – Silicon Graphics（硅图形）设计了这种文件系统，使其功能类似于\
  \ 64 位日志文件系统。同样，它在处理大文件和大文件系统时能够提供高性能。\n\n`MS-DOS` – 这种设计是为了提供与 MS-DOS 和 FAT 文件系统的兼容性。\n\
  \n`vfat` – 这是 FAT 文件系统的扩展，被称为 `FAT32`。它主要的用处在于支持比 FAT 更大的磁盘容量。大多数 MS Windows 磁盘都是\
  \ `vfat`。\n\n`iso9660` – 这是一个标准的 CD-ROM 文件系统。\n\n`hpfs` – 这是一个用于 OS/2 的文件系统。\n\n\
  `sysv` – 这是一个用于 SystemV/386、Coherent 和 Xenix 的文件系统。\n\n`NTFS` – 这是微软最先进的日志文件系统，相比之前的微软文件系统提供了更快的访问速度和稳定性。\n\
  \n## 决定使用哪种文件系统\n\n截至今天，带日志的 `Ext3` 文件系统是最流行的。选择这种文件系统无疑是一个明智的决定。与 `ext3` 类似的还有\
  \ `Reiserfs`。记得我们说过它也是一种带日志的文件系统。使用哪种文件系统可以根据用户的需求具体情况而定。他们可能需要兼容性、速度、可靠性，或者是账目记录所需的结构开销。虽然还有许多其他因素，但这些是常见的。我们使用“日志文件系统”术语来指代在文件存储机制中使用日志功能的文件系统。日志的主要功能是记录文件系统内部发生的情况，即日志。在不幸发生系统崩溃的情况下，日志文件系统将利用日志来重建未保存或丢失的数据。然而，对此产生着迷是不明智的。没有什么是是完美的；错误会在某些时刻产生。每当紧急情况发生时，备份重要信息是唯一可靠的方法。\n\
  \n## 创建文件系统\n\n文件系统是使用 `mkfs` 命令创建的；即进行初始化。每种文件系统类型都有自己独立的程序。`mkfs` 可以被认为是用于根据首选文件系统类型执行相应程序的前端。可以使用\
  \ `-t fstype` 选择文件系统类型，这是该命令提供的选项之一。大多数通过 `mkfs` 命令调用的程序在命令行界面（命令行界面）上略有不同。以下是常用的参数：\n\
  \n* `-t fstype`: 用于选择文件系统类型。\n* `-c`: 搜索坏块。它还会相应地初始化坏块列表。\n* `-l filename`: 允许从指定文件中读取初始坏块列表。\n\
  \n## 文件系统块大小\n\n块大小用于指定文件系统在读写数据时应采用的大小。随后，这意味着在处理大文件的位置或系统中，较大的块大小有助于提高磁盘输入/输出的性能。数据库就是一个例子。这是因为数据读取或写入操作可能需要更多时间来寻找下一个块。然而，在拥有许多小文件的文件系统情况下，可能会浪费大量的磁盘空间。\n\
  \n以 `/etc` 为例。某些文件系统支持的最大文件大小由块大小决定。在大多数情况下，现代文件系统的限制是块的数量，而不是文件大小或块大小。\n\n## 挂载与卸载\n\
  \n在使用文件系统之前，必须对其进行挂载。为了确保一切按预期工作，操作系统随后会执行许多账目记录任务。在 UNIX 中，单一目录树包含了所有文件。挂载文件系统的操作通常会导致新文件系统的内容类似于已挂载文件系统中的现有子目录的内容。`mount`\
  \ 命令只能接受两个参数。接受的第一个参数是与包含文件系统的分区或磁盘相对应的设备文件。第二个参数是将被挂载的目录。正如我们之前提到的，执行这些命令后，两个文件系统的内容将分别类似于\
  \ `/home` 目录和 `/usr` 目录的内容。\n\n设备文件提供了访问磁盘原始内容的权限，而挂载目录则提供了磁盘上的文件。挂载的目录被称为挂载点（mount\
  \ point）。挂载目录不需要为空，但它必须存在。注意，当文件系统挂载时，其中包含的任何文件通过名称无法访问。如果文件系统不需要挂载，可以使用 `umount`\
  \ 命令将其卸载。该命令 `umount` 只接受一个参数。该参数可以是挂载点或设备文件。卸载和挂载都需要用户拥有超级用户权限。这意味着只有 root 用户可以执行这些操作。\n\
  \n在用户可能需要使用软磁盘的情况下，我们可以使用某些方法授予他们权限。例如，可以给用户 root 密码。这在安全性上并不理想，尽管它是自然的解决方案。尽管如此，在不需要安全性的情况下效果良好，例如在非网络系统中。或者，使用\
  \ `sudo` 对于想要挂载或卸载的用户来说非常有用。像第一种方法一样，它的安全性较低。它并没有赋予所有人直接超级用户权限。在这里，管理员需要代表用户进行思考。sudo\
  \ 可以配置为允许用户执行特定的命令。最后，用户可以使用该工具的实用程序，它设计用于在不挂载的情况下处理 MS-DOS 文件系统。在只需要 MS-DOS 软磁盘的情况下非常有用。\n\
  \n\n\n\n在启动时，许多系统会自动运行 `fsck`，以便在系统开始使用之前检测并修复任何错误。这是一个好事，因为它防止了对损坏文件系统的使用。你不会希望使用一个损坏的文件系统。在数据结构混乱的情况下，损坏的文件系统只会变得更糟糕，从而导致数据丢失变得不可避免。不仅如此，在大规模文件系统上运行\
  \ `fsck` 需要花费大量时间。在大多数情况下，正确关闭的文件系统不会出现错误。为了避免这些耗时的检查，可以使用本文此处介绍的选项。首先，如果存在 `/etc/fastboot`\
  \ 文件，则不进行任何检查。第二种方法是 `ext2` 文件系统超级块中存在的唯一标记，这些标记用于指示文件系统在最后一次挂载操作后是否已正确卸载。这意味着，`e2fsck`（`ext2`\
  \ 文件系统的 `fsck` 版本）如果标志位显示卸载已正常执行，则将跳过检查。\n\n请注意，只有当文件系统在启动时被自动挂载时，才可能进行自动检查。此外，你也可以使用\
  \ `fsck` 手动检查其他文件系统，这些可以是软盘等许多设备。最后一点，仅在未挂载的文件系统上运行 `fsck` 命令。绝对不要在已挂载的文件系统上执行此操作。访问原始可能会可能会操作系统感知的情况下对文件系统进行修改，后果可能是灾难性的。\n\
  \n### 使用块检查磁盘错误\n\n定期检查磁盘是否存在坏块是一个高尚的想法。为了实现这一点，我们可以利用 `bad blocks` 命令。该命令将列出它在磁盘中找到的所有坏块列表。我们可以将该列表传递给\
  \ `fsck`，以便记录在文件系统的数据结构中。这将防止操作系统使用坏块进行数据存储。\n\n## 存储设备管理\n\n### 存储模型\n\n通过观察负责固定位比特的设备与上层之间交互的方式，就可以区分不同的存储模型。我们有以下存储模型：\n\
  \n1. 直接附加存储 (DAS)\n\n让我们考虑硬盘通过总线适配器直接连接到服务器的场景。通过这种连接，操作系统能够检测到这些设备，并在上面维护文件系统。这提供了访问，尽管间接层级最低。台式机、笔记本电脑以及大多数服务器系统都使用这种机制。所有共享接口的组件都由单个操作系统的服务器控制。此外，每个服务器都有自己的存储系统。在硬件层面上，可以使用现若干技术之一来实现与存储介质的连接。\n\
  \n这种存储模型的一个简单应用是拥有单个硬盘的服务器。拥有多个设备直接附加到其上的服务器也很常见。这里的配置完全取决于下一层高层存储的策略。在文件系统层次结构中的不同位置挂载单个磁盘是非常容易完成的。组合许多附加磁盘的另一种方法是使用\
  \ `RAID`；这全称为“独立磁盘冗余阵列”（Redundant Array of Independent Disks），或逻辑卷管理器。它们分别被著名的缩写为\
  \ `RAID` 和 `LVM`。这里的想法是提高系统性能、增加冗余性，并增加存储容量。这种类型的存储不需要与使用它的服务器位于同一个物理位置。直接附加存储的优点包括：\n\
  \n* 消除了故障可能，因为在硬件和操作系统之间没有其他额外的层或网络。\n* 也不存在由网络延迟导致的性能损失。\n\n现在暂且忽略优点，来看看该模型的一个主要缺点。\n\
  \n* 存储设备的直接附加意味着网络上某台机器正在使用的数据无法立即提供给其他系统。\n\n2. 网络附加存储 (NAS)\n\n在这里，用户数据存储在共享磁盘上，这些磁盘提供给特定网络内的所有客户端。这意味着无论用户使用什么设备，都可以在完全相同的位置访问他们的数据。要实现这一点需要以下两个因素：\n\
  \n1. 必须有某种方式使主机文件系统能够检索中心位置的数据。\n2. 需要通过整个网络对中央存储进行访问。\n\n这种存储模型带来了一系列复杂的问题，如性能和访问控制。\n\
  \n3. 存储区域网络 (SAN)\n\n已经讨论的网络附加存储要求所有用户使用一个特定的文件系统。随着对网络附加存储和存储区域网络硬件的数据可用性、性能、数据冗余和存储大小的需求增加，允许用户在块级上访问大块存储变得变得必要。为此，构建了专用的高性能网络来管理数据存储。在这里，可以通过能够高性能的接口和协议访问中心位置的存储介质。这些包括光纤通道（fiber\
  \ channel）和另一种我们称为 `iSCSI` 的技术，它是互联网小型计算机系统接口的缩写。\n\n`SAN` 因其分布式特性和显著的性能优势而被被称为“企业解决方案”。这是事实，特别是在使用了交换机架构（switched\
  \ fabric）的情况下。存储区域网络通过协议封装，可以克服局域网的限制。例如，`iSCSI` 允许通过广域网将交换存储区域网络组件连接起来。系统管理员负责提供所有这些模型中的物理存储设备。\n\
  \n4. 云存储\n\n在存储模型讨论的每一步中都引入了额外的间接层。这导致了用户、磁盘空间、冗余等方面的增加。敏锐的读者应该已经注意到，我们已经从直接附加存储中的块级访问转变为分布式文件系统中跨越专用存储网络的块级访问。\n\
  \n然而，这一切确保了用户被限制在特定的网络中。许多组织正在从维护自己的基础设施转变为我们称为 `IaaS` 的模型。女士们先生们，这就是基础设施即服务。\n\n\
  云存储属于云计算。它可以用于表示向用户提供文件存储和托管服务的商业服务。示例包括 Google Drive 和 Dropbox。云存储被需要现有存储模型提供的灵活存储解决方案的公司使用。在这种存储模型中，我们有三种不同的类别：\n\
  \n* 为用户提供块级访问的服务。这意味着用户可以根据意愿创建分区和文件系统，例如 `OpenStack` 提供的 `Cinder` 服务。\n* 提供对象级访问的服务，一个例子是\
  \ `Windows Azure` 提供的 `Blob Storage`。\n* 提供文件系统级访问的服务。文件托管服务的示例是 `Amazon simple\
  \ storage`。\n\n\n\n\n\n上述所有类别都依赖于指定的 API，以提供通过程序化方式访问存储单元的能力。许多分布式存储资源通常被组合在一起，创建一个大型存储池。单元从这个存储池中进行分配和释放，单元也可以被重新分配或迁移，最后，单元还可以被复制。这是通过在高层使用程序，并通过对低层存储系统进行良好定义的接口来实现的。云存储解决方案具有以下优势：\n\
  \na) 可以轻松导入、导出或将整个操作系统镜像和应用程序部署为虚拟设备。\n\nb) 消除单个存储组件简化了云存储基础设施。\n\nc) 存储单元可以根据需要立即可用。其可用性是动态的；即，它可以根据使用模式增长或收缩。\n\
  \n然而，云存储并非免于故障。这是由于增加了多层抽象导致的。此外，对第三方提供的抽象存储容器的依赖阻止了对系统进行端到端的故障排除。这意味着当我们外包数据存储时，我们将面临许多安全忧虑。这些忧虑范围涵盖了数据安全和隐私。当我们通过互联网访问文件时，很有可能会增加延迟，从而降低吞吐量。云服务提供商可能是一个完全在我们领域之外的\
  \ SPOF（单点故障）。\n\n### 存储模型考量\n\n随着存储需求的增加，存储模型的架构变得更加复杂。这是一个需要注意的关键考量。间接层和额外的抽象层带来了指数级的成本和复杂性。拥有更多活动部分的系统可能会发生灾难性的故障。更换一个坏的硬盘很容易，但要重建一个被数百个客户端使用的存储阵列并不容易。随着用户数量的不断增加，为用户提供弹性、可靠性和冗余的存储解决方案将非常有用。我们看过的存储模型是交织的。所有存储解决方案的底层都是直接连接存储，因为位最终必须存储在某个地方。\n\
  \n网络附属存储的概念在任何基础设施中显而易见。这跨越了多个工作站和存储网络。云存储使用这两种模型为复杂网络提供存储。尽管如此，我们每添加一个层就会产生安全风险。隐私和完整性是至关重要的。然而，在安全方面，云存储经常通过不可信的网络传输并提供用户数据。这需要使用安全套接层或传输层安全协议来保护数据。与更复杂的模型相比，简单的数据存储模型更安全且更具扩展性。所以请注意。\n\
  \n### 磁盘设备与接口\n\n我们一直在讨论的各种存储模型是，它们是访问存储设备的手段，以便我们可以存储数据。以下工具用于数据存储：磁带、基于 DRAM 的存储、硬盘驱动器、固态硬盘和\
  \ DVD 等光介质。最常用的存储设备是硬盘，它在通常旋转的磁性盘上进行数据存储。系统管理员需要对硬盘的物理结构有深入的理解。这些硬盘通过多种方式提供给服务器。\n\
  \n主机总线适配器通过单个数据电缆和独立的电源线直接连接到各个磁盘。`SATA`、`PATA`、`Fiber Channel`（光纤）和 `SCSI` 都是传统接口的示例。`SCSI`\
  \ 已经存在了四分之一世纪，但已被高级技术附件（Advanced Technology Attachment）标准淘汰。集成设备电子（`IDE`），也称为并行高级技术附件（Parallel\
  \ Advanced Technology Attachment），利用由带线制成的 80 芯或 40 芯电缆。该接口允许最多连接两个设备，通常是主设备（master）和从设备（slave）。串行\
  \ ATA（Serial ATA，`SATA`）接口允许热插拔、更细的电缆和更快的吞吐量。我们在此提到的所有接口都可以是内部的也可以是外部的。\n\n# 第 9\
  \ 章：变得安全与匿名\n\n## 变得安全与匿名简介\n\n我们今天在互联网上做的几乎一切操作都在被追踪。无论是谁在进行追踪，是 Google 跟踪我们的在线搜索、网站访问和电子邮件，还是安全机构编目录我们的活动，我们在线上的每一次移动都会被记录、索引，然后被挖掘以供某人受益。特别是黑客，需要了解如何限制这种追踪并在网络上保持相对匿名，以限制这种监控。在本章中，我们将学习如何通过这四种方法在浏览网页时保持匿名：\n\
  \n* 洋葱网络（The Onion Network）\n* 代理服务器\n* 虚拟专用网络\n* 私密加密电子邮件\n\n没有一种方法可以确保你的活动免受窥探目光的骚扰，如果有足够的时间和资源，任何事情都可以被追踪。然而，这些方法可能会让追踪者的工作变得困难得多。\n\
  \n### 互联网是如何暴露我们的？\n\n让我们从高层次讨论一下我们在互联网上的活动被追踪的一些方式。我们不会涉及所有的追踪方法，也不会对任何一个过程进行过细的描述，因为那超出了本书的范围。首先，你的\
  \ `IP address` 在你穿过互联网时识别你的身份。从你的机器发送的数据总是标记有你的 `IP address`，使得你的活动易于追踪。其次，Google\
  \ 一同其他电子邮件服务会“读取”你的电子邮件，寻找关键词以更有效地向你投放广告。虽然有更复杂、更耗费时间争资源的方法，但这些是我们在书中将尝试防止的。\n\n\
  ### IP 地址如何在互联网上暴露我们\n\n当你跨越互联网发送一个数据包时，它包含了该数据源地和目的地的 `IP addresses`。通过这种方式，数据包知道它要去何处以及向何处返回响应。每个数据包都会经过多个互联网路由器，直到找到目的地，然后跳回发送者。对于一般的网络上网，每次“跳”都是数据包到达目的地所经过的路由器。发送者和目的地之间可能有多达\
  \ 30 次跳转，但通常，任何数据包会在少于 15 次跳转内找到目的地。当数据包穿过互联网时，拦截数据包的人可以看到是谁发送的、它去过哪里以及它要去何处。这就是单向网站，它们在你到达时就能知道你是谁并自动登录，这也是他人追踪你在互联网上行踪迹的方式。\n\
  \n### 洋葱路由器系统\n\n美国海军研究局在 20 世纪 90 年代开发了一种用于间谍目的的匿名浏览互联网的方法。计划是建立一个与互联网路由器分开的路由器网络。这些路由器可以加密流量，并且只存储上一个路由器的未加密\
  \ `IP address`，这意味着路径上的所有其他路由器地址都是加密的。这个想法是，任何监控流量的人无法确定数据的来源或目的地。这项研究在 2002 年被称为洋葱路由器项目（The\
  \ Onion Router Project），现在供任何人使用，在网络上进行相对安全和匿的浏览。\n\n### Tor 如何工作\n\n\n\n\n通过 Tor\
  \ 发送的数据包并不是通过那些受许多人密切监控的普通路由器发送，而是通过全球 7,000 多个路由器组成的网络发送。除了使用独立的路由器网络外，Tor 还对每个数据包的数据、目的地和发送者\
  \ IP 地址进行加密。在每一个跳点（hop），信息都会被加密，并在被下一跳节点接收时解密。通过这种，每个数据包仅包含路径上上一个跳转的信息，而不包含源的 IP\
  \ 地址。如果有人截获了流量，他们只能看到上一个跳转的 IP 地址，而网站所有者只能看到发送流量的最后一个路由器的 IP 地址。这确保了互联网上的相对匿名性。\n\
  \n遗憾的是，代价是通过 Tor 浏览器上网可能会慢得多；因为路由器数量远少于此，该网络的带宽是有限的。Tor 浏览器不仅能够访问传统互联网上的几乎任何网站，还能访问暗网。构成暗网的网站需要匿名性，因此它们只允许通过\
  \ Tor 浏览器访问，并且它们的顶级域名以 `.onion` 结尾。暗网因非法活动而闻名，但那里也有一些合法的服务。\n\n### 关于 TOR 的安全忧虑\n\
  \n几家情报机构将 Tor 网络视为对国家安全的威胁，认为这种匿名网络使外国政府和恐怖分子能够在不受监视的情况下进行通信。因此，几个实力强劲且雄心勃勃的研究项目正致力于破解\
  \ Tor 的匿名性。Tor 的匿名性曾被这些当局破解，并且很可能再次被破解。例如，美国国家安全局（NSA）运行着自己的 Tor 路由器，这意味着当你使用 Tor\
  \ 时，你的流量可能正在经过 NSA 的路由器。\n\n如果你的流量是从 NSA 的路由器流出的，那情况就更糟了，因为出口路由器始终知道你的目的地。NSA 还有一种被称为“流量相关性”（traffic\
  \ correlation）的方法，涉及寻找入站和出站流量中的模式，这种方法已经能够破解 Tor 的匿名性。破解 Tor 的尝试不会影响它在商业服务面前隐藏你身份的效力。我们已经以\
  \ Google 为例。然而，它们可能会限制浏览器阻止你受间谍机构监控的功效。\n\n### 2. 代理服务器\n\n实现匿名性的另一种方法是使用代理。代理是充当流量中间人的中间系统：用户连接到代理服务器，流量在被传递之前会被赋予代理的\
  \ IP 地址。当流量从目的地返回时，代理会将流量发回源端。通过这种方式，流量看起来来自代理，而不是源 IP 地址。代理可能会记录你的流量，但调查人员必须获得搜查令才能获取日志。为了让你的流量更难被追踪，你可以使用多个代理，这种策略被称为“代理链”（proxy\
  \ chaining）。链链可以是动态的，也可以是随机的。\n\n### 使用代理服务器的安全忧虑\n\n如果你打算保持匿名，请不要使用免费代理。黑客使用可以信任的付费代理。免费代理可能正在出售你的\
  \ IP 地址和浏览历史。虽然你离开代理的流量的 IP 地址是匿名的，但监视机构还有其他方法可以识别你。例如，代理所有者将知道你的身份，如果受到执法机构施加足够的压力，他们可能会交出你的身份来保护他们的业务。\n\
  \n### 3. 虚拟专用网络\n\n使用虚拟专用网络（VPN）可以是保持你的网络流量相对匿名和安全的有效方法。VPN 用于连接到中间互联网设备（如路由器），该路由器将你的流量发送到最终目的地，并标记上该路由器的\
  \ IP 地址。使用 VPN 确实可以增强你的安全隐私，但它并不是匿名性的保证。你连接的互联网设备必须记录或记录你的 IP 地址，以便准确地将数据发给你，因此任何能够访问这些记录的人都可以发现有关你的信息。\n\
  \nVPN 的美好之处在于它们简单且易于使用。你可以向 VPN 供应商开通账户，然后在每次登录计算机时都无缝连接到 VPN。你可以像往常一样使用浏览器浏览网页，但在任何观察者看来，你的流量来自互联网\
  \ VPN 设备的 IP 地址和位置，而不是你自己的。此外，你与 VPN 设备之间的所有流量都是加密的，因此即使你的互联网服务提供商也看不到你的流量。\n\n\
  其他诸外，VPN 可以用于规避政府控制的内容和信息审查。例如，如果你的国家政府限制你访问带有特定政治信息的网站，你可能可以使用位于你国外的 VPN 来访问该内容。一些媒体公司（如\
  \ Netflix）限制来自其所属国家 IP 地址的访问其内容。使用位于这些服务允许的国家的 VPN，通常可以让你绕过这些访问限制。一些最好的 VPN 服务是\
  \ IPVanish、NordVPN、ExpressVPN、CyberGhost、Golden Frog VPN、Hide My Ass、Private Internet\
  \ Access、PureVPN、TorGuard 和 Buffered VPN。\n\nVPN 的优势在于，你的所有流量在离开电脑时都会被加密，从而保护你免受窥探，并且当你访问网站时，你的\
  \ IP 地址会被 VPN IP 地址掩盖。与代理服务器一样，VPN 所有者拥有你的原始 IP 地址。\n\n### 4. 加密邮件\n\nGmail、Yahoo\
  \ 等免费商业邮件服务之所以免费是有原因的。。如果一个服务是免费的，那么你就是产品，而不是客户。此外，邮件提供商的服务器可以访问你邮件的未加密内容，即使你使用的是\
  \ HTTPS。防止邮件被窃听的一种方法是使用像 ProtonMail 这样的加密邮件。这意味着你的邮件在 ProtonMail 服务器上被加密，即使是 ProtonMail\
  \ 的管理员也无法读取你的邮件。ProtonMail 是由瑞士 CERN 粒子加速器设施的一群年轻科学家创立的。ProtonMail 的服务器位于欧盟，那里在个人数据共享方面的法律比美国严格得多。ProtonMail\
  \ 不对基础账户收费，但收取少量费用提供高级账户。需要注意的是，在与非 ProtonMail 用户交换邮件时，存在部分或全部邮件未加密的可能性。\n\n\n\n\
  全球组织不再根据地理位置进行人员配置，而是采用“准时制”策略来满足其用人需求。因此，我们看到面对面的互动在减少，因为它被许多弥合通信鸿沟的工具所取代。这些工具包括电子邮件、Skype\
  \ 等。所有这些工具都为社会工程攻击引入了新的攻击向量。当社会工程攻击与零日漏洞结合使用时，它们具有成为致命武器的潜力。这种机制是 APT（即高级持续性威胁）通常使用的手段。\n\
  \n### 什么是社会工程？\n\n我们将社会工程定义为一种通过人际互动完成的、本质上具有恶意性质的广泛活动。这种类型的攻击利用心理操纵，目的是欺骗用户提供敏感信息或做出与安全相关的错误。通常，社会工程攻击分多个步骤进行。\n\
  \n如往常一样，犯罪者最初会对目标受害者进行侦察，以便收集有关其背景的必要信息。这些背景信息可能包括对潜在切入点和弱安全协议的识别。这一步至关重要，因为它决定了攻击将如何进行。随后，攻击者将迅速行动赢得受害者的信任，并为后续违反既定安全规范的行动（如暴露敏感信息或授予关键资源的访问权限）提供诱人的奖励。这些攻击之所以是致命的，是因为它们依赖于人类犯的错误，而不是操作系统或软件的漏洞。人为的错误具有可预测性较低的特点，因此与基于恶意软件的入侵相比，这些错误难以被定位和防范。\n\
  \n### 社会工程使用的攻击技术\n\n这些类型的攻击可以以多种不同的形式存在。只要涉及人际互动，就可以实施社会工程攻击。让我们来看以下五种常见的社会工程攻击：\n\
  \n1. **装设术 (Pretexting)**\n   攻击者将试图通过一系列精心设计的谎言来获取信息。在大多数情况下，装设术是由犯罪者假装他们需要从毫无防备的受害者处获取某些关键信息以完成某项关键任务。攻击者通过冒充警察、银行官员、税务官员、同事或任何具有知情权的权威人士，从建立或赢得受害者的信任开始。随后，装设术者会提出需要用户确认其身份的问题。通过这种方式，攻击者能够收集关键个人数据。\n\
  \n2. **网络钓鱼 (Phishing)**\n   流行的网络钓鱼诈骗以短信和电子邮件活动的形式出现，旨在营造好奇感、强制紧迫感，甚至在潜在受害者心中植入恐惧。受害者随后通过点击指向恶意网站的链接，或下载并打开包含恶意软件的未知附件，被诱导披露被认为敏感的信息。例如，特定在线服务的用户可能会收到一封电子邮件，提醒他们违反了某项政策，需要立即采取行动。此类行动的一个例子是更改密码。点击链接后，用户将被重定向到一个非法网站，该网站在各个方面都与合法网站几乎完全相同，引导毫无防备的用户在网站上输入其凭据。一旦提交表单，这些信息就会发送给攻击者。\n\
  \n3. **诱饵攻击 (Baiting)**\n   这种类型的攻击利用误导性的承诺来利用受害者的好奇心或贪婪（主要是贪婪）。用户被诱入陷阱，导致其个人信息被盗取。此外，恶意软件也可以以此方式发送到他们的系统中。最招厌的诱饵形式是使用物理媒介传播恶意软件。例如，攻击者将诱饵（通常是感染病毒的\
  \ U 盘）留在潜在受害者可能会看到的区域。诱饵故意看起来像是真的。毫无防备的受害者会由于好奇而拿起诱饵。之后，他们可能会将该设备插入工作或家中的计算机。这将导致系统自动安装恶意软件。这种类型的攻击可以在物理世界或在线世界实施。\n\
  \n4. **恐吓软件 (Scareware)**\n   这种攻击策略涉及用虚假警报或虚构威胁轰炸受害者。轻信的用户会被骗认为他们的系统已被恶意软件感染。这将导致他们安装没有任何实际益处的软件，甚至安装恶意软件本身。恐吓软件的一个例子是“您的电脑已被有害程序感染”横幅。此外，恐吓软件还可以通过垃圾邮件发布虚假警告或提供购买无价值且有害服务的机会来传播。\n\
  \n5. **针对性钓鱼 (Spear phishing)**\n   既然我们现在知道什么是网络钓鱼，让我们来看看针对性钓鱼。在这里，攻击者针对特定的企业或个人。在确定目标后，他们将根据职位、联系人和归属于目标的特征等问题，定制信息，以使攻击不那么显眼。这种类型的钓鱼攻击需要攻击者投入大量精力，通常需要很长时间才能成功实施。此类攻击在执行熟练时具有惊人的成功率。它们也更难被检测。\n\
  \n### 社会工程防护\n\n涉及社会工程时，犯罪者会对人类情感（包括恐惧或好奇）进行操纵，以便影响他们的恶意计划，从而诱导受害者进入陷阱。如果我们要把社会工程攻击隔绝，时刻保持警惕至关重要。让我们来看以下帮助我们应对此类类型攻击的提示：\n\
  \n更新您的防病毒软件——在您的设备上开启自动更新。确保您频繁下载防护软件的最新特征，例如每天一次。进行定期检查以确保您下载的更新已应用。不言而喻，您需要扫描系统以发现可能的感染。\n\
  \n采用多因素身份验证——这意味着在系统不幸被破解的情况下，您所有的账户都将受到保护。用户凭据对攻击者来说极具价值，他们很可能会尝试获取。\n\n停止接受可疑报价\
  \ – 在接受听起来好得不可相信的报价之前，请仔细考虑。对该主题进行简单的谷歌搜索有助于判断您是否正被诱入陷阱，或者您手中的是否为合法报价。\n\n不要打开可疑邮件/附件\
  \ – 当您收到来自未知且看起来可疑的发送者的邮件时，不要打开。如果发送者已知，在公司邮件的情况下，您可能需要从他们或其他来源核实。可以使用电话进行核实。或者，您可以选择直接从服务提供商获取详情。正如您现在可能已经学到的，伪造电子邮件地址是可能的。永远不要冒险。\n\
  \n\n\n\nPython 是一种开源且高级的语言，自 20 世纪 80 年代后期以来一直存在。今天，它被用于 Web 应用程序、创建图形用户界面、游戏，最重要的是，还用于入侵缓解和黑客攻击利用。大多数\
  \ Python 命令由典型的英语语句组成，这意味着你能够立即易地理解它们的功能。与 `Java` 等其他高级语言相比，Python 的代码相对更加直观且简短。此外，Python\
  \ 内置了许多库和功能，并可以访问第三方模块和库。Python 是一门黑客所青睐的编程语言，因为它拥有强大的集成库，并且可以获取由其他用户编译好的共享资源。如果你是初次程序员，你会发现\
  \ Python 使用的代码和语法更加直观。如果你感兴趣直接进入黑客领域，你将喜欢发现通过你的程序可以操纵的内容。\n\n## 与 Python 语言交互\n\n\
  如果你想查看整个文件或应用程序是如何被解释的，可以使用脚本模式使用 Python。要与 Python 交互，你可以使用集成开发环境（它会调出 Python shell\
  \ 窗口），或者在 Windows 中使用命令行。\n\n### 使用命令提示符交互\n\nLinux 和 Mac OS X 中的终端（Terminal）或 Windows\
  \ 命令行是开始使用 Python 最简单直接的方法。请注意，这可能不是黑客最偏的交互方式。然而，这种方法将允许你快速探索 Python 的特性。\n\n###\
  \ 使用 IDLE 交互\n\n当你使用像 Python 这样的编程语言时，你需要使用集成开发环境或 IDE 来开发你的代码。IDE 是一个提供开发软件所需所有工具的应用程序。安装包附带的\
  \ IDLE 工具作为一个平台，你可以在其中高效地输入代码并与 Python 交互。你可以通过点击桌面上的图标、开始菜单或在安装文件夹中找到它来轻松地打开 IDLE。IDLE\
  \ 允许你使用以下功能：\n\n- Python shell 窗口：允许你使用颜色标记的代码输入和输出，并在输入错误的语句时获取错误信息。\n- 调试器：带有单步执行、本地和全局命名空间查看以及持久化断点等功能。\n\
  - 浏览器和配置。\n- 文本编辑器：允许你使用多个窗口、Python 颜色高亮、自动补全、撤销等功能。\n\n使用 IDLE 将允许你同时使用两个窗口：Shell（外壳）和\
  \ Editor（编辑器）。\n\n### 你可以使用其他工具\n\n根据你的需求，你可以在 IDLE 之外的其他 IDE 或文本编辑器中编写代码。以下是你可以使用的其他编辑器及其特性：PyCharm\
  \ 教育版、Sublime Text、`VIM` 和 Coda。\n\n## Python 基础\n\n你需要学习 Python 脚本中至关重要的其他概念。你可能希望创建一个未来易于你理解和审查的脚本，以防万一你想改进它并将其转换为黑客攻击的实用工具。让我们看看变量和常数在\
  \ Python 中是如何工作的。\n\n### 注释\n\n这些是紧跟在 `#` 符号后面的语句。这些文本允许你：\n\n1) 解释你旨在在程序中要克服或解决的问题。\n\
  2) 记录你想要在代码中执行的重要假设、细节和决策。\n3) 在代码中做笔记不仅可以提醒你想要在代码中实现什么，还能帮助使用你程序的读者理解这些代码的意图。\n\
  \n### 字面量常量（Literal Constants）\n\n字面量常量之所以这样命名，是因为你取这些文本的字面值。这些常量可以是数字、字符串、变量、对象、列表和字典。\n\
  \n### 编写 Python 程序\n\n现在你已经了解了 Python 中掌握的一些基本概念，是时候学习一些编写 Python 程序时需要记住的指南了。\n\
  \n### 物理行与逻辑行\n\n当你输入程序时看到的内容被称为“物理行”（physical line）。当你输入一个语句时 Python 获取的内容被称为“逻辑行”（logical\
  \ line）。尽管如此，这种编程语言假设你看到的每一物理行都对应于给定的逻辑行。虽然你可以通过分号（`;`）符号在物理行上使用多个逻辑行，但 Python 鼓励像你这样的程序员输入单个语句以提高代码的可读性。\n\
  \n### 缩进\n\nPython 是现有编程语言中每行代码开头的空格至关重要的语言之一。通过缩进，你可以将相关的语句块组合在一起。根据经验法则，请确保在处理相似的语句时使用相同的缩进。此外，记住，使用错误的缩进会导致你的代码容易出错。\n\
  \n### 运算符与表达式\n\n你在代码中编写的大多数语句都会包含表达式。表达式由操作数和运算符组成。运算符本质上是在代码中执行某些操作的函数，由符号或关键字表示。它们通常需要一些可以处理的信息，这些信息被称为操作数。例如，如果你有表达式\
  \ `1 + 3`，加号（`+`）就是运算符，数字 `1` 和 `3` 就是操作数。\n\n## 表达式\n\n表达式是代码中运算符和值的组合。你可以将其认为是任何“表达”了具有某个值的某物的内容。例如，如果你使用函数\
  \ `eval(2 + 2)`，你将得到一个提供这两个数字相加之和的结果。\n\n### 函数\n\n函数允许你创建一个可以执行特定操作的代码块。它们是可重用的，这意味着你可以为该语句块提供名称，然后在构建的程序的任何地方使用你分配的名称来运行该块。在\
  \ Python 术语中，这被称为“调用函数”。函数可能是编程语言中最重要的部分。在 Python 中，它们通常使用 `def` 定义，后面跟着你想要使用的函数标识符名称。\n\
  \n### 函数参数\n\n函数可以接收它们将要使用的值，这些值被称为参数。参数的作用与变量类似，不同在于你每次调用函数时都会定义它们的值，并且在运行函数时已经为它们分配了值。在定义函数时，参数在一对括号内，并用逗号隔开。如果你需要在代码中调用函数，你需要以类似的方式提供值。请记住，当你为函数命名并为其提供值时，这些值被称为参数；但当你调用函数并提供值时，这些值被称为参数（arguments）。\n\
  \n### 关键字参数\n\n在编写代码时，可能会出现函数参数过多的情况，如果你想指定其中某些，可以使用关键字参数为某些参数赋值。这样做将带给你一种高效使用函数的优势，而不必担心参数的顺序，并且你可以为你想要使用的参数分配值，特别是当其他可用参数已经包含了设置好的默认参数值时。\n\
  \n### 返回语句\n\n如果你想跳出函数，或者想从函数返回一个值，那么就可以使用这个语句。\n\n\n\n\n\n### DocStrings\n这是一个你可以用它记录你所创建的代码并使其更容易理解的工具。你还可以在代码运行时从函数中获取文档字符串（docstring）。\n\
  \n### 迭代\n在某些情况下，你可能会发现多次编写相同的代码来执行相似的功能是很麻烦的，例如检查不同的 IP 地址或分析不同的端口。出于这个原因，你可能希望使用\
  \ `for`-循环来代替，以便对不同的元素迭代相同的代码。\n\n### 异常处理\n即使你已经能够编写出语法正确的程序，在执行或运行时你可能仍然遇到一些错误。例如，当你将任何数字除以\
  \ 0 时，你很可能会遇到运行时错误，因为 Python 知道这样做是不可能的。如果你想在运行代码的同时修复错误，Python 的异常处理能力将大派用用场。使用上面的示例，你可以使用\
  \ `try` 或 `except` 语句来利用异常处理，这样当错误发生时，异常处理功能将捕获错误并在屏幕上打印信息。\n\n### 模块\n如果你想将已经在另一个程序中创建的函数用于另一个程序，而不是重写整个代码，那么你可以使用模块。创建模块最简单的方法是创建一个文件，其中包含你在未来程序中可能需要用的所有变量和函数，然后将其保存为\
  \ `.py` 文件。\n\n#### Sys 模块\n`Sys` 模块是一个内置模块，提供了对编程语言解释器维护或使用的所有对象的访问。该模块包括命令行参数、可以使用的整数最大值、标志、路径钩子以及其他可用模块。能够与\
  \ `sys` 模块交互将允许你创建不同的脚本，并将其用于不同的黑客目的。\n\n#### OS 模块\nPython 的 `OS` 模块为不同的操作系统（如\
  \ Mac 和 NT）提供了许多例程。使用该模块，你可以让编程语言能够与文件系统、权限、用户数据库以及不同的操作系统环境进行交互。\n\n## Python 标准库\n\
  Python 库几乎涵盖了该编程语言中存在的几乎每一个元素的集合。这个广泛的集合包含几个内置模块，允许你访问系统中的不同功能。它还负责提供对模块的访问，这些模块旨在增强\
  \ Python 原有的可移植性。\n\n到此时，你已经了解了 Python 的基础知识。当你创建用于黑客的代码或从库中导入模块时，你将能够发现更多功能并学习它们的用途。由于你正在学习如何编写代码来实施黑客攻击，加快学习的最佳方法是在创建你可以用于黑客攻击的工具过程中进行学习。\n\
  \n### 为黑客攻击做好准备\n学习如何黑客意味着能够设置一个你可以工作的环境，以便开发你自己的利用工具。由于你已经安装了 Python 及其带的标准库，你基本上已经为为黑客攻击做好了准备。你现在需要做的只是安装其他工具和库，它们将用于下面详细介绍的漏洞利用。\n\
  \n### 安装第三方库\n第三方库本质上是指不是你的 Python 安装程序自带的库。获取它们唯一需要做的就是从目标源下载它们，对刚下载的包进行解压缩，然后切换到目标目录。正如你可能猜的那样，在利用他人创建的资源开发工具时，第三方库是至关重要的。由于\
  \ Python 是一种高度协作的编程语言，你可以从 `GitHub` 或 Python 官网等网站来源找到库，并将它们整合到你的代码中。\n\n### 密码破解器\
  \ - 你的第一个 Python 程序\n要编写这个密码破解器，你需要一个 `crypt()` 算法，该算法允许你对 UNIX 格式的密码进行哈希处理。当你启动\
  \ Python 解释器时，你会发现此代码所需的 `crypt` 库已经在标准库中了。要计算 UNIX 密码的加密哈希，你所做的就是调用 `crypt.crypt()`\
  \ 函数，并将 `password` 和 `salt` 设置为参数。代码将返回一个包含哈希密码的字符串。\n\n### 网络黑客攻击\n网络攻击是任何允许黑客破坏网络安全的战术。当你执行网络攻击时，你可以利用用户的账户及其附带的权限、窃取或修改存储的数据、运行代码损坏系统或数据，或者防止授权用户访问服务。\n\
  \n### 侦察\n对系统进行黑客攻击始于在启动任何网络攻击之前发现网络中的战略性漏洞。你可以将其认为是黑客对其目标进行的研究。任何人都可以成为黑客的目标，这意味着学习黑客如何进行侦察也意味着能够保护你自己的系统。每当你连接到互联网并在网络上发送数据时，你都留下了黑客可以追溯到你身上的足迹。当这种情况发生时，黑客可能想要研究你在网络上的活动，并发现你系统中的漏洞，这将使他们渗透并盗取对他们有价值的数据。\n\
  \n在这里，你将学习如何构建简单的脚本，允许你扫描目标脆弱的 `TCP` 端口。为了与这些开放端口交互，你还需要创建 `TCP` socket。Python 是允许你访问\
  \ BSD socket 接口的现代编程语言之一。通过执行一系列 `socket` API 工具，你将能够在目标的 `TCP/IP` 套接字上进行连接、监听、创建、绑定或发送流量。如果你能知道你想要针对的服务相关的\
  \ IP 地址和 `TCP` 端口，那么你就可以更好地规划攻击。\n\n### 制作你的端口扫描器\n端口扫描是一种方法，通过它可以评估目标计算机的哪些端口是开放的，以及特定端口上运行着什么种的服务。由于计算机正在与其他设备通信并通过打开端口发送和接收数据来执行功能，开放端口可能是黑客想要利用的漏洞。将开放端口比作入室者打开的窗户——这些开放端口为任何想要盗取数据或在计算机内部建立据点以长期利用其弱点的黑客提供了免费通道。理解端口扫描并不是非法活动。网络安全人员扫描客户端计算机的端口以了解其漏洞并应用所需的安全协议。\n\
  \n\n\n\n然而，端口扫描也是任何黑客发现新受害者并寻找入侵其系统最佳方法的方法。同时，重复的端口扫描还可能导致拒绝服务，这意味着合法用户可能因为端口耗尽资源而无法使用特定的网络服务。端口扫描器允许你查看主机以及连接到主上的服务。正如你可能知道的，任何涉及网络通信背后都是\
  \ socket。当你打开网络浏览器时，你的计算机会打开一个 socket 与网络服务器通信。当你在线与其他计算机通信或通过 Wi-Fi 向打印机发送请求时，情况也是如此。\n\
  \n## 使用 Mechanize 库进行匿名侦察\n\n大多数计算机用户使用网络浏览器浏览网站并查看互联网内容。每个网站都有不同的功能，但通常会读取特定的文本文档，对其分析，然后将其显示给用户，就像源文件与\
  \ Python 解释器交互一样。使用 Python，你可以通过获取和解析网站的 HTML 源代码来浏览互联网。这种语言带有许多可以处理 Web 内容的库，但对于这次攻击，你将使用\
  \ Mechanize，它包含一个名为 `Browser` 的主类。\n\n## 在浏览时确保匿名性\n\n现在你已经知道如何获取网页，你将想要创建一个脚本，允许你匿名从网站检索信息。正如你可能知道的，网络服务器会确保记录查看其网站的不同用户的\
  \ IP 地址以识别他们。这通常可以通过通过使用虚拟专用网络（VPN）或使用 Tor 来防止。当你使用 VPN 时发生的情况是所有流量会自动路由到私有网络。有了这个概念，你就会明白可以使用\
  \ Python 连接到代理服务器，这将为你的程序增加额外的匿名层。\n\n## 无线攻击：Dnspwn 攻击\n\n这种攻击是通过使用 `airpwn` 工具创建的，它是一个用于无线\
  \ 802.11 的数据包注入框架。该工具设计用于监听传入的数据包，当传入数据匹配配置文件中指定的模式时，向接入点注入内容。对于你的目标来说，你的 `airpwn`\
  \ 看起来和行为就像他正试图通信的服务器。该工具最初是为了针对 HTTP 创建的，但它也可以用于利用 DNS。本质上，使用 `dnspwn` 攻击意味着诱导你的目标访问恶意网页，该网页通过下载向目标安装恶意软件，或伪造特定网站以窃取你的目标的凭据。\n\
  \n## 最后的说明\n\n要超越“脚本小子”的阶段，黑客必须精通一种脚本语言，而 Python 因其通用性和相对较小的学习曲线通常是正确的首选。大多数攻击工具都是用\
  \ Python 编写的，包括 `sqlmap`、`scapy` 等许多其他。在这里，你学习了一些 Python 基础知识，可以使用它们来构建一些有用但简单的黑客工具，包括横幅抓取器（banner\
  \ grabber）和 FTP 密码破解器。\n\n# 结论\n\n让我借此机会感谢你一路坚持《使用 Kali Linux 黑客》。希望它对你有所益，通过它你已经积累了必要的知识，让你能够开始黑客职业，或者如果你已经是黑客，则提高你的技能。我真心地希望你从第一个主题\
  \ Kali Linux 简介开始，经过漏洞评估、无线网络攻击、渗透测试、网络安全、文本处理、加密破解、高级社交工程，到黑客 Python 脚本基础的整个过程中感到愉快。我也希望通过学习这本书，你已经学习了成为黑客专家所需的许多实用概念。\n\
  \n到目前，你应该能够获取关于可以在你的系统中发起的各种攻击类型的大量理论知识、发起攻击的原因以及你如何保护你的基础设施免受此类攻击。这些是你成为专业黑客的第一步。本书涵盖了无线网络攻击、网络攻击和渗透测试等主题问题。因此，这意味着你现在处于良好的位置，可以识别现实世界中发生的网络攻击机制并建议适当的补救措施。\n\
  \n我还为你提供了多种可以实施的安全措施，以确保你的网络安全并受保护。格式使得这种语言是易于理解的，让你能够理解保护网络的重要性。未来，下一步是把从从书中学到的概念付诸实践。俗话说熟能生巧，正因为通过练习，人们才能成为黑客领域的专家，尤其是在使用\
  \ Kali Linux 的情况下。让你从书中学到的知识为你工作效力吧。\n\n最后，如果你发现此书在任何方面对你有帮助，我们将不胜感激你在 Amazon 上的评价！\n"
