  \ `if` 和 `else` 单词。研究并尝试。\n\n## 重复代码块（Repeating A Code Block）\n\n回到上一节的示例，现在同一位银行客户想知道如果他投资一个金额，一年后将赚多少。投资每月支付投资金额的\
  \ 1%。\n\n\n\n\n\n例如，如果客户在 12 个月后投资了 1000 美元，金额将约为 1126.82 美元：第一个月， `$ 1000 + $ 1000\
  \ 1% = $ 1010`；第二个月， `$ 1010 + $ 1010 1% = $ 1020.10`；以此此类推。也就是说，为了计算年底有多少钱，我们可以将投资金额乘以\
  \ 12 次的 1%。\n\n为了解决这个问题，我们需要一种控制结构，它可以重复执行给定的代码块直到满足某个条件。这种结构被称为循环（loop）。\n\n在 C#\
  \ 中，我们初初将使用 `for` 语句。`for` 是一个包含三个部分的指令：\n\n- 第一部分是初始化，我们可以在这里声明并初始化一个变量，该变量将在第二部分作为循环条件。只要循环条件为真，循环就会继续执行；\n\
  - 第三部分是更新，我们可以在这里更新 `for` 使用的变量。\n\n`for` 的每个部分之间用一个 `;` 隔开。\n\n```csharp\nfor (initialization;\
  \ condition; update)\n{\n// 只要条件为真，此代码就会执行\n}\n```\n\n以以下代码为例，我们使用一个 `for` 来重复计算\
  \ 12 次：\n\n```csharp\ndouble valueInvested = 1000.0;\n\nfor ( int i = 1; i <= 12;\
  \ i += 1)\n{\n    AmountInvested = AmountInvested * 1.01;\n}\n\nMessageBox.Show\
  \ (\"Amount invested now is\" + AmountInvested);\n```\n\n看，我们的 `for` 通过将变量 `i` 初始化为\
  \ 1 开始，只要 `i` 的值小于或等于 12，就会重复其内部的代码，也就是说它只在 `i` 大于 12 时才会停止。注意，在循环的每次迭代中，`i` 的值都会增加（`i\
  \ += 1`）。最后，`for` 内部的代码将按照我们的需要重复 12 次。\n\n可以使用 `while` 代替 `for` 来编写相同的程序：\n\n```csharp\n\
  double valueInvested = 1000.0;\n\nint i = 1;\n\nwhile (i <= 12)\n{\n    AmountInvested\
  \ = AmountInvested * 1.01;\n    i += 1;\n}\n\nMessageBox.Show (\"Amount invested\
  \ now is\" + AmountInvested);\n```\n\n## 更多关于 While\n\n在 C# 中，使用 `while` 时，循环条件会在每次循环开始前进行检查，但如果我们想确保循环体至少执行一次呢？在这种情况下，我们可以使用另一种类型的\
  \ C# 循环，`do while`：\n\n```csharp\ndo\n{\n    // 循环体\n}\nwhile (condition);\n```\n\
  \n使用 `do while`，循环条件只在循环结束时检查，即先执行循环体，然后检查条件，因此循环体至少会被执行一次。\n\n## 更多关于递和递减\n\n当我们想要将整数变量的值增加一个单位时，我们有\
  \ 2 种选择：\n\n```csharp\nint value = 1;\nvalue = value + 1;\n// 或者 value += 1;\n```\n\
  \n然而，由于增加变量值是一项常见的编程活动，C# 给了我们 `++` 运算符来完成这项工作：\n\n```csharp\nint value = 1;\n++\
  \ value;\n```\n\n我们还有运算符 `-`，它用于执行变量的递减。\n\n## 练习\n\n1. 下面代码显示的数值是多少：\n\n```csharp\n\
