  \n## 封装与访问修饰符 (ENCAPSSULATION AND ACCESS MODIFIERS)\n\n此时，我们的 `Account` 类拥有 `number`（账号）、`balance`（余额）和一个持有的\
  \ `customer`（客户），以及允许提取和存款的行为：\n\n```csharp\nclass Account\n{\npublic int number;\n\
  public double balance;\npublic Owner;\npublic void Bag ( double value) {\nthis .saldo\
  \ - = value;\n}\npublic void Deposits ( double value) {\nthis .saldo + = value;\n\
  }\n}\n```\n\n如果我们想对任何 `Account` 进行提取或存款，我们将：\n\n```csharp\naccount.Saca (100.0);\n\
  deposit account (250.0);\n```\n\n但如果团队成员执行了以下操作：\n\n```csharp\naccount.saldo = 100.0;\n\
  ```\n\n没有任何机制阻止我们直接访问属性。在我们的软件的三个不同部分都有这样的代码：\n\n```csharp\n// 在一个文件中 account.saldo\
  \ - = 100.0;    \n// 在另一个文件中 account.saldo - = 250.0;  \n// 在另一个文件中 account.saldo\
  \ - = 371.0;  \n```\n\n现在想象一下银行更改了提取规则：现在每次提取银行都将收取 0.10 分的手续费。也就是说，如果用户提取 10.0\
  \ 雷亚尔，则需要从其账户中扣除 10.10 雷亚尔。我们必须更改应用程序中所有访问该属性的地方！但如果我们更改访问该属性的所有点，这会变得非常困难！如果该属性被分布在\
  \ 300 处，我们需要找到所有地方。这非常复杂且成本高昂。\n\n## 封装 (ENCAPSSULATION)\n\n在面向对象编程中，隐藏类的实现细节被称为**封装**。因为类的实现细节被隐藏了，所有访问必须通过方法进行。我们不让别人知道类*如何*工作，只展示它*做了什么*。\n\
  \n查看 `Saca (100)`。我们知道这个方法做了什么，但关于它是如何实现的，我们并不知道。\n\n但我们还没有解决防止直接使用属性的问题。任何人仍然可以执行以下代码：\n\
  \n```csharp\naccount.saldo = 371.0;\n```\n\n为了解决这个问题，我们需要隐藏属性。我们希望它是私有的，以便只有 `Account`\
  \ 类本身可以使用它。在这种情况下，我们将其标记为 `private`：\n\n```csharp\nclass Account\n{\n// 这里是属性\n\
  private double balance;\npublic void Bag ( double value) {\nthis .saldo - = value;\n\
  }\npublic void Deposits ( double value) {\nthis .saldo + = value;\n}\n}\n```\n\n\
  私有属性和方法仅由类本身访问。也就是说，`Saca()` 方法等可以对其进行更改。但其他类无法直接访问它！编译器不允许这样做！\n\n类的属性是实现细节，因此我们将所有账户属性标记为\
  \ `private`：\n\n```csharp\nclass Account\n{\nprivate int number;\nprivate double\
  \ balance;\nprivate Customer holder;\npublic void Bag ( double value) {\nthis .saldo\
  \ - = value;\n}\npublic void Deposits ( double value) {\nthis .saldo + = value;\n\
  }\n}\n```\n\n太棒了。现在程序员被迫通过方法来操作 `balance`。如果我们尝试（例如从表单代码中输入 `Account` 余额），将会得到编译错误：\n\
  \n```csharp\nAccount c = new Account ();\n// 下面行产生编译错误 c.saldo = 100.0;\n```\n\n\
  但现在我们又遇到了另一个问题。如果我们想显示余额，我们将无法做到。`private` 同时阻止了写入和读取！\n\n## 控制属性的访问 (Controlling\
  \ Access To Properties)\n\n我们看到可以使用 C# 的 `private` 来阻止外部属性的访问，但 `private` 也阻止了属性的读取，因此为了获取其值，我们需要在类内部创建一个新方法来返回属性的当前值：\n\
  \n```csharp\nclass Account\n{\n```\n\n\n\n\n```csharp\nprivate double balance;\n\
  \nprivate int number;\n\n// 其他账户属性和方法\n\npublic double PegaSaldo ()\n\n{\nreturn\
  \ this .saldo;\n}\n\n}\n```\n\n现在为了向用户显示余额，我们将使用以下代码：\n\n```csharp\nAccount Account\
  \ = new Account ();\n// 初始化账户\nMessageBox.Show ( \"balance:\" + account. HandleSaldo\
  \ ());\n```\n\n此外，账户需要一个数字，但由于它被声明为私有（private），我们无法直接访问它。我们需要一个新的方法来完成这项工作：\n\n\
  ```csharp\nclass Account\n{\n    private int number;\n\n    // 账户的其他属性和方法 public\
  \ void PutsNumber ( int number)\n    {\n        this .number = number;\n    }\n\
  }\n```\n\n若要给账户设置数字，我们需要执行这段代码：\n\n```csharp\nAccount Account = new Account ();\n\
  account.Place Number (1100);\n// 在代码中使用账户\n```\n\n注意，这允许我们控制对 `Account` 类的所有访问，但若要写入或读取属性的值，我们需要使用方法。理想情况下，我们应该使用类似于属性访问的语法，但带有方法提供的控制力。为了解决这个问题，C#\
  \ 为我们提供了属性（properties）。\n\n属性的声明与属性的声明相似，但我们需要讨论在读取（`get`）和写入（`set`）属性时应该执行的操作\n\
  \n```csharp\nclass Account\n{\n    private int number;\n    public int Number\n\
  \    {\n        get\n        {\n            // 读取属性的代码\n        }\n        set\n\
  \        {\n            // 写入属性的代码\n        }\n    }\n}\n```\n\n在读取属性时，我们想要返回 `Account`\
  \ `number` 属性的值：\n\n```csharp\nclass Account\n{\n    private int number;\n    public\
  \ int Number\n    {\n        get\n        {\n            return this .number;\n\
  \        }\n    }\n}\n```\n\n通过这种，我们可以用以下代码读取 `Number` 属性：\n\n```csharp\nAccount\
  \ c = new Account ();\nMessageBox.Show ( \"number:\" + c.Number);\n```\n\n注意，访问方式等同于属性访问，但当我们尝试读取属性的值时，实际上是在执行\
  \ `Account` 类的一个代码块（`get` 属性）。要设置账户数字，我们将使用以下代码：\n\n```csharp\nAccount c = new Account\
  \ ();\nc.Number = 1;\n```\n\n当我们尝试向属性写入值时，C# 使用 `set` 块来存储其值。在 `set` 块内部，赋值给属性的值存储在一个名为\
  \ `value` 的变量中，因此我们可以这样实现 `set`：\n\n```csharp\nclass Account\n{\n    private int\
  \ number;\n    public int Number\n    {\n        // get 语句\n        set\n      \
  \  {\n            this .number = value ;\n        }\n    }\n}\n```\n\n我们还可以声明一个只有\
  \ `get` 而没有 `set` 的属性。在这种情况下，我们声明了一个可读但不可写的属性。通过属性，我们可以使用属性访问语法来完全控制对类属性的访问。\n\n\
  ## 使用自实现属性简化属性语句\n\n使用属性，我们可以控制对类信息的访问，但正如我们看到的，声明属性是非常麻烦的。我们需要一个属性来存储其值，并且需要声明\
  \ `get` 和 `set`。\n\n为了让声明属性变得更容易，从 C# 3.0 开始，我们有了由编译器自动实现的属性，即自动实现属性（auto-implemented\
  \ properties）。要声明一个自动实现属性来暴露账户数字，我们使用以下代码：\n\n```csharp\nclass Account\n{\n    public\
  \ int Number { get ; set ; }\n}\n```\n\n这段代码导致编译器声明一个 `int` 类型的属性（其名称仅对编译器已知），并生成\
  \ `Number` 属性的代码，其中包含 `get` 和 `set`，用于读取和写入所声明的属性。注意，通过使用自动实现属性，我们只能通过属性访问所声明属性的值。\n\
  \n每当我们声明一个自动实现属性时，我们总是需要为属性声明一个 `get` 和 `set`，但我们可以控制 `get` 和 `set` 的可见性。\n\n例如，在\
  \ `balance` 的情况下，我们希望允许任何人读取账户余额，但只有账户本身可以更改它。在这种情况下，我们使用以下代码：\n\n```csharp\nclass\
  \ Account\n{\n    // 其他属性\n    // get 是公共的，可以被任何类访问\n    // set 是私有的，因此只能由账户使用\n\
  \    public double Balance { get ; private set ; }\n    // 类的其余代码\n}\n```\n\n现在让我们看看在类声明的属性中尝试读取和写入的代码：\n\
  \n```csharp\nAccount c = new Account ();\nc.Number = 1; // 正常，因为 number set 是公共的\n\
  MessageBox.Show ( \"number:\" + c.Number); // 正常，因为 Number get 是公共的\nc.Saldo = 100.0;\
  \ // Balance set 是私有的，所以报错\nMessageBox.Show ( \"balance\" + c.Saldo); // 正常，因为 Balance\
  \ get 是公共的。\n\n注意，无论是显式声明属性还是使用自动实现属性，我们对类将暴露哪些信息都有完全的控制。\n\n因此，每当我们想要暴露某些类信息时都应该使用属性。我们永远不应该暴露类属性（使用\
  \ `public`），因为我们不想暴露类的实现细节。\n\n## 属性命名规范\n\nC# 属性定义的命名规范与类的命名规范相同，即使用帕斯卡命名法（Pascal\
  \ Casing），单词拼接在一起且每个单词的首字母大写，例如：`bank number` => `BankNumber`\n\n## 练习\n\n1\\. 以下属性的行为是：\n\
  `public int Number { get ; private set ; }`\n\n- 数字可以被读取，但不能被其他类修改。\n- 数字不可读，但可以被其他类修改。\n\
  - 数字既不可读也无法被其他类修改。\n- 数字可以被其他类读取和修改。\n\n2\\. 关于以下代码，正确的说法是：\n```csharp\nAccount\
  \ c = new Account ();\ndouble valueDispose = 200.0;\nc.Saldo += valueDispose;\n\
  ```\n- 存款操作实现正确。\n- 存款操作没有封装，可能会产生未来的问题。\n\n3.什么是封装？\n- 让所有人都能看到类是如何工作的。\n- 是使用任何形式的属性。\n\
  - 是直接操作和修改属性，而不通过特定方法。\n- 是隐藏类/方法是如何完成任务的。如果规则发生，我们只需要修改代码中的一点。\n\n4\\. 以下属性的问题是：\n\
  `public double Balance { get ; set ; }`\n\n- 没有问题。它是封装的，毕竟我们使用了属性。\n- 与 `public`\
  \ ，我们应该使用 `private`。\n- `Balance` 属性可以被其他类操作。这违反了封装规则。创建属性并允许所有属性被其他类修改是毫无意义的。\n\
  \n5.将 `Account` 类的属性转换为属性。允许读取账户余额但在类外部不可修改，同时修改使用该类的代码，以属性访问代替属性。\n\n\n\n\n派生类可以隐藏或重载继承的项目。被覆盖的元素在派生类中继续存在，并可以使用关键字\
  \ `base` 进行调用。\n\n在 `C#` 中，所有类自动继承 `System.Object` 类的元素。这为所有 C# 对象提供了共同的基本功能（支持复制、比较和转换为字符串）。\n\
  \n类可以实现任意数量的接口，只要它们通过适当的语句部分提供了从接口继承的方法。\n\n最后，如果你觉得这本书在任何方面对你有帮助，我们将非常感谢你在 Amazon\
  \ 上的评价！\n\n# 使用 KALI LINUX 进行黑客攻击\n\n学习 Kali Linux 以理解无线网络与渗透测试的终极新手指南。\n\n包括如何开始脚本编写和安全防护。\n\
