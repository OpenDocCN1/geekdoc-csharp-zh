    \ 8: Inheritance & Polymorphism\n\nIn the last two chapters, we covered basic\
    \ object oriented concepts (OOP). In this chapter, we are going to study two advanced\
    \ OOPs: Inheritance and Polymorphism. Like all the other OOP concepts, inheritance\
    \ in OOP is similar to the concept of real world inheritance. A child inherits\
    \ some of the traits of his/her parents while also having some traits specific\
    \ to him/her. In object oriented programming, the concept is similar. Inheritance\
    \ also exists between different classes and is marked by an Is-A relationship.\
    \ For instance, a “laptop” is a product, a “car” is a vehicle, and an “employee”\
    \ is a person. Here, “laptop” is a child class of `product`, “car” is child of\
    \ `vehicle`, and “employee” is a child class of `person`. The concept of polymorphism\
    \ is based on inheritance; we will study that in a later section.\n\n## Contents\n\
    - Inheritance\n- Polymorphism\n\n## 1- Inheritance\n\nThe idea of inheritance\
    \ is that all the traits that are common between the child classes are implemented\
    \ in the parent class, while traits that are specific to individual child classes\
    \ are implemented in the respective child classes. For instance, take a parent\
    \ `product` class and its child software and hardware product. Both software and\
    \ hardware products have a `name` and `price`. Therefore, we can include both\
    \ `name` and `price` properties in the parent `product` class. Classes that inherit\
    \ the parent class have all the attributes of the parent class by default. However,\
    \ software has no weight while hardware product has some weight. This means that\
    \ the attribute `weight` is unique to hardware class; therefore, it cannot be\
    \ implemented in the parent class. Similarly, we assume that software has a version\
    \ number while hardware has no version number. Here, `version` is unique to the\
    \ software class and cannot be implemented in the parent class. This scenario\
    \ has been implemented in Example1.\n\n### Example1:\n\nAdd three classes (`Product`,\
    \ `Hardware`, and `Software`) to your project. The code markup of these three\
