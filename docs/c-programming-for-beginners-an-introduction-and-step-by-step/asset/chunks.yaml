    public static int Subtract (int num1, int num2)\n{\n    return num1 - num2;\n\
    }}\n```\n\n# 第 10 章：多线程\n\n到此为止，我们一直在处理单线程应用程序，程序遵循单一的执行路径，并且在特定时刻只执行一段代码。这种方法适用于简单的控制台应用程序。然而，在高级\
    \ GUI 应用程序中，单线程执行会导致无响应和执行延迟。考虑一个 Windows 表单应用程序，在显示在表单上之前必须获取数据。在应用程序获取数据期间，用户在表单的前端无法进行任何操作。如果数据库很大，获取数据将花费更多时间，导致应用程序的前端表现出无响应状态。多线程是解决此类问题的方案。在本章中，我们将学习如何创建线程以及它们如何协同工作以实现异步程序执行。\n\
    \n## 目录\n\n* 什么是线程？\n* C# 中的线程创建\n* 线程连接 (Join) 与睡眠 (Sleep)\n\n## 1- 什么是线程？\n\n\
    线程是执行的最小单元。线程运行在进程内部。进程保留了操作系统资源以及一个独占的执行环境。一个进程可以拥有一个或多个线程。在单线程应用程序中，只有一个线程在进程内运行，对所有进程资源和执行环境具有独占访问权限。在多线程应用程序中，多个线程在进程内运行，它们共享多个进程资源，特别是内存和执行环境。资源的共享解决了引入中解释的无响应问题。在多线程应用程序中，一个线程可以从数据库获取数据并存储在共享内存中，而第二个线程可以同时在应用程序的前端显示获取的数据。\n\
    \n## 2- C# 中的线程创建\n\n在 C# 中创建线程是一个极其简单的过程。你只需要创建一个 `Thread` 类对象。在 `Thread` 类的构造函数中，传递你想要在单独线程中运行的方法委托。接下来，简单地对你创建的对象调用\
    \ `Start` 方法即可。本章的第一个示例详细演示了线程创建和执行过程。请看它。\n\n### 示例 1：\n\n```csharp\nusing System;\n\
    using System.Threading;\nnamespace MyCSharpApplication\n{\nclass Program\n{\n\
    \    static void Main(string[] args)\n    {\n        Thread t1 = new Thread(DisplayTwo);\n\
    \        Thread t2 = new Thread(DisplayThree);\n        t1.Start();\n        t2.Start();\n\
    \        for (int i = 0; i< 100; i++)\n        {\n            Console.Write(\"\
    1\");\n        }\n        Console.Read();\n    }\n    static void DisplayTwo()\n\
    \    {\n        for (int i = 0; i< 100; i++)\n        {\n            Console.Write(\"\
    2\");\n        }\n    }\n    static void DisplayThree()\n    {\n        for (int\
    \ i = 0; i< 100; i++)\n        {\n            Console.Write(\"3\");\n        }\n\
    \    }\n}\n}\n```\n\n要在程序中执行与线程相关的任务，你需要在代码中导入 `System` 和 `System.Threading` 命名空间。C#\
    \ 运行时默认为每个程序创建一个线程。这就是运行 `Main` 方法的线程。在示例 2 中，在 `Main` 方法内部，我们创建了两个 `Thread` 类对象。这些对象被命名为\
    \ `t1` 和 `t2`。在第一个对象 `t1` 的构造函数中，我们传递了 `DisplayTwo` 方法委托。该方法在控制台上显示 100 次数字“2”。该方法在\
    \ `Main` 方法之后立即定义。同样，在 `t2` 对象的构造函数中，调用了 `DisplayThree` 方法。该方法在屏幕上显示 100 次数字“3”。在\
    \ `Main` 方法内部初始化 `t1` 和 `t2` 后，对这些对象调用了 `Start` 方法。在线程对象上调用 `Start` 会创建一个新的执行路径，该路径与已执行的线程并行运行。在此时刻，有三个线程正在同时运行：主线程（正在运行\
    \ `Main` 方法）以及 `t1` 和 `t2` 线程（正在运行 `DisplayTwo` 和 `DisplayThree` 方法）。这意味着现在我们有三个执行路径正在同时执行。这三条路径同时尝试在屏幕上打印数字“1”、“2”和“3”，每个\
    \ 100 次。示例 1 代码的输出如下：\n\n#### 输出 1\n321231231313132133332212312133223122332213223121121212131313111112122333312312313232321223212123322311233213312312233123112222222222222222222222222222222222222222222222222222。\n\
    \n## 3- 线程连接 (Join) 与睡眠 (Sleep)\n\n在前节中，我们学习了多个线程如何同时执行。如果你想让一个线程在继续之前完成执行怎么办？要等待一个对象完成执行，调用该对象的\
    \ `Join` 方法。同样，如果你想让线程停止一段时间，可以在线程类上调用 `Sleep` 方法。该方法接受毫秒或 `TimeSpan` 对象作为参数。\n\
    \n为了直观看到这一概念，请看第二个示例。\n\n 示例 2：\n\n```csharp\nusing System;\nusing System.Threading;\n\
    namespace MyApplication\n{\nclass Program\n{\n    static void Main(string[] args)\n\
    \    {\n        Thread t1 = new Thread(DisplayTwo);\n        t1.Start();\n   \
    \     t1.Join();\n        Console.WriteLine(\"=========================\");\n\
    \        for (int i = 0; i< 100; i++)\n        {\n            Console.Write(\"\
    1\");\n            if (i+1 == 50)\n            {\n                Console.WriteLine(\"\
    \\nThread Sleeps for 5 seconds...\");\n                Thread.Sleep(5000);\n \
    \           }\n        }\n        Console.Read();\n    }\n    static void DisplayTwo()\n\
    \    {\n        for (int i = 0; i< 100; i++)\n        {\n            Console.Write(\"\
    2\");\n        }\n    }\n}\n}\n```\n\n#### 输出 2\n2222222222222222222222222222222222222222222222222222222222222222222222222222222222222222222222222222\n\
    =========================\n11111111111111111111111111111111111111111111111111\n\
    Thread Sleeps for 5 seconds...\n11111111111111111111111111111111111111111111111111\n\
    \n在屏幕上，你会看到这些数字是按顺序排列的，尽管我们先调用了 `DisplayTwo` 方法。这是因为屏幕一次只能被一个线程访问。\n\n"
- fmt: "\n### Create two threads inside the “Main” method\nOne thread should call\
    \ a method which displays “+” on console one hundred times. The other method should\
    \ display “X” on the screen one hundred times. The “Main” method should wait for\
    \ the completion of both of these threads, and then it should display “#” on the\
    \ screen 20 times. It should then wait for 3 seconds before displaying “#” again,\
    \ this time 60 times. Finally, it should wait for 3 more seconds before displaying\
    \ “#” 20 more times.\n\n### Solution\n\n```csharp\nusing System;\nusing System.Threading;\n\
    \nnamespace MyCSharpApplication\n{\n    class Program\n    {\n        static void\
    \ Main(string[] args)\n        {\n            Thread t1 = new Thread(DisplayPlus);\n\
    \            Thread t2 = new Thread(DisplayMultiply);\n\n            t1.Start();\n\
    \            t2.Start();\n\n            t1.Join();\n            t2.Join();\n\n\
    \            Console.WriteLine(\"\\n==========================================\"\
    );\n            for (int i = 0; i < 100; i++)\n            {\n               \
    \ Console.Write(\"+\");\n                if (i + 1 == 20)\n                {\n\
    \                    Console.WriteLine(\"\\nThread Sleeps here for 3 seconds...\"\
    );\n                    Thread.Sleep(3000);\n                }\n             \
    \   if (i + 1 == 80)\n                {\n                    Console.WriteLine(\"\
    \\nThread Sleeps here for 3 seconds...\");\n                    Thread.Sleep(3000);\n\
    \                }\n            }\n            Console.Read();\n        }\n\n\
    \        static void DisplayPlus()\n        {\n            for (int i = 0; i <\
    \ 100; i++)\n            {\n                Console.Write(\"+\");\n          \
    \  }\n        }\n\n        static void DisplayMultiply()\n        {\n        \
    \    for (int i = 0; i < 100; i++)\n            {\n                Console.Write(\"\
    X\");\n            }\n        }\n    }\n}\n```\n\n# Other Books by the Author\n\
    \n#### Java Programming\n[http://www.linuxtrainingacademy.com/java-programming]\n\
    \nJava is one of the most widely used and powerful computer programming languages\
    \ in existence today. Once you learn how to program in Java you can create software\
    \ applications that run on servers, desktop computers, tablets, phones, Blu-ray\
    \ players, and more.\n\nAlso, if you want to ensure your software behaves the\
    \ same regardless of which operation system it runs on, then Java's \"write once,\
    \ run anywhere\" philosophy is for you. Java was design to be platform independent\
    \ allowing you to create applications that run on a variety of operating systems\
    \ including Windows, Mac, Solaris, and Linux.\n\n#### JavaScript: A Guide to Learning\
    \ the JavaScript Programming Language\n[http://www.linuxtrainingacademy.com/javascript]\n\
    \nJavaScript is a dynamic computer programming language that is commonly used\
    \ in web browsers to control the behavior of web pages and interact with users.\
    \ It allows for asynchronous communication and can update parts of a web page\
    \ or even replace the entire content of a web page. You’ll see JavaScript being\
    \ used to display date and time information, perform animations on a web site,\
    \ validate form input, suggest results as a user types into a search box, and\
    \ more.\n\n#### PHP\n[http://www.linuxtrainingacademy.com/php-book]\n\nPHP is\
    \ one of the most widely used open source, server side programming languages.\
    \ If you are interested in getting started with programming and want to get some\
    \ basic knowledge of the language, then this book is for you! Popular websites\
    \ such as Facebook and Yahoo are powered by PHP. It is, in a sense, the language\
    \ of the web.\n\nThe book covers core PHP concepts, starting from the basics and\
    \ moving into advanced object oriented PHP. It explains and demonstrates everything\
    \ along the way. You'll be sure to be programming in PHP in no time.\n\n#### Scrum\
    \ Essentials: Agile Software Development and Agile Project Management for Project\
    \ Managers, Scrum Masters, Product Owners, and Stakeholders\n[http://www.linuxtrainingacademy.com/scrum-book]\n\
    \nYou have a limited amount of time to create software, especially when you’re\
