    this.price = price;


    this.category = category;


            }


    public void IncreasePrice()


            {


    price += 10;


            }


        }


    }


    The produce class contains three member variables: name, price, and category.
    The class contains a constructor which initializes these three variables. After
    the constructor, we have added a method named “IncreasePrice”. The syntax of a
    method is simple; it starts with an access modifier, which is public in this case.
    After that, the return type of the method is mentioned. A return type is the type
    of the value returned by the method. Since our “IncreasePrice” method doesn’t
    return any value, we specified its return type as void. After the return type,
    the name of the method is written (in our case, this is “IncreasePrice”). The
    opening and closing round brackets contain parameters. Since we don’t want our
    “IncreasePrice” method to accept any parameter, we left the brackets empty. Notice
    that the method declaration is quite similar to the constructor declaration. A
    constructor is, in fact, a method with no return type. A method is called using
    the object of the class by the appending dot operator followed by the method name
    after the object of the class. Modify the “Program” class so that it looks like
    the one in following code snippet.


    Program.cs


    using System;


    namespaceMyCSharpApplication


    {


    class Program


        {


    static void Main(string[] args)


            {


                Product p = new Product("Grapes", 40, "Food");


