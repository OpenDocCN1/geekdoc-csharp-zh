    \ and then stored references of the objects of the `Product`, `Software`, and\
    \ `Hardware` classes in it. Then we called the `DisplayProduct` method sequentially.\
    \ You will see that, in the output, different `DisplayProduct` methods will be\
    \ called depending on the references stored in the `Product` class object.\n\n\
    Program.cs\n\n```csharp\nusing System;\n\nnamespace MyCSharpApplication\n{\n \
    \   class Program\n    {\n        static void Main(string[] args)\n        {\n\
    \            Product p = new Product();\n            p.name = \"Apple\";\n   \
    \         p.price = 10;\n            p.DisplayProduct();\n\n            p = new\
    \ Software(\"windows 7\", 150, 3);\n            p.DisplayProduct();\n\n      \
    \      p = new Hardware(\"Laptop\", 500, 2);\n            p.DisplayProduct();\n\
    \            Console.Read();\n        }\n    }\n}\n```\n\nOutput2:\n```text\n\
    This is a parent class: Apple\nYou bought windows 7, version 3\nYou bought Laptop,\
    \ weight 2\n```\n\n# Exercise 8\n\n### Task\nCreate a class named `Shape`. Add\
    \ one member variable, `name`, to this class. Add a method called `DisplayName`\
    \ which displays the variable name on console screen with the appropriate statement.\
    \ Create two classes, `Triangle` and `Pentagon`. Create parameterized constructors\
    \ which initialize variable names in both the `Triangle` and `Pentagon` classes.\
    \ These classes will implement their own `DisplayName` method. Using a test class,\
    \ such as `Program.cs`, show how polymorphism can be achieved in this scenario.\n\
    \n### Solution\n\n#### Shape Class\n```csharp\nusing System;\n\nnamespace MyCSharpApplication\n\
    {\n    class Shape\n    {\n        public string name;\n        public virtual\
    \ void DisplayName()\n        {\n            Console.WriteLine(\"This is a parent\
    \ class named: \" + name);\n        }\n    }\n}\n```\n\n#### Triangle Class\n\
    ```csharp\nusing System;\n\nnamespace MyCSharpApplication\n{\n    class Triangle:\
    \ Shape\n    {\n        public Triangle (string name)\n        {\n           \
    \ this.name = name;\n        }\n        public override void DisplayName()\n \
    \       {\n            Console.WriteLine (\"This is a child class named: \" +\
    \ name);\n        }\n    }\n}\n```\n\n#### Pentagon Class\n```csharp\nusing System;\n\
    \nnamespace MyCSharpApplication\n{\n    class Pentagon: Shape\n    {\n       \
    \ public Pentagon (string name)\n        {\n            this.name = name;\n  \
    \      }\n        public override void DisplayName()\n        {\n            Console.WriteLine(\"\
    This is a child class named: \" + name);\n        }\n    }\n}\n```\n\n#### Program\
    \ Class\n```csharp\nusing System;\n\nnamespace MyCSharpApplication\n{\n    class\
    \ Program\n    {\n        static void Main(string[] args)\n        {\n       \
    \     Shape s = new Shape();\n            s.name = \"Shape\";\n            s.DisplayName();\n\
    \n            s = new Triangle(\"Triangle\");\n            s.DisplayName();\n\n\
    \            s = new Pentagon(\"Pentagon\");\n            s.DisplayName();\n \
    \           Console.Read();\n        }\n    }\n}\n```\n\n# Chapter 9: Events and\
    \ Delegates\n\nIn this chapter, we are going to study two important concepts in\
    \ C#: `Delegates` and `Events`. C#’s event handling mechanism is based on these\
    \ two concepts. `Delegates` in C# are function pointers. They hold reference to\
    \ a function. They provide decoupling between the calling function and the function\
    \ being called. An `event` in C# is also a type of `delegate`. `Events` are used\
    \ to invoke methods. For instance, when you click a button, an event fires which\
    \ invokes all the methods associated with the event. In this chapter, we shall\
    \ see these concepts in action.\n\n### Contents\n* Delegates\n* Events\n\n## 1-\
    \ Delegates\n\nDelegates are classes which invoke a method which is passed to\
    \ its constructor. Delegates store references to the method which is passed to\
    \ it. The first example of this chapter demonstrates how a delegate is created\
    \ and how it is used to reference a method.\n\nExample1\n```csharp\nusing System;\n\
    \nnamespace MyCSharpApplication\n{\n    public delegate int ChangeIt(int num);\n\
    \    class Program\n    {\n        static void Main(string[] args)\n        {\n\
    \            ChangeIt c = square;\n            Console.WriteLine(\"The square\
    \ of 4 is: \"+ c(4));\n            Console.Read();\n        }\n        public\
    \ static int square(int num)\n        {\n            return num * num;\n     \
    \   }\n    }\n}\n```\n\nIn `Example1`, we created a delegate, `ChangeIt`, by using\
    \ the keyword `delegate`. A delegate can only store references to methods that\
    \ exactly match the signature of the delegate. For instance, in Example1, the\
    \ delegate signature is `ChangeIt(int num)`. This means that this delegate can\
    \ call any method which accepts an integer type variable as a parameter and returns\
    \ an integer type variable. In the `Program` class, we created a static method\
    \ called `square`. The signature of this method matches the signature of the `ChangeIt`\
    \ delegate. Inside the `Main` method, we create a variable, `c`, of the delegate\
    \ `ChangeIt` and assign it the method `square`. To invoke the method, we simply\
    \ pass the parameter to variable `c`. For instance, if we pass 4 to variable `c`,\
    \ the value returned would be 16 because, internally, `c` would call the `square`\
    \ method. We then display the returned value on the screen.\n\nOutput1:\n```text\n\
    The square of 4 is: 16\n```\n\n## 2- Events\n\nEvents are also a type of `delegate`;\
    \ however, during declaration, the keyword `event` is appended before the delegate\
    \ name. Like delegates, events are also hooked to methods. Events can execute\
    \ methods with a signature similar to the signature of the delegate type of the\
    \ event. When the event is fired, one or more methods can be executed. Example2\
    \ demonstrates how events are hooked to methods and how these methods are called\
    \ when an event is fired.\n\nExample2\n```csharp\nusing System;\n\nnamespace MyCSharpApplication\n\
    {\n    public delegate void DisplayNameHandler();\n    class Program\n    {\n\
    \        public static event DisplayNameHandler NameChanged;\n        static void\
    \ Main(string[] args)\n        {\n            NameChanged += DisplayFruit;\n \
    \           NameChanged += DisplayAnimal;\n            NameChanged += DisplayFlower;\n\
    \            NameChanged += DisplayColor;\n            NameChanged.Invoke();\n\
    \            Console.Read();\n        }\n        public static void DisplayFruit()\n\
    \        {\n            Console.WriteLine(\"This is an apple.\");\n        }\n\
    \        public static void DisplayAnimal()\n        {\n            Console.WriteLine(\"\
    This is a lion.\");\n        }\n        public static void DisplayFlower()\n \
    \       {\n            Console.WriteLine(\"This is a rose.\");\n        }\n  \
    \      public static void DisplayColor()\n        {\n            Console.WriteLine(\"\
    This is red.\");\n        }\n    }\n}\n```\n\nIn Example 2, we created a delegate\
    \ `DisplayNameHandler`. Inside the `Program` class, we created an event `NameChanged`\
    \ of the delegate type `DisplayNameHandler`. We declared four methods: `DisplayFruit`,\
    \ `DisplayAnimal`, `DisplayFlower`, and `DisplayColor`. The signature of these\
    \ methods is similar to the `DisplayNameHandler`; therefore, we can hook these\
    \ four methods to the `NameChanged` event. To hook a method with any event, we\
    \ simply add that method to the event name. In Example 1, the statement `NameChanged\
    \ += DisplayFruit` depicts the hooking of method `DisplayFruit` to the `NameChanged`\
    \ event. To fire an event, we simply call the `Invoke` method on that event. `Invoke`\
    \ executes all the methods hooked with the `NameChanged` event in the order in\
    \ which they are hooked. The output of the code in Example2 is as follows.\n\n\
    Output2:\n```text\nThis is an apple.\nThis is a lion.\nThis is a rose.\nThis is\
    \ red.\n```\n\n# Exercise 9\n\n### Task\nCreate a delegate named `Calculations`\
    \ which accepts two integer type parameters and returns one integer type value.\
    \ In the `Program` class, create two methods, `sum` and `subtract`, which have\
    \ the same signature as the `Calculations` delegate. Create an object of the `Calculation`\
    \ delegate and hook both the `sum` and `subtract` methods to it. Perform `sum`\
    \ and `subtraction` on two random integers using the object of `Calculation` delegate\
    \ hooked to the `sum` and `subtract` methods.\n\n### Solution\n```csharp\nusing\
    \ System;\n\nnamespace MyCSharpApplication\n{\n    public delegate int Calculations(int\
    \ num1, int num2);\n    class Program\n    {\n        static void Main(string[]\
    \ args)\n```\n"
