    \ 次“X”。“Main”方法应该等待这两个线程都完成，然后在屏幕上显示 20 次“#”。之后它应该等待 3 秒，再次显示“#”，这次显示 60 次。最后，再等待\
    \ 3 秒，再显示 20 次“#”。\n\n### Solution\n\n```csharp\nusing System;\nusing System.Threading;\n\
    \nnamespace MyCSharpApplication\n{\n    class Program\n    {\n        static void\
    \ Main(string[] args)\n        {\n            Thread t1 = new Thread(DisplayPlus);\n\
    \            Thread t2 = new Thread(DisplayMultiply);\n\n            t1.Start();\n\
    \            t2.Start();\n\n            t1.Join();\n            t2.Join();\n\n\
    \            Console.WriteLine(\"\\n==========================================\"\
    );\n            for (int i = 0; i < 100; i++)\n            {\n               \
    \ Console.Write(\"+\");\n                if (i + 1 == 20)\n                {\n\
    \                    Console.WriteLine(\"\\nThread Sleeps here for 3 seconds...\"\
    );\n                    Thread.Sleep(3000);\n                }\n             \
    \   if (i + 1 == 80)\n                {\n                    Console.WriteLine(\"\
    \\nThread Sleeps here for 3 seconds...\");\n                    Thread.Sleep(3000);\n\
    \                }\n            }\n            Console.Read();\n        }\n\n\
    \        static void DisplayPlus()\n        {\n            for (int i = 0; i <\
    \ 100; i++)\n            {\n                Console.Write(\"+\");\n          \
    \  }\n        }\n\n        static void DisplayMultiply()\n        {\n        \
    \    for (int i = 0; i < 100; i++)\n            {\n                Console.Write(\"\
    X\");\n            }\n        }\n    }\n}\n```\n\n# 作者其他书籍\n\n#### Java 编程\n[http://www.linuxtrainingacademy.com/java-programming]\n\
    \nJava 是当今最广泛使用且强大的计算机编程语言之一。一旦你学会了用 Java 编程，就可以创建运行在服务器、桌面电脑、平板电脑、手机、蓝光播放机等设备上的软件应用程序。\n\
    \n此外，如果你想确保你的软件无论在什么操作系统上运行行为都一致，那么 Java 的“编写一次，处运行”哲学非常适合你。Java 的设计是与平台无关，允许你创建运行在\
    \ Windows、Mac、Solaris 和 Linux 等多种操作系统上的应用程序。\n\n#### JavaScript：JavaScript 编程语言学习指南\n\
    [http://www.linuxtrainingacademy.com/javascript]\n\nJavaScript 是一种动态计算机编程语言，通常用于网页浏览器来控制网页的行为并与用户进行交互。它允许异步通信，并可以更新网页的部分内容甚至替换整个网页的内容。你将看到\
    \ JavaScript 用于显示日期和时间信息、在网站上执行动画、验证表单输入、在用户向搜索框输入时提供建议结果等。\n\n#### PHP\n[http://www.linuxtrainingacademy.com/php-book]\n\
    \nPHP 是最广泛使用的开源服务器端编程语言之一。如果你对开始编程并想获得该语言的基础知识，那么这本书正适合你！像 Facebook 和 Yahoo 这样的流行网站都是由\
    \ PHP 驱动的。在某种意义上，它是 Web 的语言。\n\n这本书涵盖了 PHP 的核心概念，从基础开始，进入高级的面向对象 PHP。它在过程中解释并演示了一切。你很快就能熟练使用\
    \ PHP 进行编程。\n\n#### Scrum 精要：面向项目经理、Scrum 师、产品所有者利益相关者的敏捷软件开发与敏捷项目管理\n[http://www.linuxtrainingacademy.com/scrum-book]\n\
    \n创建软件的时间是有限的，尤其是当你被赋予截止日期时（无论是自定的还是他规定的）。你会希望确保你构建的软件至少是合格的，更重要的是按时交付。你如何平衡质量与时间？这本书深入探讨了这些非常的话题以及更多内容。\n\
