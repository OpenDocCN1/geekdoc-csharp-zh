    Welcome to C#


    Welcome to C#


    Welcome to C#


    Welcome to C#


    2- “While” Loop


    A “while” loop keeps executing until a certain condition becomes true. “While”
    loop should be used when you do not exactly know that how many times you want
    to execute a particular piece of code. Rather, you want your loop to execute until
    a specific condition becomes true or false. In Example2, we will again print “Welcome
    to C#” on screen ten times, but this time using “while loop”.


    Example2:


    using System;


    namespaceMyCSharpApplication


    {


    class Program


        {


    static void Main(string[] args)


            {


    inti = 1;


    while (i<=10)


                {


    Console.WriteLine("Welcome to C#");


    i++;


                }


    Console.Read();


            }


        }


    }


    In Example2, we can see that the “while” loop only has a condition-clause inside
    the round brackets. This is because the “while” loop doesn’t know how many times
    it has to execute. All it knows is that, unless the condition-clause becomes true,
    it has to execute.  If you write “true” in the condition-clause, the “while” loop
    will keep executing forever.


    Output2:


    Welcome to C#


    Welcome to C#


    Welcome to C#


    Welcome to C#


    Welcome to C#


    Welcome to C#


    Welcome to C#


    Welcome to C#


    Welcome to C#


    Welcome to C#


    3- “Do While” Loop


    The “do while” loop is similar to the “while” loop in functionality. It depends
    only upon the condition clause. However, unlike the “while” loop, the “do while”
    loop executes at least once. This is because the condition clause of the “do while”
    loop is evaluated at the end of the code block. This way, the code block executes
    at least once before the condition-clause is evaluated. Example3 demonstrates
    this process.


    Example3:


    using System;


    namespaceMyCSharpApplication


    {


    class Program


        {


    static void Main(string[] args)


            {


    inti = 1;


    do


                {


    Console.WriteLine("Welcome to C#");


    i++;


                }


    while (i<= 10) ;


    Console.Read();


            }


        }


    }


    In Example3, you can see that the body of the loop starts with a keyword, “do”,
    followed by the code block. At the end of the code block you can see the “while”
    keyword. The condition clause is evaluated here, but before reaching this point
    of code, the loop has executed at least once. The output will again display “Welcome
    to C#” on the console, but this time using the “do while” loop.


    Output3:


    Welcome to C#


    Welcome to C#


    Welcome to C#


    Welcome to C#


    Welcome to C#


    Welcome to C#


    Welcome to C#


    Welcome to C#


    Welcome to C#


    Welcome to C#


    4- “Foreach” Loop


    In C#, the “foreach” loop iterates over all those objects which can be enumerated.
    Most of the .NET types which contain list or sets of elements are enumerable.
    For example, arrays and strings. They can be iterated using a “foreach” loop since
    they store collections of items. This concept has been demonstrated in Example4.


    Example4:


    using System;


    namespaceMyCSharpApplication


    {


    class Program


        {


    static void Main(string[] args)


            {


    foreach (char c in "Welcome to C#")


                {


    Console.WriteLine(c);


                }


    Console.Read();


            }


        }


    }


    Pay attention to the body of the “foreach” loop. It starts with a variable, which
    is “char c” in this case. Here, the type used for the variable is char because
    we are iterating over the string “Welcome to C#” and each item of this string
    is of the “char” type. Then we used the keyword “in”. This keyword has to be used
    whenever you are using a “foreach” loop to iterate over a collection.  Finally,
    we have to enter the name of the collection on which we want to enumerate. The
    “foreach” loop executes a number of times equal to the items inside the collection.
    In the code block, we printed each character of the string “Welcome to C#” on
    a new line.


    Output4:


    W


    e


    l


    c


    o


    m


    e


    t


    o


    C


    #


    Exercise 4


    Task:


    #### Using a “while” loop, display the sum of all the even numbers between 0 and
    100 (inclusive).


    #### Solution:


    using System;


    usingSystem.Diagnostics;


    namespaceMyCSharpApplication


    {


    class Program


        {


    static void Main(string[] args)


            {


    inti = 0;


    int sum = 0;


    while (i<= 100)


                {


    if (i % 2 == 0)


                    {


    sum = sum + i;


                    }


    i++;


                }


    Console.WriteLine("Sum of even numbers between 0 and 100 is:"+sum);


    Console.Read();


            }


        }


    }


    # Chapter 5: Arrays


    Suppose you have to store the salaries of three employees. You can declare three
    integer type variables which can store those salaries. What if you have to store
    the salaries of one hundred employees? Will you declare one hundred integer type
    variables and then individually store the salary of each employee in one variable?
    This is one solution. However, accessing variables this way is very cumbersome.
    Also, this approach results in verbose code. A better approach is to use C# arrays.
    An array contains a collection of items of a particular type. Arrays store data
    in contiguous memory locations which improves its efficiency. Each item in an
    array is called.


    Contents:


    *   Array Syntax


    *   One-dimensional Array


    *   Two-dimensional Array


    1- Array Syntax


    An array has the following syntax:


    type [] array-name = new type [size];


    An array starts with the type of element it is going to store, followed by a square
    bracket and finally the name of the array. At this point in time, an array is
    only declared and no memory locations are reserved for it. To initialize an array,
    you use the “new” keyword followed by the type of the array. This is followed
    by square brackets, and, inside those square brackets, you specify the size of
    the array. The size specifies the number of elements an array can store. The following
    piece of code specifies how to initialize an integer type array named salaries
    with a size of 10.


    int [] salaries = new int [10];


