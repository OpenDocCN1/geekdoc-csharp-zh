    this chapter, we are going to study two advanced OOPs: Inheritance and Polymorphism.
    Like all the other OOP concepts, inheritance in OOP is similar to the concept
    of real world inheritance. A child inherits some of the traits of his/her parents
    while also having some traits specific to him/her. In object oriented programming,
    the concept is similar. Inheritance also exists between different classes and
    is marked by an Is-A relationship. For instance, a “laptop” is a product, a “car”
