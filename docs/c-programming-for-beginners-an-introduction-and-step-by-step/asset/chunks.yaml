    You can have two or more parameterized constructors in your class. When the object
    of the class is created, the constructor whose parameters match with the parameter
    in the call to the constructor would be called. This concept sounds confusing
    at first. The fourth example of this chapter demonstrates the concept of an overloaded
    constructor.


