    # Chapter 6: Objects and Classes


    In the first five chapters, we covered most of the basic C# programming concepts.
    From this chapter onwards, we are going to study some of the advanced programming
    concepts, starting with object oriented programming. In object oriented programming
    (OOP), all the software components are viewed in the context of real world objects.
    For instance, you are developing some car racing game; you will identify the objects
    in the real world car racing. A driver can be an object, a car can be another
    object, and steering is also an object. When you develop your game you will create
    these objects in your program. These objects will interact with each other, resulting
    in fully functional racing car game. This is just a crude example of how modules
    are developed in OOP programming. OOP offers advantages such as code modularity,
    usability, and maintainability.


    Contents


    *   Objects and Classes


    *   Constructor


    1- Objects and Classes


    Anything which has some properties and can perform some functions is worthy of
    being implemented as an object in an OOP. As aforementioned, a player in a racing
    car game can be considered an object since it contains properties like a name,
    age, country, etc. A player can also perform functions like starting the car,
    increasing the speed, turning left, turning right, etc. A player is a perfect
    candidate for being implemented as an object.


    Before diving into the code, an important distinction needs to be made here between
    a class and an object. A class is similar to a blue print. It has no physical
    existence in the memory. Class depicts how the object looks. Multiple objects
    can be created from one class. An object, on the other hand, has an actual physical
    existence in the memory. A class is like a blueprint while an object is the house
    built according to that blueprint.


    To see how objects are created, have a look at the first example of this chapter.


    Example1:


    Add a new class to your project and name it “Player”. The contents of the player
    class should be exactly like the following code snippet.


    class Player


        {


    string name;


    int age;


    string country;


        }'
