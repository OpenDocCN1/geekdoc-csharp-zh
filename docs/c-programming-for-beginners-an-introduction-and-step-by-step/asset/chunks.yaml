    The new price of product Grapes is: 65


    *   Returning Values From Method


    In both of our first two examples, the method “IncreasePrice” did not return any
    value. The return type of the method was void. However, we can also force a method
    to return a value by changing its return type. For instance, we can retrieve the
    increased price from the “IncreasePrice” method by changing its return type to
    “int” and then using “return” at the end of the method, followed by the value
    to be returned. This is explained in the following example.


