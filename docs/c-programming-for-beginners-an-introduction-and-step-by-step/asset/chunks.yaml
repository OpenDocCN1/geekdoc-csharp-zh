    ## 2- Polymorphism\n\nThe object of the parent class can hold objects of child\
    \ classes. The parent class acts differently depending on the reference it is\
    \ storing. This lies in polymorphism. Suppose the `Product` class has a method\
    \ `DisplayProduct`, which displays the name. Both child classes also have a method\
    \ `DisplayProduct`. The question arises here if `DisplayProduct` is called on\
    \ the object, will it be `Product`, `Software`, or `Hardware` class? The answer\
    \ is the `DisplayProduct` method of the object.\n\n### Example2\n\nMake the following\
    \ modification to the `Product`, `Software`, and `Hardware` classes.\n\n#### Product.cs\n\
    ```csharp\nusing System;\nnamespace MyCSharpApplication\n{\nclass Product\n{\n\
    \    public string name;\n    public int price;\n    public virtual void DisplayProduct()\n\
    \    {\n        Console.WriteLine(\"This is parent class: \" + name);\n    }\n\
    }\n}\n```\nIf child classes have to contain a method with the same name as in\
    \ the parent class, that method has to be marked `virtual` in the parent class.\
    \ This is why we marked the `DisplayProduct` method `virtual` in the parent class.\
    \ When this method is added in the child class, it has to be marked with the keyword\
    \ `override`. This is shown in both the `Software` and `Hardware` classes.\n\n\
    #### Software.cs\n```csharp\nusing System;\nnamespace MyCSharpApplication\n{\n\
    class Software : Product\n{\n    public int version;\n    public Software(string\
    \ name, int price, int version)\n    {\n        this.name = name;\n        this.price\
    \ = price;\n        this.version = version;\n    }\n    public override void DisplayProduct()\n\
