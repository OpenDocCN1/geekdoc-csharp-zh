    \    }\n}\n```\n\n在 `Example1` 中，我们初始化了数组 `salaries` 并在初始化时在该数组中存储了 10 个元素。这是在数组中存储元素的方法之一。你初始化数组，并在同一行中，在包含尺寸的方括号之后的大括号内输入元素。在大括号内，你用逗号分隔每个元素。数组具有基于零的存储索引。这意味着数组的第一个元素存储在索引\
    \ 0 ，而最后一个元素存储在索引 `n-1st` ，其中 `n` 是数组的大小。要访问任何索引处的元素，使用数组名后跟方括号。在方括号内，指定索引。例如，在\
    \ `Example1` 中，`salaries` 数组索引 0 处的元素存储在整数变量 `a` 中，而索引 5 处的元素存储在变量 `b` 中。控制台上打印了这两个变量的和。然后数组索引零和五被更新为值\
    \ `25`。在控制台窗口上再次打印了它们的和，现在包含了更新后的值。`Example1` 中代码的输出所示。\n\n**Output1:**\n```\n\
    152\n50\n```\n\n在第 4 章中，我们学习了 `foreach` 循环，它可以遍历任何项目集或列表。除了 `foreach` 循环外，`for`\
    \ 循环也可以用于遍历数组。在 `Example2` 中，我们将看到如何通过 `for` 和 `foreach` 循环遍历数组。\n\n### Example2\n\
    \n```csharp\nusing System;\n\nnamespace MyCSharpApplication\n{\n    class Program\n\
