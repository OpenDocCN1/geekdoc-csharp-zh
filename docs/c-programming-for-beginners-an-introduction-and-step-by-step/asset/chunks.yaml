    );\n            }\n            Console.Read();\n        }\n    }\n}\n```\n\n在\
    \ `Example2` 中，`salaries` 数组再次初始化了一些随机变量。我们首先使用 `for` 循环遍历了数组，然后使用 `foreach` 循环遍历了\
    \ `salaries` 数组。`Example2` 中代码的输出如下。\n\n**Output2:**\n```\n78 15 27 87 56 74 12\
    \ 36 98 41\n78 15 27 87 56 74 12 36 98 41\n```\n\n### 3- 二维数组\n\n一维数组以单列或单行的形式存储数据。二维数组（通常称为数组的数组）以多行多列的形式存储数据。数据以矩阵的形式存储在内存中。要初始化二维数组，你只需要在数组类型后的方括号内放入一个逗号。在左侧，`new`\
    \ 关键字之后的方括号内，你必须指定数组包含的行数和列数。行和列之间用逗号分隔。查看 `Example3` 以二维数组的实际运行。\n\n### Example3\n\
    \n```csharp\nusing System;\n\nnamespace MyCSharpApplication\n{\n    class Program\n\
