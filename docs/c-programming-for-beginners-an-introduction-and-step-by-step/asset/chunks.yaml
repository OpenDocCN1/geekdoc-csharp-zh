    \    public int price;\n}\n}\n```\nIn the `Product` class, we added only two attributes:\
    \ `name` and `price`.\n\n#### Software.cs\n```csharp\nusing System;\nnamespace\
    \ MyCSharpApplication\n{\nclass Software : Product\n{\n    public int version;\n\
    \    public Software(string name, int price, int version)\n    {\n        this.name\
    \ = name;\n        this.price = price;\n        this.version = version;\n    }\n\
    }\n}\n```\nHave a look at the declaration of the software class. After the name\
    \ of the class, we appended a semicolon followed by `Product`. This is how the\
    \ child class inherits the parent class. You have to append a semicolon after\
    \ the child class name followed by the class name which you want your child class\
    \ to inherit. In the above code, the `Software` class is inheriting the `Product`\
    \ class. In the software classes, we added only one attribute named `version`.\
    \ Then we added a parameterized constructor with three parameters. Inside the\
    \ constructor, we initialized `name`, `price`, and `version` attributes. Notice\
    \ that the `Software` class doesn’t contain `name` and `price` attributes, but\
    \ since it is inheriting the `Product` class, which contains these attributes,\
    \ the child `Software` class has these attributes by default. In the same way,\
    \ we inherited the `Hardware` class from the `Product` class and initialized its\
    \ attributes.\n\n#### Hardware.cs\n```csharp\nusing System;\nnamespace MyCSharpApplication\n\
    {\nclass Hardware : Product\n{\n    public int weight;\n    public Hardware(string\
    \ name, int price, int weight)\n    {\n        this.name = name;\n        this.price\
    \ = price;\n        this.weight = weight;\n    }\n}\n}\n```\nIn the `Program`\
