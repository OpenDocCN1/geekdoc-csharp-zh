  trans: "\n\n逻辑构建是每个程序的核心。逻辑构建涉及做出决定。在日常生活中，我们根据某些标准做出决定。例如，如果天气下雨，我们就决定不在外面玩；如果天气大雾天，我们就会小心开车。我们每天必须做成数百个微小的决定。同样，计算机程序在执行过程中也必须做出决定。根据这些决定，特定的代码将被执行，而另一些代码则不执行。例如，你可能希望程序从用户那里获取关于天气的输入，然后建议用户是否可以在外面玩。在\
    \ C# 中，这是通过选择语句（也称为控制语句）实现的。在本章中，我们将学习 C# 选择语句。\n\n# 目录\n\n*   If/Else 语句\n* \
    \  Switch 语句\n\n## 1- If/Else 语句\n\n`if` 语句用于在语句体中输入的 `test-expression` 求值为真时执行一段代码。`Example1`\
    \ 展示了 `if` 语句的用法。\n\n### Example1:\n\n```csharp\nusing System;\n\nnamespaceMyCSharpApplication\n\
    {\n    class Program\n    {\n        static void Main(string[] args)\n       \
    \ {\n            string weather = \"sunny\";\n            if (weather == \"rainy\"\
    )\n            {\n                Console.WriteLine(\"Don’t play outside, it’s\
    \ rainy.\");\n            }\n            if (weather == \"sunny\")\n         \
    \   {\n                Console.WriteLine(\"You can play outside, it’s sunny.\"\
    );\n            }\n            Console.Read();\n        }\n    }\n}\n```\n\n在\
    \ `Example 1` 中，我们初始化了一个字符串类型的变量 `weather` 为 `sunny`。然后我们使用了两个 `if` 语句。第一个 `if`\
    \ 语句判断变量 `weather` 是否包含值 `rainy`。该表达式将返回 false，因为变量 `weather` 包含字符串 `sunny`。控制流将转移到下一个\
    \ `if` 语句，在那里将对变量 `weather` 与字符串 `rainy` 进行比较。该表达式将返回 true，紧随其后的 `if` 语句后的代码块将执行。`Example1`\
    \ 的输出显示所示：\n\n**Output1:**\n\nYou can play outside, it’s sunny.\n\n使用 `if` 语句存在一个问题。如果第一个\
    \ `if` 语句中的表达式返回真，仍然会与后续的 `if` 语句进行比较。这在某些情况下是不理想的。例如，如果我们希望当 `weather` 等于 `rainy`\
    \ 时，比较 `weather` 与 `sunny` 的下一个 `if` 语句不执行怎么办？在这种情况下，我们使用 `else` 和 `if/else` 语句。`Example2`\
    \ 展示了这一概念。\n\n### Example2:\n\n```csharp\nusing System;\n\nnamespaceMyCSharpApplication\n\
    {\n    class Program\n    {\n        static void Main(string[] args)\n       \
    \ {\n            string weather = \"rainy\";\n            if (weather == \"rainy\"\
    )\n            {\n                Console.WriteLine(\"Don’t play outside, it’s\
    \ rainy.\");\n            }\n            else if (weather == \"sunny\")\n    \
    \        {\n                Console.WriteLine(\"You can play outside, it’s sunny.\"\
    );\n            }\n            else\n            {\n                Console.WriteLine(\"\
    Weather cannot be determined, try again.\");\n            }\n            Console.Read();\n\
    \        }\n    }\n}\n```\n\n在 `Example2` 中，变量 `weather` 被初始化为 `rainy`。因此，将执行第一个\
    \ `if` 语句。在 `if` 语句之后，我们使用 `if/else` 语句来判断 `weather` 是否等于 `sunny`。但由于第一个 `if`\
    \ 语句为真，`if/else` 语句中的条件将不会执行，这与多个 `if` 语句不同，在多个 `if` 语句中，即使第一个 `if` 为真，后续语句中的条件也会被评估。你可以在\
    \ `if` 语句之后使用多个 `if/else` 块。如果你需要根据一个条件在两个代码块之间进行选择，也可以在 `if` 语句之后使用一个 `else`\
    \ 语句。`Example2` 的输出如下：\n\n**Output2:**\n\nDon’t play outside, it’s rainy.\n\n\
    ## 2- Switch Statement\n\n如果你需要进行少量的比较，`if/else` 语句很好用。但在比较次数较的情况下，`switch` 语句是更好的替代方案。为了看到\
    \ `switch statement` 的工作原理，让我们直接来看。\n\n### Example3:\n\n```csharp\nusing System;\n\
    \nnamespaceMyCSharpApplication\n{\n    class Program\n    {\n        static void\
    \ Main(string[] args)\n        {\n            string weather = \"cloudy\";\n \
    \           switch (weather)\n            {\n                case \"rainy\":\n\
    \                    Console.WriteLine(\"Don’t play outside, it’s rainy.\");\n\
    \                    break;\n                case \"sunny\":\n               \
    \     Console.WriteLine(\"You can play outside, it’s sunny.\");\n            \
    \        break;\n                case \"cloudy\":\n                    Console.WriteLine(\"\
    Wait but play outside, it’s cloudy.\");\n                    break;\n        \
    \        default:\n                    Console.WriteLine(\"Weather cannot be determined.\"\
    );\n                    break;\n            }\n            Console.Read();\n \
    \       }\n    }\n}\n```\n\nSwitch 语句以 `switch` 关键字开头，后面跟着一对左、右括号。在这些括号内部，我们输入想要比较的变量。在\
    \ `Example3` 中，我们初始化了 `weather` 并将其赋值为字符串 `cloudy`。在 `switch` 语句中有多个 `case`。每个\
    \ `case` 都有一个字符串值，后面跟着一个冒号。在每个 `case` 下都添加了代码段。如果 `case` 匹配，该代码段将执行。如果没有任何 `case`\
    \ 匹配，则执行 `default` 语句。`Example3` 的输出所示：\n\n**Output3:**\n\nWait but play outside,\
    \ it’s cloudy.\n\n### Exercise 3\n\n**任务：**\n\n初始化一个整数类型变量为随机值。编写一个包含四个 `case`\
    \ 的 `switch` 语句。一个 `case` 值应该匹配你化的整数。在每个 `case` 语句代码段中显示不同的礼物。针对整数值显示 PS4。\n\n\
    **解决方案：**\n\n```csharp\nusing System;\nusing System.Diagnostics;\n\nnamespaceMyCSharpApplication\n\
    {\n    class Program\n    {\n        static void Main(string[] args)\n       \
    \ {\n            int lottery = 45176;\n            switch (lottery)\n        \
    \    {\n                case 46781:\n                    Console.WriteLine(\"\
    You won a mobile set.\");\n                    break;\n                case 45176:\n\
    \                    Console.WriteLine(\"You won a PS4.\");\n                \
    \    break;\n                case 74217:\n                    Debug.WriteLine(\"\
    Sorry you won nothing.\");\n                    break;\n                case 74193:\n\
    \                    Debug.WriteLine(\"You won a cinema ticket\");\n         \
    \           break;\n                default:\n                    Console.WriteLine(\"\
    Sorry you won nothing.\");\n                    break;\n            }\n      \
    \      Console.Read();\n        }\n    }\n}\n```\n\n# 第 4 章：迭代语句\n\n在编写程序时，你可能想要重复执行一段特定的代码。一种方法是根据你想重复执行的次数编写该代码。然而，这种方法极其不专业，会导致代码冗余。为了解决这个问题，引入了迭代语句。迭代语句的概念可以追溯到最早的编程语言。它们的语法在不同语言可能不同，但核心概念是相同的；目的是按照开发者指定的次数执行代码。迭代语句通常被称为“循环”，因为它们以循环的形式重复执行代码。\n\
    \n## 内容\n\n*   `For` 循环\n*   `While` 循环\n*   `Do While` 循环\n*   `Foreach` 循环\n\
    \n## 1- `For` 循环\n\n"
- fmt: "\n# For Loops\n\n`for` loops allow developers to write a piece of code which\
    \ executes exactly the number of times as specified by the developer. This loop\
    \ is perfect to use when you know the exact number of iterations you want your\
    \ code to go through. For instance, if you want to print your name ten times on\
    \ the screen, a `for loop` is the solution since you already know that there will\
    \ be ten iterations of the code which prints your name on the screen. To see a\
    \ `for loop` in action, have a look at the first example of this chapter.\n\n\
    ### Example 1:\n\n```csharp\nusing System;\n\nnamespace MyCSharpApplication\n\
    {\n    class Program\n    {\n        static void Main(string[] args)\n       \
    \ {\n            for (int i = 1; i<= 10; i++)\n            {\n               \
    \ Console.WriteLine(\"Welcome to C#\");\n            }\n            Console.Read();\n\
    \        }\n    }\n}\n```\n\nPay attention to the syntax of the `for loop`; it\
    \ starts with an opening round bracket. Inside the round bracket we have three\
    \ expressions separated by semicolons. The first expression, `i=1`, is the initialization-clause\
    \ which means that loop starts with `i=1`. This is evaluated only once. The second\
    \ expression `i<=10` is the condition-clause, which says that the loop will keep\
    \ executing until this condition returns true. After evaluating the condition-clause,\
    \ the body of the loop (which is inside the curly brackets followed by the closing\
    \ round bracket) executes. The last expression inside the round bracket is `i++`.\
    \ This is called the iteration clause; each time the body of the loop executes,\
    \ this clause executes and the control again shifts to the `condition-clause`.\
    \ The loop keeps executing until the condition-clause returns true. In Example1,\
    \ the loop starts from `i=1` and keeps executing until `i` is less than or equal\
    \ to ten, with increments of 1 in each execution. This means that the loop would\
    \ execute 10 times. Each time, the statement `\"Welcome to C#\"` will be printed\
    \ on the console, so the output would contain `\"Welcome to C#\"` printed on screen\
    \ 10 times.\n\n#### Output 1:\n\n```text\nWelcome to C#\nWelcome to C#\nWelcome\
    \ to C#\nWelcome to C#\nWelcome to C#\nWelcome to C#\nWelcome to C#\nWelcome to\
    \ C#\nWelcome to C#\nWelcome to C#\n```\n\n## 2- \"While\" Loop\n\nA `while loop`\
    \ keeps executing until a certain condition becomes true. `While loop` should\
    \ be used when you do not exactly know how many times you want to execute a particular\
    \ piece of code. Rather, you want your loop to execute until a specific condition\
    \ becomes true or false. In Example2, we will again print `\"Welcome to C#\"`\
    \ on screen ten times, but this time using `while loop`.\n\n### Example 2:\n\n\
    ```csharp\nusing System;\n\nnamespace MyCSharpApplication\n{\n    class Program\n\
    \    {\n        static void Main(string[] args)\n        {\n            int i\
    \ = 1;\n            while (i<=10)\n            {\n                Console.WriteLine(\"\
    Welcome to C#\");\n                i++;\n            }\n            Console.Read();\n\
    \        }\n    }\n}\n```\n\nIn Example2, we can see that the `while loop` only\
    \ has a condition-clause inside the round brackets. This is because the `while\
    \ loop` doesn’t know how many times it has to execute. All it knows is that, unless\
    \ the condition-clause becomes true, it has to execute. If you write `true` in\
    \ the condition-clause, the `while loop` will keep executing forever.\n\n####\
    \ Output 2:\n\n```text\nWelcome to C#\nWelcome to C#\nWelcome to C#\nWelcome to\
    \ C#\nWelcome to C#\nWelcome to C#\nWelcome to C#\nWelcome to C#\nWelcome to C#\n\
    Welcome to C#\n```\n\n## 3- \"Do While\" Loop\n\nThe `do while loop` is similar\
    \ to the `while loop` in functionality. It depends only upon the condition clause.\
    \ However, unlike the `while loop`, the `do while loop` executes at least once.\
    \ This is because the condition clause of the `do while loop` is evaluated at\
    \ the end of the code block. This way, the code block executes at least once before\
    \ the condition-clause is evaluated. Example3 demonstrates this process.\n\n###\
    \ Example 3:\n\n```csharp\nusing System;\n\nnamespace MyCSharpApplication\n{\n\
    \    class Program\n    {\n        static void Main(string[] args)\n        {\n\
    \            int i = 1;\n            do\n            {\n                Console.WriteLine(\"\
    Welcome to C#\");\n                i++;\n            }\n            while (i<=\
    \ 10) ;\n            Console.Read();\n        }\n    }\n}\n```\n\nIn Example3,\
    \ you can see that the `do while loop` starts with the `do` keyword, followed\
    \ by the code block. At the end of the code block you can see the `while` keyword.\
    \ The condition is evaluated here, but before reaching this point, the loop has\
    \ executed at least once.\n\n#### Output 3:\n\n```text\nWelcome to C#\n```\n\n\
    ## 4- \"Foreach\" Loop\n\nThe `foreach loop` iterates over all objects in a collection.\
    \ In C#, the `foreach loop` iterates over strings, arrays, which are enumerable\
    \ types.\n\n### Example 4:\n\n```csharp\nusing System;\n\nnamespace MyCSharpApplication\n\
    {\n    class Program\n    {\n        static void Main(string[] args)\n       \
    \ {\n            foreach (char c in \"Welcome to C#\")\n            {\n      \
    \          Console.WriteLine(c);\n            }\n            Console.Read();\n\
    \        }\n    }\n}\n```\n\nPay attention to the syntax of the `foreach loop`;\
    \ it starts with an opening round bracket. Inside the round bracket we have two\
    \ expressions separated by semicolons. The first expression, `char c`, is the\
    \ initialization-clause which means that loop starts with `char c`. This is evaluated\
    \ only once. The second expression `in \"Welcome to C#\"` is the collection-clause,\
    \ which says that the loop will keep executing until the collection is exhausted.\
    \ After evaluating the collection-clause, the body of the loop (which is inside\
    \ the curly brackets followed by the closing round bracket) executes.\n\n# Chapter\
    \ 5: Arrays\n\nArrays are used to store multiple values of the same type. They\
    \ store data in contiguous memory locations, which improves efficiency.\n\nContents:\n\
    *   Array Syntax\n*   One-dimensional Array\n*   Two-dimensional Array\n\n###\
    \ 1- Array Syntax\n\nAn array has the following syntax:\n`type [] array-name =\
    \ new type [size];`\n\nAn array starts with the type of element it is going to\
    \ store, followed by a square bracket and finally the name of the array. At this\
    \ point in time, an array is only declared and no memory locations are reserved\
    \ for it. To initialize an array, you use the `new` keyword followed by the type\
    \ of the array. This is followed by square brackets, and, inside those square\
    \ brackets, you specify the size of the array.\n\n### 2- One-Dimensional Array\n"
