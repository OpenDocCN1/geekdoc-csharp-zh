    Hardware.cs


    using System;


    namespaceMyCSharpApplication


    {


    class Hardware : Product


        {


    publicint weight;


    public Hardware(string name, int price, int weight)


            {


                this.name = name;


    this.price = price;


    this.weight = weight;


            }


        }


    }


    In the “Program” class, we create objects of both the “Software” and “Hardware”
    classes using their parameterized constructors and then display the names of both
    of the objects.


    Program.cs


    using System;


    namespaceMyCSharpApplication


    {


    class Program


        {


    static void Main(string[] args)


            {


                Software s = new Software("windows 7", 150, 3);


                Hardware h = new Hardware("Laptop", 500, 2);


    Console.WriteLine("You bought: " + s.name + " and " + h.name);


    Console.Read();


            }


        }


    }


    Output1:


    You bought: windows 7 and Laptop 


    2- Polymorphism


    The object of the parent class can hold objects of child classes. The parent class
    acts differently depending on the reference of the object it is storing. This
    concept lies in the basis of polymorphism. Suppose the “Product” class has a method,
    “DisplayProduct”, which displays the name of the product on screen. Both the child
    classes also have a method called “DisplayProduct”. The method inside the “Software”
    class displaysname and version while the method inside the “Hardware” class displays
    name and price. Since the object of the “Product” class can store references of
    the “Product”, “Software”, and “Hardware” classes, the question arises here that
    if “DisplayProduct” method is called on the object, which method will be called?
    Will it be of “Product”, “Software”, or “Hardware” class? The answer is the “DisplayProduct”
    method will call the class whose reference is stored in the object of the “Product”
    class. This concept has been explained in Example2.


    Example2


    Make the following modification to the “Product”, “Software”, and “Hardware” classes
    added in Example1.


    Product.cs


    using System;


    namespaceMyCSharpApplication


    {


    class Product


        {


    public string name;


    public  int price;


    public virtual void DisplayProduct()


            {


    Console.WriteLine("This is a parent class: " + name);


            }


        }


    }


    If child classes have to contain a method with the same name as in the parent
    class, that method has to be marked virtual in the parent class. This is why we
    marked the “DisplayProduct” method virtual in the parent class. When this method
    is added in the child class, it has to be marked with the keyword “override”.
    This is shown in both the “Software” and “Hardware” classes.


    Software.cs


    using System;


    namespaceMyCSharpApplication


    {


    class Software : Product


        {


    publicint version;


    public Software(string name, int price, int version)


            {


                this.name = name;


    this.price = price;


    this.version = version;


            }


    public override void DisplayProduct()


            {


    Console.WriteLine("You bought " + name + ", version "+ version);


            }


        }


    }


    Hardware.cs


    using System;


    namespaceMyCSharpApplication


    {


    class Hardware : Product


        {


    publicint weight;


    public Hardware(string name, int price, int weight)


            {


                this.name = name;


    this.price = price;


    this.weight = weight;


            }


    public override void DisplayProduct()


            {


    Console.WriteLine("You bought " + name + ", weight " + weight);


            }


        }


