    # Chapter 7: Access Modifiers and Methods


    In the last chapter, we studied what objects and classes are and how the member
    variables of a class can be initialized via constructor. We also studied different
    types of constructors. In this chapter, we are going to study how objects act
    to perform certain functionalities. In object oriented programming (OOP), this
    is achieved via methods. However, before diving into the details of methods, we
    shall study another important concept: access modifiers in C#.


    Contents


    *   Access Modifiers


    *   Methods in C#


    1- Access Modifiers


    From the beginning of this book, we have been using the keyword “public” with
    variables. This is one of the five access modifiers available in C#. Access modifiers
    control access to a particular variable. For instance, a member variable marked
    “public” can be accessed anywhere. However, a variable marked “private” is accessible
    only within the class in which it exists. Table 1.0 contains C#’s five access
    modifiers along with their functionalities.


    | Access Modifier | Functionality |


    | public | Accessible everywhere |


    | internal | Accessible only to the classes within the assembly and friend assemblies
    |


    | protected | Accessible only within the class and its derived classes |


    | private | Accessible only within the class |


    | Protected-internal | Accessible where protected or internal are accessible |


    2- Methods


    As aforementioned, C# classes and objects act via methods. To understand the concept
    of methods in C#, let’s jump straight to the first example of this chapter.


    Example1:


    Add a new class named “Product” to the existing project. The contents of the “Product”
    class should be similar to the following code snippet.


