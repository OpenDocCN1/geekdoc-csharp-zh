    \n# 引言\n\n感谢阅读《C# 初学者编程》，我我想送给你一份免费的《7 个不为人知的 C# 编程技巧》。\n\n要下载你的副本请访问：[`www.linuxtrainingacademy.com/7-tricks`](http://www.linuxtrainingacademy.com/7-tricks)\n\
    \n# 第一章：创建你的第一个 C# 程序\n\nC# 是微软顶尖的编程语言，是微软 .NET 框架不可或缺的一部分。C# 是一种完全面向对象且类型安全的语言。如果你正希望使用微软的编程技术开发应用程序，那么\
    \ C# 是最佳起点。目前 C# 正用于开发 ASP.NET Web 应用程序、Windows Forms 和基于 WPF 的桌面应用程序。随着智能手机的出现，C#\
    \ 也用于 Windows 手机应用和 Android 应用程序开发。\n\n本书介绍了 C# 语言核心特性的概述。阅读完本书后，你将能够上手微软的高级编程技术，如\
    \ ASP.NET、WCF、WPF 和 Windows Phone。本书的第一章解释了如何安装 IDE（集成开发环境）以及如何创建你的第一个 C# 应用程序。\n\
    \n## 内容\n\n- 安装 IDE\n- 创建并运行第一个应用程序\n\n## 1- 安装 IDE\n\n毫无疑问，开发 C# 应用程序的最佳软件是微软的\
    \ Visual Studio 集成环境。它包含了构建专业 C# 应用程序所需的一切。然而，Visual Studio 的完整版是商业性的。在书中，我们将不花一分钱开发\
    \ C# 应用程序。为了实现这一点，我们将下载精简版的 `Visual Studio`，它是完全免费的。该软件提供的功能足够开发基础 C# 应用程序。\n\n\
    - 访问 [`www.linuxtrainingacademy.com/7-tricks`](http://www.linuxtrainingacademy.com/7-tricks)\n\
    - 向下滚动页面并找到 [`www.linuxtrainingacademy.com/7-tricks/products/visual-studio.aspx`](http://www.linuxtrainingacademy.com/7-tricks/products/visual-studio.aspx)\n\
    - 出现的页面将要求你使用 `Microsoft Account` 登录。\n- 如果你没有，请在该页面上注册。\n- 创建 ID 后，选择最新版本的 `Visual\
    \ Studio`。\n- 将下载 `express_full.exe`。\n- 打开 `express_full.exe`。出现安装向导。同意条款和隐私政策并点击\
    \ `Install` 按钮。\n- 完成。向导将下载开发应用程序所需的组件。\n\n## 2- 创建并运行第一个应用程序\n\n要创建你的第一个 C# 应用程序，请打开上一节下载的\
    \ `Visual Studio`。按照以下步骤操作：\n\n- 从菜单栏选择 `File` => `New` => `Project`。\n- 在出现的选项中选择\
    \ `Console Application`。\n- 在 `Name` 和 `Location` 文本框输入你选择的名称和位置。勾选 `Create directory\
    \ for solution` 并点击 `OK` 按钮。\n\n一旦点击 `OK` 按钮，visual studio 会自动创建一个程序。将默认代码段替换为：\n\
    \n```csharp\nusing System;\n\nnamespace MyFirstApplication\n{\n    class Program\n\
    \    {\n        static void Main(string[] args)\n        {\n            Console.WriteLine(\"\
    Welcome to C#\");\n            Console.Read();\n        }\n    }\n}\n```\n\n-\
    \ 点击工具栏中绿色三角形旁的 `Start` 按钮。你将在控制台中看到代码的输出。你在 `Console.WriteLine` 方法中写的字符串“Welcome\
    \ to C# 显示在屏幕上。\n\n在代码中，请记住 C# 中的一切都发生在类内部。`Program` 类是代码执行的起点，因为它包含了 `Main` 方法。当你运行程序时，`static\
    \ void Main (string [] args)` 方法会被调用。执行的第一条语句是 `Main` 方法内部的第一条语句。要在现有项目中添加新类，只需右键点击项目名称\
    \ => Add => `Class`。\n\n你已经完成了第一章。在本章中，你学习了如何安装用于开发 C# 应用程序的 IDE。你还开发了第一个 C# 应用程序，它在控制屏幕上打印一个字符串。在下一章中，我们将看看\
    \ C# 程序可以存储什么类型的数据以及可以对这些数据进行哪些操作。\n\n"
- fmt: "\nEvery program needs to store some data and perform some functionality on\
    \ the data. In C#, data is stored in data types, and operations are performed\
    \ on the data using C# operators. In this chapter, we will take a look at some\
    \ of the most commonly used data types, as well as the operators which operate\
    \ on the data to help us achieve some meaningful functionality.\n\n## Contents\n\
    * Data types in C#\n* Operators in C#\n\n## 1- Data Types in C#\n\nThe following\
    \ table demonstrates the usage of each data type along with the range of data\
    \ that each data type can store.\n\n| Type | Represents | Range |\n| :--- | :---\
    \ | :--- |\n| bool | Boolean value | True or False |\n| byte | 8-bit unsigned\
    \ integer | 0 to 255 |\n| char | 16-bit Unicode character | U +0000 to U +ffff\
    \ |\n| decimal | 128-bit precise decimal values with 28-29 significant digits\
    \ | (-7.9 x 1028 to 7.9 x 1028) / 100 to 28 |\n| double | 64-bit double-precision\
    \ floating point type | (+/-)5.0 x 10-324 to (+/-)1.7 x 10308 |\n| float | 32-bit\
    \ single-precision floating point type | -3.4 x 1038 to + 3.4 x 1038 |\n| int\
    \ | 32-bit signed integer type | -2,147,483,648 to 2,147,483,647 |\n| long | 64-bit\
    \ signed integer type | -923,372,036,854,775,808 to 9,223,372,036,854,775,807\
    \ |\n| sbyte | 8-bit signed integer type | -128 to 127 |\n| short | 16-bit signed\
    \ integer type | -32,768 to 32,767 |\n| uint | 32-bit unsigned integer type |\
    \ 0 to 4,294,967,295 |\n| ulong | 64-bit unsigned integer type | 0 to 18,446,744,073,709,551,615\
    \ |\n| ushort | 16-bit unsigned integer type | 0 to 65,535 |\n\nTable 1.0\n\n\
    ## 2- Operators in C#\n\nIn this section we are going to take a bird’s eye view\
    \ of three types of operators in C#: Arithmetic Operators, Relational Operators,\
    \ and Logical Operators.\n\n### Arithmetic Operators\n\nArithmetic operators in\
    \ C# perform the same functionality as they do in real life. These operators are\
    \ used to perform various mathematical functions in C#. Arithmetic operators can\
    \ only be applied to the operands of numeric and `char` data types. Table 1.1\
    \ enlists these operators along with their functionalities.\n\n| Operator | What\
    \ they do |\n| :--- | :--- |\n| `+` | Addition and unary plus |\n| `-` | Subtraction\
    \ and unary minus |\n| `*` | Multiplication |\n| `/` | Division |\n| `%` | Modulus\
    \ |\n| `++` | Increment a number |\n| `+=` | Increment and assign |\n| `-=` |\
    \ Decrement and assign |\n| `*=` | Multiply and assign |\n| `/=` | Divide and\
    \ Assign |\n| `%=` | Modulus and Assign |\n| `--` | Decrement a Number |\n\nTable\
    \ 1.1\n\nHave a look at the first example of this chapter to see some of the arithmetic\
    \ operators in action.\n\nExample1:\n\n```csharp\nusing System;\n\nnamespace MyFirstApplication\n\
    {\n    class Program\n    {\n        static void Main(string[] args)\n       \
    \ {\n            int num1 = 10;\n            int num2 = 5;\n            int sum\
    \ = num1 + num2;\n            int sub = num1 - num2;\n            int multi =\
    \ num1 * num2;\n            int division = num1 / num2;\n            int mod =\
    \ num1 % num2;\n            Console.WriteLine(\"Addition:\" + sum + \"\\nSubtraction:\"\
    \ + sub + \"\\nMultiplication:\" + multi + \"\\nDivision:\" + division + \"\\\
    nModulus:\" + mod);\n            Console.Read();\n        }\n    }\n}\n```\n\n\
    In Example1, we have declared integer type variables, `num1` and `num2`. These\
    \ two variables store 10 and 5, respectively. Next, we have declared five integer\
    \ type variables that store the `sum`, `minus`, `multiplication`, `division`,\
    \ and `modulus` of `num1` and `num2`. Finally, these variables have been printed\
    \ on the console using `Console.WriteLine`. The output of the code in Example1\
