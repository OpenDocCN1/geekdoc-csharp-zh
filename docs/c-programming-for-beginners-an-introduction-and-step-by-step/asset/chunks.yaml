    \ Console.WriteLine();\n            }\n            Console.Read();\n        }\n\
    \    }\n}\n```\n"
- fmt: "\nThis is the structure of the `Player` class. From this structure, it can\
    \ be assumed that the object of the class will contain three variables: `name`,\
    \ `age`, and `country`. The memory occupied by the object of the `player` will\
    \ be roughly equal to the sum of the memories occupied by the variables `name`,\
    \ `age`, and `country`. The `Player` class would have been created in the same\
    \ namespace in which your `Program` class resides.\n\nOpen the `Program` class\
    \ code and make following changes.\n\n```csharp\nusing System;\n\nnamespace MyCSharpApplication\n\
    {\n    class Program\n    {\n        static void Main(string[] args)\n       \
    \ {\n            Player p = new Player();\n            p.name = \"Alan\";\n  \
    \          p.age = 25;\n            p.country = \"USA\";\n            Console.WriteLine(p.name\
    \ +\",\"+p.age+\",\"+p.country);\n            Console.Read();\n        }\n   \
    \ }\n}\n```\n\nIn the `Program.cs` file above, we created an object `p` in the\
    \ `Player` class. To create an object of any class, use the `new` keyword followed\
    \ by the constructor of the class. We will dig deeper into constructors in the\
    \ next section. For now, assume that `Player()` is the default constructor of\
    \ the `Player` class. Calling `new` followed by the constructor of any class creates\
    \ an object of that class in memory and returns its reference. This reference\
    \ can be stored in the variable of that class. In Example1, we created a variable\
    \ `p` in class `Player`. This variable `p` stores the reference of the object\
    \ in the `Player` class. To access the members of an object, use the reference\
    \ variable then a dot (`.`) followed by the property that you want to access.\
    \ For instance, if you want to access the name of the object `p`, you will use\
    \ `p.name`. In this way, we stored three random values in `name`, `age`, and `country`.\
    \ Finally, we print these values on the output console.\n\n**Output1:**\nAlan,25,USA\n\
    \n## 2- Constructor\n\nA constructor is a function which creates an object of\
    \ a class and returns its reference to the calling function. The name of the constructor\
    \ is exactly the same as the name of the class in which it is written. A constructor\
    \ has no return type, not even void. A constructor can also be used to initialize\
    \ the member variables of the class when the object is being created. In the second\
    \ example of this chapter, we will see how a constructor can be used to initialize\
    \ member variables.\n\n**Example2:**\nMake the following changes in the `Player`\
    \ class you created in Example1.\n\n```csharp\nusing System;\n\nnamespace MyCSharpApplication\n\
    {\n    class Player\n    {\n        public string name;\n        public int age;\n\
    \        public string country;\n        public Player()\n        {\n        \
    \    name = \"Scott\";\n            age = 30;\n            country = \"UK\";\n\
    \        }\n    }\n}\n```\n\nIn the above code, we created a constructor which\
    \ initializes the variables `name`, `age`, and `country`. `name` becomes \"Scott\"\
    , `age` becomes \"30\", and `country` becomes \"UK\". When the object of this\
    \ class is created, these three variables will automatically initialized and will\
    \ be readily available for printing on screen. To see their values on the console,\
    \ make the following changes in the `Program` class.\n\n```csharp\nusing System;\n\
    \nnamespace MyCSharpApplication\n{\n    class Program\n    {\n        static void\
    \ Main(string[] args)\n        {\n            Player p = new Player();\n     \
    \       Console.WriteLine(p.name +\",\"+p.age+\",\"+p.country);\n            Console.Read();\n\
    \        }\n    }\n}\n```\n\nThe output of the code in Example2 is follows:\n\
    **Output2:**\nScott,30,UK\n\n## Parameterized Constructor\n\nYou can also initialize\
    \ the member variables of the class using a constructor by passing arguments to\
    \ the constructor while creating the object of the class. The constructor, which\
    \ takes parameter from the calling function, is called parameterized constructor.\
    \ Example3 demonstrates usage of the parameterized constructor in C#.\n\n**Example3:**\n\
    Make the following changes in the `Player` class:\n\n```csharp\nusing System;\n\
    \nnamespace MyCSharpApplication\n{\n    class Player\n    {\n        public string\
    \ name;\n        public int age;\n        public string country;\n        public\
    \ Player(string name, int age, string country)\n        {\n            this.name\
    \ = name;\n            this.age = age;\n            this.country = country;\n\
    \        }\n    }\n}\n```\n\nIn the above code snippet, we have entered three\
    \ variables in the brackets after the constructor. These are the parameters, which\
    \ are separated by commas. To call this constructor, we have to pass three parameters\
    \ in the call. These parameters should match the parameter type in the constructor.\
    \ Also, the order of the passed parameters should match the order of the parameters\
    \ in the constructor declaration. For instance, in the call to this parameterized\
    \ constructor, the first parameter should be `string`, the second should be `integer`,\
    \ and the third should be `string`. Make the following changes in the `Program`\
    \ class to see how this works.\n\n```csharp\nusing System;\n\nnamespace MyCSharpApplication\n\
    {\n    class Program\n    {\n        static void Main(string[] args)\n       \
    \ {\n            Player p = new Player(\"Joseph\", 35, \"Italy\");\n         \
    \   Console.WriteLine(p.name +\",\"+p.age+\",\"+p.country);\n            Console.Read();\n\
    \        }\n    }\n}\n```\n\nThe output of the code in Example3 is follows:\n\
    **Output3:**\nJoseph,35,Italy\n\n## Overloaded Constructor\n\nYou can have two\
    \ or more parameterized constructors in your class. When the object of the class\
    \ is created, the constructor whose parameters match with the parameter in the\
    \ call would be called. This concept sounds confusing at first. The fourth example\
    \ of this chapter demonstrates the concept of an overloaded constructor.\n\n**Example4:**\n\
    Make the following changes in the `Player` class.\n\n`Player.cs`\n```csharp\n\
    using System;\n\nnamespace MyCSharpApplication\n{\n    class Player\n    {\n \
    \       public string name;\n        public int age;\n        public string country;\n\
    \        public Player(string name, int age, string country)\n        {\n    \
    \        this.name = name;\n            this.age = age;\n            this.country\
    \ = country;\n        }\n        public Player(string name)\n        {\n     \
    \       this.name = name;\n        }\n    }\n}\n```\n\nIn the `Player` class,\
    \ you can see that now there are two parameterized constructors. The first constructor\
    \ is similar to the one in Example3 and it takes three parameters. The second\
    \ constructor takes one parameter. The constructor that is called when an object\
    \ is created depends on the call to the constructor. If the call contains one\
    \ `string` type parameter, the second constructor will be called. However, if\
    \ the call contains three parameters(`string`, `int`, `string`), the first constructor\
    \ would be called.\n\nMake the following changes in the `Program` class to see\
    \ difference between the calls to the two constructors in the `Player` class.\n\
    \n`Program.cs`\n```csharp\nusing System;\n\nnamespace MyCSharpApplication\n{\n\
