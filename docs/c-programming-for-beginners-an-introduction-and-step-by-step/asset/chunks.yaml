  trans: "\n\n# for 循环\n\n`for` 循环允许开发者编写一段代码，该代码将按照开发者指定的精确次数执行。当你确切知道代码需要通过的精确迭代次数时，这种循环是完美选择。例如，如果你想在屏幕上打印十次你的名字，`for\
    \ 循环`就是解决方案，因为你已经知道打印名字到屏幕上的这段代码将执行十次。要查看`for 循环`的运行情况，请查看本章的示例。\n\n### 示例 1:\n\
    \n```csharp\nusing System;\n\nnamespace MyCSharpApplication\n{\n    class Program\n\
    \    {\n        static void Main(string[] args)\n        {\n            for (int\
    \ i = 1; i<= 10; i++)\n            {\n                Console.WriteLine(\"Welcome\
    \ to C#\");\n            }\n            Console.Read();\n        }\n    }\n}\n\
    ```\n\n注意`for 循环`的语法；它以左圆括号开始。圆括号内有三个用分号隔开的表达式。第一个表达式 `i=1` 是初始化语句，意味着循环从 `i=1`\
    \ 开始。该表达式只求值一次。第二个表达式 `i<=10` 是条件语句，意味着循环将一直执行，直到该条件返回 `true`。在求值条件语句后，循环体（位于大括号内，大括号后是右圆括号）执行。圆括号内的最后一个表达式是\
    \ `i++`。这被称为迭代语句；每次执行循环体时，该语句都会执行，然后控制权再次转移到条件语句。循环持续执行，直到条件语句返回 `true`。在示例 1\
    \ 中，循环从 `i=1` 开始，并一直执行到 `i` 小于或等于十为止，每次执行递增 1。这意味着循环将执行 10 次。每次控制台都会打印语句 `\"Welcome\
    \ to C#\"`，因此输出将包含在屏幕上打印 10 次的 `\"Welcome to C#\"`。\n\n#### 输出 1:\n\n```text\n\
    Welcome to C#\nWelcome to C#\nWelcome to C#\nWelcome to C#\nWelcome to C#\nWelcome\
    \ to C#\nWelcome to C#\nWelcome to C#\nWelcome to C#\nWelcome to C#\n```\n\n##\
    \ 2- \"While\" 循环\n\n`while 循环`会一直执行，直到某个条件变为 `true`。当你不确切知道想要执行某段代码几次时，应该使用 `while\
    \ 循环`。相反，你希望循环执行到某个特定条件变为 `true` 或 `false`。在示例 2 中，我们将再次在屏幕上打印十次 `\"Welcome to\
    \ C#\"`，这次使用的是 `while 循环`。\n\n### 示例 2:\n\n```csharp\nusing System;\n\nnamespace\
    \ MyCSharpApplication\n{\n    class Program\n    {\n        static void Main(string[]\
    \ args)\n        {\n            int i = 1;\n            while (i<=10)\n      \
    \      {\n                Console.WriteLine(\"Welcome to C#\");\n            \
    \    i++;\n            }\n            Console.Read();\n        }\n    }\n}\n```\n\
    \n在示例 2 中，我们可以看到`while 循环`在圆括号内只有一个条件语句。这是因为`while 循环`并不知道需要执行多少次。它只知道，除非条件语句变为\
    \ `true`，否则它必须执行。如果你在条件语句中写 `true`，`while 循环`将永远执行下去。\n\n#### 输出 2:\n\n```text\n\
    Welcome to C#\nWelcome to C#\nWelcome to C#\nWelcome to C#\nWelcome to C#\nWelcome\
    \ to C#\nWelcome to C#\nWelcome to C#\nWelcome to C#\nWelcome to C#\n```\n\n##\
    \ 3- \"Do While\" 循环\n\n`do while 循环`的功能上与`while 循环`相似。它只依赖于条件语句。然而，与`while 循环`不同，`do\
    \ while 循环`至少执行一次。这是因为`do while 循环`的条件语句是在代码块结束时进行求值的。这样，在求值条件语句之前，代码块至少执行一次。示例\
    \ 3 演示了这一过程。\n\n### 示例 3:\n\n```csharp\nusing System;\n\nnamespace MyCSharpApplication\n\
    {\n    class Program\n    {\n        static void Main(string[] args)\n       \
    \ {\n            int i = 1;\n            do\n            {\n                Console.WriteLine(\"\
    Welcome to C#\");\n                i++;\n            }\n            while (i<=\
    \ 10) ;\n            Console.Read();\n        }\n    }\n}\n```\n\n在示例 3 中，你可以看到`do\
    \ while 循环`以 `do` 关键字开始，后面跟着代码块。在代码块的末尾你可以看到 `while` 关键字。在这里求值条件，但在到达此点之前，循环已经执行了一次。\n\
    \n#### 输出 3:\n\n```text\nWelcome to C#\n```\n\n## 4- \"Foreach\" 循环\n\n`foreach\
    \ 循环`遍历集合中的所有对象。在 C# 中，`foreach 循环`遍历字符串、数组，这些都是可枚举类型。\n\n### 示例 4:\n\n```csharp\n\
    using System;\n\nnamespace MyCSharpApplication\n{\n    class Program\n    {\n\
    \        static void Main(string[] args)\n        {\n            foreach (char\
    \ c in \"Welcome to C#\")\n            {\n                Console.WriteLine(c);\n\
    \            }\n            Console.Read();\n        }\n    }\n}\n```\n\n注意`foreach\
    \ 循环`的语法；它以左圆括号开始。圆括号内有两个用分号隔开的表达式。第一个表达式 `char c` 是初始化语句，意味着循环从 `char c` 开始。第二个表达式\
    \ `in \"Welcome to C#\"` 是集合语句，意味着循环将一直执行直到集合耗尽。在求值集合语句后，循环体（位于大括号内，大括号后是右圆括号）执行。\n\
    \n# 第 5 章：数组\n\n数组用于存储相同类型的多个值。它们存储在连续的内存位置中，这提高了效率。\n\n目录：\n*   数组语法\n*   一维数组\n\
    *   二维数组\n\n### 1- 数组语法\n\n数组具有以下语法：\n`type [] array-name = new type [size];`\n\
    \n数组以要存储的元素类型开始，后面跟着方括号，最后是数组名称。在此时，数组仅被声明，没有为它保留内存位置。要初始化数组，使用 `new` 关键字，后跟数组的类型。然后是方括号，在这些方括号内部指定数组的大小。\n\
    \n### 2- 一维数组\n\n"
- fmt: "\nAn array which stores elements in one direction, i.e. in the form of a column\
    \ or row, is called a one-dimensional array. The `salaries` array which we declared\
    \ in the last section was a one-dimensional array. A one-dimensional array is\
    \ initialized using one square bracket after the array type. To see a one-dimensional\
    \ array in action, have a look at the first example of this chapter.\n\n### Example1\n\
    \n```csharp\nusing System;\n\nnamespace MyCSharpApplication\n{\n    class Program\n\
    \    {\n        static void Main(string[] args)\n        {\n            int[]\
    \ salaries = new int[10] { 78, 15, 27, 87, 56, 74, 12, 36, 98, 41 };\n       \
    \     int a = salaries[0];\n            int b = salaries[5];\n            Console.WriteLine(a\
    \ + b);\n            salaries[0] = 25;\n            salaries[5] = 25;\n      \
    \      a = salaries[0];\n            b = salaries[5];\n            Console.WriteLine(a\
    \ + b);\n            Console.Read();\n        }\n    }\n}\n```\n\nIn `Example1`,\
    \ we initialized the array `salaries` and stored 10 elements in this array at\
    \ initialization time. This is one way to store elements in the array. You initialize\
    \ the array and, on the same line, you enter the elements inside the curly brackets\
    \ that follow after the square brackets containing the size. Inside the curly\
    \ bracket, you separate each element with a comma. An array has a zero based storage\
    \ index. This means that the first element of the array is stored at 0th index\
    \ while the last element is stored at `n-1st` index, where `n` is the size of\
    \ the array. To access the element at any index, you use the name of the array\
    \ followed by square brackets. Inside the square brackets, you mention the index.\
    \ For instance, in `Example1`, the element at the 0th index of the `salaries`\
    \ array is stored in integer variable `a`, while the element at the 5th index\
    \ is stored in variable `b`. On the console, the sum of these two variables is\
    \ printed. Then the array indexes zero and five are updated with value `25`. On\
    \ the console window, their sum is again printed, which now contains the updated\
    \ value. The output of the code in `Example1` is shown below.\n\n**Output1:**\n\
    ```\n152\n50\n```\n\nIn Chapter 4, we studied the `foreach` loop, which can be\
    \ used to iterate over any set or list of items. In addition to the `foreach`\
    \ loop, the `for` loop can also be used to iterate over an array. In `Example2`,\
    \ we shall see how an array can be iterated via `for` and `foreach` loops.\n\n\
    ### Example2\n\n```csharp\nusing System;\n\nnamespace MyCSharpApplication\n{\n\
    \    class Program\n    {\n        static void Main(string[] args)\n        {\n\
    \            int[] salaries = new int[10] { 78, 15, 27, 87, 56, 74, 12, 36, 98,\
    \ 41 };\n            for (int i = 0; i < 10; i++)\n            {\n           \
    \     Console.Write(salaries[i] + \" \");\n            }\n            Console.WriteLine();\n\
    \            foreach (int n in salaries)\n            {\n                Console.Write(n\
    \ + \" \");\n            }\n            Console.Read();\n        }\n    }\n}\n\
    ```\n\nIn `Example2`, the `salaries` array has again been initialized with some\
    \ random variables. We first iterated the array with a `for` loop, then we iterated\
    \ over the `salaries` array using a `foreach` loop. The output of the code in\
    \ `Example2` is as follows.\n\n**Output2:**\n```\n78 15 27 87 56 74 12 36 98 41\n\
    78 15 27 87 56 74 12 36 98 41\n```\n\n### 3- Two-dimensional Array\n\nA one-dimensional\
    \ array stores data in the form of a single column or row. A two-dimensional array,\
    \ often referred as an array of arrays, stores data in the form of multiple rows\
    \ and columns. Data is stored in the memory in the form of a matrix. To initialize\
    \ a two-dimensional array, you simply have to put a comma inside the square bracket\
    \ that follows after the type of the array. On the left side, after the `new`\
    \ keyword and inside the square brackets, you have to mention the number of rows\
    \ and columns that the array will contain. Rows and columns should be separated\
    \ by commas. Look at `Example3` to see two-dimensional arrays in action.\n\n###\
    \ Example3\n\n```csharp\nusing System;\n\nnamespace MyCSharpApplication\n{\n \
    \   class Program\n    {\n        static void Main(string[] args)\n        {\n\
    \            int[,] salaries = new int[2,3];\n            salaries[0,0] = 10;\
    \ // First row column\n            salaries[0,1] = 20; // First row column\n \
    \           salaries[0,2] = 30; // First row column\n            salaries[1,0]\
    \ = 40; // 2nd row column\n            salaries[1,1] = 50; // 2nd row column\n\
    \            salaries[1,2] = 60; // 2nd row column\n            for (int i = 0;\
    \ i < 2; i++)\n            {\n                for (int j = 0; j < 3; j++)\n  \
    \              {\n                    Console.Write(salaries[i, j] + \" \");\n\
    \                }\n                Console.WriteLine();\n            }\n    \
    \        Console.Read();\n        }\n    }\n}\n```\n\nIn `Example1`, we initialized\
    \ a two-dimensional array, `salaries`, with two rows and three columns. We then\
    \ accessed each index and stored some random values. To access a particular index\
    \ of a two-dimensional array, you write the name of the array followed by square\
    \ bracket. Inside the square brackets, you first enter the row number, comma,\
    \ and then the column number. To iterate over a two-dimensional array requires\
    \ nested `for` loops where the outer loop iterates over each row and the inner\
    \ loop iterates over each column. This is demonstrated in `Example3`. The output\
    \ of the code in `Example3` is as follows.\n\n**Output3:**\n```\n10 20 30 \n40\
    \ 50 60\n```\n\n### Exercise 5\n\n**Task:**\nUsing nested `for` loops, store the\
    \ table of 2, 3, 4, and 5 in a two-dimensional array and then display the elements\
    \ of the array on screen.\n\n**Solution**\n```csharp\nusing System;\n\nnamespace\
    \ MyCSharpApplication\n{\n    class Program\n    {\n        static void Main(string[]\
    \ args)\n        {\n            int[,] tables = new int[4,10];\n            for\
    \ (int i = 2; i < 6; i++)\n            {\n                for (int j = 0; j <\
    \ 10; j++)\n                {\n                    tables[i-2,j] = i * (j+1);\n\
    \                }\n            }\n            for (int i = 0; i < 4; i++)\n \
    \           {\n                for (int j = 0; j < 10; j++)\n                {\n\
    \                    Console.Write(tables[i, j] + \" \");\n                }\n\
    \                Console.WriteLine();\n            }\n            Console.Read();\n\
    \        }\n    }\n}\n```\n\n# Chapter 6: Objects and Classes\n\nIn the first\
    \ five chapters, we covered most of the basic C# programming concepts. From this\
    \ chapter onwards, we are going to study some of the advanced programming concepts,\
    \ starting with object oriented programming. In object oriented programming (OOP),\
    \ all the software components are viewed in the context of real world objects.\
    \ For instance, you are developing some car racing game; you will identify the\
    \ objects in the real world car racing. A driver can be an object, a car can be\
    \ another object, and steering is also an object. When you develop your game you\
    \ will create these objects in your program. These objects will interact with\
    \ each other, resulting in fully functional racing car game. This is just a crude\
    \ example of how modules are developed in OOP programming. OOP offers advantages\
    \ such as code modularity, usability, and maintainability.\n\nContents\n* Objects\
    \ and Classes\n* Constructor\n\n## 1- Objects and Classes\n\nAnything which has\
    \ some properties and can perform some functions is worthy of being implemented\
    \ as an object in an OOP. As aforementioned, a player in a racing car game can\
    \ be considered an object since it contains properties like a name, age, country,\
    \ etc. A player can also perform functions like starting the car, increasing the\
    \ speed, turning left, turning right, etc. A player is a perfect candidate for\
    \ being implemented as an object.\n\nBefore diving into the code, an important\
    \ distinction needs to be made here between a class and an object. A class is\
    \ similar to a blueprint. It has no physical existence in the memory. Class depicts\
    \ how the object looks. Multiple objects can be created from one class. An object,\
    \ on the other hand, has an actual physical existence in the memory. A class is\
    \ like a blueprint while an object is the house built according to that blueprint.\n\
    \nTo see how objects are created, have a look at the first example of this chapter.\n\
    \n### Example1\n\nAdd a new class to your project and name it `Player`. The contents\
    \ of the player class should be exactly like the following code snippet.\n\n```csharp\n\
    class Player\n{\n    string name;\n    int age;\n    string country;\n}\n```\n"
