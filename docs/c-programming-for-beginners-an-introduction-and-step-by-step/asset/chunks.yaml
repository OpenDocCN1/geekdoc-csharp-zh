    \ + p.country);\n            Console.WriteLine(p2.name ++\",\"+p2.age+\",\"+p2.country);\n\
    \            Console.Read();\n        }\n    }\n}\n```\n\nThe output of the code\
    \ in Example4 is follows:\n**Output4:**\nJoseph,35,Italy\nSusan,40,France\n\n\
