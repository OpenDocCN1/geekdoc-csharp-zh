    \ = price;\n            this.category = category;\n        }\n\n        public\
    \ void IncreasePrice()\n        {\n            price += 10;\n        }\n    }\n\
    }\n```\n\nThe `Product` class contains three member variables: `name`, `price`,\
    \ and `category`. The class contains a constructor which initializes these three\
    \ variables. After the constructor, we have added a method named `IncreasePrice`.\
    \ The syntax of a method is simple; it starts with an access modifier, which is\
    \ `public` in this case. After that, the return type of the method is mentioned.\
    \ A return type is the type of the value returned by the method. Since our `IncreasePrice`\
    \ method doesn’t return any value, we specified its return type as `void`. After\
    \ the return type, the name of the method is written (in our case, this is `IncreasePrice`).\
    \ The opening and closing round brackets contain parameters. Since we don’t want\
    \ our `IncreasePrice` method to accept any parameter, we left the brackets empty.\
