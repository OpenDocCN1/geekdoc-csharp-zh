    \ 类中，我们创建了一个类型为 `DisplayNameHandler` 的事件 `NameChanged`。与委托类似，事件被挂钩到方法上。事件可以执行与\
    \ `delegate` 签名相同的方法。当事件触发时，会执行一个或多个方法。\n\nOutput2:\n```text\nThis is an apple.\n\
