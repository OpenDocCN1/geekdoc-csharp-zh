    classes are implemented in the parent class, while traits that are specific to
    individual child classes are implemented in the respective child classes. For
    instance, take a parent product class and its child software and hardware product.
    Both software and hardware products have a name and price. Therefore, we can include
    both name and price properties in the parent product class. Classes that inherit
    the parent class have all the attributes of the parent class by default. However,
    software has no weight while hardware product has some weight. This means that
    the attribute weight is unique to hardware class; therefore, it cannot be implemented
    in the parent class. Similarly, we assume that software has a version number while
    hardware has no version number. Here, version is unique to the software class
    and cannot be implemented in the parent class. This scenario has been implemented
    in Example1.


