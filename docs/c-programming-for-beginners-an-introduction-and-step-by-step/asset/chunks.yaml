    In Example2, the “salaries” array has again been initialized with some random
    variables. We first iterated the array with a “for” loop, then we iterated over
    the “salaries” array using a “foreach” loop. The output of the code in Example2
    is as follows.


    Output2:


    78 15 27 87 56 74 12 36 98 41


    78 15 27 87 56 74 12 36 98 41


    3- Two-dimensional Array


    A one-dimensional array stores data in the form of a single column or row. A two-dimensional
    array, often referred as an array of arrays, stores data in the form of multiple
    rows and columns. Data is stored in the memory in the form of a matrix. To initialize
    a two-dimensional array, you simply have to put a comma inside the square bracket
    that follows after the type of the array. On the left side, after the new keyword
    and inside the square brackets, you have to mention the number of rows and columns
    that the array will contain. Rows and columns should be separated by commas. Look
    at Example3 to see two-dimensional arrays in action.


    Example3:


    using System;


    namespaceMyCSharpApplication


    {


    class Program


        {


    static void Main(string[] args)


            {


    int[,] salaries = new int [2,3];


    salaries[0,0] = 10; // First row first column


    salaries[0,1] = 20; // First row second column


    salaries[0, 2] = 30; // First row third column


    salaries[1, 0] = 40; // 2nd row first column


    salaries[1, 1] = 50; // 2nd row second column


    salaries[1, 2] = 60; // 2nd row third column


    for (inti = 0; i< 2; i++)


                {


    for (int j = 0; j < 3; j++)


                    {


    Console.Write(salaries[i, j]+"  ");


                    }


    Console.WriteLine();


                }


    Console.Read();


            }


        }


    }


    In Example1, we initialized a two-dimensional array, “salaries”, with two rows
    and three columns. We then accessed each index and stored some random integer
    values. To access a particular index of a two-dimensional array, you write the
    name of the array followed by the square bracket. Inside the square brackets,
    you first enter the row number, then comma, and then the column number. To iterate
    over a two-dimensional array requires nested “for” loops where the outer loop
    iterates over each row and the inner loop iterates over each column. This is demonstrated
    in Example3\. The output of the code in Example3 is as follows.


    Output3:


    10  20  30 


    40  50  60


