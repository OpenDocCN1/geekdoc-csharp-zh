    # Chapter 9: Events and Delegates


    In this chapter, we are going to study two very important concepts in C#: Delegates
    and Events. C#’s entire event handling mechanism is based on these two concepts.
    Delegates in C# are function pointers. They hold reference to a function. They
    provide decoupling between the calling function and the function being called.
    An event in C# is also a type of delegate. Events are used to invoke methods.
    For instance, when you click a button, an event fires which invokes all the methods
    associated with the event. In this chapter, we shall see these concepts in action.


    Contents


    *   Delegates


    *   Events


    1- Delegates


    Delegates are classes which invoke a method which is passed to its constructor.
    Delegates store references to the method which is passed to it as a delegate.
    The first example of this chapter demonstrates how a delegate is created and how
    it is used to reference a method.


    Example1:


    using System;


    namespaceMyCSharpApplication


    {


    public delegate intChangeIt(intnum);


    class Program


        {


    static void Main(string[] args)


            {


    ChangeIt c = square;


    Console.WriteLine("The square of 4 is: "+ c(4));


    Console.Read();


            }


    public static int square(intnum)


            {


    returnnum * num;


            }


        }


    }


    In Example1, we created a delegate, “ChangeIt”, by using the keyword “delegate”. 
    A delegate can only store references to methods that exactly match the signature
    of the delegate. For instance, in Example 1, the delegate signature is “intChangeit
    (intnum)”. This means that this delegate can call any method which accepts an
    integer type variable as a parameter and returns an integer type variable. In
    the “Program” class, we created a static method called “square”.  The signature
    of this method matches the signature of the “ChangeIt” delegate. Inside the “Main”
    method, we create a variable, “c”, of the delegate “ChangeIt” and assign it the
    method “square”. To invoke the method, we simply pass the parameter to variable
    “c”. For instance, if we pass 4 to variable “c”, the value returned would be 16
    because, internally, “c” would call the “square” method. We then display the returned
    value on the screen.


    Output1:


