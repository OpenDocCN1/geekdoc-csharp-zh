  trans: "\n\n每个程序都需要存储某些数据，并对这些数据执行某些功能。在 C# 中，数据存储在数据类型中，并使用 C# 运算符对数据进行操作。在本章中，我们将查看一些最常用的数据类型，以及对数据进行操作的运算符，帮助我们实现一些有意义的功能。\n\
    \n## 目录\n* C# 中的数据类型\n* C# 中的运算符\n\n## 1- C# 中的数据类型\n\n下表演示了每种数据类型的用法以及每个数据类型可以存储的数据范围。\n\
    \n| 类型 | 表示 | 范围 |\n| :--- | :--- | :--- |\n| bool | 布尔值 | 真 (True) 或 假 (False)\
    \ |\n| byte | 8 位无符号整数 | 0 到 255 |\n| char | 16 位 Unicode 字符 | U +0000 到 U +ffff\
    \ |\n| decimal | 128 位精确小数，具有 28-29 位有效数字 | (-7.9 x 1028 到 7.9 x 1028) / 100 到\
    \ 28 |\n| double | 64 位双精度浮点类型 | (+/-)5.0 x 10-324 到 (+/-)1.7 x 10308 |\n| float\
    \ | 32 位单精度浮点类型 | -3.4 x 1038 到 + 3.4 x 1038 |\n| int | 32 位符号整数类型 | -2,147,483,648\
    \ 到 2,147,483,647 |\n| long | 64 位符号整数类型 | -923,372,036,854,775,808 到 9,223,372,036,854,775,807\
    \ |\n| sbyte | 8 位符号整数类型 | -128 到 127 |\n| short | 16 位符号整数类型 | -32,768 到 32,767\
    \ |\n| uint | 32 位无符号整数类型 | 0 到 4,294,967,295 |\n| ulong | 64 位无符号整数类型 | 0 到 18,446,744,073,709,551,615\
    \ |\n| ushort | 16 位无符号整数类型 | 0 到 65,535 |\n\n表 1.0\n\n## 2- C# 中的运算符\n\n在这一节中，我们将对\
    \ C# 中的三类运算符进行概览：算术运算符、关系运算符和逻辑运算符。\n\n### 算术运算符\n\nC# 中的算术运算符的功能与现实生活中相同。这些运算符用于在\
    \ C# 中执行各种数学函数。算术运算符只能应用于数值类型和 `char` 数据类型的操作数。表 1.1 列出了这些运算符及其功能。\n\n| 运算符 |\
    \ 作用 |\n| :--- | :--- |\n| `+` | 加法和一元加 |\n| `-` | 减法和一元减 |\n| `*` | 乘法 |\n| `/`\
    \ | 除法 |\n| `%` | 取模 |\n| `++` | 递增数字 |\n| `+=` | 递增并赋值 |\n| `-=` | 递减并赋值 |\n\
    | `*=` | 乘法并赋值 |\n| `/=` | 除法并赋值 |\n| `%=` | 取模并赋值 |\n| `--` | 递减 |\n\n表 1.1\n\
    \n查看示例 1 以看到算术运算符的实际用法。\n\n（注：此处原文未提供示例 1 内容，但提到了输出结果）\n输出 1：\n加法：15\n减法：5\n乘法：50\n\
    除法：2\n取模：0\n\n### 关系运算符\n\n在 C# 中，关系运算符用于比较两个操作数。表 1.2 列出了关系运算符及其功能。\n\n| 运算符\
    \ | 作用 |\n| :--- | :--- |\n| `==` | 检查相等 |\n| `!=` | 检查不相等 |\n| `>` | 左侧大于 |\n\
    | `<` | 左侧小于 |\n| `>=` | 左侧大于等于 |\n| `<=` | 左侧小于等于 |\n\n表 1.2\n\n示例 2 演示了 C# 中关系运算符的使用。\n\
    \n```csharp\nusing System;\n\nnamespace MyApplication\n{\n    class Program\n\
    \    {\n        static void Main(string[] args)\n        {\n            int num1\
    \ = 10;\n            int num2 = 20;\n            if (num1 == num2)\n         \
    \   {\n                Console.WriteLine(\"num1 等于 num2\");\n            }\n \
    \           if (num1 != num2)\n            {\n                Console.WriteLine(\"\
    num1 不等于 num2\");\n            }\n            if (num1 > num2)\n            {\n\
    \                Console.WriteLine(\"num1 大于 num2\");\n            }\n       \
    \     if (num1 < num2)\n            {\n                Console.WriteLine(\"num1\
    \ 小于 num2\");\n            }\n            if (num1 >= num2)\n            {\n \
    \               Console.WriteLine(\"num1 大于等于 num2\");\n            }\n      \
    \      if (num1 <= num2)\n            {\n                Console.WriteLine(\"\
    num1 小于等于 num2\");\n            }\n            Console.Read();\n        }\n  \
    \  }\n}\n```\n\n在示例 2 中，两个整数类型变量 `num1` 和 `num2` 被实例化了一些值；然后，为了比较它们，所有的关系运算符都被顺序应用于它们。如果你无法理解\
    \ `if` 语句后面的圆括号，请担心，我们将在下一章详细讨论。示例 2 代码的输出如下：\n\n输出 2：\nnum1 不等于 num2\nnum1 小于\
    \ num2\nnum1 小于等于 num2\n\n### 逻辑运算符\n\n逻辑运算符仅作用于 `Boolean` 操作数。逻辑操作的结果是另一个值。表\
    \ 1.3 列出了运算符：\n\n| 运算符 | 作用 |\n| :--- | :--- |\n| `&` | 与 (AND) |\n| `\\|` | 或\
    \ (OR) |\n| `^` | 异或 (XOR) |\n| `&&` | 短路与 (Short Circuit AND) |\n| `!` | 一元非\
    \ (NOT) |\n| `&=` | 与并赋值\n| `\\|=` | 或并赋值 |\n| `^=` | 异或并赋值 |\n| `==` | 等于 |\n\
    | `?:` | 三元运算符用于 |\n\n任务：初始化三个整数。如果第一个整数等于第二个整数且都大于第三个整数，则将这三个数相乘；否则，将这三个数相加。显示结果。\n\
    \n"
- fmt: "\nLogic building lies at the core of every program. Logic building involves\
    \ making decisions. In our daily lives, we make decisions based on certain criteria.\
    \ For instance, if the weather is rainy, we decide not to play outside; if the\
    \ weather is foggy, we drive carefully. There are hundreds of small decisions\
    \ which we have to make every day. In the same way, a computer program has to\
    \ make decisions during execution. Based on those decisions, a particular piece\
    \ of code is executed, leaving some other piece of code unexecuted. For instance,\
    \ you might want your program to take input from the user about the weather and\
    \ then recommend if the user should play outside or not. In C#, this is done via\
    \ selection statements (also known as control statements). In this chapter we\
    \ are going to study C# selection statements.\n\n# Contents\n\n*   If/Else Statements\n\
    *   Switch Statements\n\n## 1- If/Else Statements\n\nThe `if` statement is used\
    \ to execute a piece of code if the `test-expression` entered in the body of the\
    \ statement evaluates to be true. `Example1` demonstrates the usage of `if` statements.\n\
    \n### Example1:\n\n```csharp\nusing System;\n\nnamespaceMyCSharpApplication\n\
    {\n    class Program\n    {\n        static void Main(string[] args)\n       \
    \ {\n            string weather = \"sunny\";\n            if (weather == \"rainy\"\
    )\n            {\n                Console.WriteLine(\"Don’t play outside, it’s\
    \ rainy.\");\n            }\n            if (weather == \"sunny\")\n         \
    \   {\n                Console.WriteLine(\"You can play outside, it’s sunny.\"\
    );\n            }\n            Console.Read();\n        }\n    }\n}\n```\n\nIn\
    \ `Example 1`, we have initialized a string type variable `weather` to `sunny`.\
    \ We have then used two `if` statements. The first `if` statement evaluates if\
    \ the variable `weather` contains the value `rainy`. This expression would return\
    \ false because the variable `weather` contains the string `sunny`. The control\
    \ would shift to the next `if` statement, where the comparison of the variable\
    \ `weather` will be made with the string `rainy`. This expression will return\
    \ true and the code block followed by this if statement will execute. The output\
    \ of `Example1` is shown as follows:\n\n**Output1:**\n\nYou can play outside,\
    \ it’s sunny.\n\nThere is a problem with using `if` statements. If the expression\
    \ in the first `if` statement returns true, the comparison with the proceeding\
    \ `if` statements will still be made. This is not desirable in some cases. For\
    \ instance what if we want that if `weather` is equal to `rainy`, the next `if`\
    \ statement which compares weather with `sunny`, should not execute? In such scenarios\
    \ we use `else` and `if/else` statements. `Example2` demonstrates this concept.\n\
    \n### Example2:\n\n```csharp\nusing System;\n\nnamespaceMyCSharpApplication\n\
    {\n    class Program\n    {\n        static void Main(string[] args)\n       \
    \ {\n            string weather = \"rainy\";\n            if (weather == \"rainy\"\
    )\n            {\n                Console.WriteLine(\"Don’t play outside, it’s\
    \ rainy.\");\n            }\n            else if (weather == \"sunny\")\n    \
    \        {\n                Console.WriteLine(\"You can play outside, it’s sunny.\"\
    );\n            }\n            else\n            {\n                Console.WriteLine(\"\
    Weather cannot be determined, try again.\");\n            }\n            Console.Read();\n\
    \        }\n    }\n}\n```\n\nIn `Example2`, the variable `weather` has been initialized\
    \ to `rainy`. Therefore, the first `if` statement would be executed. After the\
    \ `if` statement, we have used an `if/else` statement to evaluate if `weather`\
    \ is equal to `sunny`. But since the first `if` statement is true, the condition\
    \ in the `if/else` statement would not execute, unlike multiple `if` statements\
    \ where the conditions in proceeding statements are also evaluated, even if the\
    \ first `if` statement is true. You can use as many `if/else` blocks after the\
    \ `if` statement. You can also use one `else` statement after the `if` statement\
    \ if you have to make a selection between two code blocks based on one condition.\
    \ The output of `Example2` is as follows:\n\n**Output2:**\n\nDon’t play outside,\
    \ it’s rainy.\n\n## 2- Switch Statement\n\n`if/else` statements are good to use\
    \ if you have to make a small number of comparisons. However, in the case of a\
    \ larger number of comparisons, switch statements are a better alternative. To\
    \ see a `switch statement` at work, let’s jump straight to.\n\n### Example3:\n\
    \n```csharp\nusing System;\n\nnamespaceMyCSharpApplication\n{\n    class Program\n\
    \    {\n        static void Main(string[] args)\n        {\n            string\
    \ weather = \"cloudy\";\n            switch (weather)\n            {\n       \
    \         case \"rainy\":\n                    Console.WriteLine(\"Don’t play\
    \ outside, it’s rainy.\");\n                    break;\n                case \"\
    sunny\":\n                    Console.WriteLine(\"You can play outside, it’s sunny.\"\
    );\n                    break;\n                case \"cloudy\":\n           \
    \         Console.WriteLine(\"Wait but play outside, it’s cloudy.\");\n      \
    \              break;\n                default:\n                    Console.WriteLine(\"\
    Weather cannot be determined.\");\n                    break;\n            }\n\
    \            Console.Read();\n        }\n    }\n}\n```\n\nSwitch statements start\
    \ with `switch` keyword followed by a pair of opening and closing brackets. Inside\
    \ these brackets, we enter the variable we want to compare. In `Example3`, we\
    \ initialized `weather` and assigned it the string `cloudy`. Inside the switch\
    \ statement there are multiple cases. Each case has a string value followed by\
    \ a colon. Underneath every case, a code segment has been added. If the case matches\
    \ the variable, that code segment will be executed. If none of the case matches,\
    \ the `default` statement is executed. The output of the `Example3` is as follows:\n\
    \n**Output3:**\n\nWait but play outside, it’s cloudy.\n\n### Exercise 3\n\n**Task:**\n\
    \nInitialize an integer type variable to a random value. Write a switch statement\
    \ containing four cases. One of the case values should match the integer you initialized.\
    \ In each case statement code segment, display different gifts. Display PS4 as\
    \ a gift against the integer value.\n\n**Solution:**\n\n```csharp\nusing System;\n\
    using System.Diagnostics;\n\nnamespaceMyCSharpApplication\n{\n    class Program\n\
    \    {\n        static void Main(string[] args)\n        {\n            int lottery\
    \ = 45176;\n            switch (lottery)\n            {\n                case\
    \ 46781:\n                    Console.WriteLine(\"You won a mobile set.\");\n\
    \                    break;\n                case 45176:\n                   \
    \ Console.WriteLine(\"You won a PS4.\");\n                    break;\n       \
    \         case 74217:\n                    Debug.WriteLine(\"Sorry you won nothing.\"\
    );\n                    break;\n                case 74193:\n                \
    \    Debug.WriteLine(\"You won a cinema ticket\");\n                    break;\n\
    \                default:\n                    Console.WriteLine(\"Sorry you won\
    \ nothing.\");\n                    break;\n            }\n            Console.Read();\n\
    \        }\n    }\n}\n```\n\n# Chapter 4: Iteration Statements\n\nWhile writing\
    \ a program, you might want to repeatedly execute a particular piece of code.\
    \ One way is to write that piece of code the number of times you want to repeatedly\
    \ execute it. However, this approach is extremely unprofessional, resulting in\
    \ unnecessarily verbose code. To address this problem, iteration statements were\
    \ introduced. The concept of iteration statements dates back to the earliest programming\
    \ languages. Their syntax may differ in different languages, but the core concept\
    \ remains the same; they are meant to execute the code a number of times as specified\
