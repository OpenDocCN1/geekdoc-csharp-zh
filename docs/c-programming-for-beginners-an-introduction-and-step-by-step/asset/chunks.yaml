    }


    In the “Program”, we created the object of “Product” class using a parameterized
    constructor. The initial value of the variable “price” is set to 40\. We displayed
    this price on the console. Then we called the “IncreasePrice” method on the object
    “p” of the “Product” class. The value of the “price” variable is incremented by
    10 every time the “IncreasePrice” method is called. Since we called this method
    only once, the price is incremented by 10 only once; the new price would be 40+10
    = 50\. We then printed this new price on the console just to make sure the price
    was incremented. The output of the code in Example1 is as follows:


    Output1:


    The price of product Grapes is: 40


    The new price of product Grapes is: 50


    *   Passing Parameters to a Method


    Just like we have parameterized constructors, we also have parameterized methods.
    For instance, instead of increasing the price of the price variable by 10 every
    time, we can also pass a value of our choice. Types of parameters which a method
    can accept are mentioned in the round brackets that follow the method name. In
    the second example, we will see how we can increase the price by the value of
    our choice by passing the value as a parameter to the “IncreasePrice” method.


    Example2:


