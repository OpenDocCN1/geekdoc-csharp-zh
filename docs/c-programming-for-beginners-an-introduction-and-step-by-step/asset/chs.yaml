  \        public string category;\n        public Product(string name, int price,\
  \ string category)\n        {\n            this.name = name;\n            this.price\
  \ = price;\n            this.category = category;\n        }\n        public Product(string\
  \ name, int price)\n        {\n```\n\n\n\n\n\n```csharp\nthis.name = name;\nthis.price\
  \ = price;\n        \n    }\n}\n```\n\n#### Program 类\n\n```csharp\nusing System;\n\
  \nnamespace MyCSharpApplication\n{\n    class Program\n    {\n        static void\
  \ Main(string[] args)\n        {\n            Product p = new Product(\"Laptop\"\
  , 40, \"Electronics\");\n            Product p2 = new Product(\"Apple\", 2);\n \
  \           p2.category = \"Fruits\";\n            Console.WriteLine(p2.name +\"\
  ,\"+p2.price+\",\"++p2.category);\n            Console.WriteLine(p.name + \",\"\
  \ + p.price + \",\" + p.category);\n            Console.Read();\n        }\n   \
  \ }\n}\n```\n\n# 第 7 章：访问修饰符与方法\n\n在上一章中，我们学习了对象和类，以及如何通过构造函数初始化类的成员变量。我们还学习了不同类型的构造函数。在本章中，我们将学习对象如何通过执行某些功能。在面向对象编程（OOP）中，这是通过方法实现的。然而，在深入方法的细节之前，我们将学习另一个重要的概念：C#\
  \ 中的访问修饰符。\n\n## 目录\n\n* 访问修饰符\n* C# 中的方法\n\n## 1- 访问修饰符\n\n从本书开始开始，我们一直在变量上使用 `public`\
  \ 关键字。这是 C# 中提供的五种访问修饰符之一。访问修饰符控制对特定变量的访问。例如，标记为 `public` 的成员变量可以在任何地方访问。然而，标记为\
  \ `private` 的变量仅在它所属的类内部访问。表 1.0 包含了 C# 的五种访问修饰符及其功能。\n\n| 访问修饰符 | 功能 |\n| :---\
  \ | :--- |\n| public | 处处可访问 |\n| internal | 仅程序集内的类和友程序集可见 |\n| protected | 仅在类及其派生类中访问\
  \ |\n| private | 仅在类内部访问 |\n| Protected-internal | 在保护 或 internal 可访问的地方访问 |\n\n\
  ## 2- 方法\n\n如前所述，C# 的类和对象通过方法起作用。为了理解 C# 中的方法概念，让我们直接进入本章的第一个示例。\n\n### 示例 1：\n\n\
  向现有项目添加一个名为 `Product` 的新类。`Product` 类的内容类似于下面的代码段。\n\n**Product.cs**\n\n```csharp\n\
  using System;\n\nnamespace MyCSharpApplication\n{\n    class Product\n    {\n  \
  \      public string name;\n        public int price;\n        public string category;\n\
  \n        public Product(string name, int price, string category)\n        {\n \
  \           this.name = name;\n            this.price = price;\n            this.category\
  \ = category;\n        }\n\n        public void IncreasePrice()\n        {\n   \
  \         price += 10;\n        }\n    }\n}\n```\n\n`Product` 类包含三个成员变量：`name`、`price`\
  \ 和 `category`。该类包含一个初始化这三个变量的构造函数。在构造函数之后，我们添加了一个名为 `IncreasePrice` 的方法。方法的语法非常简单；它以访问修饰符开头，在本例中是\
  \ `public`。之后是了方法的返回类型。返回类型是方法返回的值的类型。由于我们的 `IncreasePrice` 方法不返回任何值，我们将其返回类型指定为\
  \ `void`。在返回类型之后，写了方法的名称（在本例中，这是 `IncreasePrice`）。圆括号内包含参数。由于我们不希望 `IncreasePrice`\
  \ 方法接受任何参数，我们留了空括号。请注意，方法的声明与构造函数的声明非常相似。事实上，构造函数是一个没有返回类型的方法。使用类的对象来调用方法，方法是在类对象后追加点运算符，然后是方法名。修改\
  \ `Program` 类，使其看起来像下面的代码段所示。\n\n**Program.cs**\n\n```csharp\nusing System;\n\n\
  namespace MyCSharpApplication\n{\n    class Program\n    {\n        static void\
  \ Main(string[] args)\n        {\n            Product p = new Product(\"Grapes\"\
  , 40, \"Food\");\n            Console.WriteLine(\"The price of product \"+p.name+\
  \ \" is: \"+p.price);\n            p.IncreasePrice();\n            Console.WriteLine(\"\
  The new price of product \" + p.name + \" is: \" + p.price);\n            Console.Read();\n\
  \        }\n    }\n}\n```\n\n在 `Program` 中，我们使用参数化构造函数创建了 `Product` 类的对象。变量 `price`\
  \ 的初始值设置为 40。我们在控制台上显示了这个价格。然后，我们在 `Product` 类的对象 `p` 上调用了 `IncreasePrice` 方法。每调用一次\
  \ `IncreasePrice` 方法，`price` 变量的值就会增加 10。由于我们只调用了一次此方法，所以价格只增加了 10；新价格将是 40+10 =\
  \ 50。然后我们在控制台上打印了这个新价格，以确保价格已经增加。示例 1 中代码的输出如下所示：\n\n**输出 1：**\n\n```\nThe price\
  \ of product Grapes is: 40\nThe new price of product Grapes is: 50\n```\n\n### 向方法传递参数\n\
  \n就像我们有参数化构造函数一样，我们也有参数化方法。例如，与其每次将 `price` 变量的价格增加 10，我们也可以传递我们的选择。\n\n**示例 2：**\n\
  \n在第二个示例中，我们将看到如何通过传递一个值来增加价格。`IncreasePrice` 方法可以接受的参数类型在括号中提到。\n\n```csharp\n\
