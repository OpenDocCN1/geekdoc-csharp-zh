  \ 和 `Pentagon`。创建带参数的构造函数来初始化 `Triangle` 和 `Pentagon` 类中的变量名。这些类将实现它们自己的 `DisplayName`\
  \ 方法。使用测试类（如 `Program.cs`）展示在此场景下如何实现多态。\n\n### 解决方案\n\n#### Shape 类\n```csharp\n\
  using System;\n\nnamespace MyCSharpApplication\n{\n    class Shape\n    {\n    \
  \    public string name;\n        public virtual void DisplayName()\n        {\n\
