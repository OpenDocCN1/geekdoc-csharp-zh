  \ 9 章：事件与委托\n\n在本章中，我们将学习 C# 中的两个重要概念：`Delegates`（委托）和 `Events`（事件）。C# 的事件处理机制基于这两个概念。C#\
  \ 中的 `Delegates` 是函数指针。它们持有对函数的引用。它们在调用函数和被调用函数之间提供了解耦。C# 中的 `event` 也是一种 `delegate`\
  \ 类型。`Events` 用于调用方法。例如，当你点击按钮时，会触发一个事件，该事件会调用所有与该事件相关的方法。在本章中，我们将看到这些概念的运作。\n\n\
  ### 目录\n* 委托\n* 事件\n\n## 1- 委托\n\n委托是用于调用传递给其构造方法的类。委托存储传递给它的方法的引用。本章的第一个示例演示了如何创建委托以及如何使用它来引用方法。\n\
  \n示例 1\n```csharp\nusing System;\n\nnamespace MyCSharpApplication\n{\n    public\
  \ delegate int ChangeIt(int num);\n    class Program\n    {\n        static void\
  \ Main(string[] args)\n        {\n            ChangeIt c = square;\n           \
  \ Console.WriteLine(\"The square of 4 is: \"+ c(4));\n            Console.Read();\n\
  \        }\n        public static int square(int num)\n        {\n            return\
  \ num * num;\n        }\n    }\n}\n```\n\n在 `Example1` 中，我们使用 `delegate` 关键字创建了一个委托\
  \ `ChangeIt`。委托只能存储与委托签名完全匹配的方法引用。例如，在示例 1 中，委托的签名是 `ChangeIt(int num)`。这意味着该委托可以调用任何接受整数类型变量作为参数并返回整数类型变量的方法。在\
  \ `Program` 类中，我们创建了一个名为 `square` 的静态方法。该方法的签名与 `ChangeIt` 委托的签名匹配。在 `Main` 方法内部，我们创建了一个委托类型\
  \ `ChangeIt` 的变量 `c` 并赋值赋值方法 `square`。要调用该方法，我们只需将参数传递给变量 `c`。例如，如果我们向变量 `c` 传递\
  \ 4，返回的值将是 16，因为在内部 `c` 会调用 `square` 方法。然后我们在屏幕上显示返回的值。\n\nOutput1:\n```text\nThe\
  \ square of 4 is: 16\n```\n\n## 2- 事件\n\n事件也是 `delegate` 的一种类型，但在声明时，在委托名称之前添加了\
  \ `event` 关键字。与委托类似，事件被挂钩到方法上。事件可以执行与事件签名相同的方法。示例 2 演示了如何将方法挂钩到事件以及当事件触发时如何调用这些方法。\n\
  \n示例 2\n```csharp\nusing System;\n\nnamespace MyCSharpApplication\n{\n    public\
  \ delegate void DisplayNameHandler();\n    class Program\n    {\n        public\
  \ static event DisplayNameHandler NameChanged;\n        static void Main(string[]\
  \ args)\n        {\n            NameChanged += DisplayFruit;\n            NameChanged\
  \ += DisplayAnimal;\n            NameChanged += DisplayFlower;\n            NameChanged\
  \ += DisplayColor;\n            NameChanged.Invoke();\n            Console.Read();\n\
  \        }\n        public static void DisplayFruit()\n        {\n            Console.WriteLine(\"\
  This is an apple.\");\n        }\n        public static void DisplayAnimal()\n \
  \       {\n            Console.WriteLine(\"This is a lion.\");\n        }\n    \
  \    public static void DisplayFlower()\n        {\n            Console.WriteLine(\"\
  This is a rose.\");\n        }\n        public static void DisplayColor()\n    \
  \    {\n            Console.WriteLine(\"This is red.\");\n        }\n    }\n}\n\
  ```\n\n在示例 2 中，我们创建了一个委托 `DisplayNameHandler`。在 `Program` 类中，我们创建了一个类型为 `DisplayNameHandler`\
  \ 的事件 `NameChanged`。与委托类似，事件被挂钩到方法上。事件可以执行与 `delegate` 签名相同的方法。当事件触发时，会执行一个或多个方法。\n\
  \nOutput2:\n```text\nThis is an apple.\nThis is a lion.\nThis is a rose.\nThis is\
  \ red.\n```\n\n\n\n\n```csharp\n{\n    Calculation c = Sum;\n    c(10, 5);\n   \
  \ Console.WriteLine(c(10, 5));\n    c += Subtract;\n    Console.WriteLine(c(10,\
  \ 5));\n    Console.Read();\n}\npublic static int Sum(int num1, int num2)\n{\n \
  \   return num1 + num2;\n}\npublic static int Subtract (int num1, int num2)\n{\n\
  \    return num1 - num2;\n}}\n```\n\n# 第 10 章：多线程\n\n到此为止，我们一直在处理单线程应用程序，程序遵循单一的执行路径，并且在特定时刻只执行一段代码。这种方法适用于简单的控制台应用程序。然而，在高级\
  \ GUI 应用程序中，单线程执行会导致无响应和执行延迟。考虑一个 Windows 表单应用程序，在显示在表单上之前必须获取数据。在应用程序获取数据期间，用户在表单的前端无法进行任何操作。如果数据库很大，获取数据将花费更多时间，导致应用程序的前端表现出无响应状态。多线程是解决此类问题的方案。在本章中，我们将学习如何创建线程以及它们如何协同工作以实现异步程序执行。\n\
  \n## 目录\n\n* 什么是线程？\n* C# 中的线程创建\n* 线程连接 (Join) 与睡眠 (Sleep)\n\n## 1- 什么是线程？\n\n\
  线程是执行的最小单元。线程运行在进程内部。进程保留了操作系统资源以及一个独占的执行环境。一个进程可以拥有一个或多个线程。在单线程应用程序中，只有一个线程在进程内运行，对所有进程资源和执行环境具有独占访问权限。在多线程应用程序中，多个线程在进程内运行，它们共享多个进程资源，特别是内存和执行环境。资源的共享解决了引入中解释的无响应问题。在多线程应用程序中，一个线程可以从数据库获取数据并存储在共享内存中，而第二个线程可以同时在应用程序的前端显示获取的数据。\n\
  \n## 2- C# 中的线程创建\n\n在 C# 中创建线程是一个极其简单的过程。你只需要创建一个 `Thread` 类对象。在 `Thread` 类的构造函数中，传递你想要在单独线程中运行的方法委托。接下来，简单地对你创建的对象调用\
  \ `Start` 方法即可。本章的第一个示例详细演示了线程创建和执行过程。请看它。\n\n### 示例 1：\n\n```csharp\nusing System;\n\
  using System.Threading;\nnamespace MyCSharpApplication\n{\nclass Program\n{\n  \
  \  static void Main(string[] args)\n    {\n        Thread t1 = new Thread(DisplayTwo);\n\
  \        Thread t2 = new Thread(DisplayThree);\n        t1.Start();\n        t2.Start();\n\
  \        for (int i = 0; i< 100; i++)\n        {\n            Console.Write(\"1\"\
  );\n        }\n        Console.Read();\n    }\n    static void DisplayTwo()\n  \
  \  {\n        for (int i = 0; i< 100; i++)\n        {\n            Console.Write(\"\
  2\");\n        }\n    }\n    static void DisplayThree()\n    {\n        for (int\
  \ i = 0; i< 100; i++)\n        {\n            Console.Write(\"3\");\n        }\n\
  \    }\n}\n}\n```\n\n要在程序中执行与线程相关的任务，你需要在代码中导入 `System` 和 `System.Threading` 命名空间。C#\
  \ 运行时默认为每个程序创建一个线程。这就是运行 `Main` 方法的线程。在示例 2 中，在 `Main` 方法内部，我们创建了两个 `Thread` 类对象。这些对象被命名为\
  \ `t1` 和 `t2`。在第一个对象 `t1` 的构造函数中，我们传递了 `DisplayTwo` 方法委托。该方法在控制台上显示 100 次数字“2”。该方法在\
  \ `Main` 方法之后立即定义。同样，在 `t2` 对象的构造函数中，调用了 `DisplayThree` 方法。该方法在屏幕上显示 100 次数字“3”。在\
  \ `Main` 方法内部初始化 `t1` 和 `t2` 后，对这些对象调用了 `Start` 方法。在线程对象上调用 `Start` 会创建一个新的执行路径，该路径与已执行的线程并行运行。在此时刻，有三个线程正在同时运行：主线程（正在运行\
  \ `Main` 方法）以及 `t1` 和 `t2` 线程（正在运行 `DisplayTwo` 和 `DisplayThree` 方法）。这意味着现在我们有三个执行路径正在同时执行。这三条路径同时尝试在屏幕上打印数字“1”、“2”和“3”，每个\
  \ 100 次。示例 1 代码的输出如下：\n\n#### 输出 1\n321231231313132133332212312133223122332213223121121212131313111112122333312312313232321223212123322311233213312312233123112222222222222222222222222222222222222222222222222222。\n\
  \n## 3- 线程连接 (Join) 与睡眠 (Sleep)\n\n在前节中，我们学习了多个线程如何同时执行。如果你想让一个线程在继续之前完成执行怎么办？要等待一个对象完成执行，调用该对象的\
  \ `Join` 方法。同样，如果你想让线程停止一段时间，可以在线程类上调用 `Sleep` 方法。该方法接受毫秒或 `TimeSpan` 对象作为参数。\n\n\
  为了直观看到这一概念，请看第二个示例。\n\n 示例 2：\n\n```csharp\nusing System;\nusing System.Threading;\n\
  namespace MyApplication\n{\nclass Program\n{\n    static void Main(string[] args)\n\
  \    {\n        Thread t1 = new Thread(DisplayTwo);\n        t1.Start();\n     \
  \   t1.Join();\n        Console.WriteLine(\"=========================\");\n    \
  \    for (int i = 0; i< 100; i++)\n        {\n            Console.Write(\"1\");\n\
  \            if (i+1 == 50)\n            {\n                Console.WriteLine(\"\
  \\nThread Sleeps for 5 seconds...\");\n                Thread.Sleep(5000);\n   \
  \         }\n        }\n        Console.Read();\n    }\n    static void DisplayTwo()\n\
  \    {\n        for (int i = 0; i< 100; i++)\n        {\n            Console.Write(\"\
  2\");\n        }\n    }\n}\n}\n```\n\n#### 输出 2\n2222222222222222222222222222222222222222222222222222222222222222222222222222222222222222222222222222\n\
  =========================\n11111111111111111111111111111111111111111111111111\n\
  Thread Sleeps for 5 seconds...\n11111111111111111111111111111111111111111111111111\n\
  \n在屏幕上，你会看到这些数字是按顺序排列的，尽管我们先调用了 `DisplayTwo` 方法。这是因为屏幕一次只能被一个线程访问。\n\n\n\n\n\n###\
  \ 在“Main”方法内部创建两个线程\n其中一个线程应该调用方法，在控制台上显示 100 次“+”。另一个方法应该在屏幕上显示 100 次“X”。“Main”方法应该等待这两个线程都完成，然后在屏幕上显示\
  \ 20 次“#”。之后它应该等待 3 秒，再次显示“#”，这次显示 60 次。最后，再等待 3 秒，再显示 20 次“#”。\n\n### Solution\n\
  \n```csharp\nusing System;\nusing System.Threading;\n\nnamespace MyCSharpApplication\n\
  {\n    class Program\n    {\n        static void Main(string[] args)\n        {\n\
  \            Thread t1 = new Thread(DisplayPlus);\n            Thread t2 = new Thread(DisplayMultiply);\n\
  \n            t1.Start();\n            t2.Start();\n\n            t1.Join();\n \
  \           t2.Join();\n\n            Console.WriteLine(\"\\n==========================================\"\
  );\n            for (int i = 0; i < 100; i++)\n            {\n                Console.Write(\"\
  +\");\n                if (i + 1 == 20)\n                {\n                   \
  \ Console.WriteLine(\"\\nThread Sleeps here for 3 seconds...\");\n             \
  \       Thread.Sleep(3000);\n                }\n                if (i + 1 == 80)\n\
  \                {\n                    Console.WriteLine(\"\\nThread Sleeps here\
  \ for 3 seconds...\");\n                    Thread.Sleep(3000);\n              \
  \  }\n            }\n            Console.Read();\n        }\n\n        static void\
  \ DisplayPlus()\n        {\n            for (int i = 0; i < 100; i++)\n        \
  \    {\n                Console.Write(\"+\");\n            }\n        }\n\n    \
  \    static void DisplayMultiply()\n        {\n            for (int i = 0; i < 100;\
  \ i++)\n            {\n                Console.Write(\"X\");\n            }\n  \
  \      }\n    }\n}\n```\n\n# 作者其他书籍\n\n#### Java 编程\n[http://www.linuxtrainingacademy.com/java-programming]\n\
