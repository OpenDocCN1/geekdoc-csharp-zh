- "# C# 初学者指南：C# 编程入门指南与步步指南\n\n\n\n\n\n\n\n\n\n# 引言\n\n感谢阅读《C# 初学者编程》，我我想送给你一份免费的《7\
  \ 个不为人知的 C# 编程技巧》。\n\n要下载你的副本请访问：[`www.linuxtrainingacademy.com/7-tricks`](http://www.linuxtrainingacademy.com/7-tricks)\n\
  \n# 第一章：创建你的第一个 C# 程序\n\nC# 是微软顶尖的编程语言，是微软 .NET 框架不可或缺的一部分。C# 是一种完全面向对象且类型安全的语言。如果你正希望使用微软的编程技术开发应用程序，那么\
  \ C# 是最佳起点。目前 C# 正用于开发 ASP.NET Web 应用程序、Windows Forms 和基于 WPF 的桌面应用程序。随着智能手机的出现，C#\
  \ 也用于 Windows 手机应用和 Android 应用程序开发。\n\n本书介绍了 C# 语言核心特性的概述。阅读完本书后，你将能够上手微软的高级编程技术，如\
  \ ASP.NET、WCF、WPF 和 Windows Phone。本书的第一章解释了如何安装 IDE（集成开发环境）以及如何创建你的第一个 C# 应用程序。\n\
  \n## 内容\n\n- 安装 IDE\n- 创建并运行第一个应用程序\n\n## 1- 安装 IDE\n\n毫无疑问，开发 C# 应用程序的最佳软件是微软的\
  \ Visual Studio 集成环境。它包含了构建专业 C# 应用程序所需的一切。然而，Visual Studio 的完整版是商业性的。在书中，我们将不花一分钱开发\
  \ C# 应用程序。为了实现这一点，我们将下载精简版的 `Visual Studio`，它是完全免费的。该软件提供的功能足够开发基础 C# 应用程序。\n\n\
  - 访问 [`www.linuxtrainingacademy.com/7-tricks`](http://www.linuxtrainingacademy.com/7-tricks)\n\
  - 向下滚动页面并找到 [`www.linuxtrainingacademy.com/7-tricks/products/visual-studio.aspx`](http://www.linuxtrainingacademy.com/7-tricks/products/visual-studio.aspx)\n\
  - 出现的页面将要求你使用 `Microsoft Account` 登录。\n- 如果你没有，请在该页面上注册。\n- 创建 ID 后，选择最新版本的 `Visual\
  \ Studio`。\n- 将下载 `express_full.exe`。\n- 打开 `express_full.exe`。出现安装向导。同意条款和隐私政策并点击\
  \ `Install` 按钮。\n- 完成。向导将下载开发应用程序所需的组件。\n\n## 2- 创建并运行第一个应用程序\n\n要创建你的第一个 C# 应用程序，请打开上一节下载的\
  \ `Visual Studio`。按照以下步骤操作：\n\n- 从菜单栏选择 `File` => `New` => `Project`。\n- 在出现的选项中选择\
  \ `Console Application`。\n- 在 `Name` 和 `Location` 文本框输入你选择的名称和位置。勾选 `Create directory\
  \ for solution` 并点击 `OK` 按钮。\n\n一旦点击 `OK` 按钮，visual studio 会自动创建一个程序。将默认代码段替换为：\n\
  \n```csharp\nusing System;\n\nnamespace MyFirstApplication\n{\n    class Program\n\
  \    {\n        static void Main(string[] args)\n        {\n            Console.WriteLine(\"\
  Welcome to C#\");\n            Console.Read();\n        }\n    }\n}\n```\n\n- 点击工具栏中绿色三角形旁的\
  \ `Start` 按钮。你将在控制台中看到代码的输出。你在 `Console.WriteLine` 方法中写的字符串“Welcome to C# 显示在屏幕上。\n\
  \n在代码中，请记住 C# 中的一切都发生在类内部。`Program` 类是代码执行的起点，因为它包含了 `Main` 方法。当你运行程序时，`static void\
  \ Main (string [] args)` 方法会被调用。执行的第一条语句是 `Main` 方法内部的第一条语句。要在现有项目中添加新类，只需右键点击项目名称\
  \ => Add => `Class`。\n\n你已经完成了第一章。在本章中，你学习了如何安装用于开发 C# 应用程序的 IDE。你还开发了第一个 C# 应用程序，它在控制屏幕上打印一个字符串。在下一章中，我们将看看\
  \ C# 程序可以存储什么类型的数据以及可以对这些数据进行哪些操作。\n\n\n\n\n\n每个程序都需要存储某些数据，并对这些数据执行某些功能。在 C# 中，数据存储在数据类型中，并使用\
  \ C# 运算符对数据进行操作。在本章中，我们将查看一些最常用的数据类型，以及对数据进行操作的运算符，帮助我们实现一些有意义的功能。\n\n## 目录\n* C#\
  \ 中的数据类型\n* C# 中的运算符\n\n## 1- C# 中的数据类型\n\n下表演示了每种数据类型的用法以及每个数据类型可以存储的数据范围。\n\n\
  | 类型 | 表示 | 范围 |\n| :--- | :--- | :--- |\n| bool | 布尔值 | 真 (True) 或 假 (False) |\n\
  | byte | 8 位无符号整数 | 0 到 255 |\n| char | 16 位 Unicode 字符 | U +0000 到 U +ffff |\n\
  | decimal | 128 位精确小数，具有 28-29 位有效数字 | (-7.9 x 1028 到 7.9 x 1028) / 100 到 28 |\n\
  | double | 64 位双精度浮点类型 | (+/-)5.0 x 10-324 到 (+/-)1.7 x 10308 |\n| float | 32 位单精度浮点类型\
  \ | -3.4 x 1038 到 + 3.4 x 1038 |\n| int | 32 位符号整数类型 | -2,147,483,648 到 2,147,483,647\
  \ |\n| long | 64 位符号整数类型 | -923,372,036,854,775,808 到 9,223,372,036,854,775,807\
  \ |\n| sbyte | 8 位符号整数类型 | -128 到 127 |\n| short | 16 位符号整数类型 | -32,768 到 32,767\
  \ |\n| uint | 32 位无符号整数类型 | 0 到 4,294,967,295 |\n| ulong | 64 位无符号整数类型 | 0 到 18,446,744,073,709,551,615\
  \ |\n| ushort | 16 位无符号整数类型 | 0 到 65,535 |\n\n表 1.0\n\n## 2- C# 中的运算符\n\n在这一节中，我们将对\
  \ C# 中的三类运算符进行概览：算术运算符、关系运算符和逻辑运算符。\n\n### 算术运算符\n\nC# 中的算术运算符的功能与现实生活中相同。这些运算符用于在\
  \ C# 中执行各种数学函数。算术运算符只能应用于数值类型和 `char` 数据类型的操作数。表 1.1 列出了这些运算符及其功能。\n\n| 运算符 | 作用\
  \ |\n| :--- | :--- |\n| `+` | 加法和一元加 |\n| `-` | 减法和一元减 |\n| `*` | 乘法 |\n| `/` |\
  \ 除法 |\n| `%` | 取模 |\n| `++` | 递增数字 |\n| `+=` | 递增并赋值 |\n| `-=` | 递减并赋值 |\n| `*=`\
  \ | 乘法并赋值 |\n| `/=` | 除法并赋值 |\n| `%=` | 取模并赋值 |\n| `--` | 递减 |\n\n表 1.1\n\n查看示例\
  \ 1 以看到算术运算符的实际用法。\n\n（注：此处原文未提供示例 1 内容，但提到了输出结果）\n输出 1：\n加法：15\n减法：5\n乘法：50\n除法：2\n\
  取模：0\n\n### 关系运算符\n\n在 C# 中，关系运算符用于比较两个操作数。表 1.2 列出了关系运算符及其功能。\n\n| 运算符 | 作用 |\n\
  | :--- | :--- |\n| `==` | 检查相等 |\n| `!=` | 检查不相等 |\n| `>` | 左侧大于 |\n| `<` | 左侧小于\
  \ |\n| `>=` | 左侧大于等于 |\n| `<=` | 左侧小于等于 |\n\n表 1.2\n\n示例 2 演示了 C# 中关系运算符的使用。\n\n\
  ```csharp\nusing System;\n\nnamespace MyApplication\n{\n    class Program\n    {\n\
  \        static void Main(string[] args)\n        {\n            int num1 = 10;\n\
  \            int num2 = 20;\n            if (num1 == num2)\n            {\n    \
  \            Console.WriteLine(\"num1 等于 num2\");\n            }\n            if\
  \ (num1 != num2)\n            {\n                Console.WriteLine(\"num1 不等于 num2\"\
  );\n            }\n            if (num1 > num2)\n            {\n               \
  \ Console.WriteLine(\"num1 大于 num2\");\n            }\n            if (num1 < num2)\n\
  \            {\n                Console.WriteLine(\"num1 小于 num2\");\n         \
  \   }\n            if (num1 >= num2)\n            {\n                Console.WriteLine(\"\
  num1 大于等于 num2\");\n            }\n            if (num1 <= num2)\n            {\n\
  \                Console.WriteLine(\"num1 小于等于 num2\");\n            }\n       \
  \     Console.Read();\n        }\n    }\n}\n```\n\n在示例 2 中，两个整数类型变量 `num1` 和 `num2`\
  \ 被实例化了一些值；然后，为了比较它们，所有的关系运算符都被顺序应用于它们。如果你无法理解 `if` 语句后面的圆括号，请担心，我们将在下一章详细讨论。示例\
  \ 2 代码的输出如下：\n\n输出 2：\nnum1 不等于 num2\nnum1 小于 num2\nnum1 小于等于 num2\n\n### 逻辑运算符\n\
  \n逻辑运算符仅作用于 `Boolean` 操作数。逻辑操作的结果是另一个值。表 1.3 列出了运算符：\n\n| 运算符 | 作用 |\n| :--- | :---\
  \ |\n| `&` | 与 (AND) |\n| `\\|` | 或 (OR) |\n| `^` | 异或 (XOR) |\n| `&&` | 短路与 (Short\
  \ Circuit AND) |\n| `!` | 一元非 (NOT) |\n| `&=` | 与并赋值\n| `\\|=` | 或并赋值 |\n| `^=`\
  \ | 异或并赋值 |\n| `==` | 等于 |\n| `?:` | 三元运算符用于 |\n\n任务：初始化三个整数。如果第一个整数等于第二个整数且都大于第三个整数，则将这三个数相乘；否则，将这三个数相加。显示结果。\n\
  \n\n\n\n\n逻辑构建是每个程序的核心。逻辑构建涉及做出决定。在日常生活中，我们根据某些标准做出决定。例如，如果天气下雨，我们就决定不在外面玩；如果天气大雾天，我们就会小心开车。我们每天必须做成数百个微小的决定。同样，计算机程序在执行过程中也必须做出决定。根据这些决定，特定的代码将被执行，而另一些代码则不执行。例如，你可能希望程序从用户那里获取关于天气的输入，然后建议用户是否可以在外面玩。在\
  \ C# 中，这是通过选择语句（也称为控制语句）实现的。在本章中，我们将学习 C# 选择语句。\n\n# 目录\n\n*   If/Else 语句\n*   Switch\
  \ 语句\n\n## 1- If/Else 语句\n\n`if` 语句用于在语句体中输入的 `test-expression` 求值为真时执行一段代码。`Example1`\
  \ 展示了 `if` 语句的用法。\n\n### Example1:\n\n```csharp\nusing System;\n\nnamespaceMyCSharpApplication\n\
  {\n    class Program\n    {\n        static void Main(string[] args)\n        {\n\
  \            string weather = \"sunny\";\n            if (weather == \"rainy\")\n\
  \            {\n                Console.WriteLine(\"Don’t play outside, it’s rainy.\"\
  );\n            }\n            if (weather == \"sunny\")\n            {\n      \
  \          Console.WriteLine(\"You can play outside, it’s sunny.\");\n         \
  \   }\n            Console.Read();\n        }\n    }\n}\n```\n\n在 `Example 1` 中，我们初始化了一个字符串类型的变量\
  \ `weather` 为 `sunny`。然后我们使用了两个 `if` 语句。第一个 `if` 语句判断变量 `weather` 是否包含值 `rainy`。该表达式将返回\
  \ false，因为变量 `weather` 包含字符串 `sunny`。控制流将转移到下一个 `if` 语句，在那里将对变量 `weather` 与字符串 `rainy`\
  \ 进行比较。该表达式将返回 true，紧随其后的 `if` 语句后的代码块将执行。`Example1` 的输出显示所示：\n\n**Output1:**\n\n\
  You can play outside, it’s sunny.\n\n使用 `if` 语句存在一个问题。如果第一个 `if` 语句中的表达式返回真，仍然会与后续的\
  \ `if` 语句进行比较。这在某些情况下是不理想的。例如，如果我们希望当 `weather` 等于 `rainy` 时，比较 `weather` 与 `sunny`\
  \ 的下一个 `if` 语句不执行怎么办？在这种情况下，我们使用 `else` 和 `if/else` 语句。`Example2` 展示了这一概念。\n\n###\
  \ Example2:\n\n```csharp\nusing System;\n\nnamespaceMyCSharpApplication\n{\n   \
  \ class Program\n    {\n        static void Main(string[] args)\n        {\n   \
  \         string weather = \"rainy\";\n            if (weather == \"rainy\")\n \
  \           {\n                Console.WriteLine(\"Don’t play outside, it’s rainy.\"\
  );\n            }\n            else if (weather == \"sunny\")\n            {\n \
  \               Console.WriteLine(\"You can play outside, it’s sunny.\");\n    \
  \        }\n            else\n            {\n                Console.WriteLine(\"\
  Weather cannot be determined, try again.\");\n            }\n            Console.Read();\n\
  \        }\n    }\n}\n```\n\n在 `Example2` 中，变量 `weather` 被初始化为 `rainy`。因此，将执行第一个\
  \ `if` 语句。在 `if` 语句之后，我们使用 `if/else` 语句来判断 `weather` 是否等于 `sunny`。但由于第一个 `if` 语句为真，`if/else`\
  \ 语句中的条件将不会执行，这与多个 `if` 语句不同，在多个 `if` 语句中，即使第一个 `if` 为真，后续语句中的条件也会被评估。你可以在 `if`\
  \ 语句之后使用多个 `if/else` 块。如果你需要根据一个条件在两个代码块之间进行选择，也可以在 `if` 语句之后使用一个 `else` 语句。`Example2`\
  \ 的输出如下：\n\n**Output2:**\n\nDon’t play outside, it’s rainy.\n\n## 2- Switch Statement\n\
  \n如果你需要进行少量的比较，`if/else` 语句很好用。但在比较次数较的情况下，`switch` 语句是更好的替代方案。为了看到 `switch statement`\
  \ 的工作原理，让我们直接来看。\n\n### Example3:\n\n```csharp\nusing System;\n\nnamespaceMyCSharpApplication\n\
  {\n    class Program\n    {\n        static void Main(string[] args)\n        {\n\
  \            string weather = \"cloudy\";\n            switch (weather)\n      \
  \      {\n                case \"rainy\":\n                    Console.WriteLine(\"\
  Don’t play outside, it’s rainy.\");\n                    break;\n              \
  \  case \"sunny\":\n                    Console.WriteLine(\"You can play outside,\
  \ it’s sunny.\");\n                    break;\n                case \"cloudy\":\n\
  \                    Console.WriteLine(\"Wait but play outside, it’s cloudy.\");\n\
  \                    break;\n                default:\n                    Console.WriteLine(\"\
  Weather cannot be determined.\");\n                    break;\n            }\n \
  \           Console.Read();\n        }\n    }\n}\n```\n\nSwitch 语句以 `switch` 关键字开头，后面跟着一对左、右括号。在这些括号内部，我们输入想要比较的变量。在\
  \ `Example3` 中，我们初始化了 `weather` 并将其赋值为字符串 `cloudy`。在 `switch` 语句中有多个 `case`。每个 `case`\
  \ 都有一个字符串值，后面跟着一个冒号。在每个 `case` 下都添加了代码段。如果 `case` 匹配，该代码段将执行。如果没有任何 `case` 匹配，则执行\
  \ `default` 语句。`Example3` 的输出所示：\n\n**Output3:**\n\nWait but play outside, it’s\
  \ cloudy.\n\n### Exercise 3\n\n**任务：**\n\n初始化一个整数类型变量为随机值。编写一个包含四个 `case` 的 `switch`\
  \ 语句。一个 `case` 值应该匹配你化的整数。在每个 `case` 语句代码段中显示不同的礼物。针对整数值显示 PS4。\n\n**解决方案：**\n\n\
  ```csharp\nusing System;\nusing System.Diagnostics;\n\nnamespaceMyCSharpApplication\n\
  {\n    class Program\n    {\n        static void Main(string[] args)\n        {\n\
  \            int lottery = 45176;\n            switch (lottery)\n            {\n\
  \                case 46781:\n                    Console.WriteLine(\"You won a\
  \ mobile set.\");\n                    break;\n                case 45176:\n   \
  \                 Console.WriteLine(\"You won a PS4.\");\n                    break;\n\
  \                case 74217:\n                    Debug.WriteLine(\"Sorry you won\
  \ nothing.\");\n                    break;\n                case 74193:\n      \
  \              Debug.WriteLine(\"You won a cinema ticket\");\n                 \
  \   break;\n                default:\n                    Console.WriteLine(\"Sorry\
  \ you won nothing.\");\n                    break;\n            }\n            Console.Read();\n\
  \        }\n    }\n}\n```\n\n# 第 4 章：迭代语句\n\n在编写程序时，你可能想要重复执行一段特定的代码。一种方法是根据你想重复执行的次数编写该代码。然而，这种方法极其不专业，会导致代码冗余。为了解决这个问题，引入了迭代语句。迭代语句的概念可以追溯到最早的编程语言。它们的语法在不同语言可能不同，但核心概念是相同的；目的是按照开发者指定的次数执行代码。迭代语句通常被称为“循环”，因为它们以循环的形式重复执行代码。\n\
  \n## 内容\n\n*   `For` 循环\n*   `While` 循环\n*   `Do While` 循环\n*   `Foreach` 循环\n\n\
  ## 1- `For` 循环\n\n\n\n\n\n### for 循环\n\n`for` 循环允许开发者编写一段代码，该代码将按照开发者指定的精确次数执行。当你确切知道代码需要通过的精确迭代次数时，这种循环是完美选择。例如，如果你想在屏幕上打印十次你的名字，`for\
  \ 循环`就是解决方案，因为你已经知道打印名字到屏幕上的这段代码将执行十次。要查看`for 循环`的运行情况，请查看本章的示例。\n\n### 示例 1:\n\n\
  ```csharp\nusing System;\n\nnamespace MyCSharpApplication\n{\n    class Program\n\
  \    {\n        static void Main(string[] args)\n        {\n            for (int\
  \ i = 1; i<= 10; i++)\n            {\n                Console.WriteLine(\"Welcome\
  \ to C#\");\n            }\n            Console.Read();\n        }\n    }\n}\n```\n\
  \n注意`for 循环`的语法；它以左圆括号开始。圆括号内有三个用分号隔开的表达式。第一个表达式 `i=1` 是初始化语句，意味着循环从 `i=1` 开始。该表达式只求值一次。第二个表达式\
  \ `i<=10` 是条件语句，意味着循环将一直执行，直到该条件返回 `true`。在求值条件语句后，循环体（位于大括号内，大括号后是右圆括号）执行。圆括号内的最后一个表达式是\
  \ `i++`。这被称为迭代语句；每次执行循环体时，该语句都会执行，然后控制权再次转移到条件语句。循环持续执行，直到条件语句返回 `true`。在示例 1 中，循环从\
  \ `i=1` 开始，并一直执行到 `i` 小于或等于十为止，每次执行递增 1。这意味着循环将执行 10 次。每次控制台都会打印语句 `\"Welcome to\
  \ C#\"`，因此输出将包含在屏幕上打印 10 次的 `\"Welcome to C#\"`。\n\n#### 输出 1:\n\n```text\nWelcome\
  \ to C#\nWelcome to C#\nWelcome to C#\nWelcome to C#\nWelcome to C#\nWelcome to\
  \ C#\nWelcome to C#\nWelcome to C#\nWelcome to C#\nWelcome to C#\n```\n\n## 2- \"\
  While\" 循环\n\n`while 循环`会一直执行，直到某个条件变为 `true`。当你不确切知道想要执行某段代码几次时，应该使用 `while 循环`。相反，你希望循环执行到某个特定条件变为\
  \ `true` 或 `false`。在示例 2 中，我们将再次在屏幕上打印十次 `\"Welcome to C#\"`，这次使用的是 `while 循环`。\n\
  \n### 示例 2:\n\n```csharp\nusing System;\n\nnamespace MyCSharpApplication\n{\n  \
  \  class Program\n    {\n        static void Main(string[] args)\n        {\n  \
  \          int i = 1;\n            while (i<=10)\n            {\n              \
  \  Console.WriteLine(\"Welcome to C#\");\n                i++;\n            }\n\
  \            Console.Read();\n        }\n    }\n}\n```\n\n在示例 2 中，我们可以看到`while 循环`在圆括号内只有一个条件语句。这是因为`while\
  \ 循环`并不知道需要执行多少次。它只知道，除非条件语句变为 `true`，否则它必须执行。如果你在条件语句中写 `true`，`while 循环`将永远执行下去。\n\
  \n#### 输出 2:\n\n```text\nWelcome to C#\nWelcome to C#\nWelcome to C#\nWelcome to\
  \ C#\nWelcome to C#\nWelcome to C#\nWelcome to C#\nWelcome to C#\nWelcome to C#\n\
  Welcome to C#\n```\n\n## 3- \"Do While\" 循环\n\n`do while 循环`的功能上与`while 循环`相似。它只依赖于条件语句。然而，与`while\
  \ 循环`不同，`do while 循环`至少执行一次。这是因为`do while 循环`的条件语句是在代码块结束时进行求值的。这样，在求值条件语句之前，代码块至少执行一次。示例\
  \ 3 演示了这一过程。\n\n### 示例 3:\n\n```csharp\nusing System;\n\nnamespace MyCSharpApplication\n\
  {\n    class Program\n    {\n        static void Main(string[] args)\n        {\n\
  \            int i = 1;\n            do\n            {\n                Console.WriteLine(\"\
  Welcome to C#\");\n                i++;\n            }\n            while (i<= 10)\
  \ ;\n            Console.Read();\n        }\n    }\n}\n```\n\n在示例 3 中，你可以看到`do while\
  \ 循环`以 `do` 关键字开始，后面跟着代码块。在代码块的末尾你可以看到 `while` 关键字。在这里求值条件，但在到达此点之前，循环已经执行了一次。\n\
  \n#### 输出 3:\n\n```text\nWelcome to C#\n```\n\n## 4- \"Foreach\" 循环\n\n`foreach\
  \ 循环`遍历集合中的所有对象。在 C# 中，`foreach 循环`遍历字符串、数组，这些都是可枚举类型。\n\n### 示例 4:\n\n```csharp\n\
  using System;\n\nnamespace MyCSharpApplication\n{\n    class Program\n    {\n  \
  \      static void Main(string[] args)\n        {\n            foreach (char c in\
  \ \"Welcome to C#\")\n            {\n                Console.WriteLine(c);\n   \
  \         }\n            Console.Read();\n        }\n    }\n}\n```\n\n注意`foreach\
  \ 循环`的语法；它以左圆括号开始。圆括号内有两个用分号隔开的表达式。第一个表达式 `char c` 是初始化语句，意味着循环从 `char c` 开始。第二个表达式\
  \ `in \"Welcome to C#\"` 是集合语句，意味着循环将一直执行直到集合耗尽。在求值集合语句后，循环体（位于大括号内，大括号后是右圆括号）执行。\n\
  \n# 第 5 章：数组\n\n数组用于存储相同类型的多个值。它们存储在连续的内存位置中，这提高了效率。\n\n目录：\n*   数组语法\n*   一维数组\n\
  *   二维数组\n\n### 1- 数组语法\n\n数组具有以下语法：\n`type [] array-name = new type [size];`\n\n\
  数组以要存储的元素类型开始，后面跟着方括号，最后是数组名称。在此时，数组仅被声明，没有为它保留内存位置。要初始化数组，使用 `new` 关键字，后跟数组的类型。然后是方括号，在这些方括号内部指定数组的大小。\n\
  \n### 2- 一维数组\n\n\n\n\n\n在一个方向上存储元素（即以列或行的形式存储）的数组被称为一维数组。我们在上一节中声明的 `salaries`\
  \ 数组就是一个一维数组。一维数组在数组类型后使用一个方括号初始化。要查看一维数组的实际运行，请查看本章的第一个示例。\n\n### Example1\n\n\
  ```csharp\nusing System;\n\nnamespace MyCSharpApplication\n{\n    class Program\n\
  \    {\n        static void Main(string[] args)\n        {\n            int[] salaries\
  \ = new int[10] { 78, 15, 27, 87, 56, 74, 12, 36, 98, 41 };\n            int a =\
  \ salaries[0];\n            int b = salaries[5];\n            Console.WriteLine(a\
  \ + b);\n            salaries[0] = 25;\n            salaries[5] = 25;\n        \
  \    a = salaries[0];\n            b = salaries[5];\n            Console.WriteLine(a\
  \ + b);\n            Console.Read();\n        }\n    }\n}\n```\n\n在 `Example1` 中，我们初始化了数组\
  \ `salaries` 并在初始化时在该数组中存储了 10 个元素。这是在数组中存储元素的方法之一。你初始化数组，并在同一行中，在包含尺寸的方括号之后的大括号内输入元素。在大括号内，你用逗号分隔每个元素。数组具有基于零的存储索引。这意味着数组的第一个元素存储在索引\
  \ 0 ，而最后一个元素存储在索引 `n-1st` ，其中 `n` 是数组的大小。要访问任何索引处的元素，使用数组名后跟方括号。在方括号内，指定索引。例如，在\
  \ `Example1` 中，`salaries` 数组索引 0 处的元素存储在整数变量 `a` 中，而索引 5 处的元素存储在变量 `b` 中。控制台上打印了这两个变量的和。然后数组索引零和五被更新为值\
  \ `25`。在控制台窗口上再次打印了它们的和，现在包含了更新后的值。`Example1` 中代码的输出所示。\n\n**Output1:**\n```\n152\n\
  50\n```\n\n在第 4 章中，我们学习了 `foreach` 循环，它可以遍历任何项目集或列表。除了 `foreach` 循环外，`for` 循环也可以用于遍历数组。在\
  \ `Example2` 中，我们将看到如何通过 `for` 和 `foreach` 循环遍历数组。\n\n### Example2\n\n```csharp\n\
  using System;\n\nnamespace MyCSharpApplication\n{\n    class Program\n    {\n  \
  \      static void Main(string[] args)\n        {\n            int[] salaries =\
  \ new int[10] { 78, 15, 27, 87, 56, 74, 12, 36, 98, 41 };\n            for (int\
  \ i = 0; i < 10; i++)\n            {\n                Console.Write(salaries[i]\
  \ + \" \");\n            }\n            Console.WriteLine();\n            foreach\
  \ (int n in salaries)\n            {\n                Console.Write(n + \" \");\n\
  \            }\n            Console.Read();\n        }\n    }\n}\n```\n\n在 `Example2`\
  \ 中，`salaries` 数组再次初始化了一些随机变量。我们首先使用 `for` 循环遍历了数组，然后使用 `foreach` 循环遍历了 `salaries`\
  \ 数组。`Example2` 中代码的输出如下。\n\n**Output2:**\n```\n78 15 27 87 56 74 12 36 98 41\n\
  78 15 27 87 56 74 12 36 98 41\n```\n\n### 3- 二维数组\n\n一维数组以单列或单行的形式存储数据。二维数组（通常称为数组的数组）以多行多列的形式存储数据。数据以矩阵的形式存储在内存中。要初始化二维数组，你只需要在数组类型后的方括号内放入一个逗号。在左侧，`new`\
  \ 关键字之后的方括号内，你必须指定数组包含的行数和列数。行和列之间用逗号分隔。查看 `Example3` 以二维数组的实际运行。\n\n### Example3\n\
  \n```csharp\nusing System;\n\nnamespace MyCSharpApplication\n{\n    class Program\n\
  \    {\n        static void Main(string[] args)\n        {\n            int[,] salaries\
  \ = new int[2,3];\n            salaries[0,0] = 10; // 第一行列\n            salaries[0,1]\
  \ = 20; // 第一行列\n            salaries[0,2] = 30; // 第一行列\n            salaries[1,0]\
  \ = 40; // 第二行列\n            salaries[1,1] = 50; // 第二行列\n            salaries[1,2]\
  \ = 60; // 第二行列\n            for (int i = 0; i < 2; i++)\n            {\n      \
  \          for (int j = 0; j < 3; j++)\n                {\n                    Console.Write(salaries[i,\
  \ j] + \" \");\n                }\n                Console.WriteLine();\n      \
  \      }\n            Console.Read();\n        }\n    }\n}\n```\n\n在 `Example1`\
  \ 中，我们初始化了一个具有两行三列的二维数组 `salaries`。然后我们访问了每个索引并存储了一些随机值。要访问二维数组的特定索引，你编写数组名后跟方括号。在方括号内，你先输入行号、逗号，然后是列号。遍历二维数组需要嵌套的\
  \ `for` 循环，外层循环遍历每一行，内层循环遍历每一列。这在 `Example3` 中得到了演示。`Example3` 中代码的输出如下。\n\n**Output3:**\n\
  ```\n10 20 30 \n40 50 60\n```\n\n### 练习 5\n\n**任务：**\n使用嵌套的 `for` 循环，用随机变量初始化一个二维数组，并在屏幕上显示这些元素。\n\
  \n**解决方案**\n```csharp\nusing System;\n\nnamespace MyCSharpApplication\n{\n    class\
  \ Program\n    {\n        static void Main(string[] args)\n        {\n         \
  \   int[,] tables = new int[4,10];\n            for (int i = 2; i < 6; i++)\n  \
  \          {\n                for (int j = 0; j < 10; j++)\n                {\n\
  \                    tables[i-2,j] = i * (j+1);\n                }\n           \
  \ }\n            for (int i = 0; i < 4; i++)\n            {\n                for\
  \ (int j = 0; j < 10; j++)\n                {\n                    Console.Write(tables[i,\
  \ j] + \" \");\n                }\n                Console.WriteLine();\n      \
  \      }\n            Console.Read();\n        }\n    }\n}\n```\n\n\n\n\n这是 `Player`\
  \ 类的结构。从这个结构中可以假设该类的对象将包含三个变量：`name`、`age` 和 `country`。`player` 对象占用的内存大致等于于变量 `name`、`age`\
  \ 和 `country` 所占用的内存之和。`Player` 类将创建在与你的 `Program` 类相同的命名空间中。\n\n打开 `Program` 类的代码并进行以下更改。\n\
  \n```csharp\nusing System;\n\nnamespace MyCSharpApplication\n{\n    class Program\n\
  \    {\n        static void Main(string[] args)\n        {\n            Player p\
  \ = new Player();\n            p.name = \"Alan\";\n            p.age = 25;\n   \
  \         p.country = \"USA\";\n            Console.WriteLine(p.name +,\"+p.age+\"\
  ,\"+p.country);\n            Console.Read();\n        }\n    }\n}\n```\n\n在上面的 `Program.cs`\
  \ 文件中，我们在 `Player` 类中创建了一个对象 `p`。要创建任何类的对象，请使用 `new` 关键字后接类的构造函数。我们将在下一节中深入探讨构造函数。现在，假设\
  \ `Player()` 是 `Player` 类的默认构造函数。调用 `new` 后跟任何类的构造函数将会在内存中创建该类的对象并返回其引用。该引用可以存储在该类的变量中。在示例\
  \ 1 中，我们在 `Player` 类中创建了一个变量 `p`。该变量 `p` 存储了 `Player` 类中对象的引用。要访问对象的成员，请使用引用变量，然后跟一个点（`.`），最后是你想要访问的属性。例如，如果你想访问对象\
  \ `p` 的名称，将使用 `p.name`。通过这种方式，我们在 `name`、`age` 和 `country` 中存储了三个随机值。最后，我们在输出控制台上打印了这些值。\n\
  \n**输出 1：**\nAlan,25,USA\n\n## 2- 构造函数\n\n构造函数是一个创建类对象并将其引用返回给调用函数的函数。构造函数的名称与它所属的类名称完全相同。构造函数没有返回类型，即使是\
  \ `void` 也没有。构造函数还可以在创建对象时用于初始化类的成员变量。在本章的第二个示例中，我们将看到如何使用构造函数来初始化成员变量。\n\n**示例\
  \ 2：**\n在示例 1 中创建的 `Player` 类中进行以下更改。\n\n```csharp\nusing System;\n\nnamespace MyCSharpApplication\n\
  {\n    class Player\n    {\n        public string name;\n        public int age;\n\
  \        public string country;\n        public Player()\n        {\n          \
  \  name = \"Scott\";\n            age = 30;\n            country = \"UK\";\n   \
  \     }\n    }\n}\n```\n\n在上面的代码中，我们创建了一个构造函数来初始化变量 `name`、`age` 和 `country`。`name`\
  \ 变为 \"Scott\"，`age` 变为 \"30\"，`country` 变为 \"UK\"。当创建此类的对象时，这三个变量将自动初始化，并可以随时打印到屏幕上。为了在控制台上查看它们的值，请在\
  \ `Program` 类中进行以下更改。\n\n```csharp\nusing System;\n\nnamespace MyCSharpApplication\n\
  {\n    class Program\n    {\n        static void Main(string[] args)\n        {\n\
  \            Player p = new Player();\n            Console.WriteLine(p.name +,\"\
  +p.age+\",\"+p.country);\n            Console.Read();\n        }\n    }\n}\n```\n\
  \n示例 2 代码的输出如下：\n**输出 2：**\nScott,30,UK\n\n## 参数化构造函数\n\n你也可以通过在创建类对象时向构造函数传递参数来初始化类的成员变量。从调用函数接收参数的构造函数被称为参数化构造函数。示例\
  \ 3 演示了 C# 中参数化构造函数的用法。\n\n**示例 3：**\n在 `Player` 类中进行以下更改：\n\n```csharp\nusing System;\n\
  \nnamespace MyCSharpApplication\n{\n    class Player\n    {\n        public string\
  \ name;\n        public int age;\n        public string country;\n        public\
  \ Player(string name, int age, string country)\n        {\n            this.name\
  \ = name;\n            this.age = age;\n            this.country = country;\n  \
  \      }\n    }\n}\n```\n\n在上面的代码段中，我们在构造函数的括号内输入了三个变量。这些是参数，用逗号分隔。要调用此构造函数，我们必须在调用时传递三个参数。这些参数应该与构造函数中的参数类型匹配。此外，传递的参数的顺序应该与构造函数声明中的参数顺序匹配。例如，在调用此参数化构造函数时，第一个参数应该是\
  \ `string`，第二个应该是 `integer`（整数），第三个应该是 `string`。在 `Program` 类中进行以下更改以查看它是如何工作的。\n\
  \n```csharp\nusing System;\n\nnamespace MyCSharpApplication\n{\n    class Program\n\
  \    {\n        static void Main(string[] args)\n        {\n            Player p\
  \ = new Player(\"Joseph\", 35, \"Italy\");\n            Console.WriteLine(p.name\
  \ +,\"+p.age+\",\"+p.country);\n            Console.Read();\n        }\n    }\n\
  }\n```\n\n示例 3 代码的输出如下：\n**输出 3：**\nJoseph,35,Italy\n\n## 重载构造函数\n\n你可以在类中拥有两个或多个参数化构造函数。当创建类对象时，与调用匹配的构造函数将被调用。这个概念初看起来可能很困惑。本章的第四个示例演示了重载构造函数的概念。\n\
  \n**示例 4：**\n在 `Player` 类中进行以下更改。\n\n**Player.cs**\n```csharp\nusing System;\n\n\
  namespace MyCSharpApplication\n{\n    class Player\n    {\n        public string\
  \ name;\n        public int age;\n        public string country;\n        public\
  \ Player(string name, int age, string country)\n        {\n            this.name\
  \ = name;\n            this.age = age;\n            this.country = country;\n  \
  \      }\n        public Player(string name)\n        {\n            this.name =\
  \ name;\n        }\n    }\n}\n```\n\n在 `Player` 类中，你可以看到现在有两个参数化构造函数。第一个构造函数与示例\
  \ 3 类似，接收三个参数。第二个构造函数接收一个参数。创建对象时调用的构造函数取决于构造函数的调用。如果调用包含一个 `string` 类型参数，将调用第二个构造函数。然而，如果调用包含三个参数（`string`、`int`、`string`），将调用第一个构造函数。\n\
  \n在 `Program` 类中进行以下更改，以查看 `Player` 类中构造函数调用之间的差异。\n\n**Program.cs**\n```csharp\n\
  using System;\n\nnamespace MyCSharpApplication\n{\n    class Program\n    {\n  \
  \      static void Main(string[] args)\n        {\n            Player p = new Player(\"\
  Joseph\", 35, \"Italy\");\n            Player p2 = new Player(\"Susan\");\n    \
  \        p2.age = 40;\n            p2.country = \"France\";\n            Console.WriteLine(p.name\
  \ + \",\" + p.age + \",\" + p.country);\n            Console.WriteLine(p2.name +++\"\
  ,\"+p2.age+\",\"+p2.country);\n            Console.Read();\n        }\n    }\n}\n\
  ```\n\n示例 4 代码的输出如下：\n**输出 4：**\nJoseph,35,Italy\nSusan,40,France\n\n## 练习 6\n\n\
  **任务：**\n创建一个名为 `Product` 的类，具有三个属性：`name`、`price` 和 `category`。添加一个初始化这三个属性的参数化构造函数。添加另一个初始化前两个属性的构造函数。在\
