  \n# 第 8 章：继承与多态\n\n在最后两个章节中，我们涵盖了基础面向对象概念（OOP）。在本章中，我们将学习两个高级 OOP 特：继承和多态。和所有其他\
  \ OOP 概念一样，OOP 中的继承与现实世界的继承概念相似。孩子继承父母的某些特征，同时也具有一些自己特有的特征。在面向对象编程中，这个概念也是类似的。继承也存在于类之间，并用“是一个”（Is-A）关系来标记。例如，“笔记本电脑”是一种产品，“汽车”是一种交通工具，而“员工”是一个人。在这里，“笔记本电脑”是\
  \ `product` 的子类，“汽车”是 `vehicle` 的子类，而“员工”是 `person` 的子类。多态的概念基于继承；我们将在后的部分进行学习。\n\
  \n## 目录\n- 继承\n- 多态\n\n## 1- 继承\n\n继承的想法是，子类之间所有共同的特征都在父类中实现，而特定于单个子类的特征在各自的子类中实现。例如，取一个父类\
  \ `product` 及其子类软件和硬件产品。软件产品和硬件产品都有 `name` 和 `price`。因此，我们可以在父类 `product` 类中同时包含\
  \ `name` 和 `price` 属性。继承父类的类默认拥有父类的所有属性。然而，软件没有重量，而硬件产品具有一定的重量。这意味着 `weight` 属性是硬件类特有的；因此，它不能在父类中实现。同样，我们假设软件有一个版本号，而硬件没有版本号。在这里，`version`\
  \ 是软件类特有的，不能在父类中实现。这种场景已经在示例 1 中实现。\n\n### 示例 1：\n\n向你的项目添加三个类（`Product`、`Hardware`\
  \ 和 `Software`）。这三个类的代码标记应如下：\n\n#### Product.cs\n```csharp\nusing System;\nnamespace\
  \ MyCSharpApplication\n{\nclass Product\n{\n    public string name;\n    public\
  \ int price;\n}\n}\n```\n在 `Product` 类中，我们只添加了两个属性：`name` 和 `price`。\n\n#### Software.cs\n\
  ```csharp\nusing System;\nnamespace MyCSharpApplication\n{\nclass Software : Product\n\
  {\n    public int version;\n    public Software(string name, int price, int version)\n\
  \    {\n        this.name = name;\n        this.price = price;\n        this.version\
  \ = version;\n    }\n}\n```\n（注：此处原文逻辑似乎存在部分重复或乱序，翻译已按原意进行微调以确保逻辑连贯性）\n继承父类的类默认拥有父类的所有属性。然而，软件没有重量，而硬件产品具有一定的重量。这意味着\
  \ `weight` 属性是硬件类特有的；因此，它不能在父类中实现。同样，我们假设软件有一个版本号，而硬件没有版本号。在这里，`version` 是软件类特有的，不能在父类中实现。这种场景已经在示例\
  \ 1 中实现。\n\n#### Hardware.cs\n```csharp\nusing System;\nnamespace MyCSharpApplication\n\
  {\nclass Hardware : Product\n{\n    public int weight;\n    public Hardware(string\
  \ name, int price, int weight)\n    {\n        this.name = name;\n        this.price\
  \ = price;\n        this.weight = weight;\n    }\n}\n}\n```\n\n#### Program.cs\n\
  ```csharp\nusing System;\nnamespace MyCSharpApplication\n{\nclass Program\n{\n \
  \   static void Main(string[] args)\n    {\n        Software s = new Software(\"\
  windows\", 150, 3);\n        Hardware h = new Hardware(\"Laptop\", 500, 2);\n  \
  \      Console.WriteLine(\"Initial Speed of car is \" + s.name);\n        Console.WriteLine(\"\
  Decreased Speed of car is \" + h.name);\n        Console.Read();\n    }\n}\n```\n\
  **输出 1：**\n```\nwindows\nLaptop\n```\n\n## 2- 多态\n\n父类可以持有子类对象。父类根据它所持有的引用表现不同的行为。这就是多态。假设\
  \ `Product` 类有一个方法 `DisplayProduct`，它显示名称。两个子类也有方法 `DisplayProduct`。这里出现的问题：如果在对象上调用\
  \ `DisplayProduct`，它是 `Product`、`Software` 还是 `Hardware` 类？\n\n### 示例 2\n\n对 `Product`、`Software`\
  \ 和 `Hardware` 类进行以下修改。\n\n#### Product.cs\n```csharp\nusing System;\nnamespace\
  \ MyCSharpApplication\n{\nclass Product\n{\n    public string name;\n    public\
  \ int price;\n    public virtual void DisplayProduct()\n    {\n        Console.WriteLine(\"\
  This is parent class: \" + name);\n    }\n}\n}\n```\n如果子类要包含与父类相同的方法，该方法在父类中必须标记为\
  \ `virtual`。这就是为什么我们在父类中将 `DisplayProduct` 方法标记为 `virtual`。当此方法添加到子类中时，必须使用 `override`\
  \ 关键字标记。这在 `Software` 和 `Hardware` 类中都显示了。\n\n#### Software.cs\n```csharp\nusing\
  \ System;\nnamespace MyCSharpApplication\n{\nclass Software : Product\n{\n    public\
  \ int version;\n    public Software(string name, int price, int version)\n    {\n\
  \        this.name = name;\n        this.price = price;\n        this.version =\
  \ version;\n    }\n    public override void DisplayProduct()\n    {\n        Console.WriteLine(\"\
  You bought \" + name + \", version \" + version);\n    }\n}\n}\n```\n\n#### Hardware.cs\n\
  ```csharp\nusing System;\nnamespace MyCSharpApplication\n{\nclass Hardware : Product\n\
  {\n    public int weight;\n    public Hardware(string name, int price, int weight)\n\
  \    {\n        this.name = name;\n        this.price = price;\n        this.weight\
  \ = weight;\n    }\n    public override void DisplayProduct()\n    {\n        Console.WriteLine(\"\
  You bought \" + name + \", weight \" + weight);\n    }\n}\n}\n```\n\n\n\n\n\n在 `Program`\
  \ 类中，我们创建了父类 `Product` 的对象，并在其中存储了 `Product`、`Software` 和 `Hardware` 类对象的引用。然后，我们按顺序调用了\
  \ `DisplayProduct` 方法。你会发现，在输出中，将根据在 `Product` 类对象中存储的引用，调用不同的 `DisplayProduct`\
  \ 方法。\n\nProgram.cs\n\n```csharp\nusing System;\n\nnamespace MyCSharpApplication\n\
  {\n    class Program\n    {\n        static void Main(string[] args)\n        {\n\
  \            Product p = new Product();\n            p.name = \"Apple\";\n     \
  \       p.price = 10;\n            p.DisplayProduct();\n\n            p = new Software(\"\
  windows 7\", 150, 3);\n            p.DisplayProduct();\n\n            p = new Hardware(\"\
  Laptop\", 500, 2);\n            p.DisplayProduct();\n            Console.Read();\n\
  \        }\n    }\n}\n```\n\nOutput2:\n```text\nThis is a parent class: Apple\n\
  You bought windows 7, version 3\nYou bought Laptop, weight 2\n```\n\n# 练习 8\n\n\
