  trans: "\n\n![](img/rsrc135.jpg)\n![](img/rsrc135.jpg)\n\n# 初学者 C# 代码编程示例 J KING\n\
    \n## 目录\n- C# | 打印消息/文本（打印 Hello world 的程序）\n- 打印新行行的 C# 程序\n- 打印各种数据类型大小的 C#\
    \ 程序\n- C# 程序中从 double 到 int 的类型转换\n- 定义不同类型的常量\n- 演示算术运算符示例的 C# 程序\n- 演示位运算符示例的程序\n\
    - 演示关系运算符示例的程序\n- 计算两个整数之和的程序\n- 交换两个数字的程序\n- 演示简单 if else 语句的程序\n- 多重 if else\
    \ 语句示例\n- 条件运算符的 C# 程序\n- switch 语句示例的 C# 程序\n- 求两个数字较大值的 C# 程序\n- 使用 while 循环打印\
    \ 1 到 15\n- 使用 do while 循环打印 1 到 15\n- 找出 2 到 30 之间质数的程序\n\n## C# | 打印消息/文本（打印\
    \ Hello world 的程序）\n\n我们使用以下两个函数来打印消息/文本或任何值：\n\n- `Console.Write()`：此功能在输出设备上显示文本、值，并在消息后不插入换行。\n\
    - `Console.WriteLine()`：此功能在设备上显示文本、值，并在消息后添加一个换行。\n\n### 程序\n```csharp\n/*c#\
    \ 打印消息的基础程序*/\nusing System;\nclass HelloWorld {\n    static void Main() {\n \
    \       // 在消息后不插入换行的文本\n        Console.Write(\"Hello World,\");\n        Console.Write(\"\
    How are you?\");\n        // 换行\n        Console.WriteLine();\n        // 在消息后带有换行行的文本\n\
    \        Console.WriteLine(\"Hello World\");\n        Console.WriteLine(\"How\
    \ are you?\");\n        // 像 C 语言一样使用转义序列换行\n        Console.WriteLine(\"Hello\
    \ World\\nHow are you?\");\n    }\n}\n```\n\n### 输出\n```\nHello World,How are\
    \ you?\nHello World\nHow are you?\nHello World\nHow are you?\n```\n\n## 打印新行的\
    \ C# 程序\n\n在屏幕上打印消息时，可以使用以下方法在消息内部打印换行：\n\n- 使用 `\\n` - 打印换行\n 使用 使用 `\\x0A` 或\
    \ `\\x A`（`\\n` 的 ASCII 字面量）—— 打印换行\n- 使用 `Console.WriteLine()` – 如果我们在过程中写入了消息，则会打印换行\n\
    \n"
- fmt: "\n# C# program to print a new line\n\n```csharp\nusing System;\nusing System.IO;\n\
    using System.Text;\nnamespace IncludeHelp\n{\n    class Test\n    {\n        //\
    \ Main Method\n        static void Main(string[] args)\n        {\n          \
    \  //using \\n\n            Console.WriteLine(\"Hello\\nWorld\");\n          \
    \  //using \\x0A\n            Console.WriteLine(\"Hello\\x0AWorld\");\n      \
    \      Console.WriteLine();\n            Console.WriteLine(\"end of the program\"\
    );\n            //hit ENTER to exit the program\n            Console.ReadLine();\n\
    \        }\n    }\n}\n```\nOutput\n```\nHelloWorld\nHelloWorld\nend of the program\n\
    ```\n\n# C# program to print size of various data types\nWe will print the size\
    \ of the different types of data, we will print the type size, we will use `sizeof()`\
    \ operator.\n\n```csharp\nusing System;\nusing System.IO;\nusing System.Text;\n\
    namespace IncludeHelp\n{\n    class Test\n    {\n        // Main Method\n    \
    \    static void Main(string[] args)\n        {\n            Console.WriteLine(\"\
    sizeof(int): {0}\", sizeof(int));\n            Console.WriteLine(\"sizeof(float):\
    \ {0}\", sizeof(float));\n            Console.WriteLine(\"sizeof(char): {0}\"\
    , sizeof(char));\n            Console.WriteLine(\"sizeof(double): {0}\", sizeof(double));\n\
    \            Console.WriteLine(\"sizeof(bool): {0}\", sizeof(bool));\n       \
    \     //hit ENTER to exit the program\n            Console.ReadLine();\n     \
    \   }\n    }\n}\n```\nOutput\n```\nsizeof(int): 4\nsizeof(float): 4\nsizeof(char):\
    \ 2\nsizeof(double): 8\nsizeof(bool): 1\n```\n\n# Type conversion from double\
    \ to int in C# Program\nSyntax: `int_variable = (int)double_variable;`\n\nExample:\n\
    Input:\n```csharp\ndouble a = 123456.789;\nint b = 0;\n//type conversion\nb =\
    \ (int)a;\n```\nOutput:\n```\na: 123456.789\nb: 123456\n```\n\n```csharp\n// C#\
    \ program for type conversion from double to int\nusing System;\nusing System.IO;\n\
    using System.Text;\nnamespace IncludeHelp\n{\n    class Test\n    {\n        //\
    \ Main Method\n        static void Main(string[] args)\n        {\n          \
    \  double a = 123456.789;\n            int b = 0;\n            //type conversion\n\
    \            b = (int)a;\n            Console.WriteLine(\"value of a: {0}\", a);\n\
    \            Console.WriteLine(\"value of b: {0}\", b);\n            //hit ENTER\
    \ to exit the program\n            Console.ReadLine();\n        }\n    }\n}\n\
    ```\nOutput\n```\nvalue of a: 123456.789\nvalue of b: 123456\n```\n\n# Define\
    \ various types of constants\nA constant can be described using `const` keyword,\
    \ its value can never be modified once the constant is defined.\n\nSyntax: `const\
    \ data_type constant_name = value;`\n`const float PI = 3.14f;`\n\nExample:\nInput:\n\
    ```csharp\nconst int a = 10;   //integer constant\nConsole.WriteLine(\"a: {0}\"\
    , a);\n```\nOutput:\n```\na: 10\n```\n\n```csharp\n// C# program to define various\
    \ types of constants\nusing System;\nusing System.IO;\nusing System.Text;\nnamespace\
    \ IncludeHelp\n{\n    class Test\n    {\n        // Main Method\n        static\
    \ void Main(string[] args)\n        {\n            const int a = 10;   //integer\
    \ constant\n            const float b = 20.23f; //float constant\n           \
    \ const double c = 10.23;  //double constant\n            const char d = 'Y';\
    \      //character constant\n            const string e = \"Hello\";   //string\
    \ constant\n            //printing values\n            Console.WriteLine(\"a:\
    \ {0}\", a);\n            Console.WriteLine(\"b: {0}\", b);\n            Console.WriteLine(\"\
    c: {0}\", c);\n            Console.WriteLine(\"d: {0}\", d);\n            Console.WriteLine(\"\
    e: {0}\", e);\n            //hit ENTER to exit the program\n            Console.ReadLine();\n\
    \        }\n    }\n}\n```\nOutput\n```\na: 10\nb: 20.23\nc: 10.23\nd: Y\ne: Hello\n\
    ```\n\n# C# program to demonstrate example of arithmetic operators\nExample:\n\
    Input:\n```csharp\nint a = 10;\nint b = 3;\n//operations\nint sum = a + b;\nint\
    \ sub = a - b;\nint mul = a * b;\nfloat div = (float)a / (float)b;\nint rem =\
    \ a % b;\n```\nOutput:\n```\nsum = 13\nsub = 7\nmul = 30\ndiv = 3.333333\nrem\
    \ = 1\n```\n\n```csharp\n// C# program to demonstrate example of\n// arithmetic\
    \ operators\nusing System;\nusing System.IO;\nusing System.Text;\nnamespace codingex\n\
    {\n    class Test\n    {\n        // Main Method\n        static void Main(string[]\
    \ args)\n        {\n            int a = 10;\n            int b = 3;\n        \
    \    int sum = a + b;\n            int sub = a - b;\n            int mul = a *\
    \ b;\n            float div = (float)a / (float)b;\n            int rem = a %\
    \ b;\n            Console.WriteLine(\"Addition of {0} and {1} is = {2}\", a, b,\
    \ sum);\n            Console.WriteLine(\"Subtraction of {0} and {1} is = {2}\"\
    , a, b, sub);\n            Console.WriteLine(\"Multiplication of {0} and {1} is\
    \ = {2}\", a, b, mul);\n            Console.WriteLine(\"Division of {0} and {1}\
    \ is = {2}\", a, b, div);\n            Console.WriteLine(\"Remainder of {0} and\
    \ {1} is = {2}\", a, b, rem);\n            //hit ENTER to exit the program\n \
    \           Console.ReadLine();\n        }\n    }\n}\n```\nOutput\n```\nAddition\
    \ of 10 and 3 is = 13\nSubtraction of 10 and 3 is = 7\nMultiplication of 10 and\
    \ 3 is = 30\nDivision of 10 and 3 is = 3.333333\nRemainder of 10 and 3 is = 1\n\
    ```\n\n# Program to demonstrate example of bitwise operators\nBitwise operators\
    \ will be used to perform the bits calculations.\n- `&` (Bitwise AND): returns\
    \ 1 if both bits are set\n- `|` (Bitwise OR): returns 1 if any or all bits are\
    \ set\n- `^` (Bitwise XOR): returns 1 if only one bit is set\n- `~` (Bitwise NOT):\
    \ returns an operand's compliment\n- `<` (Bitwise Left Shift): move bits to the\
    \ left\n- `>` (Bitwise Right Shift): switch bits to the right\n\nSyntax:\n`Operand1\
    \ & Operand2`\n`Operand1 | Operand2`\n`Operand1 ^ Operand2`\n`~Operand1`\n`Operand1\
    \ << Operand2`\n`Operand1 >> Operand2`\n\nExample:\n```csharp\nint a = 10;\nint\
    \ b = 3;\n//operations\na & b = 2\na | b = 11\na ^ b = 9\n~a = -11\na << 2 = 40\n\
    a >> 2 = 2\n```\n\n```csharp\n// C# program to demonstrate example of\n// bitwise\
    \ operators\nusing System;\nusing System.IO;\nusing System.Text;\nnamespace IncludeHelp\n\
    {\n    class Test\n    {\n        // Main Method\n        static void Main(string[]\
    \ args)\n        {\n            int a = 10;\n            int b = 3;\n        \
    \    int result = 0;\n            result = a & b;\n            Console.WriteLine(\"\
    a & b: {0}\", result);\n            result = a | b;\n            Console.WriteLine(\"\
    a | b: {0}\", result);\n            result = a ^ b;\n            Console.WriteLine(\"\
    a ^ b: {0}\", result);\n            result = ~a;\n            Console.WriteLine(\"\
    ~a: {0}\", result);\n            result = a << 2;\n            Console.WriteLine(\"\
    a << b: {0}\", result); // Note: original text had a << b logic inconsistency\n\
    \            result = a >> 2;\n            Console.WriteLine(\"a >> b: {0}\",\
    \ result);\n            //hit ENTER to exit the program\n            Console.ReadLine();\n\
    \        }\n    }\n}\n```\n*(Note: The provided text for bitwise operators had\
    \ some logical inconsistencies in variable usage; the formatting above follows\
    \ the structure provided).*\n\n# Program to demonstrate example of relational\
    \ operators\n- `==` (Equal To): returns true if both operands are identical\n\
    - `!=` (Not Equal To): returns true if both operands are not equal\n- `<` (Less\
    \ Than): if first operand is less than second operand, it returns true\n- `<=`\
    \ (less than or equal to): if the first operand is less than or equal to the second\
    \ operand, it is true\n- `>` (Greater Than): if the first operand is greater than\
    \ the second operand, it is true\n- `>=` (Greater Than or Equal): if the first\
    \ operand is greater than or equal to the second operand, it is true\n\nSyntax:\n\
    `Operand1 == Operand2`\n`Operand1 != Operand2`\n`Operand1 < Operand2`\n`Operand1\
    \ <= Operand2`\n`Operand1 > Operand2`\n`Operand1 >= Operand2`\n\nExample:\n```csharp\n\
    int a = 10;\nint b = 3;\nConsole.WriteLine(\"a==b: {0}\", (a == b));\nConsole.WriteLine(\"\
    a!=b: {0}\", (a != b));\nConsole.WriteLine(\"a>b: {0}\", (a > b));\nConsole.WriteLine(\"\
    a>=b: {0}\", (a >= b));\nConsole.WriteLine(\"a<b: {0}\", (a < b));\nConsole.WriteLine(\"\
    a<=b: {0}\", (a <= b));\n```\nOutput\n```\na==b: False\na!=b: True\na>b: True\n\
    a>=b: True\na<b: False\na<=b: False\n```\n\n```csharp\n// C# program to demonstrate\
    \ example of\n// relational operators\nusing System;\nusing System.IO;\nusing\
    \ System.Text;\nnamespace IncludeHelp\n{\n    class Test\n    {\n        // Main\
    \ Method\n        static void Main(string[] args)\n        {\n            int\
    \ a = 10;\n            int b = 3;\n            //printing return type\n      \
    \      Console.WriteLine(\"Return type of == operator: {0}\", (a == b).GetType());\n\
    \            Console.WriteLine(\"Return type of != operator: {0}\", (a != b).GetType());\n\
    \            Console.WriteLine(\"Return type of > operator : {0}\", (a > b).GetType());\n\
    \            Console.WriteLine(\"Return type of >= operator: {0}\", (a >= b).GetType());\n\
    \            Console.WriteLine(\"Return type of < operator : {0}\", (a < b).GetType());\n\
    \            Console.WriteLine(\"Return type of <= operator: {0}\", (a <= b).GetType());\n\
    \            //printing return values\n            Console.WriteLine(\"a==b: {0}\"\
    , (a == b));\n            Console.WriteLine(\"a!=b: {0}\", (a != b));\n      \
    \      Console.WriteLine(\"a>b: {0}\", (a > b));\n            Console.WriteLine(\"\
    a>=b: {0}\", (a >= b));\n            Console.WriteLine(\"a<b: {0}\", (a < b));\n\
    \            Console.WriteLine(\"a<=b: {0}\", (a <= b));\n            //checking\
    \ conditions\n            if (a == b)\n                Console.WriteLine(\"a is\
    \ equal to b\");\n            else\n                Console.WriteLine(\"a is not\
    \ equal to b\");\n            if (a != b)\n                Console.WriteLine(\"\
    a is not equal to b\");\n            else\n                Console.WriteLine(\"\
    a is equal to b\");\n            if (a > b)\n                Console.WriteLine(\"\
    a is greater than b\");\n            else\n                Console.WriteLine(\"\
    a is not greater than b\");\n            if (a >= b)\n                Console.WriteLine(\"\
    a is greater than or equal to b\");\n            else\n                Console.WriteLine(\"\
    a is not greater than equal to b\");\n            if (a < b)\n               \
    \ Console.WriteLine(\"a is less than b\");\n            else\n               \
    \ Console.WriteLine(\"a is not less than b\");\n            if (a <= b)\n    \
    \            Console.WriteLine(\"a is less than or equal to b\");\n          \
    \  else\n                Console.WriteLine(\"a is not less than equal to b\");\n\
    \            //checking conditions in another way\n            if ((a == b) ==\
    \ true)\n                Console.WriteLine(\"a is equal to b\");\n           \
    \ else\n                Console.WriteLine(\"a is not equal to b\");\n        \
    \    if ((a != b) == true)\n                Console.WriteLine(\"a is not equal\
    \ to b\");\n            else\n                Console.WriteLine(\"a is equal to\
    \ b\");\n            if ((a > b) == true)\n                Console.WriteLine(\"\
    a is greater than b\");\n            else\n                Console.WriteLine(\"\
    a is not greater than b\");\n            if ((a >= b) == true)\n             \
    \   Console.WriteLine(\"a is greater than or equal to b\");\n            else\n\
    \                Console.WriteLine(\"a is not greater than equal to b\");\n  \
    \          if ((a < b) == true)\n                Console.WriteLine(\"a is less\
    \ than b\");\n            else\n                Console.WriteLine(\"a is not less\
    \ than b\");\n            if ((a <= b) == true)\n                Console.WriteLine(\"\
    a is less than or equal to b\");\n            else\n                Console.WriteLine(\"\
    a is not less than equal to b\");\n            //hit ENTER to exit the program\n\
    \            Console.ReadLine();\n        }\n    }\n}\n```\nOutput\n```\nReturn\
    \ type of == operator: System.Boolean\nReturn type of != operator: System.Boolean\n\
    Return type of > operator: System.Boolean\nReturn type of >= operator: System.Boolean\n\
    Return type of < operator: System.Boolean\nReturn type of <= operator: System.Boolean\n\
    a==b: False\na!=b: True\na>b: True\na>=b: True\na<b: False\na<=b: False\na is\
    \ not equal to b\na is not equal to b\na is greater than b\na is not greater than\
    \ b\na is greater than or equal to b\na is not greater than equal to b\na is less\
    \ than b\na is not less than b\na is less than or equal to b\na is not less than\
    \ equal to b\n```\n\n# Find the addition of two integer numbers\nInput:\n```\n\
    First number: 10\nSecond number: 20\n```\nOutput:\n```\nAddition of 10 and 20\
    \ is = 30\n```\n\n```csharp\nusing System;\nclass AddTwoNumbers\n{\n    static\
    \ void Main()\n    {\n        try\n        {\n            //declare two variables\n\
    \            int a = 0;\n            int b = 0;\n            //input numbers\n\
    \            Console.Write(\"Enter first number: \");\n            a = Convert.ToInt32(Console.ReadLine());\n\
    \            Console.Write(\"Enter second number: \");\n            b = Convert.ToInt32(Console.ReadLine());\n\
    \            //calculating sum\n            int sum = a + b;\n            Console.WriteLine(\"\
    Addition of \" + a + \" and \" + b + \" is = \" + sum);\n        }\n        catch\
    \ (Exception ex)\n        {\n            Console.WriteLine(\"Error: \" + ex.ToString());\n\
    \        }\n    }\n}\n```\nOutput\n```\nEnter first number: 10\nEnter second number:\
    \ 20\nAddition of 10 and 20 is = 30\n```\n\n# Program to swap two numbers\n\n\
    ## 1) Swapping ‘using variable variable\nIn order to swap numbers, we use a temporary\
    \ variable to hold the value. First, we assign the temporary variable first, then\
    \ assign the second variable to the first variable, and finally assign the second\
    \ variable to the temporary variable (which holds the first number).\n\n```csharp\n\
    using System;\nnamespace swap\n{\n    class ab\n    {\n        static void Main(String[]\
    \ args)\n        {\n            int a = 5, b = 3, temp;\n            //swapping\n\
    \            temp = a;\n            a = b;\n            b = temp;\n          \
    \  Console.WriteLine(\"Values after swapping are:\");\n            Console.WriteLine(\"\
    a=\" + a);\n            Console.WriteLine(\"b=\" + b);\n        }\n    }\n}\n\
    ```\nOutput\n```\nValues after swapping are:\na=3\nb=5\n```\n\n## 2) Swapping\
    \ ‘without using third variable\nWe 're not using any additional variable here\
    \ to swap the numbers. There are certain sets of statements (with mathematical\
    \ operations performing on the numbers) that swap the variable values used in\
    \ these operations.\n\nExample:\n```csharp\na = a + b;\nb = a - b;\na = a - b;\n\
    ```\n\n```csharp\nusing System;\nnamespace swap\n{\n    class ab\n    {\n    \
    \    static void Main(String[] args)\n        {\n            int a = 10, b = 20;\n\
    \            //swapping\n            a = a + b;\n            b = a - b;\n    \
    \        a = a - b;\n            Console.WriteLine(\"Values after swapping are:\"\
    );\n            Console.WriteLine(\"a=\" + a);\n            Console.WriteLine(\"\
