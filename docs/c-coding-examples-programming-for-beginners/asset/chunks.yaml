- fmt: "\n![](rsrc135.jpg)\n![](rsrc135.jpg)\n\n# C# CODING EXAMPLES PROGRAMMING FOR\
    \ BEGINNERS J KING\n\n## 目录\n- [C# | Print messages/text (program to print Hello\
    \ world](#part0003.xhtml)\n- [C# program to print a new line](#part0004.xhtml)\n\
    - [C# program to print size of various data types](#part0005.xhtml)\n- [Type conversion\
    \ from double to int in C# Program](#part0006.xhtml)\n- [Define various types\
    \ of constants](#part0007.xhtml)\n- [C# program to demonstrate example of arithmetic\
    \ operators](#part0008.xhtml)\n- [Program to demonstrate example of bitwise operators](#part0009.xhtml)\n\
    - [program to demonstrate example of relational operators](#part0010.xhtml)\n\
    - [Find the addition of two integer numbers](#part0011.xhtml)\n- [Program to swap\
    \ two numbers](#part0012.xhtml)\n- [Program to demonstrate example of simple if\
    \ else statement](#part0013.xhtml)\n- [Example of multiple if else statement](#part0014.xhtml)\n\
    - [C# program of conditional operator](#part0015.xhtml)\n- [C# program example\
    \ of switch statement](#part0016.xhtml)\n- [C# program to find largest of two\
    \ numbers](#part0017.xhtml)\n- [Print numbers from 1 to 15 using while loop](#part0018.xhtml)\n\
    - [Print numbers from 1 to 15 using do while loop](#part0019.xhtml)\n- [Program\
    \ to find out the prime numbers among 2 to 30](#part0020.xhtml)\n\n## C# | Print\
    \ messages/text (program to print Hello world)\n\nWe use two functions to print\
    \ the message / text, or any value:\n\n- `Console.Write()`: This feature shows\
    \ text, values on the output device, and after the message, does not insert a\
    \ new line.\n- `Console.WriteLine()`: This feature shows text, values on the device\
    \ that is output and adds a new line after the message.\n\n### PROGRAM\n```csharp\n\
    /*c# basic program to print messages*/\nusing System;\nclass HelloWorld {\n  \
    \  static void Main() {\n        //print text without inserting new line after\
    \ the message\n        Console.Write(\"Hello World,\");\n        Console.Write(\"\
    How are you?\");\n        //print new line\n        Console.WriteLine();\n   \
    \     //print text with new line after the message\n        Console.WriteLine(\"\
    Hello World\");\n        Console.WriteLine(\"How are you?\");\n        //print\
    \ new line using escape sequence just like C language\n        Console.WriteLine(\"\
    Hello World\\nHow are you?\");\n    }\n}\n```\n\n### Output\n```\nHello World,How\
    \ are you?\nHello World\nHow are you?\nHello World\nHow are you?\n```\n\n## C#\
    \ program to print a new line\n\nWe may use the following methods to print a new\
    \ line within the message when printing it on the screen:\n\n- Using `\\n` - print\
    \ new line\n- Using `\\x0A` or `\\x A` (ASCII literal of `\\n`) – prints new line\n\
    - Using `Console.WriteLine()` – prints a new line, if we write some message in\
    \ the process\n"
