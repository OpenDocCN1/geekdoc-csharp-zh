    \  .Options;\n        _dbContext = new BlogDbContext(options);\n        _postRepository\
    \ = new PostRepository(_dbContext);\n    }\n\n    [Test]\n    public async Task\
    \ AddPost_Should_Add_Post_To_Database()\n    {\n        // Arrange\n        var\
    \ post = new Post\n        {\n            Title = \"Test Post\",\n           \
    \ Content = \"This is a test post.\",\n            CreatedAt = DateTime.UtcNow,\n\
    \            UpdatedAt = DateTime.UtcNow\n        };\n\n        // Act\n     \
    \   await _postRepository.AddAsync(post);\n\n        // Assert\n        var result\
