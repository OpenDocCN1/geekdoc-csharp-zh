    \ 注入到视图中，我们可以执行以下操作：\n\n```html\n@inject MyApp.Application.IPostService PostService\n\
    ```\n\n然后，我们可以在视图中使用 `@PostService` 来访问该服务。\n\n在 ASP.NET Core MVC 应用程序中实现依赖注入对于构建可维护和可测试的代码库至关重要。通过在\
    \ `Startup` 类中注册服务并使用构造函数注入将它们注入到控制器中，我们促进了松散耦合并改善了应用程序的整体架构。此外，依赖注入使我们能够轻松地交换实现、为单元测试模拟依赖项以及遵循整洁架构原则。总体而言，将依赖注入融入\
    \ ASP.NET Core MVC 应用程序可提高代码质量、可扩展性和可维护性。\n\n## 利用 Minimal APIs 构建简洁高效的控制器（.NET\
