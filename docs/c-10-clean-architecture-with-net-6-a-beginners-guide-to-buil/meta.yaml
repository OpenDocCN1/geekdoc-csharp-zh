- md: "## Consuming the Business Logic Layer from ASP.NET Core MVC Controllers\n\n\
    Consuming the business logic layer from ASP.NET Core MVC controllers is a critical\
    \ aspect of building robust web applications that adhere to clean architecture\
    \ principles using C# 10 and .NET 6. In this guide, we'll explore how to integrate\
    \ and consume the application layer, which contains the business logic, from MVC\
    \ controllers.\n\n## Overview of Clean Architecture\n\nClean Architecture emphasizes\
    \ separation of concerns and independence of external frameworks. It consists\
    \ of multiple layers, including:\n\n- 1. **Presentation Layer:** Handles user\
    \ interaction and displays information to the user.\n- 2. **Application Layer:**\
    \ Contains application-specific business logic and orchestrates interactions between\
    \ the presentation and domain layers.\n- 3. **Domain Layer:** Contains core business\
    \ logic and entities.\n- 4. **Infrastructure Layer:** Implements external concerns\
    \ such as database access, external services, and logging.\n\n## Integrating Business\
    \ Logic Layer\n\nLet's integrate the application layer, which contains the business\
    \ logic, into the ASP.NET Core MVC project:\n\n- 1. Reference the application\
    \ layer project in the ASP.NET Core MVC project:\n\n```bash\ndotnet add reference\
    \ ../MyApp.Application/MyApp.Application.csproj\n```\n\n## Consuming Business\
    \ Logic from Controllers\n\nMVC controllers in ASP.NET Core are responsible for\
    \ handling incoming HTTP requests and invoking the appropriate methods from the\
    \ application layer. Let's create a controller and consume the business logic:\n\
    \n```csharp\nusing Microsoft.AspNetCore.Mvc;\nusing MyApp.Application;\n\nnamespace\
    \ MyApp.Web.Controllers\n{\n    public class PostController : Controller\n   \
    \ {\n        private readonly IPostService _postService;\n\n        public PostController(IPostService\
    \ postService)\n        {\n            _postService = postService;\n        }\n\
    \n        public IActionResult Index()\n        {\n            var posts = _postService.GetAllPosts();\n\
    \            return View(posts);\n        }\n\n        public IActionResult Details(int\
    \ id)\n        {\n            var post = _postService.GetPostById(id);\n     \
    \       if (post == null)\n            {\n                return NotFound();\n\
    \            }\n\n            return View(post);\n        }\n\n        // Other\
    \ controller actions for CRUD operations\n    }\n}\n```\n\nIn this code:\n\n-\
    \ 1. We inject an instance of the `IPostService` interface into the controller's\
    \ constructor using dependency injection.\n- 2. In the `Index` action, we call\
    \ the `GetAllPosts` method of the `IPostService` to retrieve all posts and pass\
    \ them to the view.\n- 3. In the `Details` action, we call the `GetPostById` method\
    \ of the `IPostService` to retrieve a specific post by ID and pass it to the view.\n\
    \n## Configuring Dependency Injection\n\nTo ensure that ASP.NET Core MVC controllers\
    \ can resolve dependencies from the application layer, we need to configure dependency\
    \ injection in the `Startup` class:\n\n```csharp\nusing Microsoft.Extensions.DependencyInjection;\n\
    using MyApp.Application;\n\nnamespace MyApp.Web\n{\n    public class Startup\n\
    \    {\n        public void ConfigureServices(IServiceCollection services)\n \
    \       {\n            services.AddControllersWithViews();\n\n            // Register\
    \ application services\n            services.AddScoped<IPostService, PostService>();\n\
    \        }\n\n        // Other configuration methods...\n    }\n}\n```\n\nIn the\
    \ `ConfigureServices` method, we register the `IPostService` interface and its\
    \ implementation (`PostService`) as scoped services. This allows ASP.NET Core\
    \ to create a new instance of `PostService` for each HTTP request and inject it\
    \ into controllers as needed.\n\nConsuming the business logic layer from ASP.NET\
    \ Core MVC controllers is essential for building maintainable and scalable web\
    \ applications. By injecting dependencies from the application layer into controllers\
    \ using dependency injection, we ensure separation of concerns and facilitate\
    \ testing and maintenance. Additionally, by adhering to clean architecture principles,\
    \ we create a clear and structured architecture that promotes code reuse, modularity,\
    \ and flexibility. Overall, integrating the business logic layer into MVC controllers\
    \ enhances the reliability and maintainability of the application.\n\n## Implementing\
    \ Dependency Injection in ASP.NET Core MVC Applications\n\nImplementing dependency\
    \ injection (DI) in ASP.NET Core MVC applications is crucial for promoting modularity,\
    \ testability, and maintainability. In this guide, we'll explore how to configure\
    \ and use dependency injection in an ASP.NET Core MVC application based on clean\
    \ architecture principles using C# 10 and .NET 6.\n\n## Overview of Dependency\
    \ Injection\n\nDependency injection is a design pattern where dependencies are\
    \ provided to a class from external sources rather than being created internally.\
    \ In ASP.NET Core MVC, dependency injection is built into the framework and allows\
    \ us to register services and inject them into controllers, views, and other components.\n\
    \n## Setting Up Dependency Injection\n\nLet's start by configuring dependency\
    \ injection in the ASP.NET Core MVC application:\n\n- 1. Open the `Startup.cs`\
    \ file in the ASP.NET Core MVC project.\n- 2. In the `ConfigureServices` method,\
    \ register services using the `IServiceCollection`:\n\n```csharp\nusing Microsoft.Extensions.DependencyInjection;\n\
    using MyApp.Application;\n\nnamespace MyApp.Web\n{\n    public class Startup\n\
    \    {\n        public void ConfigureServices(IServiceCollection services)\n \
    \       {\n            services.AddControllersWithViews();\n\n            // Register\
    \ application services\n            services.AddScoped<IPostService, PostService>();\n\
    \        }\n\n        // Other configuration methods...\n    }\n}\n```\n\nIn this\
    \ code:\n\n- We use the `AddScoped` method to register the `IPostService` interface\
    \ and its implementation (`PostService`) as scoped services. Scoped services are\
    \ created once per request and are disposed of at the end of the request.\n\n\
    ## Injecting Dependencies into Controllers\n\nOnce services are registered, we\
    \ can inject them into controllers using constructor injection. Let's inject the\
    \ `IPostService` into a controller:\n\n```csharp\nusing Microsoft.AspNetCore.Mvc;\n\
    using MyApp.Application;\n\nnamespace MyApp.Web.Controllers\n{\n    public class\
    \ PostController : Controller\n    {\n        private readonly IPostService _postService;\n\
    \n        public PostController(IPostService postService)\n        {\n       \
    \     _postService = postService;\n        }\n\n        // Controller actions...\n\
    \    }\n}\n```\n\nIn this code:\n\n- 1. We inject an instance of the `IPostService`\
    \ interface into the controller's constructor.\n- 2. ASP.NET Core MVC automatically\
    \ resolves the dependency and provides an instance of `PostService` when creating\
    \ an instance of `PostController`.\n\n## Consuming Services in Controller Actions\n\
    \nOnce the service is injected into the controller, we can use it in controller\
    \ actions:\n\n```csharp\npublic IActionResult Index()\n{\n    var posts = _postService.GetAllPosts();\n\
    \    return View(posts);\n}\n```\n\nIn this code:\n\n- We call the `GetAllPosts`\
    \ method of the injected `IPostService` to retrieve all posts.\n\n## Dependency\
    \ Injection in Views\n\nIn ASP.NET Core MVC, we can also inject services directly\
    \ into views using the `@inject` directive. For example, to inject the `IPostService`\
    \ into a view, we can do the following:\n\n```html\n@inject MyApp.Application.IPostService\
    \ PostService\n```\n\nThen, we can use `@PostService` to access the service within\
    \ the view.\n\nImplementing dependency injection in ASP.NET Core MVC applications\
    \ is essential for building maintainable and testable codebases. By registering\
    \ services in the `Startup` class and injecting them into controllers using constructor\
    \ injection, we promote loose coupling and improve the overall architecture of\
    \ the application. Additionally, dependency injection enables us to easily swap\
    \ implementations, mock dependencies for unit testing, and adhere to clean architecture\
    \ principles. Overall, incorporating dependency injection into ASP.NET Core MVC\
    \ applications enhances code quality, scalability, and maintainability.\n\n##\
    \ Leveraging Minimal APIs for Concise and Efficient Controllers (New in .NET 6)\n\
    \nLeveraging Minimal APIs in .NET 6 offers a concise and efficient approach to\
    \ building controllers for ASP.NET Core applications. This feature allows developers\
    \ to define routes and handle requests with minimal ceremony, making it particularly\
    \ appealing for clean architecture solutions using C# 10 and .NET 6. In this guide,\
    \ we'll explore how to leverage Minimal APIs to create controllers in a clean\
    \ architecture project.\n\n## Overview of Minimal APIs\n\nMinimal APIs were introduced\
    \ in .NET 6 as a lightweight alternative to traditional MVC controllers. They\
    \ provide a streamlined syntax for defining routes and handling HTTP requests\
    \ without the need for separate controller classes. Minimal APIs are designed\
    \ to be simple, lightweight, and easy to understand, making them ideal for small\
    \ to medium-sized projects.\n\n## Setting Up Minimal APIs\n\nTo get started with\
    \ Minimal APIs in a clean architecture project, follow these steps:\n\n- 1. Ensure\
    \ you have .NET 6 installed on your machine.\n- 2. Create a new ASP.NET Core project\
    \ using the `web` template:\n- 3. Add references to the domain and application\
    \ layers:\n\n```bash\ndotnet new web -n MyApp.Web\n```\n\n```bash\ndotnet add\
    \ reference ../MyApp.Domain/MyApp.Domain.csproj\n```"
  mdcn: "## 从 ASP.NET Core MVC 控制器中使用业务逻辑层\n\n从 ASP.NET Core MVC 控制器中使用业务逻辑层，是构建遵循整洁架构原则、使用\
    \ C# 10 和 .NET 6 的健壮 Web 应用程序的关键方面。在本指南中，我们将探讨如何从 MVC 控制器中集成和使用包含业务逻辑的应用层。\n\n\
    ## 整洁架构概述\n\n整洁架构强调关注点分离和外部框架的独立性。它由多个层次组成，包括：\n\n- 1. **表示层：** 处理用户交互并向用户显示信息。\n\
    - 2. **应用层：** 包含特定于应用程序的业务逻辑，并协调表示层与领域层之间的交互。\n- 3. **领域层：** 包含核心业务逻辑和实体。\n- 4.\
    \ **基础设施层：** 实现外部关注点，如数据库访问、外部服务和日志记录。\n\n## 集成业务逻辑层\n\n让我们将包含业务逻辑的应用层集成到 ASP.NET\
    \ Core MVC 项目中：\n\n- 1. 在 ASP.NET Core MVC 项目中引用应用层项目：\n\n```bash\ndotnet add\
    \ reference ../MyApp.Application/MyApp.Application.csproj\n```\n\n## 从控制器中使用业务逻辑\n\
    \nASP.NET Core 中的 MVC 控制器负责处理传入的 HTTP 请求，并调用应用层中的相应方法。让我们创建一个控制器并使用业务逻辑：\n\n```csharp\n\
    using Microsoft.AspNetCore.Mvc;\nusing MyApp.Application;\n\nnamespace MyApp.Web.Controllers\n\
    {\n    public class PostController : Controller\n    {\n        private readonly\
    \ IPostService _postService;\n\n        public PostController(IPostService postService)\n\
    \        {\n            _postService = postService;\n        }\n\n        public\
    \ IActionResult Index()\n        {\n            var posts = _postService.GetAllPosts();\n\
    \            return View(posts);\n        }\n\n        public IActionResult Details(int\
    \ id)\n        {\n            var post = _postService.GetPostById(id);\n     \
    \       if (post == null)\n            {\n                return NotFound();\n\
    \            }\n\n            return View(post);\n        }\n\n        // 其他用于\
    \ CRUD 操作的控制器操作\n    }\n}\n```\n\n在此代码中：\n\n- 1. 我们使用依赖注入将 `IPostService` 接口的实例注入到控制器的构造函数中。\n\
    - 2. 在 `Index` 操作中，我们调用 `IPostService` 的 `GetAllPosts` 方法来检索所有文章，并将它们传递给视图。\n\
    - 3. 在 `Details` 操作中，我们调用 `IPostService` 的 `GetPostById` 方法通过 ID 检索特定文章，并将其传递给视图。\n\
    \n## 配置依赖注入\n\n为确保 ASP.NET Core MVC 控制器能够从应用层解析依赖项，我们需要在 `Startup` 类中配置依赖注入：\n\
    \n```csharp\nusing Microsoft.Extensions.DependencyInjection;\nusing MyApp.Application;\n\
    \nnamespace MyApp.Web\n{\n    public class Startup\n    {\n        public void\
    \ ConfigureServices(IServiceCollection services)\n        {\n            services.AddControllersWithViews();\n\
    \n            // 注册应用服务\n            services.AddScoped<IPostService, PostService>();\n\
    \        }\n\n        // 其他配置方法...\n    }\n}\n```\n\n在 `ConfigureServices` 方法中，我们将\
    \ `IPostService` 接口及其具体实现（`PostService`）注册为作用域服务。这允许 ASP.NET Core 为每个 HTTP 请求创建一个新的\
    \ `PostService` 实例，并根据需要将其注入到控制器中。\n\n从 ASP.NET Core MVC 控制器中使用业务逻辑层对于构建可维护和可扩展的\
    \ Web 应用程序至关重要。通过使用依赖注入将应用层的依赖项注入到控制器中，我们确保了关注点分离，并促进了测试和维护。此外，通过遵循整洁架构原则，我们创建了一个清晰且结构化的架构，促进了代码重用、模块化和灵活性。总体而言，将业务逻辑层集成到\
    \ MVC 控制器中增强了应用程序的可靠性和可维护性。\n\n## 在 ASP.NET Core MVC 应用程序中实现依赖注入\n\n在 ASP.NET\
    \ Core MVC 应用程序中实现依赖注入对于促进模块化、可测试性和可维护性至关重要。在本指南中，我们将探讨如何在基于整洁架构原则、使用 C# 10 和\
    \ .NET 6 的 ASP.NET Core MVC 应用程序中配置和使用依赖注入。\n\n## 依赖注入概述\n\n依赖注入是一种设计模式，其中依赖项从外部源提供给类，而不是在内部创建。在\
    \ ASP.NET Core MVC 中，依赖注入内置于框架中，允许我们注册服务并将其注入到控制器、视图和其他组件中。\n\n## 设置依赖注入\n\n让我们从在\
