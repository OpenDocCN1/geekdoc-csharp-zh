    # Appendix


    # Glossary’s of terms


    Here’s a glossary of terms based on C# 10 Clean Architecture with .NET 6:


    +   1. **Clean Architecture:** A software architectural pattern that emphasizes
    separation of concerns, independence of frameworks, and testability of components.

    2. **C# 10:** The latest version of the C# programming language, featuring new
    language features and enhancements for improved developer productivity and code
    expressiveness.

    3. **.NET 6:** The latest release of the .NET platform, offering improvements
    in performance, productivity, and cross-platform support for building a wide range
    of applications.

    4. **Domain Entities:** Objects representing real-world concepts or entities within
    the domain of the application, typically containing properties and methods that
    model the behavior of the entity.

    5. **Repositories:** Components responsible for abstracting data access logic,
    providing an interface for accessing and manipulating data from external data
    sources such as databases.

    6. **Application Services:** Components responsible for implementing business
    logic and use cases of the application, orchestrating interactions between domain
    entities and repositories.

    7. **API Endpoints:** Entry points for interacting with the application, typically
    implemented as HTTP endpoints in web applications, allowing clients to perform
    CRUD (Create, Read, Update, Delete) operations on resources.

    8. **Dependency Injection (DI):** A design pattern and technique for implementing
    inversion of control, where dependencies are injected into a component from an
    external source, enabling loose coupling and easier testing.

    9. **Routing:** The process of mapping incoming requests to corresponding endpoints
    or controllers within the application, typically defined using route patterns
    that match specific URL patterns.

    10. **Middleware:** Components that are executed in the request processing pipeline
    of an ASP.NET Core application, allowing for cross-cutting concerns such as logging,
    authentication, and error handling to be applied uniformly to incoming requests.

    11. **Entity Framework Core:** An object-relational mapping (ORM) framework for
    .NET that enables developers to work with relational databases using object-oriented
    concepts, simplifying data access and persistence operations.

    12. **Unit Testing:** The practice of writing automated tests to verify the behavior
    of individual components or units of code in isolation, ensuring that each unit
    behaves as expected under different conditions.

    13. **Integration Testing:** The practice of testing interactions between multiple
    components or'
  - '[PAGE 164]


    modules of the application to ensure that they work together correctly as a whole,
    typically involving testing across layers or boundaries.


    **14. End-to-End Testing:** The practice of testing the entire application from
    the user''s perspective, simulating user interactions and verifying that the application
    behaves correctly in real-world scenarios.


    **15. Continuous Integration (CI):** A development practice where code changes
    are automatically integrated into a shared repository and tested continuously,
    ensuring that the codebase remains stable and ready for deployment.


    **16. Continuous Delivery (CD):** A development practice where changes to the
    codebase are automatically deployed to production or staging environments after
    passing through automated tests and quality checks.'
