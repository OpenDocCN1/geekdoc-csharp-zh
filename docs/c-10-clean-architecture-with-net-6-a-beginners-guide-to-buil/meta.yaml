    \ the Dependency Inversion Principle\n\nThe Dependency Inversion Principle states\
    \ that high-level modules should not depend on low-level modules but should depend\
    \ on abstractions. This principle promotes the use of interfaces or abstract classes\
    \ to define contracts between components, allowing implementations to vary independently.\n\
    \n# Applying Dependency Inversion in Clean Architecture\n\nIn a clean architecture\
    \ project, the Dependency Inversion Principle is applied to ensure that high-level\
    \ modules (such as use cases or application services) depend on abstractions (interfaces)\
    \ rather than concrete implementations (such as data access or external services).\n\
    \n# Example Scenario\n\nLet's consider a scenario where an application service\
