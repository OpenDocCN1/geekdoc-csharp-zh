- md: "## Chapter 8\n\n### Implementing Data Persistence with .NET\n\n### Choosing\
    \ the Right Data Access Technology (.NET Entity Framework Core)\n\nIn clean architecture,\
    \ selecting the appropriate data access technology is crucial for building scalable,\
    \ maintainable, and efficient applications. .NET Entity Framework Core is a popular\
    \ choice for data access in .NET applications due to its ease of use, flexibility,\
    \ and rich feature set. In this guide, we'll explore the considerations for choosing\
    \ .NET Entity Framework Core as the data access technology in a C# 10 application\
    \ based on clean architecture principles, accompanied by code examples.\n\n###\
    \ Considerations for Choosing .NET Entity Framework Core\n\n1. **Ease of Use:**\
    \ .NET Entity Framework Core provides a high-level abstraction over the database,\
    \ allowing developers to interact with the database using familiar object-oriented\
    \ concepts such as entities, relationships, and LINQ queries. This simplifies\
    \ data access code and reduces the amount of boilerplate code required.\n2. **ORM\
    \ Features:** .NET Entity Framework Core offers a wide range of features such\
    \ as automatic change tracking, lazy loading, and query translation. These features\
    \ streamline development and improve productivity by handling many common database\
    \ operations automatically.\n3. **Cross-Platform Support:** .NET Entity Framework\
    \ Core is cross-platform and can be used with .NET Core, .NET Framework, and .NET\
    \ 5/6. This ensures compatibility across different environments and enables developers\
    \ to build applications that run on various operating systems.\n4. **Performance:**\
    \ .NET Entity Framework Core has made significant performance improvements over\
    \ its predecessors, offering better performance for both read and write operations.\
    \ It also provides features like query caching and compiled queries to optimize\
    \ performance further.\n5. **Integration with Clean Architecture:** .NET Entity\
    \ Framework Core integrates well with clean architecture principles, allowing\
    \ developers to design data access code that is decoupled from the rest of the\
    \ application layers. This facilitates easier testing, maintenance, and evolution\
    \ of the application.\n\n### Example of Using .NET Entity Framework Core in Clean\
    \ Architecture\n\nLet's demonstrate how to use .NET Entity Framework Core in a\
    \ clean architecture application to interact with a database:\n\n```csharp\n//\
    \ Infrastructure Layer\n\npublic class TodoDbContext : DbContext\n{\n    public\
    \ TodoDbContext(DbContextOptions<TodoDbContext> options) : base(options)\n   \
    \ {\n    }\n\n    public DbSet<TodoItem> TodoItems { get; set; }\n}\n\npublic\
    \ class TodoRepository : IRepository<TodoItem>\n{\n    private readonly TodoDbContext\
    \ _dbContext;\n\n    public TodoRepository(TodoDbContext dbContext)\n    {\n \
    \       _dbContext = dbContext;\n    }\n\n    public IEnumerable<TodoItem> GetAll()\n\
    \    {\n        return _dbContext.TodoItems.ToList();\n    }\n\n    public TodoItem\
    \ GetById(int id)\n    {\n        return _dbContext.TodoItems.Find(id);\n    }\n\
    \n    public void Add(TodoItem entity)\n    {\n        _dbContext.TodoItems.Add(entity);\n\
    \        _dbContext.SaveChanges();\n    }\n\n    public void Update(TodoItem entity)\n\
    \    {\n        _dbContext.TodoItems.Update(entity);\n        _dbContext.SaveChanges();\n\
    \    }\n\n    public void Delete(TodoItem entity)\n    {\n        _dbContext.TodoItems.Remove(entity);\n\
    \        _dbContext.SaveChanges();\n    }\n}\n```\n\nIn this example:\n\n1. The\
    \ `TodoDbContext` class represents the database context and provides access to\
    \ the `TodoItem` entities.\n2. The `TodoRepository` class implements the repository\
    \ pattern and interacts with the database using .NET Entity Framework Core.\n\n\
    ### Configuring Entity Framework Core in the Startup Class\n\nTo configure .NET\
    \ Entity Framework Core in the application, you need to register the database\
    \ context and repositories in the startup class:\n\n```csharp\n// Startup Configuration\n\
    public void ConfigureServices(IServiceCollection services)\n{\n    services.AddDbContext<TodoDbContext>(options\
    \ =>\n        options.UseSqlServer(Configuration.GetConnectionString(\"DefaultConnection\"\
    )));\n\n    services.AddScoped<IRepository<TodoItem>, TodoRepository>();\n\n \
    \   // Other service registrations...\n}\n```\n\nChoosing the right data access\
    \ technology is critical for the success of a clean architecture application.\
    \ .NET Entity Framework Core offers many advantages such as ease of use, cross-platform\
    \ support, and integration with clean architecture principles. By leveraging .NET\
    \ Entity Framework Core, developers can build robust, maintainable, and efficient\
    \ applications that scale with ease. Whether you're building a small-scale application\
    \ or a large enterprise system, .NET Entity Framework Core provides the tools\
    \ and features necessary to meet your data access requirements while adhering\
    \ to clean architecture principles.\n\n### Defining Data Models and Mapping Entities\
    \ for Persistence\n\nDefining data models and mapping entities for persistence\
    \ is a crucial aspect of software development, especially in the context of clean\
    \ architecture using C# 10 and .NET 6. In this guide, we'll delve into what data\
    \ models are, how to define them, and how to map entities for persistence in C#\
    \ 10 with .NET 6.\n\n### What are Data Models?\n\nData models represent the structure\
    \ and relationships of data within a system. They serve as blueprints for organizing\
    \ and manipulating data in software applications. In C# 10 with .NET 6, data models\
    \ are typically represented using classes.\n\nLet's define a simple data model\
    \ for a blog application:\n\n```csharp\npublic class Post\n{\n    public int Id\
    \ { get; set; }\n    public string Title { get; set; }\n    public string Content\
    \ { get; set; }\n    public DateTime CreatedAt { get; set; }\n    public DateTime\
    \ UpdatedAt { get; set; }\n}\n```\n\nIn this example, the `Post` class represents\
    \ a blog post with properties such as `Id`, `Title`, `Content`, `CreatedAt`, and\
    \ `UpdatedAt`.\n\n### Mapping Entities for Persistence\n\nMapping entities for\
    \ persistence involves defining how data models are stored and retrieved from\
    \ a data source, such as a database. In C# 10 with .NET 6, this is typically achieved\
    \ using an Object-Relational Mapper (ORM) like Entity Framework Core.\n\nIn this\
    \ example:\n\n1. The `TodoListViewModel` class implements an interface `ITodoListViewModel`\
    \ that defines the contract for interacting with todo items in the presentation\
    \ layer.\n2. The `TodoListViewModel` class depends on an abstraction `ITodoService`\
    \ for interacting with todo items, allowing for flexibility and testability.\n\
    \n## Registering Dependencies with Dependency Injection Container\n\nTo use dependency\
    \ injection in the presentation layer, dependencies need to be registered with\
    \ the dependency injection container. In the startup configuration of the application,\
    \ dependencies can be registered as follows:\n\n```csharp\n// Dependency Injection\
    \ Configuration\n\nservices.AddSingleton<ITodoService, TodoService>();\n\nservices.AddSingleton<ITodoListViewModel,\
    \ TodoListViewModel>();\n```\n\nImplementing dependency injection in the presentation\
    \ layer of a clean architecture application promotes flexibility, testability,\
    \ and maintainability. By depending on abstractions rather than concrete implementations,\
    \ components in the presentation layer become easier to test and more adaptable\
    \ to changing requirements. Separating concerns and decoupling dependencies allows\
    \ for greater modularity and extensibility, making it easier to evolve the application\
    \ over time. With dependency injection, developers can build clean architecture\
    \ applications that are robust, maintainable, and scalable.\n\n```csharp\n{\n\
    \    TodoItems.Clear();\n    var todoItems = _todoService.GetAllTodoItems();\n\
    \    foreach (var todoItem in todoItems)\n    {\n        TodoItems.Add(todoItem);\n\
    \    }\n}\n\npublic void AddTodoItem(string title)\n{\n    var newTodoItem = new\
    \ TodoItem { Title = title };\n    _todoService.AddTodoItem(newTodoItem);\n  \
    \  TodoItems.Add(newTodoItem);\n}\n\npublic void UpdateTodoItem(TodoItem todoItem)\n\
    {\n    _todoService.UpdateTodoItem(todoItem);\n}\n\npublic void DeleteTodoItem(int\
    \ id)\n{\n    _todoService.DeleteTodoItem(id);\n    var todoItemToRemove = TodoItems.FirstOrDefault(item\
    \ => item.Id == id);\n    if (todoItemToRemove != null)\n    {\n        TodoItems.Remove(todoItemToRemove);\n\
    \    }\n}\n```"
  mdcn: "## 第8章\n\n### 使用 .NET 实现数据持久化\n\n### 选择合适的数据访问技术（.NET Entity Framework Core）\n\
    \n在整洁架构中，选择合适的数据访问技术对于构建可扩展、可维护和高效的应用程序至关重要。.NET Entity Framework Core 因其易用性、灵活性和丰富的功能集，成为\
    \ .NET 应用程序中数据访问的热门选择。在本指南中，我们将探讨在基于整洁架构原则的 C# 10 应用程序中，选择 .NET Entity Framework\
    \ Core 作为数据访问技术的考量因素，并附有代码示例。\n\n### 选择 .NET Entity Framework Core 的考量因素\n\n1.\
    \  **易用性：** .NET Entity Framework Core 在数据库之上提供了高级抽象，允许开发者使用熟悉的面向对象概念（如实体、关系和\
    \ LINQ 查询）与数据库交互。这简化了数据访问代码，并减少了所需的样板代码量。\n2.  **ORM 功能：** .NET Entity Framework\
    \ Core 提供了广泛的功能，如自动变更跟踪、延迟加载和查询翻译。这些功能通过自动处理许多常见的数据库操作，简化了开发并提高了生产力。\n3.  **跨平台支持：**\
    \ .NET Entity Framework Core 是跨平台的，可用于 .NET Core、.NET Framework 和 .NET 5/6。这确保了在不同环境中的兼容性，并使开发者能够构建可在各种操作系统上运行的应用程序。\n\
    4.  **性能：** .NET Entity Framework Core 相较于其前代版本在性能上有了显著提升，为读写操作提供了更好的性能。它还提供了查询缓存和编译查询等功能，以进一步优化性能。\n\
    5.  **与整洁架构的集成：** .NET Entity Framework Core 与整洁架构原则集成良好，允许开发者设计与应用程序其他层解耦的数据访问代码。这有助于应用程序的测试、维护和演进。\n\
    \n### 在整洁架构中使用 .NET Entity Framework Core 的示例\n\n让我们演示如何在整洁架构应用程序中使用 .NET Entity\
    \ Framework Core 与数据库交互：\n\n```csharp\n// 基础设施层\n\npublic class TodoDbContext\
    \ : DbContext\n{\n    public TodoDbContext(DbContextOptions<TodoDbContext> options)\
    \ : base(options)\n    {\n    }\n\n    public DbSet<TodoItem> TodoItems { get;\
    \ set; }\n}\n\npublic class TodoRepository : IRepository<TodoItem>\n{\n    private\
    \ readonly TodoDbContext _dbContext;\n\n    public TodoRepository(TodoDbContext\
    \ dbContext)\n    {\n        _dbContext = dbContext;\n    }\n\n    public IEnumerable<TodoItem>\
    \ GetAll()\n    {\n        return _dbContext.TodoItems.ToList();\n    }\n\n  \
    \  public TodoItem GetById(int id)\n    {\n        return _dbContext.TodoItems.Find(id);\n\
    \    }\n\n    public void Add(TodoItem entity)\n    {\n        _dbContext.TodoItems.Add(entity);\n\
    \        _dbContext.SaveChanges();\n    }\n\n    public void Update(TodoItem entity)\n\
    \    {\n        _dbContext.TodoItems.Update(entity);\n        _dbContext.SaveChanges();\n\
    \    }\n\n    public void Delete(TodoItem entity)\n    {\n        _dbContext.TodoItems.Remove(entity);\n\
    \        _dbContext.SaveChanges();\n    }\n}\n```\n\n在此示例中：\n\n1.  `TodoDbContext`\
    \ 类代表数据库上下文，并提供对 `TodoItem` 实体的访问。\n2.  `TodoRepository` 类实现了仓储模式，并使用 .NET Entity\
    \ Framework Core 与数据库交互。\n\n### 在 Startup 类中配置 Entity Framework Core\n\n要在应用程序中配置\
    \ .NET Entity Framework Core，你需要在 startup 类中注册数据库上下文和仓储：\n\n```csharp\n// Startup\
    \ 配置\npublic void ConfigureServices(IServiceCollection services)\n{\n    services.AddDbContext<TodoDbContext>(options\
    \ =>\n        options.UseSqlServer(Configuration.GetConnectionString(\"DefaultConnection\"\
    )));\n\n    services.AddScoped<IRepository<TodoItem>, TodoRepository>();\n\n \
    \   // 其他服务注册...\n}\n```\n\n选择合适的数据访问技术对于整洁架构应用程序的成功至关重要。.NET Entity Framework\
    \ Core 提供了诸多优势，如易用性、跨平台支持以及与整洁架构原则的集成。通过利用 .NET Entity Framework Core，开发者可以构建健壮、可维护且高效的应用程序，并能轻松扩展。无论你是在构建小型应用程序还是大型企业系统，.NET\
    \ Entity Framework Core 都提供了必要的工具和功能，以满足你的数据访问需求，同时遵循整洁架构原则。\n\n### 定义数据模型和映射实体以实现持久化\n\
    \n定义数据模型和映射实体以实现持久化是软件开发的一个关键方面，尤其是在使用 C# 10 和 .NET 6 的整洁架构背景下。在本指南中，我们将深入探讨什么是数据模型、如何定义它们，以及如何在\
    \ C# 10 和 .NET 6 中映射实体以实现持久化。\n\n### 什么是数据模型？\n\n数据模型代表了系统中数据的结构和关系。它们是软件应用程序中组织和操作数据的蓝图。在\
    \ C# 10 和 .NET 6 中，数据模型通常使用类来表示。\n\n让我们为一个博客应用程序定义一个简单的数据模型：\n\n```csharp\npublic\
    \ class Post\n{\n    public int Id { get; set; }\n    public string Title { get;\
    \ set; }\n    public string Content { get; set; }\n    public DateTime CreatedAt\
    \ { get; set; }\n    public DateTime UpdatedAt { get; set; }\n}\n```\n\n在此示例中，`Post`\
