- md: "## Consuming the Business Logic Layer from the Presentation Layer\n\nIn clean\
    \ architecture, the presentation layer is responsible for interacting with users\
    \ and presenting information to them. This layer should be decoupled from the\
    \ business logic layer to ensure modularity, maintainability, and testability\
    \ of the application. Consuming the business logic layer from the presentation\
    \ layer involves accessing and invoking the functionality provided by the business\
    \ logic layer in a clean and decoupled manner. In this guide, we'll explore how\
    \ to consume the business logic layer from the presentation layer in a C# 10 application\
    \ built with .NET 6, with code examples based on clean architecture principles.\n\
    \n## Principles for Consuming the Business Logic Layer\n\n- 1. **Dependency Injection:**\
    \ Use dependency injection to provide access to the business logic layer components\
    \ from the presentation layer. This allows the presentation layer to depend on\
    \ abstractions rather than concrete implementations, promoting loose coupling\
    \ and flexibility.\n- 2. **Interface Segregation:** Define clear interfaces in\
    \ the business logic layer that expose the functionality needed by the presentation\
    \ layer. This ensures that the presentation layer only depends on the functionality\
    \ it requires, avoiding unnecessary coupling.\n- 3. **Encapsulation:** Encapsulate\
    \ complex business logic within the business logic layer and expose it through\
    \ well-defined interfaces. This hides implementation details and promotes separation\
    \ of concerns between the presentation and business logic layers.\n\n## Consuming\
    \ Business Logic Layer from Presentation Layer\n\nLet's consider an example of\
    \ consuming the business logic layer from the presentation layer in a simple to-do\
    \ list application:\n\n```csharp\n// Business Logic Layer (Application Layer)\n\
    \npublic interface ITodoService\n{\n    IEnumerable<TodoItem> GetAllTodoItems();\n\
    \    void AddTodoItem(TodoItem todoItem);\n    void UpdateTodoItem(TodoItem todoItem);\n\
    \    void DeleteTodoItem(int id);\n}\n\npublic class TodoService : ITodoService\n\
    {\n    private readonly IRepository<TodoItem> _todoRepository;\n    public TodoService(IRepository<TodoItem>\
    \ todoRepository)\n    {\n        _todoRepository = todoRepository;\n    }\n \
    \   public IEnumerable<TodoItem> GetAllTodoItems()\n    {\n        return _todoRepository.GetAll();\n\
    \    }\n    public void AddTodoItem(TodoItem todoItem)\n    {\n        _todoRepository.Add(todoItem);\n\
    \    }\n    public void UpdateTodoItem(TodoItem todoItem)\n    {\n        _todoRepository.Update(todoItem);\n\
    \    }\n    public void DeleteTodoItem(int id)\n    {\n        var todoItem =\
    \ _todoRepository.GetById(id);\n        if (todoItem != null)\n        {\n   \
    \         _todoRepository.Delete(todoItem);\n        }\n    }\n}\n// Presentation\
    \ Layer\npublic class TodoListViewModel\n{\n    private readonly ITodoService\
    \ _todoService;\n    public ObservableCollection<TodoItem> TodoItems { get; }\
    \ = new ObservableCollection<TodoItem>();\n\n    public TodoListViewModel(ITodoService\
    \ todoService)\n    {\n        _todoService = todoService;\n        LoadTodoItems();\n\
    \    }\n\n    private void LoadTodoItems()\n    {\n        TodoItems.Clear();\n\
    \        var todoItems = _todoService.GetAllTodoItems();\n        foreach (var\
    \ todoItem in todoItems)\n        {\n            TodoItems.Add(todoItem);\n  \
    \      }\n    }\n\n    public void AddTodoItem(string title)\n    {\n        var\
    \ newTodoItem = new TodoItem { Title = title };\n        _todoService.AddTodoItem(newTodoItem);\n\
    \        TodoItems.Add(newTodoItem);\n    }\n\n    public void UpdateTodoItem(TodoItem\
    \ todoItem)\n    {\n        _todoService.UpdateTodoItem(todoItem);\n    }\n\n\
    \    public void DeleteTodoItem(int id)\n    {\n        _todoService.DeleteTodoItem(id);\n\
    \n        var todoItemToRemove = TodoItems.FirstOrDefault(item => item.Id == id);\n\
    \n        if (todoItemToRemove != null)\n        {\n            TodoItems.Remove(todoItemToRemove);\n\
    \        }\n    }\n}\n```\n\nIn this example:\n\n- 1. The business logic layer\
    \ (`TodoService`) defines an interface `ITodoService` to expose todo list management\
    \ operations.\n- 2. The presentation layer (`TodoListViewModel`) consumes the\
    \ `ITodoService` interface through dependency injection to interact with the business\
    \ logic layer.\n\nConsuming the business logic layer from the presentation layer\
    \ is a critical aspect of clean architecture, ensuring that the presentation layer\
    \ remains decoupled from the underlying business logic. By following principles\
    \ such as dependency injection, interface segregation, and encapsulation, developers\
    \ can create modular and maintainable applications. Separating concerns between\
    \ the presentation and business logic layers enables flexibility, scalability,\
    \ and testability, allowing for easier evolution and maintenance of the software\
    \ system over time.\n\n## Implementing Dependency Injection in the Presentation\
    \ Layer for Flexibility\n\nDependency injection (DI) is a powerful design pattern\
    \ that promotes loose coupling and flexibility in software systems by decoupling\
    \ dependencies from their consumers. In the context of clean architecture and\
    \ C# 10 with .NET 6, implementing dependency injection in the presentation layer\
    \ enhances flexibility and maintainability. It allows components in the presentation\
    \ layer to depend on abstractions rather than concrete implementations, facilitating\
    \ easier testing, extensibility, and evolution of the application. In this guide,\
    \ we'll explore how to implement dependency injection in the presentation layer\
    \ of a clean architecture application, accompanied by code examples based on C#\
    \ 10 and .NET 6.\n\n## Benefits of Dependency Injection in the Presentation Layer\n\
    \n- 1. **Decoupling:** Dependency injection decouples components in the presentation\
    \ layer from their dependencies, reducing tight coupling and promoting modularity.\
    \ This makes it easier to replace or modify dependencies without impacting the\
    \ rest of the system.\n- 2. **Testability**: By depending on abstractions rather\
    \ than concrete implementations, components in the presentation layer become easier\
    \ to test. Mock or stub implementations can be provided during testing, allowing\
    \ for isolated unit tests that focus on specific behavior.\n- 3. **Flexibility**:\
    \ Dependency injection enables greater flexibility in the presentation layer by\
    \ facilitating the use of different implementations of dependencies. This allows\
    \ developers to adapt the application to changing requirements or integrate new\
    \ features more easily.\n\n## Implementing Dependency Injection in the Presentation\
    \ Layer\n\nLet's demonstrate how to implement dependency injection in the presentation\
    \ layer of a clean architecture application:\n\n```csharp\n// Presentation Layer\n\
    \npublic interface ITodoListViewModel\n{\n    ObservableCollection<TodoItem> TodoItems\
    \ { get; }\n\n    void AddTodoItem(string title);\n\n    void UpdateTodoItem(TodoItem\
    \ todoItem);\n\n    void DeleteTodoItem(int id);\n}\n\npublic class TodoListViewModel\
    \ : ITodoListViewModel\n{\n    private readonly ITodoService _todoService;\n\n\
    \    public ObservableCollection<TodoItem> TodoItems { get; } = new ObservableCollection<TodoItem>();\n\
    \n    public TodoListViewModel(ITodoService todoService)\n    {\n        _todoService\
    \ = todoService;\n\n        LoadTodoItems();\n    }\n\n    private void LoadTodoItems()\n\
    \    {\n        // Implementation to load todo items\n    }\n}\n```"
  mdcn: "## 从表示层消费业务逻辑层\n\n在整洁架构中，表示层负责与用户交互并向其呈现信息。该层应与业务逻辑层解耦，以确保应用程序的模块化、可维护性和可测试性。从表示层消费业务逻辑层涉及以清晰且解耦的方式访问和调用业务逻辑层提供的功能。在本指南中，我们将探讨如何在基于\
    \ .NET 6 构建的 C# 10 应用程序中，从表示层消费业务逻辑层，代码示例将遵循整洁架构原则。\n\n## 消费业务逻辑层的原则\n\n- 1. **依赖注入：**\
    \ 使用依赖注入，从表示层提供对业务逻辑层组件的访问。这使得表示层可以依赖抽象而非具体实现，从而促进松耦合和灵活性。\n- 2. **接口隔离：** 在业务逻辑层中定义清晰的接口，仅暴露表示层所需的功能。这确保了表示层只依赖于它所需的功能，避免了不必要的耦合。\n\
    - 3. **封装：** 将复杂的业务逻辑封装在业务逻辑层内部，并通过定义良好的接口将其暴露出来。这隐藏了实现细节，并促进了表示层与业务逻辑层之间的关注点分离。\n\
    \n## 从表示层消费业务逻辑层\n\n让我们考虑一个在简单的待办事项列表应用程序中，从表示层消费业务逻辑层的示例：\n\n```csharp\n// 业务逻辑层（应用层）\n\
    \npublic interface ITodoService\n{\n    IEnumerable<TodoItem> GetAllTodoItems();\n\
    \    void AddTodoItem(TodoItem todoItem);\n    void UpdateTodoItem(TodoItem todoItem);\n\
    \    void DeleteTodoItem(int id);\n}\n\npublic class TodoService : ITodoService\n\
    {\n    private readonly IRepository<TodoItem> _todoRepository;\n    public TodoService(IRepository<TodoItem>\
    \ todoRepository)\n    {\n        _todoRepository = todoRepository;\n    }\n \
    \   public IEnumerable<TodoItem> GetAllTodoItems()\n    {\n        return _todoRepository.GetAll();\n\
    \    }\n    public void AddTodoItem(TodoItem todoItem)\n    {\n        _todoRepository.Add(todoItem);\n\
    \    }\n    public void UpdateTodoItem(TodoItem todoItem)\n    {\n        _todoRepository.Update(todoItem);\n\
    \    }\n    public void DeleteTodoItem(int id)\n    {\n        var todoItem =\
    \ _todoRepository.GetById(id);\n        if (todoItem != null)\n        {\n   \
    \         _todoRepository.Delete(todoItem);\n        }\n    }\n}\n// 表示层\npublic\
    \ class TodoListViewModel\n{\n    private readonly ITodoService _todoService;\n\
    \    public ObservableCollection<TodoItem> TodoItems { get; } = new ObservableCollection<TodoItem>();\n\
    \n    public TodoListViewModel(ITodoService todoService)\n    {\n        _todoService\
    \ = todoService;\n        LoadTodoItems();\n    }\n\n    private void LoadTodoItems()\n\
    \    {\n        TodoItems.Clear();\n        var todoItems = _todoService.GetAllTodoItems();\n\
    \        foreach (var todoItem in todoItems)\n        {\n            TodoItems.Add(todoItem);\n\
    \        }\n    }\n\n    public void AddTodoItem(string title)\n    {\n      \
    \  var newTodoItem = new TodoItem { Title = title };\n        _todoService.AddTodoItem(newTodoItem);\n\
    \        TodoItems.Add(newTodoItem);\n    }\n\n    public void UpdateTodoItem(TodoItem\
    \ todoItem)\n    {\n        _todoService.UpdateTodoItem(todoItem);\n    }\n\n\
    \    public void DeleteTodoItem(int id)\n    {\n        _todoService.DeleteTodoItem(id);\n\
    \n        var todoItemToRemove = TodoItems.FirstOrDefault(item => item.Id == id);\n\
    \n        if (todoItemToRemove != null)\n        {\n            TodoItems.Remove(todoItemToRemove);\n\
    \        }\n    }\n}\n```\n\n在此示例中：\n\n- 1. 业务逻辑层（`TodoService`）定义了一个接口 `ITodoService`，以暴露待办事项列表管理操作。\n\
    - 2. 表示层（`TodoListViewModel`）通过依赖注入消费 `ITodoService` 接口，从而与业务逻辑层交互。\n\n从表示层消费业务逻辑层是整洁架构的一个关键方面，它确保了表示层与底层业务逻辑保持解耦。通过遵循依赖注入、接口隔离和封装等原则，开发者可以创建模块化且易于维护的应用程序。在表示层和业务逻辑层之间分离关注点，能够实现灵活性、可扩展性和可测试性，从而便于软件系统随时间推移进行演进和维护。\n\
    \n## 在表示层实现依赖注入以增强灵活性\n\n依赖注入（DI）是一种强大的设计模式，它通过将依赖与其消费者解耦，来促进软件系统中的松耦合和灵活性。在整洁架构以及使用\
    \ .NET 6 的 C# 10 的背景下，在表示层实现依赖注入可以增强灵活性和可维护性。它允许表示层中的组件依赖于抽象而非具体实现，从而便于进行更轻松的测试、扩展和应用程序演进。在本指南中，我们将探讨如何在整洁架构应用程序的表示层中实现依赖注入，并提供基于\
    \ C# 10 和 .NET 6 的代码示例。\n\n## 在表示层使用依赖注入的好处\n\n- 1. **解耦：** 依赖注入将表示层中的组件与其依赖解耦，减少了紧耦合并促进了模块化。这使得在不影响系统其余部分的情况下替换或修改依赖变得更加容易。\n\
    - 2. **可测试性**：通过依赖抽象而非具体实现，表示层中的组件变得更容易测试。在测试期间可以提供模拟或桩实现，从而允许进行专注于特定行为的隔离单元测试。\n\
