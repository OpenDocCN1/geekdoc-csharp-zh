- md: "## 4. Infrastructure Layer (Class Library):\n\n```bash\ndotnet new classlib\
    \ -n MySolution.Infrastructure\n```\n\n## Step 4: Add Projects to Solution\n\n\
    **1. Add Projects to Solution:** Run the following commands to add projects to\
