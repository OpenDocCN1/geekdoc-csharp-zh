    # 第 7 章\n\n## 表示层：用户界面与交互\n\n### 设计用户界面时考虑关注点分离\n\n在整洁架构中，关注点分离是一个基本原则，它促进了软件系统的模块化、可维护性和可扩展性。在\
    \ C# 10 和 .NET 6 的背景下设计用户界面（UI）时，遵守这一原则至关重要，以确保 UI 与业务逻辑和基础设施关注点保持解耦。在本指南中，我们将探讨如何在设计用户界面时考虑关注点分离，并附上基于\
    \ C# 10 和 .NET 6 的代码示例。\n\n### 用户界面设计中的关注点分离\n\n用户界面设计中的关注点分离涉及将 UI 划分为不同的组件，每个组件负责呈现或行为的特定方面。通过分离关注点，开发人员可以在\
    \ UI 代码库中实现更高的模块化、可测试性和可维护性。\n\n### UI 设计中关注点分离的关键组件：\n\n1. **视图组件：** 代表 UI 的视觉元素，如屏幕、表单或小部件。视图组件负责渲染\
    \ UI 元素和捕获用户输入。\n2. **视图模型：** 充当 UI 和业务逻辑层之间的中介，包含特定于 UI 需求的数据和行为。视图模型封装了表示逻辑，并促进了\
    \ UI 和底层业务实体之间的数据绑定。\n3. **表示逻辑：** 处理用户交互、输入验证和其他与 UI 相关的逻辑。此逻辑应封装在 UI 组件内，以保持\
    \ UI 代码库的专注和可维护性。\n\n### 使用整洁架构设计用户界面\n\n在整洁架构项目中设计用户界面时，请遵循以下准则以确保关注点分离：\n\n\
