    \n### 集成测试：测试层间交互\n\n集成测试对于验证软件应用程序中层与层之间的交互至关重要，尤其是在使用 C# 10 和 .NET 6 遵循整洁架构原则时。集成测试确保组件协同工作并按预期通信，从而对整个系统的行为充满信心。在本指南中，我们将探讨如何编写集成测试来验证整洁架构项目中层与层之间的交互。\n\
