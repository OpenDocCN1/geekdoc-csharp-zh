    \          CreatedAt = DateTime.UtcNow,\n            UpdatedAt = DateTime.UtcNow\n\
    \        };\n\n        // Act\n        await _postRepository.AddAsync(post);\n\
    \n        // Assert\n        _dbContextMock.Verify(m => m.Posts.AddAsync(post,\
    \ default), Times.Once);\n        _dbContextMock.Verify(m => m.SaveChangesAsync(default),\
    \ Times.Once);\n    }\n\n    // 为其他 CRUD 操作和错误处理场景编写类似的测试\n}\n```\n\n在此代码中：\n\n\
    1.  我们使用 Moq 创建 `BlogDbContext` 的模拟实例。\n2.  在测试方法中，我们准备数据，通过调用仓储方法执行操作，然后断言模拟对象上的相应方法被调用。\n\
    \n对持久层进行单元测试对于确保软件应用程序中可靠的数据处理至关重要。通过为 CRUD 操作、错误处理场景和数据完整性约束编写单元测试，我们可以验证数据库操作是否按预期运行，并优雅地处理边界情况。此外，通过使用模拟库来隔离依赖项，我们可以专注于测试代码逻辑，而无需依赖外部资源。总的来说，对持久层进行单元测试增强了应用程序的可靠性和可维护性。\n\
    \n# 第 9 章\n\n## 使用 ASP.NET Core MVC 6 实现整洁架构\n\n### ASP.NET Core MVC 6 作为整洁架构中的表示层\n\
    \n在使用 C# 10 和 .NET 6 的整洁架构方法中，将 ASP.NET Core MVC 6 实现为表示层是构建健壮且可维护的 Web 应用程序的强大组合。在本指南中，我们将探讨如何将\
    \ ASP.NET Core MVC 6 结构化并集成到整洁架构解决方案中。\n\n#### 整洁架构概述\n\n整洁架构是一种软件设计模式，强调关注点分离以及框架和外部依赖项的独立性。它由多个层组成，包括：\n\
    \n1.  **表示层：** 处理用户交互并向用户显示信息。\n2.  **应用层：** 包含特定于应用程序的业务逻辑，并协调表示层和领域层之间的交互。\n\
    3.  **领域层：** 包含核心业务逻辑和实体。\n4.  **基础设施层：** 实现外部关注点，如数据库访问、外部服务和日志记录。\n\n#### 集成\
    \ ASP.NET Core MVC 6\n\n让我们从在整洁架构解决方案中设置 ASP.NET Core MVC 6 开始：\n\n1.  创建一个新的\
    \ ASP.NET Core Web 应用程序项目：\n\n```bash\ndotnet new web -n MyApp.Web\n```\n\n2.\
    \  添加对领域层的引用：\n\n```bash\ndotnet add reference ../MyApp.Domain/MyApp.Domain.csproj\n\
    ```\n\n3.  添加对应用层的引用：\n\n```bash\ndotnet add reference ../MyApp.Application/MyApp.Application.csproj\n\
    ```\n\n## 构建表示层\n\n在整洁架构解决方案中，表示层负责处理用户请求、呈现视图以及与应用层交互。让我们相应地构建表示层：\n\n```\nMyApp.Web/\n\
    |\n├── Controllers/\n│   └── HomeController.cs\n|\n├── Views/\n│   └── Home/\n\
    │       └── Index.cshtml\n|\n└── Startup.cs\n```\n\n## 创建控制器\n\nASP.NET Core MVC\
    \ 6 中的控制器处理传入的 HTTP 请求并执行相应的操作。让我们创建一个简单的 HomeController：\n\n```csharp\nusing\
    \ Microsoft.AspNetCore.Mvc;\nusing MyApp.Application;\n\nnamespace MyApp.Web.Controllers\n\
    {\n    public class HomeController : Controller\n    {\n        private readonly\
    \ IPostService _postService;\n\n        public HomeController(IPostService postService)\n\
    \        {\n            _postService = postService;\n        }\n\n        public\
    \ IActionResult Index()\n        {\n            var posts = _postService.GetAllPosts();\n\
    \            return View(posts);\n        }\n    }\n}\n```\n\n## 定义视图\n\nASP.NET\
    \ Core MVC 6 中的视图负责向客户端呈现 HTML 标记。让我们创建一个简单的 Index 视图来显示帖子列表：\n\n```html\n<!--\
    \ Views/Home/Index.cshtml -->\n@model List<MyApp.Domain.Post>\n<h1>Posts</h1>\n\
    <ul>\n    @foreach (var post in Model)\n    {\n        <li>@post.Title</li>\n\
    \    }\n</ul>\n```\n\n## 配置依赖注入\n\n在 ASP.NET Core MVC 6 中，我们可以在 Startup 类中配置依赖注入。让我们注册来自应用层的服务：\n\
    \n```csharp\nusing Microsoft.AspNetCore.Builder;\nusing Microsoft.AspNetCore.Hosting;\n\
    using Microsoft.Extensions.DependencyInjection;\nusing MyApp.Application;\n\n\
    namespace MyApp.Web\n{\n    public class Startup\n    {\n        public void ConfigureServices(IServiceCollection\
    \ services)\n        {\n            services.AddControllersWithViews();\n    \
    \        // 注册应用服务\n            services.AddScoped<IPostService, PostService>();\n\
    \        }\n\n        public void Configure(IApplicationBuilder app, IWebHostEnvironment\
    \ env)\n        {\n            if (env.IsDevelopment())\n            {\n     \
    \           app.UseDeveloperExceptionPage();\n            }\n            app.UseStaticFiles();\n\
    \            app.UseRouting();\n            app.UseEndpoints(endpoints =>\n  \
    \          {\n                endpoints.MapControllerRoute(\n                \
    \    name: \"default\",\n                    pattern: \"{controller=Home}/{action=Index}/{id?}\"\
    );\n            });\n        }\n    }\n}\n```"
