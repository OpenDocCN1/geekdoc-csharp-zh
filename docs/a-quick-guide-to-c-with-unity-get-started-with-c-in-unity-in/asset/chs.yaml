  \ is now 1”和“Our new speed is now 2”。\n\n## 常见错误及其含义\n\n当你开始开启 C# 编码之旅时，你有时可能会发现很难解释\
  \ Unity 在控制台中产生的错误。然而，在经过一些练习后，你将能够识别它们、理解它们（并避免它们），以及进行相应的修复。接下来的列表列出了我的学生在开始编写\
  \ C# 编码时经常遇到的错误。\n\n当发生错误时，Unity 通常会为你提供足够的信息来检查错误发生的位置，以便你进行修复。虽然许多错误显而易见，但另一些则更难发现。在下面，我列出了你开始学习\
  \ C# 时会遇到的一些常见错误。秘诀在于识别错误信息，以便你理解 Unity 想要告诉你的什么。再次强调，这是学习过程的一部分，你**将会**犯下这些错误，但当你看到这些错误时，你将学会理解它们（并避免它们\
  \ :-))）。再次，，Unity 正在尽其所能通过与你交流来告诉你问题所在；通过理解错误信息，我们可以轻松修复这些 bug。为了便于修复错误，Unity 在发生错误时通常会提供以下信息：\n\
  \n*   发现错误的脚本名称。\n*   发现错误的行号和列号。\n*   发现错误的描述。\n\n因此，如果 Unity 生成了以下消息 `Assets/Scripts/MyFirstScript.cs\
  \ (23,34) BCE0085: Unknown identifier: ‘localVariable’`，它告诉我们在名为 `MyFirstScript`\
  \ 的脚本中发生了错误，位置在第 `23` 行以及该行的第 34 个字符左右（即列）。在这条特定消息中，它告诉我们无法识别变量 `localVariable`。\n\
  \n因此，你可能会遇到以下错误（此列表在资源包中也有 pdf 文件格式提供，你可以打印并放在手边）：\n\n*   `;` expected : 此错误可能意味着你忘记在语句末尾添加分号。要修复此错误，只需转到错误信息中提到的行，并确保添加了分号。\n\
  *   `Unknown identifier` : 此错误可能意味着 Unity 不知道你提到的变量。这至少可能是由于三个原因引起的：(1) 变量尚未声明；(2)\
  \ 变量已声明但在方法范围之外（例如在不同的函数中局部声明），或 (3) 你使用的变量名错误（即拼写或大小写）。记住，所有变量和函数的名称都是区分大小写的；因此，只需使用错误的大小写，Unity\
  \ 就会认为你指的是另一个变量，在这种情况下，该变量尚未声明。\n*   `The best method overload for function … is\
  \ not compatible` : 此错误可能是因为你正尝试调用一个函数并传递一个类型不是 Unity 预期的参数。例如，下一个代码段中描述的方法 `mySecondMethod`\
  \ 期望其参数为 String 类型值；因此，如果你传递一个整数值，就会生成错误。\n\n```csharp\nvoid mySecondFunction(string\
  \ name)\n{\nprint (“Hello, your name is” +name);\n}\n\nmySecondFunction(“John”);//这是正确的\n\
  \nmySecondFunction(10);//这将触发一个错误\n```\n\n*   `Expecting } found …`: 此错误是因为你可能忘记了关闭或打开大括号。这可能发生在条件语句或函数中。为了避免这个问题，有一个你可以使用的技巧（或最佳实践）：你可以确保对代码进行缩进，使得对应的打开和关闭括号处于同一水平。在下一个示例中，你可以看到\
  \ `testBrackets` 方法开始和结束对应的括号缩进在同一水平，该函数内部每个条件语句的括号也是如此。通过对代码进行缩进（使用多个空格或制表符），你可以确保你的代码是清晰的，并且更容易发现缺失的大括号。\n\
  \n```csharp\nVoid testBrackets()\n{\nif (myVar == 2)\n{\nprint (\"Hello World”);\n\
  myVar = 4;\n}\nelse\n{\n}\n}\n```\n\n有时，尽管你的代码语法是正确的且在 Console 窗口中没有产生任何错误，但看起来什么都没有发生；换句话说，看起来代码（特别是你创建的方法）不起作用。这在你创建第一个脚本时是不可避免的。这可能会令人沮丧（我也经历过这种情况\
  \ :-))），因为在这种情况下，Unity 不会告诉我们错误在哪里。然而，你可以进行一系列检查以确保这种情况不会发生；所以你可以检查以下内容：\n\n*  \
  \ 你编写的脚本已保存。\n*   脚本没有错误。\n*   脚本已挂载到对象上。\n*   如果脚本确实已挂载到对象上，并且你正在使用取决于其所属对象类型的内置方法，请确保脚本链接到了正确的对象。例如，如果你的脚本在使用内置方法\
  \ `OnControllerColliderHit`（该方法用于检测 FPSController 和其他对象之间的碰撞），但你没有将脚本拖放到 FPSController\
  \ 上，那么脚本虽然没有错误但不会被使用，除非你与某个对象碰撞。如果脚本确实挂载到对象上并使用 `Start` 或 `Update` 等内置方法，请确保这些函数的拼写正确（即精确的拼写和大小写）。所以如果你写了一个拼写为\
  \ `update` 的方法，系统将寻找 `Update` 函数，由于它没有被定义（或覆盖），什么都不会发生。\n\n## 最佳实践\n\n为了确保你的代码易于理解，并且在尝试修改时不会产生无数头\
  \ headaches，在你开始编码时可以开始应用一些良好实践；这些实践将以后为你节省一些时间。\n\n### 变量命名\n\n*   使用你能理解的有意义的名称，特别是在离开代码两周之后。\n\
  \    `string myName = “Patrick”;//良好`\n    `string b = “Patrick”;//不太好`\n*   在名称中保持单词大小写的一致（例如，驼峰命名法或\
  \ Pascal 命名法）。\n    `bool testIfTheNameIsCorrect;//良好`\n    `bool testifthenameiscorrect;//不好`\n\
  \n### 方法\n\n*   确保所有打开括号都有对应的关闭括号。\n*   对代码进行缩进。\n*   尽可能对代码进行注释以解释其工作原理。\n*   如果只需要在游戏开始时执行一次，请使用\
  \ `Start` 方法。\n*   如果某些操作需要重复执行，那么 `Update` 方法可能是更好的选择。\n\n# # 常见问题\n\n本章提供了对书中涵盖的功能的最常见问题的解答。请注意，配套网站上还提供视频，以帮助你理解本主题涵盖的一些概念，包括\
  \ AI、UI、碰撞、摄像或路径。\n\n## C# 脚本\n\n如何创建脚本？\n\n在 Project 窗口中，选择：`Create | C# Script`。\n\
  \n我的脚本如何执行？\n\n\n\n\n对于 JavaScript 脚本，你的 `C#` 脚本可能需要挂载到对象上。尽管如此，你也可以创建一个未链接到对象的类，但由另一个类（该类可以挂载到对象）间接使用。\n\
  \n### 我如何检查我的脚本是否有错误？\n\n打开 `Console` 窗口，任何错误都将在这里显示。\n\n### 什么是面向对象编程？\n\n在面向对象编程中，你的程序被视为一组对象，这些对象通过方法（例如方法）相互交互。\n\
  \n### 我的 C# 文件名和其中包含的类名应该相同吗？\n\n当你创建一个新的 `C#` 文件时，Unity 会允许你直接重命名它；一旦完成，它将使用你为该文件指定的名称自动生成内部的类名。因此，如果你以后更改了此文件的名称，你可能也需要更改内部的类名。\n\
  \n### 为什么我应该使用 C#？\n\n开始使用 `C#` 编写代码有几个理由。其中之一是 `C#` 是一种面向对象的编程语言，与 `Java` 等其他语言非常相似。因此，通过学习\
  \ `C#`，你应该能够轻松地将这些知识迁移到其他语言。\n\n### 点符号（dot notation）的作用是什么？\n\n点符号指的是面向对象编程。通过点，你可以访问与特定对象相关的属性和函数（或方法）。例如，`gameObject.transform.position`\
  \ 让你访问挂载到脚本的对象的 `transform` 的位置。从后往前读取通常很有用；在这种情况下，点可以被解释为“的”。因此在我们的案例中，`gameObject.transform.position`\
  \ 可以翻译为“`gameObject` 的 `transform` 的位置”。\n\n# 4 感谢\n\n![](img/Image00009.jpg)\n\n\
