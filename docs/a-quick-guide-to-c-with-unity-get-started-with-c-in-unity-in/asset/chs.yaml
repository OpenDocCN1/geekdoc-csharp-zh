- "# C# Unity 快速指南：在 60 分钟内上手 Unity C# \n\n\n\n![](img/Image00011.jpg)\n\n\n\n\n\n\
  \n\n## 鸣谢\n作者：Patrick Felicia\n\n## 关于作者\nPatrick Felicia 是沃特福德理工学院（Waterford Institute\
  \ of Technology）的讲师和研究员，在那里负责教学并指导本科生和研究生。他于 2003 年在爱尔兰科克大学大学获得多媒体技术硕士学位，并于 2009\
  \ 年获得计算机科学博士学位。他出版了多关于利用视频游戏进行教育的书籍和文章，包括《教育游戏提高学习与动机的研究手册：多学科方法》（IGI 出版）和《学校中的数字游戏：教师手册》（欧洲\
  \ Schoolnet 出版）。Patrick 已出版了 10 多本关于 Unity 的书籍，涵盖了 Unity 中的 `C#` 和 `JavaScript`\
  \ 等若干关键技能、Unity 3D 和 2D 游戏开发以及 3D 角色动画。Patrick 还是《国际游戏化学习期刊》(IJGBL）的主编辑，[爱尔兰游戏化学习会议](http://igbl-conference.com/)的会议总，这是一场在全爱尔兰举办的关于游戏与学习的热门会议。\n\
  \n## 作者的其他著作\n* **Unity 从零到精通**：“Unity 从零到精通”系列包含五本书：(1) 基础、(2) 入门、(3) 中级、(4) 高级和\
  \ (5) 精通。如果没有这个系列，大多数人会花费太多的时间用硬方法学习如何使用 Unity 或 `C#`。该系列是唯一能让你在不浪费大量时间快速学习 Unity\
  \ 和 `C#` 的书籍。通过系列中的五本书，你将学会创建优秀游戏所需的 `C#` 和 Unity 技能，并按照所需的格式和节奏稳步进步，很快发布你的游戏。\n\
  * **新手指南**：“新手指南”系列包含四本书，解释了如何使用 Unity 创建热门的 2D 游戏（平台跳跃、无尽跑、射击、益智）。它们还向你展示了如何将 2D\
  \ 游戏发布到 Android 平台。在此过程中，你还将学习如何使用 `C#` 和 Unity。它们提供了从开始到结束的完整解决方案，如何设计和创建这些游戏。\n\
  \n## 本书的支持与资源\n为了完成书中的活动并提高你的 `C#` 技能，你需要下载资源包；它包括：\n* 一份 Unity 抄表（例如键盘快捷键），以提高你在\
  \ Unity 中的操作速度。\n* 一份抄表，帮助你解决在开始学习 `C#` 时可能遇到的常见 `C#` 错误。这将节省你大量寻找修复方法的时间。\n* 一份关于\
  \ `C#` 最佳编码实践的抄表；此文档将帮助你构建代码。\n* 一个关于如何快速掌握 Unity 界面的免费视频教程。\n\n要下载这些资源，请执行以下操作：\n\
  * 打开以下链接：[`learntocreategames.com/books/`](http://learntocreategames.com/books/)。\n\
  * 选择这本书（“ A Quick Guide to C# programming with Unity ”）。\n* 在新页面上，点击标记为“Book Files”的链接，或滚动到页面底部。\n\
  * 在“Download your Free Resource Pack”部分输入你的电子邮件地址和名字，点击标记为“Yes, I want to receive\
  \ my bonus pack”的按钮。\n* 几秒钟，你应该会收到免费启动包的链接。\n* 当你收到链接时，可以下载所有资源到你的电脑上。\n\n本书献给 Helena\n\
  \n# 4 感谢\n\n## 前言\n为了能够帮助像你这样的人，我设计并出版了 8 多本关于 Unity 的书籍；这些书籍非常深入，并确实为与 Unity 相关的广泛主题提供了大量信息，包括\
  \ 2D/3D 游戏开发、人工智能、动画等……\n尽管如此，虽然这些书籍是全面的，但许多读者（像你一样）可能只想专注于某个主题并开始学习。\n本书属于“快速指南”（A\
  \ Quick Guide To）系列，正是如此。在这本名为“ A Quick Guide to `C#` with Unity ”的书中，你将发现如何使用 Unity\
  \ 快速开始 `C#` 编程，包括 `C#` 概念以及它们在 Unity 中的应用。\n\n## 使用本书所需的条件\n要完成书中介绍的项目，你只需要 Unity\
  \ 5.0（或更高版本），并确保你的电脑及其操作系统符合 Unity 的要求。可以从官方网站下载 Unity（[`www.unity3d.com/download`](http://www.unity3d.com/download)），在下载之前，你可以在以下页面检查电脑是否符合要求：[`www.unity3d.com/unity/system-requirements`](http://www.unity3d.com/unity/system-requirements)\
  \ 。在编写本书时，Unity 支持以下开发的操作系统：Windows XP（即 SP2+）、7 SP1+、Windows 8 以及 Mac OS X 10.6+。显卡方面，2004\
  \ 年以后的大多数显卡都适用。\n在计算机技能方面，书中介绍的所有知识都假设读者没有先前的编程经验。因此，现在你只需要能够常见的计算机任务，如下载项目、打开和保存文件，并习惯拖放物品和打字。\n\
  \n## 本书适合谁\n如果你对以下问题都回答“是”，那么这本书就适合你：\n1. 你是 `C#` 的初学者吗？\n2. 你想开始 `C#` 并使用 Unity\
  \ 创建交互游戏吗？\n3. 你想开始创建优秀的 3D 游戏吗？\n4. 虽然你可能已经接触过 Unity，但你想深入了解 `C#` 如何与场景和对象关联吗？\n\
  \n\n\n\n\n如果你对以下所有问题都回答为“是”，那么这本书并不适合你：\n\n1. 你是否已经可以很容易地使用 `C#` 创建一个游戏了？\n2. 你是否在寻找一本关于\
  \ `Unity` 编程的参考书？\n3. 你是否是一位经验（或至少是高级的）`Unity` 程序员？\n\n如果你对这三个问题都回答为“是”，你也可以寻找该系列中的后续书籍。要查看这些书籍涵盖的内容和主题，你可以访问官方网站（[www.learntocreategames.com/books](http://www.learntocreategames.com/books)）。\n\
  \n改进书籍\n\n尽管我对书中的内容经过了非常仔细的检查，但我毕竟人类，书中可能仍存在一些错误。因此，如果你在书中发现了任何问题或错误，请告诉我，以便我解决这些问题并相应地更新书籍。要报告错误，你可以发送电子邮件至我的邮箱（learntocreategames@gmail.com），并附上以下信息：\n\
  \n* 书名。\n* 发现错误的页码。\n* 描述错误以及你认为应该如何更正。\n\n收到你的电子邮件后，我将对错误进行检查；如果是有效错误，将进行纠正并更新书籍页面以反映相应的更改。\n\
  \n支持作者\n\n这本书投入了大量的心血，它是长时间准备、头脑风暴并最终编写的结晶。因此，我请求你不要分发本书的任何非法复制版。\n\n这意味着，如果你的朋友想要这本书的副本，他/她必须通过官方渠道（即，通过\
  \ Amazon、`lulu.com` 或书籍的官方网站：[www.learntocreategames.com](http://www.learntocreategames.com)\
  \ / books）购买。\n\n如果你的一些朋友对这本书感兴趣，你可以引导他们访问书籍的官方网站（[`www.learntocreategames.com/books`](http://www.learntocreategames.com/books)），他们可以在那里购买书籍、参加每月抽奖以获得免费赠送书籍的机会，或者接收未来促销优惠的通知。\n\
  \n# 1 C# 编程入门介绍\n\n在本节中，我们将发现 `C#` 编程原理和概念，以便你能在下一章节中开始编程。如果你已经使用 `C#`（或类似的语言）编写过代码，可以跳过本章。\n\
  \n完成本章后，你将能够：\n\n* 理解为什么需要考虑 `C#`。\n* 在编写 `C#` 代码时，理解面向对象编程 (`OOP`) ) 概念。\n* 熟悉并理解变量、方法和作用域的概念。\n\
  * 理解编码的关键最佳实践，特别是在 `C#` 中。\n* 理解条件语句和决策结构。\n* 理解循环的概念。\n\n## 引言\n\n在 `Unity` 中编写脚本时，你正在与游戏引擎通信，并要求它执行操作。为了与系统通信，你正在使用一种由计算机和你共同理解的语法约束的语言或单词集。这种语言由关键字、关键短语以及确保指令被正确理解的语法组成。在计算机科学中，这句话必须是准确、精确、无歧义且具有正确的语法。换句话说，它必须是准确的。语法是在编写\
  \ `C#`（如同编写 `JavaScript` 时）时需要遵循的一组规则。除了语法之外，`C#` 编程还使用类；因此，你的脚本将以类的形式保存。\n\n在下一节中，我们将学习如何使用这种语法。如果你已经用\
  \ `JavaScript` 编写过代码，本章其余部分提供的信息可能看起来很熟悉，这种对 `JavaScript` 的先前接触绝对对你有帮助。尽管如此，`JavaScript`\
  \ 和 `C#` 虽然在某些相对相似之处，但在许多方面是非常不同的（例如，变量声明、函数声明等）。\n\n在 `C#` 中编写脚本时，你将使用以下内容的组合：\n\
  \n* 类。\n* 对象。\n* 语句。\n* 注释。\n* 变量。\n* 常量。\n* 运算符。\n* 赋值。\n* 数据类型。\n* 方法。\n* 决策结构。\n\
  * 循环。\n* 继承（高级内容）。\n* 多态（高级内容）。\n* 运算符重载（高级内容）。\n* 接口。\n* 命名空间。\n* 事件。\n* 比较。\n\
  * 类型转换。\n* 留字。\n* 向控制台窗口的消息。\n* 声明。\n* 方法调用。\n\n这个列表看起来可能有点令人生畏，但不用担心，我们将在后续章节中探索这些内容，你将通过实操示例顺练地熟悉并使用它们。\n\
  \n## 语句\n\n当你编写一段 `C#` 代码时，你需要使用语句告诉系统执行你的指令（例如，打印信息）。语句字面意思是是一条命令或你要求系统执行的操作。例如，在下一行代码中，语句将告诉\
  \ `Unity` 在控制台窗口打印一条消息：\n\n```c\nprint (\"Hello Word\");\n```\n\n在编写语句时，有几个规则你需要知道：\n\
  \n* 语句的顺序：每个语句按照它们在脚本中出现的顺序进行执行。例如，在下一个示例中，代码将先打印 hello，然后是 world；这是因为相关的语句按该顺序排列。\n\
  ```c\nprint (\"hello\");\nprint (\"world\");\n```\n* 语句之间用分号分隔（即每条语句末尾都有分号）。注意，多个语句可以放在同一行，只要它们用分号隔开。\n\
  ```c\nprint (\"hello\");print (\"world\");\n```\n* 语句中的多个空格会被忽略；然而，在运算符 `+`、`-`、`/`\
  \ 等符号周围添加空格是良好的习惯。例如，在下一个示例中，我们说 `a` 等于 `b`。在运算符 `=` 前后都有空格。\n```c\na = b;\n```\n\
  * 需要一起执行的语句（例如，基于相同的条件）可以使用通常称为代码块进行分组。在 `C#` 中（如同 `JavaScript`），代码块由大括号符号（例如 `{`\
  \ 或 `}`）。换句话说，如果你需要分组多个语句，我们将它们全部包含在同一个括号内，如下：\n\n```c\n{\nprint (\"hello stranger!\"\
  );\nprint (\"today, we will learn about scripting\");\n}\n```\n\n正如我们之前看到的，语句通常采用或带有关键字（即计算机认识的单词）。这些每个关键字都有特定的用途，在本阶段最常用的关键字用于：\n\
  \n* 在控制台窗口打印消息：关键字是 `print`。\n* 声明变量：关键字取决于变量类型（例如，`int` 用于整数，`string` 用于文本，`bool`\
  \ 用于布尔变量等），我们将在后续中详细介绍。\n* 声明方法：关键字取决于方法返回的数据类型。例如，在 `C#` 中，当方法返回整数时，方法名之前是关键字 `int`；当方法返回字符串时是\
  \ `string`；当方法不返回任何信息时是 `void`。\n* 根据条件标记一个指令块：关键字是 `if` ... `else`。\n* 退出函数：关键字是\
  \ `return`。\n\n## 注释\n\n在 `C#` 中（类似于 `JavaScript`），你可以使用注释来解释代码并提高其可读性。随着代码规模的增加，这变得非常重要；如果你在团队中工作，这同样重要，这样团队成员就可以理解你的代码并在需要的地方进行修改。\n\
  \n\n\n\n\n# C#编程基础\n\n## 注释\n\n当代码被注释时，它不会被执行。在 `C#` 中有两种方法可以注释你的代码；你可以使用单行注释或多行注释。在单行注释中，在行的开头或语句之后添加双正斜杠\
  \ `//`，这样该行（或其部分内容）就会被注释，接下来的代码片段所示。\n\n```csharp\n//下一行在控制窗口中打印 Hello\nprint (“Hello”);\n\
  \n//下一行声明变量名\nstring name;\nname = “Hello”;//设置变量名的值\n```\n\n在多行注释中，`/*` 和 `*/`\
  \ 之间的任何文本都将被注释（且不执行）。这也被称为注释块。\n\n```csharp\n/* 注释后的后续几行在控制窗口中打印 hello\n然后我们声明变量名并为其赋值一个值*/\n\
  print(“Hello”);\nstring name;\nname = “Hello”;//设置变量名的值\n\n//print (“Hello World”)\n\
  \n/*\nstring name;\nname = “My Name”;\n*/\n```\n\n除了为你的代码提供说明外，你还可以使用注释来防止部分代码被执行。当你想要调试代码并用非常简单的方法找到错误或\
  \ bug 可能所在的位置时，这非常有用。通过注释代码的区域并使用排除法，你通常可以快速找到问题。例如，你可以注释掉所有代码并运行脚本；然后注释掉一半的代码并运行。如果运行正常，说明错误在被注释的代码中；如果运行异常，则说明错误在未注释的代码中。在第一种情况下（代码运行正常），我们只需注释掉已注释部分中的半部分。因此，通过连续注释我们代码中更具体的区域，我们可以发现代码的哪部分包含\
  \ bug。这个过程通常被称为二分法（因为我们连续地将代码段分为两部分）。这种调试方法通常是有效的，因为迭代次数（将部分代码二分）更具预测性，而且可能更节省时间。例如，对于\
  \ 100 行代码，我们可以连续将问题缩小到 50、25、12、6 和 3 行（在这种情况下需要 5 到 6 次迭代，而不是遍历整个 100 行）。\n\n##\
  \ 变量\n\n变量是一个容器。它包含一个随时间变化的值。使用变量时，我们通常需要：(1) 声明变量（通过指定其类型），(2) 为此变量赋值，以及 (3) 可能使用运算符将此变量与其他变量结合。\n\
  \n```csharp\nint myAge;//我们声明了变量\nmyAge = 20;//我们将变量设置为 20\nmyAge = myAge + 1; //我们给变量\
  \ myAge 加 1\n```\n\n在上一个示例中，我们声明了一个变量 `myAge`，它的类型是 `int`（整数），我们将其设置为 20，然后加了 1。在\
  \ `C#` 中，变量通过其类型后接名称来声明。正如我们稍将看到的，我们还需要使用所谓的访问修饰符来指定如何访问此变量。\n\n注意，在之前的代码中，我们将 `myAge\
  \ + 1` 的值赋值给 `myAge`；`=` 运算符是一个赋值运算符；换句话说，它的目的是给变量赋值，而不是从严格的代数意义上理解（即 `=` 号两边的值或变量是相等的）。\n\
  \n为了让编码更简单更简洁，在 `C#` 中你可以在同一个语句中对多个相同类型的变量进行多重声明。例如，在接下来的代码片段中，我们在一个语句中声明了三个变量 `v1`、`v2`\
  \ 和 `v3`。这是因为它们是相同类型（即整数）。\n\n```csharp\nint v1,v2,v3;\nint v4=4, v5=5, v6=6;\n\
  ```\n\n在上面的代码中，第一行声明了变量 `v1`、`v2` 和 `v3`。三个都是整数。在第二行中，我们不仅同时声明了三个变量，还初始化了它们（即设置了值）。\n\
  \n使用变量时，我们需要确定几点，包括它们的名称、类型和作用域：\n\n*   **变量名称**：变量通常赋予一个唯一的名称，以便唯一标识。变量的名称通常被称为标识符。在定义标识符时，它可以包含字母、数字、减号、下划线或美元符号，并且通常以字母开头。标识符可以是关键字（例如\
  \ `if`）。\n*   **变量类型**：变量可以持有多种类型的数据，包括数字（例如整数、双精度浮点数或 float）、文本（即 `strings` 或字符）、布尔值（例如\
  \ `true` 或 `false`）、数组、对象（即我们在本章稍后看到的这个概念）或 `GameObjects`（即你场景中的任何对象），如下一个代码片段所示。\n\
  \n```csharp\nstring myName = “Patrick”;//文本使用双引号声明\nint currentYear = 2015;//年份不需要小数且被声明为整数\n\
  float width = 100.45f;//width 被声明为 float\n```\n\n*   **变量声明**：变量需要声明，以便系统知道你在引用什么。\n\
  ```csharp\nstring myName;\nmyName = “My Name”\n```\n声明阶段，变量不需要被赋值。\n*   **变量的作用域**：变量可以在特定的上下文中被访问。\n\
  *   **访问级别**：正如我们稍后看到的，`C#` 程序由类组成；常见的变量类型包括：\n\n*   `String`：同文本。\n*   `Int`：整数（1、2、3\
  \ 等）。\n*   `Boolean`：true 或 false。\n*   `Float`：带小数的值（1.2f、3.4f 等）。\n*   `Arrays`：相同类型变量的组。如果这不清楚，不要担心，稍后会解释。\n\
  *   `GameObject`：场景中的任何游戏对象。\n\n## 数组\n\n有时，为了让代码更简洁，数组有助于对广泛的数据应用特性和相似的行为。数组有助于声明更少的变量（存储相同类型的变量）并更容易地访问它们。创建数组时，你可以创建一维数组和多维数组。\n\
  \n让我们看看数组的最简单形式：一维数组。对于这个概念，我们可以以一组十个人的名字来类比。如果我们想用字符串变量来存储这些信息，我们需要声明（并设置）十个不同的变量。\n\
  \n```csharp\nstring name1;string name2;```\n\n虽然这段代码完全可行，但将它们存储在一个变量中更好。为了这个目的，我们可以使用数组。数组类似于通过索引访问的元素列表。索引通常从\
  \ 0 开始（列表中的第一个元素）。\n\n所以让我们看看如何使用数组来实现；首先我们可以这样声明数组：\n\n```csharp\nstring [] names;\n\
  ```\n\n你可能已经注意到了语法 `dataType [] nameofArray`。`[]` 语法意味着我们声明了一个字符串值的数组。\n\n然后我们可以初始化数组，就像我们通常处理任何变量一样：\n\
  \n```csharp\nnames = new string [10];\n```\n\n在之前的代码中，我们只是说我们名为 `names` 的新数组将包含\
  \ 10 个字符串变量。然后我们可以像接下来的代码片段所示，在该数组中存储信息。\n\n```csharp\nnames [0] = “Paul”;\nnames\
  \ [1] = “Mary”;\n…\nnames [9] = “Pat”;\n```\n\n\n\n\n在之前的代码中，我们将名称 `Paul` 存储为数组中的第一个元素（记住索引从\
  \ 0 开始）；我们将第二个元素（索引为 1）存储为 `Mary`，同样的最后一个元素（索引为 9）存储为 `Pat`。\n\n请注意，对于一个大小为 `n`\
  \ 的数组，第一个元素的索引为 `0`，最后一个元素的索引为 `n-1`。因此，对于一个大小为 `10` 的数组，第一个元素的索引是 `0`，最后一个元素的索引是\
  \ `9`。\n\n如果你想使用整数数组、浮点数数组或任何其他类型的数据，处理过程也是类似的。\n\n现在，使用数组可以做的一件酷的事情是，你可以在一行中初始化数组，这样如果你有\
  \ 10 个变量，就可以省去编写 10 行代码的烦恼，如下例所示。\n\n```csharp\nstring [] names = new string [10]\
  \ {“Paul”，“Mary”，“John”,“Mark”, “Eva”，“Pat”,”Sinead”，“Elma”，“Flaithri”, “Eleanor”};\n\
  ```\n\n这非常有用，正如你在接下来的章节中看到的，这绝对能为你节省编码时间。\n\n现在我们已经研究了单维数组，让我们来看下多维数组，它们在存储信息时也可以非常好用。这种类型的数组（即多维数组）可以比作一栋有几楼的建筑，每层楼都有几间公寓。假设我们想要存储每个公寓的住户人数；在这种情况下，我们将创建变量来存储每个公寓的住户人数。\n\
  \n第一种解决方案是创建变量来存储每个公寓的住户人数，并使用变量来引用楼层号和公寓号。例如，`ap0_1` 可以代表地面层的第一间公寓，`ap0_2` 就会是地面层的第二间公寓，`ap1_1`\
  \ 将是第一楼的第一间公寓，而 `ap1_2` 将是第一楼的第二间公寓。因此，在代码方面，我们可以有如下内容：\n\n```csharp\nint ap0_1\
  \ = 0;\nint ap0_2 = 0;\n…\n```\n\n相反，使用数组我们可以执行以下操作：\n\n```csharp\nint [,] apArray\
  \ = new int [10,10];\napArray [0,1] = 0;\napArray [0,2] = 0;\nprint (apArray[0]);\n\
  ```\n\n在之前的代码中：\n\n*   我们声明了数组。`int [,]` 表示一个有两个维的数组；换句话说，此数组中的任何元素将根据两个参数进行定义和访问：楼层和该层公寓的编号。\n\
  *   我们还为这些参数中的每一个指定了大小（或最大值）。最大楼层数（层）将为 `10`，每层的最大公寓数将为 `10`。因此，在这个例子中，我们可以定义从 `0`\
  \ 层到 `9` 层（总共 10 层），以及从 `0` 号公寓到 `9` 号公寓（总共 10 间公寓）。\n*   最后一行代码 `print` 在控制台窗口中打印数组第一个元素的值。\n\
  \n数组的其他有趣点之一是，使用循环，你可以编写一行代码来访问此数组的所有元素，从而编写更高效的代码。\n\n### 常数\n\n到目前为止我们已经了变量以及你如何无缝地存储和访问它们。假设是值可能会随着时间而改变，并且这个值将存储在变量中。然而，有时你可能知道某个值将保持不变。例如，你可能想要定义引用那些不应随时间改变的值的标签，在这种情况下，你可以使用常数。让我来解释一下：假设玩家在游戏中可能有三个选择（例如称为\
  \ `0`、`1` 和 `2`），而你并不真的想记住这些值，或者你希望使用一种更易引用它们的方法。让我们下面的代码：\n\n```csharp\nint userChoice\
  \ = 2;\nif (userChoice == 0) print (“you have decided to restart”);\nif (userChoice\
  \ == 1) print (“you have decided to stop the game”);\nif (userChoice == 2) print\
  \ (“you have decided to pause the game”);\n```\n\n在之前的代码中：\n\n*   变量 `userChoice`\
  \ 是一个整数，并设置为 `1`。\n*   然后我们检查它的值并相应地打印消息。\n\n现在，你可能记得也不记得 `0` 对应于重启游戏；另外两个值也是如此。因此，我们可以使用常数来更容易记忆（并使用）这些值。让我们看看使用常数的等效代码。\n\
  \n```csharp\nconst int CHOICE_RESTART = 0;\nconst int CHOICE_STOP = 1;\nconst int\
  \ CHOICE_PAUSE = 2;\nint userChoice = 2;\nif (userChoice == CHOICE_RESTART) print\
  \ (“you have decided to restart”);\nif (userChoice == CHOICE_STOP) print (“you have\
  \ decided to stop the game”);\nif (userChoice == CHOICE_PAUSE) print (“you have\
  \ decided to pause the game”);\n```\n\n在之前的代码中：\n\n*   我们声明了常量。\n*   这些变量用于检查用户的选择。\n\
  \n```csharp\nconst float RATE = 0.2f;\nfloat priceBefore = 100f;\nfloat priceAfter\
  \ = RATE;\n```\n\n*   我们声明了常数浮点数。\n*   我们声明了之前的价格。\n*   我们计算之后的价格。\n\n对于不改变的值使用常数是非常好的习惯；使用常数使你的代码更具可读性；节省工作（例如，用于计算）。\n\
  \n### 运算符\n\n一旦我们声明变量并为其赋值，就可以使用运算符来修改或组合变量。不同类型的运算符包括：算术运算符、赋值运算符、比较运算符和逻辑运算符。\n\
  \n算术运算符用于执行算术运算，包括加法、减法、乘法或除法。常见的算术运算符包括 `+`、`-`、`*`、`/` 和 `%`（取模）。\n\n```csharp\n\
  int number1 = 1; // 变量 number1 被声明\nint number2 = 1; // 变量 number2 被声明\nint sum\
  \ = number1 + number2; // 两个数相加存储在 sum 中\nint sub = number1 - number2; // 两个数相减存储在\
  \ sub 中```\n\n赋值运算符可以给变量赋值，包括 `=`、`+=`、`-=`、`*=`、`/=` 和 `%=`。\n\n```csharp\nint\
  \ number1 = 1;\nint number2 = 1;\nnumber1+=1; // 等于 number1 = number1 + 1;\nnumber1-=1;\
  \ // 等于 number1 = number1 - 1;\nnumber1*=1; // 等于 number1 = number1 * 1;\nnumber1/=1;\
  \ // 等于 number1 = number1 / 1;\nnumber1%=1; // 等于 number1 = number1 % 1;```\n\n\
  比较运算符通常用于条件以比较两个值；比较运算符包括 `==`、`!=`、`>`、`<`、`>=` 和 `<=`。\n\n```csharp\nif (number1\
  \ == number2); // 如果 number1 等于 number2\nif (number1 != number2); // 如果 number1\
  \ 和 number2 值不同\nif (number1 > number2); // 如果 number1 大于 number2\nif (number1 >=\
  \ number2); // 如果 number1 大于等于 number2\nif (number1 < number2); // 如果 number1 小于\
  \ number2\nif (number1 <= number2); // 如果 number1 小于等于 number2\n```\n\n### 条件语句\n\
  \n语句可以根据条件执行，在这种情况下它们被称为条件语句。通常通常如下：\n\n```csharp\nIf (condition) statement;\n```\n\
  \n\n\n这意味着如果条件被验证（或为真），那么（且仅在此时）将执行该语句。当我们评估一个条件时，我们是在测试一个声明是否为真。例如，通过输入 `if (a\
  \ == b)`，我们的意思是“如果 `a` 等于 `b` 是真的”。同样，如果我们输入 `if (a>=b)`，我们的意思是“如果 `a` 大于或等于 `b`\
  \ 是真的”。\n\n正如我们后面将看到的，我们还可以组合条件。例如，如果两个（或更多）条件为真，我们可以决定执行某条语句。例如，通过输入 `if (a ==\
  \ b && c == 2)`，我们的意思是“如果 `a` 等于 `b` 且 `c` 等于 2”。在这种情况下，使用运算符 `&&` 表示“与”（AND），并且两个条件都必须为真。我们可以将其类比为决定明天是否去帆行。例如，“如果天气晴朗且风速小于\
  \ 5km/h，那么我就去帆行”。我们可以这样翻译这条语句：\n\n```\nif (weatherIsSunny == true && windSpeed <\
  \ 5) IGoSailing = true ;\n```\n\n在创建条件时，与大多数自然语言一样，我们可以使用标记为 `||` 的 OR 运算符。参考前面的例子，我们可以将以下句子“如果天气太热或风速大于\
  \ 5km/h，那么我就不去帆行”翻译如下：\n\n```\nif (weatherIsTooHot == true || windSpeed >5) IGoSailing\
  \ = false ;\n```\n\n另一个例子如下：\n\n```\nif (myName == “Patrick”) print(“Hello Patrick”);else\
  \ print (“Hello Stranger”);\n```\n\n当我们处理真或假语句的组合时，我们实际上是在应用所谓的**布尔逻辑（（Boolean logic**）。布尔逻辑处理的是具有两个值\
  \ 1 和 0（或真和假）的布尔变量。通过评估条件，我们实际上在处理布尔数字并应用布尔逻辑。虽然你不需要深入了解布尔逻辑，但某些用于布尔逻辑的运算符是重要的，包括\
  \ `!` 运算符。它表示“非”（NOT）或相反面。这意味着如果一个变量为真，它的相反面就为假，反之亦然。例如，如果我们考虑变量 `weatherIsGood\
  \ = true`，那么 `!weatherIsGood` 的值将是 `false`（它的相反面）。因此，条件 `if (weatherIsGood == false)`\
  \ 也可以写成 `if (!weatherIsGood)`，其字面意思是“如果天气不好”。\n\n## Switch 语句\n\n如果你已经理解了条件语句的概念，那么这一部分应该非常直观易懂。switch\
  \ 语句是我们之前看到的 if/else 语句的变体。switch 语句的思想是，根据特定变量的值，我们将切换到代码特定部分并执行一个或多个操作。用于 switch\
  \ 结构的变量通常是整数类型**。让我们来看一个简单的例子：\n\n```\nint choice = 1;\nswitch (choice)\n{\ncase\
  \ 1:\nprint (\"you chose 1\");\nbreak;\ncase 2:\nprint (\"you chose 2\");\nbreak;\n\
  case 3:\nprint (\"you chose 3\");\nbreak;\ndefault:\nprint (\"Default option\");\n\
  break;\n}\nprint (“We have exited the switch structure”);\n```\n\n在之前的代码中：\n\n-\
  \ 我们声明了变量 `choice` 为整数，并将其初始化为 `1`。\n- 然后我们创建了一个 switch 结构，根据变量 `choice` 的值，程序将切换到相关部分（即以\
  \ `case 1:`、`case 2:` 等开始的代码部分）。注意，在我们的代码中，我们寻找值 `1`、`2` 或 `3`。然而，如果变量 `choice`\
  \ 不等于 1、2 或 3，程序将跳转到名为 `default` 的部分。这是因为如果任何其他可能的选择（即 1、2 或 3）未满足（或未被选择），就会执行该部分。\n\
  \n注意，每个选择或分支都以关键字 `case` 开始并以 `break` 结束。`break` 语句的作用是指定在执行完分支（或当前选择）中的命令后，应该退出\
  \ switch 结构。如果没有任何 `break` 语句，将执行下一行代码。\n\n所以让我们考虑之前的例子并看看它是如何运作的。在我们的情况下，变量 `choice`\
  \ 被设置为 `1`，所以我们将进入 switch 结构，然后寻找变量 `choice` 值为 `1` 的部分。这将是从 `case 1:` 开始的部分；然后将执行命令\
  \ `print (\"you chose 1\");`，接着执行命令 `break`，表示我们应该退出 switch 结构；最后执行命令 `print (“We\
  \ have exited the switch structure”)`。\n\nswitch 结构对于组织你的代码以及在根据整数值处理互斥选择（即只能处理选择中的某一个）时非常有用，特别是在菜单的情况下。此外，switch\
  \ 结构可以使代码更加整洁易于理解。\n\n## 循环（Loops）\n\n作为一名程序员，有时你必须执行重复性任务；很多时候，这些任务可以通过循环来快速完成。循环是根据条件重复执行相同动作的结构。因此，过程通常如下：\n\
  \n- 开始循环。\n- 执行动作。\n- 检查条件。\n- 如果满足条件则退出循环，否则继续循环。\n\n有时条件是在循环开始时执行的，有时是在循环结束时执行的。\n\
  \n让我们来看一个使用 while 循环的例子：\n\n```\ncounter = 0;\nwhile (counter <=10)\n{\nprint (“Counter\
  \ = ” + counter);\ncounter++;\n}\n```\n\n在之前的代码中：\n\n- 我们设置变量 `counter` 的值。\n- 然后我们创建一个以关键字\
  \ `while` 开头的循环。\n- 我们设置了留在循环中的条件（即 `counter <=10`）。\n- 在循环内部，我们将变量 `counter` 的值加\
  \ 1。\n\n所以实际上：\n\n- 第一次通过循环：`counter` 增加到 `1`；到达循环结束；回到开头检查 `counter <=10`，这种情况下为真（`counter\
  \ = 1`）。\n- 第二次通过循环：`counter` 增加到 `2`；到达循环结束；回到开头检查 `counter <=10`，这种情况下为真（`counter\
  \ = 2`）。\n- ……\n- 第 11 次通过循环：`counter` 增加到 `11`；到达循环结束；回到开头检查 `counter <=10`，此时为假（`counter\
  \ = 11`）。结果是，我们随后退出循环。\n\n所以，正如你所看到的，使用循环我们能够迭代地将变量 `counter` 的值增加到 11，但使用的代码比其他方法少。\n\
  \n现在，我们可以创建一个稍微修改过的循环版本；来看下面的例子：\n\n```\nint counter = 0;\ndo\n{\nprint (“Counter\
  \ = ” + counter);\ncounter++;\n} while (counter <=10);\n```\n\n在这个例子中，你可能发现与之前的代码相比有两处不同：\n\
  \n- `while` 关键字现在位于循环的末尾。因此条件会在循环结束时进行评估（评估）。\n- `do` 关键字现在出现在循环的开头。\n- 在这个例子中，我们执行语句然后检查条件。\n\
  \n代码的另一种形式如下：\n\n```\nfor (int counter = 0; counter <=10; counter ++)\n{\nprint\
  \ (“Counter = ” + counter);\n}\n```\n\n在之前的代码中：\n\n- 我们以一种稍微不同的方式声明循环：我们说将使用一个名为\
  \ `counter` 的整数变量，从 0 到 10。\n- 每当我们通过循环一次，这个变量 `counter` 都会增加 1。\n- 只要变量 `counter`\
  \ 小于或等于 10，我们就留在循环中。\n- 在这种情况下，条件的测试是在循环开始时执行的。\n\n\n\n循环对于对有限数量的对象执行重复操作，或者执行通常所谓的递归操作非常有用。例如，你可以使用循环在不同位置创建\
  \ 100 个对象（即实例化）（这可以为你节省一些代码 :-))），或者遍历一个包含 100 多个元素的数组。\n\n# 类\n\n在 Unity 中使用 `C#`\
  \ 编写代码时，你创建的脚本要么是类，要么使用内置类。那么，什么是类呢？\n\n正如我们之前看到的，`C#` 是一种面向对象编程 (OOP) 语言。简单来说，一个\
  \ `C#` 程序由一组相互作用的对象组成。每个对象都有一个或多个属性，并且可以使用被称为“方法”的操作对这些对象执行动作。此外，具有相同属性的对象被认为属于同一个类。例如，我们可以以自行车作比。有各种形状和颜色的自行车；然而，它们具有共同的特征。例如，它们都有特定数量的车轮（例如，一个、两个或三个）或速度；它们可以有颜色，并且可以在这些自行车上执行操作（例如：加速、右转、左转等）。因此，在面向对象编程中，类就是\
  \ `bike`，`speed` 或 `color` 被称为成员变量，而 `accelerate`（即一种动作）被称为成员方法。所以，如果我们定义一个通用类型，我们可以定义一个名为\
  \ `Bike` 的类，并为该类定义几个成员变量和属性，以便对 `Bike` 类型的对象进行定义并执行操作。\n\n这显然是对类和对象的简化解释，但如果你是该初学者，它应该让你对面向对象编程的概念有一个更清晰的认识。\n\
  \n## 定义类\n\n现在我们对类是什么有了更清晰的认识，让我们看看如何定义一个类。来看下面的例子。\n\n```csharp\npublic class Bike\n\
  {\n    private float speed;\n    private int color;\n\n    public void accelerate()\n\
  \    {\n        speed++;\n    }\n\n    public void turnRight()\n    {\n    }\n\n\
  \    private void calculateDistance()\n    {\n    }\n}\n```\n\n在上面的代码中，我们定义了一个名为\
  \ `Bike` 的类，它包含了两个成员变量（`speed` 和 `color`）以及两个成员方法（`accelerate` 和 `turnRight`）。让我们仔细观察一下脚本；你可能会注意到几点：\n\
  \n*   类名前面有关键字 `public class`；在 OOP 术语中，关键字 `public` 称为访问修饰符，它定义了如何（以及从哪里）访问和使用此类。在\
  \ `C#` 中至少有五种访问修饰符，包括 `public`（无限制访问）、`protected`（访问限于包含类或派生自该类的类型）、`internal`（访问限于当前程序集）、`protected\
  \ internal`（我们在本书书中不会使用这种访问模式）和 `private`（仅可从包含类型访问）。\n*   所有变量名前面都有其类型（例如 `int`）和关键字\
  \ `private`：这意味着这些整数变量仅在该类内部是可访问的。\n*   某些方法名前面有关键字 `public void`（例如方法 `accelerate`\
  \ 或 `turnRight` 方法）：`void` 关键字意味着该方法不返回任何数据，而 `public` 关键字意味着该方法在整个程序中都是可访问的。\n\
  *   某些方法名前面有关键字 `private void`（例如方法 `calculateDistance`）：`void` 关键字意味着该方法不返回任何数据，而\
  \ `private` 关键字意味着该方法只能从包含类型（即 `Bike`）访问。\n\n## 访问类成员和变量\n\n一旦定义了类，能够访问它的成员变量和方法将是非常棒的。在\
  \ `C#` 中（与其他其它面向对象编程语言一样），可以使用点操作符来实现。\n\n点操作符指的是面向对象编程。通过点，你可以访问与特定对象相关的属性和函数（或方法）。例如，`gameObject.transform.position`\
  \ 让你能够访问链接到此脚本对象的 transform 的位置。从反向读取它通常很有用；在这种情况下，点可以被解释为“的”。因此，在我们的案例中，`gameObject.transform.position`\
  \ 可以翻译为“`gameObject` 的 transform 的位置”。\n\n一旦定义了类，就可以创建基于该类的对象。例如，如果我们想创建一个新的 `Bike`\
  \ 对象，基于我们上面看到的代码，可以使用以下代码。\n\n```csharp\nBike myBike = new Bike();\n```\n\n这段代码将创建一个基于“模板”\
  \ `Bike` 的对象。你可能会注意到这种语法：`dataType variable = new dataType()`\n\n默认情况下，这个新对象将包含之前定义的所有成员变量和方法。因此，它将有一个\
  \ `color` 和一个 `speed`，我们也应该能够访问它的 `accelerate` 和 `turnRight` 方法。那么如何实现呢？让我们看看下一个代码片段，它展示了如何访问这些。\n\
  \n```csharp\nBike b = new Bike();\nb.accelerate();\n```\n\n在之前的代码中：\n\n*   创建了新的自行车\
  \ `myBike`。\n*   在调用 `accelerate` 方法后，`speed` 增加。可以使用点操作符来调用此方法，因为它是 `public` 的。\n\
  *   注意，调用对象的方法我们使用点操作符。\n\n在定义成员变量和方法时，限制成员变量的访问（例如 `private` 类型）并定义无或较少限制的公共方法（例如\
  \ `public`）来提供对这些变量的访问通常是良好的做法。这些方法通常被称为 getters（获取器）和 setters（设置器）（因为你可以从中获取或设置值）。为了说明这个概念，让我们来看下面的代码：\n\
  \n```csharp\npublic class Bike\n{\n    private float speed;\n    private int color;\n\
  \n    public void accelerate()\n    {\n        speed++;\n    }\n\n    public void\
  \ turnRight()\n    {\n    }\n\n    private void calculateDistance()\n    {\n   \
  \ }\n\n    public void setSpeed(float newSpeed)\n    {\n        speed = newSpeed;\n\
  \    }\n\n    public float getSpeed()\n    {\n        return (speed);\n    }\n}\n\
  ```\n\n在之前的代码中，我们声明了两个新方法：`setSpeed` 和 `getSpeed`。\n\n*   对于 `setSpeed`：类型为 `void`，因为该方法不返回任何信息，且其访问设置为\
  \ `public`，因此可以被访问。\n*   对于 `getSpeed`：类型为 `float`，因为该方法返回 `speed`，其类型为 `float`。它的访问设置为\
  \ `public`，因此可以被访问。\n\n所以，我们可以将到目前创建的代码合并到 Unity 中的一个程序（或新类）中如下：\n\n```csharp\n\
  using UnityEngine;\nusing System.Collections;\n\npublic class TestCode : MonoBehaviour\
  \ {\n    public class Bike\n    {\n        private float speed;\n        private\
  \ int color;\n\n        public void accelerate()\n        {\n            speed++;\n\
  \        }\n\n        public void turnRight()\n        {\n        }\n\n        private\
  \ void calculateDistance()\n        {\n        }\n\n        public void setSpeed(float\
  \ newSpeed)\n        {\n            speed = newSpeed;\n        }\n\n        public\
  \ float getSpeed()\n        {\n            return (speed);\n        }\n    }\n\n\
  \    public void Start ()\n    {\n        Bike myBike = new Bike();\n        myBike.setSpeed\
  \ (23.0f);\n        print (myBike.getSpeed());\n    }\n}\n```\n\n在之前的代码中，你可能会注意到与我们之前创建的代码相比至少有两个不同之处：\n\
  \n*   在代码开头添加了以下两行代码：\n\nusing UnityEngine;\n\nusing System.Collections;\n\n\n\n\
  \n\n- 关键字 `using` 被称为指令；在特定情况下，它被用于导入所谓的命名空间（namespace）；简单来说，通过添加此指令，你实际上导入了（或获取了访问）一组类或数据类型。这些命名空间或“库”中的每一个都包含了对程序有用的类。例如，`UnityEngine`\
  \ 命名空间将包含用于 Unity 开发的类，而 `System.Collections` 将包含用于不同对象集合的类和接口。默认情况下，每当你在 Unity\
  \ 中创建一个新的 C# 脚本时，这两个命名空间（以及相关的指令）都会被包含。\n\n- 我们在名为 `TestCode` 的另一个类中声明了类 `Bike`。在这种情况下，`TestCode`\
  \ 是包含类。\n\n```csharp\npublic class TestCode : MonoBehaviour {\n```\n\n- 每当你创建一个新的\
  \ C# 脚本时，脚本的名称（例如 `TestCode`）将用于定义脚本中的主类（即 `TestCode`）。\n\n- 语法：`Monobehavior` 意味着\
  \ `TestCode` 类派自 `MonoBehaviour` 类。这通常被称为继承。\n\n## 构造函数\n\n正如我们在上一节中看到的，当创建一个新对象时，它默认将包含所有的成员变量和方法。要创建此对象，我们将使用类名，并在后跟\
  \ `()`，如下一个示例所示。\n\n```csharp\nBike myBike = new Bike();\nmyBike.accelerate();\n\
  ```\n\n事实上，可以在创建新对象并在初始化时更改其某些属性。例如，与其像我们在之前的代码中那样设置对象的速度和颜色，如果能够在对象创建时自动设置这些属性并相应地传递参数，那就太棒了。嗯，这可以通过所谓的\
  \ `constructor`（构造函数）来实现。构造函数字面上的作用是根据参数（也称为参数）和指令帮助构建你的新对象。因此，例如，假设我们想在创建自行车时指定颜色；我们可以通过添加以下方法来修改\
  \ `Bike` 类，如下所示：\n\n```csharp\npublic Bike (int newColor)\n{\n    color = newColor;\n\
  }\n```\n\n这是一个新的构造函数（该方法名与类名相同），它接受一个整数作为参数；因此，在修改了我们的类描述（如上面的代码）之后，我们可以如下所示创建一个新的自行车对象：\n\
  \n```csharp\nBike myBike = new Bike(2);\n```\n\n我们甚至可以指定第二个构造函数，其中包含颜色和速度，如下：\n\n\
  ```csharp\npublic Bike (int newColor, float newSpeed)\n{\n    color = newColor;\n\
  \    speed = newSpeed;\n}\n```\n\n你可以在类中拥有不同的构造函数；在初始化阶段使用的构造函数将与传递的参数匹配的那一个。\n\n\
  例如，假设我们为 `Bike` 类有两个构造函数。\n\n```csharp\npublic Bike (int newColor)\n{\n    color\
  \ = newColor;\n}\n\npublic Bike (int newColor, float newSpeed)\n{\n    color = newColor;\n\
  \    speed = newSpeed;\n}\n```\n\n如果如下所示创建一个新的 `Bike` 对象：\n\n```csharp\nBike newBike\
  \ = new Bike (2)\n```\n…那么将调用第一个构造函数。\n\n如果如下所示创建一个新的 `Bike` 对象：\n\n```csharp\n\
  Bike newBike = new Bike (2, 10.0f)\n```\n…那么将调用第二个构造函数。\n\n你可能还会想如果使用以下代码会发生什么，因为没有定义默认构造函数。\n\
  \n```csharp\nBike newBike = new Bike ();\n```\n\n事实上，每当你创建类时，都会（隐式地）定义一个默认构造函数，并在使用\
  \ `new` 操作符不带参数创建新对象时调用它。这被称为默认构造函数。在这种情况下，将使用每个类型数值成员变量的默认值（例如，整数为 0 或布尔变量为 false）。\n\
  \n注意，构造函数的访问通常是公共的，除非我们希望类不被实例化的特殊情况（例如对于仅包含静态成员的类）。同样注意，与变量一样，如果没有指定访问修饰符，默认将是私有的。方法也是如此。\n\
  \n## 析构函数\n\n对于构造函数，当对象被删除时，相应的析构函数会被调用。它的名称与类相同，并在前面有一个波浪号 `~`；如下代码段所示。\n\n```csharp\n\
  ~Bike()\n{\n    //在这里添加一些代码；\n}\n```\n\n尽管如此，析构函数既不能接受参数（或参数），也不能返回值。\n\n## 类的静态成员\n\
  \n当方法或变量被声明为 `static` 时，该类只存在该成员的一个实例。因此，静态变量将在该类的实例之间“共享”。静态变量通常用于在不实例化类的情况下获取常量。静态方法也是如此：它们可以在不需要实例化类的情况下被调用。如果你想创建并利用工具，这会非常有用。例如，在\
  \ Unity 中，可以使用 `GameObject.Find()` 方法；此方法通常允许根据名称查找特定对象。让我们看下面的示例。\n\n```csharp\n\
  public void Start()\n{\n    GameObject t = (GameObject) GameObject.Find(\"test\"\
  );\n}\n```\n\n在之前的代码中，我们查找一个名为 `test` 的对象，并将结果存储在类型为 `GameObject` 的变量 `t` 中。然而，当我们使用语法\
  \ `GameObject.Find` 时，使用的是来自 `GameObject` 类的静态方法 `Find`。在 Unity 中可以使用许多静态函数，包括 `Instantiate`。再次，这些函数可以在不需要实例化对象的情况下调用。下面的代码片段提供了基于\
  \ `Bike` 类的示例。\n\n```csharp\nusing UnityEngine;\nusing System.Collections;\npublic\
  \ class TestCode : MonoBehaviour {\nclass Bike\n{\nprivate int nbWheels;\nprotected\
  \ float speed;\nprivate int nbPassengers;\nprivate int color;\nstatic int nbBikes;\n\
  public void countBikes()\n{\n    nbBikes++;\n}\n\npublic int getBikes()\n{\n   \
  \ return nbBikes;\n}\n}\n\nvoid Start ()\n{\n    Bike bike1 = new Bike();\n    Bike\
  \ bike2 = new Bike();\n    bike1.countBikes();\n    bike2.countBikes();\n    print(\"\
  Nb Bikes:\"+bike1.getBikes());\n}}\n```\n\n下面的代码说明了静态函数的使用。\n\n```csharp\nusing\
  \ UnityEngine;\nusing System.Collections;\npublic class TestCode : MonoBehaviour\n\
  {\n    public class Bike\n    {\n        private float speed;\n        private int\
  \ color;\n        static void sayHello()\n        {\n            print(\"Hello\"\
  );\n        }\n    }\n\n    public void Start()\n    {\n        Bike.sayHello();\n\
  \    }\n}\n```\n\n之前的代码将产生以下输出：\n\nHello\n\n## 继承\n\n我希望目前一切清晰，因为我们将观察面向对象编程中非常有趣且重要的原则：继承。继承的核心思想是对象可以从其他对象（父对象）继承属性。它们继承这些属性时，可以保持相同，也可以进化并覆盖这些继承的属性。这非常有趣，因为它使得通过创建一个具有相似特征的对象的通用属性类来减少代码成为可能，然后根据需要进行覆盖和自定义这些某些属性。\n\
  \n让我们以车辆为例；它们通常具有以下属性：\n\n*   轮子数量。\n*   速度。\n*   乘客数量。\n*   颜色。\n*   加速的能力。\n*\
  \   停止的能力。\n\n因此，我们可以创建一个如下类，例如：\n\n```csharp\nclass Vehicles\n{\nprivate int nbWheels;\n\
  protected float speed;\nprivate int nbPassengers;\nprivate int color;\n\npublic\
  \ void accelerate()\n{\n    speed++;\n}\n}\n```\n\n\n\n\n这些功能可以应用于汽车、自行车、摩托车或卡车。然而，所有这些车辆也存在差异；其中某些可能有也可能没有引擎或方向盘。因此，我们可以基于\
  \ `Vehicles` 创建一个名为 `MotorizedVehicles` 的子类，但它具有与动力化相关的特定特殊性。这些添加的属性可能包括：\n\n* 引擎尺寸。\n\
  * 汽油类型。\n* 油位。\n* 加油能力。\n\n接下来的示例展示了如何创建这个类。\n\n```csharp\nclass MotoredVehicles:\
  \ Vehicles\n{\n    private float engineSize;\n    private int petrolType;\n    private\
  \ float petrolLevels;\n\n    public void fillUpTank()\n    {\n        petrolLevels+=10;\n\
  \    }\n}\n```\n\n* 当定义该类时，它的名称后面跟着 `: Vehicles`。这意味着它继承自 `Vehicles` 类。因此，默认情况下，它将可以使用\
  \ `Vehicles` 类中已经包含的所有方法和变量。\n* 我们为此类创建了一个新的成员方法，名为 `fillUpTank`。\n* 在上一个示例中，你可能注意到为\
  \ `Vehicles` 类定义的方法和变量没有出现在这里；这是因为它们被隐式地添加到这个新类中，因为它继承了 `Vehicles` 类。\n\n每当你在 Unity\
  \ 中创建一个新类时，它默认都会继承自 `MonoBehaviour` 类；结果是它会隐式地包含 `MonoBehaviour` 类的所有成员方法和变量。这些方法中包括\
  \ `Start` 或 `Update`。\n\n使用继承时，父类通常被称为 `base class`（基类），而子类被称为 `inherited class`（派生类）。\n\
  \n现在，虽然子类从父类继承了“行为”，但这些行为始终被修改，或者简单地说，被重写。然而，在这种情况下，基方法（在父类中定义的方法）必须声明为 `virtual`。此外，在重写此方法时，必须使用关键字\
  \ `override`。下方的代码所示。\n\n```csharp\nclass Vehicles\n{\n    private int nbWheels;\n\
  \    protected float speed;\n    private int nbPassengers;\n    private int color;\n\
  \n    public virtual void accelerate()\n    {\n        speed++;\n    }\n}\n\nclass\
  \ MotoredVehicles : Vehicles\n{\n    private float engineSize;\n    private int\
  \ petrolType;\n    private float petrolLevels;\n\n    private void fillUpTank()\n\
  \    {\n        petrolLevels += 10;\n    }\n\n    public override void accelerate()\n\
  \    {\n        speed += 10;\n    }\n}\n```\n\n在上一个示例中，虽然 `accelerate` 方法继承自 `Vehicles`\
  \ 类，但它通常会将速度增加 1。然而，通过重写它，我们确保在从 `MotoredVehicles` 类实例化对象的情况下的情况下，每次加速都会让速度增加 10。我们可以从子类\
  \ `MotoredVehicles` 访问成员变量 `speed`，因为它被声明为 `protected`。\n\n这一点也可以通过 Unity 中的一些类来来说明。让我们来看下一个示例。\n\
  \n```csharp\nusing UnityEngine;\nusing System.Collections;\n\npublic class TestCode\
  \ : MonoBehaviour {\n    public class Bike\n    {\n        private float speed;\n\
  \        private int color;\n        public static void sayHello()\n        {\n\
  \            print (\"Hello\");\n        }\n    }\n\n    public void Start ()\n\
  \    {\n        Bike.sayHello();\n    }\n}\n```\n\n在这个示例中，我们创建了一个类 `TestCode`；该类继承自\
  \ `MonoBehaviour`；默认情况下，该类包含了其他如 `Start` 和 `Update` 方法的定义；然而，默认情况下，这两个方法是空的；这就是为什么我们重写了\
  \ `TestCode` 类（继承自 `MonoBehaviour`）的这些方法，以便 `Start` 方法能够显示某些信息。\n\n显然还有更多与继承相关的概念；但是，本节提供的信息应该能让你轻松上手。有关\
  \ C# 继承的更多信息，你可以[查阅官方文档](https://msdn.microsoft.com/en-us/library/a72418yk%28v=vs.110%29.aspx)。\n\
  \n# 方法 (Methods)\n\n方法或函数可以比作朋友或同事，你根据特定的指令委地请求他们执行某任务，然后将信息返回给你。例如，你可以这样问你的朋友：“考虑到我出生于\
  \ 2000 年，请告诉我我什么时候会过 20 岁生日吗？”所以你给了你的朋友（擅长数学的人）信息（出生日期），他/她将计算出你 20 岁生日的年份并将此信息返回给你。换句话说，你的朋友将获得一个输入（即出生日期）并返回一个输出（即你\
  \ 20 岁生日的年份）。方法的工作原理完全如此：它们被赋予信息（有时没有），执行一个动作，然后（有时，如果需要）返回信息。\n\n在编程术语中，方法（或函数）是一个执行一组动作的指令块。它在从脚本调用（或更简单地称为调用）或在事件发生时执行。方法非常有用，因为一旦代码被创建，就可以被调用。至于成员变量，成员函数或方法是被声明的，它们也可以被调用。方法可以接收参数并产生信息。因此，方法可以执行以下操作：\n\
  \n* 执行动作。\n* 返回结果。\n* 接收参数并处理它们。\n\n方法有其语法，并可以如下方式声明：\n\n```csharp\nAccessType methodName()\n\
  {\n    // 执行动作\n}\n```\n\n在前面的代码中，方法不接受任何输入；也不返回输出。它只是执行动作。\n\n或者\n\n```csharp\n\
  typeOfReturned methodName()\n{\n    // 执行动作\n}\n```\n\n```csharp\npublic int calculateSum(int\
  \ a, int b)\n{\n    return (a+b);\n}\n```\n\n在上面的代码中：\n\n* 方法是 `public` 的：没有访问限制。\n\
  * 方法将返回一个整数。\n* 方法名称是 `calculateSum`。\n* 方法接收两个参数（即整数参数）。\n* 方法返回两个参数的和（在方法内部参数称为\
  \ `a` 和 `b`）。\n\n可以使用 `()` 运算符调用方法，如下：\n\n```csharp\nmethodName1();\nmethodName2(value);\n\
  int test = methodName3(value);\n```\n\n在前面的代码中，方法不带参数调用（第 1 行），或带参数调用（第 2 行）。在第三个示例中（第\
  \ 3 行），变量 `test` 将设置为 `methodName3` 返回的值。\n\n你可能会（我们稍后会讨论）在类中拥有相同名称但接收不同类型参数的方法。这通常被称为多态，因为方法字面上可以采取不同的形式，并根据提供的信息（例如数据类型）来处理信息。\n\
  \n## 访问方法和访问修饰符\n\n正如我们之前看到的，在 C# 中有不同类型的访问修饰符。这些修饰符规定了可以从哪里调用方法，可以是 `public`（无限制访问）、`protected`（访问限制于包含类或派自该类的类型）、`internal`（访问限制于当前程序集）、`protected\
  \ internal`（我们不会书中使用这种访问类型）以及 `private`（即访问限制于包含类型）。\n\n## 常用方法\n\n在 Unity 中，默认提供了许多方法，它们被称为内置方法。这些函数中的某些会在事件发生时被调用。例如：\n\
  \n\n\n\n\n* `Start` : 在场景开始时被调用。\n* `Update` : 每当屏幕刷新时被调用。\n* `OnControllerColliderHit`:\
  \ 每当第一人称控制器（一种用于通过第一人称视角导航你的场景的内置控制器）与物体碰撞时被调用。\n\n正如我们稍后将看到的，由于你的大多数类默认继承自 `MonoBehaviour`\
  \ 类，因此它们默认会包含几个方法，包括 `Start` 和 `Update`，你可以重写这些方法（即为了你自己的用途对其进行修改）。\n\n## 变量的作用域\n\
  \n每当你在 `C#` 中创建一个变量时，你都需要意识到变量的作用域和访问类型，以便在它的作用域允许的地方使用它。\n\n变量的作用域是指你在脚本中哪些地方可以使用该变量。在\
  \ `C#` 中，我们通常区分全局变量和局部变量。\n\n你可以将局部变量和全局变量这两个术语比作局部语言或全局语言。在第一情况下，局部语言仅供当地人使用（即说出来），而全局语言会被任何人（无论他们是当地人还是全球社区的一部分）使用（即说出来）并理解。\n\
  \n当你定义一个类并带有成员变量时，这些变量将被该类中的任何方法看到。\n\n全局变量是可以在脚本任何地方使用的变量，因此得名全局。这些变量需要在脚本的开头（使用通常的声明语法）并在任何方法之外进行声明；然后就可以如下一个代码片段所示，在脚本的任何地方使用。\n\
  \n```csharp\nclass MyBike\n{\n    private int color;\n    private float speed;\n\
  \    public void accelerate()\n    {\n        speed++;\n    }\n}\n```\n\n在之前的代码中，我们将变量\
  \ `speed` 声明为成员变量，并在 `accelerate` 方法中访问它。\n\n局部变量定义在方法内部，并且仅在该方法内部使用，因此被称为局部（local）”，因为它们只能在局部使用，正如下一个代码片段所示。\n\
  \n```csharp\npublic void Start()\n{\n    int myVar;\n    myVar = 0;\n}\n\npublic\
  \ void Update()\n{\n    int myVar2;\n    myVar2 = 2;\n}\n```\n\n在之前的代码中，`myVar`\
  \ 是 `Start` 方法的局部变量，只能在该函数内部使用；`myVar2` 是 `Update` 方法的局部变量，只能在该方法内部使用。\n\n## 事件\n\
  \n在整本书以及 `C#` 中，你将读到并使用事件。那么它们到底是什么呢？\n\n简单来说，事件可以被比为特定时间发生的事情，当此事件发生时，需要执行某些操作（例如，某个动作）。如果我们用日常活动来类比：当闹钟响起（事件）时，我们可以选择起床（动作）或决定继续睡一会儿。当你收到一封邮件（事件）时，你可以决定阅读它（动作），然后回复发送者（另一个动作）。\n\
  \n在计算机术语中，情况非常相似，尽管我们将处理的事件会略有不同。因此，我们可以等待用户按下按键（事件），然后相应地移动角色（动作），或者等待用户点击屏幕上的按钮（事件）来加载新场景（动作）。\n\
  \n在 Unity 中，每当事件发生时，通常会调用一个函数（或方法）（在这种情况下，该函数通常被称为处理器（handler），因为它“处理”了该事件）。然后你就有机会修改此函数并添加在这些事件发生时应该遵循的指令（即语句）。\n\
  \n继续用日常活动的类比：我们可以在纸上给朋友写指令，这样在在我们不在时有人打电话，朋友就确切知道该做什么。因此，事件处理器基本上是一组指令（通常存储在函数内部），以便在特定事件发生时遵循。\n\
  \n有时，关于特定事件的信息会传递给此方法，而有时则不会。例如，当屏幕刷新时，会调用 `Update` 方法。当游戏开始时（即当特定脚本被启用时），会调用 `Start`\
  \ 方法。当玩家和物体之间发生碰撞时，会调用 `OnControllerColliderHit` 方法。在这种特定情况下（即碰撞），通常会将一个物体传递给处理该事件的方法，以便我们获取更多关于参与碰撞的另一个物体的信息。\n\
  \n正如你所看到的，我们的游戏中可能存在各种广泛的事件，我们稍后会讨论这一点。在本书中，我们本质上将处理以下事件：\n\n* `Start`: 当脚本启用时（例如，场景开始）。\n\
  * `Update`: 当屏幕刷新时（例如，每一帧）。\n* `OnControllerColliderHit`: 当玩家与另一个物体之间发生碰撞时。\n* `Awake`:\
  \ 当游戏开始时（即仅一次）。\n\n## 多态（通用概念）\n\n多态（Polymorphism）一词源于 poly（多个）和 morph（形状）；因此它从字面上意思是“多种形式”。在面向对象的编程中，它指的是根据对象的数据类型或类以不同的方式（或更具体地）处理对象的能力。让我们以加法为例。如果我们想将两个数字相加，我们将进行代数加法（例如，`1\
  \ + 2`）。然而，加上两个字符串变量可能意味着将它们拼接（一个接一个地相加）。例如，加上文本“Hello”和文本“World”将得到文本“ HelloWorld”。正如你所看到的，对不同数据类型执行操作的方式可能有所不同。因此，让我们看看下面的代码，它说明了如何在\
  \ `C#` 中实现这一点。\n\n```csharp\npublic class AddObjects\n{\npublic int add (int a,\
  \ int b)\nreturn a + b;\n\npublic string add (string a, string b)\nreturn a + b;\n\
  }\n```\n\n在之前的代码中，可以加上不同类型的数据：整数和字符串。取决于传递的是两个整数还是两个字符串，我们将调用第一个 `add` 方法或第二个 `add`\
  \ 方法。\n\n### 动态多态\n\n在 `C#` 中，可以使用抽象类和虚函数来实现动态多态。\n\n在 `C#` 中，可以创建一个提供接口部分实现的类。广义地说，接口定义了类应该包含的内容（即成员方法、成员变量或事件），但它没有声明这些内容应该如何实现。因此，抽象类将包含抽象方法或变量；这意味着该类将定义变量的名称和类型、方法的名称以及该方法返回的数据类型。它被称为抽象（abstract），是因为你不能实现这种类（它永远无法被“实例化”）；然而，它可以作为派生类的模板（或“梦想”类）。让我们看看下面的例子。\n\
  \n```csharp\nabstract class Vehicule\n{\n    public abstract void decelerate();\n\
  }\n\nclass Bike : Vehicule\n{\n    private float speed;\n    private int color;\n\
  \    public Bike(float newSpeed)\n    {\n        speed = newSpeed;\n    }\n    public\
  \ override void decelerate()\n    {\n        speed--;\n    }\n}\n```\n\n在之前的代码中：\n\
  \n* 我们声明了一个抽象类 `Vehicule`。\n* 我们声明了一个名为 `decelerate` 的抽象方法。\n* 然后我们创建了一个新类 `Bike`，继承自抽象类\
  \ `Vehicule`，但带有它自己的构造函数。\n* 然后我们重写了抽象方法 `decelerate` 以使用我们自己的实现。\n\n使用抽象类仅仅意味着我们列出了对子类有用的的方法；然而，子类必须定义如何实现这些方法。\n\
  \n\n\n\n\n实现动态多态的第二方法是使用虚拟方法或变量。在虚拟方法的情况下，我们声明了一个将被此类或继承类的对象默认使用的方法；然而，在这种情况下，即使方法已经就绪（即因为我们已经定义了它应该如何实现），它也可以被子类（即被继承的类）修改（重写）以适应特定的目的。在这种情况下（即被继承的方法），我们需要使用\
  \ `override` 关键字来指定我们重写了该方法。\n\n抽象方法和虚拟方法之间的区别在于：抽象方法**应该**被重写，而如果基方法（即在基类中声明的方法）不符合特定目的，虚拟方法**可以**被重写。\n\
  \n让我们来看例子：\n\n```csharp\nclass Vehicle\n{\n    protected float speed;\n    public\
  \ virtual void accelerate()\n    {\n        speed += 10;\n    }\n    public Vehicle(float\
  \ newSpeed)\n    {\n        speed = newSpeed;\n    }\n}\n\nclass Bike : Vehicle\n\
  {\n    public override void accelerate()\n    {\n        speed++;\n    }\n    public\
  \ Bike(float newSpeed) : base(newSpeed){}\n}\n```\n\n在前面的代码中：\n*   我们声明了一个类 `Vehicle`。\n\
  *   它包含一个保护变量 `speed` 和一个名为 `accelerate` 的虚拟方法。该方法是虚拟的，这意味着如果需要，继承类将能够修改（重写）它。\n\
  *   `Bike` 类有它自己的构造函数；然而，这个构造函数继承了父类的构造函数；这意味着通过调用类 `Bike` 的构造函数，我们实际上调用了父类（基类）构造函数，语法为：`public\
  \ Bike(float newSpeed) : base(newSpeed){}`\n*   然后我们创建了一个继承自 `Vehicle` 类的新类 `Bike`。在这个类中，我们使用\
  \ `override` 关键字重写了 `accelerate` 方法，使速度只增加。\n\n# 创建脚本的工作流\n\n在 Unity 中创建和使用脚本有很多方法，但通常流程如下：\n\
  \n*   使用 Project View（`Create | C# Script`）或主菜单（`Assets | Create | C# Script`）创建一个新脚本。\n\
  *   将脚本挂载到对象上（例如，将脚本拖放到对象上）。\n*   检查 Console 窗口，确保脚本没有错误。\n*   运行场景。\n\n当你创建脚本时，默认情况下脚本中类的名称将与脚本的名称相同。假设你创建了一个名为\
  \ `TestCode` 的新脚本，那么内部会自动生成以下代码：\n\n```csharp\nusing UnityEngine;\nusing System.Collections;\n\
  \npublic class TestCode : MonoBehaviour\n{\n    public void Start ()\n    {\n  \
  \  }\n    public void Update ()\n    {\n    }\n}\n```\n\n在前面的代码中，已经创建了类 `TestCode`；它继承自\
  \ `MonoBehaviour` 类，并包含了两个可以修改的方法：`Start` 和 `Update`。你还会注意到两个命名空间 `UnityEngine`\
  \ 和 `System.Collections`。正如我们之前看到的，`using` 关键字被称为指令；在这种特定情况下，它被用于导入所谓的命名空间；简单来说，通过添加此指令，你实际上导入了一组类或数据类型。这些命名空间（或“库”）每一个都包含了对你的程序有用的类。例如，`UnityEngine`\
  \ 命名空间将包含用于 Unity 开发的类，而 `System.Collections` 将包含用于不同对象集合的类和接口。当然，你可以创建不会链接到任何对象的类，并将其用于实例化新对象。\n\
  \n# 脚本如何编译\n\n每当你创建并保存脚本时，它都会被编译，Unity 会通过 Console 窗口向你通知任何错误。尽管如此，脚本的编译顺序取决于它们的位置。首先是位于\
  \ `Standard Assets`、`Pro Standard Assets` 或 `Plugins` 文件夹中的脚本，然后是位于 `Standard Assets/Editor`、`Pro\
  \ Assets/Editor` 或 `Plugins/Editor` 中的脚本，接着是 Editor 文件夹之外的脚本，最后是 Editor 文件夹中的脚本。更多关于脚本编译的信息，你可以[查看官方文档](http://docs.unity3d.com/412/Documentation/ScriptReference/index.Script_compilation_28Advanced29.html)。\n\
  \n# 编码规范\n\n在你编写代码时，通常会有基于你所使用的语言的命名规范。这些规范通常能提高代码的清晰度，取决于你将使用的语言。\n\n命名规范通常使用驼峰命名法（camel\
  \ casing）和帕斯卡命名法（Pascal casing）的组合。\n*   在小驼峰命名法中，名称中包含的所有单词除第一个单词外，首字母均大写（例如，`myVariable`）。\n\
  *   在帕斯卡命名法中，名称中包含的所有单词首字母均大写（例如，`MyVariable`）。\n\n例如，在 C# 中编写代码时，命名规范将根据你是在命名类、接口、变量还是资源，使用小驼峰和帕斯卡命名法的组合。\n\
  \n然而，作为一名 C# 初学者，除了学习类、方法或继承之外，在开始阶段没有必要完全遵循这种命名规范，只要你使用一致的命名方案即可。\n\n所以，虽然承认不同的命名规范是件好事，但本书将使用一种简化的规范：\n\
  *   类（帕斯卡命名法）。\n*   所有方法和变量（小驼峰命名法）。\n\n一旦你对 C# 感到熟悉并想了解更多官方方案，可以查看[命名指南](https://msdn.microsoft.com/en-us/library/ms22902?v=10.aspx)。\n\
  \n创建脚本时需要记住的注意事项（清单）\n\n在你创建第一个脚本时，无疑会出现错误，甚至可能让你抓狂头发。你看，当你开始编写代码时，会犯小错误；这是过程的一部分。我们都是通过尝试和错误学习的，出错是学习过程的一部分。\n\
  \n所以，在你创建第一个脚本时，放下恐惧，尽管尝试并学习这门语言。这就像学习一门新的外语：当有人听懂你的第一个句子时，你会感到非常有成就感！C# 也是如此，为了方便学习过程，我在编写脚本时包含了一些技巧和注意事项，以便你进展得更快。\n\
  \n*   每个左括号都有对应的右括号。\n*   所有变量的写法必须一致（例如，拼写和大小写）。变量名对大小写敏感；这意味着如果你声明了一个变量 `myvariable`\
  \ 但后在代码中引用 `myVariable`，这可能会触发错误，因为 `myVariable` 和 `myvariable` 因为大小写不同（大或小写 `V`）被视为两个不同的变量。\n\
  *   所有变量在使用之前都已声明（类型和名称）。\n*   传递给方法的参数类型是该方法要求的类型。\n*   方法返回的参数类型是方法要求返回的类型。\n\n\
  \n\n\n\n- 内置函数的拼写需要区分大小写（例如，`Update` 使用大写的 `U`）。\n- 始终统一使用驼峰命名法（即：除第一个单词外，每个单词的首字母均大写）或帕斯卡命名法（即：每个单词的首字母均大写）。\n\
  - 所有语句均以分号结尾。\n- 对于 `if` 语句，条件位于圆括号内。\n- 对于 `if` 语句，条件使用语法 `==` 而不是 `=`。\n- 在调用方法时，使用该方法的精确名称（即：区分大小写）。\n\
  - 引用变量时，应根据变量的访问类型（例如 `public` 或 `private`）进行。\n- 局部变量在同一个方法内声明并可以在该方法中使用。\n- 全局变量在方法外部声明，并可以在类的任意任何地方使用。\n\
  \n# 2 创建你的第一个脚本\n\n在本节中，我们将开始在 Unity 中编写 C# 脚本。本节的一些目标将是：\n\n- 介绍 Unity 中的 C# 脚本编写。\n\
  - 解释一些基础脚本概念。\n- 解释如何将代码中的信息显示到控制台（Console）窗口。\n\n完成本章后，你将能够：\n\n- 理解 C# 的基本概念。\n\
  - 理解最佳编码实践。\n- 在 Unity 中编写你的第一个脚本。\n- 创建类、方法和变量。\n- 根据你自己的类实例化对象。\n- 使用内置方法。\n-\
  \ 使用条件语句。\n\n如果你已经熟悉 C#，或者你已经在 Unity 中创建并使用过 C# 脚本，可以跳过本章。\n\n## 起始\n\n在 Unity 中，脚本（C#\
  \ 脚本）通常链接到一个对象；尽管它也可以作为一个独立的类在稍后的阶段实例化；通常情况下，为了执行你的脚本，它需要链接到一个对象。因此，我们首先创建一个空对象，创建一个脚本，并将此脚本链接到该对象。\n\
  \n- 请启动 Unity。\n- 创建新项目（`File | New Project`）。\n- 创建新场景（`File | New Scene`）。\n-\
  \ 创建一个空对象（`GameObject | Create Empty`）。\n- 在层级（Hierarchy）窗口中重命名此对象：`example_for_scripting`。你可以通过右键点击此对象并从右键菜单中选择\
  \ `Rename` 选项，或者选择该对象（即点击一下）并按 `CTRL + Enter`。\n- 你会查看检查器（Inspector）窗口发现此对象只有一个组件（`Transform`）。\n\
  \n### 让我们创建一个新脚本\n\n- 在项目（Project）窗口中，点击一次 `Assets` 文件夹。\n- 创建一个新文件夹来存储脚本（这不是强制的，但有助于组织你的脚本）：选择\
  \ `Create | Folder`。\n\n![](img/Image00000.jpg)\n图 2‑1：创建一个新文件夹\n\n- 这将创建一个名为 `Folder`\
  \ 的新文件夹。\n- 将此文件夹重命名为 `Scripts`。\n- 双击此文件夹显示其内容，以便我们即将创建的脚本被添加到此文件夹。\n- 在项目（Project）窗口中，选择\
  \ `Create | C# Script`。\n- 这应该创建一个新的 C# 脚本。\n\n![](img/Image00001.jpg)\n图 2‑2：创建一个新的\
  \ C# 脚本\n\n- 默认，此脚本将命名为 `NewBehaviourScript`。但名称将以蓝色突出，以便你在脚本内容创建之前修改名称。请将此脚本重命名为\
  \ `MyFirstScript`。\n\n注意，脚本的名称应与脚本内主类的名称匹配；因此，如果你以后想重命名此脚本，也需要修改脚本内主类的名称。\n\n- 点击一次脚本；在此期间，查看检查器（Inspector）窗口，你将看到脚本的内容。默认情况下，你会注意到它包含了类\
  \ `MyFirstScript` 的定义、命名空间（namespaces），以及两个不同的成员方法 `Start` 和 `Update`。\n- 在项目（Project）窗口中双击脚本，将在\
  \ `Visual Studio` 中打开脚本，它是 Unity 的默认编辑器。\n\n注意，你可以更改你喜爱的编辑器（例如 `Notepad++` 或 `Sublime`）。这可以通过更改\
  \ Unity 的偏好设置（`Edit | Preferences | External Tool`）来实现。话虽如此，虽然 `Visual Studio` 默认提供了代码自动补全，但其他代码编辑器可能并非如此（例如，使用\
  \ `Sublime` 时你需要安装特定的包）。\n\n- 当脚本在 `Visual Studio` 中打开时，我们可以更详细地查看它。同样，`Start` 方法在场景开始时被调用一次。`Update`\
  \ 方法在每次屏幕刷新时（每一帧）被调用。\n- 这些函数是区分大小写的；因为它们是内置函数（即 Unity 供你使用的函数），Unity 期望它们具有精确的拼写。\n\
  \n- 那么，让我们开始编码吧。\n- 首先，创建一个 `integer` 类型的变量作为 `private` 成员变量。\n- 在 `Start` 之前输入以下代码：\n\
  \  `private int number;`\n- 如你所见，该变量声明在任何方法之外但在 `MyFirstScript` 类内部，这意味着它是一个成员变量。访问修饰符\
  \ `private` 指定该变量仅供 `MyScript` 类访问。我们可以声明一个 `String 变量`。\n- 以下代码仅为声明：\n    `string\
  \ stringName;`\n- 然后在花括号内（即：在任何地方）编写代码：\n  `number = 1;`\n- 此代码将变量 `number` 设置为\
  \ `1`；该变量是在脚本开始时声明的，作为成员变量，并可以在 `MyFirstScript` 类中的任何地方访问。\n- 然后，我们可以声明一个 `String\
  \ 变量` `myName`。\n- 输入这行代码时，确保变量名称拼写正确（例如：大写的 `N`）。\n- 然后在 `Start` 方法内部输入以下代码（你可以用自己的名字替换\
  \ `Patrick`）：\n  `myName = \"Patrick\";`\n- 然后在上一语句之后输入以下代码以便在控制窗口显示消息：\n  `print\
  \ (\"Hello\" + myName + \"Your number is \"+number);`\n- 这会在 Unity 的控制窗口打印 `Hello\
  \ Patrick Your number is 1`。此窗口显示来自 Unity 的错误消息或来自代码的消息。你可能会注意到 `Patrick` 周围有引号，这意味着将显示\
  \ `Hello`，我们将变量 `myName` 的值添加到它。因此，这两个字符串被拼接（即：组合在一起）形成一个动态句子，其内容取决于变量 `myName`\
  \ 和 `number` 的值。\n\n在在此阶段，你的代码应该如下（如果不是，你可以使用下一个代码段作为模板）：\n\n```csharp\nusing UnityEngine;\n\
  using System.Collections;\n\npublic class MyFirstScript : MonoBehaviour\n{\n   \
  \ // 使用此初始化\n    private int number;\n    private string myName;\n\n    void Start\
  \ ()\n    {\n        number = 1;\n        myName = \"Patrick\";\n        print (\"\
  Hello\" + myName + \"Your number is \"+number);\n    }\n\n    // Update 每帧调用一次\n\
  \    void Update ()\n    {\n    }\n}\n```\n\n- 在此阶段，我们可以保存脚本（`CTRL + S`）并返回 Unity（`ALT\
  \ + TAB`）。\n- 在 Unity 中，将脚本 `MyFirstScript` 拖放到空对象 `example_for_scripting` 上，如下图所示。\n\
  \n![](img/Image00002.jpg)\n图 2‑3：将脚本链接到对象\n\n- 之后，如果你点击层级中的对象 `example_for_scripting`，你现在应该在检查器窗口中看到脚本已成为该对象的组件。\n\
  \n\n\n\n\n-   查看控制台（Console）窗口以检查是否有错误；该窗口应该是空的（即没有错误）。如果有任何警告，你可以暂时忽略它们（这不会阻止场景的播放）。\n\
  -   我们现在可以运行场景（`CTRL + P`）；在我们运行场景并查看控制台窗口（`SHIFT + CTRL + C`）时，我们应该看到消息“ Hello\
  \ Patrickyour number is 1 ”\n\n![](img/Image00003.jpg)\n\n图 2‑4：在控制台窗口中显示消息 - 部分\
  \ 1\n\n-   你可能会注意到 `Patrick` 和 `you` 单词之间缺少一个空格，我们可以据此进行修正。要做到这一点，我们可以回到代码编辑器（例如\
  \ `Visual Studio`）修改脚本并按如下所示添加空格（在 `Hello` 和 `is` 单词之后，以及 `your` 单词之前）：\n\n```csharp\n\
  print(“Hello ” + myName + “ your number is ”+number);\n```\n\n当我们回到 Unity 时，可以通过点击名为\
  \ `Clear` 的标签页来清除控制台窗口，如下一图所示。然而，为了在每次运行场景时都清除控制台窗口，我们还可以点击标记为 `Clear on Play` 的标签页。这确保了每次播放场景时控制台都会被清除，避免可能过时或无关的消息填满控制台。\n\
  \n-   当我们播放场景时，我们可以看到消息已过修改，在 `Patrick` 和 `your` 单词之间包含了一个空格。\n\n![](img/Image00004.jpg)\n\
  \n图 2‑5：在控制台窗口中显示消息 - 部分 2\n\n就是这样！我们使用内置方法 `Start` 和一些变量（具体说是全局变量）创建了我们的第一个脚本。这些变量的类型为\
  \ `integer`（整数）和 `String`（字符串）。再次，这些变量是全局的，因为它们是在脚本开头声明的，位于任何方法之外。因此，它们可以在整个脚本中使用。完整的脚本应该如接下来的代码段所示。\n\
  \n```csharp\nusing UnityEngine;\n\nusing System.Collections;\n\npublic class MyFirstScript\
  \ : MonoBehaviour\n{\n\n// 使用此进行初始化\n\nprivate int number;\n\nprivate string myName;\n\
  \nvoid Start ()\n{\nnumber = 1;\nmyName = \"Patrick\";\nprint(\"Hello \"+ myName\
  \ + \"Your number is \" +number);\n}\n\n// Update 每帧被调用一次\n\nvoid Update ()\n{\n\
  \n}\n\n}\n```\n\n### 使用 Update 函数\n\n现在让我们使用 `Update` 方法在控制台窗口中显示另一个消息。同样，此方法每帧都会调用一次（即每次屏幕刷新时），因此在此方法内打印的任何消息将无限显示且每帧显示。\n\
  \n-   切换到 Unity。\n-   双击脚本 `MyFirstScript` 打开它。\n-   在 `Visual Studio`（或你喜欢的任何其他代码编辑器）中，在\
  \ `Update` 方法的花括号内输入以下代码：\n\n```cs\nprint (myName);\n```\n-   保存你的代码（Mac 用户使用 `CTRL\
  \ + S` 或 `APPLE + S`）。\n-   切换回 Unity 并播放场景（`CTRL + P`）。\n-   你应该看到消息 `Patrick`（或你自己的名字）无限显示。在下一张图中，我们可以看到消息在几秒钟后显示了\
  \ 148 次。\n\n![](img/Image00005.jpg)\n\n图 2‑6：使用“Collapse”（折叠）选项 – 部分 1\n\n-   代码运行良好；但是，由于消息显示次数过多，我们丢失了从\
  \ `Start` 函数显示的第一条消息。这是因为控制台被数百条相同的消息淹没，为了清理控制台，我们可以点击控制台窗口内标记为 `Collapse` 的标签。\n\
  \n`Collapse` 选项确保相同的消息只显示一次，并带有一个指示显示次数的数字。\n-   如果我们停止游戏，按下 `Collapse` 选项并再次播放场景，控制台窗口将如如下所示。\n\
  \n![](img/Image00006.jpg)\n\n图 2‑7：使用“Collapse”选项 - 部分 2\n\n-   正如我们看到的，来自 `Start`\
  \ 方法的消息显示了（一次），而来自 `Update` 方法的消息显示了一次，但控制台指示它已发布了 223 次。\n\n### 创建局部变量\n\n在现阶段，代码运行良好，我们创建了两个成员变量：`number`\
  \ 和 `myName`。这两个变量在整个类中都是可访问的；然而，为了实验局部变量，我们也可以创建仅从一个方法访问的变量。所以让我们实验一下吧。\n\n-  \
  \ 切换回代码编辑器（例如 `Visual Studio`）。\n-   删除或注释掉我们刚刚在 `Update` 函数中创建的代码。要注释代码，你可以使用双斜杠，如接下来的代码段所示。\n\
  \n```cs\n//print (myName);\n```\n-   将以下代码添加到 `Start` 方法中，紧接在该函数的结束大括号之前。\n\n```cs\n\
  int localVariable = 3;\nprint(“local variable: \"+localVariable);\n```\n\n通过第一条语句，我们声明了一个应该仅局部使用的变量，也就是说，在\
  \ `Start` 方法内部。然后我们打印该变量的值，并显示一条包含字符串“local variable”的消息，其后将跟随（或附加到）变量 `localVariable`\
  \ 的值；在我们的情况下，这应该显示“local variable: 3”。\n\n-   检查你编写的代码，确保无误（例如，每行末尾有分号）。\n-   保存脚本。\n\
  -   切换回 Unity 并播放场景。\n-   当我们播放场景时，控制台窗口看起来如下：\n\n![](img/Image00007.jpg)\n\n图 2‑8：在控制台中显示局部变量\n\
  \n-   我们可以看到来自 `Start` 方法的第一条消息，以及我们刚刚创建的第二条消息。然后来自 `Update` 方法的消息显示了（55 次）。\n-\
  \   现在，为了演示变量的作用域的重要性，我们将故意制造一个错误；我们在 `Start` 方法之外尝试使用 `localVariable`（这是一个局部变量）。正如你所料的，这将触发一个错误。\n\
  \n-   切换回 `Visual Studio`。\n-   在 `Update` 方法内部输入或粘贴以下代码：\n\n```cs\nprint(“local\
  \ variable ”+localVariable);\n```\n-   保存脚本（`CTRL + S`）。\n-   切换回 Unity。在尝试播放场景之前，你会注意到控制台中报错：\n\
  \n![](img/Image0008.jpg)\n\n图 2‑9：故意生成错误\n\n通过显示此消息，Unity 告诉我们我们在使用的范围内不识别变量 `localVariable`。这是因为是在\
  \ `Start` 方法中局部声明的，然后在该方法之外使用了。所以当你编写游戏时看到类似的消息，请始终检查变量的作用域。这应该为你节省很多麻烦。\n\n-  \
  \ 切换回代码编辑器并注释或删除我们刚刚在 `Update` 方法中创建的行行。\n\n```cs\n//print(“local variable ”+localVariable);\n\
  ```\n\n在 C# 中，你可以通过在行开头添加 `//` 来注释代码。这意味着该代码是脚本的一部分，但不会被执行。\n\n### 创建一个简单的计数器\n\n\
  让我们创建一个简单的计数器来练习声明变量和给变量赋值。这个计时器将从 0 开始计数，并使用一个变量，其值将随时间增加（即每帧增加）。\n\n-   通过 `ALT\
  \ + Tab` 切换回 Unity（Mac 用户使用 `CMD + Tab`）。\n\n由于你在开发过程中需要多次在 Unity 和 `Visual Studio`（或其他代码编辑器）之间切换，你可以使用此快捷键进行操作，这将为你节省大量时间。想象每天节省\
  \ 3 秒！通过按下 `ALT + Tab`（在 Mac 上为 `APPLE + Tab`），你可以切换回上一个窗口（或你之前正在使用的应用程序）。\n\n\n\
  \n\n\n*   在我们的类顶部（即 `MyFirstScript`）添加以下行以声明我们的计数器（紧接 `myName` 的声明之后）。\n\n```csharp\n\
  private int counter;\n```\n\n*   然后，通过在 `Start` 方法中添加以下代码将变量 `counter` 初始化为零。\n\n\
  ```csharp\ncounter = 0;\n```\n\n请注意，目前仅在 `Start` 方法中执行此操作，这样它就只执行一次（即在场景开始时）。如果我们将此代码添加到\
  \ `Update` 方法中，该变量将在每一帧（不断地）被初始化为 0，而我们现在并不这样做。\n\n*   最后，在 `Update` 方法的末尾添加以下代码，这样我们每帧都会给变量\
  \ `counter` 的当前值加 1（即每次屏幕刷新时），并显示它的值。\n\n```csharp\ncounter = counter + 1;\nprint\
  \ (\"counter=\"+counter);\n```\n\n*   在完成这些修改后，代码应该如下所示：\n\n```csharp\nusing UnityEngine;\n\
  using System.Collections;\n\npublic class MyFirstScript : MonoBehaviour\n{\n   \
  \ // 使用此项进行初始化\n    private int number;\n    private string myName;\n    private\
  \ int counter;\n\n    void Start ()\n    {\n        number = 1;\n        myName\
  \ = \"Patrick\";\n        print(\"Hello \"+ myName + \"Your number is \" +number);\n\
  \        int localVariable = 3;\n        print(\"local variable: \"+localVariable);\n\
  \        counter = 0;\n    }\n\n    // Update 每帧调用一次\n    void Update ()\n    {\n\
  \        counter = counter + 1;\n        print (\"counter=\"+counter);\n    }\n\
  }\n```\n\n*   切回 Unity (`ALT + TAB`)。\n\n*   查看 `Console` 窗口：它不应该显示任何错误（前提是你已经注释掉或删除了我们为了故意生成错误而创建的代码）。\n\
  \n*   运行场景 (`CTRL + P`)，查看 `Console` 窗口，你会看到 `counter` 的值被显示并且正在增加。\n\n你可能会注意到，即使你在\
  \ `Console` 窗口中点击了 `Collapse`（折叠）选项，消息也不会折叠，并且仍然会刷屏 `Console` 窗口。这是因为 `Collapse`\
  \ 选项仅在显示完全相同的消息时起作用；但在我们的情况下，由于 `counter` 的值每次都不同，消息每帧都是不同的（例如，“counter=1”，“counter=2”等）。\n\
  \n在这个阶段，我们已经了解了局部变量和全局变量，让我们深入研究方法并创建我们的第一个方法。\n\n# 创建你的第一个方法\n\n那么什么是方法？方法（我们在\
  \ JavaScript 中以前称的函数）通常用于在游戏主体之外执行任务。我通常将函数比作朋友或同事，你委婉地请求他们为你完成某项任务。在很多情况下，你会调用它们，它们就会执行该任务。有时他们需要某些特定信息来执行任务（例如，一个数字以便代表你拨打电话）；另一些时候，他们会回调给你提供他们找到的信息，但在其他情况下，这可能是没有必要的，他们会在执行任务后不再再与你联系。\n\
  \n因此，本质上有三种类型的方法：\n\n*   没有参数只执行动作的方法。\n*   带有参数执行动作的方法。\n*   执行动作（带或不带参数）并返回结果的方法。\n\
  \n## 声明方法\n\n如果你以前写过 JavaScript，函数是使用 `function` 关键字声明的；但在 C# 中，方法声明通常需要一个访问修饰符、返回的数据类型以及传递给此函数的参数类型。\n\
  \n声明方法的语法如下：\n\n*   访问修饰符（例如 `private`、`public` 或 `protected`）。\n*   方法返回的数据类型（例如\
  \ `float`、`string` 或 `bool`）。\n*   方法名。\n*   左圆括号。\n*   参数的类型及其名称。\n*   右圆括号。\n\
  *   此方法执行的任何动作（即语句）都将添加到大括号内，并在末尾跟一个分号。\n\n在接下来的章节中，我们将看到如何声明方法的示例。\n\n## 不返回或不接受任何参数的方法\n\
  \n在这种情况下，调用方法时不不带任何参数；它将执行一个动作。这是方法最简单的形式。语法如下：访问修饰符、关键字 `void`、后面是函数名、然后是左右圆括号、最后是左右大括号。此函数执行的任何动作（即语句）都将添加到大括号内，并在末尾跟一个分号。\n\
  \n```csharp\npublic void theNameOfyourMethod()\n{\n}\n```\n\n关键字 `void` 表示该方法不返回任何数据。\n\
  \n所以为了创建我们的第一个方法，我们可以在脚本的末尾（即在最后一个右大括号之前）输入以下内容：\n\n```csharp\npublic void myFirstMethod()\n\
  {\n    print (\"Hello World\");\n}\n```\n\n调用时，此方法将在 `Console` 窗口中打印“Hello World”消息。\n\
  \n在这个阶段，我们刚刚定义了方法 `myFirstMethod`；换句话说，我们指定了方法在被调用时应该做什么。一旦方法被定义，我们就可以通过语法调用它：`myFirstMethod();`；例如，为了让消息在\
  \ `Console` 窗口中显示，我们可以在 `Start` 方法内部注释所有的 `print` 语句：\n\n```csharp\nmyFirstMethod();\n\
  ```\n\n这样代码看起来如下：\n\n```csharp\nusing UnityEngine;\nusing System.Collections;\n\n\
  public class MyFirstScript : MonoBehaviour\n{\n    // 使用此项进行初始化\n    private int\
  \ number;\n    private string myName;\n    private int counter;\n\n    void Start\
  \ ()\n    {\n        number = 1;\n        myName = \"Patrick\";\n        print(\"\
  Hello \"+ myName + \"Your number is \" +number);\n        int localVariable = 3;\n\
  \        print(\"local variable: \"+localVariable);\n        counter = 0;\n    \
  \    myFirstMethod();\n    }\n\n    // Update 每帧调用一次\n    void Update ()\n    {\n\
  \        counter = counter + 1;\n        print (\"counter=\"+counter);\n    }\n\n\
  \    public void myFirstMethod()\n    {\n        print (\"Hello World\");\n    }\n\
  }\n```\n\n你可能会疑惑为什么 `Update` 和 `Start` 方法没有包含访问修饰符（例如 `public` 或 `private`）。这是因为默认情况下，方法的访问修饰符是\
  \ `private`。所以，如果没有指定访问修饰符，它将被视为私有方法。\n\n注意，方法在脚本中的位置（即在结尾或开头）并不重要，只要它是在类（`MyFirstScript`）内部且在其他方法之外定义的：所以你需要在任何方法的右大括号之后定义方法；或者我们可以轻松地在脚本的开头或中间编写这个方法而不会产生错误。\n\
  \n*   检查你的代码编写是否正确（即无错误）。\n*   保存你的代码 (`CTRL + S`)。\n*   切换到 Unity (`ALT + TAB`)。\n\
  *   检查 `Console` 窗口中没有错误。\n*   运行场景并检查消息是否为“Hello World”。\n\n## 定义带参数的方法\n\n到目前为止，我们查看了不接受或返回任何参数的方法。现在，我们将创建一个仍然不返回任何数据，但接受一个或多个参数以执行计算的方法。\n\
  \n所以借用之前的例子，你调用某人，给他们一些信息，并要求他们根据你的指令执行操作。为了说明这一概念，让我们创建一个新方法，它将根据作为参数传递的参数显示消息。\n\
  \n*   请在类的末尾（即在最后一个右大括号之前）输入以下代码。\n\n```csharp\npublic void mySecondMethod(string\
  \ name)\n{\n    print (\"Hello, your name is \" +name);\n}\n```\n\n\n\n\n- 在之前的代码中，我们创建了一个名为\
  \ `mySecondMethod` 的方法。它接收一个类型为 `String`（即 `text`）的参数 `name`。因此，当我们调用此方法并在括号中包含一个字符串变量时，该变量在该方法内部将被视为\
  \ `name`。\n- 让我通过以下代码来说说明。\n\n```csharp\nmySecondMethod(“Patrick”);\n```\n\n如果我们把之前的代码输入到\
  \ `Start` 方法中，`mySecondMethod` 方法将把字符串 `Patrick` 赋值给变量 `name`，然后显示消息 `Hello Patrick`。变量\
  \ `name` 是方法 `myFunction` 的一个局部变量。\n\n如果你还没有这样做，请将以下代码添加到 `Start` 方法中。你可以将 `Patrick`\
  \ 一词替换为你自己的名字。\n\n```csharp\nmySecondMethod(“Patrick”);\n```\n\n- 保存你的代码，切换到 Unity，检查\
  \ `Console` 窗口是否有错误，并运行场景。\n- 你应该在其他消息中看到“Hello, your name is Patrick”这条消息。\n- 你现在可以更改对该方法的调用，并将你自己的名字作为参数传递，并在运行场景时查看结果。\n\
  \n注意，我们也可以创建一个接收许多其他参数的方法。例如，我们可以创建一个接收名和姓作为参数的方法，如下所示。\n\n```csharp\npublic void\
  \ myThirdMethod(string fName, string lName)\n{\n    print (\"Hello, your name is\
  \ \" +fName+\" \"+lName);\n}\n```\n\n### 定义一个接收参数并返回信息的方法\n\n到目前，我们已经了如何声明一个接收参数的方法；但我们还没有看到如何定义一个也能返回信息的方法。\n\
  \n这种类型除了可能接收参数并处理这些信息外，还将信息返回到调用它的地方。\n\n在下面的示例中，我们将创建一个完成所有这三任务的方法：它会被调用；它将把出生年份作为参数，然后计算并返回相应的年龄（基于当前年份）。\n\
  \n- 请将以下代码添加到脚本的末尾。\n\n```csharp\npublic int calculateAge(int YOB)\n{\n    int age;\n\
  \    age = 2016 - YOB;\n    return (age);\n}\n```\n\n在之前的代码中：\n- 调用 `calculateAge`\
  \ 的方法使用关键字 `public` 和 `int` 声明，因为它的访问类型是公共的，并且它将返回一个整数。\n- 方法 `calculateAge` 接收一个名为\
  \ `YOB` 的参数（Year Of Birth 的缩写）。\n- 方法 `calculateAge` 然后从当前年份中减去 `YOB` 并返回结果。\n\n\
  请将以下代码添加到 `Start` 方法中。\n\n```csharp\nint myAge = calculateAge(1998);\nprint(\"Your\
  \ age is \" + myAge);\n```\n\n在之前的代码中：\n- 方法 `calculateAge` 被调用一次；它返回计算出的年龄，这个（返回的）值保存在名为\
  \ `myAge` 的变量中。\n- 变量 `myAge` 然后在 `Console` 窗口中打印。\n- 保存你的代码并切换回 Unity。\n- 检查 `Console`\
  \ 窗口中没有错误并运行场景。\n- 控制台应该在其他消息中显示“Your age is 18”这条消息。\n\n正如你所看到的，根据你的，你可以创建不同类型的方法。它们可能接收或不接收参数，也可能返回或不返回结果。\n\
  \n### 创建你自己的类\n\n为了完成这一节，如果能看到如何创建和使用你自己的类就太好了。所以，我们将简单地为自行车创建一个类并使用它。让我们开始吧。\n\n\
  - 请创建一个名为 `Bike` 的新 C# 脚本（例如，在 Project 窗口中选择 Create | C# Script）。\n- 这将默认生成一个带有以下代码的脚本：\n\
  \n```csharp\nusing UnityEngine;\nusing System.Collections;\n\npublic class Bike\
  \ : MonoBehaviour {\n    // 使用此进行初始化\n    void Start () {\n    }\n    // Update\
  \ 每帧被调用一次\n    void Update () {\n    }\n}\n```\n\n完成后，让我们编辑此脚本为我们的自行车添加一些功能。\n-\
  \ 我们可以从删除文本 `:MonoBehaviour` 开始。这是因为我们的类将作为独立独立类使用，而不是继承自 `MonoBehaviour` 类（该类主要用于场景中的游戏对象）。\n\
  - 然后我们可以删除 `Start` 和 `Update` 方法，原因与上述说明相同，因为我们将为类 `Bike` 创建我们自己的方法。\n- 所以你的代码应该看起来如下：\n\
