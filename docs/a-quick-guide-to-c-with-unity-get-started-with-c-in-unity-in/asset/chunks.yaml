  trans: "\n\n*   在我们的类顶部（即 `MyFirstScript`）添加以下行以声明我们的计数器（紧接 `myName` 的声明之后）。\n\n\
    ```csharp\nprivate int counter;\n```\n\n*   然后，通过在 `Start` 方法中添加以下代码将变量 `counter`\
    \ 初始化为零。\n\n```csharp\ncounter = 0;\n```\n\n请注意，目前仅在 `Start` 方法中执行此操作，这样它就只执行一次（即在场景开始时）。如果我们将此代码添加到\
    \ `Update` 方法中，该变量将在每一帧（不断地）被初始化为 0，而我们现在并不这样做。\n\n*   最后，在 `Update` 方法的末尾添加以下代码，这样我们每帧都会给变量\
    \ `counter` 的当前值加 1（即每次屏幕刷新时），并显示它的值。\n\n```csharp\ncounter = counter + 1;\nprint\
    \ (\"counter=\"+counter);\n```\n\n*   在完成这些修改后，代码应该如下所示：\n\n```csharp\nusing UnityEngine;\n\
    using System.Collections;\n\npublic class MyFirstScript : MonoBehaviour\n{\n \
    \   // 使用此项进行初始化\n    private int number;\n    private string myName;\n    private\
    \ int counter;\n\n    void Start ()\n    {\n        number = 1;\n        myName\
    \ = \"Patrick\";\n        print(\"Hello \"+ myName + \"Your number is \" +number);\n\
    \        int localVariable = 3;\n        print(\"local variable: \"+localVariable);\n\
    \        counter = 0;\n    }\n\n    // Update 每帧调用一次\n    void Update ()\n   \
    \ {\n        counter = counter + 1;\n        print (\"counter=\"+counter);\n \
    \   }\n}\n```\n\n*   切回 Unity (`ALT + TAB`)。\n\n*   查看 `Console` 窗口：它不应该显示任何错误（前提是你已经注释掉或删除了我们为了故意生成错误而创建的代码）。\n\
    \n*   运行场景 (`CTRL + P`)，查看 `Console` 窗口，你会看到 `counter` 的值被显示并且正在增加。\n\n你可能会注意到，即使你在\
    \ `Console` 窗口中点击了 `Collapse`（折叠）选项，消息也不会折叠，并且仍然会刷屏 `Console` 窗口。这是因为 `Collapse`\
    \ 选项仅在显示完全相同的消息时起作用；但在我们的情况下，由于 `counter` 的值每次都不同，消息每帧都是不同的（例如，“counter=1”，“counter=2”等）。\n\
    \n在这个阶段，我们已经了解了局部变量和全局变量，让我们深入研究方法并创建我们的第一个方法。\n\n# 创建你的第一个方法\n\n那么什么是方法？方法（我们在\
    \ JavaScript 中以前称的函数）通常用于在游戏主体之外执行任务。我通常将函数比作朋友或同事，你委婉地请求他们为你完成某项任务。在很多情况下，你会调用它们，它们就会执行该任务。有时他们需要某些特定信息来执行任务（例如，一个数字以便代表你拨打电话）；另一些时候，他们会回调给你提供他们找到的信息，但在其他情况下，这可能是没有必要的，他们会在执行任务后不再再与你联系。\n\
    \n因此，本质上有三种类型的方法：\n\n*   没有参数只执行动作的方法。\n*   带有参数执行动作的方法。\n*   执行动作（带或不带参数）并返回结果的方法。\n\
    \n## 声明方法\n\n如果你以前写过 JavaScript，函数是使用 `function` 关键字声明的；但在 C# 中，方法声明通常需要一个访问修饰符、返回的数据类型以及传递给此函数的参数类型。\n\
    \n声明方法的语法如下：\n\n*   访问修饰符（例如 `private`、`public` 或 `protected`）。\n*   方法返回的数据类型（例如\
    \ `float`、`string` 或 `bool`）。\n*   方法名。\n*   左圆括号。\n*   参数的类型及其名称。\n*   右圆括号。\n\
    *   此方法执行的任何动作（即语句）都将添加到大括号内，并在末尾跟一个分号。\n\n在接下来的章节中，我们将看到如何声明方法的示例。\n\n## 不返回或不接受任何参数的方法\n\
    \n在这种情况下，调用方法时不不带任何参数；它将执行一个动作。这是方法最简单的形式。语法如下：访问修饰符、关键字 `void`、后面是函数名、然后是左右圆括号、最后是左右大括号。此函数执行的任何动作（即语句）都将添加到大括号内，并在末尾跟一个分号。\n\
    \n```csharp\npublic void theNameOfyourMethod()\n{\n}\n```\n\n关键字 `void` 表示该方法不返回任何数据。\n\
    \n所以为了创建我们的第一个方法，我们可以在脚本的末尾（即在最后一个右大括号之前）输入以下内容：\n\n```csharp\npublic void myFirstMethod()\n\
    {\n    print (\"Hello World\");\n}\n```\n\n调用时，此方法将在 `Console` 窗口中打印“Hello World”消息。\n\
    \n在这个阶段，我们刚刚定义了方法 `myFirstMethod`；换句话说，我们指定了方法在被调用时应该做什么。一旦方法被定义，我们就可以通过语法调用它：`myFirstMethod();`；例如，为了让消息在\
    \ `Console` 窗口中显示，我们可以在 `Start` 方法内部注释所有的 `print` 语句：\n\n```csharp\nmyFirstMethod();\n\
    ```\n\n这样代码看起来如下：\n\n```csharp\nusing UnityEngine;\nusing System.Collections;\n\
    \npublic class MyFirstScript : MonoBehaviour\n{\n    // 使用此项进行初始化\n    private\
    \ int number;\n    private string myName;\n    private int counter;\n\n    void\
    \ Start ()\n    {\n        number = 1;\n        myName = \"Patrick\";\n      \
    \  print(\"Hello \"+ myName + \"Your number is \" +number);\n        int localVariable\
    \ = 3;\n        print(\"local variable: \"+localVariable);\n        counter =\
    \ 0;\n        myFirstMethod();\n    }\n\n    // Update 每帧调用一次\n    void Update\
    \ ()\n    {\n        counter = counter + 1;\n        print (\"counter=\"+counter);\n\
    \    }\n\n    public void myFirstMethod()\n    {\n        print (\"Hello World\"\
    );\n    }\n}\n```\n\n你可能会疑惑为什么 `Update` 和 `Start` 方法没有包含访问修饰符（例如 `public` 或 `private`）。这是因为默认情况下，方法的访问修饰符是\
    \ `private`。所以，如果没有指定访问修饰符，它将被视为私有方法。\n\n注意，方法在脚本中的位置（即在结尾或开头）并不重要，只要它是在类（`MyFirstScript`）内部且在其他方法之外定义的：所以你需要在任何方法的右大括号之后定义方法；或者我们可以轻松地在脚本的开头或中间编写这个方法而不会产生错误。\n\
    \n*   检查你的代码编写是否正确（即无错误）。\n*   保存你的代码 (`CTRL + S`)。\n*   切换到 Unity (`ALT + TAB`)。\n\
    *   检查 `Console` 窗口中没有错误。\n*   运行场景并检查消息是否为“Hello World”。\n\n## 定义带参数的方法\n\n到目前为止，我们查看了不接受或返回任何参数的方法。现在，我们将创建一个仍然不返回任何数据，但接受一个或多个参数以执行计算的方法。\n\
    \n所以借用之前的例子，你调用某人，给他们一些信息，并要求他们根据你的指令执行操作。为了说明这一概念，让我们创建一个新方法，它将根据作为参数传递的参数显示消息。\n\
    \n*   请在类的末尾（即在最后一个右大括号之前）输入以下代码。\n\n```csharp\npublic void mySecondMethod(string\
    \ name)\n{\n    print (\"Hello, your name is \" +name);\n}\n```\n\n"
