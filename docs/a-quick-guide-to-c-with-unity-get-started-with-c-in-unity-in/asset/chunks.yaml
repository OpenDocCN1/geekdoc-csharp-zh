    where they can either buy the book, enter a monthly draw to be in for a chance
    of receiving a free copy of the book, or to be notified of future promotional
    offers.


    # 1 Introduction to Programming in C#


    In this section we will discover `C#` programming principles and concepts, so
    that you can start programming in the next chapter. If you have already coded
    using `C#` (or a similar language), you can skip this chapter.


    After completing this chapter, you will be able to:


    * Understand the reasons why you need to consider `C#`.

    * Understand object-oriented programming (`OOP`) concepts when coding in `C#`.

    * Get used to and understand the concepts of variables, methods, and scope.

    * Understand key best practices for coding, particularly in `C#`.

    * Understand conditional statements and decision making structures.

    * Understand the concept of loops.


    ## Introduction


    When scripting in `Unity`, you are communicating with the Game Engine and asking
    it to perform actions. To communicate with the system, you are using a language
    or a set of words bound by a syntax that the computer and you know. This language
    consists of keywords, key phrases, and a syntax that ensures that the instructions
    are understood properly. In computer science, this sentence needs to be exact,
    precise, unambiguous, and with a correct syntax. In other words, it needs to be
    exact. The syntax is a set of rules that are followed when writing code in `C#`
    (as for `JavaScript`). In addition to its syntax, `C#` programming also uses classes;
    so your scripts will be saved as classes.


    In the next section, we will learn how to use this syntax. If you have already
    coded in `JavaScript`, some of the information provided in the rest of this chapter
    may look familiar and this prior exposure to `JavaScript` will definitely help
    you. This being said, `JavaScript` and `C#`, despite some relative similarities,
    are quite different in many aspects (e.g., variable declaration, function declaration,
    etc.).


    When scripting in `C#`, you will be using a combination of the following:


    * Classes.

    * Objects.

    * Statements.

    * Comments.

    * Variables.

    * Constants.

    * Operators.

    * Assignments.

    * Data types.

    * Methods.

    * Decision making structures.

    * Loops.

    * Inheritance (more advanced).

    * Polymorphism (more advanced).

    * Operator overloading (more advanced).

    * Interfaces.

    * Name spaces.

    * Events.

    * Comparisons.

    * Type conversions.

    * Reserved words.

    * Messages to the console windows.

    * Declarations.

    * Calls to methods.


    The list may look a bit intimidating but, not to worry, we will explore these
    in the next sections, and you will get to know and use them smoothly using hands-on
    examples.


    ## Statements


    When you write a piece of `C#` code, you need to tell the system to execute your
    instructions (e.g., print information) using statements. A statement is literally
    an order or something you ask the system to do. For example, in the next line
    of code, the statement will tell `Unity` to print a message in the Console window:


    ```c

    print ("Hello Word");

    ```


    When writing statements, there are a few rules that you need to know:


    * Order of statements: each statement is executed in the order it appears in the
    script. For example, in the next example, the code will print hello, then world;
    this is because the associated statements are in that sequence.

    ```c

    print ("hello");

    print ("world");

    ```

    * Statements are separated by semi-colons (i.e., semi-colon at the end of each
    statement). Note that several statements can be added on the same line, as long
    as they are separated by a semi-colon.

    ```c

    print ("hello");print ("world");

    ```

    * Multiple spaces are ignored for statements; however, it is good practice to
    add spaces around the operators such as `+`, `-`, `/`, or `%` for clarity. For
    example, in the next example, we say that `a` is equal to `b`. There is a space
    before and after the operator `=`.

    ```c

    a = b;

    ```

    * Statements to be executed together (e.g., based on the same condition) can be
    grouped using what is usually referred to as code blocks. In `C#` (as for `JavaScript`),
    code blocks are symbolized by curly brackets (e.g., `{` or `}`). So, in other
    words, if you needed to group several statements, we would include them all within
    the same curly brackets, as follows:


    ```c

    {

    print ("hello stranger!");

    print ("today, we will learn about scripting");

    }

    ```


    As we have seen earlier, a statement usually employs or starts with a keyword
    (i.e., a word that the computer knows). Each of these keywords has a specific
    purpose and the most common ones (at this stage) are used for:


    * Printing a message in the Console window: the keyword is `print`.

    * Declaring a variable: the keyword depends on the type of variable (e.g., `int`
    for integers, `string` for text, `bool` for Boolean variables, etc.) and we will
    see more about this in the next sections.

    * Declaring a method: the keyword depends on the type of the data returned by
    the method. For example, in `C#`, the name of a method is preceded by the keyword
    `int` when the method returns an integer, `string` when the method returns a string,
    or `void` when the method does not return any information.

    * Marking a block of instructions to be executed based on a condition: the keywords
    are `if` ... `else`.

    * Exiting a function: the keyword is `return`.


    ## Comments


    In `C#` (similarly to `JavaScript`), you can use comments to explain the code
    and to make it more readable. This becomes important as the size of your code
    increases; and it is also important if you work as part of a team, so that team
    members can understand your code and make amendments in the right places, if and
    when it is needed.

