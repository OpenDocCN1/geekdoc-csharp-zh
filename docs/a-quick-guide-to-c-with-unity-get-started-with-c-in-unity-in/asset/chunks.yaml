    \ the current year).\n\n- Please add the following code at the end of the script.\n\
    \n```csharp\npublic int calculateAge(int YOB)\n{\n    int age;\n    age = 2016\
    \ - YOB;\n    return (age);\n}\n```\n\nIn the previous code:\n- The method called\
