    When using variables, there are a few things that we need to determine including
    their name, type and scope:


    *   Name of a variable: A variable is usually given a unique name so that it can
    be identified uniquely. The name of a variable is usually referred to as an identifier.
    When defining an identifier, it can contain letters, digits, a minus, an underscore
