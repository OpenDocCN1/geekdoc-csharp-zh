  trans: "\n循环对于对有限数量的对象执行重复操作，或者执行通常所谓的递归操作非常有用。例如，你可以使用循环在不同位置创建 100 个对象（即实例化）（这可以为你节省一些代码\
    \ :-))），或者遍历一个包含 100 多个元素的数组。\n\n# 类\n\n在 Unity 中使用 `C#` 编写代码时，你创建的脚本要么是类，要么使用内置类。那么，什么是类呢？\n\
    \n正如我们之前看到的，`C#` 是一种面向对象编程 (OOP) 语言。简单来说，一个 `C#` 程序由一组相互作用的对象组成。每个对象都有一个或多个属性，并且可以使用被称为“方法”的操作对这些对象执行动作。此外，具有相同属性的对象被认为属于同一个类。例如，我们可以以自行车作比。有各种形状和颜色的自行车；然而，它们具有共同的特征。例如，它们都有特定数量的车轮（例如，一个、两个或三个）或速度；它们可以有颜色，并且可以在这些自行车上执行操作（例如：加速、右转、左转等）。因此，在面向对象编程中，类就是\
    \ `bike`，`speed` 或 `color` 被称为成员变量，而 `accelerate`（即一种动作）被称为成员方法。所以，如果我们定义一个通用类型，我们可以定义一个名为\
    \ `Bike` 的类，并为该类定义几个成员变量和属性，以便对 `Bike` 类型的对象进行定义并执行操作。\n\n这显然是对类和对象的简化解释，但如果你是该初学者，它应该让你对面向对象编程的概念有一个更清晰的认识。\n\
    \n## 定义类\n\n现在我们对类是什么有了更清晰的认识，让我们看看如何定义一个类。来看下面的例子。\n\n```csharp\npublic class\
    \ Bike\n{\n    private float speed;\n    private int color;\n\n    public void\
    \ accelerate()\n    {\n        speed++;\n    }\n\n    public void turnRight()\n\
    \    {\n    }\n\n    private void calculateDistance()\n    {\n    }\n}\n```\n\n\
    在上面的代码中，我们定义了一个名为 `Bike` 的类，它包含了两个成员变量（`speed` 和 `color`）以及两个成员方法（`accelerate`\
    \ 和 `turnRight`）。让我们仔细观察一下脚本；你可能会注意到几点：\n\n*   类名前面有关键字 `public class`；在 OOP 术语中，关键字\
    \ `public` 称为访问修饰符，它定义了如何（以及从哪里）访问和使用此类。在 `C#` 中至少有五种访问修饰符，包括 `public`（无限制访问）、`protected`（访问限于包含类或派生自该类的类型）、`internal`（访问限于当前程序集）、`protected\
    \ internal`（我们在本书书中不会使用这种访问模式）和 `private`（仅可从包含类型访问）。\n*   所有变量名前面都有其类型（例如 `int`）和关键字\
    \ `private`：这意味着这些整数变量仅在该类内部是可访问的。\n*   某些方法名前面有关键字 `public void`（例如方法 `accelerate`\
    \ 或 `turnRight` 方法）：`void` 关键字意味着该方法不返回任何数据，而 `public` 关键字意味着该方法在整个程序中都是可访问的。\n\
    *   某些方法名前面有关键字 `private void`（例如方法 `calculateDistance`）：`void` 关键字意味着该方法不返回任何数据，而\
    \ `private` 关键字意味着该方法只能从包含类型（即 `Bike`）访问。\n\n## 访问类成员和变量\n\n一旦定义了类，能够访问它的成员变量和方法将是非常棒的。在\
    \ `C#` 中（与其他其它面向对象编程语言一样），可以使用点操作符来实现。\n\n点操作符指的是面向对象编程。通过点，你可以访问与特定对象相关的属性和函数（或方法）。例如，`gameObject.transform.position`\
    \ 让你能够访问链接到此脚本对象的 transform 的位置。从反向读取它通常很有用；在这种情况下，点可以被解释为“的”。因此，在我们的案例中，`gameObject.transform.position`\
    \ 可以翻译为“`gameObject` 的 transform 的位置”。\n\n一旦定义了类，就可以创建基于该类的对象。例如，如果我们想创建一个新的 `Bike`\
    \ 对象，基于我们上面看到的代码，可以使用以下代码。\n\n```csharp\nBike myBike = new Bike();\n```\n\n这段代码将创建一个基于“模板”\
    \ `Bike` 的对象。你可能会注意到这种语法：`dataType variable = new dataType()`\n\n默认情况下，这个新对象将包含之前定义的所有成员变量和方法。因此，它将有一个\
    \ `color` 和一个 `speed`，我们也应该能够访问它的 `accelerate` 和 `turnRight` 方法。那么如何实现呢？让我们看看下一个代码片段，它展示了如何访问这些。\n\
    \n```csharp\nBike b = new Bike();\nb.accelerate();\n```\n\n在之前的代码中：\n\n*   创建了新的自行车\
    \ `myBike`。\n*   在调用 `accelerate` 方法后，`speed` 增加。可以使用点操作符来调用此方法，因为它是 `public`\
    \ 的。\n*   注意，调用对象的方法我们使用点操作符。\n\n在定义成员变量和方法时，限制成员变量的访问（例如 `private` 类型）并定义无或较少限制的公共方法（例如\
    \ `public`）来提供对这些变量的访问通常是良好的做法。这些方法通常被称为 getters（获取器）和 setters（设置器）（因为你可以从中获取或设置值）。为了说明这个概念，让我们来看下面的代码：\n\
    \n```csharp\npublic class Bike\n{\n    private float speed;\n    private int color;\n\
    \n    public void accelerate()\n    {\n        speed++;\n    }\n\n    public void\
    \ turnRight()\n    {\n    }\n\n    private void calculateDistance()\n    {\n \
    \   }\n\n    public void setSpeed(float newSpeed)\n    {\n        speed = newSpeed;\n\
    \    }\n\n    public float getSpeed()\n    {\n        return (speed);\n    }\n\
    }\n```\n\n在之前的代码中，我们声明了两个新方法：`setSpeed` 和 `getSpeed`。\n\n*   对于 `setSpeed`：类型为\
    \ `void`，因为该方法不返回任何信息，且其访问设置为 `public`，因此可以被访问。\n*   对于 `getSpeed`：类型为 `float`，因为该方法返回\
    \ `speed`，其类型为 `float`。它的访问设置为 `public`，因此可以被访问。\n\n所以，我们可以将到目前创建的代码合并到 Unity\
    \ 中的一个程序（或新类）中如下：\n\n```csharp\nusing UnityEngine;\nusing System.Collections;\n\
    \npublic class TestCode : MonoBehaviour {\n    public class Bike\n    {\n    \
    \    private float speed;\n        private int color;\n\n        public void accelerate()\n\
    \        {\n            speed++;\n        }\n\n        public void turnRight()\n\
    \        {\n        }\n\n        private void calculateDistance()\n        {\n\
    \        }\n\n        public void setSpeed(float newSpeed)\n        {\n      \
    \      speed = newSpeed;\n        }\n\n        public float getSpeed()\n     \
    \   {\n            return (speed);\n        }\n    }\n\n    public void Start\
    \ ()\n    {\n        Bike myBike = new Bike();\n        myBike.setSpeed (23.0f);\n\
    \        print (myBike.getSpeed());\n    }\n}\n```\n\n在之前的代码中，你可能会注意到与我们之前创建的代码相比至少有两个不同之处：\n\
    \n*   在代码开头添加了以下两行代码：\n\nusing UnityEngine;\n\nusing System.Collections;\n\n"
- fmt: "\n- The keyword `using` is called a directive; in this particular case it\
    \ is used to import what is called a namespace ; put simply, by adding this directive\
    \ you are effectively importing (or gaining access to) a collection of classes\
    \ or data types. Each of these namespaces or “libraries” includes useful classes\
    \ for your programme. For example, the namespace `UnityEngine` will include classes\
    \ for Unity development and `System.Collections` will include classes and interfaces\
    \ for different collections of objects. By default, whenever you create a new\
    \ C# script in Unity, these two namespaces (and associated directives) are included.\n\
    \n- We have declared our class `Bike` within another class called `TestCode`.\
    \ `TestCode` is, in this case, the containing class.\n\n```csharp\npublic class\
    \ TestCode : MonoBehaviour {\n```\n\n- Whenever you create a new C# script, the\
    \ name of the script (for example `TestCode` will be used to define the main class\
    \ within the script; i.e. `TestCode`).\n\n- The syntax: `Monobehavior` means that\
    \ the class `TestCode` is derived from the class `MonoBehaviour`. This is often\
    \ referred to as inheritance.\n\n## Constructors\n\nAs we have seen in the previous\
    \ section, when a new object is created, it will, by default, include all the\
    \ member variables and methods. To create this object, we would use the name of\
    \ the class, followed by `()`, as per the next example.\n\n```csharp\nBike myBike\
    \ = new Bike();\nmyBike.accelerate();\n```\n\nIn fact, it is possible to change\
    \ some of the properties of the new object created at the time it is initialized.\
    \ For example, instead of setting the speed and the color of the object as we\
    \ have done in the previous code, it would be great to be able to set these automatically\
    \ and pass the parameter accordingly when the object is created. Well, this can\
    \ be done with what is called a `constructor`. A constructor literally helps to\
    \ construct your new object based on parameters (also referred as arguments) and\
    \ instructions. So, for example, let’s say that we would like the color of our\
    \ bike to be specified when it is created; we could modify the `Bike` class, as\
    \ follows, by adding the following method:\n\n```csharp\npublic Bike (int newColor)\n\
    {\n    color = newColor;\n}\n```\n\nThis is a new constructor (the name of the\
    \ method is the same as the class), and it takes an integer as a parameter; so\
    \ after modifying the description of our class (as per the code above), we could\
    \ then create a new bike object as follows:\n\n```csharp\nBike myBike = new Bike(2);\n\
    ```\n\nWe could even specify a second constructor that would include both the\
    \ color and the speed as follows:\n\n```csharp\npublic Bike (int newColor, float\
    \ newSpeed)\n{\n    color = newColor;\n    speed = newSpeed;\n}\n```\n\nYou can\
    \ have different constructors in your class; the constructor used at the initialization\
    \ stage will be the one that matches the arguments passed.\n\nFor example, let’s\
    \ say that we have two constructors for our `Bike` class.\n\n```csharp\npublic\
    \ Bike (int newColor)\n{\n    color = newColor;\n}\n\npublic Bike (int newColor,\
    \ float newSpeed)\n{\n    color = newColor;\n    speed = newSpeed;\n}\n```\n\n\
    If a new `Bike` object is created as follows:\n\n```csharp\nBike newBike = new\
    \ Bike (2)\n```\n…then the first constructor will be called.\n\nIf a new `Bike`\
    \ object is created as follows:\n\n```csharp\nBike newBike = new Bike (2, 10.0f)\n\
    ```\n…then the second constructor will be called.\n\nYou may also wonder what\
    \ happens if the following code is used since no default constructor has been\
    \ defined.\n\n```csharp\nBike newBike = new Bike ();\n```\n\nIn fact, whenever\
    \ you create your class, a default constructor is also defined (implicitly) and\
    \ evoked whenever a new object is created using the `new` operator with no arguments.\
    \ This is called a default constructor. In this case, the default values for each\
    \ of the types of the numerical member variables are used (e.g., 0 for integers\
    \ or false for Boolean variables).\n\nNote that access to constructors is usually\
    \ public, except in the particular cases where we would like a class not to be\
    \ instantiated (e.g., for classes that include static members only). Also note\
    \ that, as for variables, if no access modifiers are specified, these will be\
    \ private by default. This is similar for methods.\n\n## Destructors\n\nAs for\
    \ constructors, when an object is deleted, the corresponding destructor is called.\
    \ Its name is the same as the class and preceded by a tilde `~` ; as illustrated\
    \ in the next code snippet.\n\n```csharp\n~Bike()\n{\n    //add some code here;\n\
    }\n```\n\nThis being said, a destructor can neither take parameters (or arguments)\
    \ nor return a value.\n\n## Static members of a class\n\nWhen a method or variable\
    \ is declared as `static`, only one instance of this member exists for a class.\
    \ So a static variable will be “shared” between instances of this class. Static\
    \ variables are usually used to retrieve constants without instantiating a class.\
    \ The same applies for static method: they can be evoked without having to instantiate\
    \ a class. This can be very useful if you want to create and avail of tools. For\
    \ example, in Unity, it is possible to use the method `GameObject.Find()`; this\
    \ method usually makes it possible to look for a particular object based on its\
    \ name. Let’s look at the following example.\n\n```csharp\npublic void Start()\n\
    {\n    GameObject t = (GameObject) GameObject.Find(\"test\");\n}\n```\n\nIn the\
    \ previous code, we look for an object called `test`, and store the result inside\
    \ the variable `t` of type `GameObject`. However, when we use the syntax `GameObject.Find`,\
    \ we use the static method `Find` that is available from the class `GameObject`.\
    \ There are many other static functions that you will be able to use in Unity,\
    \ including `Instantiate`. Again, these functions can be called without the need\
    \ to instantiate an object. The following code snippet provides another example\
    \ based on the class `Bike`.\n\n```csharp\nusing UnityEngine;\nusing System.Collections;\n\
    public class TestCode : MonoBehaviour {\nclass Bike\n{\nprivate float speed;\n\
    private int color;\nprivate float speed;\nprivate int color;\nstatic int nbBikes;\n\
    public void countBikes()\n{\n    nbBikes++;\n}\n\npublic int getBikes()\n{\n \
    \   return nbBikes;\n}\n}\n\nvoid Start ()\n{\n    Bike bike1 = new Bike();\n\
    \    Bike bike2 = new Bike();\n    bike1.countBikes();\n    bike2.countBikes();\n\
    \    print(\"Nb Bikes:\"+bike1.getBikes());\n}}\n```\n\nThe following code illustrates\
    \ the use of static functions.\n\n```csharp\nusing UnityEngine;\nusing System.Collections;\n\
    public class TestCode : MonoBehaviour\n{\n    public class Bike\n    {\n     \
    \   private float speed;\n        private int color;\n        static void sayHello()\n\
    \        {\n            print(\"Hello\");\n        }\n    }\n\n    public void\
    \ Start()\n    {\n        Bike.sayHello();\n    }\n}\n```\n\nThe previous code\
    \ would result in the following output:\n\nHello\n\n## Inheritance\n\nI hope everything\
    \ is clear so far, as we are going to look at a very interesting and important\
    \ principle for object-oriented programming: inheritance. The main idea of inheritance\
    \ is that objects can inherit their properties from other objects (their parent).\
    \ As they inherit these properties, they can remain identical or evolve and overwrite\
    \ some of these inherited properties. This is very interesting because it makes\
    \ it possible to minimize the code by creating a class with general properties\
    \ for all objects sharing similar features, and then, if need be, to overwrite\
    \ and customize some of these.\n\nLet’s take the example of vehicles; they would\
    \ generally have the following properties:\n\n*   Number of wheels.\n*   Speed.\n\
    *   Number of passengers.\n*   Color.\n*   Capacity to accelerate.\n*   Capacity\
    \ to stop.\n\nSo we could create the following class for example:\n\n```csharp\n\
    class Vehicles\n{\nprivate int nbWheels;\nprotected float speed;\nprivate int\
    \ nbPassengers;\nprivate int color;\n\npublic void accelerate()\n{\n    speed++;\n\
    }\n}\n```\n"
