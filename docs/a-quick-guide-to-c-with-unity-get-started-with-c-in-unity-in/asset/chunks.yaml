    break;


    case 2:


    print ("you chose 2");


    break;


    case 3:


    print ("you chose 3");


    break;


    default:


    print ("Default option");


    break;


    }


    print (“We have exited the switch structure”);


    In the previous code:


    *   We declare the variable choice , as an integer and initialize it to 1 .


    *   We then create a switch structure whereby, depending on the value of the variable
    choice , the programme will switch to the relevant section (i.e., the portion
    of code starting with case 1: , case 2: , etc.). Note that in our code, we look
    for the values 1, 2 or 3\. However, if the variable choice does not equal 1 or
    2 or 3, the program will branch to the section called default . This is because
    this section is executed if any of the other possible choices (i.e., 1,2, or 3)
    have not been fulfilled (or selected).


    Note that each choice or branch starts with the keyword case and ends with break
    . The break statement is there to specify that after executing the commands included
    in the branch (or current choice), it should exit the switch structure. Without
    any break statement the next line of code will be executed.


    So let’s consider the previous example and see how this would work. In our case,
    the variable choice is set to 1 , so we will enter the switch structure, and then
    look for the section that deals with a value of 1 for the variable choice . This
    will be the section that starts with case 1: ; then the command  print ("you chose
    1"); will be executed, followed by the command break , indicating that we should
    exit the switch structure; finally the command print (“We have exited the switch
    structure”) will be executed.


    Switch structures are very useful to structure your code and when dealing with
    mutually exclusive choices (i.e., only one of the choices can be processed) based
    on an integer value, especially in the case of menus. In addition switch structures
    make for cleaner and easily understandable code.


    Loops


    There are times when you have to perform repetitive tasks as a programmer; many
    times, these can be fast forwarded using loops. Loops are structures that will
    perform the same actions repetitively based on a condition. So, the process is
    usually as follows:


    *   Start the loop.


    *   Perform actions.


    *   Check for a condition.


    *   Exit the loop if the condition is fulfilled or keep looping.


    Sometimes the condition is performed at the start of the loop, some other times
    it is performed at the end of the loop.


    Let’s take the following example that is using a while loop.


    int counter =0;


    while (counter <=10)


    {


    print (“Counter = ” + counter);


    counter++;


    }


    In the previous code:


    *   We set the value of the variable counter .


    *   We then create a loop that is delimited by the curly brackets and that starts
    with the keyword while .


    *   We set the condition to remain in this loop (i.e., counter <=10 ).


    *   Within the loop, we increase the value of the variable counter by 1 and print
    its value.


    So effectively:


    *   The first time we go through the loop: the variable counter is increased to
    1 ; we reach the end of the loop; we go back to the start of the loop and check
    if counter is <=10; this is true in this case ( counter = 1).


    *   The second time we go through the loop: counter is increased to 2; we reach
    the end of the loop; we go back to the start of the loop and check if counter
    is <=10; this is true in this case ( counter = 2 ).


    *   …


    *   The 11th time we go through the loop: counter is increased to 11; we reach
    the end of the loop; we go back to the start and check if counter is <=10; this
    is now false in this case ( counter = 11). As a result, we then exit the loop.


    So, as you can see, using a loop, we have managed to increment the value of the
    variable counter iteratively, from 0 to 11, but using less code than would be
    needed otherwise.


    Now, we could create a slightly modified version of this loop; let’s look at the
    following example:


    int counter =0;


    do


    {


    print (“Counter = ” + counter);


    counter++;


    } while (counter <=10);


    In this example, you may spot two differences, compared to the previous code:


    *   The while keyword is now at the end of the loop. So the condition will be
    evaluated (or assessed) at the end of the loop.


    *   A do keyword is now featured at the start of the loop.


    *   In this example, we perform statements and then check for the condition.


    Another variations of the code could be as follows:


    for (int counter = 0; counter <=10; counter ++)


    {


    print (“Counter = ” + counter);


    }


    In the previous code:


    *   We declare a loop in a slight different way: we say that we will use an integer
    variable called counter that will go from 0 to 10.


    *   This variable counter will be incremented by 1 every time we go through the
    loop.


    *   We remain in the loop as long as the variable counter is less than or equal
    to 10.


    *   The test for the condition, in this case, is performed at the start of the
    loop.'
