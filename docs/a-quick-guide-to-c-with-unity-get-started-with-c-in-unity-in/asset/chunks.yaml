- fmt: "\n* `Start` : called at the start of the scene.\n* `Update` : called every\
    \ time the screen is refreshed.\n* `OnControllerColliderHit`: called whenever\
    \ the First-Person Controller (a built-in controller used to make it possible\
    \ to navigate through your scene using a first-person view) collides with an object.\n\
    \nAs we will see later, because most of your classes will inherit by default from\
    \ the class `MonoBehaviour`, they will, by default, include several methods, including\
    \ `Start` and `Update` that you will be able to override (i.e., modify for your\
    \ own use).\n\n## Scope of variables\n\nWhenever you create a variable in `C#`,\
    \ you will need to be aware of the scope and access type of the variable so that\
    \ you use it where its scope makes it possible for you to do so.\n\nThe scope\
    \ of a variable refers to where you can use this variable in a script. In `C#`,\
    \ we usually make the difference between global variables and local variables.\
    \ \n\nYou can compare the term local and global variables to a language that is\
    \ either local or global. In the first case, the local language will only be used\
    \ (i.e., spoken) by the locals, whereas the global language will be used (i.e.,\
    \ spoken) and understood by anyone whether they are locals or part of the global\
    \ community.\n\nWhen you create a class definition along with member variables,\
    \ these variables will be seen by any method within your class.\n\nGlobal variables\
    \ are variables that can be used anywhere in your script, hence the name global.\
    \ These variables need to be declared at the start of the script (using the usual\
    \ declaration syntax) and outside of any method; they can then be used anywhere\
    \ in the script as illustrated in the next code snippet.\n\n```csharp\nclass MyBike\n\
    {\n    private int color;\n    private float speed;\n    public void accelerate()\n\
    \    {\n        speed++;\n    }\n}\n```\n\nIn the previous code we declare the\
    \ variable `speed` as a member variable and access it from the method `accelerate`.\n\
    \nLocal variables are declared within a method and are to be used only within\
    \ this method, hence the term local, because they can only be used locally, as\
    \ illustrated in the next code snippet.\n\n```csharp\npublic void Start()\n{\n\
    \    int myVar;\n    myVar = 0;\n}\n\npublic void Update()\n{\n    int myVar2;\n\
    \    myVar2 = 2;\n}\n```\n\nIn the previous code, `myVar` is a local variable\
    \ to the method `Start`, and can only be used within this function; `myVar2` is\
    \ a local variable to the method `Update`, and can only be used within this method.\n\
    \n## Events\n\nThroughout this book and in `C#`, you will read about and use events.\
    \ So what are they?\n\nWell, put simply, events can be compared to something that\
    \ happens at a particular time, and when this event occurs, something (e.g., an\
    \ action) needs to be done. If we make an analogy with daily activities: when\
    \ the alarm goes off (event) we can either get-up (action) or decide to go back\
    \ to sleep. When you receive an email (event), you can decide to read it (action),\
    \ and then reply to the sender (another action).\n\nIn computer terms, it is quite\
    \ similar, although the events that we will be dealing with will be slightly different.\
    \ So, we could be waiting for the user to press a key (event) and then move the\
    \ character accordingly (action), or wait until the user clicks on a button on\
    \ screen (event) to load a new scene (action).\n\nIn Unity, whenever an event\
    \ occurs, a function (or method) is usually called (the function, in this case,\
    \ is often referred as a handler, because it “handles” the event). You have then\
    \ the opportunity to modify this function and add instructions (i.e. statements)\
    \ that should be followed, should this event occur.\n\nTo take the analogy of\
    \ daily activities: we could write instructions to a friend on a piece of paper,\
    \ so that, in case someone calls in our absence, the friend knows exactly what\
    \ to do. So an event handler is basically a set of instructions (usually stored\
    \ within a function) to be followed in case a particular event occurs.\n\nSometimes\
    \ information is passed to this method about the particular event, and sometimes\
    \ not. For example, when the screen is refreshed the method `Update` is called.\
    \ When the game starts (i.e., when a particular script is enabled), the method\
    \ `Start` is called. When there is a collision between the player and an object,\
    \ the method `OnControllerColliderHit` is called. In this particular case (i.e.,\
    \ collision), an object is usually passed to the method that handles the event\
    \ so that we get to know more about the other object involved in the collision.\n\
    \nAs you can see, there can be a wide range of events in our game, and we will\
    \ get to that later on. In this book, we will essentially be dealing with the\
    \ following events:\n\n* `Start`: when a script is enabled (e.g., start of the\
    \ scene).\n* `Update`: when the screen is refreshed (e.g., every frame).\n* `OnControllerColliderHit`:\
    \ when a collision occurs between the player and another object.\n* `Awake`: when\
    \ the game starts (i.e., once).\n\n## Polymorphism (general concepts)\n\nThe word\
    \ polymorphism takes its meaning from poly (several) and morph (shape); so it\
    \ literally means several forms. In object-oriented programming, it refers to\
    \ the ability to process objects differently (or more specifically) depending\
    \ on their data type or class. Let’s take the example of adding. If we want to\
    \ add two numbers, we will make an algebraic addition (e.g., `1 + 2`). However,\
    \ adding two string variables may mean concatenating them (adding them one after\
    \ the other). For example, adding the text “Hello” and the text “World” would\
    \ result in the text “ HelloWorld ”. As you can see, the way an operation is performed\
    \ on different data types may vary. So, let’s look at the following code which\
    \ illustrates how this can be done in `C#`.\n\n```csharp\npublic class AddObjects\n\
    {\npublic int add (int a, int b)\nreturn a + b;\n\npublic string add (string a,\
    \ string b)\nreturn a + b;\n}\n```\n\nIn the previous code, it is possible to\
    \ add different types of data: integers and strings. Depending on whether two\
    \ integers or two strings are passed as parameters, we will be calling either\
    \ the first `add` method or the second `add` method.\n\n### Dynamic polymorphism\n\
    \nIn `C#`, dynamic polymorphism can be achieved using both abstract classes and\
    \ virtual functions.\n\nIn `C#`, it is possible to create a class that will provide\
    \ a partial implementation of an interface. Broadly, an interface defines what\
    \ a class should include (i.e., member methods, member variables or events), but\
    \ it does not declare how these should be implemented. So, an abstract class will\
    \ include abstract methods or variables; which means that this class will define\
    \ the name and type of the variables, the name of the methods, as well as the\
    \ type of data returned by this method. It is called abstract because you cannot\
    \ implement this type of class (it can never be “materialized”); however, it can\
    \ be used as a template (or “dream” class) for derived classes. Let’s look at\
    \ the following example.\n\n```csharp\nabstract class Vehicule\n{\n    public\
    \ abstract void decelerate();\n}\n\nclass Bike : Vehicule\n{\n    private float\
    \ speed;\n    private int color;\n    public Bike(float newSpeed)\n    {\n   \
    \     speed = newSpeed;\n    }\n    public override void decelerate()\n    {\n\
    \        speed--;\n    }\n}\n```\n\nIn the previous code:\n\n* We declare an abstract\
    \ class `Vehicle`.\n* We declare an abstract method called `decelerate`.\n* We\
    \ then create a new class `Bike`, inherited from the abstract class `Vehicle`,\
    \ but with its own constructor.\n* We then override the abstract method `decelerate`\
    \ to use our own implementation.\n\nUsing an abstract class just means that we\
    \ list methods that would be useful for the children; however, the children will\
    \ have to define how the method should be implemented.\n"
