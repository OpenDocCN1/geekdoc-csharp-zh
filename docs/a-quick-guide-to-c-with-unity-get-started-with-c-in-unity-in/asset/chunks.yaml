- fmt: "\n*   Add the following line at the top of our class (i.e., `MyFirstScript`)\
    \ to declare our counter (just after the declaration for `myName`).\n\n```csharp\n\
    private int counter;\n```\n\n*   Then, initialize the variable `counter` to zero\
    \ by adding the following code within the `Start` method.\n\n```csharp\ncounter\
    \ = 0;\n```\n\nNote that this is done in the `Start` method only for now, so that\
    \ it is done only once (i.e., at the start of the scene). If we were to add this\
    \ code to the `Update` method instead, the variable would be initialized to 0\
    \ every frame (constantly), and we don’t want this right now.\n\n*   Finally,\
    \ add the following code at the end of the `Update` method so that we add one\
    \ to the current value of the variable `counter` every frame (i.e., every time\
    \ the screen is refreshed) and display its value.\n\n```csharp\ncounter = counter\
    \ + 1;\nprint (\"counter=\"+counter);\n```\n\n*   After you have made these modifications,\
    \ the code should look as follows:\n\n```csharp\nusing UnityEngine;\nusing System.Collections;\n\
    \npublic class MyFirstScript : MonoBehaviour\n{\n    // Use this for initialization\n\
    \    private int number;\n    private string myName;\n    private int counter;\n\
    \n    void Start ()\n    {\n        number = 1;\n        myName = \"Patrick\"\
    ;\n        print(\"Hello \"+ myName + \"Your number is \" +number);\n        int\
    \ localVariable = 3;\n        print(\"local variable: \"+localVariable);\n   \
    \     counter = 0;\n    }\n\n    // Update is called once per frame\n    void\
    \ Update ()\n    {\n        counter = counter + 1;\n        print (\"counter=\"\
    +counter);\n    }\n}\n```\n\n*   Switch back to Unity (`ALT + TAB`).\n\n*   Look\
    \ at the `Console` window: it should not display any error (i.e., provided that\
    \ you have commented or deleted the code that we created to generate an error\
    \ on purpose).\n\n*   Play the scene (`CTRL + P`), look at the `Console` window,\
    \ and you should see that the value of the `counter` is displayed and that it\
    \ is increasing.\n\nYou may notice that, even if you press the `Collapse` option\
    \ in the `Console` window, the messages are not collapsed and that they still\
    \ flood the `Console` window. This is because the `Collapse` option works only\
    \ when the exact same message is displayed several times; however, in our case,\
    \ the message differs every frame as the value of the `counter` is different every\
    \ time (e.g., “counter=1”, “counter=2”, etc.).\n\nAt this stage we know about\
    \ local and global variables, so let’s look into methods and create our very first\
    \ method.\n\n# Creating your first method\n\nSo what is a method? A method (what\
    \ we used to call function in JavaScript) is usually employed to perform a task\
    \ outside the main body of the game. I usually compare functions to a friend or\
    \ a colleague to whom you gently ask to perform a task for you. In many cases\
    \ you will call them and they will perform the task. Sometime they will need some\
    \ particular information to perform the task (e.g., a number to be able to call\
    \ someone on your behalf); some other times, they will call you back to give you\
    \ the information that they found, but in other cases, this may not be necessary,\
    \ and they will perform the task without contacting you afterwards.\n\nSo there\
    \ are essentially three types of methods:\n\n*   Methods that just perform actions\
    \ with no parameters.\n*   Methods that perform actions with parameters.\n*  \
    \ Methods that perform actions (with or without a parameter) and return a result.\n\
    \n## Declaring a method\n\nIf you have coded in JavaScript before, functions were\
    \ declared using the keyword `function`; however, in C# a method declaration usually\
    \ requires an access modifier, the type of data returned, and the type of the\
    \ parameters passed to this function.\n\nThe syntax to declare a method is as\
    \ follows:\n\n*   The access modifier (e.g., `private`, `public`, or `protected`).\n\
    *   The type of data returned by the method (e.g., `float`, `string` or `bool`).\n\
    *   The name of the method.\n*   Opening round brackets.\n*   The type of the\
    \ parameters and their name.\n*   Closing round brackets.\n*   Any action (i.e.,\
    \ statement) performed by this method will be added within the curly brackets\
    \ and followed by a semi-colon.\n\nIn the next sections, we will see examples\
    \ of how methods can be declared.\n\n## Methods that don’t return or take any\
    \ parameter\n\nIn this case, the method is called with no parameter; it will then\
    \ perform an action. This is the simplest form of methods. The syntax is as follows:\
    \ the access modifier, the keyword `void`, followed by the name of the function,\
    \ followed by opening and closing round brackets, followed by opening and closing\
    \ curly brackets. Any action (i.e., statement) performed by this function will\
    \ be added within the curly brackets and followed by a semi-colon.\n\n```csharp\n\
    public void theNameOfyourMethod()\n{\n}\n```\n\nThe keyword `void` indicates that\
    \ the method does not return any data.\n\nSo to create our first method, we could\
    \ type the following at the end of our script (i.e., before the last closing curly\
    \ brackets):\n\n```csharp\npublic void myFirstMethod()\n{\n    print (\"Hello\
    \ World\");\n}\n```\n\nWhen called, this method will print the message “Hello\
    \ World” to the `Console` window.\n\nAt this stage we have just defined the method\
    \ `myFirstMethod`; in other words, we have specified what the method should do\
    \ when it has been called. So once the method has been defined, we can call it\
    \ using the syntax: `nameOfTheMethod();`; for example, to call `myFirstMethod`\
    \ from any other method within the script, we could write the following statement\
    \ at the end of the `Start` method:\n\n```csharp\nmyFirstMethod();\n```\n\nSo\
    \ that this message stands out in the `Console` window, we can comment all other\
    \ `print` statements inside the `Start` method so that the code of your script\
    \ looks like:\n\n```csharp\nusing UnityEngine;\nusing System.Collections;\n\n\
    public class MyFirstScript : MonoBehaviour\n{\n    // Use this for initialization\n\
    \    private int number;\n    private string myName;\n    private int counter;\n\
    \n    void Start ()\n    {\n        number = 1;\n        myName = \"Patrick\"\
    ;\n        print(\"Hello \"+ myName + \"Your number is \" +number);\n        int\
    \ localVariable = 3;\n        print(\"local variable: \"+localVariable);\n   \
    \     counter = 0;\n        myFirstMethod();\n    }\n\n    // Update is called\
    \ once per frame\n    void Update ()\n    {\n        counter = counter + 1;\n\
    \        print (\"counter=\"+counter);\n    }\n\n    public void myFirstMethod()\n\
    \    {\n        print (\"Hello World\");\n    }\n}\n```\n\nYou may wonder why\
    \ the methods `Update` and `Start` do not include any access modifier (e.g., `public`\
    \ or `private`). This is because by default, the access modifier for a method\
    \ in C# is `private`. So if no access modifier is specified for a method, it will\
    \ be treated as a private method.\n\nNote that the location of the method in the\
    \ script (i.e., at the end or at the start) does not matter, as long as it is\
    \ declared within the class (`MyFirstScript`) and outside another method: so you\
    \ need to declare your method outside of any other methods (i.e., after the closing\
    \ curly bracket for a method or before the method); we could have easily written\
    \ this method at the start or middle of the script, resulting in no errors.\n\n\
    *   Check that your code is written properly (i.e., error-free).\n*   Save your\
    \ code (`CTRL + S`).\n*   Switch to Unity (`ALT + TAB`).\n*   Check that there\
    \ are no errors in the `Console` window.\n*   Play the scene and check that the\
    \ message says “Hello World”.\n\n## Defining a method that takes parameters\n\n\
    So far, we looked at methods that would not take or return any parameters. For\
    \ now, we will create a method that still doesn’t return any data, but that takes\
    \ one or several parameters in order to perform calculations.\n\nSo to borrow\
    \ the previous example, you call someone, give them some information, and ask\
    \ them to perform an action based on your instructions. To illustrate this concept,\
    \ let’s create a new method that will display a message based on a parameter passed\
    \ as an argument.\n\n*   Please type the following code at the end of the class\
    \ (i.e., before the last closing curly bracket).\n\n```csharp\npublic void mySecondMethod(string\
    \ name)\n{\n    print (\"Hello, your name is \" +name);\n}\n```\n"
