    # C#编程基础


    ## 注释


    当代码被注释时，它不会被执行。在 `C#` 中有两种方法可以注释你的代码；你可以使用单行注释或多行注释。在单行注释中，在行的开头或语句之后添加双正斜杠 `//`，这样该行（或其部分内容）就会被注释，接下来的代码片段所示。


    ```csharp

    //下一行在控制窗口中打印 Hello

    print (“Hello”);


    //下一行声明变量名

    string name;

    name = “Hello”;//设置变量名的值

    ```


    在多行注释中，`/*` 和 `*/` 之间的任何文本都将被注释（且不执行）。这也被称为注释块。


    ```csharp

    /* 注释后的后续几行在控制窗口中打印 hello

    然后我们声明变量名并为其赋值一个值*/

    print(“Hello”);

    string name;

    name = “Hello”;//设置变量名的值


    //print (“Hello World”)


    /*

    string name;

    name = “My Name”;

    */

    ```


    除了为你的代码提供说明外，你还可以使用注释来防止部分代码被执行。当你想要调试代码并用非常简单的方法找到错误或 bug 可能所在的位置时，这非常有用。通过注释代码的区域并使用排除法，你通常可以快速找到问题。例如，你可以注释掉所有代码并运行脚本；然后注释掉一半的代码并运行。如果运行正常，说明错误在被注释的代码中；如果运行异常，则说明错误在未注释的代码中。在第一种情况下（代码运行正常），我们只需注释掉已注释部分中的半部分。因此，通过连续注释我们代码中更具体的区域，我们可以发现代码的哪部分包含
    bug。这个过程通常被称为二分法（因为我们连续地将代码段分为两部分）。这种调试方法通常是有效的，因为迭代次数（将部分代码二分）更具预测性，而且可能更节省时间。例如，对于
    100 行代码，我们可以连续将问题缩小到 50、25、12、6 和 3 行（在这种情况下需要 5 到 6 次迭代，而不是遍历整个 100 行）。


    ## 变量


    变量是一个容器。它包含一个随时间变化的值。使用变量时，我们通常需要：(1) 声明变量（通过指定其类型），(2) 为此变量赋值，以及 (3) 可能使用运算符将此变量与其他变量结合。


    ```csharp

    int myAge;//我们声明了变量

    myAge = 20;//我们将变量设置为 20

    myAge = myAge + 1; //我们给变量 myAge 加 1

    ```


    在上一个示例中，我们声明了一个变量 `myAge`，它的类型是 `int`（整数），我们将其设置为 20，然后加了 1。在 `C#` 中，变量通过其类型后接名称来声明。正如我们稍将看到的，我们还需要使用所谓的访问修饰符来指定如何访问此变量。


    注意，在之前的代码中，我们将 `myAge + 1` 的值赋值给 `myAge`；`=` 运算符是一个赋值运算符；换句话说，它的目的是给变量赋值，而不是从严格的代数意义上理解（即
    `=` 号两边的值或变量是相等的）。


    为了让编码更简单更简洁，在 `C#` 中你可以在同一个语句中对多个相同类型的变量进行多重声明。例如，在接下来的代码片段中，我们在一个语句中声明了三个变量 `v1`、`v2`
    和 `v3`。这是因为它们是相同类型（即整数）。


    ```csharp

    int v1,v2,v3;

    int v4=4, v5=5, v6=6;

    ```


    在上面的代码中，第一行声明了变量 `v1`、`v2` 和 `v3`。三个都是整数。在第二行中，我们不仅同时声明了三个变量，还初始化了它们（即设置了值）。


    使用变量时，我们需要确定几点，包括它们的名称、类型和作用域：


    *   **变量名称**：变量通常赋予一个唯一的名称，以便唯一标识。变量的名称通常被称为标识符。在定义标识符时，它可以包含字母、数字、减号、下划线或美元符号，并且通常以字母开头。标识符可以是关键字（例如
    `if`）。

    *   **变量类型**：变量可以持有多种类型的数据，包括数字（例如整数、双精度浮点数或 float）、文本（即 `strings` 或字符）、布尔值（例如
    `true` 或 `false`）、数组、对象（即我们在本章稍后看到的这个概念）或 `GameObjects`（即你场景中的任何对象），如下一个代码片段所示。


    ```csharp

    string myName = “Patrick”;//文本使用双引号声明

    int currentYear = 2015;//年份不需要小数且被声明为整数

    float width = 100.45f;//width 被声明为 float

    ```


    *   **变量声明**：变量需要声明，以便系统知道你在引用什么。

    ```csharp

    string myName;

    myName = “My Name”

    ```

    声明阶段，变量不需要被赋值。

    *   **变量的作用域**：变量可以在特定的上下文中被访问。

    *   **访问级别**：正如我们稍后看到的，`C#` 程序由类组成；常见的变量类型包括：


    *   `String`：同文本。

    *   `Int`：整数（1、2、3 等）。

    *   `Boolean`：true 或 false。

    *   `Float`：带小数的值（1.2f、3.4f 等）。

    *   `Arrays`：相同类型变量的组。如果这不清楚，不要担心，稍后会解释。

    *   `GameObject`：场景中的任何游戏对象。


    ## 数组


    有时，为了让代码更简洁，数组有助于对广泛的数据应用特性和相似的行为。数组有助于声明更少的变量（存储相同类型的变量）并更容易地访问它们。创建数组时，你可以创建一维数组和多维数组。


    让我们看看数组的最简单形式：一维数组。对于这个概念，我们可以以一组十个人的名字来类比。如果我们想用字符串变量来存储这些信息，我们需要声明（并设置）十个不同的变量。


    ```csharp

    string name1;string name2;```


    虽然这段代码完全可行，但将它们存储在一个变量中更好。为了这个目的，我们可以使用数组。数组类似于通过索引访问的元素列表。索引通常从 0 开始（列表中的第一个元素）。


    所以让我们看看如何使用数组来实现；首先我们可以这样声明数组：


    ```csharp

    string [] names;

    ```


    你可能已经注意到了语法 `dataType [] nameofArray`。`[]` 语法意味着我们声明了一个字符串值的数组。


    然后我们可以初始化数组，就像我们通常处理任何变量一样：


    ```csharp

    names = new string [10];

    ```


    在之前的代码中，我们只是说我们名为 `names` 的新数组将包含 10 个字符串变量。然后我们可以像接下来的代码片段所示，在该数组中存储信息。


    ```csharp

    names [0] = “Paul”;

    names [1] = “Mary”;

    …

    names [9] = “Pat”;

    ```


    '
- fmt: '

    In the previous code, we store the name `Paul` as the first element in the array
    (remember the index starts at 0); we store the second element (with the index
    1) as `Mary`, as well as the last element (index is 9), `Pat`.


    Note that for an array of size `n`, the index of the first element is `0` and
    the index of the last element is `n-1`. So for an array of size `10`, the index
    for the first element is `0`, and the index of the last element is `9`.


    If you were to use arrays of integers or floats, or any other type of data, the
    process would be similar.


    Now, one of the cool things you can do with arrays is that you can initialize
    your array in one line, saving you the headaches of writing 10 lines of code if
    you have 10 variables, as illustrated in the next example.


    ```csharp

    string [] names = new string [10] {“Paul”,”Mary”,”John”,“Mark”, “Eva”,”Pat”,”Sinead”,”Elma”,”Flaithri”,
    “Eleanor”};

    ```


    This is very handy, as you will see in the next chapters, and this should definitely
    save you time coding.


    Now that we have looked into single-dimensional arrays, let’s look at multidimensional
    arrays, which can also be very handy when storing information. This type of array
    (i.e., multidimensional array) can be compared to a building with several floors,
    and on each floor, several apartments. So let’s say that we would like to store
    the number of tenants for each apartment; we would, in this case, create variables
    that would store this number for each of these apartments.


    The first solution would be to create variables that store the number of tenants
    for each of these apartments with a variable that makes reference to the floor,
    and the number of the apartment. For example, `ap0_1` could be for the first apartment
    on the ground floor, `ap0_2`, would then be for the second apartment on the ground
    floor, `ap1_1`, would then be for the first apartment on the first floor, and
    `ap1_2`, would then be for the second apartment on the first floor. So in term
    of coding, we could have the following:


    ```csharp

    int ap0_1 = 0;

    int ap0_2 = 0;

    …

    ```


    Using arrays instead we could do the following:


    ```csharp

    int [,] apArray = new int [10,10];

    apArray [0,1] = 0;

    apArray [0,2] = 0;

    print (apArray[0]);

    ```


    In the previous code:


    *   We declare our array. `int [,]` means an array that has two dimensions; in
    other words, we say that any element in this array will be defined and accessed
    based on two parameters: the floor level and the number of this apartment on that
    level.

    *   We also specify a size (or maximum) for each of these parameters. The maximum
    number of floors (level) will be `10`, and the maximum number of apartment per
    floor will be `10`. So, for this example we can define levels, from level `0`
    to level `9` (that would be 10 levels), and from apartment `0` to apartment `9`
    (that would be 10 apartment).

    *   The last line of code `print` (in the Console window) the value of the first
    element of the array.


    One of the other interesting things with arrays is that, using a loop, you can
    write a single line of code to access all the elements of this array, and hence,
    write more efficient code.


    ### Constants


    So far we have looked at variables and how you can store and access them seamlessly.
    The assumption then was that a value may change over time, and that this value
    would be stored in a variable. However, there may be times when you know that
    a value will remain constant. For example, you may want to define labels that
    refer to values that should not change over time, and in this case, you could
    use constants. Let me explain: let’s say that the player may have three choices
    in the game (e.g., referred to as `0`, `1`, and `2`) and that you don’t really
    want to remember these values, or that you would like to use a way that makes
    it easier to refer to them. Let’s look at the following code:


    ```csharp

    int userChoice = 2;

    if (userChoice == 0) print (“you have decided to restart”);

    if (userChoice == 1) print (“you have decided to stop the game”);

    if (userChoice == 2) print (“you have decided to pause the game”);

    ```


    In the previous code:


    *   The variable `userChoice` is an integer and is set to `1`.

    *   Then we check its value and print a message accordingly.


    Now, you may or may not remember that `0` corresponds to restarting the game;
    the same applies to the other two values. So instead, we could use constants to
    make it easier to remember (and use) these values. Let’s look at the equivalent
    code that uses constants.


    ```csharp

    const int CHOICE_RESTART = 0;

    const int CHOICE_STOP = 1;

    const int CHOICE_PAUSE = 2;

    int userChoice = 2;

    if (userChoice == CHOICE_RESTART) print (“you have decided to restart”);

    if (userChoice == CHOICE_STOP) print (“you have decided to stop the game”);

    if (userChoice == CHOICE_PAUSE) print (“you have decided to pause the game”);

    ```


    In the previous code:


    *   We declare three constant variables.

    *   These variables are then used to check the choice made by the user.


    ```csharp

    const float VAT_RATE = 0.2f;

    float priceBeforevat = 100f;

    float priceAftervat = priceBeforevat * VAT_RATE;

    ```


    *   We declare a constant float vat rate.

    *   We declare a float price before vat.

    *   We calculate the price after vat.


    It is a very good practice to use constants for values that don’t change; Using
    constants makes your code more readable; it saves work (e.g., for calculations).
    Note that the `=` operator, when used with strings, will concatenate strings (i.e.,
    add them one after the other to create a new string). When used with a number
    and a string, the same will apply (for example “Hello”+1 will result in “ Hello1”).


    ### Operators


    Once we have declared and assigned values to variables, we can use operators to
    modify or combine variables. There are different types of operators including:
    arithmetic operators, assignment operators, comparison operators and logical operators.


    Arithmetic operators are used to perform arithmetic operations including additions,
    subtractions, multiplications, or divisions. Common arithmetic operators include
    `+`, `-`, `*`, `/`, or `%` (modulo).


    ```csharp

    int number1 = 1; // the variable number1 is declared

    int number2 = 1; // the variable number2 is declared

    int sum = number1 + number2; // adding two numbers and store them in sum

    int sub = number1 - number2; // subtracting two numbers and store them in sub

    ```


    Assignment operators can be used to assign a value to a variable and include `=`,
    `+=`, `-=`, `*=`, `/=` and `%=`.


    ```csharp

    int number1 = 1;

    int number2 = 1;

    number1+=1; //same as number1 = number1 + 1;

    number1-=1; //same as number1 = number1 - 1;

    number1*=1; //same as number1 = number1 * 1;

    number1/=1; //same as number1 = number1 / 1;

    number1%=1; //same as number1 = number1 % 1;

    ```


    Comparison operators are often used for conditions to compare two values; comparison
    operators include `==`, `!=`, `>`, `<`, `>=` and `<=`.


    ```csharp

    if (number1 == number2); //if number1 equals number2

    if (number1 != number2); //if number1 and number2 have different values

    if (number1 > number2); //if number1 is greater than number2

    if (number1 >= number2); //if number1 is greater than or equal to number2

    if (number1 < number2); //if number1 is less than number2

    if (number1 <= number2); //if number1 is less than or equal to number2

    ```


    ### Conditional statements


    Statements can be performed based on a condition, and in this case they are called
