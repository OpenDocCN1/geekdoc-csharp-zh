    1. Can you already easily create a game in `C#`?

    2. Are you looking for a reference book on `Unity` programming?

    3. Are you an experienced (or at least advanced) `Unity` programmer?


    If you can answer yes to all three questions, you may instead look for the next
    books in the series. To see the content and topics covered by these books, you
    can check the official website ([www.learntocreategames.com/books](http://www.learntocreategames.com/books)).


    Improving the Book


    Although great care was taken in checking the content of this book, I am human,
    and some errors could remain in the book. As a result, it would be great if you
    could let me know of any issue or error you may have come across in this book,
    so that it can be solved and the book updated accordingly. To report an error,
    you can email me ([learntocreategames@gmail.com](mailto:learntocreategames@gmail.com))
    with the following information:


    * Name of the book.

    * The page where the error was detected.

    * Describe the error and also what you think the correction should be.


    Once your email is received, the error will be checked, and, in the case of a
    valid error, it will be corrected and the book page will be updated to reflect
    the changes accordingly. Supporting the Author


    A lot of work has gone into this book and it is the fruit of long hours of preparation,
    brainstorming, and finally writing. As a result, I would ask that you do not distribute
    any illegal copies of this book.


    This means that if a friend wants a copy of this book, s/he will have to buy it
    through the official channels (i.e., through Amazon, `lulu.com`, or the book’s
    official website: [www.learntocreategames.com](http://www.learntocreategames.com)
    / books).


    If some of your friends are interested in the book, you can refer them to the
