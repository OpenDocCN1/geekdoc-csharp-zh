    \ 类，因此它们默认会包含几个方法，包括 `Start` 和 `Update`，你可以重写这些方法（即为了你自己的用途对其进行修改）。\n\n## 变量的作用域\n\
    \n每当你在 `C#` 中创建一个变量时，你都需要意识到变量的作用域和访问类型，以便在它的作用域允许的地方使用它。\n\n变量的作用域是指你在脚本中哪些地方可以使用该变量。在\
    \ `C#` 中，我们通常区分全局变量和局部变量。\n\n你可以将局部变量和全局变量这两个术语比作局部语言或全局语言。在第一情况下，局部语言仅供当地人使用（即说出来），而全局语言会被任何人（无论他们是当地人还是全球社区的一部分）使用（即说出来）并理解。\n\
    \n当你定义一个类并带有成员变量时，这些变量将被该类中的任何方法看到。\n\n全局变量是可以在脚本任何地方使用的变量，因此得名全局。这些变量需要在脚本的开头（使用通常的声明语法）并在任何方法之外进行声明；然后就可以如下一个代码片段所示，在脚本的任何地方使用。\n\
    \n```csharp\nclass MyBike\n{\n    private int color;\n    private float speed;\n\
    \    public void accelerate()\n    {\n        speed++;\n    }\n}\n```\n\n在之前的代码中，我们将变量\
    \ `speed` 声明为成员变量，并在 `accelerate` 方法中访问它。\n\n局部变量定义在方法内部，并且仅在该方法内部使用，因此被称为局部（local）”，因为它们只能在局部使用，正如下一个代码片段所示。\n\
    \n```csharp\npublic void Start()\n{\n    int myVar;\n    myVar = 0;\n}\n\npublic\
    \ void Update()\n{\n    int myVar2;\n    myVar2 = 2;\n}\n```\n\n在之前的代码中，`myVar`\
    \ 是 `Start` 方法的局部变量，只能在该函数内部使用；`myVar2` 是 `Update` 方法的局部变量，只能在该方法内部使用。\n\n## 事件\n\
    \n在整本书以及 `C#` 中，你将读到并使用事件。那么它们到底是什么呢？\n\n简单来说，事件可以被比为特定时间发生的事情，当此事件发生时，需要执行某些操作（例如，某个动作）。如果我们用日常活动来类比：当闹钟响起（事件）时，我们可以选择起床（动作）或决定继续睡一会儿。当你收到一封邮件（事件）时，你可以决定阅读它（动作），然后回复发送者（另一个动作）。\n\
    \n在计算机术语中，情况非常相似，尽管我们将处理的事件会略有不同。因此，我们可以等待用户按下按键（事件），然后相应地移动角色（动作），或者等待用户点击屏幕上的按钮（事件）来加载新场景（动作）。\n\
    \n在 Unity 中，每当事件发生时，通常会调用一个函数（或方法）（在这种情况下，该函数通常被称为处理器（handler），因为它“处理”了该事件）。然后你就有机会修改此函数并添加在这些事件发生时应该遵循的指令（即语句）。\n\
    \n继续用日常活动的类比：我们可以在纸上给朋友写指令，这样在在我们不在时有人打电话，朋友就确切知道该做什么。因此，事件处理器基本上是一组指令（通常存储在函数内部），以便在特定事件发生时遵循。\n\
    \n有时，关于特定事件的信息会传递给此方法，而有时则不会。例如，当屏幕刷新时，会调用 `Update` 方法。当游戏开始时（即当特定脚本被启用时），会调用\
    \ `Start` 方法。当玩家和物体之间发生碰撞时，会调用 `OnControllerColliderHit` 方法。在这种特定情况下（即碰撞），通常会将一个物体传递给处理该事件的方法，以便我们获取更多关于参与碰撞的另一个物体的信息。\n\
    \n正如你所看到的，我们的游戏中可能存在各种广泛的事件，我们稍后会讨论这一点。在本书中，我们本质上将处理以下事件：\n\n* `Start`: 当脚本启用时（例如，场景开始）。\n\
    * `Update`: 当屏幕刷新时（例如，每一帧）。\n* `OnControllerColliderHit`: 当玩家与另一个物体之间发生碰撞时。\n\
    * `Awake`: 当游戏开始时（即仅一次）。\n\n## 多态（通用概念）\n\n多态（Polymorphism）一词源于 poly（多个）和 morph（形状）；因此它从字面上意思是“多种形式”。在面向对象的编程中，它指的是根据对象的数据类型或类以不同的方式（或更具体地）处理对象的能力。让我们以加法为例。如果我们想将两个数字相加，我们将进行代数加法（例如，`1\
    \ + 2`）。然而，加上两个字符串变量可能意味着将它们拼接（一个接一个地相加）。例如，加上文本“Hello”和文本“World”将得到文本“ HelloWorld”。正如你所看到的，对不同数据类型执行操作的方式可能有所不同。因此，让我们看看下面的代码，它说明了如何在\
    \ `C#` 中实现这一点。\n\n```csharp\npublic class AddObjects\n{\npublic int add (int a,\
    \ int b)\nreturn a + b;\n\npublic string add (string a, string b)\nreturn a +\
    \ b;\n}\n```\n\n在之前的代码中，可以加上不同类型的数据：整数和字符串。取决于传递的是两个整数还是两个字符串，我们将调用第一个 `add` 方法或第二个\
    \ `add` 方法。\n\n### 动态多态\n\n在 `C#` 中，可以使用抽象类和虚函数来实现动态多态。\n\n在 `C#` 中，可以创建一个提供接口部分实现的类。广义地说，接口定义了类应该包含的内容（即成员方法、成员变量或事件），但它没有声明这些内容应该如何实现。因此，抽象类将包含抽象方法或变量；这意味着该类将定义变量的名称和类型、方法的名称以及该方法返回的数据类型。它被称为抽象（abstract），是因为你不能实现这种类（它永远无法被“实例化”）；然而，它可以作为派生类的模板（或“梦想”类）。让我们看看下面的例子。\n\
    \n```csharp\nabstract class Vehicule\n{\n    public abstract void decelerate();\n\
    }\n\nclass Bike : Vehicule\n{\n    private float speed;\n    private int color;\n\
    \    public Bike(float newSpeed)\n    {\n        speed = newSpeed;\n    }\n  \
    \  public override void decelerate()\n    {\n        speed--;\n    }\n}\n```\n\
    \n在之前的代码中：\n\n* 我们声明了一个抽象类 `Vehicule`。\n* 我们声明了一个名为 `decelerate` 的抽象方法。\n* 然后我们创建了一个新类\
    \ `Bike`，继承自抽象类 `Vehicule`，但带有它自己的构造函数。\n* 然后我们重写了抽象方法 `decelerate` 以使用我们自己的实现。\n\
    \n使用抽象类仅仅意味着我们列出了对子类有用的的方法；然而，子类必须定义如何实现这些方法。\n\n"
- fmt: "\nThe second way to implement dynamic polymorphism is by using virtual methods\
    \ or variables. In the case of virtual methods, we declare a method that will\
    \ be used by default by objects of this class or inherited classes; however, in\
    \ this case, even if the method is ready to be used (i.e., because we have defined\
    \ how it should be implemented), it can be changed (or overridden) by the child\
    \ (i.e., the inherited class) to fit a specific purpose. In this case (i.e., inherited\
    \ method), we need to specify that we override this method using the keyword `override`.\n\
    \nThe key difference between an abstract and a virtual method is that, while an\
    \ abstract method should be overridden, a virtual methods may be overridden if\
    \ the base method (i.e., the method declared in the base class) does not suit\
    \ a particular purpose.\n\nLet’s look at an example:\n\n```csharp\nclass Vehicle\n\
    {\n    protected float speed;\n    public virtual void accelerate()\n    {\n \
    \       speed += 10;\n    }\n    public Vehicle(float newSpeed)\n    {\n     \
    \   speed = newSpeed;\n    }\n}\n\nclass Bike : Vehicle\n{\n    public override\
    \ void accelerate()\n    {\n        speed++;\n    }\n    public Bike(float newSpeed)\
    \ : base(newSpeed){}\n}\n```\n\nIn the previous code:\n*   We declare a class\
    \ `Vehicle`.\n*   It includes both a protected variable `speed` and a virtual\
    \ method called `accelerate`. This method is virtual, which means that inherited\
    \ classes will be able to modify (override) it, if need be.\n*   The class `Bike`\
    \ has its own constructor; however, this constructor inherits from the parent’s\
    \ constructor; this means that by calling the constructor of the class `Bike`,\
    \ we effectively call the parent’s (of the base’s) constructor, using the syntax:\
    \ `public Bike(float newSpeed) : base(newSpeed){}`\n*   We then create a new class\
    \ `Bike` that inherits form the class `Vehicle`. In this class, we override the\
    \ method `accelerate` using the keyword `override` so that the speed is just incremented\
    \ by one.\n\n# Workflow to create a script\n\nThere are many ways to create and\
    \ use scripts in Unity, but generally the process is as follows:\n\n*   Create\
    \ a new script using the Project view (`Create | C# Script`) or the main menu\
    \ (`Assets | Create | C# Script`).\n*   Attach the script to an object (e.g.,\
    \ drag and drop the script on the object).\n*   Check in the Console window that\
    \ there are no errors in the script.\n*   Play the scene.\n\nWhen you create your\
    \ script, by default, the name of the class within the script will be the name\
    \ of the script. So let’s say that you created a new script called `TestCode`,\
    \ then the following code will be automatically generated within:\n\n```csharp\n\
    using UnityEngine;\nusing System.Collections;\n\npublic class TestCode : MonoBehaviour\n\
    {\n    public void Start ()\n    {\n    }\n    public void Update ()\n    {\n\
    \    }\n}\n```\n\nIn the previous code, the class `TestCode` has been created;\
    \ it inherits from the class `MonoBehaviour`, and it includes two methods that\
    \ can be modified: `Start` and `Update`. You will also notice the two namespaces\
    \ `UnityEngine` and `System.Collections`. As we have seen earlier, the keyword\
    \ `using` is called a directive; in this particular case it is used to import\
    \ what is called a namespace; put simply, by adding this directive you are effectively\
    \ importing a collection of classes or data types. Each of these namespaces or\
    \ “libraries” includes useful classes for your programme. For example, the namespace\
    \ `UnityEngine` will include classes for Unity development and `System.Collections`\
    \ will include classes and interfaces, for different collections of objects. You\
    \ can of course create classes that will not be linked to any object, and used\
    \ to instantiate new objects.\n\n# How scripts are compiled\n\nWhenever you create\
    \ and save a script it is compiled and Unity will notify you (using the Console\
    \ window) of any error. This being said, the order in which the scripts are compiled\
    \ depends on its location. First, the scripts located in the folders `Standard\
    \ Assets`, `Pro Standard Assets` or `Plugins`, then the scripts located in `Standard\
    \ Assets/Editor`, `Pro Assets/Editor` or `Plugins/Editor`, and then the scripts\
    \ outside the Editor folder, followed by the scripts in the Editor folder. For\
    \ more information on script compilation, you can [check the official documentation](http://docs.unity3d.com/412/Documentation/ScriptReference/index.Script_compilation_28Advanced29.html).\n\
    \n# Coding Convention\n\nWhen you are coding, there are usually naming conventions\
    \ based on the language that you are using. These often provide increased clarity\
    \ for your code and depend on the language that you will be using.\n\nNaming conventions\
    \ usually employ a combination of camel casing and Pascal casing.\n*   In camel\
    \ casing all words included in a name, except for the first one, is capitalized\
    \ (e.g., `myVariable`).\n*   In Pascal casing all words included in a name are\
    \ capitalized (e.g., `MyVariable`).\n\nWhen coding in C# for example, naming conventions\
    \ will use a combinations of camel an Pascal casing depending on whether you are\
    \ naming a class, an interface, a variable or a resource.\n\nHowever, as a C#\
    \ beginner, in addition to learn about classes, methods, or inheritance, it may\
    \ not be necessary to adhere completely to this naming convention at the start,\
    \ at least as long as you use a consistent naming scheme.\n\nSo, while it is good\
    \ to acknowledge different naming conventions, this book will use a simplified\
    \ convention:\n*   Classes (Pascal casing).\n*   All methods and variables (camel\
    \ casing).\n\nOnce you feel comfortable with C# and want to know more about the\
    \ official scheme, you may look at [naming guidelines](https://msdn.microsoft.com/en-us/library/ms22902?v=10.aspx).\n\
    \n# A few things to remember when you create a script (checklist)\n\nAs you create\
    \ your first scripts, there will be, without doubt, errors and possibly hair pulling.\
    \ You see, when you start coding, you will make small mistakes; it is part of\
    \ the process. We all learn by trial and error, and making mistakes is part of\
    \ the learning process.\n\nSo, as you create your first script, set any fear aside,\
    \ try to experiment, and get to learn the language. It is like learning a new\
    \ foreign language: when someone from a country understands your first sentences,\
    \ you feel so empowered! So, it will be the same with C#, and to ease the learning\
    \ process, I have included a few tips and things to keep in mind when writing\
    \ your scripts, so that you progress even faster.\n\n*   Each opening bracket\
    \ has a corresponding closing bracket.\n*   All variables are written consistently\
    \ (e.g., spelling and case). The name of each variable is case-sensitive; this\
    \ means that if you declare a variable `myvariable` but then refer to it as `myVariable`\
    \ later on in the code, this may trigger an error, as the variable `myVariable`\
    \ and `myvariable`, because they have a different case (upper- or lower-case `V`),\
    \ are seen as two different variables.\n*   All variables are declared (type and\
    \ name) prior to being used (e.g., `int`).\n*   The type of the argument passed\
    \ to a method is the type that is required by this method.\n*   The type of the\
    \ argument returned by a method is the type that is required to be returned by\
    \ this method.\n"
  raw: 'The second way to implement dynamic polymorphism is by using virtual methods
    or variables. In the case of virtual methods , we declare a method that will be
    used by default by objects of this class or inherited classes; however, in this
    case, even if the method is ready to be used (i.e., because we have defined how
    it should be implemented), it can be changed (or overridden) by the child (i.e.,
    the inherited class) to fit a specific purpose. In this case (i.e., inherited
    method), we need to specify that we override this method using the keyword override
    .


    The key difference between an abstract and a virtual method is that, while an
    abstract method should be overridden, a virtual methods may be overridden if the
    base method (i.e., the method declared in the base class) does not suit a particular
    purpose.


    Let’s look at an example:


    class Vehicle


    {


        protected float speed;


        public virtual void accelerate()


        {


            speed += 10;


        }


        public Vehicle(float newSpeed)


        {


            speed = newSpeed;


        }


    }


    class Bike : Vehicle


    {


        public override void accelerate()


        {


            speed++;


        }


        public Bike(float newSpeed) : base(newSpeed){}


    }


    In the previous code:


    *   We declare a class Vehicle .


    *   It includes both a protected variable speed and a virtual method called accelerate
    . This method is virtual, which means that inherited classes will be able to modify
    (override) it, if need be.


    *   The class Bike has its own constructor; however, this constructor inherits
    from the parent’s constructor; this means that by calling the constructor of the
    class Bike, we effectively call the parent’s (of the base’s) constructor, using
    the syntax:


    public Bike(float newSpeed) : base(newSpeed){}


    *   We then create a new class Bike that inherits form the class Vehicle . In
    this class, we override the method accelerate using the keyword override so that
    the speed is just incremented by one.


    Workflow to create a script


    There are many ways to create and use scripts in Unity, but generally the process
    is as follows:


    *   Create a new script using the Project view ( Create | C# Script) or the main
    menu ( Assets | Create | C# Script ).


    *   Attach the script to an object (e.g., drag and drop the script on the object).


    *   Check in the Console window that there are no errors in the script.


    *   Play the scene.


    When you create your script, by default, the name of the class within the script
    will be the name of the script. So let’s say that you created a new script called
    TestCode , then the following code will be automatically generated within:


    using UnityEngine;


    using System.Collections;


    public class TestCode : MonoBehaviour


    {


    public void Start ()


    {


    }


    public void Update ()


    {


    }


    }


    In the previous code, the class TestCode has been created; it inherits from the
    class MonoBehaviour , and it includes two methods that can be modified: Start
    and Update . You will also notice the two namespaces UnityEngine and System.Collections
    . As we have seen earlier, the keywords using is called a directive; in this particular
    case it is used to import what is called a namespace; put simply, by adding this
    directive you are effectively importing a collection of classes or data types.
    Each of these namespaces or “libraries” includes useful classes for your programme.
    For example the namespace UnityEngine will include classes for Unity development
    and System.Collections will include classes and interfaces, for different collections
    of objects. You can of course create classes that will not be linked to any object,
    and used to instantiate new objects.


    How scripts are compiled


    Whenever you create and save a script it is compiled and Unity will notify you
    (using the Console window) of any error. This being said, the order in which the
    scripts are compiled depends on its location. First, the scripts located in the
    folders Standard Assets , Pro Standard Assets or Plugins , then the scripts located
    in Standard Assets/Editor , Pro Assets/Editor or Plugins/Editor , and then the
    scripts outside the Editor folder, followed by the scripts in the Editor folder.
    For more information on script compilation, you can [check the official documentation](http://docs.unity3d.com/412/Documentation/ScriptReference/index.Script_compilation_28Advanced29.html)
    .


    Coding Convention


    When you are coding, there are usually naming conventions based on the language
    that you are using. These often provide increased clarity for your code and depend
    on the language that you will be using.


    Naming conventions usually employ a combination of camel casing and Pascal casing.


    *   In camel casing all words included in a name, except for the first one, is
    capitalized (e.g., myVariable).


    *   In Pascal casing all words included in a name are capitalized (e.g., MyVariable).


    When coding in C# for example, naming conventions will use a combinations of camel
    an Pascal casing depending on whether you are naming a class, an interface, a
    variable or a resource.


    However, as a C# beginner, in addition to learn about classes, methods, or inheritance,
    it may not be necessary to adhere completely to this naming convention at the
    start, at least as long as you use a consistent naming scheme.


    So, while it is good to acknowledge different naming conventions for programming
    language and to understand why there are in place, and to keep things simple,
    this book will use a simplified naming convention, as follows:


    *   Classes (Pascal casing).


    *   All methods and variables (camel casing).


    Once you feel comfortable with C# and want to know more about the official naming
    scheme, you may look at Microsoft [official naming guidelines](https://msdn.microsoft.com/en-us/library/ms229002%28v=vs.110%29.aspx)
    .


    A few things to remember when you create a script (checklist)


    As you create your first scripts in the next chapter, there will be, without a
    doubt, errors and possibly hair pulling :-). You see, when you start coding, you
    will, as for any new activity, make small mistakes, learn what they are, improve
    your coding, and ultimately get better at writing your scripts.  As I have seen
    students learning scripting, there are some common errors that are usually made;
    these don’t make you a bad programmer; on the contrary, it is part of the learning
    process.


    We all learn by trial and error, and making mistakes is part of the learning process.


    So, as you create your first script, set any fear aside, try to experiment, be
    curious, and get to learn the language. It is like learning a new foreign language:
    when someone from a foreign country understands your first sentences, you feel
    so empowered! So, it will be the same with C#, and to ease the learning process,
    I have included a few tips and things to keep in mind when writing your scripts,
    so that you progress even faster. You don’t need to know all of these by now (I
    will refer to these later on, in the next chapter), but just be aware of it and
    also use this list if any error occurs (this list is also available as a pdf file
    in the resource pack, so that you can print it and keep it close by). So, watch
    out for these :-).


    •         Each opening bracket has a corresponding closing bracket.


    •         All variables are written consistently (e.g., spelling and case). The
    name of each variable is case-sensitive; this means that if you declare a variable
    myvariable but then refer to it as myVariable later on in the code, this may trigger
    an error, as the variable myVariable and myvariable , because they have a different
    case (upper- or lower-case V ), are seen as two different variables.


    •         All variables are declared (type and name) prior to being used (e.g.,
    int ).


    •         The type of the argument passed to a method is the type that is required
    by this method.


    •         The type of the argument returned by a method is the type that is required
    to be returned by this method.'
