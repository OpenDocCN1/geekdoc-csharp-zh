    ```csharp\nmySecondMethod(“Patrick”);\n```\n\n- 保存你的代码，切换到 Unity，检查 `Console`\
    \ 窗口是否有错误，并运行场景。\n- 你应该在其他消息中看到“Hello, your name is Patrick”这条消息。\n- 你现在可以更改对该方法的调用，并将你自己的名字作为参数传递，并在运行场景时查看结果。\n\
