    Bike myBike = new Bike();


    This code will create an object based on the “template” Bike . You may notice
    the syntax:


    dataType variable = new dataType()


    By default, this new object will include all the member variables and methods
    defined earlier. So it will have a color and a speed, and we should also be able
    to access its accelerate and turnRight methods. So how can this be done? Let’s
    look at the next code snippet that shows how we can access these.


    Bike b = new Bike();


    b.accelerate();


    In the previous code:


    *   The new bike myBike is created.


    *   The speed is then increased after calling the accelerate method. This method
    can be called using the dot notation because it is public .


    *   Note that to call an object’s method we use the dot notation.


    When defining member variables and methods, it is usually good practice to restrict
    the access to member variables (e.g., private type) and to define public methods
    with no or less strict restrictions (e.g., public) that provide access to these
    variables. These methods are often referred to as getters and setters (because
    you can get or set values from them).


    To illustrate this concept, let’s look at the following code:


    public class Bike


    {


        private float speed;


        private int color;


        public void accelerate()


        {


            speed++;


        }


        public void turnRight()


        {


        }


        private void calculateDistance()


        {


        }


        public void setSpeed(float newSpeed)


        {


            speed = newSpeed;


        }


        public float getSpeed()


        {


            return (speed)


        }


    }


    In the previous code, we have declared two new methods: setSpeed and getSpeed
    .


    *   For setSpeed : the type is void as this method does not return any information,
    and its access is set to public , so that it can be accessed with no restrictions.


    *   For getSpeed : the type is float as this method returns the speed, which type
    is float. Its access is set to public , so that it can be accessed with no restrictions.


    So, we could combine the code created to date in one programme (or new class)
    as follows in Unity.


    using UnityEngine;


    using System.Collections;


    public class TestCode : MonoBehaviour {


    public class Bike


    {


        private float speed;


        private int color;


        public void accelerate()


        {


            speed++;


        }


        public void turnRight()


        {


        }


        private void calculateDistance()


        {


        }


        public void setSpeed(float newSpeed)


        {


            speed = newSpeed;


        }


        public float getSpeed()


        {


            return (speed)


        }


    }


    public void Start ()


    {


    Bike myBike = new Bike();


    myBike.setSpeed (23.0f);


    print (myBike.getSpeed());


    }


    }


    In the previous code, you may notice at least two differences compared to the
    previous code that we have created:


    *   At the start of the code, the following two lines of code have been added:


    using UnityEngine;


    using System.Collections;'
