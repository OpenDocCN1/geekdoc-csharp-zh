    Frequently Asked Questions


    This chapter provides answers to the most frequently asked questions about the
    features that we have covered in this book. Please also note that some [videos
    are also available on the companion site](http://learntocreategames.com/book-videos/)
    to help you with some of the concepts covered in this topic, including AI, UI,
    collision, cameras, or paths.


    C# Scripts


    How do I create a script?


    In the Project window, select: Create | C# Script .


