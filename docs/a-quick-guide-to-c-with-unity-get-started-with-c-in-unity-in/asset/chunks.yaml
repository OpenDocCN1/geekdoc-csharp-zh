  trans: '

    这意味着如果条件被验证（或为真），那么（且仅在此时）将执行该语句。当我们评估一个条件时，我们是在测试一个声明是否为真。例如，通过输入 `if (a == b)`，我们的意思是“如果
    `a` 等于 `b` 是真的”。同样，如果我们输入 `if (a>=b)`，我们的意思是“如果 `a` 大于或等于 `b` 是真的”。


    正如我们后面将看到的，我们还可以组合条件。例如，如果两个（或更多）条件为真，我们可以决定执行某条语句。例如，通过输入 `if (a == b && c ==
    2)`，我们的意思是“如果 `a` 等于 `b` 且 `c` 等于 2”。在这种情况下，使用运算符 `&&` 表示“与”（AND），并且两个条件都必须为真。我们可以将其类比为决定明天是否去帆行。例如，“如果天气晴朗且风速小于
    5km/h，那么我就去帆行”。我们可以这样翻译这条语句：


    ```

    if (weatherIsSunny == true && windSpeed < 5) IGoSailing = true ;

    ```


    在创建条件时，与大多数自然语言一样，我们可以使用标记为 `||` 的 OR 运算符。参考前面的例子，我们可以将以下句子“如果天气太热或风速大于 5km/h，那么我就不去帆行”翻译如下：


    ```

    if (weatherIsTooHot == true || windSpeed >5) IGoSailing = false ;

    ```


    另一个例子如下：


    ```

    if (myName == “Patrick”) print(“Hello Patrick”);else print (“Hello Stranger”);

    ```


    当我们处理真或假语句的组合时，我们实际上是在应用所谓的**布尔逻辑（（Boolean logic**）。布尔逻辑处理的是具有两个值 1 和 0（或真和假）的布尔变量。通过评估条件，我们实际上在处理布尔数字并应用布尔逻辑。虽然你不需要深入了解布尔逻辑，但某些用于布尔逻辑的运算符是重要的，包括
    `!` 运算符。它表示“非”（NOT）或相反面。这意味着如果一个变量为真，它的相反面就为假，反之亦然。例如，如果我们考虑变量 `weatherIsGood
    = true`，那么 `!weatherIsGood` 的值将是 `false`（它的相反面）。因此，条件 `if (weatherIsGood == false)`
    也可以写成 `if (!weatherIsGood)`，其字面意思是“如果天气不好”。


    ## Switch 语句


    如果你已经理解了条件语句的概念，那么这一部分应该非常直观易懂。switch 语句是我们之前看到的 if/else 语句的变体。switch 语句的思想是，根据特定变量的值，我们将切换到代码特定部分并执行一个或多个操作。用于
    switch 结构的变量通常是整数类型**。让我们来看一个简单的例子：


    ```

    int choice = 1;

    switch (choice)

    {

    case 1:

    print ("you chose 1");

    break;

    case 2:

    print ("you chose 2");

    break;

    case 3:

    print ("you chose 3");

    break;

    default:

    print ("Default option");

    break;

    }

    print (“We have exited the switch structure”);

    ```


    在之前的代码中：


    - 我们声明了变量 `choice` 为整数，并将其初始化为 `1`。

    - 然后我们创建了一个 switch 结构，根据变量 `choice` 的值，程序将切换到相关部分（即以 `case 1:`、`case 2:` 等开始的代码部分）。注意，在我们的代码中，我们寻找值
    `1`、`2` 或 `3`。然而，如果变量 `choice` 不等于 1、2 或 3，程序将跳转到名为 `default` 的部分。这是因为如果任何其他可能的选择（即
    1、2 或 3）未满足（或未被选择），就会执行该部分。


    注意，每个选择或分支都以关键字 `case` 开始并以 `break` 结束。`break` 语句的作用是指定在执行完分支（或当前选择）中的命令后，应该退出
    switch 结构。如果没有任何 `break` 语句，将执行下一行代码。


    所以让我们考虑之前的例子并看看它是如何运作的。在我们的情况下，变量 `choice` 被设置为 `1`，所以我们将进入 switch 结构，然后寻找变量 `choice`
    值为 `1` 的部分。这将是从 `case 1:` 开始的部分；然后将执行命令 `print ("you chose 1");`，接着执行命令 `break`，表示我们应该退出
    switch 结构；最后执行命令 `print (“We have exited the switch structure”)`。


    switch 结构对于组织你的代码以及在根据整数值处理互斥选择（即只能处理选择中的某一个）时非常有用，特别是在菜单的情况下。此外，switch 结构可以使代码更加整洁易于理解。


    ## 循环（Loops）


    作为一名程序员，有时你必须执行重复性任务；很多时候，这些任务可以通过循环来快速完成。循环是根据条件重复执行相同动作的结构。因此，过程通常如下：


    - 开始循环。

    - 执行动作。

    - 检查条件。

    - 如果满足条件则退出循环，否则继续循环。


    有时条件是在循环开始时执行的，有时是在循环结束时执行的。


    让我们来看一个使用 while 循环的例子：


    ```

    counter = 0;

    while (counter <=10)

    {

    print (“Counter = ” + counter);

    counter++;

    }

    ```


    在之前的代码中：


    - 我们设置变量 `counter` 的值。

    - 然后我们创建一个以关键字 `while` 开头的循环。

    - 我们设置了留在循环中的条件（即 `counter <=10`）。

    - 在循环内部，我们将变量 `counter` 的值加 1。


    所以实际上：


    - 第一次通过循环：`counter` 增加到 `1`；到达循环结束；回到开头检查 `counter <=10`，这种情况下为真（`counter = 1`）。

    - 第二次通过循环：`counter` 增加到 `2`；到达循环结束；回到开头检查 `counter <=10`，这种情况下为真（`counter = 2`）。

    - ……

    - 第 11 次通过循环：`counter` 增加到 `11`；到达循环结束；回到开头检查 `counter <=10`，此时为假（`counter = 11`）。结果是，我们随后退出循环。


    所以，正如你所看到的，使用循环我们能够迭代地将变量 `counter` 的值增加到 11，但使用的代码比其他方法少。


    现在，我们可以创建一个稍微修改过的循环版本；来看下面的例子：


    ```

    int counter = 0;

    do

    {

    print (“Counter = ” + counter);

    counter++;

    } while (counter <=10);

    ```


    在这个例子中，你可能发现与之前的代码相比有两处不同：


    - `while` 关键字现在位于循环的末尾。因此条件会在循环结束时进行评估（评估）。

    - `do` 关键字现在出现在循环的开头。

    - 在这个例子中，我们执行语句然后检查条件。


    代码的另一种形式如下：


    ```

    for (int counter = 0; counter <=10; counter ++)

    {

    print (“Counter = ” + counter);

    }

    ```


    在之前的代码中：


    - 我们以一种稍微不同的方式声明循环：我们说将使用一个名为 `counter` 的整数变量，从 0 到 10。

    - 每当我们通过循环一次，这个变量 `counter` 都会增加 1。

    - 只要变量 `counter` 小于或等于 10，我们就留在循环中。

    - 在这种情况下，条件的测试是在循环开始时执行的。

