  trans: "\n\n实现动态多态的第二方法是使用虚拟方法或变量。在虚拟方法的情况下，我们声明了一个将被此类或继承类的对象默认使用的方法；然而，在这种情况下，即使方法已经就绪（即因为我们已经定义了它应该如何实现），它也可以被子类（即被继承的类）修改（重写）以适应特定的目的。在这种情况下（即被继承的方法），我们需要使用\
    \ `override` 关键字来指定我们重写了该方法。\n\n抽象方法和虚拟方法之间的区别在于：抽象方法**应该**被重写，而如果基方法（即在基类中声明的方法）不符合特定目的，虚拟方法**可以**被重写。\n\
    \n让我们来看例子：\n\n```csharp\nclass Vehicle\n{\n    protected float speed;\n    public\
    \ virtual void accelerate()\n    {\n        speed += 10;\n    }\n    public Vehicle(float\
    \ newSpeed)\n    {\n        speed = newSpeed;\n    }\n}\n\nclass Bike : Vehicle\n\
    {\n    public override void accelerate()\n    {\n        speed++;\n    }\n   \
    \ public Bike(float newSpeed) : base(newSpeed){}\n}\n```\n\n在前面的代码中：\n*   我们声明了一个类\
    \ `Vehicle`。\n*   它包含一个保护变量 `speed` 和一个名为 `accelerate` 的虚拟方法。该方法是虚拟的，这意味着如果需要，继承类将能够修改（重写）它。\n\
    *   `Bike` 类有它自己的构造函数；然而，这个构造函数继承了父类的构造函数；这意味着通过调用类 `Bike` 的构造函数，我们实际上调用了父类（基类）构造函数，语法为：`public\
    \ Bike(float newSpeed) : base(newSpeed){}`\n*   然后我们创建了一个继承自 `Vehicle` 类的新类 `Bike`。在这个类中，我们使用\
    \ `override` 关键字重写了 `accelerate` 方法，使速度只增加。\n\n# 创建脚本的工作流\n\n在 Unity 中创建和使用脚本有很多方法，但通常流程如下：\n\
    \n*   使用 Project View（`Create | C# Script`）或主菜单（`Assets | Create | C# Script`）创建一个新脚本。\n\
    *   将脚本挂载到对象上（例如，将脚本拖放到对象上）。\n*   检查 Console 窗口，确保脚本没有错误。\n*   运行场景。\n\n当你创建脚本时，默认情况下脚本中类的名称将与脚本的名称相同。假设你创建了一个名为\
    \ `TestCode` 的新脚本，那么内部会自动生成以下代码：\n\n```csharp\nusing UnityEngine;\nusing System.Collections;\n\
    \npublic class TestCode : MonoBehaviour\n{\n    public void Start ()\n    {\n\
    \    }\n    public void Update ()\n    {\n    }\n}\n```\n\n在前面的代码中，已经创建了类 `TestCode`；它继承自\
    \ `MonoBehaviour` 类，并包含了两个可以修改的方法：`Start` 和 `Update`。你还会注意到两个命名空间 `UnityEngine`\
    \ 和 `System.Collections`。正如我们之前看到的，`using` 关键字被称为指令；在这种特定情况下，它被用于导入所谓的命名空间；简单来说，通过添加此指令，你实际上导入了一组类或数据类型。这些命名空间（或“库”）每一个都包含了对你的程序有用的类。例如，`UnityEngine`\
    \ 命名空间将包含用于 Unity 开发的类，而 `System.Collections` 将包含用于不同对象集合的类和接口。当然，你可以创建不会链接到任何对象的类，并将其用于实例化新对象。\n\
    \n# 脚本如何编译\n\n每当你创建并保存脚本时，它都会被编译，Unity 会通过 Console 窗口向你通知任何错误。尽管如此，脚本的编译顺序取决于它们的位置。首先是位于\
    \ `Standard Assets`、`Pro Standard Assets` 或 `Plugins` 文件夹中的脚本，然后是位于 `Standard\
    \ Assets/Editor`、`Pro Assets/Editor` 或 `Plugins/Editor` 中的脚本，接着是 Editor 文件夹之外的脚本，最后是\
    \ Editor 文件夹中的脚本。更多关于脚本编译的信息，你可以[查看官方文档](http://docs.unity3d.com/412/Documentation/ScriptReference/index.Script_compilation_28Advanced29.html)。\n\
    \n# 编码规范\n\n在你编写代码时，通常会有基于你所使用的语言的命名规范。这些规范通常能提高代码的清晰度，取决于你将使用的语言。\n\n命名规范通常使用驼峰命名法（camel\
    \ casing）和帕斯卡命名法（Pascal casing）的组合。\n*   在小驼峰命名法中，名称中包含的所有单词除第一个单词外，首字母均大写（例如，`myVariable`）。\n\
    *   在帕斯卡命名法中，名称中包含的所有单词首字母均大写（例如，`MyVariable`）。\n\n例如，在 C# 中编写代码时，命名规范将根据你是在命名类、接口、变量还是资源，使用小驼峰和帕斯卡命名法的组合。\n\
    \n然而，作为一名 C# 初学者，除了学习类、方法或继承之外，在开始阶段没有必要完全遵循这种命名规范，只要你使用一致的命名方案即可。\n\n所以，虽然承认不同的命名规范是件好事，但本书将使用一种简化的规范：\n\
    *   类（帕斯卡命名法）。\n*   所有方法和变量（小驼峰命名法）。\n\n一旦你对 C# 感到熟悉并想了解更多官方方案，可以查看[命名指南](https://msdn.microsoft.com/en-us/library/ms22902?v=10.aspx)。\n\
    \n创建脚本时需要记住的注意事项（清单）\n\n在你创建第一个脚本时，无疑会出现错误，甚至可能让你抓狂头发。你看，当你开始编写代码时，会犯小错误；这是过程的一部分。我们都是通过尝试和错误学习的，出错是学习过程的一部分。\n\
    \n所以，在你创建第一个脚本时，放下恐惧，尽管尝试并学习这门语言。这就像学习一门新的外语：当有人听懂你的第一个句子时，你会感到非常有成就感！C# 也是如此，为了方便学习过程，我在编写脚本时包含了一些技巧和注意事项，以便你进展得更快。\n\
    \n*   每个左括号都有对应的右括号。\n*   所有变量的写法必须一致（例如，拼写和大小写）。变量名对大小写敏感；这意味着如果你声明了一个变量 `myvariable`\
    \ 但后在代码中引用 `myVariable`，这可能会触发错误，因为 `myVariable` 和 `myvariable` 因为大小写不同（大或小写 `V`）被视为两个不同的变量。\n\
    *   所有变量在使用之前都已声明（类型和名称）。\n*   传递给方法的参数类型是该方法要求的类型。\n*   方法返回的参数类型是方法要求返回的类型。\n\
    \n"
- fmt: "\n- Built-in functions are spelt with the proper case (e.g., upper-case `U`\
    \ for `Update` ).\n- Use camel casing (i.e., capitalize the first character of\
    \ each word except for the first word) or Pascal casing (i.e., capitalize the\
    \ first character of each word) consistently.\n- All statements are ended with\
    \ a semi-colon.\n- For `if` statements the condition is within round brackets.\n\
    - For `if` statements the condition uses the syntax `==` rather than `=`.\n- When\
    \ calling a method, the exact name of this method (i.e., case-sensitive) is used.\n\
    - When referring to a variable, it is done with regards to the access type of\
    \ the variable (e.g., `public` or `private`).\n- Local variables are declared\
    \ and can be used within the same method.\n- Global variables are declared outside\
    \ methods and can be used anywhere within the class.\n\n# 2 Creating your First\
    \ Script\n\nIn this section we will start to code C# scripts in Unity. Some of\
    \ the objectives of this section will be to:\n\n- Introduce C# scripting in Unity.\n\
    - Explain some basic scripting concepts.\n- Explain how to display information\
    \ from the code to the Console window.\n\nAfter completing this chapter you will\
    \ be able to:\n\n- Understand basic concepts in C#.\n- Understand best coding\
    \ practices.\n- Code your first script in Unity.\n- Create classes, methods and\
    \ variables.\n- Instantiate objects based on your own classes.\n- Use built-in\
    \ methods.\n- Use conditional statements.\n\nYou can skip this chapter if you\
    \ are already familiar with C#, or if you have already created and used C# scripts\
    \ within Unity.\n\n## Getting started\n\nIn Unity, a script (C# script) is usually\
    \ linked to an object; although it can also be used as a standalone class to be\
    \ instantiated at a later stage; generally, for your script to be executed, it\
    \ will need to be linked to an object. So to start with, we will create an empty\
    \ object, create a script, and link this script to the object.\n\n- Please launch\
    \ Unity.\n- Create a new Project (`File | New Project`).\n- Create a new scene\
    \ (`File | New Scene`).\n- Create an empty object (`GameObject | Create Empty`).\n\
    - Rename this object: `example_for_scripting` in the Hierarchy window. To do so,\
    \ you can either right-click on this object and then select the option `Rename`,\
    \ from the contextual menu, or select the object (i.e., click once on it) and\
    \ press `CTRL + Enter`.\n- You will notice, looking at the Inspector window, that\
    \ this object has only one component (`Transform`).\n\n### Let’s create a new\
    \ script\n\n- In the Project window, click once on the `Assets` folder.\n- Create\
    \ a new folder to store the scripts (this is not compulsory but it will help to\
    \ organize your scripts): Select `Create | Folder`.\n\n![](Image00000.jpg)\nFigure\
    \ 2‑1: Creating a new folder\n\n- This will create a new folder labeled `Folder`.\n\
    - Rename this folder `Scripts`.\n- Double click on this folder to display its\
    \ content and so that the script that we are about to create is added to this\
    \ folder.\n- In the Project window, select `Create | C# Script`.\n- This should\
    \ create a new C# script.\n\n![](Image00001.jpg)\nFigure 2‑2: Creating a new C#\
    \ script\n\n- By default, this script will be named `NewBehaviourScript`. However,\
    \ the name will be highlighted in blue so that you modify the name before the\
    \ content of the script is created. Please rename this script `MyFirstScript`.\n\
    \nNote that the name of the script should always match the name of the main class\
    \ within the script; so if you want to rename this script later on, you will also\
    \ need to modify the name of the main class within the script.\n\n- Click once\
    \ on the script; as you do so, look at the Inspector window, and you will see\
    \ the content of the script. By default, you will notice that it includes a definition\
    \ for the class `MyFirstScript`, namespaces, as well as two different member methods\
    \ `Start` and `Update`.\n- Double-click on the script (within the Project window),\
    \ this will open the script in `Visual Studio`, which is the default editor for\
    \ Unity.\n\nNote that you can change to the editor of your choice (e.g., `Notepad++`\
    \ or `Sublime`). This can be done by changing Unity’s preferences (`Edit | Preferences\
    \ | External Tool`). This being said, while `Visual Studio` provides code auto\
    \ completion by default, this may not be the case for other code editors (e.g.,\
    \ with `Sublime`, you need to install a specific package).\n\n- As the script\
    \ is opened in `Visual Studio` we can see it in more detail. Again, the `Start`\
    \ method is called at the start of the scene, once. The method `Update` is called\
    \ every time the screen is refreshed (every frame).\n- These functions are case-sensitive;\
    \ because they are built-in functions (i.e., functions made available by Unity\
    \ for your use), Unity is expecting them to be spelt with the exact spelling.\n\
    \n- So let's start coding.\n- First let’s create a variable of type `integer`\
    \ as a `private` member variable.\n- Type the following code just before `Start`:\n\
    \  `private int number;`\n- As you can see, the variable was declared outside\
    \ any method but inside the class `MyFirstScript`, which means it is a member\
    \ variable. The access modifier `private` specifies that the variable is accessible\
    \ only by the class `MyScript`.`.--, we can declare a `String variable variable\
    \ ``.`.\n-- the following code just the the declaration:\n    ` string;;;;\n-\
    \ Then the the code inside the ``` (i.e., anywhere within its curly brackets):\n\
    \  `number = 1;`\n- This code sets the variable `number` to `1`; this variable\
    \ was declared at the start of the script, as a member variable and it can be\
    \ accessed from anywhere within the class `MyFirstScript`.\n- Then, we can declare\
    \ a `String variable` `myName`.\n- Type the following code just after the declaration:\n\
    \  `private string myName;`\n- As you type this line, make sure that the name\
    \ of the variable is spelt properly with proper case (i.e., upper-case `N`).\n\
    - Then type the following code inside the `Start` method (you can replace the\
    \ word `Patrick` with your own name):\n  `myName = \"Patrick\";`\n- Then type\
    \ the following code after the previous statement to display a message in the\
    \ Console window:\n  `print (\"Hello\" + myName + \"Your number is \"+number);`\n\
    - This should print the message `Hello Patrick Your number is 1` in the Console\
    \ window in Unity. This window displays error messages from Unity or messages\
    \ from the code. You may notice the quotes around the word `Patrick`, this means\
    \ that the text `Hello` will be displayed and we will add the value of the variable\
    \ `myName` to it. So these two strings are concatenated (i.e., grouped) to form\
    \ a dynamic sentence for which the content will depend on the value of the variables\
    \ `myName` and `number`.\n\nSo at this stage, your code should look as follows\
    \ (and if it doesn’t, you can use the next code snippet as a template):\n\n```csharp\n\
    using UnityEngine;\nusing System.Collections;\n\npublic class MyFirstScript :\
    \ MonoBehaviour\n{\n    // Use this for initialization\n    private int number;\n\
    \    private string name;\n\n    void Start ()\n    {\n        number = 1;\n \
    \       myName = \"Patrick\";\n        print (\"Hello\" + myName + \"Your number\
    \ is \"+number);\n    }\n\n    // Update is called once per frame\n    void Update\
    \ ()\n    {\n    }\n}\n```\n\n- At this stage, we can save our script (`CTRL +\
    \ S`) and go back to Unity (`ALT + TAB`).\n- In Unity, drag and drop the script\
    \ `MyFirstScript` onto the empty object `example_for_scripting`, as illustrated\
    \ on the next figure.\n\n![](Image00002.jpg)\nFigure 2‑3: Linking the script to\
    \ an object\n\n- After this, if you click on the object `example_for_scripting`\
    \ in the hierarchy, you should now see in the Inspector window that the script\
    \ has become a component of this object.\n"
  raw: '•         Built-in functions are spelt with the proper case (e.g., upper-case
    U for Update ).


    •         Use camel casing (i.e., capitalize the first character of each word
    except for the first word) or Pascal casing (i.e., capitalize the first character
    of each word) consistently.


    •         All statements are ended with a semi-colon.


    •         For if statements the condition is within round brackets.


    •         For if statements the condition uses the syntax “== “ rather than “
    = “.


    •         When calling a method, the exact name of this method (i.e., case-sensitive)
    is used.


    •         When referring to a variable, it is done with regards to the access
    type of the variable (e.g., public or private).


    •         Local variables are declared and can be used within the same method.


    •         Global variables are declared outside methods and can be used anywhere
    within the class.


    # 2  Creating your First Script


    In this section we will start to code C# scripts in Unity. Some of the objectives
    of this section will be to:


    *   Introduce C# scripting in Unity.


    *   Explain some basic scripting concepts.


    *   Explain how to display information from the code to the Console window.


    After completing this chapter you will be able to:


    *   Understand basic concepts in C#.


    *   Understand best coding practices.


    *   Code your first script in Unity.


    *   Create classes, methods and variables.


    *   Instantiate objects based on your own classes.


    *   Use built-in methods.


    *   Use conditional statements.


    You can skip this chapter if you are already familiar with C#, or if you have
    already created and used C# scripts within Unity.


    Getting started


    In Unity, a script (C# script) is usually linked to an object; although it can
    also be used as a standalone class to be instantiated at a later stage; generally,
    for your script to be executed, it will need to be linked to an object. So to
    start with, we will create an empty object, create a script, and link this script
    to the object.


    *   Please launch Unity.


    *   Create a new Project ( File | New Project ).


    *   Create a new scene ( File | New Scene ).


    *   Create an empty object ( GameObject | Create Empty ).


    *   Rename this object: example_for_scripting in the Hierarchy window. To do so,
    you can either right-click on this object and then select the option Rename ,
    from the contextual menu, or select the object (i.e., click once on it) and press
    CTRL + Enter .


    *   You will notice, looking at the Inspector window, that this object has only
    one component ( Transform ).


    Let’s create a new script:


    *   In the Project window, click once on the Assets folder.


    *   Create a new folder to store the scripts (this is not compulsory but it will
    help to organize your scripts): Select Create | Folder .


    ![](Image00000.jpg)


    Figure 2‑1: Creating a new folder


    *   This will create a new folder labeled Folder .


    *   Rename this folder Scripts .


    *   Double click on this folder to display its content and so that the script
    that we are about to create is added to this folder.


    *   In the Project window, select Create | C# Script .


    *   This should create a new C# script.


      ![](Image00001.jpg)


    Figure 2‑2: Creating a new C# script


    *   By default, this script will be named NewBehaviourScript . However, the name
    will be highlighted in blue so that you modify the name before the content of
    the script is created. Please rename this script MyFirstScript .


    Note that the name of the script should always match the name of the main class
    within the script; so if you want to rename this script later on, you will also
    need to modify the name of the main class within the script.


    *   Click once on the script; as you do so, look at the Inspector window, and
    you will see the content of the script. By default, you will notice that it includes
    a definition for the class MyFirstScript , namespaces, as well as two different
    member methods Start and Update .


    *   Double-click on the script (within the Project window), this will open the
    script in Visual Studio , which is the default editor for Unity.


    Note that you can change to the editor of your choice (e.g., Notepad++ or Sublime).
    This can be done by changing Unity’s preferences ( Edit | Preferences | External
    Tool ). This being said, while Visual Studio provides code auto completion by
    default, this may not be the case for other code editors (e.g., with Sublime,
    you need to install a specific package).


    *   As the script is opened in Visual Studio we can see it in more detail. Again,
    the Start method is called at the start of the scene, once. The method Update
    is called every time the screen is refreshed (every frame).


    *   These functions are case-sensitive; because they are built-in functions (i.e.,
    functions made available by Unity for your use), Unity is expecting them to be
    spelt with the exact spelling and case; otherwise, it will assume that the method
    that you write serves a different purpose (i.e., we will come back to this type
    of error later-on).


    So let’s start coding.


    *   First let’s create a variable of type integer called number as a private member
    variable.


    *   Type the following code just before the method Start :


    private int number;


    *   As you can see, the variable is declared outside any method but inside the
    class MyFirstScript , which means that it is a member variable.  The access modifier
    private specifies that the variable is accessible only by the class MyFirstScript
    .


    *   Then, we can declare a String variable called myName . Type the following
    code just after the previous declaration.


    private string myName;


    *   Then type the following code inside the method Start (i.e., anywhere within
    its curly brackets).


    number = 1;


    *   This code sets the variable number to 1; this variable was declared at the
    start of the script, as a member variable and it can be accessed from anywhere
    within the class MyFirstScript , including from inside the method Start .


    *   Then type the following code inside the method Start after the previous statement
    (you can replace the word Patrick with your own name if you wish):


    myName = “Patrick”;


    *   As you type this line, make sure that the name of the variable is spelt properly
    with proper case (i.e., upper-case N ).


    *   Then type the following code after the previous statement to display a message
    in the Console window.


    print ("Hello" + myName + "Your number is "+number);


    *   This should print the message “Hello Patrick Your number is 1” in the Console
    window in Unity. This window displays error messages from Unity or messages from
    the code. You may notice the quotes around the word Patrick , this means that
    the text Hello will be displayed and we will add the value of the variable myName
    to it. So these two strings will be concatenated (i.e., grouped) to form a dynamic
    sentence for which the content will depend on the value of the variables myMame
    and number .


    So at this stage, your code should look as follows (and if it doesn’t, you can
    use the next code snippet as a template):


    using UnityEngine;


    using System.Collections;


    public class MyFirstScript : MonoBehaviour


    {


    // Use this for initialization


    private int number;


    private string name;


    void Start ()


    {


    number = 1;


    myName = "Patrick";


    print ("Hello"+ myName + “Your number is ”+number);


    }


    // Update is called once per frame


    void Update ()


    {


    }


    }


    *   At this stage, we can save our script ( CTRL + S ) and go back to Unity (
    ALT + TAB ).


    *   In Unity, drag and drop the script MyFirstScript onto the empty object example_for_scripting
    , as illustrated on the next figure.


      ![](Image00002.jpg)


    Figure 2‑3: Linking the script to an object


    *   After this, if you click on the object example_for_scripting in the hierarchy,
    you should now see in the Inspector window that the script has become a component
    of this object.'
