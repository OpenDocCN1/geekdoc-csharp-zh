    Events


    Throughout this book and in C#, you will read about and use events. So what are
    they?


    Well, put simply, events can be compared to something that happens at a particular
    time, and when this event occurs, something (e.g., an action) needs to be done.
    If we make an analogy with daily activities: when the alarm goes off (event) we
    can either get-up (action) or decide to go back to sleep. When you receive an
    email (event), you can decide to read it (action), and then reply to the sender
    (another action).


    In computer terms, it is quite similar, although the events that we will be dealing
    with will be slightly different. So, we could be waiting for the user to press
    a key (event) and then move the character accordingly (action), or wait until
    the user clicks on a button on screen (event) to load a new scene (action).


    In Unity, whenever an event occurs, a function (or method) is usually called (the
    function, in this case, is often referred as a handler, because it “handles” the
    event). You have then the opportunity to modify this function and add instructions
    (i.e. statements) that should be followed, should this event occur.


    To take the analogy of daily activities: we could write instructions to a friend
    on a piece of paper, so that, in case someone calls in our absence, the friend
    knows exactly what to do. So an event handler is basically a set of instructions
    (usually stored within a function) to be followed in case a particular event occurs.


    Sometimes information is passed to this method about the particular event, and
    sometimes not. For example, when the screen is refreshed the method Update is
    called. When the game starts (i.e., when a particular script is enabled), the
    method Start is called. When there is a collision between the player and an object,
    the method OnControllerColliderHit is called. In this particular case (i.e., collision),
    an object is usually passed to the method that handles the event so that we get
    to know more about the other object involved in the collision.


    As you can see, there can be a wide range of events in our game, and we will get
    to that later on. In this book, we will essentially be dealing with the following
    events:


    *   Start : when a script is enabled (e.g., start of the scene).


    *   Update : when the screen is refreshed (e.g., every frame).


    *   OnControllerColliderHit : when a collision occurs between the player and another
    object.


    *   Awake : when the game starts (i.e., once).


    Polymorphism (general concepts)


    The word polymorphism takes its meaning from poly (several) and morph (shape);
    so it literally means several forms. In object-oriented programming, it refers
    to the ability to process objects differently (or more specifically) depending
    on their data type or class. Let’s take the example of adding. If we want to add
    two numbers, we will make an algebraic addition (e.g., 1 + 2). However, adding
    two string variables may mean concatenating them (adding them one after the other).
    For example, adding the text “Hello” and the text “World” would result in the
    text “ HelloWorld ”. As you can see, the way an operation is performed on different
    data types may vary and produce different results. So again, with polymorphism
    we will be able to customize methods (or operations) so that data is processed
    based on its type of class. So, let’s look at the following code which illustrates
    how this can be done in C#.


    public class AddObjects


    {


    public int add (int a, int b)


    {


    return (a + b);


    }


    public string add (string a, string b)


    {


    return (a + b);


    }


    }


    In the previous code, it is possible to add two different types of data: integers
    and strings. Depending on whether two integers or two strings are passed as parameters,
    we will be calling either the first add method or the second add method.


    Dynamic polymorphism


    In C#, dynamic polymorphism can be achieved using both abstract classes and virtual
    functions.


    In C#, it is possible to create a class that will provide a partial implementation
    of an interface. Broadly, an interface defines what a class should include (i.e.,
    member methods, member variables or events), but it does not declare how these
    should be implemented. So, an abstract class will include abstract methods or
    variables; which means that this class will define the name and type of the variables,
    the name of the methods, as well as the type of data returned by this method.
    It is called abstract because you cannot implement this type of class (it can
    never be “materialized”); however, it can be used as a template (or “dream” class)
    for derived classes. Let’s look at the following example.


    abstract class Vehicule


    {


        public abstract void decelerate();


    }


    class Bike : Vehicule


    {


        private float speed;


        private int color;


        public Bike(float newSpeed)


        {


            speed = newSpeed;


        }


        public override void decelerate()


        {


            speed--;


        }


    }


    In the previous code:


    *   We declare an abstract class Vehicle .


    *   We declare an abstract method called decelerate .


    *   We then create a new class called Bike , inherited from the abstract class
    Vehicle, but with its own constructor.


    *   We then override the abstract method decelerate to use our own implementation.


    Using an abstract class just means that we list methods that would be useful for
    the children; however, the children will have to define how the method should
    be implemented.'
