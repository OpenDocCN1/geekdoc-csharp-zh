    ### 4 感谢


    ## 前言

    为了能够帮助像你这样的人，我设计并出版了 8 多本关于 Unity 的书籍；这些书籍非常深入，并确实为与 Unity 相关的广泛主题提供了大量信息，包括 2D/3D
    游戏开发、人工智能、动画等……

    尽管如此，虽然这些书籍是全面的，但许多读者（像你一样）可能只想专注于某个主题并开始学习。

    本书属于“快速指南”（A Quick Guide To）系列，正是如此。在这本名为“ A Quick Guide to `C#` with Unity ”的书中，你将发现如何使用
    Unity 快速开始 `C#` 编程，包括 `C#` 概念以及它们在 Unity 中的应用。


    ## 使用本书所需的条件

    要完成书中介绍的项目，你只需要 Unity 5.0（或更高版本），并确保你的电脑及其操作系统符合 Unity 的要求。可以从官方网站下载 Unity（[`www.unity3d.com/download`](http://www.unity3d.com/download)），在下载之前，你可以在以下页面检查电脑是否符合要求：[`www.unity3d.com/unity/system-requirements`](http://www.unity3d.com/unity/system-requirements)
    。在编写本书时，Unity 支持以下开发的操作系统：Windows XP（即 SP2+）、7 SP1+、Windows 8 以及 Mac OS X 10.6+。显卡方面，2004
    年以后的大多数显卡都适用。

    在计算机技能方面，书中介绍的所有知识都假设读者没有先前的编程经验。因此，现在你只需要能够常见的计算机任务，如下载项目、打开和保存文件，并习惯拖放物品和打字。


    ## 本书适合谁

    如果你对以下问题都回答“是”，那么这本书就适合你：

    1. 你是 `C#` 的初学者吗？

    2. 你想开始 `C#` 并使用 Unity 创建交互游戏吗？

    3. 你想开始创建优秀的 3D 游戏吗？

    4. 虽然你可能已经接触过 Unity，但你想深入了解 `C#` 如何与场景和对象关联吗？


