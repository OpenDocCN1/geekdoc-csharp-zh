    As for JavaScript scripts, your `C#` script may need to be attached to an object.
    This being said, you could also create a class that is not linked to an object
    but that is used indirectly by another class (that could be attached to an object).


    ### How can I check that my script has no errors?


    Open the `Console` window and any error should be displayed here.


    ### What is object-oriented programming?


    In object-oriented programming, your program is seen as a collection of objects
    that interact with each other using, for example, methods.


    ### Should the name of my C# file and the containing class within be the same?


    When you create a new `C#` file, Unity will let you rename it straight-away; once
    this is done, it will automatically generate the name of the class within, using
    the name that you have specified for this file. So, if you happened to change
    the name of this file later on, you may also need to change the name of the class
    within.


    ### Why should I use C#?


    There are several good reasons to start coding in `C#`. One of them is that `C#`
    is an object-oriented programming language that is relatively similar to other
    languages such as `Java`. So by learning `C#` you should be able to transfer this
    knowledge to other languages easily.


    ### What is the dot notation for?


    The dot notation refers to object-oriented programming. Using dots, you can access
    properties and functions (or methods) related to a particular object. For example,
    `gameObject.transform.position` gives you access to the position from the `transform`
    of the object linked to a script. It is often useful to read it backward; in this
    case, the dot can be interpreted as “of”. So in our case, `gameObject.transform.position`
    can be translated as “the position of the transform of the `gameObject`”.


    # 4 Thank you


    ![](Image00009.jpg)


    I would like to thank you for completing this book;


    At this stage, you are probably comfortable with `C#` scripts within Unity. Although
    we only touched on basic features for `C#` in Unity, you can see how powerful
    `C#` can be to create great games.


    ### So what''s next for you...?


    Completing this book is only the first step in your game programming journey;
    while you are probably comfortable with `C#` scripts, you now need to add interaction
    to your scenes; for example, any game that you create will need to feature a score,
    player''s health, the ability to collect objects, or to change scenes. These features
    are relatively basic for a game, although when they are combined properly, they
    can give the rise to very entertaining games; this being said, to be able to implement
    them, you need to learn more `C#`, and more specifically, how to use `C#` with
    Unity.


    Now `C#` and object-oriented programming can be perceived as difficult; however,
    when you have the right approach and timing, this can be done easily.


    And this is exactly what I have done in the book called “Unity from Zero to Proficiency
    (Beginner)”;


    *   Chapter 1 gives an introduction to `C#` and to core principles that will help
    you to get started with coding. You will learn key programming concepts such as
    variables, variable types, or functions.

    *   Chapter 2 helps you to code your first script. You will learn how to code
    following best coding practices, debug your code, and also avoid common errors.

    *   Chapter 3 gets you to improve your scripting skills, enhance your game and
    add more interaction. You will learn to implement a scoring system, to detect
    collisions, and to load new levels.

    *   Chapter 4 explains how you can create and update a user interface for your
    game (e.g., displaying images and messages onscreen) using scripting.

    *   Chapter 5 explains how you can polish-up your game. You will add a splash-screen,
    a simple inventory system, sound effects, as well as a mini-map.

    *   Chapter 6 explains how to add Non-Player Characters (NPCs) with Artificial
    Intelligence (AI). You will configure each NPC and get them to either follow the
    player or walk along a simple path of your choice, and also detect collision with
    them.

    *   Chapter 7 explains how to create a word-guessing game using Unity''s 2D features.
    You will use arrays, and read files to create a list from which a random word
    will be picked and that the user will have to guess. You will also learn to detect
    and process the user''s key entries.

    *   Chapter 8 will show you how you can create some other 2D features offered
    by Unity to create an entertaining infinite runner where the player can control
    a character that needs to jump over randomly generated obstacles.

    *   Chapter 9 provides answers to Frequently Asked Questions (FAQs) (e.g., scripting,
    audio, AI, or user interface).


    This book was created so that you could get started with `C#` quickly and also
    use it to create your first interactive game; it includes a lot of step-by-step
    tutorials that you will be able to use to create your own games; and if you have
    enjoyed this book, then Unity from Zero to Proficiency (Beginner), the next logical
    step in your journey, uses the same format and structure (e.g., step-by-step instructions,
    plenty screenshots and examples, quizzes, and challenges).


    So, if you are serious about learning how to create games with Unity, you really
    need Unity from Zero to Proficiency (Beginner). It will take you painlessly through
    the process of learning `C#` basics, and creating an adventure game where the
    player has to escape a maze, find petrol cans, and use them to escape the island
    with a plane. You will, of course, be able to change this scenario, if you want;
    in fact, the skills that you will learn in this book will help you to create many
    games in the same genre, because it will give you the skills to implement some
    of the following features: a score, a timer, a user interface with text of images,
    a simple inventory system, collect objects, the ability to load new scenes based
    on the objects collected, or activate/deactivate some objects in the scene.


    This is the next step on your game programming journey so, don''t procrastinate,
    order Unity from Zero to Proficiency (Beginner) now, and I will be there to help
    you create awesome games.


    To thank you for reading this book, you can download the pdf version of “ Unity
    from Zero to Proficiency (Beginner) ” with a 70% discount by opening this link:
    tiny.cc/beginner30

    '
