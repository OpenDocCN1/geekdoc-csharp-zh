  trans: "\n\n- 内置函数的拼写需要区分大小写（例如，`Update` 使用大写的 `U`）。\n- 始终统一使用驼峰命名法（即：除第一个单词外，每个单词的首字母均大写）或帕斯卡命名法（即：每个单词的首字母均大写）。\n\
    - 所有语句均以分号结尾。\n- 对于 `if` 语句，条件位于圆括号内。\n- 对于 `if` 语句，条件使用语法 `==` 而不是 `=`。\n- 在调用方法时，使用该方法的精确名称（即：区分大小写）。\n\
    - 引用变量时，应根据变量的访问类型（例如 `public` 或 `private`）进行。\n- 局部变量在同一个方法内声明并可以在该方法中使用。\n-\
    \ 全局变量在方法外部声明，并可以在类的任意任何地方使用。\n\n# 2 创建你的第一个脚本\n\n在本节中，我们将开始在 Unity 中编写 C# 脚本。本节的一些目标将是：\n\
    \n- 介绍 Unity 中的 C# 脚本编写。\n- 解释一些基础脚本概念。\n- 解释如何将代码中的信息显示到控制台（Console）窗口。\n\n完成本章后，你将能够：\n\
    \n- 理解 C# 的基本概念。\n- 理解最佳编码实践。\n- 在 Unity 中编写你的第一个脚本。\n- 创建类、方法和变量。\n- 根据你自己的类实例化对象。\n\
    - 使用内置方法。\n- 使用条件语句。\n\n如果你已经熟悉 C#，或者你已经在 Unity 中创建并使用过 C# 脚本，可以跳过本章。\n\n## 起始\n\
    \n在 Unity 中，脚本（C# 脚本）通常链接到一个对象；尽管它也可以作为一个独立的类在稍后的阶段实例化；通常情况下，为了执行你的脚本，它需要链接到一个对象。因此，我们首先创建一个空对象，创建一个脚本，并将此脚本链接到该对象。\n\
    \n- 请启动 Unity。\n- 创建新项目（`File | New Project`）。\n- 创建新场景（`File | New Scene`）。\n\
    - 创建一个空对象（`GameObject | Create Empty`）。\n- 在层级（Hierarchy）窗口中重命名此对象：`example_for_scripting`。你可以通过右键点击此对象并从右键菜单中选择\
    \ `Rename` 选项，或者选择该对象（即点击一下）并按 `CTRL + Enter`。\n- 你会查看检查器（Inspector）窗口发现此对象只有一个组件（`Transform`）。\n\
    \n### 让我们创建一个新脚本\n\n- 在项目（Project）窗口中，点击一次 `Assets` 文件夹。\n- 创建一个新文件夹来存储脚本（这不是强制的，但有助于组织你的脚本）：选择\
    \ `Create | Folder`。\n\n![](img/Image00000.jpg)\n图 2‑1：创建一个新文件夹\n\n- 这将创建一个名为\
    \ `Folder` 的新文件夹。\n- 将此文件夹重命名为 `Scripts`。\n- 双击此文件夹显示其内容，以便我们即将创建的脚本被添加到此文件夹。\n\
    - 在项目（Project）窗口中，选择 `Create | C# Script`。\n- 这应该创建一个新的 C# 脚本。\n\n![](img/Image00001.jpg)\n\
    图 2‑2：创建一个新的 C# 脚本\n\n- 默认，此脚本将命名为 `NewBehaviourScript`。但名称将以蓝色突出，以便你在脚本内容创建之前修改名称。请将此脚本重命名为\
    \ `MyFirstScript`。\n\n注意，脚本的名称应与脚本内主类的名称匹配；因此，如果你以后想重命名此脚本，也需要修改脚本内主类的名称。\n\n\
    - 点击一次脚本；在此期间，查看检查器（Inspector）窗口，你将看到脚本的内容。默认情况下，你会注意到它包含了类 `MyFirstScript` 的定义、命名空间（namespaces），以及两个不同的成员方法\
    \ `Start` 和 `Update`。\n- 在项目（Project）窗口中双击脚本，将在 `Visual Studio` 中打开脚本，它是 Unity\
    \ 的默认编辑器。\n\n注意，你可以更改你喜爱的编辑器（例如 `Notepad++` 或 `Sublime`）。这可以通过更改 Unity 的偏好设置（`Edit\
    \ | Preferences | External Tool`）来实现。话虽如此，虽然 `Visual Studio` 默认提供了代码自动补全，但其他代码编辑器可能并非如此（例如，使用\
    \ `Sublime` 时你需要安装特定的包）。\n\n- 当脚本在 `Visual Studio` 中打开时，我们可以更详细地查看它。同样，`Start`\
    \ 方法在场景开始时被调用一次。`Update` 方法在每次屏幕刷新时（每一帧）被调用。\n- 这些函数是区分大小写的；因为它们是内置函数（即 Unity\
    \ 供你使用的函数），Unity 期望它们具有精确的拼写。\n\n- 那么，让我们开始编码吧。\n- 首先，创建一个 `integer` 类型的变量作为 `private`\
    \ 成员变量。\n- 在 `Start` 之前输入以下代码：\n  `private int number;`\n- 如你所见，该变量声明在任何方法之外但在\
    \ `MyFirstScript` 类内部，这意味着它是一个成员变量。访问修饰符 `private` 指定该变量仅供 `MyScript` 类访问。我们可以声明一个\
    \ `String 变量`。\n- 以下代码仅为声明：\n    `string stringName;`\n- 然后在花括号内（即：在任何地方）编写代码：\n\
    \  `number = 1;`\n- 此代码将变量 `number` 设置为 `1`；该变量是在脚本开始时声明的，作为成员变量，并可以在 `MyFirstScript`\
    \ 类中的任何地方访问。\n- 然后，我们可以声明一个 `String 变量` `myName`。\n- 输入这行代码时，确保变量名称拼写正确（例如：大写的\
    \ `N`）。\n- 然后在 `Start` 方法内部输入以下代码（你可以用自己的名字替换 `Patrick`）：\n  `myName = \"Patrick\"\
    ;`\n- 然后在上一语句之后输入以下代码以便在控制窗口显示消息：\n  `print (\"Hello\" + myName + \"Your number\
    \ is \"+number);`\n- 这会在 Unity 的控制窗口打印 `Hello Patrick Your number is 1`。此窗口显示来自\
    \ Unity 的错误消息或来自代码的消息。你可能会注意到 `Patrick` 周围有引号，这意味着将显示 `Hello`，我们将变量 `myName` 的值添加到它。因此，这两个字符串被拼接（即：组合在一起）形成一个动态句子，其内容取决于变量\
    \ `myName` 和 `number` 的值。\n\n在在此阶段，你的代码应该如下（如果不是，你可以使用下一个代码段作为模板）：\n\n```csharp\n\
    using UnityEngine;\nusing System.Collections;\n\npublic class MyFirstScript :\
    \ MonoBehaviour\n{\n    // 使用此初始化\n    private int number;\n    private string\
    \ myName;\n\n    void Start ()\n    {\n        number = 1;\n        myName = \"\
    Patrick\";\n        print (\"Hello\" + myName + \"Your number is \"+number);\n\
    \    }\n\n    // Update 每帧调用一次\n    void Update ()\n    {\n    }\n}\n```\n\n-\
    \ 在此阶段，我们可以保存脚本（`CTRL + S`）并返回 Unity（`ALT + TAB`）。\n- 在 Unity 中，将脚本 `MyFirstScript`\
    \ 拖放到空对象 `example_for_scripting` 上，如下图所示。\n\n![](img/Image00002.jpg)\n图 2‑3：将脚本链接到对象\n\
    \n- 之后，如果你点击层级中的对象 `example_for_scripting`，你现在应该在检查器窗口中看到脚本已成为该对象的组件。\n\n"
- fmt: '

    - Look at the Console window to see if there are any errors; the window should
    be empty (i.e., no errors). If there are any warnings, you can leave them for
    the time being (it won’t stop the scene from playing).

    - We can now play the scene (`CTRL + P`); as we play the scene and look at the
    Console window (`SHIFT + CTRL + C`), we should see the message “ Hello Patrickyour
    number is 1 ”.


    ![](Image00003.jpg)


    Figure 2‑4: Displaying a message in the Console window - part 1


    - You may notice a missing space between the words `Patrick` and `you`, and we
    can correct this accordingly. To do so, we can go back to your code editor (e.g.,
    `Visual Studio`) to modify the script and add spaces as follows (after the words
    `Hello` and `is`, and before the word `your`):


    ```

    print(“Hello ” + myName + “ your number is ”+number);

    ```


    As we go back to Unity, we can clear the Console window by clicking on the tab
    called `Clear`, as highlighted on the next figure. However, so that the Console
    window is cleared every time we run the scene, we can also click on the tab labeled
    `Clear on Play`. This ensures that the Console window is cleared every time the
    scene is played, avoiding cluttering the Console window with messages that may
    be obsolete or irrelevant.


    - As we play the scene, we can see that the message has been modified to include
    a space between the words `Patrick` and `your`.


    ![](Image00004.jpg)


    Figure 2‑5: Displaying a message in the console window - part 2


    This is it! We have created our first script using the built-in method `Start`
    and some variables, more specifically global variables. These variables are of
    type `integer` and `String`. Again, these variables are global as they were declared
    at the start of the script and outside any method. They can, as a result, be used
    across the script. The full script should look as described on the next code snippet.


    ```csharp

    using UnityEngine;


    using System.Collections;


    public class MyFirstScript : MonoBehaviour

    {


    // Use this for initialization


    private int number;


    private string myName;


    void Start ()

    {

    number = 1;

    myName = "Patrick";

    print("Hello "+ myName + "Your number is " +number);

    }


    // Update is called once per frame


    void Update ()

    {


    }


    }

    ```


    ### Using the Update Function


    Let’s now use the method `Update` to display another message in the Console window.
    Again, this method is called every frame (i.e., every time the screen is refreshed),
    so any message printed within this method will be displayed indefinitely and every
    frame.


    - Switch to Unity.

    - Double click on the script `MyFirstScript` to open it.

    - In `Visual Studio` (or any other code editor of your choice), type the following
    code within the curly brackets of the method `Update`:


    ```cs

    print (myName);

    ```

    - Save your code (`CTRL + S` or `APPLE + S` for Mac users).

    - Switch to Unity and play the scene (`CTRL + P`).

    - You should see that the message `Patrick` (or your own name) is displayed indefinitely.
    In the next figure, we can see that the message is displayed 148 times after a
    few seconds.


    ![](Image00005.jpg)


    Figure 2‑6: Using the "Collapse" option – part 1


    - So the code is working well; however, because the message is displayed so many
    times, we have lost sight of the first message displayed from the `Start` function.
    This is because the console is flooded by hundreds of identical messages, and
    we could, to clear up the console, click on the tab labeled `Collapse` within
    the Console window.


    The `Collapse` option ensures that identical messages are displayed only once,
    along with a number that indicates how many times they have been listed.

    - If we stop the game, press the `Collapse` option, and play the scene again,
    the Console window should look as described in the following figure.


    ![](Image00006.jpg)


    Figure 2‑7: Using the "Collapse" option - part 2


    - As we can see, the message from the `Start` method is displayed (once), whereas
    the message from the `Update` method is displayed once but the consoles indicates
    that it has been issued 223 times.


    ### Creating local variables


    At this stage, the code is working well, and we have created two member variables:
    `number` and `myName`. These two variables are accessible throughout our class;
    however, to experiment with local variables, we could also create variables that
    are only accessible from one method. So let’s experiment.


    - Switch back to your code editor (e.g., `Visual Studio`).

    - Delete or comment the code we have just created in the `Update` function. To
    comment code, you can use double forward slashes, as described in the next code
    snippet.


    ```cs

    //print (myName);

    ```

    - Add the following code to the method `Start`, just before the closing bracket
    for this function.


    ```cs

    int localVariable = 3;

    print(“local variable: "+localVariable);

    ```


    With the first statement, we declare a variable that should only be used locally,
    that is to say, within the method `Start`. We then print the value of this variable
    and display a message that includes the string “local variable” that will be followed
    by (or appended to) the value of the variable `localVariable`; in our case, this
    should display “local variable: 3”.


    - Check the code that you have written and ensure that it is correct (e.g., semi-colon
    at the end of each line).

    - Save your script.

    - Switch back to Unity and play the scene.

    - As we play the scene, the Console window should look like the following:


    ![](Image00007.jpg)


    Figure 2‑8: Displaying a local variable in the Console window


    - We can see the first message from the `Start` method along with the second message
    that we have just created. Then the message from the `Update` method is displayed
    (55 times at this stage).

    - Now, just to demonstrate the importance of variable scope, we will make an error
    on purpose; we will try to use the variable `localVariable` (which is a local
    variable) outside the method `Start`, where it has been declared. As you may have
    guessed, this should trigger an error.


    - Switch back to `Visual Studio`.

    - Type or copy and paste the following code inside the method `Update`.


    ```cs

    print(“local variable: ”+localVariable);

    ```

    - Save your script (`CTRL + S`).

    - Switch back to Unity. Before you try to play the scene, you will notice an error
    in the Console window as follows.


    ![](Image00008.jpg)


    Figure 2‑9: Generating an error on purpose


    By displaying this message, Unity is telling us that it does not recognize the
    variable `localVariable` in the context where it is being used. This is because
    it was declared locally in the `Start` method and then used outside this method.
    So if you see similar messages as you code your game, always check the scope of
    your variable. This should save you some headaches.


    - Switch back to your code editor and comment or delete the line we just created
    in the `Update` method.


    ```cs

    //print(“local variable ”+localVariable);

    ```


    In C# you can comment a line of code by adding `//` to the start of the line.
    This means that the code will be part of the script, but it will not be executed.


    ### Creating a simple counter


    Let’s create a simple counter to practice declaring and assigning values to variables.
    This timer will just count from 0 onwards and use a variable for which the value
    will be increased overtime (i.e., every frame).


    - Switch back to Unity by pressing `ALT + Tab` (or `CMD + Tab` for Mac users).


    As you will have to switch from Unity to `Visual Studio` (or another code editor)
    a couple of times during development, you can use this shortcut to do so, and
    it will save you a good bit of time. Imagine saving three seconds 300 times a
    day! So by pressing `ALT + Tab` (or `APPLE + Tab` on a Mac computer) you can switch
    back to the previous window (or the application that you were using). By keeping
    `ALT` pressed and then successively pressing the tab key several times, you can
    see and select the applications that are currently running on your computer.

