    Constants


    So far we have looked at variables and how you can store and access them seamlessly.
    The assumption then was that a value may change over time, and that this value
    would be stored in a variable. However, there may be times when you know that
    a value will remain constant. For example, you may want to define labels that
    refer to values that should not change over time, and in this case, you could
    use constants. Let me explain: let’s say that the player may have three choices
    in the game (e.g., referred to as 0, 1, and 2) and that you don’t really want
    to remember these values, or that you would like to use a way that makes it easier
    to refer to them. Let’s look at the following code:


    int userChoice = 2;


    if (userChoice == 0) print (“you have decided to restart”);


    if (userChoice == 1) print (“you have decided to stop the game”);


    if (userChoice == 2) print (“you have decided to pause the game”);


    In the previous code:


    *   The variable userChoice is an integer and is set to 1.


    *   Then we check its value and print a message accordingly.


    Now, you may or may not remember that 0 corresponds to restarting the game; the
    same applies to the other two values. So instead, we could use constants to make
    it easier to remember (and use) these values. Let’s look at the equivalent code
    that uses constants.


    const int CHOICE_RESTART = 0;


    const int CHOICE_STOP = 1;


    const int CHOICE_PAUSE = 2;


    int userChoice = 2;


    if (userChoice == CHOICE_RESTART) print (“you have decided to restart”);


    if (userChoice == CHOICE_STOP) print (“you have decided to stop the game”);


    if (userChoice == CHOICE_PAUSE) print (“you have decided to pause the game”);


     In the previous code:


    *   We declare three constant variables.


    *   These variables are then used to check the choice made by the user.


    In the next example, we use a constant to calculate a tax rate; this is a good
    practice as the same value will be used across the programme with no or little
    room for errors when it comes to using the exact same tax rate across the code.


    const float VAT_RATE = 0.21f;


    float priceBeforeVat = 23.0f


    float priceAfterVat = pricebeforeVat * VAT_RATE;


    In the previous code:


    *   We declare a constant float variable for the vat rate.


    *   We declare a float variable for the item’s price before the vat.


    *   We calculate the item’s price after adding tax.


    It is a very good coding practice to use constants for values that don’t change
    across your programmme. Using constants makes your code more readable; it saves
    work when you need to change a value in your code, and it also decreases possible
    occurrences of errors (e.g., for calculations).


    Operators


    Once we have declared and assigned values to a variable, we can use operators
    to modify or combine variables. There are different types of operators including:
    arithmetic operators, assignment operators, comparison operators and logical operators.


    Arithmetic operators are used to perform arithmetic operations including additions,
    subtractions, multiplications, or divisions. Common arithmetic operators include
    + , - , * , / , or % (modulo).


    int number1 = 1;// the variable number1 is declared


    int number2 = 1;// the variable number2 is declared


    int sum = number1 + number2;// adding two numbers and store them in sum


    int sub = number1 - number2;// subtracting two numbers and store them in sub


    Assignment operators can be used to assign a value to a variable and include =
    , += , -= , *= , /= or %= .


    int number1 = 1;


    int number2 = 1;


    number1+=1; //same as number1 = number1 + 1;


    number1-=1; //same as number1 = number1 - 1;


    number1*=1; //same as number1 = number1 * 1;


    number1/=1; //same as number1 = number1 / 1;


    number1%=1; //same as number1 = number1 % 1;


    Note that the = operator, when used with strings, will concatenate strings (i.e.,
    add them one after the other to create a new string). When used with a number
    and a string, the same will apply (for example “Hello”+1 will result in “ Hello1
    ”).


    Comparison operators are often used for conditions to compare two values; comparison
    operators include ==, != , > , < , >= and >= .


    if (number1 == number2); //if number1 equals number2


    if (number1 != number2); //if number1 and number2 have different values


    if (number1 > number2); //if number1 is greater than number2


    if (number1 >= number2); //if number1 is greater than or equal to number2


    if (number1 < number2); //if number1 is less than number2


    if (number1 <= number2); //if number1 is less than or equal to number2


