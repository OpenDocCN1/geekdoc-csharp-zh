    # 1 C# 编程入门介绍


    在本节中，我们将发现 `C#` 编程原理和概念，以便你能在下一章节中开始编程。如果你已经使用 `C#`（或类似的语言）编写过代码，可以跳过本章。


    完成本章后，你将能够：


    * 理解为什么需要考虑 `C#`。

    * 在编写 `C#` 代码时，理解面向对象编程 (`OOP`) ) 概念。

    * 熟悉并理解变量、方法和作用域的概念。

    * 理解编码的关键最佳实践，特别是在 `C#` 中。

    * 理解条件语句和决策结构。

    * 理解循环的概念。


    ## 引言


    在 `Unity` 中编写脚本时，你正在与游戏引擎通信，并要求它执行操作。为了与系统通信，你正在使用一种由计算机和你共同理解的语法约束的语言或单词集。这种语言由关键字、关键短语以及确保指令被正确理解的语法组成。在计算机科学中，这句话必须是准确、精确、无歧义且具有正确的语法。换句话说，它必须是准确的。语法是在编写
    `C#`（如同编写 `JavaScript` 时）时需要遵循的一组规则。除了语法之外，`C#` 编程还使用类；因此，你的脚本将以类的形式保存。


    在下一节中，我们将学习如何使用这种语法。如果你已经用 `JavaScript` 编写过代码，本章其余部分提供的信息可能看起来很熟悉，这种对 `JavaScript`
    的先前接触绝对对你有帮助。尽管如此，`JavaScript` 和 `C#` 虽然在某些相对相似之处，但在许多方面是非常不同的（例如，变量声明、函数声明等）。


    在 `C#` 中编写脚本时，你将使用以下内容的组合：


    * 类。

    * 对象。

    * 语句。

    * 注释。

    * 变量。

    * 常量。

    * 运算符。

    * 赋值。

    * 数据类型。

    * 方法。

    * 决策结构。

    * 循环。

    * 继承（高级内容）。

    * 多态（高级内容）。

    * 运算符重载（高级内容）。

    * 接口。

    * 命名空间。

    * 事件。

    * 比较。

    * 类型转换。

    * 留字。

    * 向控制台窗口的消息。

    * 声明。

    * 方法调用。


    这个列表看起来可能有点令人生畏，但不用担心，我们将在后续章节中探索这些内容，你将通过实操示例顺练地熟悉并使用它们。


    ## 语句


    当你编写一段 `C#` 代码时，你需要使用语句告诉系统执行你的指令（例如，打印信息）。语句字面意思是是一条命令或你要求系统执行的操作。例如，在下一行代码中，语句将告诉
    `Unity` 在控制台窗口打印一条消息：


    ```c

    print ("Hello Word");

    ```


    在编写语句时，有几个规则你需要知道：


    * 语句的顺序：每个语句按照它们在脚本中出现的顺序进行执行。例如，在下一个示例中，代码将先打印 hello，然后是 world；这是因为相关的语句按该顺序排列。

    ```c

    print ("hello");

    print ("world");

    ```

    * 语句之间用分号分隔（即每条语句末尾都有分号）。注意，多个语句可以放在同一行，只要它们用分号隔开。

    ```c

    print ("hello");print ("world");

    ```

    * 语句中的多个空格会被忽略；然而，在运算符 `+`、`-`、`/` 等符号周围添加空格是良好的习惯。例如，在下一个示例中，我们说 `a` 等于 `b`。在运算符
    `=` 前后都有空格。

    ```c

    a = b;

    ```

    * 需要一起执行的语句（例如，基于相同的条件）可以使用通常称为代码块进行分组。在 `C#` 中（如同 `JavaScript`），代码块由大括号符号（例如
    `{` 或 `}`）。换句话说，如果你需要分组多个语句，我们将它们全部包含在同一个括号内，如下：


    ```c

    {

    print ("hello stranger!");

    print ("today, we will learn about scripting");

    }

    ```


    正如我们之前看到的，语句通常采用或带有关键字（即计算机认识的单词）。这些每个关键字都有特定的用途，在本阶段最常用的关键字用于：


    * 在控制台窗口打印消息：关键字是 `print`。

    * 声明变量：关键字取决于变量类型（例如，`int` 用于整数，`string` 用于文本，`bool` 用于布尔变量等），我们将在后续中详细介绍。

    * 声明方法：关键字取决于方法返回的数据类型。例如，在 `C#` 中，当方法返回整数时，方法名之前是关键字 `int`；当方法返回字符串时是 `string`；当方法不返回任何信息时是
    `void`。

    * 根据条件标记一个指令块：关键字是 `if` ... `else`。

    * 退出函数：关键字是 `return`。


    ## 注释


    在 `C#` 中（类似于 `JavaScript`），你可以使用注释来解释代码并提高其可读性。随着代码规模的增加，这变得非常重要；如果你在团队中工作，这同样重要，这样团队成员就可以理解你的代码并在需要的地方进行修改。


