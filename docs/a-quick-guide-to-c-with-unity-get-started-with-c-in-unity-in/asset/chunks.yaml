    # A Quick Guide to C# with Unity


    ## Get Started with C# in Unity in less than 60 minutes.


    Patrick Felicia


    ### A Quick Guide to C# with Unity

    Copyright © 2020 Patrick Felicia

    All rights reserved. No part of this book may be reproduced, stored in retrieval
    systems, or transmitted in any form or by any means, without the prior written
    permission of the publisher (Patrick Felicia), except in the case of brief quotations
    embedded in critical articles or reviews.


    Every effort has been made in the preparation of this book to ensure the accuracy
    of the information presented. However, the information contained in this book
    is sold without warranty, either expressed or implied. Neither the author and
    its dealers and distributors will be held liable for any damages caused or alleged
    to be caused directly or indirectly by this book.


    First published: August 2017

    Second Edition: January 2020

    Published by Patrick Felicia


    ## Credits

    Author: Patrick Felicia


    ## About the Author

    Patrick Felicia is a lecturer and researcher at Waterford Institute of Technology,
    where he teaches and supervises undergraduate and postgraduate students. He obtained
    his MSc in Multimedia Technology in 2003 and PhD in Computer Science in 2009 from
    University College Cork, Ireland. He has published several books and articles
    on the use of video games for educational purposes, including the Handbook of
    Research on Improving Learning and Motivation through Educational Games: Multidisciplinary
    Approaches (published by IGI), and Digital Games in Schools: A Handbook for Teachers,
    published by European Schoolnet. Patrick has published over 10 books on Unity,
    covering several key skills such as `C#` and `JavaScript` in Unity, 3D and 2D
    game development with Unity, as well as 3D Character Animation. Patrick is also
    the Editor-in-chief of the International Journal of Game-Based Learning (IJGBL),
    and the Conference Director of the [Irish Conference on Game-Based Learning](http://igbl-conference.com/),
    a popular conference on games and learning organized throughout Ireland.


    ## Books from the same author

    * **Unity from Zero to Proficiency**: The Series "Unity from Zero to Proficiency"
    includes five books: (1) Foundations, (2) Beginner, (3) Intermediate, (4) Advanced,
    and (5) Proficient. Without this series, most people spend too long trying to
    learn how to use Unity or `C#` the hard way. This book series is the only one
    that will get you to learn Unity and `C#` fast without wasting so much time. Through
    the five books in the series, you will get to learn the `C#` and Unity skills
    that you need to create great games using the format and pace that you need to
    make steady progress and publish your games in no time.

    * **Beginners’ Guides**: The series “Beginners’ Guide” includes four books that
    explain how to create popular 2D games (platformers, infinite runner, shooters,
    puzzles) with Unity. They also show you how to publish your 2D games to the Android
    platform. Along the way, you will also learn how to use `C#` and Unity. They provide
    a complete solution from start to finish as to how to design and create these
    games.


    ## Support and Resources for this Book

    To complete the activities presented in this book and to improve your C#` skills,
    you will need to download the resources pack; it includes:

    * A cheat sheet for Unity (e.g., keyboards shortcuts) to speed up your way around
    Unity.

    * A cheat sheet to help you solve common C#` errors that you will probably make
    when you start with C#. This will save you a lot of time trying to find out how
    to fix bugs.

    * A cheat sheet on best coding practices for C#`; this document will help you
    to structure your code.

    * A free video tutorial on how to quickly master Unity’s interface.


    To download these resources, please do the following:

    * Open the following link: [http://learntocreategames.com/books/](http://learntocreategames.com/books/).

    * Select this book (“ A Quick Guide to C# programming with Unity ”).

    * On the new page, click on the link labelled “ Book Files “, or scroll down to
    the bottom of the page.

    * In the section called “ Download your Free Resource Pack ”, enter your email
    address and your first name, and click on the button labeled “ Yes, I want to
    receive my bonus pack ”.

    * After a few seconds, you should receive a link to your free start-up pack.

    * When you receive the link, you can download all the resources to your computer.


    This book is dedicated to Helena


    ## Table of Contents

    ### 1 Introduction to Programming in C#

    * Why use C# instead of JavaScript

    * Introduction

    * Statements

    * Comments

    * Variables

    * Arrays

    * Constants

    * Operators

    * Conditional statements

    * Switch Statements

    * Loops

    * Classes

    * Defining a class

    * Accessing class members and variables

    * Constructors

    * Destructors

    * Static members of a class

    * Inheritance

    * Methods

    * Accessing methods and access modifiers

    * Common methods

    * Scope of variables

    * Events

    * Polymorphism (general concepts)

    * Dynamic polymorphism

    * Workflow to create a script

    * How scripts are compiled

    * Coding Convention

    * A few things to remember when you create a script (checklist)

    ### 2 Creating your First Script

    * Getting started

    * Creating your first method

    * Creating your own class

    * Common errors and their meaning

    * Best practices

    ### 3 Frequently Asked Questions

    * C# Scripts

    ### 4 Thank you


    ## Preface

    To be able to help people like you, I have designed and published more than 8
    books on Unity; these books are in-depth and really provide a significant amount
    of information on a wide range of topics related to Unity, including 2D/3D game
    development, Artificial Intelligence, Animation, and much more…

    This being said, while these books are comprehensive, many readers, like you,
    may just want to focus on a topic and get started.

    This book is part of a series entitled A Quick Guide To and does just this. In
    this book entitled “ A Quick Guide to `C#` with Unity ” you will discover how
    to quickly get started programming in `C#` with Unity, including `C#` concepts
    and how they apply within Unity.


    ## What you Need to Use this Book

    To complete the project presented in this book, you only need Unity 5.0 (or a
    more recent version) and to also ensure that your computer and its operating system
    comply with Unity’s requirements. Unity can be downloaded from the official website
    ([http://www.unity3d.com/download](http://www.unity3d.com/download)), and before
    downloading, you can check that your computer is up to scratch on the following
    page: [http://www.unity3d.com/unity/system-requirements](http://www.unity3d.com/unity/system-requirements)
    . At the time of writing this book, the following operating systems are supported
    by Unity for development: Windows XP (i.e., SP2+, 7 SP1+), Windows 8, and Mac
    OS X 10.6+. In terms of graphics card, most cards produced after 2004 should be
    suitable.

    In terms of computer skills, all knowledge introduced in this book will assume
    no prior programming experience from the reader. So for now, you only need to
    be able to perform common computer tasks such as downloading items, opening and
    saving files, and be comfortable with dragging and dropping items and typing.


    ## Who this Book is for

    If you can answer yes to all these questions, then this book is for you:

    1. Are you a total beginner in `C#`?

    2. Would you like to get started with `C#` and create interactive games with Unity?

    3. Would you like to start creating great 3D games?

    4. Although you may have had some prior exposure to Unity, would you like to into
    how `C#` can be linked to scenes and objects?

