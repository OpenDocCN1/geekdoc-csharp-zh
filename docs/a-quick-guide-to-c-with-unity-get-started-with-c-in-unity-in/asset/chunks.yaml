    # Unity C# 快速指南


    ## 在不到 60 分钟内开始你的 Unity C# 之之旅


    Patrick Felicia


    ### Unity C# 快速指南

    版权 © 2020 Patrick Felicia

    所有权利保留。未经出版者（Patrick Felicia）事先书面许可，不得以任何形式或通过任何手段复制、存储在检索系统中或传输本书的任何部分，但在批判性文章或评论中嵌入的简短引用除外。


    在编写本书的过程中，我们已尽一切努力确保所提供信息的准确性。然而，书中包含的信息按“现状”出售，不提供任何明示或暗示的保证。作者及其经销商和分销商对因本书直接或间接引起或声称引发的任何损害均不承担责任。


    首次出版：2017 年 8 月

    第二版：2020 年 1 月

    Patrick Felicia 出版


    ## 鸣谢

    作者：Patrick Felicia


    ## 关于作者

    Patrick Felicia 是沃特福德理工学院（Waterford Institute of Technology）的讲师和研究员，在那里负责教学并指导本科生和研究生。他于
    2003 年在爱尔兰科克大学大学获得多媒体技术硕士学位，并于 2009 年获得计算机科学博士学位。他出版了多关于利用视频游戏进行教育的书籍和文章，包括《教育游戏提高学习与动机的研究手册：多学科方法》（IGI
    出版）和《学校中的数字游戏：教师手册》（欧洲 Schoolnet 出版）。Patrick 已出版了 10 多本关于 Unity 的书籍，涵盖了 Unity
    中的 `C#` 和 `JavaScript` 等若干关键技能、Unity 3D 和 2D 游戏开发以及 3D 角色动画。Patrick 还是《国际游戏化学习期刊》(IJGBL）的主编辑，[爱尔兰游戏化学习会议](http://igbl-conference.com/)的会议总，这是一场在全爱尔兰举办的关于游戏与学习的热门会议。


    ## 作者的其他著作

    * **Unity 从零到精通**：“Unity 从零到精通”系列包含五本书：(1) 基础、(2) 入门、(3) 中级、(4) 高级和 (5) 精通。如果没有这个系列，大多数人会花费太多的时间用硬方法学习如何使用
    Unity 或 `C#`。该系列是唯一能让你在不浪费大量时间快速学习 Unity 和 `C#` 的书籍。通过系列中的五本书，你将学会创建优秀游戏所需的 `C#`
    和 Unity 技能，并按照所需的格式和节奏稳步进步，很快发布你的游戏。

    * **新手指南**：“新手指南”系列包含四本书，解释了如何使用 Unity 创建热门的 2D 游戏（平台跳跃、无尽跑、射击、益智）。它们还向你展示了如何将
    2D 游戏发布到 Android 平台。在此过程中，你还将学习如何使用 `C#` 和 Unity。它们提供了从开始到结束的完整解决方案，如何设计和创建这些游戏。


    ## 本书的支持与资源

    为了完成书中的活动并提高你的 `C#` 技能，你需要下载资源包；它包括：

    * 一份 Unity 抄表（例如键盘快捷键），以提高你在 Unity 中的操作速度。

    * 一份抄表，帮助你解决在开始学习 `C#` 时可能遇到的常见 `C#` 错误。这将节省你大量寻找修复方法的时间。

    * 一份关于 `C#` 最佳编码实践的抄表；此文档将帮助你构建代码。

    * 一个关于如何快速掌握 Unity 界面的免费视频教程。


    要下载这些资源，请执行以下操作：

    * 打开以下链接：[`learntocreategames.com/books/`](http://learntocreategames.com/books/)。

    * 选择这本书（“ A Quick Guide to C# programming with Unity ”）。

    * 在新页面上，点击标记为“Book Files”的链接，或滚动到页面底部。

    * 在“Download your Free Resource Pack”部分输入你的电子邮件地址和名字，点击标记为“Yes, I want to receive
    my bonus pack”的按钮。

    * 几秒钟，你应该会收到免费启动包的链接。

    * 当你收到链接时，可以下载所有资源到你的电脑上。


    本书献给 Helena


