    \ will be called if we use the following code to create a new bike.\n\n```csharp\n\
    Bike bike2 = new Bike(“Name of the Bike”);\n```\n\nSo your code should look like\
    \ the following by now (if not, you can use the next code as a template).\n\n\
    ```csharp\nusing UnityEngine;\nusing System.Collections;\n\npublic class Bike\n\
    {\n    private string name;\n    private float speed;\n    private int nbWheels;\n\
    \n    //First Constructor\n    public Bike()\n    {\n        name = \"Just another\
    \ bike\";\n        speed = 0.0f;\n    }\n\n    //Second Constructor\n    public\
    \ Bike(string newName)\n    {\n        name = newName;\n        speed = 0.0f;\n\
    \        Debug.Log (\"Just created a new bike with the name\" + name);\n    }\n\
    }\n```\n\nSo, once you have created our new class, we could now test it by doing\
    \ the following:\n- Open the script `MyFirstScript`.\n- Add the following code\
