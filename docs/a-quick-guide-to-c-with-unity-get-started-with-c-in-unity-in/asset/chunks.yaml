    \ public void accelerate()\n    {\n        speed++;\n    }\n\n    public void\
    \ turnRight()\n    {\n    }\n\n    private void calculateDistance()\n    {\n \
    \   }\n}\n```\n\nIn the code above, we have defined a class, called `Bike`, that\
    \ includes two member variables (`speed` and `color`) as well as two member methods\
    \ (`accelerate` and `turnRight`). Let’s look at the script a little closer; you\
    \ may notice a few things:\n\n*   The name of the class is preceded by the keywords\
