    # C# Programming Basics


    ## Comments


    When code is commented, it is not executed. There are two ways to comment your
    code in `C#`; you can use single or multi-line comments. In single-line comments,
    a double forward slash is added at the start of a line or after a statement, so
    that this line (or part thereof) is commented, as illustrated in the next code
    snippet.


    ```csharp

    //the next line prints Hello in the console window

    print (“Hello”);


    //the next line declares the variable name

    string name;

    name = “Hello”;//sets the value of the variable name

    ```


    In multi-line comments, any text between `/*` and `*/` will be commented (and
    not executed). This is also referred as comment blocks.


    ```csharp

    /* the next lines after the comments print hello in the console window

    we then declare the variable name and assign a value*/

    print(“Hello”);

    string name;

    name = “Hello”;//sets the value of the variable name


    //print (“Hello World”)


    /*

    string name;

    name = “My Name”;

    */

    ```


    In addition to providing explanations about your code, you can also use comments
    to prevent part of your code to be executed. This is very useful when you would
    like to debug your code and find where the error or bug might be, using a very
    simple method. By commenting sections of your code, and using a process of elimination,
    you can usually find the issue quickly. For example, you can comment all the code
    and run the script; then comment half the code, and run the script. If it works,
    it means that the error is within the code that has been commented, and if it
    does not work, it means that the error is in the code that has not been commented.
    In the first case (if the code works), we could then just comment half of the
    portion of the code that has already been commented. So, by successively commenting
    more specific areas of our code, we can get to discover what part of the code
    includes the bug. This process is often called dichotomy (as we successively divide
    a code section into two). It is usually effective to debug your code because the
    number of iterations (dividing part of the code in two) is more predictable and
    also potentially less time-consuming. For example for 100 lines of codes, we can
    successively narrow down the issue to 50, 25, 12, 6, and 3 lines (5 to 6 iterations
    in this case would be necessary instead of going through the whole 100 lines).


    ## Variables


    A variable is a container. It includes a value that may change overime. When using
    variables, we usually need to: (1) declare the variable (by specifying its type),
    (2) assign a value to this variable, and (3) possibly combine this variable with
    other variables using operators.


    ```csharp

    int myAge;//we declare the variable

    myAge = 20;// we set the variable to 20

    myAge = myAge + 1; //we add 1 to the variable myAge

    ```


    In the previous example, we have declared a variable `myAge`, its type is `int`
    (integer), we set it to 20 and we then add 1 to it. In `C#` the variable is declared
    using its type followed by its name. As we will see later we will also need to
    use what is called an access modifier in order to specify how this variable can
    be accessed.


    Note that in the previous code we have assigned the value `myAge + 1` to `myAge`;
    the `=` operator is an assignment operator; in other words, it is there to assign
    a value to a variable and is not to be understood in a strict algebraic sense
    (i.e., that the values or variables on both sides of the `=` sign are equal).


    To make coding easier and leaner, in `C#` you can perform a multiple declaration
    of several variables of the same type in the same statement. For example, in the
    next code snippet, we declare three variables, `v1`, `v2`, and `v3` in one statement.
    This is because they are of the same type (i.e., integers).


    ```csharp

    int v1,v2,v3;

    int v4=4, v5=5, v6=6;

    ```


    In the code above, the first line declares the variables `v1`, `v2`, and `v3`.
    All three are integers. In the second line, not only do we declare three variables
    simultaneously, but we also initialize them (i.e., set a value).


    When using variables, there are a few things that we need to determine including
    their name, type and scope:


    *   **Name of a variable**: A variable is usually given a unique name so that
    it can be identified uniquely. The name of a variable is usually referred to as
    an identifier. When defining an identifier, it can contain letters, digits, a
    minus, an underscore or a dollar sign, and it usually begins with a letter. Identifiers
    cannot be keywords (e.g., such as `if`).

    *   **Type of variable**: variables can hold several types of data including numbers
    (e.g., integers, doubles or floats), text (i.e., `strings` or characters), Boolean
    values (e.g., `true` or `false`), arrays, objects (i.e., we will see this concept
    later in this chapter) or `GameObjects` (i.e., any object included in your scene),
    as illustrated in the next code snippet.


    ```csharp

    string myName = “Patrick”;//the text is declared using double quotes

    int currentYear = 2015;//the year needs no decimals and is declared as an integer

    float width = 100.45f;//width is declared as a float (i.e., with decimals)

    ```


    *   **Variable declaration**: a variable needs to be declared so that the system
    knows what you are referring to if you use it in your code. To create a variable,
    it needs to be declared. At the declaration stage, the variable does not have
    to be assigned a value.


    ```csharp

    string myName;

    myName = “My Name”

    ```


    *   **Scope of a variable**: a variable can be accessed (i.e., referred to) in
    specific contexts where it was declared.

    *   **Accessibility level**: as we will see later, a `C#` programme consists of
    classes; for each of these levels.


    Common variable types include:


    *   `String`: same as text.

    *   `Int`: integer (1, 2, 3, etc.).

    *   `Boolean`: true or false.

    *   `Float`: with a fractional value (1.2f, 3.4f, etc.).

    *   `Arrays`: a group of variables of the same type. If this is unclear, not to
    worry, this concept will be explained further.

    *   `GameObject`: any game object in your scene.


    ## Arrays


    Sometimes, to make your code leaner, arrays make it easier to apply features and
    similar behaviors to a wide range of data. Arrays can help to declare less variables
    (for variables storing the same type) and to access them more easily. When creating
    arrays, you can create single-dimensional arrays and multidimensional arrays.


    Let’s look at the simplest form of arrays: single-dimensional arrays. For this
    concept, we can take the analogy of a group of 10 people who all have a name.
    If we wanted to store this information using a string variable, we would need
    to declare (and set) ten different variables.


    ```csharp

    string name1;string name2;```


    While this code is perfectly fine, it would be great to store these in one variable.
    For this purpose, we could use an array. An array is comparable to a list of elements
    that we access using an index. This index usually starts at 0 (for the first element
    in the list).


    So let’s see how we could do this with an array; first we could declare the array
    as follows:


    ```csharp

    string [] names;

    ```


    You will probably notice the syntax `dataType [] nameofTheArray`. The `[]` syntax
    means that we declare an array of string values.


    Then we could initialize the array, as we would normally do with any variable:


    ```csharp

    names = new string [10];

    ```


    In the previous code, we just say that our new array called `names` will include
    10 string variables. We can then store information in this array as described
    in the next code snippet.


    ```csharp

    names [0] = “Paul”;

    names [1] = “Mary”;

    …

    names [9] = “Pat”;

    ```

