  trans: "\n\n- 关键字 `using` 被称为指令；在特定情况下，它被用于导入所谓的命名空间（namespace）；简单来说，通过添加此指令，你实际上导入了（或获取了访问）一组类或数据类型。这些命名空间或“库”中的每一个都包含了对程序有用的类。例如，`UnityEngine`\
    \ 命名空间将包含用于 Unity 开发的类，而 `System.Collections` 将包含用于不同对象集合的类和接口。默认情况下，每当你在 Unity\
    \ 中创建一个新的 C# 脚本时，这两个命名空间（以及相关的指令）都会被包含。\n\n- 我们在名为 `TestCode` 的另一个类中声明了类 `Bike`。在这种情况下，`TestCode`\
    \ 是包含类。\n\n```csharp\npublic class TestCode : MonoBehaviour {\n```\n\n- 每当你创建一个新的\
    \ C# 脚本时，脚本的名称（例如 `TestCode`）将用于定义脚本中的主类（即 `TestCode`）。\n\n- 语法：`Monobehavior`\
    \ 意味着 `TestCode` 类派自 `MonoBehaviour` 类。这通常被称为继承。\n\n## 构造函数\n\n正如我们在上一节中看到的，当创建一个新对象时，它默认将包含所有的成员变量和方法。要创建此对象，我们将使用类名，并在后跟\
    \ `()`，如下一个示例所示。\n\n```csharp\nBike myBike = new Bike();\nmyBike.accelerate();\n\
    ```\n\n事实上，可以在创建新对象并在初始化时更改其某些属性。例如，与其像我们在之前的代码中那样设置对象的速度和颜色，如果能够在对象创建时自动设置这些属性并相应地传递参数，那就太棒了。嗯，这可以通过所谓的\
    \ `constructor`（构造函数）来实现。构造函数字面上的作用是根据参数（也称为参数）和指令帮助构建你的新对象。因此，例如，假设我们想在创建自行车时指定颜色；我们可以通过添加以下方法来修改\
    \ `Bike` 类，如下所示：\n\n```csharp\npublic Bike (int newColor)\n{\n    color = newColor;\n\
    }\n```\n\n这是一个新的构造函数（该方法名与类名相同），它接受一个整数作为参数；因此，在修改了我们的类描述（如上面的代码）之后，我们可以如下所示创建一个新的自行车对象：\n\
    \n```csharp\nBike myBike = new Bike(2);\n```\n\n我们甚至可以指定第二个构造函数，其中包含颜色和速度，如下：\n\
    \n```csharp\npublic Bike (int newColor, float newSpeed)\n{\n    color = newColor;\n\
    \    speed = newSpeed;\n}\n```\n\n你可以在类中拥有不同的构造函数；在初始化阶段使用的构造函数将与传递的参数匹配的那一个。\n\
    \n例如，假设我们为 `Bike` 类有两个构造函数。\n\n```csharp\npublic Bike (int newColor)\n{\n    color\
    \ = newColor;\n}\n\npublic Bike (int newColor, float newSpeed)\n{\n    color =\
    \ newColor;\n    speed = newSpeed;\n}\n```\n\n如果如下所示创建一个新的 `Bike` 对象：\n\n```csharp\n\
    Bike newBike = new Bike (2)\n```\n…那么将调用第一个构造函数。\n\n如果如下所示创建一个新的 `Bike` 对象：\n\n\
    ```csharp\nBike newBike = new Bike (2, 10.0f)\n```\n…那么将调用第二个构造函数。\n\n你可能还会想如果使用以下代码会发生什么，因为没有定义默认构造函数。\n\
    \n```csharp\nBike newBike = new Bike ();\n```\n\n事实上，每当你创建类时，都会（隐式地）定义一个默认构造函数，并在使用\
    \ `new` 操作符不带参数创建新对象时调用它。这被称为默认构造函数。在这种情况下，将使用每个类型数值成员变量的默认值（例如，整数为 0 或布尔变量为 false）。\n\
    \n注意，构造函数的访问通常是公共的，除非我们希望类不被实例化的特殊情况（例如对于仅包含静态成员的类）。同样注意，与变量一样，如果没有指定访问修饰符，默认将是私有的。方法也是如此。\n\
    \n## 析构函数\n\n对于构造函数，当对象被删除时，相应的析构函数会被调用。它的名称与类相同，并在前面有一个波浪号 `~`；如下代码段所示。\n\n```csharp\n\
    ~Bike()\n{\n    //在这里添加一些代码；\n}\n```\n\n尽管如此，析构函数既不能接受参数（或参数），也不能返回值。\n\n## 类的静态成员\n\
    \n当方法或变量被声明为 `static` 时，该类只存在该成员的一个实例。因此，静态变量将在该类的实例之间“共享”。静态变量通常用于在不实例化类的情况下获取常量。静态方法也是如此：它们可以在不需要实例化类的情况下被调用。如果你想创建并利用工具，这会非常有用。例如，在\
    \ Unity 中，可以使用 `GameObject.Find()` 方法；此方法通常允许根据名称查找特定对象。让我们看下面的示例。\n\n```csharp\n\
    public void Start()\n{\n    GameObject t = (GameObject) GameObject.Find(\"test\"\
    );\n}\n```\n\n在之前的代码中，我们查找一个名为 `test` 的对象，并将结果存储在类型为 `GameObject` 的变量 `t` 中。然而，当我们使用语法\
    \ `GameObject.Find` 时，使用的是来自 `GameObject` 类的静态方法 `Find`。在 Unity 中可以使用许多静态函数，包括\
    \ `Instantiate`。再次，这些函数可以在不需要实例化对象的情况下调用。下面的代码片段提供了基于 `Bike` 类的示例。\n\n```csharp\n\
    using UnityEngine;\nusing System.Collections;\npublic class TestCode : MonoBehaviour\
    \ {\nclass Bike\n{\nprivate int nbWheels;\nprotected float speed;\nprivate int\
    \ nbPassengers;\nprivate int color;\nstatic int nbBikes;\npublic void countBikes()\n\
    {\n    nbBikes++;\n}\n\npublic int getBikes()\n{\n    return nbBikes;\n}\n}\n\n\
    void Start ()\n{\n    Bike bike1 = new Bike();\n    Bike bike2 = new Bike();\n\
    \    bike1.countBikes();\n    bike2.countBikes();\n    print(\"Nb Bikes:\"+bike1.getBikes());\n\
    }}\n```\n\n下面的代码说明了静态函数的使用。\n\n```csharp\nusing UnityEngine;\nusing System.Collections;\n\
    public class TestCode : MonoBehaviour\n{\n    public class Bike\n    {\n     \
    \   private float speed;\n        private int color;\n        static void sayHello()\n\
    \        {\n            print(\"Hello\");\n        }\n    }\n\n    public void\
    \ Start()\n    {\n        Bike.sayHello();\n    }\n}\n```\n\n之前的代码将产生以下输出：\n\n\
    Hello\n\n## 继承\n\n我希望目前一切清晰，因为我们将观察面向对象编程中非常有趣且重要的原则：继承。继承的核心思想是对象可以从其他对象（父对象）继承属性。它们继承这些属性时，可以保持相同，也可以进化并覆盖这些继承的属性。这非常有趣，因为它使得通过创建一个具有相似特征的对象的通用属性类来减少代码成为可能，然后根据需要进行覆盖和自定义这些某些属性。\n\
    \n让我们以车辆为例；它们通常具有以下属性：\n\n*   轮子数量。\n*   速度。\n*   乘客数量。\n*   颜色。\n*   加速的能力。\n\
    *   停止的能力。\n\n因此，我们可以创建一个如下类，例如：\n\n```csharp\nclass Vehicles\n{\nprivate int\
    \ nbWheels;\nprotected float speed;\nprivate int nbPassengers;\nprivate int color;\n\
    \npublic void accelerate()\n{\n    speed++;\n}\n}\n```\n\n"
- fmt: "\nThese features could apply for example to cars, bikes, motorbikes, or trucks.\
    \ However, all these vehicles also differ; some of them may or may not have an\
    \ engine or a steering wheel. So we could create a subclass called `MotorizedVehicles`,\
    \ based on `Vehicles`, but with specificities linked to the fact that they are\
    \ motorized. These added attributes could be:\n\n* Engine size.\n* Petrol type.\n\
    * Petrol levels.\n* Ability to fill-up the tank.\n\nThe following example illustrates\
    \ how this class could be created.\n\n```csharp\nclass MotoredVehicles: Vehicles\n\
    {\n    private float engineSize;\n    private int petrolType;\n    private float\
    \ petrolLevels;\n\n    public void fillUpTank()\n    {\n        petrolLevels+=10;\n\
    \    }\n}\n```\n\n* When the class is defined, its name is followed by `: Vehicles`.\
    \ This means that it inherits from the class `Vehicles`. So it will, by default,\
    \ avail of all the methods and variables already included in the class `Vehicles`\
    \ .\n* We have created a new member method for this class, called `fillUpTank`.\n\
    * In the previous example, you may notice that the methods and variables that\
    \ were defined for the class `Vehicles` do not appear here; this is because they\
    \ are implicitly added to this new class, since it inherits from the class `Vehicles`\
    \ .\n\nWhenever you create a new class in Unity, it will, by default, inherit\
    \ from the `MonoBehaviour` class; as a result, it will implicitly include all\
    \ the member methods and variables of the class `MonoBehaviour`. Some of these\
    \ methods include `Start` or `Update`, for example.\n\nWhen using inheritance,\
    \ the parent is usually referred to as the `base class`, while the child is referred\
    \ to as the `inherited class`.\n\nNow, while the child inherits “Behaviors” from\
    \ its parents, these can always be modified or, put simply, overwritten. However,\
    \ in this case, the base method (the method defined in the parent) must be declared\
    \ as `virtual`. Also, when overriding this method, the keyword `override` must\
    \ be used. This is illustrated in the following code.\n\n```csharp\nclass Vehicles\n\
    {\n    private int nbWheels;\n    protected float speed;\n    private int nbPassengers;\n\
    \    private int color;\n\n    public virtual void accelerate()\n    {\n     \
    \   speed++;\n    }\n}\n\nclass MotoredVehicles : Vehicles\n{\n    private float\
    \ engineSize;\n    private int petrolType;\n    private float petrolLevels;\n\n\
    \    private void fillUpTank()\n    {\n        petrolLevels += 10;\n    }\n\n\
    \    public override void accelerate()\n    {\n        speed += 10;\n    }\n}\n\
    ```\n\nIn the previous example, while the method `accelerate` is inherited from\
    \ the class `Vehicles`, it would normally increase the speed by one. However,\
    \ by overwriting it, we make sure that in the case of objects instantiated from\
    \ the class `MotoredVehicles`, each acceleration increases the speed by 10. We\
    \ can access the member variable `speed` from the child class `MotoredVehicles`\
    \ because it has been declared as `protected`.\n\nThis point can also be illustrated\
    \ using some classes in Unity. Let’s look at the next example.\n\n```csharp\n\
    using UnityEngine;\nusing System.Collections;\n\npublic class TestCode : MonoBehaviour\
    \ {\n    public class Bike\n    {\n        private float speed;\n        private\
    \ int color;\n        public static void sayHello()\n        {\n            print\
    \ (\"Hello\");\n        }\n    }\n\n    public void Start ()\n    {\n        Bike.sayHello();\n\
    \    }\n}\n```\n\nIn this example, we have created a class `TestCode`; this class\
    \ inherits from `MonoBehaviour`; by default this class includes, amongst other\
    \ things, a definition for the methods `Start` and `Update`; however, by default,\
    \ these two methods are blank; this is the reason why we overwrite these methods\
    \ for the class `TestCode` (inherited from `MonoBehaviour`) so that the `Start`\
    \ method actually displays some information.\n\nThere are obviously more concepts\
    \ linked to inheritance; however, the information provided in this section should\
    \ get you started easily. For more information on inheritance in C#, you can [look\
    \ at the official documentation](https://msdn.microsoft.com/en-us/library/a72418yk%28v=vs.110%29.aspx).\n\
    \n# Methods\n\nMethods or functions can be compared to a friend or colleague to\
    \ whom you gently ask to perform a task, based on specific instructions, and to\
    \ return the information to you then. For example, you could ask your friend the\
    \ following: “Can you please tell me when I will be celebrating my 20th birthday\
    \ given that I was born in 2000”. So you give your friend (who is good at Math)\
    \ the information (date of birth) and s/he will calculate the year of your 20th\
    \ birthday and give this information back to you. So in other words, your friend\
    \ will be given an input (i.e., the date of birth) and return an output (i.e.,\
    \ the year of your 20th birthday). Methods work exactly this way: they are given\
    \ information (and sometimes not), perform an action, and then (sometimes, if\
    \ needed) return information back.\n\nIn programming terms, a method (or function)\
    \ is a block of instructions that performs a set of actions. It is executed when\
    \ invoked (or put more simply called) from the script, or when an event occurs.\
    \ Methods are very useful because once the code has been created, it can be called.\
    \ As for member variables, member functions or methods are declared and they can\
    \ also be called. Methods can take parameters and produce information. As a result,\
    \ methods can do one of the following:\n\n* Perform an action.\n* Return a result.\n\
    * Take parameters and process them.\n\nA method has a syntax and can be declared\
    \ as follows (in at least two ways).\n\n```csharp\nAccessType methodName()\n{\n\
    \    // Perform actions here\n}\n```\n\nIn the previous code the method does not\
    \ take any input; neither does it return an output. It just performs actions.\n\
    \nOR\n\n```csharp\ntypeOfDataReturned methodName()\n{\n    // Perform actions\
    \ here\n}\n```\n\nLet’s look at the following method for instance.\n\n```csharp\n\
    public int calculateSum(int a, int b)\n{\n    return (a+b);\n}\n```\n\nIn the\
    \ previous code:\n\n* The method is of `public`: there are no access restrictions.\n\
    * The method will return an integer.\n* The name of the method is `calculateSum`.\n\
    * The method takes two arguments (i.e., integer parameters).\n* The method returns\
    \ the sum of the two parameters passed (the parameters are referred to as `a`\
    \ and `b` within this method).\n\nA method can be called using the `()` operator,\
    \ as follows:\n\n```csharp\nmethodName1();\nmethodName2(value);\nint test = methodName3(value);\n\
    ```\n\nIn the previous code, a method is called with no parameter (line 1), or\
    \ with a parameter (line 2). In the third example (line 3), a variable `test`\
    \ will be set with the value returned by the method `methodName3`.\n\nYou may,\
    \ and we will get to this later, have different methods in a class with the exact\
    \ same name but that take different types of parameters. This is often referred\
    \ as polymorphism, as the method literally takes different forms and can process\
    \ information differently based on the information (e.g., type of data) provided.\n\
    \n## Accessing methods and access modifiers\n\nAs we have seen previously, in\
    \ C# there are different types of access modifiers. These modifiers specify from\
    \ where a method can be called and can be `public` (no restricted access), `protected`\
    \ (access is limited to the containing class or types derived from this class),\
    \ `internal` (access is limited to the current assembly), `protected internal`\
    \ (we won’t use this access type in this book), and `private` (i.e., access is\
    \ limited to the containing type).\n\n## Common methods\n\nIn Unity, there are\
    \ many methods available by default, and they are called built-in methods. Some\
    \ of these functions are called when an event occurs. For example:\n"
  raw: 'These features could apply for example to cars, bikes, motorbikes, or trucks.
    However, all these vehicles also differ; some of them may or may not have an engine
    or a steering wheel. So we could create a subclass called MotorizedVehicles ,
    based on Vehicles , but with specificities linked to the fact that they are motorized.
    These added attributes could be:


    *   Engine size.


    *   Petrol type.


    *   Petrol levels.


    *   Ability to fill-up the tank.


    The following example illustrates how this class could be created.


    class MotoredVehicles: Vehicles


    {


    private float engineSize;


    private int petrolType;


    private float petrolLevels;


    public void fillUpTank()


    {


    petrolLevels+=10;


    }


    }


    *   When the class is defined, its name is followed by : Vehicles . This means
    that it inherits from the class Vehicles . So it will, by default, avail of all
    the methods and variables already included in the class Vehicles .


    *   We have created a new member method for this class, called fillUpTank .


    *   In the previous example, you may notice that the methods and variables that
    were defined for the class Vehicles do not appear here; this is because they are
    implicitly added to this new class, since it inherits from the class Vehicles
    .


    Whenever you create a new class in Unity, it will, by default, inherit from the
    MonoBehaviour class; as a result, it will implicitly include all the member methods
    and variables of the class MonoBehaviour . Some of these methods include Start
    or Update , for example.


    When using inheritance, the parent is usually referred to as the base class ,
    while the child is referred to as the inherited class .


    Now, while the child inherits “Behaviors” from its parents, these can always be
    modified or, put simply, overwritten. However, in this case, the base method (the
    method defined in the parent) must be declared as virtual. Also, when overriding
    this method, the keyword override must be used. This is illustrated in the following
    code.


    class Vehicles


    {


        private int nbWheels;


        protected float speed;


        private int nbPassengers;


        private int color;


        public virtual void accelerate()


        {


            speed++;


        }


    }


    class MotoredVehicles : Vehicles


    {


        private float engineSize;


        private int petrolType;


        private float petrolLevels;


        private void fillUpTank()


        {


            petrolLevels += 10;


        }


        public override void accelerate()


        {


            speed += 10;


        }


    }


    In the previous example, while the method accelerate is inherited from the class
    Vehicles , it would normally increase the speed by one. However, by overwriting
    it, we make sure that in the case of objects instantiated from the class MotoredVehicles
    , each acceleration increases the speed by 10. We can access the member variable
    speed from the child class MotoredVehicles because it has been declared as protected
    .


    This point can also be illustrated using some classes in Unity. Let’s look at
    the next example.


    using UnityEngine;


    using System.Collections;


    public class TestCode : MonoBehaviour {


    public class Bike


    {


    private float speed;


    private int color;


    public static void sayHello()


    {


    print (“Hello”);


    }


    }


    public void Start ()


    {


    Bike.sayHello();


    }


    }


    In this example, we have created a class TestCode ; this class inherits from MonoBehaviour
    ; by default this class includes, amongst other things, a definition for the methods
    Start and Update ; however, by default, these two methods are blank; this is the
    reason why we overwrite these methods for the class TestCode (inherited from MonoBehaviour
    ) so that the Start method actually displays some information.


    There are obviously more concepts linked to inheritance; however, the information
    provided in this section should get you started easily. For more information on
    inheritance in C#, you can [look at the official documentation](https://msdn.microsoft.com/en-us/library/a72418yk%28v=vs.110%29.aspx)
    .


    Methods


    Methods or functions can be compared to a friend or colleague to whom you gently
    ask to perform a task, based on specific instructions, and to return the information
    to you then. For example, you could ask your friend the following: “ Can you please
    tell me when I will be celebrating my 20th birthday given that I was born in 2000
    ”. So you give your friend (who is good at Math :-)) the information (date of
    birth) and s/he will calculate the year of your 20th birthday and give this information
    back to you. So in other words, your friend will be given an input (i.e., the
    date of birth) and return an output (i.e., the year of your 20th birthday). Methods
    work exactly this way: they are given information (and sometimes not), perform
    an action, and then (sometimes, if needed) return information back.


    In programming terms, a method (or function) is a block of instructions that performs
    a set of actions.  It is executed when invoked (or put more simply called ) from
    the script, or when an event occurs (e.g., the player has clicked on a button
    or the player collides with an object; we will see more about events in the next
    section). As for member variables, member functions or methods are declared and
    they can also be called.


    Methods are very useful because once the code for a method has been created, it
    can be called several times without the need to re-write the same code over and
    over again. Also, because methods can take parameters, a method can process these
    parameters and produce or return information accordingly; in other words, they
    can perform different actions and produce different information based on the input.
    As a result, methods can do one or all of the following:


    •         Perform an action.


    •         Return a result.


    •         Take parameters and process them.


    A method has a syntax and can be declared as follows (in at least two ways).


    AccessType typeOfdataReturned nameOfTheFunction ()


    {


    Perform actions here…


    }


    In the previous code the method does not take any input; neither does it return
    an output. It just performs actions.


    OR


    AccessType typeOfDataReturned nameOfTheFunction ()


    {


    Perform actions here…


    }


    Let’s look at the following method for instance.


    public int calculateSum(int a, int b)


    {


    return (a+b);


    }


    In the previous code:


    *   The method is of type public : there are no access restrictions.


    *   The method will return an integer.


    *   The name of the method is calculateSum .


    *   The method takes two arguments (i.e., integer parameters).


    *   The method returns the sum of the two parameters passed (the parameters are
    referred to as a and b within this method).


    A method can be called using the () operator, as follows:


    nameOfTheFunction1();


    nameOfTheFunction2(value);


    int test = nameOfTheFunction3(value);


    In the previous code, a method is called with no parameter (line 1), or with a
    parameter (line 2). In the third example (line 3), a variable called test will
    be set with the value returned by the method nameOfTheFunction3 .


    You may, and we will get to this later, have different methods in a class with
    the exact same name but that take different types of parameters. This is often
    referred as polymorphism, as the method literally takes different forms and can
    process information differently based on the information (e.g., type of data)
    provided.


    Accessing methods and access modifiers


    As we have seen previously, in C# there are different types of access modifiers.
    These modifiers specify from where a method can be called and can be public (no
    restricted access), protected (access is limited to the containing class or types
    derived from this class), internal (access is limited to the current assembly),
    protected internal (we won’t use this access type in this book), and private (i.e.,
    access is limited to the containing type).


    Common methods


    In Unity, there are many methods available by default, and they are called built-in
    methods. Some of these functions are called when an event occurs. For example:'
