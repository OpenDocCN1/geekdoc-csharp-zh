    \npublic class Bike : MonoBehaviour {\n    // Use this for initialization\n  \
    \  void Start () {\n    }\n    // Update is called once per frame\n    void Update\
    \ () {\n    }\n}\n```\n\nWhen this is done, let’s edit this script to add some\
    \ features to our bike.\n- We can start by deleting the text `:MonoBehaviour`.\
    \ This is because our class will be used as a standalone and not inherit from\
    \ the `MonoBehaviour` class (which is mainly for game objects in the scene).\n\
    - Then we can delete the methods `Start` and `Update`, for the same reason as\
    \ explained above, as we will create our own methods for our class `Bike`.\n-\
    \ So your code should look like the following:\n\n```csharp\nusing UnityEngine;\n\
    using System.Collections;\n\npublic class Bike\n{\n}\n```\n\nAt this stage we\
    \ have a blank canvas that we can use for our new class.\n- Please add the following\
    \ code at the start of the class (just before the comment “ Use this for initialization\
    \ ”). The new code is highlighted in bold.\n\n```csharp\nusing UnityEngine;\n\
    using System.Collections;\n\npublic class Bike\n{\n    private string name;\n\
    \    private float speed;\n    private int nbWheels;\n}\n```\n\n- In the previous\
    \ code, we declare three private member variables of type `string`, `float` and\
    \ `int`. These will be used to identify the `name`, `speed` and number of wheels\
    \ for the bike created.\n\nWe now need to define one or more constructors for\
    \ our class, to define the feature of each new bike created. Please add the following\
    \ code within the class:\n\n```csharp\n//First Constructor\npublic Bike()\n{\n\
    \    name = \"Just another bike\";\n    speed = 0.0f;\n}\n\n//Second Constructor\n\
    public Bike(string newName)\n{\n    name = newName;\n    speed = 0.0f;\n    Debug.Log\
    \ (\"Just created a new bike with the name\" + name);\n}\n```\n\n- In the previous\
    \ code, we create two constructors; both methods are public and their names are\
    \ the same as the name of our class (i.e., `Bike`).\n- The method `print` that\
    \ we used earlier is only accessible for classes that inherit from the class `MonoBehaviour`;\
    \ in our case, we have removed this inheritance (our class does not inherit anymore\
    \ from the class `MonoBehaviour`), so we use the method `Debug.Log` instead which\
    \ is accessible from the library `UnityEngine` that we imported at the start of\
    \ our script); this is equivalent to the method `print`.\n- The first constructor\
    \ will be used if the object is created but no parameters are used at its instantiation.\
    \ We see that, by default, we just set the name of this bike to “ Just another\
    \ bike ” and its speed to 0. This constructor will be called if we use the following\
    \ code to create a new bike.\n\n```csharp\nBike bike1 = new Bike();\n```\n\n-\
    \ The next constructor takes a string as a parameter; which means that it will\
    \ be called if we create a new bike and pass a string as a parameter when an object\
    \ is created from this class (i.e., instantiated). We see that if this is the\
