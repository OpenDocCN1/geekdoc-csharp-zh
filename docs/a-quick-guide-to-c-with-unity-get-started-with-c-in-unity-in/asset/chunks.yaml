    {


        nbBikes++;


    }


    public int getNbBikes()


    {


        return (nbBikes);


    }


    }


    void Start ()


    {


        Bike bike1 = new Bike();


        Bike bike2 = new Bike();


        bike1.countBikes();


        bike2.countBikes();


        print("Nb Bikes:"+bike1.getNbBikes());


    }}


    The following code illustrates the use of static functions.


    using UnityEngine;


    using System.Collections;


    public class TestCode : MonoBehaviour


    {


        public class Bike


        {


            private float speed;


            private int color;


            public static void sayHello()


            {


                print("Hello");


            }


        }


        public void Start()


        {


            Bike.sayHello();


        }


    }


    The previous code would result in the following output:


    Hello


    In the previous code, we declare a static method called sayHello ; this method
    is then called in the start method without the need to instantiate (or create)
    a new Bike . This is because, due to its public and static attributes, it can
    be accessed from anywhere in the programme.


    Inheritance


    I hope everything is clear so far, as we are going to look at a very interesting
    and important principle for object-oriented programming: inheritance. The main
    idea of inheritance is that objects can inherit their properties from other objects
    (their parent). As they inherit these properties, they can remain identical or
    evolve and overwrite some of these inherited properties. This is very interesting
    because it makes it possible to minimize the code by creating a class with general
    properties for all objects sharing similar features, and then, if need be, to
    overwrite and customize some of these properties.


    Let’s take the example of vehicles; they would generally have the following properties:


    *   Number of wheels.


    *   Speed.


    *   Number of passengers.


    *   Color.


    *   Capacity to accelerate.


    *   Capacity to stop.


    So we could create the following class for example:


    class Vehicles


    {


    private int nbWheels;


    protected float speed;


    private int nbPassengers;


    private int color;


    public void accelerate()


    {


    speed++;


    }


    }'
