    或者\n\n```csharp\ntypeOfReturned methodName()\n{\n    // 执行动作\n}\n```\n\n```csharp\n\
    public int calculateSum(int a, int b)\n{\n    return (a+b);\n}\n```\n\n在上面的代码中：\n\
    \n* 方法是 `public` 的：没有访问限制。\n* 方法将返回一个整数。\n* 方法名称是 `calculateSum`。\n* 方法接收两个参数（即整数参数）。\n\
    * 方法返回两个参数的和（在方法内部参数称为 `a` 和 `b`）。\n\n可以使用 `()` 运算符调用方法，如下：\n\n```csharp\nmethodName1();\n\
    methodName2(value);\nint test = methodName3(value);\n```\n\n在前面的代码中，方法不带参数调用（第\
    \ 1 行），或带参数调用（第 2 行）。在第三个示例中（第 3 行），变量 `test` 将设置为 `methodName3` 返回的值。\n\n你可能会（我们稍后会讨论）在类中拥有相同名称但接收不同类型参数的方法。这通常被称为多态，因为方法字面上可以采取不同的形式，并根据提供的信息（例如数据类型）来处理信息。\n\
    \n## 访问方法和访问修饰符\n\n正如我们之前看到的，在 C# 中有不同类型的访问修饰符。这些修饰符规定了可以从哪里调用方法，可以是 `public`（无限制访问）、`protected`（访问限制于包含类或派自该类的类型）、`internal`（访问限制于当前程序集）、`protected\
