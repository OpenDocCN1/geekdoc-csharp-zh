  \n### 连接你的应用程序到 SQL Server\n\n在接下来的章节，我向你展示如何通过两种常见场景连接 SQL Server：使用 SQL Server\
  \ 身份验证以及当 IIS 和 SQL Server 在同一台机器运行时使用 Windows 身份验证。\n\n你可能在使用外部托管公司时使用第一种方案，他们通常要求你向数据库传递用户名和密码。第二种方案适用于你自己托管网站且\
  \ IIS 和 SQL Server 在同一台机器上。更高级的场景（例如在不同机器上使用 Windows 身份验证）超出了本附录的范围。有关配置和安全 SQL\
  \ Server 的更多信息，可以参考 Adam Jorgensen 等人的 *Professional SQL Server 2012 Administration》(ISBN\
  \ 978-181-0688-4)。\n\n#### 场景 1 — 使用 SQL Server 身份验证\n\n从配置的角度来看，这可能是最容易配置的场景：你只需要确保服务器安装支持\
  \ SQL Server 身份验证，在 SQL Server 中创建一个用户，然后在 Planet Wrox 网站的连接中使用该账户。\n\n1. 在 SQL\
  \ Server Management Studio 中，右键点击图 B-3 所示的服务器名称，选择属性（Properties），并切换到安全（Security）类别。出现图\
  \ B-4 所示的对话框。![image](img/f787-01.jpg)\n\n   **图 B-4**\n\n2. 如果尚未选中，选择屏幕顶部的“SQL\
  \ Server and Windows Authentication Mode”（SQL Server 和 Windows 身份验证模式）。在点击 OK 之前，点击屏幕顶部的“Help”（帮助）了解更多关于\
  \ SQL 和 Windows 身份验证的信息，并判断是否真的需要 SQL Server 身份验证。Windows 身份验证比 SQL Server 身份验证更安全，建议尽可能使用该选项。\n\
  \n3. 如果更改了服务器身份验证方式，请重启 SQL Server。你可以通过右键点击对象管理器中的服务器并选择重启来执行。\n\n4. 回到 SQL Server\
  \ Management Studio 的对象管理器，展开位于图 B-3 所示底部的服务器 `Security`（安全）节点。确保你选择的是服务器名称下的，而不是属于特定数据库的。右键点击\
  \ `Logins`（登录）并选择 `New Login`新建登录）。\n\n\n\n## 5. 用户账户创建\n\n1. 输入登录名称，然后选择 SQL Server\
  \ 身份验证选项并输入密码（两次）。在本示例及随后的示例中，我将使用 `PlanetWroxUser` 作为用户名，使用 `Pa$$w0rD`（用数字 0 代替字母\
  \ o）作为密码。\n\n2. 取消勾选“强制密码过期”选项。这将同时禁用“用户在下次登录时更改密码”。你的对话框最终看起来应该像图 B-5 所示。\n\n \
  \  ![image](img/f788-01.jpg)\n   **图 B-5**\n\n   如果你想了解更多关于此屏幕上的各个设置，请点击屏幕顶部的帮助按钮。\n\
  \n3. 点击确定创建新账户。\n\n## 6. 数据库权限配置\n\n创建账户后，下一步是为此新账户授予数据库的适当权限：\n\n1. 在对象资源管理器中，展开\
  \ `Databases`（数据库），然后是 `PlanetWrox` 数据库，接着是 `Security`（安全）节点。最后，右键点击 `Users`（用户）节点并选择\
  \ `New User`（新建用户）。\n\n2. 在 `User Type`（用户类型）下拉列表中选择 `SQL User with Login`（带登录的\
  \ SQL 用户）（此选项在早期版本的 Management Studio 中不存在）。在 `User Name`（用户名）文本框中输入 `PlanetWroxUser`。\n\
  \n3. 在 `Login Name`（登录名）文本框中再次输入 `PlanetWroxUser`。或者，点击省略号按钮，然后点击 `Browse`（浏览），从出现的列表中选择该用户。\n\
  \n4. 点击左侧列表中的 `Membership`（成员），你会看到一个标记为 `Database Role Membership`（数据库角色成员）的框（在早期版本的\
  \ SQL Server Management Studio 中，此框位于输入用户名的同一页面）。在此框中，你可以选择多个角色。这里的规则是：尽可能赋予用户最少的权限。良好的选择是\
  \ `db_datareader` 和 `db_datawriter`，它们允许账户读取和写入数据库中的表，因此请勾选这两个图 B-6 中可见的选项。\n\n\
  \   ![image](img/f789-01.jpg)\n   **图 B-6**\n\n5. 如果你想为数据库对象设置细粒度的安全选项，请点击图 B-6\
  \ 左侧部分的 `Securables`（可安全性）选项。此对话框允许你确定用户账户对数据库中表、视图和存储过程对象的权限。对于 Planet Wrox 网站，你不需要在此框中进行任何更改。\n\
  \n6. 最后，点击确定创建 `PlanetWroxUser` 账户并将其分配给 `db_datareader` 和 `db_datawriter` 角色。\n\
  \n7. 你可以关闭 SQL Server Management Studio，因为你目前已完成操作。\n\n## 7. 网站配置\n\n现在 SQL Server\
  \ 和你的用户账户已配置正确，最后阶段是配置网站使用此新用户账户。\n\n1. 从 `C:\\BegASPNET\\Release` 文件夹打开部署的 Planet\
  \ Wrox 应用程序的 `Web.config` 文件。\n\n2. 如下修改 `<connectionStrings>` 元素：\n\n```xml\n<connectionStrings>\n\
  \  <add name=\"PlanetWroxConnectionString1\" connectionString=\"Data Source=ServerName;\n\
  \               Initial Catalog=PlanetWrox;User ID=PlanetWroxUser;password=Pa$$w0rD\"\
  \n           providerName=\"System.Data.SqlClient\"\n  />\n  <add name=\"PlanetWroxEntities\"\
  \ connectionString=\"\n     metadata=res://*/App_Code.PlanetWrox.csdl|res://*/App_Code.PlanetWrox.ssdl|res\n\
  \     ://*/App_Code.PlanetWrox.msl;provider=System.Data.SqlClient;provider connection\n\
  \     string=&quot;Data Source=ServerName;Initial Catalog=PlanetWrox;\n        \
  \ User ID=PlanetWroxUser;password=Pa$$w0rD;MultipleActiveResultSets=True&quot;\"\
  \n    providerName=\"System.Data.EntityClient\"\n  />\n</connectionStrings>\n```\n\
  \n在你的配置文件中，每个连接字符串应单独一行。不要忘记将 `Data Source` 属性中的值 `ServerName` 替换为有效的服务器名称。根据你的服务器和配置，这可能简单如\
  \ `(local)` 或 `.\\SqlExpress` 以指向本地机器上的 SQL Server，`DatabaseServer` 以指向网络上名为 `DatabaseServer`\
  \ 的服务器，或者类似 `DatabaseServer\\Sql2012` 的内容指向名为 `DatabaseServer` 的机器上名为 `Sql2012`\
  \ 的命名实例。\n\n3. 保存更改，然后启动浏览器并访问 `http://localhost` 来打开网站。一切应该仍然正常工作，但网站不再使用 `App_Data`\
  \ 文件夹中的数据库；而是使用你在连接字符串中定义的 SQL Server。\n\n4. 为了确保此新连接字符串在网站的未来更新中仍然可用，你还应该将其添加到\
  \ Visual Studio 中网站的 `Web.To local disk.config` 文件。\n\n如果你在访问本地主机上的网站时遇到错误，你可能需要关闭\
  \ `Web.config` 中的自定义错误（出于安全考虑，请将其设置为 `RemoteOnly` 而不是 `Off`）以查看实际错误消息。\n\n\n\n\n\
  \n# 最后，点击 OK 以创建数据库用户并将其分配给 `db_datareader` 和 `db_datawriter` 角色。\n\n现在 SQL Server\
  \ 和你的用户账户已配置正确，最后一步是配置网站以使用此新用户账户。\n\n1. 从 `C:\\BegASPNET\\Release` 文件夹打开 Planet\
  \ Wrox 应用程序的 `Web.config` 文件。\n\n2. 修改 `<connectionStrings>` 元素使其呈现如下所示：\n\n   ```xml\n\
  \   <connectionStrings>\n      <add name=\"PlanetWroxConnectionString1\" connectionString=\"\
  Data Source=ServerName;\n                   Initial Catalog=PlanetWrox;Trusted_Connection=True\"\
  \  \n           providerName=\"System.Data.SqlClient\"\n      />\n      <add name=\"\
  PlanetWroxEntities\" connectionString=\"\n         metadata=res://*/App_Code.PlanetWrox.csdl|res://*/App_Code.PlanetWrox.ssdl|res\n\
  \         ://*/App_Code.PlanetWrox.msl;provider=System.Data.SqlClient;provider connection\n\
  \         string=&quot;Data Source=ServerName;Initial Catalog=PlanetWrox;\n    \
  \     Trusted_Connection=True;MultipleActiveResultSets=True&quot;\"\n        providerName=\"\
  System.Data.EntityClient\"\n      />\n   </connectionStrings>\n   ```\n\n   在你的配置文件中，每个连接字符串都应该占单行。不要忘记将\
  \ `Data Source` 属性中的值 `ServerName` 替换为有效的服务器名称。根据你的服务器和配置，这可能简单如 `(local)` 或 `.\\\
  SqlExpress`（指向本地机器上的 SQL Server），`DatabaseServer`（指向网络上名为 `DatabaseServer` 的服务器），或类似\
  \ `DatabaseServer\\Sql2012`（指向名为 `DatabaseServer` 的机器上名为 `Sql2012` 的命名实例）。\n\n3.\
  \ 保存更改，然后启动浏览器并访问 `http://localhost` 来打开网站。一切应该仍按预期正常工作，但网站不再使用 `App_Data` 文件夹中的数据库；而是通过连接字符串中的\
  \ `Trusted_Connection=True` 属性识别的 Windows 身份验证，使用连接字符串中定义的 SQL Server。\n\n4. 为了确保此新连接字符串在网站未来的更新中仍然可用，你还应该将其添加到\
  \ Visual Studio 中网站的 `Web.local disk.config` 文件中。\n\n   如果在浏览网站时遇到错误，你可能需要关闭 `Web.config`\
  \ 文件中的自定义错误（或将其设置为 `RemoteOnly`）以查看实际错误消息。错误的可能可能是连接字符串中的服务器名称错误，以及配置账户的数据库角色成员身份配置错误。\n\
  \n一旦你找到了正确的账户并正确配置了 SQL Server，使用 Windows 身份验证并不困难。事实上，你的连接字符串现在变得更简单、更安全，因为你不再需要在其中存储用户名和密码了。\n\
  \n## 配置应用程序服务\n\n在本书的前面的部分，你已经学习了 ASP.NET 应用程序服务使用 SQL Server 数据库。你还看到了如何确保你自己的网站和应用程序服务使用同一个数据库。\n\
  \n如果你选择不合并你的数据库和应用程序服务使用的数据库，那么你的网站现在使用两个数据库：你自己的和一个名为 `aspnetdb.mdf` 的数据库。不过，你仍然可以在稍后合并它们。在\
  \ ASP.NET 的早期版本中，这涉及到相当大量的工作，包括更改 `Web.config` 文件和运行命令行工具。然而，有了更新后的程序集，现在变得非常简单。按照以下步骤操作，让应用程序服务使用自己的数据库：\n\
  \n1. 首先，确保应用程序服务指向你想要使用的连接字符串。要做到这一点，你需要将 `connectionStringName` 设置为配置文件定义的连接字符串。以下示例显示了如何为\
  \ Membership 部分进行操作，但其他服务遵循类似的模式：\n\n   ```xml\n   <membership defaultProvider=\"\
  DefaultMembershipProvider\">\n      <providers>\n        <add name=\"DefaultMembershipProvider\"\
  \n         type=\"System.Web.Providers.DefaultMembershipProvider,\n            \
  \            System.Web.Providers, Version=1.0.0.0, Culture=neutral,\n         \
  \               PublicKeyToken=31bf3856ad364e35\"\n          connectionStringName=\"\
  PlanetWroxConnectionString1\"\n          enablePasswordRetrieval=\"false\" enablePasswordReset=\"\
  true\"\n          requiresQuestionAndAnswer=\"false\" requiresUniqueEmail=\"false\"\
  \n          maxInvalidPasswordAttempts=\"5\" minRequiredPasswordLength=\"7\"\n \
  \         minRequiredNonalphanumericCharacters=\"1\" passwordAttemptWindow=\"10\"\
  \n          applicationName=\"/\"\n        />  </providers>\n   </membership>\n\
  \   ```\n\n   注意 `connectionStringName` 指向了在其他处定义的名为 `PlanetWroxConnectionString1`\
  \ 的连接字符串。\n\n2. 确保 Web 服务器使用的账户具有更改数据库架构的权限。你可以通过将账户添加到 `db_ddladmin` 组来实现此，如附图\
  \ B-6 所示。这授予账户执行数据定义语言语句的权限，这意味着它可以创建和修改数据库中的表和其他对象。\n\n3. 重启 IIS。要执行此操作，启动 IIS\
  \ 管理器（在开始菜单或开始屏幕上输入 `inetmgr`），点击你的服务器名称，然后点击右侧操作面板中的“重启”。为了对服务器的影响降至最低，你也可以通过右键点击网站使用的应用程序池并选择“回收”来对其进行。\n\
  \n4. 浏览到你的网站并请求登录页面。尝试使用虚假的用户名和密码登录。在此阶段，NET 运行时将修改数据库并向其添加必要的表。如果你查看成员服务所用连接字符串定义的数据库，你会发现它现在包含了\
  \ Membership、Roles 和 Profile 使用的表。\n\n5. 出于安全考虑，你现在应该将账户从 `db_ddladmin` 中移除，因为在运行时使用\
  \ Membership 不需要这些权限。\n\n\n\n\n\n# 责任限制/免责声明\n\n出版商和作者对本书书中内容的准确性或完整性不作任何陈述或保证，并特此放弃所有保证，包括但不限于对特定用途的适用性的保证。销售或促销材料均不得创建或扩大任何保证。本书中包含的建议和策略可能并不适用于所有情况。本书的销售基于以下理解：即出版商并未事于提供法律、会计或其他专业服务。如果需要专业协助，应寻求能力胜任的专业人士的服务。出版商和作者均对由此产生的损害不承担责任。在书中提及某个机构或网站作为引用和/或进一步信息的潜在来源，并不意味着作者或出版商认可该机构或该网站可能提供的信息或其可能做出的建议。此外，读者应当注意，本书中列出的互联网网站在本书编写期间到阅读期间可能已经发生了变化或消失。\n\
