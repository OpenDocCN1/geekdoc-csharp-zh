  \ [www.wrox.com](http://www.wrox.com) 并通过搜索框或标题列表找到该书籍。点击书籍详情页上的“Download Code”链接以获取本书的所有源代码。\n\
  \n你可以按书中使用的每种编程语言（C# 或 Visual Basic）以单个文件的形式下载本书的源码。你可以使用你喜欢的解压缩工具解压这些文件。如果你提取了源码，请确保保持代码下载中部分的原始文件夹结构。不同的解压工具对此功能使用不同的名称，但请寻找类似于“Use\
  \ Folder Names”（使用文件夹名称）或“Maintain Directory Structure”（保持目录结构）的功能。从下载中提取文件后，你应该得到一个名为\
  \ `Source` 的文件夹和一个名为 `Resources` 的文件夹。然后， C 盘根目录下创建一个名为 `BegASPNET` 的新文件夹，并将 `Source`\
  \ 和 `Resources` 文件夹移动到该新文件夹中，形成类似 `C:\\BegASPNET\\Source` 和 `C:\\BegASPNET\\Resources`\
  \ 的文件夹。`Source` 文件夹包含本书 19 章的源码以及 Planet Wrox 网站的最终版本。`Resources` 文件夹包含书中某些练习中需要的文件。如果一切运行正常，你得到的结构应如\
