  # 前言\n\n`HTML5` 和 `CSS3` 等新兴标准的采用率每天都在增长。只有在客户端应用程序中才能实现的功能正变为变为现实。随着浏览器每天变得越来越快、更好，随着更多常见任务作为复用库可用，随着几乎所有大型\
  \ 框架的开源，我们的万维网正成为一个充满活力的地方。\n\n\n\n\n本书作者 Imar Spaanjaars 自 2008 年起一直是 `ASP.NET`\
  \ 的微软 MVP。这一次我们还让他加入了 `ASP.NET` Insiders 小组，在该小组中，我们可以在产品进入公测阶段之前就讨论功能构思和预发布产品。在开发过程中，Imar\
  \ 一直是团队反馈的持续来源，我确定在未来他也将继续如此。\n\n在《入门 ASP.NET 4.5.1：C# 与 VB》中，他循序渐进、深入浅地构建概念，并涵盖了\
  \ `ASP.NET 4.5.1` 和 `Visual Studio 2013` 的最新功能。无论你是刚开始学习 Web 开发，还是正在升级到 `ASP.NET\
  \ 4.5.1`，这本书都绝对值得加入你的工具箱。\n\n认识 Imar 是我的荣幸，我想感谢他对我们社区所出的贡献。他的见解和想法对 `ASP.NET` 和\
  \ `Visual Studio` 背后的产品团队来说是无价的。我希望他的见解对你有所帮助。\n\nVishal R. Joshi\n\n*首席程序经理主管*\n\
  \n*微软公司 Windows Azure 组*\n\n[`vishalrjoshi.com`](http://vishalrjoshi.com)\n\n# 构建高效且吸引人的数据库驱动网站简介\n\
  \n你需要两样东西：一个运行网页的稳定快速的框架，以及一个用于创建和编写这些网页的丰富环境。通过 `ASP.NET 4.5.1` 和 `Visual Studio\
  \ 2013`，你可以两者兼得。它们共同构成了创建动态交互式网站的平台。\n\n`ASP.NET 4.5.1` 构建在其流行的前版本 `ASP.NET 2.0`、`3.5`、`4.0`\
  \ 和 `4.5` 之上。在保持与这些旧版本构建的站点兼容的同时，`ASP.NET 4.5.1` 和 `Visual Studio 2013` 引入了全新的、令人兴奋的功能。\n\
  \n你会在 `ASP.NET Framework` 和 `Visual Studio` 中发现许多大小不的变化。其中一些变化包含了 `Entity Framework\
  \ 6`（第 14 节讨论）、第 18 节讨论的 `Browser Link` 的引入，以及第 19 节讨论的用于网站项目的 `Publish Wizard`\
  \ 的引入。\n\n如果你还没有用过 `Visual Studio 2012` 和 `ASP.NET 4.5`，你也会喜欢改进后的 `CSS` 和 `JavaScript`\
  \ 编辑器（分别在第 3 节和第 10 节讨论）、`NuGet` 的包含（第 11 节）以及 `Page Inspector`（第 18 节），这些都是 `VS\
  \ 2012` 添加的，而 `VS 2013` 正是在此基础上开发的。\n\n如果你熟悉 `ASP.NET` 的早期版本，你会惊喜在新框架的版本中有许多小惊喜，它们会让你的开发工作变得更容易。我在书中适当的地方提到并讨论了这些新功能。要查看\
  \ `ASP.NET` 所有新功能的完整列表，请访问 `ASP.NET` 官网查看以下白皮书：\n\n[www.asp.net/visual-studio/overview/2013/release-notes](http://www.asp.net/visual-studio/overview/2013/release-notes)\n\
  \n如果你读到这本书时该链接已失效，请在 `www.asp.net` 搜索：“ASP.NET 4.5.1 有何新”。\n\n`Visual Studio Express\
  \ 2013 for Web` 可能最好的一点是价格：它是免费的。这使得 `Visual Studio` 和 `ASP.NET` 成为当今最具吸引力和令人信服的\
  \ Web 开发技术。\n\n## 本书适合对象\n\n本书适合任何想要学习如何构建在微软平台上运行的丰富且交互式网站的人。通过从书中获得的知识，你为构建任何类型的网站奠定了坚实的基础，范围从简单的爱好相关网站到你可能为商业目的创建的网站。\n\
  \n任何 Web 编程初学者都应该跟上，因为我们不假设读者具备任何 Web 开发背景，尽管如果你对 `HTML` 和通用 Web 有基础了解会有帮助。本书从 Web\
  \ 开发的最开始起，向你展示如何获取和安装 `Visual Studio`。后续章节将在前几节知识的基础上，逐步向你介绍新技术。\n\n你是否更倾向于 Visual\
  \ Basic 而不是 `C#`，或者反之亦？或者你认为这两种语言都一样酷？又也许你还没有下主意，想学习这两种语言？无论如何，你都会喜欢这本书，因为*所有*代码示例都用这两种语言呈现！\n\
  \n即使你对之前的版本 `ASP.NET` 有一些经验，你可能从书中受益匪浅。虽然许多许多版本的概念被引入了 `ASP.NET 4.5.1` 中，但你会发现书中有很多新内容，包括强类型数据控件、更智能的代码编辑器、新的调试设施等。\n\
  \n## 本书涵盖内容\n\n本书将教你如何创建一个名为 Planet Wrox 的功能丰富、数据驱动且交互式的网站。虽然这个名字听起来很绕口，但你会发现通过\
  \ `Visual Studio 2013`，开发这样的网站并没有看起来中那么困难。你将看到构建网站的整个过程，从第 1 节安装 `Visual Studio`\
  \ 到第 19 节将网站发布。本书分为 19 节，每节讨论一个特定主题：\n\n### 第 1 节：入门 ASP.NET 4.5.1\n在本节中，你将看到如何获取和安装\
  \ `Visual Studio Express 2013 for Web`，这是 `Visual Studio 2013` 用于构建 ASP.NET 网站。你还将介绍\
  \ `HTML5`，这是定义网页的最新标准。本节结束于 Visual Studio 提供的自定义选项概述。\n\n### 第 2 节：构建 ASP.NET 网站\n\
  本节向你展示如何创建一个网站以及如何向其中添加页面等项目。除了学习如何创建一个结构良好的站点，你还将看到……\n\n### 第 3 节：设计你的网页\nVisual\
  \ Studio 提供了许多工具来创建设计精美且吸引人的网页。在本节中，你将看到如何良好利用这些工具。此外，你还将学习 `CSS`，用于网页网页网页语言。\n\n\
  ### 第 4 节：使用 ASP.NET 服务器控件\nASP.NET 服务器控件是 `ASP.NET` 中最重要的概念之一。它们允许你用极少的代码创建复杂且功能丰富的网站。本节向你介绍了大量的服务器控件，解释了它们的用途，并展示了如何使用它们。\n\
  \n### 第 5 节：编写你的 ASP.NET 网页\n尽管内置的 `CSS` 工具和 ASP.NET 服务器控件让你在创建网页方面进步很多，但你可能需要使用编程语言来增强你的页面。本节作为编程的介绍，重点关注网页的编程。最棒的是：在本节（以及书中其他章节）中看到的所有示例都使用了\
  \ Visual Basic 和 `C#`，因此你可以选择你最喜欢的语言。\n\n### 第 6 节：创建外观一致的网站\n一致性对于赋予你的网站吸引力和专业外观至关重要。ASP.NET\
  \ 通过使用主页（Master Pages）帮助你创建外观一致的页面，主页允许你定义页面的全局视觉效果。皮肤和主题帮助你集中站点中控件和其他视觉元素的样式。你还将看到如何创建一个基础页面，以集中站点中所有页面所需的编程代码。\n\
  \n### 第 7 节：导航\n为了帮助访问者在你的站点穿梭，ASP.NET 提供了系列导航控件。这些控件用于构建站点的导航结构。它们可以连接到定义网站页面的中心站点地图。你还将学习如何通过程序将用户从一个页面重定向到另一个页面。\n\
  \n\n\n\n# 第 8 章，“用户控件。”\n用户控件是可重用的页面片段，可以用于多个网页。因此，它们非常适合重复内容，如菜单、横幅等。在本章中，你将学习如何创建和使用用户控件，并利用一些程序化智能来增强它们。\n\
  \n# 第 9 章，“验证用户输入。”\n你网站的大部分交互性是由用户的输入定义的。本章将向你展示如何使用 ASP.NET 服务器控件来接受、验证和处理用户输入。此外，你将看到如何从\
  \ ASP.NET 网站发送电子邮件，以及如何从文本文件中读取内容。\n\n# 第 10 章，“ASP.NET AJAX。”\nMicrosoft ASP.NET\
  \ AJAX 允许你创建美观且无闪烁的网页，缩小了传统桌面应用程序与网站之间的差距。在本章中，你将学习如何使用内置的 Ajax 功能增强网页的呈现，从而实现与网站更平滑的交互。\n\
  \n# 第 11 章，“jQuery。”\njQuery 是一个流行的开源、跨浏览器 JavaScript 库，旨在让客户端浏览器与网页的交互变得简单。在本章中，你将学习\
  \ jQuery 的基础知识，并看到如何为你的网页添加丰富的视觉效果和动画。\n\n# 第 12 章，“数据库简介。”\n理解如何使用数据库对于构建网站至关重要，因为大多数现代网站都需要使用数据库。你将学习\
  \ SQL 基础知识，这是一种允许你访问和修改数据库中数据的查询语言。此外，你将接触 Visual Studio 中提供的数据库工具，这些工具可以帮助你创建和管理\
  \ SQL Server 数据库。\n\n# 第 13 章，“显示和更新数据。”\n在第 12 章所知识的基础上，本章将向你展示如何使用 ASP.NET 数据绑定控件和数据源控件来创建一个丰富的界面，使用户能够与这些控件针对的数据库数据进行交互。\n\
  \n# 第 14 章，“LINQ 和 ADO.NET Entity Framework。”\nLINQ 是 Microsoft 用于访问对象、数据库、XML 等更多内容的解决方案。ADO.NET\
  \ Entity Framework (EF) 是 Microsoft 用于数据库访问的新技术。本章将向你介绍 LINQ 的本质、如何使用 Visual Studio\
  \ 内置的视化 EF 设计器，以及如何编写 LINQ to Entities 查询以在你的 SQL Server 数据库中存取数据。你还将看到如何配合模型绑定（Model\
  \ Binding）和强类型数据控件工作，使编写代码更容易且错误少。\n\n# 第 15 章，“处理数据——高级主题。”\n与前面的章节主要关注处理数据的技术基础不同，本章将从前端的角度来看待相同的话题。你将看到如何通过使用控件样式更改数据的视觉外观。你还将看到如何与数据绑定控件交互，以及通过保留频繁访问数据的本地副本来加快网站速度。\n\
  \n# 第 16 章，“你的 ASP.NET 网站安全。”\n虽然出现在书中较后的位置，但安全是一个首级的、重要的课题。本章将向你展示如何利用与安全相关的 ASP.NET\
  \ 内置功能。你将学习许多促进安全的应用程序服务。你还学习了如何让用户在你的网站上注册账户、如何区分匿名用户和登录用户，以及如何管理系统中的用户。\n\n# 第\
  \ 17 章，“网站个性化。”\n在第 16 章引入的安全功能的基础上，本章将向你展示如何创建针对个人用户的内容的个性化网页。你将看到如何配置和使用 ASP.NET\
  \ Profile，它允许你为已知和匿名访问存储个性化数据。\n\n# 第 18 章，“异常处理、调试和跟踪。”\n你需要良好的调试工具来理解、改进和修复为 ASP.NET\
  \ 网页编写的代码。Visual Studio 带有出色的调试支持，允许你从运行时诊断应用程序的状态，帮助你在用户发现之前发现并修复问题。你还将详细查看页面检查器（Page\
  \ Inspector）和新的 Browser Link（浏览器链接）功能。\n\n# 第 19 章，“部署你的网站。”\n到书结束时，你应该有一个准备好向世界展示的网站。但具体如何做呢？为了将你的网站发布到真实环境中，你需要知道和理解哪些事情？本章提供了答案，并带你详细了解如何配置不同的生产系统以运行你的最终网站。你还将看到如何实现合并（bundling）和压缩（minification）以提高你网站的性能。\n\
  \n## 本书的结构\n本书花费时间通过可运行的示例和详细的解释来逐步说明概念。通过使用著名的 Wrox“Try It Out”（尝试一下）和“How It Works”（工作原理）部分，你将在引导下逐步完成一项任务，并在完成任务的过程中详细说明重要事项。每个“Try\
  \ It Out”任务之后都有一个详细的“How It Works”部分，解释了你在练习中执行的步骤。\n\n在每一章的末尾，你可以找到练习，帮助你测试在本章中获得的知识。你可以在书末的附录\
  \ A 中找到每个问题的答案。如果你不知道所有问题的答案，请不要担心。后面的章节并不假设你遵循并执行了之前章节中练习部分中的任务。\n\n由于这是一本面向初者的书，我无法对许多主题进行非常详细的介绍。对于书中的几乎每一个章节，你都能找到许多其他专门讨论该主题的书籍。在适当的情况下，我包含了对这些书籍的引用，以便你可以轻松决定下一步去哪里。\n\
  \n## 使用本书所需的条件\n本书假设你拥有满足以下要求的系统：\n\n* 能够运行 Visual Studio。对于具体的系统要求，请参阅相关文档。\n*\
  \ 运行 Windows 7 或 Windows 8（至少为家庭版），或 Windows Server 2008 R2 或 2012 版本。\n\n第 1 章将向你如何获取和安装\
  \ Visual Studio 2013，它会自动安装 .NET Framework 4.5 和 SQL Server Express LocalDB；然后你只需要一个操作系统来阅读本书。\n\
  \n## 规范\n为了帮助你充分利用内容并跟踪进度，书中使用了多种规范。\n\n关于文中的样式：\n\n* 新术语和重要单词在引入时使用*斜体*。\n* 文中的代码显示为：`Request.QueryString.Get(\"\
  Id\")`。\n* 不以 `www` 开头的 URL 以 `http://` 前缀，以明确这是一个互联网地址。文中的 URL 显示为：`http://imar.spaanjaars.com`。\n\
  * 你会看到以 `tinyurl.com` 或 `bit.ly` 开头的 URL，这些是实用的在线服务，用于缩短 URL（从而更易输入）。在浏览器中输入 `tinyurl.com`\
  \ 或 `bit.ly` 地址将带你到达最终目的地。\n* 需要点击多个子菜单的菜单项使用特殊符号，如下所示：`File ⇒ New ⇒ Folder`。\n\
  * 与讨论无关的代码或内容要么完全省略，要么用省略号（三个点）和注释替换，如下：\n\n```html\n<tr>\n  <td style=\"white-space:\
  \ nowrap;\">\n    ... 菜单项在此；未显示\n  </td>\n</tr>\n```\n\n\n\n\n\n无论示例中使用什么种编程语言，都会使用三个点，因此你会在\
  \ C#、Visual Basic、HTML、CSS 和 JavaScript 中看到它。当你看到代码中要求输入到代码编辑器中的指令时，你可以简单地跳过这三个点以及同一行中其后的任何内容。\n\
  \n*   首次显示的代码或其他相关代码采用以下格式：\n\n```vb\nDim roles As New ArrayList()\nroles.Add(\"\
  Administrators\")\nroles.Add(\"ContentManagers\")\n```\n\n    为了突出显示被其他代码包围的代码块，我使用了如下所示的粗体字体：\n\
  \n```xml\n<appSettings>\n  <add key=\"FromAddress\" value=\"planetwrox@example.com\"\
  />\n</appSettings>\n```\n\n    周围的代码用于让你更容易看到粗体代码应该放置的位置。\n\n*   在很多情况下，代码中的空白是无关紧要的，ASP.NET\
  \ 标记和 HTML 也是如此。为了使代码适应本书的边界，我经常将代码跨越多行折行，并对本应在上一行的行的部分进行缩进，如下所示：\n\n```vb\nDim\
  \ result As String =\n        WebConfigurationManager.AppSettings.Get(\"FromAddress\"\
  )\n```\n\n    如果你自己输入这些代码，可以将其全部放在同一行，或者根据你的喜好使用相同的换行。本书附带的示例代码通常在单行上。\n\n*   显示在屏幕上的文本通常每个单词的首字母大写（Each\
  \ Word Start With A Capital Letter），即使原始屏幕文本使用了不同的大小写形式。这样做是为了让屏幕文本与正文区分开来。\n\n\
