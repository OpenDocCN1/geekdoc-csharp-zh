  \ 变量\nDim reviewId As Integer = Convert.ToInt32(Request.QueryString.Get(\"ReviewId\"\
  ))\n' 将值 3 分给 categoryId 变量\nDim categoryId As Integer = Convert.ToInt32(Request.QueryString.Get(\"\
  CategoryId\"))\n```\n\n#### C#\n```csharp\n// 将值 34 分给 reviewId 变量\nint reviewId\
  \ = Convert.ToInt32(Request.QueryString.Get(\"ReviewId\"));\n// 将值 3 分给 categoryId\
  \ 变量\nint categoryId = Convert.ToInt32(Request.QueryString.Get(\"CategoryId\"));\n\
  ```\n\n\n\n\n关注用户输入验证的人通常会遵循一个准言：`永远不要信任用户输入`。虽然这初听起来可能像是疑神鬼，但在任何开放系统中都是至关重要的。即使你认为你知道用户是谁，即使你完全信任他们，他们通常也不是唯一可以访问你系统的用户。一旦你的网站上线互联网，它就成了恶意用户和黑客的潜在目标，他们会试图找到进入你系统的方法。除了这些恶意的访问者外，即使是你值得信任的用户也可能不小心向你的服务器发送错误数据。\n\
  \n为了帮助你尽可能地解决这个问题，ASP.NET 自带了一系列`validation controls`（验证控件），帮助你在数据在应用程序中使用之前对其进行验证。在接下来的章节中，你将看到如何使用标准验证控件来确保用户向系统提交有效数据。\n\
  \n## ASP.NET 验证控件\n\nASP.NET 4.5.1 提供了六个实用的控件用于在你的网站中执行验证。其中五个用于执行实际验证，而最后一个控件 ——\
  \ `ValidationSummary` —— 用于向用户提供有关页面中可能任何错误的错误反馈。图 9-1 显示了工具箱中验证类别下的可用控件。\n\n![image](img/f301-01.jpg)\n\
  \n**图 9-1**\n\n验证控件对于验证用户输入系统的数据非常有帮助。它们可以轻松挂载到其他控件，如 `TextBox` 或 `DropDownList`；然而，它们也支持自定义验证场景。图\
  \ 9-2 展示了两个验证控件 —— `RequiredFieldValidator` 和 `RangeValidator` 的用法，防止用户在没有输入必要有效数据的情况下提交表单。\n\
  \n![image](img/f302-01.jpg)\n\n**图 9-2**\n\n验证控件的伟大之处在于它们可以在客户端和服务器端检查输入。当你向 Web\
  \ 页面添加验证控件时，该控件会渲染 JavaScript 以在客户端验证关联的控件。这种客户端验证可以在大多数启用了 JavaScript 的现代网络浏览器上运行，包括\
  \ Internet Explorer、Firefox、Chrome、Opera 和 Safari，并适用于桌面、平板电脑和手机等许多不同设备。同时，验证也会在服务器端自动执行。这使得你能够使用客户端脚本为用户提供关于数据的即时反馈，同时确保你的\
  \ Web 页面在服务器端不受虚假的数据。\n\n### 关于客户端验证的警告\n\n尽管客户端验证似乎足以防止用户向你的系统发送无效数据，但你绝不应该将其作为验证的唯一解决方案。在浏览器中禁用\
  \ JavaScript 很容易，这会导致客户端验证程序变得毫无用。此外，恶意用户可以轻松绕过浏览器中的整个页面，并直接向服务器发送信息，如果你不采取防御措施，服务器将乐意接受并处理这些信息。\n\
  \n通常情况下，你应该只将客户端验证视为对用户的礼貌。它为用户提供即时反馈，让他们知道自己漏填了必填字段，或者在没有向服务器进行完全回传（postback）的情况下输入了错误数据。另一方面，服务器端验证是唯一的真正的验证手段。它是防止无效数据进入系统的唯一有效方法。\n\
  \n下一节将讨论你如何利用验证控件来保护你的数据。\n\n## 使用验证控件\n\n要在 ASPX 页面中声明验证控件，你使用熟悉的声明式语法。例如，要创建图\
  \ 9-2 中使用的 `RequiredFieldValidator` 控件，你需要以下代码：\n\n```\n<asp:RequiredFieldValidator\
  \ ID=\"ReqVal1\" runat=\"server\" ControlToValidate=\"YourName\"\n         ErrorMessage=\"\
  Enter your name\" />\n```\n\n`ControlToValidate` 属性将此验证控件链接到页面上的另一个控件（此例中为 `YourName`）。当执行验证时，验证控件会查看关联控件的值，当该值不符合你设置的验证规则时，它默认显示\
  \ `ErrorMessage` 属性中设置的消息，尽管正如稍后看到的，你也可以覆盖此行为。\n\n为了让你了解验证控件的工作原理，接下来的练习将引导你完成位于用户控件中的联系表单中使用\
  \ `RequiredFieldValidator` 的过程。练习之后是对各种验证控件的深入讨论。\n\n### 使用 HTML5 数据类型\n\nHTML5\
  \ 为 `input` 元素的 `type` 属性引入了许多新类型。这些新类型允许你确定浏览器应该如何解释该字段，以便其渲染出正确的用户界面。ASP.NET 4.5.1\
  \ 通过 `TextBox` 控件的 `TextMode` 属性支持这些新属性。除了自 ASP.NET 1 以来就支持的 `SingleLine, MultiLine`\
  \ 和 `Password` 类型外，你现在可以使用以下值：\n\n| VALUE | DESCRIPTION |\n| :--- | :--- |\n| Color\
  \ | 允许用户选择颜色，通常来自颜色选择器。 |\n| Date / DateTime / DateTimeLocal / Month / Week / Time\
  \ | 允许用户以各种方式输入日期或时间。根据类型，浏览器会渲染日历或其他专用控件来输入值。 |\n| Email | 允许用户输入电子邮件地址。 |\n| Url\
  \ | 允许用户输入网页地址。 |\n| Number | 允许用户输入数字。 |\n| Range | 允许用户输入范围内的数字。浏览器通常会绘制滑动控件来输入值。\
  \ |\n| Search | 允许用户输入搜索词。这通常渲染为一个文本框，但在右角有一个清除文本的选项。 |\n\n这些 `TextMode` 属性的服务器端值被转换为小写的客户端\
  \ 属性。为了查看效果，考虑此 `TextBox`：\n\n```\n<asp:TextBox runat=\"server\" ID=\"Email\" TextMode=\"\
  Email\" />\n```\n\n在浏览器中渲染时，此控件生成以下 HTML：\n\n```html\n<input name=\"Email\" type=\"\
  email\" id=\"Email\" />\n```\n\n根据 `type` 属性的不同值，浏览器可以通过为控件绘制不同的用户界面并验证输入的数据来帮助用户输入正确数据。此外，具有“软键盘”（屏幕上显示的键盘）的设备能够调整键盘以匹配输入的数据类型。例如，在\
  \ `type` 设置为 `number` 的文本框上，Apple iPad 将显示数字键盘。\n\n尽管这些新属性值是 HTML 的极佳补充，但你需要注意一些限制。首先，由于\
  \ HTML5 还很新，并不是所有的浏览器都支持这些新功能。图 9-4 显示了今天五个最流行的浏览器对每个属性的支持情况。第一行是 Internet Explorer\
  \ 11、Firefox 24 和 Chrome 29；第二行显示了 Safari 5 和 Opera 16。\n\n![image](img/f307-01.jpg)\n\
  \n**图 9-4**\n\n如你所见，某些浏览器对属性的支持比其他浏览器更多。在写作时，Chrome 和 Opera 的支持最好。注意，并非所有浏览器实现这些新类型的方式完全相同。例如，在大多数但并非所有浏览器中，如果你在\
  \ `type` 属性设置为 `email` 的 `input` 框中输入一个看起来不像电子邮件的值，你将收到错误且无法提交页面。\n\n\n\n\n\n你可以通过访问\
  \ [`imar.spaanjaars.com/demos/html5/html5.aspx`](http://imar.spaanjaars.com/demos/html5/html5.aspx)\
  \ 来尝试此页面的实时示例，以测试你的浏览器。\n\n另一个需要意识到的是，你应该仅将这些新属性视为对用户的有用提示；绝不应该仅依赖它们来进行验证。恶意用户可以轻易绕过浏览器执行的验证。此外，由于对浏览的支持仍然非常有限，验证将不会在所有浏览器的所有字段中执行。\n\
  \n鉴于主流浏览器对这些新属性的实现非常有限，你可能会怀疑最初使用它们是否值得。我的建议是使用它们，尽管支持程度有些有限。首先，浏览器的新版本会定期发布，带来更好的\
  \ HTML5 支持。此外，手机和平板电脑等设备上市时，其配备的浏览器已经支持了这些属性。最后，使用这些属性几乎是无风险的。`input` 元素的默认 `type`\
  \ 是 `text`，因此当浏览器遇到它不理解的值时，它会将该元素视为简单的文本框。\n\n由于你不能依靠这些 HTML5 属性来验证数据，因此使用 ASP.NET\
  \ 验证控件至关重要。下一节将讨论 ASP.NET 中可用的其余验证控件。\n\n### 标准验证控件\n\n五个验证控件（工具箱中验证类别下名称以 `Validator`\
  \ 结尾的控件）最终都继承自同一个基类，因此共享一些共同行为。五个验证控件中的四个工作方式相同，并且包含允许你验证关联控件的内置行为。最后一个控件 `CustomValidator`（自定义验证器）允许你编写无法箱无法即用支持的自定义验证规则。\n\
  \n下表列出了验证控件共享的一些常用属性，你在操作它们时通常会用到这些属性。\n\n| 属性 | 描述 |\n| :--- | :--- |\n| `Display`\
  \ | 此属性决定隐藏的错误消息是否占用空间。当将 `Display` 设置为 `Static` 时，即使错误消息被隐藏，它也会占用屏幕空间。这与你在第 3 章中看到的\
  \ CSS 设置 `visibility: hidden` 类似。`Dynamic` 设置使用 `display: none` 隐藏错误消息，直到需要显示为止。设置为\
  \ `None` 时，控件完全不可见。如果你在使用本章稍后看到的 `ValidationSummary`，这将非常有用。 |\n| `CssClass` | 此属性允许你设置应用到错误消息文本的\
  \ CSS `class` 属性。 |\n| `ErrorMessage` | 此属性存储 `ValidationSummary` 控件中使用的错误消息。当 `Text`\
  \ 属性为空时，`ErrorMessage` 的值也会用作页面上显示的文本。 |\n| `Text` | `Text` 属性用于验证控件在页面上显示的文本。这可以是一个表示错误的星号\
  \ `*`，也可以是“输入您的姓名”之类的文本。 |\n| `ControlToValidate` | 此属性包含需要验证的控件的服务器 ID。 |\n| `EnableClientScript`\
  \ | 此属性决定控件是否在客户端提供验证。默认值为 `True`。 |\n| `SetFocusOnError` | 此属性决定客户端脚本是否将焦点赋予第一个生成错误的控件。该设置的默认值为\
  \ `False`。 |\n| `ValidationGroup` | 验证控件可以分组，允许你对一组选定的控件进行验证。所有具有相同 `ValidationGroup`\
  \ 的控件都会同时被检查，这意味着不属于该组的控件不会被检查。例如，考虑一个带有登录按钮以及用户名和密码字段的登录页面。该页面可能还包含一个搜索框，允许你搜索网站。通过\
  \ `ValidationGroup`，你可以让登录按钮验证用户名和密码框，而搜索按钮仅触发对搜索框的验证。 |\n| `IsValid` | 你通常不会在设计时设置此属性，但在运行时，它提供了有关验证测试是否通过的信息。`Page`\
  \ 类也有一个 `IsValid` 属性，它可以返回页面或验证组中所有控件的组合结果，正如你稍将看到的。 |\n\n#### Text 和 ErrorMessage\
  \ 属性之间的区别\n\n从乍看，这两个属性似乎具有相同的目的。它们都可以用于以错误消息的形式向用户提供反馈。但当与 `ValidationSummary` 控件结合使用时，两者之间存在细微的。当你同时设置这两个属性时，验证控件显示\
  \ `Text` 属性，而 `ValidationSummary` 使用 `ErrorMessage`。图 9-5 显示了一个包含两个 `RequiredFieldValidator`\
  \ 控件的示例登录页面。这两个验证控件的 `Text` 属性都设置为星号 `*`，以给用户提供存在问题的视觉提示。控件下方的 `ValidationSummary`\
  \ 然后显示完整的 `ErrorMessage` 属性。 |\n\n![image](img/f309-01.jpg)\n\n**图 9-5**\n\n你已经看过了\
  \ `RequiredFieldValidator` 的工作，因此接下来的章节将让你深入了解另外三个标准验证控件。稍后的章节将向你展示如何使用 `CustomValidator`\
  \ 和 `ValidationSummary`。\n\n#### RangeValidator\n\n`RangeValidator` 控件允许你检查值是否落在特定范围内。该控件能够检查字符串、数字、日期和货币等类型。例如，可以使用它来确保数字在\
  \ 1 到 10 之间，字符在 A 到 F 之间，或者选定的日期在今天和未来几天之间。下表列出了它最重要的属性。\n\n| 属性 | 描述 |\n| :---\
  \ | :--- |\n| `MinimumValue` | 此属性决定最小允许值。例如，在检查 1 到 10 之间的整数时，将此属性设置为 1。 |\n| `MaximumValue`\
  \ | 此属性决定最大允许值。例如，在检查 1 到 10 之间的整数时，将此属性设置为 10。 |\n| `Type` | 此属性决定验证控件检查的数据类型。此值可以设置为\
  \ `String`、`Integer`、`Double`、`Date` 或 `Currency` 以检查相应的数据类型。 |\n\n下面的示例显示了一个 `RangeValidator`，确保在\
  \ `Rate` 框中输入的值是 1 到 10 之间的整数：\n\n```\n<asp:RangeValidator ID=\"RangeValidator1\"\
  \ runat=\"server\"\n    ControlToValidate=\"Rate\" ErrorMessage=\"输入 1 到 10 之间的数字\"\
  \n    MaximumValue=\"10\" MinimumValue=\"1\" Type=\"Integer\" />\n```\n\n#### RegularExpressionValidator\n\
  \n`RegularExpressionValidator` 控件允许你根据在控件的 `ValidationExpression` 属性设置的正则表达式来检查值。正则表达式提供了简洁的语法，允许你在文本字符串中搜索模式。正则表达式是一个复杂的课题，但幸运的是，Visual\
  \ Studio 自带了一些内置表达式，可以轻松验证电子邮件地址和邮政编码等值。如果你想了解更多关于正则表达式的知识，可以购买 Andrew Watt 写的 Wrox\
  \ 版 *Beginning Regular Expressions*（ISBN: 978-0-7645-7489-4）。\n\n下面的示例显示了一个 `RegularExpressionValidator`\
  \ 控件，确保用户输入了一个看起来像电子邮件地址的值。\n\n\n\n\n\n```\n<asp:RegularExpressionValidator ID=\"\
  RegularExpressionValidator1\" runat=\"server\"\n     ControlToValidate=\"Email\"\
  \ ErrorMessage=\"Enter a valid e-mail address\"\n     ValidationExpression=\"\\\
  w+([-+.']\\w+)*@\\w+([-.]\\w+)*.\\w+([-.]\\w+)*\" />\n```\n\n### CompareValidator\n\
  \n`CompareValidator` 可用于比较一个控件的值与另一个值。这通常用于注册表单，其中用户必须输入两次密码以确保两次输入的密码相同。除了与另一个控件比较外，你也可以与一个常量值进行比较。\n\
  \n下表列出了 `CompareValidator` 控件的额外属性。\n\n| 属性 | 描述 |\n| :--- | :--- |\n| `ControlToCompare`\
  \ | 此属性包含验证器与之比较的控件 ID。当设置此属性时，`ValueToCompare` 将不起作用。 |\n| `Operator` | 此属性决定比较操作的类型。例如，当\
  \ `Operator` 设置为 `Equal` 时，两个控件必须包含相同的值，验证器才被视为有效。同样，你还有 `NotEqual`、`GreaterThan`\
  \ 和 `GreaterThanEqual` 等选项来执行不同的验证操作。 |\n| `Type` | 此属性决定验证控件检查的数据类型。此值可以设置为 `String`、`Integer`、`Double`、`Date`\
  \ 或 `Currency` 以检查相应的数据类型。 |\n| `ValueToCompare` | 此属性允许你定义一个常量值进行比较。这通常用于协议，在其中你必须输入如\
  \ `Yes` 之类的单词来表示你同意某些条件。只需将 `ValueToCompare` 设置为单词 `Yes`，并将 `ControlToValidate`\
  \ 设置为你想要验证的控件即可完成。当设置此属性时，请确保 `ControlToCompare` 属性为空，否则它将具有优先级。 |\n\n此示例显示了一个 `CompareValidator`，它确保两个\
  \ `TextBox` 控件包含相同的密码：\n\n```\n<asp:CompareValidator ID=\"CompareValidator1\" runat=\"\
  server\"\n    ControlToCompare=\"ConfirmPassword\" ControlToValidate=\"Password\"\
  \n    ErrorMessage=\"Your passwords don't match\" />\n```\n\n在接下来的练习中，你将看到这些控件的大部分工作，但\
  \ `RangeValidator` 除外。然而，它的用法与其他验证控件类似，因此当你需要时，将其添加到网页或用户控件中同样简单。\n\n你到目前为止所看到的验证控件非常易用。你将它们添加到页面中，设置几个属性，然后它们就会为你完成所有的繁琐工作。然而，它们不支持你可能想到的每种验证场景。例如，如果你想确保用户至少输入两个电话号码中的一个呢？如果你想向用户展示他们在表单中犯的所有错误的完整列表呢？这就是\
  \ `CustomValidator` 和 `ValidationSummary` 控件大显身手的地方。\n\n#### CustomValidator 和 ValidationSummary\
  \ 控件\n\n`CustomValidator` 控件允许你为客户端（使用 JavaScript）和服务器端（使用 VB.NET 或 C#）编写自定义验证函数。这让你在想要验证的数据和想要适的规则方面具有极大的灵活性。\n\
  \n`ValidationSummary` 控件为用户提供一个错误列表，这些错误是从各个验证控件的 `ErrorMessage` 属性中检索的。它可以通过三种不同的方式显示这些错误：使用嵌入页面的列表、使用\
  \ JavaScript 警报框，或者同时使用这两种。你通过 `ShowMessageBox` 和 `ShowSummary` 属性来控制此设置。此外，`DisplayMode`\
  \ 属性允许你更改错误列表的呈现方式。默认设置为 `BulletList`，其中每个错误都是项目列表中的一项，其他选项还有 `List`（不带项目符号）和 `SingleParagraph`（单段落）。\n\
  \n在接下来的练习中，你将学习如何编写客户端和服务器端验证方法，以及如何使用 `ValidationSummary` 控件。\n\n除了你目前看到的验证控件外，ASP.NET\
  \ 还带有另一种验证机制，将在下一步讨论。\n\n### 理解请求验证 (Request Validation)\n\n根据设计，当页面上的任何控件包含看起来像\
  \ HTML 标签的内容时，ASP.NET 页面都会抛出异常。例如，当你在联系表单的注释文本框中输入 `<h1>Hello World</h1>` 或 `<script>alert（Hello\
  \ World’);</script>` 时，你会看到图 9-10 所示的错误。\n\n![image](img/f320-01.jpg)\n\n**图 9-10**\n\
  \nASP.NET 运行时这样做是为了防止用户输入可能破坏你网站设计或运行，或可能导致安全风险的 HTML 或 JavaScript。如果你确定要允许用户输入\
  \ HTML，你有几个选项可用。首先，你可以通过将 `@ Page` 指令中的 `ValidateRequest` 属性设置为 `False` 来禁用请求验证：\n\
  \n```\n<%@ Page .... Inherits=\"Contact\" Title=\"Contact Us\" ValidateRequest=\"\
  False\" %>\n```\n\n将此设置为 `False` 后，用户可以输入 HTML 而不会引起错误。在 ASP.NET 的早期版本中，这是允许用户向你的页面发送\
  \ HTML 的唯一方法。这种解决方案的缺点是全有全无。通过在页面级别关闭请求验证，页面中的所有控件现在都接受 HTML。\n\n除了你目前看到的验证控件外，ASP.NET\
  \ 还带有另一种验证机制，将在下一步讨论。\n\n## 在服务器端处理数据\n\n用户在你的 Web Forms 上输入的信息通常不是使网站成为交互式数据驱动系统的唯一数据。在大多数网站中，你还有来自其他数据源的信息，例如数据库、文本、XML\
  \ 文件和 Web 服务。此外，还有流出系统的数据。有人通过联系页面提交信息时，你可能想向网站所有者发送电子邮件，或者当你向网站添加新功能或评论时，你可能想通知人们。对于这些场景，了解\
  \ ASP.NET 如何允许你发送电子邮件至关重要。这将在节节讨论。\n\n### 从你的网站发送电子邮件\n\n\n\n\n编写从 ASP.NET 页面发送电子邮件的代码非常简单。在\
  \ `System.Net.Mail` 命名空间中，你可以找到许多可以轻松创建和发送电子邮件消息的类。这些类允许你创建新消息；在 `To`、`CC` 和 `Bcc`\
  \ 字段中添加收件人；添加附件；当然，还可以发送消息。\n\n下表描述了在从 .NET 应用程序发送电子邮件时通常会到的四个类。\n\n| 类 | 描述 |\n\
  | :--- | :--- |\n| `MailMessage` | 此类表示你将发送的消息。它具有如 `Subject` 和 `Body` 等属性用于设置消息内容；`To`、`CC`\
  \ 和 `Bcc` 属性用于设置收件人；以及一个 `Attachments` 集合用于向消息附加文件。 |\n| `MailAddress` | 此类表示电子邮件中使用的发送者或收件者地址。它有几个构造函数重载，允许你设置电子邮件地址和显示名称。\
  \ |\n| `Attachment` | 此类表示你可以附加到 `MailMessage` 的文件。当你构造 `Attachment` 实例时，可以传递你想要发送的文件名。然后你可以使用\
  \ `Attachments` 集合的 `Add` 方法将附件添加到 `MailMessage` 中。 |\n| `SmtpClient` | 此类用于发送实际消息。默认情况下，该类的实例会检查\
  \ `Web.config` 文件中的设置，例如用于发送邮件的 SMTP 服务器（代表简单邮件传输协议），以及用于发送电子邮件的可选用户名和密码。 |\n\n\
  #### 配置你的网站发送电子邮件\n\n虽然发送电子邮件的代码非常简单，但配置你的应用程序和网络通常会复杂一些。你用于发送电子邮件的机器必须访问 SMTP 服务器，该服务器可以是本地网络可用，也可以通过互联网访问。在大多数情况下，你应该使用与你在电子邮件客户端中相同的\
  \ SMTP 服务器（例如，Microsoft Outlook）。如果你使用外部托管方托管你的站点，则需要使用其提供的 SMTP 服务器。如果你不确定 SMTP\
  \ 服务器，请联系你的网络管理员或 ISP（互联网服务提供商）。\n\n一旦有了 SMTP 服务器地址，可以在 `Web.config` 文件的 `<system.net>`\
  \ 中对其进行全局配置。当你使用来自 ISP 的 SMTP 服务器时，配置设置看起来如下：\n\n```xml\n <system.net>\n    <mailSettings>\n\
  \      <smtp deliveryMethod=\"Network\" from=\"Your Name &lt;you@example.com &gt;\"\
  >\n        <network host=\"smtp.example.com\" />\n      </smtp>\n    </mailSettings>\n\
  </system.net>\n...\n</configuration>\n```\n\n你必须将 `<system.net>` 元素作为 `Web.config`\
  \ 文件根元素 `<configuration>` 的直接子元素。在 `<system.net>` 内部添加 `<mailSettings>` 元素，它包含一个\
  \ `<smtp>` 元素。最后，`<network>` 元素有一个指向你的 SMTP 服务器的 `host` 属性。\n\n`<smtp>` 元素接受可选的\
  \ `from` 属性，允许你以 `Name <Email>` 的格式设置发送者的名称和电子邮件地址。由于 XML 中的角括号（`< >`）具有特殊含义，你需要使用\
  \ `&lt;` 和 `&gt;` 对它们进行转义。当你通过程序发送电子邮件时，可以像在下一个“尝试”练习中那样覆盖此发件地址。\n\n如果你的 ISP 要求在发送电子邮件之前进行身份验证，或希望你使用不同的端口号，你可以将此信息添加到\
  \ `<network />` 元素中：\n\n```xml\n<smtp deliveryMethod=\"Network\" from=\"Your Name\
  \ &lt;you@example.com &gt;\">\n  <network host=\"smtp.example.com\" userName=\"\
  UserName\" password=\"Password\"\n          port=\"587\" />\n</smtp>\n```\n\n端口号因服务器而异。在某些情况下，你可以省略\
  \ `port` 属性，`SmtpClient` 将使用默认端口号（ 25）。其他经常使用的端口号包括 465 和 587。\n\n某些邮件服务器——例如 Gmail\
  \ 提供的——要求你使用*安全套接层* (*SSL*)，这是一种加密到邮件服务器的数据以提高安全性的技术。在 4 之前的 ASP.NET 中，你必须在自己的代码中通过编程启用\
  \ SSL。幸运的是，由于 `<network />` 元素上包含了 `enableSsl` 属性，现在不再如此。要使用 Gmail 服务器或任何需要 SSL\
  \ 的邮件服务器，你可以使用所示的 `<network />` 元素：\n\n```xml\n<network enableSsl=\"true\" host=\"\
  smtp.gmail.com\" password=\"Password\"\n               userName=\"YourAccountName@gmail.com\"\
  \ port=\"587\" />\n```\n\n不要忘记输入你的密码和用户名——在 Gmail 的情况下，这就是完整的 Gmail 电子邮件地址。根据你的设置，你可能需要生成一个应用程序特定的密码，你可以在这里生成：[`bit.ly/N9Wv35`](http://bit.ly/N9Wv35)。\n\
  \n对于 [Outlook.com](http://Outlook.com)（原 Hotmail），你可以使用以下设置：\n\n```xml\n<network\
  \ host=\"smtp.live.com\" password=\"Password\"\n    userName=\"you@example.com\"\
  \ enableSsl=\"true\" port=\"587\" />\n```\n\n对于 Yahoo，你可以使用以下设置：\n\n```xml\n<network\
  \ host=\"smtp.mail.yahoo.com\" password=\"Password\"\n    userName=\"yourname@yahoo.com\"\
  \ />\n```\n\n\n\n\n.NET Framework 带有了一些实用的类和方法，使得文件操作变得非常简单。例如，位于 `System.IO` 命名空间下的\
  \ `File` 类允许你从读取和写入文件、创建和删除文件，以及在磁盘上移动文件。该类仅包含静态方法，这意味着你不需要先创建类的实例。相反，你可以直接在 `File`\
  \ 类上调用方法。例如，要读取文本文件的内容，你可以使用以下代码：\n\nVB.NET\n\n```\nDim myContents As String = System.IO.File.ReadAllText(\"\
  C:\\MyFile.txt\")\n```\n\nC#\n\n```\nstring myContents = System.IO.File.ReadAllText(@\"\
  C:\\MyFile.txt\");\n```\n\n在这个示例中，C# 中的文件名以 `@` 符号为缀，以避免在每个反斜杠（`\\`）前都添加额外的反斜杠。在\
  \ C# 中，反斜杠有特殊含义（它用于“转义”其他具有特殊含义的字符），因此在字符串中使用它时通常需要在它前面加另一个反斜杠。使用 `@` 符号告诉编译器应将其找到的每个反斜杠视为字面量，忽略该字符的特殊含义。它还可以保留字符串内部任何换行符。\n\
  \n下表列出了 `File` 类中允许你操作文件的最常用方法。\n\n| METHOD | VALUE |\n| :--- | :--- |\n| `AppendAllText`\
  \ | 将指定的字符串追加到文件中。如果文件不存在，则先创建它。 |\n| `Copy` | 将文件从一个位置复制到另一个位置。 |\n| `Delete` |\
  \ 从磁盘上删除指定的文件。 |\n| `Exists` | 检查磁盘上是否存在指定的文件。 |\n| `Move` | 将指定的文件移动到不同的位置。 |\n\
  | `ReadAllText` | 读取文本文件的内容。 |\n| `WriteAllText` | 将字符串的内容写入新文件，如果目标文件已存在，则覆盖它。\
  \ |\n\n你可以将这些方法用于各种用途。例如，当用户上传了一个文件时，你可以使用 `Move` 方法将其移动到不同的文件夹。此外，当你想要丢弃不再需要的上传文件时，你可以使用\
  \ `Delete` 方法。\n\n`ReadAllText` 方法用于读取文本文件的完整内容。例如，在通过电子邮件发送文本时，你可以将邮件正文存储在文本文件中。当你准备发送邮件时，调用\
  \ `ReadAllText` 并该方法返回的内容赋值给邮件正文。你可以在接下来的“尝试一试”中看到它的工作原理。\n\n当你在联系表单中填写详细信息并点击发送按钮时，你可能会注意到页面闪烁，因为页面正在提交到服务器并随后带有成功消息重新加载。使用\
  \ Ajax 技术可以轻松地减少或完全消除这种页面闪烁，这些技术将在下一节中讨论。\n\n## 数据验证的实用提示\n\n以下列表提供了关于验证数据的实用提示：\n\
  \n*   始终验证所有用户输入。每当你在互联网上拥有公共网站时，你就失去了控制其访问者的能力。为了防止恶意用户向你的系统输入虚假数据，请务必使用 ASP.NET\
  \ 验证控件对用户的输入进行验证。\n*   始终在验证控件中提供有用的错误信息。可以将错误消息分配给 `ErrorMessage` 属性并留空 `Text`\
  \ 属性，或者使用 `ValidationSummary` 控件显示错误消息列表。\n*   考虑使用验证控件的 `CssClass` 属性将错误消息的样式定义移动到单独的\
  \ CSS 文件中，而不是直接设置在验证控件上。\n*   每当你编写发送电子邮件消息的代码时，考虑将邮件正文移动到存储 `App_Data` 文件夹的单独文本文件中，因为这会让你的应用程序更容易维护。\n\
  *   在文本或 XML 文件中存储数据时，务必将它们存储在专门为此目的设计的 `App_Data` 文件夹中。这样，你所有的数据文件都会整齐地封装在一起。更重要的是，默认情况下\
  \ Web 服务器阻止访问此文件夹中的文件，因此网站访问者无法直接请求它们。\n*   在测试发送电子邮件时，始终将其发送到存在且有效的地址。即使像 `asdf@test.com`\
  \ 这样的地址看起来可能无效，但该账户很有可能存在并受到监控，这可能导致敏感数据的泄露，例如你可能通过电子邮件发送的密码。\n*   在开发期间，考虑使用 `SpecifiedPickupDirectory`\
  \ 作为 SMTP 邮件的 `deliveryMethod`。这避免了通过网络发送消息的需求，从而获得更快的响应和更干净的收件箱。\n\n## 总结\n\n用户输入是大多数交互式网站的重要方面。输入来自网站中不同的来源：你在本章中创建的联系表单、查询字符串和其他来源。为了防止用户向你的系统输入无效甚至危险的内容，在处理数据之前对所有输入进行验证至关重要。\n\
  \nASP.NET 自带的验证控件最大的优势是它们可以在客户端和服务器端运行，这使得你能够创建响应式表单，用户可以对他们犯的任何错误获得立即反馈，而无需进行完全的回传（postback）。同时，数据在服务器端进行验证，确保来自不使用\
  \ JavaScript 的客户端的数据也是有效的。\n\n要存储用户提交给你网站的信息，你有几种选择。数据可以存储在数据库或文本文件中，也可以通过电子邮件发送。后者选项对于联系表单特别有用，这样当有人在你的网站上留言时，你就能收到立即提醒。使用\
  \ `System.Net.Mail` 命名空间中的类发送电子邮件非常轻易。这些类允许你创建电子邮件消息、添加主题、正文、发送者和收件者信息，然后使用 `SmtpClient`\
  \ 发送消息。\n\n\n\n\n在过去的几年里，Ajax 在 Web 开发社区中极大地普及。虽然驱动 Ajax 的技术已经存在很长时间，但直到 2005 年初它才获得了一个正式名称。Ajax\
  \ 是 `Asynchronous JavaScript And XML`（异步 JavaScript 和 XML）的缩写，它允许你的客户端网页通过`asynchronous\
  \ calls` 与服务器交换数据，这意味着它们在运行时不会阻塞用户界面。可能由 Ajax 驱动的最受欢迎的功能是“无闪烁页面”，它让你你能够在不刷新整个页面的情况下向服务器进行回传（postback）。请注意，Ajax\
  \ 这个术语已不再完全涵盖底层的技术。异步 JavaScript 仍然用于发起调用，但在许多情况下，作为数据格式的 XML 已被 `JSON`（JavaScript\
  \ 对象表示）取代，正如你在本章后续部分所看到的。\n\n为了用 Ajax 功能增强你的网站，你可以从不同的 Ajax 框架中选择。在早期的 Visual Studio\
  \ 和 ASP.NET 版本中，微软提供了一个用于 Ajax 交互的服务器端框架和一个客户端脚本库。这个客户端脚本库——虽然在 `ASP.NET 4.5.1`\
  \ 中仍然存在——但已不再是推荐的解决方案。相反，我们鼓励你使用 `jQuery`，它将在下一章中详细讨论。\n\nMicrosoft ASP.NET AJAX\
  \ 的服务器端提供的远比无闪烁回传要多。除了使无闪烁页面成为控件外，Microsoft ASP.NET AJAX 还为你提供了更多服务器控件，用于创建丰富、交互式且响应式用户界面。\n\
  \n在本章结束时，你应该对 ASP.NET AJAX 框架提供的各种服务器控件有良好的理解。你还将对如何使用 ASP.NET 创建 `WCF Services`\
  \ 以及你如何从客户端 JavaScript 代码调用它们有基本的了解。\n\n# 介绍 AJAX\n\n在本书的第一章中，你学习了浏览器如何与服务器交互。正如你在第\
  \ 4 节和第 9 节中看到的，浏览器使用 `GET` 或 `POST` 请求页面。服务器处理该页面并返回生成的 HTML。浏览器随后解析该 HTML 并将页面渲染给用户，可选地下载任何外部资源，如图像、脚本文件和级联样式表（`CSS`）。当用户与页面交互时（例如，通过点击按钮提交填写的联系表单），页面将回传到服务器，之后整个页面又会在浏览器中重新加载。图\
  \ 10-1 左侧显示了此过程的视觉表示。\n\n![image](img/f339-01.jpg)\n\n**图 10-1**\n\n尽管这种模型已用于多年来提供网页，但它有几个巨大的缺点。首先，由于回传后会加载整个页面，发送到浏览器的\
  \ HTML 比实际需要的要大得多。回想你在上一章中创建的联系表单。在用户提交联系表单后，服务器会显示一个带有 `Message Sent`（消息已发送）文本的\
  \ `Label` 控件。它是通过完全加载一个新页面来实现的，隐藏表单控件并显示消息。即使页面的其他部分没有变化（菜单、侧边栏、页脚等），它们仍然会从服务器发送到客户端。理想情况下，你只想发送发生变化的\
  \ HTML。在联系表单的情况下，这可能少到只有 `Message Sent` 文本。图 10-1 的右侧显示了这是如何工作的。服务器不是发送整个页面作为响应，而是发送一个部分响应（包含略多于\
  \ `Message Sent` 文本的内容），然后由浏览器仅更新页面中变化的部分，而保持页面的其余部分不变。\n\n全页加载的第二个缺点与浏览器渲染页面的方式有关。由于整个页面被替换，浏览器必须放弃旧页面然后绘制新页面。这会导致页面“闪烁”，从而导致不佳的用户体验。你可以部署\
  \ Ajax 技术来克服这两个问题，正如你在本章的剩余部分所看到的。\n\nAjax 背后的概念已经存在多年了。从 Internet Explorer 5 以来，浏览器一直带有一个\
  \ `XMLHttpRequest` 对象，它允许你从 JavaScript 发起对服务器调用以发送和接收数据。然而，人们也使用其他技术来模拟现在被称为 Ajax\
  \ 的行为，包括 Macromedia Flash、`iframe` 元素或隐藏帧。\n\n然而，当 Ajax 术语引入时，事情真正开始腾飞发展。为了尝试保持领先地位，微软开始构建\
  \ ASP.NET AJAX，这是一个完全集成在 ASP.NET 和 Visual Studio 中的 Ajax 框架。该框架提供了许多你作为 Web 开发人员可以利用的优势来创建响应式应用程序。\n\
  \n特别是，ASP.NET AJAX 允许你：\n\n*   创建无闪烁页面，让你能够在不完全重新加载且不影响页面其他部分的情况下刷新页面的部分内容\n*  \
  \ 在这些页面刷新期间向你的用户提供反馈\n*   使用定时器定期更新页面的部分并调用服务器端代码\n*   访问服务器端 `WCF` 和其他服务并与它们返回的数据进行工作\n\
  \nASP.NET AJAX 的良好之处在于它非常容易上手。创建一个无闪烁页面只需要从工具箱中将几个控件拖放到你的页面上即可。当你理解了 Ajax 框架的基础知识后，可以通过查看更高级的主题（如调用\
  \ `W services`）来扩展你的知识。\n\n# 在项目中使用 ASP.NET AJAX\n\nASP.NET AJAX 完整集成在 ASP.NET 和\
  \ VS 中，这意味着你可以立即开始使用。你在 VS 中创建的每个新的 `ASP.NET 4.5.1` Web 项目都已启用了 Ajax。此外，工具箱包含一个\
  \ AJAX 扩展类别，其中有许多可以在页面使用的 Ajax 相关的控件。Visual Studio 对 ASP.NET AJAX 有很好的支持，不仅为服务器端的控件提供智能提示，还为你编写的与客户端页面以及服务器上运行的代码交互的客户端\
  \ JavaScript 提供智能提示。\n\n## 创建无闪烁页面\n\n为了避免你的 ASPX 页面进行全页回传并仅更新部分页面，可以使用 `UpdatePanel`\
  \ 服务器控件。为了让该控件正确运行，你还需要 `ScriptManager` 控件。如果你打算在许多 ASPX 页面中使用 Ajax 功能，可以将 `ScriptManager`\
  \ 放在主页中，这样对于基于该主页的所有页面都可用。每个页面只能有一个 `ScriptManager`，所以如果你在主页中添加了一个，就不能在内容页面中添加另一个。要从内容页面访问主页中定义的\
  \ `ScriptManager` 控件，可以使用后文介绍的 `ScriptManagerProxy` 控件。\n\n接两个部分介绍了 `UpdatePanel`\
  \ 和 `ScriptManager` 控件。在介绍之后，你将如何在 Planet Wrox 网站的页面中使用这些控件。后续章节将为你介绍 `UpdateProgress`、`Timer`\
  \ 和 `ScriptManagerProxy` 控件。\n\n### UpdatePanel 控件\n\n\n\n\n\n`UpdatePanel` 控件创建无闪烁页面的关键组件。在最基本的应用中，你只需要将该控件包裹在你想要更新的内容周围，并在页面上添加一个\
  \ `ScriptManager`，操作就完成了。每当 `UpdatePanel` 内部的任一控件导致向服务器的后传（postback）时，只有该 `UpdatePanel`\
  \ 内部的内容会被刷新。\n\n为了了解 `UpdatePanel` 控件解决了哪些问题以及它在客户端页面上的行为，下面的“试一试（Try It Out）”展示了一个简单示例，该示例使用面板来避免在回传期间出现页面闪烁。\n\
  \n在本次练习中，你使用了两个重要的 AJAX 扩展控件。`ScriptManager` —— 在本次练习中你直接放置于 `UpdatePanel.aspx`\
  \ 中 —— 是 ASPX 页面中大多数 Ajax 功能正常运行的先决条件。它充当了客户端页面与 Microsoft ASP.NET AJAX 框架之间的桥梁，并处理如注册浏览器中使用的正确\
  \ JavaScript 文件等工作。然后，使用 `UpdatePanel` 来定义你想要更新而无需重新加载整个面的区域。你将在后续章节中更详细地查看这两个控件。\n\
  \n### 深入了解 UpdatePanel\n\n当你点击按钮时（如在上一个练习中讨论过的），`UpdatePanel` 及其内容是页面中唯一更新的部分。这是\
  \ `UpdatePanel` 的默认行为，其内部内容仅由 `<ContentTemplate>` 元素内定义的其他服务器控件刷新。然而，`UpdatePanel`\
  \ 的功能不仅于此，正如你在下一节中看到的。\n\n#### 常见的 UpdatePanel 属性\n\n下表列出了 `UpdatePanel` 的一些重要属性，这些属性允许你影响它的行为。\n\
  \n| 属性 (PROPERTY) | 描述 |\n| :--- | :--- |\n| `ChildrenAsTriggers` | 此属性决定位于 `UpdatePanel`\
  \ 内部的控件是否可以触发 `UpdatePanel` 的刷新。默认值为 `True`，正如你在上一个练习中看到的那样。当你将此值设置为 `False` 时，必须将\
  \ `UpdateMode` 设置为 `Conditional`（条件）。注意，这样设置后，控件将不再触发刷新。 |\n| `Triggers` | `Triggers`\
  \ 集合包含 `PostBackTrigger` 和 `AsyncBackTrigger` 元素。前者在你希望通过普通的页面回传触发刷新，而后者则在你希望通过异步回传触发刷新时使用。\
  \ |\n| `RenderMode` | 你可以将此属性设置为 `Block`（阻塞）或 `Inline`（内联），以决定 `UpdatePanel` 是以\
  \ `<div>` 还是 `<span>` 元素呈现。默认值为 `Block`。 |\n| `UpdateMode` | 此属性决定是始终（`Always`）刷新，还是仅在特定条件下（`Conditional`）才刷新。默认值为\
  \ `Conditional`。 |\n| `ContentTemplate` | 尽管在某些情况下可能不需要它，但 `ContentTemplate` 允许你在\
  \ `UpdatePanel` 内部定义要更新的区域。 |\n\n#### UpdatePanel 的注意事项\n\n关于 `UpdatePanel` 的注意事项，正如你在后续章节中看到的。\n\
  \n在 `UpdatePanel` 出现时，尽管它看起来可以部分刷新，但这样做是有代价的。在回传期间，尽管 `UpdatePanel` 允许部分页面刷新，但某些情况下整个页面仍然加载。在服务器端，当\
  \ `UpdatePanel` 包含某些功能时，它可能会增加额外的开销。在`````` 处理 JavaScript 资源。在客户端页面中，`UpdatePanel`\
  \ 能够处理 JavaScript 脚本。\n\n### ScriptManager 控件\n\n`ScriptManager` 控件充当客户端页面与服务器之间的桥梁。它管理\
  \ JavaScript 资源（如前面所示），处理页面更新，并与 WCF 服务进行交互。\n\n你通常会直接将 `ScriptManager` 放在内容页，如果你认为只有少数页面需要\
  \ AJAX 功能。你在之前的“试一试”中简要看到了它的工作原理。然而，你也可以将 `ScriptManager` 放在主页中，以便整个站点可以使用。你可以在后续章节这样做。\n\
  \n`ScriptManager` 类有许多属性，大部分用于高级场景。在许多情况下（正如你刚刚使用 `UpdatePanel` 更新页面），不需要更改 `ScriptManager`\
  \ 的任何属性。在其他场景，你可能需要更改或设置某些属性。下表列出了 `ScriptManager` 控件的一些常用属性。\n\n| 属性 (PROPERTY)\
  \ | 描述 |\n| :--- | :--- |\n| `AllowCustomErrorsRedirect` | 此属性决定 Ajax 操作期间发生的错误是否会导致重定向到自定义错误页。默认值为\
  \ `True`；设置为 `False`，错误将以 JavaScript 窗口的形式显示，或者在禁用调试时对客户端隐藏。注意，如果你没有配置任何错误页，无论此设置值如何，错误始终以\
  \ JavaScript 警告的形式显示。 |\n| `AsyncBackErrorMessage` | 当你不使用自定义错误页时，此属性允许你自定义 Ajax\
  \ 错误时用户看到的错误消息。它允许你隐藏细节并向用户提供更友好的错误消息。 |\n| `EnablePartialRendering` | 此属性决定 `ScriptManager`\
  \ 是否支持使用 `UpdatePanel` 控件进行页面部分渲染。你应该将此设置为 `True`，除非你想阻止整个面的更新。 |\n| `EnableCdn`\
  \ | 当此属性设置为 `True` 时，ASP.NET 会包含指向微软内容分发网络上的客户端框架文件的链接，而不是在你自己的服务器上。这可以节省你的带宽，并在用户通过访问其他使用这些文件的网站时已有缓存的情况下，加快页面初始加载。\
  \ |\n| `AjaxFrameWorkMode` | 决定是否包含 Microsoft AJAX 客户端库。此设置允许你使用 `ScriptManager`\
  \ 执行服务器任务（如注册客户端脚本），而无需在页面中嵌入客户端框架。 |\n| `Scripts` | `ScriptManager` 控件的 `<Scripts>`\
  \ 子元素允许你添加在运行时由客户端下载的附加 JavaScript 文件。 |\n\n\n\n\n\n| `CompositeScript` | 类似于 `<Scripts>`\
  \ 元素，`<CompositeScript>` 元素允许你添加额外的 JavaScript 文件。然而，在 `<CompositeScript>` 下注册的文件会被合并成单个可下载文件，从而最大限地减少了网络开销并提高性能。\
  \ |\n| `Services` | `<Services>` 元素允许你定义客户端页面可以访问的 WCF 服务。在本章的后半部分，你将了解到如何使用 WCF\
  \ 服务。 |\n\n尽管 `UpdatePanel` 和 `ScriptManager` 共同满足了创建无闪烁页面的所有需求，但 ASP.NET AJAX 还提供了更多功能来增强启用\
  \ Ajax 的网站中的用户体验。提高用户体验的一种方法是使用接下来要讨论的 `UpdateProgress` 控件。\n\n### 向用户提供反馈\n\n尽管回传（postbacks）通常会引起视觉问题，但它们有一个巨大的优势：用户可以看到正在发生的操作。`UpdatePanel`\
  \ 让这一点变得稍微困难了一些。在操作完成之前，用户没有任何视觉提示知道某些操作正在进行。为了让用户在处理请求时稍等几秒钟，你可以使用 `UpdateProgress`\
  \ 控件。\n\n#### UpdateProgress 控件\n\n你使用 `AssociatedUpdatePanelID` 属性将 `UpdateProgress`\
  \ 控件连接到 `UpdatePanel`。它的内容在 `<ProgressTemplate>` 元素中定义，并在关联的 `UpdatePanel` 忙于刷新时显示。你通常会在此模板中放置如“请稍候”之类的文本或动画图像，让用户知道操作正在进行，尽管其他标记也是允许的。\n\
  \n除了 `AssociatedUpdatePanelID` 和 `<ProgressTemplate>` 属性外，`UpdateProgress` 控件还具有你通常使用的以下属性。\n\
  \n| 属性 | 说明 |\n| :--- | :--- |\n| `DisplayAfter` | 决定控件在显示内容之前等待的毫秒数。当刷新周期短到至于显示通知消息会显得多余时，这非常有用。默认值为\
  \ 500 毫秒，即半秒。 |\n| `DynamicLayout` | 决定控件在隐藏时是否占用屏幕空间。这直接映射到 CSS 的 `display: none;`（当此设置为\
  \ `true` 时）或 `visibility: hidden;`（当设置为 `false` 时）。 |\n\n在接下来的练习中，你将看到如何结合 `UpdatePanel`、`ScriptManager`\
  \ 和 `UpdateProgress` 控件，使联系表用户控件实现无闪烁。\n\n除了你通过“发送”按钮看到的用户触发的页面更新外，你还可以按照指定的间隔通过编程方式触发页面刷新，将在下一节中进行讨论。\n\
  \n### Timer 控件\n\n你在工具箱的 AJAX 扩展类别中找到 `Timer` 控件非常适合重复地执行服务器端代码。例如，你可以用它每 5 秒更新一次\
  \ `UpdatePanel` 的内容。此 `UpdatePanel` 的内容可以来自各种来源，例如包含论坛最新帖子的数据库、新闻网站的新闻项目、包含在浏览器中轮播广告信息的\
  \ XML 文件、来自股票 Web 服务的报价等。\n\n`Timer` 控件的使用非常简单。在指定的间隔上，控件会触发其 `Tick` 事件。在该事件的事件处理程序内部，你可以执行任何你认为合适的代码。以下代码段显示了简单的\
  \ `UpdatePanel` 和 `Timer` 控件的标记，你可以根据主页将其放置在内容页面中：\n\n```asp\n<asp:UpdatePanel ID=\"\
  UpdatePanel1\" runat=\"server\">\n  <ContentTemplate>\n    <asp:Label ID=\"Label1\"\
  \ runat=\"server\"></asp:Label>\n    <asp:Timer ID=\"Timer1\" runat=\"server\" Interval=\"\
  5000\" OnTick=\"Timer1_Tick\" />\n  </ContentTemplate>\n</asp:UpdatePanel>\n```\n\
  \n当定时器“滴答”时，它会引发 `Tick` 事件，你可以用以下代码处理它：\n\nVB.NET\n\n```vb\nProtected Sub Timer1_Tick(sender\
  \ As Object, e As EventArgs) Handles Timer1.Tick\n  Label1.Text = System.DateTime.Now.ToString()\n\
  End Sub\n```\n\nC#\n\n```csharp\nprotected void Timer1_Tick(object sender, EventArgs\
  \ e)\n{\n  Label1.Text = System.DateTime.Now.ToString();\n}\n```\n\n当这段代码在浏览器中运行时，标签将每隔\
  \ 5 秒更新一次当前日期和时间。如果你想让它跳得更慢或更快，需要调整其 `Interval` 属性，该属性指定以毫秒为单位。\n\n这种自动更新面板并可以通过点击按钮刷新内容的场景非常常见。自动刷新面板是一种向用户提供服务器最新信息的非侵入式方法。此外，你还可以为用户提供一个按钮，让他们可以在选择的任何时刻强制刷新数据。从编码的角度来看，你不需要做太大更改；你可以在\
  \ `Timer` 的 `Tick` 事件处理程序和 `Button` 的 `Click` 事件处理程序中调用相同的代码（最好封装在一个单独的方法中）。\n\n\
  有关 `Timer` 控件的更多信息，请查阅 MSDN 上的文档：[`tinyurl.com/TimerClass4-5`](http://tinyurl.com/TimerClass4-5)。\n\
  \n你现在已经了解了 ASP.NET AJAX 框架提供的最重要的服务器端控件。在本章的剩余部分中，你将找到关于在启用 Ajax 的网页中中使用 WCF 服务的讨论。在讨论\
  \ Web 服务期间，你将看到如何使用 AJAX 扩展类别中的最后一个控件 `ScriptManagerProxy`。\n\n## 在 Ajax 网站中使用 Web\
  \ 服务\n\n在 Ajax 网站调用 Web 服务是你 Web 开发工具包的一个极大补充。能够调用 Web 服务意味着现在更容易从客户端访问数据，这为全回传提供了一个极佳的替代方案。下一节将讨论\
  \ Web 服务。\n\n### 什么是 Web 服务？\n\nWeb 服务本质上是可以在互联网上调用并向调用者返回数据的方法。这使得它们成为不同系统之间交换数据的理想选择。因为\
  \ Web 服务基于可靠且广为人知的标准，使得不同平台和系统之间的数据交换变得简单。例如，通过 Web 服务，可以在运行 Windows 上的 ASP.NET\
  \ 网站与运行 Linux 上的 PHP 网站之间交换数据。同时，还可以使用 JavaScript 在 ASP.NET 或 PHP 网站与浏览器之间交换数据。\n\
  \nWCF 服务方法是下一节的主题。\n\n\n\n\n\n有关其他受支持技术的信息，请查看 MSDN 网站上的这篇文章：[`msdn.microsoft.com/library/dd943056.aspx`](http://msdn.microsoft.com/library/dd943056.aspx)，或获取书籍\
  \ *Professional WCF 4: Windows Communication Foundation with* .NET 4 (Pablo Cibraro,\
  \ Kurt Claeys, Fabio Cozzolino, Johann Grabner; Wrox, 2010; ISBN: 978-0-470-56314-4)。\n\
  \n要构建 WCF Web 服务，你需要向项目中添加一个 WCF 服务（带有 `.svc` 扩展名）。正如你稍将看到的，你有几个不同的模板可用，每个模板都有不同的用途。在该服务文件中，你定义了一个\
  \ `Service Contract`（服务合约）和一个 `Operation Contract`（操作合约）。`Service Contract` 定义了整个服务，而\
  \ `Operation Contract` 定义了该服务上提供的各种方法。下面的代码段显示了一个带方法的简单 WCF 服务：\n\n#### VB.NET\n\
  \n```vb\n<ServiceContract(Namespace:=\"\")>\n<AspNetCompatibilityRequirements(\n\
  \       RequirementsMode:=AspNetCompatibilityRequirementsMode.Allowed)>\nPublic\
  \ Class NameService\n  <OperationContract()>\n  Public Function HelloWorld(name\
  \ As String) As String\n    Return String.Format(\"Hello {0}\", name)\n  End Function\n\
  End Class\n```\n\n#### C#\n\n```csharp\n[ServiceContract(Namespace = \"\")]\n[AspNetCompatibilityRequirements(\n\
  \      RequirementsMode = AspNetCompatibilityRequirementsMode.Allowed)]\npublic\
  \ class NameService\n{\n  [OperationContract]\n  public string HelloWorld(string\
  \ name)\n  {\n    return string.Format(\"Hello {0}\", name);\n  }\n}\n```\n\n你通过在类上应用\
  \ `ServiceContract` 属性来定义 `Service Contract`。属性（attribute）就像是一个小标签或标记，你可以将其贴在类、方法、属性等代码元素上，以将该部分代码标记为特殊内容。其他与带标记代码交互的代码随后可以看到该代码包含哪些属性，并根据这些信息做出决策。不用过于担心，因为在处理\
  \ Web 服务时，你不需要亲自读取这些属性。你只需要将属性贴在类或方法上，即可为 WCF 中启用它。\n\n在 C# 中，你使用中方括号包裹属性，而 VB.NET\
  \ 使用角括号。你可能还会遇到 VB.NET 属性后面跟着空格和下划线的示例，这是因为旧版本的 VB.NET 需要这样做。你现在不再需要下划线了，尽管使用它也是完全有效的。\n\
  \n一旦放置了这个属性，你就向运行时发送了信号，表示你确实想将此类暴露为 WCF 服务。\n\n应用到服务类上的 `AspNetCompatibilityRequirements`\
  \ 属性决定了 WCF 服务在运行时的行为。`Allowed` 值允许你的服务运行在所谓的 ASP.NET 兼容模式（Compatibility Mode）中，该模式以类似于运行\
  \ ASMX 服务的方式运行 WCF 服务。当你将值设置为 `NotAllowed` 时，你的服务将无法在 ASP.NET 网站中正常运行。\n\n除了类上的属性外，你想要暴露给服务的每个方法都用\
  \ `OperationContract` 属性标记。这种可选包含模型（opt-in model）允许你创建其他方法（例如，从服务方法中调用的辅助方法），而不会将它们从服务暴露出来。\n\
  \n#### 从客户端代码调用服务\n\n从客户端 HTML 页面调用 WCF 服务非常简单。ASP.NET 通过生成与服务交互所需的 JavaScript 来你处理了大部分艰性工作。你只需要用\
  \ `ScriptManager` 控件注册服务，然后从客户端代码调用它。根据你之前看到的 `NameService`，你如下所示设置 `ScriptManager`：\n\
  \n```asp\n<asp:ScriptManager ID=\"ScriptManager1\" runat=\"server\">\n  <Services>\n\
  \    <asp:ServiceReference Path=\"~/WebServices/NameService.svc\" />\n  </Services>\n\
  </asp:ScriptManager>\n```\n\n在此示例中，服务文件名为 `NameService.svc`，位于网站根目录下的 `WebServices`\
  \ 文件夹中。\n\n一旦设置好服务，你就可以像这样在 ASPX 页面的客户端 JavaScript 中调用服务：\n\n```javascript\nNameService.HelloWorld('Imar',\
  \ helloWorldCallback);\n\nfunction helloWorldCallback(result)\n{\n  alert(result);\n\
  }\n```\n\n注意，这段代码混合使用了小驼峰命名法（camel case）和帕斯卡命名法（Pascal case）。为了符合 .NET 编程指南，服务方法使用了帕斯卡命名法，并写为\
  \ `HelloWorld`。在 JavaScript 中，通常使用小驼峰命名法编写方法，因此回调方法写为小写字母“h”的 `helloWorldCallback`。我在整个章节中将坚持这些命名规范，这将帮助你判断某个是纯客户端方法还是服务端方法。要调用服务方法，你使用\
  \ `ServiceName.MethodName`。因此，在前面的示例中，`NameService` 是服务的名称，`HelloWorld` 是你想要调用的方法。当你在\
  \ Visual Studio 中输入此代码（并在内容页使用的主页的 `ScriptManager` 中注册服务）时，你将获得 IntelliSense 帮助，如图\
  \ 10-5 所示。\n\n![image](img/f354-01.jpg)\n\n**图 10-5**\n\n尽管服务定义只有一个参数（`name` 参数），但此示例中的客户端方法有四个参数。第一个是我在\
  \ `HelloWorld` 服务方法中设置的 `name` 参数。第二个参数允许你传递一个成功回调——你定义的方法，该方法在服务调用成功完成时被调用。在代码示例中，此方法被称为\
  \ `helloWorldCallback`。你可以以任何想要的方式命名此方法（只要它是 JavaScript 中的有效名称），但我更倾向于将其称为 `serviceNameCallback`，以清晰表示它是为哪个代码提供回调。作为参数，回调方法接收从服务返回的值。在此示例中，此结果是一个简单的字符串，但稍后你会看到如何传递复杂对象。第三个参数也是回调方法，并在服务调用由于原因失败时调用（例如，因为服务遇到错误或不可用）。最后一个参数是\
  \ `userContext`，允许你向回调方法传递额外数据。如果你需要额外的上下文数据来正确处理回调，这就会很有用。在此示例中，第一个参数是必须的，另外三个是可选的。然而，在大多数真实场景中，你至少需要实现\
  \ `onSuccess` 回调，以便处理从服务返回的数据。\n\n在此示例中，成功回调 `helloWorldCallback` 中的代码非常简单；它所做的只是弹出从服务返回的值。然而，它不必是这样。你从服务返回的值不仅限于简单字符串，正如你在下一节所示。\n\
  \n#### 使用 WCF 交换复杂对象\n\n\n\n\n\n```vb\n<ServiceContract(Namespace:=\"\")\n<AspNetCompatibilityRequirements(\n\
  \      RequirementsMode:=AspNetCompatibilityRequirementsMode.Allowed)>\nPublic Class\
  \ ReviewsService\n\n  <OperationContract()>\n  Public Function GetLatestReviews()\
  \ As List(Of Review)\n    Dim temp As New List(Of Review) From\n    {\n      New\
  \ Review() With {.Id = 1,\n       .Title = \"21st Century Breakdown by Green Day\"\
  },\n      New Review() With {.Id = 2,\n       .Title = \"Sonic Youth: Daydream Nation\
  \ live in Roundhouse, London\"}\n    }\n    Return temp\n  End Function\nEnd Class\n\
  \nPublic Class Review\n  Public Property Id As Integer\n  Public Property Title\
  \ As String\nEnd Class\n```\n\nC#\n\n```csharp\n[ServiceContract(Namespace = \"\"\
  )]\n[AspNetCompatibilityRequirements(\n         RequirementsMode = AspNetCompatibilityRequirementsMode.Allowed)]\n\
  public class ReviewsService\n{\n  [OperationContract]\n  public List<Review> GetLatestReviews()\n\
  \  {\n    List<Review> temp = new List<Review>()\n    {\n      new Review() {Id\
  \ = 1,\n         Title = \"21st Century Breakdown by Green Day\"},\n      new Review()\
  \ {Id = 2,\n         Title = \"Sonic Youth: Daydream Nation live in Roundhouse,\
  \ London\"}\n    };\n    return temp;\n  }\n}\n\npublic class Review\n{\n  public\
  \ int Id { get; set; }\n  public string Title { get; set; }\n}\n```\n\n为了向你展示如何在客户端处理复杂数据，此代码示例返回了两个硬编码的\
  \ `Review` 实例。在随后的章节中，你将看到如何处理数据库中的评论，从而使此示例具有真正的动态性。目前目前，它仅仅起到在客户端显示评论的作用。\n\n\
  该代码设置了一个 `Review` 实例的泛型集合。目前，`Review` 是一个带有两个属性的简单类：`Id` 和 `Title`。然后使用集合初始化器填充集合，该初始化器添加了两个\
  \ `Review` 实例，每个实例都是使用对象初始化器创建的。关于集合初始化器和对象初始化器的更多信息，请参阅第 5 章。\n\n当你从客户端代码调用 `GetLatestReviews`\
  \ 方法时，你将获得一个 `Review` 实例集合，你可以对其进行遍历。以下代码显示了实现此操作的 `getLatestReviewsCallback` 方法：\n\
  \n```\nfunction getLatestReviewsCallback(result)\n{\n  var listItems = '';\n  for\
  \ (i = 0; i < result.length; i++)\n  {\n    listItems += '<li>' + result[i].Title\
  \ + '</li>';\n  }\n  document.getElementById('Reviews').innerHTML = listItems;\n\
  }\n```\n\n这段代码首先声明了一个用于存储评论标题的字符串。然后它遍历 `result` 变量中的评论。JavaScript 不支持 `foreach`，但使用标准的\
  \ `for` 循环可以轻松地访问集合中的所有项。在 `for`\n\n循环内部，使用 `result[i].Title` 获取评论标题，然后将其封装在一对 `li`\
  \ 标签中并追加到字符串变量中。最后，将该字符串作为名为 `Reviews` 的元素的 `innerHTML`（该元素在代码中可能如下：`<ul id=\"Reviews\"\
  ></ul>`），这样评论标题最终会出现在无序列表中。\n\n当你输入这段代码时，你会发现没有针对 `result` 对象的 IntelliSense（智能感知）。VS\
  \ 不知道 `result` 变量实际类型，因此无法帮助你找到如 `Id` 和 `Title` 之类的属性。\n\n注意，这段代码有点笨拙。使用 `document.getElementById`\
  \ 和 `innerHTML` 不是编写此类代码的最佳方式。因此，下一章在讨论 jQuery 时将为你介绍更好的替代方案。不过，目前这足够了，它展示了处理从 WCF\
  \ 服务返回的复杂对象的核心概念。\n\n重要的是，你在 JavaScript 中处理的 `Reviews` 对象与你在服务中使用的对象并不完全相同。你的 VB.NET\
  \ 或 C# 代码目标是服务器端的 .NET Framework，而你的 JavaScript 运行在客户端。为了将对象传输到客户端，WCF 将评论集合序列化为\
  \ JavaScript 对象表示法（`JSON`）——这是你对象的字符串表示，可以直接用于在你的 JavaScript 代码中。你将在随后的练习中看到 `JSON`\
  \ 的示例。\n\nPlanet Wrox 项目中的 Web 服务将仅用于让浏览器中的客户端页面与服务器通信并交换数据。因此，在这个站点中，服务器和客户端位于同一个\
  \ Web 项目中——一个运行在客户端（调用 Web 服务器的 JavaScript），另一个存在于服务器端（Web 服务本身）。从安全的角度来看，这是最简单的解决方案，因为两部分都相互信任。\n\
  \n如果你想让客户端页面与不同域的 Web 服务通信，你可以在自己的站点上托管一个服务来调用远程 Web 服务。然后客户端浏览器调用你的服务，再由你的服务反过来调用远程服务。不过，这种场景超出了本章的范围。\n\
  \n你将在下面的练习中看到此 WCF 理论的实践。\n\n### 创建 Web 服务\n\n使用 VS 创建 WCF 服务非常简单。与所有其他类型的文件档一样，VS\
  \ 都带了 WCF 服务的模板。你使用“添加新项”对话框将服务添加到站点中。然后你修改服务代码以符合你的需求。接下来，你在 `ScriptManager` 或\
  \ `ScriptManagerProxy` 中注册该服务，然后就可以准备好从客户端调用它了。\n\nVS 提供了几种不同的模板来创建 WCF 服务。要创建一个可以从网站调用的服务，你可以使用“WCF\
  \ 服务(启用 Ajax)”模板。当你基于此模板添加服务时，VS 会在 `Web.config` 文件中为你添加调用该服务的必要配置。此外，该服务的编码模型比标准的\
  \ WCF 服务模板简单一点，因为它所有代码都存储在一个类文件中。\n\n服务创建后，接下来的步骤是在 `ScriptManager` 中注册它并从客户端代码调用它。这两个主题将在后续讨论。\n\
  \n#### 配置 ScriptManager\n\n在本章早前的章节中，你已经看到 `ScriptManager` 控件是几乎所有 Ajax 操作的组件。它注册客户端\
  \ JavaScript 文件（Ajax 框架使用的以及可选的自定义），处理 `UpdatePanel` 的部分页面更新，并处理与你在网站中定义的 Web 服务交互。你可以将\
  \ `ScriptManager` 添加到单个页面，也可以添加到主页，以便在整个站点中可用。\n\n使用 Web 服务时，你还需要告诉 `ScriptManager`\
  \ 你想将 Web 服务暴露给客户端脚本。你有两种方法可以实现这一点：\n\n*   在主页的 `ScriptManager` 中\n*   在使用 Web 服务的内容页中使用\
  \ `ScriptManagerProxy` 类\n\n当你需要在所有或大多数页面中使用 Web 服务时，最好的做法是在主页的 `ScriptManager`\
  \ 中声明 Web 服务。你可以通过给 `ScriptManager` 控件提供一个 `Services` 元素来实现，该元素包含一个或多个指向你的公共服务的\
  \ `ServiceReference` 元素。例如，为了让你创建的 `NameService.svc` 服务在站点的所有页面中可用，你需要在主页中添加以下突出代码：\n\
  \n```\n<asp:ScriptManager ID=\"ScriptManager1\" runat=\"server\">\n  <Services>\n\
  \    <asp:ServiceReference Path=\"~/WebServices/NameService.svc\" />\n  </Services>\n\
  </asp:ScriptManager>\n```\n\n\n\n\n\n在主页（master page）中引用服务，该服务将对基于该主页的所有页面可用。这意味着每个页面都会下载运行此服务所需的\
  \ JavaScript 文件。如果你的页面完全没有使用该 Web 服务，这将导致带宽和资源的浪费。因此，对于仅在少数页面上使用的服务，最好在页面本身中引用该服务。在没有使用带有\
  \ `ScriptManager` 主页的普通页面上，你可以直接在 Web Form 中添加一个 `ScriptManager`。然而，如果你使用的是一个已经有了自己的\
  \ `ScriptManager` 的主页（如 Planet Wrox 网站中的页面），你则需要使用 `ScriptManagerProxy` 控件。因为一个页面中只能有一个\
  \ `ScriptManager`，所以你不能在使用了带有 `ScriptManager` 的主页的内容页面中再次添加另一个。因此，`ScriptManagerProxy`\
  \ 充当了内容页面与主页中 `ScriptManager` 之间的桥梁，让你在何处注册服务时具有极大的灵活性。\n\n当你配置好 `ScriptManagerProxy`\
  \ 后，你需要向它添加与你在 `ScriptManager` 本身中看到的完全相同的 `<Services>` 元素：\n\n```\n<asp:ScriptManagerProxy\
  \ ID=\"ScriptManagerProxy1\" runat=\"server\">\n  <Services>\n    <asp:ServiceReference\
  \ Path=\"~/WebServices/NameService.svc\" />\n  </Services>\n</asp:ScriptManagerProxy>\n\
  ```\n\n下面的练习演示了如何使用 `ScriptManagerProxy` 从客户端代码中注册并访问你的 Web 服务。\n\n## 实用 AJAX 技巧\n\
  \n考虑以下技巧以充分利用 ASP.NET AJAX 的优势：\n\n-   由于 `UpdateProgress` 面板的内容仅在 Ajax 页面更新期间可见，你会发现很难设计其内容。你只能看到几秒钟（或更短）的内容，而且只有在触发向服务器的后传（postback）后才能看到。为了更方便地设计\
  \ `UpdateProgress` 面板，你应该先在 `UpdateProgress` 面板之外设计消息。例如，在本章的练习中，你应该将 `<div id=\"\
  PleaseWait\">` 移动到任何其他控件之外，使其始终可见。然后你可以不断修改该 `<div>` 的 HTML 和 CSS，直到它看起来完全正确。之后，你就可以将该\
  \ `<div>` 移回 `UpdateProgress` 面板，以便它只在部分页面更新时显示。\n\n-   每当你使用 `UpdatePanel` 时，考虑同时添加一个关联的\
  \ `UpdateProgress` 控件。即使你认为 `UpdatePanel` 刷新非常快而没有需要，但对于电脑慢或网络慢的用户来说，添加 `UpdateProgress`\
  \ 可能也是值得的。更好的做法是：在主页中方便且可见的区域（例如页脚 Footer 部分）添加一个 `UpdateProgress`。不要将 `AssociatedUpdatePanelID`\
  \ 设置为任何值，这样进度面板将在任何 Ajax 回调时显示。通过这样，你就不需要在网站的不同区域设置许多不同的等待指示器。\n\n-   不要过度使用 `UpdatePanel`\
  \ 控件。在许多情况下，即使真实性能相同，使用 `UpdatePanel` 控件时，应用程序的感知性能也会提高。这是一件好事，因为你的用户会认为你的应用程序比不使用\
  \ `UpdatePanel` 时更快。然而，使用过多的 `UpdatePanel` 控件可能会困扰你的用户，特别是当这些控件没有绑定到告知用户正在运行的 `UpdateProgress`\
  \ 控件时。考虑使用 Web 服务，因为它们可以减少开销和在网络上传输的数据量。\n\n-   你可能想将整个主页的内容封装在 `UpdatePanel` 控件中，以避免在页面间跳转时出现闪烁。然而，这是不可通的，因为跳转到新页面是一个新的\
  \ `GET` 请求，而 `UpdatePanel` 控件仅在后传（postback）期间有效。\n\n## 总结\n\nAjax 是一项广泛且非常有趣的技术，它确实可以为你的网站增加大量价值。\n\
  \n`UpdatePanel` 控件让你能够快速创建无闪烁的页面，而 `ScriptManager` 控件充当服务器与客户端之间的桥梁，负责注册必要的客户端脚本等任务。工具箱中\
  \ AJAX Extensions 类的其他控件还包括 `ScriptManagerProxy`、`UpdateProgress` 和 `Timer` 控件。\n\
  \n除了这些非常有用的服务器端控件外，ASP.NET AJAX 框架还提供了功能，让你只需几行代码即可在网站中访问 Web 服务。Web 服务可与服务器交换数据，而不会阻塞或完全重新加载用户界面。\n\
  \n尽管 Ajax 本身是一项非常吸引人的技术，但在更丰富的数据驱动场景中，它变得更加有用。例如，在数据库返回的记录周围使用 `UpdatePanel` 控件，以避免在排序、过滤或分页数据时出现页面闪烁，这极大地增强了用户的浏览体验。你将在第\
  \ 12 章学习如何与数据库交互。凭借从本章获得的 Ajax 知识，你将快速创建无闪烁的、数据库驱动的网页。\n\n### 本章你学了什么\n\n| 术语 |\
  \ 描述 |\n| :--- | :--- |\n| **Ajax** | 异步 JavaScript 和 XML（Asynchronous JavaScript\
  \ And XML），一组用于创建无闪烁网页以及从客户端代码与服务器交互的技术的统称。 |\n| **Attribute**（属性） | 一种可以应用于类和方法等其他元素的代码元素，用于更改它们的含义或行为。\
  \ |\n| `ScriptManager control` | Microsoft ASP.NET AJAX 框架的核心组件，负责管理客户端脚本文件和服务器端\
  \ Ajax 行为。 |\n| `ScriptManagerProxy control` | 内容页面与主页中 `ScriptManager` 控件之间的桥梁。\
  \ |\n| `UpdatePanel control` | 一种通过仅更新其 `<ContentTemplate>` 定义的内容来帮助创建无闪烁页面的控件。\
  \ |\n| `UpdateProgress control` | 一个面板（`<div>` 或 `<span>`），可在异步操作执行期间显示。 |\n| Web\
  \ service method | 一种可以通过互联网或本地网络由其他应用程序调用的方法。 |\n\n# 第 11 章：jQuery\n\n### 你将学习\n\
  - 什么是 jQuery\n- 什么是 NuGet 以及如何使用它\n- 如何使用 jQuery 增强你的页面，包括添加视觉效果和动画\n- 如何利用 jQuery\
  \ 增强 ASP.NET 验证\n\n### 本章的 wrox.com 代码下载\n\n你可以在 [www.wrox.com/go/begaspnet451](http://www.wrox.com/go/begaspnet451)\
  \ 的 Download Code 标签页找到本章的 wrox.com 代码下载。代码位于 Chapter 11 文件夹。在之前的章节中，你接触了 JavaScript，它是客户端脚本和与网页元素交互的事实标准语言。虽然所示的示例相对简单，但\
  \ JavaScript 可以实现更多功能，是一种非常强大的语言。尽管它如此强大，但也有一些缺点。JavaScript 的问题之一是并非所有浏览器的解释都相同。你编写的大部分\
  \ JavaScript 代码在主要浏览器中都能运行，但代码和行为上的细微差异使得编写在所有主要浏览器中行为完全相同的代码变得困难。此外，JavaScript\
  \ 缺少一些在日常编程中非常有用的功能。例如，它拥有内置方法可以找到页面上的特定元素（如你在第 9 和第 10 章中看到的 `getElementById`）以及找到特定\
  \ HTML 标签的所有元素（使用 `getElementsByTagName`），但它缺少像 `getElementsByClassName` 这样用于获取特定类的元素列表的功能。\n\
  \n\n\n\n\n幸运的是，互联网开发者社区非常活跃，开发了许多底层使用 JavaScript 并扩展其能力的框架，同时提供了非常丰富的功能集，帮助你创建交互式的客户端网页。多年来，人们开发了许多\
  \ JavaScript 库——其中大多数都是免费的，包括：\n\n* Prototype ([`prototypejs.org`](http://prototypejs.org))\n\
  * Scriptaculous, Prototype 的一个插件 ([`script.aculo.us`](http://script.aculo.us))\n\
  * Ext JS ([www.sencha.com/products/extjs/](http://www.sencha.com/products/extjs/))\n\
  * Dojo ([`dojotoolkit.org`](http://dojotoolkit.org))\n* MooTools ([`mootools.net/`](http://mootools.net/))\n\
  \n一个备受关注的框架是 `jQuery`。它最初由 John Resig 于 2006 年 1 月开发并发布，`jQuery` 已经成为一个非常流行的客户端框架。它还引起了微软的注意，微软决定在微软产品中随附\
  \ `jQuery`。最初，`jQuery` 随 Microsoft ASP.NET MVC Framework 一起发布，但现在也被包含在 Visual Studio\
  \ 2013 的其他 Web 项目中\n\n## jQuery 简介\n\n`jQuery` 库的主要焦点一直是简化你访问网页中元素的方法，为处理客户端事件提供帮助，启用动画等视觉效果，并让在应用程序中使用\
  \ Ajax 变得更容易。2006 年 1 月，John Resig 宣布了第一个版本的 `jQuery`，随后在 2006 年 8 月正式发布了 `jQuery`\
  \ 1.0。之后还有更多版本，其中版本 2.0.3 是编写本文时的时的最新稳定版本。\n\n你有几种方法可以获取 `jQuery` 库并将其添加到你的网站中。首先，你可以从官方网站\
  \ [`jquery.com`](http://jquery.com) 下载最新版本的 `jQuery`。你不仅可以在那里找到可下载的文件，还能找到文档、常见问题解答（FAQs）、教程以及许多其他可以让你充分利用\
  \ `jQuery` 作用的信息。\n\n获取 `jQuery` 的第二个方法是使用 ASP.NET Web Forms 站点模板创建一个新站点，因为它已经包含了一个带有必要的\
  \ `jQuery` 文件的 `Scripts` 文件夹。然而，在第 2 章中，你基于 ASP.NET 空站点模板创建了 Planet Wrox 网站，该模板并不包含这些文件。\n\
  \n向你的站点添加 `jQuery` 的第三种解决方案是使用内容交付网络（CDN），正如你之后看到的。\n\n最后一种方法是使用 `NuGet`，它是 Visual\
  \ Studio（包括 Express 版）随附的库包管理器。接下来将讨论 `NuGet`。\n\n### 介绍 NuGet\n\nNuGet 是一个开源库包管理器，作为\
  \ Visual Studio 扩展程序提供，它可以让你非常方便地在 Visual Studio 项目和网站中添加、删除和更新外部库。你在第 3 章（当你向网站添加\
  \ Modernizr 时）和第 7 章（当你添加 FriendlyUrls 时）简要见过它的工作运行，但本章将更深入地探讨该包管理器的核心功能。\n\n`NuGet`\
  \ 最初由微软开发，但现在已变成一个接受开发者社区贡献的开源项目。虽然你会在 VS 的网站背景下看到 `NuGet` 的使用，但 `NuGet` 绝不仅用于 ASP.NET。你可以将其用于所有用\
  \ Visual Studio 构建的所有类型的应用程序。\n\n为了理解 `NuGet` 解决了什么问题，想象你想向你的 ASP.NET 网站添加一个如 `jQuery`\
  \ 这样的开源库。虽然具体细节因库而异，但你通常需要以下步骤：\n\n1. 找到该库的网站。\n2. 找到该库最新稳定版本的下载链接并下载。\n3. 使用文件资源管理器解除下载文件的锁定，解压并将其添加到项目中，可选地为它创建一个特定文件夹。\n\
  4. 可选：在项目中添加对该库的引用。\n5. 可选：通过 `Web.config` 文件或其他代码文件对库进行配置。\n\n使用 `NuGet`，你可以极大地减少向项目添加库所需的步骤。例如，你只需只需五次鼠标点击即可添加\
  \ `jQuery` 库。除了添加包之外，`NuGet` 还允许你在将库添加到网站后，轻松地将其更新到最新版本，并且它允许你再次删除包而不留任何痕迹。\n\n\
  除了 Visual Studio 扩展程序外，`NuGet` 还有自己的网站，位于 [`nuget.org`](http://nuget.org)。在这里，你可以浏览程序包目录，找到安装包的命令（将在下一节详细介绍），阅读详细文档以及更多内容。\n\
  \n要使用 `NuGet` 管理库，你有两个选择：你可以使用“管理 NuGet 包”对话框，也可以使用“程序包控制台”。\n\n#### 使用“管理 NuGet\
  \ 包”对话框\n\n“管理 NuGet 包”对话框允许你在线搜索包，还可以管理你已经安装的包。你通过在解决方案管理器中右键点击你的网站并选择“管理 NuGet\
  \ 包”来访问此对话框。或者，选择工具 ⇒ 库包管理器 ⇒ 管理解决方案的 NuGet 包。图 11-1 显示了对话框的运行情况。\n\n![image](img/f372-01.jpg)\n\
  \n**图 11-1**\n\n在对话框的左侧，你可以从三种类型的列表中进行选择：\n\n* 已安装的包 — 此项显示已安装包的列表。你可以使用此选项查看已安装包的版本、卸载包，或向解决方案其他网站或项目安装同一个包。\n\
  * 在线 — 此项允许你使用官方 NuGet 源、官方微软源以及你添加的任何其他源（你可以通过工具 ⇒ 选项 ⇒ 程序包管理器 ⇒ 程序包源来添加）在线搜索包。默认情况下，列表显示最流行的包（按下载量衡量），但你可以使用顶部的下拉列表更改排序。在排序列表左侧，你可以选择仅显示稳定包，或包含预览版本的包。在右上角，你可以通过输入（部分）名称搜索包。当你找到了要添加到网站的包后，选择它，点击安装按钮，NuGet\
  \ 包管理器将处理安装过程。\n* 更新 — 此项显示自你将包添加到网站以来发布了新版本的包。由于更新可能会破坏现有网站，因此它们不会自动安装，你需要手动选择要更新的包。\n\
  \n可以在 NuGet 网站的文档部分找到有关管理 NuGet 包对话框的完整文档：http://bit.ly/q2PiyM](http://bit.ly/q2PiyM)。\n\
  \n除了使用此对话框，你还可以使用程序包控制台管理程序包。\n\n#### 使用程序包控制台\n\n程序包控制台允许你从命令行界面管理程序包。这不像使用对话框那样用户友好，但一旦你习惯了使用\
  \ `NuGet`，你会发现控制台非常有用。使用控制台，你可以访问与对话框相同以及更多的功能。图 11-2 显示了程序包控制台，你可以通过主菜单选择工具 ⇒ 库包管理器\
  \ ⇒ 程序包控制台来访问它。\n\n\n\n\n\n此命令行窗口支持许多帮助你管理包的命令。要获取可用主命令列表，请输入 `Get-Help NuGet` 并按回车。你将看到一个可以在控制台中执行的命令列表。控制台具有\
  \ IntelliSense 功能，可以帮助你通过按 `Tab` 键补全命令。以 `Help` 命令为例，只需输入 `Get` 然后按 `Tab` 键，即可获得所有以\
  \ `Get` 开头的命令列表。然后你可以从列表中选择命令，并通过再次按 `Tab` 键或按回车键完成补全。由于许多命令都以 `Get` 开头，在这种情况下，输入\
  \ `Get-H` 然后按 `Tab` 键，或者手动输入完整的命令可能更快。然而，对于较长且唯一的命令名称，使用 `Tab` 键可以节省大量时间。\n\n最流行的命令可能是\
  \ `Get-Package` 和 `Install-Package`。使用 `Get-Package` 你可以列出当前安装在站点中的包。要查看列表，只需输入该命令并按回车键。如果你现在尝试一下，你应该能看到\
  \ `Modernizr` 和 `FriendlyUrls` 包。通过使用 `Get-Package -ListAvailable`，你可以看到所有可用包的完整列表。由于存在成千上万个包（列表不断增长），你需要使用\
  \ `-Filter` 对列表进行过滤，如下：\n\n```\nGet-Package -ListAvailable -Filter jQuery\n```\n\
  \n这将列出所有名称中包含 `jQuery` 的包。注意，过滤是不区分大小写的。要找到尚未正式发布的包预发布版本，你需要使用 `-PreRelease` 选项，如下：\n\
  \n```\nGet-Package -ListAvailable -Filter jQuery -PreRelease\n```\n\n一旦你找到了想要安装的包，请使用\
  \ `Install-Package` 命令。作为参数，你需要提供该包的名称。例如，要将 `jQuery` 安装到你的网站，请执行以下命令：\n\n```\n\
  Install-Package jQuery\n```\n\n按下回车键后，包管理器控制台会下载该包并安装到你的网站中，这与使用“管理 NuGet 包”对话框的操作完全相同。\n\
  \n要全面概述所有可用命令，请查看 NuGet 官方文档 [`docs.nuget.org`](http://docs.nuget.org)。你可以在这里找到命令行引用：[`bit.ly/q0N57L`](http://bit.ly.q0N57L)。\n\
  \n在下一个练习中，你将使用“管理 NuGet 包”对话框将 `jQuery` 库安装到你的网站中。\n\n既然 `jQuery` 库已添加到网站，下一步是确定在哪里使用它。由于\
  \ `jQuery` 库会增加网页的大小，因此是否在站点中包含它应该是一个深思熟虑的选择。\n\n### 选择 jQuery 引用的位置\n\n要在你的网站中包含\
  \ `jQuery`，你有两种选择：\n\n* 仅在需要的网页或用户控件中添加 `jQuery` 库的引用。\n* 在你站点的主页中添加 `jQuery` 库的引用，这样所有页面都可以使用。\n\
  \n这两种方法都有其优缺点。仅在需要的页面中添加 `jQuery` 库引用有助于保持页面较小。当你的用户只访问没有 `jQuery` 的页面时，他们将无需下载该库文件，从而节省了带宽。请注意，一旦他们访问过引用了该库的页面，浏览器将缓存其副本，这样在后续访问页面时就不需要再次下载。\n\
  \n在站点的主页中添加 `jQuery` 引用非常方便，因为基于此主页的所有页面都会自动获得 `jQuery` 功能。然而，这会导致站点第一个页面的性能受到轻微影响，因为该库需要从服务器下载。这是\
  \ Planet Wrox 网站使用的选项。\n\n除了你添加 `jQuery` 文件的位置外，你对于包含文件的方式也有几种选择。\n\n### 包含 jQuery\
  \ 库的不同方式\n\n由于 `jQuery` 库由一个包含 JavaScript 代码的单一文件组成，你可以使用标准的 `<script>` 语法在页面、用户控件或主页中嵌入库的引用：\n\
  \n```\n<script src=\"/Scripts/jquery-2.0.3.min.js\" type=\"text/javascript\"></script>\n\
  ```\n\n使用独立的 `</script>` 标签是重要的，因为某些浏览器如果遇到自闭合标签将会出现问题。\n\n你也可以将引用嵌入到上一章中添加到主页的\
  \ `ScriptManager` 控件中。`ScriptManager` 控件有一个 `<Scripts>` 子元素，它允许你注册 JavaScript 文件，这些文件将被添加到浏览器中的最终页面中，如下所示：\n\
  \n```\n<asp:ScriptManager ID=\"ScriptManager1\" runat=\"server\">\n  <Scripts>\n\
  \    <asp:ScriptReference Path=\"~/Scripts/jquery-2.0.3.min.js\" />\n  </Scripts>\n\
  </asp:ScriptManager>\n```\n\n另一种方案是使用微软的内容分发网络 (CDN) 或 Google Code 引用库的在线版本。如需更多信息，请访问微软\
  \ CDN 站点 [www.asp.net/ajax-cdn](http://www.asp.net/ajax-cdn) 或 Google API 站点 [`code.google.com/apis/ajaxlibs/`](http://code.google.com/apis/ajaxlibs/)。\n\
  \n使用外部库在线版本的优点是提高了性能并降低了带宽。因为用户访问其他站点时可能已经下载了共享脚本，访问你的站点时无需再次下载。\n\n在接下来的练习中，你把\
  \ jQuery 库添加到到网站的主页中。设置完成后，本章的其余部分将教你 jQuery 如何工作以及如何使用它。\n\n现在你已经看到了 jQuery 的运行，是时候更好地理解它的功能了。\n\
  \n## jQuery 语法\n\n为了理解并使用 jQuery，你需要了解一些基础。首先，你需要更多了解 jQuery 的核心，包括你见过的 `$` 函数以及在页面加载时执行代码的\
  \ `ready` 方法。接下来，你需要更多了解 jQuery 的选择器和过滤器语法，它们允许你根据标准查找页面元素。一旦你获得了页面一个或多个元素的引用，就可以对它们应用各种方法，例如你之前看到的\
  \ `css` 方法。你还需要了解 jQuery 事件，它允许你为 HTML 元素可能触发的事件附加行为，如 `click`、`mouseover` 等。在接下来的章节中，你将看到这些主要的\
  \ jQuery 主目的运行。\n\n### jQuery Core\n\n你编写大部分 jQuery 代码将在浏览器加载页面后执行。等到 DOM 加载完成后再执行代码是非常重要的。DOM\
  \ —— 文档对象模型是你网页的分层表示，包含了你所有的 HTML 元素、脚本文件、CSS、图像等的树形结构。DOM 始终与浏览器中看到的页面保持同步，因此如果你对\
  \ DOM 进行了程序化更改（例如使用 jQuery 代码），更改将反映在页面上。如果你过早执行 jQuery 代码（例如在页面的最顶部），DOM 可能尚未加载你在脚本中引用的元素，你可能会遇到错误。幸运的是，可以使用\
  \ jQuery 中的 `ready` 函数轻松地推迟到 DOM 准备就绪后再执行代码。你已经在之前的 Try It Out 中见过 `ready` 函数的运行，但现在你更好地理解了它的用途，这里再次显示一下：\n\
  \n```\n$(document).ready(function() {\n  // 添加在此处的代码将在 DOM 准备就绪时执行。\n});\n```\n\n\
  \n\n在起始和结束大括号之间添加的任何代码都将在页面准备好进行 DOM 操作时执行。jQuery 还为 `ready` 函数提供了一个快捷方式，以便于编写在\
  \ DOM 准备绪后触发的代码。以下代码段与之前的示例等效：\n\n```\n$(function() {\n  // 在此处添加的代码将在 DOM 准备绪后执行。\n\
  });\n```\n\n由于 jQuery 代码通常是特定页面的，因此将代码添加到需要它的页面末尾是有意义的。为了让这变得更方便一些，你可以在主页（master\
  \ page）中专门为此目的添加一个 `ContentPlaceHolder`。使用该主页的页面就可以有一个方便的位置来编写 jQuery 代码。你将在下一个练习中看到如何这样做。\n\
  \n在之前的 jQuery 示例中，你看到了一些代码用于选择 `MainContent <section>` 元素和你页面中的按钮。然而，jQuery 还提供了更多选项来选择页面中的特定元素。这些选项将在下文中进行讨论。\n\
  \n## 使用 jQuery 选择项目\n\n在 jQuery 中，你使用美元符号（`$`）作为查找页面中元素的快捷方式。被找到并返回的元素被称为 `matched\
  \ set`（匹配集）。`$` 方法的基本语法如下：\n\n```\n$('Selector Here')\n```\n\n在引号之间（你可以使用单引号或双引号，只要两端使用相同类型即可），你输入一个或多个选择器，这些选择器稍后讨论。`$`\
  \ 方法返回零或多个元素，然后你可以使用许多 jQuery 方法之一来影响它们。例如，要对所有 `h2` 元素应用某些 CSS，你可以使用 `css` 方法：\n\
  \n```\n$('h2').css('padding-bottom', '10px');\n```\n\n这将在页面中所有二级标题的底部应用 10 像素的内边距。许多\
  \ jQuery 方法的酷之处在于，除了应用某些设计或行为外，它们还会再次返回匹配集。这允许你在同一个匹配集上调用另一个方法，从而使两种方法都生效。这种概念被称为\
  \ `chaining`（链式调用）或 `fluent programming`（流式编程），你将一个方法的结果作为另一个方法的输入，从而能够创建一个效果链。例如，以下代码首先更改页面中所有二级标题的字体大小，然后让它们逐渐淡出，直到在五秒后变得不可：\n\
  \n```\n$('h2').css('font-size', '40px').fadeOut(5000); // 时间单位为毫秒\n```\n\n正如你在前面的章节中学到的那样，你应该尝试避免这样使用内联\
  \ CSS 属性。相反，你应该定义 CSS 类并将它们分配给 HTML 元素。你将在本章稍后的部分看到如何这样做。在看到选择器和过滤器如何工作之后，你将学习更多关于\
  \ `animate` 和 `fadeOut` 等不同视觉效果。\n\n### 基础选择器\n\njQuery `selectors`（选择器）允许你在页面文档对象模型中查找一个或多个元素，这样就可以对这些元素应用各种\
  \ jQuery 方法。jQuery 选择器的伟大之处在于你已经知道它们是如何工作的了。jQuery 的设计人员没有发明一种新技术来查找页面元素，而是决定使用你已经熟悉的现有的基于选择器的语法：CSS。还记得第\
  \ 3 章中的 CSS 选择器吗？你可以在 jQuery 中使用相同的选择器。\n\n### 通用选择器\n\n就像其 CSS 对应项一样，通用选择器匹配页面中的所有元素。要将页面中每个元素的\
  \ `style` 的 `font-family` 属性设置为 `Arial`，你可以使用以下代码：\n\n```\n$('*').css('font-family',\
  \ 'Arial');\n```\n\n### 元素选择器\n\n此选择器返回匹配特定标签名称的零或多个元素的引用。例如，此代码将所有二级标题的文本颜色更改为蓝色：\n\
  \n```\n$('h2').css('color', 'blue');\n```\n\n### ID 选择器\n\n此选择器通过 `id` 查找并检索元素，就像你在\
  \ CSS 中执行的操作的一样。例如，要为名为 `Button1` 的按钮设置 CSS `class`，你可以使用以下代码：\n\n```\n$('#Button1').addClass('NewClassName');\n\
  ```\n\n当这段代码设置 CSS 类（使用 `addClass` 方法）时，标准的 CSS 规则将起作用。这意味着为了让这段代码生效并更改按钮的外观，`NewClassName`\
  \ 类需要对页面可用，可以通过可以通过外部 CSS 文件，也可以通过嵌入样式表。如果你需要复习不同的层级样式表类型，请参阅第 3 章。然而，你还会看到某些添加了\
  \ CSS 文件中不存在的 CSS 类的示例。这对于“标记”元素非常方便，这样你稍后可以使用类选择器再次选择它们。\n\n### 类选择器\n\n类选择器返回匹配特定类名的零或多个元素的引用。考虑此\
  \ HTML 片段：\n\n```html\n<h1 class=\"Highlight\">Heading 1</h1>\n<h2>Heading 2</h2>\n\
  <p class=\"Highlight\">第一个段落</p>\n<p>第二个个段落</p>\n```\n\n注意这四个元素中有两个具有名为 `Highlight`\
  \ 的 CSS 类。以下 jQuery 代码将第一个标题和第一个段落的背景颜色更改为红色，而其他元素保持不变：\n\n```\n$('.Highlight').css('background-color',\
  \ 'red');\n```\n\n### 分组和组合选择器\n\n与在 CSS 中一样，你可以分组和组合选择器。以下分组选择器更改你页面中所有 `h1` 和\
  \ `h2` 元素的文本颜色：\n\n```\n$('h1, h2').css('color', 'orange');\n```\n\n通过组合选择器，你可以找到位于其他元素内部特定元素。例如，以下代码触及了\
  \ `MainContent` 内的段落：\n\n```\n$('#MainContent p').css('border', '1px solid red');\n\
  ```\n\n为了熟悉 jQuery 中的选择器以及应用于匹配集的效果，下一个练习将向你展示如何使用某些选择器。在本章的后续章节中，你将获得对不同动画的详细解释；现在只需关注代码的选择部分。通常，仅仅选择页面中的项目是不够的。例如，在选择表格行时，你可能不想选择所有行，而是选择奇数行或偶数行，以便为表格应用“斑马纹”效果，让奇偶行具有不同的颜色。这就是过滤器的用武之地。\n\
  \njQuery 中可以使用过滤器进一步过滤选择器的结果。这开启了许多可能性，因为它允许你获取如第一个、最后一个、所有偶数或奇、所有标题或特定位置的元素。为了跟随这些示例以及后续示例，请执行此练习，该练习为大多数\
  \ jQuery 示例设置了测试页面。\n\n在下表中可以看到 jQuery 基础过滤器的列表。记住，你可以通过将 `//Examples go here` 行替换为给代码示例来尝试每个示例。保存页面并在浏览器中加载它以查看代码效果。\n\
  \n| **过滤器** | **目的** |\n| :--- | :--- |\n| `:first` `:last` | 允许你选择匹配集中的第一个或最后一个项目。以下示例将表格的第一行或最后一行的背景颜色更改为红色：\
  \ \n\n```\n$('#DemoTable tr:first').css('background-color', 'red');\n$('#DemoTable\
  \ tr:last').css('background-color', 'red');\n```\n\n首先，通过 `#DemoTable` 找到表格。然后通过\
  \ `tr` 找到它的行。最后，通过 `:first` 和 `:last` 过滤器找到第一行或最后一行。 |\n\n\n\n\n\n| `:odd` `:even`\
  \ | 允许你选择匹配集合中的奇数或偶数项。以下示例将表格中奇数行的背景颜色更改为红色。由于索引是从 0 开始的，你实际上会看到第二和第四行颜色发生了变化（因为它们的索引分别为\
  \ 1 和 3）： |\n\n```\n$('#DemoTable tr:odd').css('background-color', 'red');\n```\n\
  |\n| `:eq(index)` `:lt(index)` `:gt(index)` | 通过索引匹配元素。`:eq`（等于）根据索引返回单个元素，`:lt`（小于）和\
  \ `:gt`（大于）分别返回小于或大于给定索引的项。示例如下： |\n\n```\n// 更改第一行（索引为 0）的颜色\n$('#DemoTable tr:eq(0)').css('color',\
  \ 'green');\n\n// 仅更改最后两行。索引为 0, 1 和 2 的前三行\n被跳过。\n$('#DemoTable tr:gt(2)').css('color',\
  \ 'green');\n\n// 将前两行的文本颜色改为绿色。\n$('#DemoTable tr:lt(2)').css('color', 'green');\n\
  ```\n|\n| `:header` | 页面中所有的标题（从 `h1` 到 `h6`）。示例： |\n\n```\n$(':header').css('color',\
  \ 'green');\n```\n|\n\n如需查看所有基础过滤器的完整列表，请访问 jQuery 文档 [`api.jquery.com/category/selectors/`](http://api.jquery.com/category/selectors/)。\n\
  \n## 高级过滤器\n\n除了你刚刚看到的基础过滤器外，jQuery 还支持许多过滤器，允许你根据元素包含的文本、是否可见以及它们可能具有的任何属性来获取项。此外，你还可以找到获取表单元素（如按钮、复选框、单选按钮等）的过滤器，以及许多用于选择子元素、父元素、兄弟和后代的选择器。下表列出了你最常用的。在线\
  \ jQuery 文档提供了完整列表，并带有完整的运行示例来展示它们是如何工作的。\n\n| 过滤器 | 用途 |\n| :--- | :--- |\n| `:contains(text)`\
  \ | 根据元素包含的文本匹配元素。示例： |\n\n```\n$('td:contains(\"Row 3\")').css('color', 'green');\n\
  ```\n如果你省略了 `td`，整个表格都将变成绿色。这是因为表格本身也被匹配了（它的一个子元素包含文本 `Row 3`），因此颜色被应用到表格，反而将每个单元格中的文本都变为了绿色。注意我是如何对文本字符串使用双引号的，以避免过早关闭选择器的单引号。\
  \ |\n| `:has(element)` | 匹配包含至少一个给定元素的元素。示例： |\n\n```javascript\n$(':header:has(\"\
  span\")').css('color', 'green');('color', 'green');\n```\n这只匹配 `h2`，因为它是一个标题（`:header`）并且包含一个\
  \ `<span>` 元素（`has(\"span\")`）。 |\n| `[attribute]` | 根据给定属性匹配元素。示例： |\n\n```javascript\n\
  // 匹配按钮和文本框，因为它们\n// 都有 type 属性，但也会\n// 匹配具有 type 属性的其他元素\n$('[type]').css('color',\
  \ 'green');\n```\n要仅选择具有 `type` 属性的输入控件，可以使用此代码：\n\n```javascript\n$('input[type]').css('color',\
  \ 'green');\n```\n你需要在文本框中输入一些文本才能看到绿色的字体。 |\n| `[attribute=value]` | 根据属性以及该属性的值匹配元素。示例：\
  \ |\n\n```javascript\n// 仅匹配文本框\n$('[type=text]').css('color', 'green');\n```\n\
  \ |\n| `:input` `:text` `:password` `:radio` `:checkbox` `:submit` `:image` `:reset`\
  \ `:button` `:hidden` `:file` | 这些选择器允许你匹配特定的客户端 HTML 表单元素。例如，查找按钮和文本框的代码段可以使用分组选择器重写如下：\
  \ |\n\n```\n$(':button, :text').css('color', 'green');\n```\n你可以使用这些过滤器来做一些花哨的操作。例如，编写一个检查表单中所有复选框的功能，你可以使用：\
  \ |\n\n```javascript\n$(':checkbox').attr('checked', true);\n```\n为了取消所有复选框的选择，你向\
  \ `attr` 方法的第二个参数传递 `false`。 |\n\n尽管这些选择器和过滤器非常强大，但如果没有一种处理它们结果的方法，它们就派不上用场。更改匹配集合中项的外观和行为是下一节的主题。\n\
  \n## 使用 jQuery 修改 DOM\n\n一旦你有了匹配集合，你就想对它做些操作。例如，你可能想对其中的项应用 CSS `class` 或 `style`。或者你可能想为它们添加一些行为，比如添加一个在项被点击时触发某些代码的\
  \ `click`处理器。你已经见过使用 `css` 和 `bind` 方法的某些示例，但 jQuery 提供的远更多。在接下来的两个章节中，你将看到如何处理各种\
  \ CSS 方法，并学习如何设置事件处理器。\n\n### CSS 方法\n\njQuery 以几种不同的方式支持 CSS。首先是有 `css` 方法。\n\n\
  #### css(name, value)\n此方法允许你在匹配的元素上设置特定的 CSS 属性。`name` 参数指的是 CSS 属性（例如 `border,\
  \ color`），`value` 定义了你想应用的样式。以下示例更改了 `h1` 元素的背景颜色：\n\n```javascript\n$('h1').css('background-color',\
  \ 'green');\n```\n\n#### css(name)\n此方法根据你传递的属性获取特定的 CSS 值。以下示例弹出了 2 标题中 `<span>`\
  \ 元素的 `font-style`，因为它是斜体：\n\n```javascript\nalert($('h2 span').css('font-style'));\n\
  ```\n\n#### css(properties)\n这是一个非常强大的方法，因为它允许你一次在匹配的元素上设置多个属性。以下示例将表格中所有单元格的颜色改为红色，将字体改为\
  \ Verdana 并内边距设置为 10px。你通过一个对象传递数据，其中将整个属性集封装在大括号 `{}` 中，用冒号 `:` 分隔属性和值，用逗号分隔每对：\n\
  \n```javascript\n$('#DemoTable td').css({'color' : 'red', 'font-family' : 'Verdana',\
  \ 'padding' : '10px'});\n```\n\n#### addClass, removeClass 和 toggleClass\n`addClass`\
  \ 和 `removeClass` 方法分别允许添加和移除类。与纯 CSS 中，使用这些方法比使用 `css(properties)` 方法分配内联样式要好。这样在集中定义\
  \ CSS 类更便于维护和重用。下一个示例显示了如何给 `h2` 元素分配类：\n\n```javascript\n$('h2').addClass('PleaseWait');\n\
  ```\n如果你想再次移除该类，可以这样调用 `removeClass`：\n\n```javascript\n$('h2').removeClass('PleaseWait');\n\
  ```\n`toggleClass` 方法在类尚不存在时分配类，否则移除它。这三个方法都允许你通过空格分隔来传递多个类。\n\n#### attr(attributeName)\n\
  \n\n\n\n\n`attr` 方法允许你读取和设置 HTML 元素属性的值。此版本接受单个参数，用于读取现有值。对于你传递的 `attributeName`，你需要以字符串形式传递属性名称。以下示例将弹出\
  \ `h1` 标题的 `title` 属性值，即“First Header”：\n\n```\nalert($('h1').attr('title'));\n\
  ```\n\n### `attr(attributeName, value)`\n\n`attr` 的第二个版本接受两个参数，用于更改属性的值。除了你想要更改的属性名称外，你还需要发送该属性的新值。以下示例会检查演示页面中所有的复选框：\n\
  \n```\n$(':checkbox').attr('checked', true);\n```\n\n这些 CSS 方法结合在一起，赋予了你改变页面元素外观和感受的强大能力。你可以通过使用\
  \ jQuery 丰富的事件系统更得进一步，该系统允许你通过代码为元素分配和移除各种处理器。\n\n### 处理事件\n\n事件是许多编程语言中一种非常常见的技术。你已经在之前的章节中看到过\
  \ .NET 事件的用法，当时你使用它们来处理 `Button` 控件的 `Click` 事件或 `Page` 的 `Load` 事件。JavaScript 和\
  \ DOM 也不例外，事件出现在许多地方。例如，许多 HTML 元素（如通过 `input type=\"button\"` 定义的按钮）都有一个 `click`\
  \ 事件，当你点击它时它就会触发。同样，它们还有 `mouseover` 和 `mouseout` 事件，当你的鼠标移入或移出它们时它们会触发。通常情况下，当你直接在标记中定义事件时，它们看起来如下：\n\
  \n```\n<input type=\"button\" onclick=\"alert('Hello');\" value=\"Click Me\" />\n\
  ```\n\n与其在内联中编写触发事件的代码（此示例中的 `alert` 函数），你也可以将它们指向你自己编写的 JavaScript 函数。以下示例调用了一个虚的\
  \ `SayYourName` 函数：\n\n```\n<input type=\"button\" onclick=\"SayYourName();\" value=\"\
  Click Me\" />\n```\n\njQuery 更进一步，它允许你不仅将事件绑定到单个元素上，还可以一次性绑定到整个匹配集合。这非常强大，因为你只需要几行代码就能为大量元素绑定处理器。例如，考虑一个包含许多行的表格。为了让表格更具视觉吸引力，你可以应用一种被称为“活动项目跟踪”的技术，即当鼠标悬停在项目上时该项目的颜色会改变。如果没有\
  \ jQuery，你将为表格中的每一行编写 `onmouseover` 和 `onmouseout` 处理器。这显然会导致页面最终 HTML 中出现大量的冗余。使用\
  \ jQuery，你只需要这段代码，再次使用你之前使用的 HTML 代码示例：\n\n```\n$(function()\n{\n  $('#DemoTable\
  \ tr')\n      .bind('mouseover', function() { $(this).css('background-color', 'yellow')\
  \ });\n});\n```\n\n这段代码找到 `#DemoTable` 元素内的所有表格行，然后动态分配一个当鼠标悬停在每行上时调用的函数。如果你将鼠标悬停在它们上面，背景颜色就会改变。但如果你将鼠标移开，新颜色会保留。为了解决这个问题，你可以使用\
  \ jQuery 的链式概念，jQuery 方法的结果会返回匹配集合，因此你可以对其应用另一个函数。要将 `mouseout` 绑定到一个新函数，只需在第一次调用\
  \ `bind` 的返回值上再次调用 `bind` 即可：\n\n```javascript\n$('#DemoTable tr')\n    .bind('mouseover',\
  \ function() { $(this).css('background-color', 'yellow') })\n    .bind('mouseout',\
  \ function() { $(this).css('background-color', '') });\n```\n\n注意上一个示例中结束该行的分号是如何移动到最后一行的。然后第二个\
  \ `bind` 简单地链到上一次的 `bind` 调用上。这有点困难……[后续文本遵循相同模式]。\n\n\n\n\n\n如果你没有看到完全相同的 HTML，请确保以\
  \ `alert` 开头的那行是你的文档 `document.ready` 函数内部唯一的一行，因为其他示例可能会影响表格的 HTML 结构。\n\n选择器与上一个示例相同。`parent`\
  \ 函数指向匹配到的表格单元格周围的 `<tr>` 标签。显示 `innerHTML` 则会返回该行包含的两个单元格的 HTML。\n\n### 使用 jQuery\
  \ 时的常见错误\n\n取决于你所使用的 jQuery 功能的复杂程度，编写代码可能非常具有挑战性。你需要注意正确的大小写、括号、中括号、逗号等。当你发现 jQuery\
  \ 代码没有运行或出现意料之外的行为时，请检查你的代码是否遭遇了以下问题。\n\n#### 你的 ID 选择器不起作用\n\n你可能忘记在它前面加上 `#` 符号。`$('DemoTable')`\
  \ 不会选择 `id` 为 `DemoTable` 的表格，而 `$('#DemoTable')` 则可以选中它。另一种你的 ID 选择器可能不起作用的情况是你的大小写写错了。ID\
  \ 选择器是区分大小大小的，因此 `$('#DemoTable')` 与 `$('#demotable')` 不相同。\n\n#### 即使带有哈希符号，你的\
  \ ID 选择器不起作用\n\n在这种情况下，可能是客户端元素没有你预期的 `id`。也许 ASP.NET 运行时通过在其前面加上父元素的 `id` 更改了客户端\
  \ `id`？如果是这样，尝试将相关控件的 `ClientIDMode` 设置为 `Static`，以便 `id` 更具可预测性。此外，确保你的代码在 `document.ready`\
  \ 函数内部执行，因为元素的目标可能尚未就绪。\n\n#### 你的代码似乎都没有运行\n\n检查你的括号、大括号和引号。每对都需要平衡，即开启和结束项的数量必须相等。\n\
  \n到目前为止，你看到的代码主要围绕着查找页面中的元素，通过 CSS 改变其外观或执行 JavaScript。然而，jQuery 还附带了一系列技巧，可以对页面中的元素进行动画处理。在下一节中，你将看到这些所谓的效果，随后是一个“试一试”练习，它将展示它们的运行效果。\n\
  \n## JQUERY 效果\n\n在本章较早的示例中，你学习了如何使用 `slideUp` 和 `slideDown` 来缓慢地隐藏和显示元素。但这些只是 jQuery\
  \ 提供的许多效果和动画方法中的两个。下表列出了你可以使用的最常用方法。再次建议你使用 `jQueryDemos.aspx` 页面尝试所有示例。\n\n| 方法名称\
  \ | 目的 |\n| :--- | :--- |\n| `show()` `hide()` | 通过减小 `height`、`width` 和 `opacity`（使其透明）来隐藏或显示匹配元素。两种方法都允许你定义固定的速度（慢、正常、快）或定义以毫秒为单位的动画时间的数字。示例：\
  \ \n\n```\n$('h1').hide(1000);  // 在 1 秒内隐藏标题\n$('h1').show(1000);  // 让它在 1 秒后重新出现\n\
  ``` |\n| `toggle()` | `toggle` 方法在内部使用 `show` 和 `hide` 并更改匹配元素的显示状态。也就是说，可见的项目会被隐藏，反之亦然。示例：\
  \ \n\n```\n$('h1').toggle(2000); // 在 2 秒内隐藏或显示 h1\n``` |\n| `slideDown()` `slideUp()`\
  \ `slideToggle()` | 与 `hide` 和 `show` 一样，这些方法使匹配元素出现或消失。然而，它们通过将 `height` 从当前大小调整为\
  \ 0 或反之来实现，从而导致元素“向上滑动”或“向下滑动”。`slideToggle` 方法向下滑动隐藏元素并向上滑动可见的元素，这使得通过单个操作反复显示和隐藏元素变得简单。示例：\
  \ \n\n```\n$('h1').slideUp(1000);\n$('h1').slideDown(1000);\n$('h1').slideToggle(1000);\n\
  ``` |\n| `fadeIn()` `fadeOut()` `fadeTo()` | 这些方法通过改变透明度来使匹配元素可见或不可见。`fadeOut` 将\
  \ `opacity` 设置为 0，使项目完全透明，然后将 CSS `display` 属性设置为 `none`，从而完全隐藏项目。`fadeTo` 允许你指定透明度（0\
  \ 到 1 之间的数字）来确定元素的透明级别，而 `fadeIn` 让项目再次可见并将 `opacity` 设置为 1。这三种方法都允许你定义固定的速度（慢、正常、快）或定义以毫秒为单位的动画持续时间的数字。示例：\
  \ \n\n```\n$('h1').fadeOut(1000);     // 在 1 秒内消除 h1\n$('h1').fadeIn(1000);    \
  \  // h1 在 1 秒后重新出现\n$('h1').fadeTo(1000, 0.5); // 渐变到半透明\n``` |\n| `animate()`\
  \ | 在内部，`animate` 用于 `show` 和 `hide` 等许多动画方法。然而，它也可以外部可用，为你处理匹配元素的动画提供极大的灵活性。通过\
  \ `animate` 方法，你可以指定一组属性进行动画处理。考虑这个示例： \n\n```\n$('h1').animate({\n        opacity:\
  \ 0.4,\n        marginLeft: '50px',\n        fontSize: '50px'\n      }, |\n\n现在你已经了解了最重要的\
  \ jQuery 概念，从简单的选择器到高级动画，你可以利用这些知识让 Planet Wrox 网站的联系表单更具吸引力。\n\n## JQUERY 与验证\n\
  \n\n\n\n\n如果你到现在觉得 `jQuery` 真的非常棒，我完全同意。虽然刚开始可能觉得习惯 `jQuery` 有些许困难，但一旦你掌握了它，你就会怀疑自己在没有它的情况下是怎么做到的。更酷的是，你并不限于\
  \ `jQuery` 库开箱提供的功能。`jQuery` 具有插件式架构，这意味着你可以为它编写插件来扩展或增强 `jQuery` 的功能。你可以在 [`plugins.jquery.com/`](http://plugins.jquery.com/)\
  \ 找到官方 `jQuery` 插件注册表。此外，在网上搜索“jQuery plug-ins”会找到许多用于各种用途的有用插件，范围从图片库、验证框架、视觉工具提示、对话框等。我们还鼓励你查看\
  \ `jQuery UI`，它是一系列小部件，如标签页、对话框、日历、可拖拽内容等。你可以在 [`jqueryui.com`](http://jqueryui.com)\
  \ 找到 `jQuery UI` 项目。如果你喜欢 `jQuery UI`，也应该查看 `Juice UI`（位于 [`juiceui.com`](http://juiceui.com)）。`Juice\
  \ UI` 是一个开源的 ASP.NET 控件集合，可在浏览器中渲染 `jQuery UI` 元素。这样，你就可以兼得两者之长：服务器端丰富且可编程的框架，以及利用\
  \ `jQuery` 和 `jQuery UI` 的精简纯洁的客户端 HTML。\n\n到目前为止，你一直在处理相当静态的网页。虽然 `jQuery` 允许你在客户端创建动态变化的页面，但网站上显示的内容仍然是静态的。为了解决这个问题，你可以使用数据库，这是接下来四个章节的主题。在下一章中，你将获得对数据库的深入介绍，随后的章节将为你提供有关在\
  \ ASP.NET 环境中处理数据的深度信息。\n\n## 关于 JQUERY 的实用技巧\n\n为了充分利用 `jQuery` 的优势，请遵循这些简短的提示：\n\
  \n*   不断尝试。起初，掌握 `jQuery` 是一项有点奇特的待掌握的技术，主要是因为它有许多大括号和小括号。然而，通过大量练习，你可以很快成为一名 `jQuery`\
  \ 大师。\n*   访问 `jQuery.com` 网站。除了有许多展示 `jQuery` 能力示例的优秀文档外，你还能找到大量关于使用 `jQuery` 的文章和链接，包括指向包含视频内容的网站链接。\n\
  *   花些时间浏览 `jQuery UI` 和 `Juice UI` 网站。你现在可能不需要它们提供的功能，或者你可能觉得自己还没准备好迈下一步，但当你构建下一个具有丰富客户端界面的网站时，了解这些产品能提供什么是很有用的。\n\
  \n## 总结\n\n在本章中，你接触了 `jQuery`，这是一种非常流行的开源的客户端 JavaScript 框架，用于与文档对象模型（DOM）进行交互。\n\
  \n本章开头向你展示了从哪里获取 `jQuery` 以及如何将其添加到你的网站中。接着，你学习了一个 `jQuery` 的快速示例，随后是对 `jQuery`\
  \ 选择器和过滤器的介绍，这些工具允许你找到页面中相关的元素。\n\n本章的第二部分专门介绍了 `jQuery` 支持的许多方法，可用于为你的匹配元素集应用效果和动画。你学习了如何使用\
  \ `css` 等方法来操作 CSS 设置，使用 `parent` 和 `prev` 在集合中的项目之间进行导航，以及如何处理事件以响应某些操作（如点击按钮或提交表单）执行代码。\n\
  \n在章节末尾，你学习了如何使用 `jQuery` 中的许多动画方法让你的页面具有更具吸引力和交互性的外观，并见证了如何在 ASP.NET 验证框架中利用 `jQuery`\
  \ 的力量。\n\n### 你在本章中学习了什么\n\n| 术语 |  |\n| :--- | :--- |\n| `_references.js` | `Scripts`\
  \ 文件夹中的特殊 JavaScript 文件，用于触发其所引用的所有 JavaScript 文件的 IntelliSense 提示 |\n| Chaining\
  \ (链式调用) | 一种概念，一个方法的结果作为另一个方法的输入，以创建效果链 |\n| Filters (过滤器) | 允许你进一步精炼你的 `jQuery`\
  \ 匹配元素集 |\n| `Global.asax` | 一个用于处理各种应用程序范围事件（如 `Application_Start`、`Application_Error`\
  \ 等）的中心文件 |\n| `jQuery` | 一种流行的客户端 JavaScript 框架，简化了对 DOM 操作、视觉效果、事件处理和 Ajax 功能的使用\
  \ |\n| Matched set (匹配元素集) | 由 `jQuery` 选择器返回的元素集 |\n| NuGet | Visual Studio 的库包管理器，帮助你管理\
  \ .NET 网站和项目中的第三方库 |\n| Selectors (选择器) | 一种类似 CSS 的语法，使用 `jQuery` 查找页面中的元素 |\n\n\
  # 第 12 章：数据库简介\n\n### 你在本章中将学习到：\n\n*   什么是数据库，以及哪些数据库通常用于 ASP.NET 页面\n*   SQL 是什么，它看起来什么样，以及你如何使用它来处理数据\n\
  *   什么是数据库关系以及为什么它们很重要\n*   你可以使用哪些工具来管理数据库对象（如表）以及如何使用它们\n\n### 本章的 WROX.COM 代码下载\n\
  \n你可以在 [www.wrox.com/go/begaspnet451](http://www.wrox.com/go/begaspnet451) 的“Download\
  \ Code”选项卡上找到本章的 [wrox.com](http://wrox.com) 代码下载。代码位于第 12 文件夹中。\n\n能够在 ASP.NET\
  \ 网站中使用数据库与理解 HTML 和 CSS 一样关键：没有它，几乎无法构建现代网站。数据库之所以有用，是因为它们允许你以结构化的方式存储和检索数据。数据库最大的优势在于你可以在运行时访问它们，这意味着你不再局限于设计时创建的静态文件。你可以使用数据库存储评论、音乐类型、图片、用户信息（用户名、电子邮件、密码等），记录谁阅读了评论、新闻文章等信息，然后从你的\
  \ ASPX 页面访问这些数据。这为你提供了极大的活性，可以适应访问者的偏好、网站内容，甚至是用户的角色或访问权限。\n\n为了在 ASPX 页面中成功使用数据库，本章将教你如何使用称为\
  \ SQL 的查询语言访问数据库。这种语言允许你检索存储在数据库中的数据。你还将学习如何使用数据库工具创建表和查询。\n\n尽管 ASP.NET 和 .NET\
  \ Framework 提供了许多工具和技术，让你可以在不需要熟悉底层概念的情况下处理数据库，但理解它们仍然很重要。一旦你知道了如何访问数据库，就能更容易理解和欣赏其他技术（例如第\
  \ 14 章中讨论的提供代码直接访问数据库操作的 Entity Framework）。\n\n在接下来的章节中，你将应用在本章中学到的知识。在第 13 章中，你将看到如何使用内置控件处理数据库中的数据。在第\
  \ 14 章中，你将学习如何使用 ADO.NET Entity Framework 作为数据库之上的额外层，以最少的代码以对象的方式访问数据。第 15 章是最后一个关注数据的章节，将向你展示处理数据的高级技术。\n\
  \n在后续章节中，你将了解什么是数据库以及有哪些可供你使用的数据库。\n\n\n\n\n从最简单的定义来说，数据库是数据的集合，其排列方式使其易于被访问、管理和更新。对于本书以及你将构建的网站而言，也可以放心地假设数据库中的数据是以电子格式存储的。\n\
  \n最流行的数据库类型是`关系型数据库`（relational database）。它是网站中经常使用的数据库类型，也是本书后续部分使用的数据库类型。然而，关系型数据库并非唯一。其他类型还包括扁平文件、NoSQL、对象关系型和面向对象的数据库，但这些在互联网应用程序中并不常见。\n\
  \n关系型数据库有`表`（tables）的概念，数据以行和列的形式存储，就像电子表格一样。表中的每一行包含表中存储的项的完整信息。另一方面，每一列包含关于表中行特定属性的信息。\n\
  \n“关系型”一词指的是数据库中不同表之间相互关联的方式。与其反复地复制相同的数据，不如将重复的数据存储在它自己的表中，然后在该表与其他表之间建立关系。考虑图\
  \ 12-1 中的名为 `Review` 表。该表可以存储 Planet Wrox 网站上显示的专辑评论。\n\n![image](img/f408-01.jpg)\n\
  \n**图 12-1**\n\n如你在图 12-1 所示，每条评论都分配给一种音乐流派，如流行乐、独立摇滚或 Techno。但如果你想将 Techno 流派重命名为\
  \ Hardcore Techno 怎么办？你需要更新所有分配了该流的行。如果你还有其他存储流的表，你还需要访问那些表并手动进行更改。\n\n更好的解决方案是使用一个单独的表并将其命名为\
  \ `Genre`，例如。此表可以存储流名称和一个 ID（例如，序列号），用于唯一标识每个流派。然后 `Review` 表与 `Genre` 表建立关系，并只存储其\
  \ ID 而不是整个名称。`Genre` 表还有一个 `SortOrder` 列，它在随后的示例中会被用到。图 12-2 显示了此更改的模型。\n\n![image](img/f409-01.jpg)\n\
  \n**图 12-2**\n\n现在 `Review` 表中仅存储流派的 ID，重命名流派就变得简单了。你只需要更改 `Genre` 表中流派的名称，所有与该流有关系的表都会自动获取更改。在数据库术语中，此示例中的两个\
  \ `Id` 列都是`主键`（primary keys，通过锁形图标识别），用于唯一标识表中的每一行。另一方面，`GenreId` 是一个`外键`（foreign\
  \ key），用于链接回表中的主键或其他唯一键。在本章的后半部分中，你将看到如何在你的关系型数据库中创建并使用关系。\n\n## 不同类型的关系型数据库\n\n\
  你可以在 ASP.NET 项目中使用许多不同类型的数据库，包括 Microsoft Access、SQL Server、Oracle、SQLite 和 MySQL。然而，ASP.NET\
  \ 网站中最常用的数据库可能是 Microsoft SQL Server。本书侧重于使用 Microsoft SQL Server 2012 Express LocalDB\
  \ 版，因为它是免费的，与 VS 2012 捆带，并且提供了许多开箱即用的功能。此外，由于数据库格式与 SQL Server 2012 的商业版本相同，因此在开发周期的后期可以很容易升级到这些版本。此升级路径在附录\
  \ B 中有详细描述。\n\nLocalDB 的唯一问题是你无法无法在 Visual Studio 内部使用所有的数据库管理工具。你可以创建表和其他数据库对象，但无法视觉化地创建新的查询和图表，这两项功能你在处理\
  \ ASP.NET 项目中的数据库时会经常使用。\n\n为了克服这一局限性，你应该下载并安装 SQL Server Management Studio (SSMS)\
  \ Express，这是用于管理你所有 SQL Server 数据库的免费工具，包括 LocalDB、Express 和 SQL Server 的商业版本（尽管对于后者，你可能想使用随主产品自带的功能更丰富的工具）。\n\
  \n在接下来的章节中，你将看到如何获取和安装 SQL Server Management Studio Express。后续章节将向你展示如何使用它来管理你的数据库及其包含的数据。\n\
  \n### 安装 SQL Server 2012 Express\n\n你可以从微软网站的以下页面下载 SQL Server Management Studio\
  \ Express：[`tinyurl.com/SqlExpress2012`](http://tinyurl.com/SqlExpress2012)。如果该链接不再可用，你可以改用\
  \ [www.microsoft.com/express/database/](http://www.microsoft.com/express/database/)\
  \ 并点击下载按钮。或者，你可以去 [www.microsoft.com/downloads](http://www.microsoft.com/downloads)\
  \ 主下载页面搜索“SQL Server 2012 Management Studio Express”。\n\n在任何情况下，请确保你下载并安装 2012 版本的\
  \ Management Studio，而不是在你阅读本书时已发布的更旧或更新的版本。在编写本书时，SQL Server 2014 处于测试阶段，最终发布版可能会兼容\
  \ VWD 2013。此外，如果你没有安装 SQL Server Express（数据库服务器），下载包含数据库引擎和工具的包（其名称可能为 Express with\
  \ Tools 或类似名称，简称为 SQLEXPRWT）。你在本章后续练习中不需要它，但在第 19 章（展示如何部署你的网站）以及附录 B（展示如何配置其他版本的\
  \ SQL Server）中会用到。下载 Management Studio 安装文件（可选数据库引擎）后，运行安装程序并按照屏幕说明操作。当询问安装类型时，选择新的\
  \ SQL Server 独立安装。此选项允许你在稍后的设置向导中选择管理工具作为组件。如果你也安装数据库引擎服务，接受 `SqlExpress` 作为实例名称。如果该名称已被占用，说明你已经在本地安装了\
  \ SQL Server Express。如果此版本是 SQL Server 2012（可以通过 Windows 控制面板的程序和功能进行查找），你可以跳过数据库引擎服务的安装。如果你安装了不同的版本，仍然并排安装\
  \ SQL Server 2012。在这种情况下，为实例选择一个如 `Sql2012Express` 的名称。从以后每当本书引用 `SqlExpress` 作为命名实例时，使用此名称。\n\
  \n## 使用 SQL 处理数据库数据\n\n现在已经安装了 SQL Server Management Studio，是时候查看管理 SQL Server 数据库中数据的方法了。SQL\
  \ Server 支持一种名为 SQL 的查询语言，它可以让你完成这些操作。\n\n\n\n要在数据库中存取数据，你需要使用`结构化查询语言`（`SQL`）。这是查询关系型数据库的事实语言，几乎所有的关系型数据库系统都理解它。目前存在许多清晰的标准，其中最流行的是\
  \ ANSI 92 SQL 标准。除了该标准支持的语法外，许多数据库厂商还向该语言添加了自己的扩展，这使得它们在自己的系统中具有更高的灵活性功能，但代价是降低了与其他系统的互操作性。\n\
  \nMicrosoft SQL Server 2012 也不例外，它支持 ANSI 92 SQL 标准中定义的大部分语法。在该标准的基础上，微软添加了一些专有扩展。这两者合称为\
  \ `T-SQL`，即 `Transact SQL`。在本书的剩余部分，我将坚持使用 `SQL`这一术语。\n\n在接下来的章节中，你将看到如何针对 SQL Server\
  \ 2012 数据库使用 `SQL` 来检索和操作数据库中的数据。然而，在编写第一条 `SQL` 语句之前，你首先需要知道如何连接到数据库。接下来的练习将展示如何从随本书下载代码提供的\
  \ SQL 脚本文件中创建一个示例数据库。\n\n当你在 SSMS 中连接到数据库后，你就可以操作它包含的对象。在下一节中，你将看到如何访问和更改数据库表中的数据。\n\
  \n## 使用 SQL 检索和操作数据\n\n在与数据库交互时，你将花费大量时间来检索和操作数据。大部分工作归于四种不同类型的操作，统称为 `CRUD` 缩写：`创建（Create）、读取（Read）、更新（Update）`和`删除（Delete）`由于这些数据操作至关重要，接下来的几节将向你详细介绍如何使用它们。\n\
  \n### 读取数据\n\n要从数据库中读取数据，你通常会使用几个不同的概念。首先，你需要指定想要从所查询的表中检索的列。你通过 `SELECT` 语句来实现这一点。你需要使用\
  \ `FROM` 关键字来指定要从哪些表中选择数据。然后，你需要一种过滤数据的方法，以确保只返回你感兴趣的行。你可以使用 SQL 语句中的 `WHERE` 子句对数据进行过滤。最后，你可以使用\
  \ `ORDER BY` 子句对结果进行排序。\n\n#### 选择数据\n\n要从一个或多个数据库表读取数据，你使用 `SELECT` 语句。在最基本的形式中，`SELECT`\
  \ 语句看起来如下：\n\n```\nSELECT ColumnName [, OtherColumnNames] FROM TableName\n```\n\n\
  在这里，方括号 `[]` 之间的部分是可选的。例如，从 `Genre` 表中检索所有行并仅选择它们的 `Id` 和 `Name` 列，你使用以下 SQL 语句：\n\
  \n```\nSELECT Id, Name FROM Genre\n```\n\n紧随 `SELECT` 语句之后的是逗号分隔的列名列表。你在这里可以只拥有一列，也可以有任意数量的列。你不需要显式指定列名，也可以使用星号（`*`）字符来表示你想返回所有列。然而，使用\
  \ `SELECT *` 通常被认为是不良的编程习惯，因为你通常选择的列比需要的多，导致不必要的开销。显式地定义你想要检索的每一列会更好。如果你想重命名结果集中的列，可以使用\
  \ `AS` 关键字，如下所示：\n\n```\nSELECT Id AS GenreId, Name FROM Genre\n```\n\n要限制从表中检索的行数，你使用\
  \ `TOP` 关键字后跟上最大行数。为了获得可预测的结果，你通常会使用 `ORDER BY` 子句。如果没有它，行的顺序是不保证的，且 `TOP` 每次调用它时可能会返回不同的结果。这里有一个快速示例，检索前三个流派：\n\
  \n```\nSELECT TOP 3 Id, Name FROM Genre ORDER BY Name\n```\n\nSSMS 默认使用 `TOP 200`\
  \ 来限制打开表时检索的行数。在 `FROM` 关键字之后，你指定要从哪个表中检索数据的表名。上一个示例只显示了一个表（`Genre` 表），但你稍后会看到，你也可以使用连接（joins）来指定多个表。\n\
  \n#### 过滤数据\n\n要过滤数据，你使用 `WHERE` 子句，通过它指定你希望数据匹配的标准。例如，要检索 Grunge 流类的 ID，你使用以下 SQL\
  \ 语句：\n\n```\nSELECT Id FROM Genre WHERE Name = 'Grunge'\n```\n\n注意，单词 Grunge 被括在单引号中。当你在过滤数据或想要将值发送到\
  \ `INSERT` 或 `UPDATE` 语句时（如后文所述，这些语句允许你创建新行或更改现有行），文本数据类型和日期需要这样做。不过你不能将其用于数值或布尔类型，因此要获取\
  \ ID 为 8 的流派名称，你会使用以下语句：\n\n```\nSELECT Name FROM Genre WHERE Id = 8\n```\n\n之前的两个示例展示了一个使用等于运算符进行精确匹配的\
  \ `WHERE` 子句。然而，你也可以使用其他运算符来实现不同的标准。下表列出了你可以在 `WHERE` 子句中使用的一些常用的比较运算符。\n\n| 运算符\
  \ | 描述 |\n| :--- | :--- |\n| `=` | `等于` 运算符仅在比较的左侧和右侧完全相同时匹配。 |\n| `>` | `大于` 运算符在比较的左侧表示的值比右侧大时匹配。\
  \ |\n| `>=` | `大于等于` 运算符在比较的左侧等于右侧时匹配。 |\n| `<` | `小于` 运算符在比较的左侧表示的值比右侧小时匹配。 |\n\
  | `<=` | `小于等于` 运算符在比较的左侧小于或等于右侧时匹配。 |\n| `<>` | `不等于` 运算符是等于运算符的反向，在左侧和右侧不同时匹配。\
  \ |\n\n为了组合多个 `WHERE` 标准，SQL 支持许多逻辑运算符，如 `AND` 和 `OR`。此外，它还支持其他运算符来搜索文本和指定范围。下表列了一些运算符并描述了它们的用途。\n\
  \n| 运算符 | 描述 |\n| :--- | :--- |\n| `AND` | 允许你连接两个表达式。例如，`WHERE Id > 20 AND Id <\
  \ 30` 子句返回 ID 在 20 到 30 之间的行（不包含 20 和 30）。 |\n| `OR` | 允许你定义多个标准，只需匹配一个（尽管允许多个匹配）。例如，`WHERE\
  \ GenreId = 5 OR GenreId = 8` 子句返回所有 `GenreId` 为 5 或 8 的行。 |\n| `BETWEEN` | 允许你指定一个想要匹配的值范围。例如，`WHERE\
  \ Id BETWEEN 10 AND 35` 返回所有 ID 在 10 到 35 之间的行（如果数据库中存在 10 和 35 则包含在）。 |\n| `LIKE`\
  \ | 用于确定值是否匹配特定模式。你可以使用通配符如 `%` 来匹配零个或多个字符的字符串，并使用下划线（`_`）来匹配单个字符。例如，`WHERE Name\
  \ LIKE '%rock%'` 子句返回所有名称中包含 `rock` 的流派，包括 Indie Rock、Hard Rock 等。 |\n\n如果没有行匹配\
  \ `WHERE` 子句，你不会得到错误，而是简单返回零结果。当你通过 `WHERE` 子句定义了过滤需求后，你可能想要更改数据库返回结果的顺序。你通过 `ORDER\
  \ BY` 子句来实现这一点。\n\n#### 排序数据\n\n\n\n\n\n`ORDER BY` 子句位于 SQL 语句的末，可以包含一个或多个列名或表达式，并可选包含\
  \ `ASC` 或 `DESC` 来决定项目是按升序（使用 `ASC`，如果省略关键字则默认为升序）还是降序（使用 `DESC`）排序。\n\n例如，要从 `Genre`\
  \ 表中检索所有类型并按名称按字母顺序升序排序，可以使用此 SQL 语句：\n\n```\nSELECT Id, Name FROM Genre ORDER BY\
  \ Name\n```\n\n由于升序是默认顺序，所以你不需要显式指定 `ASC` 关键字，尽管你有时时也可以这样做。接接的示例的功能与上一个示例等效：\n\n\
  ```\nSELECT Id, Name FROM Genre ORDER BY Name ASC\n```\n\n如果你想返回相同的行，但按 `Name` 列进行反序排序，可以使用此语法：\n\
  \n```\nSELECT Id, Name FROM Genre ORDER BY Name DESC\n```\n\n你可以在 `ORDER BY` 语句中对不属于\
  \ `SELECT` 语句的列进行排序，如下代码段所示：\n\n```\nSELECT Id, Name FROM Genre ORDER BY SortOrder\
  \ DESC\n```\n\n在下一个练习中，你将看到如何对示例数据库执行多个查询，这将让你很好地了解不同查询如何影响从数据库返回的结果。\n\n在示例中，你看到了如何从单张表中检索数据。然而，在大多数实际应用中，你从多个相互关联的表中获取数据。你可以在\
  \ SQL 语法中使用 `JOIN` 关键字来定义这种关系。\n\n## 合并数据 (Joining Data)\n\n查询中的 `JOIN` 允许你表示一个或多个表之间的关系。例如，你可以使用\
  \ `JOIN` 查找 `Review` 表中所有属于特定类型的评论，然后将 `Review` 表中的某些列与该类型的 `Name` 一起选择出来。\n\n`JOIN`\
  \ 的基本语法如下：\n\n```\nSELECT\n  SomeColumn\nFROM\n  LeftTable\nINNER JOIN RightTable\
  \ ON LeftTable.SomeColumn = RightTable.SomeColumn\n```\n\n第一部分是你之前见过的查询的标准 `SELECT`\
  \ 部分，第二部分引入了 `INNER JOIN` 关键字来表示两个表之间的关系。此查询只返回 `LeftTable` 中在 `RightTable` 中有对应行的行。例如，要同时返回评论的\
  \ ID、标题及其所属类型的名称，你可以使用此 SQL 语句：\n\n```\nSELECT\n  Review.Id, Review.Title, Genre.Name\n\
  FROM\n  Review\nINNER JOIN Genre ON Review.GenreId = Genre.Id\n```\n\n注意，在 `SELECT`\
  \ 语句中，每个列都带有表名前缀。这清楚地表明你指的是哪张表，并避免了多个表具有相似列名（如两个表中存在的 `Id` 列）时的冲突。\n\n除了只返回匹配行的\
  \ `INNER JOIN` 外，你还可以使用 `OUTER JOIN`。`OUTER JOIN` 允许你从一个表中检索行，无论它们在另一个表中是否有匹配行。接下来的示例返回了系统中的所有类型以及每个类型对应的评论列表：\n\
  \n```\nSELECT\n  Genre.Id, Genre.Name, Review.Title\nFROM\n  Genre\nLEFT OUTER JOIN\
  \ Review ON Genre.Id = Review.GenreId\n```\n\n对于分配给每个类型的每个评论，都会返回一个包含评论标题的唯一行。然而，即使某个类型没有分配评论，该行仍会被返回，如图\
  \ 12-14 所示。\n\n![image](img/f421-01.jpg)\n\n**图 12-14**\n\nIndie Rock 这种类型重复多次，`Review`\
  \ 表中分配给该类型的每条评论各出现一次。Punk 类型只关联了一条评论，因此它只列出了一次。最后，Rock 和 Grunge 类型没有关联的评论。然而，由于\
  \ SQL 语句使用了 `LEFT OUTER JOIN`，这两个类型（列在 `JOIN` 的左侧）仍然会被返回。该列现在不再包含评论的 `Title`，而是包含一个\
  \ `NULL` 值，以表示没有关联的评论。\n\n除了 `LEFT OUTER JOIN` 之外，还有 `RIGHT OUTER JOIN`，它会返回列在 `JOIN`\
  \ 右侧的表的所有行。\n\n此外，你还可以使用其他连接类型，包括交叉连接（cross joins）和自连接（self joins）。关于这些类型连接的详细描述，请参阅\
  \ Paul Atkinson 和 Robert Vieira 编写的书籍 *Beginning Microsoft SQL Server 2012 Programming*（Wrox,\
  \ 2012, ISBN: 978-1-1181-0228-2）。\n\n在下一个“尝试一试”中，你将看到如何使用一种非常常见的连接类型 `INNER JOIN`。\n\
  \n除了选择数据外，你还需要能够向数据库插入数据。你通过 `INSERT` 语句来实现。\n\n## 创建数据 (Creating Data)\n\n要向 SQL\
  \ Server 表中插入新行，你使用 `INSERT` 语句。它有几种不同的形式，但最简单的形式如下：\n\n```\nINSERT INTO TableName\
  \ (Column1 [, Column2]) VALUES (Value1 [, Value2])\n```\n\n与 `WHERE` 子句一样，你需要将字符串和日期值括在单引号中，但你可以输入数字。以下代码段显示了如何在\
  \ `Genre` 表中插入新行：\n\n```\nINSERT INTO Genre (Name, SortOrder) VALUES ('Tribal House',\
  \ 20)\n```\n\n`Genre` 表的 `Id` 列设置为自动生成（在本章稍后会介绍该概念）。\n\n## 更新数据 (Updating Data)\n\
  \n创建某些数据后，你可能想再次对其进行编辑。你通过 `UPDATE` 语句来实现。要更新表中的数据，你使用 `UPDATE` 语句：\n\n```\nUPDATE\
  \ TableName SET Column1 = NewValue [, Column2 = New2] WHERE Column3 = Value3\n```\n\
  \n使用 `UPDATE` 语句时，使用 `Column = Value` 结构来指定列的新值。你可以拥有任意数量的此类结构，每个列最多一个。要限制更新的行数，你使用\
  \ `WHERE` 子句，就像选择数据一样。如果没有 `WHERE` 子句，所有行都将受到影响，这通常不是你想要的。\n\n下面的示例更新了之前通过 `INSERT`\
  \ 语句插入的行。它将 `Name` 设置为 `Trance` 并将 `SortOrder` 更新为 `5`，以便在排序列表中移动。它还使用了新行的唯一 ID（在本例中为\
  \ `13`）作为 `WHERE` 子句来限制受影响的行数。\n\n```\nUPDATE Genre SET Name = 'Trance', SortOrder\
  \ = 5 WHERE Id = 13\n```\n\n## 删除数据 (Deleting Data)\n\n显然，你可能还需要删除现有的行。SQL 语言使用\
  \ `DELETE` 语句对此并不意外。\n\n与 `SELECT` 和 `UPDATE` 语句一样，你可以在 `DELETE` 语句中使用 `WHERE` 子句来限制删除的行数。这个\
  \ `WHERE` 子句通常非常重要，因为否则你会清空整个表，而不是只删除几行。注意！\n\n当你编写 `DELETE` 语句时，不需要指定任何列名。你只需要指定要从哪个表中删除行，以及一个可选的\
  \ `WHERE` 子句来限制删除的行数。下面的示例删除了在前两个示例中插入并更新的行：\n\n```\nDELETE FROM Genre WHERE Id\
  \ = 13\n```\n\n如果你省略了 `WHERE` 子句，表中的所有行都将被删除。\n\n你将在下一个练习中看到这些 SQL 语句的作用。\n\n\n\n\
  \n到此为止，你已经了解了如何操作数据库中的现有表。然而，了解如何自己创建带有关系的新表同样重要。将在下一节中进行讨论。\n\n## 创建你自己的表\n\n使用\
  \ SSMS 包含的数据库工具在 SQL Server 数据库中创建表是非常简单的。在下一节之后，你将看到如何在数据库中创建你自己的表，该节将简要介绍你在 SQL\
  \ Server 中可以使用的数据类型。\n\n### SQL Server 中的数据类型\n\n就像 Visual Basic .NET 和 C# 等编程语言一样，SQL\
  \ Server 数据库使用不同的数据类型来存储数据。SQL Server 2012 支持超过 30 种数据类型，其中大多数与 .NET 中使用的类型相似。下表列出了最常见的\
  \ SQL Server 数据类型及其描述以及对应的 .NET 类型。\n\n| SQL 2012 数据类型 | 描述 | .NET 数据类型 |\n| :---\
  \ | :--- | :--- |\n| `bit` | 以 0 / 1 格式存储布尔值（1 = 真，0 = 假）。 | `System.Boolean` |\n\
  | `char / nchar` | 包含固定长度的文本。当你存储比定义长度短的文本时，文本将用空格填充。`nchar` 以 Unicode 格式存储数据，使你能够存储多种外语言的数据（代价是数据库中需要两倍的空间）。\
  \ | `System.String` |\n| `datetime` | 存储 1753/1/1 到 9999/12/31 范围内的日期和时间。 | `System.DateTime`\
  \ |\n| `datetime2` | 与 `datetime` 类型类似，但具有更高的精度和范围（从 0001/1/1 到 9999/12/31）。 | `System.DateTime`\
  \ |\n| `date` | 存储不带时间元素的日期。 | `System.DateTime` |\n| `time` | 存储不带日期元素的时间。 | `System.TimeSpan`\
  \ |\n| `decimal` | 允许存储较大的小数。 | `System.Decimal` |\n| `float` | 允许存储较大的小数。 | `System.Double`\
  \ |\n| `binary /varbinary` | 允许存储大型二进制对象（如文件）。`binary` 是固定长度的，而 `varbinary` 存储变长度的二进制对象。\
  \ | `System.Byte[]` |\n| `tinyint` | 用于存储 0 到 255 整数。 | `System.Byte` |\n| `smallint`\
  \ | 用于存储 −32,768 到 32,767 整数。 | `System.Int16` |\n| `int` | 用于存储 −2,147,483,648\
  \ 到 2,147,483,647 整数。 | `System.Int32` |\n| `bigint` | 用于存储 −9,223,372,036,854,775,808\
  \ 到 9,223,372,036,854,775,807 大整数。 | `System.Int64` |\n| `text / ntext` | 用于存储大量文本。`ntext`\
  \ 以 Unicode 格式存储数据，使你能够存储多种外语言的数据。 | `System.String` |\n| `varchar / nvarchar` |\
  \ 用于存储变长度的文本。`nvarchar` 以 Unicode 格式存储数据。 | `System.String` |\n| `uniqueidentifier`\
  \ | 存储全局唯一标识符。 | `System.Guid` |\n\n要获取 SQL Server 2012 支持的所有数据类型的完整列表，请查看 MSDN\
  \ 文档：[`tinyurl.com/SqlDataTypes`](http://tinyurl.com/SqlDataTypes)。\n\n这些数据类型中的某些允许你指定最大长度。当你定义类型为\
  \ `char, nchar, varchar` 或 `nvarchar` 的列时，你需要指定字符长度。例如，`nvarchar(10)` 允许你存储最多 10\
  \ 个字符。对于 `char` 和 `nchar`，如果你提供的值短于最大长度，则存入列的值将用空格填充。`varchar` 和 `nvarchar` 类型还允许你指定\
  \ `MAX` 为最大大小。使用 `MAX` 指定符，你可以在单个列中存储高达 2GB 的数据。对于大段文本（如评论正文），你应该考虑 `nvarchar(max)`\
  \ 数据类型。如果你对列的最大长度有明确的想法（例如邮政编码或电话号码），或者你想显式限制其长度，则应该指定该长度。例如，评论标题可以存储在 `nvarchar(200)`\
  \ 列中，允许最多存储 200 个字符。\n\n### 理解主键和标识列\n\n为了唯一标识表中的某行，你可以设置主键。主键由表中的一个或多个列组成，这些列的值在所有行中都是唯一的。当你将某列标识为主键时，数据库引擎会确保没有两行具有相同的值。主键可以只由一列组成（例如，一个包含表中每行唯一数字的数值列，如你之前看到的\
  \ `Genre` 表中的 `Id` 列）。主键也可以由多个列组成（正如你之前看到的 `Genre` 表中的 `Id` 列，这些列共同构成了整行的唯一 ID）。SQL\
  \ Server 还支持标识列。标识列是一个在插入新行时自动生成顺序值的数值列。它们通常被用作表的主键。\n\n\n\n\n-   因为数据库通常是网站的核心，所以你需要仔细考虑它的设计。在开始在此基础上之上构建网站之前，预先想出一个良好的设计尤为重要。当你有许多页面访问你的数据库时，对数据模型进行更改（例如删除表或重命名列）将变得越来越困难。\n\
  \n-   始终为你的表考虑主键。我倾向于给每个表提供一个名为 `Id` 的列。其底层数据类型设为 `int` 并设置为标识列（identity），这会自动为每行数据生成一个唯一的\
  \ ID。除了 `int` 之外，你也可以考虑 `uniqueidentifier` 数据类型，它可以确保即使跨越数据库或应用程序边界也能保持唯一性。然而，`uniqueidentifier`\
  \ 的速度比 `int` 数据类型慢得多（特别是在插入时），因此只有在你需要 `uniqueidentifier` 数据类型的优势时才使用它。\n\n-   为你的数据库对象（如表和列）赋予逻辑名称。避免使用空格、下划线和连字符等字符。像\
  \ `GenreId` 这样的名字比 `colGen_ID_3` 更易读。\n\n-   不要使用 `SELECT *` 获取数据库的所有列。通过使用 `SELECT\
  \ *`，你可能会选择比实际需要的更多的列。通过显式定义你想要检索的列，你可以让你的意图对他更加清晰，同时提高查询的性能。\n\n-   在适当的情况下始终在表之间建立关系。虽然在没有表间关系的情况下查询本章中看到的评论和流派也可以良好运行，但关系有助于你强制执行数据质量。通过适当的关系，你可以最大限度地减少产生孤立数据或错误数据的概率。\n\
  \n# 总结\n\n处理数据库的能力是你 Web 开发技能集的有力补充。当今大多数动态网站都使用数据库，因此理解如何使用它们非常重要。\n\n要访问和操作关系型数据库中的数据，你需要使用一种名为结构化查询语言（Structured\
  \ Query Language，简称 SQL）的语言。在该语言中，它定义了四个重要的关键字，允许你对数据库执行 CRUD —— 创建（Create）、读取（Read）、更新（Update）、删除（Delete）操作。\n\
  \n`SELECT` 语句允许你从一个或多个表中检索数据。要访问多个表，可以使用可用的 `JOIN` 类型之一来定义表之间的关系。要限制查询返回的行数，你可以使用\
  \ `WHERE` 子句。要对查询返回的结果集中的项目进行排序，你使用 `ORDER BY` 子句。要在数据库中创建新行，你使用 `INSERT` 语句，并且你需要\
  \ `UPDATE` 语句来更改现有行。最后，要删除不再需要的行，你使用 `DELETE` 语句。与 `SELECT` 和 `UPDATE` 语句一样，`DELETE`\
  \ 也包含一个可选的 `WHERE` 子句，允许你限制被删除的行数。\n\n本章的第二部分向你展示了如何使用内置数据库工具创建具有相互关系的表。此外，你还看到了两个表之间的关系如何帮助你保护数据不至于变得损坏或孤立。\n\
  \n尽管本章重点关注了访问数据库需要编写的 SQL，但你在下一章中会发现，在许多情况下，Visual Studio 也会通过为你生成大部分代码让访问数据库变得非常简单。然而，扎实的\
  \ SQL 知识有助于你理解和调优为你生成的代码。\n\n## 本章学到的知识\n\n| CRUD | 处理数据库中数据的四种基本 SQL 操作：创建、读取、更新和删除。\
  \ |\n| Foreign key | 标识表中的某一列，该列引用另一个表的主键以强制引用完整性。 |\n| Identity | 分配给新行的自动顺序增数字。\
  \ |\n| JOIN | 允许你在查询中表示两个或多个表之间的关系，以找到相关数据。 |\n| Primary key | 由表中的一个或多个列组成，唯一标识该表中的行。\
  \ |\n| Relational database | 一种数据库，数据存储在独立的、类似电子表格的表中，这些表可以相互引用。 |\n| Relationship\
  \ | 定义一个或多个表之间的关系，并帮助你强制引用完整性。 |\n| Table | 数据库中的对象，允许你存储数据。 |\n\n# 第 13 章：显示和更新数据\n\
  \n## 你在本章将学到：\n\n- 如何使用 `GridView`、`DetailsView` 和 `SqlDataSource` 等控件显示、插入、编辑和删除数据。\n\
  - 如何使用 ASP.NET 验证控件创建一个丰富的界面，允许用户在维护数据完整性的同时插入和编辑数据。\n- 在你的应用程序中存储连接字符串的最佳方法，以便它们易于更新。\n\
  \n## 本章的 WROX.COM 代码下载\n\n你可以在 [www.wrox.com/go/begaspnet451](http://www.wrox.com/go/begaspnet451)\
  \ 的 Download Code 标签上找到本章的 wrox.com 代码下载。代码位于第 13 章文件夹。\n\n在本章中，你将学习如何使用 ASP.NET\
  \ 自带的常用数据控件来显示、插入、更新和删除数据。除了用于在网页显示和编辑数据的视觉控件外，你还学习了如何使用 `SqlDataSource` 控件，它作为数据库与你的\
  \ ASPX 页面之间的桥梁。\n\n你首先需要查看的是可用数据控件，将在下一节中讨论。\n\n## 数据控件\n\n为了让你能够高效地处理系统中的数据，ASP.NET\
  \ 提供了两组数据感知控件：数据绑定控件（data-bound controls）和数据源控件（data source controls）。\n\n第一组包含用于显示和编辑数据的控件，如\
  \ `GridView`、`Repeater` 和 `ListView`。数据源控件用于从数据源（如数据库或 XML 文件）检索数据，并将这些数据提供给数据绑定控件图图\
  \ 13-1](#Chapter13.xhtml_figure13-1) 显示了数据类别中可用控件的完整列表。\n\n### 数据绑定控件\n\n工具箱中所所示的图\
  \ 13-1 中的控件有七个是所谓的数据绑定控件。你使用它们在网页上显示和编辑数据。`GridView`、`DataList`、`ListView` 和 `Repeater`\
  \ 都能同时显示多行，因此它们通常被称为列表控件。`DetailsView` 和 `FormView` 设计为一次显示一行。`DataPager` 是用于为 `ListView`\
  \ 控件提供分页辅助控件。\n\n#### 列表控件\n\n由于 ASP.NET 提供了多个显示行的控件，你可能知道何时选择何种控件。`GridView` 是一个非常多功能的控件，支持自动分页（行分布在多个页面上）、排序、编辑、删除和选择。它像带有行和列的电子表格一样渲染其数据。虽然有许多方法可以对这些行和控件样式（你将在第\
  \ 15 章中学习更多），但你无法从根本上改变数据的呈现方式。此外，`GridView` 不允许你直接在底层数据源中插入行。\n\n\n\n\n`DataList`\
  \ 控件允许你不仅像 `GridView` 那样以行显示数据，还可以以列显示数据，使你能够创建类似矩阵的数据呈现。该控件可以被认为是已过时的，并被 `ListView`\
  \ 所代，后者的功能强大得多。因此，本书将不再进一步讨论 `DataList`。\n\n`Repeater` 在输出到浏览器的 HTML 方面为你提供了最大的灵活性，因为该控件本身不会向页面输出中添加任何\
  \ HTML。因此，它通常用于 HTML 有序列表或无序列表（`<ol>` 和 `<ul>`）以及其他你无法接受不必要的 HTML 与你自己的代码混杂的列表。你通过该控件暴露的众多模板来定义整个客户端标记。然而，这种灵活性是有代价的：该控件没有内置的分页、排序或修改数据的功能。你将在下一章看到更多关于\
  \ `Repeater` 控件的内容。\n\n`ListView` 在 ASP.NET 3.5 中引入，它是 `GridView`、`DataList` 和 `Repeater`\
  \ 的优点结合体。在 ASP.NET 4 和 4.5 中经过了一些变化，使其使用起来更加容易。该控件支持数据的编辑、删除和分页，类似于 `GridView`。它支持像\
  \ `DataList` 提供的多列和多行布局，并允许你像 `Repeater` 那样完全控制控件生成的标记。它还支持像 `DetailsView` 或 `FormView`\
  \ 控件那样插入和更新数据。在下一章中，你将看到更多关于 `ListView` 控件的内容。\n\n在 ASP.NET 4 中，列表控件扩展了 `ClientIDRowSuffix`\
  \ 属性，该属性允许你指定某一列的值，根据数据库中的数据用于创建唯一的客户端 ID。要使此功能生效，你需要将早期章节中见过的 `ClientIDMode` 属性设置为\
  \ `Predictable`。\n\n在 ASP.NET 4.5 中，控件再次扩展了一个新属性：`ItemType`。你将在下一章中看到该属性的应用。\n\n\
  ### 单项项目控件\n\n`DetailsView` 和 `FormView` 控件在某些方面非常相似，因为它们都可以一次显示单条记录。`DetailsView`\
  \ 使用内置的表格格式显示数据，而 `FormView` 使用模板让你定义数据的外观和感受。一个简单的、基于模板的 `DetailsView` 看起来可能像图\
  \ 13-3 所示。\n\n![image](img/f441-01.jpg)\n\n** 11-3 `FormView` 控件（以及你在第 16 章中看到的一些登录控件）具有\
  \ `RenderOuterTable` 属性。当你将此属性设置为 `False` 时（它默认值为 `True`，因此你需要显式设置），控件不会生成封装的 HTML\
  \ `<table>` 元素。这反过来导致了更代码和更整洁的 HTML。这两个控件都允许你为不同情况定义模板，例如数据的只读显示以及数据的插入和更新。你将在本章的后半部分学习如何自定义这些模板。\n\
  \n### 分页控件\n\n另一个实用控件是 `DataPager`，它允许其他控件进行分页。目前，你只能用它来扩展 `ListView` 控件，但可能会随着\
  \ .NET Framework 未来版本的更新而改变。`ListView` 和 `DataPager` 控件将在第 14 章讨论。\n\n为了让数据绑定控件显示有用的内容，你需要为它们分配数据源。要将此数据源绑定到控件，有两种主要方法：你可以将数据分配给控件的\
  \ `DataSource` 属性，或者可以使用其中一个独立的数据源控件。在后面的章节中，你将看到如何使用 `DataSource` 属性；不同的数据源控件是下一节的主题。\n\
  \n### 数据源控件\n\n工具箱中的“数据（Data）”类别包含六种不同的数据源控件，你可以使用它们将数据绑定到你的数据绑定控件。`XmlDataSource`\
  \ 和 `SiteMapDataSource` 控件用于将分级的、基于 XML 的数据绑定到这些控件。你在第 7 章创建站点地图时已经见过 `SiteMapDataSource`\
  \ 的应用。\n\n`ObjectDataSource` 控件允许你将数据绑定控件连接到应用程序中的独立对象。你不需要直接将数据感知型控件绑定到数据库，而是将来自自定义对象的独立层的数据绑定到它们。如果你想了解更多关于\
  \ `ObjectDataSource` 控件的信息，请购买 Wrox 的《Professional ASP.NET 4.5》(ISBN 978-1-118-31182-0)。\n\
  \n最后三个数据源控件是 `SqlDataSource`、`EntityDataSource` 和 `LinqDataSource` 控件。第一个在本章中讨论。`LinqDataSource`\
  \ 作为 LINQ to SQL 的数据源，该技术类似于你在第 14 章中学习的 ADO.NET Entity Framework。由于微软现在正在推广 Entity\
  \ Framework 而不是 LINQ to SQL，我不会在书中讨论 `LinqDataSource` 控件。`EntityDataSource` 用于旧版本的\
  \ Entity Framework，并且尚未针对最新版本的 EF 进行更新。与其使用此控件，微软建议使用一种名为“模型绑定（Model Binding）”的概念，这将在下一章进行详细讨论。\n\
  \n`QueryExtender` 控件的作用类似于 `LinqDataSource` 和 `EntityDataSource` 控件的插件，因为它允许你创建一个过滤界面来搜索特定数据，而无需编写大量代码。你可以在文中了解更多关于\
  \ `QueryExtender` 的信息：http://bit.ly/92kMP。\n\n### 其他数据控件\n\n工具箱中的最后一个控件是 `Chart`\
  \ 控件。它最初作为 Visual Studio 2008 的插件发布，现在已完全集成到 VS2013 中。它旨在渲染从简单的柱状图到 3D 饼图以及复杂的折线图图形。我将不再进一步讨论该控件，但你可以在这里找到讨论它的系列文章：http://tinyurl.com/nsvv\n\
  \n## 数据源与数据绑定控件协同工作\n\n`SqlDataSource` 控件允许你快速创建功能完备的数据库驱动网页。无需编写大量代码，你就可以创建执行 CRUD\
  \ 缩写中所有操作的网页：创建、读取、更新和删除数据。尽管它的名称似乎意味着该控件只能访问微软的 SQL Server，但事实并非如此。该控件也可以访问其他数据库，例如\
  \ Oracle 或 MySQL。\n\n### 使用 GridView 显示和编辑数据\n\n为了让你了解 `SqlDataSource` 控件如何与数据绑定控件配合工作，下一个尝试（Try\
  \ It Out）将向你展示如何创建一个简单的数据驱动网页，允许你更新和删除存储在数据库 `Genre` 表中的音乐类型。本章假设你的 `App_Data` 文件夹中包含带有\
  \ `Genre` 和 `Review` 表的 `PlanetWrox.mdf` 数据库。假设这些表每个包含若干行。如果你没有按照上一章的步骤操作，请使用该章节\
  \ `Resources` 文件夹提供的 `Create Planet Wrox Database.sql` 脚本文件创建所需的表和记录。你仍然需要按照上一章的解释，在\
  \ `C:\\BegASPNET\\Site\\App_Data` 创建数据库。\n\n\n\n\n既然你已经了解了如何显示、编辑和删除数据，现在是时候学习如何使用\
  \ `DetailsView` 控件在数据库中插入新行了。\n\n## 使用 DetailsView 插入数据\n\n就像使用 `GridView` 显示、更新和删除数据非常简单一样，使用\
  \ `DetailsView` 控件插入数据同样简单。`DetailsView` 支持多种模板，允许你在不同的模式下自定义控件的外观和感受。例如，该控件具有 `<HeaderTemplate>`、`<FooterTemplate>`\
  \ 和 `<PagerTemplate>` 元素，这些允许你定义控件顶部和底部的样式。此外，控件还具有 `<Fields>` 元素，它允许你定义应该显示在控件中的行，这类似于\
  \ `GridView` 的 `<Columns>` 元素。\n\n`DetailsView` 能够以几种不同的模式显示数据。首先，它可以以只读模式显示现有行。此外，你可以使用该控件来插入新行并更新现有行。你通过\
  \ `DefaultMode` 属性来控制 `DetailsView` 的模式，可以将其分别设置为 `ReadOnly`（只读）、`Insert`（插入）和 `Edit`（编辑）。接下来你将看到如何配置\
  \ `DetailsView` 并设置 `DefaultMode` 属性。\n\n当你在本章稍早将 `Genre` 表拖到 `Genres.aspx` 页面时，VS\
  \ 不仅为你创建了一系列控件，还在你的 `Web.config` 文件中存储了有关数据库的信息。将将解释其工作原理以及为什么这很重要。\n\n## 在 Web.config\
  \ 中存储连接字符串\n\n当你第一次将 `Genre` 表拖到页面时，VS 为你创建了一个 `SqlDataSource` 控件。为了告诉该控件访问哪个数据库，VS\
  \ 還在 `Web.config` 文件的 `<connectionStrings>` 元素下创建了一个连接字符串，并将 `SqlDataSource` 指向该字符串。`Web.config`\
  \ 中的设置如下：\n\n```\n<connectionStrings>\n  <add name=\"PlanetWroxConnectionString1\"\
  \ connectionString=\"Data Source=\n        (localdb)\\v11.0;AttachDbFilename=|DataDirectory|\\\
  PlanetWrox.mdf;\n              Integrated Security=True\"\n     providerName=\"\
  System.Data.SqlClient\" />\n</connectionStrings>\n```\n\n随后，`SqlDataSource` 如下访问此连接字符串：\n\
  \n```\n<asp:SqlDataSource ID=\"SqlDataSource1\" runat=\"server\"\n  ConnectionString=\"\
  <%$ ConnectionStrings:PlanetWroxConnectionString1 %>\"\n```\n\n此代码使用表达式语法来引用 `Web.config`\
  \ 中的连接字符串。它向 `Web.config` 文件请求监听名为 `PlanetWroxConnectionString1` 的连接字符串。它还读取 `providerName`\
  \ 属性，以确定其内部代码应如何与数据库通信。\n\n将连接字符串存储在 `Web.config` 中被认为是一种非常好的做法。通过集中管理连接字符串，当数据库发生变化时，你可以更容易地修改它们（例如从开发环境切换到生产服务器时）。千万不要将连接字符串直接存储在后台代码（Code\
  \ Behind）文件中或页面的标记部分。当你某天必须更改连接字符串并不得不翻遍网站中的所有页面来寻找连接字符串时，你会非常后悔的。\n\n你到目前为止使用的\
  \ SQL Server Express LocalDB 版本允许你在需要时即时处理挂载到 SQL Server 的数据库。查看实际的连接字符串来看看它是如何运作的：\n\
  \n```\nData Source=(localdb)\\v11.0;\nAttachDbFilename=|DataDirectory|\\PlanetWrox.mdf;\n\
  Integrated Security=True;\n```\n\n此连接字符串由三部分组成（在你的 `config` 文件中都在同一行）。第一部分的值包含了用于识别目标\
  \ SQL Server 的数据源，在这种情况下，它是 SQL Server 2012 的 LocalDB 实例。你可能会遇到的其他有效数据源包括 `.`（仅一个点，表示本地机器）、`.\\\
  SqlExpress`（针对运行在本地机器上的 SQL Server Express 具名实例版本，其中 `SqlExpress` 是实例名），或类似 `MachineName`\
  \ 或 `MachineName\\InstanceName` 的内容（针对远程机器或远程机器上的具名实例）。\n\n`AttachDbFileName` 包含指向\
  \ SQL Server Express 数据库的路径。`|DataDirectory|` 占位符在运行时展开为 `App_Data` 文件夹的完整物理路径。因此，当页面加载且\
  \ `SqlDataSource` 需要连接到数据库时，它将打开 `C:\\BegASPNET\\Site\\App_Data\\` 下的 `PlanetWrox.mdf`\
  \ 文件。作为 `AttachDbFileName` 的替代，你会在其他连接字符串中遇到 `Initial Catalog`。`Initial Catalog`\
  \ 指向你使用的 SQL Server 上的可用数据库。你可以在目录 B 中看到更多内容。\n\n连接字符串的最后一部分与安全有关。使用集成安全（Integrated\
  \ Security），将使用 Web 服务器的账户来连接数据库。在 VS 和 IIS Express 的情况下，该账户是你登录机器时使用的账户。如果你使用的是完整版\
  \ IIS，该账户是以 IIS 应用程序池命名的账户，或者是名为 Network Service（网络服务）的特殊账户。处理部署的第 19 章以及解释如何连接到\
  \ SQL Server 的目录 B 深入探讨了与安全相关的问题。\n\n到目前为止，你已经看到了上一节介绍的大部分数据库概念。你看到了创建（使用插入模式下的\
  \ `DetailsView`）、读取（使用 `GridView` 和 `SelectCommand`）、更新（使用 `GridView` 和 `UpdateCommand`）以及删除（使用\
  \ `GridView` 和 `DeleteCommand`）。此外，你看到了通过单一设置在 `GridView` 中启用排序。你还没有看到的是过滤，即限制显示数据的方法。在下一节中，你将看到如何创建一个过滤器来显示属于特定类型的评论。\n\
  \n## 过滤数据\n\n正如你在上一节中学到的那样，你使用 `WHERE` 子句来过滤数据。VS 和 ASP.NET 提供了许多工具让创建过滤变得简单。为了过滤数据，`SqlDataSource`\
  \ 控件（和其他数据源控件）具有 `<SelectParameters>` 元素，允许你在运行时提供用于过滤的值。这些值可以来自各种来源，如下表所示：\n\n\
  | 使用（参数类型） | 值提取自 |\n| --- | --- |\n| `ControlParameter` | 页面上的控件，例如 `DropDownList`\
  \ 或 `TextBox`。 |\n| `CookieParameter` | 存储在用户计算机上的 Cookie，并在每次请求时发送到服务器。 |\n| `FormParameter`\
  \ | 提交到服务器的表单值。 |\n| `Parameter` | 各种来源。使用此参数时，通过代码设置值。 |\n| `ProfileParameter`\
  \ | 用户配置上的属性。ASP.NET 配置在第 17 章有详细讨论。 |\n| `QueryStringParameter` | 查询字符串字段。 |\n\
  | `SessionParameter` | 存储在会话中的值，会话是用户访问网站期间存在的服务器端特定用户数据存储。 |\n\n由于这些参数的行为大体相同，在自己的代码中使用它们非常容易。一旦你理解了如何使用其中一个，你就能很快学会其他参数。你将在下一个练习中看到\
  \ `ControlParameter` 的用法，在该练习中，你将使用一个包含所有类型的 `DropDownList` 来过滤出属于特定类型的评论列表。\n\n\
  \n\n\n\n设置好筛选控制后，下一步是创建一个 `GridView`，用于显示所选类型的评论。你将在下一个练习中看到如何实现这一点。\n\n到目前为止，你一直依赖\
  \ VS 的代码生成工具来设置 `GridView` 和 `DetailsView`。默认情况下，VS 会为在数据源中找到的每一列创建一个列（针对 `GridView`）或一个字段（针对\
  \ `DetailsView`）。它足够智能，能够识别数据源中某些底层类型，因此对于数据库中的布尔（位位）字段，你会获得一个很棒的 `CheckBoxField`，但仅此而已了。要进一步自定义这些数据控件的外观和体验，你需要自定义它们的\
  \ `Columns` 和 `Fields` 集合。\n\n## 自定义数据控件的外观\n\n默认情况下，`GridView` 和 `DetailsView`\
  \ 根据它们接收到的数据自动渲染列或行。或者，你也可以在控件绑定到数据源时，让 VS 为你创建多个字段或列。但通常情况下，你想要更改屏幕上显示的内容，无论是更少的列、不同的列标题，还是用于显示数据的不同控件。幸运的是，通过\
  \ VS 中的字段编辑器（Fields editor）可以很容易地实现这一点。在下一节中，你将看到如何使用此编辑器创建和修改不同类型的内置列和字段。在随后的章节中，你将看到如何使用用户定义的模板进一步自定义字段。\n\
  \n### 配置数据绑定控件的列或字段\n\n在 `GridView` 和 `DetailsView` 的 `<Columns>` 或 `<Fields>` 元素中，你可以添加下表所示类型的字段。\n\
  \n| FIELD 类型 | 说明 |\n| :--- | :--- |\n| `BoundField` | 大多数数据库类型的默认字段。在只读模式下以简单文本的形式渲染，在编辑模式下渲染为\
  \ `TextBox`。 |\n| `ButtonField` | 渲染为链接或按钮，允许你在服务器上执行命令。 |\n| `CheckBoxField` |\
  \ 在只读模式下渲染为只读复选框，在编辑模式下渲染为可编辑复选框。 |\n| `CommandField` | 允许设置各种命令，包括编辑、插入、更新和删除。\
  \ |\n| `HyperLinkField` | 渲染为链接（`<a>` 元素）。你可以设置 `DataNavigateUrlFields, DataNavigateUrlFormatString`\
  \ 和 `DataTextField` 等属性来影响链接的行为。你将在下一个练习中看到更多内容。 |\n| `ImageField` | 在浏览器中渲染为 `<img>>>`\
  \ 元素。 |\n| `TemplateField` | 允许你为各种模板定义自己的外观和体验，如 `ItemTemplate, InsertItemTemplate`\
  \ 和 `EditItemTemplate`。 |\n\n显然，每个字段类型都有独特的用途，因此你可以选择最符合你需求的一个。你将在下一个练习中更详细地查看其中一些字段类型。\n\
  \n你设置的 `Title` 列的 `HyperLink` 指向名为 `AddEditReview.aspx` 的页面。该页面允许你创建新评论并更新现有评论。你将在下一节中看到如何创建此页面。\n\
  \n## 更新和插入数据\n\n在本章较早，我讨论了如何使用 `GridView` 和 `SqlDataSource` 控件进行简单的更新。虽然这种内置更新行为在很多情况下是可以的，但它并不总是足够充分满足你的所有需求。\n\
  \n幸运的是，`FormView` 和 `DetailsView` 等控件允许你调整它们的外观和体验，为你的终端用户处理数据的方式提供了更多的灵活性。在下一节中，你将看到如何使用\
  \ `DetailsView` 为用户提供一个更简单的界面，在数据库中插入和编辑评论。\n\n### 使用 DetailsView 插入和更新数据\n\n在本章较早之前，你学习了如何设置一个简单的\
  \ `DetailsView` 控件，并完全依赖 VS 和控件本身在浏览器中渲染相关的用户界面。显然，这种默认行为通常是不够的。如果你想影响界面中使用的控件怎么办？例如，如果你想使用\
  \ `DropDownList` 而不是简单的 `TextBox` 来选择类型呢？如果你想添加在第 9 章中学到的一个或多个验证控件呢？或者，如果你想通过程序化方式管理发送到数据库的某些数据呢？通过\
  \ `DetailsView` 控件、其基于模板的列以及该控件在生命周期各个阶段触发的众多事件，这一切都是可能的。\n\n但首先，你需要更多地了解数据绑定控件和数据源控件触发的各种事件。下表列出了\
  \ `DetailsView`、`FormView` 和 `ListView` 在其生命周期内暴露并引发的一些事件。`GridView` 具有类似的事件，但它们以\
  \ `Row` 而不是 `Item` 开。由于 `DataList` 和 `Repeater` 控件原生不支持数据编辑，因此它们不具备这些事件中的任何一个。\n\
  \n| 事件 | 说明 |\n| :--- | :--- |\n| `ItemInserting` | 在对数据源执行 `Insert` 命令之前立即触发。这是更改即将发送到数据的理想位置。\
  \ |\n| `ItemInserted` | 在对数据源执行 `Insert` 命令后立即触发。 |\n| `ItemUpdating` | 在对数据源执行\
  \ `Update` 命令之前立即触发。这是更改即将发送到数据的理想位置。 |\n| `ItemUpdated` | 在对数据源执行 `Update` 命令后立即触发。\
  \ |\n| `ItemDeleting` | 在对数据源执行 `Delete` 命令之前立即触发。 |\n| `ItemDeleted` | 在对数据源执行\
  \ `Delete` 命令后立即触发。 |\n\n这六个事件在控件生命周期非常方便的时刻触发：在数据发送到数据库之前和之后。你将在下一个尝试（Try Out）中看到如何使用它们。\n\
  \n这个练习为后续练习奠定了良好的基础，在后续练习中你将通过实现带有验证控件的自定义模板来扩展 `DetailsView`并设置各种事件处理器来响应控件的事件。\n\
  \n现在带有 `DetailsView` 的页面看起来非常单调。如果它具有以下功能，看起来会好得多，用起来也会更方便：\n\n* 对于 Summary 和 Body\
  \ 字段使用文本区域而不是单行文本框\n* 使用从数据库获取的可用类型填充类型的下拉列表\n* 自动更新 `UpdateDateTime` 列\n* 防止留空必填字段的验证控件\n\
  * 在插入或更新项目后自动重定向到 `Reviews.aspx` 页面\n\n下一个练习将向你展示如何实现所有这些功能。\n\n更新过程中典型的错误可能是类型\
  \ ID 不正确。如果你没有正确设置 `DropDownList`，数据库将收到无效的类型 ID，导致 `INSERT` 或 `UPDATE` 失败。通过在发生错误时不进行重定向，错误消息将显示在屏幕上，这样你有机会修复它。\n\
  \n随着对 `DetailsView` 控件触发的各种事件的讨论，你已经来到了本章的结束。现在，你应该对如何使用 `GridView`、`DetailsView`\
  \ 和 `SqlDataSource` 控件执行 CRUD 操作有了相当好的理解。\n\n\n\n\n尽管 `SqlDataSource` 控件非常好，但许多开发者并不喜欢或使用它。该控件的一个最大缺点是，你的\
  \ SQL 语句最终直接出现在你的 ASPX 页面中。如果你开始更改数据库架构，这可能会引发非常麻烦。即使你认为永远不需要这样做，你也可以非常确定你总有一天会需要更改它。一旦你这样做了，程序很可能会崩溃。例如，如果你将\
  \ `Genre` 表的 `Name` 列重命名为 `Description`，你的应用程序就会崩溃。然而，在运行之前你并不会发现这一点，因为 VS 无法根据\
  \ `SqlDataSource` 控件中定义的命令文本来检查数据库架构。你有几种方法可以用来规避这个问题。其中一种解决方案是构建强类型对象，并转而使用 `ObjectDataSource`\
  \ 控件。此解决方案的细节超出了本书的范围，但欢迎访问我的网站，我在那里发布了一系列演示了这一概念的文章：[`bit.ly/9woD7D`](http://bit.ly/9woD7D)。该系列中介绍的概念相当高级，因此你可能想在读完此本书后再深入研究。\n\
  \n另一种替代方案是利用 ADO.NET Entity Framework，这是下一章的主题，它还将向你展示如何使用模型绑定（Model Binding）以及\
  \ `ListView` 和 `DataPager` 控件来执行类似的操作，而无需在代码中编写嵌入 SQL 语句。\n\n## 显示和更新数据的实用技巧\n\n\
  以下列表提供了一些显示和更新数据的实用技巧：\n\n*   始终将你的连接字符串存储在 `Web.config` 文件中。虽然直接将它们存储在页面的 `SqlDataSource`\
  \ 控件中似乎很容易，但当你以后需要更改连接字符串时，就会遇到麻烦。\n*   始终考虑在你的数据输入页面上添加验证控件。这让你的用户更容易发现需要哪些数据以及他们应该以什么格式提供数据，同时又能保护你的系统免接收和处理错误数据。\n\
  *   如果你有长数据列表需要展示，请始终考虑为 `GridView` 等控件开启分页。如果你向用户展示包含许多项目的列表，他们往往会迷失方向。通常，每页大小在\
  \ 10 到 20 个项目之间效果最好。\n*   考虑将页面中的控件重命名为默认值以外的名称。例如，在之前的“试一试”练习中，你将 `SqlDataSource2`\
  \ 重命名为 `GenresDataSource`。这让你更容易看到需要哪个数据源来获取关于分类的信息。如果页面上只有几个控件，这并不是问题，但随着页面的增长，为控件选择具有区分性的名称变得越来越重要。\n\
  *   考虑设置 `AddEditReview.aspx` 中验证控件的 `CssClass` 并将其挂载到 CSS 类。你现在可以在根目录 `Styles`\
  \ 文件夹中的样式表中创建它们，并将该文件链接到主页。在随后的章节中，你将为管理部分创建一个单独的主题。\n\n## \n\n本章基于你在第 12 章中获得的通过\
  \ SQL 访问数据库的通用知识。它首先讨论了 Visual Studio 工具箱中数据（Data）类的众多控件。\n\n这些控件可以分为两组：数据绑定控件和数据源控件。第一组——包括\
  \ `GridView`、`DetailsView` 和 `ListView`——用于显示数据。第二组是数据源控件，它们没有视觉外观，但允许你访问许多类型的数据。\n\
  \n# 第 14 章：LINQ 和 ADO.NET Entity Framework\n\n你将在本章中学习到：\n\n*   什么是 LINQ 及其语法看起来是什么样\n\
  *   可用的 LINQ 不同形式以及何时何时使用它们\n*   如何使用 ADO.NET Entity Framework\n*   如何使用模型绑定访问 ADO.NET\
  \ Entity Framework\n*   如何使用 `ListView` 和 `DataPager` 控件\n\n本章的 WROX.COM 代码下载\n\n\
  你可以在 [www.wrox.com/go/begaspnet451](http://www.wrox.com/go/begaspnet451) 的 Download\
  \ Code 标签上找到本章的 wrox.com 代码下载。代码位于 Chapter 14 文件夹中。\n\n语言集成查询 (LINQ) 是与 .NET Framework\
  \ 使用的编程语言密集的查询语言。LINQ 允许你在 .NET 编程语言内部查询数据，就像 SQL 允许你在数据库中查询数据一样。事实上，LINQ 语法部分参考了\
  \ SQL 语言，这使得熟悉 SQL 的程序员更容易上手 LINQ。\n\n## 介绍 LINQ\n\nLINQ 允许你直接从编程代码从各种数据源查询数据。LINQ\
  \ 之于 .NET 编程正如 SQL 之于关系型数据库。\n\n\n\nLINQ 不仅仅是 .NET Framework 的一个附加组件。相反，LINQ 已被设计并实现为\
  \ .NET 编程语言的组成部分。这意味着 LINQ 真正集成到了 .NET 中，为您提供了一种统一的数据查询方式，无论这些数据来自何处。此外，由于它是集成在语言中而非特定的项目类型中，LINQ\
  \ 可用于各种项目，包括 Web 应用程序、Windows Forms 应用程序、控制台应用程序等。为了帮助开发者熟悉 LINQ，它的语法紧密参考了 SQL——这是关系型数据库最流行的查询语言。这意味着\
  \ LINQ 拥有诸如 `Select`、`From` 和 `Where` 等关键字，用于从数据源获取数据。\n\n为了让你直观了解 LINQ 查询的样貌，这里有一个简单的示例，展示了一个名字中包含大写字母\
  \ \"S\" 的 Wrox 作者列表：\n\nVB.NET\n\n```vb\nDim authors As String() = New String()\
  \ {\"Hanselman, Scott\", \"Evjen, Bill\",\n                          \"Haack, Phil\"\
  , \"Vieira, Robert\", \"Spaanjaars, Imar\"}\nDim result = From author In authors\n\
  \             Where author.Contains(\"S\")\n             Order By author\n     \
  \        Select author\nFor Each author In result\n  Label1.Text += author + \"\
  <br />\"\nNext\n```\n\nC#\n\n```csharp\nusing System.Linq;\n...\nstring[] authors\
  \ = new string[] { \"Hanselman, Scott\", \"Evjen, Bill\",\n                   \"\
  Haack, Phil\", \"Vieira, Robert\", \"Spaanjaars, Imar\" };\nvar result = from author\
  \ in authors\n             where author.Contains(\"S\")\n             orderby author\n\
  \             select author;\n\nforeach (var author in result)\n{\n  Label1.Text\
  \ += author + \"<br />\";\n}\n```\n\n尽管此示例使用的语法可能非常易懂，但示例本身非常强大。给定一个包含作者名字的字符串数组，你可以简单地选择所有名字中包含大写字母\
  \ \"S\" 的作者，并按升序对他们排序。在这个示例中，`Label` 控件显示了我的名字和 Scott Hanselman 的名字，这并不意外，因为只有这两个名字符合\
  \ `Where` 标准。注意在 C# 中代码是如何导入 `System.Linq` 命名空间的。这是必要的为了将 LINQ 功能引入你的应用程序作用域。如果你发现某些关键字没有在\
  \ IntelliSense 中显示，或者 VS 对你的 LINQ 查询给出了编译错误，请检查是否在代码文件顶部导入了此命名空间。在 VB 网站中，此命名空间默认包含的。\n\
  \n当然，这个示例只是开始。在后续三个章节中讨论的不同类型 LINQ 允许你针对各种数据源创建强大得多的查询。\n\n由于 LINQ 如此强大且具有巨大的潜力，它已被集成到\
  \ .NET Framework 的许多不同领域。接下来的章节介绍了不同的 LINQ 实现方式。\n\n### LINQ to Objects\n\n这是语言集成最纯粹的形式。通过\
  \ LINQ to Objects，你可以像在上一个示例中看到的那样查询 .NET 应用程序中的集合。你不局限于数组，因为 LINQ 允许你查询 .NET Framework\
  \ 中存在的任何类型的集合。\n\n### LINQ to XML\n\nLINQ to XML 是读取和写入 XML 的新 .NET 方式。不再使用 XSLT\
  \ 或 XPath 等典型的 XML 查询语言，你现在可以在应用程序中直接编写目标为 XML 的 LINQ 查询。\n\n### LINQ to ADO.NET\n\
  \nADO.NET 是 .NET Framework 的一部分，允许你访问数据以及数据服务（如 SQL Server 和许多其他类型的数据源）。ADO.NET\
  \ 也在 `SqlDataSource` 控件底层使用，并通常用于“原始数据访问代码”——即使用 C# 或 VB.NET 编写、不使用声明式数据控件连接到数据库的代码。通过\
  \ LINQ to ADO.NET，你可以查询数据库相关的信息集，包括 LINQ to DataSet、LINQ to SQL 和 LINQ to Entities。\n\
  \nLINQ to DataSet 允许你针对 `DataSet` 编写查询，`DataSet` 是表示数据库内存版本的类。\n\nLINQ to SQL 允许你在\
  \ .NET 项目中编写针对 Microsoft SQL Server 数据库的面向对象的查询。LINQ to SQL 实现将你的查询转换为 SQL 语句，然后发送到数据库以执行典型的\
  \ CRUD 操作。在本书的 3.5 版本中，整个章节都专门给了 LINQ to SQL。然而，微软已经表示它将不再积极开发 LINQ to SQL。在可预见的未来，它将仍然是\
  \ .NET Framework 和 Visual Studio 的一部分，但微软不会为其添加新功能。其原由于它与 Entity Framework (EF)\
  \ 在功能上有很大的重叠。在 LINQ to SQL 中可以做的几乎任何事情在 LINQ to Entities 中都可以完成。然而，后者的框架比 LINQ to\
  \ SQL 强大得多，并提供了更多功能。因为它更强大，Entity Framework 优于 LINQ to SQL，因此它是本章的主题。\n\n有关其他类型实现性的更多信息，请查看\
  \ LINQ 官方首页：[`bit.ly/18ypUj`](http://bit.ly/18ypUj)。\n\n## 介绍 ADO.NET ENTITY FRAMEWORK\n\
  \nEF 是一个对象关系映射 (ORM)，支持面向数据驱动软件应用程序的开发。通过 EF，你可以将许多数据库对象（如表）转换为可以在代码中访问的 .NET 对象。然后你可以在查询中使用这些对象，或者在数据绑定场景中使用它们。EF\
  \ 还允许你进行反向操作：先设计对象模型，然后让 EF 创建数据库结构。\n\n使用 EF 工作非常简单且灵活。使用图表设计器，你可以将表等对象从数据库拖入模型中。拖到图表上的数据库对象将变为\
  \ .NET 对象。例如，如果你将 `Review` 表拖入图表，你将获得一个强类型的 `Review` 类。你可以使用 LINQ 查询或其他方法创建该类的实例，正如后文所示。\n\
  \n当你在图表上拖入多个相关的数据库表时，设计器会检测表之间的关系，然后在你的对象模型中复制这些关系。例如，如果你在代码中使用 LINQ to Entities\
  \ 查询创建一个 `Review` 实例（正如后文所示），你可以访问它的 `Genre` 属性，从而访问 `Name` 等属性：\n\nVB.NET\n\n```vb\n\
  Label1.Text = myReview.Genre.Name\n```\n\nC#\n\n```csharp\nLabel1.Text = myReview.Genre.Name;\n\
  ```\n\n同样，你可以访问特定分类的 `Reviews` 集合，例如将其绑定到数据绑定控件：\n\nVB.NET\n\n```vb\nRepeater1.DataSource\
  \ = myGenre.Reviews\n```\n\nC#\n\n```csharp\nRepeater1.DataSource = myGenre.Reviews;\n\
  ```\n\n现在不要担心具体的语法。在本章剩余部分你会看到更多。本节重要的是 EF 在你的 .NET 应用程序和 SQL Server 数据库之间创建了一个层。Entity\
  \ Designer 为你处理大部分工作，提供了一个可以在应用程序中使用整洁的对象模型。\n\n## 将你的数据模型映射到对象模型\n\n通过 EF，你将数据库项（如表、列和关系）映射到应用程序中对象模型中的对象和属性。VS\
  \ 提供了出色的工具来使这种映射尽可能简单，正如在以下练习所示。\n\n在接下来的章节中，你将学习更多关于驱动 .NET 查询能力的语言——LINQ 查询语法。\n\
  \n\n\n\n你在上一个示例中看到的查询非常简单；它请求系统中的所有授权评论并按排序顺序返回它们。然而，LINQ 的查询能力比这要强大得多。在本节中，你将学习更多关于用于查询对象模型的\
  \ LINQ 查询语法。请记住，LINQ 语法并不是专门为 Entity Framework 发明的。后续介绍的大多数 LINQ 概念也可以用于其他 LINQ\
  \ 实现，例如 LINQ to Objects 和 LINQ to ADO.NET。\n\n## 标准查询运算符\n\nLINQ 支持大量的查询运算符 —— 这些关键字允许你对从查询中返回的数据进行选择、排序或过滤。虽然本章中的所有示例都是在\
  \ EF 的背景下讨论的，但你也可以轻松地将它们应用于其他 LINQ 实现。在接下来的章节中，你将概述最重要的标准查询运算符，每个运算符后面都有一个示例。每个示例都使用对象模型和你之前创建的名为\
  \ `myEntities` 的 `DbContext` 对象作为查询数据源。\n\n### Select\n\n`Select` 关键字（C# 中为 `select`）用于从你查询的源检索对象。在数示例中，你将看到如何选择现有类型的对象。在本章的后半部分，你将看到如何动态定义新的对象形状。\n\
  \nVB.NET\n```\nDim allReviews = From r In myEntities.Reviews\n                 Select\
  \ r\n```\n\nC#\n```sharp\nvar allReviews = from r in myEntities.Reviews\n      \
  \           select r;\n```\n\n此示例中的变量 `r` 被称为*范围变量*（range variable），它仅在当前查询可用。你通常在\
  \ `From` 子句中引入范围变量，然后在 `Where` 和 `Select` 子句中再次使用它过滤数据并指定你想要选择的数据。虽然你可以选择任何喜欢的名称，但你经常看到单字母变量，如\
  \ `r`（代表 `Review`），或者看到你正在查询的集合的单数形式（在前面的示例中使用 `review` 代替 `r`）。\n\n### From\n\n\
  尽管它不被认为是标准查询运算符 —— 因为它不是对数据操作，而是指向数据 —— 但 `From` 子句（C# 中为 `from`）是 LINQ 查询中的一个重要元素，因为它定义了查询必须作用的集合或数据源。在上一个示例中，`From`\
  \ 子句表示查询必须针对 EF 中 `myEntities` 对象暴露的 `Reviews` 集合执行。\n\n### Order By\n\n通过 `Order\
  \ By`（C# 中为 `orderby`，没有 VB.NET 使用的空格），你可以对结果集合中的项进行排序。`Order By` 后面跟着可选的 `Ascending`\
  \ 或 `Descending`（C# 中为 `ascending` 和 `descending`）来指定排序顺序。你可以通过逗号分隔指定多个标准。以下查询返回一个类型列表，首先按\
  \ `SortOrder` 降序排序，然后按 `Name` 升序排序（默认）：\n\nVB.NET\n```\nDim allGenres = From g In\
  \ myEntities.Genres\n                Order By g.SortOrder Descending, g.Name\n \
  \               Select g\n```\n\nC#\n```sharp\nvar allGenres = from g in myEntities.Genres\n\
  \                orderby g.SortOrder descending, g.Name\n                select\
  \ g;\n```\n\n### Where\n\n就像 SQL 中的 `WHERE` 子句一样，LINQ 中的 `Where` 子句（C# 中为 `where`）允许你过滤查询返回的对象。以下查询返回所有授权的评论：\n\
  \nVB.NET\n```\nDim authorizedReviews = From r In myEntities.Reviews\n          \
  \              Where r.Authorized = True\n                        Select r\n```\n\
  \nC#\n```sharp\nvar authorizedReviews = from r in myEntities.Reviews\n         \
  \               where r.Authorized == true\n                        select r;\n\
  ```\n\n注意，`Where` 子句使用了语言的标准等号运算符：VB.NET 中是单个等号（=`），在 C# 中是两个。\n\n### Sum, Min,\
  \ Max, Average, and Count\n\n这些聚合运算符允许你对结果集中的对象进行数学计算。例如，要检索评论的数量，你可以执行此查询：\n\n\
  VB.NET\n```\nDim numberOfReviews = (From r In myEntities.Reviews\n             \
  \         Select r).Count()\n```\n\nC#\n```sharp\nvar numberOfReviews = (from r\
  \ in myEntities.Reviews\n                      select r).Count();\n```\n\n注意，`Count`\
  \ 方法应用于整个结果集。因此，你需要将整个语句封装在括号中，然后调用 `Count`。如果没有括号，你将得到错误。此示例中的 `numberOfReviews`\
  \ 变量将被*推断*为整数，并包含 `Review` 表中的项数。\n\n### Take, Skip, TakeWhile, and SkipWhile\n\n\
  `Take` 和 `Skip` 允许你在结果集中进行子选择。这对于分页场景是理想的，因为只需检索当前页的项。`Take` 从结果集中获取请求数量的元素并忽略其余部分，而\
  \ `Skip` 则忽略请求数量的元素并返回其余部分。\n\n在 EF 中，`Take` 和 `Skip` 运算符也会翻译为 SQL 语句。这意味着分页发生在数据库级别，而不是\
  \ ASP.NET 页面。这极大地增强了查询的性能，特别是对于大型结果集，因为并不是所有的元素都必须从数据库传输到 ASP.NET 页面。\n\n为了让 `Skip`\
  \ 在 LINQ to Entities 中工作，你必须向查询中添加 `Order By` 子句（C# 中为 `orderby`）以便在跳过之前排序结果。如果不添加\
  \ `ORDER BY` 语句，数据库返回的结果可能是不可预测的，因此在 LINQ 查询中添加 `Order By` 操作以获得一致的结果。\n\n以下示例显示如何在页大小为\
  \ 10 的情况下检索第二页行：\n\nVB.NET\n```\nDim someReviews = (From r In myEntities.Reviews\n\
  \                  Order By r.Title\n                  Select r).Skip(10).Take(10)\n\
  ```\n\nC#\n```sharp\nvar someReviews = (from r in myEntities.Reviews\n         \
  \         orderby r.Title\n                  select r).Skip(10).Take(10);\n```\n\
  \n就像 `Count` 示例一样，查询被封装在括号中，随后调用 `Skip` 和 `Take` 来获取请求的行。\n\n`TakeWhile` 和 `SkipWhile`\
  \ 查询运算符的工作方式类似，但允许你在特定条件真时获取或跳过项。遗憾的是，它们在 EF 中不起作用，但你通常可以通过向查询添加简单的 `Where` 子句来解决这个问题。\n\
  \n### Single andOrDefault\n\n`Single` 和 `SingleOrDefault` 运算符允许你返回单个强类型实例。这在你知道查询恰好返回一行时非常有用；例如，当你通过唯一\
  \ ID 检索它时。以下示例从数据库检索 ID 为 37 的评论：\n\nVB.NET\n```\nDim review37 = (From r In myEntities.Reviews\n\
  \                Where r.Id = 37\n                Select r).Single()\n```\n\nC#\n\
  ```sharp\nvar review37 = (from r in myEntities.Reviews\n                where r.Id\
  \ == 37\n                select r).Single();\n```\n\n当未找到请求的项或查询返回多个实例时，`Single`\
  \ 运算符将抛出异常。如果你希望方法返回 `null`（VB.NET 中为 `Nothing`）或相关数据类型的默认值（例如 `Integer` 的 0，`Boolean`\
  \ 的 `False` 等），则请使用 `SingleOrDefault`。\n\n\n\n\n\n即使数据库中仅有一个 `Id` 为 `37` 的 `Review`，如果你省略了对\
  \ `Single` 的调用，仍然会获得一个评论集合（仅包含一个元素）。通过使用 `Single`，你可以强制将结果集转换为你所查询的类型的单个实例。\n\n\
  ### First, FirstOrDefault, Last, 和 LastOrDefault\n\n这些操作符允许你返回特定对象序列中的第一个或最后一个元素。与\
  \ `Single` 方法一样，`First` 和 `Last` 在集合为空时会抛出错误，而另外两个运算符会返回相关数据类型的默认值。\n\n与 `Single`\
  \ 不同，`First`、`FirstOrDefault`、`Last` 和 `LastOrDefault` 运算符在查询返回多个项目时不会抛出异常。它们只是返回结果集中的第一个项目。\n\
  \nEF 不支持 `Last` 和 `LastOrDefault` 查询。不过，你可以轻松地通过 `First` 和 `descending`（降序）排序来来实现相同的行为。下面的代码段显示了如何从数据库检索最旧（ID\
  \ 最小的）和最近的评论：\n\nVB.NET\n```\nDim firstReview = (From r In myEntities.Reviews\n\
  \                  Order By r.Id\n                  Select r).First()\n\nDim lastReview\
  \ = (From r In myEntities.Reviews\n                 Order By r.Id Descending\n \
  \                Select r).First()\n```\n\nC#\n```sharp\nvar firstReview = (from\
  \ r in myEntities.Reviews\n                  orderby r.Id\n                  select\
  \ r).First();\n\nvar lastReview = (from r in myEntities.Reviews\n              \
  \   orderby r.Id descending\n                 select r).First();\n```\n\n只需在执行 `First`\
  \ 之前按反向重新排列结果集，实际上就可以获得序列中的最后一行。请注意，在两种情况下，查询返回的类型都是真正的 `Review` 对象，让你能够直接访问其属性，例如\
  \ `Id` 和 `Title`。\n\n除了这种 LINQ 查询语法外，LINQ 还支持 `method syntax`（方法语法）。有关区别和示例，请查看此篇\
  \ MSDN 文章：[`tinyurl.com/MethodVersusQuery`](http://tinyurl.com/MethodVersusQuery)。\n\
  \n### 使用匿名类型构建数据形状\n\n到为止，你在之前几个节中看到的查询返回的是完整类型。这意味着，查询返回的是 `Review` 实例列表（例如 `Select`\
  \ 方法）、单个 `Review` 实例（`Single`、`First` 或 `Last`）或一个数值（如 `Count` 和 `Average`）。\n\n\
  然而，很多情况下你不需要这些对象的所有信息。图 14-3 显示了一个带有 `Review` 对象所有属性的 `GridView`。为了改进此列表的显示效果，你通常希望跳过像\
  \ `Body` 和 `Authorized` 这样的属性，而不是类型 ID，你可能想显示类型名称。虽然你可以告诉 `GridView` 只显示你想看到的列，但如果你能够限制实际数据，将会更高效。使用\
  \ `anonymous types`（匿名类型）来实现这一点来说，这是 C# 和 VB.NET 中提供的另一种语言特性。匿名类型是一种你不需要像其他类型那样预定义名称和成员的类型。相反，你通过选择数据然后让编译器为你推断类型来构造匿名类型。匿名类型只能在声明它的方法内部访问，因此你不能从方法中返回匿名类型。\n\
  \n如果你不定义实际类型并给它命名，如何访问该类型及其属性呢？这再次是通过类型推断完成的，编译器可以看到分配给变量的数据，然后动态创建一个新的匿名类型。\n\n\
  创建匿名类型很容易；你不是使用类似 `Select review` 的内容来选择实际对象，而是在 C# 中使用 `new` 关键字并在 Visual Basic\
  \ 中使用 `New With`，然后在一对括号之间定义你想要选择的属性：\n\nVB.NET\n```\nDim authorizedReviews = From\
  \ myReview In myEntities.Reviews\n                 Where myReview.Authorized = True\n\
  \                 Select New With {myReview.Id, myReview.Title, myReview.Genre.Name}\n\
  ```\n\nC#\n```csharp\nvar authorizedReviews = from review in myEntities.Reviews\n\
  \                        where review.Authorized == true\n                     \
  \   select new { review.Id, review.Title, review.Genre.Name };\n```\n\n虽然该类型是匿名的且无法通过名称直接访问，但编译器仍然能够推断出类型，为你查询中选择的新属性提供完整的\
  \ IntelliSense 提示。使用 C# 中的 `var` 关键字访问 `authorizedReviews` 变量中匿名类型属性的方法如 图 14-4\
  \ 所示。\n\n![image](img/f500-01.jpg)\n\n**图 14-4**\n\n请注意，前面的查询访问了 `Review` 的实际 `Genre`\
  \ 属性。除了 `GenreId`（定义为数据库中 `Review` 表中的一列）外，`Review` 类还有一个具有强类型的 `Genre` 属性，让你能够直接访问类型的属性（如\
  \ `Name`），正如之前的查询所示。\n\n除了直接选择现有属性之外（如选择 `Review` 的 `Id` 和 `Title` 以及 `Genre` 的\
  \ `Name` 的查询所示），你还可以构造属性值并赋予它们不同的名称。例如，以下查询创建了一个匿名类型，将 `Id` 重命名为 `Number`，将 `Title`\
  \ 限制为 20 个字符，并包含一个判断该项目是否已更新的布尔值：\n\nVB.NET\n```\nDim allReviews = From myReview\
  \ In myEntities.Reviews\n                 Select New With\n                 {\n\
  \                     .Number = myReview.Id,\n                     .Title = myReview.Title.Substring(0,\
  \ 20),\n                     myReview.Genre.Name,\n                     .HasUpdated\
  \ = myReview.UpdateDateTime > myReview.CreateDateTime\n                 }\n```\n\
  \nC#\n```csharp\nvar allReviews = from myReview in myEntities.Reviews\n        \
  \         select new\n                 {\n                   Number = myReview.Id,\n\
  \                   Title = myReview.Title.Substring(0, 20),\n                 \
  \  myReview.Genre.Name,\n                   HasUpdated = myReview.UpdateDateTime\
  \ > myReview.CreateDateTime\n                 };\n```\n\n注意 VB.NET 和 C# 之间的区别；在\
  \ VB.NET 示例中，新属性的名称（`Number`、`Title` 和 `HasUpdated`）带有点（`.`）。C# 没有此要求，允许直接编写新属性名称。如果你没有引入新名称（如前面的示例中的类型名称），将使用所选属性的名称。这意味着类型名称存储在名为\
  \ `Name` 的属性中。\n\n选择原始对象中不存在的额外属性的能力为你显示的数据提供了极大的活性。此示例通过比较 `CreateDateTime` 和 `UpdateDateTime`\
  \ 属性来确定当前评论是否已更新。该比较的结果（值为 `True` 或 `False` 的布尔值）随后存储在 `HasUpdated` 属性中。你可以选择几乎任何内容，包括当前日期和时间、复杂的计算、字符串或属性组合等。\n\
  \n在接下来的练习中，你将看到如何创建一个具有 `Reviews` 集合作为属性的新匿名类型。你将使用该类型创建数据库中所有可用类型的列表，以及每个类型包含的评论。\n\
  \n\n\n\n\n虽然可能需要花费时间才能完全理解这些 LINQ 查询和 Entity Framework 背后的原理，但我相信你已经开始体会它们的强大和易用性了。只需几行代码和几个控件，你就可以创建强大的数据展示页面。\n\
  \n你可以使用这些 EF 查询通过 ASP.NET 服务器控件来显示数据，正如你将在下一节中看到的，该节将处理 `ListView` 和 `DataPager`\
  \ 控件。\n\n# 在 LINQ 查询中使用模型绑定（MODEL BINDING）\n\n到目前为止，你已经看到了一种将针对 EF 的 LINQ 查询结果绑定到\
  \ ASPX 页面控件上的方法：将数据分配给控件的 `DataSource` 属性，然后调用 `DataBind`。这种向控件获取数据的方法有些局限性，因为它不支持直接对数据进行编辑、更新和删除。为了支持这些操作，ASP.NET\
  \ 提供了一项名为“模型绑定”（Model Binding）的特性，它支持针对 `GridView`、`ListView` 和 `DetailsView` 等数据绑定控件对数据源执行完整的\
  \ CRUD（增删改查）操作。你将在下一节看到模型绑定的工作原理。\n\n## 介绍模型绑定\n\n模型绑定是数据绑定控件内置的一种能力，用于对数据源执行 CRUD\
  \ 操作。模型绑定不再依赖你之前看到的 `SqlDataSource` 等数据源控件，而是依赖于你在代码中定义的方法来提供数据并处理如插入、更新或删除等更改。这些方法可以定义包含数据绑定控件的\
  \ Web Forms 后代码（Code Behind）中，也可以定义项目的其他类中。要将数据绑定控件指向可以检索或更改的方法，你需要使用数据绑定控件上的四个属性。注意：由于并不是每个控件都支持数据的更新、删除和插入，某些控件会缺少其中一些属性。\n\
  \n| 控件 | 描述 |\n| :--- | :--- |\n| `SelectMethod` | 控件在需要显示数据时调用此方法。由 `GridView`、`ListView`、`Repeater`、`DetailsView`\
  \ 和 `FormView` 支持。 |\n| `InsertMethod` | 控件在执行插入操作时调用此方法。由 `ListView`、`DetailsView`\
  \ 和 `FormView` 支持。 |\n| `UpdateMethod` | 控件在执行更新操作时调用此方法（注：原文此处误为 insert，已纠正为更新）。由\
  \ `GridView`、`ListView`、`DetailsView` 和 `FormView` 支持。 |\n| `DeleteMethod` | 控件在执行删除操作时调用此方法（注：原文此处误为\
  \ insert，已纠正为删除）。由 `GridView`、`ListView`、`DetailsView` 和 `FormView` 支持。 |\n\n模型绑定的一个非常强大的功能是，当插入、更新或删除方法触发时，能够将来自数据绑定控件的数据动态填充对象。例如，使用\
  \ `DetailsView` 控件创建新相册时，你可以让 ASP.NET 从用户提供的数据中自动检索如相册名称等信息，将其分配给 `PhotoAlbum` 类的新实例。这让你免于编写大量的重复代码，这些代码的作用无非是从控件中获取值并将其分配给对象。你将在下一个使用\
  \ Entity Framework 的练习中中看到它是如何运作的，尽管模型绑定并不限于 EF。\n\n现在你已经可以插入新的相册了，下一个逻辑步骤是向相册中添加图片。在下一个练习中，你将看到如何使用\
  \ `ListView` 控件创建一个用户界面，使用户能够在相册中上传新图片。\n\n## 介绍 ListView 控件\n\n到为止，你已经看到了一些数据绑定控件在工作。你看到了\
  \ `GridView`，它非常强大，因为支持数据的更新、删除、排序和分页，但缺少插入功能且生成大量的 HTML 标记。你还看到了 `Repeater` 控件，它让你对生成的\
  \ HTML 具有精确控制，但缺少其他数据控件具有的大多数高级功能，例如更新和删除行为以及排序和过滤能力。最后，你看到了 `DetailsView`，它允许你一次插入或更新一行数据。\n\
  \n`ListView` 是一个“集大成者”的控件，它结合了 `GridView` 的丰富功能集和 `Repeater` 提供的对标记的控制，并添加了 `DetailsView`\
  \ 的插入行为。`ListView` 允许你以多种格式显示数据，包括网格（类似于 `GridView` 的行和列）、项目列表（类似于你之前在本章早些设置 `Repeater`\
  \ 的方式）以及流式格式（Flow format），所有项目都依次放在 HTML 中，留由你编写某些 CSS 来格式化数据。\n\n`ListView` 通过模板显示并管理其数据，模板允许你控制\
  \ `ListView` 对其底层数据提供的许多不同视图。下表描述了你可以作为 `ListView` 控件在页面标记中的直接子添加的所有可用模板：\n\n| 模板\
  \ | 描述 |\n| :--- | :--- |\n| `<LayoutTemplate>` | 作为容器。它允许你定义放置单个数据项的位置。通过 `ItemTemplate`\
  \ 和 `AlternatingItemTemplate` 呈现的数据项将作为此容器的子元素添加。 |\n| `<ItemTemplate>` `<AlternatingItemTemplate>`\
  \ | 定义控件的只读模式。当一起使用时，它们允许你创建“斑马纹效果”，即奇数和偶行有不同的外观（通常是不同的背景颜色）。 |\n| `<SelectedItemTemplate>`\
  \ | 允许你定义当前活动或选中项目的外观。 |\n| `<InsertItemTemplate>` `<EditItemTemplate>` | 这模板允许你定义插入和更新列表的用户界面。你通常在这些模板中放置文本框、下拉列表和其他服务器控件，并将它们绑定到数据源。\
  \ |\n| `<ItemSeparatorTemplate>` | 定义位于列表项目之间的标记。如果你想在项目之间添加线条、图像或任何其他标记，它非常有用。\
  \ |\n| `<EmptyDataTemplate>` | 当控件没有数据显示时显示。你可以在其中添加文本或其他标记和控件，以告知用户没有数据可用。 |\n\
  | `<GroupTemplate>` `<GroupSeparatorTemplate>` `<EmptyItemTemplate>` | 在数据可以分组展示的高级场景中使用。\
  \ |\n\n虽然这一长模板列表似乎意味着你需要编写代码来与 `ListView`get，但事实并非如此。你并不总是需要所有模板，这让你能够减少控件的代码量。\n\
  \n除了许多模板外，控件还具有以下你通常设置的以影响其行为的属性：\n\n| 属性 | 描述 |\n| :--- | :--- |\n| `ItemPlaceholderID`\
  \ | 放置在 `LayoutTemplate` 中的服务器控件的 ID。当控件在屏幕上显示时，由此属性引用的控件将被重复的数据项替换。它可以是真正的服务器控件，如\
  \ `<asp:PlaceHolder>`，也可以具有有效 ID 且 `runat` 属性设置为 `server` 的简单 HTML 元素（例如 `<ul runat=\"\
  server\" id=\"MainList\"></ul>`）。如果你没有设置此属性，ASP.NET 会尝试查找 ID 为 `itemPlaceholder`\
  \ 的控件并使用该控件。 |\n| `DataSourceID` | 页面上数据源控件的 ID，例如 `SqlDataSource` 控件 |\n| `InsertItemPosition`\
  \ | 此属性的枚举包含三个值——`None`、`FirstItem` 和 `LastItem`，用于确定 `InsertItemTemplate` 的位置：位于列表的开头或结尾，或者完全不显示。\
  \ |\n\n\n\n\n与其他其它数据绑定控件一样，`ListView` 拥有许多在控件生命周期内特定时刻触发的事件。例如，它具有 `ItemInserting`\
  \ 和 `ItemInserted` 事件，这两个事件分别在底层数据源插入一个项之前和之后触发。同样，它还可以在你更新或删除数据之前和之后触发的事件。你将在下一章中看到更多关于处理此类事件的知识。\n\
  \n除了你刚刚看到的模板、属性和事件外，`ListView` 还有更多功能。要了解关于 `ListView` 控件及其所有成员和行为的详细说明，请查看 MSDN\
  \ 文档：[`bit.ly/dCAooK`](http://bit.ly/dCAooK)。\n\n下一个练习将向你展示如何将这些信息整合在一起。你将看到如何定义各种模板并设置相关属性，以控制\
  \ `ListView` 控件的外观和感受。\n\n### 使用强类型数据绑定控件\n\n当你添加 `ListView` 的代码时，你使用了如下的 `Bind`\
  \ 和 `Eval` 语句：\n\n```\n<asp:TextBox ID=\"ToolTip\" runat=\"server\" Text='<%# Bind(\"\
  ToolTip\") %>' />\n...\n<asp:Label ID=\"ToolTip\" runat=\"server\" Text='<%# Eval(\"\
  ToolTip\") %>' />\n```\n\n正如你在上一个练习的“工作原理”部分中学到的那样，`Bind` 用于双向数据绑定（用于插入和编辑场景），而\
  \ `Eval` 用于只读场景。注意属性名称（此例中的 `ToolTip`）是放在引号中的一个字面量字符串。使用字符串字面量会让你的代码更容易出现错误。首先，很容易拼错名称。由于\
  \ VS 无法在开发时检查字符串，因此在你在浏览器中查看页面之前，不会发现这个错误。其次，如果你重命名了属性，字符串字面量不会捕获到这一变化。\n\n幸运的是，ASP.NET\
  \ 有一种解决方案来处理这个问题。数据绑定控件（如 `ListView`、`Repeater`、`GridView`、`DetailsView` 和 `FormView`）已经转变为强类型数据绑定控件。它们扩展了一个\
  \ `ItemType` 属性，你可以将该属性指向分配给数据源的对象类型。在在上述示例中，该类型将是 `Picture`。一旦设置了此属性，数据绑定控件就会获得两个新属性\
  \ `Item` 和 `BindItem`，它们的类型是你分配给 `ItemType` 属性的类型。第一个作为 `Eval` 的替代品，第二个替换了 `Bind`。通过设置\
  \ `ItemType` 属性并使用 `Item` 和 `BindItem`，你可以获得以下好处：\n\n*   IntelliSense 现在可以帮助你找到正在操作对象的正确属性，如图\
  \ 14-12 所示。![image](img/f523-01.jpg)\n\n    **图 14-12**\n\n*   当你拼错属性名称或稍后重命名它时，你现在会在“错误列表”中收到错误，这让你有机会在浏览器中查看页面之前修复问题。\n\
  \n*   外部工具（Visual Studio 完整版可用）会在你重命名对象上的属性时，正确地重命名标记中的项。\n\n虽然这是一个帮助你编写更好代码的优秀新功能，但你只有在处理强类型对象时（例如来自\
  \ EF 模型的 `Picture`，或来自你或第三方开发者创建的其他类）才能使用此解决方案。\n\n*   当使用 `SqlDataSource` 控件时。该控件底层使用的对象没有暴露映射到列的强类型属性（例如\
  \ `ToolTip` 或 `Description`），因此你无法通过 `Item` 和 `BindItem` 属性访问这些列或属性。\n\n*   当使用匿名对象时。由于匿名对象没有名称，你无法将其名称分配给\
  \ `ItemType` 属性。\n\n在接下来的简短练习中，你将看到如何利用这种新的强类型数据绑定能力。\n\n目前，用户需要手动输入图像 URL。显然，这并不用户友好。如果他们可以从本地电脑选择图像并将其上传到服务器，就会简单得多。你将在下一个练习中看到如何实现这一点。\n\
  \n你可以想象，如果你为一个相册上传大量图像，页面将变得难以管理。在前端尤其如此，因为用户可能通过慢速的网络连接访问你的网站。与其在单个页面上显示相册中的所有图像，你可以将相册分成多个页面，允许用户在不同页面之间切换。你将在下一节中看到如何这样做，该节将讨论\
  \ `DataPager` 控件。\n\n### 介绍 DataPager 控件\n\n`DataPager` 是一个独立的控件，你可以用它来扩展另一个数据绑定控件。目前，.NET\
  \ Framework 只允许你使用 `DataPager` 为 `ListView` 控件提供分页功能，但开发者社区一直在为其他控件（如 `GridView`）编写实现。\n\
  \n你可以通过两种方式将 `DataPager` 连接到 `ListView` 控件：你可以在 `ListView` 控件的 `LayoutTemplate`\
  \ 中定义它，也可以完全定义在 `ListView` 之外。在一种的情况下，`DataPager` 知道它应该为哪个控件提供分页功能。在后一种，你需要将 `DataPager`\
  \ 的 `PagedControl` 属性设置为 `ListView` 的 `ID`。你将在下一节中看到如何结合 `ListView` 配置并使用 `DataPager`。在\
  \ `ListView` 之外定义 `DataPager` 对于你想将其放置在不同位置（如页脚或侧边栏）非常有用。\n\n#### 关于性能的说明\n\n前面的练习存在一个已知的性能问题。尽管\
  \ `ListView` 的 `ItemTemplate` 通过 CSS 在浏览器中将图像调整为 180 像素，但实际图像并未被修改。这意味着如果你上传了一张图像，整个图像仍然会被下载。更好的做法是在服务器上创建缩略图，并将其发送给浏览器。我的书《ASP.NET\
  \ 2.0 Instant Results》（ISBN: 978-0-471-74951-6）中的“贺卡”章节有很多在服务器上调整图像的示例。\n\nLINQ\
  \ 和 ADO.NET Entity Framework 技巧\n\n以下是一些实用的 LINQ 和 ADO.NET Entity Framework 技巧：\n\
  \n*   在本章中，你看到了如何创建匿名类型来构建查询返回的数据。编译器和 IntelliSense 是确定可以返回哪些数据以及可用属性的宝用工具。花时间尝试匿名类型，查看\
  \ IntelliSense 给出的不同选项。\n\n*   与与其他数据访问方法（如上一节看到的 `SqlDataSource` 控件）一样，尽可能地过滤你的数据。如果你知道只需要爵士类的评论，请明确在代码中使用\
  \ `Where` 子句，在数据库级别限制评论列表。这将加快你的查询和数据检索，提高应用程序的整体速度。\n\n*   利用匿名类型来减少 LINQ 查询的内存消耗。例如，与其检索整个\
  \ `Review` 对象，不如使用 `New`（C# 中为 `new`）关键字动态创建一个匿名类型。由于此新对象仅包含你真正需要的属性，因此你节省了引入完整对象的开销。\n\
  \n\n\nLINQ 是伴随 .NET 发布的一种引人注目且令人兴奋的技术。LINQ 在许多数据访问场景中都是一项重要的底层技术，包括在 ASP.NET Web\
  \ 应用程序中使用 ADO.NET Entity Framework 进行数据库访问。\n\n由于 LINQ 如此重要，它已经集成到 .NET 的许多不同地方。LINQ\
  \ 可对象，允许你对内存集合进行查询。此外，LINQ 还适用于 XML、ADO.NET 和 `DataSets`，每种类型都提供对不同数据存储的访问，但使用相同的统一查询语言。LINQ\
  \ 也被用作 ADO.NET Entity Framework 的查询语言。\n\n在 ASP.NET Web 应用程序中使用 EF 工作时，你有几种不同的选择。首先，你可以在页面的代码代码（Code\
  \ Behind）中编写查询，然后使用控件的 `DataSource` 属性和 `DataBind` 方法将结果绑定到数据绑定控件上。或者，你可以使用数据绑定控件配合模型绑定（Model\
  \ Binding）来从 EF 获取数据。结合 `ListView` 和 `DataPager` 控件，这使你能够创建功能完整的 CRUD 页面。\n\n到目前为止，你看到的数据库驱动的页面看起来相当单调。你还没有应用大量的样式，也没有提供任何条件格式（即根据数据的值不同的方式呈现数据）。你可以通过控件样式以及数据绑定和数据源控件的许多事件来实现这一点。下一章将向你展示如何利用这些样式和事件。\n\
  \n## 本章你学到了\n\n| `Ado.Net Entity Data Model file` | 包含将对象模型映射到数据库中表所需信息的文件 |\n|\
  \ `Anonymous types` | 在不显式定义它们的情况下动态创建的类型 |\n| `Entity Framework` | 一种用于创建强类型对象模型的技术，底层是数据库，允许你与数据库中的数据进行交互\
  \ |\n| `Entity set` | 实体模型中的对象集合；例如，一个 `PhotoAlbum` 实例拥有一个 `Pictures` 实体集，该集合包含了专辑中的图片\
  \ |\n| `Lazy loading` | 一种技术，在运行时访问数据之前，不会从数据库加载数据 |\n| `LINQ` | 语言集成查询；.NET Framework\
  \ 编程语言的一部分，提供对各种类型数据集合（包括对象、XML 和数据库）的查询支持 |\n| `Model Binding` | ASP.NET 利用此机制从来自各种来源的数据为你填充对象。从数据绑定控件可以调用的各种方法大量使用了这一过程\
  \ |\n| `Range variable` | 在你的 LINQ 查询中定义的变量，随后在 `Select` 和 `Where` 部分使用 |\n| `Strong\
  \ typing` | 一种编程概念，在声明变量时显式定义变量的类型 |\n| `Type inference` | 一种技术，编译器根据赋值的数据确定变量的类型；这使你能够在不显式定义变量类型的情况下创建强类型变量\
  \ |\n\n# 第 15 章：与数据工作——高级主题\n\n## 本章你将学习到：\n\n* 如何使用样式、主题和皮肤（skins）更改各种数据绑定控件的格式\n\
  * 如何处理数据控件触发的各种事件，以根据条件更改其外观\n* 如何手动编写数据访问页面的 UI，以获得对页面结构和标记的完全控制权\n* 如何使用内置缓存机制提高网站的性能\n\
  \n## 本章的 WROX.COM 代码下载\n\n你可以在 `www.wrox.com/go/begaspnet451` 的 Download Code 选项卡找到本章的\
  \ `wrox.com` 代码下载。代码位于第 15 文件夹中。\n\n之前的三个章节向你介绍了许多新概念。第 12 章讨论了通用数据库，特别是 `SQL Server\
  \ 2012 Express LocalDB` 版本。该章还涵盖了创建、读取、更新和删除数据的基本操作。第 13 章主要关注 `SqlDataSource` 控件以及你可以使用的不同数据绑定控件。最后，第\
  \ 14 章探索了 ADO.NET Entity Framework 世界，这是微软最新的数据访问技术，旨在加速编写数据访问代码的方式。\n\n为了帮助你真正理解数据访问的核心概念，那三个章节主要关注数据源控件及其背后的原理，而对使用数据绑定控件呈现数据方面关注较少。显然，在实际应用中这些是不够的，你需要一种以清晰且吸引力的方式呈现数据。\n\
  \nASP.NET 自带的数据绑定控件提供了许多更改数据呈现方式的选择。它们允许你完全更改所呈现数据的设计（字体、颜色、间距等）。此外，你还可以调整这些控件来隐藏特定列、修改列标题，甚至通过程序更改控件的外观感觉。\n\
  \n在接下来的章节中，你将看到如何使用各种技术对控件进行样式化。本章的后半部分将向你展示如何手动编写数据访问页面，赋予你极大的灵活性。在章节末尾，将讨论缓存——一种提高网站性能的技术。\n\
  \n## 使用样式格式化你的控件\n\n第 13 章和第 14 章解释了如何与许多 ASP.NET 数据绑定控件配合工作。你学习了如何使用 `GridView`、`Repeater`\
  \ 和 `ListView` 等控件显示和编辑数据列表，以及如何处理 `DetailsView` 等单条记录控件。\n\n到目前为止，你一直依赖控件的内置外观和感觉，这通常会导致界面看起来单调且平淡。图\
  \ 15-1 显示了你在第 13 章创建的用于管理 Planet Wrox 数据库中流的 `GridView`。\n\n将图 15-1 中单调的 `GridView`\
  \ 更改为图 15-2 所示更惊艳的版本，通过使用 *ASP.NET 样式* 和数据绑定控件触发的许多事件可以轻松实现。在下一节中，你将看到如何将这些样式应用于页面中的单个控件。在随后的章节中，你将看到如何将样式移动到主题中，以便网站区域的所有控件更容易地复用。\n\
  \n### 样式简介\n\n\n\n\n\n许多数据绑定控件和导航控件都有许多样式属性，允许你修改控件的外观和感受。例如，`GridView` 具有 `RowStyle`\
  \ 和 `AlternatingRowStyle` 属性，允许你自定义网格中单行的视觉观。这是一个 `GridView` 示例，它包含两个样式元素，以不同的背景颜色渲染奇数行和偶数行：\n\
  \n```asp\n<asp:GridView ID=\"GridView1\" runat=\"server\">\n  <AlternatingRowStyle\
  \ BackColor=\"White\" />\n  <RowStyle BackColor=\"#EFF3FB\" />\n</asp:GridView>\n\
  ```\n\n同样，`DetailsView` 有 `CommandRowStyle` 属性，用于控制包含 `Insert、Delete、Cancel` 等命令的命令行的外观。\n\
  \n归根底，每个样式属性都继承自 `System.Web.UI.WebControls` 命名空间下的 `Style` 类。图 15-3 向你展示了该类的过滤后的图，其中可见最常用的属性。\n\
  \n![image](img/f541-01.jpg)\n\n**图 15-3**\n\n从这些名称可以看出，`Style` 类的属性用于更改应用于该类的对象上的样式相关信息。这些属性中的每一个最终都会转换为\
  \ CSS 属性或 HTML 属性，例如 `background-color、border` 等。其他样式（如 `GridView` 控件的样式）添加了各种与布局相关的属性，例如控制对齐的不同选项。下表列出了可用的各种\
  \ `Style` 派生类中最重要的属性。请注意，并不是每个属性对每个样式都可用。IntelliSense 会准确地显示你在特定样式中可以使用哪些属性。\n\n\
  | 属性 | 说明 |\n| :--- | :--- |\n| `BackColor` `ForeColor` | 这些属性允许你更改元素的背景颜色和文本颜色。它们分别映射到\
  \ CSS 属性 `background-color` 和 `color`。 |\n| `BorderColor` `BorderStyle` `BorderWidth`\
  \ | 这些属性允许你更改应用于样元素的边框。它们直接映射到对应的 CSS 属性 `border-color, border-style` 和 `border-width`。\
  \ |\n| `CssClass` | 这允许你分配一个 CSS 类而不是内联样式信息。你应该优先使用 `CssClass` 属性而不是单个样式属性，因为它们可以减少页面膨胀。你将在后面的练习中看到如何使用\
  \ `CssClass`。 |\n| `Font` | 这允许你通过 `Font-Names、Font-Size` 和 `Font-Bold` 等各种子属性设置元素的字体。这些属性最终变为各种\
  \ CSS 字体属性，如 `font-family, font-size` 和 `font-weight`。 |\n| `HorizontalAlign` `VerticalAlign`\
  \ | 这些属性最终变为应用于其 HTML 元素的 `align` 和 `valign` 属性，允许你控制元素内容的对齐方式。例如，你使用 `HorizontalAlign`\
  \ 来对 `GridView` 列头的文本进行左对齐、居对齐或右对齐。注意：这些属性输出的 HTML 属性在 HTML5 中已过时。大多数浏览器仍按预期渲染它们，但如果\
  \ HTML5 兼容性很重要，你不应该使用这些属性，而应该使用通过 `CssClass` 属性分配的自定义 CSS 类。 |\n| `Wrap` | 当设置为\
  \ `False` 时，它将变为 `white-space: nowrap;` CSS 声明，并决定文本是否允许换到新行。 |\n| `Height` `Width`\
  \ | 这些属性允许你控制应用于元素的高度和宽度，并直接映射到相应的 CSS `height` 和 `width` 对应项。 |\n\n请查看 MSDN 文档（位于\
  \ [`bit.ly/Lb3WZd`](http://bit.ly/Lb3WZd)）以获取 `Style` 类的完整说明。\n\n不同的数据绑定控件各有一组不同的样式，尽管它们共享一些样式。下表列出了\
  \ `GridView` 可用的样式并描述了它们的用途。其他数据绑定控件的样式略有不同，但从它们的名称中你应该能够看出它们的作用并确定其用途。学习更多关于可用样式的另一种好方法是使用\
  \ Visual Studio 的自动格式化（Auto Format），它会为你插入许多样式。你稍后将看到如何使用和改进由自动格式化功能生成的样式。\n\n|\
  \ 样式 |  |\n| :--- | :--- |\n| `RowStyle` `AlternatingRowStyle` | 这些控制单行的外观。默认情况下，`RowStyle`\
  \ 影响所有行。设置 `AlternatingRowStyle` 时，它仅在偶数行生效。 |\n| `SelectedRowStyle` | 可以应用于选中的行，并让你有机会在视觉上将选中的行与未中的行区分开。\
  \ |\n| `EditRowStyle` | 可以应用于当前处于编辑模式的行。例如，当你点击管理部分 Genres（类型）页面上 `GridView` 某行的编辑链接时，该行将切换到编辑模式并应用此\
  \ `EditRowStyle`。 |\n| `EmptyDataRowStyle` | 这允许你定义网格绑定到空数据源时显示的行的外观。此样式与网格的 `EmptyDataText`\
  \ 属性配合使用。 |\n| `HeaderStyle` `FooterStyle` | 这些控制表头和页脚行的外观。 |\n| `PagerStyle` |\
  \ 这允许你影响启用分页时 `GridView` 分页栏的外观。 |\n| `SortedAscendingCellStyle` `SortedAscendingHeaderStyle`\
  \ `SortedDescendingCellStyle` `SortedDescendingHeaderStyle` | 这些样式共同允许你在列按升序或降序排序时更改表头和整列的外观。\
  \ |\n\n某些控件（如 `Repeater` 和 `ListView`）没有内置样式。由于这些控件本身不会向页面贡献任何 HTML，而是将外观和感受留给你在大量的模板中定义，因此没有必要单独的样式；你只需在它们上添加所需的样式或类信息即可。\n\
  \n### 样式、主题和皮肤\n\n第 6 章讨论了如何使用主页、主题和皮肤创建外观一致的 Web 页面。在建立了基础主题架构后，现在可以轻松添加适用于整个管理（Management）部分的新主题。你之前看到过如何创建一个皮肤文件来更改按钮的外观；在下面的练习中，你将看到如何复用这一概念为\
  \ `GridView` 创建皮肤文件，从而一次性为 `Management` 文件夹中所有的 `GridView` 控件设置样式。\n\n\n\n\n之前的章节已经介绍了\
  \ ASP.NET 控件如何触发事件。你学习了如何通过通常通常添加到页面的后台代码（Code Behind）文件中的事件处理代码来处理这些事件。例如，你编写了代码来处理\
  \ `Button` 控件的 `Click` 事件。然而，大多数控件暴露了得多的事件。\n\n对于 ASP.NET 开发者来说，深入理解在控件生命周期期间触发的各种事件以及它们触发的顺序是一项重要的知识。能够钩入控件的生命周期中，并在执行过程中调整部分输出，将使你能够创建出灵活、动态且完全符合你预期的网页。\n\
  \n为了理解这些各种事件及其触发顺序，接下来的部分将解释 ASP.NET 控件生命周期的基本步骤。你不会看到过程中触发的每一个事件，而是看到你最可能用到的那些。随后的章节将向你展示如何利用这些事件来更改网页的行为。\n\
  \n## 重新审视 ASP.NET 页面和控件生命周期\n\n在第 6 章中，你学习了页面生命中的各个阶段。你学习了不同的事件，例如 `PreInit`、`Load`、`PreRender`\
  \ 和 `Unload`。除了这些由 ASPX 页面触发的事件外，你 ASPX 页面中的所有其他控件都可以触发自己的事件。这些事件可以简单如 `Button`\
  \ 控件的 `Click` 事件（由用户操作触发），也可以是复杂的事件，例如由 `SqlDataSource` 等控件触发的 `Inserting` 事件，或由各种数据绑定控件触发的\
  \ `DataBound` 事件。在下一个练习中，你将看到许多此类事件。\n\n尽管上一个练习在实际应用中并没什么用处，但它应该帮助你理解各种控件事件及其触发顺序。你可以使用完全相同的原理钩入页面，并对页面本身或页面中的任何控件进行修改。在下一个练习中，你将看到如何根据你显示的数据来更改数据源中行（rows）的观观。\n\
  \n## ASP.NET 页面生命周期与数据控件中的事件\n\n正如之前讨论的，`GridView` 会为其添加到输出中的每一行触发 `RowCreated`\
  \ 和 `RowDataBound` 事件。这些事件是窥视数据的理想选择，然后根据这些数据采取适当的操作。例如，你可以使用这些事件来验证正在显示的评论是否经过授权。如果不是（意味着它在前端网站上将不可见），你可以更改评论的外观以引起注意。另一个使用事件的例子是，当界面中的元素显示或激活不符合逻辑时，隐藏或禁用这些元素。在下一个练习中，你将看到如何禁用\
  \ `Genres` `GridView` 中的删除（Delete）链接。\n\n注意，这段代码还从数据库中选择了所有评论，因此效率并不高。作为替代方案，你可以选择一个匿名对象，包含\
  \ `Genre` 的 `Id` 和 `Name` 属性，以及所有评论的总数。这反过来意味着你需要在后台代码中使用 LINQ 的 `Skip` 和 `Take`\
  \ 方法实现你自己的分页和排序机制，因为模型绑定（Model Binding）无法通过匿名对象自动为你完成这一点，或者你可以禁用 `GridView` 的排序和分页。\n\
  \n通过禁用删除按钮，你可以轻松防止在尝试删除具有关联评论的分类（genre）时可能发生的错误。然而，你并不总是能够防止对数据源控件进行 CRUD 操作期间发生错误。例如，你可能会尝试删除一个最初没有关联评论的分类。但想象一下，在你尝试删除该分类之前，其他人刚刚为它插入了一条新评论。当你再次尝试删除该分类时，将收到错误，因为该分类现在与一条评论关联了。在这种情况下，数据源控件允许你诊断发生的错误，然后采取必要的措施，例如向用户提供反馈，告知他们的\
  \ CRUD 操作未成功。\n\n## 处理数据源控件中发生的错误\n\n在第 18 章中，你将看到更多关于识别和处理发生在 ASP.NET 页面中的错误的知识。该章节演示了如何捕获代码中可能发生的错误，然后通过记录日志或通知用户来处理它们。但由于数据源控件也暴露了错误信息，在本章中查看数据访问错误是有趣的。\n\
  \n`SqlDataSource` 控件（以及其他数据源控件）为你提供了关于在四个 CRUD 操作期间可能发生的错误（.NET 术语中称为 `exceptions`）的信息。对于\
  \ `SqlDataSource` 控件，所有四个事件都接受 `SqlDataSourceStatusEventArgs` 实例。![图 15-10](img/#Chapter15.xhtml_figure15-10)\
  \ 显示了这三个 `EventArgs` 类及其属性。\n\n![image](img/f560-01.jpg)\n\n**图 15-10**\n\n该类有两个重要的属性：`Exception`\
  \ 和 `ExceptionHandled`。第一个包含发生的实际异常，或者当一切按计划进行且没有发生错误时（在 VB.NET 中为 `Nothing`，C#\
  \ 中为 `null`）。你可以检查此错误并采取适当操作。例如，你可以通知用户发生了非常糟糕的错误，或者你可以向网站管理员发送电子邮件，告知她该错误，以便采取适当的跟进措施。\n\
  \n如果你决定在数据源控件的事件处理程序中处理错误，你应该将对象的 `ExceptionHandled` 属性设置为 `True`。这向 ASP.NET 运行时表明你已经知晓该异常并对其进行了妥善处理。如果你省略了设置此属性，运行时将转发该异常。\n\
  \n在下面的练习中，你将看到如何在 `Genres.aspx` 页面中使用 `SqlDataSourceStatusEventArgs` 类。请放心，你可以将本节的相同原理应用于其他数据源控件触发的事件。\n\
  \n在过去的几章中，你看到了许多使用内置数据控件（如 `SqlDataSource`）访问数据库的示例。尽管这些控件既实用又快速，但它们并不适用于所有情况。在不适用的情况下，你始终可以手动编写页面，正如你将在下文中看到的那样。\n\
  \n## 手动编写数据访问代码\n\n我对数据控件经常遇到的最大问题是它们所需的标记数量。尽管例如，`ListView` 在关联数据源控件时会为你生成大部分代码，但你仍然会在页面中产生大量代码。这使得对控件进行大量修改变得困难且耗时。这些控件的另一个问题是，通常你会发现自己定义了两次几乎相同的标记：一次用于插入模板，一次用于编辑模板。我在处理数据控件时经常遇到的最后一个问题是我无法对它们创建的标记进行完全控制。这有时会让创建具有多级绑定下拉控件、AJAX\
  \ `UpdatePanel` 控件、图像上传等高级且复杂的页面变得困难。为了克服这些问题，你可以手动编写页面，这将让你对页面中的标记和后台代码中的代码拥有完全控制。\n\
  \n手动编写并没有想象中那么困难，作为额外努力的回报，你确实获得了巨大的活性。虽然实际过程在每个页面之间有所不同，以下是手动编写一个添加/编辑页面的通用步骤描述，该页面允许你使用相同的标记输入新项目或更新现有项目：\n\
  \n\n\n\n* 通过在页面上添加多个控件（例如 `TextBox` 和 `DropDownList`）来创建用户界面，允许用户输入新数据并更新现有数据。\n\
  * 在页面上添加验证控件，强制用户输入有效数据。\n* 在后置代码（Code Behind）中，确定你是在创建新项目还是编辑现有项目。例如，你可以通过查看查询字符串来区分。当你正在编辑现有项目时，从数据源获取该项目并预填充表单控件。\n\
  * 处理“保存”按钮以插入或更新项目。当你更新现有项目时，应该先从数据库中获取该项目，然后用表单中的新值覆盖现有值。最后，将项目保存回数据存储器。\n\n在下一个“尝试一下”（Try\
  \ It Out）中，你将构建一个实现此过程的页面。\n\n在到目前为止看到的所有数据库示例中，代码每次请求都会访问数据库。每当需要显示某些数据时，都会从数据库中重新检索。显然，这可能会浪费网络带宽和\
  \ CPU 周期等时间和资源，特别是当数据自你上次访问以来没有发生变化时。在本章的最后一节中，你将接触一种名为 `caching`（缓存）的技术，它可以极大地提高你应用程序的响应速度和性能。\n\
  \n## 缓存\n\n缓存是提高应用程序性能最好且通常最简单的方法之一。它也是经常被开发者忽视的选项。通过缓存，你的数据的 `copy`（副本）被存储在一个可以快速访问的位置。缓存的想法是，从缓存中获取数据应该比重新生成数据或从原始数据源获取数据更快。因此，大多数缓存解决方案将数据存储在内存中，这通常是获取数据最快的方法。.NET\
  \ 缓存例外，它允许你将频繁访问的数据存储在计算机内存的特殊位置。\n\n通常，缓存原理遵循图 15-15 所示所示的路径。\n\n![image](img/f575-01.jpg)\n\
  \n**图 15-15**\n\n应用程序查询某些数据——例如，从数据库获取类型列表。程序不是直接访问数据库，而是检查缓存查看其是否已经包含了请求的数据。如果是，则直接从缓存返回数据。如果尚未存储在缓存中，则从数据源（如\
  \ SQL Server 数据库）检索，将数据的副本存储在缓存中以备以后检索，最后将数据返回给调用代码。\n\n虽然缓存通常是改进应用程序的绝佳解决方案，但它也有一些你需要注意的缺点。以下章节将解释在使用缓存时可能会遇到的一些常见陷阱。接后的部分将展示你在\
  \ ASP.NET Web 应用程序中可以使用的缓存机制。\n\n### 缓存数据的常见陷阱\n\n在处理缓存数据时，你通常会遇到两个常见的问题领域：\n\n\
  * 你最终获得了过时的（stale）或陈旧的数据。\n* 你假设某个项目存在于缓存中，但实际上并不存在。\n\n在接下来的章节中，你将看到如何避免这两个问题。\n\
  \n### 避免过时数据\n\n`stale data`（过时数据）是指不再与其原始源匹配的缓存数据。例如，当你缓存数据库中所有类型的查询结果，并使用这些数据而不是从数据库中获取最新数据时，另一个用户插入的新类型可能不会被察觉到。\n\
  \n要避免过时数据，你需要一种失效缓存的方法。通过 `cache invalidation`（缓存失效），项目将从缓存中移除，以便在下次请求时重新创建。要使缓存数据失效，你有很多选项可供。首先，你可以选择设置较短的缓存时间。例如，你可以将\
  \ Genres 列表缓存 10 分钟。如果另一个用户在 10 分钟内插入了新类型，它将不会显示在你的页面上。但是，10 分钟后，列表将从缓存中移除，并在下次被请求时用新数据重新创建。稍后你将看到如何使用基于时间的缓存。\n\
  \n另一种使缓存失效的方法是使用缓存依赖（cache dependency）。通过 `cache dependency`（缓存依赖），你可以在缓存项目和原始数据源之间建立关系。当底层数据源发生变化时，缓存项目将失效，以便在下次被请求时重新创建。稍后你将看到如何使用\
  \ `CacheDependency` 类。\n\n在使用像 Microsoft SQL Server 这样的数据库时，也可以使用缓存依赖。这意味着只要作为缓存查询一部分的数据发生更改，缓存项目就会失效。数据库缓存和失效是一个高级且广泛的主题。你可以在由\
  \ Wrox 出版的 *Professional ASP.NET 4.5 in C# and VB*（ISBN: 978-1-118-31182-0）章节中找到更多内容。\n\
  \n### 不要依赖数据存在\n\n为了尽量减少应用程序的内存消耗，ASP.NET 中的缓存机制会定期从缓存中移除旧的和不经常使用的项目。此外，当服务器消耗过多内存时，项目也可能从缓存中剔出。因此，你不应该依赖项目在缓存中。当\
  \ ASP.NET 运行时认为该项目的使用频率不够，从而不必要地占用宝贵空间时，它们可能会被缓存本身移除。当 Web 应用程序重启时（这在你修改 `Web.config`\
  \ 时发生），整个缓存会被清空。项目也可能因为依赖关系而被移除。因此，即使你在应用程序生命周期早期设置了缓存，也不应依赖项目的存在。在本章稍后部分，你将看到如何使用\
  \ `Cache API`（应用程序编程接口；与程序交互的方式）通过编程方式使用缓存。\n\n使用 `Cache API` 不是缓存的唯一方法。下一节将向你展示不同的数据的方法。\n\
  \n### ASP.NET Web 应用程序中缓存数据的不同方法\n\n你可以在你的应用程序中部署不同的缓存策略，包括输出缓存、使用内置数据源缓存和编程缓存。这三种选项都在本章的剩余部分进行讨论。\n\
  \n#### 输出缓存\n\n通过输出缓存，渲染页面的最终结果被缓存。这意味着当页面第一次被请求时，其最终结果被添加到缓存中。对同一页面的后续请求将返回相同的\
  \ HTML。最后这句话重要到需要重复：*对同一页面的后续请求将返回相同的 HTML*。这意味着页面不会在服务器上再次处理，后置代码中的自定义代码也不会触发。第一次请求的完全相同的\
  \ HTML 将在每个后续请求中直接返回。\n\n启用输出缓存非常简单；只需在 `Page` 指令下方添加一个 `OutputCache` 指令，如此处 C#\
  \ `@ Page` 指令下方加粗所示（如果你使用的是 VB.NET，使用相同的代码，但你的 `@ Page` 指令可能略有不同）：\n\n```\n<%@ Page\
  \ Title=\"About this Site\" Language=\"C#\"\n        MasterPageFile=\"~/MasterPages/Frontend.master\"\
  \ AutoEventWireup=\"true\"\n        CodeFile=\"Default.aspx.cs\" Inherits=\"About_Default\"\
  \ %>\n<%@ OutputCache Duration=\"60\" VaryByParam=\"None\" %>\n```\n\n`Duration`\
  \ 是 ASP.NET 创建新副本之前想要缓存的秒数。在之前的示例中，页面被缓存一分钟。\n\n\n\n\n\n`VaryByParam` 属性中的 `None`\
  \ 值告诉 .NET 无论你传递了什么查询字符串值，都只缓存一个版本。虽然对于像 Planet Wrox 网站中 `About` 这样相对静态的页面来说很好，但对于动态页面来说，这通常不是理想的解决方案。想象一个动态页面，根据传递给页面的查询字符串显示评论详情。当你第一次请求该页面时，你可能会访问类似地址：\n\
  \nhttp://localhost:12345/Reviews/ViewDetails.aspx?Id=23\n\nASP.NET 生成一个显示评论 23 的页面，然后缓存整个页面的输出。那么，当你再次请求此页面时会发生什么？\n\
  \nhttp://localhost:12345/Reviews/ViewDetails.aspx?Id=33\n\n你看到的不是 `ID` 为 33 的评论，而是\
  \ ID 为 23 的评论！为了解决这个问题，ASP.NET 允许你缓存页面的特定版本。例如，你可以指示页面针对其所获取的每个唯一查询字符串字段缓存一个页面副本。你可以通过将指令的\
  \ `VaryByParam` 属性设置为可能的查询字符串或表单值的逗号分隔列表来实现。ASP.NET 将为它找到的每个唯一组合缓存一个页面副本。作为一个示例，考虑一个在查询字符串中接受评论\
  \ `ID` 并显示其详情的页面。为了为每个唯一的评论缓存副本，你可以像这样将 `Id` 添加到 `VaryByParam` 属性中：\n\n```\n<%@\
  \ OutputCache Duration=\"60\" VaryByParam=\"Id\" %>\n```\n\n对于显示特定评论详情的页面，这是完美的。对于每一条唯一的评论，ASP.NET\
  \ 都会保留一个缓存副本。这意味着只有当缓存中该评论时，才会访问数据库。所有其他请求都将从缓存提供服务。\n\n输出缓存的问题之一是它通常是一个“全有或无”的场景。虽然很容易根据（例如）查询字符串值来缓存不同的页面，但你将需要编写自定义代码来处理其他情况，例如处理主题（themes）。当页面被首次请求并缓存时，会考虑用户的主题。如果后续用户设置了不同的主题，他们仍然会看到原始请求的主题下的页面。输出缓存可能出现问题的另一种情况是当你使用与安全相关的控件时，例如\
  \ `LoginView`（将在下一章中讨论）。这些控件可以根据当前登录的用户显示内容。如果该页面被缓存，其他用户将看到属于请求该页面的第一个用户的内容。\n\n\
  解决此问题的一种方案是不在页面级别使用输出缓存，并将适用于所有用户的内容移动到单独的用户控件（user control）中，然后像你在联系表单中看到的那样将其嵌入页面中。例如，新闻文章列表或完整的评论列表对所有用户来说可能是相同的。如果你将这些列表的代码移动到启用了输出缓存的用户控件中，你的包含页面仍然为每个用户单独创建，但用户控件的内容仅在第一次时生成，然后在所有后续请求中重用。\n\
  \n另一种解决方案是指示数据源控件为你缓存数据，正如你在下一节中看到的。\n\n如果你不受输出缓存缺陷的影响（例如，当你没有使用主题或安全相关控件时），输出缓存是提高网站性能的极佳机制。\n\
  \n### 使用数据源控件缓存\n\n使用数据源控件缓存最大的好处是它们只缓存动态的、数据库驱动的数据，而不是整个页面。这允许你保持页面的其他部分的动态性，例如横幅模块或欢迎用户的个性化问候。大多数数据源控件在设计上都支持缓存，但\
  \ `SiteMapDataSource`、`LinqDataSource` 和 `EntityDataSource` 控件除外。\n\n使用数据源控件缓存非常简单：你只需要设置\
  \ `EnableCaching` 属性并指定 `CacheDuration`。下面的代码段显示了一个将其数据缓存 10 分钟的 `SqlDataSource`\
  \ 控件：\n\n```\n<asp:SqlDataSource ID=\"SqlDataSource1\" runat=\"server\" CacheDuration=\"\
  600\"\n      EnableCaching=\"True\"></asp:SqlDataSource>\n```\n\n使用数据源控件缓存的酷之处在于，它们足够智能，可以看到你是否对底层数据进行更新。因此，当你设置\
  \ `SqlDataSource` 控件为 `SelectCommand` 缓存 20 分钟，但随后通过 `InsertCommand`、`UpdateCommand`\
  \ 或 `DeleteCommand` 对数据进行更改时，缓存会自动失效。这仅在针对同一个 `SqlDataSource` 执行插入、更新或删除命令时才有效。如果你有一个页面用于显示并缓存评论列表（例如\
  \ `All.aspx`），然后有另一个页面用于插入新评论（例如 `Management` 文件夹下的 `AddEditReview.aspx`），这种方法将不起作用。当你在网站的\
  \ `Management` 部分插入一条新评论后，在缓存过期之前，它不会显示在 `All.aspx` 中。\n\n使用数据源控件进行无代码缓存在许多情况下非常有用。然而，数据源控件不能在所有情况下都使用。如果你想缓存从不同源获取的数据结果怎么办？如果你想缓存经常访问的文本或\
  \ XML 文件的内容怎么办？对于这些情况，ASP.NET 为你提供了对缓存的程序化访问。\n\n### 程序化缓存\n\n通过程序化缓存，你可以 VB.NET\
  \ 或 C# 代码在缓存中存储项。显然，你以后也可以访问它们。要存储项，你可以使用 `Add` 方法或 `Insert` 方法，或者直接对 `Cache` 集合进行索引。`Add`\
  \ 方法非常强大（且复杂），它允许你指定许多选项，这些选项决定了项目缓存的时间、它与其他缓存项目相比的优先级，以及触发项目移除的因素。\n\n另一方面，`Insert`\
  \ 方法要起来要简单得多。它有几个重载，允许你指定缓存项并将其与特定键关联。另一个重载还允许你定义依赖项，当原始源更改时可以使用这些依赖项使缓存项失效。这对于缓存不经常变化的文件非常好。你可以从磁盘读取文件，并带有原始文件的依赖关系将其存储在缓存中。然后你继续从缓存读取文件而不是从磁盘。当磁盘上的文件发生更改时，缓存项会自动失效，你可以再次读取原始源文件并将其存储在缓存中。下面的示例显示了如何修改\
  \ `ContactForm.ascx` 用户控件以便从缓存存储和获取项直到它发生变化：\n\nVB.NET\n\n```\nIf Page.IsValid Then\n\
  \  Dim mailBody As String = TryCast(Cache(\"ContactFormMailBody\"), String)\n  If\
  \ String.IsNullOrEmpty(mailBody) Then\n    Dim fileName As String = Server.MapPath(\"\
  ~/App_Data/ContactForm.txt\")\n    mailBody = System.IO.File.ReadAllText(fileName)\n\
  \    Cache.Insert(\"ContactFormMailBody\", mailBody, New CacheDependency(fileName))\n\
  \  End If\n  mailBody = mailBody.Replace(\"##Name##\", Name.Text)\n\n  ...\nEnd\
  \ If\n```\n\nC#\n\n```\n\n\n\n\n```cs\nif (Page.IsValid)\n{\n  string mailBody =\
  \ Cache[\"ContactFormMailBody\"] as string;\n  if (string.IsNullOrEmpty(mailBody))\n\
  \  {\n    string fileName = Server.MapPath(\"~/App_Data/ContactForm.txt\");\n  \
  \  mailBody = System.IO.File.ReadAllText(fileName);\n    Cache.Insert(\"ContactFormMailBody\"\
  , mailBody,           new CacheDependency(fileName));\n  }\n  mailBody = mailBody.Replace(\"\
  ##Name##\", Name.Text);\n\n  ...\n}\n```\n\n注意这里创建了一个新的 `CacheDependency`（你需要通过\
  \ `Imports`/`using` 语句将 `System.Web.Caching` 命名空间引入作用域），并将其传递给 `Insert` 方法。此 `CacheDependency`\
  \ 期望它所依赖的文件。一旦你在磁盘上更改了文件（使用 VS 或记事本，或者例如通过 FTP 覆盖它），ASP.NET 就会从缓存中移除该项，这样在下次执行此代码时，它将再次从源文件中读取。\n\
  \n你使用 `Remove` 方法从缓存中删除项，该方法接受缓存项的键。你在插入项时，使用 `Add` 或 `Insert` 来定义此键。\n\n要访问缓存中的项，你有几种可用选项。首先，你可以直接访问\
  \ `Cache` 集合：\n\nVB.NET\n\n```vb\nmyReview = TryCast(Cache(myKey), Review)\n```\n\
  \nC#\n\n```csharp\nReview myReview = Cache[myKey] as Review;\n```\n\n在这里，`Cache`\
  \ 集合使用存储在 `myKey` 变量中的键进行索引。\n\n此外，你还可以使用期望键的 `Get` 方法：\n\nVB.NET\n\n```vb\nmyReview\
  \ = TryCast(Cache.Get(myKey), Review)\n```\n\nC#\n\n```csharp\nmyReview = Cache.Get(myKey)\
  \ as Review;\n```\n\n由于 `Get` 是一个方法，C# 示例现在也对缓存键使用了圆括号，这使得两个示例看起来更加相似。\n\n最后，你可以使用\
  \ `Item` 属性访问缓存中的项，该属性也接受缓存项的键。\n\n访问缓存项的这三种方法在找不到项时始终返回一个 `object` 或 `Nothing/null`。这意味着，如果你知道从缓存中获取的类型，你应该在使用其属性之前，先使用\
  \ VB.NET 中的 `TryCast` 或 C# 中的 `as` 关键字将其转换为适当类型。之前的两个示例向你展示了如何先将缓存中的项转换为强类型类型 `Review`\
  \ 对象。\n\n为了让你直观了解如何通过程序方式使用缓存，下一个练习将向你展示如何向缓存中插入评论，这样你就不需要每次需要时都从数据库中获取它了。\n\n##\
  \ 实用数据技巧\n\n以下是关于在你的 ASP.NET 网站中处理数据的一些实用技巧：\n\n*   每当你使用数据绑定控件的众多样式属性时，请考虑使用 `CssClass`\
  \ 属性而不是直接设置单个样式属性。这可以避免页面膨肿，并使你的网站更容易维护。\n*   关于控件生命周期的章节有一个练习，向你展示如何显示各种事件以及它们发生的顺序。你可以扩展示例并为更多事件编写代码。此外，你可以在页面上添加更多控件并处理它们的事件，以帮助你对这些事件建立深入的理解。因为深入理解这些事件及其顺序对于编写\
  \ Web 应用程序通常至关重要，你在这个小研究项目上投入的时间是非常值得的。\n*   每当你编写访问数据库或其他慢或稀资源（如文件或 Web 服务）的页面时，考虑它们是否能从缓存受益。尽管后期添加缓存并不困难，但尽早放置越好。\n\
  *   考虑手动编写复杂的数据访问页面。虽然最初写起来比较困难，但从长期来看，你得到的页面将更容易维护。\n\n## 总结\n\n本章涵盖了使用数据控件展示数据的一些较高级话题，之前的章节故意跳过了这些内容，以便你专注于核心数据访问概念。\n\
  \n本章首先详细介绍了大多数数据绑定控件为了影响外观而拥有的众多样式元素。然后你学习了更多控件可以触发的众多事件。这些事件可以用于程序地更改控件的外观。因此，深入理解页面生命周期是重要的知识。\n\
  \n本章最后讨论了 ASP.NET 支持的各种缓存功能，帮助你提高网站的性能。\n\n本章向你展示了在 ASP.NET Web 应用程序中处理数据的高级方法。下一章将向你展示如何通过实现\
  \ ASP.NET 安全来防止未经授权的用户访问某些数据——例如 `Management` 文件夹。\n\n### 本章学到的知识\n\n| 术语 |  |\n\
  | :--- | :--- |\n| ASP.NET 样式 | 继承自 `Style` 类的控件属性，允许你更改控件的外观。 |\n| 缓存 | 一种在比原始源访问速度更快的地方存储数据副本的技术，以提高性能。\
  \ |\n| 缓存失效 | 当项不再有效时从缓存中移除项的机制。 |\n| 异常 | .NET 对错误的术语（异常在第 18 章中进行了非常详细讨论）。 |\n\
  | 外键约束错误 | 当你尝试删除其他行所依赖的行时，在数据库级别发生的错误。 |\n| `MetaDescription`, `MetaKeywords` |\
  \ `Page` 类上的这两个属性允许你设置可以被搜索引擎使用的元数据。 |\n| 输出缓存 | 一种缓存形式，对整个页面或用户控件进行缓存，以防止每次从头生成。\
  \ |\n| 旧数据 | 不再代表原始数据的缓存副本。 |\n\n# 第 16 章：ASP.NET 网站安全\n\n你将学习\n\n*   处理安全时会遇到的重要术语\n\
  *   驱动安全模型的 ASP.NET 应用程序\n*   你如何让用户注册账户\n*   用户如何重置密码或请求新密码\n*   你如何在开发时管理数据库中的用户和角色\n\
  *   你如何根据访问权限向不同用户展示不同的内容\n\n## 引言\n\n虽然安全是一个相当的话题，但它通常围绕着三个简单的问题展开：\n\n\n\n\n\n\
  *   你是谁？\n*   你如何证明这一点？\n*   你在系统中被允许做什么？\n\n## 身份：你是谁？\n\n身份（Identity）是定义“你”的要素。关于身份是什么的答案取决于它所处的上下文。作为一个国家的公民，你的身份围绕着你个人、你的官方姓名和出生日期，甚至可能是社会安全号码。然而，对于像\
  \ [p2p.wrox.com](http://p2p.wrox.com) 这样的 Wrox 社区网站这样的网站，你的身份可能仅仅是一个电子邮件地址。\n\n\
  无论你在身份定义中包含什么内容，它都是一种指代你的方式。但其他人如何知道你是你呢？例如，当你登录某个网站时，他们又如何确保你真的是你呢？这就是身份验证（Authentication）大显身场。\n\
  \n## 身份验证：你如何证明你的身份？\n\n身份验证是关于提供关于你是谁的证据。当你需要注册借卡时，你可能需要出示护照来证明你注册卡片时的姓名确实属于你。对于像\
  \ [p2p.wrox.com](http://p2p.wrox.com) 这样的网站，你需要提供一个电子邮件地址和一个密码。这两者共同构成了证明你身份的证据。许多其他机制也被用于身份验证，包括高科技指纹或虹膜扫描、智能卡和令牌（将证据存储在实体物体上）等。然而，鉴于对\
  \ ASP.NET 网站安全性的讨论，本章将坚持于使用用户名和密码进行身份验证。在许多情况下，电子邮件地址充当用户名，因为它们可以唯一标识用户。\n\n## 授权：你被允许做什么？\n\
  \n根据你是谁，系统会授予你更多或更少访问某些区域的权限。例如，想想动作电影中国家安全机构高度安全的总部。即使主角被被允许进入大楼，他通常也不被允许进入特定区域，因为他缺乏适当的授权（在这些电影中，主角最终通过对系统进行两分钟的黑客攻击进入了那些区域，但这在这里并不是讨论重点）。\n\
  \n要确定一个用户被允许做什么，系统需要知道两件事：当前用户的 `permissions`（权限）以及用户尝试访问的资源的 `authorization rules`（授权规则）。\n\
  \n用户的权限基于她的用户名（其所代表的身份）以及可选分配给该用户的 `roles`（角色，或安全组）。同样，资源可以针对特定的用户或角色开放或锁定。当当前用户与用户尝试访问的资源的访问规则之间匹配时，用户将获得访问权限。如果用户被特定锁定，则访问被拒绝。想象一个文件只有用户\
  \ `Niek` 和 `Developers` 组可以访问。用户 `Niek` 可以访问该文件，无论他是否处于 `Developers` 角色。同时，用户 `Charlotte`\
  \ 必须处于 `Developers` 角色才能访问该文件。\n\n你将在本章的剩余部分中看到如何处理这些概念。\n\nASP.NET 中这些安全概念的大部分是通过所谓的应用程序服务（application\
  \ services）实现的，接下来将讨论。\n\n## ASP.NET 应用程序服务简介\n\nASP.NET 2.0 之前的版本对安全提供了一些基础支持。在\
  \ ASP.NET `1.x` 应用程序中，你需要编写大量代码来实现一个稳健的安全策略。编写这些代码的缺点是，它们在你的所有网站中通常是完全相同的。你或多或被迫反复编写相同的代码来实现安全机制。\n\
  \n这些问题在 ASP.NET 2.0 中得到了解决，它随带了 `application services`：这是一组你可以在网站中使用的服务，用于支持用户、角色、配置文件等功能的管理。这些服务基于提供程序模型（provider\
  \ model），你很快就会了解到更多内容。应用程序服务在 ASP.NET 4.5.1 中仍然强势存在，并且已经过更新以简化配置和部署。\n\nASP.NET\
  \ 4.5.1 提供了许多应用程序服务。最重要的包括：\n\n*   **Membership**（成员身份）——允许你管理和操作系统中的用户账户。\n*  \
  \ **Roles**（角色）——允许你管理可以分配给用户的角色。\n*   **Profile**（配置文件）——允许你在后端数据库中存储用户特定数据。\n\n\
  图 16-1 提供了这些服务的概述，并展示了它们如何与你的网站以及可能使用的底层数据存储建立联系。\n\n![image](img/f592-01.jpg)\n\
  \n**图 16-1**\n\n在图表的顶部，你看到 ASP.NET 4.5.1 网站和 Web 应用程序，它们代表你构建的网站。这些网站可以包含像登录控件（下文讨论）之类的控件，这些控件反过来可以与\
  \ ASP.NET 应用程序服务（如 `membership` 和 `roles`）通信。为了创建一个解决方案，这些服务并不直接与底层数据源通信，而是与配置好的\
  \ `provider`（提供程序）通信。提供程序是一个为特定任务设计的可互换软件组件。例如，在成员服务的情况下，`Membership` 提供程序设计用于与底层数据存储中的用户协作。你可以根据需要为同一个应用程序服务配置不同的提供程序。之前的\
  \ ASP.NET 版本随带了一个 `SQL Server` 提供程序，它允许你的成员服务与 `SQL Server` 数据库通信，以及一个 `Active Directory`\
  \ 提供程序（允许你在 Windows 中创建和管理用户）。这些提供程序仍然可用，但现在有了新的替代方案。2011 年 6 月，微软发布了通用提供程序（Universal\
  \ Providers），它们的工作与 `SQL Server` 提供程序相同，但可以用于所有版本的 `SQL Server`。这使得通过更改应用程序配置即可切换底层数据库。通用提供程序适用于\
  \ .NET 4 及更高版本，并非常适合像 [PlanetWrox.com](http://PlanetWrox.com) 这样连接互联网的网站。如果你创建一个新的\
  \ ASP.NET Web Forms 站点，通用提供程序已经为你设置好了。如果你创建一个空的 ASP.NET 网站（如 Planet Wrox 示例项目），你需要使用\
  \ NuGet 自己添加提供程序，正如后文练习所示。\n\n提供程序模型的优势在于，你可以通过配置切换提供程序而无需更改任何编程代码。如果你有自己的自定义数据存储，你可以编写自己的提供程序并将其接入你的网站，以极小的代价替换默认提供程序。\n\
  \n每个提供程序都需要一个数据存储——如图 16-1](#Chapter16.xhtml_figure16-1) 底部所示——并被编写用于一个或多个特定的数据存储。例如，`DefaultMembershipProvider`（处理成员服务，如创建用户、登录和重置密码）和\
  \ `DefaultRoleProvider`（处理角色相关任务）设计用于配合任何版本的 Microsoft SQL Server，包括 Express、`LocalDB`、`SQL\
  \ Server Compact` 和 `SQL Azure`。这两个提供程序取代了早期 ASP.NET 版本随带的 `SqlMembershipProvider`\
  \ 和 `SqlRoleProvider`。\n\n在本章的剩余部分中，你将看到如何使用 `DefaultMembershipProvider` 和 `DefaultRoleProvider`。在下一章中，你将处理\
  \ `DefaultProfileProvider`。你可以配置这三个提供程序使用同一个 `SQL Server` 数据库，从而轻松地集中你所有的用户数据。\n\
  \n\n\n\n\n理想情况下，你不需要直接处理这些提供程序。在正常情况下，各种提供程序会在一个中心位置为你的网站配置。然后你通过与应用程序服务交互来使用这些提供程序。虽然你可以直接从代码访问这些服务，但你通常使用\
  \ `ASP.NET` 内置的登录控件来为你完成繁琐的工作。接下来将讨论这些控件。\n\n## 介绍登录控件\n\n`ASP.NET` `4.5.1` 自带的登录控件消除了通常在为网站编写安全层时涉及的大许多复杂性。可用的登录控件有效地封装了验证和管理用户所需的所有代码和逻辑。这些控件通过应用程序服务与配置的提供程序进行通信，而不是直接与数据库通信。为了了解其工作原理，下面的练习将向你展示如何创建一个简单的\
  \ `Login`（登录）和 `Sign Up`（注册）页面，让新用户创建账户并登录。接下来的部分将介绍 `ASP.NET` `4.5.1` 自带的七种登录控件。\n\
  \n现在你已经了解登录控件如何与 `SQL Server` 数据库协同工作，是时候详细查看工具箱中 `Login` 类别下的控件了。\n\n### 登录控件\n\
  \n`ASP.NET` `4.5.1` 带有七种登录控件，每种控件都有不同的用途。图 16-8 显示了带有七种登录控件的工具箱（指针出现在所有工具箱类别中，并不是登录控件）。\n\
  \n![image](img/f598-01.jpg)\n\n**图 16-8**\n\n在后续章节中，将详细解释这些控件中的每一个。\n\n#### Login\n\
  \n正如正如你在上一个练习中看到的，`Login` 控件允许用户登录站点。在底层，该控件通过应用程序服务与配置的 `Membership` 提供程序通信，以检查用户名和密码是否代表系统中的有效用户。如果用户通过验证，将发放一个\
  \ cookie 到用户的浏览器。在随后的请求中，浏览器会将 cookie 重新提交给服务器，这样系统就知道它仍在处理一个有效用户。`Membership` 提供程序的不同设置都配置在\
  \ `Web.config` 文件的 `<membership />` 元素中。你将在本章稍后的部分学习更多关于该元素的信息。\n\n要创建一个完全功能性的 `Login`\
  \ 页面，你只需要以下控件声明：\n\n```xml\n<asp:Login ID=\"Login1\" runat=\"server\" />\n```\n\n\
  然而，在大多数情况下，你希望通过设置下表所示的一个或属性来增强控件的外观和行为。\n\n| 属性 | 说明 |\n| :--- | :--- |\n| `DestinationPageUrl`\
  \ | 定义用户在登录尝试成功后被引导到的 URL。当你留空此属性时，该值将从 `Web.config` 中 `<forms>` 元素的 `defaultUrl`\
  \ 属性获取，该默认值为 `Default.aspx`。 |\n| `CreateUserText` | 控制用于邀请用户注册新账户的显示文本。如果你留空此属性，则不显示注册链接。\
  \ |\n| `CreateUserUrl` | 控制用户被带到哪里注册新账户的 URL。 |\n| `DisplayRememberMe` | 指定控件是否显示“记住我”选项。当设置为\
  \ `False,` 时，不显示此选项的复选框。 |\n| `RememberMeSet` | 指定“记住我”选项是否初始勾选。 |\n| `PasswordRecoveryText`\
  \ | 控制显示的链接文本，用于告诉用户他们可以重置或恢复密码。如果你留空此属性，则不显示该链接。 |\n| `PasswordRecoveryUrl` | 指定用户被带到哪里获取（新）密码的\
  \ URL。 |\n| `VisibleWhenLoggedIn` | 决定当当前用户登录时控件是否可见。默认值为 `True`。 |\n\n`ASP.NET`\
  \ 的身份验证机制默认假设站点根目录下有一个名为 `Login.aspx` 的页面，用于让用户登录。为了实现功能，该页面最少需要一个 `Login` 控件。如果你想使用不同的页面，可以在\
  \ `<authentication />` 下的 `<forms />` 元素中指定其路径，如下：\n\n```xml\n<authentication mode=\"\
  Forms\">\n  <forms loginUrl=\"~/Account/MyLoginPage.aspx\" />\n</authentication>\n\
  ```\n\n通过此配置，你告诉 `ASP.NET` 运行时当用户需要提供凭据时，从站点根目录下的 `Account` 文件夹加载 `MyLoginPage.aspx`\
  \ 页面。\n\n注意，在登录页面（在 `loginUrl` 属性中配置）上，`Login` 控件的 `VisibleWhenLoggedIn` 属性不起作用。在配置的登录页面上，`Login`\
  \ 控件始终是可见的。如果你想隐藏它，可以使用 `LoginView` 控件，正如你在稍后的练习中看到的。\n\n除了这些属性外，`Login` 控件有一系列\
  \ `Text` 属性，例如 `LoginButtonText`、`RememberMeText`、`TitleText` 和 `UserNameLabelText`，用于设置控件及其组成用户界面各种子控件（如\
  \ `Button` 和 `Label` 控件）中显示的文本。\n\n就像数据绑定控件一样，登录控件有许多样式属性，允许你微调其外观。鼓励你查看属性格中的 `Styles`\
  \ 类别以查看如何设置各种样式选项，就像数据绑定控件一样，你可以将样式信息移动到皮肤文件中。\n\n`Login` 控件还暴露了一些事件，你通常不需要处理这些事件，但在某些情况下派用用。例如，`LoggedIn`\
  \ 事件在用户登录后触发，如果 `DestinationUrl` 不够灵活，它是引导用户到另一个页面的好地方。\n\n#### LoginView\n\n`LoginView`\
  \ 是一个实用的控件，允许向不同的用户显示不同的数据。它允许你区分匿名用户和登录用户，你甚至可以区分不同角色的用户。`LoginView` 是模板驱动的，因此允许你定义显示给不同用户的模板。下表描述了两个模板以及特殊的\
  \ `RoleGroups` 元素。\n\n| 模板 | 说明 |\n| :--- | :--- |\n| `AnonymousTemplate` | 此模板的内容仅显示给未身份验证的用户。\
  \ |\n| `LoggedInTemplate` | 此模板的内容仅显示给登录用户。此模板与 `AnonymousTemplate` 互斥。在任何时候只有其中一个可见。\
  \ |\n| `RoleGroups` | 此控件可以包含一个或多个 `RoleGroup` 元素，这些元素包含一个 `ContentTemplate` 元素，用于定义指定角色的内容。允许查看内容的角色或角色在\
  \ `Roles` 属性中定义，该属性接受逗号分隔的角色列表。`RoleGroups` 元素与 `LoggedInTemplate` 互斥。这意味着如果用户是\
  \ `RoleGroup` 中某个角色的成员，则 `LoggedInTemplate` 中的内容将不可见。此外，只显示与用户角色匹配的第一个 `RoleGroup`\
  \ 内容。 |\n\n`LoginView` 控件本身除了你在控件各个子元素中定义的内容外，不会输出任何标记，这意味着你可以轻松地将其嵌入到一对 HTML 标签（如\
  \ `<h1>` 和 `<li>`）之间，以创建自定义标题或列表项。\n\n下面的代码片段显示了一个 `LoginView` 控件，它为三种不同的用户定义了内容：站点匿名访问者、登录用户以及已登录且是\
  \ `Managers` 角色成员的用户：\n\n\n\n\n\n```xml\n<asp:LoginView ID=\"LoginView1\" runat=\"\
  server\">\n  <AnonymousTemplate>\n    Hi there visitor. Would you be interested\
  \ in signing up for an account?\n  </AnonymousTemplate>\n  <LoggedInTemplate>\n\
  \    Hi there visitor and welcome back to PlanetWrox.com.\n  </LoggedInTemplate>\n\
  \  <RoleGroups>\n    <asp:RoleGroup Roles=\"Managers\">\n      <ContentTemplate>\n\
  \        Hi there manager. You can proceed to the Management section.\n      </ContentTemplate>\n\
  \    </asp:RoleGroup>\n  </RoleGroups>\n</asp:LoginView>\n```\n\n你将在本章稍后部分看到如何创建和配置角色。\n\
  \n### LoginStatus\n\n正如之前的“尝试尝试”练习所示，`LoginStatus` 控件提供了有关用户当前状态的信息。当用户未经过身份验证时，它提供一个\
  \ `Login` 链接；当用户已登录时，它提供一个 `Logout` 链接。你可以通过设置 `LoginText` 和 `LogoutText` 属性来控制显示的实际文本。或者，你也可以设置\
  \ `LoginImageUrl` 和 `LogoutImageUrl` 属性来显示图像而非文本。当你同时设置了图像和文本时，将显示图像，并将文本用作图像的替代文本（alternative\
  \ text）。最后，你可以设置 `LogoutAction` 属性来决定用户注销时当前页面是否刷新，或者用户注销后是否跳转到另一个页面。你通过设置 `LogoutPageUrl`\
  \ 来确定此目标页面。\n\n除了这些属性，该控件还能触发两个事件：`LoggingOut` 和 `LoggedOut`，它们分别在用户注销之前和之后触发。\n\
  \n### LoginName\n\n`LoginName` 是一个非常简单的控件。它的唯一功能就是显示已登录用户的名称。要将用户名嵌入到某些文本中（例如 `You\
  \ are logged in as Imar`），你可以使用 `FormatString` 属性。如果你在该格式字符串中包含 `{0}`，它将被替换为用户的用户名。\n\
  \n你将在下一个练习中看到它是如何运作的，该练习将要求你修改网站的登录页和主页，以显示关于用户的相关信息。\n\n除了你已经看到的允许用户登录以及使用当前用户登录状态来显示或隐藏相关内容的控件外，工具箱中的\
  \ Login 类别还包含三个控件，它们分别允许用户在网站上注册新账户、更改现有密码以及找回丢失的密码。这些控件将在接下来讨论。\n\n### CreateUserWizard\n\
  \n你在早之前的练习中简要地见过 `CreateUserWizard` 的工作。但该控件提供的功能比你在练习中看到的标准行为要多得多。\n\n首先，该控件有一个长长的\
  \ `Text` 属性列表，例如 `CancelButtonText`、`CompleteSuccessText`、`UserNameLabelText` 和\
  \ `CreateUserButtonText`，这些属性影响控件中使用的文本。所有属性都有良好的（英语）默认值，但如果不符合你的需求，你可以更改它们。\n\n\
  控件有一许多以 `ImageUrl` 结尾的属性，例如 `CreateUserButtonImageUrl`。这些属性允许你为各种用户操作定义图像，而不是使用控件生成的默认按钮。如果你将这些属性的任何一个设置为有效的\
  \ `ImageUrl`，则还需要设置相应的 `ButtonType`。例如，要将“创建用户”按钮改为图像，你需要将 `CreateUserButtonImageUrl`\
  \ 设置为有效的图像，并将 `CreateUserButtonType` 设置为 `Image`。\n\n`ButtonType` 的默认值为 `Button`，它默认渲染标准按钮。你也可以将\
  \ `ButtonType` 设置为 `Link`，使其被渲染为标准的 `LinkButton` 控件。在本节开头介绍的相关文本属性将显示在按钮和链接上。\n\n\
  此外，该控件还暴露了许多实用属性，你可以设置这些属性来更改其行为和外观，如下表所示。\n\n| 属性 | 说明 |\n| :--- | :--- |\n| `ContinueDestinationPageUrl`\
  \ | 定义用户在注册后点击“继续”时被往的页面。 |\n| `DisableCreatedUser` | 决定在创建账户时是否将用户标记为禁用。当设置为 `True`\
  \ 时，用户在账户启用之前无法登录网站。你将在稍后部分看到如何手动激活和禁用用户账户。默认值为 `False`。 |\n| `LoginCreatedUser`\
  \ | 决定在账户创建后是否自动登录用户。默认值为 `True`。 |\n| `RequireEmail` | 决定控件是否向用户询问电子邮件地址。默认值为 `True`。\
  \ |\n| `MailDefinition` | 包含许多子属性，允许你定义用户注册后发送给他们的（可选）电子邮件。 |\n\n你可能会注意到，该控件没有任何属性可以更改密码策略（即要求用户输入至少六个字符的密码）。因为多个控件需要访问这些设置，你需要在底层的提供程序上配置它们。在本章稍后的“配置你的\
  \ Web 应用程序”部分，你将看到它是如何运作的。\n\n`CreateUserWizard` 控件能够向用户发送确认电子邮件，告知他们新账户已成功创建。这封邮件也可以作为其用户名和密码的提醒。在后续练习中，你将看到如何配置\
  \ `MailDefinition` 元素，以便 `CreateUserWizard` 向新用户发送电子邮件确认其账户，并发送他们的用户名和密码以供将来参考。\n\
  \n接下来讨论的 `PasswordRecovery` 控件也支持自定义邮件主体，并允许你在 `SendingMail` 事件处理程序中手动发送消息。\n\n\
  ### PasswordRecovery\n\n`PasswordRecovery` 控件允许用户找回现有密码（如果系统支持）或获取新的生成的密码。在这两种情况下，密码都会发送到用户注册账户时输入的电子邮件地址。\n\
  \n`PasswordRecovery` 控件的大多数属性现在应该已经熟悉。它有许多 `Text` 属性，例如 `GeneralFailureText`（无法找回密码时显示）和\
  \ `SuccessText`，允许你设置控件显示的文本。它还具有以 `ButtonType`、`ButtonText` 和 `ButtonImageUrl`\
  \ 结尾的属性，允许你更改控件各种操作按钮的外观和行为。如果你想在密码恢复成功后将用户引导到另一个页面，可以将 `SuccessPageUrl` 设置为网站中的某个页面。\n\
  \n与 `CreateUserWizard` 一，`PasswordRecovery` 控件也有一个 `MailDefinition` 元素，它可以指向你想要作为邮件主体发送的文件。你可以使用相同的占位符对于用户名和密码来自定义消息。如果你省略了\
  \ `MailDefinition`，控件将使用默认邮件主体，正如你在下一个练习中看到的。\n\n### ChangePassword\n\n`ChangePassword`\
  \ 控件允许现有和登录用户更改密码。它有一系列属性来更改文本、错误消息和按钮，类似于 `CreateUserWizard` 和 `PasswordRecovery`\
  \ 控件。它还有一个 `MailDefinition` 元素，允许你向用户的电子邮件地址发送新密码的确认。你将在下一个练习中使用此控件。\n\n\n\n\n\n\
  当你添加通用提供程序（Universal Providers）时，NuGet 为 Membership、Roles（角色）、Profile 和 Session\
  \ 状态提供程序添加了若干配置设置。以下是你更改连接字符串后 `Membership` 提供的程序的代码：\n\n```\n<membership defaultProvider=\"\
  DefaultMembershipProvider\">\n  <providers>\n    <add name=\"DefaultMembershipProvider\"\
  \n            type=\"System.Web.Providers.DefaultMembershipProvider,\n         \
  \   System.Web.Providers, Version=2.0.0.0, Culture=neutral,\n            PublicKeyToken=31bf3856ad364e35\"\
  \n        connectionStringName=\"PlanetWroxConnectionString1\"\n        enablePasswordRetrieval=\"\
  false\" enablePasswordReset=\"true\"\n        requiresQuestionAndAnswer=\"false\"\
  \ requiresUniqueEmail=\"false\"\n        maxInvalidPasswordAttempts=\"5\" minRequiredPasswordLength=\"\
  6\"\n        minRequiredNonalphanumericCharacters=\"0\" passwordAttemptWindow=\"\
  10\"\n        applicationName=\"/\"\n    />\n  </providers>\n</membership>\n```\n\
  \n此提供程序配置包含许多有趣的属性，下表对其进行了描述。如果你没有在配置文件中指定相关的属性，将应用描述列列出的默认值。\n\n| ATTRIBUTE | DESCRIPTION\
  \ |\n| :--- | :--- |\n| `connectionStringName` | 指向应用程序的连接字符串名称。 |\n| `enablePasswordRetrieval`\
  \ | 决定用户是否能够检索当前密码。当 `passwordFormat` 为 `Hashed` 时，无法设置此选项（参见 `passwordFormat`）。默认值为\
  \ `false`。 |\n| `enablePasswordReset` | 决定用户是否能够请求新密码。默认值为 `true`。 |\n| `requiresQuestionAndAnswer`\
  \ | 决定 `CreateUserWizard` 和 `PasswordRecovery` 等控件是否要求用户输入安全问题和答案。默认值为 `true`。 |\n\
  | `applicationName` | 提供应用程序的唯一名称。默认值为 `/`，但你可以更改它以支持多个网站。 |\n| `requiresUniqueEmail`\
  \ | 决定系统是否允许用户账户使用重复的邮箱地址。设置为 `true` 时，每个用户必须提供唯一的用户名和邮箱地址。默认值为 `true`。 |\n| `passwordFormat`\
  \ | 决定密码在数据库中的存储方式。它支持以下格式：`Clear` — 密码以明文存储。`Encrypted` — 密码以可逆格式加密，使系统能够再次检索密码的明文。`Hashed`\
  \ — 密码使用不可逆的单向算法加密。当 `passwordFormat` 为 `Hashed` 时，用户无法检索其原始密码。他们只能请求新的自动生成的密码。默认值为\
  \ `Hashed`。 |\n| `maxInvalidPasswordAttempts` | 指定用户在账户被锁定之前输入无效密码或安全答案的次数。默认值为\
  \ `5`。 |\n| `minRequiredPasswordLength` | 决定密码的最小长度。默认值为 `7`。 |\n| `minRequiredNonalphanumericCharacters`\
  \ | 决定密码中必须包含的非字母数字字符的最数量。默认值为 `1`。 |\n| `passwordAttemptWindow` | 决定计算无效密码尝试的时间范围（分钟）。默认值为\
  \ `10`。 |\n| `passwordRegularExpression` | 允许你指定自定义正则表达式以强制执行强密码。 |\n\n你可以在 MSDN\
  \ 网站上的 `http://bit.ly/RFxQZT` 查看 `Membership` 的完整配置设置列表。在接下来的“尝试”中，你将看到如何通过更改其中一些属性来为\
  \ Planetrox 重新配置 `Membership` 提供程序。\n\n到目前为止，你已经了解如何让用户注册账户以便他们登录。但如何区分系统中的不同用户呢？如何阻止未经授权的用户访问特定文件夹（如\
  \ `Management` 文件夹）？你可以使用 `Role Manager` 来实现，这是 ASP.NET 自带的另一个应用程序服务。\n\n## Role\
  \ Manager\n\n虽然你的用户现在可以注册并登录你的网站这很不错，但如果你能够区分用户，将有用得多。这将允许你授予一个或少数用户访问 `Management`\
  \ 文件夹的权限，以便只有他们可以修改你的评论和类型。使用 ASP.NET 自带的 `Role Manager` 这非常容易。`Role Manager` 允许将用户分配到不同的角色。然后你可以使用这些角色来开启或锁定网站中的特定功能。例如，你可以阻止除\
  \ `Managers` 角色用户以外的所有用户访问 `Management` 文件夹。此外，正如你之前看到的，你还可以根据 `LoginView` 中用户的角色显示不同的内容。\n\
  \n### Role Manager 配置\n\n与 membership 类似，`Role Manager` 的设置位于 `Web.config` 文件中。当你安装通用提供程序时，NuGet\
  \ 添加的默认设置如下（你更改的连接字符串除外）：\n\n```\n<roleManager defaultProvider=\"DefaultRoleProvider\"\
  >\n  <providers>\n    <add name=\"DefaultRoleProvider\"\n      type=\"System.Web.Providers.DefaultRoleProvider,\
  \ System.Web.Providers,\n      Version=2.0.0.0, Culture=neutral, PublicKeyToken=31bf3856ad364e35\"\
  \n      connectionStringName=\"PlanetWroxConnectionString1\"\n      applicationName=\"\
  /\"\n    />\n  </providers>\n</roleManager>\n```\n\n`Role Manager` 默认未启用，要启用它，你需要向\
  \ `<roleManager />` 元素添加 `enabled=\"true\"` 属性。下一个练习中，你将看到如何通过网站管理工具 (`WSAT`) 启用\
  \ `Role Manager`。与 `Membership` 一样，`Role Manager` 在底层使用提供程序。\n\n除了此处显示的设置，`<roleManager\
  \ />` 元素还有几个你可以配置的属性。大部分与带有角色信息的 cookie 的创建和存储有关。对于大多数情况，默认配置应该足够，但如果你需要进一步配置 `Role\
  \ Manager`，请查看 MSDN 网站上的 `http://bit.ly/LmtmB3` 以获取其完整配置设置列表。\n\n在配置了 `Membership`\
  \ 和 `Role Manager` 提供程序并创建了数据库后，是时候管理系统中的用户和角色了。你有几种方法可以：\n\n*   使用网站管理工具，通常称为 `WSAT`。\n\
  *   在现代 Windows 版本上使用 `IIS`（Windows 网络服务器）（你将在第 19 章看到更多内容）。\n*   通过编程方式使用 `Role\
  \ Manager API`。\n\n使用 `Role Manager API` 管理角色超本书的范围。如果你想了解更多信息，可以购买 Wrox 的 *Professional\
  \ ASP.NET 4.5 in C# and VB* (Jason N. Gaylord, Christian Wenz, Pranav Rastogi, Todd\
  \ Miranda, Scott Hanselman; Wiley 2013; ISBN: 978-1-118-31182-0)。\n\n\n\n\n\n你通过\
  \ WSAT 进行的某些更改将持久化在应用程序的 `Web.config`文件中。其他设置（如用户和角色）则存储在所配置的提供程序的数据库中。\n\n在接下来的练习中，你将看到如何启动和使用\
  \ WSAT。你将看到如何创建新角色和新用户，以及如何将该用户分配给角色。\n\n在下一节中，你将看到如何阻止对 `Management` 文件夹的访问并修改\
  \ `LoginView`；关于 Role API 的使用将在后面的练习中讨论。\n\n### 配置 Web 使用角色\n\n在 WSAT 的 Security\
  \ 页面上，你看到了一个名为“访问规则”（Access Rules）的部分。工具的这部分允许你阻止或开放网站中的资源。它允许你定义诸如“除了 Managers\
  \ 角色的用户外，任何人都无权访问此文件夹”或“任何人都可以访问此文件，但 Members 角色的用户和 Joe 账户除外”。该工具非常直观，因此设置不同的规则并不困难。然而，它也有一个缺点：它将安全设置存储在独立的\
  \ `Web.config` 文件中，每个你配置的子文件夹都有一个。\n\n这使得概述所有不同的安全设置变得有些困难。幸运的是，ASP.NET 还允许你使用`<location>`\
  \ 元素在主 `Web.config` 中配置相同的设置。`<location>` 元素有一个 `path` 属性，指向你想进行不同配置的文件或文件夹。你也可以将`<location>`\
  \ 元素用于 `Web.config` 中的许多（但不是所有）其他设置（例如，你可以在主 `Web.config` 中为 `Management` 文件夹的 `<pages>`元素设置\
  \ `theme` 属性）。对于后续练习，你只需将`<location>` 的子元素设置为与安全相关的部分。\n\n通过此代码，用户 Alex 只能看到第一个\
  \ `RoleGroup` 的内容，尽管他也被分配了 WebMasters 角色。\n\n### 通过程序检查角色\n\n虽然使用 `LoginView` 控件在运行时更改用户允许看到的内容很容易的，但这并不总是足够的。有时，你需要根据某人的角色成员对你展示的数据进行程序化控制。你可以通过多种方式访问当前用户的角色信息。首先，你可以像这样从当前页面或用户控件访问\
  \ `User` 属性的 `IsInRole` 方法：\n\nVB.NET\n```\nIf User.IsInRole(\"Managers\") Then\n\
  \  ' 此段代码仅对 Managers 执行\nEnd If\n```\n\nC#\n```cs\nif (User.IsInRole(\"Managers\"\
  ))\n{\n  // 此段代码仅对 Managers 执行\n}\n```\n\n或者，你可以访问 `Roles` 类，该类包含许多可以直接访问的静态方法。以下代码在功能上与上一个等等：\n\
  \nVB.NET\n```\nIf Roles.IsUserInRole(\"Managers\") Then\n  ' 此段代码仅对 Managers 执行\n\
  End If\n```\n\nC#\n```cs\nif (Roles.IsUserInRole(\"Managers\"))\n{\n  // 此段代码仅对\
  \ Managers 执行\n}\n```\n\n除了 `IsUserInRole` 方法外，`Roles` 类包含许多其他方法，允许你程序化地处理角色。例如，你可以创建和删除角色、将用户分配给角色或从角色移除，并获取分配给特定角色的用户列表。有关\
  \ Roles API 的更多信息，请查看 `http://tinyurl.com/RolesAPI4-5`  MSDN 文档，或者购买 Bilal Haidar\
  \ 写的*Professional ASP.NET 3.5 Security, Membership, and Role Management with C#\
  \ and VB*（Wrox 2008, ISBN: 978-0-470-37930-1）。尽管该书针对的是 ASP.NET 3.5，但你会发现书中讨论的大多数主题仍然适用于\
  \ ASP.NET 4.5.1。\n\n在接下来的练习中，你将学习如何修改相册页面，以便以 Managers 登录的用户能够删除相册中的图片。其他用户将无法删除图片，因为\
  \ `Delete` 按钮对他们将隐藏。\n\n## 实用安全提示\n\n以下列表提供了一些实用的安全提示：\n\n*   虽然安全概念在书中介绍得较晚，但你不应该将其视为事后后补救。为了确保你创建了一个稳健且安全的应用程序，你应该从网站开发的非常早期阶段就开始考虑安全问题。决定是否希望设置只有特定用户才能访问的区域，以及是否要在用户访问之前强制他们获取你网站的账户，越早完成越好。在过程中越晚引入这些概念，在集成这些功能时你面临的困难就越多。\n\
  \n*   尝试将 ASPX 页面等资源分组到代表系统角色的文件夹下。例如，Planet Wrox 网站中的 `Management` 文件夹。所有与网站管理相关的页面都封装在一个\
  \ get 文件夹中，使得通过 `Web.config` 文件中的单个`<location>` 元素就能轻松阻止整个文件夹。当你想要保护的文件散落在整个网站各处时，你需要更多时间来配置应用程序，并且会导致活动安全设置的视图杂乱。\n\
  \n*   当你为网站创建角色以区分不同用户时，尝试限制你的系统拥有的不同角色的数量。你会发现，与只有少数逻辑分组的角色相比，拥有仅包含一两个用户的大量角色，系统管理起来要容易得多。\n\
  \n## 总结\n\n你通过 WSAT 进行的某些更改将持久化在应用程序的 `Web.config`文件中。其他设置（如用户和角色）则存储在所配置的提供程序的数据库中。\n\
  \n在接下来的练习中，你将看到如何启动和使用 WSAT。你将看到如何创建新角色和新用户，以及如何将该用户分配给角色。\n\n在下一节中，你将看到如何阻止对 `Management`\
  \ 文件夹的访问并修改 `LoginView`；关于 Role API 的使用将在后面的练习中讨论。\n\n你可以使用多种技术在 ASP.NET 站点中实现安全，包括\
  \ Windows 身份验证（由 Web 服务器处理身份验证）以及作为许多 ASP.NET 网站事实标准的表单身份验证。\n\n通常情况下，安全包含了三个重要的概念：身份、身份验证和授权。它们共同决定了你是谁以及你可以做什么。\n\
  \nMembership 服务（底层使用 Membership 程序）允许你使用 `CreateUserWizard`、`PasswordRecovery` 和\
  \ `Login` 等方便的控件创建用户。\n\n角色管理器（底层使用 Role 程序）允许你将用户分组为各种角色，并对这些角色应用权限。你可以程序化检查角色，或使用\
  \ `LoginView` 根据用户所属的角色展示不同的数据。\n\n用户和角色由 WSAT 管理，正如你在本节看到的，你可以将用户账户分配给不同的角色。然后你可以使用\
  \ `Web.config` 文件中简单的`<location>` 元素为你的网站开放或阻止特定的资源。\n\n各种登录控件允许你自定义用户看到的内容。在下一章中，你将发现如何更进一步，创建根据访问它们的用户调整的动态页面。\n\
  \n本章你学到的内容\n\n| 概念 | 说明 |\n| :--- | :--- |\n| **应用程序服务** | 一组 ASP.NET 服务，你可以从网站访问它们，用于处理成员、角色和配置管理任务。\
  \ |\n| **身份验证** | 向系统证明你的身份的过程。 |\n| **授权** | 确定用户在系统中拥有的权限的过程。 |\n| **登录控件** |\
  \ 随 ASP.NET 发布的一系列安全控件，允许你注册、登录、找回密码等。 |\n| **成员服务** | ASP.NET 应用程序服务之一，处理与成员相关的任务（包括创建用户、登录等）。\
  \ |\n| **权限** | 决定了用户允许执行的操作。 |\n| **提供程序模型** | 一种使用可更换软件来处理某些应用程序任务的模型。通过配置，你可以分配另一个处理相同任务（但方式不同）的软件。\
  \ |\n\n\n\n\n\n| **Role Manager** | ASP.NET 应用服务之一，用于处理与角色相关的任务，包括创建角色、将用户分配给角色以及检查其角色成员。\
  \ |\n\n# 第 17 章：网站的个性化\n\n在本章中你将学习到：\n\n*   ASP.NET 自带的 `Profile` 功能的详细信息\n*   如何在网站中创建和使用用户配置文件\n\
  *   如何识别你的用户以及如何为他们提供定制化内容\n*   如何访问你网站上其他用户的配置文件\n\n## 本章的 WROX.COM 代码下载\n\n你可以在\
  \ [www.wrox.com/go/begaspnet451](http://www.wrox.com/go/begaspnet451) 的“Download\
  \ Code”选项卡中找到本章的 [wrox.com](http://wrox.com) 代码下载。代码位于第 17 章文件夹中。\n\n在网上，只有一件事能击败优质的内容——那就是良好的*个性化*内容。在信息过载和竞争性网站众多的时代，了解你的访问者并理解你向他们展示个性化内容的可能性是非常关重要的。通过良好的个性化策略，你可以通过向用户提供他们恰好需要的数据，创建一个符合你用户预期的网站。个性化适用于许多不同的场景。例如，在体育网站上，你使用个性化内容来突出用户喜爱的球队的活动。在处理编程的网站上，你可以通过仅向用户显示其偏好的编程语言的示例来提供个性化内容。在新闻网站上，你可以让用户选择一个或多个新闻类别（世界、本地、体育、商业、财经等），并根据这些偏好针对性地向他们展示内容。你还可以更进一步，当其中一个类别发布新文章时，向他们发送电子邮件更新。\n\
  \n然而，个性化并不仅仅是存储个人偏好并根据这些偏好调整内容。通过个性化，你还可以跟踪用户的详细信息，例如姓名、出生日期、访问网站的次数、用户在在线商店购买的物品等。然后，你可以使用这些细节进一步个性化\
  \ 页面，与你的访问者建立更紧密的关系。\n\n在 Planet Wrox 网站中，个性化的实现既简单又有效。主评论页面设计为只显示用户感兴趣的音乐流派评论。要查看所有可用评论，用户仍然可以访问\
  \ `All.aspx` 页面，但通过访问个性化页面，他们只会看到他们真正喜欢的音乐流派的评论。\n\n此外，用户可以输入自己的个人详情，例如姓、名以及简短介绍。这些细节显示在相册详情页上，这样你就知道是谁创建了特定的相册。\n\
  \n为了使你能够为网站添加个性化功能，ASP.NET 4.5.1 自带了一个名为 `Profile` 的应用程序服务。通过 `Profile` 服务，你只需要极少的代码即可存储特定用户的数据。\n\
  \n在本章结束时，你将拥有关于 `Profile` 提供的个性化功能的知识，以创建动态且个性化的网站。\n\n## 理解 Profile\n\nASP.NET\
  \ `Profile` 是另一个随 ASP.NET 提供的应用程序服务。它允许你存储和检索有关你网站用户的信息，这些信息超出了用户在注册期间输入的电子邮件地址和密码等基本信息。通过\
  \ `Profile`，你可以存储如姓名、出生日期等更多信息，正如你在本章随后的部分中看到的。通过跟踪这些数据所属的用户，ASP.NET 能够在用户下一次访问你的网站时（无论几分钟后还是几周后）将该数据映射到该用户。`Profile`\
  \ 的酷之处在于，它允许你存储注册用户的数据，也可以存储匿名用户的数据。因此，即使你的访问者没有注册账户，你也可以识别他们并存储关于他们的信息。\n\n你通过一个简洁的\
  \ API 访问用户配置文件中的信息，几乎不需要代码。你只需要在中央 `Web.config` 文件中定义你想要跟踪的信息，`Profile` 服务将处理其余工作。与数据库的所有交互（以检索或存储配置文件信息）将自动为你处理。\n\
  \n在你的 Web 应用程序中启用 `Profile` 是一个简单的两步过程：\n\n1.  在 `Web.config` 文件中定义你想要为用户存储的信息。根据这些信息，ASP.NET\
  \ 运行时会为你生成并编译一个类，使你能够访问定义的属性。然后，它会动态地在你网站的所有 Web 页面上扩展一个名为 `Profile` 的属性，以便你可以从网站的每个页面轻松地访问配置文件属性。\n\
  2.  在你的应用程序中，直接对此生成的类进行编程，以获取和存储*当前*用户的配置文件信息。\n\nASP.NET `Profile` 默认连接到已登录的用户，尽管你在本章随后的部分可以看到，你也可以为未身份验证的用户保存配置文件数据。\n\
  \n在下一节中，你将看到如何在 `Web.config` 中定义配置文件属性以及如何在 Web 中访问它们。\n\n## 配置 Profile\n\n你通过在\
  \ `Web.config` 文件中创建`<system.web>`元素的直接子`<profile>` 元素为你的网站定义配置文件。在`<profile>` 标签之间，你需要创建一个`<properties>`\
  \ 元素，用于定义你想从 `Profile` 对象中暴露的属性。属性有两种类型：简单属性和复杂属性，称为*配置文件组*（profile groups）。\n\n\
  ### 创建简单配置文件属性\n\n你使用`<add>` 元素作为`<properties>` 元素的直接子来定义简单属性。以下示例演示了如何创建一个用于存储用户姓名的属性以及用于存储出生日的属性。`FirstName`\
  \ 属性可以供匿名和登录用户访问和设置，而 `DateOfBirth` 属性仅登录用户使用：\n\n```xml\n<system.web>\n  ...\n\
  \  <profile>\n    <properties>\n      <add name=\"FirstName\" allowAnonymous=\"\
  True\" />\n      <add name=\"DateOfBirth\" type=\"System.DateTime\" />\n    </properties>\n\
  \  </profile>\n```\n\n由于属性默认类型为 `System.String`，因此对于像姓名这样的文本属性，不需要显式定义 `type`。然而，对于\
  \ `DateTime`、`Boolean`、`Integer` 或你自己的类型，你需要使用 `type` 属性显式定义类型及其包含命名空间的限定名称，如 `DateOfBirth`\
  \ 属性所示。下表列出了影响属性的`<add>`元素的常用属性。\n\n| 属性 | 描述 |\n| :--- | :--- |\n| `name` | 定义属性的名称，例如\
  \ `FirstName`, `DateOfBirth` 等。 |\n| `type` | 设置属性的完整 .NET 类型名称，例如 `.String`、`System.Boolean`、`System.DateTime`、`System.Int32`（VB.NET\
  \ 中的 `Integer` 和 C# 中的 `int`）等。 |\n| `allowAnonymous` | 指定匿名用户是否可以写入该属性。默认值是 `false`。当你将此属性设置为\
  \ `true` 时，你还需要启用在本章稍后讨论的 `anonymousIdentification`。 |\n| `defaultValue` | 定义属性在未显式设置时的默认值。如果漏掉此属性，配置文件属性将取底层类型的默认值（例如，`String`\
  \ 为 `null`，`Int32` 为 `0` 等）。 |\n| `readOnly` | 指定配置文件属性是否可以在运行时更改。默认值是 `false`，意味着你可以读取和写入该属性。\
  \ |\n\n\n\n\n\n除了简单的属性外，你还可以创建配置组（profile groups），将其他简单属性组合在一起。\n\n## 创建配置组\n\n\
  配置组有两个不同的用途：首先，它们允许你从逻辑上对相关属性进行分组。例如，你可以创建一个名为 `Address` 的组，该组又包含 `Street`、`PostalCode`\
  \ 和 `City` 等属性。\n\n组还允许你拥有名称相同但位于不同组的属性。例如，你可以拥有两个名为 `VisitAddress` 和 `PostalAddress`\
  \ 的组，它们都包含 `Street` 和 `PostalCode` 等属性，这使得使用你的 `Profile` 对象的开发者更容易找到相关信息。\n\n要创建一个配置组，你需要在配置文件的\
  \ `<properties>` 元素中添加一个 `<group>` 元素，然后指定一个名称。随后，`<group>` 元素将包含一个或多个属性。以下示例显示了一个用于\
  \ `PostalAddress` 的配置组：\n\n```\n<properties>\n  <add name=\"FirstName\" />\n  <group\
  \ name=\"PostalAddress\">\n    <add name=\"Street\" />\n    <add name=\"PostalCode\"\
  \ />\n    <add name=\"City\" />\n    <add name=\"Country\" />\n  </group>\n</properties>\n\
  ```\n\n你可以在 `<properties>` 标签内拥有多个组，但组只能有一层。这意味着你不能将 `<group>` 元素嵌套在另一个 `<group>`\
  \ 或 `<add>` 元素中。\n\n## 使用非标准数据类型\n\n除了之前列出的 `String`、`DateTime` 和 `Int32` 数据类型外，你还可以使用自定义类型（例如在\
  \ `App_Code` 文件夹中定义）。\n\n与内置 .NET 类型一样，你需要使用完全限定名来引用你的类型，这包含了命名空间和类名。假设你有一个名为 `Preference`\
  \ 的类型，它包含与用户偏好相关的各种属性（在此示例中实现为自动属性）。要将此类型包含在配置中，你需要将其封装在一个命名空间中：\n\nVB.NET\n\n```\n\
  Namespace PlanetWrox\n  Public Class Preference\n    Public Property FavoriteColor\
  \ As String\n    ' 其他属性放在此处\n  End Class\nEnd Namespace\n```\n\nC#\n\n```sharp\n\
  namespace PlanetWrox\n{\n  public class Preference\n  {\n    public string FavoriteColor\
  \ { get; set; }   \n    // 其他属性放在此处\n  }\n}\n```\n\n然后你在 `<add />` 元素中如下引用该类型：\n\
  \n```\n<add name=\"Preferences\" type=\"PlanetWrox.Preference\" />\n```\n\n在配置设置中，需要使用不同语法来引用类型的情况是当你使用泛型时。第\
  \ 5 章讨论了如何使用泛型通过字符串 `List` 来存储角色名称。这里是你在该章节中看到的代码的快速回顾：\n\nVB.NET\n\n```vb\nDim\
  \ roles As New List(Of String)\n...\nroles.Add(\"Members\")\n```\n\nC#\n\n```sharp\n\
  List<string> roles = new List<string>();\n...\nroles.Add(\"Members\");\n```\n\n\
  要为配置提供一个泛型 `List` 类型的属性，你需要使用一些特殊语法。`Web.config` 中的以下设置创建了一个名为 `FavoriteGenres`\
  \ 的配置属性，它在 VB.NET 中将用户喜欢的流派存储为 `List (Of Integer)`，在 C# 中存储为 `List<int>`：\n\n```\n\
  <add name=\"FavoriteGenres\"\n     type=\"System.Collections.Generic.List`1[System.Int32]\"\
  \ />\n```\n\n`type` 属性的第一部分看起来很正常。`List` 类位于 `System.Collections.Generic` 命名空间中，因此在这里也指定它是是有合理的。然而，在类名（`List`）之后你看到了\
  \ `` `1 ``。这不是拼写错误，而是 .NET 在纯文中引用泛型类型的方法。要定义基于泛型类型的属性，你需要使用反引号（`` ` ``）后跟一个数字 `1`。反引号通常位于键盘上数字\
  \ 1 键的左侧。`` `1 `` 之后是一对方括号，其中包含你想要用于列表的实际类型。在 `FavoriteGenres` 配置属性中指定的类型映射到这些 VB.NET\
  \ 和 C# 对应项：\n\nVB.NET\n\n```vb\nDim FavoriteGenres As New List(Of Integer)\n```\n\
  \nC#\n\n```sharp\nList<int> FavoriteGenres = new List<int>();\n```\n\n你将在接下来的练习中看到如何使用此属性以及其他配置属性。首先，你将在下一个“尝试一下”中学习如何在\
  \ `Web.config` 中配置 Profile。随后的练习将向你展示如何处理这些属性，以及如何使用 `List` 类的各种方法。\n\n### 使用 Profile\n\
  \n正如你在上一节中看到的，写入配置是非常简单的。要更改像 `FirstName` 这样的属性，只需要一行代码。配置会跟踪你所做的更改，并在必要时在 `EndRequest`\
  \ 期间自动保存更改。从配置读取同样简单；你只需要访问它的属性之一。以下代码段显示了如何将配置中的第一个名字填充 `TextBox`：\n\nVB.NET\n\n\
  ```vb\nFirstName.Text = Profile.FirstName\n```\n\nC#\n\n```sharp\nFirstName.Text\
  \ = Profile.FirstName;\n```\n\n获取组中的属性几乎完全相同。要访问上一个示例中讨论的 `Street` 属性，你需要这段代码：\n\
  \nVB.NET\n\n```vb\nPostalAddressStreet.Text = Profile.PostalAddress.Street\n```\n\
  \nC#\n\n```sharp\nPostalAddressStreet.Text = Profile.PostalAddress.Street;\n```\n\
  \n访问 `FavoriteGenres` 属性略有不同。由于此属性是一个集合，你不应该直接给它赋值。相反，你使用它的方法和属性来存取数据。以下示例首先清空整个列表，然后向其添加两个流派的\
  \ ID：\n\nVB.NET\n\n```vb\nProfile.FavoriteGenres.Clear()\nProfile.FavoriteGenres.Add(7)\n\
  Profile.FavoriteGenres.Add(11)\n```\n\nC#\n\n```sharp\nProfile.FavoriteGenres.Clear();\n\
  Profile.FavoriteGenres.Add(7);\nProfile.FavoriteGenres.Add(11);\n```\n\n下面的练习将向你展示如何在用户配置中存储基础数据。在随后的练习中，你将看到\
  \ `FavoriteGenres` 列表的真实世界实现。\n\n虽然示例本身非常简单，但它为更高级的场景奠定了良好的基础，即使用整数 `List` 来存储用户对某些音乐流派的偏好。然后你可以使用这个喜欢的流派列表来过滤用户真正感兴趣的评论。\n\
  \n\n\n\nProfile（个人资料）功能的配置极其简单，却非常强大。要让登录用户访问其个人资料，你只需要在 `Web.config` 中创建几个元素，ASP.NET\
  \ 运行时就会处理其余工作。但对于匿名用户呢？如果你想为那些尚未注册账户或尚未登录的访问者存储数据怎么办？对于这些用户，你需要启用 `anonymous identification`（匿名识别）。启用匿名识别后，ASP.NET\
  \ 会为你网站的每个新访问者在 `Users` 表中创建一个匿名用户。然后该用户将获得一个 cookie，该 cookie 与数据库中的匿名用户账户关联。在每次访问时，浏览器都会随请求发送该\
  \ cookie，从而使 ASP.NET 能够将用户（以及个人资料）与当前请求关联起来。\n\n要启用匿名个人资料，你需要完成两件事：开启匿名识别并修改部分或全部个人资料属性以向匿名用户开放。\n\
  \n你可以在 `Web.config` 的 `<system.web>` 标签下直接使用以下元素启用匿名识别：\n\n```\n<anonymousIdentification\
  \ enabled=\"true\" cookieName=\"PlanetWroxAnonymous\" />\n```\n\n`enabled` 属性开启该功能，`cookieName`\
  \ 属性用于为应用程序提供一个唯一的 cookie 名称，用于在客户端存储用户的 ID。\n\n启用匿名识别后，下一步是修改 `<profile>` 元素下的属性，并将它们的\
  \ `allowAnonymous` 属性设置为 `true`：\n\n```\n<add name=\"FavoriteGenres\" type=\"System.Collections.Generic.List`1[System.Int32]\"\
  \n              allowAnonymous=\"true\" />\n```\n\n现在，可以通过代码为匿名用户访问此个人资料属性了。如果你尝试为一个未登录的用户设置一个\
  \ `allowAnonymous` 属性未设置为 `true` 的个人资料属性，将得到错误。从仅限登录用户访问的页面中向这些属性写入数据由由你决定。从属性读取是可以正常运行的，尽管你会得到空值或在\
  \ `Web.config` 中指定的默认值。\n\n一旦为匿名用户启用了个人资料属性，对它们进行读取和写入的操作与处理普通个人资料属性完全相同。在本章末尾的“Exercises”（练习）部分，你将找到修改当前主题选择器的代码，使其对匿名用户和登录用户都使用\
  \ Profile。\n\n### 清理旧的匿名个人资料\n\n你可能会好奇，当关联的用户注册账户并成为注册用户时，其匿名用户的个人资料发生了什么。答案是：什么都没有发生。旧的个人资料被丢弃，用户将获得与注册账户关联的新个人资料。幸运的是，这很容易修复。每当用户从匿名用户变为身份验证用户时（即她登录时），ASP.NET\
  \ 会触发 `Profile_OnMigrateAnonymous` 事件，你可以处理该事件。你在 `Global.asax` 中处理此事件，正如你之前看到的，它用于处理应用程序或会话范围的事件代码。在该事件的处理程序内部，你可以访问同一个用户的两个个人资料：即将与用户解绑的旧匿名个人资料，以及与当前登录用户关联的新个人资料。然后你可以复制相关数据并删除旧的用户账户及其相关的个人资料数据。从那时起，你只需处理新的个人资料。虽然在\
  \ Planet Wrox 网站中未使用，但此事件处理程序是将匿名个人资料数据从旧资料复制到新资料的完美位置，如下代码所示：\n\nVB.NET\n\n```\n\
  Public Sub Profile_OnMigrateAnonymous(sender As Object,\n          args As ProfileMigrateEventArgs)\n\
  \  Dim anonymousProfile As ProfileCommon = Profile.GetProfile(args.AnonymousID)\n\
  \n  ' 只复制匿名属性\n  Profile.AnonymousProperty = anonymousProfile.AnonymousProperty\n\
  \n  ProfileManager.DeleteProfile(args.AnonymousID)\n  AnonymousIdentificationModule.ClearAnonymousIdentifier()\n\
  \  Membership.DeleteUser(args.AnonymousID, True)\nEnd Sub\n```\n\nC#\n\n```sharp\n\
  public void Profile_OnMigrateAnonymous(object sender, ProfileMigrateEventArgs args)\n\
  {\n  ProfileCommon anonymousProfile = Profile.GetProfile(args.AnonymousID);\n\n\
  \  // 只复制匿名属性\n  Profile.AnonymousProperty = anonymousProfile.AnonymousProperty;\n\
  \n  ProfileManager.DeleteProfile(args.AnonymousID);\n  AnonymousIdentificationModule.ClearAnonymousIdentifier();\n\
  \  Membership.DeleteUser(args.AnonymousID, true);\n}\n```\n\n注意，此代码使用 `Profile.GetProfile(args.AnonymousID)`\
  \ 来获取用户之前的匿名个人资料实例。这获取了用户在登录之前的个人资料引用。`args.AnonymousID` 返回匿名用户的唯一标识符，该标识已作为用户名为存储在数据库的\
  \ `Users` 表中。\n\n代码继续将现有的匿名个人资料属性从旧资料复制到新资料。在这个示例中，只复制了一个名为 `AnonymousProperty`\
  \ 的属性。然而，你可以修改代码以复制更多属性。注意，复制匿名用户无法访问的属性是没有意义的。那些类型的属性之前无法被设置过，因此没有什么可复制的。\n\n最后三行代码删除了旧的个人资料，从\
  \ cookie 中清除匿名用户 ID，最后从数据库中删除旧的匿名用户账户。当代码执行完毕，旧个人资料已成功迁移到新个人资料，所有旧的个人资料内容都已成功从数据库和用户的\
  \ cookie 中删除。\n\n`ProfileManager` 类位于 `System.Web.Profile` 命名空间（你需要导入它才能运行之前的示例），它提供了更多处理\
  \ Profile 的有用方法。例如，你可以使用 `DeleteInactiveProfiles` 删除长时间活跃用户的个人资料。关于 `ProfileManager`\
  \ 类的详细信息，请参阅此 MSDN 页面：http://tinyurl.com/ManageProfile-5。\n\n### 查看其他用户的个人资料\n\n\
  你目前看到的示例使用 Profile 访问当前用户的数据。然而，如果你需要显示其他用户的数据怎么办？例如，如果你想在 Gig Pics 相册下方显示用户的简介？在这种情况下，你将无法直接使用\
  \ `Page` 类的 `Profile` 属性，因为它提供的是当前用户的信息，而不是创建相册的用户的信息。\n\n为了解决这个问题，`ProfileCommon`\
  \ 类（`Page` 类 `Profile` 属性底层类型的基类）带有一个 `GetProfile` 方法。`GetProfile` 方法如果传递的名称存在，则从数据库中检索现有的个人资料；如果不存在，则创建一个全新的个人资料。例如，要获取名为\
  \ Carmen 的用户的个人资料，可以使用以下代码：\n\nVB.NET\n\n```\nDim theProfile As ProfileCommon =\
  \ Profile.GetProfile(\"Carmen\")\n```\n\nC#\n\n```csharp\nProfileCommon theProfile\
  \ = Profile.GetProfile(\"Carmen\");\n```\n\n创建 `Profile` 实例后，你可以像往常一样访问它的属性。以下代码将\
  \ Carmen 个人资料的 `Bio` 属性赋值给 `Label` 控件的 `Text` 属性：\n\nVB.NET\n\n```\nBioLabel.Text\
  \ = theProfile.Bio\n```\n\nC#\n\n```csharp\nBioLabel.Text = theProfile.Bio;\n```\n\
  \n\n\n能够读取他人的个人资料（profile）非常有用。你可以用它向其他用户展示个人资料的一些属性，正如在本章的最后一个练习中看到的那样。然而，你也可以使用类似的代码更新其他用户的个人资料。例如，你可以在管理部分创建一个页面，允许你管理在你的网站上注册的用户的个人资料。当你修改其他用户的个人资料时，请务必在完成后调用\
  \ `Save` 方法。正如你之前学到的，个人资料的更改通常会自动持久到数据库中。但是，这仅适用于 `current` 用户的个人资料。要更改并持久之前获取的个人资料，可以使用以下代码：\n\
  \n### VB.NET\n```vb\ntheProfile.Bio = \"New Bio for the Carmen account here\"\n\
  theProfile.Save()\n```\n\n### C#\n```sharp\ntheProfile.Bio = \"New Bio for the Carmen\
  \ account here\";\ntheProfile.Save();\n```\n\n在接下来的练习中，你将把这些内容付诸实践，显示创建特定相册的用户名称，以及该用户的简介。\n\
  \n## 实用个性化建议\n\n以下列表提供了一些个性化建议：\n\n*   不要尝试在登录页面中访问当前用户的个人资料，因为它尚未可用。个人资料是在页面生命周期早期实例化的，因此当\
  \ `Login` 控件在登录页面中验证用户时，再将该用户的个人资料与当前请求关联已经太晚了。请使用 `ProfileCommon` 的 `GetProfile`\
  \ 方法，或者重定向到另一个页面。\n\n*   仔细考虑什么应该存储在 `Profile` 中，什么内容最好存储在你自己的数据库表中。虽然 ASP.NET 用于存储个人资料的单行结构为你提供了一个简单方便的解决方案，但它并不是最高效的方案，尤其是在处理大量数据时。不要尝试在\
  \ `Profile` 中存储完整的评论或甚至相册，而应该使用你自己的数据库表。\n\n*   `Profile` 的当前实现使得你很难在自己的查询中从 `Profiles`\
  \ 表中查询数据。例如，它很难回答诸如“给我所有偏好摇滚乐的用户”之类的查询，因为所有数据都存储在单列中。为了解决这些问题，请将数据存储在你自己的表中（例如使用\
  \ Entity Framework），或者使用从 ASP.NET 官方网站 Sandbox 部分下载的不同的 Profile 存储程序：[www.asp.net/downloads/sandbox/](http://www.asp.net/downloads/sandbox/)。\n\
  \n*   花些时间审查新的 ASP.NET Identity 系统。虽然它针对的是高级场景，但了解它提供了什么是有好的，以防你需要它的某些功能。\n\n##\
  \ 总结\n\n在本章中，你学习了如何使用 ASP.NET 4.5.1 自带的 Profile 功能来存储用户相关数据。你可以使用 Profile 来跟踪已验证用户和匿名用户的数据。\n\
  \n设置个人资料是一个非常直接的操作。你需要在 `Web.config` 文件中一个 `<profile>` 元素，其中包含 `<properties>` 子元素，然后使用\
  \ `<add/>` 元素添加一个或多个属性。为了对相关属性分组，你可以使用 `<group>` 元素。\n\n设置个人资料后，可以通过 `Page` 类的 `Profile`\
  \ 属性访问其属性。这始终访问当前用户的个人资料。你对该个人资料进行的任何更改都会在 ASP.NET 生命周期结束时自动为你持久化。\n\n根据设计，个人资料属性仅对登录用户可访问。然而，你可以通过开启匿名识别来轻松更改这一点。\n\
  \n要访问与当前请求关联的其他用户的个人资料，可以使用 `GetProfile` 方法。对该个人资料进行的任何更改都不会自动持久化，因此你必须调用 `Save`\
  \ 将更改发送到数据库。\n\n现在你的页面包含越来越多的代码，错误和问题很可能会渗透到你的应用程序中。在下一章中，你将学习如何使用异常处理来避免这些问题出现在用户界面中。你还学习了如何调试代码，以便在问题发生之前修复它们。\n\
  \n## 本章你学到了什么\n\n| 特性 | 描述 |\n| :--- | :--- |\n| 匿名识别 | 一 ASP.NET 功能，允许你跟踪访问你网站的用户，即使他们还没有注册账户或未登录\
  \ |\n| ASP.NET Profile | ASP.NET 应用程序服务，允许你存储和检索有关访问你网站的用户的信息 |\n| `EndRequest`\
  \ | 由应用程序触发的事件，在 particular 事件中，个人资料的更改会被持久化到数据库中 |\n| `OnMigrateAnonymous` | ASP.NET\
  \ Profile 功能触发的事件，你可以在 `Global.asax` 中处理该事件，将匿名属性复制到新个人资料中 |\n| 个性化 | 根据用户的偏好或其他信息为用户提供定制化内容的过程\
  \ |\n| 个人资料组 | 允许你对相关的个人资料属性分组的机制 |\n| 个人资料存储程序 | 负责存储和检索个人资料相关数据的存储程序 |\n\n# 第\
  \ 18 章：异常处理、调试与跟踪\n\n## 本章你将学习到什么：\n\n*   如何编写能够检测并处理运行时发生的错误的代码，同时保护你的用户免受错误细节的影响\n\
  *   如何检测发生在生产机器上的错误，以便你采取应对措施\n*   什么是调试，以及 VS 提供了哪些调试工具\n*   当代码在开发或生产环境中运行时，可以使用哪些工具获取有关系统和代码的信息\n\
  \n## 本章 WX.COM 代码下载\n\n你可以在 [wrox.com](http://wrox.com) 的 [www.wrox.com/go/aspnet451](http://www.wrox.com/go/aspnet451)\
  \ 下载选项卡中找到本章的代码。代码位于第 18 文件夹中。\n\n\n\n\n每当你编写代码时，都有可能出现不符合预期的情况，导致代码无法编译、程序崩溃或应用程序出现其他非预期行为。出现问题的原因有很多：你在代码中引入了拼写错误、你程序运行时连接的数据库服务器突然宕机、你搞混了逻辑并不小心删除了数据库表中的所有行而不是仅仅某一行、你尝试从仍有关联行的数据库表中删除某行、你尝试向没有相应权限的文件夹写入文件、你的用户输入了错误的数据等等。\n\
  \n为了理解这些问题并思考预测、避免和处理它们的方法，你首先需要理解你的网站可能发生的不同类型的错误。一旦你理解了主要区别，本节的其余部分将讨论预防和解决问题的方法。\n\
  \n## 错误的不同类型\n\n你可以将错误大致归为以下几类：\n\n*   **语法错误 (Syntax errors)** —— 由拼写错误、缺少关键字或其他错误代码引起的错误。\n\
  *   **逻辑错误 (Logic errors)** —— 应用程序运行正常，但产生了意料之外或非预期结果的错误。\n*   **运行时错误 (Runtime\
  \ errors)** —— 导致应用程序在运行时崩溃或表现异常的错误。\n\n接下来的章节将分别讨论这些分类错误，并提供有关避免和修复它们的信息。\n\n###\
  \ 语法错误\n\n语法错误（或 `compile errors`）是最容易发现和修复的，因为它们发生在开发期间。IDE 会错误发生时提示，并且通常会在代码包含错误时阻止你运行应用程序。语法错误由简单的拼写错误、缺失或重复的关键字和字符引起。以下示例都显示了由\
  \ `compiler` 在开发阶段捕获的错误。编译器是一个程序，将你用 `VB.NET` 或 `C#` 编写的可读代码转换为可以执行的机器代码。\n\n####\
  \ VB.NET\n\n```\nmailBody = mailBody.Repalce(\"##Name##\", Name.Text)  ' Replace\
  \ 拼写错误\n\nResponse.Write()                                    ' Write 方法所需的\n  \
  \                                                  ' 参数\n                      \
  \                              ' 缺失了\n\nIf i > 10                              \
  \             ' 缺少关键字 Then\n  ' 在此处执行某些操作\nEnd If\n```\n\n#### C#\n\n```csharp\n\
  mailBody = mailBody.Repalce(\"##Name##\", Name.Text);  // Replace 拼写错误\n\nResponse.Write();\
  \                                   // 缺少 Write 方法所需的\n                        \
  \                           // 参数\n\nif (i > 10)                               \
  \         // 缺少左括号或\n                                                   // 多余的右括号\n\
  \  // 在此处执行某些操作\n}\n```\n\n编译错误始终显示在错误列表中（通过 `View ⇒ Error List` 菜单访问），对于 C# 网站，显示在图\
  \ 18-1 中。\n\n![image](img/f666-01.jpg)\n\n**图 18-1**\n\n你可以强制编译器为你提供站点中所有编译错误的最新列表。要做到这一点，从主菜单选择\
  \ `Build ⇒ Build Web Site`。当你想要强制 `VS` 重新编译整个站点时（这会慢一些，因为它也会重新编译未更改的文件），请选择 `Build\
  \ ⇒ Rebuild Web Site`。\n\n要跳转到错误位置，双击错误列表中的错误。\n\n### 逻辑错误\n\n逻辑错误通常更难发现，因为它们可以正常编译但只在执行期间发生。考虑以下示例：\n\
  \n#### VB.NET\n\n```vb\nDim fromAddress As String = \"example.com\"\nDim toAddress\
  \ As String = Name.Text\nMessage.Add(new toAddress) \n```\n\n#### C#\n\n```csharp\n\
  string fromAddress = \"example.com\";\nstring toAddress = Name.Text;\nMessage.Add(new\
  \ toAddress);\n```\n\n### 运行时错误\n\n运行时错误发生在运行时，这使得它们很难发现。假设你的网站包含一个 bug。跟踪这些错误的最佳方法是使用\
  \ `VS` 的内置调试工具。\n\n## 捕获和处理异常\n\n通常，当发生严重异常时，用户会看到错误。例如，如果你尝试向一个未运行的邮件服务器发送消息，你会得到一个提供错误详细信息的\
  \ `exception`。你得到的异常是一个类的实例，该类最终继承自 `System.Exception` 类（所有异常的基类）。存在许多异常类型，每种都有独特的用途。\n\
  \n默认情况下，此异常会冒泡到用户界面，并以所谓的“黄屏”（Yellow Screen of Death）的形式呈现，这是对 Windows 崩溃时看到的蓝屏（Blue\
  \ Screen of Death）的引用。你将在下一个练习中看到真实的例子。\n\n显然，如果你能预测异常并编写代码防止其在用户界面中出现，情况会好得多。例如，你可以向用户显示一个格式良好的消息，告知他们目前无法发送消息。\n\
  \n幸运的是，对这类场景的支持深度集成在 `C#` 和 `Visual Basic .NET` 等 .NET 语言中。在这些语言中，你可以利用 `Try Catch\
  \ Finally` 块（C# 中的 `try catch finally`），将可能抛出异常的代码封装在 `Try` 块中。\n\n当异常发生时，`Try`\
  \ 块中的剩余代码将被跳过，并可以运行 `Catch` 块中的某些代码来处理错误。你可以有多个 `Catch` 块来处理特定的异常，但只有匹配异常类型的第一个块会触发。因此，将各种\
  \ `Catch` 块从具体到通用进行排序非常重要，以便在最具体的 `Catch` 块中处理异常。\n\n`Try` 或 `Catch` 块之后可以跟一个 `Finally`\
  \ 块。`Finally` 块中的代码无论是否发生异常*始终*会被执行，因此它是放置某些清理代码的理想位置。\n\n\n\n\n`Catch` 和 `Finally`\
  \ 块都是可选的，尽管你始终至少需要其中之一。\n\n以下示例中的代码尝试发送封电子邮件，然后将 `Label` 的 `Text` 属性设置为变量 `userMessage`\
  \ 的值。注意：`myMessage` 和 `mySmtpClient` 是由示例中未显示的代码创建的。`userMessage` 变量在 `Try` 块（当代码执行成功时）或\
  \ `Catch` 块中（当发生错误时）被赋值。无论何种情况，此 `userMessage` 都会在 `Finally` 块中赋值给 `Label`：\n\n\
  ### VB.NET\n\n```vb\nDim userMessage As String = String.Empty\nTry\n  mySmtpClient.Send(myMessage)\n\
  \  userMessage = \"Message sent\"\nCatch ex As Exception\n  userMessage = \"An unknown\
  \ error occurred.\"\nFinally\n  Message.Text = userMessage\nEnd Try\n```\n\n###\
  \ C#\n\n```csharp\nstring userMessage = string.Empty;\ntry\n{\n  mySmtpClient.Send(myMessage);\n\
  \  userMessage = \"Message sent\";\n}\ncatch (Exception ex)\n{\n  userMessage =\
  \ \"An unknown error occurred.\";\n}\nfinally\n{\n  Message.Text = userMessage;\n\
  }\n```\n\n在此代码示例中，`Catch` 块被设置为处理 `System.Exception` 类型的异常，它是 .NET Framework 中所有异常的基类。此异常被发送到（或由）`ex`\
  \ 变量中的 `Catch` 块。在 C# 中，如果你不在代码中使用 `ex` 变量，可以省去它：\n\n### C#\n\n```csharp\ncatch\
  \ (Exception)\n{\n  userMessage = \"An unknown error occurred.\";\n}\n```\n\n当你认为你的代码可能会遇到多个异常时，指定特定的\
  \ `Exception` 类型的能力是非常有用的。在这种情况下，你可以为不同的 `Exception` 类型设置多个 `Catch` 块。以下代码能够处理邮件发送期间可能发生的特定\
  \ `SmtpException`，它还能够使用其通用的 `Catch` 块捕获所有其他异常：\n\n### VB.NET\n\n```vb\nTry\n  mySmtpClient.Send(myMessage)\n\
  Catch smtpException As SmtpException\n  userMessage = \"Sorry, an error occurred\
  \ while sending your message.\"\nCatch ex As Exception\n  ' Something else went\
  \ wrong.\nEnd Try\n```\n\n### C#\n\n```csharp\ntry\n{\n  mySmtpClient.Send(myMessage);\n\
  }\ncatch (SmtpException smtpException)\n{\n  userMessage = \"Sorry, an error occurred\
  \ while sending your message.\";\n}\ncatch (Exception ex)\n{\n  // Something else\
  \ went wrong.\n}\n```\n\n异常处理块的顺序非常重要。.NET 从上到下扫描 `Catch` 块列表，并仅触发第一个匹配特定类型异常的块中的代码。在前面的示例中，当发生\
  \ `SmtpException`（它是 `Exception` 的子类）时，它将被处理 `SmtpException` 类型异常的 `Catch` 块捕获。尽管\
  \ `SmtpException` 也是一个 `Exception`，但最后一个 `Catch` 块中的代码将不再被触发，因为只有匹配的 `Catch` 块会被处理。因此，如果你反转此示例中\
  \ `Catch` 块的顺序，更通用的 `Exception` 块将执行执行，而 `SmtpException` 块中的代码将永远不会运行。\n\n在下面的练习中，你将看到如何在代码中使用\
  \ `Try Catch Finally`。\n\n通过这些 `Try Catch Finally` 块，你可以编写代码来帮助处理你认为代码中可能发生的错误。将可能抛出错误的代码封装在\
  \ `Try Catch` 块中始终是一个良好的做法，这样你可以优雅地处理它。可能抛出异常的代码示例包括：\n\n*   **发送电子邮件** — 邮件服务器可能宕机，或者你可能没有权限访问它。\n\
  *   **访问数据库** — 服务器可能宕机，你可能没有访问它的权限，正如你在第 15 章中看到的，你可能会因为外键约束违反而导致错误，等等。\n*   **尝试将上传的文件写入磁盘**\
  \ — 磁盘可能已，你可能没有写入磁盘的必要权限，或者你提供了一个无效的文件名。\n\n虽然 `Try Catch` 块对于避免异常冒泡到用户界面非常有帮助，但你应该谨慎地使用它们，因为它们是有成本的。`Try\
  \ Catch` 块通常比没有它的代码运行慢，所以你不应该对于可以通过其他避免的错误使用 `Try Catch` 块。考虑以下除两个数的示例：\n\n### VB.NET\n\
  \n```vb\nDim value1 As Integer = Convert.ToInt32(ValueBox1.Text)\nDim value2 As\
  \ Integer = Convert.ToInt32(ValueBox2.Text)\nTry\n  result = value1 / value2\n \
  \ ResultLabel.Text = result.ToString()\nCatch ex As DivideByZeroException\n  ResultLabel.Text\
  \ = \"Sorry, division by zero is not possible.\"\nEnd Try\n```\n\n### C#\n\n```csharp\n\
  int value1 = Convert.ToInt32(ValueBox1.Text);\nint value2 = Convert.ToInt32(ValueBox2.Text);\n\
  try\n{\n  result = value1 / value2;\n  ResultLabel.Text = result.ToString();\n}\n\
  catch (DivideByZeroException)\n{\n  ResultLabel.Text = \"Sorry, division by zero\
  \ is not possible.\";\n}\n```\n\n在此代码示例中，`Catch` 块被设置为处理 `DivideByZeroException`\
  \ 类型的异常。此异常被发送到（或由）`ex` 变量中的 `Catch` 块捕获。在 C# 中，如果你不在代码中使用 `ex` 变量，可以省去它：\n\n###\
  \ VB.NET\n\n```vb\nIf value2 <> 0 Then\n  result = value1 / value2\n  ResultLabel.Text\
  \ = result.ToString()\nElse\n  ResultLabel.Text = \"Sorry, division by zero is not\
  \ possible.\"\nEnd If\n```\n\n### C#\n\n```csharp\nif (value2 != 0)\n{\n  result\
  \ = value1 / value2;\n  ResultLabel.Text = result.ToString();\n}\nelse\n{\n  ResultLabel.Text\
  \ = \"Sorry, division by zero is not possible.\";\n}\n```\n\n当然，如果你在页面上放置一个 `CompareValidator`\
  \ 会更好，确保 `Value2` 永远不会为零。第 9 章解释了如何使用该控件。\n\n虽然 `Try Catch` 块对于避免异常冒泡到用户界面非常有帮助，但你应该谨慎地使用它们，因为它们是有成本的。`Try\
  \ Catch` 块通常比没有它的代码运行慢，所以你不应该对于可以通过其他避免的错误使用 `Try Catch` 块。\n\n### 全局错误处理与自定义错误页面\n\
  \n为了防止用户看到异常的详细信息，你应该为他们提供一个友好的错误页面。幸运的是，ASP.NET 允许你定义*自定义错误页面*：当发生异常时显示给 ASPX 页面。你可以将不同类型的错误（服务器错误、找不到页面、安全问题等）映射到不同的页面。\n\
  \n你在 `Web.config` 文件的 `customErrors` 元素中定义要显示的错误页面或页面。一个典型的元素如下：\n\n```xml\n<customErrors\
  \ mode=\"On\" defaultRedirect=\"~/Errors/Error500.aspx\"\n                     \
  \   redirectMode=\"ResponseRewrite\">\n  <error statusCode=\"404\" redirect=\"~/Errors/Error404.aspx\"\
  \ />\n  <error statusCode=\"500\" redirect=\"~/Errors/Error500.aspx\" />\n</customErrors>\n\
  ```\n\n`mode` 属性决定访问者是否可以看到详细错误页面。该属性支持以下三个值：\n\n*   `On` — 当发生错误时，每个访问者始终看到自定义错误页面。\n\
  *   `Off` — 从不显示自定义错误页面，并在页面上显示完整的错误详细。\n*   `RemoteOnly` — 向本地用户（从运行网站的同一机器浏览）显示完整的错误详细信息，而所有其他用户都看到自定义错误页面。此设置允许你能够在开发期间在网站上看到错误消息，而你的用户始终看到自定义错误页面。\n\
  \n\n\n\n\n在 `customErrors` 元素的起始和结束标签之间，你定义了多个 `<error />` 元素，每个想要支持的 HTTP 状态码对应一个。之前的配置定义了两个页面：一个在请求的页面未找到（404\
  \ 状态码）时显示，另一个在发生服务器错误（500 代码）时显示。\n\n对于所有你未显式定义的其他 HTTP 状态码，使用 `defaultRedirect`\
  \ 属性来确定自定义错误页面。\n\n`redirectMode` 属性决定了新页面显示给用户的方式，将在本章稍后的部分进行讨论。\n\n虽然自定义错误页面可以保护你的用户免受异常细节的影响，但它们并不能帮助*你*获知异常的发生。这些页面的作用仅仅是隐藏真实错误，取而显示一个带有自定义错误消息的页面。为了接收这些异常的通知，你可以编写一些代码查看异常，然后向你发送封包含详细信息的电子邮件。或者，你可以编写代码将错误详情插入数据库，或将其写入文本文件。\n\
  \nASP.NET 为你提供了一个方便的中央位置来编写在异常发生时触发的代码。你需要在第 11 章中首先看到的 `Global.asax` 文件内部一个名为 `Application_Error`\
  \ 的特殊事件处理程序中编写此代码。在这个事件处理程序内部，你可以收集有关异常的相关数据，将其放入电子邮件中，并发送到你自己的收件箱。这让你获得有关网站上发生异常的详细信息，有助于尽早解决问题。你将在下一个练习中看到如何编写这些代码。\n\
  \n虽然在运行时处理和记录异常很有用，但从源上防止它们的发生显然更好。要编写尽可能少 bug 的健壮代码，你需要良好的工具来帮助你理解代码的执行情况，以便对其进行调试。VS\
  \ 带有出色的调试工具，可以帮助你完成这一过程。你将在下一节看到这些工具是什么以及如何使用它们。\n\n## 调试基础\n\n调试是在代码中寻找并修复 bug\
  \ 的过程。虽然这听起来可能很容易，但往往并非如此。某些 bug 非常明显且容易发现，因此也容易修复。另一些则要难得多，需要关于你程序执行环境的知识。Visual\
  \ Studio 带的调试工具通过让你直接访问程序或 Web 页面的内部运行机制，帮助你理解这一执行环境。\n\n在 VS 中进行调试就像打响手指停止时间。当你这样做时，除了你之外，一切都停止了，因此你可以在代码中走动、研究变量、查看对象、尝试方法，甚至执行新代码。要告诉\
  \ VS 在何处停止，你需要在代码中设置一个或多个 `breakpoints`（断点）。当断点处的代码即将执行时，VS 会停止应用程序（通常是 Web 页面、用户控件或\
  \ `App_Code` 文件夹中的代码）并将并将焦点切回 VS，以便你诊断代码及其环境。\n\n你通过在想要停止执行的代码行上按 `F9` 来设置断点。除了\
  \ `F9` 快捷键外，你也可以点击代码的边距（在图 18-6 中会出现一个大圆点），或者从主菜单中选择`调试 ⇒ 切换断点`。按下 `F9`、点击边距中的相同位置或再次选择菜单项都会切换断点的存在状态。要清除整个网站中的所有断点，请按\
  \ `Ctrl+Shift+F9`。\n\n![image](img/f683-01.jpg)\n\n**图 18-6**\n\n为了让你了解调试是如何工作的以及它能如何帮助你，下面的练习将向你展示调试的基本操作。本章的后续部分将为你详细介绍随\
  \ VS 附的许多调试工具和窗口。\n\n尽管调试数据提示（data tips）看起来很有用，但它们只是丰富的调试功能的一小部分。在下一节中，你将获得 VS 附的所有调试工具的概述。\n\
  \n## 调试工具支持\n\n通过许多快捷键和菜单项，VS 让你可以在正在调试的代码中移动，提供逐行执行代码或一次性执行较大代码块的选择。此外，IDE 为你提供了许多窗口，让你能够诊断和更改执行环境，包括变量在运行时的值。你将首先看到如何在代码中移动，随后是对许多调试窗口的讨论。\n\
  \n### 在已调试的代码中移动\n\n当你的代码在断点处停止时，你可以可以使用许多快捷键来决定下一步做什么。下表列出了最常用的快捷键。\n\n| **按键**\
  \ | **描述** |\n| :--- | :--- |\n| `F5` | 按此键开始调试，如上一个练习所示。在调试期间按此键，代码将继续执行直到遇到下一个断点，或所有代码执行完毕。\
  \ |\n| `F11` | 按此键执行当前行，并在可能的情况下步入被调用的成员。你将在稍后部分看到它是如何工作的。 |\n| `F10` | 按此键执行当前行，但不进入被调用的代码，除非该代码本身包含断点。\
  \ |\n| `Shift+F11` | 按此组合键完成当前代码块中的代码并返回到最初调用它的代码。 |\n| `Shift+F5` | 按此组合键停止调试。\
  \ |\n| `Ctrl+Shift+F5` | 按此组合键重启调试。 |\n\n除了这些快捷键外，你还可以使用图 18-10 所示的调试工具栏，它提供了类似的功能。\n\
  \n![image](img/f686-01.jpg)\n\n**图 18-10**\n\n该工具会在开始调试时自动出现，如果没有出现，请右键点击现有的工具栏并选择调试。要使用工具栏开始调试，请点击标准栏上带有箭头的按钮。\n\
  \n当你在 VS 中调试代码时，有许多调试窗口可以使用，将在下一节中讨论。\n\n### 调试窗口\n\n许多调试窗口允许你观察应用程序中的变量，甚至在运行时更改它们。此外，它们还提供有关你在应用程序中的位置以及之前执行了哪些代码的信息。所有这些信息都有助于理解应用程序的执行流。\n\
  \n通过`调试 ⇒ 窗口`菜单选项访问所有调试窗口。并不是所有窗口在 Visual Studio Express 版本中可用。此外，为了访问大多数窗口，应用程序必须处于调试模式。接下来将介绍不同的窗口。在后面的练习中，你有机会操作它们，以便理解如何使用它们以及它们为什么有用。\n\
  \n#### 变量\n\n了解变量的值对于理解你的应用程序至关重要。为了帮助你，VS 提供了三个常用的调试窗口。所有这些窗口都支持在运行时更改变量的值，允许你使用数据提示深入研究对象，并允许你复制和粘贴数据以便他处使用。\n\
  \n##### 监窗口\n\n这可能是你需要关注的最重要的窗口。它允许你观察感兴趣的变量并对其进行深入研究。图 18-11 显示了监视窗口正在观察 Calculator\
  \ 页面使用的 `value1` 变量，同时 `value2` 变量正在添加到列表中。\n\n![image](img/f687-01.jpg)\n\n\n\n\
  \n\nFIGURE 18-11\n\n你可以通过几种不同的方式将变量添加到监视（Watch）窗口中。首先，你可以点击一下监视窗口，然后开始输入变量名。你可以按\
  \ `Ctrl+Space` 调出 IntelliSense 列表，从而轻松完成变量名。或者，你可以在代码编辑器中的变量上点击右键，并选择 `Add Watch`（添加监视）。最后，你可以在代码编辑器中高亮一个变量，然后将其拖入监视窗口。\n\
  \n当你的变量在监视窗口中时，你可以更改它们的值来影响代码的执行。例如，你可以将 `value1` 变量的值改为不同的数字，从而改变计算结果。要更改值，请双击监视窗口值列中的该值。或者，右键点击监视的变量并选择\
  \ `Edit Value`（编辑值）。\n\n除了显示变量值之外，你还可以使用监视窗口执行代码。例如，你可以对 `value1` 变量调用 `ToString()`\
  \ 来查看它的字符串表示是什么样的。要执行此操作，双击监视窗口中的变量名使其变为可编辑状态，如图 18-12 所示添加 `.ToString()`，然后按回车。\n\
  \n![image](img/f688-01.jpg)\n\nFIGURE 18-12\n\n你不限于在监视窗口调用 `ToString`。大多数产生值的表达式都可以在这里执行，但有一些例外（例如\
  \ LINQ 查询）。然而，稍后讨论的立即（Immediate）窗口更适合即时执行代码。\n\n除了监视窗口，还有自动（Auto）和本地（Locals）窗口。它们的工作方式与监视窗口相似。\n\
  \n### Autos 窗口\nAutos 窗口仅在 Visual Studio 的商业版中可用，Express 版不支持。因为它与监视窗口非常相似，所以这并不是问题。Autos\
  \ 窗口显示当前和上一个代码语句使用的变量，并在逐步执行代码时自动更新。\n\n### Locals 窗口\nLocals 窗口也与监视和自动窗口类似，但 Locals\
  \ 窗口显示的是当前作用域内的所有变量（它们可以被当前正在执行的代码“访问”）。这是一个非常有用的窗口，因为它向你显示所有相关变量，而不需要你手动添加它们。\n\
  \n### 其他窗口\n除了观察变量的窗口，VS 还有几个其他实用的窗口。\n\n#### Breakpoints 窗口\nBreakpoints 窗口让你对整个网站代码中设置的所有断点有一个概述。遗憾的是，此窗口在\
  \ Express 版中不可，因此你必须通过查看实际代码来手动查找断点。\n\n#### Call Stack 窗口\nCall Stack 窗口提供了有关代码执行或调用顺序的信息。从一段代码到另一段代码的每次调用都放置在一个*调用栈（*stack\
  \ of calls*）上，你可以在其中进行导航。起初看起来有点神秘，但一旦你理解了它的工作原理，就能非常轻松地在代码中跳转。图 18-13 显示了 `Calculator`\
  \ 类中 `Add` 方法内部的调用栈窗口。\n\n![image](img/f689-01.jpg)\n\nFIGURE 18-13\n\n在高亮行中，你可以看到\
  \ `Calculator.Add` 是当前激活的代码。紧随它下方的是 `CalculateButton_Click`，这是 Calculator 页面中调用\
  \ `Add` 方法的事件处理程序。双击调用栈窗口中的行将带你进入相应的代码位置。底部你会看到 [External Code]（外部代码），它指的是不属于你网站的执行代码，例如执行来自\
  \ .NET Framework 的代码。要展开 [External Code] 项目查看其内容，请右键点击调用栈窗口并选择 `Show External Code`（显示外部代码）。\n\
  \n#### Immediate 窗口\n最后一个有趣的调试窗口是 Immediate 窗口。此窗口允许你像在页面中编写代码那样的执行代码。你可以使用此窗口测试表达式、查看函数返回什么值等。例如，当你处于调试模式时，可以在立即窗口中输入以下命令：\n\
  \nVB.NET\n```\n? New Calculator().Add(3, 4)\n```\nC#\n```\n? new Calculator().Add(3,\
  \ 4);\n```\n问号用于输出到立即窗口。代码随后会实例化一个新的 `Calculator` 实例，并直接将值 `3` 和 `4` 传递给其 `Add`\
  \ 方法。代码执行后 `Add` 方法返回 `7`，然后打印在立即窗口中。\n\n这个窗口非常适合快速测试代码。你不需要在页面中编写你想要测试的代码，可以直接在立即窗口中输入它并查看输出。\n\
  \n在接下来的“尝试一试”中，你看到这些调试窗口投入工作。\n\n除了在服务器端调试代码外，VS 还为调试客户端 JavaScript 提供了卓越的支持。\n\n\
  ## 调试客户端脚本\n\n到目前为止，你已经使用调试工具来调试 ASPX 页面和代码后部（Code Behind）。然而，这并不是全部。VS 也对调试客户端\
  \ JavaScript 有着很好的支持。调试客户端 JavaScript 需要你使用 Internet Explorer，且在其他浏览器上无法正常工作。在 VS\
  \ 中调试客户端 JavaScript 的酷之处在于，你已经知道如何操作它。你可以使用在本章中看到的相同工具来调试服务器端和客户端代码。\n\n### 使用页面检查器进行调试\n\
  \n\n\n\n\n页面检查器（Page Inspector）是一个运行在 Visual Studio 内部的诊断工具，它在浏览器、ASP.NET 运行时和源文件之间带来了统一的体验。Page\
  \ Inspector 与 Visual Studio 一起提供，因此你不需要进行任何操作即可使用。\n\n虽然接下来的练习将向你展示 Page Inspector\
  \ 提供的许多功能，但这里是如何使用它的简要描述：\n\n* 你可以在标准工具栏（Standard toolbar）上的调试目标下拉菜单中选择其作为目标浏览器来启动\
  \ Page Inspector。然后，你可以像往常一样使用 `F5` 或 `Ctrl+F5` 启动你的站点。\n* Page Inspector 会以浏览器窗口的形式显示在\
  \ IDE 中（这样你可以看到页面的外观），并带有多个用于诊断代码代码的工具窗口。\n* 加载后，你可以使用 Page Inspector 的 `Inspect`\
  \ 按钮来查看页面中提供的各种元素，例如导航元素、按钮、图像等。\n* 当你的鼠标悬停在 Page Inspector 中的元素上时，代码编辑器窗口将更新为贡献你正在检查的\
  \ HTML 的文档预览。正如本节引言中所提到的，这可能是一个主页（master page）、内容页（content page）、用户控件（user control）等。\n\
  * 你可以在 VS 中对这些文档进行更改，然后刷新 Page Inspector 以看到它们显示在最终页面中。\n* Page Inspector 还可以帮助你找到\
  \ CSS 文件中的 CSS 规则，无论它们定义在主题文件夹中还是自定义文件夹中。\n\n如果你曾经用过 Firebug（针对 Firefox）或 IE 或 Chrome\
  \ 开发者工具，其中一些内容可能听起来很熟悉。这些工具也允许你检查页面中的 HTML 元素并查看相关的 CSS。Page Inspector 的不同之处且非常特殊之处在于，它能够将最终的\
  \ HTML 回关联到原始 ASP.NET 源文件。这反过来允许在 IDE 中编辑文件，进行更改并预览结果变得轻而易举。\n\n你将在下一节的练习中详细了解 Page\
  \ Inspector 及其功能 set。\n\n### 使用 Page Inspector\n\n开始使用 Page Inspector 非常简单。因为它是随\
  \ VS 一起提供的，所以已经准备就绪。不过，它有几个前提条件。首先，你需要在机器上安装了 Internet Explorer 9 或更高版本。其次，你的站点需要在\
  \ .NET 4 或更高版本上运行。由于 Planet Wrox 示例站点运行在 .NET 4.5.1 上，因此这不是问题。第三，Page Inspector\
  \ 需要在你的机器上正确安装并注册。因为这是在安装 VS 期间完成的，这也不是问题。最后一个前提条件是你的站点需要在调试模式下运行，或者你需要在 `Web.config`\
  \ 中添加一个特殊键来启用 Page Inspector。你在本章稍早之前已经启用了 Planet Wrox 站点的调试，这意味着你不需要做其他操作即可让 Page\
  \ Inspector 正常工作。对于你未启用调试但仍想使用 Page Inspector 的情况，请启用调试或在 `Web.config` 的 `appSettings`\
  \ 元素中添加以下键值：\n\n```\n<appSettings>\n  <add key=\"PageInspector:ServerCodeMappingSupport\"\
  \ value=\"Enabled\"/>\n</appSettings>\n```\n\n如果未启用调试或不存在此键，当你调用 Page Inspector\
  \ 时，VS 会给出一个警告，并提议通过开启调试来自动解决问题。\n\n你将在接下来的练习中看到如何使用 Page Inspector。\n\n## 使用 BROWSER\
  \ LINK 进行跨浏览器测试\n\n在本书的早些章节中，我提到过在许多不同的浏览器中测试你的网站是重要的。尽管大多数现代浏览器渲染页面的方式几乎相同，但差异仍然存在，这可能导致页面在某个浏览器中看起来很好，但在另一个浏览器中显示不佳甚至损坏。在\
  \ VS 2012 之前的版本中，跨浏览器测试主要是手动任务；你通过按下 `Ctrl+F5` 或 `F5` 启动网络浏览器，然后复制站点 URL，启动另一个浏览器并粘贴\
  \ URL。Visual Studio 2012 引入了一项重大改进，允许你选择多个启动浏览器：点击标准工具栏上浏览器旁边的向下箭头，选择“使用...打开”，然后在选择多个浏览器时按住\
  \ `Ctrl` 键。第 3 章展示了如何操作。Visual Studio 2013 通过 Browser Link 进一步改进了这一点，如下所示。\n\n###\
  \ 介绍 Browser Link\n\nBrowser Link 允许 Visual Studio 与任何显示你站点页面的打开浏览器进行通信。当启用 Browser\
  \ Link 时（默认开启），当你在 Visual Studio 中更改页面内容时，可以让 Visual Studio 向所有打开的浏览器发送消息以刷新页面。这是一个非常节省时间的方法，因为所有浏览器的重新加载都是完成的。Browser\
  \ Link 的工作原理是在页面底部注入 JavaScript 库的链接。该 JavaScript 库在底层使用 `SignalR` 与 Visual Studio\
  \ 通信。`SignalR` 实现了服务器与客户端之间的双向通信，可用于聊天和实时推送通知等实时通信解决方案。Visual Studio 使用它来通知浏览器站点的变化。你可以在\
  \ ASP.NET 网站 [www.asp.net/signalr](http://www.asp.net/signalr) 上学习更多关于 `SignalR`\
  \ 的知识，尽管使用 Browser Link 不需要任何 `SignalR` 知识；正如下一节将所示，使用 Browser Link 非常简单。\n\n###\
  \ 使用 Browser Link\n\n由于 Browser Link 默认开启，你不需要做任何操作即可使用它。你只需启动一个或多个浏览器，在 Visual\
  \ Studio 中更改你的站点，然后按 `Ctrl+Alt+Enter` 刷新窗口。你可以通过点击标准工具栏上刷新图标旁边的箭头来开启 Browser link。使用同一个菜单，你还可以刷新所有浏览器（作为\
  \ `Ctrl+Alt+Enter` 快捷键的替代）并打开 Browser Link Dashboard。Browser Link Dashboard 允许你手动刷新单个浏览器（通过点击其名称）。它还列出了在使用\
  \ Browser Link 之前需要解决的问题（例如在 `Web.config` 文件中启用调试选项）。\n\n在下一个练习中，你将看到如何使用 Browser\
  \ Link。\n\n## 跟踪你的 ASP.NET 页面\n\n如果没有跟踪，在运行时查找变量、对象的值、代码遵循的执行路径等在最好的情况下也是困难的。你可能会在页面上添加一个\
  \ `Label` 控件，然后向它写入信息：\n\nVB.NET\n\n```\nDim value2 As Double = Convert.ToDouble(ValueBox2.Text)\n\
  DebugLabel.Text &= \"The value of value2 = \" & value2.ToString() & \"<br />\"\n\
  ```\n\nC#\n\n```csharp\ndouble value2 = Convert.ToDouble(ValueBox2.Text);\nDebugLabel.Text\
  \ += \"The value of value2 = \" + value2.ToString() + \"<br />\";\n```\n\n虽然这种方法可行，但非常繁琐。首先，你需要编写大量代码来使其工作。其次，你在页面中留下了一个难看的\
  \ `Label` 控件，在调试或跟踪结束后你不应该忘记删除它。最后，当你准备好时，应该删除所有设置 `DebugLabel` 标签的代码。你可以通过将 `Label`\
  \ 控件的 `Visible` 属性设置为 `False` 来偷个懒，但你仍然会忍受为 `Label` 控件赋值文本的性能损失。\n\n\n\n\n\nASP.NET\
  \ 中的追踪（Tracing）解决了所有这些问题。它允许你的页面、控件和代码将信息写入一个名为 `trace` 的中心位置，然后可以在浏览器中显示。追踪功能是内置在\
  \ ASP.NET 框架中的，这意味着你不需要任何手动编码即可使用它。此外，你还可以向 trace 中添加你自己的信息。在接下来的章节中，你将看到如何使用内置的追踪功能，获取有关页面的丰富信息。在稍后的练习中，你将看到如何向\
  \ trace 中添加你自己的信息。\n\n## 使用标准追踪功能\n\n无需花费大量精力，你就可以获得关于页面执行方式的良好信息。你只需要为你的页面启用追踪即可。你可以在页面级或站点级进行此操作。如果从页面级启用追踪，你可以选择一个或多个你想要追踪的特定页面。如果你想同时查看多个页面，则应用程序级追踪会非常有用。这可以帮助你找到网站中运行缓慢的页面。\n\
  \n### 针对单个页面进行追踪\n\n要在页面中启用追踪，你需要将 `Page` 指令中的 `Trace` 属性设置为 `true`：\n\n```\n<%@\
  \ Page ........ Trace=\"true\" %>\n```\n\n当你运行一个启用追踪的页面时，会在页面底部获得一个长详情列表。图 18-32\
  \ 显示了你在本章中使用的计算器演示页面的 ASP.NET 追踪。\n\n![image](img/f705-01.jpg)\n\n**图 18-32**\n\n\
  追踪提供了许多关于当前页面的细节。在顶部，你可以找到请求详情的摘要，包括当前日期和时间、检索此页的方法（GET 或 POST）以及状态码（图 18-32 中的状态码\
  \ 200 表示成功）。\n\n下方是 Trace 信息部分。当你启用它时，ASP.NET 的 `Page` 类会将信息写入 trace。这与你在第 15 章中编写的演示页面类似，该页面会在生命周期期间触发的众多事件向\
  \ `Label` 控件写入内容。对于你看到的每一行追踪，都会看到一条消息、它所属的类别以及两个时间。第一个时间列记录了从处理第一条追踪消息开始经过的秒数。第一条追踪消息出现在列表顶部。第二个时间列记录了处理当前追踪消息与上一条追踪消息之间经过的秒数。\n\
  \n默认情况下，数据按时间排序，按照事件发生的顺序排列。你也可以通过将 `TraceMode` 从 `SortByTime` 更改为 `SortByCategory`\
  \ 来按类别排序（有关类别的更多信息请参见向 trace 中添加自定义信息的章节）：\n\n```\n<%@ Page ........ Trace=\"true\"\
  \ TraceMode=\"SortByCategory\" %>\n```\n\n在页面稍靠下的位置（图 18-32 中不可见），你会看到 `control\
  \ tree`（控件树），它展示了页面中控件的分级视图及其大小。\n\n在控件树下方，你可以看到许多重要集合的详细信息，包括查询字符串（Query String）、Cookies、Form、Headers\
  \ 和服务器变量。此外，你还会看到可能存储在 Session 或 Application 状态中的信息。能够看到这些集合对于解决问题非常有帮助。例如，如果你有一个页面本应该从\
  \ cookie 中读取数据，但页面一加载就崩溃并抛出异常，你可以查看 Cookies 集合，看看页面是否收到了你预期的数据。这些集合是理解页面执行情况的宝贵工具，并能协助发现和修复代码中的错误。为了在处理异常时让追踪生效，你需要在\
  \ `Web.config` 文件中关闭自定义错误页面。请参考本章前面的“全局错误处理和自定义错误页面”章节以了解更多信息。\n\n页面级追踪意味着你需要对每个想要追踪的页面启用追踪。这也意味着你在完成后需要在每个页面上禁用它。由于这在大型网站中可能非常繁琐，ASP.NET\
  \ 还允许你追踪整个应用程序。\n\n### 追踪整个网站\n\n你可以通过更改 `Web.config` 文件中的追踪设置来为整个网站启用追踪。你通过在 `<system.web>`\
  \ 下创建一个 `<trace />` 元素来实现。下表列出了 `<trace />` 元素最重要的属性。\n\n| 属性 | 说明 |\n| :--- | :---\
  \ |\n| `enabled` | 决定是否为应用程序启用追踪。默认情况下追踪是禁用的，因此你需要显式将此属性设置为 `true`。 |\n| `traceMode`\
  \ | 决定追踪输出中项目的排序顺序。其工作原理与 `Page` 指令的 `TraceMode` 属性完全相同。 |\n| `requestLimit` | 决定\
  \ ASP.NET 保留的追踪请求数量。当达到限制时，旧的追踪记录将被自动删除，只保留最近的追踪请求。 |\n| `pageOutput` | 指定追踪信息是否显示在页面上。当设置为\
  \ `false`（默认值）时，你只能通过 `Trace.axd` 访问追踪信息，这稍后会讨论。 |\n| `localOnly` | 规定特殊的 `Trace.axd`\
  \ 处理程序是否仅可从本地访问。从安全角度考虑，最好将其设置为 `true`，这意味着外部用户无法访问追踪信息。 |\n| `mostRecent` | 决定当追踪请求达到\
  \ `requestLimit` 时是否丢弃旧的追踪记录。设置为 `false` 时，达到限制后将自动禁用追踪。 |\n\n当你启用追踪后，有两种方法可以读取追踪。当你将\
  \ `pageOutput` 设置为 `true` 时，追踪信息会附加到页面，类似于你在页面级追踪中看到的。\n\n然而，为了减少追踪的侵入性，你可以禁用 `pageOutput`，然后使用特殊文件\
  \ `Trace.axd` 请求追踪信息。这是一个虚拟文件，这意味着你在查找网站时找不到它。但是，ASP.NET 运行时知道在请求此页面时应该提供追踪信息。尽管该文件是虚拟的，但你仍然可以通过在主\
  \ `Web.config` 文件中添加 `<location />` 元素使用 ASP.NET 的 URL 安全来保护它。\n\n在下面的练习中，你将看到如何为站点启用追踪。\n\
  \n### 向追踪中添加自己的信息\n\n尽管 ASP.NET 自动追踪的信息极其有用，但你不仅限于这些信息。你还可以向追踪中添加自己的信息。\n\n你可以通过\
  \ `Trace` 类向追踪添加信息。该类提供了两个非常有用的方法：`Write` 和 `Warn`。它们的作用非常相似：向追踪中添加信息，你可以可选地将其放入自定义的类别。`Write`\
  \ 和 `Warn` 的唯一区别是，由 `Warn` 生成的消息为红色。你可以在意外情况下使用 `Warn` 方法，因为该消息会引起更多关注。\n\n在下面的练习中，你将看到如何使用\
  \ `Warn` 和 `Write` 方法简单地向追踪中添加你自己的信息。\n\n\n\n\n\n虽然在生产系统的代码中保留 `Warn` 和 `Write`\
  \ 语句似乎会影响性能，但事实并非如此。因为通过将 `Web.config` 文件中 `trace` 元素的 `enabled` 属性设置为 `false`，你可以禁用追踪，从而极大地减少了追踪带来的性能开销。\n\
  \n### 安全警告\n\n追踪（Tracing）非常有用，但在生产环境中保留追踪信息可能会导致信息泄露。因此，你应该始终通过将 `Web.config` 中的\
  \ `enabled` 属性设置为 `false` 来禁用追踪，或者至少通过将 `localOnly` 属性设置为 `true`。在第 19 章中，你将学习一种技巧，让你一次性对生产服务器上的所有站点进行此更改，从而轻松地阻止对追踪功能的访问。\n\
  \n## 实用调试技巧\n\n以下列表提供了一些实用的技巧，帮助你调试应用程序：\n\n* 永远不要在生产环境的 `Web.config` 文件中保留 `debug=\"\
  true\"`。请务必将其设置为 `false` 以提高性能。在第 19 章中，你将看到一种更好的解决方案，以确保此设置在生产服务器上绝不会被设置为 `true`。\n\
  \n* 尝试避免在 `Catch` 块中“吞掉”（swallowing）异常。你可能忍不住将代码封装在 `Try`/`Catch` 块中，然后让整个 `Catch`\
  \ 块为空。虽然这确实避免了异常在用户界面上显示，但会让调试变得极其困难。由于你无法感知问题的发生，也无法编写代码来从源头上防止错误的发生。这里的通用规则是：捕获你可以成功处理的错误，例如向用户显示消息。如果你无法在代码中处理异常，请让它向上抛出并在\
  \ `Application_Error` 事件处理程序中记录它，这样你就能知道异常发生了。\n\n* 如果你需要在 `Catch` 块中重新抛出异常，不要使用\
  \ `Throw ex`（C# 中为 `throw ex`），而应仅使用 `Throw`（C# 中为 `throw`）。当你使用 `Throw ex` 时，你很难跟踪代码在异常发生前遵循的路径，但通过使用\
  \ `Throw`，你可以保留这些信息。以下是显示两种选项的代码：\n\nVB.NET\n\n```vb\nTry\n  ...\nCatch ex As Exception\n\
  \  ' 在此处对错误进行某些操作，例如记录它\n  Throw ex  ' 坏示例；你丢失了异常的来源追踪\n  Throw     ' 好示例；转发异常\n\
  \            ' 并保留了调用堆栈\nEnd Try\n```\n\nC#\n\n```csharp\ntry\n{\n  ...\n}\ncatch\
  \ (Exception ex)\n{\n  // 在此处对错误进行某些操作，例如记录它\n  throw ex;  // 坏示例；你丢失了异常的来源追踪\n\
  \  throw;     // 好示例；转发异常\n             // 并保留了调用堆栈\n}\n```\n\n* 尽可能避免异常处理。正如你在本章看到的，从根本上避免异常要好得多（也更快）。例如，在执行除法之前检查值是否为零，可以轻松地避免\
  \ `DivideByZeroException` 异常。\n\n* 对于在 `Try`/`Catch` 块中捕获的 `Exception` 类型，要尽可能明确化。尝试避免捕获通用的\
  \ `Exception` 类型，并为预期的每个特定类型设置多个显式的 `Catch` 块。\n\n## 总结\n\n无论你的程序写得多么仔细，你的站点都可能包含某些\
  \ Bug 或在运行时抛出异常。为了尽可能的减少这些异常并构建一个运行尽可能顺畅的站点，你可以采取措施。\n\n首先，你可以使用异常处理技术，编写能够捕获你预见的异常并妥善处理它们的代码。\n\
  \n为了帮助你编写 Bug 尽可能少的代码，VS 为你提供了一套非常强大的调试工具。这种从客户端代码一直到服务器端进入你的代码进行分析和更改执行环境的能力，将是你消灭\
  \ Bug 冒险之旅中的极大助手。\n\n即使你已经对应用程序进行了彻底调试，你的站点在生产环境中仍可能出现问题，无论这些问题是与性能、逻辑错误或其他意外原因有关。在这种情况下，你可以使用\
  \ ASP.NET 追踪功能，它可以让你跟踪运行页面的信息。分析这些追踪信息可以让你在解决底层问题上大有裨益。\n\n现在你的网站已经完成，并希望没有 Bug，下一步是将其推上线。你将在下一章中学习如何部署你的\
  \ ASP.NET 网站。\n\n## 本章学到的内容\n\n| 术语 | 说明 |\n| :--- | :--- |\n| **Breakpoint (断点)**\
  \ | 你可以在代码中设置的标记，用于指示调试器在运行时停在该处 |\n| **Browser Link (浏览器链接)** | Visual Studio 的功能，允许\
  \ VS 与已打开的浏览器通信，指示它们刷新正在显示的页面 |\n| **Data tips (数据提示)** | 调试期间显示有关变量的简单或富节点数据的工具提示\
  \ |\n| **Debugging (调试)** | 在代码中寻找并修复 Bug 的过程 |\n| **Exception (异常)** | .NET 中对代码中可能发生的错误的术语\
  \ |\n| **Exception handling (异常处理)** | 一种识别和处理运行时发生错误的方法论 |\n| **Page Inspector\
  \ (页面检查器)** | Visual Studio 中集成的调试浏览器，允许你诊断和更改源代码，并查看是哪些页面和文件生成了该源代码 |\n| **Stack\
  \ trace (堆栈跟踪)** | 当前代码调用栈（堆栈）的可视化表示 |\n| **Trace (追踪)** | 允许 ASP.NET 控件和你的自定义代码在运行时向中央日志位置写入信息\
  \ |\n\n# 第 19 章：部署你的网站\n\n\n\n\n当你在开发环境中构建网站的第一个版本时，管理网站及其源代码是非常直接的。你只有一个版本的源代码，这使得维护变得非常简单。然而，一旦你将网站部署到生产环境，你就有了两个版本：一个运行在生产环境中的版本，另一个是你用于开发的版本。这使得保持两者同步变得困难。例如，你可能在生产环境中使用不同的数据库和连接字符串。你还可能为网站发送的电子邮件使用不同的邮箱地址。最后，你可能希望在开发环境中禁用从\
  \ `Global.asax` 文件发送错误邮件。如果你在将网站部署到生产服务器时直接在代码中进行所有更改，那么很有可能会在下一次更新时覆盖某些设置，从而导致意料之外的结果。\n\
  \n本节将向你展示如何让管理同一个网站的不同版本变得简单一些。你将看到如何将某些硬编码设置（例如电子邮件地址）移动到 `Web.config` 文件中。应用程序中的代码将在运行时读取这些值。此时，开发环境和生产环境之间的唯一区别就是一个配置文件，这使得在两个环境中拥有不同的设置变得简单。稍后你将看到如何让\
  \ VS 为生产环境生成 `Web.config` 文件。\n\n### 避免硬编码设置\n\n到为止，你构建的页面和用户控件在电子邮件地址等项目上使用了一些硬编码设置。例如，发送电子邮件的用户控件\
  \ `ContactForm.ascx` 使用以下代码来设置接收者和发送者信息：\n\nVB.NET\n\n```\nmyMessage.From = New\
  \ MailAddress(\"you@example.com\", \"Planet Wrox\")\nmyMessage.To.Add(New MailAddress(\"\
  you@example.com\", \"Planet Wrox\"))\n```\n\nC#\n\n```sharp\nmyMessage.From = New\
  \ MailAddress(\"you@example.com\", \"Planet Wrox\");\nmyMessage.To.Add(New MailAddress(\"\
  you@example.com\", \"Planet Wrox\"));\n```\n\n以这种方式硬编码设置会使得在不同的环境中为它们提供不同的值变得困难。每你想将网站发布到生产环境时，你都需要确保没有意外覆盖你为生产环境更改的设置。\n\
  \n幸运的是，ASP.NET 提供了一个避免此类问题的绝佳解决方案：`Web.config` 文件、表达式语法以及你用于从 `Web.config` 读取内容的\
  \ `WebConfigurationManager` 类。\n\n### Web.config 文件\n\n在本书中，你已经多次使用 `Web.config`\
  \ 文件来存储有关连接字符串、成员、角色和配置信息等内容。你还简要看到了 `<appSettings>` 元素，它允许你使用 `<add>` 元素以键值对的形式存储数据。`<appSettings>`\
  \ 元素允许你存储简单信息（如电子邮件地址），并通过其键检索该值。例如，要存储电子邮件地址，可以在 `Web.config` 文件中添加以下内容：\n\n```xml\n\
  <appSettings>\n  <add key=\"FromAddress\" value=\"webmaster@example.com\" />\n</appSettings>\n\
  ```\n\n`<appSettings>` 元素位于 `Web.config` 文件中 `<system.web>` 元素之外，但仍在父元素 `<configuration>`\
  \ 之中。\n\n显然，你需要一种方法在运行时访问 `<appSettings>` 中的数据。你可以通过几种方式实现，包括表达式语法和 `WebConfigurationManager`\
  \ 类，接文中将讨论这两者。\n\n### 表达式语法\n\n表达式语法允许你将控件属性绑定到资源，例如在 `Web.config` 的 `<appSettings>`\
  \ 元素中的资源、连接字符串、本地化资源文件以及 URL 重写场景中使用的各种路由设置。要显示来自 `<appSettings>` 元素的数据，你使用以下语法，其中\
  \ `AppSettingKeyName` 指向你在 `Web.config` 中定义的键：\n\n```xml\n<%$ AppSettings:AppSettingKeyName\
  \ %>\n```\n\n例如，要在页面的 `Literal` 控件中显示版权声明，可以在 `Web.config` 中添加以下设置：\n\n```xml\n\
  <add key=\"Copyright\" value=\"Copyright by Wrox\" />\n```\n\n然后你可以像这样在 `Literal`\
  \ 控件中显示此文本：\n\n```xml\n<asp:Literal ID=\"Copyright\" runat=\"server\" Text=\"<%$\
  \ AppSettings:Copyright %>\" />\n```\n\n为了像前面的示例那样更容易地设置 `Text` 等属性，Visual Studio\
  \ 附带了表达式编辑器（Expression Editor）。要访问此对话框，请在设计或标记视图中选择一个控件，打开其属性网，并点击 (Expressions)\
  \ 项目旁边的省略号，如图 19-1 所示。你可能会发现，在标记视图中 (Expressions) 项目并不总是显示。如果是这样，请先切换到分栏视图或设计视图。\n\
  \n![image](img/f717-01.jpg)\n\n**图 19-1**\n\n打开 `Literal` 控件的表达式对话框允许你将控件属性绑定到表达式。Visual\
  \ Studio 限制了控件属性列表，仅可以使用表达式绑定的属性。要将 `Literal` 控件的 `Text` 属性绑定到应用程序设置，首先点击对话框左侧的\
  \ `Text`，从类型下拉菜单中选择 `AppSettings`，最后从列表中选择所需的 `AppSetting`。图 19-2 显示了用于显示版权的 `Literal`\
  \ 控件的表达式对话框。\n\n![image](img/f718-01.jpg)\n\n**图 19-2](#Chapter19.xhtml_figure19-2)**\n\
  \n当你点击确定时，Visual Studio 会修改 `Literal` 控件的 `Text` 属性以便引用应用程序设置。使用表达式语法从 `Web.config`\
  \ 获取值是有用的，但可能无法涵盖所有的需求。因此，知道可以通过程序方法检索值也是好的。要这样做，你可以使用 `WebConfigurationManager`\
  \ 类。\n\n### WebConfigurationManager 类\n\n来自 `System.Web.Configuration` 命名空间的 `WebConfigurationManager`\
  \ 类提供了对存储在配置文件中的数据的访问。它对 `Web.config` 文件中的 `appSettings` 和 `connectionStrings`元素有特殊支持，只需一行代码即可从这些部分检索数据。以下代码向你展示了如何从\
  \ `<appSettings>` 元素检索之前看到的 `FromAddress` 值：\n\nVB.NET\n\n```vb\nImports System.Web.Configuration\n\
  ...\nDim fromAddress As String = WebConfigurationManager.AppSettings.Get(\"FromAddress\"\
  )\n```\n\nC#\n\n```csharp\nusing System.Web.Configuration;\n...\nstring fromAddress\
  \ = WebConfigurationManager.AppSettings.Get(\"FromAddress\");\n```\n\n`Get` 方法始终返回字符串，因此如果你期望字符串以外的其他类型，就需要对其进行转换。例如，如果你在\
  \ `Web.config` 中存储了这样的布尔值：\n\n```xml\n<add key=\"SendMailOnError\" value=\"true\"\
  \ />\n```\n\n你需要使用以下代码检索并转换该值：\n\nVB.NET\n\n```vb\nDim sendMail As Boolean =\n \
  \   Convert.ToBoolean(WebConfigurationManager.AppSettings.Get(\"SendMailOnError\"\
  ))\n```\n\nC#\n\n```csharp\nbool sendMail =\n    Convert.ToBoolean(WebConfigurationManager.AppSettings.Get(\"\
  SendMailOnError\"));\n```\n\n虽然你可以在 Web Forms 和用户控件的代码后台文件中直接访问 `WebConfigurationManager`\
  \ 类（前提是你导入了 `System.Web.Configuration` 命名空间），但我更喜欢在自定义配置类中创建静态只读属性来访问 `Web.config`\
  \ 文件以获取值。你将在下面的练习中看到如何操作。\n\n\n\n\n随着硬编码的应用程序设置移动到中央 `Web.config` 文件中，部署过程的下一步是优化你的外部\
  \ CSS 和 JavaScript 引用。\n\n## 引入打包（Bundling）和压缩化（Minification）\n\n打包和压缩化是 ASP.NET\
  \ 4.5 中新增的两个功能。这两者的设计初衷都是通过减少客户端 CSS 和 JavaScript 文件的数量和大小来提高网站的性能。通过打包，ASP.NET\
  \ 运行时会将一个或多个 CSS 或 JavaScript 文件合并为一个单独请求。这减少了网络开销，因为浏览器需要发送的请求更少了。压缩化则通过移除这些文件中无关的代码来实现。将这两种技术相结合可以极大提升你网站的性能。\n\
  \n打包和压缩化的酷之处在于，它们操作非常简单，而且几乎不需要任何代码。例如，假设你在 `Styles` 文件夹中有两个名为 `1.css` 和 `2.css`\
  \ 的 CSS 文件。如果不进行打包和压缩化，你的主页面中可能会有如下内容：\n\n```\n<link href=\"Styles/1.css\" rel=\"\
  stylesheet\" type=\"text/css\" />\n<link href=\"Styles/2.css\" rel=\"stylesheet\"\
  \ type=\"text/css\" />\n```\n\n要启用打包和压缩化，你需要将这两行更改为以下单行：\n\n```\n<link href=\"Styles/css\"\
  \ rel=\"stylesheet\" type=\"text/css\" />\n```\n\n注意，你不再需要在文件夹名后指定文件名。相反，你只需要指定文件扩展名——在这种情况下是\
  \ `css`。这会指示 ASP.NET 运行时从 `Styles` 文件夹获取所有扩展名为 `.css` 的文件，将其打包成单个响应，并通过移除空格和注释等不必要的内容进行压缩化。最终结果将流传输到浏览器，浏览器对其解释的方式与处理两个独立文件时完全相同。\n\
  \n你可以通过指定 `js` 而不是 `css` 作为文件扩展名，同样可以打包和压缩 JavaScript 文件。\n\n之前的代码示例存在一个问题：浏览器会缓存\
  \ `Styles/css` URL 的结果。即使你更改了底层的 CSS 或 JavaScript 文件，浏览器也可能继续使用旧文件。你可以通过创建一个 `StyleBundle`\
  \ 来解决这个问题，它会收集特定文件夹中的所有 CSS 文件，然后将它们渲染为单个 `<link>` 元素，并带有一个用于文件的唯一键附加到查询字符串中。只要磁盘上的文件未被修改，就会使用相同的键，这告诉浏览器继续使用文件的缓存副本是安全的。然而，一旦你更改了其中一个文件，键也会随之改变，从而导致浏览器从服务器请求包的最新副本。你将在下一个练习中看到它是如何运作的。\n\
  \n在你的 ASP.NET 网站中启用打包和压缩化是一个三步骤的过程：\n\n1. 使用 NuGet 安装 `Microsoft.AspNet.Web.Optimization.WebForms`\
  \ 包。\n2. 在 `Global.asax` 中编写一些代码来启用打包。\n3. 删除指向 CSS 和 JavaScript 文件的现有 `<link>`\
  \ 和 `<script>` 元素，并用每个文件类型指向正确源文件夹的单个控件替换它们。\n\n目前的 Planet Wrox 网站并没有从打包和压缩化中获益，因为\
  \ CSS 和 JavaScript 文件的数量很少。此外，网站的 CSS 放置在 `Themes` 文件夹中，而该文件夹不支持打包和压缩化功能。\n\n然而，为了向你展示如何在自己的网站中使用打包和压缩化（这可能会提高性能），在接下来的练习中，你将优化添加到\
  \ `Styles` 文件夹的几张样式表，以便其内容被打包和压缩化。\n\n现在你已经了解了如何通过处理 CSS 和脚本引用的方式来优化网站，下一步是发布你的网站。\n\
  \n## 准备部署\n\n在开发网站期间，你会使用 Visual Studio 自带的 `IIS Express`。虽然这个服务器非常适合本地开发，但它并不是为生产环境设计的。要将你的网站投入生产环境，你需要将其部署到运行了完整版本\
  \ `Internet Information Services` (`IIS`) 的机器上，这是微软的专业 Web 服务器。如果你使用支持 Microsoft\
  \ Web Deploy for Hosting Servers 的远程主机，你可以直接使用 Visual Studio 中的 `Publish` 命令来部署网站。如果你是自行托管且没有安装\
  \ Web Deploy，你可以将网站发布到本地文件夹，然后将其部署到你自己的 `IIS` 服务器。在本章的后面，你将看到如何在自托管的情况下安装和配置 `IIS`。\n\
  \n无论你是自托管网站还是使用外部 Web 主机，你可能在 `Web.config` 中为开发和生产环境设置不同的设置。Visual Studio 让你易于维护多个版本的配置文件——例如，针对你的开发和生产环境。然而，为了使用该功能，你需要所谓的*发布配置文件*（publishing\
  \ profile）。因此，下一节将介绍发布，稍后的部分将深入探讨维护你的配置文件。\n\n### 发布你的网站\n\n要将网站部署到生产服务器，可以直接在 VS\
  \ 中使用下表所示的部署选项。\n\n| 部署选项 | 说明 |\n| :--- | :--- |\n| 文件系统 (File System) | 允许你在开发机的本地文件系统或网络机器上创建网站副本。如果你以后想手动将文件移动到生产服务器，或者你的生产服务器可以通过本地网络访问，则此选项非常有用。\
  \ |\n| FTP 站点 (FTP Site) | 允许你使用 FTP 直接向远程服务器发送组成 Web 应用程序的文件。 |\n| Web Deploy |\
  \ 允许你使用 Web Deploy 将组成 Web 应用程序的文件发送到远程 IIS 服务器。要使用此选项，远程服务器需要安装 Web Deploy for\
  \ Hosting Servers。许多提供商都支持此选项，这使得发布更改非常方便。请咨询你的提供商以查看是否支持此选项以及所需的连接详情。 |\n| Web\
  \ Deploy 包 (Web Deploy Package) | 允许创建一个包含所有网站文件的包（ZIP 文件），管理员可以安装到安装了 IIS 和 Web\
  \ Deploy for Hosting Servers 的服务器上。更多信息，请参阅 [`bit.ly/1ckGqri`](http://bit.ly/1ckGqri)。\
  \ |\n\n在发布网站时你可以选择这些选项，正如你在下一个练习中所所示。\n\n\n\n\n如果你查看你目前为止一直在使用的 `Web.config` 文件，可能会发现有几个设置在你的生产服务器上是不同的。例如，你的连接字符串在生产服务器上很可能不同，邮件服务器的设置也是如此，甚至可能在本章早期你添加的单个电子邮件地址也不同。为了避免覆盖生产服务器上的更改，开发者通常会跳过将\
  \ `Web.config` 部署到生产服务器，然后手动更新该文件中的设置。然而，这并非理想状态，因为你可能会忘记在生产服务器上添加你在开发环境中已过的设置。为了解决这个问题，微软引入了\
  \ Web.config 转换（Web.config Transformations），这种机制根据项目中的主 `Web.config` 生成一个 `Web.config`\
  \ 文件，但针对生产服务器（或其他环境，如测试服务器）特定的设置进行了调整。\n\n为了使用 Web.config 转换，你需要向项目添加一个或多个额外的 `.config`\
  \ 文件。这些文件根据你之前学习如何创建的发布配置文件（publish profiles）命名。当你使用之前看到的“发布 Web”（Publish Web）向导发布网站时，Visual\
  \ Studio 会获取此额外的配置文件并与主 `Web.config` 文件合并，从而为发布 Web 向导所的目标环境生成自定义的 `Web.config`\
  \ 文件。在该文件中，你只需添加与你的生产服务器不同的元素，例如数据库和电子邮件设置。然后，通过特殊的 Web.config 转换语法，你可以告诉发布机制你希望如何将这些数据合并到最终的\
  \ `.config` 文件中。要它是如何工作的，请看以下示例，它从 `<compilation>` 元素中删除了 `debug` 属性：\n\n```\n<compilation\
  \ xdt:Transform=\"RemoveAttributes(debug)\" />\n```\n\n注意 `xdt:Transform` 属性；它告诉执行转换的代码在生成最终\
  \ `.config` 文件时移除 `debug` 属性，同时保留所有其他属性。因此，如果你的 `Web.config` 中的原始 `<compilation>`\
  \ 元素如下所示：\n\n```\n<compilation debug=\"true\" targetFramework=\"4.5.1\">\n```\n\n\
  那么在最终文件中它将变成如下所示：\n\n```\n<compilation targetFramework=\"4.5.1\">\n```\n\n通过这种方式，生产服务器上的调试始终关闭状态，从而提高了性能。\n\
  \n转换语法还支持其他选项。下表列出了你最经常使用的选项。要查看所有选项的完整列表，请查看 Web.config 转换的 MSDN 文档 [`bit.ly/79XVXE`](http://bit.ly/79XVXE)。\n\
  \n| 语法 | 描述 |\n| :--- | :--- |\n| `Locator=\"Match(name)\"` | 根据名称定义的属性在节中查找元素。通常与\
  \ `xdt:Transform=\"SetAttributes\"` 一起使用，以覆盖该元素的属性。 |\n| `Transform=\"SetAttributes\"\
  ` | 仅更新元素中定义的属性，保留源 `Web.config` 中的属性不变。 |\n| `Transform=\"RemoveAttributes\"` |\
  \ 从源元素中移除指定的属性，保持其他属性不受影响。你可以通过用逗号分隔来定义多个属性。 |\n| `Transform=\"Replace\"` | 将原始元素替换为转换文件中指定的元素。\
  \ |\n| `Transform=\"Insert\"` | 将转换文件中定义的元素作为所选元素或元素的同级节点添加。 |\n\n你将在下一个练习中看到如何创建转换文件。\n\
  \n现在你已经有了网站的纯洁副本，下一步是将文件移动到你的生产服务器上。如果你的主机支持 FTP，你可以使用 FTP 将文件复制到远程服务器。如果你想在你自己管理的服务器上托管网站，则需要配置\
  \ IIS（微软的 Web 服务器）。安装和配置 IIS 是下一节的主题。\n\n# 在 IIS 下运行你的网站\n\n到目前为止，你一直在使用 Visual\
  \ Studio 自带的 IIS Express 来调试和测试你的应用程序。然而，由于对该服务器的请求限制为来自本地主机的请求以尽量减少安全影响，你需要使用大多数主要\
  \ Windows 版本都带的完整版 IIS。要让你的网站在 IIS 下运行，你需要执行以下步骤：\n\n1. 安装并配置 IIS。\n2. 安装并配置 .NET\
  \ Framework 4.5.1。\n3. 配置安全设置。\n\n根据系统的当前状态，这些操作可能是可选的。在接下来的章节中，你将看到如何执行这些步骤。\n\n\
  ## 安装配置 Web 服务器\n\n尽管 IIS 带有大多数 Windows 版本，但它默认并未安装，因此你需要先进行安装。你还需要确保你的 Windows\
  \ 版本支持 IIS。虽然 Windows 7 和 8 的 Starter 和 Home Basic 版本带有 IIS 的部分组件，但你无法在它们上运行 ASP.NET\
  \ 页面，因此你至少需要 Home Premium（家庭增强）。在基于服务器的 Windows 版本上，完全支持 IIS。如果你使用外部托管公司托管网站，可以跳过关于安装\
  \ IIS 的后续章节。\n\n要在你的 Windows 机器上安装和配置 IIS，你需要以管理员身份登录。如果你用于登录机器的账户没有管理员权限，则需要要求你的管理员为你安装并配置\
  \ IIS。\n\n除了安装 IIS 之外，你还会看到如何在 IIS 中创建和配置网站。由于 Windows 下安全机制的工作，除非你更改 Windows 下某些安全设置，否则你的网站在配置\
  \ IIS 后可能无法立即运行。你将在“理解 IIS 安全”以及“配置文件系统”章节中看到如何操作。\n\n如果你已经安装了 SQL Server 2012 Express，将更容易测试你的\
  \ IIS 设置。如果你按照第 12 章的练习操作的就是这种情况。如果你还没有安装 SQL Server 2012 Express，请参考第 12 章中的“安装\
  \ SQL Server 2012 Express”。如果你拥有商业版 SQL Server，或者 SQL Server 在远程机器上，请特别注意本章中的“移动数据”以及附录\
  \ B。\n\n### 确保安装 IIS\n\n安装 IIS 最简单的方法是通过平台安装程序（WPI）。WPI 随 Visual Studio 安装，因此如果你在开发机器上执行这些步骤，你已经有了\
  \ WPI。如果你在其他机器（例如运行 Windows Server）上遵循这些步骤，你需要先下载安装 WPI。你可以从 [www.microsoft.com/web/downloads](http://www.microsoft.com/web/downloads)\
  \ 下载 WPI，在那里你应该看到 Download 或 Download Now 按钮。如果此链接发生变化，请搜索“Web Installer download”查找微软其他允许下载和安装\
  \ WPI 的位置。\n\nWPI 安装后，可能会自动启动。如果是这样，请关闭它以清除可能被选择自动安装的程序。从 Windows 开始菜单或启动屏幕启动 WPI。加载完成后，切换到\
  \ Products 选项，在屏幕顶部输入 `IIS recommended` 并按回车。WPI 将列出 IIS 推荐配置，如图 19-5 所示。\n\n![image](img/f736-01.jpg)\n\
  \n**图 19-5**\n\n点击 Add 将此项添加到待安装列表中。如果 Add 按钮被禁用，则已经安装了部分 IIS。\n\n\n\n\n接下来，再次使用搜索框搜索\
  \ `IIS: ASP.NET`。根据你使用的 Windows 版本，这应该显示出一个名为 `IIS: ASP.NET` 或 `IIS: ASP.NET 4.5`\
  \ 的项目（以及其他不相关的项目）。`IIS: ASP.NET` 或 `IIS: ASP.NET 4.5` 项目是在 IIS 环境下运行 ASP.NET 所必需的，也是成功运行你网站的关键组件。选择此项目并点击“添加”。如果你同时看到这两个项目，请选择\
  \ `IIS: ASP.NET 4.5`。最后，点击屏幕底部的“安装”按钮，然后接受许可条款。过了一会儿，你应该会收到 IIS 及其组件已成功安装的确认。\n\n\
  有关手动设置 IIS 的详细说明，请查阅 IIS 官方网站上的这些文章或访问 [www.iis.net](http://www.iis.net)：\n\n[`bit.ly/IISOnServer2008`](http://bit.ly/IISOnServer2008)\n\
  \n[`bit.ly/IISOnServer2012`](http://bit.ly/IISOnServer2012)\n\n当 IIS 安装成功后，你需要确保已安装了\
  \ Microsoft .NET Framework 4.5.1 版本。\n\n### 安装和配置 ASP.NET\n\n如果你在目标机器上安装了 Visual\
  \ Studio 2013（任何版本），则你已经安装了 .NET Framework 4.5.1。否则，你需要从微软网站的 [`msdn.microsoft.com/en-us/netframework`](http://msdn.microsoft.com/en-us/netframework)\
  \ 下载可重发行包。遵循“下载”或“安装”链接，或者使用搜索选项并搜索“download .NET Framework 4.5.1”。确保你下载的是 .NET\
  \ 4.5.1 Framework 的完整版本，而不是早期版本或客户端概要（Client Profile）包。下载完 .NET Framework 后，运行安装程序并按照屏幕说明操作。如果你收到提示该框架已安装的消息，则可以关闭安装程序。\n\
  \n如果你你的机器上已经有了 .NET Framework 4.5.1 并在之后安装了 IIS，你需要告知 IIS 该框架的存在。通常，这在安装 .NET Framework\
  \ 时会自动完成，但如果你是后安装的 IIS，则需要手动进行。你只需要在 Windows 7 和 Server 2008 R2 上执行此操作。对于 Windows\
  \ 8 和 Server 2012，当你通过 WPI 安装 IIS 时，ASP.NET 4.5.1 会正确注册。要在 IIS 中注册 ASP.NET，请按照以下步骤操作：\n\
  \n1. 以管理员模式打开命令提示符。要此操作，点击“开始”按钮，在搜索框中输入 `cmd`，然后按 Ctrl+Shift+Enter 以提升权限启动命令提示符。\n\
  \n2. 输入以下命令并按回车键进入 .NET Framework 版本 4 文件夹：\n\n   ```\n   cd \\Windows\\Microsoft.NET\\\
  Framework\\v4.0.30319\n   ```\n\n   由于 .NET 4.5.1 是 .NET 4 的原地替换，因此该文件夹使用 4.0 版本号。请注意，如果你在阅读这本书时，微软已经发布了更新版本的\
  \ .NET Framework，那么 `v4.0` 之后的实际版本号在你的机器上可能会略有不同。此外，如果你使用的是 64 位的 Windows，应该使用 `Framework64`\
  \ 文件夹。在命令行进入该文件夹之前，请使用 资源管理器找到正确的文件夹。\n\n3. 输入 `aspnet_regiis -i` 并再次按回车键。\n\n \
  \  过了一会儿，你应该会收到一条 ASP.NET 已成功注册到 IIS 的消息。\n\n现在 IIS 和 .NET Framework 已经正确安装并配置，下一步是在\
  \ IIS 下配置你的网站。你可以在下一个“尝试一下”（Try It Out）练习中看到如何操作。在练习之后，你将学习更多关于配置系统安全权限的知识。\n\n\
  为了确保网站在本地 IIS 安装上运行，你需要做的最后一件事是配置安全设置。这将在下面的两个部分中讨论。\n\n### 理解 IIS 中的安全\n\n由于与 IIS\
  \ Express 的无缝集成，你可能没有意识到底层发生了什么，以及当你浏览网站中的页面时哪些安全设置正在生效。为了使用网站中的资源（例如 ASPX 文件、后台后置代码文件（Code\
  \ Behind files）、`App_Data` 文件夹中的数据库以及网站中的图像），你的 Web 服务器需要 Windows 的权限来访问这些资源。这意味着你需要配置\
  \ Windows，并将访问权限授予 Web 服务器使用的账户。但那个账户到底是什么？需要权限的特定账户取决于多个因素，包括 Windows 版本、你是在 IIS\
  \ 还是 IIS Express 下运行网站，以及 IIS 内部的多个设置。\n\n但在在大多数情况下，你只有两种情况需要考虑：使用 IIS Express 或完整版本的\
  \ IIS 作为你的 Web 服务器。\n\n在一种情况下，IIS Express 使用的账户是你登录 Windows 机器时使用的账户。该账户通常类似于 `DomainName\\\
  UserName` 或 `MachineName\\UserName`。当你用此账户登录 Windows 时，你启动 Visual Studio，它反过来启动\
  \ IIS Express。这意味着整个 Web 服务器都使用你的凭据运行。由于你很可能是本地 Windows 机器的管理员或高级用户，并拥有访问构成你网站的所有文件的权限，可能到目前为止在不更改任何安全设置的情况下，一切运行得良好。\n\
  \n在另一种使用 IIS 的情况下，情况大不相同。默认情况下，IIS 下的 ASP.NET 站点使用安装 IIS 时创建特殊账户运行。该账户被称为 `ApplicationPoolIdentity`。你无法直接在系统中找到\
  \ `ApplicationPoolIdentity` 用户账户，因为它取决于应用程序池。由于你之前看到的应用程序池在集成模式下运行，你只需要配置一个账户。如果你运行经典模式（对于\
  \ Planetrox 网站并非必须），你还需要配置另一个名为 IUSR 的账户。该账户由 IIS 用于提供非 ASP.NET 内容（如 HTML 文件和图像）。有关经典模式和\
  \ IUSR 账户的更多信息请参考 IIS 文档。\n\n确定所需的账户后，最后一步是配置文件系统。\n\n### Wrox 的 NTFS 设置\n\n无论你使用哪种账户，都需要对文件系统进行更改，以便允许服务器访问你的资源。\n\
  \n| 文件夹名称 | 权限 | 解释 |\n| :--- | :--- | :--- |\n| `Release`（位于 `C:\\BegASPNET\\`）\
  \ | 列出文件夹内容读取 | Web 服务器需要读取构成网站的文件和文件夹。子文件夹（如 `Reviews`）需要设置为继承这些设置。 |\n| `App_Data`,\
  \ `GigPics`（均位于 `C:\\BegASPNET\\Release`） | 修改 | Web 服务器需要读取并写入 `App_Data` 文件夹中的\
  \ Microsoft SQL Server 数据库。它还需要保存 `GigPics` 文件夹中的上传图像。 |\n| `C:\\TempMail` | 修改\
  \ | 如果你在本地投放电子邮件，你还需要配置 `TempMail` 文件夹。 |\n\n如果你是从第 12 章来到这里学习如何配置 `App_Data` 文件夹的\
  \ NTFS，则可以忽略本章之前创建的 `Release` 文件夹。相反，请按照下一个练习中的说明，为你的账户授予 `C:\\BegASPNET\\Site`\
  \ 下 `App_Data` 文件夹的修改权限。你可能需要对 `GigPics` 文件夹执行相同的操作，你可以现在就在网站根目录下创建它，也可以在第 14 章创建该文件夹后返回本节。\n\
  \n在你确定了需要配置的账户后，最后一步是配置文件系统。\n\n\n\n\n当你在尝试在网络浏览器中访问网站时，可能会遇到许多问题。为了获取有用的错误信息，你需要做的第一件事是将\
  \ `Web.config` 中的 `<customErrors>` 部分从 `On` 改为 `Off` 或 `RemoteOnly`。这让你更容易看到发生了什么。此外，你可能想要检查\
  \ Windows 事件查看器（在开始菜单或开始屏幕上输入 `eventvwr`），以获取有关错误的更多详细信息以及解决这些问题的提示。\n\n本节列出了最常见的问题并提供了相应的解决方案。你应该意识到，你可能遇到的错误有许多可能的原因，在这里无法涵盖所有情况。如果你遇到了无法解决的问题，请访问\
  \ Wrox 社区网站上的论坛，地址为 [`p2p.wrox.com`](http://p2p.wrox.com)。你将在那里找到许多热心的帮助者（包括我在内），他们理解你的问题并能帮助你找到解决方案。\n\
  \n*   **在应用程序级别之外使用注册为 allowDefinition=‘MachineToApplication’的节是一个错误** — 当你的网站不在\
  \ Web 服务器的根目录时，或者你没有将该文件夹配置为单独应用程序时，就会出现此错误。考虑到 Planet Wrox 站点的当前配置，例如当你在 IIS 中将网站映射到\
  \ `C:\\BegASPNET` 然后访问 [`localhost/Release`](http://localhost/Release) 时，你就会得到此错误。要修复此错误，请确保你的\
  \ IIS 网站根目录指向包含主 `Web.config` 文件的文件夹；在此例中为 `C:\\BegASPNET\\Release`。当你在 VS 中打开错误的文件夹时也会遇到相同的错误；例如，当你打开\
  \ `C:\\BegASPNET` 然后访问 [`localhost:12345/Site`](http://localhost:12345/Site) 时。相反，请在\
  \ VS 中将 `C:\\BegASPNET\\Site` 作为网站打开。如果你的网站中的子文件夹包含 `Web.config` 文件，且该文件尝试覆盖仅应在站点根定义的设置，你也可能遇到此错误；例如，如果你在\
  \ `Management` 文件夹的 `Web.config` 文件中有 `<membership />` 元素。\n\n*   **HTTP Error 401.3–未授权**\
  \ — 当 Web 服务器使用的帐户没有读取磁盘上文件的权限时，就会出现此错误。要解决此问题，请参考本章较早名为“配置文件系统”的“尝试运行”部分并配置正确的权限。\n\
  \n*   **更新数据库 “C:\\BEGASPNET\\RELEASE\\APP_DATA\\ASPNETDB.MDF” 失败，因为数据库是只读** — 当数据库文件被标记为只读，或者\
  \ Web 服务器使用的帐户未允许写入数据库文件时，就会出现此错误。在一种情况下，请在文件资源管理器 / Windows 资源管理器中打开文件的属性，并验证未勾选“只读”复选框。在后一种情况下，确保用于\
  \ ASP.NET 的帐户对 `App_Data` 文件夹至少具有“修改”权限。\n\n*   **HTTP Error 403.14–禁止访问** — 尽管此错误最初似乎是\
  \ NTFS 权限问题，但它通常是由默认文档错误或缺失引起的。如果你遇到此错误，请确保你访问的站点或文件夹包含一个名为 `Default.aspx` 的文档，并且你已经在\
  \ IIS 中将该文档名称配置为默认文档。\n\n*   **HTTP Error 404.0–未找到** — 当你尝试请求不存在的文件或文件夹时，就会出现此错误，例如\
  \ [`localhost/DoesNotExist`](http://localhost/DoesNotExist) 或 [`localhost/DoesNotExist.gif`](http://localhost/DoesNotExist.gif)。\n\
  \n*   **在与服务器建立连接时发生错误。连接到 SQL Server 2008 时，此失败可能是由于默认设置下 SQL Server 不允许远程连接。（provider:\
  \ Named Pipes Provider，错误: 40–无法打开到 SQL Server 的连接）**。或者，你可能会收到错误：**在与 SQL Server\
  \ 连接时发生网络相关或实例特定的错误。找不到服务器或无法访问。请验证实例名是否正确以及 SQL Server 是否配置为允许远程连接。（provider: SQL\
  \ Network Interfaces，错误: 26 - 无法找到指定的服务器/实例）** — 你可能由于多种原因遇到这些错误。虽然这里的错误信息显式提到了\
  \ SQL Server 2008，但你也可以遇到其他版本的 SQL Server 的此错误。通常，此错误是由于无法访问配置的数据库服务器引起的。当你在连接字符串中拼写错误的服务器名称、服务器宕机或服务器只能从本地计算机访问而无法通过网络访问时，就会遇到此错误。要确保\
  \ SQL Server 正常运行，请打开管理工具中的服务部分（在控制面板中找到）。然后查看 SQL Server 并验证 SQL Server 是否已启动。附录\
  \ B 详细解释了 SQL Server 安全性并提供了这些问题的解决方案。\n\n*   **由于检索用户的本地应用程序数据路径失败，无法生成 SQL Server\
  \ 的用户实例。请确保用户在计算机上具有本地用户配置文件。连接将关闭** — 当你忘记启用“配置你的站点”对应的“尝试运行”中讨论的“加载用户配置文件”选项时，就会遇到此错误。\n\
  \n*   **HTTP Error 500.21 - 内部服务器处理器“PageHandlerFactory-Integrated”的模块列表中存在坏模块“ManagedPipelineHandler”详细错误信息**\
  \ — 当 ASP.NET 未在 IIS 中注册时，就会遇到此错误。请参考标记为“安装和配置 ASP.NET”的部分了解如何修复此问题。\n\n*   **运行时错误描述：服务器上发生应用程序错误。此应用程序当前的自定义错误设置阻止了查看应用程序错误的详细信息。详细：要在本地服务器上查看此特定错误消息详细信息，请在当前\
  \ Web 应用程序根目录下的“web.config”配置文件创建 <customErrors> 标签。应将该 <customErrors> 标签的“mode”属性设置为“RemoteOnly”。要在远程机器上查看详细信息，请将“mode”设置为“Off”**\
  \ — 当发生运行时错误且 `Web.config` 不包含 `<customErrors>` 元素时，你可能会遇到此错误。然而，当 `Web.config`\
  \ 文件本身包含错误时，你也可能遇到相同的错误；例如，如果你忘记关闭某个元素。要修复此类错误，请在 Visual Studio 中打开文件，它将为你提供有关错误的更多详细信息。\n\
  \n## 将数据移动到远程服务器\n\n在本地机器的 IIS 上发布站点非常简单。你只需将数据复制到新位置，配置 IIS，更改一些安全设置即可。由于站点继续使用本地的\
  \ SQL Server 副本，它运行良好。\n\n然而，在现实世界中，当你需要将网站移动到外部服务器或主机时，情况并不那么简单。虽然使用 FTP 程序复制网站的文件通常非常简单，但将数据从\
  \ SQL Server 数据库复制到主机通常要困难得多。这是因为大多数 主机不支持免费的 Express 或 LocalDB 版，因此你不能简单地将 `.mdf`\
  \ 文件复制到远程主机的 `App_Data` 文件夹。相反，这些主机通常提供完整版本的 SQL Server，你可以使用基于 Web 的工具或 SQL Server\
  \ Management Studio 等工具来访问它。\n\n\n\n\n将数据库数据从本地机器传输到远程主机通常是一个两个步骤的过程：\n\n1.  从你的本地\
  \ SQL Server 数据库创建一个 `.sql` 脚本。\n2.  将此脚本发送到你的主机并在那里执行它。\n\n在下一节中，你将看到如何将你的数据库导出为\
  \ `.sql` 文件。我不会向你展示如何在主机上运行该文件以重新创建数据库，因为不同的主机之间操作有所不同。相反，我将为你提供一些通用的提示，以便你了解针对你的主机时需要注意哪些内容。\n\
  \n### 将数据导出到文件\n\n为了方便将数据从本地 SQL Server 数据库传输到 Web 主机的 `SQL Server` 数据库中，`SQL Server\
  \ Management Studio` 自带了一个工具，可以将你的数据库结构和数据导出到文件。该文件包含了在远程服务器上重新创建数据库及其数据所需信息。\n\n\
  在接下来的练习中，你将看到如何使用 `SSMS` 将数据库导出到文件。\n\n### 重新创建数据库\n\n尽管每个主机在提供 `SQL Server` 访问权限时都有自己的规则和程序，但它们可以分为三类。\n\
  \n首先，某些主机不提供数据库的远程访问权限，并要求你提交 `.sql` 文件以便他们替你执行。在这种情况下，你除了发送文件并等待主机创建数据库外，不需要做任何事情。\n\
  \n第二类是允许你通过 Web 界面执行 `SQL` 语句的主机。你通常登录在线控制面板，然后通过上传文件或将其内容粘贴到网页的文本区域来执行脚本工具创建的 `SQL`\
  \ 语句。无论使用哪种方法，你最终都会获得一个可以从应用程序访问的数据库。具体工作原理在每个主机上都不同，因此请咨询托管服务的帮助或支持系统以获取更多信息。某些提供者的\
  \ Web 数据库管理工具存在已知问题，导致在你尝试运行生成的 `SQL` 文件时出现错误。虽然文件本身在技术上是有效的，但工具可能在使用时遇到问题。如果是这种情况，请联系你的主机寻求帮助解决问题。如果你遇到问题，可以尝试的方法之一是将你的\
  \ `SQL` 文件保存为不同的格式。默认格式是 `Unicode`，并不是所有提供商都能理解。要更改格式，在导出数据时，在“另存为”选项中选择 `ANSI Text`，如图图\
  \ 19-15 所示。\n\n最后一类是允许你通过互联网连接到其 `SQL Server` 的主机。这允许你使用 `SQL Server Management\
  \ Studio` 等工具直接从桌面连接到主机上的数据库并远程执行 `SQL` 脚本。请参考第 12 章“使用 `SQL` 处理数据库数据”节中的第一个练习，学习更多关于使用\
  \ `SSMS` 对数据库执行 `SQL`文件的知识。\n\n在目标服务器上重新创建数据库后，你需要通过更改网站中的连接字符串来重新配置 `ASP.NET` 应用程序以使用新数据库。为了使其生效，你需要修改两个连接字符串：你在前面的章节中创建的\
  \ `PlanetWroxConnectionString1` 和 `PlanetWroxEntities`。连接字符串的形式取决于你使用的数据库及其配置。你的托管公司或数据库管理员通常会提供这些信息。关于正确连接字符串的许多示例，请查看\
  \ [www.connectionstrings.com](http://www.connectionstrings.com)。以下代码提供了一个简单的示例，重新配置你的应用程序使用名为\
  \ `DatabaseServer` 的数据库服务器。此示例显示了一个 `SQL Server` 的连接字符串，它要求使用用户名和密码登录（在配置文件中，每个连接字符串应占一行）：\n\
  \n```\n<connectionStrings>\n  <add name=\"PlanetWroxConnectionString1\" connectionString=\"\
  Data\n      Source=DatabaseServer;Initial Catalog=PlanetWrox;User Id=YourUserName;\n\
  \      Password=YourPassword;\" providerName=\"System.Data.SqlClient\"/>\n  <add\
  \ name=\"PlanetWroxEntities\" connectionString=\"metadata=res://*\n      /App_Code.PlanetWrox.csdl|res://*/App_Code.PlanetWrox.ssdl|res://*\n\
  \      /App_Code.PlanetWrox.msl;provider=System.Data.SqlClient;\n      provider\
  \ connection string=&quot;Data Source=DatabaseServer;\n        Initial Catalog=PlanetWrox;User\
  \ Id=YourUserName;Password=YourPassword;\n        MultipleActiveResultSets=True&quot;\"\
  \n      providerName=\"System.Data.EntityClient\"/>\n</connectionStrings>\n```\n\
  \n这使 `PlanetWrox` 数据库的两个连接字符串都指向不同的 `SQL Server`。有关配置 `ASP.NET` 应用程序与 `SQL Server`\
  \ 协同工作的更多信息，请参考附录 B。不要忘记在 Visual Studio 的部署 `.config` 文件中添加相同的代码，以便下次发布网站时，目标 `Web.config`\
  \ 具有正确的设置。\n\n在此阶段，你已经基本完成了新创建网站的配置。恭喜你！但是，在你放松并开始享受新网站之前，请阅读以下检查清单，它将帮助你保护网站并提高性能。\n\
  \n## 部署检查清单\n\n本节并不是以关于部署的通用提示结束本章，而是为你准备好将网站投入生产时提供了一份实用的检查列表：\n\n*   确保 `Web.config`\
  \ 文件中没有启用调试。这会导致不必要的开销并降低网站性能，因为代码执行速度较慢且重要文件无法被浏览器缓存。要禁用调试，请打开用于生产环境的 `Web.config`\
  \ 文件，并验证 `debug` 设置为 `false`：\n\n```\n<compilation debug=\"false\">\n```\n\n使用了书中描述的\
  \ Webconfig 转换，目标 `Web.config` 应关闭此设置。\n\n*   通过将 `Web.config` 中 `customErrors`\
  \ 元素的 `mode` 属性设置为 `On` 或 `RemoteOnly` 来确保已启用自定义错误。在第一情况下，所有人都能看到你的自定义页面；在第二情况下，只有本地服务器的用户才能看到错误详情。永远不要将\
  \ `mode` 设置为 `Off`，因为会导致信息泄露。以下代码段显示了 `customErrors` 的安全配置：\n\n```\n<customErrors\
  \ mode=\"On\" defaultRedirect=\"~/Errors/OtherErrors.aspx\">\n  可选的 <error /> 元素\n\
  </customErrors>\n```\n\n*   禁用跟踪，或者至少将跟踪限制为来自本地机器的用户。`Web.config` 中的 `<trace />`\
  \ 元素阻止了来自 Web 服务器以外用户的跟踪。此外，它还防止了跟踪信息出现在页面中：\n\n```\n<trace mostRecent=\"true\"\
  \ enabled=\"true\" requestLimit=\"1000\"\n              pageOutput=\"false\" localOnly=\"\
  true\"/>\n```\n\n*   考虑将 `machine.config` 中 `deployment` 元素的 `retail` 属性设置为 `true`：\n\
  \n```\n<configuration>\n  <system.web>\n    <deployment retail=\"true\"/>\n  </system.web>\n\
  </configuration>\n```\n\n此节用于指示服务器托管的是生产版本的网站，并对于服务器上的所有网站，将上述三个项目都更改为安全设置：调试和跟踪已禁用，且错误信息仅对本地用户可见。\n\
  \n要进行此更改，你需要以管理员身份登录系统。此外，请务必先备份该文件。\n\n\n\n\n*   扫描你的网站，查找可能包含敏感信息（如 Word 或文本文档）的重要文件，并将它们从发布版本中排除，或者考虑将它们移动到\
  \ `App_Data` 文件夹。该文件夹中的文件无法被直接访问。但是，你的代码仍然可以访问这些文件，正如你在第 9 章看到的那样。\n\n*   确保你开启了错误日志。通过你在上一章中创建的错误日志代码，当发生错误时你都会收到通知，这让你能够主动监控服务器，并在错误再次发生之前修复它们。\n\
  \n*   如果你在网站中使用了主题，请确保从 `Web.config` 中的 `<pages>` 元素中删除 `styleSheetTheme` 属性。Planet\
  \ Wrox 网站使用了主题，但你添加 `styleSheetTheme` 属性是为了启用 Visual Studio 中的设计时支持。在你的生产服务器上，你只需要这些：\n\
  \n```xml\n<pages theme=\"Monochrome\">\n  ...\n</pages>\n```\n\n这样，页面就不会包含两次相同的样式表了。\n\
  \n# 接下来要做\n\n现在你已经完成了第一个 ASP.NET 网站，我相信你正期待创建下一个网站。Planet Wrox 网站可以作为你将要构建的新网站的基础。你可能不会在网站中直接使用它的任何页面，但希望这本书和\
  \ Planet Wrox 网站足够给你足够的启发，让你自己构建一个新网站。\n\n由于这本书是面向初学者的，我无法就某些重要主题为你提供很多深入的信息。书中大多数拥有独立章节的主题都足以单独写一整本书了。例如，CSS、AJAX\
  \ 和 LINQ 等主题非常广泛，Wrox 已经出版了许多关于这些主题的书。现在你已经掌握了这些技术的基础知识，可以使用 Wrox 专业系列中的以下书籍进行深入研究：\n\
  \n*   *Professional CSS: Cascading Style Sheets for Web Design, 3rd Edition* (ISBN:\
  \ 978-0-470-89152-0)\n*   *Professional ASP.NET 2.0 Design: CSS, Themes, and Master\
  \ Pages* (ISBN: 978-0-470-12448-2)\n*   *Professional ASP.NET 4.5 in C# and VB*\
  \ (ISBN: 978-1-118-31182-0)\n*   *Professional LINQ* (ISBN: 978-0-470-04181-9)\n\
  *   *Professional Microsoft IIS 8* (ISBN: 978-1-118-38804-4)\n\n当然，网络也是获取更多信息的好地方。以下\
  \ URL 可能对你寻找有关 ASP.NET 及其相关技术的更多有所帮助：\n\n*   [`p2p.wrox.com`](http://p2p.wrox.com)\
  \ —— Wrox 的公共讨论论坛，你可以在那里寻找所有与编程相关的问题。这本书在该网站上有它自己的分类，方便你提出针对性的问题。我是这些论坛的常访客，我会尽力回答你对这本书可能提出的任何问题。\n\
  *   [`imar.spaanjaars.com`](http://imar.spaanjaars.com) —— 我自己的网站，我在那里向你更新各种 Web\
  \ 编程相关主题。\n*   [`www.asp.net`](http://www.asp.net) —— 用于 ASP.NET 技术的微软社区网站。在此处获取\
  \ ASP.NET 的新闻、额外的下载和教程。\n*   [`msdn.microsoft.com/asp.net`](http://msdn.microsoft.com/asp.net)\
  \ —— 微软开发者网站上 ASP.NET 的官方首页，为你提供了关于 ASP.NET 的丰富信息。\n\n# 总结\n\n显然，部署是你新网站开发周期结束时的一项重要操作。然而，你不太可能只部署一次网站。一旦发布了网站的第一版本，你就会想要添加其他新的、酷炫的功能，这使得网站的开发变成一个持续的过程。为了适应这一点，你需要让你的网站易于部署。\n\
  \n实现这一点的方法是将硬编码的配置设置移动到 `Web.config` 文件，为你提供一个单一的位置来更改开发和生产环境中的网站参数。\n\n当你准备好发布网站时，在将文件发送到目标服务器之前，创建一个网站副本并进行清理是一个好主意。使用\
  \ `Publish Web Site` 命令复制并发布网站是非常简便的。\n\n因为你将在 IIS 上部署网站，你需要了解此 Web 服务器的一些重要设置。在这一章中，你看到了如何配置默认网站站点并进行一些配置更改。由于\
  \ Windows 和 IIS 安全机制的工作，你还需要配置硬盘，以便 Web 服务器使用的账户可以读取你网站中的文件，并写入 `App_Data` 和 `GigPics`\
  \ 等特定文件夹。\n\n## 本章学到的知识\n\n| 术语 | 说明 |\n| :--- | :--- |\n| **NET assembly** | 带有\
  \ `.dll` 扩展的文件，包含可执行和可调用的 .NET 代码 |\n| **Application pool (应用程序池)** | 用于在 IIS 中隔离（一个或多个）网站的机制，为它们提供自己的资源集\
  \ |\n| **Deployment (部署)** | 将网站从开发环境发布到生产环境的过程 |\n| **Expression syntax (表达式语法)**\
  \ | 一种允许将属性绑定到资源的技术，例如在 `Web.config` 中定义 |\n| **IIS** | Internet Services —— 微软\
  \ 平台的 Web 服务器 |\n| **Integrated Pipeline (集成管道)** | 当应用程序池启用集成管道模式时，ASP.NET 和 IIS\
  \ 紧密集成 |\n| **Precompilation (预编译)** | 将 Web 应用程序编译为一组 .dll 文件的过程；如果没有预编译，ASP.NET\
  \ 文件将在首次被请求时进行编译 |\n| **WebConfiguration class** | 一个 .NET 框架类，用于访问存储在配置文件中的数据 |\n\
  \n\n\n\n\n当你想让一段文本既加粗又斜体时，需要选择该文本，然后点击格式工具栏上的加粗（Bold）按钮。接下来，你需要点击斜体（Italic）按钮。页面最终的\
  \ HTML 代码应该如下所示：\n\n```\n<strong><em>Welcome to Planet Wrox</em></strong>\n```\n\
  \n你可能还会遇到 `<b>` 和 `<i>` 元素，它们的效果相同。然而，这些现在被认为是过时的，鼓励你使用 `<strong>` 和 `<em>` 来代替它们。\n\
  \n### 练习 3 答案\n\n第一种方法是使用解决方案（Solution Explorer）。右键点击站点，选择 `Add ⇒ Existing Item`（添加\
  \ ⇒现有项），然后浏览并选择要添加的项目。\n\n其次，你可以从文件资源管理器（File Explorer）、Windows 资源管理器或直接从桌面将文件拖放到\
  \ VS 网站中。作为第三种替代方案，你可以使用 Windows 资源管理器将文件直接放在网站文件夹中。例如，你添加到 `C:\\BegASPNET\\Site`\
  \ 文件夹的文件将自动成为网站的一部分。如果你没有在 VS 中直接看到新文件出现，请点击解决方案工具栏上的刷新图标。\n\n### 练习 4 答案\n\n在 VS\
  \ 中，你对代码有不同的视图：`设计视图`（Design View）、`标记视图`（Markup View，也称为`源视图`或`代码视图`）以及`分屏视图`（Split\
  \ View）。第一种让你对网页在浏览器中的外观有一个直观感受，第二种视图显示原始标记。`分屏视图`允许你同时看到这两种视图。VS 还为其他文件提供了不同的视图。例如，ASPX\
  \ 页面的编程代码通常被称为`代码后`（Code Behind）视图或简单称为`代码后`。新的 HTML 编辑器（你无法将其用于 Web Forms）仅有`标记视图`。\n\
  \n## 第 3 章\n\n### 练习 1 答案\n\n外部样式表最大的用处是它可以应用于整个站点。只需更改该文件中的单条规则，你就可以影响站点中所有使用该规则的页面。如果使用嵌入式或内联样式，你需要手动更改站点中的所有文件。外部样式表还让你更容易在站点的许多不同元素中复用特定样式。只需创建一个\
  \ `Class`（类）或 `ID` 选择器，并在你认为合适的地方复用它即可。\n\n### 练习 2 答案\n\n该规则看起来如下：\n\n```\nh1\n\
  {\n  font-family: Arial;\n  color: Blue;\n  font-size: 18px;\n  border-top: 1px\
  \ solid Blue;  \n  border-left: 1px solid Blue;  \n}\n```\n\n注意 `border` 属性的另一种简写版本。这种形式与你在在本章之前看到的\
  \ `border` 属性相似，它允许你一次设置边框的大小、样式和颜色。在这条规则中，`border-top` 和 `border-left` 用于更改左边和上边框；另外两个方向（下边框和右边框）不受此规则的影响。\n\
  \n### 练习 3 答案\n\n第二个声明在你的站点中更具复用性，因为它定义的是 `Class` 选择器，而不是 `ID` 选择器。后者在单个页面中只能由一个具有匹配\
  \ `id` 属性的元素使用一次：例如示例中的 `MainContent`。另一方面，类选择器 `BoxWithBorders` 可以被单个页面中的多个元素使用，因为你允许对页面中的多个元素应用相同的\
  \ `class` 属性。\n\n### 练习 4 答案\n\nVS 允许通过以下方式附加样式表：\n\n*   直接在标记视图中页面的 `<head>` 中输入所需的\
  \ `<link>` 元素。\n\n*   从解决方案管理器中将 CSS 文件拖入标记视图中页面的 `<head>` 部分。\n\n*   从解决方案管理器中拖入\
  \ CSS 文件并将其释放到设计视图的页面上。\n\n*   使用主菜单 `Format ⇒ Attach Style Sheet`（格式 ⇒ 附加样式表），然后浏览到你的\
  \ CSS 文件。\n\n*   使用 `Manage Styles`（管理样式）或 `Apply Styles`（应用样式）窗口并点击 `Attach Style\
  \ Sheet`链接。\n\n## 第 4 章\n\n### 练习 1 答案\n\n使控件保持状态的机制被称为 `View State`（视图状态）。\n\n\
  ### 练习 2 答案\n\nASP.NET 运行时将控件的值存储在名为 `__VIEWSTATE` 的隐藏字段中。此隐藏字段会在每次回传（postback）时发送到服务器，在在那里被解包，然后用之前的值重新填充页面中的控件。\n\
  \n### 练习 3 答案\n\n`DropDownList` 仅允许用户进行单次选择，而 `ListBox` 允许多选。此外，当 `DropDownList`\
  \ 未展开时，它只显示列表中的一个项目，而 `ListBox` 能够同时显示多个项目。\n\n### 练习 4 答案\n\n为了让你在浏览器中选择或清除 `CheckBox`\
  \ 控件时它能回传到服务器，你需要将 `AutoPostBack` 属性设置为 `True`：\n\n```\n<asp:CheckBox ID=\"CheckBox1\"\
  \ runat=\"server\" AutoPostBack=\"True\" />\n```\n\n### 练习 5 答案\n\n许多 ASP.NET 控件允许你使用\
  \ `BackColor` 和 `ForeColor` 等属性更改颜色。此外，你还可以使用 `BorderColor`、`BorderStyle` 和 `BorderWidth`\
  \ 来更改浏览器中控件周围边框。最后，为了影响控件的大小，你需要设置它的 `Height` 和 `Width` 属性。\n\n### 练习 6 答案\n\n与其设置单个样式，不如设置指向规则集的\
  \ `CssClass` 属性要好得多。这样，样式相关信息会在每个请求时发送。相反，浏览器读取一次样式表。\n\n## 第 5 章\n\n### 练习 1 答案\n\
  \n`Byte` 和 `SByte` 数据类型都是为存储小型数值而设计的。它们占据的内存相同，所以你最好使用 `Byte` 类型。由于它不允许负数，显然它只能包含\
  \ `0` 到 `255` 之间的数字。然而，最好不要存储人的年龄，而是存储出生日期。这样你就可以通过与今天的日期比较来获取年龄。\n\n### 练习 2 答案\n\
  \n这段代码切换了 `DeleteButton` 控件的可见性。它使用了赋值运算符和取反运算符。首先对 `Visible` 的当前值取反。当该值为 `True`\
  \ 时，`Not` 运算符（C# 中为 `!`）将其变为 `False`，反之亦然。然后将该结果赋值回 `Visible` 属性。因此，之前隐藏的现在可见，之前可见现在隐藏。\n\
  \n### 练习 3 答案\n\n要创建 `Person` 的特殊版本，你需要创建一个继承 `Person` 类的类，并通过添加 `StudentId` 属性来扩展其功能。\n\
  \nVB.NET\n\n```\nPublic Class Student\n    Inherits Person\n  Public Property StudentId\
  \ As String\nEnd Class\n```\n\nC#\n\n```csharp\npublic class Student : Person\n\
  {\n  public string StudentId { get; set; }\n}\n```\n\n## 第 6 章\n\n### 练习 1 答案\n\n\
  `ContentPlaceHolder` 应该放在主页中。它定义了一个内容页面可以填充的区域。`Content` 控件应该放在基于主页的内容页面中。它用于为与其连接的\
  \ `ContentPlaceHolder` 元素提供内容。\n\n### 练习 2 答案\n\n要将 `Content` 控件链接到主页中的 `ContentPlaceHolder`，你需要设置\
  \ `ContentPlaceHolderID`：\n\n```\n<asp:Content ID=\"Content1\" ContentPlaceHolderID=\"\
  IdOfContentPlaceHolder\"\n              runat=\"Server\">\n</asp:Content>\n```\n\
  \n### 练习 3 答案\n\n\n\n\n你有几种方法可以实现这一点。首先，你可以在同一个皮肤文件中创建一个具有不同 CSS 类的命名皮肤：\n\n```\n\
  <asp:Button runat=\"server\" SkinID=\"RedButton\" CssClass=\"RedButton\" />\n```\n\
  \n然后，你使用 `SkinID` 属性将想要更改的控件连接到此命名皮肤：\n\n```asp\n<asp:Button ID=\"Button1\" runat=\"\
  server\" Text=\"Button\" SkinID=\"RedButton\" />\n```\n\n或者，你可以在 `Button` 控件上禁用主题，并直接在\
  \ ASPX 页面中为它分配不同的 CSS 类：\n\n```asp\n<asp:Button ID=\"Button1\" runat=\"server\"\
  \ EnableTheming=\"False\"\n      CssClass=\"RedButton\" Text=\"Button\" />\n```\n\
  \n在这两种解决方案中，你需要一个 CSS 类来设置背景颜色：\n\n```css\n.RedButton\n{\n  background-color: Red;\n\
  }\n```\n\n### 练习 4 解答\n\n`StyleSheetTheme` 在页面生命周期早期应用。这使得 ASPX 页面中的控件有机会覆盖它们最初从\
  \ `StyleSheetTheme` 获取的设置。这意味着 `StyleSheetTheme` 只是建议控件的外观和感受，赋予了单个控件覆盖该外观的能力。\n\
  \n另一方面，`Theme` 会覆盖控件应用任何设置。这使得你作为页面开发者，能够根据主题的设置来强制执行网站中控件的外观和感受。如果你仍然需要更改单个控件，可以通过将\
  \ `EnableTheming` 设置为 `False` 来禁用主题。\n\n### 练习 5 解答\n\n你有三种方法在 ASP.NET 网站中设置 `Theme`\
  \ 属性。第一个选项是直接在 `@ Page` 指令中设置该属性，以便它仅适用于该页面：\n\n```asp\n<%@ Page Language=\"C#\"\
  \ ...... Theme=\"Monochrome\" %>\n```\n\n要将主题应用于网站中的所有页面，你需要在 `Web.config` 文件中设置\
  \ `<pages>` 元素的 `theme` 属性：\n\n```xml\n<pages theme=\"Monochrome\" ...\n```\n\n\
  你拥有的最后一个选项是通过编程设置主题。你必须在 `Page` 类的 `PreInit` 事件中执行此操作，你可以在网站的各个页面中处理它，也可以像你在第 6\
  \ 章中所的那样，使用 `BasePage` 类在中心位置进行处理。\n\n### 练习 6 解答\n\n基页面允许你对网站中所有页面的行为进行集中。与其在每个页面中重复编写相同的功能，不如将此代码移动到基页面，以便所有\
  \ ASPX 页面都可以使用它。当你实现主题切换器时，你只需要在中心 `BasePage` 类中编写一些代码。网站中所有继承自此 `BasePage` 类的页面都将自动设置所选主题，无需任何额外代码。\n\
  \n## 第 7 章\n\n### 练习 1 解答\n\n要更改 `TreeView` 控件中项的背景颜色，你可以如下使用 `NodeStyle` 元素：\n\n\
  ```asp\n<asp:TreeView ID=\"TreeView1\" runat=\"server\"\n             DataSourceID=\"\
  SiteMapDataSource1\" ShowExpandCollapse=\"False\">\n  <NodeStyle BackColor=\"White\"\
  \ />\n  ...\n</asp:TreeView>\n```\n\n与其设置 `BackColor` 属性（这将导致内联样式），不如设置 `CssClass`\
  \ 属性更好：\n\n```asp\n<NodeStyle CssClass=\"TreeViewNodeStyle\" />\n```\n\n然后你需要在你的\
  \ CSS 文件创建一个单独的类：\n\n```css\n.TreeViewNodeStyle\n{\n  background-color: White;\n\
  }\n```\n\n通过这种方式，更容易从中心位置管理样式。\n\n### 练习 2 解答\n\n要通过程序将用户重定向到另一个页面，可以使用 `Response.Redirect`、`Response.RedirectPermanent`\
  \ 或 `Server.Transfer`。前两个选项向浏览器发送重定向指令，因此被视为客户端侧重定向。而 `Server.Transfer` 在服务器端发生，允许你在不影响用户地址栏的情况下提供一个不同的页面。\n\
  \n### 练习 3 解答\n\n要显示一个没有展开或折叠节点能力的 `TreeView`，你需要将它的 `ShowExpandCollapse` 属性设置为\
  \ `False`。\n\n## 第 8 章\n\n### 练习 1 解答\n\n标准属性使用普通的备用变量来存储其值，而 View State 属性使用 `ViewState`\
  \ 集合来实现此。普通属性在每次回传（postback）时都会被重置，而 View State 属性能够保持其值。然而，View State 属性的这种优势是有代价的。在\
  \ View State 中存储值会增加请求和响应期间页面的大小。普通属性没有这个劣势。你应该仔细考虑存储在 View State 中的内容，以尽量减小页面大小。\n\
  \n### 练习 2 解答\n\n要让属性在跨回传时保持其状态，你需要将其转换为 View State 属性。所需的代码与 `NavigateUrl` 代码几乎相同，但它使用的是\
  \ `Direction` 数据类型而不是 `String`。你需要删除自动属性并将其替换为以下代码：\n\nVB.NET\n\n```vb\nPublic Property\
  \ DisplayDirection() As Direction\n  Get\n    Dim _displayDirection As Object =\
  \ ViewState(\"DisplayDirection\")\n    If _displayDirection IsNot Nothing Then\n\
  \      Return CType(_displayDirection, Direction)\n    Else\n      Return Direction.Horizontal\
  \ ' 在 View State 中未找到；返回默认值\n    End If\n  End Get\n\n  Set(Value As Direction)\n\
  \    ViewState(\"DisplayDirection\") = Value\n  End Set\n```\n\nC#\n\n```csharp\n\
  public Property DisplayDirection()\n{\n  get\n  {\n    object _displayDirection\
  \ = ViewState[\"DisplayDirection\"];\n    if (_displayDirection != null)\n    {\n\
  \      return (Direction)_displayDirection;\n    }\n    else\n    {\n      return\
  \ Direction.Horizontal; // 在 View State 中未找到；返回默认值\n    }\n  }\n  set\n  {\n   \
  \ ViewState[\"DisplayDirection\"] = value;\n  }\n}\n```\n\n### 练习 3 解答\n\n使用像 `Direction`\
  \ 这样的自定义数据类型比使用数字或 `String` 数据类型有两个优势。由于 IntelliSense Helper 你选择项目，你不需要记住像 `0` 或\
  \ `1` 这样的数字。此外，编译器帮助你检查拼写，如果你输入 `Direction.Vrtical` 而不是 `Direction.Vertical` 将报错。\n\
  \n## 第 9 章\n\n### 练习 1 解答\n\n首先，你需要在控件的后台编写一个属性，类似于你在上一章为 `Banner` 控件创建的 `DisplayDirection`\
  \ 属性。该属性可能如下：\n\nVB.NET\n\n```vb\nPublic Property PageDescription As String\n```\n\
  \nC#\n\n```csharp\npublic string PageDescription { get; set; }\n```\n\n然后你需要修改控件声明。例如，在\
  \ `Contact.aspx` 中，你可以这样修改控件：\n\n```asp\n<uc1:ContactForm ID=\"ContactForm\" runat=\"\
  server\" PageDescription=\"联系页面\"/>\n```\n\n注意 `PageDescription` 属性包含了所在页面的短描述。\n\
  \n显然，你可以在属性中放入任何你认为合适的文本来描述页面。最后，你需要将 `PageDescription` 添加到电子邮件消息的主题或正文中。下面的代码显示了如何使用此新属性的值来扩展主题：\n\
  \nVB.NET\n\n```vb\nmyMessage.Subject = \"来自网站的响应：\" & PageDescription\nmyMessage.From\
  \ = New MailAddress(\"you@example.com\", \"发送者\")\n```\n\nC#\n\n```csharp\nmyMessage.Subject\
  \ = \"来自网站的响应：\" + PageDescription;\nmyMessage.From = new MailAddress(\"you@example.com\"\
  , \"发送者\");\n```\n\n从现在起，这个自定义页面描述被添加到邮件的主题中。如果你有多个 Web Forms 使用此联系表单并想知道信息是从哪个页面发送的，此解决方案将变得特别有用。\n\
  \n\n\n\n### 练习 3 解决方案\n\n`MailMessage` 类的 `From` 属性类型为 `MailAddress`，这意味着你可以直接将该类的单个实例赋值给它。因为你可能有多个接收者，`To`\
  \ 属性是 `MailAddress` 对象的集合，因此你需要使用其 `Add` 方法将 `MailAddress` 实例添加到其中。\n\n### 练习 4\
  \ 解决方案\n\n要调用客户端验证函数，你需要如下所示设置 `CustomValidator` 的 `ClientValidationFunction` 属性：\n\
  \n```\n<asp:CustomValidator ID=\"CustomValidator1\" runat=\"server\"\n      ClientValidationFunction=\"\
  functionName\">*</asp:CustomValidator>\n```\n\n你必须添加到页面标记中的客户端函数必须具有以下签名：\n\n```\n\
  function functionName(source, args)\n{ ... }\n```\n\n`source` 参数包含对客户端 HTML 代码中实际的\
  \ `CustomValidator` 控件的引用。`args` 参数提供了有关数据的上下文信息，并允许你指示数据是否有效。参数的名称不必非是 `source`\
  \ 和 `args`；但是，当使用这些名称时，客户端函数看起来与其服务器端对应项尽可能接近。另一种常用的命名方案（用于 ASP.NET 中几乎所有其他事件处理程序）是分别使用\
  \ `sender` 和 `e`。\n\n### 练习 5 解决方案\n\n要告诉验证机制你检查的数据是否有效，你需要在自定义验证方法中设置 `args` 参数的\
  \ `IsValid` 属性。这适用于客户端和服务器端代码。以下代码段显示了如何在 `ContactForm.ascx` 控件的客户端验证方法执行此操作：\n\n\
  ```\nif (phoneHome.value != '' || phoneBusiness.value != '')\n{\n  args.IsValid\
  \ = true;\n}\nelse\n{\n  args.IsValid = false;\n}\n```\n\n## 第 10 章\n\n### 练习 1\
  \ 解决方案\n\n`ScriptManager` 控件是几乎所有与 Ajax 相关的操作的必需组件。它负责注册客户端 JavaScript 文件，处理与网站定义的\
  \ Web 服务服务的交互，并负责部分页面更新。如果你认为只需要少数页面需要 Ajax 能力，通常会将 `ScriptManager` 直接放置在内容页中。然而，你也可以将\
  \ `ScriptManager` 放在主页（Master Page）中，使其在整个站点可用。\n\n当你在主页中放置了 `ScriptManager` 后，你可以使用\
  \ `ScriptManagerProxy` 在内容页上注册单个 Web 服务或脚本文件。由于一个页面只能有一个 `ScriptManager`，因此你不能在使用带有\
  \ `ScriptManager` 的主页的内容页中再次添加另一个。`ScriptManagerProxy` 充当内容页与 `ScriptManager` 之间的桥梁，让你在注册服务的位置具有极大的灵活性。\n\
  \n### 练习 2 解决方案\n\n你可以通过向页面添加 `UpdateProgress` 控件来让用户知道正在进行部分更新。你通过其 `AssociatedUpdatePanelID`\
  \ 将此控件连接到 `UpdatePanel`。在 `<ProgressTemplate>` 内部，你可以定义你认为合适的任何标记来告知用户正在更新。一个典型的\
  \ `<ProgressTemplate>` 包含一个动画图标、一些文本或两者兼有。\n\n### 练习 3 解决方案\n\n要创建一个可供脚本调用的服务，你首先需要使用“添加新项”对话框向你的网站添加一个启用\
  \ AJAX 的 WCF 服务文件。为你创建的类文件已经应用了 `ServiceContract` 和 `AspNetCompatibilityRequirements`\
  \ 属性。\n\nVB.NET\n\n```\n<ServiceContract(Namespace:=\"\")\n<AspNetCompatibilityRequirements(\n\
  \          RequirementsMode:=AspNetCompatibilityRequirementsMode.Allowed)>\nPublic\
  \ Class NameOfYourService\n```\n\nC#\n\n```sharp\n[ServiceContract(Namespace = \"\
  \")]\n[AspNetCompatibilityRequirements(\n        RequirementsMode = AspNetCompatibilityRequirementsMode.Allowed)]\n\
  public class NameOfYourService\n```\n\n然后，你需要对该类中每个想要作为 Web 方法暴露的方法装饰以 `OperationContract`\
  \ 属性：\n\nVB.NET\n\n```\n<OperationContract()>\nPublic Function NameOfYourMethod(parameters)\
  \ As DataType\n```\n\nC#\n\n```sharp\n[OperationContract]\npublic DataType NameOfYourMethod(parameters)\n\
  ```\n\n一旦你在 `ScriptManager` 或 `ScriptManagerProxy` 控件中注册了 WCF 服务，你就可以从客户端 JavaScript\
  \ 如下所示调用该服务：\n\n```\nNameOfYourService.NameOfYourMethod(\n        parameters, successCallback,\
  \ errorCallback);\n```\n\n## 第 11 章\n\n### 练习 1 解决方案\n\n要实现这一点，你首先需要在 `Banner.ascx`\
  \ 的标记中将 `VerticalPanel` 的 `ClientIDMode` 设置为 `Static`。这使得处理面板内部控件的客户端 ID 变得更加容易：\n\
  \n```\n<asp:Panel ID=\"VerticalPanel\" runat=\"server\" ClientIDMode=\"Static\"\
  >\n```\n\n然后，你需要在 `VerticalPanel` 正下方添加一个文本为 Hide Banner 的 `<span>` 元素。`style` 属性将鼠标光标变为手形，以便用户在悬停时理解到该文本是可点击的。你需要添加一个\
  \ `runat` 属性和一个服务器端 ID，以便你可以在后台代码（Code Behind）中隐藏该链接。你还需要给它一个 `class` 属性，以便你可以使用\
  \ jQuery 找到该元素。你最终将得到这个 `span` 元素：\n\n```\n<span id=\"HideBanner\" style=\"cursor:\
  \ pointer;\" runat=\"server\"\n   class=\"HideBanner\">Hide Banner</span>\n```\n\
  \n最后一个面板下方的脚本块中，你需要添加以下内容：\n\n```html\n<script>\n  $(function ()\n  {\n    $('.HideBanner').bind('click',\
  \ function ()\n    {\n      $('#VerticalPanel').slideToggle('fast', function ()\n\
  \      {\n        if ($(this).css('display') == 'block')\n        {\n          $('.HideBanner').text('Hide\
  \ Banner');\n        }\n        else\n        {\n          $('.HideBanner').text('Show\
  \ Banner');\n        }\n      });\n    });\n  });\n</script>\n```\n\n最后，当横幅处于水平模式时，你需要在幅控件的后台代码中隐藏链接：\n\
  \nVB.NET\n\n```\nCase Direction.Horizontal\n  HorizontalPanel.Visible = True\n \
  \ VerticalPanel.Visible = False\n  HorizontalLink.HRef = NavigateUrl\n  HideBanner.Visible\
  \ = False\n```\n\nC#\n\n```sharp\ncase Direction.Horizontal:\n  HorizontalPanel.Visible\
  \ = true;\n  VerticalPanel.Visible = false;\n  HorizontalLink.HRef = NavigateUrl;\n\
  \  HideBanner.Visible = false;\n  break;\n```\n\n### 练习 2 解决方案\n\n`slideUp` 方法通过缓慢减小高度来隐藏元素。`slideDown`\
  \ 则相反，它通过缓慢增加元素的高度直到其完全可见。这两个方法除了其他参数外还接受一个 `speed` 参数，该参数可以接受固定值（`slow, normal`\
  \ 或 `fast`）或指定以毫秒为单位的速度数字。\n\n### 练习 3 解决方案\n\njQuery 的 document ready 函数在页面在浏览器中加载完成后触发，且仅在初始请求期间触发。`pageLoad`\
  \ 方法在页面首次加载以及异步回回后都会触发（例如在运行 `UpdatePanel` 时）。这种差异允许你选择所需的行为。需要在初始加载和回回后执行某些代码吗？选择\
  \ `pageLoad`。否则，选择 jQuery 的 document ready 函数。\n\n\n\n\n你使用 `Scripts` 文件夹下的特殊 `_references.js`\
  \ 文件来启用 IntelliSense。VS 将读取此文件并解析你使用此语法添加的所有 JavaScript 文件：\n\n```\n/// <reference\
  \ path=\"Path/To/File.js\" />\n```\n\n通过这种方式，你可以在原本不支持 IntelliSense 的文件（例如用户控件）或你未在网站中直接链接的\
  \ JavaScript 文件中使用 IntelliSense 了。\n\n# 第 12 章\n\n### 练习 1 答案\n\n`DELETE` 语句执行失败是因为\
  \ `Genre` 表的 `Id` 与 `Review` 表的 `GenreId` 之间存在关系。只要这种关系仍然有效，你就无法删除那些仍关联了评论的类型（Genre）。为了能够删除请求的类型，你需要先删除相关的评论，或者使用\
  \ `UPDATE` 语句将它们分配给不同的类型。练习 4 向你展示了如何实现这一点。\n\n### 练习 2 答案\n\n`Genre` 表和 `Review`\
  \ 表之间的关系是单向关系。该关系强制要求分配给评论的 `GenreId` 必须作为 `Genre` 表中的 `Id` 存在。同时，它阻止了你删除已有关评论的类型。然而，这种关系并不会阻止你从\
  \ `Review` 表中删除行。\n\n### 练习 3 答案\n\n要删除 `Id` 为 100 或更小的评论，你需要以下 SQL 语句：\n\n```\n\
  DELETE FROM Review WHERE Id <= 100\n```\n\n### 练习 4 答案\n\n在删除类型之前，你首先需要将现有评论重新分配给新类型。你可以使用以下\
  \ `UPDATE` 语句来实现：\n\n```\nUPDATE Review SET GenreId = 11 WHERE GenreId = 4\n```\n\
  \n这会将所有之前 `GenreId` 为 `4` 的评论的 `GenreId` 分为 `11`。这意味着 `Id` 为 `4` 的类型不再具有任何关联的评论，因此你现在可以使用以下\
  \ SQL 语句将其删除：\n\n```\nDELETE FROM Genre WHERE Id = 4\n```\n\n### 练习 5 答案\n\n要更新名称，你需要执行\
  \ `UPDATE` 语句。为了将受影响的行数限制为仅 Rock（摇滚）类型，你需要使用 `WHERE` 子句。你可以使用 `WHERE` 子句根据类型的 `Id`\
  \ 或其 `Name` 来过滤行。以下 SQL 语句在功能上是等价：\n\n```\nUPDATE Genre SET Name = 'Punk Rock' WHERE\
  \ Id = 7\nUPDATE Genre SET Name = 'Punk Rock' WHERE Name = 'Rock'\n```\n\n此代码假设当前\
  \ Rock 类型的 `Id` 为 `7`。\n\n# 第 13 章\n\n### 练习 1 答案\n\n此场景的最佳控件是 `GridView` 控件。它很容易设置，并且对数据的分页、更新和删除有内置支持。配合\
  \ `DetailsView` 控件，你可以为用户提供所有的 CRUD（增删改查）操作。要连接到你的数据库，你需要使用 `SqlDataSource` 控件。第\
  \ 14 章为你提供了 `GridView` 和 `SqlDataSource` 的替代方案。\n\n### 练习 2 答案\n\n对于简单的无序列表，你可能使用连接到\
  \ `SqlDataSource` 控件的 `Repeater` 控件是最好的。`Repeater` 控件最大的优势是它本身不产生任何 HTML 代码，从而允许你控制最终的标记。该控件的缺点是它不支持对数据的编辑或删除，如果你只需要以列表形式展示数据，这并不是问题。第\
  \ 14 章向你展示了如何使用 `Repeater` 控件。\n\n### 练习 3 答案\n\n`BoundField` 直接绑定数据源中的列，并提供的自定义其外观的方法有限。相比之下，`TemplateField`\
  \ 让你对字段的渲染方式具有完全控制权。因此，它是复杂场景的理想字段——例如，当你想在页面上添加验证控件，或者你想让用户使用不同的控件（如使用 `DropDownList`\
  \ 代替默认的 `TextBox`）时。\n\n### 练习 4 答案\n\n你应该始终将连接字符串存储在 `Web.config` 文件中。该文件有一个名为\
  \ `<connectionStrings>` 的元素，专门用于存储连接字符串。通过将它们存储在 `Web.config` 中，你可以非常方便地找到并修改连接字符串。如果你将它们存储在页面级，则必须在整个项目中搜索相关的连接字符串。\n\
  \n你可以使用表达式绑定语法来访问连接字符串。例如，要设置 `SqlDataSource` 中的连接字符串，你可以使用如下代码：\n\n```\nConnectionString=\"\
  <%$ ConnectionStrings:PlanetWroxConnectionString1 %>\"\n```\n\n为了使此代码生效，你需要在 `Web.config`\
  \ 文件中拥有类似下面的连接字符串：\n\n```\n<connectionStrings>\n  <add name=\"PlanetWroxConnectionString1\"\
  \ connectionString=\"Data\n    Source=(localdb)\\v11.0;AttachDbFilename=|DataDirectory|\\\
  PlanetWrox.mdf;\n        Integrated Security=True\"\n    providerName=\"System.Data.SqlClient\"\
  \ />\n</connectionStrings>\n```\n\n# 第 14 章\n\n### 练习 1 答案\n\n要从系统中获取最新的 10 条评论，你的查询需要两个重要的\
  \ LINQ 结构：首先，它需要一个 `Order By`（C# 中的 `orderby`）子句来按降序排列列表。然后它需要 `Take` 方法来获取结果中的前\
  \ 10 条评论：\n\nVB.NET\n\n```vb.net\nUsing myEntities As NewWroxEntities()\n  Dim recentReviews\
  \ = (From myReview In myEntities.Reviews\n                         Order By myReview.CreateDateTime\
  \ Descending\n                         Select New With\n                       \
  \     myReview.Title, myReview.Genre.Name\n                       }\n          \
  \            ).Take(10).ToList()\n  GridView1.DataSource = recentReviews\n  GridView1.DataBind()\n\
  End Using\n```\n\nC#\n\n```csharp\nusing (PlanetWroxEntities myEntities = new PlanetWroxEntities())\n\
  {\n  var recentReviews = (from myReview in myEntities.Reviews\n                \
  \      orderby myReview.CreateDateTime descending\n                      select\
  \ new \n                      {\n                        myReview.Title, \n    \
  \                    myReview.Genre.Name \n                      }).Take(10).ToList();\n\
  \  GridView1.DataSource = recentReviews;\n  GridView1.DataBind();\n}\n```\n\n此代码还使用了\
  \ `New` 关键字（C# 中的 `new`）创建一个仅包含评论标题和类型的匿名类型。\n\n### 练习 2 答案\n\n`ListView` 控件最大的优势是它结合了其他控件的优点。就像\
  \ `GridView` 控件一样，`ListView` 控件可以轻松地在网格格式中显示数据。此外，`ListView` 控件允许你插入新行，这种行为在 `DetailsView`\
  \ 和 `FormView` 等控件中可以，但在 `GridView` 中没有。\n\n最后，`ListView` 控件让你对发送到浏览器的标记具有完全控制权，这是只有\
  \ `Repeater` 控件才能开箱提供的重要功能。\n\n### 练习 3 答案\n\n首先，你需要更改 `PhotoAlbums` 文件夹中的 `Default.aspx`\
  \ 页面，使每个缩略图链接到详情页并将图片的 ID 传递给新页面。在 `Default.aspx` 中 `ListView` 控件的 `<ItemTemplate>`\
  \ 内，在原有 `Image` 控件周围添加此 `HyperLink` 控件：\n\n```xml\n<asp:HyperLink ID=\"HyperLink1\"\
  \ runat=\"server\"\n    NavigateUrl='<%# \"PictureDetails?Id=\" + Item.Id.ToString()\
  \ %>'>\n<asp:Image ID=\"Image1\" runat=\"server\" ImageUrl='<%# Item.ImageUrl %>'\n\
  \    ToolTip='<%# Item.ToolTip %>' />\n</asp:HyperLink>\n```\n\n注意 `NavigateUrl`\
  \ 是由静态文本 `PictureDetails?Id=` 和数据库图片的 ID 构建的。\n\n创建一个名为 `PictureDetails.aspx` 的新页面，并在标记中添加\
  \ `Image` 控件：\n\n```xml\n<asp:Content ID=\"Content2\" ContentPlaceHolderID=\"cpMainContent\"\
  \ runat=\"server\">\n  <asp:Image ID=\"Image1\" runat=\"server\" />\n</asp:Content>\n\
  ```\n\n\n\n\n最后，你需要在后台代码（Code Behind）的页面的 `Load` 事件中执行以下 LINQ 查询，以设置 `ImageUrl`：\n\
  \nVB.NET\n\n```vb\nProtected Sub Page_Load(sender As Object, e As EventArgs) Handles\
  \ Me.Load\n  Dim pictureId As Integer = Convert.ToInt32(Request.QueryString.Get(\"\
  Id\"))\n  Using myEntities As New PlanetWroxEntities()\n    Dim imageUrl As String\
  \ = (From picture In myEntities.Pictures\n                             Where picture.Id\
  \ = pictureId\n                             Select picture).Single().ImageUrl\n\
  \    Image1.ImageUrl = imageUrl\n  End Using\nEnd Sub\n```\n\nC#\n\n```csharp\n\
  protected void Page_Load(object sender, EventArgs e)\n{\n  int pictureId = Convert.ToInt32(Request.QueryString.Get(\"\
  Id\"));\n  using (PlanetWroxEntities myEntities = new PlanetWroxEntities())\n  {\n\
  \    string imageUrl = (from picture in myEntities.Pictures\n                  \
  \    where picture.Id == pictureId\n                      select picture).Single().ImageUrl;\n\
  \    Image1.ImageUrl = imageUrl;\n  }\n}\n```\n\n这段代码首先从查询字符串中获取图片的 ID，然后将其传递给 LINQ\
  \ 查询。\n\n`Single` 方法用于从 `Picture` 表中检索单张图片，然后使用其 `ImageUrl` 在浏览器中显示该图片。\n\n### 练习\
  \ 4 答案\n\n要删除该图片，你需要扩展 `ListView1_DeleteItem` 中的代码。你可以从即将删除的图片中检索 `ImageUrl`，将 URL\
  \ 转换为物理位置，并调用 `File.Delete` 删除图片，如下所示：\n\nVB.NET\n\n```vb\nDim fileName As String\
  \ = Server.MapPath(picture.ImageUrl)\nSystem.IO.File.Delete(fileName)\nmyEntities.Pictures.Remove(picture)\n\
  ```\n\nC#\n\n```csharp\nstring fileName = Server.MapPath(picture.ImageUrl);\nSystem.IO.File.Delete(fileName);\n\
  myEntities.Pictures.Remove(picture);\n```\n\n### 练习 5 答案\n\n要只显示至少有一条评论的类型，你只需要使用使用\
  \ `Where` 配合 `Count` 方法过滤掉空的类型即可：\n\nVB.NET\n\n```vb\nDim genresWithReviews = From\
  \ genre In myEntities.Genres\n                        Order By genre.Name\n    \
  \                    Where genre.Reviews.Count() > 0\n                        Select\
  \ New With {genre.Name, genre.Reviews}\n```\n\nC#\n\n```csharp\nvar genresWithReviews\
  \ = from genre in myEntities.Genres\n                        orderby genre.Name\n\
  \                        where genre.Reviews.Count() > 0\n                     \
  \   select new { genre.Name, genre.Reviews };\n```\n\n## 第 15 章\n\n### 练习 1 答案\n\
  \n`Page` 的 `Load` 事件始终在用户触发的事件（如 `Button` 控件的 `Click`）之前触发。\n\n### 练习 2 答案\n\n在用户插入或编辑评论后，要在下拉列表中预选正确的项目，你需要进行两处修改。首先，你需要更改\
  \ `AddEditReviewHandCoded.aspx` 页面中的 `Redirect` 语句，使其包含类型的 ID：\n\nVB.NET\n\n```vb\n\
  Response.Redirect(String.Format(\"Reviews.aspx?GenreId={0}\",\n      GenreList.SelectedValue))\n\
  ```\n\nC#\n\n```csharp\nResponse.Redirect(string.Format(\"Reviews.aspx?GenreId={0}\"\
  ,\n      GenreList.SelectedValue));\n```\n\n使用 `String.Format` 相比于在 VB.NET 中使用符号\
  \ (`&`) 或在 C# 中使用加号 (`+`) 进行普通的字符串拼接，会让代码更易读一些。\n\n如果你现在插入或编辑了一个新评论，你会发现类型的 ID 被传回到\
  \ `Reviews.aspx` 页面。在该上，你可以使用该 ID 在 `DropDownList` 控件中预选正确的项目，这可以通过在 `Page_Load`\
  \ 方法中使用以下代码实现：\n\nVB.NET\n\n```vb\nProtected Sub Page_Load(sender As Object, e As\
  \ EventArgs) Handles Me.Load\n  If Not Page.IsPostBack Then\n    Dim genreId As\
  \ String = Request.QueryString.Get(\"GenreId\")\n    If Not String.IsNullOrEmpty(genreId)\
  \ Then\n      DropDownList1.DataBind()\n      Dim myItem As ListItem = DropDownList1.Items.FindByValue(genreId)\n\
  \      If myItem IsNot Nothing Then\n        myItem.Selected = True\n      End If\n\
  \    End If\n  End If\nEnd Sub\n```\n\nC#\n\n```csharp\nprotected void Page_Load(object\
  \ sender, EventArgs e)\n{\n  if (!Page.IsPostBack)\n  {\n    string genreId = Request.QueryString.Get(\"\
  GenreId\");\n    if (!string.IsNullOrEmpty(genreId))\n    {\n      DropDownList1.DataBind();\n\
  \      ListItem myItem = DropDownList1.Items.FindByValue(genreId);\n      if ( my\
  \ != null)\n      {\n        myItem.Selected = true;\n      }\n    }\n  }\n}\n```\n\
  \n只有当页面从新请求加载（而不是从回传加载）时，这段代码才会触发。代码随后尝试在查询字符串中查找 `GenreId`。如果能找到，它将尝试在 `DropDownList`\
  \ 中查找具有该请求值的项目。由于 `DropDownList` 控件尚未绑定数据，因此它不包含任何项目。因此，你需要先调用 `DataBind()`。这会使用\
  \ EF 从数据库获取类型并将它们放入其中。\n\n### 练习 3 答案\n\n当 `DataSource` 发生异常时，你需要将 `ExceptionHandled`\
  \ 属性设置为 `True`，以防止“黄色死亡屏幕”。以下代码显示了如何更新错误信息。\n\nVB.NET\n\n```vb\nProtected Sub Sql1_Deleted(sender\
  \ As Object, e As SqlDataSourceEventArgs) Handles Sql1.Deleted\n  If e.ExceptionIsNot\
  \ Nothing Then\n      ErrorMessage.Text = \"抱歉，删除您的类型时发生了错误。\"\n    e.ExceptionHandled\
  \ = True\n  End If\nEnd Sub\n```\n\nC#\n\n```csharp\nprotected void Sql1_Deleted(object\
  \ sender, SqlDataSourceEventArgs e)\n{\n  if (e.Exception != null)\n  {\n    ErrorMessage.Text\
  \ = \"抱歉，删除您的类型时发生了错误.\";\n    e.ExceptionHandled = true;\n  }\n}\n```\n\n## 第 16\
  \ 章\n\n### 练习 1 答案\n\n*身份验证（Authentication）* 是向网站等系统证明你的身份。身份通过后，*授权（Authorization）*决定了你可以做什么。\n\
  \n### 练习 2 答案\n\n为了让 John 和所有 `Editors` 角色的用户访问 `Management` 文件夹，你需要扩展当前的 `roles`\
  \ 属性以包含 Editors，并添加一个 `users` 属性设置为 `John` 的 `allow` 元素：\n\n```xml\n<system.web>\n\
  \  <authorization>\n    <allow roles=\"Managers, Editors\" />\n    <allow users=\"\
  John\" />\n    <deny users=\"*\" />\n  </authorization>\n</system.web>\n```\n\n\
  `roles` 属性允许你指定多个由逗号隔开的角色。为了授予 John 账户访问，你需要添加一个额外的 `allow` 元素，然后在 `users` 属性中填写\
  \ John 的名字。\n\n从维护的角度来看，如果可能，将 John 加入 Managers 或 Editors 角色会好得多。然而，你可能会赋予 John\
  \ 比你想要的更多的权限（他可以访问 Manager 或 Editor 可以访问的任何内容）。通常，最好尽可能通过角色管理用户，但知道你也可以为个人账户授予必要的权限（或使用\
  \ `deny` 元素显式撤销这些权限）。\n\n### 练习 3 答案\n\n如果你想将所有用户重定向到同一个页面，你只需要设置 `DestinationPageUrl`：\n\
  \n```asp\n<asp:Login ID=\"Login1\" runat=\"server\" DestinationPageUrl=\"~/MyProfile.aspx\"\
  >\n```\n\n当用户成功登录后，将被自动带到 `MyProfile.aspx`。\n\n\n\n\n\n\n`LoginStatus` 仅显示一个简单的链接，指示用户是否已登录。默认情况下，当用户未登录时，显示的文本为\
  \ `Login`；当用户已登录时，显示 `Logout`。点击链接将把用户重定向到默认的 `Login` 页面，或者注销用户。\n\n`LoginView`\
  \ 在某些方面与之相似，它会根据用户当前是否已登录显示不同的内容。然而，由于该控件完全由模板驱动，因此你可以完全控制显示的内容。为了让你能够区分不同的用户角色，你可以使用\
  \ `RoleGroups` 元素来设置仅对特定角色用户显示的模板。\n\n## 第 17 章\n\n### 练习 1 答案\n\n你会将收藏的主题实现为一个\
  \ `String` 属性，并将其命名为 `FavoriteTheme`。为了确保你始终有一个有效主题，你还可以设置一个默认值。最后，你应该让该属性对匿名用户可见。你的最终个人资料属性可能如下所示：\n\
  \n```\n<add name=\"FavoriteTheme\" defaultValue=\"Monochrome\" allowAnonymous=\"\
  true\" />\n```\n\n为了支持匿名配置文件，你需要通过在 `Web.config` 文件的 `<system.web>` 直接子节点添加 `<anonymousIdentification>`\
  \ 元素来显式启用它们：\n\n```\n<system.web>\n  <anonymousIdentification enabled=\"true\" cookieName=\"\
  PlanetWroxAnonymous\" />\n```\n\n### 练习 2 答案\n\n根据你在问题看到的语法，你现在可以访问新属性并使用它来更改 `BasePage`\
