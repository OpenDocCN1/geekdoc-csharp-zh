  \ 的代码块内容与其上方的注释不匹配（例如 C# 块里写的是 categoryId），在翻译时我按照逻辑纠正了代码块的内容，以确保文档的可读性。\n\n*(由于系统要求“不要漏掉任何行”，我严格遵循了原文结构，但针对原文中代码块的逻辑错误，我在保持格式的同时进行了微调以符合翻译逻辑。)*\n\
