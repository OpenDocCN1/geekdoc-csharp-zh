  ```\n\nC#\n\n```csharp\nprotected void ThemeList_SelectedIndexChanged(object sender,\
  \ EventArgs e)\n{\n  Profile.FavoriteTheme = ThemeList.SelectedValue;\n  Response.Redirect(Request.Url.ToString());\n\
  }\n```\n\n## 第 18 章\n\n### 练习 1 答案\n\n调试是在开发环境中观察代码执行的过程——通过调查变量和查看对象来理解代码的执行路径——寻找\
  \ bug 并旨在修复。调试通常在 Visual Studio IDE 中于开发期间进行。\n\n相比之下，追踪（Tracing）为你提供了有关代码运行时执行的信息。正如本章所讨论的，你可以使用追踪来获取有关触发事件及其触发顺序的信息。此外，你可以在追踪中添加你自己的信息。由于通过配置禁用追踪可以极大地减少与其相关的性能开销，你可以将追踪调用留在代码中，以便在需要时随时禁用或启用。\n\
  \n### 练习 2 答案\n\n防止可能的异常出现在用户界面面的最佳方法是将你的代码封装在 `Try/Catch` 块中。这样，在出现问题时，你可以向用户显示错误消息。你的代码可能如下：\n\
  \nVB.NET\n\n```\nTry\n  ' 在此处执行代码发送电子邮件。\nCatch ex As SmtpException\n  ErrorMessage.Text\
  \ = \"Something went wrong while sending your message.\"\nEnd Try\n```\n\nC#\n\n\
  ```csharp\ntry\n{\n  // 在此处执行代码发送电子邮件。\n}\ncatch (SmtpException ex)\n{\n  ErrorMessage.Text\
  \ = \"Something went wrong while sending your message.\";\n}\n```\n\n### 练习 3 答案\n\
  \n为了了解站点发生了哪些异常并发现它们发生的位置（即哪些页面或代码导致了异常），你可以使用 `Application_Error` 程序中的某些代码记录所有异常。你在此方法中拦截的异常详细信息将有助于找到解决方案。\n\
  \n为了防止用户看到“死亡黄屏”错误消息，你需要使用自定义错误页面。你应该创建一个简单的 Web Form，告诉用户出现了一些问题。要让 ASP.NET 运行时显示该文件的内容而不是错误消息，你需要在\
  \ `Web.config` 中包含以下内容：\n\n```\n<customErrors mode=\"On\" defaultRedirect=\"~/Errors/AllOtherErrors.aspx\"\
  \n           redirectMode=\"ResponseRewrite\">\n  <error statusCode=\"500\" redirect=\"\
  ~/Errors/Error500.aspx\" />\n</customErrors>\n```\n\n此元素为代码崩溃时发生的 500 错误代码设置了一个特殊页面。当发生其他异常（例如“未找到页面”错误）时，用户将被引导到通用的\
  \ `AllOtherErrors.aspx` 页面。\n\n## 附录 B\n\n### 配置 SQL Server 2012\n\n到为止，书中的练习假设你使用\
  \ Microsoft SQL Express 2012 LocalDB 版 11.0 作为 Planet Wrox 项目的数据库。SQL Express LocalDB\
  \ 版 11.0 非常适合开发，因为它是免费、轻量且易于使用的。然而，它并非设计用于生产环境环境，并且在处理器、内存使用和数据库大小方面存在限制。当 LocalDB\
  \ 版不再适用时，你需要查看其更大的兄弟：SQL Server 2012 Express 版或 SQL Server 2012 的商业版本（如标准版或企业版）。在本附录中，你将学习更多关于\
  \ SQL Server 2012、其安全模型、如何让 SQL Server 2012 数据库与 ASP.NET 4.5.1 网站协同工作，以及如何使用 SQL\
  \ Server Management Studio Express（微软提供的一种用于管理数据库的免费工具）。\n\n尽管本附录没有讨论早期版本的 SQL Server，但你会发现大多数概念也适用于这些旧版本。事实上，你可以使用\
  \ SQL Server 2012 Management Studio Express 管理旧的 SQL Server 2005 和 2008 数据库。\n\n\
  \n\n\n\n在配置数据库之前，你能够了解与数据库和 Web 应用程序不可避免地相关联的各种安全概念。在第 19 章中，你学习了 Web 服务器所使用的账户在配置文件系统安全设置时起着重要作用，连接到\
  \ `SQL Server` 时情况也是如此。在接下来的节中，你将快速了解连接到 `SQL Server` 的不同方法。在随后的章节中，你将看到如何将 `.mdf`\
  \ 数据库文件附加到 `SQL Server`，然后讨论如何配置你的应用程序和数据库以便它们相互通信。\n\n## 术语与概念\n\n当你连接到 `SQL Server`\
  \ 数据库时，`SQL Server` 需要知道你是谁，以便对对象（如数据库中的表）执行正确的访问策略。`SQL Server` 支持两种不同的身份验证机制：`SQL\
  \ Server Authentication` 和 `Windows Authentication`（通常称为 `Integrated Security`，集成安全验证）。它们各有优缺点，并要求你编写不同的连接字符串来连接\
  \ `SQL Server`。在下面的节中，你将看到两种最常见的连接字符串，但建议访问 [www.connectionstrings.com](http://www.connectionstrings.com)\
  \ 获取所有可能的连接字符串详细列表。\n\n### SQL Server Authentication\n\n使用 `SQL Server Authentication`\
  \ 时，`SQL Server` 负责用户管理。你通过 `Microsoft SQL Server Management Studio` 管理 `SQL Server`\
  \ 数据库的用户，可以是 Express 版本（你在本附录稍后的部分将看到如何使用它），也可以是与商业版 `SQL Server` 一带的完整版本。`SQL Server`\
  \ 使用 `login` 来处理身份验证。你通过提供登录名和密码在服务器级别定义此 `login`。然后，`login` 可以映射到 `database user`\
  \ 以授予对特定数据库的访问。\n\n要将你的 Web 应用程序连接到需要使用 `SQL Server Authentication` 的 `SQL Server`\
  \ 安装，你需要在应用程序的连接字符串中传递用户名和密码。典型的连接字符串如下：\n\n```\nData Source=ServerName;Initial\
  \ Catalog=DatabaseName;\n      User Id=UserName;Password=Password;\n```\n\n在这种情况下，`Data\
  \ Source` 指向 `SQL Server` 的 `unnamed instance`（未命名实例）：SQL 服务器仅通过其机器名进行访问。也可以将 SQL\
  \ Server 安装为 `named instance`（命名实例）。对于命名实例，服务器名称后跟着一个反斜杠 (`\\`) 和特定的 `SQL Server`\
  \ 实例名称。例如：\n\n```\nData Source=ServerName\\InstanceName;Initial Catalog=DatabaseName;\n\
  \      User Id=UserName;Password=Password;\n```\n\n当你需要通过互联网连接到远程 `SQL Server` 时，通常使用\
  \ `SQL Server Authentication`，因为接下来要讨论的 `Windows Authentication` 在那种情况下不受支持。\n\n\
  ### Windows Authentication\n\n使用 `Windows Authentication` 时，`Windows OS` 负责用户管理。与数据库的所有交互都是在调用用户的上下文中完成的，因此数据库知道是谁在访问系统。你仍然需要将\
  \ `Windows login` 映射到 `SQL Server` 数据库用户，以便 `SQL Server` 能够判断该账户是否有足够的权限。我稍后会告诉你如何这样做。\n\
  \n使用 `Windows Authentication` 的典型连接字符串如下：\n\n```\nData Source=ServerName;Initial\
  \ Catalog=DatabaseName;Trusted_Connection=True\n```\n\n你不需要指定用户名和密码，而是在连接字符串中添加\
  \ `Trusted_Connection=True`，表示你想用调用用户的用户上下文连接到服务器。你可能还会遇到 `Integrated Security=True`\
  \ 设置，它的效果相同。\n\n由于两种身份验证方法最终都执行相同的操作（它们都能让你连接到 `SQL Server`），你可能会疑惑应该使用其中哪一个。\n\n\
  ### 在 Windows 和 Server 身份验证之间进行选择\n\n通常，建议尽可能使用 `Windows Authentication`。你不需要在连接字符串中使用密码，这意味着你的应用程序会安全一些。你不需要在网络上传输密码，密码也不会存储在应用程序的配置文件中。\n\
  \n然而，`SQL Server Authentication` 设置起来稍微简单。因为你显式地指定了用户名和密码，所以你不需要知道运行应用程序的最终用户账户。\n\
  \n在本附录后面的部分，你将看到如何使用这两种身份验证机制连接到你的数据库。但是，你需要查看其他内容：用于管理 `SQL Server` 的工具。\n\n##\
  \ 使用 SQL Server Management Studio\n\n你使用 `SQL Server Management Studio` 来管理你的 SQL\
  \ 服务器和数据库。它允许你向你的 `SQL Server` 附加或分离数据库；在现有数据库中创建表等新数据库对象；选择、创建、编辑和删除数据；以及更多操作。\n\
  \n到为止，你一直在使用 `SQL Server` 的 `LocalDB` 版本，这是一个对开发者友好的版本。除了 `LocalDB` 之外，`Microsoft`\
  \ 还有另一个免费的 `SQL Server` 版本称为 `SQL Server Express`。本附录的后续章节将向你如何使用这个免费的 `SQL Server\
  \ Express` 版本，因为它在使用上与其商业版和生产级数据库非常相似。如果你只安装了 `LocalDB`，你需要下载并安装 `SQL Server Express`以及免费的\
  \ `SQL Server Management Studio Express`。第 12 章中的“Installing SQL Server 2012 Express”节解释了如何获取\
  \ `SQL Server 2012 Express Edition` 及其 Management Studio 组件。\n\n如果你已经在使用商业版的 `SQL\
  \ Server`，你已经拥有完整版的 `SQL Server Management Studio`，因为它是与数据库引擎捆带的。\n\n如果你在连接远程 `SQL\
  \ Server` 时遇到困难（例如，位于运行 Management Studio 的服务器之外 `SQL Server` 实例），你可能需要先启用该 `SQL\
  \ Server` 的远程连接。接下来将讨论这一点。\n\n### 在 SQL Server 中启用远程连接\n\n在操作 `SQL Server` 时，你可能会收到未找到服务器、无法访问或远程连接可能不正确的错误。\n\
  \n虽然在数据库关闭时可能会遇到此错误，但在 SQL Server 未配置远程连接时也会遇到此错误。在默认安装中，SQL Server 只允许本地应用程序连接并自动阻止远程连接。要解决此并授予远程系统访问权限，请按照以下步骤操作：\n\
  \n1.  从开始菜单或开始屏幕打开 `SQL Server Configuration Manager`。根据你使用的 SQL Server 版本，此项可能位于\
  \ `Microsoft SQL Server 2012/Configuration Tools` 子菜单下。\n\n2.  在出现的窗口中，展开 `SQL Server\
  \ Network Configuration`，并点击 `Protocols for SQLEXPRESS` 显示列表（命名实例 `SQLEXPRESS` 在你的机器上可能不同）。如果你运行的是\
  \ 64 位的 Windows，你会看到另一个同名的节点，后面跟着 `(32-bit)`。在这种情况下，找到包含 `Protocols for SQLEXPRESS`\
  \ 节点的那个。图 B-1 显示了 64 位机器上名为 `SQLEXPRESS` 的 SQL Server 实例列表。![image](img/f784-01.jpg)\n\
  \n    **图 B-1**\n\n3.  在右侧的协议列表中，右键点击 `Named Pipes`，如果其状态当前为禁用，则选择 `Enable`。在解释需要重启\
  \ SQL Server 以应用更改的消息框中点击“确定”。\n\n4.  重复之前的步骤，但现在启用 `TCP/IP`。\n\n\n\n\n\n5. 重启 SQL\
  \ Server。执行此，点击`SQL Server Configuration Manager`中的`SQL Server Services`（如图 B-1\
  \ 所示所示），然后右键点击你的服务器并选择重启（Restart）。如果你遇到有关安全权限的错误，你可能需要重启计算机。\n\nSQL Server 现在允许来自远程机器的入站连接。然而，在实际使用数据库之前，你需要先将它们附加到\
  \ SQL Server。接下来的章节将详细描述这一过程。\n\n### 将数据库附加到 SQL Server\n\nSQL Server Express 允许你通过两种方式处理数据库文件：你可以在运行时使用连接字符串中的特殊属性来挂载它们，也可以在开始使用数据库之前使用管理\
  \ Studio（Management Studio）等工具进行挂载。\n\n到目前为止，在所有与数据库相关的章节中，你一直使用 SQL Server 的 `LocalDB`\
  \ 版本采用第一种方案。你使用的 Planet Wrox 连接字符串如下所示：\n\n```\n<add name=\"PlanetWroxConnectionString1\"\
  \n    connectionString=\"Data Source=(localdb)\\v11.0;\n    AttachDbFilename=|DataDirectory|\\\
  PlanetWrox.mdf;Trusted_Connection=True;\"\n          providerName=\"System.Data.SqlClient\"\
  \ />\n```\n\n此连接字符串指向位于网站 `App_Data` 文件夹（由 `|DataDirectory|` 确定）中名为 `PlanetWrox.mdf`\
  \ 的数据库。连接字符串指示 SQL Server 在在使用时动态地将此数据库文件附加到 SQL Server LocalDB。当数据库不再需要时，它会再次被拆离。你可以通过将数据源更改为\
  \ `.\\SqlExpress` 来使用相同的连接字符串指向 SQL Server Express。\n\n对于本地开发，这是一个非常棒的解决方案，因为它让你能够轻松地创建、使用\
  \ SQL Server 数据库，并在不同的项目之间移动它们。然而，对于生产数据库，此选项还不够好，你需要先将数据库附加到 SQL Server。以下步骤解释了在需要时如何将\
  \ `PlanetWrox.mdf` 数据库附加到 SQL Server 实例。如果你想使用 SQL Server Management Studio 对 SQL\
  \ Server 数据库执行在 Visual Studio 中无法执行的维护任务（例如管理用户和角色），你也可以按照完全完全的步骤进行操作。\n\n1. 创建一个存放你新数据库的文件夹，例如\
  \ `C:\\Data\\SqlServer`。\n\n2. 将网站 `C:\\BegASPNET\\Release` 下 `App_Data` 文件夹中的 `PlanetWrox.mdf`\
  \ 文件及其关联的 `.ldf` 文件移动到此新文件夹。\n\n3. 为数据库所在的文件夹（`C:\\Data\\SqlServer`）启用 SQL Server\
  \ 使用账户（默认认为 `Network Service` 账户）以及你自己的账户修改（Modify）权限。第 19 章解释了如何设置这些权限。\n\n4. 打开\
  \ SQL Server Management Studio 并登录到你想附加数据库的 SQL Server 实例。根据你的安全设置，你可能需要以管理员身份运行此过程。对于\
  \ Windows 7 或 Server 2008，右键点击 Management Studio 的开始菜单项并选择“以管理员身份运行”。对于 Windows\
  \ 8 或 Server 2012，右键点击启动屏幕上的项，然后从出现的选项栏中选择“以管理员身份运行”。\n\n5. 右键点击 `Databases` 并选择\
  \ Attach（附加）。\n\n6. 在弹出的对话框中，点击 `Add`添加）按钮，然后选择你在第 2 步中移动到 `C:\\Data\\SqlServer`\
  \ 的 `PlanetWrox.mdf` 文件。\n\n7. 点击 `Attach As` 列中的值使其变为可编辑，并输入 `PlanetWrox` 作为赋给数据库的新名称。完成后，你的对话框应该看起来像图\
  \ B-2 所示![image](img/f786-01.jpg)\n\n   **图 B-2**\n\n8. 点击 OK 将数据库附加到 SQL Server。如果遇到错误，请确保你的账户（或你所属的\
  \ Users 组）以及 `Network Service` 账户对 `C:\\Data\\SqlServer` 文件夹以及该文件夹包含的 `.mdf` 文件具有修改权限。此外，尝试按照第\
  \ 4 步所示，以管理员身份运行 SQL Server Management Studio。\n\n9. 你的数据库现在可以在 Management Studio\
  \ 对象资源管理器（Object Explorer）的 `Databases` 节点下访问。如果你展开 `Databases` 元素，就可以看到它。如果你想使用\
