  \ 第 2 章\n## 构建 ASP.NET 网站\n\n在本章你将学习到：\n\n*   你可以作为 ASP.NET 起点的不同项目类型\n*   可用于快速启动网站的不同项目模板\n\
  *   ASP.NET 中可用的各种文件类型及其用途\n*   创建现在和将来都易于管理的结构化网站的方法\n*   如何使用设计工具创建格式化的\n\n本章的\
  \ WROX.COM 代码下载\n\n你可以在 [www.wrox.com/go/begaspnet451](http://www.wrox.com/go/begaspnet451)\
  \ 的 Download Code 选项卡上找到本章的 [wrox.com](http://wrox.com) 代码下载。代码位于 Chapter 2 文件夹中。\n\
  \n要创建美观、功能全且成功的网站，你必须理解许多重要技术，包括超文本标记语言 (HTML)、ASP.NET、层级样式表 (CSS)、如 C# 或 VB 等服务器端编程语言以及如\
  \ JavaScript 等客户端语言。本章及后续章节为这些技术提供了坚实的基础，因此当你读完这本书后，应该对最重要的概念了如指。\n\n除了这些技术，你还必须理解上一章介绍的\
  \ Visual Studio IDE。你需要知道如何创建站点、添加页面并管理 Visual Studio 提供的所有工具栏和窗口。此外，你需要知道如何在 VS\
  \ 中使用 HTML 和服务器控件构建并设计网页。\n\n\n\n\n上一章向你快速概述了如何在 `VS` 中创建网站。你只需从 `File` 菜单中选择 `New\
  \ Web Site`，选择一种语言，选择标准的 `ASP.NET Web Forms Site` 模板，然后点击 `OK`。然而，`New Web Site`\
  \ 对话框包含的内容比你在上一章中看到的要多。你可能已经注意到，可以在许多不同的模板中进行选择，从而创建不同类型的站点。但在查看用于创建新网站基础的各种模板之前，你需要进一步了解一下\
  \ `VS` 中可用的不同`project types`。\n\n## 项目的项目类型\n\n在 Visual Studio 2013 中，你可以选择两种类型的项目来创建\
  \ ASP.NET Web Forms 网站：`Web Application Projects`（Web 项目）和 `Web Site Projects`（网站项目）。\n\
  \n### Web Application Projects\n\nWeb Application Projects 为团队工作或需要对网站内容及其编译和部署过程有更多控制的开发者通过\
  \ `VS` 构建网站变得更加容易。整个网站被作为一个项目管理，由一个单一的项目文件来跟踪网站的所有内容。\n\n在 `VS` 中，你通过 `File ⇒ New\
  \ Project` 对话框创建一个新的 Web Application Project。`Web` 类别包含一个模板 —— `ASP.NET Web Application`\
  \ —— 它允许你创建一个包含各种 ASP.NET 相关技术的 Web 应用，例如 `Web Forms`、`ASP.NET MVC` 和 `Web API`。这是微软“One\
  \ ASP.NET”计划的一部分，旨在将各种 Web 技术在 `Visual Studio` 中更整合在一起。有关这些技术的更多信息，请访问 [www.asp.net](http://www.asp.net)\
  \ 并点击 `Learn` 菜单项。\n\n### Web Site Projects\n\nWeb Site Projects 代表 `VS` 中用于网站的项目。你通过从\
  \ Visual Studio 的主菜单中选择 `File ⇒ New Web Site` 或 `File ⇒ New ⇒ Web Site` 来创建一个新的\
  \ Web Site Project。\n\nWeb Site Project 站点仅仅是一个包含许多文件和子文件夹的 Windows 文件夹。没有一个汇总文件（称为具有\
  \ `.vbproj` 或 `.csproj` 扩展名的 `project file`）来跟踪网站中的所有单独文件。你只需将 `VS` 指向一个文件夹，它就会立即作为网站打开。这使得创建站点副本、移动它们以及与其他分享变得非常简单，因为与你本地系统上的文件之间不存在依赖关系。由于缺乏中央项目文件，Web\
  \ Site Projects 通常被简单称为网站，这也是我在本书剩余部分使用的术语。\n\n### 在 Web Site Projects 和 Web Application\
  \ Projects 之间选择\n\n因为你有两个选项可以选择，你可能会疑惑应该选择哪种项目类型。通常情况下，Web Site Project 操作起来更容易一些。因为它只是一个文件夹，所以更容易将文件复制到不同的位置，例如另一个开发工作站或生产服务器。此外，代码文件的更改会被\
  \ Web 服务器捕获并自动应用，无需正式的部署过程。相反，如果你与开发团队在同一个站点上工作，Web Application Project 的效果更好，因为它规定了更正式的开发和部署过程，并且对与源控制版本控制系统（如微软的\
  \ Team Foundation Server）协作工作有更好的支持。此外，它还支持如 `ASP.NET MVC` 和 `Web API` 等其他技术。\n\n\
  本书使用 Web Site Project 模型，因为如果你是 ASP.NET 的初学者，这种模型更容易操作。然而，你会发现使用 Web Application\
  \ Project 模型构建的站点与 Web Site Projects 有许多共同点，这意味着你可以利用从从书中中学的知识来使用 Web Application\
  \ Project 模型构建站点。如果你想跟随本书学习，必须使用 Web Site Project 模型。在书中不指代特定项目类型时，我在泛指网站时交替使用 `website`\
  \ 和 `web application` 术语。\n\n现在你已经了解了不同的项目模型，下一步需要考虑的是不同的 `website templates` 及其选项。\n\
  \n## 选择正确的网站模板\n\n`VS` 中的 `New Web Site` 对话框包含不同的网站模板，每个模板都有其特定的用途。\n\n图 2-1 显示了\
  \ `VS` 中的 New Web Site 对话框。你可以根据你的 `VS` 版本通过选择 `File ⇒ New Web Site` 或 `File ⇒ New\
  \ ⇒ Web Site` 来打开此对话框。如果你的对话框看起来不像 图 2-1，请确保你选择的是 `File ⇒ New Web Site` 而不是 `File\
  \ ⇒ New Project`。\n\n![image](img/f036-01.jpg)\n\n**图 2-1**\n\n在左侧，你可以选择 Visual\
  \ Basic 或 Visual C# 作为站点的编程语言。中间部分显示了默认安装的 ASP.NET 网站模板。下一节将讨论其中的每一个模板。当你创建了了自己的模板或从其他方处安装了模板时，它们也会出现在此区域。\n\
  \n在模板列表上方，你可以选择想要使用的 .NET Framework 版本。对于书中的所有练习，请确保始终选择 `.NET Framework 4.5.1`。`ASP.NET\
  \ Empty Web Site` 模板在书中一直用于 Planet Wrox 网站。其他模板将在后续章节中简要描述，以便你了解如何使用它们。你系统上安装的模板的具体列表取决于\
  \ Visual Studio 的版本和安装的组件。只要你有 `ASP.NET Web Forms Site` 和 `ASP.NET Empty Web Site`\
  \ 项，不必担心。\n\n### ASP.NET Web Forms Site\n\n此模板允许你设置一个基础 ASP.NET 网站。它包含了许多文件和文件夹，以启动你的站点开发。不同的文件类型将在稍后讨论。特殊的\
  \ `App_Data` 文件夹以及 `Account` 文件夹中的页面功能将在本书后面讨论。此模板使用了一个名为 Bootstrap 的外部框架，该框架帮助你构建在桌面、平板和手机等多种设备上显示良好的网站。遗憾的是，当使用\
  \ Bootstrap 时，随 ASP.NET 提供的许多控件（如你在第 7 章中看到的 `Menu` 控件）无法正常渲染。这就是为什么我决定不在书中使用该框架，而是专注于\
  \ ASP.NET 提供的所有功能。对于你自己的项目，可以使用带有 Bootstrap 的 Visual Studio 模板，但你需要实现替代控件，如 `Menu`。你可以访问\
  \ [`getbootstrap.com`](http://getbootstrap.com) 了解更多 Bootstrap 的信息。\n\n### ASP.NET\
  \ Web Site (Razor v2 / Razor v3)\n\n你使用这些模板利用微软的 Web Pages 框架创建站点。你可以通过书籍《Beginning\
  \ ASP.NET Web Pages with WebMatrix》（Wrox, 2011, ISBN: 978-1-118-05048-4）了解更多 Web\
  \ Pages 的 信息。\n\n### ASP.NET Empty Web Site\n\nASP.NET Empty Web Site 模板提供两个配置文件（Web.config\
  \ 和 Web.Debug.config）。如果你有很多现有文件用于新网站，或者想从零开始创建站点，ASP.NET Empty Web Site 模板非常有用。你使用此模板作为书中示例网站的基础，并随着课程的进展添加文件和文件夹。\n\
  \n### ASP.NET Dynamic Data Entities Web Site\n\n此模板允许你创建一个灵活且强大的网站，用于管理数据库中的数据，而无需大量手动代码。书中没有讨论此模板，但你将在第\
  \ 14 章中学习更多该模板所使用的 Microsoft ADO.NET Entity Framework。\n\n### WCF Service\n\n\n\n\
  \n\n此模板允许你创建一个包含一个或多个 Windows 通信基础 (WCF) 服务的网站。WCF 服务与 Web 服务在某些方面相似，它们允许你创建可以通过网络调用的方法。然而，WCF\
  \ 服务比简单的 Web 服务要高级得多，并能为你提供更多的灵活性。你将在第 10 章中看到如何从浏览器创建和使用 Web 服务。\n\n尽管看起来你似乎在开始时就必须为正确的网站模板做出明确选择，但事实并非如此。因为\
  \ VS 中的 ASP.NET 网站本质上只是对一个文件夹的引用，因此很容易从一个模板向另一个模板添加类型。例如，正如你在第 10 章中所看到的，，向标准的 ASP.NET\
  \ Web Forms 站点（Site）或 ASP.NET 空网站（Empty Web Site）中添加 WCF 服务文件是完全可以的（而且非常常见）。\n\n\
  ## 创建和打开新网站\n\n你有多种不同的方法来创建新网站和打开现有网站。你这里的选择很大程度上取决于你访问网站的方式（是在安装了 Visual Studio\
  \ 的本地机器上，还是在远程机器上），以及你是否想使用 `IIS Express`（VS 自带的内置 Web 服务器）或完整版的 IIS —— 即 Windows\
  \ 自带的 Web 服务器。\n\n书中的所有示例都假设你从本地硬盘打开站点，并使用 `IIS Express`。它是 IIS 的精简版本，因为用它开发网站非常方便。然而，第\
  \ 19 章将向你展示如何使用和配置完整版本的 `Internet Information Services`（简称 `IIS`）。这种高级 Web 服务器随大多数版本的\
  \ Windows 一起提供，主要用于在 Windows 服务器版本上对你的网站进行生产托管，因为它能够在高流量场景下提供网页服务。\n\n### 创建新网站\n\
  \n下一个“尝试一试”（Try It Out）章节将引导你创建 Planet Wrox 网站，这是你在书中要操作的项目。除非另有说明，书中其余部分的所有练习题都假设你已经在\
  \ VS 中打开了该网站。练习要求你将网站存储在名为 `C:\\BegASPNET\\Site` 的文件夹中。请记住此文件夹名称，因为它在整个书中都会被用到。如果你决定使用不同的文件夹，请在书中每次看到此文件夹名称时，务必使用你自己的路径。确保不要在文件夹名称中使用哈希（`#`）等特殊字符或插入空格，否则你在开发网站时会遇到麻烦。最后，确保不要在\
  \ Windows `Documents` 文件夹（通常位于 `C:\\Users\\UserName\\Documents`）下创建此文件夹，因为当其他账户需要访问你的站点时，你会遇到问题。\n\
  \n如果你没有看到 Web 文件的 `.config` 扩展，不要担心。你将在后面的练习中看到如何查看文件扩展名。\n\n随着学习深入，你将向站点添加新的文件和文件夹。这些额外的文件和文件夹会出现在解决方案资源管理器（Solution\
  \ Explorer）中，也会出现在 `C:\\BegASPNET\\Site` 的 Windows 文件夹中。\n\n基于 Web 项目模板打开网站与创建新站点非常相似。在下一节中，你将快速概述在\
  \ VS 中打开现有站点的方法。\n\n### 打开现有网站\n\n与创建新站点一样，在 VS 中打开现有站点会在网站的源位置方面为你提供几个选项。你可以选择从本地文件系统、本地\
  \ IIS Web 服务器、使用 FTP 的远程服务器、使用 Microsoft FrontPage 服务器扩展的远程站点，或从诸如 Microsoft Team\
  \ Foundation Server 这样的中央源控制系统打开站点。图 2-5 显示了 VS 中的“打开 Web 站点”对话框。\n\n![image](img/f040-01.jpg)\n\
  \n**图 2-5**\n\n要进入此对话框，请在 VS 中选择`文件 ⇒ 打开 Web 站点`（不要误选`文件 ⇒ 打开项目`，因为该菜单项用于打开 Web\
  \ 应用程序项目）。书中的所有示例都假设你始终从本地文件系统打开 Planet Wrox 网站，使用`文件系统`按钮（它是窗口左列的第一个按钮）。然后在右侧窗格中，找到你的网站（在本例中为\
  \ `C:\\BegASPNET\\Site`）并点击`打开`按钮。\n\n你在上一个“尝试一试”中创建的站点是一个非常简陋的站点。为了让它更有用，你需要向它添加文件。你可以使用的许多文件类型以及将它们添加到站点的方式是接下来的讨论的话题。\n\
  \n## 在你的网站中处理文件\n\n一个 ASP.NET Web Forms 站点至少包含一个 Web Form（带有 `.aspx` 扩展的文件），但通常由更多文件组成。VS\
  \ 中提供了许多不同的文件类型，每种类型都有独特的功能。在下一节中，你将看到 VS 中使用的最重要的文件类型。此外，你还将学习将这些文件添加到你的站点的不同方法。\n\
  \n### ASP.NET 网站的多种文件类型\n\n为了让你了解在 ASP.NET 中可以使用多少不同的文件，图 2-6 显示了允许你向站点添加新文件的对话框（通过在解决方案资源管理器中右键点击你的网站并选择`添加\
  \ ⇒ 添加新项`，或从主菜单中选择`网站 ⇒ 添加新项`来访问）。\n\n![image](img/f041-01.jpg)\n\n**图 2-6**\n\n\
  为了更容易找到要查找的文件类型，可以使用对话框右上角的搜索框。只需输入你要查找的几个字母并按回车。VS 将根据你的搜索词过滤文件列表。\n\n你可以添加到站点的文件可以分为几类。最重要的文件——即你在书中使用的文件——将在接下来介绍。\n\
  \n#### Web 文件\n\nWeb 文件是 Web 特有的，可以被浏览器直接请求，也可以用于构建网页的一部分。下表列出了你常用的各种 Web 文件，并描述了每个文件的用途。\n\
  \n| 文件类型 | 扩展名 | 说明 |\n| :--- | :--- | :--- |\n| Web Form | `.aspx` | ASP.NET Web\
  \ Forms 网站的核心；代表用户在浏览器中查看的页面。 |\n| 主页 | `.master` | 允许定义网站的全局结构和外观。你将在第 6 章看到如何使用它。\
  \ |\n| 用户控件 | `.ascx` | 可在多个页面中使用的片段。第 8 章专门讨论用户控件。 |\n| HTML 页面 | `.html` | 可用于在网站中显示静态\
  \ HTML。 |\n| 样式表 | `.css` | 包含用于样式化 CSS 代码。你将在第 3 章学习更多 CSS。 |\n| Web 配置文件 | `.config`\
  \ | 包含整个站点使用的全局配置信息。你将在书中后面学习使用 `Web.config`。 |\n| 站点地图 | `.sitemap` | 以 XML 格式包含站点文件的分级表示。站点地图用于导航，将在第\
  \ 7 章讨论。 |\n| JavaScript 文件 | `.js` | 可以在客户端浏览器中执行的 JavaScript 代码。 |\n| 皮肤文件 | `.skin`\
  \ | 包含网站中控件的设计信息。皮肤将在第 6 章讨论。 |\n\n下一个“尝试一试”练习将向你展示如何向站点添加新的主页，该页面在书中都会被用到。\n\n\
  #### 代码文件\n\n向站点添加代码文件与添加 Web 文件的方法相同。下表描述了各种代码文件。\n\n| 文件类型 | 扩展名 | 说明 |\n\n\n\n\
  \n\n| WCF 服务 | `.svc` | 可以被其他系统（包括浏览器）调用，并可以包含可以在您的服务器上执行的代码。WCF 服务将在第 10 章中介绍。\
  \ |\n| :--- | :--- | :--- |\n| 类 | `.cs` / `.vb` | 可以包含用于编写您的网站的代码。请注意，代码后备（Code\
  \ Behind）文件（稍后会进行讨论）也具有此扩展名，因为它们本质上是类文件。C# 使用 `.cs` 扩展名的文件，Visual Basic 使用 `.vb`\
  \ 文件。 |\n| 全局应用程序类 | `.asax` | 可以包含在网站发生某些重要事件时触发的代码，例如应用程序启动或网站某处发生错误。您将在第 7 章及后续章节中学习如何使用此文件。\
  \ |\n\n除了代码文件（Code Files）分类，还有一组文件值得关注：数据文件（Data Files）。\n\n### 数据文件\n\n数据文件用于存储可以在网站和其他应用程序中使用的数据。该组由\
  \ XML 文件、数据库文件以及与数据处理相关的文件组成。\n\n| 文件类型 | 扩展名 | 说明 |\n| :--- | :--- | :--- |\n|\
  \ XML 文件 | `.xml` | 用于以 XML 格式存储数据。除了纯 XML 文件外，ASP.NET 还支持更多基于 XML 的文件，其中两个是您之前简单见过的：`Web.config`\
  \ 和站点地图（site map）。 |\n| SQL Server 数据库 | `.mdf` | 带有 `.mdf` 扩展的文件是由 Microsoft SQL\
  \ Server 使用的数据库。数据库将在第 12 章及后续章节中讨论。 |\n| ADO.NET 实体数据模型 | `.edmx` | 用于声明式访问数据库，无需编写大量重复代码。技术上讲，这并不是数据文件，因为它不包含实际数据。然而，由于它与数据库关联紧密，因此将其归类在此标题下合理的。您将在第\
  \ 14 章学习更多关于 ADO.NET Entity Framework 的知识。 |\n\n正如您在之前的“尝试一下”（Try It Out）中看到的，添加这些类型中的任何新文件都非常简单。将现有文件添加到网站也同样简单。\n\
  \n### 添加现有文件\n\n您在网站中创建的每个文件并不一定都是全新的。在某些情况下，重用其他项目的文件是有意义的。例如，您可能希望在多个网站之间重用 Logo\
  \ 或 CSS 文件。您可以通过右键点击解决方案资源管理器（Solution Explorer）中的网站并选择`Add ⇒ Add Existing Item`添加\
  \ ⇒ 添加现有项）来轻松添加现有文件。在出现的对话框中，您可以浏览文件，并可以按住 `Ctrl` 键选择多个文件。最后，当您点击`Add`添加）时，文件就会添加到网站中。您还可以使用复制和粘贴将文件从本地磁盘上的文件夹复制到\
  \ VS 中的网站。只需在文件管理器（File Explorer）中突出显示文件，按 `Ctrl+C` 复制，切换到 VS，点击解决方案资源管理器中的网站（或网站的子文件夹），然后按\
  \ `Ctrl+V`。文件随后将复制到您的网站文件夹中。\n\n然而，有一种更简单的方法可以向网站添加文件，当您需要向网站添加多个现有文件和文件夹时，这种方法可以节省大量时间：拖放式法。接下来的“尝试一下”将向您展示它是如何运作的。\n\
  \n如果您在 VS 之外向您的网站文件夹添加了文件，它们可能不会立即显示。您可以点击解决方案资源管理器工具栏上的刷新按钮来获取文件列表的最新副本。\n\n###\
  \ 组织您的网站\n\n由于网站由许多文件组成，将它们按功能分组并放在单独的文件夹中通常是一个好主意。例如，所有的样式表文件都可以放在名为 `Styles` 的文件夹中，包含\
  \ JavaScript 的 `.js` 文件可以放在 `Scripts` 中，用户控件可以放在 `Controls` 文件夹中，而主页（master pages）可以存储在名为\
  \ `MasterPages` 的文件夹中。这取决于个人喜好，但结构化且组织良好的网站更容易管理和理解。接下来的“尝试一下”将解释您如何通过将文件移动到新文件夹中来组织您的网站。\n\
  \nVS 的拖放功能使重新组织网站变得非常简单。只需选取一个或多个文件并将其拖动到新位置即可。如果您在扩展网站时继续应用此类组织实践，您会发现，明天或六个月后，当您需要时，您不会在定位正确文件时遇到任何问题。\n\
  \n### 特殊文件类型\n\n上一节列出的某些文件要求您将它们放在特殊文件夹中，而不是建议的可选组织文件夹结构中。当您尝试在其特殊文件夹之外添加文件时，IDE\
  \ 会向您发出警告，并提供创建文件夹并将文件放在那里的建议。例如，当您尝试添加类文件（带有 `.vb` 或 `.cs` 扩展名）时，您会收到图 2-8\n\n\
  **图 2-8**\n\n当出现此对话框时，始终点击“是”。否则，您的文件无法正常运行。其他文件类型也会出现类似的对话框，包括皮肤（skin）和数据库文件。\n\
  \n现在您已经很好了组成网站的不同文件类型，是时候详细查看其中一种了：`.aspx` 文件，也称为 Web Forms。\n\n## 使用 Web Forms\n\
  \n由 `.aspx` 文件表示 Web Forms 是任何 ASP.NET Web Forms 网站的核心。它们是用户访问您的网站时在浏览器中看到的实际页面。\n\
  \n正如您在上一节中学习的，Web Forms 可以包含 HTML、ASP.NET 控件、客户端 JavaScript、CSS 和编程逻辑的混合。为了方便查看所有代码如何显示在浏览器中，VS\
  \ 为您的页面提供了多种不同的视图。\n\n### Web Forms 的不同视图\n\nVS 允许您从几个角度查看您的 Web Form。当在文档窗口中打开带有标记的文件（如\
  \ Web Form 或主页）时，您会在窗口左下角看到三个按钮。通过这些可见在图 2-9 中的按钮，您可以切换不同的视图。此图显示了一个主页，您将在第 6 章中学习更多它的知识。\n\
  \n![image](img/f047-01.jpg)\n\n**图 2-9**\n\n源视图（Source View）是打开页面时的默认视图。它向您显示页面的原始\
  \ HTML 和其他标记，如果您想调整页面内容并且清楚想修改什么以及在哪里，它非常有用。正如我在上一节中解释的，我使用标记视图（Markup View）而不是源视图（Source\
  \ View）来指代 ASPX 和 HTML 页面的标记。\n\n\n\n\n\n“设计”（Design）按钮允许你将文档窗口切换到设计视图（Design View），这让你了解页面最终呈现的形式。在设计视图中，你可以使用“视图”（View）主菜单中的“视觉辅助”（Visual\
  \ Aids）和“格式标记”（Formatting Marks）子菜单来控制换行符、边界和空格等视觉标记。这两个子菜单都提供了一个名为“显示”（Show）的菜单项，允许你一次性开启或关闭所有视觉辅助。如果你想了解页面在浏览器中的最终效果，将两者都关闭是很有用的。然而，你应该只使用设计视图来获取页面最终效果的*思路*。尽管\
  \ VS 拥有一个出色的渲染引擎，可以在设计视图中很好地渲染页面，但你应该始终在不同的浏览器中检查你的页面，因为你在 VS 中看到的是页面经过处理之前的标记。页面上的服务器控件可能会输出\
  \ HTML，从而改变页面在浏览器中的外观。因此，建议尽可能在浏览器中查看页面，以便检查其显示是否符合你的预期。还建议你尽可能在能用到的不同浏览器中测试你的网站，因为不同浏览器在渲染网页的方式上可能存在细微差异。Planet\
  \ Wrox 网站是针对最新版本的 Microsoft Internet Explorer、Firefox、Google Chrome、Safari 和 Opera\
  \ 开发和测试的。你将在书的不同位置看到这些浏览器的截图。在第 18 章中，你将学习浏览器链接（Browser Link），它可以让跨浏览器测试变得简单得多。\n\
  \n“分割”（Split）按钮允许你同时查看设计视图和标记视图（Markup View），如图 2-10\n\n**图 2-10**\n\n如果你想看到 VS\
  \ 在向页面设计视图添加控件时生成的代码，拆分视图是非常棒的。反过来也也非常有用：当你在标记视图中更改页面的标记时，你可以看到它在设计视图中的最终效果。有时设计视图会与标记视图不同步。如果出现这种情况，设计视图顶部会出现一条消息。只需点击该消息或保存整个页面即可更新设计窗口。\n\
  \n你可以使用 `Ctrl+Page Up` 和 `Ctrl+Page Down` 键在三种不同的模式之间循环。\n\n如果你希望页面以不同于标记视图的视图打开，请选择\
  \ `Tools ⇒ Options`（工具 ⇒ 选项）。然后展开 `HTML Designer`，在“常规”（General）类别下设置你偏好的视图。或者，在\
  \ VS 右角的快速启动文本框中输入 `HTML Designer General`（可以通过按 `Ctrl+Q` 访问），然后点击列表中出现的项目。\n\n\
  除了标记视图窗口中看到的 HTML 和其他标记外，Web 表单（Web Form）还可以包含 C# 或 Visual Basic .NET 代码。这些代码放置的位置取决于你创建的\
  \ Web 表单类型。下一节将详细解释你拥有的两个选项。\n\n### 在代码后置（Code Behind）和内联代码页面之间选择\n\nWeb 表单有两种形式：一种带有*代码后置*（Code\
  \ Behind）文件的 `.aspx` 文件（文件名与 Web 表单同名，额外带有 `.vb` 或 `.cs` 扩展），另一种是嵌入代码 `.aspx` 文件，通常称为带有*内联代码*（inline\
  \ code）的 Web 表单。虽然在第 5 章之前不会看到很多代码，但理解这些类型 Web 表单的区别至关重要。起初，带有内联代码的 Web 表单似乎更容易理解。因为编写你的网站所需的代码就是同一个\
  \ Web 表单的一部分，你可以清楚地看到代码与文件之间的关系。然而，随着页面变得越来越大以及你为其添加更多功能，将代码放在单独的文件中通常会更简单。这样，代码就与标记完全分离，使你能够专注于手头任务。\n\
  \n在下一个练习中，你将添加两个文件，以演示代码后置和内联代码之间的区别。\n\n在上一个练习中，你学习了如何添加一个包含简单 `Label` 控件的页面。此外，你还看到了如何编写一些代码用今天的日期和时间更新标签。你现在可以忽略这些代码；它们只是为了演示代码后置和内联代码之间的区别。在第\
  \ 5 章中，你将学习更多关于 Visual Basic 和 C# 编程。\n\n为了制作引人入目的页面，你显然需要比仅仅显示今天日期时间的简单 `Label`\
  \ 控件多的内容。下一节将向你如何向页面添加内容和 HTML，以及如何对其进行样式设置和格式化。\n\n#### 向你的页面添加标记\n\n你有多种方法可以向页面添加\
  \ HTML 和其他标记。首先，你可以直接在标记视图窗口中输入它们。但这并不总是最佳选择，因为这强迫你手动输入大量代码。为了更方便地在页面插入新的 HTML 并对其应用格式，设计视图窗口提供了许多实用的工具。这些工具包括格式化工具栏以及“格式”（Format）和“表格”（Table）菜单项。要让这些工具生效，你需要让文档处于设计视图。如果你在分割视图模式下工作，必须确保设计视图部分具有焦点，否则你会发现大多数工具都是不可用的。\n\
  \n#### 插入和格式化文本\n\n你可以在设计视图和标记视图中输入文本。只需将光标置于所需位置并开始输入。当你切换到设计视图时，格式化工具栏就会可用，如图\
  \ 2-15 所示。\n\n![image](img/f054-01.jpg)\n\n**图 2-15**\n\n工具栏上的许多按钮与其他环境相同。例如，`B`按钮会将文本加粗。同样，`I`\
  \ 和 `U` 按钮分别将文本设置为斜体下划线。标记为“块”（Block）的下拉列表允许你插入 HTML 元素，如用于段落的 `<p>`、用于标题的 `<h1>`\
  \ 到 `<h6>` 以及用于列表的 `<ul>,<ol>` 和 `<li>`。你可以直接从下拉列表中选择项目插入页面，也可以先选择文本，然后从列表中选择合适的块元素将其包裹在标签内。\n\
  \n在下一个“尝试一下”中，你将看到如何使用这些工具创建 Planet Wrox 网站的首页。\n\n到为止，练习一直集中在向页面添加和设置文本上。然而，VS\
  \ 也允许你插入其他 HTML 元素，例如表格和列表。下一节将向你展示它是如何工作的。\n\n#### 添加表格和其他标记\n\n\n\n\n任何网站的一个重要部分都是连接你站点各页面的链接。链接允许访问者从一个页面跳转到另一个页面，可以在同一个站点内，也可以到互联网上完全不同的站点。你有几种方法创建页面之间的链接，包括：\n\
  \n*   HTML `<a>` 元素，在本章将对其进行解释。\n*   使用 `<asp:HyperLink>` ，将在第 7 章中讨论。\n*   通过代码编程实现。这将在本书后部分讨论。\n\
  \n下面的练习将向你展示从一个页面链接到另一个页面多么简单。\n\n在下一章中，你将运用在本章中学关于页面创建和格式化的知识，该章节将涉及如何使用 `CSS`\
  \ 设计网页。\n\n除了格式化工具栏和表格菜单等视觉工具外，Visual Studio 还有另一种快速在页面中插入代码的极佳方法：代码片段（`code snippets`）。`code\
  \ snippets` 允许你只需几次击键即可插入大段代码。你将在下一章看到代码片段的应用。\n\n## 适用于 Web 表单的实用技巧\n\n以下是一些关于使用\
  \ Web 表单（Web Forms）的技巧：\n\n*   优先使用带有后台代码（Code Behind）的 Web 表单，而不是带有内联代码（inline\
  \ code）的表单。虽然起初你可能没有感觉到它们之间的差异，但随着你的站点和页面的增长，你会发现处理代码与标记分离的页面更容易维护。\n*   花些时间熟悉\
  \ `Format`（格式）和 `Table`（表格）菜单中的不同菜单项。它们大部分生成插入到你页面中的 HTML 元素。查看为你生成的 HTML 元素和属性，并尝试直接在代码中以及通过菜单和工具栏对它们进行修改。通过这种方式，你可以对各种可用标签及其行为有一个良好的感。\n\
  *   尝试使用链接来连接你站点中的页面。注意 `VS` 如何根据你所链接的页面位置创建不同的链接。第 7 章将更详细地讨论链接以及在你的站点中引用页面的各种方法。\n\
  \n## 总结\n\n本章向你介绍了一些重要主题，这些主题帮助你构建可维护且结构化的 ASP.NET 网站。理解不同项目类型和模板之间的差异，使你仅需所需的文件即可启动\
  \ Web 项目。\n\n这同样适用于你可以添加到站点中的不同文件类型。由于每种文件类型都有特定的用途，因此意识到其用途以及你如何使用该文件至关重要。\n\n\
  构建 ASP.NET 网页时执行的一个常见活动是向页面添加标记。正如你在本章和上一章中看到的，标记有几种形式，包括纯 HTML 和 ASP.NET 控件。知道如何使用\
  \ `VS` 提供的许多菜单选项和工具栏向你的页面中添加这些标记，对于构建美观的网页至关重要。\n\n现在你已经对创建和修改 Web 表单有了扎实的理解，是时候看看你如何通过几个控件将那些单调的黑白页面变成吸引人的网页了。下一章将向你展示如何使用\
  \ `VS` 中的许多 `CSS` 工具来创建所需的效果。\n\n### 本章你学到了\n\n| 术语 | 描述 |\n| :--- | :--- |\n| **Code\
  \ Behind (后台代码)** | 一种页面模型，服务器端代码存储在单独的代码文件中 |\n| **Design View (设计视图)** | 提供你页面的图形化表示\
  \ |\n| **File Types (文件类型)** | ASP.NET 支持许多不同的文件类型，包括 Web Forms (`.aspx`)、主页 (`.master`)、CSS\
  \ 文件 (`.css`)、JavaScript (`.js`) 和 SQL Server 数据库 (`.mdf`) |\n| **Inline Code (内联代码)**\
  \ | 一种页面模型，服务器端代码存储在与标记相同文件中 |\n| **Markup View (标记视图)** | 允许你查看页面的标记 |\n| **Project\
  \ Templates (项目模板)** | 通过设置针对特定场景的站点来快速启动 Web 开发 |\n| **Project Types (项目类型)** |\
  \ Visual Studio 提供两种项目类型：应用程序项目和站点项目 |\n| **Split View (拆分视图)** | 允许你同时查看标记视图和设计视图\
  \ |\n| **Web Form (Web 表单)** | 呈现你的用户界面 |\n\n# 第 3 章：设计你的网页\n\n### 本章你将学习：\n\n*\
  \   什么是 `CSS` 以及你为什么需要它\n*   `CSS` 的各种方式以及如何编写它\n*   `VS` 提供的用于更改网页外观的工具\n\n###\
  \ 用于本章的 CSS 代码下载 (WROX.COM CODE DOWNLOADS)\n\n你在前两个章节中创建的页面看起来平淡且单调，因为它们缺乏样式信息。为了装饰你的页面，你需要一种改变外观的办法。`CSS`\
  \ 在 ASP.NET 网页中的相关性以及需要，你需要先理解 HTML 的局限性。\n\n## 为什么你需要 CSS？\n\n在互联网的早期，网页主要由文本和图像组成。文本使用纯\
  \ HTML 进行格式化，使用 `<strong>` 等标签加粗文本，使用 `<font>` 标签影响字体、大小和颜色。Web 开发人员很快意识到他们需要更多功能来格式化页面，因此创建了\
  \ `CSS` 来解决 HTML 的局限性。\n\n### 使用 HTML 格式化的问题\n\n使用 HTML 进行格式化的问题之一是它为样式化提供的选项有限。你只能使用\
  \ `<em>` 和 `<strong>` 等元素来更改文本外观。在之前的 HTML 版本中，你还可以使用 `<font>` 元素和如 `bgcolor` 等属性来进一步更改\
  \ HTML 元素的外观。这些元素和属性在 HTML5 中已废弃。你还有许多其他属性可以用于更改链接在页面中的外观。\n\n显然，这套功能不足以创建用户期望和要求的吸引人的网页。\n\
  \nHTML 的另一个对你构建网页的影响更大的问题是样式信息应用到页面的方式。考虑在 CSS 广泛应用之前，许多网站中常见的示例：\n\n```html\n<p><font\
  \ face=\"Arial\" color=\"red\" size=\"+1\">\n  这是 Arial 字体的红色文本，并且比默认文本稍大。\n</font></p>\n\
  ```\n\n这段代码片段的问题在于，实际的（（`<p>` 元素中的文本）与呈现（示例中 `<font>` 标签对文本的格式化）混合在了一起。理想情况下，两者应该是分离的，这样修改其中一个时而不会影响另一个。\n\
  \n\n\n想象一下你使用了 `<p>` 和 `<font>` 元素来为你网站每个页面的第一段进行标记。当你决定将字体颜色从红色改为深蓝色时，会发生什么？或者如果你的公司视觉识别要求使用\
  \ Verdana 字体而不是 Arial 呢？你将访问网站的每一个页面并进行更改。\n\n除了可维护性外，HTML 格式化的另一个问题是，你无法在用户的浏览器运行时轻松地更改格式。使用上一个代码段中的\
  \ HTML，无法让你的访问者更改字体大小或颜色等设置，而这是帮助视力障碍人士的常见需求。如果你想为访问者提供一个字体较大或颜色不同的备用页面版本，你必须创建一个原始页面的副本并进行必要的更改。\n\
  \nHTML 格式化的最后一个问题是，页面中额外的标记会显著增加页面的大小。这导致下载和显示速度变慢，因为这些信息需要随着网站的每个页面一起被下载。它还让页面维护变得更加困难，因为你必须滚动浏览巨大的\
  \ HTML 文件来寻找你需要的内容。\n\n总而言之，使用 HTML 进行格式化存在以下问题：\n\n*   它的功能集严重限制了你的页面所需的格式化可能性。\n\
  *   数据和演示混合在同一个文件中。\n*   HTML 无法让你在浏览器运行时轻松地更改格式。\n*   所需的格式标签和属性使你的页面变得更大，从而导致加载、显示和维护速度变慢。\n\
  \n幸运的是，CSS 允许你克服所有这些问题。\n\n### CSS 如何解决格式问题\n\nCSS 的设计旨在以几乎所有可能的方式格式化你的网页。它提供了一系列丰富的选项来更改网页的每个细微方面，包括字体（大小、颜色、字体族等）、颜色和背景颜色、HTML\
  \ 元素周围的边框、元素在页面中的位置等。今天，所有主流浏览器都理解 CSS，因此它是网页视觉呈现的语言，并在 Web 开发者中非常流行。\n\nCSS 通过允许你将在外部文件中定义所有的格式信息，克服了数据与演示混合的问题。你的\
  \ ASPX 或 HTML 页面可以引用这些文件，浏览器将为你应用正确的样式。通过这种分离，HTML 文档包含了你想要显示的*内容**），而 CSS 文件定义了你想要*如何*显示它，这使你能够更改或替换其中一个文档，而让另一个文档保持不变。此外，你也可以将\
  \ CSS 直接放置在 HTML 或 ASPX 页面中，这让你有机会在需要的地方精确地添加小段 CSS 代码。在 HTML 或 ASPX 页面中直接放置 CSS\
  \ 时你应该保持谨慎，因为你无法无法从单一的中心化位置控制样式信息了。\n\n由于你可以将所有 CSS 代码放置在单独的文件中，很容易让用户在不同样式之间做出选择——例如，一种字体较大的样式。你可以创建一个外部样式表的副本，进行必要的更改，然后将这种备用样式表提供给用户。你在第\
  \ 6 章讨论 ASP.NET 主题时会看到它是如何工作的。\n\n分离样式表文件的另一个优点是减少了你网站所需的带宽。样式表不会随着每次请求而改变，因此浏览器在第一次下载样式表时会保存一个本地副本。从那时起，它将一直使用这个缓存副本，而不是反复从服务器请求它。有时，当浏览器没有下载包含你更改的最新\
  \ CSS 文件时，这种缓存可能会产生不利影响。如果你发现浏览器没有获取你对 CSS 文件所做的更改，请在浏览器中使用 `Ctrl+F5` 或 `Ctl+R`（而不是在\
  \ VS 中）从服务器获取一份全新的副本。\n\n现在你已经知道了为什么 CSS 如此重要，现在是时候了解它的外观以及如何使用它了。\n\n# CSS 简介\n\
  \n从语法角度来说，CSS 是一门容易学习的语言。它的“语法”仅包含几个概念。这使得它相对容易上手。让 CSS 变得有点困难的是所有主流浏览器渲染网页的方式。尽管几乎每个现代桌面浏览器都理解\
  \ CSS，但在根据 CSS 标准显示页面时，它们都有自己的奇癖之处。这个标准由维护 HTML 标准的同一组织——万维网联盟（简称 `W3C`）维护，它有三个不同的版本：1.0、2.1\
  \ 和 3.0。在这三个版本中，2.1 是目前最适用的版本。它包含了 1.0 版本包含的所有内容，并在此基础上增加了许多可能性。它也是 VS 默认使用并生成的版本。3.0\
  \ 版本目前正在开发中，预计在主流浏览器对其它提供稳健支持之前还需要一段时间时间。\n\n在查看 CSS 的实际语法之前，先看一个示例是一个好主意。在接的练习中，你将编写一个简单的\
  \ ASPX 页面，其中包含一些 CSS 来格式化页面的内容。这有助于理解 CSS 语言，该语言将在接下来的章节中进行详细的讨论。\n\n下一节将深入探讨 CSS\
  \ 的语法，为你提供关于选择器、属性和值的更详细的视图。\n\n### CSS —— 语言\n\n正如你在之前的“尝试一下”练习中看到的，级联样式表实际上是规则的集合。一条规则是选择器与一个或多个声明的组合，而这些反过来又可以拆分为属性和值。你可能对过去几段话中引入的所有新术语感到有些头晕，因此在下一节中，你将再次看到大部分术语，并附有详细的解释。\n\
  \n### 样式表\n\n样式表包含了应用于页面元素的所有相关样式信息。在最简单的形式下，样式表如下：\n\n```\nh1\n{\n  color: Green;\n\
  }\n```\n\n样式表也可以包含多个规则，正如练习所示。同时，每个规则可以包含多个声明，允许你将它们组合在一个选择器下：\n\n```css\nh1\n{\n\
  \  font-size: 20px;\n  color: Green;\n}\n```\n\n你刚刚看到的代码与以下代码在功能上是等等的：\n\n```css\n\
  h1\n{\n  font-size: 20px;\n}\nh1\n{\n  color: Green;\n}\n```\n\n将两个声明组合在同一个选择器下的紧凑形式更容易阅读、理解和维护，因此建议尽可能使用这种语法。\n\
  \n为了对页面元素应用样式，浏览器必须知道三件事：\n\n*   页面上的哪个元素需要样式？\n*   元素的哪个部分需要样式？\n*   你希望该部分的样式如何？\n\
  \n这些问题的答案由选择器、属性和值提供。\n\n#### 选择器\n\n顾其实名，选择器用于选择或指向页面中的一个或多个特定元素。可以使用许多选择器，让你对想要样化的元素进行精细控制。选择器回答了第一个问题：页面上的哪个元素需要样式？下一节将向你展示四种最重要的选择器类型。\n\
  \n##### 通用选择器\n\n通用选择器用星号 (`*`) 表示，适用于页面上的所有元素。你可以使用通用选择器设置全局设置，例如字体族。以下规则将页面上所有元素的字体设置为\
  \ Arial：\n\n```css\n*\n{\n  font-family: Arial;\n}\n```\n\n##### 类型选择器\n\n\n\n\n\
  类型选择器（Type selector）允许你指向特定类型的 HTML 元素。使用类型选择器，所有该类型的 HTML 元素都将采用相应的样式。\n\n```\n\
  h1\n{\n  color: Green;\n}\n```\n\n此类型选择器现在应用于你代码中所有的 `<h1>` 元素，并将它们变为绿色。类型选择器不区分大小写，因此你可以同时使用\
  \ `h1` 和 `H1` 来引用同一个标题。我更倾向于对类型选择器使用全小写，这也是你将在本书中看到的写法。\n\n## ID 选择器 (The ID Selector)\n\
  \nID 选择器始终以哈希符号（`#`）开头，允许你指向页面中的单个元素。在 HTML 或 ASPX 页面中，你可以使用 `id` 属性为元素分配唯一的 ID。通过\
  \ ID 选择器，你可以更改该单个元素的行为，如下：\n\n```css\n#IntroText\n{\n  font-style: italic;\n}\n\
  ```\n\n由于你可以在网站的多个页面中重用此 ID（它只需要在单个页面内是唯一的），你可以使用此规则快速更改每个页面中使用一次但在网站中使用多次的元素外观，例如，使用以下\
  \ HTML 代码：\n\n```html\n<p id=\"IntroText\">I am italic because I have the right\
  \ ID.</p>\n<p id=\"BodyText\">I am NOT italic because I have a different ID.</p>\n\
  ```\n\n在此示例中，`#IntroText` 选择器更改了第一个段落的字体——该段落具有匹配的 `id` 属性——但保持另一个段落不变。ID 选择器是区分大小写的，请确保\
  \ `id` 属性和选择器始终使用相同的大小写。\n\n注意，选择器在名称中使用哈希符号（`#`），但你在 `id` 属性中不需要这个符号。\n\n#### 类选择器\
  \ (The Class Selector)\n\n类选择器（Class selector）允许你通过 `class` 属性对多个 HTML 元素进行样式设置。当你想要对多个不相关的\
  \ HTML 元素应用相同类型的格式时，这非常有用。以下规则将所有 `class` 属性设置为 `Highlight` 的 HTML 元素的文本颜色改为红色并加粗：\n\
  \n```css\n.Highlight\n{\n  color: Red;\n  font-weight: bold;\n}\n```\n\n以下代码段使用\
  \ `Highlight` 类使 `<span>` 元素和链接（`<a>`）的内容以加粗字体显示：\n\n```html\nThis is normal text\
  \ but <span class=\"Highlight\">this is Red and Bold.</span>\nThis is also normal\
  \ text but \n   <a href=\"CssDemo.aspx\" class=\"Highlight\">this link is Red and\
  \ Bold as well.</a>\n```\n\n注意，选择器在名称中使用句号（`.`），但你在 `class` 属性中引用选择器时不需要这个句号。`class`\
  \ 属性非常有用，因为它允许你为许多不同的用途重用一段 CSS，无论使用该类的 HTML 元素是什么。类选择器是区分大小写的，因此请确保输入正确（或者可能地让\
  \ IntelliSense 帮助你从列表中选择类）。\n\nCSS 支持更多类型的选择器，让你对想要的目标元素有更多的控制能力，但你刚刚看到的这四种类型是最广泛使用的。\n\
  \n## 分组与组合选择器 (Grouping and Combining Selectors)\n\nCSS 还允许你通过逗号分隔多个选择器来对其进行*分组*。如果你想对不同的元素应用相同的样式，这非常有用。以下规则将页面中的所有标题都变为红色：\n\
  \n```css\nh1, h2, h3, h4, h5, h6\n{\n  color: Red;\n}\n```\n\n此外，通过 CSS 你还可以*组合*选择器，允许你按层级结构指向页面中的特定元素。你可以通过用空格分隔选择器来实现。以下示例目标是所有位于\
  \ `id` 为 `MainContent` 的 `<section>` 元素内的 `<p>` 元素，保持所有其他段落不变。另注意 `section` 和 `#MainContent`\
  \ 之间没有空格。这导致选择器的该部分指向 `id` 为 `MainContent` 的 `<section>` 元素。\n\n```css\nsection#MainContent\
  \ p\n{\n  font-size: 18px;\n}\n```\n\n注意，组合与分组完全不同。分组只是为了避免重复输入相同的声明的快捷方式，而组合允许你定位文档中的特定元素。\n\
  \n通过组合，你不局限于 ID 选择器和类型选择器；你也可以将它与其他选择器一起使用，如下例所示：\n\n```css\nsection#MainContent\
  \ p.Attention\n{\n  font-weight: bold;\n}\n```\n\n此规则更改了 `id` 设置为 `MainContent`\
  \ 的 `<section>` 元素内所有类为 `Attention` 的段落，并保持其他所有不变。以下 HTML 片段使用此规则显示效果：\n\n```html\n\
  <section id=\"MainContent\">\n  <p class=\"Attention\">My class is Attention, so\
  \ my text is bold.</p>\n  <p>My text is not bold, as it lacks the Attention class.</p>\n\
  </section>\n<p class=\"Attention\">I am NOT bold because I don't fall within MainContent.</p>\n\
  ```\n\n在页面中应用特定样式需要回答的第二个问题是元素的哪个部分必须被样式化。你通过属性（properties）来实现。\n\n### 属性 (Properties)\n\
  \n属性是你想要通过样式表更改的元素部分。CSS 规范定义了很长的属性列表（VS 的 IntelliSense 列表显示了 100 多个）。\n\n| 属性 (PROPERTY)\
  \ | 描述 (DESCRIPTION) | 示例 (EXAMPLE) |\n| :--- | :--- | :--- |\n| `background-color`\
  \ `background-image` | 指定元素的背景颜色或图像。 | `background-color: White;` `background-image:\
  \ url(Image.jpg);` |\n| `border` | 指定元素的边界。 | `border: 3px solid Black;` |\n| `color`\
  \ | 字体颜色。 | `color: Green;` |\n| `display` | 元素的显示方式，允许隐藏或显示它们。 | `display: none;`\
  \ 这导致元素隐藏且不占用空间。 |\n| `float` | 允许使用左浮或右浮在页面中“浮动”。 | `float: left;` 这导致随后的内容位于对侧。将在本章节介绍其工作原理。\
  \ |\n| `font-family` `font-size` `font-style` `font-weight` | 更改页面上使用的字体外观。 | `font-family:\
  \ Arial;` `font-size: 18px;` `font-style: italic;` `font-weight: bold;` |\n| `height`\
  \ `width` | 设置元素的高度和宽度。 | `height: 100px;` `width: 200px;` |\n| `margin` `padding`\
  \ | 设置元素内边距（padding）和外边距（margin）的大小。 | `padding: 0;` `margin: 20px;` |\n| `visibility`\
  \ | 控制元素在页面上是否可见。不可见元素仍然占用空间；只是你看不到。 | `visibility: hidden;` 这导致元素不可见。 |\n\n幸运的是，VS\
  \ 通过许多工具帮助你找到正确的属性，因此你不需要记住所有属性。\n\n为了使属性有用，你需要给它一个值，这回答了第三个问题：你希望所选元素的部分看起来什么样？\n\
  \n### 值 (Values)\n\n就像属性一样，值也有许多形式。你可用的值取决于属性。例如，`color` 属性接受表示颜色的值。这可以是命名颜色（如 `White`）、代表红、绿、蓝（RGB）分量的十六进制数字（如\
  \ `#FF0000`），或者你可以使用 CSS `rgb` 表示法设置。以下示例在功能上都是等价的，将 `h1` 元素的颜色设置为红色：\n\n```css\n\
  h1\n{\n  color: Red;\n}\n\nh1\n{\n  color: #FF0000;\n}\n\nh1\n{\n  color: rgb(100%,\
  \ 0%, 0%);\n}\n```\n\n\n\n\n你还可以使用 `rgba` 表示法来指定颜色的透明度，第四个参数是一个位于 `0`（完全透明）和 `1`（不透明）之间的小数，如下：\n\
  \n```\ncolor: rgba(255, 0, 0, 0.50);\n```\n\n使用命名颜色可以增加你的 CSS 代码的可读性，但由于你受限于较短的命名颜色列表，你通常需要使用十六进制表示法来获取所需的精确颜色。在本章的稍后部分，你将看到如何使用内置颜色选择器来创建所需的精确颜色。\n\
  \n还可以使用许多其他值，包括尺寸单位（`px`、`em` 等）、字体族、图像（形式为 `url(SomeImage.jpg)`），或诸如 `border-style`\
  \ 的枚举，它允许你设置如 `solid`（实线）、`dashed`（虚线）和 `double`（双线）等边框样式。\n\n## 使用简写\n\n许多 CSS\
  \ 属性都允许你编写简写版本以及扩展版本。以 `border` 属性为例。在最简的形式下，你可以这样设置 `border` 属性：\n\n```\nborder:\
  \ 1px solid Black;\n```\n\n此 `border` 属性为 HTML 元素的所有四边应用边框。边框大小为 `1px`，样式为 `solid`（其他选项还包括\
  \ `dashed`、`dotted` 和 `double`），边框颜色设置为 `Black`（黑色）。\n\n这是一种快速为 HTML 的四个边框设置相同属性的简单方法。然而，如果你想对单个边框及其属性有更多的控制，可以使用可以使用扩展版本：\n\
  \n```css\nborder-top-width: 1px;\n  border-top-style: solid;\n  border-top-color:\
  \ Black;\n  border-right-width: 1px;\n  border-right-style: solid;\n  border-right-color:\
  \ Black;\n  border-bottom-width: 1px;\n  border-bottom-style: solid;\n  border-bottom-color:\
  \ Black;\n  border-left-width: 1px;\n  border-left-style: solid;\n  border-left-color:\
  \ Black;\n```\n\n这个长版本将应用完全相同的样式：四边均为 1 像素宽的黑色黑色边框。在大多数情况下，你应该优先使用简写符号而不是它的扩展写法，因为更容易阅读和维护。但是，如果你需要对边框进行绝对的控制——例如，如果你想在\
  \ HTML 元素的左侧和顶部设置 2 像素的虚线边框，在右侧和底部设置绿色实线边框——那么知道可以单独设置四个方向的每个 `border` 属性是有用的。你也可以混合这些选项。接面的示例将四边的边框设置为\
  \ 1 像素的黑色实线，然后仅覆盖了左侧边框的颜色：\n\n```css\nborder: 1px solid Black;\nborder-left-color:\
  \ Blue;\n```\n\n其他支持简写的 CSS 属性包括 `font`、`background`、`list-style`、`margin` 和 `padding`。如果你不确定属性是否支持简写，可以在\
  \ CSS 文件或 `<style>` 块中输入属性时，按下 `Ctrl+Space` 查看出现的 IntelliSense 弹出列表。\n\n尽管有时看起来你必须通过试错来编写\
  \ CSS，并只希望获得正确的结果，但 CSS 背后实际上有一个非常准确的模型，决定了项目如何在页面上布局。\n\n这个模型被称为 CSS 盒模型（CSS Box\
  \ Model）。\n\n## CSS 盒模型\n\nCSS 盒模型描述了三个重要的 CSS 属性应用于 HTML 元素的方式：内边距（padding）、边框（border）和外边距（margin）。图\
  \ 3-4 显示了盒模型的图形表示。\n\n![image](img/f076-01.jpg)\n\n**图 3-4**\n\n中间是一个类似 `<p>` 或\
  \ `<div>` 的 HTML 元素，具有特定的高度和宽度。在它周围是 `padding`；即边框内围绕周围的空白区域。紧接 `padding` 之后你可以看到\
  \ `border`，最后在外面是 `margin`，它定义了元素（包括其内边距和边框）与周围元素之间的空间。元素的三个外部属性——padding、border\
  \ 和 margin——加起来就是元素在页面上占据的空间。要查看它是如何工作的，请考虑以下 CSS 和 HTML：\n\n```css\n.MyDiv\n{\n\
  \  width: 200px;\n  padding: 10px;\n  border: 2px solid Black;\n}\n...\n<div class=\"\
  MyDiv\">Element</div>\n```\n\n这会在浏览器中渲染一个矩形，`<div>` 元素被一个两像素的黑色边框包围，如图 3-5 所示。\n\
  \n![image](img/f076-02.jpg)\n\n**图 3-5**\n\n在继续阅读之前，尝试回答这个问题：`<div>` 元素下箭头有多宽？\n\
  \n如果你猜是 224 像素，你是正确的。箭头的宽度是三个值的和：实际元素的宽度（200 像素），加上两侧的内边距宽度（两次 10 像素），加上边框宽度（两次\
  \ 2 像素）——得 224 像素。\n\n### 为页面添加 CSS\n\n将 CSS 表格添加到页面的第一种方法是通过 `<link>` 元素指向外部 CSS\
  \ 文件，正如你在之前的练习中所看到的。请查看以下 `<link>` 以了解在嵌入样式表时你拥有的选项：\n\n```html\n<link href=\"StyleSheet.css\"\
  \ rel=\"stylesheet\" type=\"text/css\" media=\"screen\" />\n```\n\n`href` 属性指向站点内部的文件，正如你在上一章创建两个页面之间的链接时看到。`rel`\
  \ 和 `type` 属性告诉浏览器链接的文件实际上是一个级联样式表。`media` 属性非常有趣：它允许你针对不同的设备，包括屏幕、打印机、手持设备甚至是为视障访问者的盲文和语音支持工具。`media`\
  \ 属性的默认值为 `screen`，所以如果你针对标准的桌面浏览器，可以省略该属性。\n\n你在本章开头简要看了包含样式表的第二种方法：使用嵌入 `<style>`\
  \ 元素。`<style>` 元素应该放在 ASPX 或 HTML 页面的顶部，`<head>` 标签之间。在 `<style>` 标签内部，你可以编写之前看到的完全相同的\
  \ CSS。例如，为了仅更改当前页面中 `<h1>` 元素的样式，你可以将以下代码添加到页面的 `<head>` 中：\n\n```html\n<head runat=\"\
  server\">\n  <title></title>\n  <style>\n    h1\n    {\n      color: Blue;\n   \
  \ }\n  </style>\n</head>\n```\n\n`<style>` 元素上的 `type` 属性也是可选的，因此你会遇到带有和不带有该属性的\
  \ `<style>` 元素。\n\n\n\n\n```\n<span style=\"color: White; background-color: Black;\"\
  >\n    这是黑色背景上的白色文字。\n</span>\n```\n\n### 在外部、嵌入和内联样式表之间选择\n\n你有许多选项可以为网站添加样式表，哪种方法最好呢？通常情况下，你应该优先使用外部样式表而不是嵌入式样式，而嵌入式样式优于内联样式。外部样式表允许你通过单个文件更改整个网站的外观。只需对外部样式表文件进行一次更改，所有使用该样式表的页面都会自动更新。\n\
  \n然而，在某些情况下，使用嵌入式和内联样式也是完全可以的。如果你想更改单个页面的外观而不影响网站上的其他页面，嵌入式样式表是你的最佳选择。内联样式也是如此：如果你只想更改单个页面中单个元素的行为，并且你确定不会对其他\
  \ HTML 元素需要相同的声明，你就可以使用内联样式。\n\n需要考虑的一个重要点是不同类型的样式表相互覆盖的方式。如果你有多个具有不同属性值的相同选择器，最后定义的那个将优先。例如，考虑在名为\
  \ `Styles.css` 的外部样式表中定义了一个规则，该规则将所有 `<h1>` 元素的颜色设置为绿色：\n\n```\nh1\n{\n  color:\
  \ Green;\n}\n```\n\n现在想象你正在将此样式表附加到一个页面，该页面还有一个针对相同 `<h1>` 的嵌入式规则，但设置了不同的颜色：\n\n\
  ```html\n<link href=\"Styles/Styles.css\" rel=\"stylesheet\" type=\"text/css\" />\n\
  <style>\n  h1\n  {\n    color: Blue;\n  }\n</style>\n```\n\n使用这段代码，页面实际 `<h1>` 元素的颜色将变为蓝色。这是因为将颜色设置为蓝色的嵌入式样式表是在页面后定义的，因此覆盖了外部文件中的设置。如果你像这样调换顺序：\n\
  \n```html\n<style>\n  h1\n  {\n    color: Blue;\n  }\n</style>\n<link href=\"Styles/Styles.css\"\
  \ rel=\"stylesheet\" type=\"text/css\" />\n```\n\n标题将是绿色的，因为外部样式表中的设置现在覆盖了嵌入式的设置。\n\
  \n同样的原理也适用于内联样式。因为它们直接定义在 HTML 元素上，所以它们的设置优先于嵌入式和外部样式表。\n\n此外，知道 CSS 通常会覆盖 HTML\
  \ 元素上的属性也是很好的。例如，如果你有一个 CSS 规则设置图像的宽度和高度，那么 `img` 元素上的 `height` 和 `width` 属性将被忽略。例如，此代码段中的图像最终将是一个\
  \ 100 像素的正方形：\n\n```css\nimg\n{\n  height: 100px;\n  width: 100px;\n}\n...\n<img\
  \ src=\"SomeImage.jpg\" width=\"200px\" height\"200px\" />\n```\n\n通常，建议将外部文件附加在\
  \ `<head>` 部分的顶部，紧接着是嵌入式样式表。这样，外部文件定义了元素的全局外观，你可以使用嵌入式样式来逐页面地覆盖外部设置。\n\nVS 使得将嵌入式样式表移动到外部\
  \ CSS 文件变得简单，你将在下一节中学习如何操作，该节将讨论 VS 中剩余的 CSS 工具。\n\n## 在 VISUAL STUDIO 中处理 CSS\n\
  \nVisual Studio 2013 带有许多优秀的工具，让处理 CSS 变得尽可能简单，包括：\n\n*   `CSS Properties Grid`（CSS\
  \ 属性网格），允许你更改属性值。\n*   `Manage Styles window`（样式管理窗口），允许你组织网站中的样式，将它们从嵌入式样式表改为外部样式表反之亦然；重新调整顺序；将现有样式表链接到文档；以及创建新的内联、嵌入式或外部样式表。\n\
  *   `Apply Styles window`（应用样式窗口），你可以用它从网站所有可用样式中进行选择，并将其快速应用于页面中的元素。\n*   `Hierarchical\
  \ indenting`（分级缩进），让你的 CSS 代码更易理解。\n*   更智能的 `IntelliSense`（智能感知）和标题大写字母搜索功能，使手动输入\
  \ CSS 代码变得简单容易。\n*   许多实用的编辑器功能，例如轻松地注释和取消注释代码、将代码封装在可折叠区域中、颜色选择器以及代码片段。\n\n你已经见过其中一些工具的操作了，接下来的章节将为你详细介绍剩余的工具。\n\
  \n### 使用 CSS 编辑器\n\nVS 中的 CSS 文本编辑器包含许多强大的功能，将在下一个“Try It Out”练习中演示。\n\n尽管外部样式表非常有用，但有时你确实想使用嵌入式或内联样式。下一节将解释如何创建和管理这些样式，同样简单。\n\
  \n### 创建嵌入式和内联样式表\n\n当你在设计视图（Design View）中处理页面时，通常需要对页面的部分进行微调，例如对文本进行样式设置、对齐图像或为元素应用边框。在这个阶段，你需要决定创建内联、嵌入式还是外部样式表。正如你之前看到的，如果你预见到以后会重用某种样式，就应该选择外部或嵌入式样式表。不过，VS\
  \ 并不在乎。它允许你在三个层次上创建样式。更好的是，它允许你轻松将嵌入式样式升级为外部样式，或将内联信息移动到不同的位置，提供了很大的灵活性。\n\n在下一个练习中，你将看到如何创建内联和嵌入式样式表。稍后我们将介绍如何将它们移动到外部样式表，以便其他页面重用。\n\
  \n一旦你创建了许多实用的样式，你需要一种方法将现有样式应用于其他页面或 HTML 元素。我们将介绍这种方法。\n\n### 应用样式\n\n如果你有一定的 Word\
  \ 经验，可能熟悉样式对话框，它列出了所有可用样式并允许将其应用于选定的文本。通过这种方式，你可以为文本块应用相同的格式。这在 VS 中的工作原理类似。通过 `Apply\
  \ Styles` 窗口（通过主菜单选择 `View Apply Styles` 访问），你可以轻松将样式规则应用于页面元素。\n\n本章中最后一个 CSS 功能位于\
  \ `Manage Styles` 和 `Apply Styles` 窗口。除了帮助你将 CSS 文件到文档之外，这些窗口还允许你轻松管理样式。\n\n###\
  \ 管理样式\n\n由于添加新的内联和嵌入式样式非常容易，你的页面可能会变得到处都是样式。为了实现可重用，你应该尽可能将大部分内联和嵌入式样式移动到外部样式表。这正是\
  \ `Apply Styles` 和 `Manage Styles` 窗口允许你做的。\n\n## 处理 CSS 的实用技巧\n\n遵循以下建议以充分利用 CSS：\n\
  \n*   花些时间熟悉 CSS 支持的许多属性。最好的方法是在你的 `Demos` 文件夹中创建一个页面，创建几个 HTML 元素（如 `<div>` 和 `<p>`\
  \ 标签），然后简单地尝试所有不同的属性。通过在 `CSS Properties Grid` 上尝试许多属性，你可以对可用选项有一个直观的感觉。这使得以后当你想对某些内容应用特定效果时变得更加容易。\n\
  \n\n\n\n\n*   在创建自定义 CSS 类时，尽量编写描述规则行为的名称，而不是其外观和感受。例如，一个名为 `.Introduction` 的类用于样式化页面的第一段落，就是一个很好的描述。它让你能够在不影响名称实际含义的情况下更改底层值。但使用诸像\
  \ `.BlueAndItalic` 这样命名的类保证在以后会给你带来麻烦。如果你决定将蓝色改为黑色怎么办？你要么会得到一个非常奇怪的、无法描述自身行为的类名，要么你需要重命名该类并更新整个网站，将对旧类的引用更改为\
  \ `.BlackAndItalic`。\n\n*   尝试创建较小且可重用的规则集，并在需要时将它们组合，而不是创建一个只能用于单个 UI 元素的大型、单体规则。例如，与其创建一个这样的样式：\n\
  \n```css\n.ImportantHeading\n{\n  color: Red;\n  font-size: 20px;\n  font-weight:\
  \ bold;\n}\n```\n\n不如创建几个更易于重用的轻量级规则：\n\n```css\nh1\n{\n  font-size: 20px;\n}\n\n\
  .Attention\n{\n  color: Red;\n  font-weight: bold;\n}\n```\n\n当你将 `.Attention` 类应用到如下标题时：`<h1\
  \ class=\"Attention\">`，你将获得与你给它分配 `ImportantHeading` 类时完全相同的行为。然而，通过单独的 `Attention`\
  \ 类，你创建了一个可重用的规则，可以将其应用于其他需要用户注意的元素，例如 `<p>` 或 `<span>` 元素。\n\n## 总结\n\n本章带你深入了解\
  \ CSS，这是为你的 ASPX 和 HTML 网页设置样式最重要的语言。\n\nCSS 让你克服 HTML 在网页样式方面的局限性，因为它设计之初就是为了尽量减少页面臃肿，让你对页面外观有更大的控制力，并通常帮助你创建加载更快、更易维护的网站。\n\
  \n一旦你很好理解了 CSS 术语，你会发现使用 VS 内置的许多 CSS 工具非常简单。诸如 Manage Styles 和 Apply Styles 窗口、Style\
  \ Builder 以及代码编辑器中的智能 IntelliSense 等工具，让编写和管理 CSS 变得非常容易。\n\n你不仅可以将 CSS 应用于 HTML（正如你在本章中所看到的那样），还可以将其应用于\
  \ ASP.NET 控件。你应用于这些控件的 CSS 最终将内联 `style` 属性的形式出现在浏览器中，原理与在本章中所看到的相同。下一章将为你详细介绍许多可用的\
  \ ASP.NET 控件。\n\n### 你在本章中学了什么\n\n| CSS | 级联样式表，用于在浏览器中布局网页页面的语言。 |\n| CSS 模型 |\
  \ 根据高度、宽度、内边距、边框和外边距计算元素尺寸的模型。 |\n| 声明 (Declaration) | 属性和值的组合，决定了应用于该声明的元素的样式。\
  \ |\n| 嵌入式样式表 | 定义在页面内 `<style />` 元素中的 CSS 代码。通常被称为嵌入式样式。 |\n| 外部样式表 | 定义在单独文件中并使用\
  \ `<link />` 元素包含在页面中的 CSS 代码。 |\n| 内联样式表 | 直接使用 `style` 属性定义在元素上的 CSS 代码。通常被称为内联样式。\
  \ |\n| 规则集 (Rule set) | 选择器和一个或多个声明的组合，包裹在一对括号中。 |\n| 选择器 (Selector) | 用于指向页面中一个或多个元素的\
  \ CSS 结构。存在不同的选择器，包括通用选择器、ID 和类选择器以及类型选择器。 |\n\n# 第 4 章：使用 ASP.NET 服务器控件\n\n###\
  \ 你在本章将学到：\n\n*   什么是 ASP.NET 服务器控件\n*   你可以使用的不同类型的服务器控件\n*   绝大多数服务器控件共有的共同行为\n\
  *   ASP.NET 运行时如何处理页面上的服务器控件\n*   服务器控件如何在回传（postbacks）中维护其状态\n\n### 本章的 WROX.COM\
  \ 代码下载\n\n你可以在 [www.wrox.com/go/begaspnet451](http://www.wrox.com/go/begaspnet451)\
  \ 的 Download Code 标签页找到本章的 [wrox.com](http://wrox.com) 代码下载。代码位于 Chapter 4 文件夹。\n\
  \nASP.NET 服务器控件是 ASP.NET 的主力。你在 Visual Studio (VS) 中构建的几乎所有 Web Forms 页面都包含一个或多个服务器控件。这些控件有各种形状和大小，从简单的\
  \ `Button` 和 `Label` 控件，到能够显示来自数据源（如数据库或 XML 文件）数据的复杂 `TreeView` 和 `ListView` 控件。你将在第\
  \ 7、13 和 14 章中看到这些控件。\n\nASP.NET 服务器控件的架构深度集成在 ASP.NET 中，为控件提供了一套在如今网站构建技术中非常独特的特性。本章将向你展示服务器控件是什么、它们是如何工作的，以及安装\
  \ VS 时可以使用哪些控件。\n\n本章从对服务器控件的通俗讨论开始。你将看到如何通过将其添加到设计视图（Design View）或标记视图（Markup View）在代码中定义它们。\n\
  \n接下来的章节将为你详细介绍工具箱（Toolbox）中提供的许多控件。\n\n## 服务器控件简介\n\n理解服务器控件如何运行以及它们如何与经典 ASP 或\
  \ PHP（另一种创建动态网站的语言）定义控件的方式不同非常重要。\n\n例如，在这些语言中影响文本框的内容，你需要使用纯 HTML 并混合服务器端代码。这与第\
  \ 2 章中显示当前日期时间的示例类似。在经典 ASP 中创建一个带有消息和当前时间的文本框，可以使用以下代码：\n\n```html\n<input type=\"\
  text\" value=\"Hello World, the time is <%=Time()%> />\n```\n\n如你所见，这段代码包含纯 HTML，并混合了由\
  \ `<%` 和 `%>` 分隔的服务器端块，使用 `=` 输出当前时间。这种编码方式有一个主要缺点：HTML 和服务器端代码混合在一起，使得编写和维护页面变得困难。虽然这是一个容易理解代码的示例，但这种编程方式会导致页面变得非常混乱。\n\
  \n服务器控件的工作方式不同。在 ASP.NET 中，控件“位于”服务器上的 ASPX 页面内部。当浏览器请求页面时，服务器端控件由 ASP.NET 运行时处理——这是处理\
  \ ASPX 页面请求的引擎。控件生成客户端 HTML 代码并附加到最终页面输出中。这些 HTML 代码最终出现在浏览器中，用于构建页面。\n\n因此，与其直接在页面中定义\
  \ HTML 控件，不如使用以下语法定义 ASP.NET 服务器控件，其中斜体部分每个控件都不同：\n\n```xml\n<asp:TypeOfControl\
  \ ID=\"ControlName\" runat=\"server\" />\n```\n\n对于自带的控件，你始终使用 `asp:` 前缀后跟控件名称。例如，为了创建一个可以包含相同欢迎消息和当前时间的\
  \ `TextBox`，可以使用以下语法：\n\n```xml\n<asp:TextBox ID=\"Message\" runat=\"server\" />\n\
  ```\n\n\n\n\n\n注意，该控件有两个属性：`ID` 和 `runat`。`ID` 属性用于唯一标识页面上的控件，因此你可以对它进行编程。页面上的每个控件都必须具有唯一的\
  \ `ID`，这非常重要；否则 ASP.NET 运行时将无法理解你指的是哪个控件。如果你不小心输入了重复的控件 `ID`，Visual Studio 会在错误列表中标识出该问题。强制性的\
  \ `runat` 属性用于表示这是一个运行在服务器上的控件。如果没有此属性，控件将不会被处理，并将直接出现在 HTML 源代码中。如果你发现在浏览器的最终输出中缺少了一个控件，请确保该控件具有此必需属性。请注意，对于非服务器元素（例如纯\
  \ HTML 元素），`runat` 属性是可选的。通过此属性，你的编程代码可以访问非服务器控件。你将在书的后部分学习更多关于这方面的内容。\n\n你可以通过输入\
  \ `runat` 并按 Tab 键，使用代码片段轻松地为现有元素添加 `runat` 属性。\n\n上一个 `TextBox` 示例使用了自闭合标签，其中结束斜杠（`/`）嵌入在起始标签中。这对于不需要包含文本或其他控件等子内容的控件来说是相当常见的。然而，使用单独结束标签的长版本也是可以接受的：\n\
  \n```\n<asp:TextBox ID=\"Message\" runat=\"server\"></asp:TextBox>\n```\n\n你可以使用\
  \ 工具 ⇒ 选项 ⇒ 文本编辑器 ⇒ HTML (Web Forms) ⇒ 格式 ⇒ 标签特定选项来控制每个元素结束标签的默认行为。\n\n你可以从内联于页面中的代码或单独的后台代码（Code\
  \ Behind）文件对此文本框进行编程，正如你在第 2 章中看到的那样。要设置欢迎消息和时间，可以使用以下代码：\n\nVB.NET\n\n```\nMessage.Text\
  \ = \"Hello World, the time is \" & DateTime.Now.TimeOfDay.ToString()\n```\n\nC#\n\
  \n```cs\nMessage.Text = \"Hello World, the time is \" + DateTime.Now.TimeOfDay.ToString();\n\
  ```\n\n页面标记部分中的控件定义现在与定义文本框中显示文本的实际代码分开了，这使得定义和编写文本框（或任何其他控件）变得更容易，因为它让你能够一次专注于一项任务。你可以在页面的标记部分中声明控件及其视觉外观，也可以从代码块中对其行为进行编程。\n\
  \n通常情况下，标记视图中定义的控件是不区分大小写的，尽管你可以设置的某些值是区分大小写的。我更倾向于使用 IntelliSense 建议的大写方式。请注意，当使用\
  \ C# 时，你在后台代码中属性是区分大小写的。\n\n你将在下一个练习中看到服务器控件是如何将它们的底层 HTML 发送给客户端的。\n\n在本章稍后讨论 ASP.NET\
  \ 状态引擎时，你将对回传（postbacks）有更深入的了解。\n\n# 深入了解 ASP.NET 服务器控件\n\n由于你在构建 ASP.NET Web Forms\
  \ 页面大部分时间都会使用服务器控件，你需要详细了解它们的工作原理以及如何使用。在下一节中，你将看到如何将控件添加到页面中并更改它们在浏览器中的行为。在随后的章节中，你将获得所有服务器控件共同行为的概述。一旦理解了这种共享行为，就可以将此知识应用到其他新控件上，让你能够快速地上手它们。\n\
  \n### 在页面中定义控件\n\n正如之前的“尝试一试”所示，你可以简单地从工具箱（Toolbox）将控件拖到页面的设计表面。\n\n这使得在页面上添加大量控件来开始变得非常容易。然而，由于设计表面的工作方式，有时很难将它们精确地放在你想要的位置。例如，将控件拖到\
  \ HTML 元素的起始标签和结束标签之间可能很难。幸运的是，你同样很容易地在标记视图（Markup View）中从工具箱拖入控件。此外，你也可以直接在标记视图中输入控件的标记，让\
  \ IntelliSense 和代码片段帮助你处理不同的标记和属性。你还会发现属性格（Properties Grid）在标记视图中同样有效。只需点击相关的标记，属性格就会更新以反映你点击的标签。这使得更改控件的属性变得简单，同时你仍然可以确切看到为你生成哪些标记。Visual\
  \ Studio 允许你直接在标记视图中绑定处理器（例如上一个练习中使用的 `Click` 事件），而无需切换到设计视图。你还能够从代码访问控件的智能任务（Smart\
  \ Tasks）面板。你将在本章的稍后部分看到更多功能。\n\n如果你查看页面中某些控件的属性格，你会发现许多控件具有相似的属性。在下一节中，你将确切看到这些属性是什么以及它们的用途。\n\
  \n### 所有控件的常用属性\n\n你在 VS 工具箱中找到的大多数服务器控件共享一些共同行为。这些行为的一部分包括定义控件可以包含和暴露数据的所谓“属性”。你将在下一章中学习更多关于属性和其他类型的内容。每个服务器控件都有一个\
  \ `ID` 用于在页面中唯一标识它，一个始终设置为 `server` 的 `runat` 属性用于表示该控件应在服务器上处理，以及一个 `ClientID`，它包含了分配给最终\
  \ HTML 中元素的客户端 ID 属性。在从 ASP.NET 到 3.5 的版本中，此 `ClientID` 总是为你生成的。然而，在 ASP.NET 4 中，引入了新的\
  \ `ClientIDMode` 属性，让你对元素的客户端 ID 有更多控制。你将在后面的章节中看到它是如何工作的。`runat` 属性技术上不是服务器控件的属性，但它是指示控件标记应作为服务器控件处理而不是以纯文本形式出现在浏览器中的。\n\
  \n除了这些属性，许多服务器控件由于共享相同的 `Control` 基类而共享更多属性。下一章将深入探讨基类和继承。下表列出了最常见的共享属性及其用途。\n\n\
  | 属性 | 描述 |\n| :--- | :--- |\n| `AccessKey` | 允许你通过按下键盘上的关联键在客户端访问控件。 |\n| `BackColor`\
  \ `ForeColor` | 允许你更改控件的背景（BackColor）和文本（ForeColor）颜色。 |\n| `BorderColor` `BorderStyle`\
  \ `BorderWidth` | 更改浏览器中控件的边界。与你在上一章看到的 CSS 边界属性相似并非巧合。这三个 ASP.NET 属性直接映射到对应的 CSS\
  \ 属性。 |\n| `CssClass` | 允许为浏览器中的控件定义 HTML `class` 属性。该类名可以指向你在页面或外部 CSS 文件定义的 CSS\
  \ 类。 |\n| `Enabled` | 决定用户是否可以在浏览器中与控件交互。例如，对于禁用的文本框（Enabled=\"False\"），你无法更改其文本。\
  \ |\n| `Font` | 允许你定义不同的字体设置，如大小、字体以及字体是否加粗。 |\n| `Height` `Width` | 决定控件在浏览器中的高宽。\
  \ |\n| `TabIndex` | 设置客户端 HTML `tabindex` 属性，确定用户通过按 Tab 键在页面中移动控件的顺序。 |\n\n\n\n\
  \n\n| `ToolTip` | 允许你为浏览器中的控件设置工具提示。此工具提示以 HTML 中 `title` 属性的形式渲染，当用户将鼠标悬停在元素上时显示。\
  \ |\n| `Visible` | 决定是否将控件发送到浏览器。你实际上应该将其视为一种服务端可见性设置，因为不可见的控件根本不会被发送到浏览器。这意味着它与你在上一节中看到的、在客户端隐藏元素的\
  \ CSS `display` 和 `visibility` 属性有很大区别。 |\n\n[content]\n\n要要查看所有这些属性最终是如何出现在浏览器中的，请考虑以下\
  \ `TextBox` 服务端控件的标记代码：\n\n```\n<asp:TextBox AccessKey=\"a\" BackColor=\"Black\"\
  \ ForeColor=\"White\" Font-Size=\"30px\"\n  BorderColor=\"Yellow\" BorderStyle=\"\
  Dashed\" BorderWidth=\"4\" CssClass=\"TextBox\"\n  Enabled=\"True\" Height=\"40\"\
  \ Width=\"200\" TabIndex=\"1\" ToolTip=\"Hover text here\"\n  Visible=\"True\" ID=\"\
  TextBox1\" runat=\"server\" Text=\"Hello World\">\n</asp:TextBox>\n```\n\n当你在浏览器中请求带有此控件的页面时，最终将如下\
  \ HTML：\n\n```\n<input name=\"TextBox1\" type=\"text\" value=\"Hello World\" id=\"\
  TextBox1\" accesskey=\"a\"\n  tabindex=\"1\" title=\"Hover text here\" class=\"\
  TextBox\" style=\"color:White;\n  background-color:Black;border-color:Yellow;border-width:4px;\n\
  \  border-style:Dashed;font-size:30px;height:40px;width:200px;\"\n/>\n```\n\n这导致了图\
  \ 4-3 所示的文本框。\n\n![image](img/f108-01.jpg)\n\n**图 4-3**\n\n注意，大多数服务端控件属性已转换为带有 `style`\
  \ 属性的 CSS 内联样式。\n\n在构建网站时，以这种方式定义 `TextBox` 是不常见的。正如你在上一节中学到的，你应该尽可能避免使用内联样式，而选择外部级联样式表。你可以通过此服务端控件实现完全相同的行为：\n\
  \n```\n<asp:TextBox ID=\"TextBox1\" AccessKey=\"a\" CssClass=\"TextBox\" TabIndex=\"\
  1\"\n  ToolTip=\"Hover text here\" runat=\"server\" Text=\"Hello World\">\n</asp:TextBox>\n\
  ```\n\n以及下面的 CSS 类：\n\n```css\n.TextBox\n{\n  background-color: Black;\n  color:\
  \ White;\n  font-size: 30px;\n  border-color: Yellow;\n  border-style: Dashed;\n\
  \  border-width: 4px;\n  height: 40px;\n  width: 200px;\n}\n```\n\n显然，第二个示例更容易阅读、复用和维护。如果你想要另一个外观完全相同的文本框，只需将\
  \ `TextBox` 分配给该控件的 `CssClass`。此外，注意我省略了 `Enabled` 和 `Visible` 属性。它们的默认值都为 `True`，因此没有在控件声明中显式说明。\n\
  \n尽管建议使用 CSS 类而不是这些内联样式，但了解服务端控件属性是有好处的，以防你需要对它们进行精细控制。如果你通过编程方式更改控件属性（正如你稍后学习如何做那样），它们仍然会变成内联样式，从而可能覆盖嵌入或外部样式表中的设置。\n\
  \n现在你已经看到了所有服务端控件共有的通用行为，是时候查看 ASP.NET 自带的大量控件了。\n\n## 控件类型\n\n开箱即用，ASP.NET 4.5.1\
  \ 带有大量的服务端控件，支持你的大多数 Web 开发需求。为了方便你找到正确的控件，它们被放置在 VS 工具箱的各个控件类别中（通过按 Ctrl+Alt+X\
  \ 访问）。图 4-4 显示了包含所有可用类别的工具箱。\n\n![image](img/f109-01.jpg)\n\n**图 4-4**\n\n注意，取决于你所使用的\
  \ Visual Studio 版本，你可能还有其他类别。\n\nVS 的一个方便功能是在工具箱中搜索。只需在工具箱顶部的搜索文本框中输入要查找的控件的几个字母，VS\
  \ 就会过滤出符合你标准的控件列表。\n\n在接下来的章节中，你看到每个类别中的控件以及它们的设计用途。\n\n在对各种控件的讨论中，你会看到对控件属性的提到。例如，`TextBox`\
  \ 有 `Text` 属性（以及许多其他属性），`ListBox` 有一个 `SelectedItem` 属性。某些属性只能通过编程方式设置，而不能通过属性网设置。下一节将详细讨论如何通过编程读取和更改控件属性。\n\
  \n#### 标准控件\n\nStandard 类别包含了几乎任何网页需要的许多基础控件。你已经在本节早期看到了其中一些，比如 `TextBox`、`Button`\
  \ 和 `Label` 控件。图 4-5 显示了 Standard 类别中的所有控件。\n\n![image](img/f109-02.jpg)\n\n**图\
  \ 4-5**\n\n许多控件本身就言自明，因此我们不对它们进行详细描述，而是简要介绍几个重要的。\n\n#### 简单控件\n\n工具箱包含了一些简单且直观的控件，包括\
  \ `TextBox`、`Button`、`Label`、`HyperLink`、`RadioButton` 和 `CheckBox`。它们在工具箱中的图标给出了它们如何出现在浏览器中的线索。在本书的剩余部分，你会多次看到这些控件。在\
  \ ASP.NET 4.5 中，`TextBox` 控件的 `TextMode` 属性扩展了对 `DateTime`、`Email` 和 `Number` 等类型的支持，稍后会有介绍。\n\
  \n#### 列表控件\n\n标准类别还包含了一些以列表形式呈现的控件。这些控件包括 `ListBox`、`DropDownList`、`CheckBoxList`、`RadioButtonList`\
  \ 和 `BulletedList`。向列表添加项，如下例所示，在控件的起始和结束标签之间定义 `<asp:ListItem>` 元素：\n\n```\n<asp:DropDownList\
  \ ID=\"FavoriteLanguage\" runat=\"server\">\n  <asp:ListItem Value=\"C#\">C#</asp:ListItem>\n\
  \  <asp:ListItem Value=\"Visual Basic\">Visual Basic</asp:ListItem>\n  <asp:ListItem\
  \ Value=\"CSS\">CSS</asp:ListItem>\n</asp:DropDownList>\n```\n\n通过编程查看列表控件的当前活动选中项，可以查看它的\
  \ `SelectedValue`、`SelectedItem` 或 `SelectedIndex` 属性。`SelectedValue` 返回包含所选项值的字符串，例如在上例中的\
  \ `C#` 或 `Visual Basic`。`SelectedIndex` 返回项目在列表中的零基索引。在上例中，如果用户选择了 `C#`，`SelectedIndex`\
  \ 为 0。同样，如果用户选择了 `CSS`，索引为 2（列表中的第三项）。\n\n对于允许多次选择的控件（如 `CheckBoxList` 和 `ListBox`），你可以遍历\
  \ `Items` 集合并查看哪些项是被选中的。在这种情况下，`SelectedItem` 返回列表中的*第一个*选中的项；而不是所有项。你将在下一个练习中学习如何访问所有选中的项。注意，在浏览器中，`DropDownList`\
  \ 和 `ListBox` 控件都渲染为 `<select>` 元素。由这两个控件设置的 `size` 和 `multiple` 等属性决定了 HTML 元素在浏览器中的外观和行为。\n\
  \n`BulletedList` 控件不允许用户进行选择，因此不支持这些属性。\n\n为了查看如何向你的列表控件添加列表项，以及如何读取选中的值，接下来的练习将引导你创建一个简单的\
  \ Web 表单，其中包含两个列表控件，询问用户他们喜欢的编程语言。\n\n#### 容器控件\n\n\n\n\n\n通常情况下，将相关的的内容和控件分组是非常理想的。你可以通过将控件（以及其他标记）放入一个容器控件中来实现，例如\
  \ `Panel`、`PlaceHolder`、`MultiView` 或 `Wizard`。例如，你可以使用 `PlaceHolder` 或 `Panel`\
  \ 控件一次性隐藏或显示多个控件。你不需要逐个隐藏每个控件，只需隐藏包含所有单独控件和标记的整个容器即可。这两个控件都有各自的优缺点。`PlaceHolder`\
  \ 控件的优点是它不会向页面生成任何自身的 HTML，因此你可以将其用作容器使用，而不会对最终页面产生任何副作用。然而，它缺乏设计时支持，导致在 VS 的设计阶段很难管理\
  \ `PlaceHolder` 内部的控件。相比之下，`Panel` 允许你轻松访问它所包含的所有控件和其他内容，但它本身会被渲染为 `<div>` 元素。在很多情况下这并不是问题，甚至可能很有用，因为你可以在客户端使用\
  \ CSS 针对该 `div` 进行操作，因此考虑到设计时支持，通常使用 `Panel` 控件是最好的选择。\n\n`MultiView`（可以包含一个或多个\
  \ `<asp:View>` 元素）和 `Wizard` 的相似之处在于，它们都允许你将一个长页面拆分为多个区域，从而轻松填写长表单。Wizard 控件内置了使用\
  \ Previous（上一步）、Next（下一步）和 Finish（完成）按钮进行页面切换的支持，而 `MultiView` 则必须通过程序进行控制。\n\n\
  ### 详细查看 Panel 控件\n\n在下面的练习中，你将使用 `Panel` 控件为其他控件和标记创建一个容器。现在你只添加了一些文本，但在随后的“尝试一下”练习中，你将向面板添加\
  \ ASP.NET 控件。\n\n如你所见，在 VS 中向 `Panel` 控件添加文本和其他标记非常简单。现在你只添加了一些纯文本，但在下一节中，你将看到如何添加\
  \ `Wizard` 控件以及如何使用它。\n\n### Wizard 控件的魔术\n\n`Wizard` 控件是拆分大型 Web Forms 并以易于理解的信息块呈现给用户的绝佳工具。你不需要用一个包含许多控件和文本的单一页面来困扰用户，而是可以将页面拆分，并在单独的向导页面上展示每个部分。`Wizard`\
  \ 控件通过自动创建 Next、Previous 和 Finish 按钮来处理所有的导航问题。在下面的练习中，你将使用向导向用户询问姓名和喜欢的编程语言。虽然示例本身非常简单，你完全可以将两个问题都放在同一个页面而不会困扰用户，但该示例展示了向导的工作原理以及为什么它很有用。你可以轻松地将相同的技术应用于你自己的可能更大的\
  \ Web Forms 中。\n\n除了你在之前的几节中见过的控件外，还有几个控件值得检查。并不是所有控件在此处都详细讨论，因为它们在书中不再被使用。关于这些控件的良好信息来源是微软开发者网络\
  \ (MSDN) 网站：[`msdn.microsoft.com`](http://msdn.microsoft.com)。要在该网站上查找有关控件的信息，请使用你喜欢的搜索引擎，然后搜索\
  \ `ControlName Control MSDN`。例如，要查找 `Wizard` 控件的更多信息，你应该搜索 `Wizard Control MSDN`。通常，MSDN\
  \ 网站出现在搜索结果的前列。\n\n### 其他标准控件\n\n本节简要讨论了工具箱中 Standard（标准）类别的其余控件。你在书的其他部分的示例应用程序中看到了其中许多控件。\n\
  \n#### LinkButton 和 ImageButton\n\n`LinkButton` 和 `ImageButton` 控件的操作与普通的 `Button`\
  \ 控件类似。它们在被点击时都会导致向服务器的回回（postback）。`LinkButton` 表现为一个简单的 `<a>` 元素，但它是使用 JavaScript\
  \ 进行回回，而不是请求新页面。`ImageButton` 执行相同的操作，但显示的是用户可以点击以触发回回的图像。\n\n#### Image 和 ImageMap\n\
  \n这些控件非常相似，因为它们都能在浏览器中显示图像。`ImageMap` 允许你在图像上定义 `hotspots`（热点），点击这些热点会导致向服务器的回回，或者导航到不同的页面。\n\
  \n#### Calendar \n\n`Calendar` 控件提供了一个丰富的界面，允许用户选择日期。在在本章末尾讨论 ASP.NET 状态引擎时，你会看到更多它的用法。\n\
  \n#### FileUpload\n\n`FileUpload` 允许用户上传可以存储在服务器上的文件。你将在第 14 章看到更多关于此控件的内容。\n\n\
  #### Literal, Localize 和 Substitute\n\n这三个控件看起来都像 `Label` 控件，因为它们都可以显示静态文本或 HTML。`Literal`\
  \ 的最大优势是它本身不会渲染额外的标签；它只显示你分配给 `Text` 属性的内容，因此对于显示在后台代码（Code Behind）中构建或从数据库中检索的\
  \ HTML 或 JavaScript 非常有用。\n\n`Localize` 控件用于多语言网站，能够从翻译后的资源文件中检索其内容。`Substitute`\
  \ 控件用于高级缓存场景，允许你只更新原本被完全缓存的页面部分。这两个控件都超出了本书的范围，但为了对它们进行良好的讨论，你可能想要买一本 Wrox 的 *Professional\
  \ ASP.NET 4.5 in C#* 和 *VB* (ISBN: 978-1-111-31182-0)。\n\n#### AdRotator\n\n`AdRotator`\
  \ 控件允许你在网站上显示随机广告。这些广告来自你在服务器上创建的 XML 文件。由于缺乏在除最简单场景外所需的点击跟踪和日志等高级功能，该控件在今天已不多使用。\n\
  \n#### HiddenField\n\n`HiddenField` 控件允许你在页面中存储数据，这些数据会在每次请求时提交。如果你希望页面在用户看不见的情况下记住特定数据，这将非常有用。由于该字段会出现在页面的\
  \ HTML 源代码中，因此对于终端用户是可见的，你不应该在其中存储任何敏感数据。\n\n#### XML\n\n`XML` 控件允许将数据从 XML 格式转换为另一种格式（如\
  \ HTML）以便在页面上显示。查看 *Professional ASP.NET 4.5* 可获得详细描述。\n\n#### Table\n\n`<asp:Table>`\
  \ 控件在许多方面与其 HTML `<table>` 对应物相同。然而，由于该控件运行在服务器端，你可以对它进行编程，动态创建新的列和行并动态地添加数据。\n\n\
  到此，对工具箱 Standard 类控件的讨论结束。在大多数网页中，你将至少使用这些控件中的几个。本节的其余部分讨论了工具箱的其他类别。由于它们在书的其余部分都以某种形式使用，本章简要描述了它们的用途，以便你对其用途有一个大致的。你可以在其他章节找到交叉引用，以获取更多信息。\n\
  \n### HTML 控件\n\n工具箱中的 HTML 类别包含了许多与 Standard 类中控件相似的 HTML 控件。例如，你会发现类似于 `<asp:Button>`\
  \ 的 `Input (Button)`。同样，还有一个 `Select` 控件，其对应物是 `<asp:DropDownList>` 和 `<asp:ListBox>`。\n\
  \n\n\n\n\n与 ASP.NET 服务器控件（Server Controls）不同，`HTML` 控件是客户端控件，并会直接生成在浏览器的最终 HTML\
  \ 中。你可以通过为它们添加 `runat=\"server\"` 属性将它们暴露给服务器端代码。这允许你从 Web 表单的后台代码（Code Behind）对它们进行编程，从而影响诸如可见性等属性。\n\
  \n`HTML` 控件的功能远比 `Standard` 类别中的控件少得多。例如，`Select` 控件缺乏设计时支持，无法通过 `ListItem` 集合编辑器在设计阶段直接向列表添加新项。这迫使你必须在\
  \ VS 的标记视图（Markup View）中手动编写这些项。\n\n由于 `Standard` 和 `HTML` 类别的控件看起来非常相似，下一节将讨论它们的区别，并让你了解在何时倾向于选择其中一类控件。\n\
  \n# 如何在 Standard 和 HTML 控件之间进行选择\n\n工具箱中 `Standard` 和 `HTML` 类别的控件似乎存在某些重叠。那么你应该选择哪些？以及何时选择？通常情况下，`Standard`\
  \ 类别中真正的服务器控件提供了多得的功能，无论是在 VS 中的设计时支持还是运行时功能。但这种功能是需要代价的。由于复杂性增加，服务器控件需要更多时间来处理。然而，在大多数网站上，你可能感知不到这种差异。只有当你拥有一个页面上带有大量控件的高流量网站时，与服务器控件相比，`HTML`\
  \ 控件才能提供略好的性能并消耗更少的内存。\n\n在大多数情况下，请优先选择服务器控件而不是其 `HTML` 对应。由于服务器控件提供了更多功能，它们为你的页面提供了更大的灵活性，让你能够创建更丰富的用户体验。此外，更好的设计时支持使得选择这些控件是值得的。\n\
  \n如果你确定不需要服务器控件为你提供的功能，请选择 `HTML` 控件。\n\n本节的剩余部分将快速带你了解工具箱中的其他类别。\n\n## 数据控件（Data\
  \ Controls）\n\n数据控件是在 ASP.NET 2.0 中引入的，提供了访问数据库、XML 文件和对象等各种数据源的简单方法。不需要像早期 ASP.NET\
  \ 版本那样编写大量代码来访问数据源，只需将数据控件指向适当的数据源，ASP.NET 运行时就会为你处理大部分困难问题。你将在第 13 章及以后看到更多关于这些控件的内容。\n\
  \n## 验证控件（Validation Controls）\n\n验证控件允许你快速创建带有验证规则的 Web 表单，防止用户输入无效数据。例如，你可以强制用户输入必填字段的值，并检查输入的数据是否符合特定格式（如有效日期或\
  \ 1 到 10 之间的数字）。它们甚至允许你编写自定义代码来创建标准控件未涵盖的验证程序。验证控件的妙之处在于它们既可以在客户端也可以在服务器执行，让你能够创建响应且安全的\
  \ Web 应用程序。第 9 章将深入探讨这些控件。\n\n## 导航控件（Navigation Controls）\n\n你在工具箱 `Navigation`\
  \ 类别下找到控件用于让用户在网站中找到路径。`TreeView` 控件呈现数据的层级显示，可用于显示网站结构，方便访问网站中的所有页面。`Menu` 控件提供类似的功能，并提供水平和垂直折叠菜单的选项。\n\
  \n`SiteMapPath` 控件在你的网页中创建“面包屑导航”，使用户能够轻松地在网站页面层级中向上查找。\n\n你将在第 7 章中看到这些控件的实际应用，该章节专门介绍网站导航。\n\
  \n## 登录控件（Login Controls）\n\n与数据控件和导航控件一样，登录控件是在 ASP.NET 2.0 中引入的，并在 ASP.NET 4.5.1\
  \ 中仍然大量存在。只需少少努力，登录控件就能让你创建安全的网站，用户在注册并登录后才能访问网站的特定部分（甚至整个网站）。此外，它们还为用户提供了更改密码或在忘记旧密码时请求新密码的工具，并使你能够根据用户的登录状态和角色显示不同的数据。第\
  \ 16 章提供了更多关于 ASP.NET 安全功能和登录控件的详细信息。\n\n## Ajax 扩展（Ajax Extensions）\n\n`Ajax Extensions`\
  \ 允许你创建无闪烁的 Web 应用程序，能够通过客户端 JavaScript 在无需完整回传（postback）的情况下从服务器检索数据。你可以在第 10 章中找到它们的完整细节。\n\
  \n## WebParts\n\nASP.NET WebParts 是一组控件，允许 Web 页面的终端用户更改网站的外观和行为。这些控件超出了本书的范围。\n\
  \n## 动态数据（Dynamic Data）\n\n该类别的控件用于动态数据网站。动态数据站点允许你快速构建用户界面来管理数据库中的数据。本书将不再讨论这些控件。要了解更多关于它们的信息，请参阅\
  \ Sams 的 *ASP.NET Dynamic Data Unleashed*, Oleg Sych and Randy Patterson, 2012 (ISBN:\
  \ 978-0-672-33565-5)。\n\n## ASP.NET 状态引擎（ASP.NET STATE ENGINE）\n\n在上一节中，你创建了一个带有\
  \ `TextBox` 和 `Button` 控件的页面。在“尝试”（Try It Out）中，你在浏览器中运行了该页面，输入了一些文本并点击了按钮。按钮导致了向服务器的回传，当页面重新加载时，文本仍然存在于文本框中。在本章中，你对\
  \ `Wizard` 控件也做了相同的操作，文本框中的值也被保留了。\n\n\n\n\n然而，默认情况下，网页或控件本身无法做到这一点。因为每个请求都是独立的请求，服务器在回传（postback）后不会再次填充文本框，而是会像第一次加载时一样简单地提供页面。在其他\
  \ Web 技术（如经典 ASP 或 PHP）中，你可以通过手动编写代码在回传后预填充控件来绕过这个问题。幸运的是，ASP.NET 通过将此功能集成到 ASP.NET\
  \ 功能集中，为你让这一切变得变得简单得多。\n\n### 状态引擎是如何运作的\n\nASP.NET 中的状态引擎能够存储许多控件的状态。它不仅可以存储像 `TextBox`\
  \ 和 `CheckBox` 这样的用户输入控件的状态，还可以存储像 `Label` 甚至 `Calendar` 等控件的状态。通过演示可以很好地说明这一点。下面的练习将向你展示如何创建一个能够维护其状态的控件页面。接后的章节将解释\
  \ ASP.NET 如何实现这一点。\n\n### 并非所有控件都依赖 View State\n\n你必须理解，并不是所有控件都一直依赖 View State。许多控件能够维持自己的一些状态，正如你在上一个练习中通过\
  \ `TextBox` 控件看到的那样。这些控件包括 `TextBox`、`CheckBox`、`RadioButton` 和 `DropDownList` 控件。它们能够保持其值，是因为它们在浏览器中被渲染为标准的\
  \ HTML 表单控件。例如，`TextBox` 服务器控件在浏览器中的最终形式如下：\n\n```\n<input name=\"TextBox1\" type=\"\
  text\" value=\"Initial Text\" id=\"TextBox1\" />\n```\n\n当包含此类 `TextBox` 的页面进行回传时，浏览器也会将控件的值传回服务器。ASP.NET\
  \ 运行时就可以简单地查看该值来再次预填充文本框，而不是从 View State 中获取值。显然，这比将值也存储在 View State 中更有效率。如果是那样，该值将被发送到服务器两次：一次在文本框中，一次在\
  \ View State 中。特别是对于大值，这可能会迅速增加页面的大小，从而增加其加载时间。对于某些功能——例如跟踪在客户端所做的更改——这些控件仍然需要将其值存储在\
  \ View State 中，并且根据需要进行。\n\n除了 View State 之外，控件还支持 `Control State`（控件状态）的概念。控件使用该机制来跟踪它们正确运行所绝对需要的数据。你无法禁用\
  \ Control State，但由于 Control State 中只存储了有限的数据，所以这不是一个问题。\n\n### 关于 View State 和性能的说明\n\
  \n由于 View State 引擎为页面添加了大量信息，因此在不需要它时将其关闭通常是一个好主意。这样，你可以最小化隐藏字段 `__VIEWSTATE` 的大小，这意味着页面变得更小，从而在浏览器中加载更快。请注意，当你关闭\
  \ View State 时，你仍然可以看到隐藏的 `__VIEWSTATE` 字段，因为 Control State 使用相同的字段来存储其数据。关闭 View\
  \ State 非常简单，你可以在三个地方进行：\n\n*   **在网站级别** —— 你可以在站点根目录下的 `Web.config` 文件中通过修改（或添加）`<system.web>`\
  \ 下的 `<pages>`元素，将 `enableViewState` 属性设置为 `false`：\n\n```\n<pages enableViewState=\"\
  false\">\n  ...\n</pages>\n```\n\n*   **在页面级别** —— 在每个页面的顶部你会找到*页面指令*（page directive），这是一系列告诉\
  \ ASP.NET 运行时页面应该如何行为的指令。在页面指令中，你可以将 `EnableViewState` 设置为 `False`：\n\n```asp\n\
  <%@ Page Language=\"VB\" AutoEventWireup=\"False\" CodeFile=\"State.aspx.vb\"\n\
  \             Inherits=\"Demos_State\" EnableViewState=\"False\" %>\n```\n\n此选项对于你确定完全不需要\
  \ View State 的页面非常有用。\n\n*   **在控件级别** —— 每个 ASP.NET 服务器控件都允许你单独设置 `EnableViewState`，让你可以选择关闭某些控件的它，同时保持其他控件的开启。\n\
  \n一旦你在较高级别（`Web.config` 或页面级别）关闭了 View State，在较低低级别（页面或特定控件）再次将 `EnableViewState`\
  \ 设置为 `True` 将不起作用。但是，使用 `ViewStateMode` 属性你仍然可以实现以下操作：\n\n*   不要在 `Web.config`\
  \ 文件中关闭 View State。\n*   在页面级别，将 `EnableViewState` 设置为 `True` 并将 `ViewStateMode`\
  \ 设置为 `Disabled`，如下：\n\n```asp\n<%@ Page Language=\"C#\" ... EnableViewState=\"\
  True\" ViewStateMode=\"Disabled\" %>\n```\n\n这将关闭页面中所有控件的 View State，那些通过将 `ViewStateMode`\
  \ 设置为 `Enabled` 显式重新开启的控件除外。\n\n*   对于你想提供 View State 支持的控件，将 `ViewStateMode` 设置为\
  \ `Enabled`，如下：\n\n```asp\n<asp:Label ID=\"Label1\" runat=\"server\" Text=\"Label\"\
  \ ViewStateMode=\"Enabled\" />\n```\n\n如果你想在演示页面中看到此效果，请像上一个示例一样修改 `State.aspx`\
  \ 的页面指令，将 `EnableViewState` 设置为 `True` 并将 `ViewStateMode` 设置为 `Disabled`。然后在页面中创建第二个\
  \ `Label`，并将第一个 `ViewStateMode` 设置为 `Enabled`：\n\n```asp\n<asp:Label ID=\"Label1\"\
  \ runat=\"server\" Text=\"Label\" ViewStateMode=\"Enabled\" />\n<asp:Label ID=\"\
  Label2\" runat=\"server\" Text=\"Label\" />\n```\n\n\n\n\nASP.NET 最伟发明之一是状态引擎，它允许控件在回传（postbacks）期间保持其状态。状态引擎极大地节省了时间，让你无需在每个\
  \ 页面中编写大量枯燥无聊的代码来模拟这种行为。然而，你应该尽可能关闭 `View State`（视图状态）以提高性能。\n\n本章还向你介绍了一些 Visual\
  \ Basic 和 C# 中的微不足道的服务器端代码。下一章将让你对编写 ASP.NET 页面有更深入的理解。你会看到编程语言看起来是什么样的，它包含哪些元素，以及如何自己编写代码供你的\
  \ ASP.NET 页面使用。最棒的是，示例都是用 Visual Basic 和 C# 呈现的，所以你不会被困在某种你可能不喜欢的语言中。\n\n# 本章你学到了\n\
  \n| 术语 |  |\n| :--- | :--- |\n| `__VIEWSTATE` | 用于从服务器到客户端反向传输状态的隐藏表单字段。 |\n| `Container\
  \ controls`（容器控件） | 通过封装其他内容和控件来充当容器的服务器控件。 |\n| `Events tab`（事件选项卡） | 属性网格的一部分，允许你设置控件事件的处理程序，例如\
  \ `Button` 的 `Click` 事件。 |\n| `List controls`（列表控件） | 向用户展示项目列表的服务器控件，例如 `DropDownList`、`CheckBoxList`\
  \ 等。 |\n| `POST` 和 `GET` 方法 | 从客户端向服务器提交数据的不同方法。使用 `POST` 时，数据被添加到请求体中；而使用 `GET`\
  \ 时，数据被附加到请求页面的地址。 |\n| `Postback`（回传） | 从客户端浏览器向服务器发送表单数据的过程。 |\n| `Server Controls`（服务器控件）\
  \ | ASP.NET 的核心工作，用于在浏览器中构建网页的用户界面。 |\n| `Smart Tasks panel`（智能任务面板） | 某些控件中出现的操作面板，帮助你完成常见任务。\
  \ |\n| `View State`（视图状态） | 允许 ASP.NET 控件在客户端存储状态的机制。 |\n\n# 第 5 章：编写你的 ASP.NET\
  \ Web 页面\n\n## 本章你将学到：\n\n- 如何在编程环境中中使用数据类型、变量、对象和集合\n- 在代码中做出决策的不同方法\n- 创建可轻松复用的功能块的选项\n\
  - 编写组织良好且文档齐全的代码的不同方法\n- 什么是面向对象，以及你如何在应用程序中使用它\n\n## 本章 WROX.COM 代码下载\n\n你可以在 `www.wrox.com/go/begaspnet451`\
  \ 的 Download Code 选项卡找到本章的 `wrox.com` 代码下载。代码位于 `Chapter 5` 文件夹中。\n\n## 引言\n\n在前四个章节中，你创建了许多\
  \ Web Forms，其中大部分包含 ASP.NET `Server Controls` 和纯 HTML。只有少数示例包含了用 `C#` 或 `Visual\
  \ Basic` (`VB.NET`) 编写的实际编程代码，而且大部分代码都非常简单。然而，你的所有页面并不总是那么简单，而阅读、理解和编写代码的能力是你 Web\
  \ 开发工具箱中的一项关键资产。\n\n本章将教你 Web 应用程序编程的基础及进阶知识。正如书中所有其他示例一样，整个章节都涵盖了 `VB.NET` 和 `C#`。对于本章介绍的每个概念或理论，你都会同时看到\
  \ `VB.NET` 和 `C#` 的示例。你偏好哪种语言完全取决于你的决定。\n\n### 编程入门\n\n要开始编程，理解所有类型语言和应用程序程序员通用的常用术语至关重要。本章的其余部分将向你介绍相当多的术语和概念。大多数术语都带有代码示例，以便你可以看到它们如何在实际代码中使用的。\n\
  \n同样重要的是要意识到这并不是完整的编程介绍。编程语言的每一个细节都没有被涵盖。相反，本章侧重于成功构建日常网站所需的理解的关键概念。一旦你掌握了这些，你会发现通过学习你喜欢的编程语言中更奇特的特性来加深编程知识会更容易。\n\
  \n你在本章及后续章节中编写的代码要么添加到网页的 `Code Behind`（代码后），要么存放在特殊 `App_Code` 文件夹中的单独 `class file`\
  \ 中。当 ASP.NET 运行时处理包含代码的页面的请求时，它会首先 `compiles`（编译）它在页面、`Code Behind` 或类文件中发现的任何代码。当代码被编译时，它正在从人类可读的编程语言（如\
  \ `C#` 或 `VB.NET`）转换为 `Microsoft Intermediate Language` (`MSIL`)，这是 `.NET Framework`\
  \ 运行时可以理解并执行的语言。ASP.NET 网站编译过程的结果是系统临时文件夹中的一个或多个程序集——带有 `.DLL` 扩展名的文件。此编译过程只在页面被创建或更改后第一次被请求时发生。对同一页面的后续请求将导致重用相同的\
  \ `DLL` 进行请求。幸运的是，在 ASP.NET 网站中，编译是在后台进行的，所以你通常不需要担心它。\n\n要开始编程，你首先需要查看的概念是数据类型和变量，因为它们是任何编程语言的基石。\n\
  \n## 数据类型和变量\n\n起初当你思考某些编程环境中使用的数据时，你可能没有意识到每条数据都有数据类型。为了有效地处理数据，许多编程语言有不同的数据类型，每个数据类型都限于特定类型的信息。开箱即用的\
  \ `.NET Framework` 提供了长长的数据类型，允许你处理数字（如 `Int32`、`Int16` 和 `Double`）、文本字符串（`Char`\
  \ 和 `String`）、日期（`DateTime`）、真假结构（`Boolean`）等。稍后将常用类型列表。\n\n对于每种主要数据类型，都有一个特殊的数据类型。为了处理该数据，你可以将其存储在需要先\
  \ `declare`（声明）的 `variable` 中。在 `VB.NET` 中你使用 `Dim Variable As DataType`，而在 `C#`\
  \ 中你使用 `DataType Variable`。变量名称通常由字母、数字和下划线组成，且不能以数字开头。这些规则也适用于其他标识符，例如你之后会看到的 `classes`\
  \ 和 `methods`。以下示例向你展示如何声明两个变量：一个用于存储数字的 `Integer`（C# 中为 `int`）和一个用于存储文本的 `String`（C#\
  \ 中为 `string`）：\n\n```vb.net\n' 定义一个类型为 Integer 的变量来存储中整数\nDim distanceInMiles As\
  \ Integer\n\n' 定义一个存储某些名字的变量\nDim firstName As String\n```\n\n```csharp\n// 定义一个类型为\
  \ int 的变量来存储中整数\nint distanceInMiles;\n\n// 定义一个存储某些名字的变量\nstring firstName;\n```\n\
  \n这两个代码示例还包含注释，`VB.NET` 中以反引号（’）为前缀，`C#` 中以双斜杠（`//`）为前缀。你将在本章稍后部分学习更多关于代码注释的知识。\n\
  \n声明变量后，你可以对其赋值。你可以直接将数字和布尔值类型分配给变量。要给变量分配字符串，你需要将其包含双引号中：\n\n```vb.net\nDim distanceInMiles\
  \ As Integer\ndistanceInMiles = 437\n\nDim firstName As String\nfirstName = \"Imar\"\
  \n```\n\n```csharp\nint distanceInMiles;\ndistanceInMiles = 437;\n\nstring firstName;\n\
  firstName = \"Imar\";\n```\n\n\n\n\n\n```\nint distanceInMiles;\ndistanceInMiles\
  \ = 437;\n\nstring firstName;\nfirstName = \"Imar\";\n```\n\n除了单独声明和赋值外，你还可以一次性声明变量并为其赋值一个值：\n\
  \n### VB.NET\n\n```vb\nDim distanceInMiles As Integer = 437\nDim firstName As String\
  \ = \"Imar\"\n```\n\n### C#\n\n```csharp\nint distanceInMiles = 437;\nstring firstName\
  \ = \"Imar\";\n```\n\n虽然变量名几乎可以是你喜欢的任何字符，但建议为每个变量取一个具有意义的名称，以描述其用途。例如，用于存储名字的字符串可以称为\
  \ `firstName`，而存储人年龄的变量可以简单地称为 `age`。在 .NET 中，局部变量通常使用所谓的“驼峰命名法”（`camel case`），这意味着除了第一个字母外，每个单词的首字母都大写。为了帮助你稍后在代码中查找变量类型，当你在代码编辑器中悬停在变量上时，VS\
  \ 会显示一个非常有用的工具提示，使得查找变量类型变得非常容易。图 5-1 显示 C# 中的 `distanceInMiles` 变量类型为 `int`。\n\n\
  ![image](img/f138-01.jpg)\n\n**图 5-1**\n\n建议不要在变量名前加字母来表示其类型。例如，对于存储名字的 `String`，应该写\
  \ `firstName` 而不是 `sFirstName`。这种被称为“匈牙命名法”（`Hungarian Notation`）的写法被认为是过时的。像 Visual\
  \ Studio 等 IDE 拥有智能 IntelliSense 和其他编程工具，不再真正需要它。没有了匈牙命名法，你的代码变得更易读（`age` 比 `iAge`\
  \ 更易读），且更容易维护，因为你可以更改变量的类型而无需在所有使用它的地方重命名。\n\nMicrosoft .NET 支持许多不同的编程语言，包括 VB.NET、C#\
  \ 等。所有这些语言都能相互通信。例如，你可以用 C# 编写一些代码，使用 Visual Studio Express 2013 Windows 桌面版将其编译为\
  \ `.dll` 文件（一个可以被其他 .NET 调用的可用代码文件），然后在使用 VB.NET 作为主语言的 Web 应用程序中使用它。由于这种互操作性，必须约定一套系统让所有\
  \ .NET 编程语言能够理解彼此。这个系统被称为“通用类型系统”（`Common Type System`，`CTS`）。是 `CTS` 定义了所有符合 CTS\
  \ 标准的语言可以访问的数据类型。每种语言都可以自由定义一组“原始类型”（`primitive types`），这些类型本质上是 .NET Framework\
  \ 中更复杂类型描述的快捷方式或别名。因此，即使 CTS 定义了一个名为 `System.Int32` 的类型，C# 等语言也可以自由地将该类型别命名为 `int`，VB\
  \ 也可以将其别命名为 `Integer`，以便开发者使用。\n\n下表列出了 .NET Framework 中常见的 CTS 类型及其对应的 C# 和 VB.NET\
  \ 别名。该表还列出了变量的范围及其用途。\n\n| **.NET** | **C#** | **VB.NET** | **DESCRIPTION** |\n\
  | :--- | :--- | :--- | :--- |\n| System.Byte | byte | Byte | 用于存储 0 到 255 之间的小型正整数。当未显式赋值时，默认值为\
  \ 0。 |\n| System.Int16 | short | Short | 能够存储 –32,768 到 32,767 之间的整数。默认值为 0。 |\n\
  | System.Int32 | int | Integer | 能够存储 –2,147,483,648 到 2,147,483,647 之间的整数。默认值为\
  \ 0。 |\n| System.Int64 | long | Long | 存储 –9,223,372,036,854,775,808 到 9,223,372,036,854,775,807\
  \ 之间的大整型。默认值为 0。 |\n| System.Single | float | Single | 存储 –3.4028235E+38 到 3.4028235E+38\
  \ 之间的带小数的大数。默认值为 0.0。 |\n| System.Double | double | Double | 可以存储大分数值。在处理分数值时，它不如\
  \ Decimal 准确，但在不需要极端精度的情况下，你应该优先选择 Double 而不是 Decimal，因为 Double 速度快一点。默认值为 0.0。\
  \ |\n| System.Decimal | decimal | Decimal | 以高精度存储极大的分数值。默认值为 0。这种数据类型通常用于存储货币值。\
  \ |\n| System.Boolean | bool | Boolean | 用于存储简单的布尔值：VB 中为 True 或 False，C# 中为 true\
  \ 或 false。默认值为 False。 |\n| System.DateTime | n/a | Date | VB.NET 有 System.DateTime\
  \ 类型的别名，用于存储日期时间值。C# 没有定义该类型的别名。默认值为 1/1/0001: 12:00 a.m.。 |\n| System.Char | char\
  \ | Char | 存储单个字符。默认值为 Nothing（C 中为 null）。 |\n| System.String | string | String\
  \ | 可以存储文本。 |\n| System.SByte | sbyte | SByte | 用于存储 –128 到 127 之间的整数。 |\n| System.UInt16\
  \ | ushort | UShort | 能够存储 0 到 65,535 之间的无符号整数。 |\n| System.UInt32 | uint | UInteger\
  \ | 能够存储 0 到 4,294,967,295 之间的无符号整数。 |\n| System.UInt64 | ulong | ULong | 能够存储 0\
  \ 到 18,446,744,073,709,551,615 之间的无符号整数。 |\n| System.Object | object | Object |\
  \ 所有对象的基类。 |\n\n### 类型转换\n\n转换类型最常见方法将其转换为 `String`。Web 应用程序在许多地方使用字符串类型。例如，`TextBox`\
  \ 返回的 `Text` 是 `String`，`DropDownList` 的 `SelectedValue` 也是。要获取 `Object` 的字符串表示，可以调用其\
  \ `ToString()` 方法。每个 .NET 对象都支持此方法，尽管具体行为可能随对象而异。现在重要的是理解 `ToString` 是对象上的一个方法或操作，例如\
  \ `String` 或 `Double`，甚至是基类 `Object`。在本章稍后部分将介绍更多关于方法和对象的知识。\n\n使用 `ToString()`\
  \ 非常简单，下例在 `Label` 控件上输出今天的日期和时间所示：\n\n### VB.NET\n\n```vb\nLabel1.Text = System.DateTime.Now.ToString()\n\
  ```\n\n### C#\n\n```csharp\nLabel1.Text = System.DateTime.Now.ToString();\n```\n\
  \n另一种转换类型的方法是使用 `Convert` 类。\n\n`Convert` 类包含了将许多数据类型转换为另一种类型的功能。以下是将看起来像布尔值的 `String`\
  \ 转换为真正的 `Boolean` 简单示例：\n\n### VB.NET\n\n```vb\nDim myBoolean1 As Boolean = Convert.ToBoolean(\"\
  True\")  ' 结果为 True\nDim myBoolean2 As Boolean = Convert.ToBoolean(\"False\") '\
  \ 结果为 False\n```\n\n### C#\n\n```csharp\nbool myBoolean1 = Convert.ToBoolean(\"\
  True\");           // 结果为 true\nbool myBoolean2 = Convert.ToBoolean(\"False\");\
  \          // 结果为 false\n```\n\n除了 `ToBoolean` 方法外，`Convert` 还提供了许多其他转换方法，包括 `ToInt32`（用于整数类型）、`ToDateTime`（用于日期）和\
  \ `ToString`。\n\n\n\n\n将一种类型转换为另一种类型的另一种方法是使用强制转换（casting）。通过强制转换，你实际上是强制将一种类型变为另一种，这与转换（converting）不同，转换是将数据类型的底层值转换为新值。\n\
  \n强制转换仅适用于兼容类型。例如，你不能将 `DateTime` 强制转换为 `Integer`。但是，你可以转换相似的类型，例如将 `Double` 转换为\
  \ `Integer` 或将 `String` 转换为 `Object`。后一个例子的反向操作并不总是成立。之前我提到过 .NET Framework 中的每个数据类型都基于\
  \ `Object` 数据类型，这意味着例如，`String` 是一个 `Object`。然而，并不是每个 `Object` 都是 `String`。当你尝试将一种类型强制转换为另一种类型并遇到编译错误或运行时错误时，请记住这一点。本书的后续章节将向你展示更多如何将兼容类型相互强制转换的示例。\n\
  \n使用 VB.NET 将一种类型转换为另一种类型，你有几种选择。首先，你可以使用 `CType` 和 `DirectCast`。`CType` 稍微灵活，因为它允许你在两个看起来相似的对象之间进行强制转换。而\
  \ `DirectCast` 仅允许在兼容类型之间进行强制转换，但速度稍快。以下 VB.NET 示例展示了其工作原理：\n\n```\nDim o1 As Object\
  \ = 1\nDim i1 As Integer = DirectCast(o1, Integer)    ' 正常，因为 o1 是 Integer\nDim\
  \ i2 As Integer = CType(o1, Integer)         ' 正常，因为 o1 是 Integer\n\nDim o2 As Double\
  \ = 1                               \nDim i3 As Integer = DirectCast(o2, Integer)\
  \    ' 无法编译，因为 o2 不是\n                                              ' Integer\n\
  Dim i4 As Integer = CType(o2, Integer)         ' 正常，因为 o2 看起来像\n               \
  \                               ' Integer\n```\n\n在示例的第一部分，声明了一个名为 `o1` 的对象并为其赋值了\
  \ `Integer` 类型的值 `1`。尽管 `o1` 在外部世界表现为 `Object`，但它的底层值仍然是 `Integer`。调用 `DirectCast`\
  \ 时，强制转换成功了，因为 `o1` 在底层是一个 `Integer`。\n\n在第二个示例中，`o2` 被声明为 `Double`，这是一种看起来有点像 `Integer`\
  \ 的数值类型，但实际上并不是。因此，对 `DirectCast` 的调用失败了，因为 `Double`不能强制转换为 `Integer`。另一方面，`CType`\
  \ 运行良好，因为变量 `o2` 的底层值看起来像 `Integer`，因此可以转换为它。重要的一点是，如果 `Double` 类型具有小数部分，该部分在强制转换为\
  \ `Integer` 时将会丢失。\n\nVB.NET 中强制转换的第三种选择是使用 `TryCast` 关键字，它与其他两个选项有些相似。当对象无法正确进行强制转换时，`TryCast`\
  \ 返回 `Nothing`，而 `DirectCast` 和 `CType` 则会导致代码崩溃。\n\n在 C# 中，你有两种方法来转换对象。最常用的方法是在要强制转换的表达式前面用括号括起数据类型。这与\
  \ VB.NET 中的 `CType` 类似：\n\n```\nobject o1 = 1;\nint i1 = (int)o1;              \
  \       // 正常\n\ndouble o2 = 1;\nint i2 = (int)o2;                     // 正常\n```\n\
  \n或者，你可以使用 `as` 关键字，它的工作原理类似于 VB.NET 中的 `TryCast`，即如果强制转换未成功，代码不会崩溃。下面的示例代码显示你不能将\
  \ `Integer` 强制转换为 `ArrayList`（你将在本章稍后的部分遇到它）。变量 `myList` 没有崩溃，而是简单地包含 `null`，表示强制转换操作未成功：\n\
  \n```\nobject o1 = 1;\nArrayList myList = o1 as ArrayList;  // 未强制转换，但也不会崩溃\n```\n\
  \n你将在本书的剩余章节中学习更多关于强制转换和转换的知识。\n\n## 使用数组和集合\n\n到目前为止，你看到的数据类型相对简单且是单一对象。例如，你在 `Boolean`\
  \ 类型中存储了 `True` 或 `False` 值，在 `Integer` 中存储了像 `123` 这样的数字。但万如果你需要存储大量整数呢？如果你想存储像多边形等复杂形状的顶点，你可能就有这种需求。或者，你可能需要将应用程序支持的所有角色存储在单个变量中，以便在管理部分的\
  \ 页面上显示它们。这时，数组和集合就大显身场了。\n\n### 定义和操作数组\n\n你可以将数组看作一个装有相同类型物品的大袋或列表。你在声明数组时定义了数组中物品的数据类型。数组中的每个项目通过从\
  \ 0 开始的顺序数字（所谓的索引）来标识，这使得数组是基于 0 的。在 VB.NET 中声明和访问数组时使用括号，而在 C# 中你使用方括号。在定义数组并填充其元素后，你可以根据从\
  \ 0 开始的元素索引（0, 1, 2 等）来访问元素。\n\n下面的代码段定义了一个名为 `roles` 的数组，它可以同时容两个角色：\n\nVB.NET\n\
  ```\nDim roles(1) As String\n```\n\nC#\n```\nstring[] roles = new string[2];\n```\n\
  \n看到 VB.NET 和 C# 之间的区别了吗？这不是拼写错误。在 VB.NET 中，你定义的是上界。在 C# 中，你只需要定义大小。要将角色名称输入数组，你使用以下代码：\n\
  \nVB.NET\n```\nroles(0) = \"Administrators\"\nroles(1) = \"ContentManagers\"\n```\n\
  \nC#\n```\nroles[0] = \"Administrators\";\nroles[1] = \"ContentManagers\";\n```\n\
  \n与数组声明一样，你在 VB.NET 中使用括号，在 C# 中使用方括号来访问数组中的元素。注意，`(0)` 和 `[0]` 指第一个元素，`(1)` 和 `[1]`\
  \ 指第二个元素。\n\n根据设计，数组具有固定大小。因此，根据上一个定义两个元素的数组示例，以下代码将抛出错误：\n\nVB.NET\n```\nroles(2)\
  \ = \"Members\"    ' 抛出错误\n```\n\nC#\n```\nroles[2] = \"Members\";   // 抛出错误\n```\n\
  \n这段代码试图将第三个角色挤进一个只能容纳两个元素的数组中。显然，这放不下，你会收到一个提示“索引超出数组边界”的错误。但如果你需要在代码的后期阶段运行时为数组创建更多空间呢？在\
  \ VB.NET 中这非常简单。你可以使用 `ReDim` 语句：\n\n```\nReDim Preserve roles(2)\nroles(2) = \"\
  Members\"                 ' 现在正常了\n```\n\n这行代码重新调整了数组的大小：将上界设为 2，从而为第三个元素留了空间。`Preserve`\
  \ 关键字对于保持数组中当前项目是必要的。如果没有它，重新调整后的数组将是空的。\n\nC# 没有直接的关键字来重新调整数组。但是，你可以利用 .NET Framework\
  \ 的 `Array` 类来如下调整数组：\n\n```\nArray.Resize(ref roles, 3);      // 调整数组大小以\n    \
  \                           // 纳三个元素\n\nroles[2] = \"Members\";            // 现在正常了\n\
  ```\n\n\n\n\n现在不需要担心这种语法；你可能并不经常需要用到它，因为 .NET Framework 提供了固定大小数组的替代方案。由于 VB.NET\
  \ 也可以使用 `Array.Resize`，如果你在使用该语言，你有两个选项可以选择。\n\n当你开始使用数组时，你会发现它们在运行时使用速度很快，但缺少一些实用的功能。例如，向数组中添加新元素或删除现有项并不简单。幸运的是，.NET\
  \ Framework 提供了一系列非常有用的集合，这些集合可以提供你所需的功能集。\n\n## 定义和使用集合\n\n`Collections`（集合）与数组相似，因为它们都允许你在单个变量中存储多个对象。“袋子”类比也适用于集合：你只需要将若干件物品放入袋子中，它就会为你保存这些物品。集合的不同之处在于它们允许你如何处理袋子中的数据。与其是简单地通过索引访问每个项，大多数集合都暴露了\
  \ `Add` 方法，允许你向集合中添加项。同样地，它们还有 `Remove` 和 `Clear` 方法来移除集合中的一个或所有项。与数组一样，它们允许你对它们进行\
  \ `iterate`（迭代）或循环，以访问集合中的项。\n\n当集合首次在 .NET Framework 1.0 中引入时，`ArrayList` 和 `Hashtable`\
  \ 迅速受欢迎，因为它们太容易使用了。`ArrayList` 允许你添加任意对象，这些对象将按照你添加它们的顺序存储；而 `Hashtable` 则允许你存储由自定义键引用的对象。这些集合相比于它们的数组表亲，主要的优势是它们可以根据需要进行增长。与之前的示例不同（你需要调整数组大小来为第三个角色留出空间），`ArrayList`\
  \ 在需要时会动态增长。下面的示例展示了它是如何工作的：\n\nVB.NET\n\n```vb\nDim roles As New ArrayList()  \
  \    '  创建一个新的 ArrayList。你不需要\n                                  '  显式设置它的大小\n\n\
  roles.Add(\"Administrators\")       '  添加第一个角色\nroles.Add(\"ContentManagers\") \
  \     '  添加第二个角色\nroles.Add(\"Members\")              '  继续添加角色，ArrayList\n    \
  \                              '  会根据需要增长\n```\n\nC#\n\n```csharp\nArrayList roles\
  \ = new ArrayList(); // 创建一个新的 ArrayList。你不需要\n                                \
  \  // 显式设置它的大小\n\nroles.Add(\"Administrators\");        // 添加第一个角色\nroles.Add(\"\
  ContentManagers\");      // 添加第二个角色\nroles.Add(\"Members\");               // 继续添加角色，ArrayList\n\
  \                                  // 会根据需要增长\n```\n\n由于这段代码现在调用的是方法（`Add`）而不是将项赋值给数组中预定义的索引，在\
  \ VB.NET 和 C# 中都需要括号 `()`。方法的用法将在本章稍后讨论。\n\n虽然集合解决了数组的一些问题，但它们也引入了一些自己的问题。`ArrayList`\
  \ 最大的缺点是它不是 `strongly typed`（强类型的）。这意味着你可以使用 `Add` 方法向列表添加 `any object`（任何对象）。这意味着\
  \ `ArrayList` 可以同时持有不同类型的对象。起初这似乎不是什么大事，但一旦你开始处理包含多种类型对象的 `ArrayList`，你就会很快发现为什么这是一个问题。再次以角色的示例为例。在数组和\
  \ `ArrayList` 版本中，代码只是添加了几个包含角色名称的字符串。然后你可以使用这三个字符串来，例如在 Web Form 中构建一个下拉列表，以便户户选择角色。到目前为止良好。但如果列表中的某个项不是字符串怎么办？如果另一个开发者不小心写了某些代码，向\
  \ `ArrayList` 添加了 `DropDownList` 控件怎么办？由于 `ArrayList` 接受所有对象，它不会报错。然而，如果你的代码期望得到\
  \ `String` 却得到了 `DropDownList` 控件，你的程序将会崩溃。\n\n随着 .NET 2.0，Microsoft 引入了一个名为 `generics`（泛型）的概念。泛型在\
  \ .NET 4.5.1 版本中仍然广泛存在，帮助你克服像 `ArrayList` 这样的弱类型集合所引入的问题。\n\n## 泛型简介\n\n自从从 .NET\
  \ 2.0 引入以来，泛型出现在 .NET Framework 的许多不同的位置。虽然它们在涉及集合的场景中被频繁使用，但泛型的使用并不限于集合；你也可以将它们用于单一类型的对象。\n\
  \n泛型之于代码，就像 Microsoft Word 模板之于文字处理。它们允许你编写一个 `code template`（代码模板），该模板可以在不同的场景下配合不同的类型使用。通过泛型，你可以定义一个不显式指定类型的泛型代码模板。只有当该代码被使用时，你才定义类型。这样做的主要益处是，你可以为多种数据类型反复重用同一个模板，而无需重新输入和维护多个版本的代码。除了在你自己的代码定义中使用泛型外，你会在\
  \ .NET Framework 中发现大量支持泛型的对象和集合，准备好供你的代码使用。\n\n要理解你如何利用泛型，请看下面的示例。它本质上与你之前看到的使用\
  \ `ArrayList` 的代码相同，但这次列表的类型受到了限制，它只接受字符串：\n\nVB.NET\n\n```vb\nDim roles As New\
  \ List(Of String)\n\nroles.Add(\"Administrators\")\nroles.Add(\"ContentManagers\"\
  )\nroles.Add(\"Members\")\n```\n\nC#\n\n```csharp\nList<string> roles = new List<string>();\n\
  \nroles.Add(\"Administrators\");\nroles.Add(\"ContentManagers\");\nroles.Add(\"\
  Members\");\n```\n\n\n\n\n\n# 语句 (STATEMENTS)\n\n为了让程序或网站实现某些功能，你需要为它提供可以执行的代码语句。语句涵盖了广泛的动作，例如显示此按钮、发送此电子邮件、当用户点击该按钮时执行某些代码等。然而，仅仅执行这些动作是不够的。你通常只需要在当某个\
  \ `condition`（条件）为真时才执行某些代码。例如，如果电子商务网站的访问者一次购买了超过 100 美元的商品，她可能会获得 10% 的折扣。否则，她将支付全价。因此，条件或决策是编程语言中非常重要的语句。另一组重要的语句是\
  \ `loops`（循环）。循环允许你重复执行某段代码若干次。例如，你可以设置一个从 1 到 10 的循环，在每次迭代中执行某些操作。或者，你可以遍历购物车中的产品，例如累加它们的总价。\n\
  \n最后的一组重要语句是 `operators`（运算符）。运算符允许你对值进行某些操作；或者更准确地说，它们允许你对这些值进行 `operate`（操作）。例如，你使用运算符对值进行加、减、拼接（组合）或相互比较。\n\
  \n接下来的三个部分将深入探讨运算符、决策和循环。\n\n## 运算符 (Operators)\n\n最重要的运算符可以逻辑上分组为五种不同的类型；本节将涵盖这些类型。在这五种类型中，赋值运算符（assignment\
  \ operators）可能是最容易理解和使用的。\n\n### 赋值运算符 (Assignment Operators)\n\n赋值运算符用于给变量赋一个值。这个值可以来自许多来源：常量值（如数字\
  \ 6）、另一个变量的值，或者表达式或函数的结果（这些将在后文中讨论）。在最简单的形式中，赋值如下所示，将数字 `42` 赋值给 `age` 变量：\n\nVB.NET\n\
  ```\nDim age As Integer = 42\n```\n\nC#\n```c\nint age = 42;\n```\n\n如果这个 `age`\
  \ 变量所指代的人刚刚过完生日呢？你需要给 `age` 的值加 `1`。这就是算术运算符派用用场。\n\n### 算术运算符 (Arithmetic Operators)\n\
  \n算术运算符允许你对变量和值执行大多数熟悉的计算，如加、减和除。下表列出了 VB.NET 和 C# 的常用算术运算符。\n\n| **VB.NET** | **C#**\
  \ | **用法** |\n| :--- | :--- | :--- |\n| + | + | 将两个值相加 |\n| − | − | 从一个值减去另一个值 |\n\
  | * | * | 两个值相乘 |\n| / | / | 两个值相除 |\n| \\ | n/a | 两个值相除但始终返回取整后的整数 |\n| ^ | n/a\
  \ | 将一个值提升到另一个值的幂 |\n| Mod | % | 除两个整数并返回余数 |\n\n前四个运算符可能很熟悉，它们的用法也相当直观。下面的代码段显示了你可以使用这些运算符执行的基本操作：\n\
  \nVB.NET\n```\nDim firstNumber As Integer = 100\nDim secondNumber As Single = 23.5\n\
  Dim result As Double = 0\n\nresult = firstNumber + secondNumber     ' 结果为 123.5\n\
  result = firstNumber - secondNumber     ' 结果为 76.5\nresult = firstNumber * secondNumber\
  \     ' 结果为 2350\nresult = firstNumber / secondNumber     ' 结果为 4.25531914893617\n\
  ```\n\nC#\n```c\nint firstNumber = 100;\nfloat secondNumber = 23.5F;\ndouble result\
  \ = 0;\n\nresult = firstNumber + secondNumber;    // 结果为 123.5\nresult = firstNumber\
  \ - secondNumber;    // 结果为 76.5\nresult = firstNumber * secondNumber;    // 结果为\
  \ 2350\nresult = firstNumber / secondNumber;    // 结果为 4.25531914893617\n```\n\n\
  注意，在 C# 示例中，你需要在值 `23.5` 加上字母 `F`。这告诉编译器你确实想要 `float` 而不是 `double`。\n\nVB.NET 还支持\
  \ `\\` 运算符，它基本上执行除法然后去掉余数，有效地将返回值向下到最近的整数：\n\nVB.NET\n```\nresult = firstNumber\
  \ \\ secondNumber    ' 结果为 4\n```\n\nC# 没有专门的特殊运算符。然而，当你尝试除以两个整数时，结果也总是整数。这意味着 `7`（存储为\
  \ `int`）除以 `2`（存储为 `int`）结果将是 `3`。意识到这种取整操作是非常重要的，否则你可能会得到意想不到的结果。\n\n最后两个运算符需要更多的解释。首先，`^`\
  \ 运算符——用于计算一个数字的另一个数字的幂——仅在 VB.NET 语言可用：\n\nVB.NET\n```\nDim result As Double\n\n\
  result = 2 ^ 3              ' 结果为 8 (2 * 2 * 2)\nresult = 3 ^ 2              ' 结果为\
  \ 9 (3 * 3)\n```\n\nC# 不支持这个运算符，但你可以轻松地使用 `Math.Pow` 来复制它的行为，它是 .NET Framework 提供的。下面的代码段在功能上与之前的等效：\n\
  \nC#\n```c\nresult = Math.Pow(2, 3);    // 结果为 8\nresult = Math.Pow(3, 2);    //\
  \ 结果为 9\n```\n\n最后一个运算符是 `modulus`（模运算）。它返回两个整数除法后的余数。\n\nVB.NET\n```\nDim firstNumber\
  \ As Integer = 17\nDim secondNumber As Integer = 3\nDim result As Integer\nresult\
  \ = firstNumber Mod secondNumber     ' 结果为 2\n```\n\nC#\n```c\nint firstNumber =\
  \ 17;\nint secondNumber = 3;\nint result = firstNumber % secondNumber; // 结果为 2\n\
  ```\n\n简单来说，模运算符尝试尽可能多地从第一个数减去第二个数，然后返回余数。这通常用于判断一个数是奇数还是偶数。\n\n在处理运算符时，记住它们的优先级是非常重要的。例如，考虑以下计算：\n\
  \n```\n2 + 10 * 4\n```\n\n你可能会认为结果是 `48`，如果你先将 `2` 和 `10` 相加，然后乘以 `4`。然而，结果是 `42`，因为先执行了乘法。为了强制不同的运算符顺序，你可以在表达式中使用括号。例如：\n\
  \n```\n(2 + 10) * 4\n```\n\n这现在会得到 `48`，因为加法运算符先于乘法运算符执行。\n\n\n\n\n\n```\nint someNumber1\
  \ = 3;\nint someNumber2 = 3;\nint someNumber3 = 3;\nint someNumber4 = 3;\nsomeNumber1\
  \ += 3;       // Results in someNumber1 having the value 6\nsomeNumber2 -= 3;  \
  \     // Results in someNumber2 having the value 0\nsomeNumber3 *= 3;       // Results\
  \ in someNumber3 having the value 9\nsomeNumber4 /= 3;       // Results in someNumber4\
  \ having the value 1\n```\n\nC# 还允许你使用 `++` 运算符将变量的值增加 `1`，如下所示：\n\n```cs\nint someNumber\
  \ = 3;\nsomeNumber++;         // Results in someNumber having the value 4\n```\n\
  \n这种结构经常用于循环中，正如你将在本章后面部分看到的那样。\n\n这两种语言也使用算术赋值运算符来连接字符串值，你很快就会看到。\n\n另一组常用的运算符是比较运算符，它们允许你比较两个值。\n\
  \n## 比较运算符\n\n与算术运算符一样，VB.NET 和 C# 各自都有自己的一套比较运算符来比较一个值与另一个值。比较运算符始终比较两个值或 `expressions`，然后返回一个布尔值作为结果。下表列出了常用的比较运算符。\n\
  \n| **VB.NET** | **C#** | **用法** |\n| :--- | :--- | :--- |\n| = | == | 检查两个值是否相等\
  \ |\n| <> | != | 检查两个值是否不等 |\n| < | < | 检查第一个值是否小于第二个 |\n| > | > | 检查第一个值是否大于第二个\
  \ |\n| <= | <= | 检查第一个值是否小于或等于第二个 |\n| >= | >= | 检查第一个值是否大于或等于第二个 |\n| Is | is |\
  \ 在 VB.NET 中：比较两个对象；在 C# 中：检查变量是否为特定类型 |\n\n你首先会注意到，C# 使用双等号 (`==`) 作为标准比较运算符。这显然使它与赋值运算符区别开来。在\
  \ C# 中，如果你打算比较两个值，只使用单等号是一个常见的错误。考虑以下示例：\n\n```cs\nif (result = 4)\n{\n  // Do something\
  \ here with result\n}\n```\n\n这里的意图检查 `result` 是否等于 `4`。然而，由于使用了赋值运算符而不是正确的比较运算符，你将得到图\
  \ 5-2 中显示的编译错误。\n\n![image](img/f151-01.jpg)\n\n**图 5-2**\n\n起初，错误信息可能可能奇怪。但如果你仔细观察代码，它就会变得更有意义。首先，`result`\
  \ 被赋予了值 `4`。然后这个值被用于 `if` 语句。然而，`if` 语句需要一个布尔值来决定是否运行 `if` 块内部的代码。因为你不能这样将整数值转换为布尔值，所以得到了编译错误。不过解决方法很简单；只需使用正确的比较运算符即可：\n\
  \n```cs\nif (result == 4)\n{\n  // Do something here with result\n}\n```\n\n与简单的比较运算符类似，你可以使用其他运算符来比较值：\n\
  \nVB.NET\n\n```vb\n4 > 5         ' 4 不大于 5；结果为 False\n4 <> 5        ' 4 不等于 5；结果为\
  \ True\n5 >= 4        ' 5 大于或等于 4；结果为 True\n```\n\nC#\n\n```cs\n4 > 5         //\
  \ 4 不大于 5；结果为 false\n4 != 5        // 4 不等于 5；结果为 true\n5 >= 4        // 5 大于或等于\
  \ 4；结果为 true\n```\n\nVB.NET 中的 `Is` 关键字和 C# 中的 `is` 功能完全不同。在 VB.NET 中，`Is` 比较两个对象实例，你将在本章的后半部分学习更多。在\
  \ C# 中，你使用 `is` 来确定某个变量是否与特定类型兼容。你可以在 VB.NET 中使用 `TypeOf` 运算符来实现。以下两个示例在功能上是等价的：\n\
  \nVB.NET\n\n```vb\nDim myTextBox As TextBox = New TextBox()\n\nIf TypeOf myTextBox\
  \ Is TextBox Then\n  ' 当 myTextBox 是 TextBox 时运行某些代码\nEnd If\n```\n\nC#\n\n```cs\n\
  TextBox myTextBox = new TextBox();\n\nif (myTextBox is TextBox)\n{\n  // 当 myTextBox\
  \ 是 TextBox 时运行某些代码\n}\n```\n\n算术运算符之一允许你将两个值相加。也就是说，你使用加号 (`+`) 符号将两个值相加。但如果你想合并两个值而不是相加它们呢？那就是使用连接运算符的地方。\n\
  \n## 连接运算符\n\n要连接两个字符串，你在 C# 中使用 `+`，在 VB.NET 中使用 `&` 字符。此外，你可以使用 `+=` 和 `&=` 来结合连接和赋值运算符。考虑此示例：\n\
  \n\n\n\n\n```\nint num1 = 3;\nint num2 = 7;\n\nif (num1 == 3 & num2 == 7)      \
  \   // 结果为 true，因为两个\n                                   // 均为 true\n\nif (num1\
  \ == 2 & num2 == 7)         // 结果为 false，因为 num1 不是 2\n\nif (num1 == 3 | num2 ==\
  \ 11)        // 结果为 true，因为 num1 是 3\n\nif (!(num1 == 5))                  // 结果为\
  \ true，因为 num1 不是 5\n```\n\nVB.NET 中的 `AndAlso` 和 `OrElse` 运算符以及 C# 中的 `&&` 和 `||`\
  \ 运算符与其 C# 中对应的 `And` 和 `Or`（`&` 和 `|`）工作非常相似。区别在于，使用这些运算符时，当第一个表达式已经确定了整个表达式的结果时，第二个表达式永远不会执行。因此，使用简单的\
  \ `And` 运算符时：\n\n```\nIf num1 = 2 And num2 = 7 Then\n```\n\n两个表达式都会被检查。这意味着会询问 `num1`\
  \ 和 `num2` 的值，以查看它们是否等于 `2` 和 `7`。然而，由于 `num1` 不等于 `2`，实际上没有必要再询问 `num2` 的值了，因为该表达式的结果不会改变组合表达式的最终结果。这就是\
  \ `AndAlso`（C# 中为 `&&`）运算符允许你进行逻辑短路：\n\nVB.NET\n\n```\nIf num1 = 2 AndAlso num2\
  \ = 7 Then\n```\n\nC#\n\n```cs\nif (num1 == 2 && num2 == 7)\n```\n\n通过这段代码，表达式 `num2\
  \ = 7`（C# 中 `num2 == 7`）永远不会被评估，因为 `num1` 已经不满足所需标准。\n\n对于这些简单的表达式，这看起来可能并不重要，但如果其中一个表达式实际上是一个缓慢且耗时的操作，它可以成为真正的性能加速器。考虑这段虚构的代码：\n\
  \nVB.NET\n\n```\nIf userName = \"Administrator\" And GetNumberOfRecordsFromDatabase()\
  \ > 0 Then\n```\n\nC#\n\n```cs\nif (userName == \"Administrator\" & GetNumberOfRecordsFromDatabase()\
  \ > 0)\n```\n\n该 `If` 块的代码只在当前用户为 Administrator 且虚构的数据库调用返回至少一条记录时执行。现在，假设 `GetNumberOfRecordsFromDatabase()`\
  \ 是一个耗时操作。如果当前用户不是 Administrator，那么执行它将浪费时间。`AndAlso`（C# 中为 `&&`）可以解决这个问题：\n\nVB.NET\n\
  \n```\nIf userName = \"Administrator\" AndAlso GetNumberOfRecordsFromDatabase()\
  \ > 0 Then\n```\n\nC#\n\n```cs\nif (userName == \"Administrator\" && GetNumberOfRecordsFromDatabase()\
  \ > 0)\n```\n\n现在，`GetNumberOfRecordsFromDatabase()` 只在当前用户为 Administrator 时才会执行。对于所有其他用户，代码都将被忽略，从而提高了他们的性能。\n\
  \n之前的大多数示例都使用了 `If` 语句来演示逻辑运算符。`If` 语句本身也是非常重要的语言结构。接下来将讨论 `If` 语句以及在代码中做出决策的其他方法。\n\
  \n### 做出决策\n\n在应用程序中做出决策是开发者最常见的操作之一。例如，当用户不是管理员时，你需要在 Web 表单上隐藏一个按钮。或者，你需要在表格中显示浅灰色背景的偶数行和白色背景的奇数行。你可以使用几种不同的逻辑结构做出这些决策，这些将在后续章节中解释。\n\
  \n#### If、If Else 和 ElseIf 结构\n\n`If` 语句（C# 中为 `if`）是所有决策语句中最简单的。`If` 语句包含两个相关部分：正在测试的条件以及当条件评估为\
  \ `True`（C# 中为 `true`）时执行的代码。例如，为了让按钮仅对管理员可见，你可以使用如下代码：\n\nVB.NET\n\n```\nIf User.IsInRole(\"\
  Administrators\") = True Then\n  DeleteButton.Visible = True\nEnd If\n```\n\nC#\n\
  \n```cs\nif (User.IsInRole(\"Administrators\") == true)\n{\n  DeleteButton.Visible\
  \ = true;\n}\n```\n\n注意，VB.NET 使用 `If` 和 `End If` 关键字，而 C# 使用 `if` 配合一对括号来指示正在执行的代码块。此外，在\
  \ C# 中，测试条件周围的括号是必须的，而 VB.NET 要求在条件后使用 `Then` 关键字。\n\n这段代码显式地检查了 `True` / `true`\
  \ 值。然而，这并不是必须的，省略它非常常见。以下示例是等效的：\n\nVB.NET\n\n```\nIf User.IsInRole(\"Administrators\"\
  ) Then\n  DeleteButton.Visible = True\nEnd If\n```\n\nC#\n\n```cs\nif (User.IsInRole(\"\
  Administrators\"))\n{\n  DeleteButton.Visible = true;\n}\n```\n\n我将在本章剩余的示例中使用这个简洁的版本。\n\
  \n通常你希望在条件不为 `True` 时执行不同的操作。使用取反运算符 `Not` 或 `!`，你可以简单地写另一个语句：\n\nVB.NET\n\n```\n\
  If User.IsInRole(\"Administrators\") Then\n  DeleteButton.Visible = True\nEnd If\n\
  If Not User.IsInRole(\"Administrators\") Then\n```\n\nC#\n\n```cs\nif (User.IsInRole(\"\
  Administrators\"))\n{\n  DeleteButton.Visible = true;\n}\nif (!User.IsInRole(\"\
  Administrators\"))\n```\n\n显然，这会导致代码变得混乱，因为你需要重复两次表达式：一次针对 `True` 情况，一次针对 `False`\
  \ 情况。幸运的是，有一个更容易的解决方案——`Else` 块（C# 中为 `else`）：\n\nVB.NET\n\n```\nIf User.IsInRole(\"\
  Administrators\") Then\n  DeleteButton.Visible = True\nElse\n```\n\nC#\n\n```cs\n\
  if (User.IsInRole(\"Administrators\"))\n{\n  DeleteButton.Visible = true;\n}\nelse\n\
  {\n  DeleteButton.Visible = false;\n}\n```\n\n对于简单条件，这种方法运行良好。但当你有多个表达式需要测试时，可能会产生复杂的代码。在这种情况下，你可以在\
  \ VB.NET 中使用 `ElseIf` 或在 C# 中使用 `else if` 链。\n\n假设你的网站有三种角色：管理员、内容经理和标准成员。管理员可以创建和删除内容；内容经理只能创建新内容。为了显示或隐藏相关的按钮，可以使用以下代码：\n\
  \nVB.NET\n\n```\nIf User.IsInRole(\"Administrators\") Then\n  CreateNewButton.Visible\
  \ = True\n  DeleteButton.Visible = True\nElseIf User.IsInRole(\"ContentManagers\"\
  ) Then\n  CreateNewButton.Visible = True\n  DeleteButton.Visible = False\nElseIf\
  \ User.IsInRole(\"Members\") Then\n  CreateNewButton.Visible = False\n  DeleteButton.Visible\
  \ = False\nEnd If\n```\n\nC#\n\n```cs\nif (User.IsInRole(\"Administrators\"))\n\
  {\n  CreateNewButton.Visible = true;\n  DeleteButton.Visible = true;\n}\nelse if\
  \ (User.IsInRole(\"ContentManagers\"))\n{\n  CreateNewButton.Visible = true;\n \
  \ DeleteButton.Visible = false;\n}\nelse if (User.IsInRole(\"Members\"))\n{\n  CreateNewButton.Visible\
  \ = false;\n  DeleteButton.Visible = false;\n}\n```\n\n虽然这让代码稍微可读了一些，但当有许多表达式需要测试时，仍然可能会导致难以维护。在这种情况下，可以使用\
  \ `Select Case` (VB.NET) 或 `switch` (C#) 语句。\n\n#### Select Case/switch 结构\n\n假设你正在为一个在周六演出的音乐厅建立网站。在周期间，游客可以在线购买周六演出的票。为了鼓励游客尽早购票，你决定提供早鸟折扣。越早买票，价格越便宜。计算折扣百分比的代码可以如下，使用\
  \ `Select Case`/`switch` 语句：\n\nVB.NET\n\n```\nDim today As DateTime = DateTime.Now\n\
  Dim discountPercentage As Double = 0\n\nSelect Case today.DayOfWeek\n  Case DayOfWeek.Monday\n\
  \    discountPercentage = 40\n  Case DayOfWeek.Tuesday\n    discountPercentage =\
  \ 30\n  Case DayOfWeek.Wednesday\n    discountPercentage = 20\n  Case DayOfWeek.Thursday\n\
  \    discountPercentage = 10\n  Case Else\n    discountPercentage = 0\nEnd Select\n\
  ```\n\nC#\n\n```cs\nDateTime today = DateTime.Now;\ndouble discountPercentage =\
  \ 0;\n\nswitch (today.DayOfWeek)\n{\n    case DayOfWeek.Monday:\n        discountPercentage\
  \ = 40;\n        break;\n    case DayOfWeek.Tuesday:\n        discountPercentage\
  \ = 30;\n        break;\n    case DayOfWeek.Wednesday:\n        discountPercentage\
  \ = 20;\n        break;\n    case DayOfWeek.Thursday:\n        discountPercentage\
  \ = 10;\n        break;\n    default:\n        discountPercentage = 0;\n       \
  \ break;\n}\n```\n\n\n\n\n\n```\nDateTime today = DateTime.Now;\ndouble discountPercentage\
  \ = 0;\n\nswitch (today.DayOfWeek)\n{\n  case DayOfWeek.Monday:\n    discountPercentage\
  \ = 40;\n    break;\n  case DayOfWeek.Tuesday:\n    discountPercentage = 30;\n \
  \   break;\n  case DayOfWeek.Wednesday:\n    discountPercentage = 20;\n    break;\n\
  \  case DayOfWeek.Thursday:\n    discountPercentage = 10;\n    break;\n  default:\n\
  \    discountPercentage = 0;\n    break;\n}\n```\n\n对于每个适用折扣的日子（周一至周四），都有一个 `Case`\
  \ 块。VB.NET 和 C# 语法之间的区别非常微小：C# 使用小写的 `c` 作为 `case`，并且在每个 case 标签后需要一个冒号。此外，你需要使用\
  \ `break` 语句退出每个块。在运行时，条件（`today.DayOfWeek`）会被求值，并执行正确的块。重要的是，只有相关的块会被执行，而不会执行任何其他内容。当没有找到有效的块时（代码在周五到周日之间执行），`Case\
  \ Else` 或 `default` 块中的代码将触发。你并不需要编写 `Case Else` 或 `default` 块，尽管建议这样做，因为这会让你的代码更加明确且易于阅读。之前的示例可以省略它，因为\
  \ `discountPercentage` 在代码块的顶部已经获得了默认值 `0`。\n\n为了对目前所看到的语句有一个感觉，下面的“尝试一试”练习将向你展示如何在小型演示应用程序中使用它们。\n\
  \n`Select Case`/`switch` 语句结束了关于在代码中做出决策的讨论。还剩下一组语句：循环，它允许你对代码或集合中的对象进行循环。\n\n###\
  \ 循环\n\n循环在许多应用程序中都非常有用，因为它们允许你重复执行代码，而无需编写多次代码。例如，如果你有一个网站需要通过电子邮件向其 20,000 名订阅者发送新闻邮件，你只需要编写一次发送新闻邮件的代码，然后使用循环将新闻邮件发送给数据库中找到的每个订阅者。\n\
  \n循环有几种不同的类型，每种类型都有自己的用法和优势。\n\n#### For 循环\n\n`For` 循环简单地按照预定义的次数重复其代码。当设置设置循环时定义了精确的迭代次数。`For`\
  \ 循环采用以下格式：\n\nVB.NET\n\n```\nFor counter [ As datatype ] = start To end [ Step\
  \ stepSize ]\n  ' 每次迭代都必须执行的代码\nNext [ counter ]\n```\n\nC#\n\n```sharp\nfor (startCondition;\
  \ endCondition; step definition)\n{\n  // 每次迭代都必须执行的代码\n}\n```\n\n这看起来有点奇怪，但一个具体的示例会让它变得更容易理解：\n\
  \nVB.NET\n\n```\nFor loopCount As Integer = 1 To 10\n  Label1.Text &= loopCount.ToString()\
  \ & \"<br />\"\nNext\n```\n\nC#\n\n```sharp\nfor (int loopCount = 1; loopCount <=\
  \ 10; loopCount++)\n{\n  Label1.Text += loopCount.ToString() + \"<br />\";\n}\n\
  ```\n\n尽管两种语言使用的语法非常不同，但这两个代码示例执行了相同的操作：它们在 `Label` 控件上输出从 1 到 10 的数字，并在后面跟一个换行符。也就是说，循环通过将\
  \ `1` 赋值给变量 `loopCount` 来启动。接着，该值转换为 `String` 并赋值给 `Label` 控件。然后 `loopCount` 增加\
  \ 1，循环继续。这一直持续到 `loopCount` 为 `10`，然后循环结束。在这个示例中，使用了硬编码的数字。然而，你可以用来自变量或其他对象的动态值替换起始和结束条件。例如，如果你正在处理之前见过的\
  \ `roles` 数组，你可以像这样输出数组中的每个角色：\n\nVB.NET\n\n```\nFor loopCount As Integer = 0 To\
  \ roles.Length - 1\n  Label1.Text &= roles(loopCount).ToString() & \"<br />\"\n\
  Next\n```\n\nC#\n\n```sharp\nfor (int loopCount = 0; loopCount < roles.Length; loopCount++)\n\
  {\n  Label1.Text += roles[loopCount].ToString() + \"<br />\";\n}\n```\n\n#### For\
  \ Each 循环\n\n`For Each`/`foreach` 语句遍历集合中的所有项。\n\nVB.NET\n\n```\nFor Each role As\
  \ String In roles\n  Label1.Text &= role & \"<br />\"\nNext\n```\n\nC#\n\n```sharp\n\
  foreach (string role in roles)\n{\n  Label1.Text += role + \"<br />\";\n}\n```\n\
  \n#### While 循环\n\n正如其名，`While` 循环能够在条件为真时进行循环。与其他两个通常会自动结束的循环不同，如果你不小心，`While`\
  \ 循环可能会无限循环下去。如果其条件永远不会满足，它可能完全不执行。下面的示例展示了如何使用 `While` 循环：\n\nVB.NET\n\n```\nDim\
  \ success As Boolean = False\nWhile Not success\n  success = SendEmailMessage()\n\
  End While\n```\n\nC#\n\n```sharp\nbool success = false;\nwhile (!success)\n{\n \
  \ success = SendEmailMessage();\n}\n```\n\n这段代码使用虚构的 `SendEmailMessage` 方法尝试发送电子邮件消息，并一直尝试直到成功为止——也就是说，只要变量\
  \ `success` 的值为 `False`（C# 中为 `false`）。注意 `Not` 和 `!` 用于反转 `success` 的值。`SendEmailMessage`\
  \ 方法本应该在成功时返回 `True`，在未成功时返回 `False`。如果一切按计划进行，代码进入循环并调用 `SendEmailMessage`。如果它返回\
  \ `True`，循环条件不再满足，循环结束。然而，当 `SendEmailMessage` 返回 `False` 时（例如因为邮件服务器宕机），循环继续并再次调用\
  \ `SendEmailMessage`。\n\n为了避免 `While` 循环出现死循环，添加一个在尝试一定次数后终止循环的条件通常是一个好主意。例如，下面的代码在邮件服务器宕机时有助于避免无限循环：\n\
  \nVB.NET\n\n```\nDim success As Boolean = False\nDim loopCount As Integer = 0\n\
  While Not success AndAlso loopCount < 3\n  success = SendEmailMessage()\n  loopCount\
  \ = loopCount + 1\nEnd While\n```\n\nC#\n```sharp\nbool success = false;\nint loopCount\
  \ = 0;\nwhile (!success && loopCount < 3)\n{\n  success = SendEmailMessage();\n\
  \  loopCount++;\n}\n```\n\n\n\n\n\n```\nbool success = false;\nint loopCount = 0;\n\
  while (!success && loopCount < 3)\n{\n  success = SendEmailMessage();\n  loopCount\
  \ = loopCount + 1;\n}\n```\n\n通过这段代码，变量 `loopCount` 负责在尝试调用 `SendEmailMessage()`\
  \ 三次后退出循环。你不仅可以使用 `loopCount = loopCount + 1`，还可以使用组合拼接和赋值运算符，如下所示：\n\nVB.NET\n\n\
  ```vb\nloopCount += 1\n```\n\nC#\n\n```csharp\nloopCount += 1;\n\n// 或者，C# 允许你这样做：\n\
  loopCount++;\n```\n\n所有示例的结果都相同：`loopCount` 的值增加 1，然后将新的总和再次赋值给 `loopCount`。\n\n\
  除了 `While` 循环外，你还有其他几种替代方案，例如 `Do While` 循环（C# 中的 `do while`），它确保要执行的代码至少被执行一次；以及\
  \ `Do Until` 循环（C# 中不可用），它会一直运行*直到*某个条件为真，而不是像 `While` 循环那样在某个条件为真*期间*进行循环。\n\n\
  ### 提前退出循环\n\n在循环完全完成之前退出它是一个常见需求。你可以在 VB.NET 中使用 `Exit For` 或在 C# 中使用 `break` 来实现，如下：\n\
  \nVB.NET\n\n```vb\nFor loopCount As Integer = 1 To 10\n  If loopCount = 5 Then\n\
  \    Exit For\n  End If\n  Label1.Text &= loopCount.ToString() & \"<br />\"\nNext\n\
  ```\n\nC#\n\n```csharp\nfor (int loopCount = 1; loopCount <= 10; loopCount++)\n\
  {\n  if (loopCount == 5)\n  {\n    break;\n  }\n  Label1.Text += loopCount.ToString()\
  \ + \"<br />\";\n}\n```\n\n通过这段代码，标签将只数字 1 到 4，因为一旦 `loopCount` 达到值 5，循环就会退出。注意：这个示例在现实世界中并没有很多用，因为你可以直接重写代码只循环四次，但它很好地展示了这一概念。\n\
  \n你可以可以使用 VB 中的 `Continue For` 和 C# 中的 `continue` 来停止处理当前迭代并进入下一个迭代（如果存在）。\n\n到为止，你看到的代码由简短简单的示例组成，这些示例可以直接放在网页的后台代码（Code\
  \ Behind）中；例如，在你之前过的 `Page_Load` 或 `Button` 的 `Click` 处理器中。然而，在现实世界的网站中，你可能想对代码进行更多的结构化和组织。在下一节中，你将看到实现此点的不同方法。\n\
  \n## 组织代码\n\n当你开始为网站添加不仅仅是几个页面时，你几乎确定会产生一些可以在多个页面中重用的代码。例如，你可能有一些需要从 `Web.config`\
  \ 文件读取设置的代码，而这些代码在多个文件中都需要。或者你想从不同的页面发送带有用户信息的电子邮件。因此，你需要找到一种集中管理代码的方法。为了在 ASP.NET\
  \ 网站中实现这一点，你可以使用函数和子程序，接下来将讨论这些内容。为了让这些函数和子程序对站点中的所有页面可用，你需要在特殊位置创建它们，稍后会讨论。\n\n\
  ### 方法：函数和子程序\n\n*函数*（Functions）和*子程序*（subroutines 或 *subs*）非常相似；它们都允许你创建一个可重用的代码块，你可以在应用程序的其他位置调用它。函数和子程序的区别在于，函数可以返回数据，而子程序不能。函数和子程序统称为*方法*（methods）。你将在本章最后处理对象导向的部分再次看到这个术语。\n\
  \n为了让函数和子程序更有用，可以对它们进行*参数化*（parameterized）。也就是说，你可以传入额外信息，这些信息可以在函数或子程序内部使用。函数和子程序通常采用以下格式：\n\
  \nVB.NET\n\n```vb\n' 定义函数\nPublic Function FunctionName ([parameterList]) As DataType\n\
  \nEnd Function\n\n' 定义一个子程序\nPublic Sub SubName ([parameterList])\n\nEnd Sub\n```\n\
  \nC#\n\n```csharp\n// 定义一个函数\npublic DataType FunctionName([parameterList])\n{\n\
  \n}\n\n// 定义一个子程序\npublic void SubName([parameterList])\n{\n\n}\n```\n\n以 `Public`\
  \ 开头的完整第一行被称为*方法签名*（method signature），因为它定义了函数的结构，包括它的名称和参数。`Public` 关键字（C# 中的 `public`）称为*访问修饰符*（access\
  \ modifier），定义了其他网页或代码文件在多大程度上可以看到此方法。这将在章的后面详细讨论。现在，你应该意识到 `Public` 具有最大的可见性，因此方法对任何调用代码都是可见的。\n\
  \n函数名后面跟着括号，括号内可以包含可选的参数列表。这些代码示例中的斜体部分将被你代码中的真实值替换。方括号（`[]`）之间的部分是可选的。为了让它更具体，这里是函数和子程序的示例：\n\
  \nVB.NET\n\n```vb\nPublic Function Add(a As Integer, b As Integer) As Integer\n\
  \  Return a + b\nEnd Function\n\nPublic Sub SendEmailMessage(emailAddress As String)\n\
  \  ' 发送电子邮件的代码\nEnd Sub\n```\n\nC#\n\n```csharp\npublic int Add(int a, int b)\n\
  {\n  return a + b;\n}\n\npublic void SendEmailMessage(string emailAddress)\n{\n\
  \  // 发送电子邮件的代码\n}\n```\n\n在这些代码示例中，显然函数返回返回值而子程序没有。`Add` 方法返回两个参数，`SendEmailMessage`\
  \ 方法有一个参数：一个持有用户电子邮件地址的 `String`。\n\n\n\n\n在使用类似这样的引用参数时要小心；在不知不觉中，该方法可能会更改调用代码中的重要变量。这可能导致难以追踪的错误。\n\
  \n为了让你的网站范围方法能够被网站中的各个页面访问，你应该将它们放在一个集中位置。网站的 `App_Code` 文件夹是存放代码的理想位置。\n\n### App_Code\
  \ 文件夹\n\n`App_Code` 文件夹是一个特殊的 ASP.NET 文件夹。它专门设计用于存放代码文件，例如你在整个站点中使用的类。正如你目前所看到的，仅适用于单个页面的代码（例如\
  \ `Button` 控件的 `Click` 事件处理程序）应该留在页面的后台代码（Code Behind）中。\n\n要向你的网站添加 `App_Code`\
  \ 文件夹，在解决方案管理器中右键点击网站名称，选择`Add（添加）` ⇒ Add ASP.NET Folder（添加 ASP.NET 文件夹）` ⇒ App_Code`。图\
  \ 5-4 显示了新文件夹。\n\n![image](img/f170-01.jpg)\n\n**图 5-4**\n\n放置 `App_Code` 文件夹后，你就可以向其中添加类文件。类文件的扩展名与你为站点选择的编程语言：C#\
  \ 文件为 `.cs`，包含 VB.NET 代码的文件为 `.vb`。在这些类文件中，你可以创建类，类中又包含方法（函数和子程序），这些方法可以执行常见任务。本章的最后部分将更详细讨论类；现在，请关注代码文件中的方法以及如何调用它们，而不是关注为什么需要先将代码添加到类中。\n\
  \n下一个练习将向你展示如何使用 `App_Code` 文件夹来优化你之前在“尝试一试”（Try It Out）中创建的计算器。\n\n函数和子程序是组织 Web\
  \ 应用程序的一种方法。它们允许你创建可重用的代码块，并从其他地方轻松地调用它们。因为你多次使用的代码只需定义一次，因此维护或扩展代码要容易得多。如果你在函数中发现错误，只需在\
  \ `App_Code` 文件夹中修复它的定义，所有使用该函数的页面都会自动从更改中受益。除了增加了可维护性外，函数和子程序还让你的代码更易读：与其在页面中翻阅长代码列表，你只需要调用单个函数并处理返回值（如果有的话）。这让你的大脑更轻松，最大限度地减少了应用程序中出现错误的概率。\n\
  \n函数和子程序并不是 .NET 项目中组织代码唯一的方法。另一种常见的组织方式是使用命名空间（Namespaces）。\n\n### 使用命名空间组织代码\n\
  \n命名空间似乎让新开发者感到困惑。他们认为它们很可怕，认为它们太多了，或者认为没有必要使用它们。这些都不是事实，通过对它们进行简短解释，你将会理解并可能喜欢命名空间。\n\
  \n`Namespaces` 旨在解决两个主要问题：组织 .NET Framework 和你自己的代码中海量的功能，以及避免`name collisions`名称冲突），即两个不同类型共享相同的名称。关于命名空间的一个常见误解是认为它们与\
  \ .NET 程序集（带有 `.dll` 扩展并由 .NET Framework 加载和使用的文件）有直接关系，但事实并非如此。尽管你通常会在名为 `System.Web.dll`\
  \ 的 DLL 中找到像 `System.Web.UI` 这样的命名空间，但完全可能（也是很常见的）在单个 DLL 中定义多个命名空间，或让一个命名空间跨越多个程序集。在稍后解释添加程序集引用时，请记住这一点。\n\
  \n要查看命名空间的内容，请打开你到目前创建的 ASPX 页面的一个后台代码文件。你会看到类似下面的内容：\n\nVB.NET\n```vb\nPartial\
  \ Class Demos_CalculatorDemo\n    Inherits System.Web.UI.Page\n```\n\nC#\n```sharp\n\
  public partial class Demos_CalculatorDemo : System.Web.UI.Page\n{\n```\n\n注意，类名定义后面在\
  \ VB 中是 `Inherits` 关键字，在 C# 中是冒号，随后是 `System.Web.UI.Page`。你稍后会看到这个 `Inherits` 关键字的用途。在代码中，`Page`\
  \ 是一个类的名称（数据类型），它定义在 `System.Web.UI` 命名空间中。通过将 `Page` 类放在 `System.Web.UI` 命名空间，开发者（和编译器）可以看到该类是关于网页的。相比之下，想象以下（虚构的）类名：\n\
  \n```\nMicrosoft.Word.Document.Page\n```\n\n这段代码也引用了一个 `Page` 类。然而，因为它被放在 `Microsoft.Word.Document`\
  \ 命名空间中，很容易看出它指的是 Word 文档的一页，而不是网页。这样，网页和 Word 文档页之间就不会有歧义。这反过来有助于编译器理解你指的是哪个类。\n\
  \n命名空间的另一个益处是它们可以帮助你找到正确的数据类型。你不会在 IntelliSense 列表中看到数成千上万个项目，而是得到几个顶级命名空间。当你从该列表中选择一个项目并按下点键（`.`）时，你会得到另一个较短的列表，其中包含所选命名空间内的类型和其他命名空间。\n\
  \n命名空间只不过是简单的容器，你可以使用点表示法通过名称引用它们。它们被用于为应用程序中提供的每个数据类型添加前缀。例如，`Double` 数据类型位于 `System`\
  \ 命名空间，因此它的全名是 `System.Double`。同样，你添加到 Web 页面上的 `Button` 控件位于 `System.Web.UI.WebControls`\
  \ 命名空间，因此它的全名是 `System.Web.UI.WebControls.Button`。\n\n创建自己的命名空间也很容易。只要它们不与现有名称冲突，你几乎可以根据自己的意愿创建。例如，你可以在以下命名空间中封装\
  \ `Calculator` 类（在 `App_Code` 中的 `Calculator.vb` 或 `Calculator.cs` 中）：\n\nVB.NET\n\
  ```vb\nNamespace Wrox.Samples\n\n  Public Class Calculator\n    ...\n  End Class\n\
  \nEnd Namespace\n```\n\nC#\n```sharp\nnamespace Wrox.Samples\n{\n  public class\
  \ Calculator\n  {\n    ...\n  }\n}\n```\n\n将计算器封装在这个命名空间中，你可以像这样创建一个它的新实例：\n\nVB.NET\n\
  ```vb\nDim myCalculator As New Wrox.Samples.Calculator()\n```\n\nC#\n```sharp\n\
  Wrox.Samples.Calculator myCalculator = new Wrox.Samples.Calculator();\n```\n\n虽然你可以借助\
  \ IntelliSense 的帮助找到 `Calculator` 类，但过段时间后输入这些长名称会变得很无聊。幸运的是，这也有解决方法。\n\n在你创建了自己的命名空间之后，如果你想使用现有的命名空间，你需要在代码中让它们可用。你通过\
  \ `Imports` 关键字（在 VB.NET 中）或 `using`（在 C# 中）来实现这一点。例如，为了在 Calculator 演示页面中使用你的 `Calculator`\
  \ 类而无需指定其全名，你可以向你的代码中添加以下命名空间：\n\nVB.NET\n```vb\nImports Wrox.Samples\n\nPartial\
  \ Class Demos_CalculatorDemo\n  Inherits System.Web.UI.Page\n```\n\nC#\n```sharp\n\
  using Wrox.Samples;\n\npublic partial class Demos_CalculatorDemo : System.Web.UI.Page\n\
  {\n```\n\n有了这个 `Imports/using` 语句，你现在可以简单地再次使用 `Calculator`，而不是 `Wrox.Samples.Calculator`\
  \ 了。\n\n\n\n\n很多时候，你知道某个类的名称，但不知道它所在的命名空间。VS 可以让你非常方便地找到命名空间，并为你添加所需的 `Imports`\
  \ 或 `using` 语句。只需输入你想使用的类名，然后将光标置于类名上并按下 `Ctrl+.`（`Ctrl+Dot`）。你会看到一个菜单出现，可以在其中选择正确的命名空间，如图图\
  \ 5-5 所示。\n\n![image](img/f175-01.jpg)\n\n**图 5-5**\n\n如果对话框没有提供添加 `Imports` 或 `using`\
  \ 语句，则包含你要查找的类的程序集可能未被项目引用。这种情况，请右键点击解决方案管理器（Solution Explorer）中的项目，并选择 `Add Reference`。在随后的对话框中，你可以在\
  \ `.NET` 选项卡上选择许多内置的 .NET 程序集，或者使用 `Browse` 按钮浏览第三方程序集。一旦添加了引用，你就可以再次在类名上按 `Ctrl+.`\
  \ 来为要查找的类添加 `Imports` 或 `using` 语句。\n\n一旦开始编写大量代码，你可能会很快忘记在哪里定义了什么，或者某个变量或方法是做什么的。因此，诚心建议在代码中编写注释。\n\
  \n### 编写注释\n\n无论你是一个多么整洁的程序员，有一天你可能会遇到让你皱眉并思考“这段代码到底是干什么的？”。随着时间的推移，你的编程方式会发生变化；你会学习新知识，优化你的编码标准，并找到更高效的代码方法。为了让你现在和两年后更容易识别和理解自己的代码，给代码注释是一个好主意。在代码文件中添加注释有两种方式：内联注释和\
  \ XML 注释。\n\n#### 代码内联注释\n\n内联注释直接写在代码语句之间。你可以使用它们对现有的变量、复杂的循环等进行注释。在 VB.NET 中，你可以使用单引号（`’`）字符一次注释一行，将该字符放置在你想要作为注释的文本前面。在\
  \ C# 中，注释单行代码需要使用双斜杠（`//`）。此外，你还可以使用 `/*` 和 `*/` 在 C# 中注释掉整个代码块。以下示例展示了注释的一些不同用法：\n\
  \nVB.NET\n\n```\n' 用：解释变量、语句等的目的。\n' 用于存储用户去年旅行的英里数。\nDim distanceInMiles As Integer\n\
  \n' 用：注释掉不再使用的（代码）。\n' 在此示例中，SomeUnfinishedMethod 被注释掉了\n' 以防止其执行。\n' SomeUnfinishedMethod()\n\
  \n' 用：行尾注释。\nIf User.IsInRole(\"Administrators\") Then  ' 仅允许管理员在此区域访问\nEnd If\n\
  ```\n\nC#\n\n``````\n// 用：解释变量、语句等的目的。\n// 用于存储用户去年旅行的英里数。\nint distanceInMiles;\n\
  \n// 用：注释掉不再使用的（代码）。\n// 在此示例中，SomeUnfinishedMethod 被注释掉了\n// 以防止其执行。\n// SomeUnfinishedMethod();\n\
  \n// 用：行尾注释。\nif (User.IsInRole(\"Administrators\")) // 仅允许管理员在此区域访问\n{ }\n\n/*\n\
  \ * 这是一个分块注释，通常用于为代码添加额外的\n * 信息，例如解释一个复杂的循环。你也可以\n * 用它来（临时）注释掉整个代码块。\n*/\n```\n\
  \n要注释掉代码，只需在想开始注释的地方输入注释字符（`’` 或 `//`）。要注释掉一个代码块，在文本编辑器中选择它，然后按 `Ctrl+K` 后按 `Ctrl+C`。同样，按\
  \ `Ctrl+K` 后按 `Ctrl+U` 可以取消所选代码块的注释。\n\n或者，你可以从主菜单选择 `Edit ⇒ Advanced ⇒ Comment\
  \ Selection`（编辑 ⇒ 高级 ⇒ 注释选择）或 `Uncomment Selection`（取消注释）。\n\n内联注释通常适用于代码的小细节。然而，提供代码功能的高层次概述也是一个好主意。例如，对于名为\
  \ `SendEmailMessage` 的方法，有一个简短的描述来解释该方法的功能以及参数的用途会很好。这正是 XML 注释的用途。\n\n#### 编写 XML\
  \ 注释\n\nXML 注释是你作为 XML 元素（使用尖角括号：`< >`）添加到代码中的注释，用于描述其目的、参数、返回值等。VS IDE 会帮助你编写这些注释。你只需要将光标置于类或方法之前的前的一行，然后为\
  \ VB 输入 `'''`（三个单引号）或为 C# 输入 `///`（三个正斜杠）。你一这样做，IDE 就会插入摘要（summary）的 XML 标签，以及可选的方法参数和返回类型。再次考虑\
  \ `SendEmailMessage` 方法。它可能有两个 `String` 类型的参数：一个用于发送消息的电子邮件地址，另一个用于邮件正文。应用 XML 注释后，该方法看起来像这样：\n\
  \nVB.NET\n\n```\n''' <summary>\n''' 向指定的地址发送电子邮件。\n''' </summary>\n''' <param name=\"\
  emailAddress\">收件者的电子邮件地址。</param>\n''' <param name=\"mailBody\">邮件正文。</param>\n\
  ''' <returns>如果消息发送成功则返回 True；\n'''否则返回 False。</returns>\n''' <remarks>此方法假设邮件服务器是\n\
  ''' 可用的。</remarks>\nPublic Function SendEmailMessage(emailAddress As String, mailBody\
  \ As String) As Boolean\n  ' 实现\nEnd Function\n```\n\nC#\n\n```\n/// <summary>\n\
  /// 向指定的地址发送电子邮件。\n/// </summary>\n/// <param name=\"emailAddress\">收件者的电子邮件地址。</param>\n\
  /// <param name=\"mailBody\">邮件正文。</param>\n/// <returns>如果消息发送成功则返回 true；\n///否则返回\
  \ false。</returns>\n/// <remarks>此方法假设邮件服务器是\n/// 可用的。</remarks>\npublic bool SendEmailMessage(string\
  \ emailAddress, string mailBody)\n{\n  // 实现\n}\n```\n\n这种类型注释的酷之处在于，当你尝试调用该方法时，你在这里编写的注释会在编辑器的\
  \ IntelliSense 中显示（见图 5-6）。\n\n![image](img/f178-01.jpg)\n\n**图 5-6**\n\n除了辅助开发之外，你还可以使用\
  \ XML 注释创建美观的类似 MSDN 的文档。有许多第三方工具可以帮助实现这一点，包括微软自己的 Sandcastle ([`msdn.microsoft.com/en-us/vstudio/bb608422.aspx`](http://msdn.microsoft.com/en-us/vstudio/bb608422.aspx))\
  \ 和来自 Innovasys 的 Document! X ([www.innovasys.com/](http://www.innovasys.com/))。\n\
  \n## 面向对象基础\n\n在 ASP.NET 中编写代码的章节如果没有关于*面向对象*（*OO*）的部分将是不完整的。面向对象，或面向对象编程是一种非常流行的编程风格，软件被建模为一组相互作用的对象。面向对象是\
  \ .NET 框架的核心。该框架内的几乎所有内容都是对象，从简单的整数到复杂的 `DropDownList` 控件、数据库连接或数据驱动控件。\n\n\n\n\n\
  \n由于面向对象是 .NET 的一个非常重要的方面，因此熟悉面向对象编程（OO）的一般概念至关重要。同时，你不需要成为 OO 专家也能使用 ASP.NET 构建网站。本节将为你提供最重要的术语和概念的宏观概述。这有助于你开始接触面向对象编程，以便你可以在下一章开始构建实用的应用程序，而不是在接三周里一直埋头苦读。\n\
  \n# 重要的 OO 术语\n\n在面向对象中，一切都围绕着“对象”的概念展开。在 OO 中，实际上一切*都是*一个对象。但对象到底是什么？类与对象之间有什么关系呢？\n\
  \n## 对象 (Objects)\n\n`Objects` 是面向对象编程语言的构建构建块。就像现实世界一样，OO 世界中的对象是一个实体，但存储在计算机内存中。它可以是一个存储某人年龄的整数，也可以是一个到世界另一端\
  \ SQL Server 的打开数据库连接，但它也可以是具概念性的东西，比如网页。在你的应用程序中，你使用 `New`（C# 中为 `new`）关键字来创建一个新对象，正如你在计算器示例中看到的那样。这种创建新对象的过程被称为*实例化*（instantiating），你创建的对象被称为实例（instances）。你可以实例化像\
  \ `Calculator` 这样的复杂或自定义类型，也可以像 `Integers` 和 `Strings` 这样的简单类型：\n\nVB.NET\n```\n\
  Dim myCalculator As Calculator = New Calculator()\n\nDim age As Integer = New Integer()\n\
  ```\n\nC#\n```cs\nCalculator myCalculator = new Calculator();\n\nint age = new int();\n\
  ```\n\n由于创建 `Integer`（C# 中为 `int`）和 `String`（C# 中为 `string`）等简单类型的变量非常常见，编译器允许你省略\
  \ `new` 关键字和赋值。因此，以下代码在功能上与之前的 `age` 相同：\n\nVB.NET\n```\nDim age As Integer\n```\n\
  \nC#\n```cs\nint age;\n```\n\n本章开头列出的所有数据类型，Object 都可以，都可以不使用 `New` 关键字创建。\n\n一旦你创建了对象的实例（例如\
  \ `myCalculator` 对象），它就可以使用了。例如，你可以访问它的方法和属性来对对象进行一些有用的操作。但在查看方法和属性之前，你需要理解类。\n\n\
  ## 类 (Classes)\n\n类是对象的蓝图。就像你可以用一张蓝图来建造一系列类似的房屋一样，你可以使用一个类来创建该类的多个实例。因此，类充当你在应用程序中使用的对象的定义。在最基本的形式下，类如下：\n\
  \nVB.NET\n```\nPublic Class ClassName\n\nEnd Class\n```\n\nC#\n```cs\npublic class\
  \ ClassName\n{\n}\n```\n\n由于这段代码只是定义了一个空类，它无法执行任何有用的操作。为了给类赋予一些行为，你可以给它*字段、属性、方法*和*构造函数*。此外，你可以让类继承现有的类，以便在功能和行为方面获得领先。你将在接下来的几节中这些术语。\n\
  \n## 字段 (Fields)\n\n字段是在类级别声明的简单变量，可以包含数据。它们通常用作属性的备份变量（你将在下一节中看到），但不必如此。这里有一个 `Person`\
  \ 类中字段的快速示例：\n\nVB.NET\n```\nPublic Class Person\n  Private _firstName As String\n\
  End Class\n```\n\nC#\n```cs\npublic class Person\n{\n  private string _firstName;\n\
  }\n```\n\n字段通常被标记为 `Private`（C# 中为 `private`），这使得它们仅对定义它们的类可见。如果你需要将字段暴露给其他类，你应该使用下一个讨论的属性。在本章稍后的部分，你将学习更多关于\
  \ `Private` 关键字和其他访问修饰符。\n\n## 属性 (Properties)\n\n对象的属性是对象所拥有的特征。考虑一个 `Person` 对象。`Person`\
  \ 有什么种属性？很容易想到许多不同的特征，但最常见的有：\n\n* 名\n* 姓\n* 出生日期\n\n你在类中使用 `Property` 关键字（VB.NET\
  \ 中）或在 C# 中使用类似于方法的属性头文件来定义属性。在这两种语言中，你都使用 `Get` 块（C# 中为 `get`）和 `Set` 块（C# 中为 `set`）来定义属性所谓的的读取（getters）和赋值（setters）。当请求某个特定属性的值时，访问读取器，赋值用于给属性赋值。属性只提供对存储在对象底层数据的访问；它们不包含实际数据。为了存储数据，你通常使用所谓的*备份变量*（backing\
  \ variable）。这通常是类中定义的简单字段，能够存储外部属性的值。在下面的示例中，变量 `_firstName` 是 `FirstName` 属性的备份变量：\n\
  \nVB.NET\n```\nPublic Class Person\n  Private _firstName As String\n  Public Property\
  \ FirstName() As String\n    Get\n      Return _firstName\n    End Get\n    Set(value\
  \ As String)\n      _firstName = value\n    End Set\n  End Property\nEnd Class\n\
  ```\n\nC#\n```cs\npublic class Person\n{\n  private string _firstName;\n  public\
  \ string FirstName\n  {\n    get { return _firstName; }\n    set { _firstName =\
  \ value; }\n  }\n}\n```\n\n\n\n\n`If` 块中的代码使用 `String` 类的 `Substring` 方法获取 `value`\
  \ 的第一个字母，向该方法传递了值 `0` 和 `1`。`0` 表示子字符串的起始，`1` 表示必须返回的字符串长度。字符串索引也是从 0 开始，因此起始位置为\
  \ `0` 长度为 `1` 实际上返回了 `value` 参数的第一个字符。然后使用 `ToUpper()` 将该字符更改为大写。最后，代码再次使用 `Substring`\
  \ 获取 `value` 参数的剩余部分，并将组合后的名称赋回底层变量。在在此次 `Substring` 调用中，只传递了起始索引，它返回从该位置到末尾的字符串。\n\
  \n你现在可以使用任意大小写设置名称的代码了。但当你尝试访问名称时，第一个名字将始终以大写的首写字母开头：\n\n### VB.NET\n\n```\nDim\
  \ myPerson As Person = New Person() ' 创建 Person 的新实例\nmyPerson.FirstName = \"imar\"\
  \           ' 访问 setter 以更改值\n\nLabel1.Text = myPerson.FirstName      ' 访问 getter，现在返回\
  \ Imar\n```\n\n### C#\n\n```cs\nPerson myPerson = new Person();      // 创建 Person\
  \ 的新实例\nmyPerson.FirstName = \"imar\";         // 访问 setter 以更改值\n\nLabel1.Text\
  \ = myPerson.FirstName;     // 访问 getter，现在返回 Imar\n```\n\n对于不需要任何数据处理或验证的简单属性，你可以使用所谓的自动属性（automatic\
  \ properties）。通过这些属性，你可以使用更紧凑的语法，而不需要私有的底层变量。当代码被编译时，编译器会为你创建一个隐藏的底层变量，你只需要引用公共属性即可。以下是\
  \ `Person` 类中 `DateOfBirth` 属性的自动属性写法：\n\n### VB.NET\n\n```\nPublic Property DateOfBirth\
  \ As DateTime\n```\n\n### C#\n\n```cs\npublic DateTime DateOfBirth { get; set; }\n\
  ```\n\nVisual Basic 自动属性的实现与 C# 版本相比有一个优势：你可以一次性声明属性并赋予值。以下代码段定义了一个 `CreateDate`\
  \ 属性并用当前日期和时间给其赋值：\n\n### VB.NET\n\n```vb\nPublic Property CreateDate As DateTime\
  \ = DateTime.Now\n```\n\n在 C# 中，要为自动属性分配默认值，你需要使用构造函数设置其值，这将在稍后讨论。\n\n如果你以后决定需要在属性的\
  \ getter 或 setter 中编写代码，可以很容易地扩展相关的代码块，而不会破坏现有的应用程序。在此之前，你拥有漂亮整洁的属性定义，它们不会让你的类变得杂乱。\n\
  \n### 创建只读和只写属性\n\n有时，只读或只写属性非常有意义。例如，如果对象的 ID 是数据库自动分配的，那么它可以是只读的。当从数据库构造对象时，ID\
  \ 被分配给私有底层变量。然后将公共 `Id` 属性设为只读，以防止调用代码意外更改它。只读属性的另一个良好选择是返回组合数据的属性。考虑 `Person` 类中的\
  \ `FullName` 属性，它返回 `FirstName` 和 `LastName` 属性的组合。你使用每个单独属性的 setter 来分配数据，但你可以拥有一个返回拼接值的只读属性。同样，出于安全考虑，你可以拥有一个只写属性。例如，你可以在\
  \ `Person` 对象上有一个 `Password` 属性，只有在你知道它时才能对其赋值，但之后不再读取它。在内部，类中的代码仍然可以访问底层变量来处理密码值。\n\
  \nC# 中的只读或只写属性非常简单：只需省略 setter（对于只读属性）或 getter（对于只写属性）即可。VB.NET 稍微繁琐一些，需要你显式指定 `ReadOnly`\
  \ 或 `WriteOnly` 关键字。以下代码段显示了 VB.NET 和 C# 中只读的 `FullName` 属性：\n\n### VB.NET\n\n```vb\n\
  Public ReadOnly Property FullName() As String\n  Get\n    Return _firstName & \"\
  \ \" & _lastName\n  End Get\nEnd Property\n```\n\n### C#\n\n```cs\npublic string\
  \ FullName\n{\n  get { return _firstName + \" \" + _lastName; }\n}\n```\n\n当你尝试给只读属性赋值时，会在\
  \ VS 中得到一个编译错误。\n\n与属性类似，对象也可以拥有方法。\n\n### 方法\n\n如果属性是类拥有的东西（其特征），那么方法就是类可以做的事情或可以执行的操作。例如，`Car`\
  \ 类具有 `Brand, Model` 和 `Color` 等属性。它的方法可以是 `Drive()`、`Brake()` 和 `OpenDoors()`。方法赋予对象行为，使其能够执行某些操作。\n\
  \n你之前已经看到过方法的应用，当时本章讨论了使用 subs 和 functions 编写组织代码的一些方法。你只需要通过在类的开始和结束元素之间编写函数或 sub\
  \ 来向类添加方法。例如，假设 `Person` 类有一个 `Save` 方法，使对象能够将自己持久化到数据库。该方法的签名可能如下：\n\n### VB.NET\n\
  \n```vb\nPublic Class Person\n  Public Sub Save()\n    ' 实现代码在这里\n  End Sub\nEnd\
  \ Class\n```\n\n### C#\n\n```cs\npublic class Person\n{\n  public void Save()\n\
  \  {\n    // 实现代码在这里\n  }\n}\n```\n\n如果你想调用 `Save` 方法让 `Person` 对象将自己保存到数据库，你需要创建它的实例，设置\
  \ `FirstName` 等属性，然后调用 `Save`：\n\n### VB.NET\n\n```vb\nDim myPerson As Person =\
  \ New Person()\nmyPerson.FirstName = \"Jim\"\nmyPerson.Save()\n```\n\n### C#\n\n\
  ```cs\nPerson myPerson = new Person();\nmyPerson.FirstName = \"Jim\";\nmyPerson.Save();\n\
  ```\n\n`Save` 方法将知道如何将 `Person` 保存到数据库。\n\n方法也可以有参数，正如你之前在 XML 注释部分看到的。。`SendEmailMessage`\
  \ 方法接受两个参数——一个电子邮件地址和一个消息正文——这些值在方法内部是可以访问的。\n\n注意，`Person` 类的实例实例是通过 `New` 关键字（C#\
  \ 中为 `new`）加上类名创建的。\n\n### 构造函数\n\n构造函数是类中的特殊方法，帮助创建对象的实例。它们在你尝试创建实例时就会运行，因此它们是初始化对象默认状态的好地方。之前你学过使用\
  \ `New`（C# 中为 `new`）关键字创建对象的实例：\n\n### VB.NET\n\n```vb\nDim myCalculator As Calculator\
  \ = New Calculator()\n```\n\n### C#\n\n```cs\nCalculator myCalculator = new Calculator();\n\
  ```\n\n`New` 关键字后面跟着对象的构造：类名。默认情况下，当你在 VS 中创建一个类文件时，C# 会获得一个默认构造函数，但 VB.NET 没有。这并不是真正的问题，因为如果没有其他构造函数，编译器会为你生成一个默认构造函数。默认构造函数没有参数，在\
  \ C# 中取类名，在 VB.NET 中取预留关键字 `New`：\n\n### VB.NET\n\n```vb\nPublic Class Person\n\
  \  Public Sub New()\n\n  End Sub\nEnd Class\n```\n\n### C#\n\n```cs\npublic class\
  \ Person\n{\n  public Person()\n  {\n\n  }\n}\n```\n\n\n\n\n虽然这个默认构造函数对于创建类的标准实例很有用，但有时，能够预先向类中发送一些信息是非常有用的，这样这些信息在构造完成后即可立即使用。例如，对于\
  \ `Person` 类，将姓、名和出生日期传递给构造函数可能是很有用的，这样数据在构造完成后后就立即可用。要实现这种场景，你可以创建一个专门的构造函数。为了让构造函数接受姓名和出生日期，你需要以下代码：\n\
  \nVB.NET\n\n```vb\nPublic Sub New(firstName As String, lastName As String, dateOfBirth\
  \ As DateTime)\n  _firstName = firstName\n  _lastName = lastName\n  _dateOfBirth\
  \ = dateOfBirth\nEnd Sub\n```\n\nC#\n\n```csharp\npublic Person(string firstName,\
  \ string lastName, DateTime dateOfBirth)\n{\n  _firstName = firstName;\n  _lastName\
  \ = lastName;\n  _dateOfBirth = dateOfBirth;\n}\n```\n\n通过这段代码，你可以创建一个新的 `Person`\
  \ 对象：\n\nVB.NET\n\n```vb\nDim myPerson As Person = New Person(\"Imar\", \"Spaanjaars\"\
  , New DateTime(1971, 8, 9))\n```\n\nC#\n\n```csharp\nPerson myPerson = new Person(\"\
  Imar\", \"Spaanjaars\", new DateTime(1971, 8, 9));\n```\n\n构造函数接受传递给它的值并将其赋值给私有备份变量，因此在这行代码之后，`myPerson`\
  \ 对象就被完全初始化了。\n\n允许同一个类拥有多个构造函数，只要每个构造函数的方法签名不同即可。\n\nVisual Basic 支持稍微不同的语法，通过使用\
  \ `Dim` `myVariable` `As New` `ClassName` 语法一次性声明并初始化对象。以下代码等同于之前的 `Person` 实例实例化：\n\
  \n```vb\nDim myPerson As New Person(\"Imar\", \"Spaanjaars\", New DateTime(1971,\
  \ 8, 9))\n```\n\n除了构造函数之外.NET 还提供了另一种创建对象并初始化几个属性的快速方法：对象初始化器。使用对象初始化器，你可以在声明对象实例的同时为某些属性提供初始值。以下代码创建了一个\
  \ `Person` 对象，并为 `FirstName` 和 `LastName` 属性分配了值：\n\nVB.NET\n\n```vb\nDim myPerson\
  \ As New Person() With {.FirstName = \"Imar\", .LastName = \"Spaanjaars\"}\n```\n\
  \nC#\n\n```csharp\nPerson myPerson = new Person() { FirstName = \"Imar\", LastName\
  \ = \"Spaanjaars\" };\n```\n\n在 VB.NET 中，你需要在属性列表前使用 `With` 关键字。此外，你需要在每个属性名前加上点（`.`）。除此之外，两种语言的语法是相同的。如果你需要快速设置对象上的大量属性，而又被迫编写构造函数的特殊版本，那么对象初始化器非常好。\n\
  \n虽然在应用程序中使用这个 `Person` 类很有用，但有时你可能需要 `Person` 的特殊版本。例如，你的应用程序可能需要像 `Employee` 和\
  \ `Student` 这样的类。在这种情况下你应该怎么办？创建两个 `Person` 类的副本并分别命名为 `Employee` 和 `Student` 吗？\n\
  \n虽然这种方法确实有效，但有几个巨大的缺点。最大的问题是代码重复。如果你决定添加 `SocialSecurityNumber` 属性，你现在需要在多个位置添加它：在通用的\
  \ `Person` 类中，以及在 `Employee` 和 `Student` 类中。对象继承是面向对象的一大支柱之一，旨在解决这类问题。\n\n## 继承\n\
  \n早些时候了解到 `System.Object` 是 .NET 中所有其他数据类型的父类型，包括所有内置类型和你自己定义的类型，这意味着 .NET 中的每个类型（`Object`\
  \ 本身除外）都继承自 `Object`。继承的好处可以在高层定义一种行为（例如在 `Object` 类中），继承类自动可以使用该行为，而不需要重复代码。在 .NET\
  \ Framework 中，`Object` 类定义了一些其他对象继承的成员，包括 `ToString()` 方法。\n\n要让一个类继承另一个类，你需要在 VB.NET\
  \ 中使用 `Inherits` 关键字，并在 C# 中使用冒号（`:`），如下例所示，定义了一个继承自 `Person` 的 `Student` 类：\n\n\
  VB.NET\n\n```vb\nPublic Class Student\n    Inherits Person\n```\n\nC#\n\n```csharp\n\
  public class Student : Person\n{\n}\n```\n\n要查看继承是如何工作的，请再次考虑示例中显示的 `Person` 类。该类有几个属性，例如\
  \ `FirstName` 和 `LastName` 以及一个 `Save` 方法。但如果它继承自 `Object`，它是否也有一个 `ToString()`\
  \ 方法？你确定它是有的。[图 5-7] 显示了 `Object` 类与继承自 `Object` 的 `Person` 类之间的关系。\n\n![image](img/f187-01.jpg)\n\
  \n**[图 5-7]**\n\n图 5-7 显示 `Person` 继承自 `Object`（由指向被继承类的箭头指示），这反意味着 `Person` 可以做\
  \ `Object` 能做的任何事。因此，你可以对你的 `Person` 实例调用 `ToString()`：\n\n```vb\nLabel1.Text =\
  \ myPerson.ToString()\n```\n\n\n\n\n在图 5-8 中你可以看到 `TemplateControl` 是一个抽象类——一种无法实例化的类；也就是说，你不能使用\
  \ `New`（C# 中为 `new`）来创建它的新实例。它仅作为其他继承自它的类（如 `Page`）的公共基类。`Page` 和 `Object` 之间的具体类在现阶段并不真正重要，重要的是你的页面继承了\
  \ `Page` 类拥的所有行为。你所有的 ASPX 页面都继承自 `Page`，这一事实比你最初想象的要有用得多。因为继承自 `Page`，所以你免费获得了该类中定义的许多属性和方法。例如，`Page`\
  \ 类暴露了一个 `Title` 属性，设置它后，最终会成为页面中的 `<title>` 元素。你的页面只需设置此属性，父类 `Page` 就会为你处理其余的所有工作：\n\
  \nVB.NET\n\n```\nTitle = \"Beginning ASP.NET 4.5.1 in C# and VB from Wrox\"\n```\n\
  \nC#\n\n```\nTitle = \"Beginning ASP.NET 4.5.1 in C# and VB from Wrox\";\n```\n\n\
  在下一章节中，当你创建一个 `BasePage` 类时将使用继承，该类将作为你在 Planet Wrox 网站中创建的大页面的父类。\n\n在早的示例中（包括对\
  \ `ToString()` 方法的重写），你已经见过 `Public` 关键字。此外，在创建后台变量时，你看到了 `Private` 关键字。这些关键字被称为访问修饰符，决定了代码的可见性。\n\
  \n### 访问修饰符\n\n在本章开头，我提到过面向对象（OO）的核心概念是封装。通过创建函数和属性等成员，你让对象负责实现。与该对象交互的其他对象将这些方法和属性视为黑盒。也就是说，它们传入一些数据，并可选地期待返回结果。方法如何执行其工作对它们并不重要；它应该像描述的那样运行。为了让对象能够屏蔽其某些内部操作，你需要一种控制类型和成员访问的方法。你通过在类、属性或方法名称前指定访问修饰符来实现。下表列出了\
  \ C# 和 VB.NET 可用的访问修饰符，并解释了它们的用途。\n\n| C# | VB.NET | 说明 |\n| :--- | :--- | :---\
  \ |\n| public | Public | 类或成员可以从任何地方访问，包括当前应用程序之外的代码。 |\n| protected | Protected\
  \ | 使用 `protected` 访问修饰符的代码仅在定义它的类型内或继承自它的类型内可用。例如，在 `Page` 类中定义的 `protected` 成员对你的\
  \ ASPX 页面是的，因为它继承自 `Page`。 |\n| internal | Friend | 将代码的可访问性限制在同一程序集内的其他代码中。程序集是一组或多个编译后的代码文件（`.exe`\
  \ 或 `.dll` 文件），包含可重用的 .NET 代码。 |\n| private | Private | 仅在定义它的类型内可的类或成员。例如，对于 `Person`\
  \ 类，`_firstName` 变量只能从 `Person` 类内部访问。其他代码（如 ASPX 页面）无法直接访问此字段，而需要访问公共的 `FirstName`\
  \ 属性来获取或设置人的姓名。 |\n\n在这四个访问修饰符中，只有 `protected` 和 `internal`（VB 中的 `Protected` 和\
  \ `Friend`）可以组合。另外两个必须单独使用。通过组合 `protected` 和 `internal`，你可以创建仅可由当前类以及当前程序集中任何继承自它的类访问的成员。\n\
  \n使用访问修饰符，你现在可以通过将读取器标记为 `private`，来创建一个对外部代码只读但仍可以在类内部进行设置的属性。\n\n与其他一些面向对象概念一样，你并不会花费半天时间在代码中指定访问修饰符。然而，了解它们的存在及其作用是有好的。这样，你可能就能索到为什么有时你的类没有显示在\
  \ IntelliSense 列表中。在这种情况下，很有可能是你忘记在类上指定 `public` 访问修饰符（VB.NET 中为 `Public`）。默认值是\
  \ `internal`（VB.NET 中为 `Friend`），这使得该类对同一程序集中的其他类可见，但对程序集之外的代码是隐藏的。在类定义前面添加 `public`\
  \ 或 `Public` 关键字应该可以解决这个问题。\n\n### 事件\n\n本章需要讨论的最后一个重要主题是事件。ASP.NET 是一个事件驱动型环境，这意味着代码可以根据应用程序中发生的某些事件来执行。事件由应用程序中的某些对象触发，然后由其他对象处理。.NET\
  \ 框架中的许多对象都能触发事件，你甚至可以为你编写的类中添加自己的事件。\n\n为了能够处理由对象触发的事件，你需要编写一个事件处理器，它本质上是一个具有特殊签名的普通方法。你可以使用事件连接语法将此事件处理器连接到事件上，尽管\
  \ VS 大多数时候会替你编写这些代码。当一个对象（例如网页中的控件）触发事件时，它可能需要向事件处理器传递额外信息，以告知其引起或影响事件的 en 数据。你可以使用事件参数类来发送此信息，即\
  \ `System.EventArgs` 类或任何继承它的类。\n\n要查看所有这些术语是如何结合的，请考虑当你在点击网页上的按钮时会发生什么。\n\n\n\n\
  \n通过这段标记，编译器会生成必要的代码，将 `Button1_Click` 方法连接到按钮的 `Click` 事件。在运行时，你将看到完全相同的行为：当你点击按钮时，就会执行\
  \ `Button1_Click` 中的代码。注意，如果你在 VB.NET 的标记视图（Markup View）中连接事件，你将获得与在 C# 中相同的行为；在这种情况下，代码后置（Code\
  \ Behind）中会省略 `Handles` 关键字，因为标记视图中已经有一个 `On` 处理程序了。\n\n你还可以看到此 `Button1_Click`\
  \ 事件处理程序有两个参数：一个名为 `sender` 的 `Object` 和一个名为 `e` 的 `EventArgs` 类。这是标准的 .NET 命名方案，所有生成事件的对象都遵循这一方案。`sender`\
  \ 参数包含指向触发事件对象的引用（在本例中为 `Button1`）。这使你会在将多个事件连接到同一个事件处理程序时，能够查出是谁触发了事件。\n\n第二个参数是\
  \ `EventArgs` 类的一个实例，为事件提供了额外的参数。对于按钮点击，没有额外的相关数据需要提交，因此使用了简单且空的 `EventArgs` 类。然而，在后面的章节中（例如处理数据驱动\
  \ Web Forms 的第 9 章），你将看到一些触发带有更丰富信息事件的类示例。\n\n通过事件概念，你已经到达了面向对象章节的末尾。这一节应该让你熟悉了面向对象编程中使用的最重要的术语。在本书的剩余部分，你将看到这些概念的实际示例。\n\
  \n## 编程实用技巧\n\n以下列表提供了一些编程方面的实用技巧：\n\n*   始终为你的变量赋予有意义的名字。对于简单的循环计数器，你可以使用 `i`，尽管\
  \ `loopCount` 可能更地描述了变量的用途。不要在变量前加 `var` 单词。所有变量都是变量，所以添加 `var` 只会增加代码的噪声。对于私有字段，考虑使用\
  \ `_firstName` 和 `_categoryId` 等有用名称，而不是 `strFName`、`varFirstName` 或 `catI`；对于公共属性和类，分别使用像\
  \ `FirstName` 和 `Person` 的名称。\n\n*   不断尝试和实验。比起操作控件和 ASPX 页面，学习编程最好的方法是付诸实践。只需输入一些代码并按\
  \ `Ctrl+F5` 查看代码是如何运行的。当出错时，编译器会向你“抱怨”，并提供如何修复它的有用提示。不要害怕搞乱任何东西；不断尝试各种变化，直到代码实现你想要的功能。如果你无法让代码运行，请查看第\
  \ 18 章，该章节涉及调试。你将发现许多实用技巧，可以定位并修复代码中可能出现的许多错误。\n\n*   在编写函数或子程序时，尝试尽量减少代码行数。通常，超过\
  \ 40 或 50 行代码的方法是设计不良的迹象。当你看到这样的代码时，考虑将某些部分移动到它们自己的例程中。这会让你的代码更易理解，从而产生更少 Bug 的更好的代码。即使一个方法只被使用一次，将一大块代码保留在单独的方法中也可以显著提高代码的可读性和组织性。\n\
  \n*   在代码中编写注释时，尝试描述代码的总体目的，而不是解释那些显而易见的语句。例如，这个注释（在实际代码中随处可见）完全没用，且只增加了噪声：\n\n\
  \    ```\n    Dim loopCount As Integer = 0     '声明 loopCount 并将其初始化为零\n    ```\n\
  \n    任何有一点编程经验的人都能看出这段代码在做什么。\n\n## 总结\n\n尽管编程可能变得非常复杂，但你需要理解的最基础知识相对容易掌握。编程的趣味之处在于，你不需要成为专家就能编写实用的程序。你可以从一个简单的\
  \ Hello World 示例开始，并从那里延伸，每次稍微扩展你对代码的认知。\n\n本章涵盖了两个主要主题。首先，你学习了使用 C# 或 VB.NET 进行\
  \ .NET 编程。你看到了数据类型和变量是什么，并学习了操作符、判断和循环。你还看到了如何使用函数、子程序（subs）和命名空间编写组织良好的代码，以及如何为代码添加注释。\n\
  \n本章的最后一节涉及了面向对象。虽然面向对象本身是一个非常大的课题，但基础知识很容易学到。在本章中，你学习了 OO 编程的基本元素：类、方法、属性和构造函数。你还学习了一点继承，这是面向对象设计的驱动力。\n\
  \n在下一章（涉及创建外观一致的网页面）中，当你创建一个 `BasePage` 类作为 Planet Wrox 项目中大多数代码后置类的父类时，你将再次看到继承。\n\
  \n### 你在本章中学到的内容\n\n| 类 | 编程语言中对象的蓝图 |\n| :--- | :--- |\n| 集合 (Collection) | 一种能够同时持有多个对象的特殊数据类型\
  \ |\n| 构造函数 (Constructor) | 用于创建对象实例的特殊方法 |\n| 封装 (Encapsulation) | 向外部世界隐藏类的内部工作机制和数据，以便更好地管理和保护这些数据\
  \ |\n| 实例化 (Instantiating) | 根据类型定义在内存中创建新对象的过程 |\n| 方法 (Method) | 对象上的操作，例如 `Car`\
  \ 类的 `Brake()` |\n| 命名空间 (Namespace) | 以分级结构组织类和其他类型的方法 |\n| 面向对象 (Object Orientation)\
  \ | 一种流行的编程风格，将软件建模为相互作用的对象 |\n| 重写 (Overriding) | 在子类中重新定义父类中成员的行为 |\n| 属性 (Property)\
  \ | 对象的特征，例如人的名字 |\n\n\n\n\n\n对于大多数网站，当你从一个页面跳转到另一个页面时，只有部分内容会发生。不变的部分通常包含公共区域，如页眉（header）、菜单和页脚（footer）。为了创建布局一致的网页，你需要一种方法在单个模板文件中定义这些相对静态的区域。2.0\
  \ 之前的 ASP.NET 版本没有模板解决方案，因此你被迫在网站的每个页面上重复你的页面布局，或者诉诸奇特的编程技巧。幸运的是，由于 `master pages`（主页）的引入，情况已不再如此。主页最大的用处是它们允许你在一个位置定义网站中所有页的外观和感受。这意味着如果你想更改网站的布局——例如，想将菜单从左侧移动到右侧——你只需要修改主页，基于此主页的页面会自动获取更改。\n\
  \n当 ASP.NET 2.0 引入主页时，它们迅速被开发者社区接纳为 ASP.NET 页面的模板解决方案，因为它们非常易于使用。此外，VS 提供了极佳的设计时支持，因为它允许你能够在开发期间在设计时创建和查看页面，而不仅仅是在运行时在浏览器中查看。\n\
  \n在某种程度上，主页看起来像一个普通的 ASPX 页面。它包含静态 HTML，如 `<html>`、`<head>` 和 `<body>` 元素，也可以包含其他\
  \ HTML 和 ASP.NET 服务控件。在主页内部，你设置了想要在每个页面上重复的标记，例如页面的通用结构和菜单。\n\n然而，主页并不是真正的 ASPX\
  \ 页面，不能直接在浏览器中请求；它仅作为模板，真实的网页——称为 `content pages`（内容页）基于此创建。\n\n与你在第 4 章中看到的 `@Page`\
  \ 指令不同，主页使用 `@Master` 指令来标识该文件为主页：\n\n### VB.NET\n```xml\n<%@ Master Language=\"\
  VB\" %>\n```\n\n### C#\n```xml\n<%@ Master Language=\"C#\" %>\n```\n\n就像普通的 ASPX\
  \ 页面一样，主页可以有一个后代码文件（Code Behind），通过其 `CodeFile` 和 `Inherits` 属性进行标识：\n\n### VB.NET\n\
  ```xml\n<%@ Master Language=\"VB\" CodeFile=\"Frontend.master.vb\"\n           Inherits=\"\
  MasterPages_Frontend\" %>\n```\n\n### C#\n```xml\n<%@ Master Language=\"C#\" AutoEventWireup=\"\
  true\" CodeFile=\"Frontend.master.cs\"\n           Inherits=\"MasterPages_Frontend\"\
  \ %>\n```\n\n为了创建内容页可以填充的区域，你如下在页面中定义 `ContentPlaceHolder` 控件：\n\n```xml\n<asp:ContentPlaceHolder\
  \ ID=\"ContentPlaceHolder1\" runat=\"server\">\n</asp:ContentPlaceHolder>\n```\n\
  \n你可以根据需要创建任意数量的占位符，尽管你通常只需要几个来创建一个灵活的页面布局。\n\n内容页本质上是普通的 ASPX 文件，不包含它们将从主页中获取的代码，它们通过\
  \ `Page` 指令的 `MasterPageFile` 属性连接到主页：\n\n### VB.NET\n```xml\n<%@ Page Title=\"\"\
  \ Language=\"VB\" MasterPageFile=\"~/MasterPages/Frontend.master\"\n       AutoEventWireup=\"\
  false\" CodeFile=\"Default.aspx.vb\" Inherits=\"_Default\"> %>\n```\n\n### C#\n\
  ```xml\n<%@ Page Title=\"\" Language=\"C#\" MasterPageFile=\"~/MasterPages/Frontend.master\"\
  \n       AutoEventWireup=\"true\" CodeFile=\"Default.aspx.cs\" Inherits=\"_Default\"\
  > %>\n```\n\n页面特定的内容随后被放在一个指向相关 `ContentPlaceHolder` 的 `Content` 控件中：\n\n```xml\n\
  <asp:Content ID=\"Content1\" ContentPlaceHolderID=\"ContentPlaceHolder1\"\n    \
  \       runat=\"Server\">\n</asp:Content>\n```\n\n注意，`Content` 控件的 `ContentPlaceHolderID`\
  \ 属性指向在主页中定义的 `ContentPlaceHolder`。目前它指向默认名称 `ContentPlaceHolder1`，但在随后的练习中，你将看到如何更改它。\n\
  \n在运行时，当页面被请求时，来自主页和内容页的标记会被合并、处理并发送到浏览器。图 6-1 显示了仅有一个 `ContentPlaceHolder` 的主页图，以及由此生成的发送到浏览器的最终内容页。\n\
  \n![image](img/f198-01.jpg)\n\n**图 6-1**\n\n为了直观地看到这一过程，接下来的章节将指导你创建主页和内容页。\n\n\
  ### 创建主页\n\n你可以使用“添加新项”对话框向网站添加主页。你可以将它们放在网站中的任何自定义文件夹中，包括根文件夹，但从组织角度来看，通常将它们存储在单独的文件夹中更方便。与普通的\
  \ ASPX 页面一样，它们支持内联代码模型，也支持后代码模型。Planet Wrox 项目使用的主页专门使用后代码模型。在接下来的练习中，你将学习如何创建一个简单的主页并向其中添加一些\
  \ HTML 以定义网站页面的通用结构。\n\n在下一个小节中，你将看到如何使用此主页作为内容页的模板。\n\n### 创建内容页\n\n如果没有使用它的内容页，主页是毫无用处的。通常情况下，你会有几个主页，而网站中可以有很多内容页。要基于主页创建内容页，在添加新页面时，在“添加新项”对话框底部勾选主页选项。或者，也可以直接在标记视图中设置\
  \ `MasterPageFile` 属性。你在本章早期介绍主页和内容页时见过 `@Page` 指令。内容页只能直接包含映射到主页 `ContentPlaceHolder`\
  \ 的 `Content` 控件。这些控件反过来可以包含标准标记和服务声明。要将现有的 ASPX 页面转换为内容页，最简单的方法是将保留的内容复制到剪贴板，删除旧页面，然后添加基于主页的新页面。页面添加后，你可以在内容标签内粘贴标记。你将在下面的练习中看到这种运作。\n\
  \n在更新或彻底更改网站外观时，主页将节省大量工作。因为整个网站的设计和布局都在主页中定义，当你想要任何更改时，只需要修改这一个文件。所有内容页都会获取更改。\n\
  \n#### 深入了解主页\n\n到为止，你看到的主页有一个用于内容的占位符。但如果你在标记视图中查看主页，会在页头部分找到另一个内容占位符：\n\n```xml\n\
  <head runat=\"server\">\n  <title></title>\n  <asp:ContentPlaceHolder id=\"head\"\
  \ runat=\"server\">\n  </asp:ContentPlaceHolder>\n  ...\n</head>\n```\n\n你创建的每个主页会自动为你此。你可以在内容页中使用它添加位于页面\
  \ `<head>` 标签之间的特定内容，如 CSS（包括嵌入和外部样式表）和 JavaScript。你将在第 10 章和第 11 章中学习更多关于 JavaScript\
  \ 的知识。你需要在标记视图中向此占位符添加内容，因为它在设计视图中可见。\n\n主页名为 `cpMainContent` 的 `ContentPlaceHolder`\
  \ 目前本身不包含任何标记。然而，它不必如此。你可以轻松地在那里添加自己的内容，只要它不被内容页覆盖，它将作为内容页的默认内容。例如，你可以在主页中使用以下 `ContentPlaceHolder`：\n\
  \n\n\n\n\n```\n<asp:ContentPlaceHolder ID=\"cpMainContent\" runat=\"server\">\n\
  \  This is default text that shows up in content pages that don't\n  explicitly\
  \ override it.\n</asp:ContentPlaceHolder>\n```\n\n当你基于此主页创建新页面时，起初在标记视图（Markup View）中看不到这些默认内容。不过，你可以打开\
  \ `Content` 控件的智能任务（Smart Tasks）面板（参见图 6-6），并选择“默认为主页内容”（Default to Master’s Content）。\n\
  \n![image](img/f204-01.jpg)\n\n**图 6-6**\n\n当被询问是否要默认使用主页内容时点击“是”，VS 会从页面的标记视图中移除整个\
  \ `Content` 控件。然而，当你在浏览器中请求该页面时，你仍然能看到主页的默认内容。在设计视图（Design View）中，该内容仍然可见，现在以设计表面的一个只读区域的形式呈现。如果你在后期向主页添加新的\
  \ `ContentPlaceHolder`，那么带有默认内容的主页将非常有用。现有页面可以简单地显示默认内容，无需你修改所有这些页面。新页面可以定义自己的内容。如果你在主页的\
  \ `ContentPlaceHolder` 控件中没有默认内容，且内容页没有对应 `ContentPlaceHolder` 的 `Content` 控件，则不会向浏览器发送任何输出。\n\
  \n一旦你使用了主页的内容，可以通过打开智能任务面板并选择“创建自定义内容”（Create Custom Content）重新创建自定义内容。这会将默认内容复制到一个新的\
  \ `Content` 控件中，然后你可以对其进行修改。\n\n### 嵌套主页\n\n嵌套主页也是可能的。嵌套主页是基于另一个主页的主页。内容页面就可以基于这个嵌套主页。如果你有一个网站针对不同的区域，但仍然需要共享共同的外观和感受，这种方法就非常有用。例如，你可以有一个按部门划分的企业网站。外部主页定义了网站的全局外观和感受，包括公司\
  \ Logo 和其他品牌元素。然后你可以为不同的部门设置不同的嵌套主页。例如，销售部门的部分可以基于与营销部门不同的主页，从而允许每个部门在其网站的相应部分添加自己的标识。VS\
  \ 2013 对嵌套主页提供了极佳的设计视图支持，让你清晰地看到最终页面的样子。\n\n创建嵌套主页非常简单：在添加主页时，就像向网站添加普通内容页一样，勾选“选择主页”（Select\
  \ Master Page）复选框。然后，在你想在内容页中覆盖的位置，向 `Content` 控件添加标记和 `ContentPlaceHolder` 控件。最后，你选择你的嵌套主页作为你创建的新内容页的主页。在内容页内部，你只能看到嵌套主页的\
  \ `ContentPlaceHolder` 控件，而不是其父页的控件。\n\n### 主页注意事项\n\n虽然主页非常出色并可以为你节省大量工作，但你需要注意一些限制。\n\
  \n首先，ASP.NET 运行时会更改页面中控件的*客户端 ID*（client ID）。这是在客户端脚本中用于从浏览器的 JavaScript 访问控件以及使用\
  \ CSS ID 选择器访问控件的 `id` 属性。对于普通的 ASPX 页面，控件的服务器端 ID 通常一对一插入到最终的 HTML 中。例如，在普通的 ASPX\
  \ 页面中，一个服务器端 ID 为 `Button1` 的 `Button` 控件通过此代码定义：\n\n```\n<asp:Button ID=\"Button1\"\
  \ runat=\"server\" Text=\"Click Me\" />\n```\n\n在最终的 HTML 中生成的客户端 ID 如下：\n\n```\n\
  <input type=\"submit\" name=\"Button1\" value=\"Click Me\" id=\"Button1\" />\n```\n\
  \n然而，位于 `<asp:Content>` 控件内部的同一个按钮生成的样式如下：\n\n```\n<input type=\"submit\" name=\"\
  ctl00$cpMainContent$Button1\"\n     value=\"Click Me\" id=\"cpMainContent_Button1\"\
  \ />\n```\n\n`name` 属性被加上了主页自动生成的 ID（`ctl00`），且 `name` 和 `id` 属性中都包含了 `ContentPlaceHolder`\
  \ 控件的 ID（`cpMainContent`）。\n\n这意味着任何以前引用 `Button1` 的客户端端代码现在都应该引用 `cpMainContent_Button1`。\n\
  \n请注意，这不仅仅是主页的问题。你会在其他情况下也会遇到这种行为；例如，在使用用户控件（在第 8 章中讨论）和数据绑定控件（在第 13 章及之后讨论）时。\n\
  \n第二个注意事项与第一个相关。由于 HTML 元素的 `name` 和 `id` 发生了变化，它们会显著增加页面的大小。对于单个控件来说，这可能不是问题，但一旦你的页面包含大量控件，这可能会影响你网站的性能。在嵌套主页中，问题会变得糟糕，因为内容控件的\
  \ ID 都会被追加。嵌套主页内部的同一个按钮生成的样式可能如下：\n\n```\n<input type=\"submit\" name=\"ctl00$ctl00$cpMainContent$ContentPlaceHolder1$Button1\"\
  \n      value=\"Click Me\" id=\"cpMainContent_ContentPlaceHolder1_Button1\" />\n\
  ```\n\n为了缓解这个问题，你应该尽可能让 `ContentPlaceHolder` 的 ID 保持短。\n\n### 使用集中式的基页\n\n在第 5 章中你学习到，默认情况下，所有\
  \ ASPX 页面都派生自 `System.Web.UI.Page` 类。\n\n然而，在某些情况下，这种行为是不够的，你需要在其中加入自己的东西。例如，你可能需要一种适用于所有页面的行为。与其在每个页面上添加这种行为，不如创建一个通的*基页*（base\
  \ page）。你网站中的所有页面都可以继承这个中间页，而不是标准的 `Page`。图 6-7 的左侧显示了名为 `MyWebPage` 的 ASPX 页面继承自\
  \ `Page` 类。右侧显示了 ASPX 页面继承自 `BasePage` 类的情况。\n\n为了让你的页面继承这个基页，你需要做两件事：\n\n*   在\
  \ `App_Code` 文件夹中创建一个继承自 `System.Web.UI.Page` 的类。\n*   让你网站中的网页继承该类而不是标准的 `Page`。\n\
  \n在接下来的练习中，你将在 `App_Code` 中创建一个新的基类。目前，该类的唯一目的是运行时检查页面的 `Title`，以防止空标题或无意义标题（如“未标题页面”）的页面发送到浏览器。\n\
  \n\n\n\n\n在实现基类之前，你需要了解更多关于`ASP.NET page life cycle` 的知识，这是一个重要的概念，描述了页面在被浏览器请求时所经历的过程。\n\
  \n### ASP.NET 页面生命周期简介\n\n当你思考 Web 服务器如何将页面发送到浏览器，并将此过程视为页面的`life cycle`时，你可能会想出页面生命周期中的几个关键时刻。例如，浏览器的初始请求是页面“生命”的起点。同样，当页面将整个\
  \ HTML 发送给浏览器后，它的生命似乎就结束了。然而，在页面的生命周期中发生着更有趣的事件。下表描述了页面经历的八个大阶段。在每个阶段中，至少会触发一个事件，让页面开发者能够挂钩页面的生命周期，并在正确的时机执行操作。你将在下一个练习中看到这个例子。\n\
  \n| 阶段 | 描述 |\n| :--- | :--- |\n| 页面请求 | 对 `ASPX` 页面的请求启动了该页面的生命周期。当 Web 服务器能够并允许返回页面的缓存副本时，就不会执行整个生命周期。在所有其他情况下，页面进入启动阶段。\
  \ |\n| 启动 | 在此阶段，页面可以访问 `Request` 和 `Response` 等属性，这些属性用于与页面交互。此外，在此阶段会触发 `PreInit`\
  \ 事件，指示页面即将进入初始化阶段。你稍后将使用此事件设置页面的主题。 |\n| 页面初始化 | 在此阶段，你在页面中设置或通过程序添加的控件变得可用。此外，`Page`\
  \ 类会触发三个事件：`Init`、`InitComplete` 和 `PreLoad`。 |\n| 加载 | 在此阶段，控件属性会在回传（postback）期间从\
  \ View State 和 Control State 加载。例如，当你更改 `DropDownList` 中的选中项目并导致回传时，这是正确项目再次在列表中被预选的时刻，然后你可以在服务器端代码中对其进行操作。此外，在此阶段，页面会触发\
  \ `Load` 事件。 |\n| 验证 | 在验证阶段，将处理用于验证用户输入的 Validation 控件。你将在第 9 章中学习验证器。 |\n| 回传事件处理\
  \ | 在此阶段，你页面中的控件可能会触发它们自己的事件。例如，当用户在列表中选择了不同的选项时，`DropDownList` 可能会触发 `SelectedIndexChanged`\
  \ 事件。同样，当用户在回传服务器之前更改文本时，`TextBox` 可能会触发 `TextChanged` 事件。当所有事件处理完成后，页面会触发 `LoadComplete`\
  \ 事件。在此阶段，还会触发 `PreRender` 事件，指示页面即将渲染到浏览器。稍后，会触发 `SaveStateComplete`，表示页面已完成在 View\
  \ State 中存储控件的所有相关数据。 |\n| 渲染 | 渲染是控件（以及页面本身）向浏览器输出其 HTML 的阶段。 |\n| 卸载 | 卸载阶段实际上是一个清理阶段。这是页面和控件释放它们一直持有的资源的时刻。在此阶段，会触发\
  \ `Unload` 事件，以便你处理可能需要的任何清理工作。 |\n\n重要的一点是意识到，所有这些事件都在*服务器端*触发的，而不是在客户端。因此，即使你在客户端更改了（例如）文本框的文本，在回传页面后，`TextBox`\
  \ 控件的 `TextChanged` 事件会在服务器端触发。\n\n现在你可能奇怪为什么需要知道所有这些。了解页面生命周期最大的原因是，某些操作只能在页面生命周期的特定阶段执行。例如，正如你稍后将看到的，动态更改主题必须在\
  \ `PreInit` 中进行。要真正理解 ASP.NET 页面生命周期，你需要了解更多关于控件、状态、事件等的知识。因此，你将在第 15 章再次回顾页面生命周期，届时你将详细查看所有触发的不同事件及其顺序。\n\
  \n在下一个练习中，你使用 `Page` 类的 `PreRender` 事件来检查标题。因为开发者可以在许多事件期间通过程序设置页面的标题，因此检查正确的标题应该在页面生命周期尽可能晚的时候进行，这就是为什么\
  \ `PreRender` 是执行此操作的最佳事件。\n\n### 实现基页面\n\n实现基页面非常简单：你只需要向你的 `App_Code` 文件夹添加一个类文件，向其中添加一些代码，就完成了。通常比较困难的是确保网站中的每个页面都继承这个新的基页面，而不是继承自标准的\
  \ `System.Web.UI.Page` 类。遗憾的是，在使用代码后（Code Behind）时，没有办法配置应用程序自动完成这一点，因此你需要手动修改每个页面。Visual\
  \ Studio 通过允许你导出已包含此类代码的页面模板来让操作变得简单一点。在下一个练习中，你为网站添加一个基页面，在稍后的练习中，你将看到如何将 Web 表导出到模板，以便你可以快速添加使用基页面的文件。\n\
  \n由于现在向网站添加的每个新页面都应该继承这个新的基页面，你应该创建一个在代码后部和标记中已包含正确代码的页面模板。接下来将讨论这一点。\n\n### 创建可用的页面模板\n\
  \nVisual Studio 提供了一个很好的工具，可以导出多种类型的模板，包括 ASPX 页面、类文件甚至 CSS 文件。通过创建自定义模板，你可以在每个文件中定义所需的代码或标记，然后基于此模板创建新文件，从而减少你输入的代码。\n\
  \n## 主题\n\n到目前为止，你已经看到了如何通过创建主页来定义页面的全局外观。你还看到了如何使用基页面来集中页面的行为。然而，你还有更多影响网站外观的方法：主题和皮肤（skins）。皮肤将在本章稍后部分讨论，因为它们是主题的可选部分，而我们需要先讨论主题。\n\
  \n*主题*是定义页面外观的文件集合。主题通常包括皮肤文件、CSS 文件和图像。你在网站根目录下的 `App_Themes` 文件夹中定义主题。在该文件夹内部，你创建一个或多个子文件夹来定义实际主题。在每个子文件夹中，你可以有多个组成主题的文件。图\
  \ 6-12 显示了定义两个主题（Monochrome 和 DarkGrey）的网站解决方案。\n\n当主题激活时，主题文件夹中每个 CSS 文件的链接会自动添加到页面的\
  \ `<head>` 部分。你稍后将看到它是如何工作的。主题文件夹中的图像可以被 CSS 文件引用。\n\n要创建一个主题，你需要执行以下操作：\n\n*  \
  \ 如果尚未存在，则创建一个特殊的 `App_Themes` 文件夹。\n\n\n\n\n\n* 为你想要创建的每个主题，创建一个以主题命名的子文件夹，例如图\
  \ 6-12 中的`Monochrome` 或 `DarkGrey`。\n*   （可选地）创建一个或多个 CSS 文件，这些文件将作为主题的一部分。虽然以主题命名的\
  \ CSS 文件有助于识别正确的文件，但这并不是强制性要求。你添加到主题文件夹的任何 CSS 文件都会在运行时自动被添加到页面中。\n*   （可选地）向主题文件夹中添加一个或多个图像。CSS\
  \ 文件应该像后文解释的那样，使用相对路径引用这些图像。\n*   （可选地）向主题文件夹中添加一个或多个皮肤文件（skin files）。皮肤文件允许你为特定控件定义单独的属性（例如\
  \ `ForeColor` 和 `CssClass`），这些属性会在运行时应用。\n\n按照这些步骤操作后，你可以配置你的网站或单个 页面来使用此主题。为了能够设置正确的主题，你应该意识到存在两种类型的主题。\n\
  \n## 主题的不同类型\n\nASP.NET 页面有两个允许你设置主题的不同属性：`Theme` 属性和 `StyleSheetTheme` 属性。这两个属性都使用你在\
  \ `App_Themes` 文件夹中定义的主题。正如你稍后看到的，这两个属性都从 `Web.config` 文件获取其默认值。尽管它们最初看起来非常相似，但区别在于它们的运行时行为。`StyleSheetTheme`\
  \ 在页面生命周期的非常早期就会应用，在页面实例创建后不久即可。这意味着单个页面可以通过在控件上应用内联属性来覆盖主题的设置。例如，一个带有皮肤文件（将按钮的\
  \ `BackColor` 设置为蓝色）的主题，可以通过页面标记中的以下控件声明来覆盖：\n\n```\n<asp:Button ID=\"Button1\"\
  \ runat=\"server\" Text=\"Button\" BackColor=\"Red\" />\n```\n\n另一方面，`Theme` 属性中的主题是在页面生命周期的后期被应用的，它实际上有效地覆盖了你可能对单个控件进行的任何自定义。\n\
  \n## 在 Theme 和 StyleSheetTheme 之间进行选择\n\n由于 `StyleSheetTheme` 的属性可以被页面覆盖，而 `Theme`\
  \ 反过来又可以覆盖这些属性，因此两者都有不同的用途。如果你想为你的控件提供默认设置，应该设置 `StyleSheetTheme`。也就是说，`StyleSheetTheme`\
  \ 可以为你的控件提供默认值，然后这些值可以在页面级别被覆盖。如果你想强制执行控件的外观和感受，则应该使用 `Theme` 属性。由于 `Theme` 的设置不能再被覆盖，并实际上会重写任何自定义，你可以确保你的控件外观与你在主题中定义的一致。这里有一个例外：通过将控件上的\
  \ `EnableTheming` 设置为 `False`，你可以禁用该控件的主题功能。你将在章节末尾看到此属性及其影响。书中的 Planet Wrox 示例网站使用了\
  \ `Theme` 属性。\n\n## 应用主题\n\n要将主题应用到你的网站，你有三种选择：在 `Page` 指令中在页面级设置，通过修改 `Web.config`\
  \ 文件在站点级设置，以及通过程序设置。\n\n*   **在页面级设置主题。** 在页面级设置 `Theme` 或 `StyleSheetTheme` 属性是简单的，只需在页面的\
  \ `Page` 指令中设置相关属性：\n\n```\n<%@ Page Language=\"VB\" AutoEventWireup=\"false\" CodeFile=\"\
  Default.aspx.vb\"\n          Inherits=\"_Default\" Theme=\"DarkGrey\" %>\n```\n\n\
  将 `Theme` 替换为 `StyleSheetTheme` 以应用一个设置可以被单个控件覆盖的主题。图 6-13 显示，一旦你输入 `Theme=`，VS\
  \ 就会弹出一个列表，显示它在 `App_Themes` 文件夹中找到的所有主题。\n\n![image](img/f218-01.jpg)\n\n**图 6-13**\n\
  \n*   **在站点级设置主题。** 为了在整个网站强制执行主题，你可以通过向 `<system.web>` 元素内的 `<pages>` 元素添加 `theme`\
  \ 或 `styleSheetTheme` 属性在 `Web.config` 文件中设置主题：\n\n```\n<pages theme=\"DarkGrey\"\
  \ styleSheetTheme=\"DarkGrey\">\n   ...\n</pages>\n```\n\n确保你输入的属性完全如所示，因为 `Web.config`\
  \ 文件中的 XML 是区分大小写的。正如你稍后看到的，在这里设置的属性将应用到 `Page` 类的 `Theme` 和 `StyleSheetTheme` 属性上。\n\
  *   **通过程序设置主题。** 设置主题的第三也是最后方法是通过代码通过编程设置。你将在稍后的练习中看到它是如何工作的。\n\n下一个“Try It Out”练习将向你展示主题是如何工作的。你创建一个主题，添加必要的\
  \ CSS，然后配置应用程序使用该新主题。\n\nASP.NET 主题不仅限于 CSS 文件。正如你接下来将学习的，主题还可以包含图像和皮肤文件。\n\n##\
  \ 扩展主题\n\n除了 CSS 文件和皮肤（在本章末尾讨论）之外，主题还可以包含图像。主题图像最常用的用法是从你的 CSS 中引用它们。为了充分利用这一点，理解\
  \ CSS 如何引用图像至关重要。\n\n根据设计，CSS 选择器引用的图像将相对于 CSS 文件的位置进行搜索，除非你提供一个以斜杠（/）开头的路径来指示根目录。例如考虑\
  \ 17 所示的 `App_Themes` 文件夹。\n\n![image](img/f222-01.jpg)\n\n**图 17](#Chapter06.xhtml_figure-17)**\n\
  \n要引用 `Monochrome` 主题 `Images` 文件夹中的 `MenuBackground.jpg` 文件，你可以在 `Monochrome.css`\
  \ 中添加以下 CSS：\n\n```\nnav\n{\n  background-image: url(Images/MenuBackground.jpg);\n\
  }\n```\n\n如果你想引用根目录下 `Images` 文件夹中的图像，你应该使用这个：\n\n```css\nbackground-image: url(/Images/MenuBackground.jpg);\n\
  ```\n\n注意图像路径前的斜杠，它表示根目录。后一种语法对于你想在不同主题之间共享图像非常有用。下一章将更深入地探讨引用资源的 URL 的不同形式。\n\n\
  ## 动态切换主题\n\n在运行时切换主题有几个好处。例如，你可以通过允许用户选择他们喜欢的颜色和布局的主题来满足他们。并不是人都喜欢深色背景白文字，因此在运行时更改它的选项是许多人喜欢的功能。然而，你也可以部署主题来帮助视力障碍用户。通过创建一个具有高对比度色彩方案和大字体号的主题，你可以让他们更容易看到你的网站。Planet\
  \ Wrox 网站中的主题只更改屏幕元素（如颜色和布局），但你可以轻松复制其中一个主题，然后更改字体大小和色彩方案。\n\n由于主题在运行时应用于页面的方式，你需要在页面生命周期的早期设置主题，准确来说是在\
  \ `PreInit` 事件中。网站的基页面再次是执行此操作的理想位置，因为网站中的每个页面都继承自此类。\n\n\n\n\n为了让用户更改主题，你可以为他们提供一个下拉菜单，当他们更改列表中的活动选项时，该菜单会自动回传到服务器。在服务器端，你从列表中获取选定的主题，将其应用于页面，然后将选择结果存储在\
  \ `cookie` 中，以便在后续访问网站时可以检索。\n\nCookies 是存储在用户计算机上的一小段文本。你存储在 cookie 中的数据仅会被发送到最初设置它的服务器，因此其他网站无法读取你网站的\
  \ `cookie`。然而，由于 cookies 是以明文形式存储在用户的计算机上的，你永远不应该使用它们来存储任何敏感数据（例如密码）。不过，存储像首好主题这样的无害数据是使用\
  \ cookie 的极佳方式。\n\n要创建一个 cookie 并存储在用户的计算机上，你需要使用 `Response` 对象上的 `Cookies` 集合。这样，cookie\
  \ 就会随响应发送到浏览器。这里有一个简单的示例：\n\nVB.NET\n```\nDim myCookie As HttpCookie = New HttpCookie(\"\
  CookieName\")\nmyCookie.Expires = DateTime.Now.AddMonths(3)\nmyCookie.Value = \"\
  Cookie value\"\nResponse.Cookies.Add(myCookie)\n```\n\nC#\n```\nHttpCookie myCookie\
  \ = new HttpCookie(\"CookieName\");\nmyCookie.Expires = DateTime.Now.AddMonths(3);\n\
  myCookie.Value = \"Cookie value\";\nResponse.Cookies.Add(myCookie);\n```\n\n这段代码将\
  \ cookie 发送到浏览器，它将一直存储直到过期，在本示例中，过期时间是设置 cookie 之日的三个月后。对于页面的每次请求，浏览器都会将此 cookie\
  \ 发回服务器，你可以使用 `Request` 对象的 `Cookies` 集合再次读取它，如下：\n\nVB.NET\n```\nDim myCookie As\
  \ HttpCookie = Request.Cookies.Get(\"CookieName\")\nIf myCookie Is Nothing Then\n\
  \  Label1.Text = myCookie.Value ' 显示 \"Cookie value\"\nEnd If\n```\n\nC#\n```\n\
  HttpCookie myCookie = Request.Cookies.Get(\"CookieName\");\nif (myCookie != null)\n\
  {\n  Label1.Text = myCookie.Value; // 显示 \"Cookie value\"\n}\n```\n\n在接两个练习中，你将看到如何实现切换主题的功能。第一个练习引导你修改母页以允许用户选择主题。第二个练习显示了如何获取用户选择的主题并将其存储在\
  \ cookie 中，然后将该主题应用于继承自 `BasePage` 的每个页面。\n\n在允许用户选择主题的情况下，下一步是应用所选主题。正如你之前学到的，主题需要在\
  \ `PreInit` 事件中设置，该事件发生在页面生命周期的早期。在该事件内部，你可以检查 cookie 是否存在。如果存在，就可以使用它的值来设置主题。\n\
  \n通过程序化设置主题的能力，你为用户提供了一种快速方便的方法来根据喜好更改页面。主题影响整个网站每个页面的颜色和布局。结合母页，如果你需要更改页面上的某些控件，这将是一个灵活的方法。这就是\
  \ ASP.NET skins 发挥作用的地方。\n\n## Skins\n\n`Skins` 是简单的文本文件，包含允许你从中心位置定义一个或多个服务器控件外观的标记。它们放置在主题文件夹中，是\
  \ ASP.NET 主题功能不可缺的一部分。skin 文件（扩展名为 `.skin`）包含控件的服务器表示元素。这些设置将应用于应用 skin 的控件。要查看它是如何工作的，请考虑以下定义\
  \ `Button` 控件——外观的示例：\n\n```\n<asp:Button BackColor=\"#cccccc\" ForeColor=\"#308462\"\
  \ runat=\"server\" />\n```\n\n有了这种 skin 定义，网站中的按钮将获得 `#cccccc` 的 `BackColor` 和 `#308462`\
  \ 的 `ForeColor`。你只需要在主题下创建一个 skin 文件，并将此标记添加其中，从此以后，所有按钮将自动更改。正如你之前直接在控件上设置属性一样，这些\
  \ `BackColor` 和 `ForeColor` 等属性会被转换为客户端 HTML 和 CSS。\n\n注意，这种 skin 标记与按钮的标记相似，但存在一些差异。首先，skin\
  \ 文件中的控件不能有 `ID` 属性。`ID` 用于唯一标识页面中的控件，由于 skin 应用于所有控件，因此没有必要给它一个 `ID`。另一个差异是可以在标记中设置的属性数量。并不是控件的所有属性都可以被\
  \ skin 化。例如，你不能通过 skin 设置 `Button` 的 `Enabled` 属性。微软的 MSDN 文档列出了每个属性是否可以被 skin。另一种判断是否可以对某个属性\
  \ skin 方法是直接尝试：在 skin 中设置该属性，如果不允许设置，将在运行时得到错误。\n\n通常情况下，影响外观的属性（`BackColor`、`ForeColor`、`BorderColor`）可以\
  \ skin 化，而影响行为的属性（`Enabled`、`ViewState`）无法设置。当你使用添加项对话框创建新的 skin 文件时，你会得到许多封装在服务器端注释中的文本。你可以安全地删除这些注释，因为它们只是提供了\
  \ skin 如何工作的简短示例。你可以在单个 skin 文件中定义多个控件。然而，从维护性的角度来看，根据其代表的控件来命名每个 skin 文件通常更容易。例如，你有用于按钮的\
  \ `Button.skin`、用于标签的 `Label.skin` 等。\n\n与其直接将格式元素应用于 skin 中的控件属性并应用于页面的最终标记，不如使用\
  \ `CssClass` 属性指向你的 CSS 文件之一中的类。这样，进行全站更改更加容易，并且避免了最终 HTML 的膨肿。给定之前的示例，具有以下 skin\
  \ 定义的文件和主题 CSS 文件中的类将产生相同的效果：\n\n```\n<asp:Button CssClass=\"MyButton\" runat=\"\
  server\" />\n\n.MyButton\n{\n  color: #308462;\n  background-color: #cccccc;\n}\n\
  ```\n\n### 创建 Skin 文件\n\nSkin 文件必须直接创建在主题文件夹中。你不能像主题图像那样将它们存储在子文件夹中。在下面的练习中，你将看到如何创建一个简单的\
  \ skin 文件来更改网站中所有按钮控件的外观。本书的后续章节将在此知识的基础上，为 `GridView` 等其他控件定义更复杂的 skin。\n\n在 skin\
  \ 文件中输入字字符时，你会发现熟悉的智能提示（IntelliSense）没有启动。这使得定义你的控件及其属性变得有些困难。不过，有一个简单的变通方法：\n\n\
  1. 通过选择“工具 ⇒ 选项”打开 Visual Studio 的选项对话框。\n2. 展开“文本编辑器”类别并点击“文件扩展名”。\n3. 在“扩展名”框中输入\
  \ `skin`，然后从“编辑器”下拉列表中选择“用户控件编辑器”。\n4. 点击“添加”按钮，然后点击“确定”按钮以关闭选项对话框。\n\n从此以后，你将在\
  \ skin 文件中获得智能提示（如果你已经创建了 skin 文件，可能需要先重新打开这些 skin 文件）。开启此设置后，当你打开 skin 文件时，可能会在错误列表中收到一个关于生成程序程序的警告。你可以安全地忽略此警告，因为即使在\
  \ VS 中开启了这些设置，skin 在运行时也能正常工作。\n\n\n\n如你所见，皮肤（skins）非常易用，能够让你从根本上改变网站中特定控件的外观。但如果你不想让所有按钮同时变成蓝色和白色呢？如果你需要一个红色背景的特殊按钮呢？你可以通过`named\
  \ skins`（命名皮肤）来实现这一点。\n\n### 命名皮肤\n命名皮肤与普通皮肤完全相同，唯一的例外是：它们设置了 `SkinID`，这允许你通过名称来引用该皮肤。随后，ASPX\
  \ 页面中的控件可以使用该 `SkinID` 将特定的皮肤应用到控件上。接下来的练习将向你展示它是如何运作的。\n\n通过命名皮肤，你拥有了一个非常灵活的解决方案。使用普通皮肤，你可以快速更改网站中所有控件的外观。然后，你可以使用命名皮肤来对你想要外观不同的少数控件覆盖这种行为。\n\
  \n### 为特定控件禁用主题\n如果出于某种原因，你不想为特定控件应用皮肤，可以通过设置控件的 `EnableTheming` 属性来禁用皮肤，如下：\n\n\
  ```\n<asp:Button ID=\"Button1\" runat=\"server\" EnableTheming=\"False\" Text=\"\
  Button\" />\n```\n\n当 `EnableTheming` 设置为 `False` 时，皮肤将不会应用到控件。不过，主题 CSS 文件中的 CSS\
  \ 设置仍然会被应用。\n\n## 关于创建一致页面的实用技巧\n以下列表提供了一些关于创建一致页面的实用技巧：\n\n*   当你创建一个新网站时，始终从添加一个主页（master\
  \ page）开始，并将其作为其他页的基础。即使你认为网站只有几个页面，主页也能帮助你确保整个网站的外观一致。在网站开发后期给网站添加主页意味着要对现有页面进行大量的手动更改。\n\
  *   一旦你发现自己在为复杂的控件（如下一章讨论的 `TreeView` 和 `Menu`）或数据感知控件（如第 13 节讨论的 `GridView`）添加样式信息时，请考虑为它们创建一个皮肤。由于你可以从一个位置控制所有相似控件的布局，这使得更新网站变得简单得多。如果你想覆盖少数控件的布局，你可以始终使用带有\
  \ `SkinID` 的命名皮肤，或者通过将 `EnableTheming` 设置为 `False` 来完全禁用皮肤。\n*   在创建皮肤或直接在控件上设置样式属性时，考虑改用\
  \ `CssClass` 属性，然后将所有与样式相关的属性移动到网站或主题的 CSS 中。这可以减少页面的大小，并使日后对布局的更改更容易。\n*   Visual\
  \ Studio 的导出模板功能是一个节省时间的利器。你不仅可以使用它为 ASPX 页面及其 `Code Behind` 创建模板，还将其用于其他文件（如类和\
  \ CSS 文件），甚至是整个网站。这使你能够快速启动新文件的创建，避免反复输入相同的内容。\n\n## 总结\n网站所有页面一致的外观和感受非常重要，这能让你的网站看起来专业且具有吸引力。这反过来有助于访问者在网站中找到正确的信息，增加他们再次访问你网站的机会。ASP.NET\
  \ 4.5.1 提供了许多很好的工具来帮助你创建一个外观一致的网站。\n\nASP.NET 主页和内容页帮助你创建一个在基于该主页的所有页面中重复的布局。\n\n\
  主页定义了中心化的外观和感受，而你使用基础页（base page）来集中处理行为，例如检查页面是否有无效标题。\n\n主题（Themes）用于更改网站页面及其包含的控件的外观和感受。由于主题包含\
  \ CSS 文件、图像和皮肤，你只需通过应用主题即可更改颜色、字体、位置和图像。通过合理利用命名皮肤和 `EnableTheming` 属性等技术，你可以创建一个适用于整个网站的设计，同时保持对每个控件进行逐一覆盖设计的灵活性。\n\
  \nPlanet Wrox 网站现在开始增长了。这意味着你和访问者寻找正确页面将变得更加困难。下一章将向你展示用户导航网站的多种不同方法，以便他们寻找寻找的页面时不会遇到任何问题。\n\
  \n### 本章学到的知识\n\n| 术语 | 描述 |\n| :--- | :--- |\n| **Base Page (基础页)** | 继承自 ASP.NET\
  \ `Page` 类的类，作为你 ASPX 页面的父类 |\n| **Content Page (内容页)** | 使用主页来构建其全局外观和布局的 ASPX\
  \ Web 表单 |\n| **Cookies** | 你可以存储在用户计算机上并从服务器再次访问的微小文本 |\n| **Master Page (主页)**\
  \ | 定义了使用该主页的内容页的外观和感受的中心化页面 |\n| **Named Skin (命名皮肤)** | 一个设置了显式 `SkinID` 的 ASP.NET\
  \ 皮肤，允许你通过其 ID 引用此皮肤 |\n| **Page Life Cycle (页面生命周期)** | ASPX 页面在被浏览器请求时经历的一系列事件\
  \ |\n| **Skin (皮肤)** | 一组影响浏览器中控件外观的显示设置 |\n| **Theme (主题)** | 一组 CSS 样式、皮肤和图像，用于更改网站中页的外观\
  \ |\n\n# 第 7 章：导航\n\n### 本章你将学到：\n*   如何使用服务器控件和纯 HTML 在网站中移动\n*   如何处理页面和其他资源（如图像）\n\
  *   如何使用 ASP.NET 的 `Menu`、`TreeView` 和 `SiteMapPath` 导航\n*   如何使用 ASP.NET 路由功能\n\
  *   如何通过代码将用户从一个页面发送到另一个页面\n\n### 本章的 wrox.com 代码下载\n你可以在下载选项卡中找到本章的 `wrox.com`\
  \ 代码下载。代码位于第 7 文件夹中。\n\n\n\n\n\n让用户从一个页面移动到另一个页面的常用方法是使用 `<a>` 元素。该元素有一个 `href`\
  \ 属性，允许你定义想要链接的页面或其他资源的地址。在标签之间，你可以放置想要链接的内容，例如文本、图像或其他 HTML。接面的代码段显示了 `<a>` 元素的简单示例：\n\
  \n```\n<a href=\"Login.aspx\">You can log in here</a>\n```\n\n在网页中使用此代码后，当用户点击“You\
  \ can log in here”（您可以在此处登录）文本时，他们将被带到 `Login.aspx` 页面，该页面应与包含链接的页面位于同一个文件夹。\n\n\
  `<a>` 元素有一个服务器端的对应项，称为 `HyperLink`。它最终会在页面中呈现为 `<a>` 元素。该控件的 `NavigateUrl` 属性直接映射到\
  \ `<a>` 元素的 `href` 属性。例如，如下内容页的服务器端 `HyperLink` 中：\n\n```\n<asp:HyperLink runat=\"\
  server\" id=\"LoginLink\" NavigateUrl=\"Login.aspx\">\n       You can log in here</asp:HyperLink>\n\
  ```\n\n会在浏览器中产生以下 HTML：\n\n```\n<a id=\"LoginLink\" href=\"Login.aspx\">You can\
  \ log in here</a>\n```\n\n除了由 ASP.NET 运行时分配的 `id` 属性外，此代码与之前的示例相同。在两种情况下，`href`\
  \ 属性都使用相对 URL 指向 `Login.aspx` 页面。下一个主题将描述相对 URL 和绝对 URL 之间的区别。\n\n## 理解绝对 URL 和相对\
  \ URL\n\n在网站中使用链接的关键在于良好地理解网站内部或外部资源可以采用的各种形式的统一资源定位符（`URL`）。URL 用于唯一标识你的网站或另一个网站中的资源。这些\
  \ URL 使用在不同的地方，包括超链接的 `href` 属性或指向 CSS 文件的 `<link>` 元素、指向图像或 JavaScript 源文件的 `src`\
  \ 属性，以及 CSS 属性的 `url()` 值。URL 可以表示为相对 URL 或绝对 URL。两者都有你应该注意的优点和缺点。\n\n### 相对 URL\n\
  \n在之前的示例中，你看到了一个相对 URL，它指向相对于 URL 使用位置的另一个资源。这意味着包含 `<a>` 元素的页面和 `Login.aspx` 页面都应该放在你网站中的同一个文件夹中。要引用其他文件夹中的资源，可以使用以下\
  \ URL。所有示例都基于图 7-1 所示的网站结构。\n\n![image](img/f241-01.jpg)\n\n**图 7-1**\n\n从根目录下的\
  \ `Login.aspx` 链接到 `Management` 文件夹下的 `Default.aspx`，可以使用此 URL：\n\n```\n<a href=\"\
  Management/Default.aspx\">Management</a>\n```\n\n从 `Management` 文件夹中的 `Default.aspx`\
  \ 引用图像 `Header.jpg`，可以使用此 URL：\n\n```\n<img src=\"../Images/Header.jpg\" />\n```\n\
  \n开头的两个点“导航”向上移动一个文件夹到达根目录，然后路径回到 `Images` 文件夹并指向 `Header.jpg`。\n\n对于更深文件夹层次结构，你可以使用多个双点，每个点代表你想要在网站层次结构中向上移动的文件夹，如下\
  \ `<img>` 元素所示。你可以它从位于 `Management` 文件夹下的 `Reviews` 文件夹中的页面引用同一张图像：\n\n```\n<img\
  \ src=\"../../Images/Header.jpg\" />\n```\n\n相对 URL 的一个优点是，你可以将一组文件移动到相同层级的另一个目录，而不破坏它们的内部链接。然而，它们同时也使文件移动到网站层次结构中的不同层次变得困难。例如，如果你将\
  \ `Login.aspx` 页面移动到单独的文件夹 `Members` 中，指向 `Management` 文件夹的链接将断。新的 `Members` 文件夹没有\
  \ `Management` 子文件夹，因此 `Management/Default.aspx` 不再是有效链接。\n\n为了解决这个问题，可以使用基于根目录的相对\
  \ URL。\n\n### 基于根目录的相对 URL\n\n基于根目录的相对 URL 始终以斜杠开头表示网站的根目录。再次取指向 `Management` 文件夹的链接，其基于根目录的版本如下：\n\
  \n```\n<a href=\"/Management/Default.aspx\">Management</a>\n```\n\n注意 `Management`\
  \ 文件夹前面的斜杠，它表示网站的根目录。此链接是不歧义的。它始终指向根目录下 `Management` 文件夹中的 `Default.aspx` 文件。使用此链接，将\
  \ `Login.aspx` 页面移动到子文件夹不会破坏它；它仍然指向完全相同的文件。\n\n### 服务器端控件中的相对 URL\n\n使用 ASP.NET\
  \ 服务器控件，你还有另一个可用选项来引用网站中的资源：你可以使用波浪号（`~`）字符指向网站的当前根目录。当你将网站作为主网站下的独立应用程序文件夹运行时，这特别有用。如果你的主站运行在\
  \ [www.PlanetWrox.com/Site](http://www.PlanetWrox.com/Site)，情况就是这样。要了解这意味着什么，考虑此在其\
  \ `ImageUrl` 中使用波浪号的图像：\n\n```\n<asp:Image ID=\"Image1\" runat=\"server\" ImageUrl=\"\
  ~/Header.jpg\" />\n```\n\n当你使用 `Site` 等应用程序文件夹时，搜索 `/Site/Header.jpg`。如果你重新配置网站在没有应用程序文件夹的情况下运行，则无需更改任何代码。\n\
  \n你也可以在普通 HTML 元素上使用 `~` 语法，前提是添加了 `runat` 属性。这样，路径会在服务器端处理并返回给客户端。下面的示例显示了一个指向\
  \ `Management` 文件夹页面的纯 HTML 链接：\n\n```\n<a href=\"~/Management.aspx\" runat=\"server\"\
  >Management</a>\n```\n\n随 VS 2013 提供的 Web 服务器 IIS Express 将始终在根目录启动新站点。这意味着将使用类似于\
  \ [`localhost:59898/`](http://localhost:59898/) 的 URL，而不是 [`localhost:59898/Site/`](http://localhost:59898/Site/)。因此，基于根目录的\
  \ URL 将按预期工作。\n\n### 绝对 URL\n\n相对于从文档或站点视角引用资源的相对 URL，你也可以使用通过完整路径引用资源的绝对 URL。因此，不再直接引用图像并可选指定文件夹，而是包含了完整的域名名称和协议信息（`http://`\
  \ 前缀）。这里有一个引用 Wrox Programmer to Programmer 网站（[`p2p.wrox.com`](http://p2p.wrox.com)）Wrox\
  \ 标志的示例：\n\n```\n<img src=\"http://p2p.wrox.com/images/header/wrox_logo.gif\" />\n\
  ```\n\n如果你想引用自己网站之外的资源，则需要绝对 URL。对于此类 URL，`http://` 前缀是重要的。如果你漏掉了它，浏览器将在你自己的网站内部查找名为\
  \ [p2p.wrox.com](http://p2p.wrox.com) 的文件夹。\n\n\n\n\n绝对 URL 是无歧的。它们始终指向一个固定位置，这可以帮助你确保无论源文档位于何处，你引用的始终是完全相同的资源。这可能让你认为在任何地方使用它们都是理想的——包括引用你自己网站内部的资源——但事实并非如此。额外的协议和域名信息会增加浏览器中页面的大小，导致下载速度不必要的变慢。但更重要的是，如果你更改域名，或者想在不同的网站中重用某些功能，这会带来困难。例如，如果你之前的网站运行在\
  \ [www.mydomain.com](http://www.mydomain.com) 上，但现在你正将其迁移到 [www.someotherdomain.com](http://www.someotherdomain.com)，你将需要更新整个网站中所有的绝对\
  \ URL。\n\n在开发过程中，你也会在绝对 URL 上遇到麻烦。通常情况下，你会在 `http://localhost` 这样的 URL 上测试网站。如果你将所有图像都指向该\
  \ URL，那么一旦你将网站放到像 [www.PlanetWrox.com](http://www.PlanetWrox.com) 这样的生产域名上，它们都会失效。\n\
  \n简而言之，请谨慎使用绝对 URL。当你引用网站外的资源时，你总是需要它们，但在自己的项目内部，你应尽可能优先使用相对 URL。\n\n### 理解默认文档\n\
  \n在 URL 的语境下，你还应该了解默认文档。当你访问像 [www.domainname.com](http://www.domainname.com) 这样的站点时，神奇地看到一个页面出现了。这是如何工作的？每个\
  \ Web 服务器都有所谓的默认文档，这是一份在未提供显式文档名称时可以提供给浏览器的文档列表。因此，当你访问 [www.domainname.com](http://www.domainname.com)\
  \ 时，Web 服务器会扫描请求请求的目录（在本例中为根文件夹），并处理从磁盘上在其默认文档列表中找到第一个文件。在大多数 ASP.NET 场景中，Web 服务器设置为使用\
  \ `Default.aspx` 作为默认文档。因此，当你在 ASP.NET Web 服务器上访问 [www.domainname.com](http://www.domainname.com)\
  \ 时，你实际上获得的是页面 [www.domainname.com/Default.aspx](http://www.domainname.com/Default.aspx)。\n\
  \n在你创建的链接中，如果不需要 `Default.aspx`，通常应该省略它。它减小了页面大小，但更重要的是，它让你的用户更容易输入地址。\n\n现在你已经看到了如何使用\
  \ URL 指向文档和其他文件，是时候查看一些利用这些 URL 的更高级控制控件了：ASP.NET 导航控件。\n\n## 使用导航控件\n\nASP.NET\
  \ 4.5.1 提供了三个实用的导航工具：`SiteMapPath、TreeView` 和 `Menu`。图 7-2 显示了这三个导航控件的基本示例，未应用任何样式。\n\
  \n![image](img/f243-01.jpg)\n\n**图 7-2**\n\n左侧的 `SiteMapPath` 向用户显示当前页面的路径。这对于用户想要在站点层次结构中移动一个或多个级别很有帮助。也能帮助他们理解自己所处的位置。`TreeView`\
  \ 可以显示你的网站结构，并允许你展开和折叠不同的节点；在图 7-2 中，整个树都是展开的。右侧的 `Menu` 控件最初只显示 Home 菜单项。然而，一旦你将鼠标移动到菜单项上，子菜单就会出现。在图\
  \ 7-2 中，这些子元素之一是 Reviews 元素，它本身也有子元素。\n\n尽管这三个导航控件在行为和外观上非常不同，但它们的设计有部分共同点。\n\n\
  ### 导航控件的架构\n\n为了方便使用 `Menu`、`TreeView` 或 `SiteMapPath` 在你的站点中显示相关页面，ASP.NET 使用了一个基于\
  \ XML 的文件来描述你网站的逻辑结构。默认情况下，该文件名为 `Web.sitemap`。然后，该文件被站点中的导航控件使用，以有组织的方式呈现相关链接。只需将其中一个导航控件连接到\
  \ `Web.sitemap` 文件，你就可以创建复杂的用户界面元素，如折叠菜单或树视图。\n\n### 检查 Web.sitemap 文件\n\n默认情况下，你应该将站点地图文件名为\
  \ `Web.sitemap`。这使得控件能够自动找到正确的文件。对于更高级的场景，你可以拥有多个不同名称的站点地图文件，并在 `Web.config` 文件中使用配置设置将这些额外文件暴露给系统。大多数情况下，单个站点地图文件就足够了。站点地图文件的基本版本如下：\n\
  \n```xml\n<?xml version=\"1.0\" encoding=\"utf-8\" ?>\n<siteMap xmlns=\"http://schemas.microsoft.com/AspNet/SiteMap-File-1.0\"\
  >\n  <siteMapNode url=\"~/\" title=\"Home.aspx\" description=\"Go to the homepage\"\
  >\n    <siteMapNode url=\"~/Reviews.aspx\" title=\"Reviews\"\n             description=\"\
  Reviews published on this site\" />\n    <siteMapNode url=\"~/About.aspx\" title=\"\
  About\"\n             description=\"About this site\" />\n  </siteMapNode>\n</siteMap>\n\
  ```\n\n站点地图文件包含 `siteMapNode` 元素，这些元素共同构成了网站的结构。在这个示例中，有一个名为 Home 的根节点，它又包含了子元素\
  \ Reviews 和 About。\n\n#### Web.sitemap 文件的关键元素\n\n每个 `siteMapNode` 都可以有很多子节点（但 `siteMap`\
  \ 元素直接只能有一个 `siteMapNode`），这允许你创建一个既宽又深的站点。此示例中的 `siteMapNode` 元素设置了三个属性：`url`、`title`\
  \ 和 `description`。`url` 属性应指向你网站中的有效页面。你可以使用你在上一节中看到的 `~` 语法来引用基于应用程序根目录的 URL。不需要指定文件\
  \ URL。ASP.NET 运行时不允许你多次指定相同的 URL，但你可以通过通过添加查询字符串来使 URL 变得唯一来绕过这一点。例如，`~/Login.aspx`\
  \ 和 `~/Login.aspx?type=Admin` 将被视为两个页面。你稍后会在章节中看到更多查询字符串。\n\n`title` 属性用于导航控件中显示页面名称。稍后当你处理\
  \ `Menu`、`TreeView` 和 `SiteMapPath` 控件时会看到更多相关内容。`description` 属性被用作导航元素的工具提示。图\
  \ 7-2 显示了 By 元素的工具提示。\n\n导航控件与 ASP.NET 安全机制协同工作。也就是说，你可以自动隐藏掉用户没有访问权限的如 `Menu` 等控件元素。安全机制将在第\
  \ 16 章中进行详细描述。\n\n`SiteMapPath` 控件显示面包屑（在本章稍后讨论），它能够找到 `Web.sitemap` 文件本身。对于另外两个控件，你需要显式指定一个\
  \ `SiteMapDataSource` 控件（你可以在工具箱的 Data 分类找到它）作为 `Web.sitemap` 文件的中间层。\n\n要创建 `Web.sitemap`\
  \ 文件，你需要将其添加到站点中，然后手动向其添加必要的 `siteMapNode` 元素。Visual Studio 中没有根据当前站点结构创建站点地图文件的方法，尽管存在一些第三方解决方案可以帮助实现这一点。\n\
  \n`Web.sitemap` 文件本身并没有什么用。你需要向站点中添加导航控件来利用站点地图。在下一节中，你将看到如何使用 `Menu` 控件。\n\n###\
  \ 使用 Menu 控件\n\n\n\n\n\n`Menu` 控件非常易用和调整。要创建一个基础菜单，你只需要在页面上添加一个它，将其连接到 `SiteMapDataSource`\
  \ 控件即可大功告成。但同时，该控件非常灵活，拥有大约 80 个公共属性（包括所有控件共享的属性），这让你能够调整控件的每个视觉方面。下表列出了用于菜单的最常用属性。请参阅\
  \ MSDN 在线帮助以获取该控件的完整描述。\n\n| 属性 | 描述 |\n| :--- | :--- |\n| `CssClass` | 允许你设置一个应用于整个控件的\
  \ CSS 类属性。 |\n| `StaticEnableDefaultPopOutImage` | 布尔值，决定是否使用图像来指示顶层菜单项上的子菜单。 |\n\
  | `DynamicEnableDefaultPopOutImage` | 布尔值，决定是否使用图像来指示子菜单项上的子菜单。 |\n| `DisappearAfter`\
  \ | 决定鼠标移开菜单项后，菜单项保持可见的时间（毫秒）。 |\n| `MaximumDynamicDisplayLevels` | 决定控件可以显示的子菜单项层数。对于非常大的站点地图，这有助于限制发送到浏览器的项目数量。\
  \ |\n| `DataSourceID` | `SiteMapDataSource` 控件的 ID，该控件从 `Web.sitemap` 文件为菜单提供数据。\
  \ |\n| `Orientation` | 决定使用带有弹出子菜单的水平菜单，还是带有折叠展开子菜单的垂直菜单。 |\n| `RenderingMode` |\
  \ 引入于 ASP.NET 4，此属性决定控件是使用表格和内联样式还是使用无序列表和 CSS 样式来呈现。 |\n| `IncludeStyleBlock` |\
  \ 引入于 ASP.NET 4，此属性让你对控件样式拥有完全的控制权（和责任）。当设置为 `False` 时，ASP.NET 不会添加用于布局 `Menu` 控件的嵌入样式表块，这由你负责编写\
  \ CSS。 |\n\n`Menu` 控件还有几个以 `Static` 或 `Dynamic` 开头的属性，其中两个已在前面的表中显示。`Static` 属性用于控制页面加载时出现的主菜单项。因为它们在鼠标悬停在其上方时不会改变或隐藏，所以它们被认为是静态的。子菜单是动态的，因为它们只在激活相关的主菜单项时才会出现。\n\
  \n除了这些属性，`Menu` 控件还有许多样式属性，允许你更改菜单不同部分的外观效果。\n\n#### 使用渲染模式 (Rendering Mode)\n\n\
  早期版本的 `Menu` 控件因其生成的 HTML 而受到批评。在 ASP.NET 2.0 和 3.5 中，`Menu` 控件使用表格和内联样式生成臃肿的 HTML。除了不必要增加页面大小外，这意味着使用你自己的\
  \ CSS 为 `Menu` 样式要困难得多。幸运的是，这个问题在 ASP.NET 4 中引入控件的 `RenderingMode` 属性后得到了解决。在新的\
  \ ASP.NET 4.5.1 站点中，默认情况下此属性确保控件使用 `<ul>` 和 `<li>` 元素将其渲染为无序列表。你可以通过将 `RenderingMode`\
  \ 属性设置为 `Table` 来覆盖此行为。\n\n你将在下一个练习中看到 `Menu` 控件及其生成的 HTML。\n\n#### 创建菜单控件的基础版本\n\
  \n为了查看 `Menu` 控件是如何运行的，最好的方法是先创建一个非常基础的版本。一旦你理解了它是如何工作的以及在底层是如何运行的，就可以按照喜好对菜单进行样式设计，使其与网站的其他设计融合在一起。\n\
  \n> 为了更好地将 `Menu` 控件与 Monochrome 主题现有设计集成，你可以使用 CSS 对其进行样式设置。\n\n#### 为菜单控件设置样式\n\
  \n`Menu` 控件暴露了许多复杂的样式属性，允许你更改主菜单项和子菜单项的外外观。你还可以定义这些项在激活（选中）或鼠标悬停在其上方时的外观。这些每个样式属性都有许多关于视觉方面的子属性，例如字体、颜色和间距。图\
  \ 7-7 显示了 `StaticMenuItemStyle` 属性的属性网格，它定义了页面首次加载时可见的主菜单项的外观。\n\n![image](img/f251-01.jpg)\n\
  \n**图 7-7**\n\n大多数属性，如 `BackColor`、`ForeColor` 和 `Font` 被添加到包含 `Menu` 控件的页面顶部的 `<style>`\
  \ 块。这使得在其他页面或其他主题中重用该设计变得困难，因此使用 CSS 要好得多。你接下来将看到它是如何运作的。\n\n> 水平模式下的 `Menu` 控件非常适合\
  \ Monochrome 主题，因为它具有水平导航栏。对于 DarkGrey 主题，你可以使用相同的 `Menu` 并将其 `Orientation` 设置为\
  \ `Vertical`。这创建了一个垂直菜单，主项堆叠在一起，而子菜单将向主菜单的右侧展开。但是，除了 `Menu` 控件外，你还可以使用 `TreeView`\
  \ 控件来显示站点地图的层级概览。接下将讨论该控件。\n\n#### 使用 TreeView 控件\n\n`TreeView` 能够显示项的层级列表，类似于 Windows\
  \ 资源管理器中的树结构。可以通过包含子元素的项目前的加、减号图标进行展开和折叠。这使得 `TreeView` 成为显示网站地图的理想工具（尽管你也可以将其用于非导航目的，例如显示层级数据并允许选择多个项）。然而，`TreeView`\
  \ 使用的数据不仅限于站点。你还可以将其绑定到普通的 XML 文件，甚至通过编程创建 `TreeView` 或其节点。\n\n下表列出了 `TreeView`\
  \ 的常用属性。再次，MSDN 在线帮助是获取所有属性及其描述概述的好地方。\n\n| 属性 | 描述 |\n| :--- | :--- |\n| `CssClass`\
  \ | （描述） |\n| `CollapseImageUrl` | 点击时折叠树部分的图像。默认是带有减号的图标。 |\n| `ExpandImageUrl`\
  \ | 点击时展开树部分的图像。默认是带有加号的图标。 |\n| `CollapseImageToolTip` | 鼠标悬停在可折叠菜单项上时工具提示。 |\n\
  | `ExpandImageToolTip` | 鼠标悬停在可展开菜单项上显示的工具提示。 |\n| `ShowExpandCollapse` | 决定是否可以通过点击前面的图像来折叠和展开\
  \ TreeView。 |\n| `ShowLines` | 决定是否使用线条连接树中的各个项。 |\n| `ExpandDepth` | 决定页面首次加载时树项展开的层级。默认设置为\
  \ `FullyExpand`，这意味着树中的所有项都是可见的。其他允许的设置为指示展开层级的数字值。 |\n\n要告诉 `TreeView` 显示哪些项，你需要将其绑定到\
  \ `SiteMapDataSource` 控件，接下将演示这一点。\n\n#### 使用 SiteMapPath 控件\n\n在讨论了三个导航控件中的两个之后，你需要查看的最后一个控件是\
  \ `SiteMapPath` 控件。\n\n\n\n\n\n`SiteMapPath` 控件向你展示你在站点结构中的位置。它呈现为一系列链接，通常被称为“面包屑导航”（`breadcrumb`）。这是一个非常简单但强大的控件，你可以通过属性网（Properties\
  \ Grid）设置 50 多个公共属性来影响它的外观。就像 `Menu` 和 `TreeView` 一样，它有许多样式属性，用于更改当前节点、普通节点和路径分隔符等元素的样式。\n\
  \n下表列出了 `SiteMapPath` 控件最常用的几个属性。\n\n| PROPERTY | DESCRIPTION |\n| :--- | :--- |\n\
  | `PathDirection` | 支持两个值：`RootToCurrent` 和 `CurrentToRoot`。第一个设置将根元素显示在左侧，中间显示中间层级，路径右侧显示当前页面。`CurrentToRoot`\
  \ 设置完全相反，当前页面显示在面包屑导航路径的左侧。 |\n| `PathSeparator` | 定义在路径不同元素之间显示的符号或文本。默认值是“大于”符号\
  \ (>)，但你可以将其更改为类似于管道符字符 (1124)。 |\n| `RenderCurrentNodeAsLink` | 决定路径的最后一个元素（当前页面）是渲染为文本链接还是纯文本。默认值为\
  \ `False`，这通常没有问题，因为你已经处于该元素所代表的页面，所以实际上并不需要链接。 |\n| `ShowToolTips` | 决定当用户悬停在路径元素上时，控件是否显示工具提示（从\
  \ `Web.sitemap` 文件中 `siteMapNode` 元素的 `description` 属性中获取）。默认值为 `True`，这意味着默认显示工具提示。\
  \ |\n\n根据你的个人偏好，通常不需要定义 `SiteMapPath` 控件的任何样式。在浏览器的最终页面中，`SiteMapPath` 主要由锚点标签 (`<a>`)\
  \ 和纯文本组成。如果你在 CSS 文件中为锚点设置了特定的选择器，`SiteMapPath` 将自动以与页面上其他链接一致的方式显示。\n\n这三个导航控件为你在从客户端构建网站导航系统提供了一套非常强大的功能。`Menu`\
  \ 和 `TreeView` 控件都允许你快速显示站点的整个结构，使用户可以轻松找到路径。`SiteMapPath` 帮助用户理解自己在站点中的位置，并为他们提供了一种导航到站点层级更高页面的简单方法。\n\
  \n到目前为止，你在浏览器中查看的所有页面都以 `.aspx` 扩展结尾。然而，为了让用户更容易直接输入地址并迎合搜索引擎，如果可以从 URL 中去掉 `.aspx`\
  \ 扩展就很好，这样像 `/Contact.aspx` 的页面就可以通过 `/Contact` 访问。接下来你将通过 ASP.NET 路由学会如何实现。\n\n\
  ## 路由 (ROUTING)\n\n传统上，ASP.NET Web Forms 使用基于文件的机制，你在浏览器中请求的页面（例如 `/Contact.aspx`）需要在磁盘上存在才能提供服务。然而，这并不总是理想的。搜索引擎倾向于使用没有扩展名的\
  \ URL，而且对于用户来说，没有扩展名的 URL 看起来更简单、更容易输入和记忆。为了解决这个问题，微软创建了一个名为 `FriendlyUrls` 的解决方案，你可以将其安装到网站中。一旦安装并配置，所有对带有\
  \ `.aspx` 扩展页面的请求将自动重定向到相应的无扩展版本。该解决方案的优点是易于设置，且不需要对页面进行进一步更改（除了从现有链接中删除 `.aspx`\
  \ 扩展之外）。在下一节中你将看到如何为站点配置无扩展名的 URL。\n\n### 设置无扩展名的 URL\n\n为了启用无扩展名的 URL，你需要使用包管理器控制台安装\
  \ NuGet 包。一旦添加了包，你需要在 `App_Code` 文件夹中编写路由配置类，并在网站的 `Global.asax` 文件中调用该方法。`Global.asax`\
  \ 文件是一个特殊的 ASP.NET 文件，你将其添加到站点的根目录。在此文件中，你可以编写代码来响应应用程序内部发生的全局事件。这些事件的工作方式与你目前看到的其他事件相同，例如\
  \ `Button` 的 `Click` 事件。最大的区别是，这些事件针对整个应用程序（你的网站）触发，而不是单个控件或页面。例如，当你的 ASP.NET 启动时，会触发\
  \ `Application_Start` 事件，允许你执行自己的代码。其他触发的事件包括 `BeginRequest`（每个站点请求都会触发）和 `Application_Error`（当站点发生未处理的异常时触发）。你将在第\
  \ 18 章中使用最后一个事件，该章节涉及调试和异常处理。\n\n### 无扩展名 URL 的注意事项\n\n当 ASP.NET 遇到带有 `.aspx` 扩展名的\
  \ URL 请求时，它指示浏览器获取一个不带扩展的新页面。这意味着浏览器正在请求两个页面，只为了显示最终的无扩展页面。显然，这是一种资源的浪费，因此，一旦你配置了友好\
  \ URL，就不应再链接到带有扩展名的页面。为了优化当前站点，你应该删除链接中删除所有 `.aspx` 扩展。如果你到目前一直跟了书中的所有练习，你会在根目录下的\
  \ `Default.aspx` 中找到两个链接，并在 `TableDemo.aspx` 文件有一个。\n\n```html\n<a href=\"Login.aspx\"\
  >Log in</a>\n```\n\n变为\n\n```html\n<a href=\"Login\">Log in</a>\n```\n\n此外，你应该删除\
  \ `Web.sitemap` 中 URL 的扩展，这些 URL 驱动着 `Menu`、`TreeView` 和 `SiteMapPath` 控件。这里是页面的示例：\n\
  \n```xml\n<siteMapNode url=\"~/Reviews\" title=\"Reviews\" description=\"Reviews\
  \ published on this site\">\n```\n\n关于路由的更多信息，请查看来自 ASP.NET 团队 Scott Hanselman 编写的以下文章。除了你所看到的从客户端浏览器进行导航外，从服务器端将用户导航到不同的页面也是非常常见的。\n\
  \n## 程序化重定向 (PROGRAMMATIC REDIRECTION)\n\n程序化重定向在 ASP.NET 页面中非常有用且常见。例如，想象一个允许用户向数据库输入评论的页面。一旦用户点击“保存”按钮，评论就会被保存，用户将被带到另一个页面，可以在那里查看整条评论。\n\
  \nASP.NET 支持三种将用户重定向到新页面的方法。前两种 `Response.Redirect` 和 `Response.RedirectPermanent`（在\
  \ ASP.NET 4 中引入）向浏览器发送指令获取新页面。第三种选择 `Server.Transfer` 在服务器端执行。\n\n### 程序化地重定向客户端到不同页面\n\
  \n在每个 ASPX 页面中，你都可以访问一个名为 `Response` 的属性，你之前在保存所选主题 Cookie 时就见过它。`Response` 对象允许你访问与服务器到用户浏览器响应相关的有用属性和方法。其中两个方法是\
  \ `Redirect` 和 `RedirectPermanent` 方法。这些方法向浏览器发送指令请求新页面。\n\n\n\n\n`Redirect` 和 `RedirectPermanent`\
  \ 之间的区别主要在于搜索引擎优化（SEO）。使用 `Redirect` 会告诉客户端页面已*临时*移动。你通常用它来根据某些操作将用户重定向到新页面。例如，在填写联系表单后，你可能想将用户引导到\
  \ `ThankYou.aspx`；该页面会显示一条消息。\n\n`RedirectPermanent` 告诉客户端页面已*永久*移动。如果你想告诉搜索引擎停止查找旧页面并转而索引新页面，这就会非常有用。例如，假设你的网站有一个名为\
  \ `Index.aspx` 的页面，你不再使用它。搜索引擎可能会继续请求此页面。如果你在 `Index.aspx` 的后台代码（Code Behind）中添加以下代码，客户端（包括搜索引擎）将被发送到\
  \ `Default.aspx`。此外，搜索引擎会记录重定向的永久性，并停止请求 `Index.aspx`，转而关注 `Default.aspx`。\n\nVB.NET\n\
  \n```vb\nProtected Sub Page_Load(sender As Object, e As EventArgs) Handles Me.Load\n\
  \  Response.RedirectPermanent(\"Default\")\nEnd Sub\n```\n\nC#\n\n```csharp\nprotected\
  \ void Page_Load(object sender, EventArgs e)\n{\n  Response.RedirectPermanent(\"\
  Default\");\n}\n```\n\n这两个方法都有一个第二个版本（称为*重载*），它接受一个额外的名为 `endResponse` 的布尔参数，当你为该参数传递\
  \ `False`（C# 中为 `false`）时，该参数允许你在重定向操作执行后执行任何剩余代码。这通常不是必要的，因此你最好调用第一个版本，它在默认会结束响应。\n\
  \n很多时候，当你想要将用户发送到不同的页面时，你可能想发送一些额外信息。你可以通过在*查询字符串*中传递信息来实现，查询字符串是地址中页面名之后、用问号分隔的部分。考虑以下\
  \ URL：\n\n[`localhost:49246/Demos/Target?CategoryId=10&From=Home`](http://localhost:49246/Demos/Target?CategoryId=10&From=Home)\n\
  \n整个加粗部分（问号之后）被视为查询字符串。它由多个键值对组成，每对之间之间通过 ampersand（`&`）分隔。在这种情况下，你有两对：`CategoryId`\
  \ 的值为 `10`，`From` 的值为单词 `Home`。在本例中，页面 `Target.aspx`（不带扩展名）能够使用 `Request.QueryString`\
  \ 读取这些值。你将在下一个练习中看到如何使用查询字符串。\n\n> 与 `Response.Redirect` 和 `Response.RedirectPermanent`\
  \ 不同，还有 `Server.Transfer`，它在服务器端重定向到另一个页面。\n\n### 服务器端重定向\n\n如果你想在不修改客户端地址栏的情况下发送不同的页面，服务器端重定向将非常有用。这允许你隐藏页面名和查询字符串的细节，从用户的角度来看，可能会产生更整洁的\
  \ URL。这通常用于所谓的 URL 重写场景，用于创建美化 URL（pretty URLs）。例如，用户可能会请求如下这样的页面：\n\n[`www.domain.com/Cars/Volvo/850/T5/`](http://www.domain.com/Cars/Volvo/850/T5/)\n\
  \n在底层，服务器可能会传输到：\n\n[`www.domain.com/Cars/ShowCar.aspx?Make=643&Model=984&Type=7345`](http://www.domain.com/Cars/ShowCar.aspx?Make=643&Model=984&Type=7345)\n\
  \n显然，第一个 URL 要容易理解且更容易在浏览器中输入。它还允许用户猜测其他符合相同模式的 URL。例如，你有很大机会请求如下这样的页面：\n\n[`www.domain.com/Cars/Volvo/V70/R/`](http://www.domain.com/Cars/Volvo/V70/R/)\n\
  \n并最终显示正确的页面，为你展示 Volvo V70 R。\n\n除了更容易理解之外，服务器端传输还可以稍微加快你的网站速度。你不再是向浏览器发送响应让其获取新页面（这会导致对页面的新请求），而是直接将用户传输到新页面，从而节省一些网络开销。\n\
  \n服务器端传输是通过 `Server` 对象执行的。正如你之前看到的 `Request` 和 `Response` 对象提供有关请求和响应的信息一样，`Server`\
  \ 对象也为你提供运行页面所在的服务器的信息。你可以使用它来获取有关服务器名称、其 IP 地址等信息。它的方法之一是 `Transfer`，它执行服务器端传输。\n\
  \n你只能使用 `Server.Transfer` 重定向到网站内的其他页面。你不能用它将用户发送到不同领域的页面。如果你尝试这样做，ASP.NET 运行时将抛出错误。\n\
  \n要查看 `Response.Redirect` 和 `Server.Transfer` 之间的区别，下面的练习将向你展示如何更改 `Source.aspx`\
  \ 执行 `Server.Transfer` 操作。\n\n> 通过编程方式将用户发送到另一个页面，你已经到了这个关于导航章节的结尾。通过本章展示的概念，你已经拥有了从两端为你的网站创建一个高效高效导航系统所需的所有知识。\n\
  \n### 导航实用提示\n\n以下列表提供了一些实用建议：\n\n- 当你开始构建一个未来可能会增长的网站时，尽早创建一个逻辑结构。\n- 不要将所有文件都放在网站根目录下，而是将逻辑相关的文件放在同一个文件夹中。\n\
  - 限制在 `Menu` 或 `TreeView` 控件中显示的项目和子项目数量。\n- 为了创建可靠的页面结构，你可以在开始构建之前在纸上画出来，或者使用 Visio\
  \ 等站点地图工具。\n- 在创建存储页面的文件夹时，给它们起简短且逻辑性的名称。\n\n### 总结\n\n本章让你熟悉了 ASP.NET 网站中的导航。用户通常不会直接输入网页的地址，因此为他们提供一个清晰直观的导航系统非常重要。\n\
  \n良好的导航系统的关键基础是良好理解 URL 的工作原理。URL 有两种：相对 URL 和绝对 URL。相对 URL 用于指向网站内部的资源。绝对 URL 允许你通过完整位置（包括协议和域名信息）指向资源。当你想要指向自己网站之外的资源时，绝对\
  \ URL 非常有用。\n\n\n\n\n除了内置的导航控件外，你还可以通过程序将用户引导到不同的页面。ASP.NET 支持两种实现此目的的方法：使用 `Response.Redirect`\
  \ 和 `Response.RedirectPermanent` 的客户端，以及使用 `Server.Transfer` 的服务器端。重定向方法指示浏览器从服务器获取新页面，而传输方法则在服务器端执行。\n\
  \n在下一章中，你将学习更多关于 ASP.NET 用户控件的内容，它们允许你在网站的不同页面中复用特定的代码和用户界面元素。\n\n# 本章学习的内容\n\n\
  | 特性 | 说明 |\n| :--- | :--- |\n| `FriendlyUrls` | 一个微软包，你可以将其添加到网站中，以消除 URL 中的 `.aspx`\
  \ 扩展名 |\n| `Menu` 控件 | 一种导航控件，能够以水平或垂直方式、使用下拉菜单或折叠子菜单显示数据（包括来自 `Web.sitemap` 文件的数据）\
  \ |\n| `永久重定向` | 一种机制，用于通知客户端（如搜索引擎）页面已永久移动，告诉客户端停止请求旧资源 |\n| `服务器传输` | 在服务器上发生的到另一个页面的重定向，且不会通知客户端浏览器\
  \ |\n| `SiteMapDataSource` 控件 | `Web.sitemap` 文件与导航控件（如 `TreeView` 和 `Menu`）之间的桥梁\
  \ |\n| `SiteMapPath` 控件 | 一种显示从站点根到当前页面的面包屑的导航控件，允许用户在站点层次结构中向上移动 |\n| `临时重定向` |\
  \ 一种将客户端重定向到新的临时位置的机制 |\n| `TreeView` 控件 | 一种能够以层级方式显示数据（包括来自 `Web.sitemap` 文件的数据）的导航控件\
  \ |\n| `Web.sitemap` | 包含站点逻辑结构的 XML Base 文件。该文件驱动其他导航控件 |\n\n# 第 8 章：用户控件\n\n##\
  \ 你在本章中将学习到：\n\n* 什么是用户控件、它们看起来像什么样以及为什么它们很有用\n* 如何创建用户控件\n* 如何在页面中消费（或使用）用户控件\n\
  * 如何通过向用户控件中添加代码逻辑来提高其实用性\n\n## 本章的 WROX.COM 代码下载\n\n你可以在 [www.wrox.com/go/begaspnet451](http://www.wrox.com/go/begaspnet451)\
  \ 的 Download Code 选项卡找到本章的 [wrox.com] 代码下载。代码位于 Chapter 8 文件夹中。\n\n除了第 6 章讨论的主页、主题和皮肤外，ASP.NET\
  \ 还有另一个允许你创建可复用且保持一致的信息块的功能：用户控件。\n\n用户控件允许你将逻辑相关的内容和控件组合在一起，以便它们在内容页面、主页以及其他用户控件内部被视为单个单元。用户控件实际上是某种微型\
  \ ASPX 页面，因为它有一个标记部分，以及一个可选的后台代码（Code Behind）文件，你可以在其中为控件编写代码。处理用户控件与处理普通的 ASPX\
  \ 页面非常相似，只有少数细微的差别。\n\n你通常将用户控件用于网站中几个页面共享的内容。例如，正如你在本章中看到的，你可以构建一个用户控件来显示在某些（而非所有）页面上显示的横幅。\n\
  \n到本章结束时，你将牢牢理解用户控件是什么以及它们的工作原理，从而能够创建功能性、可复用的内容块。\n\n## 用户控件简介\n\n用户控件非常适合封装你在整个网站中反复使用的标记、控件和代码。在某种程度上，它们看起来有点像服务器控件，因为它们可以包含可以在页面中复用的编程逻辑和呈现内容。然而，你不需要从\
  \ VS 工具箱中拖入现有的控件，而是需要创建自己的用户控件，然后将它们添加到你的 ASPX 页面中，你将在本章稍后学习如何做到这一点。\n\n尽管主页允许你创建在网站所有页面中显示的内容，但某些内容只出现在部分（而非所有）页面上也是常见的。例如，你可能想在几个热门页面上显示横幅，但在首页或其他常用页面上显示。如果没有用户控件，你将向每个需要横幅的页面添加横幅代码（图像、链接等）。当你想更新横幅时（如果你想使用新的图像或链接），你需要修改所有使用该横幅的页面。如果你将横幅移动到用户控件并在内容页面中使用该控件，那么你只需要更改该用户控件，而使用该控件的页面将自动获取更改。这为你提供了一种创建可复用内容的灵活方法。\n\
  \n用户控件与普通 ASPX 页面相比具有以下相似之处：\n\n* 它们有一个标记部分，你可以在其中添加标准标记、服务器控件和纯 HTML。\n* 它们可以使用\
  \ Visual Studio 在标记视图、设计视图和分割视图中创建和设计。\n* 它们可以包含编程逻辑，可以是内联的或通过后台代码文件。\n* 它们允许你访问基于页的信息，如\
  \ `Request.QueryString`。\n* 它们会触发 `Page` 类引发的一些（但不是全部）事件，包括 `Init`、`Load` 和 `PreRender`。\n\
  \n你也应该注意一些不同。用户控件使用 `.ascx` 扩展名而不是普通的 `.aspx` 扩展名。此外，无法在浏览器中请求用户控件。因此，你无法直接链接它们。在站点中使用用户控件的唯一方法将其添加到内容页或主页。\n\
  \n在本章的剩余部分，你将看到如何创建一个显示横幅的用户控件。该用户控件可以水平或垂直的形式呈现，以适应页面中不同大小的区域。在下一节中，你将看到如何创建用户控件。后续章节将介绍如何在\
  \ ASPX 页面中使用控件。\n\n### 创建用户控件\n\n你像添加其他内容类型一样通过“新建项”对话框将用户控件添加到站点。与页面类似，你可以选择编程语言以及是否将代码放在单独的后台代码文件中。图\
  \ 8-1 显示了用户控件的新建项对话框。\n\n![image](img/f275-01.jpg)\n\n**图 8-1：新建项对话框。**\n\n一旦将用户控件添加到站点，它会自动在文档窗口中打开。你可能首先注意到用户控件没有\
  \ `@ Page` 指令，而是有一个 `@ Control` 指令，如下所示后台代码的示例所示：\n\n```xml\n<%@ Control Language=\"\
  C#\" AutoEventWireup=\"true\" CodeFile=\"WebUserControl.ascx.cs\"\n      Inherits=\"\
  WebUserControl\" %>\n```\n\n这标记了文件为用户控件，因此 ASP.NET 运行时知道如何处理它。除此之外，该指令与未使用主页的标准\
  \ ASPX 页面类似。\n\n在 VS 文档窗口中打开用户控件后，你可以在前七章中使用所有的工具来创建页面。你可以使用工具箱在标记和设计视图中拖入控件，使用\
  \ CSS 窗口更改用户控件的外观、感觉和内容，并使用属性网更改用户控件中控件的属性。你还可以编写响应控件引发的事件的代码。\n\n要亲手尝试，下一个练习将向你展示如何创建第一个用户控件。在随后的练习中，你将看到如何在网站的\
  \ ASPX 页面中使用该控件。\n\n\n\n\n\n你刚刚创建的控件显示了一个封装在锚点元素中的单个图像。在下一节中，你将看到如何将该用户控件添加到主页中，使其显示在站点每个页面的\
  \ `Sidebar <aside>` 元素中。本章的后续章节将向你如何添加另一个图像，你可以使用它在单个内容页面中显示水平横幅。\n\n## 向内容页面或主页添加用户控件\n\
  \n要在内容页面、主页或另一个用户控件中使用用户控件，你需要执行两个步骤。首先，你需要通过在希望显示用户控件的页面或控件中添加 `@ Register` 指令来对控件进行**注册\
  \ (register)**。第二步是将用户控件的标签添加到页面中，并可选地对其设置某些属性。\n\n一个典型的用户控件 `@ Register` 指令如下所示：\n\
  \n```\n<%@ Register Src=\"ControlName.ascx\" TagName=\"ControlName\" TagPrefix=\"\
  uc1\" %>\n```\n\n该指令包含三个重要的属性，如下表所示：\n\n| 属性 (ATTRIBUTE) | 描述 (DESCRIPTION) |\n\
  | :--- | :--- |\n| `Src` | 指向你想使用的用户控件。为了方便以后阶段移动页面，你也可以使用波浪号 (`~`) 语法从应用程序根目录指向控件。\
  \ |\n| `TagName` | 页面中控件声明中使用的标签名称。你可以自由命名此名称，但通常它与控件名称相同。 |\n| `TagPrefix` | 包含控件声明中使用的\
  \ `TagName` 的前缀。就像 ASP.NET 使用 `asp` 前缀来引用其控件一样，你需要为自己的用户控件提供一个前缀。默认情况下，此前缀是 `uc`\
  \ 后跟顺序数字，但你也可以根据喜好更改它——例如改为自己的公司名称或自定义缩写。 |\n\n考虑到你在上一个练习中创建的用户控件，你的 `@ Register`\
  \ 指令可能如下：\n\n```\n<%@ Register Src=\"~/Controls/Banner.ascx\" TagName=\"Banner\"\
  \ TagPrefix=\"uc1\" %>\n```\n\n当控件注册后，你可以使用 `TagPrefix:TagName` 结构将其添加到页面中，类似于你将标准服务器控件添加到页面的方式。给定横幅控件的\
  \ `@ Register` 指令，你需要以下标记将控件添加到你的页面中：\n\n```\n<uc1:Banner ID=\"Banner1\" runat=\"\
  server\" />\n```\n\n这是在页面中使用用户控件所需的最小代码。注意，控件是由 `TagPrefix` 和 `TagName` 组合定义的。另外两个属性——`ID`\
  \ 和 `runat` 是大多数 ASP.NET 页面中的控件都具有的标准属性。\n\n幸运的是，在大多数情况下，你不需要自己输入所有的代码。当你从解决方案资源管理器将用户控件拖动到设计视图中的页面时，VS\
  \ 会自动为你添加所需的代码。接下来的练习演示了其工作原理。\n\n虽然波浪号语法让带有用户控件的页面稍微更容易管理，但有一种更简单的方法可以在全范围内注册你的用户控件。\n\
  \n## 用户控件的全站注册\n\n如果你有一个预计在站点的不同内容页面上经常使用的控件（例如前几个示例中的横幅），你可以在 `Web.config` 文件中全局注册该控件。这样它在整个站点中可用，而无需在每个页面都进行注册。下面的练习展示了如何这样做。\n\
  \n尽管用户控件很有用，但它们也有一些你需要注意的注意事项。\n\n## 用户控件的注意事项\n\n早些你已经看到，添加到页面上的 `Panel` 控件的 `ID`\
  \ 被 ASP.NET 运行时修改了。你得到的不是一个 `id` 设置为 `VerticalPanel` 的 `<div>` 元素，而是得到了下面的 `id`：\n\
  \n```\n<div id=\"Banner1_VerticalPanel\">\n  ...\n</div>\n```\n\n在许多情况下，这并不是问题，因为你通常不需要客户端\
  \ `id`。然而，如果你需要从客户端 JavaScript 或 CSS 访问此控件，那么理解为什么这个 `id` 会被修改是非常重要的。\n\n### 理解和管理客户端\
  \ ID\n\n根据设计，HTML 页面中的所有元素都应该是唯一的。给它们赋予 `id` 属性不是强制运行的，但如果你这样做了，就必须确保它们是唯一的。为了避免页面最终\
  \ HTML 代码中的冲突，ASP.NET 通过通过其命名容器的名称作为前缀，确保每个服务器端元素获得一个唯一的客户端 `id`。在命名容器内部，所有元素都应该具有唯一的\
  \ ID。当你尝试添加一个没有唯一服务器 ID 的控件时，VS 会发出警告。例如，当你尝试向用户控件中添加第二个 `id` 为 `VerticalPanel`\
  \ 的面板时，你会收到一个错误。但如果你在同一个页面中放置两个 `Banner` 控件，或者在主页中放一个，在内容页面中放另一个呢？你可能会导致两个 ID 为\
  \ `VerticalPanel` 的客户端 `<div>` 元素。为了避免这个问题，ASP.NET 为每个元素加上其最近命名容器的 ID 前缀。对于用户控件内部的\
  \ `Panel`，这意味着它以 `Banner1` 为前缀，即主页中用户控件的服务器端 ID。\n\n你可以使用控件的 `ClientID` 来获取其完整的客户端\
  \ `id`。下面的代码段显示如何在 `Banner.ascx` 内部的虚构 `Label` 控件上显示 `Panel` 控件的 `ClientID`：\n\n\
  VB.NET\n```vbnet\nLabel1.Text = VerticalPanel.ClientID\n```\n\nC#\n```csharp\nLabel1.Text\
  \ = VerticalPanel.ClientID;\n```\n\n通过此代码，`Label` 控件的 `Text` 将包含 `Banner1_VerticalPanel`，即\
  \ `Panel` 的客户端 ID。将在下一节中使用 `ClientID` 的更实用示例。\n\n有了显式 ID，更容易预测元素的最终 ID，从而更容易在 JavaScript\
  \ 或 CSS 中引用这些元素。ASP.NET 4 引入了一个新选项来影响客户端 ID：`ClientIDMode`。\n\n### 引入 ClientIDMode\n\
  \n从 ASP.NET 4 开始，每个 Web 控件都有 `ClientIDMode` 属性，允许你决定客户端 ID 的组成。你可以将 `ClientIDMode`\
  \ 设置为以下四个值之一：\n\n| 值 (VALUE) | 描述 (DESCRIPTION) |\n| :--- | :--- |\n| `AutoID` |\
  \ 按以前 ASP.NET 版本生成 ID。 |\n| `Inherit` | 使用此设置，控件继承其父控件的 `ClientIDMode` 值。 |\n| `Predictable`\
  \ | 此值主要用于数据绑定控件（在第 13 章及以后讨论），并允许为重复元素创建可预测的客户端 ID。控件的客户端 ID 通过拼接父控件的客户端 ID 和控件自身的服务器\
  \ ID 生成。可以使用 `ClientIDRowSuffix` 属性为每个元素额外扩展 ID。 |\n| `Static` | 使用此值时，客户端 ID 与你设置的服务器\
  \ ID 完全相同。这允许你显式设置客户端 ID，从而提供更大的控制。然而，它并没有阻止你分配相同的值，这可能会导致客户端 HTML 中出现重复 ID。请谨慎使用！\
  \ |\n\n`Page` 类的 `ClientIDMode` 默认值为 `Predictable`，而控件的默认值为 `Inherit`。这意味着控件的默认\
  \ ID 生成模式实际上是 `Predictable`，因为它们从 `Page` 继承了该设置。如果你使用 Visual Studio 将 Web 项目从早期版本转换为\
  \ ASP.NET 4.5.1，Visual Studio 会自动将 `Web.config` 文件中 `<pages>` 元素的站点默认值设置为 `AutoID`\
  \ 以保持后兼容，如下所示：\n\n```xml\n<pages controlRenderingCompatibilityVersion=\"3.5\" clientIDMode=\"\
  AutoID\"/>\n```\n\n\n\n\n目前，Planet Wrox 网站更改任何现有控件的 `client IDs` 并没有带来太大收益，因此目前不需要更改任何一个。然而，在随后的章节中，你将再次使用\
  \ `ClientIDMode` 属性来创建更整洁的客户端 ID。\n\n虽然目前的横幅用户控件可以轻松地在网站的各个位置显示横幅，但它现在并不算智能。它能做的只是显示一张链接图片，仅此而已。为了提高它的可用性，你可以为控件添加行为，使其在网站的不同页面上有不同的表现。\n\
  \n# 为你的用户控件添加逻辑\n\n虽然使用控件处理重复内容已经非常实用了，但当你向它们添加了自定义逻辑时，它们会变得更加有用。通过向用户控件添加 `public`\
  \ 属性或方法，你可以在运行时影响它的行为。当你向用户控件添加一个属性时，该属性将自动出现在你正在操作页面的 `IntelliSense` 和控件的 `Properties\
  \ Grid`（属性网格）中，从而方便从页面等其他文件中更改其行为。\n\n要向用户控件添加属性或方法，你需要将它们添加到控件的 `Code Behind`（后台代码）中。你添加的属性可以采取多种形式。在最简单的情况下，属性看起来和你在第\
  \ 5 章中看到的属性完全一样。对于更高级的场景，你需要添加 `View State properties`，它们能够在回传（postbacks）之间保持状态。在接两个练习中，你将看到如何创建这两种属性。\n\
  \n### 为属性创建自定义数据类型\n\n为了让横幅控件更有用，你可以为它添加第二张图片来显示水平横幅。你还可以给控件添加一个属性，用来决定显示垂直还是水平图片。你可以通过创建一个类型为\
  \ `System.Byte` 的数值属性来实现。例如，`0` 代表垂直，`1` 代表水平。然而，这让你很难记住每个数字代表什么。你可以通过创建一个接受 `Horizontal`\
  \ 和 `Vertical` 值的 `String` 属性让它变得简单一点。但是，字符串无法在编译时进行检查，因此你可能会遇到拼写错误，导致错误或显示错误的横幅。\
  \ .NET Framework 提供了一种很好的解决方法，允许你以 `enumeration`（枚举）的形式创建自己的自己的数据类型。通过枚举（简写为 `enum`），你将数字分配给易于阅读的文本字符串。开发者随后使用这些可读的文本，而在底层使用的是数值。下面的代码段展示了一个\
  \ `enum` 的基本示例（注意 VB 示例没有使用逗号，而在 C# 中逗号是必须的）：\n\n```VB.NET\nPublic Enum Direction\n\
  \  Horizontal\n  Vertical\nEnd Enum\n```\n\n```C#\npublic enum Direction\n{\n  Horizontal,\n\
  \  Vertical\n}\n```\n\n通过这些枚举，编译器会自动为 `Horizontal` 和 `Vertical` 成员分配数值，从 `0` 开始并向上递增。如果你需要，也可以显式地定义数值：\n\
  \n```VB.NET\nPublic Enum Direction\n  Horizontal = 0\n  Vertical = 1\nEnd Enum\n\
  ```\n\n```C#\npublic enum Direction\n{\n  Horizontal = 0,\n  Vertical = 1\n}\n```\n\
  \n枚举的酷之处在于，你可以在代码文件、`Properties Grid` 和 `Properties Grid` 中获得 `IntelliSense` 。通过这些枚举，编译器会自动为\
  \ `Horizontal` 和 `Vertical` 成员分配数值，从 `0` 开始并向上递增。如果你需要，也可以显式地定义数值：\n\n\n\n\n在下一章中，你将创建另一个作为联系表单的用户控件。通过将表单构建为用户控件，你可以轻松从网站的不同位置向用户收集反馈。\n\
  \n### 本章你学到的内容\n\n| 术语 |  |\n| :--- | :--- |\n| **`@ Control`** **指令** | 一组指令，用于将文件标记为用户控件（User\
  \ Control）并定义其行为。 |\n| **`@ Register`** **指令** | 用于注册用户控件，并指向页面、主页和其他用户控件内部的源码。\
  \ |\n| `AlternateText` | 该属性允许你设置图像的 `alt` 属性，当图像无法显示时显示。 |\n| `Machine.config`\
  \ | 的 .NET 配置文件，适用于整个系统，并为网站设置提供默认值。 |\n| `User Control` | 一块内容（存储在具有 `.ascx` 扩展的文件和可选的后台代码\
  \ [Code Behind] 文件中），可以在网站的页面、主页和其他用户控件中重用。 |\n| `View State Properties` | 位于页面、主页或用户控件级别的属性，它们将值存储在\
  \ View State 中，以便在回传（postbacks）后生存。 |\n| `ViewState` 集合 | `ViewState` 集合是 `Page`、`UserControl`\
  \ 和 `MasterPage` 类上的属性，允许你使用 View State 存储和检索值。 |\n\n# 第 9 章：验证用户输入\n\n### 本章你将学习：\n\
  \n* 什么是用户输入以及为什么验证它很重要\n* ASP.NET 4.5.1 提供了哪些可以帮助你验证用户输入的功能\n* 如何使用内置验证控件，以及如何创建开箱不支持的解决方案\n\
  * 如何使用 ASP.NET 发送电子邮件\n* 如何读取文本文件\n\n### 本章 WROX.COM 代码下载\n\n你可以在 [www.wrox.com/go/begaspnet451](http://www.wrox.com/go/begaspnet451)\
  \ 的“下载代码”选项卡上找到本章的 [wrox.com](http://wrox.com) 代码下载。代码位于第 9 章文件夹中。\n\n到目前为止，你一直在创建一个相当静态的网站，通过向网站及其导航菜单添加固定页面来控制布局和内容。但你可以通过引入动态数据让你的网站变得更有吸引力。这些数据通常向两个方向流动：它们要么来自服务器并发送到端用户的浏览器，要么由用户输入并发送到服务器进行处理或存储。\n\
  \n来自服务器的数据可以从许多不同的数据源（包括文件和数据库）检索，并通常使用 ASP.NET 数据控件进行展示。你将在第 12 章及之后看到如何访问数据库。\n\
  \n数据的另一种流向来自用户并发送到服务器。这些信息的范围非常广泛，从简单的页面请求和“联系我们”表单到复杂的购物车场景和类向导式用户界面，但这种数据流的底层原理在所有情况下基本上是相同的——用户在\
  \ Web 表单中输入数据，然后将其提交到服务器。\n\n为了防止系统接收无效数据，在允许系统处理这些数据之前对它们进行验证是非常关重要的。幸运的是，ASP.NET\
  \ 4.5.1 提供了一系列工具，让数据验证成为一项简单的任务。\n\n本章的第一部分将带你了解 ASP.NET 支持的验证控件。你将看到有哪些可用控件、如何使用和自定义它们，以及它们适用于哪些场景。\n\
  \n本章的后半部分将向你展示如何以其他方式处理数据。你将看到如何接收用户提交给网站的信息，然后通过电子邮件发送，以及如何使用文本模板自定义邮件正文。\n\n在本章结束时，你将很好地理解到\
  \ ASP.NET 网站的信息流，以及你手用来验证这些数据的各种技术。\n\n## 从用户处收集数据\n\n互联网上的几乎每个网站都必须处理来自用户的输入。通常，这种输入可以通过多种不同的技术发送到\
  \ Web 服务器，其中 `GET` 和 `POST` 最常见。在第 4 章中，你简要地看了这两种方法的区别，并看到 `GET` 数据附加到请求页面的实际地址，而使用\
  \ `POST` 方法时，数据是在请求体中发送的。\n\n使用 `GET` 方法，你可以通过 `Request` 对象的 `QueryString` 属性来检索提交的数据，正如第\
  \ 7 章讨论的。假设你正在请求页面：\n\n`http://www.PlanetWrox.com/Reviews/ViewDetails.aspx?ReviewId=34&CategoryId=3`\n\
  \n在这个示例中，查询字符串是 `ReviewId=34&CategoryId=3`。问号用于将查询字符串与地址其余部分分开，查询字符串本身由用连符号（`&`）分隔的键值对组成。键和值又由等号（`=`）分隔。要访问查询字符串中的单独项，你可以使用\
  \ `QueryString` 集合的 `Get` 方法：\n\n#### VB.NET\n```vb\n' 将值 34 分给 reviewId 变量\nDim\
  \ reviewId As Integer = Convert.ToInt32(Request.QueryString.Get(\"ReviewId\"))\n\
  ' 将值 3 分给 categoryId 变量\nDim categoryId As Integer = Convert.ToInt32(Request.QueryString.Get(\"\
  CategoryId\"))\n```\n\n#### C#\n```csharp\n// 将值 34 分给 reviewId 变量\nint reviewId\
  \ = Convert.ToInt32(Request.QueryString.Get(\"ReviewId\"))\n// 将值 3 分给 categoryId\
  \ 变量\nint categoryId = Convert.ToInt32(Request.QueryString.Get(\"CategoryId\"))\n\
  ```\n*(注：此处原文示例中代码块内容与描述似乎略有错位/重复，翻译时已根据逻辑进行了修正以对齐描述)*\n\n[/content] 抱歉，在提供的原文中，代码块部分似乎存在排版错误（C#\
