  819. 829\n\n# 指南\n\n1. 封面\n2. 目录\n3. 开始阅读\n\n# 第 1 章：ASP.NET 4.5.1 入门\n\n## 你在本章中将学习：\n\
  \n* 如何获取并安装适用于 Web 的 Visual Studio Express 2013 以及 Visual Studio 2013\n* 如何使用 Visual\
  \ Studio Express 2013 创建你的第一个网站\n* ASP.NET 页面是如何被服务器处理并发送到浏览器的\n* 如何使用和自定义开发环境\n\
  \n自从 2002 年初首次发布 .NET Framework 1.0 以来，微软在 ASP.NET 上投入了大量的努力和开发时间，ASP.NET 是 .NET\
  \ Framework 中允许你构建丰富 Web 应用程序的部分。首次发布意味着对旧微软网站构建技术的根本性改变，那种技术被称为 *Active Server\
  \ Pages*（*ASP*），现在称为*经典 ASP*（classic ASP）。ASP.NET 1.0 以及相关的 Visual Studio .NET 的引入，为开发者提供了相比经典\
  \ ASP 的以下优势：\n\n* 表现层与代码之间的清晰分离。在经典 ASP 中，你的编程逻辑通常散布在页面的 HTML 中，使得后期修改页面变得非常困难。\n\
  * 一个开发模型更接近桌面应用程序的编程方式。这使得许多 Visual Basic 桌面程序员更容易进行转换。\n\n## 微软 Web 版 Visual Studio\n\
  \nMicrosoft Visual Studio (VS) 包含了大量的工具，可以帮助你快速创建复杂的 ASP.NET Web 应用程序。\n\n适用于 Web\
  \ 的 Visual Studio 有两种版本：一种名为 Microsoft Visual Studio Express 2013 for Web 的独立免费版本，另一种是\
  \ Visual Studio 2013 大型开发套件的一部分。\n\n\n\n你可以从微软官方网站 [www.microsoft.com/express/](http://www.microsoft.com/express/)\
  \ 免费获取 Visual Studio Express 2013 for Web。在 Express 首页上，点击 `Downloads` 链接直到进入提供\
  \ Express 产品（包括 `VSEW`）下载的页面。从该页面，你可以以“Web 安装”的形式下载 `VSEW`，这种方式你只需要下载安装程序，而其余文件将在安装过程中下载。请确保从该页面选择的是\
  \ Visual Studio Express 2013 for Web，而不是其他免费的 Express 产品或 Visual Studio 的旧版本。\n\n\
  不要被 Web 安装下载文件的大小误导了，它只有几兆字节。你下载的只是一个安装程序，它将通过互联网下载所需的文件。总下载量取决于你当前的系统，用量通常在 `500MB`\
  \ 到 `1GB` 之间。\n\n如果你想尝试 Visual Studio 2013 的完整版（它也包含 Web 组件），可以在微软网站 [`msdn.microsoft.com/vstudio`](http://msdn.microsoft.com/vstudio)\
  \ 注册免费试用。你可以选择下载一个需要刻录到 `DVD` 的 `ISO` 镜像，或者选择下载 Web 安装程序。\n\n最后，你可以通过 `Microsoft\
  \ Web Platform Installer`（`WPI`）下载 `VSEW`，该程序可以在 [www.microsoft.com/web/platform](http://www.microsoft.com/web/platform)\
  \ 和 [www.asp.net/downloads/](http://www.asp.net/downloads/) 下载。除了 `VSEW`，该工具还能让你访问许多与其他\
  \ Web 开发相关的工具和程序。`WPI` 是一次性获取大量 Web 开发程序和工具的优秀工具。我经常用它来在干净的开发机上快速搭建环境。\n\n### 安装\
  \ Visual Studio Express for Web (VSEW)\n\n安装 `VSEW` 的过程非常直接，尽管过程有些冗长。根据你的安装方法、电脑配置以及互联网连接速度，安装\
  \ `VSEW` 可能需要从 `20 分钟` 到一小时不等，甚至更久。\n\n### 创建你的第一个 ASP.NET 4.5.1 网站\n\n你可能等不及要开始构建你的第一个\
  \ ASP.NET 网站了，因此，下一个 `Try It Out` 练习将直接进入实，向你展示如何构建你的第一个 Web 项目，而不是给你关于 `VS` 中网站的理论概述。随后，在\
  \ `How It Works` 解释及后续章节中，你将深入了解在浏览器中查看 ASP.NET 页面时后台发生了什么。\n\n在接下来的章节中，你将更详细地了解\
  \ ASP.NET 的工作原理。\n\n### ASP.NET 4.5.1 简介\n\n当你在 浏览器中输入如 [www.wrox.com](http://www.wrox.com)\
  \ 的 URL 并按下回车时，浏览器会向该地址的 Web 服务器发送请求。这是通过 `HTTP`（即超文本传输协议）完成的。`HTTP` 是 浏览器和 Web\
  \ 服务器之间通信的协议。当你请求 `URL` 时，你向服务器发送了一个请求。当服务器处于激活状态且请求有效时，服务器会接受请求、对其进行处理，然后将响应发回客户端浏览器。请求与响应之间的关系如图\
  \ 1-8 所示。\n\n![image](img/f009-01.jpg)\n\n**图 1-8**\n\n由于你使用的是 `IIS Express`，服务器和客户端实际上是同一台机器。但在现实世界场景中，你会将网站托管在外部\
  \ Web 服务器上，以便许多不同的客户端可以访问。\n\n对于简单的静态文件（如 `HTML` 文件或图像），Web 服务器只需从本地硬盘中读取文件并将其发送到浏览器。然而，对于动态文件（如\
  \ `ASPX` 页面），这显然是不够的。如果 Web 服务器将 `ASPX` 文件作为文本文件发送给浏览器，你将无法在浏览器中看到当前的日期和时间，而是看到实际的代码（`<%:\
  \ DateTime.Now.ToString() %>`）。因此，Web 服务器不是直接发送文件，而是将请求交给另一个能够处理页面的软件。这是通过称为“应用程序映射”（Application\
  \ Mapping`）或“处理程序映射`Handler Mapping`）的概念实现的，其中文件扩展名（在本例中为 `.aspx`）被映射到一个能够处理它的应用程序。对于\
  \ `.aspx` 页面，请求最终由 `ASP.NET` 运行时处理和执行，它是 Microsoft `.NET Framework` 的一部分，专门为处理 Web\
  \ 请求而设计。\n\n在页面处理期间，有三个主要区域会影响页面最终出现在浏览器中的方式：\n\n* **静态文本**。你放在页面中的任何静态文本（如 `HTML`、`CSS`\
  \ 或 `JavaScript` 代码）都会直接发送到浏览器。你将在本章及后续章节（包括详细介绍 `CSS` 的第 3 章）中学习更多关于 `HTML`、`CSS`\
  \ 和 `JavaScript`（一种用于客户端的编程语言）的知识。\n* **ASP.NET 服务器控件**。这些控件放置在 `ASPX` 页面中，当它们被处理时，会产生插入页面的\
  \ `HTML`。在本章讨论 `HTML` 后，你将学习更多关于服务器控件的知识。\n* **编程代码**。你可以直接在页面嵌入代码（如 Visual Basic\
  \ 或 C#），正如你在之前的 `Try It Out` 中看到的那。此外，你也可以将代码放在单独的文件中。这种文件的正式术语是 Code Beside，但大多数开发者将其称为\
  \ Code Behind（这也是本书使用的术语）。该代码可以由运行时自动执行，也可以根据用户的操作执行。无论如何，代码的执行都将极大影响页面的显示方式，例如访问数据库、进行计算、隐藏或显示控件等。你将在下一章中学习更多关于\
  \ Code Behind 的知识，而 ASP.NET 网页编程将在第 5 章进行详细讨论。\n\n当页面处理完成且页面的所有 `HTML` 都收集完毕后，`HTML`\
  \ 将发回浏览器。浏览器随后读取并解析它，并最终显示页面供你查看。\n\n由于 `HTML` 对于显示网页至关重要，下一节将为你提供 `HTML` 的概述。\n\
  \n### 理解 HTML\n\nHTML 是创建网页的事实标准语言，现有的每个 浏览器都能理解它。自 90 年代初以来，一直是万维网（互联网中处理网页的部分）的驱动力。HTML\
  \ 文档是包含标记、文本以及影响该文本的额外数据的文本文件。HTML 的最新版本是 `HTML5`。尽管 `HTML5` 规范仍在开发中，但许多现代浏览器都支持该规范的重要部分，且这种支持随着这些浏览器的版本发布而增加。尽管并非所有浏览器都完全支持\
  \ `HTML5`，但它真的是基于 HTML 的应用程序的未来，因此我在本书以及 Planet Wrox 演示网站中使用它。不要过分担心浏览器支持问题。所有主流浏览器都支持你在书中使用的所有\
  \ `HTML5` 功能，或者可以通过名为 `Modernizr` 的脚本库轻松模拟支持，你将在书后面看到它。\n\n#### HTML 元素和标签\n\nHTML\
  \ 使用尖括号括起的文本来指示你的内容应如何在浏览器中进行*渲染*（或显示）。带有尖括号的文本被称为*标签*（tag）；一对包含某些文本或其他内容的标签则被称为*元素*（element）。再次查看你在之前的\
  \ `Try It Out` 中打开浏览器页面源代码窗口时看到的 `HTML`：\n\n\n\n\n\n```html\n<h2>Hello World</h2>\n\
  <p>Welcome to Beginning ASP.NET 4.5.1 on 11/16/2013 4:18:17 PM</p>\n```\n\n此示例的第一行包含一个\
  \ `<h2>` 元素，该元素由一个起始标签（`<h2>`）和一个结束标签（`</h2>`）组成。该元素用于表示二级标题（如果你在浏览器的最终源代码中稍微向上滚动，你还会看到一个\
  \ `<h1>` 元素）。注意该元素是如何用一个类似的标签关闭的，但标签中额外多了一个正斜杠（`/`）：`</h2>`。在这些起始和结束标签之间的任何文本都会被视为该元素的一部分，并被渲染为标题。在大多数浏览器中，这意味着文本将以较大的字体渲染。与\
  \ `<h2>` 标签类似的还有用于创建最高六级标题的标签，例如 `<h1>`、`<h3>` 等。\n\n在标题元素下方，你看到一个 `<p>` 元素，它用于表示段落。成对的\
  \ `<p>` 标签内的所有文本都被视为段落的一部分。默认情况下，浏览器在渲染段落时会在底部留出额外的外边距，尽管你可以覆盖这一行为。\n\nHTML 中有许多标签可用，多到无法在此处全部列出。下表列出了一些重要的标签，并描述了如何使用它们。要查看所有\
  \ HTML 元素的完整列表，请访问维护 HTML 标准的组织网站：[www.w3.org/TR/html5/index.html](http://www.w3.org/TR/html5/index.html)。\n\
  \n| 标签 | 描述 | 示例 |\n| :--- | :--- | :--- |\n| `<html>` | 用于标记整个页面的开始和结束。 | ```html\\\
  n<html>\\n  ...所有其他内容都放在这里\\n</html>\\n``` |\n| `<head>` | 用于标记页面的特殊部分，包含有关页的数据，包括标题和对外部资源的引用。该元素的内容不会直接输出到屏幕上，但会影响页的外观和行为，正如你之后看到的。该元素放置在\
  \ `<html>` 元素内部。 | ```html\\n<head>\\n  ...内容放在这里\\n</head>\\n``` |\n| `<title>`\
  \ | 用于定义页面标题。此标题将出现在浏览器的标题栏中。该元素放置在 `<head>` 元素内部。 | ```html\\n<title>\\n  Welcome\
  \ to Planet Wrox 4.5.1\\n</title>\\n``` |\n| `<body>` | 用于标记页面正文的开始和结束。内容是在浏览器中看到的。该元素放置在\
  \ `<html>` 元素内部。 | ```html\\n<body>\\n  ...页面主体放在这里\\n</body>\\n``` |\n| `<header>`\
  \ | 用于标记页面的页眉。此元素以及表中的所有剩余元素都放置在 `<body>` 元素内部。 | ```html\\n<header>\\n  ...<img\
  \ src=\"Logo.png\" ... />\\n</header>\\n``` |\n| `<section>` | 用于标记页面中的不同部分。每个页面可以有多个部分。\
  \ | ```html\\n<section>\\n  ...内容放在这里\\n</section>\\n``` |\n| `<aside>` | 用于标记不是页面核心但作为侧边显示的内容。\
  \ | ```html\\n<aside>\\n  ...<img src=\"Banner.png\" ... />\\n</aside>\\n``` |\n\
  | `<article>` | 用于标记页面中的主要内容主体。 | ```html\\n<article>\\n  ...页面主体内容放在这里\\n</article>\\\
  n``` |\n| `<footer>` | 标记页面的页脚。 | ```html\\n<footer>\\n  ...页脚内容放在这里\\n</footer>\\\
  n``` |\n| `<a>` | 用于将一个网页链接到另一个网页或在页面内创建链接。 | ```html\\n<a href=\"http://www.wrox.com\"\
  >\\n  Visit the Wrox site\\n</a>\\n``` |\n| `<img>` | 用于在页面嵌入图像。 | `<img src=\"\
  Logo.gif\" />` |\n| `<strong>`, `<em>` | 用于以加粗或斜体字体格式化文本。 | ```html\\nThis is <strong>bold\
  \ text</strong>\\nwhile <em>this text is in italic</em>\\n``` |\n| `<form>`, `<input>`,\
  \ `<textarea>`, `<select>` | 用于输入表单，允许用户向服务器提交信息。 | `<input type=\"text\" value=\"\
  Some Text\" />` |\n| `<table>`, `<tr>`, `<th>`, `<td>` | 这些标签用于使用表格创建布局。`<table>`\
  \ 标签定义整个表格，`<th>` 用于标记表头单元格，`<tr>` 和 `<td>` 标签分别定义行和单元格。 | ```html\\n<table>\\n<tr>\\\
  n  <td>This is a Cell in Column 1</td>\\n  <td>This is a Cell in Column 2</td>\\\
  n</tr>\\n</table>\\n``` |\n| `<ul>`, `<ol>`, `<li>` | 这些标签用于创建列表。`<ul>` 和 `<ol>`\
  \ 定义列表（无序或有序），`<li>` 标签用于表示列表项。 | ```html\\n<ul>\\n  <li>First item with bullet</li>\\\
  n  <li>Second item with bullet</li>\\n</ul>\\n<ol>\\n  <li>First item with number</li>\\\
  n  <li>Second item with number</li>\\n</ol>\\n``` |\n| `<span>` | 用于封装文本以进行格式化但不添加换行。它是一个内联元素。\
  \ | `<p>This is <span style=\"color: red;\">text in red</span></p>` |\n| `<div>`\
  \ | 用于其他元素的容器。它作为块级元素工作，在前后都会产生换行。 | ```html\\n<div>This is some text</div>\\n<div>\\\
  n  This is some text\\n  with a break\\n</div>\\n``` |\n| `<audio>`, `<video>`,\
  \ `<source>` | 用于在页面中嵌入音频和视频文件。`<source>` 元素用于定义多种音频和视频资源。 | `<video src=\"Somevideo.mpg\"\
  \ />` |\n\n#### HTML 注释\n\n要在 HTML 中注释某些内容，你需要用注释标签将其封装，如下：\n\n```\n<!-- This is\
  \ a comment -->\n```\n\n注释的代码不会被浏览器处理（因此不可见），但它仍然会被发送到浏览器（因此用户可见）。由于它仍然被发送到浏览器，它会增加页面大小，因此你应该节节使用注释。在后面的章节中，你将看到如何在服务器端注释代码，使其不发送到客户端。\n\
  \n#### HTML5 的规则\n\nHTML5 的规则非常简单，大多数情况下 VS 都会帮助你正确编写，或者向你显示错误列表以及修复建议。在执行规则方面，HTML5\
  \ 实际上比之前的 HTML 版本（称为 XHTML，它是对 HTML 4.01 使用 XML 规则的重新制定）要更加宽松。\n\n#### 关闭你的元素\n\n\
  \n\n\nHTML 中的大多数元素都必须关闭。因此，当你开始使用 `<div>` 标签时，必须在页面的某个地方使用 `</div>`。虽然存在某些例外（例如当\
  \ `<p>` 元素直接紧跟在其他元素之后时不需要），但我更倾向于始终一致地关闭我的标签。对于那些没有单独结束标签的元素也是如此，例如 `<img>` 或 `<br>`（用于换行）。在\
  \ HTML5 中，这些标签可以写成 `self-closing tags`（自闭合标签），其中结束的斜杠被直接嵌入标签本身中，例如 `<img src=\"\
  Logo.gif\" />` 或 `<br />`。\n\n## 属性的使用\n\n当你在标签中编写属性时，你可以使用双引号、单引号或完全不使用引号来包裹其值。例如，在编写\
  \ `<img>` 标签及其 `src` 属性时，你可以像这样写：\n\n```\n<img src=\"Logo.gif\" />\n```\n\n你也可以使用单引号来包含属性值，如下：\n\
  \n```\n<img src='Logo.gif' />\n```\n\n只要在值的两端使用相同类型的引号，这两种方案都有效。对于不包含空格的值，你也可以省略引号：\n\
  \n```\n<input value=yes>\n```\n\n有时也有必要嵌套单引号和双引号。例如，当某些特殊的 ASP.NET 语法要求使用双引号时，你应该使用单引号来包裹属性的值：\n\
  \n```\n<asp:Label ID=\"TitleLabel\" runat=\"server\" Text='<%# Eval(\"Title\") %>'\
  \ />\n```\n\n你将在本书的后续章节中看到这种语法频繁出现。\n\n为了保持一致性，本书在所有最终客户端的 HTML 中尽可能使用双引号，因为这是通常被接受的标准。\n\
  \n## 正确嵌套你的元素\n\n当你编写嵌套元素时，确保先关闭你最后打开的内部元素，然后再关闭外部元素。考虑这个正确的示例，它同时使用粗体和斜体字体格式化一段文本：\n\
  \n```\n<strong><em>This is some formatted text</em></strong>\n```\n\n注意 `<em>` 标签是在\
  \ `<strong>` 标签之前关闭的。交换结束标签的顺序将导致无效的 HTML：\n\n```\n<strong><em>This is some formatted\
  \ text</strong></em>\n```\n\n## 为你的页面添加 DOCTYPE 声明\n\n`DOCTYPE` 为浏览器提供了关于它可以预期的\
  \ HTML 种类的信息。默认情况下，VS 为你的页面添加了 HTML5 的 `DOCTYPE`：\n\n```\n<!DOCTYPE html>\n```\n\
  \n`DOCTYPE` 极大地影响了 Internet Explorer 等浏览器渲染页面的方式，因此如果你在页面上看到奇怪的行为，请检查页面是否具有正确的 `DOCTYPE`。\n\
  \n你可以在 W3C 网站查看完整的 HTML5 语法规则，网址为 `[www.w3.org/TR/html-markup/syntax.html`](http://www.w3.org/TR/html-markup/syntax.html)。\n\
  \n除了 HTML 之外，ASP.NET 网页还可以包含其他标记。大多数页面将包含一个或多个 ASP.NET 服务器控件（Server Controls），以为它们提供额外的功能。下一节将简要介绍这些\
  \ ASP.NET 服务器控件，但你将在第 4 章中深入了解它们。\n\n## 初探 ASP.NET 标记\n\n在某种程度上，ASP.NET 服务器控件的标记与\
  \ HTML 标记相似。它也有标签、元素和属性的概念，并使用与 HTML 相同的角括号和结束标签。一个很大的区别是 ASP.NET 标签以 `asp:` 前缀开头。例如，ASP.NET\
  \ 中的一个按钮看起来像这样：\n\n```\n<asp:Button ID=\"Button1\" runat=\"server\" Text=\"Click\
  \ Me\" />\n```\n\n注意标签是如何通过末尾的斜杠（`/`）进行自闭合的，这消除了输入单独结束标签的需要。尽管如果你愿意，也可以单独的结束标签。\n\
  \n当服务器控件被处理时，它会返回 HTML。因此，在浏览器中渲染时，同一个按钮的代码将如下：\n\n```\n<input type=\"submit\" name=\"\
  Button1\" value=\"Click Me\" id=\"Button1\" />\n```\n\n将服务器控件转换为其 HTML 表示的过程与你之前看到的显示当前日的代码相似。服务器控件在服务器端由\
  \ ASP.NET 处理程序进行处理。这种处理产生 HTML，并将其发送到浏览器，并在那里显示。你将在第 4 章中看到更多内容。\n\n现在你已经理解了 ASP.NET\
  \ 页面及其生成的 HTML 的基础知识，是时候再次查看 VS 了。了解如何使用该应用程序及其许多工具和窗口是构建有趣、美观且功能完备网站的重要一步。\n\n\
  ## IDE 概览\n\nVisual Studio 是目前构建 ASP.NET 网页最广泛、功能最丰富的 `集成开发环境`（`IDE`）。`IDE` 缩写是指构建复杂\
  \ Web 应用所需的所有独立工具集成到单一环境中的方式。与其在文本编辑器中编写代码、在命令行编译代码、在单独的应用程序中编写 HTML 和 CSS 并在另一个程序中管理数据库，VS\
  \ 允许你从同一个环境中执行所有这些任务以及更多任务。除了由于不需要不断切换工具而带来的效率外，这还让学习 VS 的新领域变得容易得多，因为许多内置工具的工作方式是相同的。\n\
  \n### 主开发区域\n\n为了熟悉 VS 中包含的许多工具，请查看`图 1-9`。它显示了你创建网站后相同的屏幕，但现在强调了一些重要的屏幕元素。如果你熟悉以前版本的\
  \ VS，可以跳过此部分，在本书稍后的练习中再次查看。\n\n![image](img/f16-01.jpg)\n\n**图 1-9](#Chapter01._figure9)**\n\
  \n如果你安装了旧版本的 VS，你的界面可能会不同，因为 Visual Studio 2013 能够导入旧版本的设置。\n\n### 选择你的开发配置\n\n\
  由于 VSEW 针对 ASP.NET 初学者以及资深 Web 开发人员，你可以在不同的配置之间选择：`基础设置`、`仅代码`和`专家设置`。在`基础设置`模式下，许多你不常用的菜单项被隐藏或放置在子菜单中。`仅代码`配置非常纯编码阶段，你不需要\
  \ VSEW 的许多设计功能（如设计视图或工具箱）。`专家设置`模式提供了对 VSEW 全功能的访问。你可以使用`工具 ⇒ 设置`菜单来切换设置。本书假设你从一开始就使用`专家设置`。你可能不需要立即使用所有功能，但在本书结束时你会使用其中很多。由于菜单项的位置根据你选择的配置而变化，我决定立即使用`专家设置`，以便引用特定的菜单项或功能。\n\
  \n### 主菜单\n\n在应用程序顶部，Windows 标题栏下方，你可以看到主菜单。此菜单栏包含许多其他 Windows 应用程序中常见的项目，如`文件`、`编辑`和`帮助`菜单，以及\
  \ VS 特有的菜单，如`网站`和`调试`菜单。菜单会根据你正在执行的任务动态变化，因此当你操作程序时，你会看到菜单项出现和消失。你可以使用`帮助 ⇒ 设置帮助偏好`菜单来配置在线和离线帮助。离线帮助需要先安装，而在线帮助需要连接互联网。在最右侧你可以看到一个`登录`链接，允许你使用\
  \ Microsoft 账户登录以实现不同机器之间 VS 设置的同步。\n\n### 通知窗口\n\n\n\n\n\n在应用程序的标题栏中，Windows 关闭、最小化和最大化按钮的左侧，你会看到一个带有小旗帜的图标。点击旗帜图标会调出通知窗口，Visual\
  \ Studio 通过该窗口为你提供重要信息。例如，它会显示新文档内容的可用下载、过期的许可证、产品更新等。根据可用通知的重要性，标题栏中旗帜图标的颜色会发生变化。你也可以通过“视图”菜单访问通知窗口。如果你安装的是\
  \ RTM 版本的 Visual Studio，可能会看到一些现在可以安全安装的更新。\n\n## 工具栏区域\n\n在菜单正下方，你会看到工具栏区域，它能够显示不同的工具栏，让你快速访问\
  \ VS 中最常用的功能。在图 1-9 中，只有两个工具栏是启用状态，但 VS 还带了许多其他工具栏，你可以在特定任务导向的场景中使用它们。当你处理需要特定工具栏的任务时，某些工具栏会出现，但你也可以根据喜好启用或禁用工具栏。要启用或禁用工具栏，请右键点击现有的工具栏或菜单栏，并在出现的菜单中选择相应的工具栏。\n\
  \n## 工具箱\n\n在主界面的左侧，位于 VS 边缘处，你会看到工具箱标签页。点击标签页，工具箱就会展开，让你有机会看到它包含的内容。如果你点击工具箱右上角的小大针图标（或任何其他带有此大针图标的面板），它就会固定在\
  \ IDE 中以保持打开状态。\n\n就如同菜单栏和工具栏一样，工具箱会自动更新，以显示与你正在处理的任务相关的内容。当你编辑标准的 ASPX 页面时，工具箱会显示你的页面可用的许多控件。你只需从工具箱中拖出一个项目，并将其掉到页面上你希望它出现的位置。这些控件将在第\
  \ 4 章中进行详细讨论。注意，每个工具箱类别还包含一个“指针”（Pointer）图标。不过，它本身并不是一个控件。在 Visual Studio 的其他设计器（如\
  \ Win Forms）中，此图标用于退出控件绘制模式，但在 ASP.NET 中它的作用不大。工具箱包含多个类别，你可以根据需要展开或折叠它们，以便更容易找到正确的工具。你还可以重新排列列表中的项目，向工具箱中添加和删除项目，甚至可以向其添加你自己的工具。自定义\
  \ IDE 将在本章稍后部分讨论。\n\n如果工具箱在屏幕上不可见，按 `Ctrl+Alt+X` 打开它，或者选择`视图 ⇒ 工具箱`，前提是你已经在`工具 ⇒\
  \ 设置`菜单中选择了“专家设置”选项。\n\n## 解决方案管理器\n\n在屏幕右侧，你会看到解决方案管理器。解决方案管理器是一个重要的窗口，因为它为你提供了组成你网站的文件概览。解决方案管理器不是将所有文件放在一个大文件夹中，而是允许你将文件存储在单独的文件夹中，创建一个清晰且组织的站点结构。你可以使用解决方案管理器向你的网站添加新文件、使用拖放或剪切粘贴来移动现有文件、重命名文件并从项目中删除它们等。解决方案管理器的大部分功能都隐藏在它的右键菜单中，该菜单会根据你右键点击的项目而变化。\n\
  \n在解决方案器的顶部，你会看到一个小型工具栏，它可以让你快速访问与网站相关的某些功能，包括刷新解决方案管理器窗口、嵌套相关文件的选项，以及一个允许你配置网站的按钮。这些功能大部分将在本书稍后部分讨论。\n\
  \n你可以通过从主菜单选择`视图 ⇒ 解决方案管理器` 或按下 `Ctrl+Alt+L` 来访问解决方案管理器。\n\n## 服务器资源管理器\n\n此窗口隐藏在图\
  \ 1-9 中的解决方案管理器之后，允许你处理数据库和其他服务。\n\n你可以通过选择`视图 ⇒ 服务器资源管理器` 或按下 `Ctrl+Alt+S` 来访问服务器资源管理器。服务器资源管理器将在从第\
  \ 12 章开始的数据库章节中进行详细讨论。\n\n## 团队管理器\n\n此窗口隐藏在图 1-9 中的解决方案管理器之后，用于连接和使用 Team Foundation\
  \ Server (TFS)，TFS 是微软用于源控制、工作项跟踪等的应用程序生命周期管理工具。有关更多信息以及托管版 TFS 的免费帐户，请查看 [`tfs.visualstudio.com`](http://tfs.visualstudio.com)。本书将不会讨论\
  \ TFS 和团队管理器。\n\n## 属性网格\n\n通过属性网格，你可以查看并编辑 Visual Studio 中许多项目的属性，包括解决方案管理器中的文件、网页上的控件、页面本身的属性等。该窗口会不断更新自己以反映所选项目。你可以通过按\
  \ `F4` 快速打开属性网格。你也可以使用相同的快捷键强制属性网格显示所选项目的详细信息。\n\n## 文档窗口\n\n文档窗口是应用程序中间的主要区域。这是大多数操作发生的地方。你可以使用文档窗口处理许多不同的文档格式，包括\
  \ ASPX 和 HTML 文件、CSS 和 JavaScript 文件、VB 和 C# 的代码文件、XML 和文本文件，甚至图像。此外，你还可以使用同一个窗口管理数据库、创建站点的副本、在内置的微浏览器中查看站点中的页面等。\n\
  \n默认情况下，文档窗口是标签页窗口，这意味着它可以承载多个文档，每个文档通过窗口顶部的标签页进行区分。每个标签的右键菜单包含了一些处理文件的有用快捷方式，包括保存和关闭文件，以及在文件资源管理器中打开文件所在的文件夹。\n\
  \n要在文档之间切换，你可以按 `Ctrl+Tab`、点击你想查看的文档标签，或者点击文档窗口右上角（解决方案管理器旁边）的向下箭头，如图 1-9 所示。点击向下箭头会显示打开的文档列表，以便你轻松选择一个。\n\
  \n另一种切换文档的方法是按 `Ctrl+Tab` 然后按住 `Ctrl` 键。在弹出的窗口中，你可以在右侧列选择你想要处理的文档。然后你可以使用光标键在打开的文档列表中移动。这使得选择正确的文件变得异常简单。\n\
  \n在同一个对话框中，你会看到一个包含所有活动工具窗口的列表。点击列表中的一个窗口将使其显示在屏幕上，并在必要时将其移动到其他窗口前面。\n\n要在不打开进行编辑的情况下获取文档的快速预览，只需在解决方案管理器中单击一次你想查看的文件。你可以通过其标签来判断文件是否处于预览模式，该标签固定在标签行的右侧，而不是打开文件的标签左侧。\n\
  \n\n\n\n\n在图 1-9 的文档窗口底部，你会看到三个名为`Design`（设计）、`Split`（分割）和`Source`（源）的按钮。当你处理包含标记（如\
  \ ASPX 页）的文件时，这些按钮会自动出现。它们允许打开页面的设计视图（让你页面在浏览器中的外观）、标记视图（HTML 和其他标记）或同时打开这两者。其工作原理将在第\
  \ 2 章中详细解释，但现在重要的是，你要意识到你可以通过点击这三个按钮之一在标记、分割和设计视图之间切换。标记视图通常也称为源代码视图或代码视图窗口。然而，为了避免与编辑\
  \ Code Behind 文件的编辑器混淆，本书统一使用`Markup View`（标记视图）这一术语。\n\n#### 启动页\n每当你启动 VS 时，文档窗口都会加载启动页。通过启动页，你可以快速创建新项目以及打开现有网站和其他项目。启动页还提供了许多与\
  \ Web 开发相关的新闻和信息的链接。要将你喜欢的项目固定到启动页，请点击项目列表中项目名称左侧的图钉图标。要取消固定项目，右键点击它并选择`Remove from\
  \ List`（从列表中删除）。要重新打开启动页，选择`View ⇒ Start Page`（视图 ⇒ 启动页）。\n\n为了感受如何使用所有窗口，下面的“尝试一下”将向你展示如何构建包含几个\
  \ ASP.NET 控件的简单网页。\n\nVSEW 提供的窗口和工具面板比你看到的多得多。下一节将简要介绍你在构建 ASP.NET 网页时最常用的某些窗口。提到的所有窗口都可以从\
  \ VS 的主 `View`（视图）菜单，或者如果你使用专家设置模式，从 VSEW 的菜单中访问。\n\n### 信息窗口\n除了启动 VS 时默认可见的窗口外，还有许多可用窗口。你将在本书的剩余部分看到其中大部分窗口的运行状态，但有些现在就值得重点介绍。下文讨论的所有窗口都可以从主\
  \ `View` 菜单访问。\n\n#### 错误列表\n`Error List`（错误列表）列出了你的站点当前以某种方式出现问题的项目列表，包括 ASPX 或\
  \ HTML 文件中的错误标记以及 VB 或 C# 文件中的编程错误。此窗口甚至可以显示 XML 和 CSS 文件中的错误。`Error List`以三类类别显示其信息——`Errors`（错误）、`Warnings`（警告）和`Messages`（消息），这表示问题的严重程度。图\
  \ 1-12 显示了一个对 CSS 和 XHTML 有某些问题的页面的错误列表。\n\n![image](img/f022-01.jpg)\n\n**图 1-12**\n\
  \n#### 输出窗口\n当你尝试使用 `Build`（生成）菜单构建站点时，`Output`（输出）窗口会告诉你构建是否成功。如果构建失败（例如是因为编程错误），它会告诉原因。在\
  \ Visual Studio 的商业版本中，`Output`窗口还用于其他信息，包括外部插件程序的状态。构建或编译网站将在本书稍后讨论，包括第 19 章，该章节涉及网站的部署。\n\
  \n#### 查找结果窗口\nVS 的 `Find and Replace`（查找和替换）功能在管理站点内容时是无价的工具。你经常需要替换当前文档甚至整个站点中的某些文本。`Find\
  \ in Files`（在文件中查找，`Ctrl+Shift+F`）和`Replace in Files`（在文件中替换，`Ctrl+Shift+H`）都会将结果输出到\
  \ `Find Results`（查找结果）窗口中，如图 1-13 所示。\n\n![image](img/f023-01.jpg)\n\n**图 1-13**\n\
  \n由于同时打开多个信息窗口可能会占用宝贵的屏幕空间，因此将它们停靠（dock）通常是一个好主意。这样，一次只有一个窗口可见，而你仍然可以快速访问其他窗口。接下来将学习如何自定义\
  \ IDE，包括窗口停靠。\n\n## 自定义 IDE\n尽管 Visual Studio 的标准设置及其工具窗口非常实用，但你很有可能想对其进行自定义。\n\n\
  ### 重新排列窗口\n要将浮动面板恢复到之前的停靠位置，请右键点击其标题栏并选择`Dock`（停靠），或从主菜单选择`Window ⇒ Dock`（窗口 ⇒\
  \ 停靠）。确保不要对像 `Solution Explorer`（解决方案资源管理器）这样的工具窗口选择`Dock as Tabbed`（作为选项页停靠），否则它们将进入主文档窗口。\n\
  \n### 修改工具箱\n你也可以修改 `Toolbox`（工具箱）。默认情况下，项目按字母顺序排序，但你可以使用拖放来重新排序它们。要执行此操作，打开 `Toolbox`（`Ctrl+Alt+X`）并将某个项目（例如\
  \ `Standard` 类别下的 `TextBox`）拖到不同的位置。你也可以通过右键点击项目并从上下文菜单中选择`Delete`（删除）从工具箱中删除项目。不用担心项目永久丢失；你可以通过从同一个菜单中选择`Reset\
  \ Toolbox`（重置工具箱）再次重置工具箱。\n\n\n\n\n\nVisual Studio 在文档窗口的文本显示方面提供了极大的灵活性。你可以更改字体大小、字体颜色甚至文本的背景颜色。可以通过选择`工具\
  \ ⇒ 选项`，然后选择`环境 ⇒ 字体和颜色`来访问`字体`和`颜色`设置。或者，按下 `Ctrl+Q` 将焦点置于 IDE 最顶部的快速启动（Quick Launch）文本框中。然后输入\
  \ `font` 并按 `Enter` 键，选择高亮的项目 `环境 — 字体和颜色`。快速启动是访问选项和菜单命令等功能的绝佳工具。有关快速启动的更多信息，请查看：[`bit.ly/1eljcko`](http://bit.ly/1eljcko)。\n\
  \n我喜欢在文档窗口中自定义的一个设置是制表大小，它控制缩进代码时插入的空格数。要更改制表大小，请选择`工具 ⇒ 选项`，然后在`文本编辑器`下选择`所有语言\
  \ ⇒ 制表符`。我通常将`制表`和`缩进大小`设置为`2` 个空格，保持`制表符`面板中的其他设置不变。另一个我喜欢自定义的设置是 HTML 元素前后的换行次数。选项窗口让你对此拥有完全控制：选择`文本编辑器\
  \ ⇒ HTML (Web 表单) ⇒ 格式`，然后点击`特定标签选项`。在左侧列表中，你可以选择一个标签，然后通过右侧的设置控制该标签的格式。预览框让你轻松地看到各种设置是如何更改格式的。请注意，Web\
  \ 表单在选项对话框中有它自己的类别，因为它在底层使用的 HTML 编辑器与 Visual Studio 中找到的其他基于 HTML 的编辑器不同。\n\n如果你希望在文档窗口的行边（gutter）中显示行号，请选择`工具\
  \ ⇒ 选项 ⇒ 文本编辑器 ⇒ 所有语言`并勾选`行号`复选框。\n\n除了`制表大小`设置为 `2` 以及几个 HTML 元素周围的换行次数外，书中的所有截图展示的都是\
  \ `VSEW` 的默认设置。\n\n### 自定义工具栏\n\n你可以通过三种方式自定义工具栏：你可以显示或隐藏内置工具栏，可以在现有工具栏上添加和删除按钮，还可以创建带有你经常使用的按钮的自定义工具栏。\n\
  \n#### 启用和禁用工具栏\n\n你可以通过右键点击任何现有工具栏或菜单栏，然后从列表中选择相应的项目来禁用和启用现有工具栏。一旦工具栏显示，你可以使用其左侧的拖动柄将其拖动到工具栏区域的新位置。\n\
  \n#### 编辑现有工具栏\n\n如果你觉得现有的工具栏缺少了重要按钮，或者包含了你很少使用的按钮，你可以自定义工具栏上的按钮。要执行此操作，请右键点击任何工具栏或菜单栏，选择`自定义`，切换到`命令`选项卡，并在`工具栏`下拉菜单中选择你想要修改的工具栏。通过右侧的命令按钮，你可以添加新命令、删除现有命令，或更改它们的顺序。\n\
  \n#### 创建你自己的工具栏\n\n如果你想将一些经常使用的功能分组，创建你自己的工具栏将很有用。要创建新工具栏，请按照前一节介绍的方法打开`自定义`窗口。点击`新建`按钮并为工具栏输入名称。然后切换到`命令`选项卡，像处理现有工具栏一样修改你的工具栏。\n\
  \n### 自定义快捷键\n\n许多开发者喜欢更改的另一个设置是快捷键。快捷键是节省时间的极佳方法，因为它们让你通过简单的键盘命令完成任务，而无需去拿鼠标并在菜单中选择相应项目。要更改快捷键，请选择`工具\
  \ ⇒ 选项`，展开`环境`并点击`键盘`。或者，按下 `Ctrl+Q`，输入 `keyboard` 并按`回车`。在命令列表中找到你想要更改快捷键的命令。由于此列表包含许多项目，你可以通过输入命令的几个字母来过滤列表。例如，在`显示包含以下内容的命令`（Show\
  \ Commands Containing） 字段中输入 `print`，即可获得所有与打印相关的命令列表。\n\n接下来，在`按快捷键`（Press Shortcut\
  \ Keys） 字段中，输入新快捷键并点击`分配`。Visual Studio 允许为单个命令输入双重快捷键。例如，你可以将`关闭所有文档`命令绑定到 `Ctrl+K,\
  \ Ctrl+O` 命令。要执行此命令，你需要连续按下这两个组合键。虽然双重快捷键看起来可能多此一举，但它极地增加了可用快捷键的数量。\n\n### 重置你的更改\n\
  \n如果你觉得自己在尝试各种自定义选项时把 Visual Studio 搞乱了，请担心。你有许多方法可以将 Visual Studio 恢复到之前的状态。\n\n\
  #### 重置窗口布局\n\n从`窗口`菜单可以访问`重置窗口布局`命令，它可以将所有窗口重置为首次启动 Visual Studio 时的位置。如果你弄乱了太多窗口导致\
  \ IDE 变得杂乱，此命令非常有用。\n\n#### 重置工具箱\n\n如果你不小心地从`工具箱`中删除了某个项，甚至删除了整个一个选项卡，可以通过右键点击`工具箱`并选择`重置工具箱`来将`工具箱`重置为原始状态。在使用此命令之前你需要深思，因为它还会删除你所有的自定义代码段。\n\
  \n#### 重置所有设置\n\n如果你跟从了之前的“试一试”练习，然后开始尝试自定义功能，那么你的 IDE 现在可能处于两种状态之一：它要么看起来完全符合你的要求，要么看起来像一团糟。在后一种情况下，知道很容易清理这些混乱是好的。\n\
  \n要完全恢复所有 Visual Studio 设置到最初安装后的状态，请选择`工具 ⇒ 设置 ⇒ 导入和导出设置`或`工具 ⇒ 导入和导出设置`（取决于你使用的版本）。然后选择`重置所有设置`选项并点击`下一步`。如果你愿意，可以创建现有设置的备份；否则选择`否，仅重置设置`。你会看到另一个屏幕，让你从多个设置集中进行选择`专家设置`或`Web\
  \ 开发`，因为这些选项为你提供了跟随本书所需的所有功能。最后，点击`完成`。\n\n\n\n\n\n*   可以在网站提供的不同图形主题之间切换，让你有机会在不改变内容的情况下更改网站的外观和感受。\n\
  *   能够存储音乐偏好，这些偏好会影响用户在网站上看到的信息。\n*   注册用户可以访问额外功能。\n\n网站允许管理员（即你，网站所有者）执行以下操作：\n\
  \n*   添加和维护评论。\n*   管理系统中的不同音乐流。\n*   管理访问者创建的相册。\n\n图 1-15 显示了 Planet Wrox 首页。\n\
  \n![image](img/f030-01.jpg)\n\n**图 1-15**\n\n图 1-16 显示了 Planet Wrox 的另一个页面，但应用了不同的主题。该页面允许用户输入个人信息并就他们喜爱的音乐流指定偏好。\n\
  \n![image](img/f030-02.jpg)\n\n**图 1-16**\n\n你可以在 [www.PlanetWrox.com](http://www.PlanetWrox.com)\
  \ 找到该网站的在线运行示例。在那里你可以从终端用户的角度尝试该网站。\n\n你还可以从 Wrox 网站的 [www.wrox.com/go/begaspnet451](http://www.wrox.com/go/begaspnet451)\
  \ 下载示例应用程序以及书中所有其他示例的源码。\n\n读完这本书后，你将能够在其他网站中构建示例网站中的所有功能（希望甚至更多）。如果这听起来有很多非常复杂的事情，请不要担心。我将一步步引导你，从应用程序的开始一直带你直到到最后一个功能。只要你在这个过程中保持乐趣，我信你一定能完成目标。\n\
  \n## VISUAL STUDIO 实用提示\n\n书中的大多数章节末尾都有一个简短的实用提示部分。这些提示是无法放入文中任何地方的技巧，或者是鼓励你进一步探索或测试某些事物。有时它们初看起来可能与主题无关或难以理解，但你会发现，当你阅读完这本书并回顾之前章节的提示时，事情就会变得有意义了。如果你第一次看到某些内容没有完全理解，请不要担心。给这个想法一些思考时间，几天后再次查看该主题。希望通过让想法稍微沉淀，事情会自动变得更加清晰。这不仅适用于实用提示部分，也适用于整本书。\n\
  \n*   在进入下一章节之前，多玩一玩 Visual Studio。为你的网站添加几个页面，从工具箱拖放一些控件到你的页面上，并在浏览器中查看它们。这样，当你开始下一个章节时，你将对这些工具和许多可用控件有更好的理解。\n\
  *   熟悉调整 Visual Studio IDE 的许多选项。在构建网站时，你大部分时间都在这个 IDE 中度，因此尽可能按照你的喜好对其进行调整是合理的。不要害怕弄乱它；你可以随时恢复到之前的设置。\n\
  *   花时间浏览 Visual Studio 选项（Options）对话框中的设置（通过 `Tools ⇒ Options` 菜单访问）。许多设置都是一言自明的的，对于进一步微调\
  \ IDE 非常有帮助。\n\n## 总结\n\n本章涵盖了许多重要内容，帮助你开始 ASP.NET 4.5.1 和 Visual Studio 的学习。它从简要介绍了微软\
  \ .NET Framework 总体以及 ASP.NET 的历史开始。\n\n然后你学习了如何获取和安装 Visual Studio，这是创建 ASP.NET\
  \ 4.5.1 网页最全面、多通的工具。为了让你能够有效地使用它，本章向你展示了如何使用和自定义 IDE 主要功能。在随后的章节中，你将使用并扩展这些知识来处理\
  \ VS 中的的许多工具。\n\n理解 Visual Studio 中的页面是如何进入你的网络浏览器的重要的。了解提供请求的 Web 服务器以及页面如何被处理以在浏览器中交付最终的\
  \ HTML，对于理解 ASP.NET 至关重要。本章简要介绍了网页被请求并提供给浏览器的方式。\n\n在下一章中，你将获得关于创建网站的更详细的解释。\n\n\
