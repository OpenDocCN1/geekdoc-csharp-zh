    # Chapter 5: Methods: Encapsulating Reusable Code


    In this chapter, we will explore methods in C#. Methods allow us to encapsulate
    blocks of code into reusable units, providing a way to organize and modularize
    our programs. We will learn how to define methods, pass arguments, return values,
    and leverage their power to create efficient and maintainable code.


    # 5.1 Introduction to Methods


    Methods are blocks of code that perform specific tasks or actions. They provide
    a way to encapsulate functionality, making our programs more organized and easier
    to understand. Methods can accept input parameters, perform operations, and optionally
    return values.


    # 5.2 Method Declaration and Syntax


    To declare a method in C#, we need to specify its accessibility, return type,
    name, and any input parameters. Here''s the general syntax:


    ```csharp


    accessibility return_type MethodName(parameters)


    {


    // Method body


    }


    ```


    - `accessibility` determines the visibility of the method (e.g., `public`, `private`,
    etc.).


    - `return_type` represents the type of value the method returns (use `void` if
    no value is returned).


    - `MethodName` is the name of the method, which should follow naming conventions.


    - `parameters` specify the input values required by the method (optional).


    # 5.3 Void Methods: Performing Actions


    A void method is a method that does not return any value. It is used when we want
    the method to perform a specific action without returning a result. Here''s an
    example:


    ```csharp


    public void SayHello()


    {


    Console.WriteLine("Hello!");


    }


    ```


    In this example, we declared a void method named `SayHello()` that simply outputs
    "Hello!" to the console. This method does not return any value.


    To call a void method, we use its name followed by parentheses. Here''s an example:


    ```csharp


    SayHello();


    ```


    By calling the `SayHello()` method, the "Hello!" message will be displayed in
    the console.


    # 5.4 Methods with Parameters: Accepting Input


    Methods can accept input parameters, allowing us to pass data into the method
    for processing. Parameters act as variables within the method, and their values
    are determined when the method is called. Here''s an example:


    ```csharp


    public void GreetUser(string name)


    {


    Console.WriteLine("Hello, " + name + "!");


    }


    ```


    In this example, we defined a void method named `GreetUser()` that accepts a string
    parameter named `name`. The method greets the user by concatenating the provided
    name with a greeting message.


    To call a method with parameters, we pass the corresponding values when making
    the method call. Here''s an example:


    ```csharp


    GreetUser("John");


    ```


    By calling the `GreetUser()` method with the argument "John", the method will
    output "Hello, John!".


    # 5.5 Methods with Return Values: Producing Results


    Methods can also return values using the `return` keyword. The return type of
    the method should match the type of the value being returned. Here''s an example:


    ```csharp


    public int AddNumbers(int a, int b)


    {


    int sum = a + b;


    return sum;


    }


    ```


    In this example, we defined a method named `AddNumbers()` that accepts two integer
    parameters, `a` and `b`. The method adds the two numbers together and returns
    the sum.


    To utilize the return value of a method, we can assign it to a variable or use
    it directly. Here''s an example:


    ```csharp


    int result = AddNumbers(5, 3);


    Console.WriteLine(result); // Output: 8


    ```


    By calling the `AddNumbers()` method with the arguments 5 and 3, the returned
    sum of 8 is assigned to the `result` variable, which is then printed to the console.


    # 5.6 Method Overloading: Multiple Signatures


    In C#, we can have multiple methods with the same name but different parameter
    lists. This is known as method overloading. Overloading allows us to define methods
    that perform similar operations but with different input parameters. Here''s an
    example:


    ```csharp


    public void GreetUser(string name)


    {


    Console.WriteLine("Hello, " + name + "!");


    }


    public void GreetUser(string firstName, string lastName)


    {


    Console.WriteLine("Hello, " + firstName + " " + lastName + "!");


    }


    ```


    In this example, we have two `GreetUser()` methods, one accepting a single string
    parameter for the name and another accepting two string parameters for the first
    name and last name. Depending on the number and types of arguments provided, the
    appropriate method will be called.


    ```csharp


    GreetUser("John"); // Output: Hello, John!


    GreetUser("John", "Doe"); // Output: Hello, John Doe!


    ```


    By calling the `GreetUser()` method with different arguments, we can tailor the
    greeting accordingly.


    5.7 Summary


    In this chapter, we explored methods in C#. We learned how to declare methods,
    specify return types, pass parameters, and utilize return values. We saw how void
    methods perform actions, methods with parameters accept input, and methods with
    return values produce results. We also discussed method overloading, which allows
    us to have multiple methods with the same name but different parameter lists.


    Methods are a powerful tool for organizing and encapsulating code, promoting reusability
    and modularity. By utilizing methods effectively, we can create more maintainable
    and efficient programs. In the next chapter, we will delve into object-oriented
    programming concepts, including classes and objects, which form the foundation
    of C# programming.


    # Chapter 6: Object-Oriented Programming: Classes and Objects


    In this chapter, we will explore the fundamental concepts of object-oriented programming
    (OOP) in C#. We will learn about classes, objects, properties, and methods, which
    are the building blocks of OOP. Understanding these concepts will enable us to
    create robust and scalable applications.


    # 6.1 Introduction to Object-Oriented Programming


    Object-Oriented Programming (OOP) is a programming paradigm that focuses on organizing
    code into reusable and self-contained objects. An object is an instance of a class,
    which represents a blueprint or template for creating objects. OOP provides concepts
    such as encapsulation, inheritance, and polymorphism, allowing us to create modular
    and maintainable code.


    # 6.2 Classes: Blueprint for Objects


    A class is a user-defined data type that encapsulates data and behavior into a
    single unit. It serves as a blueprint or template for creating objects. In C#,
    we define classes using the `class` keyword. Here''s an example:


    ```csharp


    public class Person


    {


    // Class members go here


    }


    ```


    In this example, we defined a class named `Person`. The class encapsulates the
    characteristics and behaviors of a person.


    # 6.3 Objects: Instances of Classes


    An object is an instance of a class. It represents a specific entity or concept.
    We create objects based on the blueprint defined by a class. Here''s an example:


    ```csharp


    Person person1 = new Person();


    Person person2 = new Person();


    ```


    In this example, we created two objects, `person1` and `person2`, based on the
    `Person` class. Each object has its own set of data and can perform actions defined
    by the class.


    # 6.4 Properties: Accessing and Modifying Data


    Properties are members of a class that allow us to access and modify its data.
    They provide a way to encapsulate data and control its accessibility. Properties
    have a getter and optionally a setter to retrieve and assign values, respectively.
