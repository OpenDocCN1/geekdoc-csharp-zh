    # 第 4 章：控制流与循环


    在本章中，我们将探索 Lua 中的控制流结构，这些结构使我们能够根据某些条件做出决策并重复代码执行。理解控制流对于编写动态和交互式的 Lua 程序至关重要。让我们开始吧！


    ## 条件语句


    条件语句允许我们根据指定的条件执行不同的代码块。在 Lua 中，我们使用 `if`、`elseif` 和 `else` 关键字创建条件语句。这里有一个示例：


    ```lua

    local age = 18

    if age < 18 then

    print("你的年龄还不能投票.")

    elseif age >= 18 and age < 21 then

    print("你可以投票但不能喝酒。")

    else

    print("你可以投票也可以喝酒。")

    end

    ```


    在上面的代码段中，我们使用 `if` 语句检查 `age` 变量的值。如果条件为真，则执行相应的代码块。


    ## 逻辑运算符


    Lua 提供了逻辑运算符来组合更复杂的表达式：


    - `and` 运算符：当两个条件都为真时返回真。

    - `or` 运算符：当至少一个条件为真时返回真。

    - `not` 运算符：反转布尔值。


    这里是一个使用逻辑运算符的示例：


    ```lua

    local score = 80

    if score >= 60 and score <= 100 then

    print("你通过了考试!")

    elseif score >= 40 then

    print("你及格了。")

    else

    print("你没及格。")

    end

    ```


    ## 循环


    循环允许我们重复执行代码块。Lua 提供了两种循环：


    ### while 循环


    `while` 循环只要指定的条件为真就会一直执行代码。这里有一个示例：


    ```lua

    local count = 1

    while count <= 5 do

    print("计数:", count)

    count = count + 1

    end

    ```


    ### for 循环


    `for` 循环允许我们遍历范围。常见的用法有两种：


    1. 遍历数字：


    ```lua

    for i = 1, 5 do

    print("数字:", i)

    end

    ```


    2. 遍历表格元素：


    ```lua

    local fruits = {"apple", "banana", "orange"}

    for index, fruit in ipairs(fruits) do

    print("水果:", fruit)

    end

    ```


    ## 控制流关键字


    Lua 提供了控制流关键字来修改执行流：


    - `break` 关键字：立即终止循环。

    - `continue` 关键字：跳过当前迭代的剩余部分（注意：标准 Lua 并不原生支持 continue，通常通过逻辑实现）。


