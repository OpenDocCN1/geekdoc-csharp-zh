  trans: "\n\n## 继承\n\n1. **代码复用**：继承允许我们通过继承基类的属性和方法来复用代码。这减少了代码重复并提升了模块化。\n2. **可扩展性**：派生类可以添加新成员或覆盖现有的成员，允许我们根据特定需求扩展基类的功能。\n\
    3. **多态**：继承实现了多态，允许派生类对象被视为其基类对象。这增强了灵活性和抽象性。\n4. **模块化与可维护性**：继承有助于将代码组织成逻辑单元，使其更易理解、维护和更新。\n\
    \n## 7.7 总结\n\n在本章中，我们探索了 `C#` 中的继承概念及其在面向对象编程中的作用。我们学习了基类、派生类和继承层次结构。我们看到了派生类如何继承并可以修改其基类的成员。我们还讨论了继承的优势，包括代码复用、可扩展性、多态、模块化和可维护性。\n\
    \n通过有效使用继承，我们可以创建出更高效、可扩展且可重用的代码。在下一章中，我们将深入探讨另一个重要的 OOP 概念：多态，并探索它如何增强程序的灵活性和模块化。\n\
    \n# 第 8 章：多态：灵活性与模块化\n\n在本章中，我们将探索 `C#` 中的多态概念。多态允许不同类型的对象被视为共同基类型的对象。通过允许代码在更高抽象层次的对象上运行，它增强了程序的灵活性和模块化。\n\
    \n## 8.1 多态简介\n\n多态是面向对象编程的一项关键特性，允许不同类型的对象相互使用。它基于“一种接口，多种实现”的原则。多态促进了代码复用、扩展性和灵活性。\n\
    \n## 8.2 基类作为引用类型\n\n多态依赖于使用基类作为引用类型来引用不同派生类的对象。这允许我们以统一的方式处理不同类型的对象。考虑以下示例：\n\
    \n```csharp\npublic class Animal\n{\n    public virtual void MakeSound()\n   \
    \ {\n        Console.WriteLine(\"Animal makes a sound\");\n    }\n}\n\npublic\
    \ class Dog : Animal\n{\n    public override void MakeSound()\n    {\n       \
    \ Console.WriteLine(\"Dog barks\");\n    }\n}\n\npublic class Cat : Animal\n{\n\
    \    public override void MakeSound()\n    {\n        Console.WriteLine(\"Cat\
    \ meows\");\n    }\n}\n\nAnimal animal1 = new Dog();\nAnimal animal2 = new Cat();\n\
    ```\n\n在这个示例中，我们有一个基类 `Animal` 和两个派生类 `Dog` 和 `Cat`。我们创建了 `Dog` 和 `Cat` 的对象，但将它们赋值给\
    \ `Animal` 类型的变量。这是可能的，因为派生类对象可以隐式转换为其基类类型。\n\n## 8.3 多态行为\n\n通过使用基类引用类型，我们可以调用基类中定义的方法或访问属性。然而，如果方法在派生类中被覆盖，则覆盖实现将在运行时执行。考虑以下示例：\n\
    \n```csharp\nanimal1.MakeSound(); // 输出: Dog barks\nanimal2.MakeSound(); // 输出:\
    \ Cat meows\n```\n\n在这个示例中，`MakeSound()` 方法在 `Dog` 和 `Cat` 类中被重写。当我们使用基类引用调用该方法时，会执行派生类中相应的覆盖实现。这被称为多态行为。\n\
    \n## 8.4 多态与方法重写\n\n多态与方法重写结合工作，重写允许派生类为基类中定义的方法提供它们自己的实现。方法重写实现了动态分发，即实际对象类型在运行时确定适当的方法实现。\n\
    \n要重写一个方法，我们在派生类中使用 `override` 关键字。基类中的方法必须声明为 `virtual` 或 `abstract`。考虑以下示例：\n\
    \n```csharp\npublic class Shape\n{\n    public virtual void Draw()\n    {\n  \
    \      Console.WriteLine(\"Drawing a shape\");\n    }\n}\n\npublic class Circle\
    \ : Shape\n{\n    public override void Draw()\n    {\n        Console.WriteLine(\"\
    Drawing a circle\");\n    }\n}\n\npublic class Rectangle : Shape\n{\n    public\
    \ override void Draw()\n    {\n        Console.WriteLine(\"Drawing a rectangle\"\
    );\n    }\n}\n\nShape shape1 = new Circle();\nShape shape2 = new Rectangle();\n\
    shape1.Draw(); // 输出: Drawing a circle\nshape2.Draw(); // 输出: Drawing a rectangle\n\
    ```\n\n## 8.5 总结\n\n多态是面向对象编程中一个强大的概念，增强了我们代码的灵活性和模块化。通过将不同类型的对象视为共同基类型的对象，我们可以编写可以与多种实现协作的代码，而无需进行显式的类型检查。\n\
    \n在本章中，我们探索了 `C#` 中的多态，以及它如何允许我们利用基类中定义的共同行为，同时允许派生类提供它们自己的实现。我们看到了如何通过方法重写实现多态行为，以及它如何促进运行时的动态分发。\n\
    \n多态使我们能够编写出更适应变化的代码，促进代码复用，并通过允许系统由可交换的部分组成来简化复杂系统。它在创建模块化、可维护和可扩展的应用方面起着关重要的作用。\n\
    \n在下一章中，我们将深入另一个重要主题：封装。封装允许我们隐藏类的内部细节，并对其成员提供受控制的访问。\n\n# 第 9 章：封装：保护数据和行为\n\n\
    在本章中，我们将探索 `C#` 中的封装概念。封装是面向对象编程的基本原则之一，允许我们将数据和行为封装进一个称为类的单一单元中。它通过方法提供受控制的访问。\n\
    \n## 9.1 封装简介\n\n封装是隐藏类内部细节并对其成员提供受控制访问的过程。它允许我们在类周围创建一个边界，保护其数据和行为免受未经授权的访问和修改。\n\
    \n将数据和行为封装在一起，我们可以创建更健壮、更易维护的代码。封装促进了代码重用、模块化和数据完整性。\n\n## 9.2 访问修饰符\n\n`C#` 中的访问修饰符控制类型和成员的可见性和访问权限。它们通过定义对类成员的访问级别在封装中起着至关重要的作用。\n\
    \n`C#` 中的四个访问修饰符是：\n\n- `public`: 代码均可访问。\n- `private`: 方法仅在包含类内可见。\n- `protected`:\
    \ 方法在包含类及其派生类中可见。\n- `internal`: 方法在同一程序集（项目）内可见。\n\n通过有效使用访问修饰符，我们可以强制封装并控制类成员的可见性。\n\
    \n## 9.3 属性\n\n属性是 `C#` 中的一种机制，为类的封装数据提供受控制的访问。它们允许我们定义 getter 和 setter 方法来访问和修改数据。\n\
    \n属性封装了底层数据并提供了一个抽象层，允许我们执行验证、进行计算并控制对数据的访问。\n\n这是一个带有属性的类的示例：\n\n"
