    # Chapter 4: Control Flow and Loops


    In this chapter, we will explore control flow structures in Lua, which enable
    us to make decisions and repeat code execution based on certain conditions. Understanding
    control flow is crucial for writing dynamic and interactive Lua programs. Let''s
    dive in!


    ## Conditional Statements


    Conditional statements allow us to execute different blocks of code based on specified
    conditions. In Lua, we use the `if`, `elseif`, and `else` keywords to create conditional
    statements. Here''s an example:


    ```lua

    local age = 18

    if age < 18 then

    print("You are not old enough to vote.")

    elseif age >= 18 and age < 21 then

    print("You can vote but cannot drink alcohol.")

    else

    print("You can vote and drink alcohol.")

    end

    ```


    In the above code snippet, we check the value of the `age` variable using the
    `if` statement. If the condition is true, the corresponding block of code is executed.
    If not, Lua moves to the `elseif` statement to check the next condition. If none
    of the conditions are true, the `else` block is executed. Finally, the `end` keyword
    signifies the end of the conditional statement.


    ## Logical Operators


    Lua provides logical operators to combine conditions and create more complex expressions:


    - The `and` operator returns true if both conditions are true.

    - The `or` operator returns true if at least one of the conditions is true.

    - The `not` operator negates the result of a condition.


    Here''s an example that demonstrates the usage of logical operators:


    ```lua

    local score = 80

    local hasPassedExam = score >= 50 and score <= 100

    if hasPassedExam then

    print("Congratulations! You passed the exam.")

    else

    print("Unfortunately, you did not pass the exam.")

    end

    ```


    ## Loops


    Loops allow us to repeatedly execute a block of code until a specified condition
    is met. Lua provides two types of loops: `while` loops and `for` loops.


    ### while Loops


    A `while` loop continues executing the block of code as long as the specified
    condition remains true. Here''s an example:


    ```lua

    local count = 1

    while count <= 5 do

    print("Count:", count)

    count = count + 1

    end

    ```


    In the above code snippet, the `while` loop prints the value of the `count` variable
    and increments it by 1 in each iteration until `count` becomes greater than 5.


    ### for Loops


    A `for` loop allows us to iterate over a range of values. It provides more control
    over the loop execution. Here are two common ways to use `for` loops in Lua:


    1. Iterating over a range of numbers:


    ```lua

    for i = 1, 5 do

    print("Number:", i)

    end

    ```


    This `for` loop iterates over the numbers from 1 to 5, and the variable `i` takes
    each value in the specified range.


    2. Iterating over elements in a table:


    ```lua

    local fruits = {"apple", "banana", "orange"}

    for index, fruit in ipairs(fruits) do

    print("Fruit:", fruit)

    end

    ```


    In this example, the `for` loop iterates over the elements of the `fruits` table.
    The `index` variable holds the current index, and the `fruit` variable holds the
    value.


    ## Control Flow Keywords


    Lua provides control flow keywords to modify the flow of execution within loops
    and conditional statements:


    - The `break` keyword terminates the loop immediately.

    - The `continue` keyword skips the remaining code within the loop and moves to
    the next iteration.


    These keywords provide flexibility and control over the execution.


    ## Wrapping Up


    In this chapter, we explored control flow structures, including conditional statements
    and loops. We learned how to use `if` statements to make decisions based on conditions
    and how to create `while` and `for` loops to repeat code. We also discussed logical
    operators and control flow keywords.


    # Chapter 5: Functions and Modules


    In this chapter, we will explore functions and modules in Lua. Functions are reusable
    blocks of code that perform specific tasks, while modules provide a way to organize
    and encapsulate related functions and variables. Understanding functions and modules
    is essential for writing modular and maintain-able Lua programs.


    ## Functions in Lua


    Functions in Lua allow you to encapsulate a series of instructions into a single
    block of code. They enable code reuse, modularity, and improve the readability
    of your programs. Here''s an example of a simple function:


    ```lua

    -- Define a function

    function greet()

    print("Hello, world!")

    end


    -- Call the function

    greet()

    ```


    In the above code snippet, we define a function named `greet` that prints "Hello,
    world!" when called. To call a function, you simply use its name followed by parentheses.


    Functions can also accept parameters, which are values passed to the function
    to perform specific operations. Here''s an example of a function with parameters:


    ```lua

    -- Define a function with parameters

    function add(a, b)

    local sum = a + b

    return sum

    end


    -- Call the function with arguments

    local result = add(3, 4)

    print(result)  -- Output: 7

    ```


    In the above code snippet, the `add` function takes two parameters, `a` and `b`,
    and returns their sum. We call the function by passing arguments `3` and `4`,
    and the result is stored in the `result` variable.


    Lua functions can also return multiple values. Here''s an example:


    ```lua

    -- Define a function with multiple return values

    function divide(a, b)

    local quotient = a / b

    local remainder = a % b

    return quotient, remainder

    end


    -- Call the function and receive multiple return values

    local q, r = divide(10, 3)

    print("Quotient:", q)  -- Output: 3.3333333333333

    print("Remainder:", r)  -- Output: 1

    ```

