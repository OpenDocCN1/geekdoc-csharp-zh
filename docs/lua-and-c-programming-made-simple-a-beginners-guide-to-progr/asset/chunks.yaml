  trans: "\n\n## 4.8 总结\n\n在本章中，我们探索了 C# 中的数组。我们学习了如何声明、初始化、访问和修改数组元素。我们还讨论了数组长度和边界的概念，以及如何使用\
    \ `for` 和 `foreach` 循环遍历数组。此外，我们还简要介绍了多维数组。\n\n数组为存储和操作数据集合提供了一种强大的方式。它们被广泛应用于各种编程场景中。在下一章中，我们将深入研究方法，方法允许我们封装可重用的代码块，并增强程序的的模块化程度。\n\
    \n## 第 5 章：方法：封装可重用的代码\n\n在本章中，我们将探索 C# 中的方法。方法允许我们将代码块封装成可重用的单元，为组织和模块化我们的程序提供了一种方法。我们将学习如何定义方法、传递参数、返回结果，并利用它们的力量来创建高效且易于维护的代码。\n\
    \n## 5.1 方法简介\n\n方法是执行特定任务或操作的代码块。它们提供了一种封装功能的方法，使我们的程序更有组织且更易于理解。方法可以接受输入参数、执行操作，并可选地返回结果。\n\
    \n## 5.2 方法声明与语法\n\n在 C# 中声明一个方法，我们需要指定其访问级别、返回类型、名称以及任何输入参数。这里是通用语法：\n\n```csharp\n\
    accessibility return_type MethodName(parameters)\n{\n    // 方法体\n}\n```\n\n- `accessibility`\
    \ 决定了方法的可见性（例如，`public`、`private` 等）。\n- `return_type` 代表方法返回的值的类型（如果不返回任何值，则使用\
    \ `void`）。\n- `MethodName` 是方法的名称，应该遵循命名规范。\n- `parameters` 指定方法所需的输入值（可选）。\n\n\
    ## 5.3 Void 方法：执行操作\n\n`void` 方法是不返回任何值的方法。当我们希望方法执行某个特定操作而不返回结果时，就会使用这种方法。这是一个示例：\n\
    \n```csharp\npublic void SayHello()\n{\n    Console.WriteLine(\"Hello!\");\n}\n\
    ```\n\n在这个示例中，我们声明了一个名为 `SayHello()` 的 `void` 方法，它仅仅是向控制台输出 \"Hello!\"。该方法不返回任何值。\n\
    \n要调用 `void` 方法，我们使用其名称后跟括号。这是一个示例：\n\n```csharp\nSayHello();\n```\n\n通过调用 `SayHello()`\
    \ 方法，控制台将显示 \"Hello!\" 信息。\n\n## 5.4 带参数的方法：接受输入\n\n方法可以接受输入参数，允许我们将数据传递到方法中处理。参数在方法内部充当变量，其值在方法被调用时被确定。这是一个示例：\n\
    \n```csharp\npublic void GreetUser(string name)\n{\n    Console.WriteLine(\"Hello,\
    \ \" + name + \"!\");\n}\n```\n\n在这个示例中，我们定义了一个名为 `GreetUser()` 的 `void` 方法，它接受一个名为\
    \ `name` 的字符串参数。该方法通过将提供的名称与问候消息拼接来问候用户。\n\n要调用带参数的方法，我们在进行方法调用时传递对应的值。这是一个示例：\n\
    \n```csharp\nGreetUser(\"John\");\n```\n\n通过带参数 \"John\" 调用 `GreetUser()` 方法，该方法将输出\
    \ \"Hello, John!\"。\n\n## 5.5 有返回值的方法：产生结果\n\n方法还可以使用 `return` 关键字返回值。方法的返回类型应该与所返回值的类型匹配。这是一个示例：\n\
    \n```csharp\npublic int AddNumbers(int a, int b)\n{\n    int sum = a + b;\n  \
    \  return sum;\n}\n```\n\n在这个示例中，我们定义了一个名为 `AddNumbers()` 的方法，它接受两个整数参数 `a` 和\
    \ `b`。该方法将两个数字相加并返回和。\n\n要利用方法的返回值，我们可以将其赋值给变量或直接使用。这是一个示例：\n\n```csharp\nint\
    \ result = AddNumbers(5, 3);\nConsole.WriteLine(result); // 输出: 8\n```\n\n通过带参数\
    \ 5 和 3 调用 `AddNumbers()` 方法，返回的和 8 被赋值给变量 `result`，然后该变量被打印到控制台。。\n\n## 5.6 方法重载：多个签名\n\
    \n在 C# 中，我们可以拥有多个同名但不同参数列表的方法。这被称为方法重载。重载允许我们定义执行相似操作但不同输入参数的方法。这是一个示例：\n\n```csharp\n\
    public void GreetUser(string name)\n{\n    Console.WriteLine(\"Hello, \" + name\
    \ + \"!\");\n}\n\npublic void GreetUser(string firstName, string lastName)\n{\n\
    \    Console.WriteLine(\"Hello, \" + firstName + \" \" + lastName + \"!\");\n\
    }\n```\n\n在这个示例中，我们有两个 `GreetUser()` 方法，一个接受单个字符串参数作为名称，另一个接受两个字符串参数作为名和姓。根据所提供的参数的数量和类型，将调用相应的方法。\n\
    \n```csharp\nGreetUser(\"John\"); // 输出: Hello, John!\nGreetUser(\"John\", \"\
    Doe\"); // 输出: Hello, John Doe!\n```\n\n通过使用不同的参数调用 `GreetUser()` 方法，我们可以相应调整问候。\n\
    \n## 5.7 总结\n\n在本章中，我们探索了 C# 中的方法。我们学习了如何声明方法、指定返回类型、传递参数以及利用返回值。我们看到了 `void`\
    \ 方法如何执行操作、带参数的方法如何接受输入以及有返回值的方法如何产生结果。我们还讨论了方法重载，它允许拥有同名但不同参数列表的方法。方法是组织和封装代码的强大工具，通过有效利用方法，我们可以创建更高效的程序。在下一章中，我们将深入研究面向对象概念，包括类和对象，这些是\
    \ C# 的基础。\n\n## 第 6 章：面向对象编程：类与对象\n\n在本章中，我们将探索 C# 中面向对象编程（OOP）的基础概念。我们将学习类、对象、属性和方法，这些都是\
    \ OOP 的构建石。理解这些概念将使我们能够创建健壮的可扩展应用程序。\n\n## 6.1 面向对象编程简介\n\n面向对象编程（OOP）是一种将代码组织为重用的自包含对象的编程范式。对象是类的实例，类是模板。OOP\
    \ 提供了封装、继承和多态等概念，允许我们创建模块化且易于维护的代码。\n\n## 6.2 类：对象的蓝图\n\n类是一种自定义数据类型，将数据和行为封装在一个单元中。它作为创建对象的蓝图或模板。在\
    \ C# 中，我们使用 `class` 关键字定义类。这是一个示例：\n\n```csharp\npublic class Person\n{\n    //\
