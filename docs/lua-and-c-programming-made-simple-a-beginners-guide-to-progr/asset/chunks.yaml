    \ 访问数组元素\n\n可以使用索引来访问数组元素。索引代表元素在数组中的位置。第一个元素的索引为 0，第二个元素的索引为 1，以此此类推。这是一个示例：\n\
    \n```csharp\nint[] numbers = { 1, 2, 3, 4, 5 };\nConsole.WriteLine(numbers[0]);\n\
    Console.WriteLine(numbers[1]);\n```\n\n在这个示例中，我们通过索引访问了 `numbers` 数组的前两个元素。\n\n\
    ## 4.4 修改数组元素\n\n通过向索引赋值新值来修改数组元素。这是一个示例：\n\n```csharp\nint[] numbers = { 1, 2,\
    \ 3, 4, 5 };\nnumbers[1] = 10;\n```\n\n在这个示例中，我们将 `numbers` 数组的第二个元素修改为了 10。\n\
    \n## 4.5 数组长度\n\n数组的长度代表它所包含的元素总数。在 C# 中，我们使用 `Length` 属性。这是一个示例：\n\n```csharp\n\
    int[] numbers = { 1, 2, 3, 4, 5 };\nConsole.WriteLine(numbers.Length);\n```\n\n\
    在这个示例中，我们获取了 `numbers` 数组的长度，即 5。注意数组索引是从 0 到长度-1。访问此范围外的元素会导致 `IndexOutOfRangeException`。\n\
