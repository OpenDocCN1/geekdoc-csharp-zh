    \ { 1, 2, 3, 4, 5 };\nfor (int i = 0; i < numbers.Length; i++)\n{\n    Console.WriteLine(numbers[i]);\n\
    }\n```\n\n在这个示例中，我们使用 `for` 循环遍历 `numbers` 数组的每个元素。循环变量 `i` 代表索引。\n\n### 4.6.2\
    \ Foreach 循环\n\n`foreach` 循环通过自动处理索引简化了遍历数组的过程。这是一个示例：\n\n```csharp\nint[] numbers\
    \ = { 1, 2, 3, 4, 5 };\nforeach (int number in numbers)\n{\n    Console.WriteLine(number);\n\
    }\n```\n\n在这个示例中，`foreach` 循环遍历 `numbers` 数组的每个元素并将其赋值给变量 `number`。\n\n## 4.7\
    \ 多维数组\n\nC# 还支持多维数组，即具有多个维度或轴的数组。最常见的类型是二维数组，通常表示为矩阵或网格。这是一个示例：\n\n```csharp\n\
    int[,] matrix = new int[3, 3]\n{\n    { 1, 2, 3 },\n    { 4, 5, 6 },\n    { 7,\
    \ 8, 9 }\n};\n```\n\n在这个示例中，我们声明并初始化了一个名为 `matrix` 的二维数组。它包含 3 行 3 列。\n\n要访问多维数组中的元素，我们需要指定每个维度的索引。这是一个示例：\n\
    \n```csharp\nint[,] matrix = new int[3, 3]\n{\n    { 1, 2, 3 },\n    { 4, 5, 6\
    \ },\n    { 7, 8, 9 }\n};\nConsole.WriteLine(matrix[1, 2]); // 输出: 6\n```\n\n\
    在这个示例中，我们访问了 `matrix` 数组中第二行（索引 1）和第三列（索引 2）的元素。\n\n"
