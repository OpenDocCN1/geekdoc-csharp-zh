    \ Hello, my name is John!\n```\n\n在这个示例中，我们创建了一个名为 `person` 的 `Person` 对象，并将名字\
    \ \"John\" 赋值给它的 `Name` 属性。然后我们调用了 `SayHello()` 方法，该方法在控制台上打印了问候消息。\n\n# 6.6 构造函数：初始化对象\n\
    \n构造函数是一种在对象创建时调用的特殊方法。它用于初始化对象的状态并设置它的初始值。在 C# 中，构造函数的名称与类名相同。这里有一个示例：\n\n```csharp\n\
    public class Person\n{\n    public string Name { get; set; }\n    public int Age\
    \ { get; set; }\n    public Person(string name, int age)\n    {\n        Name\
    \ = name;\n        Age = age;\n    }\n    public void SayHello()\n    {\n    \
    \    Console.WriteLine(\"Hello, my name is \" + Name + \"!\");\n    }\n}\n```\n\
    \n在这个示例中，`Person` 类有一个接受两个参数（`name` 和 `age`）的构造函数用于初始化 `Name` 和 `Age` 属性。\n\n\
    要使用构造函数创建对象，我们在创建对象时传递所需的值。这里有一个示例：\n\n```csharp\nPerson person = new Person(\"\
    John\", 25);\nperson.SayHello(); // 输出: Hello, my name is John!\n```\n\n在这个示例中，我们创建了一个名为\
