    # Chapter 8: Polymorphism: Flexibility and Modularity


    In this chapter, we will explore the concept of polymorphism in C#. Polymorphism
    allows objects of different types to be treated as objects of a common base type.
    It enhances flexibility and modularity in our programs by enabling code to work
    with objects at a higher level of abstraction.


    # 8.1 Introduction to Polymorphism


    Polymorphism is a key feature of object-oriented programming that allows objects
    of different types to be used interchangeably. It is based on the principle of
    "one interface, multiple implementations." Polymorphism promotes code reuse, extensibility,
    and flexibility.


    # 8.2 Base Class as a Reference Type


    Polymorphism relies on using a base class as a reference type to refer to objects
    of different derived classes. This allows us to treat objects of different types
    in a unified manner. Consider the following example:


    ```csharp


    public class Animal


    {


    public virtual void MakeSound()


    {


    Console.WriteLine("Animal makes a sound");


    }


    }


    public class Dog : Animal


    {


    public override void MakeSound()


    {


    Console.WriteLine("Dog barks");


    }


    }


    public class Cat : Animal


    {


    public override void MakeSound()


    {


    Console.WriteLine("Cat meows");


    }


    }


    Animal animal1 = new Dog();


    Animal animal2 = new Cat();


    ```


    In this example, we have a base class `Animal` and two derived classes, `Dog`
    and `Cat`. We create objects of `Dog` and `Cat` but assign them to variables of
    type `Animal`. This is possible because a derived class object can be implicitly
    converted to its base class type.


    # 8.3 Polymorphic Behavior


    By using the base class reference type, we can invoke methods or access properties
    that are defined in the base class. However, if the methods are overridden in
    the derived classes, the overridden implementations will be executed at runtime.
    Consider the following example:


    ```csharp


    animal1.MakeSound(); // Output: Dog barks


    animal2.MakeSound(); // Output: Cat meows


    ```


    In this example, the `MakeSound()` method is overridden in the `Dog` and `Cat`
    classes. When we invoke the method using the base class reference, the respective
    overridden implementations in the derived classes are executed. This is known
    as polymorphic behavior.


    # 8.4 Polymorphism and Method Overriding


    Polymorphism works in conjunction with method overriding, which allows derived
    classes to provide their own implementation of a method defined in the base class.
    Method overriding enables dynamic dispatch, where the appropriate method implementation
    is determined at runtime based on the actual object type.


    To override a method, we use the `override` keyword in the derived class. The
    method in the base class must be declared as `virtual` or `abstract`. Consider
    the following example:


    ```csharp


    public class Shape


    {


    public virtual void Draw()


    {


    Console.WriteLine("Drawing a shape");


    }


    }


    public class Circle : Shape


    {


    public override void Draw()


    {


    Console.WriteLine("Drawing a circle");


    }


    }


    public class Rectangle : Shape


    {


    public override void Draw()


    {


    Console.WriteLine("Drawing a rectangle");


    }


    }


    Shape shape1 = new Circle();


    Shape shape2 = new Rectangle();


    shape1.Draw(); // Output: Drawing a circle


    shape2.Draw(); // Output: Drawing a rectangle


    ```


    In this example, we have a base class `Shape` and two derived classes, `Circle`
    and `Rectangle`. The `Draw()` method is overridden in both derived classes. When
    we invoke the `Draw()` method using the base class reference, the appropriate
    overridden implementation is executed based on the actual object type.


    8 .5 Summary


    Polymorphism is a powerful concept in object-oriented programming that enhances
    flexibility and modularity in our code. By treating objects of different types
    as objects of a common base type, we can write code that can work with multiple
    implementations without the need for explicit type checking.


    In this chapter, we explored polymorphism in C# and how it enables us to leverage
    the common behavior defined in the base class while allowing derived classes to
    provide their own implementations. We saw how polymorphic behavior is achieved
    through method overriding and how it promotes dynamic dispatch at runtime.


    Polymorphism enables us to write code that is more adaptable to changes, promotes
    code reuse, and simplifies complex systems by allowing them to be composed of
    interchangeable parts. It plays a vital role in creating modular, maintainable,
    and extensible applications.


    In the next chapter, we will dive into another important topic: encapsulation.
    Encapsulation allows us to hide the internal details of a class and provide controlled
    access to its members.


    # Chapter 9: Encapsulation: Protecting Data and Behavior


    In this chapter, we will explore the concept of encapsulation in C#. Encapsulation
    is one of the fundamental principles of object-oriented programming that allows
    us to bundle data and related behavior into a single unit called a class. It provides
    a way to protect data from direct external access and ensures controlled access
    through methods.


    # 9.1 Introduction to Encapsulation


    Encapsulation is the process of hiding the internal details of a class and providing
    controlled access to its members. It allows us to create a boundary around the
    class, protecting its data and behavior from unauthorized access and modifications.


    By encapsulating data and behavior together, we can create more robust and maintainable
    code. Encapsulation promotes code reusability, modularity, and data integrity.


    # 9.2 Access Modifiers


    Access modifiers in C# control the visibility and accessibility of types and members.
    They play a crucial role in encapsulation by defining the level of access to the
    class members.


    The four access modifiers in C# are:


    - `public`: The member is accessible from any code.


    - `private`: The member is only accessible within the containing class.


    - `protected`: The member is accessible within the containing class and its derived
    classes.


    - `internal`: The member is accessible within the same assembly (project).


    By using access modifiers effectively, we can enforce encapsulation and control
    the visibility of class members.


    # 9.3 Properties


    Properties are a mechanism in C# that provide controlled access to the encapsulated
    data of a class. They allow us to define getter and setter methods for accessing
    and modifying the data.


    Properties encapsulate the underlying data and provide a layer of abstraction,
    allowing us to enforce validation, perform calculations, and control access to
    the data.


