    \n# 第 4 章：数组：存储和操作数据集合\n\n在本章中，我们将探索 C# 中数组的概念。数组允许我们在单个变量中存储多个相同类型的值。我们将学习如何声明、初始化、访问和操作数组，以便高效处理数据集合。\n\
    \n## 4.1 数组简介\n\n数组是一种存储固定大小相同类型元素序列的数据结构。数组中的每个元素都通过索引识别，索引从 0 开始。数组为处理数据集合提供了方便的方法，例如数字列表、名称列表或任何其他类型的信息。\n\
