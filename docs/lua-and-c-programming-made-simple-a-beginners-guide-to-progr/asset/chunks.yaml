    \ 方法显示了问候消息。\n\n# 6.7 总结\n\n在本章中，我们探索了 C# 中面向对象编程的核心概念。我们学习了类（作为创建对象的蓝图）和对象（类的实例）。我们讨论了属性（提供对类数据的访问途径）和方法（定义类的行为）。我们还涵盖了初始化对象状态的构造函数。\n\
    \n面向对象编程允许我们通过将数据和行为封装在类中来创建模块化和可重用的代码。通过利用类、对象、属性和方法，我们可以构建健壮且可扩展的应用程序。在下一章中，我们将深入学习继承，这是一种促进面向对象编程中代码重用和层次结构的强大机制。\n\
    \n# 第 7 章：继承：类的重用与扩展\n\n在本章中，我们将使用 C# 探索面向对象编程中的继承概念。继承允许我们根据现有的类创建新类，从而实现代码重用和扩展功能的能力。我们将学习基类、派生类、继承层次结构以及它们为程序带来的益处。\n\
    \n# 7.1 继承简介\n\n继承是面向对象编程中的一个基本概念，它允许我们根据现有的类（基类）创建新类（派生类）。派生类继承基类的属性和方法，还可以添加新成员或覆盖现有的成员。这促进了代码重用、模块化扩展性。\n\
    \n# 7.2 基类与派生类\n\n继承涉及两种类型的类：基类和派生类。基类是为派生类提供基础的现有类。派生类是继承自基类的的新类，获得访问其成员的权限。\n\
    \n要创建派生类，我们使用 `:` 符号后跟基类的名称。这里有一个示例：\n\n```csharp\npublic class BaseClass\n{\n\
    \    // 基类成员\n}\npublic class DerivedClass : BaseClass\n{\n    // 派生类成员\n}\n```\n\
    \n在这个示例中，我们有一个名为 `BaseClass` 的基类和一个名为 `DerivedClass` 的派生类，后者继承自 `BaseClass`。\n\
    \n# 7.3 继承成员\n\n当一个类继承基类时，它会自动继承基类所有的公共（public）和保护（protected）成员。这包括属性、方法、字段和事件。派生类可以访问并使用这些继承的成员。\n\
    \n```csharp\npublic class BaseClass\n{\n    public void BaseMethod() { }\n}\n\
    public class DerivedClass : BaseClass\n{\n    public void DerivedMethod() { }\n\
    }\nDerivedClass derivedObj = new DerivedClass();\nderivedObj.BaseMethod(); //\
    \ 访问继承的方法\nderivedObj.DerivedMethod(); // 访问派生的方法\n```\n\n在这个示例中，`DerivedClass`\
    \ 继承了 `BaseClass` 的 `BaseMethod()` 并定义了它自己的 `DerivedMethod()`。\n\n# 7.4 覆盖成员\n\
    \n在某些情况下，派生类可能需要修改继承成员的实现。通过使用 `override` 关键字覆盖基类成员来实现。派生类中被覆盖的成员必须与基类成员具有相同的签名（名称、返回类型和参数）。\n\
    \n```csharp\npublic class BaseClass\n{\n    public virtual void SomeMethod()\n\
    \    {\n        // 基类方法实现\n    }\n}\npublic class DerivedClass : BaseClass\n{\n\
    \    public override void SomeMethod()\n    {\n        // 派生类方法实现\n    }\n}\n\
    DerivedClass derivedObj = new DerivedClass();\nderivedObj.SomeMethod(); // 调用派生类中被覆盖的方法\n\
    ```\n\n在这个示例中，`BaseClass` 定义了一个虚（virtual）方法 `SomeMethod()`，该方法可以在派生类中被覆盖。`DerivedClass`\
    \ 使用自己的实现对其覆盖。\n\n# 7.5 继承层次结构\n\n继承可以在类之间创建层次关系，从而形成继承层次结构。在层次结构中，派生类可以成为另一个派生类的基类，形成继承链。\n\
    \n```csharp\npublic class Animal\n{\n    // 动物基类\n}\npublic class Mammal : Animal\n\
    {\n    // 代表哺乳动物的派生类\n}\npublic class Dog : Mammal\n{\n    // 代表狗的派生类\n}\npublic\
    \ class Cat : Mammal\n{\n    // 代表猫的派生类\n}\n```\n\n在这个示例中，我们有一个作为基类的 `Animal`\
    \ 类，一个继承自 `Animal` 的 `Mammal` 类，以及继承自 `Mammal` 的 `Dog` 和 `Cat` 类。这形成了一个继承层次结构，其中\
    \ `Mammal` 继承自 `Animal`，而 `Dog` 和 `Cat` 继承自 `Mammal`。\n\n# 7.6 继承的益处\n\n继承为面向对象编程提供了许多益处：\n\
