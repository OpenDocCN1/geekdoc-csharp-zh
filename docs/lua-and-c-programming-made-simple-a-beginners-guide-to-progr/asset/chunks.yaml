    ## 使用包


    Lua 包（packages）提供了一种组织和管理由多个 Lua 文件组成代码库的方法。包通常遵循特定的目录结构，并使用 `init.lua` 文件作为入口点。让我们考虑一个包结构：


    ```

    my_package/

    ├── init.lua

    ├── utils.lua

    └── calculations.lua

    ```


    在上面的包结构中，`init.lua` 文件作为入口点，其他 Lua 文件（如 `utils.lua` 和 `calculations.lua`）包含特定的功能。你可以按照以下方式加载并使用包中的函数：


    ```lua

    -- Load the package

    local myPackage = require("my_package")


