- fmt: "\n## Inheritance\n\n1. **Code Reuse**: Inheritance allows us to reuse code\
    \ by inheriting properties and methods from base classes. This reduces code duplication\
    \ and promotes modularity.\n2. **Extensibility**: Derived classes can add new\
    \ members or override existing ones, allowing us to extend the functionality of\
    \ base classes to suit specific needs.\n3. **Polymorphism**: Inheritance enables\
    \ polymorphism, which allows objects of derived classes to be treated as objects\
    \ of their base classes. This promotes flexibility and abstraction.\n4. **Modularity\
    \ and Maintainability**: Inheritance helps in organizing code into logical units,\
