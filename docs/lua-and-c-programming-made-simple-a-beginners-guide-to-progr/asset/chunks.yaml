    local greeting = "Hello, " .. name .. "!"


    print(greeting)  -- Output: Hello, John!


    ```


    In the above code snippet, we concatenate the strings "Hello, ", the value of
    the `name` variable, and the exclamation mark. The result is a new string assigned
    to the `greeting` variable.


    # ### Pattern Matching in Lua


    Pattern matching in Lua allows you to search and manipulate strings using patterns.
    Patterns are sequences of characters that represent a set of strings or a specific
    string format. Lua provides the `string.match` function to perform pattern matching.
    Here''s an example:


    ```lua


    -- Perform pattern matching


    local email = "john.doe@example.com"


    local username = string.match(email, "([^@]+)")


    print(username)  -- Output: john.doe


    ```


    In the above code snippet, we extract the username from an email address using
    pattern matching. The pattern `"([^@]+)"` matches any sequence of characters that
    is not an `@` symbol.'
