    4. **Tables:** Tables are Lua''s versatile data structure, allowing you to create
    arrays, dictionaries, sets, and more. They can store values of different types
    and provide a powerful way to organize and manipulate data. Here''s an example:


    ```lua

    local person = {

    name = "Alice",

    age = 30,

    isStudent = true

    }

    ```


    5. **Nil:** The `nil` value represents the absence of a value. It is often used
    to indicate the absence of a variable or the deletion of a table entry.


    ## Variable Naming Conventions


    When naming variables in Lua, there are a few conventions to follow:


    - Variable names should be descriptive and indicate the purpose of the variable.

    - Use lowercase letters and underscores for multi-word variable names (e.g., `my_variable`).

    - Avoid using reserved keywords as variable names.


    ## Variable Assignment and Manipulation


    In Lua, you can assign values to variables using the assignment operator (`=`).
    Variables can be assigned new values at any point in the program. Here''s an example:


    ```lua

    local age = 25

    print(age)  -- Output: 25

    age = 30

    print(age)  -- Output: 30

    ```


    ## Type Conversion


    Lua provides functions to convert values from one data type to another. For example,
    you can convert a number to a string using the `tostring()` function, or convert
    a string to a number using the `tonumber()` function.


    ```lua

    local num = 42

    local str = tostring(num)

    print(str)  -- Output: "42"

    local strNum = "123"

    local num = tonumber(strNum)

    print(num)  -- Output: 123

    ```


    ## Wrapping Up


    In this chapter, we explored variables and data types in Lua. We learned how to
    declare and assign values to variables, and we examined the various data types
    available in Lua, including numbers, strings, booleans, tables, and nil. Understanding
    variables and data types is fundamental for writing effective Lua programs.


    In the next chapter, "Control Flow: Conditional Statements and Loops," we will
