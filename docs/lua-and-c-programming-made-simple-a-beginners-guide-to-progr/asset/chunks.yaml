    \ to Encapsulation\n\nEncapsulation is the process of hiding the internal details\
    \ of a class and providing controlled access to its members. It allows us to create\
    \ a boundary around the class, protecting its data and behavior from unauthorized\
    \ access and modifications.\n\nBy encapsulating data and behavior together, we\
    \ can create more robust and maintainable code. Encapsulation promotes code reusability,\
    \ modularity, and data integrity.\n\n## 9.2 Access Modifiers\n\nAccess modifiers\
    \ in `C#` control the visibility and accessibility of types and members. They\
    \ play a crucial role in encapsulation by defining the level of access to the\
    \ class members.\n\nThe four access modifiers in `C#` are:\n\n- `public`: The\
    \ member is accessible from any code.\n- `private`: The member is only accessible\
    \ within the containing class.\n- `protected`: The member is accessible within\
    \ the containing class and its derived classes.\n- `internal`: The member is accessible\
    \ within the same assembly (project).\n\nBy using access modifiers effectively,\
    \ we can enforce encapsulation and control the visibility of class members.\n\n\
    ## 9.3 Properties\n\nProperties are a mechanism in `C#` that provide controlled\
