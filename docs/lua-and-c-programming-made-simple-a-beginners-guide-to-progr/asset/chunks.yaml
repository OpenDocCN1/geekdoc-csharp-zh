    \    command.Parameters.AddWithValue(\"@name\", \"John Doe\");\n    command.Parameters.AddWithValue(\"\
    @age\", 30);\n    connection.Open();\n    int rowsAffected = command.ExecuteNonQuery();\n\
    \    Console.WriteLine(\"Rows affected: \" + rowsAffected);\n}\n```\n\nIn this\
