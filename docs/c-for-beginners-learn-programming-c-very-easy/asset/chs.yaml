  ![](img/image00064.jpeg)\n从输出中你可以清楚地看到控制台上显示了等于 `true` 的布尔变量。\n\n# 4. **字符串 (String)**\n\
  String 数据类型用于处理字符串值。在 C# 中，该数据类型由关键字 `String` 表示。下面是此数据类型的示例。\n\n在示例中，我们将定义一个名为\
