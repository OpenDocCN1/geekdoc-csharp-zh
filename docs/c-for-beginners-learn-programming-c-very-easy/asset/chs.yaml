  \n当你点击“connect”按钮时，从输出可以清楚地看到数据库连接已建立。因此，了消息框。\n\n## 访问数据\n\n为了演示如何使用 C# 访问数据，让我们假设数据库中具有以下构件。\n\
  \n1. 一个名为 `demotb` 的表。该表将用于存储各种教程（Tutorials）的 ID 和名称。\n2. 该表将有 2 列，一个称为 `TutorialID`，另一个称为\
