  \ `Listbox` 已添加到表单中。你还可以看到列表框已经填充了城市值。\n\n### RadioButton（单选按钮）\n`RadioButton` 用于展示一组项目，用户可以从中选择一个。让我们通过下面的示例来看我们如何实现它。我们将为男性/女性选项添加一个单选按钮。\n\
