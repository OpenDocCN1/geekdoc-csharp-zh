- "# C# 初学者指南：轻松学习 C# 编程\n\n\n\n![](img/cover00210.jpeg)\n\n\n![](img/image00049.jpeg)\n\
  \n# 第 1 章：什么是 .NET Framework\n\n.Net framework 是微软（Microsoft）开发的一个软件开发平台。该框架旨在创建运行在\
  \ Windows 平台上的应用程序。.Net framework 的第一个版本于 2000 年发布。\n\n该版本被称为 `.Net framework 1.0`。从那时以后，.Net\
  \ framework 取得了巨大的进步，当前版本为 `4.6.1`。\n\n.Net framework 可用于创建`基于表单的 (Form based)`\
  \ 和 `基于 Web 的 (Web based)` 应用程序。也可以使用 .Net framework 开发 Web 服务。\n\n该框架还支持多种编程语言，如\
  \ Visual Basic 和 `C#`。因此，开发者可以根据需求选择语言来开发应用程序。在本章中，你将学习 .Net framework 的基础知识。\n\n\
  ## .Net Framework 架构\n\n.Net framework 的基本架构如下所示。\n\n![](img/image00050.jpeg).Net\
  \ framework 的架构基于以下关键组件；1. `Common Language Runtime`（通用语言运行时）——“通用语言体系”或 `CLI` 是执行\
  \ .Net 程序的平台。\n\n`CLI` 具有以下关键特性：\n\n异常处理（Exception Handling）——异常是在应用程序执行时发生的错误。异常的示例包括：\n\
  - 如果应用程序尝试打开本地机器上的文件，但该文件不存在。\n- 如果应用程序尝试从数据库获取某些记录，但与数据库的连接无效。\n\n垃圾回收（`Garbage\
  \ Collection`）——垃圾回收是在不再需要时移除资源的过程。垃圾回收的示例包括：\n- 不再需要的文件句柄。如果应用程序完成了对文件的所有操作，那么该文件句柄可能不再需要了。\n\
  - 不再需要的数据库连接。如果应用程序完成了对数据库的所有操作，那么数据库连接可能不再需要了。\n\n与各种编程语言协作工作——\n\n如前面的章节所述，开发者可以使用多种\
  \ .Net 编程语言开发应用程序。\n\n1. 语言——第一层是编程语言本身，最常见的有 `VB.Net` 和 `C#`。\n2. 编译器——每种编程语言都有一个独立的编译器。因此，在\
  \ `VB.Net` 语言下方，有一个独立的 `VB.Net` 编译器。同样，对于 `C#`，你会有另一个编译器。\n3. 通用语言解释器（Common Language\
  \ Interpreter）——这是 .Net 的最后层，用于运行用任何编程语言开发的 .net 程序。因此，后续编译器会将程序发送到 `CLI` 层来运行 .Net\
  \ 应用程序。\n\n![](img/image00051.jpeg)\n\n2. 类库（Class Library）——.NET Framework 包含一组标准类库。类库是用于核心用途的方法和函数的集合。\n\
  \n例如，有一个类库包含处理所有文件级操作的方法。因此，有一个方法可以用于从文件中读取文本。同样，有一个方法可以将文本写入文件。\n\n大多数方法都被划分为 `System.*`\
  \ 或 `Microsoft.*` 命名空间。（星号 `*` 仅表示对 `System` 或 `Microsoft` 命名空间下所有方法的引用）。\n\n命名空间（Namespace）是方法的逻辑隔离。我们将在后续章节中更详细地学习这些命名空间。\n\
  \n3. 语言——在 .Net framework 中可以构建的应用程序类型大致分为以下几类。\n\n`WinForms` —— 用于开发基于表单的应用程序，这些程序运行在终端用户机器上。记事本（Notepad）是客户端应用程序的一个示例。\n\
  \n`ASP.Net` —— 用于开发基于 Web 的应用程序，这些程序旨在运行在任何浏览器上，如 Internet Explorer、Chrome 或 Firefox。Web\
  \ 应用程序将在安装了 Internet 信息服务（IIS）的服务器上处理。Internet 信息服务或 `IIS` 是微软的一个组件，用于执行 `ASP.net`\
  \ 应用程序。执行结果随后发送到客户端机器，输出显示在浏览器中。\n\n`ADO.Net` —— 这项技术用于开发与 Oracle 或 Microsoft SQL\
  \ Server 等数据库交互的应用程序。\n\n## .Net framework 的不同版本\n\n下面是 .Net framework 版本的表格，列出了它们的发布日期。每个版本对框架都有相应的更改。\n\
  \n例如，在框架 3.5 及之后的版本中，发布了一个名为 `Entity framework` 的关键框架。该框架用于改变在处理数据库时开发应用程序的方法。\n\
  \n| 版本号 | CLR 版本 | 发布日期 |\n| :--- | :--- | :--- |\n| 1.0 | 1.0 | 2002-02-13 |\n\
  | 1.1 | 1.1 | 2003-04-24 |\n| 2.0 | 2.0 | 2005-11-07 |\n| 3.0 | 2.0 | 2006-11-06\
  \ |\n| 3.5 | 2.0 | 2007-11-19 |\n| 4.0 | 4 | 2010-04-12 |\n| 4.5 | 4 | 2012-08-15\
  \ |\n| 4.5.1 | 4 | 2013-10-17 |\n| 4.5.2 | 4 | 2014-05-05 |\n| 4.6 | 4 | 2015-07-20\
  \ |\n| 4.6.1 | 4 | 2015-11-17 |\n\n.Net framework 最大的优势是它支持 Windows 平台。几乎所有人都在使用\
  \ Windows 机器工作。微软始终确保 .Net frameworks 符合所有支持的 Windows 操作系统。\n\n.Net framework 的以下设计原则使其创建基于\
  \ .Net 的应用程序非常有意义。\n\n1. 交互性（Interoperability）——.Net framework 提供了大量的向后支持。假设你有一个基于旧版本\
  \ .Net framework（例如 `2.0`）构建的应用程序。如果你尝试在具有较高版本 .Net framework（例如 `3.5`）的机器上运行相同的应用程序，它仍然可以运行。这是因为每次发布，微软都确保旧框架版本与新版本良好融合。\n\
  2. 可移植性（Portability）——在 .Net framework 上构建的应用程序可以运行在任何 Windows 平台上。现在微软也设想让微软产品运行在\
  \ iOS 和 Linux 等平台上。\n3. 安全性（Security）——NET Framework 具有良好的安全机制。内置的安全机制有助于应用程序的验证和确认。每个应用程序都可以显式地定义自己的安全机制。每个安全机制用于授予用户访问代码或运行程序的权限。\n\
  4. 内存管理（Memory management）——通用语言运行时负责所有的内存管理工作。.Net framework 有能力识别未被运行程序使用的资源。它随后会相应释放这些资源。这是通过一个名为“垃圾回收器”的程序实现的，它是\
  \ .Net framework 的一部分。垃圾回收器定期运行，检查哪些系统资源未被利用并相应释放它们。\n5. 简化部署（Simplified deployment）——.Net\
  \ framework 还拥有工具，用于封装基于 .Net framework 构建的应用程序。这些包可以分发到客户端机器。这些包将自动安装应用程序。\n\n\
  ### 总结\n\n.Net 是微软开发的一种编程语言。它旨在构建运行在 Windows 平台上的应用程序。.Net 编程语言可用于开发基于表单的应用程序、基于\
  \ Web 的应用程序以及 Web 服务。\n\n\n\n\n\nMicrosoft Visual Studio 是由微软提供的一款集成开发环境（IDE）。它用于为\
  \ Microsoft Windows 开发计算机程序。Visual Studio 是基于 `.Net` 平台构建的所有应用程序的一站式解决方案。用户可以使用\
  \ Visual Studio 进行开发、调试和运行应用程序。\n\n使用此 IDE 可以设计和开发基于 Forms（窗体）和基于 Web 的应用程序。Visual\
  \ Studio 具有以下述功能：\n\n1. **使用任何 .Net 语言创建应用程序** – 可以使用 Visual Studio IDE 创建任何 `.Net`\
  \ 语言的应用程序。因此，开发者可以使用 `C#`、`VB.Net` 甚至 `F#` 来开发应用程序。\n2. **创建任何类型的应用程序 –** 可以使用 Visual\
  \ Studio IDE 创建任何类型的应用程序（基于 Web 的应用程序或基于 Windows Forms 的应用程序）。\n3. **即时调试应用程序 –**\
  \ 可以在构建的同时进行测试。该 IDE 允许用户在开发过程中的任何时间运行程序。因此，开发者可以在开发阶段就检查任何错误。\n4. **扩展 –** 该 IDE\
  \ 具有安装第三方扩展的功能。例如 `Subversion`，它被用于源代码仓库管理。`Subversion` 用于将代码上传到中央仓库。这样做是为了确保始终存在代码副本。Visual\
  \ Studio 具有从 IDE 本身集成此类软件的功能。因此，开发者可以直接在 IDE 中与代码仓库工作。\n\n让我们来看此 IDE 的安装过程，以便我们在后续章节中创建程序。可以通过以下链接下载\
  \ Visual Studio - `https://www.visualstudio.com/en-us/downloads/download-visual-studio-vs.aspx`\n\
  \n一旦你有了 Visual Studio 安装程序，可以按照以下步骤进行安装：\n\n**步骤 1)** 第一步涉及选择安装位置。在这一步中，还必须接受许可条款和条件。\n\
  \n![](img/image00052.jpeg)\n\n1. 选择 Visual Studio 的安装位置。确保你的机器上有足够的磁盘空间进行安装。\n2.\
  \ 同意许可条款和隐私政策。\n3. 点击 Next（下一步）按钮继续。\n\n**步骤 2)** 下一步涉及选择作为安装一部分的所需组件。\n\n![](img/image00053.jpeg)\n\
  \n1. 仅选择所需的组件。这可以节省安装所需的空间。以下是应该安装的重要组件：\n- Microsoft Foundation Classes for C++\n\
  - Microsoft SQL Server Data Tools\n- Microsoft Web Developer Tools\n2. 之后，点击 Install（安装）按钮开始安装。\n\
  \n安装完成后，你将看到下面显示安装成功的屏幕 ![](img/image00054.jpeg)\n\n# 第 3 章：数据类型\n\n`C#` 是微软提供的用于处理\
  \ `.Net` 的语言之一。这种语言包含了丰富的特征集，允许开发不同类型的应用程序。\n\n`C#` 是一种面向对象的编程语言，在许多方面与 `C++` 语言相似。在本文教程中，我们将学习如何开发第一个应用程序。这将是一个基础控制台应用程序，然后我们将探索\
  \ `C#` 语言中提供的不同数据类型以及控制流语句。\n\n## 构建第一个控制台应用程序\n\n控制台应用程序是在 Windows 命令提示符中运行的应用程序。对于任何\
  \ `.Net` 初学者来说，构建控制台应用程序理想上是开始的第一步。\n\n在我们的示例中，我们将使用 Visual Studio 创建一个控制台类型的项目。接下来，我们将使用该控制台应用程序显示消息“Welcome\
  \ to .Net”。然后，我们将查看如何构建和运行该控制台应用程序。\n\n让我们按照以下步骤来实现此示例。\n\n**步骤 1)** 第一步涉及在 Visual\
  \ Studio 中创建一个新项目。为此，启动 Visual Studio 后，你需要选择菜单选项 `New->Project`。\n\n![](img/image00055.jpeg)**步骤\
  \ 2)** 下一步是选择项目类型为 Console application（控制台应用程序）。在这里，我们还需要指定项目的名称和位置。\n\n![](img/image00056.jpeg)\n\
  \n1. 在项目对话框中，我们可以看到在 Visual Studio 中创建不同项目的各种选项。点击左侧的 `Windows` 选项。\n2. 当我们在上一步点击\
  \ `Windows` 选项时，将看到 `Console Application` 选项。点击此选项。\n3. 然后我们为应用程序指定一个名称，在我们的案例中名称为\
  \ `DemoApplication`。我们还需要提供一个存储应用程序的位置。\n4. 最后，点击 ‘OK’ 按钮让 Visual Studio 创建我们的项目。\n\
  \n如果遵循了上述步骤，你将在 Visual Studio 中得到下面的输出。**输出：**\n\n![](img/image00057.jpeg)\n\n1.\
  \ Visual Studio 将创建一个名为 `DemoApplication` 的项目。该项目将包含运行控制台应用程序所需的所有 set。\n2. 名为 `Program.cs`\
  \ 的 `Main` 程序是在在 Visual Studio 中创建新应用程序时创建的默认代码文件。此代码将包含我们控制台应用程序所需的代码。\n\n**步骤\
  \ 3)** 现在让我们编写代码，这些代码将用于在控制台应用程序中显示字符串“Welcome to .Net”。\n\n下面的代码都需要输入到 `Program.cs`\
  \ 文件中。这些代码将在控制台应用程序运行时写入“Welcome to .Net”。\n\n![](img/image00058.jpeg)**代码解释：**\n\
  \n1. 下方的所有代码都是 Visual Studio 默认输入的。`using` 语句用于导入控制台应用程序中的现有 .Net 模块。任何 .Net 应用程序的运行都需要这些模块。它们包含了使代码运行的最少代码。\n\
  2. 每个应用程序都属于一个类。`C#` 是一种面向对象的语言，因此所有代码都需要定义在一个称为类的自持续模块中。反过来，每个类都属于一个命名空间。\n3. `Main`\
  \ 函数是一个在运行时自动调用的特殊函数。在这里你需要确保控制台应用程序中显示所需字符串的代码。\n4. `Console` 类在 `.Net` 中可用，允许用户处理控制台应用程序。在这里我们使用一个名为\
  \ `Write` 的内置方法在控制台上写入“Welcome to .Net”。\n5. 然后我们使用 `Console.ReadKey()` 方法从控制台读取任何键。通过输入此行代码，程序将等待而不会立即退出。程序将在用户输入任何键之前最终退出。如果你不在代码中包含此语句，程序将在运行时立即退出。\n\
  \n**步骤 4)** 运行你的 .Net 程序。要运行任何程序，你需要点击 Visual Studio 中的 Start 按钮。\n\n![](img/image00059.jpeg)如果上述代码输入正确且程序执行成功，将显示以下输出。\n\
  \n**输出：**\n\n![](img/image00060.jpeg)\n\n## C# 数据类型\n\n`C#` 语言自带一组基础数据类型。这些数据类型用于构建应用程序内部使用的值。让我们探索\
  \ `C#` 中提供的基础数据类型。对于每个示例，我们将仅修改 `Program.cs` 文件中的主函数。\n\n\n\n\n\n# 1. **整数 (Integer)**\n\
  整数数据类型用于处理数字。在这种情况下，数字是像 10、20 或 30 这样的整数。在 C# 中，该数据类型由 `Int32` 关键字表示。下面是如何使用此数据类型的示例。在示例中，我们将定义一个名为\
  \ `num` 的 `Int32` 变量。然后为该变量赋值一个 `Integer` 值，并相应地显示它。\n\n![](img/image00061.jpeg)\n\
  **代码解释：**\n\n1. 指定 `Int32` 数据类型来声明一个名为 `num` 的整数变量。然后给该变量赋值为 30。\n2. 最后，使用 `console.write`\
  \ 函数将数字显示在控制台上。\n\n如果正确输入了上述代码并成功执行程序，将显示以下输出。\n从输出中你可以清楚地看到控制台上显示了名为 `num` 的整数变量。\n\
  \n# 2. **双精度浮点数 (Double)**\ndouble 数据类型用于处理小数。在这种情况下，数字是像 10.11、20.22 或 30.33 这样的数字。在\
  \ C# 中，该数据类型由关键字 `Double` 表示。下面是此数据类型的示例。\n\n在示例中，我们将定义一个名为 `num` 的 double 变量。然后为该变量赋值一个\
  \ `Double` 值，并相应地显示它。\n\n![](img/image00062.jpeg)\n**代码解释：**\n\n1. 指定 double 数据类型来声明一个名为\
  \ `num` 的 double 类型变量。然后给该变量赋值为 30.33。\n2. 最后，使用 `console.write` 函数将数字显示在控制台上。\n\
  \n如果正确输入了上述代码并成功执行程序，将显示以下输出。\n从输出中你可以清楚地看到控制台上显示了名为 `num` 的 double 变量。\n\n# 3.\
  \ **布尔值 (Boolean)**\n布尔数据类型用于处理 `true` 和 `false` 的布尔值。在 C# 中，该数据类型由 Boolean 关键字表示。下面是此数据类型的的使用示例。\n\
  \n在示例中，我们将定义一个名为 `status` 的布尔变量。然后为该变量赋值一个布尔值，并相应地显示它。\n\n![](img/image00063.jpeg)\n\
