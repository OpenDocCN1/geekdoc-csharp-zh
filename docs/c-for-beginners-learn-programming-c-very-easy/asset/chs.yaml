  \ 其他控件\n我们还可以查看另外两个控件，一个是 `Tree Control`，另一个是 `Image control`。让我们看看实现这些控件的示例。\n\n\
  ### TreeControl（树形控件）\n`tree control` 用于以树状列列项目。最好的例子就是 Windows 资源管理器。Windows 资源管理器的文件夹结构就像树形结构。\n\
  \n让我们通过下面的示例来看我们如何实现它。**步骤 1)** 第一步是从工具箱中将 `Tree` 控件拖到 Windows 窗单上，如下所示。\n\n![](img/image00153.jpeg)\n\
  \n**步骤 2)** 下一步是开始向树集合添加节点，以便其相应出现在树中。首先，让我们按照以下子步骤向树集合添加一个根节点。\n\n![](img/image00154.jpeg)\n\
  \n1. 进入树视图控件的属性工具箱。点击 `Node’s` 属性。这将弹出 `TreeNode Editor`。\n2. 在 `TreeNode Editor`\
  \ 中，点击 `Add Root` 按钮向树集合添加一个根节点。\n3. 接下来，更改 `Root` 节点的 `text`，提供文本作为 `Root` 并点击\
  \ `‘OK` 按钮。这将添加 `Root` 节点。\n\n\n\n\n\n### 步骤 3) 下一步是向树集合添加子节点。让我们按照以下子步骤将子根节点添加到树集合。\n\
  \n![](img/image00155.jpeg) 1. 来说，点击 `Add child`（添加子）按钮。这将允许你向 `Tree` 集合添加子节点。\n\
  2. 对于每个子节点，更改 `text` 属性。重复上一个步骤和此步骤，额外添加 2 个节点。最后，你将像上面所示拥有 3 个节点，文本分别为 `Label`、`Button`\
  \ 和 `Checkbox`。\n3. 点击 `OK` 按钮。\n\n一旦你完成了上述更改，你将看到以下输出。**输出：**\n\n![](img/image00156.jpeg)\n\
  \n你实际上能够看到 `Tree` 视图已添加到表单中。当你运行 Windows 窗单应用程序时，你可以展开根节点并在列表中查看子节点。\n\n#### `PictureBox`\
  \ 控件 – 此控件用于向 Windows Forms 中添加图像。让我们通过下面的示例看看我们如何实现它。\n\n##### 步骤 1) 第一步是从工具箱中将\
  \ `PictureBox` 控件拖到 Windows Form 上，如下所示\n\n![](img/image00157.jpeg)\n\n##### 步骤\
  \ 2) 下一步是实际上将图像附加到图片框控件。可以通过遵循以下步骤来实现。\n\n![](img/image00158.jpeg)\n\n1. 首先，点击 `PictureBox`\
  \ 控件的 `Image` 属性。将弹出一个新窗口。\n2. 在此窗口中，点击 `Import`（导入）按钮。这将用于将图像附加到 picturebox 控件。\n\
  3. 将弹出一个对话框，在其中你可以选择要附加 picturebox 的图像。\n4. 点击 `OK` 按钮。\n\n一旦你完成了上述更改，你将看到以下输出\n\
  \n**输出：**\n\n![](img/image00159.jpeg) 从输出中，你可以清楚地看到表单上显示了一张图像。\n\n### 总结\n\nWindows\
  \ 窗单应用程序是一种运行在计算机桌面上的程序。可以使用 Visual Studio 配合 C# 创建 Windows Forms 应用程序。\n\n可以通过\
  \ Visual Studio 中的工具箱向 Windows 窗单添加控件。诸如标签（labels）、复选框（checkboxes）、单选按钮（radio buttons）等控件可以通过工具箱添加到表单中。\n\
  \n还可以使用高级控件，如 `treeview` 控件和 `pictureBox` 控件。\n\n事件处理程序用于响应控件生成的事件。最常见的是为 `button\
  \ clicked`（按钮点击）事件添加的处理器。\n\n# 第 7 章：数据库访问\n\n从数据库访问数据是任何编程语言的重要方面之一。对于任何编程语言来说，具备处理数据库的能力是绝对必要的。C#\
  \ 如此。\n\n它具有处理不同类型数据库的能力。它可以处理最常见的数据库如 `Oracle` 和 `Microsoft SQL Server`。它还具有处理新形式数据库如\
  \ `MongoDB` 和 `MySQL` 的能力。\n\n## 数据库连接的基础\n\nC# 和 .Net 具有处理大多数数据库的能力，最常见的是 `Oracle`\
  \ 和 `Microsoft SQL Server`。但对于每个数据库，处理所有数据库背后的逻辑大部分是相同的。\n\n在我们的示例中，我们将查看 `Microsoft\
  \ SQL Server` 作为我们的数据库。为了学习目的，可以下载并使用 `Microsoft SQL Server Express Edition`，这是由微软提供的免费数据库软件。\n\
  \n在与数据库工作时，以下是所有数据库通用的概念。\n\n1. **连接 (Connection)** – 要处理数据库中的数据，第一个显而易见的步骤是连接。数据库的连接通常包含下面的参数。\n\
  \    a. **数据库名称或数据源 (Database name or Data Source)** – 第一个重要参数是需要连接的数据库名称。每个连接一次只能与数据库工作。\n\
  \    b. **凭据 (Credentials)** – 下一个重要方面是用于建立数据库连接的用户名和密码。它确保用户名和密码具有连接到数据库所需的权限。\n\
  \    c. **可选参数 (Optional parameters)** - 对于每种数据库类型，你可以指定可选参数以提供更多关于 `.net` 如何处理到数据库连接的泛。例如，可以指定连接保持活动状态多长时间的参数。如果在一段时间内没有执行操作，则该参数将决定是否必须关闭连接。\n\
  2. **从数据库选择数据 (Selecting data from the database)** – 一旦建立了连接，下一个重要方面就是从数据库中获取数据。C#\
  \ 具有对数据库执行 `SQL` 选择命令的能力。`SQL` 语句可用于从数据库中的特定表中获取数据。\n3. **向数据库插入数据 (Inserting data\
  \ into the database)** – C# 也可以用于向数据库插入记录。对于需要插入数据库的每一行，可以在 C# 中指定值。\n4. **向数据库更新数据\
  \ (Updating data into the database)** – C# 也可以用于更新数据库中的现有记录。对于需要更新到数据库的每一行，可以在 C#\
  \ 中指定新值。\n5. **从数据库删除数据 (Deleting data from a database)** – C# 也可以用于删除数据库中的记录。可以在\
  \ C# 中指定删除哪些行需要删除选择命令。\n\n好了，现在我们已经了解了每个操作的理论，让我们跳转到后续章节，看看我们如何在 C# 中执行数据库操作。\n\n\
  ## .Net 中的连接\n\n让我们现在来看代码，这些代码需要放在那里以创建数据库的连接。在我们的示例中，我们将连接到名为 `Demodb` 的数据库。连接数据库使用的凭据如下所示\n\
  **用户名：** `sa`\n**密码：** `demo123`\n\n我们将看到一个简单的 Windows 窗单应用程序来处理数据库。我们将有一个名为 `Connect`\
  \ 的简单按钮，将用于连接到数据库。\n\n所以，让我们按照以下步骤来实现它\n\n##### 步骤 1) 第一步涉及创建一个新项目。启动 Visual Studio\
