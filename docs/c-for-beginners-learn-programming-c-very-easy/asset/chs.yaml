  \ Windows Form 已经显示。你还可以看到表单上显示了“Hello World”。\n\n## 向表单添加控件\n\n当我们在前面的章节中通过添加标签控件来显示“Hello\
  \ World”时，已经学习过如何向表单添加控件了。\n\n让我们看看 Windows Forms 可用的其他控件，并查看它们的一些常用属性。\n\n在我们的示例中，我们将创建一个具有以下功能的表单：\n\
  \n1. 用户输入姓名和地址的能力。\n2. 选择用户居住城市的选项。\n3. 用户输入性别选项的能力。\n4. 选择用户想要学习的课程的选项。这部分将有 C#\
  \ 和 ASP.Net 两种选择。\n\n所以，让我们详细查看每个控件并添加它们，以构建具有上述功能的表单。\n\n**Group Box（分组框）** – 分组框用于将逻辑控件分组到一个区域。举个例子，如果你有一组控件用于输入个人详细信息，如姓名和地址。理想情况下，这些是人的详细信息，因此你希望将这些信息放在表单上的单独区域中。为了这个目的，你可以使用分组框。让我们看看如何通过下所示的示例来实现它。\n\
  \n**步骤 1)** 第一步是从工具箱中将 `Groupbox` 控件拖到 Windows Form 上，如下所示\n\n![](img/image00133.jpeg)\n\
  \n**步骤 2)** 一旦添加了分组框，点击分组框控件进入属性窗口。在属性窗口中，转到 `Text` 属性并将其更改为“User Details”。\n\n\
  ![](img/image00134.jpeg)\n\n一旦你做了上述更改，你将看到以下输出\n\n**输出：**\n\n![](img/image00135.jpeg)\
