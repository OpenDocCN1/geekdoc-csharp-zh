  \ }\n\n{ “003” , “ASP.Net” }\n\n上面我们有 3 个键值对。每个元素的键分别为 001、002 和 003。每个键值对的值分别为\
  \ “.Net”、“C#”和“ASP.Net”。\n\n让我们更详细地查看 Hashtable 集合可用的操作。\n\n## Hashtable 的声明\n\n\
