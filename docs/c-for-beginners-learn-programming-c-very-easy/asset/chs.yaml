  \n现在让我们看看最后一个控件，即按钮点击。再次遵循相同的逻辑。在窗单设计器中双击按钮，它将为按钮事件添加方法。你只需要添加下面的代码。\n\n1. 这是事件处理方法……你不需要担心方法名的复杂性或传递给方法的参数。\n\
  2. 这里我们获取名称和地址文本框中的值。这些值可以从文本框的 `text` 属性获取。我们将值赋值给两个变量 `name` 和 `address`。\n3.\
  \ 最后，我们使用 `MessageBox` 方法将 `name` 和 `address` 值显示给用户。\n\n完成上述更改并运行程序，你将看到以下输出\n\n\
