  \ true。\n2. 然后，我们使用 `ContainsValue` 方法检查值是否存在于哈希表中。由于值确实存在于哈希表中，该方法将返回 ‘true’。\n\
  \n如果正确输入上述代码并运行程序，将显示以下输出。\n\n从输出中，你可以清楚地看到搜索的键和值都于哈希表中。\n\n### 总结\n\n`ArrayList`\
  \ 集合用于存储一组元素。数组列表集合的优势在于它是动态的。你可以随时向数组列表集合添加或删除元素。\n\n`Stack`（栈）基于后进先出的概念。向栈中添加元素的操作被称为\
  \ `push` 操作。从栈中移除元素的操作被称为 `pop` 操作。\n\n`Queue`（队列）基于先进先出的概念。向队列中添加元素的操作被称为 `enqueue`\
  \ 操作。从队列中移除元素的操作被称为 `dequeue` 操作。`Hashtable` 用于存储由键值对组成的元素。要访问元素的值，你需要知道该元素的键。\n\
  \n# 第 6 章：Windows Forms 应用程序\n\n到目前为止，我们已经学习了如何使用 C# 创建基于控制台的应用程序。但在现实场景中，团队通常使用\
  \ Visual Studio 和 C# 来创建 Windows Forms 或基于 Web 的应用程序。\n\nWindows Forms 应用程序是任何设计在计算机上运行的应用程序。它不会在网络浏览器中运行，因为那样就变成了\
  \ Web 应用程序。\n\n本章将重点关注我们如何创建基于 Windows 的应用程序。我们还将学习一些关于与 Windows 应用程序各种元素操作的基础知识。\n\
  \n## Windows Forms 基础\n\nWindows Forms 应用程序是运行在桌面计算机上的应用程序。Windows Forms 应用程序通常有一组控件，如标签（labels）、文本框（textboxes）、列表框（list\
  \ boxes）等。\n\n下面是一个简单的 Windows Forms 应用程序示例。它显示了一个用户可以访问的简单登录界面。用户将输入凭据，然后点击登录按钮继续。\n\
  \n![](img/image00122.jpeg)这是上述应用程序中可用控件的示例\n\n1. 这是一个标签（label）控件的集合，通常用于描述相邻的控件。在我们的案例中，我们有\
  \ 2 个文本框，标签用于告诉用户一个文本框用于输入用户名，另一个用于输入密码。\n2. 2 个文本框用于存放用户输入的用户名和密码。\n3. 最后，我们有按钮（button）控件。按钮控件通常会附带一些代码以执行特定的操作。例如，在上面的案例中，我们可以让按钮执行验证用户输入的用户名和密码的操作。\n\
