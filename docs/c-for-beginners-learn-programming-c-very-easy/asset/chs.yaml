  \ 流 –Streams – 读取和写入文件\n\n在 C# 文件操作中，通常使用流（streams）来读取和写入文件。流是在应用程序和文件之间创建的额外层。流用于确保对文件进行平滑的读和写操作。\n\
  \n流通常用于从大文件中读取数据。通过使用流，大文件中的数据被分解成小块并发送到流中。这些数据块随后可以从应用程序中读取。\n\n将其分解成小块的原因是因为一次性读取大文件会对性能产生影响。如果你一次性读取例如一个\
  \ 100 MB 文件的数据，你的应用程序可能会挂起并变得不稳定。此时最佳方法是使用流将文件分解成可管理的数据块。\n\n因此，当对文件执行写操作时，要写入的数据首先被写入流中。然后数据从流写入文件。读取操作也是如此。在读取操作中，数据首先从文件传输到流中。然后通过流从应用程序中读取数据。让我们来看一个如何使用流进行读取和写入的示例。\n\
  \n对于我们的示例，我们假设在 D 盘上有一个名为 `Example.txt` 的文件。该文件将是一个简单的文本文件，并包含如下所示的 2 行 Guru99 -\
  \ .Net\n\nGuru99-C#\n\n对于我们的示例，我们将创建一个简单的控制台应用程序并处理文件流。\n\n### 1. 读取器 (Stream Reader)\n\
  – 流读取器用于使用流从文件中读取数据。文件中的数据首先读取到流中。之后，应用程序从流中读取数据。\n\n让我们来看一个如何使用流从文件中读取数据的示例。在 `program.cs`\
  \ 文件中输入以下代码。\n\n![](img/image00202.jpeg)\n**代码解释：**\n\n1. 首先，我们声明了一个流读取器对象。C# 中使用流读取器对象定义从文件到应用程序的流。每当从文件中读取数据时，数据就会从文件推送到流中。使用\
  \ `File.OpenText` 以只读模式打开 `Example.txt` 文件。然后将该文件的句柄发送给流读取器对象。\n2. 接下来，我们定义了一个临时变量\
  \ `s`，它将用于从文件中读取所有数据。\n3. 然后我们使用流读取器方法 `ReadLine` 从流中读取每一行。当我们执行此操作时，每一行都将从文件传输到缓冲区。然后字符串\
  \ `line` 将从缓冲区传输到 `s`。然后我们将该字符串写入控制台。\n\n当设置好上述代码并使用 Visual Studio 运行项目时，你将得到下面的输出。\n\
  \n**输出：**\n\n![](img/image00203.jpeg)从输出中，你可以清楚地看到 Stream Reader 读取了文件中的两行。最后，从流中读取的字符串行被发送到控制台。\n\
  \n### 2. 写入器 (Stream Writer)\n– 流写入器用于使用流向文件写入数据。来自应用程序的数据首先写入流中。然后流将数据写入文件。让我们来看一个如何使用流向文件写入数据的示例。在\
  \ `program.cs` 文件中输入以下代码。\n\n![](img/image00204.jpeg)\n**代码解释：**\n\n1. 首先，我们声明了一个流写入器对象。C#\
  \ 中使用流写入器对象定义一个流。然后使用该流将数据从应用程序写入文件。每当需要写入数据时，这些数据就会从应用程序推送到流中。使用 `File.AppendText`\
  \ 命令以追加模式打开 `Example.txt` 文件。然后将该文件的句柄发送给流写入器对象。\n2. 我们使用流写入方法 `Weline` 将行 `Guru99\
  \ – ASP.Net` 写入流中。从流中，该行随后被写入文件。\n3. 然后我们在写入文件后关闭流写入器。通常情况下，当文件不再需要写入时，关闭文件句柄是一个良好的习惯。\n\
  4. 最后，我们再次读取文件内容并将其写入控制台日志。这是为了检查该行是否真的写入了文件。\n\n当设置好上述代码并使用 Visual Studio 运行项目时，你将得到下面的输出。\n\
  \n**输出：**\n\n![](img/image00205.jpeg)从输出中，你可以看到行 `Guru99 – ASP.Net` 已成功添加到文件中。所有\
  \ 3 行文本都可以在控制台中清晰地看到。\n\n## C# 序列化 (Serialization)\n\n每当需要将对象数据从一个应用程序发送到另一个应用程序时，就会使用序列化和反序列化的概念。序列化用于将应用程序数据导出到文件中。目标应用程序随后使用反序列化从应用程序中提取数据以供进一步使用。\n\
  \n\n\n\n\n序列化（Serialization）是一个将 C# 类对象写入或序列化到文件的概念。假设你有一个名为 `Tutorial` 的 C# 类。该类有两个属性：`ID`\
  \ 和 `Tutorials` 名称（name）。\n\n序列化可用于将 `Tutorial` 类的数据属性直接写入文件。反序列化（Deserialization）则用于从文件中读取数据并重新构建\
  \ `Tutorial` 对象。\n\n让我们来看如何实现这一点的示例。\n\n在示例中，我们将在代码中执行以下层级步骤：\n1. 创建一个名为 `Tutorial`\
  \ 的类，它包含 2 个属性，即 `ID` 和 `Name`。\n2. 随后我们将从该类创建一个对象，并给 `ID` 属性赋值“1”，给 `name` 属性赋值“.Net”。\n\
  3. 接着，我们将使用序列化将上述对象序列化到名为 `Example.txt` 的文件中。\n4. 最后，我们将使用反序列化从文件中反序列化对象，并在 `Console`\
  \ 中显示这些值。\n\n在控制台应用程序的 `program.cs` 文件中输入以下代码。\n\n### 步骤 1) 第一步是添加将用于序列化的类\n\n![](img/image00206.jpeg)\n\
  \n**代码解释：**\n1. 需要序列化的类必须具有 `[Serializable]` 属性。这是 C# 中的一个关键字。该关键字随后附加到 `Tutorial`\
  \ 类上。如果你没有提及此属性，在尝试序列化该类时将得到错误。\n2. 接下来是将被序列化的类的定义。在这里我们定义了一个名为“Tutorial”的类，并提供了\
  \ 2 个属性，一个是“ID”，另一个是“Name”。\n\n### 步骤 2) 在这一步中，我们首先创建 `Tutorial` 类的对象并将其序列化到名为 `Example.txt`\
  \ 的文件中\n\n![](img/image00207.jpeg)\n\n**代码解释：**\n1. 首先，我们创建 `Tutorial` 类的对象。然后我们为\
  \ `ID` 赋值“1”，为 `name` 属性赋值“.net”。\n2. 接着，我们使用 `formatter` 类，该类用于将对象序列化或转换为二进制格式。序列化文件中的数据是以二进制格式处理的。接下来，我们创建一个文件流（file\
  \ stream）对象。该文件流对象用于以写入目的打开文件 `Example.txt`。关键字 `FileMode.Create` 和 `FileMode.Write`\
  \ 用于专门指定应以写入目的打开该文件。\n3. 最后，我们使用 `Serialize` 方法将二进制数据传输到文件。由于写入操作已完成，我们关闭了流。\n\n\
  ### 步骤 3) 最后，为了确保数据存在于，我们使用反序列化从文件中反序列化对象。\n\n![](img/image00208.jpeg)\n\n**代码解释：**\n\
  1. 我们创建对象 `stream` 以只读模式打开文件 `Example.txt`。\n2. 接着我们使用 `formatter` 类，该类用于反序列化存储在\
  \ `Example.txt` 文件中的对象。返回的对象被设置为对象 `objnew`。\n3. 最后，我们使用“ID”和“name”属性向控制台显示对象 `objnew`\
  \ 的属性。\n\n当设置好代码并使用 Visual Studio 运行项目时，你将得到以下输出。\n\n**输出：**\n![](img/image00209.jpeg)\
  \ 你可以从上述输出看到，来自文件的值已已正确反序列化并显示在控制台中。\n\n### 总结\n\nC# 提供了许多可以在文件上执行的文件操作。这些操作大部分都是\
  \ `File` 类的一部分。\n\n如果你想从文件中读取数据，可以使用 `File.ReadAlltext` 或 `File.ReadAllLines` 方法。\n\
  \n流（Streams）被用应用程序和文件之间的中间层。\n\n当需要从文件中读取数据时，使用 `StreamReader`。当需要将数据写入文件时，使用 `Streamwriter`。序列化用于将类对象写入文件。反序列化用于从文件中恢复对象。\n\
  \n"
