  \ – 接下来是标签控件。标签控件用于在表单上向用户显示文本或消息。标签控件通常与其他控件一起使用。常见的例子是标签与文本框（textbox）控件一起添加。\n\
  \n标签向用户指示文本框中预期填入什么内容。让我们看看如何通过下所示的示例来实现。我们将添加两个标签，一个命名为“name”，另一个命名为“address”。它们将与稍后部分添加的文本框控件配合使用。\n\
  \n**步骤 1)** 第一步是从工具箱中将标签控件拖到 Windows Form 上，如下所示。确保你拖动 2 次标签控件，这样你就可以拥有一个用于“name”，另一个用于“address”。\n\
  \n![](img/image00136.jpeg) **步骤 2)** 一旦添加了标签，点击标签控件进入属性窗口。在属性窗口中，转到每个标签的 `Text`\
  \ 属性。\n\n一旦你做了上述更改，你将看到以下输出\n\n**输出：**\n\n![](img/image00137.jpeg) 你实际上可以看到添加到表单上的标签控件。\n\
  \n**Textbox（文本框）** – 文本框用于允许用户在表单上输入某些文本。让我们看看如何通过下所示的示例来实现它。我们将向表单添加 2 个文本框，一个用于姓名，另一个用于用户输入的地址。\n\
