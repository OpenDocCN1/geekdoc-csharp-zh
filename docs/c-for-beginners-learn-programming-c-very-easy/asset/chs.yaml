  \n**步骤 1)** 第一步涉及在 Visual Studio 中创建一个新项目。启动 Visual Studio 后，你需要选择菜单选项 New->Project（新建->项目）。\n\
  \n![](img/image00123.jpeg)**步骤 2)** 下一步是将项目类型选择为 Windows Forms 。在这里我们还需要指定项目的名称和位置。![](img/image00124.jpeg)\n\
  \n\n\n\n\n1. 在项目对话框中，我们可以看到在 Visual Studio 中创建不同类型项目的各种选项。点击左侧的 `Windows` 选项。\n\n\
  2. 当我们点击上一步中的 `Windows` 选项时，我们将看到 `Windows Forms Application` 选项。点击此选项。\n\n3. 然后我们为应用程序命名，在我们的案例中名称为\
