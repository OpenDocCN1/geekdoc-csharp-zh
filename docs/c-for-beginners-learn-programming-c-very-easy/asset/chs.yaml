  \n## 使用数据网格 (DataGrids)\n\n数据格用于以网格格式显示表中的数据。当用户看到表数据时，他们通常更倾向于一次看到所有的表行。如果能在表单上以网格显示数据，就可以实现这一点。\n\
  \nC# 和 Visual Studio 有内置的数据网格，这些可以用于显示数据。让我们来看一个示例。在我们的示例中，将有一个数据格，用于显示 `demotb`\
  \ 表中的 `Tutorial ID` 和 `Tutorial Name` 值。\n\n### 步骤 1\n从工具箱将 `DataGridView` 控件拖动到\
  \ Visual Studio 的 `Form` 上。`DataGridView` 控件在 Visual Studio 中用于以网格格式显示表的行。\n\n![](img/image00191.jpeg)\n\
  \n### 步骤 2\n在下一步中，我们需要将数据格连接到数据库。在上一节中，我们创建了一个项目数据源。让我们在示例中使用相同的数据源。\n\n1. 首先，你需要选择网格并点击网格中的箭头。这将弹出网格配置选项。\n\
  2. 在配置选项中，只需选择数据源为 `demotbBindingSource`，这是我们在前面的部分创建的数据源。\n\n![](img/image00192.jpeg)\n\
  \n如果按照所示执行所有上述步骤，你将获得下面的输出。\n\n**输出：**\n\n![](img/image00193.jpeg)从输出中，你可以清楚地看到网格已由数据库中的值填充。\n\
  \n### 总结\n\nC# 有能力与 Oracle 和 Microsoft SQL Server 等数据库工作。\n\nC# 拥有处理数据库所需的所有命令。这涉及建立与数据库的连接。你可以使用\
  \ C# 中的命令执行 `select`、`update`、`insert` 和 `delete` 等操作。C# 中的 `reader` 对象用于保存数据库返回的所有数据。C#\
  \ 中的 `While` 循环可以一次读取一次数据行。`data adapter` 对象用于对数据库执行 `insert`、`delete` 和 `update`\
  \ 等 SQL 操作。\n\nC# 有能力将控件绑定到表中的各种字段。它们通过在 C# 中定义数据源进行绑定。数据源用于从数据库中提取数据并填充到控件中。\n\n\
  `binding navigator` 用于自动在表的行之间导航。\n\nC# 中的 `data grid` 有能力连接到数据库并以网格格式显示表中的所有值。\n\
  \n# 第 8 章：文件操作\n\nC# 拥有广泛的文件操作。这些操作包括打开文件、读取文件或写入文件。\n\n在某些情况下，你可能想要直接处理文件，在这种情况下你将使用\
  \ C# 提供的文件操作。\n\n下面列出了一些基本文件操作。\n\n1. `Reading`（读取）—— 此操作是从文件中读取数据的基本操作。\n2. `Writing`（写入）——\
  \ 此操作是将数据写入文件的基本操作。默认情况下，文件中所有现有内容将被删除，并写入新内容。\n3. `Appending`（追加）—— 此操作也涉及向文件写入信息。唯一的区别是文件中的现有数据不会被覆盖。要写入的新数据将添加到文件的末尾。\n\
  \n## 基础文件 I/O 命令\n\nC# 和 .Net 有能力通过几个 File/O 命令来处理文件。让我们来看其中的一些命令。对于我们的示例，我们假设 D\
