  \n![](img/image00104.jpeg)\n\n从输出中我们可以清楚地看到两个方法都成功被调用。正因如此，字符串 `\"First Tutorial\"\
  ` 和 `\"Second Tutorial\"` 被发送到了控制台。\n\n## C# 抽象类\n\n抽象类用于定义所谓的基类（base class）。基类是针对特定需求具有最基本定义的类。\n\
  \n下面是一个抽象类的典型示例。以下是名为 `Animal` 的类的定义。当 `Animal` 类被定义时，关于动物一无所知，无论它是狗还是猫。`description()`\
  \ 方法只是为该类定义的一个通用方法。\n\n![](img/image00105.jpeg)\n\n现在，当确定了 `Animal` 具体是什么时，我们创建另一个继承自基类的类。如果我们知道动物是一只狗，我们就创建一个继承基类的\
  \ `Dog` 类。这里的关键区别是 `Dog` 类不能更改 `Animal` 类中 `description` 方法的定义。\n\n让我们看看如何修改代码以包含抽象类。注意我们将不会运行代码，因为抽象类是无法直接运行的。\n\
  \n### 步骤 1)\n作为第一步，让我们创建一个抽象类。该类将是 `Tutorial` 且只包含一个方法。所有代码都需要写在 `Program.cs` 文件中。\n\
  \n![](img/image00107.jpeg)**代码解释：**\n\n1. 我们首先定义抽象类。注意 `abstract` 关键字的使用。它用于表示该类是一个抽象类。\n\
  2. 接下来，我们定义了一个什么都不做的方法。该方法必须带有 `virtual` 关键字。这意味着该方法不能被子类更改。\n\n### 步骤 2)\n现在添加我们的子类。这段代码被添加到\
  \ `Program.cs` 文件中。\n\n![](img/image00108.jpeg)这段代码没有特别之处。我们只是定义了一个名为 `Guru99Tutorial`\
  \ 的类，它继承自抽象的 `Tutorial` 类。然后我们定义了与之前使用的相同的方法。\n\n**注意**：在这里我们不能更改在 `Tutorial` 类中定义的\
  \ `Set` 方法的定义。在 `Tutorial` 类中，我们定义了一个名为 `public void Set()` 方法。由于该方法是抽象类的一部分，我们不允许在\
  \ `Guru99Tutorial` 类中再次定义 `Set` 方法。\n\nC# 接口\n\n接口与类一起使用，用于定义所谓的合同（contract）。合同是关于类将为应用程序提供内容的约定。接口声明属性和方法。具体方法将做什么，由类来定义。\n\
  \n让我们通过修改控制台应用程序中的类来看查看接口的示例。注意我们将不会运行代码，因为接口是无法直接运行的。\n\n让我们创建一个接口类。该类将是 `Guru99Interface`。我们的主类随后将扩展定义的接口。所有代码都需要写在\
  \ `Program.cs` 文件中。\n\n![](img/image00109.jpeg)**代码解释：**\n\n1. 我们首先定义了一个名为 `Guru99Interface`\
  \ 的接口。注意 `interface` 关键字用于定义接口。\n\n\n\n\n\n2. 接下来，我们将定义将供接口使用的方法。在这种情况下，我们定义了与之前所有示例中使用的相同方法。注意，接口只声明了方法，而不定义方法中的代码。\n\
  \n3. 接着，我们让我们的 `Guru99Tutorial` 类继承接口。在这里，我们实际上编写了定义接口中声明的各种方法的代码。这种编码方式实现了以下效果：\n\
  \n它确保了类 `Guru99Tutorial` 只添加了 `SetTutorial` 和 `GetTutorial` 方法所需的代码，而不包含任何其他代码。它还确保了接口表现像一份合同。类必须遵守该合同。因此，如果合同规定它应该有两个名为\
  \ `SetTutorial` 和 `GetTutorial` 的方法，那么它就必须是这样。\n\n### 总结\n\n类是数据属性和方法的封装。属性用于定义类中数据的类型。方法定义了可以在数据上执行的操作。\n\
  \n构造函数用于在每次创建对象时初始化类的字段。\n\n构造函数是一个与类本身同名的方法。继承是子类继承父类的字段和方法的过程。子类随后也可以定义它自己的方法。\n\
  \n多态是指一个方法可以定义多次的概念。唯一的区别是传递给方法的参数数量。\n\n抽象类是一个基类，它包含了类应该具备的最基本要求。子类无法继承基类的方法。\n\
  \n接口定义了一个类将遵守的合同。接口定义了类可以执行的操作。\n\n# 第 5 章：C# 集合\n\n在之前的一个章节中，我们学习了如何在 C# 中使用数组。让我们快速回顾一下，编程中的数组被用于组织一组相关的对象。因此，人们可以创建一个\
  \ `Integers` 数组或集合，并通过一个变量名进行访问。\n\n集合与数组类似，它提供了一种更灵活的方式来处理一组对象。\n\n在数组中，你可能注意到你需要预先定义数组元素的数量。这必须在声明数组时完成。\n\
  \n但在集合中，你不需要预先定义集合的大小。你可以在任何时候向集合中添加甚至移除元素。本章将重点介绍我们如何使用 C# 中提供的不同集合。\n\n## C# ArrayList\n\
