    # 1. **整数 (Integer)**

    整数数据类型用于处理数字。在这种情况下，数字是像 10、20 或 30 这样的整数。在 C# 中，该数据类型由 `Int32` 关键字表示。下面是如何使用此数据类型的示例。在示例中，我们将定义一个名为
    `num` 的 `Int32` 变量。然后为该变量赋值一个 `Integer` 值，并相应地显示它。


    ![](img/image00061.jpeg)

    **代码解释：**


    1. 指定 `Int32` 数据类型来声明一个名为 `num` 的整数变量。然后给该变量赋值为 30。

