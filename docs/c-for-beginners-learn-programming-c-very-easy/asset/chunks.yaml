    所以，让我们详细查看每个控件并添加它们，以构建具有上述功能的表单。


    **Group Box（分组框）** – 分组框用于将逻辑控件分组到一个区域。举个例子，如果你有一组控件用于输入个人详细信息，如姓名和地址。理想情况下，这些是人的详细信息，因此你希望将这些信息放在表单上的单独区域中。为了这个目的，你可以使用分组框。让我们看看如何通过下所示的示例来实现它。


