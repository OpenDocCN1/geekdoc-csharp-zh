    Let’s now see how we can incorporate fields and methods in our code. **Step 1)**
    The first step is to ensure the `Tutorial` class has the right fields and methods
    defined. In this step, we add the below code to the `Tutorial.cs` file.


    ![](Images/image00091.jpeg) **Code Explanation:**


    1. The first step is to add the fields of `TutorialID` and `TutorialName` to the
    class file. Since the `TutorialID` field will be a number, we define it as an
    `Integer`, while `TutorialName` will be defined as `string`.


    2. Next, we define the `SetTutorial` method. This method accepts 2 parameters.
    So if `Program.cs` calls the `SetTutorial` method, it would need to provide the
    values to these parameters. These values will be used to set the fields of the
    `Tutorial` object.


    **Note**:-Let’s take an example and assume our `Program.cs` file calls the `SetTutorial`
    with the parameters “1” and “.Net”. The below steps would be executed as a result
    of this,


    a. The value of `pID` would become 1


    b. The value of `pName` would be .Net.


    c. In the `SetTutorial` method, these values would then be passed to `TutorialID`
    and `TutorialName`.


    d. So now `TutorialID` would have a value of 1 and `TutorialName` would have a
    value of “.Net”.


    3. Here we set the fields of the `Tutorial` class to the parameters accordingly.
    So we set `TutorialID` to `pID` and `TutorialName` to `Pname`.


    4. We then define the `GetTutorial` method to return value of the type “String”.
    This method will be used to return the `TutorialName` to the calling program.
    Likewise, you can also get the tutorial id with method `Int GetTutorial` 5. Here
    we return the value of the `TutorialName` field to the calling program.


    **Step 2)** Now let’s add code to our `Program.cs`, which is our Console application.
    The Console application will be used to create an object of the “Tutorial class”
    and call the `SetTutorial` and `GetTutorial` methods accordingly.


    ( **Note**:- An object is an instance of a class at any given time. The difference
    between a class and an object is that the object actually contains values for
    the properties.)


    ![](Images/image00092.jpeg) **Code Explanation:**


    1. The first step is to create an object for the `Tutorial` class. Mark here that
    this is done by using the keyword ‘new’. The ‘new’ keyword is used to create an
    object from a class in C#. The object is then assigned to the `pTutor` variable.


    2. The method `SetTutorial` is then called. The parameters of 1 and “.Net” are
    passed to the `SetTutorial` method. These will then be used to set the “TutorialID”
    and “TutorialName” fields of the class accordingly.


    3. We then use the `GetTutorial` method of the `Tutorial` class to get the `TutorialName`.
    This is then displayed to the console via the `Console.WriteLine` method.


    If the above code is entered properly and the program is run the following output
    will be displayed.


    **Output:**


    ![](Images/image00093.jpeg)From the output, you can clearly see that the string
    “.Net” was returned by the `GetTutorial` method.


    ## Access Modifiers


    Access Modifiers are used to define the visibility of a class property or method.
    There are times when you may not want other programs to see the properties or
    the methods of class. In such cases, C# gives the ability to put modifiers on
    class properties and methods. The class modifiers have the ability to restrict
    access so that other programs cannot see the properties or methods of a class.


    There are generally 3 types of access modifiers. They are explained below.


    1. **Private** – When this access modifier is attached to either a property or
    a method, it means that those members cannot be accessed from any external program.


    Let’s take an example and see what happens when we use the private access modifier.


    Let’s modify the current code in our `Tutorial.cs` file. In the `SetTutorial`
    method, let’s change the `public` keyword to `private`.


    ![](Images/image00094.jpeg)


    Now let’s switchover to our `Program.cs` file. You will notice that there is a
    red squiggly line under the `SetTutorial` method.


    Since we have now declared the `SetTutorial` method as `private` in our `Tutorial`
    class, Visual Studio has detected this. It has told the user by highlighting it
    that now this method will not work from the `Program.cs` file.


    ![](Images/image00095.jpeg)


    2. **Public** – When this access modifier is attached to either a property or
    a method, it means that those members can be accessed from any external program.
    We have already seen this in our earlier examples.


    ![](Images/image00096.jpeg)Since we have defined our methods as `public` in the
    `Tutorial` class, they have the ability to be accessed from the `Program.cs` file.


    3. **Protected** - When this access modifier is attached to either a property
    or a method, it means that those members can be accessed only by classes inherited
    from the current class. This will be explained in more detail in the Inheritance
    class.


    ## C# Constructor


    Constructors are used to initialize the values of class fields when their corresponding
    objects are created. A constructor is a method which has the same name as that
    of the class. If a constructor is defined in class, then it will the first method
    which is called when an object is created. Suppose if we had a class called `Employee`.
    The constructor method would also be named as `Employee()`.


    The following key things need to be noted about constructor methods 1. The access
    modifier for the constructor needs to be made as `public`. 2. There should be
    no return type for the constructor method.


    Let’s now see how we can incorporate the user of constructors in our code. We
    will use constructors to initialize the `TutorialID` and `TutorialName` fields
    to some default values when the object is created.


    **Step 1)** The first step is to create the constructor for our `Tutorial` class.
    In this step, we add the below code to the `Tutorial.cs` file.


    ![](Images/image00097.jpeg) **Code Explanation:**


    1. We first add a new method which has the same name as that of the class. Because
    it is the same name as the class, C# treats this as a constructor method. So now
    whenever the calling method creates an object of this class, this method will
    be called by default.


    2. In the `Tutorial` constructor, we are setting the value of `TutorialID` to
    0 and `TutorialName` to “Default”. So whenever an object is created, these fields
    will always have these default values.


    Now let’s switchover to our `Program.cs` file and just remove the line, which
    calls the `SetTutorial` method. This is because we want to just see how the constructor
    works.


    ![](Images/image00098.jpeg) **Code Explanation:**


    1. The first step is to create an object for the `Tutorial` class. This is done
    via the ‘new’ keyword.


    2. We use the `GetTutorial` method of the `Tutorial` class to get the `TutorialName`.
    This is then displayed to the console via the `Console.WriteLine` method.


    If the above code is entered properly and the program is executed, the following
    output will be displayed.


    **Output:**


