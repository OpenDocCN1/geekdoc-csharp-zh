    **Label Control（标签控件）** – 接下来是标签控件。标签控件用于在表单上向用户显示文本或消息。标签控件通常与其他控件一起使用。常见的例子是标签与文本框（textbox）控件一起添加。


    标签向用户指示文本框中预期填入什么内容。让我们看看如何通过下所示的示例来实现。我们将添加两个标签，一个命名为“name”，另一个命名为“address”。它们将与稍后部分添加的文本框控件配合使用。


