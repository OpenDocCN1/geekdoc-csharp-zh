  trans: "\n\nc. 我们接着定义一个字符串变量 SQL，用于存储我们的 SQL 命令字符串。\n\n2. 下一步是实际定义将用于我们数据库的 SQL\
    \ 语句。在我们的案例中，我们正在发布一个更新语句，这将会将 `Tutorial` 名称更新为“VB.Net Complete”，而 `TutorialID`\
    \ 保持不变并维持为 3。\n\n3. 接下来，我们将创建命令对象，它用于在数据库上执行 SQL 语句。在 SQL 命令中，你传递了连接对象和 SQL 字符串。\n\
    \n4. 在我们的数据适配器命令中，我们现在将插入 SQL 命令与我们的适配器关联。随后我们调用了 `ExecuteNonQuery` 方法，它用于对我们的数据库执行更新语句。\n\
    \n5. 我们最后关闭所有与数据库操作相关的对象。记住，这始终是一个良好的做法。\n\n设置好上述代码并使用 Visual Studio 执行项目，你将获得下面的输出。表单显示后，点击\
    \ Connect 按钮。**输出：**\n\n![](img/image00172.jpeg)如果你确实进入 SQL Server Express 并查看\
    \ `demotb` 表中的行，你将看到该行已成功更新，如下所示。\n\n![](img/image00173.jpeg)\n\n## 删除记录\n\n与访问数据一样，C#\
    \ 同样能够从数据库中删除现有记录。为了演示如何删除数据库中的记录，让我们采用与上面相同的表结构。\n\n| TutorialID | TutorialName\
    \ |\n| :--- | :--- |\n| 1 | C# |\n| 2 | ASP.Net |\n| 3 | VB.Net complete |\n\n\
    让我们让我们更改表单中的代码，以便我们可以删除以下行：\n\n| TutorialID | TutorialName |\n| :--- | :--- |\n\
    | 3 | VB.Net complete |\n\n因此，让我们向程序中添加以下代码。下面的代码段将用于删除我们数据库中的现有记录。\n\n![](img/image00174.jpeg)\
    \ **代码解释：**\n\n1. 这段代码中的主要区别在于，我们现在正在发布删除 SQL 语句。该删除语句用于删除 `demotb` 表中 `TutorialID`\
    \ 值为 3 的行。\n\n2. 在我们的数据适配器命令中，我们现在将插入 SQL 命令与我们的适配器关联。随后我们调用了 `ExecuteNonQuery`\
    \ 方法，它用于对我们的数据库执行删除语句。\n\n设置好上述代码并使用 Visual Studio 执行项目，你将获得下面的输出。表单显示后，点击 Connect\
    \ 按钮。\n\n**输出：**\n\n![](img/image00175.jpeg)如果你确实进入 SQL Server Express 并查看 `demotb`\
    \ 表中的行，你将看到该行已成功删除，如下所示。\n\n![](img/image00176.jpeg)\n\n## 将控件绑定到数据\n\n在早的章节中，我们已经看到了如何使用\
    \ `SQLCommand` 和 `SQLReader` 等 C# 命令从数据库获取数据。我们还看到了如何读取表的每一行，并使用 `messagebox`\
    \ 向用户显示表的内容。\n\n但显然，用户并不希望通过消息框查看数据，而是希望有更好的控件来显示数据。让我们看看表中的以下数据结构：\n\n| TutorialID\
    \ | TutorialName |\n| :--- | :--- |\n| 1 | C# |\n| 2 | ASP.Net |\n| 3 | VB.Net\
    \ complete |\n\n从上述数据结构来看，用户理想情况下希望在 `textbox` 中显示 `TutorialID` 和 Tutorial Name。其次，他们可能希望有某种按钮控件，允许他们跳转到表中的下一条或上一条记录。这需要开发者在端进行一些额外的编码。\n\
    \n好消息是，C# 允许将控件绑定到数据，从而减少额外的编码工作量。这意味着 C# 可以根据表的特定字段自动填充 `textbox` 的值。\n\n因此，你可以在窗体表单中有两个\
    \ textbox。然后你可以将一个 textbox 链接到 `TutorialID` 字段，将另一个 textbox 链接到 `TutorialName`\
    \ 字段。这种链接是在 Visual Studio 设计器本身完成的，你不需要为此编写额外的代码。\n\nVisual Studio 将确保它实际上为你编写了代码以确保链接有效。然后当你运行应用程序时，textbox\
    \ 控件将自动连接到数据库，获取数据并将其显示在 textbox 控件中。实现这一点不需要开发者端编写任何代码。\n\n让我们来看一个如何实现控件绑定的代码示例。\n\
    \n在我们的示例中，将在窗体表单上创建 2 个 textbox。它们将分别代表 Tutorial ID 和 Tutorial Name。它们将相应地绑定到数据库的\
    \ `TutorialID` 和 `TutorialName` 字段。\n\n按照下述步骤来实现这一目标。\n\n### 步骤 1) 构建基础表单\n在表单中拖放\
    \ 2 个组件——标签（labels）和 textbox。然后执行以下步骤\n\n1. 将第一个 label 的文本值设置为 `TutorialID`\n\
    2. 将第二个 label 的文本值设置为 `TutorialName`\n3. 将第一个 textbox 的 name 属性设置为 `txtID`\n4.\
    \ 将第二个 textbox 的 name 属性设置为 `txtName`\n\n下面是执行上述步骤后表单的样子。\n\n![](img/image00177.jpeg)\n\
    \n### 步骤 2) 下一步是在表单中添加绑定导航器（binding Navigator）\n绑定导航器控件具有自动在表的每一行导航的能力。要添加绑定导航器，只需进入工具箱将其拖拖到表单上。\n\
    \n![](img/image00178.jpeg)\n\n### 步骤 3) 下一步是实际为我们的数据库添加绑定\n这可以通过点击任何 Textbox 控件并点击\
    \ `DataBindings>Text` 属性来实现。Binding Navigator 用于建立从你的应用程序到数据库的链接。\n\n当你执行此步骤时，Visual\
    \ Studio 将自动向应用程序中添加所需的代码，以确保应用程序连接到数据库。通常，Visual Studio 中的数据库被称为 `Project Data\
    \ Source`（项目数据源）。因此，为了确保应用程序与数据库之间建立连接，第一步是创建一个项目数据源。\n\n将出现以下屏幕。点击链接“Add Project\
    \ Data Source”。当你点击项目数据源时，将弹出一个向导，允许你定义数据库连接。\n\n### 步骤 4) 一旦点击 Add Project Data\
    \ Source 链接\n你将看到一个向导，用于创建到 `demotb` 数据库的连接。下面的步骤详细显示了在向导每个步骤中需要配置的内容。\n\n1. 在弹出的窗口中，选择数据源类型为\
    \ `Database`，然后点击 next 按钮。\n2. 在下一个屏幕中，你需要开始创建到数据库的连接字符串。应用程序需要连接字符串来建立数据库连接。它包含了服务器名称、数据库名称和驱动程序名称等参数。\n\
    \   a. 点击 `New connection` 按钮\n   b. 选择数据源为 `Microsoft SQL Server`\n   c. 点击 `Continue`\
    \ 按钮。\n\n   ![](img/image00179.jpeg)\n3. 接下来，你需要添加连接数据库的凭据：\n   a. 选择 SQL Server\
    \ 所在的服务器名称\n   b. 输入连接数据库的的用户 ID 和密码\n   c. 选择数据库为 `demotb`\n   d. 点击 ‘ok’ 按钮。\n\
    \n![](img/image00180.jpeg)\n\n4. 在此屏幕中，我们将确认在之前的屏幕上执行的所有设置。\n   a. 选择选项“Yes”以在连接字符串中包含敏感数据\n\
    \   b. 点击“Next”按钮。\n\n   ![](img/image00181.jpeg)\n\n5. 在下一个屏幕中，点击 `Next` 按钮确认连接字符串的创建\n\
    \n   ![](img/image00182.jpeg)\n\n6. 在这一步中：\n   1. 选择 `Demotb` 的表，它们将在下一个屏幕中显示。\n\
    \   2. 此表现在将成为 C# 项目中的可用数据源。\n\n![](img/image00183.jpeg)\n"
