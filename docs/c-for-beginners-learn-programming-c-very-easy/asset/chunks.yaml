    # Chapter 4: Class and Object


    C# is based on the C++ programming language. Hence, the C# programming language
    has in-built support for classes and objects. Class is nothing but an encapsulation
    of properties and methods that are used to represent a real-time entity.


    For an example, if you want to work with employee’s data in a particular application.


    The properties of the employee would be the ID and name of the employee. The methods
    would include the entry and modification of employee data. All of these operations
    can be represented as a class in C#. In this chapter, we will look at how we can
    work with classes and objects in C# in more detail.


    ## **What are classes and objects**


    Let’s first begin with classes.


    As we discussed earlier classes are an encapsulation of **data


    properties** and **data methods**.


    The properties are used to describe the data the class will be holding. The methods
    tells what are the operations that can be performed on the data.


    To get a better understanding of class and objects, let’s look at an example below
    of how a class would look like.


    The name of the class is “Tutorial”. The class has the following properties


    1\. **Tutorial ID** – This will be used to store a unique number which would represent
    the Tutorial.


    2\. **Tutorial Name** – This will be used to store the name of the tutorial as
    a string.


    A class also comprises of methods. Our class has the following methods,


    1\. **SetTutorial** – This method would be used to set the ID and name of the
