    ## C# 枚举 (Enumeration)

    枚举在任何编程语言中用于定义一组常量值。例如，可以将星期的几天定义为枚举并在程序的任何地方使用。在 C# 中，枚举通过关键字 `enum` 的帮助来定义。


    让我们一个如何使用 `enum` 关键字的示例。

    在示例中，我们将定义一个名为 `days` 的枚举，它用于存储星期的几天。对于每个示例，我们只修改 `Program.cs` 文件中的 main 函数。


    ![](img/image00067.jpeg)

