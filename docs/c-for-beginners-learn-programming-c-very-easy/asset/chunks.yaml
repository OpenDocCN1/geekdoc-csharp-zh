    序列化（Serialization）是一个将 C# 类对象写入或序列化到文件的概念。假设你有一个名为 `Tutorial` 的 C# 类。该类有两个属性：`ID`
    和 `Tutorials` 名称（name）。


    序列化可用于将 `Tutorial` 类的数据属性直接写入文件。反序列化（Deserialization）则用于从文件中读取数据并重新构建 `Tutorial`
    对象。


    让我们来看如何实现这一点的示例。


    在示例中，我们将在代码中执行以下层级步骤：

    1. 创建一个名为 `Tutorial` 的类，它包含 2 个属性，即 `ID` 和 `Name`。

    2. 随后我们将从该类创建一个对象，并给 `ID` 属性赋值“1”，给 `name` 属性赋值“.Net”。

    3. 接着，我们将使用序列化将上述对象序列化到名为 `Example.txt` 的文件中。

    4. 最后，我们将使用反序列化从文件中反序列化对象，并在 `Console` 中显示这些值。


    在控制台应用程序的 `program.cs` 文件中输入以下代码。


    ### 步骤 1) 第一步是添加将用于序列化的类


    ![](img/image00206.jpeg)


    **代码解释：**

    1. 需要序列化的类必须具有 `[Serializable]` 属性。这是 C# 中的一个关键字。该关键字随后附加到 `Tutorial` 类上。如果你没有提及此属性，在尝试序列化该类时将得到错误。

    2. 接下来是将被序列化的类的定义。在这里我们定义了一个名为“Tutorial”的类，并提供了 2 个属性，一个是“ID”，另一个是“Name”。


    ### 步骤 2) 在这一步中，我们首先创建 `Tutorial` 类的对象并将其序列化到名为 `Example.txt` 的文件中


    ![](img/image00207.jpeg)


    **代码解释：**

    1. 首先，我们创建 `Tutorial` 类的对象。然后我们为 `ID` 赋值“1”，为 `name` 属性赋值“.net”。

    2. 接着，我们使用 `formatter` 类，该类用于将对象序列化或转换为二进制格式。序列化文件中的数据是以二进制格式处理的。接下来，我们创建一个文件流（file
    stream）对象。该文件流对象用于以写入目的打开文件 `Example.txt`。关键字 `FileMode.Create` 和 `FileMode.Write`
    用于专门指定应以写入目的打开该文件。

    3. 最后，我们使用 `Serialize` 方法将二进制数据传输到文件。由于写入操作已完成，我们关闭了流。


    ### 步骤 3) 最后，为了确保数据存在于，我们使用反序列化从文件中反序列化对象。


    ![](img/image00208.jpeg)


    **代码解释：**

    1. 我们创建对象 `stream` 以只读模式打开文件 `Example.txt`。

    2. 接着我们使用 `formatter` 类，该类用于反序列化存储在 `Example.txt` 文件中的对象。返回的对象被设置为对象 `objnew`。

    3. 最后，我们使用“ID”和“name”属性向控制台显示对象 `objnew` 的属性。


    当设置好代码并使用 Visual Studio 运行项目时，你将得到以下输出。


    **输出：**

    ![](img/image00209.jpeg) 你可以从上述输出看到，来自文件的值已已正确反序列化并显示在控制台中。


    ### 总结


    C# 提供了许多可以在文件上执行的文件操作。这些操作大部分都是 `File` 类的一部分。


    如果你想从文件中读取数据，可以使用 `File.ReadAlltext` 或 `File.ReadAllLines` 方法。


    流（Streams）被用应用程序和文件之间的中间层。


    当需要从文件中读取数据时，使用 `StreamReader`。当需要将数据写入文件时，使用 `Streamwriter`。序列化用于将类对象写入文件。反序列化用于从文件中恢复对象。


