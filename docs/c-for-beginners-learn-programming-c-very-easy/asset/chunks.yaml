    ## C# Event Handling for Controls

    When working with windows form, you can add events to controls. An event is something
    that happens when an action is performed. Probably the most common action is the
    clicking of a button on a form. In Windows forms , you can add code which can
    be used to perform certain actions when a button is pressed on the form.


    Normally when a button is pressed on a form, it means that some processing should
    take place.


    Let’s take a look at one of the event and how it can be handled before we go onto
    the button event scenario.


    The below example will showcase an event for the `Listbox` control. So whenever
    an item is selected in the `listbox` control, a message box should pop up which
    shows the item selected. Let’s perform the following steps to achieve this.


    **Step 1)** Double click on the `Listbox` in the form designer. By doing this,
    Visual Studio will automatically open up the code file for the form. And it will
    automatically add an event method to the code. This event method will be triggered,
    whenever any item in the `listbox` is selected.


    ![](Images/image00150.jpeg)


    Above is the snippet of code which is automatically added by Visual Studio, when
    you double-click the `list box` control on the form. Now let’s add the below section
    of code to this snippet of code, to add the required functionality to the listbox
    event.


    ![](Images/image00151.jpeg)


    1. This is the event handler method which is automatically created by Visual Studio
    when you double-click the `List box` control. You don’t need to worry about the
    complexity of the method name or the parameters passed to the method.

    2. Here we are getting the `SelectedItem` through the `lstCity.SelectedItem` property.
    Remember that `lstCity` is the name of our `Listbox` control. We then use the
    `GetItemText` method to get the actual value of the selected item. We then assign
    this value to the `text` variable.

    3. Finally, we use the `MessageBox` method to display the `text` variable value
    to the user.


    One you make the above changes, and run the program in Visual Studio you will
    see the following output


    **Output:**


    ![](Images/image00152.jpeg)


    From the output, you can clearly see that when any item from the listbox is selected,
    a message box will pop. This will show the selected item from the list.


    Now let’s look at the final control which is the button click. Again this follows
    the same philosophy. Just double click the button in the Forms Designer and it
    will automatically add the method for the button event. Then you just need to
    add the below code.


    1. This is the event handler method... You don’t need to worry on the complexity
    of the method name or the parameters passed to the method.

    2. Here we are getting values entered in the name and address textbox. The values
    can be taken from the `text` property of the textbox. We then assign the values
    to 2 variables, `name`, and `address`.

    3. Finally, we use the `MessageBox` method to display the `name` and `address`
    values to the user.


    One you make the above changes, and run the program in Visual Studio you will
    see the following output


    **Output:**


    1. First, enter a value in the name and address field. 2. Then click on the `Submit`
    button. Once you click the button , a message box will pop, and it will correctly
    show you what you entered in the user details.


