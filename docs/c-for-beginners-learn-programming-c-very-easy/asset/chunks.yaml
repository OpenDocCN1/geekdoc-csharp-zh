    \n![](Images/image00068.jpeg)\nFrom the output, you can clearly see that the `'Sun'`\
    \ value of the enumeration is displayed in the console.\n\n## C# Operators and\
    \ Variables\nA variable is a name given to a storage area that is used to store\
