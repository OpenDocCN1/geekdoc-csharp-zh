    `Program.cs` 文件中正常工作。


    ![](img/image00095.jpeg)


    2. **Public (公有)** – 当此访问修饰符附加到属性或方法上时，意味着这些成员可以从任何外部程序访问。我们已经在之前的示例中看到了这一点。


    ![](img/image00096.jpeg) 由于我们已经在 `Tutorial` 类中将方法定义为 `public`，因此它们可以从 `Program.cs`
    文件访问。


    3. **Protected (受保护)** - 当此访问修饰符附加到属性或方法上时，意味着这些成员只能由继承自当前类的类访问。将在继承类中进行更详细解释。


    ## C# 构造函数


    构造函数用于在创建相应对象时初始化类字段的值。构造函数是一个与类名相同的方法。如果类中定义了构造函数，那么它将是对象创建时第一个被调用的方法。假设我们有一个名为
    `Employee` 的类。构造函数方法也将命名为 `Employee()`。


    关于构造方法需要注意以下关键点：1. 构造函数的访问修饰符需要设为 `public`。2. 构造方法不应有返回值。


    现在让我们来看看如何在我们的代码中整合构造函数的使用。我们将使用构造函数在对象创建时将 `TutorialID` 和 `TutorialName` 字段初始化为某些默认值。


    **第 1 )** 第一步是为我们的 `Tutorial` 类创建构造函数。在这一步中，我们将下面的代码添加到 `Tutorial.cs` 文件。


    ![](img/image00097.jpeg) **代码解释：**


    1. 我们首先添加了一个与类名相同的新方法。因为与类名相同，C# 将其视为构造方法。因此，现在每当调用方法创建对象时，该方法都会被默认调用。


    2. 在 `Tutorial` 构造函数中，我们将 `TutorialID` 的值设置为 0，将 `TutorialName` 设置为“Default”。因此当创建对象时，这些字段将始终具有这些默认值。


    现在切换到我们的 `Program.cs` 文件并删除调用 `SetTutorial` 方法的行。这是因为我们只想看看构造函数是如何工作的。


