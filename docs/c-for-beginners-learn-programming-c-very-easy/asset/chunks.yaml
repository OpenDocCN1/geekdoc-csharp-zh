    从输出中你可以清楚地看到控制台上显示了名为 `num` 的整数变量。


    # 2. **双精度浮点数 (Double)**

    double 数据类型用于处理小数。在这种情况下，数字是像 10.11、20.22 或 30.33 这样的数字。在 C# 中，该数据类型由关键字 `Double`
    表示。下面是此数据类型的示例。


    在示例中，我们将定义一个名为 `num` 的 double 变量。然后为该变量赋值一个 `Double` 值，并相应地显示它。


    ![](img/image00062.jpeg)

    **代码解释：**


    1. 指定 double 数据类型来声明一个名为 `num` 的 double 类型变量。然后给该变量赋值为 30.33。

    2. 最后，使用 `console.write` 函数将数字显示在控制台上。


    如果正确输入了上述代码并成功执行程序，将显示以下输出。

    从输出中你可以清楚地看到控制台上显示了名为 `num` 的 double 变量。


    # 3. **布尔值 (Boolean)**

    布尔数据类型用于处理 `true` 和 `false` 的布尔值。在 C# 中，该数据类型由 Boolean 关键字表示。下面是此数据类型的的使用示例。


    在示例中，我们将定义一个名为 `status` 的布尔变量。然后为该变量赋值一个布尔值，并相应地显示它。


    ![](img/image00063.jpeg)

