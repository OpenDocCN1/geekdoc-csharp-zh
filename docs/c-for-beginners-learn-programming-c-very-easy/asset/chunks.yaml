    Because of this, the strings “First Tutorial” and “Second Tutorial” were sent
    to the console.


    ## **C# Abstract classes**


    An abstract class is used to define what is known as a base class. A base class
    is a class which has the most basic definition of a particular requirement.


    A typical example of an abstract class is given below. Below is the definition
    of a class called ‘Animal.‘ When the ‘Animal’ class is defined, there is nothing
    known about the animal, whether it is a dog or a cat. The method called description
    is just a generic method defined for the class.


    ![](Images/image00105.jpeg)


    Now when it is known what exactly the Animal is going to be, we create another
    class which inherits the base class. If we know that the animal is in fact a Dog,
    we create Dog class which inherits the main base class. The key difference here
    is that the Dog class cannot change the definition of the Description method of
    the Animal class. It has to define its own method called Dog-Description. This
    is the basic concept of abstract classes.


    ![](Images/image00106.jpeg)


    Let’s see how we can change our code to include an abstract class. Note that we
    will not be running the code, because there is nothing that can be run using an
    abstract class.


    **Step 1)** As a first step, let’s create an abstract class. The class will be
    called Tutorial and will just have one method. All the code needs to be written
    in the Program.cs file.


    ![](Images/image00107.jpeg)**Code Explanation:**


    1\. We first define the abstract class. Note the use of the abstract keyword.
    This is used to denote that the class is an abstract class.


    2\. Next, we are defining our method which does nothing. The method must have
    the keyword called virtual. This means that the method cannot be changed by the
    child class. This is a basic requirement for any abstract class.


    **Step 2)** Now let’s add our child class. This code is added to the Program.cs
    file.


    ![](Images/image00108.jpeg)There is nothing exceptional about this code. We just
    define a class called


    ‘Guru99Tutorial’ which inherits the abstract Tutorial class. We then define the
    same methods as we have been using from before.


    **Note:** Here we cannot change the definition of the Set method which was defined
    in the Tutorial class. In the Tutorial class, we had defined a method called ‘Set’
    (public virtual void Set()). Since the method was part of the abstract class,
    we are not allowed to define the Set method again in the Guru99Tutorial class.


    ## **C# Interface**


    Interfaces are used along with classes to define what is known as a contract.
    A contract is an agreement on what the class will provide to an application. An
    interface declares the properties and methods. It is up to the class to define
    exactly what the method will do.


    Let’s look at an example of an interface by changing the classes in our Console
    application. Note that we will not be running the code, because there is nothing
    that can be run using an interface.


    Let’s create an interface class. The class will be called “Guru99Interface.” Our
    main class will then extend the defined interface. All the code needs to be written
    in the Program.cs file.


    ![](Images/image00109.jpeg)**Code Explanation:**


    1\. We first define an interface called “Guru99Interface.” Note that the keyword
    “interface” is used to define an interface.'
