    ## Adding Controls to a form


    We had already seen how to add a control to a form when we added the label control
    in the earlier section to display “Hello World.”


    Let’s look at the other controls available for Windows forms and see some of their
    common properties.


    In our example, we will create one form which will have the following functionality.


    1. The ability for the user to enter name and address.

    2. An option to choose the city in which the user resides in.

    3. The ability for the user to enter an option for the gender.

    4. An option to choose a course which the user wants to learn. There will choices
    for both C# and ASP.Net.


    So let’s look at each control in detail and add them to build the form with the
    above-mentioned functionality.


    **Group Box** – A group box is used for grouping logical controls into a section.
    Let’s take an example, if you had a collection of controls for entering details
    such as name and address of a person. Ideally, these are details of a person,
    so you would want to have these details in a separate section on the Form. For
    this purpose, you can have a group box. Let’s see how we can implement this with
    an example shown below


    **Step 1)** The first step is to drag the `Groupbox` control onto the Windows
    Form from the toolbox as shown below


    ![](Images/image00133.jpeg)


    **Step 2)** Once the groupbox has been added, go to the properties window by clicking
    on the groupbox control. In the properties window, go to the `Text` property and
    change it to “User Details”.


    ![](Images/image00134.jpeg)


    One you make the above changes, you will see the following output


    **Output:**


    ![](Images/image00135.jpeg) In the output, you can clearly see that the Groupbox
    was added to the form. You can also see that the text of the groupbox was changed
    to “User Details.”


    **Label Control** – Next comes the Label Control. The label control is used to
    display a text or a message to the user on the form. The label control is normally
    used along with other controls. Common examples is wherein a label is added along
    with the textbox control.


    The label gives an indication to the user on what is expected to fill up in the
    textbox. Let’s see how we can implement this with an example shown below. We will
    add 2 labels, one which will be called ‘name’ and the other called ‘address.’
    They will be used in conjunction with the textbox controls which will be added
    in the later section.


    **Step 1)** The first step is to drag the label control on to the Windows Form
    from the toolbox as shown below. Make sure you drag the label control 2 times
    so that you can have one for ‘name’ and the other for ‘address.’


    ![](Images/image00136.jpeg) **Step 2)** Once the label has been added, go to the
    properties window by clicking on the label control. In the properties window,
    go to the `Text` property of each label.


    One you make the above changes, you will see the following output


    **Output:**


    ![](Images/image00137.jpeg) You can actually see the label controls added to the
    form.


    **Textbox** – A textbox is used for allowing a user to enter some text on the
    forms. Let’s see how we can implement this with an example shown below. We will
    add 2 textboxes to the form , one for the Name and the other for the address to
    be entered for the user


    **Step 1)** The first step is to drag the textbox control onto the Windows Form
    from the toolbox as shown below


    ![](Images/image00138.jpeg)


    **Step 2)** Once the text boxes have been added, go to the properties window by
    clicking on the textbox control. In the properties window, go to the `Name` property
    and add a meaningful name to each textbox. For example, name the textbox for the
    user as `txtUser` and that for the address as `txtAddress`. A naming convention
    and standard should be made for controls because it becomes easier to add extra
    functionality to these, which we will see later.


    One you make the above changes, you will see the following output


    **Output:**


    ![](Images/image00139.jpeg) In the output, you can clearly see that the Textboxes
    was added to the form.


    **List box** – A Listbox is used to showcase a list of items on the Windows form.
    Let’s see how we can implement this with an example shown below. We will add a
    list box to the form to store some city locations.


    **Step 1)** The first step is to drag the list box control onto the Windows Form
    from the toolbox as shown below


    ![](Images/image00140.jpeg) **Step 2)** Once the list box has been added, go to
    the properties window by clicking on the list box control.


    ![](Images/image00141.jpeg)


    1. First, change the property of the Listbox box control , in our case we have
    changed this to `lstCity`.

    2. Click on the `Items` property. This will allow you to add different items which
    can show up in the list box. In our case, we have selected items “collection”.

    3. In the String Collection Editor, which pops up, enter the city names. In our
    case, we have entered “Mumbai”, “Bangalore” and “Hyderabad”.

    4. Finally, click on the ‘OK’ button.


    One you make the above changes, you will see the following output


    ![](Images/image00142.jpeg)

