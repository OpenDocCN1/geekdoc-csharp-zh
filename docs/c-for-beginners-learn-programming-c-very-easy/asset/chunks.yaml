    ## 数据库连接的基础\n\nC# 和 .Net 具有处理大多数数据库的能力，最常见的是 `Oracle` 和 `Microsoft SQL Server`。但对于每个数据库，处理所有数据库背后的逻辑大部分是相同的。\n\
    \n在我们的示例中，我们将查看 `Microsoft SQL Server` 作为我们的数据库。为了学习目的，可以下载并使用 `Microsoft SQL\
