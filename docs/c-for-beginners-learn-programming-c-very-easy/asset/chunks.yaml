    **注意：** 这里的默认值是从构造函数获取的。


    ## C# 继承


    继承是 C# 中一个重要的概念。继承是一种定义父类和子类的概念。


    子类继承父类的方法和属性，但同时如果需要，它们也可以修改方法的行为。如果需要，子类也可以定义自己的方法。


    通过观察这一操作你将获得更好的理解。


