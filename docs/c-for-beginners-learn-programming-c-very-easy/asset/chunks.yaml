    # Chapter 5: C# Collections


    In our previous chapter, we have learned about how we can use arrays in C#. Let’s
    have a quick overview of it, Arrays in programming are used to group a set of
    related objects. So one could create an array or a set of Integers, which could
    be accessed via one variable name.


    Collections are similar to Arrays, it provide a more flexible way of working with
    a group of objects.


    In arrays, you would have noticed that you need to define the number of elements
    in an array beforehand. This had to be done when the array was declared.


    But in a collection, you don’t need to define the size of the collection beforehand.
    You can add elements or even remove elements from the collection at any point
    of time. This chapter will focus on how we can work with the different collections
    available in C#.


    ## **C# ArrayList**


    The ArrayList collection is similar to the Arrays data type in C#. The biggest
    difference is the dynamic nature of the array list collection.


    For arrays, you need to define the number of elements that the array can hold
    at the time of array declaration. But in the case of the Array List collection,
    this does not need to be done beforehand. Elements can actually be added or removed
    from the Array List collection at any point of time. Let’s look at the operations
    available for the array list collection in more detail.


    1\. **Declaration of an Array List** – The declaration of an ArrayList is provided
    below. An array list is created with the help of the ArrayList Data type. The
    “new” keyword is used to create an object of an Arraylist. The object is then
    assigned to the variable a1. So now the variable a1 will be used to access the
