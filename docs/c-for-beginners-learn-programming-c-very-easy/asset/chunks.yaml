    ## C# 控件事件处理

    在进行 Windows 窗单开发时，你可以为控件添加事件。事件是在执行某个操作时发生的事情。最常见的操作可能是点击表单上的按钮。在 Windows 窗单中，你可以添加代码，用于在表单上的按钮被按下时执行某些操作。


    通常，当表单上的按钮被按下时，意味着应该进行某些处理。


    在进入按钮事件场景之前，让我们来看其中一个事件以及如何处理它。


    下面的示例将展示 `Listbox` 控件的事件。因此，每当在 `listbox` 控件中选择项目时，应该弹出一个消息框显示选中的项目。执行以下步骤来实现这一目标。


    **步骤 1)** 在窗单设计器中双击 `Listbox`。通过这样做，Visual Studio 将自动打开表单的代码文件。它将自动向代码中添加一个事件方法。每当选择
    `listbox` 中的任何项目时，该事件方法就会被触发。


    ![](img/image00150.jpeg)


    上方是双击窗单上的 `list box` 控件时由 Visual Studio 自动添加的代码片段。现在让我们将下面的代码添加到此代码片段中，为 listbox
    事件添加所需的功能。


    ![](img/image00151.jpeg)


    1. 这是 Visual Studio 在双击 `List box` 控件时自动创建的事件处理方法。你不需要担心方法名的复杂性或传递给方法的参数。

    2. 这里，我们通过 `lstCity.SelectedItem` 属性获取 `SelectedItem`。记住 `lstCity` 是我们 `Listbox`
    的名称。我们将值赋值给 `text` 变量，使用 `GetItemText` 方法获取选中项目的值。

    3. 最后，我们使用 `MessageBox` 方法将值显示给用户。


