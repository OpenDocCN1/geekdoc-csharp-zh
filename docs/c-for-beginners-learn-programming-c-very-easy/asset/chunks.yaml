    2. 最后，使用 `console.write` 函数显示枚举的一个值。


    如果正确输入了上述代码并成功执行程序，将显示以下输出。

    **输出：**


    ![](img/image00068.jpeg)

    从输出中你可以清楚地看到控制台上显示了枚举的 `''Sun''` 值。


    ## C# 运算符和变量 (Operators and Variables)

    变量是存储区域的名称，用于存储各种数据类型的值。在 C# 中，每个变量都需要一个特定类型，这决定了变量内存的大小和布局。


    例如，变量可以是 `String` 类型，这意味着它将用于存储字符串值。根据数据类型，可以在变量上执行特定的操作。

    例如，如果我们有一个 `Integer` 变量，那么可以在变量上执行加法和减法等操作。可以在程序中声明多个变量。


    让我们来看一个不同数据类型变量定义的快速示例。

    在示例中，我们将定义 2 个变量，一个是 `string` 类型，另一个是 `Integer` 类型。我们将这些变量的值显示在控制台上。对于每个示例，我们只修改
    `Program.cs` 文件中的 main 函数。


    ![](img/image00069.jpeg)

    **代码解释：**


    1. 声明了一个数据类型为 `String` 的变量。变量名为 `message`。变量的值为 `"The value is "`。

    2. 声明了一个数据类型为 `Integer` (`Int32`) 的变量。变量名为 `val`。变量的值为 30。

    3. 最后，使用 `Console.write` 语句输出 `String` 和 `Integer` 的值。


    如果正确输入了上述代码并成功执行程序，将显示以下输出。

    **输出：**


    ![](img/image00070.jpeg)

    从输出中你可以清楚地看到字符串变量和整数变量的值都显示在控制台上。


    运算符用于对各种数据类型的值执行操作。例如，要执行两个数字的加法，使用 `+` 运算符。让我们看看各种数据类型可用的运算符表。


    ### 1. 算术运算符 (Arithmetic Operators)

    这些用于对数字执行数学运算的运算符。下面是 C# 中提供的运算符列表。


    | 运算符 | 说明 |

    |---|---|

    | + | 加两个操作数 |

    | - | 从第一个操作数中减去第二个操作数 |

    | * | 两个操作数相乘 |

    | / | 将分子除以分母 |

    | % | 模运算符，和整数除法后的余数 |

    | ++ | 递增运算符，将整数值加一 |

    | -- | 递减运算符，将整数值减一 |


    ### 2. 关系运算符 (Relational Operators)

    这些用于对数字执行关系运算的运算符。


    | 运算符 | 说明 |

    |---|---|

    | == | 检查两个操作数的值是否相等，如果是，则条件为真。 |

    | != | 检查两个操作数的值是否相等，如果不相等，则条件为真。 |

    | > | 检查左操作数的值是否大于右操作数的值，如果是，则条件为真。 |

    | < | 检查左操作数的值是否小于右操作数的值，如果是，则条件为真。 |

    | >= | 检查左操作数的值是否大于或等于右操作数的值，如果是，则条件为真。 |

    | <= | 检查左操作数的值是否小于或等于右操作数的值，如果是，则条件为真。 |


