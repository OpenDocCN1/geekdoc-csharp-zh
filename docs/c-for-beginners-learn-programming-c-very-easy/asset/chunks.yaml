    \ take the same table structure which was used above.\n\nTutorialID | TutorialName\n\
    1 C#\n2 ASP.Net\n\nLet’s change the code in our form, so that we can insert the\
    \ following row into the table\n\nTutorialID | TutorialName\n3 VB.Net\n\nSo let’s\
    \ add the following code to our program. The below code snippet will be used to\
    \ insert an existing record in our database.\n\n![](Images/image00168.jpeg)\n\n\
    **Code Explanation:**\n\n1. The first step is to create the following variables:\n\
    \    a. `SQLCommand` – This data type is used to define objects which are used\
    \ to perform SQL operations against a database. This object will hold the SQL\
    \ command which will run against our SQL Server database.\n    b. the `adapter`\
    \ object is used to perform specific SQL operations such as insert, delete and\
    \ update commands.\n    c. We then define a string variable, which is `SQL` to\
    \ hold our SQL command string.\n2. The next step is to actually define the SQL\
    \ statement, which will be used against our database. In our case, it is `Select\
    \ TutorialID, TutorialName from demotb`.\n3. Next, we create the command object\
    \ which is used to execute the SQL statement against the database. In the SQL\
    \ command, you have to pass the connection object and the SQL string.\n4. In our\
    \ data adapter command, we now associate the insert command to our adapter. We\
    \ then issue the `ExecuteNonQuery` method which is used to execute the statement\
    \ against the database. `ExecuteNonQuery` is used in C# to issue any DML statements.\n\
    5. We finally close all the objects related to our database operation. Remember\
    \ this is always a good practice.\n\nWhen the above code is set, and the project\
    \ is executed using Visual Studio, you will get the below output. Once the form\
