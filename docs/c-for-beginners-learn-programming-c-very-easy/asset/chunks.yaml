    让我们更详细地查看 Hashtable 集合可用的操作。


    ## Hashtable 的声明


    下面显示了 Hashtable 的声明。Hashtable 是通过 `Hashtable` 数据类型创建的。使用 `new` 关键字来创建 Hashtable
    对象。然后将该对象赋值给变量 `ht`。


    ```

    Hashtable ht = new Hashtable()

    ```


    ## 向 Hashtable 添加元素


    使用 `Add` 方法向队列中添加元素。该语句的通用语法如下所示：`HashTable.add(“key”,“value”)`。


    请记住，哈希表的每个元素都包含 2 个值，一个是键（key），另一个是值（value）。


    现在，让我们在代码层面查看此工作。以下提到的所有代码将编写到我们的控制台应用程序中。


    代码将写入我们的 `Program.cs` 文件中。在下面的程序中，我们将编写代码查看如何使用上述方法。目前在我们的示例中，我们只需查看如何创建一个 hashtable、向
    hashtable 添加元素并相应地显示它们。


    1. 首先，我们使用 `New` 关键字使用 `Hashtable` 数据类型声明哈希表变量。变量名定义为 ‘ht’。

    2. 然后，我们使用 `Add` 方法向哈希表添加元素。记住，在向哈希表添加内容时，我们需要同时添加键和值元素。

    3. 没有直接的方法来显示哈希表的元素。


    为了显示 hashtable，我们首先需要从哈希表中获取键列表（001、002 和 003）。这是通过 `ICollection` 接口实现的。这是一种用于存储哈希表集合键的特殊数据类型。然后我们将哈希表集合的键赋值给变量
    `keys`。

    4. 接下来，对于每个键值对，我们使用语句 `ht[k]` 获取哈希表中关联的值。


    如果正确输入上述代码并运行程序，将显示以下输出。


    让我们查看哈希表可用的更多方法。


    **ContainsKey** - 此方法用于检查键是否存在于 Hashtable 中。下面是该语句的通用语法。如果键存在，该语句将返回 true，否则它将返回值
    false。


    ```

    Hashtable.Containskey(key)

    ```


    **ContainsValue** - 此方法用于检查值是否存在于 Hashtable 中。下面是该语句的通用语法。如果值存在，该语句将返回 true，否则它将返回值
    false。


    ```

    Hashtable.ContainsValue(key)

    ```


    让我们更改控制台应用程序中的代码，展示我们如何使用“ContainsKey”和“ContainsValue”方法。


    1. 首先，我们使用 `ContainsKey` 方法检查键是否存在于哈希表中。如果键存在于哈希表中，该方法将返回 true。由于键确实存在于哈希表中，因此该方法应该返回
    true。

    2. 然后，我们使用 `ContainsValue` 方法检查值是否存在于哈希表中。由于值确实存在于哈希表中，该方法将返回 ‘true’。


    如果正确输入上述代码并运行程序，将显示以下输出。


    从输出中，你可以清楚地看到搜索的键和值都于哈希表中。


    ## 总结


    `ArrayList` 集合用于存储一组元素。数组列表集合的优势在于它是动态的。你可以随时向数组列表集合添加或删除元素。


    `Stack`（栈）基于后进先出的概念。向栈中添加元素的操作被称为 `push` 操作。从栈中移除元素的操作被称为 `pop` 操作。


    `Queue`（队列）基于先进先出的概念。向队列中添加元素的操作被称为 `enqueue` 操作。从队列中移除元素的操作被称为 `dequeue` 操作。`Hashtable`
    用于存储由键值对组成的元素。要访问元素的值，你需要知道该元素的键。


    # 第 6 章：Windows Forms 应用程序


    到目前为止，我们已经学习了如何使用 C# 创建基于控制台的应用程序。但在现实场景中，团队通常使用 Visual Studio 和 C# 来创建 Windows
    Forms 或基于 Web 的应用程序。


    Windows Forms 应用程序是任何设计在计算机上运行的应用程序。它不会在网络浏览器中运行，因为那样就变成了 Web 应用程序。


    本章将重点关注我们如何创建基于 Windows 的应用程序。我们还将学习一些关于与 Windows 应用程序各种元素操作的基础知识。


    ## Windows Forms 基础


    Windows Forms 应用程序是运行在桌面计算机上的应用程序。Windows Forms 应用程序通常有一组控件，如标签（labels）、文本框（textboxes）、列表框（list
    boxes）等。


    下面是一个简单的 Windows Forms 应用程序示例。它显示了一个用户可以访问的简单登录界面。用户将输入凭据，然后点击登录按钮继续。


    ![](img/image00122.jpeg)这是上述应用程序中可用控件的示例


    1. 这是一个标签（label）控件的集合，通常用于描述相邻的控件。在我们的案例中，我们有 2 个文本框，标签用于告诉用户一个文本框用于输入用户名，另一个用于输入密码。

    2. 2 个文本框用于存放用户输入的用户名和密码。

    3. 最后，我们有按钮（button）控件。按钮控件通常会附带一些代码以执行特定的操作。例如，在上面的案例中，我们可以让按钮执行验证用户输入的用户名和密码的操作。


    # C# Hello World


    现在让我们来看如何在 Visual Studio 中实现一个简单的“hello world”应用程序的示例。为了实现这一点，我们需要执行以下步骤


    **步骤 1)** 第一步涉及在 Visual Studio 中创建一个新项目。启动 Visual Studio 后，你需要选择菜单选项 New->Project（新建->项目）。


    ![](img/image00123.jpeg)**步骤 2)** 下一步是将项目类型选择为 Windows Forms 。在这里我们还需要指定项目的名称和位置。![](img/image00124.jpeg)


