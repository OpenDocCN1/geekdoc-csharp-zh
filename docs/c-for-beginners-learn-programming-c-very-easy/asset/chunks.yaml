    ## 3. 逻辑运算符


    这些是用于对值执行逻辑操作的运算符。以下是 C# 中可用的运算符列表。


    ### 运算符说明


    - `&&`: 这是逻辑与（AND）运算符。如果两个操作数都真，则条件为真。

    - `||`: 这是逻辑或（OR）运算符。如果任一操作数为真，则条件为真。

    - `!`: 这是逻辑非（NOT）运算符。


    让我们来看一个如何在 .Net 中使用运算符的示例。在示例中，我们将定义两个整数（Integer）变量和一个布尔（Boolean）变量。然后我们将执行以下操作：


    ![](img/image00071.jpeg)


    **代码解释：**


    1. 定义了两个整数变量，一个为 `val1`，另一个为 `val2`。这些用于展示关系运算和算术运算。定义了一个布尔变量来展示逻辑操作。

    2. 显示了一个算术运算的示例，对 `val1` 和 `val2` 执行了加法操作。结果写入控制台。

    3. 显示了一个关系运算的示例，对 `val1` 和 `val2` 执行了小于运算符操作。结果写入控制台。

    4. 显示了一个逻辑操作的示例，将逻辑运算符 `!` 应用于 `status` 变量。逻辑非运算符会反转任何布尔值的当前值。因此，如果布尔值为‘true’，逻辑非将返回值‘false’，反之亦然。在我们的情况下，由于
    `status` 变量的值为‘true’，结果将显示‘false’。结果写入控制台。


    如果上述代码输入正确且程序执行成功，将显示输出。


    **输出：**


    ![](img/image00072.jpeg)


    ## 流程控制和条件语句


    任何编程语言都有流程控制和条件语句，用于改变程序的执行流。


    例如，如果有人想根据某些逻辑执行一组特定的语句，那么流程控制和条件语句将非常有用。随着我们学习 C# 中提供的各种语句，你将会有更好的理解。


    请注意，以下所有代码均编写在 `Program.cs` 文件中。


    ### 1. If 语句


    `if` 语句用于在执行一组语句之前评估布尔表达式。如果表达式求值为真，则它将运行一组语句，否则将运行另一组语句。


    在下方的示例中，对名为 `value` 的变量进行了比较。如果变量的值小于 10，则它将运行一条语句，否则将运行另一条语句。


    ![](img/image00073.jpeg)


    **代码解释：**


    1. 我们首先定义了一个名为 `value` 的变量，并将其设置为 11。

    2. 随后我们使用 `if` 语句检查变量 `value` 的值是否小于 10。结果将为真或假。

    3. 如果 `if` 条件求值为真，我们则向控制台发送消息“Value is less than 10”。

    4. 如果 `if` 条件求值为假，我们则向控制台发送消息“Value is greater than 10”。


    如果上述代码输入正确且程序执行成功，将显示以下输出。


    **输出：**


    ![](img/image00074.jpeg) 我们可以清楚地看到 `if` 语句的评估结果为假。因此，控制台发送了消息“Value is greater
    than 10”。


    ### 2. Switch 语句


    `switch` 语句是 `if` 语句的增强版。如果你有多个需要一次性评估的表达式，那么编写多个 `if` 语句就会成为问题。


    `switch` 语句用于评估一个表达式并根据表达式的结果运行不同的语句。如果一个条件未评估为真，`switch` 语句将移动到下一个条件，依此类推。


    让我们通过下面的示例来看它是如何运作的。在这里，我们再次比较名为 `value` 的变量的值。然后我们检查该值是否等于 1、2 或其他完全不同的值。


    ![](img/image00075.jpeg)


    **代码解释：**


    1. 我们首先定义了一个名为 `value` 的变量，并将其设置为 11。

    2. 随后我们使用 `switch` 语句检查变量 `value` 的值。

    3. `case` 语句用于设置不同的条件。根据条件，可以执行一组语句。一个 `switch` 语句可以有多个 `case` 条件。第一个 `case` 语句检查变量的值是否等于
    1。

    4. 如果第一个 `case` 语句为真，则向控制台写入消息“Value is 1”。

    5. `break` 语句用于在条件为真时跳出整个 `switch` 语句。

    6. `default` 条件是一个特殊条件。它意味着如果没有一个 `case` 表达式评估为真，则执行 `default` 条件对应的语句组。


    如果上述代码输入正确且程序执行成功，将显示以下输出。输出打印了默认值“Value is different”，因为没有条件被满足。


    **输出：**


    ![](img/image00076.jpeg)


    ### 3. While 循环


    `while` 循环用于迭代目的。假设你想针对特定次数重复执行一组语句，则使用 `while` 循环。


    在下方的示例中，我们使用 `while` 语句来显示变量 `i` 的值。`while` 语句被用于显示 3 次。


    ![](img/image00077.jpeg)


    **代码解释：**


    1. 定义了两个整数变量，一个为 `value`，另一个为 `i`。`value` 变量被用作我们 `while` 语句迭代的上限。而 `i` 是在迭代过程中处理的变量。

    2. 在 `while` 语句中，不断检查 `i` 的值与上限的比较。

    3. 在这里向控制台显示 `i` 的值。我们还增加了 `i` 的值。


    如果上述代码输入正确且程序执行成功，将显示以下输出。


    **输出：**


    ![](img/image00078.jpeg) 在这里你可以看到 `while` 语句执行了 3 次并同时进行了递增。每次它都会显示变量 `i` 的当前值。


    ### 4. For 循环


    `for` 循环也用于迭代目的。假设你想特定次数重复执行一组语句，则使用 `for` 循环。


    在下方的示例中，我们使用 `for` 语句来显示变量 `i` 的值。`for` 语句被用于显示 3 次。


    ![](img/image00079.jpeg)


    **代码解释：**


    1. `for` 关键字用于启动 `for` 循环。

    2. 在 `for` 循环中，我们定义了三个。第一个是初始化变量的值，该值将在 `for` 循环中使用。

    3. 第二是将 `i` 的值与上限进行比较。在我们的案例中，上限是值 3 (`i<3`)。

    4. 最后，相应地增加 `i` 的值。

    5. 在这里向控制台显示 `i` 的值。


    如果上述代码输入正确且程序执行成功，将显示以下输出。


    **输出：**


    ![](img/image00080.jpeg) 在这里你可以看到 `for` 语句执行了 3 次。每次它都会显示变量 `i` 的当前值。


    ## C# 数组


    数组用于存储一组或一系列元素。这些元素将具有相同的类型。




    例如，如果你有一个整数值数组，该数组可以是此类值的集合，如 [1, 2, 3, 4]。在这里，数组中的元素数量为 4。


    当你想要存储一组相同类型值的集合时，数组非常有用。因此，你不需要为每个元素声明一个变量，只需声明一个变量即可。


