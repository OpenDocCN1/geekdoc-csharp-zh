    ## 向表单添加控件


    当我们在前面的章节中通过添加标签控件来显示“Hello World”时，已经学习过如何向表单添加控件了。


    让我们看看 Windows Forms 可用的其他控件，并查看它们的一些常用属性。


    在我们的示例中，我们将创建一个具有以下功能的表单：


    1. 用户输入姓名和地址的能力。

    2. 选择用户居住城市的选项。

    3. 用户输入性别选项的能力。

