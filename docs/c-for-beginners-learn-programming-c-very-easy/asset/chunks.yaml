    3. 然后我们在写入文件后关闭流写入器。通常情况下，当文件不再需要写入时，关闭文件句柄是一个良好的习惯。

    4. 最后，我们再次读取文件内容并将其写入控制台日志。这是为了检查该行是否真的写入了文件。


