    栈（Stack）是一种特殊的集合，代表了后进先出（LIFO）的概念。为了先理解 LIFO，让我们来看一个例子。想象有一叠书，每本书都堆叠在另一本书上面。


    在书堆的情况下，“后进先出”的概念意味着只能从书栈的最顶端移除一本书。无法从中间移除书籍，因为那样会破坏栈的结构。


    因此，在 C# 中，栈的工作方式也是完全一样的。元素被添加到栈中，一个堆叠在另一个的上方。向栈中添加元素的过程称为 `push` 操作。要从栈中移除元素，你也可以移除栈的最顶端元素。这种操作被称为
    `pop`。


    让我们详细查看 `Stack` 集合提供的可用操作。


    ### 栈的声明

    通过 `Stack` 数据类型创建栈。使用 `new` 关键字来创建 `Stack` 对象。然后将该对象赋值给变量 `st`。


    ```csharp

    Stack st = new Stack()

    ```


    ### 向栈中添加元素

    使用 `push` 方法将元素添加到栈中。该语句的通用语法所示。


    ```csharp

    Stack.push(element)

    ```


    ### 从栈中移除元素

    使用 `pop` 方法从栈中移除元素。`pop` 操作将返回栈的最顶端元素。该语句的通用语法所示。


    ```csharp

    Stack.pop()

    ```


    ### Count

    此属性用于获取 `Stack` 中的项目数量。下面是该语句的通用语法。


    ```csharp

    Stack.Count

    ```


    ### Contains

    此方法用于检查元素是否存在于 `Stack` 中。下面是该语句的通用语法。如果元素存在，语句将返回 true，否则将返回值 false。


    ```csharp

    Stack.Contains(element)

    ```


    现在，让我们在代码层面来看它的运行情况。以下所有提到的代码都将写入我们的控制台应用程序。代码将写入我们的 `Program.cs` 文件中。在下面的程序中，我们将编写代码来查看如何使用上述方法。


    在这个示例中，我们将看到：

    - 栈是如何创建的。

    - 如何显示栈元素，以及使用 `Count` 和 `Contains` 方法。


    ![](img/image00114.jpeg) **代码解释：**


    1. 第一步用于声明 `Stack`。在这里，我们将 `st` 声明为变量，用于保存栈的元素。

    2. 接下来，向我们的栈中添加 3 个元素。每个元素都通过 `Push` 方法添加。

    3. 现在，由于栈元素不能像列表那样通过索引位置访问，我们需要使用不同的方法来显示栈的元素。`obj` 是一个临时变量，声明用于持有栈的每个元素。然后我们使用
    `foreach` 语句遍历栈的每个元素。对于每个栈元素，值被赋值给 `obj` 变量。然后我们使用 `Console.Writeline` 命令将值显示到控制台上。

    4. 我们正在使用 `Count` 属性 (`st.count`) 来获取栈中的项目数量。此属性将返回一个数字。然后我们把此值显示到控制台上。

    5. 接着，我们使用 `Contains` 方法检查值 3 是否存在于我们的栈中。这将返回 true 或 false 值。然后我们把此返回值显示到控制台上。


    如果正确输入上述代码并运行程序，将显示以下输出。


    **输出：**


    ![](img/image00115.jpeg)


    从输出中，我们可以清楚地看到栈的元素已被显示。此外，还显示了 True 值，表示值 3 定义在栈中。


    **注意**：你可能注意到最后一个推入栈的元素是第一个显示的。这是栈的最顶端元素。栈元素的计数也显示在输出中。


    现在，让我们看看“移除”功能。我们将看到从栈中移除顶端元素所需的代码。


    ![](img/image00116.jpeg) **代码解释：**


    1. 在这里，我们只需调用 `pop` 方法，它用于从栈中移除一个元素。


