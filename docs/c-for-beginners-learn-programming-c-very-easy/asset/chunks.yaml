    \ 后，你需要选择菜单 `New->Project`（新建->项目）。\n\n![](img/image00160.jpeg)\n\n##### 步骤 2)\
    \ 下一步是将项目类型选择为 Windows Forms application。在这里，我们还需要提到项目的名称和位置。![](img/image00161.jpeg)\n\
    \n1. 在项目对话框中，我们可以看到在 Visual Studio 中创建不同类型项目的各种选项。点击左侧的 `Windows` 选项。\n2. 当我们点击上一步中的\
    \ `Windows` 选项时，我们将看到 `Windows Forms Application` 选项。点击此选项。\n3. 然后我们为应用程序命名，在我们的案例中为\
    \ `DemoApplication`。我们还需要提供一个存储应用程序的位置。\n4. 最后，点击 `OK` 按钮让 Visual Studio 创建我们的项目。\n\
    \n##### 步骤 3) 现在从工具箱向 Windows Form 添加一个按钮。将按钮的 `text` 属性设置为 `Connect`。它看起来是这样\
    \ ![](img/image00162.jpeg)\n\n##### 步骤 4) 现在双击表单，为 `button click` 事件添加事件处理程序。在事件处理程序中，添加下面的代码。\n\
    \n![](img/image00163.jpeg) **代码解释：**\n\n1. 第一步是创建变量，它们将用于创建连接字符串和到 SQL Server\
    \ 数据库的连接。\n2. 下一步是实际上创建连接字符串。连接字符串需要以正确的方式指定以便 C# 理解连接字符串。连接字符串由以下部分组成：\n    a.\
    \ `Data Source` – 这是数据库所在的服务器名称。在我们的案例中，它位于一个名为 `WIN-50GP30FGO75` 的机器上。\n    b.\
    \ `Initial Catalog` 用于指定数据库名称。\n\n"
- fmt: "\nc. The `UserID` and `Password` are the credentials required to connect to\
    \ the database.\n\n3. Next, we assign the connecting string to the variable `cnn`.\
    \ The variable `cnn`, which is of type `SqlConnection` is actually used to establish\
    \ the connection to the database.\n\n4. Next, we use the `Open` method of the\
    \ `cnn` variable to open a connection to the database. We then just display a\
    \ message to the user that the connection is established.\n\n5. Once the operation\
    \ is completed successfully, we then close the connection to the database. It\
    \ is always a good practice to close the connection to the database if nothing\
    \ else is required to be done on the database.\n\nWhen the above code is set,\
    \ and the project is executed using Visual Studio, you will get the below output.\
    \ Once the form is displayed, click the Connect button. **Output:**\n\n![](Images/image00164.jpeg)\n\
    \nWhen you click on “connect” button, from the output you can clearly see that\
    \ the database connection was established. Hence, the message box was displayed.\n\
    \n## Access data\n\nTo showcase how data can be accessed using C#, let us assume\
    \ that we have the following artifacts in our database.\n\n1. A table called `demotb`.\
    \ This table will be used to store the ID and names of various Tutorials.\n2.\
    \ The table will have 2 columns, one called `TutorialID` and the other called\
    \ `TutorialName`.\n3. For the moment, the table will have 2 rows as shown below.\n\
    \nTutorialID | TutorialName\n1 C#\n2 ASP.Net\n\nLet’s change the code in our form,\
    \ so that we can query for this data and display the information via a Messagebox.\
    \ Note that all the code entered below is a continuation of the code written for\
    \ the data connection in the previous section.\n\n### Step 1) Let’s split the\
    \ code into 2 parts so that it will be easy to understand for the user.\n\nThe\
    \ first will be to construct our “select” statement, which will be used to read\
    \ the data from the database. We will then execute the “select” statement against\
    \ the database and fetch all the table rows accordingly.\n\n![](Images/image00165.jpeg)\n\
    \n1. The first step is to create the following variables:\n    a. `SQLCommand`\
    \ – The `SQLCommand` is a class defined within C#. This class is used to perform\
    \ operations of reading and writing into the database. Hence, the first step is\
    \ to make sure that we create a variable type of this class. This variable will\
    \ then be used in subsequent steps of reading data from our database.\n    b.\
    \ the `areader` object is used to get all the data specified by the SQL query.\
    \ We can then read all the table rows one by one using the data reader.\n    c.\
    \ We then define 2 string variables, one is `SQL` to hold our SQL command string.\
    \ The next is the `Output` which will contain all the table values.\n2. The next\
    \ step is to actually define the SQL statement, which will be used against our\
    \ database. In our case, it is `Select TutorialID, TutorialName from demotb`.\
    \ This will fetch all the rows from the table `demotb`.\n3. Next, we create the\
    \ command object which is used to execute the SQL statement against the database.\
    \ In the SQL command, you have to pass the connection object and the SQL string.\n\
    4. Next, we will execute the data reader command, which will fetch all the rows\
    \ from the `demotb` table.\n5. Now that we have all the rows of the table with\
    \ us, we need a mechanism to access the row one by one. For this, we will use\
    \ the `while` statement. The `while` statement will be used to access the rows\
    \ from the data reader one at a time. We then use the `GetValue` method to get\
    \ the value of `TutorialID` and `TutorialName`.\n\n### Step 2) In the final step,\
    \ we will just display the output to the user and close all the objects related\
    \ to the database operation.\n\n![](Images/image00166.jpeg)\n\n1. We will continue\
    \ our code by displaying the value of the `Output` variable using the `MessageBox`.\
    \ The `Output` variable will contain all the values from the `demotb` table.\n\
    2. We finally close all the objects related to our database operation. Remember\
    \ this is always a good practice.\n\nWhen the above code is set, and the project\
    \ is run using Visual Studio, you will get the below output. Once the form is\
    \ displayed, click the Connect button. **Output:**\n\n![](Images/image00167.jpeg)\n\
    \nFrom the output, you can clearly see that the program was able to get the values\
    \ from the database. The data is then displayed in the message box.\n\n## C# Insert\
    \ Database\n\nJust like Accessing data, C# has the ability to insert records into\
