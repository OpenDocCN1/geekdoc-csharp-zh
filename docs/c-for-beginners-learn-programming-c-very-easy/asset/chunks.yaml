    ## 流 –Streams – 读取和写入文件


    在 C# 文件操作中，通常使用流（streams）来读取和写入文件。流是在应用程序和文件之间创建的额外层。流用于确保对文件进行平滑的读和写操作。


    流通常用于从大文件中读取数据。通过使用流，大文件中的数据被分解成小块并发送到流中。这些数据块随后可以从应用程序中读取。


    将其分解成小块的原因是因为一次性读取大文件会对性能产生影响。如果你一次性读取例如一个 100 MB 文件的数据，你的应用程序可能会挂起并变得不稳定。此时最佳方法是使用流将文件分解成可管理的数据块。


    因此，当对文件执行写操作时，要写入的数据首先被写入流中。然后数据从流写入文件。读取操作也是如此。在读取操作中，数据首先从文件传输到流中。然后通过流从应用程序中读取数据。让我们来看一个如何使用流进行读取和写入的示例。


    对于我们的示例，我们假设在 D 盘上有一个名为 `Example.txt` 的文件。该文件将是一个简单的文本文件，并包含如下所示的 2 行 Guru99 -
    .Net


    Guru99-C#


    对于我们的示例，我们将创建一个简单的控制台应用程序并处理文件流。


    ### 1. 读取器 (Stream Reader)

    – 流读取器用于使用流从文件中读取数据。文件中的数据首先读取到流中。之后，应用程序从流中读取数据。


    让我们来看一个如何使用流从文件中读取数据的示例。在 `program.cs` 文件中输入以下代码。


    ![](img/image00202.jpeg)

    **代码解释：**


    1. 首先，我们声明了一个流读取器对象。C# 中使用流读取器对象定义从文件到应用程序的流。每当从文件中读取数据时，数据就会从文件推送到流中。使用 `File.OpenText`
    以只读模式打开 `Example.txt` 文件。然后将该文件的句柄发送给流读取器对象。

    2. 接下来，我们定义了一个临时变量 `s`，它将用于从文件中读取所有数据。

    3. 然后我们使用流读取器方法 `ReadLine` 从流中读取每一行。当我们执行此操作时，每一行都将从文件传输到缓冲区。然后字符串 `line` 将从缓冲区传输到
    `s`。然后我们将该字符串写入控制台。


    当设置好上述代码并使用 Visual Studio 运行项目时，你将得到下面的输出。


    **输出：**


    ![](img/image00203.jpeg)从输出中，你可以清楚地看到 Stream Reader 读取了文件中的两行。最后，从流中读取的字符串行被发送到控制台。


    ### 2. 写入器 (Stream Writer)

    – 流写入器用于使用流向文件写入数据。来自应用程序的数据首先写入流中。然后流将数据写入文件。让我们来看一个如何使用流向文件写入数据的示例。在 `program.cs`
    文件中输入以下代码。


    ![](img/image00204.jpeg)

