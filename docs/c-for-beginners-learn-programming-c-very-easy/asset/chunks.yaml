    The stack is a special case collection which represents a last in first out (LIFO)
    concept. To first understand LIFO, let’s take an example. Imagine a stack of books
    with each book kept on top of each other.


    The concept of last in first out in the case of books means that only the top
    most book can be removed from the stack of books. It is not possible to remove
    a book from between, because then that would disturb the setting of the stack.


    Hence in C#, the stack also works in the same way. Elements are added to the stack,
    one on the top of each other. The process of adding an element to the stack is
    called a `push` operation. To remove an element from a stack, you can also remove
    the top most element of the stack. This operation is known as `pop`.


    Let’s look at the operations available for the `Stack` collection in more detail.


    ### Declaration of the stack

    A stack is created with the help of the `Stack` Data type. The keyword `new` is
    used to create an object of a `Stack`. The object is then assigned to the variable
    `st`.


    ```csharp

    Stack st = new Stack()

    ```


    ### Adding elements to the stack

    The `push` method is used to add an element onto the stack. The general syntax
    of the statement is given below.


    ```csharp

    Stack.push(element)

    ```


    ### Removing elements from the stack

    The `pop` method is used to remove an element from the stack. The `pop` operation
    will return the topmost element of the stack. The general syntax of the statement
    is given below.


    ```csharp

    Stack.pop()

    ```


    ### Count

    This property is used to get the number of items in the `Stack`. Below is the
    general syntax of this statement.


    ```csharp

    Stack.Count

    ```


    ### Contains

    This method is used to see if an element is present in the `Stack`. Below is the
    general syntax of this statement. The statement will return true if the element
    exists, else it will return the value false.


    ```csharp

    Stack.Contains(element)

    ```


    Now let’s see this working at a code level. All of the below-mentioned code will
    be written to our Console application. The code will be written to our `Program.cs`
    file. In the below program, we will write the code to see how we can use the abovementioned
    methods.


    In this example, we will see:

    - How a stack gets created.

    - How to display the elements of the stack, and use the `Count` and `Contains`
    methods.


    ![](Images/image00114.jpeg) **Code Explanation:**


    1. The first step is used to declare the `Stack`. Here we are declaring `st` as
    a variable to hold the elements of our stack.

    2. Next, we add 3 elements to our stack. Each element is added via the `Push`
    method.

    3. Now since the stack elements cannot be accessed via the index position like
    the array list, we need to use a different approach to display the elements of
    the stack. The `obj` is a temporary variable, which is declared for holding each
    element of the stack. We then use the `foreach` statement to go through each element
    of the stack. For each stack element, the value is assigned to the `obj` variable.
    We then use the `Console.Writeline` command to display the value to the console.

    4. We are using the `Count` property (`st.count`) to get the number of items in
    the stack. This property will return a number. We then display this value to the
    console.

    5. We then use the `Contains` method to see if the value of 3 is present in our
    stack. This will return either a true or false value. We then display this return
    value to the console.


    If the above code is entered properly and the program is run the following output
    will be displayed.


    **Output:**


    ![](Images/image00115.jpeg)


    From the output, we can clearly see that the elements of the stack are displayed.
    Also, the value of True is displayed to say that the value of 3 is defined on
    the stack.


    **Note**: You have noticed that the last element pushed onto the stack is displayed
    first. This is the topmost element of the stack. The count of stack elements is
    also shown in the output.


    Now let’s look at the “remove” functionality. We will see the code required to
    remove the topmost element from the stack.


    ![](Images/image00116.jpeg) **Code Explanation:**


    1. Here we just issue the `pop` method which is used to remove an element from
    the stack.


    If the above code is entered properly and the program is run, the following output
    will be displayed.


    **Output:**


    ![](Images/image00117.jpeg)

    We can see that the element 3 was removed from the stack.


    ## C# Queue

    The `Queue` is a special case collection which represents a first in first out
    concept. Imagine a queue of people waiting for the bus. Normally, the first person
    who enters the queue will be the first person to enter the bus. Similarly, the
    last person to enter the queue will be the last person to enter into the bus.
    Elements are added to the stack, one on the top of each other.


    The process of adding an element to the queue is the `enqueuer` operation. To
    remove an element from a queue, you can use the `dequeuer` operation. The operation
    in queues are similar to stack we saw previously.


    Let’s look at the operations available for the `Queue` collection in more detail.


    ### Declaration of the Queue

    The declaration of a `Queue` is provided below. A `Queue` is created with the
    help of the `Queue` Data type. The `new` keyword is used to create an object of
    a `Queue`. The object is then assigned to the variable `qt`.


    ```csharp

    Queue qt = new Queue()

    ```


    ### Adding elements to the Queue

    The `enqueue` method is used to add an element onto the queue. The general syntax
    of the statement is given below.


    ```csharp

    Queue.enqueue(element)

    ```


    ### Removing elements from the queue

    The `dequeue` method is used to remove an element from the queue. The `dequeue`
    operation will return the topmost element of the stack. The general syntax of
    the statement is given below.


    ```csharp

    Queue.pop()

    ```


    ### Count

    This property is used to get the number of items in the `Queue`. Below is the
    general syntax of this statement.


    ```csharp

    Queue.Count

    ```


    ### Contains

    This method is used to see if an element is present in the `Queue`. Below is the
    general syntax of this statement. The statement will return true if the element
    exists, else it will return the value false.


    ```csharp

    Queue.Contains(element)

    ```


    Now let’s see this working at a code level. All of the below-mentioned code will
    be written to our Console application. The code will be written to our `Program.cs`
    file. In the below program, we will write the code to see how we can use the abovementioned
    methods.


    In this example, we will see:

    - How a stack gets created.

    - How to display the elements of the stack, and use the `Count` and `Contains`
    methods.


    ![](Images/image00118.jpeg) **Code Explanation:**


    1. The first step is used to declare the `Queue`. Here we are declaring `qt` as
    a variable to hold the elements of our stack.

    2. Next, we add 3 elements to our stack. Each element is added via the `Enqueue`
    method.

    3. Now one thing that needs to be noted about Queues is that the elements cannot
    be accessed via the index position like the array list. We need to use a different
    approach to display the elements of the stack. So here’s how we go about displaying
    the elements of a queue.


    We first declare a temporary variable called `obj`. This will be used to hold
    each element of the Queue.


    We then use the `foreach` statement to go through each element of the stack. For
    each Queue element, the value is assigned to the `obj` variable. We then use the
    `Console.Writeline` command to display the value to the console.

    4. We are using the `Count` property to get the number of items in the stack.
    This property will return a number. We then display this value to the console.

    5. We then use the `Contains` method to see if the value of 3 is present in our
    stack. This will return either a true or false value. We then display this return
    value to the console.

