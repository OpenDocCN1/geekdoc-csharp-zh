    ## 3. Logical Operators


    These are operators used for performing Logical operations on values. Below is
    the list of operators available in C#.


    ### Operator Description


    - `&&`: This is the Logical AND operator. If both the operands are true, then
    condition becomes true.

    - `||`: This is the Logical OR operator. If any of the operands are true, then
    condition becomes true.

    - `!`: This is the Logical NOT operator.


