    These will be used to showcase relational and arithmetic operations. A Boolean
    variable is defined to showcase logical operations.

    2. An example of the arithmetic operation is shown wherein the addition operator
    is carried out on `val1` and `val2`. The result is written to the console.

    3. An example of the relational operation is shown wherein the less than operator
    is carried out on `val1` and `val2`. The result is written to the console.

    4. An example of the logical operation is shown, wherein the logical operator
    `!` is applied to the `status` variable. The logical NOT operator reverses the
    current value of any Boolean value. So if a Boolean value is ‘true’, the logical
    NOT will return the value ‘false’ and vice versa. In our case since the value
    of the `status` variable is ‘true’, the result will show ‘false’. The result is
