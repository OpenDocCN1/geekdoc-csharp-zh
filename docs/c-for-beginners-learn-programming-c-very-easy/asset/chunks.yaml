    ## **Streams – Reading and Writing to files**


    In C# file operations, normally streams are used to read and write to files. A
    stream is an additional layer created between an application and a file. The stream
    is used to ensure smooth read and write operations to the file.


    Streams are normally used when reading data from large files. By using streams,
    the data from large files in broken down into small chunks and sent to the stream.
    These chunks of data can then be read from the application.


    The reason for breaking it down into small chunks is because of the performance
    impact of reading a big file at one shot. If you were to read the data from say,
    a 100 MB file at one shot, your application could just hang and become unstable.
    The best approach is then to use streams to break the file down into manageable
    chunks.


    So when a write operation is carried out on the file, the data to be written,
    is first written to the stream. From the stream, the data is then written to the
    file. The same goes for the read operation. In the read operation, data is first
    transferred from the file to the stream. The data is then read from the application
    via the stream. Let’s look at an example of how we can read and write using streams.


    For our example, we will assume that we have a file in the D drive called Example.txt.
    The file will be a simple text file and have 2 lines as shown below Guru99 - .Net


