    \ `SetTutorial` 和 `GetTutorial` 的方法，那么它就必须是这样。\n\n### 总结\n\n类是数据属性和方法的封装。属性用于定义类中数据的类型。方法定义了可以在数据上执行的操作。\n\
    \n构造函数用于在每次创建对象时初始化类的字段。\n\n构造函数是一个与类本身同名的方法。继承是子类继承父类的字段和方法的过程。子类随后也可以定义它自己的方法。\n\
