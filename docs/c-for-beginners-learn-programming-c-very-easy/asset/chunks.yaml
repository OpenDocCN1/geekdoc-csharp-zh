    2. 在 `TreeNode Editor` 中，点击 `Add Root` 按钮向树集合添加一个根节点。

    3. 接下来，更改 `Root` 节点的 `text`，提供文本作为 `Root` 并点击 `‘OK` 按钮。这将添加 `Root` 节点。


