    1. 第一步用于声明 `Queue`。在这里我们将 `qt` 声明为变量，用于保存栈的元素。

    2. 接下来，向我们的栈中添加 3 个元素。每个元素都通过 `Enqueue` 方法添加。

    3. 现在，关于队列需要注意的是，元素不能像列表那样通过索引位置访问。我们需要使用不同的方法来显示栈的元素。所以这就是我们如何显示队列元素。


    我们首先声明一个名为 `obj` 的临时变量。这将用于持有队列的每个元素。


    然后我们使用 `foreach` 语句遍历栈的每个元素。对于每个栈元素，值被赋值给 `obj` 变量。然后我们使用 `Console.Writeline`
    命令将值显示到控制台上。

    4. 我们正在使用 `Count` 属性来获取栈中的项目数量。此属性将返回一个数字。然后我们把此值显示到控制台上。

    5. 接着，我们使用 `Contains` 方法检查值 3 是否存在于我们的栈中。这将返回 true 或 false 值。然后我们把此返回值显示到控制台上。


