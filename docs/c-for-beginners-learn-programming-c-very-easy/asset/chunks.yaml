    **输出：**


    ![](img/image00117.jpeg)

    我们可以看到元素 3 已经从栈中移除。


    ## C# Queue

    `Queue` 是一种特殊的集合，代表了先进先出（FIFO）的概念。想象有一队等公交的人。通常情况下，第一个进入队列的人将是第一个上车的人。同样，最后一个进入队列的人将是最后一个上车的人。元素被添加到栈中（注：此处原文应为队列）。


    向队列添加元素的过程是 `enqueuer` 操作。要从队列中移除元素，你可以使用 `dequeuer` 操作。队列中的操作与我们之前看到的栈类似。


    让我们详细查看 `Queue` 集合提供的可用操作。


    ### 队列的声明

    `Queue` 的声明所示。通过 `Queue` 数据类型创建队列。使用 `new` 关键字创建 `Queue` 对象。然后将该对象赋值给变量 `qt`。


    ```csharp

    Queue qt = new Queue()

    ```


    ### 向队列中添加元素

    使用 `enqueue` 方法将元素添加到队列中。该语句的通用语法所示。


    ```csharp

    Queue.enqueue(element)

    ```


    ### 从队列中移除元素

    使用 `dequeue` 方法从队列中移除元素。`dequeue` 操作将返回栈的最顶端元素（注：此处原文应为队列）。该语句的通用语法所示。


    ```csharp

    Queue.pop()

    ```


    ### Count

    此属性用于获取 `Queue` 中的项目数量。下面是该语句的通用语法。


    ```csharp

    Queue.Count

    ```


    ### Contains

    此方法用于检查元素是否存在于 `Queue` 中。下面是该语句的通用语法。如果元素存在，语句将返回 true，否则将返回值 false。


    ```csharp

    Queue.Contains(element)

    ```


