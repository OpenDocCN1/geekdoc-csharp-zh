    2. 最后，使用 `console.write` 函数将布尔值显示在控制台上。


    如果正确输入了上述代码并成功执行程序，将显示输出。

    **输出：**


    ![](img/image00064.jpeg)

    从输出中你可以清楚地看到控制台上显示了等于 `true` 的布尔变量。


    # 4. **字符串 (String)**

    String 数据类型用于处理字符串值。在 C# 中，该数据类型由关键字 `String` 表示。下面是此数据类型的示例。


    在示例中，我们将定义一个名为 `message` 的 String 变量。然后为该变量赋值一个 `String` 值，并相应地显示它。


    ![](img/image00065.jpeg)

