    \ you can clearly see that the values of both the string and integer variable\
    \ are displayed to the console.\n\nOperators are used to perform operations on\
    \ values of various data types. For example, to perform the addition of 2 numbers,\
    \ the `+` operator is used. Let’s see the table of operators available for the\
    \ various data types\n\n### 1. Arithmetic Operators\nThese are operators used\
    \ for performing mathematic operations on numbers. Below is the list of operators\
    \ available in C#.\n\n| Operator | Description |\n|---|---|\n| + | Adds two operands\
    \ |\n| - | Subtracts second operand from the first |\n| * | Multiplies both operands\
    \ |\n| / | Divides numerator by denominator |\n| % | Modulus Operator and remainder\
    \ after an integer division |\n| ++ | Increment operator increases integer value\
    \ by one |\n| -- | Decrement operator decreases integer value by one |\n\n###\
    \ 2. Relational Operators\nThese are operators used for performing Relational\
    \ operations on numbers. \n\n| Operator | Description |\n|---|---|\n| == | Checks\
