    \  c. **可选参数 (Optional parameters)** - 对于每种数据库类型，你可以指定可选参数以提供更多关于 `.net` 如何处理到数据库连接的泛。例如，可以指定连接保持活动状态多长时间的参数。如果在一段时间内没有执行操作，则该参数将决定是否必须关闭连接。\n\
    2. **从数据库选择数据 (Selecting data from the database)** – 一旦建立了连接，下一个重要方面就是从数据库中获取数据。C#\
    \ 具有对数据库执行 `SQL` 选择命令的能力。`SQL` 语句可用于从数据库中的特定表中获取数据。\n3. **向数据库插入数据 (Inserting\
    \ data into the database)** – C# 也可以用于向数据库插入记录。对于需要插入数据库的每一行，可以在 C# 中指定值。\n4.\
    \ **向数据库更新数据 (Updating data into the database)** – C# 也可以用于更新数据库中的现有记录。对于需要更新到数据库的每一行，可以在\
    \ C# 中指定新值。\n5. **从数据库删除数据 (Deleting data from a database)** – C# 也可以用于删除数据库中的记录。可以在\
    \ C# 中指定删除哪些行需要删除选择命令。\n\n好了，现在我们已经了解了每个操作的理论，让我们跳转到后续章节，看看我们如何在 C# 中执行数据库操作。\n\
    \n## .Net 中的连接\n\n让我们现在来看代码，这些代码需要放在那里以创建数据库的连接。在我们的示例中，我们将连接到名为 `Demodb` 的数据库。连接数据库使用的凭据如下所示\n\
