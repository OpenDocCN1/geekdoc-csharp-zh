    ## C# 序列化 (Serialization)


    每当需要将对象数据从一个应用程序发送到另一个应用程序时，就会使用序列化和反序列化的概念。序列化用于将应用程序数据导出到文件中。目标应用程序随后使用反序列化从应用程序中提取数据以供进一步使用。


