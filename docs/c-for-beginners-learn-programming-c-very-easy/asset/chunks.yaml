    # 第 1 章：什么是 .NET Framework


    .Net framework 是微软（Microsoft）开发的一个软件开发平台。该框架旨在创建运行在 Windows 平台上的应用程序。.Net framework
    的第一个版本于 2000 年发布。


    该版本被称为 `.Net framework 1.0`。从那时以后，.Net framework 取得了巨大的进步，当前版本为 `4.6.1`。


    .Net framework 可用于创建`基于表单的 (Form based)` 和 `基于 Web 的 (Web based)` 应用程序。也可以使用 .Net
    framework 开发 Web 服务。


    该框架还支持多种编程语言，如 Visual Basic 和 `C#`。因此，开发者可以根据需求选择语言来开发应用程序。在本章中，你将学习 .Net framework
    的基础知识。


    ## .Net Framework 架构


    .Net framework 的基本架构如下所示。


    ![](img/image00050.jpeg).Net framework 的架构基于以下关键组件；1. `Common Language Runtime`（通用语言运行时）——“通用语言体系”或
    `CLI` 是执行 .Net 程序的平台。


    `CLI` 具有以下关键特性：


    异常处理（Exception Handling）——异常是在应用程序执行时发生的错误。异常的示例包括：

    - 如果应用程序尝试打开本地机器上的文件，但该文件不存在。

    - 如果应用程序尝试从数据库获取某些记录，但与数据库的连接无效。


    垃圾回收（`Garbage Collection`）——垃圾回收是在不再需要时移除资源的过程。垃圾回收的示例包括：

    - 不再需要的文件句柄。如果应用程序完成了对文件的所有操作，那么该文件句柄可能不再需要了。

    - 不再需要的数据库连接。如果应用程序完成了对数据库的所有操作，那么数据库连接可能不再需要了。


    与各种编程语言协作工作——


    如前面的章节所述，开发者可以使用多种 .Net 编程语言开发应用程序。


    1. 语言——第一层是编程语言本身，最常见的有 `VB.Net` 和 `C#`。

    2. 编译器——每种编程语言都有一个独立的编译器。因此，在 `VB.Net` 语言下方，有一个独立的 `VB.Net` 编译器。同样，对于 `C#`，你会有另一个编译器。

    3. 通用语言解释器（Common Language Interpreter）——这是 .Net 的最后层，用于运行用任何编程语言开发的 .net 程序。因此，后续编译器会将程序发送到
    `CLI` 层来运行 .Net 应用程序。


    ![](img/image00051.jpeg)


    2. 类库（Class Library）——.NET Framework 包含一组标准类库。类库是用于核心用途的方法和函数的集合。


    例如，有一个类库包含处理所有文件级操作的方法。因此，有一个方法可以用于从文件中读取文本。同样，有一个方法可以将文本写入文件。


    大多数方法都被划分为 `System.*` 或 `Microsoft.*` 命名空间。（星号 `*` 仅表示对 `System` 或 `Microsoft`
    命名空间下所有方法的引用）。


    命名空间（Namespace）是方法的逻辑隔离。我们将在后续章节中更详细地学习这些命名空间。


    3. 语言——在 .Net framework 中可以构建的应用程序类型大致分为以下几类。


    `WinForms` —— 用于开发基于表单的应用程序，这些程序运行在终端用户机器上。记事本（Notepad）是客户端应用程序的一个示例。


    `ASP.Net` —— 用于开发基于 Web 的应用程序，这些程序旨在运行在任何浏览器上，如 Internet Explorer、Chrome 或 Firefox。Web
    应用程序将在安装了 Internet 信息服务（IIS）的服务器上处理。Internet 信息服务或 `IIS` 是微软的一个组件，用于执行 `ASP.net`
    应用程序。执行结果随后发送到客户端机器，输出显示在浏览器中。


    `ADO.Net` —— 这项技术用于开发与 Oracle 或 Microsoft SQL Server 等数据库交互的应用程序。


    ## .Net framework 的不同版本


    下面是 .Net framework 版本的表格，列出了它们的发布日期。每个版本对框架都有相应的更改。


    例如，在框架 3.5 及之后的版本中，发布了一个名为 `Entity framework` 的关键框架。该框架用于改变在处理数据库时开发应用程序的方法。


    | 版本号 | CLR 版本 | 发布日期 |

    | :--- | :--- | :--- |

    | 1.0 | 1.0 | 2002-02-13 |

    | 1.1 | 1.1 | 2003-04-24 |

    | 2.0 | 2.0 | 2005-11-07 |

    | 3.0 | 2.0 | 2006-11-06 |

    | 3.5 | 2.0 | 2007-11-19 |

    | 4.0 | 4 | 2010-04-12 |

    | 4.5 | 4 | 2012-08-15 |

    | 4.5.1 | 4 | 2013-10-17 |

    | 4.5.2 | 4 | 2014-05-05 |

    | 4.6 | 4 | 2015-07-20 |

    | 4.6.1 | 4 | 2015-11-17 |


    .Net framework 最大的优势是它支持 Windows 平台。几乎所有人都在使用 Windows 机器工作。微软始终确保 .Net frameworks
    符合所有支持的 Windows 操作系统。


    .Net framework 的以下设计原则使其创建基于 .Net 的应用程序非常有意义。


    1. 交互性（Interoperability）——.Net framework 提供了大量的向后支持。假设你有一个基于旧版本 .Net framework（例如
    `2.0`）构建的应用程序。如果你尝试在具有较高版本 .Net framework（例如 `3.5`）的机器上运行相同的应用程序，它仍然可以运行。这是因为每次发布，微软都确保旧框架版本与新版本良好融合。

    2. 可移植性（Portability）——在 .Net framework 上构建的应用程序可以运行在任何 Windows 平台上。现在微软也设想让微软产品运行在
    iOS 和 Linux 等平台上。

    3. 安全性（Security）——NET Framework 具有良好的安全机制。内置的安全机制有助于应用程序的验证和确认。每个应用程序都可以显式地定义自己的安全机制。每个安全机制用于授予用户访问代码或运行程序的权限。

    4. 内存管理（Memory management）——通用语言运行时负责所有的内存管理工作。.Net framework 有能力识别未被运行程序使用的资源。它随后会相应释放这些资源。这是通过一个名为“垃圾回收器”的程序实现的，它是
    .Net framework 的一部分。垃圾回收器定期运行，检查哪些系统资源未被利用并相应释放它们。

    5. 简化部署（Simplified deployment）——.Net framework 还拥有工具，用于封装基于 .Net framework 构建的应用程序。这些包可以分发到客户端机器。这些包将自动安装应用程序。


    ## 总结


    .Net 是微软开发的一种编程语言。它旨在构建运行在 Windows 平台上的应用程序。.Net 编程语言可用于开发基于表单的应用程序、基于 Web 的应用程序以及
    Web 服务。


