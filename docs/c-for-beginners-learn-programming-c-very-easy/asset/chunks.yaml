  trans: "\n\nc. `UserID` 和 `Password` 是连接数据库所需的凭据。\n\n3. 接下来，我们将连接字符串赋值给变量 `cnn`。变量\
    \ `cnn` 的类型为 `SqlConnection`，实际上用于建立与数据库的连接。\n\n4. 接下来，我们使用 `cnn` 变量的 `Open` 方法打开到数据库的连接。然后我们向用户显示一条消息，说明连接已建立。\n\
    \n5. 一旦操作成功完成，我们就关闭到数据库的连接。如果数据库上不再需要进行其他操作，关闭连接始终是一个良好的习惯。\n\n设置好上述代码并使用 Visual\
    \ Studio 执行项目后，你将获得下面的输出。表单显示后，点击 Connect（连接）按钮。**输出：**\n\n![](img/image00164.jpeg)\n\
    \n当你点击“connect”按钮时，从输出可以清楚地看到数据库连接已建立。因此，了消息框。\n\n## 访问数据\n\n为了演示如何使用 C# 访问数据，让我们假设数据库中具有以下构件。\n\
    \n1. 一个名为 `demotb` 的表。该表将用于存储各种教程（Tutorials）的 ID 和名称。\n2. 该表将有 2 列，一个称为 `TutorialID`，另一个称为\
    \ `TutorialName`。\n3. 此时，该表有 2 行，如下所示。\n\nTutorialID | TutorialName\n1 C#\n2 ASP.Net\n\
    \n让我们修改表单中的代码，以便我们可以查询这些数据并通过 Messagebox（消息框）显示信息。请注意，下面输入的所有代码都是上一节中编写的数据连接代码的延续。\n\
    \n### 步骤 1) 让我们将代码分为部分，以便用户理解。\n\n第一部分是构建我们的“select”语句，它将用于从数据库读取数据。然后我们对数据库执行“select”语句，并据此获取表中所有的行。\n\
    \n![](img/image00165.jpeg)\n\n1. 第一步是创建以下变量：\n    a. `SQLCommand` – `SQLCommand`\
    \ 是 C# 中定义的一个类。该类用于执行对数据库的读取和写入操作。因此，第一步是确保我们创建该类类型的变量。该变量将在后续从数据库中读取数据的步骤中使用。\n\
    \    b. `areader` 对象用于获取 SQL 查询指定的所有数据。然后我们可以使用数据读取器逐行读取表的所有行。\n    c. 然后我们定义\
    \ 2 个字符串变量，一个是 `SQL`，用于存储我们的 SQL 命令字符串。另一个是 `Output`，它将包含所有的表值。\n2. 下一步是实际定义 SQL\
    \ 语句，该语句将用于我们的数据库。在我们的情况下，它是 `Select TutorialID, TutorialName from demotb`。这将从\
    \ `demotb` 表中获取所有行。\n3. 接下来，我们创建一个命令对象，用于对数据库执行 SQL 语句。在 SQL 命令中，你必须传递连接对象和 SQL\
    \ 字符串。\n4. 接下来，我们将执行数据读取器命令，它将从 `demotb` 表获取所有行。\n5. 现在我们已经有了表的所有行，我们需要一种机制来逐个访问行。为此，我们将使用\
    \ `while` 语句。`while` 语句将用于逐次访问数据读取器中的行。然后我们使用 `GetValue` 方法来获取 `TutorialID` 和\
    \ `TutorialName` 的值。\n\n### 步骤 2) 在最后一步，我们将向用户显示输出并关闭所有与数据库操作相关的对象。\n\n![](img/image00166.jpeg)\n\
    \n1. 我们继续代码，使用 `MessageBox` 显示 `Output` 变量的值。`Output` 变量将包含来自 `demotb` 表的所有值。\n\
    2. 我们最后关闭所有与数据库操作相关的对象。记住，这是一个良好的习惯。\n\n设置好上述代码并使用 Visual Studio 运行项目，你将获得下面的输出。表单显示后，点击\
    \ Connect（连接）按钮。**输出：**\n\n![](img/image00167.jpeg)\n\n从输出中，你可以清楚地看到程序能够从数据库获取值。数据显示在消息框中。\n\
    \n## C# 插入数据库\n\n就像访问数据一样，C# 也有能力向数据库中插入记录。为了演示如何向我们的数据库插入记录，让我们使用上面使用的相同表结构。\n\
    \nTutorialID | TutorialName\n1 C#\n2 ASP.Net\n\n让我们修改表单中的代码，以便我们可以向表中插入以下行：\n\n\
    TutorialID | TutorialName\n3 VB.Net\n\n所以让我们将以下代码添加到我们的程序中。下面的代码段将用于向我们的数据库插入现有记录。\n\
    \n![](img/image00168.jpeg)\n\n**代码解释：**\n\n1. 第一步是创建以下变量：\n    a. `SQLCommand`\
    \ – 此数据类型用于定义用于对数据库执行 SQL 操作的对象。此对象将持有将在我们的 SQL Server 数据库运行的 SQL 命令。\n    b.\
    \ `adapter` 对象用于执行特定的 SQL 操作，如插入、删除和更新命令。\n    c. 然后我们定义一个字符串变量，即 `SQL`，用于存储我们的\
    \ SQL 命令字符串。\n2. 下一步是实际定义 SQL 语句，该语句将用于我们的数据库。在我们的情况下，它是 `Select TutorialID, TutorialName\
    \ from demotb`。\n3. 接下来，我们创建一个命令对象，用于对数据库执行 SQL 语句。在 SQL 命令中，你必须传递连接对象和 SQL 字符串。\n\
    4. 在我们的数据适配器命令中，我们现在将插入命令与适配器关联。然后我们调用 `ExecuteNonQuery` 方法，它用于对数据库执行语句。`ExecuteNonQuery`\
    \ 用于 C# 中执行任何 DML（数据操纵）语句。\n5. 我们最后关闭所有与数据库操作相关的对象。记住，这是一个良好的习惯。\n\n设置好上述代码并使用\
    \ Visual Studio 执行项目，你将获得下面的输出。表单显示后，点击 Connect（连接）按钮。**输出：**\n\n![](img/image00169.jpeg)\n\
    \n如果你实际上去 SQL Server Express 查看 `demotb` 表中的行，你将看到插入的行如下所示：\n\n![](img/image00170.jpeg)\n\
    \n## C# 更新数据库\n\n就像访问数据一样，C# 也有更新数据库中现有记录的能力。为了演示如何更新我们数据库中的记录，让我们使用上面相同的表结构。\n\
    \nTutorialID | TutorialName\n1 C#\n2 ASP.Net\n3 VB.Net\n\n让我们修改表单中的代码，以便我们可以更新以下行。旧行的值是\
    \ TutorialID 为“3”，Tutorial Name 为“VB.Net”。我们将将其更新为“VB.Net complete”，而 Tutorial\
    \ ID 的行值保持不变。\n\n**旧行**\nTutorialID 3\nTutorialName VB.Net\n\n**新行**\nTutorialID\
    \ 3\nTutorialName VB.Net complete\n\n"
