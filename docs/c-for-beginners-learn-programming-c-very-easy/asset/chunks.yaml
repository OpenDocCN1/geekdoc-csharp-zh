    ### Step 5

    Now that the data source is defined, we now need to connect the `TutorialID` and
    `TutorialName` textbox to the `demotb` table. When you click on the `Text` property
    of either the `TutorialID` or `TutorialName` textbox, you will now see that the
    binding source to `Demotb` is available.


    For the first text box choose the `Tutorial ID`. Repeat this step for the second
    textbox and choose the field as `TutorialName`. The below steps shows how we can
    navigate to each control and change the binding accordingly.


    1. Click on the `Tutorial ID` control.


    ![](Images/image00184.jpeg)


    2. In the `Properties` window, you will see the properties of the `TutorialID`
    textbox. Go to the `text` property and click on the down arrow button.


    ![](Images/image00185.jpeg)


    3. When you click the down arrow button, you will see the `demotbBinding Source`
    option. And under this, you will see the options of `TutorialName` and `TutorialID`.
    Choose the `Tutorial ID` one.


    ![](Images/image00186.jpeg)


    Repeat the above 3 steps for the `Tutorial Name` text box.


    1. So click on the `Tutorial Name` text box.

    2. Go to the `properties` window

    3. Choose the `Text` property.

    4. Choose the `TutorialName` option under `demotbBindingSource`.


    ### Step 6

    Next we need to change the `Binding Source` property of the `BindingNavigator`
    to point to our `Demotb` data source. The reason we do this is because the `Binding
    Navigator` needs to also know which table it needs to refer to.


    The `Binding Navigator` is used to select the next or previous record in the table.
