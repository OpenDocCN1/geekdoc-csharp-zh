    ## **C# Polymorphism**


    Polymorphism is a concept wherein a method can be defined more than one time.
    But each time, the function would have a different set of parameters passed on
    to it.


    You will get a better understanding if we see this action.


    Let’s now see, how we can incorporate the concept of Polymorphism in our code.


    **Step 1)** The first step is to change the code for our Tutorial class. In this
    step, we add the below code to the Tutorial.cs file.


    ![](Images/image00102.jpeg)**Code Explanation:**


    1 & 2) The first step is the same as in our earlier examples. We are keeping the
    definition of the SetTutorial method as it is.


    3) This method sets the TutorialID and the TutorialName based on the parameters
    pID and pName.


    4) This is where we make a change to our class wherein we add a new method with
    the same name of SetTutorial. Only this time we are only passing one parameter
    which is the pName. In this method, we are just setting the field of TutorialName
    to pName.


    **Step 2)** The last step is to modify our main Program.cs file. In our console
    application, we are going to make an object of the Guru99Tutorial class.


    ![](Images/image00103.jpeg)**Code Explanation:**


    1\. In the first step, we are using the SetTutorial method with 2 parameters.


    Where we are passing both the TutorialID and TutorialName to this method. 2\.
    In the second step, we are now calling the SetTutorial method with just one


    parameter. We are just passing the TutorialName to this method.


