    ## 访问修饰符


    访问修饰符用于定义类属性或或的可见性。在某些情况下，你可能不希望其他程序看到类的属性或方法。在这种情况下，C# 提供了在类属性和方法上放置修饰符的能力。类修饰符具有限制访问的能力，使得其他程序无法看到类的属性或方法。


    通常有 3 种访问修饰符。它们解释如下：


    1. **Private (私有)** – 当此访问修饰符附加到属性或方法上时，意味着这些成员无法从任何外部程序访问。


    让我们举个例子，看看使用私有访问修饰符时会发生什么。


    让我们修改 `Tutorial.cs` 文件中的当前代码。在 `SetTutorial` 方法中，我们将 `public` 关键字改为 `private`。


