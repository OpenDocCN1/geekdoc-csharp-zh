    # Introduction


    Unity is a cross-platform development platform initially created for developing
    games but is now used for a wide range of things such as: architecture, art, children''s
    apps, information management, education, entertainment, marketing, medical, military,
    physical installations, simulations, training, and many more.Unity takes a lot
    of the complexities of developing games and similar interactive experiences and
    looks after them behind the scenes so people can get on with designing and developing
    their games. These complexities include graphics rendering, world physics and
    compiling. More advanced users can interact and adapt them as needed but for beginners
    they need not worry about it.Games in Unity are developed in two halves; the first
    half -within the Unity editor, and the second half -using code, specifically C#.
    Unity is bundled with MonoDevelopor Visual Studio 2015 Communityfor writing C#.


    ## 2D OR 3D PROJECTS


    Unity is equally suited to creating both 2D and 3D games. But what’s the difference?
    When you create a new project in Unity, you have the choice to start in 2D or
    3D mode. You may already know what you want to build, but there are a few subtle
    points that may affect which mode you choose.The choice between starting in 2D
    or 3D mode determines some settings for the Unity Editor -such  as  whether  images 
    are  imported  as  textures  or  sprites.  Don’t  worry  about  making  the wrong
    choice though, you can swap between 2D or 3D mode at any time regardless of the
    mode you set when you created your project. Here are some guidelines which should
    help you choose.


    ## Full 3D


    ![](OEBPS/Image00000.jpg)


    3D  games  usually  make  use  of  three-dimensional  geometry,  with  materials 
    and  textures rendered on the surface of these objects to make them appear as
    solid environments, characters and  objects  that  make  up  your  game  world. 
    The  camera  can  move  in  andaround  the  scene freely, with light and shadows
    cast around the world in a realistic way. 3D games usually render the  scene 
    using  perspective,  so  objects  appear  larger  on  screen  as  they  get  closer 
    to  the camera. For all games that fit this description, start in3Dmode.


    ## Orthographic 3D


    ![](OEBPS/Image00001.jpg)


    Sometimes  games  use  3D  geometry,  but  use  an  orthographic  camera  instead 
    of  perspective. This is a common technique used in games which give you a bird’s-eye
    view of the action, and is  sometimes  called  “2.5D”.  If  you’re  making  a 
    game  like  this,  you  should  also  use  the  editor in3Dmode,  because  even 
    though  there  is  noperspective,  you  will  still  be  working  with  3D models    
    and     assets.     You’ll     need     to     switch     yourcameraandscene    
    viewtoOrthographicthough.(scenes above fromSynty StudiosandBITGEM)


    ## Full 2D


    ![](OEBPS/Image00002.jpg)


    Many 2D games use flat graphics, sometimes called sprites, which have no three-dimensional
    geometry  at  all.  They  are  drawn  to  the  screen  as  flat  images,  and 
    the  game’s  camera  has  no perspective. For this type of game, you should start
    the editor in 2D mode.


    ## 2D gameplay with 3D graphics


    ![](OEBPS/Image00003.jpg)


    Some   2D   games   use   3D   geometry   for   the   environment   and   characters,  
    but   restrict thegameplayto  two  dimensions.  For  example,  the  camera  may 
    show  a  “side  scrolling  view” and the player can only move intwo dimensions,
    but game still uses 3D models for the obstacles and a 3D perspective for the camera.
    For these games, the 3D effect may serve a stylistic rather than functional purpose.
    This type of game isalsosometimes referred to as “2.5D”. Although the gameplay
    is 2D, you will mostly be manipulating 3D models to build the game so you should
    start the editor in 3D mode.


    Perhaps the gaming industry is one of the most difficult industries in this era,
    and that is in many ways that start with technical challenges, passing through
    an audience that is difficult to satisfy and ruthless even for the major companies
    if their products are not at the required level, and not an end to fierce competition
    and high failure rates and the difficulty of achieving profits that cover high
    production costs.


    On the other hand, there are features of this industry that make survival in it
    possible. On the technical side, for example, the vast majority of games are not
    free of similar functions and repetitive patterns of data processing, which makes
    the reuse of the software modules of previous games in order to create new games
    possible. This, in turn, contributes to overcoming technical obstacles and shortening
    time and effort.


    When you talk about making a game, you are here to mention the big process that
    involves dozens and possibly hundreds of tasks to accomplish in many areas. Making
    a game means producing, marketing, and publishing it, and all the administrative,
    technical, technical, financial, and legal procedures and steps involved in these
    operations. However, what is important for us in this series of lessons is the
    technical aspect which is game development, which is the process of building the
    final software product with all its components. This process does not necessarily
    include game design, as the design process has a broader perspective and focuses
    on such things as the story, the general characteristic of the game, the shapes
    of the stages and the nature of the opponents, as well as the rules of the game,
    its goals and terms of winning and losing.


    Returning to the game development process, we find that many specializations and
    skills contribute to this process. There are painters, model designers, animation
    technicians, sound engineers, and director, in addition to - of course - programmers.
    This comprehensive view is important to know that the programmer''s role in producing
    the game is only an integral role for the roles of other team members, though
    this image is beginning to change with the emergence of independent developers
    Indie Developers who perform many tasks besides programming.


