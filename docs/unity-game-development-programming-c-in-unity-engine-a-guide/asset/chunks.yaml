    \ (doubleTouch)\n    {\n        // 在屏幕上，A, B 位置分别代表\n        // 在当前帧 2 和上一帧 1\
    \ 中的两个手指位置\n        Vector2 posA1, posA2, posB1, posB2;\n        Touch a, b;\n\
    \        a = Input.touches [0];\n        b = Input.touches [1];\n        posA2\
    \ = a.position;\n        posB2 = b.position;\n        posA1 = a.position - a.deltaPosition;\n\
    \        posB1 = b.position - b.deltaPosition;\n        // 确保手指之间的距离自上一帧相比\n \
    \       // 增加或减少了\n        float currentDist = Vector2.Distance (posA2, posB2);\n\
    \        float prevDist = Vector2.Distance (posA1, posB1);\n        // 用当前距离减去之前的距离将得到\n\
    \        // 缩放或收焦的正确引用值\n        camControl.Zoom ((currentDist - prevDist) * zoomingSpeed);\n\
    \    }\n}\n```\n\n此程序的运行依赖于四个主要步骤：\n\n- 检查单指触摸屏幕。\n- 接着检查使用手指进行的相机移动。\n- 然后再次检查双指触摸屏幕。\n\
    - 最后确保使用双指执行缩放和收焦。\n\n读取触摸屏输入如下：首先，我们通过变量 `Input.touchCount` 识别屏幕上的触摸次数，如果触摸次数等于\
    \ 1，则意味着玩家将手指放在了屏幕上，并且可能在移动相机。在这里，我们使用 `singleTouch` 和 `doubleTouch` 变量来存储检测到的触摸次数。这些触摸存储在\
    \ `Input.touches` 矩阵中，它是一个包含 `Touch` 元素的数组。这种类型的变量包含了屏幕上每个触摸点的信息。我们将处理的这些信息第一个是\
    \ `Touch.phase`，它代表触摸所经历的阶段。一旦玩家将手指放在屏幕上，阶段将变为 `TouchPhase.Began`。触摸屏幕的第一个时刻非常重要，因为我们必须检查玩家是否将手指放在了背景或地板上，从而决定是否允许他移动相机。\n\
    \n例如，验证玩家是否将手放在背景或地面上是通过 `UpdateSingleTouch()` 函数完成的，在该函数中，我们首先必须将手指位置从屏幕坐标转换为场景坐标，就像我们处理鼠标指针一样。接下来，我们提取该元素的碰撞组件（collision\
    \ component），然后使用射线检测（Ray Casting）。这是物理引擎用于检测直线与物体相交的方法，我们在这里用它从触摸点向非常接近的点绘制一条极短的线，并查看此线是否与碰撞组件相交。射线通过\
    \ `Physics2D.Raycast()` 执行，它接受三个变量：第一个变量是起始位置，第二个变量是射线将传播的方向，而第三个变量（一个数值）决定了射线可以传播的最大距离。在这里我们注意到使用了非常短的距离，这当起始位置已经在碰撞组件内部时是足够的。该函数返回的类型类型为\
    \ `Raycast2D`，并包含一个存储射线击中碰撞组件的变量。\n\n然后我们检查射线击中的组件是否与我们从当前元素提取的碰撞组件相同。如果是这样，我们就依赖于玩家对背景或地面的触摸，并通过将\
    \ `singleTouch` 的值改为 `true` 来允许其移动相机。如果触摸处于另一个阶段，例如 `TouchPhase.Ended` 或 `TouchPhase.Canceled`，则意味着玩家已从屏幕上抬起手指，将\
    \ `singleTouch` 返回为 `false`。如果我们检测到 `Input.touchCount` 中的手指数量不等于 1，也会发生这种情况，因此我们不允许玩家移动相机。\n\
    \n`UpdateDragging()` 函数负责移动相机，因此它首先必须检查 `singleTouch` 的值，然后通过 `player.deltaPosition`\
    \ 乘以速度来移动相机。注意在这里我们不需要存储之前的触摸位置，因为偏移值直接产生，这与处理鼠标指针的情况相反。\n\n`UpdateDoubleTouch()`\
    \ 函数随后验证玩家屏幕上有两个手指，在这种情况下，它会立即将 `doubleTouch` 的值改为 `true`。注意，除了可以用于更多用途的单指触摸外，双指触摸在游戏中除了缩放外没有意义。因此，我们不需要验证两个手指的位置，它们的存在就足以防止任何除缩放和收焦以外的输入。\n\
    \n最后，`UpdateZooming()` 函数通过 `doubleTouch` 变量确保屏幕上有两个手指，并计算以下 4 个位置：\n\n- `posA1`：第一个手指在上一帧的位置。\n\
    - `posA2`：第一个手指在当前帧的位置。\n- `posB1`：第二个手指在上一帧的位置。\n- `posB2`：第二个手指在当前帧的位置。\n\n\
    注意我们从当前手指位置中减去了位移，以便获得上一帧的手指位置，因为我们完全没有存储过这些位置。然后我们计算 `prevDist` 帧和 `currentDist`\
    \ 帧两个手指之间的距离。记住，`Control` 组件中的 `Zoom()` 函数如果给它负值它会缩小，如果给它正值它会放大。为了做到，我们用当前距离减去之前的距离，并将结果乘以\
    \ `zoomingSpeed`。这样我们确保了当玩家远离手指时得到正值（放大），当玩家靠近手指时得到负值（收焦），这种行为当然是手机和平板电脑用户的典型特征。\n\
