    ![image08.thumb.png.8f596aea52fa0c4660567c](OEBPS/Image00011.jpg)


    We will now quickly discuss the most important background mechanisms for the BackgroundManager
    applet. All programs in Unity take almost the same format, starting with defining
    the necessary variables, and then the two most frequently used functions are `Start()`
    and `Update()`. As shown in the comments on the code, the `Start()` function is
    called only once at start-up if the object was already in the scene, or once it
    was added to the scene if it was not there before. Then the game enters into what
    we call the update loop or the frame rendering loop where the `Update()` function
    is called when each frame is rendered as long as the game is running. In this
    case, we do not need to use `Update`.


    Note that we started the applet by defining a number of variables, some of which
    are public and others private. For Unity, the general variables are of particular
    importance because it displays them as cells in the properties screen, allowing
    you to change their values without modifying the code as we have seen before.
    The following is an explanation of these variables:


    - `bgElementPrefab` is used as a reference to access the template that we will
    use to create background elements when they are built.

    - `selectionList` An array containing `Sprite` objects that stores a list of all
    backgrounds that can be used.

    - `repeatCount` An integer that represents the number of times the background
    is repeated horizontally. Naturally, increasing this number will increase the
    width of the final background.

    - `selectedIndex` represents the background location currently displayed in the
    list, where the value 0 represents the first item.

    - `bgGameObject` We will use this variable to access the background object which
    we have set as the parent of all background images in the scene. It is worth noting
    here that in most cases we use a `Transform` variable to access objects, so there
    are many benefits we will know.


    At startup, the `Start()` function is called, which first searches the children
    for the object named `Background` and stores it in the `bgGameObject` variable.
    The second step that this function performs is to choose the first item in the
    list automatically to be the background of the scene by calling `ChangeBackground()`
    with the value 0.


    The `ChangeBackground()` function is the most important in this program, as it
    changes the background according to the value given to it when calling `newIndex`.
    If this value was originally equal to the value of the currently displayed `selectedIndex`
    value, there is no need to change anything, thus executing the function. Other
    than that, the function takes precautions for the presence of a currently displayed
    background and deletes it above all. The deletion is by passing all the `bgGameObject`
    sons and calling the `Destroy()` function to delete them from the scene. The object
    deletion state is one of the exceptions to the rule on dealing with objects via
    the `Transform` component, where deletion must take place at the entire object
    level and not on a specific component, thus we call `bgSprite.gameObject` when
    deletion.


    After deleting the previous background (if any) we need to add the new one. So
    the next step will be to store the value of the image in the `newIndex` element
    in the `newSprite` variable and then calculate the width of the original image
    in Unity space by dividing its width in pixels by the number of pixels in each
    unit. Since the frequency of the background image will revolve around the origin
    point, the farthest point to the left will be half the width of all the images
    that we will repeat, thus we calculate the `posX` value by multiplying half the
    total number of images `repeatCount` by the width of the single image `width`,
    and we convert the result to the negative value until we start from the left (Remember,
    we selected the image to the left of its image as its fulcrum in space).


    In addition to the starting point, we calculated the length and overall width
    of the scene after building the new background, and then we stored these values
    in a variable `Bounds` type, this variable simply stores a point in space and
    extensions for this point on the x and y axes. Note that we define the `span`
    variable as a two-dimensional vector and define the value of `x` as the number
    of times the background image is multiplied by the width of one image and the
    value of `y` as the height of one image. After that we sent a message to all other
    programs, whether on the root object or any object in the children, to inform
    it that the boundaries of the scene have changed, and we used that function (`BroadcastMessage`).
    When calling this function, we give it the name of the message, which is `SceneBoundsChanged`,
    and we also attach the `newBounds` variable that contains the new scene boundaries.
    We will see later what it means to send a message, how to receive it, and why
    it is important. Throughout this set of lessons we will deal extensively with
    messages, so it is okay to know early how to send them. Messages are sent in Unity
    using one of the following functions:


    - `BroadcastMessage` which sends a message to all the programs on the current
    object as well as to all the children and descendants of its descendants.

    - `SendMessage` which sends the message only to all programs on the current object.

    - `SendMessageUpwards` which sends the message to all applets of the current object
    as well as all of its parents and grandparents in the hierarchy.


    The iterative cycle following these steps is the one in which the background images
    in space are correctly constructed and distributed. We start with creating a new
    object `bg` using the `bgElementPrefab` template and then give it a sequential
    name according to its location in the background set from left to right (for example
    `BG_0` will be the background name on the far left and `BG_3` on the far right).
    Then we call the component `Sprite Renderer` and specify the image to be rendered,
    and here is the `newSprite` that we previously extracted from the `selectionList`.
    Again we dealt with the object directly and not with the `Transform` component,
    because the goal here is to add a new component to it.


    The next two steps deal with `bg.transform` as you see, the first defines its
    location in space `bg.transform.position` and the second determines its parent
    being and here is `bgGameObject` that we have already talked about. For the site,
    the background is centered vertically as you see where `y = 0`, and horizontally,
    the location is the `posX` value that we previously calculated. It is important
    here to realize the fact that the background images must appear behind the rest
    of the images in the game space. In order to do that, we have to tell the rendering
    component to draw the background before painting any other image so that the background
    does not cover the elements of the scene. This we can do by reducing the value
    of the `sr.sortingOrder` variable where the default value is zero. Images with
    a lower value for `sortingOrder` are rendered first, followed by images with a
    higher or higher value.


    Next, we add the `Box Collider 2D` collision detection component so that we can
    detect the player touching or clicking the background with the mouse. The last
    step is to increase the `posX` by the width of the image so that the next image
    is located to the right of the current, adjacent to its right side. After building
    the background we send another message which is `BackgroundChanged` and attach
    the new background element number, which we will see later its importance.

