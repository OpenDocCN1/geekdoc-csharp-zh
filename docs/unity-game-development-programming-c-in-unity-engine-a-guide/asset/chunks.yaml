    ![](img/Image00027.jpg)


    ## 这样很好，现在我们使用条件语句 (IF)


    如你所知，C# 语言中的条件语句接收条件，并假设如果括号区域内的条件实现，则执行指定的事件或激活指定的属性。那么，现在和我一起思考，如何在括号内编写条件？我们的目标是，当
    `w`（例如）按钮被激活时（即用户按下了它），让物体向某个方向移动，此时的条件状态为真（true）。


    是的，我们必须写上 `"input"`，这意味着用户在游戏中的输入，并希望后者限制输入，仅从键盘获取。在此指令中，尝试在 `update` 函数（`update`）的空间内输入以下代码（代码不完整）：


    ```csharp

