  raw: 'What we''re going to do now is build a prefab template, which is an object
    to which we add some components, and then we can create several copies of it while
    running the game. The good thing about these templates is that they can be modified
    from one place, no matter how many objects they are created from, as any modification
    to the original template (such as adding or deleting a component) will be reflected
    in all objects that follow this template. The template we''re going to have is
    for the object that will display the background image, which will initially need
    one component - the Sprite Renderer for rendering 2D images on the screen. To
    create the template, we first add an empty object to the scene and then we add
    the mentioned component to it through the Add Component button, which gives you
    a list of all available components. For ease of access, you can search by writing
    the name of the component Sprite Renderer and then choosing it as follows:


    ![image06.thumb.png.ae50fbe6e8803893ca6cdd](OEBPS/Image00009.gif)


    After adding the component we are ready to convert this object to a template,
    by dragging it from the hierarchy into any folder in the project, in this case
    I''m going to create a new folder inside Assets and call it Prefabs because in
    this work we will need a large number of templates as we will see. Then change
    the template name to BGElement. After creating the template we no longer need
    the object in the scene so we can delete it using the Delete key. Be careful here
    that you delete the object from the hierarchy and do not delete the template from
    the project, they have the same name, but the difference is great between the
    two!


    To add a new applet to the project, first let''s create a folder for applets within
    Assets and call it Scripts. Then you can add a new applet in the #C language by
    clicking on the folder with the right mouse button and then choosing:


    Create> C # Script.


    Enter the name BackgroundManager and then press Enter and then open the file in
    the MonoDevelop or Visual Studio editor by double-clicking. Let''s see the applet
    we will write in the following narration and then discuss it together in detail.


    using UnityEngine;


    using System.Collections;


    public class BackgroundManager: MonoBehaviour {


        // Template used to build background elements


        public GameObject bgElementPrefab;


        // Matrix contains all available background images


        public Sprite [] selectionList;


        // The number of times the background image is repeated


        public int repeatCount = 4;


        // Background image currently displayed


        private int selectedIndex = -1;


        // "Background" is a reference to the named son object


        private Transform bgGameObject;


        // called once upon start up


        void Start () {


            // "Background" search the children for the object with the name


            bgGameObject = transform.FindChild ("Background");


            // Initially choose the first image as the background


            ChangeBackground (0);


        }


        // It is called once when each frame is rendered


        void Update () {


        }


        // It changes the background image currently displayed


        public void ChangeBackground (int newIndex) {


            if (newIndex == selectedIndex) {


                // No need to change the image


                return;


            }


            // Delete the current background images


            for (int i = 0; i <bgGameObject.childCount; i ++) {


                Transform bgSprite = bgGameObject.GetChild (i);


                Destroy (bgSprite.gameObject);


            }


            // Store the new background image from the array according to the given
    location


            Sprite newSprite = selectionList [newIndex];


            // What is the width of the background image in pixels?


            float width = newSprite.rect.width;


            // How high is the background image in pixels?


            float height = newSprite.rect.height;


            // How many pixels per unit?


            float ppu = newSprite.pixelsPerUnit;


            // Calculate length and width using units


            width = width / ppu;


            height = height / ppu;


            // Calculate the horizontal position of the first image on the far left


            float posX = -width * repeatCount * 0.5f;


            // Calculate the new scene boundaries


            Vector2 boundsSize = new Vector2 (width * repeatCount, height);


            Bounds newBounds = new Bounds (Vector2.zero, boundsSize);


            // Send a message telling the boundaries of the scene to change


            BroadcastMessage ("SceneBoundsChanged", newBounds);


            // We can now start building the new background


            for (int i = 0; i <repeatCount; i ++) {


                // Create a new object using the template


                GameObject bg = (GameObject) Instantiate (bgElementPrefab);


                // Specify the name of the object


                bg.name = "BG_" + i;


                // Fetch the image rendering component in the object


                SpriteRenderer sr = bg.GetComponent <SpriteRenderer> ();


                // Specify the image to render as the image selected from the array


                       sr.sprite = newSprite;


                // Adjust the horizontal position using the previously calculated
    value


                bg.transform.position = new Vector2 (posX, 0);


                       // Return the background image a step back in the drawing arrangement


                       sr.sortingOrder = -1;


                // Cap for the created background element "Background" Select the
    empty object


                bg.transform.parent = bgGameObject;


                // Add a square shaped collision component


                bg.AddComponent <BoxCollider2D> ();


                // Add the image width to the horizontal location value for calculating
    the new location for the next item


                posX + = width;


            }


            // Send a message informing you that the background image has changed
    and attach the location of the new photo


            BroadcastMessage ("BackgroundChanged", newIndex);


        }


    }


    Unity treats applets as components that can be added to any object in a scene
    or template in a project (templates at the end are objects). For us, this is an
    essential applet related to scene management as a whole, not to the player or
    opponent. Therefore, we will add it to the root object by simply dragging the
    BackgroundManager.cs file from the project browser to the SceneRoot object, either
    in the hierarchy or in its properties screen.


    After adding it, you will notice that the applet appeared in the root object properties
    screen and the general variables bgElementPrefab, selectionList, and repeatCount
    appeared so that the first appears as an empty box and the second appears as a
    list. You can specify the number of its elements from the size field, and the
    third in the form of a text box that accepts a numerical value.


    Now let''s see how we can define the values of these variables and it will start
    with bgElementPrefab. As expected, this field is intended to define the template
    that will later be used to create the background elements, which is the BGElement
    we have already created. To link the template to this variable, all you have to
    do is drag it from the project browser into the field you see in the properties
    screen. Then change the number of items in the selectionList to 8 and then drag
    each cell from one of the background images in the Backgrounds folder. The third
    variable, repeactCount, has a default value of 4 which is the value we used when
    defining it. The shape of the root object will now become:


    ![image07.thumb.png.5e5375bba0ca22e1f09f9c](OEBPS/Image00010.gif)


    If you try to run the game now, you will notice that the background image in the
    first item appears in the list, and you will notice that it repeated horizontally
    4 times correctly as you see below, and you also notice the four objects of these
    images that were added as children of the background object in the hierarchy.'
