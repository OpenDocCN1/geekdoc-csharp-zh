  trans: '


    通过将过滤器类型更改为 `Trilinear`并将颜色格式设置为 `Truecolor`，我们要求 Unity 不要压缩这些图像，以便它们保持原始尺寸并维持质量。虽然压缩对性能更有利，但你会注意到
    Unity 会提示你，这些图形中的大多数是不可压缩的，因为它们不符合长度和宽度等于 2 的幂对数数值的规则（例如 `64`、`128`、`512` 等）。完成后，别忘记点击
    `Apply` 以保存更改。


    ## 场景构建与背景处理


    在更改了导入的所有图形的属性后，我们就可以开始准备场景了。第一步是添加游戏展开的背景和地板。导入过程中的一个重要规范是 `Pixels Per Unit`（每单位像素）。这里的数字
    `100` 意味着原始图像中 `100` 像素宽的条纹在 Unity 空间中覆盖一个单位的距离。假设一个单位是米，那么 `10 x 10` 像素的盒子大小就等于游戏空间中
    `10 x 10` 厘米的盒子。幸运的是，我们导入的一组图像彼此之间非常合适，例如怪物图像是 `70 x 70` 像素，而背景大得多，达到了 `1024 x
    1024` 像素。


    让我们从一开始就认为这个系列课程不仅是为了学习游戏编程，不仅是为了学习 Unity 引擎，你也可以说它还会教你场景构建的最佳编程和组织实践，以通过该引擎获得最佳结果。为此，我们将以特殊方式准备游戏场景，使场景包含一个我们称为场景根对象
    `SceneRoot` 的对象，然后我们将以该对象的子级和孙子级的形式添加场景的所有元素。要添加新对象，只需选择菜单：


    `Game Object > Create Empty`


    新对象随后将作为 `GameObject` 出现在场景层级面板（Hierarchy）中，选择它并将其更名为 `SceneRoot`，并将位置设置为坐标原点
    `(0, 0)`。正如本章引言提到的，你可以从下方图像所示的 `Inspector Properties` 窗口更改这些值。注意，此对象正如其名称所示是“空”的，这意味着它只存在于内存中，即使它位于场景中间也无法在场景中看到，我们将根据需要来处理这些细节。


    然后我们将添加另一个空对象来代表场景背景，你只需要在层级面板的 `SceneRoot` 对象上点击右键，并选择 `Create Empty`，以便为根对象添加一个子对象（儿子），并将其命名为
    `Background`。最后，你必须将 `Main Camera` 对象拖入根对象中，使得场景层级结构如下。


    ![image03.thumb.png.f62d7a6648ae0ddd366ff5](img/Image00006.gif)


    现在是保存我们正在处理的场景了，就像 99% 的程序一样，你可以通过 `Control + S` 进行保存，这保存的是场景而不是整个项目，因为项目只是一组可以单独修改和保存的文件。在
    `Assets` 内部创建一个新文件夹并命名为 `Scenes`，然后将场景以 `GameScene` 的名称保存其中。


    从现在起约定，我们将为整个游戏构建一个场景，并将更改背景、地板和对象位置来制作不同的阶段。第一个对象是场景背景，有几张图像可以使用。如下图所示，这 `8`
    张图像位于第一组照片的 `Backgrounds` 文件夹中。这些背景图像的特点是每张图像的右侧完全对应其左侧，这使得我们能够在水平方向连续重复它们，而玩家不会察觉它们之间存在限制。


    ![image04.thumb.png.6d31b24b5ddfa8d97a71b](img/Image00007.gif)


    由于我们处理的是休闲场景的游戏，我们需要水平方向重复多次背景，重复 4 次。在开始向场景添加背景之前，为了方便操作，我们将所有背景图像的轴心（Pivot）设置为图像的左侧而不是中心，如下所示：


    ![image05.thumb.png.4ba765d2e5601aa1c69c57](img/Image00008.gif)


    但如果图像的焦点是它的左侧而不是中心，这意味着什么呢？下面的两张图片回答了这个问题。


    在两种情况下，图像的位置都没有改变，都是 `(0, 0)`，即场景的中心。在默认位置（左图），图像的锚点（Anchor）在它的中间，也就是说图像在空间中的位置是它的中心，图像的左右两侧延伸在
    `x = -5.12` 和 `x = + 5.12` 之间。在第二情况下，我们将锚点在水平方向上改为图像的最左侧，同时垂直方向保持在中间。这样，图像从 `x
    = 0` 点向右运行到 `x = + 10.24` 点。注意，这些点的数值符合一个单位等于 `100` 像素的事实，图像宽度为 `10.24`。


    通过此，我们可以计算围绕原点排列的四个图像位置，如下：


    - 最左侧的图像位于 `20.48-`，延伸到 `10.24-`。

    - 原点左侧的图像位于 `10.24-`，`0.0`。

    - 原点右侧图像位于 `0.0`，`10.24+`。

    - 最右侧的图像位于 `10.24+` `20.48+`。


    我们不是手动放置这些图像，而是编写一个脚本，通过提供图像并要求它重复多次来为我们创建背景。该脚本的工作原理如下：我们将以矩阵的形式赋予它所有的背景图像，以便每张图像都有自己的编号，此外我们还可以为它提供图像所需的重复次数。运行游戏时，我们选择想要显示在屏幕上的背景编号，该数字将从
    0 到 7。稍后我们将回到这个脚本主题。


    在进入细节之前，我想指出，Unity 引擎中的对象都是相似的，它们处于原始的空位置且不可见，而区分每个对象与其他对象并赋予其自身特征的是添加给它的对象的组件集。空对象中唯一的组件是
    `Transform`，它在所有引擎对象中无例外，因为它赋予了对象在二维（或三维）空间中的位置、旋转和大小，此外它还决定了对象与其他对象之间的关系，例如我们在场景层级中看到的父子关系。基于这一事实，当你选择任何对象时，在
    `Inspector properties` 屏幕中看到的是添加给该对象的组件集。


