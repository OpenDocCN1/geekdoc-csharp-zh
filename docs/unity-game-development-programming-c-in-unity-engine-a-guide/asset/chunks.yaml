  trans: "\n我们现在要做的是构建一个制体模板（prefab template），它是一个向其添加了一些组件的对象，然后我们就可以可以在游戏运行时创建它的多个副本了。这些模板的好处是，它们可以在一个地方进行修改，无论它们创建了多少个对象，对原始模板的任何修改（例如添加或删除组件）都会反映在所有遵循该模板的对象上。\n\
    \n我们将创建的模板是用于显示背景图片的对象，它最初需要一个组件——用于在屏幕上渲染 2D 图像的 `Sprite Renderer`。要创建模板，我们首先在场景中添加一个空对象，然后通过\
    \ `Add Component` 按钮向其添加上述组件，该按钮会列出所有可用的组件。为了方便访问，你可以通过输入组件名称 `Sprite Renderer`\
    \ 进行搜索，然后如下所示进行选择：\n\n![image06.thumb.png.ae50fbe6e8803893ca6cdd](img/Image00009.gif)\n\
    \n添加组件后，我们就可以准备将此对象转换为模板了，方法将其从层级面板（hierarchy）拖到项目中的任何文件夹中，在这种情况下，我将在 `Assets`\
    \ 内部创建一个新文件夹并命名为 `Prefabs`，因为正如我们将看到的，在工作中我们需要大量的模板。然后将模板名称更改为 `BGElement`。创建模板后，我们不再需要场景中的该对象，因此可以使用\
    \ `Delete` 键删除它。在这里要小心，要从层级面板中删除对象，而不是从项目中删除模板，它们名称相同，但两者之间的区别是巨大的！\n\n要向项目添加新脚本（applet），首先让我们在\
    \ `Assets` 内部创建一个用于脚本的文件夹并将其命名为 `Scripts`。然后你可以通过右键点击文件夹并选择以下操作来使用 `#C` 语言添加新脚本：\n\
    \n`Create > C # Script`。\n\n输入名称 `BackgroundManager`，然后按 `Enter` 键，最后双击用 `MonoDevelop`\
    \ 或 `Visual Studio` 编辑器打开文件。让我们看看后续叙述中将编写的脚本，然后一起详细讨论。\n\n```csharp\nusing UnityEngine;\n\
    \nusing System.Collections;\n\npublic class BackgroundManager: MonoBehaviour {\n\
    \n    // 用于构建背景元素的模板\n    public GameObject bgElementPrefab;\n\n    // 矩阵包含所有可用的背景图像\n\
    \    public Sprite [] selectionList;\n\n    // 背景图像重复的次数\n    public int repeatCount\
    \ = 4;\n\n    // 当前显示的背景图像\n    private int selectedIndex = -1;\n\n    // \"Background\"\
    \ 是指向命名子对象的引用\n    private Transform bgGameObject;\n\n    // 启动时调用一次\n    void\
    \ Start () {\n        // \"Background\" 在子对象中查找名称的对象\n        bgGameObject = transform.FindChild\
    \ (\"Background\");\n        // 初始选择第一张图像作为背景\n        ChangeBackground (0);\n\
    \    }\n\n    // 每帧渲染时调用一次\n    void Update () {\n    }\n\n    // 更改显示的背景图像\n\
    \    public void ChangeBackground (int newIndex) {\n        if (newIndex == selectedIndex)\
    \ {\n            // 不需要更改图像\n            return;\n        }\n        // 删除当前的背景图像\n\
    \        for (int i = 0; i < bgGameObject.childCount; i ++) {\n            Transform\
    \ bgSprite = bgGameObject.GetChild (i);\n            Destroy (bgSprite.gameObject);\n\
    \        }\n        // 根据位置从数组中存储新的背景图像\n        Sprite newSprite = selectionList\
    \ [newIndex];\n        // 背景图像在像素中的宽度是多少？\n        float width = newSprite.rect.width;\n\
    \        // 背景图像在像素中的高度是多少？\n        float height = newSprite.rect.height;\n \
    \       // 每个单位的像素数？\n        float ppu = newSprite.pixelsPerUnit;\n        //\
    \ 使用单位计算长度和宽度\n        width = width / ppu;\n        height = height / ppu;\n\
    \        // 计算第一张图像在最左侧的水平位置\n        float posX = -width * repeatCount * 0.5f;\n\
    \        // 计算新的场景边界\n        Vector2 boundsSize = new Vector2 (width * repeatCount,\
    \ height);\n        Bounds newBounds = new Bounds (Vector2.zero, boundsSize);\n\
    \        // 发送消息告知场景边界发生变化\n        BroadcastMessage (\"SceneBoundsChanged\",\
    \ newBounds);\n        // 我们现在开始构建新的背景\n        for (int i = 0; i < repeatCount;\
    \ i ++) {\n            // 使用模板创建新对象\n            GameObject bg = (GameObject)\
    \ Instantiate (bgElementPrefab);\n            // 指定对象的名称\n            bg.name\
    \ = \"BG_\" + i;\n            // 获取对象中的图像渲染组件\n            SpriteRenderer sr =\
    \ bg.GetComponent <SpriteRenderer ();\n            // 指定从数组中选择的图像作为渲染图像\n    \
    \        sr.sprite = newSprite;\n            // 使用之前计算的值调整水平位置\n            bg.transform.position\
    \ = new Vector2 (posX, 0);\n            // 将背景图像在绘制排序中后置一步\n            sr.sortingOrder\
    \ = -1;\n            // 创建的元素 \"Background\" 的父级，选择空对象\n            bg.transform.parent\
    \ = bgGameObject;\n            // 添加正方形碰撞体\n            bg.AddComponent <Collider2D>\
    \ ();\n            // 为下一个项目添加图像宽度\n            posX += width;\n        }\n  \
    \  }\n}\n```\n\nUnity 将脚本（applets）视为可以添加到场景或模板任何对象的组件（模板最终也是对象）。对于我们来说，这是一个与整个场景相关的脚本，而不是针对玩家或敌人。因此，我们将通过简单的将\
    \ `BackgroundManager.cs` 文件从项目拖到 `SceneRoot` 对象（在层级面板中或其属性面板中）来添加它。\n\n添加后，你会注意到脚本出现在根对象的属性面板中，通用变量\
    \ `bgElementPrefab`、`selectionList` 和 `repeatCount` 也出现了，其中第一个显示为空框，第二个显示为列表，第三个以接受数值的文本框形式显示。\n\
    \n现在让我们看看如何定义这些变量的值，首先是 `bgElementPrefab`。正如预期的，此字段旨在定义稍后用于创建背景元素的模板，即我们已经创建的\
    \ `BGElement`。要将模板链接到此变量，你只需将其从项目浏览器拖到你在属性面板中看到的字段中。然后将 `selectionList` 中的项目数量更改为\
    \ 8，然后将 `Backgrounds` 文件夹中的每个背景图像分别拖入一个单元格。第三个变量 `repeatCount` 的默认值为 4，这是我们在定义它时使用的值。根对象的形状现在将变为：\n\
    \n![image07.thumb.png.5e5375bba0ca22e1f09f9c](img/Image0010.gif)\n\n如果你现在尝试运行游戏，你会注意到第一项中的背景图像出现在列表中，你会注意到它在水平方向上正确重复了\
    \ 4 次，如下所示，你还会注意到作为背景对象的子对象添加到层级面板中的这四个图像对象。\n\n"
