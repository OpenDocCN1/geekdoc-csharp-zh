    \n现在我们可以编写路径绘制程序并将其添加到弹道模板中了。该程序的描述将在如下叙述中给出：\n\n```csharp\nusing UnityEngine;\n\
    \nusing System.Collections;\n\npublic class PathDrawer: MonoBehaviour {\n\n  \
    \  // 用于绘制点的模板\n    public GameObject pathPointPrefab;\n\n    // 两个连续点之间的距离\n\
    \    public float pointDistance = 0.75f;\n\n    // 路径点对象的父物体\n    Transform pathParent;\n\
    \n    // 用于存储上一个添加点的位置的变量\n    Vector2 lastPointPosition;\n\n    // 用于检查弹道是否发射的内部变量\n\
    \    bool launched = false;\n\n// 启动时调用一次\nvoid Start () {\n// 找到名为 Path 的路径点的父物体\n\
    \    pathParent = GameObject.Find (\"Path\"). transform;\n}\n\n// 每帧渲染时调用一次\n\
    void Update () {\n    if (launched)\n    {\n        float dist = Vector2.Distance\
    \ (transform.position, lastPointPosition);\n        if (dist> = pointDistance)\n\
    \        {\n            // 是时候添加一个新点了\n            AddPathPoint ();\n        }\n\
    \    }\n}\n\n    void ProjectileLaunched ()\n    {\n        // 弹道刚刚发射，所以删除之前的轨迹\n\
