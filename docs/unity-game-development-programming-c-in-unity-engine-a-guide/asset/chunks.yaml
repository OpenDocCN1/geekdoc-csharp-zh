  trans: "\n\n```cs\n// 获取弹药对象的刚体组件\nRigidbody2D myRB = GetComponent <Rigidbody2D>();\n\
    \n// 通过乘法增加速度，然后将对象的速度设置为新的输出值\nmyRB.velocity = myRB.velocity * speedFactor;\n\
    \n}\n\n}\n```\n\n我们提到的第二种特殊攻击是裂变式攻击（fissile attack），它会导致弹药分解成更小的弹药（碎片），这些碎片随后会散布到相对较大的区域。在为这种攻击编写程序代码之前，我们需要注意，它的实现将需要创建新对象，即由攻击的实现逻辑所散射出去的碎片。这意味着我们需要为这些碎片构建模具，具体来说有两个模具：一个用于大象挤压的碎片，另一个用于长颈鹿挤压的碎片。我将这两个模板分别命名为\
    \ `ElephantCluster` 和 `GiraffeCluster`，它们除了所示图像不同外，在其他方面都完全相同。这两个模具非常简单，每个模具都带有原始弹药图像，并将对象在\
    \ x 和 y 轴上缩小到 0.75，使碎片比原始弹药更小。此外，我们还将添加一个 `Rigid Body 2D` 刚体组件和一个 `Circle Collider\
    \ 2D` 碰撞组件，使碎片模具准备就。\n\n实现这种攻击的字程序被称为 `ClusterAttack`，其逻辑描述如下：\n\n```cs\nusing\
    \ UnityEngine;\n\nusing System.Collections;\n\npublic class ClusterAttack: MonoBehaviour\
    \ {\n\n    // 用于创建碎片的模板\n    public GameObject clusterPrefab;\n\n    // 每个碎片在被销毁并从场景中移除之前的存秒数\n\
    \    public float clusterLife = 4.0f;\n\n    // 从此弹药中产生多少个碎片\n    public int clusterCount\
    \ = 3;\n\n    // 在启动时调用一次\n    void Start () {\n\n    }\n\n    // 在每帧渲染时调用一次\n\
    \    void Update () {\n\n    }\n\n    // 相应实现 DoSpecialAttack 裂变攻击以接收消息\n    public\
    \ void DoSpecialAttack ()\n    {\n        // 获取原始弹药的当前速度\n        Rigidbody2D\
    \ myRB = GetComponent <Rigidbody2D>();\n        float originalVelocity = myRB.velocity.magnitude;\n\
    \        // 在此数组中存储所有碎片的碰撞组件\n        Collider2D [] colliders = new Collider2D\
    \ [clusterCount];\n        Collider2D myCollider = GetComponent <Collider2D>();\n\
    \        for (int i = 0; i <clusterCount; i ++)\n        {\n            // 创建新碎片\n\
    \            GameObject cluster = (GameObject) Instantiate (clusterPrefab);\n\
    \            // 设置碎片对象的位置、名称和父物体\n            cluster.transform.parent = transform.parent;\n\
    \            cluster.name = name + \"_cluster_\" + i;\n            cluster.transform.position\
    \ = transform.position;\n            // 在数组中存储当前位置的碎片碰撞组件\n            colliders\
    \ [i] = cluster.GetComponent <Collider2D>();\n            // 忽略此碎片与之前创建的碎片之间可能碰撞\n\
    \            // 同时忽略碎片与原始对象之间可能发生的碰撞\n            Physics2D.IgnoreCollision (colliders\
    \ [i], myCollider);\n            for (int a = 0; a <i; a ++)\n            {\n\
    \                Physics2D.IgnoreCollision (colliders [i], colliders [a]);\n \
    \           }\n            Vector2 clusterVelocity;\n            // 随着每个新碎片的产生，我们减少水平速度并增加垂直速度以确保碎片化\n\
    \            clusterVelocity.x = (originalVelocity / clusterCount) * (clusterCount\
    \ - i);\n            clusterVelocity.y = (originalVelocity / clusterCount) * -i;\n\
    \            // 为新碎片添加刚体\n            Rigidbody2D clusterRB = cluster.GetComponent\
    \ <Rigidbody2D>();\n            clusterRB.velocity = clusterVelocity;\n      \
    \      // 选择碎片块的质量等于原始对象的质量\n            clusterRB.mass = myRB.mass;\n       \
    \     // 在碎片寿命结束后后销毁碎片\n            Destroy (cluster, clusterLife);\n        }\n\
    \        // 最后销毁原始弹药\n        Destroy (gameObject);\n    }\n}\n```\n\n执行这种攻击的思路是接收\
    \ `DoSpecialAttack` 消息，然后使用指定的模板创建指定数量的碎片。为了防止碎片之间、碎片与某些碎片之间以及碎片与原始弹药之间的碰撞（在弹药从场景中删除的瞬间之前可能发生碰撞），我们使用了\
    \ `Physics2D.IgnoreCollision () 函数，并为其提供了我们想要忽略的两个碰撞组件。注意，我们维护了一个碰撞组件矩阵来存储所有碎片的组件，在创建新碎片时，我们将之前碎片的组件传递过去，并在新旧组件之间调用上述函数以消除碰撞。下一步是碎片运动的速度，我们获取原始弹药的速度分量，并每次乘以一个不同的值，以获得新速度的水平和垂直分量。这两个分量随碎片的变化而变化，第一个碎片从高水平速度和低垂直速度开始，然后随着垂直值向下增加和水平值减小，这些值开始变化，导致弹药的散布方式类似于下图所示（我在图中增加了碎片数量以阐明这一观点）：\n\
    \n![](img/Image0037.gif)\n\n注意，碎片从原始弹药的裂变点散开。然后，我们调整每个碎片的质量使其等于原始弹药的质量。虽然将质量除以碎片数量以便均匀分布在逻辑上是合理的，但所有碎片都复制原始质量将赋予它们更大的破坏力。\n\
    \n"
