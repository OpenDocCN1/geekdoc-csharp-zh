    these bundled assets now, or aren’t sure, just ignore this option; you can add
    these assets and many others later via the Unity editor.OR:If you do want to import
    these  bundled  assets  now,  select Asset  packages...to  display  the  list 
    of  assets  available, check the ones you want, and then click onDone.


    6.Now select Create project and you’re all set!


    Step Three: Get to know the main program windows


    At first we got 4 major windows in Unity. Here is a summary of its functions:


    Scene Window: It you use to build the game scene, add different objects to it
    and distribute it in 2D space. Initially this window contains only one object
    which is the camera.


    Hierarchy: contains a tree arrangement that contains all the objects that have
    been added to the scene and helps you in organizing the relationships between
    them, as it is possible to add objects as children to other beings so that the
    son being is affected by the parent being as we will see. Initially this window
    contains only one object which is the camera.


    Project Browser: Displays all files inside the project folder, whether they were
    added to the scene or not added. The project initially contains one folder called
    Assets, and inside it we will add all other files and folders.


        Inspector Properties Window: When selecting any object from the scene hierarchy,
    scene window, or project browser, its properties will appear in this window and
    you can change it from there.


    In this introduction, we have reviewed what appears from the Unity3D interface
    at first glance, with a simple introduction to the game industry, we will embark
    on the next lessons in a practical project through which we learn how to create
    a real complete game!


    # Chapter one


    # Setting the scene and camera in Unity3D


    In the previous lesson, we learned about Unity Engine and how to download it and
    create a new project on it, we will start in this lesson in a practical project
    to learn how to make a full real game. In the first lesson, we will talk about
    setting up the game scene and controlling the camera.


    In this example, I will be using a set of free graphics offered under the Creative
    Commons CC0 license, available at http://kenney.nl. The first set is graphics
    for physical games like Angry Birds, which is the game we are trying to emulate
    its mechanics across this series. As for the second group, they are simple animal
    drawings that we will use in place of the birds in the original game, as they
    represent projectiles. However, we will add some other graphics and sound files
    as needed. In this series, I will adopt placing each source (image file or sound
    file) in a folder with the name of the site from which the source was retrieved,
    so that you can come back to these sites and download files.


    After downloading and decompressing these graphics, copy them into the Assets
    folder of your project. You can copy them via the operating system or drag them
    directly into the folder in Unity Browser. Once you add these files to the project,
    Unity will recognize them as sprites, which are the most common types of graphics
    in 2D games. In order to get the highest possible quality we will modify some
    graphics properties, I''ll set an example here on one folder and then we have
    to repeat the process for all graphics folders.


    Note: Graphics groups contain two different storage methods: the first is to store
    each image separately in a separate file, and the second is to collect the images
    in one file called a sprite sheet. In these lessons, we will discuss the first
    method, which is separate shapes, for easy work on them. Note that the second
    method is more efficient in terms of performance and easier in the case of motion
    graphics.


    As you can see in the following figure, I have chosen all the elements of the
    Monster Graphics folder, which will represent the opponents in this game.


    ![image00.thumb.png.2a02c20d0b98d000a86cf7](OEBPS/Image00004.jpg)


    After that, I modified the properties of importing these graphics as follows:


    ![image01.thumb.png.0bdcebeb5e71111f7acd5a](OEBPS/Image00005.gif)'
