    在脑海中有了这些概念后，我们可以继续查看句子结构的细节，以及用于处理变量和函数的规则与语法。现在变得非常简单了，只需思考如何使用键盘按钮在引擎空间内沿轴移动物体即可。我们将使用哪些子句？当然，在这项操作中，你应该配合
    `Position` 使用 `if` 命令。


    在编写代码之前，你应该知道我们可以添加 `Rigidbody` 属性，这意味着物体的运动，它与重力是紧密结合的。添加此功能的每个物体都具有真实的扭矩和运动。根据专家的意见，通常为了通过编辑器程序化地获取此属性，在二维游戏中必须编写一个
    `Rigidbody2D` 变量类型，而在三维游戏中只写 3D，并调整此属性以进行处理。当你需要通过键盘移动物体时，还必须在 `Update`（此处原文为
    wild）函数或 `"start"` 函数中调用该属性，我们将写下：


    - 初始的重力变量

    - 等号 `=`（设置）

    - `GetComponent` 指令，意为“获取组件”，你可以使用此指令访问嵌入的组件或脚本。

    - 两个最大和最小标记之间的指令值 `<2>`，其值应该是 `Rigidbody2D`

    - 指令的结束符号为 `()`


