    # Chapter IV


    # Touch screen input in Unity3D and export for phones


    Receiver touch screen input:


    Receiving input from touch screen is different from receiving mouse or keyboard
    input. You are dealing with a screen that receives several touches, dealing with
    events such as finger positioning, moving and lifting, or placing two fingers
    and rounding them apart. All these types of input will have to be recognized and
    executed by the appropriate commands.


    Let''s start first with the input of UI elements such as buttons. What should
    we do to receive input on these elements? nothing! This command does the Unity
    engine automatically. That is, when you touch a button on the screen the application
    will recognize this command as if you pressed the button and execute the command
    or commands associated with it.


    Let us now turn to the input for the game. Remember that we have written 3 applets
    to receive mouse input, and we will now need to type 3 against it to receive touch
    screen input. These three programs are:


    CameraMouseInput, which we added to the background and floor elements templates
    in order to move the camera and control the zoom and zoom.


    LauncherMouseInput which we added to the slingshot template so that it receives
    the player''s input on the projectiles and determines the direction and intensity
    of the aiming and releases the projectile when it drops.


    SpecialAttackMouseInput which we added to the projectile templates in order to
    perform your attack when you click the mouse button after launch.


    The subject is very simply that for each input applet from the mouse we will write
    an input applet from the touch screen and add it to the same template. The common
    denominator of touch input receivers is that they will check the game''s operating
    environment.If you find that the operating system is Android, it will destroy
    the mouse input receiver applets with it on the same object. The importance of
    this step is that Unity tries to simulate the presence of a mouse on touch screens
    by turning touches into mouse inputs. This leads to undesirable behavior that
    is not useful in our game, so we avoid it by deleting any applet read from the
    mouse.


