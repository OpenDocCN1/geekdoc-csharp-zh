    \ `launcherPos` 之间。插值的值相对较低，即它更接近目标，该值是自上一帧渲染以来所经过的时间乘以 5。在这里使用时间值的重要性在于，并不是所有帧都是以相同的速度渲染的。帧不是固定的，可能会增加或减少。因此，为了保持恒定的移动速度，我们必须乘以时间（时间会随着每秒帧数的减少而增加，反之亦然），使得玩家看到的移动速度无论帧率高低都保持恒定。\n\
    \n三个函数 `HoldProjectile()`、`DragProjectile()` 和 `ReleaseProjectile()` 分别调用当前弹体\
    \ `currentTarget` 的 `Hold()`、`Drag()` 和 `Launch()` 函数。这里需要解释的函数是 `DragProjectile()`，因为它包含一个\
    \ `Projectile` 中没有的额外步骤，即验证在向后拉时，弹体距离初始发射点的距离没有超过橡皮弹弓允许的伸展长度。这个伸展长度由变量 `maxStretch`\
