    is inside, and the results are mostly unpredictable or unimaginable. , The game
    is like a concert, but what kind of party? Will the guests really enjoy this concert
    or will they try to escape from the party? Will they watch and exchange conversations
    among themselves and wish that this night will not end?


    Inviting your friends to experience your game, knowing the reactions and moments
    of silence and matching them on the ground is really the best way to understand
    how your game is going and to become a professional designer. Once you are ready
    to hear from others and learn from their criticism, this will help your game to
    grow quickly and positively. The process of designing games is very similar to
    the life cycle, it is in the development stage, there are no rules and absolute
    techniques, and as a designer, the option is open to the inventor to create your
    own ways. This does not mean that you take all the tips of your friends seriously,
    they have different tastes, and you should often take into account your rules
