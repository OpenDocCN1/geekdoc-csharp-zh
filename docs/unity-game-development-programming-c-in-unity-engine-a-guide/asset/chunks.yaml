    \        ChangeBackground (0);\n    }\n\n    // It is called once each frame is\
    \ rendered\n    void Update () {\n    }\n\n    // It changes the background image\
    \ displayed\n    public void ChangeBackground (int newIndex) {\n        if (newIndex\
    \ == selectedIndex) {\n            // No need to change the image\n          \
    \  return;\n        }\n        // Delete the current background images\n     \
    \   for (int i = 0; i < bgGameObject.childCount; i ++) {\n            Transform\
    \ bgSprite = bgGameObject.GetChild (i);\n            Destroy (bgSprite.gameObject);\n\
    \        }\n        // Store the new background image from the array according\
    \ to the location\n        Sprite newSprite = selectionList [newIndex];\n    \
    \    // What is the width of the background image in pixels?\n        float width\
    \ = newSprite.rect.width;\n        // How high is the background image in pixels?\n\
    \        float height = newSprite.rect.height;\n        // How many pixels per\
    \ unit?\n        float ppu = newSprite.pixelsPerUnit;\n        // Calculate length\
    \ and width using units\n        width = width / ppu;\n        height = height\
    \ / ppu;\n        // Calculate the horizontal position of the first image on the\
    \ far left\n        float posX = -width * repeatCount * 0.5f;\n        // Calculate\
    \ the new scene boundaries\n        Vector2 boundsSize = new Vector2 (width *\
    \ repeatCount, height);\n        Bounds newBounds = new Bounds (Vector2.zero,\
    \ boundsSize);\n        // Send a message telling the boundaries of the scene\
    \ to change\n        BroadcastMessage (\"SceneBoundsChanged\", newBounds);\n \
    \       // We can now start building the new background\n        for (int i =\
    \ 0; i < repeatCount; i ++) {\n            // Create a new object using the template\n\
    \            GameObject bg = (GameObject) Instantiate (bgElementPrefab);\n   \
