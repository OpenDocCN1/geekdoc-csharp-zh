    \  void BackgroundChanged (int newIndex) {\n        ChangeGround(newIndex);\n\
    \    }\n\n    // It receives a message that changes the boundaries of the scene\n\
    \    void SceneBounds (Bounds newBounds) {\n        sceneBounds = newBounds;\n\
