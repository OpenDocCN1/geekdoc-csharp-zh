  trans: "\n\n![](img/cover1.jpeg)\n\nUnity 游戏开发\n\nUnity 引擎 C# 编程：初学者指南\n\n第二版\n\n\
    作者：\n\nKathleen Peterson\n\n2021 年\n\n“编程不在于你知道什么，而在于你能解决什么问题。” —— 克里斯·派恩 (Chris\
    \ Pine)\n\n## 这本书是给谁看的？\n\n如果你对编程、编写代码、编写脚本一无所知，或者不知道该从何处开始，那么这本书非常适合你。如果你想制作游戏并需要学习如何编写\
    \ C#` 脚本或代码，那么这本书对你来说是理想的。\n\n## 目录\n\n- 引言 8\n- 2D 或 3D 项目 8\n- 全 3D 9\n- 正交投影\
    \ 3D 10\n- 全 2D 11\n- 具有 3D 效果的 2D 游戏 11\n- 我们为什么要使用游戏引擎？ 14\n- 快速上手 Unity 引擎步骤\
    \ 15\n- 第一章 20\n    - 在 Unity3D 中设置场景和摄像 20\n    - 场景构建与背景处理 24\n    - 构建摄像机控制系统\
    \ 49\n    - 构建场景景观 72\n- 第二章 81\n    - 编程中的运动 81\n- 第三章 97\n    - 创建并发射投射物 98\n\
    \    - 投射物的特殊攻击 114\n    - 弹出行业 122\n- 第四章 144\n    - Unity3D 中的触摸屏输入并导出到手机 145\n\
    \    - 设计类游戏的技巧 163\n    - 游戏设计师身处玩家位置 164\n    - 游戏测试员 165\n    - 技能 166\n  \
    \  - 与不同的人沟通的能力 167\n    - 在团队中工作的技能 168\n    - 必要时能够处理事务的能力 169\n    - 能够绕行处理\
    \ 170\n    - 具备创造能力 171\n\n## 引言\n\nUnity 是一个跨平台开发平台，最初为开发游戏而创建，现在被用于许多领域，如：建筑、艺术、儿童应用、信息管理、教育、娱乐、营销、医疗、军事、物理装置、模拟、培训等等。Unity\
    \ 承担了开发游戏及类似交互体验的许多复杂性，并在后台处理这些问题，以便人们能够专注于游戏的设计和开发。这些复杂性包括图形渲染、世界物理和编译。更高级的用户可以根据需要对其进行交互和调整，但对于初学者来说，不需要担心这些。Unity\
    \ 游戏分为两部分：第一部分在 Unity 编辑器内，第二部分使用代码，特别是 C#。Unity 整合了 `MonoDevelopor Visual Studio\
    \ 2015 Community` 用于编写 C#。\n\n## 2D 或 3D 项目\n\nUnity 同样适用于创建 2D 和 3D 游戏。但区别在哪里？当你在\
    \ Unity 中创建一个新项目时，你可以选择以 2D 或 3D 模式开始。你可能已经知道想构建什么，但有几细细微可能会影响你选择的模式。选择以 2D 或\
    \ 3D 模式开始决定了 Unity 编辑器的某些设置——例如图像是被导入为纹理（textures）还是精灵（sprites）。不过不用担心选错，无论你在创建项目时设置了何种模式，都可以随时在\
    \ 2D 或 3D 模式之间切换。这里是一些可以帮助你选择的指南。\n\n## 全 3D\n\n![](img/Image0000.jpg)\n\n3D 游戏通常使用三维几何结构，材质和纹理渲染在这些对象的表面，使其看起来像构成你游戏的实心环境、角色和物体。摄像机可以在场景中周围自由移动，光影以真实的方式投射在世界中。3D\
    \ 游戏通常使用透视渲染场景，因此物体在靠近摄像机时在屏幕上显示得更大。对于所有符合此描述的游戏，请从 3D 模式开始。\n\n## 正交投影 3D\n\n\
    ![](img/Image0001.jpg)\n\n有时游戏使用 3D 几何结构，但使用正交摄像机（orthographic camera）而不是透视摄像机。这是提供俯视视角的游戏中的常用技术，有时被称为“2.5D”。如果你正在制作这样的游戏，你也应该使用\
    \ 3D 模式的编辑器，因为即使没有透视，你仍然在处理 3D 模型和资产。你需要将你的摄像机和场景切换为正交投影（Orthographic）。\n\n##\
    \ 全 2D\n\n![](img/Image0002.jpg)\n\n许多 2D 游戏使用平面图形，有时称为精灵（sprites），它们完全没有三维几何结构。它们作为平面图像画在屏幕上，游戏的摄像机没有透视。对于这类游戏，你应该以\
    \ 2D 模式启动编辑器。\n\n## 具有 3D 效果的 2D 游戏\n\n![](img/Image0003.jpg)\n\n有些游戏的环境和角色使用\
    \ 3D 几何结构，但玩法限制在两个维度内。例如，摄像机可能显示“侧屏视图”，玩家只能在两个维度内移动，但游戏仍然使用 3D 模型作为障碍物，并使用 3D\
    \ 透视。对于这些游戏，3D 效果可能出于风格而非功能目的。这类游戏有时也被称为“2.5D”。虽然玩法是 2D 的，但你主要是在操作 3D 模型来构建游戏，因此你应该从\
    \ 3D 模式开始。\n\n也许游戏行业是这个时代最困难的行业之一，这在许多方面从技术挑战开始，通过难以满足的受众，如果他们的产品没有达到要求的水平，即使对于大公司也是如此，导致竞争激烈、高失败率以及实现利润的困难。另一方面，这个行业也有特征使得生存成为可能。在技术方面，例如，大多数游戏并非没有的功能和重复的数据处理模式，这使得复用以前游戏的软件模块来创建新游戏成为可能。反过来这有助于克服技术障碍并缩短时间和精力。\n\
    \n当你谈论制作游戏时，你指的是一个在许多领域需要完成几十甚至数百项任务的大型过程。制作游戏意味着生产、营销和发行，以及这些操作涉及的所有行政、技术、财务和法律程序和步骤。然而，我们在这一系列课程中重要的是技术方面即游戏开发，它是构建包含所有组件的最终产品的过程。这个过程并不一定包含游戏设计，因为设计过程具有更广泛的视角，关注诸如故事、游戏的整体特征、关卡的形状和对手的性质，以及游戏规则、目标和胜负条件。\n\
    \n"
