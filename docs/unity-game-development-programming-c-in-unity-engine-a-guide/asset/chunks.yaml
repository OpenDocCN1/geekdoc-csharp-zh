    ![image08.thumb.png.8f596aea52fa0c4660567c](img/Image0001.jpg)


    我们现在将快速讨论 BackgroundManager 插件程序最重要的背景机制。Unity 中的所有程序格式几乎相同，从定义必要的变量开始，然后最常用的两个函数是
    `Start()` 和 `Update()`。正如代码中的注释所示，如果对象已在场景中，则 `Start()` 函数在启动时仅调用一次；如果它之前不在场景中，则在被添加到场景时调用一次。然后，游戏进入了我们所谓的“更新循环”或“帧渲染循环”，在游戏运行期间，每帧渲染时，`Update()`
    函数都会被调用。在这种情况下，我们不需要使用 `Update`。


    注意，我们通过定义许多变量来启动插件，其中一些是公共的（public），另一些是私有的（private）。对于 Unity 来说，通用变量非常重要，因为它们会在属性面板中显示单元，允许你像之前看到的那样在不修改代码的情况下更改它们。以下是对这些变量的解释：


    - `bgElementPrefab` 用作引用，访问我们将用于在构建背景元素时使用的模板。

    - `selectionList` 是一个包含 `Sprite` 对象的数组，存储了所有可用背景的列表。

    - `repeatCount` 一个整数，代表背景在水平方向重复的次数。自然地，增加这个数字会增加最终背景的宽度。

    - `selectedIndex` 代表列表中当前显示的背景位置，值 0 表示第一项。

    - `bgGameObject` 我们将使用此变量来访问背景对象，该对象被设置为场景中所有背景图像的父级。值得注意的是，在大多数情况下我们使用 `Transform`
    变量来访问对象，我们将了解到其中的许多益处。


    在启动时，会调用 `Start()` 函数，它首先在子级中寻找名为 `Background` 的对象并将其存储在 `bgGameObject` 变量中。该函数执行的第二个步骤是通过调用带有值
    0 的 `ChangeBackground()`，自动选择列表中的第一项作为场景的背景。


    `ChangeBackground()` 函数是该程序最重要的函数，因为它会根据调用 `newIndex` 时给定的值来更改背景。如果此值最初等于当前显示的
    `selectedIndex` 值，则不需要更改任何内容，从而执行该函数。除此之外，该函数对当前显示的背景的存在采取预防措施，并首先将其删除。删除是通过传递所有
    `bgGameObject` 子对象并调用 `Destroy()` 函数将它们从场景中删除。对象删除状态是通过 `Transform` 组件处理对象的规则的一个例外，在该规则中，删除必须在整个对象级别进行，而不是在特定组件上进行，因此我们在删除时调用了
    `bgSprite.gameObject`。


    在删除之前的背景（如果有）后，我们需要添加新背景。因此，下一步是将图像的值存储在 `newSprite` 变量的 `newIndex` 元素中，然后通过将其在像素中的宽度除以每个单位的像素数，来计算原始图像在
    Unity 空间中的宽度。由于背景图像的频率将围绕原点旋转，最左侧的点将是我们将重复的所有图像宽度的一半，因此，我们通过将图像总数 `repeatCount`
    的一半乘以单个图像的宽度 `width` 来计算 `posX` 值，并将结果转换为负值，以便从左侧开始（记住，我们选择了图像左侧的点作为其在空间中的支点）。


    除了起点之外，我们构建构建新背景后还计算了场景的长度和总宽度，然后将这些值存储在 `Bounds` 类型的变量中，该变量仅存储空间中的一个点以及该点在 x
    和 y 轴上的扩展。注意，我们将 `span` 变量定义为二维向量，并将 `x` 值定义为背景图像乘以一个图像宽度的次数，并将 `y` 值定义为一个的高度。之后，我们向所有其他程序（无论是在根对象还是子级中的任何对象）发送消息，告知它们场景边界已更改，我们使用了该函数（`BroadcastMessage`）。调用此函数时，我们提供消息的名称
    `SceneBoundsChanged`，并且还附带了包含新场景边界的 `newBounds` 变量。我们稍后将看到发送消息意味着什么、如何接收它以及为什么重要。在这一系列课程中，我们将大量处理消息，所以尽早了解如何发送它们是可以的。在
    Unity 中使用以下函数之一发送消息：


    - `BroadcastMessage`：向当前对象上的所有程序以及其所有子级和后裔的后代发送消息。

    - `SendMessage`：仅向消息发送给当前对象上的所有程序。

    - `SendMessageUpwards`：向消息发送给当前对象的所有插件及其在层次结构中的所有父级和祖父。


    遵循这些步骤的迭代循环是空间中的背景图像被正确构造和分布的循环。我们首先使用 `bgElementPrefab` 模板创建一个新对象 `bg`，然后根据它在背景集中从左到右的位置给它赋予一个顺序名称（例如，`BG_0`
    将是最左侧的背景名称，`BG_3` 将是在最右侧）。然后我们调用组件 `Sprite Renderer` 并指定要渲染的图像，这里就是我们之前从 `selectionList`
    中提取的 `newSprite`。同样，我们直接处理对象而不是 `Transform` 组件，因为这里的目标是给它添加新组件。


    接下来的两个步骤涉及 `bg.transform`，如你所见，第一个定义了它在空间中的位置 `bg.transform.position`，第二个决定了它的父级关系，这里就是我们已经讨论过的
    `bgGameObject`。对于位置，背景在垂直方向上居中，如你所示 `y = 0`，在水平方向上，位置是我们之前计算的 `posX` 值。这里的一点事实是背景图像必须出现在游戏空间中其他图像之后。为了做到这一点，我们必须告诉渲染组件在绘制任何其他图像之前绘制背景，这样背景就不会遮挡场景的元素。我们可以通过减少
    `sr.sortingOrder` 变量的值来实现，其默认值为零。`sortingOrder` 值较低的图像先渲染，然后是 `sortingOrder` 值较高或更高的图像。


    接下来，我们添加 `Box Collider 2D` 碰撞检测组件，以便我们可以检测玩家用鼠标触摸或点击背景。最后一步是根据图像宽度增加 `posX`，以便下一张图像位于当前图像的右侧，紧邻其右侧。在构建背景后，我们发送另一条消息
    `BackgroundChanged`，并附带新的背景元素编号，我们稍后将看到它的重要性。


