- fmt: "\nIf you run the game, you will notice that the camera is looking directly\
    \ into the center of the scene, and what we will do now is to add a mechanism\
    \ to move it left and right, in addition to the possibility of rounding and distance.\
    \ Before we start with the camera control details, we have to determine what the\
    \ aspect ratio is. This value is important because it directly affects the size\
    \ of the rectangle that defines the field of view of the camera. Since this game\
    \ is designed for phones and plays incidentally, the ratio that we will adopt\
    \ is 16:9. To choose it, go from the `Scene` screen to the `Game` screen and choose\
    \ this percentage from the top left of the screen as you see here:\n\n![image09.thumb.png.3acf4fca436c1a4b447737](OEBPS/Image00012.gif)\n\
    \nBefore starting writing the camera control code, we need to know the nature\
    \ of this control and what the player can do with it. The control method will\
    \ be two-dimensional, meaning that the player will be able to move the camera\
    \ left and right, up and down. In addition, the player must be able to round and\
    \ move the camera, all within certain limits. We will look at the camera control\
    \ app shortly, and then we will explain some of its details. Finally, we will\
    \ see how we can link the functions of this camera with the player's input.\n\n\
    But before that, let's learn one of the important principles in programming games,\
    \ especially with the `Unity` engine, which is separation of concerns. This means\
    \ that a single code is responsible for one task, and it is the only one authorized\
    \ to control the details of this task. Thus, we will first write the code to control\
    \ the camera, but it is completely separate from the player's input. These entries\
    \ will be written in another code of their own, which will receive them and accordingly\
    \ \"asks\" the camera control code to move them. This request may or may not be\
    \ answered according to data that the camera can control. For example, if the\
    \ player moves the camera to the far right of the scene and then tries to move\
    \ it right beyond the scene, then the camera code will reject this request and\
    \ the camera will remain in place.\n\nLet's start now with the `CameraController`\
    \ code that you see in the following narration, this code must be added to the\
    \ camera object in order to control it:\n\n```csharp\nusing UnityEngine;\n\nusing\
    \ System.Collections;\n\npublic class CameraControl : MonoBehaviour {\n\n    //\
    \ Minimum size of the camera in the event of rounding\n    public float minSize\
    \ = 2.5f;\n\n    // The height of the specified rectangle for the field of view\n\
    \    private float camHeight;\n\n    // Display the specified rectangle for the\
    \ field of view\n    private float camWidth;\n\n    // A reference to the camera\
    \ component\n    Camera cam;\n\n    // variable to store the boundaries of the\
    \ current scene\n    private Bounds sceneBounds;\n\n    // It is executed once\
    \ at start up\n    void Start () {\n        // Fetch the camera component on the\
    \ same object\n        cam = GetComponent <Camera> ();\n\n        // Update the\
    \ camera dimensions\n        UpdateCamDimensions ();\n    }\n\n    // It is called\
    \ once when each frame is rendered\n    void Update () {\n    }\n\n    // Receive\
    \ a message informing you that the outline of the scene has changed\n    void\
    \ SceneBoundsChanged (Bounds newBounds) {\n        sceneBounds = newBounds;\n\
    \    }\n\n    // This function moves the camera by a specified amount\n    public\
    \ void Move (Vector2 distance) {\n        // Calculate the permissible traffic\
    \ limits\n        float maxX = GetRightLimit ();\n        float minX = GetLeftLimit\
    \ ();\n        float maxY = GetUpperLimit ();\n        float minY = GetLowerLimit\
    \ ();\n\n        // In this particular case we are interested in the 3D site\n\
    \        // z = -10 in order to ensure that the camera is on site\n        //Always\n\
    \        Vector3 dist3D = distance;\n        // Calculate the new site\n     \
    \   Vector3 newPos = transform.position + dist3D;\n\n        // Stick to the movement’s\
    \ boundaries\n        newPos.x = Mathf.Clamp (newPos.x, minX, maxX);\n       \
    \ newPos.y = Mathf.Clamp (newPos.y, minY, maxY);\n        newPos.z = -10.0f;\n\
    \n        // Change the location\n        transform.position = newPos;\n    }\n\
    \n    // This function changes the camera's proximity\n    // Positive value means\
    \ bringing the camera closer to the scene\n    // Negative value means keeping\
    \ the camera away from the scene\n    public void Zoom (float amount) {\n    \
    \     float newSize = cam.orthographicSize - amount;\n        // Stick to the\
    \ limits of rounding\n        float maxSize = GetMaxSize ();\n        newSize\
    \ = Mathf.Clamp (newSize, minSize, maxSize);\n\n        // Change the size of\
    \ the field view and thus the approximation\n        cam.orthographicSize = newSize;\n\
    \n        // Move the camera zero to ensure compliance with the scene limits\n\
    \        UpdateCamDimensions ();\n        Move (Vector2.zero);\n    }\n\n    //\
    \ Updates the width and height of the camera\n    void UpdateCamDimensions ()\
    \ {\n        camHeight = cam.orthographicSize * 2;\n        camWidth = camHeight\
    \ * cam.aspect;\n    }\n\n    // The higher height of the camera is calculated\n\
    \    float GetUpperLimit () {\n        return sceneBounds.max.y - camHeight *\
    \ 0.5f;\n    }\n\n    // The minimum height of the camera is calculated\n    float\
    \ GetLowerLimit () {\n        return sceneBounds.min.y + camHeight * 0.5f;\n \
    \   }\n\n    // Calculates the maximum position of the camera to the right\n \
    \   float GetRightLimit () {\n        return sceneBounds.max.x - camWidth * 0.5f;\n\
    \    }\n\n    // Calculates the maximum left of the camera\n    float GetLeftLimit\
    \ () {\n        return sceneBounds.min.x + camWidth * 0.5f;\n    }\n\n    // It\
    \ calculates the largest size allowed by the camera at the time of deportation\n\
    \    // Depending on the scene’s boundaries\n    float GetMaxSize () {\n     \
    \   float maxHeight = sceneBounds.max.y - sceneBounds.min.y;\n        return maxHeight\
    \ * 0.5f;\n    }\n}\n```\n\nThe only general variable in this code is `minSize`,\
    \ which specifies the minimum camera size when zooming. To explain the mechanism\
    \ of approximation and distance, first note that the camera does not see the entire\
    \ scene at all time, but it has a specific field of view in a rectangle. This\
    \ rectangle appears when selecting the camera, as in the following figure:\n\n\
    ![image10.thumb.png.f4141b46b8d2a62dff545](OEBPS/Image00013.gif)\n\nThe greater\
    \ the size of this rectangle, the more space he sees from the scene, so it looks\
    \ as if the camera is moving away, but in the case of reducing its size, the opposite\
    \ happens, which is reducing the visible area so that it appears as if the camera\
    \ is approaching. You can try this while running the game by adjusting the value\
    \ of the variable in the camera component from the properties screen, where its\
    \ default value is 5.\n\nThis means that we allow the camera to be rounded, i.e.\
    \ reduce its size until it reaches 2.5 and you can allow the camera to be zoomed\
    \ closer if you reduce this number. The other two important variables are `camHeight`\
    \ and `camWidth` and represent the length and width of the rectangle that defines\
    \ the field of view, but they are calculated with Unity space values and we will\
    \ see their importance in a little while. Also we need a reference for the camera\
    \ component, which is the `cam`. Remember what I mentioned earlier, that it is\
    \ the components that distinguish one object from another, and the existence of\
    \ this component is what makes the object called `Main Camera` a camera and not\
    \ something else. Finally we have a `Bounds` variable, which is `sceneBounds`,\
    \ which will store the boundaries of the scene, which we will restrict the movement\
    \ of the camera entered.\n"
  raw: 'If you run the game, you will notice that the camera is looking directly into
    the center of the scene, and what we will do now is to add a mechanism to move
    it left and right, in addition to the possibility of rounding and distance. Before
    we start with the camera control details, we have to determine what the aspect
    ratio is. This value is important because it directly affects the size of the
    rectangle that defines the field of view of the camera. Since this game is designed
    for phones and plays incidentally, the ratio that we will adopt is 16: 9\. To
    choose it, go from the Scene screen to the Game screen and choose this percentage
    from the top left of the screen as you see here:


    ![image09.thumb.png.3acf4fca436c1a4b447737](OEBPS/Image00012.gif)


    Before starting writing the camera control code, we need to know the nature of
    this control and what the player can do with it. The control method will be two-dimensional,
    meaning that the player will be able to move the camera left and right, up and
    down. In addition, the player must be able to round and move the camera, all within
    certain limits. We will look at the camera control app shortly, and then we will
    explain some of its details. Finally, we will see how we can link the functions
    of this camera with the player''s input.


    But before that, let''s learn one of the important principles in programming games,
    especially with the Unity engine, which is separation of concerns. This means
    that a single code is responsible for one task, and it is the only one authorized
    to control the details of this task. Thus, we will first write the code to control
    the camera, but it is completely separate from the player''s input. These entries
    will be written in another code of their own, which will receive them and accordingly
    "asks" the camera control code to move them. This request may or may not be answered
    according to data that the camera can control. For example, if the player moves
    the camera to the far right of the scene and then tries to move it right beyond
    the scene, then the camera code will reject this request and the camera will remain
    in place.


    Let''s start now with the CameraControl code that you see in the following narration,
    this code must be added to the camera object in order to control it:


    using UnityEngine;


    using System.Collections;


    public class CameraControl: MonoBehavi {


        // Minimum size of the camera in the event of rounding


        public float minSize = 2.5f;


        // The height of the specified rectangle for the field of view


        private float camHeight;


        // Display the specified rectangle for the field of view


        private float camWidth;


        // A reference to the camera component


        Camera cam;


        // variable to store the boundaries of the current scene


        private Bounds sceneBounds;


        // It is executed once at start up


        void Start () {


            // Fetch the camera component on the same object


            cam = GetComponent <Camera> ();


            // Update the camera dimensions


            UpdateCamDimensions ();


        }


        // It is called once when each frame is rendered


        void Update () {


        }


        // Receive a message informing you that the outline of the scene has changed


        void SceneBoundsChanged (Bounds newBounds) {


            sceneBounds = newBounds;


        }


        // This function moves the camera by a specified amount


        public void Move (Vector2 distance) {


            // Calculate the permissible traffic limits


            float maxX = GetRightLimit ();


            float minX = GetLeftLimit ();


            float maxY = GetUpperLimit ();


            float minY = GetLowerLimit ();


                // In this particular case we are interested in the 3D site


                  // z = -10 in order to ensure that the camera is on site


                   //Always


                Vector3 dist3D = distance;


            // Calculate the new site


                  Vector3 newPos = transform.position dist3D;


            // Stick to the movement’s boundaries


            newPos.x = Mathf.Clamp (newPos.x, minX, maxX);


               newPos.y = Mathf.Clamp (newPos.y, minY, maxY);


               newPos.z = -10.0f;


            // Change the location


            transform.position = newPos;


        }


        // This function changes the camera''s proximity


        // Positive value means bringing the camera closer to the scene


        // Negative value means keeping the camera away from the scene


        public void Zoom (float amount) {


            float newSize = cam.orthographicSize - amount;


            // Stick to the limits of rounding and banishment


            float maxSize = GetMaxSize ();


            newSize = Mathf.Clamp (newSize, minSize, maxSize);


            // Change the size of the field of view and thus the approximation changes


            cam.orthographicSize = newSize;


            // Move the camera zero to ensure compliance with the scene limits


            UpdateCamDimensions ();


               Move (Vector2.zero);


        }


        // Updates the width and height of the camera


        void UpdateCamDimensions () {


            camHeight = cam.orthographicSize * 2;


            camWidth = camHeight * cam.aspect;


        }


        // The higher height of the camera is calculated


        float GetUpperLimit () {


            return sceneBounds.max.y - camHeight * 0.5f;


        }


        // The minimum height of the camera is calculated


        float GetLowerLimit () {


            return sceneBounds.min.y camHeight * 0.5f;


        }


        // Calculates the maximum position of the camera to the right


        float GetRightLimit () {


            return sceneBounds.max.x - camWidth * 0.5f;


        }


        // Calculates the maximum left of the camera


        float GetLeftLimit () {


            return sceneBounds.min.x camWidth * 0.5f;


        }


        // It calculates the largest size allowed by the camera at the time of deportation


        // Depending on the scene’s boundaries


        float GetMaxSize () {


            float maxHeight = sceneBounds.max.y - sceneBounds.min.y;


            return maxHeight * 0.5f;


        }


    }


    The only general variable in this code is minSize, which specifies the minimum
    camera size when zooming. To explain the mechanism of approximation and distance,
    first note that the camera does not see the entire scene at all time, but it has
    a specific field of view in a rectangle. This rectangle appears when selecting
    the camera, as in the following figure:


    ![image10.thumb.png.f4c141b46b8d2a62dff545](OEBPS/Image00013.gif)


    The greater the size of this rectangle, the more space he sees from the scene,
    so it looks as if the camera is moving away, but in the case of reducing its size,
    the opposite happens, which is reducing the visible area so that it appears as
    if the camera is approaching. You can try this while running the game by adjusting
    the value of the variable in the camera component from the properties screen,
    where its default value is 5.


    This means that we allow the camera to be rounded, i.e. reduce its size until
    it reaches 2.5 and you can allow the camera to be zoomed closer if you reduce
    this number. The other two important variables are camHeight and camWidth and
    represent the length and width of the rectangle that defines the field of view,
    but they are calculated with Unity space values and we will see their importance
    in a little while. Also we need a reference for the camera component, which is
    the cam. Remember what I mentioned earlier, that it is the components that distinguish
    one object from another, and the existence of this component is what makes the
    object called Main Camera a camera and not something else. Finally we have a Bounds
    variable, which is sceneBounds, which will store the boundaries of the scene,
    which we will restrict the movement of the camera entered.'
