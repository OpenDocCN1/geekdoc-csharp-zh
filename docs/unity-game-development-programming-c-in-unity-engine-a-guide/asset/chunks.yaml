  trans: '


    这次我将从 `SceneBoundsChanged()` 函数开始，完成对消息机制的解释。回到 `BackgroundManager` 代码，你会看到它正在发送一条名为
    `SceneBoundsChanged` 的消息，并将其附加到一个 `Bounds` 变量上。如果你定义了一个与消息同名的函数，并接收一个与附加项数据类型相同的变量，那么你就将该函数定义为此消息的接收者之一（该消息可以被无限数量的程序接收）。因此，`CameraControl`
    代码接收了此消息，并将新场景边界的值存储在 `sceneBounds` 变量中。


    回到 `Start()`，你所做是将相机组件的值存储在 `cam` 变量中，然后调用 `UpdateCamDimensions()`，该函数会计算相机在 Unity
    空间中的宽度和高度。让我们简单讨论一下如何计算这些值。参考 Unity 文档（特别是此页面），我们知道 `cam.orthographicSize` 变量的值（即相机的大小）是中间高度的高度。因此，我们可以将此值乘以
    2 来得到相机的高度。至于其宽度，它取决于宽高比，我们可以通过 `cam.aspect` 变量访问该比例，并将该变量乘以高度来得到相机的宽度。


    通过获取场景边界以及相机的宽高，我们可以计算出相机允许移动的限制范围。相机将允许向右移动，直到右侧视野的矩形末端达到场景的最右侧。因此，最右侧的相机位置是右边缘减去相机宽度的一半。这个值由
    `GetRightLimit()` 函数计算，同样地，我们通过 `GetLeftLimit()`、`GetUpperLimit()` 和 `GetLowerLimit()`
    计算左侧、上方和下方的其他边界。注意在这些函数中我们使用了 `sceneBounds.min` 和 `sceneBounds.max`，这两个向量表示场景边界的最小（底部和左侧）和最大（顶部和右侧）值。


    在进入代码的移动（moving）和缩放（rounding）主函数之前，让我们先熟悉辅助函数中的剩余一个函数，即 `GetMaxSize()`。该函数在执行尺寸调整时，根据场景的上下限制以及相机的高度，计算出相机允许的最大尺寸。允许的最大高度是顶部和底部场景边界之间的距离，因此允许尺寸是该距离的一半，因为正如我们所知，相机的大小是其高度的一半。


    现在我们来到代码的主函数，即移动、缩放和移动相机。从 `move()` 函数开始，它接收一个方向，代表我们想要移动相机的位移量。第一步是计算最大和最小允许流量值，并将它们存储在四个变量
    `maxX`、`minX`、`maxY`、`minY` 中。然后我们定义了一个三维向量 `dist3D`，因为相机在第三轴轴 `z` 上的位置与其他对象不同，此值必须保持为负值，也就是说相机位于场景外部并向屏幕内部注视。如果我们只使用二维尺寸来计算其位置，将导致位置的
    `z` 值丢失，相机将变为位于 `z = 0` 的位置，从而无法看到场景中的任何物体。


    计算出新位置后，将其存储在 `newPosition` 中，我们现在需要做的就是确保 `newPos.x` 的值位于 `minX` 和 `maxX` 之间，`newPos.y`
    的值也必须在 `minY` 和 `maxY` 之间。注意这里使用了 `Mathf.Clamp()` 函数，它会验证第一个数字是否在第二和第三个数字之间，如果数字超过这两个限制，则返回最大值或最小值。最后，我们将相机位置更改为
    `newPOS` 处。


    第二个主函数是相机的放大和缩小，这是通过 `Zoom` 函数完成的，此函数接收一个数字，代表缩放（如果为正）或排除（如果为负）的量。近似值和距离的方法通过从当前相机尺寸中减去该量来实现，因为相机尺寸与其近似值之间的关系是反数的，所以增加尺寸意味着减小近似值。然后，新值被限制在
    `minSize`（我们可以定义为喜欢的变量）和 `maxSize`（由之前解释的 `GetMaxSize()` 函数计算）之间。在确保新尺寸在限制范围内后，将
    `cam.orthogonalSize` 值更改为新尺寸。最后，由于尺寸已经改变，我们必须重新计算相机的尺寸，因此除了位移零外，还要调用 `UpdateCamDimensions()`，以防止尺寸变化导致其超出场景边界限制，特别是在相机尺寸增大放大的情况下；相机始终处于场景边界之内。


    因此，相机控制机制已经准备就绪，剩下的是将 `Move` 和 `Zoom` 的调用链接到玩家输入上。开始将从鼠标开始，因为引擎运行在计算机上，因此直接尝试非常容易，而我们将触摸屏和智能手机推到稍后。移动相机将通过在背景上按下左鼠标键并在四个方向移动来实现，而右键用于缩放和距离，玩家按下右键并向右移动鼠标是移动，向左移动则是远离。


    '
- fmt: "\n```csharp\n// This function is called when the left mouse button is over\
    \ the object\n    void OnMouseDrag () {\n        // Prevent movement during rounding\
    \ and deportation\n        if (! zoomingAcitve) {\n            Vector2 movement\
    \ = lastPosition - (Vector2) Input.mousePosition;\n            camControl.Move\
    \ (movement * movementSpeed);\n            lastPosition = Input.mousePosition;\n\
    \        }\n    }\n}\n```\n\nAs I mentioned earlier, this applet must be added\
    \ to the background image template, because the player will click on it with the\
    \ mouse if he wants to move the camera. When the applet starts running, it searches\
    \ in the scene for the applet that controls the camera, via `Camera (FindObjectOfType)`\
    \ , and since this applet is present once in the scene, then the search result\
    \ will definitely be the applet on the camera. So now we can use the `camController`\
    \ variable to control the camera.\n\nWhen the player clicks the left mouse button\
    \ on an object, the `OnMouseDown` message is sent once to that object, so here\
    \ we receive this message via the function of the same name where we store the\
    \ current mouse's location in the `lastPosition` variable. If the player presses\
    \ the left button and moves the mouse, then the `OnMouseDrag` message is sent\
    \ to the object in every frame in which the cursor is moved while pressing. In\
    \ the `OnMouseDrag()` function, we do three things:\n\n1. First we calculate the\
    \ displacement amount from the pressure site by subtracting the current site from\
    \ the previous site. In this way we make the movement of the camera opposite to\
    \ the movement of the cursor, if the cursor moves to the right the camera moves\
    \ left, which gives the player a feeling that he does not move the camera, but\
    \ rather grabs the scene and moves it right and left and this method is easier\
    \ for him to control, especially with the touch screen.\n2. The second step is\
    \ to call the `Move()` function and provide it with the calculated displacement\
    \ multiplied by the speed of movement. Note that the movement speed is relatively\
    \ low, because the value of mouse displacement is high compared to the amount\
    \ of displacement required for the camera.\n3. Finally, after the offset is executed,\
    \ we store the current cursor position in the `lastPosition` so that we are ready\
    \ to calculate the next offset from the new position.\n\nNote that all steps in\
    \ the `OnMouseDown()` and `OnMouseDrag()` functions are conditional on the `zoomingActive`\
    \ value being false. This variable tells us whether the player is currently zooming\
    \ or moving the camera using the right button, thus preventing movement and rounding\
    \ at the same time. The `lateUpdate()` function that we defined here instead of\
    \ `(Update)` differs from the latter in one thing, and it is called late for it.\
    \ When updating each window, Unity updates all programs by calling `Update()`\
    \ and then refreshes again using `LateUpdate()`. Therefore, calling any steps\
    \ during `(LateUpdate)` is guaranteed to be executed after updating all scene\
    \ elements through `Update`. The benefit of this is to ensure that all elements\
    \ are ready for the new frame before we move the camera, so `LateUpdate()` is\
    \ usually used with anything related to camera control.\n\nWhat we do in `LateUpdate()`\
    \ is to call `UpdateZooming()`, which checks if the player presses the right mouse\
    \ button via the `Input.GetMouseButtonDown()` function, which checks the mouse\
    \ buttons based on their numbers: the number 0 is for the left, 1 for the right\
    \ and 2 for the middle. The first thing that we do when the right button is detected\
    \ is to change the `zoomingActive` value to true which prevents the reception\
    \ of inputs from moving. Then we store the cursor's current location in `lastPosition`\
    \ just as we did with left-click state. Based on the `zoomingActive` value, we\
    \ update the approximation and distance, so we calculate the horizontal offset\
    \ by subtracting the coordinate `x` for the previous location from the coordinate\
    \ `x` for the current location, so if the mouse pointer moves to the right, the\
    \ result will be positive, which makes the value of `amount * zoomingSpeed` supplied\
    \ to the function `camControl.Zoom` positive and results in the camera zooming\
    \ , And vice versa when you move the mouse left. After updating the approximation\
    \ value, we store the current location in `lastPosition` to calculate the next\
    \ displacement. The last step in this function is to check if the player has removed\
    \ the right mouse button and reset the `zoomingSpeed` value to false in this case.\n\
    \n## Building a scene landscape\n\nAfter we've finished preparing the scene background\
    \ and we're able to move the camera to roam around freely, it's time to add the\
    \ scene elements, which are the two-dimensional objects from which we will build\
    \ the game. It will start with the floor on which the rest of the objects stand,\
    \ and which we will build in a manner similar to the way the background is built.\
    \ First we'll add an empty object as the name of the root object and call it `Ground`.\
    \ This being will be the father of all terrestrial beings. Then we will create\
    \ a template for the floor objects and add the sprite renderer and the `CameraMouseInput`\
    \ component, which makes controlling the camera by pressing the floor possible\
    \ just as with the background. We will call this template `GroundElement` and\
    \ then we will write an applet that adds ground objects depending on the background\
    \ and the boundaries of the scene. This code is `GroundManager` and shown in the\
    \ following narration, note that this Code must also be added to the root.\n\n\
    ```csharp\nusing UnityEngine;\nusing System.Collections;\n\npublic class GroundManager:\
    \ MonoBehaviour {\n    // Object Template\n    public GameObject gePrefab;\n \
    \   // with available floor\n    public Sprite [] selectionList;\n    // variable\
    \ to store the boundaries\n    private Bounds sceneBounds;\n    // image currently\
    \ displayed\n    private float selectedIndex = -1;\n\n    // called once start\n\
    \    void Start () {\n    }\n\n    // It is called once each frame\n    void Update\
