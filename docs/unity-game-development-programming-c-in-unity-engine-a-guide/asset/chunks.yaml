        public float maxStretch = 1.0f;


        // The location where the current projectile will be placed before being held
    by the player


        public Transform launchPosition;


        // Current projectile subject on the ejector


        public Projectile currentProjectile;


        // Have all the projectiles in the scene been fired?


        private bool projectilesConsumed = false;


    // Called once at startup


    void Start () {


    }


    // Called once when rendering each frame


    void Update () {


            if (projectilesConsumed)


            {


                // There''s nothing to do


                return;


            }


            if (currentProjectile! = null)


            {


    // If the projectile was not fired, it was also not caught by the player


    // Then bring the projectile to the launch site


                if (! currentProjectile.IsHeld () &&! currentProjectile.IsLaunched
    ())


                {


                    BringCurrentProjectile ();


                }


            }


            else


            {


    // There is currently no projectile on the ejector


    // Find the nearest projectile and bring it to the launch site


                currentProjectile = GetNearestProjectile ();


                if (currentProjectile == null)


                {


    // All the projectiles were consumed, send a message telling them


                    projectilesConsumed = true;


                    SendMessageUpwards ("ProjectilesConsumed");


                }


            }


    }


        // Finds the nearest projectile and returns it


        Projectile GetNearestProjectile ()


        {


            Projectile [] allProjectiles = FindObjectsOfType <Projectile> ();


            if (allProjectiles.Length == 0)


            {


                // There are no longer any projectiles


                return null;


            }


            // Search for the nearest projectile and return it


            Projectile nearest = allProjectiles [0];


            float minDist = Vector2.Distance (nearest.transform.position, transform.position);


            for (int i = 1; i <allProjectiles.Length; i ++)


            {


             float dist = Vector2.Distance (allProjectiles [i] .transform.position,
    transform.position);


                if (dist <minDist)


                {


                    minDist = dist;


                    nearest = allProjectiles [i];


                }


            }


            return nearest;


        }


        // You move the current projectile one step smoothly towards the launch site


        void BringCurrentProjectile ()


        {


            // Bring locations where the projectile will move between them


            Vector2 projectilePos = currentProjectile.transform.position;


            Vector2 launcherPos = launchPosition.transform.position;


            if (projectilePos == launcherPos)


            {


                // Extruded at the launch site actually, no need to move it


                return;


            }


    // Use linear interpolation with elapsed time between frames for smooth movement


            projectilePos = Vector2.Lerp (projectilePos, launcherPos, Time.deltaTime
    * 5.0f);


            // Put the projectile in its new position


            currentProjectile.transform.position = projectilePos;


            if (Vector2.Distance (launcherPos, projectilePos) <0.1f)


            {


    // The projectile became very close, place it directly at the launch site


                currentProjectile.transform.position = launcherPos;


                currentProjectile.AllowControl ();


            }


        }


        // Holds the current projectile


        public void HoldProjectile ()


        {


            if (currentProjectile! = null)


            {


                currentProjectile.Hold ();


            }


        }


        // Drags the current projectile to a new location


        public void DragProjectile (Vector2 newPosition)


        {


            if (currentProjectile! = null)


            {


                // Make sure not to exceed the maximum elastic cord tension


                float currentDist = Vector2.Distance (newPosition, launchPosition.position);


                if (currentDist> maxStretch)


                {


                    // Change the location provided to the furthest allowed point


                    float lerpAmount = maxStretch / currentDist;


                    newPosition = Vector2.Lerp (launchPosition.position, newPosition,
    lerpAmount);


                }


                // Place the projectile in the new location


                currentProjectile.Drag (newPosition);


            }


        }


        // Drops the current projectile and launches it if the player is holding it


        public void ReleaseProjectile ()


        {


            if (currentProjectile! = null)


            {


                currentProjectile.Launch (launchForce);


            }


        }


    The general variables in this applet are launchForce, which represents the launch
    force, maxStretch, which is the maximum permissible distance between the projectile
    and the firing position during the tension (i.e., the maximum extension of the
    rubber thread) and launchPosition, a variable to store the launch site object
    named LaunchPos, which we added to the slingshot template when we created it.
    Finally we have a reference to the current projectile located on the ejector which
    is currentProjectile.


    In each update cycle, the Update () function checks whether an existing projectile
    is present, and if it does not, it calls the GetNearestProjectile () function
    that searches for the nearest projectile and returns it. If this function does
    not find any projectiles in the scene, it returns the value null, in which case
    the applet sends the ProjectilesConsumed message to the top of the scene hierarchy
    in order to notify the game controllers that the player has exhausted all their
    projectiles at this point. When all projectiles are exhausted, the value of the
    projectilesConsumed variable is changed to true, which means that the Update ()
    function will not do anything anymore. In the case of an existing projectile that
    the player has not yet grabbed or launched, Update () calls the BringCurrentProjectile
    () function which moves the current projectile towards the launch site smoothly
    (remember that the original projectile position is on the ground next to the slingshot).
    When the projectile arrives at launchPosition, this function will automatically
    stop moving it even if it is still called by Update ().


    Here I will talk a little bit more about the BringCurrentProjectile () function
    to explain the mechanism you use to achieve the smooth movement of the projectile
    from its current position towards the launch site. The smooth movement in game
    engines depends on the elapsed time factor between each two consecutive frames,
    which is in the Unity variable Time.deltaTime. In addition to this variable we
    will need a function that calculates the Linear Interpolation between two different
    values. But what is a linear interpolation? It is simply a value between two lower
    and higher limits. This value may be an abstract number between two numbers, a
    position between two locations, a color between two colors, etc. But where exactly
    is this value between the two limits? What determines this location is the interpolation
    value, which is a fractional value between zero and one. For example, if we want
    to calculate interpolation between the numbers 0 and 10, and the interpolation
    value is 0.6, the result will be 6, and if the interpolation value is 0.45, the
    result will be 4.5 and so on.'
