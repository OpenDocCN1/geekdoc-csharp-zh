    \    void Start () {\n        // 如果检测到手机操作系统，则销毁鼠标输入组件\n        if (Application.platform\
    \ == RuntimePlatform.Android)\n        {\n            LauncherMouseInput mouseInput\
    \ = GetComponent <LauncherMouseInput>();\n            Destroy (mouseInput);\n\
    \        }\n        launcher = GetComponent <Launcher>();\n    }\n\n    // 在每帧渲染时调用一次\n\
    \    void Update () {\n        UpdateTouchStart ();\n        UpdateDragging ();\n\
