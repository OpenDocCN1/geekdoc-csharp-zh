  raw: 'This time I will start with the SceneBoundsChanged () function to complete
    the explanation of the idea of the messages. Going back to the BackgroundManager
    code you will see that it is sending a message named SceneBoundsChanged and attaching
    it to a Bounds variable. If you define a function with the same name as the message
    and take a variable of the same type as the attachment, then you have defined
    this function as one of the recipients of this message (the message can be received
    by an unlimited number of programs). Thus, the CameraControl code receives this
    message and stores the value of the new scene boundaries in the sceneBounds variable.


    Returning to Start (), what you are doing is storing the value of the camera component
    in the cam variable and then calling UpdateCamDimensions (), which calculates
    the width and height of the camera in Unity spaces. Let''s talk a little bit about
    how to calculate these values. Referring to Unity documentation, specifically
    this page, we will know that the value of the cam.orthographicSize variable, which
    is the size of the camera, is mid-height. So we can multiply this value by 2 to
    get the camera height. As for its width it depends on the aspect ratio, which
    we can access via the cam.aspect variable, where we can multiply this variable
    in height to get the width of the camera.


    By obtaining the boundaries of the scene and the height and width of the camera,
    we can calculate the limits within which the camera is allowed to move. The camera
    will be allowed to move right until the rectangular end of the right field of
    vision has reached the maximum right of the scene. Consequently, the rightmost
    camera location is the edge of the right view minus half of the camera’s width.
    This value is calculated by the GetRightLimit () function, and in a similar way
    we calculate other boundaries on the left, up, and down through GetLeftLimit (),
    GetUpperLimit (), and GetLowerLimit (). Note that in these functions we use sceneBounds.min
    and sceneBounds.max, the two vectors that express the minimum (bottom and left)
    and the maximum (top and right) of the scene boundaries.


    Before entering the main functions of the code, moving and rounding, let''s get
    acquainted with the remaining function within the auxiliary functions, which is
    GetMaxSize (). This function calculates the maximum permissible size of the camera
    when carrying out the dimensions, depending on the upper and lower limits of the
    scene in addition to the height of the camera. The maximum permissible height
    is the distance between the top and bottom scenery boundaries, and the permissible
    size is therefore half that distance, because the size of the camera is half the
    height of it as we have known.


    Now we come to the main functions of this code, which is to move, zoom and move
    the camera. Beginning with the move () function which takes a direction represents
    the amount of displacement we want to move the camera with. The first step is
    to calculate the maximum and minimum permissible traffic values, and store them
    in the four variables maxX, minX, maxY, minY. Then we define a 3D vector, dist3D,
    because the location of the camera on the third axis of z is important unlike
    other objects, as this value must remain negative, that is, the camera is far
    from the scene outside and looks at it inside the screen. If we calculated its
    location using only the two-dimensional dimensions, this would result in the loss
    of the value of z for the location, and the camera would become in the location
    z = 0, and thus would not be able to see any object in the scene.


    After calculating the new location, we store it in the newPosition, and all we
    have to do now is make sure that the value of newPos.x is between minX and maxX,
    as well as the value of newPos.y that must be between minY and maxY. Note here
    that you use the Mathf.Clamp () function, which verifies that the first number
    is between the second and third numbers and returns the maximum or minimum if
    the number exceeds these two limits. Finally we are changing the camera location
    for the newPOS site.


    The second main function is to zoom in and out of the camera, which is done via
    the Zoom function, this function takes one number, which is the amount of rounding
    (if positive) or exclusion (if negative). The method of approximation and distance
    is accomplished by subtracting the amount from the current camera size, because
    the relationship between the size of the camera and its approximation is inverse,
    so increasing the size means reducing the approximation. Then the new value is
    confined between minSize, which is the variable that we can define as we like
    and maxSize, which is calculated by the GetMaxSize () function previously explained.
    After ensuring that the new size is within the limits, the cam.orthogonalSize
    value is changed to the new new size. Finally we must recalculate the dimensions
    of the camera as its size has changed so we call UpdateCamDimensions () in addition
    to its displacement by zero in order to preclude the possibility that the change
    in its size has led to exceeding its limits to the scene boundaries especially
    in the case of deportation where the size of the camera increases; The camera
    is always within the boundaries of the scene.


    Thus, the camera control mechanism is ready, and it remains for us to link the
    call (Move) and () Zoom to the player inputs. The start will be with the mouse,
    because the engine runs on the computer, therefore it is easy to try it directly,
    while we will postpone the touch screen and smart phones for a later time. Moving
    the camera will be done by pressing the left mouse button on the background and
    then moving it in the four directions, while the right button is used for rounding
    and distance, where the player presses the right button and moves the mouse right
    to move and left to move away. These functions will be performed by the CameraMouseInput
    code that we must add to the BGElement background template, where all background
    images must be able to receive mouse inputs. Below is a listing with this code.


    using UnityEngine;


    using System.Collections;


    public class CameraMouseInput: MonoBehavi {


        // The movement speed of the camera


        public float movementSpeed = 0.1f;


        // Zoom speed and distance


        public float zoomingSpeed = 0.01f;


        // During rounding and distance true this value is variable


        private bool zoomingAcitve = false;


        // It stores the location of the mouse pointer in the previous window


           private Vector2 lastPosition;


        // Reference for camera control applet


        private CameraControl camControl;


        // This function is executed once upon startup


        void Start () {


            // Bring the camera control applet


            camControl = FindObjectOfType <CameraControl> ();


        }


        // It is called when every frame is rendered, but late


        void LateUpdate () {


            UpdateZooming ();


        }


        // It reads the approximation and exclusion entries


        void UpdateZooming () {


            // Check the right mouse button


            if (Input.GetMouseButtonDown (1)) {


                zoomingAcitve = true;


                lastPosition = Input.mousePosition;


            }


            // Update the zoom and distance based on the horizontal movement of the
    mouse


            if (zoomingAcitve) {


                float amount = Input.mousePosition.x - lastPosition.x;


                camControl.Zoom (amount * zoomingSpeed);


                lastPosition = Input.mousePosition;


            }


            // When decompressing the right mouse button false to zoomingActive, return
    a value


            if (Input.GetMouseButtonUp (1)) {


                zoomingAcitve = false;


            }


        }


        // This function is called when the right mouse button is clicked on the object


        void OnMouseDown () {


            // Do not allow movement during rounding and deportation


            if (! zoomingAcitve) {


                lastPosition = Input.mousePosition;


            }


        }'
