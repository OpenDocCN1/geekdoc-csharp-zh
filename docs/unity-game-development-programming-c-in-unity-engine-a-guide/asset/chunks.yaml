    of pressure, especially at the end of the project requires patience and waiting
    for the expected results, based on the former, you must develop certain skills,
    `Vbk games` is not the only skill required of you there are other factors :


    ## The ability to communicate with different people


    One of the most important features of a game designer is that he has the ability
    to communicate with everyone you think will give success to your game, so you
    have to be positive to deal with the degree of flexibility with them as a whole,
    because you will present the idea of the game in different kinds of ways of thinking,
    because you will show your game on: , Management, investors, and possibly your
    friends and family. To confront this, you must be persuasive and clear language
    interpretation, that is to be interpreted logical logical and clear and simple
    according to the nature of the thinking of the opposite person, and be a successful
    provider and exhibitor of the project. It is the only thing whose goal is to provide
    you with adequate coverage of the subject with the material support of the parties
    concerned, and you must realize that everyone looks at your game from a different
    perspective, the donor is different from your friend!


    And the skill of communication is not limited to writing and public speaking,
    but it also means listening and preparing to discuss in a logical and logical
    manner. Your willingness to listen to the `Game Tester` and your teammates in
    `Teammate` will produce new ideas and new directions. What is your reaction when
    you hear something you do not like to hear? We know that it is difficult to make
    some concessions, but here it is different and you have to concede in this matter
    because it is intended to increase productivity. In fact, most game designers
    believe that the opinions and ideas they have collected should never be waived.
    If the new opinion is good it will add ideas from its goal to give creativity
    to the game. For example, you may see some of the effects of their goal adding
    useful things to the game that make them beautiful, but Technically, you can not
    do that because it is expensive on the type of device the game will get on, and
    maybe the time is not enough to work, but what if The programmer provided a secondary
    way of the effects you want so that they can be programmed in a short time and
    at a lower cost? Will you keep your first opinion under these circumstances? In
    the end, your goal is to find the right idea that can be adapted from all the
    requirements of the work, you must listen to any new opinion of the purpose of
    the success of the project.


    ## The skill of working within a team


    The game industry is one of the most important areas through which to understand
    the meaning and usefulness of work within an integrated team, where everyone is
    responsible for the field is specialized, it is specialized science in the field
    of computer there will be programming graphics, and there will be the design,
    And to lay the foundations of artificial intelligence and who will manufacture
    the characters and move them, and there will support the game and ensure the physical
    aspect of them, and there will be marketed, and there will be handed over to the
    hand of the hand! There is a series of disciplines, all of which are one body
    complementing each other.


    And because you are a game designer, you will deal with most of the previous disciplines
    and you will understand that each character has a different view from the previous
    one and a way of thinking fits his perspective. When you talk to a programmer
    in a case, you will find a difference of opinion between him and the producer
    who cares about the material aspect. To be the link between all characters and
    the mediator between them to make sure that this group will all play the game
    as expected to the end.


    ## Able to handle matters when necessary


    Often, when you have a timeline, you will have to make a decision that sometimes
    negatively affects the quality of the game as a whole or the process of development,
    and will generate future problems continue to appear one by one until the game
    as a whole set of problems can not be solved! This is a serious issue especially
    in the final stages of the design of the game. When the time runs out, some problems
    will arise. You will be able to solve it and you will have to delete some Stages
    and some elements to keep items that are designed properly, it''s a real disaster,
    but ultimately help us to understand why contain a lot of games on the contradictions
    that often deadens the game before the arrival of the market (Dead On Arrival
    `D.O.A` shortly.


