    This program performs three steps in each update:


    The first step is through the UpdateTouchStart () function, which verifies that
    the player has just touched the screen with one finger. In this case, the function
    calculates the location of the touch in the scene space and then checks whether
    that location is within the limits of the collision component of the current projectile
    on the launch slingshot. If this touch is actually within the bounds of the projectile,
    it means that the player wants to hold it, so the function holds the projectile
    by calling HoldProjectile () from the Launcher.


    The second step through UpdateDragging () involves having one finger on the screen,
    calculating the location of the finger in the scene space and asking the Launcher
    to move the current projectile to that location. Keep in mind that other things
    like making sure that you have a projectile or if it is held or launched is done
    by the Launcher itself so you don''t need to check it here, and you may remember
