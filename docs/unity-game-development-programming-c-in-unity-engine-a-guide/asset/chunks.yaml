  trans: "\n\n```cs\n// 橡胶弹射绳可以伸出的最大长度\npublic float maxStretch = 1.0f;\n\n// 当前弹体在被玩家持有之前放置的位置\n\
    public Transform launchPosition;\n\n// 弹射器上当前的弹体\npublic Projectile currentProjectile;\n\
    \n// 场景中所有的弹体是否都已发射？\nprivate bool projectilesConsumed = false;\n\n// 启动时调用一次\n\
    void Start () {\n}\n\n// 每一帧渲染时调用一次\nvoid Update () {\n    if (projectilesConsumed)\n\
    \    {\n        // 无需用事可做\n        return;\n    }\n    if (currentProjectile !=\
    \ null)\n    {\n        // 如果弹体没有被发射，它也没有被玩家捕获\n        // 则将弹体带到发射位置\n      \
    \  if (! currentProjectile.IsHeld () &&! currentProjectile.IsLaunched ())\n  \
    \      {\n            BringCurrentProjectile ();\n        }\n    }\n    else\n\
    \    {\n        // 目前弹射器上没有弹体\n        // 寻找最近的弹体并将其带到发射位置\n        currentProjectile\
    \ = GetNearestProjectile ();\n        if (currentProjectile == null)\n       \
    \ {\n            // 所有弹体已消耗，发送消息通知它们\n            projectilesConsumed = true;\n\
    \            SendMessageUpwards (\"ProjectilesConsumed\");\n        }\n    }\n\
    }\n\n// 寻找最近的弹体并返回它\nProjectile GetNearestProjectile ()\n{\n    Projectile []\
    \ allProjectiles = FindObjectsOfType <Projectile>();\n    if (allProjectiles.Length\
    \ == 0)\n    {\n        // 不再有任何弹体\n        return null;\n    }\n    // 搜索最近的弹体并返回它\n\
    \    Projectile nearest = allProjectiles [0];\n    float minDist = Vector2.Distance\
    \ (nearest.transform.position, transform.position);\n    for (int i = 1; i <allProjectiles.Length;\
    \ i ++)\n    {\n        float dist = Vector2.Distance (allProjectiles [i] .transform.position,\
    \ transform.position);\n        if (dist < minDist)\n        {\n            minDist\
    \ = dist;\n            nearest = allProjectiles [i];\n        }\n    }\n    return\
    \ nearest;\n}\n\n// 将当前弹体平滑地移动到发射位置\nvoid BringCurrentProjectile ()\n{\n    //\
    \ 获取弹体移动之间的位置\n    Vector2 projectilePos = currentProjectile.transform.position;\n\
    \    Vector2 launcherPos = launchPosition.transform.position;\n    if (projectilePos\
    \ == launcherPos)\n    {\n        // 实际上已经在发射位置挤出，不需要移动它\n        return;\n  \
    \  }\n    // 使用帧之间的经过时间的线性插值来实现平滑移动\n    projectilePos = Vector2.Lerp (projectilePos,\
    \ launcherPos, Time.deltaTime * 5.0f);\n    // 将弹体置于新位置\n    currentProjectile.transform.position\
    \ = projectilePos;\n    if (Vector2.Distance (launcherPos, projectilePos) <0.1f)\n\
    \    {\n        // 弹体变得非常接近，直接将其放置在发射位置\n        currentProjectile.transform.position\
    \ = launcherPos;\n        currentProjectile.AllowControl ();\n    }\n}\n\n// 持有当前弹体\n\
    public void HoldProjectile ()\n{\n    if (currentProjectile != null)\n    {\n\
    \        currentProjectile.Hold ();\n    }\n}\n\n// 将当前弹体拖到新位置\npublic void DragProjectile\
    \ (Vector2 newPosition)\n{\n    if (currentProjectile != null)\n    {\n      \
    \  currentProjectile.Drag ();\n    }\n}\n```\n\n"
- fmt: "\nWe calculate the new projectile position as it moves towards the launch\
    \ site using this technique, in which case the interpolation takes place between\
    \ the minimum `projectilePos` current and the maximum target we want to reach,\
    \ the `launcherPos`. The value of the interpolation is relatively low ie it is\
    \ closer to the target, which is the time elapsed since the previous tire was\
    \ rendered multiplied by 5. The importance of using the time value here lies in\
    \ the fact that not all tires are rendered at the same speed. Not fixed and may\
    \ increase and decrease. Therefore, to maintain a constant movement speed, we\
    \ have to multiply by the amount of time which increases as the number of frames\
    \ per second decreases and vice versa, making the movement speed that the player\
    \ sees constant regardless of the number of frames per second or less.\n\nThe\
    \ three functions `HoldProjectile()`, `DragProjectile()`, and `ReleaseProjectile()`\
    \ call the `Hold()`, `Drag()`, and `Launch()` functions of the current projectile\
    \ `currentTarget`. The function that needs some explanation here is `DragProjectile()`\
    \ because it contains an additional step that is not present in the `Projectile`,\
    \ which is to verify that the distance of the projectile from the initial launch\
    \ site while pulling back does not exceed the allowable length of the rubber slingshot\
    \ stretch. This stretch is defined in the `maxStretch` variable. The way we are\
    \ going to impose this maximum length should take into account the ease of control\
    \ as well, if the player pulls the cursor beyond the allowed length should not\
    \ withdraw with the projectile, but at the same time must remain able to change\
    \ the angle of launch. In order to achieve this mechanism we will use linear interpolation\
    \ again and this usage is described in lines 131 and 132.\n\nThe idea is to calculate\
    \ the distance between the launch location and the current location of the `currentDist`\
    \ and compare it to the maximum expansion, `maxStretch`. If this distance exceeds\
    \ the limit, we will divide `maxStretch` by `currentDist`, thus obtaining the\
    \ required interpolation between the original `launchPosition.position` and the\
    \ current location of the new `newPosition`. This value will naturally decrease\
    \ with increasing distance from the cursor to the launch site, thus maintaining\
    \ a constant distance from the launch site, which is the `maxStretch` distance.\
    \ By completing the interpolation, we get the correct `newPosition` without affecting\
    \ the smooth motion, and then use the `Drag()` function to move the projectile.\
    \ It is necessary to use this function and not to move the projectile directly\
    \ because it verifies the conditions in terms of the fact that the projectile\
    \ is held by the player and has not been launched, which is the movement conditions\
    \ according to the rules of the game.\n\nAfter writing the applet we have to add\
    \ it to the empty `Object Launcher`, which is the root of all the slash objects\
    \ that make up the slingshot. The next applet we will add will draw the rubber\
    \ cord between the ends of the slingshot and the projectile. But before moving\
    \ on to the applet we have to add the component responsible for drawing the line\
    \ that will represent this rope. The component we will add is called Line Renderer\
    \ and can be deided as usual from the Add Component button and then write the\
    \ component name as in the following picture. This component draws a solid line\
    \ between a set of points assigned to it via the `positions` array, starting with\
    \ the first point in the array to the last point:\n\n![](OEBPS/Image00039.gif)\n\
    \nAfter adding the component we have to adjust some of its values: first we have\
    \ to change the number of points that draw the `positions` line to 3 and then\
    \ make it thinner by changing both `Start Width` and `End Width` to 0.1, and finally\
    \ we'll change its color to red at the beginning and end (you can of course choose\
    \ Any other color). These settings are shown in the following image:\n\n![](OEBPS/Image00040.gif)\n\
    \nNow let's launch the `LauncherRope`, which is responsible for drawing this line\
    \ between the ends of the slingshot and the projectile. This applet is described\
