    choose the background number that we want to appear on the screen, and this number
    will be from 0 to 7\. We will return to this applet theme shortly.


    Before going into details I would like to point out that the objects in the Unity
    engine are all similar, and they are in their original empty position invisible,
    and what distinguishes each object from others and gives it its own characteristics
    is the set of components that are added to it. The only component in the empty
    object is Transform, which is found in all engine objects without exception, as
    it gives the object its location, rotation and size in the two-dimensional (or
    three-dimensional) space in addition to that it determines its relationships with
    other objects such as the father and sons relationship that we see in the hierarchy
    of the scene. Based on this fact, what you see in the Inspector properties screen
    when you choose any object is the set of components added to it.'
