- fmt: "\n![](cover1.jpeg)\n\nUnity Game Dev development\n\nProgramming C# in Unity\
    \ Engine , a guide book for beginners\n\n2nd edition\n\nBy\n\nKathleen Peterson\n\
    \n2021\n\n\"Programming isn't about what you know; it's about what you can figure\
    \ out.\" - Chris Pine\n\n## Who this book is for?\n\nIf you don't know anything\
    \ about programming in general, writing code, writing scripts, or have no idea\
    \ where to even begin, then this book is perfect for you. If you want to make\
    \ games and need to learn how to write C#` scripts or code, then this book is\
    \ ideal for you.\n\n## Table of Contents\n\n- INTRODUCTION 8\n- 2D OR 3D PROJECTS\
    \ 8\n- FULL 3D 9\n- ORTHOGRAPHIC 3D 10\n- FULL 2D 11\n- 2D GAMEPLAY WITH 3D GRAPHICS\
    \ 11\n- WHY DO WE USE GAME ENGINES? 14\n- QUICK STEPS TO GET STARTED WITH UNITY\
    \ ENGINE 15\n- CHAPTER ONE 20\n    - SETTING THE SCENE AND CAMERA IN UNITY3D 20\n\
    \    - SCENE BUILDING AND BACKGROUND PROCESSING 24\n    - BUILDING A CAMERA CONTROL\
    \ SYSTEM 49\n    - BUILDING A SCENE LANDSCAPE 72\n- CHAPTER 2 81\n    - MOTION\
    \ IN PROGRAMMING 81\n- CHAPTER III 97\n    - CREATE AND LAUNCH PROJECTILES 98\n\
    \    - SPECIAL ATTACKS FOR PROJECTILES 114\n    - EJECTOR INDUSTRY 122\n- CHAPTER\
    \ IV 144\n    - TOUCH SCREEN INPUT IN UNITY3D AND EXPORT FOR PHONES 145\n    -\
    \ TIPS FOR DESIGNER GAMES 163\n    - THE GAME DESIGNER PUTS HIMSELF IN THE PLAYER'S\
    \ PLACE 164\n    - GAME TESTERS 165\n    - SKILLS 166\n    - THE ABILITY TO COMMUNICATE\
    \ WITH DIFFERENT PEOPLE 167\n    - THE SKILL OF WORKING WITHIN A TEAM 168\n  \
    \  - ABLE TO HANDLE MATTERS WHEN NECESSARY 169\n    - ABLE TO DRAW AROUND IT 170\n\
    \    - CAPABLE OF CREATIVITY 171\n\n## Introduction\n\nUnity is a cross-platform\
    \ development platform initially created for developing games but is now used\
    \ for a wide range of things such as: architecture, art, children's apps, information\
    \ management, education, entertainment, marketing, medical, military, physical\
    \ installations, simulations, training, and many more. Unity takes a lot of the\
    \ complexities of developing games and similar interactive experiences and looks\
    \ after them behind the scenes so people can get on with designing and developing\
    \ their games. These complexities include graphics rendering, world physics and\
    \ compiling. More advanced users can interact and adapt them as needed but for\
    \ beginners they need not worry about it. Games in Unity are developed in two\
    \ halves; the first half -within the Unity editor, and the second half -using\
    \ code, specifically C#. Unity is bundled with `MonoDevelopor Visual Studio 2015\
    \ Community` for writing C#.\n\n## 2D OR 3D PROJECTS\n\nUnity is equally suited\
    \ to creating both 2D and 3D games. But what’s the difference? When you create\
    \ a new project in Unity, you have the choice to start in 2D or 3D mode. You may\
    \ already know what you want to build, but there are a few subtle points that\
    \ may affect which mode you choose. The choice between starting in 2D or 3D mode\
    \ determines some settings for the Unity Editor -such as whether images are imported\
    \ as textures or sprites. Don’t worry about making the wrong choice though, you\
    \ can swap between 2D or 3D mode at any time regardless of the mode you set when\
    \ you created your project. Here are some guidelines which should help you choose.\n\
    \n## Full 3D\n\n![](OEBPS/Image0000.jpg)\n\n3D games usually make use of three-dimensional\
    \ geometry, with materials and textures rendered on the surface of these objects\
    \ to make them appear as solid environments, characters and objects that make\
    \ up your game. The camera can move in and around the scene freely, with light\
    \ and shadows cast around the world in a realistic way. 3D games usually render\
    \ the scene using perspective, so objects appear larger on screen as they get\
    \ closer to the camera. For all games that fit this description, start in3D mode.\n\
    \n## Orthographic 3D\n\n![](OEBPS/Image0001.jpg)\n\nSometimes games use 3D geometry,\
    \ but use an orthographic camera instead of perspective. This is a common technique\
    \ used in games which give you a bird’s-eye view of the action, and is sometimes\
    \ called \"2.5D\". If you’re making a game like this, you should also use the\
    \ editor in3D mode because even though there no perspective, you will still be\
    \ working with 3D models and assets. You’ll need to switch your camera and scene\
    \ to Orthographic.\n\n## Full 2D\n\n![](OEBPS/Image0002.jpg)\n\nMany 2D games\
    \ use flat graphics, sometimes called sprites, which have no three-dimensional\
    \ geometry at all. They are drawn to the screen as flat images, and the game’s\
    \ camera has no perspective. For this type of game, you should start the editor\
    \ in 2D mode.\n\n## 2D Gameplay with 3D Graphics\n\n![](OEBPS/Image0003.jpg)\n\
    \nSome games use 3D geometry for the environment and characters, but restrict\
    \ gameplay to two dimensions. For example, the camera may show a \"side scrolling\
    \ view\" and the player can only move in two dimensions, but game still uses 3D\
    \ models for the obstacles and a 3D perspective for the camera. For these games,\
    \ the 3D effect may serve a stylistic rather than functional purpose. This type\
    \ of game is also sometimes referred to as \"2.5D\". Although the gameplay is\
    \ 2D, you will mostly be manipulating 3D models to build the game so you should\
    \ start the editor in 3D mode.\n\nPerhaps the gaming industry is one of the most\
    \ difficult industries in this era, and that is in many ways that start with technical\
    \ challenges, passing through an audience that is difficult to satisfy and ruthless\
    \ even for the major companies if their products are not at the required level,\
    \ and not an end to fierce competition and high failure rates and the difficulty\
    \ of achieving profits that cover high production costs. On the other hand, there\
    \ are features of this industry that make survival in it possible. On the technical\
    \ side, for example, the vast majority of games are not free of similar functions\
    \ and repetitive patterns of data processing, which makes the reuse of the software\
    \ modules of previous games in order to create new games possible. This, in turn,\
    \ contributes to overcoming technical obstacles and shortening time and effort.\n\
    \nWhen you talk about making a game, you are here to mention the big process that\
    \ involves dozens and possibly hundreds of tasks to accomplish in many areas.\
    \ Making a game means producing, marketing, and publishing it, and all the administrative,\
    \ technical, financial, and legal procedures and steps involved in these operations.\
    \ However, what is important for us in this series of lessons is the technical\
    \ aspect which is game development, which is the process of building the final\
    \ software product with all its components. This process does not necessarily\
    \ include game design, as the design process has a broader perspective and focuses\
    \ on such things as the story, the general characteristic of the game, the shapes\
    \ of the stages and the nature of the opponents, as well as the rules of the game,\
    \ its goals and terms of winning and losing.\n\nReturning to the game development\
    \ process, we find that many specializations and skills contribute to this process.\
    \ There are painters, model designers, animation technicians, sound engineers,\
    \ and director, in addition to - of course - programmers. This comprehensive view\
    \ is important to know that the programmer's role in producing the game is only\
    \ an integral role for the roles of other team members, though this image is beginning\
    \ to change with the emergence of independent developers Indie Developers who\
    \ perform many tasks besides programming.\n\n## Why do we use game engines?\n"
