    Note that the only general variable in this applet is lifeSpan, which determines
    how long the projectile stays in the scene after it is launched. Otherwise, we
    have state variables launched, held, controllable, and attackPerformed, all of
    which are private and can only be controlled by sending messages or calling functions.
    In addition to this general variable we have four special variables reflect the
    different situations in which the projectile from the beginning of the game until
    it is launched until it finally disappears from the scene. These variables are
    controllable, held, launched, and attackPerformed and their initial value is false.
    The different projectile modes come in the following sequence:


    At the beginning of the game, the projectile is placed on the ground next to the
    slingshot, and in the meantime remains static and the player can not control until
    the turn comes into play. In this case the value of the controllable variable
    is false, which prevents the player from controlling the projectile.


    As soon as the projectile turns into the launcher and is placed on the ejector,
    the AllowControl () function is called, which changes the controllable value to
    true and allows the player to control the projectile. The other three variables
    remain false.


    Once the player clicks the projectile, the Hold () function is called, which assumes
    that the value of the held variable is changed to true. Since this variable indicates
    that the player is holding the projectile, it must first make sure that the player
    is allowed to control it by checking the controllable value, it should also make
    sure that it is not held by checking the value held itself, and finally must check
    the value of launched to be sure That the projectile is not released yet, because
    the projectile cannot be held after its release. After these three conditions
    are verified, the location where the projected player is held is stored in the
    holdPosition variable and the ProjectileHeld message is sent to report that the
    projectile was caught.


    After grabbing the player begins to move the projectile to prepare it for launch,
    where he pulls back and down in preparation for launch. While holding the projectile,
    the player is allowed to call the Drag () function, which moves the projectile
    to a specific location. As you can see, the process of moving through this function
    depends on the fact that the projectile is manageable and currently held, and
    it should not have been launched.


    When the player drops the projectile, the Launch () function is called, which
    can be given a numeric value representing the firing force coefficient. This coefficient
    enables us to make more than one slingshot with different firing forces. When
    called, this function verifies that the projectile is under the control of the
    player and that the player is currently holding it, and that it has not yet been
    launched. After these conditions are met, the firing force is calculated by the
    distance between the projectile''s holding position and its dropping position
    and multiplied by the function-supplied operator, since pulling the projectile
    further would result in greater firing force. The solid object is then activated
    again by setting the isKinematic variable to false and thus reactivating the solid
    body''s response to external forces before adding its firing force. After the
    launch is executed the status variables are updated; the player is prevented from
    controlling the projectile by changing the controllable to false and the launch
    state is activated by changing launched to true and is also re-held to false since
    the player is no longer holding the projectile. Finally the ProjectileLaunched
    message is sent in order to inform other applets that the projectile has been
    launched.


    After launching the projectile, one last step the player can take is to carry
    out the projectile attack, such as splitting into three smaller, double-speed
    or other projectiles. A player can perform this attack by calling the PerformSpecialAttack
    () function, which makes sure that the attackPerformed value is false; this attack
    is allowed only once. In addition to this condition, it must be ensured that the
    projectile has already been launched by checking the launched variable; this attack
    can be carried out only after the projectile is launched. As you can see, this
    function does not actually execute the attack, instead it sends a DoSpecialAttack
    message that another applet will receive and execute the actual attack accordingly.
    By separating the recall from the attack, we continue to work on the principle
    of separation of interests and enable ourselves to program more than one type
    of attack without affecting the basic program structure.


    Unlike these phases, the IsHeld () and IsLaunched () functions enable other applets
    to read the values of special variables but not change their value. Reading these
    two variables will be of interest to applets whose work depends on the projectile
    applet as we will see shortly. Another note is to use the SendMessageOptions.DontRequireReceiver
    option when you send the DoSpecialAttack message, so we do not require a message
    receiver. The reason is that this attack is optional and it is OK to have projectiles
    that have no special attack.


    With this we have identified the basic programmable ballistics, and we have some
    small auxiliary programs for secondary functions.


    The first applet is ProjectileSounds and is responsible for ballistics sounds.
    What this applet simply does is receive the ProjectileHeld constipation messages
    and launch ProjectileLaunched and play the selected audio file for each process.
    The following narrative illustrates this applet:


