    the camera, but rather grabs the scene and moves it right and left and this method
    is easier for him to control, especially with the touch screen.


        The second step is to call the Move () function and provide it with the calculated
    displacement multiplied by the speed of movement. Note that the movement speed
    is relatively low, because the value of mouse displacement is high compared to
    the amount of displacement required for the camera.


        Finally, after the offset is executed, we store the current cursor position
    in the lastPosition so that we are ready to calculate the next offset from the
    new position.


    Note that all steps in the OnMouseDown () and OnMouseDrag () functions are conditional
    on the zoomingActive value being false. This variable tells us whether the player
    is currently zooming or moving the camera using the right button, thus preventing
    movement and rounding at the same time. The lateUpdate () function that we defined
    here instead of (Update) differs from the latter in one thing, and it is called
    late for it. When updating each window, Unity updates all programs by calling
    Update () and then refreshes again using LateUpdate (). Therefore, calling any
    steps during (LateUpdate) is guaranteed to be executed after updating all scene
    elements through () Update. The benefit of this is to ensure that all elements
    are ready for the new frame before we move the camera, so LateUpdate () is usually
    used with anything related to camera control.


    What we do in LateUpdate () is to call UpdateZooming (), which checks if the player
    presses the right mouse button via the Input.GetMouseButtonDown () function, which
    checks the mouse buttons based on their numbers: the number 0 is for the left,
    1 for the right and 2 for the middle. The first thing that we do when the right
    button is detected is to change the zoomingActive value to true which prevents
    the reception of inputs from moving. Then we store the cursor''s current location
    in lastPosition just as we did with left-click state. Based on the zoomingActive
    value, we update the approximation and distance, so we calculate the horizontal
    offset by subtracting the coordinate x for the previous location from the coordinate
    x for the current location, so if the mouse pointer moves to the right, the result
    will be positive, which makes the value of amount * zoomingSpeed supplied to the
    function () camControl.Zoom positive and results in the camera zooming , And vice
    versa when you move the mouse left. After updating the approximation value, we
    store the current location in lastPosition to calculate the next displacement.
    The last step in this function is to check if the player has removed the right
    mouse button and reset the zoomingSpeed value to false in this case.


