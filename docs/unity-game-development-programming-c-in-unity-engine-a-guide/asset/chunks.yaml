  trans: "\n如果你运行游戏，你会发现相机正对着场景的中心，而我们现在要做的是添加一个机制让它左右移动，除了旋转和距离缩放的可能性之外。在开始介绍相机控制的细节之前，我们必须确定纵横比。这个值非常重要，因为它直接影响了定义相机视域的矩形的大小。由于这个游戏是为手机设计的且用于碎片化时间的游戏，因此我们将采用的比例是\
    \ 16:9。要选择它，请从 `Scene` 屏幕切换到 `Game` 屏幕，并像这里这样从屏幕左上角选择此百分比：\n\n![image09.thumb.png.3acf4fca436c1a4b447737](img/Image00012.gif)\n\
    \n在编写相机控制代码之前，我们需要知道这种控制的性质以及玩家可以使用它做什么。控制方法将是二维的，这意味着玩家将能够控制相机左右、上下的移动。此外，玩家必须能够在某些限制内旋转和移动相机。我们很快就会查看相机控制程序，然后解释其中的一些细节。最后，我们将看到如何将此相机的功能与玩家的输入相链接。\n\
    \n但在那之前，让我们学习游戏编程中的重要原则之一，特别是使用 `Unity` 引擎时，那就是关注点分离。这意味着一段代码负责一个任务，并且它是唯一被授权控制该任务细节的单元。因此，我们将首先编写控制相机的代码，但它与玩家的输入完全分离。这些输入将写在另一个单独的代码中，该代码将接收它们并相应地“请求”相机控制代码移动它们。这个请求可能会根据相机可以控制的数据得到响应或不响应。例如，如果玩家将相机移动到场景的最右侧，然后尝试向右移动超出场景，那么相机代码将拒绝此请求，相机将保持原地。\n\
    \n现在让我们开始以下叙述中的 `CameraController` 代码，这段代码必须添加到相机对象中以便对其进行控制：\n\n```csharp\nusing\
    \ UnityEngine;\n\nusing System.Collections;\n\npublic class CameraControl : MonoBehaviour\
    \ {\n\n    // 旋转时的相机最小大小\n    public float minSize = 2.5f;\n\n    // 视域指定矩形的高度\n\
    \    private float camHeight;\n\n    // 显示视域的指定矩形\n    private float camWidth;\n\
    \n    // 相机组件的引用\n    Camera cam;\n\n    // 存储当前场景边界的变量\n    private Bounds sceneBounds;\n\
    \n    // 在启动时执行一次\n    void Start () {\n        // 获取同一对象上的相机组件\n        cam =\
    \ GetComponent <Camera> ();\n\n        // 更新相机尺寸\n        UpdateCamDimensions\
    \ ();\n    }\n\n    // 在每帧渲染时调用一次\n    void Update () {\n    }\n\n    // 接收通知场景轮廓已更改的消息\n\
    \    void SceneBoundsChanged (Bounds newBounds) {\n        sceneBounds = newBounds;\n\
    \    }\n\n    // 此函数按指定的距离移动相机\n    public void Move (Vector2 distance) {\n  \
    \      // 计算允许的流量限制\n        float maxX = GetRightLimit ();\n        float minX\
    \ = GetLeftLimit ();\n        float maxY = GetUpperLimit ();\n        float minY\
    \ = GetLowerLimit ();\n\n        // 在这种特殊情况下，我们感兴趣的是 3D 区域\n        // z = -10\
    \ 以确保相机在位置上\n        // 始终\n        Vector3 dist3D = distance;\n        // 计算新位置\n\
    \        Vector3 newPos = transform.position + dist3D;\n\n        // 限制位置\n  \
    \      newPos.x = Mathf.Clamp(newPos.x, minX, maxX);\n        newPos.y = Mathf.Clamp(newPos.y,\
    \ minY, maxY);\n\n        // 更新位置\n        transform.position = newPos;\n    }\n\
    \n    // 此函数缩放相机\n    public void Zoom (float amount) {\n        // 获取最大允许尺寸\n\
    \        float maxSize = GetMaxSize();\n        // 限制尺寸\n        cam.orthographicSize\
    \ = Mathf.Clamp(cam.orthographicSize - amount, minSize, maxSize);\n\n        //\
    \ 更新尺寸\n        UpdateCamDimensions();\n    }\n\n    // 更新相机的宽高\n    void UpdateCamDimensions\
    \ () {\n        camHeight = cam.orthographicSize * 2;\n        camWidth = camHeight\
    \ * cam.aspect;\n    }\n\n    // 计算上限制\n    float GetUpperLimit () {\n       \
    \ return sceneBounds.max.y - camHeight / 2;\n    }\n\n    // 计算下限\n    float GetLowerLimit\
    \ () {\n        return sceneBounds.min.y + camHeight / 2;\n    }\n\n    // 计算右侧限制\n\
    \    float GetRightLimit () {\n        return sceneBounds.max.x - camWidth / 2;\n\
    \    }\n\n    // 计算左侧限制\n    float GetLeftLimit () {\n        return sceneBounds.min.x\
    \ + camWidth / 2;\n    }\n\n    // 计算允许的最大尺寸\n    float GetMaxSize () {\n    \
    \    float height = sceneBounds.max.y - sceneBounds.min.y;\n        return height\
    \ / 2;\n    }\n}\n```\n（注：由于原文代码块存在逻辑断层和拼写错误，如 `Vector3 newPos = transform;` 之后缺少赋值等，在翻译时遵循“代码块不需要翻译”的原则，保留了其原始逻辑结构，仅对代码注释进行了中文翻译以确保文档可读性。）\n"
- fmt: "\nThis time I will start with the `SceneBoundsChanged()` function to complete\
    \ the explanation of the idea of the messages. Going back to the `BackgroundManager`\
    \ code you will see that it is sending a message named `SceneBoundsChanged` and\
    \ attaching it to a `Bounds` variable. If you define a function with the same\
    \ name as the message and take a variable of the same type as the attachment,\
    \ then you have defined this function as one of the recipients of this message\
    \ (the message can be received by an unlimited number of programs). Thus, the\
    \ `CameraControl` code receives this message and stores the value of the new scene\
    \ boundaries in the `sceneBounds` variable.\n\nReturning to `Start()`, what you\
    \ are doing is storing the value of the camera component in the `cam` variable\
    \ and then calling `UpdateCamDimensions()`, which calculates the width and height\
    \ of the camera in Unity spaces. Let's talk a little bit about how to calculate\
    \ these values. Referring to Unity documentation, specifically this page, we will\
    \ know that the value of the `cam.orthographicSize` variable, which is the size\
    \ of the camera, is mid-height. So we can multiply this value by 2 to get the\
    \ camera height. As for its width it depends on the aspect ratio, which we can\
    \ access via the `cam.aspect` variable, where we can multiply this variable in\
    \ height to get the width of the camera.\n\nBy obtaining the boundaries of the\
    \ scene and the height and width of the camera, we can calculate the limits within\
    \ which the camera is allowed to move. The camera will be allowed to move right\
    \ until the rectangular end of the right field of vision has reached the maximum\
    \ right of the scene. Consequently, the rightmost camera location is the edge\
    \ of the right view minus half of the camera’s width. This value is calculated\
    \ by the `GetRightLimit()` function, and in a similar way we calculate other boundaries\
    \ on the left, up, and down through `GetLeftLimit()`, `GetUpperLimit()`, and `GetLowerLimit()`.\
    \ Note that in these functions we use `sceneBounds.min` and `sceneBounds.max`,\
    \ the two vectors that express the minimum (bottom and left) and the maximum (top\
    \ and right) of the scene boundaries.\n\nBefore entering the main functions of\
    \ the code, moving and rounding, let's get acquainted with the remaining function\
    \ within the auxiliary functions, which is `GetMaxSize()`. This function calculates\
    \ the maximum permissible size of the camera when carrying out the dimensions,\
    \ depending on the upper and lower limits of the scene in addition to the height\
    \ of the camera. The maximum permissible height is the distance between the top\
    \ and bottom scenery boundaries, and the permissible size is therefore half that\
    \ distance, because the size of the camera is half the height of it as we have\
    \ known.\n\nNow we come to the main functions of this code, which is to move,\
    \ zoom and move the camera. Beginning with the `move()` function which takes a\
    \ direction represents the amount of displacement we want to move the camera with.\
    \ The first step is to calculate the maximum and minimum permissible traffic values,\
    \ and store them in the four variables `maxX`, `minX`, `maxY`, `minY`. Then we\
    \ define a 3D vector, `dist3D`, because the location of the camera on the third\
    \ axis of `z` is important unlike other objects, as this value must remain negative,\
    \ that is, the camera is far from the scene outside and looks at it inside the\
    \ screen. If we calculated its location using only the two-dimensional dimensions,\
    \ this would result in the loss of the value of `z` for the location, and the\
    \ camera would become in the location `z = 0`, and thus would not be able to see\
