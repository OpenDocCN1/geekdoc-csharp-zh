    如果我们想更详细地讨论程序员在游戏行业中的角色，我们会发现即使在编程层面，也有几个必须承担的职责：有图形编程、输入系统、资源导入系统、人工智能、物理模拟，以及如音频库和辅助工具等。正如我之前提到的，所有这些任务都可以以复用软件模块的形式完成，因此这些单元共同构成了所谓的“游戏引擎”。通过使用由这些部分组成的引擎和软件库，你减少了构建
    `I / O system`、模拟物理效果甚至实现部分人工智能所需要的精力。剩下的工作就是编写你自己的游戏逻辑，并创建出使其与其他游戏区别开来的特性。最后一点是接下来的系列课程的核心，尽管与开发整个游戏相比，这项任务看起来很小，但正如我们将看到的，正是因为它的微小，才需要在设计和实现上投入大量的精力。


    # 开始 Unity 引擎的快速步骤


    如果你之前没有该引擎的经验，可以阅读这篇快速介绍；如果你以前处理过该引擎，可以跳过它。我不会详细阐述这些步骤，因为有很多课程（无论是阿拉伯语还是英语）可以供你参考，但我们在这里是为了确保每个系列内容的读者在开始前具有相同的初始知识水平。


    ## 第一步：下载并安装引擎


    要下载最新版本的引擎（版本为 `19`），请直接访问网站 `http://unity3d.com`，然后根据你正在使用的操作系统下载相应的版本。请注意，引擎的免费版本具有巨大的潜力，并且满足我们本系列课程项目的需求。


    ## 第二步：创建项目


    引擎安装并运行后，将出现启动界面，点击 `New Project` 显示如图像所示的界面。你只需要选择类型 `2D`，然后选择你将创建的新项目的名称和存储位置，最后点击
    `Create Project`。


    1. 名称默认为 `New Unity Project`，但你可以将其更改为任何你。在 `Project name` 字段中输入你想要给项目起的名称。

    2. `location` 默认是你电脑上的主目录文件夹，但你可以更改它。或者：(a) 在 `Location` 字段中输入你想在电脑上存储项目的位置。或者：(b)
    点击蓝色三个点 `...`。这将打开你电脑的 `Finder (Mac OS X)` 或 `文件资源管理器 (Windows OS)`。

    3. 然后，在 `Finder` 或文件资源管理器中，选择你想要存储新项目的文件夹，并选择“Choose”。

    4. 为你的项目类型选择 `3D` 或 `2D`。默认是 `3D`，显示为红色表示已选中。（`2D` 选项会将 Unity 编辑器设置为显示 2D 功能，而
    `3D` 选项显示 3D 功能。如果你不确定选哪一个，请保持为 `3D`；你以后可以更改此设置。）

    5. 有一个选项可以选择 `Asset packages...` 来包含在项目中。资源包是预制的内容，如图像、样式、光照效果和游戏角色控制等等许多实用的游戏创建工具和内容。这里提供的资源包是免费的，与
    Unity 捆绑，你可以使用它们来开始项目。或者：如果你现在不想导入这些捆绑资产，或者不确定，只需忽略此选项；你以后可以通过 Unity 编辑器添加这些以及许多其他资产。或者：如果你现在想导入这些捆绑资产，选择
    `Asset packages...` 显示可用资产列表，勾选你需要的项，然后点击 `Done`。

    6. 现在选择 `Create project`，你就大功成了！


    ## 第三步：了解主程序窗口


    起初 Unity 中有 4 个主要窗口。以下是其功能的总结：


    - **Scene Window（场景窗口）**：用于构建游戏场景，向其中添加不同的对象并在 2D 空间中进行布局。该窗口最初只包含一个对象，即相机。

    - **Hierarchy（层级）**：包含一个树形结构，包含了所有已添加到场景的对象，帮助你组织它们之间的关系，因为可以将对象作为其他对象的子，子对象受到父对象的影响（正如我们将看到的）。该窗口最初只包含一个对象，即相机。

    - **Project Browser（项目浏览器）**：显示项目文件夹内的所有文件，无论是否已添加到场景。项目最初包含一个名为 `Assets` 的文件夹，我们将其中添加所有其他文件和文件夹。

    - **Inspector Properties Window（检查器属性窗口）**：当从场景层级、场景窗口或项目浏览器中选择任何对象时，它的属性将显示在此窗口中，你可以从那里进行更改。


    在本次介绍中，我们回顾了 `Unity3D` 界面初看起来的内容，并对游戏行业进行了简单介绍。


    '
- fmt: '

    By changing the filter type to `Trilinear` and coordinating colors to `Truecolor`,
    we ask Unity not to compress these images so that they remain at their original
    size and maintain their quality. Although compression is better for performance,
    you will notice that Unity tells you that most of these graphics are not compressible
    because they do not achieve the rule that length and width are equal to logarithmic
    numbers of base 2 (for example `64`, `128`, `512`, etc.). Don''t forget to click
    `Apply` to save the changes after they are done.


    ## Scene building and background processing


    After changing the properties of all the graphics we imported, we can start preparing
    the scene. The first step will be to add the background and floor on which the
    game will revolve. An important specification of the import process is the `Pixels
    Per Unit`. The number `100` here means that a `100`-pixel streak in the original
    image covers a distance of one unit in the Unity space. If you assume that the
    unit is one meter, a box size of `10 x 10` pixels equals a box of `10 x 10` cm
    in the game space. Fortunately for us, the set of images that we imported are
    suitable for each other, for example, monster images are `70 x 70` pixels while
    the backgrounds are much larger and reach `1024 x 1024` pixels.


    Let''s consider from the beginning that this series is not only for learning programming
    games, it is not only for learning the Unity engine, but you can also say that
    it will also teach you the best programming and organizational practices for the
    scene to get the best result with this engine. For this we will prepare the scene
    of the game in a special way so that the scene contains one object we call the
    root object of the scene `SceneRoot` and then we will add all elements of the
    scene in the form of children and grandchildren of this object. To add a new object,
    simply select the menu:


    `Game Object > Create Empty`


    The new object will then appear in the scene hierarchy as `GameObject`, choose
    it and change its name to `SceneRoot` and its location to the point of origin
    `(0, 0)`. As mentioned in the introduction to this chapter, you can change these
    values from the `Inspector Properties` window as shown in the image below. Note
    that this object is "empty" as its name indicates, meaning that it is only in
    memory and cannot be seen in the scene even though it is in the middle of it,
    we will come to these details according to our need for it.


    Then we will add another blank object to represent the background of the scene,
    all you have to do is click the right mouse button on the `SceneRoot` object in
    the hierarchy and choose `Create Empty` in order to add a sub-object (son) to
    the root object and name it `Background`. Finally you have to drag the `Main Camera`
    object into the root object so that the scene hierarchy is like this.


    ![image03.thumb.png.f62d7a6648ae0ddd366ff5](OEBPS/Image00006.gif)


    Now is the time to save the scene that we are working on, as is the case in 99%
    of the programs you can save via `Control + S`, which is a matter of saving the
    scene and not saving the entire project, as the project is only a set of files
    that can be modified and saved separately. Create a new folder inside `Assets`
    and name it `Scenes` and then save the scene inside with the name `GameScene`.


    Let''s agree from now that we''ll be building one scene for the whole game, and
    we''re going to change both the background, the floor and the object locations
    to make different stages. The first object will be the scene background, for which
    there are several images that can be used. These `8` images are in the `Backgrounds`
    folder of the first set of photos as you see in the image below. What distinguishes
    these background images is that each of them applies its right side to the left
    side completely, which makes us able to repeat it horizontally in succession without
    the player noticing that there are limits between them.


    ![image04.thumb.png.6d31b24b5ddfa8d97a71b](OEBPS/Image00007.gif)


    Since we are dealing with a game with a casual scene, we have to repeat the background
    more than once horizontally, and be 4 times. Before we start adding backgrounds
    to the scene, let''s make it easier for ourselves to make the pivot for all background
    images the left side of the image instead of the middle, as you see in the following
    image:


    ![image05.thumb.png.4ba765d2e5601aa1c69c57](OEBPS/Image00008.gif)


    But what does it mean if the focal point of the image is its left side, not its
    center? The two pictures below answer this question.


    In both cases, the location of the image has not changed, which is `(0, 0)`, i.e.
    in the middle of the scene. In the default position (left image), the anchor of
    the image is in the middle of it, that is, the position of the image in space
    is the middle of it, and the left and right sides of the image extend between
    the points `x = -5.12` and `x = + 5.12`. In the second case, we changed the anchor
    to the far left side of the image horizontally while remaining in the middle vertically.
    This way, the image runs from the point `x = 0` left to the point `x = + 10.24`
    right. Note that the values of these points are consistent with the fact that
    one unit = `100` pixels where the width of the image in units is `10.24`.


    With this, we can compute the four image locations that we will stack next to
    each other around the point of origin, as follows:


    - The image on the far left will be at `20.48-` and it extends to `10.24-`.

    - The image to the left of the origin will be at `10.24-` and extends to `0.0`.

    - The image to the right of the point of origin will be at `0.0` and extend to
    `10.24+`.

    - The image on the far right will be at `10.24+` and `20.48+`.


    Instead of manually placing this image, we will write a script so that we give
    it an image and ask it to repeat it a number of times to create the background
    for us. This applet will work as follows: We will give it all the background images
    we have in the form of a matrix so that each image has its own number, in addition
    to that we will be able to provide it with the number of repetitions required
    for the image in order to draw the background. When running the game, we must
    choose the background number that we want to appear on the screen, and this number
    will be from 0 to 7. We will return to this applet theme shortly.


    Before going into details I would like to point out that the objects in the Unity
    engine are all similar, and they are in their original empty position invisible,
    and what distinguishes each object from others and gives it its own characteristics
    is the set of components that are added to it. The only component in the empty
    object is `Transform`, which is found in all engine objects without exception,
    as it gives the object its location, rotation and size in the two-dimensional
    (or three-dimensional) space in addition to that it determines its relationships
    with other objects such as the father and sons relationship that we see in the
    hierarchy of the scene. Based on this fact, what you see in the `Inspector properties`
    screen when you choose any object is the set of components added to it.

    '
