    \ * speedFactor;\n\n}\n\n}\n```\n\nThe second type of special attacks as we mentioned\
    \ is a fissile attack, which leads to the fragmentation of the projectile into\
    \ smaller projectiles (fragments), which in turn scatter over a relatively large\
    \ area. Before moving to the programmer for this attack, we note that its implementation\
    \ will need to create new objects, fragments that will be scattered by the implementation\
    \ of the attack. This means that we will need to build molds for these fragments,\
    \ and there will be two molds specifically: one for elephant extruded fragments\
    \ and the other for giraffe extruded fragments. I will call these two templates\
    \ `ElephantCluster` and `GiraffeCluster`, which are virtually the same in everything\
    \ except the image shown. These two molds are simple, each carrying the original\
    \ projectile image with the object scaled down to 0.75 on the x and y axes to\
    \ make the fragments smaller than the original projectile. In addition, we will\
    \ add a `Rigid Body 2D` rigid component and a `Circle Collider 2D` collision component,\
    \ making the fragment molds ready.\n\nThe applet that will implement this type\
    \ of attack is called `ClusterAttack` and is described in the following narrative:\n\
    \n```cs\nusing UnityEngine;\n\nusing System.Collections;\n\npublic class ClusterAttack:\
    \ MonoBehaviour {\n\n    // template that will be used to create fragments\n \
    \   public GameObject clusterPrefab;\n\n    // The number of seconds each fragment\
    \ will live before being destroyed and removed from the scene\n    public float\
    \ clusterLife = 4.0f;\n\n    // How many fragments will be produced from this\
    \ projectile\n    public int clusterCount = 3;\n\n    // Called once at startup\n\
    \    void Start () {\n\n    }\n\n    // Called once when rendering each frame\n\
    \    void Update () {\n\n    }\n\n    // Consequently implements the DoSpecialAttack\
    \ fission attack to receive the message\n    public void DoSpecialAttack ()\n\
    \    {\n        // Bring the current speed of the original projectile\n      \
    \  Rigidbody2D myRB = GetComponent <Rigidbody2D>();\n        float originalVelocity\
    \ = myRB.velocity.magnitude;\n        // Store all the collision components of\
    \ the fragments in this array\n        Collider2D [] colliders = new Collider2D\
    \ [clusterCount];\n        Collider2D myCollider = GetComponent <Collider2D>();\n\
    \        for (int i = 0; i <clusterCount; i ++)\n        {\n            // Create\
    \ a new fragment\n            GameObject cluster = (GameObject) Instantiate (clusterPrefab);\n\
    \            // Set the location, name, and father of the splint object\n    \
    \        cluster.transform.parent = transform.parent;\n            cluster.name\
    \ = name + \"_cluster_\" + i;\n            cluster.transform.position = transform.position;\n\
    \            // Store the fragment collision component at the current location\
    \ in the array\n            colliders [i] = cluster.GetComponent <Collider2D>();\n\
    \            // Neglect the collision that can occur between this fragment and\
    \ the fragments created before it\n            // In addition to the collision\
    \ that can occur between the fragment and the original object\n            Physics2D.IgnoreCollision\
    \ (colliders [i], myCollider);\n            for (int a = 0; a <i; a ++)\n    \
    \        {\n                Physics2D.IgnoreCollision (colliders [i], colliders\
    \ [a]);\n            }\n            Vector2 clusterVelocity;\n            // With\
    \ each new fragment we reduce the vehicle horizontally and increase it vertically\
    \ order to ensure fragmentation\n            clusterVelocity.x = (originalVelocity\
    \ / clusterCount) * (clusterCount - i);\n            clusterVelocity.y = (originalVelocity\
    \ / clusterCount) * -i;\n            // Bring a solid body to the new splinter\n\
    \            Rigidbody2D clusterRB = cluster.GetComponent <Rigidbody2D>();\n \
    \           clusterRB.velocity = clusterVelocity;\n            // Select the fragment\
    \ block to equal the mass of the original object\n            clusterRB.mass =\
    \ myRB.mass;\n            // Destroy the splinter after its age has passed\n \
    \           Destroy (cluster, clusterLife);\n        }\n        // Finally destroy\
    \ the original projectile\n        Destroy (gameObject);\n    }\n}\n```\n\nThe\
    \ idea of doing this attack is to receive the `DoSpecialAttack` message and then\
    \ create the specified number of fragments using the specified template. In order\
    \ to prevent collisions between fragments and some of them and also between fragments\
    \ and the original projectile - where a collision can occur the moment before\
    \ it is deleted from the scene - we use the `Physics2D.IgnoreCollision ()` function\
    \ and provide it with the two collision components that we want to ignore between.\
    \ Note that we knew a matrix of collision components in order to store the components\
    \ of all fragments, and when creating a new fragment we pass on the components\
    \ of the previous fragments and call the function mentioned between the old and\
    \ new components in order to negate the collisions. The next step is the speed\
    \ of the splinter motion, where we take the amount of the original projectile's\
    \ velocity and multiply it each time by a different value to get the horizontal\
    \ and vertical components of the new velocity. These two components change from\
    \ fragment to another, where the first fragment begins with a high horizontal\
    \ and low vertical, and then these values begin to change as the vertical value\
    \ increases downward and the horizontal decreases, resulting in the dispersion\
    \ of projectiles in a manner similar to what you see in the picture below (I have\
    \ in this picture Increase the number of fragments to clarify the idea):\n\n![](OEBPS/Image0037.gif)\n\
    \nNote that the fragments spread apart from the original projectile fission site.\
    \ Then we adjust the mass of each fragment to equal the mass of the original projectile.\
    \ While it is logical to divide the mass by the number of fragments in order to\
    \ distribute them evenly, copying the original mass of all fragments will give\
    \ them greater destruction power, giving the special attack its preferred advantage.\n\
    \n## Ejector industry\n\nLet us now turn to the ejector, a slingshot that will\
    \ launch these projectiles towards its targets. Unfortunately, our graphics package\
    \ does not contain a slingshot image, so we will try to use some wooden and metal\
    \ shapes to create a simple shape that looks like it. Here I will use three wooden\
    \ rectangles and a stone triangle to make the shape you see in the following picture.\
    \ These objects must be placed as sons of one empty object containing all of them,\
    \ and the `Order in Layer` value in the `Sprite Renderer` component of the triangle\
    \ must also be adjusted and made 1, so that it appears in front of the pieces\
    \ as shown in the picture:\n\n![](OEBPS/Image0038.gif)\n\nIn addition to the four\
    \ images we have scaled and rotated to make a slingshot, there are 3 blank objects\
    \ that indicate colored lines to their locations. These empty objects have a software\
    \ utility that we will see shortly. The `LaunchPos` object represents where the\
    \ projectile is placed before it is launched, and the `RightEnd` and `LeftEnd`\
    \ objects represent the locations of the ends of the rubber band that will push\
    \ the projectiles when they are launched. The slingshot in its current form is\
    \ ready to make the initial version of the mold, to which we will add some applets\
    \ and other components to it.\n\nThe first of these is the main applet that launches\
    \ projectiles at targets. Let's get to know this applet called `Launcher` in the\
    \ following narrative and then discuss the details of its functions:\n\n```cs\n\
    using UnityEngine;\n\nusing System.Collections;\n\npublic class Launcher: MonoBehaviour\
    \ {\n\n    // The launch force coefficient of this ejector\n    public float launchForce\
    \ = 1.0f;\n}\n```\n"
