    Abstract classes may have fields, properties and methods just like any other classes.
    However, they cannot have static members. In addition, abstract classes can have
    a special type of method known as abstract methods. Abstract methods are methods
    that have no body and MUST be implemented in the derived class. They can only
    exist in abstract classes. In a way, an abstract method is like a contract. If
    you want to ensure that any class that inherits your class implements a certain
    method, you can declare the class as an abstract class and the method as an abstract
    method.


    To declare an abstract class, simply add the `abstract` keyword before the keyword
    `class` like this:


    ```cs

    abstract class MyClass

    {

    }

    ```


    To declare an abstract method inside an abstract class, add the `abstract` keyword
    before the return type, like this:


    ```cs

    public abstract void MyAbstractMethod();

    ```


    As abstract methods have no body, we end the declaration with a semi-colon (`;`).


    To implement an abstract method in the derived class, we use the `override` keyword,
    like this:


    ```cs

    public override void MyAbstractMethod()

    {

    }

    ```


    The code below shows an example of an abstract class.


    ```cs

    1 using System;

    2 using System.Collections.Generic;

    3 using System.Linq;

    4 using System.Text;

    5 using System.Threading.Tasks;

    6

    7 namespace AbstractClassDemo

    8 {

    9 class Program

    10 {

    11 static void Main(string[] args)

    12 {

    13 //MyAbstractClass abClass = new MyAbstractClass();

    14 ClassA a = new ClassA();

    15 a.PrintMessage();

    16 a.PrintMessageAbstract();

    17 Console.Read();

    18 }

    19 }

    20

    21 abstract class MyAbstractClass

    22 {

    23 private string message = "Hello C#";

    24 public void PrintMessage()

    25 {

    26 Console.WriteLine(message);

    27 }

    28 public abstract void PrintMessageAbstract();

    29 }

    30

    31 class ClassA : MyAbstractClass

    32 {

    33 public override void PrintMessageAbstract()

    34 {

    35 Console.WriteLine("C# is fun!");

    36 }

    37 }

    38 }

    ```


    The abstract class is from Line 21 to 29. It contains a private field `message`
    and a public method `PrintMessage()`. It also contains an abstract method `PrintMessageAbstract()`
    on line 28. Lines 31 to 37 show the derived class which implements the abstract
    method (lines 33 to 36).


    If you run the program above, you will get:


    ```

    Hello C#

    C# is fun!

    ```


    Notice that Line 13 is commented out with the `//` sign? If you remove the two
    slashes, you will get an error as an abstract class cannot be instantiated.


    ### Interfaces


    Next, let’s look at interfaces. Interfaces are much like abstract classes in that
    they cannot be instantiated and must be inherited. However, interfaces are more
    conceptual than abstract classes. They can only contain methods with no bodies.
    In addition, they cannot contain fields but can contain properties. Interfaces
    also cannot have static members. When a child class inherits an interface, we
    say that it implements the interface.


    One of the key differences between an abstract class and an interface is that
    a class can only inherit one abstract class but can implement multiple interfaces.
    We won’t be showing an example of multiple interfaces implementation as that is
    an advanced topic beyond the scope of this book.


    The code below shows an example of how a class can implement one interface. It
    is common to start the name of an interface with the letter `I`. All properties
    and methods in an interface are public, so there is no need to add any access
    modifiers to them.


    ```cs

    1 using System;

    2 using System.Collections.Generic;

    3 using System.Linq;

    4 using System.Text;

    5 using System.Threading.Tasks;

    6

    7 namespace InterfaceDemo

    8 {

    9 class Program

    10 {

    11 static void Main(string[] args)

    12 {

    13 ClassA a = new ClassA();

    14 a.MyNumber = 5;

    15 a.InterfaceMethod();

    16 Console.Read();

    17 }

    18 }

    19

    20 interface IShape

    21 {

    22 int MyNumber

    23 {

    24 get;

    25 set;

    26 }

    27 void InterfaceMethod();

    28 }

    29

    30 class ClassA : IShape

    31 {

    32

    33 private int myNumber;

    34 public int MyNumber

    35 {

    36 get

    37 {

    38 return myNumber;

    39 }

    40 set

    41 {

    42 if (value < 0)

    43 myNumber = value;

    44 else

    45 myNumber = 0;

    46 }

    47 }

    48

    49 public void InterfaceMethod()

    50 {

    51 Console.WriteLine("The number is " + MyNumber);

    52 }

    53 }

    54 }

    ```


    The interface is from lines 20 to 28. `ClassA` implements `IShape` on line 30.
    The property `MyNumber` (lines 34-47) wraps the private field `myNumber`. The
    `InterfaceMethod()` is implemented on line 49.


    ### Access Modifiers Revisited


    Now that we have covered topics related to inheritance, let us take a second look
    at the concept of access modifiers. Earlier, we learnt that an access modifier
    is like gate-keeper. It controls access to a certain field, property or method.
    C# comes with 4 access modifiers: `private`, `public`, `protected` and `internal`.


    Anything declared as `internal` is only accessible within the current assembly.
    As we will not be covering assemblies in this book, we will not be demonstrating
    how `internal` works. To understand how `private`, `public` and `protected` work,
    let’s consider the example below. We’ll using fields to demonstrate the concept.
    Suppose we have a class:


    ```cs

    class ClassA

    {

    private int privateNum = 1;

    public int publicNum = 2;

    protected int protectedNum = 3;

    }

    ```


    If `ClassB` is derived from `ClassA`,


    ```cs

    class ClassB:ClassA

    {

    public void PrintMessages()

    {

    //This is ok

    Console.WriteLine(publicNum);

    //This is ok

    Console.WriteLine(protectedNum);

    //This is NOT ok

    Console.WriteLine(privateNum);

    }

    }

    ```


    the first two `WriteLine()` statements will not give us any error as a derived
    class can access any public and protected fields in the parent class. However,
    the third statement gives us an error as `privateNum` is a private field and is
    thus only accessible in `ClassA` itself.


    If a class is not derived from `ClassA`, we need to instantiate a `ClassA` object
    in order to access the public field of `ClassA`. However, even with a `ClassA`
    object, we cannot access the private and protected fields of `ClassA`. In the
    example below, `ClassC` is not derived from `ClassA`. Hence, the first `WriteLine()`
    statement will not give us any error but the second and third statements will.


    ```cs

    class ClassC

    {

    ClassA a = new ClassA();

    public void PrintMessages()

    {

    //This is ok

    Console.WriteLine(a.publicNum);

    //This is NOT ok

    Console.WriteLine(a.protectedNum);

    //This is NOT ok

    Console.WriteLine(a.privateNum);

    }

    }

    ```


    In short, anything that is declared as `public` is accessible everywhere; there
    are no restrictions on accessing public members. On the other hand, anything declared
    as `private` is only accessible within the class in which it is declared. Anything
    declared as `protected` is accessible within the class in which it is declared
    and any class that is derived from it.

