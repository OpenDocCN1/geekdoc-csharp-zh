    ## The Admin : Staff Class


    The next class is the `Admin` class which is also derived from the `Staff` class.


    ### Fields

    The `Admin` class has two `private const` fields: `overtimeRate` and `adminHourlyRate`.
    Both fields are of `float` type. Try declaring these two fields and initializing
    them with the values 15.5 and 30 respectively.


    ### Property

    Next, try declaring a `public` auto-implemented property, `Overtime`.


    `Overtime` is of `float` type and has a `private` setter.


    ### Constructor

    Now, let’s declare the constructor. Similar to the constructor of the `Manager`
    class, the constructor of the `Admin` class is `public` and has one `string` parameter,
    `name`. Its job is to simply call the base constructor and pass the parameter
    `name` and the field `adminHourlyRate` to the base constructor.


    ### Method

    Finally, we are ready to code the `CalculatePay()` method for the `Admin` class.
    The `CalculatePay()` method in the `Admin` class is very similar to the method
    in the `Manager` class. Let’s first declare the method.


    Next, within the curly braces, we use the `CalculatePay()` method of the base
    class to set the `BasicPay` and `TotalPay` properties of an admin staff.


    After setting the values of these two properties, we check if `HoursWorked` is
    greater than 160. If it is, we’ll update the value of the `TotalPay` property.


    Suppose an admin staff is paid an overtime pay on top of the basic pay if he/she
    worked more than 160 hours. Try using an `if` statement to update the `TotalPay`
    property of an admin staff.


    The overtime pay is calculated with the following formula:


    ```

    Overtime = overtimeRate * (HoursWorked - 160);

    ```


    where `overtimeRate` is a `private` field in the `Admin` class and `Overtime`
    is a property in the same class. `HoursWorked` is a property inherited from the
    `Staff` class.


    Done?


    Great! Now, go on to code the `ToString()` method. With that, the `Admin` class
    is complete. The table below shows a summary of the class.


