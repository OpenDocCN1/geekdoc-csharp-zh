  trans: "\n\n在我们实例化 `StreamWriter` 对象后，可以像下面所示使用 `WriteLine()` 方法开始向文件写入内容：\n\n```\n\
    sw.WriteLine(“It is easy to write to a file.”);\n```\n\n在我们完成文件写入后，必须通过写入以下代码来关闭文件：\n\
    \n```csharp\nsw.Close();\n```\n\n注意，当您写入文本文件时，将代码封装在 `using` 语句中也是良好的做法。下面的代码展示了这些内容如何结合在一起的完整示例。\n\
    \n```csharp\nusing System;\nusing System.Collections.Generic;\nusing System.Linq;\n\
    using System.Text;\nusing System.Threading.Tasks;\nusing System.IO;\n\nnamespace\
    \ FileDemo\n{\n    class Program\n    {\n        static void Main(string[] args)\n\
    \        {\n            //声明文件的路径\n            string path = \"myfile.txt\";\n\
    \            //向文件写入内容\n            using(StreamWriter sw=new StreamWriter(path,\
    \ true))\n            {\n                sw.WriteLine(\"ABC\");\n            \
    \    sw.WriteLine(\"DEF\");\n                sw.Close();\n            }\n    \
    \        // 从文件中读取\n            if (File.Exists(path))\n            {\n      \
    \          using(StreamReader sr=new StreamReader(path))\n                {\n\
    \                    while (!sr.EndOfStream)\n                    {\n        \
    \                Console.WriteLine(sr.ReadLine());\n                    }\n  \
    \                  sr.Close();\n                }\n            }\n           \
    \ Console.Read();\n        }\n    }\n}\n```\n\n在这个示例中，我们在写入文件时选择了将数据追加到文件中。当你第一次运行此程序时，你将得到：\n\
    \n`ABC`\n`EFG`\n\n作为文件输出和屏幕显示。如果你运行第二次，你将得到：\n\n`ABC`\n`EFG`\n`ABC`\n`EFG`\n\n\
    由于示例中没有给出“myfile.txt”的完整路径，文本文件将在与 `.exe` 文件相同的文件夹中创建，该文件夹位于 `FileDemo > FileDemo\
    \ > Debug > Bin` 文件夹。\n\n# 项目 – 一个简单的薪资软件\n\n## 恭喜！\n\n我们现在已经完成了 C# 的核心概念。在最后一个章节中，我们将通过编写一个完整的控制台应用程序来生成一家小公司的工资单，以此开始实践。准备好了吗？\n\
    \n## 概述\n\n首先，让我们创建一个新的控制台应用程序并命名为 `CSProject`。该应用程序由下面的六个类组成：\n\n* `Staff`\n\
    * `Manager : Staff`\n* `Admin : Staff`\n* `FileReader`\n* `PaySlip`\n* `Program`\n\
    \n`Staff` 类包含公司中每位员工的信息。它还包含一个名为 `CalculatePay()` 的虚拟方法，用于计算每位员工的薪资。\n\n`Manager`\
    \ 和 `Admin` 类继承自 `Staff` 类并重写了 `CalculatePay()` 方法。\n\n`FileReader` 类包含一个简单的方法，从\
    \ `.txt` 文件读取内容并根据 `.txt` 文件的内容创建 `Staff` 对象列表。\n\n`PaySlip` 类生成公司中每位员工的工资单。此外，它还会生成每月工作少于\
    \ 10 小时的员工的详情摘要。\n\n最后，`Program` 类包含 `Main()` 方法，该方法作为我们应用程序的主入口。\n\n## Staff\
    \ 类\n\n首先，让我们从 `Staff` 类开始。`Staff` 类包含了有关员工的基本信息，并提供了一个计算基本薪资的方法。它作为一个父类，另外两个类将派生自它。\n\
    \n### 字段\n\n该类有一个名为 `hourlyRate` 的 `private` `float` 字段和一个名为 `hWorked` 的 `private\
    \ int` 字段。尝试自己声明这些字段。\n\n### 属性\n\n接下来，为类声明三个 `public` 自动实现属性。这些属性是 `TotalPay`、`BasicPay`\
    \ 和 `NameOfStaff`。\n\n`TotalPay` 是一个 `float` 属性，有一个 `protected` setter。`BasicPay`\
    \ 是一个 `float` 属性，有一个 `private` setter。`NameOfStaff` 是一个 `string` 属性，有一个 `private`\
    \ setter。所有三个属性的 getter 都是 `public` 的。因此，你不需要为这些 getter 声明访问修饰符，因为它们的访问级别与属性相同。\n\
    \n除了这三个自动实现的方法外，`Staff` 类还有一个名为 `HoursWorked` 的 `public` 属性。该属性的备用字段是 `hWorked`\
    \ 字段。\n\n该属性有一个 getter，简单返回 `hWorked` 的值。setter 检查为 `HoursWorked` 设置的值是否大于 0。如果是，则将\
    \ `value` 赋值给 `hWorked`。如果不是，则将 0 赋值给 `hWorked`。尝试自己声明此属性。你可以参考第 7 章寻求帮助。\n\n\
    ### 构造函数\n\n`Staff` 类有一个带有两个参数的 `public` 构造函数：`name` (`string`）和 `rate` (`float`）。在构造函数内部，我们将这两个参数分别赋值给属性\
    \ `NameOfStaff` 和字段 `hourlyRate`。尝试自己编写这个构造函数。\n\n### 方法\n\n现在，让我们为该类编写方法。\n\n\
    首先，我们将编写一个名为 `CalculatePay()` 的虚拟方法。\n\n`CalculatePay()` 是 `public` 的，没有参数且没有返回值。该方法执行了三件事：\n\
    \n1. 首先，它在屏幕上打印“Calculating Pay…”。\n2. 接下来，它将 `hWorked*hourlyRate` 的值赋值给 `BasicPay`\
    \ 属性。\n3. 最后，它将 `BasicPay` 的值赋值给 `TotalPay` 属性。换句话说，BasicPay` 和 `TotalPay` 将具有相同。尝试自己编写这个方法。\n\
    \n最后，编写一个 `ToString()` 方法来显示 `Staff` 类字段和属性的值。这就是 `Staff` 类的全部内容。\n\n下表显示了 `Staff`\
    \ 类的摘要。\n\n| 类别 | 细节 |\n| :--- | :--- |\n| **字段 (Fields)** | `private float hourlyRate`<br>`private\
    \ int hWorked` (HoursWorked 的备用字段) |\n| **属性 (Properties)** | `public float TotalPay`<br>`public\
    \ float BasicPay`<br>`public string NameOfStaff`<br>`public int HoursWorked` |\n\
    | **构造函数 (Constructor)** | `public Staff(string name, float rate)` |\n| **方法 (Methods)**\
    \ | `public virtual void CalculatePay()`<br>`public override string ToString()`\
    \ |\n\n## Manager : Staff 类\n\n接下来，让我们编写 `Manager` 类。\n\n### 字段\n\n`Manager` 类是\
    \ `Staff` 类的子类。它有一个名为 `hourlyRate` 的 `private const` 字段，类型为 `float`。尝试声明此字段并将其初始化为\
    \ 50。\n\n### 属性\n\n`Manager` 还有一个名为 `Allowance` 的 `public` 自动实现属性。`Allowance`\
    \ 是 `int` 类型并有一个 `private` setter。尝试编写此属性。\n\n### 构造函数\n\n现在，让我们为 `Manager` 声明构造函数。`Manager`\
    \ 类有一个 `public` 构造函数，带有一个 `string` 参数 `name`。\n\n构造函数的任务是调用基构造函数并将参数 `name` 和字段\
