    We’ve now come to the most important part of the project – the `Program` class.
    The `Program` class only has one method – the `Main()` method.


    The Main() Method


    First, let us declare four local variables for the `Main()` method. The first
    is a list of `Staff` objects. We shall call this list `myStaff`. The next is a
    `FileReader` object called `fr`. The remaining two are `int` variables. Let’s
    call them `month` and `year` and initialize them to zero. Try declaring these
    local variables yourself.


