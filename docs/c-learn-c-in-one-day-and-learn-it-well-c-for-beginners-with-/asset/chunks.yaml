    ## Admin 类：Staff 类


    下一个类是 `Admin` 类，它也派自 `Staff` 类。


    ### 字段

    `Admin` 类有两个 `private const` 字段：`overtimeRate` 和 `adminHourlyRate`。这两个字段都是 `float`
    类型。尝试声明这两个字段并分别将它们初始化为 15.5 和 30。


    ### 属性

    接下来，尝试声明一个 `public` 自动实现属性 `Overtime`。


    `Overtime` 是 `float` 类型，并有一个 `private` 访问器。


    ### 构造函数

    现在，让我们声明构造函数。与 `Manager` 类的构造函数类似，`Admin` 类的构造函数是 `public` 的，并且有一个 `string` 类型参数
    `name`。它的工作简单地调用基构造函数，并将参数 `name` 和字段 `adminHourlyRate` 传递给基构造函数。


    ### 方法

    最后，我们准备好为 `Admin` 类编写 `CalculatePay()` 方法了。`Admin` 类中的 `CalculatePay()` 方法与 `Manager`
    类中的方法非常相似。让我们先声明方法。


    接下来，在大括号内，我们使用基类的 `CalculatePay()` 方法来设置管理员人员的 `BasicPay` 和 `TotalPay` 属性。


    在设置这两个属性的值后，我们检查 `HoursWorked` 是否大于 160。如果是，我们将更新 `TotalPay` 属性的值。


    假设如果管理员人员工作超过 160 小时，他们将在基本工资的基础上获得加班费。尝试使用 `if` 语句来更新管理员人员的 `TotalPay` 属性。


    加班费的计算公式如下：


    ```

    Overtime = overtimeRate * (HoursWorked - 160);

    ```


    其中 `overtimeRate` 是 `Admin` 类中的一个 `private` 字段，而 `Overtime` 是同类中的一个属性。`HoursWorked`
    是从 `Staff` 类继承的属性。


    完成了吗？


