    \n在我们的 `Staff` 类中，在 `private int hWorked;` 行之后添加以下代码：\n\n```csharp\npublic int\
    \ HoursWorked\n{\n    get\n    {\n        return hWorked;\n    }\n    set\n  \
    \  {\n        if (value > 0)\n            hWorked = value;\n        else\n   \
    \         hWorked = 0;\n    }\n}\n```\n\n我们将属性声明为：\n\n```csharp\npublic int HoursWorked\n\
    {\n}\n```\n\n访问修饰符为 `public`，因为我们希望其他类能够访问此属性。\n\n数据类型为 `int`，因为该属性被用于提供对私有 `int`\
    \ 字段 `hWorked` 的访问。`hWorked` 属性的支持字段（backing field）。\n\n属性的名称为 `HoursWorked`。我们通常对属性名称使用大驼命名法（PascalCasing）。\n\
    \n属性包含两个特殊方法，称为访问器（accessors）。第一个访问器是获取器（getter），第二个是设置器（setter）。\n\n基础获取器简单返回私有字段的值。因此，我们写道：\n\
    \n```csharp\nget\n{\n    return hWorked;\n}\n```\n\n其中 `return` 是一个关键字，`hWorked`\
    \ 是支持字段的名称。\n\n设置器设置私有字段的值。我们写道：\n\n```csharp\nset\n{\n    if (value > 0)\n  \
    \      hWorked = value;\n    else\n        hWorked = 0;\n}\n```\n\n`value` 在设置器内部使用时是一个关键字。它指的是当用户使用属性来设置私有字段的值时，赋值语句右侧的值。我们稍后会学习如何这样做。\n\
    \n在设置器内部，我们使用 `if` 语句进行了一个简单的检查。我们检查了 `value` 是否大于零。如果是，我们就将其赋值给 `hWorked`。否则，我们将\
    \ `hWorked` 设置为零。这个设置器演示了我们如何使用属性来控制可以赋值给私有字段的值。\n\n默认情况下，获取器和设置器的访问级别与属性本身相同（在本例中为\
    \ `public`）。因此，我们不需要显式指定它们。然而，如果你不希望设置器的访问级别与属性相同，可以将设置器声明为 `private`，这样其他类无法修改你的私有字段：\n\
    \n```csharp\nprivate set\n{\n}\n```\n\n那么，该属性在 `Staff` 类外部就是一个只读属性。它的值只能在 `Staff`\
    \ 类内部被设置。\n\n### 自动实现属性\n\n注意，在获取器和设置器不需要额外逻辑的情况下，C# 为我们提供了一种声明属性的简写形式。这被称为自动实现属性（auto-implemented\
    \ property）。\n\n要声明一个自动实现属性，我们写道：\n\n```csharp\npublic int HoursWorked { get;\
    \ set; }\n```\n\n这等同于：\n\n```csharp\nprivate int hWorked;\npublic int HoursWorked\n\
    {\n    get\n    {\n        return hWorked;\n    }\n    set\n    {\n        hWorked\
    \ = value;\n    }\n}\n```\n\n当你使用这种简写形式时，编译器将为你创建一个支持字段。如果你想让属性变成只读的，可以这样设置设置器：\n\
    \n```csharp\npublic int HoursWorked { get; }\n```\n\n### 方法\n\n接下来，让我们看看方法。方法是执行特定任务的代码块。让我们添加一个简单的方法：\n\
    \n```csharp\npublic void PrintMessage()\n{\n    Console.WriteLine(\"Calculating...\"\
    );\n}\n```\n\n`void` 关键字表示此方法不返回任何值。在这里我们使用 `public` 来声明方法的访问性。\n\n```csharp\n\
    public void PrintMessage()\n{\n    Console.WriteLine(\"Calculating...\");\n}\n\
    ```\n\n接下来，我们声明参数。参数是传递给方法的数据。让我们给方法添加一个简单的参数：\n\n```csharp\npublic void PrintMessage()\n\
    {\n    Console.WriteLine(\"Calculating...\");\n}\n```\n\n方法的名称是 `PrintMessage`。在我们向方法中添加参数后：\n\
    \n```csharp\npublic void PrintMessage()\n{\n    Console.WriteLine(\"Calculating...\"\
    );\n}\n```\n\n等待，上面的方法没有参数。让我们修复它：\n\n```csharp\npublic void PrintMessage()\n\
    {\n    Console.WriteLine(\"Calculating...\");\n}\n```\n\n实际上，让我们添加一个返回值的方法。方法通常至少有一个\
    \ return 语句。让我们看看下面的示例：\n\n```csharp\npublic int CalculatePay()\n{\n    int staffPay\
    \ = hWorked * hourlyRate;\n    return staffPay;\n}\n```\n\n`int` 关键字表示此方法返回一个整数值。\n\
    \n```csharp\npublic int CalculatePay()\n{\n    int staffPay = hWorked * hourlyRate;\n\
    \    return staffPay;\n}\n```\n\n在我们的示例中，如果 `hWorked` 大于零，程序将执行语句：\n\n```csharp\n\
    public int CalculatePay()\n{\n    int staffPay = hWorked * hourlyRate;\n    return\
    \ staffPay;\n}\n```\n\n返回值可以赋值给变量 `pay`。例如，如果 `hWorked` 为 10 且 `hourlyRate` 为\
    \ 20，我们可以使用语句：\n\n```csharp\nint pay = CalculatePay();\n```\n\n`pay` 的值将是 200。另一方面，如果\
    \ `hWorked` 小于等于零，程序将执行语句：\n\n```csharp\npublic int CalculatePay()\n{\n    int\
    \ staffPay = hWorked * hourlyRate;\n    return staffPay;\n}\n```\n\n等待，上面的代码没有处理零的情况。让我们修复它：\n\
    \n```csharp\npublic int CalculatePay()\n{\n    if (hWorked > 0)\n    {\n     \
    \   int staffPay = hWorked * hourlyRate;\n        return staffPay;\n    }\n  \
    \  else\n    {\n        return 0;\n    }\n}\n```\n\n在方法内部，我们使用 `if` 语句来确定方法应该返回什么结果。\n\
    \n```csharp\npublic int CalculatePay()\n{\n    if (hWorked > 0)\n    {\n     \
    \   int staffPay = hWorked * hourlyRate;\n        return staffPay;\n    }\n  \
    \  else\n    {\n        return 0;\n    }\n}\n```\n\n### 方法重载\n\n在 C#（以及大多数其他语言）中，你可以创建两个相同的方法，只要它们的签名不同。这被称为重载（overloading）。方法的签名指的是方法的名以及它所拥有的参数。\n\
    \n在之前的 `CalculatePay()` 方法下方添加以下方法：\n\n```csharp\npublic int CalculatePay(int\
    \ bonus, int allowance)\n{\n    PrintMessage();\n    if (hWorked > 0)\n    {\n\
    \        return hWorked * hourlyRate + bonus + allowance;\n    }\n    else\n \
    \   {\n        return 0;\n    }\n}\n```\n\n### ToString() 方法\n\n最后，在进入下一个节之前，我们需要再写一个方法——\
    \ `ToString()` 方法。\n\n"
- fmt: "\nThe `ToString()` method is a special method that returns a string that represents\
    \ the current class. In C#, all classes come with a pre-defined `ToString()` method.\
    \ However, it is customary (and expected of us) to override this method. Overriding\
    \ a method simply means writing our own version of the method.\n\nTypically, the\
    \ `ToString()` method that we write displays the values of the fields and properties\
    \ of the class. Add the following code to the `Staff` class:\n\n```csharp\npublic\
    \ override string ToString()\n{\n    return \"Name of Staff = \" + nameOfStaff\
    \ + \", hourlyRate = \" + hourlyRate + \", hWorked = \" + hWorked;\n}\n```\n\n\
    As you can see, the `ToString()` method returns a `string` type. The string that\
    \ it returns contains information about the `Staff` class. The `override` keyword\
    \ in the method declaration indicates that this method overrides the default method.\
    \ We’ll discuss more about the `override` keyword in the next chapter.\n\n## Constructors\n\
    \nNow, let us look at constructors.\n\nA constructor is a special method that\
    \ is used to ‘construct’ an object from the class template. It is the first method\
    \ that is called whenever we create an object from our class. Constructors are\
    \ commonly used to initialize the fields of the class.\n\nA constructor always\
    \ has the same name as the class (`Staff` in our case) and does not return any\
    \ value. We do not need to use the `void` keyword when declaring a constructor.\n\
    \nAdd the following lines to our `Staff` class.\n\n```csharp\npublic Staff(string\
    \ name)\n{\n    nameOfStaff = name;\n    Console.WriteLine(\"\\n\" + nameOfStaff);\n\
    \    Console.WriteLine(\"--------------------------\");\n}\n```\n\nIn this constructor,\
    \ we first initialize the field `nameOfStaff` with the string that is passed in\
    \ to the constructor (`name`). We then display the value of `nameOfStaff` on the\
    \ screen and underline it with a series of dashes.\n\nLike any other methods,\
    \ we can have more than one constructor as long as the signature is different.\
    \ We can add another constructor to our class.\n\n```csharp\npublic Staff(string\
    \ firstName, string lastName)\n{\n    nameOfStaff = firstName + \" \" + lastName;\n\
    \    Console.WriteLine(\"\\n\" + nameOfStaff);\n    Console.WriteLine(\"--------------------------\"\
    );\n}\n```\n\nThis constructor has two parameters - `firstName` and `lastName`.\
    \ The first line concatenates the two strings and assigns the resulting string\
    \ to `nameOfStaff`. The next two lines print `nameOfStaff` on the screen and underline\
    \ it with a series of dashes.\n\nDeclaring a constructor is optional. If you do\
    \ not declare your own constructor, C# creates one for you automatically. The\
    \ default constructor simply initializes all the fields in the class to default\
    \ values, which is normally zero for numeral fields and empty string for string\
    \ fields.\n\n## Instantiating an Object\n\nNow that we know how to create a class,\
    \ let’s look at how we can make use of the class to create an object. This process\
    \ is known as instantiating an object. An object is also known as an instance.\n\
    \nTo recap, our `Staff` class has the following components:\n\n### Fields\n- `private\
    \ const int hourlyRate`\n- `private string nameOfStaff`\n- `private int hWorked`\n\
    \n### Properties\n- `public int HoursWorked`\n\n### Methods\n- `public void PrintMessage()`\n\
    - `public int CalculatePay()`\n- `public int CalculatePay(int bonus, int allowance)`\n\
    - `public override string ToString()`\n\n### Constructors\n- `public Staff(string\
    \ name)`\n- `public Staff(string firstName, string lastName)`\n\nWe shall instantiate\
    \ a `Staff` object in the `Main()` method inside the `Program` class.\n\nThe syntax\
    \ for instantiating an object is:\n`ClassName objectName = new ClassName(arguments);`\n\
    \nAdd the following lines inside the curly braces of the `Main()` method in the\
    \ `Program` class.\n\n```csharp\nint pay;\nStaff staff1 = new Staff(\"Peter\"\
    );\nstaff1.HoursWorked = 160;\npay = staff1.CalculatePay(1000, 400);\nConsole.WriteLine(\"\
    Pay = {0}\", pay);\n```\n\nHere, we use the first constructor (with one parameter)\
    \ to create our `staff1` object.\n\nOnce we create the object, we can use the\
    \ dot operator after the object’s name to access any public field, property or\
    \ method in the `Staff` class. Note that we need to use the dot operator here\
    \ as we are trying to access members of the `Staff` class from the `Program` class.\
    \ The dot operator is necessary whenever we want to access a field, property or\
    \ method from another class.\n\nIf you are accessing members of the same class,\
    \ you do not need to use the dot operator. An example is when we called the `PrintMessage()`\
    \ method from the `CalculatePay()` method earlier. We did not use the dot operator\
    \ as both methods are from the same class.\n\nAfter creating our `staff1` object,\
    \ the next line shows how we can use the public `EmployeeType` property to assign\
    \ a value to the `hWorked` field.\n\n```csharp\nstaff1.HoursWorked = 160;\n```\n\
    \nIf we try to access the private field `hWorked` directly by writing\n`staff1.hWorked\
    \ = 160;`\nwe will get an error as `hWorked` is a private field and is therefore\
    \ only accessible within the `Staff` class.\n\nTo call the `CalculatePay()` method,\
    \ we write:\n`staff1.CalculatePay(1000, 400);`\n\nIn this example, as we have\
    \ the numbers 1000 and 400 inside the parenthesis, we are using the second `CalculatePay()`\
    \ method. We are passing in the values 1000 and 400 to the parameters `bonus`\
    \ and `allowance` respectively. The values that we passed in are known as arguments.\
    \ The program then uses that method to calculate the pay and return the answer.\
    \ This answer is assigned to the variable `pay`.\n\nFinally, we use the `Console.WriteLine()`\
    \ method to display the value of `pay` on the screen.\n\nIf you run the code above,\
    \ you will get:\n```\nPeter\n--------------------------\nCalculating Pay...\n\
    Pay = 6200\n```\n\nPlay around with the code a bit to get a better feel of how\
    \ classes work. Try adding the following lines of code:\n\n```csharp\nStaff staff2\
    \ = new Staff(\"Jane\", \"Lee\");\nstaff2.HoursWorked = 160;\npay = staff2.CalculatePay();\n\
    Console.WriteLine(\"Pay = {0}\", pay);\n```\n\nIf you run the code above, you\
    \ will get:\n```\nJane Lee\n--------------------------\nCalculating Pay...\nPay\
    \ = 4800\n```\n\nFinally, let’s create a third object to demonstrate how validation\
    \ works when we use properties. Add the following lines of code:\n\n```csharp\n\
    Staff staff3 = new Staff(\"Carol\");\nstaff3.HoursWorked = -10;\npay = staff3.CalculatePay();\n\
    Console.WriteLine(\"Pay = {0}\", pay);\n```\n\nHere, we tried to set the `HoursWorked`\
    \ property to -10, which is an invalid value. The setter of that property sets\
    \ the value to zero instead. If you run this code, you will get:\n```\nCarol\n\
    --------------------------\nCalculating Pay...\nPay = 0\n```\n\n## Static Keyword\n\
    \nWe’ve covered some pretty complicated concepts in this chapter. I strongly suggest\
    \ that you download the complete program for this chapter from [`http://www.learncodingfast.com/csharp`](http://www.learncodingfast.com/csharp)\
    \ and play around with it. Study the code and make sure you fully understand the\
    \ topics covered in this chapter so far before moving on.\n\nIn this section,\
    \ we’ll look at another keyword that is sometimes used when we classes or class\
    \ members (i.e. methods, fields, properties, constructors etc).\n\nPreviously,\
    \ we looked at how we can use the `Staff` class to create our `staff1`, `staff2`\
    \ and `staff3` objects. However, there are some classes or class members that\
    \ can be accessed without the need to create any objects. These are known as static\
    \ classes or class members and are declared using the `static` keyword.\n\nConsider\
    \ the following class:\n\n```csharp\nclass MyClass\n{\n    //Non static members\n\
    \    public string message = \"Hello World\";\n    public string Name { get; set;\
    \ }\n    public void DisplayName()\n    {\n        Console.WriteLine(\"Name =\
    \ {0}\", Name);\n    }\n\n    // Static members\n    public static string greetings\
    \ = \"Good morning\";\n    public static int Age { get; set; }\n    public static\
    \ void DisplayAge()\n    {\n        Console.WriteLine(\"Age = {0}\", Age);\n \
    \   }\n}\n```\n"
