    Next, we want to change the value of `TotalPay`. Based on the `CalculatePay()`
    method in the base class, `TotalPay` is equal to `BasicPay`, both of which are
    equal to the product of `hWorked` and `hourlyRate`.


    However, in the `Manager` child class, we want to update the value of `TotalPay`
    by adding an allowance to it. Suppose a manager is paid an allowance of $1000
    if he/she worked more than 160 hours within that month. Try using an `if` statement
    to update the value of `TotalPay` based on the value of `HoursWorked`.


    After updating the value of `TotalPay`, the `CalculatePay()` method is complete.


