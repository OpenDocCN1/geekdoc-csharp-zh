    \ two changes. First, you need to declare the parent method as virtual, like this\n\
    \n```csharp\npublic virtual void CalculateAnnualFee()\n{\n    annualFee = 0;\n\
    }\n```\n\nNext, in the child class, you have to use the `override` keyword\n\n\
    ```csharp\n//In VIPMember class\npublic override void CalculateAnnualFee()\n{\n\
    \    annualFee = 1200;\n}\n\n//In NormalMember class\npublic override void CalculateAnnualFee()\n\
    {\n    annualFee = 100 + 12*30;\n}\n```\n\nNow if you run the program again, the\
