  trans: "\n除了处理常规错误的 `Exception` 类外，我们还拥有其他可以处理更特定错误的类。如果你想根据捕获到的错误执行特定任务，这将非常有用。例如，你可能想要显示自己的错误消息。\n\
    \n尝试运行以下代码：\n\n```c\nint choice = 0;\nint[] numbers = { 10, 11, 12, 13, 14, 15\
    \ };\nConsole.Write(\"Please enter the index of the array: \");\ntry\n{\n    choice\
    \ = Convert.ToInt32(Console.ReadLine());\n    Console.WriteLine(\"numbers[{0}]\
    \ = {1}\", choice, numbers[choice]);\n}catch (IndexOutOfRangeException)\n{\n \
    \   Console.WriteLine(\"Error: Index should be from 0 to 5.\");\n}catch (FormatException)\n\
    {\n    Console.WriteLine(\"Error: You did not enter an integer.\");\n}catch (Exception\
    \ e)\n{\n    Console.WriteLine(e.Message);\n}\n```\n\n如果你输入 `10`，将得到：\n`Index\
    \ was outside the bounds of the array.`\n`Index should be from 0 to 5.`\n\n如果你输入\
    \ `Hello`，将得到：\n`Input string was not in a correct format.`\n`You did not enter\
    \ an integer.`\n\n第一个错误是 `IndexOutOfRangeException` 异常，由第一个 `catch` 块处理。当你尝试访问超出数组范围的索引元素时，就会发生此异常。\n\
    \n第二个错误是 `FormatException` 异常，由第二个 `catch` 块处理。当参数格式无效时，会发生 `FormatException`\
    \ 异常。在我们的示例中，`Convert.ToInt32(\"Hello\")` 生成了 `FormatException` 异常，因为参数“Hello”无法转换为整数。相比之下，如果你输入\
    \ `4`，`Convert.ToInt32(“4”)` 将不会生成 `FormatException` 异常，因为字符串“4”可以转换为整数。\n\n在两个特定的\
    \ `catch` 块之后，我们还有一个 `catch` 块来捕获任何未预先处理的通用错误。\n\n上面的示例展示了 C# 中许多异常中的两种。要查看所有异常的完整列表，请参考\
    \ [`msdn.microsoft.com/en-us/library/system.systemexception.aspx`](https://msdn.microsoft.com/en-us/library/system.systemexception.aspx)。\n\
    \n# 第 7 章：面向对象编程基础\n\n到目前为止我们已经涵盖了相当的内容。在接下来的章节中，我们将介绍编程中的另一个重要概念——面向对象编程的概念。\n\
    \n在本章中，我们将学习什么是面向对象编程，以及如何编写自己的类并从类创建对象。此外，我们还将讨论字段、属性、构造函数和方法的概念。\n\n## 什么是面向对象编程？\n\
    \n简单来说，面向对象编程是一种编程方法，它将编程问题分解为相互作用的对象。\n\n对象是根据称为类（classes）的模板创建的。你可以将类比为建筑的蓝图。对象则是我们根据蓝图建造的实际“建筑”。\n\
    \n## 编写我们自己的类\n\n要编写自己的类，我们使用 `class` 关键字，后面跟着类的名。\n\n例如，要创建一个 `Staff` 类，我们写道：\n\
    \n```sharp\nclass Staff {\n    // 类的内容\n    // 包括字段、属性和方法\n}\n```\n\n在命名类时，使用\
    \ PascalCasing（大驼峰命名法）是一种常见做法。PascalCasing 指将每个单词的首字母（包括第一个单词）大写的做法（例如 `ThisIsAClassName`）。这是我们将在书中遵循的约定。\n\
    \n类的内容包含在类名后的一对大括号内。类的内容包括构造函数、析构函数、常量、字段、方法、属性、索引器、运算符、事件、委托、接口、结构体（structs）以及其他类。\n\
    \n我们将在本章中介绍类中一些更常见的元素，即字段、方法、属性和构造函数。\n\n为了理解这些是什么，让我们从零开始构建一个类。\n\n首先，在 Visual\
    \ Studio Community 中创建一个新的控制台应用程序项目，并将项目命名为“ClassDemo”。\n\n学习自动为你生成的代码。注意在 `ClassDemo`\
    \ 命名空间内部，VSC 已经为你创建了一个名为 `Program` 的类。在 `Program` 类内部，我们有 `Main()` 方法。\n\n默认情况下，`Main()`\
    \ 方法（所有 C# 应用程序的起点）被放在 VSC 创建的 `Program` 类中。如果我们愿意，可以将 `Program` 类的名称改为其他，但 `Main()`\
    \ 方法必须命名为 `Main()`。所有的 C# 程序都必须存在 `Main()` 方法。\n\n在本章中，我们将向 `ClassDemo` 命名空间添加第二个类。我们将这个新类命名为\
    \ `Staff`，并向类添加字段、属性和方法。本章的完整代码可以在 [`www.learncodingfast.com/csharp`](http://www.learncodingfast.com/csharp)\
    \ 下载。\n\n让我们先声明类。在自动生成的代码中 `class Program` 行之前添加以下代码：\n\n```sharp\nclass Staff\n\
    {\n}\n```\n\n现在我们的项目中有两个类：`Staff` 和 `Program`。\n\n### 字段\n\n在 `Staff` 类内部，添加以下行：\n\
    \n```sharp\nprivate string nameOfStaff;\nprivate const int hourlyRate = 30;\n\
    private int hWorked;\n```\n\n在这里，我们声明了一个 `string` 变量 (`nameOfStaff`) 和两个 `int`\
    \ 变量 (`hourlyRate` 和 `hWorked`)）。这些变量被称为类的字段（fields）。字段简单就是声明在类内部的变量。和其他任何变量一样，它们被用于存储数据。\n\
    \n注意每个声明语句前面都有一个 `private` 单词吗？这被称为访问修饰符。访问修饰符就像门门员，它们控制谁可以访问该字段（即谁可以读取和修改该字段的值）。\n\
    \n字段可以是 `private`、`public`、`protected` 或 `internal`。在我们的案例中，我们将三个字段都声明为 `private`。这意味着它们只能从\
    \ `Staff` 类内部进行访问。\n\n我们不希望这三个字段可以在类外部被访问，有两个原因。\n\n第一个原因是其他类不需要这些字段。在我们的案例中，字段\
    \ `hourlyRate` 仅在 `Staff` 类内部需要。我们在 `Staff` 类内部有一个方法，它使用字段 `hourlyRate` 来计算员工的月薪。其他类完全不使用\
    \ `hourlyRate` 字段。因此，将 `hourlyRate` 声明为 `private` 以向其他类隐藏此字段是合适的。\n\n这被称为封装（encapsulation）。封装允许对象向不需要了解它们的类隐藏数据和行为。这使得我们在以后必要时修改代码变得更容易。我们可以安全地在\
    \ `Staff` 类内部更改 `hourlyRate` 的值，而不会影响其他类。\n\n将字段声明为 `private` 的第二个原因是我们不希望其他类随意地修改它们。这有助于防止字段被破坏。\n\
    \n我们将在下一章详细讨论访问修饰符。\n\n除了 `private` 关键字外，我们在声明 `hourlyRate` 字段时还添加了 `const` 关键字：\n\
    \n```sharp\nprivate const int hourlyRate = 30;\n```\n\n`const` 关键字表示值在创建后无法更改。任何声明为\
    \ `const` 的变量必须在声明时初始化。在我们的示例中，我们将 `hourlyRate` 初始化为 30。此值在代码的任何地方都无法再更改。\n\n\
    ### 属性\n\n接下来，让我们看看属性（properties）。\n\n属性通常用于为私有字段提供访问，当其他类需要该字段时。这听起来像是一个矛盾。早些我们提到使用私有字段是为了让其他类无法访问它们。既然如此，我们为什么通过属性允许访问它们呢？\n\
    \n"
- fmt: "\nOne of the main reasons is that using properties gives us greater control\
    \ over what rights other classes have when assessing these private fields. We’ll\
    \ see how to do that later.\n\nFor now, let us first learn how to declare a property.\n\
    \nAdd the following lines of code to our `Staff` class, just after the line `private\
    \ int hWorked;`.\n\n```csharp\npublic int HoursWorked\n{\n    get\n    {\n   \
    \     return hWorked;\n    }\n    set\n    {\n        if (value > 0)\n       \
    \     hWorked = value;\n        else\n            hWorked = 0;\n    }\n}\n```\n\
    \nWe declared our property as\n\n```csharp\npublic int HoursWorked\n{\n}\n```\n\
    \nThe access modifier is `public` as we want other classes to have access to this\
    \ property.\n\nThe data type is `int` because this property is used to provide\
    \ access to the private `int` field `hWorked`. `hWorked` is known as the backing\
    \ field of the property.\n\nThe name of the property is `HoursWorked`. We normally\
    \ use PascalCasing for property names.\n\nA property contains two special methods\
    \ known as accessors. The first accessor is a getter and the second is a setter.\n\
    \nThe basic getter simply returns the value of the private field. Hence, we write\n\
    \n```csharp\nget\n{\n    return hWorked;\n}\n```\n\nwhere `return` is a keyword\
    \ and `hWorked` is the name of the backing field.\n\nThe setter sets the value\
    \ of the private field. We write\n\n```csharp\nset\n{\n    if (value > 0)\n  \
    \      hWorked = value;\n    else\n        hWorked = 0;\n}\n```\n\n`value` is\
    \ a keyword when it used inside a setter. It refers to the value that is on the\
    \ right side of the assignment statement when users use the property to set the\
    \ value of the private field. We’ll learn how to do that later.\n\nInside the\
    \ setter, we did a simple check using an `if` statement. We checked if `value`\
    \ is more than zero. If it is, we assign it to `hWorked`. Else, we set `hWorked`\
    \ to zero. This setter demonstrates how we can use properties to control what\
    \ values can be assigned to our private field.\n\nBy default, getter and setter\
    \ have the same access level as the property itself (`public` in this case). Hence,\
    \ we do not need to specify them. However, if you do not want the setter to have\
    \ the same access level as the property, you can declare the setter as `private`\
    \ so that other classes cannot modify your private field:\n\n```csharp\nprivate\
    \ set\n{\n}\n```\n\nThe property is then a read-only property outside the `Staff`\
    \ class. Its value can only be set within the `Staff` class itself.\n\n### Auto-implemented\
    \ Properties\n\nNote that in cases where no additional logic is required in the\
    \ getter and setter, C# provides us with a shorthand to declare the property.\
    \ This is known as an auto-implemented property.\n\nTo declare an auto-implemented\
    \ property, we write:\n\n```csharp\npublic int HoursWorked { get; set; }\n```\n\
    \nThis is equivalent to\n\n```csharp\nprivate int hWorked;\npublic int HoursWorked\n\
    {\n    get\n    {\n        return hWorked;\n    }\n    set\n    {\n        hWorked\
    \ = value;\n    }\n}\n```\n\nWhen you use this shorthand, the compiler will create\
    \ a backing field for you. If you want to make the property read-only, you can\
    \ set the setter like this:\n\n```csharp\npublic int HoursWorked { get; }\n```\n\
    \n### Methods\n\nNext, let us look at methods. A method is a code block that performs\
    \ a certain task. Let’s add a simple method:\n\n```csharp\npublic void PrintMessage()\n\
    {\n    Console.WriteLine(\"Calculating...\");\n}\n```\n\nThe `void` keyword indicates\
    \ that this method does not return any value. Here we use `public` to state the\
    \ accessibility of the method.\n\n```csharp\npublic void PrintMessage()\n{\n \
    \   Console.WriteLine(\"Calculating...\");\n}\n```\n\nNext, we state the parameters.\
    \ Parameters are data that we pass to the method. Let's add a simple parameter\
    \ to the method:\n\n```csharp\npublic void PrintMessage()\n{\n    Console.WriteLine(\"\
    Calculating...\");\n}\n```\n\nThe name of the method is `PrintMessage`. After\
    \ we add the parameter to the method:\n\n```csharp\npublic void PrintMessage()\n\
    {\n    Console.WriteLine(\"Calculating...\");\n}\n```\n\nWait, the method above\
    \ does not have a parameter. Let's fix that:\n\n```csharp\npublic void PrintMessage()\n\
    {\n    Console.WriteLine(\"Calculating...\");\n}\n```\n\nActually, let's add a\
    \ method that returns a value. A method usually has at least one return statement.\
    \ Let's look at the following example:\n\n```csharp\npublic int CalculatePay()\n\
    {\n    int staffPay = hWorked * hourlyRate;\n    return staffPay;\n}\n```\n\n\
    The `int` keyword indicates that this method returns an integer value.\n\n```csharp\n\
    public int CalculatePay()\n{\n    int staffPay = hWorked * hourlyRate;\n    return\
    \ staffPay;\n}\n```\n\nIn our example, if `hWorked` is greater than zero, the\
    \ program will execute the statement\n\n```csharp\npublic int CalculatePay()\n\
    {\n    int staffPay = hWorked * hourlyRate;\n    return staffPay;\n}\n```\n\n\
    The return value can then be assigned to a variable `pay`. For instance, if `hWorked`\
    \ is 10 and `hourlyRate` is 20, we can use the statement:\n\n```csharp\nint pay\
    \ = CalculatePay();\n```\n\nThe value of `pay` will then be 200. On the other\
    \ hand, if `hWorked` is less than or equal to zero, the program will execute the\
    \ statement\n\n```csharp\npublic int CalculatePay()\n{\n    int staffPay = hWorked\
    \ * hourlyRate;\n    return staffPay;\n}\n```\n\nWait, the code above doesn't\
    \ handle the zero case. Let's fix it:\n\n```csharp\npublic int CalculatePay()\n\
    {\n    if (hWorked > 0)\n    {\n        int staffPay = hWorked * hourlyRate;\n\
    \        return staffPay;\n    }\n    else\n    {\n        return 0;\n    }\n\
    }\n```\n\nInside the method, we use an `if` statement to determine what result\
    \ the method should return.\n\n```csharp\npublic int CalculatePay()\n{\n    if\
    \ (hWorked > 0)\n    {\n        int staffPay = hWorked * hourlyRate;\n       \
    \ return staffPay;\n    }\n    else\n    {\n        return 0;\n    }\n}\n```\n\
    \n### Overloading\n\nIn C# (and most other languages), you can create two methods\
    \ of the same name as long as they have different signatures. This is known as\
    \ overloading. The signature of a method refers to the name of the method and\
    \ the parameters that it has.\n\nAdd the following method below the previous `CalculatePay()`\
    \ method:\n\n```csharp\npublic int CalculatePay(int bonus, int allowance)\n{\n\
    \    PrintMessage();\n    if (hWorked > 0)\n    {\n        return hWorked * hourlyRate\
    \ + bonus + allowance;\n    }\n    else\n    {\n        return 0;\n    }\n}\n\
    ```\n\n### The ToString() method\n\nFinally, before we move on to the next section,\
    \ we need to write one more method – the `ToString()` method.\n"
