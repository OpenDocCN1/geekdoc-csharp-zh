    Both the `Read()` and `ReadLine()` methods read in user input as a string. Hence,
    in the example above, we assign the result of `Console.ReadLine()` to a `string`
    variable called `userInput`.


    We can then use


    ```sharp

    Console.WriteLine(userInput);

    ```


    to print out the input that the user entered.


    ## Converting a String to a Number


    Sometimes, it is necessary to convert the input that users entered into a numeric
    data type so that you can perform calculations on it. C# provides us with a number
    of methods to do the conversion. The methods that we use are found in the `Convert`
    class, which is also grouped under the `System` namespace.


    To convert a string to an integer, we use the `ToInt32()` method. For instance,
    if we have


    ```sharp

    string userInput = Console.ReadLine();

    ```


    and the user keys in 20, `userInput` will be equal to “20” (which is a string
    and not an integer because of the double quotes).


    We can then use


    ```sharp

    int newUserInput = Convert.ToInt32(userInput);

    ```


    to convert the string to the integer 20 and assign it to an `int` variable. We
    can now perform the usual mathematical operations on this new `int` variable.


    Besides converting a string to an integer, we can also convert a string to a `decimal`,
    `float` or `double` using the `ToDecimal()`, `ToSingle()` and `ToDouble()` methods
    respectively.


    ## Putting it all Together


    Now let us put everything that we’ve learned together to write a complete program.
    We’ll modify the “Hello World” program that we wrote in Chapter 2. Instead of
    just saying hello to the world, we want the world to know our names and ages too.


    First, fire up Visual Studio Community and create a new Visual C# Console Application
    project. Name the project “HelloWorldAgain”.


    Type the following code segment into the `Main()` method (line numbers are added
    for reference).


    ```sharp

    1 string userName = "";

    2 int userAge = 0;

    3 int currentYear = 0;

    4

    5 Console.Write("Please enter your name: ");

    6 userName = Console.ReadLine();

    7 Console.Write("Please enter your age: ");

    8 userAge = Convert.ToInt32(Console.ReadLine());

    9 Console.Write("Please enter the current year: ");

    10 currentYear = Convert.ToInt32(Console.ReadLine());

    11

    12 Console.WriteLine("Hello World! My name is {0} and I am {1} years old. I was
    born in {2}.", userName, userAge, currentYear - userAge);

    ```


    Run the program and enter the following information


    `Please enter your name: Jamie`

    `Please enter your age: 39`

    `Please enter the current year: 2015`


    The program should give you the following output


    `Hello World! My name is Jamie and I am 39 years old. I was born in 1976.`


    This program should be quite easy to understand. However, there are two points
    to mention about the program.


    Firstly, Line 10 shows an example of how we can use two methods within the same
    statement. When we write


    ```sharp

    userAge = Convert.ToInt32(Console.ReadLine());

    ```


    the `Console.ReadLine()` method is executed first as it is within a pair of parenthesis
    `()`. This is similar to how operations within parenthesis have a higher order
    of precedence when we evaluate a mathematical expression. For instance, when we
    evaluate `3 * (5 + 9)`, we have to add 5 to 9 first before multiplying the answer
    to 3 (i.e. `3*14`).


    After `Console.ReadLine()` is executed, the value entered by the user is converted
    to an integer using `Convert.ToInt32()`.


    Suppose the user entered 39.


    ```sharp

    Convert.ToInt32(Console.ReadLine())

    ```


    becomes


    ```sharp

    Convert.ToInt32(“39”)

    ```


    The result of `Convert.ToInt32(“39”)` is the integer 39. This integer is then
    assigned to variable `userAge`.


    The next thing to point out about the program is Line 12 as shown below:


    ```sharp

    Console.WriteLine(“Hello World! My name is {0} and I am {1} years old. I was born
    in {2}.”, userName, userAge, currentYear - userAge);

    ```


    Notice that the last argument (`currentYear - userAge`) involves a Mathematical
    operation? This is allowed in C#. `WriteLine()` will perform the subtraction and
    display the result of the calculation.


    ## Chapter 6: Making Choices and Decisions


    Congratulations on making it thus far. We’ve come a long way. You now know the
    different data types in C# and are able to code a simple program that interacts
    with users.


    In this chapter, we are going to cover another fundamental concept in programming;
    we’ll learn how to control the flow of a program using control flow statements.


    Specifically, we will learn about the `if` statement, the inline `if` statement,
    the `switch` statement, the `for` loop, the `foreach` loop, the `while` loop and
    the `do while` loop. In addition, we will also learn about the `try-catch-finally`
    statement that controls the flow of the program when an error occurs.


    However, before we go into these control tools, we have to first look at condition
    statements.


    ### Condition Statements


    Most control flow statements involve evaluating a condition statement. The program
    will proceed differently depending on whether the condition is met.


    The most common condition statement is the comparison statement. If we want to
    compare whether two variables are the same, we use the `==` sign (double =). For
    instance, if you write `x == y`, you are asking the program to check if the value
    of `x` is equal to the value of `y`. If they are equal, the condition is met and
    the statement evaluates to `true`. Else, the statement evaluates to `false`.


    In addition to evaluating whether one value is equal to another, there are other
    comparison operators that we can use in our condition statements.


    **Not equal (!=)**

    Returns `true` if the left is not equal to the right

    `5 != 2` is true

    `6 != 6` is false


    **Greater than (>)**

    Returns `true` if the left is greater than the right

    `5 > 2` is true

    `3 > 6` is false


    **Smaller than (<)**

    Returns `true` if the left is smaller than the right

    `1 < 7` is true

    `9 < 6` is false


    **Greater than or equal to (>=)**

    Returns `true` if the left is greater than or equal to the right

    `5 >= 2` is true

    `5 >= 5` is true

    `3 >= 6` is false


    **Smaller than or equal to (<=)**

    Returns `true` if the left is smaller than or equal to the right

    `11 <= 7` is true

    `7 <= 7` is true

    `9 <= 6` is false


    We also have three logical operators (`&&`, `||`, `!`) that are useful if we want
    to combine multiple conditions.


    **The AND operator (&&)**

    Returns `true` if all conditions are met

    `5==5 && 2>1 && 3!=7` is true

    `5==5 && 2<1 && 3!=7` is false as the second condition (`2<1`) is false


    **The OR operator (||)**

    Returns `true` if at least one condition is met.

    `5==5 || 2<1 || 3==7` is true as the first condition (`5==5`) is true

    `5==6 || 2<1 || 3==7` is false as all conditions are false


    ### Control Flow Statements


    Now that we are familiar with condition statements, let us proceed to learn how
    we can use these statements to control the flow of a program.


    ### If Statement


    The `if` statement is one of the most commonly used control flow statements. It
    allows the program to evaluate if a certain condition is met, and to perform the
    appropriate action based on the result of the evaluation. The structure of an
    `if` statement is as follows (line numbers are added for reference):


    ```sharp

    1 if (condition 1 is met)

    2 {

    3 do Task A

    4 }

    5 else if (condition 2 is met)

    6 {

    7 do Task B

    8 }

    9 else if (condition 3 is met)

    10 {

    11 do Task C

    12 }

    13 else

    14 {

    15 do Task E

    16 }

    ```


    Line 1 tests the first condition. If the condition is met, everything inside the
    pair of curly braces that follow (lines 2 to 4) will be executed. The rest of
    the `if` statement (from line 5 to 16) will be skipped.


    If the first condition is not met, you can use the `else if` statements that follow
    to test more conditions (lines 5 to 12). There can be multiple `else if` statements.
    Finally, you can use the `else` statement (lines 13 to 16) to execute some code
    if none of the preceding conditions are met.


    To fully understand how the `if` statement works, add the following code to the
    `Main()` program in the VSC template.


    ```sharp

    int userAge;

    ```

