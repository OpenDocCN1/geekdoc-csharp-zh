    Passing Value Type vs Reference Type Parameters


    I hope you now have a good understanding of how classes and methods work. Before
    we end this chapter, I’d like to revisit the concept of value data types and reference
    data types. In Chapter 4, we learnt that there are two main categories of data
    types in C# - value types and reference types. There is a difference when you
    pass in a value type variable to a method vs a reference type variable.


    When you pass in a value type variable, any change made to the value of that variable
    is only valid within the method itself. Once the program exits the method, the
    change is no longer valid.


    On the other hand, if you pass in a reference type variable, any change made to
    the variable is valid even after the method ends.


    Consider the class below:


    `class MethodDemo`


    `{`


    `public void PassByValue(int a)`


    `{`


    > `a = 10;`


    > `Console.WriteLine("a inside method = {0}", a);`


    `}`


    `public void PassByReference(int[] b)`


    `{`


    > `b[0] = 5;`


    > `Console.WriteLine("b[0] inside method = {0}", b[0]);`


    `}`


    `}`


    Within the class, we have two methods. The first method accepts a value type variable
    and tries to change the value of that variable. It then prints the value of the
    variable.


    The second method accepts an array (reference type) and tries to change the value
    of the first element in the array. It then prints the value of that element.


    In our `Main()` program, suppose we have the following lines of code:


    `int a = 2;`


    `int[] b = { 1, 2, 3 };`


    `MethodDemo obj = new MethodDemo();`


    `Console.WriteLine("a before = {0}", a);`


    `obj.PassByValue(a);`


    `Console.WriteLine("a after = {0}", a);`


    `Console.WriteLine("\n\n");`


    `Console.WriteLine("b[0] before = {0}", b[0]);`


    `obj.PassByReference(b);`


    `Console.WriteLine("b[0] after = {0}", b[0]);`


    If you run the program, you will get


    `a before = 2`


    `a inside method = 10`


    `a after = 2`


    `b[0] before = 1`


    `b[0] inside method = 5`


    `b[0] after = 5`


    The value of `a` stays the same before and after the method call; the change is
    only valid inside the method itself.


    On the other hand, the value of `b[0]` changes after the method call.


    Be aware of this difference when you pass in a value type variable to a method
    (e.g. `int`, `float` etc) vs a reference type variable (such as an array or list).


