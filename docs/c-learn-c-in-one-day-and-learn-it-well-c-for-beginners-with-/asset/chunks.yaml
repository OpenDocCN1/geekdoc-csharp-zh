    ## 第 6 章：选择与决策


    恭喜你走到了这里。我们已经走了很远的路。你现在了解了 C# 中不同的数据类型，并能够编写与用户交互的简单程序。


    在本章中，我们将涵盖编程中的另一个基本概念；我们将学习如何使用控制流语句来控制程序的流程。


    具体来说，我们将学习 `if` 语句、内联 `if` 语句、`switch` 语句、`for` 循环、`foreach` 循环、`while` 循环和 `do
    while` 循环。此外，我们还将学习 `try-catch-finally` 语句，用于在发生错误时控制程序的流程。


    然而，在使用这些控制工具之前，我们必须先条件语句。


    ### 条件语句


    大多数控制流语句涉及评估条件语句。程序将根据条件是否满足以不同的方式运行。


    最常见的条件语句是比较语句。如果我们想比较两个变量是否相同，我们使用相等运算符 `==`。例如，如果你写 `x == y`，你是在检查 `x` 是否等于 `y`。如果相等，则条件为
    `true`；如果不相等，则条件为 `false`。


    除了判断一个值是否等于另一个，我们还有其他比较运算符可以在条件语句中使用：


    **不等于 (!=)**

    如果左值不等于右，则返回 `true`。


    **大于>)**

    如果左大于右，则返回 `true`。


    **小于(<)**

    如果左小于右，则返回 `true`。


    **大于或等于 (>=)**

    如果左大于或等于右，则返回 `true`。


    **小于或等于 (<=)**

    如果左小于或等于右，则返回 `true`。


    我们还拥有三个逻辑运算符（`&&`、`||`、`!`），在组合多个条件时非常有用：


    **逻辑与 (&&)**

    如果所有条件都满足，则返回 `true`。


    **逻辑或 (||)**

    如果至少有一个条件满足，则返回 `true`。


    **逻辑非 (!)**

    如果条件不满足，则返回 `true`。


    ### 控制流语句


    在我们熟悉条件语句之后，让我们学习如何使用这些语句来控制程序的流程。


    ### If 语句


    `if` 语句是最常用的控制流语句之一。它允许程序评估某个条件是否满足，并根据评估结果执行相应的操作。`if` 语句的结构如下（添加了行号供参考）：


    ```sharp

    1 if (condition 1 is met)

    2 {

    3 do Task A

    4 }

    5 else if (condition 2 is met)

    6 {

    7 do Task B

    8 }

    9 else if (condition 3 is met)

    10 {

    11 do Task C

    12 }

    13 else

    14 {

    15 do Task E

    16 }

    ```


    第 1 行测试第一个条件。如果条件满足，随后的括号（第 2 到 4 行）内的所有内容将执行。`if` 语句的剩余部分（从 5 到 16 行）将被跳过。


    如果第一个条件不满足，可以使用随后的 `else if` 语句测试更多条件（第 5 到 12 行）。可以有多个 `else if` 语句。最后，如果没有任何先前的条件满足，可以使用
    `else` 语句（第 13 到 16 行）执行某些代码。


    为了完全理解 `if` 语句的工作原理，请将以下代码添加到 VSC 模板的 `Main()` 程序中。


    ```csharp

    int userAge;

    ```


