    ## The FileReader Class


    Now, we are ready to code the `FileReader` class. The `FileReader` class is relatively
    straightforward.


    It consists of one `public` method called `ReadFile()` that has no parameter.
    The method returns a list of `Staff` objects. The method declaration is as follows:


    ```

    public List<Staff> ReadFile()

    {

    }

    ```


    The `ReadFile()` method reads from a `.txt` file that consists of the names and
    positions of the staff. The format is:


    `Name of Staff, Position of Staff`


    An example is:


    ```

    Yvonne, Manager

    Peter, Manager

    John, Admin

    Carol, Admin

    ```


    The name of the text file is “staff.txt” and is stored in the same folder as the
    `.exe` file. Create this file yourself using Notepad and store it in the `CSProject
    > CSProject > Bin > Debug` folder where the `.exe` file is located.


    Now, we can start coding the `ReadFile()` method. We first declare four local
    variables named `myStaff`, `result`, `path` and `separator` as shown below:


    ```

    List<Staff> myStaff = new List<Staff>();

    string[] result = new string[2];

    string path = "staff.txt";

    string[] separator = {", " };

    ```


    Next, we check if the file “staff.txt” exists using an `if` statement and the
    `File.Exists()` method. You need to add the directive


    ```

    using System.IO;

    ```


    in order to use the `File.Exists()` method.


    If the file exists, we use a `StreamReader` object to read the text file line
    by line. (Refer to Chapter 11 if you need help with this.) Each time we read a
    line, we use the `Split()` method (refer to Chapter 4) to split the line into
    two parts and store the result in the `result` array. For instance, when we read
    the first line, the `Split()` method splits it into two strings “Yvonne” and “Manager”.
    Hence, `result[0] = “Yvonne"` and `result[1] = “Manager”`.


    Based on the value of `result[1]`, we use an `if` statement to create a `Manager`
    object if the value of `result[1]` is “Manager” or an `Admin` object if the value
    is “Admin”. We add these objects to the list `myStaff`.


    After we finish reading the file, we close the file using the `Close()` method.


    If the file does not exist, we display a message to inform users of the error.


    Finally, we return the list `myStaff` to the caller after the `if-else` statement.


    That’s all there is to the `FileReader` class. We do not need to declare a constructor
    for this class. We’ll just use the default constructor that C# creates for us
    automatically. The summary for the `FileReader` class is shown below:


    ### Methods

    `public List<Staff> ReadFile()`


