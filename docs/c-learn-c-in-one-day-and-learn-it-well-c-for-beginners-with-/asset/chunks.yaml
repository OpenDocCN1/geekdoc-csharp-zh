    `1 while (year == 0)`


    `2 {`


    `3``Console.Write("\nPlease enter the year: ");`


    `4`


    `5``try`


    `6``{`


    `7``//Code to convert the input to an integer`


    `8``}`


    `9``catch (FormatException)`


    `10``{`


    `11``//Code to handle the exception`


    `12``}`


    `13 }`


    Inside the `try` block (Line 7), we read the value that the user entered and try
    to convert it to an integer. We then assign it to the variable `year`. If it is
    successful, `year` will no longer be zero and the `while` loop will exit. Try
    coding the `try` block yourself.


    If the conversion is not successful, we catch the error in the `catch` block to
    prevent the program from crashing. Try coding an error message in the `catch`
    block (Line 11). When conversion is unsuccessful, `year` remains as zero and the
    `while` loop continues. Users will be repeatedly prompted to enter the year until
    they enter a valid value.


    Once you are done with this `while` block, you can move on to code the `while`
    block to prompt users to enter the month. The `while` block for the `month` variable
    is very similar to the one for the `year` variable. However, we want to do more
    checks for the `month` variable.


    In the `try` block, we first try to convert the input to an integer and assign
    it to the `month` variable. If it is successful, we use an `if` statement to check
    if `month` is less than 1 or greater than 12\. If it is, the input is invalid.
    We’ll display an error message to inform users that they have entered an invalid
    value. In addition, we’ll also reset `month` to zero so that the `while` loop
    will repeat itself. Try coding this `try` block yourself.


    After coding the `try` block, you can proceed to code the `catch` block which
    simply informs users of the error.


    Done? Good.


    Next, we shall add items to our `myStaff` list. We do that by using the `fr` object
    to call the `ReadFile()` method in the `FileReader` class and assigning the result
    to `myStaff`.'
