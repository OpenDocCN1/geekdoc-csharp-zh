  trans: "\n如果你运行这段代码，你将得到：\n\n`0 is an even number`\n`2 is an even number`\n`4 is\
    \ an even number`\n`6 is an even number`\n\n就是这样。使用 `LINQ` 就这么简单。现在，让我们来看一个更复杂的\
    \ `LINQ` 示例。\n\n假设你有一个 `Customer` 类，它包含 `Name`、`Phone`、`Address` 和 `Balance` 属性，并有一个用于初始化这些属性的构造函数。\n\
    \n我们可以在 `Main()` 方法中使用以下代码来创建 `Customer` 对象的列表。\n\n```csharp\nList<Customer> customers\
    \ = new List<Customer>();\ncustomers.Add(new Customer(\"Alan\", \"80911291\",\
    \ \"ABC Street\", 25.60m));\ncustomers.Add(new Customer(\"Bill\", \"19872131\"\
    , \"DEF Street\", -32.1m));\ncustomers.Add(new Customer(\"Carl\", \"29812371\"\
    , \"GHI Street\", -12.2m));\ncustomers.Add(new Customer(\"David\", \"78612312\"\
    , \"JKL Street\", 12.6m));\n```\n\n现在，假设我们要搜索所有账户余额为负的客户，我们可以使用以下 `LINQ` 查询。\n\
    \n```csharp\nvar overdue =\nfrom cust in customers\nwhere cust.Balance < 0\norderby\
    \ cust.Balance ascending\nselect new { cust.Name, cust.Balance };\n```\n\n这个查询与第一个查询相似，有两个主要区别。在这里，我们使用了两个额外的关键字\
    \ `orderby` 和 `ascending` 来按升序顺序排列结果。\n\n此外，我们在 `select` 语句中使用了 `new` 关键字。当我们想要从对象中选择多个一个字段时，就需要\
    \ `new` 关键字。\n\n要执行并打印结果，我们可以使用下面的 `foreach` 循环：\n\n```csharp\nforeach (var cust\
    \ in overdue)\n    Console.WriteLine(\"Name = {0}, Balance = {1}\", cust.Name,\
    \ cust.Balance);\n```\n\n我们将得到：\n\n`Name = Bill, Balance = -32.1`\n`Name = Carl,\
    \ Balance = -12.2`\n\n## 第 11 章：文件处理\n\n太棒了！在项目开始之前，我们来到了书的最后一章。在本章中，我们将学习如何读写外部文件。\n\
    \n在之前的第 5 章中，我们学习了如何使用 `ReadLine()` 方法获取用户输入。然而，在某些情况下，让用户向我们的程序输入数据可能并不实际，特别是当我们的程序需要处理大量数据时。在这种情况下，更方便的方法是将所需信息准备为外部文件，并让程序从文件中读取信息。\n\
    \nC# 为我们提供了许多类来处理文件。我们在本章中将看到的类是 `File`、`StreamWriter` 和 `StreamReader` 类。这三个类都位于\
    \ `System.IO` 命名空间。要使用本章中的方法，你必须在代码开头添加指令：\n\n```csharp\nusing System.IO;\n```\n\
    \n### 读取文本文件\n\n要从文本文件中读取数据，我们使用 `StreamReader` 类。\n\n假设我们想从位于 C 盘的“myFile.txt”文件里读取数据。下面的示例展示了如何操作。\n\
    \n```csharp\n1 string path = \"c:\\\\myFile.txt\";\n2 using (StreamReader sr =\
    \ new StreamReader(path))\n3 {\n4     while (sr.EndOfStream != true)\n5     {\n\
    6         Console.WriteLine(sr.ReadLine());\n7     }\n8\n9     sr.Close();\n10\
    \ }\n```\n\n在第 1 行，我们首先声明了一个 `string` 变量 `path`，并将路径赋值给该变量。\n\n```csharp\nstring\
    \ path = \"c:\\\\myFile.txt\";\n```\n\n注意，在编写路径时必须使用双反斜杠 `\\\\`。这是因为如果我们只使用单斜杠，编译器会认为单斜杠是转义序列的开头，并将\
    \ `\\m` 解析为转义序列。这会导致错误。\n\n在第 2 行，我们创建了一个 `StreamReader` 实例。`StreamReader` 构造函数接收一个参数——要读取的文件路径。\n\
    \n```csharp\nStreamReader sr = new StreamReader(path)\n```\n\n注意到我们是在第 2 行 `using`\
    \ 单词后面的括号对中创建这个 `StreamReader` 实例的吗？\n\n这里的 `using` 关键字与我们编写指令时使用的那个不同。\n\n这里的\
    \ `using` 关键字确保了 `Dispose()` 方法始终被调用。`Dispose()` 方法是 `System` 命名空间中的一个预写方法，一旦不再需要这些资源，它就会关闭或释放任何未托管资源（如文件和流）。当我们使用\
    \ `using` 关键字时，即使发生异常，我们也能确保 `Dispose()` 方法被调用，并防止我们的代码到达第 9 行手动关闭文件的地方。在处理文件时，始终使用\
    \ `using` 关键字是一个良好的习惯。读取和关闭文件的代码包含在 `using` 语句后的大括号 `{ }` 中。\n\n从第 4 行到第 7 行，我们使用\
    \ `while` 循环逐行读取文本文件。\n\n```csharp\nwhile (sr.EndOfStream != true)\n{\n    Console.WriteLine(sr.ReadLine());\n\
    }\n```\n\n`EndOfStream` 是 `StreamReader` 的一个属性，当到达文件末尾时它返回 `true`。只要没有到达文件结尾，`while`\
    \ 循环就会继续。\n\n```csharp\nConsole.WriteLine(sr.ReadLine());\n```\n\n最后，在我们完成读取后，关闭文件，这样我们就不再需要它了。\n\
    \n```csharp\nsr.Close();\n```\n\n然而，上面的代码存在一个问题。如果找不到“myFile.txt”文件，这段代码将产生错误。我们有两种选择。\n\
    \n#### 选项 1：try catch\n\n第一种选择是如所示使用 `try…catch`：\n\n```csharp\n1 try\n2 {\n3\
    \     using (StreamReader sr = new StreamReader(path))\n4     {\n5         while\
    \ (sr.EndOfStream != true)\n6         {\n7             Console.WriteLine(sr.ReadLine());\n\
    8         }\n9         sr.Close();\n10    }\n11 } catch (FileNotFoundException\
    \ e)\n12 {\n13     Console.WriteLine(e.Message);\n14 }\n```\n\n从第 1 行到 11 行，我们在\
    \ `try` 块中尝试打开、读取并关闭文件。从 11 到 14 行，如果找不到文件，我们捕获 `FileNotFoundException` 异常。在 `catch`\
    \ 块中，我们打印错误。\n\n#### 选项 2：File.Exists()\n\n处理“找不到文件”场景的第二种方法是使用 `File` 类中的 `Exists()`\
    \ 方法。正如名称所示，`Exists()` 方法检查文件是否存在。\n\n要使用 `Exists()` 方法，我们在使用 `StreamReader` 打开和读取文件之前，使用\
    \ `if` 语句检查文件是否存在。\n\n```csharp\nif (File.Exists(path))\n{\n    using (StreamReader\
    \ sr = new StreamReader(path))\n    {\n        while (sr.EndOfStream != true)\n\
    \        {\n            Console.WriteLine(sr.ReadLine());\n        }\n       \
    \ sr.Close();\n    }\n}\nelse\n{\n    //执行其他操作\n}\n```\n\n在 `else` 块中，我们可以编写在找不到文件的代码。你可以看到，两种处理文件缺失的方法非常相似。然而，`File.Exists()`\
    \ 方法是更好的选择，因为它比 `try…catch` 语句更快。\n\n### 写入文本文件\n\n接下来，让我们看看如何写入文本文件。\n\n写入文本文件，我们使用\
    \ `StreamWriter` 类。\n\n如果你想向现有文件添加数据，可以如下创建 `StreamWriter` 实例：\n\n```csharp\n\
    StreamWriter sw = new StreamWriter(path, true);\n```\n\n其中 `path` 是文件路径，`true`\
    \ 表示我们想要追加数据。\n\n如果你想覆盖文件中的任何现有数据，可以如下创建 `StreamWriter` 实例：\n\n```csharp\nStreamWriter\
    \ sw = new StreamWriter(path);\n```\n\n当我们创建 `StreamWriter` 实例时，构造函数会在给定路径查找文件。如果找不到文件，它将创建该文件。\n\
    \n"
- fmt: "\nAfter we instantiate our `StreamWriter` object, we can start writing to\
    \ our file using the `WriteLine()` method as shown below:\n\n```\nsw.WriteLine(“It\
    \ is easy to write to a file.”);\n```\n\nAfter we finish writing to the file,\
    \ we have to close the file by writing\n\n```c\nsw.Close();\n```\n\nNote that\
    \ when you write to a text file, it is also good practice to enclose your code\
    \ in a `using` statement. The code below shows a complete example of how all these\
    \ come together.\n\n```csharp\nusing System;\nusing System.Collections.Generic;\n\
    using System.Linq;\nusing System.Text;\nusing System.Threading.Tasks;\nusing System.IO;\n\
    \nnamespace FileDemo\n{\n    class Program\n    {\n        static void Main(string[]\
    \ args)\n        {\n            //declaring the path to the file\n           \
    \ string path = \"myfile.txt\";\n            //Writing to the file\n         \
    \   using(StreamWriter sw=new StreamWriter(path, true))\n            {\n     \
    \           sw.WriteLine(\"ABC\");\n                sw.WriteLine(\"DEF\");\n \
    \               sw.Close();\n            }\n            //Reading from the file\n\
    \            if (File.Exists(path))\n            {\n                using(StreamReader\
    \ sr=new StreamReader(path))\n                {\n                    while (!sr.EndOfStream)\n\
    \                    {\n                        Console.WriteLine(sr.ReadLine());\n\
    \                    }\n                    sr.Close();\n                }\n \
    \           }\n            Console.Read();\n        }\n    }\n}\n```\n\nIn this\
    \ example, we choose to append data to our file when we write to it. When you\
    \ run this program for the first time, you will get\n\n`ABC`\n`EFG`\n\nas the\
    \ file output and screen display. If you run it for the second time, you will\
    \ get\n\n`ABC`\n`EFG`\n`ABC`\n`EFG`\n\nAs the full path of “myfile.txt” is not\
    \ given in this example, the text file will be created in the same folder as the\
    \ `.exe` file, which is in the FileDemo > FileDemo > Debug > Bin folder.\n\n#\
    \ Project – A Simple Payroll Software\n\n## Congratulations!\n\nWe have now completed\
    \ the core concepts in C#. In this final chapter, we are going to get our feet\
    \ wet by coding a complete console application that generates the salary slips\
    \ of a small company. Ready?\n\n## Overview\n\nFirst, let’s create a new console\
    \ application and name it `CSProject`. This application consists of six classes\
    \ as shown below:\n\n* `Staff`\n* `Manager : Staff`\n* `Admin : Staff`\n* `FileReader`\n\
    * `PaySlip`\n* `Program`\n\nThe `Staff` class contains information about each\
    \ staff in the company. It also contains a virtual method called `CalculatePay()`\
    \ that calculates the pay of each staff.\n\nThe `Manager` and `Admin` classes\
    \ inherit the `Staff` class and override the `CalculatePay()` method.\n\nThe `FileReader`\
    \ class contains a simple method that reads from a `.txt` file and creates a list\
    \ of `Staff` objects based on the contents in the `.txt` file.\n\nThe `PaySlip`\
    \ class generates the pay slip of each employee in the company. In addition, it\
    \ also generates a summary of the details of staff who worked less than 10 hours\
    \ in a month.\n\nFinally, the `Program` class contains the `Main()` method which\
    \ acts as the main entry point of our application.\n\n## The Staff Class\n\nFirst,\
    \ let’s start with the `Staff` class. The `Staff` class contains basic information\
    \ about an employee and provides a method for calculating basic pay. It serves\
    \ as a parent class from which two other classes will be derived.\n\n### Fields\n\
    \nThis class has one `private` `float` field called `hourlyRate` and one `private\
    \ int` field called `hWorked`. Try declaring these fields yourself.\n\n### Properties\n\
    \nNext, declare three `public` auto-implemented properties for the class. The\
    \ properties are `TotalPay`, `BasicPay` and `NameOfStaff`.\n\n`TotalPay` is a\
    \ `float` property and has a `protected` setter. `BasicPay` is a `float` property\
    \ and has a `private` setter. `NameOfStaff` is a `string` property and has a `private`\
    \ setter. The getters of all three properties are `public`. Hence, you do not\
    \ need to declare the access modifiers of these getters as they have the same\
    \ access level as the properties.\n\nIn addition to these three auto-implemented\
    \ methods, the `Staff` class also has a `public` property called `HoursWorked`.\
    \ The backing field for this property is the `hWorked` field.\n\nThis property\
    \ has a getter that simply returns the value of `hWorked`. The setter checks if\
    \ the value set for `HoursWorked` is greater than 0. If it is, it assigns `value`\
    \ to `hWorked`. If it is not, it assigns 0 to `hWorked`. Try declaring this property\
    \ yourself. You can refer to Chapter 7 for help.\n\n### Constructor\n\nThe `Staff`\
    \ class has a `public` constructor with two parameters, `name` (`string`) and\
    \ `rate` (`float`). Inside the constructor, we assign the two parameters to the\
    \ property `NameOfStaff` and the field `hourlyRate` respectively. Try coding this\
    \ constructor yourself.\n\n### Method\n\nNow, let’s write the methods for the\
    \ class.\n\nFirst, we’ll code a virtual method called `CalculatePay()`.\n\n`CalculatePay()`\
    \ is `public`, has no parameters and does not return a value. The method does\
    \ three things:\n\n1. First, it prints the line “Calculating Pay…” on the screen.\n\
    2. Next, it assigns the value of `hWorked*hourlyRate` to the `BasicPay` property.\n\
    3. Finally, it assigns the value of `BasicPay` to the `TotalPay` property. In\
    \ other words, `BasicPay` and `TotalPay` will have the same value. Try coding\
    \ this method yourself.\n\nFinally, write a `ToString()` method to display the\
    \ values of the fields and properties of the `Staff` class. That’s all there is\
    \ to the `Staff` class.\n\nThe table below shows a summary of the `Staff` class.\n\
    \n| Category | Details |\n| :--- | :--- |\n| **Fields** | `private float hourlyRate`<br>`private\
    \ int hWorked` (backing field for HoursWorked) |\n| **Properties** | `public float\
    \ TotalPay`<br>`public float BasicPay`<br>`public string NameOfStaff`<br>`public\
    \ int HoursWorked` |\n| **Constructor** | `public Staff(string name, float rate)`\
    \ |\n| **Methods** | `public virtual void CalculatePay()`<br>`public override\
    \ string ToString()` |\n\n## The Manager : Staff Class\n\nNext, let’s move on\
    \ to code the `Manager` class.\n\n### Fields\n\nThe `Manager` class is a child\
    \ class of the `Staff` class. It has one `private const` field called `managerHourlyRate`\
    \ that is of `float` type. Try declaring this field and initializing it with a\
    \ value of 50.\n\n### Properties\n\n`Manager` also has a `public` auto-implemented\
    \ property called `Allowance`. `Allowance` is of `int` type and has a `private`\
    \ setter. Try coding this property.\n\n### Constructor\n\nNow, let’s declare the\
    \ constructor for `Manager`. The `Manager` class has a `public` constructor with\
    \ a `string` parameter, `name`.\n\nThe task of the constructor is to call the\
    \ base constructor and pass the parameter `name` and the field `managerHourlyRate`\
    \ to the base constructor. Other than that, the child constructor does nothing.\
    \ Hence, there is nothing within the curly braces of the child constructor. Try\
    \ coding this constructor yourself. You can refer to the `Manager` class summary\
    \ below for help if you have problems coding the constructor.\n\n### Method\n\n\
    Next, let’s code a method to override the `CalculatePay()` method in the `Staff`\
    \ class. As `Manager` is derived from `Staff`, it has access to the `BasicPay`,\
    \ `TotalPay and `HoursWorked` properties declared in the `Staff` class.\n\nIn\
    \ addition, `Manager` also has its own property – `Allowance`. We’ll be making\
    \ use of these four properties in this method.\n\nFirst, let’s declare the method.\
    \ `CalculatePay()` is `public` and does not return any value. We have to use the\
    \ `override` keyword when declaring this method as it overrides the `CalculatePay()`\
    \ method in the `Staff` class.\n\nWithin the `CalculatePay()` method in the `Manager`\
    \ class, we shall first call the `CalculatePay()` method in the parent class and\
    \ use it to set the values of `BasicPay` and `TotalPay`. To call a virtual method\
    \ in the parent class, you have to use the `base` keyword. Add the following line\
    \ to your `CalculatePay()` method.\n\n```csharp\nbase.CalculatePay();\n```\n\n\
    This calls the `CalculatePay()` method in the base (parent) class, which sets\
    \ the values of `BasicPay` and `TotalPay`. After setting the values of these two\
    \ properties, let’s go on to set the value of `Allowance`. We’ll set the value\
    \ to 1000.\n"
