  trans: "\n\n```csharp\nConsole.Write(\"Please enter your age: \");\nuserAge = Convert.ToInt32(Console.ReadLine());\n\
    if (userAge < 0 || userAge > 100)\n{\n    Console.WriteLine(\"Invalid Age\");\n\
    \    Console.WriteLine(\"Age must be between 0 and 100\");\n}\nelse if (userAge\
    \ < 18)\n    Console.WriteLine(\"Sorry you are underage\");\nelse if (userAge\
    \ < 21)\n    Console.WriteLine(\"You need parental consent\");\nelse\n{\n    Console.WriteLine(\"\
    Congratulations!\");\n    Console.WriteLine(\"You may sign up for the event!\"\
    );\n}\n```\n\n该程序首先提示用户输入其年龄，并将结果存储在 `userAge` 变量中。\n\n接接下来，语句 `if (userAge <\
    \ 0 || userAge > 100)` 检查 `userAge` 的值是否小于 0 或大于 100。如果任一个条件为 `true`，程序将执行后续大括号内的所有语句。在这个示例中，它将打印“Invalid\
    \ Age”，然后是“Age must be between 0 and 100”。\n\n另一方面，如果两个条件都为 `false`，程序将测试下一个条件\
    \ - `else if (userAge < 18)`。如果 `userAge` 小于 18（但大于或等于 0，因为第一个条件未满足），程序将打印“Sorry\
    \ you are underage”。\n\n你可能会注意到，我们没有将语句 `Console.WriteLine(“Sorry you are underage”)`\
    \ 包含在大括号中。这是因为如果只有一个要执行的语句，大括号是可选的。\n\n如果用户没有输入小于 18 的值，而是输入了一个大于或等于 18 但小于 21\
    \ 的值，则将执行下一个 `else if` 语句。在这种情况下，将打印消息“You need parental consent”。\n\n最后，如果用户输入的值大于或等于\
    \ 21 且小于或等于 100，程序将执行 `else` 块中的代码代码。在这种情况下，它将打印“Congratulations”，然后是“You may\
    \ sign up for the event!”。\n\n运行程序五次，并分别输入 -1、8、20、23 和 121。你将得到以下输出：\n\n```\n\
    Please enter your age: -1\nInvalid Age\nAge must be between 0 and 100\nPlease\
    \ enter your age: 8\nSorry you are underage\nPlease enter your age: 20\nYou need\
    \ parental consent\nPlease enter your age: 23\nCongratulations!\nYou may sign\
    \ up for the event!\nPlease enter your age: 121\nInvalid Age\nAge must be between\
    \ 0 and 100\n```\n\n### 内联 If (Inline If)\n\n内联 `if` 语句是 `if` 语句的一种更简单的形式，如果你想根据条件的结果为变量赋值，这种形式非常方便。其语法是：\n\
    \n`condition ? value if condition is true : value if condition is false;`\n\n\
    例如，语句 `3>2 ? 10 : 5;` 返回值 10，因为 3 大于 2（即条件 `3 > 2` 为 `true`）。该值随后可以赋值给变量。\n\n\
    如果我们写 `int myNum = 3>2 ? 10 : 5;`，`myNum` 将被赋值 10。\n\n### Switch 语句 (Switch Statement)\n\
    \n`switch` 语句与 `if` 语句类似，不同之处在于它不支持范围范围。`switch` 语句要求每个 `case` 必须基于单一值。根据用于切换的变量的值，程序将执行正确的代码块。\n\
    \n`switch` 语句的语法如下：\n\n```csharp\nswitch (variable used for switching)\n{\n  \
    \  case firstCase:\n        do A;\n        break (or other jump statements);\n\
    \    case secondCase:\n        do B;\n        break (or other jump statements);\n\
    \    case default:\n        do C;\n        break (or other jump statements);\n\
    }\n```\n\n使用 `switch` 语句时，你可以拥有任意数量的 `case`。`default` 情况是可选的，如果没有其他 `case` 适用，则执行它。\n\
    \n当满足某个 `case` 时，从下一行开始的所有内容都将执行，直到遇到跳转语句。跳转语句是指示编译器跳转到程序中另一行的语句。我们稍后会深入探讨跳转语句。最常用的跳转语句是\
    \ `break;` 语句。\n\n让我们来看一个 `switch` 语句如何工作的示例。\n\n```csharp\n1 Console.Write(\"\
    Enter your grade: \");\n2 string userGrade = Console.ReadLine();\n3\n4 switch\
    \ (userGrade)\n5 {\n6 case \"A+\":\n7 case \"A\":\n8 Console.WriteLine(\"Distinction\"\
    );\n9 break;\n10 case \"B\":\n11 Console.WriteLine(\"B Grade\");\n12 break;\n\
    13 case \"C\":\n14 Console.WriteLine(\"C Grade\");\n15 break;\n16 default:\n17\
    \ Console.WriteLine(\"Fail\");\n18 break;\n19 }\n```\n\n如果等级是 “A+”（第 6 行），程序执行后续语句直到遇到\
    \ `break;` 语句。这意味着它将执行第 7 到 9 行。因此，输出是“Distinction”。\n\n如果等级是 “A”（第 7 行），程序执行后续语句直到遇到\
    \ `break;` 语句。这意味着它将执行第 8 行。\n\n如果 grade 是 A+ 或 A，你将得到以下输出：\n\n```\nEnter your\
    \ grade: A+\nDistinction\nEnter your grade: A\nDistinction\nEnter your grade:\
    \ B\nB Grade\nEnter your grade: C\nC Grade\nEnter your grade: D\nFail\n```\n\n\
    ### For 循环 (For Loop)\n\n`for` 循环执行一个代码块直到条件不再满足。`for` 的语法是：\n\n```csharp\nfor\
    \ (initial value; test condition; modification)\n{\n//Task\n}\n```\n\n为了理解 `for`\
    \ 循环如何工作，让我们考虑这个示例：\n\n```csharp\n1 for (int i = 0; i < 5; i++)\n2 Console.WriteLine(i);\n\
    ```\n\n它有三部分，用分号分隔。第一部分声明并初始化 `int` 变量 `i` 为零。该变量作为循环计数器。\n\n第二部分测试 `i` 是否小于 5。如果是，则执行大括号内的语句。在这个示例中，大括号是可选的。\n\
    \n执行 `WriteLine()` 语句后，程序返回第 1 行。`i++` 将 `i` 的值增加 1。因此，`i` 从 0 增加到 1。\n\n增加后，程序测试\
    \ `i` 的新值是否仍然小于 5。如果是，它再次执行 `WriteLine()`。这种测试和增加计数器的过程将重复，直到条件 `i < 5` 不再满足。此时，程序退出\
    \ `for` 循环并继续执行后续命令。\n\n该代码的输出为：\n\n```\n0\n1\n2\n3\n4\n```\n\n输出停止在 4，是因为当 `i`\
    \ 为 5 时，`WriteLine()` 语句不再执行。\n\n`for` 循环通常用于遍历数组。例如，如果我们有\n\n`int[] myNumbers\
    \ = { 10, 20, 30, 40, 50 };`\n\n我们可以使用 `for` 循环和数组的 `Length` 属性来遍历数组，如下：\n\n```csharp\n\
    for (int i = 0; i < myNumbers.Length; i++)\n{\n    Console.WriteLine(myNumbers[i]);\n\
    }\n```\n\n由于 `myNumbers.Length` 等于 5，此代码从 `i = 0` 运行到 `i = 4`。如果我们运行代码，我们将得到：\n\
    \n```\n10\n20\n30\n40\n50\n```\n\n### Foreach 循环 (Foreach Loop)\n\n除了 `for` 循环外，在处理数组和列表时，我们还可以使用\
    \ `foreach` 循环。如果你想从数组或列表中获取信息而不对其进行任何更改，那么 `foreach` 循环非常有用。\n\n假设你有\n\n`char[]\
    \ message = { ‘H’, ‘e’, ‘l’, ‘l’, ‘o’ };`\n\n你可以使用以下代码显示数组的元素：\n\n```csharp\n\
    foreach (char i in message)\nConsole.Write(i);\n```\n\n"
- fmt: "\nIn the code above, we have a `char` variable `i` that is used for looping.\
    \ Each time the loop runs, an element in the `message` array is assigned to the\
    \ variable `i`. For instance, the first time the loop runs, the character ‘H’\
    \ is assigned to `i`.\n\nThe line\n\n```\nConsole.Write(i);\n```\nthen prints\
    \ out the letter ‘H’.\n\nThe second time the loop runs, the character ‘e’ is assigned\
    \ to `i`. The line\n\n```\nConsole.Write(i);\n```\nprints out the letter ‘e’.\n\
    \nThis continues until all the elements in the array have been printed.\n\n# While\
    \ Loop\n\nLike the name suggests, a `while` loop repeatedly executes instructions\
    \ inside the loop while a certain condition remains valid. The structure of a\
    \ `while` statement is as follows:\n\n```\nwhile (condition is true)\n{\n    do\
    \ A\n}\n```\n\nMost of the time when using a `while` loop, we need to first declare\
    \ a variable to function as a loop counter. Let’s call this variable `counter`.\
    \ The code below shows an example of how a `while` loop works.\n\n```\nint counter\
    \ = 5;\nwhile (counter > 0)\n{\n    Console.WriteLine(\"Counter = {0}\", counter);\n\
    \    counter = counter – 1;\n}\n```\n\nIf you run the code, you’ll get the following\
    \ output\n\n```\nCounter = 5\nCounter = 4\nCounter = 3\nCounter = 2\nCounter =\
    \ 1\n```\n\nA `while` statement has a relatively simple syntax. The statements\
    \ inside the curly braces are executed as long as `counter > 0`.\n\nNotice that\
    \ we have the line `counter = counter – 1` inside the curly braces? This line\
    \ is crucial. It decreases the value of `counter` by 1 each time the loop is run.\n\
    \nWe need to decrease the value of `counter` by 1 so that the loop condition (`counter\
    \ > 0`) will eventually evaluate to `false`. If we forget to do that, the loop\
    \ will keep running endlessly, resulting in an infinite loop. The program will\
    \ keep printing `counter = 5` until you somehow kill the program. Not a pleasant\
    \ experience especially if you have a large program and you have no idea which\
    \ code segment is causing the infinite loop.\n\n# Do while\n\nThe `do while` loop\
    \ is similar to the `while` loop with one main difference - the code within the\
    \ curly braces of a `do while` loop is executed at least once. Here’s an example\
    \ of how a `do while` loop works.\n\n```\nint counter = 100;\ndo {\n    Console.WriteLine(\"\
    Counter = {0}\", counter);\n    counter++;\n} while (counter<0);\n```\n\nAs the\
    \ test condition (`while (counter<0)`) is placed after the closing curly brace,\
    \ it is tested after the code inside the curly braces is executed at least once.\n\
    \nIf you run the code above, you will get\n\n```\nCounter = 100;\n```\nAfter the\
    \ `WriteLine()` statement is executed for the first time, `counter` is incremented\
    \ by 1. The value of `counter` is now 101. When the program reaches the test condition,\
    \ the test fails as `counter` is not smaller than 0. The program will then exit\
    \ the loop. Even though the original value of `counter` does not meet the test\
    \ condition (`counter < 0`), the code inside the curly braces is still executed\
    \ once.\n\nNote that for a `do while` statement, a semi-colon (`;`) is required\
    \ after the test condition.\n\n# Jump Statements\n\nWe’ve now covered most of\
    \ the control flow statements in C#. Next, let us look at jump statements.\n\n\
    A jump statement is a statement that instructs the program to deviate from its\
    \ normal flow sequence and jump to another line of code. Jump statements are commonly\
    \ used in loops and other control flow statements.\n\n## Break\n\nThe `break`\
    \ keyword causes the program to exit a loop prematurely when a certain condition\
    \ is met. We have already seen how the `break` keyword can be used in a `switch`\
    \ statement. Now, let us look at an example of how the `break` keyword can be\
    \ used in a `for` loop.\n\nConsider the code segment below:\n\n```\n1 int i =\
    \ 0;\n3 for (i = 0; i < 5; i++)\n4 {\n5 Console.WriteLine(\"i = {0}\", i);\n6\
    \ if (i == 2)\n7 break;\n8 }\n```\n\nIn this example, we used an `if` statement\
    \ inside a `for` loop. It is very common for us to ‘mix-and-match’ various control\
    \ tools in programming, such as using a `while` loop inside an `if` statement\
    \ or using a `for` loop inside a `while` loop. This is known as a nested control\
    \ statement.\n\nIf you run the code segment above, you will get the following\
    \ output.\n\n```\ni = 0\ni = 1\ni = 2\n```\nNotice that the loop ends prematurely\
    \ at `i = 2`?\n\nWithout the `break` keyword, the loop should run from `i = 0`\
    \ to `i = 4` because the loop condition is `i < 5`. However with the `break` keyword,\
    \ when `i = 2`, the condition on line 6 evaluates to `true`. The `break` keyword\
    \ on line 7 then causes the loop to end prematurely.\n\n## Continue\n\nAnother\
    \ commonly used jump keyword is the `continue` keyword. When we use `continue`,\
    \ the rest of the loop after the keyword is skipped for that iteration. An example\
    \ will make it clearer.\n\nIf you run the code segment below\n\n```\nfor (int\
    \ i = 0; i<5; i++)\n{\n    Console.WriteLine(\"i = {0}\", i);\n    if (i == 2)\n\
    \        continue;\n    Console.WriteLine(\"I will not be printed if i=2.\\n\"\
    );\n}\n```\n\nYou will get the following output:\n\n```\ni = 0\nI will not be\
    \ printed if i=2.\ni = 1\nI will not be printed if i=2.\ni = 2\ni = 3\nI will\
    \ not be printed if i=2.\ni = 4\nI will not be printed if i=2.\n```\n\nWhen `i\
    \ = 2`, the line after the `continue` keyword is not executed. Other than that,\
    \ everything runs as per normal.\n\n# Exception Handling\n\nWe’ve now learned\
    \ how to control the flow of a program under ‘normal’ circumstances using control\
    \ flow statements and jump statements. Before we end this chapter, we need to\
    \ look at one last statement, the `try-catch-finally` statement. The `try-catch-finally`\
    \ statement controls how the program proceeds when an error occurs. The syntax\
    \ is as follows:\n\n```\ntry\n{\n    do something\n}\ncatch (type of error)\n\
    {\n    do something else when error occurs\n}\nfinally\n{\n    do this regardless\
    \ of whether try or catch condition is met\n}\n```\n\nYou can have more than one\
    \ `catch` blocks. In addition, the `finally` block is optional. Let’s consider\
    \ an example.\n\n```\nint numerator, denominator;\nConsole.Write(\"Please enter\
    \ the numerator: \");\nnumerator = Convert.ToInt32(Console.ReadLine());\nConsole.Write(\"\
    Please enter the denominator: \");\ndenominator = Convert.ToInt32(Console.ReadLine());\n\
    \ntry\n{\n    Console.WriteLine(\"The result is {0}.\", numerator/denominator);\n\
    }\ncatch (Exception e)\n{\n    Console.WriteLine(e.Message);\n}\nfinally\n{\n\
    \    Console.WriteLine(\"--- End of Error Handling ---\");\n}\n```\n\nIf you run\
    \ the code and enter 12 and 4, you’ll get the message\n\n```\nThe result is 3.\n\
    --- End of Error Handling ---\n```\nIn this example, the code in the `try` block\
    \ executes successfully. After the code in the `try` block is executed, the code\
    \ in the `finally` block is executed.\n\nNow suppose you enter 12 and 0 instead.\
    \ You’ll get\n\n```\nAttempted to divide by zero.\n--- End of Error Handling ---\n\
    ```\nIn this case, the code in the `catch` block is executed instead. This is\
    \ because when the program tries to execute the statement in the `try` block,\
    \ an error occurs since you cannot divide a number by zero. Hence, the statement\
    \ in the `catch` block is executed. In addition, the code in the `finally` block\
    \ is also executed.\n\nThe `catch` block allows us to specify the type of error\
    \ that it should catch. In this case, we are trying to catch a general error.\
    \ Therefore, we write\n\n`catch (Exception e)`\n\nwhere `Exception` refers to\
    \ the class that the error belongs to and `e` is the name given to the error.\n\
    \nThe `Exception` class handles all general errors and has a property called `Message`\
    \ that explains the reason for the exception. To display that property, we write\n\
    \n`Console.WriteLine(e.Message);`\n"
