  trans: "\n在上面的代码中，我们有一个用于循环的 `char` 变量 `i`。每次循环运行时，`message` 数组中的一个元素会被赋值给变量 `i`。例如，当循环第一次运行时，字符‘H’被赋值给\
    \ `i`。\n\n接行代码\n\n```\nConsole.Write(i);\n```\n随后打印出字母‘H’。\n\n当循环第二次运行时，字符‘e’被赋值给\
    \ `i`。接行代码\n\n```\nConsole.Write(i);\n```\n打印出字母‘e’。\n\n此过程一直持续，直到数组中的所有元素都被打印完毕。\n\
    \n# While 循环\n\n顾如其名，`while` 循环在特定条件仍然有效时重复执行循环内部的指令。`while` 语句的结构如下：\n\n```\n\
    while (condition is true)\n{\n    do A\n}\n```\n\n在使用 `while` 循环的大多数情况下，我们需要首先声明一个变量作为循环计数器。让我们把这个变量为\
    \ `counter`。下面的代码展示了 `while` 循环如何工作的示例。\n\n```\nint counter = 5;\nwhile (counter\
    \ > 0)\n{\n    Console.WriteLine(\"Counter = {0}\", counter);\n    counter = counter\
    \ – 1;\n}\n```\n\n如果你运行这段代码，将得到以下输出\n\n```\nCounter = 5\nCounter = 4\nCounter\
    \ = 3\nCounter = 2\nCounter = 1\n```\n\n`while` 语句的语法相对简单。只要 `counter > 0`，大括号内部的语句就会执行。\n\
    \n注意我们在大括号内部有 `counter = counter – 1` 这一行吗？这一行至关重要。它在每次循环运行时都会将 `counter` 的值减\
    \ 1。\n\n我们需要将 `counter` 的值减 1，这样循环条件（`counter > 0`）最终会评估为 `false`。如果我们忘记这样做，循环将无限运行下去，导致死循环。程序将一直打印\
    \ `counter = 5`，直到你以某种方式杀死程序。这并不是一种愉快的体验，特别是当你有一个大型程序且不知道是哪段代码导致了死循环时。\n\n# do\
    \ while\n\n`do while` 循环与 `while` 循环相似，但主要区别在于——`do while` 循环大括号内的代码至少执行一次。这里有一个\
    \ `do while` 循环如何工作的示例。\n\n```\nint counter = 100;\ndo {\n    Console.WriteLine(\"\
    Counter = {0}\", counter);\n    counter++;\n} while (counter<0);\n```\n\n由于测试条件（`while\
    \ (counter<0)`）放置在结束大括号之后，因此它在在大括号内的代码至少执行一次后才会进行测试。\n\n如果你运行上面的代码，将得到\n\n```\n\
    Counter = 100;\n```\n在第一次执行 `WriteLine()` 语句后，`counter` 递增 1。现在 `counter` 的值是\
    \ 101。当程序到达测试条件时，由于 `counter` 不小于 0，测试失败。程序随后退出循环。尽管 `counter` 的原始值不符合测试条件（`counter\
    \ < 0`），大括号内的代码仍然执行了一次。\n\n注意，对于 `do while` 语句，在测试条件后需要一个分号（`;`）。\n\n# 跳转语句\n\n\
    我们现在涵盖了 C# 中大部分的控制流语句。接下来，让我们来看看跳转语句。\n\n跳转语句是一种指令程序偏离其正常的执行顺序并跳转到另一行代码的语句。跳转语句常用于循环和其他控制流语句中。\n\
    \n## break\n\n`break` 关键字会导致程序在满足特定条件时提前退出循环。我们已经见过 `break` 关键字如何在 `switch` 语句中使用。现在，让我们来看看\
    \ `break` 关键字如何在 `for` 循环中的示例。\n\n考虑下面的代码段：\n\n```\n1 int i = 0;\n3 for (i = 0;\
    \ i < 5; i++)\n4 {\n5 Console.WriteLine(\"i = {0}\", i);\n6 if (i == 2)\n7 break;\n\
    8 }\n```\n\n在这个示例中，我们在 `for` 循环内部使用了 `if` 语句。在编程中，我们混合使用”各种控制工具是非常常见的，例如在 `if`\
    \ 语句内部使用 `while` 循环，或在 `while` 语句内部使用 `for` 循环。这被称为嵌套控制语句。\n\n如果你运行上面的代码段，将得到以下输出。\n\
    \n```\ni = 0\ni = 1\ni = 2\n```\n注意循环在 `i = 2` 处提前结束了吗？\n\n如果没有 `break` 关键字，循环应该从\
    \ `i = 0` 运行到 `i = 4`，因为循环条件是 `i < 5`。但有了 `break` 关键字，当 `i = 2` 时，第 6 行的条件评估为\
    \ `true`。第 7 行的 `break` 关键字导致循环提前结束。\n\n## continue\n\n另一个常用的跳转关键字是 `continue`\
    \ 关键字。当我们使用 `continue` 时，该迭代中关键字之后的循环剩余部分将被跳过。一个示例会让它更清晰。\n\n如果你运行下面的代码段\n\n```\n\
    for (int i = 0; i<5; i++)\n{\n    Console.WriteLine(\"i = {0}\", i);\n    if (i\
    \ == 2)\n        continue;\n    Console.WriteLine(\"I will not be printed if i=2.\\\
    n\");\n}\n```\n\n你将得到以下输出：\n\n```\ni = 0\nI will not be printed if i=2.\ni = 1\n\
    I will not be printed if i=2.\ni = 2\ni = 3\nI will not be printed if i=2.\ni\
    \ = 4\nI will not be printed if i=2.\n```\n\n当 `i = 2` 时，`continue` 关键字之后的行不会被执行。除外，一切按正常情况运行。\n\
    \n# 异常处理\n\n我们现在已经学习了如何在“正常”情况下使用控制流语句和跳转语句来控制程序的流。在结束本章之前，我们需要查看最后一种语句，`try-catch-finally`\
    \ 语句。`try-catch-finally` 语句控制当发生错误时程序如何进行。语法如下：\n\n```\ntry\n{\n    do something\n\
    }\ncatch (type of error)\n{\n    发生错误时执行其他操作\n}\nfinally\n{\n    无论是否满足 catch\
    \ 条件都执行此操作\n}\n```\n\n你可以有多个 `catch` 块。此外，`finally` 块是可选的。让我们考虑一个示例。\n\n```\n\
    int numerator, denominator;\nConsole.Write(\"Please enter the numerator: \");\n\
    numerator = Convert.ToInt32(Console.ReadLine());\nConsole.Write(\"Please enter\
    \ the denominator: \");\ndenominator = Convert.ToInt32(Console.ReadLine());\n\n\
    try\n{\n    Console.WriteLine(\"The result is {0}.\", numerator/denominator);\n\
    }\ncatch (Exception e)\n{\n    Console.WriteLine(e.Message);\n}\nfinally\n{\n\
    \    Console.WriteLine(\"--- End of Error Handling ---\");\n}\n```\n\n如果你运行代码并输入\
    \ 12 和 4，你将得到\n\n```\nThe result is 3.\n--- End of Error Handling ---\n```\n在这个示例中，`try`\
    \ 块成功执行。在执行 `try` 块后，执行 `finally` 块。\n\n现在假设你输入 12 和 0。你将得到\n\n```\nAttempted\
    \ to divide by zero.\n--- End of Error Handling ---\n```\n在这种情况下，执行的是 `catch`\
    \ 块。这是因为当程序尝试执行 `try` 块中的语句时发生了错误，因为你不能除以零。因此，`catch` 块中的语句被执行。此外，`finally` 块也被执行。\n\
    \n`catch` 块允许我们指定它应该捕获的错误类型。在这种情况下，我们正尝试捕获一个通用错误。因此，我们写道\n\n`catch (Exception\
    \ e)`\n\n其中 `Exception` 指错误所属的类，而 `e` 是赋予给错误的名称。\n\n`Exception` 类处理所有通用错误，并有一个名为\
    \ `Message` 的属性来解释异常的原因。为了显示该属性，我们写道\n\n`Console.WriteLine(e.Message);`\n"
