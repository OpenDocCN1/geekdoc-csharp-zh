    \ 4 到 9 行）。\n\n它还包含一个静态字段 `greetings`、一个静态属性 `Age` 和一个静态方法 `DisplayAge()`（第 12\
    \ 到 17 行）。\n\n要从另一个类访问 `MyClass` 的非静态成员，我们需要像以前一样实例化一个对象：\n\n```csharp\nMyClass\
    \ classA = new MyClass();\nConsole.WriteLine(classA.message);\nclassA.Name = “Jamie”;\n\
    classA.DisplayName();\n```\n\n然而，要访问静态成员，我们不需要创建任何对象。我们只需要使用类名来访问它们，如下所示。\n\n\
    ```csharp\nConsole.WriteLine(MyClass.greetings);\nMyClass.Age = 39;\nMyClass.DisplayAge();\n\
    ```\n\n如果你运行上述代码，你将得到以下输出：\n\n```\nHello World\nName = Jamie\nGood Morning\nAge\
    \ = 39\n```\n\n除了拥有静态方法、字段、属性和构造函数外，我们还可以拥有静态类。静态类只能包含静态成员。示例如下。\n\n```csharp\n\
    static class MyStaticClass\n{\n    public static int a = 0;\n    public static\
    \ int B{get; set;}\n}\n```\n\nC# 中的一些预写类被声明为静态类。例如 `Console` 类。在使用来自 `Console`\
    \ 类的方法时，我们不需要创建 `Console` 对象。我们只需要编写 `Console.WriteLine(“Hello World”);` 即可。\n\
    \n## 高级方法概念\n\n现在你已经熟悉了类，让我们继续学习关于类中方法的声明和使用的一些高级概念。这些概念更加复杂，可能需要阅读多遍才能完全理解。\n\
    \n### 使用数组和列表\n\n之前，我们学习了如何使用 `int` 和 `float` 等基本数据类型作为方法的参数。除了使用基本数据类型外，我们还可以使用数组和列表。\n\
    \n要将数组作为参数，我们需要在方法声明中参数的数据类型后添加一个方括号 `[]`。示例如。\n\n```csharp\npublic void PrintFirstElement(int[]\
    \ a)\n{\n    Console.WriteLine(\"The first element is {0}.\\n\", a[0]);\n}\n```\n\
    \n要调用此方法，我们需要声明一个数组并将其作为参数传递给方法：\n\n```csharp\nint[] myArray = {1, 2, 3, 4, 5};\n\
    PrintFirstElement(myArray);\n```\n\n下一个示例显示了我们如何使用列表作为参数。\n\n```csharp\npublic\
    \ void PrintFirstListElement(List<int> a)\n{\n    Console.WriteLine(“The first\
    \ list element is {0}.\\n”, a[0]);\n}\n```\n\n要调用该方法，我们需要声明一个列表并将其作为参数传递给方法。\n\
    \n```csharp\nList<int> myList = new List<int> {1, 2, 3};\nPrintFirstListElement(myList);\n\
    ```\n\n除了使用数组或列表作为方法的参数外，我们还可以从方法返回数组或列表。要从方法返回数组，我们在方法声明的返回类型后添加一个方括号 `[]`。\n\
    \n```csharp\npublic int[] ReturnUserInput()\n{\n    int[] a = new int[3];\n  \
    \  for (int i = 0; i < a.Length; i++)\n    {\n        Console.Write(\"Enter an\
    \ integer: \");\n        a[i] = Convert.ToInt32(Console.ReadLine());\n       \
    \ Console.WriteLine(\"Integer added to array.\\n\");\n    }\n    return a;\n}\n\
    ```\n\n要使用此方法，我们需要声明一个数组并将方法的赋值赋值给它。\n\n```csharp\nint[] myArray2 = ReturnUserInput();\n\
    ```\n\n要从方法返回列表，我们使用方法声明中使用 `List<>` 关键字作为返回类型。示例如：\n\n```csharp\npublic List<int>\
    \ ReturnUserInputList()\n{\n    List<int> a = new List<int>();\n    int input;\n\
    \    for (int i = 0; i < 3; i++)\n    {\n        Console.Write(\"Enter an integer:\
    \ \");\n        input = Convert.ToInt32(Console.ReadLine());\n        Console.WriteLine(\"\
    Integer added to list.\\n\");\n        a.Add(input);\n    }\n    return a;\n}\n\
    ```\n\n要使用此方法，我们需要声明一个列表并将方法的结果赋值给它。\n\n```csharp\nList<int> myList2 = ReturnUserInputList();\n\
    ```\n\n### 使用 params 关键字\n\n接下来，让我们探索 `params` 关键字。当我们不知道方法会有多少个参数时，`params` 关键字非常有用。例如，我们可能有一个打印一系列名称的方法，但我们并预先知道有多少个名称。在这种情况下，可以使用数组作为参数，并在其前面添加\
    \ `params` 关键字。\n\n示例如：\n\n```csharp\npublic void PrintNames(params string[] names)\n\
    {\n    for (int i = 0; i < names.Length; i++)\n    {\n        Console.Write(names[i]\
    \ + “ ”);\n    }\n    Console.WriteLine();\n}\n```\n\n要使用此方法，我们可以传递任意数量的字符串作为参数。\n\
    \n示例：\n\n```csharp\nPrintNames(“Peter”);\nPrintNames(“Yvonne”, “Jamie”);\nPrintNames(“Abigail”,\
    \ “Betty”, “Carol”, “David”);\n```\n\n输出：\n\n```\nPeter\nYvonne Jamie\nAbigail\
    \ Betty Carol David\n```\n\n注意，在方法声明中 `params` 关键字之后不允许有额外的参数，且方法声明中只允许一个 `params`\
    \ 关键字。\n\n因此，以下方法声明是允许的：\n\n```csharp\npublic void PrintNames2(int a, double b,\
    \ params int[] ages)\n```\n\n但以下声明是不允许的：\n\n```csharp\npublic void PrintNames3(int\
    \ a, params string[] names, double b)\npublic void PrintNames4(params string[]\
    \ names, params int[] ages)\n```\n\n`PrintNames3` 不允许，是因为 `double b` 位于 `params\
    \ string[] names` 之后。\n\n`PrintNames4` 不允许，是因为有两个 `params` 关键字。\n\n### 传递值类型 vs\
    \ 引用类型\n\n希望你现在对类的工作原理有了良好的理解。在结束这一章之前，我想回顾一下值类型和引用类型的概念。当你将值类型变量传递给方法时，对该变量进行的任何更改只在方法内部有效。另一方面，如果你传递引用类型变量，对它进行的任何更改在方法结束后仍然有效。\n\
    \n考虑下面的类：\n\n```csharp\nclass MethodDemo\n{\n    public void PassByValue(int a)\n\
    \    {\n        a = 10;\n        Console.WriteLine(\"a inside method = {0}\",\
    \ a);\n    }\n\n    public void PassByReference(int[] b)\n    {\n        b[0]\
    \ = 5;\n        Console.WriteLine(\"b[0] inside method = {0}\", b[0]);\n    }\n\
    }\n```\n\n在我们的 `Main()` 程序中，假设有以下代码行：\n\n```csharp\nint a = 2;\nint[] b = { 1,\
    \ 2, 3 };\nMethodDemo obj = new MethodDemo();\nConsole.WriteLine(\"a before =\
    \ {0}\", a);\nobj.PassByValue(a);\nConsole.WriteLine(\"a after = {0}\", a);\n\n\
    Console.WriteLine(\"\\n\\n\");\nConsole.WriteLine(\"b[0] before = {0}\", b[0]);\n\
    obj.PassByReference(b);\nConsole.WriteLine(\"b[0] after = {0}\", b[0]);\n```\n\
    \n如果你运行程序，你将得到：\n\n```\na before = 2\na inside method = 10\na after = 2\n\nb[0]\
    \ before = 1\nb[0] inside method = 5\nb[0] after = 5\n```\n\n"
- fmt: "\nInheritance is one of the key concepts of object-oriented programming. Simply\
    \ stated, inheritance allows us to create a new class from an existing class so\
    \ that we can effectively reuse existing code.\n\n## Writing the Parent Class\n\
    \nSuppose we are writing a program for a fitness club that has two types of membership\
    \ – VIP and Normal. To do that, let’s create a class called `Member` first.\n\n\
    ```csharp\nclass Member\n{\n    protected int annualFee;\n    private string name;\n\
    \    private int memberID;\n    private int memberSince;\n}\n```\n\n`Member` contains\
    \ one protected field and three private fields. A protected field is a field that\
    \ is only accessible within the class in which it is declared and any class that\
    \ is derived from it. We’ll talk about derived classes very soon.\n\nNext, let\
    \ us write a `ToString()` method to display the values of the four fields.\n\n\
    ```csharp\npublic override string ToString()\n{\n    return \"\\nName: \" + name\
    \ + \"\\nMember ID: \" + memberID + \"\\nMember Since: \" + memberSince + \"\\\
    nTotal Annual Fee: \" + annualFee;\n}\n```\n\nFinally, let’s add two constructors\
    \ to the `Member` class.\n\n```csharp\npublic Member()\n{\n    Console.WriteLine(\"\
    Parent Constructor with no parameter\");\n}\npublic Member(string pName, int pMemberID,\
    \ int pMemberSince)\n{\n    Console.WriteLine(\"Parent Constructor with 3 parameters\"\
    );\n    name = pName;\n    memberID = pMemberID;\n    memberSince = pMemberSince;\n\
    }\n```\n\nThe first constructor merely prints the line “Parent Constructor with\
    \ no parameter”.\n\nThe second constructor is more interesting. It prints the\
    \ line “Parent Constructor with 3 parameters” and assigns its parameters to the\
    \ three private fields in the `Member` class.\n\n## Writing the Child Class\n\n\
    Now, let us learn how to derive a class from the `Member` class. Derived classes\
    \ are known as child classes, while the classes from which they are derived are\
    \ known as parent classes or base classes.\n\nA derived class inherits all the\
    \ public and protected members from the parent class. In other words, it can use\
    \ those fields, properties and methods as if they are part of its own code.\n\n\
    Our parent class (`Member`) has the following contents:\n\n### Fields\n- `protected\
    \ int annualFee`\n- `private string name`\n- `private int memberID`\n- `private\
    \ int memberSince`\n\n### Methods\n- `public override string ToString()`\n\n###\
    \ Constructors\n- `public Member()`\n- `public Member(string pName, int pMemberID,\
    \ int pMemberSince)`\n\nWe shall derive two classes – `NormalMember` and `VIPMember`\
    \ – from the `Member` class.\n\nFirst, let’s declare the child class `NormalMember`.\
    \ We indicate that it is derived from the `Member` class using a colon (`:`) like\
    \ this\n\n```csharp\nclass NormalMember : Member\n{\n}\n```\n\nNow, we need to\
    \ write the constructor for the child class. The constructor of a child class\
    \ is built upon the parent’s constructor. Whenever we create a child object, the\
    \ parent class constructor is always called first.\n\nThere are two ways to create\
    \ a child constructor. The first way is to simply declare it like any other constructor.\n\
    \n```csharp\npublic NormalMember()\n{\n    Console.WriteLine(\"Child constructor\
    \ with no parameter\");\n}\n```\n\nWhen we declare our constructor as above, C#\
    \ looks for a parameterless constructor (i.e. a constructor with no parameter)\
    \ in the parent class and calls that first before executing the code in the child\
    \ constructor. If you use this constructor to create a child object, the following\
    \ two lines will be displayed on the screen\n\n```\nParent Constructor with no\
    \ parameter\nChild constructor with no parameter\n```\n\nThe first line is from\
    \ the parent constructor while the second line is from the child constructor.\n\
    \nThe second way to declare a child constructor is to use the colon sign (:) and\
    \ the `base` keyword to call a non parameterless constructor in the parent class.\
    \ An example is shown below:\n\n```csharp\npublic NormalMember(string remarks)\
    \ : base (“Jamie”, 1, 2015)\n{\n    Console.WriteLine(\"Remarks = {0}\", remarks);\n\
    }\n```\n\nWhen we call a non parameterless constructor in the parent class, we\
    \ need to pass in values to its parameters. In the example above, we passed in\
    \ the values “Jamie”, 1 and 2015 to the parent constructor. These values are then\
    \ assigned to the fields `name`, `memberID` and `memberSince` in the base class\
    \ respectively.\n\nIn this example, we passed in fixed values as arguments to\
    \ the base constructor. However, a better way is to pass in the arguments through\
    \ the child constructor. The example below shows how this can be done. Replace\
    \ the previous constructor with the constructor below:\n\n```csharp\npublic NormalMember(string\
    \ remarks, string name, int memberID, int memberSince) : base (name, memberID,\
    \ memberSince)\n{\n    Console.WriteLine(\"Child Constructor with 4 parameters\"\
    );\n    Console.WriteLine(\"Remarks = {0}\", remarks);\n}\n```\n\nThis new child\
    \ constructor has four parameters. The first parameter is a `string` parameter\
    \ called `remarks`. This parameter is used inside the child constructor.\n\nThe\
    \ second, third and fourth parameters are not used in the child constructor. Instead,\
    \ they are passed in as arguments to the parent constructor based on their names.\
    \ For instance, the second parameter in the child constructor (`string name`)\
    \ is passed in as the first argument to the parent constructor (`name`).\n\nWhen\
    \ we create a child object with this constructor, we write something like\n\n\
    ```csharp\nNormalMember myChildMember = new NormalMember(“Special Rate”, \"James\"\
    , 1, 2015);\n```\n\nThe base constructor with 3 parameters is called first. The\
    \ values “James”, 1 and 2015 are passed to the parent constructor. These values\
    \ are assigned to the fields `name`, `memberID` and `memberSince` in the base\
    \ class respectively.\n\nAfter executing the base constructor, the child constructor\
    \ will be executed. The string “Special Rate” is assigned to `remarks` and displayed\
    \ on the screen.\n\nWhen you run the code, you will get the following output\n\
    \n```\nParent Constructor with 3 parameters\nChild Constructor with 4 parameters\n\
    Remarks = Special Rate\n```\n\nNow that we have created the constructors for our\
    \ child class, let us move on to create a method to calculate the annual fee of\
    \ a normal member. The code is simply\n\n```csharp\npublic void CalculateAnnualFee()\n\
    {\n    annualFee = 100 + 30;\n}\n```\n\nWhen we write “annualFee” in the code\
    \ above, we are accessing the protected field. Recall that a child class has access\
    \ to all public and protected fields in its parent class?\n\nThat’s all for our\
    \ child class `NormalMember`. The class has the following contents:\n\n### Fields\
    \ (Inherited from parent class)\n- `protected int annualFee`\n\n### Methods (Inherited\
    \ from parent class)\n- `public override string ToString()`\n\n### Methods (Declared\
    \ in child class)\n- `public void CalculateAnnualFee()`\n\n### Constructors\n\
    - `public NormalMember()`\n- `public NormalMember(string remarks, string name,\
    \ int memberID, int memberSince)`\n\nNext, let us write another class that inherits\
    \ from `Member`. This time, the derived class is `VIPMember`. The code is shown\
    \ below.\n\n```csharp\nclass VIPMember : Member\n{\n    public VIPMember(string\
    \ name, int memberID, int memberSince) : base (name, memberID, memberSince)\n\
    \    {\n        Console.WriteLine(\"Child Constructor with 3 parameters\");\n\
    \    }\n    public void CalculateAnnualFee()\n    {\n        annualFee = 1200;\n\
    \    }\n}\n```\n\nThis class has one constructor (with 3 parameters) and one method\
    \ `CalculateAnnualFee()`. The `CalculateAnnualFee()` method here uses a different\
    \ formula for calculating annual fee from the `CalculateAnnualFee()` method in\
    \ the `NormalMember` class. It is alright for the two methods to share the same\
    \ name (and signature) as they are in different classes.\n\n`VIPMember` class\
    \ has the following contents:\n\n### Fields (Inherited from parent class)\n- `protected\
    \ int annualFee`\n\n### Methods (Inherited from parent class)\n- `public override\
    \ string ToString()`\n\n### Methods (Declared in child class)\n- `public void\
    \ CalculateAnnualFee()`\n"
