    ## C# 中的类型转换


    有时在我们的程序中，我们需要从一种数据类型转换为另一种数据类型，例如从 `double` 转换为 `int`。这被称为类型转换（Type Casting）。


    要将一种数值数据类型转换为另一种，我们只需要在想要转换的数据前面加上 `(new data type)` 即可。


    例如，我们可以这样将非整数转换为整数：


    ```c

    int x = (int) 20.9;

    ```


    当我们将 20.9 转换为整数时，得到的结果是 20，而不是 21。小数部分在转换后会被直接截断。


    我们还可以将 `double` 转换为 `float` 或 `decimal`。回想起我们之前提到过，在 C# 中，所有非整数默认被处理为 `double`。如果我们想将像
    20.9 这样的数字赋值给 `float` 或 `decimal`，我们需要分别添加 `f` 和 `m` 后缀。另一种方法是使用强制转换，如下：


    ```c

    float num1 = (float) 20.9;

    decimal num2 = (decimal) 20.9;

    ```


    `num1` 和 `num2` 的值都将是 20.9。


    除了数值类型之间的转换外，我们还可以进行其他类型的转换。我们将在后续章节中探索其中一些转换。


    ## 第 4 章：数组、字符串和列表


    在上一章中，我们涵盖了 C# 中常用的一些基础数据类型。除了这些基础数据类型，C# 还提供了几个高级数据类型。在本章中，我们将涵盖三个高级数据类型：数组、字符串和列表。此外，我们还将讨论值类型（value
    data type）和引用类型（reference data type）之间的区别。


    ### 数组


    数组简单来说是相互相关的数据集合。假设我们要存储 5 个用户的年龄。与其将它们存储为 `user1Age`、`user2Age`、`user3Age`、`user4Age`
    和 `user5Age`，我们可以将它们存储为一个数组。


    数组可以这样声明并初始化：


    ```c

    int[] userAge = {21, 22, 23, 24, 25};

    ```


    `int` 表示该变量存储 `int` 值。

    `[]` 表示该变量是一个数组而不是普通变量。

    `userAge` 是数组名称。

    `{21, 22, 23, 24, 25}` 是数组存储的五个整数。


    除了在声明时声明并初始化数组外，我们还可以先声明数组稍后初始化它。要做到这一点，我们需要使用 `new` 运算符：


    ```c

    int[] userAge = new int[5];

    userAge = new [] {21, 22, 23, 24, 25};

    ```


    第一条语句声明并创建一个存储 5 个整数的数组。第二条语句初始化了该数组。


    数组中的单个值可以通过它们的索引（indexes）访问，索引始终从零 开始，而不是从 1。这是几乎所有编程语言（如 Python 和 Java）的共同做法。数组的第一个值的索引为
    0，下一个索引为 1，依此类推。


    如果我们输入


    ```c

    Console.WriteLine(userAge[0]);

    ```


    屏幕上将显示值 ‘21’。


    如果我们输入


    ```c

    userAge[2] = userAge[2] + 20;

    ```


    数组变成了 `{21, 22, 43, 24, 25}`。也就是说，在第三个元素上加了 20。


    ### 数组属性和方法


    C# 提供了许多可以与数组一起使用的有用属性和方法。


    我们将在第 7 章讨论类时学习更多关于属性和方法的知识。现在，我们只需要知道，要使用某个属性或方法，我们需要使用点（`.`）运算符。要使用一个属性，我们在点之后输入属性名。要使用一个方法，我们在点运算符之后输入方法名，并在后面紧跟一对括号
    `()`。


    #### Length


    数组的 `Length` 属性告诉我们该数组包含多少个项。


    例如，如果我们有


    ```c

    int [] userAge = {21, 22, 26, 32, 40};

    ```


    `userAge.Length` 等于 5，因为数组中有 5 个数字。


    #### Copy()


    `Copy()` 方法允许你将一个数组的内容复制到另一个数组中，从第一个元素开始。


    在 C# 中，一个方法可能有许多不同的变体。例如，`Copy()` 方法有四种变体。下面的示例讨论了四种变体中的一种。如果你学会了如何使用一种变体，就可以很容易地学会如何使用其他
    `Copy()` 方法。


    每当我们使用方法时，都需要方法名后加上一对括号 `()`。某些方法需要特定的数据才能运行。这些数据被称为参数（arguments）。我们将这些参数放在括号中。`Copy()`
    方法需要三个参数。


    假设你有


    ```c

    int [] source = {12, 1, 5, -2, 16, 14};

    int [] dest = {1, 2, 3, 4};

    ```


    你可以通过下面的语句将 `source` 的前三个元素复制到 `dest`：


    ```c

    Array.Copy(source, dest, 3);

    ```


    第一个参数是提供要复制值的数组。第二个是值将被复制入的数组。最后一个参数指定了要复制的项数。


    在我们的示例中，我们的 `dest` 数组变成了 `{12, 1, 5, 4}`，而 `source` 数组保持不变。


    #### Sort()


    `Sort()` 方法允许我们对数组进行排序。它接收数组作为参数。


    假设你有


    ```c

    int [] numbers = {12, 1, 5, -2, 16, 14};

    ```


    你可以通过编写对该数组进行排序：


    ```c

    Array.Sort(numbers);

    ```


    数组将按升序排序。因此，`numbers` 变为 `{-2, 1, 5, 12, 14, 16}`。


    #### IndexOf()


    我们使用 `IndexOf()` 方法来确定某个值是否存在于数组中。如果存在，该方法返回该值第一次出现的索引。如果不存在，方法返回 -1。


    例如，如果你有


    ```c

    int [] numbers = {10, 30, 44, 21, 51, 21, 61, 24, 14};

    ```


    你可以通过编写代码来查找值 21 是否存在于数组中：


    ```c

    Array.IndexOf(numbers, 21);

    ```


    该方法返回找到的第一个值的索引，在这种情况下是 3，因为 21 是数组中的第四个元素。然后你可以这样将答案赋值给变量：


    ```c

    int ans = Array.IndexOf(numbers, 21);

    ```


    因此 `ans` 的值是 3。如果你编写


    ```c

    ans = Array.IndexOf(numbers, 100);

    ```


    `ans` 的值是 -1，因为 100 不在 `numbers` 数组中。


    我们在本节中涵盖了一些常用的数组方法。如需查看 C# 中所有可用数组方法的列表，请访问此页面：


    [`msdn.microsoft.com/en-us/library/system.array_methods(v=vs.110).aspx`](https://msdn.microsoft.com/en-us/library/system.array_methods(v=vs.110).aspx)


    ### String


    接下来让我们看看 `string` 数据类型。字符串是一段文本。字符串的一个示例是文本“Hello World”。


    要声明并初始化一个 `string` 变量，你编写


    ```c

    string message = “Hello World”;

    ```


    其中 `message` 是 string 变量的名称，“Hello World”是赋值给它的字符串。注意你需要将字符串包含在双引号（”）中。


    你也可以将空字符串赋值给变量，如下：


    '
- fmt: '

    ```c

    string anotherMessage = "";

    ```


    Finally, we can join two or more strings using the concatenate sign (`+`) and
    assign them to a variable. For instance, we can write


    ```c

    string myName = “Hello World, ” + “my name is Jamie”;

    ```


    This is the same as


    ```c

    string myName = “Hello World, my name is Jamie”;

    ```


    # String Properties and Methods


    Like arrays, strings come with a number of properties and methods.


    ### Length


    The `Length` property of a string tells us the total number of characters the
    string contains.


    To find the length of the string “Hello World”, we write


    ```c

    “Hello World”.Length

    ```


    We will get the value `11` as “Hello” and “World” both have 5 characters each.
    When you add the space between the two words, you get a total length of `11`.


    ### Substring()


    The `Substring()` method is used to extract a substring from a longer string.


    It requires two arguments. The first tells the compiler the index of the starting
    position to extract and the second tells the compiler the length.


    Suppose we declare a `string` variable `message` and assign the string “Hello
    World” to it.


    ```c

    string message = “Hello World”;

    ```


    We can then use `message` to call the `Substring()` method as shown below.


    ```c

    string newMessage = message.Substring(2, 5);

    ```


    `Substring(2, 5)` extracts a substring of 5 characters from `message`, starting
    from index 2 (which is the third letter as indexes always start from 0).


    The resulting substring is then assigned to `newMessage`.


    `newMessage` is thus equal to “llo W”.


    `message`, on the other hand, is not changed. It remains as “Hello World”.


    ### Equals()


    We can use the `Equals()` method to compare if two strings are identical.


    If we have two strings as shown below


    ```c

    string firstString = “This is Jamie”;

    string secondString = “Hello”;

    firstString.Equals(“This is Jamie”);

    ```


    returns `true` while


    ```c

    firstString.Equals(secondString);

    ```


    returns `false` as the two strings (`firstString` and `secondString`) are not
    equal.


    ### Split()


    The `Split()` method splits a string into substrings based on an array of user-defined
    separators. After splitting the string, the `Split()` method returns an array
    that contains the resulting substrings.


    The `Split()` method requires two arguments - an array of strings that act as
    separators and a second argument to specify whether you want to remove empty strings
    from the result.


    Suppose you want to split the string “Peter, John; Andy, ,David” into substrings,
    you can do it as follows (line numbers are added for reference):


    ```c

    1 string [] separator = {“, ”, “; ”};

    2 string names = “Peter, John; Andy, , David”;

    3 string [] substrings = names.Split(separator, StringSplitOptions.None);

    ```


    On Line 1, we first declare an array of two strings to act as separators. The
    first string is a comma followed by a space and the second is a semi-colon followed
    by a space.


    On Line 2, we assign the string that we want to split to the `names` variable.
    On Line 3, we use the `names` variable to call the `Split()` method and assign
    its result to the `substrings` array.


    The result of the code above is the following array


    `{“Peter”, “John”, “Andy”, “” , “David”}`


    This array contains an empty string as there is a space between the comma after
    “Andy” and the comma before “David” in the original string. If you want to remove
    the empty string from the result, you have to change Line 3 to


    ```c

    string [] substrings = names.Split(separator, StringSplitOptions.RemoveEmptyEntries);

    ```


    The `substrings` array thus becomes


    `{“Peter”, “John”, “Andy”, “David”}`


    As usual, we’ve only covered a number of the more commonly used string methods.
    For a complete list of all the string methods available in C#, check out this
    page [https://msdn.microsoft.com/en-us/library/system.string_methods(v=vs.110).aspx](https://msdn.microsoft.com/en-us/library/system.string_methods(v=vs.110).aspx)


    # Lists


    Now, let us look at the last data type in this chapter – lists. A list stores
    values like an array, but elements can be added or removed at will.


    An array can only hold a fixed number of values. If you declare


    ```c

    int [] myArray = new int[10];

    ```


    `myArray` can only hold 10 values. If you write `myArray[10]` (which refers to
    the 11th value since array index starts from zero), you will get an error.


    If you need greater flexibility in your program, you can use a list.


    To declare a list of integers, we write


    ```c

    List<int> userAgeList = new List<int>();

    ```


    `userAgeList` is the name of the list.


    `List` is a keyword to indicate that you are declaring a list.


    The data type is enclosed in angle brackets `< >`.


    You can choose to initialize the list at the point of declaration like this


    ```c

    List<int> userAgeList = new List<int> {11, 21, 31, 41};

    ```


    To access the individual elements in a list, we use the same notation as when
    we access elements in an array. For instance, to access the first element, you
    write `userAgeList[0]`.


    # List Properties and Methods


    The list data type also comes with a number of properties and methods.


    ### Add


    To add members to a list, use the `Add()` method.


    ```c

    userAgeList.Add(42);

    ```


    `userAgeList` now has 5 elements.


    ### Count


    To find out the number of elements in a list, use the `Count` property.


    ```c

    int count = userAgeList.Count;

    ```


    `Count` gives us the number of elements in the list.


    ### Insert()


    To insert members at a specific position, use the `Insert()` method.


    ```c

    userAgeList.Insert(2, 22);

    ```


    where 2 is the index and 22 is the value you want to insert.


    ### Remove()


    To remove members from the list, use the `Remove()` method.


    ```c

    userAgeList.Remove(21);

    ```


    The `Remove()` method removes the first occurrence of that argument.


    ### RemoveAt()


    To remove a member at a specific location, use the `RemoveAt()` method.


    ```c

    userAgeList.RemoveAt(3);

    ```


    where 3 is the index of the item to be removed.


    ### Contains()


    To check if a list contains a certain member, use the `Contains()` method.


    ```c

    bool hasAge = userAgeList.Contains(21);

    ```


    We will get `true` or `false`.


    ### Clear()


    To remove all items in a list, use the `Clear()` method.


    ```c

    userAgeList.Clear();

    ```


    we will have no elements left in the list.


    # Value Type. Reference Type


    Now that we are familiar with strings, arrays and lists, let us discuss an important
    concept regarding data types in C#.


    All data types in C# can be classified as either a value type or a reference type.
    The data types discussed in Chapter 3 are value types. Those discussed in this
    chapter are reference types.


    A value data type is a variable that stores its own data.


    When we write


    ```c

    int myNumber = 5;

    ```


    `myNumber` stores the actual value 5.


    A reference type, on the other hand, does not store the actual data. Instead,
    it stores a reference to the data. It does not tell the compiler what the value
    of the data is; it tells the compiler where to find the actual data.


    An example of a reference type is a `string`. When you write a statement like


    ```c

    string message = “Hello”;

    ```


    the variable `message` actually does not store the string “Hello”.


    Instead, the string “Hello” is created and stored elsewhere in the computer’s
    memory. The variable `message` stores the address of that memory location.

