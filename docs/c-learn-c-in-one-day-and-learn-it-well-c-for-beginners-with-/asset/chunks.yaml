    \ to be an advanced user-defined data type that groups a set of related fields,\
    \ properties and methods into a logical unit.\n\nIn this chapter, we are going\
    \ to look at two more user-defined data types in C# – `enum` and `struct`.\n\n\
    ## Enum\n\nAn `enum` (which stands for enumerated type) is a special data type\
    \ that allows programmers to provide meaningful names for a set of integral constants.\n\
    \nTo declare an `enum`, we use the `enum` keyword followed by the name of the\
    \ `enum`. The members of the `enum` are enclosed in a set of curly braces and\
    \ separated by commas.\n\nAn example is shown below:\n\n```csharp\nenum DaysOfWeek\n\
    {\n    Sun, Mon, Tues, Wed, Thurs, Fri, Sat\n}\n```\n\nNote that we do not put\
    \ a semi-colon at the end of the last member.\n\nAfter declaring the `DaysOfWeek`\
    \ enum, we can declare and initialize a `DaysOfWeek` variable like this:\n\n```csharp\n\
    DaysOfWeek myDays = DaysOfWeek.Mon;\n```\n\nThe name of the variable is `myDays`.\
    \ If we write\n\n```csharp\nConsole.WriteLine(myDays);\n```\n\nwe’ll get\n\n`Mon`\n\
    \nBy default, each member in the `enum` is assigned an integer value, starting\
    \ from zero. That is, in our example, `Sun` is assigned a value of 0, `Mon` is\
    \ 1, `Tues` is 2 and so on.\n\nAs members of an `enum` are essentially integers,\
    \ we can cast a `DaysOfWeek` variable into an `int` and vice versa. For instance,\n\
    \n```csharp\nConsole.WriteLine((int)myDays);\n```\n\ngives us the integer `1`\
    \ while\n\n```csharp\nConsole.WriteLine((DaysOfWeek)1);\n```\n\ngives us `Mon`.\n\
    \nIf you want to assign a different set of integers to your `enum` members, you\
    \ can do the following\n\n```csharp\nenum Days DaysTwo\n{\n    Sun = 5, Mon =\
    \ 10, Tues, Wed, Thurs, Fri, Sat\n}\n```\n\nNow, `Sun` is assigned a value of\
    \ 5 and `Mon` is assigned 10\\. As we did not assign values for `Tues` to `Sat`,\
    \ consecutive numbers after 10 will be assigned to them. That is `Tues` = 11,\
    \ `Wed` = 12 and so on.\n\nAll `enums` are stored internally as integers (`int`).\
    \ If you want to change the underlying data type from `int` to another data type,\
    \ you add a colon after the enum-name, followed by the desired data type. Any\
    \ integer data type is allowed except for `char`. An example is\n\n```csharp\n\
    enum DaysOfWeekThree : byte\n{\n    Sun, Mon, Tues, Wed, Thurs, Fri, Sat\n}\n\
    ```\n\nOf course, if you use a `byte` data type, you cannot do something like\n\
    \n```csharp\nenum DaysOfWeekFour : byte\n{\n    Sun = 300, Mon, Tues, Wed, Thurs,\
    \ Fri, Sat\n}\n```\n\nas the range for `byte` is from 0 to 255.\n\nThere are two\
    \ main reasons for using `enums`. The first is to improve the readability of your\
    \ code. The statement\n\n`myDays = DaysOfWeek.Mon;`\n\nis more self-explanatory\
    \ than the statement\n\n`myDays = 1;`\n\nThe second reason is to restrict the\
    \ values that a variable can take. If we have a variable that stores the days\
    \ of a week, we may accidentally assign the value 10 to it. This can be prevented\
    \ when we use an `enum` as we can only assign the pre-defined members of the `enum`\
    \ to the variable.\n\n## Struct\n\nNow, let’s look at the `struct` data type.\n\
    \nA `struct` is similar to a `class` in many aspects. Like classes, they contain\
    \ elements like properties, constructors, methods and fields and allow you to\
    \ group related members into a single package so that you can manipulate them\
    \ as a group.\n\nTo declare a `struct`, you use the `struct` keyword. An example\
    \ is:\n\n```csharp\nstruct MyStruct\n{\n    //Fields\n    private int x, y;\n\
    \    private AnotherClass myClass;\n    private Days myDays;\n\n    //Constructor\n\
    \    public MyStruct(int a, int b, int c)\n    {\n        myClass = new AnotherClass();\n\
