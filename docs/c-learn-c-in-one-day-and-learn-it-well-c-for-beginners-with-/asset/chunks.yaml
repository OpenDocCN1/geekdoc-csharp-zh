    \ You\n\n# Appendix A – Project Answer\n\n# Chapter 1: Introduction to C#\n\n\
    Welcome to `C#` programming and thank you so much for picking up this book!\n\n\
    Whether you are a seasoned programmer or a complete novice, this book is written\
    \ to help you learn `C#` programming fast. Topics are carefully selected to give\
    \ you a broad exposure to `C#` while not overwhelming you with information overload.\n\
    \nBy the end of the book, you should have no problem writing your own `C#` programs.\
    \ In fact, we will be coding a simple payroll software together as part of the\
    \ project at the end of the book. Ready to start?\n\nFirst, let’s answer a few\
    \ questions:\n\n### What is C#?\n\n`C#`, pronounced as `C Sharp`, is an object-oriented\
    \ programming language developed by Microsoft in the early 2000s, led by Anders\
    \ Hejlsberg. It is part of the `.Net` framework and is intended to be a simple\
    \ general-purpose programming language that can be used to develop different types\
    \ of applications, including console, windows, web and mobile applications.\n\n\
    Like all modern programming languages, `C#` code resembles the English language\
    \ which computers are unable to understand. Therefore, `C#` code has to be converted\
    \ into machine language using what is known as a `compiler` (refer to footnote).\
    \ The compiler that we’ll be using in this book is the free `Visual Studio Community\
    \ 2015` provided by Microsoft.\n\n### Why Learn C#?\n\n`C#` has syntax and features\
    \ that resemble other programming languages like `Java` and `C++`. As such, if\
