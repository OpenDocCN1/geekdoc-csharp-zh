    \    }\n}\n\nclass AnotherClass\n{\n    public int number;\n}\n\nenum Days { Mon,\
    \ Tues, Wed }\n```\n\nThe `struct` is declared from lines 1 to 23\\. On line 4,\
    \ we declared two `private` `int` fields for the `struct`. On line 5, we declared\
    \ another private field called `myClass`. This field is an `AnotherClass`. On\
    \ line 6, we declared `Days`. On line 9, we declared the constructor. On line\
    \ 11, we initialized `myClass = new AnotherClass();`. On line 12, we set `myClass.number\
    \ = a;`. On line 13, we set `x = b;`. On line 14, we set `y = c;`. On line 15,\
    \ we set `myDays = Days.Mon;`. On line 19, we declared the method `PrintStatement()`.\
    \ On line 21, we used `Console.WriteLine()`. On line 25, we declared `class AnotherClass`.\
    \ On line 27, we declared `public int number;`. On line 30, we declared `enum\
    \ Days`.\n\n## Chapter 10: LINQ\n\nLINQ stands for Language-Integrated Query and\
    \ is an interesting feature of C# that allows you to query data. In this chapter,\
