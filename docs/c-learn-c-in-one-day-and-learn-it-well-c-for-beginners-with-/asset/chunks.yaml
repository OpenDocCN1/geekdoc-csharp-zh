- fmt: "\nIf all goes well and your program runs successfully, a black window will\
    \ appear with the words “Hello World” in white. This black window is known as\
    \ the console. Press Enter to close the window.\n\nThat’s it! You have successfully\
    \ coded your first program. Give yourself a pat on the shoulders.\n\nIf you navigate\
    \ to your “C# Projects” folder now, you’ll find a folder named “HelloWorld”. Within\
    \ the folder, you’ll find another “HelloWorld” folder and a `HelloWorld.sln` file.\
    \ This `.sln` file is the solution file. Whenever you need to reopen a project,\
    \ this is the file to open. If the text editor does not display your code when\
    \ you open the solution file, simply double click on the `Program.cs` file in\
    \ the `Solution Explorer` on the right (refer to the previous image) to open it.\n\
    \nThe executable file `(.exe)` of your code can be found in the `HelloWorld >\
    \ HelloWorld > bin > Debug` folder.\n\n# Basic Structure of a C# Program\n\nNow,\
    \ let us do a quick run-through of the basic program that you have just coded.\n\
    \n## Directive\n\nFrom line 1 to 5, we have a few statements that start with the\
    \ word `using`. These statements are known as directives. They tell the compiler\
    \ that our program uses a certain namespace.\n\nFor instance, the first line\n\
    \n```csharp\nusing System;\n```\n\ntells the compiler that our program uses the\
    \ `System` namespace.\n\n## Namespace\n\nA namespace is simply a grouping of related\
    \ code elements. These elements include classes, interfaces, enums and structs\
    \ etc (we’ll cover each of these elements in subsequent chapters).\n\nC# comes\
    \ with a large amount of pre-written code that are organised into different namespaces.\
    \ The `System` namespace contains code for methods that allow us to interact with\
    \ our users. We use two of these methods in our program - the `WriteLine()` and\
    \ `Read()` methods. The other namespaces are not needed in our program. However,\
    \ since these namespaces are included in the default template, we’ll leave it\
    \ in our code.\n\nIn addition to the pre-written namespaces provided by Microsoft,\
    \ we can also declare our own namespaces.\n\nOne advantage of declaring namespaces\
    \ is that it prevents naming conflicts. Two or more code elements can have the\
    \ same name as long as they belong to different namespaces. For instance, the\
    \ code below defines two namespaces, both of which contain a class named `MyClass`.\
    \ This is allowed in C# as the two classes belong to different namespaces (`First`\
    \ and `Second`).\n\n```csharp\nnamespace First\n{\n    class MyClass\n    {\n\
    \    }\n}\n\nnamespace Second\n{\n    class MyClass\n    {\n    }\n}\n```\n\n\
    In our example, we declared one namespace - `HelloWorld`.\n\nThe `HelloWorld`\
    \ namespace starts on line 7, with an opening curly brace on line 8. It ends on\
    \ line 20 with a closing curly brace. Curly braces are used extensively in C#\
    \ to indicate the start and end of a code element. All opening braces in C# must\
    \ be closed with a corresponding closing brace.\n\nWithin the `HelloWorld` namespace,\
    \ we have the `Program` class which starts on line 12 and ends on line 19. Within\
    \ the `Program` class, we have the `Main()` method that starts on line 14 and\
    \ ends on line 18.\n\n# The Main() Method\n\nThe `Main()` method is the entry\
    \ point of all C# console applications. Whenever a console application is started,\
    \ the `Main()` method is the first method to be called.\n\nIn this book, whenever\
    \ you are asked to try out a certain code segment, you should create a new “Console\
    \ Application” and type the given code segment into the `Main()` method (between\
    \ the curly braces). You can then run the program to test the code.\n\nNotice\
    \ the words `string[] args` inside the parenthesis of our `Main()` method? This\
    \ means the `Main()` method can take in an array of strings as input. Do not worry\
    \ about this for the moment. We’ll cover these topics in subsequent chapters.\n\
    \nIn our example, the `Main()` method contains two lines of code. The first line\n\
    \n```csharp\nConsole.WriteLine(\"Hello World\");\n```\n\ndisplays the line “Hello\
    \ World” (without the quotes) on the screen.\n\nThe second line\n\n```csharp\n\
    Console.Read();\n```\n\nwaits for a key press from the user before closing the\
    \ window.\n\nBoth of the statements above end with a semi-colon. This is common\
    \ for most statements in C#. After the `Console.Read()` statement, we end our\
    \ code with three closing braces to close the earlier opening braces.\n\nThat’s\
    \ it! There’s all there is to this simple program.\n\n# Comments\n\nWe’ve covered\
    \ quite a bit in this chapter. You should now have a basic understanding of C#\
    \ programming and be reasonably comfortable with VSC. Before we end this chapter,\
    \ there’s one more thing to learn - comments.\n\nIf you refer back to our “HelloWorld”\
    \ example and look at line 10, you should notice that this line starts with two\
    \ forward slashes (`//`).\n\n```csharp\n//A Simple Program to display the words\
    \ Hello World\n```\n\nThis line is actually not part of the program. It is a comment\
    \ that we write to make our code more readable for other programmers. Comments\
    \ are ignored by the compiler.\n\nTo add comments to our program, we type two\
    \ forward slashes (`//`) in front of each line of comment like this\n\n```csharp\n\
    // This is a comment\n// This is another comment\n// This is yet another comment\n\
    ```\n\nAlternatively, we can also use `/* … */` for multiline comments like this\n\
    \n```csharp\n/* This is a comment\nThis is also a comment\nThis is yet another\
    \ comment\n*/\n```\n\nComments can also be placed after a statement, like this:\n\
    \n```csharp\nConsole.Read(); //reads the next character\n```\n\n# Chapter 3: The\
    \ World of Variables and Operators\n\nNow that you are familiar with VSC and have\
    \ written your first program, let’s get down to the real stuff. In this chapter,\
    \ you’ll learn all about variables and operators. Specifically, you’ll learn what\
    \ variables are and how to name, declare and initialize them. You’ll also learn\
    \ about the common operations that we can perform on them.\n\n## What are variables?\n\
    \nVariables are names given to data that we need to store and manipulate in our\
    \ programs. For instance, suppose your program needs to store the age of a user.\
    \ To do that, we can name this data `userAge` and declare the variable `userAge`\
    \ using the following statement:\n\n```csharp\nint userAge;\n```\n\nThe declaration\
    \ statement first states the data type of the variable, followed by its name.\
    \ The data type of a variable refers to the type of data that the variable will\
    \ store (such as whether it’s a number or a piece of text). In our example, the\
    \ data type is `int`, which refers to integers. The name of our variable is `userAge`.\n\
    \nAfter you declare the variable `userAge`, your program will allocate a certain\
    \ area of storage space to store this data. You can then access and modify this\
    \ data by referring to it by its name, `userAge`.\n\n## Data Types in C#\n\nThere\
    \ are a number of commonly used data types in C#.\n\n### int\n\n`int` stands for\
    \ integer (i.e. numbers with no decimal or fractional parts) and holds numbers\
    \ from -2,147,483,648 to 2,147,483,647. Examples include 15, 407, -908, 6150 etc.\n\
    \n### byte\n\n`byte` also refers to integral numbers, but has a narrower range\
    \ from 0 to 255.\n\nMost of the time, we use `int` instead of `byte` for integral\
    \ numbers. However, if you are programming for a machine that has limited memory\
    \ space, you should use `byte` if you are certain the value of the variable will\
    \ not exceed the 0 to 255 range.\n\nFor instance, if you need to store the age\
    \ of a user, you can use the `byte` data type as it is unlikely that the user’s\
    \ age will ever exceed 255 years old.\n\n### float\n\n`float` refers to floating\
    \ point numbers, which are numbers with decimal places such as 12.43, 5.2 and\
    \ -9.12.\n\n`float` can store numbers from -3.4 x 10^(38) to +3.4 x 10^(38). It\
    \ uses 8 bytes of storage and has a precision of approximately 7 digits. This\
    \ means that if you use `float` to store a number like 1.23456789 (10 digits),\
    \ the number will be rounded off to 1.234568 (7 digits).\n\n### double\n\n`double`\
    \ is also a floating point number, but can store a much wider range of numbers.\
    \ It can store numbers from (+/-)5.0 x 10^(-324) to (+/-)1.7 x 10^(308) and has\
    \ a precision of about 15 to 16 digits.\n"
  raw: 'If all goes well and your program runs successfully, a black window will appear
    with the words “Hello World” in white. This black window is known as the console.
    Press Enter to close the window.


    That’s it! You have successfully coded your first program. Give yourself a pat
    on the shoulders.


    If you navigate to your “C# Projects” folder now, you’ll find a folder named “HelloWorld”.
    Within the folder, you’ll find another “HelloWorld” folder and a “HelloWorld.sln”
    file. This .sln file is the solution file. Whenever you need to reopen a project,
    this is the file to open. If the text editor does not display your code when you
    open the solution file, simply double click on the “Program.cs” file in the “Solution
    Explorer” on the right (refer to the previous image) to open it.


    The executable file (.exe) of your code can be found in the HelloWorld > HelloWorld
    > bin > Debug folder.


    Basic Structure of a C# Program


    Now, let us do a quick run-through of the basic program that you have just coded.


    Directive


    From line 1 to 5, we have a few statements that start with the word `using`. These
    statements are known as directives. They tell the compiler that our program uses
    a certain namespace.


    For instance, the first line


    `using System;`


    tells the compiler that our program uses the `System` namespace.


    Namespace


    A namespace is simply a grouping of related code elements. These elements include
    classes, interfaces, enums and structs etc (we’ll cover each of these elements
    in subsequent chapters).


    C# comes with a large amount of pre-written code that are organised into different
    namespaces. The `System` namespace contains code for methods that allow us to
    interact with our users. We use two of these methods in our program - the `WriteLine()`
    and `Read()` methods. The other namespaces are not needed in our program. However,
    since these namespaces are included in the default template, we’ll leave it in
    our code.


    In addition to the pre-written namespaces provided by Microsoft, we can also declare
    our own namespaces.


    One advantage of declaring namespaces is that it prevents naming conflicts. Two
    or more code elements can have the same name as long as they belong to different
    namespaces. For instance, the code below defines two namespaces, both of which
    contain a class named `MyClass`. This is allowed in C# as the two classes belong
    to different namespaces (`First` and `Second`).


    `namespace First`


    `{`


    `class MyClass`


    `{`


    `}`


    `}`


    `namespace Second`


    `{`


    `class MyClass`


    `{`


    `}`


    `}`


    In our example, we declared one namespace - `HelloWorld`.


    The `HelloWorld` namespace starts on line 7, with an opening curly brace on line
    8\. It ends on line 20 with a closing curly brace. Curly braces are used extensively
    in C# to indicate the start and end of a code element. All opening braces in C#
    must be closed with a corresponding closing brace.


    Within the `HelloWorld` namespace, we have the `Program` class which starts on
    line 12 and ends on line 19\. Within the `Program` class, we have the `Main()`
    method that starts on line 14 and ends on line 18.


    The Main() Method


    The `Main()` method is the entry point of all C# console applications. Whenever
    a console application is started, the `Main()` method is the first method to be
    called.


    In this book, whenever you are asked to try out a certain code segment, you should
    create a new “Console Application” and type the given code segment into the `Main()`
    method (between the curly braces). You can then run the program to test the code.


    Notice the words “string[] args” inside the parenthesis of our `Main()` method?
    This means the `Main()` method can take in an array of strings as input. Do not
    worry about this for the moment. We’ll cover these topics in subsequent chapters.


    In our example, the `Main()` method contains two lines of code. The first line


    `Console.WriteLine(“Hello World”);`


    displays the line “Hello World” (without the quotes) on the screen.


    The second line


    `Console.Read();`


    waits for a key press from the user before closing the window.


    Both of the statements above end with a semi-colon. This is common for most statements
    in C#. After the `Console.Read()` statement, we end our code with three closing
    braces to close the earlier opening braces.


    That’s it! There’s all there is to this simple program.


    Comments


    We’ve covered quite a bit in this chapter. You should now have a basic understanding
    of C# programming and be reasonably comfortable with VSC. Before we end this chapter,
    there’s one more thing to learn - comments.


    If you refer back to our “HelloWorld” example and look at line 10, you should
    notice that this line starts with two forward slashes (`//`).


    `//A Simple Program to display the words Hello World`


    This line is actually not part of the program. It is a comment that we write to
    make our code more readable for other programmers. Comments are ignored by the
    compiler.


    To add comments to our program, we type two forward slashes (`//`) in front of
    each line of comment like this


    `// This is a comment`


    `// This is another comment`


    `// This is yet another comment`


    Alternatively, we can also use `/* … */` for multiline comments like this


    `/* This is a comment`


    `This is also a comment`


    `This is yet another comment`


    `*/`


    Comments can also be placed after a statement, like this:


    `Console.Read();``//reads the next character`


    Chapter 3: The World of Variables and Operators


    Now that you are familiar with VSC and have written your first program, let’s
    get down to the real stuff. In this chapter, you’ll learn all about variables
    and operators. Specifically, you’ll learn what variables are and how to name,
    declare and initialize them. You’ll also learn about the common operations that
    we can perform on them.


    What are variables?


    Variables are names given to data that we need to store and manipulate in our
    programs. For instance, suppose your program needs to store the age of a user.
    To do that, we can name this data `userAge` and declare the variable `userAge`
    using the following statement:


    `int userAge;`


    The declaration statement first states the data type of the variable, followed
    by its name. The data type of a variable refers to the type of data that the variable
    will store (such as whether it’s a number or a piece of text). In our example,
    the data type is `int`, which refers to integers. The name of our variable is
    `userAge`.


    After you declare the variable `userAge`, your program will allocate a certain
    area of your computer''s storage space to store this data. You can then access
    and modify this data by referring to it by its name, `userAge`.


    Data Types in C#


    There are a number of commonly used data types in C#.


    int


    `int` stands for integer (i.e. numbers with no decimal or fractional parts) and
    holds numbers from -2,147,483,648 to 2,147,483,647\. Examples include 15, 407,
    -908, 6150 etc.


    byte


    `byte` also refers to integral numbers, but has a narrower range from 0 to 255.


    Most of the time, we use `int` instead of `byte` for integral numbers. However,
    if you are programming for a machine that has limited memory space, you should
    use `byte` if you are certain the value of the variable will not exceed the 0
    to 255 range.


    For instance, if you need to store the age of a user, you can use the `byte` data
    type as it is unlikely that the user’s age will ever exceed 255 years old.


    float


    `float` refers to floating point numbers, which are numbers with decimal places
    such as 12.43, 5.2 and -9.12.


    `float` can store numbers from -3.4 x 10^(38) to +3.4 x 10^(38). It uses 8 bytes
    of storage and has a precision of approximately 7 digits. This means that if you
    use `float` to store a number like 1.23456789 (10 digits), the number will be
    rounded off to 1.234568 (7 digits).


    double


    `double` is also a floating point number, but can store a much wider range of
    numbers. It can store numbers from (+/-)5.0 x 10^(-324) to (+/-)1.7 x 10^(308)
    and has a precision of about 15 to 16 digits.'
