    ### 接口


    接下来，让我们来看看接口。接口与抽象类非常相似，它们不能被实例化且必须被继承。然而，接口比抽象类更具概念性。它们只能包含没有方法体的方法。此外，它们不能包含字段但可以包含属性。接口也不能拥有静态成员。当子类继承接口时，我们说它实现了该接口。


    抽象类和接口之间的主要区别之一是，一个类只能继承一个抽象类，但可以实现多个接口。我们不会展示多个接口实现的示例，因为那是超出本书范围的高级主题。


    下面的代码展示了类如何实现一个接口的示例。接口名称以字母 `I` 开头是常见的。接口中的所有属性和方法都是公共的，因此不需要对它们添加任何访问修饰符。


    ```cs

    1 using System;

    2 using System.Collections.Generic;

    3 using System.Linq;

    4 using System.Text;

    5 using System.Threading.Tasks;

    6

    7 namespace InterfaceDemo

    8 {

    9 class Program

    10 {

    11 static void Main(string[] args)

    12 {

    13 ClassA a = new ClassA();

    14 a.MyNumber = 5;

    15 a.InterfaceMethod();

    16 Console.Read();

    17 }

    18 }

    19

    20 interface IShape

    21 {

    22 int MyNumber

    23 {

    24 get;

    25 set;

    26 }

    27 void InterfaceMethod();

    28 }

    29

    30 class ClassA : IShape

    31 {

    32

    33 private int myNumber;

    34 public int MyNumber

    35 {

    36 get

    37 {

    38 return myNumber;

    39 }

    40 set

    41 {

    42 if (value < 0)

    43 myNumber = value;

    44 else

    45 myNumber = 0;

    46 }

    47 }

    48

    49 public void InterfaceMethod()

    50 {

    51 Console.WriteLine("The number is " + MyNumber);

    52 }

    53 }

    54 }

    ```


    接口位于第 20 行到第 28 行。`ClassA` 在第 30 行实现 `IShape`。属性 `MyNumber`（第 34-47 行）封装了私有字段
    `myNumber`。`InterfaceMethod()` 在第 49 行实现。


    ### 访问修饰符重温


    现在我们已经涵盖了与继承相关的主题，让我们再次观察访问修饰符的概念。之前我们了解到访问修饰符就像守门员。它控制对特定字段、属性或方法的访问。C# 带有 4
    种访问修饰符：`private`、`public`、`protected` 和 `internal`。


    任何声明为 `internal` 的内容仅在当前程序集中可访问。由于本书不会讲解程序集，因此我们不会演示 `internal` 如何工作。为了理解 `private`、`public`
    和 `protected` 如何工作，让我们考虑下面的示例。我们将使用字段来演示这一概念。假设有这样一个类：


    ```cs

    class ClassA

    {

    private int privateNum = 1;

    public int publicNum = 2;

    protected int protectedNum = 3;

    }

    ```


    如果 `ClassB` 继承自 `ClassA`，


    ```cs

    class ClassB:ClassA

    {

    public void PrintMessages()

    {

    // OK

    Console.WriteLine(publicNum);

    // OK

    Console.WriteLine(protectedNum);

    // OK

    Console.WriteLine(privateNum);

    }

    }

    ```


    前两个 `WriteLine()` 语句不会产生任何错误，因为派生类可以访问父类中的任何公共和保护字段。然而，第三条语句产生错误，因为 `privateNum`
    是私有字段，因此仅在 `ClassA` 内部可访问。


    如果一个类没有继承自 `ClassA`，我们需要实例化 `ClassA` 对象以访问其公共字段。然而，即使有了 `ClassA` 对象，我们也无法访问 `ClassA`
    的私有和保护字段。在下面的示例中，`ClassC` 没有继承自 `ClassA`。因此，第一个 `WriteLine()` 语句不会产生任何错误，但第二和第三条语句会。


    ```cs

    class ClassC

    {

    ClassA a = new ClassA();

    public void PrintMessages()

    {

    // OK

    Console.WriteLine(a.publicNum);

    // 不 OK

    Console.WriteLine(a.protectedNum);

    // 不 OK

    Console.WriteLine(a.privateNum);

    }

    }

    ```


    简而言之，任何声明为 `public` 的内容随处可用；访问公共成员没有限制。相反，任何声明为 `private` 的内容仅在其声明的类内部可访问。声明为
    `protected` 的内容在其声明的类以及任何派生自它的类中可访问。

