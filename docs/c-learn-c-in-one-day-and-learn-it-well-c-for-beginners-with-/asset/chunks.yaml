    \ Rate\", \"Andy\", 2, 2011);\nclubMembers[2] = new NormalMember(\"Normal Rate\"\
    , \"Bill\", 3, 2011);\nclubMembers[3] = new VIPMember(\"Carol\", 4, 2012);\nclubMembers[4]\
    \ = new VIPMember(\"Evelyn\", 5, 2012);\n```\n\n在这里，我们声明了一个 `Member` 类型的数组并向其添加了\
    \ 5 个成员。前三个成员是 `NormalMember` 类的实例，而后两个是 `VIPMember` 类的实例。\n\n尽管 `clubMembers`\
    \ 被声明为 `Member` 类型数组，但我们可以将 `NormalMember` 和 `VIPMember` 的实例赋值给，因为它们是 `Member`\
    \ 类的子类。我们不需要为 `NormalMember` 和 `VIPMember` 对象分别声明数组。\n\n接下来，我们将使用 `foreach` 循环计算每个成员的年费并显示信息。为了这样做，我们写：\n\
    \n```csharp\nforeach (Member m in clubMembers)\n{\n    m.CalculateAnnualFee();\n\
    \    Console.WriteLine(m.ToString());\n}\n```\n\n如果你在此阶段尝试运行程序，将得到一个错误，提示 `Member`\
    \ 不包含 `CalculateAnnualFee` 的定义。这是因为 `clubMembers` 被声明为 `Member` 类型数组。因此，当我们编写\
    \ `m.CalculateAnnualFee()` 时，编译器尝试执行 `Member` 类中的 `CalculateAnnualFee()` 方法。发生错误是因为我们在\
    \ `Member` 父类中没有该方法；它只在两个子类中存在。为了纠正这个错误，我们必须向父类添加以下方法。\n\n```csharp\npublic void\
    \ CalculateAnnualFee()\n{\n    annualFee = 0;\n}\n```\n\n现在运行程序并注意每个成员的“Total\
    \ Annual Fee”。你发现了什么？它们应该都显示为 $0。这意味着被调用的 `CalculateAnnualFee()` 方法是父类中的。这并不意外，因为\
    \ `clubMembers` 被声明为 `Member` 类型。\n\n如果你想调用子类方法，你需要做两个更改。首先，你需要将父方法声明为 `virtual`，如下：\n\
    \n```csharp\npublic virtual void CalculateAnnualFee()\n{\n    annualFee = 0;\n\
    }\n```\n\n接下来，在子类中，你必须使用 `override` 关键字\n\n```csharp\n// 在 VIPMember 类\npublic\
    \ override void CalculateAnnualFee()\n{\n    annualFee = 1200;\n}\n\n// 在 NormalMember\
    \ 类\npublic override void CalculateAnnualFee()\n{\n    annualFee = 100 + 12*30;\n\
    }\n```\n\n现在如果你再次运行程序，前三个（`NormalMember`）的年费将分别为 460，后两个（`VIPMember`）为 1200。这就是多态的结果。多态简单来说意味着在运行时，程序足够智能，即使该对象被声明为\
    \ `Member` 类型，也能使用来自正确子类的 ``CalculateAnnualFee()` 方法。\n\n### 抽象类和方法\n\n现在我们已经熟悉了继承（以及多态），让我们来讨论\
    \ C# 中两种特殊的“父类”类型——抽象类和接口。\n\n首先，让我们看看抽象类。抽象类是一种特殊的类，其创建严格是为了作为其他类派派的基类。它们不能被实例化。换句话说，如果\
    \ `FourWheelVehicles` 是一个抽象类，那么语句\n\n```csharp\nFourWheelVehicle myVeh = new FourWheelVehicle();\n\
    ```\n\n将给你一个错误，因为你不能创建抽象类的对象。\n\n"
