    `Read()` 和 `ReadLine()` 方法都将用户输入读取为字符串。因此，在上面的示例中，我们将 `Console.ReadLine()` 的结果赋值给一个名为
    `userInput` 的 `string` 变量。


    然后我们可以使用：


    ```sharp

