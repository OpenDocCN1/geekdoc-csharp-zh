  trans: "\n在第 3 章和第 4 章中，我们查看了 C# 提供的一些内置数据类型。这些包括像 `int`、`float` 和 `double` 等值类型，以及数组、字符串和列表等引用数据类型。此外，我们还在第\
    \ 7 章和第 8 章学习了如何编写自己的类。`class`（类）可以被视为一种高级的用户定义数据类型，它将一组相关的字段、属性和方法分组到一个逻辑单元中。\n\
    \n在本章中，我们将查看 C# 中的另外两种用户定义数据类型——`enum` 和 `struct`。\n\n## Enum（枚举）\n\n`enum`（枚举\
    \ type 的缩写）是一种特殊的数据类型，允许程序员为一组整型常量提供有意义的名字。\n\n要声明一个 `enum`，我们使用 `enum` 关键字，后跟\
    \ `enum` 的名称。`enum` 的成员包含在大括号中，并用逗号分隔。\n\n示例如下：\n\n```csharp\nenum DaysOfWeek\n\
    {\n    Sun, Mon, Tues, Wed, Thurs, Fri, Sat\n}\n```\n\n注意，我们没有在最后一个成员的末尾加分号。\n\
    \n在声明 `DaysOfWeek` 枚举后，我们可以像这样声明并初始化一个 `DaysOfWeek` 变量：\n\n```csharp\nDaysOfWeek\
    \ myDays = DaysOfWeek.Mon;\n```\n\n变量的名为 `myDays`。如果我们写\n\n```csharp\nConsole.WriteLine(myDays);\n\
    ```\n\n我们将得到\n\n`Mon`\n\n默认情况下，`enum` 中的每个成员都被分配了一个整数值，从零开始。也就是说，在我们的示例中，`Sun`\
    \ 被赋值为 0，`Mon` 是 1，`Tues` 是 2，依此类推。\n\n由于 `enum` 的成员本质上是整数，我们可以将 `DaysOfWeek`\
    \ 变量强制类型转换为 `int`，反之亦然。例如，\n\n```csharp\nConsole.WriteLine((int)myDays);\n```\n\
    \n带给我们整数 `1`，而\n\n```csharp\nConsole.WriteLine((DaysOfWeek)1);\n```\n\n带带我们 `Mon`。\n\
    \n如果你想为你的 `enum` 成员分配一组不同的整数，可以采取以下措施：\n\n```csharp\nenum Days DaysTwo\n{\n  \
    \  Sun = 5, Mon = 10, Tues, Wed, Thurs, Fri, Sat\n}\n```\n\n现在，`Sun` 被赋值为 5，`Mon`\
    \ 被赋值为 10。由于我们没有为 `Tues` 到 `Sat` 分配值，10 之后的连续数字将被分配给它们。即 `Tues` = 11，`Wed` = 12，依此类推。\n\
    \n所有的 `enums` 在内部内部都存储为整数（`int`）。如果你想将底层数据类型从 `int` 更改为其他数据类型，可以在枚举名称后添加一个冒号，后跟所需的数据类型。除了\
    \ `char` 外，任何整数数据类型都是允许的。例如：\n\n```csharp\nenum DaysOfWeekThree : byte\n{\n  \
    \  Sun, Mon, Tues, Wed, Thurs, Fri, Sat\n}\n```\n\n当然，如果你使用 `byte` 数据类型，你无法执行如下操作：\n\
    \n```csharp\nenum DaysOfWeekFour : byte\n{\n    Sun = 300, Mon, Tues, Wed, Thurs,\
    \ Fri, Sat\n}\n```\n\n因为 `byte` 的范围是从 0 到 255。\n\n使用 `enums` 有两个主要原因。第一个是提高代码的可读性。语句\n\
    \n`myDays = DaysOfWeek.Mon;`\n\n比语句\n\n`myDays = 1;`\n\n更具自说明性。\n\n第二个原因是限制变量可以取的值范围。如果我们有一个存储星期几的变量，我们可能会无意中给它赋值为\
    \ 10。当我们使用 `enum` 时，可以防止这种情况，因为我们只能将 `enum` 中预定义的成员赋值给变量。\n\n## Struct（结构体）\n\n\
    现在，让我们来看 `struct` 数据类型。\n\n`struct` 在许多方面与 `class` 相似。像类一样，它们包含属性、构造函数、方法和字段等元素，并允许你将相关的成员分组到单个包中，以便你可以作为一个整体来操作它们。\n\
    \n要声明一个 `struct`，你使用 `struct` 关键字。示例如下：\n\n```csharp\nstruct MyStruct\n{\n   \
    \ //Fields\n    private int x, y;\n    private AnotherClass myClass;\n    private\
    \ Days myDays;\n\n    //Constructor\n    public MyStruct(int a, int b, int c)\n\
    \    {\n        myClass = new AnotherClass();\n        myClass.number = a;\n \
    \       x = b;\n        y = c;\n        myDays = Days.Mon;\n    }\n\n    //Method\n\
    \    public void PrintStatement()\n    {\n        Console.WriteLine(\"x = {0},\
    \ y = {1}, myDays = {2}\", x, y, myDays);\n    }\n}\n\nclass AnotherClass\n{\n\
    \    public int number;\n}\n\nenum Days { Mon, Tues, Wed }\n```\n\n`struct` 声明从第\
    \ 1 行到 23 行。在第 4 行，我们为 `struct` 声明了两个 `private` `int` 字段。在第 5 行，我们声明了另一个名为 `myClass`\
    \ 的私字段。该字段是 `AnotherClass`。在第 6 行，我们声明了 `Days`。在第 9 行，我们声明了构造函数。在第 11 行，我们初始化了\
    \ `myClass = new AnotherClass();`。在第 12 行，我们设置了 `myClass.number = a;`。在第 13 行，我们设置了\
    \ `x = b;`。在第 14 行，我们设置了 `y = c;`。在第 15 行，我们设置了 `myDays = Days.Mon;`。在第 19 行，我们声明了方法\
    \ `PrintStatement()`。在第 21 行，我们使用了 `Console.WriteLine()`。在第 25 行，我们声明了 `class\
    \ AnotherClass`。在第 27 行，我们声明了 `public int number;`。在第 30 行，我们声明了 `enum Days`。\n\
    \n## 第十章：LINQ\n\nLINQ 代表语言集成查询（Language-Integrated Query），是 C# 的一个非常有趣的功能，允许你对数据进行查询。在本章中，我们将涵盖\
    \ LINQ 的简要介绍，以及如何使用它的示例。\n\n让我们先学习如何编写一个 LINQ 查询。LINQ 查询的典型语法是\n\n`from... where...\
    \ orderby... select`\n\n假设我们有一个数组，并且从数组中选择所有的偶数。我们可以使用 LINQ 轻松地做到。\n\n首先，让我们声明这个数组。\n\
    \n```csharp\nint[] numbers = { 0, 1, 2, 3, 4, 5, 6 };\n```\n\n接下来，我们编写如下的 LINQ\
    \ 查询：\n\n```csharp\nvar evenNumQuery =\nfrom num in numbers\nwhere (num % 2) ==\
    \ 0\nselect num;\n```\n\n查询从第 2 行到第 4 行。有 SQL 经验的读者可能会觉得这个查询非常熟悉。\n\n创建查询语句后，我们可以通过编写以下代码来执行查询：\n\
    \n```csharp\nforeach (int i in evenNumQuery)\n{\n    Console.WriteLine(\"{0} is\
    \ an even number\", i);\n}\n```\n"
- fmt: "\nIf you run this code, you will get:\n\n`0 is an even number`\n`2 is an even\
    \ number`\n`4 is an even number`\n`6 is an even number`\n\nThat’s it. That’s how\
    \ easy it is to use `LINQ`. Let us now move on to a more complex example of `LINQ`.\n\
    \nSuppose you have a `Customer` class with `Name`, `Phone`, `Address` and `Balance`\
