    Lines 1 and 2 should be quite easy to code. Try coding them yourself.


    To print lines 3 and 4, we need to use a `foreach` loop to loop through each element
    in the `result` variable obtained from the LINQ statement. Try coding this yourself.


    After displaying the result, you can close the “summary.txt” file using the `Close()`
