    # 第 1 章：C# 简介


    欢迎学习 `C#` ，感谢你选择这本书！无论你是一个丰富的程序员还是一个完全的新手，这本书都是为了帮助你快速学习 `C#` 而编写的。主题经过精心挑选，旨在让你广泛接触
    `C#` 的同时又不会因信息过载而让你感到压力。


    读完本书后，你应该能够毫无问题地编写自己的 `C#` 程序。事实上，我们将作为书末项目的一部分，一起编写一个简单的薪资软件。准备好了吗？


    首先，让我们来回答几个问题：


    ### 什么是 C#？


    `C#`（读作 `C Sharp`）是由 Anders Hejlsberg 领导、微软在 21 世纪初开发的一种面向对象的编程语言。它是 `.Net` 框架的一部分，旨在成为一种简单的通用编程语言，可用于开发不同类型的应用程序，包括控制台应用程序、Windows
    应用程序、Web 和移动应用程序。


    与所有现代编程语言一样，`C#` 代码类似于计算机无法理解的英语。因此，`C#` 代码必须通过被称为 `compiler`（编译器）的工具转换为机器语言（参见脚注）。我们在本书中将使用的编译器是微软提供的免费版
    `Visual Studio Community 2015`。


    ### 为什么要学习 C#？


    `C#` 的语法和特征与 `Java` 和 `C++` 等其他编程语言相似。因此，如果你有任何之前的编程经验，你会发现学习 `C#` 非常轻而易举。即使你对编程完全一陌生，`C#`
    设计得也很容易学习（不像 `C` 或 `C++`），是一门非常棒的入门语言。


    此外，`C#` 是 `.Net` 框架的一部分。该框架包含大量的预写代码库，程序员可以直接使用这些代码，而无需从头开始编写一切。这允许程序员使用 `C#`
    快速开发应用程序，使得如果你时间紧迫，`C#` 是你工作的理想语言。


    最后，`C#` 是一种面向对象编程（`OOP`）语言。面向对象编程是一种编程方法，它将编程问题分解为相互作用的对象。我们将在本书中介绍各种面向对象的编程概念。一旦你掌握了
    `C#`，你就会熟悉这些概念。这将使你未来更容易掌握其他面向对象的编程语言。


    准备好涉入 `C#` 编程的世界了吗？让我们开始吧。


    脚注：


    将一个 `C#` 程序转换为机器语言的过程实际上比这要复杂一些。`Visual Studio Community` 仅仅是将 `C#` 程序转换为 `MIL`，代表
    `Microsoft Intermediate Language`（微软中间语言）。然后，这些 `MIL` 代码将由被称为 `Common Language
    Runtime`（通用语言运行时）的虚拟执行系统转换为机器语言。更多信息，请查看 `https://msdn.microsoft.com/en-us/library/z1zx9t92.aspx`。尽管如此，对于我们的目的，我们不需要知道这些复杂的细节就可以开发自己的
    `C#` 程序。


    # 第 2 章：为 C# 做好准备


    ## 安装 Visual Studio Community


    在我们开始用 `C#` 开发应用程序之前，我们需要下载 `Visual Studio Community`。正如第 1 章提到的，`Visual Studio
    Community` (`VSC`) 是微软提供的一个免费 `complier`。


    事实上，`VSC` 不仅仅是一个编译器。它是一个集成开发环境（`IDE`），包含了用于编写代码的文本编辑器和一个帮助识别错误的调试器。


    要下载 `VSC`，请访问 `https://www.microsoft.com/en-us/visualstudio/community/`。


    ![](img/0004.jpg)


    ### 你的第一个程序


    为了编写第一个程序，让我们在桌面上创建一个文件夹并命名为 `C# Projects`。接下来，启动 `VSC` 并选择 `File > New > Project`。我们将编写的第一个程序是控制台应用程序。控制台应用程序指的是没有图形界面的程序。


    在 `New Project` 对话框中，在左侧选择 `C#`，并在主框中选择 `Console Application`。将此程序重命名为 `HelloWorld`
    并将其保存到之前创建的 `C# Projects` 文件夹中。最后，点击 `OK` 创建项目。


    ![](img/0003.jpg)


    你将看到 `VSC` 创建的模板。将模板中的代码替换为下面的代码。注意，添加行号是为了参考，并不是实际代码的一部分。


    ```csharp

    using System;

    using System.Collections.Generic;

    using System.Linq;

    using System.Text;

    using System.Threading.Tasks;


    namespace HelloWorld

    {

    //一个用于显示 Hello World 的简单程序

    class Program

    {

    static void Main(string[] args)

    {

    Console.WriteLine("Hello World");

    Console.Read();

    }

    }

    }

    ```


    `VSC` 可以工作。当你输入时，你会注意到光标附近会出现一个框，并偶尔显示一些帮助信息。这被称为 `Intellisense`。例如，当你在单词 `Console`
    之后输入点 `.` 时，会出现一个下拉列表，让你知道点之后可以输入什么。这是 `VSC` 的功能之一，旨在帮助程序员更容易编写代码。


    完成输入后，可以通过点击顶部菜单上的 `Start` 按钮来执行此程序（请下下图）。


    ![](img/0005.jpg)


    如果你的程序运行失败，`VSC` 会在 `Output Window` 中通知你错误。双击错误会将光标移动到错误所在。将你的代码与上面的代码进行对比，以纠正错误并再次运行程序。


