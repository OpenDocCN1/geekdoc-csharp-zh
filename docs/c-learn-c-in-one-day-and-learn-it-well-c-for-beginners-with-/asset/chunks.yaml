    Polymorphism


    Now that we have seen an example of how inheritance woks, let us move on to discuss
    another topic that is closely related to inheritance - the concept of polymorphism.
    Polymorphism refers to a program’s ability to use the correct method for an object
    based on its run-time type.


    The best way to explain polymorphism is through an example. Let’s expand on our
    Fitness club example above.


    First, delete all the code in the previous `Main()` method and add the following
    lines:


    `Member[] clubMembers = new Member[5];`


    `clubMembers[0] = new NormalMember("Special Rate", "James", 1, 2010);`


    `clubMembers[1] = new NormalMember("Normal Rate", "Andy", 2, 2011);`


    `clubMembers[2] = new NormalMember("Normal Rate", "Bill", 3, 2011);`


    `clubMembers[3] = new VIPMember("Carol", 4, 2012);`


    `clubMembers[4] = new VIPMember("Evelyn", 5, 2012);`


    Here, we declare an array of `Member` type and add 5 members to it. The first
    three members are instances of the `NormalMember` class while the last two are
    instances of the `VIPMember` class.


    Although `clubMembers` is declared to be an array of `Member` type, we can assign
    instances of `NormalMember` and `VIPMember` to it as they are child classes of
    the `Member` class. We do not need to declare separate arrays for `NormalMember`
    and `VIPMember` objects.


    Next, we’ll use a `foreach` loop to calculate the annual fee of each member and
    display the information.


    To do that, we write


    `foreach (Member m in clubMembers)`


    `{`


    `m.CalculateAnnualFee();`


    `Console.WriteLine(``m.ToString());`


    `}`


    If you try to run the program at this stage, you’ll get an error that says `Member`
    does not contain a definition for ‘CalculateAnnualFee’. This is because `clubMembers`
    is declared to be an array of `Member` type. Hence, the complier tries to execute
    the `CalculateAnnualFee()` method in the `Member` class when we write `m.CalculateAnnualFee()`.
    An error occurs because we do not have such a method in our `Member` parent class;
    we only have it in the two child classes. To rectify this error, we have to add
    the following method to our parent class.


    `public void CalculateAnnualFee()`


    `{`


    `annualFee = 0;`


    `}`


    Now run the program and pay attention to the “Total Annual Fee” for each member.
    What do you notice? It should all show $0\. This means the `CalculateAnnualFee()`
    method that is invoked is the one in the parent class. This is not surprising
    as `clubMembers` is declared to be of `Member` type.


    If you want the child method to be invoked instead, you have to make two changes.


    First, you need to declare the parent method as virtual, like this


    `public virtual void CalculateAnnualFee()`


    `{`


    `annualFee = 0;`


    `}`


    The `virtual` keyword tells the compiler that this method may be overridden in
    derived classes. When the compiler encounters this keyword, it’ll look for the
    same method in the derived class and execute that method instead.


    Next, in the derived class, you have to declare that your method overrides the
    method in the parent class using the `override` keyword, like this


    `//In VIPMember child class`


    `public override void CalculateAnnualFee()`


    `{`


    `annualFee = 1200;`


    `}`


    `//In NormalMember child class`


    `public override void CalculateAnnualFee()`


    `{`


    `annualFee = 100 + 12 * 30;`


    `}`


    Now if you run the program again, the annual fee for the first three members (`NormalMember`)
    and the last two members (`VIPMember`) will be $460 and $1200 respectively.


    This is the result of polymorphism. At run time (i.e. when the program runs),
    the program determines that the first three members of `clubMembers` are of `NormalMember`
    type and executes the `CalculateAnnualFee()` method from that class. It also determines
    that the last two members are of `VIPMember` type and executes the method from
    that class.


    Polymorphism simply means that at run time, the program is smart enough to use
    the `CalculateAnnualFee()` method from the correct child class even when that
    object is declared to be of `Member` type.


    We say that the runtime type of the first three elements of `clubMembers` is `NormalMember`
    while the runtime type of the last two elements is `VIPMember`. The declared type
    of all the 5 elements is `Member`.


    GetType() and typeof()


    In the previous example, we let the program determine the run time type of each
    member of the `clubMembers` array and invoke the correct `CalculateAnnualFee()`
    method. However, sometimes, it may be necessary for us to determine the runtime
    type of each individual member ourselves when we code. We’ll see an example of
    that later in our project.


    The `if` statement below shows how you can determine whether the first element
    of the `clubMember` array is of `VIPMember` type at run time:


    `if (clubMembers[0].GetType() == typeof(VIPMember))`


    `Console.WriteLine(“Yes”);`


    `else`


    `Console.WriteLine(“No”);`


    The `GetType()` method returns the runtime type of an object.


    The `typeof()` method takes the name of a data type (e.g. `int`, `float`, or the
    name of a class) and returns the type of that name, which we can then compare
    with the result of the `GetType()` method on the left.


    If you run the code above, you’ll get “No” as the output since `clubMembers[0]`
    is not of `VIPMember` type.


    Abstract Classes and Methods


    Now that we are familiar with inheritance (and polymorphism), let us move on to
    discuss two special types of “parent class” in C# - abstract classes and interfaces.


    First, let’s look at abstract classes.


    An abstract class is a special type of class that is created strictly to be a
    base class for other classes to derive from. They cannot be instantiated. In other
    words, if `FourWheelVehicles` is an abstract class, the statement


    `FourWheelVehicle myVeh = new FourWheelVehicle();`


    will give you an error as you cannot create an object of an abstract class.'
