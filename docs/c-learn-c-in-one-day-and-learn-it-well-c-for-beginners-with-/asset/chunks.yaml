    string[] result = new string[2];

    string path = "staff.txt";

    string[] separator = {", " };

    ```


    接下来，我们使用 `if` 语句和 `File.Exists()` 方法检查文件“staff.txt”是否存在。为了使用 `File.Exists()` 方法，你需要添加指令：


    ```

    using System.IO;

    ```


    如果文件存在，我们使用 `StreamReader` 对象逐行读取文本文件。（如果在此需要帮助，请参考第 11 章）。每当我们读取一行时，我们使用 `Split()`
    方法（参考第 4 章）将该行分成两部分，并将结果存储在 `result` 数组中。


    假设如果管理员人员工作超过 160 小时，他们将在基本工资的基础上获得加班费。尝试使用 `if` 语句来更新管理员人员的 `TotalPay` 属性。


    加班费通过以下公式计算：


    ```

    Overtime = overtimeRate * (HoursWorked - 160);

    ```


    其中 `overtimeRate` 是 `Admin` 类中的一个 `private` 字段，而 `Overtime` 是同类中的一个属性。`HoursWorked`
    是从 `Staff` 类继承的属性。


    完成了吗？


    太棒了！现在，继续编写 `ToString()` 方法。至此，`Admin` 类就写好了。下表显示了该类的摘要。


    ### 字段

