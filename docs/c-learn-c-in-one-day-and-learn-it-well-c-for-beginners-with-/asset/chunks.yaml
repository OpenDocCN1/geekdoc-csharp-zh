    首先，我们根据员工的名字为 `path` 变量赋值。


    记得 `Staff` 类有一个名为 `NameOfStaff` 的属性吗？


    假设 `NameOfStaff = “Yvonne”`，我们想要将字符串“Yvonne.txt”赋值给 `path` 变量。


