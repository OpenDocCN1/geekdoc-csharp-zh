    \ {\n            double d = 5673.74;\n            int i;\n            // cast\
    \ double to int.\n            i = (int)d;\n            Console.WriteLine(i);\n\
    \            Console.ReadKey();\n        }\n    }\n}\n```\n\n执行上述代码后，将产生以下结果：\n\
    \n5673\n\n### C# 中可用的类型转换方法\n\nC# 中已经内置了相当多的类型转换方法：\n\nToBoolean：如果可能，将一种类型转换为布尔值。\n\
    \nToByte：将一种类型转换为 byte。\n\nToChar：如果可能，将一种类型转换为单个 Unicode 字符。\n\nToDateTime：将整数类型或字符串类型转换为日期时间结构。\n\
    \nToDecimal：将浮点类型或整数类型转换为 decimal 数据类型。\n\nToDouble：将一种类型转换为 double 类型。\n\nToInt16：将一种类型转换为\
    \ 16 位整数。\n"
