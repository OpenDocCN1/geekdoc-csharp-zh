  md: '# # Introduction


    First of all, thank you for buying this book, "Programming: Computer Programming
    for Beginners: Learn the Basics of C#". C# was developed by Microsoft under its.NET
    initiative.


    C# or C Sharp as it is pronounced is a programming language. It is a multi-paradigm
    programming language as it supports a variety of programming paradigms such as
    the object oriented discipline. As a result, you enjoy an enormous amount of flexibility
    in choosing a programming style for the task at hand. Moreover, C# is considered
    to be an easy language for beginners looking to take the first step into the huge
    world of computer programming.


    Learning C# opens up a plethora of opportunities to you. From C#, you can take
    a step back and learn the incredible language of C and then C++. Knowledge of
    C# also enables you to pick up the skills necessary for web development through
    the .NET platform. Additionally, this language is also helpful if you are planning
    to develop products for the Microsoft ecosystem down the line.'
