    # Chapter 9

    Working with Arrays and Strings


    As you are working with C#, it is certain that you will come across arrays and
    strings. In fact, you have already used arrays while learning about the for each
    loop. As for strings, they have been used in various examples in the book. It
    is now time to get to know these two a bit better.


    # Getting to Know Arrays


    An array will store a sequential collection of different elements. The collection
    will have a fixed size, and all the elements will be of the same type. They are
    used for storing a collection of data. However, a better way of defining them
    would be to say that they are a collection of variables kept at contiguous memory
    locations.


    Array saves us the trouble of declaring multiple individual variables. Instead,
    we just need to declare a single array variable and then place the values required
    for them. Therefore, we do not have to create a list of variables such as a0,
    a1, a2 and so on.'
  - '[PAGE 111]


    Instead, we create an array a and use a[0], a[1] and a[2] and so on.


    Remember that a specific element present in the array is accessible by means of
    an index. In C#, all arrays will have contiguous memory locations. The lowest
    address will correspond to the first element of the array while the highest address
    belongs to the last element.


    # Declaring Arrays


    In C#, if you wish to declare an array, you will have to make use of the following
    syntax.


    ```

    datatype[] arrayName;

    ```


    Each of the elements the syntax has been discussed as follows.


    +   - the datatype is used in order to specify the datatype of the elements that
    will be present in the array.

    - [] specifies the array’s rank. The rank of an array defines the size of the
    array.

    - arrayName is the name of this array.


    # Initializing Arrays


    Remember that declaring the array will not initialize it in the memory. Only after
    the array variable has been initialized will you be able to assign values to it?
    As the array is a reference'
  - '[PAGE 112]


    type, you will have to use the new keyword in order to create an instance of the
    given array.


    The following example shows you how.


    ```

    double[] balance = new double[10];

    ```


    # Assigning Values to the Array


    It is possible to assign values to individual elements of the array. In order
    to do so, the index number of the element needs to be used. The following example
    illustrates this.


    ```

    double[] balance = new double[10];

    balance[0] = 4500.0;

    ```


    Values can also be assigned to the array when it is being declared.


    ```

    double[] balance = { 2340.0, 4523.69, 3421.0};

    ```'
