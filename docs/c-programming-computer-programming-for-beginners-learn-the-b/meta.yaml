- md: "```markdown\n# Chapter 10\n\n## An Insight to Structures and Enums\n\nNow that\
    \ you have learned about arrays and strings, it is time to take a look at structures\
    \ and enums. They play vital roles in a variety of programs. Therefore, let’s\
    \ find out more about them.\n\n## What is a Structure?\n\nA structure in C# is\
    \ a value type datatype. With it, it becomes possible for a single variable to\
    \ hold related data of different datatypes. To create a structure, you have to\
    \ use the struct keyword. Structures are typically used for representing a record.\n\
    \nLet us take library books as our example in understanding structures better.\
    \ In a library, you will have to keep track of the books. Now, there are various\
    \ attributes you may want to consider while tracking each book such as the title,\
    \ the author, and the subject among others. We will be using this example in the\
    \ programs in the following sections.\n\n## Defining Structures\n\nAs mentioned\
    \ earlier, the struct statement has to be used for the defining structure. This\
    \ statement can define a new datatype that has more than one member.\n\nLet us\
    \ take that example about the books and define a Book structure based on it. The\
    \ following is how it will look like.\n\n```csharp\nstruct Books\n{\n    public\
    \ string title;\n    public string author;\n    public string subject;\n    public\
    \ int book_id;\n};\n```\n\nThe example given below shows you how the structure\
    \ is being used.\n\n```csharp\nusing System;\nstruct Books\n{\n    public string\
    \ title;\n    public string author;\n    public string subject;\n    public int\
    \ book_id;\n};\n\npublic class testStructure\n{\n    public static void Main(string[]\
    \ args)\n    {\n        Books Book1;  /* Declare Book1 of type Book */\n     \
    \   Books Book2;  /* Declare Book2 of type Book */\n\n        /* book 1 specification\
    \ */\n        Book1.title = \"C# Programming\";\n        Book1.author = \"John\
    \ Smith\";\n        Book1.subject = \"C# Programming Tutorial\";\n        Book1.book_id\
    \ = 123456;\n\n        /* book 2 specification */\n        Book2.title = \"Java\
    \ Programming\";\n        Book2.author = \"Jane Smith\";\n        Book2.subject\
    \ = \"Java Programming Tutorial\";\n        Book2.book_id = 456789;\n\n      \
    \  /* print Book1 info */\n        Console.WriteLine( \"Book 1 title : {0}\",\
    \ Book1.title);\n        Console.WriteLine(\"Book 1 author : {0}\", Book1.author);\n\
    \        Console.WriteLine(\"Book 1 subject : {0}\", Book1.subject);\n       \
    \ Console.WriteLine(\"Book 1 book_id :{0}\", Book1.book_id);\n\n        /* print\
    \ Book2 info */\n        Console.WriteLine(\"Book 2 title : {0}\", Book2.title);\n\
    \        Console.WriteLine(\"Book 2 author : {0}\", Book2.author);\n        Console.WriteLine(\"\
    Book 2 subject : {0}\", Book2.subject);\n        Console.WriteLine(\"Book 2 book_id\
    \ : {0}\", Book2.book_id);\n        Console.ReadKey();\n    }\n}\n```\n\nAfter\
    \ compiling and executing the code shown above, the following result will be produced.\n\
    \nBook 1 title : C# Programming\nBook 1 author : John Smith\nBook 1 subject :\
    \ C# Programming Tutorial\nBook 1 book_id : 123456\n\nBook 2 title : Java Programming\n\
    Book 2 author : Jane Smith\nBook 2 subject : Java Programming Tutorial\nBook 2\
    \ book_id : 456789\n\n## The Features of Structures in C#\n\nIn the above examples,\
    \ you made use of a simple structure. If you have already worked with structures\
    \ in C or C++, you should know that the structures in C# are rather different\
    \ from what you find in either of those languages. The features of a structure\
    \ in C# are given as follows.\n\n- It is possible for structures to have fields,\
    \ methods, properties, indexers, events and operator methods.\n- They can have\
    \ defined constructors. However, they cannot have destructors. At the same time,\
    \ it is not possible to define a default constructor for the structure. Default\
    \ constructors will be automatically defined. As such, they cannot be modified.\n\
    - Structures, unlike classes, cannot inherit from the other structures or classes.\n\
    - In the same way, it is not possible to use them as a base for the other classes\
    \ or structures.\n- You cannot specify structure members as virtual, abstract\
    \ or protected.\n- It is possible for structures to implement one or multiple\
    \ interfaces.\n- On creating a struct object with the New operator, it will get\
    \ created, and the right constructor called. It is possible for struct objects\
    \ to be instantiated without the use of the New operator, unlike classes.\n- The\
    \ fields will remain unassigned if you do not use the New operator. As a result,\
    \ the object will be unusable till all you initialize all the fields.\n\n## The\
    \ Difference between Classes and Structures\n\nThere are a few points of difference\
    \ between these two. They are listed as follows.\n\n- Structures are value types\
    \ while classes are of the reference type.\n- Inheritance is not supported by\
    \ structures, unlike classes.\n- Structures cannot have a default constructor.\n\
    \nNow that we know more about structures let us recreate the earlier example on\
    \ the structure Books and get a better understanding.\n\n```csharp\nusing System;\n\
    \nstruct Books\n{\n   private string title;\n   private string author;\n   private\
    \ string subject;\n   private int book_id;\n\n   public void getValues(string\
    \ t, string a, string s, int id)\n   {\n      title = t;\n      author = a;\n\
    \      subject = s;\n      book_id = id;\n   }\n\n   public void display()\n \
    \  {\n      Console.WriteLine(\"Title : {0}\", title);\n      Console.WriteLine(\"\
    Author : {0}\", author);\n      Console.WriteLine(\"Subject : {0}\", subject);\n\
    \      Console.WriteLine(\"Book_id : {0}\", book_id);\n   }\n};\n\npublic class\
    \ testStructure\n{\n    public static void Main(string[] args)\n    {\n      \
    \  Books Book1 = new Books(); /* Declare Book1 of type Book */\n        Books\
    \ Book2 = new Books(); /* Declare Book2 of type Book */\n        \n        /*\
    \ book 1 specification */\n        Book1.getValues(\"C# Programming\", \"John\
    \ Smith\", \"C# Programming Tutorial\", 123456);\n\n        /* book 2 specification\
    \ */\n        Book2.getValues(\"Java Programming\", \"Jane Smith\", \"Java Programming\
    \ Tutorial\", 456789);\n\n        /* print Book1 info */\n        Book1.display();\n\
    \n        /* print Book2 info */\n        Book2.display();\n\n        Console.ReadKey();\n\
    \    }\n}\n```\n\nOn executing the code above, the result will remain the same\
    \ as shown below.\n\nTitle : C# Programming\nAuthor : John Smith\nSubject : C#\
    \ Programming Tutorial\nBook_id : 123456\n\nTitle : Java Programming\nAuthor :\
    \ Jane Smith\nSubject : Java Programming Tutorial\nBook_id : 456789\n\nWith that,\
    \ the section on structures comes to an end. Now, let us take a look at enums.\n\
    \n## What is Enums?\n\nEnums are short for enumerations. An enumeration can be\
    \ said to be a set of named integer constants. The enum keyword is used for declaring\
    \ an enumerated type. In C#, enumerations are of the value datatype. As such,\
    \ an enumeration will contain its own values. It is incapable of inheriting or\
    \ passing inheritance.\n\n## Declaring an enum Variable\n\nGenerally, the syntax\
    \ you need to follow to declare an enumeration is given below.\n\n```csharp\n\
    enum <enum_name>\n{\n    enumeration list\n};\n```\n\nTake a look at what each\
    \ of these elements means.\n\n- **enum_name**: This specifies the name of the\
    \ enumeration type.\n```"
  mdcn: "\n```markdown\n# 第 10 章\n\n## 结构体（Structures）与枚举（Enums）解析\n\n既然你已经学习了数组和字符串，现在是时候来看看结构体和枚举了。它们在各种程序中都起着至关重要的作用。因此，让我们进一步深入了解它们。\n\
    \n## 什么是结构体？\n\nC# 中的结构体是一种值类型（value type）数据类型。通过它，单个变量可以持有不同数据类型的相关数据。要创建结构体，必须使用\
    \ `struct` 关键字。结构体通常用于表示一条记录。\n\n让我们以图书馆书籍为例来更好地理解结构体。在图书馆中，你需要记录书籍信息。在追踪每本书时，你可能需要考虑各种属性，例如书名、作者和主题等。我们将在接下来的章节程序中使用这个示例。\n\
    \n## 定义结构体\n\n如前所述，必须使用 `struct` 语句来定义结构体。该语句可以定义一个具有多个成员的新数据类型。\n\n让我们采用关于书籍的例子，据此定义一个\
    \ `Book` 结构体。其形式如下：\n\n```csharp\nstruct Books\n{\n    public string title;\n\
    \    public string author;\n    public string subject;\n    public int book_id;\n\
    };\n```\n\n下面的示例向你展示了结构体是如何被使用的。\n\n```csharp\nusing System;\nstruct Books\n{\n\
    \    public string title;\n    public string author;\n    public string subject;\n\
    \    public int book_id;\n};\n\npublic class testStructure\n{\n    public static\
    \ void Main(string[] args)\n    {\n        Books Book1;  /* 声明 Book 类型的 Book1\
    \ */\n        Books Book2;  /* 声明 Book 类型的 Book2 */\n\n        /* 书籍 1 详情 */\n\
    \        Book1.title = \"C# Programming\";\n        Book1.author = \"John Smith\"\
    ;\n        Book1.subject = \"C# Programming Tutorial\";\n        Book1.book_id\
    \ = 123456;\n\n        /* 书籍 2 详情 */\n        Book2.title = \"Java Programming\"\
    ;\n        Book2.author = \"Jane Smith\";\n        Book2.subject = \"Java Programming\
    \ Tutorial\";\n        Book2.book_id = 456789;\n\n        /* 打印 Book1 信息 */\n\
    \        Console.WriteLine( \"Book 1 title : {0}\", Book1.title);\n        Console.WriteLine(\"\
    Book 1 author : {0}\", Book1.author);\n        Console.WriteLine(\"Book 1 subject\
