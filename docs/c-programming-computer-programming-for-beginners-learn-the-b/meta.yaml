    \            Console.ReadKey();\n        }\n    }\n}\n```\n\n执行上述代码后，可以得到以下结果。\n\
    \nTotal area: 35\n\n## 基类的初始化\n\n如你所知，派生类将继承基类的成员方法和成员变量。因此，有必要在创建子类之前先创建超类对象。可以在成员初始化列表中提供超类初始化的指令。\n\
    \n以下示例说明了这一点。\n\n```csharp\nusing System;\n\nnamespace RectangleApplication\n\
    {\n    class Rectangle\n    {\n        //member variables\n        protected double\
