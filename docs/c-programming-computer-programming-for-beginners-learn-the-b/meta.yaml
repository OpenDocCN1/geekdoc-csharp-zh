    \   /* long */\n30ul     /* 无符号 long */\n```\n\n### 浮点字面量\n\n这些字面量将由整数部分、小数点、小数部分以及最终的指数组成。可以以十进制形式或指数形式表示浮点字面量。\n\
    \n看看下面的示例，以更好地理解浮点字面量。\n\n```\n3.14159     /* 合法 */\n314159E-5L  /* 合法 */\n510E\
