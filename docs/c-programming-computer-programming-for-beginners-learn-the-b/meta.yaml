- md: "## C# and Multiple Inheritance\n\nMultiple inheritances are not supported by\
    \ C#. On the other hand, it is possible to use interfaces in order to implement\
    \ multiple inheritances. This is demonstrated by the following example.\n\n```csharp\n\
    using System;\nnamespace InheritanceApplication\n{\n    class Shape\n    {\n \
    \       public void setWidth(int w)\n        {\n            width = w;\n     \
    \   }\n\n        public void setHeight(int h)\n        {\n            height =\
    \ h;\n        }\n\n        protected int width;\n        protected int height;\n\
    \    }\n\n    // Base class PaintCost\n    public interface PaintCost\n    {\n\
    \        int getCost(int area);\n    }\n\n    // Derived class\n    class Rectangle\
    \ : Shape, PaintCost\n    {\n        public int getArea()\n        {\n       \
    \     return (width * height);\n        }\n\n        public int getCost(int area)\n\
    \        {\n            return area * 70;\n        }\n    }\n\n    class RectangleTester\n\
    \    {\n        static void Main(string[] args)\n        {\n            Rectangle\
    \ Rect = new Rectangle();\n            int area;\n            Rect.setWidth(5);\n\
    \            Rect.setHeight(7);\n            area = Rect.getArea();\n\n      \
    \      // Print the area of the object.\n            Console.WriteLine(\"Total\
    \ area: {0}\", Rect.getArea());\n            Console.WriteLine(\"Total paint cost:\
    \ {0}\", Rect.getCost(area));\n\n            Console.ReadKey();\n        }\n \
    \   }\n}\n```\n\nThe result produced after executing the code shown above is given\
    \ as follows.\n\nTotal area: 35\n\nTotal paint cost: $2450\n\n## Chapter 12\n\
    Using Constructors and Destructors\n\nIn the book, you will have come across these\
    \ two terms. Well, they are not difficult to grasp. Here, we will be taking a\
    \ look at each of them in turn.\n\n## Constructors in C#\n\nA class constructor\
    \ can be said to be a special member function of the class. This will be executed\
    \ whenever new objects are created by that class. A constructor will have the\
    \ exact same name as its class. There are no return types for a constructor.\n\
    \nThe following example demonstrates constructors.\n\n```csharp\nusing System;\n\
    namespace LineApplication\n{\n    class Line\n    {\n        private double length;\
    \ // Length of a line\n\n        public Line()\n        {\n            Console.WriteLine(\"\
    Object is being created\");\n        }\n\n        public void setLength( double\
    \ len )\n        {\n            length = len;\n        }\n\n        public double\
    \ getLength()\n        {\n            return length;\n        }\n\n        static\
    \ void Main(string[] args)\n        {\n            Line line = new Line();\n\n\
    \            // set line length\n            line.setLength(6.0);\n\n        \
    \    Console.WriteLine(\"Length of line : {0}\", line.getLength());\n\n      \
    \      Console.ReadKey();\n        }\n    }\n}\n```\n\nOn executing the code shown\
    \ above, the following result is produced.\n\n> Object is being created\n\nLength\
    \ of line : 6\n\n### Parameterized Constructors\n\nBy default, a constructor will\
    \ not have any parameters. Be that as it may, you can add parameters to your constructor.\
    \ These constructors are known as parameterized constructors. With the help of\
    \ this technique, you can assign an initial value to a specific object during\
    \ its creation. The following example will show you how.\n\n```csharp\nusing System;\n\
    \nnamespace LineApplication\n{\n    class Line\n    {\n        private double\
    \ length; // Length of a line\n        public Line(double len) // Parameterized\
    \ constructor\n        {\n            Console.WriteLine(\"Object is being created,\
    \ length = {0}\", len);\n            length = len;\n        }\n        public\
    \ void setLength( double len )\n        {\n            length = len;\n       \
    \ }\n        public double getLength()\n        {\n            return length;\n\
    \        }\n    }\n\n    class Program\n    {\n        static void Main(string[]\
    \ args)\n        {\n            Line line = new Line(10.0);\n\n            Console.WriteLine(\"\
    Length of line : {0}\", line.getLength());\n\n            // set line length\n\
    \            line.setLength(6.0);\n\n            Console.WriteLine(\"Length of\
    \ line : {0}\", line.getLength());\n\n            Console.ReadKey();\n       \
    \ }\n    }\n}\n```\n\nThe result produced on executing the code shown above is\
    \ given as follows.\n\nObject is being created; length = 10\n\nLength of line\
    \ : 10\n\nLength of line : 6\n\n## Destructors in C#\n\nLike constructors, a destructor\
    \ is also a special member function of a class. However, it gets executed only\
    \ when one of the objects of the class goes outside of its designated scope. The\
    \ name of the destructor is the exact same as that of its class, but it will have\
    \ a prefixed tilde (~) with it. A destructor is incapable of returning a value\
    \ or taking any parameters. Destructors can be rather beneficial as they can release\
    \ memory resources before the program is exited. It is not possible for destructors\
    \ to be inherited.\n\nThe following example demonstrates the use of destructors.\n\
    \n```csharp\nusing System;\n\nnamespace LineApplication\n{\n    class Line\n \
    \   {\n        private double length;   // Length of a line\n        public Line()\
    \ // constructor\n        {\n            Console.WriteLine(\"Object is being created\"\
    );\n        }\n\n        ~Line() //destructor\n        {\n            Console.WriteLine(\"\
    Object is being deleted\");\n        }\n\n        public void setLength( double\
    \ len )\n        {\n            length = len;\n        }\n\n        public double\
    \ getLength()\n        {\n            return length;\n        }\n\n        static\
    \ void Main(string[] args)\n        {\n            Line line = new Line();\n \
    \           // set line length\n            line.setLength(6.0);\n\n         \
    \   Console.WriteLine(\"Length of line : {0}\", line.getLength());\n        }\n\
    \    }\n}\n```\n\nOn executing the code shown in the above example, the result\
    \ produced is as follows.\n\nObject is being created\n\nLength of line : 6\n\n\
    Object is being deleted\n\nNow you know what constructors and destructors are.\
    \ You are certain to find them useful when you start writing complex programs.\
    \ As such, make sure that you have a thorough understanding.\n\n## Chapter 13\n\
    ## Getting Into Interfaces and Polymorphism\n\nThese are two concepts that you\
    \ should get familiarized with as early as possible. They will be helpful in the\
    \ development of C# programs down the line.\n\n## Introducing Interfaces\n\nAn\
    \ interface can be defined as the syntactical contract which is to be followed\
    \ by all of the classes inheriting that interface. The interface will define the\
    \ ‘what’ section of the contract. The deriving classes will be defining the ‘how’\
    \ section of the syntactical contract.\n\nInterfaces will define the methods,\
    \ properties, and events that are members of it. Another point to note is that\
    \ the interfaces will contain the members’ declaration only. The responsibility\
    \ of defining the members is given to the deriving class. As a result, it ensures\
    \ the presence of a standard structure that can be followed by the deriving classes.\n\
    \n## Declaring an Interface\n\nAn interface can be declared with the interface\
    \ keyword. In fact, it has similarities with the declaration of a class. By default,\
    \ the interface statements will be public. The following example demonstrates\
    \ how an interface is declared.\n\n```csharp\npublic interface ITransactions\n\
    {\n    // interface members\n    void showTransaction();\n    double getAmount();\n\
    }\n```\n\nLet us now take an example to understand how the above interface can\
    \ be implemented.\n\n```csharp\nusing System;\nusing System.Collections.Generic;\n\
    using System.Linq;\nusing System.Text;\n\nnamespace InterfaceApplication\n{\n\
    \    public interface ITransactions\n    {\n        // interface members\n   \
    \     void showTransaction();\n        double getAmount();\n    }\n\n    public\
    \ class Transaction : ITransactions\n    {\n        private string tCode;\n  \
    \      private string date;\n        private double amount;\n\n        public\
    \ Transaction()\n        {\n            tCode = \" \";\n            date = \"\
    \ \";\n            amount = 0.0;\n        }\n\n        public Transaction(string\
    \ c, string d, double a)\n        {\n            tCode = c;\n            date\
    \ = d;\n            amount = a;\n        }\n\n        public double getAmount()\n\
    \        {\n            return amount;\n        }\n\n        public void showTransaction()\n\
    \        {\n            Console.WriteLine(\"Transaction: {0}\", tCode);\n    \
    \        Console.WriteLine(\"Date: {0}\", date);\n            Console.WriteLine(\"\
    Amount: {0}\", getAmount());\n        }\n    }\n\n    class Tester\n    {\n  \
    \      static void Main(string[] args)\n        {\n            Transaction t1\
    \ = new Transaction(\"001\", \"8/10/2012\", 78900.00);\n            Transaction\
    \ t2 = new Transaction(\"002\", \"9/10/2012\", 451900.00);\n            t1.showTransaction();\n\
    \            t2.showTransaction();\n            Console.ReadKey();\n        }\n\
    \    }\n}\n```\n\nOn executing the code shown above, the following result is produced.\n\
    \nTransaction: 001\nDate: 8/10/2012\nAmount: 78900\nTransaction: 002\nDate: 9/10/2012\n\
    Amount: 451900"
  mdcn: "\n## C# 与多重继承\n\nC# 不支持多重继承。但是，可以使用接口来实现多重继承。下面的示例将对此进行演示。\n\n```csharp\n\
    using System;\nnamespace InheritanceApplication\n{\n    class Shape\n    {\n \
