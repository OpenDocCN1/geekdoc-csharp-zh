- md: "## Understanding Properties of a Class\n\nThe job of properties is to enable\
    \ you to control how accessible the variables of a class are. Properties are always\
    \ the recommended way for accessing the variables from outside in any object oriented\
    \ programming languages. You will have already come across the use of properties\
    \ in the previous example.\n\nA property can be said to be a combination of a\
    \ method and a variable. As such, it cannot take any parameters. On the other\
    \ hand, the value can be processed before it is assigned to be returned. A property\
    \ will consist of two sections. There will be a get method and a set method. Both\
    \ of them will be taken together inside the property. You can see an example of\
    \ this in the following code.\n\n```\nprivate string color;\n\npublic string Color\n\
    {\n    get { return color; }\n\n    set { color = value; }\n}\n```\n\nThe get\
    \ method must be used for returning the variable. On the other hand, the set method\
    \ must be used for assigning a value to that variable. Of course, the above example\
    \ is a very simple example of a code involving a property. As such, it is certainly\
    \ possible to extend it further.\n\nThere is another thing that you should understand\
    \ about properties. A property requires at least one method to work. In other\
    \ words, you can use either a get method or a set method. The other method becomes\
    \ optional in these cases. This technique allows you to define read-only properties\
    \ or write-only properties as per your requirements.\n\nHere is another example\
    \ that further illustrates the potential of properties.\n\n```\npublic string\
    \ Color\n{\n    get\n    {\n        return color.ToUpper();\n    }\n\n    set\n\
    \    {\n        if (value == \"Red\")\n            color = value;\n        else\n\
    \            Console.WriteLine(\"This car can only be red!\");\n    }\n}\n```\n\
    \nAs you can see, this is a more complex piece of code featuring a more advanced\
    \ property. Now, you will find that the color variable is going to be returned\
    \ in only uppercase characters. This is due to the addition of the ToUpper() method\
    \ to the variable before it is returned. The next section of the code will set\
    \ the color variable. However, the only value that will be accepted is \"Red\"\
    .\n\n## A Short Guide to Visibility\n\nThroughout this guide, you will have come\
    \ across the terms public and private. You may have been wondering as to what\
    \ they stand for. Well, they are keywords that denote the visibility of the item\
    \ in question.\n\nThe visibility of any item determines how open that item is.\
    \ Visibility can be applied to a class, a property, a variable or even a method.\
    \ The most common types of visibility are private visibility and public visibility.\
    \ However, C# has a number of other types of visibility, all of which are mentioned\
    \ below. Of course, not all of them are going to be useful for you at this stage,\
    \ but you are certain to come across them as you advance in C#.\n\n- **Public:**\
    \ An item defined as the public can be reached from all places; this is the least\
    \ restrictive of all the types of visibilities. By default, items like Interfaces\
    \ and Enums have public visibility.\n- **Private:** This visibility is the most\
    \ restrictive of all the types of visibilities. The private items can only be\
    \ accessed by other items from the same class. By default, structs and classes\
    \ are set to being privately visible.\n- **Internal:** These items can only be\
    \ accessed from inside the same project.\n- **Protected:** Items designated as\
    \ protected can be accessed only from inside the same class or from a class that\
    \ inherits from that class.\n- **Protected internal:** This visibility is similar\
    \ to internal visibility but with a major difference. Classes that inherit from\
    \ the class of the protected internal item can access that item even if the inherited\
    \ classes are present in another project.\n\nYou should now be able to create\
    \ simple classes on your own and even create their properties. Of course, this\
    \ is only the basic level. With practice and further knowledge, you can create\
    \ incredibly complex and awesome programs featuring multiple classes and properties.\n\
    \n## Getting a Grip on Member Functions and Encapsulation\n\nIn a class, a member\
    \ function is a function which has its prototype or definition within the class\
    \ definition in a similar manner to other variables. A member function can operate\
    \ on any object of its class. It also has access to each and every member of the\
    \ class for that object.\n\nOn the other hand, member variables are attributes\
    \ for an object. As such, they will be kept private in order to implement encapsulation.\
    \ They can only be accessed by use of the public member functions.\n\nThe following\
    \ example illustrates the use of class members. Here, the value of the different\
    \ class members is being sought.\n\n```csharp\nusing System;\n\nnamespace BoxApplication\n\
    {\n    class Box\n    {\n        private double length; // Length of a box\n \
    \       private double breadth; // Breadth of a box\n        private double height;\
    \ // Height of a box\n        public void setLength(double len)\n        {\n \
    \           length = len;\n        }\n        public void setBreadth(double bre)\n\
    \        {\n            breadth = bre;\n        }\n        public void setHeight(double\
    \ hei)\n        {\n            height = hei;\n        }\n        public double\
    \ getVolume()\n        {\n            return length * breadth * height;\n    \
