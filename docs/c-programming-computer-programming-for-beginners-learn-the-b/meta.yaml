- md: "## Chapter 3\n### Understanding Data Types and Variables\n\nWhenever you are\
    \ using a programming language, you are certain to come across data types. As\
    \ C# is a strongly typed programming language, it is necessary for you to tell\
    \ the compiler which data types you are going to use every time you want to declare\
    \ a variable. Of course, variables are critical to any programming language.\n\
    \n### Introduction to Data Types\n\nIn C#, data types can be broadly classified\
    \ into three types. They are discussed as follows.\n\n- **Value Type:** These\
    \ data types can be directly assigned a value, and they are derived from the System.ValueType\
    \ class. As such, they contain the data directly. Some examples of value types\
    \ are **char**, **Int**, and **Bool**.\n- **Reference Type:** These data types\
    \ do not have the actual data kept in a variable. Instead, they have a reference\
    \ to the variables. That means that they actually refer to a specific memory location.\
    \ It is possible to use multiple variables to refer to a specific memory location.\
    \ In this case, if one variable changes the data present in the memory location,\
    \ the other variables will automatically reflect the change. Some examples of\
    \ reference types include string, dynamic, and object.\n- **Pointer Types:** These\
    \ data types actually store the memory address of some other type. If you are\
    \ familiar with C++ or C, you will understand that the pointer types in C# will\
    \ have the same capabilities as that of the pointer types in those programming\
    \ languages.\n\n### The Common Data Types\n\nThere are a wide variety of data\
    \ types used in C#. Of course, some of them will be used more often than other\
    \ when you start programming in earnest. As a result, it will benefit you greatly\
    \ if you start learning about the most widely used data types. Here are some of\
    \ them to help you get started.\n\n**Bool:** This is one of simplest data types\
    \ available as it represents Boolean value. As such, it can have only two values,\
    \ either true or false. It is important to understand this type, especially when\
    \ using logical operators such as the 'if statement. By default, its value is\
    \ false.\n\n**Byte:** This data type represents an 8-bit integer that is unsigned.\
    \ It has a range of 0 to 255 when it comes to storing numbers. By default, the\
    \ value of this data type is 0.\n\n**Int:** This is actually short for the integer\
    \ which is a data type used for storing numbers that do not have decimals like\
    \ the byte data type. However, unlike byte, Int has a range of -2,147,483,648\
    \ to 2,147,483,647. If you are working with numbers, you are more likely than\
    \ not to end up using this data type.\n\n**Char:** This data type represents 16-bit\
    \ Unicode character, and it is used for storing only one character.\n\n**String:**\
    \ This can be said to be an upgraded version of the char data type as it can be\
    \ used for storing text. That is, it can store multiple chars instead of a single\
    \ one. In C#, this data type is immutable. In other words, after the creation\
    \ of a string, they are never changed. If you use methods which can change a string,\
    \ a new string is actually returned. The original one is not changed.\n\n### An\
    \ Introduction to Variables\n\nVariables are crucial to programming. In any programming\
    \ language, a variable is actually a storage location which has been associated\
    \ name (referred to as an identifier) and it contains some quantity of information\
    \ which may be unknown or known. This information is referred to as the value.\
    \ The identifier is used for referencing the stored value. During runtime, the\
    \ identifier can be linked to a value, but this value may change as the program\
    \ is being executed.\n\nIn C#, variables are declared in the following syntax:\
    \ <data type> <name>;\n\nHowever, it is possible to assign a value to the variable\
    \ at the same time that you are making it visible. In such cases, you need to\
    \ use the following syntax in order to do so: <visibility> <data type> <name>\
    \ = <value>;\n\nHere is an example application that demonstrates the use of variables.\n\
    \n```csharp\nusing System;\n\nnamespace ConsoleApplication1\n{\n    class Program\n\
