    \ e 或 E 来引入它。\n\n### 字符常量\n\n这些字面量将用单引号括起来。字符常量的一个例子是 'x'。它可以存储在 char 数据类型变量中。字符常量不必总是像\
    \ 'x' 这样的普通字符。它也可以是通用字符，如 '\\u02C0' 或转义序列，如 '\\t'。\n\n### 字符串字面量\n\n这些字面量将用双引号括起来。或者，可以使用\
    \ @\" 来达到相同的效果。字符串常量将包含与字符常量可以包含的相似的字符。也就是说，它们可以包含转义序列、通用字符，当然还有普通字符。如果需要，你可以借助字符串字面量将长行分成几行。各部分将通过空白字符分隔。\n\
    \n看看下面的例子。请注意，所有这些形式都是同一个字符串。\n\n```\n\"hello, dear\"\n\n\"hello, \\\ndear\"\n\
    \n\"hello, \" \"d\" \"ear\"\n\n@\"hello dear\"\n```\n\n### 如何定义常量\n\n既然你知道了常量是什么，是时候开始定义它们了。你需要使用\
    \ const 关键字来定义常量。常量定义的语法如下所示。\n\n```\nconst <data_type> <constant_name> = value;\n\
    ```\n\n以下示例说明了如何在程序中定义常量并使用它。\n\n```\nusing System;\n\nnamespace DeclaringConstants\n\
