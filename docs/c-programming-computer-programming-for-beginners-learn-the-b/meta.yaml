    如前一章所述，任何面向对象编程语言最重要的方面之一就是类。同样地，继承是面向对象编程中的一个关键概念。\n\n由于C#就是这样一种语言，你将不得不尽早开始使用继承。事实上，整个.NET框架都是建立在继承的概念之上的。它负责体现“一切皆对象”的理念。\n\
    \n简而言之，继承使你能够创建可以从其父类继承特定属性的类。在C#中，甚至一个简单的数字也可以是继承自父类 `System.Object` 的类的实例。\n\
    \n对于一些初学者来说，继承可能有点难理解。但是，最好尽早熟悉它，因为它在C#编程中扮演着重要角色。以下是一个说明继承使用的示例。\n\n```csharp\n\
    public class Animal\n{\n    public void Greet()\n    {\n        Console.WriteLine\
    \ (\"Hello! I'm some kind of animal.\");\n    }\n}\n\npublic class Cat: Animal\n\
    {\n}\n```\n\n如你所见，首先定义了一个 `Animal` 类以及一个向用户发出问候的简单方法。接着定义了一个 `Cat` 类。我们现在使用冒号来告知C#，`Cat`\
    \ 类将继承自 `Animal` 类。现在，就可以开始使用这些类了。\n\n```csharp\nAnimal animal = new Animal ();\n\
    animal.Greet ();\n\nDog dog = new Dog ();\ndog.Greet ();\n```\n\n运行上述示例，你会发现 `Greet()`\
    \ 方法被执行了，即使它没有在 `Cat` 类中定义。这是因为该方法已由 `Cat` 类从 `Animal` 类继承而来。\n\n当然，上述示例中的问候语相当模糊。可以自定义问候语以包含动物的名字。这将在下一个示例中展示。\n\
    \n```csharp\npublic class Animal\n{\n    public virtual void Greet()\n    {\n\
    \        Console.WriteLine (\"Hello! I'm some kind of animal.\");\n    }\n}\n\n\
    public class Cat: Animal\n{\n    public override void Greet()\n    {\n       \
    \ Console.WriteLine(\"Hello! I'm a cat.\");\n    }\n}\n```\n\n你可以注意到，上述示例中的代码有一些更改。在\
    \ `Cat` 类上添加了一个方法，并且在 `Animal` 类的方法上添加了 `virtual` 关键字。此外，`Cat` 类上还出现了 `override`\
    \ 关键字。\n\n在C#中，除非一个类项被标记为 `virtual`，否则无法重写它。当然，即使被重写后，也可以借助 `base` 关键字继续访问继承的方法。下面的示例展示了这一点。\n\
    \n```csharp\npublic override void Greet()\n{\n    base.Greet();\n    Console.WriteLine(\"\
    Yes! I am - a cat!\");\n}\n```\n\n然而，方法并不是唯一可以继承的东西。事实上，类的几乎所有成员都会被继承。这包括属性和字段。要确保获得正确的结果，你需要做的是使用正确的可见性，如前面章节所述。\n\
    \n另一件你需要记住的事情是，继承不必从一个类到另一个类。可以有一个完整的类继承层级结构。与前面的示例保持一致，可以创建一个继承自 `Cat` 类的 `Kitten`\
    \ 类，而 `Cat` 类又将继承自 `Animal` 类。\n\n但是，在C#中有一件事你无法做到，那就是多重继承。换句话说，你不能让一个类同时继承多个类。C#不支持此功能。\n\
    \n## 理解基类和派生类的概念\n\n一个类可以从多个类派生。因此，可以从多个基类继承函数和数据。\n\n下面是在C#中创建派生类所使用的语法。\n\n\
    ```csharp\n<acess-specifier> class <base_class>\n{\n    ...\n}\n\nclass <derived_class>\
    \ : <base_class>\n{\n    ...\n}\n```\n\n让我们借助一个示例来更好地理解基类和派生类。在下面的示例中，`Shape`\
    \ 是基类，而 `Rectangle` 是其派生类。\n\n```csharp\nusing System;\nnamespace InheritanceApplication\n\
    {\n    class Shape\n    {\n        public void setWidth(int w)\n        {\n  \
    \          width = w;\n        }\n        public void setHeight(int h)\n     \
