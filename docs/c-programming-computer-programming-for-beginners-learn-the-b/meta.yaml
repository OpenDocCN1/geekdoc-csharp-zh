    \n通常在循环中，会执行某个特定的过程。这可以简单到获取特定的数据项并修改它。之后，检查一个条件。例如，可以检查计数器是否已达到特定数字。如果尚未达到该数字，程序的下一个指令是返回到序列的第一个指令。因此，序列会重复执行。一旦条件得到满足，指令将使程序继续执行下一组顺序指令。也可以从循环中分支出去。\n\
