    \ 字符不是必需的。在编写自己的代码时，请记住这一点。\n\n# switch 语句基础\n\n在编程语言中，switch 语句类似于一种选择控制机制。它通常用于让变量的值通过多路分支来改变程序执行的控制流。可以将\
    \ switch 语句视为一组多个 if 语句。\n\nswitch 语句会列出多种可能性，每种可能性都有自己的动作。还会包含一个默认动作，当没有其他可能性返回\
