- md: " options available from Microsoft, the best of which is Visual Studio. This\
    \ program can be used for working on all the aspects of the .NET framework. This\
    \ is certainly a highly advanced program and is available in a range of editions.\
    \ The complete Visual Studio does cost quite a bit and may be too advanced even\
    \ for hobbyists.\n\nOn the release of the .NET framework, Express versions of\
    \ the product were introduced by Microsoft. These versions are meant for hobby\
    \ programmers and those who are just starting with the .NET framework. The Express\
    \ versions will only work for a single language. They may not have the most advanced\
    \ features of Visual Studio, but they are free. They are also quite easy to use\
    \ for learning the language of your choice which is C# in this case.\n\nThere\
    \ are some other third-party editors available in the market. However, for this\
    \ book, we will be using Visual C# Express for writing the code. You must remember\
    \ that the codes will remain the same irrespective of the editor you are using.\n\
    \n## Chapter 2\n\n## Hello World: Writing Your First C# Program\n\nIf you have\
    \ learned or dabbled in any programming language previous to C#, you will be familiar\
    \ with \"Hello, world!\" This is a basic example that demonstrates the programming\
    \ language in action. This is exactly what you will be learning in this chapter.\n\
    \nThis programming example will illustrate the fundamentals of the programming\
    \ language. You will come across a few functions and classes that you will surely\
    \ be using later while writing more advanced codes.\n\n## Starting a New Project\n\
    \nTo start a new C# project, you should first open Visual C# Express. In the File\
    \ menu, select the New Project option. The project dialog will open where you\
    \ should choose the Console application. This will be the most basic application\
    \ type that you can find on a system running Windows. Click on the Ok option so\
    \ that Visual C# Express can create the new project for you.\n\nYou will also\
    \ notice the creation of a file that has been named as Program.cs. This will be\
    \ the application file where you will be writing the code. You will notice that\
    \ the file already has a few lines of code as shown below.\n\n```\nusing System;\n\
    \nusing System.Collections.Generic;\n\nusing System.Text;\n\nnamespace ConsoleApplication1\n\
    {\n    class Program\nQB\n    {\n        static void Main(string[] args)\n   \
    \     {\n        }\n    }\n}\n```\n\nThese lines of code will most certainly work,\
    \ but the end result is nothing at all. You can run the application if you want\
    \ by pressing the F5 key. This will cause Visual C# Express to compile and then\
    \ execute your code. On execution, a black window will be launched which will\
    \ then close again. This is simply because the application does not have any other\
    \ functions to perform.\n\nIn order to make this program actually do something,\
