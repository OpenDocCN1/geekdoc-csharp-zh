    # Introducing Interfaces


    An interface can be defined as the syntactical contract which is to be followed
    by all of the classes inheriting that interface. The interface will define the
    ‘what’ section of the contract. The deriving classes will be defining the ‘how’
    section of the syntactical contract.


    Interfaces will define the methods, properties, and events that are members of
    it. Another point to note is that the interfaces will contain the members’ declaration
    only. The responsibility of defining the members is given to the deriving class.
    As a result, it ensures the presence of a standard structure that can be followed
    by the deriving classes.'
