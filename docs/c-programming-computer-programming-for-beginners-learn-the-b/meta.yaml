    In fact, the entirety of the .NET framework has been built upon the concept of
    inheritance. It is responsible for the expression that everything is an object.


    Inheritance, in simple terms, enables you to create classes that can inherit specific
    attributes from their parent classes. In C#, even a simple number can be an instance
    of a class that inherits from the parent class, System.Object.


