- md: " ToInt32: A type will be converted into a 32-bit integer.\n\nToInt64: A type\
    \ will be converted into a 64-bit integer.\n\nToSbyte: A type will be converted\
    \ into a signed byte datatype.\n\nToSingle: A type will be converted into a small\
    \ floating point number.\n\nToString: A type will be converted into a string.\n\
    \nToType: A type will be converted into the type specified.\n\nToUInt16: A type\
    \ will be converted into an unsigned int datatype.\n\nToUInt32: A type will be\
    \ converted into an unsigned int data type.\n\nToUInt64: A type will be converted\
    \ into an unsigned big integer.\n\n## Getting a Grip on Constants and Literals\n\
    \nConstants are a reference to fixed values which cannot be changed in any way\
    \ by the program while it is being executed. Another term for these fixed values\
    \ is literals. It is possible to use any basic data type as a constant. Examples\
    \ include character constants, floating constants, integer constants and string\
    \ literals. Enumeration constants also exist.\n\nThe fact is constants will be\
    \ treated in the same manner as that of regular variables with a major difference.\
    \ That is, the values of constants cannot be altered in any way after they have\
    \ been defined. Let us now take a look at each of the varieties of literals and\
    \ constants.\n\n### Integer Literals\n\nIn C#, it is possible for an integer literal\
    \ to be a decimal constant to a hexadecimal constant. The base will be specified\
    \ by a prefix. In the case of hexadecimal constant, the prefix used is 0x or 0X.\
    \ No prefix is used in the case of decimal constants.\n\nIt is also possible for\
    \ an integer literal to have a suffix in a combination of L and U. L represents\
    \ long integers while U is for unsigned. The suffix can be used in the lowercase\
    \ or the uppercase. There are no rules about the order of the suffix.\n\nTake\
    \ a look at the following examples of integer literals.\n\n```\n212      /* Legal\
    \ */\n215u     /* Legal */\n0xFeeL   /* Legal */\n85       /* decimal */\n0x4b\
    \     /* hexadecimal */\n30       /* int */\n30u      /* unsigned int */\n30l\
    \      /* long */\n30ul     /* unsigned long */\n```\n\n### Floating Point Literals\n\
    \nThese literals will be made of an integer part, decimal point, fractional part\
    \ and finally, exponent part. It is possible to represent floating point literals\
    \ in the form of decimals or in the exponential form.\n\nTake a look at the following\
    \ examples to get a better understanding of floating point literals.\n\n```\n\
    3.14159     /* Legal */\n314159E-5L  /* Legal */\n510E        /* Illegal: incomplete\
    \ exponent */\n210f        /* Illegal: no decimal or exponent */\n.e55       \
    \ /* Illegal: missing integer or fraction */\n```\n\nIf you are going to use the\
    \ decimal form for the representation, you must remember to insert the decimal\
    \ point or the exponent. You can even use both if you want. In the case of the\
    \ exponential form, you will have to insert the integer part or the fractional\
    \ part. Both can be used as well. In the case of a signed exponent, you will have\
    \ to use e or E to introduce it.\n\n### Character Constants\n\nThese literals\
    \ will be enclosed in single quotes. An example of a character constant is 'x.'\
    \ It can be stored in a char datatype variable. A character constant need not\
    \ be a plain character like 'x' always. It can also be a universal character like\
    \ '\\u02C0' or an escape sequence like '\\t.'\n\n### String Literals\n\nThese\
    \ literals will be enclosed in double quotes. Alternatively, @\" can be used for\
    \ the same. String constants will be containing characters that are similar to\
    \ what character constants can contain. That is, they can contain escape sequences,\
    \ universal characters and, of course, plain characters. If you want, you can\
    \ break up a long line into several lines with the help of string literals. The\
    \ parts will be separated by means of whitespaces.\n\nTake a look at the following\
    \ example. Notice that all of these forms are the same string.\n\n```\n\"hello,\
    \ dear\"\n\n\"hello, \\\ndear\"\n\n\"hello, \" \"d\" \"ear\"\n\n@\"hello dear\"\
    \n```\n\n### How to Define Constants\n\nNow that you know what constants are,\
    \ it is time to start defining them. You will need to use the const keyword to\
    \ define the constants. The syntax for constant definition is given as follows.\n\
    \n```\nconst <data_type> <constant_name> = value;\n```\n\nThe following example\
    \ illustrates how you can define a constant and use it in a program.\n\n```\n\
    using System;\n\nnamespace DeclaringConstants\n{\n    class Program\n    {\n \
    \       static void Main(string[] args)\n        {\n            const double pi\
    \ = 3.14159;\n            \n            // constant declaration\n            double\
    \ r;\n            Console.WriteLine(\"Enter Radius: \");\n            r = Convert.ToDouble(Console.ReadLine());\n\
    \            double areaCircle = pi * r * r;\n            Console.WriteLine(\"\
    Radius: {0}, Area: {1}\", r, areaCircle);\n            Console.ReadLine();\n \
    \       }\n    }\n}\n```\n\nAfter compiling and executing the code shown above,\
    \ the result produced is given below.\n\n```\nEnter Radius:\n3\nRadius: 3, Area:\
    \ 28.27431\n```\n\n## Discover Nullables\n\nThere is a special data type in C#\
    \ known as nullable types. It is not just the normal range of values that can\
    \ be assigned to these datatypes but also null values.\n\nAs a example, a Nullable<Int32>\
    \ variable can have any value in the range of -2,147,483,648 to 2,147,483,647\
    \ or it can have a null value. In the same way, a Nullable<bool> variable can\
    \ have false, true or null as its value. The syntax for the declaration of a nullable\
