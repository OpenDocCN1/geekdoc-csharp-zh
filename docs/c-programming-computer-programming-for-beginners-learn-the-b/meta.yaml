  mdcn: "\n微软提供了多种选择，其中最好的是 Visual Studio。该程序可用于处理 .NET 框架的所有方面。这确实是一款非常先进的程序，且有多个版本可供选择。完整版的\
    \ Visual Studio 价格相当昂贵，即使对于爱好者来说也可能过于高级。\n\n在 .NET 框架发布时，微软推出了该产品的 Express 版本。这些版本面向爱好编程的初学者以及刚接触\
    \ .NET 框架的人群。Express 版本仅能用于单一语言。它们可能不具备 Visual Studio 最高级的功能，但它们是免费的。对于学习你选择的语言（本例中为\
    \ C#）来说，它们也相当容易上手。\n\n市场上还有一些其他第三方编辑器可供选择。然而，对于本书，我们将使用 Visual C# Express 来编写代码。你必须记住，无论你使用哪种编辑器，代码都将保持不变。\n\
    \n## 第 2 章\n\n## Hello World：编写你的第一个 C# 程序\n\n如果你之前学习过或涉猎过任何编程语言，你一定会熟悉 \"Hello,\
    \ world!\"。这是一个基础的示例，展示了编程语言的实际运作。这正是你将在本章学习的内容。\n\n这个编程示例将说明编程语言的基础知识。你会遇到一些函数和类，它们在以后编写更高级代码时肯定会用到。\n\
    \n## 创建新项目\n\n要启动一个新的 C# 项目，你首先应该打开 Visual C# Express。在\"文件\"菜单中，选择\"新建项目\"选项。项目对话框将会打开，在那里你应该选择\"\
    控制台应用程序\"。这是你可以在 Windows 系统上找到的最基本的应用程序类型。单击\"确定\"选项，以便 Visual C# Express 为你创建新项目。\n\
    \n你还会注意到一个名为 Program.cs 的文件被创建。这将是你要编写代码的应用程序文件。你会注意到该文件已经有一些代码，如下所示。\n\n```\n\
    using System;\n\nusing System.Collections.Generic;\n\nusing System.Text;\n\nnamespace\
    \ ConsoleApplication1\n{\n    class Program\nQB\n    {\n        static void Main(string[]\
    \ args)\n        {\n        }\n    }\n}\n```\n\n这些代码行当然可以运行，但最终结果什么都没有。如果你想运行该应用程序，可以按\
    \ F5 键。这将使 Visual C# Express 编译并执行你的代码。执行时，会弹出一个黑色窗口，然后又会关闭。这仅仅是因为该应用程序没有其他要执行的功能。\n\
    \n为了让这个程序实际做些什么，你需要插入几行代码。你应该在最后那组 `{}` 中输入以下两行代码。\n\n```\nConsole.WriteLine(\"\
    Hello, world!\");\n\nConsole.ReadLine();\n```\n\n输入这些代码行后，你的整个程序应该与以下代码类似。\n\n\
    ```\nusing System;\n\nusing System.Collections.Generic;\n\nusing System.Text;\n\
    \nnamespace ConsoleApplication1\n{\n    class Program\n    {\n        static void\
    \ Main(string[] args)\n        {\n```\n\n```\nConsole.WriteLine(\"Hello, world!\"\
    );\nConsole.ReadLine();\n}\n}\n}\n```\n\n要运行这个程序，你应该再次按 F5。如果没有错误，你会注意到黑色窗口保持打开状态，而不是关闭。在窗口中，你会看到显示的消息\"\
    Hello, world!\"。当然，这是你输入到应用程序中的短语。\n\nC# 被认为是一种非常用户友好的编程语言是有原因的。原因是即使你从未用它编写过程序，也很容易理解大部分代码。在你刚刚编写的程序中，你会很容易注意到这一点。\n\
    \n## 理解 'Hello, world!' 程序\n\n前面的应用程序只是如何编写 C# 程序的一个示例。当然，你需要理解它实际上是如何工作的，以及代码实际意味着什么。这就是你将在本节学习的内容。\n\
    \n要理解这个程序，首先考虑 `{` 和 `}`。毕竟，它们在程序中重复出现了多次。它们被称为花括号。在 C# 中，这些括号表示代码逻辑部分的开始和结束。你会注意到这些括号也经常用于其他一系列编程语言中，如\
    \ Java 和 C++ 等。正如示例所示，它们的主要功能是将属于一起的几行代码组合在一起。\n\n```\nusing System;\n\nusing\
    \ System.Collections.Generic;\n\nusing System.Text;\n```\n\n如果你使用的是 Visual C#\
    \ Express，你会注意到术语 `using` 已被蓝色高亮显示。这实际上是一个关键字，其功能是导入命名空间。类的集合被称为命名空间。类的职责是自动为你提供某些功能。\n\
    \n当你在使用 Visual C# Express 这样的高级 IDE 时，`using` 关键字最终会代替你创建一些琐碎代码的某些部分。在这个例子中，它被用来为你创建一个类。它还导入了必要或预期要使用的命名空间。\n\
    \n在这个例子中，有三个命名空间被导入到程序中。每个命名空间都包含一些有用的类。Console 类已在这个程序中使用，它属于 System 命名空间。\n\n\
    你还会注意到应用程序拥有自己独立的命名空间，如下所示。\n\n## 'Namespace' ConsoleApplication1\n\n这是现在该应用程序的主要命名空间。默认情况下，任何新创建的类都将成为它的一部分。可以修改这一点，并在另一个命名空间下创建其他类。如果你想这样做，需要借助\
    \ `using` 语句将这个命名空间导入到你的应用程序中。\n\n下一步，必须定义类。C# 是一种面向对象的语言。因此，所有实际执行某些操作的代码行都必须保存在类内部。在这个示例中，类被命名为\
    \ Program，如下所示。\n\n## 'Class' Program\n\n在同一个应用程序中可以增加类的数量。然而，对于这个程序来说没有必要。一个类可以包含多个方法、属性和变量。不过，这将在后面讨论。在这个程序中，只有一个方法，声明如下。\n\
    \n## 'Static void Main' (string [] args)\n\n这行的第一个词是 static，它是一个关键字。它指示程序保持该方法可访问，而不需要实例化类。void\
    \ 关键字告诉程序应该返回什么，在这种情况下什么都不返回。\n\n单词 Main 只是给定此方法的名称。在这种情况下，它充当所谓的应用程序入口点。换句话说，这将是程序中第一个被执行的代码部分。\n\
    \n在方法名称声明之后，可以借助括号指定一组参数。在这个例子中，args 是该方法使用的唯一参数。\n\n接下来的两行是实际的程序。在第一行中，使用 Console\
    \ 类通过 `WriteLine` 命令将文本作为输出传递。当然，在这种情况下，文本是 'Hello, world!'。第二行通过 `ReadLine` 命令读取控制台中显示的文本行。\n\
    \nReadLine 命令是必不可少的，因为它使窗口保持打开状态。没有它，应用程序将只是运行并结束。窗口会在你看到输出之前关闭。这个命令的主要功能是让应用程序等待用户的某些输入。在这个例子中，你会发现文本显示后可以输入文本。按\
    \ Enter 键后，窗口将关闭，从而结束程序。\n"
