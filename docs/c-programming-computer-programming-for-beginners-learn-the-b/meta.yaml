  md: '# # A BOOK THAT TEACHES C# IN ABOUT 100 PAGES?


    Learning programming languages quickly and efficiently is vital for beginners
    and pro''s alike.


    Whether you are a seasoned C++ programmer or a beginner working to become a full-fledged
    programmer, C# programming is an essential skill to have. C# is a general purpose
    programming language with tons of real life applications. It''s used for Windows
    Silverlight, mobile development, game development, and third party Windows apps.
    It is well designed, easy to learn, and pleasant to use.


    With **Computer Programming for Beginners: Learn the Basics of C#**, you get everything
    you need to become a C# programmer including:


    +   - How to set up your computer and start a new C# project

    - A basic understanding of data types and variables

    - An introduction to crucial programming principals

    - Essential techniques for software or application development

    - Fundamental concepts used in object-oriented programming

    - How to use methods, arrays, strings, structures, and enums

    - A general understanding of inheritance, interfaces, and polymorphism


    Chapter by chapter, **Joseph Connor** takes you through all the key concepts you
    need to master the fundamentals of C#. But this guide doesn''t stop there. You''ll
    also work through the basics of debugging and get a wealth of expert tips from
    insiders who know all the features and nuances.


    Don''t miss out on the perfect opportunity because you haven''t learned C#. Get
