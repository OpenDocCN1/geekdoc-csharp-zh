    # Chapter 5


    Loop Your Way around C#


    When you are writing software or applications, you will need to use Loops. This
    is an essential technique prevalent in all programming languages. A loop can be
    defined as a sequence of instructions which are repeated continually till a certain
    predefined condition is met. In simple terms, a block of code is repeated a set
    number of times till a condition are fulfilled.


    Generally in a loop, a certain process is performed. This can be as simple as
    fetching a specific data item and modifying it. After it, a condition is checked.
    For example, a counter can be checked to see if it has reached a specific number.
    If the number has not been reached, the next instruction for the program is to
    return to the very first instruction of the sequence. As such, the sequence is
    repeated. Once the condition has been fulfilled, the instruction will cause the
    program to proceed to the next set of sequential instructions. It can also branch
    out from the loop.


    There is a special kind of loop known as an infinite loop. In this loop, there
    is an absence of a functioning exit instruction. As a'
- md: " result, the loop will repeat continually till it is sensed by the operating\
    \ system which will terminate the program and an error will show. The infinite\
    \ loop can also be stopped due to the occurrence of some other event. For example,\
    \ the program can be made to terminate automatically after a specific duration\
    \ of time.\n\nIn C#, you will come across four different kinds of loops. As such,\
    \ you need to be familiar with them.\n\n## The while Loop\n\nThe simplest of the\
    \ four loops in C# is the while loop. In this type of loop, a sequence of instructions\
    \ will be executed continually as long as the defined condition returns true.\
    \ It will only exit when the condition returns false. Here is an example to help\
    \ you understand it.\n\n```\nusing System;\n\nnamespace ConsoleApplication1\n\
    {\n    class Program\n    {\n        static void Main(string[] args)\n       \
    \ {\n            int number = 0;\n\n            while (number < 10)\n        \
    \    {\n                Console.WriteLine (number);\n\n                number\
    \ = number + 1;\n            }\n\n            Console.ReadLine ();\n        }\n\
    \    }\n}\n```\n\nWhen you run this code, you will find that the program lists\
    \ a sequence of numbers in the console starting at 0 and ending at 10.\n\nOf course,\
    \ the variable number is first defined as 0. Every time the loop is executed,\
    \ the variable is incremented by 1. You can see this happening in this statement:\n\
    \n`number = number + 1`\n\nAs a result, the program keeps displaying the numbers\
    \ till it reaches nine which is the last thing to be displayed. You may be wondering\
    \ why nine is being displayed when you have mentioned 10 in the code.\n\nThe condition\
    \ will only be true when the number is less than 10. Once the number becomes 10,\
    \ the condition becomes false. After all, ten is not less than 10. As you can\
    \ see, the condition of the while loop is checked before the program enters the\
    \ loop sequence. Once the number turns 10, the condition becomes false, and the\
    \ while loop sequence is not executed.\n\n## The do Loop\n\nThe do loop shares\
    \ certain similarities with the while loop with one major difference. The while\
    \ loop checks the condition before the loop sequence is executed. On the other\
    \ hand, the do loop will check the condition after the loop has been executed.\
    \ This means the loop sequence will always be executed at least one time before\
    \ exiting. This is not possible with the while loop. Take a look at the following\
    \ example.\n\n```\nusing System;\n\nnamespace ConsoleApplication1\n{\n    class\
    \ Program\n    {\n        static void Main(string[] args)\n        {\n       \
    \     int number = 0;\n            \n            do\n            {\n         \
    \       Console.WriteLine(number);\n                number = number + 1;\n   \
    \         } while (number < 10)\n            Console.ReadLine();\n        }\n\
    \    }\n}\n```\n\nOn running this program, you will see the numbers being displayed\
    \ from 0 to 9. Once the number becomes 10 or more than 10, the program will exit\
    \ the loop sequence. As you can see, the do loop functions in a similar manner\
    \ to the while loop but checks the condition after the execution of a sequence.\n\
    \n## The for Loop\n\nThe for loop is different from that of the do or the while\
    \ loops. The for loop is generally used when you know the exact number of iterations\
    \ that you want. It can also be used when you have defined a variable that contains\
    \ the amount. The following example illustrates the use of the for loop.\n\n```\n\
    using System;\n\nnamespace ConsoleApplication1\n{\n    class Program\n    {\n\
    \        static void Main(string[] args)\n        {\n            int number =\
    \ 10;\n\n            for (int i = 0; i < number; i++)\n                Console.WriteLine(i);\n\
    \n            Console.ReadLine();\n        }\n    }\n}\n```\n\nWhen running this\
    \ program, you will find that the output is the same as that of the previous examples.\
    \ However, the for loop tends to be more compact than the while, and the do loops,\
    \ as you can see.\n\nThere are three parts to the for loop. First, a variable\
    \ is initialized for counting. Then, a conditional statement is defined to test\
    \ the variable. Finally, we increment the counter variable. In C# and a few other\
    \ programming languages, you can use ++ instead of writing the entire statement:\
    \ \"variable = variable + 1\" The result will be the same.\n\nThe first section\
    \ will be executed only once before the actual loop starts. This is the section\
    \ where the variable i is defined and then set to 0. The next two sections will\
    \ be executed for each iteration of the for loop. In each repetition, the variable\
    \ i will be compared to the number variable. When the variable i is less than\
    \ the number variable, the loop will run once again. After the execution, the\
    \ variable i will被指increased by 1. In this case, it will continue to loop till\
    \ variable i become equal to 10.\n\n## The foreach Loop\n\nThe foreach loop is\
    \ quite different from the previous three loops. This loop operates on a collection\
    \ of items. Arrays or other kinds of built-in list types can also be used. For\
    \ the following example, an ArrayList is used as it is one of the simple lists\
    \ available in C#. ArrayList tends to work in a similar to an array.\n\n```\n\
    using System;\nusing System.Collections;\n\nnamespace ConsoleApplication1\n{\n\
    \    class Program\n    {\n        static void Main(string[] args)\n        {\n\
    \            ArrayList list = new ArrayList ();\n            list.Add (\"Dog\"\
