    # ## The Features of Structures in C#


    In the above examples, you made use of a simple structure. If you have already
    worked with structures in C or C++, you should know that the structures in C#
    are rather different from what you find in either of those languages. The features
    of a structure in C# are given as follows.


    +   * It is possible for structures to have fields, methods, properties, indexers,
    events and operator methods.

    * They can have defined constructors. However, they cannot have destructors. At
    the same time, it is not possible to define a default constructor for the structure.
    Default constructors will be automatically defined. As such, they cannot be modified.'
  - '[PAGE 135]


    +   - Structures, unlike classes, cannot inherit from the other structures or
    classes.

    - In the same way, it is not possible to use them as a base for the other classes
    or structures.

    - You cannot specify structure members as virtual, abstract or protected.

    - It is possible for structures to implement one or multiple interfaces.

    - On creating a struct object with the New operator, it will get created, and
    the right constructor called. It is possible for struct objects to be instantiated
    without the use of the New operator, unlike classes.

    - The fields will remain unassigned if you do not use the New operator. As a result,
    the object will be unusable till all you initialize all the fields.


    # The Difference between Classes and Structures


    There are a few points of difference between these two. They are listed as follows.


    +   - Structures are value types while classes are of the reference type.

    - Inheritance is not supported by structures, unlike classes.'
