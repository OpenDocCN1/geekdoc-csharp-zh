    \ 与某个值进行比较，以生成布尔结果。\n\n即使你不了解编程，你也应该能够理解 else 语句的功能。毕竟这是英语的基本用法。else 语句作为 if 语句的伴侣，其作用是在\
    \ if 语句指定的条件未满足时，提供代码执行的替代方案。\n\n为了理解 if 语句和 else 语句在 C# 中的用法，一个示例应用程序会非常有帮助。因此，这里有一个演示\
