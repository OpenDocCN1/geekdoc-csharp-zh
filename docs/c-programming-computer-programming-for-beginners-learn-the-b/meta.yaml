    \ 是该数组的名称。\n\n### 初始化数组\n\n请记住，声明数组并不会在内存中初始化它。只有在数组变量被初始化之后，你才能为其赋值。由于数组是引用类型，因此必须使用\
    \ **new** 关键字来创建给定数组的实例。\n\n下面的示例向你展示了如何操作。\n\n```csharp\ndouble[] balance = new\
    \ double[10];\n```\n\n### 为数组赋值\n\n可以为数组的各个元素赋值。为此，需要使用元素的索引号。下面的示例说明了这一点。\n\n\
