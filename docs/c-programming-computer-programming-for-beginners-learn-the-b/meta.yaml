    \ by means of an index. In C#, all arrays will have contiguous memory locations.\
    \ The lowest address will correspond to the first element of the array while the\
    \ highest address belongs to the last element.\n\n### Declaring Arrays\n\nIn C#,\
    \ if you wish to declare an array, you will have to make use of the following\
    \ syntax.\n\n```csharp\ndatatype[] arrayName;\n```\n\nEach of the elements in\
    \ the syntax is discussed as follows.\n\n- the datatype is used in order to specify\
    \ the datatype of the elements that will be present in the array.\n- [] specifies\
    \ the array’s rank. The rank of an array defines the size of the array.\n- arrayName\
    \ is the name of this array.\n\n### Initializing Arrays\n\nRemember that declaring\
    \ the array will not initialize it in the memory. Only after the array variable\
