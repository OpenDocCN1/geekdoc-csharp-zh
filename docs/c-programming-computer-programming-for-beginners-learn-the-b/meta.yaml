    \        public double getAmount()\n        {\n            return amount;\n  \
    \      }\n\n        public void showTransaction()\n        {\n            Console.WriteLine(\"\
    Transaction: {0}\", tCode);\n            Console.WriteLine(\"Date: {0}\", date);\n\
    \            Console.WriteLine(\"Amount: {0}\", getAmount());\n        }\n   \
    \ }\n\n    class Tester\n    {\n        static void Main(string[] args)\n    \
