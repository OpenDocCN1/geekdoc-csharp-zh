    \n## 第 12 章\n使用构造函数和析构函数\n\n在本书中，你已经遇到过这两个术语。实际上，它们并不难理解。下面我们将逐一进行介绍。\n\n## C#\
    \ 中的构造函数\n\n类构造函数可以说是类的一个特殊成员函数。每当该类创建新对象时，构造函数就会被执行。构造函数的名称与类名完全相同。构造函数没有返回类型。\n\
    \n下面的示例演示了构造函数。\n\n```csharp\nusing System;\nnamespace LineApplication\n{\n  \
    \  class Line\n    {\n        private double length; // Length of a line\n\n \
    \       public Line()\n        {\n            Console.WriteLine(\"Object is being\
    \ created\");\n        }\n\n        public void setLength( double len )\n    \
    \    {\n            length = len;\n        }\n\n        public double getLength()\n\
    \        {\n            return length;\n        }\n\n        static void Main(string[]\
    \ args)\n        {\n            Line line = new Line();\n\n            // set\
    \ line length\n            line.setLength(6.0);\n\n            Console.WriteLine(\"\
    Length of line : {0}\", line.getLength());\n\n            Console.ReadKey();\n\
    \        }\n    }\n}\n```\n\n执行上述代码后，产生如下结果。\n\n> Object is being created\n\n\
    Length of line : 6\n\n### 带参数的构造函数\n\n默认情况下，构造函数没有任何参数。即便如此，你也可以为构造函数添加参数。这类构造函数被称为带参数的构造函数。借助这种技术，你可以在创建特定对象时为其赋一个初始值。下面的示例将向你展示如何实现。\n\
    \n```csharp\nusing System;\n\nnamespace LineApplication\n{\n    class Line\n \
    \   {\n        private double length; // Length of a line\n        public Line(double\
    \ len) // Parameterized constructor\n        {\n            Console.WriteLine(\"\
    Object is being created, length = {0}\", len);\n            length = len;\n  \
    \      }\n        public void setLength( double len )\n        {\n           \
    \ length = len;\n        }\n        public double getLength()\n        {\n   \
    \         return length;\n        }\n    }\n\n    class Program\n    {\n     \
    \   static void Main(string[] args)\n        {\n            Line line = new Line(10.0);\n\
    \n            Console.WriteLine(\"Length of line : {0}\", line.getLength());\n\
    \n            // set line length\n            line.setLength(6.0);\n\n       \
    \     Console.WriteLine(\"Length of line : {0}\", line.getLength());\n\n     \
    \       Console.ReadKey();\n        }\n    }\n}\n```\n\n执行上述代码后，产生如下结果。\n\nObject\
    \ is being created; length = 10\n\nLength of line : 10\n\nLength of line : 6\n\
    \n## C# 中的析构函数\n\n与构造函数类似，析构函数也是类的一个特殊成员函数。然而，它仅在类的某个对象超出其指定作用域时才会执行。析构函数的名称与类名完全相同，但前面会加上一个波浪号（~）前缀。析构函数不能返回值，也不能接受任何参数。析构函数非常有用，因为它们可以在程序退出前释放内存资源。析构函数不能被继承。\n\
    \n下面的示例演示了析构函数的使用。\n\n```csharp\nusing System;\n\nnamespace LineApplication\n\
    {\n    class Line\n    {\n        private double length;   // Length of a line\n\
    \        public Line() // constructor\n        {\n            Console.WriteLine(\"\
    Object is being created\");\n        }\n\n        ~Line() //destructor\n     \
    \   {\n            Console.WriteLine(\"Object is being deleted\");\n        }\n\
    \n        public void setLength( double len )\n        {\n            length =\
    \ len;\n        }\n\n        public double getLength()\n        {\n          \
    \  return length;\n        }\n\n        static void Main(string[] args)\n    \
    \    {\n            Line line = new Line();\n            // set line length\n\
    \            line.setLength(6.0);\n\n            Console.WriteLine(\"Length of\
    \ line : {0}\", line.getLength());\n        }\n    }\n}\n```\n\n执行上述示例中的代码后，产生如下结果。\n\
    \nObject is being created\n\nLength of line : 6\n\nObject is being deleted\n\n\
    现在你已经了解了构造函数和析构函数的概念。当你开始编写复杂程序时，一定会发现它们非常有用。因此，务必确保你对它们有透彻的理解。\n\n## 第 13 章\n\
    深入接口与多态\n\n这两个概念是你需要尽早熟悉的。它们在后续的 C# 程序开发中将大有裨益。\n\n## 接口简介\n\n接口可以定义为所有继承该接口的类都必须遵循的语法契约。接口定义了契约中的\"\
    做什么\"部分，而派生类则定义契约中\"怎么做\"的部分。\n\n接口将定义属于其成员的方法、属性和事件。需要注意的是，接口只包含成员的声明。定义成员的职责交由派生类来完成。因此，接口确保了一种标准结构的存在，派生类都可以遵循该结构。\n\
    \n## 声明接口\n\n接口可以使用 `interface` 关键字来声明。实际上，它与类的声明有相似之处。默认情况下，接口声明为 `public`。下面的示例演示了如何声明接口。\n\
    \n```csharp\npublic interface ITransactions\n{\n    // interface members\n   \
    \ void showTransaction();\n    double getAmount();\n}\n```\n\n现在让我们通过一个示例来了解如何实现上述接口。\n\
    \n```csharp\nusing System;\nusing System.Collections.Generic;\nusing System.Linq;\n\
