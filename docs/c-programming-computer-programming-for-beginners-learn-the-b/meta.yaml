- md: "Amount: 451900\n\n## Starting With Polymorphism\n\nLiterally, polymorphism\
    \ can be defined as having multiple forms. However, in the object oriented programming\
    \ methodology, polymorphism is generally described as having one interface but\
    \ multiple functions. Now, polymorphism can be either static or dynamic.\n\n##\
    \ Static Polymorphism\n\nStatic binding is the mechanism by which a function is\
    \ linked with an object while the program is being compiled. In other words, the\
    \ decision is taken during compile time. In C#, there are two techniques by which\
    \ static polymorphism can be implemented.\n\n- Function overloading\n- Operator\
    \ overloading\n\nThe following example demonstrates function overloading.\n\n\
    The following example shows using function print() to print different data types:\n\
    \n```csharp\nusing System;\n\nnamespace PolymorphismApplication\n{\n    class\
    \ Printdata\n    {\n        void print(int i)\n        {\n            Console.WriteLine(\"\
    Printing int: {0}\", i);\n        }\n\n        void print(double f)\n        {\n\
    \            Console.WriteLine(\"Printing float: {0}\", f);\n        }\n\n   \
    \     void print(string s)\n        {\n            Console.WriteLine(\"Printing\
    \ string: {0}\", s);\n        }\n\n        static void Main(string[] args)\n \
    \       {\n            Printdata p = new Printdata();\n            // Call print\
    \ to print integer\n            p.print(5);\n\n            // Call print to print\
    \ float\n            p.print(500.263);\n\n            // Call print to print string\n\
    \            p.print(\"Hello C++\");\n\n            Console.ReadKey();\n     \
    \   }\n    }\n}\n```\n\nOn executing the code shown above, the following result\
    \ is achieved.\n\nPrinting int: 5\n\nPrinting float: 500.263\n\nPrinting string:\
    \ Hello C++\n\n## Dynamic Polymorphism\n\nIn this kind of polymorphism, the decision\
    \ will be taken at the run time. This is implemented by means of method overriding.\n\
    \nWith method overriding, it is possible to have methods in the derived and base\
    \ classes with the same parameters and the same name. As a result, it becomes\
    \ possible to point to a derived class through a base class's object at runtime.\n\
    \nThe following example illustrates the use of dynamic polymorphism.\n\n```csharp\n\
    using System;\n\nnamespace PolymorphismApplication\n{\n    class Shape\n    {\n\
    \        protected int width, height;\n\n        public Shape( int a=0, int b=0)\n\
    \        {\n            width = a;\n            height = b;\n        }\n\n   \
    \     public virtual int area()\n        {\n            Console.WriteLine(\"Parent\
    \ class area :\");\n            return 0;\n        }\n    }\n\n    class Rectangle:\
    \ Shape\n    {\n        public Rectangle( int a=0, int b=0): base(a, b)\n    \
    \    {\n        }\n\n        public override int area ()\n        {\n        \
    \    Console.WriteLine(\"Rectangle class area :\");\n            return (width\
    \ * height);\n        }\n    }\n\n    class Triangle: Shape\n    {\n        public\
    \ Triangle(int a = 0, int b = 0): base(a, b)\n        {\n        }\n\n       \
    \ public override int area()\n        {\n            Console.WriteLine(\"Triangle\
    \ class area :\");\n            return (width * height / 2);\n        }\n    }\n\
    \n    class Caller\n    {\n        public void CallArea(Shape sh)\n        {\n\
    \            int a;\n            a = sh.area();\n            Console.WriteLine(\"\
    Area: {0}\", a);\n        }\n    }\n\n    class Tester\n    {\n        static\
    \ void Main(string[] args)\n        {\n            Caller c = new Caller();\n\n\
    \            Rectangle r = new Rectangle(10, 7);\n\n            Triangle t = new\
    \ Triangle(10, 5);\n\n            c.CallArea(r);\n\n            c.CallArea(t);\n\
    \n            Console.ReadKey();\n        }\n    }\n}\n```\n\nThe result produced\
    \ after compiling and executing the code shown above is given below.\n\nRectangle\
    \ class area:\n\nArea: 70\n\nTriangle class area:\n\nArea: 25\n\nThis concludes\
    \ the chapter on interfaces and polymorphism. Do not worry about using them at\
    \ the moment. Strengthen your base in C# first.\n\n# Chapter 15\n\n## Learning\
    \ the Basics of Debugging\n\nEven if you have but a slight idea about computer\
    \ programming, you should have heard about debugging. This is a vital process\
    \ for all kinds of software and application programming. You see, there can be\
    \ errors present in a program. These errors can be as simple as a typing mistake\
    \ or an incorrect statement. They are all termed as bugs, and they can prevent\
    \ your program from executing correctly. Therefore these bugs need to be removed,\
    \ and that is achieved through debugging.\n\nWhen you are writing simple applications\
    \ of a few lines such as the examples shown in this book, it is quite easy for\
    \ you to recognize the errors. You can simply execute the program and find out\
    \ the bugs. However, with time, you will surely start writing more complex codes\
    \ that are around hundreds of lines long and filled with complicated statements.\
    \ Due to the high level of complexity involved, it becomes very difficult to determine\
    \ the bugs.\n\nIn these situations, debugging becomes an extremely useful tool.\
    \ As a result, you must take your time to understand this tool to become a better\
    \ programmer. Without it, it is nearly impossible to correct the bugs you can\
    \ find in the complex code.\n\n## Understanding Print Debugging\n\nThe most common\
    \ type of debugging used is known as print debugging. Although it is the most\
    \ basic kind of debugging, it is often used by advanced programmers due to its\
    \ effectiveness in certain situations.\n\nIn print debugging, the application\
    \ is made to print a number or text. This allows you to find out which sections\
    \ of the code have been executed and what are contained in the variables. In C#,\
    \ the Console.Write() method can be used for printing a status message or for\
    \ displaying the contents of a specific variable on the console.\n\nFor a few\
    \ situations, this will be enough. On the other hand, you will have much better\
    \ tools to use when you are using a good IDE such as Visual Studio or even the\
    \ Express versions. The good thing is that they are quite easy to use once you\
    \ know the basic principles.\n\n## Introduction to the Breakpoint\n\nThe breakpoint\
    \ is the first thing that you need to learn about debugging. As the name suggests,\
    \ a breakpoint marks a specific point in the code where its execution will be\
    \ taking a break. The application will not be rendered useless. Instead, the breakpoint\
    \ simply pauses the execution of the application.\n\nIf you are using Visual Studio\
    \ or even the Express version, it is quite easy to implement breakpoints. In those\
    \ IDEs, you will notice that there is a gray area located on the left hand side\
    \ of the code. This is known as the gutter, and a left click on this area will\
    \ cause a red circle to appear. This will be the breakpoint, and the debugger\
    \ will stop the execution of the application at this point.\n\nThese are just\
    \ the basics of debugging. As you advance as a C# programmer, you will automatically\
    \ come to know about the various other kinds of debugging tools and methods apart\
    \ from the most complicated aspects of debugging.\n\n# Chapter 16\n\n### Tips\
    \ for C# Beginners\n\nLike all programming languages, C# has its own nuances and\
    \ features. As a result, it is easy for a beginner to feel overwhelmed with the\
    \ language. For this reason, here are a few tips that can help you overcome some\
    \ of the problems you face as a beginner and take the next step into becoming\
    \ a full-fledged C# programmer.\n\n### Keep Practicing\n\nNobody becomes an expert\
    \ in anything overnight. This is most certainly true of computer programming.\
    \ It will certainly take a lot of time to develop the skills and procure the knowledge\
    \ required for calling yourself an expert. As such, you should remain patient\
    \ and keep practicing C#. At the same time, you should keep practicing a variety\
    \ of tasks within C#.\n\n### Don't Get Hung Up\n\nThis is quite a common problem\
    \ with programmers, even those at the advanced level. The fact is there is rarely\
    \ one best way of doing things in an object oriented programming language like\
    \ C#. Therefore, you should not get fixated on a particular process or technique.\
    \ It is certainly possible that there are other processes which work better.\n\
    \n### Strengthen Your Base\n\nYou may learn to write code, but you must also know\
    \ how each concept or function comes together to make the code work. In other\
    \ words, you need to understand the fundamentals and the basics thoroughly. This\
    \ will enable you to understand why a piece of code works in the way it does and\
    \ what possible bugs are leading to the problem in the execution. Therefore, you\
    \ will become a better developer.\n\n### Learn Some Advanced Ideas Extensively\n\
    \nOf course, you shouldn't expect to master all the advanced techniques and ideas\
    \ in C# within a few months of starting it. However, it will help your progress\
    \ greatly if you take the time to learn a few concepts in detail. You should become\
    \ really good in working with those few concepts. You are free to choose which\
    \ concepts you want to concentrate on. They can be something that you come across\
    \ more often during your work or something that interests you greatly. Trying\
    \ to become an expert in few techniques is easier than trying to master all of\
    \ them.\n\n### Take a Look at Code Written By Senior Programmers\n\nOne of the\
    \ best ways to learn the concepts and techniques in C# is looking at the codes\
    \ written by more experienced programmers."
