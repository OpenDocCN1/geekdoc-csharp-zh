    variable. A character constant need not be a plain character like ‘x’ always.
    It can also be a universal character like ''\u02Co'' or an escape sequence like
    ''\t.''


    # String Literals


    These literals will be enclosed in double quotes. Alternatively, @" can be used
    for the same. String constants will be containing characters that are similar
    to what character constants can contain. That is, they can contain escape sequences,
    universal characters and, of course, plain characters. If you want, you can break
    up a long line into several lines with the help of string literals. The parts
    will be separated by means of whitespaces.


    Take a look at the following example. Notice that all of these forms are the same
    string.


    ```

    "hello, dear"


    "hello, \


    dear"


    "hello, " "d" "ear"


    @"hello dear"

    ```


