    ## Introduction


    First of all, thank you for buying this book, "Programming: Computer Programming
    for Beginners: Learn the Basics of C#". C# was developed by Microsoft under its
    .NET initiative.


    C# or C Sharp as it is pronounced is a programming language. It is a multi-paradigm
    programming language as it supports a variety of programming paradigms such as
    the object oriented discipline. As a result, you enjoy an enormous amount of flexibility
    in choosing a programming style for the task at hand. Moreover, C# is considered
    to be an easy language for beginners looking to take the first step into the huge
    world of computer programming.


    Learning C# opens up a plethora of opportunities to you. From C#, you can take
    a step back and learn the incredible language of C and then C++. Knowledge of
    C# also enables you to pick up the skills necessary for web development through
    the .NET platform. Additionally, this language is also helpful if you are planning
    to develop products for the Microsoft ecosystem down the line.


    Are you feeling overwhelmed with all of this? It might be a lot to take in for
    a beginner. However, you shouldn''t worry too much. This book will help you get
    the fundamental knowledge you need to become a C# programmer. You will learn some
    cool new terms and even a few programs. You will come across some of the terms
    and functions used in this language. In short, you will be prepared thoroughly
    so that you can start advanced courses and become a top notch programmer.


    Let us now get started on learning C#!


    ## Chapter 1


    ### Introduction to C#


    When the .NET framework was originally being developed by Microsoft, and the programmers
    had to write the class libraries with the help of Simple Managed C, a managed
    code compiler system. However, there were a few issues with using C. As a result,
    C# was developed as a new language to overcome these problems.


    C# has been specifically designed to be simple and modern. It is an object-oriented
    and general purpose programming language. If you are already familiar with programming,
    you will easily recognize that C# borrows a range of key concepts for a variety
    of other programming languages, the most notable of which is Java.


    ### The Importance of the .NET Framework


    Theoretically speaking, C# is capable of being compiled to machine code. Be that
    as it may, this language is almost always used alongside the .NET framework in
    real life. For this reason, you need to ensure that the .NET framework has been
    installed on the computer on which you are running the applications that you wrote
    in C#.


    The .NET framework is compatible with a large range of programming languages.
    However, it is C# which is most commonly associated with this framework. It is
    even known as ''THE .NET language'' in some circles. This is probably due to the
    fact that the development of the framework and the language took place at the
    same time.


    ### What Do You Need To Get Started With C# Programming?


    Before you get started on writing C# programs, there are a few things that you
    need to take care of first. Make sure that the following programs have been installed
    on your computer.


    - The .NET Framework Software Development Kit

    - An Editor


    That is all. These are the only two things that you require to start programming
    in C#. There is a wide range of editors available. You can even use Notepad or
    the DOS Editor but more on that later. Be that as it may, it will be better for
    your learning curve if you install either one of the following optional programs.


    - Visual C# .NET

    - Visual C++ 6.0. This is included in the Microsoft Visual Studio 6.0 package.


    Your first step should be to get the .NET SDK installed on your computer. You
    can easily download the program from the official website of Microsoft. You will
    also get a complete documentation of the program along with it. On installing
    this kit, you will be able to compile and execute your source code in C#. This
    is made possible by the Command Line Compiler that has been built into the kit
    along with the runtime Just in Time Compiler. If you have dabbled in Java previously,
    you can recognize them as being similar to the Java Compiler and the Java Interpreter,
    which is available in the Java Development Kit.


    ### About the Editor


    The editor is a program that is used for writing the source codes. C# is versatile
    in this matter as it can be written with the help of nearly any text editor. Even
    the basic Notepad available in Windows is a good choice. For compiling, you can
    easily use csc.exe, the Command Line Compiler available within the .NET framework.


    When it come to developing C# programs with .NET SDK, Notepad is a popular choice.
    On the other hand, it is not the best editor, especially for beginners. After
    all, some useful features such as code numberings and syntax coloring are absent
    in Notepad.


    That is why many developers prefer to use an Integrated Development Environment
    or IDE. There are quite a few'
