- md: "Understanding the Usage of the if Statement\n\nIn C#, you will find that it\
    \ is quite simple to use the if statement. In fact, you will find it very easy\
    \ to use this particular statement if you have used other programming languages\
    \ or are familiar with them.\n\nOne of the most important things that you need\
    \ to know about the if statement is that it requires a Boolean result. In other\
    \ words, the result has to be either true or false. There are a few programming\
    \ languages, and it is possible to convert a number of data types into Booleans.\
    \ This is not the case with C#. In this language, you have to ensure that the\
    \ result has been specifically made Boolean. An example of this would be a statement\
    \ like if(number). This is something you cannot use in C#. However, you can compare\
    \ the ‘number’ to something in order to generate a Boolean result.\n\nEven if\
    \ you do not know programming, you should be able to understand the function of\
    \ the else statement. It is the basics of English after all. The else statement\
    \ serves as a companion to the if statement. Its job is to offer an alternative\
    \ to the execution of the code when the condition stated by the if statement has\
    \ not been met.\n\nIn order to understand how the if statement and the else statement\
    \ is used in C#, an example application can be of great help. As such, here is\
    \ one such example that demonstrates the use of conditional logic in C#.\n\n```csharp\n\
    using System;\n\nnamespace ConsoleApplication1\n{\n    class Program\n    {\n\
    \        static void Main(string[] args)\n        {\n            int number;\n\
    \n            Console.WriteLine(\"Please enter a number between 0 and 10 :\");\n\
    \n            number = int.Parse(Console.ReadLine());\n\n            if (number\
    \ > 10)\n                Console.WriteLine(\"Hey! The number should be 10 or less!\"\
    );\n            else if (number < 0)\n                Console.WriteLine(\"Hey!\
    \ The number should be 0 or more!\");\n            else\n                Console.WriteLine(\"\
    Good job!\");\n\n            Console.ReadLine();\n        }\n    }\n}\n```\n\n\
    As you can see, there are two if statements present in this program along with\
    \ their companion else statements. They have been used for checking if the number\
    \ entered by the user is between 0 and 10 or not.\n\nThe code given in the example\
    \ should be easy to understand. First, the user is requested to enter a number.\
    \ The first if statement checks whether the number is greater than 10. If the\
    \ function returns true, then a message is displayed to the user stating that\
    \ the number should be less than 10. If it is false, the code proceeds to the\
    \ else statement under which the second if statement is present.\n\nThe second\
    \ if statement is used for checking whether the number entered by the user is\
    \ less than 0. If true, a message is displayed telling the user that the number\
    \ must be greater than 0. If false, the program proceeds to the accompanying else\
    \ statement. This statement causes the \"Good job!\" message to be displayed.\n\
    \nAnother important thing you must notice in this program is the lack of the {}\
    \ characters for defining the conditional blocks of code. In C#, if a block contains\
    \ only a single line of code, then the {} characters are not necessary. Do keep\
    \ this mind when you are writing your own code.\n\n# The Basics of the switch\
    \ Statement\n\nIn a programming language, the switch statement is akin to a selection\
    \ control mechanism. It is generally used to let the value of a variable modify\
    \ the control flow of the program execution by means of a multiway branch. Think\
    \ of the switch statement as a set of multiple if statements.\n\nThe switch statement\
    \ will list a number of possibilities, and each possibility will have its own\
    \ action. There will also be a default action which will be taken if no other\
    \ possibility is returned as true. Just like the if statement is accompanied by\
    \ the else statement, the switch statement has a companion in the form of the\
    \ case statement. However, multiple case statements have to be used with a single\
    \ switch statement unlike if else statements.\n\nTake a look at the following\
    \ blocks of code to get a better understanding of switch statements. The example\
    \ given below contains one of the simplest implementations of the switch statement.\n\
    \n```csharp\nint number = 1;\n\nswitch (number)\n{\n    case 0:\n        Console.WriteLine(\"\
    The number is zero!\");\n        break;\n\n    case 1:\n        Console.WriteLine(\"\
    The number is one!\");\n        break;\n}\n```\n\nAs you can see, the identifier\
    \ that has to be checked is placed after the switch keywords. This is followed\
    \ by a list of case statements. These statements check the identifier against\
    \ a specific value.\n\nYou must have noticed that a break statement has been added\
    \ to each case. This is due to the requirements of the programming language. In\
    \ C#, the block has to be left before it comes to an end. If a function was being\
    \ written, a return statement could have been used in the place of the break statement.\n\
    \nThe given example makes use of an integer. However, it is possible to use any\
