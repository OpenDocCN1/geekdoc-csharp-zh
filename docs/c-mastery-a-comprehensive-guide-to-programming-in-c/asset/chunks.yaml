    样式（Styling）和模板（Templating）是 Windows Presentation Foundation (WPF) 的核心方面，允许你自定义
    WPF 应用程序的外观行为。在本节中，我们将探索如何使用样式和模板来创建视觉吸引力且一致的用户界面。


    ### 了解样式


    WPF 中的 `style` 是属性设置的集合，可以应用于多个 UI 元素，以实现统一的外观。样式通过定义一组公共属性值，提升了整个应用程序用户界面的一致性。


    以下是在 XAML 中为所有按钮定义样式的示例：


    ```xml

    <Style TargetType="Button">

    <Setter Property="Background" Value="LightBlue" />

    <Setter Property="Foreground" Value="White" />

    <Setter Property="FontWeight" Value="Bold" />

    </Style>

    ```


    在这段代码中，我们定义了一个针对 `Button` 类型的样式。我们设置了 `Background`、`Foreground` 和 `FontWeight`
    等属性，为应用程序中的所有按钮创建一致的外观。要将此样式应用到按钮，只需在按钮的 `Style` 属性中引用它即可。


    ### 应用样式


    你可以通过设置单个元素的 `Style` 属性来为该元素应用样式。例如：


    ```xml

    <Button Content="Submit" Style="{StaticResource MyButtonStyle}" />

    ```


    在这种情况下，按钮使用了之前定义的 `MyButtonStyle` 进行样式化。


    #### 控件模板


    WPF 中的模板允许你重新定义控件的结构和外观。当你需要创建自定义控件或彻底改变标准控件的外时，这特别有用。WPF 提供了两种模板：控制模板（Control
    Templates）和数据模板（Data Templates）。


    #### 控制模板


    控制模板定义了自定义控件的视觉结构。通过提供新模板，你可以完全重新设计控件的外观。这是一个定义自定义 `Button` 模板的示例：


    ```xml

    <ControlTemplate x:Key="MyButtonTemplate" TargetType="Button">

    <Border Background="LightBlue">

    <ContentPresenter />

    </Border>

    </ControlTemplate>

    ```


    此模板用包含按钮内容的简单 `Border` 替换了按钮的默认外观。


    #### 数据模板


    数据模板用于定义数据对象在 `ListBox`、`ListView` 或 `ItemsControl` 等控件中的显示方式。它们允许你控制集合中每个项的布局。以下是
    `ListBox` 数据模板的示例：


    ```xml

    <ListBox ItemsSource="{Binding Students}">

    <ListBox.ItemTemplate>

    <DataTemplate>

    <StackPanel Orientation="Horizontal">

    <Image Source="{Binding ImageUrl}" Width="40" Height="40" />

    <TextBlock Text="{Binding Name}" Margin="10,0,0,0" />

    </StackPanel>

    </DataTemplate>

    </ListBox.ItemTemplate>

    </ListBox>

    ```


    在此示例中，数据模板指定了每个学生项在 `ListBox` 中的显示方式。


    ### 重用样式和模板


    为了保持一致性并改进代码组织，你可以在资源字典（resource dictionaries）中定义样式和模板，并在整个应用程序重用它们。这允许你轻松地将相同的样式或模板应用于多个元素。


    ### 动态样式


    WPF 还支持动态样式和主题。你可以根据用户偏好或应用程序状态在运行时更改样式和模板，提供更灵活的用户界面。


    ### 总结


    WPF 中的样式和模板使你能够创建视觉吸引力且一致的用户界面。样式帮助你为控件定义通的外外观，而模板则允许你自定义控件和数据项的视觉结构。这些功能是创建现代且吸引人的
    WPF 应用程序的强大工具。


    ## 第 11.5 ：WPF 中的 MVVM 模式


    Model-View-ViewModel (MVVM) 模式是 Windows Presentation Foundation (WPF) 开发中广泛使用的体系模式。它提供了一种结构化的方法来分离应用程序的关注点，并将用户界面（UI）逻辑与业务逻辑实现清晰分离。在本节中，我们将探索
    MVVM 模式以及如何将其应用于 WPF 应用程序。


    ### 了解 MVVM 模式


    MVVM 由三个主要部分组成：


    1. **Model**：`Model` 代表应用程序的数据和业务逻辑。它封装了应用程序的数据并定义了可以对数据执行的规则和操作。

    2. **View**：`View` 代表应用程序的用户界面（UI）。它负责向用户展示数据并接收用户输入。在 WPF 中，`View` 通常使用 XAML
    定义。

    3. **ViewModel**：`ViewModel`充当 `Model` 和 `View` 之间的媒介。它暴露了 `View` 需要的数据和操作，并确保
    `View` 和 `Model` 保持相互独立。`ViewModel` 负责数据绑定、处理用户交互以及更新 `Model`。


    ### MVVM 的核心原则


    #### 数据绑定


    MVVM 的核心原则之一是数据绑定。WPF 提供了强大的数据绑定能力，允许你在 `ViewModel` 和 `View` 之间建立连接。数据绑定确保 `ViewModel`
    中的更改会自动反映在 `View` 中，反之亦然。


    #### 命令（Commands）


    在 MVVM 中，用户交互通过命令来处理。`Commands` 是封装了可以从 `View` 触发的操作或过程的对象。`Commands` 允许你以一种解于
    UI 的方式实现用户交互，使得应用程序更容易测试和维护。


    #### 依赖注入


    MVVM 鼓励使用依赖注入（dependency injection）来为 `ViewModel` 提供必要的依赖，例如服务和仓库。依赖注入促进了应用程序的关注点分离和可测试性。


    ### 创建 ViewModel


    这是一个为学生列表创建 `ViewModel` 的简化示例：


    ```csharp

    public class StudentViewModel : INotifyPropertyChanged

    {

    private ObservableCollection<Student> students;


    public ObservableCollection<Student> Students

    {

    get { return students; }

    set

    {

    students = value;

    OnPropertyChanged(nameof(Students));

    }

    }


    public StudentViewModel()

    {

    // 初始化 ObservableCollection 并从 Model 加载数据

    Students = new ObservableCollection<Student>(DataService.GetStudents());

    }


    // 实现 INotifyPropertyChanged 用于双向数据绑定

    public event PropertyChangedEventHandler PropertyChanged;


    protected virtual void OnPropertyChanged(string propertyName)

    {

    PropertyChanged?.Invoke(this, new PropertyChangedEventArgs(propertyName));

    }

    }

    ```


    在此示例中，`StudentViewModel` 暴露了学生集合并从 Model 初始化数据。它还实现了 `INotifyPropertyChanged`
    接口以通知属性更改。


    ### 绑定 View


    在 `View`（使用 XAML 定义）中，你可以绑定到 `ViewModel` 中定义的属性和命令。以下是数据绑定的 XAML 代码：


    ```xml

    <ListBox ItemsSource="{Binding Students}">

    <ListBox.ItemTemplate>

    <DataTemplate>

    <TextBlock Text="{Binding Name}" />

    </DataTemplate>

    </ListBox.ItemTemplate>

    </ListBox>

    ```


    在这个 XAML 中，`ListBox` 的 `ItemsSource` 绑定到 `ViewModel` 的 `Students` 属性，`TextBlock`
    的 `Text` 属性绑定到每个学生的 `Name` 属性。


    ### MVVM 的优势


    MVVM 模式具有许多优势：


    - **关注点分离**：MVVM 强制了 Model、View 和 ViewModel 之间关注点的清晰分离，使应用程序更易维护和可测试。

    - **可测试性**：由于 ViewModel 独立于 View 包含应用程序逻辑，为 ViewModel 编写单元测试变得更容易。

    - **灵活性**：MVVM 允许 UI 设计具有更大的灵活性，并通过 ViewModel 促进代码复用。

    - **协作开发**：多个开发者可以同时处理 View 和 ViewModel，促进协作开发。


