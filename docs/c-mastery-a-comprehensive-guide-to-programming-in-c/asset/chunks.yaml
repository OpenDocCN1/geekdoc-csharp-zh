    \n1. `OneWay`：在此模式下，数据从源（例如属性）流向目标（例如 UI 控件），但目标的变化不会影响源。这是一种只读绑定。\n2. `TwoWay`：此模式启用双向数据绑定。源的变化反映在目标中，目标的变化也会回传到源。\n\
    3. `OneTime`：数据仅在最初建立绑定时从源传输到目标。源的后续变化不会反映在目标中。\n4. `OneWayToSource`：与 `OneWay`\
    \ 类似，数据从目标流向源。目标的变化反映在源中，但反过来不会。\n\n### 数据绑定语法\n\n在 WPF 中，你可以使用简洁且表达性的语法在 `XAML`\
    \ 中定义数据绑定。这是一个 `TextBlock` 控件数据绑定的基本示例：\n\n```xml\n<TextBlock Text=\"{Binding\
    \ UserName}\" />\n```\n\n在此示例中，`TextBlock` 的 `Text` 属性绑定到了 `UserName` 属性。\n\n\
    ### DataContext 与绑定\n\n为了启用数据绑定，你通常会将 UI 元素的 `DataContext` 属性设置为一个提供数据的对象。例如，你可能会将窗口的\
    \ `DataContext` 设置为模型类的实例。这样，窗口内的 UI 控件就可以绑定到模型的属性。\n\n### 与集合的数据绑定\n\n数据绑定在处理集合（如数据列表或数组）时非常强大。你可以将\
    \ UI 控件（如 `ListBox` 或 `DataGrid`）绑定到集合，并使其自动显示项目。\n\n```xml\n<ListBox ItemsSource=\"\
    {Binding Students}\" DisplayMemberPath=\"Name\" />\n```\n\n在此示例中，`ListBox` 绑定到了学生集合。`Students`\
    \ 集合中的任何变化都会反映在 `ListBox` 中。\n\n### 实现 INotifyPropertyChanged\n\n为了让数据绑定生效，数据源对象应实现\
    \ `INotifyPropertyChanged` 接口。该接口允许对象在属性更改时通知 UI，以便 UI 相应更新。\n\n```csharp\npublic\
    \ class Student : INotifyPropertyChanged\n{\n    private string name;\n    public\
