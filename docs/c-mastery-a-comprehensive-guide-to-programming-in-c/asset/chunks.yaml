  trans: "\n\n在这个 XML 序列化示例中，我们使用 `XmlSerializer` 将 `Person` 对象序列化并反序列化到 XML 文件中。\n\
    \nJSON 序列化和反序列化也可以通过 `System.Text.Json` 命名空间中的 `JsonSerializer` 实现实现。这些序列化格式更具可读性，并广泛用于\
    \ Web API 和数据交换。\n\n序列化和反序列化是 C# 中保存应用程序数据以及在不同组件和系统之间共享数据的关键技术。选择合适的序列化格式取决于你的使用场景和需求。\n\
    \n## 第 7.4 ：处理 XML 和 JSON 数据\n\n`XML`（可扩展标记语言）和 `JSON`（JavaScript 对象表示法）是两种常用的数据交换格式。在\
    \ C# 中，你可以出于各种目的处理 `XML` 和 `JSON` 数据，例如配置文件、Web 服务通信和数据存储。本节将探索如何在 C# 中处理 `XML`\
    \ 和 `JSON` 数据。\n\n### 处理 XML 数据\n\nC# 提供了用于解析和操作 `XML` 数据的库。`System.Xml` 命名空间包含了\
    \ `XmlDocument`、`XmlReader` 和 `XmlWriter` 等类，用于处理 `XML` 数据。\n\n以下是一个使用 `XmlDocument`\
    \ 读写 `XML` 数据的示例：\n\n```csharp\nusing System;\nusing System.Xml;\n\nclass Program\n\
    {\n    static void Main()\n    {\n        // 创建 XML 文档\n        XmlDocument xmlDoc\
    \ = new XmlDocument();\n        xmlDoc.LoadXml(\"<book><title>C# Programming</title><author>John\
    \ Doe</author></book>\");\n\n        // 读取 XML 数据\n        XmlNode titleNode =\
    \ xmlDoc.SelectSingleNode(\"/book/title\");\n        string title = titleNode.InnerText;\n\
    \        XmlNode authorNode = xmlDoc.SelectSingleNode(\"/book/author\");\n   \
    \     string author = authorNode.InnerText;\n        Console.WriteLine($\"Title:\
    \ {title}\");\n        Console.WriteLine($\"Author: {author}\");\n\n        //\
    \ 修改 XML 数据\n        titleNode.InnerText = \"Advanced C# Programming\";\n\n  \
    \      // 保存修改后的 XML\n        xmlDoc.Save(\"book.xml\");\n        Console.WriteLine(\"\
    XML data saved.\");\n    }\n}\n```\n\n在这个示例中，我们创建了一个 XML 文档，从其中读取数据，修改数据，然后将其保存回文件。\n\
    \n### 处理 JSON 数据\n\n要在 C# 中处理 JSON 数据，可以使用 `System.Text.Json` 命名空间。它提供了如 `JsonSerializer`\
    \ 等类，用于 JSON 数据的序列化和反序列化。\n\n以下是一个处理 JSON 数据的示例：\n\n```csharp\nusing System;\n\
    using System.Text.Json;\n\nclass Program\n{\n    public class Person\n    {\n\
    \        public string Name { get; set; }\n        public int Age { get; set;\
    \ }\n    }\n\n    static void Main()\n    {\n        // 序列化为 JSON\n        Person\
    \ person = new Person { Name = \"Alice\", Age = 28 };\n        string json = JsonSerializer.Serialize(person);\n\
    \        Console.WriteLine($\"JSON: {json}\");\n\n        // 从 JSON 反序列化\n   \
    \     Person deserializedPerson = JsonSerializer.Deserialize<Person>(json);\n\
    \        Console.WriteLine($\"Name: {deserializedPerson.Name}, Age: {deserializedPerson.Age}\"\
    );\n    }\n}\n```\n\n在这个 JSON 示例中，我们定义了一个 `Person` 类，将其实例序列化为 JSON，然后将其反序列化回 C#\
    \ 对象。\n\n`XML` 和 `JSON` 都是多功能的数据交换格式。选择最符合你应用程序需求并能与你可能交互的其他系统或服务无缝集的格式。C# 对两种格式都提供了很好的支持，使得处理\
    \ XML 和 JSON 数据变得简单。\n\n## 第 7.5 ：数据库连接与 ADO.NET\n\n数据库连接是许多软件应用程序的关键方面。C# 提供了\
    \ `ADO.NET`（.NET 的 ActiveX 数据对象）框架用于与关系型数据库交互。`ADO.NET` 允许你连接数据库、执行查询以及检索和操作数据。在本节中，我们将探索如何在\
    \ C# 中使用 `ADO.NET` 操作数据库。\n\n### 连接数据库\n\n要使用 `ADO.NET` 连接数据库，你需要指定包含数据库服务器信息、身份验证凭据和数据库本身信息的连接字符串。以下是一个连接\
    \ SQL Server 数据库的示例：\n\n```csharp\nusing System;\nusing System.Data.SqlClient;\n\
    \nclass Program\n{\n    static void Main()\n    {\n        string connectionString\
    \ = \"Server=myServer;Database=myDatabase;User Id=myUser;Password=myPassword;\"\
    ;\n        using (SqlConnection connection = new SqlConnection(connectionString))\n\
    \        {\n            connection.Open();\n            Console.WriteLine(\"Connected\
    \ to the database.\");\n            // 在此处执行数据库操作\n            connection.Close();\n\
    \            Console.WriteLine(\"Connection closed.\");\n        }\n    }\n}\n\
    ```\n\n在这个示例中，我们创建了一个 `SqlConnection` 对象并使用指定的 `connectionString` 打开连接。你应该将 `myServer`、`myDatabase`、`myUser`\
    \ 和 `myPassword` 替换为实际的数据库服务器信息和凭据。\n\n### 执行 SQL 查询\n\n`ADO.NET` 允许你对数据库执行 SQL\
    \ 查询。你可以使用 `SqlCommand` 来定义和执行 SQL 命令。以下是一个执行简单的 SQL 查询从 SQL Server 数据库检索数据的示例：\n\
    \n```csharp\nusing System;\nusing System.Data.SqlClient;\n\nclass Program\n{\n\
    \    static void Main()\n    {\n        string connectionString = \"Server=myServer;Database=myDatabase;User\
    \ Id=myUser;Password=myPassword;\";\n        using (SqlConnection connection =\
    \ new SqlConnection(connectionString))\n        {\n            connection.Open();\n\
    \            Console.WriteLine(\"Connected to the database.\");\n            //\
    \ 在此处执行 SQL 查询\n            string query = \"SELECT FirstName, LastName FROM Employees\"\
    ;\n            using (SqlCommand command = new SqlCommand(query, connection))\n\
    \            {\n                SqlDataReader reader = command.ExecuteReader();\n\
    \                while (reader.Read())\n                {\n                  \
    \  Console.WriteLine($\"First Name: {reader[\"FirstName\"]}, Last Name: {reader[\"\
    LastName\"]}\");\n                }\n                reader.Close();\n       \
    \     }\n            connection.Close();\n            Console.WriteLine(\"Connection\
    \ closed.\");\n        }\n    }\n}\n```\n\n在这个示例中，我们执行了一个 `SELECT` 查询从 `Employees`\
    \ 表中检索数据。\n\n### 参数化查询与安全\n\n在处理 SQL 查询时，使用参数化查询防止 SQL 攻击至关重要。参数化查询将 SQL 代码与用户输入分离，使其更加安全。以下是一个参数化查询的示例：\n\
    \n```csharp\nusing System;\nusing System.Data.SqlClient;\n\nclass Program\n{\n\
    \    static void Main()\n    {\n        string connectionString = \"Server=myServer;Database=myDatabase;User\
    \ Id=myUser;Password=myPassword;\";\n        using (SqlConnection connection =\
    \ new SqlConnection(connectionString))\n        {\n            connection.Open();\n\
    \            Console.WriteLine(\"Connected to the database.\");\n            //\
    \ 参数化查询\n            string query = \"SELECT FirstName, LastName FROM Employees\
    \ WHERE Department = @Department\";\n            using (SqlCommand command = new\
    \ SqlCommand(query, connection))\n            {\n                command.Parameters.AddWithValue(\"\
    @Department\", \"HR\");\n                SqlDataReader reader = command.ExecuteReader();\n\
    \                while (reader.Read())\n                {\n                  \
    \  Console.WriteLine($\"First Name: {reader[\"FirstName\"]}, Last Name: {reader[\"\
    LastName\"]}\");\n                }\n                reader.Close();\n       \
    \     }\n            connection.Close();\n            Console.WriteLine(\"Connection\
    \ closed.\");\n        }\n    }\n}\n```\n\n在这个示例中，我们使用 `@Department` 参数根据参数指定的部门来过滤结果。\n\
    \n"
- fmt: "\n# Understanding Network Communication\n\nNetwork communication involves\
    \ the exchange of data between different devices or applications. This communication\
    \ can be between a client and a server, two peers in a peer-to-peer network, or\
    \ even communication with external web services. In C#, you can use classes from\
    \ the `System.Net` namespace to work with network-related tasks.\n\nHere are some\
    \ common scenarios in which network communication is essential:\n\n1. Client-Server\
    \ Communication: Applications often follow a client-server architecture, where\
    \ the client requests information or services from a server. This is common in\
    \ web applications, where a web browser (client) communicates with a web server\
    \ to fetch web pages or data.\n2. Peer-to-Peer Communication: In peer-to-peer\
    \ networks, devices communicate directly with each other without a centralized\
    \ server. This is seen in applications like file sharing or online gaming.\n3.\
    \ Web Service Integration: Many modern applications integrate with web services\
    \ to access data or functionality provided by external services. This includes\
    \ using APIs (Application Programming Interfaces) to interact with services such\
    \ as social media platforms, payment gateways, and more.\n\n## Basic Networking\
    \ Tasks\n\nC# provides classes like `TcpClient`, `TcpListener`, `UdpClient`, and\
    \ `HttpWebRequest` to handle various aspects of network communication. Here’s\
    \ a brief overview of some basic networking tasks you can perform in C#:\n\n*\
    \ TCP and UDP Communication: You can use `TcpClient` and `TcpListener` for TCP\
    \ (Transmission Control Protocol) communication and `UdpClient` for UDP (User\
    \ Datagram Protocol) communication. These classes allow you to establish connections,\
    \ send and receive data, and handle network streams.\n* HTTP Communication: The\
    \ `HttpWebRequest` and `HttpWebResponse` classes provide high-level abstractions\
    \ for sending HTTP requests and receiving responses. This is useful for interacting\
    \ with RESTful APIs and web services.\n* Socket Programming: For more advanced\
    \ network tasks, C# allows low-level socket programming using the `Socket` class.\
    \ This is especially useful when you need fine-grained control over network operations.\n\
    * Asynchronous Programming: Networking operations often involve waiting for responses,\
    \ which can lead to blocking code. C# supports asynchronous programming using\
    \ the `async` and `await` keywords, allowing you to perform network operations\
    \ without blocking the main thread.\n* Error Handling: Proper error handling is\
    \ crucial in network programming. You need to handle exceptions that may occur\
    \ during network operations gracefully.\n\nIn the upcoming sections of this chapter,\
    \ we will delve deeper into these topics and provide practical examples of network\
    \ programming in C#. Understanding network communication is essential for building\
    \ applications that interact with remote services or devices, making it a valuable\
    \ skill for C# developers.\n\n## Section 8.2: Creating TCP and UDP Clients and\
    \ Servers\n\nIn this section, we will explore how to create both TCP (Transmission\
    \ Control Protocol) and UDP (User Datagram Protocol) clients and servers using\
    \ C#. TCP and UDP are two of the most commonly used transport layer protocols\
    \ for network communication, each with its own characteristics and use cases.\n\
    \n### TCP Communication\n\nTCP is a connection-oriented protocol that provides\
    \ reliable, stream-oriented communication. It ensures that data sent from one\
    \ end is received by the other end in the correct order and without loss. TCP\
    \ is commonly used for applications where data integrity is crucial, such as web\
    \ browsing, email, and file transfer.\n\n#### Creating a TCP Server\n\nTo create\
    \ a TCP server in C#, you can use the `TcpListener` class. Here’s a simple example\
    \ of how to create a TCP server that listens for incoming connections and handles\
    \ client requests:\n\n```csharp\nusing System;\nusing System.Net;\nusing System.Net.Sockets;\n\
    using System.Text;\n\nclass TcpServer\n{\n    static void Main()\n    {\n    \
    \    // Set the IP address and port to listen on\n        IPAddress ipAddress\
    \ = IPAddress.Parse(\"127.0.0.1\");\n        int port = 12345;\n        // Create\
    \ a TcpListener\n        TcpListener server = new TcpListener(ipAddress, port);\n\
    \        // Start listening for incoming connections\n        server.Start();\n\
    \        Console.WriteLine(\"TCP Server is listening...\");\n\n        while (true)\n\
    \        {\n            // Accept the client connection\n            TcpClient\
    \ client = server.AcceptTcpClient();\n            Console.WriteLine(\"Client connected\"\
    );\n            // Get the client's network stream for reading and writing\n \
    \           NetworkStream stream = client.GetStream();\n            // Read data\
    \ from the client\n            byte[] buffer = new byte[1024];\n            int\
    \ bytesRead = stream.Read(buffer, 0, buffer.Length);\n            string dataReceived\
    \ = Encoding.ASCII.GetString(buffer, 0, bytesRead);\n            Console.WriteLine($\"\
    Received: {dataReceived}\");\n            // Send a response to the client\n \
    \           string responseMessage = \"Hello from the server!\";\n           \
    \ byte[] responseData = Encoding.ASCII.GetBytes(responseMessage);\n          \
    \  stream.Write(responseData, 0, responseData.Length);\n            // Close the\
    \ client connection\n            client.Close();\n            Console.WriteLine(\"\
    Client disconnected\");\n        }\n    }\n}\n```\n\nIn this example, the server\
    \ listens on IP address `127.0.0.1` and port `12345`. It accepts incoming client\
    \ connections, reads data from the client, sends a response, and then closes the\
    \ connection.\n\n#### Creating a TCP Client\n\nTo create a TCP client in C#, you\
    \ can use the `TcpClient` class. Here’s a simple example of how to create a TCP\
    \ client that connects to a server and sends data:\n\n```csharp\nusing System;\n\
    using System.Net.Sockets;\nusing System.Text;\n\nclass TcpClientExample\n{\n \
    \   static void Main()\n    {\n        // Set the server's IP address and port\n\
    \        string serverIp = \"127.0.0.1\";\n        int serverPort = 12345;\n \
    \       using (TcpClient client = new TcpClient(serverIp, serverPort))\n     \
    \   {\n            Console.WriteLine(\"Connected to the server\");\n         \
    \   // Get the network stream for reading and writing\n            NetworkStream\
    \ stream = client.GetStream();\n            // Send data to the server\n     \
    \       string message = \"Hello from the client!\";\n            byte[] data\
    \ = Encoding.ASCII.GetBytes(message);\n            stream.Write(data, 0, data.Length);\n\
    \            // Read the server's response\n            byte[] buffer = new byte[1024];\n\
    \            int bytesRead = stream.Read(buffer, 0, buffer.Length);\n        \
    \    string response = Encoding.ASCII.GetString(buffer, 0, bytesRead);\n     \
    \       Console.WriteLine($\"Server Response: {response}\");\n        }\n    }\n\
    }\n```\n\nIn this example, the client connects to the server using the specified\
    \ IP address and port, sends a message, and receives a response.\n\n### UDP Communication\n\
    \nUDP is a connectionless protocol that provides fast, lightweight communication.\
    \ Unlike TCP, UDP does not guarantee data delivery or order. It is often used\
    \ in scenarios where low overhead and real-time communication are more important\
    \ than reliability, such as online gaming and streaming.\n\n#### Creating a UDP\
    \ Server and Client\n\nTo create a UDP server and client in C#, you can use the\
    \ `UdpClient` class. Here’s a simple example of a UDP server that listens for\
    \ incoming datagrams and a UDP client that sends datagrams to the server:\n\n\
    ```csharp\nusing System;\nusing System.Net;\nusing System.Net.Sockets;\nusing\
    \ System.Text;\n\nclass UdpServerAndClient\n{\n    static void Main()\n    {\n\
    \        int port = 12345;\n        // UDP server\n        using (UdpClient server\
    \ = new UdpClient(port))\n        {\n            Console.WriteLine(\"UDP Server\
    \ is listening...\");\n            IPEndPoint clientEndPoint = new IPEndPoint(IPAddress.Any,\
    \ 0);\n            while (true)\n            {\n                byte[] receivedData\
    \ = server.Receive(ref clientEndPoint);\n                string message = Encoding.ASCII.GetString(receivedData);\n\
    \                Console.WriteLine($\"Received from {clientEndPoint}: {message}\"\
    );\n                // Respond to the client\n                string responseMessage\
    \ = \"Hello from the UDP server!\";\n                byte[] responseData = Encoding.ASCII.GetBytes(responseMessage);\n\
    \                server.Send(responseData, responseData.Length, clientEndPoint);\n\
    \            }\n        }\n\n        // UDP client\n        using (UdpClient client\
    \ = new UdpClient())\n        {\n            string serverIp = \"127.0.0.1\";\n\
    \            IPEndPoint serverEndPoint = new IPEndPoint(IPAddress.Parse(serverIp),\
    \ port);\n            // Send a message to the server\n            string message\
    \ = \"Hello from the UDP client!\";\n            byte[] data = Encoding.ASCII.GetBytes(message);\n\
    \            client.Send(data, data.Length, serverEndPoint);\n        }\n    }\n\
    }\n```\n"
  raw: '### Understanding Network Communication


    Network communication involves the exchange of data between different devices
    or applications. This communication can be between a client and a server, two
    peers in a peer-to-peer network, or even communication with external web services.
    In C#, you can use classes from the System.Net namespace to work with network-related
    tasks.


    Here are some common scenarios in which network communication is essential:


    1.  Client-Server Communication: Applications often follow a client-server architecture,
    where the client requests information or services from a server. This is common
    in web applications, where a web browser (client) communicates with a web server
    to fetch web pages or data.


    2.  Peer-to-Peer Communication: In peer-to-peer networks, devices communicate
    directly with each other without a centralized server. This is seen in applications
    like file sharing or online gaming.


    3.  Web Service Integration: Many modern applications integrate with web services
    to access data or functionality provided by external services. This includes using
    APIs (Application Programming Interfaces) to interact with services such as social
    media platforms, payment gateways, and more.


    ### Basic Networking Tasks


    C# provides classes like TcpClient, TcpListener, UdpClient, and HttpWebRequest
    to handle various aspects of network communication. Here’s a brief overview of
    some basic networking tasks you can perform in C#:


    • TCP and UDP Communication: You can use TcpClient and TcpListener for TCP (Transmission
    Control Protocol) communication and UdpClient for UDP (User Datagram Protocol)
    communication. These classes allow you to establish connections, send and receive
    data, and handle network streams.


    • HTTP Communication: The HttpWebRequest and HttpWebResponse classes provide high-level
    abstractions for sending HTTP requests and receiving responses. This is useful
    for interacting with RESTful APIs and web services.


    • Socket Programming: For more advanced network tasks, C# allows low-level socket
    programming using the Socket class. This is especially useful when you need fine-grained
    control over network operations.


    • Asynchronous Programming: Networking operations often involve waiting for responses,
    which can lead to blocking code. C# supports asynchronous programming using the
    async and await keywords, allowing you to perform network operations without blocking
    the main thread.


    • Error Handling: Proper error handling is crucial in network programming. You
    need to handle exceptions that may occur during network operations gracefully.


    In the upcoming sections of this chapter, we will delve deeper into these topics
    and provide practical examples of network programming in C#. Understanding network
    communication is essential for building applications that interact with remote
    services or devices, making it a valuable skill for C# developers.


    ## Section 8.2: Creating TCP and UDP Clients and Servers


    In this section, we will explore how to create both TCP (Transmission Control
    Protocol) and UDP (User Datagram Protocol) clients and servers using C#. TCP and
    UDP are two of the most commonly used transport layer protocols for network communication,
    each with its own characteristics and use cases.


    ### TCP Communication


    TCP is a connection-oriented protocol that provides reliable, stream-oriented
    communication. It ensures that data sent from one end is received by the other
    end in the correct order and without loss. TCP is commonly used for applications
    where data integrity is crucial, such as web browsing, email, and file transfer.


    #### Creating a TCP Server


    To create a TCP server in C#, you can use the TcpListener class. Here’s a simple
    example of how to create a TCP server that listens for incoming connections and
    handles client requests:


    using System;


    using System.Net;


    using System.Net.Sockets;


    using System.Text;


    class TcpServer


    {


    static void Main()


    {


    // Set the IP address and port to listen on


    IPAddress ipAddress = IPAddress.Parse("127.0.0.1");


    int port = 12345;


    // Create a TcpListener


    TcpListener server = new TcpListener(ipAddress, port);


    // Start listening for incoming connections


    server.Start();


    Console.WriteLine("TCP Server is listening...");


    while (true)


    {


    // Accept the client connection


    TcpClient client = server.AcceptTcpClient();


    Console.WriteLine("Client connected");


    // Get the client''s network stream for reading and writing


    NetworkStream stream = client.GetStream();


    // Read data from the client


    byte[] buffer = new byte[1024];


    int bytesRead = stream.Read(buffer, 0, buffer.Length);


    string dataReceived = Encoding.ASCII.GetString(buffer, 0, bytesRead);


    Console.WriteLine($"Received: {dataReceived}");


    // Send a response to the client


    string responseMessage = "Hello from the server!";


    byte[] responseData = Encoding.ASCII.GetBytes(responseMessage);


    stream.Write(responseData, 0, responseData.Length);


    // Close the client connection


    client.Close();


    Console.WriteLine("Client disconnected");


    }


    }


    }


    In this example, the server listens on IP address 127.0.0.1 and port 12345\. It
    accepts incoming client connections, reads data from the client, sends a response,
    and then closes the connection.


    #### Creating a TCP Client


    To create a TCP client in C#, you can use the TcpClient class. Here’s a simple
    example of how to create a TCP client that connects to a server and sends data:


    using System;


    using System.Net.Sockets;


    using System.Text;


    class TcpClientExample


    {


    static void Main()


    {


    // Set the server''s IP address and port


    string serverIp = "127.0.0.1";


    int serverPort = 12345;


    using (TcpClient client = new TcpClient(serverIp, serverPort))


    {


    Console.WriteLine("Connected to the server");


    // Get the network stream for reading and writing


    NetworkStream stream = client.GetStream();


    // Send data to the server


    string message = "Hello from the client!";


    byte[] data = Encoding.ASCII.GetBytes(message);


    stream.Write(data, 0, data.Length);


    // Read the server''s response


    byte[] buffer = new byte[1024];


    int bytesRead = stream.Read(buffer, 0, buffer.Length);


    string response = Encoding.ASCII.GetString(buffer, 0, bytesRead);


    Console.WriteLine($"Server Response: {response}");


    }


    }


    }


    In this example, the client connects to the server using the specified IP address
    and port, sends a message, and receives a response.


    ### UDP Communication


    UDP is a connectionless protocol that provides fast, lightweight communication.
    Unlike TCP, UDP does not guarantee data delivery or order. It is often used in
    scenarios where low overhead and real-time communication are more important than
    reliability, such as online gaming and streaming.


    #### Creating a UDP Server and Client


    To create a UDP server and client in C#, you can use the UdpClient class. Here’s
    a simple example of a UDP server that listens for incoming datagrams and a UDP
    client that sends datagrams to the server:


    using System;


    using System.Net;


    using System.Net.Sockets;


    using System.Text;


    class UdpServerAndClient


    {


    static void Main()


    {


    int port = 12345;


    // UDP server


    using (UdpClient server = new UdpClient(port))


    {


    Console.WriteLine("UDP Server is listening...");


    IPEndPoint clientEndPoint = new IPEndPoint(IPAddress.Any, 0);


    while (true)


    {


    byte[] receivedData = server.Receive(ref clientEndPoint);


    string message = Encoding.ASCII.GetString(receivedData);


    Console.WriteLine($"Received from {clientEndPoint}: {message}");


    // Respond to the client


    string responseMessage = "Hello from the UDP server!";


    byte[] responseData = Encoding.ASCII.GetBytes(responseMessage);


    server.Send(responseData, responseData.Length, clientEndPoint);


    }


    }


    // UDP client


    using (UdpClient client = new UdpClient())


    {


    string serverIp = "127.0.0.1";


    IPEndPoint serverEndPoint = new IPEndPoint(IPAddress.Parse(serverIp), port);


    // Send a message to the server


    string message = "Hello from the UDP client!";


