    ### Handling File Paths


    When working with files, it’s essential to handle file paths correctly, especially
    if your application needs to work on different platforms. You can use Path.Combine
    and other methods from the System.IO namespace to construct and manipulate file
    paths in a platform-independent way.


    File handling is a fundamental skill in C# development, whether you’re dealing
    with configuration files, log files, or any other type of data persistence. Understanding
    how to read and write files is essential for building robust and data-centric
    applications.


    ## Section 7.2: Working with Streams and Readers/Writers


    In C#, working with streams and readers/writers provides more flexibility and
    control when dealing with file I/O operations. Streams are a fundamental concept
    for reading and writing data, while readers and writers simplify text-based operations.
    This section delves into the usage of streams and readers/writers in C#.


    ### Streams


    A stream is a sequence of bytes that can be read from or written to. In C#, the
    Stream class and its derivatives, such as FileStream, MemoryStream, and NetworkStream,
    provide various ways to work with data streams. Streams are particularly useful
    when handling large files or when you need to manipulate data byte by byte.


    Here’s a simple example of reading data from a file using a FileStream:


    using System;


    using System.IO;


    class Program


    {


    static void Main()


    {


    string filePath = "sample.txt";


    try


    {


    using (FileStream fs = new FileStream(filePath, FileMode.Open))


    {


    byte[] buffer = new byte[1024];


    int bytesRead;


    while ((bytesRead = fs.Read(buffer, 0, buffer.Length)) > 0)


    {


    // Process the read data here


    Console.Write(Encoding.UTF8.GetString(buffer, 0, bytesRead));


    }


    }


    }


    catch (FileNotFoundException)


    {


    Console.WriteLine($"File not found: {filePath}");


    }


    catch (IOException e)


    {


    Console.WriteLine($"An error occurred: {e.Message}");


    }


    }


    }


    In this example, we use a FileStream to open and read a file byte by byte. We
    read data into a buffer and process it as needed.


    ### Readers and Writers


    While streams are versatile, they can be low-level when dealing with text-based
    data. Readers and writers, such as StreamReader and StreamWriter, provide higher-level
    abstractions that make it easier to work with text data.


    Here’s how to read a text file using a StreamReader:


    using System;


    using System.IO;


    class Program


    {


    static void Main()


    {


    string filePath = "sample.txt";


    try


    {


    using (StreamReader reader = new StreamReader(filePath))


    {


    string line;


    while ((line = reader.ReadLine()) != null)


    {


    Console.WriteLine(line);


    }


    }


    }


    catch (FileNotFoundException)


    {


    Console.WriteLine($"File not found: {filePath}");


    }


    catch (IOException e)


    {


    Console.WriteLine($"An error occurred: {e.Message}");


    }


    }


    }


    In this example, we use a StreamReader to read text from a file line by line.
    The ReadLine method simplifies reading text-based data.


    Writing text data to a file is similarly straightforward with a StreamWriter:


    using System;


    using System.IO;


    class Program


    {


    static void Main()


    {


    string filePath = "output.txt";


    try


    {


    using (StreamWriter writer = new StreamWriter(filePath))


    {


    writer.WriteLine("This is line 1.");


    writer.WriteLine("This is line 2.");


    }


    Console.WriteLine("Text written successfully!");


    }


    catch (IOException e)


    {


    Console.WriteLine($"An error occurred: {e.Message}");


    }


    }


    }


    Here, we use a StreamWriter to write text data to a file. The WriteLine method
    simplifies writing lines of text.


    ### Choosing Between Streams and Readers/Writers


    When working with files in C#, consider your specific use case. Streams are ideal
    for binary data or low-level manipulation, while readers and writers are better
    suited for text-based operations. The choice depends on the level of control and
    convenience your application requires for file I/O.


    ## Section 7.3: Serialization and Deserialization


    Serialization is the process of converting complex data structures, such as objects,
    into a format that can be easily stored, transmitted, or reconstructed. In C#,
    serialization is commonly used for tasks like saving objects to a file or sending
    them over a network. Deserialization is the reverse process, where serialized
    data is converted back into its original form. This section explores serialization
    and deserialization techniques in C#.


    ### Binary Serialization


    C# provides built-in support for binary serialization through the System.Runtime.Serialization.Formatters.Binary
    namespace. You can serialize objects and write them to a binary file, which can
    later be deserialized to recreate the original object.


    Here’s a basic example of binary serialization and deserialization:


    using System;


    using System.IO;


    using System.Runtime.Serialization.Formatters.Binary;


    [Serializable]


    class Person


    {


    public string Name { get; set; }


    public int Age { get; set; }


    }


    class Program


    {


    static void Main()


    {


    // Serialization


    Person person = new Person { Name = "Alice", Age = 30 };


    BinaryFormatter formatter = new BinaryFormatter();


    using (FileStream fs = new FileStream("person.dat", FileMode.Create))


    {


    formatter.Serialize(fs, person);


    Console.WriteLine("Object serialized and saved.");


    }


    // Deserialization


    using (FileStream fs = new FileStream("person.dat", FileMode.Open))


    {


    Person deserializedPerson = (Person)formatter.Deserialize(fs);


    Console.WriteLine($"Name: {deserializedPerson.Name}, Age: {deserializedPerson.Age}");


    }


    }


    }


    In this example, we define a Person class and mark it as [Serializable]. We then
    serialize an instance of this class to a binary file using BinaryFormatter, and
    later, we deserialize it to retrieve the original object.


    ### XML and JSON Serialization


    Apart from binary serialization, C# also supports XML and JSON serialization,
    which are often used for data exchange between applications or platforms. You
    can use XmlSerializer and JsonSerializer from the System.Xml.Serialization and
    System.Text.Json namespaces, respectively.


    Here’s an example of XML serialization and deserialization:


    using System;


    using System.IO;


    using System.Xml.Serialization;


    [Serializable]


    public class Person


    {


    public string Name { get; set; }


    public int Age { get; set; }


    }


    class Program


    {


    static void Main()


    {


    // Serialization to XML


    Person person = new Person { Name = "Bob", Age = 25 };


    XmlSerializer xmlSerializer = new XmlSerializer(typeof(Person));


    using (FileStream fs = new FileStream("person.xml", FileMode.Create))


    {


    xmlSerializer.Serialize(fs, person);


    Console.WriteLine("Object serialized as XML.");


    }


    // Deserialization from XML


    using (FileStream fs = new FileStream("person.xml", FileMode.Open))


    {


    Person deserializedPerson = (Person)xmlSerializer.Deserialize(fs);


    Console.WriteLine($"Name: {deserializedPerson.Name}, Age: {deserializedPerson.Age}");


    }


    }


