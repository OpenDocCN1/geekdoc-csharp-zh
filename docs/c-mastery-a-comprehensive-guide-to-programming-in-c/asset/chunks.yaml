    ## Section 2.3: Input and Output in C


    In this section, we’ll explore how to perform input and output operations in C#.
    Input allows your program to receive data from external sources like users, files,
    or other programs, while output enables your program to communicate results or
    information.


    ### Console Input


    C# provides several methods for reading user input from the console. One of the
    most common methods is Console.ReadLine(), which reads a line of text entered
    by the user and returns it as a string:


    Console.Write("Enter your name: ");


    string name = Console.ReadLine();


    Console.WriteLine($"Hello, {name}!");


    In this code: - Console.Write("Enter your name: "); displays a prompt to the user.
    - Console.ReadLine(); waits for the user to input text and stores it in the name
    variable. - Console.WriteLine($"Hello, {name}!"); prints a greeting using the
    entered name.


    You can use similar methods to read other types of data like numbers or characters
    and convert them to appropriate data types.


    ### Console Output


    We’ve already seen Console.WriteLine() for output, which writes text followed
    by a newline character. You can also use Console.Write() to output text without
    a newline:


    Console.Write("Hello, ");


    Console.Write("World!");


