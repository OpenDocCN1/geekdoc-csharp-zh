    5.  Implement Priority and Categorization: Add features to set task priorities
    (e.g., High, Medium, Low) and categorize tasks (e.g., Work, Personal, Shopping).

    6.  Add Sorting and Filtering: Implement sorting and filtering options for the
    task list based on priority, category, due date, etc.

    7.  Implement Reminders: Integrate a reminder system using timers or notifications
    to alert users of upcoming tasks.

    8.  Implement Data Persistence: Save task data to a file to ensure data persistence
    between application sessions. You can use file-based storage, XML, or databases.

