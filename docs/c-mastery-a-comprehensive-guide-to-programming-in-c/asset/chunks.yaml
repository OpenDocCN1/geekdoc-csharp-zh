    ### Polymorphism


    Polymorphism is the ability of objects of different classes to be treated as objects
    of a common base class. It allows you to write code that works with objects at
    a higher level of abstraction, regardless of their specific derived types.


    #### Using Polymorphism


    To leverage polymorphism in C#, you can declare variables and parameters of the
    base class type and assign objects of derived classes to them. Here’s an example:


    Shape shape1 = new Circle();


    shape1.Draw(); // Calls the overridden Draw method in Circle class


    In this example, the shape1 variable is of type Shape, but it refers to an instance
    of the Circle class. When you call shape1.Draw(), it calls the Draw method from
    the Circle class, demonstrating polymorphism.


    #### Virtual and Override Keywords


    To enable polymorphism, you use the virtual keyword in the base class for methods
    that can be overridden. In the derived class, you use the override keyword to
    indicate that you’re providing a specific implementation for that method.


    public class Shape


    {


    public virtual void Draw()


    {


    Console.WriteLine("Drawing a shape.");


    }


    }


    public class Circle : Shape


    {


    public override void Draw()


    {


    Console.WriteLine("Drawing a circle.");


    }


    }


    The virtual keyword allows derived classes to override the method, and the override
    keyword specifies the overridden method in the derived class.


    ### Abstract Classes and Methods


    C# also supports abstract classes and methods, which are used when you want to
    create a base class with certain methods that must be implemented by derived classes.
    Abstract classes cannot be instantiated; they are meant to be extended by other
    classes.


    public abstract class Shape


    {


    public abstract void Draw(); // Abstract method, must be implemented by derived
    classes


    }


    In this example, Shape is an abstract class with an abstract method Draw. Any
    class that derives from Shape must provide an implementation for Draw.


    Inheritance and polymorphism are powerful mechanisms for code reuse and building
    flexible and extensible software. By using these concepts, you can create hierarchies
    of classes that model real-world relationships and behaviors effectively. In the
    following sections, we’ll explore more advanced OOP concepts like interfaces and
    abstraction in C#.


    ## Section 3.4: Abstraction and Interfaces


    Abstraction and interfaces are essential concepts in Object-Oriented Programming
    (OOP) that promote code flexibility, modularity, and maintainability. In this
    section, we’ll explore these concepts and their implementation in C#.


    ### Abstraction


    Abstraction is the process of simplifying complex systems by modeling classes
    based on their essential properties and behaviors while hiding unnecessary details.
    Abstraction allows you to focus on what an object does rather than how it does
    it.


    #### Abstract Classes


    In C#, you can create abstract classes that serve as a blueprint for other classes
    but cannot be instantiated themselves. Abstract classes may contain both abstract
    and non-abstract (concrete) members (methods, properties, fields). Classes derived
    from an abstract class must implement all its abstract members.


    public abstract class Shape


    {


    public abstract void Draw(); // Abstract method, must be implemented by derived
    classes


    public void Move(int x, int y)


    {


    // Concrete method


    Console.WriteLine($"Moving to ({x}, {y})");


    }


    }


    In this example, Shape is an abstract class with an abstract method Draw and a
    concrete method Move.


    #### Abstract Methods


    Abstract methods in an abstract class have no implementation in the base class
    and are marked with the abstract keyword. Derived classes must provide an implementation
    for these methods.


    public abstract class Shape


    {


    public abstract void Draw();


    }


    Derived classes like Circle and Rectangle must implement the Draw method.


    ### Interfaces


    Interfaces define a contract of methods, properties, events, or indexers that
    implementing classes must adhere to. Unlike abstract classes, a class can implement
    multiple interfaces, promoting code reuse and flexibility.


    #### Creating Interfaces


    In C#, you define an interface using the interface keyword. Interfaces consist
    of method signatures and property declarations without implementations.


    public interface IDrawable


    {


    void Draw(); // Method signature


    int Width { get; } // Property declaration


    }


    In this example, IDrawable is an interface with a Draw method and a read-only
    Width property.


    #### Implementing Interfaces


    A class can implement an interface by providing concrete implementations for all
    the members defined in the interface.


    public class Circle : IDrawable


    {


    public void Draw()


    {


    Console.WriteLine("Drawing a circle.");


    }


    public int Width


    {


    get { return 10; }


    }


    }


    In this example, the Circle class implements the IDrawable interface, providing
    its own implementation for the Draw method and the Width property.


    #### Using Interfaces for Polymorphism


    Interfaces enable polymorphism, allowing you to work with objects of different
    classes that implement the same interface using a common interface reference.


    IDrawable shape1 = new Circle();


    IDrawable shape2 = new Rectangle();


    shape1.Draw(); // Calls the Draw method of Circle


    shape2.Draw(); // Calls the Draw method of Rectangle


    In this example, shape1 and shape2 are of type IDrawable, but they refer to instances
    of different classes that implement the interface. Polymorphism enables you to
    treat these objects uniformly.


    ### Benefits of Abstraction and Interfaces


    Abstraction and interfaces play a crucial role in OOP by allowing you to:


    •  Define contracts and standardize behavior for classes.


    •  Achieve code reusability through inheritance and interface implementation.


    •  Work with objects at a higher level of abstraction, promoting flexibility.


    •  Separate concerns and reduce code complexity by modeling only essential properties
    and behaviors.


    By mastering abstraction and interfaces in C#, you can design more flexible and
    maintainable software systems that can easily adapt to changing requirements and
    scale with your application’s growth.


    ## Section 3.5: Working with Exception Handling in OOP


    Exception handling is a critical aspect of Object-Oriented Programming (OOP) that
    allows you to handle runtime errors gracefully. In this section, we’ll explore
    how exception handling works in OOP using C#.


    ### Exception Handling Basics


    Exception handling is the process of responding to and managing unexpected runtime
    errors or exceptional situations that may occur during program execution. These
    errors can be due to various reasons, such as invalid user input, file not found,
    or network issues.


    In C#, exception handling is facilitated through keywords like try, catch, finally,
    and throw.


    #### The try and catch Blocks


    The try block is used to enclose code that might throw an exception. If an exception
    occurs within the try block, the program immediately jumps to the appropriate
    catch block, which handles the exception.


    try


    {


    // Code that may throw an exception


    }


    catch (Exception ex)


    {


    // Handle the exception


    Console.WriteLine($"An error occurred: {ex.Message}");


    }


    In this example, if an exception occurs within the try block, it’s caught by the
    catch block, and you can handle it by displaying an error message.


    #### The finally Block


    The finally block is used to specify code that should be executed regardless of
    whether an exception occurred or not. It’s often used for cleanup operations.


    try


