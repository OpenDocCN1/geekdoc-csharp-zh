    ```csharp

    public void Method1() { Console.WriteLine("Method 1"); }


    public void Method2() { Console.WriteLine("Method 2"); }


    MyDelegate multicastDelegate = Method1;


    multicastDelegate += Method2;


    multicastDelegate(); // Calls Method1 and Method2

    ```


    In this example, `multicastDelegate` references both `Method1` and `Method2`,
    so invoking it calls both methods.


    ### Events


    Events are a higher-level abstraction built on top of delegates and are commonly
    used in event-driven programming. They allow objects to notify other objects that
    something of interest has occurred.


    #### Decl Events


    To declare an event, you define an event handler delegate type and create an event
    based on that delegate type.


    ```csharp

    public delegate void EventHandler(object sender, EventArgs e);


    public class Button


    {


    public event EventHandler Click;


    public void SimulateClick()


    {


    Click?.Invoke(this, EventArgs.Empty);


    }


    }

    ```


    In this example, `Button` declares a `Click` event using the `EventHandler` delegate
    type.


    #### Subscribing to Events


    To subscribe to an event and handle it, you add an event handler method to the
    event using the `+=` operator.


    ```csharp

    Button button = new Button();


    button.Click += ButtonClickHandler;


    void ButtonClickHandler(object sender, EventArgs e)


    {


    Console.WriteLine("Button clicked!");


    }

    ```


    In this code, the `ButtonClickHandler` method is subscribed to the `Click` event
    of the `button` object.


    #### Raising Events


    To raise (invoke) an event, you call it like a method. Before invoking an event,
    it’s a good practice to check if it’s not null using the null-conditional operator
    (`?..`) to avoid null reference exceptions.


    ```csharp

    button.SimulateClick(); // Raises the Click event

    ```


    In this example, calling `SimulateClick` on the `button` object raises the `Click`
    event.


    ### Event Handlers and Event Args


    Event handlers are methods that are invoked when an event occurs. They must have
    a specific signature matching the delegate type associated with the event. Event
    arguments (often derived from `EventArgs`) can provide additional information
    about the event.


    ```csharp

    public class MyEventArgs : EventArgs


    {


    public string Message { get; set; }


    }


    public class MyEventPublisher


    {


    public event EventHandler<MyEventArgs> MyEventOccurred;


    public void RaiseEvent(string message)


    {


    var args = new MyEventArgs { Message = message };


    MyEventOccurred?.Invoke(this, args);


    }


    }

    ```


    In this example, `MyEventPublisher` raises an event with custom event arguments
    (`MyEventArgs`).


    Delegates and events are fundamental to implementing event-driven and callback-based
    programming in C#. They enable decoupling of components and the creation of extensible
    and flexible software. By understanding these concepts, you can build responsive
    and event-driven applications with ease.


    ## Section 4.3: Lambda Expressions and LINQ


    Lambda expressions and LINQ (Language-Integrated Query) are powerful features
    in C# that simplify working with collections and provide concise syntax for writing
    queries and transformations. In this section, we’ll delve into these features
    and how they enhance your coding experience.


    ### Lambda Expressions


    Lambda expressions are anonymous functions that allow you to write inline, concise,
    and readable code for simple operations. They are particularly useful when you
    need to pass functions as arguments or return functions from other functions.


    #### Syntax


    A lambda expression has the following syntax:


    `(parameters) => expression`


    Lambda expressions can have zero or more parameters and a single expression. If
    there are no parameters, you use empty parentheses.


    #### Example


    ```csharp

    // Traditional method

    int Square(int x)


    {


    return x * x;


    }


    // Equivalent lambda expression

    Func<int, int> square = x => x * x;

    ```


    In this example, `square` is a lambda expression that calculates the square of
    a number.


    ### LINQ (Language-Integrated Query)


    LINQ is a set of language features that allow you to perform queries on collections
    of objects, databases, XML, and more using a uniform syntax. LINQ simplifies querying
    and transforming data by providing a fluent, SQL-like syntax directly in C# code.


    #### Query Operators


    LINQ offers a set of query operators (methods) that operate on sequences, such
    as `Where`, `Select`, `OrderBy`, and `GroupBy`, to filter, project, order, and
    group data.


    ```csharp

    var numbers = new List<int> { 1, 2, 3, 4, 5 };


    var evenNumbers = numbers.Where(x => x % 2 == 0); // Filters even numbers


    var squaredNumbers = numbers.Select(x => x * x); // Squares each number

    ```


    In this code, `Where` and `Select` are LINQ query operators used to filter and
    transform the `numbers` collection, respectively.


    #### Method Syntax vs. Query Syntax


    LINQ provides two syntaxes: method syntax (using extension methods) and query
    syntax (using SQL-like keywords). Both are functionally equivalent, and you can
    choose the one that suits your coding style.


    ##### Method Syntax


    ```csharp

    var evenNumbers = numbers.Where(x => x % 2 == 0).ToList();

    ```


    ##### Query Syntax


    ```csharp

    var evenNumbers = (from num in numbers where num % 2 == 0 select num).ToList();

    ```


    #### LINQ to Objects


    LINQ can be used to query in-memory collections like arrays, lists, and dictionaries.
    It also supports querying XML documents, databases, and other data sources.


    ```csharp

    var books = new List<Book>


    {


    new Book { Title = "C# in Depth", Author = "Jon Skeet" },


    new Book { Title = "Clean Code", Author = "Robert C. Martin" },


    // ...


    };


    var query = from book in books


    where book.Author == "Jon Skeet"


    select book.Title;

    ```


    In this example, we use LINQ to query a collection of `Book` objects and select
    the titles of books authored by “Jon Skeet”.


    ### Benefits of Lambda Expressions and LINQ


    Lambda expressions and LINQ offer several benefits:


    - Conciseness: They allow to write shorter and more readable code, reducing boilerplate.

    - Flexibility: Lambda expressions enable the creation of inline functions, making
    code more flexible.

    - Expressiveness: LINQ provides a readable and consistent way to query and transform
    data in various sources.

    - Type Safety: Errors can be caught at compile time, reducing runtime exceptions.


    By mastering lambda expressions and LINQ, you can write more expressive and efficient
    code for querying and manipulating data, leading to improved productivity and
    code maintainability.


    ## Section 4.4: Design Patterns in C


    Design patterns are proven solutions to common software design problems. They
    provide reusable and structured approaches to solving specific problems, improving
    code maintainability and scalability. In this section, we’ll explore some of the
    commonly used design patterns in C#.


    ### Creational Design Patterns


    #### Singleton Pattern


    The Singleton pattern ensures that a class has only one instance and provides
    a global point of access to that instance.


    ```csharp

    public sealed class Singleton


    {


    private static readonly Singleton instance = new Singleton();


    private Singleton() { }


    public static Singleton Instance => instance;

    }

    ```


    In this example, the `Singleton` class guarantees that only one instance is created
    and can be accessed through the `Instance` property.


    #### Factory Pattern


    The Factory pattern is used to create objects without specifying the exact class
    of object that will be created.


    ```csharp

    public interface IAnimal


    {


    void Speak();

    }


    public class Dog : IAnimal


    {


    public void Speak() => Console.WriteLine("Woof!");

    }


    public class Cat : IAnimal


    {


    public void Speak() => Console.WriteLine("Meow!");

    }


    public class AnimalFactory


    {


    public IAnimal CreateAnimal(string animalType)


    {


    return animalType switch


    {


    "Dog" => new Dog(),


    "Cat" => new Cat(),


    _ => throw new ArgumentException("Invalid animal type"),


    };


    }


    }

    ```


    In this example, the `AnimalFactory` class creates instances of `IAnimal` without
    exposing the concrete classes `Dog` and `Cat`.


    ### Structural Design Patterns


    #### Adapter Pattern


    The Adapter pattern allows the interface of an existing class to be used as another
    interface. It is often used to make existing classes work with others without
    modifying their source code.

