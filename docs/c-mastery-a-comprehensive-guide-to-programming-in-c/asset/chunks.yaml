    ## Section 3.2: Encapsulation and Access Modifiers


    In this section, we’ll delve into the concept of encapsulation and explore access
    modifiers in C#. Encapsulation is a fundamental principle of Object-Oriented Programming
    (OOP) that allows you to control access to the internal state and behavior of
    objects. Access modifiers help define the visibility and accessibility of members
    (fields, properties, methods, etc.) within a class.


    ### Encapsulation in OOP


    Encapsulation is the bundling of data (attributes or properties) and the methods
    (functions or behavior) that operate on that data into a single unit called a
    class. It provides several benefits, including:


    • Data Hiding: Encapsulation hides the internal details of a class from external
    code. This means that the internal representation of an object can change without
    affecting the code that uses the object.


    • Controlled Access: It allows you to define which members of a class are accessible
    from outside and which are not. This control prevents unauthorized modifications
    or access to sensitive data.


    • Code Reusability: Encapsulated classes can be easily reused in different parts
    of the code or in other projects, promoting code modularity.


    ### Access Modifiers


    Access modifiers in C# determine the visibility and accessibility of class members.
    There are several access modifiers available, including:


    • public: Members marked as public are accessible from any part of the code, both
    within the class and externally.


    • private: Members marked as private are only accessible within the same class.
    They are not visible or accessible from outside the class.


    • protected: Members marked as protected are accessible within the class and by
    derived classes (classes that inherit from the base class).


    • internal: Members marked as internal are accessible within the same assembly
    (a compiled unit of code, such as a DLL or executable).


    • protected internal: Members marked as protected internal are accessible within
    the same assembly and by derived classes.


    • private protected: Members marked as private protected are accessible within
    the same assembly and by derived classes, but only if they are in the same assembly.


    ### Example of Encapsulation and Access Modifiers


    Let’s consider an example using a BankAccount class:


    public class BankAccount


    {


    // Private fields (encapsulated data)


    private string accountNumber;


    private decimal balance;


