    balance -= amount;


    return true;


    }


    return false;


    }


    // Public property (encapsulated data with access control)


    public decimal Balance


    {


    get { return balance; }


    }


    }


    In this BankAccount class: - accountNumber and balance are private fields, encapsulating
    data and hiding it from external code. - Deposit and Withdraw are public methods
    that provide controlled access to the account’s behavior. - Balance is a public
    property that allows external code to read the account’s balance but not modify
    it directly.


    By using encapsulation and access modifiers, you can create classes that provide
    a clear interface to their functionality while keeping their internal details
    hidden and controlled. This promotes code maintainability, flexibility, and security.


    ## Section 3.3: Inheritance and Polymorphism


    Inheritance and polymorphism are key concepts in Object-Oriented Programming (OOP)
    that enable code reuse, flexibility, and extensibility. In this section, we’ll
    explore these concepts and how they are implemented in C#.


    ### Inheritance


    Inheritance is a mechanism in which a new class (derived or child class) is created
    by inheriting properties and behaviors (fields and methods) from an existing class
    (base or parent class). The derived class can extend or override the functionality
    of the base class.


