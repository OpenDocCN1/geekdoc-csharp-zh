    Install-Package EntityFramework


    ### Creating an Entity Data Model


    Entity Framework uses an Entity Data Model (EDM) to map database tables to C#
    classes. You can create an EDM using the Entity Data Model Wizard in Visual Studio.
    Here are the basic steps to create an EDM:


    1.  Right-click your project in Solution Explorer.

    2.  Select “Add” > “New Item...”

    3.  Choose “Data” from the left menu, then select “ADO.NET Entity Data Model.”

    4.  Follow the wizard to connect to your database and generate the model.


    ### Working with Entity Framework


    Once you have created an EDM, you can work with it in your C# code. Here’s a simple
    example of querying data using Entity Framework:


    using System;


    using System.Linq;


    class Program


    {


    static void Main()


    {


    using (var context = new YourDbContext())


    {


    var customers = context.Customers.Where(c => c.City == "New York").ToList();


    foreach (var customer in customers)


    {


    Console.WriteLine($"Customer ID: {customer.CustomerId}, Name: {customer.Name}");


    }


    }


    }


    }


    In this example, we assume you have a Customer entity in your EDM with properties
    like CustomerId and Name. We use LINQ queries to filter customers in the “New
    York” city.


    ### Inserting Data


    To insert data into the database using Entity Framework, you can create a new
    entity object, add it to the context, and then call SaveChanges:


    using System;


    class Program


    {


    static void Main()


    {


    using (var context = new YourDbContext())


    {


    var newCustomer = new Customer { Name = "John Doe", City = "Los Angeles" };


    context.Customers.Add(newCustomer);


    context.SaveChanges();


    }


    }


    }


    In this example, we create a new Customer object, add it to the context, and then
    call SaveChanges to persist it in the database.


    ### Updating and Deleting Data


    Updating and deleting data with Entity Framework is straightforward. You can retrieve
    an entity, modify its properties, and then call SaveChanges:


    using System;


    using System.Linq;


    class Program


    {


    static void Main()


    {


    using (var context = new YourDbContext())


    {


    var customer = context.Customers.FirstOrDefault(c => c.CustomerId == 1);


    if (customer != null)


    {


    customer.City = "Chicago"; // Update the city


    context.SaveChanges();


    }


    }


    }


    }


    To delete an entity, you can remove it from the context and then call SaveChanges:


    using System;


    using System.Linq;


    class Program


    {


    static void Main()


    {


    using (var context = new YourDbContext())


    {


    var customer = context.Customers.FirstOrDefault(c => c.CustomerId == 1);


    if (customer != null)


    {


    context.Customers.Remove(customer); // Delete the customer


    context.SaveChanges();


    }


    }


    }


    }


    ### Summary


    Entity Framework simplifies database access by providing an object-oriented approach
    to interact with databases. It’s a powerful tool for C# developers, allowing you
    to work with databases using C# classes and LINQ queries while abstracting away
    the complexities of database operations. Whether you’re querying data, inserting,
    updating, or deleting records, Entity Framework can streamline your database-related
    tasks and improve code maintainability.


    ## Section 13.5: NoSQL and Document Databases


    In this section, we’ll explore NoSQL databases and their use in C# applications.
    NoSQL databases are a type of database management system that provides a flexible
    and schema-less way of storing and retrieving data. Unlike traditional relational
    databases, which use structured tables, NoSQL databases store data in various
    formats such as JSON, BSON, XML, or key-value pairs. One popular category of NoSQL
    databases is document databases.


    ### Document Databases


    Document databases, as the name suggests, store data in documents. These documents
    can be in formats like JSON or BSON and are typically hierarchical, allowing for
    nested data structures. MongoDB is a well-known document database that is often
    used with C# applications.


    #### Installing the MongoDB C# Driver


    To work with MongoDB in C#, you need to install the MongoDB C# driver. You can
    do this using NuGet Package Manager with the following command:


    Install-Package MongoDB.Driver


    ### Connecting to MongoDB


    Here’s a basic example of connecting to a MongoDB database from a C# application:


    using MongoDB.Driver;


    class Program


    {


    static void Main()


    {


    // Replace ''your_connection_string'' with your MongoDB connection string


    var client = new MongoClient("your_connection_string");


    // Access a specific database


    var database = client.GetDatabase("your_database_name");


    // Access a collection within the database


    var collection = database.GetCollection<BsonDocument>("your_collection_name");


    // Now you can work with the collection


    // ...


    }


    }


    ### CRUD Operations with MongoDB


    MongoDB supports the basic CRUD (Create, Read, Update, Delete) operations. Here’s
    a brief overview of how to perform these operations in C#:


    • Inserting Documents:


    var document = new BsonDocument


    {


    { "name", "John Doe" },


    { "age", 30 }


    };


    collection.InsertOne(document);


    • Querying Documents:


    var filter = Builders<BsonDocument>.Filter.Eq("name", "John Doe");


    var result = collection.Find(filter).ToList();


    • Updating Documents:


    var filter = Builders<BsonDocument>.Filter.Eq("name", "John Doe");


    var update = Builders<BsonDocument>.Update.Set("age", 31);


    collection.UpdateOne(filter, update);


    • Deleting Documents:


    var filter = Builders<BsonDocument>.Filter.Eq("name", "John Doe");


    collection.DeleteOne(filter);


    ### Pros and Cons of NoSQL Document Databases


    Document databases like MongoDB offer several advantages, such as flexibility,
    scalability, and support for nested data structures. They are a good choice for
    applications that need to store unstructured or semi-structured data.


    However, document databases may not be suitable for all scenarios. They lack support
    for complex joins and transactions, which are common in relational databases.
    Therefore, the choice between a document database and a relational database depends
    on your application’s specific requirements.


    In summary, NoSQL document databases are a valuable addition to the C# developer’s
    toolkit, providing a flexible and scalable way to store and query data. However,
    it’s essential to evaluate your project’s needs and requirements carefully before
    choosing a database type.


