    exceptions if the input cannot be converted.


    ### Error Handling


    To handle potential conversion errors, you can use int.TryParse() and similar
    methods. These methods attempt to parse the input and return a Boolean indicating
    success:


    Console.Write("Enter your age: ");


    string ageInput = Console.ReadLine();


    if (int.TryParse(ageInput, out int age))


    {


    Console.WriteLine($"You entered a valid age: {age}");


    }


    else


    {


    Console.WriteLine("Invalid input. Please enter a valid age.");


    }


    This code checks if the input can be parsed as an integer and handles both valid
    and invalid cases gracefully.


    ### File Input and Output


    In addition to console input and output, C# allows you to work with files. You
    can read data from files using classes like File and StreamReader, and write data
    to files using classes like File and StreamWriter. File operations are essential
