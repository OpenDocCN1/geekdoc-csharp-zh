  trans: "\n\n面向对象编程是一种围绕对象结构化代码的编程范式，对象是类的实例。对象将数据（属性或特性）和行为（方法或函数）封装在一个单元中。OOP 促进了封装、继承和多态等概念，使得代码更具模块化、可重用且易于维护。\n\
    \n### 类与对象\n\n在 OOP 中，`class`（类）是创建对象的蓝图或模板。它定义了该类对象将拥有的结构和行为。`class` 封装了数据（属性）和操作这些数据的方法（函数）。\n\
    \n这里有一个 C# 中类的类的简单示例：\n\n```csharp\npublic class Person\n{\n    // 属性（属性）\n  \
    \  public string Name { get; set; }\n    public int Age { get; set; }\n\n    //\
    \ 方法（行为）\n    public void SayHello()\n    {\n        Console.WriteLine($\"Hello,\
    \ my name is {Name} and I'm {Age} years old.\");\n    }\n}\n```\n\n在这段代码中：\n-\
    \ 我们定义了一个带有两个属性：`Name` 和 `Age` 的 `Person` 类。\n- `SayHello` 方法是与 `Person` 类相关的行为，允许\
    \ `Person` 对象进行自我介绍。\n\n要创建一个 `Person` 类的对象，你使用 `new` 关键字：\n\n```csharp\nPerson\
    \ person1 = new Person();\nperson1.Name = \"Alice\";\nperson1.Age = 30;\nperson1.SayHello();\
    \ // 输出: Hello, my name is Alice and I'm 30 years old.\n```\n\n在这里，`person1` 是\
    \ `Person` 类的实例，你可以访问它的属性和方法。\n\n### 封装\n\n封装是将数据和操作该数据的方法打包在单个单元（一个 `class`）中的概念。它有助于隐藏对象工作方式的内部细节，只暴露必要的内容。在我们的\
    \ `Person` 类中，属性 `Name` 和 `Age` 被封装在类内部，外部代码可以使用访问器（getters）和设置器（setters）来访问它们。\n\
    \n### 构造函数\n\n构造函数是特殊的方法，用于在创建对象时初始化。它们的名称与类名相同，并在使用 `new` 关键字创建对象时被调用。这里是 `Person`\
    \ 类的构造函数示例：\n\n```csharp\npublic class Person\n{\n    public string Name { get;\
    \ set; }\n    public int Age { get; set; }\n\n    // 构造函数\n    public Person(string\
    \ name, int age)\n    {\n        Name = name;\n        Age = age;\n    }\n   \
    \ // ...\n}\n```\n\n你可以使用此构造函数创建一个 `Person` 对象：\n\n```csharp\nPerson person2 =\
    \ new Person(\"Bob\", 25);\n```\n\n### 对象初始化语法\n\nC# 提供了对象初始化语法，允许你简洁地创建和初始化对象：\n\
    \n```csharp\nPerson person3 = new Person\n{\n    Name = \"Charlie\",\n    Age\
    \ = 40\n};\n```\n\n这种语法当你想要在创建对象期间设置多个属性时特别有用用。\n\n理解类和对象是 C# 中 OOP 的基础。类定义了对象的蓝图，而对象是这些类的实例，封装了数据和行为。在接下来的章节中，我们将探索高级\
    \ OOP 概念，如继承、多态和抽象，这些概念使你能够构建复杂且灵活的 C# 。\n\n## 第 3.2 节：封装与访问修符\n\n在这一节中，我们将深入探讨封装的概念并探索\
    \ C# 中的访问修符。封装面向对象编程 (OOP) 的基本原则，允许你控制对对象内部状态和行为的访问。访问修符有助于定义 `class` 内部成员（字段、属性、方法等）的可见性和可访问性。\n\
    \n### OOP 中的封装\n\n封装是将数据（属性或特性）和操作该数据的方法（函数或行为）打包在名为 `class` 的单个单元中的过程。它提供了几处好处，包括：\n\
    \n- **数据隐藏**：封装向外部代码隐藏了 `class` 的内部细节。这意味着对象的内部表示可以改变，而不影响使用该对象的代码。\n- **受控访问**：它允许你定义\
    \ `class` 的哪些成员可以从外部访问，哪些不可以。这种控制防止了对敏感数据的未经授权的修改或访问。\n- **代码重用**：封装的类可以轻松地在代码的不同部分或其他项目中重用，促进了代码的模块化。\n\
    \n### 访问修符\n\nC# 中的访问修符决定了类成员的可见性和可访问性。有几种可用的访问修符，包括：\n\n- `public`：标记为 `public`\
    \ 的成员可以从代码的任何部分访问，包括 `class` 内部外部。\n- `private`：标记为 `private` 的成员仅在同一个类内可访问。它们在\
    \ `class` 外部不可见或不可访问。\n- `protected`：标记为 `protected` 的成员可以在类内部以及派生类（继承自基类的类）中访问。\n\
    - `internal`：标记为 `internal` 的成员可以在同一个程序集内（代码的编译单元，如 DLL 或可执行文件）中访问。\n- `protected\
    \ internal`：标记为 `protected internal` 的成员可以在同一个程序集内以及派生类中访问。\n- `private protected`：标记为\
    \ `private protected` 的成员可以在同一个程序集内以及派生类中访问，但前提是它们位于同一个程序集内。\n\n### 封装与访问修符示例\n\
    \n让我们考虑一个使用 `BankAccount` 类的示例：\n\n```csharp\npublic class BankAccount\n{\n  \
    \  // 私有字段（封装的数据）\n    private string accountNumber;\n    private decimal balance;\n\
    \n    // 构造函数\n    public BankAccount(string accountNumber)\n    {\n        this.accountNumber\
    \ = accountNumber;\n        this.balance = 0.0m;\n    }\n\n    // 公有方法（封装的行为）\n\
    \    public void Deposit(decimal amount)\n    {\n        if (amount > 0)\n   \
    \     {\n            balance += amount;\n        }\n    }\n\n    // 公有方法（封装的行为）\n\
    \    public bool Withdraw(decimal amount)\n    {\n        if (amount > 0 && balance\
    \ >= amount)\n        {\n            balance -= amount;\n            return true;\n\
    \        }\n        return false;\n    }\n\n    // 公有属性（封装的数据访问）\n    public decimal\
    \ Balance\n    {\n        get { return balance; }\n    }\n}\n```\n\n在这个 `BankAccount`\
    \ 类中：\n- `accountNumber` 和 `balance` 是私有字段，封装了数据并向外部代码隐藏。\n- `Deposit` 和 `Withdraw`\
    \ 是公有方法，提供了对行为的受控访问。\n- `Balance` 是一个公有属性，允许外部代码读取但不能直接修改。\n\n通过使用封装和访问修符，你可以创建提供清晰接口并保持内部细节隐藏且受类。这促进了代码的可维护性、灵活性和安全性。\n\
    \n## 第 3.3 节：继承与多态\n\n继承和多态是面向对象编程 (OOP) 的核心概念，实现了代码重用、灵活性和扩展性。在本节中，我们将探索这些概念以及它们如何在\
    \ C# 中实现。\n\n### 继承\n\n继承是一种机制，通过从现有类（基类或父类）继承属性和行为（字段和方法）来创建新类（派生类或子类）。派生类可以扩展或覆盖基类的功能。\n\
    \n#### 创建派生类\n\n在 C# 中创建派生类，在类声明中使用 `:` 后跟基类名。这里有一个示例：\n\n```csharp\npublic class\
    \ Animal\n{\n    public void Eat()\n    {\n        Console.WriteLine(\"Animal\
    \ is eating.\");\n    }\n}\n\npublic class Dog : Animal\n{\n    public void Bark()\n\
    \    {\n        Console.WriteLine(\"Dog is barking.\");\n    }\n}\n```\n\n在这个示例中，`Dog`\
    \ 类派生自 `Animal` 类。它继承了 `Animal` 的 `Eat` 方法，并添加了自己的方法 `Bark`。\n\n#### 覆盖基类成员\n\n\
    派生类可以覆盖基类成员以提供自己的实现。要这样做，你需要使用 `override` 关键字。这里有一个包含覆盖方法的示例：\n\n```csharp\npublic\
    \ class Shape\n{\n    public virtual void Draw()\n    {\n        Console.WriteLine(\"\
    Drawing a shape.\");\n    }\n}\n\npublic class Circle : Shape\n{\n    public override\
    \ void Draw()\n    {\n        Console.WriteLine(\"Drawing a circle.\");\n    }\n\
    }\n```\n\n"
