- fmt: '

    Styling and templating are essential aspects of Windows Presentation Foundation
    (WPF) that allow you to customize the appearance and behavior of your WPF applications.
    In this section, we’ll explore how you can use styles and templates to create
    visually appealing and consistent user interfaces.


    ### Understanding Styles


    A `style` in WPF is a collection of property settings that can be applied to multiple
    UI elements to achieve a uniform appearance. Styles promote consistency across
    your application’s user interface by defining a set of common property values.


    Here’s an example of defining a style for all buttons in XAML:


    ```xml

    <Style TargetType="Button">

    <Setter Property="Background" Value="LightBlue" />

    <Setter Property="Foreground" Value="White" />

    <Setter Property="FontWeight" Value="Bold" />

    </Style>

    ```


    In this code, we define a style targeting the `Button` type. We set properties
    like `Background`, `Foreground`, and `FontWeight` to create a consistent look
    for all buttons in the application. To apply this style to a button, you simply
    reference it in the button’s `Style` property.


    ### Applying Styles


    You can apply a style to an individual element by setting the `Style` property
    of that element. For example:


    ```xml

    <Button Content="Submit" Style="{StaticResource MyButtonStyle}" />

    ```


    In this case, the button is styled using the `MyButtonStyle` defined earlier.


    ### Templating Controls


    Templates in WPF allow you to redefine the structure and appearance of a control.
    This is especially useful when you need to create custom controls or radically
    change the look of standard controls. WPF provides two types of templates: control
    templates and data templates.


    #### Control Templates


    A control template defines the visual structure of a custom control. You can completely
    redesign how a control looks by providing a new template. Here’s an example of
    defining a custom `Button` template:


    ```xml

    <ControlTemplate x:Key="MyButtonTemplate" TargetType="Button">

    <Border Background="LightBlue">

    <ContentPresenter />

    </Border>

    </ControlTemplate>

    ```


    This template replaces the default appearance of a button with a simple `Border`
    containing the button’s content.


    #### Data Templates


    Data templates are used to define how data objects are displayed in controls like
    `ListBox`, `ListView`, or `ItemsControl`. They allow you to control the layout
    of each item in a collection. Here’s an example of a data template for a `ListBox`:


    ```xml

    <ListBox ItemsSource="{Binding Students}">

    <ListBox.ItemTemplate>

    <DataTemplate>

    <StackPanel Orientation="Horizontal">

    <Image Source="{Binding ImageUrl}" Width="40" Height="40" />

    <TextBlock Text="{Binding Name}" Margin="10,0,0,0" />

    </StackPanel>

    </DataTemplate>

    </ListBox.ItemTemplate>

    </ListBox>

    ```


    In this example, the data template specifies how each student item should be displayed
    within the `ListBox`.


    ### Reusing Styles and Templates


    To maintain consistency and improve code organization, you can define styles and
    templates in resource dictionaries and reuse them throughout your application.
    This allows you to apply the same style or template to multiple elements easily.


    ### Dynamic Styling


    WPF also supports dynamic styling and theming. You can change styles and templates
    at runtime based on user preferences or application states, providing a more flexible
    user interface.


    ### Summary


    Styling and templating in WPF enable you to create visually appealing and consistent
    user interfaces. Styles help you define a common look and feel for your controls,
    while templates allow you to customize the visual structure of controls and data
    items. These features are powerful tools for creating modern and engaging WPF
    applications.


    ## Section 11.5: MVVM Pattern in WPF


    The Model-View-ViewModel (MVVM) pattern is a widely-used architectural pattern
    in Windows Presentation Foundation (WPF) development. It provides a structured
    way to separate the concerns of your application and achieve a clean separation
    of user interface (UI) logic from business logic. In this section, we will explore
    the MVVM pattern and how it can be applied in WPF applications.


    ### Understanding the MVVM Pattern


    MVVM consists of three main components:


    1. **Model**: The `Model` represents the data and business logic of your application.
    It encapsulates the application’s data and defines the rules and operations that
    can be performed on that data.

    2. **View**: The `View` represents the user interface (UI) of your application.
    It is responsible for presenting data to the user and receiving user input. In
    WPF, the `View` is typically defined using XAML.

    3. **ViewModel**: The `ViewModel` acts as an intermediary between the `Model`
    and the `View`. It exposes the data and operations required by the `View` and
    ensures that the `View` and `Model` remain independent of each other. The `ViewModel`
    is responsible for data binding, handling user interactions, and updating the
    `Model`.


    ### Key Principles of MVVM


    #### Data Binding


    One of the core principles of MVVM is data binding. WPF provides powerful data
    binding capabilities that allow you to establish a connection between the `ViewModel`
    and the `View`. Data binding ensures that changes in the `ViewModel` are automatically
    reflected in the `View` and vice versa.


    #### Commands


    In MVVM, user interactions are handled using commands. `Commands` are objects
    that encapsulate actions or operations that can be triggered from the `View`.
    `Commands` allow you to implement user interactions in a way that is decoupled
    from the UI, making it easier to test and maintain your application.


    #### Dependency Injection


    MVVM encourages the use of dependency injection to provide the `ViewModel` with
    the necessary dependencies, such as services and repositories. Dependency injection
    promotes the separation of concerns and testability of your application.


    ### Creating a ViewModel


    Here’s a simplified example of creating a `ViewModel` for a list of students:


    ```csharp

    public class StudentViewModel : INotifyPropertyChanged

    {

    private ObservableCollection<Student> students;


    public ObservableCollection<Student> Students

    {

    get { return students; }

    set

    {

    students = value;

    OnPropertyChanged(nameof(Students));

    }

    }


    public StudentViewModel()

    {

    // Initialize the ObservableCollection and load data from the Model.

    Students = new ObservableCollection<Student>(DataService.GetStudents());

    }


    // Implementation of INotifyPropertyChanged for two-way data binding.

    public event PropertyChangedEventHandler PropertyChanged;


    protected virtual void OnPropertyChanged(string propertyName)

    {

    PropertyChanged?.Invoke(this, new PropertyChangedEventArgs(propertyName));

    }

    }

    ```


    In this example, the `StudentViewModel` exposes a collection of students (`Students`)
    and initializes it with data from the `Model`. It also implements the `INotifyPropertyChanged`
    interface to notify the `View` of property changes.


    ### Binding the View


    In the `View` (defined in XAML), you can bind to properties and commands defined
    in the `ViewModel`. Here’s a snippet of XAML demonstrating data binding:


    ```xml

    <ListBox ItemsSource="{Binding Students}">

    <ListBox.ItemTemplate>

    <DataTemplate>

    <TextBlock Text="{Binding Name}" />

    </DataTemplate>

    </ListBox.ItemTemplate>

    </ListBox>

    ```


    In this XAML, the `ItemsSource` of the `ListBox` is bound to the `Students` property
    of the `ViewModel`, and the `Text` property of the `TextBlock` is bound to the
    `Name` property of each student.


    ### Benefits of MVVM


    The MVVM pattern offers several advantages:


    - **Separation of Concerns**: MVVM enforces a clear separation of concerns between
    the Model, View, and ViewModel, making your application more maintainable and
    testable.

    - **Testability**: Because the ViewModel contains the application’s logic independently
    of the View, it becomes easier to write unit tests for the ViewModel.

    - **Flexibility**: MVVM allows for greater flexibility in UI design and promotes
    code reuse through ViewModels.

    - **Collaborative Development**: Multiple developers can work simultaneously on
    the View and ViewModel, promoting collaborative development.

