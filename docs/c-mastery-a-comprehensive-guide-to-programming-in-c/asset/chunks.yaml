    # Chapter 4: Advanced OOP Concepts


    ![image](d2d_images/chapter_title_below.png)


    ## Section 4.1: Generics and Generic Collections


    In this section, we’ll explore one of the advanced Object-Oriented Programming
    (OOP) concepts in C#: Generics. Generics allow you to create classes, methods,
    and interfaces that work with different data types while providing type safety.
    We’ll focus on generics and their application in creating generic collections.


    ### Introduction to Generics


    Generics enable you to write code that can work with a variety of data types while
    maintaining compile-time type safety. They allow you to define classes, methods,
    or interfaces with placeholder types (type parameters) that are specified at the
    time of use. This flexibility is particularly valuable when working with collections,
    algorithms, and data structures that need to accommodate different types of data.


    ### Generic Classes


    A generic class is a class that can work with different data types. You define
    a generic class by specifying one or more type parameters enclosed in angle brackets
    (<>) when declaring the class.


    public class GenericList<T>


    {


    private T[] items;


    public GenericList(int size)


    {


    items = new T[size];


    }


    public void Add(int index, T item)


    {


    items[index] = item;


    }


    public T Get(int index)


    {


    return items[index];


    }


    }


    In this example, GenericList<T> is a generic class that can store elements of
    any type T. The T type parameter is a placeholder for the actual data type that
    will be used when creating an instance of the class.


    ### Using Generic Classes


    To use a generic class, you specify the actual data type when creating an instance
    of the class. This is called providing type arguments.


    GenericList<int> intList = new GenericList<int>(5);


    intList.Add(0, 42);


    int value = intList.Get(0); // value is 42


    GenericList<string> stringList = new GenericList<string>(3);


    stringList.Add(0, "Hello");


    string text = stringList.Get(0); // text is "Hello"


    In this code, we create two instances of GenericList, one to store integers and
    the other to store strings. The type arguments (int and string) specify the actual
    data types.


    ### Generic Methods


    Generics can also be applied to methods. A generic method can work with different
    data types, and you define type parameters for the method similarly to generic
    classes.


    public class Utilities


    {


    public T Max<T>(T a, T b) where T : IComparable<T>


    {


    return a.CompareTo(b) > 0 ? a : b;


    }


    }


    In this example, the Max method is generic and can determine the maximum value
    of any type T that implements the IComparable<T> interface.


    ### Generic Constraints


    You can impose constraints on type parameters using the where keyword. Constraints
    specify that the type argument must implement certain interfaces, derive from
    a specific class, or have a default constructor.


    public class ExampleClass<T> where T : IComparable<T>


    {


    // ...


    }


    In this code, T must implement the IComparable<T> interface.


    ### Generic Collections


    C# provides a set of generic collection classes in the System.Collections.Generic
    namespace, such as List<T>, Dictionary<TKey, TValue>, and Queue<T>. These collections
    offer type-safe storage for various data types and are widely used in C# programming.


    List<int> numbers = new List<int>();


    numbers.Add(42);


    int firstNumber = numbers[0]; // firstNumber is 42


    Dictionary<string, double> grades = new Dictionary<string, double>();


    grades["Alice"] = 95.5;


    double aliceGrade = grades["Alice"]; // aliceGrade is 95.5


    In this example, we use the generic List<T> and Dictionary<TKey, TValue> to store
    integers and key-value pairs, respectively.


    Generics are a powerful feature in C# that allows you to write flexible and type-safe
    code that can work with different data types. They are especially useful when
    working with collections and algorithms where type flexibility is required. In
    the following sections, we’ll explore more advanced OOP concepts, including delegates,
    events, and lambda expressions.


    ## Section 4.2: Delegates and Events


    Delegates and events are powerful mechanisms in C# that enable you to work with
    functions as first-class objects and implement event-driven programming. In this
    section, we’ll explore these concepts and their applications.


    ### Delegates


    A delegate is a reference type that can represent a reference to a method with
    a particular parameter list and return type. Delegates allow you to treat methods
    as first-class citizens, making it possible to pass methods as arguments to other
    methods, store them in data structures, and invoke them dynamically at runtime.


    #### Defining Delegates


    To define a delegate, you specify its signature, which includes the return type
    and parameters of the method it can reference.


    public delegate void MyDelegate(int x, int y);


    In this example, MyDelegate is a delegate type that can reference methods with
    two int parameters and no return value (void).


    #### Using Delegates


    You can create instances of delegates and assign them methods that match their
    signature. Then, you can invoke the delegate to execute the referenced method.


    public void Add(int a, int b)


    {


    Console.WriteLine($"Sum: {a + b}");


    }


    MyDelegate addDelegate = Add;


    addDelegate(5, 7); // Calls the Add method


    In this code, addDelegate references the Add method and can be invoked to execute
    Add.


    #### Multicast Delegates


    Delegates can also be combined to create multicast delegates that reference multiple
    methods. When a multicast delegate is invoked, it calls all the referenced methods
    in the order they were added.'
