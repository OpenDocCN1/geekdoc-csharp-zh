    # Chapter 14: Building Web Applications with ASP.NET Core


    ![image](d2d_images/chapter_title_below.png)


    ## Section 14.1: Creating ASP.NET Core Web Applications


    ASP.NET Core is a popular open-source web framework developed by Microsoft for
    building modern web applications. It’s a cross-platform framework that allows
    you to build web applications that can run on Windows, Linux, and macOS. In this
    section, we’ll explore how to create ASP.NET Core web applications using C#.


    ### Prerequisites


    Before we get started, make sure you have the following prerequisites installed:


    1.  Visual Studio: You can download and install Visual Studio from the official
    Microsoft website.

    2.  .NET SDK: Install the .NET SDK, which includes the tools and libraries needed
    for ASP.NET Core development. You can download it from the .NET website.


    ### Creating a New ASP.NET Core Project


    Let’s start by creating a new ASP.NET Core project. Follow these steps:


    1.  Open Visual Studio.

    2.  Click on “File” -> “New” -> “Project...”

    3.  In the “Create a new project” dialog, search for “ASP.NET Core Web Application”
    and select it.

    4.  Click “Next.”

    5.  Choose a project name, location, and solution name, then click “Create.”

    6.  In the “Create a new ASP.NET Core web application” dialog, select the template
    that suits your project. You can choose from templates like “Web Application,”
    “API,” “MVC,” and more. For this example, we’ll choose the “Web Application” template.

    7.  Configure additional settings such as authentication and Docker support if
    needed.

    8.  Click “Create.”


    ### Understanding the Project Structure


    An ASP.NET Core web application consists of several folders and files. Here’s
    a brief overview of the most important ones:


    • wwwroot: This folder contains static files such as CSS, JavaScript, and images
    that are served directly to clients.


    • Controllers: Controllers handle HTTP requests and define the application’s behavior.


    • Views: Views contain the HTML templates that are rendered to produce the user
    interface.


    • Startup.cs: This file contains the configuration and middleware setup for your
    application.


    • appsettings.json: Configuration settings for the application.


    ### Creating a Basic Web Page


    Let’s create a basic web page and controller to display “Hello, ASP.NET Core!”
    on the homepage.


    1.  In the “Controllers” folder, create a new controller class named HomeController.cs.
    Add the following code:


    using Microsoft.AspNetCore.Mvc;


    public class HomeController : Controller


    {


    public IActionResult Index()


    {


    return View();


    }


    }


    1.  In the “Views” folder, create a new folder named “Home” and inside it, create
    a new view file named Index.cshtml. Add the following HTML code:


    <!DOCTYPE html>


    <html>


    <head>


    <title>My ASP.NET Core App</title>


    </head>


    <body>


    <h1>Hello, ASP.NET Core!</h1>


    </body>


    </html>


    1.  Build and run your application. You should see “Hello, ASP.NET Core!” displayed
    in your web browser.


    Congratulations! You’ve created a basic ASP.NET Core web application. In the following
    sections, we’ll dive deeper into ASP.NET Core’s features and explore how to build
    more complex web applications.


    ## Section 14.2: Routing and Middleware in ASP.NET Core


    In ASP.NET Core, routing and middleware play a crucial role in handling HTTP requests
    and shaping the behavior of your web application. In this section, we’ll explore
    routing and middleware concepts in ASP.NET Core.


    ### Routing in ASP.NET Core


    Routing is the process of determining which controller and action method should
    handle an incoming HTTP request. ASP.NET Core provides a powerful routing system
    that allows you to define URL patterns and map them to specific controllers and
    actions.


    Here’s how routing works in ASP.NET Core:


    1.  Route Templates: Route templates are defined in controllers using attributes.
    These templates specify the URL pattern that triggers a particular action method.
    For example, [Route("products/{id}")] would match URLs like /products/123.

    2.  Route Constraints: You can apply constraints to route parameters to restrict
    the values they can accept. For instance, you can specify that the id parameter
    must be an integer.

    3.  Route Parameters: Route parameters are placeholders in route templates that
    capture values from the URL. These values are passed as arguments to the action
    method.

    4.  Route Names: Routes can be named, allowing you to generate URLs based on route
    names instead of hardcoding URLs.


    Here’s an example of defining a route in a controller:


    [Route("products/{id:int}")]


    public IActionResult ProductDetails(int id)


    {


    // Handle the request and display product details.


    }


    ### Middleware in ASP.NET Core


    Middleware components are software components that participate in processing an
    HTTP request. They can perform various tasks such as authentication, logging,
    compression, and more. Middleware components are executed in the order they are
    added to the pipeline.


    The ASP.NET Core request processing pipeline consists of multiple middleware components
    that execute sequentially. Here’s a simplified view of the pipeline:


    1.  HTTP Request: An HTTP request enters the pipeline.

    2.  Middleware: Middleware components in the pipeline can perform tasks such as
    routing, authentication, and authorization.

    3.  Controller Action: Once routing middleware determines the controller and action
    method to invoke, the action method is executed.

    4.  Middleware (Again): After the action method execution, additional middleware
    components can perform post-processing tasks.

    5.  HTTP Response: The HTTP response is generated and sent back to the client.


    You can add middleware components to the pipeline in the Startup.cs file. For
    example, to add authentication middleware, you can use:


    public void Configure(IApplicationBuilder app, IWebHostEnvironment env)


    {


    // Other middleware components


    app.UseAuthentication(); // Add authentication middleware


    // More middleware components


    }


    Middleware components are a fundamental part of ASP.NET Core, and you can even
    create custom middleware to suit your application’s specific needs.


    ### Putting It All Together


    Routing and middleware work together to handle HTTP requests in ASP.NET Core.
    The routing system determines which controller and action method should handle
    a request based on the URL, and middleware components can perform various tasks
    before and after controller action execution.


    Understanding routing and middleware is essential for building robust and flexible
    web applications in ASP.NET Core. In subsequent sections, we’ll explore more advanced
    topics and techniques for building web applications with this powerful framework.


    ## Section 14.3: Razor Pages and MVC


    In ASP.NET Core, Razor Pages and the Model-View-Controller (MVC) pattern are two
    fundamental approaches to building web applications. In this section, we’ll delve
    into these approaches and explore when to use each one.


    ### Razor Pages


    Razor Pages is a web application framework that focuses on simplicity and productivity.
    It’s an ideal choice for building small to medium-sized applications where a simple
    and straightforward structure is sufficient.


    Key characteristics of Razor Pages:


    1.  Page-Oriented: Razor Pages are organized around individual web pages, each
    represented by a .cshtml file. Each Razor Page can contain both the view (HTML
    markup) and the code-behind (C# code).

    2.  Convention over Configuration: Razor Pages follow a convention-based approach.
    By default, a Razor Page named Index.cshtml in a folder corresponds to the root
    URL of that folder. This convention simplifies routing.

    3.  Model Binding: Razor Pages have built-in support for model binding, making
    it easy to work with form data and URL parameters. Page models are responsible
    for handling user input and responding to requests.

    4.  Partial Pages: Reusable page sections called “partial pages” can be created
    and included in multiple Razor Pages, promoting code reusability.


    Here’s a basic example of a Razor Page:


    <!—Pages/Index.cshtml—>


    @page


    @model IndexModel


    <h1>Welcome to My Website</h1>


    <p>Hello, @Model.UserName!</p>


    // Pages/Index.cshtml.cs (code-behind)


    public class IndexModel : PageModel


    {


    public string UserName { get; set; }


    public void OnGet()


    {


    UserName = "John";


    }


    }


    ### Model-View-Controller (MVC)


    MVC is a widely adopted architectural pattern for building web applications. It
    provides a more structured approach suitable for large and complex applications.


    Key components of MVC:


    1.  Model: Represents the application’s data and business logic. Models are responsible
    for retrieving and storing data.

    2.  View: Represents the presentation layer and is responsible for rendering the
    user interface. Views receive data from the model and display it to users.

    3.  Controller: Acts as an intermediary between the model and view. Controllers
    handle incoming requests, interact with models to retrieve data, and pass that
    data to views for rendering.


    MVC offers a separation of concerns, making it easier to maintain and scale applications.
    It’s a great choice when you need precise control over routing and a more modular
    code structure.


    Here’s a simplified example of MVC:


    // Controller


    public class HomeController : Controller


    {


    public IActionResult Index()


    {


    var userName = "Jane";


    return View("Index", userName);


    }


    }


    <!—Views/Home/Index.cshtml—>


    @model string


    <h1>Welcome to My Website</h1>


    <p>Hello, @Model!</p>


    ### Choosing Between Razor Pages and MVC


    The choice between Razor Pages and MVC depends on your application’s complexity
    and requirements. Here are some guidelines:


    •  Use Razor Pages for small to medium-sized applications, prototypes, or scenarios
    where simplicity and rapid development are essential.


    •  Choose MVC for larger applications with more complex requirements, where a
    clear separation of concerns, flexibility in routing, and fine-grained control
    over components is needed.


    Both Razor Pages and MVC are first-class citizens in ASP.NET Core, and you can
    even combine them in a single application if it suits your needs. Ultimately,
    the choice should align with your project’s specific goals and constraints.


    ## Section 14.4: Authentication and Authorization


    Authentication and authorization are critical aspects of web application security.
    In this section, we’ll explore these two concepts and how they are implemented
    in ASP.NET Core.


    ### Authentication


    Authentication is the process of verifying the identity of a user or system. It
    answers the question, “Who are you?” Users are typically required to provide credentials
    (such as a username and password) to prove their identity. ASP.NET Core provides
    robust authentication mechanisms, including:


    1.  Cookie-based Authentication: This method uses encrypted cookies to track authenticated
    users. Once a user logs in, a cookie is issued, and subsequent requests include
    this cookie to authenticate the user.

    2.  Token-based Authentication: Token-based authentication, often used for web
    APIs, involves the issuance of a JSON Web Token (JWT) upon successful login. The
    token is then included in the request headers for subsequent authentication.

    3.  External Authentication: ASP.NET Core supports external authentication providers
    like Google, Facebook, and Microsoft. Users can log in using their existing accounts
    on these platforms.


    Here’s a simplified example of setting up cookie-based authentication in an ASP.NET
    Core application:


    // Startup.cs


    public void ConfigureServices(IServiceCollection services)


    {


    // ...


    services.AddAuthentication(CookieAuthenticationDefaults.AuthenticationScheme)


    .AddCookie(options =>


    {


    options.LoginPath = "/Account/Login";


    options.AccessDeniedPath = "/Account/AccessDenied";


    });


    // ...


    }


    // AccountController.cs


    [AllowAnonymous]


    public IActionResult Login()


    {


    // Your login logic here


    return View();


    }


    [HttpPost]


    [AllowAnonymous]


    public async Task<IActionResult> Login(LoginViewModel model)


    {


    // Authenticate the user


    // ...


    return RedirectToAction("Index", "Home");


    }


    ### Authorization


    Authorization, on the other hand, determines what authenticated users are allowed
    to do within the application. It answers the question, “What are you allowed to
    do?” ASP.NET Core offers flexible authorization mechanisms, such as:


    1.  Role-based Authorization: Users are assigned roles, and permissions are associated
    with these roles. Controllers or actions can be decorated with [Authorize(Roles
    = "Admin")] to restrict access to users with specific roles.

    2.  Policy-based Authorization: More fine-grained control is achieved by defining
    policies. Policies can be used to specify complex access requirements based on
    roles, claims, or custom criteria.


    Here’s a simple example of role-based authorization:


    // MyController.cs


    [Authorize(Roles = "Admin")]


    public class AdminController : Controller


    {


    // Actions only accessible to users in the "Admin" role


    // ...


    }


    ### Combining Authentication and Authorization


    Authentication and authorization often go hand in hand. Once a user is authenticated,
    authorization rules determine which parts of the application they can access.
    ASP.NET Core’s flexible and customizable middleware allows you to easily integrate
    these processes into your web application, ensuring that users’ identities are
    verified and their access is controlled appropriately.


    In summary, authentication verifies a user’s identity, while authorization defines
    what actions or resources they can access. Implementing these security measures
    is crucial for protecting your ASP.NET Core web application and its data.


    ## Section 14.5: Real-time Web Applications with SignalR


    In modern web applications, real-time communication between clients and the server
    is becoming increasingly important. Users expect features like instant messaging,
    live updates, and interactive collaboration. ASP.NET Core provides SignalR, a
    library that simplifies the implementation of real-time functionality in web applications.


    ### What is SignalR?


    SignalR is an open-source library for ASP.NET Core that enables real-time, bidirectional
    communication between clients and the server. It abstracts the underlying transport
    mechanisms (WebSockets, Server-Sent Events, Long Polling, etc.) to provide a consistent
    API for building real-time web applications.


    ### Key Features of SignalR:


    1.  Real-time Communication: SignalR allows server-to-client and client-to-server
    communication in real time. This is ideal for applications like chat rooms, live
    notifications, and collaborative tools.

    2.  Cross-Platform Support: SignalR works across various platforms, including
    web browsers, mobile devices, and desktop applications, making it versatile for
    building cross-platform solutions.

    3.  Multiple Transport Protocols: It supports multiple transport protocols, falling
    back to the most suitable one for the client’s capabilities. This ensures that
    real-time features work even in environments with limited support for WebSockets.

    4.  Hub-based Model: SignalR uses a hub-based model, where the server and clients
    communicate through hubs. Hubs are like channels or groups where messages can
    be sent and received.

    5.  Authentication and Authorization: SignalR seamlessly integrates with ASP.NET
    Core’s authentication and authorization systems, allowing you to control access
    to real-time features.


    ### Getting Started with SignalR


    To get started with SignalR in an ASP.NET Core application, you’ll need to follow
    these basic steps:


    1.  Install the SignalR Package: Add the SignalR package to your project using
    NuGet Package Manager.

    2.  Create a Hub: Create a SignalR hub that defines the methods clients can call
    and the events they can listen to.

    3.  Configure SignalR: In your Startup.cs file, configure SignalR by adding it
    to the middleware pipeline.

    4.  Client-Side Code: Implement the SignalR client in your web application’s JavaScript
    or TypeScript code.


    Here’s a simplified example of setting up a SignalR hub and client:


    Server-Side Code (Hub):


    using Microsoft.AspNetCore.SignalR;


    public class ChatHub : Hub


    {


    public async Task SendMessage(string user, string message)


    {


    await Clients.All.SendAsync("ReceiveMessage", user, message);


    }


    }


    Client-Side Code (JavaScript):


    const connection = new signalR.HubConnectionBuilder()


    .withUrl("/chatHub")


    .build();


    connection.on("ReceiveMessage", (user, message) => {


    // Handle received message


    });


    connection.start().then(() => {


    // Connection established


    }).catch(err => {


    console.error(err);


    });


    // Sending a message


    connection.invoke("SendMessage", user, message);


    ### Use Cases for SignalR


    SignalR is versatile and can be used for various real-time scenarios:


    • Chat Applications: Building chat rooms and instant messaging features.


    • Live Notifications: Notifying users about updates or events in real time.


    • Collaborative Tools: Enabling real-time collaboration in applications like document
    editors or whiteboards.


    • Online Gaming: Implementing real-time game interactions and multiplayer features.


    • Monitoring Dashboards: Creating dashboards that update in real time with live
    data.


    • IoT Control: Controlling and monitoring IoT devices in real time.


    SignalR simplifies the development of these features, making it a valuable addition
    to your ASP.NET Core toolbox for building interactive and engaging web applications.


