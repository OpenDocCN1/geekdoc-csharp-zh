    # Chapter 7: File Handling and Serialization


    ![image](d2d_images/chapter_title_below.png)


    ## Section 7.1: Reading and Writing Files in C


    File handling is a fundamental aspect of many software applications. In C#, you
    can perform various file operations, including reading from and writing to files.
    This section explores how to work with files in C#.


    ### Reading Text Files


    To read the contents of a text file in C#, you can use the File.ReadAllText method.
    Here’s an example:


    using System;


    using System.IO;


    class Program


    {


    static void Main()


    {


    string filePath = "sample.txt";


    try


    {


    string fileContents = File.ReadAllText(filePath);


    Console.WriteLine("File Contents:");


    Console.WriteLine(fileContents);


    }


    catch (FileNotFoundException)


    {


    Console.WriteLine($"File not found: {filePath}");


    }


    catch (IOException e)


    {


    Console.WriteLine($"An error occurred: {e.Message}");


    }


    }


    }


    In this example, we use File.ReadAllText to read the contents of the “sample.txt”
    file and then display them on the console. We also handle exceptions, such as
    FileNotFoundException and IOException, that can occur during file operations.


    ### Writing to Text Files


    To write data to a text file, you can use the File.WriteAllText method. Here’s
    an example:


    using System;


    using System.IO;


    class Program


    {


    static void Main()


    {


    string filePath = "output.txt";


    string content = "This is some sample text.";


    try


    {


    File.WriteAllText(filePath, content);


    Console.WriteLine("File written successfully!");


    }


    catch (IOException e)


    {


    Console.WriteLine($"An error occurred: {e.Message}");


    }


    }


    }


    In this example, we use File.WriteAllText to write the specified content to the
    “output.txt” file. Again, we handle potential IOExceptions that may occur during
    the file write operation.


    ### Reading and Writing Binary Files


    While the previous examples focused on text files, you can also read and write
    binary files in C# using FileStream. Binary files are used for a wide range of
    purposes, including storing images, audio, and other non-textual data.'
