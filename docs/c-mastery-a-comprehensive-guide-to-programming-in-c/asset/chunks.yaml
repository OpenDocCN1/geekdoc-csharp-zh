  trans: "\n\n一旦你在 C# 中建立了与数据库的连接，你很可能想要执行各种数据库操作，例如查询、插入、更新和删除数据。在本节中，我们将使用 ADO.NET\
    \ 探索 SQL 数据库操作的基础，ADO.NET 提供了一种处理数据库的强大方式。\n\n### 执行 SQL 查询\n\n要对数据库执行 SQL 查询，你需要结合你的数据库连接使用\
    \ `SqlCommand` 类。以下是一个从 SQL Server 数据库中查询数据的示例：\n\n```csharp\nusing System;\n\
    using System.Data;\nusing System.Data.SqlClient;\n\nclass Program\n{\n    static\
    \ void Main()\n    {\n        string connectionString = \"Server=localhost;Database=MyDatabase;User\
    \ Id=myUsername;Password=myPassword;\";\n        using (SqlConnection connection\
    \ = new SqlConnection(connectionString))\n        {\n            try\n       \
    \     {\n                connection.Open();\n                Console.WriteLine(\"\
    Connected to the database.\");\n                // SQL query\n               \
    \ string sqlQuery = \"SELECT Id, Name FROM Customers\";\n                using\
    \ (SqlCommand command = new SqlCommand(sqlQuery, connection))\n              \
    \  {\n                    using (SqlDataReader reader = command.ExecuteReader())\n\
    \                    {\n                        while (reader.Read())\n      \
    \                  {\n                            int id = reader.GetInt32(0);\
    \ // Assuming Id is the first column\n                            string name\
    \ = reader.GetString(1); // Assuming Name is the second column\n             \
    \               Console.WriteLine($\"Customer ID: {id}, Name: {name}\");\n   \
    \                     }\n                    }\n                }\n          \
    \  }\n            catch (Exception ex)\n            {\n                Console.WriteLine($\"\
    Error: {ex.Message}\");\n            }\n        }\n    }\n}\n```\n\n在此示例中，我们对\
    \ `Customers` 表执行了 `SELECT` 查询，使用 `SqlDataReader` 获取结果并处理数据。请确保根据需要将 SQL 查询替换为你自己的查询。\n\
    \n### 执行非查询 SQL 命令\n\n除了查询数据外，你可能还需要执行非查询的 SQL 命令，如 `INSERT`、`UPDATE` 或 `DELETE`\
    \ 来修改数据库。以下是一个向 SQL Server 数据库插入数据的示例：\n\n```csharp\nusing System;\nusing System.Data;\n\
    using System.Data.SqlClient;\n\nclass Program\n{\n    static void Main()\n   \
    \ {\n        string connectionString = \"Server=localhost;Database=MyDatabase;User\
    \ Id=myUsername;Password=myPassword;\";\n        using (SqlConnection connection\
    \ = new SqlConnection(connectionString))\n        {\n            try\n       \
    \     {\n                connection.Open();\n                Console.WriteLine(\"\
    Connected to the database.\");\n                // SQL INSERT command\n      \
    \          string insertSql = \"INSERT INTO Employees (FirstName, LastName) VALUES\
    \ ('John', 'Doe')\";\n                using (SqlCommand insertCommand = new SqlCommand(insertSql,\
    \ connection))\n                {\n                    int rowsAffected = insertCommand.ExecuteNonQuery();\n\
    \                    Console.WriteLine($\"Rows affected: {rowsAffected}\");\n\
    \                }\n            }\n            catch (Exception ex)\n        \
    \    {\n                Console.WriteLine($\"Error: {ex.Message}\");\n       \
    \     }\n        }\n    }\n}\n```\n\n在此示例中，我们执行了一个 `INSERT` 查询来向 `Employees` 表添加一个新员工。`ExecuteNonQuery`\
    \ 方法用于执行非查询 SQL 命令，它会返回受影响的行数。\n\n### 参数化查询\n\n在处理涉及用户输入的 SQL 查询时，使用参数化查询来防止 SQL\
    \ 注入攻击至关重要。参数化查询确保用户输入被视为数据，而不是可执行的 SQL 代码。以下是一个参数化查询的示例：\n\n```csharp\nusing\
    \ System;\nusing System.Data;\nusing System.Data.SqlClient;\n\nclass Program\n\
    {\n    static void Main()\n    {\n        string connectionString = \"Server=localhost;Database=MyDatabase;User\
    \ Id=myUsername;Password=myPassword;\";\n        using (SqlConnection connection\
    \ = new SqlConnection(connectionString))\n        {\n            try\n       \
    \     {\n                connection.Open();\n                Console.WriteLine(\"\
    Connected to the database.\");\n                // Parameterized SQL query\n \
    \               string sqlQuery = \"SELECT Id, Name FROM Products WHERE Category\
    \ = @Category\";\n                using (SqlCommand command = new SqlCommand(sqlQuery,\
    \ connection))\n                {\n                    // Define and set the parameter\n\
    \                    command.Parameters.Add(new SqlParameter(\"@Category\", \"\
    Electronics\"));\n                    using (SqlDataReader reader = command.ExecuteReader())\n\
    \                    {\n                        while (reader.Read())\n      \
    \                  {\n                            int id = reader.GetInt32(0);\n\
    \                            string name = reader.GetString(1);\n            \
    \                Console.WriteLine($\"Product ID: {id}, Name: {name}\");\n   \
    \                     }\n                    }\n                }\n          \
    \  }\n            catch (Exception ex)\n            {\n                Console.WriteLine($\"\
    Error: {ex.Message}\");\n            }\n        }\n    }\n}\n```\n\n在此示例中，`@Category`\
    \ 参数被用于 SQL 查询，我们使用 `command.Parameters.Add` 设置了它的值。\n\n### 事务\n\n事务允许你将一系列 SQL\
    \ 操作组合成单一的原子单元。事务中的所有操作要么执行，要么都不执行。这确保了数据的一致性。要在 ADO.NET 中使用事务，你可以将代码封装在 `SqlTransaction`\
    \ 中：\n\n```csharp\nusing System;\nusing System.Data;\nusing System.Data.SqlClient;\n\
    \nclass Program\n{\n    static void Main()\n```\n\n![image](img/scene_break.png)\n\
    \n## 第 13.4 节：Entity Framework 和 ORM\n\nEntity Framework (EF) 是一个对象关系映射（ORM）框架，通过允许使用面向对象的技术处理数据库，简化了\
    \ C# 应用程序中的数据库访问。它抽象了底层的数据库操作，并允许你使用 C# 类和 LINQ 查询与数据库交互。在本节中，我们将探索 Entity Framework\
    \ 的基础。\n\n### 安装 Entity Framework\n\n在开始使用 Entity Framework 之前，你需要安装 Entity Framework\
    \ 程序包。你可以使用 Visual Studio 中的 NuGet 包管理器，或者在 NuGet CLI 中运行以下命令来完成：\n\n"
- fmt: "\n```shell\nInstall-Package EntityFramework\n```\n\n### Creating an Entity\
    \ Data Model\n\nEntity Framework uses an Entity Data Model (EDM) to map database\
    \ tables to C# classes. You can create an EDM using the Entity Data Model Wizard\
    \ in Visual Studio. Here are the basic steps to create an EDM:\n\n1. Right-click\
    \ your project in Solution Explorer.\n2. Select “Add” > “New Item...”\n3. Choose\
    \ “Data” from the left menu, then select “ADO.NET Entity Data Model.”\n4. Follow\
    \ the wizard to connect to your database and generate the model.\n\n### Working\
    \ with Entity Framework\n\nOnce you have created an EDM, you can work with it\
    \ in your C# code. Here’s a simple example of querying data using Entity Framework:\n\
    \n```csharp\nusing System;\nusing System.Linq;\n\nclass Program\n{\n    static\
    \ void Main()\n    {\n        using (var context = new YourDbContext())\n    \
    \    {\n            var customers = context.Customers.Where(c => c.City == \"\
    New York\").ToList();\n            foreach (var customer in customers)\n     \
    \       {\n                Console.WriteLine($\"Customer ID: {customer.CustomerId},\
    \ Name: {customer.Name}\");\n            }\n        }\n    }\n}\n```\n\nIn this\
    \ example, we assume you have a `Customer` entity in your EDM with properties\
    \ like `CustomerId` and `Name`. We use LINQ queries to filter customers in the\
    \ “New York” city.\n\n### Inserting Data\n\nTo insert data into the database using\
    \ Entity Framework, you can create a new entity object, add it to the context,\
    \ and then call `SaveChanges`:\n\n```csharp\nusing System;\n\nclass Program\n\
    {\n    static void Main()\n    {\n        using (var context = new YourDbContext())\n\
    \        {\n            var newCustomer = new Customer { Name = \"John Doe\",\
    \ City = \"Los Angeles\" };\n            context.Customers.Add(newCustomer);\n\
    \            context.SaveChanges();\n        }\n    }\n}\n```\n\nIn this example,\
    \ we create a new `Customer` object, add it to the context, and then call `SaveChanges`\
    \ to persist it in the database.\n\n### Updating and Deleting Data\n\nUpdating\
    \ and deleting data with Entity Framework is straightforward. You can retrieve\
    \ an entity, modify its properties, and then call `SaveChanges`:\n\n```csharp\n\
    using System;\nusing System.Linq;\n\nclass Program\n{\n    static void Main()\n\
    \    {\n        using (var context = new YourDbContext())\n        {\n       \
    \     var customer = context.Customers.FirstOrDefault(c => c.CustomerId == 1);\n\
    \            if (customer != null)\n            {\n                customer.City\
    \ = \"Chicago\"; // Update the city\n                context.SaveChanges();\n\
    \            }\n        }\n    }\n}\n```\n\nTo delete an entity, you can remove\
    \ it from the context and then call `SaveChanges`:\n\n```csharp\nusing System;\n\
    using System.Linq;\n\nclass Program\n{\n    static void Main()\n    {\n      \
    \  using (var context = new YourDbContext())\n        {\n            var customer\
    \ = context.Customers.FirstOrDefault(c => c.CustomerId == 1);\n            if\
    \ (customer != null)\n            {\n                context.Customers.Remove(customer);\
    \ // Delete the customer\n                context.SaveChanges();\n           \
    \ }\n        }\n    }\n}\n```\n\n### Summary\n\nEntity Framework simplifies database\
    \ access by providing an object-oriented approach to interact with databases.\
    \ It’s a powerful tool for C# developers, allowing you to work with databases\
    \ using C# classes and LINQ queries while abstracting the complexities of database\
    \ operations. Whether you’re querying data, inserting, updating, or deleting records,\
    \ Entity Framework can streamline your database-related tasks and improve code\
    \ maintainability.\n\n## Section 13.5: NoSQL and Document Databases\n\nIn this\
    \ section, we’ll explore NoSQL databases and their use in C# applications. NoSQL\
    \ databases are a type of database management system that provides a flexible\
    \ and schema-less way of storing and retrieving data. Unlike traditional relational\
    \ databases, which use structured tables, NoSQL databases store data in various\
    \ formats such as JSON, BSON, XML, or key-value pairs. One popular category of\
    \ NoSQL databases is document databases.\n\n### Document Databases\n\nDocument\
    \ databases, as the name suggests, store data in documents. These documents can\
    \ be in formats like JSON or BSON and are typically hierarchical, allowing for\
    \ nested data structures. MongoDB is a well-known document database that is often\
    \ used with C# applications.\n\n#### Installing the MongoDB C# Driver\n\nTo work\
    \ with MongoDB in C#, you need to install the MongoDB C# driver. You can do this\
    \ using NuGet Package Manager with the following command:\n\n```shell\nInstall-Package\
    \ MongoDB.Driver\n```\n\n### Connecting to MongoDB\n\nHere’s a basic example of\
    \ connecting to a MongoDB database from a C# application:\n\n```csharp\nusing\
    \ MongoDB.Driver;\n\nclass Program\n{\n    static void Main()\n    {\n       \
    \ // Replace 'your_connection_string' with your MongoDB connection string\n  \
    \      var client = new MongoClient(\"your_connection_string\");\n        // Access\
    \ a specific database\n        var database = client.GetDatabase(\"your_database_name\"\
    );\n        // Access a collection within the database\n        var collection\
    \ = database.GetCollection<BsonDocument>(\"your_collection_name\");\n        //\
    \ Now you can work with the collection\n        // ...\n    }\n}\n```\n\n### CRUD\
    \ Operations with MongoDB\n\nMongoDB supports the basic CRUD (Create, Read, Update,\
    \ Delete) operations. Here’s a brief overview of how to perform these operations\
    \ in C#:\n\n- **Inserting Documents:**\n  ```csharp\n  var document = new BsonDocument\n\
    \  {\n      { \"name\", \"John Doe\" },\n      { \"age\", 30 }\n  };\n  collection.InsertOne(document);\n\
    \  ```\n- **Querying Documents:**\n  ```csharp\n  var filter = Builders<BsonDocument>.Filter.Eq(\"\
    name\", \"John Doe\");\n  var result = collection.Find(filter).ToList();\n  ```\n\
    - **Updating Documents:**\n  ```csharp\n  var filter = Builders<BsonDocument>.Filter.Eq(\"\
    name\", \"John Doe\");\n  var update = Builders<BsonDocument>.Update.Set(\"age\"\
    , 31);\n  collection.UpdateOne(filter, update);\n  ```\n- **Deleting Documents:**\n\
    \  ```csharp\n  var filter = Builders<BsonDocument>.Filter.Eq(\"name\", \"John\
    \ Doe\");\n  collection.DeleteOne(filter);\n  ```\n\n### Pros and Cons of NoSQL\
    \ Databases\n\nDocument databases like MongoDB offer several advantages, such\
    \ as flexibility, scalability, and support for nested data structures. They are\
    \ a good choice for applications that need to store unstructured or semi-structured\
    \ data. However, document databases may not be suitable for all scenarios. They\
    \ lack support for complex joins and transactions, which are common in relational\
    \ databases. In summary, NoSQL databases are a valuable addition to the C# developer’s\
    \ toolkit, providing a flexible and scalable way to store and query data. However,\
    \ it’s essential to evaluate your project’s needs and requirements before choosing\
    \ a database type.\n\n# Chapter 14: Building Web Applications with ASP.NET Core\n\
    \n## Section 14.1: Creating ASP.NET Core Web Applications\n\nASP.NET Core is a\
    \ popular open-source web framework developed by Microsoft for building web applications.\
    \ It’s a cross-platform framework that allows you to build web applications that\
    \ can run on Windows, Linux, and macOS. In this section, we’ll explore how to\
    \ create ASP.NET Core web applications using C#.\n\n### Prerequisites\n\nBefore\
    \ we get started, make sure you have the following:\n\n1. Visual Studio: You can\
    \ download and install Visual Studio from the official website.\n2. .NET SDK:\
    \ Install the .NET SDK, which includes the tools and libraries needed for ASP.NET\
    \ Core development. You can download it from the .NET website.\n\n### Creating\
    \ a New ASP.NET Core Project\n\nLet’s start by creating a new ASP.NET Core project.\
    \ Follow these steps:\n\n1. Open Visual Studio.\n2. Click `File` -> `New` -> `Project...`\n\
    3. In the “Create a new project” dialog, search for “ASP.NET Core Web Application”\
    \ and select it.\n4. Click `Next`.\n5. Choose a project name, location, and solution\
    \ name, then click `Create`.\n6. In the “Create a new ASP.NET Core web application”\
    \ dialog, select the template that suits your project. You can choose from templates\
    \ like “Web Application,” “API,” and more. For this example, we’ll choose the\
    \ “Web Application” template.\n7. Configure additional settings such as authentication\
    \ if needed.\n8. Click `Create`.\n\n### Understanding the Project Structure\n\n\
    An ASP.NET Core web application consists of several folders and files. Here’s\
    \ a brief overview of the most important:\n\n- `wwwroot`: This folder contains\
    \ static files such as CSS, JavaScript, and images that are served directly to\
    \ clients.\n- `Controllers`: Controllers handle HTTP requests and define the application’s\
    \ behavior.\n- `Views`: Views contain the HTML templates that are rendered to\
    \ produce the user interface.\n- `Startup.cs`: This file contains the configuration\
    \ and middleware setup for your application.\n- `appsettings.json`: Configuration\
    \ settings for the application.\n\n### Creating a Basic Web Page\n\nLet’s create\
    \ a basic web page and controller to display “Hello, ASP.NET Core!” on the homepage.\n\
    \n1. In the `Controllers` folder, create a new controller class named `HomeController.cs`.\
    \ Add the following code:\n\n```csharp\nusing Microsoft.AspNetCore.Mvc;\n\npublic\
    \ class HomeController : Controller\n{\n    public IActionResult Index()\n   \
    \ {\n        return View();\n    }\n}\n```\n\n2. In the `Views` folder, create\
    \ a new folder named `Home` and inside it, create a new view file named `Index.cshtml`.\
    \ Add the following HTML code:\n\n```html\n<!DOCTYPE html>\n<html>\n<head>\n<title>My\
    \ ASP.NET Core App</title>\n</head>\n<body>\n<h1>Hello, ASP.NET Core!</h1>\n</body>\n\
    </html>\n```\n\n3. Build and run your application. You should see “Hello, ASP.NET\
    \ Core!” displayed in your web browser.\n\nCongratulations! You’ve created a basic\
    \ ASP.NET Core web application. In the following sections, we’ll dive deeper into\
    \ ASP.NET Core’s features and explore how to build more complex web applications.\n\
    \n## Section 14.2: Routing and Middleware in ASP.NET Core\n\nIn ASP.NET Core,\
    \ routing and middleware play a crucial role in handling HTTP requests and shaping\
    \ the behavior of your web application. In this section, we’ll explore routing\
    \ and middleware concepts in ASP.NET Core.\n\n### Routing in ASP.NET Core\n\n\
    Routing is the process of determining which controller and action method should\
    \ handle an incoming HTTP request. ASP.NET Core provides a powerful routing system\
    \ that allows you to define URL patterns and map them to specific controllers\
    \ and actions.\n\nHere’s how routing works in ASP.NET Core:\n\n1. **Route Templates:**\
    \ Route templates are defined in controllers using attributes. These templates\
    \ specify the URL pattern that triggers a particular action method. For example,\
    \ `[Route(\"products/{id}\")]` would match URLs like `/products/123`.\n2. **Route\
    \ Constraints:** You can apply constraints to route parameters to restrict the\
    \ values they can accept. For instance, you can specify that the `id` parameter\
    \ must be an integer.\n3. **Route Parameters:** Route parameters are placeholders\
    \ in route templates that capture values from the URL. These values are passed\
    \ as arguments to the action method.\n4. **Route Names:** Routes can be named,\
    \ allowing you to generate URLs instead of hardcoding them.\n\nHere’s an example\
    \ of defining a route in a controller:\n\n```csharp\n[Route(\"products/{id:int}\"\
    )]\npublic IActionResult ProductDetails(int id)\n{\n    // Handle the request\
    \ and display product details.\n}\n```\n\n### Middleware in ASP.NET Core\n\nMiddleware\
    \ components are software components that participate in processing HTTP requests.\
    \ They can perform tasks like authentication, logging, and compression. Middleware\
    \ are executed in the order they are added to the pipeline.\n\nHere’s a simplified\
    \ view of the pipeline:\n\n1. **HTTP Request:** An HTTP request enters the pipeline.\n\
    2. **Middleware:** Middleware components in the pipeline perform tasks such as\
    \ routing, authentication.\n3. **Controller Action:** Once routing determines\
    \ the controller and action method to invoke\n4. **Middleware (Again):** After\
    \ action method execution, additional middleware components perform post-processing\n\
    5. **HTTP Response:** The HTTP response is generated and sent back to the client.\n\
    \nYou can add middleware to the pipeline in `Startup.cs` file. For example:\n\n\
    ```csharp\npublic void Configure(IApplicationBuilder app, IWebHostEnvironment\
    \ env)\n{\n    // Other middleware components\n    app.UseAuthentication(); //\
    \ Add authentication\n}\n```\n\n### Putting It All Together\n\nRouting and middleware\
    \ work together to handle HTTP requests. The routing system determines which controller\
    \ and action method should handle a request based on the URL, and middleware components\
    \ can perform various tasks before and after execution. Understanding routing\
    \ and middleware is essential for building robust web applications.\n\n## Section\
    \ 14.3: Razor Pages and MVC\n\nIn ASP.NET Core, Razor Pages and Model-View-Controller\
    \ (MVC) pattern are two fundamental approaches to building applications. In this\
    \ section, we’ll delve into these approaches and explore when to use each.\n\n\
    ### Razor Pages\n\nRazor Pages is a web application framework that focuses on\
    \ simplicity and productivity. It’s an ideal choice for building small to medium-sized\
    \ applications where a straightforward structure is sufficient.\n\nKey characteristics\
    \ of Razor Pages:\n\n1. **Page-Oriented:** Razor Pages are organized around individual\
    \ pages, each represented by a `.cshtml` file. Each Razor Page can contain both\
    \ the view (HTML markup) and the code-behind (C# code).\n2. **Convention over\
    \ Configuration:** Razor Pages follow a convention-based approach. By default,\
    \ a Razor Page named `Index` in a folder corresponds to the root URL of that folder.\
    \ This simplifies routing.\n3. **Model Binding:** Razor Pages have built-in support\
    \ for model binding, making it easy to work with form data and URL parameters.\
    \ Page models are responsible for handling user input and responding to requests.\n\
    4. **Partial Pages:** Reusable page sections called “partial pages” can be created\
    \ and included in multiple Razor Pages, promoting code reusability.\n\nHere’s\
    \ a basic example of a Razor Page:\n\n```html\n<!-- Pages/Index.cshtml -->\n@page\n\
    @model IndexModel\n<h1>Welcome to My Website</h1>\n<p>Hello, @Model.UserName!</p>\n\
    ```\n\n```csharp\n// Pages/Index.cs (code-behind)\npublic class IndexModel : PageModel\n\
    {\n    public string UserName { get; set; }\n    public void OnGet()\n    {\n\
    \        UserName = \"John\";\n    }\n}\n```\n\n### Model-View-Controller (MVC)\n\
    \nMVC is a widely adopted architectural pattern for building web applications.\
    \ It provides a structured approach suitable for large and complex applications.\n\
    \nKey components of MVC:\n\n1. **Model:** Represents the application’s data and\
    \ business logic. Models are responsible for retrieving and storing data.\n2.\
    \ **View:** Represents the presentation layer and is responsible for rendering\
    \ the user interface. Views receive data from the model and display it to users.\n\
    3. **Controller:** Acts as an intermediary between the model and view. Controllers\
    \ handle incoming requests, interact with models to retrieve data, and pass that\
    \ data to views for rendering.\n\nMVC offers a separation of concerns, making\
    \ it easier to maintain and scale applications. It’s a great choice when you need\
    \ precise control over routing and a more modular code structure.\n\nHere’s a\
    \ simplified example of MVC:\n\n```csharp\n// Controller\npublic class HomeController\
    \ : Controller\n{\n    public IActionResult Index()\n    {\n        var userName\
    \ = \"Jane\";\n        return View(\"Index\", userName);\n    }\n}\n```\n\n```html\n\
    <!-- Views/Home/Index.cshtml -->\n@model string\n<h1>Welcome to My Website</h1>\n\
    <p>Hello, @Model!</p>\n```\n\n### Choosing Between Razor Pages and MVC\n\nThe\
    \ choice between Razor Pages and MVC depends on your application’s complexity\
    \ and requirements. Here are some guidelines:\n\n- Use Razor Pages for small to\
    \ medium-sized applications, prototypes, or scenarios where simplicity and rapid\
    \ development are essential.\n- Choose MVC for larger applications with more complex\
    \ requirements, where a clear separation of concerns, flexibility in routing,\
    \ and fine-grained control over components is needed.\n\nBoth Razor Pages and\
    \ MVC are first-class citizens in ASP.NET Core, and you can even combine them\
    \ in a single application if it suits your needs. Ultimately, the choice should\
    \ align with your project’s specific goals and constraints.\n\n## Section 14.4:\
    \ Authentication and Authorization\n\nAuthentication and authorization are critical\
    \ aspects of web application security. In this section, we’ll explore these two\
    \ concepts and how they are implemented in ASP.NET Core.\n\n### Authentication\n\
    \nAuthentication is the process of verifying the identity of a user or system.\
    \ It answers the question, “Who are you?” Users typically provide credentials\
    \ (such as username and password) to prove their identity. ASP.NET Core provides\
    \ robust authentication mechanisms:\n\n1. **Cookie-based Authentication:** This\
    \ method uses encrypted cookies to track users. Once a user logs in, a cookie\
    \ is issued.\n2. **Token-based Authentication:** Often used for web APIs, this\
    \ involves the issuance of a JSON Web Token (JWT) upon successful login.\n3. **External\
    \ Authentication:** ASP.NET Core supports external providers like Google, Facebook,\
    \ and Microsoft.\n\nHere’s a simplified example of setting up cookie-based authentication\
    \ in `Startup.cs`:\n\n```csharp\npublic void ConfigureServices(IServiceCollection\
    \ services)\n{\n    // Other middleware components\n    services.AddAuthentication(AuthenticationDefaults.AuthenticationScheme)\n\
    \        .AddCookie(options =>\n        {\n            options.LoginPath = \"\
    /Account/Login\";\n            options.AccessDeniedPath = \"/Account/Denied\"\
    ;\n        });\n}\n```\n\n```csharp\n// AccountController.cs\n[Anonymous]\npublic\
    \ IActionResult Login()\n{\n    // Your login logic\n    return View();\n}\n\n\
    [HttpPost]\npublic async Task<IActionResult> Login(LoginViewModel model)\n{\n\
    \    // Authenticate the user\n    // ...\n    return RedirectToAction(\"Index\"\
    );\n}\n```\n\n### Authorization\n\nAuthorization, on the other hand, determines\
    \ what authenticated users are allowed to do. It answers the question, “What are\
    \ you allowed to?” ASP.NET Core offers flexible mechanisms:\n\n1. **Role-based\
    \ Authorization:** Users are assigned roles, and actions are decorated with `[Authorize(Roles\
    \ = \"Admin\")]`.\n2. **Policy-based Authorization:** Fine-grained control is\
    \ achieved by defining policies. Policies can use claims or custom criteria.\n\
    \nHere’s a simple example of role-based authorization:\n\n```csharp\n// MyController.cs\n\
    [Authorize(Roles = \"Admin\")]\npublic class AdminController : Controller\n{\n\
    \    // Actions only accessible to admins\n}\n```\n\n### Combining Authentication\
    \ and Authorization\n\nAuthentication and authorization often go in hand. Once\
    \ a user is authenticated, authorization rules determine which parts of the application\
    \ they can access. ASP.NET Core’s flexible middleware allows you to easily integrate\
    \ these processes. In summary, authentication verifies a user’s identity, while\
    \ authorization defines what actions or resources.\n\n## Section 14.5: Real-time\
    \ Web Applications with SignalR\n\nIn modern web applications, real-time communication\
    \ between clients and the server is becoming important. Users expect features\
    \ like instant messaging, live updates, and interactive collaboration. ASP.NET\
    \ Core provides SignalR, a library that simplifies the implementation of real-time\
    \ functionality in web applications.\n\n### What is SignalR?\n\nSignalR is an\
    \ open-source library for ASP.NET Core that enables real-time, bidirectional communication\
    \ between clients and the server. It abstracts the underlying transport mechanisms\
    \ (WebSockets, Server-Sent Events, Long Polling, etc.) to provide a consistent\
    \ API.\n\n### Key Features of SignalR:\n\n1. **Real-time Communication:** SignalR\
    \ allows server-to-client and client-to-server communication in real time. This\
    \ is ideal for applications like chat rooms, live notifications, and collaborative\
    \ tools.\n2. **Cross-Platform Support:** SignalR works across various platforms,\
    \ including web browsers, mobile devices, and desktop applications, making it\
    \ versatile for building cross-platform solutions.\n3. **Transport Protocols:**\
    \ It supports multiple transport protocols, falling back to the most suitable\
    \ one for the client’s capabilities.\n4. **Hub-based Model:** SignalR uses a hub-based\
    \ model, where the server and clients communicate through hubs. Hubs are like\
    \ channels or groups where messages can be sent and received.\n5. **Authentication\
    \ and Authorization:** SignalR seamlessly integrates with ASP.NET Core’s authentication\
    \ and authorization systems, allowing you to control access to real-time features.\n\
    \n### Getting Started with SignalR\n\nTo get started with SignalR in an ASP.NET\
    \ Core application, you’ll need to follow these basic steps:\n\n1. **Install the\
    \ SignalR Package:** Add the SignalR package to your project using NuGet Package\
    \ Manager.\n2. **Create a Hub:** Create a SignalR hub that defines the methods\
    \ clients can call and the events they can listen to.\n3. **Configure SignalR:**\
    \ In your `Startup.cs` file, configure SignalR by adding it to the middleware\
    \ pipeline.\n4. **Client-Side Code:** Implement the SignalR client in your web\
    \ application’s JavaScript or TypeScript code.\n\nHere’s a simplified example\
    \ of setting up a SignalR hub and client:\n\n```csharp\n// Server-Side Code (Hub)\n\
    using Microsoft.AspNetCore.SignalR;\n\npublic class ChatHub : Hub\n{\n    public\
    \ async Task SendMessage(string user, string message)\n    {\n        await Clients.All.SendAsync(\"\
    ReceiveMessage\", user, message);\n    }\n}\n```\n\n```javascript\n// Client-Side\
    \ Code (JavaScript)\nconst connection = new signalR.HubConnectionBuilder()\n \
    \   .withUrl(\"/chatHub\")\n    .build();\n\nconnection.on(\"ReceiveMessage\"\
    , (user, message) => {\n    // Handle received message\n});\n\nconnection.start().then(()\
    \ => {\n    // Connection established\n}).catch(err => {\n    console.error(err);\n\
    });\n\n// Sending a message\nconnection.invoke(\"SendMessage\", \"User\", \"Hello!\"\
    );\n```\n\n# Chapter 15: Advanced Web Development\n\n## Section 15.1: Dependency\
    \ Injection\n\nDependency injection is a fundamental concept in modern development.\
    \ In ASP.NET Core, dependency injection is built into the framework, allowing\
    \ you to manage dependencies in a clean way.\n\n### What Is Dependency Injection?\n\
    \nDependency injection is a design pattern that helps you achieve loose coupling.\
    \ It allows you to provide dependencies (objects or services) to a class rather\
    \ than having the class create them itself.\n\n### Setting Up Dependency Injection\n\
    \nTo use dependency injection in ASP.NET Core, start by registering your services.\
    \ This is done in `Startup.cs` within the `ConfigureServices` method.\n\n```csharp\n\
    public void ConfigureServices(IServiceCollection services)\n{\n    services.AddScoped<IMyService,\
    \ MyService>();\n}\n```\n\nIn this example, `IMyService` is an interface, and\
    \ `MyService` is the concrete implementation. `AddScoped` specifies that a new\
    \ instance should be created for each HTTP request.\n\n### Injecting Dependencies\
    \ into Controllers\n\nOnce services are registered, you can inject them into your\
    \ controllers or other components.\n\n```csharp\npublic class MyController : Controller\n\
    {\n    private readonly IMyService _myService;\n\n    public MyController(IMyService\
    \ myService)\n    {\n        _myService = myService;\n    }\n}\n```\n\n### Benefits\
    \ of Dependency Injection\n\nDependency injection in ASP.NET Core offers several\
    \ benefits:\n\n- **Testability:** By injecting dependencies, you can easily substitute\
    \ real implementations with mock objects during unit testing.\n- **Maintainability:**\
    \ Changes to service implementations can be isolated.\n- **Flexibility:** You\
    \ can switch implementations or configurations without altering the dependent\
    \ code.\n- **Scalability:** Managing the lifetime of services (e.g., transient,\
    \ scoped, or singleton) is straightforward.\n\n## Section 15.2: Building RESTful\
    \ APIs with ASP.NET Core\n\nBuilding RESTful APIs (Representational State Transfer)\
    \ is a common requirement for modern web applications. REST is an architectural\
    \ style for designing networked applications, and ASP.NET Core provides excellent\
    \ support for creating RESTful APIs.\n\n### What Is a RESTful API?\n\nA RESTful\
    \ API is an application programming interface that follows the principles of REST.\
    \ These principles include using standard HTTP methods (`GET`, `POST`, `PUT`,\
    \ `DELETE`) for performing operations on resources, representing resources as\
    \ URIs, and using standard HTTP status codes to indicate the result of API requests.\n\
    \n### Creating an ASP.NET Core Web API\n\nTo create a RESTful API with ASP.NET\
    \ Core, you can start with an empty ASP.NET Core project or use a template like\
    \ the “ASP.NET Core Web API” template.\n\nHere are the high-level steps:\n\n1.\
    \ **Create a New Project:** Use your preferred development environment to create\
    \ a new ASP.NET Core Web API project.\n2. **Define Data Models:** Define the data\
    \ models (entities) that your API will work with.\n3. **Create Controllers:**\
    \ Create controllers that define the API endpoints and actions.\n4. **Implement\
    \ CRUD Operations:** Implement Create, Read, Update, and Delete functionality.\n\
    \n### Example of an API Controller\n\n```csharp\n[ApiController]\n[Route(\"api/[controller]\"\
    )]\npublic class ProductsController : ControllerBase\n{\n    [HttpGet]\n    public\
    \ IEnumerable<Product> GetProducts()\n    {\n        // return products\n    }\n\
    \n    [HttpPost]\n    public IActionResult PostProduct(Product product)\n    {\n\
    \        // add new product\n        return Ok();\n    }\n}\n```\n\n## Section\
    \ 15.3: Microservices Architecture\n\nMicroservices architecture is a software\
    \ design pattern that has gained popularity. It is an architectural style where\
    \ an application is composed of multiple small, independent services that communicate.\n\
    \n### Key Concepts of Microservices\n\n- **Decomposition:** A monolithic application\
    \ is decomposed into a collection of loosely coupled services.\n- **Independence:**\
    \ Microservices are independent entities that can be developed and deployed separately.\n\
    - **Communication:** Services communicate with each other through well-defined\
    \ APIs.\n- **Scaling:** Services can be scaled independently.\n- **Technology\
    \ Diversity:** Different services can use different technologies and languages.\n\
    \n### Advantages of Microservices\n\n- **Scalability:** Microservices allow you\
    \ to scale individual components based on demand.\n- **Faster Development:** Smaller,\
    \ focused teams can develop and release services independently.\n- **Fault Isolation:**\
    \ Issues in one service are less likely to affect the entire application.\n\n\
    ### Challenges of Microservices\n\nWhile microservices offer several advantages,\
    \ they also introduce challenges:\n\n- **Complexity:** Managing a large number\
    \ of services can become complex.\n- **Data Management:** Handling data consistency\
    \ among services can be challenging.\n- **Deployment and Orchestration:** Coordinating\
    \ the deployment of multiple services is difficult.\n\n## Section 15.4: Containerization\
    \ with Docker\n\nDocker is a powerful tool for containerization, which has revolutionized\
    \ the way applications are developed, shipped, and run. Containers are lightweight,\
    \ standalone, and executable packages that contain everything needed to run a\
    \ piece of software.\n\n### Understanding Docker\n\n- **Images:** Docker uses\
    \ images as templates to create containers. An image is a read-only file containing\
    \ a snapshot of a software application.\n- **Containers:** Containers are instances\
    \ of Docker images. They are lightweight, runnable environments.\n- **Dockerfile:**\
    \ A text file that contains instructions for building an image.\n- **Docker Hub:**\
    \ A cloud-based registry that hosts images.\n\n### Benefits of Docker\n\n- **Consistency:**\
    \ Containers run consistently across different environments.\n- **Isolation:**\
    \ Containers are isolated from each other.\n- **Portability:** Containers can\
    \ run on any system that supports Docker.\n- **Resource Efficiency:** Containers\
    \ are lightweight compared to virtual machines.\n\n### Docker in Practice\n\n\
    To use Docker effectively, follow these steps:\n\n1. **Write a Dockerfile:** Create\
    \ a file that defines the environment.\n2. **Build the Image:** Use the `docker\
    \ build` command.\n3. **Run Containers:** Use the `docker run` command to start\
    \ a container from the image.\n4. **Orchestration:** Use tools like Kubernetes\
    \ to manage multiple containers.\n\n## Section 15.5: Deploying Web Applications\
    \ to the Cloud\n\nCloud computing has transformed the way applications are developed,\
    \ deployed, and managed. It provides a scalable and cost-effective solution.\n\
    \n### Cloud Service Models\n\n- **Infrastructure as a Service (IaaS):** Rent virtualized\
    \ hardware resources like virtual machines.\n- **Platform as a Service (PaaS):**\
    \ Provides a higher-level abstraction, allowing you to focus on development.\n\
    - **Serverless Computing:** Abstracts away servers completely; you pay for the\
    \ execution of code.\n\n### Popular Cloud Providers\n\n- **Amazon Web Services\
    \ (AWS):** The largest and most popular provider.\n- **Microsoft Azure:** Provides\
    \ a comprehensive suite of services.\n- **Google Cloud Platform (GCP):** Offers\
    \ a wide range of cloud services.\n\n### Deployment Strategies\n\n- **CI/CD (Continuous\
    \ Integration/Continuous Deployment):** Automate building, testing, and deployment.\n\
    - **Load Balancing:** Distribute incoming traffic across multiple instances.\n\
    - **Database Scaling:** Use managed services or strategies like sharding.\n- **Content\
    \ Delivery Networks (CDNs):** Cache static assets globally.\n\n# Chapter 16: Security\
    \ in C#\n\n## Section 16.1: Authentication and Authorization\n\nAuthentication\
    \ and authorization are critical aspects of software security. In this section,\
    \ we’ll explore these concepts.\n\n### Authentication vs. Authorization\n\n- **Authentication:**\
    \ The process of verifying the identity of a user (Who are you?).\n- **Authorization:**\
    \ Determines what authenticated users are allowed to do (What are you allowed\
    \ to do?).\n\n### Authentication Techniques\n\n- **Username and Password:** The\
    \ most common method. \n- **Multi-Factor Authentication (MFA):** Requires two\
    \ or more forms of identification.\n- **Token-Based Authentication:** Uses JSON\
    \ Web Tokens (JWT).\n- **OAuth and OpenID Connect:** Protocols for authenticating\
    \ users via third parties.\n\n### Authorization Techniques\n\n- **Role-Based Access\
    \ Control (RBAC):** Assigns users to roles with specific permissions.\n- **Attribute-Based\
    \ Access Control (ABAC):** Evaluates attributes to make decisions.\n- **Claims-Based\
    \ Authorization:** Uses claims (information about the user).\n- **Resource-Based\
    \ Authorization:** Access based on the specific resource.\n\n## Section 16.2:\
    \ Securing Web Applications\n\nSecuring web applications is of paramount importance\
    \ to protect data and the application.\n\n1. **Input Validation:** Always validate\
    \ inputs to prevent SQL injection, XSS, and CSRF.\n2. **Cross-Site Scripting (XSS)\
    \ Prevention:** Use output encoding and sanitize user-generated content.\n3. **Authentication\
    \ and Authorization:** Implement robust mechanisms.\n4. **Session Management:**\
    \ Use secure session tokens and timeouts.\n5. **HTTPS Everywhere:** Enforce HTTPS\
    \ to encrypt data in transit.\n6. **Content Security Policy (CSP):** Implement\
    \ policies to mitigate XSS.\n7. **Cross-Origin Resource Sharing (CORS):** Restrict\
    \ which domains can access your API.\n8. **Regular Security Audits:** Code reviews\
    \ and assessments.\n9. **Error Handling:** Avoid exposing detailed information.\n\
    \n## Section 16.3: Handling Security Vulnerabilities\n\nHandling security vulnerabilities\
    \ is a crucial aspect of maintaining integrity.\n\n- **SQL Injection:** Use parameterized\
    \ queries or Entity Framework.\n- **Cross-Site Request Forgery (CSRF):** Use anti-forgery\
    \ tokens.\n- **Cross-Site Scripting (XSS):** Use output encoding.\n- **Insecure\
    \ File Uploads:** Validate file types and store them securely.\n- **Sensitive\
    \ Data Exposure:** Use encryption for passwords and keys.\n\n## Section 16.4:\
    \ Identity and Access Management\n\nIdentity and access management (IAM) are fundamental\
    \ for security.\n\n- **Authentication vs. Authorization:** (Already discussed).\n\
    - **Role-Based Access Control (RBAC):** Manage access via roles.\n- **Single Sign-On\
    \ (SSO):** Allow one login for multiple systems.\n- **Multi-Factor Authentication\
    \ (MFA):** Enhance security.\n\n## Section 16.5: Secure Coding Practices\n\nSecure\
    \ coding practices are vital for building resilient applications.\n\n- **Input\
    \ Validation:** Validate all inputs.\n- **Output Encoding:** Prevent XSS by encoding.\n\
    - **Authentication and Authorization:** Use strong mechanisms.\n- **Password Storage:**\
    \ Use salted and hashed passwords.\n- **Error Handling:** Don't expose sensitive\
    \ info.\n\n# Chapter 17: Software Testing and Quality Assurance\n\n## Section\
    \ 17.1: Types of Software Testing\n\nSoftware testing is critical for ensuring\
    \ quality and reliability.\n\n1. **Unit Testing:** Testing individual components\
    \ in isolation.\n2. **Integration Testing:** Testing how modules work together.\n\
    3. **Functional Testing:** Checking if software meets requirements.\n4. **Regression\
    \ Testing:** Ensuring changes didn't break existing features.\n5. **Performance\
    \ Testing:** Evaluating speed under load.\n6. **Security Testing:** Identifying\
    \ vulnerabilities.\n7. **User Acceptance Testing (UAT):** Testing by end-users.\n\
    8. **Usability Testing:** Assessing how user-friendly the app is.\n9. **Compatibility\
    \ Testing:** Testing across devices/OS.\n10. **Localization/Internationalization:**\
    \ Testing for languages/cultures.\n11. **Exploratory Testing:** Unscripted testing.\n\
    12. **Ad Hoc Testing:** Informal testing without plan.\n13. **Alpha and Beta Testing:**\
    \ Internal vs. external-user testing.\n\n## Section 17.2: Writing Unit Tests\n\
    \nUnit testing involves testing individual units of code.\n\n- **Frameworks:**\
    \ NUnit, xUnit, MSTest.\n- **Process:** Arrange, Act, Assert.\n\n## Section 17.3:\
    \ Test Automation with NUnit and xUnit\n\nAutomated testing saves time and ensures\
    \ consistency.\n\n- **NUnit:** Uses `[Test]`, `[TestCase]`.\n- **xUnit:** Uses\
    \ `[Fact]`, `[Theory]`.\n\n## Section 17.4: Continuous Integration and Continuous\
    \ Delivery (CI/CD)\n\nCI/CD automates the development lifecycle.\n\n- **CI:**\
    \ Frequent merging and testing of code.\n- **CD:** Automated deployment to environments.\n\
    - **Tools:** Azure DevOps, Jenkins, TeamCity, GitLab CI/CD.\n\n## Section 17.5:\
    \ Performance Testing and Profiling\n\nPerformance ensures efficiency.\n\n- **Load\
    \ Testing:** Under expected load.\n- **Stress Testing:** Pushing limits.\n- **Scalability\
    \ Testing:** Handling growth.\n- **Profiling:** Analyzing execution (CPU, memory).\n\
