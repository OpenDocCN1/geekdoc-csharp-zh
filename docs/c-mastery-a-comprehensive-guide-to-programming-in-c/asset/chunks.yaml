    3. 您可以像在物理设备上一样在模拟器上与应用程序交互。\n\n## 让跨平台移动开发变得更简单\n\nXamarin 通过允许您利用 C# 技能共享代码，简化了跨平台移动开发。无论您是构建简单的工具应用，还是带有控制器和路由的应用程序，Xamarin\
