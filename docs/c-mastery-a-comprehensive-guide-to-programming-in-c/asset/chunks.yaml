  trans: '

    Windows Forms 是 .NET Framework 以及后续 .NET Core 的一部分，它允许你为 Windows 操作系统创建桌面应用程序。与
    Web 不同，Windows Forms 应用程序运行在用户的本地机器上，提供了更响应性和交互性的用户体验。


    ## 核心概念


    ### 表单 (Form)

    在 Windows Forms 中，表单是主窗口或对话框，作为应用程序的主要用户界面。表单通过继承 `System.Windows.Forms.Form`
    类创建。它们可以承载各种控件，如按钮、文本框、标签等。


    ### 控件 (Controls)

    控件是放置在表单上的 UI 元素，用于启用用户交互。Windows Forms 提供了丰富的控件，包括按钮、文本框、复选框、单选按钮、列表框和组合框。你可以自定义控件的外观和行为以满足你的应用程序需求。


    ### 事件驱动编程 (Event-Driven Programming)

    Windows Forms 应用程序是事件驱动的，这意味着它们会对用户交互和系统事件做出响应。你编写事件处理器来定义当用户点击按钮、输入文本或执行其他操作时，应用程序应该如何响应。事件处理器是在响应特定事件（如按钮点击或鼠标移动）时执行的方法。


    ## 创建 Windows Forms 应用程序

    在 Visual Studio 中创建 Windows Forms 应用程序：


    1. 打开 Visual Studio 并选择“创建新项目”。

    2. 选择“Windows Forms App (.NET Core)”或类似的模板。

    3. Visual Studio 将为你生成一个默认表单，你可以通过添加控件和事件处理器对其进行自定制。


    ### 简单的 Windows Forms 示例

    这是一个简单的 Windows Forms 应用程序示例，包含一个点击时会显示消息的按钮：


    ```csharp

    using System;


    using System.Windows.Forms;


    namespace MyWinFormsApp


    {


    public partial class MainForm : Form


    {


    public MainForm()

    {


    InitializeComponent();

    }


    private void button1_Click(object sender, EventArgs e)

    {


    MessageBox.Show("Hello, WinForms!");


    }


    }


    }

    ```


    在这个示例中，我们创建了一个带有按钮控件的表单。当按钮被点击时，它会触发 `button1_Click` 事件处理器，显示一个消息框。


    Windows Forms 为使用 C# 创建具有图形用户界桌面应用程序提供了一个强大的平台。它被广泛用于构建 Windows 业务应用程序、实用程序以及各种其他桌面软件。在接下来的章节中，我们将探索与
    Windows Forms 应用程序开发相关的更多高级主题。


    ## 第 5.2 节：使用 WinForms 设计用户界面

    设计用户界面 (UI) 是 Windows Forms (WinForms) 应用程序开发的关键。创建直观且视觉吸引人的 UI 可以增强用户体验。在本节中，我们将探索如何使用
    WinForms 设计用户界面。


    ### WinForms 中的视觉设计

    WinForms 在 Visual Studio 内部提供了一个视觉设计环境，允许你通过拖放控件来设计 UI。以下是入门步骤：


    1. 打开表单设计器：在 Visual Studio 中，通过双击表单的设计文件（通常以 `.Designer.cs` 结尾）打开要设计的表单。

    2. 工具箱 (Toolbox)：Visual Studio 左侧的工具箱面板包含你可以在 UI 中使用的控件列表。只需将控件从工具箱拖到表单上即可。

    3. 属性窗口 (Properties Window)：属性窗口允许你自定义控件和表单的属性。你可以设置控件名称、文本、大小和颜色等属性。

    4. 布局 (Layout)：WinForms 提供了如 `TableLayoutPanel` 和 `FlowLayoutPanel` 这样的布局控件来帮助组织你的
    UI 元素。这些控件有助于保持一致且响应良好的设计。


    ### 常见的 WinForms 控件

    WinForms 提供了多种控件来创建各种 UI 元素。一些常用控件包括：


    - `Button`：用于点击时触发操作。

    - `Label`：用于显示静态文本。

    - `TextBox`：接受用户输入。

    - `ComboBox`：从下拉列表中选择项目。

    - `ListBox`：显示项目列表。

    - `CheckBox` 和 `RadioButton`：用于二选一。

    - `DataGridView`：显示表格数据。

    - `PictureBox`：显示图像。

    - `MenuStrip` 和 `ToolStrip`：创建菜单栏和工具栏。

    - `TabControl`：创建标签页界面。


    ### WinForms 中的事件处理

    为了让你的 UI 具有交互，你需要处理由用户操作触发的事件。WinForms 控件生成按钮点击、文本更改和鼠标移动等事件。你可以编写事件处理器来响应这些事件。


    ```csharp

    private void button1_Click(object sender, EventArgs e)

    {


    // 点击按钮时执行的代码。

    }

    ```


    在 Visual Studio 表单设计器中，你可以双击控件来自动生成事件处理器。


    ### 布局与锚定 (Layout and Anchoring)

    正确的布局对于确保 UI 元素在不同屏幕尺寸和分辨率下正确显示至关重要。WinForms 提供了 `TableLayoutPanel` 和 `FlowLayoutPanel`
    等布局控件来帮助实现。


    此外，控件的 `Anchor` 属性允许你指定控件在父容器调整大时的行为。你可以将控件锚定在左、右、顶部或底部，确保它们能够适当调整大小和位置。


    ### 本地化与辅助功能

    WinForms 支持本地化，使得创建多种语言应用程序应用程序可能。你可以通过为种语言提供本地化资源文件来轻松翻译应用程序界面。


    为了让你的 WinForms 应用程序更易访问，请为控件使用辅助名称和描述，并确保正确的键盘导航和焦点处理。


    ### 测试与调试

    彻底测试你的 WinForms 应用程序以确保它们按预期工作。Visual Studio 提供了调试工具用于识别和修复代码及 UI 中的问题。


    ### 结论

    使用 WinForms 设计用户界面是 Windows 桌面应用程序开发中的一项关键技能。通过使用视觉设计工具、处理事件并关注布局和辅助功能，你可以创建精美且用户友好的应用程序。在接下来的章节中，我们将探索
    WinForms 开发相关的更多高级主题，包括数据绑定和事件驱动编程。


    ## 第 5.3 节：处理事件和用户输入

    处理事件和用户输入是 Windows Forms (WinForms) 应用程序开发的基础。在本节中，我们将探索如何处理你的 WinForms 应用程序中的各种事件和用户交互。


    ### 事件驱动编程

    Windows Forms 应用程序是事件驱动的，这意味着它们会对用户操作或系统事件触发的事件响应。事件由控件（如按钮点击、鼠标移动）或系统（如表单加载、窗口调整大小）生成。为了处理事件，你编写事件处理器方法来定义当特定事件发生时应该做什么。


    ### WinForms 中的事件处理

    以下是在 WinForms 应用程序中处理事件的步骤指南：


    1. 选择控件：首先，在 Visual Studio 表单设计器中选择要添加事件处理器的控件（例如按钮、文本框）。

    2. 打开属性窗口：在属性窗口中，点击“事件”按钮（通常带有闪电图标）。这列出了所选控件的可用事件。

    3. 双击事件：要为特定事件创建事件处理器，请双击属性窗口中的事件名称。Visual Studio 将生成事件处理器方法并打开代码编辑器。

    4. 编写事件处理器：在生成的事件处理器方法中，编写在事件触发时应执行的代码。


    ```csharp

    private void button1_Click(object sender, EventArgs e)

    {


    // 点击按钮时执行的代码。

    }

    ```


