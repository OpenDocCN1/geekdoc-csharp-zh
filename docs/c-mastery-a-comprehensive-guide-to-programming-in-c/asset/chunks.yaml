    \n## 声明变量\n\n在 C# 中声明变量，你需要指定其数据类型，后跟一个名称。以下是一些常见的数据类型和变量声明：\n\n```csharp\nint\
    \ age; // 声明一个名为 'age' 的整数变量\ndouble price; // 声明一个名为 'price' 的双精度浮变量\nstring\
    \ name; // 声明一个名为 'name' 的字符串变量\nbool isStudent; // 声明一个名为 'isStudent' 的布尔变量\n\
    ```\n\n## 初始化变量\n\n声明变量后，你可以使用赋值运算符 `=` 为其分配一个值。这被称为初始化。以下是初始化变量的方法：\n\n```csharp\n\
    age = 30; // 将 'age' 初始化为值 30\nprice = 19.99; // 将 'price' 初始化为值 19.99\nname =\
    \ \"John\"; // 将 'name' 初始化为字符串 \"John\"\nisStudent = true; // 将 'isStudent' 初始化为布尔值\
    \ 'true'\n```\n\n你也可以在一行中声明并初始化变量：\n\n```csharp\nint age = 30; // 声明并初始化 'age'\n\
    double price = 19.99; // 声明并初始化 'price'\nstring name = \"John\"; // 声明并初始化 'name'\n\
    bool isStudent = true; // 声明并初始化 'isStudent'\n```\n\n## 数据类型\n\nC# 提供了各种数据类型来存储不同类型的数据。以下是一些常见的数据类型：\n\
    \n- 数字类型：\n  - `int`: 表示 32 位有符号整数。\n  - `double`: 表示双精度浮点数。\n  - `float`: 表示单精度浮点数。\n\
    \  - `decimal`: 表示高精度的小数数字。\n- 文本类型：\n  - `string`: 表示字符序列（文本）。\n  - `char`: 表示单个字符。\n\
    - 布尔类型：\n  - `bool`: 表示布尔值，即真（true）或假（false）。\n- 其他类型：\n  - `DateTime`: 表示日期和时间。\n\
    \  - `enum`: 表示一组命名常量。\n\n## 类型推断 (var 关键字)\n\n在 C# 中，你可以使用 `var` 关键字声明变量，而不显式指定数据类型。编译器会根据分配的值推断数据类型：\n\
    \n```csharp\nvar age = 30; // 'age' 被推断为 int\nvar price = 19.99; // 'price' 被推断为\
    \ double\nvar name = \"John\"; // 'name' 被推断为 string\nvar isStudent = true; //\
    \ 'isStudent' 被推断为 bool\n```\n\n虽然 `var` 可以让你的代码更简洁，但谨慎使用它以保持代码的清晰度和可读性是非常重要的。\n\
    \n## 常量\n\n除了变量，你还可以使用 `const` 关键字在 C# 中声明常量。常量具有固定值，一旦定义就无法更改：\n\n```csharp\n\
    const double pi = 3.14159; // 声明常量 'pi'\n```\n\n当你的程序中有在执行期间不应改变的值时，常量非常有用。\n\n\
    理解变量和数据类型是 C# 编程的关键第一步。它们为在应用程序中存储和处理数据提供了基础。在接下来的章节中，我们将探索如何通过表达式、操作和控制流更有效地处理这些变量和数据类型。\n\
    \n## 2.3 节：C 中的输入与输出\n\n在本节中，我们将探索如何在 C# 中执行输入输出。输入允许你的程序从外部源（如用户、文件或其他程序）接收数据，而输出允许你的程序通信结果或信息。\n\
    \n## 控制台输入\n\nC# 提供了几种方法从控制台读取用户输入。最常用的方法之一是 `Console.ReadLine()`，它读取用户的一行的文本并将其作为字符串返回：\n\
    \n```csharp\nConsole.Write(\"Enter your name: \");\nstring name = Console.ReadLine();\n\
    Console.WriteLine($\"Hello, {name}!\");\n```\n\n在这段代码中：\n- `Console.Write(\"Enter\
    \ your name: \");` 向用户显示提示。\n- `Console.ReadLine()` 等待用户输入文本并将其存储在变量 `name` 中。\n\
    - `Console.WriteLine($\"Hello, {name}!\");` 使用输入的名称打印问候。\n\n你可以使用类似的方法来读取其他类型的数据（如数字或字符），并将它们转换为适当的数据类型。\n\
    \n## 控制台输出\n\n我们已经看到 `Console.WriteLine()` 用于输出，它写入文本后跟一个换行符。你也可以使用 `Console.Write()`\
    \ 输出不带换行的文本：\n\n```csharp\nConsole.Write(\"Hello, \");\nConsole.Write(\"World!\"\
    );\n```\n\n这段代码在单行输出“Hello, World!”。\n\n## 字符串插值\n\n字符串插值是一种在字符串中嵌入表达式的方便方法。你可以使用\
    \ `$` 符号后跟 `{}` 在字符串中包含变量值或表达式：\n\n```csharp\nstring name = \"Alice\";\nint age\
    \ = 25;\nConsole.WriteLine($\"Hello, {name}! You are {age} years old.\");\n```\n\
    \n字符串插值使得创建动态且可读的消息变得简单。\n\n## 输出格式化\n\n你可以使用各种格式指定符格式化输出。例如，要格式化具有特定小数位的数字，请使用\
    \ `F` 规格符：\n\n```csharp\ndouble price = 19.99;\nConsole.WriteLine($\"Price: {price:F2}\"\
    );\n```\n\n这段代码输出两位小数。\n\n## 控制台输入转换\n\n从控制台读取输入时，你可能需要将其转换为数据类型。例如，为了读取整数，可以使用\
    \ `Parse()`：\n\n```csharp\nConsole.Write(\"Enter your age: \");\nstring ageInput\
    \ = Console.ReadLine();\nint age = int.Parse(ageInput);\n```\n\n在使用 `Parse()`\
    \ 时要小心，因为如果无法转换会抛出异常。\n\n## 异常处理\n\n为了处理转换错误，可以使用 `TryParse()`。这些方法尝试解析并返回一个表示成功的布尔值：\n\
    \n```csharp\nConsole.Write(\"Enter your age: \");\nstring ageInput = Console.ReadLine();\n\
    if (int.TryParse(ageInput, out int age))\n{\n    Console.WriteLine($\"You entered\
    \ a valid age: {age}\");\n}\nelse\n{\n    Console.WriteLine(\"Invalid input. Please\
    \ enter a valid age.\");\n}\n```\n\n这段代码检查输入是否可以解析为整数。\n\n## 文件输入与输出\n\n除了控制台输入输出外，C#\
    \ 还允许你处理文件。你可以使用 `File` 和 `StreamReader` 从文件读取数据，使用 `File` 和 `StreamWriter` 向文件写入数据。在处理大数据或需要在程序运行之间保存和检索数据时，文件操作是关重要的。\n\
    \n理解输入输出操作至关重要，因为它们使程序能够与用户、外部数据和其他组件交互。在接下来的章节中，我们将探索更高级的主题，包括控制流、决策和循环。\n\n\
    ## 2.4 节：控制流与决策\n\n控制流和决策是编程中的基础概念。它们允许你的 C# 程序根据条件做出选择、重复操作并遵循特定路径。在本节中，我们将探索条件语句和循环等控制流结构。\n\
    \n## 条件语句 (if, else 和 switch)\n\n条件语句用于程序中做出决策。C# 提供了多种条件结构，最常见的是 `if`、`else if`、`else`\
    \ 和 `switch`。\n\n### if 语句\n\n`if` 语句允许在条件为真时执行代码块。这是一个基础示例：\n\n```csharp\nif\
    \ (age >= 18) \n{\n    Console.WriteLine(\"You are an adult.\");\n}\n```\n\n在这段代码中，如果条件\
    \ `age >= 18` 为真，将显示“You are an adult.”。\n\n### else 语句\n\n你可以使用 `else` 语句在 `if`\
