    \            if (customer != null)\n            {\n                context.Customers.Remove(customer);\
    \ // 删除客户\n                context.SaveChanges();\n            }\n        }\n\
    \    }\n}\n```\n\n### 总结\n\nEntity Framework 通过提供面向对象的方法来与数据库交互，简化了数据库访问。对于 C#\
    \ 开发者来说，这是一个强大的工具，允许你使用 C# 类和 LINQ 查询处理数据库，同时抽象了数据库操作的复杂性。无论你是查询数据、插入、更新还是删除记录，Entity\
    \ Framework 都能简化数据库相关的任务并提高代码的可维护性。\n\n## 第 13.5 节：NoSQL 和文档数据库\n\n在本节中，我们将探索\
    \ NoSQL 数据库及其在 C# 应用程序中的应用。NoSQL 数据库是一种数据库管理系统，提供了一种灵活且无模式（schema-less）的数据存储和检索方式。与使用结构化表的传统关系型数据库不同，NoSQL\
    \ 数据库以 JSON、BSON、XML 或键值对等格式存储数据。NoSQL 数据库的一种流行类别是文档数据库。\n\n### 文档数据库\n\n文档数据库顾如以文档的形式存储数据。这些文档可以是\
    \ JSON 或 BSON 等格式，并且通常是层次级结构，允许嵌套数据结构。MongoDB 是一个著名的文档数据库，经常用于 C# 应用程序。\n\n####\
    \ 安装 MongoDB C# 驱动程序\n\n要在 C# 中操作 MongoDB，你需要安装 MongoDB C# 驱动程序。你可以使用 NuGet 包管理器运行以下命令：\n\
    \n```shell\nInstall-Package MongoDB.Driver\n```\n\n### 连接到 MongoDB\n\n这里有一个从 C#\
    \ 应用程序连接 MongoDB 数据库的示例示例：\n\n```csharp\nusing MongoDB.Driver;\n\nclass Program\n\
    {\n    static void Main()\n    {\n        // 将 'your_connection_string' 替换为你的\
    \ MongoDB 连接字符串\n        var client = new MongoClient(\"your_connection_string\"\
    );\n        // 访问特定数据库\n        var database = client.GetDatabase(\"your_database_name\"\
    );\n        // 访问数据库内的集合\n        var collection = database.GetCollection<BsonDocument>(\"\
    your_collection_name\");\n        // 现在你可以操作集合了\n        // ...\n    }\n}\n```\n\
    \n### 使用 MongoDB 进行 CRUD 操作\n\nMongoDB 支持基本的 CRUD（创建、读取、更新、删除）操作。以下是在 C# 中执行这些操作的简要概述：\n\
    \n- **插入文档：**\n  ```csharp\n  var document = new BsonDocument\n  {\n      { \"\
    name\", \"John Doe\" },\n      { \"age\", 30 }\n  };\n  collection.InsertOne(document);\n\
    \  ```\n- **查询文档：**\n  ```csharp\n  var filter = Builders<BsonDocument>.Filter.Eq(\"\
    name\", \"John Doe\");\n  var result = collection.Find(filter).ToList();\n  ```\n\
    - **更新文档：**\n  ```csharp\n  var filter = Builders<BsonDocument>.Filter.Eq(\"name\"\
    , \"John Doe\");\n  var update = Builders<BsonDocument>.Update.Set(\"age\", 31);\n\
    \  collection.UpdateOne(filter, update);\n  ```\n- **删除文档：**\n  ```csharp\n  var\
    \ filter = Builders<BsonDocument>.Filter.Eq(\"name\", \"John Doe\");\n  collection.DeleteOne(filter);\n\
    \  ```\n\n### NoSQL 数据库的优缺点\n\n像 MongoDB 这样的文档数据库具有许多优势，例如活性、可扩展性和对嵌套数据结构的支持。它们对于需要存储非结构化或半结构化数据的应用程序是很好的选择。然而，文档数据库可能并不适用于所有场景。它们缺乏对关系数据库中常见的连接（joins）和事务的支持。总之，NoSQL\
    \ 数据库是 C# 开发者工具箱中的价值补充，提供了一种灵活且可扩展的数据存储和查询方式。但是，在选择数据库类型之前，评估你的项目需求和要求至关重要。\n\n\
    # 第 14 章：使用 ASP.NET Core 构建 Web 应用\n\n## 第 14.1 节：创建 ASP.NET Core Web 应用\n\nASP.NET\
    \ Core 是微软开发的一种流行的开源 Web 框架，用于构建 Web 应用。它是一个跨平台框架，允许你构建可以在 Windows、Linux 和 macOS\
    \ 上运行的 Web 应用在本节中，我们将探索如何使用 C# 创建 ASP.NET Core Web 应用。\n\n### 前提条件\n\n在开始之前，请确保你拥有：\n\
    \n1. Visual Studio：你可以从官方网站下载并安装。\n2. .NET SDK：安装 .NET SDK，它包含了 ASP.NET Core 开发所需的工具和库。\n\
    \n### 创建 ASP.NET Core 项目\n\n让我们通过创建一个新的 ASP.NET Core 项目开始。遵循以下步骤：\n\n1. 打开 Visual\
    \ Studio。\n2. 点击`文件`(File) -> `新建`(New) -> `项目...`(Project...)。\n3. 在“创建项目”对话框中搜索“ASP.NET\
    \ Core Web ”并选择它。\n4. 点击“下一步”（Next）。\n5. 选择项目名称、位置，然后点击“创建”（Create）。\n6. 在“新的\
    \ ASP.NET Core 应用程序”对话框中，选择适合项目的模板。你可以从“Web ”（Web Application）、“API”等模板中选择。在本示例中，我们将选择“Web\
    \ ”模板。\n7. 如果需要配置其他设置。\n8. 点击“创建”（Create）。\n\n### 理解项目结构\n\nASP.NET Core Web 应用由几个文件夹和文件组成。以下是重要部分的简要概述：\n\
    \n- `wwwroot`：包含直接提供给客户端的静态文件，如 CSS、JavaScript。\n- `Controllers`：处理请求并定义应用程序的行为。\n\
    - `Views`：包含渲染用户界面的 HTML 模板。\n- `Startup.cs`：包含应用程序的配置和中间件设置。\n- `appsettings.json`：应用程序的配置。\n\
    \n### 创建基础页面\n\n让我们创建一个基础 Web 页面和控制器来显示“Hello, ASP.NET Core!”\n\n1. 在 `Controllers`\
    \ 文件夹中创建一个名为 `HomeController.cs` 的控制器。添加以下代码：\n\n```csharp\nusing Microsoft.AspNetCore.Mvc;\n\
    \npublic class HomeController : Controller\n{\n    public IActionResult Index()\n\
    \    {\n        return View();\n    }\n}\n```\n\n2. 在 `Views` 文件夹中创建一个名为 `Home`\
    \ 的文件夹，并在其中创建一个名为 `Index.cshtml` 的视图文件。添加以下 HTML 代码：\n\n```html\n<!DOCTYPE html>\n\
    <html>\n<head>\n<title>My ASP.NET Core App</title>\n</head>\n<body>\n<h1>Hello,\
    \ ASP.NET Core!</h1>\n</body>\n</html>\n```\n\n3. 生成并运行你的应用程序。你应该会在浏览器中看到“Hello,\
    \ ASP.NET Core!”。\n\n恭喜！你创建了一个基础的 ASP.NET Core Web 应用。在接下来的章节中，我们将深入研究 ASP.NET\
    \ Core 的功能并探索如何构建更复杂的应用程序。\n\n## 第 14.2 节：ASP.NET Core 中的路由和中间件\n\n在 ASP.NET Core\
    \ 中，路由和中间件在处理 HTTP 请求和塑造应用程序行为方面起着至关重要的作用。在本节中，我们将探索 ASP.NET Core 中的路由和中间件概念。\n\
    \n### ASP.NET Core 中的路由\n\n路由是确定哪个控制器和方法应该处理传入请求的过程。ASP.NET Core 提供了一个强大的路由系统，允许你定义\
    \ URL 模式并将其映射到特定的控制器和操作。\n\n以下是路由在 ASP.NET Core 中的工作方式：\n\n1. **路由模板**：使用属性在控制器中定义。例如，`[Route(\"\
    products/{id}\")]` 会匹配类似 `/products/23`。\n2. **路由约束**：你可以对路由参数应用约束以限制它们接受的值。例如，指定\
    \ `id` 参数必须是整数。\n3. **路由参数**：路由模板中的占位符捕捉 URL 值。这些值作为参数传递给方法。\n4. **路由名称**：路由可以命名，允许你生成硬编码\
    \ URL。\n\n这是一个在控制器中定义路由的示例：\n\n```csharp\n[Route(\"products/{id:int}\")]\npublic\
    \ IActionResult ProductDetails(int id)\n{\n    // 处理请求\n}\n```\n\n### ASP.NET\
    \ Core 中的中间件\n\n中间件是参与处理 HTTP 请求的软件组件。它们按照添加到管道的顺序执行。以下是管道的简化视图：\n\n1. **HTTP\
    \ 请求**：HTTP 请求进入管道。\n2. **中间件**：管道中的中间件执行各种任务，如身份验证。\n3. **路由**：路由决定由哪个控制器和方法来调用。\n\
    4. **中间件（再次）**：在操作执行后进行处理。\n5. **HTTP 响应**：HTTP 响应生成并发送回客户端。\n\n你可以在 `Startup.cs`\
    \ 文件的管道中添加中间件。例如：\n\n```csharp\npublic void Configure(ApplicationBuilder app,\
    \ IWebHostEnvironment env)\n{\n    // 其他中间件\n    app.UseAuthentication(); // 添加身份验证\n\
    }\n```\n\n### 整合一切\n\n路由和中间件共同工作处理 HTTP 请求。路由系统根据 URL 决定哪个控制器和方法，这对于构建健壮的应用程序至关重要。\n\
    \n## 第 14.3 节：Razor Pages 和 MVC\n\n在 ASP.NET Core 中，Razor Pages 和模型视图控制器（MVC）模式是构建应用程序的两种基本方法。在本节中，我们将深入这些方法并探索何时使用它们。\n\
    \n### Razor Pages\n\nRazor Pages 是一种关注简单性和生产力的 Web 应用框架。对于结构简单的中小型应用程序，它是理想的选择。\n\
    \nRazor Pages 的关键特性是：\n\n1. **面向页面**：Razor Pages 围绕单个页面组织，每个页面由一个 `.cshtml` 文件表示。每个\
    \ Razor 页面都可以包含视图（HTML 标记）和后端代码（C# 代码）。\n2. **约定优于配置**：Razor Pages 遵循基于约定的方法。默认情况下，名为\
    \ `Index` 的 Razor 页面对应文件夹的根 URL。这简化了路由。\n3. **模型绑定**：Razor Pages 内置支持模型绑定，便于处理表单数据和\
    \ URL 参数。页面模型负责处理输入并响应请求。\n4. **部分页面**：可以创建名为“部分页面”的可重用部分并包含在多个 Razor 页面中，提高代码复用性。\n\
    \n这是一个 Razor 页的基础示例：\n\n```html\n<!-- Pages/Index.cshtml -->\n@page\n@model IndexModel\n\
    <h1>Welcome to My Website</h1>\n<p>Hello, @Model.UserName!</p>\n```\n\n```csharp\n\
    // Pages/Index.cs (后端)\npublic class IndexModel : PageModel\n{\n    public string\
    \ UserName { get; set; }\n    public void OnGet()\n    {\n        UserName = \"\
    John\";\n    }\n}\n```\n\n### 模型视图控制器 (MVC)\n\nMVC 是一种广泛采用的 Web 应用架构模式。它提供了适用于大型复杂应用程序的结构化方法。\n\
    \nMVC 的关键组件有：\n\n1. **模型 (Model)**：代表应用程序的数据和业务逻辑。模型负责检索和存储数据。\n2. **视图 (View)**：表示表示层负责渲染用户界面。视图接收模型的数据并显示给用户。\n\
    3. **控制器 (Controller)**：作为模型和视图之间的中间人。控制器处理传入请求，与模型交互获取数据，并将数据传递给视图进行渲染。\n\nMVC\
    \ 提供了关注点分离，应用程序更容易维护和扩展。当你需要对路由进行精确控制以及更模块化的代码结构时，这是一个很好的选择。\n\n这是一个 MVC 的简单示例：\n\
    \n```csharp\n// 控制器\npublic class HomeController : Controller\n{\n    public IActionResult\
    \ Index()\n    {\n        var userName = \"Jane\";\n        return View(\"Index\"\
    , userName);\n    }\n}\n```\n\n```html\n<!-- Views/Home/Index.cshtml -->\n@model\
    \ string\n<h1>Welcome to My Website</h1>\n<p>Hello, @Model!</p>\n```\n\n### 在\
    \ Razor Pages 和 MVC 之间选择\n\n在 Razor Pages 和 MVC 之间选择取决于应用程序的复杂性和要求。以下是一些指南：\n\n\
    - 使用 Razor Pages 用于中小型应用程序、原型，或简单易性和快速开发至关重要的场景。\n- 选择 MVC 用于具有更复杂需求的大型应用程序，这些需要清晰的关注点分离、路由灵活性以及对组件的细粒度控制。\n\
    \nRazor Pages 和 MVC 都是 ASP.NET Core 中的一等公民，如果符合需求，你甚至可以在单个应用程序中结合它们。最终，选择应符合你项目的特定目标和约束。\n\
    \n## 第 14.4 节：身份验证和授权\n\n身份验证和授权是 Web 应用安全的关键方面。在本节中，我们将探索这两个概念，以及它们如何在 ASP.NET\
    \ Core 中实现。\n\n### 身份验证\n\n身份验证是验证用户或系统身份的过程。它回答“你是谁？”用户通常提供凭据（如用户名和密码）来证明身份。ASP.NET\
    \ Core 提供了强大的身份验证机制：\n\n1. **基于 Cookie 的身份验证**：这种方法使用加密 Cookie 来跟踪用户。一旦登录，发放 Cookie。\n\
    2. **基于 Token 的身份验证**：通常用于 Web API，登录成功后颁发 JSON Web Token (JWT)。\n3. **外部身份验证**：ASP.NET\
    \ Core 支持 Google、Facebook 和 Microsoft 等提供程序。\n\n以下是在 `Startup.cs` 中设置基于 Cookie\
    \ 的身份验证的简单示例：\n\n```csharp\npublic void ConfigureServices(IServiceCollection services)\n\
    {\n    // 其他服务\n    services.AddAuthentication(AuthenticationDefaults.AuthenticationScheme)\n\
    \        .AddCookie(options =>\n        {\n            options.LoginPath = \"\
    /Account/Login\";\n            options.AccessDeniedPath = \"/Account/Denied\"\
    ;\n        });\n}\n```\n\n```csharp\n// AccountController.cs\n[Anonymous]\npublic\
    \ IActionResult Login()\n{\n    // 逻辑\n    return View();\n}\n\n[HttpPost]\npublic\
    \ async Task<IActionResult> Login(LoginViewModel model)\n{\n    // 身份验证\n    return\
    \ RedirectToAction(\"Index\");\n}\n```\n\n### 授权\n\n授权另一方面确定已验证用户可以做什么。它回答“你被允许做什么？”ASP.NET\
    \ Core 提供了灵活机制：\n\n1. **基于角色的授权**：用户被分配角色，并使用 `[Authorize(Roles = \"Admin\")]`\
    \ 进行装饰。\n2. **基于策略的授权**：通过定义策略来实现细粒度控制。策略可以使用声明或自定义标准。\n\n这是一个基于角色的授权示例：\n\n```csharp\n\
    // MyController.cs\n[Authorize(Roles = \"Admin\")]\npublic class MyController\
    \ : Controller\n{\n    // 仅管理员可访问\n}\n```\n\n### 结合身份验证和授权\n\n身份验证和授权通常结合使用。一旦用户通过身份验证，授权规则决定他们可以访问哪些部分。ASP.NET\
    \ Core 的灵活中间件允许你轻松集成这些过程。总之，身份验证验证用户的身份，而授权定义操作或资源。\n\n## 第 14.5 节：使用 SignalR\
    \ 构建实时应用\n\n在现代 Web 应用中，客户端和服务器之间的实时通信变得越来越重要。ASP.NET Core 提供了 SignalR，它简化了实时功能的实现。\n\
    \n### 什么是 SignalR?\n\nSignalR 是一个适用于 .NET Core 的开源库，允许客户端和服务器之间的双向通信。它抽象了底层传输机制（WebSockets、服务器\
    \ Sent 事件、长轮询等）以提供一致的 API。\n\nSignalR 的关键特性：\n\n1. **实时通信**：SignalR 允许服务器到客户端和客户端到服务器的实时通信。\n\
    2. **跨平台支持**：SignalR 适用于各种平台，包括 浏览器、移动设备和桌面应用程序，使其构建跨平台解决方案非常方便。\n3. **传输协议**：支持多种传输协议，回退到最合适的一种。\n\
    4. **基于 Hub 模型**：SignalR 使用基于 Hub 的模型，通过 Hub 发送和接收消息。\n5. **身份验证和授权**：SignalR\
    \ 无缝集成 ASP.NET Core 的身份验证和授权系统。\n\n### 开始 SignalR\n\n要在 ASP.NET Core 中开始 SignalR，你需要遵循这些步骤：\n\
    \n1. **安装包**：使用 NuGet 包管理器添加 SignalR 包。\n2. **创建 Hub**：创建一个定义客户端可以调用的方法的 Hub。\n\
    3. **配置 SignalR**：在 `Startup.cs` 文件中，通过将其添加到中间件来配置 SignalR。\n\n以下是设置 Hub 和客户端的简单示例：\n\
    \n```csharp\n// Server-Side (Hub)\nusing Microsoft.AspNetCore.SignalR;\n\npublic\
    \ class ChatHub : Hub\n{\n    public async Task SendMessage(string user, string\
    \ message)\n    {\n        await Clients.All.SendAsync(\"ReceiveMessage\", user,\
    \ message);\n    }\n}\n```\n\n```javascript\n// Client-Side (JavaScript)\nconst\
    \ connection = new signalR.HubConnectionBuilder()\n    .withUrl(\"/chatHub\")\n\
    \    .build();\n\nconnection.on(\"ReceiveMessage\", (user, message) => {\n   \
    \ // 处理接收的消息\n});\n\nconnection.start().then(() => {\n    // 连接已建立\n}).catch(err\
    \ => {\n    console.error(err);\n});\n\n// 发送消息\nconnection.invoke(\"SendMessage\"\
    , \"User\", \"Hello!\");\n```\n\n# 第 15 章：高级 Web 开发\n\n## 第 15.1 节：依赖注入\n\n依赖注入是现代开发中的基本概念。在\
    \ ASP.NET Core 中，依赖注入被构建在框架中，允许你以清洁的方式管理依赖。\n\n### 什么是依赖注入?\n\n依赖注入是一种设计模式，帮助你提供依赖（对象或服务），而不是让类自己创建它们。\n\
    \n### 设置依赖注入\n\n要在 ASP.NET Core 中使用依赖注入，首先在 `Startup.cs` 的 `ConfigureServices`\
    \ 方法中注册你的服务。\n\n```csharp\npublic void ConfigureServices(IServiceCollection services)\n\
    {\n    services.AddScoped<IMyService, MyService>();\n}\n```\n\n在此示例中，`IMyService`\
    \ 是一个接口，`MyService` 是具体实现。`AddScoped` 指定每个 HTTP 请求创建一个新实例。\n\n### 将依赖注入到控制器\n\n\
    一旦注册了服务，你就可以将其注入控制器或其他组件中。\n\n```csharp\npublic class MyController : Controller\n\
    {\n    private readonly IMyService _myService;\n\n    public MyController(IMyService\
    \ myService)\n    {\n        _myService = myService;\n    }\n}\n```\n\n### 依赖注入的好处\n\
    \nASP.NET Core 中的依赖注入具有许多优势：\n\n- **可测试性**：通过注入依赖，可以在单元测试期间将真实实现替换为模拟对象。\n- **可维护性**：服务实现的更改是隔离的。\n\
    - **灵活性**：你可以在不更改代码的情况下切换实现或配置。\n- **可扩展性**：管理服务的生命周期（例如临时、范围或单例）是简单的。\n\n## 第\
    \ 15.2 节：使用 ASP.NET Core 构建 RESTful API\n\n构建 RESTful API（表述状态传输）是现代 Web 应用的常见。REST\
    \ 是一种设计网络应用程序的架构风格，ASP.NET Core 为创建 RESTful API 提供了良好的支持。\n\n### 什么是 RESTful API?\n\
    \nRESTful API 是遵循 REST 原则的应用接口。这些原则包括使用标准 HTTP 方法（`GET`、`POST`、`PUT`、`DELETE`）对资源进行操作，将资源表示为\
    \ URI 以及使用标准 HTTP 状态码指示 API 请求的结果。\n\n### 创建 ASP.NET Core Web API\n\n要使用 ASP.NET\
    \ Core 创建 RESTful API，你可以从空项目开始，或者使用如“ASP.NET Core Web API”之类的模板。以下是高级步骤：\n\n\
    1. **创建新项目**：使用你喜欢的开发环境创建一个新的 ASP.NET Core Web API 项目。\n2. **定义数据模型**：定义 API 将使用的数据模型（实体）。\n\
    3. **创建控制器**：创建定义 API 端点和操作的控制器。\n4. **实现 CRUD 操作**：实现创建、读取、更新和删除功能。\n\n### API\
    \ 控制器示例\n\n```csharp\n[ApiController]\n[Route(\"api/[controller]\")]\npublic class\
    \ ProductsController : ControllerBase\n{\n    [HttpGet]\n    public IEnumerable<Product>\
    \ GetProducts()\n    {\n        // 返回产品\n    }\n\n    [HttpPost]\n    public IActionResult\
    \ PostProduct(Product product)\n    {\n        // 添加新产品\n        return Ok();\n\
    \    }\n}\n```\n\n## 第 15.3 节：微服务架构\n\n微服务架构是一种已流行的软件设计模式。它是一种应用程序由多个小型独立服务组成的架构风格。\n\
    \n### 微服务的关键概念\n\n- **分解**：一个单体应用被分解为一组松耦合的集合。\n- **独立性**：微服务可以独立地开发和部署。\n###\
    \ **通信**：微服务之间通过定义的 API 进行通信。\n- **可扩展性**：微服务可以根据需要进行扩展。\n- **技术多样性**：不同的微服务可以使用不同的技术和语言。\n\
    \n### 微服务的优势\n\n- **可扩展性**：微服务允许你根据需求扩展单个组件。\n- **快速开发**：较小的团队可以独立地开发服务。\n- **故障隔离**：一个服务中的问题不太可能影响整个应用程序。\n\
    \n### 微服务的挑战\n\n虽然微服务提供了许多优势，但也引入了挑战：\n\n- **复杂性**：管理大量的服务会变得复杂。\n- **数据管理**：处理服务之间一致性是挑战性的。\n\
    - **部署**：协调多个服务的部署是困难的。\n\n## 第 15.4 节：使用 Docker 进行容器化\n\nDocker 是容器化的强大工具，它改变了应用程序开发、部署和运行的方式。\n\
    \n### 理解 Docker\n\n- **镜像**：Docker 使用镜像作为创建容器的模板。镜像是一个快照。\n- **容器**：镜像的实例。\n-\
    \ **Dockerfile**：包含构建镜像说明的文本文件。\n- **Docker Hub**：托管镜像的云注册表。\n\n### Docker 的好处\n\
    \n- **一致性**：容器在不同的环境中运行。\n- **隔离性**：容器彼此相互隔离。\n- **可移植性**：可以在任何支持的系统中运行。\n- **资源效率**：与虚拟机相比，容器轻量级。\n\
    \n### Docker 实践\n\n要有效使用 Docker，请遵循以下步骤：\n\n1. **编写 Dockerfile**：定义环境。\n2. **构建镜像**：使用\
    \ `docker build` 命令。\n3. **运行容器**：使用 `docker run` 命令启动容器。\n4. **编排**：使用 Kubernetes\
    \ 等工具管理多个容器。\n\n## 第 15.5 节：将 Web 应用部署到云端\n\n云计算改变了应用程序的开发、部署和管理。它提供了一种可扩展且成本效益的解决方案。\n\
    \n### 云服务模型\n\n- **基础设施即服务 (IaaS)**：租用虚拟化资源如虚拟机。\n- **平台即服务 (PaaS)**：允许你专注于开发。\n\
    - **无服务器计算 (Serverless)**：完全抽象了服务器，代码执行。\n\n### 热门云提供商\n\n- **Amazon Web Services\
    \ (AWS)**：最大的提供者。\n- **Microsoft Azure**：提供全套服务。\n- **Google Cloud Platform (GCP)**：提供广泛的云服务。\n\
    \n### 部署策略\n\n- **CI/CD（持续集成/持续部署）**：自动化构建、测试和部署。\n- **负载均衡**：在多个实例之间分配流量。\n\n\
    # 第 16 章：C# 中的安全\n\n## 第 16.1 节：身份验证与授权\n\n身份验证和授权是 Web 应用安全的关键方面。在本节中，我们将探索这两个概念。\n\
    \n### 身份验证 vs 授权\n\n- **身份验证**：验证用户的身份（回答“你是谁？”）。\n- **授权**：确定已验证用户可以做什么（回答“你被允许做什么？”）。\n\
    \n### 身份验证技术\n\n- **用户名和密码**：常见的方法。\n- **多因素身份验证 (MFA)**：需要两个或更多形式。\n- **基于令牌的身份验证**：使用\
    \ JSON Web Tokens (JWT)。\n\n### 授权技术\n\n- **基于角色的访问控制 (RBAC)**：将用户分配给角色。\n- **基于属性的访问控制\
    \ (ABAC)**：根据属性决策。\n- **基于声明的访问控制 (Claims-Based)**：使用声明。\n\n## 第 16.2 节：保护 Web\
    \ 应用\n\n保护 Web 应用至关重要，以保护数据和用户。\n\n### 常见漏洞\n\n在 ASP.NET Core 中的依赖注入具有许多益处：\n\n\
    - **SQL 注入**：通过注入依赖，可以在单元测试期间将真实实现替换为模拟对象。\n- **跨站脚本攻击 (XSS)**：通过注入依赖，可以在单元测试期间将真实实现替换为模拟对象。\n\
    - **跨站请求伪造 (CSRF)**：通过注入依赖，可以在单元测试期间将真实实现替换为模拟对象。\n*(注：此处原文内容似乎存在逻辑重复，已按字面翻译)*\n\
    \n### 安全编码实践\n\n安全编码对于构建弹性的应用至关重要。\n\n1. **验证所有输入**。\n2. **输出编码**：通过编码防止 XSS。\n\
    3. **身份验证和授权**：使用强机制。\n4. **密码存储**：使用盐和哈希密码。\n\n# 第 17 章：软件测试\n\n## 第 17.1 节：软件测试类型\n\
    \n软件测试对于确保质量和可靠性至关重要。\n\n1. **单元测试**：隔离地测试单个组件。\n2. **集成测试**：测试模块如何协同工作。\n3. **功能测试**：检查软件是否符合需求。\n\
    4. **回归测试**：确保更改没有破坏现有功能。\n5. **性能测试**：在负载下评估速度。\n6. **安全测试**：识别漏洞。\n7. **用户验收测试\
    \ (UAT)**：由最终用户测试。\n8. **可用性测试**：评估应用是否易用。\n9. **兼容性测试**：跨设备/操作系统测试。\n10. **本地化/国际化**：针对语言/文化测试。\n\
    11. **探索性测试**：无脚本的测试。\n12. **临时测试**：没有计划的非正式测试。\n13. **Alpha 和 Beta 测试**：内部与外部用户测试。\n\
    \n## 第 17.2 节：编写单元测试\n\n单元测试涉及测试代码的单元。\n\n- **框架**：NUnit, xUnit, MSTest。\n- **过程**：准备（Arrange）、执行（Act）、断言（Assert）。\n\
    \n## 第 17.3 节：使用 NUnit 和 xUnit 进行测试自动化\n\n自动化测试节省时间并确保一致性。\n\n- **NUnit**：使用 `[Test]`、`[TestCase]`。\n\
    - **xUnit**：使用 `[Fact]`、`[Theory]`。\n\n## 第 17.4 节：持续集成和持续交付 (CI/CD)\n\nCI/CD\
    \ 自动化开发生命周期。\n\n- **CI**：代码的频繁合并和测试。\n- **CD**：自动部署到环境。\n- **工具**：Azure DevOps,\
    \ Jenkins, TeamCity, GitLab CI/CD。\n\n## 第 17.5 节：性能测试和分析\n\n性能确保效率。\n\n- **负载测试**：在预期负载下。\n\
    - **压力测试**：推送极限。\n- **可扩展性测试**：处理增长。\n- **分析**：分析执行情况（CPU, 内存）。\n\n"
