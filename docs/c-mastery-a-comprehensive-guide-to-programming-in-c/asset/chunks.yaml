    #### The else if Statement


    You can use the else if statement to check additional conditions if the previous
    if condition is false:


    int score = 85;


    if (score >= 90)


    {


    Console.WriteLine("Excellent!");


    }


    else if (score >= 70)


    {


    Console.WriteLine("Good!");


    }


    else


    {


    Console.WriteLine("Needs improvement.");


    }


    In this code, the program checks multiple conditions and prints different messages
    based on the score.


    #### The switch Statement


    The switch statement allows you to perform different actions based on the value
    of an expression:


    int day = 3;


    string dayName;


    switch (day)


    {


    case 1:


    dayName = "Monday";


    break;


    case 2:


    dayName = "Tuesday";


    break;


    case 3:


    dayName = "Wednesday";


    break;


    default:


    dayName = "Unknown";


    break;


    }


    Console.WriteLine($"Today is {dayName}");


    Here, the switch statement assigns a day name based on the value of day. In this
    case, “Wednesday” will be assigned to dayName.


    ### Loops (for, while, do-while, and foreach)


    Loops are used to repeat a block of code multiple times. C# provides several loop
    constructs to cater to different scenarios.


    #### The for Loop


    The for loop allows you to execute a block of code a specific number of times.
    It consists of an initialization, a condition, and an iteration expression:


    for (int i = 1; i <= 5; i++)


    {


    Console.WriteLine($"Iteration {i}");


    }


    This for loop prints “Iteration 1” to “Iteration 5” to the console.


    #### The while Loop


    The while loop repeatedly executes a block of code as long as a specified condition
    is true:


    int count = 0;


    while (count < 5)


    {


    Console.WriteLine($"Count: {count}");


    count++;


    }


    This while loop prints “Count: 0” to “Count: 4” to the console.


    #### The do-while Loop


    The do-while loop is similar to the while loop, but it guarantees that the code
    block is executed at least once, even if the condition is initially false:


    int n = 5;


    do


    {


    Console.WriteLine($"Iteration {n}");


    n++;


    } while (n < 5);


    In this example, the code block is executed once before checking the condition,
    so “Iteration 5” is printed.


    #### The foreach Loop


    The foreach loop is used for iterating over collections like arrays or lists.
    It simplifies the process of iterating through elements:


    int[] numbers = { 1, 2, 3, 4, 5 };


    foreach (int num in numbers)


    {


    Console.WriteLine($"Number: {num}");


    }


    This foreach loop iterates through the numbers array and prints each number to
    the console.


    Control flow and decision-making are vital for building dynamic and interactive
    C# programs. By using conditional statements and loops effectively, you can create
    programs that respond to different situations and perform repetitive tasks. In
    the following sections, we’ll delve deeper into more advanced C# concepts, allowing
    you to build even more sophisticated applications.


    ## Section 2.5: Debugging and Error Handling


    Debugging and error handling are critical aspects of software development. In
    this section, we’ll explore techniques for identifying and fixing issues in your
    C# code and handling errors gracefully.


    ### Debugging Your Code


    Debugging is the process of finding and fixing errors (bugs) in your code. C#
    development environments like Visual Studio offer powerful debugging tools to
    assist you in this process.


    #### Setting Breakpoints


    One of the most common debugging techniques is setting breakpoints in your code.
    A breakpoint is a point where the program execution temporarily stops, allowing
    you to inspect variables, step through code, and identify issues.


    To set a breakpoint in Visual Studio, click in the margin next to the line of
    code where you want to pause execution. A red dot will appear, indicating the
    breakpoint. When you run your program in debug mode, it will stop at the breakpoint.


    #### Stepping Through Code


    Once your program is paused at a breakpoint, you can step through your code one
    line at a time. Visual Studio provides options like “Step Into” (F11) to go into
    method calls, “Step Over” (F10) to execute the current line without diving into
    method calls, and “Step Out” (Shift+F11) to return from a method call.


    These options help you navigate your code and understand how it executes, making
    it easier to spot errors.


    #### Inspecting Variables


    While debugging, you can inspect the values of variables and expressions. In Visual
    Studio, you can hover over a variable to see its current value or use the “Watch”
    window to monitor specific variables during debugging.


    #### Debugging Tools


    Visual Studio offers various debugging tools, such as the Immediate window for
    executing code during debugging, the Call Stack for tracing function calls, and
    the Locals window for viewing local variables.


    ### Error Handling


    In addition to debugging, it’s essential to handle errors gracefully in your C#
    code. Errors can occur due to various reasons, such as invalid user input, file
    not found, or network issues. Handling errors ensures that your program doesn’t
    crash and provides helpful feedback to users.


    #### Exception Handling


    C# uses exception handling to deal with runtime errors. You can use try, catch,
    finally, and throw blocks to manage exceptions.


    try


    {


    // Code that may throw an exception


    int result = 10 / int.Parse("0");


    }


    catch (DivideByZeroException)


    {


    Console.WriteLine("Division by zero error.");


    }


    catch (FormatException)


    {


    Console.WriteLine("Invalid input format.");


    }


    finally


    {


    Console.WriteLine("Cleanup code executed.");


    }


    In this example, if an exception occurs during the division operation or parsing,
    the appropriate catch block is executed, and then the finally block ensures that
    cleanup code is run, regardless of whether an exception occurred or not.


    #### Custom Exceptions


    You can create custom exception classes by deriving from the Exception class to
    handle specific application-specific errors. Custom exceptions should provide
    meaningful information about the error and how to resolve it.


    ### Logging


    Logging is another crucial aspect of error handling. You can use logging libraries
    like Serilog or NLog to record information about errors and events in your application.
    Logging helps you diagnose issues in production environments and monitor application
    health.


    using Serilog;


    Log.Logger = new LoggerConfiguration()


    .WriteTo.Console()


    .WriteTo.File("log.txt")


    .CreateLogger();


    try


    {


    // Code that may throw an exception


    }


    catch (Exception ex)


    {


    Log.Error(ex, "An error occurred.");


    }


    finally


    {


    Log.CloseAndFlush();


    }


    This example demonstrates using Serilog to log errors and messages to both the
    console and a log file.


    ### Testing


    Testing is an essential part of error prevention. Writing unit tests using frameworks
    like NUnit or xUnit helps identify issues early in the development process. Automated
    tests ensure that your code behaves as expected and catches regressions when making
    changes.


    By mastering debugging techniques and implementing robust error handling strategies,
    you can build more reliable and maintainable C# applications. These skills are
    essential as you progress in your C# development journey and work on larger and
    more complex projects.


