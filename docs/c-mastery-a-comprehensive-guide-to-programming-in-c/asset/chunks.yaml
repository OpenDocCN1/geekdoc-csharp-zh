    # Chapter 6: Cross-Platform Development with .NET Core


    ![image](d2d_images/chapter_title_below.png)


    ## Section 6.1: Understanding .NET Core and .NET 5+


    In this section, we’ll explore the world of cross-platform development using .NET
    Core and the subsequent versions like .NET 5 and beyond. .NET Core is a powerful
    framework that allows developers to build applications that can run on various
    platforms, including Windows, macOS, and Linux. It is designed for modern, cloud-native
    applications and provides several key features:


    ### 1. Cross-Platform Compatibility


    .NET Core is designed from the ground up to be cross-platform. This means you
    can write C# code and run it on Windows, macOS, or Linux without major modifications.
    This flexibility is essential for reaching a broad audience and deploying applications
    in different environments.


    ### 2. Improved Performance


    .NET Core offers better performance compared to its predecessor, the .NET Framework.
    It includes the CoreCLR, a modern runtime that optimizes performance, making it
    suitable for high-performance applications. You can leverage the speed and efficiency
    of .NET Core for various types of projects.


    ### 3. Support for Containerization


    Containerization is a popular technique for packaging applications and their dependencies
    into isolated containers. .NET Core supports containerization technologies like
    Docker, making it easy to create and deploy containerized applications. This is
    particularly useful in microservices and cloud-native architectures.


    ### 4. Side-by-Side Installation


    Unlike the .NET Framework, which could lead to version conflicts, .NET Core allows
    side-by-side installations of different versions. This means you can develop and
    run applications that target specific .NET Core versions without worrying about
    affecting other applications on the same system.


    ### 5. Open-Source and Community-Driven


    .NET Core is open-source and actively maintained by Microsoft. It also benefits
    from a vibrant community that contributes to its development. This openness allows
    developers to participate in shaping the framework’s future and contributes to
    its rapid evolution.


    ### 6. Migration Paths


    If you have existing .NET Framework applications, .NET Core provides migration
    paths to move them to the new platform. .NET 5 and later versions offer increased
    compatibility with existing libraries and APIs, easing the transition process.


    ### 7. Unified Platform


    Starting with .NET 5, Microsoft aimed to unify the .NET ecosystem, bringing together
    .NET Core, .NET Framework, and Xamarin into a single platform called .NET 5\.
    This unified platform simplifies development and reduces fragmentation.


    To get started with .NET Core, you’ll need to install the SDK and use tools like
    Visual Studio Code or Visual Studio for development. .NET Core supports various
    application types, including console applications, web applications, and cloud-native
    microservices.


    In the following sections of this chapter, we’ll delve deeper into specific aspects
    of cross-platform development with .NET Core, including building console applications,
    desktop applications, web development with ASP.NET Core, and mobile app development
    with Xamarin. Whether you’re targeting cloud-based services or creating applications
    for multiple platforms, .NET Core provides a robust foundation for your projects.


    ## Section 6.2: Building Cross-Platform Console Apps


    In this section, we’ll focus on building cross-platform console applications using
    .NET Core. Console applications are lightweight, text-based programs that run
    in a command-line interface (CLI). They are useful for a wide range of tasks,
    including automation, data processing, and system administration.


    ### Creating a New Console Application


    To create a new console application using .NET Core, follow these steps:


    1.  Install the .NET SDK: Ensure you have the .NET SDK installed on your system.
    You can download it from the official .NET website.


    2.  Create a New Project: Open your terminal or command prompt and navigate to
    the directory where you want to create the project. Use the following command
    to create a new console application:


    dotnet new console -n MyConsoleApp


    This command creates a new console application named “MyConsoleApp.”


    1.  Open the Project: Use a code editor of your choice, such as Visual Studio
    Code or Visual Studio, to open the project folder. You’ll find a file named Program.cs,
    which contains the entry point for your application.


    2.  Edit the Code: In the Program.cs file, you’ll see a Main method. This method
    is the starting point for your console application. You can write your application
    logic inside this method.


    ### Writing Your First Console App


    Let’s write a simple “Hello, World!” program to get started. Replace the contents
    of the Main method with the following code:


    using System;


    namespace MyConsoleApp


    {


    class Program


    {


    static void Main(string[] args)


    {


    Console.WriteLine("Hello, World!");


    }


    }


    }


    This code imports the System namespace and uses the Console.WriteLine method to
    print “Hello, World!” to the console.


    ### Building and Running the App


    To build and run your console application, follow these steps:


    1.  In the terminal, navigate to your project’s root directory.


    2.  Use the following command to build the application:


    dotnet build


    1.  Once the build is successful, run the application using:


    dotnet run


    You should see the output “Hello, World!” displayed in the console.


