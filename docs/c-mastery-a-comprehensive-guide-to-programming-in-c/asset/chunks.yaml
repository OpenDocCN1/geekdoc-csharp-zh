    }


    }


    ### Throwing Exceptions


    You can use the throw statement to throw an exception explicitly. This is useful
    when you want to signal an exceptional condition in your code.


    public int Divide(int dividend, int divisor)


    {


    if (divisor == 0)


    {


    throw new DivideByZeroException("Division by zero is not allowed.");


    }


    return dividend / divisor;


    }


    In this example, the Divide method throws a DivideByZeroException if the divisor
    is zero.


    ### Custom Exception Handling


    Handling exceptions in OOP allows you to create custom error-handling strategies.
    You can catch specific types of exceptions, log errors, and provide meaningful
    feedback to users. This helps in making your applications robust and user-friendly.


    try


