    •  System.Exception: The base class for all exceptions.


    •  System.SystemException: The base class for system-related exceptions.


    •  System.ApplicationException: The base class for exceptions generated by application
    code.


    You can also create custom exception classes by deriving from these base classes
    to handle specific errors in your application.


    public class CustomException : ApplicationException


    {


    public CustomException(string message) : base(message)


