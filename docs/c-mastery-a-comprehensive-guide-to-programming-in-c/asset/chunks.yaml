    \n```cs\ndynamic person = new ExpandoObject();\nperson.Name = \"John\";\nperson.Age\
    \ = 30;\nConsole.WriteLine($\"Name: {person.Name}, Age: {person.Age}\");\n```\n\
    \n你也可以向 `ExpandoObject` 添加方法：\n\n```cs\nperson.SayHello = new Action(() => Console.WriteLine(\"\
    Hello, I'm \" + person.Name));\nperson.SayHello(); // 调用动态添加的方法\n```\n\n这种灵活性使得\
    \ `ExpandoObject` 在处理可能没有固定模式的数据结构时成为一个非常有价值的工具。\n\n### 用例\n\n动态规划通常用于算法问题解决以优化递归解决方案，而\
    \ `ExpandoObject` 在处理松散结构数据时非常方便。当你需要在 C# 中处理动态数据时，这两种技术都提供了灵活性。\n\n在本节中，我们探讨了动态规划和\
