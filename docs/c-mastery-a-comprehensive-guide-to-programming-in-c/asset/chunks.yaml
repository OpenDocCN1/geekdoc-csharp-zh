    \n# 第 4 章：高级 OOP 概念\n\n![image](img/chapter_title_below.png)\n\n## 第 4.1 节：泛型与泛型集合\n\
    \n在本节中，我们将探索 C# 中一种高级的面向对象编程 (OOP) 概念：泛型 (Generics)。泛型允许你创建可以可以处理不同数据类型的类、方法和接口，同时提供类型安全。我们将关注泛型及其在创建泛型集合中的应用。\n\
    \n### 泛型简介\n\n泛型允许你编写能够处理多种数据类型的代码，同时保持编译时的类型安全。它们允许你定义带有占位符类型（类型参数）的类、方法或接口，这些类型是在在使用时指定的。这种灵活性在处理需要适应不同类型数据的集合、算法和数据结构时尤为有价值。\n\
    \n### 泛型类\n\n泛型类是能够处理不同数据类型的类。你在声明类时，通过指定包含在角括号 (`<>`) 中的一个或多个类型参数来定义泛型类。\n\n\
    ```csharp\npublic class GenericList<T>\n{\n    private T[] items;\n    public\
    \ GenericList(int size)\n    {\n        items = new T[size];\n    }\n    public\
    \ void Add(int index, T item)\n    {\n        items[index] = item;\n    }\n  \
    \  public T Get(int index)\n    {\n        return items[index];\n    }\n}\n```\n\
    \n在此示例中，`GenericList<T>` 是一个可以存储任何类型 `T` 元素的泛型类。`T` 类型参数是类实例时将使用的实际数据类型的占位符。\n\
    \n### 使用泛型类\n\n要使用泛型类，在创建类实例时指定实际的数据类型。这被称为提供类型参数。\n\n```csharp\nGenericList<int>\
    \ intList = new GenericList<int>(5);\nintList.Add(0, 42);\nint value = intList.Get(0);\
    \ // value 为 42\n\nGenericList<string> stringList = new GenericList<string>(3);\n\
    stringList.Add(0, \"Hello\");\nstring text = stringList.Get(0); // text 为 \"Hello\"\
    \n```\n\n在代码中，我们创建了两个 `GenericList` 实例，一个存储整数，另一个存储字符串。类型参数（`int` 和 `string`）指定了实际的数据类型。\n\
    \n### 泛型方法\n\n泛型也可以应用于方法。泛型方法可以处理不同的数据类型，你类似于定义泛型类的方式为方法定义类型参数。\n\n```csharp\n\
    public class Utilities\n{\n    public T Max<T>(T a, T b) where T : IComparable<T>\n\
    \    {\n        return a.CompareTo(b) > 0 ? a : b;\n    }\n}\n```\n\n在此示例中，`Max`\
    \ 方法是泛型的，它可以确定实现 `IComparable<T>` 接口的任何类型 `T` 的最大值。\n\n### 泛型约束\n\n你可以使用 `where`\
    \ 关键字对类型参数施加约束。约束指定类型实现某些接口、派自特定类或具有默认构造函数。\n\n```csharp\npublic class ExampleClass<T>\
    \ where T : IComparable<T>\n{\n    // ...\n}\n```\n\n在此代码中，`T` 必须实现 `IComparable<T>`\
    \ 接口。\n\n### 泛型集合\n\nC# 在 `System.Collections.Generic` 命名空间提供了一系列泛型集合类，如 `List<T>`、`Dictionary<TKey,\
    \ TValue>` 和 `Queue<T>`。这些集合为各种数据类型提供了类型存储，并被广泛使用。\n\n```csharp\nList<int> numbers\
    \ = new List<int>();\nnumbers.Add(42);\nint firstNumber = numbers[0]; // firstNumber\
    \ 为 42\n\nDictionary<string, double> grades = new Dictionary<string, double>();\n\
    grades[\"Alice\"] = 95.5;\ndouble aliceGrade = grades[\"Alice\"]; // aliceGrade\
    \ 为 95.5\n```\n\n在此示例中，我们分别使用泛型 `List<T>` 和 `Dictionary<TKey, TValue>` 整数和键值对。\n\
    \n## 第 4.2 节：委托与事件\n\n委托和事件是 C# 中强大的机制，允许你将函数函数一等公民处理并实现事件驱动编程。在本节中，我们将探索这些概念及其应用。\n\
    \n### 委托\n\n委托是一种引用类型，可以表示特定参数列表和返回类型的方法的引用。委托允许你将方法视为一等公民，使得将方法作为参数传递给其他方法、存储在数据结构中并在运行时动态调用它们成为可能。\n\
    \n#### 定义委托\n\n定义委托你需要指定其签名，包括它可以引用的方法的返回类型和参数。\n\n```csharp\npublic delegate\
    \ void MyDelegate(int x, int y);\n```\n\n在此示例中，`MyDelegate` 委托类型可以引用具有两个 `int`\
    \ 参数且没有返回值 (`void`)的方法。\n\n#### 使用委托\n\n你可以创建委托实例并分配与其签名匹配的方法。然后，你可以调用委托来执行引用的方法。\n\
    \n```csharp\npublic void Add(int a, int b)\n{\n    Console.WriteLine($\"Sum: {a\
    \ + b}\");\n}\n\nMyDelegate addDelegate = Add;\naddDelegate(5, 7); // 调用 Add 方法\n\
    ```\n\n在代码中，`addDelegate` 引用了 `Add` 方法并可以调用以执行 Add。\n\n#### 多路委托\n\n委托还可以组合以创建引用多个方法的多路委托。当多路委托被调用时，它将按照添加的顺序调用所有引用的方法。\n\
    \n"
