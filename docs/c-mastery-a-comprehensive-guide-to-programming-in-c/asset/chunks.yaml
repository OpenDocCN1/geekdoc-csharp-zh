    #### Observer Pattern


    The Observer pattern defines a one-to-many dependency between objects so that
    when one object changes state, all its dependents are notified and updated automatically.


    using System;


    using System.Collections.Generic;


    public interface IObserver


    {


    void Update(string message);


    }


    public class ConcreteObserver : IObserver


    {


    private readonly string name;


    public ConcreteObserver(string name)


    {


    this.name = name;


    }


    public void Update(string message)


    {


    Console.WriteLine($"{name} received message: {message}");


    }


    }


    public class ConcreteSubject


    {


    private readonly List<IObserver> observers = new List<IObserver>();


    public void Attach(IObserver observer)


    {


    observers.Add(observer);


    }


    public void Notify(string message)


    {


    foreach (var observer in observers)


    {


    observer.Update(message);


    }


    }


    }


    In this example, ConcreteSubject maintains a list of observers and notifies them
    when its state changes.


    #### Strategy Pattern


    The Strategy pattern defines a family of algorithms, encapsulates each one, and
    makes them interchangeable. It allows the algorithm to vary independently from
    the clients that use it.


    public interface IStrategy


    {


    void Execute();


    }


    public class ConcreteStrategyA : IStrategy


    {


    public void Execute() => Console.WriteLine("Executing Strategy A");


    }


    public class ConcreteStrategyB : IStrategy


    {


    public void Execute() => Console.WriteLine("Executing Strategy B");


    }


    public class Context


    {


    private readonly IStrategy strategy;


    public Context(IStrategy strategy)


    {


    this.strategy = strategy;


    }


    public void ExecuteStrategy()


    {


    strategy.Execute();


    }


    }


    In this example, the Context class can be configured with different strategies,
    allowing it to execute different algorithms.


    Design patterns in C# provide solutions to common design problems, making your
    code more maintainable, scalable, and flexible. By understanding and applying
    these patterns, you can improve your software design and development skills.


    ## Section 4.5: Unit Testing and Test-Driven Development (TDD)


    Unit testing and Test-Driven Development (TDD) are essential practices in modern
    software development. They help ensure code correctness, maintainability, and
    robustness. In this section, we’ll delve into the concepts of unit testing and
    how TDD can be a valuable approach in C# development.


    ### Unit Testing


    #### What Is Unit Testing?


    Unit testing is the practice of testing individual units or components of a software
    application in isolation to ensure they work as expected. A unit can be a single
    method, function, or class. Unit tests are automated and run frequently during
    development to catch bugs early.


    #### Benefits of Unit Testing


    Unit testing offers several advantages:


    • Bug Detection: Unit tests help catch bugs and regressions early in the development
    process, reducing the cost of fixing issues later.


    • Documentation: Tests serve as documentation, providing examples of how to use
    a component.


    • Refactoring Safety: Unit tests give developers confidence to refactor code because
    they can quickly detect if any functionality breaks.


    • Improved Design: Writing tests often leads to more modular and loosely coupled
    code, improving software design.


    #### xUnit and NUnit


    C# has popular unit testing frameworks like xUnit and NUnit. These frameworks
    provide the infrastructure for writing and running unit tests.


    ##### xUnit Example


    public class Calculator


    {


    public int Add(int a, int b) => a + b;


    }


    public class CalculatorTests


    {


    [Fact]


    public void Add_ReturnsCorrectResult()


    {


    // Arrange


    var calculator = new Calculator();


    // Act


    int result = calculator.Add(3, 4);


    // Assert


    Assert.Equal(7, result);


    }


    }


    In this example, we use xUnit to write a test for the Add method of the Calculator
    class. The [Fact] attribute indicates a test, and Assert is used for assertions.


    ### Test-Driven Development (TDD)


    #### What Is TDD?


    TDD is a development approach where you write tests before writing the actual
    code. The TDD cycle typically consists of three steps: red, green, and refactor.


    1.  Red: Write a failing test for the functionality you want to implement.


    2.  Green: Write the minimum code necessary to make the test pass.


    3.  Refactor: Refactor the code while keeping the tests green.


    #### TDD Benefits


    TDD offers numerous advantages:


    • Clarity: Tests clarify requirements and expected behavior.


    • Safety Net: Tests serve as a safety net, ensuring that changes don’t break existing
    functionality.


    • Incremental Development: TDD encourages incremental development, leading to
    more manageable and less complex code.


    • Reduced Debugging: Debugging is reduced because issues are caught early by tests.


    #### TDD Example


    Let’s follow the TDD process to implement a simple StringCalculator class that
    can add numbers separated by commas.


    1.  Red: Write a failing test.


    [Fact]


    public void Add_EmptyString_ReturnsZero()


    {


    // Arrange


    var calculator = new StringCalculator();


    // Act


    int result = calculator.Add("");


    // Assert


    Assert.Equal(0, result);


    }


    1.  Green: Write the minimum code to make the test pass.


    public class StringCalculator


    {


    public int Add(string input)


    {


    return 0;


    }


    }


    1.  Refactor: Refactor the code if necessary.


    2.  Repeat the cycle for additional functionality.


    #### TDD Tips


    •  Start with simple tests and gradually add complexity.


    •  Write tests for edge cases and boundary conditions.


    •  Refactor code to improve its design and readability while ensuring tests remain
    green.


    Unit testing and TDD are integral to creating reliable and maintainable C# applications.
    By writing tests early in the development process and continuously verifying the
    correctness of your code, you can increase software quality and reduce the time
    and effort spent on debugging and maintenance.


