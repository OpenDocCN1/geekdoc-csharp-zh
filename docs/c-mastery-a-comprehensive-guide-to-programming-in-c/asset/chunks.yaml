    \ FileStream(filePath, FileMode.Open))\n        {\n            Person deserializedPerson\
    \ = (Person)formatter.Deserialize(fs);\n            Console.WriteLine($\"姓名: {deserializedPerson.Name},\
    \ 年龄: {deserializedPerson.Age}\");\n        }\n    }\n}\n```\n\n在这个示例中，我们定义了一个\
    \ `Person` 类并将其标记为 `[Serializable]`。然后我们将该类的实例序列化到二进制文件，随后通过反序列化来获取原始对象。（注意：BinaryFormatter\
    \ 在现代 .NET 版本中已弃用）。\n\n### XML 和 JSON 序列化 (XML and JSON Serialization)\n\n除了二进制序列化外，C#\
    \ 还支持 XML 和 JSON 序列化，这些通常用于应用程序或平台之间的数据交换。你可以分别使用 `System.Xml.Serialization` 中的\
    \ `XmlSerializer` 和 `System.Text.Json` 中的 `JsonSerializer`。\n\n以下是 JSON 序列化反序列化的示例：\n\
    \n```csharp\nusing System;\nusing System.IO;\nusing System.Text.Json;\n\npublic\
    \ class Person\n{\n    public string Name { get; set; }\n    public int Age {\
    \ get; set; }\n}\n\nclass Program\n{\n    static void Main()\n    {\n        string\
    \ filePath = \"person.json\";\n        Person person = new Person { Name = \"\
    Bob\", Age = 25 };\n\n        // JSON 序列化\n        string jsonString = JsonSerializer.Serialize(person);\n\
    \        File.WriteAllText(filePath, jsonString);\n        Console.WriteLine(\"\
    对象已序列化为 JSON.\");\n\n        // JSON 反序列化\n        string readJson = File.ReadAllText(filePath);\n\
    \        Person deserializedPerson = JsonSerializer.Deserialize<Person>(readJson);\n\
    \        Console.WriteLine($\"姓名: {deserializedPerson.Name}, 年龄: {deserializedPerson.Age}\"\
    );\n    }\n}\n```\n"
- fmt: "\nIn this XML serialization example, we use `XmlSerializer` to serialize and\
    \ deserialize a `Person` object to and from an `XML` file.\n\nJSON serialization\
    \ and deserialization can be achieved similarly using `JsonSerializer` from the\
    \ `System.Text.Json` namespace. These serialization formats are more human-readable\
    \ and widely used in web APIs and data interchange.\n\nSerialization and deserialization\
    \ are essential techniques in C# for saving and retrieving application data and\
    \ sharing data between different components and systems. Choosing the appropriate\
    \ serialization format depends on your specific use case and requirements.\n\n\
    ## Section 7.4: Handling XML and JSON Data\n\n`XML` (Extensible Markup Language)\
    \ and `JSON` (JavaScript Object Notation) are two widely used data interchange\
    \ formats. In C#, you can work with both `XML` and `JSON` data for various purposes,\
    \ such as configuration files, web service communication, and data storage. This\
    \ section explores how to handle `XML` and `JSON` data in C#.\n\n### Working with\
    \ XML Data\n\nC# provides libraries for parsing and manipulating `XML` data. The\
    \ `System.Xml` namespace includes classes like `XmlDocument`, `XmlReader`, and\
    \ `XmlWriter` for working with `XML` data.\n\nHere’s an example of reading and\
    \ writing `XML` data using `XmlDocument`:\n\n```csharp\nusing System;\nusing System.Xml;\n\
    \nclass Program\n{\n    static void Main()\n    {\n        // Creating an XML\
    \ document\n        XmlDocument xmlDoc = new XmlDocument();\n        xmlDoc.LoadXml(\"\
    <book><title>C# Programming</title><author>John Doe</author></book>\");\n\n  \
    \      // Reading XML data\n        XmlNode titleNode = xmlDoc.SelectSingleNode(\"\
    /book/title\");\n        string title = titleNode.InnerText;\n        XmlNode\
    \ authorNode = xmlDoc.SelectSingleNode(\"/book/author\");\n        string author\
    \ = authorNode.InnerText;\n        Console.WriteLine($\"Title: {title}\");\n \
    \       Console.WriteLine($\"Author: {author}\");\n\n        // Modifying XML\
    \ data\n        titleNode.InnerText = \"Advanced C# Programming\";\n\n       \
    \ // Saving the modified XML\n        xmlDoc.Save(\"book.xml\");\n        Console.WriteLine(\"\
    XML data saved.\");\n    }\n}\n```\n\nIn this example, we create an `XML` document,\
    \ read data from it, modify the data, and then save it back to a file.\n\n###\
    \ Working with JSON Data\n\nTo work with `JSON` data in C#, you can use the `System.Text.Json`\
    \ namespace. It provides classes like `JsonSerializer` for serialization and deserialization\
    \ of `JSON` data.\n\nHere’s an example of working with `JSON` data:\n\n```csharp\n\
    using System;\nusing System.Text.Json;\n\nclass Program\n{\n    public class Person\n\
    \    {\n        public string Name { get; set; }\n        public int Age { get;\
    \ set; }\n    }\n\n    static void Main()\n    {\n        // Serialization to\
    \ JSON\n        Person person = new Person { Name = \"Alice\", Age = 28 };\n \
    \       string json = JsonSerializer.Serialize(person);\n        Console.WriteLine($\"\
    JSON: {json}\");\n\n        // Deserialization from JSON\n        Person deserializedPerson\
    \ = JsonSerializer.Deserialize<Person>(json);\n        Console.WriteLine($\"Name:\
    \ {deserializedPerson.Name}, Age: {deserializedPerson.Age}\");\n    }\n}\n```\n\
    \nIn this `JSON` example, we define a `Person` class, serialize an instance of\
    \ it to `JSON`, and then deserialize it back to a C# object.\n\nBoth `XML` and\
    \ `JSON` are versatile formats for data exchange. Choose the one that best suits\
    \ your application’s requirements and integrates seamlessly with other systems\
    \ or services you may be interacting with. C# provides excellent support for both\
    \ formats, making it easy to work with `XML` and `JSON` data.\n\n## Section 7.5:\
    \ Database Connectivity and ADO.NET\n\nDatabase connectivity is a crucial aspect\
    \ of many software applications. C# provides the `ADO.NET` (ActiveX Data Objects\
    \ for .NET) framework for interacting with relational databases. `ADO.NET` allows\
    \ you to connect to databases, execute queries, and retrieve and manipulate data.\
    \ In this section, we will explore how to work with databases using `ADO.NET`\
    \ in C#.\n\n### Connecting to a Database\n\nTo connect to a database using `ADO.NET`,\
    \ you need to specify a connection string that contains information about the\
    \ database server, authentication credentials, and the database itself. Here’s\
    \ an example of connecting to a SQL Server database:\n\n```csharp\nusing System;\n\
    using System.Data.SqlClient;\n\nclass Program\n{\n    static void Main()\n   \
    \ {\n        string connectionString = \"Server=myServer;Database=myDatabase;User\
    \ Id=myUser;Password=myPassword;\";\n        using (SqlConnection connection =\
    \ new SqlConnection(connectionString))\n        {\n            connection.Open();\n\
    \            Console.WriteLine(\"Connected to the database.\");\n            //\
    \ Perform database operations here\n            connection.Close();\n        \
    \    Console.WriteLine(\"Connection closed.\");\n        }\n    }\n}\n```\n\n\
    In this example, we create a `SqlConnection` object and open the connection using\
    \ the specified `connectionString`. You should replace `myServer`, `myDatabase`,\
    \ `myUser`, and `myPassword` with the actual database server information and credentials.\n\
    \n### Executing SQL Queries\n\n`ADO.NET` allows you to execute SQL queries against\
    \ the database. You can use `SqlCommand` to define and execute SQL commands. Here’s\
    \ an example of executing a simple SQL query to retrieve data from a SQL Server\
    \ database:\n\n```csharp\nusing System;\nusing System.Data.SqlClient;\n\nclass\
    \ Program\n{\n    static void Main()\n    {\n        string connectionString =\
    \ \"Server=myServer;Database=myDatabase;User Id=myUser;Password=myPassword;\"\
    ;\n        using (SqlConnection connection = new SqlConnection(connectionString))\n\
    \        {\n            connection.Open();\n            Console.WriteLine(\"Connected\
    \ to the database.\");\n            // Execute a SQL query\n            string\
    \ query = \"SELECT FirstName, LastName FROM Employees\";\n            using (SqlCommand\
    \ command = new SqlCommand(query, connection))\n            {\n              \
    \  SqlDataReader reader = command.ExecuteReader();\n                while (reader.Read())\n\
    \                {\n                    Console.WriteLine($\"First Name: {reader[\"\
    FirstName\"]}, Last Name: {reader[\"LastName\"]}\");\n                }\n    \
    \            reader.Close();\n            }\n            connection.Close();\n\
    \            Console.WriteLine(\"Connection closed.\");\n        }\n    }\n}\n\
    ```\n\nIn this example, we execute a `SELECT` query to retrieve data from an `Employees`\
    \ table.\n\n### Parameterized Queries and Security\n\nWhen working with SQL queries,\
    \ it’s essential to use parameterized queries to prevent SQL attacks. Parameterized\
    \ queries separate SQL code from user input, making it more secure. Here’s an\
    \ example of a parameterized query:\n\n```csharp\nusing System;\nusing System.Data.SqlClient;\n\
    \nclass Program\n{\n    static void Main()\n    {\n        string connectionString\
    \ = \"Server=myServer;Database=myDatabase;User Id=myUser;Password=myPassword;\"\
    ;\n        using (SqlConnection connection = new SqlConnection(connectionString))\n\
    \        {\n            connection.Open();\n            Console.WriteLine(\"Connected\
    \ to the database.\");\n            // Parameterized query\n            string\
    \ query = \"SELECT FirstName, LastName FROM Employees WHERE Department = @Department\"\
    ;\n            using (SqlCommand command = new SqlCommand(query, connection))\n\
    \            {\n                command.Parameters.AddWithValue(\"@Department\"\
    , \"HR\");\n                SqlDataReader reader = command.ExecuteReader();\n\
    \                while (reader.Read())\n                {\n                  \
    \  Console.WriteLine($\"First Name: {reader[\"FirstName\"]}, Last Name: {reader[\"\
    LastName\"]}\");\n                }\n                reader.Close();\n       \
    \     }\n            connection.Close();\n            Console.WriteLine(\"Connection\
    \ closed.\");\n        }\n    }\n}\n```\n\nIn this example, we use the `@Department`\
    \ parameter to filter the results based on the department specified in the parameter.\n"
  raw: 'In this XML serialization example, we use XmlSerializer to serialize and deserialize
    a Person object to and from an XML file.


    JSON serialization and deserialization can be achieved similarly using JsonSerializer
    from the System.Text.Json namespace. These serialization formats are more human-readable
    and widely used in web APIs and data interchange.


    Serialization and deserialization are essential techniques in C# for saving and
    retrieving application data and sharing data between different components and
    systems. Choosing the appropriate serialization format depends on your specific
    use case and requirements.


    ## Section 7.4: Handling XML and JSON Data


    XML (Extensible Markup Language) and JSON (JavaScript Object Notation) are two
    widely used data interchange formats. In C#, you can work with both XML and JSON
    data for various purposes, such as configuration files, web service communication,
    and data storage. This section explores how to handle XML and JSON data in C#.


    ### Working with XML Data


    C# provides libraries for parsing and manipulating XML data. The System.Xml namespace
    includes classes like XmlDocument, XmlReader, and XmlWriter for working with XML
    data.


    Here’s an example of reading and writing XML data using XmlDocument:


    using System;


    using System.Xml;


    class Program


    {


    static void Main()


    {


    // Creating an XML document


    XmlDocument xmlDoc = new XmlDocument();


    xmlDoc.LoadXml("<book><title>C# Programming</title><author>John Doe</author></book>");


    // Reading XML data


    XmlNode titleNode = xmlDoc.SelectSingleNode("/book/title");


    string title = titleNode.InnerText;


    XmlNode authorNode = xmlDoc.SelectSingleNode("/book/author");


    string author = authorNode.InnerText;


    Console.WriteLine($"Title: {title}");


    Console.WriteLine($"Author: {author}");


    // Modifying XML data


    titleNode.InnerText = "Advanced C# Programming";


    // Saving the modified XML


    xmlDoc.Save("book.xml");


    Console.WriteLine("XML data saved.");


    }


    }


    In this example, we create an XML document, read data from it, modify the data,
    and then save it back to a file.


    ### Working with JSON Data


    To work with JSON data in C#, you can use the System.Text.Json namespace. It provides
    classes like JsonSerializer for serialization and deserialization of JSON data.


    Here’s an example of working with JSON data:


    using System;


    using System.Text.Json;


    class Program


    {


    public class Person


    {


    public string Name { get; set; }


    public int Age { get; set; }


    }


    static void Main()


    {


    // Serialization to JSON


    Person person = new Person { Name = "Alice", Age = 28 };


    string json = JsonSerializer.Serialize(person);


    Console.WriteLine($"JSON: {json}");


    // Deserialization from JSON


    Person deserializedPerson = JsonSerializer.Deserialize<Person>(json);


    Console.WriteLine($"Name: {deserializedPerson.Name}, Age: {deserializedPerson.Age}");


    }


    }


    In this JSON example, we define a Person class, serialize an instance of it to
    JSON, and then deserialize it back to a C# object.


    Both XML and JSON are versatile formats for data exchange. Choose the one that
    best suits your application’s requirements and integrates seamlessly with other
    systems or services you may be interacting with. C# provides excellent support
    for both formats, making it easy to work with XML and JSON data.


    ## Section 7.5: Database Connectivity and ADO.NET


    Database connectivity is a crucial aspect of many software applications. C# provides
    the ADO.NET (ActiveX Data Objects for .NET) framework for interacting with relational
    databases. ADO.NET allows you to connect to databases, execute queries, and retrieve
    and manipulate data. In this section, we will explore how to work with databases
    using ADO.NET in C#.


    ### Connecting to a Database


    To connect to a database using ADO.NET, you need to specify a connection string
    that contains information about the database server, authentication credentials,
    and the database itself. Here’s an example of connecting to a SQL Server database:


    using System;


    using System.Data.SqlClient;


    class Program


    {


    static void Main()


    {


    string connectionString = "Server=myServer;Database=myDatabase;User Id=myUser;Password=myPassword;";


    using (SqlConnection connection = new SqlConnection(connectionString))


    {


    connection.Open();


    Console.WriteLine("Connected to the database.");


    // Perform database operations here


    connection.Close();


    Console.WriteLine("Connection closed.");


    }


    }


    }


    In this example, we create a SqlConnection object and open the connection using
    the specified connection string. You should replace myServer, myDatabase, myUser,
    and myPassword with the actual database server information and credentials.


    ### Executing SQL Queries


    ADO.NET allows you to execute SQL queries against the database. You can use SqlCommand
    to define and execute SQL commands. Here’s an example of executing a simple SQL
    query to retrieve data from a SQL Server database:


    using System;


    using System.Data.SqlClient;


    class Program


    {


    static void Main()


    {


    string connectionString = "Server=myServer;Database=myDatabase;User Id=myUser;Password=myPassword;";


    using (SqlConnection connection = new SqlConnection(connectionString))


    {


    connection.Open();


    Console.WriteLine("Connected to the database.");


    // Execute a SQL query


    string query = "SELECT FirstName, LastName FROM Employees";


    using (SqlCommand command = new SqlCommand(query, connection))


    {


    SqlDataReader reader = command.ExecuteReader();


    while (reader.Read())


    {


    Console.WriteLine($"First Name: {reader["FirstName"]}, Last Name: {reader["LastName"]}");


    }


    reader.Close();


    }


    connection.Close();


    Console.WriteLine("Connection closed.");


    }


    }


    }


    In this example, we execute a SELECT query to retrieve employee data from a table
    called Employees and display the results.


    ### Parameterized Queries and Security


    When working with SQL queries, it’s essential to use parameterized queries to
    prevent SQL injection attacks. Parameterized queries separate SQL code from user
    input, making it more secure. Here’s an example of a parameterized query:


    using System;


    using System.Data.SqlClient;


    class Program


    {


    static void Main()


    {


    string connectionString = "Server=myServer;Database=myDatabase;User Id=myUser;Password=myPassword;";


    using (SqlConnection connection = new SqlConnection(connectionString))


    {


    connection.Open();


    Console.WriteLine("Connected to the database.");


    // Parameterized query


    string query = "SELECT FirstName, LastName FROM Employees WHERE Department = @Department";


    using (SqlCommand command = new SqlCommand(query, connection))


    {


    command.Parameters.AddWithValue("@Department", "HR");


    SqlDataReader reader = command.ExecuteReader();


    while (reader.Read())


    {


    Console.WriteLine($"First Name: {reader["FirstName"]}, Last Name: {reader["LastName"]}");


    }


    reader.Close();


    }


    connection.Close();


    Console.WriteLine("Connection closed.");


    }


    }


    }


    In this example, we use the @Department parameter to filter the results based
    on the department specified in the parameter.


    ADO.NET is a versatile framework for database connectivity in C#. It supports
    various database systems, including SQL Server, MySQL, Oracle, and more. Understanding
    ADO.NET is crucial for building applications that interact with databases and
    manage data effectively.


