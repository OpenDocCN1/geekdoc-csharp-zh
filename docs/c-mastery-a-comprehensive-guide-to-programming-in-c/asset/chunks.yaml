    \ 循环\n\n`while` 循环只要指定的条件为真，就会重复执行某块代码：\n\n```csharp\nint count = 0;\nwhile (count\
    \ < 5)\n{\n    Console.WriteLine($\"Count: {count}\");\n    count++;\n}\n```\n\
    \n这个 `while` 循环会在控制台打印从“Count: 0”到“Count: 4”。\n\n#### do-while 循环\n\n`do-while`\
    \ 循环与 `while` 循环类似，但它保证代码块至少执行一次，即使初始条件为假也是：\n\n```csharp\nint n = 5;\ndo\n{\n\
    \    Console.WriteLine($\"Iteration {n}\");\n    n++;\n} while (n < 5);\n```\n\
    \n在这个示例中，代码块在检查条件之前执行了一次，因此打印了“Iteration 5”。\n\n#### foreach 循环\n\n`foreach` 循环用于遍历数组或列表等集合。它简化了遍历元素的过程：\n\
    \n```csharp\nint[] numbers = { 1, 2, 3, 4, 5 };\nforeach (int num in numbers)\n\
    {\n    Console.WriteLine($\"Number: {num}\");\n}\n```\n\n这个 `foreach` 循环遍历 `numbers`\
    \ 数组并向控制台打印每个数字。\n\n控制流和决策对于构建动态且交互式的 C# 程序至关重要。通过有效使用条件语句和循环，你可以创建响应不同情况并执行重复任务的程序。在接下来的章节中，我们将深入探讨更高级的\
    \ C# 概念，允许你构建更复杂的应用程序。\n\n## 第 2.5 节：调试与错误处理\n\n调试和错误处理是软件开发的关键方面。在本节中，我们将探索在\
    \ C# 代码中识别并修复问题的技术，以及优雅地处理错误。\n\n### 调试你的代码\n\n调试是软件开发中的关键环节。在这一部分，我们将探索在你的 C#\
    \ 代码中识别并修复问题的方法。Visual Studio 提供了各种调试工具来帮助你。\n\n#### 设置断点\n\n最常用的调试技术之一是设置断点。在\
    \ Visual Studio 中，点击代码左侧的边缘即可设置断点，程序会在运行到此处时停止。\n\n#### 逐行执行代码\n\n一旦程序在断点处停止，你可以使用“单步调试”（F11）进入函数调用、“单步执行”（F10）执行当前行或“逐语句跳出”（Shift+F11）出函数。\n\
    \n#### 检查变量\n\n在调试期间，你可以检查变量的值和表达式。在 Visual Studio 中，可以使用“监视”（Watch）窗口监控特定变量。\n\
    \n#### 调试工具\n\nVisual Studio 提供了各种调试工具，例如用于执行代码的“立即”（Immediate）窗口、用于跟踪函数调用的“调用堆栈”（Call\
    \ Stack）以及查看局部变量的“局部”（Locals）窗口。\n\n### 错误处理\n\n除了调试，优雅地处理 C# 代码中的错误也至关重要。处理错误确保程序不会崩溃并为用户提供有用的反馈。\n\
    \n#### 异常处理\n\nC# 使用异常处理来处理运行时错误。可以使用 `try`、`catch`、`finally` 和 `throw` 块来管理异常。\n\
    \n```csharp\ntry\n{\n    // 可能会抛出异常的代码\n    int result = 10 / int.Parse(\"0\"\
    );\n}\ncatch (DivideByZeroException)\n{\n    Console.WriteLine(\"Division by zero.\"\
    );\n}\ncatch (FormatException)\n{\n    Console.WriteLine(\"Invalid format.\");\n\
    }\nfinally\n{\n    Console.WriteLine(\"Cleanup code.\");\n}\n```\n\n在这个示例中，如果在除法或解析期间发生异常，将执行相应的\
    \ `catch` 块，然后 `finally` 块无论是否发生异常都会执行清理代码。\n\n#### 自定义异常\n\n你可以通过派生 `Exception`\
    \ 类创建自定义异常类，以处理特定的应用程序错误。自定义异常应该提供有关错误的意义信息以及解决方法。\n\n#### 日志\n\n日志是错误处理的另一个重要方面。你可以使用\
    \ `Serilog` 或 `NLog` 等日志库记录应用程序中的错误和事件。日志可以帮助你在生产环境中诊断问题并监控应用程序健康。\n\n```csharp\n\
    using Serilog;\n\nLog.Logger = new LoggerConfiguration()\n    .WriteTo.Console()\n\
    \    .WriteTo.File(\"log.txt\")\n    .CreateLogger();\n\ntry\n{\n    // 可能会抛出异常\n\
    }\ncatch (Exception ex)\n{\n    Log.Error(ex, \"An error occurred.\");\n}\nfinally\n\
    {\n    Log.CloseAndFlush();\n}\n```\n\n这个示例演示了如何使用 `Serilog` 将错误和消息记录到控制台和日志文件。\n\
    \n### 测试\n\n测试是预防错误的重要部分。使用 `NUnit` 或 `xUnit` 等框架编写单元测试有助于在开发早期识别问题。自动化测试确保你的代码按预期运行，并在进行更改时捕获回归问题。\n\
    \n"
- fmt: "\nObject-Oriented Programming is a programming paradigm that structures code\
    \ around objects, which are instances of classes. Objects encapsulate data (attributes\
    \ or properties) and behavior (methods or functions) into a single unit. OOP promotes\
    \ concepts like encapsulation, inheritance, and polymorphism, making code more\
    \ modular, reusable, and easier to maintain.\n\n### Classes and Objects\n\nIn\
    \ OOP, a `class` is a blueprint or template for creating objects. It defines the\
    \ structure and behavior that objects of that class will have. A `class` encapsulates\
    \ data (attributes) and methods (functions) that operate on that data.\n\nHere’s\
    \ a simple example of a class in C#:\n\n```csharp\npublic class Person\n{\n  \
    \  // Properties (attributes)\n    public string Name { get; set; }\n    public\
    \ int Age { get; set; }\n\n    // Methods (behavior)\n    public void SayHello()\n\
    \    {\n        Console.WriteLine($\"Hello, my name is {Name} and I'm {Age} years\
    \ old.\");\n    }\n}\n```\n\nIn this code:\n- We define a `Person` class with\
    \ two properties: `Name` and `Age`.\n- The `SayHello` method is a behavior associated\
    \ with the `Person` class, allowing a `Person` object to introduce itself.\n\n\
    To create an object of the `Person` class, you use the `new` keyword:\n\n```csharp\n\
    Person person1 = new Person();\nperson1.Name = \"Alice\";\nperson1.Age = 30;\n\
    person1.SayHello(); // Outputs: Hello, my name is Alice and I'm 30 years old.\n\
    ```\n\nHere, `person1` is an instance of the `Person` class, and you can access\
    \ its properties and methods.\n\n### Encapsulation\n\nEncapsulation is the concept\
    \ of bundling data and methods that operate on that data into a single unit (a\
    \ `class`). It helps hide the internal details of how an object works, exposing\
    \ only what’s necessary. In our `Person` class, the properties `Name` and `Age`\
    \ are encapsulated within the class, and external code can access them using getters\
    \ and setters.\n\n### Constructors\n\nConstructors are special methods that are\
    \ used to initialize objects when they are created. They have the same name as\
    \ the class and are called when you use the `new` keyword to create an object.\
    \ Here’s an example constructor for the `Person` class:\n\n```csharp\npublic class\
    \ Person\n{\n    public string Name { get; set; }\n    public int Age { get; set;\
    \ }\n\n    // Constructor\n    public Person(string name, int age)\n    {\n  \
    \      Name = name;\n        Age = age;\n    }\n    // ...\n}\n```\n\nYou can\
    \ create a `Person` object with this constructor:\n\n```csharp\nPerson person2\
    \ = new Person(\"Bob\", 25);\n```\n\n### Object Initialization Syntax\n\nC# provides\
    \ object initialization syntax, allowing you to create and initialize objects\
    \ concisely:\n\n```csharp\nPerson person3 = new Person\n{\n    Name = \"Charlie\"\
    ,\n    Age = 40\n};\n```\n\nThis syntax is especially useful when you want to\
    \ set several properties during object creation.\n\nUnderstanding classes and\
    \ objects is the foundation of OOP in C#. Classes define the blueprint for objects,\
    \ and objects are instances of these classes that encapsulate data and behavior.\
    \ In the next sections, we’ll explore advanced OOP concepts like inheritance,\
    \ polymorphism, and abstraction, which enable you to build complex and flexible\
    \ C# applications.\n\n## Section 3.2: Encapsulation and Access Modifiers\n\nIn\
    \ this section, we’ll delve into the concept of encapsulation and explore access\
    \ modifiers in C#. Encapsulation is a fundamental principle of Object-Oriented\
    \ Programming (OOP) that allows you to control access to the internal state and\
    \ behavior of objects. Access modifiers help define the visibility and accessibility\
    \ of members (fields, properties, methods, etc.) within a `class`.\n\n### Encapsulation\
    \ in OOP\n\nEncapsulation is the bundling of data (attributes or properties) and\
    \ the methods (functions or behavior) that operate on that data into a single\
    \ unit called a `class`. It provides several benefits, including:\n\n- **Data\
    \ Hiding**: Encapsulation hides the internal details of a `class` from external\
    \ code. This means that the internal representation of an object can change without\
    \ affecting the code that uses the object.\n- **Controlled Access**: It allows\
    \ you to define which members of a `class` are accessible from outside and which\
    \ are not. This control prevents unauthorized modifications or access to sensitive\
    \ data.\n- **Code Reusability**: Encapsulated classes can be easily reused in\
    \ different parts of the code or in other projects, promoting code modularity.\n\
    \n### Access Modifiers\n\nAccess modifiers in C# determine the visibility and\
    \ accessibility of class members. There are several access modifiers available,\
    \ including:\n\n- `public`: Members marked as `public` are accessible from any\
    \ part of the code, both within the `class` and externally.\n- `private`: Members\
    \ marked as `private` are only accessible within the same `class`. They are not\
    \ visible or accessible from outside the `class`.\n- `protected`: Members marked\
    \ as `protected` are accessible within the `class` and by derived classes (classes\
    \ that inherit from the base class).\n- `internal`: Members marked as `internal`\
    \ are accessible within the same assembly (a compiled unit of code, such as a\
    \ DLL or executable).\n- `protected internal`: Members marked as `protected internal`\
    \ are accessible within the same assembly and by derived classes.\n- `private\
    \ protected`: Members marked as `private protected` are accessible within the\
    \ same assembly and by derived classes, but only if they are in the same assembly.\n\
    \n### Example of Encapsulation and Access Modifiers\n\nLet’s consider an example\
    \ using a `BankAccount` class:\n\n```csharp\npublic class BankAccount\n{\n   \
    \ // Private fields (encapsulated data)\n    private string accountNumber;\n \
    \   private decimal balance;\n\n    // Constructor\n    public BankAccount(string\
    \ accountNumber)\n    {\n        this.accountNumber = accountNumber;\n       \
    \ this.balance = 0.0m;\n    }\n\n    // Public method (encapsulated behavior)\n\
    \    public void Deposit(decimal amount)\n    {\n        if (amount > 0)\n   \
    \     {\n            balance += amount;\n        }\n    }\n\n    // Public method\
    \ (encapsulated behavior)\n    public bool Withdraw(decimal amount)\n    {\n \
    \       if (amount > 0 && balance >= amount)\n        {\n            balance -=\
    \ amount;\n            return true;\n        }\n        return false;\n    }\n\
    \n    // Public property (encapsulated data access control)\n    public decimal\
    \ Balance\n    {\n        get { return balance; }\n    }\n}\n```\n\nIn this `BankAccount`\
    \ class:\n- `accountNumber` and `balance` are `private` fields, encapsulating\
    \ data and hiding it from external code.\n- `Deposit` and `Withdraw` are `public`\
    \ methods that provide controlled access to the account’s behavior.\n- `Balance`\
    \ is a `public` property that allows external code to read the balance but not\
    \ modify it directly.\n\nBy using encapsulation and access modifiers, you can\
    \ create classes that provide a clear interface to their functionality while keeping\
    \ their internal details hidden and controlled. This promotes code maintainability,\
    \ flexibility, and security.\n\n## Section 3.3: Inheritance and Polymorphism\n\
    \nInheritance and polymorphism are key concepts in Object-Oriented Programming\
    \ (OOP) that enable code reuse, flexibility, and extensibility. In this section,\
    \ we’ll explore these concepts and how they are implemented in C#.\n\n### Inheritance\n\
    \nInheritance is a mechanism in which a new class (derived or child class) is\
    \ created by inheriting properties and behaviors (fields and methods) from an\
    \ existing class (base or parent class). The derived class can extend or override\
    \ the functionality of the base class.\n\n#### Creating a Derived Class\n\nTo\
    \ create a derived class in C#, you use the `:` followed by the base class name\
    \ in the class declaration. Here’s an example:\n\n```csharp\npublic class Animal\n\
    {\n    public void Eat()\n    {\n        Console.WriteLine(\"Animal is eating.\"\
    );\n    }\n}\n\npublic class Dog : Animal\n{\n    public void Bark()\n    {\n\
    \        Console.WriteLine(\"Dog is barking.\");\n    }\n}\n```\n\nIn this example,\
    \ the `Dog` class is derived from the `Animal` class. It inherits the `Eat` method\
    \ from `Animal` and adds its own method, `Bark`.\n\n#### Overriding Base Class\
    \ Members\n\nDerived classes can override base class members to provide their\
    \ own implementation. To do this, you use the `override` keyword. Here’s an example\
    \ with an overridden method:\n\n```csharp\npublic class Shape\n{\n    public virtual\
    \ void Draw()\n    {\n        Console.WriteLine(\"Drawing a shape.\");\n    }\n\
    }\n\npublic class Circle : Shape\n{\n    public override void Draw()\n    {\n\
    \        Console.WriteLine(\"Drawing a circle.\");\n    }\n}\n```\n"
