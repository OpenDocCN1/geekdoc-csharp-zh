    ### String Interpolation


    String interpolation is a convenient way to embed expressions within strings.
    You can use the $ symbol followed by {} to include variable values or expressions
    in a string:


    string name = "Alice";


    int age = 25;


    Console.WriteLine($"Hello, {name}! You are {age} years old.");


    String interpolation makes it easy to create dynamic and readable messages.


    ### Formatting Output


    You can format output using various format specifiers. For example, to format
    a number with a specific number of decimal places, use the F specifier:


    double price = 19.99;


    Console.WriteLine($"Price: {price:F2}");


    This code outputs the price with two decimal places: “Price: 19.99.”


    ### Console Input Conversion


    When reading input from the console, you may need to convert it to the appropriate
    data type. For example, to read an integer, you can use int.Parse():


    Console.Write("Enter your age: ");


    string ageInput = Console.ReadLine();


    int age = int.Parse(ageInput);


