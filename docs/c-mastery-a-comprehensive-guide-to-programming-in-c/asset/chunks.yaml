    \ Studio Code。\n• 安装完成后，打开 Visual Studio Code，通过安装相关的扩展来开始进行 C# 开发。\n\n## 2. 安装\
    \ .NET SDK\n\n.NET 软件开发工具包（`SDK`）是 C# 开发的基础组件。它提供了构建、测试和运行 C# 所需的工具。以下是安装方法：\n\
    \n• 访问官方[.NET 网站](https://dotnet.microsoft.com/download) 并下载适用于你操作系统的 .NET SDK。\n\
    \n• 按照你平台的安装说明完成安装过程。\n• 要验证 .NET SDK 是否安装正确，请打开终端或命令提示符并运行以下命令：\n\n```bash\n\
    dotnet--version\n```\n\n此 `dotnet--version` 将显示已安装的 .NET SDK 版本，确认你的安装已成功。\n\n\
    ## 3. 验证你的设置\n\n一旦你安装了 Visual Studio 或 Visual Studio Code 以及 .NET SDK，验证开发环境是否配置正确至关重要。以下是快速检查：\n\
    \n### Visual Studio\n\n1. 打开 Visual Studio。\n2. 点击 `文件` > `新建` > `项目`。\n3. 选择一个\
    \ C# 项目模板（例如，`控制台应用`）。\n4. 点击 `创建` 创建一个新项目。\n5. 编写一个简单的 C# 程序并运行它，以确保一切运行正常。\n\
    \n### Visual Studio Code\n\n1. 打开 Visual Studio Code。\n2. 如果你还没有安装 C# 扩展，请安装它。你可以在扩展市场中搜索“C#”来实现。\n\
    3. 创建一个新的 C# 项目或打开一个现有的项目。\n4. 编写一个简单的 C# 程序并运行它，以验证你的设置是否正确。\n\n通过这些步骤，你将拥有一个功能完备的\
    \ C# 开发环境供你的项目使用。在接下来的章节中，我们将深入研究 C# 语言，并开始编写代码来构建有趣的应用程序。\n\n## 1.3 节：理解 C# 语言基础\n\
    \n在本节中，我们将探索 C# 编程语言的基础构建块。对于任何开始 C# 开发的人来说，这些基础知识都是必须的，并且构成了有效编写 C# 代码的基础。\n\n\
    ### 1. 变量和数据类型\n\n变量用于在 C# 程序中存储数据。C# 是一种静态类型语言，这意味着变量在使用之前必须用特定的数据类型声明。C# 中常见的数据类型包括\
    \ `int`、`float`、`string`、`bool` 等。以下是声明和初始化变量的方法：\n\n```csharp\nint age = 30;\
    \ // 一个整数变量\nfloat price = 19.99f; // 一个浮点数变量（注意 'f' 后缀）\nstring name = \"John\"\
    ; // 一个字符串变量\nbool isStudent = true; // 一个布尔变量\n```\n\n### 2. 注释\n\nC# 中的注释用于在代码中添加解释性说明。编译器会忽略这些注释，它们仅供人类可读性。单行注释以\
    \ `//` 开头，多行注释则包含在 `/* */` 之间。这是一个示例：\n\n```csharp\n// 这是一个单行注释\n\n/*\n这是一个\n\
    多行\n注释\n*/\n```\n\n### 3. 控制台输入与输出\n\n你可以通过从控制台读取输入和显示输出与用户交互。`Console` 类提供了此类目的的方法。要显示文本，请使用\
    \ `Console.WriteLine()`：\n\n```csharp\nConsole.WriteLine(\"Hello, C#!\"); // 打印\
    \ \"Hello, C#!\" 后换行\n```\n\n要从用户处读取输入，可以使用 `Console.ReadLine()`。这是一个示例：\n\n```csharp\n\
    Console.Write(\"Enter your name: \");\nstring userName = Console.ReadLine();\n\
    Console.WriteLine($\"Hello, {userName}!\");\n```\n\n### 4. 算术运算符\n\nC# 支持用于执行数学计算的常用算术运算符。包括\
    \ `+`（加法）、`-`（减法）、`*`（乘法）、`/`（除法）和 `%`（取模）。以下是使用它们的方法：\n\n```csharp\nint a = 10;\n\
    int b = 5;\nint sum = a + b; // 15\nint difference = a - b; // 5\nint product\
    \ = a * b; // 50\nint quotient = a / b; // 2\nint remainder = a % b; // 0\n```\n\
    \n### 5. 控制流与决策\n\n控制流语句允许你做出决策并控制程序的执行流程。常见的控制流结构包括用于条件执行的 `if` 语句、用于迭代的 `for`\
    \ 和 `while` 循环，以及用于多分支的 `switch` 语句。这是一个 `if` 语句的示例：\n\n```csharp\nint num = 10;\n\
    if (num > 0)\n{\n    Console.WriteLine(\"数字为正数.\");\n}\nelse if (num < 0)\n{\n\
    \    Console.WriteLine(\"数字为负数.\");\n}\nelse\n{\n    Console.WriteLine(\"数字为零.\"\
    );\n}\n```\n\n### 6. 函数与方法\n\n在 C# 中，你可以定义函数（方法）来封装代码块以便重复使用。没有返回值的方法使用 `void`\
    \ 关键字声明，它们可以接受参数。这是一个示例：\n\n```csharp\nvoid SayHello(string name)\n{\n    Console.WriteLine($\"\
    Hello, {name}!\");\n}\n\n// 调用方法\nSayHello(\"Alice\"); // 输出 \"Hello, Alice!\"\
    \n```\n\n## 1.4 编写你的第一个 C# 程序\n\n现在已经学习了变量、数据类型、注释、输入输出、算术运算符和控制流，是时候通过编写第一个程序来付实践了。\n\
    \n### 1. 创建 C# 项目\n\n在开始编写代码之前，你需要项目。我们将使用 Visual Studio 进行演示。\n\n1. 打开 Visual\
    \ Studio。\n2. 点击 `文件` > `新建` > `项目`。\n3. 在“创建新项目”对话框中，搜索“控制台应用 (.NET Core)”或“控制台应用\
    \ (.NET)”。\n4. 选择相应的模板，为你的项目命名（例如 `MyFirstProgram`），并选择保存位置。\n5. 点击 `创建` 按钮。\n\
    \n### 2. 编写你的第一个 C# 代码\n\n一旦有了项目，就可以编写你的第一个 C# 代码了。默认情况下，Visual Studio 会创建一个带有\
    \ `Main` 方法的 `Program.cs` 文件。该方法是程序的入口。\n\n这是一个简单的“Hello, World!”程序：\n\n```csharp\n\
    using System;\n\nclass Program\n{\n    static void Main()\n    {\n        Console.WriteLine(\"\
    Hello, World!\");\n    }\n}\n```\n\n在这段代码中：\n- 我们包含了 `System` 命名空间，它提供了对 `Console`\
    \ 访问。\n- 我们定义了一个带有 `Main` 方法的 `Program` 类。`Main` 方法是程序开始执行的地方。\n- 在 `Main` 方法内部，我们使用\
    \ `Console.WriteLine` 在控制台打印“Hello, World!”\n\n### 3. 运行你的程序\n\n要在 Visual Studio\
    \ 中运行 C# 程序，请按照以下步骤操作：\n\n1. 确保解决方案管理器中选择了 `MyFirstProgram` 项目。\n2. 点击“启动”按钮（绿色箭头）或按\
    \ `F5` 键构建并运行你的程序。\n3. 你会在 Visual Studio IDE 底部的控制台窗口看到输出：“Hello, World!”\n\n\
    恭喜！你刚刚编写并运行了第一个 C# 程序。\n\n### 4. 进一步实验\n\n现在你已经创建了一个简单的程序，请花时间进行实验和学习。尝试：\n\n\
    • 修改“Hello, World!”字符串以打印不同的消息。\n• 声明并使用变量进行计算。\n• 添加条件语句（例如 `if` 和 `else`）为你的程序创建逻辑。\n\
    • 探索不同的控制台输入和输出方法以与用户交互。\n"
