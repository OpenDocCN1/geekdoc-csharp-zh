  trans: "\n\n在上一节中，我们讨论了线程的基础和线程安全。现在，让我们来探索如何在 C# 中创建多线程应用程序。多线程允许你并发执行任务，这对于提高\
    \ CPU 密集型或 I/O 密集型操作的非常有价值。\n\n### 创建线程\n\nC# 提供了几种创建线程的方法。一种常用的方法是使用 `System.Threading`\
    \ 命名空间下的 `Thread` 类。这是一个创建并启动新线程的简单示例：\n\n```csharp\nusing System;\nusing System.Threading;\n\
    \nclass Program\n{\n    static void Main()\n    {\n        // 创建并启动新线程\n     \
    \   Thread thread = new Thread(DoWork);\n        thread.Start();\n\n        //\
    \ 主线程在这里继续执行\n        Console.WriteLine(\"Main thread is running.\");\n\n    \
    \    // 等待线程完成\n        thread.Join();\n    }\n\n    static void DoWork()\n  \
    \  {\n        // 此方法在独立线程上运行\n        Console.WriteLine(\"Worker thread is running.\"\
    );\n    }\n}\n```\n\n在这个示例中，我们使用 `Thread` 类创建了一个新线程，并指定了线程应该执行的方法（`DoWork`）。`Start`\
    \ 方法开始执行该线程。主线程继续运行其他任务，并使用 `Join()` 等待工作线程完成。\n\n### 线程状态\n\nC# 中的线程可以处于各种状态，包括：\n\
    \n* `Running`: 线程正在执行代码。\n* `Suspended`: 线程临时暂停。\n* `Aborted`: 线程被强制终止。\n* `Waiting`:\
    \ 线程正在等待信号或事件。\n* `Dead`: 线程已完成执行。\n\n### 线程优先级\n\n线程可以有不同的优先级，例如 `Lowest`、`BelowNormal`、`Normal`、`AboveNormal`\
    \ 和 `Highest`。优先级影响操作系统如何调度线程执行。然而，审慎地使用优先级至关重要，因为可能会影响系统性能和公平性。\n\n```csharp\n\
    Thread thread = new Thread(DoWork);\nthread.Priority = ThreadPriority.AboveNormal;\n\
    ```\n\n### 线程池\n\n.NET Framework 还提供了一个线程池（`ThreadPool`）来高效地管理和重用线程。与其手动创建线程，可以将任务队列到线程池中，它会自动管理线程的创建和重用。\n\
    \n```csharp\nThreadPool.QueueUserWorkItem(DoWork);\n```\n\n### 多线程的挑战\n\n虽然多线程带来了优势，但它也引入了复杂性：\n\
    \n1. **线程安全**: 当多个线程访问共享资源时，确保线程安全变得至关重要。\n2. **同步**: 协调线程的执行并防止竞态条件需要仔细的同步。\n\
    3. **调试**: 由于非确定性行为，调试多线程应用程序可能具有挑战性。\n\n总之，在 C# 中创建多线程应用程序可以增强性能和并发性。然而，理解线程状态、恰当地分配任务优先级以及解决线程安全问题对于构建健壮且高效的多线程应用程序至关重要。\n\
    \n## 第 9.3 节：任务并行库 (TPL) 和 并行 LINQ (PLINQ)\n\n任务并行库 (TPL) 是 C# 中一个用于简化多线程编程的强大框架。它为管理和协调并行任务提供了更高层次的抽象，使得编写高效且可扩展的并发代码变得更容易。\n\
    \n### 任务与任务并行\n\n`TPL` 中的 `Task` 代表一个可以并发执行的异步操作。你可以将其视为一个运行在独立线程上的工作单元。任务抽象了管理线程的低级细节，让你专注于编写并行代码。\n\
    \n这是一个创建和运行任务的简单示例：\n\n```csharp\nusing System;\nusing System.Threading.Tasks;\n\
    \nclass Program\n{\n    static async Task Main()\n    {\n        Task task1 =\
    \ Task.Run(() => Console.WriteLine(\"Task 1 is running.\"));\n        Task task2\
    \ = Task.Run(() => Console.WriteLine(\"Task 2 is running.\"));\n        await\
    \ Task.WhenAll(task1, task2);\n        Console.WriteLine(\"Both tasks have completed.\"\
    );\n    }\n}\n```\n\n在这个示例中，我们使用 `Task.Run()` 创建了两个任务。`await Task.WhenAll(task1,\
    \ task2)` 在继续之前等待两个任务完成。这允许高效地并行执行任务，而无需显式管理线程。\n\n### Parallel LINQ (PLINQ)\n\
    \n并行 LINQ (`PLINQ`) 扩展了 `LINQ`语言集成查询）以实现数据的并行处理。PLINQ 自动对数据进行分区并并发地进行处理，提高了过滤、映射和聚合大型数据集的操作性能。\n\
    \n这是一个使用 PLINQ 执行并行 Select 操作的示例：\n\n```csharp\nusing System;\nusing System.Linq;\n\
    using System.Threading.Tasks;\n\nclass Program\n{\n    static void Main()\n  \
    \  {\n        int[] numbers = Enumerable.Range(1, 1000000).ToArray();\n      \
    \  var result = numbers.AsParallel()\n                            .Select(x =>\
    \ x * 2)\n                            .ToArray();\n        Console.WriteLine($\"\
    Result count: {result.Length}\");\n    }\n}\n```\n\n在这个示例中，`AsParallel()` 扩展方法将数字集合转换为并行查询，`Select`\
    \ 操作被并行执行，可能利用了多个 CPU 核心。\n\n### 优势与考虑因素\n\nTPL 和 PLINQ 提供了多个优势：\n\n* **简化的并行性**:\
    \ TPL 抽象了多线程的许多复杂性，使得编写并行代码变得更容易。\n* **自动负载均衡**: TPL 动态将任务分配到可用处理器上以实现高效的负载均衡。\n\
    * **取消与异常处理**: TPL 提供了结构化的方式来处理取消和异常。\n\n然而，审慎地使用并行性至关重要。并非所有操作都受益于并行，且过度并行可能会导致开销和性能下降。\n\
    \n总之，任务并行库和并行 LINQ 是 C# 应用程序中实现并行的强大工具。当适当使用时，它们可以极大提高应用程序的可扩展性和响应能力。\n\n## 第\
    \ 9.4 节：同步与锁定\n\n在多线程环境中，线程可能会并发访问共享资源，导致数据损坏或竞态条件。同步机制对于确保线程正确协调和安全访问至关重要。\n\n\
    ### 竞态条件\n\n竞态发生在多个线程并发访问并修改共享数据时，会导致不可预测的结果。考虑以下示例：\n\n```csharp\nusing System;\n\
    using System.Threading;\n\nclass Program\n{\n    static int counter = 0;\n\n \
    \   static void Main()\n    {\n        Thread thread1 = new Thread(IncrementCounter);\n\
    \        Thread thread2 = new Thread(IncrementCounter);\n        thread1.Start();\n\
    \        thread2.Start();\n        thread1.Join();\n        thread2.Join();\n\
    \        Console.WriteLine($\"Counter: {counter}\");\n    }\n\n    static void\
    \ IncrementCounter()\n    {\n        for (int i = 0; i < 100000; i++)\n      \
    \  {\n            // 模拟竞态条件\n            int temp = counter;\n            Thread.Sleep(1);\
    \ // 模拟某些工作\n            counter = temp + 1;\n        }\n    }\n}\n```\n\n在这个示例中，两个线程增加一个计数器变量。如果没有适当的同步，每次运行程序的结果都可能不同。\n\
    \n### 使用 lock 锁定\n\nC# 中一种常用的同步机制是 `lock` 语句。它确保同一时间只有一个线程可以访问特定的代码段。你可以这样使用它：\n\
    \n```csharp\nusing System;\nusing System.Threading;\n\nclass Program\n{\n    static\
    \ int counter = 0;\n    static readonly object lockObject = new object();\n\n\
    \    static void Main()\n    {\n        Thread thread1 = new Thread(IncrementCounter);\n\
    \        Thread thread2 = new Thread(IncrementCounter);\n        thread1.Start();\n\
    \        thread2.Start();\n        thread1.Join();\n        thread2.Join();\n\
    \        Console.WriteLine($\"Counter: {counter}\");\n    }\n\n    static void\
    \ IncrementCounter()\n    {\n        for (int i = 0; i < 100000; i++)\n      \
    \  {\n            lock (lockObject)\n            {\n                int temp =\
    \ counter;\n                Thread.Sleep(1); // 模拟某些工作\n                counter\
    \ = temp + 1;\n            }\n        }\n    }\n}\n```\n\n"
