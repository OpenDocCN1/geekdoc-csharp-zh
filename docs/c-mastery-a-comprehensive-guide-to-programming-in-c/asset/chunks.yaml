    \n继承和多态是代码复用以及构建灵活且可扩展软件的强大机制。通过使用这些概念，你可以创建有效地建模现实关系和行为的类层次结构。在接下来的章节中，我们将探索\
    \ C# 中更高级的 OOP 概念，如接口和抽象。\n\n## 第 3.4 节：抽象与接口\n\n抽象和接口是面向对象编程 (OOP) 中的核心概念，有助于代码的灵活性、模块性和维护性。在本节中，我们将探索这些概念及其在\
    \ C# 中的实现。\n\n### 抽象\n\n抽象是通过根据类的本质属性和行为进行建模来简化复杂系统的过程，同时隐藏不细节。抽象允许你关注对象做什么，而不是它是如何做的。\n\
    \n#### 抽象类\n\n在 C# 中，你可以创建抽象类作为其他类的蓝图，但它们本身不能实例化。抽象类可以包含抽象和非抽象（具体）成员（方法、属性、字段）。派生自抽象类的类必须实现所有的抽象成员。\n\
    \n```csharp\npublic abstract class Shape\n{\n    public abstract void Draw();\
    \ // 抽象方法，必须由派生类实现\n    public void Move(int x, int y)\n    {\n        // 具体方法\n\
    \        Console.WriteLine($\"Moving to ({x}, {y})\");\n    }\n}\n```\n\n在这个示例中，`Shape`\
    \ 是一个带有抽象方法 `Draw` 和具体方法 `Move` 的抽象类。\n\n#### 抽象方法\n\n抽象类中的抽象方法在基类中没有实现，并标记有 `abstract`\
    \ 关键字。派生类必须为这些方法提供实现。\n\n```csharp\npublic abstract class Shape\n{\n    public\
    \ abstract void Draw();\n}\n```\n\n像 `Circle` 和 `Rectangle` 这样的派生类必须实现 `Draw`\
    \ 方法。\n\n### 接口\n\n接口定义了实现类必须遵守的方法、属性、事件或索引器的合约。与抽象类不同，一个类可以实现多个接口，从而促进代码复用和活性。\n\
    \n#### 创建接口\n\n在 C# 中，你使用 `interface` 关键字定义接口。接口由方法签名和属性声明组成，不包含实现。\n\n```csharp\n\
    public interface IDrawable\n{\n    void Draw(); // 方法签名\n    int Width { get;\
    \ } // 属性声明\n}\n```\n\n在这个示例中，`IDrawable` 是一个接口，包含一个 `Draw` 方法和一个只读属性 `Width`。\n\
    \n#### 实现接口\n\n类可以通过为接口中定义的所有成员提供具体实现来实现接口。\n\n```csharp\npublic class Circle\
    \ : IDrawable\n{\n    public void Draw()\n    {\n        Console.WriteLine(\"\
    Drawing a circle.\");\n    }\n    public int Width\n    {\n        get { return\
    \ 10; }\n    }\n}\n```\n\n在这个示例中，`Circle` 类实现了 `IDrawable` 接口，为 `Draw` 方法和 `Width`\
    \ 属性提供了自己的实现。\n\n#### 使用接口实现多态\n\n接口实现了多态，允许你使用公共接口引用处理实现相同接口的不同类的对象。\n\n```csharp\n\
    IDrawable shape1 = new Circle();\nIDrawable shape2 = new Rectangle();\nshape1.Draw();\
    \ // 调用 Circle 的 Draw 方法\nshape2.Draw(); // 调用 Rectangle 的 Draw 方法\n```\n\n在这个示例中，`shape1`\
    \ 和 `shape2` 的类型都是 `IDrawable`，但它们指向的是实现接口的不同类的实例。多态允许你统一处理这些对象。\n\n### 抽象和接口的优势\n\
    \n抽象和接口在 OOP 中起着至关重要的作用，允许你：\n\n- 为类定义合约。\n- 通过继承和接口实现代码复用。\n- 在更高的抽象层次上操作对象，提高灵活性。\n\
    - 通过建模本质属性和行为来分离关注。\n\n通过掌握 C# 中的抽象和接口，你可以设计出能够灵活适应需求变化并随应用扩展的软件系统。\n\n## 第 3.5\
    \ 节：在 OOP 中处理异常\n\n异常处理是面向对象编程 (OOP) 的一个关键方面，允许你优雅地处理运行时错误。在本节中，我们将探索 C# 中的异常处理。\n\
    \n### 异常处理基础\n\n异常处理是响应和管理程序执行过程中可能出现的运行时错误或异常的过程。这些错误可能由于各种原因引起，例如无效输入、找不到文件或网络问题。\n\
    \n在 C# 中，异常处理通过 `try`、`catch`、`finally` 和 `throw` 等关键字来实现。\n\n#### try 和 catch\
    \ 块\n\n`try` 块用于包含可能抛出异常的代码。如果 `try` 块内部发生异常，程序将跳转到相应的 `catch` 块，由该块处理异常。\n\n\
    ```csharp\ntry\n{\n    // 可能抛出异常的代码\n}\ncatch (Exception ex)\n{\n    // 处理异常\n\
    \    Console.WriteLine($\"An error occurred: {ex.Message}\");\n}\n```\n\n在这个示例中，如果\
    \ `try` 块内部发生异常，它会被 `catch` 块捕获，你可以通过显示错误信息来处理它。\n\n#### finally 块\n\n`finally`\
    \ 块用于指定无论是否发生异常都必须执行的代码。它通常用于清理操作。\n\n```csharp\ntry\n{\n    // 可能抛出异常的代码\n}\n\
    catch (Exception ex)\n{\n    // 处理异常\n    Console.WriteLine($\"An error occurred:\
    \ {ex.Message}\");\n}\nfinally\n{\n    // 清理代码\n    Console.WriteLine(\"Cleanup\"\
    );\n}\n```\n\n"
