    ## Variables


    Now that you know a bit more about statements and comments, we will start to learn
    more about variables, which are quite important in C#, as you will probably use
    them in most of your programs to perform calculations or to work with text.


    ### What is a variable?


    A variable can be compared to a container that includes a value that may change
    over time. When using variables, we usually need to: (1) declare the variable
    by specifying its type, (2) assign a value to this variable, and (3) possibly
    combine this variable with other variables using operators, as illustrated in
    the next code snippet.


    ```c

    int myAge;//we declare the variable myAge


    myAge = 20;// we set the variable myAge to 20


    myAge = myAge + 1; //we add 1 to the variable myAge

    ```


    In the previous example, we have declared a variable called `myAge` and its type
    is `int` (as in integer). We save the value `20` in this variable, and we then
    add `1` to it.


    Note that in C# the variable is declared using its type followed by its name.
    As we will see later, we will also need to use what is called an access modifier
    in order to specify how and from where this variable can be accessed.


    Also note that in the previous code, we have assigned the value `myAge + 1` to
    the variable `myAge`; the `=` operator is an assignment operator; in other words,
    it is there to assign a value to a variable and is not to be understood in a strict
    algebraic sense (i.e., that the values or variables on both sides of the `=` sign
    are equal).


    To make C# coding easier and leaner, you can declare several variables of the
    same type in one statement. For example, in the next code snippet, we declare
    three variables `v1`, `v2`, and `v3` in one statement. This is because they are
    of the same type (i.e., they are integers).


    ```c

    int v1,v2,v3;


    int v4=4, v5=5, v6=6;

    ```


    In the code above, the first line declares the variables `v1`, `v2`, and `v3`.
    All three variables are integers. In the second line of code, not only do we declare
    three variables simultaneously, but we also initialize them by setting a value
    for each of these variables.


    When using variables, there are a few things that we need to determine including
    their name, their type and their scope:


    *   **Name of a variable**: a variable is usually given a unique name so that
    it can be identified easily and uniquely. The name of a variable is usually referred
    to as an identifier. When defining an identifier, it can contain letters, digits,
    a minus, an underscore or a dollar sign, and it usually begins with a letter.
    Identifiers cannot be keywords (for example the keyword `if` cannot be used as
    an identifier).

    *   **Type of variable**: variables can hold several types of data, including
    numbers (e.g., integers, doubles or floats), text (e.g., strings or characters),
    Boolean values (e.g., true or false), arrays, or objects (we will see the concept
    of arrays later in this chapter).


    ```csharp

    string myName = "Patrick";//the text is declared using double quotes


    int currentYear = 2017;//the year needs no decimals and is declared as an integer


    float width = 100.45f;//the width is declared as a float (i.e., with decimals)

    ```


    *   **Variable declaration**: variables need to be declared so that the system
    knows what you are referring to if you use this variable in your code. The first
    step in using a variable is to declare or define this variable. At the declaration
    stage, the variable does not have to be assigned a value, as this can be done
    later. In the next example, we declare a variable called `myName` and then assign
    the value `"My Name"` to it.


    ```csharp

    string myName;


    myName = "My Name"

    ```


    *   **Scope of a variable**: a variable can be accessed in specific contexts that
    depend on where in the application the variable was initially declared. We will
    look at this concept later.

    *   **Accessibility level**: as we will see later, a C# program consists of classes;
    for each of these classes, the methods and variables within can be accessed depending
    on their accessibility levels and we will look at this principle later.


    Common variable types include:


    *   **String**: same as text.

    *   **Int**: integer (1, 2, 3, etc.).

    *   **Boolean**: true or false.

    *   **Float**: with a fractional value (e.g., 1.2f, 3.4f, etc.).

    *   **Arrays**: a group of variables of the same type. If this is unclear, not
    to worry, this concept will be explained further in this chapter.


    ## Using variables


    In this section, we will start to use variables and combine them using statements
    and operators. So let’s get started:


    *   Please add the following code just after the code that you have previously
    created, as follows (new code in bold).


    ```csharp

    //Console.WriteLine("Hello, this is my second line of code");


    {


    /*Console.WriteLine("this is my first application");


    Console.WriteLine("This statement and the previous one belong to the same block
    of instructions */;


    }


    int dateOfBirth = 1990;


    int currentYear = 2017;


    int age = currentYear - dateOfBirth;


    Console.WriteLine("My age is " + age);

    ```


    In the previous code:


    *   We have commented the previous code that displayed "Hello, this is my second
    line of code" using the two forward slashes; so this code will not be executed.

    *   We declare two variables `dateOfBirth` and `currentYear`.

    *   We then declare a variable called `age`.

    *   We perform a subtraction between `currentYear` and `dateOfBirth`, and we then
    save the result in the variable `age`.

    *   Finally, we print the text `"My age is "` followed by the value of the variable
    `age`.


    Note that adding a number and a string is equivalent to concatenating these, so
    the result of this addition will be a string.


    You can now save your code and run your application; you should see the message
    "My age is 27" in the Console window.


    ## Operators


    Once we have declared and assigned a value to a variable, we can use operators
    to modify or combine this variable with other variables. There are different types
    of operators available in C#, including arithmetic operators, assignment operators,
    comparison operators and logical operators.


    So let''s look at each of these.


    *   Arithmetic operators are used to perform arithmetic operations including additions,
    subtractions, multiplications, or divisions. Common arithmetic operators include
    `+`, `-`, `*`, `/`, or `%` (modulo) and their use is illustrated in the next code
    snippet.


    ```csharp

    int number1 = 1;// the variable number1 is declared


    int number2 = 1;// the variable number2 is declared


    int sum = number1 + number2;// adding two numbers and store them in sum


    int sub = number1 - number2;// subtracting two numbers and store them in sub

    ```


    *   Assignment operators can be used to assign a value to a variable and include
    `=`, `+=`, `-=`, `*=`, `/=` or `%=` and their use is illustrated in the next code
    snippet.


    ```csharp

    int number1 = 1;


    int number2 = 1;


    number1+=1; //same as number1 = number1 + 1;


    number1-=1; //same as number1 = number1 - 1;


    number1*=1; //same as number1 = number1 * 1;


    number1/=1; //same as number1 = number1 / 1;

    ```

