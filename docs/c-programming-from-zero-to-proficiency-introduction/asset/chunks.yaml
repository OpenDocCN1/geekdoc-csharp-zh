- fmt: '

    *   Chapter 1, [Introduction to C# programming](#c003.xhtml__Ref494197817), provides
    an introduction to general programming concepts. including C# syntax, variables
    and methods. In this chapter, you will start to create your first application
    and combine variables, and methods.

    *   Chapter 2 summarizes the topics covered in this book and provides you with
    more information on the next steps to follow.


    ## What You Need to Use this Book


    To complete the project presented in this book, you only need `Visual Studio`
    (e.g., `Visual Studio Community`). In terms of computer skills, all knowledge
    introduced in this book will assume no prior programming experience from the reader.
    So for now, you only need to be able to perform common computer tasks, such as
    downloading items, opening and saving files, be comfortable with dragging and
    dropping items and typing.


    ## Who this Book is for


    If you can answer yes to all these questions, then this book is for you:


    1. Would you like to learn how to code in `C#`?

    2. Would you like to know how to use `C#` to create simple command-line programs?

    3. Would you like to discover more `C#` features?

    4. Although you may have had some prior exposure to `C#`, would you like to delve
    more into Object-Oriented Programming?


    ## Who this Book is not for


    If you can answer yes to all these questions, then this book is not for you:


    1. Can you already code your own `C#` code?

    2. Are you looking for a reference book on `C#` programming?

    3. Are you a professional `C#` developer?


    If you can answer yes to all three questions, you may instead look for the other
    books in the series on the [official website (http://www.learncsharpforbeginners.wordpress.com)](http://www.learncsharpforbeginners.wordpress.com/)).


    ## How you will Learn from this Book


    Because all students learn differently and have different expectations of a course,
    this book is designed to ensure that all readers find a learning mode that suits
    them. Therefore, it includes the following:


    *   A list of the learning objectives at the start of each chapter so that readers
    have a snapshot of the skills that will be covered.

    *   Each section includes an overview of the activities covered.

    *   Many of the activities are step-by-step, and learners are also given the opportunity
    to engage in deeper learning and problem-solving skills through the challenges
    offered at the end of each chapter.

    *   Each chapter ends-up with a quiz and challenges through which you can put
    your skills (and knowledge acquired) to the test. Challenges consist in coding,
    debugging, or creating new features based on the knowledge that you have acquired
    in the chapter.

    *   The book focuses on the core skills that you need. While some sections go
    into more detail, once concepts have been explained, links are provided to additional
    resources, where necessary.

    *   The code is introduced progressively and it is also explained in detail.

    *   You also gain access to several videos that help you along the way, especially
    for the most challenging topics.


    ## Format of each Chapter and Writing Conventions


    Throughout this book, and to make reading and learning easier, text formatting
    and icons will be used to highlight parts of the information provided and to make
    the book easy to read.


    ### Special Notes


    Each chapter includes resource sections, so that you can further your understanding
    and mastery of `C#`; these include:


    *   A quiz for each chapter: these quizzes usually include 10 questions that test
    your knowledge of the topics covered throughout the chapter. The solutions are
    provided on the companion website.

    *   A checklist: it consists of between 5 and 10 key concepts and skills that
    you need to be comfortable with before progressing to the next chapter.

    *   Challenges: each chapter includes a challenge section where you are asked
    to combine your skills to solve a particular problem.


    Author’s notes appear as illustrated below:


    Author’s suggestions appear in this box.


    Code appears as illustrated below:


    ```assembly

    public int score;


    public string playersName = "Sam";

    ```


    Checklists that include the important points covered in the chapter appear as
    illustrated below:


    | ![http://cdn2.hubspot.net/hub/377822/file-809787244-png/checklist.png?t=1421359715283](d2d_images/image004.png)
    |  |

    | :--- | :--- |

    | * Item1 for check list. | |

    | * Item2 for check list. | |

    | * Item3 for check list. | | |


    ## How Can You Learn Best from this Book?


    *   **Talk to your friends about what you are doing.**

    We often think that we understand a topic until we have to explain it to friends
    and answer their questions. By explaining your different projects, what you just
    learned will become clearer to you.

    *   **Do the exercises.**

    All chapters include exercises that will help you to learn by doing. In other
    words, by completing these exercises, you will be able to better understand the
    topics and gain practical skills (i.e., rather than just reading).

    *   **Don’t be afraid of making mistakes.**

    I usually tell my students that making mistakes is part of the learning process;
    the more mistakes you make and the more opportunities you have for learning. At
    the start, you may find the errors challenging, or you may find that your application
    does not work as expected until you understand what went wrong.

    *   **Challenge yourself.**

    All chapters include a challenge section where you can decide to take on a particular
    challenge to improve your game or skills. These challenges are there for you to
    think creatively and to apply the knowledge that you have acquired in each chapter
    using a problem-based approach.

    *   **Learn in chunks.**

    It may be challenging to go through five or six chapters straight, as it may lower
    your motivation. Instead, give yourself enough time to learn, go at your own pace,
    and learn in small units (e.g., between 15 and 20 minutes per day). This will
    do at least two things for you: it will give your brain the time to "digest" the
    information that you have just learned, so that you can start fresh the following
    day. It will also make sure you don’t "burn-out" and that you keep your motivation
    levels high.


    ## Feedback


    While I have done everything possible to produce a book of high quality and value,
    I always appreciate feedback from readers so that the book can be improved accordingly.
    If you would like to give feedback on this book, you can email me at [learncsharpforbeginners@gmail.com](mailto:learncsharpforbeginners@gmail.com).


    ## Improving the Book


    Although great care was taken in checking the content of this book, I am human,
    and some errors could remain in the book. As a result, it would be great if you
    could let me know of any issue or error you may come across in this book, so that
    it can be solved and that the book can be updated accordingly. To report an error,
    you can email me ([learncsharpforbeginners@gmail.com](mailto:learncsharpforbeginners@gmail.com))
    with the following information:


    *   Name of the book.

    *   The page or section where the error was detected.

    *   Describe the error and also what you think the correction should be.


    Once your email is received, the error will be checked, and, in the case of a
    valid error, it will be corrected, and the book will be updated to reflect the
    changes accordingly.


    ## Supporting the Author


    A lot of work has gone into this book and it is the fruit of long hours of preparation,
    brainstorming, and finally writing. As a result, I would ask that you do not distribute
    any illegal copies of this book.


    This means that if a friend wants a copy of this book, s/he will have to buy it
    through the official channels or the book’s official website:


    [http://www.learncsharpforbeginners.wordpress.com/](http://www.learncsharpforbeginners.wordpress.com/).

