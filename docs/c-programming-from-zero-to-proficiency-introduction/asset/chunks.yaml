    In the next section, we will learn how to use this syntax. If you have already
    coded in `JavaScript` or `C#`, some of the information provided in the rest of
    this chapter may look familiar and this prior exposure to `C#` will definitely
    help you. This being said, `C#` and `JavaScript`, despite some relative similarities,
    are quite different in many aspects; for example, in `C#`, variables and methods
    are declared differently.


    When programming in `C#`, you will be using a specific syntax to communicate with
    the system; this syntax will be made of sentences that will be used to convey
    information on what you would like the computer to do; these sentences or statements
    will include a combination of keywords, variables, methods, or events; and the
    next section will explain how you can confidently build these sentences together
    and consequently program in C#..


    ### Statements


    When you code in `C#`, you need to tell the system to execute your instructions
    (e.g., print information) using statements. A statement is literally an order
    or something that you ask the system to do. For example, in the next line of code,
    the statement will tell the system to print a message in the `Console` window:


    ```

    Console.WriteLine("Hello Word");

    ```


    When writing statements, you will need to follow several rules, including the
    following:


    *   The order of statements: each statement is executed in the same order as it
    appears in the application. For example, in the next example, the code will print
    hello, then world; this is because the associated statements are in that particular
    sequence.


    ```

    Console.WriteLine("hello");

    Console.WriteLine("world");

    ```


    *   Statements are separated by semi-colons (i.e., semi-colon at the end of each
    statement). Note that several statements can be added on the same line, as long
    as they are separated by a semi-colon.


    For example, the next line of code has a correct syntax, as all of its statements
    are separated by a semi-colon.


    ```

    Console.WriteLine("hello"); Console.WriteLine("world");

    ```


    *   Multiple spaces are ignored for statements; however, it is good practice to
    add spaces around the operators `+`, `-`, `/`, or `%` for clarity. For example,
    in the next code snippet, we say that `a` is equal to `b`. You may notice that
    spaces have been included both before and after the operator `=`.


    ```

    a = b;

    ```


    *   Statements to be executed together (e.g., based on the same condition) can
    be grouped using code blocks. In `C#`, code blocks are symbolized by curly brackets
    (e.g., `{` or `}`). So, in other words, if you needed to group several statements,
    you would include all of them within the same set of curly brackets, as follows:


    ```

    {

    Console.WriteLine("hello stranger!");

    Console.WriteLine("today, we will learn about programming");

    }

    ```


    As we have seen earlier, a statement usually employs or starts with a keyword
    (i.e., a word that the computer knows). Each of these keywords has a specific
    purpose, and common ones are as follows:


    *   Printing a message in the console window: the keyword is `Console.WriteLine`.

    *   Declaring a variable: the keyword, in this case, depends on the type of the
    variable that is declared (e.g., `int` for integers, `string` for text, or `bool`
    for Boolean variables), and we will see more about these in the next sections.

    *   Declaring a method: the keyword to be used depends on the type of the data
    returned by the method. For example, in `C#`, the name of the method... (rest
    of content follows).

