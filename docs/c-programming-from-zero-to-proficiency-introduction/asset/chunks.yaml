    \ work exactly this way: they are given information (and sometimes not), perform\
    \ an action, and then sometimes, if needed, return information.\n\nIn programming\
    \ terms, a method is a block of instructions that performs a set of actions. It\
    \ is executed when invoked (or put more simply called) from the application, or\
    \ when an event occurs (e.g., when the player has clicked on a button; we will\
    \ see more about events in the next section). As with variables, methods are declared\
    \ and can also be called.\n\nMethods are very useful because once the code for\
    \ a method has been created, it can be called several times without the need to\
    \ rewrite the same code all over again. Also, because methods can take parameters,\
    \ a method can process these parameters and produce or return information accordingly;\
    \ in other words, they can perform different actions and produce different outputs\
    \ based on the input. As a result, methods can do one or all of the following:\n\
    \n*   Perform an action.\n*   Return a result.\n*   Take parameters and process\
    \ them.\n\nA method is usually declared using two keywords followed by its name\
