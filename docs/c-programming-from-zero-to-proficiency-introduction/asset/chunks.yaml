    \ as `public`, which means that not only is it accessible throughout the class\
    \ called `MainClass`, but it is also accessible from outside this class.\n\n*\
    \   Local variables are declared (and should only be used) within a specific method;\
    \ hence the term local, because they can only be used locally.\n\n```cs\npublic\
