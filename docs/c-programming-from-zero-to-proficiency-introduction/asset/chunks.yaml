    # 1


    Introduction to C# programming


    ![image](d2d_images/chapter_title_below.png)


    In this section, we will go through an introduction to C# programming and look
    at key aspects that you will need for your games, including:


    *   C# syntax.


    *   Variable types and scope.


    *   Methods.


    So, after completing this chapter, you will be able to:


    *   Understand key concepts related to C# programming.


    *   Understand the concepts of variables and methods.


    *   Create and use your own methods.


    The code solutions for this chapter are included in the resource pack that you
    can download by following the instructions included in the section entitled "Support
    and Resources for this Book".


    What is C#


    C# is an object-oriented language developed by Microsoft and has been used, in
    many cases, to develop desktop applications. As it is part the .NET framework,
    it is also used for web development and apps. The fact that it is an object-oriented
    programming language means that a C# programme consists of a collection of objects
    that interact with each other.


    C# is used for many applications, including the creation of games, especially
    with the software Unity.


    Choosing a code editor


    In the next sections, you will start to write your own C# code. For this purpose,
    you will need to use a code editor, and more specifically, an Integrated Development
    Environment (IDE). These IDEs include all the necessary tools to compile and execute
    your code.


    Using an Ide will provide you with an easier way to create, organize and check
    your code, with some of the following features:


    *   Text highlighting: so that you code is clearer to read and to modify.


    *   Auto-completion: so that you don’t have to remember the name of all the variables
    in your code, or the name of some common methods.


    *   Error highlighting: so that some obvious errors are highlighted before you
    even test your code.


    There are many free IDEs available with their advantages and drawbacks, including:


    *   Visual Studio Code.


    *   Visual Studio Community.


    *   MonoDevelop.


    *   NetBeans.


    *   #Develop.


    *   Rider.


    All these IDEs considered, we will be using Visual Studio Community for this book
    (although you could use any of the other IDEs if you wish).


    You can download Visual Studio Community from the following site: [https://visualstudio.microsoft.com/free-developer-offers/](https://visualstudio.microsoft.com/free-developer-offers/)


    ––––––––


    ![image](d2d_images/scene_break.png)


    Installing Visual Studio


    Please download Visual Studio from the official site and follow the instructions;
    you should be able to download and install a version for Windows or Mac OS from
    the following site:


    [https://visualstudio.microsoft.com/free-developer-offers/](https://visualstudio.microsoft.com/free-developer-offers/)


    Creating your first application


    After this brief introduction, it is now your turn to code.


    So that you get to experiment with your C# code, please do the following after
    installing Visual Studio:


    *   Please launch VS (Visual Studio).


    *   From the main window, select the button labelled "New Project", as illustrated
    in the next figure.


    ![image](d2d_images/image012.jpg)


    Figure 1-1: Creating your project


    *   In the new window, select the option Other > .NET > Console Project (C#),
    as illustrated in the next figure:


    ![image](d2d_images/image008.jpg)


    Figure 1-2: Creating a Console Project


    *   By choosing this option, you specify that you will build a project that will
    be executed in the console window.


    *   Please click on the button labelled "Next".


    *   In the next window, enter the name and location of your new project (for example
    myFirstproject), as illustrated in the next figure.


    ![image](d2d_images/image011.jpg)


    Figure 1-3: Setting-up your Project


    *   Click on the button labelled "Create".


    Once this is done Visual Studio (VS) will create all the necessary folders for
    your project and the code editor should open as follows.


    ![image](d2d_images/image013.jpg)


    Figure 1-4: Your first code


    By default, you will see that some code has already been created for you, as follows:


    using System;


    namespace myFirstProject


    {


    class MainClass


    {


    public static void Main(string[] args)


    {


    Console.WriteLine("Hello World!");


    }


    }


    }


    In the previous code:


    *   We declare that we will be using the library (or path) called System. This
    is so that we can employ some of the useful files (i.e., classes) included in
    this namespace (or library).


    *   We declare a namespace called myFirstProject, and we will see this concept
    later in the book. This is the equivalent of a path or library for some of the
    classes that you will use in your application.


    *   We declare a class called MainClass. As we will see later, your application
    will be made of a collection of classes. One of these classes will be the class
    MainClass which the starting point for your application.


    *   We also declare a method called Main. This method will be the starting point
    for our application.


    *   In this method, and this is the most important part for now, we write the
    text "Hello World" in the console window.


    You can now compile and execute this code by pressing the black triangle located
    in the top-left corner of the window.


    ![image](d2d_images/image003.jpg)


    Figure 1-5: Running the project


    You can also proceed as follows to run your application:


    *   From the top menu, select: Run > Run With > Custom Configuration...This will
    open a window that looks like the following figure.


    ![image](d2d_images/image007.jpg)


    Figure 1-6: Running your project with custom settings


    *   Once the window is open, please leave all the default options as they are
    and then press the button labelled Run.


    *   Once this is done, the console window should appear as follows.


    ![image](d2d_images/image001.jpg)


    Figure 1-7: Your first console application


    As illustrated in the previous figure, the text "Hello World" was written and
    displayed in the console window, based on your code.


    We could now change our code so that the message displayed is different:


    *   Please close the console window.


    *   Back in VS, please edit your code and modify it as follows (new code in bold).


    public static void Main(string[] args) 


    {


    Console.WriteLine("Hello, this is my fist line of code");


    }


    In the previous code, we just modified the message displayed in the console window.


    *   You can then now run your code and see the new message, as follows:


    ![image](d2d_images/image006.jpg)


    Figure 1-8: Displaying your  own message


    Introduction to C# syntax


    When you are using C#, you are communicating with the system asking it to perform
    actions. To communicate with the system, you are using a language or a set of
    words bound by a syntax that the computer and you know. This language consists
    of keywords, key phrases, and a syntax that ensures that the instructions are
    written and (more importantly) understood properly.


    In computer science, this language needs to be exact, precise, unambiguous, and
    with a correct syntax. In other words, it needs to be exact.


    When writing C# code, you will be following a syntax; this syntax will consist
    of a set of rules that will make it possible for you to communicate your instructions
    unambiguously.  In addition to its syntax, C# also uses classes, and your C# applications
    will, by default, be saved as classes.'
