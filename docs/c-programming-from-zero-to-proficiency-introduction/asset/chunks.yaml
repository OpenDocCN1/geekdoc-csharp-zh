  trans: "\n既然你已经可以声明并组合数字和字符串，现在是时候开始研究方法（methods）了。\n\n方法可以被比作朋友或同事，你根据特定的指令委婉地请求他们执行某项任务，并在需要时返回信息。\n\
    \n例如，你可以这样问你的朋友：“假设我出生于 2000 年，请告诉我我什么时候庆祝庆祝 20 岁生日？”于是，你给了你的朋友（他/她很擅长数学 :-))）一个信息（即出生日期），他/她就会计算出你\
    \ 20 岁生日的年份并将此信息返回给你。换句话说，你的朋友会接收一个输入（即出生日期），他/她会返回一个输出（即你 20 岁生日的年份）。方法的工作原理完全如此：它们接收信息（有时不接收），执行某个操作，然后有时在需要时返回信息。\n\
    \n在编程术语中，方法是一个执行一组操作的指令块。它在从应用程序中调用（或更简单地称为被调用）或在事件发生时执行（例如，当玩家点击按钮时；我们将在下一节中介绍更多关于事件的内容）。和变量一样，方法是可以声明并被调用的。\n\
    \n方法非常有用，因为一旦创建了方法的代码，就可以多次调用，而无需重新编写相同的代码。此外，由于方法可以接收参数，方法可以处理这些参数并相应产生或返回信息；换句话说，它们可以根据输入执行不同的操作并产生不同的输出。因此，方法可以执行以下一项或全部操作：\n\
    \n*   执行操作。\n*   返回结果。\n*   接收参数并处理它们。\n\n方法通常使用两个关键字后面跟着其名称进行如下：\n\n```\naccessType\
    \ typeOfDataReturned nameOfTheFunction (listOfParameters)\n\n{\n    Perform actions\
    \ here\n}\n```\n\n在之前的代码段中：\n\n*   `access type`（访问类型）定义了方法的作用范围，简单来说，就是该方法从哪里可用（或可以被调用）。\n\
    *   返回数据的 `type`（类型）可以是 `void`（不返回数据）或该方法可能返回的任何类型的数据，如整数、`Boolean` 或字符串 `strings`。\n\
    *   上述信息之后是方法的 `name`（名称）。\n*   `list of parameters`（参数列表）如果该方法不接受任何参数，则为空；否则，它包含一个参数列表，每个参数前面都有类型并用逗号分隔；我们稍后会介绍这一点。\n\
    \n使用此模板，我们可以定义如下方法：\n\n```cs\npublic void myMethod ()\n{\n    Console.WriteLine(\"\
    hello\");\n}\n```\n\n在之前的代码中：\n\n*   该方法被声明为 `public`（公共）。\n*   它的返回类型是 `void`，意味着它不返回任何数据。\n\
    *   它不接受任何参数。\n*   调用此方法时，它将向控制台写入 \"hello\" 消息。\n\n可以使用 `()` 运算符调用方法，如下一个代码段所示：\n\
    \n```\nnameOfTheFunction1();\nnameOfTheFunction2(value);\nint test = nameOfFunction3(value);\n\
    ```\n\n在之前的代码中，调用方法是不带参数的（第一行），或带参数的（第二行）。在第三行中，名为 `test` 的变量将被设置为方法 `nameOfFunction3`\
    \ 返回的值，该方法接受一个参数。\n\n让我们创建我们自己的方法：\n\n*   请打开 `Program.cs` 文件，并像下一个代码段所示注释掉你之前的代码；为了加快速度，如果你正在使用\
    \ Visual Studio，可以选择这些行，然后同时按 `CTRL + /`（或 `APPLE + /`）。\n\n```cs\n//Console.WriteLine(\"\
    What is 1 + 1\");\n//string resultAsString = Console.ReadLine();\n//int result\
    \ = Int32.Parse(resultAsString);\n//if (result == 2) Console.WriteLine(\"Well\
    \ done\");\n//else Console.WriteLine(\"Sorry, wrong answer\");\n```\n\n*   然后在\
    \ `Main` 方法中添加以下代码：\n\n```cs\nint myAge = calculateAge(1990);\nConsole.WriteLine(\"\
    My Age is \" + myAge);\n```\n\n在之前的代码中：\n\n*   我们声明了一个名为 `myAge` 的变量。\n*   我们调用了方法\
    \ `calculateAge`，并将数字 `1990` 作为参数传递。\n*   方法返回的信息（或值）存储在变量 `myAge` 中，然后使用显示方法显示。\n\
    \n现在我们可以在 `Main` 方法之后添加以下代码创建一个名为 `calculateAge` 的方法。\n\n```cs\npublic static\
    \ int calculateAge(int yearOfBirth)\n{\n    return (2018 - yearOfBirth);\n}\n\
    ```\n\n在之前的代码中：\n\n*   声明了方法 `calculateAge`；它接受一个名为 `yearOfBirth` 的参数。因此，传递给此方法的任何参数在该方法内部都将被称为\
    \ `yearOfBirth`。\n*   该方法返回减法结果 `2018 – yearOfBirth`。\n*   当调用该方法时，`yearOfBirth`\
    \ 等于 `1990`；因此它将返回 `28`（即 `2018-1990`）。\n\n注意，新方法 `calculateAge` 被声明为 `static`（静态的）；这是因为\
    \ `main` 方法默认是静态的，结果它只能调用同样是静态的方法。如果你忘记将此方法声明为 `static` 并尝试从 `Main` 方法中调用它，系统将生成一条消息，提示“An\
    \ object reference is required for the non-static field, method, or property”（非静态字段、方法或属性需要对象引用）。\n\
    \n变量的作用域\n\n每你在 C# 中创建变量时，都需要意识到它们的作用范围，以便在作用域允许的地方使用它们。当你使用方法时，这一点尤为重要，因为某些变量将在局部使用，而另一些变量将在整个类中使用。\n\
    \n变量的作用域指的是你可以使用该变量的地方。在 C# 中，除了稍后将的访问修饰符，变量可以是成员变量（member variables）或局部变量（local\
    \ variables）。\n\n*   成员变量可以在特定的类中或整个应用程序中使用，取决于它们的访问类型。\n\n虽然成员变量可以在类的开头使用通常的声明语法进行声明，并在前面加上所谓的访问类型（access\
    \ type）（我们稍后会回到这个概念）。然后它们可以在类的任何地方使用（有时也可以在类之外），如下一个代码段所示。\n\n```cs\nclass MainClass\n\
    {\n    public int myVar;\n\n    public void method1()\n    {\n        myVar =\
    \ 0;\n    }\n\n    public void method2()\n    {\n        myVar = myVar + 1;\n\
    \    }\n}\n```\n\n在之前的代码中，成员变量 `myVar` 在类 `MainClass` 的开头声明；它随后在 `method1` 中初始化，并在\
    \ `method2` 中更新。注意，该变量被声明为 `public`，这意味着它不仅在名为 `MainClass` 的整个类中可访问，而且从该类的外部也可以访问。\n\
    \n*   局部变量在特定的方法内部声明（并且应该只在内部使用）；因此得有“局部”一词，因为它们只能在局部使用。\n\n```cs\npublic void\
    \ method1()\n{\n    int myVar;\n    myVar = 0;\n}\n```\n"
- fmt: "\n```java\npublic void method2()\n{\n    int myVar2;\n    myVar2 = 2;\n}\n\
    ```\n\nIn the previous code, `myVar` is a local variable to the method `method1`,\
    \ and can only be used within this method; `myVar2` is a local variable to the\
    \ method `method2`, and can only be used within this method.\n\nNote that it is\
    \ always good to avoid what is called variable masking/shadowing, which occurs\
    \ when you give a local variable the same name as a member variable in the same\
    \ file, as this could lead to confusion.\n\nClasses and member variables can be\
    \ compared to a city with different clubs and societies. The city is made of these\
    \ different clubs. Each club has members. Some of these members can only be accessed\
    \ if you are already part of this specific club where they belong to; other members\
    \ will be available more publically for people who are not part of the same club.\
    \ Because some of these members (for example a treasurer) are very powerful and\
    \ could change significantly the future and safety of the club, you may prefer\
    \ that not everyone outside the club has access to them, as it would mean that\
    \ anyone can ask them to make drastic changes to the club. However, all the club\
    \ members, because they are trusted, could be granted access to this treasurer.\
    \ On the other hand, each club could have a PR person in charge of promoting the\
    \ club. In this case, this member could be made public so that anyone outside\
    \ this club can access them to get information about the club (e.g., opening hours,\
    \ features, etc.).\n\nSo let’s experiment with variables and their scope:\n\n\
    - Please add the following code to the file `Program.cs` (new code in bold).\n\
    \n```csharp\nclass MainClass\n{\n    public static int myMemberVariable;\n\n \
    \   public static void myMethod()\n    {\n        myMemberVariable = 3;\n    \
    \    Console.WriteLine(\"The value of myMemberVariable is \" + myMemberVariable);\n\
    \    }\n\n    public static void Main(string[] args)\n    {\n        myMemberVariable\
    \ = 1;\n        Console.WriteLine(\"The value of myMemberVariable before calling\
    \ the method is \" + myMemberVariable);\n        myMethod();\n    }\n}\n```\n\n\
    In the previous code:\n\n- We declare a member variable called `myMemberVariable`;\
    \ because it is declared outside any method, this variable will be a member variable\
    \ and accessible throughout our class.\n- It is declared as `static` because it\
    \ will be called from the `Main` method which is already static by default; and\
    \ as we already know, a static method should only call a method that is also static.\n\
    - We then call the method `myMethod`.\n- In the method called `myMethod`, we set\
    \ and display the value of the variable `myMemberVariable`.\n- Finally, when the\
    \ application is launched, the `Main` method is called (as it is the point of\
    \ entry of our application),\n- We set the value of the variable `myMemberVariable`\
    \ to `1`, and then call the method `myMethod`.\n\nPlease save your code and run\
    \ your application. You should see a window similar to the following figure:\n\
    \n![image](d2d_images/image000.jpg)\n\nFigure 1-12: Using member variables\n\n\
    ### A few things to remember when you create your applications (checklist)\n\n\
    When you start coding, you will, as for any new activity, make small mistakes,\
    \ learn what they are, improve your coding, and ultimately get better at writing\
    \ your applications. As I have seen in the past with students learning programming,\
    \ there are some common errors that are usually made; these don’t make you a bad\
    \ programmer; on the contrary, it is part of the learning process because we all\
    \ learn by trial and error, and making mistakes is part of the learning process.\n\
    \nSo, as you create your first application, set any fear aside, try to experiment,\
    \ be curious, and get to learn the language. It is like learning a new foreign\
    \ language: when someone from a foreign country understands your first sentences,\
    \ you feel so empowered! So, it will be the same with C#, and to ease the learning\
    \ process, I have included a few tips and things to keep in mind when writing\
    \ your applications, so that you progress even faster. You don’t need to know\
    \ all of these by now (I will refer to these later on, in the next chapter), but\
    \ it is so that you are aware of it and also use this list if any error occurs.\
    \ So, watch out for these: :-\n\n- Each opening bracket has a corresponding closing\
    \ bracket.\n- All variables are written consistently (e.g., spelling and case).\
    \ The name of each variable is case-sensitive; this means that if you declare\
    \ a variable `myvariable` but then refer to it as `myVariable` later on in the\
    \ code, this may trigger an error, as the variable `myVariable` and `myvariable`,\
    \ because they have a different case (upper-case V), are seen as two different\
    \ variables.\n- As much as possible, declare a variable prior to using it (e.g.,\
    \ `int myVar`).\n- For each variable name, all words (except for the first word)\
    \ have a capitalized initial. This is not a strict requirement, however, it will\
    \ make your code more readable.\n- For each method, all words (except for the\
    \ first word) have a capitalized initial. This is not a strict requirement; however,\
    \ it will make your code more readable.\n- All statements are ended with a semi-colon.\n\
    - For `if` statements the condition is within round brackets.\n- For `if` statements\
    \ the condition uses the syntax `==` rather than `=`.\n- When calling a method,\
    \ the exact name of this method (i.e., case-sensitive) is used.\n- When referring\
    \ to a variable, it is done with regards to the scope of the variable (e.g., call\
    \ local variables locally).\n- Local variables are declared and used within the\
    \ method.\n- Member variables are declared outside methods and can be used throughout\
    \ the class.\n\n### Best practices\n\nWhen you start coding, you will, as for\
    \ any new activity, make small mistakes, learn what they are, improve your coding,\
    \ and ultimately get better at writing your applications. As I have seen in the\
    \ past with students learning programming, there are some common errors that are\
    \ usually made; these don’t make you a bad programmer; on the contrary, it is\
    \ part of the learning process because we all learn by trial and error, and making\
    \ mistakes is part of the learning process. The next list identifies the errors\
    \ my students often come across when they start C#.\n\n#### Variable naming\n\n\
    - Use meaningful names that you can understand, especially after leaving your\
    \ code for two weeks.\n- `string myName = \"Patrick\"` // GOOD\n- `string b =\
    \ \"Patrick\"` // NOT GOOD\n\n- Capitalize the initial of all words in the name,\
    \ except for the first word.\n- `bool testIfNameIsCorrect = true;` // GOOD\n-\
    \ `bool testiftameiscorrect = true;` // NOT GOOD\n\n#### Methods\n\n- Use unique\
    \ (i.e., different) names (for member and local variables).\n- Check that all\
    \ opening brackets have a corresponding closing bracket.\n- Indent your code.\n\
    - Comment your code as much as possible to explain how it works.\n\n––––––––\n\
    \n![image](d2d_images/scene_break.png)\n\n## Level roundup\n\nSummary\n\nIn this\
    \ chapter, we have managed to create your very first applications. You have become\
    \ more comfortable with the creation of variables and methods, as well as the\
    \ display of information through the console window. Finally, you also learned\
    \ how to employ conditional statements so that processing can be performed based\
    \ on specific conditions. Building on this knowledge, you created simple programs\
    \ where the user enters information and where the program computes and outputs\
    \ a result accordingly. So we have covered some significant ground here from no\
    \ knowledge of C# to creating your first application: well done!\n\nQuiz\n\nIt\
    \ is now time to test your knowledge. Please specify whether the following statements\
    \ are TRUE or FALSE. The answers are available on the next page.\n\n1. The main\
