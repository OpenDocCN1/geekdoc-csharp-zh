    ## 条件语句


    虽然我们已经查看了数字或文本等简单变量，以及如何通过运算符来修改它们，但现在我们来查看条件语句。


    条件语句是根据条件执行的语句，因此得此名。它们的语法通常如下：


    `if (condition) statement;`


    这意味着如果条件通过验证（或为真），则（且仅在在这种情况下）执行该语句。当我们评估一个条件时，我们是在测试一个声明（或语句）是否为真。


    例如，通过输入 `if (a == b)`，我们的意思是“如果 a 等于 b 是真的”。同样地，如果我们输入 `if (a>=b)`，我们的意思是“如果 a
    等于或大于 b 是真的”。


    正如我们后面将看到的，我们还可以组合条件。例如，我们可以决定在两个（或多个）条件均真时执行某条语句。例如，通过输入 `if (a == b && c ==
    2)`，我们的意思是“如果 a 等于 b 且 c 等于 2”。在这种情况下，使用运算符 `&&` 表示“与”（AND），即两个条件都必须为真。我们可以将其此比为决定明天是否去航海。


    例如，我们可以将句子“如果天气晴朗且风速小于 5km/h，我将去航海”翻译如下：


    ```cs

    if (weatherIsSunny == true && windSpeed < 5) IGoSailing = true;

    ```


    在创建条件时，就像大多数自然语言一样，我们可以使用表示为 `||` 的或逻辑运算符。参考前面的例子，我们可以将句子“如果天气太热或风速超过 5km/h，我就不去航海”翻译如下：


    ```cs

    if (weatherIsTooHot == true || windSpeed > 5) IGoSailing = false;

    ```


    另一个例子如下。


    ```cs

    if (myName == "Patrick") alert("Hello Patrick");

    else alert ("Hello Stranger");

    ```


    在上一段代码中，如果变量 `myName` 等于 "Patrick"，我们就显示文本 "Hello Patrick"；否则，我们显示消息 "Hello Stranger"。


    当我们评估真和假条件时，我们实际上在应用所谓的“布尔逻辑”（Boolean logic）。布尔逻辑处理具有两个值 1 和 0（或真和假）的布尔数。通过评估条件，我们实际上在处理布尔数并应用布尔逻辑。虽然你不需要深入了解布尔逻辑，但某些布尔逻辑运算符是非常重要的，包括
    `!` 运算符。它表示“非”（NOT）或“相反”。这意味着如果一个变量为真，它的相反则为假，反之亦然。例如，如果我们考虑变量 `weatherIsGood
    = true`，则 `!weatherIsGood` 的值将为假（它的相反面）。因此，条件 `if (weatherIsGood == false)` 也可以写成
    `if (!weatherIsGood)`，其字面意思是“如果天气不不好”。


    让我们实验一下条件语句：


    *   请打开 `Program.cs` 文件。

    *   在 `Main` 方法末添加以下代码（加粗部分为新代码）：


    ```cs

    Console.WriteLine("My age is " + age);

    Console.WriteLine("Please enter your name: ");

    string nameOfUser = Console.ReadLine();

    if (nameOfUser == "Patrick") Console.WriteLine("Hello Patrick");

    else Console.WriteLine("Hello Stranger");

    ```


    在上一段代码中：


    *   我们写了一条要求用户输入名字的消息。

    *   我们声明了变量 `nameOfUser`。该变量将包含用户输入的答案（一个字符串）。

    *   我们使用 `Console.ReadLine` 方法存储名称，这是 C# 提供的一个方法，用于读取用户输入的文本（在用户按下回车键后）。

    *   一旦用户输入了名字，它就会存储在变量 `nameOfUser` 中。

    *   我们随后根据 `nameOfUser` 的值执行语句。


