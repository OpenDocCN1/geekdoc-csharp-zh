    ### Credits


    Author: Patrick Felicia.


    Patrick Felicia is a lecturer and researcher at Waterford Institute of Technology,
    where he teaches and supervises undergraduate and postgraduate students. He obtained
    his MSc in Multimedia Technology in 2003 and PhD in Computer Science in 2009 from
    University College Cork, Ireland. He has published several books and articles
    on the use of video games for educational purposes, including the Handbook of
    Research on Improving Learning and Motivation through Educational Games: Multidisciplinary
    Approaches (published by IGI), and Digital Games in Schools: a Handbook for Teachers,
    published by European Schoolnet. Patrick is also the Editor-in-chief of the International
    Journal of Game-Based Learning (IJGBL), and the Conference Director of the Irish
    Symposium on Game-Based Learning, a popular conference on games and learning organized
    throughout Ireland. He has also published books on coding with C# through the
    creation of games.


    ### Books from the same author


    * [JavaScript from Zero to Proficiency (Beginner)](https://books2read.com/u/m2veDd):
    In this book, you will become more comfortable with JavaScript even if you have
    never coded before. This book will teach you how to code from scratch, explain
    programing principles such as `variables`, `methods`, `statements`, and much more.
    You will also learn how JavaScript can be used to add interaction to web pages
    using events, the `DOM`, and other key JavaScript concepts using a step-by-step
    method.

    * [Unity 5 from Zero to Proficiency (Foundations):](https://books2read.com/u/bQ0r64)
    In this book, you will become more comfortable with Unity''s interface and its
    core features by creating a project that includes both an indoor and an outdoor
    environment. This book only covers drag and drop features, so that you are comfortable
    with Unity''s interface before starting to code (in the next book). After completing
    this book, you will be able to create outdoors environments with terrains and
    include water, hills, valleys, sky-boxes, use built-in controllers (`First- and
    Third-Person controllers) to walk around the 3D environment and also add and pilot
    a car and an aircraft.


    ### Support and Resources for this Book


    A companion website has been set-up for this book, where you can download the
    full project for this book, with all the code throughout the book, so that you
    can check your own code, along with the code solutions for the challenges provided
    in each chapter.


    To avail of this content, you can open the following link:


    [http://learncsharpforbeginners.wordpress.com/](http://learncsharpforbeginners.wordpress.com/)


    This site also provides you with the opportunity to subscribe to a my mailing
    list and receive:

    * your book in the pdf format (FREE copy) so that you can open it on any computer.

    * regular updates and tutorials on C#.

    * coupons to receive more than 30% discounts on some of my books.


    This book is dedicated to Mathis & Helena


    ![image](d2d_images/scene_break.png)


    # Preface


    This book is part of a series entitled C# from Zero to Proficiency. In this book
    series, you have the opportunity to learn C# programming from scratch and to become
    proficient in this popular programming language.


    In this book entitled "C# from Zero to Proficiency (Introduction)" you will discover
    how to quickly get started with C#; you will learn about how to use `variables`,
    `methods`, `conditional statements` and you will also write your own code.


    ## What you Need to Use this Book


    To complete the project presented in this book, you only need an Integrated Development
    Environment such as `Visual Studio Community`.


    In terms of computer skills, all the knowledge introduced in this book will assume
    no prior programming experience from the reader. Although this book includes programming,
    you will be guided step-by-step. So for now, you only need to be able to perform
    common computer tasks such as typing, and opening and saving files.


    ## Who this Book is for


    If you can answer yes to all these questions, then this book is for you:

    * Are you a total beginner in C# programming?

    * Would you like to get started fast with C# concepts?

    * Although you may have had some prior exposure to C#, would you like to delve
    more into C#?


    If you can answer yes to all these questions, then this book is not for you:

    * Can you already easily code in C#?

    * Are you looking for a reference book on C#?

    * Are you an experienced (or at least advanced) C# programmer?


    If you can answer yes to these three questions, you may instead look for other
    books in this series. To see the content and topics covered by these books, you
    can check the official website: http://www.learncsharpforbeginners.wordpress.com.


    ## Improving the Book


    Although great care was taken in checking the content of this book, I am human,
    and some errors could remain in the book. As a result, it would be great if you
    could let me know of any issue or error you may have come across in this book,
    so that it can be solved and the book updated accordingly. To report an error,
    you can email me (`learncsharpforbeginners@gmail.com`) with the following information:

    * Name of the book.

    * The page where the error was detected.

    * Describe the error and also what you think the correction should be.


    Once your email is received, the error will be checked, and, in the case of a
    valid error, it will be corrected and the book page will be updated to reflect
    the changes accordingly.


    ## Supporting the Author


    A lot of work has gone into this book and it is the fruit of long hours of preparation,
    brainstorming, and finally writing. As a result, I would ask that you do not distribute
    any illegal copies of this book.


    If some of your friends are interested in the book, you can refer them to the
    book’s official website ([http://www.learncsharpforbeginners.wordpress.com/](http://www.learncsharpforbeginners.wordpress.com/))
    where they can either buy the book, enter a monthly draw to be in for chance of
    receiving a free copy of the book, or to be notified of future promotional offers.


    # 1 Introduction to C# programming


    * What is C#

    * Choosing a code editor

    * Installing Visual Studio

    * Creating your first application

    * Introduction to C# syntax

    * Statements

    * Comments

    * Variables

    * Using variables

    * Operators

    * Conditional statements

    * Methods

    * Scope of variables

    * A few things to remember when you create your applications (checklist)

    * Best practices

    * Level roundup


    # 2 Thank you


