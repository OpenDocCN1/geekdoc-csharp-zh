    In the previous code, myVar is a local variable to the method method1, and can
    only be used within this method; myVar2 is a local variable to the method method2,
    and can only be used within this method.


    Note that it is always good to avoid what is called variable masking/shadowing,
    which occurs when you give a local variable the same name as a member variable
    in the same file, as this could lead to confusion.


    Classes and member variables can be compared to a city with different clubs and
    societies. The city is made of these different clubs. Each club has members. Some
    of these members can only be accessed if you are already part of this specific
    club where they belong to; other members will be available more publically for
    people who are not part of the same club. Because some of these members (for example
    a treasurer) are very powerful and could change significantly the future and safety
    of the club, you may prefer that not everyone outside the club has access to them,
    as it would mean that anyone can ask them to make drastic changes to the club.
    However, all the club members, because they are trusted, could be granted access
    to this treasurer. On the other hand, each club could have a PR person in charge
    of promoting the club. In this case, this member could be made public so that
    anyone outside this club can access them to get information about the club (e.g.,
    opening hours, features, etc.).


    So let’s experiment with variables and their scope:


    *   Please add the following code to the file Program.cs (new code in bold).


    class MainClass


    {


    public static int myMemberVariable;


    public static void myMethod()


    {


    myMemberVariable = 3;


    Console.WriteLine("The value of myMemberVariable is " + myMemberVariable);


    }


    public static void Main(string[] args)


    {


    myMemberVariable = 1;


    Console.WriteLine("The value of myMemberVariable before calling the method is
    " + myMemberVariable);


    myMethod();


    In the previous code:


    *   We declare a member variable called myMemberVariable; because it is declared
    outside any method, this variable will be a member variable and accessible throughout
    our class.


    *   It is declared as static because it will be called from the Main method which
    is already static by default; and as we already know, a static method should only
    call a method that is also static.


    *   We then call the method myMethod.


    *   In the method called myMethod, we set and display the value of the variable
    myMemberVariable.


    *   Finally, when the application is launched, the Main method is called (as it
    is the point of entry of our application),


    *   We set the value of the variable myMemberVariable to 1, and then call the
    method myMethod.


    Please save your code and run your application. You should see a window similar
    to the following figure:


    ![image](d2d_images/image000.jpg)


    Figure 1-12: Using member variables


    .


    A few things to remember when you create your applications (checklist)


    When you start coding, you will, as for any new activity, make small mistakes,
    learn what they are, improve your coding, and ultimately get better at writing
    your applications.  As I have seen in the past with students learning programming,
    there are some common errors that are usually made; these don’t make you a bad
    programmer; on the contrary, it is part of the learning process because we all
    learn by trial and error, and making mistakes is part of the learning process.


    So, as you create your first application, set any fear aside, try to experiment,
    be curious, and get to learn the language. It is like learning a new foreign language:
    when someone from a foreign country understands your first sentences, you feel
    so empowered! So, it will be the same with C#, and to ease the learning process,
    I have included a few tips and things to keep in mind when writing your applications,
    so that you progress even faster. You don’t need to know all of these by now (I
    will refer to these later on, in the next chapter), but it is so that you are
    aware of it and also use this list if any error occurs. So, watch out for these:
    :-)


    •  Each opening bracket has a corresponding closing bracket.


    •  All variables are written consistently (e.g., spelling and case). The name
    of each variable is case-sensitive; this means that if you declare a variable
    myvariable but then refer to it as myVariable later on in the code, this may trigger
    an error, as the variable myVariable and myvariable, because they have a different
    case (upper-case V), are seen as two different variables.


    •  As much as possible, declare a variable prior to using it (e.g., int myVar).


    •  For each variable name, all words (except for the first word) have a capitalized
    initial. This is not a strict requirement, however, it will make your code more
    readable.


    •  For each method, all words (except for the first word) have a capitalized initial.
    This is not a strict requirement; however, it will make your code more readable.


    •  All statements are ended with a semi-colon.


    •  For if statements the condition is within round brackets.


    •  For if statements the condition uses the syntax "==" rather than "=".


    •  When calling a method, the exact name of this method (i.e., case-sensitive)
    is used.


    •  When referring to a variable, it is done with regards to the scope of the variable
    (e.g., call local variables locally).


    •  Local variables are declared and can be used within the same method.


    •  Member variables are declared outside methods and can be used anywhere within
    a class.


    ## Best practices


    As you will start your journey through C# coding, you may sometimes find it difficult
    to interpret the errors produced by the browser. However, after some practice,
    you will manage to recognize them, to understand (and also avoid) them, and to
    fix them accordingly. The next list identifies the errors that my students often
    come across when they start coding in C#.


    Variable naming


    *   Use meaningful names that you can understand, especially after leaving your
    code for two weeks.


    string myName = "Patrick";//GOOD


    string b = "Patrick";//NOT SO GOOD


    *   Capitalize the initial of all words in the name, except for the first word.


    bool testIfTheNameIsCorrect = true;// GOOD


    bool testifthenameiscorrect = true; // NOT SO GOOD


    Methods


    *   Use unique (i.e., different) names (for member and local variables).


    *   Check that all opening brackets have a corresponding closing bracket.


    *   Indent your code.


    *   Comment your code as much as possible to explain how it works.


    ––––––––


    ![image](d2d_images/scene_break.png)


    ## Level roundup


    Summary


    In this chapter, we have managed to create your very first applications. You have
    become more comfortable with the creation of variables and methods, as well as
    the display of information through the console window. Finally, you also learned
    how to employ conditional statements so that processing can be performed based
    on specific conditions. Building on this knowledge, you created simple programs
    where the user enters information and where the program computes and outputs a
    result accordingly. So we have covered some significant ground here from no knowledge
    of C# to creating your first application: well done!


    Quiz


    It is now time to test your knowledge. Please specify whether the following statements
    are TRUE or FALSE. The answers are available on the next page.


    1.  The main point of entry in a C# program is the method called Main.


    2.  The Main method is usually public so that it can be called from outside your
    application.


    3.  The Main method is usually declared as static.


    4.  The command Console.WriteLine displays information in the Console window.


    5.  Console.ReadLine records information entered by the user in the Console window.


    6.  In C# text values are surrounded by double quotes.


    7.  In C# a local variable can only be used in the method where it was initially
    defined.'
