  trans: "\n\n*   第一章，C# 编程简介 介绍了通用的编程概念，包括 C# 语法、变量和方法。在本章中，你将开始创建你的第一个应用程序，并结合变量和方法。\n\
    *   第二章总结了本书涵盖的主题，并为你提供有关后续待办步骤的更多信息。\n\n## 使用本书所需的准备工作\n\n为了完成书中介绍的项目，你只需要安装\
    \ `Visual Studio`（例如，`Visual Studio Community`）。在计算机技能方面，书中介绍的所有知识都假设读者之前没有编程经验。因此，现在你只需要能够执行常见的计算机任务，例如下载项目、打开和保存文件、熟练地使用拖放功能以及打字。\n\
    \n## 本本书适合哪些读者\n\n如果你对以下所有问题都回答为“是”，那么这本书就是为你准备的：\n\n1.  你想学习如何用 `C#` 编写代码吗？\n\
    2.  你想要知道如何使用 `C#` 创建简单的命令行程序吗？\n3.  你想要发现更多 `C#` 特性吗？\n4.  虽然你可能之前接触过一些 `C#`，但你想要更深入对象面向对象的编程吗？\n\
    \n## 这本书不适合谁\n\n如果你对以下所有问题都回答为“是”，那么这本书并不适合你：\n\n1.  你已经可以编写自己的 `C#` 代码了吗？\n2.\
    \  你正在寻找一本关于 `C#` 编程的参考书吗？\n3.  你是一个专业的 `C#` 开发人员吗？\n\n如果你对这三个问题都回答为“是”，你也可以寻找[官方网站\
    \ (http://www.learncsharpforbeginners.wordpress.com)](http://www.learncsharpforbeginners.wordpress.com/)\
    \ 上的该系列其他书籍。\n\n## 你将如何从书中学习\n\n由于所有学生的学习方式不同，且对课程的期望也不同，本书的设计旨在确保所有读者都能找到适合自己的学习模式。因此，它包含了以下内容：\n\
    \n*   每章开头列有学习目标列表，让读者对将涵盖的技能有一个直观的了解。\n*   每个章节都包含涵盖活动的概述。\n*   许多活动都是循序渐进的，学习者还可以通过每章末尾提供的挑战，获得参与深层学习和解决问题的机会。\n\
    *   每章最后都以测验和挑战结束，你可以通过这些对自己的技能（以及获得的知识）进行测试。挑战包括根据你在本章中学的知识进行编码、调试或创建新功能。\n*\
    \   本书侧重于所需的核心技能。虽然某些章节会得更详细，但在解释概念后，必要时会提供额外资源的链接。\n*   代码是循序渐进引入的，并进行了详细解释。\n\
    *   你还可以访问几个视频，帮助你不断进步，特别是对于最具挑战性的主题。\n\n## 每章节的格式和写作规范\n\n在本书中，为了让阅读和学习更加容易，将使用文本格式和图标来突出所提供的信息部分，并使书籍易读。\n\
    \n### 特别说明\n\n每章都包含资源章节，以便你进一步理解和掌握 `C#`；这些包括：\n\n*   每章一个测验：这些测验通常包含 10 个问题，测试你对整章涵盖主题的知识掌握。答案在配套网站上提供。\n\
    *   清单：它由 5 到 10 个关键概念和技能组成，在进入下一章之前，你需要对这些内容熟练。\n*   挑战：每章都包含一个挑战章节，要求你结合技能来解决特定问题。\n\
    \n作者注释显示所示：\n\n作者的建议出现在此框中。\n\n代码显示所示：\n\n```assembly\npublic int score;\n\npublic\
    \ string playersName = \"Sam\";\n```\n\n包含本章涵盖涵盖要点的清单显示所示：\n\n| ![`cdn2.hubspot.net/hub/377822/file-809787244-png/checklist.png?t=1421359715283`](img/image004.png)\
    \ |  |\n| :--- | :--- |\n| * 清单项目 1。 | |\n| * 清单项目 2。 | |\n| * 清单项目 3。 | | |\n\
    \n## 你如何从从书中学习得最好？\n\n*   **向你的朋友讲述你正在做的事情。**\n我们通常认为自己理解了一个主题，直到我们向朋友解释它并回答他们的问题。通过解释你不同的项目，你刚刚学到的东西对你来说会变得更加。\n\
    *   **做练习。**\n    所有章节都包含练习，将帮助你通过实践来学习。换句话说，通过完成这些练习，你能够更好地理解这些主题并获得实践技能（而不是仅仅是阅读）。\n\
    *   **不要害怕犯。**\n    我通常告诉我的学生，犯错是学习过程的一部分；犯的错越多，学习的机会就越多。在开始时，你可能会发现错误具有挑战性，或者你发现你的应用程序没有按照预期运行，直到你明白哪里出了问题。\n\
    *   **挑战自我。**\n    所有章节都包含一个挑战章节，你可以决定接受某个特定挑战来提高你的水平或技能。这些挑战是为了让你进行创造性思考，并应用你在本章中获得的知识。\n\
    *   **分块学习。**\n    一次性读五六章是有挑战性的，这可能会降低你的动力。相反，给自己留出足够的时间，按照自己的节奏以小单位学习（例如，每天\
    \ 15 到 20 分钟）。这至少能为你做两件事：让你的大脑有时间消化刚刚学习的信息，以便第二天重新开始。它还能确保你不会精疲力竭，并保持你的动力水平。\n\
    \n## 反馈\n\n虽然我已经尽可能编写一本高质量且有价值的书，但我一直感谢读者的反馈，以便相应改进书籍。如果你想对本书提供反馈，可以发送邮件给 learncsharpforbeginners@gmail.com。\n\
    \n## 改进书籍\n\n尽管在检查书籍内容时非常小心，但我也是人，书中可能仍存在一些错误。因此，如果你在书中发现任何问题或错误，请告诉我，以便解决这些问题并相应地更新书籍。要报告错误，你可以发送邮件给我\
    \ (learncsharpforbeginners@gmail.com) 并提供以下信息：\n\n*   书名。\n*   发现错误的页面或章节。\n*\
    \   描述错误以及你认为修正应该是怎样的。\n\n收到你的邮件后，将对错误进行检查，如果是有效错误，将进行修正并更新书籍以反映这些更改。\n\n## 支持作者\n\
    \n本书投入了大量工作，它是长时间准备、头脑风暴和最终写作的结晶。因此，我请求你不要分发本书的非法副本。\n\n这意味着如果你的朋友想要一本书的副本，他们必须通过官方渠道或书籍的官方网站购买：\n\
    \n[`www.learncsharpforbeginners.wordpress.com/`](http://www.learncsharpforbeginners.wordpress.com/)。\n\
    \n"
- fmt: "\nIf some of your friends are interested in the book, you can refer them to\
    \ the book’s official website [http://www.learncsharpforbeginners.wordpress.com](http://www.learncsharpforbeginners.wordpress.com/)\
    \ where they can either buy the book, or join the mailing list to be notified\
    \ of future promotional offers or enter a monthly draw and be in for a chance\
    \ to receive a free copy of the book.\n\n| ![image](d2d_images/chapter_title_corner_decoration_left.png)\
    \ | | ![image](d2d_images/chapter_title_corner_decoration_right.png) |\n\n![image](d2d_images/chapter_title_above.png)\n\
    \n# 1 Introduction to C# programming\n\n![image](d2d_images/chapter_title_below.png)\n\
    \nIn this section, we will go through an introduction to C# programming and look\
    \ at key aspects that you will need for your games, including:\n\n* C# syntax.\n\
    * Variable types and scope.\n* Methods.\n\nSo, after completing this chapter,\
    \ you will be able to:\n* Understand key concepts related to C# programming.\n\
    * Understand the concepts of variables and methods.\n* Create and use your own\
    \ methods.\n\nThe code solutions for this chapter are included in the resource\
    \ pack that you can download by following the instructions included in the section\
    \ entitled \"Support and Resources for this Book\".\n\n## What is C#\n\nC# is\
    \ an object-oriented language developed by Microsoft and has been used, in many\
    \ cases, to develop desktop applications. As it is part of the `.NET` framework,\
    \ it is also used for web development and apps. The fact that it is an object-oriented\
    \ programming language means that a C# programme consists of a collection of objects\
    \ that interact with each other.\n\nC# is used for many applications, including\
    \ the creation of games, especially with the software Unity.\n\n## Choosing a\
    \ code editor\n\nIn the next sections, you will start to write your own C# code.\
    \ For this purpose, you will need to use a code editor, and more specifically,\
    \ an Integrated Development Environment (IDE). These IDEs include all the necessary\
    \ tools to compile and execute your code.\n\nUsing an Ide will provide you with\
    \ an easier way to create, organize and check your code, with some of the following\
    \ features:\n* Text highlighting: so that your code is clearer to read and to\
    \ modify.\n* Auto-completion: so that you don’t have to remember the name of all\
    \ the variables in your code, or the name of some common methods.\n* Error highlighting:\
    \ so that some obvious errors are highlighted before you even test your code.\n\
    \nThere are many free IDEs available with their advantages and drawbacks, including:\n\
    * Visual Studio Code.\n* Visual Studio Community.\n* MonoDevelop.\n* NetBeans.\n\
    * #Develop.\n* Rider.\n\nAll these IDEs considered, we will be using Visual Studio\
    \ Community for this book (although you could use any of the other IDEs if you\
    \ wish).\n\nYou can download Visual Studio Community from the following site:\
    \ [https://visualstudio.microsoft.com/free-developer-offers/](https://visualstudio.microsoft.com/free-developer-offers/)\n\
    \n––––––––\n\n![image](d2d_images/scene_break.png)\n\n## Installing Visual Studio\n\
    \nPlease download Visual Studio from the official site and follow the instructions;\
    \ you should be able to download and install a version for Windows or Mac OS from\
    \ the following site: [https://visualstudio.microsoft.com/free-developer-offers/](https://visualstudio.microsoft.com/free-developer-offers/)\n\
    \n## Creating your first application\n\nAfter this brief introduction, it is now\
    \ your turn to code.\n\nSo that you get to experiment with your C# code, please\
    \ do the following after installing Visual Studio:\n* Please launch VS (Visual\
    \ Studio).\n* From the main window, select the button labelled \"New Project\"\
    , as illustrated in the next figure.\n\n![image](d2d_images/image012.jpg)\nFigure\
    \ 1-1: Creating your project\n\n* In the new window, select the option Other >\
    \ .NET > Console Project (C#), as illustrated in the next figure:\n![image](d2d_images/image008.jpg)\n\
    Figure 1-2: Creating a Console Project\n\n* By choosing this option, you specify\
    \ that you will build a project that will be executed in the console window.\n\
    * Please click on the button labelled \"Next\".\n* In the next window, enter the\
    \ name and location of your new project (for example `myFirstproject`), as illustrated\
    \ in the next figure.\n\n![image](d2d_images/image011.jpg)\nFigure 1-3: Setting-up\
    \ your Project\n\n* Click on the button labelled \"Create\".\n\nOnce this is done\
    \ Visual Studio (VS) will create all the necessary folders for your project and\
    \ the code editor should open as follows.\n\n![image](d2d_images/image013.jpg)\n\
    Figure 1-4: Your first code\n\nBy default, you will see that some code has already\
    \ been created for you, as follows:\n\n```csharp\nusing System;\n\nnamespace myFirstProject\n\
    {\n\nclass MainClass\n{\npublic static void Main(string[] args)\n{\nConsole.WriteLine(\"\
    Hello World!\");\n}\n\n}\n\n}\n```\n\nIn the previous code:\n* We declare that\
    \ we will be using the library (or path) called `System`. This is so that we can\
