  raw: 'Now that you can declare and combine numbers and strings, it is a good time
    to start looking into methods.


    Methods can be compared to a friend or a colleague to whom you gently ask to perform
    a task, based on specific instructions, and to return information afterwards,
    if need be.


    For example, you could ask your friend the following: "Can you please tell me
    when I will be celebrating my 20th birthday given that I was born in 2000". So
    you give your friend (who is good at Math :-)) the information (i.e., the date
    of birth) and s/he will calculate the year of your 20th birthday and give this
    information back to you. So in other words, your friend will be given an input
    (i.e., the date of birth) and s/he will return an output (i.e., the year of your
    20th birthday). Methods work exactly this way: they are given information (and
    sometimes not), perform an action, and then sometimes, if needed, return information.


    In programming terms, a method is a block of instructions that performs a set
    of actions.  It is executed when invoked (or put more simply called) from the
    application, or when an event occurs (e.g., when the player has clicked on a button;
    we will see more about events in the next section). As with variables, methods
    are declared and can also be called.


    Methods are very useful because once the code for a method has been created, it
    can be called several times without the need to rewrite the same code all over
    again. Also, because methods can take parameters, a method can process these parameters
    and produce or return information accordingly; in other words, they can perform
    different actions and produce different outputs based on the input. As a result,
    methods can do one or all of the following:


    •  Perform an action.


    •  Return a result.


    •  Take parameters and process them.


    A method is usually declared using two keywords followed by its name as follows:


    accessType typeOfDataReturned nameOfTheFunction (listOfParameters)


    {


    Perform actions here


    }


    In the previous snippet:


    *   The access type defines the scope of the method or, put simply, from where
    this method will be available (or can be called).


    *   The type of the data returned can be: void (no data is returned) or any type
    of data that this method could return such as integers, Boolean, or strings.


    *   The previous information is then followed by the name of the method.


    *   The list of parameters can be empty, if this method does not take any parameter.
    Otherwise, it includes a list of parameters preceded by their type and separated
    by a comma; we will cover this aspect later.


    Using this template, we could, for example, define the following method:


    public void myMethod ()


    {


    Console.WriteLine("hello");


    }


    In the previous code:


    *   The method is declared as public.


    *   Its return type is void, which means that it does not return any data.


    *   It takes no parameters.


    *   When called this method will write the message "hello" to the console.


    A method can be called using the () operator, as illustrated in the next code
    snippet:


    nameOfTheFunction1();


    nameOfTheFunction2(value);


    int test = nameOfFunction3(value);


    In the previous code, a method is called with no parameter (first line), or with
    a parameter (second line). On the third line, a variable called test will be set
    with the value returned by the method nameOfFunction3 which takes one parameter.


    Let’s create our very own method:


    *   Please open the file Program.cs, and comment your previous code as in the
    next code snippet; to speed up things, and if you are working with Visual Studio,
    you can select these lines and then press simultaneously CTRL + / (or APPLE +
    /).


    //Console.WriteLine("What is 1 + 1");


    //string resultAsString = Console.ReadLine();


    //int result = Int32.Parse(resultAsString);


    //if (result == 2) Console.WriteLine("Well done");


    //else Console.WriteLine("Sorry, wrong answer");


    *   Then add the following code to the Main method:


    int myAge = calculateAge(1990);


    Console.WriteLine("My Age is " + myAge);


    }


    In the previous code:


    *   We declare a variable called myAge.


    *   We call the method calculateAge, passing the number 1990 as a parameter.


    *   The information (or value) returned by the method is stored in the variable
    myAge and then displayed using the alert method.


    We can now create the method called calculateAge by adding the following code
    after the method Main.


    public static int calculateAge(int yearOfBirth)


    {


    return (2018 - yearOfBirth);


    }


    In the previous code:


    *   The method calculateAge is declared; it takes one parameter called yearOfBirth.
    So any parameter passed to this method will be referred as yearOfBirth within
    this method.


    *   This method returns the result of the subtraction 2018 – yearOfBirth.


    *   When the method is called, yearOfBirth is equal to 1990; so it will return
    28 (i.e., 2018-1990).


    Note that the new method called calculateAge is declared as static; this is because,
    the method main is static by default, and that as a result, it can only call a
    method that is also static. If you forget to declare this method as static and
    try to call it from the Main method, the system will generate a message saying
    "An object reference is required for the non-static field, method, or property".


    The Main method is static because it is the entry point of the programme, and
    it is the first method to be called (or invoked) when the application is started.
    It is public because it needs to be accessible from outside the application. Its
    return type is void because it usually doesn''t return any data. It includes parameters
