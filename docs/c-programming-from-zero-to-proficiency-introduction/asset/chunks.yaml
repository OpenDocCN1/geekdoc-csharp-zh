    ## 变量


    现在你对语句和注释有了进一步的了解，我们将开始学习更多变量。变量在 C# 中非常重要，因为你可能会在大多数程序中用它们来进行计算或处理文本。


    ### 什么是变量？


    变量可以比作一个容器，其中包含一个可能随时间改变的值。使用变量时，我们通常需要：(1) 通过指定类型来声明变量，(2) 为此变量赋值，以及(3) 可能使用操作符将此变量与其他变量结合，如下一个代码段所示。


    ```c

    int myAge;//我们声明了变量 myAge


    myAge = 20;//我们将变量 myAge 设置为 20


    myAge = myAge + 1; //我们给变量 myAge 加了 1

    ```


    在在上的示例中，我们声明了一个名为 `myAge` 的变量，它的类型是 `int`（即整数）。我们在这个变量中保存了值 `20`，然后对其加了 `1`。


    注意，在 C# 中，变量是使用其类型后跟名称声明的。正如我们后面看到的，我们还需要使用所谓的“访问修饰符”来指定如何以及从哪里访问此变量。


    同样注意，在之前的代码中，我们将值 `myAge + 1` 赋值给变量 `myAge`；`=` 运算符是一个赋值运算符；换句话说，它是为了给变量赋值，而不应从严格的代数意义上理解（即
    `=` 两侧的值或变量必须相等）。


    为了让 C# 编码更简单更简洁，你可以在一个语句中声明多个相同类型的变量。例如，在下一个代码段中，我们在一个语句中声明了三个变量 `v1`、`v2` 和 `v3`。这是因为它们是相同类型（即整数）。


    ```c

    int v1,v2,v3;


    int v4=4, v5=5, v6=6;

    ```


    在上面的代码中，第一行声明了变量 `v1`、`v2` 和 `v3`。三个变量都是整数。在第二行代码中，我们不仅同时声明了三个变量，还通过为这些变量设置值来初始化它们。


    使用变量时，有几点我们需要确定，包括它们的名称、类型和作用域：


    *   **变量名称**：变量通常被赋予一个唯一的名称，以便于识别和唯一标识。变量的名称通常称为“标识符”。在定义标识符时，它可以包含字母、数字、减号、下划线或美元符号，并且通常以字母开头。标识符不能是关键字（例如，关键字
    `if` 不能作为标识符）。

    *   **变量类型**：变量可以持有多种类型的数据，包括数字（例如整数、double 或浮点数）、文本（例如字符串或字符）、布尔值（例如 true 或 false）、数组或对象（我们将在本章稍晚些部分介绍数组的概念）。


    ```csharp

    string myName = "Patrick";//文本使用双引号声明


    int currentYear = 2017;//年份不需要小数，且被声明为整数


    float width = 100.45f;//宽度被声明为浮点数 float（即带有小数的）

    ```


    *   **变量声明**：需要声明变量，这样当你在代码中使用此变量时，系统才知道知道你指的是什么。使用变量的第一步是声明或定义此变量。在声明阶段，变量不需要赋值，因为这可以在以后完成。在接下来的示例中，我们声明了一个名为
    `myName` 的变量，然后给它赋值为 `"My Name"`。


    ```csharp

    string myName;


    myName = "My Name"

    ```


    *   **变量作用域**：变量可以在特定的范围内访问，这取决于变量最初在应用程序中声明的位置。我们稍后会研究这个概念。

    *   **可访问级别**：正如我们后面看到的，一个 C# 程序由类组成；对于这些类中的每一个，内部的方法和变量可以根据它们的访问级别进行访问，我们稍后会研究这一原则。


    常见的变量类型包括：


    *   **String**：同文本。

    *   **Int**：整数 (1, 2, 3)。

    *   **Boolean**：布尔值 (true 或 false)。

    *   **Float**：浮点数（带有小数）。

    *   **Arrays**：相同类型元素的组。


    ## 操作符


    一旦我们声明并为变量赋值，就可以使用操作符来修改变量或将其与其他变量结合。C# 中提供了不同类型的操作符，包括算术运算符、赋值运算符、比较运算符和逻辑运算符。


    让我们来看看每一个：


    *   算术运算符用于执行算术运算，包括加、减、乘、除。常见的算术运算符包括 `+`、`-`、`*`、`/` 或 `%`（取模），其用法如下代码段所示。


    ```csharp

    int number1 = 1;// 声明了变量 number1


    int number2 = 1;// 声明了变量 number2


    int sum = number1 + number2;// 将两个数字相加并存储在 sum 中


    int sub = number1 - number2;// 将两个数字相减并存储在 sub 中

    ```


    *   赋值运算符用于给变量赋值，包括 `=`、`+=`、`-=`、`*=`、`/=` 或 `%=`，其用法如下代码段所示。


    ```csharp

    int number1 = 1;


    int number2 = 1;


    number1+=1; // 等于 number1 = number1 + 1;


    number1-=1; // 等于 number1 = number1 - 1;


    number1*=1; // 等于 number1 = number1 * 1;


    number1/=1; // 等于 number1 = number1 / 1;

    ```

