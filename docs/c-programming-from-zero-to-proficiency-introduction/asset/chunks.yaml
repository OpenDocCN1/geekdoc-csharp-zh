    \ illustrated in the next code snippet:\n\n```\nnameOfTheFunction1();\nnameOfTheFunction2(value);\n\
    int test = nameOfFunction3(value);\n```\n\nIn the previous code, a method is called\
    \ with no parameter (first line), or with a parameter (second line). On the third\
    \ line, a variable called `test` will be set with the value returned by the method\
