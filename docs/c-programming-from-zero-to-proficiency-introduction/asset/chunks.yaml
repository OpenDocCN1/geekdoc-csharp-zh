    ## Challenge 1


    Now that you have managed to complete this chapter and that you have gathered
    interesting skills, let’s put these to the test. This particular challenge will
    get you to become more comfortable with methods. The solutions are included in
    the resource pack.


    Create a method called `calculatePrice` that does the following:


    <ul><li>Take two parameters called `nbItems` and `unitPrice`.</li><li>Multiply
    these two numbers and store the result in a variable called `finalPrice`.</li><li>Return
    the value of the variable `finalPrice`.</li></ul>


    Once the method has been created, call this method using two values of your choice
    and display the result returned by the method in the console window.


    ## Challenge 2


    Create a method that does the following:


    <ul><li>Asks the user for his/her first name.</li><li>Asks the user for his/her
    first last name.</li><li>Displays the full name (i.e., first name followed by
    a space, followed by the last name) in the console window.</li><li>Once the method
    has been created, call this method.</li></ul>


