    }


    In the previous code:


    *   We have created a block of instructions that starts with an opening curly
    bracket and that ends with a closing curly bracket.


    *   Within this block, we have created two statements based on alert boxes; both
    statements are ending with a semi-colon.


    You can now save your code and run the application; you should see two additional
    messages displayed in the console window (i.e., the ones that you have just added).


    For now, using blocks of instructions may look like it will not make much of a
    difference to your coding, and this is true for now. This being said, blocks of
    instructions are very helpful, as we will see later, especially when we need to
    tell the browser to execute a list of instructions. This is because, in this case,
    instead of telling the system to execute each instruction individually, we can
    instead, ask for a block of instructions to be executed.


    Comments


    In C#, you can use comments to explain your code and to make it more readable
    by others. This becomes important as the size of your code increases; and it is
    also important if you work in a team, so that other team members can understand
    your code and make amendments in the right places, if and when it is needed.


    Code that is commented is usually not executed. There are two ways to comment
    your code in C# using either single- or multi-line comments.


    In single-line comments, a double forward slash is added at the start of a line
    or after a statement, so that this line (or part thereof) is commented, as illustrated
    in the next code snippet.


    //the next line prints Hello in the console window


    Console.WriteLine("Hello");


    //the next line declares the variable name


    string name;


    name = "Hello";//sets the value of the variable name


    In multi-line comments, any code between the characters forward slash and star
    " /*" and the characters star and forward slash "*/" will be commented, and this
    code will not be executed. This is also referred as comment blocks.


    /* the next lines after the comments will print the message "hello" in the console
    window


    we then declare the variable name and assign a value


    */


    Console.WriteLine("Hello");


    string name;


    name = "Hello";//sets the value of the variable name


    //Console.WriteLine("Hello World")


    /*


    string name;


    name = "My Name";


    */


    In addition to providing explanations about your code, you can also use comments
    to prevent part of your code to be executed. This is very useful when you would
    like to debug your code and find where the error or bug might be, using a very
    simple method. By commenting sections of your code, and by using a process of
    elimination, you can usually find the issue quickly. For example, you can comment
    all the code and run the application; then comment half the code, and run the
    application. If it works without no errors, it means that the error is within
    the code that has been commented, and if it does not work, it means that the error
    is in the code that has not been commented. In the first case (when the code works),
    we could then just comment half of the portion of the code that has already been
    commented. So, by successively commenting more specific areas of our code, we
    can get to discover what part of the code includes the bug. This process is often
    called dichotomy (as we successively divide a code section into two).


    Let’s use comments in our application:


