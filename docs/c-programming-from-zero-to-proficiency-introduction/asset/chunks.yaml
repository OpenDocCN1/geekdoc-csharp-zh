    # 1 C# 编程简介


    ![image](img/chapter_title_below.png)


    在本节中，我们将对 C# 编程进行入门介绍，并介绍你开发游戏时需要的关键方面，包括：


    * C# 语法。

    * 变量类型和作用域。

    * 方法。


    因此，在完成本章后，你将能够：

    * 理解与 C# 编程相关的核心概念。

    * 理解变量和方法的概念。

    * 创建并使用你自己的方法。


    本章的代码解决方案包含在资源包中，你可以通过遵循“本书的支持与资源”章节中的说明进行下载。


    ## 什么是 C#


    C# 是一种由微软开发的面向对象的语言，在很多情况下，它被用于开发桌面应用程序。作为 `.NET` 框架的一部分，它也被用于 Web 开发和应用。作为一种面向对象的编程语言，意味着
    C# 程序是由一组相互作用的对象集合组成的。


    C# 用于许多应用程序，包括游戏制作，特别是使用 Unity 软件时。


    ## 选择代码编辑器


    在接下来的章节中，你将开始编写自己的 C# 代码。为此，你需要使用代码编辑器，更具体地说，是一个集成开发环境（IDE）。这些 IDE 包含了编译和执行代码所需的所有工具。


    使用 IDE 将为你提供一种更简单的方法来创建、组织和检查代码，具有以下某些功能：

    * 文本高亮：使代码更易阅读和修改。

    * 自动补全：这样你就不需要记住代码中所有变量的名称或某些常用方法的名称。

    * 错误高亮：这样在你测试代码之前，就能突出一些明显的错误。


    有很多免费的 IDE 可用，它们各有优缺点，包括：

    * Visual Studio Code。

    * Visual Studio Community。

    * MonoDevelop。

    * NetBeans。

    * #Develop。

    * Rider。


    考虑到所有这些 IDE，我们本书将使用 Visual Studio Community（尽管如果你愿意，也可以使用任何其他 IDE）。


    你可以从以下网站下载 Visual Studio Community：[`visualstudio.microsoft.com/free-developer-offers/`](https://visualstudio.microsoft.com/free-developer-offers/)


    ––––––––


    ![image](img/scene_break.png)


    ## 安装 Visual Studio


    请从官方网站下载 Visual Studio 并按照指令操作；你应该从以下网站下载并安装适用于 Windows 或 Mac OS 的版本：[`visualstudio.microsoft.com/free-developer-offers/`](https://visualstudio.microsoft.com/free-developer-offers/)


    ## 创建你的第一个应用程序


    在这些简要介绍之后，现在轮到你编写代码了。


    为了让你尝试你的 C# 代码，请在安装 Visual Studio 后执行以下操作：

    * 请启动 VS (Visual Studio)。

    * 从主窗口中选择标记为“New Project”（新建项目）的按钮，如图所示。


    ![image](img/image012.jpg)

    图 1-1：创建你的项目


    * 在新窗口中，选择选项 Other（其他） > .NET > Console Project (C#)，如接下来所示：

    ![image](img/image008.jpg)

    图 1-2：创建一个控制台项目


    * 通过选择此选项，你指定将构建一个在控制台窗口中执行的项目。

    * 点击标记为“Next”（下一步）的按钮。

    * 在下一个窗口中，输入你新项目的名称和位置（例如 `myFirstproject`），如图所示。


    ![image](img/image011.jpg)

    图 1-3：设置你的项目


    * 点击标记为“Create”（创建）的按钮。


    一旦完成，Visual Studio (VS) 将为你的项目创建所有必要的文件夹，代码编辑器将如下打开。


    ![image](img/image013.jpg)

    图 1-4：你的第一段代码


    默认情况下，你会发现已经为你创建了一些代码，如下：


    ```csharp

    using System;


    namespace myFirstProject

    {


    class MainClass

    {

    public static void Main(string[] args)

    {

    Console.WriteLine("Hello World!");

    }


    }


    }

    ```


    在前面的代码中：

    * 我们声明将使用名为 `System` 的库（或路径）。这样做是为了让我们能够使用该命名空间（或库）中包含的一些有用文件（即类）。

    * 我们声明了一个名为 `myFirstProject` 的命名空间，我们将在书的后面部分介绍这个概念。这等同于你在应用程序中使用的某些类的路径或库。

    * 我们声明了一个名为 `MainClass` 的类。正如我们稍将看到的，你的应用程序将由一组类组成。这些其中一个类将是 `MainClass` 类，它是你应用程序的起点。

    * 我们还声明了一个名为 `Main` 的方法。该方法将是我们应用程序的起点。

    * 在此方法中（这是目前最重要的部分），我们在控制台窗口中写入了文本“Hello World”。


    你现在可以通过点击窗口左上角的三角形来编译并执行这段代码。


    ![image](img/image003.jpg)

    图 1-5：运行项目


    你也可以按照以下步骤运行你的应用程序：

    * 从顶部菜单中，选择 Run > Run With > Custom Configuration...这将打开一个如下所示的窗口。

    ![image](img/image007.jpg)

    图 1-6：使用自定义设置运行项目

    * 窗口打开后，保持所有默认设置不变，然后点击 Run 按钮。

    * 完成后，控制台窗口将会。

    ![image](img/image001.jpg)

    图 1-7：你的第一个控制台应用程序


    如前所示，代码已经为你创建并显示了“Hello World”。


    你现在可以修改代码，让显示的内容不同：

    * 请关闭控制台窗口。

    * 回到 VS，按如下所示修改你的代码（新代码加粗）：


    ```csharp

    public static void Main(string[] args)

    {

    Console.WriteLine("Hello, this is my fist line of code");

    }

    ```


    在前面的代码中，我们刚刚修改了显示的内容。

    * 你现在可以运行代码并看到新结果，如下：

    ![image](img/image006.jpg)

    图 1-8：显示你自己的消息


    ## C# 语法简介


    当你使用 C# 时，你正在与系统通信并要求执行操作。为了与系统通信，你正在使用一种你和计算机都懂的语言，这种语言由关键字、关键短语以及确保指令能被正确编写和理解的语法组成。


    在计算机科学中，这种语言需要是准确、精确、无歧义且具有正确的语法。


    '
