    ### 致谢


    作者：Patrick Felicia。


    Patrick Felicia 是沃特福理工学院（Waterford Institute of Technology）的讲师和研究员，在那里教学并指导本科生和研究生。他于
    2003 年在爱尔兰科克大学大学学院获得多媒体技术硕士学位，并于 2009 年获得计算机科学博士学位。他出版了多本关于利用游戏进行教育目的的书和文章，包括《教育游戏提高学习和动机的研究手册：多学科方法》（IGI
    出版）和《学校中的数字游戏：教师手册》（欧洲 Schoolnet 出版）。Patrick 还是《国际游戏化学习国际杂志》（IJGBL）的主编辑，以及爱尔兰游戏化学习研讨会的会议主席（这是一场在全爱尔兰举办的关于游戏与学习的热门会议）。他还出版过关于通过创建游戏使用
    C# 进行编码的书。


    ### 作者的其他书籍


    * [JavaScript 从零到精通（入门级）](https://books2read.com/u/m2veDd): 在这本书中，即使你从未写过代码，你也将变得更加熟悉
    JavaScript。这本书将教你如何从零开始编码，解释诸如 `variables`、`methods`、`statements` 等编程原理。你还将学习如何通过分步方法，使用事件、`DOM`
    和其他关键 JavaScript 概念为网页添加交互功能。

    * [Unity 5 从零到精通（基础篇）](https://books2read.com/u/bQ0r64): 在这本书中，你将通过创建一个包含室内和室外环境的项目变得更加熟悉
    Unity 的界面及其核心功能。本书仅涵盖了拖放功能，以便你在开始编写代码（在下一本书中）之前熟悉 Unity 的界面。完成本书后，你将能够创建带有地形的户外环境，并包含水域、山丘、山谷、天空盒，使用内置控制器（第一人称和第三人称控制器）在
    3D 环境中漫步，还可以添加并驾驶汽车和飞机。


    ### 本书的支持与资源


    本书建立了一个配套网站，你可以在那里下载本书的完整项目，包含书中所有的代码，以便你可以检查自己的代码，并获得每章中提供的挑战代码解决方案。


    要获取这些内容，你可以打开以下链接：


    [`learncsharpforbeginners.wordpress.com/`](http://learncsharpforbeginners.wordpress.com/)


    该网站还提供机会让你订阅我的邮件列表，并接收：

    * pdf 格式的电子书（免费副本），以便你可以在任何计算机上打开它。

    * 关于 C# 的定期更新和教程。

    * 用于接收我的部分书籍超过 30% 折扣的优惠券。


    本书献给 Mathis & Helena


    ![image](img/scene_break.png)


    # 前言


    本书是“C# 从零到精通”系列丛的一部分。在该系列书中，你将有机会从零开始学习 C# 编程，并精通这种流行的编程语言。


    在部名为《C# 从零到精通（引言）》的书中，你将发现如何快速上手 C#；你将学习如何使用 `variables`、`methods`、`conditional
    statements`，并且还将编写自己的代码。


    ## 使用本书所需的条件


    要完成书中介绍的项目，你只需要一个集成开发环境，如 `Visual Studio Community`。


    在计算机技能方面，书中介绍的所有知识都假设读者没有先前的编程经验。虽然书中包含了编程，但你将获得分步指导。因此，现在你只需要能够执行常见的计算机任务，如打字、打开和保存文件。


    ## 本书的读者群


    如果你对所有这些问题的回答都是“是”，那么这本书就适合你：

    * 你是 C# 编程的初学者吗？

    * 你想快速上手 C# 概念吗？

    * 尽管你可能对 C# 有一些了解，但你想深入研究 C# 吗？


    如果你对所有这些问题的回答都是“是”，那么这本书不适合你：

    * 你已经可以轻松地用 C# 编写代码了吗？

    * 你正在寻找 C# 的参考书吗？

    * 你是一位丰富的（至少是高级的）C# 程序员吗？


    如果你对这三个问题的回答都是“是”，你也可以寻找该系列中的其他书籍。要查看这些书籍涵盖的内容和主题，你可以查看官方网站：http://www.learncsharpforbeginners.wordpress.com。


    ## 改进本书


    尽管在检查本书内容时已尽力仔细，但我是人，书中可能遗留一些错误。因此，如果你能让我知道书中遇到的任何问题或错误，那就太棒了，这样就可以解决问题并相应地更新书籍。要报告错误，你可以发送邮件给我（`learncsharpforbeginners@gmail.com`），并提供以下信息：

    * 书名。

    * 发现错误的页码。

    * 描述错误以及你认为纠正内容应该是怎样的。


    一旦收到你的邮件，将对错误进行检查，如果是有效错误，将进行修正并更新书籍页面以反映相应更改。


    ## 支持作者


    本书投入了大量心血，它是长期准备、脑力风暴和最终写作的结晶。因此，我请求不要分发本书的非法副本。


    如果你的一些朋友对这本书感兴趣，你可以让他们访问书籍官方网站（[`www.learncsharpforbeginners.wordpress.com/`](http://www.learncsharpforbeginners.wordpress.com/)），他们可以在那里购买书籍、参加每月抽奖以获得获得免费书籍，或接收未来的促销信息。


