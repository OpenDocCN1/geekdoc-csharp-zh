    \n类和成员变量可以比作一个拥有不同俱乐部和协会的城市。这座城市由这些不同的俱乐部组成。每个俱乐部都有成员。其中某些成员只有在你已经是他们所属的特定俱乐部成员时才能被访问；其他成员则对不属于同一个俱乐部的人来说更具公开性。由于其中某些成员（例如财务人员）非常强大，可能会显著地改变俱乐部的未来和安全，因此你可能不希望俱乐部以外的任何人都能访问他们，因为这意味着任何人都可以要求他们对俱乐部做出巨大的改变。然而，所有的俱乐部成员因为受到信任，可以获得对该财务人员的访问权限。另一方面，每个俱乐部都可以有一位负责推广俱乐部的公关人员。在这种情况下，该成员可以被公开，以便俱乐部之外的任何人都可以访问他们以获取有关俱乐部的信息（例如营业时间、特性等）。\n\
    \n所以，让我们对变量及其作用域进行一些实验：\n\n- 请将以下代码添加到 `Program.cs` 文件中（新代码已**加粗**）。\n\n```csharp\n\
    class MainClass\n{\n    public static int myMemberVariable;\n\n    public static\
    \ void myMethod()\n    {\n        myMemberVariable = 3;\n        Console.WriteLine(\"\
    The value of myMemberVariable is \" + myMemberVariable);\n    }\n\n    public\
    \ static void Main(string[] args)\n    {\n        myMemberVariable = 1;\n    \
    \    Console.WriteLine(\"The value of myMemberVariable before calling the method\
    \ is \" + myMemberVariable);\n        myMethod();\n    }\n}\n```\n\n在之前的代码中：\n\
    \n- 我们声明了一个名为 `myMemberVariable` 的成员变量；因为它在任何方法之外声明，所以这个变量将是一个成员变量，并在整个类中都是可的。\n\
    - 它被声明为 `static`，因为它将从 `Main` 方法被调用，而 `Main` 方法默认就是静态的；而且正如我们所知道的，静态方法应该只调用同样是静态的方法。\n\
    - 然后我们调用了 `myMethod` 方法。\n- 在调用的 `myMethod` 方法中，我们设置并显示了变量 `myMemberVariable`\
    \ 的值。\n- 最后，当应用程序启动时，会调用 `Main` 方法（它是我们应用程序的入口），\n- 我们将变量 `myMemberVariable` 的值设置为\
    \ `1`，然后调用了 `myMethod` 方法。\n\n请保存你的代码并运行你的应用程序。你应该能看到一个与下图类似的窗口：\n\n![image](img/image000.jpg)\n\
    \n图 1-12：使用成员变量\n\n### 创建应用程序时需要记住的几点（清单）\n\n当你开始编写代码时，和任何新活动一样，你会犯一些小错误，学习它们是什么，改进你的编码，并最终变得更擅编写应用程序。正如我过去在学习编程的学生身上看到的，通常会犯一些常见的错误；这些错误不会让你成为一个糟糕的程序员；相反，它是学习过程的一部分，因为我们都是通过试错来学习的，犯错是学习过程的一部分。\n\
    \n所以，当你创建你的第一个应用程序时，放下任何恐惧，尝试实验，保持好奇心并学习这门语言。这就像学习一门新的外语：当一个来自外国的人听懂了你的第一个句子时，你会感到充满力量！C#\
    \ 的情况也是如此，为了简化学习过程，我在编写应用程序时包含了一些技巧和需要注意的事项，以便你进展得更快。你现在不需要知道所有这些内容（我稍后在下一章中会提到这些内容），但这样做的目的是让你对它们了于胸，并在发生任何错误时使用这个列表。所以，请注意这些点：:-\n\
    \n- 每个左括号都有一个对应的右括号。\n- 所有变量的写法要保持一致（例如拼写和大小写）。每个变量的名称对大小写敏感；这意味着如果你声明了一个变量 `myvariable`，但在稍后的代码中用\
    \ `myVariable` 引用它，这可能会触发错误，因为变量 `myVariable` 和 `myvariable` 因为大小写不同（大写 V）而被视为两个不同的变量。\n\
    - 尽可能在使用变量之前对其进行声明（例如 `int myVar`）。\n- 对于每个变量名，所有单词（第一个单词除外）的首字母大写。这不是强制性要求，但它会让你的代码更具读性。\n\
    - 对于每个方法，所有单词（第一个单词除外）的首字母大写。这不是强制性要求；但它会让你的代码更具读性。\n- 所有语句都以分号结束。\n- 对于 `if`\
    \ 语句，条件位于圆括号内。\n- 对于 `if` 语句，条件使用 `==` 而不是 `=`。\n- 调用方法时，使用该方法的精确名称（即大小写敏感）。\n\
    - 引用变量时，要考虑变量的作用域（例如在本地调用局部变量）。\n- 局部变量在方法内部声明和使用。\n- 成员变量在方法之外声明并可以在整个类中使用。\n\
    \n### 最佳实践\n\n当你开始编写代码时，和任何新活动一样，你会犯一些小错误，学习它们是什么，改进你的编码，并最终变得更擅编写应用程序。正如我过去在学习编程的学生身上看到的，通常会犯一些常见的错误；这些错误不会让你成为一个糟糕的程序员；相反，它是学习过程的一部分，因为我们都是通过试错来学习的，犯错是学习过程的一部分。下一个列表列出了我的学生在开始\
    \ C# 时经常遇到的错误。\n\n#### 变量命名\n\n- 使用你能够理解的有意义的名称，特别是在离开你的代码两周之后。\n- `string myName\
    \ = \"Patrick\"` // 良好\n- `string b = \"Patrick\"` // 不好\n\n- 名称中所有单词的首字母大写，但第一个单词除外。\n\
    - `bool testIfNameIsCorrect = true;` // 良好\n- `bool testiftameiscorrect = true;`\
    \ // 不好\n\n#### 方法\n\n- 使用唯一的（即不同的）名称（成员变量和局部变量）。\n- 检查每个左括号是否有对应的右括号。\n- 缩进你的代码。\n\
    - 尽可能为你的代码编写注释以说明它是如何工作的。\n\n––––––\n\n![image](img/scene_break.png)\n\n##总结\n\
    \n在本章中，我们成功创建了你的第一个应用程序。你对创建变量和方法变得更加熟悉，以及通过控制窗口显示信息。最后，你还学会了如何使用条件语句以便根据特定条件进行处理。基于这些知识，你创建了简单的程序，用户输入信息，程序相应计算并输出结果。所以我们从没有任何\
    \ C# 知识到创建第一个应用程序，取得了巨大的进展：做得好！\n\n测试题\n\n现在是测试你的知识了。请判断以下陈述的对错。答案在下一页。\n\n1.\
    \ C# 程序的主入口是名为 `Main` 的方法。\n2. `Main` 方法通常是 `public` 的，以便从应用程序外部调用。\n3. `Main`\
    \ 方法通常被声明为 `static`。\n4. `Console.WriteLine()` 命令在控制窗口显示信息。\n5. `Console.ReadLine()`\
    \ 在控制窗口记录用户输入的信息。\n6. 在 C# 中，文本值用双引号括围。\n7. 在 C# 中，局部变量只能在定义它的方法中使用。\n\n"
