    \ a parameter.\n*   The information (or value) returned by the method is stored\
    \ in the variable `myAge` and then displayed using the alert method.\n\nWe can\
    \ now create the method called `calculateAge` by adding the following code after\
    \ the method `Main`.\n\n```cs\npublic static int calculateAge(int yearOfBirth)\n\
    {\n    return (2018 - yearOfBirth);\n}\n```\n\nIn the previous code:\n\n*   The\
