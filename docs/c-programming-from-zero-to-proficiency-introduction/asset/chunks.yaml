    to this concept later on). They can then be used anywhere in the class (and sometimes
    outside the class also), as illustrated in the next code snippet.


    class MainClass


    {


    public int myVar;


    public void method1()


    {


    myVar = 0;


    }


    public void method2()


    {


    myVar = myVar + 1;


    }


    In the previous code, the member variable myVar is declared at the start of the
    class MainClass; it is then initialized in method1, and updated in method2. Note
    that the variable was declared as public, which means that not only is it accessible
    throughout the class called MainClass, but it is also accessible from outside
    this class.


    *   Local variables are declared (and should only be used) within a specific method;
    hence the term local, because they can only be used locally, as illustrated in
    the next code snippet.


    public void method1()


    {


    int myVar;


    myVar = 0;


