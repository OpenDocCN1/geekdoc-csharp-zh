    以下挑战的解决方案包含在资源包，你可以按照“本书的支持与资源”章节中的说明进行下载。


    ## 挑战 1


    现在你已经成功完成了这一章并积累了一些有趣的技能，让我们测试一下它们吧。这个特定的挑战将让你对方法更加熟悉。解决方案包含在资源包中。


    创建一个名为 `calculatePrice` 的方法，执行以下操作：


    <ul><li>接受两个名为 `nbItems` 和 `unitPrice` 的参数。</li><li>将这两个数字相乘并将结果存储在名为 `finalPrice`
    的变量中。</li>返回变量 `finalPrice` 的值。</li></ul>


    方法创建完成后，使用你任选的两个值调用该方法，并在控制台窗口显示方法返回的结果。


    ## 挑战 2


    创建一个执行以下操作的方法：


    <ul><li>询问用户其名（first name）。</li><li>询问用户的姓（last name）。</li><li>在控制台窗口中显示全名（即：名后跟空格，然后是姓）。</li><li>方法创建完成后，调用该方法。</li></ul>


