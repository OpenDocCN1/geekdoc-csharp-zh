    的接触绝对对你有帮助。尽管如此，`C#` 和 `JavaScript` 尽管存在某些相似之处，但在许多方面也非常不同；例如，在 `C#` 中，变量和方法的声明方式不同。


    在 `C#` 中编程时，你将使用特定的语法与系统进行通信；这种语法由句子组成，用于传达你希望计算机执行的操作；这些句子或语句将包含关键字、变量、方法或事件的组合；下一节将解释你如何有信心地构建这些句子，从而在
    C# 中进行编程。


    ### 语句 (Statements)


    在 `C#` 中编写代码时，你需要使用语句来告诉系统执行你的指令（例如，打印信息）。语句字面意思是一个命令或你要求系统执行的事情。例如，在下一行代码中，语句将告诉系统在
    `Console` 窗口中打印消息：


    ```

    Console.WriteLine("Hello Word");

    ```


    在编写语句时，你需要遵循几条规则，包括以下规则：


    *   语句的顺序：每个语句按照它们在程序中出现的顺序依次执行。例如，在下一个示例中，代码将先打印 hello，然后打印 world；这是因为相关的语句处于特定的顺序中。


    ```

    Console.WriteLine("hello");

    Console.WriteLine("world");

    ```


    *   语句之间用分号分隔（即每个语句末尾都有分号）。注意，多个语句可以写在同一行，只要它们用分号隔开即可。


    例如，下一行代码具有正确的语法，因为它所有的所有的语句都用分号隔开了。


    ```

    Console.WriteLine("hello"); Console.WriteLine("world");

    ```


    *   语句中的多个空格会被忽略；然而，为了清晰起见，在运算符 `+`、`-`、`/` 或 `%` 周围添加空格是一个良好习惯。例如，在下一个代码段中，我们说
    `a` 等于 `b`。你可能会注意到在运算符 `=` 前后都包含了空格。


    ```

    a = b;

    ```


