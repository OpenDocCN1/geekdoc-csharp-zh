    Figure 1-11: Displaying the value returned by the method


    Scope of variables


    Whenever you create variables in C#, you will need to be aware of their scope
    so that you use it where its scope makes it possible for you to do so. This is
    particularly important if you use methods, as some variables will be used just
    locally, whereas others will be used throughout the class or the application.


    The scope of a variable refers to where you can use this variable in an application.
    In C#, in addition to access modifiers that will be covered later in this book,
    variables can be either member variables or local variables.


    *   Member variables can be used in a specific class or throughout your application,
    depending on their access type.


    While we will study classes in detail; put simply, your application will be made
    of several parts called classes. In our case, the entry point for our application
    is a class called MainClass.


    *   Member variables can be declared at the start of the class, using the usual
