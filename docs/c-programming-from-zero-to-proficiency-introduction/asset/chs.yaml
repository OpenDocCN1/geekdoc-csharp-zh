  \n# 前言\n\n本书是“C# 从零到精通”系列丛的一部分。在该系列书中，你将有机会从零开始学习 C# 编程，并精通这种流行的编程语言。\n\n在部名为《C#\
  \ 从零到精通（引言）》的书中，你将发现如何快速上手 C#；你将学习如何使用 `variables`、`methods`、`conditional statements`，并且还将编写自己的代码。\n\
  \n## 使用本书所需的条件\n\n要完成书中介绍的项目，你只需要一个集成开发环境，如 `Visual Studio Community`。\n\n在计算机技能方面，书中介绍的所有知识都假设读者没有先前的编程经验。虽然书中包含了编程，但你将获得分步指导。因此，现在你只需要能够执行常见的计算机任务，如打字、打开和保存文件。\n\
  \n## 本书的读者群\n\n如果你对所有这些问题的回答都是“是”，那么这本书就适合你：\n* 你是 C# 编程的初学者吗？\n* 你想快速上手 C# 概念吗？\n\
  * 尽管你可能对 C# 有一些了解，但你想深入研究 C# 吗？\n\n如果你对所有这些问题的回答都是“是”，那么这本书不适合你：\n* 你已经可以轻松地用 C#\
  \ 编写代码了吗？\n* 你正在寻找 C# 的参考书吗？\n* 你是一位丰富的（至少是高级的）C# 程序员吗？\n\n如果你对这三个问题的回答都是“是”，你也可以寻找该系列中的其他书籍。要查看这些书籍涵盖的内容和主题，你可以查看官方网站：http://www.learncsharpforbeginners.wordpress.com。\n\
