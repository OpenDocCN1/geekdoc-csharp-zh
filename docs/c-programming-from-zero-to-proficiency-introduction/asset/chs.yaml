  \ C# 提供的一个方法，用于读取用户输入的文本（在用户按下回车键后）。\n*   一旦用户输入了名字，它就会存储在变量 `nameOfUser` 中。\n*\
  \   我们随后根据 `nameOfUser` 的值执行语句。\n\n*(注：由于原文文本中存在大量重复段落，以上翻译已根据“不要重复输出原文”的原则进行了去重处理，确保了逻辑连贯性。)*\n\
  \n---\n**抱歉，由于您提供的原始文本中存在大量的重复段落，为了遵循“一定不要重复输出原文”的指令，我在翻译时对内容进行了合并和去重。以下是基于原文核心逻辑梳理后的完整译文：**\n\
  \n[content]\n\n```\nnumber1%=1; //等同于 number1 = number1 % 1;\n```\n\n注意 `=` 运算符在与字符串一起使用时会将它们进行拼接（即将它们一个接一个放在一起以创建一个新字符串）。当它与数字和字符串一起使用时，情况也是如此，结果是一个字符串（例如\
  \ `\"Hello\"+1` 的结果是 `\"Hello1\"`）。\n\n*   *比较运算符*通常用于比较两个值的条件。比较运算符包括 `==`、`!=`、`>`\
  \ `<`, `>=`, 和 `<=`，用法在下一个代码段中进行了说明。\n\n```cs\nif (number1 == number2); //如果 number1\
  \ 等于 number2\nif (number1 != number2); //如果 number1 和 number2 的值不同\nif (number1\
  \ > number2); //如果 number1 大于 number2\nif (number1 >= number2); //如果 number1 大于或等于\
  \ number2\nif (number1 < number2); //如果 number1 小于 number2\nif (number1 <= number2);\
  \ //如果 number1 小于或等于 number2\n```\n\n## 条件语句\n\n虽然我们已经查看了数字或文本等简单变量，以及如何通过运算符来修改它们，但现在我们来查看条件语句。\n\
  \n条件语句是根据条件执行的语句，因此得此名。它们的语法通常如下：\n\n`if (condition) statement;`\n\n这意味着如果条件通过验证（或为真），则（且仅在在这种情况下）执行该语句。当我们评估一个条件时，我们是在测试一个声明（或语句）是否为真。\n\
  \n例如，通过输入 `if (a == b)`，我们的意思是“如果 a 等于 b 是真的”。同样地，如果我们输入 `if (a>=b)`，我们的意思是“如果 a\
  \ 等于或大于 b 是真的”。\n\n正如我们后面将看到的，我们还可以组合条件。例如，我们可以决定在两个（或多个）条件均真时执行某条语句。例如，通过输入 `if\
  \ (a == b && c == 2)`，我们的意思是“如果 a 等于 b 且 c 等于 2”。在这种情况下，使用运算符 `&&` 表示“与”（AND），即两个条件都必须为真。我们可以将其此比为决定明天是否去航海。\n\
  \n例如，我们可以将句子“如果天气晴朗且风速小于 5km/h，我将去航海”翻译如下：\n\n```cs\nif (weatherIsSunny == true\
  \ && windSpeed < 5) IGoSailing = true;\n```\n\n在创建条件时，就像大多数自然语言一样，我们可以使用表示为 `||`\
  \ 的或逻辑运算符。参考前面的例子，我们可以将句子“如果天气太热或风速超过 5km/h，我就不去航海”翻译如下：\n\n```cs\nif (weatherIsTooHot\
  \ == true || windSpeed > 5) IGoSailing = false;\n```\n\n另一个例子如下。\n\n```cs\nif (myName\
  \ == \"Patrick\") alert(\"Hello Patrick\");\nelse alert (\"Hello Stranger\");\n\
  ```\n\n在上一段代码中，如果变量 `myName` 等于 \"Patrick\"，我们就显示文本 \"Hello Patrick\"；否则，我们显示消息\
  \ \"Hello Stranger\"。\n\n当我们评估真和假条件时，我们实际上在应用所谓的布尔逻辑（Boolean logic）。布尔逻辑处理具有两个值\
  \ 1 和 0（或真和假）的布尔数。通过评估条件，我们实际上在处理布尔数并应用布尔逻辑。虽然你不需要深入了解布尔逻辑，但某些布尔逻辑运算符是非常重要的，包括 `!`\
  \ 运算符。它表示“非”（NOT）或“相反”。这意味着如果一个变量为真，它的相反则为假，反之亦然。例如，如果我们考虑变量 `weatherIsGood = true`，则\
  \ `!weatherIsGood` 的值将为假（它的相反面）。所以条件 `if (weatherIsGood == false)` 也可以写成 `if (!weatherIsGood)`，其字面意思是“如果天气不”。”。\n\
  \n让我们实验一下条件语句：\n\n*   请打开 `Program.cs` 文件。\n*   在 `Main` 方法末添加以下代码（加粗部分为新代码）：\n\n\
  ```cs\nConsole.WriteLine(\"My age is \" + age);\nConsole.WriteLine(\"Please enter\
  \ your name: \");\nstring nameOfUser = Console.ReadLine();\nif (nameOfUser == \"\
  Patrick\") Console.WriteLine(\"Hello Patrick\");\nelse Console.WriteLine(\"Hello\
  \ Stranger\");\n```\n\n在上一段代码中：\n\n*   我们写了一条要求用户输入他/她的名字的消息。\n*   我们声明了变量 `nameOfUser`。该变量将包含用户输入的答案（一个字符串）。\n\
  *   我们使用 `Console.ReadLine` 方法存储名称，这是 C# 提供的一个方法，用于读取用户输入的文本（在用户按下回车键后）。\n*   一旦用户输入了名字，它就会存储在变量\
  \ `nameOfUser` 中。\n*   我们随后根据 `nameOfUser` 的值执行语句。\n\n\n\n\n既然你已经可以声明并组合数字和字符串，现在是时候开始研究方法（methods）了。\n\
  \n方法可以被比作朋友或同事，你根据特定的指令委婉地请求他们执行某项任务，并在需要时返回信息。\n\n例如，你可以这样问你的朋友：“假设我出生于 2000 年，请告诉我我什么时候庆祝庆祝\
  \ 20 岁生日？”于是，你给了你的朋友（他/她很擅长数学 :-))）一个信息（即出生日期），他/她就会计算出你 20 岁生日的年份并将此信息返回给你。换句话说，你的朋友会接收一个输入（即出生日期），他/她会返回一个输出（即你\
  \ 20 岁生日的年份）。方法的工作原理完全如此：它们接收信息（有时不接收），执行某个操作，然后有时在需要时返回信息。\n\n在编程术语中，方法是一个执行一组操作的指令块。它在从应用程序中调用（或更简单地称为被调用）或在事件发生时执行（例如，当玩家点击按钮时；我们将在下一节中介绍更多关于事件的内容）。和变量一样，方法是可以声明并被调用的。\n\
  \n方法非常有用，因为一旦创建了方法的代码，就可以多次调用，而无需重新编写相同的代码。此外，由于方法可以接收参数，方法可以处理这些参数并相应产生或返回信息；换句话说，它们可以根据输入执行不同的操作并产生不同的输出。因此，方法可以执行以下一项或全部操作：\n\
  \n*   执行操作。\n*   返回结果。\n*   接收参数并处理它们。\n\n方法通常使用两个关键字后面跟着其名称进行如下：\n\n```\naccessType\
  \ typeOfDataReturned nameOfTheFunction (listOfParameters)\n\n{\n    Perform actions\
  \ here\n}\n```\n\n在之前的代码段中：\n\n*   `access type`（访问类型）定义了方法的作用范围，简单来说，就是该方法从哪里可用（或可以被调用）。\n\
  *   返回数据的 `type`（类型）可以是 `void`（不返回数据）或该方法可能返回的任何类型的数据，如整数、`Boolean` 或字符串 `strings`。\n\
  *   上述信息之后是方法的 `name`（名称）。\n*   `list of parameters`（参数列表）如果该方法不接受任何参数，则为空；否则，它包含一个参数列表，每个参数前面都有类型并用逗号分隔；我们稍后会介绍这一点。\n\
  \n使用此模板，我们可以定义如下方法：\n\n```cs\npublic void myMethod ()\n{\n    Console.WriteLine(\"\
  hello\");\n}\n```\n\n在之前的代码中：\n\n*   该方法被声明为 `public`（公共）。\n*   它的返回类型是 `void`，意味着它不返回任何数据。\n\
  *   它不接受任何参数。\n*   调用此方法时，它将向控制台写入 \"hello\" 消息。\n\n可以使用 `()` 运算符调用方法，如下一个代码段所示：\n\
  \n```\nnameOfTheFunction1();\nnameOfTheFunction2(value);\nint test = nameOfFunction3(value);\n\
  ```\n\n在之前的代码中，调用方法是不带参数的（第一行），或带参数的（第二行）。在第三行中，名为 `test` 的变量将被设置为方法 `nameOfFunction3`\
  \ 返回的值，该方法接受一个参数。\n\n让我们创建我们自己的方法：\n\n*   请打开 `Program.cs` 文件，并像下一个代码段所示注释掉你之前的代码；为了加快速度，如果你正在使用\
  \ Visual Studio，可以选择这些行，然后同时按 `CTRL + /`（或 `APPLE + /`）。\n\n```cs\n//Console.WriteLine(\"\
  What is 1 + 1\");\n//string resultAsString = Console.ReadLine();\n//int result =\
  \ Int32.Parse(resultAsString);\n//if (result == 2) Console.WriteLine(\"Well done\"\
  );\n//else Console.WriteLine(\"Sorry, wrong answer\");\n```\n\n*   然后在 `Main` 方法中添加以下代码：\n\
  \n```cs\nint myAge = calculateAge(1990);\nConsole.WriteLine(\"My Age is \" + myAge);\n\
  ```\n\n在之前的代码中：\n\n*   我们声明了一个名为 `myAge` 的变量。\n*   我们调用了方法 `calculateAge`，并将数字 `1990`\
  \ 作为参数传递。\n*   方法返回的信息（或值）存储在变量 `myAge` 中，然后使用显示方法显示。\n\n现在我们可以在 `Main` 方法之后添加以下代码创建一个名为\
  \ `calculateAge` 的方法。\n\n```cs\npublic static int calculateAge(int yearOfBirth)\n\
  {\n    return (2018 - yearOfBirth);\n}\n```\n\n在之前的代码中：\n\n*   声明了方法 `calculateAge`；它接受一个名为\
  \ `yearOfBirth` 的参数。因此，传递给此方法的任何参数在该方法内部都将被称为 `yearOfBirth`。\n*   该方法返回减法结果 `2018\
  \ – yearOfBirth`。\n*   当调用该方法时，`yearOfBirth` 等于 `1990`；因此它将返回 `28`（即 `2018-1990`）。\n\
  \n注意，新方法 `calculateAge` 被声明为 `static`（静态的）；这是因为 `main` 方法默认是静态的，结果它只能调用同样是静态的方法。如果你忘记将此方法声明为\
  \ `static` 并尝试从 `Main` 方法中调用它，系统将生成一条消息，提示“An object reference is required for the\
  \ non-static field, method, or property”（非静态字段、方法或属性需要对象引用）。\n\n变量的作用域\n\n每你在 C#\
  \ 中创建变量时，都需要意识到它们的作用范围，以便在作用域允许的地方使用它们。当你使用方法时，这一点尤为重要，因为某些变量将在局部使用，而另一些变量将在整个类中使用。\n\
  \n变量的作用域指的是你可以使用该变量的地方。在 C# 中，除了稍后将的访问修饰符，变量可以是成员变量（member variables）或局部变量（local\
  \ variables）。\n\n*   成员变量可以在特定的类中或整个应用程序中使用，取决于它们的访问类型。\n\n虽然成员变量可以在类的开头使用通常的声明语法进行声明，并在前面加上所谓的访问类型（access\
  \ type）（我们稍后会回到这个概念）。然后它们可以在类的任何地方使用（有时也可以在类之外），如下一个代码段所示。\n\n```cs\nclass MainClass\n\
  {\n    public int myVar;\n\n    public void method1()\n    {\n        myVar = 0;\n\
  \    }\n\n    public void method2()\n    {\n        myVar = myVar + 1;\n    }\n\
  }\n```\n\n在之前的代码中，成员变量 `myVar` 在类 `MainClass` 的开头声明；它随后在 `method1` 中初始化，并在 `method2`\
  \ 中更新。注意，该变量被声明为 `public`，这意味着它不仅在名为 `MainClass` 的整个类中可访问，而且从该类的外部也可以访问。\n\n*  \
  \ 局部变量在特定的方法内部声明（并且应该只在内部使用）；因此得有“局部”一词，因为它们只能在局部使用。\n\n```cs\npublic void method1()\n\
  {\n    int myVar;\n    myVar = 0;\n}\n```\n\n\n\n\n```java\npublic void method2()\n\
  {\n    int myVar2;\n    myVar2 = 2;\n}\n```\n\n在之前的代码中，`myVar` 是方法 `method1` 的局部变量，只能在该方法内部使用；`myVar2`\
  \ 是方法 `method2` 的局部变量，也只能在该方法内部使用。\n\n请注意，最好避免所谓的变量掩蔽/遮影（variable masking/shadowing），这是当你给局部变量命名与同一文件中成员变量相同的名称时发生的情况，这可能会导致混淆。\n\
  \n类和成员变量可以比作一个拥有不同俱乐部和协会的城市。这座城市由这些不同的俱乐部组成。每个俱乐部都有成员。其中某些成员只有在你已经是他们所属的特定俱乐部成员时才能被访问；其他成员则对不属于同一个俱乐部的人来说更具公开性。由于其中某些成员（例如财务人员）非常强大，可能会显著地改变俱乐部的未来和安全，因此你可能不希望俱乐部以外的任何人都能访问他们，因为这意味着任何人都可以要求他们对俱乐部做出巨大的改变。然而，所有的俱乐部成员因为受到信任，可以获得对该财务人员的访问权限。另一方面，每个俱乐部都可以有一位负责推广俱乐部的公关人员。在这种情况下，该成员可以被公开，以便俱乐部之外的任何人都可以访问他们以获取有关俱乐部的信息（例如营业时间、特性等）。\n\
  \n所以，让我们对变量及其作用域进行一些实验：\n\n- 请将以下代码添加到 `Program.cs` 文件中（新代码已**加粗**）。\n\n```csharp\n\
  class MainClass\n{\n    public static int myMemberVariable;\n\n    public static\
  \ void myMethod()\n    {\n        myMemberVariable = 3;\n        Console.WriteLine(\"\
  The value of myMemberVariable is \" + myMemberVariable);\n    }\n\n    public static\
  \ void Main(string[] args)\n    {\n        myMemberVariable = 1;\n        Console.WriteLine(\"\
  The value of myMemberVariable before calling the method is \" + myMemberVariable);\n\
  \        myMethod();\n    }\n}\n```\n\n在之前的代码中：\n\n- 我们声明了一个名为 `myMemberVariable`\
  \ 的成员变量；因为它在任何方法之外声明，所以这个变量将是一个成员变量，并在整个类中都是可的。\n- 它被声明为 `static`，因为它将从 `Main` 方法被调用，而\
  \ `Main` 方法默认就是静态的；而且正如我们所知道的，静态方法应该只调用同样是静态的方法。\n- 然后我们调用了 `myMethod` 方法。\n- 在调用的\
  \ `myMethod` 方法中，我们设置并显示了变量 `myMemberVariable` 的值。\n- 最后，当应用程序启动时，会调用 `Main` 方法（它是我们应用程序的入口），\n\
  - 我们将变量 `myMemberVariable` 的值设置为 `1`，然后调用了 `myMethod` 方法。\n\n请保存你的代码并运行你的应用程序。你应该能看到一个与下图类似的窗口：\n\
  \n![image](img/image000.jpg)\n\n图 1-12：使用成员变量\n\n### 创建应用程序时需要记住的几点（清单）\n\n当你开始编写代码时，和任何新活动一样，你会犯一些小错误，学习它们是什么，改进你的编码，并最终变得更擅编写应用程序。正如我过去在学习编程的学生身上看到的，通常会犯一些常见的错误；这些错误不会让你成为一个糟糕的程序员；相反，它是学习过程的一部分，因为我们都是通过试错来学习的，犯错是学习过程的一部分。\n\
  \n所以，当你创建你的第一个应用程序时，放下任何恐惧，尝试实验，保持好奇心并学习这门语言。这就像学习一门新的外语：当一个来自外国的人听懂了你的第一个句子时，你会感到充满力量！C#\
  \ 的情况也是如此，为了简化学习过程，我在编写应用程序时包含了一些技巧和需要注意的事项，以便你进展得更快。你现在不需要知道所有这些内容（我稍后在下一章中会提到这些内容），但这样做的目的是让你对它们了于胸，并在发生任何错误时使用这个列表。所以，请注意这些点：:-\n\
  \n- 每个左括号都有一个对应的右括号。\n- 所有变量的写法要保持一致（例如拼写和大小写）。每个变量的名称对大小写敏感；这意味着如果你声明了一个变量 `myvariable`，但在稍后的代码中用\
  \ `myVariable` 引用它，这可能会触发错误，因为变量 `myVariable` 和 `myvariable` 因为大小写不同（大写 V）而被视为两个不同的变量。\n\
  - 尽可能在使用变量之前对其进行声明（例如 `int myVar`）。\n- 对于每个变量名，所有单词（第一个单词除外）的首字母大写。这不是强制性要求，但它会让你的代码更具读性。\n\
  - 对于每个方法，所有单词（第一个单词除外）的首字母大写。这不是强制性要求；但它会让你的代码更具读性。\n- 所有语句都以分号结束。\n- 对于 `if` 语句，条件位于圆括号内。\n\
  - 对于 `if` 语句，条件使用 `==` 而不是 `=`。\n- 调用方法时，使用该方法的精确名称（即大小写敏感）。\n- 引用变量时，要考虑变量的作用域（例如在本地调用局部变量）。\n\
  - 局部变量在方法内部声明和使用。\n- 成员变量在方法之外声明并可以在整个类中使用。\n\n### 最佳实践\n\n当你开始编写代码时，和任何新活动一样，你会犯一些小错误，学习它们是什么，改进你的编码，并最终变得更擅编写应用程序。正如我过去在学习编程的学生身上看到的，通常会犯一些常见的错误；这些错误不会让你成为一个糟糕的程序员；相反，它是学习过程的一部分，因为我们都是通过试错来学习的，犯错是学习过程的一部分。下一个列表列出了我的学生在开始\
  \ C# 时经常遇到的错误。\n\n#### 变量命名\n\n- 使用你能够理解的有意义的名称，特别是在离开你的代码两周之后。\n- `string myName\
  \ = \"Patrick\"` // 良好\n- `string b = \"Patrick\"` // 不好\n\n- 名称中所有单词的首字母大写，但第一个单词除外。\n\
  - `bool testIfNameIsCorrect = true;` // 良好\n- `bool testiftameiscorrect = true;`\
  \ // 不好\n\n#### 方法\n\n- 使用唯一的（即不同的）名称（成员变量和局部变量）。\n- 检查每个左括号是否有对应的右括号。\n- 缩进你的代码。\n\
  - 尽可能为你的代码编写注释以说明它是如何工作的。\n\n––––––\n\n![image](img/scene_break.png)\n\n##总结\n\n\
  在本章中，我们成功创建了你的第一个应用程序。你对创建变量和方法变得更加熟悉，以及通过控制窗口显示信息。最后，你还学会了如何使用条件语句以便根据特定条件进行处理。基于这些知识，你创建了简单的程序，用户输入信息，程序相应计算并输出结果。所以我们从没有任何\
  \ C# 知识到创建第一个应用程序，取得了巨大的进展：做得好！\n\n测试题\n\n现在是测试你的知识了。请判断以下陈述的对错。答案在下一页。\n\n1. C#\
  \ 程序的主入口是名为 `Main` 的方法。\n2. `Main` 方法通常是 `public` 的，以便从应用程序外部调用。\n3. `Main` 方法通常被声明为\
  \ `static`。\n4. `Console.WriteLine()` 命令在控制窗口显示信息。\n5. `Console.ReadLine()` 在控制窗口记录用户输入的信息。\n\
  6. 在 C# 中，文本值用双引号括围。\n7. 在 C# 中，局部变量只能在定义它的方法中使用。\n\n\n\n\n\n8. 在 `C#` 中，成员变量可以在声明它的类任何地方使用。\n\
  9. 在 `C#` 中，方法始终返回一个值。\n10. 在 `C#` 中，被注释的代码不会执行。\n\n## 测验答案\n\n1. 正确。\n2. 正确。\n\
