  ![image](img/image006.jpg)\n图 1-8：显示你自己的消息\n\n## C# 语法简介\n\n当你使用 C# 时，你正在与系统通信并要求执行操作。为了与系统通信，你正在使用一种你和计算机都懂的语言，这种语言由关键字、关键短语以及确保指令能被正确编写和理解的语法组成。\n\
  \n在计算机科学中，这种语言需要是准确、精确、无歧义且具有正确的语法。\n\n\n\n\n\n在下一节中，我们将学习如何使用这种语法。如果你已经用过 `JavaScript`\
  \ 或 `C#` 进行过，本章后续提供的某些信息可能看起来很熟悉，这种对 `C#` 的接触绝对对你有帮助。尽管如此，`C#` 和 `JavaScript` 尽管存在某些相似之处，但在许多方面也非常不同；例如，在\
  \ `C#` 中，变量和方法的声明方式不同。\n\n在 `C#` 中编程时，你将使用特定的语法与系统进行通信；这种语法由句子组成，用于传达你希望计算机执行的操作；这些句子或语句将包含关键字、变量、方法或事件的组合；下一节将解释你如何有信心地构建这些句子，从而在\
  \ C# 中进行编程。\n\n### 语句 (Statements)\n\n在 `C#` 中编写代码时，你需要使用语句来告诉系统执行你的指令（例如，打印信息）。语句字面意思是一个命令或你要求系统执行的事情。例如，在下一行代码中，语句将告诉系统在\
  \ `Console` 窗口中打印消息：\n\n```\nConsole.WriteLine(\"Hello Word\");\n```\n\n在编写语句时，你需要遵循几条规则，包括以下规则：\n\
  \n*   语句的顺序：每个语句按照它们在程序中出现的顺序依次执行。例如，在下一个示例中，代码将先打印 hello，然后打印 world；这是因为相关的语句处于特定的顺序中。\n\
  \n```\nConsole.WriteLine(\"hello\");\nConsole.WriteLine(\"world\");\n```\n\n*  \
  \ 语句之间用分号分隔（即每个语句末尾都有分号）。注意，多个语句可以写在同一行，只要它们用分号隔开即可。\n\n例如，下一行代码具有正确的语法，因为它所有的所有的语句都用分号隔开了。\n\
  \n```\nConsole.WriteLine(\"hello\"); Console.WriteLine(\"world\");\n```\n\n*   语句中的多个空格会被忽略；然而，为了清晰起见，在运算符\
  \ `+`、`-`、`/` 或 `%` 周围添加空格是一个良好习惯。例如，在下一个代码段中，我们说 `a` 等于 `b`。你可能会注意到在运算符 `=` 前后都包含了空格。\n\
  \n```\na = b;\n```\n\n*   一起执行的语句（例如基于相同的条件）可以使用代码块进行分组。在 `C#` 中，代码块由大括号符号表示（例如\
  \ `{` 或 `}`）。换句话说，如果你需要将多个语句分组，你将把它们都包含同一组大括号内，如下：\n\n```\n{\nConsole.WriteLine(\"\
  hello stranger!\");\nConsole.WriteLine(\"today, we will learn about programming\"\
  );\n}\n```\n\n正如我们之前看到的，语句通常会使用或以关键字（即计算机认识的单词）开头。这些关键字每一个都有特定的用途，常见的如下：\n\n*  \
  \ 在控制台窗口中打印消息：关键字是 `Console.WriteLine`。\n*   声明变量：在这种情况下，关键字取决于所声明变量的类型（例如，整数使用\
  \ `int`，文本使用 `string`，或者布尔变量使用 `bool`），我们将在接下来的几节中看到更多关于这些的内容。\n*   声明方法：所使用的关键字取决于方法返回的数据类型类型。例如，在\
  \ `C#` 中，方法的名称……（后文内容略）。\n\n\n\n\n在之前的代码中，我们注释了消息 \"Hello this is my first line\
  \ of code\" 并将其替换为消息 \"Hello this is my second line of code\"。\n\n现在你已经做了这些更改，请保存代码并运行应用程序；你应该能看到，这次消息\
  \ Hello this is my first line of code 已经被 \"Hello this is my second line of code\"\
  \ 替换了。\n\n我们也可以像下面这样使用多行注释（**粗体**部分为新代码）。\n\n```c\nConsole.WriteLine(\"Hello, this\
  \ is my second line of code\");\n\n{\n\n/*Console.WriteLine(\"this is my first application\"\
  );\n\nConsole.WriteLine(\"This statement and the previous one belong to the same\
  \ block of instructions */;\n\n}\n```\n\n在之前的代码中，我们使用了多行注释。这意味着包含在 `/*` 和 `*/` 之间的两行虽然属于文件，但不会被执行。\n\
  \n如果你保存代码并运行应用程序，你应该看到屏幕上显示的唯一消息是 \"Hello this is my second line of code\"。\n\n\
  ––––––\n\n![image](img/scene_break.png)\n\n## 变量\n\n现在你对语句和注释有了进一步的了解，我们将开始学习更多变量。变量在\
  \ C# 中非常重要，因为你可能会在大多数程序中用它们来进行计算或处理文本。\n\n### 什么是变量？\n\n变量可以比作一个容器，其中包含一个可能随时间改变的值。使用变量时，我们通常需要：(1)\
  \ 通过指定类型来声明变量，(2) 为此变量赋值，以及(3) 可能使用操作符将此变量与其他变量结合，如下一个代码段所示。\n\n```c\nint myAge;//我们声明了变量\
  \ myAge\n\nmyAge = 20;//我们将变量 myAge 设置为 20\n\nmyAge = myAge + 1; //我们给变量 myAge 加了\
  \ 1\n```\n\n在在上的示例中，我们声明了一个名为 `myAge` 的变量，它的类型是 `int`（即整数）。我们在这个变量中保存了值 `20`，然后对其加了\
  \ `1`。\n\n注意，在 C# 中，变量是使用其类型后跟名称声明的。正如我们后面看到的，我们还需要使用所谓的“访问修饰符”来指定如何以及从哪里访问此变量。\n\
  \n同样注意，在之前的代码中，我们将值 `myAge + 1` 赋值给变量 `myAge`；`=` 运算符是一个赋值运算符；换句话说，它是为了给变量赋值，而不应从严格的代数意义上理解（即\
  \ `=` 两侧的值或变量必须相等）。\n\n为了让 C# 编码更简单更简洁，你可以在一个语句中声明多个相同类型的变量。例如，在下一个代码段中，我们在一个语句中声明了三个变量\
  \ `v1`、`v2` 和 `v3`。这是因为它们是相同类型（即整数）。\n\n```c\nint v1,v2,v3;\n\nint v4=4, v5=5, v6=6;\n\
  ```\n\n在上面的代码中，第一行声明了变量 `v1`、`v2` 和 `v3`。三个变量都是整数。在第二行代码中，我们不仅同时声明了三个变量，还通过为这些变量设置值来初始化它们。\n\
  \n使用变量时，有几点我们需要确定，包括它们的名称、类型和作用域：\n\n*   **变量名称**：变量通常被赋予一个唯一的名称，以便于识别和唯一标识。变量的名称通常称为“标识符”。在定义标识符时，它可以包含字母、数字、减号、下划线或美元符号，并且通常以字母开头。标识符不能是关键字（例如，关键字\
  \ `if` 不能作为标识符）。\n*   **变量类型**：变量可以持有多种类型的数据，包括数字（例如整数、double 或浮点数）、文本（例如字符串或字符）、布尔值（例如\
  \ true 或 false）、数组或对象（我们将在本章稍晚些部分介绍数组的概念）。\n\n```csharp\nstring myName = \"Patrick\"\
  ;//文本使用双引号声明\n\nint currentYear = 2017;//年份不需要小数，且被声明为整数\n\nfloat width = 100.45f;//宽度被声明为浮点数\
  \ float（即带有小数的）\n```\n\n*   **变量声明**：需要声明变量，这样当你在代码中使用此变量时，系统才知道知道你指的是什么。使用变量的第一步是声明或定义此变量。在声明阶段，变量不需要赋值，因为这可以在以后完成。在接下来的示例中，我们声明了一个名为\
  \ `myName` 的变量，然后给它赋值为 `\"My Name\"`。\n\n```csharp\nstring myName;\n\nmyName = \"\
  My Name\"\n```\n\n*   **变量作用域**：变量可以在特定的范围内访问，这取决于变量最初在应用程序中声明的位置。我们稍后会研究这个概念。\n\
  *   **可访问级别**：正如我们后面看到的，一个 C# 程序由类组成；对于这些类中的每一个，内部的方法和变量可以根据它们的访问级别进行访问，我们稍后会研究这一原则。\n\
  \n常见的变量类型包括：\n\n*   **String**：同文本。\n*   **Int**：整数 (1, 2, 3)。\n*   **Boolean**：布尔值\
  \ (true 或 false)。\n*   **Float**：浮点数（带有小数）。\n*   **Arrays**：相同类型元素的组。\n\n## 操作符\n\
  \n一旦我们声明并为变量赋值，就可以使用操作符来修改变量或将其与其他变量结合。C# 中提供了不同类型的操作符，包括算术运算符、赋值运算符、比较运算符和逻辑运算符。\n\
  \n让我们来看看每一个：\n\n*   算术运算符用于执行算术运算，包括加、减、乘、除。常见的算术运算符包括 `+`、`-`、`*`、`/` 或 `%`（取模），其用法如下代码段所示。\n\
  \n```csharp\nint number1 = 1;// 声明了变量 number1\n\nint number2 = 1;// 声明了变量 number2\n\
  \nint sum = number1 + number2;// 将两个数字相加并存储在 sum 中\n\nint sub = number1 - number2;//\
  \ 将两个数字相减并存储在 sub 中\n```\n\n*   赋值运算符用于给变量赋值，包括 `=`、`+=`、`-=`、`*=`、`/=` 或 `%=`，其用法如下代码段所示。\n\
  \n```csharp\nint number1 = 1;\n\nint number2 = 1;\n\nnumber1+=1; // 等于 number1 =\
  \ number1 + 1;\n\nnumber1-=1; // 等于 number1 = number1 - 1;\n\nnumber1*=1; // 等于\
  \ number1 = number1 * 1;\n\nnumber1/=1; // 等于 number1 = number1 / 1;\n```\n\n\n\n\
  \n```\nnumber1%=1; //等同于 number1 = number1 % 1;\n```\n\n注意 `=` 运算符在与字符串一起使用时会将它们进行拼接（即将它们一个接一个放在一起以创建一个新字符串）。当它与数字和字符串一起使用时，情况也是如此，结果是一个字符串（例如\
  \ `\"Hello\"+1` 的结果是 `\"Hello1\"`）。\n\n*   *比较运算符*通常用于比较两个值的条件。比较运算符包括 `==`、`!=`、`>`\
  \ `<`, `>=`, 和 `<=`，用法在下一个代码段中进行了说明。\n\n```cs\nif (number1 == number2); //如果 number1\
  \ 等于 number2\nif (number1 != number2); //如果 number1 和 number2 的值不同\nif (number1\
  \ > number2); //如果 number1 大于 number2\nif (number1 >= number2); //如果 number1 大于或等于\
  \ number2\nif (number1 < number2); //如果 number1 小于 number2\nif (number1 <= number2);\
  \ //如果 number1 小于或等于 number2\n```\n\n## 条件语句\n\n虽然我们已经查看了数字或文本等简单变量，以及如何通过运算符来修改它们，但现在我们来查看条件语句。\n\
  \n条件语句是根据条件执行的语句，因此得此名。它们的语法通常如下：\n\n`if (condition) statement;`\n\n这意味着如果条件通过验证（或为真），则（且仅在在这种情况下）执行该语句。当我们评估一个条件时，我们是在测试一个声明（或语句）是否为真。\n\
  \n例如，通过输入 `if (a == b)`，我们的意思是“如果 a 等于 b 是真的”。同样地，如果我们输入 `if (a>=b)`，我们的意思是“如果 a\
  \ 等于或大于 b 是真的”。\n\n正如我们后面将看到的，我们还可以组合条件。例如，我们可以决定在两个（或多个）条件均真时执行某条语句。例如，通过输入 `if\
  \ (a == b && c == 2)`，我们的意思是“如果 a 等于 b 且 c 等于 2”。在这种情况下，使用运算符 `&&` 表示“与”（AND），即两个条件都必须为真。我们可以将其此比为决定明天是否去航海。\n\
  \n例如，我们可以将句子“如果天气晴朗且风速小于 5km/h，我将去航海”翻译如下：\n\n```cs\nif (weatherIsSunny == true\
  \ && windSpeed < 5) IGoSailing = true;\n```\n\n在创建条件时，就像大多数自然语言一样，我们可以使用表示为 `||`\
  \ 的或逻辑运算符。参考前面的例子，我们可以将句子“如果天气太热或风速超过 5km/h，我就不去航海”翻译如下：\n\n```cs\nif (weatherIsTooHot\
  \ == true || windSpeed > 5) IGoSailing = false;\n```\n\n另一个例子如下。\n\n```cs\nif (myName\
  \ == \"Patrick\") alert(\"Hello Patrick\");\nelse alert (\"Hello Stranger\");\n\
  ```\n\n在上一段代码中，如果变量 `myName` 等于 \"Patrick\"，我们就显示文本 \"Hello Patrick\"；否则，我们显示消息\
  \ \"Hello Stranger\"。\n\n当我们评估真和假条件时，我们实际上在应用所谓的“布尔逻辑”（Boolean logic）。布尔逻辑处理具有两个值\
  \ 1 和 0（或真和假）的布尔数。通过评估条件，我们实际上在处理布尔数并应用布尔逻辑。虽然你不需要深入了解布尔逻辑，但某些布尔逻辑运算符是非常重要的，包括 `!`\
  \ 运算符。它表示“非”（NOT）或“相反”。这意味着如果一个变量为真，它的相反则为假，反之亦然。例如，如果我们考虑变量 `weatherIsGood = true`，则\
  \ `!weatherIsGood` 的值将为假（它的相反面）。因此，条件 `if (weatherIsGood == false)` 也可以写成 `if (!weatherIsGood)`，其字面意思是“如果天气不不好”。\n\
  \n让我们实验一下条件语句：\n\n*   请打开 `Program.cs` 文件。\n*   在 `Main` 方法末添加以下代码（加粗部分为新代码）：\n\n\
  ```cs\nConsole.WriteLine(\"My age is \" + age);\nConsole.WriteLine(\"Please enter\
  \ your name: \");\nstring nameOfUser = Console.ReadLine();\nif (nameOfUser == \"\
  Patrick\") Console.WriteLine(\"Hello Patrick\");\nelse Console.WriteLine(\"Hello\
  \ Stranger\");\n```\n\n在上一段代码中：\n\n*   我们写了一条要求用户输入名字的消息。\n*   我们声明了变量 `nameOfUser`。该变量将包含用户输入的答案（一个字符串）。\n\
  *   我们使用 `Console.ReadLine` 方法存储名称，这是 C# 提供的一个方法，用于读取用户输入的文本（在用户按下回车键后）。\n*   一旦用户输入了名字，它就会存储在变量\
  \ `nameOfUser` 中。\n*   我们随后根据 `nameOfUser` 的值执行语句。\n\n当我们评估真和假条件时，我们实际上在应用所谓的布尔逻辑。布尔逻辑处理具有两个值\
  \ 1 和 0（或真和假）的布尔数。通过评估条件，我们实际上在处理布尔数并应用布尔逻辑。虽然你不需要深入了解布尔逻辑，但某些布尔逻辑运算符是非常重要的，包括 `!`\
  \ 运算符。它表示“非”或“相反”。这意味着如果一个变量为真，它的相反则为假，反之亦然。例如，如果我们考虑变量 `weatherIsGood = true`，则\
  \ `!weatherIsGood` 的值将为假（它的相反面）。所以条件 `if (weatherIsGood == false)` 也可以写成 `if (!weatherIsGood)`，其字面意思是“如果天气不”。”。\n\
