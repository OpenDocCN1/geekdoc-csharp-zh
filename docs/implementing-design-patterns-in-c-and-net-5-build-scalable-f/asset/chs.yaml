  3.  根据你在这一章中学，创建一个除本章给出的示例之外的可以应用工厂方法的假设场景。\n\n\n\n\n\n系统之间的集成是现代应用程序最常见的场景之一。通常，一家公司必须使用多个系统来满足支持其业务流程的所有需求。通常，它们使用不同的应用程序来支持这些流程，而所使用的软件可能没有遵循相同的接口规范和协议。正因如此，使用适配器模式（adapter\
  \ pattern）帮助我们创建一个友好的接口，允许不共享兼容输入输出的系统之间进行正确的通信。这个问题可能不仅存在于不同公司开发的系统之间，也可能存在于同一公司的遗留项目与新项目之间。\n\
  \n学习适配器模式让你有机会构建一种优雅且高效的架构，以便在不兼容的系统之间创建接口，并应用 SOLID 原则的最佳实践（如开闭原则），以便在不改变过程中涉及的所有部分之原始实现的情况下，扩展组件之间的集成。适配器设计模式的知识让你在开发或修改软件、或创建应用程序架构时，有机会展示面向对象编程的实践。\n\
  \n通过本章，你将有机会使用 `C#` 语言理解适配器模式，并在逐步示例中应用其概念。\n\n## 结构\n\n在本章中，我们将讨论以下主题：\n\n* 适配器模式概念\n\
  * `C#` 和 `.NET Core` 中的示例\n\n# 目标\n\n学习本单元后，你应该能够：\n\n* 理解适配器模式\n* 将适配器模式应用到现实世界的项目中\n\
  * 在现有库和遗留项目中识别适配器模式的使用\n\n# 11.1 适配器模式定义\n\n适配器模式是软件开发中使用的最重要的模式之一。它支持简化异构系统之间的集成。通常，人们会面临涉及组件之间兼容性方面的问题。此外，通常一个组件是为了特定目的而创建的，与其他组件的集成可能会产生额外的需求，为了使集成工作并保持原始系统不变，必须避免对源和目标产生破坏性更改。\n\
  \n如果一个系统包含与任何其他外部资源的集成，从本质上说该系统已经在隐地使用适配器模式。源和目标之间的数据格式或方法签名可能完全不同，包括与数据库连接的情况。每个数据库都有特定的存储数据方式，但通常在\
  \ `C#`或其他语言中有一个库来方便数据库与应用程序之间的通信。因为数据库使用特定的协议和格式解释数据，而 `C#` 语言期望接收到类、对象或原始类型的输出。\n\
  \n必须创建一个适配器以允许使用提供有用功能的原生不兼容接口，同时保持两个或多个部分的原始实现保持不变。例如，如果系统需要处理 `JSON` 格式的数据，而遗留项目返回\
  \ `XML` 格式的数据，强烈建议保留原始遗留系统的 `XML` 格式，即不要破坏当前接口，并创建一个适配器将旧系统返回的 `XML` 转换为 `JSON`\
  \ 格式。在许多情况下，与其他系统的集成是通过使用第三方软件实现的，而他们的系统不支持修改或对原始源代码进行任何更改。在这种情况下，考虑到对遗留代码的任何更改可能在代码解释、适应性以及开发团队对遗留技术的熟悉程度方面带来巨大挑战，软件开发的成本将显著增加。\n\
  \n考虑到在不影响涉及部分的情况下制作适配器，该模式要求人们创建一个适配器类，负责将源格式转换为目标类预期的格式，反之亦然。这是集成中的一个关键点，并遵循 SOLID\
  \ 原则所述的开闭原则。通常，适配器模式必须具有如下图所示的结构：\n\n![](img/Figure-11.1.jpg)\n\n**图 11.1:** 适配器模式图\n\
  \n系统之间的集成在复杂性方面可能有不同的水平，但总来说，适配器模式的结构保持相同的逻辑；然而，它扩展了接口以允许目标和源之间的通信，通常是因为输入输出的格式不兼容。这种结构让我们有机会拥有许多连接器和多个适配器，它们之间都是相互独立的。这避免了在生产环境中出现不兼容错误的可能性。\n\
  \n# 11.2 适配器模式实现\n\n正如前面的章节中关于其他设计模式的那样，对适配器模式的正确理解需要实现一个类似于真实场景要求的项目。想象这样一个场景：一家在线商店拥有一个\
  \ 20 年前开发的遗留系统，它以 `XML` 格式返回客户信息。`XML` 格式在二十年前非常常见。公司决定保持系统现状，因为软件是稳定的，而且公司与另一个供应商在软件许可方面签有终身合同。因此，旧系统需要保持其所有当前接口的完整，以便与当前供应商继续提供功能。\n\
  \n该公司目前使用的其他系统是使用 `.NET Core` 和 `C#` 语言等现代技术开发的。新系统暴露的所有 API 都基于 `JSON` 格式并基于 `REST`\
  \ 技术。这意味着遗留系统提供的任何输出在格式上与期望使用 `JSON` 格式消息的新型系统并不直接兼容。\n\n解决这个问题有几种方案。其之一是用较新的系统替换旧系统，从而可以在公司使用的所有系统中维护相同的技术。然而，这需要开发团队迁移到另一种技术花费大量时间，而且资源必须投入到其他项目中。因此，在这种假设的情况下，负责截止日期、成本和总体项目决策的高层管理人员可能会拒绝建议的第一种方案。\n\
  \n第二种替代方案是修改遗留系统以以 `JSON` 格式响应，以便与其他系统兼容。然而，在给定的场景中，该系统不支持修改，无法访问源代码，供应商公司也不允许对核心进行更改。\n\
  \n在这种背景下，最后的选择是创建一个适配器，以适当管理新系统期望的格式与遗留系统提供的格式之间的差异。这种方法允许我们创建一个封装器来处理 `XML` 格式，并在不修改涉及的任何系统的情况下将响应转换为\
  \ `JSON`。\n\n\n\n\n\n遵循适配器模式建议的结构，并满足示例场景中描述的要求，解决方案的实现必须指定一个适配器，负责将来自旧系统的响应转换为新系统能够解释的格式。这种方法允许我们将应用程序与其他系统连接起来，以防不同的系统需要将其数据翻译成目标应用程序可理解的格式。正如在类此类解决方案中可以实现到的那样，在任何提供数据库集成的库中，发现类似的方法是非常常见的，例如\
  \ `Entity Frame work` 和 `Hibernate`。实际上，这些库创建了一个包装器来连接两个不同的系统（应用程序和数据库），而标准的 `ADO.NET`\
  \ 技术提供了通用接口，允许任何数据库提供程序为 `C#` 语言开发它们自己的包装器。正如你可能已经意识到的，`ADO.NET` 中的某些类带有 `adapter`\
  \ 后缀，这意味着它使用了与适配器设计模式完全相同的概念。考虑到我们的示例场景，适配器模式的架构将具有如下所示的结构：\n\n![](img/Figure-11.2.jpg)\n\
  \n**图 11.2:** 适配器模式实现图\n\n此图类似于 *图 11.1* 中所示的，不同之处组件现在已根据业务需求进行了正确命名。每当需要定义软件架构时，建议在确定最终架构版本之前，先指定要使用的模式的细节。在任何编程语言中使用任何设计模式，都必须让在该项目的开发者以及未来负责维护软件的开发者能够识别。出于这个原因，通常所有与设计模式相关的类和接口在它们的名称中都包含关于它们意图实现的设计模式的引用。\n\
  \n在现实场景中，如果设计模式与其他模式结合使用且没有正确命名，可能很难维护和识别其用途。设计模式实现中出现额外困难的另一个原因是当使用错误的模式来解决特定问题时。在项目中，经常发现使用某种设计模式，并不是因为项目需要它，而是因为某个开发者出于学习目的而想使用该模式。然而，使用任何设计模式的决定必须基于业务需求中说明需要解决的问题。\n\
  \n考虑到使用适配器模式的假设场景，下一步是创建实现该模式所需的代码。一旦场景定义了旧系统提供客户信息，我们就必须开发类来模拟其行为。创建的第一个类是旧项目使用的\
  \ `Customer` 类，如下截图所示：\n\n![](img/Figure-11.3.jpg)\n\n**图 11.3:** Customer 类\n\n\
  如前面的截图所示，所有的类属性都被标记为 XML 属性，以便序列化为 XML 格式并准确地模拟旧系统的行为。下一步是创建一个逻辑类，负责以 XML 格式返回客户列表以供演示。在现实的场景中，一旦旧项目返回数据，这种实现将是不必要的。但是，如果你想在本章中完整实现适配器模式示例，你也必须创建这些类。这可以在标准的控制台应用程序中完成，这也是本节采用的方法。逻辑客户类将具有如下截图所示的实现：\n\
  \n![](img/Figure-11.4.jpg)\n\n**图 11.4:** Customer 逻辑类\n\n类构造函数创建一个包含五个客户的列表，并且\
  \ `GetCustomers` 方法使用了 `virtual` 修饰符，在需要时可以覆盖其实现。最初，该方法将客户列表序列化为 XML 格式，这非常适合模拟我们场景中旧项目的行为。考虑到所有关于旧软件的类已经创建，下一步是指定实现适配器模式所需的接口和类。你必须创建的第一个是\
  \ `ICustomer` 接口，用于抽象 `CustomerLogic` 类执行的操作，如下截图所示：\n\n![](img/Figure-11.5.jpg)\n\
  \n**图 11.5:** Customer 接口\n\n之后，需要创建该模式的主类，引用旧的客户逻辑类和新的 `ICustomer` 接口，如下截图所示：\n\
  \n![](img/Figure-11.6.jpg)\n\n**图 11.6:** Customer 适配器类\n\n如之前的截图所示，客户适配器类继承自客户逻辑类，并覆盖了\
  \ `GetCustomers` 方法，使用必要的实现将 XML 内容转换为关于客户列表信息的 JSON 格式。为了实现上述代码，必须安装 `Newtonsoft.Json`\
  \ 包，以便在 JSON 序列化方面获得额外选项。在 NuGet 包窗口中，搜索该包并安装它，如下截图所示：\n\n![](img/Figure-11.7.jpg)\n\
  \n**图 11.7:** NewtonsoftNuGet 包\n\n考虑到完整的适配器模式示例已经实现，现在已经可以使用并验证整个结构是否按预期工作。为了验证\
  \ `adapter` 类，你可以在控制台应用程序中创建一个新实例并调用 `GetCustomers` 方法，如下截图所示：\n\n![](img/Figure-11.8.jpg)\n\
  \n**图 11.8:** 适配器模式客户端\n\n适配器模式与其他模式相比非常简单，因为它不需要创建多个类和接口。只有一个类负责协调两个不同系统之间的通信。尽管它很简单，但使用适配器模式代表了集成不共享相似接口的系统和组件的强大且安全的方法。这使得在不更改源代码的情况下扩展功能成为可能。\n\
  \n# 结论 (#toc.xhtml_s133a)\n\n在本章中学，适配器模式是集成需要通信和交互但不共享相似输入输出格式的系统的强大解决方案。\n\n\n\n\
  \n\n这种模式是最常实现的设计模式之一。一旦实现，适配器模式就能极方便基于面向对象编程范式的软件应用程序之间的通信。在底层，，该模式使用了 SOLID 原则中阐述的开闭原则，该原则代表了在不改变参与交互的任何组件的行为的情况下，扩展特定例程功能的良好实践。在这种情况下，源类和目标类（或组件）将保留现有的接口，同时允许这些接口具有扩展性，以便传递内容和格式不同的数据。适配器模式通过单个适配器类维护了在两个组件之间进行数据转换的职责。\n\
  \n在本章中，你学习了如何使用 C# 语言在真实场景中实现适配器模式，并能够理解通用设计模式的核心目的。设计模式的本质在于遵循面向对象编程的最佳实践来解决软件开发中的问题，并应用许多市场公司广泛使用的解决方案。\n\
  \n在下一章中，你将有机会继续使用 C# 语言和 `.NET Core` 平台继续你的设计模式之旅，学习组合模式，并应用你在书的前几个章节中获得的所有通用知识。\n\
  \n## 记忆点\n\n- 适配器模式是最简单的设计模式之一，但它的使用代表了一种强大的系统集成方式。\n- 适配器模式不需要创建多个类和各种层次，仅需要创建适配器类。\n\
  - 同样的模式被大量用于负责数据库交互和外部资源操作的库中。\n\n## 单选题\n\n1. **哪项选项不代表适配器模式的特征？**\n    1. 适配器模式有助于系统之间的集成。\n\
  \    2. 适配器模式复杂且难以实现。\n    3. 数据库集成广泛使用该模式。\n    4. 以上均不是。\n\n2. **系统之间的集成逻辑应该放在哪个类中？**\n\
  \    1. 适配器类\n    2. 客户端应用程序\n    3. 系统中的抽象类\n    4. 源类\n\n## 答案\n\n1. b\n2. a\n\
  \n## 思考\n\n1. 解释适配器模式的主要目的。\n2. 根据你在本章中所学的知识，创建一个在本章给出示例之外可以应用适配器模式的假设场景。\n3. 解释适配器模式的优点。\n\
  4. 你目前正在的项目中是否有实现了适配器模式的项目？\n\n## 核心术语\n\n- **适配器 (Adapter)**：软件开发中的一种架构概念，允许我们在具有不同协议的组件之间构建中间层。\n\
  - **集成点 (Integration points)**：系统中的需要接口、中间应用程序和协议来建立适当通信的组件。\n\n# 第 12 章\n\n## 组合\
  \ (Composite)\n\n在任何编程语言中，分级和递归结构的表示在性能、设计和复杂性方面始终是一个巨大的挑战。组合设计模式允许我们抽象多个相关层级对象的场景背后的纠缠。这将使得涉及的原始类保持相互独立。该模式与本书之前解释过的里氏夫替换原则密切相关。在设计模式方面，你将能够实现不同知识领域的概念与软件开发良好实践之间的联系，这些领域包括\
  \ SOLID 原则、面向对象编程、软件架构和软件质量保证。\n\n学习组合模式使你有理解继承的重要原则的机会。你还将学习到正确使用接口背后的主要目的。你还将有机会应用与扩展性、可维护性和可测试性的高级软件架构概念。\n\
  \n通过本章，你将有机会使用 C# 语言在实际示例中应用组合模式，并逐步构建一个真实的程序。\n\n## 目录结构\n\n在本章中，我们将讨论以下主题：\n\n\
  - 组合模式概念\n- C# 和 `.NET Core` 中的示例\n\n# 目标\n\n学习完本单元后，你应该能够：\n\n- 理解组合模式\n- 识别该模式中展示的\
  \ SOLID 原则的使用\n- 在真实程序中应用组合模式\n\n### 12.1 组合模式定义\n\n组合模式规定，一组对象的行为必须与组中所有单个元素的行为相同。换句话说，组合模式抽象了不同组件或对象之间的关系，并允许像调用父元素一样从子元素中调用方法。在现实场景中，一个元素可能拥有许多相同类型的子，如`图\
  \ 12.1`所示：\n\n![](img/Figure-12.1.jpg)\n\n**图 12.1：** 组合模式图\n\n在特定的上下文中，一个组件可以由单个元素组成，也可以由具有许多关联子元素的父元素组成。客户端应用程序对元素的组成一无知。所有元素都被视为相同的，抽象了父元素和子元素之间的差异。正如之前提到的，参与此过程的所有组件和类都属于相同类型或共享相同的接口，这允许向客户端应用程序隐藏实现细节。这就是`第\
  \ 3 章：面向对象编程的基本概念]``中解释的里氏原则背后的原理。\n\n或者，组合模式可以使用分级图来表示，这在视觉上更容易理解，并且更接近该模式最常使用的情况。如`图\
  \ 12.2`所示，一个特定元素可能有多个子元素；即使它们属于同一种类：\n\n![](img/Figure-12.2.jpg)\n\n**图 12.2：**\
  \ 分级表示\n\n这种结构出现在许多应用程序中，包括 Web、移动端和桌面应用程序中的菜单界面组件。考虑到组合模式的架构类似于树，图中的单个元素可以称为`叶子节点\
  \ (leaf)`，而所有包含子元素的元素可以称为`组合 (composite)`。通过实际的现实示例可以更容易理解这种模式，你将在下一节有机会看到并实现一个涉及该模式的项目。\n\
  \n在许多情况下，组合元素可能包含其他组合元素作为子元素，取决于需求。组合模式允许我们实现一种解决方案，允许我们在相同类型的类之间或共享相同接口的元素之间建立无限的层级关系。此外，这种模式是一种优雅且灵活的解决方案，使我们能够减少所需类的数量。这使得我们能够定义一个可以同等应用于解决方案中所有元素以及所有层级的模式，从而构建复杂的结构。\n\
  \n### 12.2 组合模式实现\n\n\n\n\n理解任何设计模式的最佳方法是在程序中实现它，并体验其所有的优点和局限性。使用设计模式背后的技术决策必须聚焦于需要解决的问题上。只有当系统需要实现共享相同接口的类之间的层级关系时，使用组合模式（composite\
  \ pattern）才是合理的。想象这样一个场景：一家在线商店包含单个产品，公司决定不仅销售产品本身，还将一组产品作为一个整体产品进行销售。虽然整体产品被视为一组产品，但整体产品本身也应该被视为一个产品，因为它具有价格、名称、条形码等属性。\n\
  \n系统可能会随着时间的推移而变化。在未来，这家假设的公司可能会决定提供不同的产品组合作为组合单品。这将导致复杂性增加，并使系统维护变得越来越困难。这正是组合模式试图解决的问题，即在父元素中拥有无限数量子元素的可能性。对该规范的完整实现在数据库结构、性能以及实体之间的关系方面带来了新的挑战。然而，本节的示例场景侧重于应用程序的实现部分，使用了\
  \ C# 语言。\n\n### 组合模式架构\n\n考虑到给定的场景，根据组合模式提出的架构，我们的系统需要完成以下任务：\n\n*   为 `Product`\
  \ 实体创建一个通用接口。\n*   开发实现 `Product` 接口的 `Product` 具体类。\n*   定义组合类及其负责添加和删除子元素的方法。\n\
  *   指定仅属于子类的自定义方法。\n\n如组合模式的定义所示，根据要求，元素可能具有子元素，也可能没有。在这种情况下，尽管所有元素共享相同的接口，但需要在组合类中定义一个特定的自定义方法，以区分单个元素和组合元素。根据本节指定的所有要求，我们的在线商店实现将具有图\
  \ 12.3*所示所示的结构：\n\n![](img/Figure-12.3.jpg)\n\n**图 12.3:** 组合模式实现\n\n如上一图所示，`combo`\
  \ 和 `product` 类共享相同的接口，但只有 `combo` 类拥有负责添加和删除产品的方法。考虑到 `combo` 类是一个包含其他产品的产品，该类代表了组合模式所说的组合类。需要强调的是，正确使用接口允许我们创建实用的抽象，类似于实现其他设计模式时所示的那样。\n\
  \n学习接口、继承和抽象类的更高级概念非常重要。如果你不熟悉这些概念，建议你查看第 5 章：C# 中的封装与多态*，该章节使用 C# 语言阐述了详细的解释和实际示例。\n\
  \n### 在 C# 中实现\n\n本节的意图是构建一个在线商店，允许我们创建产品，但要求其中某些产品可能代表多个产品的列表，但作为单个产品销售。正如本节之前解释的，在实现方面，为了实现所有目标首先需要开发的是创建一个被所有产品使用的通用接口。在此语境下，一组产品被称为\
  \ *combo*。因此，使用 Visual Studio 创建一个控制台应用程序（Console Application），并创建一个如下屏幕截图所示结构的接口：\n\
  \n![](img/Figure-12.4.jpg)\n\n**图 12.4:** IProduct 接口\n\n接口必须包含在单个产品类和 `combo` 类之间共享的所有属性和方法。每种类型的类将在细节和定价方面实现不同的逻辑。并不是所有产品都包含子产品。此外，只有组合类应该拥有添加和删除子元素的例程。这些方法没有放在接口中，以避免出现实现方面的错误以及对组合模式的误用。具体类将使用接口中定义的\
  \ `Category` 属性为了演示目的而区分单个产品和 `combo`。\n\n考虑到接口已经创建，下一步是创建 `Product` 和 `Combo` 类。在你的控制台应用程序项目中创建一个名为\
  \ `Product` 的新类并实现 `IProduct` 接口，如下屏幕截图所示：\n\n![](img/Figure-12.5.jpg)\n\n**图 12.5:**\
  \ Product 类\n\n如代码示例所示，该类包含了接口定义的所有属性和方法，且 `GetProductDetails` 方法的实现显示了产品详情摘要，例如名称、价格和类别。这仅用于演示目的。在实际场景中，此方法将包含从数据库获取信息的实现，或者用于构建产品详情的更复杂的逻辑。然而，目前的实现足以让你熟悉组合模式的行为，并跟踪单个\
  \ `Product` 与包含子产品的组合产品之间的区别。\n\n此外，`Product` 类中的 `GetPriceDetails` 实现了显示产品原价的功能。它目前还不允许应用特殊折扣。在这种情况下，所有将单个产品作为其子产品列表一部分的对象（`Combo`\
  \ 类）都将自动继承该值。这种结构允许我们保持单个产品和组合对象相互独立，尽管它们共享类似的接口。最后，所有的组合对象本身都是产品。\n\n下一步需要创建 `Combo`\
  \ 类，它是一个产品，但包含了与之相关的其他产品。请注意这个概念与仅仅是一组对象是不同的。`Combo` 类仍然具有与单个产品相同的特征，例如名称、价格和其他属性。在这种情况下，考虑到图\
  \ 12.2*所示的图表，组合是一个产品并包含其他节点。每个单独节点可以包含一个子产品。递归地，子产品可以由多个子产品组成。这是一个强大且灵活的结构，用于表示产品和子产品之间需要层级关系的业务流程。`Combo`\
  \ 类的实现如下所示：\n\n![](img/Figure-12.6.jpg)\n\n**图 12.6:** Combo 类\n\n`Combo` 类实现了 `IProduct`\
  \ 接口，并与 `Product` 类有显著区别。在 `Combo` 类中，添加了一个表示与组合关联的子产品的私有属性。此外，该类还属于两个方法，负责向列表添加新产品以及从子产品列表中删除现有产品，即\
  \ `AddProduct` 方法和 `RemoveProduct` 方法。为了演示目的，方法的内容被隐藏了，但它们的实现细节如下所示。\n\n\n\n\n\n\
  `Combo` 类中 `IProducts` 列表的存在说明了如何将一个普通的个体类转换为组合类。然而，尽管 `Product` 和 `Combo` 类是相似的，但\
  \ `Combo` 类包含了额外的逻辑来处理与该组合实例相关的子产品。正如图 12.5 所示，`Product` 类的 `GetProductDetails`\
  \ 和 `GetProductPrice` 包含了仅处理产品本身的逻辑。相反，`Combo` 类中的相同方法要复杂得多，它们包含了用于管理其子产品的代码。请注意，每个子产品的详情都使用子元素的方法，如下幅截图所示：\n\
  \n![](img/Figure-12.7.jpg)\n\n**图 12.7：** Combo 类的详情方法\n\n`GetProductDetails` 方法包含一个自定义实现，除了显示\
  \ `Combo` 详情外，它还会遍历子产品列表，并运行子元素中相同的方法。这样一来，子类的实现得以保留，而父类则有权决定如何处理它自己的方法。请记住，组合对象可以是其他组合对象的子对象，从而在所有共享相同\
  \ `IProduct` 接口的对象之间建立无限的 set 关系。如果开发的实现不允许这种行为，那么组合模式的实现可能编写错误了。\n\n继续查看 `Combo`\
  \ 类方法，如之前的截图所示，`GetPriceDetails` 方法遍历每个子产品并增加 `Combo` 类的 `Price` 属性以计算最终价格。因此，子类中的相同方法与组合类的实现有所不同。到此时，我们的完整组合模式实现已经就绪。现在，是时候在客户端控制台应用程序中使用这些类了。\n\
  \n例如，想象这样一个场景：有三种产品（书、笔记本电脑和显示器），在线商店公司想要单独销售每种产品，并带有各自独立的价格。然而，在某个场合，有一个促销活动允许在线商店提供一个名为\
  \ `techCombo` 的组合。该优惠将这三个产品打包成一个。在组合模式的概念中，书、笔记本电脑和显示器应该使用 `Product` 类来指定，而 `techCombo`\
  \ 应该使用 `Combo` 类创建，因为该组合包含了子产品。在创建了前三个产品的每个个体实例后，你必须将产品添加到 `combo` 对象中，如下截图所示：\n\
  \n![](img/Figure-12.8.jpg)\n\n**图 12.8：** 客户端应用程序\n\n`main` 方法的前三行创建了三个产品，为它们每一个分配了\
  \ `Name`、`Price` 和 `Category` 属性。随后，在第 13 行创建了 `techCombo` 对象。在接几行中，三个产品被添加到 `techCombo`\
  \ 对象中。考虑到 `Combo` 类有额外的方法来处理新子产品的添加和删除，你必须查看只属于 `Combo` 类的方法，这些方法在以下截图中被亮亮：\n\n\
  ![](img/Figure-12.9.jpg)\n\n**图 12.9：** 添加 (AddProduct) 和删除 (RemoveProduct) 方法\n\
  \n关于 `Combo` 类的更多细节可以查看图 12.6，但关于这两个方法，如之前的截图所示，它们接收一个实现 `IProduct` 接口的对象。`AddProduct`\
  \ 方法将产品添加到 `Combo` 类开头指定的私有列表中，而 `RemoveProduct` 方法从同一个列表中删除产品。如果你运行控制台应用程序，你将得到如下截图所示的结果：\n\
  \n![](img/Figure-12.10.jpg)\n\n**图 12.10：** 客户端应用程序结果\n\n控制台应用程序首先打印书、笔记本电脑和显示器的详情，然后打印\
  \ `techCombo` 对象的详情（`Total Price`）。你可以通过总价验证实现是否按预期工作。组合的最终价格代表与组合相关的所有产品价格之和。\n\
  \n组合模式允许我们使用相同的类创建更复杂的结构，这可以通过将一个组合对象关联到另一个 `combo` 对象来实现，如下截图所示：\n\n![](img/Figure-12.11.jpg)\n\
  \n**图 12.11：** 组合聚合\n\n在这个新的示例中，创建了两个组合对象。每个 `combo` 对象由三个不同的产品创建。第一个组合包含书、笔记本电脑和显示器。第二个组合包含鼠标、键盘和鼠标垫。在程序结束时，第二个组合作为一个产品添加到第一个组合中。因此，组合中的子元素是产品还是组合并不重要，因为它们都实现了相同的\
  \ `IProduct` 接口。\n\n如果你在这些更改后运行应用程序，你将得到如下截图所示的结果：\n\n![](img/Figure-12.12.jpg)\n\
  \n**图 12.12：** 组合聚合结果\n\n尽管与第一个组合相关的子产品包含了产品和另一个组合，最终价格仍然被正确计算。组合模式给我们的灵活性是强大的。递归算法的实现始终是一个巨大的挑战，而面向对象的编程范式为这个等式增加了额外的挑战。\n\
  \n最后，希望本章的内容能帮助你理解并熟悉组合模式，它是多年来软件开发中最常用的模式之一。我鼓励你构建自己的自己的项目，创建一个另一个假设的场景，这将让你有机会应用你在本章中学到的知识。\n\
  \n# 结论 (#toc.xhtml_s143a)\n\n正如在本章中所学到的，组合模式允许我们为复杂问题创建一个既复杂又简单的解决方案，该方案涉及在应用程序中递归地拥有层次结构。组合模式是软件开发中使用最广泛的模式之一。然而，它的实现是相当困难且复杂的。要有效应用这种模式需要对应用程序业务有完全的理解。元素与其子元素之间层次关系的抽象有时可能会具有挑战性。组合模式为我们提供了优雅的架构，允许我们无限制地扩展和增强功能。\n\
  \n在本章中，你学习了如何使用 C# 语言实现组合模式。你现在应该能够理解如何应用面向对象编程的最佳实践，使用组合模式为复杂问题提供简单的解决方案。\n\n在下一章中，你将有机会继续使用\
  \ C# 语言和 .NET Core 平台继续你的设计模式之旅，学习代理模式，并应用你在本书之前章节中收到的所有通用知识。\n\n# 知识点回顾 (#toc.xhtml_s144a)\n\
  \n*   组合模式在类和子类之间使用相同的接口。\n\n*   组合模式的实现要求组合类在构造中包含一个子类列表。\n\n\n\n\n\n*   组合模式允许将一个组合类的规范作为另一个组合结构的子类。这种抽象没有限制，具有递归的灵活性。\n\
  \n## 多选题\n\n1. **组合模式在以下哪种情况下是适用的？**\n    1. 需要非层级架构的系统。\n    2. 包含海量类型的系统。\n  \
  \  3. 任何基于面向对象编程范式的软件。\n    4. 元素必须以层级形式表示的功能模块。\n\n2. **观察本章提供的示例，哪种替代包含了组合类？**\n\
  \    1. `IProduct` 接口\n    2. 客户端应用程序\n    3. `Combo` 类\n    4. `Product` 类\n\n\
  ## 答案\n\n1. d\n2. c\n\n## 思考\n\n1. 解释组合模式的主要目的。\n2. 根据你在本章中所学的内容，在本章给出的示例之外，创建一个可以应用组合模式的假设场景。\n\
  3. 解释可以使用组合模式的场景类型。\n4. 你目前正在的项目中有没有实现组合模式的？\n\n## 关键术语\n\n* **层级结构 (Hierarchical\
  \ structure)**：父对象与子对象之间的关系。\n* **递归 (Recursion)**：一种让函数调用自身的技术。这种技术提供了一种将复杂问题分解为更容易解决简单问题的方法。\n\
  \n## 第 13 章\n\n### 代理 (Proxy)\n\n安全和访问控制是大多数软件应用程序的基本组成部分。安全和访问控制对于公司的运营也至关重要，这通常包括正确实施策略，以确保只有相关资源被其他系统（内部或外部）访问。\n\
  \n代理模式帮助我们构建一种架构，通过仅允许客户端所需的操作和数据，来控制从外部源对特定资源的访问。此外，该模式代表了一种优雅的方法用于拦截 API 请求并为客户端应用程序添加额外功能，而无需更改源应用程序的常规行为。\n\
  \n学习代理模式让你有机会了解如何对简单和复杂的系统集成实现访问控制，这些系统共享相同的接口，但由于业务和安全需求，需要对客户端应用程序访问其数据和操作进行限制。\n\
  \n在本章中，你将有机会使用 C# 语言在实际案例示例中应用代理模式，逐步构建一个应用程序。\n\n## 结构\n\n在本章中，我们将讨论以下主题：\n\n*\
  \ 代理模式概念\n* C# 和 .NET Core 中的示例\n\n## 目标\n\n学习本单元后，你应该能够：\n\n* 理解代理模式\n* 识别 `.NET`\
  \ 应用程序和现有项目对代理模式的使用\n* 在实际应用中应用代理模式\n\n### 13.1 代理模式定义\n\n代理模式的目标是调解两个或多个组件之间的通信，目的是控制对源功能的访问。\n\
  \n根据定义，代理模式很容易与适配器模式混淆。这两种模式的目都是调解对特定资源、类或功能的直接访问。然而，它们的目的看起来非常相似，但每种模式背后的意图是完全不同的。适配器模式的目标是提供一个客户端应用程序可以理解的输出，以防另一个类具有不同的接口或输出。\n\
  \n这种代理模式不涉及更改客户端应用程序的输出或数据格式，仅用于过滤和限制对某些功能的访问。\n\n### 13.1.1 代理模式类型\n\n考虑到使用代理模式的许多原因，可以将其分为以下类型：\n\
  \n* **智能代理 (Smart)**：这种类型的目的是当客户端应用程序访问特定的其他资源或类时，执行额外操作。这种代理模式用于为客户端应用程序提供额外功能，而无需客户端应用程序感知，例如登录操作。\n\
  * **保护代理 (Protection)**：这种代理类型的主要意图是添加安全控制并限制对某些功能的访问。这种类型通常用于 API，其中根据客户端应用程序的配置文件或用户来限制可用方法。\n\
  * **缓存代理 (Cache)**：在许多场景下，方法或 API 返回的数据并不频繁。在这种情况下，可以实现一个代理类来处理缓存操作，以避免对某些昂贵资源（如数据库）进行额外的必要的调用。\n\
  * **虚拟代理 (Virtual)**：有时代理模式可以用于简化从资源向客户端应用程序提供的输出。在这种情况下，简化意味着减少方法或函数，而不一定将输出解析为另一种格式。\n\
  * **远程代理 (Remote)**：这是代理模式最常见的用途之一，它由创建一个负责中间访问远程资源的中间件。客户端应用程序并不一定知道资源托管在哪里，与远程组件通信背的所有复杂性都由代理组件抽象化。\n\
  \n软件开发中展示的良好实践之一是组件之间的松耦合关系。在这种背景下，代理模式允许我们保护原始系统免受其他外部系统建立的需求的影响。因此，如果客户端应用程序需要与现有的第三方或外部资源集成，它们可以同时独立地存在。这是通过使用中介者来保护源系统和目标系统并实现所有需求实现的。\n\
  \n### 13.1.2 代理模式结构\n\n作为结构型模式的一部分，代理模式允许我们控制对其他对象或资源的访问。这使得在特定资源的请求生命周期中运行额外程序成为可能。\n\
  \n视觉上，代理模式的表示如图`figure 13.1(#c13.xhtml_fig13_1)`所示：\n\n![](img/Figure-13.1.jpg)\n\
  \n**图 13.1：** 代理模式图\n\n在`figure 13.1(#c13.xhtml_fig13_1)` 中，客户端应用程序需要访问一个名为 `Real\
  \ Service` 的特定服务。在这种情况下，对资源的请求被代理层拦截，允许我们应用访问控制和过滤等额外操作。例如应用程序日志操作和对其他内部服务的调用。根据代理模式提出的解决方案，客户端应用程序永远不会直接访问服务。这种限制对于具有不同要求的项目可能有不同的原因，但以下是最常见的原因：\n\
  \n* 客户端应用程序不应访问另一个应用程序提供的所有服务。\n* 对服务提供的方法和功能的访问受法律合同限制。\n* 外部服务提供的资源在成本和性能方面非常昂贵。这使得拦截请求并提供访问原始资源的替代方案变得很有理想。这种场景常见于使用数据缓存向客户端应用程序返回信息，而不是不断从数据库获取数据。\n\
  \n\n\n\n\n*   当外部资源应由不同的配置（profile）进行控制，且原始系统不支持与客户端应用程序期望接收格式相同的访问控制系统时。这种情况常见于由不同公司开发的系统之间的集成，因为这些公司并不具有共同的需求。\n\
  *   当资源被许多客户端应用程序消费，且这些应用程序在功能方面有不同的需求和期望时。可以使用代理模式（proxy pattern）将请求从客户端应用程序重定向到正确的资源或功能，而无需更改源项目和目标项目中底层代码的实现。\n\
  *   当法律或业务需求不断更改安全策略，且这些策略涉及被许多客户端应用程序使用的特定系统。\n\n在任何系统之间的集成中，对源的完全访问通常受限于集成范围，并考虑了两个或多个公司之间所有存在的法律限制。例如，许多大型信息技术公司提供基于\
  \ `REST APIs` 的人工智能服务。对资源的访问可能可能限于定价层级、安全策略、支付确认或其他底层业务规则。遵循软件架构的最佳实践，访问控制等功能可能不会直接应用于公司向客户提供的人工智能源代码。原始服务应保持不受外部干扰，例如财务信息以及原始服务之外的其他业务需求。在这种情况下，人工智能服务可以保持完整，并开发一个代理层来处理身份验证、安全、用户配置和其他信息。因此，这是代理设计模式如何应用的另一个示例。\n\
  \n# 13.1.3 在实际项目中的常见用法\n\n考虑到所有的应用能力，代理模式在市场上被广泛使用。利用代理模式可以使解决方案更加强大和健壮。行业中使用的许多\
  \ `APIs` 都涉及某种程度的安全性，并且通常实现了代理模式，而许多开发者并没有意识到这种模式实际上被使用了。\n\n在数百万用户使用的解决方案中，根据访问的设备类型提供适当响应的替代方案是非常常见的。考虑到此背景，想象这样一个场景：一个社交媒体应用程序有多个用户，且应用程序返回的数据量必须根据设备类型进行自定义。这意味着某些设备可能会接收到更多数据，而其他设备则根据其内存和处理器能力接收相应的数据。考虑到这种场景，可以使用代理层拦截来自每个设备的请求，并在响应返回之前根据设备能力应用相应的自定义操作，如\
  \ `图 13.2` 所示：\n\n![](img/Figure-13.2.jpg)\n\n**图 13.2：** 代理模式的替代表示\n\n\n\n最初，客户端应用程序请求的信息本质上是相同的，但代理应用程序为每种客户端应用程序应用自定义策略，限制移动设备的数据量，并为桌面应用程序返回完整内容。此外，代理可能负责应用安全验证，例如为移动应用程序应用\
  \ `JSON Web Token` (`JWT`)，并为 Web 和桌面应用程序应用不同的身份验证方法。所有这些方面都不会影响原始源程序，在这种语境下，源程序是一个或多个数据库。\n\
  \n在下一节中，你将有机会为一个假设的应用程序实现代理设计模式。该应用程序遵循真实世界应用程序中常见的类似需求，以便在使用 `.NET` 平台和 `C#` 语言实现该模式方面获得经验。\n\
  \n# 13.2 代理模式的实现\n\n本节包含一个示例应用程序，它处理真实世界项目中常见的、需要使用代理模式的常见。使用任何设计模式对于解决特定问题并不是强制性的。然而，有效使用设计模式通常为市场中许多行业项目中常见的共同问题提供通用的、可维护且高效的解决方案。因此，本章中的示例是处理给定问题的方法之一。\n\
  \n### 13.2.1 场景需求\n\n想象这样一个假设场景：有一个应用程序负责存储和管理与在线新闻相关的信息。每条新闻故事或文章都将关联广告。\n\n该场景具有以下需求：\n\
  \n*   新闻故事或文章必须可以在桌面、移动和 Web 平台上查看。\n*   每条单独的新闻故事或文章必须有一个类别，并可能关联多个广告。\n*   从 Web\
  \ 平台访问故事或文章时不应访问任何与 `Lifestyle` 类相关的内容。\n*   移动平台的文章或故事将不包含广告。\n\n考虑到给定的场景，三个不同的平台（桌面、移动和\
  \ Web）都将从同一个仓库中消费信息。该仓库由一个存储新闻、类别和广告相关内容的数据库组成。然而，为了增加上下文的复杂度，设定其他应用程序也在消费同一个负责与数据库通信的应用程序。该中间应用程序被称为\
  \ `ContentRepository`。因此，考虑到所有其他应用程序在任何情况下都不应影响，不允许对该应用程序进行任何更改。\n\n### 13.2.2 实际示例\n\
  \n首先使用 `Visual Studio` 创建一个 `Console Application`，然后添加与示例示例相关的类。创建的第一个类是 `News`\
  \ 类，它将包含与新闻故事或文章相关的信息，如下截图所示：\n\n![](img/Figure-13.3.jpg)\n\n**图 13.3：** News 类结构\n\
  \n创建的第二个类是 `Advertisement` 类，它将是 `Content` 类的一个属性，下文将。`Advertisement` 类的结构如下截图所示：\n\
  \n![](img/Figure-13.4.jpg)\n\n**图 13.4：** Advertisement 类结构\n\n`Advertisement` 类仅包含\
  \ `Id`、`Product` 名称以及重定向到广告的超链接。如前所述，`Advertisement` 类将是 `Content` 类的一部分，并具有一对多的关系，即内容（新闻故事或文章）可能有多个广告。\n\
  \n`Content` 类包含新闻、广告列表和类别，如下截图所示：\n\n![](img/Figure-13.5.jpg)\n\n**图 13.5：** Content\
  \ 类结构\n\n如所示，前一个截屏中的之前的代码包含了 `CategoryEnum` 枚举定义，它包含 5 个类别类型。到此时，所有必要的模型都已创建，现在可以实现\
  \ `Content` 仓库类、其接口，最后是代理模式。\n\n\n\n\n一个名为 `ContentRepository` 的应用程序负责与数据库通信并返回必要信息。为了演示之目的，在本节中，内容存储库应用程序的实现被简化为了简单的\
  \ `ContentRepository` 类，以模拟其行为。因此，该假设的类将返回有关内容、新闻和类别的必要信息。\n\n在代理模式的实现中，强烈建议 `Proxy`\
  \ 类和真实类共享相同的接口，以保持方法名和属性具有相同的签名，从而对客户端应用程序保持透明。因此，客户端应用程序并不知道没有直接访问存储库，而是实际上通过中间的代理进行访问的。该代理将管理权限、安全、过滤器和其他流程。\n\
  \n示例实现的下一步一步是创建 `IContentRepository` 接口，该接口将由真实存储库和代理类共享，其实现如下所示所示：\n\n![](img/Figure-13.6.jpg)\n\
  \n**图 13.6:** 内容存储库接口\n\n为了演示之目的，`IContentRepository` 接口仅包含一个方法。`ContentRepository`\
  \ 类和代理类都需要根据各自的需求实现它们自己的 `GetContent` 方法。\n\n接口创建完成后，下一步是创建 `ContentRepository`\
  \ 类，其实现如下图所示：\n\n![](img/Figure-13.7.jpg)\n\n**图 13.7:** ContentRepository 类\n\n\
  在这种情况下，`GetContent` 方法模拟了数据库访问，并创建了包含三个不同元素的示例列表数据，信息如下：\n\n*   `Sport` 类的内容，包含三个广告\n\
  *   `Education` 类的内容，包含三个广告\n*   `Lifestyle` 类的内容，包含三个广告\n\n这些内容足以模拟本节开始为三个不同平台定义的所有需求。代理模式实现的最后一步是创建一个负责拦截客户端应用程序请求的类或应用程序，并根据应用所有关于安全、验证和数据过滤的策略。\n\
  \n代理模式目的是提供一个中间层来管理需要应用安全和过滤的特定资源，而不影响原始真实的源应用程序。在本节给定的场景中，请求来自桌面、移动和 Web 平台的应用程序。已创建一个代理来接收请求并应用与每个平台相关的需求，避免客户端应用程序直接访问内容存储库。\n\
  \n遵循代理模式实现的最佳实践，`Proxy` 类必须实现与原始类相同的接口。考虑到给定的场景，这意味着代理类应该实现 `IContentRepository`\
  \ 接口。`ContentRepositoryProxy` 类的细节需要实现为每类型平台和类别列出的所有需求。此外，`ContentRepositoryProxy`\
  \ 类可能包含有关验证、安全策略以及任何超出原始类提供功能的自定义实现的规则。这意味着 `ContentRepositoryProxy` 类仅包含与内容相关的逻辑。额外的职责仅适用于\
  \ `Proxy` 类，以保持代理类的实现维持目前的状态。\n\n设计模式概念与软件开发中的其他实践（如 SOLID 原则）紧密相关。它们代表了许多良好实践的结合，专注于编写高标准代码并为复杂问题提供高效的解决方案。因此，严格遵循了面向对象编程范式的最佳实践。\n\
  \n`ContentRepositoryProxy` 类的实现如下图所示：\n\n![](img/Figure-13.8.jpg)\n\n**图 13.8:**\
  \ 代理类实现\n\n为了说明起见，创建了 `DeviceType` 枚举以创建一个具有三个不同值（桌面、移动和 Web）的设备类型，以便使代码更具可读性。类构造函数接收设备类型作为参数，`GetContent`\
  \ 方法包含一个语句来处理每个设备类型的不同规则。\n\n从原始存储库获取数据后，如果客户端应用程序来自移动平台，则返回所有广告信息；如果请求来自 Web 平台，则方法将过滤原始存储库返回的内容，排除任何\
  \ `Lifestyle` 类的内容。\n\n如示例所示，客户端应用程序并不直接访问内容存储库，而是使用 `ContentRepositoryProxy` 代理类，其中规则作为业务需求在代码中实现。\n\
  \n要查看代理类的结果，您可以在控制台应用程序中传递不同的参数来调用代理类，如下所示：\n\n![](img/Figure-13.9.jpg)\n\n**图 13.9:**\
  \ 控制台应用程序\n\n在这个小型程序中，`Proxy` 类被实例化三次，每种设备类型一次，控制台打印有关代理返回的内容数量的信息，然后检查是否有与它们相关的广告。考虑到需求，移动平台应该接收所有广告，而\
  \ Web 平台应该接收来自所有类别的广告（`lifestyle` 类除外）。如果你使用给定的实现运行控制台应用程序，你将得到如下所示的结果：\n\n![](img/Figure-13.10.jpg)\n\
  \n**图 13.10:** 代理模式结果\n\n`Proxy` 类工作符合预期，并说明内容存储库类不受业务需求任何额外需求的影响。此外，对已指定要求的任何更改都只会在\
  \ `ContentRepositoryProxy` 代理类内部实现，保持原始内容 `Repository` 类不受外部干扰。\n\n## 结论\n\n正如你在本章中所学到的，代理模式允许我们为需要在两个不同组件之间调解通信的场景创建一个简单的解决方案，在这种场景中需要在它们之间应用策略，并使代理类中的所有更改对客户端应用程序保持透明。这种模式的使用在外部应用程序、数据库和\
  \ API 的情况下非常常见，使我们能够保持集成不受核心源应用程序修改的影响，并保护原始源系统不受外部干扰。代理模式代表了市场上使用的最简单的模式之一。\n\n\
  通过本章，你学习了如何使用 C# 语言在真实场景中实现代理模式，并学习了如何为复杂问题应用简单的解决方案，应用了面向对象编程的最佳实践。\n\n\n\n\n在下一章中，你将有机会使用\
  \ C# 语言和 .NET Core 平台继续你的设计模式之旅，通过学习命令模式并应用你在本书前面章节中所学的所有通用知识。\n\n## 记忆要点](#toc.xhtml_s159a)\n\
  \n- 代理模式为我们提供了拦截对功能的访问并应用业务需求的机会，而不会影响原始源源类。\n- 代理模式可以在单个解决方案中与 SOLID 原则结合。\n- 在任何由于安全原因或其他类似需求需要限制对某些功能的访问的情况下，都可以应用代理模式。\n\
  \n## 多选题](#toc.xhtml_s160a)\n\n1. **代理模式在何种场景下是合适的？**\n    1. 系统之间的集成\n    2. 不需要考虑安全问题的场景\n\
  \    3. 任何使用 C# 作为语言的项目\n    4. 以上都不是\n\n2. **观察本章给出的示例，哪个类包含了代理模式所需的实现？**\n   \
  \ 1. 内容仓库类 (Content repository class)\n    2. 客户端应用程序\n    3. ContentRepositoryProxy\
  \ 类\n    4. 新闻类 (News class)\n\n## 答案](#toc.xhtml_s161a)\n\n1. a\n2. c\n\n## question](#toc.xhtml_s162a)\n\
  \n1. 解释代理模式的主要目的。\n2. 根据你在本章中所学的知识，创建一个除本章示例之外的可以应用代理模式的假设场景。\n3. 解释可以使用代理模式的场景类型。\n\
  4. 你目前正在的项目中有没有实现代理模式的？\n\n## 核心术语](#toc.xhtml_s163a)\n\n- **客户端应用程序 (Client application)**：系统的层，通常包含用户界面，在抽象方面层次较高。\n\
  - **系统集成 (System integration)**：使用定义协议在两个或多个组件之间进行通信。\n- **API**：应用程序接口，通常用于允许不同系统之间的集成。\n\
  - **缓存 (Cache)**：在软件开发中，存储在一个性能优于原始源的地方。\n\n# 第 14 章](#toc.xhtml_c14)\n\n## 命令 (Command](#toc.xhtml_c14)\n\
  \n命令设计模式允许我们在单个对象中聚合有关复杂操作的所有必要信息。这包括数据库事务、API 请求和许多类型的集成，为客户端应用程序简化了整个过程，并封装了命令类执行的所有内部操作。考虑到这种模式被集成了各种编程语言的数据库提供程序大量使用，它无疑是软件开发中最常用的设计模式之一，并应用于全球大量的项目中。\n\
  \n学习命令模式将使你有机会识别它在遗留项目中的用途，优化理解现有代码所花费的时间，并节省资源，使用 C# 语言和 .NET 平台实现新软件。\n\n通过本章，你将有机会使用\
  \ C# 语言在实际示例中应用命令模式，逐步构建一个真实的场景。\n\n## 结构](#toc.xhtml_s164a)\n\n在本章中，我们将讨论以下主题：\n\
  \n- 命令模式概念\n- C# 和 .NET Core 示例\n\n## 目标](#toc.xhtml_s165a)\n\n在学习本单元后，你应该能够：\n\n\
  - 理解命令模式\n- 识别命令模式在 .NET 和现有项目中的用法\n- 在现实场景中应用命令模式\n\n## 14.1 命令模式定义](#toc.xhtml_s166a)\n\
  \n设计模式的主要目的是通过遵循面向对象编程范式、软件架构和 SOLID 原则的最佳实践，简化复杂问题的解决方案。尽管每个模式在实现和具体意图上有所不同，但能够关注它们的原则而不是实际实现，对理解它们来说要容易得多。\n\
  \n在本章中，你将了解命令设计模式背后的细节，并将有机会理解如何在现实场景中应用其概念，即为一家在线商店实现与外部财务服务的集成。但是，首先，让自己熟悉命令模式的结构及其主要目的是至关重要的。\n\
  \n命令模式向客户端应用程序（请求者）隐藏了由应用程序另一层（接收者）执行的操作的复杂性。由于接收者完全负责执行操作，因此请求实际上需要多少个子操作并不重要。该模式背后的核心思想是允许执行许多复杂任务并将结果合并到由客户端应用程序调用的单个高级操作中，不仅可以执行操作还可以撤销这些操作，将该概念实现为事务，广泛用于数据库操作和大型业务流程的执行。\n\
  \n在命令模式的高级抽象中，其结构类似于`图 14.1`，它显示了客户端应用程序与命令模式之间的交互，甚至是每个层应拥有的职责，如`图 14.1`所示：\n\n\
  ![](img/Figure-14.1.jpg)\n\n**图 14.1：** 命令模式图\n\n如附所示，命令模式的实现需要以下部分：客户端应用程序、调用者、命令接口、命令实现和接收者。在最初，这种表示通常代表了在所有情况下该设计模式的实现。\n\
  \n然而，在需要执行多个命令的更复杂场景中，实现可能会有些不同。\n\n在相同上下文的所有命令使用公共接口允许我们增加应用程序的可测试性，因为命令可以注入类中并模拟真实命令类的行为。由于命令模式的定义可能是抽象的，始终建议通过实现你在现实场景中发现类似的内容来体验底层设计模式。正如此，你必须遵循本章提供的实践教程。\n\
  \n## 14.2 命令模式实现](#toc.xhtml_s167a)\n\n考虑到命令模式的是从客户端应用程序中抽象操作，对该模式的真实体验需要实现一个旨在解决命令模式试图解决的问题的应用程序。在本章的第一节中，如后续页面所示，你将有机会实现一个包含与在线商店通常过程相关的财务事务抽象的项目，该项目包含以下需求：\n\
  \n- 在线商店应允许用户使用信用卡支付。\n- 一旦用户完成购买，系统应减少相同产品的可用数量。\n- 如果销售了由供应商提供的的产品，则必须通知第三方供应商。\n\
  - 如果上述任何操作发生故障，系统应回滚所有操作。\n\n\n\n\n考虑到给定的场景，系统需要开发一个通用的命令接口供所有操作实现，尽管这些操作之间彼此完全不同，但操作的实现对客户端应用程序是隐藏的。不可避免的是，此示例的完整实现将涉及对外部\
  \ API 的调用、数据库集成以及与第三方系统的集成。这包括与供应商的通信，但底层实现将进行模拟，以便仅关注于命令模式的实现。\n\n关于业务模型类，该示例需要创建用于购买数据及相关数据的模型，例如客户、产品和供应商，如\
  \ *图 14.2* 所示：\n\n![](img/Figure-14.2.jpg)\n\n**图 14.2：** 命令模式类图\n\n`Purchase` 类是主类，考虑到该类将在命令模式的实现中作为参数使用，它存储了需求中规定的操作的所有必要信息。该类的实现如下截图所示：\n\
  \n![](img/Figure-14.3.jpg)\n\n**图 14.3：** Purchase 类\n\n考虑到 `Purchase` 类与 `Product`\
  \ 和 `Customer` 实体之间的关系，为了该假设场景的完整实现，下一步工作是实现 `Customer` 类，如下截图所示：\n\n![](img/Figure-14.4.jpg)\n\
  \n**图 14.4：** Customer 类\n\n产品类与供应商类包含一个一一关系，为了演示之目的，供应商类仅包含引用的模型引的属性。因此，此示例隐藏了负责与供应商进行集成过程的方法。\n\
  \n# 14.2.1 额外类](#toc.xhtml_s168a)\n\n遵循给定场景提出的需求，本章示例中的 `Product` 和 `Supplier` 类实现如下截图所示：\n\
  \n![](img/Figure-14.5.jpg)\n\n**图 14.5：** 产品类和供应商类\n\n以下是 `CreditCard` 类，它与 `Purchase`\
  \ 类相关，其实现如下截图所示：\n\n![](img/Figure-14.6.jpg)\n\n**图 14.6：** 信用卡类\n\n至此，我们已经创建了实现本章示例所需的所有模型相关类。在这种背景下，命令模式将负责通过实现通用接口来实现不同的操作。构造函数将包含一个购买对象。因此，下一步是创建具有相同实现的接口，如下截图所示：\n\
  \n![](img/Figure-14.7.jpg)\n\n**图 14.7：** 通用接口\n\n给定的接口需要实现两个方法，一个负责执行自定义操作，另一个负责在发生任何异常时回滚操作。考虑到本节提出的场景，必须创建三个不同的命令类，每个类对应一个操作：信用卡支付、存储产品信息和供应商通知。当然，对于此示例，没有必要为任何命令类实现实际操作。为了演示之目的，你可以仅指定一个\
  \ `Console.Writeline` 方法来显示实现的行为。第一个命令类演示了信用卡操作，其实现如下截图所示：\n\n![](img/Figure-14.8.jpg)\n\
  \n**图 14.8：** 支付命令类\n\n如上一个截图所示，该类实现了 `IPurchaseCommand` 接口并在构造函数中接收一个 `purchase`\
  \ 对象。这是示例中所有命令类使用的模式。考虑到整个购买过程涉及三个不同的操作，目前缺少其中两个的实现，包括供应商通知和产品存储管理。因此，需要创建的下一个命令模式实现是作为流程的一部分减少存储中产品数量信息的。该操作的底层命令类实现如下截图所示：\n\
  \n![](img/Figure-14.9.jpg)\n\n**图 14.9：** 存储命令实现\n\n如上一个截图所示，存储命令类遵循与支付命令相同的模式，只是两个方法的实现将改变以执行针对各自的自定义操作。从架构角度来看，使用相同的接口是非常重要的，以确保整个系统的所有命令类都实现本节开头所述要求的回滚过程。从这一点开始，仅剩一个供应商通知的命令类待实现。每个供应商都必须有特定的集成方式，这意味着命令设计模式可以与其他模式结合使用，例如\
  \ *第 15 章：策略* 中解释的策略模式。简化供应商命令类后，其实现如下截图所示：\n\n![](img/Figure-14.10.jpg)\n\n**图\
  \ 14.10：** 供应商命令实现\n\n创建三个必要的命令类后，下一步是创建负责封装命令类所执行操作的类。根据需求，如果操作的执行抛出异常或产生意外结果，系统应该执行针对同一操作的回滚过程。因此，直接管理命令类的类必须保证预期的行为，如下截图所示：\n\
  \n![](img/Figure-14.11.jpg)\n\n**图 14.11：** 购买逻辑类\n\n`PurchaseLogic` 类接收实现 `purchaseCommand`\
  \ 接口的 `purchaseCommand` 类，并有一个负责管理具体命令类提供的现有操作执行的方法。如前面的代码所示，`confirm purchase`\
  \ 方法有一个 `try-catch` 块来处理购买执行中的失败。考虑到客户端必须使用购买逻辑类来执行操作，而不是直接从命令类调用底层方法，这种方法确保在发生意外事件时始终执行回滚操作。\n\
  \n# 14.2.2 客户端应用程序](#toc.xhtml_s169a)\n\n创建初始对象后，下一步是生成一个新的购买对象实例，关联刚刚创建的 `Customer`\
  \ 和 `CreditCard`，如下截图所示：\n\n![](img/Figure-14.13.jpg)\n\n**图 14.13：** 购买对象\n\n\n\
  \n\n`purchase` 对象只有一个关联了供应商的产品。在实际场景中，此信息可能从数据库或外部 API 获取，但为了演示目的，这些对象的实例是在本示例中手动创建的。每个命令类都期望在构造函数中接收一个\
  \ `purchase` 对象；因此，同一个 `purchase` 对象实例将传递给每种类型的命令类实例，包括支付、存储管理器和供应商通知。请记住，在此背景下，一个完整的购买过程必须涉及所有三个命令类所执行的操作。\n\
  \n在客户端应用程序中，必须为每种类型的命令创建一个实例，并将它们中的每一个作为参数传递给 `PurchaseLogic` 类实例，如下所示所示：\n\n![](img/Figure-14.14.jpg)\n\
  \n**图 14.14:** 客户端应用程序实现\n\n请注意，`Purchase` 类对象负责调用 `ConfirmPurchase` 方法，该方法包含 `try-catch`\
  \ 块以管理购买操作的底层执行。在本示例中，即使执行了三个必要的操作，该实现仍然是错误的，因为它没有一个例程来保证在三个操作中的其中一个失败时，所有操作都会被回滚。如果单个事务中的三个操作中的任何一个失败时，没有包含完整的流程回滚，那么给定的实现是不完整的。因此，实现需要进行一些更改以确保满足这一需求，这可以通过实现如下截图所示的事务类来实现：\n\
  \n![](img/Figure-14.15.jpg)\n\n**图 14.15:** 事务购买命令类\n\n`TransactionPurchaseCommand`\
  \ 类接收 `purchaseCommands` 列表，并实现相同的 `purchaseCommand` 接口以遵循相同的模式。这种实现满足了强制性要求：即使仅其中一个操作失败，也必须回滚所有操作。这种方法比之前的实现稍微复杂一点，但从另一方面来说，它更好地体现了需求。在客户端应用程序中，必须创建事务命令类的实例，并替换三个\
  \ `PurchaseLogic` 类实例的创建，如下所示所示：\n\n![](img/Figure-14.16.jpg)\n\n**图 14.16:** 带有事务的客户端应用程序\n\
  \n命令设计模式的使用允许我们实现可读性良好的代码，清晰地展示需求的意图。在本章给出的场景中，需求的意图是保证在线商店中与购买的所有必要操作都能运行，并在其中一个或多个操作失败的情况下，整个购买操作应作为一个单一过程被回滚。这在当前背景下特别棘手，希望这个示例能帮助你正确理解命令模式，并赋予你识别其在遗留项目中应用的必要能力。\n\
  \n# 结论](#toc.xhtml_s170a)\n\n正如在本章中所学习的，命令模式在需要将多个操作作为一组操作执行的场景中极其有用，其复杂性必须从客户端应用程序中抽象。这种模式在\
  \ .NET 中被广泛使用，因为几乎所有的数据库提供程序都实现了命令模式，以便为使用 C# 语言开发的应用程序抽象数据库操作的执行。在本章中获得的知识允许你从零开始创建自己的命令结构并将其应用到实际项目中，并且可以将此模式与其他旨在封装从客户端应用程序执行操作的模式结合起来。\n\
  \n通过本章，你学习了如何使用 C# 语言在实际场景中实现命令模式，并能够理解如何应用 OOP 的最佳实践为复杂问题提供简单的解决方案。\n\n在下一章中，你将有机会使用\
  \ C# 语言和 .NET Core 平台继续你的设计模式之旅，学习策略模式，并应用你在书中前几章获得的所有通用知识。\n\n# 记忆要点](#toc.xhtml_s171a)\n\
  \n*   命令模式允许向客户端应用程序隐藏操作执行背后的所有复杂性，始终共享相同的接口并遵循相同的模式。\n*   命令模式可以与其他模式结合使用，例如策略设计模式。\n\
  *   在需要将多个操作作为单一事务处理的场景中，强烈建议使用命令模式。\n\n# 多选择题](#toc.xhtml_s172a)\n\n1. **在什么种场景下推荐使用命令模式？**\n\
  \    1. 针对简单操作\n    2. 当系统之间的集成很复杂时\n    3. 当操作需要作为事务被执行和处理时\n    4. 以上均不是\n2. **观察本章给出的示例，哪一个类包含了代理模式的必要实现？**\n\
  \    1. Purchase logic（购买逻辑）\n    2. Customer（客户）\n    3. Purchase（购买）\n    4. Purchase\
  \ command（购买命令）\n\n# 答案](#toc.xhtml_s173a)\n\n1. c\n2. d\n\n# 问答题](#toc.xhtml_s174a)\n\
  \n1. 解释命令模式的主要目的。\n2. 根据你在本章中学到的知识，创建一个本章示例之外的可以应用命令模式的假设性场景。\n3. 举例可以使用命令模式的场景示例。\n\
  4. 你目前正在的项目中有是否有实现了命令模式的？\n\n# 核心术汇](#toc.xhtml_s175a)\n\n*   **Transaction (事务)**：在软件开发中，事务代表一组需要成功执行的任务。如果其中一个任务失败，则在至少一个任务失败的情况下，将对所有任务执行回滚过程。\n\
  *   **Receiver (接收者)**：在命令模式的实现上下文中，接收者是负责执行特定操作的源类。\n*   **Invoker (调用者)**：在命令模式的实现上下文中，调用者是负责调用命令类的中间类。\n\
  \n\n\n\n\n在对策略模式进行具体定义之前，正确理解 `C#` 语言中运行时（runtime）和编译时（compiletime）的区别至关重要。编译时是指在应用构建并在运行之前可以被识别和识别任何操作。例如，如果使用\
  \ `ASP.Net Core` 技术开发 Web 应用程序，该项目需要被构建、编译并发布到 Web 服务器。如果 `C#` 的实现上存在问题（例如语法错误），`Visual\
  \ Studio` IDE 将生成构建错误并不允许程序完全编译和构建。这意味着在 particular 语境下，特别是对于 `C#` 语言，编译器识别的所有类型和类必须是有效且存在的。因此，类型和类在编译时必须是已知的，包括它们的实现方式。\n\
  \n另一方面，应用程序运行时意味着应用程序的特定行为只有在程序实际运行时才会被识别。通常，接口中的细微问题和逻辑实现问题会在此时被发现，因为它们依赖于特定条件的进行验证，例如页面请求、数据库连接等。可以说，从编译时和运行时差异的高级定义来看，前者知道类型和类以及它们在语法方面的行为；后者则更多地涉及到不一定总是发生的未知行为，取决于需要检查和验证的某些因素。\n\
  \n鉴于此简单解释，策略模式允许我们在运行时更改方法或实现的类型，这意味着根据某些条件，代码将假设在不同场景下创建不同的类。这种灵活的行为有助于我们开发出从客户端应用程序中封装某些操作复杂性的解决方案。这与其他模式的情况类似，例如在\
  \ `C#` 和 `.NET Core` 章节中解释的工厂方法。\n\n策略模式由一个通用接口的规范组成，该接口需要由属于同一家族或具有相似目的的所有类来实现。在这种情况下，策略模式类负责根据参数、条件或基于业务和技术需求实现的自定义验证，来决定需要实例化哪一个具体类。\n\
  \n### 15.2 策略模式结构\n\n在本章中，你将学习策略设计模式的细节，并将有机会理解如何将该概念应用于真实场景，为一个全球递送应用实现业务需求。但首先，熟悉策略模式的结构及其主要目的是至关重要的。\n\
  \n策略模式包含一个上下文类，该类负责管理创建哪个具体类的决策，在运行时定义供主程序例使用的策略类，如`图 15.1`所示：\n\n![](img/Figure-15.1.jpg)\n\
  \n**图 15.1：**策略模式图\n\n如`图 15.1`所示，所有具体类都实现相同的接口，一旦特定例程有多个选项可选，创建正确对象的逻辑就会对客户端应用程序隐藏。客户端应用程序并不一定知道需要创建哪个类，整个策略由上下文类来处理。\n\
  \n如果项目包含许多需要执行的复杂微操作，但需要从客户端应用程序中抽象它们的复杂性，那么真实场景示例可能涉及数百个类。在这种情况下，创建上下文类是策略模式实现中最大的挑战。在本章中，你将有机会根据一个接近真实场景的假设场景，从零实现这种设计模式。\n\
  \n# 15.3 策略模式的实现\n\n软件开发中任何设计模式的使用都必须限制在它们意图解决的问题上。因此，不同的问题需要不同的解决方案，不同的需求也需要自定义实现以涵盖所有必要方面，同时不违反面向对象编程的良好实践。出于这个原因，本节包含一个假设场景，内容涉及一家全球递送公司，它想要根据执行服务的城市来控制流程。每个城市在税收、收入、就业和价格方面都有自己的规则，要求如下：\n\
  \n*   纽约市对应用程序中进行的任何交易征收 10% 的税，递送利润为 25%。\n*   洛杉矶市对任何交易征收 20% 的税，递送利润为 10%。\n\
  *   圣保罗市有 10% 的税、15% 的利润，以及拥有常驻员工的要求。\n*   如果用户来自一个对任何规则都没有实现的城市，则应默认应用纽约的所有要求。\n\
  \n鉴于此场景，有很多方法可以正确实现所有要求。但一个真正需要记住的点是，这类应用程序通常具有在全球范围内扩展到许多城市的潜力，每个城市都可能有不同的业务规则。一个支持所有背景下法律要求的应用程序在实现上将具有挑战性，因为法律要求背后的复杂性可能在城市之间而异。某些城市可能有额外的法律，而另一些则可能有简单的规定。\n\
  \n为了保持应用程序在技术架构方面的一致性，可以在该背景下使用策略模式。这考虑到客户端应用程序实例化对象可能涉及复杂的实现，而对于应用程序的高层来说，API 调用越简单越好。因此，策略基础设施将负责根据每个城市创建正确的实例，正确加载所有关于税收、就业和盈利的当地法规。\n\
  \n支持示例的模型创建将由有关用户和递送实体的类组成。本章重点是策略模式的实现，这些模型经过了简化，并不具备真实场景中存在的所有属性和方法。\n\n第一个需要创建的类是\
  \ `User` 类，如下所示：\n\n![](img/Figure-15.2.jpg)\n\n**图 15.2：**User 类\n\n`User` 类仅包含将在策略类中使用的信息，包括城市代码属性。在本节的示例中，需要创建策略对象的不同实例，因为每个城市的实现都是不同的。此外，还需要创建\
  \ `Delivery` 类，包含有关实体的基本信息，如下所示：\n\n![](img/Figure-15.3.jpg)\n\n**图 15.3：**Delivery\
  \ 类\n\n根据要求，每个城市在税收和利润方面都有自己的规则，这意味着必须使用策略类更改递送类的底层属性。因此，在创建了上述截图所示的类后，该类的实现将发生变化，以接收必要的逻辑注入，根据自定义城市规则更改税收和利润值。\n\
  \n\n\n\n\n为了提高策略模式实现的可测试性和扩展性，建议使用接口而非抽象类作为基类。考虑到这一重要方面，下一个需要创建的结构是城市策略类，它将在契约中包含处理税收、利润和就业规则要求的方法，如下截图所示：\n\
  \n![](img/Figure-15.4.jpg)\n\n**图 15.4：** 城市策略接口\n\n注意，城市策略接口没有任何属性的规范，只有方法，因为该类只负责处理每个城市特定要求的自定义实现。因此，它不需要拥有属性来保持订单或用户对象的正确状态。考虑到每个城市可能需要创建不同的对象，与其在一个唯一的复杂类下编写复杂的业务逻辑，不如为每个城市创建一个实现城市策略接口的具体类。另一个良好的实践是参与设计模式实现的类以模式名称作为后缀进行命名。这有助于项目中的其他开发者识别该模式，并且在分析遗留项目时可以节省时间。\n\
  \n在创建了城市策略接口后，是时候更改之前指定的 `Delivery` 类了，在 `Delivery` 类的构造函数方法中注入该接口。此外，税收和利润属性的 `get`\
  \ 方法将由接口中提供的底层方法决定，如下截图所示：\n\n![](img/Figure-15.5.jpg)\n\n**图 15.5：** 带有策略接口的 Delivery\
  \ 类\n\n类的构造函数没有接收具体的城市策略类，因为根据策略设计模式的，它必须是动态的。需要实例化的具体类需要在运行时定义，这意味着在包含策略实现的程序运行之前，类类型是未知的。由于已经有了具体策略类的整个基础设施，现在需要为每个城市创建一个实现城市策略接口的类。\n\
  \n如果客户端应用程序突然开始在大量不同的城市中使用，这种情况将需要实现许多额外的类，保持“每个单独城市一个类”的模式，这将不利于维护。当应用程序必须支持新城市时，这将需要应用程序重新部署多次。因此，在特定场景下，应该采取另一种方法，例如实现单类，其状态可以通过复杂的数据库结构进行控制，以正确支持每个城市的规则。\n\
  \n当前的示例列出了三个城市（纽约、洛杉矶和圣保罗）的要求，在这种情况下，由于需要创建三个类。第一个可以是纽约城市类，如下截图所示：\n\n![](img/Figure-15.6.jpg)\n\
  \n**图 15.6：** 纽约策略类\n\n负责确定城市就业规则的机制作为输入传递到 `Delivery` 类的构造函数中，在这种情况下是 `NewYorkStrategy`\
  \ 类（它拥有 `ICityStrategy` 接口）。负责在运费下应用税收和利润的方法在底层类中实现，该类实现了 `ICityStrategy` 接口并遵循了本节开头所述的要求。\n\
  \n遵循与纽约城市类相同的方法，还需要创建另外两个类，一个用于圣保罗，另一个用于洛杉矶。这两个类都需要实现相同的 `ICityStrategy` 接口，该接口将根据用户所在的城市通过构造函数注入到\
  \ `Delivery` 类中。根据需要实现的城市数量，在这种情况下开发一个类（即每个城市一个类）看起来是一项巨大的工程。\n\n然而，策略模式的主要目标是保持客户端程序的简单。这要求在应用程序的最底层构建一个更复杂的架构。\n\
  \n在创建了第一个具体类后，下一步是为圣保罗和洛杉矶城市指定类，实现相同的接口。以下是 `LosAngelesStrategy` 类的实现：\n\n![](img/Figure-15.7.jpg)\n\
  \n**图 15.7：** 洛杉矶策略类\n\n如前面的截图所示，类名带有 `Strategy` 后缀，以便于维护目的识别策略模式。该类的实现似乎是冗余的，但在现实场景中，利润值的规范可能涉及更复杂的操作，例如数据库调用或外部服务的集成。因此，建议保持实现不受外部更改的影响，例如用于定义税收和利润提供值的额外参数。这种方法也遵循\
  \ SOLID 原则所述的软件开发实践。如果一个更改仅适用于一个城市，则实现策略模式只需要更改单个类。\n\n根据单一职责原则 (SRP)，一个类必须只有一个更改的原因。例如，在运费客户端应用程序的上下文中，纽约城市规则的更改只需要影响底层类，而不涉及其他任何内容。\n\
  \n关于城市的具体类规范几乎完成后，最后一步是创建 `SaoPauloStrategy` 类，可以通过如下截图所示实现：\n\n![](img/Figure-15.8.jpg)\n\
  \n**图 15.8：** 圣保罗策略类\n\n至此，所有关于城市的具体类都已创建。考虑到策略设计模式提出的架构，下一步是构建负责创建城市策略类正确实例的上下文类（Context\
  \ class）。这样，客户端应用程序将对于每个情况下需要创建的每个类背后的决策不承担任何责任。\n\n鉴于此，需要创建一个策略方法类，根据某些标准返回正确的具体类。在本章上下文中，使用的标准是\
  \ `User` 类中的城市代码信息。因此，根据城市代码，系统必须创建城市策略类的正确实例。创建此额外结构是可选的，但它使代码对开发者更易读，并增加了为策略模式类实现单元测试和集成测试的可能性。\n\
  \n通常，为了处理多个选项，会在策略方法类中使用 `switch-case` 语句处理具体对象的创建。在其他情况下，必须定义更复杂的条件来处理创建正确实例的策略。但根据本示例的要求，可以使用简单的\
  \ `switch-case` 语句，如下截图所示：\n\n![](img/Figure-15.9.jpg)\n\n**图 15.9：** 策略方法类\n\n\n\
  \n\n如前面的截图所示，该类有一个单一方法，接收城市代码作为参数，并根据其值通过 `switch-case` 语句选择不同的城市策略类来创建具体对象。在没有匹配的城市代码（即没有城市策略）的情况下，根据要求，默认创建纽约市（New\
  \ York City）类。\n\n实践体验的最后一步是在客户端应用程序中调用这些类，这可以创建一个创建用户和交付对象实例简单 `Console` 应用程序。为了学习目的，创建能够涵盖本示例中创建的所有城市实现的实例至关重要。也可以创建单元测试，以验证每个具体类是否都正确应用了相应的利润、税收和就业规则信息。\n\
  \n你可以通过创建一个 `user` 对象来开始使用这些类，并为策略方法类指定代码为 `NYC` 的纽约城市，如下截图所示：\n\n![](img/Figure-15.10.jpg)\n\
  \n**图 15.10：** 客户端应用程序\n\n如前面截图中的实现所示，在第 13 行和第 14 行，创建了城市策略方法对象，之后在运行时创建了一个具体的城市策略类，并将城市代码传递给方法\
  \ `SetCityStrategy`。之后，在第 16 行生成了一个 `delivery` 对象，并将城市策略对象作为参数传递。\n\n如果你像前面截图中第\
  \ 19 行到第 21 行那样在屏幕上打印税收、利润和就业值的值，你将根据对城市就业规则、税收和利润的要求，获得纽约市的正确值，如下截图所示：\n\n![](img/Figure-15.11.jpg)\n\
  \n**图 15.11：** 客户端应用程序结果\n\n在本章所示，客户端应用程序对策略模式基础设施的使用非常简单，这说明了面向对象编程（OOP）的良好实践——从目标类中封装实现，这是\
  \ OOP 的原则之一。\n\n一旦完全理解了策略模式，建议为示例中所有可能的城市创建 `user` 和 `delivery` 对象的其他实例，并创建单元测试来评估结果。\n\
  \n## 结论\n\n正如本章所学，在整个应用程序需要遵循相同的业务逻辑但根据业务需求应用不同规则的场景中，推荐使用策略模式。\n\n该模式的正确用法在复杂项目中极其有用，可以保持简单性从而更具可维护性，并帮助开发者在不影响遗留代码的情况下安全地扩展功能。\n\
  \n通过本章，你学习了如何使用策略模式和 C# 语言实现真实场景。此外，你还理解了如何应用面向对象编程的最佳实践来解决复杂问题。\n\n在下一章中，你将有机会使用\
  \ C# 语言和 .NET Core 平台继续你的设计模式之旅，学习观察者模式，并应用你在书中前几章获得的所有通用知识。\n\n## 重点回顾\n\n*   策略模式让我们能够从客户端应用程序中封装创建具体类的所有逻辑，作为在不影响遗留代码的情况下扩展现有功能的灵活替代方案。\n\
  *   在应用程序需要不同场景之间实现高度分化的规则集的情况下，不建议使用策略模式。\n*   在策略模式的实现中使用接口有助于我们实现单元测试和集成测试，并通过测试单个策略方法类来覆盖\
  \ 100% 的情况。因此，测试的规范成本并不高，且具有巨大的收益。\n\n## 多选题\n\n1.  **在什么种场景下推荐使用策略模式？**\n    1.\
  \ 当需要在编译时创建对象时\n    2. 当需要在运行时创建动态对象时\n    3. 当类共享相同的需求时\n    4. 以上都不是\n2.  **观察本章给出的示例，哪个类不包含代理模式（proxy\
  \ pattern）的必要实现？**\n    1. 纽约策略类\n    2. 洛杉矶策略类\n    3. 城市策略方法类\n    4. 用户类\n\n\
  ## 答案\n\n1.  b\n2.  d\n\n## 问题\n\n1.  解释策略模式的主要目的。\n2.  根据你在本章中学到的知识，创建一个可以应用策略模式的假设场景（本章给出的示例之外）。\n\
  3.  解释可以使用策略模式的场景类型。\n4.  你目前正在的项目中有没有实现策略模式？\n\n## 核心术语\n\n*   **编译时（Compile time）**：在项目运行之前可以识别和识别任何操作。\n\
  *   **运行时（Run time）**：应用程序的特定行为只有在应用程序实际运行时才会识别。\n\n# 第 16 章\n\n# 观察者（Observer）\n\
  \n现代应用程序涉及使用基于业务需求定义的事件的通知，这需要实现一种可靠的软件架构，以确保对特定事件的所有订阅者都能收到通知。本章解释的观察者设计模式帮助我们实现例程，这些例程不仅让我们能够识别某个对象的变化，还让我们在发生变化时通知所有预期接收信息的用户或客户端应用程序的方法。\n\
  \n学习观察者模式让你有机会在基于 C# 语言和 .NET 平台的遗留项目中识别其用途，并帮助你在任何平台的许多应用程序中应用此模式，例如移动端、桌面和 Web\
  \ 应用程序。\n\n通过本章，你将有机会使用 C# 语言在实践示例中应用观察者模式，构建一个真实场景。\n\n## 结构\n\n在本章中，我们将讨论以下主题：\n\
  \n*   观察者模式概念\n*   C# 和 .NET Core 示例\n\n# 目标\n\n学习本单元后，你应该能够：\n\n*   理解观察者模式\n*\
  \   在 .NET 应用程序和现有项目中识别观察者模式\n*   在真实场景中应用观察者模式\n\n### 16.1 观察者模式定义\n\n如今，找到同时在多个设备和平台提供的应用程序是非常常见的，以便为用户提供丰富的体验，并在事件发生时同步通知用户。通知的使用（主要在移动应用程序中）已成为任何应用程序中的可用功能，有许多实现该功能的方法。考虑到它代表了全球许多公司需要解决的共同问题，没有必要重新发明他们采用的解决方案，只需要将其适应我们自己的自定义场景即可。\n\
  \n\n\n\n\n自现代编程语言诞生以来，事件驱动架构在市场上被广泛应用。这种用法通常涉及应用程序通过事件来启动不同组件之间、甚至是不同服务之间的进程。因此，应用程序基于特定事件的响应在软件开发中并非新鲜事，但多年来它一直从本质上被人们所使用。\n\
  \n全球范围内数百万用户使用的社交媒体应用增加了使用通知的挑战，因为考虑到在特定条件下需要接收通知的用户数量非常庞大。在某种程度上，可以说一个简单的社交媒体应用可能拥有数百个事件，这些事件可能需要向用户发送通知，而这些发送总是基于复杂的规则、权限和条件。在这种情况下，使用通用且简单的模式至关重要，因为这类应用的核心不在于通知本身，而是需要构建良好的软件架构，以便在不影响其他功能实现的情况下支持这一重要需求。\n\
  \n观察者设计模式为实现需要通知功能的应用程序提供了一种优雅且高效的方法，在 C# 语言和 .NET 应用中被广泛使用。该模式背后的所有逻辑都与特定对象关联的订阅者有关。因此，如果一个对象需要根据另一个对象的变化接收通知，那么负责发送通知的对象必须支持订阅过程。\n\
  \n为了清晰地理解观察者模式的工作原理，请查看 `图 16.1]`，它包含了该模式的基本结构，并展示了必须接收通知的类（观察者）与负责通知的类（主体）之间的关系：\n\
  \n![](img/Figure-16.1.jpg)\n\n**图 16.1:** 观察者模式图\n\n`Subject` 类包含时时信息，其他类可能对根据其状态或内容的变化而接收这些通知感兴趣。因此，具体的\
  \ `Subject` 类有一个私有属性，负责存储订阅者列表，这些订阅者是对接收通知感兴趣的对象。该类中存有用于在私有列表中添加和移除观察者的方法，在真实世界的示例中，这些方法可能命名为\
  \ `subscribe` 和 `unsubscribe`。\n\n如 `图 16.1]` 所示，`Observer` 接口包含一个名为 `Update` 的方法，所有具体的观察者类都需要实现该方法。该更新方法需要由\
  \ `Subject` 类在 `Notify` 方法中对观察者列表中的每个单独对象进行调用。考虑到接口可以用于整个观察者设计模式的实现，不同的具体类可以订阅接收通知，从而赋予该模式灵活性和扩展性。\n\
  \n在本章的后续部分，你将有机会从零开始使用观察者模式实现一个实用的现实应用。示例实现包含一个博客应用程序，允许用户订阅接收通知，在这种情况下，即博客中创建新文章时的通知。\n\
  \n# 16.2 观察者模式的实现](#toc.xhtml_s191a)\n\n与之前章节中其他设计模式的做法类似，本章将让你有机会实现在本章开头在理论上解释过的设计模式。通过这段简短的体验，你将能够识别遗留项目对观察者模式的使用，并能够在任何需要实现通知或任何基于事件的例行的场景中实现此模式。\n\
  \n本节的实践示例包含一个博客应用程序，允许用户订阅博客以便在创建任何新文章时接收通知。该博客应用程序可以包含许多由用户管理的微博客，应用程序应该允许多个用户订阅多个博客。\n\
  \n首先，有必要创建任何使用观察者设计模式的应用程序通用的所有接口。尽管不同系统的应用程序上下文可能会发生，但考虑到主体（subject）和观察者（observer）的概念对于所有情况都是相同的。因此，第一个接口将是\
  \ `ISubject` 接口，如下截图所示：\n\n![](img/Figure-16.2.jpg)\n\n**图 16.2:** 主体接口\n\n`ISubject`\
  \ 接口包含两个方法，其目的是处理主体具体类中观察者的添加和删除。其中还包含一个 `Notify` 方法，以便强制具体类实现通知过程背后的必要逻辑，这些逻辑在不同类之间可能会不同。还必须指定\
  \ `IObserver` 接口以便包含所有 `observer` 类的合约，如下截图所示：\n\n![](img/Figure-16.3.jpg)\n\n**图\
  \ 16.3:** 观察者接口\n\n`Observer` 接口中指定的 `Update` 方法必须由所有具体类实现，以定义当 `observer` 类接收到主体类的通知时所采取的操作。考虑到同一个接口可能用于不同类型的情况，更新方法接收一个通用对象作为参数，每个具体类都必须将该对象强制转换为正确的类型。\n\
  \n在本节的给定场景中，用户代表观察者，博客代表主体，这意味着观察者期望接收博客的通知。\n\n将观察者模式结构与关于博客和用户的具体示例进行比较，结果如 `图\
  \ 16.4]`：\n\n![](img/Figure-16.4.jpg)\n\n**图 16.4:** 类图\n\n在这种情况下，博客类实现了 `ISubject`\
  \ 接口，而 `User` 类实现了观察者接口。\n\n# 16.3 创建 User 类](#toc.xhtml_192a)\n\n具体的 `User` 类实现如下截图所示：\n\
  \n![](img/Figure-16.5.jpg)\n\n**图 16.5:** User 类\n\n在 `User` 类实现中，`Update` 方法接收一个对象作为参数并将其强制转换为\
  \ `post` 对象。该方法将在通知事件发生时由 `subject` 类调用。在这种情况下，使用通用对象进行通知有巨大的好处，因为不同的类可能期望接收不同类型的通知。\n\
  \n如前所示，`Update` 方法在屏幕上打印用户名和博客文章标题用于演示。通过这样，你可以关注观察者模式实现中发生的情况。在真实世界的实现中，相同的方法可以用于在移动应用程序中向用户显示收件箱通知，或者在屏幕上更新新的博客文章。\n\
  \n另一方面，`Blog` 类在此语境下代表 `Subject` 类，并需要实现底层接口，该接口需要负责添加和移除观察者的方法的自定义规范。此外，`Blog`\
  \ 类必须实现负责通知所有订阅观察者的方法。为了演示目的保持 `Blog` 类实现的简单，它将具有如下截图所示的结构：\n\n![](img/Figure-16.6.jpg)\n\
  \n\n\n\n\n**图 16.6:** BlogBlog 类\n\n如前面的截图所示，`Attach` 和 `Detach` 方法具有单一职责，即更新类中的私有观察者列表。这些方法必须被调用，以处理客户端应用程序中可能发生的订阅事件。`Notify`\
  \ 方法遍历观察者列表，并执行 `observer` 对象上的 `update` 方法，这符合观察者设计模式陈述的要求。\n\n最后，`Notify` 方法由\
  \ `AddPost` 方法调用，该方法在博客中每次创建新帖子时都会被使用。考虑到事件驱动开发的概念，这两个方法（`AddPost` 和 `Notify`）之间的强关联确保了应用程序在创建新帖子时发送通知这一目的的可靠性。\n\
  \n### 16.4 创建博客帖子类\n\n博客帖的实现情况如下方的所示：\n\n![](img/Figure-16.7.jpg)\n\n**图 16.7:**\
  \ Post 类\n\n在云应用中，使用队列的概念来管理涉及大量设备的通知是非常常见的，当某个进程的需求至关重要时，这些设备需要接收通知。对于实时通知，.NET\
  \ 平台包含了 SignalR 技术，它允许我们遵循观察者模式陈述的订阅者概念，在客户端和服务器之间创建实时通信。在这种情况下，客户端应用程序（可能是在浏览器中打开的网页或桌面应用程序）在观察者设计模式的实现中承担主体（subject）角色。如果客户端应用程序发生任何变化，都需要通知服务器，并且需要在所有订阅了特定事件的多个设备之间同步所有必要的更改。它代表了这种强大的技术，并简化了实时应用程序（如聊天应用程序或实时屏幕）的开发。\n\
  \n到此时，你已经拥有了实现观察者模式的所有必要基础设施，并可以使用假设数据测试完整实现。鉴于 `User` 类中提供的 `Update` 方法的自定义实现，你可以使用该方法的输出来验证解决方案的准确行为。\n\
  \n### 16.5 客户端应用程序\n\n为了妥地模拟真实场景，你可以手动创建多个 `User` 类的类实例，创建一个 `Blog` 类的新实例，最后将 `user`\
  \ 对象附加到 `Blog` 类中，如下方的所示：\n\n![](img/Figure-16.8.jpg)\n\n**图 16.8:** 客户端应用程序\n\n\
  如前面的截图（展示了一个控制台应用程序）所示，程序开始时创建了三个用户对象，包括 `userOne`、`userTwo` 和 `userThree`。这些对象中的每一个都被附加到\
  \ `blog` 对象上。然后，创建一个新帖子并将其添加到博客。\n\n如果你运行应用程序，产生的结果如下方的所示：\n\n![](img/Figure-16.9.jpg)\n\
  \n**图 16.9:** 客户端应用程序结果\n\n为了正确理解实现结果，务必记住该应用程序执行了以下过程：\n\n1. 创建 `User` 类的新实例。\n\
  2. 创建 `Blog` 类的新实例。\n3. 将用户对象附加到 `Blog` 类中，订阅它们以便在创建新帖子时接收通知。\n4. 使用 `Blog` 类中提供的方法添加新帖子对象。\n\
  5. `AddPost` 触发 `Notify` 方法，该方法调用 `User` 类中提供的 `Update` 方法，其实现在如下图中亮显示：\n\n![](img/Figure-16.10.jpg)\n\
  \n**图 16.10:** Update 方法\n\n如本章示例所示，观察者设计模式的实现需要对负责发送通知的类进行修改。此外，接收通知的类也需要更改。为了方便识别此模式的使用，强烈建议你在实现中涉及的所有接口中使用友好的名称。这将有助于项目中的其他开发人员进行维护工作，并确保在应用程序需要扩展时能够严格遵循此设计模式背后的原则。\n\
  \n我希望本章帮助你理解了观察者模式。考虑到你通过这个实践示例获得的知识，建议你在本节给出的场景之外，还尝试尝试创建其他演示观察者模式的场景，以进行额外的练习。\n\
  \n## 总结\n\n正如本章所学，观察者模式在需要向应用程序中的多个对象发送通知的场景中非常有用。\n\n这种设计模式是软件开发中最常用的设计模式之一，并广泛应用于真实场景，例如社交媒体应用以及任何需要在多个设备和大量用户群之间发送和接收通知的应用程序。\n\
  \n在本章中，你学习了如何使用 C# 语言在真实场景中实现观察者模式，遵循了关于 SOLID 原则和面向对象编程范式的所有良好实践。\n\n在下一章中，你将有机会概述\
  \ .NET 中其他常用的设计模式（这些模式在本的其他章节中未涵盖）。此外，你还将学习关于使用设计模式的重要良好实践和建议。\n\n\n\n\n\n在学习本书的前面的章节时，你已经有机会实现了\
  \ .NET 应用中最广泛使用的设计模式的实际示例。现在，在最后一个总结章节中，你将有机会学习良好的实践和建议，并对其他章节中未介绍的模式进行简单概述。\n\n\
  学习关于设计模式实现的良好实践，将让你在做出决策时更有机会，例如可以使用哪种模式，以及在何种场景下不建议使用任何模式。\n\n## 结构\n\n在本章中，我们将讨论以下主题：\n\
  \n* 良好实践与建议\n* 构建器（Builder）、桥接器（Bridge）和装饰器（Decorator）模式\n* 责任链（Chain of responsibility）、外观（Facade）和解释器（Interpreter）模式\n\
  * 迭代器（Iterator）、中介者（Mediator）和备忘（Memento）模式\n\n# 目标\n\n学习完本单元后，你应该能够：\n\n* 理解与设计模式相关的良好实践\n\
  * 理解构建器、桥接和装饰器模式背后的核心思想\n* 熟悉责任链、外观和解释器模式的概念\n* 识别迭代器、中介者和备忘模式的使用\n\n### 17.1 良好实践与建议\n\
  \n在真实项目中的正确使用任何设计模式都需要具备深厚的 OOP（面向对象编程）范式知识，并且对所构建项目背后的所有技术和业务需求有深入理解。市场上使用的设计模式是为了解决软件开发中的特定问题而定义的。成功使用设计模式涉及评估应用程序必须解决的业务问题，并识别是否可以使用某种设计模式解决这些问题。\n\
  \n如前面的章节所示，某些设计模式使用了许多与 OOP 范式相关的不同概念，如接口、继承、多态、抽象、保护修饰符以及直接影响组件和完整应用程序开发的重要概念。因此，熟悉本书前六章解释的所有面向对象编程范式是极其重要的。\n\
  \n软件开发是一个复杂的过程，涉及到许多不同技术的运用。熟悉 `C#` 语言的基本概念，然后学习进阶功能，直到它们的使用在日常工作中变得自然是非常重要的。软件开发中的大多数良好实践是开发者之间的常识，包括对于使用\
  \ `.NET` 平台和 `C#` 语言构建的项目。因此，在许多情况下，某些良好实践（如 `SOLID` 原则）将在真实项目中使用，但它们可能不会被明确提到，其识别也不会那么清晰。\n\
  \n简单性必须是任何项目在技术方面的关注重点，且代码应该是可读且易于维护的。因此，在规划过程中定义软件架构时，应该在技术决策中考虑这一点。设计模式和其他任何其他技术代表了特定问题的解决方案，应该谨慎使用，以避免在不需要使用它们的项目中引入额外的复杂性。\n\
  \n如果开发团队不熟悉设计模式，强烈建议团队对面向对象编程范式的基本概念、`SOLID` 原则和设计模式进行教育。在经过适当教育后，团队将能够更好地确定项目中需要应用哪些模式。如果团队成员不熟悉设计模式，强烈建议开始培训过程，以确保所有开发者都处于同一水平，并能够在在使用设计模式时，遵循所有建议的方法来创建和维护应用程序。\n\
  \n软件开发的复杂性在过去几年中呈指数级增长。这是由于源于全球化项目背后的所有需求，例如社交媒体、流媒体平台、在线银行以及娱乐和移动应用程序。所有这类应用程序都有共同点：它们在可扩展性方面面临着巨大挑战，作为一种云解决方案，这意味着这些项目的复杂性不仅涉及编程语言方面，还涉及软件架构和基础设施。因此，应该采取的方法是保持任何应用程序尽可能简单。\n\
  \n单个项目在开发过程中可能会有任何额外的关注，而简单性、可读性以及对 `SOLID` 原则的正确遵守可能代表项目技术成功的关键。\n\n### 17.2 构建器、桥接和装饰器模式\n\
  \n在本节中，你将有机会简要概述 `.NET` 项目中三个重要设计模式的概念，这些模式将帮助你解决主要存在于真实场景中的常见问题。尽管存在大量的设计模式，但每种模式的学习都应该逐步进行，以便在适当的情况下应用这些概念。设计模式就像一个工具箱，你可以从中根据所需的任何情况或条件选择所需的工具。在接下来的章节中，你将学习构建器、桥接和装饰器模式的通用理论。\n\
  \n### 17.2.1 构建器模式\n\n构建模式是帮助创建复杂对象最有用的模式之一，它将构建过程的复杂性拆分为多个小步骤，减少了操作风险，增加了扩展性，并使代码对开发者更具读性。构建模式遵循的方法与\
  \ `SOLID` 原则一致，并展示了创建复杂对象的独立步骤，每个步骤都有独特且单一的职责。\n\n想象一下场景：对象的创建涉及许多行代码，包括在整个操作过程中对外部服务的调用。整个过程可能涉及构建数百行代码，这会阻碍维护性，并损害开发者的理解。此外，代码中的任何更改都代表了引入新问题的巨大风险，因为考虑将创建过程保持在单个方法或构造函数中将把多个重职责委托给一个单一方法。\n\
  \n构建模式规定，具体类必须实现一个构建器接口，该接口有多个方法，负责创建复杂对象的不同部分。具体类还负责返回完整对象，如图 17.1 所示：\n\n![](img/Figure-17.1.jpg)\n\
  \n图 17.1：构建模式\n\n任何解决方案的实现都是相当灵活的，实现主要目标是任何软件架构最重要的点。因此，对于构建模式，与其客户端应用程序、接口和具体类之间的关系，核心点在于提供一种将复杂对象的创建拆分为多个小部分的实现，并且每个部分都应该是可测试、可扩展的且易于使用和维护的。\n\
  \n### 17.2.2 桥接模式\n\n\n\n\n\n桥接模式允许为从自同一抽象类的相同继承关系的子类指定多种不同的行为，使子类和父类的实现完全相互独立，从而允许在不影响任何遗留实现的情况下扩展功能。如图\
  \ 17.2 所示，子类引用一个接口，该接口与抽象类使用的接口相同：\n\n![](img/Figure-17.2.jpg)\n\n**图 17.2:** 桥接模式\n\
  \n当有新需求需要扩展旧项目的功能，且需要保持旧类完好时，这种模式非常有用。这种方法完全符合面向对象编程范式中 SOLID 原则所规定的良好实践，特别是里氏替换原则（Liskov\
  \ principle）。正如本书前面的章节所示，SOLID 原则和设计模式之间存在某种关联，正确使用任何模式都要求对适用于任何软件项目的通用原则有深入的理解。通常可以说，桥接模式适用于以下场景：同一系统的旧新新功能需要在生产环境中共存，以便根据客户端应用程序使用的版本来启用或禁用功能。\n\
  \n### 17.2.3 装饰器模式\n\n装饰器模式与依赖注入的概念密切相关，依赖注入是为了在不更改实际类的情况下，通过接口注入新对象来扩展某些类的行为。.NET\
  \ Core 平台引入了一种更简单处理通用依赖注入的方法，可以在应用程序的启动类中全局范围内指定一个接口，项目中每个在构造函数中指定了该接口的类都将自动接收具体对象的实例。这被广泛用于为\
  \ Asp.Net Core `MVC`（**模型-视图-控制器**）项目的控制器注入存储库。如后续截图所示，在 Asp.Net 项目的 `Startup.cs`\
  \ 类中，可以注册项目中全局使用的服务：\n\n![](img/Figure-17.3.jpg)\n\n**图 17.3:** 依赖注入\n\n一旦在服务中注册了接口和底层具体类，只要存在引用该接口的构造函数，Asp.Net\
  \ Core 项目中的所有控制器都将接收该对象的具体实例，如下面截图所示：\n\n![](img/Figure-17.4.jpg)\n\n**图 17.4:**\
  \ 控制器中的注入\n\n依赖注入的透明处理程序是 Asp.Net Core 相比于以前版本的主要创新之一，因为它不需要使用外部库，而是 Asp.Net Core\
  \ 项目的原生部分。正确使用依赖注入允许我们拥有可扩展且可测试的类，能够创建实现控制器中注入的相同的模拟类（mock classes）。\n\n### 17.3\
  \ 责任链与模式\n\n在本节中，你将有机会简要概述许多公司在 .NET 项目中使用的两种核心设计模式，包括责任链模式和外观模式（façade）。\n\n###\
  \ 17.3.1 责任链模式\n\n责任链模式用于此类场景：在某个服务中需要发出多个请求，并且必须将过程拆分为多个请求，以便为每个单独的请求处理少的数据。如果我们将此模式与桥接模式进行比较，可以看到它们在目的方面具有相似性：将责任拆分为多个较小的方法或对象。想象一种场景，向特定服务逐个且顺序地请求数千个不同的对象，而根据服务的底层限制，单个会话或认证过程中可以请求的对象数是有上限的。在这种情况下，可以创建多个处理器，每个处理器负责请求特定范围的对象。责任链模式的表示可以在图\
  \ 17.5 中看到：\n\n![](img/Figure-17.5.jpg)\n\n**图 17.5:** 责任链模式\n\n客户端应用程序使用的每个处理器都可以有自定义实现，负责处理大型请求的不同部分。这在拆分运行时创建对象的责任方面是一项极好的实践，但在需要执行单次事务的情况下，使用此模式可能面临巨大挑战，因为考虑到每个实例正在处理的过程之间可能是彼此独立的。\n\
  \n### 17.3.2 外观模式\n\n外观模式（Façade）代表了 .NET 应用中最常用的模式之一。该模式允许将业务需求从实现细节中抽象出来，隐藏不同系统之间的复杂性。例如，在集成需要连接到数据库并从中取回数据的情况下，总有一个现成的连接器或库来方便该过程，例如\
  \ SQL Server、Oracle 或其他数据库的连接器。Entity Framework 就是一个很好的例子。这允许我们对数据库进行操作，而无需编写编写单行代码来处理所有关于协议、安全以及数据库访问其他方面的复杂操作。因此，可以说应用程序中任何促进访问另一个系统的层都可以被视为外观的实现。\n\
  \n在许多场景下，单个客户端应用程序需要访问多个其他系统，而这些系统具有不同的身份验证方式和在对象方面的不同模式。在这种情况下，最佳方法是创建一个中间层来处理两个或多个系统之间的通信，并让客户端应用程序和源应用程序免受集成带来的干扰。\n\
  \n## 总结\n\n正如在本章及之前的章节中所学的，正确理解设计模式允许我们更高效、更可靠地为真实项目构建软件，以简单的方法解决复杂问题，遵循 OOP 范式的最佳实践，包括\
  \ SOLID 原则和与质量保证（QA）相关的实践。我希望本书的所有章节都能帮助你理解设计模式如何应用于 .NET 项目中。\n\n此外，你还有机会学习并理解\
  \ .NET Framework 和 .NET Core 的区别，包括 C# 语言最新版本中最重要的新功能。在本章中，你学习了设计模式的良好实践，包括 C# 语言常用设计模式的通用概念，如外观、责任链、装饰器、构建和桥接模式。\n\
  \n## 知识点回顾\n\n\n\n\n\n## 1. 使用依赖注入概念的设计模式是什么？\n\n1. 外观 模式 (façade pattern)\n2. SOLID\
