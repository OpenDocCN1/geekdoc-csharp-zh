  \n# 第一章\n\n# C# 基础\n\n\n\n\n在本章中，我们将开始使用 `C# 9.0` 和 `.NET 5` 开启设计模式之旅，通过介绍 `C#`\
  \ 编程的基本概念，让你熟悉该语言、主要操作和指令，这些内容将帮助你理解在书中后续章节中进步所需的知识，例如面向对象编程、设计模式以及 `.NET` 平台。你将学习如何创建和使用变量、操作符、逻辑语句和条件语句。此外，你将有机会在\
  \ `C#` 中实现基础程序以获得实践经验。\n\n熟悉 `C#` 的基础和核心概念将使你理解如何应用复杂的设计模式，以满足企业级项目中最常见的真实场景。\n\n\
  ## 结构\n\n在本章中，我们将讨论以下主题：\n\n* Visual Studio 2019 和 Visual Studio Code 的安装指南\n* Visual\
  \ Studio 2019 简介\n* Visual Studio Code 简介\n* `C#` 基础操作\n* `C#` 中的对象类型\n* `C#` 中的循环与迭代\n\
  * `C#` 中的错误处理\n\n# 目标\n\n学习本单元后，你应该能够：\n\n* 安装并设置 Visual Studio IDE 和 Visual Studio\
  \ Code\n* 使用 Visual Studio 创建并构建应用程序\n* 理解并使用 `C#` 语言的基础操作\n\n## 工具与环境搭建\n\n为了开始\
  \ `.NET 5` 和 `C# 9.0` 的软件开发，你必须安装最新的 Visual Studio 2019 版本，这是一个用于创建、编译和构建 `.NET`\
  \ 项目的完整`集成开发环境`（`IDE`）。Visual Studio 支持 Windows 和 macOS，两者都有可供学习的 Express 版（快速版）。该工具可以在\
  \ Visual Studio 官方网站下载。\n\n此外，微软还提供了 `Visual Studio Code`，这是一个适用于 `.NET` 和 `C#`\
  \ 程序的轻量级替代编辑器，它不仅适用于 Windows 和 macOS，还适用于各种 Linux 发行版。考虑到该编辑器是一个开源可扩展项目，全球的技术社区、IT\
  \ 专业人员和公司已经为除 `C#` 本身的其他语言创建了许多免费扩展。因此，它是创建跨平台应用程序的理想工具，无需担心兼容性问题。你可以在官方网站免费下载 `Visual\
  \ Studio Code`。\n\n### 安装 Visual Studio 2019\n\n从官方网站下载 Visual Studio 2019 后，你必须按照以下步骤进行安装：\n\
  \n1. 双击下载的可执行文件。确保你的操作系统用户具有权限安装该软件。\n2. 选择要与 Visual Studio 一起安装并设置的所需工作负载。对于书中的示例，必须安装以下工作负载：\n\
  \    * ASP.NET 和 Web 开发\n    * `.NET` 桌面开发\n    * 通用 Windows 平台开发\n    * `.NET Core`\
  \ 跨平台开发\n    完成此安装步骤后，工作负载列表将如截图所示：\n    ![](img/Figure-1.1.jpg)\n    图 1.1：Visual\
  \ Studio 2019 工作负载\n3. 选择必要的工作负载后，点击 `Install`（安装）选项。\n4. 通常，Visual Studio 配置为使用与操作系统相同的语言。如果你想设置不同的语言，可以在\
  \ `Language Packs`（语言包）选项中进行，那里提供其他语言。对于书中的示例，Visual Studio 配置为英语。\n    安装完成后，你已经能够使用\
  \ Visual Studio 中提供的所有项目类型创建 `.NET 5` 解决方案。\n\n一旦安装了 Visual Studio 2019，你就不需要安装最新稳定版的\
  \ `.NET SDK`，因为它已经是 Visual Studio 安装的一部分。默认情况下，Visual Studio 会更新并遵循引入到 `.NET` 中的最新功能，例如库更新、微小和重大更改以及新项目模板。尽管如此，库更新不会自动应用到你现项目中。每个项目都针对特定的\
  \ `.NET` 版本，Visual Studio 仅更新和修改 `IDE`，而不修改现有项目的配置。\n\n### 安装 Visual Studio Code\n\
  \n`Visual Studio Code` 是 Visual Studio IDE 的跨平台替代方案，如果你想为 `.NET Core` 项目寻找轻量级编辑器，它是一个很棒的选择。公司和社区提供了许多扩展，允许我们处理许多不同的语言，它已成为软件开发人员最常用的编辑器之一。此外，它适用于任何操作系统，如\
  \ Linux、macOS 和 Windows。从官方网站下载可执行文件后，你必须执行以下步骤：\n\n1. 双击下载的可执行文件。确保你的操作系统用户具有权限安装该软件。\n\
  2. 下载 `C#` 和 `Azure` 的 Visual Studio 扩展，如下所示所示：\n    ![](img/Figure-1.2.jpg)\n \
  \   图 1.2：Visual Studio Code 扩展\n    你必须连接网络才能在 `Extensions`（扩展）选项卡中搜索扩展。输入扩展名称后，只需选择安装选项即可完成过程。\n\
  \n### Visual Studio 2019 简介\n\nVisual Studio 2019 是一个强大的 IDE，允许你在一个地方创建、构建、调试和部署你的\
  \ `.NET` 应用程序，包括访问数据库和 Azure 功能等外部资源。此外，它包含了许多用于启动软件开发的项目模板，包括基于 `.NET`的项目类型。要访问这些模板，只需点击顶部菜单上的\
  \ `File`（文件）选项并选择 `New Project`（新建项目），如下所示：\n    ![](img/Figure-1.3.jpg)\n    图\
  \ 1.3：Visual Studio Code 扩展\n\n安装 Visual Studio 2019 后，最流行的 `.NET Core` 项目模板如 `Console\
  \ App`（控制台应用）、`AspNet Core Web API Application` 和 `Blazor App` 均可用。每个项目模板都有其他可选的子类型。这些模板节省了时间，并有助于使用\
  \ Visual Studio 配置和创建新项目。\n\n许多免费额外模板由开源社区、公司和个人开发者在 Visual Studio Marketplace（市场）网站上共享。此外，用于许多用途的\
  \ Visual Studio 扩展可以在同一网站下载，以获得最佳软件开发体验并实现第三方工具的集成。它们也适用于 Visual Studio 和 Azure\
  \ DevOps。\n\n从模板列表中创建一个简单的项目后，你将被重定向到开发代码的集成环境，在常用位置拥有带有代码建议支持的编辑器以及对文件和外部资源的访问，如下截图所示：\n\
  \    ![](img/Figure-1.4.jpg)\n    图 1.4：Visual Studio 功能\n\n在 `Solution Explorer`（解决方案资源管理器）侧边栏中，你可以访问解决方案中存在的所有文件夹和文件。此外，如果你有多个项目作为软件开发的一部分，还可以看到所有关联的项目。此外，此视图允许访问有关项目的额外选项，例如使用\
  \ `Nuget Package` 安装额外包和第三方库，这可以通过右键点击项目并选择 `Manage Package`（管理包）选项来实现，如 *图 1.5*\
  \ 所示：\n    ![](img/Figure-1.5.jpg)\n    图 1.5：Nuget 包选项\n\n\n\n\n\n之后，会出现一个新窗口，可以在其中搜索并安装\
  \ Nuget 包，选择所需的版本，如 *图 1.6* 所示：\n\n![](img/Figure-1.6.jpg)\n\n**图 1.6：** Nuget 包窗口\n\
  \n另一个有趣的选项是使用命令行安装包，一旦熟悉了可用命令，该过程将变得简单得多。在底部出现的 Nuget Packages 控制台中，可以使用 `dotnet\
  \ install` 命令后后跟包的名称，如 *图 1.7* 所示：\n\n![](img/Figure-1.7.jpg)\n\n**图 1.7：** Nuget\
  \ 包控制台\n\n另一方面，`Editor`（编辑器）侧边栏是开发代码的地方，可以获取关于代码语法、缩进、代码建议、之前的编码错误消息的提示，并导航到类、函数和方法，如\
  \ *图 1.4* 所示。编辑器是完全可自定义的，可以更改许多设置，如背景颜色、对比度和字体大小。\n\n最后，在 `Server Explorer`（服务器资源管理器）侧边栏可以连接到外部资源、数据库、服务器、云资源和本地功能。这样你可以将所有工作保持在一个独特且共享的地方，这对于提高生产力非常有价值。在工具栏中有运行应用程序、保存待处理更改、修改调试模式、注释代码行、打开新文件以及撤销编辑器中最近添加的代码等选项，如\
  \ *图 1.8* 所示：\n\n![](img/Figure-1.8.jpg)\n\n**图 1.8：** Visual Studio 工具栏\n\n.NET\
  \ 平台允许使用 F# 构建应用程序，这是一种基于函数范式的语言，此外还允许我们使用 Vb.NET，自平台诞生以来在 .NET 项目中广泛使用的语言。在项目创建对话框中，Visual\
  \ Studio 提供了相同类型项目的特定模板，但基于除 C# 以外的其他语言，如 *图 1.9* 所示：\n\n![](img/Figure-1.9.jpg)\n\
  \n**图 1.9：** F# 应用程序\n\n在 *图 1.9* 给出的示例中，Visual Studio 根据 F# 语言而不是 C# 创建了一个 Asp.Net\
  \ Core 应用程序。然而，如果解决方案中有其他针对 C# 语言的项目，可以共享引用并复用 F# 项目上的代码，因为它们在 .NET 平台上是兼容的。\n\n\
  **Visual Studio 是一个用于 .NET 应用程序的完整 IDE。它需要额外的工具来构建和执行基于 C# 或 .NET 平台支持的任何语言的程序。此外，即使使用其他语言编写，也可以创建并集成不同的项目。**\n\
  \n# Visual Studio Code 简介 (#toc.xhtml_s7a)\n\n起初，Visual Studio Code 看起来与 Visual\
  \ Studio 2019 非常不同，但两者的目的完全相同：创建、调试、构建和部署使用多种语言和资源制作的应用程序。核心包含许多扩展，使我们开发人员的日常工作变得简单得多。Visual\
  \ Studio 2019 和 Visual Studio Code 之间的主要区别在于跨平台开发；Visual Studio Code 不仅可以在 Windows\
  \ 和 macOS 操作系统上可用，在 Linux 上也可以直接使用。另一个相关方面是此编辑器与完整 IDE 相比的性能；另一方面，你必须根据开发软件的实际需求，单独启用扩展和组件。如\
  \ *图 1.10* 所示，Visual Studio Code 中可用的部分与 Visual Studio 类似：\n\n![](img/Figure-1.10.jpg)\n\
  \n**图 1.10：** Visual Studio Code\n\nVisual Studio Code 和 Visual Studio IDE 之间存在显著差异。第一个目的是成为轻量级代码编辑器，可以在\
  \ Linux、macOS 和 Windows 上使用，这对于低资源机器来说是一个有趣的选择。第二个侧重于成为一个完整的集成环境，可以在一个地方拥有开发所需的所有内容，包括数据库访问、部署和构建的额外选项，以及高级视觉选项，以便将所有必要工具保持在单个应用程序中。\n\
  \n自 Visual Studio Code 诞生以来，公司和开源项目为其提供了许多扩展。这意味着它正逐渐变成一个更复杂的编辑器。然而，所有超出简单编辑器范围的额外功能都需要作为单独扩展进行启用和安装。Visual\
  \ Studio Code 的核心思想是通过仅加载我们需要的工具来保持其轻量、简单、高效和高性能特性。\n\n在 `Explorer`（资源管理器）侧边栏中，你可以访问项目中的所有现有文件夹和文件。此外，可以看到所有链接的项目，以防你在软件开发过程中有多个项目。如\
  \ *图 1.5* 所示，`Editor` 侧边栏是开发代码的地方，可以获取关于代码语法、缩进、代码建议和之前的编码错误消息的提示，并导航到类、函数和方法。编辑器是完全可自定义的，可以更改许多设置，如背景颜色、对比度和字体。考虑到你已经安装了\
  \ C# 语言扩展，编辑器已准备好突出显示代码中最重要的部分，用不同的颜色显示类、方法以及 `String`、`Integer` 等你创建的原始类型。对于其他语言，已发布了不同的扩展，但对于本书的所有示例，C#\
  \ 扩展即可获得所需结果。\n\nVisual Studio Code 是一个基于命令行的编辑器，这意味着一旦熟悉了命令，就可以在不点击鼠标的情况下运行应用程序、构建并创建新文件。这是提高生产力和更好地管理开发环境的一重要功能。所有命令都可以在\
  \ `Terminal`（终端）侧边栏执行，输出窗口将显示结果和命令状态。由于编辑器与命令行结合，Visual Studio 成了世界上最受欢迎的编辑器，即使对于不使用\
  \ .NET Core 和 C# 进行软件开发的开发者也广受欢迎。考虑到该编辑器是一个跨平台开源项目，它被 Linux 用户以及各种语言的软件开发广泛使用。\n\
  \n此外，Visual Studio Code 支持部署和版本控制，可以与 GitHub、GitLab 和 Azure DevOps 无缝集成。\n\n**Visual\
  \ Studio 是创建、运行和构建书中所有代码示例的 IDE，但你可以通过本书附录中的命令行使用 Visual Studio 获得相同的结果。**\n\n\n\
  \n\nVisual Studio Code 是市场上最受欢迎的代码编辑器，由于该项目背后活跃的技术社区，其可用功能正在快速增长，提供了许多扩展和新的集成。\n\
  \n## .NET 平台的历史\n\n.NET 平台的创建于 Web 应用程序流行之前，甚至在 C# 语言第一个版本发布之前。如果我们关注如今对 .NET 的大规模采用，会给人一种场景一直以来如此的印象，特别是对于那些没有经历过\
  \ 20 世纪 90 年代初软件开发阶段的人来说。回顾近三十年前，当 Java 和 PHP 等其他编程语言脱颖而出时（前者用于通用跨平台软件开发，后者用于 Web\
  \ 应用程序），对于微软来说进入这一巨大的开发工具市场似乎是至关重要的。.NET 平台的第一个版本随后于 2000 年作为测试产品发布。最后，在 2002 年\
  \ 2 月，官方 1.0 版本发布，支持 Windows 98、Windows Millennium 和 Windows XP。第一个版本最重要的特性是 `Common\
  \ Language Runtime`（`CLR`），它允许开发者使用多种编程语言创建 .NET 应用程序。.NET 平台能够通过 CLR 执行它，并将其转换为\
  \ `Common Intermediate Language`（`CIL`），也称为 `Intermediate Language`（`IL`）。因此，可以在同一个项目中共享用\
  \ C# 编写的库和用 Visual Basic 编写的组件。在当时，在同一个程序中使用多种编程语言并不意味着可以使用 .NET 创建跨平台软件，而当时只能在\
  \ Windows 操作系统上运行和开发 .NET Framework 应用程序。\n\n2003 年第二季度，发布了 .NET Framework 版本的第一个相关更新（`.NET\
  \ 1.1`），并引入了对 `Open Database Connectivity`（（`ODBC`）的支持，以满足 .NET 应用程序中数据库集成的标准要求。到此为止，.NET\
  \ 平台在市场上尚未被广泛采用，需要发布重要功能以满足最现代的软件开发需求和趋势。\n\n2006 年 1 月，微软发布了 .NET Framework 2.0\
  \ 版本以及其他重要的工具和产品，例如 Visual Studio 2005、更稳定的新的 SQL Server 2005 以及 Biz Talk。该版本最重要的改进之一是对\
  \ 64 位计算机架构的支持，以及 C# 语言的新新功能，如部分类（partial class）、Asp.Net 的新身份验证选项以及“数据表”对象，这些允许我们使用数据集在内存中进行数据库操作。\n\
  \n随着这些新功能，Visual Studio 变得成熟且完善，成为一个完整的 IDE，即使对于使用非 C# 和 Visual Basic 语言的程序员也是。此外，Asp.Net\
  \ Web Forms 开始在具有桌面应用程序经验并迁移到 Web 开发的开发者中被大量采用。Visual Studio 2005 已经包含了可以快速拖放视觉化\
  \ Web 组件并在环境中交互式为这些组件添加事件的功能。这种开发应用程序的方式与桌面应用程序开发非常相似，由于这个原因，以前不熟悉 Web 开发的开发者可以在不费费精力学习\
  \ Web 开发的情况下，开始开发他们的第一个 Web 应用程序。\n\n在 Asp.Net `Model View Controller (MVC)` 引入该平台之前，Asp.Net\
  \ Web Forms 在 .NET Framework 中占据了重要地位。基于表单的网页导航在 Web 早期很常见，它本质上由用户从 Web 浏览器发送请求，服务器返回响应，保持\
  \ Web 控制器的状态，以便为用户提供在网页上导航和与其控制器交互的持续体验。在这种情况下，服务器完全负责处理 HTML 和所有动态数据。该技术使用 View\
  \ State 方法来存储所有服务器端组件的值。此外，Asp.Net Web Forms 提供了每个页面的 HTML 与逻辑代码之间分离文件的选项。这被认为是一项创新，多年后，应用程序的职责分离通过\
  \ ASP.Net MVC 得到了更好的实现。\n\n2006 年 11 月，发布了 .NET Framework 3.0，包括了关于桌面开发和 Web 服务的相关功能。此时，`JavaScript\
  \ Object Notation (JSON)` 尚未被用于集成基于 Web 协议的业务。`Extensible Markup Language (XML)`\
  \ 在很大程度上被用于系统之间的标准通信，而 `Windows Communication Foundation (WCF)` 成为 .NET Framework\
  \ 的官方 Web 服务。一旦 .NET 遵循市场上被采用的最现代模式，用 Web `Application Programming Interface (API)`\
  \ 替换了它，WCF 就变得过时了。\n\nWCF 的益处之一是它与 Visual Studio 工具的集成，这允许我们通过地址导入第三方端点，并在 C# 语言中生成与外部\
  \ Web 服务中指定对象对应的类，即使它是用其他语言编写的。该功能侧重于解释第三方 Web 服务规范的 XML 并创建对象及其属性，而无需编写任何代码行。此外，`Service\
  \ Import` 工具自动生成 C# 语言方法以打开连接并向外部 Web 服务发送请求，并将响应解析为 C# 对象。这是一个极高效率的工具，对于 .NET Framework\
  \ 在市场上的普及至关重要。直到今天，仍有大量公司在使用 WCF 开发的 Web 服务作为遗留项目。ASP.Net Web Forms 应用程序的情况也是如此，考虑到许多公司将其应用于大型项目，并且尚未将它们迁移到更新版本的\
  \ .NET Framework 项目类型或 .NET Core。\n\n另一个引入到 .NET Framework 3.0 的重要技术是 `Windows Presentation\
  \ Foundation (WPF)` 项目类型，这是一种使用 `Extensible Application Markup Language (XAML)`\
  \ 创建桌面应用程序的新方法，并利用 3D 计算机图形硬件开发丰富的用户界面应用程序。它是 .NET 平台中传统的 Windows Form 桌面应用程序的替代方案。尽管\
  \ .NET Framework 3.0 的其他项目类型已成为遗留项目，并且在 .NET Core 之前没有持续更新，但 WPF 仍被公司和 .NET 开发者广泛使用，因为它持续接收更新并在\
  \ .NET Core 中完全支持。\n\n.NET Framework 3.5 于 2007 年 11 月发布，为桌面应用程序带来了性能改进。此外，引入了 Entity\
  \ Framework 的第一个版本，提供了与数据库更好地通信的可能性，并作为其他平台 `Object-Relational Mapping (ORM)` 的替代方案。然而，Entity\
  \ Framework 的新版本直到 2008 年随 .NET Framework Service Pack 1 一起发布，包含了根据技术社区反馈的更新，该版本尚未成熟到足以在全球范围内许多公司中被广泛采用。ORM\
  \ 概念及其重要性在市场上已被广泛接受，在此时，对 Entity Framework 进行巨大的改进变得至关重要，主要是为了给产品提供可靠性和稳定性。\n\n\n\
  \n\n仅一年后，微软就提供了 4.0 版本的 `.NET Framework`，但它并没有引入任何破坏性更改（break changes），也没有许多新功能。这与\
  \ 2012 年 8 月发布的 `.NET Framework 4.5` 不同，后者对 Web 应用程序、桌面开发以及针对 Windows 8 操作系统的原生组件进行了许多改进。在所有新功能中，`Asp\
  \ .Net` 应用的新功能尤为突出，包括对 Web Forms 的 HTML5 支持以及对 Web Socket 协议的支持，这代表了当时遵循最现代 Web\
  \ 标准实践的一大步。此外，通过此版本的 `.NET Framework`，可以使用异步 HTTP 请求和响应。\n\n最后，在 2015 年 7 月，`.NET\
  \ Framework 4.6` 发布，这是在 `.NET Core` 第一版本发布之前，该平台的最后一个大版本，尽管在随后的 4.7 和 4.8 版本中还有小幅更新。4.6\
  \ 版本引入了对 Azure SQL Server 分布式事务的支持、针对 WPF 用户界面的改进以及对 `Asp.Net` 中数据注解属性的本地化支持。\n\n\
  ## .NET Core 版本\n\n考虑到 2015 年当时，信息技术和软件开发市场正在向兼容跨平台的概念发生转变，`.NET Framework` 仅支持\
  \ Windows 操作系统这一事实代表其演进构成了重大限制。公司、开发者和技术社区广泛认为，任何软件开发技术都必须能够在任何操作系统、多台设备上执行，并与其他技术和平台具有互操作性。\n\
  \n为了满足这些新需求，微软于 2016 年 6 月发布了第一版本的 `.NET Core`，这是一个变革性的平台，允许在 Linux 和 macOS 上开发和运行\
  \ `.NET` 应用。用于 `C#` 和 `Vb.NET` 的 `.NET` 库完全从零开始重写，包括新版本的 `Asp.Net` 项目和 `Entity Framework`，它们遵循\
  \ `.NET` 平台的新品牌，均被重命名为 `Asp.Net Core` 和 `Entity Framework Core`。\n\n此外，所有的 `.NET\
  \ Core libraries` 及其项目都变成了开源项目，代码完全在 GitHub 上共享，使得任何人都可以通过报告此新版本的漏洞为该技术的演进贡献力量。对于\
  \ .NET 开发者来说，这是一个巨大的里程碑，考虑到当时只有 `Asp.Net MVC` 项目被认为是开源的，这显著促进了来自其他技术的开发者对 .NET 的采用。\n\
  \n`.NET Core 1.1` 于同同年 11 月发布；它包含了许多针对开发者和公司报告问题的解决方案，并专注于支持更多样化的 Linux 发行版。此外，`Entity\
  \ Framework` 得到了改进以支持 Azure 和 SQL Server 2016 数据库。\n\n2017 年 8 月，`.NET Core 2.0`\
  \ 发布，包含了使用 `.NET Standard` 与旧版 `.NET Framework` 库集的可能性，并通过新功能改进了跨平台支持。此外，该版本带来了新的\
  \ `Razor Pages` Web 项目，作为在 `.NET Core` 平台内创建 Web 应用程序的传统 `Asp.Net MVC` 项目类型的替代方案。此时，`.NET\
  \ Core` 已成为一个成熟平台，被公司和 .NET 开发者广泛采用。跨平台开发支持是 .NET Core 的关键，结合 `Visual Studio Code`\
  \ 和新的命令行选项。明确且正式地，开发者能够创建运行在任何任何地方的 `.NET` 应用，通过 GitHub 存储库参与其后续版本的演进，并从与 `.NET\
  \ Framework` 相比添加到 `.NET Core` 的性能提升中获益。\n\n`.NET Standard` 是 `.NET` 库的通用 API 规范，允许我们在所有\
  \ `.NET` 项目中使用它们。这意味着不同类型的项目能够通过 `.NET Standard` 在之间共享库，包括 `.NET Framework` 项目和\
  \ `.NET Core` 项目之间的实现。`.NET Core` 和 `.NET Standard` 是两个不同的东西。前者与原始的 `.NET Framework`\
  \ 库不兼容，后者是为了作为所有 `.NET` 版本之间的桥梁而设计的。因此，考虑到 `.NET Core` 和 `.NET Framework` 之间没有兼容性，将\
  \ `.NET Framework` 应用迁移到 `.NET Core` 的最佳策略是在 `.NET Standard` 中创建库。这样，就可以保留旧的实现而不会产生破坏性更改，并在迁移逐渐发生的情况下在\
  \ `.NET Core` 项目中使用相同的库。\n\n正如你在 `[figure 1.12]` 中所示，`.NET Standard` 代表了 `.NET Framework`\
  \ 项目和 `.NET Core` 项目的交集，它在 2.0 版本中已经包含了相关的兼容性：\n\n![](img/Figure-1.12.jpg)\n\n**图\
  \ 1.12:** .NET Standard\n\n每个新版本的 `.NET Standard` 都为一般的 `.NET` 项目增加了通用兼容性：`.NET\
  \ Core`、`.NET Framework`、`Mono`、`Xamarin` 和 `Unit`。它的规范是考虑到所有产品（包括移动开发和游戏）的任何 .NET\
  \ 库的基础特性。`.NET Standard 2.0` 支持与 `.NET Framework 4.6.1` 或更高版本互操作。因此，在使用旧版本 `.NET\
  \ Framework`（如 2.0 或 3.5）的项目中，无法使用 `.NET Standard` 库。建议在开始任何向 .NET Core 的迁移之前，将项目迁移到\
  \ 4.6.1 版本。\n\n从第一个版本开始，`.NET Core` 就有了许多改进，并在发布重大新功能的同时，严格遵循了跨平台开发的兼容性。`.NET Core\
  \ 3.0` 代表了软件创建的巨大飞跃，考虑到该版本增加了对 `Windows Form` 应用、`WPF`、人工智能以及物联网开发的支持。在本书的后续章节中，你将有机会深入研究所有这些类型的项目，并理解应用于\
  \ `C# 8.0` 的性能改进，它是该版本的一部分。\n\n2020 年 11 月，微软已经发布了 `.NET 5`，在所有跨平台开发工作达到成熟和稳定后，它代表了使用\
  \ .NET 平台开发的新纪元。这意味着所有的 .NET 库已完全迁移到跨平台开发，并且将 100% .NET 项目开源化的目标已接近实现。\n\n#### .NET\
  \ 5\n\n在所有 .NET 版本中，`.NET 5` 是 `.NET Core 3.1` 和 `.NET Framework 4.8` 的演进，是自 .NET\
  \ 平台自 `.NET Core 1.0` 开始的所有跨平台开发努力整合的一个重大里程碑。因此，可以说 `.NET 5` 是 .NET 生态系统的完全统一，结合了新功能和性能方面的重大改进。\n\
  \n这个统一平台的核心关键点是跨平台方面，这不仅意味着跨多个不同的操作系统，还意味着跨多个设备和平台，如桌面、Web、云端、游戏、物联网、人工智能等。\n\n\
  考虑到 `.NET Standard` 在此地得到了更充分的支持，`.NET 5` 代表了一个完整的 API 提供者，支持 .NET 平台中使用的任何类型运行时的实现。它让我们有机会在\
  \ .NET 5 和构建在 .NET Framework 上的遗留项目之间共享库，只要它们共享基于 .NET Standard 构建的公共层。\n\n\n\n\n\
  使用 .NET 开发跨平台应用需要对整个 .NET 平台进行复杂的重构，这同时也显著提升了 C# 中现有特性的性能，即使是是最常见的特性，如类型转换、并行化等也得到了改进。在本章中，你将有机会基于\
  \ .NET 5 创建最常见的项目类型，并可以结合书中介绍的所有设计模式将所有类型的项目结合。\n\n## C# 语言简介\n\n学习任何编程语言的最佳方法都是创建真实的应用程序进行练习，并将所学的知识应用于真实场景中。首先，有一些适用于任何编程语言（包括\
  \ C# 语言）的基本概念，例如变量、语句、循环、块和迭代。在本章的接下来的章节中，你将有机会创建多个 C# 应用程序，在此期间我们将解释所有的基本概念。\n\n\
  C# 是一种强类型语言（stringly typed language），意味着在创建变量时，它们必须具有特定的类型。因此，如果你创建一个仅用于存储数字的变量并尝试在其中存储文本内容，编译器将显示错误，指示变量的值与变量类型不匹配。在计算机编程中，也有弱类型语言，它们没有经过预编译，而是在应用程序运行时动态检查类型。作为一种强类型语言，在\
  \ C# 语言中，你必须指定程序创建的任何变量的类型，指示要在其中存储的值类型。\n\n编程语言中的变量可以存储数字和字符串等简单的数据结构，也可以包含复杂数据，如文件、自定义对象列表等。正确使用变量是软件开发中的一个重要点，因为它们与我们在任何应用程序中与内存交互的方式密切，并且可以作为衡量代码可读性的良好标准。遵循变量命名相关的良好实践和规范至关重要，不仅对于软件的这一特定小部分，对于\
  \ C# 中使用的其他结构也是如此。在系统中始终使用有意义的名称，类使用驼峰命名法（例如 `MyPbBook`），常量使用大写（例如 `MAX_ITEMS_ORDER\
  \ = 3`）。让你的代码对他人甚至你自己易于阅读。\n\n下面的截图展示了 C# 变量的简单创建和值赋值：\n\n![](img/Figure-1.13.jpg)\n\
  \n**图 1.13:** C# 变量\n\n第 10 行和第 11 行代表 C# 中两个不同类型的变量。第一个是字符串类型的变量，它存储了内容 `I'm reading\
  \ the Design Patterns in .NET Core 3.0 book.`。值必须位于引号周围，因为这是 C# 语言中任何字符串的模式。引用第二个变量（第\
  \ 11 行），它存储了一个小数值 (3.0)，因为它不是字符串，所以值不需要使用引号。变量应该根据其目的命名，并可以在相同上下文的程序部分使用，例如相同的方法的作用域，或者在由于变量被创建为全局变量的情况下的其他方法中。\n\
  \nC# 语言中有许多类型的变量，每种类型都有特定的使用原因。以下主题包含了最流行的类型及其详细说明和示例：\n\n*   `object`:  C# 语言中最基础的类型，因为所有其他类型都派自它。可以向它分配任何类型的值。它被设计为完全通用的，主要用于动态类型，特别是用于内容类型未知时的赋值。\n\
  \n*   `int`: 该类型被用于存储整数（正数或负数）。与任何变量类型一样，它可以存储的值有限制（最大值和最小值）。在这种情况下，最小值是 -2,147,483,648，最大值是\
  \ 2,147,483,647。这种限制有助于防止安全问题并优化内存使用。每当程序中创建一个变量时，内存中都会留出一个空间来存储该值。因此，强烈建议为系统使用的任何变量选择合适的变量类型。此外，在\
  \ C# 语言中可以使用具有其他大小的整数类型。例如，`short` 类型允许我们存储 -32, 768 到 32,767 之间的数字 (`System.Int16`)，`long`\
  \ 类型允许我们存储 9,223,372,036,854,775,808 到 9,223,372,036,854,775,807 之间的整数 (`System.Int64`)，还有更多选项。在特定例程中使用正确类型直接取决于数据对精度和大小的要求。通常，更多使用的是\
  \ `int` 类型，它是一个 32 位数 (`System.Int32`)。然而，关于整数类型的正确选择对于避免生产项目中的运行时问题至关重要且必不可少。\n\
  \n*   `bool`: 其目的是存储布尔值（true 或 false），如下面的截图所示：\n\n    ![](img/Figure-1.14.jpg)\n\
  \n    **图 1.14:** C# bool 变量\n\n    第 9 行表示存储 `true` 值的 bool 变量，第 10 行在控制台上打印底层变量的值。\n\
  \n*   `string`: 如示例 1.8 所示，该类型被用于存储 Unicode 字符序列，并在值周围需要使用引号。它向编译器指示这实际上是一个字符串。此外，可以使用\
  \ `String` 类来实现类似的结果。它们都包含相似的属性，但考虑到大写字母的 `String` 类型是一个复杂类型，在某些对机器资源和相关规模有严格要求的场景中，在内存中的处理效率较低。C#\
  \ 语言中的每个原始类型在 System 命名空间下都有对应的类，例如 `System.String`、`System.Int32` 等。\n\n*   `byte`:\
  \ 它是一种用于存储无符号整数值（0 最小值到 255 最大值）的类型。它通常用于处理字节数组以及底层编程。\n\n*   `char`: 它被创建用于存储单个\
  \ Unicode 字符，与存储序列的字符串类型不同。如果内容只是简单的 Unicode 字符，利用这种类型可以分配更少的内存空间。如果变量中的字符数量是预定义的且只有一个\
  \ Unicode 字符，请选择这种类型而不是 `string` 类型。\n\n*   `float`: 它被用于存储精度在 6 到 9 位之间的数字，最大大小仅为\
  \ 4 字节。\n\n*   `double`: 它存储精度在 15 到 17 位之间的数字，最大大小为 8 字节。\n\n*   `decimal`: 它存储精度在\
  \ 28 到 29 位之间的数字，最大大小为 16 字节。\n\n每种类型都适用于特定类型的数据。例如，decimal 类型被广泛用于存储货币信息。图 1.15\
  \ 给出了最常见用法的示例，如下：\n\n![](img/Figure-1.15.jpg)\n\n**图 1.15:** 类型示例\n\n\n\n\n\n在主题\
  \ 1 到 8 之间表示的所有类型在 C# 语言中都是基本类型，因为它们代表了该编程语言中存储数据的简单结构。每个类型在创建后都会在内存中使用特定的大小，一旦它们被视为引用类型，`.NET\
  \ Core` 平台将以高效的方式对它们进行清理。\n\n在 C# 语言中，值类型变量和引用类型变量之间存在差异。基本类型（`int`、`string`、`bool`\
  \ 等）一旦其值存储在它们自己的内存空间中，就被视为值类型。相反，引用类型在内存中存储一个引用，其底层值存储在不同的内存空间中。当场景需要开发高需求和更好的性能时，熟悉这些差异是非常重要的。\n\
  \n如果将错误的值类型分配给特定类型的变量，编译器将显示错误，程序将无法运行使用像 `C#` 这样的强类型语言具有巨大的优势，因为与只接受动态类型（其值在运行时验证）的语言相比，它可能更早地发现编程问题。下面的图包含了目前为止展示并解释的每个变量的创建和赋值示例，仅关注基本类型以及\
  \ `C#` 编程语言中最常用的类型，如图 1.16*所示：\n\n![](img/Figure-1.16.jpg)\n\n**图 1.16:** C# 中的基本类型\n\
  \n同时，引用类型变量用于存储更复杂的数据，在内存中的存储方式与值类型变量不同。除了基本类型外，还可以创建自定义类型的变量，甚至是 `C#` 语言中其他可原生复杂类型，例如列表、数组等。本质上，创建引用类型的语法是相同的，在变量名之前声明类型。\n\
  \n尽管 `string` 和 `object` 是基本类型，但在 C# 语言中，它们同时被视为引用类型，与 `class`、`interface` 和 `delegate`\
  \ 类型相同。因此，值类型和基本类型之间没有强制性的关系。\n\n接下来的主题包含了最流行的原生引用类型及其带有示例的详细说明：\n\n*   **数组 (Array)**：该类型的目的是存储对象集合，允许在一个变量中包含多个值，从而优化了使用多个不同变量处理大量值的时间。要创建数组，必须声明变量类型后跟方括号，并可以使用逗号分隔来赋值值。如下截图所示，要操作数组中的值，必须使用\
  \ `C#` 语言中任何用的迭代语句（循环、`foreach` 和 `for`），这些将在书中后续详细解释。\n\n    ![](img/Figure-1.17.jpg)\n\
  \n    **图 1.17:** C# 中的数组\n\n*   **列表 (List)**：这是一个复杂对象，允许我们像列表一样操作元素并通过索引访问这些值。该类型包含了一系列扩展功能，用于搜索列表元素、排序和执行各种操作。它是\
  \ `C#` 中常用的类型之一，因为许多程序共同需要处理来自数据库和其他来源元素列表。创建列表时，应该定义元素的类型，并可以使用属于 `List` 类的 `Add()`\
  \ 方法赋值。该类型支持多种操作，这些操作是该类型与数组变量的主要区别。两者在操作元素列表时可以获得相似的结果，但复杂类型 `List` 包含了更高级的选项，可以在不显式引用索引的情况下插入、添加、删除和搜索列表项。这防止了动态操作中的错误，因为数组始终具有特定的值范围。图\
  \ 1.18*提供了 `List` 变量类型及其赋值元素的方法示例：\n\n    ![](img/Figure-1.18.jpg)\n\n    **图 1.18:**\
  \ C# 中的列表\n\n    `C#` 中的列表位于 `System.Collections.Generic` 命名空间下，任何类型都可以与列表类型结合使用，因为它接受泛型（`Generic`）作为参数。可以通过在括号内确定类型参数来指定泛型，如图\
  \ 1.19*所示：\n\n    ![](img/Figure-1.19.jpg)\n\n    **图 1.19:** 泛型类\n\n    在 `My Generic\
  \ Class` 的实例化过程中，必须传递一个特定类型，`My Data` 属性将采用相同的类型，如图 1.20*所示：\n\n    ![](img/Figure-1.20.jpg)\n\
  \n    **图 1.20:** 泛型示例\n\n    在给定的示例中，创建第一个对象时将 `string` 类型作为泛型类型的参数，这意味着该实例的底层的\
  \ `MyData` 属性假设具有 `string` 类型。对于名为 `My Generic Class Two` 的第二个对象也是如此，它接收整数类型作为参数，会自动反映在该对象相关的\
  \ `My Data` 属性上。\n\n*   **类 (Class)**：在 `C#` 语言中，由于它是一门面向对象的语言，可以创建自己的类型。许多与类相关的特殊概念将在本书的第\
  \ 4 章：C# 中的接口*中详细解释，但为了开始学习类，必须知道它们是 `C#` 语言中的引用类型之一，且正确的使用和构建是任何软件最重要的部分。通过类，可以定义属性、可见性、构造函数以及面向对象编程的其他固有概念。下面的截图包含类\
  \ `Book` 的示例，它有六个属性：`Id`、`Title`、`Creation`、`Author`、`Summary` 和 `IsbnNumber`。你必须意识到属性的类型根据要存储的信息对应基本类型或复杂类型。`Author`\
  \ 属性代表 `Author` 类的复杂类型；因此，它引用了另一个实体，如图 1.21*所示：\n\n    ![](img/Figure-1.21.jpg)\n\
  \n    **图 1.21:** C# 中的类\n\n*   **其他类型**：`C#` 中还有其他引用类型，如委托（delegates）和接口（interfaces），它们将在后续章节详细解释。它们涉及更高级的概念，它们的许多示例可以在第\
  \ 3 章：面向对象编程基础概念、第 4 章：C# 中的接口 和第 5 章：C# 中的封装与多态*中找到。\n\n理解最基础的类型将允许你开始进行 `C#` 语言的性能优化，并帮助你遵循编码最佳实践。\n\
  \n\n\n\n\n通过 `while` 语句，可以执行操作直到预定义的条件不再满足（`false`）。程序将在循环开始时测试该条件，如果结果为真（`true`），循环将继续执行。它的用法与\
  \ C# 语言中用于循环操作的其他语句非常相似，但用于判断条件的语法对于试图解释和调试代码的开发者来说足够清晰。在接下来的截图，有一个 `while` 语句的示例，它包含一个持续运行直到条件不满足（数字大于\
  \ 25）的条件，如图图 1.22*所示：\n\n![](img/Figure-1.22.jpg)\n\n**图 1.22:** C# 中的 While\n\n\
  上述代码的目的是打印消息 `Time (s)`，然后是循环执行的时间，它应该运行到指定的次数。因此，考虑到变量 `times Executed` 的初始值为 `0`\
  \ 且该变量在每次迭代中增加一个（如第 14 行所示），该操作将发生 25 次。\n\n## do-while 语句\n\n`do-while` 指令与普通的\
  \ `while` 语句非常相似，不同在于块内的逻辑代码将在测试预定义条件是否满足之前运行。接下来的截图包含了与上一个示例完全相同的目的和逻辑编程，但使用了 `do-while`，如图图\
  \ 1.23*所示：\n\n![](img/Figure-1.23.jpg)\n\n**图 1.23:** C# 中的 do-while\n\n当某些操作需要在程序测试条件之前完成时，这种类型的循环非常有用，这代表了它与\
  \ `while` 语句的主要区别。\n\n在这个简单的例程中，`timesExecuted` 的初始值为 `0`，循环体在第一次没有测试条件的情况下执行执行。在体内部，`timesExecuted`\
  \ 的值增加 1，这意味着该程序将执行 25 次。在特定情况下，`while` 测试的条件可能永远无法满足，这将导致死循环。\n\n## for 循环\n\n\
  在编程语言中，有许多方法可以类似的结果，这一前提也适用于 C# 中的循环操作。除了 `while` 和 `do-while` 语句外，还可以使用 `for` 循环来实现类似的操作，它允许我们在循环开始运行之前已知循环次数时执行重复操作。要使用这种循环，你必须按照以下要求创建一个\
  \ `for` 语句：\n\n*   必须在 `for` 语句内部创建一个包含迭代初始值的变量。\n*   需要被测试并满足的条件应使用为初始迭代创建的变量。\n\
  *   执行次数应该是递增的且是预定义的。\n\n为了清楚地理解这种类型的循环操作，你必须查看图 1.24*，它包含了与之前示例相似的目的：\n\n![](img/Figure-1.24.jpg)\n\
  \n**图 1.24:** C# 中的 For 循环\n\n如图图 1.24*所示，变量 `timesExecuted` 在 `for` 循环指令内部声明，增量过程发生在需要满足的条件之后。如果你与之前解释的\
  \ C# 循环相比，它看起来比其他的更简单、更易读，但它具有相同的目的，即在屏幕上打印 25 次内容。因此，在逻辑操作中有许多方法可以达到相同的目标，你必须根据你自己的企业解决方案场景选择合适的方法。\n\
  \n## foreach 语句\n\n`foreach` 循环可用于执行元素列表以及 C# 中实现 `IEnumerable<T>` 接口的任何类型中的操作。图\
  \ 1.25*展示了它如何通过为列表中的每个单独项执行代码块来实现：\n\n![](img/Figure-1.25.jpg)\n\n**图 1.25:** C#\
  \ 中的 Foreach*\n\n如 `foreach` 语句示例所示，第 10 行创建了一个字符串项列表，在第 11 行和第 19 行之间，填充了周几（从周一到周日）。最后，列表中的每个单独项都会执行一次\
  \ `foreach` 指令。这意味着用于打印 `Day of Week` 的代码块运行了 7 次。通常情况下，如果包含重复的逻辑操作，循环实现的优势在于可以编写更少的代码。在这个例子中，并没有指定\
  \ 7 次 `Console.WriteLine` 指令（每天一次），而是只指定了一次。\n\n# 运算符\n\n运算符不仅广泛用于数学运算，还用于编程语言，以进行算术运算、值之间的比较以及指定布尔值的条件。C#\
  \ 语言包含大量的运算符，在接下来的主题中，你将有机会学习它的主要类型。\n\n### 算术运算符\n\n这种类型用于执行加、减、除、乘和其他常用操作。可以使用变量或直接指定这些操作，如图图\
  \ 1.26*所示：\n\n![](img/Figure-1.26.jpg)\n\n**图 1.26:** C# 中的算术运算符\n\n如上述截图所示，在第 12\
  \ 行和第 15 行之间，创建了变量来存储两个数字 `number1` 和 `number2` 的算术总和。需要注意的是，必须创建总和变量以支持结果。如果两个数字中有一个带有小数（例如\
  \ `25.4`），则总和变量应该是小数类型甚至是浮点类型，取决于字符的数量。\n\n### 赋值运算符\n\n最常用的运算符是等号运算符，它用于为变量赋值，如图图\
  \ 1.27*所示：\n\n![](img/Figure-1.27.jpg)\n\n**图 1.27:** C# 中的赋值运算符\n\n赋值运算符也经常用于条件和比较语句，但使用的是两个组合的运算符，如图图\
  \ 1.28*所示：\n\n![](img/Figure-1.28.jpg)\n\n**图 1.28:** 等号运算符\n\n在给定的示例中，第 12 行使用运算符\
  \ `==` 来验证 `Day` 属性是否等于数字 `4`。因此，等号运算符在这种语境下具有不同的含义，不是赋值运算符。\n\n在第 9 行，创建了一个名为 `myMessage`\
  \ 的 `string` 变量，并使用运算符 `=` 为其分配了值。同样的过程发生在第 11 行，但是针对 `int` 类型。可以使用赋值运算符按顺序为多个变量赋值值，这意味着所有变量最终将具有相同的值。如第\
  \ 15 行所示，`int` 变量被赋值为值 `10`。因此，C# 语言中的等号运算符并不一定仅用于算术运算，还可以用于设置值。变量始终放在左侧，值放在右侧。\n\
  \n### 关系运算符\n\n\n\n\n\n在任何编程语言中，常见的逻辑实现之一就是布尔表达式，考虑到系统可能有一段根据某些条件遵循特定逻辑的例程。为了实现这一目标，C#\
  \ 语言包含了许多关系运算符，允许我们根据需要对值进行比较，范围从最简单的操作到最复杂的操作不等。下表包含了 C# 语言中可以使用的所有关系运算符：\n\n|\
  \ 名称 | 运算符 | 示例 | 预期结果 |\n| :--- | :--- | :--- | :--- |\n| 等于 | `==` | `25 == 25`\
  \ | True |\n| 不等于 | `!=` | `25 != 10` | True |\n| 小于 | `<` | `25 < 15` | False |\n\
  | 大于 | `>` ` | `25 > 15` | True |\n| 小于等于 | `<=` | `25 <=25` | True |\n| 大于等于 |\
  \ `>=` | `25 >=25` | True |\n\n**表 1.1:** C# 中的关系运算符\n\n关于等号运算符，在 C# 语言中，重要的是要知道为了在两个值之间进行比较，应该使用两个等号运算符。这样，编译器就会将其识别为比较而不是值赋值。此外，运算符\
  \ `!` 可用于反转任何语句的布尔值。*图 1.29* 包含了 C# 中每个关系运算符的示例：\n\n![](img/Figure-1.29.jpg)\n\n\
  **图 1.29:** C# 中的关系运算符\n\n如 *图 1.29* 所示，创建了一个名为 `resultOperation` 的变量，用于存储每个关系操作的布尔结果结果。\n\
  \n## 逻辑运算符\n\n逻辑运算符用于在复合条件中组合多个关系运算符。它们只是返回真或假值的布尔语句。这种类型的运算符很大地用于逻辑实现中的循环和决策语句，当一个句子中需要满足一个或多个条件时。\n\
  \n`AND` 和 `OR` 运算符可以组合以进行不同的比较，取决于它们的顺序，语句可以返回不同的结果。\n\n例如，假设程序有一个特定的操作，该操作仅在周一或周二时运行。在这种情况下可以使用\
  \ `OR` 运算符，如 *图 1.30* 所示：\n\n![](img/Figure-1.30.jpg)\n\n**图 1.30:** C# 中的 \"OR\"\
  \ 运算符\n\n如代码第 12 行所示，有一个 `if` 语句包含两个由关键字 `||` 分隔的比较表达式，这在 C# 中等同于 `OR` 运算符。在这种情况下，只有当两个条件中的至少一个满足时，`if`\
  \ 块中的代码才会运行：如果星期几是 `Monday` 或 `Tuesday`。\n\n否则，在测试多个条件且所有条件都真的情况下，可以使用 `AND` 运算符。该运算符在\
  \ C# 中的关键字是 `&&`，如 *图 1.31* 所示：\n\n![](img/Figure-1.31.jpg)\n\n**图 1.31:** C# 中的\
  \ \"AND\" 运算符\n\n在示例中，只有当当前星期几为 `Saturday` 且当前小时大于 6 时，执行 `if` 语句内部代码块的条件才会满足。\n\
  \n## 一元运算符\n\nC# 语言具有目的在于使用单个操作数进行操作的运算符。编写特定的例程（如增加数字、反转布尔值的值、递减数字等）可以节省时间。\n\n\
  在 C# 中为整数变量增加一个额外的数字，可以使用运算符 `++`，并且可以使用两个减号运算符从包含数字数值的变量中减去 1，如 *图 1.32* 所示：\n\n\
  ![](img/Figure-1.32.jpg)\n\n**图 1.32:** C# 中的一元运算符\n\n前面的实现与使用算术运算符给变量加 1 值相同，例如：`numberExample\
  \ = numberExample + 1`。显然，一元运算符的语法在获取相似结果所需的代码量方面经过了极大优化。\n\n## 三元运算符\n\n另一种有助于减少逻辑语句中代码行数的运算符是三元运算符，在条件结果导致变量赋值的情况下，它可以替换用于比较的\
  \ `if` 语句。如下所示截图示例所示，有一个 `string` 类型的变量 `message`，其值是一个使用运算符 `?` 和 `:` 的三元表达式。如果比较条件满足，它将赋值消息\
  \ `Today is Monday,`，如果不满足，则赋值值为 `Today is not Monday`，如 *图 1.33* 所示：\n\n![](img/Figure-1.33.jpg)\n\
  \n**图 1.33:** C# 中的三元运算符\n\n在条件复杂且包含复合语句的情况下，不建议使用三元运算符条件。这会使代码难以阅读。请改用 `if` 语句。\n\
  \n## 复合赋值运算符\n\n与三元和一元运算符类似，复合类型有助于减少行数，并使某些操作更容易完成。任何算术运算符后跟等运算符 `=` 在 C# 编译器中意味着该算术操作应应用于变量本身。*图\
  \ 1.34* 包含了 `+`（加法）和乘法的复合赋值运算符示例：\n\n![](img/Figure-1.34.jpg)\n\n**图 1.34:** 复合赋值运算符\n\
  \n如果逻辑实现包含复杂操作，使用复合赋值运算符可能会增加算法的阅读难度。因此，在包含许多部分的情况下，考虑使用显式变量。\n\n## if 语句\n\nC#\
  \ 语言包含许多用于在布尔表达式中创建不同条件的运算符。这清楚表明了通过实现精确语句控制软件行为的重要性。为了正确使用运算符，你必须了解 `if` 语句，它允许我们在满足特定条件时执行特定的代码部分。否则，可以指定在条件不满足时运行的实现。这种逻辑语句是任何编程语言中常见的常见的操作之一，C#\
  \ 语言具有清晰的语法，如 *图 1.35* 所示：\n\n![](img/Figure-1.35.jpg)\n\n**图 1.35:** 复合赋值运算符\n\n\
  在示例中，如果星期几等于 `Saturday`，将运行一个特定的代码块，如果条件结果为假，则运行另一个代码块。这种使用方法主要适用于根据条件结果明确地需要执行两个不同事项的情况。如果逻辑需求在\
  \ `if` 或 `else` 语句内部包含许多子条件，建议使用其他语言结构，如 `switch`，将在下一个主题中解释。\n\n\n\n\n\n`switch`\
  \ 分支语句适用于逻辑实现包含多个备选项的情况，因此只有其中一个代码块会被执行，换句话说，就是与预定义的比较值匹配的那个选项。当一个值需要通过许多条件进行测试，甚至条件超过两个或三个时，通常会使用\
  \ `switch` 语句，如图 1.36*所示：\n\n![](img/Figure-1.36.jpg)\n\n**图 1.36:** Switch 语句\n\
  \n在这个示例中，一个值（星期几）针对 7 个选项进行测试，每个选项对应指令中的 `case`。如果满足了其中一个条件，程序将执行底层 `case` 和 `break`\
  \ 之间指定的代码块。当工作流可能包含多个选项，且每个选项应执行的程序略有不同时，这种方法暴露系统需求非常有用。在 C# 编程语言中，使用 `switch` 语句处理多个选项而不是\
  \ `if` 语句是一种良好的实践。如果在图 1.37*所示的示例中使用 `if` 语句，代码将如下所示，这是不推荐的：\n\n![](img/Figure-1.37.jpg)\n\
  \n**图 1.37:** Switch 语句\n\n这种实现方式与之前的示例相同，但包含的行数多得多，读取也复杂得多。因此，当一个值需要与多个值进行比较时，建议使用\
  \ `switch` 语句。\n\n# 错误处理](#toc.xhtml_s20a)\n\n市场上存在的每个软件都可能存在实现错误、意外行为和执行问题。这些问题的产生有很多原因，例如类型转换错误、内存泄漏问题、数据问题、错误的转换类型等。每种编程语言都有处理这些可能错误的特定方法，对这些映射可以显著提高软件的稳定性。\n\
  \nC# 语言包含了原生实现，可以正确捕获程序可能的所有错误，并显示关于异常原因的有价值且详细的信息；如果异常与原生 .NET Core 库有关，它还包含修复错误的建议。在任何软件开发中，使用第三方库和来自其他系统的资源（如数据库、外部服务等）都是常见的。与这些第三方的集成通常需要网络连接进行通信，甚至需要它们处于可用。因此，系统应该有一种可靠的方法来防止在此过程中可能发生的异常，并且当软件的任何部分出现问题时，程序必须实现自定义例程。\n\
  \nC# 语言中的错误处理必须使用三个组合代码块：`try`、`catch` 和 `finally` 关键字，它们代表了发生软件故障时采取适当自定义操作的方法。异常处理可以应用于应用程序的多个层次，花费足够的时间为您的软件项目正确规划错误处理的最佳策略是非常关重要的。\n\
  \n# 异常](#toc.xhtml_s21a)\n\n在软件开发中，异常是应用程序可能发生的所有错误。它们使得我们能够对执行过程中可能发生的任何错误进行自定义实现，并给其提供特定的方向。\n\
  \n在接下来的截图中，有一个异常处理实现的示例。在这种情况下，方法接收一个人的年龄值，并在 `age`（年龄）无效时，通过向系统抛出异常来处理这些可能的异常，如图\
  \ 1.38*所示：\n\n![](img/Figure-1.38.jpg)\n\n**图 1.38:** 抛出异常\n\n.NET Core 库包含了许多继承自主类\
  \ `System.Exception` 的异常类。在这个示例中，使用了 `ArgumentOutOfRangeException`，向系统传递了一个引用问题原因的自定义消息错误。在这种情况下，`age`\
  \ 值不允许为负数。异常可以被有意地抛出，也可能源于软件的意外行为。\n\n`try` 和 `catch` 块应由有效使用该方法验证 `age` 的代码部分使用。抛出异常的规则是在子方法中实现的，以下包含一个如何使用\
  \ `try` 和 `catch` 块在发生错误时执行自定义操作的示例，如图 1.39*所示：\n\n![](img/Figure-1.39.jpg)\n\n\
  **图 1.39:** 抛出异常\n\n如示例所示，`ValidAge` 方法在 `try` 块代码内部调用，如果发生异常，系统将根据异常类型执行底层的 `catch`\
  \ 块。如果错误已知原因，它将显示与无效值相关的特定消息。如果异常未知原因，系统将在控制台中显示带有通用信息的消息。在实际场景中，如果方法抛出了自定义异常（例如\
  \ `age` 为负数），程序可以有一个例程，以验证消息的形式向用户显示错误。\n\n异常处理是任何软件项目最重要的部分之一，因为通常直接关系到用户体验。因此，所有可能的异常都必须在开发阶段进行映射，并根据系统需求采取行动。\n\
  \n当系统使用外部资源甚至与第三方系统集成时，通常应该实现一个例程来防止内存中对象的释放问题。例如，如果在向外部数据库记录某些内容时发生错误，无论处理是否成功，建议关闭与数据库的连接。为了正确处理这一点，你必须使用\
  \ `finally` 块，即使抛出了异常它也会执行，如图 1.40*所示：\n\n![](img/Figure-1.40.jpg)\n\n**图 1.40:**\
  \ 抛出异常\n\n在之前的截图中可以看到，在 `try` 块中调用验证方法后，系统调用 `SavePerson` 方法，该方法在实际场景中具有打开连接并取决于网络可用性的操作。即使操作失败，系统也会关闭数据库连接，如图\
  \ 1.31*第 25 行到第 27 行所示。`finally` 块代码在所有情况下都会执行，遵循之前的 `try` 和 `catch` 块的顺序。\n\n#\
  \ 命名空间](#toc.xhtml_s22a)\n\nC# 语言中的命名空间功能允许我们根据逻辑标准分离并保留一组类。每个类都属于一个特定的命名空间；这些我们创建的或者是\
  \ .NET 平台提供的。要定义命名空间，只需在类名之前指定用点分隔的路径，如图 1.41*所示：\n\n![](img/Figure-1.41.jpg)\n\n\
  **图 1.41:** 命名空间定义\n\n在给定的示例中，`MyClass` 类属于 `DesignPatternsBook.Models` 命名空间。因此，在这种语文中，逻辑上是将所有模型保持在同一个命名空间下。如果类需要被另一个命名空间使用，可以使用\
  \ `using` 指令来获取相关类的可见性，如图 1.42*所示：\n\n![](img/Figure-1.42.jpg)\n\n**图 1.42:** 命名空间使用\n\
  \n\n\n\n命名空间（namespace）的使用允许组织复杂的项目，以便将类保持在类似的范围范围内。\n\n# C# 9.0 的新特性 (#toc.xhtml_s23a)\n\
  \n.NET 5 为 C# 语言带来了一系列有趣且实用的特性，这些特性一直是技术社区、开发者和公司渴求的。其中之一就是使用顶层语句（top-level statements），它通过移除所有不必要的代码简化了示例应用程序的创建，如图\
  \ 1.43*所示：\n\n![](img/Figure-1.43.jpg)\n\n**图 1.43：**顶层语句\n\n上一个示例代表了一个标准的控制台应用程序，但没有调用传统的\
  \ `Program` 类（包括 `main` 方法）。图 1.44 显示了在 .NET Core 3.1 之前的状态：\n\n![](img/Figure-1.44.jpg)\n\
  \n**图 1.44：**顶层语句\n\n.NET 3.1 版本中的简单 `Program` 有 13 行，而 .NET 5 版本仅有 4 行。同样的简化也存在于\
  \ Python 等语言中，而且自 C# 9.0 以来，它也是 .NET 平台的一部分。\n\n此外，C# 9.0 提供了一种更好的创建新对象的方法，简化了构造方法的调用。图\
  \ 1.45 显示了 C# 9.0 与之前的版本在实例化新对象方面的差异：\n\n![](img/Figure-1.45.jpg)\n\n**图 1.45：**顶层语句\n\
  \n随着 C# 语言版本的更新，现在可以使用 `new` 关键字创建新对象，而无需指定类的类型。这种创建对象的新方法在需要创建复杂对象类型（如字典和复杂列表）的情况下是一个很好的替代方案，在语法上是一个非常风趣的简化。\n\
  \nC# 9.0 的另一个新特性是使用记录类型（record types），它使我们能够创建具有隐式只读属性的不可变对象，这在许多场景下是数据传输对象（DTO）的实用用替代方案。要创建记录类型，必须使用\
  \ `record` 关键字，如图 1.46*所示：\n\n![](img/Figure-1.46.jpg)\n\n**图 1.46：**记录类型\n\n起初，它看起来是一个普通的类结构，但与普通类略有不同。任何属性都没有指定\
  \ `read-only` 关键字；然而，它们是只读成员，因为没有声明设置器（setter）语句。此外，记录类型让我们有机会使用 `with` 关键字创建对象的克隆或副本，如图\
  \ 1.47*所示：\n\n![](img/Figure-1.47.jpg)\n\n**图 1.47：**\"with\" 关键字的使用\n\n使用 `with`\
  \ 关键字允许我们在修改非只读属性的同时克隆对象。在 JavaScript 和其他语言中可以找到类似的语法，记录类型与 `this` 关键字的结合在克隆操作方面节省了时间，并更好地利用了内存。\n\
  \n除了书中更详细介绍的特性外，这个 C# 新版本还引入了对代码生成器的支持，能够在标准的 C# 编译实现之上创建分析器。它是集成、可重用以及创建需要与 C#\
  \ 语言底层原生实现紧密交互的自定义组件的强大替代方案。\n\n# 结论 (#toc.xhtml_s24a)\n\nC# 语言包含了基础指令，允许我们开发和实现任何软件中呈现任何标准功能。尽管每个程序都有独特的需求，但大多数应用程序必须代表一组\
  \ C# 语言支持的简单且基础的操作。\n\n在本章中，你学习了 C# 中非常重要且基础的概念，例如变量、逻辑语句、运算符、错误处理以及不同类型的循环和迭代。现在，你能够学习\
  \ C# 中更高级的编码概念，并开始下一个相关的主题。\n\n在下一章中，你将学习 .NET Core 平台，并将有机会了解该平台上提供的最常见的项目类型，包括\
  \ Web 应用程序、移动开发、桌面实现等。\n\n# 记忆要点 (#toc.xhtml_s25a)\n\n*   要开发 .NET Core 应用程序，必须安装最新版本的\
  \ Visual Studio 或 Visual Studio Code。\n*   C# 语言包含了处理软件执行过程中可能发生的异常和系统错误的特性。\n*\
  \   要开始学习 C#，必须熟悉变量类型、循环语句、运算符和错误处理。\n\n# 多选题 (#toc.xhtml_s26a)\n\n1.  **哪个选项仅包含关系运算符：**\n\
  \n    1.  `==, !=, >, <`\n    2.  `!=, >, <, if`\n    3.  `Switch, for, foreach,\
  \ equal`\n    4.  都不是\n\n2.  **哪种类型的变量用于存储真和假值：**\n\n    1.  `String`\n    2.  `Int`\n\
  \    3.  `Bool`\n    4.  `Decimal`\n\n3.  **以下代码中 \"isValid\" 的值是多少：**\n\n    ```\n\
  \    int age = 25;\n    bool isValid = age > 18;\n    ```\n\n    1. False\n    2.\
  \ True\n    3. 25\n    4. 18\n\n4.  **执行以下代码后，number 的值是多少？**\n\n    ```\n    int\
  \ number = 78;\n    number++;\n    ```\n\n    1. 78\n    2. 77\n    3. 80\n    4.\
  \ 79\n\n5.  **假设你有一段连接数据库的例程。考虑到可能会发生网络问题，建议在哪个块中关闭数据库连接：**\n\n    1. `try` 块内部\n\
  \    2. `catch` 块内部\n    3. `finally` 块内部\n\n# 答案 (#toc.xhtml_s27a)\n\n1.  a\n2.\
  \  c\n3.  b\n4.  d\n5.  c\n\n# 问题 (#toc.xhtml_s28a)\n\n1. C# 中可用的循环语句有哪些？\n2. 实现具有三个条件的逻辑语句的最佳替代方案是什么？\n\
  3. `try catch` 块的作用是什么？\n\n# 关键术语 (#toc.xhtml_s29a)\n\n*   **异常 (Exceptions)**：软件执行过程中可能发生的错误。\n\
  *   **运算符 (Operators)**：C# 语言包含许多用于算术运算、简化迭代和测试条件的运算符。\n\n# 第二章 (#toc.xhtml_c02)\n\
  \n# .NET 5 简介 (#toc.xhtml_c02)\n\n在本章中，我们开始进入跨平台和现代 .NET 5 的世界。.NET 平台已经演变为提供强大的库，允许我们为任何操作系统甚至多个不同的设备构建应用程序，利用软件开发最佳实践的优势。你将学习如何设置构建\
  \ .NET 5 应用程序的环境并理解跨平台概念，这是该平台的主要优势之一。考虑到软件开发市场已转向关注开源项目，了解 .NET 5 如何工作以及你如何使用这种出的技术构建强大的跨平台企业应用程序是至关重要的。\n\
  \n# 结构 (#toc.xhtml_s30a)\n\n在本章中，我们将讨论以下主题：\n\n*   跨平台概念\n*   .NET 5 应用程序的主要方面\n\
  *   .NET 5 项目类型概述\n\n# 目标 (#toc.xhtml_s31a)\n\n学习本单元后，你应该：\n\n*   理解跨平台概念\n*   讨论可选\
  \ .NET 5 项目类型\n*   在 .NET 5 中创建最基础的项目\n\n# 2.1 理解跨平台概念 (#toc.xhtml_s32a)\n\n\n\n\
  随着过去十年云应用的兴起，市场竞争已从软件许可证的争夺转向云系统基础设施服务，以支持对可扩展性、现代应用、大数据、全球化和开放市场的高需求。因此，对盈利能力的关注不再集中在操作系统上，而是转向可靠的基础设施，因为许多公司正在改变业务模式，提供基于`软件即服务`（`SaaS`）概念的解决方案。\n\
  \n尽管如此，大型 IT 公司仍在发布和创建新的操作系统，现在的注意力完全在开源项目上，任何现代应用程序都能够在 Linux、macOS 和 Windows 平台上运行。此外，随着`物联网`（`IoT`）的兴，运行应用程序的设备类型变得更加多样，使得软件开发过程更加复杂。不久前，每个\
  \ Web 开发者最关注的问题是如何成功在多个不同的浏览器中正确运行同一个应用程序，而这仍然是一个巨大的挑战。但是，尽管 Web 应用程序是从多个操作系统访问的，但通常应用程序托管在服务器上，该服务器的规格是受控的，使用单一的操作系统和平台。这种场景迅速转变为另一种更复杂的场景，基于跨平台环境，旨在提高兼容性、降低成本并利用微服务架构更快速地向全球更多相关用户交付应用程序。\n\
  \n因此，为了满足这些新需求，微软提供了 `.NET 5` 平台，这是一个丰富且强大的技术，旨在字面意义运行在任何地方、任何操作系统上，重写了 `.NET Framework`\
  \ 中出现的所有库并在性能方面获得了更好的结果。在 `C#` 语言和 `.NET Framework` 的最初，它们完全是为仅支持 Windows 平台设计的，这在市场采用中是一个明显的限制，因为在特定场景下，构建桌面应用程序时，此类项目的项目需要冗余地编写两次甚至更多，从而增加了任何项目的成本。为了满足多平台应用程序的创建，微软创建了\
  \ `.NET Core 1.0`，在此之后不断升级，直到当前的 `.NET 5`，`.NET 5` 代表了所有 `.NET Core` 版本的整合：`1.0`、`2.0`、`2.2`、`3.0`，以及最终的\
  \ `.NET 5`。\n\n使用 `.NET 5` 构建应用程序允许您编写一个唯一的应用程序，该程序可以托管在任何平台、许多类型的设备、不同的云基础设施上，并被大量的\
  \ `Web APIs` 调用。这代表了 `.NET` 世界的一场革命性变化，并将该技术置于市场的显著位置。此外，`.NET` 的另一个重要动态是它变成了一个开源项目。因此，个人、公司和学术机构都可以对该平台的演进做出贡献，由于这变成了现实，`.NET`\
  \ 社区一直是世界上最活跃的社区之一。\n\n### 2.2 .NET 5 主要项目类型概述\n\n要开始使用 `.NET 5`，我们必须意识到它支持的主要项目类型。结合本书的示例，你将有机会为多个平台（Web、桌面端和移动端）创建各种类型的应用程序，而本节仅代表用于构建企业级应用程序的所有类型的简要概述。默认情况下，Visual\
  \ Studio 已经包含了特定的项目模板，以利于创建 `.NET 5` 项目。其中一些由微软提供，另一些则由技术社区作为开源项目提供。\n\n一旦你使用 Visual\
  \ Studio 开始新项目，将出现可用选项，如下截图所示：\n\n![](img/Figure-2.1.jpg)\n\n**图 2.1:** Visual Studio\
  \ 项目选项\n\n如你所见，`.NET 5` 应用程序提供了多种编程语言、平台和项目类型，包括移动应用开发、桌面应用程序、Web 开发、机器学习和游戏。\n\n\
  ### 2.2.1 控制台应用程序\n\n为了开始 `.NET 5` 项目类型，我们将创建一个简单的控制台程序（Console App），这是桌面应用程序的标准项目，允许我们在后台运行应用程序并与简单的用户交互集成。要创建项目，在打开\
  \ Visual Studio 并访问项目类型列表（图 2.1`）后，你必须选择 `C#` 语言和 Windows 平台。这将过滤结果仅显示适用类型。由于 `.NET\
  \ 5` 代表 `.NETCore 3.1` 的演进，取决于你的 Visual Studio 版本，项目模板名称将包含关键字 `Core`，尽管项目可以不受限制地设置为\
  \ `.NET 5`。此外，你可以在搜索框中输入单词 `Console`。这样，你将获得控制台应用程序模板类型，如下截图所示：\n\n![](img/Figure-2.2.jpg)\n\
  \n**图 2.2:** 控制台应用程序\n\n如果你不熟悉 `C#` 语言，这将是你开始学习该语言及其结构、关键字和语句的第一机会。一旦你在应用程序创建对话框中确认了项目名称并进入下一步，结果是一个简单的控制台应用程序，仅包含一个名为\
  \ `Program.cs` 的类。要查看类的内容，只需双击打开该文件，Visual Studio 将在代码编辑器部分显示该类，如图 2.3`所示：\n\n![](img/Figure-2.3.jpg)\n\
  \n**图 2.3:** Program.cs\n\n每个 `C#` 应用程序都通过命名空间组织，如图 1.10`中的第一行所示。一个标准的企业应用程序可能有许多库、包和各种命名空间。它们的名称和路径按照逻辑顺序排列，它们可能原生属于\
  \ `C#` 语言（例如 `System` 命名空间），而其他的可能属于自定义或第三方实现。\n\n对命名空间、类、方法和变量遵循并良好的命名规范是编码的最佳实践之一，且适用于任何编程语言。在系统中始终使用有意义的名称，对类采用驼峰命名法（例如\
  \ `MyPbBook`），对常量使用大写字母（例如 `MAX_ITEMS_ORDER = 3`）。让你的代码对他人甚至你自己来说易于阅读。\n\n第 3 行包含了我们项目的自定义命名空间引用（`ConsoleAppBook`），它通常是项目名称或公司组织名称，取决于应用程序的架构和团队的技术决策。默认情况下，控制台应用程序有一个名为\
  \ `Program` 的主类和一个名为 `Main` 的静态方法，该方法将在应用程序启动后开始运行。示例中 `Main` 类的内容是一个 `Console.WriteLine`，该方法会在屏幕上打印\
  \ `I’m learning .NET Core` 内容，而 `Console.Read` 方法将要求用户输入内容。\n\n一旦通过 Visual Studio\
  \ 使用调试上级菜单选项中的**开始调试**选项运行，应用程序将启动，并在控制台中显示 `Main` 方法中指定的短语，如下截图所示：\n\n![](img/Figure-2.4.jpg)\n\
  \n**图 2.4:** 控制台应用程序调试\n\n\n\n\n.NET 平台中另一种常见的项目模板是 Windows Forms 项目，它允许我们使用视觉组件创建丰富的桌面应用程序，并能轻松与\
  \ Windows 及其他平台的原生桌面组件集成。.NET Core 的第一个版本（1.0 和 2.x）不支持 Windows Forms 应用程序，但从 .NET\
  \ Core 3.0 版本开始正式引入，并延续了 .NET 5 的后续改进。与 .NET Core 版本相比，自 .NET 3.0 以来引入的最改进之一与自包含可执行文件（self-contained\
  \ executable files）有关，这意味着应用程序是在启用自包含模式下构建的，.NET 将生成一个包含应用程序所用所有库和文件的单个文件。可执行文件将包含所有必要的项目依赖项，例如\
  \ .NET 原生库和第三方实现。因此，安装应用程序的机器不需要安装任何额外的库或 .NET 环境。可执行文件包含了所有必要内容。它便于了在任何环境下的部署、安装、维护甚至软件更新，而且它不仅在\
  \ Windows 操作系统上正常运行，在 Linux 和 macOS 上也能正常工作。\n\n### 2.2.2 Windows Forms\n\n要开始创建\
  \ Windows Forms 应用程序，你必须进入本章已显示的创建模板对话框，搜索 Windows Forms，结果将显示 Windows Forms 项目类型作为建议，如下截图所示：\n\
  \n![](img/Figure-2.5.jpg)\n\n**图 2.5：** Windows Forms\n\nVisual Studio 提供了大量的视觉组件，可用于\
  \ Windows Forms 应用程序。考虑到几乎所有的企业应用程序都共享相同或至少相似的视觉组件，可用列表非常有用且有帮助。其中包含针对常用表单控件的特定控件，如\
  \ `TextBox`、`Label` 和 `ListView`。它还包含许多使用原生操作系统功能的选项，如媒体播放器、嵌入浏览器、文件和文件夹操作等。要访问完整的可用列表，只需进入\
  \ Visual Studio 的左侧栏并打开那里的 `Toolbox`（工具箱）标签。\n\n你可以直接将组件拖入表单并视觉化地更改它们的属性，或者访问 `Properties`\
  \ 标签：选择组件并点击右侧栏的 `Properties` 标签，如下截图所示：\n\n![](img/Figure-2.6.jpg)\n\n**图 2.6：**\
  \ Visual Studio Windows Forms 区域\n\n要为组件添加逻辑语句，你必须双击控件以访问与组件关联的源代码控制。每个视觉控件都有与组件类型相关的自定义事件，考虑到你可以在设计模式下开始逻辑编码，Windows\
  \ Forms 是学习 C# 语言最简单的方法之一，因为你可以快速看到代码运行的结果。此外，一旦在 Visual Studio 中创建了项目，程序即可无需额外配置直接运行，提高了生产效率和部署率。作为一种跨平台解决方案，基于\
  \ .NET 5 构建的 Windows Forms 应用程序已准备在任何平台上使用和安装，例如 Linux、macOS 和 Windows 操作系统。\n\n\
  要开始 Windows Forms 应用程序开发，一旦你在 Visual Studio 中创建了应用程序，就将 `TextBox` 和 `Button` 控件拖入表单；你可以根据意愿放置它们。选择每个控件，只需进入右侧栏的\
  \ `Properties` 标签，并将 `TextBox` 的 `Name` 属性更改为 `txtName`，将按钮控件更改为 `myButton`。完成这些操作并点击上方工具栏上的\
  \ `Start` 按钮后，Windows Forms 应用程序将运行，设计将如截图所示：\n\n![](img/Figure-2.7.jpg)\n\n**图\
  \ 2.7：** Windows Forms 示例\n\n从概念和程序员的角度来看，Windows Forms 项目类型的设计初衷是简单且快速地创建。与 Web\
  \ 开发不同，你可以在视觉模式下创建系统的所有屏幕，并仅对事件、方法和按钮的逻辑部分进行编码，例如数据库调用操作、与外部 API 通信，甚至执行以满足用户系统的业务操作。\n\
  \n一旦简要接触了 .NET 5 中的两种桌面项目类型（控制台和 Windows Forms），还有其他你在关于 Web 开发时必须了解的项目类型。第一个是 Asp.Net\
  \ Core Web API 项目类型，它允许我们创建基于 REST 的应用程序接口（API）应用程序，满足了 Web 服务、安全性和性能的所有最现代需求。\n\
  \n**REST 是 Representational State Transfer（表述状态转移）的缩写，是一种用于构建和定义 Web 服务的标准架构。这种方法最大的优势是跨许多语言和平台的互操作性。此外，大多数现代\
  \ Web APIs 都基于 JSON（JavaScript 对象表示），这是一种广泛用于系统间数据对象传输的模式。所有现代语言都提供了正确处理 JSON 对象的方法。它已成为系统集成最流行的方式。**\n\
  \n### 2.2.3 Asp.Net Core Web 应用\n\n要在 .NET 5 中创建 Web API 项目，你必须在 Visual Studio 项目创建对话框的搜索框中搜索\
  \ Asp.Net Core，为其命名，它将重定向到 .NET 5 可用的 Web 项目类型列表。选择 API 类型并完成最后一步，如下截图所示：\n\n![](img/Figure-2.8.jpg)\n\
  \n**图 2.8：** Asp.Net Core 5.0 Web API\n\n创建完成后，Visual Studio 将生成一个基于模型-视图-控制器（MVC）架构的基础结构\
  \ Web API，该架构将在书中进一步解释。每个 API 还有多个称为端点（end points）的方法。每个暴露的方法都可能包含安全设置、允许的 HTTP\
  \ 动词配置以及根据每个端点的主要目标执行必要操作的逻辑编程。要创建一个新的端点，你必须采取以下步骤：\n\n1. 在解决方案管理器（Solution Explorer）右侧栏显示的\
  \ `Controller` 文件夹上点击右键，创建一个新的 `Controller`。有几种控制器类型，但它需要是空控制器（API Controller Empty）。\n\
  2. 为控制器命名，例如 `CustomerController` 并保存。\n3. Visual Studio 将生成一个没有方法的 `Controller`\
  \ 类。要插入一个方法，创建一个返回字符串类型的公共方法，并返回一个底层字符串内容进行测试。\n4. 创建公共方法后，有必要指定该方法允许的 HTTP 动词，例如\
  \ `HttpGet`，它指定该方法应由应用程序使用 `GET` 方法调用，应用程序将使用此 API。通常，不同的 HTTP 动词用于不同的目的：例如，`POST`\
  \ 用于插入数据，`GET` 用于通过 API 获取数据。\n5. 完成所有步骤后，你的代码将如下截图所示：\n\n   ![](img/Figure-2.9.jpg)\n\
  \n   **图 2.9：** Asp.Net Core Web API 代码\n\n\n\n\n为了组织方便，通常 Web API 项目中的所有控制器都共享与\
  \ `WebAPIBook` 相同的命名空间，如你在第 8 行所示。此外，每个控制器必须在类名上方使用注解 `ApiController`，以告知 .NET Core\
  \ 应用程序该控制器应作为 Web API 端点被访问。此外，你可以指定用于访问此控制器中所有方法的路由或路径。在示例中，路由是域名后跟后缀 API、控制器名称和方法名，如你在第\
  \ 10 行所示。运行项目后，此示例的路径将是 `https://localhost/api/customer/getname`。通过此 URL 运行应用程序，结果如下所示：\n\
  \n![](img/Figure-2.10.jpg)\n\n**图 2.10：** Asp.Net Core Web API 结果\n\nAPI 方法返回了在其上指定的内容，并遵循返回类型和所实现的自定义逻辑。在更复杂的场景中（你将在后续根据书中的示例进一步实现），API\
  \ 将连接数据库以获取客户名称，并填充 `Customer` 对象以返回数据。控制器通常包含针对应用程序其他层面的逻辑编程代码。\n\n.NET 中另一种常见的项目类型是传统的\
  \ Asp.Net Core `MVC`（模型视图控制器）项目，这是 Visual Studio 中最流行的模板之一，考虑到它被许多公司广泛使用，甚至用于从旧\
  \ .NET Framework 版本迁移而的项目。\n\n**MVC 模式是 Web 应用最著名的架构之一，不仅在 .NET 平台上是如此。这种方法遵循了编程的重要最佳实践，例如应用程序层之间的职责分离，并且有助于在复杂性上进行系统扩展，使得多个并行团队可以在同一个项目中工作，而不会产生巨大影响或合并问题。**\n\
  \n要开始使用 Asp.Net Core MVC 项目，你必须在 Visual Studio 中创建一个构型为该类型的新项目。在项目创建对话框中，搜索 `Asp.Net`\
  \ 并选择 `Asp.Net Core Web Application` 选项，如下所示所示：\n\n![](img/Figure-2.11.jpg)\n\n\
  **图 2.11：** Asp.Net Core MVC 项目\n\n在下一步，在定义项目名称后，选择名为 Web Application (Model View\
  \ Controller) 的模板。项目创建后，Visual Studio 将为标准的 MVC 应用生成默认的文件夹和文件结构。项目中有三个主要文件夹：Model（模型）、View（视图）和\
  \ Controller（控制器），对应 MVC 架构。\n\n`Model` 负责根据某些系统要求维护应用程序的状态，而应用程序的其他层负责正确地填充和管理模型。`View`\
  \ 负责渲染用户界面，例如 HTML、CSS 和 JavaScript。默认情况下，在 Asp.Net Core MVC 项目中使用 Razor 引擎将 .NET\
  \ Core 代码与 HTML 混合。这种方法使得能够在 Views 内部使用 `C#` 实现和使用逻辑编程，并与 HTML 元素进行交互。最后，`Controller`\
  \ 的目的是管理路由和用户操作，如页面请求、表单提交以及其他类型的数据请求和用户交互。一旦用户请求了一个操作，它将根据指定的并关联的路径由特定的控制器管理。每个控制器可以包含并支持许多操作，每个操作都拥有自己的职责和逻辑编程实现。\n\
  \n### 要创建你的第一个自定义 MVC 应用程序，只需执行以下步骤：\n\n1. 在 Visual Studio 解决方案资源管理器中，在 `Models`\
  \ 文件夹上点击右键，选择添加类的选项并命名为 `Book`。它将生成一个空的 `book` 类。你必须创建该类的属性，如下一张截图所示：\n\n    ![](img/Figure-2.12.jpg)\n\
  \n    **图 2.12：** Book 模型\n\n    如 *图 2.12*所示，为 `Book` 类创建了两个属性：`Id` 和 `Title`。它们将在控制器完成逻辑处理后用于在\
  \ View 上渲染书籍信息。\n\n2. 在 Visual Studio 解决方案资源管理器中，在 Controllers 文件夹上点击右键，选择添加空 MVC\
  \ 控制器的选项并命名为 `BookController`。它将生成一个空的控制器类。默认情况下，脚架功能会生成一个没有实现的 `Index` 方法。由于此示例的目的是在\
  \ View 中显示书籍，我们必须在 Controller 中实现它，向 View 返回 `Book` 模型类的实例。为了得到此结果，该类应具有以下实现，如下所示所示：\n\
  \n    ![](img/Figure-2.13.jpg)\n\n    **图 2.13：** Book Controller\n\n    如 *图 2.13*所示，在\
  \ `Index` 方法内部创建了一个 `Book` 类的实例，并填充了特定的示例值属性。由于 View 将使用这些信息，因此书籍对象在第 16 行的 `return\
  \ View` 指令中作为参数传递。\n\n3. 最后一步是创建 View 本身以拥有完整的 MVC 示例。在 `Views` 文件夹上点击右键并创建一个名为\
  \ `Book` 的新文件夹。在 Asp.Net Core MVC 应用程序中，`Views` 文件夹与控制器强相关。所有由特定控制器处理的 Views 都应该放在\
  \ `Views` 文件夹内与控制器同名的文件夹中。每个返回 View 的操作必须存在于与控制器关联的 `View` 文件夹中。创建 `Book` 文件夹后，在\
  \ `Book` 文件夹上点击右键添加新的 View 文件，并命名为 `Index`，其值与 Controller 中存在的方法相同。\n\n    考虑到 View\
  \ 包含 HTML 代码，并且可以使用 Razor 引擎与服务器端代码进行交互，View 必须混合 Razor 代码语法和实现项目展示所需的代码。此外，由于示例控制器有一个方法返回一个填充好的\
  \ `book` 对象给 view，你必须在文件顶部引用与 view 关联的模型类型，并可以使用 Razor 语句调用模型属性，如下所示：\n\n    ![](img/Figure-2.14.jpg)\n\
  \n    **图 2.14：** Book View\n\n    在第 6 行到第 10 行之间，有显示由 Controller 填充书籍信息属性的代码。View\
  \ 只接收来自控制器的数据，不建议在上面有过多实现，因为 View 的主要职责是渲染数据并展示给用户。最后，在 Visual Studio 中运行项目并输入控制器的路径（book\
  \ 后接 index），可以可以看到以下结果，如下所示：\n\n    ![](img/Figure-2.15.jpg)\n\n    **图 2.15：**\
  \ Asp.Net MVC 结果\n\n另一种在 .NET 应用中非常流行的项目类型是 Razor 项目，它允许我们从 Razor 引擎中获益，但并不强制使用完整的\
  \ MVC 架构。这种类型的项目适用于小型项目，或者只需要一个展示层来调用外部 API 的项目，考虑到逻辑编程的巨大复杂性被交给了第三个项目。\n\n\n\n\n\
  要创建一个 `Razor Pages` 项目，请进入 Visual Studio 项目创建对话框并选择 `Asp.Net Core Web Application`\
  \ 选项，然后选择 `Web Application` 类型。这将创建一个简单的 Web 项目，其中包含一个名为 `Pages` 的文件夹，你的视图将放置其中。如下屏所示，它的结构比\
  \ MVC 项目更简单，并且没有遵循任何架构模式：\n\n![](img/Figure-2.16.jpg)\n\n**图 2.16:** Razor pages\n\
  \n如果你想使用与视图关联的模型和控制器，你必须在 Razor 页面内部引用它们的代码。考虑到每个页面都包含其逻辑实现，每个页面都可以被视为一个独立的组件。对于简单的数据输入和非复杂的逻辑操作来说，这是一个很好的选择。此外，这种项目类型增加了构建应用程序所需的时间，因为它不需要配置路由，也不需要在正确的位置强制性地命名文件夹和文件。\n\
  \n每个视图都有一个同名的服务器端代码文件关联，但扩展名为 `.cs`。你必须将所有的逻辑实现和模型引用放在此 `.cs` 文件中，类似于在 `Book` 示例中所做的那样。此外，它可以拥有多个与页面关联的方法，这与\
  \ MVC 方法不同，MVC 中控制器操作与视图之间存在强关联。出于这个原因，Razor pages 项目被认为更灵活，尤其在简单的场景下。\n\n考虑到许多遗留项目是使用\
  \ .NET Framework 中过时的 Asp.Net Web Forms 项目类型开发的，因此阅读旧版 Asp.Net Web Forms 与 Asp.Net\
  \ Core Razor Pages 进行比较的文章或演示是非常常见的。然而，它们在本质上是完全不同的。Razor Pages 不基于回传（Postback）概念，并且在所有的页面生命周期中都不会在服务器保留视图状态。\n\
  \nBlazor 项目模板从 .NET 3.0 开始引入 .NET 平台，已准备生产使用。这种类型的项目使用 Web Assembly 和 Razor 引擎创建直接在浏览器上运行服务器端代码的强大客户端应用程序。通常，基于\
  \ Web 技术的常规系统只渲染到客户端的 HTML、CSS 和 JavaScript。在 Blazor 项目中，可以在浏览器上直接运行 C# 代码。\n\n\
  此外，在 Visual Studio 可用的项目模板中，有很多移动开发和游戏开发的选项。第一个是基于 Xamarin 的，该框架允许我们仅使用 C# 语言为 Android\
  \ 和 iOS 创建多平台移动应用程序。这是一个令人印象深刻的引擎，它使得创建一个单个应用并为 Android 和 iOS 平台生成底层原生代码成为可能，提高了生产力，并提高了传统使用\
  \ Java 或 Apple 技术构建应用的的移动开发者对 .NET 平台的采用率。对于游戏开发，可以使用 C# 使用 Unity 3D，并复用 .NET 5\
  \ 的所有原生库。\n\n## 结论\n\n.NET 5 平台的创建是为了满足所有必要的跨平台需求，能够针对最流行的操作系统（如 Linux、macOS 和 Windows）开发企业级应用程序。正如你在本章中看到的，可以使用\
  \ Visual Studio IDE 和 Visual Studio Code 开发和构建 .NET 5 应用程序，并从公司以及对 .NET 5 相关开源项目做出贡献的个人开发者提供的所有扩展中受益。\n\
  \n在本章中，你学习了跨平台概念的核心信息，并熟悉了 .NET 5 中存在的主要项目类型（如 Web 和桌面应用程序），并创建了实用示例。\n\n在下一章中，你将学习与面向对象编程相关的最佳实践。此外，你将有机会通过实际练习应用所有相关概念。\n\
  \n## 记忆点\n\n*   Visual Studio 包含许多类型的项目，有助于在 .NET Core 中创建项目。\n*   C# 语言可以用于 .NET\
  \ 中的所有项目类型。\n*   .NET 5 允许我们为 Web、桌面和移动平台创建跨平台应用程序。\n\n## 问题\n\n1. 创建 .NET 5 应用程序有两种工具可用？\n\
  2. 解释将项目从 .NET Framework 迁移到 .NET 5 的最佳策略。\n3. 在哪个版本的 .NET 中添加了对 Windows Presentation\
  \ Foundation（WPF）的支持？\n\n# 第 3 章：## 面向对象编程的基础\n\n软件开发是一个抽象的过程，与现实世界的关联通过实现业务或系统需求来实现，这些需求在软件中通常以可靠的方式表示，通常使用面向对象的编程范式。这背后的概念帮助软件行业为企业应用程序创建了更稳定、可读和可扩展的代码。它让普通开发者的日常工作变得更加容易，为使用任何支持该范式的任何语言开发的任何用例带来了智能设计。\n\
  \n此外，面向对象的讨论为市场带回了许多补充和贡献，例如 SOLID 原则概念，这提高了全球软件的质量，并提供了构建健壮且可扩展应用程序的可能性，将软件工程在技术和专业水平推向新的高度。此外，由于这些事实，对于当今的任何开发者来说，正确学习这种范式并能够在真实且复杂的场景中应用其概念是至关重要的，这是市场上几乎所有开发者职位的强制性要求。\n\
  \n在本章中，你将有机会学习面向对象编程的核心概念，如类、构造函数、方法、抽象类和静态类、继承和接口。此外，还将介绍设计模式和 SOLID 原则的解释和示例。\n\
  \n## 结构\n\n在本章中，我们将讨论以下主题：\n\n*   类、构造函数和方法\n*   静态类和方法\n*   结构体 (Structs)\n*  \
  \ 抽象类、继承和接口\n\n# 目标\n\n学习本单元后，你应该：\n\n*   理解面向对象编程概念\n*   讨论设计模式的关键方面\n*   使用面向对象编程创建基础应用程序\n\
  *   在实际项目中使用 SOLID 原则\n\n## 类、构造函数和方法\n\n从零开始学习面向对象编程（`OOP`）概念，你必须知道市场上的任何软件以及使用任何编程语言实现的任何代码都有一个要实现的目标，一个基于业务或系统需求的意图。在软件工程中，解决同一个问题有很多方法。然而，从维护和编写易读代码的角度来看，设计一个与软件尝试解决的实际问题相关的现实世界代码是至关重要的。OOP\
  \ 帮助我们抽象软件开发的复杂性，并使技术实现与我们可能找到的大多数场景之间保持良好的关联。\n\n\n\n\nOOP（面向对象编程）允许我们围绕对象来组织软件需求的实现，这些对象代表了系统中某些需要抽象实体的行为和状态。一个对象可以包含属性和方法，负责维护和操作其状态，以及与对象本身相关的某些操作。在\
  \ C# 语言和其他其他基于 OOP 范式的语言中，对象由 `class` 表示，该类应该能够忠实地反映与现实世界的相似特征。\n\n为了更好地理解，请想象这样一个场景：需要使用\
  \ C# 语言和 .NET 开发一个在线商店。根据这个虚构案例，系统应该实现以下需求：\n\n1. 允许用户注册产品和产品类型。\n2. 每个产品都应该有一个唯一的数字来标识产品，并有一个标题。\n\
  3. 访问在线商店的人被视为用户，但不一定会进行购买。\n4. 一旦用户在在线商店完成购买，该用户应被注册为客户，并带有额外信息。\n5. 产品可以根据其类型包含不同的属性。\n\
  \n考虑到给定的场景，如果我们开始规划代码结构以保持一切组织良好，那么我们必须先创建类，并包含这些类中每个对象共有的基本属性。从产品模型开始，该类的初始实现如下截图所示：\n\
  \n![](img/Figure-3.1.jpg)\n\n**图 3.1：** Product 类\n\n在这种情况下，字段 `Id`、`Title` 和 `Price`\
  \ 代表 `Product` 类的属性，每个属性都有自己的类型，例如整数、字符串和十点数。你必须注意到每个属性之前都有一个关键字。该关键字意味着属性的访问修饰符或作用域。在\
  \ OOP 中，有以下访问修饰符：\n\n* **Public（公共）：** 类或属性可以被其他类自由访问，即使是不同一个程序集中的类也可以访问。\n* **Private（私有）：**\
  \ 属性只能由属性所属的同一个类访问。\n* **Protected（保护）：** 属性只能由同一个类或派生类访问。\n* **Internal（内部）：**\
  \ 属性或类可以被其他类访问，但限制是类必须属于同一个程序集。\n* **Protected internal（保护内部）：** 类或属性可以被同一个程序集中的任何其他类访问，也可以被所有派生类访问，即使它们在另一个程序集中。\n\
  \n根据关键字的不同，访问级别如下图表示所示：\n\n![](img/Figure-3.2.jpg)\n\n**图 3.2：** 访问级别\n\nOOP 有一些原则强制执行使用范式进行编码的最佳实践，其目的是不违反任何使用这些概念的软件都应遵循的机制，例如封装、继承、多态和可重用。以下章节提供了关于其中每项的详细信息。\n\
  \n## 封装\n\n这个概念的目的是避免外部对对象状态的干扰，保护对类及其方法的访问。要成功实现这一目标，理解访问级别属性至关重要，这在本章之前已经解释过。控制对属性、方法和类的访问可以确保只有需要访问其他特定代码的代码受到控制。在\
  \ OOP 中，每个类必须是独立的，并包含满足其目标所需的代码。\n\n## 继承\n\n遵循可重用原则，在 OOP 中可以使用继承概念，它允许我们共享大部分具有共同特征的属性和方法。继承另一个类的类被称为派生类，而基类被称为父类。C#\
  \ 语言允许一个类只与一个类相关继承，但可以使用接口来实现类似的目标。继续之前的在线商店示例，商店可以包含许多不同类型的产品，这些产品之间会共享共同属性和方法，但其他属性可能是每个产品特有的。例如，`Movie`\
  \ 类是产品的一种，并与其他产品具有相似的特征，如 `Id`、`Title` 和 `Price`。但特定属性只与 `Movie` 类相关。考虑到图 3.1 中看到的\
  \ product 类已经包含了特定属性，`Movie` 类可以继承 `Product` 类，如下所示：\n\n![](img/Figure-3.3.jpg)\n\
  \n**图 3.3：** Movie 类\n\n在类的签名中，声明继承自 `Product` 类，这意味着 `Movie` 类将包含来自 `Product` 类的所有属性以及自身类的特定字段：发布日期、类别和时长。决定是否继承另一个类取决于上下文，通常基于业务需求。\n\
  \n## 可重用性\n\n通常，任何软件的成本都是通过编写代码花费的小时来衡量，此外还有业务分析、软件设计和管理等活动。考虑到开发软件的时间是项目成功的关键点之一，有必要使用允许我们在构建正在开发的软件时节省时间的。。无疑，可重用性是\
  \ OOP 的核心概念之一，因为它代表了更短的系统开发时间。回到在线商店示例，考虑到它已经实现了一个基类 `Product`，如果在线商店有大量不同类型的产品，那么使用基类将为实现其他类时节省大量时间。这也适用于更复杂的场景，在这些场景中，不仅简单的属性和方法可以重用，整个库和外部功能也可以。\n\
  \n## 多态\n\nOOP 中的概念允许我们重写父类的方法，并在多个类之间共享标准接口，以确保软件架构的完整性和一致性。正如其名称所示，多态是一个通用方法具有多种形式的可能性。在在线商店示例中，假设每个产品都可以根据自定义规则应用折扣。在这种情况下，基类\
  \ `Product` 将有一个标准方法来计算折扣，但所有派生类都可以根据特定情况重写其行为。\n\n例如，父类 `Product` 可能有一个应用 7% 折扣特定方法，如下所示：\n\
  \n![](img/Figure-3.4.jpg)\n\n**图 3.4：** Product 类中的折扣方法\n\n另一方面，子类 `Movie` 可以重写\
  \ `ApplyDiscount` 方法的实现，如下所示：\n\n![](img/Figure-3.5.jpg)\n\n**图 3.5：** Movie 类中的折扣方法\n\
  \n`Movie` 类正在应用不同的折扣策略，因为折扣值为 10%，因此与父类不同。可以更改父类中方法的实现，但前提是父类中的方法具有 `virtual` 修饰符，如图\
  \ 3.4 所示。\n\n\n\n\n\n## 部分类 (Partial class)\n\n为了保持良好的编码实践和项目结构，通常所有的类都呈现于同一个文件中，且该文件的名称与类名相同，如下截图所示：\n\
  \n![](img/Figure-3.6.jpg)\n\n**图 3.6：** 类的文件命名模式\n\n然而，当类包含大量代码行，且在许多开发者需要同时在同一个文件中工作的情况下，将类拆分到多个文件中是比较方便的，这可以避免冲突并实现逻辑分离，以便更好地理解。尽管该类显示在多个文件中，但编译器会将所有它们合并为一个单一类。在接下来的代码示例中，有两个关于\
  \ `Product` 类的文件，一个包含字段，另一个包含方法，如下截图所示：\n\n![](img/Figure-3.7.jpg)\n\n**图 3.7：**\
  \ Product 部分类\n\n使用 `partial` 关键字将类转换为部分类，它只包含了应用 `discount` 方法。相反，另一个包含 `Product`\
  \ 类实现的文件将只提供属性，如下截图所示：\n\n![](img/Figure-3.8.jpg)\n\n**图 3.8：** Product 部分类\n\n\
  部分类的使用非常灵活，但建议仅在类大到可以进行拆分的情况下才这样做。此外，如果一个类包含大量代码行，通常是该类应该进行重构以遵循单一责任原则的明确指示，这是 SOLID\
  \ 原则中的一种良好实践，将在本章中进一步解释。\n\n## 构造函数 (Constructor)\n\n在面向对象编程 (OOP) 中，构造函数是在对象实例创建时被调用的方法。换句话说，类包含实现部分，每当使用一个类时，就会创建一个与该类类型相同的对象。在在线商店的场景中，假设系统中有一个名为\
  \ `Product` 的类，每当需要使用该类时，我们必须引用该类并创建一个新的对象实例，如下截图所示：\n\n![](img/Figure-3.9.jpg)\n\
  \n**图 3.9：** Product 对象实例\n\n当使用 `new` 关键字时，它指示编译器应该创建一个 `Product` 类的新实例，该对象将放置在内存中的新空间中。此外，在此操作中，新对象会被初始化，并并了构造函数方法。你可以在类中指定多个构造函数方法，所有的方法的名称都与类名相同，如下截图所示：\n\
  \n![](img/Figure-3.10.jpg)\n\n**图 3.10：** 构造函数\n\n通常，构造函数方法用于设置对象的初始状态，如果没有指定 `constructor`\
  \ 方法，编译器将运行默认构造方法，这是一个 `empty` 方法。理解构造函数如何工作是至关重要的，因为对象的状态管理是正确应用 OOP 范式最佳实践的主要点之一。\n\
  \n在构造函数传递参数也是可能的，在特定情况下，这对于对象初始化时执行某些操作是必要的，如下截图所示：\n\n![](img/Figure-3.11.jpg)\n\
  \n**图 3.11：** 带参数的构造函数\n\n类可能因为不同的特定原因拥有多个构造函数。这取决于类的用途以及类中属性和方法定义的访问级别。\n\n## 静态类\
  \ (Static classes)\n\n在 C# 语言中，静态类表示无法创建实例的类。这意味着系统将在内存中保留该类的单一实例，并供整个系统使用。考虑到这一特性，当意图使用静态类时无法使用\
  \ `new` 关键字。通常，静态类用于类不需要动态保持其状态的情况。例如，在线商店可以有一个静态类来为系统执行某些常见操作，如类型转换、数学运算等。下面的截图包含一个名为\
  \ `Helper` 的静态类示例，它有一个返回唯一标识符的方法：\n\n![](img/Figure-3.12.jpg)\n\n**图 3.12：** 静态类\n\
  \n如上一个截图所示，使用了 `static` 关键字将 `Helper` 类转换为静态类。考虑到无法创建静态类的实例，如果实现尝试执行该操作，编译器将生成错误，如下截图所示：\n\
  \n![](img/Figure-3.13.jpg)\n\n**图 3.13：** 静态类的编译错误\n\n要使用静态类中提供的方法，你必须直接调用这些方法而不使用\
  \ `new` 关键字，如下截图所示：\n\n![](img/Figure-3.14.jpg)\n\n**图 3.14：** 静态类的正确用法\n\n通常，当定义静态类时，其所有成员在静态性方面都遵循相同的签名，以保持类的一致性。\n\
  \n## 结构体 (Structs)\n\nC# 语言中的结构体在实现上与类相似，包括属性和方法。然而，它们之间的主要区别在于它们在由 C# 开发的程序中存储在内存的方式。传统的类被视为引用类型，这意味着该类型不在内存中存储其值，而只存储将存储该值的地址。相反，结构体包含自己的值，因此，访问其值的速度比引用类型快得多。此外，结构体与类相比有以下限制：\n\
  \n- 不可以在继承过程中使用结构体。\n- 不可以使用空构造函数。它必须具有带参数的构造函数。\n- 在创建局部变量时需要为它们赋值。\n- 从 `struct`\
  \ 类创建的对象实例在使用它的方法处理完成后，将从内存中移除。\n\n结构体的语法与类非常相似，如下截图所示：\n\n![](img/Figure-3.15.jpg)\n\
  \n**图 3.15：** 结构体类\n\n结构体必须具有带参数的构造函数，如下截图所示：\n\n![](img/Figure-3.16.jpg)\n\n**图\
  \ 3.16：** 构造函数\n\n结构体在使用高性能要求的系统特定部分非常有用，当实现的主要用途仅是保持对象的临时状态且其生命周期在方法调用内部已知时。\n\n\
  ## 接口 (Interfaces)\n\n在 OOP 中，接口表示所有实现接口的类都应该遵循的约定。换句话说，接口包含了类强制要求的所有内容，例如属性和方法，并遵循特定的签名。这一概念对于正确实现业务需求以及为开发过程提供一致性至关重要。\n\
  \n在 C# 语言中，可以使用 `interface` 关键字在接口名称之前创建一个接口。作为一个概念，接口不包含任何实现，实现是实现接口的类的责任。回到在线商店的示例，假设有一个要求所有产品类型都应该实现一个引用交付方法的需求；可以创建一个接口以确保所有与产品类型相关的类都实现该方法。基础产品接口看起来如下截图所示：\n\
  \n![](img/Figure-3.17.jpg)\n\n**图 3.17：** 构造函数\n\n\n\n\n根据此接口，所有实现此接口的类必须包含一个名为\
  \ `Deliver` 的方法，该方法的签名必须相同且没有任何返回值。为了强制接口与相关类之间的约定，在类的签名中，你必须在名称后声明一个或多个接口，如下截图所示：\n\
  \n![](img/Figure-3.18.jpg)\n\n**图 3.18:** 结构体的构造函数\n\n考虑到从该点起，`Product` 类实现交付方法是强制性的，在\
  \ C# 8.0 版本之前，编译将显示一个错误，指责缺少底层实现。但是，从 C# 语言 8.0 版本开始，可以在接口中指定默认实现，相关类不需要实现具有相同签名的方法。因此，在接口中拥有默认实现是可能的，如下截图所示：\n\
  \n![](img/Figure-3.19.jpg)\n\n**图 3.19:** 结构体的构造函数\n\n接口的另一个方面是，你不能更改或指定接口中属性和方法的访问级别，因为它们默认都是公开的（public）。这意味着在属性无法无法\
  \ `private`、`protected` 或 `internal` 关键字。方法和属性可以不指定访问级别进行声明，如下截图所示：\n\n![](img/Figure-3.20.jpg)\n\
  \n**图 3.20:** 无访问级别的接口\n\n接口的使用可以降低软件的复杂性，并提高代码的可维护性，因为它们为类提供了一致性，并提供了跨系统应用模式的可能性。此外，接口对于使代码层的测试变得至关重要，因为实现具有更通用的结构，可以对系统的不同部分应用不同的测试，而无需在测试计划中花费过多精力。\n\
  \n## 结论\n\n正如在本章中所看到的，OOP 范式是 C# 语言的基础，它是软件开发良好实践中最重要的概念之一，代表了每个开发者必须了解的内容。该范式的正确使用允许公司创建可测试、可扩展且稳定的软件，并有助于降低开发过程的成本，最大限度地减少项目引入问题的风险。所有业务和系统需求的逻辑实现都组织在类中，这些类可以被重用、测试和扩展。所有类必须具有更改类本身或属性访问级别的修饰符。此外，C#\
  \ 语言包含了优化内存使用（结构体）的选项，并允许我们通过应用接口概念并利用 SOLID 原则的所有优势，为软件架构提供一致性和完整性。\n\n通过本章，你学习了如何创建类、属性、方法并更改它们每个的访问级别。此外，你还有机会熟悉\
  \ C# 语言中的接口、结构体和其他类型，这允许你能够在实际项目中创建和应用 OOP 范式的概念。最后，你学习了 SOLID 原则的基本概念，并能够识别系统中可以使用这些原则进行改进的点。\n\
  \n在下一章中，你将有机会学习更多关于 OOP 中接口和继承的复杂概念，并将这些概念应用于更高级的场景中。\n\n## 知识点回顾\n\n*   对象代表 OOP\
  \ 中类的实例。\n*   接口是约定，对于任何与之相关的类，在实现方法和属性时是强制性的。\n*   继承是 OOP 范式中重用代码的最佳方式。\n\n##\
  \ 多选题\n\n1.  **哪种结构类型可以用于为 C# 中的类指定约定？**\n    1. 属性\n    2. 接口\n    3. 继承\n    4.\
  \ 保护 (Protected)\n2.  **单个类可以关联多少接口？**\n    1. 一个\n    2. 两个\n    3. 五个\n    4.\
  \ 无限制\n3.  **限制对同一程序集访问的访问级别是？**\n    1. 保护 (Protected)\n    2. 公开 (Public)\n  \
  \  3. 内部 (Internal)\n    4. 私有 (Private)\n\n## 答案\n\n1. b\n2. d\n3. c\n\n## 问题\n\
  \n1. 解释类和结构体（structs）的区别。\n2. 简述 SOLID 原则的含义。\n\n# 第四章\n\n## C# 中的接口\n\n接口是面向对象编程中最重要且核心的概念之一，正确使用它们可以带来实现强大且可扩展软件架构的优势，解决复杂实现方面的实际问题，并为任何项目提供在多种场景下遵循的良好标准。考虑到在\
  \ C# 语言中，可以使用单继承继承，接口在对象定义、可扩展性和面向对象编程中的身份方面代表了一种良好的替代方案。\n\n通过本章，你将有机会深入学习 C# 中接口的实现，并理解如何在不同场景下使用其概念，实现可测试和可重用的功能代码，始终利用面向对象编程最佳实践的优势。\n\
  \n学习接口的高级概念是非常重要的，因为它让你有机会在现实项目中恰当地应用这些概念，并让你对遗留代码、第三方库特别是整个 .NET 平台有更好的理解，因为它大量使用了接口以及依赖注入和依赖倒转等相关概念。\n\
  \n## 结构\n\n在本章中，我们将讨论以下主题：\n\n*   接口的定义和实现\n*   创建可测试类\n*   依赖注入概念\n*   使用接口的最佳实践\n\
  \n# 目标\n\n学习本单元后，你应该能够：\n\n*   理解接口概念\n*   使用 C# 语言应用接口\n*   根据接口的最佳实践创建基础应用程序\n\
  *   构建可测试的类\n\n## 接口的定义和实现\n\nC# 中的接口是模拟多继承行为的最有效方式，考虑到 .NET 不支持多继承（即单个类派生自多个一个类）。接口代表了一种约定，任何实现它的类都应该遵守该约定，就像法律合同一样。一旦在接口中定义了方法或属性，使用该接口的类必须实现该接口的所有规范。\n\
  \n传统上，接口只包含签名而不包含实现。然而，C# 8.0 引入了一项新功能，允许我们为方法指定默认实现，它在特定场景下代表了抽象类的替代方案。根据定义，接口是每个需要使用接口的类所需的方法和属性组。它为软件开发提供了一致性和完整性，并使测试、更改和扩展功能变得更容易。\n\
  \n\n\n\n例如，想象这样一个场景：需要实现一个允许用户注册不同类型产品的系统。所有产品具有相似的共同属性和特征。尽管如此，它们仍然存在相关的差异，因此使用一个包含所有产品通用属性的接口是合理的。某些产品可能具有独特的规格，例如理想温度和过期日期。此外，其他产品可能具有更新的属性，例如法律要求和基于安全的角色。考虑到产品可能的多样性，在面向对象的编程中，要创建一个单一类来包含所有产品的所有潜在属性和方法，并通用地表示每种特定情况是不可能的。\n\
  \n因此，下面的截图展示了产品接口的一个简单示例：\n\n![](img/Figure-4.1.jpg)\n\n**图 4.1:** 产品接口\n\n在这种情况下，名为\
  \ `IProduct` 的接口包含了所有实现其契约的产品类都将共享的方法和属性。在给定的场景中，类必须定义负责计算折扣方法的逻辑例程，如果该方法没有相同的签名和名称，编译器将抛出错误。该方法是合约的一部分，引用该接口的类都应该遵循。通过这种方式，我们保证了代表相同语境的代码片段之间的统一性。在\
  \ C# 语言中使用接口时，你必须在类名之后引用它；继承也是这样做的。如果类中缺少属性、方法或事件实现，Visual Studio 将显示警告，指示接口的哪些规格尚未实现，如下截图所示：\n\
  \n![](img/Figure-4.2.jpg)\n\n**图 4.2:** 接口实现错误\n\n在这个示例中，创建了一个名为 `MobilePhone` 的类，考虑到接口尚未被实现，在完整实现接口之前，在\
  \ Visual Studio 中无法编译项目。考虑到类可能包含接口定义的要求的属性之外的属性和方法，可以为每个产品提供特定的行为。`IProduct` 接口的正确实现将如下截图所示：\n\
  \n![](img/Figure-4.3.jpg)\n\n**图 4.3:** 接口实现\n\n在创建了与接口要求的签名相同的属性和方法后，Visual Studio\
  \ 不再显示任何错误信息，未来接口的任何进一步更改都将直接影响包含其实现的所有类。在实现类中，创建了一个名为 `InternetPlan` 的属性。在该语文中，它只适用于\
  \ `MobilePhone` 类；因此，尽管有接口定义的强制性实现，仍然可以扩展这些类。此外，在底层方法中实现了特定的折扣逻辑，该逻辑可以针对每个单独的产品类而不同。\n\
  \n如果大多数产品共享相似的折扣，如之前所述，在接口中针对成员和方法指定默认逻辑语句是可行的，如下截图所示：\n\n![](img/Figure-4.4.jpg)\n\
  \n**图 4.4:** 接口实现\n\n在这种情况下，所有产品的默认折扣值将为 `0.3`，如果接口中的方法具有默认实现，则类并不强制要求对其进行实现，编译器不会显示任何关于缺少方法实现的错误。该功能仅从\
  \ C# 8.0 版本开始可用。\n\n在灵活性方面，接口的使用允许我们在实现相同接口的不同类之间进行切换，并能够构建通用的逻辑例程，可以方便地扩展和修改，而不会对软件产生重大影响。接口可以作为方法的参数和变量的创建，如下截图所示：\n\
  \n![](img/Figure-4.5.jpg)\n\n**图 4.5:** 带有接口的泛型对象\n\n了一个 `IProduct` 类型的泛型列表，并填充了两个不同类的项：`WashingMachine`\
  \ 和 `MobilePhone`。它们都代表了 `IProduct` 类的不同实现，但对于编译器来说，它们是同一种类型，因为它们共享相同的接口。这使我们能够通过引用其他种类的类来轻松扩展该功能，并进行联合操作，因为它们是相同类型，例如遍历列表显示结果或在数据库中保存对象集合。\n\
  \n## 多重接口\n\n自 .NET 平台第一个版本以来，C# 语言不支持多重继承，但可以使用多个接口来实现类似的结果。在我们的示例场景中，在线商店可能拥有仅作为在线产品销售的产品，例如在线书籍和其他信息产品。对于这些类型的产品，系统可能具有仅对该类产品有效的特定特征，而适用于非在线产品的其他属性不适用于在线产品，例如关于产品尺寸的属性。考虑到这个问题，建议将接口拆分为专门的接口，这些接口将包含与特定产品类别相关的属性和方法，如下截图所示：\n\
  \n![](img/Figure-4.6.jpg)\n\n**图 4.6:** 多重接口\n\n系统不是为产品拥有单一的泛型接口，而是可能有多个包含适用于特定场景的特定属性的接口。例如，下载大小的信息仅存在于在线产品，而尺寸仅存在于物理产品。所有通用产品的标准规格都可以属于\
  \ `IProduct` 接口，该接口的属性比之前的示例少。使用多重接口的概念，`WashingMachine` 类将引用两个接口，如下截图所示：\n\n![](img/Figure-4.7.jpg)\n\
  \n**图 4.7:** 多重接口\n\n属性 `Id`、`Name`、`Price` 和 `Type` 由接口 `IProduct` 强制实现，而 `HeightDimension`\
  \ 和 `WidthDimension` 属性是 `IPhysicalProduct` 的规格。如果系统拥有在线书籍或电子产品等在线产品，应在底层类中引用 `IOnlineProduct`\
  \ 接口，如下截图所示：\n\n![](img/Figure-4.8.jpg)\n\n**图 4.8:** 多重接口\n\n在这种情况下，类不包含任何特定的尺寸引用，但它正在实现关于下载大小的属性。类中使用的接口数量没有限制，这使得所有与产品相关的类使用相同的模式，从而为整个软件项目提供了活性和一致性。\n\
  \n\n\n\n软件项目在市场上面临的一个重大问题是难以高效地进行功能测试，而其根本原因是软件中方法与组件之间的高耦合，这使得软件更难以测试。正如本书之前所解释的那样，在面向对象编程中有许多方法可以减少类之间的依赖关系，例如\
  \ SOLID 原则。遵循软件开发的最佳实践允许我们开发出架构具有高灵活性可维护性的系统，从而提高软件质量。\n\n通过接口，可以更快地覆盖更多测试用例，并轻松地模拟（mock）类来模拟我们尝试测试的原始类。例如，一个真实的场景可能是某个类中有一个方法负责执行数据库操作。对于实现\
  \ `IProduct` 接口的类，软件可能拥有数百个实现该接口的类；如果系统方法接收的是 `IProduct` 接口而非其具体实现（如下截图所示），那么在测试中就可以覆盖适当数量的代码。\n\
  \n![](img/Figure-4.9.jpg)\n\n**图 4.9:** 产品的数据库操作\n\n考虑到系统可能有多种产品类型，在给定的场景中，它们都共享相同的数据库操作。这意味着\
  \ `ProductData` 类的创建、更新和删除方法可以通过传递任何实现 `IProduct` 接口的类来调用。这种方法有助于减少编写单元测试的工作量。此外，它有助于方法被调用所有地方软件的可维护性，如下截图所示：\n\
  \n![](img/Figure-4.10.jpg)\n\n**图 4.10:** 使用接口的可测试类\n\n尽管示例中包含三个不同类的对象实例，但它们都可以作为参数传递给\
  \ `ProductData` 类的 `Create` 方法，因为该方法期望接收 `IProduct` 接口的一个实现。\n\n## 依赖注入\n\n通常情况下，.NET\
  \ 最显著且可见的特征之一是广泛使用依赖注入（dependency injection），特别是在 ASP.Net Core 应用中。随着时间的推移，许多编程概念、面向对象范式、设计模式和软件架构在市场上变得非常普及，并已成为常识，因为许多公司和开发者已经证实了某些软件开发实践的益处，而依赖注入无疑是其中之一。要正确理解其概念，请查看以下截图：\n\
  \n![](img/Figure-4.11.jpg)\n\n**图 4.11:** 依赖倒置示例\n\n在这个示例中，有两个显式依赖：\n\n*   `Document`\
  \ 类依赖于 `PDFConverter` 和 `ExcelConverter` 来完全实现其目标。\n*   如果 `Document` 类有更多不一定调用外部类任何方法的方法，那么\
  \ `Document` 类可以在没有另外两个关联类的情况下工作，但强依赖仍然存在。\n\n换句话说，文档类直接依赖于 `PDFCoverter` 和 `ExcelConverter`\
  \ 类，显然，它们代表了 `Document` 类的依赖。考虑到这一点，通常文档的转换涉及第三方库，取决于我们实现 `Document` 类的方式，其可维护性和可测试性将受到明显的损害。示例中的关联类与文档类高度耦合，因为这种实现违反了开闭原则（open-close\
  \ principle），该原则规定面向对象编程中的类对扩展是开放的，对修改行为是关闭的。\n\n有很多良好的技术方法可以减少类之间的依赖关系，在示例中，可以通过在\
  \ `Document` 类的构造函数中传递接口，而不是在类开始处作为私有成员创建其实例来实现更好的设计，如下截图所示：\n\n![](img/Figure-4.12.jpg)\n\
  \n**图 4.12:** 使用依赖注入的 Document 类\n\n通过这种方法，你可以在 `Document` 类中注入 `PDFConverter` 和\
  \ `ExcelConverter` 类的实现，并减少所有这些类之间的耦合。此外，一旦需要在 `Document` 类中应用测试，由于不需要依赖第三方库，就可以模拟转换类，这持续地改进了\
  \ `Document` 类的可测试性和重用性。另一个重要的额外因素是，如果发生了软件需求变更，包括支持转换为其他格式，那么只要新的转换器类实现了相同的 `IDocumentConverter`\
  \ 接口，对 `Document` 类的修改将是极小的。\n\n## 结论\n\n正如你在本章看到的，C# 语言的面向对象编程范式提供了有趣且实用的功能（如接口），用于构建健壮的企业级应用，应用软件开发在重用性和软件架构方面的最佳实践，允许我们减少项目中组件之间的依赖关系。正确使用接口是使用\
  \ .NET 平台构建强大企业级应用要点之一。它是创建实用且高质量应用的强制性知识，并极大地促进软件组件的可用性和完整性，降低项目成本并最大限度地减少软件维护的风险。\n\
  \n通过本章，你学习了如何创建接口、如何在不同场景中应用其概念，以及如何利用 C# 语言构建可测试、可重用和可扩展的应用。此外，你还有机会学习了依赖注入，它允许你减少组件之间的依赖。\n\
  \n## 记忆要点\n\n*   C# 语言不支持多继承，但可以使用多个接口来代替。\n*   接口为软件架构提供了一致性，并增加了类的可测试性。\n*   依赖注入广泛用于\
  \ .NET 项目中，其概念帮助我们减少类与组件之间的依赖。\n\n## 单选题\n\n1.  **哪个版本的 C# 引入了在接口中具有默认实现的可能性？**\n\
  \    *   8.0\n    *   7.2\n    *   1.0\n    *   C# 不支持此功能\n\n2.  **一个类可以实现多少接口？**\n\
  \    *   两个\n    *   无限制\n    *   无\n    *   一个\n\n3.  **哪个术更好地代表接口的用途？**\n    *\
  \   多态\n    *   继承\n    *   合约 (Contracts)\n    *   访问性\n\n## 答案\n\n1.  a\n2.  b\n\
  3.  c\n\n## 思考\n\n1. 解释 C# 语言中继承和接口之间的区别。\n2. 解释依赖注入的概念。\n3. 为什么接口在可测试性方面有助于软件开发？\n\
  \n\n\n\n4. 根据你在本章中所学的内容，列出使用接口的优势。\n\n# C# 中的封装与多态\n\nC# 语言提供了许多特性，有助于实现某些程序，以保护面向对象编程中的类免受成员意外更改的影响，甚至避免在使用这一至重要范式时违反良好实践。通过在\
  \ .NET 应用中使用封装和多态概念，这些特目标是构建一个可靠且健壮的软件架构。\n\n通过本章，你将有机会使用 C# 语言深入学习封装和多态的概念，并理解它们在实际项目中的应用益处。\n\
  \n学习面向对象编程范式的高级概念（如封装和多态）是非常重要的，因为这让你能够安全地扩展和增强现有软件的功能，并能够从零开始构建应用程序，同时应用那些能够保持组件正确隔离的机制。面向对象编程的基础知识对于正确理解设计模式和其他与设计相关的其他主题至关重要。\n\
  \n## 结构\n\n在本章中，我们将讨论以下主题：\n\n* 封装概念\n* C# 和 .NET 5 应用程序示例\n* 多态概念\n* 多态的示例与良好实践\n\
  \n## 目标\n\n学习本单元后，你应该能够：\n\n* 理解封装和多态概念\n* 使用 C# 语言应用封装和多态\n* 识别现有项目中封装和多态的使用\n\n\
  ## 封装的定义\n\n在 C# 语言中实现的每个类都应该尽可能不依赖于其他类，一个类必须有一个清晰且独特的目的，以促进其重用性和可维护性，并在当有新需求需要实现时，增加正确扩展软件功能的可能性。高可变性是任何软件项目的内在一个方面，因此，使用\
  \ C# 语言中的机制是不可避免的，这些机制有助于在更改软件的同时，保持类的一致性不受软件中其他类或组件外部影响的影响。\n\n在这种范围内，封装可以方便地保护类的成员和方法，避免其他类意外更改其行为，并修改应仅在类本身上下文中使用的成员值。这一目标可以通过正确使用\
  \ C# 语言中提供的访问级别修饰符来实现，这允许修改涉及敏感或关键操作的属性和方法的可见性，以保持类作为单一单元的完整性。\n\n正如书中提到的，C# 语言提供了以下访问级别修饰符：\n\
  \n* Public（公共）\n* Private（私有）\n* Protected（保护）\n* Internal（内部）\n\n每一个修饰符都决定了方法和属性对其他类的可见性。基于面向对象编程的软件开发中，决定使用哪种修饰符是关键部分，因为如果不在正确的级别应用适当的限制，类、方法甚至组件的预期行为可能会受到。\n\
  \n在 C# 语言中实现封装有两种主要方法：一种是使用操作类中变量的方法，另一种是使用属性并保留其主要目的。\n\n在本节中演示的第一种是使用方法实现封装的可能性，尽管它有局限性。作为一个示例，假设我们有一个名为\
  \ `Product` 的类，每个产品在产品价格和折扣方面有特定的业务需求，例如将所有产品的折扣限制在 10%，或者与产品价格相关的验证（即价格不能小于某个数字）。可以像下面的截图所示构建类：\n\
  \n![](img/Figure-5.1.jpg)\n\n**图 5.1：** Product 类\n\n该类有一个名为 `CheckPrice` 的私有方法，用于验证传递给构造函数的价格。在本例中，价格不应小于\
  \ 100。此外，还有另一个名为 `CheckDiscount` 的私有方法，用于验证传递给构造函数的折扣值。该值必须大于 0 小于 10。在这两个方法中，如果值不符合业务需求，系统将抛出异常。\n\
  \n这种方法部分保护了 `Product` 类免受违反需求的影响，因为私有方法负责处理并填充属性 `discount` 和 `price`。然而，这种实现存在明显的局限性，并且没有完全遵循封装的最佳实践。原因是属性\
  \ `price` 和 `discount` 指定的访问级别，如下面的截图所示：\n\n![](img/Figure-5.2.jpg)\n\n**图 5.2：**\
  \ Product 类的访问级别\n\n它们都被标记为 public，这意味着传递给类构造函数的值不是更新这两个属性的唯一方法，因为它们可以被外部类访问，违反了其预期行为。在创建实例时，可以传递一个特定值，之后可以传递一个完全不同的值，在这种情况下负责验证的方法将不会被使用，如下面的截图所示：\n\
  \n![](img/Figure-5.3.jpg)\n\n**图 5.3：** 类访问级别违反\n\n在示例中，针对 `Discount` 和 `Price`\
  \ 传递了值 5 和 200，在创建方法后，传递了值 15 作为 `Discount`，传递 50 作为 `Price` 属性，这与检查方法确定的不同。考虑到这种可能性，不建议使用方法对属性进行封装，但有必要通过它们的访问级别保护属性。因此，尽管该类部分实现了其目的；但在遵循面向对象编程最佳实践和封装原则时，存在一个必须避免的大问题。被验证方法更改的属性需要将其访问级别指定为私，并且必须创建只从私有属性获取值的新属性，如下截图所示：\n\
  \n![](img/Figure-5.4.jpg)\n\n**图 5.4：** 具有私有属性的 Product 类\n\n通过这种实现，将不再能够为 `Price`\
  \ 和 `Discount` 属性赋值，从而保护类免受外部违反。创建 `GetDiscount` 和 `GetPrice` 方法是为了实现读取折扣值和价格值的目标。这样，一旦无法违反类定义的业务需求，封装的目的就完全实现了。\n\
  \n\n\n\n在性能方面，还有另一种高效的方法可以实现与上一个示例相同的目标，即仅使用类的属性（properties）而不是方法来获取价格和折扣值。属性在面向对象编程中是重要的资源，它们的正确使用在清洁代码和软件开发良好实践方面具有巨大优势，即使它们是类中最基础的部分。在\
  \ C# 语言中，属性的工作方式与方法相同。所有属性都依赖于两个代码块：`get` 和 `set`。`get` 块语句是在读取属性时实现例程的地方，而 `set`\
  \ 块语句在属性值被修改时使用，如下截图所示：\n\n![](img/Figure-5.5.jpg)\n\n**图 5.5：** 产品名称属性\n\n`Name`\
  \ 属性的 `get` 语句被修改为在每次访问或读取属性时都使用 `Upper()` 方法。这允许我们指定一个通用的实现，该实现将被类的所有实例使用，并方便地集中处理属性所需的必要操作。因此，在创建对象实例时不需要显式地重复此操作，节省了开发过程的相关时间。由于可以在\
  \ `get` 和 `set` 语句中执行操作，因此它们可以用于完全且安全地实现折扣和价格属性的验证方法。这样，我们就能保证属性始终被验证，并且类的内在属性将作为公共字段可见并被明确指定。此外，`GetDiscount()`\
  \ 和 `GetPrice()` 方法可以被删除，如下截图所示：\n\n![](img/Figure-5.6.jpg)\n\n**图 5.6：** get 和\
  \ set 语句的使用\n\n在前一个示例中，`set` 语句用于对折扣和价格属性应用验证，即使考虑到访问级别被指定为 `public`，也存在从外部操作直接分配这些值的可能性。\n\
  \n## 多态性的定义\n\nC# 语言完全支持多态性概念，它包括实现具有相同名称但不同参数或不同行为的不同方法。正如其名称所示，出于许多原因，类中定义的同一个例程可以有多种形式：重用性、专门化、一致性和完整性。\n\
  \n作为一个示例，继续上上一节给出的 `Product` 类，在真实场景中，在线商店可能有多种类型的产品，每种产品都必须具有独特且特殊的业务需求，这在技术上需要不同的方法，但保持相同的类。以下两张截图代表了基类\
  \ `Product` 以及另一个名为 `Television` 的类，后者继承自基类，但对 `Discount()` 方法有不同的实现，如下：\n\n![](img/Figure-5.7.jpg)\n\
  \n**图 5.7：** 基 Product 类\n\n在此示例中，`ApplyDiscount()` 方法中指定了 `virtual` 关键字，这意味着允许继承自\
  \ `Product` 类的类在需要时更改方法的默认实现。子类可以有关于折扣的另一个规则，但将保持相同的名称，在这种情况下必须使用 `override` 关键字来指示编译器该类没有使用基类中的方法，如下截图所示：\n\
  \n![](img/Figure-5.8.jpg)\n\n**图 5.8：** Television 类\n\n`ApplyDiscount()` 方法包含一个完全不同的实现。它通过\
  \ HTTP 请求从外部资源获取折扣，且方法中呈现条件与基类略有不同。如第 7 行所示，`television` 类继承自 `Product`，由于这个原因，基类中的所有属性已经在父类中存在，因此就不需要在类中再次指定它们。\n\
  \n因此，`Television` 类与父类具有相同的方法和属性，但行为不同，因为折扣是分别计算的，这应用了多态性概念，并可以在许多其他专门的类中扩展实现。这种多态被称为**运行时多态**，因为方法的不同行为是通过使用\
  \ `virtual` 和 `override` 关键字显式定义的。此外，还可以通过为同一类的方法使用不同的参数在**编译时**应用多态性。尽管与运行时多态相比，它具有局限性（因为这需要在单个类中完成），但它允许我们为单个类赋予一个有意义的目标。面向对象编程的良好原则之一是类应该有一个存在和改变的单一理由，遵循“单一责任原则”。考虑到这些重要概念，运行时多态允许我们在保持类的完整性和一致性的同时，创建许多在行为上有细微差异的方法。.NET\
  \ Core 和 C# 语言中存在的原生示例之一是转换方法。一个名为 `Convert` 的类包含许多名称相同但参数不同的方法。因此，这些方法的目的是相同的，但输入非常不同，如下截图所示：\n\
  \n![](img/Figure-5.9.jpg)\n\n**图 5.9：** 转换方法\n\n`Convert` 类属于 `System` 命名空间，提供了许多名称相同但签名不同的方法。在示例中，`ToInt32()`\
  \ 方法接收来自不同类型的不同参数。这意味着它们都具有相同的目的，即将输入转换为整数值。仅该方法就包含了 19 种选项，它是我们如何使用编译时多态性来维护类的完整性和意义的良好示例。\n\
  \n## 结论\n\n正如你在这一章中看到的，C# 语言中的面向对象编程范式得到了完全支持，证明了如封装和多态等有趣且实用的功能，可以在企业级应用程序中构建并一致地实现软件开发的最佳实践，为软件架构提供了重载方法以及保护类免受外部或意外行为的影响。\n\
  \n通过这一章，你学习了如何在 C# 语言中使用多态和封装，将其概念应用到不同场景中，以及如何从中构建一致、可重用且可扩展的类和方法。\n\n在下一章中，你将有机会使用\
  \ C# 语言和 .NET 5 平台学习 SOLID 原则，熟悉可重用和可维护软件的最佳实践。\n\n\n\n\n## 问题\n\n### 2. 哪些关键字可以用于允许运行时多态？\n\
  1. Virtual and override\n2. Public and private\n3. Runtime and compile\n\n### 3.\
  \ 哪个关键字可以用于在保持相同名称和签名的情况下，允许父类不同的方法实现？\n1. Public\n2. Virtual\n3. Overloading\n\
  4. Protected\n\n## 答案\n1. d\n2. a\n3. b\n\n## 问题\n1. 解释运行时多态和编译时多态之间的区别。\n2. 面向对象编程中封装的主要优势是什么？\n\
  3. 根据你在本章中学到的知识，解释 `C#` 语言继承中 `virtual` 关键字的作用。\n\n# 第 6 章：C# 中的 SOLID 原则\n\n从本章开始，我们将开启探索使用\
  \ `C#` 语言进行面向对象编程最佳实践的之旅。任何软件项目都可能面临类似的挑战，例如扩展性、维护性、回归问题，为了使软件开发过程更加容易，强烈建议遵循面向对象设计中最著名的五个原则：`单一责任原则`\
  \ (`SRP`)、`开闭原则` (`OCP`)、`里氏夫替换原则` (`LSP`)、`接口分离原则` (`ISP`) 和`依赖倒转原则` (`DIP`)。你将学习如何在使用\
  \ `C#` 语言的实际项目中应用所有这些常见实践，这是学习设计模式的必经知识。考虑到软件开发在编码方面可能具有的高复杂性，理解 SOLID 原则并能够识别现有项目和第三方库是至关且极其重要的。\n\
  \n## 结构\n在本章中，我们将讨论以下主题：\n* 单一责任原则\n* 开闭原则\n* 里氏夫替换原则\n* 接口分离原则\n* 依赖倒转原则\n\n# 目标\n\
  学习本单元后，你应该能够：\n* 理解 SOLID 原则\n* 在现有项目中识别这些原则\n* 使用 `C#` 在 `.NET 5` 基础项目中应用这些原则\n\
  \n### 6.1 单一责任原则 (SRP)\n\nSOLID 原则代表了使用 `OOP` 模式构建系统的软件开发人员应该遵循的良好实践。这些原则有助于编写良好的代码，提供可维护性和扩展性。考虑到软件开发是一个逻辑和智力过程，相同的软件需求可能由不同的开发者以不同的方式实现，可以使用不同的方法获得相同的结果。\n\
  \n良好的软件开发不仅关乎可见的软件功能，更关乎在软件架构和工程方面具有高标准。并不难找到由于技术问题以及维护和扩展方面的限制而失败的软件项目。在任何软件开发生命周期中，当在发布后进行更改时，成本会更高。现有功能的更改可能会在项目中引入新问题，与此同时，新功能正在不断发布，这对于任何软件开发团队来说，保持项目的高标准推进都是一个巨大的挑战。因此，尽可能保持代码整洁并遵循软件开发的良好实践对于维护一个能够随时间推移支持相关变化并准备不断吸收新需求的长期解决方案项目至关重要。\n\
  \n`SRP` 是 `SOLID` 缩写列表中的第一个，它经常被应用到使用 `OOP` 的软件开发中，因为强烈建议这种范式中的类应该有一个单一责任。因此，软件任何部分的实现都应该有一个清晰且独特的目标，这样就更容易对其进行更改并扩展其功能。\n\
  \n例如，想象这样一个场景：一个商业系统包含一个特定的例程，该程序包括将文档转换为 PDF；在财务交易后通过电子邮件发送给客户；最后在数据库中记录有关此操作的日志。在这个短案例中，有四个不同的需求和目标需要满足。首先，我们必须在\
  \ `C#` 语言中创建一个类，实现所有这些需求所需的代码，但它没有遵循 `SRP`。该实现就像如下截图所示类：\n\n![](img/Figure-6.1.jpg)\n\
  \n**图 6.1：** 单一责任示例\n\n上截图中的实现包含了三个不同的职责：\n1. 将文档转换为 PDF 格式。\n2. 向用户发送电子邮件。\n3.\
  \ 在日志文件中记录交易。\n\n根据方法名 `CompleteTransaction`，此例程的主要目的是完成交易，但代码中也包含了发送电子邮件和 PDF 转换的详细实现。这意味着它没有遵循单一责任原则，并且在该代码中引入\
  \ bug 的可能性很大，考虑到对多个责任中的某一个进行更改可能会很容易影响同一方法中其他相关的现有例程。此外，目前的这种方法使得在项目的不同部分重用同一个方法变得越来越困难，因为考虑发送电子邮件和将文档转换为\
  \ PDF 的例程是在方法内部的。\n\n另一种替代方案是重构这段代码，在方法之外隐藏所有次要内容的实现细节，并只保留与交易完成相关的代码，如下截图所示：\n\n\
  ![](img/Figure-6.2.jpg)\n\n**图 6.2：** 单一责任重构\n\n该相同实现的新版本在编码方面有了显著改进。与电子邮件和转换为 PDF\
  \ 相关的复杂性已移动到其他类中并可以在软件的其他部分重用。此外，`CompleteTransaction` 方法的代码行更少，更容易理解其目的。`SRP` 最重要的点是，一个类应该只有一个更改的原因。经过重构过程，代码被拆分为三个不同的类，它们可以独立地进行更改，而不会影响其他类。因此，主类不再违反该原则。\n\
  \n### 6.2 开闭原则 (OCP)\n\n\n\n\n\nOCP（开放闭原则）是 SOLID 中的第二个原则，该原则的核心思想是：对象应该对扩展开放，但对行为的修改关闭。任何软件都包含大量将业务需求转换为代码的内容，而这些需求可能会因为业务请求、新法规或仅仅是因为对软件目的有了更深层的理解而频繁变化。然而，许多需求变更不应该每次都代表或要求对代码进行修改。如果代码中的某个特定例程被修改了多次，可能意味着用于开发这部分代码的设计或模式不够清晰，并且没有遵循软件开发的最佳实践。此外，软件的每种更改都可能对生产环境产生影响，导致现有功能出现错误，这应该是极力避免的。遵循\
  \ OCP，当提出新需求且其需要更改代码中现有的类或方法时，应该扩展该类来考虑这一新请求，而不是对其进行修改。因此，添加新需求应该被视为新功能，并表现为扩展而非修改。\n\
  \n例如，想象以下场景。有一个系统允许用户在流媒体平台上创建账户并访问在线电影。起初，只有一个账户类型，对每个用户都具有相同的行为和需求。以下是该特性的简单实现：\n\
  \n![](img/Figure-6.3.jpg)\n\n**图 6.3:** 开放闭原则示例\n\n如之前的截图所示，该例程创建了一个包含四个用户的列表，对于每个项目，都会从\
  \ `PlatformAccount` 类中调用 `Generate` 方法。该类包含了用户与客户账户之间的映射，如下截图所示：\n\n![](img/Figure-6.4.jpg)\n\
  \n**图 6.4:** 平台账户类\n\n此示例中的 `Customer` 和 `User` 类具有相同的字段，如下两个截图所示：\n\n![](img/Figure-6.5.jpg)\n\
  \n**图 6.5:** 用户类\n\n`Customer` 类的表示如下一个截图所示：\n\n![](img/Figure-6.6.jpg)\n\n**图 6.6:**\
  \ 客户类\n\n在真实场景中，平台账户类在实现中会使用一个将客户插入数据库的方法，并可能包含额外代码，但目标只是演示 OCP，为了便于理解，隐藏了复杂性。考虑到由于业务需求修改，软件该部分的需求可能会随时更改，假设有一项需求：流媒体公司将开始为客户提供其他类型的账户，例如与标准账户逻辑不同的高级账户。在这种情况下，有两种主要选择：修改平台账户类的实现以检查客户是否拥有高级账户，如果是，则该方法将运行不同的代码，如下截图所示：\n\
  \n![](img/Figure-6.7.jpg)\n\n**图 6.7:** 高级账户实现\n\n如之前的截图所示，该实现违反了 OCP，因为平台账户类被修改了，而不是仅仅被扩展。它现在包含一个\
  \ `if` 语句，以防客户拥有高级账户，并且它调用了不同的方法。使用这种方法会带来一些局限性和风险：\n\n*   所有必须调用 `create` 方法的方法都必须正确设置\
  \ `isPremiumAccount` 属性。在编码时很容易出错，并忘记将属性值值设为 `true`。\n*   如果该类具有复杂的实现，在方法中添加代码可能会轻易影响其他类型账户的行为，例如应该保持原样的标准账户。\n\
  *   如果将来包含了新的账户类型（如青铜、白银和金牌账户），它将为平台账户类增加额外的条件，并增加代码的复杂性。\n\n遵循 OCP 建议的替代实现将扩展功能以提供高级账户选项，而不是修改用于创建标准账户的现有类。为了实现这一目标，可以使用接口来抽象\
  \ `User` 和 `PlatformAccount` 类。这样，标准账户和高级账户将由不同的类承担，第一个原始类的实现将不会被修改，如下截图所示：\n\n\
  ![](img/Figure-6.8.jpg)\n\n**图 6.8:** 高级账户实现\n\n创建了一个高级用户类，并共享与 `User` 类相同的接口，如下两个截图所示：\n\
  \n![](img/Figure-6.9.jpg)\n\n**图 6.9:** 标准用户类\n\n两个用户类（`User` 和 `PremiumUser`）都有一个名为\
  \ `PlatformAccount` 的属性，它引用一个接口，并为用户和高级用户对象创建不同类的实例，如下截图所示：\n\n![](img/Figure-6.10.jpg)\n\
  \n**图 6.10:** 标准用户类\n\n如果软件已经在生产环境中使用，并且需要在现有功能中添加新需求，则强烈建议使用 OCP。该原则有助于保持代码的可读性，并避免遗留项目中的问题。\n\
  \n### 6.3 里基替换原则 (LSP)\n\n该原则由 Barbara Liskov 定义并创建，这种良好实践的主要点和目标是避免在未以推荐方式使用继承时在系统中抛出异常。继承允许跨整个软件复用父类和公共类的实现，但当父类的某个特定方法或属性不适用于所有可能的子类时，表明模型没有反映业务需求，并且可能在生产环境中产生由于未处理的异常而导致的问题。\n\
  \n为了演示这一原则，我们将创建一个代表该原则试图解决的相同条件的场景。例如，想象一个允许在在线图书服务中创建用户账户的系统，有两种不同类型的账户：高级和标准。标准账户可以访问有限的书籍，而高级账户可以无限访问书籍，并可以与家庭成员共享访问权限。两者都有共同点，自然会创建一个基类作为每个类的父类，如下截图所示：\n\
  \n![](img/Figure-6.11.jpg)\n\n**图 6.11:** 用户基类\n\n如之前的截图所示，在 `BaseUser` 类中有与对象状态相关的属性，如全名、电子邮件和密码。但该类还包含了负责提供书籍访问和家庭成员访问的方法。考虑到标准用户和高级用户类派生自基类，两者的实现如下截图所示：\n\
  \n![](img/Figure-6.12.jpg)\n\n**图 6.12:** 用户标准类\n\n该类包含了并不一定适用于标准用户类但适用于高级用户类的方法，例如家庭成员访问和无限访问书籍。这种实现方法的问题在于，如果创建了\
  \ `StandardUser` 类的实例并错误地调用了本应属于高级用户类的方法，系统将抛出异常，功能将失去其完整性。此外，提议的模型没有反映对高级账户有特定规则的业务需求。\n\
  \n\n\n\n\n解决此问题有两种方法：一种是从基类中移除与高级账户相关的方法，另一种是使用接口。下面的截图展示了第一个解决方案：\n\n![](img/Figure-6.13.jpg)\n\
  \n**图 6.13:** 重构后的用户基类\n\n根据本示例中的要求，从类中删除了方法，因为它们并不是每个子类通用的通用方法。另一方面，这些方法相应地放置在了标准用户和高级用户类中，如下所示所示：\n\
  \n![](img/Figure-6.14.jpg)\n\n**图 6.14:** 重构后的用户子类\n\n面向对象编程（OOP）中继承良好实践的核心点是，父类应该只包含子类的通用和公共实现。LSP（里氏替换原则）规定，父类应该被子类替换，反之亦然。虽然\
  \ LSP 的概念与 OCP（开闭原则原则）略有不同，但它们的目的相似，即在根据新需求请求应用更改时避免在系统中引入问题。\n\n### 6.4 接口隔离原则\
  \ (ISP)\n\n该原则帮助开发者避免使用不能代表业务需求的接口。类似于 LSP（LSP 建议在父类中仅使用适用于所有子类的属性和方法），接口隔离原则应用了相同的概念，但针对的是接口。为了清楚地理解该原则，请参考以下包含产品接口的截图：\n\
  \n![](img/Figure-6.15.jpg)\n\n**图 6.15:** 产品接口\n\n在像在线商店这样常见的场景中，系统可以很容易包含各种类型的产品，它们可能有不同的属性。例如，下面的截图表示了两个不同类的实现：`Television`\
  \ 和 `OnlineBook`：\n\n![](img/Figure-6.16.jpg)\n\n**图 6.16:** 在线书籍和电视机类\n\n如上一个截图所示，考虑到这两个类实现了相同的\
  \ `IProduct` 接口，它们都具有相同的属性。这种实现的问题在于，并不是所有类型的产品都共享相同的属性或方法。例如，与产品尺寸（`Width` 和 `Height`）相关的字段对于\
  \ `Television` 有意义，但对于 `OnlineBook` 没有。为了获得更清晰的代码定义，接口隔离原则指出最好为每种产品类型创建一个独立的接口，如下所示：\n\
  \n![](img/Figure-6.17.jpg)\n\n**图 6.17:** 接口隔离\n\n每个特定类必须使用其底层接口，该接口包含了类中应该使用的正确字段。相同的概念也适用于方法，并且它是\
  \ OOP 范式中最重要的最佳实践之一。\n\n### 6.5 依赖倒转原则 (DIP)\n\nSOLID 原则的最后一个原则 DIP，目的是在类与类之间存在依赖的情况下，强制执行隐藏类与之间实现的良好实践。为了避免开发过程中的风险，每个类应该只包含与类本身相关的实现，并保持它们之间低级的松散耦合。\n\
  \n例如，一个名为 `Document` 的类可能有一个方法，负责将文档转换为 PDF 或其他格式。在实际场景中，文档转换的实现将放在不同的类中，并在文档类中引用它，如下所示：\n\
  \n![](img/Figure-6.18.jpg)\n\n**图 6.18:** Document 类\n\n在这个示例中，有两个明显的依赖关系：\n\n1.\
  \  文档类依赖于 `ExcelConverter` 和 `PdfConverter` 类。\n2.  对于某些操作，文档类可以在不与转换器类直接关联的情况下保留其原始功能。\n\
  \n因此，文档类依赖于另外两个类，而转换器类是 `Document` 类的依赖。考虑到这一点，通常文档转换过程会使用第三方库，如果存在更改第三方库的需求，文档转换类与软件其他部分之间的高依赖可能会产生问题。\n\
  \n减少类之间依赖关系并遵循 DIP 的替代方案是在依赖其他类的构造函数中将接口作为参数传递，如下所示：\n\n![](img/Figure-6.19.jpg)\n\
  \n**图 6.19:** 依赖倒转原则\n\n通过这种方式实现，你可以将转换器类的实现注入到 `Document` 类中，因为它们共享相同的接口。此外，它提高了类的可测试性，因为更容易创建模拟类（mock\
  \ classes）来模拟转换器类的行为。\n\n## 结论\n\n创建 SOLID 原的目的是帮助编写更好的代码，考虑到 C# 是一门 OOP 语言，它完美适用于它。所有原则的目的都是为了尽可能减少更改对现有软件的影响，并帮助我们编写整洁的代码。SRP\
  \ 不仅可以用于类和方法级别，甚至可以用于架构设计，以减少组件之间的依赖并获得更具重用的功能。与 OCP 和 LSP 相关的主要点是，扩展软件功能比更改现有实现更安全。它避免了破坏性更改并使代码更具可读性。同样的优势也适用于\
  \ ISP 和 DIP。\n\n在本章中，你学习了关于 SOLID 原则的关键信息，并熟悉了在不同场景下使用这些原则的主要优势。\n\n\n\n\n通过本章，你将有机会使用\
  \ C# 语言理解抽象工厂模式，并在一个逐步构建的示例中应用其概念。\n\n## 结构\n\n在本章中，我们将讨论以下主题：\n\n* 抽象工厂概念\n* C#\
  \ 和 .NET Core 中的示例\n\n# 目标\n\n学习完本单元后，你应该能够：\n\n* 理解抽象工厂模式\n* 在真实项目中应用抽象工厂\n* 识别封装、多态以及其他面向对象编程的应用\n\
  \n### 抽象工厂定义\n\n软件开发中的任何设计模式都代表了对现实场景中频繁发生的常见情况的通用解决方案，它是构建遵循市场范围内广泛使用的最认可方法的软件架构的稳健替代方案。所有软件项目在业务需求和背景上各相同，但许多项目在实现和代码挑战方面具有相似的技术目的。\n\
  \n例如，想象这样一个场景：一个系统的主要功能意图是为在线商店注册产品和服务。即使不同的公司销售的是不同类型的产品，但实现此类系统的底层基础设施在类、业务逻辑实现、数据模型、数据库结构以及技术要求（例如对事务控制的需要，以及对包含不同属性和特征的海量实体的支持）方面是非常相似的。因此，可以说任何在线商店都遵循一种模式，该模式要求构建和支持复杂记录、多个产品族的创建与管理，并根据产品类型根据业务需求和工作流提供系统的特定行为。\n\
  \n在这种背景下，在所有可用设计模式列表中，存在抽象工厂模式，它允许我们创建相关对象族，并将构建这些对象的复杂性从主要消耗和创建这些对象的软件部分中抽象出来。总而言之，如果系统需要创建根据规则以不同方式创建相关属性的复杂对象，抽象工厂模式封装了具体类工厂背后的实现和逻辑，使我们能够通过插入更多同族的不同类型对象来扩展架构，而不会损害实现的完整性。\n\
  \n正如本书之前所演示的那样，在基于面向对象编程范式的软件中，正确使用接口是拥有一个可测试、可扩展且可靠的软件项目最重要的特征之一，这代表了抽象工厂模式的关键点之一。\n\
  \n### 抽象工厂场景\n\n考虑到抽象工厂旨在减少对象族创建的复杂性，因此通过实现与抽象工厂试图解决的问题相似的需求的项目来应用其概念至关重要。因此，在本节中，你将有机会实现一家移动公司的基础结构，该公司向客户出售关于短信、移动数据和其他服务的不同套餐，这代表了一个可以通过抽象工厂模式解决的场景，具有以下业务需求：\n\
  \n* 公司将为客户提供两种套餐：预付费和后付费。\n* 两种套餐在短信、互联网连接速度和移动数据限制方面必须有不同的条件。\n* 预付费选项短信限制有限，每月最多\
  \ 1,000 条。\n* 预付费选项的最大速度为每秒 10 兆。\n* 预付费套餐每月数据传输限制为 10 GB。\n* 后付费选项提供无限数据传输和短信。\n\
  * 后付费套餐拥有高速互联网连接，例如每秒 500 兆。\n\n需求明确表明移动套餐在对象属性方面具有相同的结构，但对象的类型和状态略有不同，如下所示：\n\n\
  | 移动套餐 | 短信限制 | 移动数据传输 | 连接速度 |\n| :--- | :--- | :--- | :--- |\n| 预付费 | 每月 1,000\
  \ 条 | 每月 10 GB | 每秒 10 兆 |\n| 后付费 | 无限制 | 无限 | 每秒 500 兆 |\n\n**表 7.1:** 移动套餐\n\n\
  给定该场景，使用抽象工厂允许我们通过在应用程序最高层抽象其实现来构建这些复杂对象，在 във模式中，该层惯上被称为 `Client`，如图 [7.1] 所示：\n\
  \n![](img/Figure-7.1.jpg)\n\n**图 7.1:** 抽象工厂实现\n\n移动套餐与复合对象类型之间的关联在之前的图中通过蓝色（后付费套餐）和黄色（预付费套餐）突出显示。抽象工厂在市场上被称为*工厂的工厂*（factory\
  \ of factories）模式，因为主工厂创建的对象集也是其他工厂。\n\n### 抽象工厂实现\n\n考虑到需求已经建立，且模型结构已通过适当关联定义，编码过程的第一步是创建各个类和接口。在本章的整个示例中，使用\
  \ .NET Core 控制台应用程序作为客户端，不包含与数据库的交互，以关注 C# 的实现。遵循[图 7.1]所示的图表，我们必须为项目中的每个工厂创建第一个类，从\
  \ `Text Message Factory` 开始，包括底层接口，其范围限于如下图所示的表示：\n\n![](img/Figure-7.2.jpg)\n\n\
  **图 7.2:** 短信工厂表示\n\n`Text Message Factory` 的实现需要一个包含具体类型（无限和每月 1,000 条）相关属性的接口，如下截图所示的接口：\n\
  \n![](img/Figure-7.3.jpg)\n\n**图 7.3:** 短信工厂接口\n\n该接口在该示例中仅包含两个属性，其目的是当对象被给定场景中的其他类消费时识别它们之间的区别。从创建接口开始抽象工厂对于未来的测试能力和整个解决方案的可扩展性来说是一个良好的做法。下一步是创建一个实现\
  \ `Text Message Factory` 接口的具体类，如下截图所示：\n\n![](img/Figure-7.4.jpg)\n\n**图 7.4:**\
  \ 千条短信类\n\n由于由于给定场景考虑了两种类型的短信套餐（无限和千条短信），我们必须针对 `unlimited` 类型创建第二个类，实现相同的接口 `ITextMessageFactory`，如下截图所示：\n\
  \n![](img/Figure-7.5.jpg)\n\n**图 7.5:** 无限短信类\n\n考虑到这两种类型都实现了相同的接口，它们强制要求具有相同的成员和方法，但每个类型都可以根据规范实现不同的行为。这种方法允许我们一致地创建单元测试和模拟测试，注入数据，并使我们能够可能扩展到其他类型，而不会破坏现有的实现。\n\
  \n\n\n\n在此语境下，手机套餐必须包含短信、互联网连接和移动数据流量方案的信息，如本节开头的需求列表所示。考虑到短信的基础设施已经创建，下一步是创建 `Internet\
  \ Connection Factory`，它应该遵循 `图 7.6` 所示的结构：\n\n![](img/Figure-7.6.jpg)\n\n**图 7.6：**\
  \ 连接速度工厂表示\n\n`Connection Speed Factory` 的实现需要一个包含与具体类型（高速和低速）相关属性的接口，并如下截图所示使用接口：\n\
  \n![](img/Figure-7.7.jpg)\n\n**图 7.7：** 连接速度工厂接口\n\n该示例中的接口仅包含两个属性（`Name` 和 `Velocity`），其目的是在实现类使用它们时识别对象之间的差异。下一步是创建实现\
  \ `Connection Speed Factory` 接口的具体类，如下截图所示：\n\n![](img/Figure-7.8.jpg)\n\n**图 7.8：**\
  \ 低速工厂类\n\n由于给定场景考虑了两种连接速度（高速和低速），我们必须创建关于高速类型的第二个类，并如下所示实现相同的接口 `IConnectionSpeedFactory`：\n\
  \n![](img/Figure-7.9.jpg)\n\n**图 7.9：** 高速类\n\n考虑到两种类型共享完全相同的接口，因此在实现具有相似签名的成员和方法时是强制性的，但每个类都可能根据其规范实现不同的行为。手机套餐需要创建一个额外的、最后一个工厂类，负责处理移动数据传输信息的创建，该类必须有两种不同的类型，如下图所示：\n\
