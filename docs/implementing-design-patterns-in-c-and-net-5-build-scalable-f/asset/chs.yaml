  \n该示例中的接口有两个主要属性（`Name` 和 `Limit`），其目的是识别对象之间的差异。下一步是指定实现 `Mobile Data Factory`\
  \ 接口的具体类，如下截图所示：\n\n![](img/Figure-7.12.jpg)\n\n**图 7.12：** 无限移动数据类\n\n考虑到场景需要两种类型的无限移动数据（无限量和\
  \ 10 GB），我们必须创建一个关于预付选项 10 GB 限制的第二个类，并如下所示实现相同的接口 `IMobileDataFactory`：\n\n![](img/Figure-7.13.jpg)\n\
  \n**图 7.13：** 10 GB 移动数据类\n\n至此，所有关于主工厂属性的必要子类已经创建，使得预付和后付费选项的实现成为可能，这些选项将负责每个手机套餐的自定义创建，并遵守本节开头确定的所有要求。抽象工厂模式允许我们创建复杂对象以抽象并封装它们的实现细节，使代码更容易便于开发者阅读和理解。在真实场景中，手机套餐工厂必须负责根据利益相关者带来的快速业务需求变化以及市场新需求，创建除这两个套餐之外的任何额外类型。因此，如果需要添加新类型，负责创建的主类将隐藏新类型创建的复杂性，并且可以安全地扩展功能，而无需过度担心为软件架构增加问题。\n\
  \n与对子类工厂（短信、移动数据和连接速度）所的操作类似，抽象工厂模式实现过程的下一步是创建负责创建手机套餐预付和后付费选项复合对象的基础设施，如 `图 7.14`\
  \ 所示：\n\n![](img/Figure-7.14.jpg)\n\n**图 7.14：** 手机套餐工厂表示\n\n为了便于测试并增加重用性，始终建议使用接口和主抽象工厂，主工厂在定义属性时必须引用其他接口而不是具体类，如下截图所示：\n\
  \n![](img/Figure-7.15.jpg)\n\n**图 7.15：** 手机套餐工厂接口\n\n接口包含三个属性，分别对应于短信、连接速度和移动数据需求确定的每个特征。按照惯例，抽象工厂模式使用前缀\
  \ `Create` 与每个属性的生成相关。这有助于了解设计模式原理的其他开发者识别该模式。此外，建议在类名中使用 `Factory` 后缀来指示该设计模式。在软件开发中使用意义的名称是编码最重要的良好实践之一，因为它允许我们减少软件文档量，并缩短分析代码中实现的工作流的时间。\n\
  \n一旦创建了手机套餐工厂的接口，下一步就是根据要求严格遵循其各自的规范创建两个手机套餐。首先，我们必须创建 `PrepaidFactory` 类并实现底层接口，如下截图所示：\n\
  \n![](img/Figure-7.16.jpg)\n\n**图 7.16：** 预付工厂类\n\n`PrepaidFactory` 类根据特定要求创建相关属性的实例，例如在\
  \ `CreateConnectionSpeed` 方法中创建 `LowSpeed` 类实例，其他两个属性创建方法也是如此，这些方法同样引用接口。另一方面，`PostpaidFactory`\
  \ 类根据自身的规范自动填充不同类型的属性，如下截图所示：\n\n![](img/Figure-7.17.jpg)\n\n**图 7.17：** 后付费工厂类\n\
  \n这种方法有助于使代码解释变得简单，因为每个工厂类都显式地创建自己的不同对象实例，而且它们共享相似的接口。实现的最后一步是指定客户端类，它是模式层级结构中的最高层，它不需要了解深层次的细节，因为子工厂类通过遵守预付和后付费手机套餐的要求处理了每个对象的创建复杂性。在给定场景中，客户端类必须实现逻辑语句，根据手机套餐类型创建工厂类的正确实例。为了弄明代码的目的，可以在此语境下创建一个\
  \ `enum`，引用两种手机套餐类型，如下所示：\n\n![](img/Figure-7.18.jpg)\n\n**图 7.18：** 手机套餐枚举\n\n\n\
  \n\n\n![](img/Figure-7.19.jpg)\n\n**图 7.19:** 移动套餐枚举\n\n在这个示例中，该类的构造函数接收一个移动套餐类型，引用于之前创建的\
  \ `enum`，并且在该方法上有一个 `if` 语句来检查该类型。因此，根据其值将创建一个不同的移动套餐工厂实例，即 `Prepaid`（预付费）或 `Postpaid`（后付费）工厂。此外，指定了一个名为\
  \ `Describe` 的方法来显示此示例中对象之间的差异，仅用于演示。\n\n在 .NET Core 控制台应用程序中，我们可以创建一个或多个 `MobilePlan`\
  \ 类的实例，并显示 `Describe` 方法的结果，如下截图所示：\n\n![](img/Figure-7.20.jpg)\n\n**图 7.20:** 控制台程序\n\
  \n控制台程序创建了两个 `MobilePlanClient` 实例，每个实例的类型不同（`Prepaid` 和 `Postpaid`），并在屏幕上显示移动套餐的描述。运行应用程序后，你将获得每种类型移动套餐的规格，如下截图所示：\n\
  \n![](img/Figure-7.21.jpg)\n\n**图 7.21:** 控制台程序结果\n\n客户端类对抽象工厂类的使用非常简单，因为它从应用程序的最高层隐藏了每种移动套餐类型的实现，将所有责任都委托给专门的类。它允许开发者专注于对何更好地代表业务需求进行解释，并在此刻封装掉不必要的细节。\n\
  \n## 结论\n\n正如你在本章中所学到的，抽象工厂模式有助于管理对象族的创建，保持一种优雅且精密的软件架构，使我们能够在不损害代码可读性的前提下，对相关功能进行扩展、测试和维护。鉴于该模式广泛使用了接口，在类似于本章演示的场景中，通过遵循最高推荐的方法，可以拥有一致的结构，并从面向对象的编程实践中获益所有处。\n\
  \n通过本章，你学习了如何使用 C# 语言在真实场景中实现抽象工厂模式，并能够理解通用设计模式的核心要点，即在实现和软件架构方面，利用通用解决方案来解决软件开发中常见问题的可能性。\n\
  \n在下一章中，你将有机会继续使用 C# 语言和 .NET Core 平台开启你的设计模式之旅，学习单例模式，并应用你在书的前几章中获得的所有通用知识。\n\n\
  ## 记忆要点\n\n* 抽象工厂传统上被认为是“工厂的工厂”。\n* 该模式的主要目的是在不暴露其实现的情况下构建复杂对象。\n* C# 语言完全支持抽象工厂模式，只要它是基于接口的，并且也可以使用抽象类，这些都是面向对象编程范式中的常见类型。\n\
  \n## 多选题\n\n1. **在类抽象工厂模式的类名中，推荐使用的后缀是什么？**\n    1. Interface\n    2. Factory\n\
  \    3. Abstract\n    4. Create\n\n2. **哪种定义能更好地代表抽象工厂模式？**\n    1. 它是一种允许我们为整个应用程序创建一个对象的单一实例的设计模式。\n\
  \    2. 该模式代表了创建同种类型多个对象的方法。\n    3. 此模式允许通过在其他子工厂中封装每个对象族的实现，来创建多个对象族。\n\n3. **哪个选项包含了抽象工厂模式的某些优点？**\n\
  \    1. 可测试性、扩展性和易于维护\n    2. 数据库操作的抽象\n    3. 性能和可扩展性\n\n## 答案\n\n1. b\n2. c\n\
  3. a\n\n## 问题\n\n1. 解释抽象工厂模式的主要目的。\n2. 为什么接口在抽象工厂模式中的使用很重要？\n3. 根据你在本章中所学的，除了本章给出的示例外，创建一个可以应用抽象工厂的假设场景。\n\
  \n# 第 8 章\n\n# 单例 (Singleton)\n\n软件开发中的许多场景需要在整个系统中保留某个对象的单一实例，以实现不同的目的，例如共享数据库连接、内存缓存对象，甚至是一个负责在应用程序所有部分保持相同业务要求的类实例。单例模式允许我们实现这一目标，它是使用\
  \ C# 语言基于 .NET 平台构建的应用程序中最常用且为人知的模式之一。\n\n学习单例模式让你有机会理解在哪些场景下使用这种模式是有帮助的，并帮助你在遗留项目和第三方库中识别该模式。\n\
  \n通过本章，你将通过一个逐步的示例学习如何在基于 .NET Core 和 C# 语言的项目应用单例模式的概念。\n\n## 结构\n\n在本章中，我们将讨论以下主题：\n\
  \n* 单例模式概念\n* C# 和 .NET Core 示例\n\n# 目标\n\n学习本单元后，你应该能够：\n\n* 理解单例模式\n* 在真实项目中应用单例模式\n\
  * 识别遗留项目和第三方库中该模式的使用\n\n### 8.1 单例模式定义\n\n单例模式正如其名所示，其主要目标是保证系统中只有一个特定类的实例可用，并在全局共享相同的状态。通过该模式，底层类的结构限制了使用相同类创建其他实例的方法，通常使用\
  \ `static` 饰符。 .NET Core 引入了许多关于单例模式与依赖注入概念结合的改进，变得更容易管理和创建特定实例的单点访问点，而无需显式地在类级别指定单例实现。\n\
  \n与其他模式类似，单例模式根据其应用场景而具有优点和缺点。优点之一是确保系统在整个系统范围内安全地保持该类的同一个实例。遵循面向对象编程的最佳实践，这种方法将所有类构造函数的可见性限制为私有，从而避免了违反并不当创建具有不同状态的多个实例的可能性。\n\
  \n关于单例模式在某些场景下使用的负面点，可以说通常，由于单例类被标记为 `static` 饰符，它使得单元测试变得更加复杂，要正确获取我们所需的所需的行为是一个挑战。而且，考虑到该模式具有保持其状态全局访问点的明确目的，并发和并行线程访问该类需要使用\
  \ `lock` 概念来保证所有调用将获得相同的结果，这种情况在对响应的额外纳秒至关重要的关键场景中可能会导致性能问题。\n\n\n\n\n\n一旦你学习了单例模式的理论概念，下一节将教你如何在不同的场景中实际应用它，并让你有机会看到这在\
  \ .NET Core 和 C# 语言的不同项目类型中是如何被原生运用的。\n\n### 8.2 单例的实现\n\n考虑到每种设计模式的目的都是使用面向对象编程（OOP）的标准方法来解决软件开发中的特定问题，因此构建一个在应用单例模式解决方案后会出现问题的场景是至关重要的。\n\
  \n想象这样一个假设场景：系统需要全局保留一个负责使用外部资源的类的同一实例，例如，一个用于将文档转换为 PDF 格式的第三方 Web 服务。该场景中的要求之一是限制对外部资源的身份验证次数仅为一次，以避免在身份验证过程中产生额外成本和性能问题。因此，`PDFConverter`\
  \ 系统中的会话应该尽可能保持开启，并在系统中所有调用 `PDFConverter` 服务的例程之间共享。如果使用标准类，该类的实现将类似于如下截图所示：\n\n\
  ![](img/Figure-8.1.jpg)\n\n**图 8.1：** PDF 转换器类\n\n一旦 PDF 服务类如 `ConvertToPdf` 方法体所示，在转换方法中需要一个\
  \ `Session` 对象，那么每次创建 `PDFConverter` 类的新实例时，都会创建一个新的 `Session` 对象。考虑到给定场景中的要求规定多次调用外部服务应尽可能使用单个\
  \ `Session`，当前的实现并没有完美满足这一要求，因为可以创建该类的多个实例。为了方便查看结果，在类中实现了一个名为 `GetSessionInfo`\
  \ 的新方法，如下截图所示：\n\n![](img/Figure-8.2.jpg)\n\n**图 8.2：** 获取会话信息方法\n\n该方法提供的信息允许我们跟踪代码在运行时执行的工作流，从而理解整个系统为每个请求都使用了会话对象的不同实例。\n\
  \n### 8.2.1 多个实例\n\n在这种场景下，如果系统尝试创建 `PDFConverter` 类的多个实例并调用 `GetSessionInfo` 方法，将显示完全不同的会话信息，因为该类的每个实例都创建了\
  \ `Session` 类的新实例，如下截图所示：\n\n![](img/Figure-8.3.jpg)\n\n**图 8.3：** 多个 PDF 转换器实例\n\
  \n在第九行和第十行之间，第一份文档使用 `PDF Converter` 类的特定实例转换为 PDF；而在第十五行和第十七行之间，第二份文档使用转换器的新实例进行转换。由于程序调用了两次\
  \ `GetSessionInfo` 方法（第十三行和第十九行），当控制台应用程序运行时，系统会在屏幕上显示两个份文档转换的会话信息，如下截图所示：\n\n![](img/Figure-8.4.jpg)\n\
  \n**图 8.4：** 会话信息\n\n所示，生成了两个不同的会话，这意味着实现并没有满足预期的要求。尽管这只是在控制台应用程序的 `Program.cs`\
  \ 文件同一方法中创建多个实例的示例，但该要求背后的想法是创建一个基础设施并实现对 `PDFConverter` 的全局访问，以避免在开发过程中出现错误的可能性。因此，软件架构应该有一种结构来显式地限制\
  \ `PDFConverter` 类多个实例的创建。这代表了软件开发中一个真实且常见的问题，因为如果不使用一种拒绝创建类多个实例的机制，是无法想象完全限制对该要求的违背的。\n\
  \n### 8.2.2 单例模式的修改\n\n单例模式是针对给定场景的简单且合适的解决方案，它的实现需要对 `PDFConverter` 类进行重大更改，以防止多个实例的创建，并确保系统在并发访问负责文档转换为\
  \ PDF 的外部资源时不会遇到任何问题。首先，单例模式中的所有类构造函数都应该使用 `private` 修饰符，并且类应该使用 `sealed` 修饰符，如下截图所示：\n\
  \n![](img/Figure-8.5.jpg)\n\n**图 8.5：** PDF 转换器类的首次修改\n\n`sealed` 修饰符防止其他类继承 `PDFConverter`\
  \ 类，这是避免通过继承创建该类多个实例的必要条件。然而，在这些小更改之后，`Program.cs` 文件中的例程显示了预期的错误，因为将构造函数的可见性更改为\
  \ `private` 后，不允许创建 `PDFConverter` 类的实例，如下截图所示：\n\n![](img/Figure-8.6.jpg)\n\n**图\
  \ 8.6：** 编译错误\n\n实际目标是避免创建多个实例，但在修改之后，无法再创建 `PDFConverter` 类的实例，这意味着单例的实现尚未完成。按照惯，单例模式要求使用\
  \ `GetInstance` 静态属性，它仅在实例状态为 `null` 时处理类的新实例创建，如下截图所示：\n\n![](img/Figure-8.7.jpg)\n\
  \n**图 8.7：** Get Instance 方法\n\n在这种情况下，类构造函数方法仍然是私有的，且类现在有一个静态方法，始终返回类的同一个实例，除非实例为\
  \ `null` 的情况。该实现保证了即使在程序的几个不同地方引用该类，整个系统也将使用相同的实例。\n\n在这些更改之后，在基础设施和实现方面满足了主要要求，仅在此示例背景的\
  \ `Program.cs` 文件中需要额外的微调。考虑到 `PDFConverter` 类使用了静态属性，程序在内存中只保留类的类的引用，防止了创建新实例的可能性。尽管结果完全不同，从视觉上看，代码仍然非常相似，如下截图所示：\n\
  \n![](img/Figure-8.8.jpg)\n\n**图 8.8：** Get Instance 方法\n\n现在不是调用类构造函数，而是为负责转换两个文档的对象调用静态属性。因此，例程在实现方面的影响微乎其微。当控制台应用程序运行时，两个转换过程共享同一个会话，如下截图所示：\n\
  \n![](img/Figure-8.9.jpg)\n\n**图 8.9：** 会话结果\n\n\n\n\n\n当前的单例实现在对 `PDFConverter`\
  \ 类进行大量并发访问的场景存在局限性，因为可能会发生许多并发访问类的尝试。为了避免异常的发生，使用 C# 语言中的 `lock` 特性更加安全，这可以防止在\
  \ `PDFConverter` 类实例为空时，对负责创建该类新实例的代码块进行多次调用。使用 `lock` 语句后，所有其他线程都需要等待才能访问资源。以下代码表示了线程安全的实现更改：\n\
  \n![](img/Figure-8.10.jpg)\n\n**图 8.10:** `lock` 语句\n\n在高需求场景下，强烈建议使用 `lock`，但如果受保护的例程运行时间较长，则需要谨慎使用此功能。\n\
  \n### 8.2.3 线程安全的实现\n\n指定了一个名为 `lockThreadSafe` 的私有属性，并且 `GetInstance` 静态属性在 `PDFConverter`\
  \ 类实例为空时，创建新实例之前会对该属性进行锁定。通常，单例模式中的这种实现被称为线程安全单例，当对特定例程的密集并发访问可能出现问题并导致异常时，它是一个很好的替代方案。\n\
  \n关于单例模式可以采取的另一种方法是使用 `Lazy` 类型，这是 C# 语言中可用的一种结构，用于在不添加额外 `lock` 语句代码的情况下隐式地使用线程安全的实现概念。如果我们之前的之前的代码重构为使用\
  \ `Lazy` 类型，其实现看起来如下幅截图所示的代码：\n\n![](img/Figure-8.11.jpg)\n\n**图 8.11:** `lock`\
  \ 语句\n\n使用 `Lazy` 类型减少了实现单例模式所需的代码量，并产生完全相同的结果，是获得更可读代码的良好替代方案。\n\n.NET Core 平台提供了额外的选项来处理\
  \ Asp.Net Core 应用程序中的单例模式，封装了之前在本节中执行的显式创建单例类的过程。要检查它的工作原理，下一个场景是在 Asp.Net Core\
  \ MVC 项目中移动或引用 `PDFConverter` 类，并向应用程序配置中添加关于单例模式的规范。考虑到服务配置将处理整个系统中 `PDFConverter`\
  \ 类单例实例的创建，之前的类实现已不再需要，在该场景中可以使用标准的非静态类，如下截图所示：\n\n![](img/Figure-8.12.jpg)\n\n\
  **图 8.12:** PDF 转换类中的重构\n\n考虑到 Asp.Net Core 使用依赖注入的良好实践来处理 Asp.Net MVC 和 Asp.Net\
  \ Web API 项目中 Controller 内部的服务，创建了一个新接口 `IPDFConverter` 并将其与 `PDFConverter` 类关联，以便将单例类注入到控制器以及软件中需要相同资源的其他部分。\n\
  \nAsp.Net Core 应用程序中的服务配置通常在 `Startup` 类的 `ConfigureServices` 方法中完成，在该其中可以注册类并赋予它们单例状态，并引用接口和具体类，如下截图所示：\n\
  \n![](img/Figure-8.13.jpg)\n\n**图 8.13:** 添加单例服务\n\n一旦在 `Startup` 类中注册了单例类，Asp.Net\
  \ Core 应用程序会自动识别出整个应用程序中必须创建一个类的单一实例，但仅在类构造函数中指定了 `IPDFConverter` 接口依赖注入的地方。要在 Asp.Net\
  \ Core 项目中使用 `PDFConverter` 类，可以具有与之前在控制台应用程序中指定的类似的结构，但是在控制器操作中执行。`PDFConverter`\
  \ 类中负责返回会话的方法已更改为返回字符串值，而不是之前的实现，目的是在 Asp.Net Core 应用程序的视图层显示会话信息。\n\n为了演示，可以在 `HomeController`\
  \ 的 `Index` 操作中包含必要的代码，与之前在控制台应用程序中所做的非常相似。在这种情况下，主要的区别在于对 `PDFConverter` 类的引用，这需要使用与\
  \ `HomeController` 关联的依赖注入提供的实例，因为此时 Asp.Net Core 应用程序负责管理 `PDFConverter` 实例的创建，并保证底层资源的并发全局访问方面在每次使用该类时始终提供该类的相同实例。在\
  \ `HomeController` 中应用必要的更改后，该类将如下截图所示：\n\n![](img/Figure-8.14.jpg)\n\n**图 8.14:**\
  \ Home 控制器的更改\n\n如上一个截图所示，类构造函数接收一个 `PDFConverter` 接口，应用程序会自动注入一个 `PDFConverter`\
  \ 类的实例并在上下文中使用。`IndexController` 操作具有类似的实现，正如在控制台应用程序中所做的一样。尽管如此，仍在字符串对象列表中存储了两次调用\
  \ `PDFConverter` 类的会话信息。如果应用程序运行多次，系统将为每次调用保留相同的会话 ID，即使页面刷新多次。在更改 Index 视图以显示控制器返回的会话信息列表后，结果与之前的单例类版本相似，但此时是由应用程序全局处理的，如下截图所示：\n\
  \n![](img/Figure-8.15.jpg)\n\n**图 8.15:** 网页中的会话信息\n\n即使 `PDFConverter` 类没有显式实现单例模式，考虑到该类在\
  \ `Startup` 类中注册并以单例方式运行，结果仍然满足了在应用程序中保持类单一实例的要求，并在每个在构造函数中注入该类的地方。如上一个截图所示，会话在两次调用之间共享，即使页面刷新也是如此。只有当应用程序重启或由于某些原因服务器内存中的状态被回收时，才会生成新的会话\
  \ ID。\n\n## 结论\n\n正如你在本章中所学习到的，单例模式有助于在整个系统中维护类的同一个实例，解决了软件开发中需要对特定资源提供全局访问且状态完全相同的常见问题。该模式在\
  \ .NET 应用程序中被广泛使用，而 .NET Core 版本引入了一种非侵入性的处理单例模式的方法，无需创建静态类，允许我们编写单元测试并保持原始类不受技术更改的影响。\n\
  \n通过本章，你学习了如何在实际场景中使用 C# 语言实现单例模式，并掌握了在哪些场景可以使用该模式。此外，你还学习了如何在 Asp.Net Core 应用程序中应用单例模式以及如何实现线程安全的单例类。\n\
  \n\n\n\n\n在下一章中，你将有机会使用 C# 语言和 .NET Core 平台继续你的设计模式之旅，学习原型模式，并应用你在本书书前几章中获得的所有通用知识。\n\
  \n## 注意点\n\n*   单例模式可以使用类中的私有构造函数和静态属性进行手动实现。\n*   `lock` 语句可以用于防止单例实现中的并发问题。\n\
  *   用于 Asp.Net Core 应用程序 .NET Core 平台允许我们在在 `Startup` 类中注册类来使用单例模式，结合依赖注入的概念来实现唯一实例的行为。\n\
  \n## 单选题\n\n1. **C# 语言中的哪种特性可以避免资源并发访问产生的问题？**\n    1. Lock 语句\n    2. 工厂\n    3.\
  \ 静态\n    4. 私有\n\n2. **在 Asp.Net Core 应用程序中，单例类可以在哪个类中注册？**\n    1. Program 类\n\
  \    2. Global.asax\n    3. Controllers\n    4. Startup\n\n3. **对于单例类，`lock` 语句的替代方案是什么？**\n\
  \    1. Tasks\n    2. Lazy 类型\n    3. 并循环\n    4. 无替代方案\n\n## 答案\n\n1. a\n2. d\n\
  3. b\n\n## 思考\n\n1. 解释单例模式的主要目的。\n2. 在 Asp.Net 应用程序服务将类注册为单例有什么主要好处？\n3. 根据你在本章中所学的知识，创建一个本章所给示例之外的可以应用单例模式的假设场景。\n\
  \n# 第 9 章\n\n# 原型\n\n许多真实场景需要软件开发多次创建复杂对象的新实例，这可能会导致性能问题和额外挑战，如内存消耗过度和额外的处理时间，这构成了对现代应用程序扩展性或其他所需特性的限制。原型模式允许我们创建复杂对象的副本，这是使用\
  \ .NET 平台和 C# 语言构建的应用中最常用且为人知的模式之一。此外，这种模式背后的概念被许多库应用，不仅在 C# 语言中，在同样基于 OOP 范式的其他语言中也是如此。\n\
  \n学习原型模式让你有机会了解哪些场景可以使用这种模式，并帮助你在旧项目和第三方库中识别该模式。\n\n通过本章，你将有机会通过逐步示例，在基于 .NET Core\
  \ 和 C# 语言的项目应用单例模式概念。\n\n## 结构\n\n在本章中，我们将讨论以下主题：\n\n* 原型模式概念\n* C# 和 .NET Core\
  \ 示例\n\n# 目标\n\n学习本单元后，你应该能够：\n\n* 理解原型模式\n* 在真实世界项目中应用原型模式\n* 在旧项目和第三方库中识别该模式的使用\n\
  \n### 9.1 原型模式定义\n\n原型模式的主要目的是允许高效地复制复杂对象，从而在创建特定对象的新实例时节省时间和资源资源。通过这种模式，一旦高成本的创建过程发生一次，复杂对象创建背后的完整困难过程本质上就对客户端隐藏，任何其他对象的额外实例都是使用一种允许我们在创建后根据需要更改单个属性时创建对象完整副本的方法来生成的。因此，第一个对象充当新实例的模型，保持正确的初始状态供其他实例使用并进行相应的修改。\n\
  \n这种模式是创建型模式的一部分，因为它有助于生成对象本身，并且在特定场景下，它可以与其他模式（如抽象工厂和构建器）结合使用。任何工厂模式在许多情况下都代表一个复杂的结构，以便正确创建复杂对象。相反，原型模式比其他模式要直接得多，因为它认为不需要额外的类、继承和多个接口就能实现其目的。然而，创建第一个对象背后的所有复杂性将需要额外的实现逻辑。因此，每个场景都对哪种方法更好进行自定义分析，始终从简单性、可维护性、扩展性和开发成本的角度进行考虑。\n\
  \n在使用 OOP 范式开发的软件中，有时不允许复制特定属性，因为它们被标记为 `private`，或者它们可能需要额外的逻辑来正确填充。在这种情况下，原型模式是实现复制所有属性并保持所需对象状态的极选择。这种方法主要由管理复杂结构副本的包和库采用，例如\
  \ XML 对象、ORM 数据库上下文等许多示例。\n\n一旦你学习了原型模式的理论概念和目的，下一节将教你如何通过实际示例在真实场景中应用它，并将让你看到该模式如何在\
  \ .NET Core 和 C# 语言的不同项目类型中原生使用。\n\n### 9.2 原型实现\n\n考虑到原型模式是关于对象复制策略的，在我们开始编写真实场景原型示例之前，你必须理解\
  \ C# 语言中浅拷贝（shallow copy）和深拷贝（deep copy）的区别，这将帮助你在架构实现方面做出正确的决策，并防止意外的软件行为，特别是在生产环境中。通常，在需要将一个对象复制到另一个对象的情况下，两个对象将共享内存中的相同地址。因此，如果某个程序对对象的原始实例进行更改，所有副本都会受到影响，它们的属性将同时被更改。尽管它们表面上是不同的实例，但它们在内存中的地址完全相同，物理上，它们是同一个。这个过程被称为\
  \ C# 语言中的浅拷贝，可以使用赋值运算符 `=` 实现。\n\n以下代码示例代表了 `Customer` 类以及该类型的两个实例的创建，其中创建一个全新的实例，第二个实例是作为第一个对象的副本创建的，如下所示：\n\
  \n```\n![](images/Figure-9.1.jpg\n```\n**图 9.1:** 浅拷贝示例\n\n考虑到第二个实例是使用等号运算符从第一个实例创建的，第一个实例中的所有更改都会反映到第二个实例中，反之亦然。如果我们运行示例中的控制台应用程序，控制台将打印两个实例的\
  \ `name` 属性，一旦在第 12 行更改 `Customer 2` 的名称，更改将直接影响 `Customer 1`，如下所示：\n\n```\n![](images/Figure-9.2.jpg\n\
  ```\n**图 9.2:** 浅拷贝结果\n\n\n\n\n\n正如之前提到的，这两个对象在内存中共享同一个地址。因此，它们在程序逻辑上并不是真正的独立对象。这种行为可能会给不熟悉\
  \ C# 语言的开发者带来一些问题，而且在实际项目中如果没有对对象拷贝采取正确的方法，在任何种类型的项目中引入 Bug 并不困难。此外，还有另一种创建浅拷贝的方法，即实现\
  \ `IClonable` 接口。该接口强制要求实现 `Clone` 方法，并且可以使用一个名为 `MemberwiseClone` 的原生方法来创建浅拷贝。对于引用类型属性，`Clone`\
  \ 方法将保持相同的引用。为了测试这种行为，你可以按照下面的截图实现代码：\n\n![](img/Figure-9.3.jpg)\n\n**图 9.3：** MemberwiseClone\
  \ 方法\n\n在这种情况下，`Address` 属性并不是 C# 语言中的原始类型，当使用标准的 `MemberwiseClone` 方法创建副本时，所有属性都可以在副本中进行正常修改，但\
  \ `Address` 属性与原始实例（在此语文中为 `Customer 1`）共享相同的内存位置。\n\n作为浅拷贝方案的替代方案，C# 语言允许我们使用 `DeepCopy`（深拷贝）的概念，它由创建不共享相同内存的实际副本组成，一个对象中的更改不会影响其他对象。在大多数情况下，这是对象拷贝的预期行为，但为了高效地使用它，必须理解并学习如何正确地创建深拷贝。在修改了上一个示例的\
  \ `Clone` 方法后，源对象需要序列化到一个内存流对象中，返回值必须是对该对象的反序列化，如下所示所示：\n\n![](img/Figure-9.4.jpg)\n\
  \n**图 9.4：** 深拷贝\n\n`Clone` 方法将保证为副本在内存中创建一个新的引用。因此，对原始对象所的任何更改都不会影响任何副本，因为在此时它们之间是完全独立的。代码演示了如何创建对象的副本，而不需要逐个指定属性，这对于大型对象可能会导致性能问题，并且会花费更多代码编写时间，而且在相关类添加新属性的情况下，可能会导致额外的问题。\n\
  \n考虑到你已经学习了 C# 语言中深拷贝和浅拷贝的区别，现在是时候通过一个实际示例来熟悉原型模式（Prototype Pattern）了。假设有这样一个场景：你正在参与一个与流媒体平台相关的项目，该平台为客户提供了购买月计划的机会。每个计划都有其自己的规格，在技术上，它们代表着一个在运行时填充的复杂类，实现了许多业务需求。如果公司升级了特定计划的策略，只有计划版本和价格会发生变化，而其他属性保持不变。\n\
  \n考虑到这一背景，创建一个客户计划第一个版本的副本，并有效地仅更改我们需要更改的属性，将是一个优势。这允许我们节省应用程序服务器的内存并提高用户性能，特别是对于复杂操作。每种设计模式的目的是解决软件开发中的特定问题，在实际场景中使用某些模式总有充分的理由。在这个示例的范围内，需求明确指出客户计划仍然相同，除了版本号和价格。如果它具有这种确切的行为，且取决于创建新对象的成本，那么使用原型模式是完全适用的，因为该模式的目的是高效地创建对象副本。\n\
  \n给定的场景必须有两个代表客户计划的类，如下面截图所示：\n\n![](img/Figure-9.5.jpg)\n\n**图 9.5：** 客户计划类\n\n\
  如上一个截图所示，`CustomerPlan` 类包含有关公司政策、法规和其他信息的属性。根据要求，这些属性对于系统可能拥的所有客户计划必须具有相同的值，在每次升级时只有价格和版本是可以更改的。考虑到之前对浅拷贝的解释，如果开发者在系统中没有正确实现拷贝，它将产生错误的行为，因为它将在内存中共享相同的地址，如下截图所示：\n\
  \n![](img/Figure-9.6.jpg)\n\n**图 9.6：** 第二个浅拷贝示例\n\n之前的代码创建了两个不同的 `CustomerPlan`\
  \ 类实例，并为 `name`、`price` 和 `version` 属性分配了不同的值。这段代码的问题是什么？考虑到需要保持公司政策和法规属性的值相同，程序复制了第一个计划以创建第二个客户计划。拷贝完成后，代码的其他部分更改了第二个计划的独有值（名称、价格和版本）。如果此代码在控制台应用程序中运行，对第二个客户计划所做的更改将反映在代码中创建的第一个对象上，如下截图所示：\n\
  \n![](img/Figure-9.7.jpg)\n\n**图 9.7：** 第二个浅拷贝结果\n\n如所示，两个客户计划具有相同的价格，因为两个对象共享内存中的相同位置。在这种情况下，结果不符合业务需求。为了解决这个问题，在保持优异性能的同时，可以使用本节之前所示的\
  \ `DeepCopy` 方法应用原型模式。有使用 `IClonable` 接口的；但考虑到默认推荐使用 `clone` 方法进行浅拷贝，显式地创建一个具有特定名称的\
  \ `DeepCopy` 方法总是更好的，如下截图所示：\n\n![](img/Figure-9.8.jpg)\n\n**图 9.8：** 客户计划类的 Clone\
  \ 方法\n\n类属性保持不变，但类结构中出现了一个名为 `DeepCopy` 的新方法，这允许我们创建不共享内存地址的实际副本。考虑到 `DeepCopy`\
  \ 方法使用了序列化，所有参与拷贝的类都必须标记正确的序列化注解。如果没有这样做，一旦项目运行，如果尝试使用 `copy` 方法将抛出异常，如下截图所示：\n\n\
  ![](img/Figure-9.9.jpg)\n\n**图 9.9：** Plan 类的 Clone 方法\n\n为了解决序列化问题，需要将所有类及其子类标记为可序列化，如下截图所示：\n\
  \n![](img/Figure-9.10.jpg)\n\n**图 9.10：** 可序列化注解\n\n类已完全准备好使用，不会出现任何运行时异常。考虑到之前的控制台应用程序代码示例，现在需要更改第二个客户计划的创建方式，它现在必须使用刚刚创建的\
  \ `DeepCopy` 方法。你只需要更改创建第二个客户计划实例的行。在这种情况下，系统不再保留内存中的相同引用，对其中一个计划的任何更改都不会影响任何其他副本。通过对代码进行所需的更改，满足要求的最终版本如下所示：\n\
  \n![](img/Figure-9.11.jpg)\n\n**图 9.11：** 第二个计划副本\n\n\n\n\n如你在第 19 行所示，第二个客户实例是作为第一个实例的副本创建的，但它使用的是深拷贝方法，这保证了它们不会共享相同的内存地址，并且可以在两个对象中安全地进行更改。如果你在这些更改后运行\
  \ `Console` 应用程序，你将得到如下截图所示的结果：\n\n![](img/Figure-9.12.jpg)\n\n**图 9.12:** 最终深拷贝结果\n\
  \n这两个对象在例程中分配了不同值的属性上具有不同的值。在需要创建许多多个对象的更复杂场景中，一旦复杂对象的拷贝的成本远低于从头创建新实例的成本，性能的提升将变得显著得多。\n\
  \n原型模式允许我们创建对象的副本，使用一种更好的方法来创建新对象，而不是手动创建新实例并逐个分配每个属性。在内存资源被过度使用的生产环境中，理解其中的风险是至关重要的，这意味着这方面的任何性能改进都是非常受欢迎的。\n\
  \n## 结论\n\n正如你在本章中学到的，原型模式在所有需要创建具有相似状态但某些属性具有不同值的类的多个实例的场景中都是非常有帮助且实用的。正如本书的前几章所示，`.NET\
  \ Core` 平台以高性能作为其主要改进之一，因此，一旦遵循了 `.NET` 平台的最佳实践，就建议使用任何高效使用 `C#` 语言的方法。原型模式在 `.NET`\
  \ 应用中被广泛使用，它的使用对于通过适当的方法管理内存以及通过开发快速高效的例程给用户提供出的体验至关重要。\n\n通过本章，你学习了如何使用 `C#` 语言在真实场景中实现原型模式，并能够理解该模式在什么情况下可以使用。此外，你还学习了使用\
  \ `C#` 语言进行浅拷贝和深拷贝的区别，并理解了在什么场景下更推荐每一种。\n\n在下一章中，你将有机会使用 `C#` 语言和 `.NET Core` 平台继续你的设计模式之旅，学习工厂方法模式，并应用你在本书前几章中获得的所有通用知识。\n\
  \n## 记忆点\n\n*   原型模式允许我们高效地创建对象副本，节省内存资源，并在需要创建多个相似对象的复杂操作中提高软件性能。\n*   浅拷贝为所有对象实例在内存中保留相同的引用。\n\
  *   深拷贝赋予了我们创建对象副本的可能性，在内存中保留不同的引用。\n\n## 多选择题\n\n1. **在 `C#` 语言中使用哪个接口可以强制实现 `clone`\
  \ 方法？**\n\n    1. `IEnumerable`\n    2. `Interface`\n    3. `ICopy`\n    4. `IClonable`\n\
  \n2. **可以使用哪种方法在 `C#` 语言中原生地实现浅拷贝行为？**\n\n    1. `MemberwiseClone`\n    2. `ObjectClone`\n\
  \    3. `Copy`\n    4. `Clone`\n\n## 答案\n\n1. d\n2. a\n\n## 问题\n\n1. 解释原型模式的主要目的。\n\
  2. 为什么使用原型模式很重要？\n3. 根据你在本章中学到的知识，创建一个在本章给出的示例之外可以使用原型模式的假设性场景。\n4. `C#` 语言中浅拷贝和深拷贝的区别是什么？\n\
  \n## 核心术语\n\n* **浅拷贝 (Shallow copy)**：在 `C#` 语言中，浅拷贝过程在内存中为所有使用拷贝方法创建的对象维护相同的地址引用。因此，一个对象的更改会影响所有其他副本。\n\
  * **深拷贝 (Deep copy)**：在 `C#` 语言中，深拷贝代表从另一个对象创建一个对象，使两个对象在内存中保持不同的引用，这些对象在状态更改方面彼此是完全独立的。\n\
  \n# 第 10 章：工厂方法\n\n在软件开发中正确使用设计模式对于保持架构的可扩展性至关重要，同时仍应用简单性以实现书中之前所示的 `SOLID` 原则所述的所有良好实践。\n\
  \n考虑到可用设计模式的大量列表，每个模式中实现的概念可能是相似的。在某些情况下，对它们进行快速解释可能会导致无法观察它们之间的真实区别。这可能本书 *第 7\
  \ 章* 中解释的抽象工厂模式与在本章解释的工厂方法模式之间。\n\n学习工厂方法模式为程序员提供了构建更简单架构的机会，并在应用最佳实践（包括多态和封装）的同时允许复杂对象的创建，同时开发出抽象工厂结构的替代方案。这在所有需要创建多个不同对象但又没有大量子类的场景中都可能是盛行的。掌握这种设计模式的知识对于熟悉这种工厂模式与其他具有类似目的的其他创建模式之间的区别至关重要。\n\
  \n通过本章，你将有机会使用 `C#` 语言理解工厂方法模式，并在逐步的示例中应用其概念。\n\n## 结构\n\n在本章中，我们将讨论以下主题：\n\n* 工厂方法概念\n\
  * `C#` 和 `.NET Core` 中的示例\n\n# 目标\n\n在学习本单元后，你应该能够：\n\n* 理解工厂方法模式\n* 在现实项目中应用工厂方法\n\
  * 理解抽象工厂模式和工厂方法模式的区别\n\n### 10.1 工厂方法的定义\n\n工厂方法代表了抽象工厂模式的一种更简单的替代方案。它允许我们使用工厂概念创建复杂对象，特别是在不需要创建许多子类或与主对象的额外类族的情况下。\n\
  \n本书 *第 7 章* 中举例的抽象工厂模式包含一个创建其他工厂的主工厂，比工厂方法模式要复杂得多。因此，当软件架构也成比例地复杂时，更推荐使用它。可以认为工厂方法模式的定义与抽象工厂模式相似，区别在于前者负责创建工厂，而后者负责创建多级工厂工厂。\n\
  \n工厂方法定义了一个负责创建复杂对象的基类，但将创建新实例的责任委托给子类。例如，想象一个应用程序需要为在线商店注册产品服务的场景。如果产品类型在销售实现例程开始时就已经已知，并且对象通常不属于具有多个子类型的同一产品族，且复杂对象的创建不涉及级联工厂或其成员实现中的任何异常常情况，则推荐使用工厂方法。\n\
  \n\n\n\n在这种背景下，在所有可用的设计模式列表中存在工厂方法模式。该模式允许我们创建复杂对象，并将构建这些对象的复杂性封装在主要负责使用和创建这些对象的软件部分中。简而言之，如果系统需要创建复杂对象，且在属性创建方面不包含复杂需求，工厂方法是一个很好的替代方案。工厂方法隐藏了主具体类工厂背后的实现和逻辑，这使得我们能够在保持架构一致性的同时，通过插入新类型的对象来扩展架构的能力。\n\
  \n正如本书的 `第 4 章` 所示，在基于面向对象编程范式的软件中，正确使用接口和抽象类是使软件具有可测试性、可扩展性和可靠性最重要的特征之一。这是工厂方法模式的关键点之一。因此，如果您不熟悉这些概念，建议复习本书的前几章，这些章节包含了接口的基本概述以及关于面向对象编程范式的良好实践。\n\
  \n# 10.2 工厂方法的实现](#toc.xhtml_s122a)\n\n考虑到工厂方法是抽象工厂模式的一种更简单的替代方案，因此在实现具有与 `第 7 章`\
  \ 中之前指定的场景相似需求的项目时，应用其概念并重构架构以符合该模式是至关重要的。因此，在本节中，您将有机会实现一家移动公司的基础结构，该公司公司向客户销售关于短信、移动数据和其他服务的不同套餐，但在需求方面存在细微差异：\n\
  \n*   公司将为客户提供两种类型的套餐：预付制和后付费制。\n*   两种套餐在短信、网络连接速度和移动数据限制方面必须有不同的条件。只有消息数量和连接速度是可更改的。\n\
  *   预付选项有短信限制计划，每月最多 2,000 条短信。\n*   后付费选项有短信限制计划，每月最多 5,000 条短信。\n*   预付选项的最大速度为每秒\
  \ 50 兆字节。\n*   后付费选项的最大速度为每秒 100 兆字节。\n\n需求清楚地表明，移动套餐在对象属性方面具有相同的结构，但对象的值是不同的，如下所示：\n\
  \n| 移动套餐 | 短信限制 | 连接速度 |\n| :--- | :--- | :--- |\n| 预付 (Prepaid) | 2,000/月 | 50\
  \ 兆字节/秒 |\n| 后付费 (Postpaid) | 5,000/月 | 100 兆字节/秒 |\n\n**表 10.1：** 移动套餐\n\n鉴于该场景，使用工厂方法模式允许我们在客户端应用程序中抽象最高层的实现来构建这些复杂对象，如\
  \ `图 10.1` 所示：\n\n![](img/Figure-10.1.jpg)\n\n**图 10.1：** 工厂方法图\n\n如您之前的图所示，工厂方法模式的结构比抽象工厂简单得多，因为不需要强制创建子工厂。一旦在本节中确定了需求并定义了具有适当关联关系的模型结构，就可以开始编码。编码过程的第一步是创建各个类和接口。对于本章的示例，使用了一个架构为\
  \ .NET Core 控制台应用程序的客户端应用程序。对于此应用程序，不存在与数据库的交互，以便重点关注 C# 的实现。\n\n遵循 `图 10.1` 中的截图，我们必须创建第一个类和接口来表示基础工厂和相关类。我们从创建\
  \ `TextMessage` 类开始，包括底层接口，其范围限于如下截图所示表示：\n\n![](img/Figure-10.2.jpg)\n\n**图 10.2：**\
  \ ITextMessage 接口\n\n该接口在该示例中仅包含两个属性，其目的是在给定场景中由其他类使用时识别对象之间的差异。利用工厂方法模式开始编码过程应该从创建接口开始。从未来的测试能力和整个解决方案的可扩展性角度来看，这是一种良好的做法。\n\
  \n下一步是创建实现 `TextMessage` 接口的具体类，如下截图所示：\n\n![](img/Figure-10.3.jpg)\n\n**图 10.3：**\
  \ TextMessage 类\n\n`TextMessage` 实现不包含任何关于需求的规范，例如 `Name` 的特定值或最大短信量（`QuantityPerMonth`）。完整实现是工厂的责任，它将抽象父具体类创建短信背后的逻辑。\n\
  \n在此背景下，`MobilePlan` 必须包含关于 `TextMessages`、`InternetConnection` 和 `MobileDataPlan`\
