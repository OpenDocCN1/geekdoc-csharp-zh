  \ Malavazi 和我的整个家人\n\n## 关于作者\n**Alexandre Malavasi** 在过去的 15 年里一直从事软件开发工作。他曾作为技术主管和软件开发人员参与许多项目，为大公司使用微软技术交付项目，包括在南美、欧洲和美国的成功项目。他还是一位表现优秀的研究生，拥有商业\
  \ IT 和系统分析的 IT 学士学位，以及侧重于敏捷方法的软件工程硕士和软件开发过程的两个硕士学位。他还拥有 Azure 和 Web 开发技术的微软认证。此外，作者还担任\
  \ IT 会议的演讲者，并编写关于 Web 开发及相关主题的技术文章。基于其对全球技术社区的所有贡献，他被提名为微软最有价值专家（MVP）。\n\n## 关于评审员\n\
  **John F. Gnazzo**，PE MBA PMP MVP，是一位首席软件工程顾问，任位于美国明尼苏达州明尼阿利斯的 Gnazzo Technical\
  \ Services, Inc. (GTS)。\n\nJohn 在关键任务企业、移动设备、桌面和基于 Web 的应用程序开发方面拥有超过 25 年的经验，使用了\
  \ `.NET`、`C#`、`C++`、JavaScript 库和框架以及 `SQL Server`。\n\nJohn 在 GTS 的角色是对 GTS 员工、客户和社区提供整个项目生命周期的架构、开发和技术领导专家。John\
  \ 致力于成为包含当代 Web、桌面和移动技术的企业业务解决方案实施领域的领导者。\n\nJohn 在需求开发、应用架构、面向对象和 SOLID 设计原则、设计模式实现、应用程序编程、测试和\
  \ DevOps 方面拥有丰富经验。\n\nJohn 是拥有明尼苏达州执照的注册工程师、认证项目管理师、六西格玛绿带、微软 MVP `https://mvp.microsoft.com/en-us/PublicProfile/5001690?fullName=John%20%20Gnazzo`，并持有\
  \ AWS 和微软的认证。\n\nJohn 编写了许多技术博客，可以在 `http://www.gnazzo.net/Home/Blogs` 找到，以及代码挑战可以在\
  \ `https://www.teamscs.com/2015/03/c-coding-challenge-1/` 找到。\n\nJohn 拥有科罗拉多矿业学院的工程学士学位，以及国立大学的计算机信息技术方向的\
  \ MBA 学位。\n\n## 致谢\n有几个人我想感谢他们在撰写这本书期间给予给我的持续和不断的支持。首先，我要感谢我的妻子，从项目开始初就一直给予我全意且持续的支持；感谢我的家人鼓励我写这本书——如果没有他们的动力，我无法完成这本挑战性的书。\n\
  \n我感谢这 15 年来与我直接合作的每一个人，他们教我如何编写代码，并在质量保证和良好的软件开发实践方面不断推我向更高水平。\n\n我还要感谢 BPB 团队，他们提供了足够的支持，并在\
  \ 2020 年到 2021 年这段受全球疫情危机影响（包括我在内）的挑战性时期为我提供了充足的时间完成这本书。我也感谢他们允许我写我的第一本书，这无疑是一个巨大的个人成就。\n\
  \n## 前言\n本书涵盖了使用 `C#` 和 `.NET 5` 实现设计模式和面向对象编程范式的许多细节，从 `C#` 和 `Visual Studio` 的基本元素到更高级的软件架构概念和良好的编码实践，包括\
  \ `SOLID` 原则。重点在于使用设计模式解决真实场景的挑战，展示如何利用面向对象范式的良好实践来解决不同复杂程度的问题。\n\n本书描述了理解封装、接口、继承以及\
  \ `C#` 语言其他方面所需的理论概念。它讨论了如何在 `C#` 和 `.NET` 平台上使用设计模式解决实际问题。它提供了 `.NET` 平台上高级资源的整体视图，并对主要应用于市场的解决方案提供了详细信息。\n\
  \n前六章将从 `C#` 语言和 `.NET` 平台的基础概念开始，包括 `SOLID` 原则和面向对象编程。然后，将关注软件开发良好实践的必要和初步知识的实际示例，为后续章节中的更高级实现做准备。\n\
  \n全十一章将让读者熟悉 `C#` 语言和 `.NET` 平台上最常用的设计模式，并结合实际示例和真实场景采用循序渐进的方法。最后，它将在需要应用设计模式的情况下，提供关于\
  \ `.NET` 应用的一些建议和良好实践。\n\n首要目标是让读者熟悉使用 `C#` 语言在基于 `.NET` 的应用程序中使用设计模式。\n\n***\n\n\
  **第 1 章** 详细解释了 `C#` 语言的基础概念，包括 `Visual Studio` 安装和环境配置指南，以开启 `.NET Core` 之之旅。本章涵盖了\
  \ `C#` 语言中的运算符、变量、对象类型、迭代和错误处理。\n\n**第 2 章** 专注于开发者入门 `.NET` 平台所需的关键方面，从安装步骤到理解其工作原理。它还将详细介绍\
  \ `.NET Core` 版本的历史、多平台概念以及基于 `.NET` 构建的云解决方案。\n\n\n\n\n\n第 3 章 描述了面向对象编程范式的基本概念，包括类、构造函数、方法、继承、静态类、结构体和多态。它还将讨论使用\
  \ `C#` 语言进行面向对象编程的良好实践，并结合实际示例。\n\n第 4 章 重点介绍 `C#` 语言中的接口，包括良好实践和真实案例。它还将讨论软件开发中的可测试性和可扩展性，这些在接口方面与最佳实践非常接近。\n\
  \n第 5 章 解释了 `C#` 语言中封装和多态的基本概念，包括真实案例、最佳实践以及这些概念与 `SOLID` 原则之间的联系。\n\n第 6 章 使用 `C#`\
  \ 语言的真实案例和实操场景描述了 `SOLID` 原则。它还将讨论单一职责、开闭原则、Liskov 替换和依赖倒转每个原则背后的良好实践。\n\n第 7 章\
  \ 对 `C#` 语言中的抽象工厂设计模式提供了深入的解释。它还将基于真实场景提供实际示例，并解释如何应用此模式来解决中等复杂度的问题。\n\n第 8 章 使用\
  \ `C#` 和 `.NET` 的实际示例详细解释了单例设计模式。它还将展示如何在结合依赖注入概念的情况下在 `ASP.Net Core` 应用程序中使用此模式。\n\
  \n第 9 章 重点关注原型设计模式，通过实际和真实的示例演示对象浅拷贝和深拷贝的区别，包括实现一个需要使用此模式以保持软件架构可扩展和可测试的场景。\n\n\
  第 10 章 使用 `C#` 语言和 `.NET` 平台的实际示例详细阐述了工厂方法设计模式。它还将解释推荐使用此模式的场景，包括建议和良好实践。\n\n第 11\
  \ 章 阐述了适配器设计模式，这是软件开发中最常用的模式之一，主要用于数据库提供程序中。它还将提供真实案例和实操风格的练习题。\n\n第 12 章 解释了组合设计模式。它还将基于真实场景提供实际示例，演示使用\
  \ `C#` 语言面向对象范式的良好实践，并解释如何结合高级软件架构概念应用此模式。\n\n第 13 章 讨论了代理设计模式，以及如何用它解决基于 `C#` 语言和\
  \ `.NET Core` 的许多公司项目中常见问题。\n\n第 14 章 介绍了命令模式，并为读者提供基于真实场景的实际示例。它还将提供关于该模式的理论细节及其对市场上\
  \ `.NET Core` 应用程序的重要性。\n\n第 15 章 重点关注策略设计模式，解释推荐使用此模式的场景。它还将通过基于真实软件需求的实际示例讨论该模式的细节。\n\
  \n第 16 章 详细解释了观察者设计模式，演示如何在基于 `C#` 语言和 `.NET` 平台的遗留项目中使用它。它还将通过真实场景的实际示例帮助读者在许多应用程序中应用此模式。\n\
  \n第 17 章 专注于在基于 `C#` 语言和 `.NET Core` 的项目中使用模式实现应用的通用良好实践和建议。它还将提供额外设计模式的概述，如责任链、外外观、构建器、桥接和装饰器设计模式。\n\
