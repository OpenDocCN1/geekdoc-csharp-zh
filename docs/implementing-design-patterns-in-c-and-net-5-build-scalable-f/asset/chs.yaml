  \ 结构的实现需要一个接口（`IConnectionSpeed`），它包含与未来具体类相关的属性，如下所示：\n\n![](img/Figure-10.4.jpg)\n\
  \n**图 10.4：** IConnectionSpeed 接口\n\n上面的接口仅包含 `Name` 和 `Velocity` 两个属性，其目的是在被实现类使用时识别对象之间的差异。下一步是创建实现\
  \ `IConnectionSpeed` 接口的 `ConnectionSpeed` 具体类，如下所示：\n\n![](img/Figure-10.5.jpg)\n\
  \n**图 10.5：** ConnectionSpeed 类\n\n由于给定场景考虑了两种连接速度（高速和低速），工厂负责根据每个移动套餐的需求填充连接速度属性。如果使用抽象工厂模式并需要为不同类型创建具体类，则会有显著差异。每种方法都有优缺点。最佳决策必须考虑项目的需求。\n\
  \n此时，移动套餐类的复合属性已经创建。下一步是创建移动套餐结构，涉及规范通用接口 `IMobilePlan`，该接口将为两种可用的移动套餐类型（后付费和预付）实现，如下截图所示：\n\
  \n![](img/Figure-10.6.jpg)\n\n**图 10.6：** IMobilePlan 接口\n\n正如关于连接速度和短信类所，所有实现 `IMobilePlan`\
  \ 接口的类都不负责为复合属性指定任何值，因为这是工厂类的责任。考虑到需求包括两种不同的移动套餐，有必要为每个类型创建具体类，将 `IMobilePlan` 的底层接口实现到\
  \ `PostPaidMobilePlan` 具体类中，如下所示：\n\n![](img/Figure-10.7.jpg)\n\n**图 10.7：** PostpaidMobilePlan\
  \ 类\n\n\n\n\n一旦每个移动套餐都有了自己的类，就可以根据需要为每个类指定可以使用的额外自定义方法。通过这种方法，尽管为每种类型都创建了工厂，但每个类之间仍然不相互依赖。这符合良好的面向对象编程实践。\n\
  \n下一步是为预付费移动套餐创建 `PrepaidMobilePlan` 类，这通过下面截图所示的代码实现：\n\n![](img/Figure-10.8.jpg)\n\
  \n**图 10.8：** PrepaidMobilePlan 类\n\n如你在图 10.8 中所示，预付费移动数据类包含一个名为 `PrepaidIntegration`\
  \ 的方法，该方法是该类特有的。这是在某些场景下使用工厂方法模式而不是抽象工厂方法模式的优势。然而，当前模式仍然需要创建工厂（为每个移动套餐类型创建一个工厂），以实现从客户端应用程序中封装对象创建的目的。在这种情况下，你需要创建一个供所有工厂共享的基工厂类，如下截图所示：\n\
  \n![](img/Figure-10.9.jpg)\n\n**图 10.9：** BaseMobilePlanFactory 类\n\n遵循工厂方法模式规定的最佳实践，基工厂类必须使用\
  \ `abstract` 修饰符，且 `GetMobilePlan` 方法必须引用负责创建移动套餐实例的方法。你可能会在遗留项目或外部库中看到这种模式。如果是这样，这表明了将实例的创建委托给工厂中的子类的意图，这是当前模式与抽象工厂模式之间的主要区别。\n\
  \n一旦创建了基工厂，就可以创建各个具体的工厂了。各个工厂将继承自基类，为各个类型执行所有必要的自定义操作，如下截图中关于预付费移动套餐的代码所示：\n\n![](img/Figure-10.10.jpg)\n\
  \n**图 10.10：** PrepaidMobilePlanFactory 类\n\n`PrepaidMobilePlanFactory` 类继承自基工厂抽象类，并重写了负责创建移动套餐的方法，根据要求为连接速度和短信属性指定自定义值。此外，该方法调用了\
  \ `PrepaidIntegration` 方法来运行与实例创建相关的自定义操作。出于演示之目的，该集成方法没有任何实现，但真实场景可能需要与每个工厂相关的额外操作。\n\
  \n最后，正如要求所示，下一步是为后付费移动套餐创建底层工厂类 `PostpaidMobilePlanFactory`，遵循与之前代码相同的模式，如下截图所示：\n\
  \n![](img/Figure-10.11.jpg)\n\n**图 10.11：** PostpaidMobilePlanFactory 类\n\n通过此类，通过严格遵循本节开头指定的业务需求，工厂方法模式得到了完全实现。最后需要做的工作是在客户端应用程序中调用工厂类并查看结果。在控制台应用程序中，创建了每个工厂类的实例，如下截图所示：\n\
  \n![](img/Figure-10.12.jpg)\n\n**图 10.12：** 工厂类实例\n\n通过使用每个具体工厂类提供的 `GetMobilePlan`\
  \ 方法获取移动套餐实例，向客户端应用程序隐藏所有实现细节，实现了工厂方法模式的主要目的。最后一步，在控制台应用程序中打印每个套餐的属性，如下截图所示：\n\n\
  ![](img/Figure-10.13.jpg)\n\n**图 10.13：** 工厂方法打印\n\n如果你使用给定的实现运行客户端应用程序，控制台将显示预付费和后付费对象之间的差异，证明实现按预期工作，并将对象创建的所有复杂性保留在工厂方法中，如下截图所示：\n\
  \n![](img/Figure-10.14.jpg)\n\n**图 10.14：** 工厂方法结果\n\n在本章所示，工厂方法模式的实现比抽象工厂模式所需的精力更少，可以将简单性与卓越的架构相结合，允许在抽象类中封装复杂操作的完整实现，避免真实场景中的访问违规和意外行为。\n\
  \n# 结论](#toc.xhtml_s123a)\n\n正如你在这一章中所学的，工厂方法模式对于以简单高效的方式管理复杂对象的创建非常有用，它利用了关于封装和多态的最佳实践。考虑到该模式广泛使用了接口和抽象类，可以在整个项目中保持一致的架构，充分利用为了模拟对象（mocking\
  \ objects）进行测试和其他目的的优势。这种模式减少了类与类之间的依赖，并赋予了我们在不对遗留代码产生任何影响的情况下扩展功能的潜力。\n\n在本章中，你学习了如何使用\
  \ C# 语言在真实场景中实现工厂方法模式，并展示了理解通用设计模式核心点的能力。这支持了在实现和软件架构方面使用通用解决方案解决软件开发中常见问题的能力。\n\
  \n在下一章中，你将有机会继续使用 C# 语言和 .NET Core 平台探索设计模式之旅，学习适配器模式，并应用你在书中前几章获得的所有通用知识。\n\n#\
  \ 重点回顾](#toc.xhtml_s124a)\n\n*   工厂方法模式比抽象工厂模式更易于使用和实现，因为它的主要目的是作为一个工厂创建一个单一对象。\n\
  *   C# 语言完全支持工厂方法模式，因为它基于接口和抽象类，这些都是面向对象编程范式中的标准功能。\n\n# 单选题](#toc.xhtml_s125a)\n\
