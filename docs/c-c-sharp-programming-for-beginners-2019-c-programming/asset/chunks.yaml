    will arise .Syntax:The syntax for a nested switch  statement is as follows −switch(ch1)
    {case ''A'':Console.WriteLine("This A is part of outer switch" );switch(ch2) {case
    ''A'':Console.WriteLine("This A is part of inner switch" );break;case ''B'': /*
    inner B case code */}break;case ''B'': /* outer B case code */}Example:using System
    ;namespace DecisionMaking {class Program {static void Main ( string [] args )
    {int a = 100 ;int b = 200 ;switch ( a ) {case 100 :Console . WriteLine ( "This
    is part of outer switch " );switch ( b ) {case 200 :Console . WriteLine ( "This
    is part of inner switch " );break ;}break ;}Console . WriteLine ( "Exact value
    of a is : {0}" , a );Console . WriteLine ( "Exact value of b is : {0}" , b );Console
    . ReadLine ();}}}When the above code is compiled and executed, it produces the
    following result −This is part of outer switchThis is part of inner switchExact
    value of a is : 100Exact value of b is : 200The ? : OperatorWe have covered conditional
    operator ? :  in previous chapter which can be used to replace if...else  statements.
    It has the following general form −Exp1 ? Exp2 : Exp3;Where Exp1, Exp2, and Exp3
