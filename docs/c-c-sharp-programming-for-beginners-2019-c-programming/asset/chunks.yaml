  trans: "\n\n### 3. 将数组传递给函数\n你可以通过指定数组名称而不加索引，将数组指针传递给函数。\n\n### 4. 参数数组 (Param\
    \ arrays)\n这用于向函数传递未知数量的参数。\n\n### 5. Array 类\n定义在 `System` 命名空间中，它是数组的基类，并提供了用于处理数组的各种属性和方法。\n\
    \n#### 多维数组\nC# 允许多维数组。多维数组也称为矩形数组（rectangular array）。你可以声明一个字符串类型的二维数组为 `-string\
    \ [,] names;`，或者一个 int 类型的变量的三维数组为 `-int [ , , ] m;`。\n\n##### 二维数组\n多维数组最简单的形式是二维数组。二维数组是一个一维数组的列表。二维数组可以被想象成表格，具有\
    \ `x` 行和 `y` 列。下面是一个包含 3 行 4 列的二维数组：\n![Two Dimensional Arrays in C#](img/image4586.jpg)\n\
    \n因此，数组 `a` 中的每个元素通过形式为 `a[ i , j ]` 的元素名称标识，其中 `a` 是数组名称，`i` 和 `j` 是唯一标识数组 `a`\
    \ 中每个元素的下标。\n\n###### 初始化二维数组\n多维数组可以通过为每行指定括号中的值来初始化。下面的数组具有 3 行，每行有 4 列。\n```csharp\n\
    int [,] a = new int [ 3 , 4 ] {{ 0 , 1 , 2 , 3 } , /* 索引为 0 的行初始化值 */{ 4 , 5 ,\
    \ 6 , 7 } , /* 索引为 1 的行初始化值 */{ 8 , 9 , 10 , 11 } /* 索引为 2 的行初始化值 */};\n```\n\n\
    ##### 访问二维数组元素\n使用下标（即数组的行索引和列索引）来访问二维数组中的元素。例如：\n```csharp\nint val = a [ 2 ,\
    \ 3 ];\n```\n上述语句获取了数组第 3 行的第 4 个元素。你可以在上面的图中进行验证。让我们查看处理二维数组的程序：\n```csharp\n\
    using System ;\nnamespace ArrayApplication {\n    class MyArray {\n        static\
    \ void Main ( string [] args ) {\n            /* 一个具有 5 行 2 列的数组*/\n         \
    \   int [,] a = new int [ 5 , 2 ] {{ 0 , 0 }, { 1 , 2 }, { 2 , 4 }, { 3 , 6 },\
    \ { 4 , 8 } };\n            int i , j ;\n            /* 输出每个数组元素的值 */\n      \
    \      for ( i = 0 ; i < 5 ; i ++) {\n                for ( j = 0 ; j < 2 ; j\
    \ ++) {\n                    Console . WriteLine ( \"a[{0},{1}] = {2}\" , i ,\
    \ j , a [ i , j ]);\n                }\n            }\n            Console . ReadKey\
    \ ();\n        }\n    }\n}\n```\n当上述代码编译并执行时，它产生以下结果：\n`a[0,0]: 0`\n`a[0,1]: 0`\n\
    `a[1,0]: 1`\n`a[1,1]: 2`\n`a[2,0]: 2`\n`a[2,1]: 4`\n`a[3,0]: 3`\n`a[3,1]: 6`\n\
    `a[4,0]: 4`\n`a[4,1]: 8`\n\n##### 交错数组 (Jagged array)\n交错数组是数组的数组。你可以声明一个类型为 `int`\
    \ 名为 `scores` 的交错数组为 `-int [][] scores;`。\n\n声明数组不会在内存中创建数组。要创建上述数组：\n```csharp\n\
    int [][] scores = new int [ 5 ][];\nfor ( int i = 0 ; i < scores . Length ; i\
    \ ++) {\n    scores [ i ] = new int [ 4 ];\n}\n```\n你可以这样初始化交错数组：\n```csharp\n\
    int [][] scores = new int [ 2 ][]{ new int []{ 92 , 93 , 94 }, new int []{ 85\
    \ , 66 , 87 , 88 }};\n```\n其中，`scores` 是一个包含两个整数数组的数组——`scores[0]` 是包含 3 个整数的数组，`scores[1]`\
    \ 是包含 4 个整数的数组。\n\n###### 示例\n下面的示例说明了如何使用交错数组：\n```csharp\nusing System ;\nnamespace\
    \ ArrayApplication {\n    class MyArray {\n        static void Main ( string []\
    \ args ) {\n            /* 一个 5 个整数数组组成的交错数组*/\n            int [][] a = new int\
    \ [][]{ new int []{ 0 , 0 }, new int []{ 1 , 2 },new int []{ 2 , 4 }, new int\
    \ []{ 3 , 6 }, new int []{ 4 , 8 } };\n            int i , j ;\n            /*\
    \ 输出每个数组元素的值 */\n            for ( i = 0 ; i < 5 ; i ++) {\n                for\
    \ ( j = 0 ; j < 2 ; j ++) {\n                    Console . WriteLine ( \"a[{0}][{1}]\
    \ = {2}\" , i , j , a [ i ][ j ]);\n                }\n            }\n       \
    \     Console . ReadKey ();\n        }\n    }\n}\n```\n当上述代码编译并执行时，它产生以下结果：\n\
    `a[0][0]: 0`\n`a[0][1]: 0`\n`a[1][0]: 1`\n`a[1][1]: 2`\n`a[2][0]: 2`\n`a[2][1]:\
    \ 4`\n`a[3][0]: 3`\n`a[3][1]: 6`\n`a[4][0]: 4`\n`a[4][1]: 8`\n\n### 将数组作为函数参数传递\n\
    你可以将数组作为参数传递。下面的示例演示了这一点：\n```csharp\nusing System ;\nnamespace ArrayApplication\
    \ {\n    class MyArray {\n        double getAverage ( int [] arr , int size )\
    \ {\n            int sum = 0;\n            for ( i = 0 ; i < size ; i ) {\n  \
    \              sum += arr[i];\n            }\n            return ( double ) sum\
    \ / size;\n        }\n        static void Main ( string [] args ) {\n        \
    \    int[] balance = new int [] { 0, 0, 1, 2, 2, 4, 3, 6, 4, 8 };\n          \
    \  double avg = getAverage ( balance, 5 );\n            Console . WriteLine (\
    \ \"Average: {0}\" , avg );\n            Console . ReadKey ();\n        }\n  \
    \  }\n}\n```\n当上述代码编译并执行时，它产生以下结果：\n`Average: 2`\n\n### 参数数组 (Param arrays)\n\
    这用于向函数传递未知数量的参数。\n```csharp\nusing System ;\nnamespace ArrayApplication {\n  \
    \  class MyArray {\n        int AddElements ( params int [] arr ) {\n        \
    \    int sum = 0;\n            foreach ( int i in arr ) {\n                sum\
    \ += i;\n            }\n            return sum;\n        }\n        static void\
    \ Main ( string [] args ) {\n            int[] balance = new int [] { 0, 0, 1,\
    \ 2, 2, 4, 3, 6, 4, 8 };\n            int sum = AddElements ( balance );\n   \
    \         Console . WriteLine ( \"sum: {0}\" , sum );\n            Console . ReadKey\
    \ ();\n        }\n    }\n}\n```\n\n### Array 类\n定义在 `System` 命名空间中，它是数组的基类，并提供了用于处理数组的各种属性和方法。\n\
    \n#### Array 的属性\n下面的表格描述了常用的属性：\n| 序号 No. | 属性 | 描述 |\n| :--- | :--- | :--- |\n\
    | 1 | FixedSize | 获取数组是否具有固定大小。 |\n| 2 | IsReadOnly | 获取数组是否是只读的。 |\n| 3 | Length\
    \ | 获取所有维度元素总数的 32 位整型。 |\n| 4 | LongLength | 获取所有维度元素总数的 64 位整型。 |\n| 5 | Rank\
    \ | 获取数组的秩（维度数量）。 |\n\n#### Array 的方法\n下面的表格描述了常用的方法：\n| 序号 No. | 方法 | 描述 |\n\
    | :--- | :--- | :--- |\n| 1 | Clear | 将数组范围内的元素设置为 0、false 或 null。 |\n| 2 | Copy(Array,\
    \ Array, Int32) | 将一个数组的范围元素复制到另一个数组。 |\n| 3 | CopyTo(Array, Int32) | 将当前数组的所有元素复制到指定的数组。\
    \ |\n| 4 | GetLength(int) | 获取指定维度的元素数量。 |\n| 5 | GetLongLength(int) | 获取指定维度的元素数量（64\
    \ 位）。 |\n| 6 | GetLowerBound(int) | 获取指定维度的下界。 |\n| 7 | GetValue(Int32) | 获取指定位置的值。\
    \ |\n| 8 | IndexOf(Array, Object) | 搜索对象并返回首次出现的索引。 |\n| 9 | Reverse(Array) |\
    \ 反转元素的序列。 |\n| 10 | SetValue(Object, Int32) | 在指定位置设置值。 |\n\n"
- fmt: "\n| # | Method | Description |\n| :--- | :--- | :--- |\n| 13 | `Sort(Array)`\
    \ | Sorts the elements in an entire one-dimensional `Array` using the `IComparable`\
    \ implementation of each element of the `Array`. |\n| 14 | `ToString()` | Returns\
    \ a string that represents the current object. (Inherited from `Object`.) |\n\n\
    For complete list of `Array` class properties and methods, please consult Microsoft\
    \ documentation on C#.\n\n### Example\nThe following program demonstrates use\
    \ of some of the methods of the `Array` class:\n\n```csharp\nusing System;\nnamespace\
    \ ArrayApplication {\n    class MyArray {\n        static void Main(string[] args)\
    \ {\n            int[] list = { 34, 72, 13, 44, 25, 30, 10 };\n            int[]\
    \ temp = list;\n            Console.Write(\"Original Array: \");\n           \
    \ foreach (int i in list) {\n                Console.Write(i + \" \");\n     \
    \       }\n            Console.WriteLine();\n            // reverse the array\n\
    \            Array.Reverse(temp);\n            Console.Write(\"Reversed Array:\
    \ \");\n            foreach (int i in temp) {\n                Console.Write(i\
    \ + \" \");\n            }\n            Console.WriteLine();\n            //sort\
    \ the array\n            Array.Sort(list);\n            Console.Write(\"Sorted\
    \ Array: \");\n            foreach (int i in list) {\n                Console.Write(i\
    \ + \" \");\n            }\n            Console.WriteLine();\n            Console.ReadKey();\n\
    \        }\n    }\n}\n```\n\nWhen the above code is compiled and executed, it\
    \ produces the following result:\n```\nOriginal Array: 34 72 13 44 25 30 10\n\
    Reversed Array: 10 30 25 44 13 72 34\nSorted Array: 10 13 25 30 34 44 72\n```\n\
    \n# C# - Strings\nIn C#, you can use strings as array of characters, However,\
    \ more common practice is to use the `string` keyword to declare a string variable.\
    \ The `string` keyword is an alias for the `System.String` class.\n\n### Creating\
    \ a String Object\nYou can create string object using one of the following methods:\n\
    - By assigning a string literal to a `String` variable\n- By using a `String`\
    \ class constructor\n- By using the string concatenation operator (`+`)\n- By\
    \ retrieving a property or calling a method that returns a string\n- By calling\
    \ a formatting method to convert a value or an object to its string representation\n\
    \nThe following example demonstrates this:\n\n```csharp\nusing System;\nnamespace\
    \ StringApplication {\n    class Program {\n        static void Main(string[]\
    \ args) {\n            //from string literal and string concatenation\n      \
    \      string fname, lname;\n            fname = \"Rowan\";\n            lname\
    \ = \"Atkinson\";\n            char[] letters = { 'H', 'e', 'l', 'l', 'o' };\n\
    \            string[] sarray = { \"Hello\", \"From\", \"C#\", \"Tutorial\" };\n\
    \            string fullname = fname + lname;\n            Console.WriteLine(\"\
    Full Name: {0}\", fullname);\n            //by using string constructor\n    \
    \        char[] greeting_chars = { 'H', 'e', 'l', 'l', 'o' };\n            string\
    \ greetings = new string(greeting_chars);\n            Console.WriteLine(\"Greetings:\
    \ {0}\", greetings);\n            //methods returning string\n            string[]\
    \ msg_parts = { \"Hello\", \"From\", \"C#\", \"Tutorial\" };\n            string\
    \ message = String.Join(\" \", sarray);\n            Console.WriteLine(\"Message:\
    \ {0}\", message);\n            //formatting method to convert a value\n     \
    \       DateTime waiting = new DateTime(2012, 10, 10, 17, 58, 1);\n          \
    \  string chat = String.Format(\"Message sent at {0:t} on {0:D}\", waiting);\n\
    \            Console.WriteLine(\"Message: {0}\", chat);\n        }\n    }\n}\n\
    ```\n\nWhen the above code is compiled and executed, it produces the following\
    \ result:\n```\nFull Name: RowanAtkinson\nGreetings: Hello\nMessage: Hello From\
    \ C#\nMessage: Message sent at 5:58 PM on Wednesday, October 10, 2012\n```\n\n\
    ### Properties of the String Class\nThe `String` class has the following two properties:\n\
    \n| Sr.No. | Property & Description |\n| :--- | :--- |\n| 1 | `Chars` - Gets the\
    \ `Char` object at a specified position in the current `String` object. |\n| 2\
    \ | `Length` - Gets the number of characters in the current `String` object. |\n\
    \n### Methods of the String Class\nThe `String` class has numerous methods that\
    \ help you in working with the string objects. The following table provides some\
    \ of the most commonly used methods. Given below is the list of methods of the\
    \ `String` class. You can visit MSDN library for the complete list of methods\
    \ and `String` class constructors.\n\n### Examples\nThe following example demonstrates\
    \ some of the methods mentioned above:\n\n#### Comparing Strings\n```csharp\n\
    using System;\nnamespace StringApplication {\n    class StringProg {\n       \
    \ static void Main(string[] args) {\n            string str1 = \"This is test\"\
    ;\n            string str2 = \"This is text\";\n            if (String.Compare(str1,\
    \ str2) == 0) {\n                Console.WriteLine(str1 + \" and \" + str2 + \"\
    \ are equal.\");\n            } else {\n                Console.WriteLine(str1\
    \ + \" and \" + str2 + \" are not equal.\");\n            }\n            Console.ReadKey();\n\
    \        }\n    }\n}\n```\nResult:\n```\nThis is test and This is text are not\
    \ equal.\n```\n\n#### String Contains String\n```csharp\nusing System;\nnamespace\
    \ StringApplication {\n    class StringProg {\n        static void Main(string[]\
    \ args) {\n            string str = \"This is test\";\n            if (str.Contains(\"\
    test\")) {\n                Console.WriteLine(\"The sequence 'test' was found.\"\
    );\n            }\n            Console.ReadKey();\n        }\n    }\n}\n```\n\
    Result:\n```\nThe sequence 'test' was found.\n```\n\n#### Getting a Substring\n\
    ```csharp\nusing System;\nnamespace StringApplication {\n    class StringProg\
    \ {\n        static void Main(string[] args) {\n            string str = \"Last\
    \ night I dreamt of San Pedro\";\n            Console.WriteLine(str);\n      \
    \      string substr = str.Substring(23);\n            Console.WriteLine(substr);\n\
    \        }\n    }\n}\n```\nResult:\n```\nSan Pedro\n```\n\n#### Joining Strings\n\
    ```csharp\nusing System;\nnamespace StringApplication {\n    class StringProg\
    \ {\n        static void Main(string[] args) {\n            string[] starray =\
    \ {\n                \"Down the way nights are dark\",\n                \"And\
    \ the sun shines daily on the mountain top\",\n                \"I took a trip\
    \ on a sailing ship\",\n                \"And when I reached Jamaica\",\n    \
    \            \"I made a stop\"\n            };\n            string str = String.Join(\"\
    \\n\", starray);\n            Console.WriteLine(str);\n        }\n    }\n}\n```\n\
    Result:\n```\nDown the way nights are dark\nAnd the sun shines daily on the mountain\
    \ top\nI took a trip on a sailing ship\nAnd when I reached Jamaica\nI made a stop\n\
    ```\n\n# C# - Classes\nWhen you define a class, you define a blueprint for a data\
    \ type. This does not actually define any data, but it does define what the class\
    \ name means. That is, what an object of the class consists of and what operations\
    \ can be performed on that object. Objects are instances of a class. The methods\
    \ and variables that constitute a class are called members of the class.\n\n###\
    \ Defining a Class\nA class definition starts with the keyword `class` followed\
    \ by the class name; and the class body enclosed by a pair of curly braces. Following\
    \ is the general form of a class definition:\n\n```csharp\naccess_specifier class\
    \ class_name {\n    // member variables\n    access_specifier <data type> variable1;\n\
    \    access_specifier <data type> variable2;\n    ...\n    access_specifier <data\
    \ type> variableN;\n    // member methods\n    access_specifier <return type>\
    \ method1(parameter_list) {\n        // method body\n    }\n    access_specifier\
    \ <return type> method2(parameter_list) {\n        // method body\n    }\n   \
    \ ...\n    access_specifier <return type> methodN(parameter_list) {\n        //\
    \ method body\n    }\n}\n```\n\n### Note\n- Access specifiers specify the access\
    \ rules for the members as well as the class itself. If not mentioned, then the\
    \ default access specifier for a class type is `internal`. Default access for\
    \ the members is `private`.\n- Data type specifies the type of variable, and return\
    \ type specifies the type of the data the method returns, if any.\n- To access\
    \ the class members, you use the dot (`.`) operator.\n- The dot operator links\
    \ the name of an object with the name of a member.\n"
