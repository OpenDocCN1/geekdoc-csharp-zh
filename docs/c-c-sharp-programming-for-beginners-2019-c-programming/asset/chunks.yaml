  trans: "\n\n# 示例\n下面的代码段展示了一个名为 `FindMax` 函数，它接收两个整数值并返回两者中较大的一个。它具有公共访问修符，因此可以使用该类的实例从类外部访问。\n\
    \n```csharp\nclass NumberManipulator {\n    public int FindMax ( int num1 , int\
    \ num2 ) {\n        /* local variable declaration */\n        int result ;\n \
    \       if ( num1 > num2 )\n            result = num1 ;\n        else\n      \
    \      result = num2 ;\n        return result ;\n    }\n}\n```\n\n## 在 C# 中调用方法\n\
    你可以使用方法的名称来调用方法。下面的示例阐述了这一点：\n\n```csharp\nusing System ;\nnamespace CalculatorApplication\
    \ {\n    class NumberManipulator {\n        public int FindMax ( int num1 , int\
    \ num2 ) {\n            /* local variable declaration */\n            int result\
    \ ;\n            if ( num1 > num2 )\n                result = num1 ;\n       \
    \     else\n                result = num2 ;\n            return result ;\n   \
    \     }\n        static void Main ( string [] args ) {\n            /* local variable\
    \ definition */\n            int a = 100 ;\n            int b = 200 ;\n      \
    \      int ret ;\n            NumberManipulator n = new NumberManipulator ();\n\
    \            //calling the FindMax method\n            ret = n . FindMax ( a ,\
    \ b );\n            Console . WriteLine ( \"Max value is : {0}\" , ret );\n  \
    \          Console . ReadLine ();\n        }\n    }\n}\n```\n\n当上述代码编译并执行时，将产生以下结果：\n\
    Max value is : 200\n\n你也可以通过使用类的实例从其他类调用公共方法。例如，`FindMax` 方法属于 `NumberManipulator`\
    \ 类，你可以从另一个类 `Test` 中调用它。\n\n```csharp\nusing System ;\nnamespace CalculatorApplication\
    \ {\n    class NumberManipulator {\n        public int FindMax ( int num1 , int\
    \ num2 ) {\n            /* local variable declaration */\n            int result\
    \ ;\n            if ( num1 > num2 )\n                result = num1 ;\n       \
    \     else\n                result = num2 ;\n            return result ;\n   \
    \     }\n    }\n    class Test {\n        static void Main ( string [] args )\
    \ {\n            /* local variable definition */\n            int a = 100 ;\n\
    \            int b = 200 ;\n            int ret ;\n            NumberManipulator\
    \ n = new NumberManipulator ();\n            //calling the FindMax method\n  \
    \          ret = n . FindMax ( a , b );\n            Console . WriteLine ( \"\
    Max value is : {0}\" , ret );\n            Console . ReadLine ();\n        }\n\
    \    }\n}\n```\n\n当上述代码编译并执行时，将产生以下结果：\nMax value is : 200\n\n## 递归方法调用\n方法可以调用自己。这被称为\
    \ `recursion`。下面的示例是一个使用递归函数计算给定数字的阶乘：\n\n```csharp\nusing System ;\nnamespace\
    \ CalculatorApplication {\n    class NumberManipulator {\n        public int factorial\
    \ ( int num ) {\n            /* local variable declaration */\n            int\
    \ result ;\n            if ( num == 1 )\n                return 1 ;\n        \
    \    else\n                result = factorial ( num - 1 ) * num ;\n          \
    \  return result ;\n        }\n        static void Main ( string [] args ) {\n\
    \            NumberManipulator n = new NumberManipulator ();\n            //calling\
    \ the factorial method\n            Console . WriteLine ( \"Factorial of 6 is\
    \ : {0}\", n.factorial(6) );\n            Console . WriteLine ( \"Factorial of\
    \ 7 is : {0}\" , n . factorial ( 7 ));\n            Console . ReadLine ();\n \
    \       }\n    }\n}\n```\n\n当上述代码编译并执行时，将产生以下结果：\nFactorial of 6 is: 720\nFactorial\
    \ of 7 is: 5040\nFactorial of 8 is: 40320\n\n## 向方法传递参数\n当调用带有参数的方法时，你需要传递参数。有三种方式可以将参数传递给方法：\n\
    \n| 序号 | 机制 | 描述 |\n| :--- | :--- | :--- |\n| 1 | 值参数 | 该方法将参数的实际值复制到函数的形式参数中。在这种情况下，函数内部对参数的更改对实际参数没有影响。\
    \ |\n| 2 | 引用参数 | 该方法将参数所在内存位置的引用复制到形式参数中。这意味着对参数的更改会影响实际参数。 |\n| 3 | 输出参数 | 该方法有助于返回多个值。\
    \ |\n\n## C# - 数组\n数组存储的是相同类型的固定大小的顺序元素集合。数组用于存储数据集合，但将数组认为是存储在连续内存位置的相同类型变量的集合通常更有用。\n\
    \n与其声明单独变量（如 `number0`、`number1` 和 `number99`），你不如声明一个名为 `numbers` 的数组变量，并使用 `numbers[0]`、`numbers[1]`\
    \ 和 `numbers[99]` 来表示单个变量。数组中的特定元素通过索引访问。所有数组都由连续的内存位置组成。最低地址对应第一个元素，最高地址对应最后一个元素。\n\
    \n### 声明数组\n在 C# 中声明数组，可以使用以下语法：\n`datatype[] arrayName;`\n其中，\n* `datatype` 用于指定数组中元素的类型。\n\
    * `[]` 指定数组的阶数（rank）。阶数指定数组的大小。\n* `arrayName` 指定数组的名称。\n\n例如 `double[] balance;`\n\
    \n### 初始化数组\n“声明数组不会在内存中初始化数组。当数组变量被初始化时，你可以为数组赋值。数组是引用类型，所以你需要使用 `new` 关键字来创建数组的实例。例如\
    \ `double[] balance = new double[10];`”\n\n### 为数组赋值\n你可以通过索引号给单个数组元素赋值，例如：\n\
    `double[] balance = new double[10];`\n`balance[0] = 450.0;`\n\n你可以在声明时给数组赋值，如所示：\n\
    `double[] balance = { 234.0, 452.69, 342.1 };`\n\n你还可以创建并初始化数组，所示：\n`int[] marks\
    \ = new int[5] { 99, 98, 92, 97, 95 };`\n\n你也可以省略数组的大小，所示：\n`int[] marks = new\
    \ int[] { 99, 98, 92, 97, 95 };`\n\n你可以将一个数组变量复制到另一个目标数组变量中。在这种情况下，目标和源都指向同一个内存位置：\n\
    `int[] marks = new int[] { 99, 98, 92, 97, 95 };`\n`int[] score = marks;`\n\n\
    当你创建一个数组时，C# 编译器会根据数组类型隐式将每个数组元素初始化为默认值。例如，对于 `int` 数组，所有元素都初始化为 0。\n\n### 访问数组元素\n\
    通过索引数组名称来访问元素。这是通过在名称后的方括号内放置元素的索引来实现的。例如 `double salary = balance[9];`\n\n下面的示例演示了上述声明、赋值和访问数组的概念：\n\
    \n```csharp\nusing System ;\nnamespace ArrayApplication {\n    class MyArray {\n\
    \        static void Main ( string [] args ) {\n            int [] n = new int\
    \ [ 10 ]; /* n is an array of 10 integers */\n            int i , j ;\n      \
    \      /* initialize elements of array n */\n            for ( i = 0 ; i < 10\
    \ ; i ++ ) {\n                n [ i ] = i + 100 ;\n            }\n           \
    \ /* output each array element */\n            for ( j = 0 ; j < 10 ; j ++ ) {\n\
    \                Console . WriteLine ( \"Element[{0}] = {1}\" , j , n [ j ]);\n\
    \            }\n            Console . ReadLine ();\n        }\n    }\n}\n```\n\
    \n当上述代码编译并执行时，将产生以下结果：\nElement[0] = 100\nElement[1] = 101\nElement[2] = 102\n\
    Element[3] = 103\nElement[4] = 104\nElement[5] = 105\nElement[6] = 106\nElement[7]\
    \ = 107\nElement[8] = 108\nElement[9] = 109\n\n### 使用 foreach 循环\n在上面的示例中，我们使用\
    \ for 循环访问每个数组元素。你也可以使用 `foreach` 语句遍历数组。\n\n```csharp\nusing System ;\nnamespace\
    \ ArrayApplication {\n    class MyArray {\n        static void Main ( string []\
    \ args ) {\n            int [] n = new int [ 10 ]; /* n is an array of 10 integers\
    \ */\n            int i , j ;\n            /* initialize elements of array n */\n\
    \            for ( i = 0 ; i < 10 ; i ++ ) {\n                n [ i ] = i + 100\
    \ ;\n            }\n            /* output each array element's value */\n    \
    \        foreach ( int j in n ) {\n                int i = j - 100 ;\n       \
    \         Console . WriteLine ( \"Element[{0}] = {1}\" , i , j );\n          \
    \  }\n            Console . ReadLine ();\n        }\n    }\n}\n```\n\n## C# 数组\n\
    对于 C# 程序员来说，应该明确以下几个与数组相关的重要概念：\n\n| 序号 | 概念 | 描述 |\n| :--- | :--- | :--- |\n\
    | 1 | 多维数组 | C# 支持多维数组。多维数组最简单的形式是二维数组。 |\n| 2 | 锯齿数组 | C# 支持多维数组，即数组的数组。 |\n\n"
- fmt: "\n### 3. Passing arrays to functions\nYou can pass to the function a pointer\
    \ to an array by specifying the array's name without an index.\n\n### 4. Param\
    \ arrays\nThis is used for passing unknown number of parameters to a function.\n\
    \n### 5. The Array Class\nDefined in `System` namespace, it is the base class\
    \ to all arrays, and provides various properties and methods for working with\
    \ arrays.\n\n#### Multidimensional arrays\nC# allows multidimensional arrays.\
    \ Multi-dimensional arrays are also called rectangular array. You can declare\
    \ a 2-dimensional array of strings as `-string [,] names;` or, a 3-dimensional\
    \ array of int variables as `-int [ , , ] m;`.\n\n##### Two-Dimensional Arrays\n\
    The simplest form of the multidimensional array is the 2-dimensional array. A\
    \ 2-dimensional array is a list of one-dimensional arrays. A 2-dimensional array\
    \ can be thought of as a table, which has `x` number of rows and `y` number of\
    \ columns. Following is a 2-dimensional array, which contains 3 rows and 4 columns:\n\
    ![Two Dimensional Arrays in C#](image4586.jpg)\n\nThus, every element in the array\
    \ `a` is identified by an element name of the form `a[ i , j ]`, where `a` is\
    \ the name of the array, and `i` and `j` are the subscripts that uniquely identify\
    \ each element in array `a`.\n\n###### Initializing Two-Dimensional Arrays\nMultidimensional\
    \ arrays may be initialized by specifying bracketed values for each row. The Following\
    \ array is with 3 rows and each row has 4 columns.\n```csharp\nint [,] a = new\
    \ int [ 3 , 4 ] {{ 0 , 1 , 2 , 3 } , /* initializers for row indexed by 0 */{\
    \ 4 , 5 , 6 , 7 } , /* initializers for row indexed by 1 */{ 8 , 9 , 10 , 11 }\
    \ /* initializers for row indexed by 2 */};\n```\n\n##### Accessing Two-Dimensional\
    \ Array Elements\nAn element in 2-dimensional array is accessed by using the subscripts.\
    \ That is, row index and column index of the array. For example:\n```csharp\n\
    int val = a [ 2 , 3 ];\n```\nThe above statement takes 4th element from the 3rd\
    \ row of the array. You can verify it in the above diagram. Let us check the program\
    \ to handle a two dimensional array:\n```csharp\nusing System ;\nnamespace ArrayApplication\
    \ {\n    class MyArray {\n        static void Main ( string [] args ) {\n    \
    \        /* an array with 5 rows and 2 columns*/\n            int [,] a = new\
    \ int [ 5 , 2 ] {{ 0 , 0 }, { 1 , 2 }, { 2 , 4 }, { 3 , 6 }, { 4 , 8 } };\n  \
    \          int i , j ;\n            /* output each array element's value */\n\
    \            for ( i = 0 ; i < 5 ; i ++) {\n                for ( j = 0 ; j <\
    \ 2 ; j ++) {\n                    Console . WriteLine ( \"a[{0},{1}] = {2}\"\
    \ , i , j , a [ i , j ]);\n                }\n            }\n            Console\
    \ . ReadKey ();\n        }\n    }\n}\n```\nWhen the above code is compiled and\
    \ executed, it produces the following result:\n`a[0,0]: 0`\n`a[0,1]: 0`\n`a[1,0]:\
    \ 1`\n`a[1,1]: 2`\n`a[2,0]: 2`\n`a[2,1]: 4`\n`a[3,0]: 3`\n`a[3,1]: 6`\n`a[4,0]:\
    \ 4`\n`a[4,1]: 8`\n\n##### Jagged array\nA Jagged array is an array of arrays.\
    \ You can declare a jagged array named `scores` of type `int` as `-int [][] scores;`.\n\
    \nDeclaring an array, does not create the array in memory. To create the above\
    \ array:\n```csharp\nint [][] scores = new int [ 5 ][];\nfor ( int i = 0 ; i <\
    \ scores . Length ; i ++) {\n    scores [ i ] = new int [ 4 ];\n}\n```\nYou can\
    \ initialize a jagged array as:\n```csharp\nint [][] scores = new int [ 2 ][]{\
    \ new int []{ 92 , 93 , 94 }, new int []{ 85 , 66 , 87 , 88 }};\n```\nWhere, `scores`\
    \ is an array of two arrays of integers - `scores[0]` is an array of 3 integers\
    \ and `scores[1]` is an array of 4 integers.\n\n###### Example\nThe following\
    \ example illustrates using a jagged array:\n```csharp\nusing System ;\nnamespace\
    \ ArrayApplication {\n    class MyArray {\n        static void Main ( string []\
    \ args ) {\n            /* a jagged array of 5 array of integers*/\n         \
    \   int [][] a = new int [][]{ new int []{ 0 , 0 }, new int []{ 1 , 2 },new int\
    \ []{ 2 , 4 }, new int []{ 3 , 6 }, new int []{ 4 , 8 } };\n            int i\
    \ , j ;\n            /* output each array element's value */\n            for\
    \ ( i = 0 ; i < 5 ; i ++) {\n                for ( j = 0 ; j < 2 ; j ++) {\n \
    \                   Console . WriteLine ( \"a[{0}][{1}] = {2}\" , i , j , a [\
    \ i ][ j ]);\n                }\n            }\n            Console . ReadKey\
    \ ();\n        }\n    }\n}\n```\nWhen the above code is compiled and executed,\
    \ it produces the following result:\n`a[0][0]: 0`\n`a[0][1]: 0`\n`a[1][0]: 1`\n\
    `a[1][1]: 2`\n`a[2][0]: 2`\n`a[2][1]: 4`\n`a[3][0]: 3`\n`a[3][1]: 6`\n`a[4][0]:\
    \ 4`\n`a[4][1]: 8`\n\n### Passing Arrays as Function Arguments\nYou can pass an\
    \ array as function argument. The following example demonstrates this:\n```csharp\n\
    using System ;\nnamespace ArrayApplication {\n    class MyArray {\n        double\
    \ getAverage ( int [] arr , int size ) {\n            int sum = 0;\n         \
    \   for ( i = 0 ; i < size ; i ) {\n                sum += arr[ i ];\n       \
    \     }\n            return ( double ) sum / size;\n        }\n        static\
    \ void Main ( string [] args ) {\n            MyArray app = new MyArray();\n \
    \           int [] balance = new int [] { 0, 2, 4, 6, 8 };\n            double\
    \ avg = app.getAverage ( balance , 5 );\n            Console . WriteLine ( \"\
    Average is: {0}\" , avg );\n            Console . ReadKey ();\n        }\n   \
    \ }\n}\n```\nWhen the above code is compiled and executed, it produces the following\
    \ result:\n`Average is: 2`\n\n### Param arrays\nAt times, while declaring a method,\
    \ you are not sure of the number of arguments The following example demonstrates\
    \ this:\n```csharp\nusing System ;\nnamespace ArrayApplication {\n    class MyArray\
    \ {\n        int AddElements ( params int [] arr ) {\n            int sum = 0;\n\
    \            foreach ( int i in arr ) {\n                sum += i;\n         \
    \   }\n            return sum;\n        }\n        static void Main ( string []\
    \ args ) {\n            MyArray app = new MyArray();\n            int sum = app.AddElements\
    \ ( 1, 2, 3, 4, 5 );\n            Console . WriteLine ( \"sum is: {0}\" , sum\
    \ );\n            Console . ReadKey ();\n        }\n    }\n}\n```\n\n### The Array\
    \ Class\nDefined in `System` namespace, it is the base class to all arrays, and\
    \ provides various properties and methods for working with arrays.\n\n#### Properties\
    \ of the Array\nThe following table describes some of the most used properties:\n\
    | Sr.No. | Property | Description |\n| :--- | :--- | :--- |\n| 1 | FixedSize |\
    \ Gets a value indicating whether the Array has a fixed size. |\n| 2 | IsReadOnly\
    \ | Gets a value indicating whether the Array is read-only. |\n| 3 | Length |\
    \ Gets a 32-bit integer that represents the total number of elements in all the\
    \ dimensions. |\n| 4 | LongLength | Gets a 64-bit integer that represents the\
    \ total number of elements in all the dimensions. |\n| 5 | Rank | Gets the rank\
    \ (number of dimensions) of the Array. |\n\n#### Methods of the Array Class\n\
    The following table describes some of the most used methods:\n| Sr.No. | Method\
    \ | Description |\n| :--- | :--- | :--- |\n| 1 | Clear | Sets a range of elements\
    \ in the Array to zero, false, or null. |\n| 2 | Copy(Array, Array, Int32) | Copies\
    \ a range of elements from one Array to another. |\n| 3 | CopyTo(Array, Int32)\
    \ | Copies all elements of the current array to a specified array. |\n| 4 | GetLength\
    \ | Gets the number of elements in the specified dimension. |\n| 5 | GetLongLength\
    \ | Gets the number of elements in the specified dimension (64-bit). |\n| 6 |\
    \ GetLowerBound | Gets the lower bound of the specified dimension. |\n| 7 | GetValue(Int32)\
    \ | Gets the value at the specified position. |\n| 8 | IndexOf(Array, Object)\
    \ | Searches for an object and returns the first occurrence index. |\n| 9 | Reverse(Array)\
    \ | Reverses the sequence of the elements. |\n| 10 | SetValue(Object, Int32) |\
    \ Sets a value at the specified position. |\n"
