  trans: "\n\n* 它是一种现代的、通用编程语言\n* 它是面向对象的。\n* 它是面向组件的。\n* 它很容易学习。\n* 它是一门结构化语言。\n\
    * 它能生成高效程序。\n* 可以在多种计算机平台上编译。\n* 它是 `.Net Framework` 的一部分。\n\n# C# 的强大编程特性\n尽管\
    \ `C#` 的构造紧密遵循传统的高级语言（`C` 和 `C++`），并且作为一种面向对象的编程语言，它与 `Java` 有许多相似之处，但它具有许多强大的编程特性，使其深受全球程序员的喜爱。以下是\
    \ `C#` 的一些特性列表——\n\n* 布尔条件\n* 自动垃圾收集\n* 标准库\n* 程序集版本控制\n* 属性和事件\n* 委托和事件管理\n*\
    \ 易用的泛型\n* 索引器\n* 条件编译\n* 简单的多线程支持\n* LINQ 和 Lambda 表达式\n* 与 Windows 的集成\n\n#\
    \ C# 环境\n\n## .Net Framework\n`.Net framework` 是一个革命性的平台，可以帮助你编写以下类型的应用程序——\n\n\
    * Windows 应用程序\n* Web 应用程序\n* Web 服务\n\n`.Net framework` 应用程序是多平台的应用程序。该框架的设计使其可以使用任何以下语言：`C#`、`C++`、`Visual\
    \ Basic`、`Jscript`、`COBOL` 等。所有这些语言都可以访问该框架并相互通信。`.Net framework` 由一个供如 `C#` 等客户端语言使用的巨大代码库组成。以下是\
    \ `.Net framework` 的某些组件——\n\n* 通用运行时 (`CLR`)\n* .Net Framework 类库\n* 通用语言规范 (CLS)\n\
    * 通用类型系统 (CTS)\n* 元数据和程序集\n* Windows Forms\n* ASP.Net 和 ASP.Net AJAX\n* ADO.Net\n\
    * Windows Workflow Foundation (WF)\n* Windows Presentation Foundation\n* Windows\
    \ Communication Foundation (WCF)\n* LINQ\n\n## C# 的集成开发环境 (IDE)\n微软为 `C#` 编程提供了以下开发工具——\n\
    \n* Visual Studio 2019 (VS)\n* Visual C# 2019 快捷版 (VCE)\n* Visual Web Developer\n\
    \n后两个工具可以在微软官方网站免费获取。使用这些工具，你可以编写各种 `C#` 程序，从简单的命令行应用程序到更复杂的应用程序。你也可以使用基础文本编辑器（如\
    \ `Notepad`）编写 `C#` 源文件，并使用命令行编译器将代码编译为程序集，这也是 `.NET Framework` 的一部分。`Visual C#\
    \ Express` 和 `Visual Web Developer Express` 版是 `Visual Studio` 的精简版，外观相同。它们保留了\
    \ `Visual Studio` 的大部分功能。你可以从 [Microsoft Visual Studio](https://www.microsoft.com/visualstudio/eng/downloads)\
    \ 下载。它会自动安装在你的机器上。注意：安装快捷版需要活跃的互联网连接。\n\n# 在 Linux 或 Mac OS 上编写 C# 程序\n尽管 `.NET\
    \ Framework` 运行在 Windows 操作系统上，但也有可以在其他操作系统上的替代版本。`Mono` 是 `.Net Framework` 的开源版本，包含\
    \ `C#` 编译器，并运行在多个操作系统上，包括各种版本的 `Linux` 和 `Mac OS`。请查看 [Go Mono](http://www.go-mono.com/mono-downloads/download.html)。`Mono`\
    \ 的目的不仅是为了跨平台运行微软 `.NET` 应用程序，还为了为 `Linux` 开发者带来更好的开发工具。`Mono` 可以运行在许多操作系统上，包括\
    \ `Android`、`BSD`、`iOS`、`Linux`、`OS X`、`Windows`、`Solaris` 和 `UNIX`。\n\n# C# 程序结构\n\
    在学习 `C#` 编程语言的基础构建块之前，让我们来看简单的 `C#` 程序结构，以便在后续章节中参考。\n\n## 创建 Hello World 程序\n\
    一个 `C#` 程序由以下部分组成：\n\n* 命名空间声明\n* 类\n* 类方法\n* 类属性\n* Main 方法\n* 语句和表达式\n* 注释\n\
    \n让我们来看打印“Hello World”的简单代码：\n\n```\nusing System;\nnamespace HelloWorldApplication\
    \ {\n    class HelloWorld {\n        static void Main ( string [] args ) {\n \
    \           /* 我的第一个 C# 程序 */\n            Console.WriteLine(\"Hello World\");\n\
    \            Console.ReadKey();\n        }\n    }\n}\n```\n\n当这段代码被编译并执行时，它会产生以下结果：Hello\
    \ World\n\n让我们来看给定程序的各个部分：\n\n* 程序的的第一行 `using System;` —— `using` 关键字用于在程序包含\
    \ `System` 命名空间。程序通常有多个 `using` 语句。\n* 下一行是命名空间声明。`namespace` 是类的集合。`HelloWorldApplication`\
    \ 命名空间包含类 `HelloWorld`。\n* 下一行是 `class` 声明，`HelloWorld` 类包含了你的程序所使用的数据和方法定义。类通常包含多个方法。方法定义了类的行为。然而，`HelloWorld`\
    \ 类只有一个方法 `Main`。\n* 下一行定义了 `Main` 方法，它是所有 `C#` 程序的入口点。`Main` 方法说明了类在执行时执行的操作。\n\
    * 下一行 `/*...*/` 被编译器忽略，用于添加注释。\n* `Main` 方法通过语句 `Console.WriteLine(\"Hello World\"\
    );` 指定了它的行为。`WriteLine` 是定义在 `System` 命名空间中的 `Console` 类的一个方法。该语句会导致屏幕上显示消息“Hello\
    \ World!”。\n* 最后一行 `Console.ReadKey();` 是给 VS.NET 用户使用的。这会让程序等待按键，并防止程序在从 Visual\
    \ Studio 启动时屏幕直接运行并关闭。\n\n值得注意以下几点：\n\n* `C#` 是大小敏感的。\n* 所有语句和表达式必须以分号 (`;`) 结束。\n\
    * 程序执行从 `Main` 方法开始。\n* 与 `Java` 不同，文件名可以与类名不同。\n\n# 编译和执行程序\n如果你使用 `Visual.Net`\
    \ 来编译和执行 `C#` 程序，请采取以下步骤：\n\n* 启动 `Visual Studio`。\n* 在菜单栏上，选择 `File -> New ->\
    \ Project`。\n* 从模板中选择 `Visual C#`，然后选择 `Windows`。\n* 选择 `Console Application`。\n\
    * 为你的项目指定名称并点击 OK 按钮。\n* 这将在解决方案管理器（Solution Explorer）中创建一个新项目。\n* 在编辑器中编写代码。\n\
    * 点击 `Run` 按钮或按 `F5` 键执行项目。会出现包含 Hello World 行的命令提示符窗口。\n\n你可以使用命令行而不是 `Visual\
    \ Studio IDE` 来编译 `C#` 程序：\n\n* 打开文本编辑器并添加上述代码。\n* 将文件保存为 `helloworld.cs`。\n*\
    \ 打开命令行提示符工具并进入保存文件的目录。\n* 输入 `csc helloworld.cs` 并按回车编译你的代码。\n* 如果代码中没有错误，命令行提示符将带你下一行并生成\
    \ `helloworld.exe` 可执行文件。\n* 输入 `helloworld` 执行你的程序。\n* 你可以看到屏幕上打印的 Hello World。\n\
    \n"
- fmt: "\n# C# - Basic Syntax\n\n`C#` is an object-oriented programming language.\
    \ In Object-Oriented Programming methodology, a program consists of various objects\
    \ that interact with each other by means of actions. The actions that an object\
    \ may take are called methods. Objects of the same kind are said to have the same\
    \ type or, are said to be in the same class.\n\nFor example, let us consider a\
    \ `Rectangle` object. It has attributes such as `length` and `width`. Depending\
    \ upon the design, it may need ways for accepting the values of these attributes,\
    \ calculating the area, and displaying details. Let us look at implementation\
    \ of a `Rectangle` class and discuss `C#` basic syntax:\n\n```csharp\nusing System\
    \ ;\nnamespace RectangleApplication {\nclass Rectangle {\n    // member variables\n\
    \    double length ;\n    double width ;\n    public void Acceptdetails () {\n\
    \        length = 4.5 ;\n        width = 3.5 ;\n    }\n    public double GetArea\
    \ () {\n        return length * width ;\n    }\n    public void Display () {\n\
    \        Console . WriteLine ( \"Length: {0}\" , length );\n        Console .\
    \ WriteLine ( \"Width: {0}\" , width );\n        Console . WriteLine ( \"Area:\
    \ {0}\" , GetArea ());\n    }\n}\nclass ExecuteRectangle {\n    static void Main\
    \ ( string [] args ) {\n        Rectangle r = new Rectangle ();\n        r . Acceptdetails\
    \ ();\n        r . Display ();\n        Console . ReadLine ();\n    }\n}\n```\n\
    \nWhen the above code is compiled and executed, it produces the following result\
    \ −:\nLength: 4.5\nWidth: 3.5\nArea: 15.75\n\n## The using Keyword\n\nThe first\
    \ statement in any `C#` program is `using System;`. The `using` keyword is used\
    \ for including the namespaces in the program. A program can include multiple\
    \ `using` statements.\n\n## Comments in C#\n\nComments are used for explaining\
    \ code. Compilers ignore the comment entries. The multiline comments in `C#` programs\
    \ start with `/*` and terminates with the characters `*/` as shown below:\n\n\
    ```csharp\n/* This program demonstrates\nThe basic syntax of C# programming\n\
    Language */\n```\n\nSingle-line comments are indicated by the `//` symbol. For\
    \ example:\n\n```csharp\n} //end class Rectangle\n```\n\n## Member Variables\n\
    \nVariables are attributes or data members of a class, used for storing data.\
    \ In the preceding program, the `Rectangle` class has two member variables named\
    \ `length` and `width`.\n\n## Member Functions\n\nFunctions are set of statements\
    \ that perform a specific task. The member functions of a class are declared within\
    \ the class. Our sample class `Rectangle` contains three member functions: `AcceptDetails`,\
    \ `GetArea` and `Display`.\n\n## Instantiating a Class\n\nIn the preceding program,\
    \ the class `ExecuteRectangle` contains the `Main()` method and instantiates the\
    \ `Rectangle` class.\n\n## Identifiers\n\nAn identifier is a name used to identify\
    \ a class, variable, function, or any other user-defined item. The basic rules\
    \ for naming classes in `C#` are as follows:\n\n- A name must begin with a letter\
    \ that could be followed by a sequence of letters, digits (0 - 9) or underscore.\
    \ The first character in an identifier cannot be a digit.\n- It must not contain\
    \ any embedded space or symbol such as `? - + ! @ # % ^ & * ( ) [ ] { } . ; :\
    \ \" ' /` and `\\`. However, an underscore (`_`) can be used.\n- It should not\
    \ be a `C#` keyword.\n\n## C# Keywords\n\nKeywords are reserved words predefined\
    \ to the `C#` compiler. These keywords cannot be used as identifiers. However,\
    \ if you want to use these keywords as identifiers, you may prefix the keyword\
    \ with the `@` character. In `C#`, some identifiers have special meaning in context\
    \ of code, such as `get` and `set` are called contextual keywords.\n\nThe following\
    \ table lists the reserved keywords and contextual keywords in `C#`:\n\n| Reserved\
    \ Keywords | | | | | | |\n| :--- | :--- | :--- | :--- | :--- | :--- | :--- |\n\
    | `abstract` | `as` | `base` | `bool` | `break` | `byte` | `case` |\n| `catch`\
    \ | `char` | `checked` | `class` | `const` | `continue` | `decimal` |\n| `default`\
    \ | `delegate` | `do` | `double` | `else` | `enum` | `event` |\n| `explicit` |\
    \ `extern` | `false` | `finally` | `fixed` | `float` | `for` |\n| `foreach` |\
    \ `goto` | `if` | `implicit` | `in` | `in (generic modifier)` | `int` |\n| `interface`\
    \ | `internal` | `is` | `lock` | `long` | `namespace` | `new` |\n| `null` | `object`\
    \ | `operator` | `out` | `out (generic modifier)` | `override` | `params` |\n\
    | `private` | `protected` | `public` | `readonly` | `ref` | `return` | `sbyte`\
    \ |\n| `sealed` | `short` | `sizeof` | `stackalloc` | `static` | `string` | `struct`\
    \ |\n| `switch` | `this` | `throw` | `true` | `try` | `typeof` | `uint` |\n| `ulong`\
    \ | `unchecked` | `unsafe` | `ushort` | `using` | `virtual` | `void` |\n| `volatile`\
    \ | `while` | | | | | |\n\n| Contextual Keywords | | | | | | | |\n| :--- | :---\
    \ | :--- | :--- | :--- | :--- | :--- |\n| `add` | `alias` | `ascending` | `descending`\
    \ | `dynamic` | `from` | `get` |\n| `global` | `group` | `into` | `join` | `let`\
    \ | `orderby` | `partial (type)` |\n| `partial (method)` | `remove` | `select`\
    \ | `set` | | | |\n\n# C# - Data Types\n\nThe variables in `C#` are categorized\
    \ into the following types:\n\n- Value types\n- Reference types\n- Pointer types\n\
    \n## Value Type\n\nValue type variables can be assigned a value directly. They\
    \ are derived from the class `System.ValueType`. The value types directly contain\
    \ data. Some examples are `int`, `char`, and `float`, which stores numbers, alphabets,\
    \ and floating point numbers, respectively. When you declare an `int` type, the\
    \ system allocates memory to store the value.\n\nThe following table lists the\
    \ available value types in `C#` 2019:\n\n| Type | Represents | Range | Default\
    \ Value |\n| :--- | :--- | :--- | :--- |\n| `bool` | Boolean value | True or False\
    \ | False |\n| `byte` | 8-bit unsigned integer | 0 to 255 | 0 |\n| `char` | 16-bit\
    \ Unicode character | U+0000 to U+ffff | `'\\0'` |\n| `decimal` | 128-bit precise\
    \ decimal values with 28-29 significant digits | (-7.9 x 10 28 to 7.9 x 10 28)\
    \ / 10 0 to 28 | 0.0M |\n| `double` | 64-bit double-precision floating point type\
    \ | (+/-)5.0 x 10 -324 to (+/-)1.7 x 10 308 | 0.0D |\n| `float` | 32-bit single-precision\
    \ floating point type | -3.4 x 10 38 to + 3.4 x 10 38 | 0.0F |\n| `int` | 32-bit\
    \ signed integer type | -2,147,483,648 to 2,147,483,647 | 0 |\n| `long` | 64-bit\
    \ signed integer type | -9,223,372,036,854,775,808 to 9,223,372,036,854,775,807\
    \ | 0L |\n| `sbyte` | 8-bit signed integer type | -128 to 127 | 0 |\n| `short`\
    \ | 16-bit signed integer type | -32,768 to 32,767 | 0 |\n| `uint` | 32-bit unsigned\
    \ integer type | 0 to 4,294,967,295 | 0 |\n| `ulong` | 64-bit unsigned integer\
    \ type | 0 to 18,446,744,073,709,551,615 | 0 |\n| `ushort` | 16-bit unsigned integer\
    \ type | 0 to 65,535 | 0 |\n"
