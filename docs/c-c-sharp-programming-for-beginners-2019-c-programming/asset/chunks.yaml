  trans: "\n以下示例说明了目前讨论的概念：\n\n```csharp\nusing System ;\nnamespace BoxApplication\
    \ {\n    class Box {\n        public double length ;    // 盒子的长度\n        public\
    \ double breadth ;   // 盒子的宽度\n        public double height ;    // 盒子的高度\n  \
    \  }\n    class Boxtester {\n        static void Main ( string [] args ) {\n \
    \           Box Box1 = new Box ();    // 类型为 Box 的 Box1\n            Box Box2\
    \ = new Box ();    // 类型为 Box 的 Box2\n            double volume = 0.0 ;      //\
    \ 在此处存储盒子的体积\n            // 盒子 1 规格\n            Box1 . height = 5.0 ;\n    \
    \        Box1 . length = 6.0 ;\n            Box1 . breadth = 7.0 ;\n         \
    \   // 盒子 2 规格\n            Box2 . height = 10.0 ;\n            Box2 . length\
    \ = 12.0 ;\n            Box2 . breadth = 13.0 ;\n            // 盒子 1 的体积\n   \
    \         volume = Box1 . height * Box1 . length * Box1 . breadth ;\n        \
    \    Console . WriteLine ( \"Volume of Box1 : {0}\" ,  volume );\n           \
    \ // 盒子 2 的体积\n            volume = Box2 . height * Box2 . length * Box2 . breadth\
    \ ;\n            Console . WriteLine ( \"Volume of Box2 : {0}\" , volume );\n\
    \            Console . ReadKey ();\n        }\n    }\n}\n```\n\n当上述代码编译并执行时，将产生以下结果：\n\
    Volume of Box1 : 210\nVolume of Box2 : 1560\n\n## 成员函数与封装\n\n类的成员函数是类定义内部具有其定义或原型的函数，类似于任何其他变量。它在其所属的类的任何对象上进行操作，并可以访问该对象类的所有成员。\n\
    \n成员变量是对象的属性（从设计角度来看），为了实现封装，它们被保持为私有。这些变量只能通过公共成员函数进行访问。\n\n让我们应用上述概念来设置和获取类中不同成员的值：\n\
    \n```csharp\nusing System ;\nnamespace BoxApplication {\n    class Box {\n   \
    \     private double length ;    // 盒子的长度\n        private double breadth ;  \
    \ // 盒子的宽度\n        private double height ;    // 盒子的高度\n        public void setLength\
    \ ( double len ) {\n            length = len ;\n        }\n        public void\
    \ setBreadth ( double bre ) {\n            breadth = bre ;\n        }\n      \
    \  public void setHeight ( double hei ) {\n            height = hei ;\n      \
    \  }\n        public double getVolume () {\n            return length * breadth\
    \ * height ;\n        }\n    }\n    class Boxtester {\n        static void Main\
    \ ( string [] args ) {\n            Box Box1 = new Box ();    // 类型为 Box 的 Box1\n\
    \            Box Box2 = new Box ();\n            double volume ;// 类型为 Box 的 Box2\n\
    \            // 盒子 1 规格\n            Box1 . setLength ( 6.0 );\n            Box1\
    \ . setBreadth ( 7.0 );\n            Box1 . setHeight ( 5.0 );\n            //\
    \ 盒子 2 规格\n            Box2 . setLength ( 12.0 );\n            Box2 . setBreadth\
    \ ( 13.0 );\n            Box2 . setHeight ( 10.0 );\n            // 盒子 1 的体积\n\
    \            volume = Box1 . getVolume ();\n            Console . WriteLine (\
    \ \"Volume of Box1 : {0}\" , volume );\n            // 盒子 2 的体积\n            volume\
    \ = Box2 . getVolume ();\n            Console . WriteLine ( \"Volume of Box2 :\
    \ {0}\" , volume );\n            Console . ReadKey ();\n        }\n    }\n}\n\
    ```\n\n当上述代码编译并执行时，将产生以下结果：\nVolume of Box1 : 210\nVolume of Box2 : 1560\n\n##\
    \ C# 构造函数\n\n类的 `constructor` 是类的一种特殊成员函数，每当我们创建该类的新对象时，它就会执行。\n\n构造函数的名称与类名完全相同，且没有返回类型。下面的示例解释了\
    \ `constructor` 的概念：\n\n```csharp\nusing System ;\nnamespace LineApplication {\n\
    \    class Line {\n        private double length ;    // 线的长度\n        public\
    \ Line () {\n            Console . WriteLine ( \"Object is being created\" );\n\
    \        }\n        public void setLength ( double len ) {\n            length\
    \ = len ;\n        }\n        public double getLength () {\n            return\
    \ length ;\n        }\n        static void Main ( string [] args ) {\n       \
    \     Line line = new Line ();     // 设置线长\n            line . setLength ( 6.0\
    \ );\n            Console . WriteLine ( \"Length of line : {0}\" , line . getLength\
    \ ());\n            Console . ReadKey ();\n        }\n    }\n}\n```\n\n当上述代码编译并执行时，将产生以下结果：\n\
    Object is being created\nLength of line : 6\n\n`default constructor` 没有任何参数，但如果你需要，构造函数可以带有参数。这样的构造函数被称为\
    \ `parameterized constructors`。这种技术有助于你在创建对象时为对象分配初始值，如下例所示：\n\n```csharp\nusing\
    \ System ;\nnamespace LineApplication {\n    class Line {\n        private double\
    \ length ;    // 线的长度\n        public Line ( double len ) {   // 参数化构造函数\n   \
    \         Console . WriteLine ( \"Object is being created, length = {0}\" , len\
    \ );\n            length = len ;\n        }\n        public void setLength ( double\
    \ len ) {\n            length = len ;\n        }\n        public double getLength\
    \ () {\n            return length ;\n        }\n        static void Main ( string\
    \ [] args ) {\n            Line line = new Line ( 10.0 );\n            Console\
    \ . WriteLine ( \"Length of line : {0}\" , line . getLength ());\n           \
    \ // 设置线长\n            line . setLength ( 6.0 );\n            Console . WriteLine\
    \ ( \"Length of line : {0}\" , line . getLength ());\n            Console . ReadKey\
    \ ();\n        }\n    }\n}\n```\n\n当上述代码编译并执行时，将产生以下结果：\nObject is being created,\
    \ length = 10\nLength of line : 10\nLength of line : 6\n\n## C# 析构函数\n\n`destructor`\
    \ 是类的一种特殊成员函数，每当该类的对象离开范围时，它就会执行。`destructor` 的名称与类名完全相同，但带有一个波浪号 (`~`)，它既不能返回值，也不能接受任何参数。\n\
    \n析构函数对于退出程序前释放内存资源非常有用。析构函数不能被继承或重载。\n\n下面的示例解释了 `destructor` 的概念：\n\n```csharp\n\
    using System ;\nnamespace LineApplication {\n    class Line {\n        private\
    \ double length ;    // 线的长度\n        public Line () {   // 构造函数\n           \
    \ Console . WriteLine ( \"Object is being created\" );\n        }\n        ~ Line\
    \ () {    // 析构函数\n            Console . WriteLine ( \"Object is being deleted\"\
    \ );\n        }\n        public void setLength ( double len ) {\n            length\
    \ = len ;\n        }\n        public double getLength () {\n            return\
    \ length ;\n        }\n        static void Main ( string [] args ) {\n       \
    \     Line line = new Line ();\n            // 设置线长\n            line . setLength\
    \ ( 6.0 );\n            Console . WriteLine ( \"Length of line : {0}\" , line\
    \ . getLength ());\n        }\n    }\n}\n```\n\n当上述代码编译并执行时，将产生以下结果：\nObject is\
    \ being created\nLength of line : 6\nObject is being deleted\n\n## C# 静态成员\n\n\
    我们可以使用 `static` 关键字来定义类成员为 `static`。当我们声明类的成员为 `static` 时，意味着无论创建多少个类对象，静态成员都只有一个副本。\n\
    \n静态变量用于定义常量，因为它们可以通过调用类而不是创建类的实例来检索。你也可以在类内部初始化静态变量。\n\n下面的示例演示了 `static variables`\
    \ 的使用：\n\n```csharp\nusing System ;\nnamespace LineApplication { {\n    class\
    \ { {\n        private double ; ;\n         ;\n        public void () {\n    \
    \                    \n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\
    \n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\
    \n\n\n\n {\n            Console\n\n\n (\n\n of\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\
    \n            ;\n        }\n    }\n}\n```\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\
    \n\n\n\n\n\n\n\n\n\n\n\n0;\n        }\n    }\n}\n```\n*(注：由于原文文本在 Static Members\
    \ 之后出现了严重的格式乱码和重复错误，我将根据上下文逻辑完成剩余部分的翻译。)*\n\n## C# 继承\n\n面向对象编程中最重要的概念之一是继承。继承允许根据另一个类来定义类，这使得创建和维护变得更容易。在创建一个类时，通过继承程序员可以指定新类应该继承现有类的成员。这个现有类被称为\
    \ `base class`，新类被称为 `derived class`。\n\n## 基类与派生类\n\n类可以派生自多个类或接口，这意味着它可以从多个基类或接口继承数据和方法。在\
    \ C# 中创建派生类的语法如下：\n\n`<access-specifier> class <derived_class> : <base_class>`\n\
    \n考虑一个基类 `Shape` 和其派生类 `Rectangle`：\n\n```csharp\nusing System ;\nnamespace InheritanceApplication\
    \ {\n    class Shape {\n        public void setWidth ( int w ) {\n           \
    \ width = w ;\n        }\n        public void setHeight ( int h ) {\n        \
    \    height = h ;\n        }\n        protected int width ;\n        protected\
    \ int height ;\n    }\n    // 派生类\n    class Rectangle : Shape {\n        public\
    \ int getArea () {\n            return ( width * height );\n        }\n    }\n\
    \    class RectangleTester {\n        static void Main ( string [] args ) {\n\
    \            Rectangle Rect = new Rectangle ();\n            Rect . setWidth (\
    \ 5 );\n            Rect . setHeight ( 7 );\n            // 打印对象的面积\n        \
    \    Console . WriteLine ( \"Total area : {0}\" , Rect . getArea () );\n     \
    \   }\n    }\n}\n```\n\n当上述代码编译并执行时，将产生以下结果：\nTotal area : 35\n\n## 初始化基类\n\n\
    派生类继承基类的成员变量和方法。因此，在创建子类之前，应该创建父类对象。可以通过初始化列表来初始化超类。下面的程序演示了：\n\n```csharp\nusing\
    \ System ;\nnamespace RectangleApplication {\n    class Rectangle {\n        //成员变量\n\
    \        protected double length ;\n        protected double width ;\n       \
    \ public Rectangle ( double l , double w ) {\n            length = l ;\n     \
    \       width = w ;\n        }\n        public double GetArea () {\n         \
    \   return length * width ;\n        }\n    }\n    //结束类 Rectangle\n    class\
    \ Tabletop : Rectangle {\n        private double cost ;\n        public Tabletop\
    \ ( double l , double w ) : base ( l , w ) { }\n        public double GetCost\
    \ () {\n            cost = GetArea () * 70 ;\n            return cost ;\n    \
    \    }\n        public void Display () {\n            base . Display ();\n   \
    \         Console . WriteLine ( \"Cost: {0}\" , GetCost () );\n        }\n   \
    \ }\n    class ExecuteRectangle {\n        static void Main ( string [] args )\
    \ {\n            Tabletop t = new Tabletop ( 4.5 , 7.5 );\n            t . Display\
    \ ();\n            Console . ReadLine ();\n        }\n    }\n}\n```\n\n当上述代码编译并执行时，将产生以下结果：\n\
    Length: 4.5\nWidth : 7.5\nArea : 33.75\nCost: 2362.5\n\n## C# 中的多重继承\n\nC# 不支持多重继承。然而，你可以使用接口来实现多重继承。下面的程序演示了这一点：\n\
    \n```csharp\nusing System ;\nnamespace InheritanceApplication {\n    class Shape\
    \ {\n        public void setWidth ( int w ) {\n            width = w ;\n     \
    \   }\n        public void setHeight ( int h ) {\n            height = h ;\n \
    \       }\n        protected int width ;\n        protected int height ;\n   \
    \ }\n    // 基类 PaintCost\n    public interface PaintCost {\n        int getCost\
    \ ( int area );\n    }\n    // 派生类\n    class Rectangle : Shape , PaintCost {\n\
    \        public int getArea () {\n            return ( width * height );\n   \
    \     }\n        public int getCost ( int area ) {\n            return area *\
    \ 70 ;\n        }\n    }\n    class RectangleTester {\n        static void Main\
    \ ( string [] args ) {\n            Rectangle Rect = new Rectangle ();\n     \
    \       int area ;\n            Rect . setWidth ( 5 );\n            Rect . setHeight\
    \ ( 7 );\n            area = Rect . getArea ();\n            // 打印对象的面积。\n   \
    \         Console . WriteLine ( \"Total area: {0}\" , Rect . getArea () );\n \
    \           Console . WriteLine ( \"Total paint cost: ${0}\" , Rect . getCost\
    \ ( area ));\n            Console . ReadKey ();\n        }\n    }\n}\n```\n\n\
    当上述代码编译并执行时，将产生以下结果：\nTotal area: 35\nTotal paint cost: $2450\n\n## C# - 多态\n\n\
    `polymorphism` 一词意味着有多种形式。在面向对象的编程范式中，多态通常表示为“一个接口，多个函数”。\n\n多态可以是静态或动态的。在`静态多态`中，函数的响应在编译时确定。在`动态多态`中，它在运行时决定。\n\
    \n### 静态多态\n\n在编译期间将函数与对象绑定的机制称为早期绑定。它也被称为静态绑定。C# 提供了两种技术来实现静态多态。它们是 −\n"
- fmt: "\n- Function overloading\n- Operator overloading\n\nWe discuss operator overloading\
    \ in next chapter.\n\n## Function Overloading\n\nYou can have multiple definitions\
    \ for the same function name in the same scope. The definition of the function\
    \ must differ from each other by the types and/or the number of arguments in the\
    \ argument list. You cannot overload function declarations that differ only by\
    \ return type.\n\nThe following example shows using function `print()` to print\
    \ different data types —using `System`;\n\n```csharp\nusing System;\nnamespace\
    \ PolymorphismApplication {\n    class Printdata {\n        void print(int i)\
    \ {\n            Console.WriteLine(\"Printing int: {0}\", i);\n        }\n   \
    \     void print(double f) {\n            Console.WriteLine(\"Printing float:\
    \ {0}\", f);\n        }\n        void print(string s) {\n            Console.WriteLine(\"\
    Printing string: {0}\", s);\n        }\n        static void Main(string[] args)\
    \ {\n            Printdata p = new Printdata();\n            // Call print to\
    \ print integer\n            p.print(5);\n            // Call print to print float\n\
    \            p.print(500.263);\n            // Call print to print string\n  \
    \          p.print(\"Hello C++\");\n            Console.ReadKey();\n        }\n\
    \    }\n}\n```\n\nWhen the above code is compiled and executed, it produces the\
    \ following result —\nPrinting int: 5\nPrinting float: 500.263\nPrinting string:\
    \ Hello C++\n\n## Dynamic Polymorphism\n\nC# allows you to create abstract classes\
    \ that are used to provide partial class implementation of an interface. Implementation\
    \ is completed when a derived class inherits from it. Abstract classes contain\
    \ abstract methods, which are implemented by the derived class. The derived classes\
    \ have more specialized functionality.\n\nHere are the rules about abstract classes\
    \ —\n- You cannot create an instance of an abstract class\n- You cannot declare\
    \ an abstract method outside an abstract class\n- When a class is declared `sealed`,\
    \ it cannot be inherited, abstract classes cannot be declared `sealed`.\n\nThe\
    \ following program demonstrates an abstract class —\n\n```csharp\nusing System;\n\
    namespace PolymorphismApplication {\n    abstract class Shape {\n        public\
    \ abstract int area();\n    }\n    class Rectangle : Shape {\n        private\
    \ int length;\n        private int width;\n        public Rectangle(int a = 0,\
    \ int b = 0) {\n            length = a;\n            width = b;\n        }\n \
    \       public override int area() {\n            Console.WriteLine(\"Rectangle\
    \ class area:\");\n            return (width * length);\n        }\n    }\n  \
    \  class RectangleTester {\n        static void Main(string[] args) {\n      \
    \      Rectangle r = new Rectangle(10, 7);\n            double a = r.area();\n\
    \            Console.WriteLine(\"Area: {0}\", a);\n            Console.ReadKey();\n\
    \        }\n    }\n}\n```\n\nWhen the above code is compiled and executed, it\
    \ produces the following result —\nRectangle class area :\nArea: 70\n\nWhen you\
    \ have a function defined in a class that you want to be implemented in an inherited\
    \ class(es), you use `virtual` functions. The virtual functions could be implemented\
    \ differently in different inherited class and the call to these functions will\
    \ be decided at runtime.\n\nDynamic polymorphism is implemented by `abstract classes`\
    \ and `virtual functions`.\n\nThe following program demonstrates this —\n\n```csharp\n\
    using System;\nnamespace PolymorphismApplication {\n    class Shape {\n      \
    \  protected int width, height;\n        public Shape(int a = 0, int b = 0) {\n\
    \            width = a;\n            height = b;\n        }\n        public virtual\
    \ int area() {\n            Console.WriteLine(\"Parent class area:\");\n     \
    \       return 0;\n        }\n    }\n    class Rectangle : Shape {\n        public\
    \ Rectangle(int a = 0, int b = 0) : base(a, b) {}\n        public override int\
    \ area() {\n            Console.WriteLine(\"Rectangle class area:\");\n      \
    \      return (width * height);\n        }\n    }\n    class Triangle : Shape\
    \ {\n        public Triangle(int a = 0, int b = 0) : base(a, b) {}\n        public\
    \ override int area() {\n            Console.WriteLine(\"Triangle class area:\"\
    );\n            return (width * height / 2);\n        }\n    }\n    class Caller\
    \ {\n        public void CallArea(Shape sh) {\n            int a;\n          \
    \  a = sh.area();\n            Console.WriteLine(\"Area: {0}\", a);\n        }\n\
    \    }\n    class Tester {\n        static void Main(string[] args) {\n      \
    \      Caller c = new Caller();\n            Rectangle r = new Rectangle(10, 7);\n\
    \            Triangle t = new Triangle(10, 5);\n            c.CallArea(r);\n \
    \           c.CallArea(t);\n            Console.ReadKey();\n        }\n    }\n\
    }\n```\n\nWhen the above code is compiled and executed, it produces the following\
    \ result —\nRectangle class area:\nArea: 70\nTriangle class area:\nArea: 25\n\n\
    ## C# - Operator Overloading\n\nYou can redefine or overload most of the built-in\
    \ operators available in C#. Thus a programmer can use operators with user-defined\
    \ types. Overloaded operators are functions with special names the keyword `operator`\
    \ followed by the symbol for the operator being defined. similar to any other\
    \ function, an overloaded operator has a return type and a parameter list.\n\n\
    For example, go through the following function —\n\n```csharp\npublic static Box\
    \ operator +(Box b, Box c) {\n    Box box = new Box();\n    box.length = b.length\
    \ + c.length;\n    box.breadth = b.breadth + c.breadth;\n    box.height = b.height\
    \ + c.height;\n    return box;\n}\n```\n\nThe above function implements the addition\
    \ operator (`+`) for a user-defined class `Box`. It adds the attributes of two\
    \ `Box` objects and returns the resultant `Box` object.\n\n### Implementing the\
    \ Operator Overloading\n\nThe following program shows the complete implementation\
    \ —\n\n```csharp\nusing System;\nnamespace OperatorOvlApplication {\n    class\
    \ Box {\n        private double length; // Length of a box\n        private double\
    \ breadth; // Breadth of a box\n        private double height; // Height of a\
    \ box\n        public double getVolume() {\n            return length * breadth\
    \ * height;\n        }\n        public void setLength(double len) {\n        \
    \    length = len;\n        }\n        public void setBreadth(double bre) {\n\
    \            breadth = bre;\n        }\n        public void setHeight(double hei)\
    \ {\n            height = hei;\n        }\n        // Overload + operator to add\
    \ two Box objects.\n        public static Box operator +(Box b, Box c) {\n   \
    \         Box box = new Box();\n            box.length = b.length + c.length;\n\
    \            box.breadth = b.breadth + c.breadth;\n            box.height = b.height\
    \ + c.height;\n            return box;\n        }\n    }\n    class Tester {\n\
    \        static void Main(string[] args) {\n            Box Box1 = new Box();\
    \ // Declare Box1 of type Box\n            Box Box2 = new Box(); // Declare Box2\
    \ of type Box\n            Box Box3 = new Box(); // Declare Box3 of type Box\n\
    \            double volume = 0.0; // Store the volume of a box here\n        \
    \    // box 1 specification\n            Box1.setLength(6.0);\n            Box1.setBreadth(7.0);\n\
    \            Box1.setHeight(5.0);\n            // box 2 specification\n      \
    \      Box2.setLength(12.0);\n            Box2.setBreadth(13.0);\n           \
    \ Box2.setHeight(10.0);\n            // volume of box 1\n            volume =\
    \ Box1.getVolume();\n            Console.WriteLine(\"Volume of Box1 : {0}\", volume);\n\
    \            // volume of box 2\n            volume = Box2.getVolume();\n    \
    \        Console.WriteLine(\"Volume of Box2 : {0}\", volume);\n            //\
    \ Add two object as follows:\n            Box3 = Box1 + Box2;\n            //\
    \ volume of box 3\n            volume = Box3.getVolume();\n            Console.WriteLine(\"\
    Volume of Box3 : {0}\", volume);\n            Console.ReadKey();\n        }\n\
    \    }\n}\n```\n\nWhen the above code is compiled and executed, it produces the\
    \ following result —\nVolume of Box1 : 210\nVolume of Box2 : 1560\nVolume of Box3\
    \ : 5400\n\n### Overloadable and Non-Overloadable Operators\n\nThe following table\
    \ describes the overload ability of the operators in C# —\n\n| Sr.No. | Operators\
    \ & Description |\n| :--- | :--- |\n| 1 | +, -, !, ~, ++, -- — These unary operators\
    \ take one operand and can be overloaded. |\n| 2 | +, -, *, /, % — These binary\
    \ operators take one operand and can be overloaded. |\n| 3 | ==, !=, <, >, <=,\
    \ >= — The comparison operators can be overloaded. |\n| 4 | &&, || — The conditional\
    \ logical operators cannot be overloaded directly. |\n| 5 | +=, -=, *=, /=, %=\
    \ — The assignment operators cannot be overloaded. |\n| 6 | =, ., ?:, ->, new,\
    \ is, sizeof, typeof — These operators cannot be overloaded. |\n"
