    d = 3 , f = 5 ;     /* initializing d and f. */byte z = 22 ;           /* initializes
    z. */double pi = 3.14159 ; /* declares an approximation of pi. */char x = ''x''
    ;          /* the variable x has the value ''x''. */It is a good programming practice
    to initialize variables properly, otherwise sometimes program may produce unexpected
    result.The following example uses various types of variables:using System ;namespace
    VariableDefinition {class Program {static void Main ( string [] args ) {short
    a ;int b ;double c ;/* actual initialization */a = 10 ;b = 20 ;c = a + b ;Console
    . WriteLine ( "a = {0}, b = {1}, c = {2}" , a , b , c );Console . ReadLine ();}}}When
    the above code is compiled and executed, it produces the following result −a =
    10, b = 20, c = 30Accepting Values from UserThe Console  class in the System  namespace
    provides a function ReadLine()  for accepting input from the user and store it
    into a variable.For example,int num ;num = Convert . ToInt32 ( Console . ReadLine
    ());The function Convert.ToInt32()  converts the data entered by the user to int
    data type, because Console.ReadLine()  accepts the data in string format.Lvalue
    and Rvalue Expressions in C#:There are two kinds of expressions in C#


    *   lvalue  − An expression that is an lvalue may appear as either the left-hand
    or right-hand side of an assignment.


    *   rvalue  − An expression that is an rvalue may appear on the right- but not
    left-hand side of an assignment.


    Variables are lvalues and hence they may appear on the left-hand side of an assignment.
    Numeric literals are rvalues and hence they may not be assigned and can not appear
    on the left-hand side. Following is a valid C# statement −int g = 20;But following
    is not a valid statement and would generate compile-time error −10 = 20;C# - OperatorsAn
    operator is a symbol that tells the compiler to perform specific mathematical
    or logical manipulations. C# has rich set of built-in operators and provides the
    following type of operators −


    *   Arithmetic Operators


    *   Relational Operators


    *   Logical Operators


    *   Bitwise Operators


    *   Assignment Operators


    *   Misc Operators


    This tutorial explains the arithmetic, relational, logical, bitwise, assignment,
    and other operators one by one.Arithmetic Operators:Following table shows all
    the arithmetic operators supported by C#. Assume variable A  holds 10 and variable B
     holds 20 then:


    | Operator | Description | Example |


    | + | Adds two operands | A + B = 30 |


    | - | Subtracts second operand from the first | A - B = -10 |


    | * | Multiplies both operands | A * B = 200 |


    | / | Divides numerator by de-numerator | B / A = 2 |


    | % | Modulus Operator and remainder of after an integer division | B % A = 0
    |


    | ++ | Increment operator increases integer value by one | A++ = 11 |


    | -- | Decrement operator decreases integer value by one | A-- = 9 |


    Example:The following example demonstrates all the arithmetic operators available
    in C# −using System ;namespace OperatorsAppl {    class Program {       static
    void Main ( string [] args ) {          int a = 21 ;          int b = 10 ;         
    int c ;         c = a + b ;          Console . WriteLine ( "Line 1 - Value of
    c is {0}" , c );         c = a - b ;          Console . WriteLine ( "Line 2 -
    Value of c is {0}" , c );         c = a * b ;          Console . WriteLine ( "Line
    3 - Value of c is {0}" , c );         c = a / b ;           Console . WriteLine
    ( "Line 4 - Value of c is {0}" , c );         c = a % b ;          Console . WriteLine
    ( "Line 5 - Value of c is {0}" , c );         c = a ++;          Console . WriteLine
    ( "Line 6 - Value of c is {0}" , c );         c = a --;          Console . WriteLine
    ( "Line 7 - Value of c is {0}" , c );          Console . ReadLine ();       }   
    }}When the above code is compiled and executed, it produces the following result
    −Line 1 - Value of c is 31Line 2 - Value of c is 11Line 3 - Value of c is 210Line
    4 - Value of c is 2Line 5 - Value of c is 1Line 6 - Value of c is 22Line 7 - Value
    of c is 20Relational OperatorsFollowing table shows all the relational operators
    supported by C#. Assume variable A  holds 10 and variable B  holds 20, then −


    | Operator | Description | Example |


    | == | Checks if the values of two operands are equal or not, if yes then condition
    becomes true. | (A == B) is not true. |


    | != | Checks if the values of two operands are equal or not, if values are not
    equal then condition becomes true. | (A != B) is true. |


    | > | Checks if the value of left operand is greater than the value of right operand,
    if yes then condition becomes true. | (A > B) is not true. |


    | < | Checks if the value of left operand is less than the value of right operand,
    if yes then condition becomes true. | (A < B) is true. |


    | >= | Checks if the value of left operand is greater than or equal to the value
    of right operand, if yes then condition becomes true. | (A >= B) is not true.
    |


    | <= | Checks if the value of left operand is less than or equal to the value
    of right operand, if yes then condition becomes true. | (A <= B) is true. |


    Example:The following example demonstrates all the relational operators available
    in C# −using System ;class Program { static void Main ( string [] args ) {      
    int a = 21 ;       int b = 10 ;       if ( a == b ) {          Console . WriteLine
    ( "Line 1 - a is equal to b" );       } else {          Console . WriteLine (
    "Line 1 - a is not equal to b" );       }       if ( a < b ) {          Console
    . WriteLine ( "Line 2 - a is less than b" );       } else {          Console .
    WriteLine ( "Line 2 - a is not less than b" );       }       if ( a > b ) {         
    Console . WriteLine ( "Line 3 - a is greater than b" );       } else {        
      Console . WriteLine ( "Line 3 - a is not greater than b" );       }       /*
    Lets change value of a and b */      a = 5 ;      b = 20 ;       if ( a <= b )
    {          Console . WriteLine ( "Line 4 - a is either less than or equal to  b"
    );       }       if ( b >= a ) {          Console . WriteLine ( "Line 5-b is either
    greater than or equal to b" );       }    }}When the above code is compiled and
    executed, it produces the following result −Line 1 - a is not equal to bLine 2
    - a is not less than bLine 3 - a is greater than bLine 4 - a is either less than
    or equal to bLine 5 - b is either greater than or equal to bLogical Operators:Following
    table shows all the logical operators supported by C#. Assume variable A  holds
    Boolean value true and variable B  holds Boolean value false, then −


    | Operator | Description | Example |


    | && | Called Logical AND operator. If both the operands are non zero then condition
    becomes true. | (A && B) is false. |


    | &#124;&#124; | Called Logical OR Operator. If any of the two operands is non
    zero then condition becomes true. | (A &#124;&#124; B) is true. |


    | ! | Called Logical NOT Operator. Use to reverses the logical state of its operand.
    If a condition is true then Logical NOT operator will make false. | !(A && B)
    is true. |'
