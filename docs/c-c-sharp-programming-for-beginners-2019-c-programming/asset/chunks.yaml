    \ ();\n    }\n}}\n```\n\n当上述代码编译并执行时，它产生以下结果：\n−The size of int is 4\nThe size\
    \ of short is 2\nThe size of double is 8\nValue of b is 30\nValue of b is 20\n\
    \n# C# 中的运算符优先级\n\n运算符优先级决定表达式中项的分组。这影响表达式的求值。某些运算符的优先级高于运算符；例如，乘法运算符的优先级高于加法运算符。\n\
    \n例如 `x = 7 + 3 * 2;`；在这里，`x` 被赋值为 13 而不是 20，因为运算符 `*` 的优先级高于 `+`，所以首先求值 `3*2`，然后将\
    \ `7` 加到其中。\n\n在这里，优先级最高的运算符出现在表格顶部，优先级最低的出现在底部。在表达式中，高优先级的运算符先求值。\n\n| 类别 | 运算符\
    \ | 结合性 |\n| :--- | :--- | :--- |\n| 后置 | `() [] -> . ++ - -` | 从左到右 |\n| 一元 |\
    \ `+ - ! ~ ++ - - (type)* & sizeof` | 从右到左 |\n| 乘法 | `* / %` | 从左到右 |\n| 加法 |\
    \ `+ -` | 从左到右 |\n| 移位 | `<< >>` | 从左到右 |\n| 关系 | `< <= > >=` | 从左到右 |\n| 等于 |\
    \ `== !=` | 从左到右 |\n| 按位与 | `&` | 从左到右 |\n| 按位异异 | `^` | 从左到右 |\n| 按位或 | `|` |\
    \ 从左到右 |\n| 逻辑与 | `&&` | 从左到右 |\n| 逻辑或 | `||` | 从左到右 |\n| 条件 | `?:` | 从右到左 |\n\
    | 赋值 | `= += -= *= /= %= >>= <<= &= ^= |==` | 从右到左 |\n| 逗号 | `,` | 从左到右 |\n\n\
    # 示例\n\n```csharp\nusing System;namespace OperatorsAppl {\nclass Program {\n \
    \   static void Main ( string [] args ) {\n        int a = 20 ;\n        int b\
    \ = 10 ;\n        int c = 15 ;\n        int d = 5 ;\n        int e ;\n       \
    \ e = ( a + b ) * c / d ; // ( 30 * 15 ) / 5\n        Console . WriteLine ( \"\
    Value of (a + b) * c / d is : {0}\" , e );\n        e = (( a + b ) * c ) / d ;\
    \ // ( 30 * 15 ) / 5\n        Console . WriteLine ( \"Value of ((a + b) * c) /\
    \ d is  : {0}\" , e );\n        e = ( a + b ) * ( c / d ); // ( 30 ) * (15/5)\n\
    \        Console . WriteLine ( \"{0}\", e);\n        e = a + ( b * c ) / d ; //\
    \ 20 + (150/5)\n        Console . WriteLine ( \"{0}\", e);\n        Console .\
    \ ReadLine ();\n    }\n}}\n```\n\n当上述代码编译并执行时，它产生以下结果：\nValue of (a + b) * c /\
    \ d is : 90\nValue of ((a + b) * c) / d is  : 90\n\n# C# - 决策判断\n\n决策结构要求程序员指定一个或多个条件，由程序进行求值或测试，并在条件被确定为真时执行一条或多条语句，可选，如果条件被确定为假，则执行其他语句。\n\
    \n以下是大多数编程语言中常见的典型决策结构的通用形式：\n![Decision making statements in C#](img/image2607.jpg)\n\
    \nC# 提供了以下类型的决策语句。点击以下链接查看详细信息。\n\n| 序号 | 语句与描述 |\n| :--- | :--- |\n| 1 | if 语句\
    \ | `if` 语句由一个布尔表达式后跟一个或多个语句组成。 |\n| 2 | if...else 语句 | `if` 语句后面可以跟一个可选的 `else`\
    \ 语句，该语句在布尔表达式为假时执行。 |\n| 3 | 嵌套 if 语句 | 你可以在另一个 `if` 或 `else if` 语句内部使用一个 `if`\
    \ 或 `else if` 语句。 |\n| 4 | switch 语句 | `switch` 语句允许对变量与一组值进行等性测试。 |\n| 5 | 嵌套\
    \ switch 语句 | 你可以在另一个 `switch` 语句内部使用一个 `switch` 语句。 |\n\n## If 语句\n\n`if` 语句由一个布尔表达式后跟一个或多个语句组成。\n\
    \n### 语法\nC# 中 `if` 语句的语法为：\n`if(boolean_expression) {/* 如果布尔表达式为真，则执行语句(s) */}`\n\
    \n如果布尔表达式求值为 `true`，则执行 `if` 语句内部的代码块将被执行。如果布尔表达式求值为 `false`，则在 `if` 语句结束处（右大括号之后）后的第一组代码将被执行。\n\
    \n### 流程图：\n![C# if statement](img/image2675.jpg)\n\n### 示例\n```csharp\nusing\
    \ System;namespace DecisionMaking {\nclass Program {\n    static void Main ( string\
    \ [] args ) {\n        /* 局部变量定义 */\n        int a = 10 ;\n        /* 使用 if 语句检查布尔条件\
    \ */\n        if ( a < 20 ) {\n            /* 如果条件为真则打印以下内容 */\n            Console\
    \ . WriteLine ( \"a is less than 20\" );\n        }\n        Console . WriteLine\
    \ ( \"value of a is : {0}\" , a );\n        Console . ReadLine ();\n    }\n}}\n\
    ```\n当上述代码编译并执行时，它产生以下结果：\na is less than 20\nvalue of a is : 10\n\n## if...else\
    \ 语句\n\n`if` 语句后面可以跟一个可选的 `else` 语句，它在布尔表达式为假时执行。\n\n### 语法\nC# 中 `if...else`\
    \ 语句的语法为：\n`if(boolean_expression) {/* 如果布尔表达式为真，则执行语句(s) */} else {/* 如果布尔表达式为假，则执行语句(s)\
    \ */}`\n\n如果布尔表达式求值为 `true`，则执行 `if` 代码块，否则执行 `else` 代码块。\n\n### 流程图：\n![C# if...else\
    \ statement](img/image2740.jpg)\n\n### 示例\n```csharp\nusing System;namespace DecisionMaking\
    \ {\nclass Program {\n    static void Main ( string [] args ) {\n        /* 局部变量定义\
    \ */\n        int a = 100 ;\n        /* 检查布尔条件 */\n        if ( a < 20 ) {\n \
    \           /* 如果条件为真则打印以下内容 */\n            Console . WriteLine ( \"a is less\
    \ than 20\" );\n        } else {\n            /* 如果条件为假则打印以下内容 */\n          \
    \  Console . WriteLine ( \"a is not less than 20\" );\n        }\n        Console\
    \ . WriteLine ( \"value of a is : {0}\" , a );\n        Console . ReadLine ();\n\
    \    }\n}}\n```\n当上述代码编译并执行时，它产生以下结果：\na is not less than 20\nvalue of a is :\
    \ 100\n\n## if...else if...else 语句\n\n`if` 语句后面可以跟一个可选的 `else if...else` 语句，这对于使用单个\
    \ `if...else if` 语句测试各种条件非常有用。在使用 `if`、`else if`、`else` 语句有几点需要注意：\n\n- `if` 可以有零或一个\
    \ `else`，它必须位于任何 `else if` 之后。\n- `if` 可以有零到多个 `else if`，它们必须位于 `else` 之前。\n-\
    \ 一旦某个 `else if` 成功，剩余的 `else if` 或 `else` 将不再被测试。\n\n"
- fmt: "\n# if...else if...else Statement\n\nThe syntax of an `if...else if...else`\
    \ statement in C# is:\n\n```csharp\nif(boolean_expression 1) {/* Executes when\
    \ the boolean expression 1 is true %}\nelse if( boolean_expression 2) {/* Executes\
    \ when the boolean expression 2 is true %}\nelse if( boolean_expression 3) {/*\
    \ Executes when the boolean expression 3 is true %}\nelse {/* executes when the\
    \ none of the above condition is true %}\n```\n\nExample:\n```csharp\nusing System\
    \ ;\nnamespace DecisionMaking {\nclass Program {\n    static void Main ( string\
    \ [] args ) {\n        /* local variable definition */\n        int a = 100 ;\n\
    \        /* check the boolean condition */\n        if ( a == 10 ) {/* if condition\
    \ is true then print the following */\n            Console . WriteLine ( \"Value\
    \ of a is 10\" );\n        }else if ( a == 20 ) {/* if else if condition is true\
    \ */\n            Console . WriteLine ( \"Value of a is 20\" );\n        }else\
    \ if ( a == 30 ) {/* if else if condition is true  */\n            Console . WriteLine\
    \ ( \"Value of a is 30\" );\n        } else {/* if none of the conditions is true\
    \ */\n            Console . WriteLine ( \"None of the values is matching\" );\n\
    \        }\n        Console . WriteLine ( \"Exact value of a is: {0}\" , a );\n\
    \        Console . ReadLine ();\n    }\n}\n```\n\nWhen the above code is compiled\
    \ and executed, it produces the following result:\nNone of the values is matching\n\
    Exact value of a is: 100\n\n## Nested if Statements\n\nIt is always legal in C#\
    \ to nest `if-else` statements, which means you can use one `if` or `else if`\
    \ statement inside another `if` or `else if` statement(s).\n\nSyntax:\nThe syntax\
    \ for a `nested if` statement is as follows:\n\n```csharp\nif( boolean_expression\
    \ 1) {/* Executes when the boolean expression 1 is true %}\n    if(boolean_expression\
    \ 2) {/* Executes when the boolean expression 2 is true %}\n}\n```\nYou can nest\
    \ `else if...else` in the similar way as you have nested `if` statement.\n\nExample:\n\
    ```csharp\nusing System ;\nnamespace DecisionMaking {\nclass Program {\n    static\
    \ void Main ( string [] args ) {\n        //* local variable definition */\n \
    \       int a = 100 ;\n        int b = 200 ;\n        /* check the boolean condition\
    \ */\n        if ( a == 100 ) {/* if condition is true then check the following\
    \ */\n            if ( b == 200 ) {/* if condition is true then print the following\
    \ */\n                Console . WriteLine ( \"Value of a is 100 and b is 200\"\
    \ );\n            }\n        }\n        Console . WriteLine ( \"Exact value of\
    \ a is : {0}\" , a );\n        Console . WriteLine ( \"Exact value of b is : {0}\"\
    \ , b );\n        Console . ReadLine ();\n    }\n}\n```\nWhen the above code is\
    \ compiled and executed, it produces the following result:\nValue of a is 100\
    \ and b is 200\nExact value of a is : 100\nExact value of b is : 200\n\n## Switch\
    \ statement\n\nA `switch` statement allows a variable to be tested for equality\
    \ against a list of values. Each value is called a `case`, and the variable being\
    \ switched on is checked for each `switch case`.\n\nSyntax:\nThe syntax for a\
    \ `switch` statement in C# is as follows:\n\n```csharp\nswitch(expression) {\n\
    \    case constant-expression1 : statement(s);\n    break;\n    case constant-expression2\
    \ :\n    case constant-expression3 : statement(s);\n    break;\n    /* you can\
    \ have any number of case statements */\n    default : /* Optional */\n    statement(s);\n\
    }\n```\n\nThe following rules apply to a `switch` statement:\n\n- The `expression`\
    \ used in a `switch` statement must have an integral or enumerated type, or be\
    \ of a class type in which the class has a single conversion function to an integral\
    \ or enumerated type.\n- You can have any number of `case` statements within a\
    \ `switch`. Each `case` is followed by the value to be compared to and a colon.\n\
    - The `constant-expression` for a `case` must be the same data type as the variable\
    \ in the `switch`, and it must be a constant or a literal.\n- When the variable\
    \ being switched on is equal to a `case`, the statements following that case will\
    \ execute until a `break` statement is reached.\n- When a `break` statement is\
    \ reached, the `switch` terminates, and the flow of control jumps to the next\
    \ line following the `switch` statement.\n- Not every `case` needs to contain\
    \ a `break`. If no `break` appears, then it will raise a compile time error.\n\
    - A `switch` statement can have an optional `default` `case`, which must appear\
    \ at the end of the `switch`. The `default` case can be used for performing a\
    \ task when none of the `cases` is true.\n\nFlow Diagram:\n![switch statement\
    \ in C#](image3022.jpg)\n\nExample:\n```csharp\nusing System ;\nnamespace DecisionMaking\
    \ {\nclass Program {\n    static void Main ( string [] args ) {\n        /* local\
    \ variable definition */\n        char grade = 'B' ;\n        switch ( grade )\
    \ {\n            case 'A' : Console . WriteLine ( \"Excellent!\" ); break ;\n\
    \            case 'B' :\n            case 'C' : Console . WriteLine ( \"Well done\"\
    \ ); break ;\n            case 'D' : Console . WriteLine ( \"You passed\" ); break\
    \ ;\n            case 'F' : Console . WriteLine ( \"Better try again\" ); break\
    \ ;\n            default : Console . WriteLine ( \"Invalid grade\" ); break ;\n\
    \        }\n        Console . WriteLine ( \"Your grade is {0}\" , grade );\n \
    \       Console . ReadLine ();\n    }\n}\n```\nWhen the above code is compiled\
    \ and executed, it produces the following result:\nWell done\nYour grade is B\n\
    \n## Nested switch statement\n\nIt is possible to have a `switch` as part of the\
    \ statement sequence of an outer `switch`. Even if the `case` constants of the\
    \ inner and outer `switch` contain common values, no conflicts will arise.\n\n\
    Syntax:\nThe syntax for a `nested switch` statement is as follows:\n\n```csharp\n\
    switch(ch1) {\n    case 'A':\n        Console.WriteLine(\"This A is part of outer\
    \ switch\" );\n        switch(ch2) {\n            case 'A': Console.WriteLine(\"\
    This A is part of inner switch\" ); break;\n            case 'B': /* inner B case\
    \ code */ break;\n        }\n    case 'B': /* outer B case code */\n}\n```\n\n\
    Example:\n```csharp\nusing System ;\nnamespace DecisionMaking {\nclass Program\
    \ {\n    static void Main ( string [] args ) {\n        int a = 100 ;\n      \
    \  int b = 200 ;\n        switch ( a ) {\n            case 100 :\n           \
    \     Console . WriteLine ( \"This is part of outer switch \" );\n           \
    \     switch ( b ) {\n                    case 200 : Console . WriteLine ( \"\
    This is part of inner switch \" ); break ;\n                }\n              \
    \  break ;\n        }\n        Console . WriteLine ( \"Exact value of a is : {0}\"\
    \ , a );\n        Console . WriteLine ( \"Exact value of b is : {0}\" , b );\n\
    \        Console . ReadLine ();\n    }\n}\n```\nWhen the above code is compiled\
    \ and executed, it produces the following result:\nThis is part of outer switch\n\
    This is part of inner switch\nExact value of a is : 100\nExact value of b is :\
    \ 200\n\n## C# - Loops\n\nThere may be a situation, when you need to execute a\
    \ block of code several number of times. In general, the statements are executed\
    \ sequentially: The first statement in a function is executed first, followed\
    \ by the second, and so on. Programming languages provide various control structures\
    \ that allow for more complicated execution paths. A loop statement allows us\
    \ to execute a statement or a group of statements multiple times and following\
    \ is the general from of a loop statement in most of the programming languages:\n\
    \n![Loop Architecture](image3205.jpg)\n\nC# provides following types of loop to\
    \ handle looping requirements. Click the following links to check their detail.\n\
    \n| Sr.No. | Loop Type & Description |\n| :--- | :--- |\n| 1 | while loopIt repeats\
    \ a statement or a group of statements while a given condition is true. It tests\
    \ the condition before executing the loop body. |\n| 2 | for loopIt executes a\
    \ sequence of statements multiple times and abbreviates the code that manages\
    \ the loop variable. |\n| 3 | do...while loopIt is similar to a while statement,\
    \ except that it tests the condition at the end of the loop body |\n| 4 | nested\
    \ loopsYou can use one or more loop inside any another while, for or do..while\
    \ loop . |\n"
  raw: 'Syntax:The syntax of an if...else if...else  statement in C# is −if(boolean_expression
    1) {/* Executes when the boolean expression 1 is true */}else if( boolean_expression
    2) {/* Executes when the boolean expression 2 is true */}else if( boolean_expression
    3) {/* Executes when the boolean expression 3 is true */} else {/* executes when
    the none of the above condition is true */}Example:using System ;namespace DecisionMaking
    {class Program {static void Main ( string [] args ) {/* local variable definition
    */int a = 100 ;/* check the boolean condition */if ( a == 10 ) {/* if condition
    is true then print the following */Console . WriteLine ( "Value of a is 10" );}else
    if ( a == 20 ) {/* if else if condition is true */Console . WriteLine ( "Value
    of a is 20" );}else if ( a == 30 ) {/* if else if condition is true  */Console
    . WriteLine ( "Value of a is 30" );} else {/* if none of the conditions is true
    */Console . WriteLine ( "None of the values is matching" );}Console . WriteLine
    ( "Exact value of a is: {0}" , a );Console . ReadLine ();}}}When the above code
    is compiled and executed, it produces the following result −None of the values
    is matchingExact value of a is: 100Nested if Statements:It is always legal in
    C# to nest  if-else statements, which means you can use one if or else if statement
    inside another if or else if statement(s).Syntax:The syntax for a nested if  statement
    is as follows −if( boolean_expression 1) {/* Executes when the boolean expression
    1 is true */if(boolean_expression 2) {/* Executes when the boolean expression
    2 is true */}}You can nest else if...else  in the similar way as you have nested if
     statement.Example:using System ;namespace DecisionMaking {class Program {static
    void Main ( string [] args ) {//* local variable definition */int a = 100 ;int
    b = 200 ;/* check the boolean condition */if ( a == 100 ) {/* if condition is
    true then check the following */if ( b == 200 ) {/* if condition is true then
    print the following */Console . WriteLine ( "Value of a is 100 and b is 200" );}}Console
    . WriteLine ( "Exact value of a is : {0}" , a );Console . WriteLine ( "Exact value
    of b is : {0}" , b );Console . ReadLine ();}}}When the above code is compiled
    and executed, it produces the following result −Value of a is 100 and b is 200Exact
    value of a is : 100Exact value of b is : 200Switch statement:A switch  statement
    allows a variable to be tested for equality against a list of values. Each value
    is called a case, and the variable being switched on is checked for each switch
    case .Syntax:The syntax for a switch  statement in C# is as follows −switch(expression)
    {case constant-expression1  :statement(s);break;case constant-expression2  :case
    constant-expression3  :statement(s);break;/* you can have any number of case statements
    */default : /* Optional */statement(s);}The following rules apply to a switch
     statement −


    *   The  expression  used in a  switch  statement must have an integral or enumerated
    type, or be of a class type in which the class has a single conversion function
    to an integral or enumerated type.


    *   You can have any number of case statements within a switch. Each case is followed
    by the value to be compared to and a colon.


    *   The  constant-expression  for a case must be the same data type as the variable
    in the switch, and it must be a constant or a literal.


    *   When the variable being switched on is equal to a case, the statements following
    that case will execute until a  break  statement is reached.


    *   When a  break  statement is reached, the switch terminates, and the flow of
    control jumps to the next line following the switch statement.


    *   Not every case needs to contain a  break . If no  break  appears, then it
    will raise a compile time error.


    *   A  switch  statement can have an optional  default  case, which must appear
    at the end of the switch. The default case can be used for performing a task when
    none of the cases is true.


    Flow Diagram:![switch statement in C#](image3022.jpg)Example:using System ;namespace
    DecisionMaking {class Program {static void Main ( string [] args ) {/* local variable
    definition */char grade = ''B'' ;switch ( grade ) {case ''A'' :Console . WriteLine
    ( "Excellent!" );break ;case ''B'' :case ''C'' :Console . WriteLine ( "Well done"
    );break ;case ''D'' :Console . WriteLine ( "You passed" );break ;case ''F'' :Console
    . WriteLine ( "Better try again" );break ;default :Console . WriteLine ( "Invalid
    grade" );break ;}Console . WriteLine ( "Your grade is  {0}" , grade );Console
    . ReadLine ();}}}When the above code is compiled and executed, it produces the
    following result −Well doneYour grade is BNested switch statement:It is possible
