    can use the sizeof  method. The expression sizeof(type)  yields the storage size
    of the object or type in bytes. Following is an example to get the size of int
     type on any machine:using System ;namespace DataTypeApplication {class Program
    {static void Main ( string [] args ) {Console . WriteLine ( "Size of int: {0}"
    , sizeof ( int ));Console . ReadLine ();}}}When the above code is compiled and
    executed, it produces the following result:Size of int: 4Reference Type:The reference
    types do not contain the actual data stored in a variable, but they contain a
    reference to the variables.In other words, they refer to a memory location. Using
    multiple variables, the reference types can refer to a memory location. If the
    data in the memory location is changed by one of the variables, the other variable
    automatically reflects this change in value. Example of built-in  reference types
    are:object , dynamic, and string .Object Type:The Object Type  is the ultimate
    base class for all data types in C# Common Type System (CTS). Object is an alias
    for System.Object class. The object types can be assigned values of any other
    types, value types, reference types, predefined or user-defined types. However,
    before assigning values, it needs type conversion.When a value type is converted
    to object type, it is called boxing  and on the other hand, when an object type
    is converted to a value type, it is called unboxing .object obj ;obj = 100 ; //
    this is boxingDynamic Type:You can store any type of value in the dynamic data
    type variable. Type checking for these types of variables takes place at run-time.Syntax
    for declaring a dynamic type is −dynamic <variable_name> = value;For example,dynamic
    d = 20 ;Dynamic types are similar to object types except that type checking for
    object type variables takes place at compile time, whereas that for the dynamic
    type variables takes place at run time.String Type:The String Type  allows you
    to assign any string values to a variable. The string type is an alias for the
    System.String class. It is derived from object type. The value for a string type
    can be assigned using string literals in two forms: quoted and @quoted .For example,String
    str = "C Sharp" ;A @quoted string literal looks as follows −@ "C Sharp" ;The user-defined
    reference types are: class, interface, or delegate. We will discuss these types
    in later chapter.Pointer Type:Pointer type variables store the memory address
    of another type. Pointers in C# have the same capabilities as the pointers in
    C or C++.Syntax for declaring a pointer type is −type * identifier ;For example,char
    * cptr ;int * iptr ;C# - Type ConversionType conversion is converting one type
    of data to another type. It is also known as Type Casting. In C#, type casting
    has two forms −


    *   Implicit type conversion  − These conversions are performed by C# in a type-safe
    manner. For example, are conversions from smaller to larger integral types and
    conversions from derived classes to base classes.


    *   Explicit type conversion  − These conversions are done explicitly by users
    using the pre-defined functions. Explicit conversions require a cast operator.


    The following example shows an explicit type conversion:using System ;namespace
    TypeConversionApplication {    class ExplicitConversion {       static void Main
    ( string [] args ) {          double d = 5673.74 ;          int i ;          
