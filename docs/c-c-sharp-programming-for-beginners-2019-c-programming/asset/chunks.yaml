    \n            if (Box1 <= Box2)\n                Console.WriteLine(\"Box1 is less\
    \ or equal to Box2\");\n            else\n                Console.WriteLine(\"\
    Box1 is not less or equal to Box2\");\n\n            if (Box1 != Box2)\n     \
    \           Console.WriteLine(\"Box1 is not equal to Box2\");\n            else\n\
    \                Console.WriteLine(\"Box1 is not greater or equal to Box2\");\n\
    \n            Box4 = Box3;\n            if (Box3 == Box4)\n                Console.WriteLine(\"\
    Box3 is equal to Box4\");\n            else\n                Console.WriteLine(\"\
    Box3 is not equal to Box4\");\n\n            Console.ReadKey();\n        }\n \
    \   }\n}\n```\n\n当上述代码被编译并执行时，它产生以下结果—\nBox 1: (6, 7, 5)\nBox 2: (12, 13, 10)\n\
    Volume of Box1 : 210\nVolume of Box2 : 1560\nBox 3: (18, 20, 15)\nVolume of Box3\
    \ : 5400\nBox1 is not greater than Box2\nBox1 is less than Box2\nBox1 is not greater\
    \ or equal to Box2\nBox1 is less or equal to Box2\nBox1 is not equal to Box2\n\
    Box3 is equal to Box4\n\n# C# - 接口 (Interfaces)\n\n接口被定义为语法约定，所有继承接口的类都应该遵循该约定。接口定义了语法约定的“是什么”部分，而派生类定义了语法约定的“如何做”部分。接口定义了属性、方法和事件，这些都是接口的成员。接口只成员成员声明。定义成员是派生类的责任。它通常有助于为派生类提供一个标准的结构。抽象类在某种程度上起着相同的作用，但它们主要用于基类仅声明少数方法而由派生类实现功能的情况。\n\
    \n## 声明接口\n\n接口使用 `interface` 关键字进行声明。这与类声明相似。接口语句默认是公共的。以下是接口声明的示例—\n\n```csharp\n\
    public interface ITransactions {\n    // 接口成员\n    void showTransaction();\n \
    \   double getAmount();\n}\n```\n\n## 示例\n\n下面的示例演示了上述接口的实现—\n\n```csharp\nusing\
    \ System.Collections.Generic;\nusing System.Linq;\nusing System.Text;\nusing System;\n\
    \nnamespace InterfaceApplication {\n    public interface ITransactions {\n   \
    \     // 接口成员\n        void showTransaction();\n        double getAmount();\n\
    \    }\n\n    public class Transaction : ITransactions {\n        private string\
    \ tCode;\n        private string date;\n        private double amount;\n\n   \
    \     public Transaction() {\n            tCode = \" \";\n            date = \"\
    \ \";\n            amount = 0.0;\n        }\n\n        public Transaction(string\
    \ c, string d, double a) {\n            tCode = c;\n            date = d;\n  \
    \          amount = a;\n        }\n\n        public double getAmount() {\n   \
    \         return amount;\n        }\n\n        public void showTransaction() {\n\
    \            Console.WriteLine(\"Transaction: {0}\", tCode);\n            Console.WriteLine(\"\
    Date: {0}\", date);\n            Console.WriteLine(\"Amount: {0}\", getAmount());\n\
    \        }\n    }\n\n    class Tester {\n        static void Main(string[] args)\
    \ {\n            Transaction t1 = new Transaction(\"001\", \"8/10/2012\", 78900.00);\n\
    \            Transaction t2 = new Transaction(\"002\", \"9/10/2012\", 451900.00);\n\
    \            t1.showTransaction();\n            t2.showTransaction();\n      \
    \      Console.ReadKey();\n        }\n    }\n}\n```\n\n当上述代码被编译并执行时，它产生以下结果—\n\
    Transaction: 001\nDate: 8/10/2012\nAmount: 78900\nTransaction: 002\nDate: 9/10/2012\n\
    Amount: 451900\n\n"
