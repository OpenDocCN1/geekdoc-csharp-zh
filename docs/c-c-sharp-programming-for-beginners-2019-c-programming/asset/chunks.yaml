  trans: "\n\n# if...else if...else 语句\n\nC# 中 `if...else if...else` 语句的语法如下：\n\n\
    ```csharp\nif(boolean_expression 1) {/* 当布尔表达式 1 为真时执行 %}\nelse if( boolean_expression\
    \ 2) {/* 当布尔表达式 2 为真时执行 %}\nelse if( boolean_expression 3) {/* 当布尔表达式 3 为真时执行\
    \ %}\nelse {/* 当上述条件均为假时执行 %}\n```\n\n示例：\n```csharp\nusing System ;\nnamespace\
    \ DecisionMaking {\nclass Program {\n    static void Main ( string [] args ) {\n\
    \        /* 局部变量定义 */\n        int a = 100 ;\n        /* 检查布尔条件 */\n        if\
    \ ( a == 10 ) {/* if 条件为真则打印以下内容 */\n            Console . WriteLine ( \"Value\
    \ of a is 10\" );\n        }else if ( a == 20 ) {/* if else if 条件为真 */\n     \
    \       Console . WriteLine ( \"Value of a is 20\" );\n        }else if ( a ==\
    \ 30 ) {/* if else if 条件为真  */\n            Console . WriteLine ( \"Value of a\
    \ is 30\" );\n        } else {/* 如果没有条件为真 */\n            Console . WriteLine\
    \ ( \"None of the values is matching\" );\n        }\n        Console . WriteLine\
    \ ( \"Exact value of a is: {0}\" , a );\n        Console . ReadLine ();\n    }\n\
    }\n```\n\n当上述代码编译并执行时，将产生以下结果：\nNone of the values is matching\nExact value of\
    \ a is: 100\n\n## 嵌套 if 语句\n\n在 C# 中嵌套 `if-else` 语句总是合法的，这意味着你可以在一个 `if` 或 `else\
    \ if` 语句内部嵌套另一个 `if` 或 `else if` 语句。\n\n语法：\n`嵌套 if` 语句的语法如下：\n\n```csharp\nif(\
    \ boolean_expression 1) {/* 当布尔表达式 1 为真时执行 %}\n    if(boolean_expression 2) {/*\
    \ 当布尔表达式 2 为真时执行 %}\n}\n```\n你可以以嵌套 `if` 语句类似的方式嵌套 `else if...else`。\n\n示例：\n\
    ```csharp\nusing System ;\nnamespace DecisionMaking {\nclass Program {\n    static\
    \ void Main ( string [] args ) {\n        //* 局部变量定义 */\n        int a = 100 ;\n\
    \        int b = 200 ;\n        /* 检查布尔条件 */\n        if ( a == 100 ) {/* if 条件为真则检查以下内容\
    \ */\n            if ( b == 200 ) {/* if 条件为真则打印以下内容 */\n                Console\
    \ . WriteLine ( \"Value of a is 100 and b is 200\" );\n            }\n       \
    \ }\n        Console . WriteLine ( \"Exact value of a is : {0}\" , a );\n    \
    \    Console . WriteLine ( \"Exact value of b is : {0}\" , b );\n        Console\
    \ . ReadLine ();\n    }\n}\n```\n当上述代码编译并执行时，将产生以下结果：\nValue of a is 100 and b\
    \ is 200\nExact value of a is : 100\nExact value of b is : 200\n\n## switch 语句\n\
    \n`switch` 语句允许对变量与一组值进行等值测试。每个值被称为一个 `case`，被切换的变量会在每个 `switch case` 中进行检查。\n\
    \n语法：\nC# 中 `switch` 语句的语法如下所示：\n\n```csharp\nswitch(expression) {\n    case constant-expression1\
    \ : statement(s);\n    break;\n    case constant-expression2 :\n    case constant-expression3\
    \ : statement(s);\n    break;\n    /* 你可以有任意数量的 case 语句 */\n    default : /* 可选\
    \ */\n    statement(s);\n}\n```\n\n以下规则适用于 `switch` 语句：\n\n- `switch` 语句中使用的 `expression`\
    \ 具有整型或枚举类型，或者是一个类类型且该类具有转换为整型或枚举类型的单一转换函数。\n- 你可以在 `switch` 中包含任意数量的 `case` 语句。每个\
    \ `case` 后面都跟着要比较的值和一个冒号。\n- `case` 的 `constant-expression` 必须与 `switch` 中的变量具有相同的数据类型，并且它必须是常量或字面量。\n\
    - 当被切换的变量等于某个 `case` 时，该 case 后的语句将执行，直到遇到 `break` 语句。\n- 当遇到 `break` 语句时，`switch`\
    \ 终止，控制流跳转到 `switch` 语句之后的下一行。\n- 并不是每个 `case` 都需要包含 `break`。如果没有出现 `break`，将会引起编译错误。\n\
    - `switch` 语句可以有一个可选的 `default` `case`，它必须出现在 `switch` 的末尾。`default` case 可用于在没有任何\
    \ `cases` 为真时执行某项任务。\n\n流程图：\n![switch statement in C#](img/image3022.jpg)\n\n\
    示例：\n```csharp\nusing System ;\nnamespace DecisionMaking {\nclass Program {\n\
    \    static void Main ( string [] args ) {\n        /* 局部变量定义 */\n        char\
    \ grade = 'B' ;\n        switch ( grade ) {\n            case 'A' : Console .\
    \ WriteLine ( \"Excellent!\" ); break ;\n            case 'B' :\n            case\
    \ 'C' : Console . WriteLine ( \"Well done\" ); break ;\n            case 'D' :\
    \ Console . WriteLine ( \"You passed\" ); break ;\n            case 'F' : Console\
    \ . WriteLine ( \"Better try again\" ); break ;\n            default : Console\
    \ . WriteLine ( \"Invalid grade\" ); break ;\n        }\n        Console . WriteLine\
    \ ( \"Your grade is {0}\" , grade );\n        Console . ReadLine ();\n    }\n\
    }\n```\n当上述代码编译并执行时，将产生以下结果：\nWell done\nYour grade is B\n\n## 嵌套 switch 语句\n\n\
    可以将一个 `switch` 作为外部 `switch` 语句语句序列的一部分。即使内部和外部 `switch` 的 `case` 常量包含共同的值，也不会产生冲突。\n\
    \n语法：\n`嵌套 switch` 语句的语法如下：\n\n```csharp\nswitch(ch1) {\n    case 'A':\n     \
    \   Console.WriteLine(\"This A is part of outer switch\" );\n        switch(ch2)\
    \ {\n            case 'A': Console.WriteLine(\"This A is part of inner switch\"\
    \ ); break;\n            case 'B': /* 内部 B case */ break;\n        }\n    case\
    \ 'B': /* 外部 B case */\n}\n```\n\n示例：\n```csharp\nusing System ;\nnamespace DecisionMaking\
    \ {\nclass Program {\n    static void Main ( string [] args ) {\n        int a\
    \ = 100 ;\n        int b = 200 ;\n        switch ( a ) {\n            case 100\
    \ :\n                Console . WriteLine ( \"This is part of outer switch\" );\n\
    \                switch ( b ) {\n                    case 200 : Console . WriteLine\
    \ ( \"This is part of inner switch\" ); break;\n                }\n          \
    \      break;\n        }\n    }\n}\n```\n当上述代码编译并执行时，将产生以下结果：\nThis is part of\
    \ outer switch\nThis is part of inner switch\n\n## C# - 循环\n\n在某些情况下，你需要多次执行一段代码块。通常情况下，语句是按顺序执行的：函数中的第一个语句首先执行，然后是第二个，依此类推。编程语言提供了各种控制结构允许允许复杂的执行路径。循环语句允许我们多次执行语句或一组语句，以下是大多数编程语言中循环语句的形式：\n\
    \n![Loop Architecture](img/image3205.jpg)\n\nC# 提供了以下类型的循环来处理循环需求。点击以下链接查看详细信息。\n\
    \n| 序号 | 循环类型与描述 |\n| :--- | :--- |\n| 1 | while 循环在给定条件为真时重复执行语句或一组语句。它在执行循环体之前测试条件。\
    \ |\n| 2 | for 循环多次执行语句序列，并缩短了管理循环变量的代码。 |\n| 3 | do...while 循环与 while 语句相似，但它在循环体末尾测试条件。\
    \ |\n| 4 | 嵌套循环你可以在另一个 while、for 或 do..while 循环内部嵌套一个或多个循环。 |\n\n"
- fmt: "\n# While loop\nA `while` loop statement in C# repeatedly executes a target\
    \ statement as long as a given condition is true.\n\n### Syntax\nThe syntax of\
    \ a `while` loop in C# is:\n```csharp\nwhile(condition) {statement(s);}\n```\n\
    Here, `statement(s)` may be a single statement or a block of statements. The `condition`\
    \ may be any expression, and `true` is any non-zero value. The loop iterates while\
    \ the condition is true. When the condition becomes false, program control passes\
    \ to the line immediately following the loop.\n\n### Flow Diagram\n![while loop\
    \ in C#](image3257.jpg)\nHere, key point of the `while` loop is that the loop\
    \ might not ever run. When the `condition` is tested and the result is false,\
    \ the loop body is skipped and the first statement after the while loop is executed.\n\
    \n### Example\n```csharp\nusing System ;\nnamespace Loops {\n    class Program\
    \ {\n        static void Main ( string [] args ) {\n            /* local variable\
    \ definition */\n            int a = 10 ;\n            /* while loop execution\
    \ */\n            while ( a < 20 ) {\n                Console . WriteLine ( \"\
    value of a: {0}\" , a );\n                a ++;\n            }\n            Console\
    \ . ReadLine ();\n        }\n    }\n}\n```\nWhen the above code is compiled and\
    \ executed, it produces the following result:\nvalue of a: 10\nvalue of a: 11\n\
    value of a: 12\nvalue of a: 13\nvalue of a: 14\nvalue of a: 15\nvalue of a: 16\n\
    value of a: 17\nvalue of a: 18\nvalue of a: 19\n\n# For loop\nA `for` loop is\
    \ a repetition control structure that allows you to efficiently write a loop that\
    \ needs to execute a specific number of times.\n\n### Syntax\nThe syntax of a\
    \ `for` loop in C# is:\n```csharp\nfor ( init; condition; increment ) {statement(s);}\n\
    ```\nHere is the flow of control in a `for` loop:\n- The `init` step is executed\
    \ first, and only once. This step allows you to declare and initialize any loop\
    \ control variables. You are not required to put a statement here, as long as\
    \ a semicolon appears.\n- Next, the `condition` is evaluated. If it is true, the\
    \ body of the loop is executed. If it is false, the body of the loop does not\
    \ execute and flow of control jumps to the next statement just after the `for`\
    \ loop.\n- After the body of the `for` loop executes, the flow of control jumps\
    \ back up to the `increment` statement. This statement allows you to update any\
    \ loop control variables. This statement can be left blank, as long as a semicolon\
    \ appears after the condition.\n- The `condition` is now evaluated again. If it\
    \ is true, the loop executes and the process repeats itself (body of loop, then\
    \ increment step, and then again testing for a condition). After the condition\
    \ becomes false, the `for` loop terminates.\n\n### Flow Diagram\n![for loop in\
    \ C#](image3342.jpg)\n\n### Example\n```csharp\nusing System ;\nnamespace Loops\
    \ {\n    class Program {\n        static void Main ( string [] args ) {\n    \
    \        /* for loop execution */\n            for ( int a = 10 ; a < 20 ; a =\
    \ a + 1 ) {\n                Console . WriteLine ( \"value of a: {0}\" , a );\n\
    \            }\n            Console . ReadLine ();\n        }\n    }\n}\n```\n\
    When the above code is compiled and executed, it produces the following result:\n\
    value of a: 10\nvalue of a: 11\nvalue of a: 12\nvalue of a: 13\nvalue of a: 14\n\
    value of a: 15\nvalue of a: 16\nvalue of a: 17\nvalue of a: 18\nvalue of a: 19\n\
    \n# Do...While Loop\nUnlike `for` and `while` loops, which test the loop condition\
    \ at the start of the loop, the `do...while` loop checks its condition at the\
    \ end of the loop. A `do...while` loop is similar to a `while` loop, except that\
    \ a `do...while` loop is guaranteed to execute at least one time.\n\n### Syntax\n\
    The syntax of a `do...while` loop in C# is:\n```csharp\ndo {statement(s);} while(\
    \ condition );\n```\nNotice that the conditional expression appears at the end\
    \ of the loop, so the `statement(s)` in the loop execute once before the condition\
    \ is tested. If the condition is true, the flow of control jumps back up to `do`,\
    \ and the `statement(s)` in the loop execute again. This process repeats until\
    \ the given condition becomes false.\n\n### Flow Diagram\n![do...while loop in\
    \ C#](image3416.jpg)\n\n### Example\n```csharp\nusing System ;\nnamespace Loops\
    \ {\n    class Program {\n        static void Main ( string [] args ) {\n    \
    \        /* local variable definition */\n            int a = 10 ;\n         \
    \   /* do loop execution */\n            do {\n                Console . WriteLine\
    \ ( \"value of a: {0}\" , a );\n                a = a + 1 ;\n            } while\
    \ ( a < 20 );\n            Console . ReadLine ();\n        }\n    }\n}\n```\n\
    When the above code is compiled and executed, it produces the following result:\n\
    value of a: 10\nvalue of a: 11\nvalue of a: 12\nvalue of a: 13\nvalue of a: 14\n\
    value of a: 15\nvalue of a: 16\nvalue of a: 17\nvalue of a: 18\nvalue of a: 19\n\
    \n# Nested for loop\nC# allows to use one loop inside another loop. Following\
    \ section shows few examples to illustrate the concept.\n\n### Syntax\nThe syntax\
    \ for a `nested for loop` statement in C# is:\n```csharp\nfor ( init; condition;\
    \ increment ) {for ( init; condition; increment ) {statement(s);}statement(s);}\n\
    ```\nThe syntax for a `nested while loop` statement in C# is:\n```csharp\nwhile(condition)\
    \ {while(condition) {statement(s);}statement(s);}\n```\nThe syntax for a `nested\
    \ do...while loop` statement in C# is:\n```csharp\ndo {statement(s);do {statement(s);}while(\
    \ condition );}while( condition );\n```\nA final note on loop nesting is that\
    \ you can put any type of loop inside of any other type of loop. For example a\
    \ `for` loop can be inside a `while` loop or vice versa.\n\n### Example\nThe following\
    \ program uses a nested for loop to find the prime numbers from 2 to 100:\n```csharp\n\
    using System ;\nnamespace Loops {\n    class Program {\n        static void Main\
    \ ( string [] args ) {\n            /* local variable definition */\n        \
    \    int i , j ;\n            for ( i = 2 ; i < 100 ; i ++) {\n              \
    \  for ( j = 2 ; j <= ( i / j ); j ++)\n                    if (( i % j ) == 0\
    \ ) break ; // if factor found, not prime\n                if ( j > ( i / j ))\
    \ Console . WriteLine ( \"{0} is prime\" , i );\n            }\n            Console\
    \ . ReadLine ();\n        }\n    }\n}\n```\nWhen the above code is compiled and\
    \ executed, it produces the following result:\n2 is prime\n3 is prime\n5 is prime\n\
    7 is prime\n11 is prime\n13 is prime\n17 is prime\n19 is prime\n23 is prime\n\
    29 is prime\n31 is prime\n37 is prime\n41 is prime\n43 is prime\n47 is prime\n\
    53 is prime\n59 is prime\n61 is prime\n67 is prime\n71 is prime\n73 is prime\n\
    79 is prime\n83 is prime\n89 is prime\n97 is prime\n\n# Loop Control Statements\n\
    Loop control statements change execution from its normal sequence. When execution\
    \ leaves a scope, all automatic objects that were created in that scope are destroyed.\
    \ C# provides the following control statements.\n\n| Sr.No. | Control Statement\
    \ & Description |\n| :--- | :--- |\n| 1 | `break` statement: Terminates the `loop`\
    \ or `switch` statement and transfers execution to the statement immediately following\
    \ the loop or switch. |\n| 2 | `continue` statement: Causes the loop to skip the\
    \ remainder of its body and immediately retest its condition prior to reiterating.\
    \ |\n\n### Break statement\nThe `break` statement in C# has following two usage:\n\
    - When the `break` statement is encountered inside a loop, the loop is immediately\
    \ terminated and program control resumes at the next statement following the loop.\n\
    - It can be used to terminate a case in the `switch` statement.\n"
  raw: 'While loop:A while  loop statement in C# repeatedly executes a target statement
    as long as a given condition is true.Syntax:The syntax of a while  loop in C#
    is −while(condition) {statement(s);}Here, statement(s)  may be a single statement
    or a block of statements. The condition  may be any expression, and true is any
    non-zero value. The loop iterates while the condition is true.When the condition
    becomes false, program control passes to the line immediately following the loop.Flow
    Diagram:![while loop in C#](image3257.jpg)Here, key point of the while  loop is
    that the loop might not ever run. When the condition is tested and the result
    is false, the loop body is skipped and the first statement after the while loop
    is executed.Example:using System ;namespace Loops {class Program {static void
    Main ( string [] args ) {/* local variable definition */int a = 10 ;/* while loop
    execution */while ( a < 20 ) {Console . WriteLine ( "value of a: {0}" , a );a
    ++;}Console . ReadLine ();}}}When the above code is compiled and executed, it
    produces the following result −value of a: 10value of a: 11value of a: 12value
    of a: 13value of a: 14value of a: 15value of a: 16value of a: 17value of a: 18value
    of a: 19For loop:A for  loop is a repetition control structure that allows you
    to efficiently write a loop that needs to execute a specific number of times.Syntax:The
    syntax of a for  loop in C# is −for ( init; condition; increment ) {statement(s);}Here
    is the flow of control in a for loop −


    *   The  init  step is executed first, and only once. This step allows you to
    declare and initialize any loop control variables. You are not required to put
    a statement here, as long as a semicolon appears.


    *   Next, the  condition  is evaluated. If it is true, the body of the loop is
    executed. If it is false, the body of the loop does not execute and flow of control
    jumps to the next statement just after the for loop.


    *   After the body of the for loop executes, the flow of control jumps back up
    to the  increment  statement. This statement allows you to update any loop control
    variables. This statement can be left blank, as long as a semicolon appears after
    the condition.


    *   The condition is now evaluated again. If it is true, the loop executes and
    the process repeats itself (body of loop, then increment step, and then again
    testing for a condition). After the condition becomes false, the for loop terminates.


    Flow Diagram:![for loop in C#](image3342.jpg)Example:using System ;namespace Loops
    {class Program {static void Main ( string [] args ) {/* for loop execution */for
    ( int a = 10 ; a < 20 ; a = a + 1 ) {Console . WriteLine ( "value of a: {0}" ,
    a );}Console . ReadLine ();}}}When the above code is compiled and executed, it
    produces the following result −value of a: 10value of a: 11value of a: 12value
    of a: 13value of a: 14value of a: 15value of a: 16value of a: 17value of a: 18value
    of a: 19Do...While Loop:Unlike for  and while  loops, which test the loop condition
    at the start of the loop, the do...while  loop checks its condition at the end
    of the loop.A do...while  loop is similar to a while loop, except that a do...while
    loop is guaranteed to execute at least one time.Syntax:The syntax of a do...while
     loop in C# is −do {statement(s);} while( condition );Notice that the conditional
    expression appears at the end of the loop, so the statement(s) in the loop execute
    once before the condition is tested.If the condition is true, the flow of control
    jumps back up to do, and the statement(s) in the loop execute again. This process
    repeats until the given condition becomes false .Flow Diagram:![do...while loop
    in C#](image3416.jpg)Example:using System ;namespace Loops {class Program {static
    void Main ( string [] args ) {/* local variable definition */int a = 10 ;/* do
    loop execution */do {Console . WriteLine ( "value of a: {0}" , a );a = a + 1 ;}while
    ( a < 20 );Console . ReadLine ();}}}When the above code is compiled and executed,
    it produces the following result −value of a: 10value of a: 11value of a: 12value
    of a: 13value of a: 14value of a: 15value of a: 16value of a: 17value of a: 18value
    of a: 19Nested for loop :C# allows to use one loop inside another loop. Following
    section shows few examples to illustrate the concept.Syntax:The syntax for a nested
    for loop  statement in C# is as follows −for ( init; condition; increment ) {for
    ( init; condition; increment ) {statement(s);}statement(s);}The syntax for a nested
    while loop  statement in C# is as follows −while(condition) {while(condition)
    {statement(s);}statement(s);}The syntax for a nested do...while loop  statement
    in C# is as follows −do {statement(s);do {statement(s);}while( condition );}while(
    condition );A final note on loop nesting is that you can put any type of loop
    inside of any other type of loop. For example a for loop can be inside a while
    loop or vice versa.Example:The following program uses a nested for loop to find
    the prime numbers from 2 to 100 −using System ;namespace Loops {class Program
    {static void Main ( string [] args ) {/* local variable definition */int i , j
    ;for ( i = 2 ; i < 100 ; i ++) {for ( j = 2 ; j <= ( i / j ); j ++)if (( i % j
    ) == 0 ) break ; // if factor found, not primeif ( j > ( i / j )) Console . WriteLine
    ( "{0} is prime" , i );}Console . ReadLine ();}}}When the above code is compiled
    and executed, it produces the following result −2 is prime3 is prime5 is prime7
    is prime11 is prime13 is prime17 is prime19 is prime23 is prime29 is prime31 is
    prime37 is prime41 is prime43 is prime47 is prime53 is prime59 is prime61 is prime67
    is prime71 is prime73 is prime79 is prime83 is prime89 is prime97 is primeLoop
    Control Statements:Loop control statements change execution from its normal sequence.
    When execution leaves a scope, all automatic objects that were created in that
    scope are destroyed.C# provides the following control statements. Click the following
    links to check their details.


    | Sr.No. | Control Statement & Description |


    | 1 | break statementTerminates the loop  or switch  statement and transfers execution
    to the statement immediately following the loop or switch. |


    | 2 | continue statementCauses the loop to skip the remainder of its body and
    immediately retest its condition prior to reiterating . |


    Break statement:The break  statement in C# has following two usage −


    *   When the  break  statement is encountered inside a loop, the loop is immediately
    terminated and program control resumes at the next statement following the loop.


    *   It can be used to terminate a case in the  switch  statement.'
