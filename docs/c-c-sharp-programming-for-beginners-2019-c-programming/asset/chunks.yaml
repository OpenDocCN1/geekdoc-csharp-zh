  trans: "\n\n-   函数重载\n-   运算符重载\n\n我们将在下一章讨论运算符重载。\n\n## 函数重载\n\n你可以在同一个作用域内为同一个函数名定义多个定义。这些定义之间必须在参数列表的类型和/或数量上有所不同。你不能重载仅在返回值不同的函数声明。\n\
    \n以下示例展示了如何使用 `System` 中的函数 `print()` 来打印不同的数据类型：\n\n```csharp\nusing System;\n\
    namespace PolymorphismApplication {\n    class Printdata {\n        void print(int\
    \ i) {\n            Console.WriteLine(\"Printing int: {0}\", i);\n        }\n\
    \        void print(double f) {\n            Console.WriteLine(\"Printing float:\
    \ {0}\", f);\n        }\n        void print(string s) {\n            Console.WriteLine(\"\
    Printing string: {0}\", s);\n        }\n        static void Main(string[] args)\
    \ {\n            Printdata p = new Printdata();\n            // Call print to\
    \ print integer\n            p.print(5);\n            // Call print to print float\n\
    \            p.print(500.263);\n            // Call print to print string\n  \
    \          p.print(\"Hello C++\");\n            Console.ReadKey();\n        }\n\
    \    }\n}\n```\n\n当上述代码编译并执行时，它会产生以下结果——\nPrinting int: 5\nPrinting float: 500.263\n\
    Printing string: Hello C++\n\n## 动态多态\n\nC# 允许你创建抽象类，用于提供接口的部分类实现。当派生类继承它时，实现完成。抽象类包含抽象方法，这些方法由派生类实现。派生类具有更专门的功能。\n\
    \n以下是关于抽象类的规则：\n- 你不能创建抽象类的实例\n- 你不能在抽象类之外声明抽象方法\n- 当类被声明为 `sealed` 时，它不能被继承，因此抽象类不能声明为\
    \ `sealed`。\n\n以下程序演示了一个抽象类——\n\n```csharp\nusing System;\nnamespace PolymorphismApplication\
    \ {\n    abstract class Shape {\n        public abstract int area();\n    }\n\
    \    class Rectangle : Shape {\n        private int length;\n        private int\
    \ width;\n        public Rectangle(int a = 0, int b = 0) {\n            length\
    \ = a;\n            width = b;\n        }\n        public override int area()\
    \ {\n            Console.WriteLine(\"Rectangle class area:\");\n            return\
    \ (width * length);\n        }\n    }\n    class RectangleTester {\n        static\
    \ void Main(string[] args) {\n            Rectangle r = new Rectangle(10, 7);\n\
    \            double a = r.area();\n            Console.WriteLine(\"Area: {0}\"\
    , a);\n            Console.ReadKey();\n        }\n    }\n}\n```\n\n当上述代码编译并执行时，它会产生以下结果——\n\
    Rectangle class area :\nArea: 70\n\n当你在类中定义了一个函数，并希望在继承类（类）中实现它时，你使用 `virtual`\
    \ 函数。虚函数可以在不同的继承类中有不同的实现，并且对这些函数的调用将在运行时决定。\n\n动态多态是通过 `abstract classes` 和 `virtual\
    \ functions` 实现的。\n\n以下程序演示了这一点——\n\n```csharp\nusing System;\nnamespace PolymorphismApplication\
    \ {\n    class Shape {\n        protected int width, height;\n        public Shape(int\
    \ a = 0, int b = 0) {\n            width = a;\n            height = b;\n     \
    \   }\n        public virtual int area() {\n            Console.WriteLine(\"Parent\
    \ class area:\");\n            return 0;\n        }\n    }\n    class Rectangle\
    \ : Shape {\n        public Rectangle(int a = 0, int b = 0) : base(a, b) {}\n\
    \        public override int area() {\n            Console.WriteLine(\"Rectangle\
    \ class area:\");\n            return (width * height);\n        }\n    }\n  \
    \  class Triangle : Shape {\n        public Triangle(int a = 0, int b = 0) : base(a,\
    \ b) {}\n        public override int area() {\n            Console.WriteLine(\"\
    Triangle class area:\");\n            return (width * height / 2);\n        }\n\
    \    }\n    class Caller {\n        public void CallArea(Shape sh) {\n       \
    \     int a;\n            a = sh.area();\n            Console.WriteLine(\"Area:\
    \ {0}\", a);\n        }\n    }\n    class Tester {\n        static void Main(string[]\
    \ args) {\n            Caller c = new Caller();\n            Rectangle r = new\
    \ Rectangle(10, 7);\n            Triangle t = new Triangle(10, 5);\n         \
    \   c.CallArea(r);\n            c.CallArea(t);\n            Console.ReadKey();\n\
    \        }\n    }\n}\n```\n\n当上述代码编译并执行时，它会产生以下结果——\nRectangle class area:\nArea:\
    \ 70\nTriangle class area:\nArea: 25\n\n## C# - 运算符重载\n\n你可以重新定义或重载 C# 中提供的大多数内置运算符。因此，程序员可以使用运算符配合用户自定义类型。重载的运算符是具有特殊名称的函数，关键字\
    \ `operator` 后面跟着所定义的运算符的符号。与任何其他函数一样，重载的运算符有返回类型和参数列表。\n\n例如，查看以下函数——\n\n```csharp\n\
    public static Box operator +(Box b, Box c) {\n    Box box = new Box();\n    box.length\
    \ = b.length + c.length;\n    box.breadth = b.breadth + c.breadth;\n    box.height\
    \ = b.height + c.height;\n    return box;\n}\n```\n\n上述函数为用户自定义类 `Box` 实现了加法运算符\
    \ (`+`)。它相加两个 `Box` 对象的属性并返回结果 `Box` 对象。\n\n### 实现运算符重载\n\n以下程序展示了完整的实现——\n\n\
    ```csharp\nusing System;\nnamespace OperatorOvlApplication {\n    class Box {\n\
    \        private double length; // Length of a box\n        private double breadth;\
    \ // Breadth of a box\n        private double height; // Height of a box\n   \
    \     public double getVolume() {\n            return length * breadth * height;\n\
    \        }\n        public void setLength(double len) {\n            length =\
    \ len;\n        }\n        public void setBreadth(double bre) {\n            breadth\
    \ = bre;\n        }\n        public void setHeight(double hei) {\n           \
    \ height = hei;\n        }\n        // Overload + operator to add two Box objects.\n\
    \        public static Box operator +(Box b, Box c) {\n            Box box = new\
    \ Box();\n            box.length = b.length + c.length;\n            box.breadth\
    \ = b.breadth + c.breadth;\n            box.height = b.height + c.height;\n  \
    \          return box;\n        }\n    }\n    class Tester {\n        static void\
    \ Main(string[] args) {\n            Box Box1 = new Box(); // Declare Box1 of\
    \ Box\n            Box Box2 = new Box(); // Declare Box2 of Box\n            Box\
    \ Box3 = new Box(); // Declare Box3 of Box\n            double volume = 0.0; //\
    \ Store the volume of a box here\n            // box 1 specification\n       \
    \     Box1.setLength(6.0);\n            Box1.setBreadth(7.0);\n            Box1.setHeight(5.0);\n\
    \            // box 2 specification\n            Box2.setLength(12.0);\n     \
    \       Box2.setBreadth(13.0);\n            Box2.setHeight(10.0);\n          \
    \  // volume of box 1\n            volume = Box1.getVolume();\n            Console.WriteLine(\"\
    Volume of Box1 : {0}\", volume);\n            // volume of box 2\n           \
    \ volume = Box2.getVolume();\n            Console.WriteLine(\"Volume of Box2 :\
    \ {0}\", volume);\n            // Add two object as follows:\n            Box3\
    \ = Box1 + Box2;\n            // volume of box 3\n            volume = Box3.getVolume();\n\
    \            Console.WriteLine(\"Volume of Box3 : {0}\", volume);\n          \
    \  Console.ReadKey();\n        }\n    }\n}\n```\n\n当上述代码编译并执行时，它会产生以下结果——\nVolume\
    \ of Box1 : 210\nVolume of Box2 : 1560\nVolume of Box3 : 5400\n\n### 可重载与不可重载运算符\n\
    \n下表描述了 C# 中运算符的重载能力——\n\n| Sr.No. | 运算符 & 描述 |\n| :--- | :--- |\n| 1 | +, -,\
    \ !, ~, ++, -- | 这些一元运算符接受一个操作数，可以重载。 |\n| 2 | +, -, *, /, % | 这些二进制运算符接受两个操作数，可以重载。\
    \ |\n| 3 | ==, !=, <, >, <=, >= | 比较运算符可以重载。 |\n| 4 | &&, || | 条件逻辑运算符不能直接重载。\
    \ |\n| 5 | +=, -=, *= /=, %= | 赋值运算符不能重载。 |\n| 6 | =, ., ?:, ->, new, is, sizeof,\
    \ typeof | 这些运算符不能重载。 |\n\n"
- fmt: "\n# Example\n\nIn the light of the above discussions, let us extend the preceding\
    \ example, and overload few more operators −using `System`;\n\n```csharp\nusing\
    \ System;\nnamespace OperatorOvlApplication {\n    class Box {\n        private\
    \ double length; // Length of a box\n        private double breadth; // Breadth\
    \ of a box\n        private double height; // Height of a box\n\n        public\
    \ double getVolume() {\n            return length * breadth * height;\n      \
    \  }\n\n        public void setLength(double len) {\n            length = len;\n\
    \        }\n\n        public void setBreadth(double bre) {\n            breadth\
    \ = bre;\n        }\n\n        public void setHeight(double hei) {\n         \
    \   height = hei;\n        }\n\n        // Overload + operator to add two Box\
    \ objects.\n        public static Box operator +(Box b, Box c) {\n           \
    \ Box box = new Box();\n            box.length = b.length + c.length;\n      \
    \      box.breadth = b.breadth + c.breadth;\n            box.height = b.height\
    \ + c.height;\n            return box;\n        }\n\n        public static bool\
    \ operator==(Box lhs, Box rhs) {\n            bool status = false;\n         \
    \   if (lhs.length == rhs.length && lhs.height == rhs.height && lhs.breadth ==\
    \ rhs.breadth) {\n                status = true;\n            }\n            return\
    \ status;\n        }\n\n        public static bool operator !=(Box lhs, Box rhs)\
    \ {\n            bool status = false;\n            if (lhs.length != rhs.length\
    \ || lhs.height != rhs.height || lhs.breadth != rhs.breadth) {\n             \
    \   status = true;\n            }\n            return status;\n        }\n\n \
    \       public static bool operator <(Box lhs, Box rhs) {\n            bool status\
    \ = false;\n            if (lhs.length < rhs.length && lhs.height < rhs.height\
    \ && lhs.breadth < rhs.breadth) {\n                status = true;\n          \
    \  }\n            return status;\n        }\n\n        public static bool operator\
    \ >(Box lhs, Box rhs) {\n            bool status = false;\n            if (lhs.length\
    \ > rhs.length && lhs.height > rhs.height && lhs.breadth > rhs.breadth) {\n  \
    \              status = true;\n            }\n            return status;\n   \
    \     }\n\n        public static bool operator <=(Box lhs, Box rhs) {\n      \
    \      bool status = false;\n            if (lhs.length <= rhs.length && lhs.height\
    \ <= rhs.height && lhs.breadth <= rhs.breadth) {\n                status = true;\n\
    \            }\n            return status;\n        }\n\n        public static\
    \ bool operator >=(Box lhs, Box rhs) {\n            bool status = false;\n   \
    \         if (lhs.length >= rhs.length && lhs.height >= rhs.height && lhs.breadth\
    \ >= rhs.breadth) {\n                status = true;\n            }\n         \
    \   return status;\n        }\n\n        public override string ToString() {\n\
    \            return String.Format(\"({0}, {1}, {2})\", length, breadth, height);\n\
    \        }\n    }\n\n    class Tester {\n        static void Main(string[] args)\
    \ {\n            Box Box1 = new Box(); // Declare Box1 of type Box\n         \
    \   Box Box2 = new Box(); // Declare Box2 of type Box\n            Box Box3 =\
    \ new Box(); // Declare Box3 of type Box\n            Box Box4 = new Box();\n\
    \            double volume = 0.0; // Store the volume of a box here\n\n      \
    \      // box 1 specification\n            Box1.setLength(6.0);\n            Box1.setBreadth(7.0);\n\
    \            Box1.setHeight(5.0);\n\n            // box 2 specification\n    \
    \        Box2.setLength(12.0);\n            Box2.setBreadth(13.0);\n         \
    \   Box2.setHeight(10.0);\n\n            // displaying the Boxes using the overloaded\
    \ ToString():\n            Console.WriteLine(\"Box 1: {0}\", Box1.ToString());\n\
    \            Console.WriteLine(\"Box 2: {0}\", Box2.ToString());\n\n         \
    \   // volume of box 1\n            volume = Box1.getVolume();\n            Console.WriteLine(\"\
    Volume of Box1 : {0}\", volume);\n\n            // volume of box 2\n         \
    \   volume = Box2.getVolume();\n            Console.WriteLine(\"Volume of Box2\
    \ : {0}\", volume);\n\n            // Add two object as follows:\n           \
    \ Box3 = Box1 + Box2;\n            Console.WriteLine(\"Box 3: {0}\", Box3.ToString());\n\
    \n            // volume of box 3\n            volume = Box3.getVolume();\n   \
    \         Console.WriteLine(\"Volume of Box3 : {0}\", volume);\n\n           \
    \ // comparing the boxes\n            if (Box1 > Box2)\n                Console.WriteLine(\"\
    Box1 is greater than Box2\");\n            else\n                Console.WriteLine(\"\
    Box1 is not greater than Box2\");\n\n            if (Box1 < Box2)\n          \
    \      Console.WriteLine(\"Box1 is less than Box2\");\n            else\n    \
    \            Console.WriteLine(\"Box1 is not less than Box2\");\n\n          \
    \  if (Box1 >= Box2)\n                Console.WriteLine(\"Box1 is greater or equal\
    \ to Box2\");\n            else\n                Console.WriteLine(\"Box1 is not\
    \ greater or equal to Box2\");\n\n            if (Box1 <= Box2)\n            \
    \    Console.WriteLine(\"Box1 is less or equal to Box2\");\n            else\n\
    \                Console.WriteLine(\"Box1 is not less or equal to Box2\");\n\n\
    \            if (Box1 != Box2)\n                Console.WriteLine(\"Box1 is not\
    \ equal to Box2\");\n            else\n                Console.WriteLine(\"Box1\
    \ is not greater or equal to Box2\");\n\n            Box4 = Box3;\n          \
    \  if (Box3 == Box4)\n                Console.WriteLine(\"Box3 is equal to Box4\"\
    );\n            else\n                Console.WriteLine(\"Box3 is not equal to\
    \ Box4\");\n\n            Console.ReadKey();\n        }\n    }\n}\n```\n\nWhen\
    \ the above code is compiled and executed, it produces the following result −\n\
    Box 1: (6, 7, 5)\nBox 2: (12, 13, 10)\nVolume of Box1 : 210\nVolume of Box2 :\
    \ 1560\nBox 3: (18, 20, 15)\nVolume of Box3 : 5400\nBox1 is not greater than Box2\n\
    Box1 is less than Box2\nBox1 is not greater or equal to Box2\nBox1 is less or\
    \ equal to Box2\nBox1 is not equal to Box2\nBox3 is equal to Box4\n\n# C# - Interfaces\n\
    \nAn interface is defined as a syntactical contract that all the classes inheriting\
    \ the interface should follow. The interface defines the 'what' part of the syntactical\
    \ contract and the deriving classes define the 'how' part of the syntactical contract.\
    \ Interfaces define properties, methods, and events, which are the members of\
    \ the interface. Interfaces contain only the declaration of the members. It is\
    \ the responsibility of the deriving class to define the members. It often helps\
    \ in providing a standard structure that the deriving classes would follow. Abstract\
    \ classes to some extent serve the same purpose, however, they are mostly used\
    \ when only few methods are to be declared by the base class and the deriving\
    \ class implements the functionalities.\n\n## Declaring Interfaces\n\nInterfaces\
    \ are declared using the `interface` keyword. It is similar to class declaration.\
    \ Interface statements are public by default. Following is an example of an interface\
    \ declaration −\n\n```csharp\npublic interface ITransactions {\n    // interface\
    \ members\n    void showTransaction();\n    double getAmount();\n}\n```\n\n##\
    \ Example\n\nThe following example demonstrates implementation of the above interface\
    \ −\n\n```csharp\nusing System.Collections.Generic;\nusing System.Linq;\nusing\
    \ System.Text;\nusing System;\n\nnamespace InterfaceApplication {\n    public\
    \ interface ITransactions {\n        // interface members\n        void showTransaction();\n\
    \        double getAmount();\n    }\n\n    public class Transaction : ITransactions\
    \ {\n        private string tCode;\n        private string date;\n        private\
    \ double amount;\n\n        public Transaction() {\n            tCode = \" \"\
    ;\n            date = \" \";\n            amount = 0.0;\n        }\n\n       \
    \ public Transaction(string c, string d, double a) {\n            tCode = c;\n\
    \            date = d;\n            amount = a;\n        }\n\n        public double\
    \ getAmount() {\n            return amount;\n        }\n\n        public void\
    \ showTransaction() {\n            Console.WriteLine(\"Transaction: {0}\", tCode);\n\
    \            Console.WriteLine(\"Date: {0}\", date);\n            Console.WriteLine(\"\
    Amount: {0}\", getAmount());\n        }\n    }\n\n    class Tester {\n       \
    \ static void Main(string[] args) {\n            Transaction t1 = new Transaction(\"\
    001\", \"8/10/2012\", 78900.00);\n            Transaction t2 = new Transaction(\"\
    002\", \"9/10/2012\", 451900.00);\n            t1.showTransaction();\n       \
    \     t2.showTransaction();\n            Console.ReadKey();\n        }\n    }\n\
    }\n```\n\nWhen the above code is compiled and executed, it produces the following\
    \ result −\nTransaction: 001\nDate: 8/10/2012\nAmount: 78900\nTransaction: 002\n\
    Date: 9/10/2012\nAmount: 451900\nThank You !\n"
  raw: 'ExampleIn the light of the above discussions, let us extend the preceding
    example, and overload few more operators −using System ;namespace OperatorOvlApplication
    {class Box {private double length ;      // Length of a boxprivate double breadth
    ;     // Breadth of a boxprivate double height ;      // Height of a boxpublic
    double getVolume () {return length * breadth * height ;}public void setLength
    ( double len ) {length = len ;}public void setBreadth ( double bre ) {breadth
    = bre ;}public void setHeight ( double hei ) {height = hei ;}// Overload + operator
    to add two Box objects.public static Box operator + ( Box b , Box c ) {Box box
    = new Box ();box . length = b . length + c . length ;box . breadth = b . breadth
    + c . breadth ;box . height = b . height + c . height ;return box ;}public static
    bool operator == ( Box lhs , Box rhs ) {bool status = false ;if ( lhs . length
    == rhs . length && lhs . height == rhs . height&& lhs . breadth == rhs . breadth
    ) {status = true ;}return status ;}public static bool operator !=( Box lhs , Box
    rhs ) {bool status = false ;if ( lhs . length != rhs . length || lhs . height
    != rhs . height ||lhs . breadth != rhs . breadth ) {status = true ;}return status
    ;}public static bool operator <( Box lhs , Box rhs ) {bool status = false ;if
    ( lhs . length < rhs . length && lhs . height < rhs . height&& lhs . breadth <
    rhs . breadth ) {status = true ;}return status ;}public static bool operator >(
    Box lhs , Box rhs ) {bool status = false ;if ( lhs . length > rhs . length &&
    lhs . height >rhs . height && lhs . breadth > rhs . breadth ) {status = true ;}return
    status ;}public static bool operator <=( Box lhs , Box rhs ) {bool status = false
    ;if ( lhs . length <= rhs . length && lhs . height<= rhs . height && lhs . breadth
    <= rhs . breadth ) {status = true ;}return status ;}public static bool operator
    >=( Box lhs , Box rhs ) {bool status = false ;if ( lhs . length >= rhs . length
    && lhs . height>= rhs . height && lhs . breadth >= rhs . breadth ) {status = true
    ;}return status ;}public override string ToString () {return String . Format (
    "({0}, {1}, {2})" , length , breadth , height );}}class Tester {static void Main
    ( string [] args ) {Box Box1 = new Box ();     // Declare Box1 of type BoxBox
    Box2 = new Box ();     // Declare Box2 of type BoxBox Box3 = new Box ();     //
    Declare Box3 of type BoxBox Box4 = new Box ();double volume = 0.0 ;      // Store
    the volume of a box here// box 1 specificationBox1 . setLength ( 6.0 );Box1 .
    setBreadth ( 7.0 );Box1 . setHeight ( 5.0 );// box 2 specificationBox2 . setLength
    ( 12.0 );Box2 . setBreadth ( 13.0 );Box2 . setHeight ( 10.0 );//displaying the
    Boxes using the overloaded ToString():Console . WriteLine ( "Box 1: {0}" , Box1
    . ToString ());Console . WriteLine ( "Box 2: {0}" , Box2 . ToString ());// volume
    of box 1volume = Box1 . getVolume ();Console . WriteLine ( "Volume of Box1 : {0}"
    , volume );// volume of box 2volume = Box2 . getVolume ();Console . WriteLine
    ( "Volume of Box2 : {0}" , volume );// Add two object as follows:Box3 = Box1 +
    Box2 ;Console . WriteLine ( "Box 3: {0}" , Box3 . ToString ());// volume of box
    3volume = Box3 . getVolume ();Console . WriteLine ( "Volume of Box3 : {0}" , volume
    );//comparing the boxesif ( Box1 > Box2 )Console . WriteLine ( "Box1 is greater
    than Box2" );elseConsole . WriteLine ( "Box1 is not greater than Box2" );if (
    Box1 < Box2 )Console . WriteLine ( "Box1 is less than Box2" );elseConsole . WriteLine
    ( "Box1 is not less than Box2" );if ( Box1 >= Box2 )Console . WriteLine ( "Box1
    is greater or equal to Box2" );elseConsole . WriteLine ( "Box1 is not greater
    or equal to Box2" );if ( Box1 <= Box2 )Console . WriteLine ( "Box1 is less or
    equal to Box2" );elseConsole . WriteLine ( "Box1 is not less or equal to Box2"
    );if ( Box1 != Box2 )Console . WriteLine ( "Box1 is not equal to Box2" );elseConsole
    . WriteLine ( "Box1 is not greater or equal to Box2" );Box4 = Box3 ;if ( Box3
    == Box4 )Console . WriteLine ( "Box3 is equal to Box4" );elseConsole . WriteLine
    ( "Box3 is not equal to Box4" );Console . ReadKey ();}}}When the above code is
    compiled and executed, it produces the following result −Box 1: (6, 7, 5)Box 2:
    (12, 13, 10)Volume of Box1 : 210Volume of Box2 : 1560Box 3: (18, 20, 15)Volume
    of Box3 : 5400Box1 is not greater than Box2Box1 is less than Box2Box1 is not greater
    or equal to Box2Box1 is less or equal to Box2Box1 is not equal to Box2Box3 is
    equal to Box4C# - InterfacesAn interface is defined as a syntactical contract
    that all the classes inheriting the interface should follow. The interface defines
    the ''what''  part of the syntactical contract and the deriving classes define
    the ''how''  part of the syntactical contract.Interfaces define properties, methods,
    and events, which are the members of the interface. Interfaces contain only the
    declaration of the members. It is the responsibility of the deriving class to
    define the members. It often helps in providing a standard structure that the
    deriving classes would follow.Abstract classes to some extent serve the same purpose,
    however, they are mostly used when only few methods are to be declared by the
    base class and the deriving class implements the functionalities.Declaring Interfaces:Interfaces
    are declared using the interface keyword. It is similar to class declaration.
    Interface statements are public by default. Following is an example of an interface
    declaration −public interface ITransactions {// interface membersvoid showTransaction
    ();double getAmount ();}ExampleThe following example demonstrates implementation
    of the above interface −using System . Collections . Generic ;using System . Linq
    ;using System . Text ;using System ;namespace InterfaceApplication {public interface
    ITransactions {// interface membersvoid showTransaction ();double getAmount ();}public
    class Transaction : ITransactions {private string tCode ;private string date ;private
    double amount ;public Transaction () {tCode = " " ;date = " " ;amount = 0.0 ;}public
    Transaction ( string c , string d , double a ) {tCode = c ;date = d ;amount =
    a ;}public double getAmount () {return amount ;}public void showTransaction ()
    {Console . WriteLine ( "Transaction: {0}" , tCode );Console . WriteLine ( "Date:
    {0}" , date );Console . WriteLine ( "Amount: {0}" , getAmount ());}}class Tester
    {static void Main ( string [] args ) {Transaction t1 = new Transaction ( "001"
    , "8/10/2012" , 78900.00 );Transaction t2 = new Transaction ( "002" , "9/10/2012"
    , 451900.00 );t1 . showTransaction ();t2 . showTransaction ();Console . ReadKey
    ();}}}When the above code is compiled and executed, it produces the following
    result −Transaction: 001Date: 8/10/2012Amount: 78900Transaction: 002Date: 9/10/2012Amount:
    451900Thank You !'
