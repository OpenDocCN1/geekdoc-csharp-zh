    \ bre) {\n            breadth = bre;\n        }\n\n        public void setHeight(double\
    \ hei) {\n            height = hei;\n        }\n\n        // 重载 + 运算符以相加两个 Box\
    \ 对象。\n        public static Box operator +(Box b, Box c) {\n            Box box\
    \ = new Box();\n            box.length = b.length + c.length;\n            box.breadth\
