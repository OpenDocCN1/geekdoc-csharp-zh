    \ - 入学者指南 初学者教程\n\nC# 是一种简单、现代、通用面向对象的编程语言，由微软在其 Anders Hejberg 领导的 .Net 中开发。本教程将教你基础\
    \ C# 编程，并带你了解与 C# 编程相关的各种高级概念。\n\n本教程将帮助你建立 C# 基础。\n\n### 适用对象：\n本教程为初学者准备，帮助他们理解基础\
    \ C# 编程。\n\n### 先决条件：\nC# 编程很大程度上基于 C 和 C++ 编程语言，因此如果你对 C 或 C++ 编程有基础了解，那么学习 C#\
    \ 将会非常有趣。\n\n"
- fmt: "\n* It is a modern, general-purpose programming language\n* It is object oriented.\n\
    * It is component oriented.\n* It is easy to learn.\n* It is a structured language.\n\
    * It produces efficient programs.\n* It can be compiled on a variety of computer\
    \ platforms.\n* It is a part of `.Net Framework`.\n\n# Strong Programming Features\
    \ of C#\nAlthough `C#` constructs closely follow traditional high-level languages,\
    \ `C` and `C++` and being an object-oriented programming language it has strong\
    \ resemblance with `Java`, it has numerous strong programming features that make\
    \ it endearing to a number of programmers worldwide. Following is the list of\
    \ few important features of `C#` −\n\n* Boolean Conditions\n* Automatic Garbage\
    \ Collection\n* Standard Library\n* Assembly Versioning\n* Properties and Events\n\
    * Delegates and Events Management\n* Easy-to-use Generics\n* Indexers\n* Conditional\
    \ Compilation\n* Simple Multithreading\n* LINQ and Lambda Expressions\n* Integration\
    \ with Windows\n\n# C# Environment\n\n## The .Net Framework\nThe `.Net framework`\
    \ is a revolutionary platform that helps you to write the following types of applications\
    \ −\n\n* Windows applications\n* Web applications\n* Web services\n\nThe `.Net\
    \ framework` applications are multi-platform applications. The framework has been\
    \ designed in such a way that it can be used from any of the following languages:\
    \ `C#`, `C++`, `Visual Basic`, `Jscript`, `COBOL`, etc. All these languages can\
    \ access the framework as well as communicate with each other. The `.Net framework`\
    \ consists of an enormous library of codes used by the client languages such as\
    \ `C#`. Following are some of the components of the `.Net framework` −\n\n* Common\
    \ Language Runtime (`CLR)\n* The .Net Framework Class Library\n* Common Language\
    \ Specification\n* Common Type System\n* Metadata and Assemblies\n* Windows Forms\n\
    * ASP.Net and ASP.Net AJAX\n* ADO.Net\n* Windows Workflow Foundation (WF)\n* Windows\
    \ Presentation Foundation\n* Windows Communication Foundation (WCF)\n* LINQ\n\n\
    ## Integrated Development Environment (IDE) for C#\nMicrosoft provides the following\
    \ development tools for `C#` programming −\n\n* Visual Studio 2019 (VS)\n* Visual\
    \ C# 2019 Express (VCE)\n* Visual Web Developer\n\nThe last two are freely available\
    \ from Microsoft official website. Using these tools, you can write all kinds\
    \ of `C#` programs from simple command-line applications to more complex applications.\
    \ You can also write `C#` source code files using a basic text editor, like `Notepad`,\
    \ and compile the code into assemblies using the command-line compiler, which\
    \ is again a part of the `.NET Framework`. `Visual C# Express` and `Visual Web\
    \ Developer Express` edition are trimmed down versions of `Visual Studio` and\
    \ has the same appearance. They retain most features of `Visual Studio`. You can\
    \ download it from [Microsoft Visual Studio](https://www.microsoft.com/visualstudio/eng/downloads).\
    \ It gets installed automatically on your machine. Note: You need an active internet\
    \ connection for installing the express edition.\n\n# Writing C# Programs on Linux\
    \ or Mac OS\nAlthough the `.NET Framework` runs on the Windows operating system,\
    \ there are some alternative versions that work on other operating systems. `Mono`\
    \ is an open-source version of the `.Net Framework` which includes a `C#` compiler\
    \ and runs on several operating systems, including various flavors of `Linux`\
    \ and `Mac OS`. Kindly check [Go Mono](http://www.go-mono.com/mono-downloads/download.html).\
    \ The stated purpose of `Mono` is not only to be able to run Microsoft `.NET`\
    \ applications cross-platform, but also to bring better development tools for\
    \ `Linux` developers. `Mono` can be run on many operating systems including `Android`,\
    \ `BSD`, `iOS`, `Linux`, `OS X`, `Windows`, `Solaris`, and `UNIX`.\n\n# C# - Program\
    \ Structure\nBefore we study basic building blocks of the `C#` programming language,\
    \ let us look at a bare minimum `C#` program structure so that we can take it\
    \ as a reference in upcoming chapters.\n\n## Creating Hello World Program\nA `C#`\
    \ program consists of the following parts:\n\n* Namespace declaration\n* A class\n\
    * Class methods\n* Class attributes\n* A Main method\n* Statements and Expressions\n\
    * Comments\n\nLet us look at a simple code that prints the words \"Hello World\"\
    :\n\n```\nusing System;\nnamespace HelloWorldApplication {\n    class HelloWorld\
    \ {\n        static void Main ( string [] args ) {\n            /* my first program\
    \ in C# */\n            Console.WriteLine(\"Hello World\");\n            Console.ReadKey();\n\
    \        }\n    }\n}\n```\n\nWhen this code is compiled and executed, it produces\
    \ the following result: Hello World\n\nLet us look at the various parts of the\
    \ given program:\n\n* The first line of the program `using System;` - the `using`\
    \ keyword is used to include the `System` namespace in the program. A program\
    \ generally has multiple `using` statements.\n* The next line has the namespace\
    \ declaration. A `namespace` is a collection of classes. The `HelloWorldApplication`\
    \ namespace contains the class `HelloWorld`.\n* The next line has a `class` declaration,\
    \ the class `HelloWorld` contains the data and method definitions that your program\
    \ uses. Classes generally contain multiple methods. Methods define the behavior\
    \ of the class. However, the `HelloWorld` class has only one method `Main`.\n\
    * The next line defines the `Main` method, which is the entry point for all `C#`\
    \ programs. The `Main` method states what the class does when executed.\n* The\
    \ next line `/*...*/` is ignored by the compiler and it is put to add comments.\n\
    * The `Main` method specifies its behavior with the statement `Console.WriteLine(\"\
    Hello World\");`. `WriteLine` is a method of the `Console` class defined in the\
    \ `System` namespace. This statement causes the message \"Hello World!\" to be\
    \ displayed on the screen.\n* The last line `Console.ReadKey();` is for the VS.NET\
    \ Users. This makes the program wait for a key press and it prevents the screen\
    \ from running and closing when the program is launched from Visual Studio.\n\n\
    It is worth to note the following points:\n\n* `C#` is case sensitive.\n* All\
    \ statements and expression must end with a semicolon (`;`).\n* The program execution\
    \ starts at the `Main` method.\n* Unlike `Java`, program file name could be different\
    \ from the class name.\n\n# Compiling and Executing the Program\nIf you are using\
    \ `Visual.Net` for compiling and executing `C#` programs, take the following steps:\n\
    \n* Start `Visual Studio`.\n* On the menu bar, choose `File -> New -> Project`.\n\
    * Choose `Visual C#` from templates, and then choose `Windows`.\n* Choose `Console\
    \ Application`.\n* Specify a name for your project and click OK button.\n* This\
    \ creates a new project in Solution Explorer.\n* Write code in the Code Editor.\n\
    * Click the `Run` button or press `F5` key to execute the project. A Command Prompt\
    \ window appears that contains the line Hello World.\n\nYou can compile a `C#`\
    \ program by using the command-line instead of the `Visual Studio IDE`:\n\n* Open\
    \ a text editor and add the above-mentioned code.\n* Save the file as `helloworld.cs`.\n\
    * Open the command prompt tool and go to the directory where you saved the file.\n\
    * Type `csc helloworld.cs` and press enter to compile your code.\n* If there are\
    \ no errors in your code, the command prompt takes you to the next line and generates\
    \ `helloworld.exe` executable file.\n* Type `helloworld` to execute your program.\n\
    * You can see the output Hello World printed on the screen.\n"
