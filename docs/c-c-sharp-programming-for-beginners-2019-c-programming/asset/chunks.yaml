  trans: "\n要获取特定平台上类型或变量的确切大小，你可以使用 `sizeof` 方法。表达式 `sizeof(type)` 生成对象或类型以字节为单位的存储大小。以下是在任何机器上获取\
    \ `int` 类型大小的示例：\n\n```csharp\nusing System;\nnamespace DataTypeApplication {\n\
    \    class Program {\n        static void Main(string [] args) {\n           \
    \ Console.WriteLine(\"Size of int: {0}\", sizeof(int));\n            Console.ReadLine();\n\
    \        }\n    }\n}\n```\n当编译并执行上述代码时，它产生以下结果：Size of int: 4。\n\n## 引用类型 (Reference\
    \ Type)\n引用类型不包含变量存储的实际数据，而是包含对变量的引用。换句话说，它们引用内存位置。通过使用多个变量，引用类型可以引用内存位置。如果内存位置中的数据被其中一个变量更改，另一个变量将自动反映此值的变化。内置引用类型的示例有：`object`、`dynamic`\
    \ 和 `string`。\n\n## 对象类型 (Object Type)\n`Object Type` 是 C# 通用类型系统 (CTS) 中所有数据类型的终极基类。`Object`\
    \ 是 `System.Object` 类的别名。对象类型可以分配任何其他类型的值，包括值类型、引用类型、预定义或自定义类型。然而，在赋值之前，需要进行类型转换。当值类型转换为对象类型时，称为`装箱\
    \ (boxing)`；另一方面，当对象类型转换为值类型时，称为`拆箱 (unboxing)`。\n\n```csharp\nobject obj;\nobj\
    \ = 100; // this is boxing\n```\n\n## 动态类型 (Dynamic Type)\n你可以在 `dynamic` 数据类型变量中存储任何类型的值。这些类型变量的类型检查发生在运行时。声明动态类型的语法为\
    \ `-dynamic <variable_name> = value;`。\n例如：\n```csharp\ndynamic d = 20;\n```\n\
    动态类型与对象类型相似，区别在于对象类型变量的类型检查在编译时进行，而动态类型变量的检查在运行时。\n\n## 字符串类型 (String Type)\n\
    `String Type` 允许你为变量分配任何字符串值。字符串类型是 `System.String` 类的别名。它派自对象类型。可以使用两种形式的字符串字面量为字符串类型赋值：带引号的和\
    \ @ 带引号的。\n例如：\n```csharp\nString str = \"C Sharp\";\n```\n@ 带引号的字符串字面量如下：\n```csharp\n\
    @ \"C Sharp\";\n```\n用户定义的引用类型是：`class`、`interface` 或 `delegate`。我们将在后面的章节中讨论这些类型。\n\
    \n## 指针类型 (Pointer Type)\n指针类型变量存储另一种类型的内存地址。C# 中的指针具有与 C 或 C++ 中的指针相同的能力。声明指针类型的语法为\
    \ `-type * identifier;`。\n例如：\n```csharp\nchar * cptr;\nint * iptr;\n```\n\n##\
    \ C# 类型转换 (C# Type Conversion)\n类型转换是将一种数据类型转换为另一种类型。它也被称为类型转换 (Type Casting)。在\
    \ C# 中，类型转换有两种形式：\n\n- **隐式类型转换**：这些转换由 C# 以类型的方式执行。例如，从较小的整数类型较大的整数类型的转换，以及从派生类到基类的转换。\n\
    - **显式类型转换**：这些转换由用户使用预定义函数显式完成。显式转换需要强制转换操作符。\n\n以下示例显示了显式类型转换：\n\n```csharp\n\
    using System;\nnamespace TypeConversionApplication {\n    class ExplicitConversion\
    \ {\n        static void Main(string [] args) {\n            double d = 5673.74;\n\
    \            int i;\n            // 将 double 转换为 int。\n            i = (int )\
    \ d;\n            Console.WriteLine(i);\n            Console.ReadLine();\n   \
    \     }\n    }\n}\n```\n当编译并执行上述代码时，它产生以下结果：-5673\n\n## C# - 类型转换方法 (C# - Type\
    \ Conversion Methods)\nC# 提供了以下内置类型转换方法：\n\n| 序号 (Sr.No.) | 方法与描述 (Methods & Description)\
    \ |\n| :--- | :--- |\n| 1 | `ToBoolean` - 在的情况下将类型转换为布尔值。 |\n| 2 | `ToByte` -\
    \ 将类型转换为字节 (byte)。 |\n| 3 | `ToChar` - 在可能的情况下将类型转换为单个 Unicode 字符。 |\n| 4 | `ToDateTime`\
    \ - 将类型（整数或字符串类型）转换为日期时间结构。 |\n| 5 | `ToDecimal` - 将浮点型或整数类型转换为小数类型 (decimal)。\
    \ |\n| 6 | `ToDouble` - 将类型转换为 double 类型。 |\n| 7 | `ToInt16` - 将类型转换为 16 位整数。\
    \ |\n| 8 | `ToInt32` - 将类型转换为 32 位整数。 |\n| 9 | `ToInt64` - 将类型转换为 64 位整数。 |\n\
    | 10 | `ToSByte` - 将类型转换为有符号字节类型。 |\n| 11 | `ToSingle` - 将类型转换为单精度浮点数类型。 |\n|\
    \ 12 | `ToString` - 将类型转换为字符串。 |\n| 13 | `ToType` - 将类型转换为指定的类型。 |\n| 14 | `ToUInt16`\
    \ - 将类型转换为无符号 int 类型。 |\n| 15 | `ToUInt32` - 将类型转换为无符号 long 类型。 |\n| 16 | `ToUInt64`\
    \ - 将类型转换为无符号大整数。 |\n\n以下示例将各种值类型转换为字符串：\n\n```csharp\nusing System;\nnamespace\
    \ TypeConversionApplication {\n    class StringConversion {\n        static void\
    \ Main(string [] args) {\n            int i = 75;\n            float f = 53.005f;\n\
    \            double d = 2345.7652;\n            bool b = true;\n            Console.WriteLine(i.ToString());\n\
    \            Console.WriteLine(f.ToString());\n            Console.WriteLine(d.ToString());\n\
    \            Console.WriteLine(b.ToString());\n            Console.ReadLine();\n\
    \        }\n    }\n}\n```\n当编译并执行上述代码时，它产生以下结果：7553.0052345.7652True\n\n## C#\
    \ - 变量 (C# - Variables)\n变量只是程序可以操作的存储区域的名称。C# 中的每个变量都有特定的类型，该类型决定了变量内存的大小和布局、内存中可以存储的值的范围以及可以应用于变量的操作\
    \ set。\n\nC# 提供的基本值类型可以分类为：\n\n| 类型 (Type) | 示例 (Example) |\n| :--- | :--- |\n\
    | 整数类型 | `sbyte`, `byte`, `short`, `ushort`, `int`, `uint`, `long`, `ulong` 和\
    \ `char` |\n| 浮点类型 | `float` 和 `double` |\n| 小数类型 | `decimal` |\n| 布尔类型 | 如分配的\
    \ `true` 或 `false` 值 |\n| 可空类型 | 可空数据类型 s |\n\n"
- fmt: "\nC# also allows defining other value types of variable such as `enum` and\
    \ reference types of variables such as `class`, which we will cover in subsequent\
    \ chapters.\n\n## Defining Variables\n\nSyntax for variable definition in C# is\
    \ -`<data_type> <variable_list>;`.\n\nHere, `data_type` must be a valid C# data\
    \ type including `char`, `int`, `float`, `double`, or any user-defined data type,\
    \ and `variable_list` may consist of one or more identifier names separated by\
    \ commas.\n\nSome valid variable definitions are shown here:\n```csharp\nint i,\
    \ j, k;\nchar c, ch;\nfloat f, salary;\ndouble d;\n```\nYou can initialize a variable\
    \ at the time of definition as `-int i = 100;`.\n\n## Initializing Variables\n\
    \nVariables are initialized (assigned a value) with an equal sign followed by\
    \ a constant expression. The general form of initialization is `-variable_name\
    \ = value;`. Variables can be initialized in their declaration. The initializer\
    \ consists of an equal sign followed by a constant expression as `-<data_type>\
    \ <variable_name> = value;`.\n\nSome examples are:\n```csharp\nint d = 3 , f =\
    \ 5 ;   /* initializing d and f. */\nbyte z = 22 ;         /* initializes z. */\n\
    double pi = 3.14159 ; /* declares an approximation of pi. */\nchar x = 'x'   \
    \      /* the variable x has the value 'x'. */\n```\nIt is a good programming\
    \ practice to initialize variables properly, otherwise sometimes program may produce\
    \ unexpected result.\n\nThe following example uses various types of variables:\n\
    ```csharp\nusing System;\nnamespace VariableDefinition {\n    class Program {\n\
    \        static void Main(string [] args) {\n            short a;\n          \
    \  int b;\n            double c;\n            /* actual initialization */\n  \
    \          a = 10;\n            b = 20;\n            c = a + b;\n            Console.WriteLine(\"\
    a = {0}, b = {1}, c = {2}\", a, b, c);\n            Console.ReadLine();\n    \
    \    }\n    }\n}\n```\nWhen the above code is compiled and executed, it produces\
    \ the following result -`a = 10, b = 20, c = 30`.\n\n## Accepting Values from\
    \ User\n\nThe `Console` class in the `System` namespace provides a function `ReadLine()`\
    \ for accepting input from the user and store it into a variable.\n\nFor example:\n\
    ```csharp\nint num;\nnum = Convert.ToInt32(Console.ReadLine());\n```\nThe function\
    \ `Convert.ToInt32()` converts the data entered by the user to `int` data type,\
    \ because `Console.ReadLine()` accepts the data in string format.\n\n## Lvalue\
    \ and Rvalue Expressions in C#\n\nThere are two kinds of expressions in C#:\n\n\
    - `lvalue`: An expression that is an `lvalue` may appear as either the left-hand\
    \ or right-hand side of an assignment.\n- `rvalue`: An expression that is an `rvalue`\
    \ may appear on the right- but not left-hand side of an assignment.\n\nVariables\
    \ are `lvalues` and hence they may appear on the left-hand side of an assignment.\
    \ Numeric literals are `rvalues` and hence they may not be assigned and can not\
    \ appear on the left-hand side.\n\nFollowing is a valid C# statement -`int g =\
    \ 20;`.\nBut following is not a valid statement and would generate compile-time\
    \ error -`-10 = 20;`.\n\n## C# - Operators\n\nAn operator is a symbol that tells\
    \ the compiler to perform specific mathematical or logical manipulations. C# has\
    \ rich set of built-in operators and provides the following type of operators:\n\
    \n- Arithmetic Operators\n- Relational Operators\n- Logical Operators\n- Bitwise\
    \ Operators\n- Assignment Operators\n- Misc Operators\n\nThis tutorial explains\
    \ the arithmetic, relational, logical, bitwise, assignment, and other operators\
    \ one by one.\n\n### Arithmetic Operators\n\nFollowing table shows all the arithmetic\
    \ operators supported by C#. Assume variable `A` holds 10 and variable `B` holds\
    \ 20 then:\n\n| Operator | Description | Example |\n| :--- | :--- | :--- |\n|\
    \ `+` | Adds two operands | `A + B = 30` |\n| `-` | Subtracts second operand from\
    \ the first | `A - B = -10` |\n| `*` | Multiplies both operands | `A * B = 200`\
    \ |\n| `/` | Divides numerator by de-numerator | `B / A = 2` |\n| `%` | Modulus\
    \ Operator and remainder of after an integer division | `B % A = 0` |\n| `++`\
    \ | Increment operator increases integer value by one | `A++ = 11` |\n| `--` |\
    \ Decrement operator decreases integer value by one | `A-- = 9` |\n\nExample:\
    \ The following example demonstrates all the arithmetic operators available in\
    \ C#-\n```csharp\nusing System;\nnamespace OperatorsAppl {\n    class Program\
    \ {\n        static void Main(string [] args) {\n            int a = 21;\n   \
    \         int b = 10;\n            int c;\n            c = a + b;\n          \
    \  Console.WriteLine(\"Line 1 - Value of c is {0}\", c);\n            c = a -\
    \ b;\n            Console.WriteLine(\"Line 2 - Value of c is {0}\", c);\n    \
    \        c = a * b;\n            Console.WriteLine(\"Line 3 - Value of c is {0}\"\
    , c);\n            c = a / b;\n            Console.WriteLine(\"Line 4 - Value\
    \ of c is {0}\", c);\n            c = a % b;\n            Console.WriteLine(\"\
    Line 5 - Value of c is {0}\", c);\n            c = a ++;\n            Console.WriteLine(\"\
    Line 6 - Value of c is {0}\", c);\n            c = a--;\n            Console.WriteLine(\"\
    Line 7 - Value of c is {0}\", c);\n            Console.ReadLine();\n        }\n\
    \    }\n}\n```\nWhen the above code is compiled and executed, it produces the\
    \ following result -`Line 1 - Value of c is 31`, `Line 2 - Value of c is 11`,\
    \ `Line 3 - Value of c is 210`, `Line 4 - Value of c is 2`, `Line 5 - Value of\
    \ c is 1`, `Line 6 - Value of c is 22`, `Line 7 - Value of c is 20`.\n\n### Relational\
    \ Operators\n\nFollowing table shows all the relational operators supported by\
    \ C#. Assume variable `A` holds 10 and variable `B` holds 20, then -\n\n| Operator\
    \ | Description | Example |\n| :--- | :--- | :--- |\n| `==` | Checks if two operands\
    \ are equal | `A == B` |\n| `!=` | Checks if two operands are not equal | `A !=\
    \ B` |\n| `>` | Checks if the left operand is greater than the right operand |\
    \ `A > B` |\n| `<` | Checks if the left operand is less than the right operand\
    \ | `A < B` |\n| `>=` | Checks if the left operand is greater than or equal to\
    \ the right operand | `A >= B` |\n| `<=` | Checks if the left operand is less\
    \ than or equal to the right operand | `A <= B` |\n\nExample: The following example\
    \ demonstrates all the relational operators in C#-\n```csharp\nusing System;\n\
    class Program {\n    static void Main(string [] args) {\n        int a = 21;\n\
    \        int b = 10;\n        if (a == b) {\n            Console.WriteLine(\"\
    Line 1 - a is equal to b\");\n        } else {\n            Console.WriteLine(\"\
    Line 1 - a is not equal to b\");\n        }\n        if (a < b) {\n          \
    \  Console.WriteLine(\"Line 2 - a is less than b\");\n        } else {\n     \
    \       Console.WriteLine(\"Line 2 - a is not less than b\");\n        }\n   \
    \     if (a > b) {\n            Console.WriteLine(\"Line 3 - a is greater than\
    \ b\");\n        } else {\n            Console.WriteLine(\"Line 3 - a is not greater\
    \ than b\");\n        }\n        a = 5;\n        b = 20;\n        if (a <= b)\
    \ {\n            Console.WriteLine(\"Line 4 - a is less than or equal to b\");\n\
    \        } else {\n            Console.WriteLine(\"Line 4 - a is not less than\
    \ or equal to b\");\n        }\n        if (b >= a) {\n            Console.WriteLine(\"\
    Line 5-b is greater than or equal to a\");\n        } else {\n            Console.WriteLine(\"\
    Line 5-b is greater than or equal to\");\n        }\n    }\n}\n```\nWhen the above\
    \ code is compiled and executed, it produces the following result -`Line 1 - a\
    \ is not equal to b`, `Line 2 - a is not less than b`, `Line 3 - a is greater\
    \ than b`, `Line 4 - a is less than or equal to b`, `Line 5-b is greater than\
    \ or equal to a`.\n\n### Logical Operators\n\nFollowing table shows all the logical\
    \ operators supported by C#. Assume variable `A` holds Boolean value true and\
    \ variable `B` holds Boolean value false, then -\n\n| Operator | Description |\
    \ Example |\n| :--- | :--- | :--- |\n| `&&` | Called Logical AND operator. If\
    \ both the operands are non zero then condition becomes true. | `(A && B)` is\
    \ false. |\n| `||` | Called Logical OR Operator. If any of the two operands is\
    \ non zero then condition becomes true. | `(A || B)` is true. |\n| `!` | Called\
    \ Logical NOT Operator. Use to reverses the logical state of its operand. If a\
    \ condition is true then Logical NOT operator will make false. | `!(A && B)` is\
    \ true. |\n"
