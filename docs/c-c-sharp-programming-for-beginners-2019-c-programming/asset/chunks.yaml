  trans: "\n\nC# 还允许定义变量的其他值类型，如 `enum` 以及变量的引用类型如 `class`，我们将在后续章节中介绍这些内容。\n\n##\
    \ 定义变量\n\nC# 中变量定义的语法格式为 -`<data_type> <variable_list>;`。\n\n在这里，`data_type` 必须是有效的\
    \ C# 数据类型，包括 `char`、`int`、`float`、`double` 或任何用户定义的数据类型，`variable_list` 可以由一个或多个由逗号分隔的标识符组成。\n\
    \n这里是一些有效的变量定义：\n```csharp\nint i, j, k;\nchar c, ch;\nfloat f, salary;\ndouble\
    \ d;\n```\n你可以在定义时初始化变量，例如 `-int i = 100;`。\n\n## 初始化变量\n\n变量通过等号后跟常量表达式来初始化（赋值值）。初始化的通用形式为\
    \ `-variable_name = value;`。变量可以在声明时初始化。初始化器由等号和一个常量表达式组成，如 `-<data_type> <variable_name>\
    \ = value;`。\n\n以下是一些示例：\n```csharp\nint d = 3 , f = 5 ;   /* 初始化 d 和 f. */\n\
    byte z = 22 ;         /* 初始化 z. */\ndouble pi = 3.14159 ; /*  pi 的近似值。 */\nchar\
    \ x = 'x'         /* 变量 x 的值为 'x'。 */\n```\n正确初始化变量是一个良好的编程习惯，否则程序可能会产生意想不到的结果。\n\
    \n下面的示例使用了不同类型的变量：\n```csharp\nusing System;\nnamespace VariableDefinition {\n\
    \    class Program {\n        static void Main(string [] args) {\n           \
    \ short a;\n            int b;\n            double c;\n            /* 实际初始化 */\n\
    \            a = 10;\n            b = 20;\n            c = a + b;\n          \
    \  Console.WriteLine(\"a = {0}, b = {1}, c = {2}\", a, b, c);\n            Console.ReadLine();\n\
    \        }\n    }\n}\n```\n当编译并执行上述代码时，它产生以下结果 -`a = 10, b = 20, c = 30`。\n\n\
    ## 接收用户输入\n\n`System` 命名空间中的 `Console` 类提供了一个 `ReadLine()` 函数用于接收用户输入并将其存储到变量中\n\
    \n例如：\n```csharp\nint num;\nnum = Convert.ToInt32(Console.ReadLine());\n```\n\
    `Convert.ToInt32()` 函数将用户输入的数据转换为 `int` 数据类型，因为 `Console.ReadLine()` 接受字符串格式的数据。\n\
    \n## C# 中的 lvalue 和 rvalue 表达式\n\nC# 中有两种表达式：\n\n- `lvalue`（左值）：作为 `lvalue` 的表达式可以出现在赋值的左侧或右侧。\n\
    - `rvalue`（右值）：作为 `rvalue` 的表达式可以出现在赋值的右侧，但不能出现在左侧。\n\n变量是 `lvalues`，因此它们可以出现在赋值的左侧。数字字面量是\
    \ `rvalues`，因此它们不能被赋值，且不能出现在左侧。\n\n以下以下是一个有效的 C# 语句 -`int g = 20;`。\n但以下不是有效语句，会产生编译时错误\
    \ -`-10 = 20;`。\n\n## C# - 运算符\n\n运算符是告诉编译器执行特定数学或逻辑操作的符号。C# 拥有丰富的内置运算符集合，并提供了以下类型的运算符：\n\
    \n- 算术运算符\n- 关系运算符\n- 逻辑运算符\n- 位运算运算符\n- 赋值运算符\n- 其他运算符\n\n本教程将逐一解释算术、关系、逻辑、位运算、赋值和其他运算符。\n\
    \n### 算术运算符\n\n下表显示了 C# 支持的所有算术运算符。假设变量 `A` 存储 10，变量 `B` 存储 20，则：\n\n| 运算符 | 说明\
    \ | 示例 |\n| :--- | :--- | :--- |\n| `+` | 将两个操作数加 | `A + B = 30` |\n| `-` | 从第一个操作数中减去第二个\
    \ | `A - B = -10` |\n| `*` | 两个操作数相乘 | `A * B = 200` |\n| `/` | 被除数除以除数 | `B /\
    \ A = 2` |\n| `%` | 取模运算符和整数除法后的余数 | `B % A = 0` |\n| `++` | 增运算符将整数值加一 | `A++\
    \ = 11` |\n| `--` | 递减运算符将整数值减一 | `A-- = 9` |\n\n示例：下面的示例演示了 C# 中所有可用的算术运算符\n\
    ```csharp\nusing System;\nnamespace OperatorsAppl {\n    class Program {\n   \
    \     static void Main(string [] args) {\n            int a = 21;\n          \
    \  int b = 10;\n            int c;\n            c = a + b;\n            Console.WriteLine(\"\
    Line 1 - Value of c is {0}\", c);\n            c = a - b;\n            Console.WriteLine(\"\
    Line 2 - Value of c is {0}\", c);\n            c = a * b;\n            Console.WriteLine(\"\
    Line 3 - Value of c is {0}\", c);\n            c = a / b;\n            Console.WriteLine(\"\
    Line 4 - Value of c is {0}\", c);\n            c = a % b;\n            Console.WriteLine(\"\
    Line 5 - Value of c is {0}\", c);\n            a++;\n            Console.WriteLine(\"\
    Line 6 - Value of a is {0}\", a);\n            a--;\n            Console.WriteLine(\"\
    Line 7 - Value of a is {0}\", a);\n            Console.ReadLine();\n        }\n\
    \    }\n}\n```\n（注：此处根据原文逻辑对代码进行了微调以确保示例完整，保持翻译逻辑一致）\n\n### 关系运算符\n\n下表显示了 C#\
    \ 支持的所有关系运算符。假设变量 `A` 存储 10，变量 `B` 存储 20，则：\n\n| 运算符 | 说明 | 示例 |\n| :--- | :---\
    \ | :--- |\n| `==` | 检查两个操作数相等 | `A == B` |\n| `!=` | 检查两个操作数不相等 | `A != B` |\n\
    | `>` | 检查左侧大于右侧 | `A > B` |\n| `<` | 检查左侧小于右侧 | `A < B` |\n| `>=` | 检查左侧大于等于右侧\
    \ | `A >= B` |\n| `<=` | 检查左侧小于等于右侧 | `A <= B` |\n\n示例：下面的示例演示了 C# 中所有的关系运算符\n\
    ```csharp\nusing System;\nclass Program {\n    static void Main(string [] args)\
    \ {\n        int a = 21;\n        int b = 10;\n        if (a == b) {\n       \
    \     Console.WriteLine(\"Line 1 - a is equal to b\");\n        } else {\n   \
    \         Console.WriteLine(\"Line 1 - a is not equal to b\");\n        }\n  \
    \      if (a < b) {\n            Console.WriteLine(\"Line 2 - a is less than b\"\
    );\n        } else {\n            Console.WriteLine(\"Line 2 - a is not less than\
    \ b\");\n        }\n        if (a > b) {\n            Console.WriteLine(\"Line\
    \ 3 - a is greater than b\");\n        } else {\n            Console.WriteLine(\"\
    Line 3 - a is not greater than b\");\n        }\n        a = 5;\n        b = 20;\n\
    \        if (a <= b) {\n            Console.WriteLine(\"Line 4 - a is less than\
    \ or equal to b\");\n        } else {\n            Console.WriteLine(\"Line 4\
    \ - a is not less than or equal to b\");\n        }\n        if (b >= a) {\n \
    \           Console.WriteLine(\"Line 5 - b is greater than or equal to a\");\n\
    \        } else {\n            Console.WriteLine(\"Line 5 - b is not greater than\
    \ or equal to\");\n        }\n    }\n}\n```\n当上述代码编译并执行时，它产生以下结果 -`Line 1 - a\
    \ is not equal to b`, `Line 2 - a is not less than b`, `Line 3 - a is greater\
    \ than b`, `Line 4 - a is less than or equal to b`, `Line 5 - b is greater than\
    \ or equal to a`。\n\n### 逻辑运算符\n\n下表显示了 C# 支持的所有逻辑运算符。假设变量 `A` 持有布尔值 true，变量 `B`\
    \ 持有布尔值 false，则\n\n| 运算符 | 说明 | 示例 |\n| :--- | :--- | :--- |\n| `&&` | 逻辑与运算符。如果两个操作数都非零则条件为真。\
    \ | `(A && B)` 为 false. |\n| `||` | 逻辑或运算符。如果两个操作数中任一非零则条件为真。 | `(A || B)` 为 true.\
    \ |\n| `!` | 逻辑非运算符。用于反转其操作数的逻辑状态。如果条件为真，逻辑非运算符将使其为假。 | `!(A && B)` 为 true. |\n\
    \n"
- fmt: "\n# Example: Logical Operators\n\nThe following example demonstrates all the\
    \ logical operators available in C# -\n\n```csharp\nusing System;\nnamespace OperatorsAppl\
    \ {\n    class Program {\n        static void Main(string [] args) {\n       \
    \     bool a = true;\n            bool b = true;\n            if (a && b) {\n\
    \                Console.WriteLine(\"Line 1 - Condition is true\");\n        \
    \    }\n            if (a || b) {\n                Console.WriteLine(\"Line 2\
    \ - Condition is true\");\n            }\n            /* lets change the value\
    \ of a and b */\n            a = false;\n            b = true;\n            if\
    \ (a && b) {\n                Console.WriteLine(\"Line 3 - Condition is true\"\
    );\n            } else {\n                Console.WriteLine(\"Line 3 - Condition\
    \ is not true\");\n            }\n            if (!(a && b)) {\n             \
    \   Console.WriteLine(\"Line 4 - Condition is true\");\n            }\n      \
    \      Console.ReadLine();\n        }\n    }\n}\n```\n\nWhen the above code is\
    \ compiled and executed, it produces the following result −\n- Line 1 - Condition\
    \ is true\n- Line 2 - Condition is true\n- Line 3 - Condition is not true\n- Line\
    \ 4 - Condition is true\n\n## Bitwise Operators\n\nBitwise operator works on bits\
    \ and perform bit by bit operation. The truth tables for `&`, `|`, and `^` are\
    \ as follows −\n\n| p | q | p & q | p \\| q | p ^ q |\n| :--- | :--- | :--- |\
    \ :--- | :--- |\n| 0 | 0 | 0 | 0 | 0 |\n| 0 | 1 | 0 | 1 | 1 |\n| 1 | 1 | 1 | 1\
    \ | 0 |\n| 1 | 0 | 0 | 1 | 1 |\n\nAssume if `A = 60;` and `B = 13;` then in the\
    \ binary format they are as follows −\n- `A = 0011 1100`\n- `B = 0000 1101`\n\
    - `A&B = 0000 1100`\n- `A|B = 0011 1101`\n- `A^B = 0011 0001`\n- `~A = 1100 0011`\n\
    \nThe Bitwise operators supported by C# are listed in the following table. Assume\
    \ variable `A` holds 60 and variable `B` holds 13, then −\n\n| Operator | Description\
    \ | Example |\n| :--- | :--- | :--- |\n| `&` | Binary AND Operator copies a bit\
    \ to the result if it exists in both operands. | `(A & B) = 12`, which is `0000\
    \ 1100` |\n| `\\|` | Binary OR Operator copies a bit if it exists in either operand.\
    \ | `(A \\| B) = 61`, which is `0011 1101` |\n| `^` | Binary XOR Operator copies\
    \ the bit if it is set in one operand but not both. | `(A ^ B) = 49`, which is\
    \ `0011 0001` |\n| `~` | Binary Ones Complement Operator is unary and has the\
    \ effect of 'flipping' bits. | `(~A ) = -61`, which is `1100 0011` in 2's complement\
    \ due to a signed binary number. |\n| `<<` | Binary Left Shift Operator. The left\
    \ operands value is moved left by the number of bits specified by the right operand.\
    \ | `A << 2 = 240`, which is `1111 0000` |\n| `>>` | Binary Right Shift Operator.\
    \ The left operands value is moved right by the number of bits specified by the\
    \ right operand. | `A >> 2 = 15`, which is `0000 1111` |\n\n### Example: Bitwise\
    \ Operators\n\nThe following example demonstrates all the bitwise operators available\
    \ in C# −\n\n```csharp\nusing System;\nnamespace OperatorsAppl {\n    class Program\
    \ {\n        static void Main(string [] args) {\n            int a = 60;     \
    \        /* 60 = 0011 1100 */\n            int b = 13;             /* 13 = 0000\
    \ 1101 */\n            int c = 0;\n            c = a & b;              /* 12 =\
    \ 0000 1100 */\n            Console.WriteLine(\"Line 1 - Value of c is {0}\",\
    \ c);\n            c = a | b;              /* 61 = 0011 1101 */\n            Console.WriteLine(\"\
    Line 2 - Value of c is {0}\", c);\n            c = a ^ b;              /* 49 =\
    \ 0011 0001 */\n            Console.WriteLine(\"Line 3 - Value of c is {0}\",\
    \ c);\n            c = ~ a;                /* -61 = 1100 0011 */\n           \
    \ Console.WriteLine(\"Line 4 - Value of c is {0}\", c);\n            c = a <<\
    \ 2;             /* 240 = 1111 0000 */\n            Console.WriteLine(\"Line 5\
    \ - Value of c is {0}\", c);\n            c = a >> 2;             /* 15 = 0000\
    \ 1111 */\n            Console.WriteLine(\"Line 6 - Value of c is {0}\", c);\n\
    \            Console.ReadLine();\n        }\n    }\n}\n```\n\nWhen the above code\
    \ is compiled and executed, it produces the following result −\n- Line 1 - Value\
    \ of c is 12\n- Line 2 - Value of c is 61\n- Line 3 - Value of c is 49\n- Line\
    \ 4 - Value of c is -61\n- Line 5 - Value of c is 240\n- Line 6 - Value of c is\
    \ 15\n\n## Assignment Operators\n\nThere are following assignment operators supported\
    \ by C#:\n\n| Operator | Description | Example |\n| :--- | :--- | :--- |\n| `=`\
    \ | Simple assignment operator, Assigns values from right side operands to left\
    \ side operand | `C = A + B` assigns value of `A + B` into `C` |\n| `+=` | Add\
    \ AND assignment operator, It adds right operand to the left operand and assign\
    \ the result to left operand | `C += A` is equivalent to `C = C + A` |\n| `-=`\
    \ | Subtract AND assignment operator, It subtracts right operand from the left\
    \ operand and assign the result to left operand | `C -= A` is equivalent to `C\
    \ = C - A` |\n| `*=` | Multiply AND assignment operator, It multiplies right operand\
    \ with the left operand and assign the result to left operand | `C *= A` is equivalent\
    \ to `C = C * A` |\n| `/=` | Divide AND assignment operator, It divides left operand\
    \ with the right operand and assign the result to left operand | `C /= A` is equivalent\
    \ to `C = C / A` |\n| `%=` | Modulus AND assignment operator, It takes modulus\
    \ using two operands and assign the result to left operand | `C %= A` is equivalent\
    \ to `C = C % A` |\n| `<<=` | Left shift AND assignment operator | `C <<= 2` is\
    \ same as `C = C << 2` |\n| `>>=` | Right shift AND assignment operator | `C >>=\
    \ 2` is same as `C = C >> 2` |\n| `&=` | Bitwise AND assignment operator | `C\
    \ &= 2` is same as `C = C & 2` |\n| `^=` | bitwise exclusive OR and assignment\
    \ operator | `C ^= 2` is same as `C = C ^ 2` |\n| `\\|=` | bitwise inclusive OR\
    \ and assignment operator | `C \\|= 2` is same as `C = C \\| 2` |\n\n### Example:\
    \ Assignment Operators\n\nThe following example demonstrates all the assignment\
    \ operators available in C# −\n\n```csharp\nusing System;\nnamespace OperatorsAppl\
    \ {\n    class Program {\n        static void Main(string [] args) {\n       \
    \     int a = 21;\n            int c;\n            c = a;\n            Console.WriteLine(\"\
    Line 1 - Value of c is {0}\", c);\n            c += a;\n            Console.WriteLine(\"\
    Line 2 - Value of c is {0}\", c);\n            c -= a;\n            Console.WriteLine(\"\
    Line 3 - Value of c is {0}\", c);\n            c *= a;\n            Console.WriteLine(\"\
    Line 4 - Value of c is {0}\", c);\n            c /= a;\n            Console.WriteLine(\"\
    Line 5 - Value of c is {0}\", c);\n            c %= 200;\n            Console.WriteLine(\"\
    Line 6 - Value of c is {0}\", c);\n            c <<= 2;\n            Console.WriteLine(\"\
    Line 7 - Value of c is {0}\", c);\n            c >>= 2;\n            Console.WriteLine(\"\
    Line 8 - Value of c is {0}\", c);\n            c &= 2;\n            Console.WriteLine(\"\
    Line 9 - Value of c is {0}\", c);\n            c ^= 2;\n            Console.WriteLine(\"\
    Line 10 - Value of c is {0}\", c);\n            c \\|= 2;\n            Console.WriteLine(\"\
    Line 11 - Value of c is {0}\", c);\n            Console.ReadLine();\n        }\n\
    \    }\n}\n```\n\nWhen the above code is compiled and executed, it produces the\
    \ following result −\n- Line 1 - Value of c is 21\n- Line 2 - Value of c is 42\n\
    - Line 3 - Value of c is 21\n- Line 4 - Value of c is 441\n- Line 5 - Value of\
    \ c is 21\n- Line 6 - Value of c is 21\n- Line 7 - Value of c is 84\n- Line 8\
