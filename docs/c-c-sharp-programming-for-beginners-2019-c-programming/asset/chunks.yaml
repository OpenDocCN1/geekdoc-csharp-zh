  trans: "\n\n# C# - 基础语法\n\n`C#` 是一种面向对象的编程语言。在面向对象编程方法论中，程序由各种对象组成，这些对象通过动作相互作用。对象可以执行的操作被称为方法。相同类型的对象被认为具有相同的类型，或者说处于同一个类中。\n\
    \n例如，让我们考虑一个 `Rectangle` 对象。它具有如 `length` 和 `width` 等属性。根据设计，它可能需要接收这些属性值的方法、计算面积的方法以及显示详情的方法。让我们来看\
    \ `Rectangle` 类实现并讨论 `C#` 基础语法：\n\n```csharp\nusing System ;\nnamespace RectangleApplication\
    \ {\nclass Rectangle {\n    // member variables\n    double length ;\n    double\
    \ width ;\n    public void Acceptdetails () {\n        length = 4.5 ;\n      \
    \  width = 3.5 ;\n    }\n    public double GetArea () {\n        return length\
    \ * width ;\n    }\n    public void Display () {\n        Console . WriteLine\
    \ ( \"Length: {0}\" , length );\n        Console . WriteLine ( \"Width: {0}\"\
    \ , width );\n        Console . WriteLine ( \"Area: {0}\" , GetArea ());\n   \
    \ }\n}\nclass ExecuteRectangle {\n    static void Main ( string [] args ) {\n\
    \        Rectangle r = new Rectangle ();\n        r . Acceptdetails ();\n    \
    \    r . Display ();\n        Console . ReadLine ();\n    }\n}\n```\n\n当上述代码编译并执行时，会产生以下结果\
    \ ——：\nLength: 4.5\nWidth: 3.5\nArea: 15.75\n\n## using 关键字\n\n任何 `C#`程序的第一个语句都是\
    \ `using System;`。`using` 关键字用于在程序中包含命名空间。程序可以包含多个 `using` 语句。\n\n## C# 中的注释\n\
    \n注释用于解释代码。编译器会忽略注释内容。`C#` 程序中的多行注释以 `/*` 开始，并字符 `*/` 结束，如下所示：\n\n```csharp\n\
    /* This program demonstrates\nThe basic syntax of C# programming\nLanguage */\n\
    ```\n\n单行注释用 `//` 符号表示。例如：\n\n```csharp\n} //end class Rectangle\n```\n\n## 成员变量\n\
    \n变量是类的属性或数据成员，用于存储数据。在前面的程序中，`Rectangle` 类有两个名为 `length` 和 `width` 的成员变量。\n\n\
    ## 成员函数\n\n函数是执行特定任务的语句集合。类的成员函数声明在类内部。我们的示例类 `Rectangle` 包含三个成员函数：`AcceptDetails`、`GetArea`\
    \ 和 `Display`。\n\n## 类实例化\n\n在前面的程序中，`ExecuteRectangle` 类包含 `Main()` 方法并实例化 `Rectangle`\
    \ 类。\n\n## 标识符\n\n标识符是用于标识类、变量、函数或任何用户定义项目的名称。在 `C#` 中命名类的基本规则如下：\n\n- 名称必须以字母开始，字母后面可以跟跟随字母、数字\
    \ (0 - 9) 或下划线。标识符的第一个字符不能是数字。\n- 它不能包含任何嵌入的空格或符号，如 `? - + ! @ # % ^ & * ( ) [\
    \ ] { } . ; : \" ' /` 和 `\\`。然而，可以使用下划线 (`_`）。\n- 它不应该是 `C#` 关键字。\n\n## C# 关键字\n\
    \n关键字是为 `C#` 编译器预定义的保留字。这些关键字不能用作标识符。然而，如果你想将这些关键字用作标识符，可以在关键字前加上 `@` 字符。在 `C#`\
    \ 中，某些标识符在上下文具有特殊含义，例如 `get` 和 `set` 被称为上下文关键字。下表列出了 `C#` 中的保留关键字和上下文关键字：\n\n\
    | 保留关键字 | | | | |\n| :--- | :--- | :--- | :--- | :--- |\n| `abstract` | `as` |\
    \ `base` | `bool` | `break` |\n| `catch` | `char` | `checked` | `class` | `continue`\
    \ |\n| `default` | `delegate` | `do` | `double` | `else` |\n| `explicit` | `extern`\
    \ | `false` | `finally` | `fixed` |\n| `foreach` | `goto` | `if` | `implicit`\
    \ | `in` |\n| `interface` | `internal` | `is` | `lock` | `long` |\n| `null` |\
    \ `object` | `operator` | `out` | `override` |\n| `private` | `protected` | `public`\
    \ | `readonly` | `ref` |\n| `sealed` | `short` | `sizeof` | `stackalloc` | `static`\
    \ |\n| `switch` | `this` | `throw` | `true` | `typeof` |\n| `ulong` | `unchecked`\
    \ | `ushort` | `using` | `virtual` |\n| `volatile` | `while` | | | |\n| 上下文关键字\
    \ | | | | |\n| `add` | `alias` | `ascending` | `descending` | `dynamic` |\n| `from`\
    \ | `get` | `global` | `group` | `into` |\n| `let` | `join` | `remove` | `select`\
    \ | `set` |\n| | | | |\n\n# C# - 数据类型\n\n`C#` 中的变量分为以下类型：\n\n- 值类型\n- 引用类型\n-\
    \ 指针类型\n\n## 值类型\n\n值类型可以被赋值。它们派自 `System.ValueType`。值类型直接包含数据。示例包括 `int`、`char`\
    \ 和 `float`，它们分别存储数字、字母和浮点数。当你声明一个 `int` 类型时，系统分配内存来存储值。下表列出了 `C#` 中可用的值类型：\n\n\
    | 类型 | 表示 | 范围 | 默认值 |\n| :--- | :--- | :--- | :--- |\n| `bool` | 布尔值 | True 或\
    \ False | False |\n| `byte` | 8 位无符号整数 | 0 to 255 | 0 |\n| `char` | 16 位 Unicode\
    \ 字符 | U+0000 to U+ffff | '\\0' |\n| `decimal` | 128 位高精度小数值 | (-7.9 x 10²⁸ 到\
    \ 7.9 x 10²⁸) | 0.0M |\n| `double` | 64 位双精度浮点类型 | (+/-)5.0 x 10^-324 到 (+/-)1.7\
    \ x 10³⁰⁸ | 0.0D |\n| `float` | 32 位单精度浮点类型 | -3.4 x 10³⁸ 到 +3.4 x 10³⁸ | 0.0F\
    \ |\n| `int` | 32 位有符号整数类型 | -2,147,483,648 to 2,147,483,647 | 0 |\n| `long` |\
    \ 64 位有符号整数类型 | -9,223,372,036,854,775,808 to 9,223,372,036,854,775,807 | 0L |\n\
    | `sbyte` | 8 位有符号整数 | -128 to 127 | 0 |\n| `short` | 16 位有符号整数 | -32,768 to 32,767\
    \ | 0 |\n| `uint` | 32 位无符号整数类型 | 0 to 4,294,967,295 | 0 |\n| `ulong` | 64 位无符号整数类型\
    \ | 0 to 18,446,744,073,709,551,615 | 0 |\n| `ushort` | 16 位无符号整数类型 | 0 to 65,535\
    \ | 0 |\n\n"
- fmt: "\nTo get the exact size of a type or a variable on a particular platform,\
    \ you can use the `sizeof` method. The expression `sizeof(type)` yields the storage\
    \ size of the object or type in bytes. Following is an example to get the size\
    \ of `int` type on any machine:\n\n```csharp\nusing System;\nnamespace DataTypeApplication\
    \ {\n    class Program {\n        static void Main(string [] args) {\n       \
    \     Console.WriteLine(\"Size of int: {0}\", sizeof(int));\n            Console.ReadLine();\n\
    \        }\n    }\n}\n```\nWhen the above code is compiled and executed, it produces\
    \ the following result: Size of int: 4.\n\n## Reference Type\nThe reference types\
    \ do not contain the actual data stored in a variable, but they contain a reference\
    \ to the variables. In other words, they refer to a memory location. Using multiple\
    \ variables, the reference types can refer to a memory location. If the data in\
    \ the memory location is changed by one of the variables, the other variable automatically\
    \ reflects this change in value. Example of built-in reference types are: `object`,\
    \ `dynamic`, and `string`.\n\n## Object Type\nThe `Object Type` is the ultimate\
    \ base class for all data types in C# Common Type System (CTS). `Object` is an\
    \ alias for `System.Object` class. The object types can be assigned values of\
    \ any other types, value types, reference types, predefined or user-defined types.\
    \ However, before assigning values, it needs type conversion. When a value type\
    \ is converted to object type, it is called `boxing` and on the other hand, when\
    \ an object type is converted to a value type, it is called `unboxing`.\n\n```csharp\n\
    object obj;\nobj = 100; // this is boxing\n```\n\n## Dynamic Type\nYou can store\
    \ any type of value in the dynamic data type variable. Type checking for these\
    \ types of variables takes place at run-time. Syntax for declaring a dynamic type\
    \ is `-dynamic <variable_name> = value;`.\nFor example:\n```csharp\ndynamic d\
    \ = 20;\n```\nDynamic types are similar to object types except that type checking\
    \ for object type variables takes place at compile time, whereas that for the\
    \ dynamic type variables takes place at run time.\n\n## String Type\nThe `String\
    \ Type` allows you to assign any string values to a variable. The string type\
    \ is an alias for the `System.String` class. It is derived from object type. The\
    \ value for a string type can be assigned using string literals in two forms:\
    \ quoted and @quoted.\nFor example:\n```csharp\nString str = \"C Sharp\";\n```\n\
    A @quoted string literal looks as follows:\n```csharp\n@ \"C Sharp\";\n```\nThe\
    \ user-defined reference types are: `class`, `interface`, or `delegate`. We will\
    \ discuss these types in later chapter.\n\n## Pointer Type\nPointer type variables\
    \ store the memory address of another type. Pointers in C# have the same capabilities\
    \ as the pointers in C or C++. Syntax for declaring a pointer type is `-type *\
    \ identifier;`.\nFor example:\n```csharp\nchar * cptr;\nint * iptr;\n```\n\n##\
    \ C# Type Conversion\nType conversion is converting one type of data to another\
    \ type. It is also known as Type Casting. In C#, type casting has two forms:\n\
    \n- **Implicit type conversion**: These conversions are performed by C# in a type-safe\
    \ manner. For example, are conversions from smaller to larger integral types and\
    \ conversions from derived classes to base classes.\n- **Explicit type conversion**:\
    \ These conversions are done explicitly by users using the pre-defined functions.\
    \ Explicit conversions require a cast operator.\n\nThe following example shows\
    \ an explicit type conversion:\n\n```csharp\nusing System;\nnamespace TypeConversionApplication\
    \ {\n    class ExplicitConversion {\n        static void Main(string [] args)\
    \ {\n            double d = 5673.74;\n            int i;\n            // cast\
    \ double to int.\n            i = (int ) d;\n            Console.WriteLine(i);\n\
    \            Console.ReadLine();\n        }\n    }\n}\n```\nWhen the above code\
    \ is compiled and executed, it produces the following result: -5673\n\n## C# -\
    \ Type Conversion Methods\nC# provides the following built-in type conversion\
    \ methods:\n\n| Sr.No. | Methods & Description |\n| :--- | :--- |\n| 1 | `ToBoolean`\
    \ - Converts a type to a Boolean value, where possible. |\n| 2 | `ToByte` - Converts\
    \ a type to a byte. |\n| 3 | `ToChar` - Converts a type to a single Unicode character,\
    \ where possible. |\n| 4 | `ToDateTime` - Converts a type (integer or string type)\
    \ to date-time structures. |\n| 5 | `ToDecimal` - Converts a floating point or\
    \ integer type to a decimal type. |\n| 6 | `ToDouble` - Converts a type to a double\
    \ type. |\n| 7 | `ToInt16` - Converts a type to a 16-bit integer. |\n| 8 | `ToInt32`\
    \ - Converts a type to a 32-bit integer. |\n| 9 | `ToInt64` - Converts a type\
    \ to a 64-bit integer. |\n| 10 | `ToSByte` - Converts a type to a signed byte\
    \ type. |\n| 11 | `ToSingle` - Converts a type to a small floating point number.\
    \ |\n| 12 | `ToString` - Converts a type to a string. |\n| 13 | `ToType` - Converts\
    \ a type to a specified type. |\n| 14 | `ToUInt16` - Converts a type to an unsigned\
    \ int type. |\n| 15 | `ToUInt32` - Converts a type to an unsigned long type. |\n\
    | 16 | `ToUInt64` - Converts a type to an unsigned big integer. |\n\nThe following\
    \ example converts various value types to string type:\n\n```csharp\nusing System;\n\
    namespace TypeConversionApplication {\n    class StringConversion {\n        static\
    \ void Main(string [] args) {\n            int i = 75;\n            float f =\
    \ 53.005f;\n            double d = 2345.7652;\n            bool b = true;\n  \
    \          Console.WriteLine(i.ToString());\n            Console.WriteLine(f.ToString());\n\
    \            Console.WriteLine(d.ToString());\n            Console.WriteLine(b.ToString());\n\
    \            Console.ReadLine();\n        }\n    }\n}\n```\nWhen the above code\
    \ is compiled and executed, it produces the following result: 7553.0052345.7652True\n\
    \n## C# - Variables\nA variable is nothing but a name given to a storage area\
    \ that our programs can manipulate. Each variable in C# has a specific type, which\
    \ determines the size and layout of the variable's memory the range of values\
    \ that can be stored within that memory and the set of operations that can be\
    \ applied to the variable.\n\nThe basic value types provided in C# can be categorized\
    \ as:\n\n| Type | Example |\n| :--- | :--- |\n| Integral types | `sbyte`, `byte`,\
    \ `short`, `ushort`, `int`, `uint`, `long`, `ulong`, and `char` |\n| Floating\
    \ point types | `float` and `double` |\n| Decimal types | `decimal` |\n| Boolean\
    \ types | `true` or `false` values, as assigned |\n| Nullable types | Nullable\
    \ data type s |\n"
