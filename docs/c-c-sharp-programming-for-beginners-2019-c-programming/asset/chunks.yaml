    \n![](image176.jpg) # C# - A Beginner’s Guide C# Tutorial for Beginners\n\nC#\
    \ is a simple, modern, general-purpose, object-oriented programming language developed\
    \ by Microsoft within its .Net initiative led by Anders Hejberg. This tutorial\
    \ will teach you basic C# programming and will also take you through various advanced\
    \ concepts related to C# programming.\n\nThis tutorial helps you to build your\
    \ base with C#.\n\n### To whom this tutorial is designed for :\nThis tutorial\
    \ has been prepared for the beginners to help them understand basic C# programming.\n\
    \n### Prerequisites :\nC# programming is very much based on C and C++ programming\
    \ languages, so if you have a basic understanding of C or C++ programming, then\
    \ it will be fun to learn C#.\n"
