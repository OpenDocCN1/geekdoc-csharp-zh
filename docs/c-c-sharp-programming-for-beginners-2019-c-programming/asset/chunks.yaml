  trans: "\n\n# 示例：逻辑运算符\n\n以下示例演示了 C# 中所有可用的逻辑运算符 -\n\n```csharp\nusing System;\n\
    namespace OperatorsAppl {\n    class Program {\n        static void Main(string\
    \ [] args) {\n            bool a = true;\n            bool b = true;\n       \
    \     if (a && b) {\n                Console.WriteLine(\"Line 1 - Condition is\
    \ true\");\n            }\n            if (a || b) {\n                Console.WriteLine(\"\
    Line 2 - Condition is true\");\n            }\n            /* lets change the\
    \ value of a and b */\n            a = false;\n            b = true;\n       \
    \     if (a && b) {\n                Console.WriteLine(\"Line 3 - Condition is\
    \ true\");\n            } else {\n                Console.WriteLine(\"Line 3 -\
    \ Condition is not true\");\n            }\n            if (!(a && b)) {\n   \
    \             Console.WriteLine(\"Line 4 - Condition is true\");\n           \
    \ }\n            Console.ReadLine();\n        }\n    }\n}\n```\n\n当上述代码被编译并执行时，会产生以下结果\
    \ −\n- Line 1 - Condition is true\n- Line 2 - Condition is true\n- Line 3 - Condition\
    \ is not true\n- Line 4 - Condition is true\n\n## 位运算符\n\n位运算符对位（bits）操作并执行逐位操作。`&`、`|`\
    \ 和 `^` 的真值表如下 −\n\n| p | q | p & q | p \\| q | p ^ q |\n| :--- | :--- | :---\
    \ | :--- | :--- |\n| 0 | 0 | 0 | 0 | 0 |\n| 0 | 1 | 0 | 1 | 1 |\n| 1 | 1 | 1 |\
    \ 1 | 0 |\n| 1 | 0 | 0 | 1 | 1 |\n\n假设 `A = 60;` 且 `B = 13;`，那么在二进制格式下如下 −\n-\
    \ `A = 0011 1100`\n- `B = 0000 1101`\n- `A&B = 0000 1100`\n- `A|B = 0011 1101`\n\
    - `A^B = 0011 0001`\n- `~A = 1100 0011`\n\nC# 支持的位运算符如表所示。假设变量 `A` 存储 60 变量 `B`\
    \ 存储 13，则 −\n\n| Operator | Description | Example |\n| :--- | :--- | :--- |\n\
    | `&` | 二进制与运算符。如果位在两个操作数中都存在，则将其复制到结果中。 | `(A & B) = 12`，即 `0000 1100` |\n| `\\\
    |` | 二进制或运算符。如果位在任一操作数中存在，则将其复制。 | `(A \\| B) = 61`，即 `0011 1101` |\n| `^` | 二进制异或运算符。如果位在其中一个操作数中设置但不同不同，则复制该位。\
    \ | `(A ^ B) = 49`，即 `0011 0001` |\n| `~` | 二进制取反运算符。是单元运算符，具有“翻转”位的效果。 | `(~A\
    \ ) = -61`，由于是有符号二进制数，在补码表示法中为 `1100 0011`。 |\n| `<<` | 二进制左移运算符。左操作数的值根据右操作数指定的位数向左移动。\
    \ | `A << 2 = 240`，即 `1111 0000` |\n| `>>` | 二进制右移运算符。左操作数的值根据右操作数指定的位数向右移动。 |\
    \ `A >> 2 = 15`，即 `0000 1111` |\n\n### 示例：位运算符\n\n以下示例演示了 C# 中所有可用的位运算符 −\n\n\
    ```csharp\nusing System;\nnamespace OperatorsAppl {\n    class Program {\n   \
    \     static void Main(string [] args) {\n            int a = 60;            \
    \ /* 60 = 0011 1100 */\n            int b = 13;             /* 13 = 0000 1101\
    \ */\n            int c = 0;\n            c = a & b;              /* 12 = 0000\
    \ 1100 */\n            Console.WriteLine(\"Line 1 - Value of c is {0}\", c);\n\
    \            c = a | b;              /* 61 = 0011 1101 */\n            Console.WriteLine(\"\
    Line 2 - Value of c is {0}\", c);\n            c = a ^ b;              /* 49 =\
    \ 0011 0001 */\n            Console.WriteLine(\"Line 3 - Value of c is {0}\",\
    \ c);\n            c = ~ a;                /* -61 = 1100 0011 */\n           \
    \ Console.WriteLine(\"Line 4 - Value of c is {0}\", c);\n            c = a <<\
    \ 2;             /* 240 = 1111 0000 */\n            Console.WriteLine(\"Line 5\
    \ - Value of c is {0}\", c);\n            c = a >> 2;             /* 15 = 0000\
    \ 1111 */\n            Console.WriteLine(\"Line 6 - Value of c is {0}\", c);\n\
    \            Console.ReadLine();\n        }\n    }\n}\n```\n\n上述代码被编译并执行时，产生以下结果\
    \ −\n- Line 1 - Value of c is 12\n- Line 2 - Value of c is 61\n- Line 3 - Value\
    \ of c is 49\n- Line 4 - Value of c is -61\n- Line 5 - Value of c is 240\n- Line\
    \ 6 - Value of c is 15\n\n## 赋值运算符\n\nC# 支持以下赋值运算符：\n\n| Operator | Description\
    \ | Example |\n| :--- | :--- | :--- |\n| `=` | 简单赋值运算符。将右操作数的值赋给左操作数。 | `C = A\
    \ + B` 将值赋值给 `C` |\n| `+=` | 加赋值运算符。将右操作数加到左操作数并将结果赋给左操作数。 | `C += A` 等于 `C =\
    \ C + A` |\n| `-=` | 减赋值运算符。从左操作数减去右操作数并将结果赋给左操作数。 | `C -= A` 等于 `C = C - A` |\n\
    | `*=` | 乘赋值运算符。将左操作数乘以右操作数并将结果赋给左操作数。 | `C *= A` 等于 `C = C * A` |\n| `/=` | 除赋值运算符。将左操作数除以右操作数并将结果赋给左操作数。\
    \ | `C /= A` 等于 `C = C / A` |\n| `%=` | 取模赋值运算符。对两个操作数取模并将结果赋给左操作数。 | `C %= A`\
    \ 等于 `C = C % A` |\n| `<<=` | 左移赋值运算符。 | `C <<= 2` 等于 `C = C << 2` |\n| `>>=`\
    \ | 右移赋值运算符。 | `C >>= 2` 等于 `C = C >> 2` |\n| `&=` | 位与赋值运算符。 | `C &= 2` 等于 `C\
    \ = C & 2` |\n| `^=` | 位异或赋值运算符。 | `C ^= 2` 等于 `C = C ^ 2` |\n| `\\|=` | 位或赋值运算符。\
    \ | `C \\|= 2` 等于 `C = C \\| 2` |\n\n### 示例：赋值运算符\n\n以下示例演示了 C# 中所有可用的赋值运算符 −\n\
    \n```csharp\nusing System;\nnamespace OperatorsAppl {\n    class Program {\n \
    \       static void Main(string [] args) {\n            int a = 21;\n        \
    \    int c;\n            c = a;\n            Console.WriteLine(\"Line 1 - Value\
    \ of c is {0}\", c);\n            c += a;\n            Console.WriteLine(\"Line\
    \ 2 - Value of c is {0}\", c);\n            c -= a;\n            Console.WriteLine(\"\
    Line 3 - Value of c is {0}\", c);\n            c *= a;\n            Console.WriteLine(\"\
    Line 4 - Value of c is {0}\", c);\n            c /= a;\n            Console.WriteLine(\"\
    Line 5 - Value of c is {0}\", c);\n            c %= 200;\n            Console.WriteLine(\"\
    Line 6 - Value of c is {0}\", c);\n            c <<= 2;\n            Console.WriteLine(\"\
    Line 7 - Value of c is {0}\", c);\n            c >>= 2;\n            Console.WriteLine(\"\
    Line 8 - Value of c is {0}\", c);\n            c &= 2;\n            Console.WriteLine(\"\
    Line 9 - Value of c is {0}\", c);\n            c ^= 2;\n            Console.WriteLine(\"\
    Line 10 - Value of c is {0}\", c);\n            c \\|= 2;\n            Console.WriteLine(\"\
    Line 11 - Value of c is {0}\", c);\n            Console.ReadLine();\n        }\n\
    \    }\n}\n```\n\n上述代码被编译并执行时，会产生以下结果 −\n- Line 1 - Value of c is 21\n- Line 2\
    \ - Value of c is 42\n- Line 3 - Value of c is 21\n- Line 4 - Value of c is 441\n\
    - Line 5 - Value of c is 21\n- Line 6 - Value of c is 21\n- Line 7 - Value of\
    \ c is 84\n- Line 8 - Value of c is 21\n- Line 9 - Value of c is 0\n- Line 10\
    \ - Value of c is 2\n- Line 11 - Value of c is 2\n\n## 杂运算符\n\nC# 还支持其他重要的运算符，包括\
    \ `sizeof`、`typeof` 和 `? :`。\n\n| Operator | Description | Example |\n| :--- |\
    \ :--- | :--- |\n| `sizeof()` | 返回数据类型的大小。 | `sizeof(int)`, 返回 4。 |\n| `typeof()`\
    \ | 返回类的类型。 | `typeof(StreamReader)` |\n| `&` | 返回变量的地址。 | `&a` 返回变量的实际地址。 |\n\
    | `*` | 变量指针。 | `*a` 创建一个指向变量 `a` 的指针。 |\n| `? :` | 条件表达式 | 如果条件为真？返回值 X：否则返回值\
    \ Y |\n| `is` | 判断对象是否属于特定类型。 | `If( Ford is Car)` // 检查 Ford 是否是 Car 类的对象。 |\n\
    | `as` | 转换失败时不抛出异常。 | `Object obj = new StringReader(\"Hello\");StringReader\
    \ r = obj as StringReader;` |\n\n"
- fmt: "\n# Example\n\n```csharp\nusing System;namespace OperatorsAppl {\nclass Program\
    \ {\n    static void Main ( string [] args ) {\n        /* example of sizeof operator\
    \ */\n        Console . WriteLine ( \"The size of int is {0}\" , sizeof ( int\
    \ ));\n        Console . WriteLine ( \"The size of short is {0}\" , sizeof ( short\
    \ ));\n        Console . WriteLine ( \"The size of double is {0}\" , sizeof (\
    \ double ));\n        /* example of ternary operator */\n        int a , b ;\n\
    \        a = 10 ;\n        b = ( a == 1 ) ? 20 : 30 ;\n        Console . WriteLine\
    \ ( \"Value of b is {0}\" , b );\n        b = ( a == 10 ) ? 20 : 30 ;\n      \
    \  Console . WriteLine ( \"Value of b is {0}\" , b );\n        Console . ReadLine\
    \ ();\n    }\n}}\n```\n\nWhen the above code is compiled and executed, it produces\
    \ the following result:\n−The size of int is 4\nThe size of short is 2\nThe size\
    \ of double is 8\nValue of b is 30\nValue of b is 20\n\n# Operator Precedence\
    \ in C#\n\nOperator precedence determines the grouping of terms in an expression.\
    \ This affects evaluation of an expression. Certain operators have higher precedence\
    \ than others; for example, the multiplication operator has higher precedence\
    \ than the addition operator.\n\nFor example `x = 7 + 3 * 2;`; here, `x` is assigned\
    \ 13, not 20 because operator `*` has higher precedence than `+`, so the first\
    \ evaluation takes place for `3*2` and then `7` is added into it.\n\nHere, operators\
    \ with the highest precedence appear at the top of the table, those with the lowest\
    \ appear at the bottom. Within an expression, higher precedence operators are\
    \ evaluated first.\n\n| Category | Operator | Associativity |\n| :--- | :--- |\
    \ :--- |\n| Postfix | `() [] -> . ++ - -` | Left to right |\n| Unary | `+ - !\
    \ ~ ++ - - (type)* & sizeof` | Right to left |\n| Multiplicative | `* / %` | Left\
    \ to right |\n| Additive | `+ -` | Left to right |\n| Shift | `<< >>` | Left to\
    \ right |\n| Relational | `< <= > >=` | Left to right |\n| Equality | `== !=`\
    \ | Left to right |\n| Bitwise AND | `&` | Left to right |\n| Bitwise XOR | `^`\
    \ | Left to right |\n| Bitwise OR | `|` | Left to right |\n| Logical AND | `&&`\
    \ | Left to right |\n| Logical OR | `||` | Left to right |\n| Conditional | `?:`\
    \ | Right to left |\n| Assignment | `= += -= *= /= %= >>= <<= &= ^= |==` | Right\
    \ to left |\n| Comma | `,` | Left to right |\n\n# Example\n\n```csharp\nusing\
    \ System;namespace OperatorsAppl {\nclass Program {\n    static void Main ( string\
    \ [] args ) {\n        int a = 20 ;\n        int b = 10 ;\n        int c = 15\
    \ ;\n        int d = 5 ;\n        int e ;\n        e = ( a + b ) * c / d ; //\
    \ ( 30 * 15 ) / 5\n        Console . WriteLine ( \"Value of (a + b) * c / d is\
    \ : {0}\" , e );\n        e = (( a + b ) * c ) / d ; // ( 30 * 15 ) / 5\n    \
    \    Console . WriteLine ( \"Value of ((a + b) * c) / d is  : {0}\" , e );\n \
    \       e = ( a + b ) * ( c / d ); // ( 30 ) * (15/5)\n        Console . WriteLine\
    \ ( \"{0}\", e);\n        e = a + ( b * c ) / d ; // 20 + (150/5)\n        Console\
    \ . WriteLine ( \"{0}\", e);\n        Console . ReadLine ();\n    }\n}}\n```\n\
    \nWhen the above code is compiled and executed, it produces the following result:\n\
    Value of (a + b) * c / d is : 90\nValue of ((a + b) * c) / d is  : 90\n\n# C#\
    \ - Decision Making\n\nDecision making structures requires the programmer to specify\
    \ one or more conditions to be evaluated or tested by the program, along with\
    \ a statement or statements to be executed if the condition is determined to be\
    \ true, and optionally, other statements to be executed if the condition is determined\
    \ to be false.\n\nFollowing is the general form of a typical decision making structure\
    \ found in most of the programming languages:\n![Decision making statements in\
    \ C#](image2607.jpg)\n\nC# provides following types of decision making statements.\
    \ Click the following links to check their detail.\n\n| Sr.No. | Statement & Description\
    \ |\n| :--- | :--- |\n| 1 | if statement | An `if` statement consists of a boolean\
    \ expression followed by one or more statements. |\n| 2 | if...else statement\
    \ | An `if` statement can be followed by an optional `else` statement, which executes\
    \ when the boolean expression is false. |\n| 3 | nested if statements | You can\
    \ use one `if` or `else if` statement inside another `if` or `else if` statement(s).\
    \ |\n| 4 | switch statement | A `switch` statement allows a variable to be tested\
    \ for equality against a list of values. |\n| 5 | nested switch statements | You\
    \ can use one `switch` statement inside another `switch` statement(s). |\n\n##\
    \ If Statement\n\nAn `if` statement consists of a boolean expression followed\
    \ by one or more statements.\n\n### Syntax\nThe syntax of an `if` statement in\
    \ C# is:\n`if(boolean_expression) {/* statement(s) will execute if the boolean\
    \ expression is true */}`\n\nIf the boolean expression evaluates to `true`, then\
    \ the block of code inside the `if` statement is executed. If boolean expression\
    \ evaluates to `false`, then the first set of code after the end of the `if` statement\
    \ (after the closing curly brace) is executed.\n\n### Flow Diagram:\n![C# if statement](image2675.jpg)\n\
    \n### Example\n```csharp\nusing System;namespace DecisionMaking {\nclass Program\
    \ {\n    static void Main ( string [] args ) {\n        /* local variable definition\
    \ */\n        int a = 10 ;\n        /* check the boolean condition using if statement\
    \ */\n        if ( a < 20 ) {\n            /* if condition is true then print\
    \ the following */\n            Console . WriteLine ( \"a is less than 20\" );\n\
    \        }\n        Console . WriteLine ( \"value of a is : {0}\" , a );\n   \
    \     Console . ReadLine ();\n    }\n}}\n```\nWhen the above code is compiled\
    \ and executed, it produces the following result:\na is less than 20;\nvalue of\
    \ a is : 10\n\n## if...else statement\n\nAn `if` statement can be followed by\
    \ an optional `else` statement, which executes when the boolean expression is\
    \ false.\n\n### Syntax\nThe syntax of an `if...else` statement in C# is:\n`if(boolean_expression)\
    \ {/* statement(s) will execute if the boolean expression is true */} else {/*\
    \ statement(s) will execute if the boolean expression is false */}`\n\nIf the\
    \ boolean expression evaluates to `true`, then the `if` block of code is executed,\
    \ otherwise `else` block of code is executed.\n\n### Flow Diagram:\n![C# if...else\
    \ statement](image2740.jpg)\n\n### Example\n```csharp\nusing System;namespace\
    \ DecisionMaking {\nclass Program {\n    static void Main ( string [] args ) {\n\
    \        /* local variable definition */\n        int a = 100 ;\n        /* check\
    \ the boolean condition */\n        if ( a < 20 ) {\n            /* if condition\
