  trans: "\n\n| # | 方法 | 说明 |\n| :--- | :--- | :--- |\n| 13 | `Sort(Array)` | 使用 `Array`\
    \ 中每个元素的 `IComparable` 实现对整个一维 `Array` 元素元素进行排序。 |\n| 14 | `ToString()` | 返回表示当前对象的字符串。（继承自\
    \ `Object`。） |\n\n如需获取 `Array` 类属性和方法的完整列表，请参阅关于 C# 的微软文档。\n\n### 示例\n以下程序演示了\
    \ `Array` 类某些方法的使用：\n\n```csharp\nusing System;\nnamespace ArrayApplication {\n\
    \    class MyArray {\n        static void Main(string[] args) {\n            int[]\
    \ list = { 34, 72, 13, 44, 25, 30, 10 };\n            int[] temp = list;\n   \
    \         Console.Write(\"Original Array: \");\n            foreach (int i in\
    \ list) {\n                Console.Write(i + \" \");\n            }\n        \
    \    Console.WriteLine();\n            // reverse the array\n            Array.Reverse(temp);\n\
    \            Console.Write(\"Reversed Array: \");\n            foreach (int i\
    \ in temp) {\n                Console.Write(i + \" \");\n            }\n     \
    \       Console.WriteLine();\n            //sort the array\n            Array.Sort(list);\n\
    \            Console.Write(\"Sorted Array: \");\n            foreach (int i in\
    \ list) {\n                Console.Write(i + \" \");\n            }\n        \
    \    Console.WriteLine();\n            Console.ReadKey();\n        }\n    }\n\
    }\n```\n\n当上述代码编译并执行时，将产生以下结果：\n```\nOriginal Array: 34 72 13 44 25 30 10\nReversed\
    \ Array: 10 30 25 44 13 72 34\nSorted Array: 10 13 25 30 34 44 72\n```\n\n# C#\
    \ - 字符串\n在 C# 中，你可以将字符串作为字符数组，但更常见的做法是使用 `string` 关键字来声明字符串变量。`string` 关键字是 `System.String`\
    \ 类的别名。\n\n### 创建字符串对象\n你可以使用以下方法之一创建字符串对象：\n- 通过将字符串字面量赋值给 `String` 变量\n- 使用\
    \ `String` 类构造函数\n- 使用字符串拼接运算符 (`+`)\n- 通过检索属性或调用返回字符串的方法\n- 通过调用格式化方法将值或对象转换为字符串表示\n\
    \n以下示例演示了这一点：\n\n```csharp\nusing System;\nnamespace StringApplication {\n   \
    \ class Program {\n        static void Main(string[] args) {\n            //from\
    \ string literal and string concatenation\n            string fname, lname;\n\
    \            fname = \"Rowan\";\n            lname = \"Atkinson\";\n         \
    \   char[] letters = { 'H', 'e', 'l', 'l', 'o' };\n            string[] sarray\
    \ = { \"Hello\", \"From\", \"C#\", \"Tutorial\" };\n            string fullname\
    \ = fname + lname;\n            Console.WriteLine(\"Full Name: {0}\", fullname);\n\
    \            //by using string constructor\n            char[] greeting_chars\
    \ = { 'H', 'e', 'l', 'l', 'o' };\n            string greetings = new string(greeting_chars);\n\
    \            Console.WriteLine(\"Greetings: {0}\", greetings);\n            //methods\
    \ returning string\n            string[] msg_parts = { \"Hello\", \"From\", \"\
    C#\", \"Tutorial\" };\n            string message = String.Join(\" \", sarray);\n\
    \            Console.WriteLine(\"Message: {0}\", message);\n            //formatting\
    \ method to convert a value\n            DateTime waiting = new DateTime(2012,\
    \ 10, 10, 17, 58, 1);\n            string chat = String.Format(\"Message sent\
    \ at {0:t} on {0:D}\", waiting);\n            Console.WriteLine(\"Message: {0}\"\
    , chat);\n        }\n    }\n}\n```\n\n当上述代码编译并执行时，将产生以下结果：\n```\nFull Name: RowanAtkinson\n\
    Greetings: Hello\nMessage: Hello From C#\nMessage: Message sent at 5:58 PM on\
    \ Wednesday, October 10, 2012\n```\n\n### String 类的属性\n`String` 类有以下两个属性：\n\n\
    | 序号 | 属性 & 说明 |\n| :--- | :--- |\n| 1 | `Chars` - 获取当前 `String` 对象中指定位置的 `Char`\
    \ 对象。 |\n| 2 | `Length` - 获取当前 `String` 对象中的字符数。 |\n\n### String 类的方法\n`String`\
    \ 类有许多方法可以帮助你处理字符串对象。下表提供了一些最常用的方法。下面是 `String` 类的方法列表。你可以访问 MSDN 库获取完整的方法列表和\
    \ `String` 类的构造函数。\n\n### 示例\n以下示例演示了上述某些方法：\n\n#### 比较字符串\n```csharp\nusing System;\n\
    namespace StringApplication {\n    class StringProg {\n        static void Main(string[]\
    \ args) {\n            string str1 = \"This is test\";\n            string str2\
    \ = \"This is text\";\n            if (String.Compare(str1, str2) == 0) {\n  \
    \              Console.WriteLine(str1 + \" and \" + str2 + \" are equal.\");\n\
    \            } else {\n                Console.WriteLine(str1 + \" and \" + str2\
    \ + \" are not equal.\");\n            }\n            Console.ReadKey();\n   \
    \     }\n    }\n}\n```\n结果：\n```\nThis is test and This is text are not equal.\n\
    ```\n\n#### 字符串包含字符串\n```csharp\nusing System;\nnamespace StringApplication {\n\
    \    class StringProg {\n        static void Main(string[] args) {\n         \
    \   string str = \"This is test\";\n            if (str.Contains(\"test\")) {\n\
    \                Console.WriteLine(\"The sequence 'test' was found.\");\n    \
    \        }\n            Console.ReadKey();\n        }\n    }\n}\n```\n结果：\n```\n\
    The sequence 'test' was found.\n```\n\n#### 获取子字符串\n```csharp\nusing System;\n\
    namespace StringApplication {\n    class StringProg {\n        static void Main(string[]\
    \ args) {\n            string str = \"Last night I dreamt of San Pedro\";\n  \
    \          Console.WriteLine(str);\n            string substr = str.Substring(23);\n\
    \            Console.WriteLine(substr);\n        }\n    }\n}\n```\n结果：\n```\n\
    San Pedro\n```\n\n#### 并字符串\n```csharp\nusing System;\nnamespace StringApplication\
    \ {\n    class StringProg {\n        static void Main(string[] args) {\n     \
    \       string[] starray = {\n                \"Down the way nights are dark\"\
    ,\n                \"And the sun shines daily on the mountain top\",\n       \
    \         \"I took a trip on a sailing ship\",\n                \"And when I reached\
    \ Jamaica\",\n                \"I made a stop\"\n            };\n            string\
    \ str = String.Join(\"\\n\", starray);\n            Console.WriteLine(str);\n\
    \        }\n    }\n}\n```\n结果：\n```\nDown the way nights are dark\nAnd the sun\
    \ shines daily on the mountain top\nI took a trip on a sailing ship\nAnd when\
    \ I reached Jamaica\nI made a stop\n```\n\n# C# - 类\n当你定义一个类时，你是在为一种数据类型定义一个蓝图。这并没有实际定义任何数据，但它定义了类名的含义。也就是说，类的对象包含什么，以及可以在该对象上执行哪些操作。对象是类的实例。构成类的方法和变量被称为类的成员。\n\
    \n### 定义类\n类的定义以 `class` 关键字开始，后面紧跟类名；类体由一对大括号包围。以下是类定义的通用形式：\n\n```csharp\naccess_specifier\
    \ class class_name {\n    // member variables\n    access_specifier <data type>\
    \ variable1;\n    access_specifier <data type> variable2;\n    ...\n    access_specifier\
    \ <data type> variableN;\n    // member methods\n    access_specifier <return\
    \ type> method1(parameter_list) {\n        // method body\n    }\n    access_specifier\
    \ <return type> method2(parameter_list) {\n        // method body\n    }\n   \
    \ ...\n    access_specifier <return type> methodN(parameter_list) {\n        //\
    \ method body\n    }\n}\n```\n\n### 注意事项\n- 访问修饰符规定了成员以及类本身的访问规则。如果未提及，则类类型的默认访问修饰符为\
    \ `internal`。成员的默认访问权限为 `private`。\n- 数据类型指定变量的类型，返回类型指定方法返回的数据类型（如果有的话）。\n- 要访问类成员，你使用点运算符\
    \ (`.`)。\n- 点运算符将对象的名称与成员的名称连接起来。\n\n"
- fmt: "\nThe following example illustrates the concepts discussed so far:\n\n```csharp\n\
    using System ;\nnamespace BoxApplication {\n    class Box {\n        public double\
    \ length ;    // Length of a box\n        public double breadth ;   // Breadth\
    \ of a box\n        public double height ;    // Height of a box\n    }\n    class\
    \ Boxtester {\n        static void Main ( string [] args ) {\n            Box\
    \ Box1 = new Box ();    // Declare Box1 of type Box\n            Box Box2 = new\
    \ Box ();    // Declare Box2 of type Box\n            double volume = 0.0 ;  \
    \    // Store the volume of a box here\n            // box 1 specification\n \
    \           Box1 . height = 5.0 ;\n            Box1 . length = 6.0 ;\n       \
    \     Box1 . breadth = 7.0 ;\n            // box 2 specification\n           \
    \ Box2 . height = 10.0 ;\n            Box2 . length = 12.0 ;\n            Box2\
    \ . breadth = 13.0 ;\n            // volume of box 1\n            volume = Box1\
    \ . height * Box1 . length * Box1 . breadth ;\n            Console . WriteLine\
    \ ( \"Volume of Box1 : {0}\" ,  volume );\n            // volume of box 2\n  \
    \          volume = Box2 . height * Box2 . length * Box2 . breadth ;\n       \
    \     Console . WriteLine ( \"Volume of Box2 : {0}\" , volume );\n           \
    \ Console . ReadKey ();\n        }\n    }\n}\n```\n\nWhen the above code is compiled\
    \ and executed, it produces the following result:\nVolume of Box1 : 210\nVolume\
    \ of Box2 : 1560\n\n## Member Functions and Encapsulation\n\nA member function\
    \ of a class is a function that has its definition or its prototype within the\
    \ class definition similar to any other variable. It operates on any object of\
    \ the class of which it is a member, and has access to all the members of a class\
    \ for that object.\n\nMember variables are the attributes of an object (from design\
    \ perspective) and they are kept private to implement encapsulation. These variables\
    \ can only be accessed using the public member functions.\n\nLet us put above\
    \ concepts to set and get the value of different class members in a class:\n\n\
    ```csharp\nusing System ;\nnamespace BoxApplication {\n    class Box {\n     \
    \   private double length ;    // Length of a box\n        private double breadth\
    \ ;   // Breadth of a box\n        private double height ;    // Height of a box\n\
    \        public void setLength ( double len ) {\n            length = len ;\n\
    \        }\n        public void setBreadth ( double bre ) {\n            breadth\
    \ = bre ;\n        }\n        public void setHeight ( double hei ) {\n       \
    \     height = hei ;\n        }\n        public double getVolume () {\n      \
    \      return length * breadth * height ;\n        }\n    }\n    class Boxtester\
    \ {\n        static void Main ( string [] args ) {\n            Box Box1 = new\
    \ Box ();    // Declare Box1 of type Box\n            Box Box2 = new Box ();\n\
    \            double volume ;// Declare Box2 of type Box\n            // box 1\
    \ specification\n            Box1 . setLength ( 6.0 );\n            Box1 . setBreadth\
    \ ( 7.0 );\n            Box1 . setHeight ( 5.0 );\n            // box 2 specification\n\
    \            Box2 . setLength ( 12.0 );\n            Box2 . setBreadth ( 13.0\
    \ );\n            Box2 . setHeight ( 10.0 );\n            // volume of box 1\n\
    \            volume = Box1 . getVolume ();\n            Console . WriteLine (\
    \ \"Volume of Box1 : {0}\" , volume );\n            // volume of box 2\n     \
    \       volume = Box2 . getVolume ();\n            Console . WriteLine ( \"Volume\
    \ of Box2 : {0}\" , volume );\n            Console . ReadKey ();\n        }\n\
    \    }\n}\n```\n\nWhen the above code is compiled and executed, it produces the\
    \ following result:\nVolume of Box1 : 210\nVolume of Box2 : 1560\n\n## C# Constructors\n\
    \nA class `constructor` is a special member function of a class that is executed\
    \ whenever we create new objects of that class. \n\nA constructor has exactly\
    \ the same name as that of class and it does not have any return type. Following\
    \ example explains the concept of `constructor`:\n\n```csharp\nusing System ;\n\
    namespace LineApplication {\n    class Line {\n        private double length ;\
    \    // Length of a line\n        public Line () {\n            Console . WriteLine\
    \ ( \"Object is being created\" );\n        }\n        public void setLength (\
    \ double len ) {\n            length = len ;\n        }\n        public double\
    \ getLength () {\n            return length ;\n        }\n        static void\
    \ Main ( string [] args ) {\n            Line line = new Line ();     // set line\
    \ length\n            line . setLength ( 6.0 );\n            Console . WriteLine\
    \ ( \"Length of line : {0}\" , line . getLength ());\n            Console . ReadKey\
    \ ();\n        }\n    }\n}\n```\n\nWhen the above code is compiled and executed,\
    \ it produces the following result:\nObject is being created\nLength of line :\
    \ 6\n\nA `default constructor` does not have any parameter but if you need, a\
    \ constructor can have parameters. Such constructors are called `parameterized\
    \ constructors`. This technique helps you to assign initial value to an object\
    \ at the time of its creation as shown in the following example:\n\n```csharp\n\
    using System ;\nnamespace LineApplication {\n    class Line {\n        private\
    \ double length ;    // Length of a line\n        public Line ( double len ) {\
    \   //Parameterized constructor\n            Console . WriteLine ( \"Object is\
    \ being created, length = {0}\" , len );\n            length = len ;\n       \
    \ }\n        public void setLength ( double len ) {\n            length = len\
    \ ;\n        }\n        public double getLength () {\n            return length\
    \ ;\n        }\n        static void Main ( string [] args ) {\n            Line\
    \ line = new Line ( 10.0 );\n            Console . WriteLine ( \"Length of line\
    \ : {0}\" , line . getLength ());\n            // set line length\n          \
    \  line . setLength ( 6.0 );\n            Console . WriteLine ( \"Length of line\
    \ : {0}\" , line . getLength ());\n            Console . ReadKey ();\n       \
    \ }\n    }\n}\n```\n\nWhen the above code is compiled and executed, it produces\
    \ the following result:\nObject is being created, length = 10\nLength of line\
    \ : 10\nLength of line : 6\n\n## C# Destructors\n\nA `destructor` is a special\
    \ member function of a class that is executed whenever an object of its class\
    \ goes out of scope. A `destructor` has exactly the same name as that of the class\
    \ with a prefixed tilde (`~`) and it can neither return a value nor can it take\
    \ any parameters.\n\nDestructor can be very useful for releasing memory resources\
    \ before exiting the program. Destructors cannot be inherited or overloaded.\n\
    \nFollowing example explains the concept of `destructor`:\n\n```csharp\nusing\
    \ System ;\nnamespace LineApplication {\n    class Line {\n        private double\
    \ length ;    // Length of a line\n        public Line () {   // constructor\n\
    \            Console . WriteLine ( \"Object is being created\" );\n        }\n\
    \        ~ Line () {    //destructor\n            Console . WriteLine ( \"Object\
    \ is being deleted\" );\n        }\n        public void setLength ( double len\
    \ ) {\n            length = len ;\n        }\n        public double getLength\
    \ () {\n            return length ;\n        }\n        static void Main ( string\
    \ [] args ) {\n            Line line = new Line ();\n            // set line length\n\
    \            line . setLength ( 6.0 );\n            Console . WriteLine ( \"Length\
    \ of line : {0}\" , line . getLength ());\n        }\n    }\n}\n```\n\nWhen the\
    \ above code is compiled and executed, it produces the following result:\nObject\
    \ is being created\nLength of line : 6\nObject is being deleted\n\n## Static Members\
    \ of a C# Class\n\nWe can define class members as `static` using the `static`\
    \ keyword. When we declare a member of a class as `static`, it means no matter\
    \ how many objects of the class are created, there is only one copy of the static\
    \ member.\n\nStatic variables are used for defining constants because their values\
    \ can be retrieved by invoking the class without creating an instance of it. Static\
    \ variables can be initialized outside the member function or class. You can also\
    \ initialize static variables inside the class.\n\nThe following example demonstrates\
    \ the use of `static variables`:\n\n```csharp\nusing System ;\nnamespace StaticVarApplication\
    \ {\n    class StaticVar {\n        public static int num ;\n        public void\
    \ count () {\n            num ++;\n        }\n        public int getNum () {\n\
    \            return num ;\n        }\n    }\n    class StaticTester {\n      \
    \  static void Main ( string [] args ) {\n            StaticVar s1 = new StaticVar\
    \ ();\n            StaticVar s2 = new StaticVar ();\n            s1 . count ();\n\
    \            s1 . count ();\n            s2 . count ();\n            s2 . count\
    \ ();\n            Console . WriteLine ( \"Variable num for s1 : {0}\" , s1 .\
    \ getNum () );\n            Console . WriteLine ( \"Variable num for s2 : {0}\"\
    \ , s2 . getNum () );\n        }\n    }\n}\n```\n\nWhen the above code is compiled\
    \ and executed, it produces the following result:\nVariable num for s1 : 6\nVariable\
    \ num for s2 : 6\n\nYou can also declare a member function as `static`. Such functions\
    \ can access only static variables. Static functions exist before the object is\
    \ created. The following example demonstrates the use of `static functions`:\n\
    \n```csharp\nusing System ;\nnamespace StaticVarApplication {\n    class StaticVar\
    \ {\n        public static int num ;\n        public static void count () {\n\
    \            num ++;\n        }\n        public static int getNum () {\n     \
    \       return num ;\n        }\n    }\n    class StaticTester {\n        static\
    \ void Main ( string [] args ) {\n            StaticVar.count ();\n          \
    \  StaticVar.count ();\n            StaticVar.count ();\n            StaticVar.count\
    \ ();\n            Console . WriteLine ( \"Variable num : {0}\" , StaticVar.getNum\
    \ () );\n        }\n    }\n}\n```\n\nWhen the above code is compiled and executed,\
    \ it produces the following result:\nVariable num : 4\n\n## C# Inheritance\n\n\
    One of the most important concepts in object-oriented programming is inheritance.\
    \ Inheritance allows us to define a class in terms of another class, which makes\
    \ easier to create and maintain. This also provides an opportunity to reuse the\
    \ code functionality and speeds up implementation.\n\nWhen creating a class, instead\
    \ of writing completely new data members and member functions, the programmer\
    \ can designate that the new class should inherit the members of an existing class.\
    \ This existing class is called the `base class`, and the new class is referred\
    \ to as `derived class`. The idea of inheritance implements the IS-A relationship.\n\
    \n### Base and Derived Classes\n\nA class can be derived from more than one class\
    \ or interface, which means that it can inherit data and functions from multiple\
    \ base classes or interfaces. The syntax used in C# for creating derived classes\
    \ is as follows:\n\n`<access-specifier> class <base_class> {...}`\n`class <derived_class>\
    \ : <base_class> {...}`\n\nConsider a base class `Shape` and its derived class\
    \ `Rectangle`:\n\n```csharp\nusing System ;\nnamespace InheritanceApplication\
    \ {\n    class Shape {\n        public void setWidth ( int w ) {\n           \
    \ width = w ;\n        }\n        public void setHeight ( int h ) {\n        \
    \    height = h ;\n        }\n        protected int width ;\n        protected\
    \ int height ;\n    }\n    // Derived class\n    class Rectangle : Shape {\n \
    \       public int getArea () {\n            return ( width * height );\n    \
    \    }\n    }\n    class RectangleTester {\n        static void Main ( string\
    \ [] args ) {\n            Rectangle Rect = new Rectangle ();\n            Rect\
    \ . setWidth ( 5 );\n            Rect . setHeight ( 7 );\n            // Print\
    \ the area of the object\n            Console . WriteLine ( \"Total area : {0}\"\
    \ , Rect . getArea () );\n        }\n    }\n}\n```\n\nWhen the above code is compiled\
    \ and executed, it produces the following result:\nTotal area : 35\n\n### Initializing\
    \ Base Class\n\nThe derived class inherits the base class member variables and\
    \ member methods. Therefore the super class object should be created before the\
    \ subclass is created. You can give instructions for superclass initialization\
    \ in the member initialization list. The following program demonstrates this:\n\
    \n```csharp\nusing System ;\nnamespace RectangleApplication {\n    class Rectangle\
    \ {\n        //member variables\n        protected double length ;\n        protected\
    \ double width ;\n        public Rectangle ( double l , double w ) {\n       \
    \     length = l ;\n            width = w ;\n        }\n        public double\
    \ GetArea () {\n            return length * width ;\n        }\n        public\
    \ void Display () {\n            Console . WriteLine ( \"Length: {0}\" , length\
    \ );\n            Console . WriteLine ( \"Width : {0}\" , width );\n         \
    \   Console . WriteLine ( \"Area : {0}\" , GetArea () );\n        }\n    }\n \
    \   //end class Rectangle\n    class Tabletop : Rectangle {\n        private double\
    \ cost ;\n        public Tabletop ( double l , double w ) : base ( l , w ) { }\n\
    \        public double GetCost () {\n            double cost ;\n            cost\
    \ = GetArea () * 70 ;\n            return cost ;\n        }\n        public void\
    \ Display () {\n            base . Display ();\n            Console . WriteLine\
    \ ( \"Cost: {0}\" , GetCost () );\n        }\n    }\n    class ExecuteRectangle\
    \ {\n        static void Main ( string [] args ) {\n            Tabletop t = new\
    \ Tabletop ( 4.5 , 7.5 );\n            t . Display ();\n            Console .\
    \ ReadLine ();\n        }\n    }\n}\n```\n\nWhen the above code is compiled and\
    \ executed, it produces the following result:\nLength: 4.5\nWidth : 7.5\nArea\
    \ : 33.75\nCost: 2362.5\n\n### Multiple Inheritance in C#\n\nC# does not support\
    \ multiple inheritance. However, you can use interfaces to implement multiple\
    \ inheritance. The following program demonstrates this:\n\n```csharp\nusing System\
    \ ;\nnamespace InheritanceApplication {\n    class Shape {\n        public void\
    \ setWidth ( int w ) {\n            width = w ;\n        }\n        public void\
    \ setHeight ( int h ) {\n            height = h ;\n        }\n        protected\
    \ int width ;\n        protected int height ;\n    }\n    // Base class PaintCost\n\
    \    public interface PaintCost {\n        int getCost ( int area );\n    }\n\
    \    // Derived class\n    class Rectangle : Shape , PaintCost {\n        public\
    \ int getArea () {\n            return ( width * height );\n        }\n      \
    \  public int getCost ( int area ) {\n            return area * 70 ;\n       \
    \ }\n    }\n    class RectangleTester {\n        static void Main ( string []\
    \ args ) {\n            Rectangle Rect = new Rectangle ();\n            int area\
    \ ;\n            Rect . setWidth ( 5 );\n            Rect . setHeight ( 7 );\n\
    \            area = Rect . getArea ();\n            // Print the area of the object.\n\
    \            Console . WriteLine ( \"Total area: {0}\" , Rect . getArea () );\n\
    \            Console . WriteLine ( \"Total paint cost: ${0}\" , Rect . getCost\
    \ ( area ));\n            Console . ReadKey ();\n        }\n    }\n}\n```\n\n\
    When the above code is compiled and executed, it produces the following result:\n\
    Total area: 35\nTotal paint cost: $2450\n\n## C# - Polymorphism\n\nThe word `polymorphism`\
    \ means having many forms. In object-oriented programming paradigm, polymorphism\
    \ is often expressed as 'one interface, multiple functions'.\n\nPolymorphism can\
    \ be static or dynamic. In `static polymorphism`, the response to a function is\
    \ determined at the compile time. In `dynamic polymorphism`, it is decided at\
    \ run-time.\n\n### Static Polymorphism\n\nThe mechanism of linking a function\
    \ with an object during compile time is called early binding. It is also called\
    \ static binding. C# provides two techniques to implement static polymorphism.\
    \ They are −\n"
