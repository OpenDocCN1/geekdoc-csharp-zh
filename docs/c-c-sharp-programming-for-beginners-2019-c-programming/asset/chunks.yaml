  trans: "\n\n# 公共修饰符\n公共访问修饰符允许类将其成员变量和成员函数暴露给其他函数和其他对象任何公共成员都可以从类的外部访问。下面的示例说明了这一点：\n\
    \n```csharp\nusing System;\nnamespace RectangleApplication {\n    class Rectangle\
    \ {\n        //member variables\n        public double length;\n        public\
    \ double width;\n        public double GetArea() {\n            return length\
    \ * width;\n        }\n        public void Display() {\n            Console.WriteLine(\"\
    Length: {0}\", length);\n            Console.WriteLine(\"Width: {0}\", width);\n\
    \            Console.WriteLine(\"Area: {0}\", GetArea());\n        }\n    } //end\
    \ class Rectangle\n    class ExecuteRectangle {\n        static void Main(string\
    \ [] args) {\n            Rectangle r = new Rectangle();\n            r.length\
    \ = 4.5;\n            r.width = 3.5;\n            r.Display();\n            Console.ReadLine();\n\
    \        }\n    }\n}\n```\n当上述代码编译并执行时，会产生以下结果：\nLength: 4.5\nWidth: 3.5\nArea:\
    \ 15.75\n\n在前面的示例中，成员变量 `length` 和 `width` 被声明为 `public`，因此可以使用命名为 `r` 的 `Rectangle`\
    \ 类实例从 `Main()` 函数访问。成员函数 `Display()` 和 `GetArea()` 也可以直接访问这些变量，而无需使用类的实例。成员函数\
    \ `Display()` 也被声明为 `public`，因此也可以可以使用命名为 `r` 的 `Rectangle` 类实例从 `Main()`访问。\n\
    \n# 私有修饰符\n私有访问修饰符允许类将其成员变量和成员函数从其他函数和其他对象隐藏。只有同一类的函数可以访问其私有成员。即使是类的实例无法访问其私有成员。下面的示例说明了这一点：\n\
    \n```csharp\nusing System;\nnamespace RectangleApplication {\n    class Rectangle\
    \ {\n        //member variables\n        private double length;\n        private\
    \ double width;\n        public void Acceptdetails() {\n            Console.WriteLine(\"\
    Enter Length: \");\n            length = Convert.ToDouble(Console.ReadLine());\n\
    \            Console.WriteLine(\"Enter Width: \");\n            width = Convert.ToDouble(Console.ReadLine());\n\
    \        }\n        public double GetArea() {\n            return length * width;\n\
    \        }\n        public void Display() {\n            Console.WriteLine(\"\
    Length: {0}\", length);\n            Console.WriteLine(\"Width: {0}\", width);\n\
    \            Console.WriteLine(\"Area: {0}\", GetArea());\n        }\n    } //end\
    \ class Rectangle\n    class ExecuteRectangle {\n        static void Main(string\
    \ [] args) {\n            Rectangle r = new Rectangle();\n            r.Acceptdetails();\n\
    \            r.Display();\n            Console.ReadLine();\n        }\n    }\n\
    }\n```\n当上述代码编译并执行时，会产生以下结果：\nEnter Length: 4.4\nEnter Width: 3.3\nLength: 4.4\n\
    Width: 3.3\nArea: 14.52\n\n在前面的示例中，成员变量 `length` 和 `width` 被声明为 `private`，因此无法从\
    \ `Main()` 函数访问。成员函数 `AcceptDetails()` 和 `Display()` 可以访问这些变量。由于成员函数 `AcceptDetails()`\
    \ 和 `Display()` 被声明为 `public`，因此可以使用命名为 `r` 的 `Rectangle` 类实例从 `Main()` 访问。\n\n\
    # 保护修饰符\n保护访问修饰符允许子类访问其基类的成员变量和成员函数。这有助于实现继承。我们将在继承章节中详细讨论此。\n\n# 内部修饰符\n内部访问修饰符允许类将其成员变量和成员函数暴露给当前程序集中的其他函数和其他对象。换句话说，任何具有内部修饰符的成员都可以从定义该成员的应用程序中的任何类或方法访问。下面的程序说明了这一点：\n\
    \n```csharp\nusing System;\nnamespace RectangleApplication {\n    class Rectangle\
    \ {\n        //member variables\n        internal double length;\n        internal\
    \ double width;\n        double GetArea() {\n            return length * width;\n\
    \        }\n        public void Display() {\n            Console.WriteLine(\"\
    Length: {0}\", length);\n            Console.WriteLine(\"Width: {0}\", width);\n\
    \            Console.WriteLine(\"Area: {0}\", GetArea());\n        }\n    } //end\
    \ class Rectangle\n    class ExecuteRectangle {\n        static void Main(string\
    \ [] args) {\n            Rectangle r = new Rectangle();\n            r.length\
    \ = 4.5;\n            r.width = 3.5;\n            r.Display();\n            Console.ReadLine();\n\
    \        }\n    }\n}\n```\n当上述代码编译并执行时，会产生以下结果：\nLength: 4.5\nWidth: 3.5\nArea:\
    \ 15.75\n\n在前面的示例中，注意成员函数 `GetArea()` 没有声明任何访问修饰符。那么，如果不提到任何修饰符，类成员的默认访问修饰符是什么呢？它是\
    \ `private`。\n\n# 保护内部修饰符\n保护内部访问修饰符允许类将其成员变量和成员函数从其他类对象和函数隐藏，同一应用程序内的子类除外。这在实现继承时也会使用。\n\
    \n# C# - 方法\n方法是共同执行任务的语句组。每个 C# 程序至少有一个带有名为 `Main` 方法的类。要使用方法，你需要：\n- 定义方法\n\
    - 调用方法\n\n## 在 C# 中定义方法\n定义方法基本上是在声明其结构的元素。在 C# 中定义方法的语法如下：\n`<Access Specifier>\
    \ <Return Type> <Method Name>(Parameter List) {Method Body}`\n\n以下是方法的各种元素：\n\
    - **访问修饰符**：它决定了从另一个类访问变量或方法的可见性。\n- **返回类型**：方法可以返回一个值。返回类型是方法返回的值的数据类型。如果方法不返回任何值，则返回类型为\
    \ `void`。\n- **方法名**：方法名是一个唯一标识符，并且区分大小写。它不能与类中定义的任何其他标识符相同。\n- **参数列表**：参数封装在括号之间，用于从方法传递和接收数据。参数列表指的是方法参数的类型、顺序和数量。参数是可选的；也就是说，方法可以不包含参数。\n\
    - **方法体**：它包含完成所需活动所需的指令集。\n\n"
- fmt: "\n# Example\nThe following code snippet shows a function `FindMax` that takes\
    \ two integer values and returns the larger of the two. It has public access specifier,\
    \ so it can be accessed from outside the class using an instance of the class.\n\
    \n```csharp\nclass NumberManipulator {\n    public int FindMax ( int num1 , int\
    \ num2 ) {\n        /* local variable declaration */\n        int result ;\n \
    \       if ( num1 > num2 )\n            result = num1 ;\n        else\n      \
    \      result = num2 ;\n        return result ;\n    }\n}\n```\n\n## Calling Methods\
    \ in C#\nYou can call a method using the name of the method. The following example\
    \ illustrates this:\n\n```csharp\nusing System ;\nnamespace CalculatorApplication\
    \ {\n    class NumberManipulator {\n        public int FindMax ( int num1 , int\
    \ num2 ) {\n            /* local variable declaration */\n            int result\
    \ ;\n            if ( num1 > num2 )\n                result = num1 ;\n       \
    \     else\n                result = num2 ;\n            return result ;\n   \
    \     }\n        static void Main ( string [] args ) {\n            /* local variable\
    \ definition */\n            int a = 100 ;\n            int b = 200 ;\n      \
    \      int ret ;\n            NumberManipulator n = new NumberManipulator ();\n\
    \            //calling the FindMax method\n            ret = n . FindMax ( a ,\
    \ b );\n            Console . WriteLine ( \"Max value is : {0}\" , ret );\n  \
    \          Console . ReadLine ();\n        }\n    }\n}\n```\n\nWhen the above\
    \ code is compiled and executed, it produces the following result:\nMax value\
    \ is : 200\n\nYou can also call public method from other classes by using the\
    \ instance of the class. For example, the method `FindMax` belongs to the `NumberManipulator`\
    \ class, you can call it from another class `Test`.\n\n```csharp\nusing System\
    \ ;\nnamespace CalculatorApplication {\n    class NumberManipulator {\n      \
    \  public int FindMax ( int num1 , int num2 ) {\n            /* local variable\
    \ declaration */\n            int result ;\n            if ( num1 > num2 )\n \
    \               result = num1 ;\n            else\n                result = num2\
    \ ;\n            return result ;\n        }\n    }\n    class Test {\n       \
    \ static void Main ( string [] args ) {\n            /* local variable definition\
    \ */\n            int a = 100 ;\n            int b = 200 ;\n            int ret\
    \ ;\n            NumberManipulator n = new NumberManipulator ();\n           \
    \ //calling the FindMax method\n            ret = n . FindMax ( a , b );\n   \
    \         Console . WriteLine ( \"Max value is : {0}\" , ret );\n            Console\
    \ . ReadLine ();\n        }\n    }\n}\n```\n\nWhen the above code is compiled\
    \ and executed, it produces the following result:\nMax value is : 200\n\n## Recursive\
    \ Method Call\nA method can call itself. This is known as `recursion`. Following\
    \ is an example that calculates factorial for a given number using recursive function:\n\
    \n```csharp\nusing System ;\nnamespace CalculatorApplication {\n    class NumberManipulator\
    \ {\n        public int factorial ( int num ) {\n            /* local variable\
    \ declaration */\n            int result ;\n            if ( num == 1 )\n    \
    \            return 1 ;\n            else\n                result = factorial\
    \ ( num - 1 ) * num ;\n            return result ;\n        }\n        static\
    \ void Main ( string [] args ) {\n            NumberManipulator n = new NumberManipulator\
    \ ();\n            //calling the factorial method\n            Console . WriteLine\
    \ ( \"Factorial of 6 is : {0}\", n.factorial(6) );\n            Console . WriteLine\
    \ ( \"Factorial of 7 is : {0}\" , n . factorial ( 7 ));\n            Console .\
    \ ReadLine ();\n        }\n    }\n}\n```\n\nWhen the above code is compiled and\
    \ executed, it produces the following result:\nFactorial of 6 is: 720\nFactorial\
    \ of 7 is: 5040\nFactorial of 8 is: 40320\n\n## Passing Parameters to a Method\n\
    When method with parameters is called, you need to pass the parameters. There\
    \ are three ways that parameters can be passed to a method:\n\n| Sr.No. | Mechanism\
    \ | Description |\n| :--- | :--- | :--- |\n| 1 | Value parameters | This method\
    \ copies the actual value of an argument into the formal parameter of the function.\
    \ In this case, changes made to the parameter inside the function have no effect\
    \ on the argument. |\n| 2 | Reference parameters | This method copies the reference\
    \ to the memory location of an argument into the formal parameter. This means\
    \ that changes made to the parameter affect the argument. |\n| 3 | Output parameters\
    \ | This method helps in returning more than one value. |\n\n## C# - Arrays\n\
    An array stores a fixed-size sequential collection of elements of the same type.\
    \ An array is used to store a collection of data, but it is often more useful\
    \ to think of an array as a collection of variables of the same type stored at\
    \ contiguous memory locations.\n\nInstead of declaring individual variables, such\
    \ as `number0`, `number1`, and `number99`, you declare one array variable as `numbers`\
    \ and use `numbers[0]`, `numbers[1]`, and `numbers[99]` to represent individual\
    \ variables. A specific element in an array is accessed by an index. All arrays\
    \ consist of contiguous memory locations. The lowest address corresponds to the\
    \ first element and the highest address to the last element.\n\n### Declaring\
    \ Arrays\nTo declare an array in C#, you can use the following syntax:\n`datatype[]\
    \ arrayName;`\nwhere,\n* `datatype` is used to specify the type of elements in\
    \ the array.\n* `[]` specifies the rank of the array. The rank specifies the size\
    \ of the array.\n* `arrayName` specifies the name of the array.\n\nFor example\
    \ `double[] balance;`\n\n### Initializing an Array\n\"Declaring an array does\
    \ not initialize the array in the memory. When the array variable is initialized,\
    \ you can assign values to the array. Array is a reference type, so you need to\
    \ use the `new` keyword to create an instance of the array. For example `double[]\
    \ balance = new double[10];`\"\n\n### Assigning Values to an Array\nYou can assign\
    \ values to individual array elements, by using the index number, like:\n`double[]\
    \ balance = new double[10];`\n`balance[0] = 450.0;`\n\nYou can assign values to\
    \ the array at the time of declaration, as shown:\n`double[] balance = { 234.0,\
    \ 452.69, 342.1 };`\n\nYou can also create and initialize an array, as shown:\n\
    `int[] marks = new int[5] { 99, 98, 92, 97, 95 };`\n\nYou may also omit the size\
    \ of the array, as shown:\n`int[] marks = new int[] { 99, 98, 92, 97, 95 };`\n\
    \nYou can copy an array variable into another target array variable. In such case,\
    \ both the target and source point to the same memory location:\n`int[] marks\
    \ = new int[] { 99, 98, 92, 97, 95 };`\n`int[] score = marks;`\n\nWhen you create\
    \ an array, C# compiler implicitly initializes each array element to a default\
    \ value depending on the array type. For example, for an `int` array all elements\
    \ are initialized to 0.\n\n### Accessing Array Elements\nAn element is accessed\
    \ by indexing the array name. This is done by placing the index of the element\
    \ within square brackets after the name of the array. For example `double salary\
    \ = balance[9];`\n\nThe following example demonstrates the above-mentioned concepts\
    \ declaration, assignment, and accessing arrays:\n\n```csharp\nusing System ;\n\
    namespace ArrayApplication {\n    class MyArray {\n        static void Main (\
    \ string [] args ) {\n            int [] n = new int [ 10 ]; /* n is an array\
    \ of 10 integers */\n            int i , j ;\n            /* initialize elements\
    \ of array n */\n            for ( i = 0 ; i < 10 ; i ++ ) {\n               \
    \ n [ i ] = i + 100 ;\n            }\n            /* output each array element's\
    \ value */\n            for ( j = 0 ; j < 10 ; j ++ ) {\n                Console\
    \ . WriteLine ( \"Element[{0}] = {1}\" , j , n [ j ]);\n            }\n      \
    \      Console . ReadLine ();\n        }\n    }\n}\n```\n\nWhen the above code\
    \ is compiled and executed, it produces the following result:\nElement[0] = 100\n\
    Element[1] = 101\nElement[2] = 102\nElement[3] = 103\nElement[4] = 104\nElement[5]\
    \ = 105\nElement[6] = 106\nElement[7] = 107\nElement[8] = 108\nElement[9] = 109\n\
    \n### Using the foreach Loop\nIn the previous example, we used a for loop for\
    \ accessing each array element. You can also use a `foreach` statement to iterate\
    \ through an array.\n\n```csharp\nusing System ;\nnamespace ArrayApplication {\n\
    \    class MyArray {\n        static void Main ( string [] args ) {\n        \
    \    int [] n = new int [ 10 ]; /* n is an array of 10 integers */\n         \
    \   int i , j ;\n            /* initialize elements of array n */\n          \
    \  for ( i = 0 ; i < 10 ; i ++ ) {\n                n [ i ] = i + 100 ;\n    \
    \        }\n            /* output each array element's value */\n            foreach\
    \ ( int j in n ) {\n                int i = j - 100 ;\n                Console\
    \ . WriteLine ( \"Element[{0}] = {1}\" , i , j );\n            }\n           \
    \ Console . ReadLine ();\n        }\n    }\n}\n```\n\n## C# Arrays\nThere are\
    \ following few important concepts related to array which should be clear to a\
    \ C# programmer:\n\n| Sr.No. | Concept | Description |\n| :--- | :--- | :--- |\n\
    | 1 | Multi-dimensional arrays | C# supports multidimensional arrays. The simplest\
    \ form of the multidimensional array is the two-dimensional array. |\n| 2 | Jagged\
    \ arrays | C# supports multidimensional arrays, which are arrays of arrays. |\n"
