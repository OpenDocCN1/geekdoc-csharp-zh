  trans: "\n\n如果你在使用嵌套循环（即在一个循环内部另一个循环），`break` 语句将停止最内层循环的执行，并开始执行块之后的下一行代码。\n\n\
    ### break 语句\n\n#### 语法\nC# 中 `break` 语句的语法如下 —\n`break;`\n\n#### 流程图\n![c# break\
    \ statement](img/image3653.jpg)\n\n#### 示例\n```csharp\nusing System ;\nnamespace\
    \ Loops {\nclass Program {\n    static void Main ( string [] args ) {\n      \
    \  /* local variable definition */\n        int a = 10 ;\n        /* while loop\
    \ execution */\n        while ( a < 20 ) {\n            Console . WriteLine (\
    \ \"value of a: {0}\" , a );\n            a ++;\n            if ( a > 15 ) {\n\
    \                /* terminate the loop using break statement */\n            \
    \    break ;\n            }\n        }\n        Console . ReadLine ();\n    }\n\
    }\n```\n当上述代码编译并执行时，会产生以下结果 —\nvalue of a: 10\nvalue of a: 11\nvalue of a: 12\n\
    value of a: 13\nvalue of a: 14\nvalue of a: 15\n\n### continue 语句\n\nC# 中的 `continue`\
    \ 语句的作用与 `break` 语句相似。然而，`continue` 并不是强制终止，而是强制执行循环的下次迭代，跳过中间的任何代码。\n\n对于 `for`\
    \ 循环，`continue` 语句会导致循环的条件测试和增量部分执行。对于 `while` 和 `do...while` 循环，`continue` 语句会导致程序控制传递到条件测试。\n\
    \n#### 语法\nC# 中 `continue` 语句的语法如下 —\n`continue;`\n\n#### 流程图\n![C# continue statement](img/image3723.jpg)\n\
    \n#### 示例\n```csharp\nusing System ;\nnamespace Loops {\nclass Program {\n   \
    \ static void Main ( string [] args ) {\n        /* local variable definition\
    \ */\n        int a = 10 ;\n        /* do loop execution */\n        do {\n  \
    \          if ( a == 15 ) {\n                /* skip the iteration */\n      \
    \          a = a + 1 ;\n                continue ;\n            }\n          \
    \  Console . WriteLine ( \"value of a: {0}\" , a );\n            a ++;\n     \
    \   }while ( a < 20 );\n        Console . ReadLine ();\n    }\n}\n```\n当上述代码编译并执行时，会产生以下结果\
    \ —\nvalue of a: 10\nvalue of a: 11\nvalue of a: 12\nvalue of a: 13\nvalue of\
    \ a: 14\nvalue of a: 16\nvalue of a: 17\nvalue of a: 18\nvalue of a: 19\n\n###\
    \ 死循环\n\n如果一个条件永远不变为假，循环就会变成死循环。`for` 循环传统上用于此目的。由于构成 `for` 循环的三个表达式都不是必需的，你可以通过让条件表达式为空来创建一个无限循环。\n\
    \n#### 示例\n```csharp\nusing System ;\nnamespace Loops {\nclass Program {\n   \
    \ static void Main ( string [] args ) {\n        for (; ; ) {\n            Console\
    \ . WriteLine ( \"Hey! I am Trapped\" );\n        }\n    }\n}\n```\n当条件表达式缺失时，它被假设为真。你可以拥有初始化和增量表达式，但程序员更常见地使用\
    \ `for(;;)` 结构来表示死循环。\n\n### C# - 封装\n\n封装被定义为“将一个或多个项目封装在物理或逻辑包内部的过程”。在面向对象的编程方法论中，封装防止了对实现细节的访问。抽象和封装是面向对象编程中相关的特性。抽象允许使相关信息可见，而封装使程序员能够实现所需的抽象级别。\n\
    \n封装通过使用访问修饰符来实现。`访问修饰符`定义了类成员的范围和可见性。C# 支持以下访问修饰符 —\n\n- Public（公共）\n- Private（私有）\n\
    - Protected（保护）\n- Internal（内部）\n- Protected internal（内部保护）\n\n"
- fmt: "\n# Public Access Specifier\nPublic access specifier allows a class to expose\
    \ its member variables and member functions to other functions and objects. Any\
    \ public member can be accessed from outside the class. The following example\
    \ illustrates this:\n\n```csharp\nusing System;\nnamespace RectangleApplication\
    \ {\n    class Rectangle {\n        //member variables\n        public double\
    \ length;\n        public double width;\n        public double GetArea() {\n \
    \           return length * width;\n        }\n        public void Display() {\n\
    \            Console.WriteLine(\"Length: {0}\", length);\n            Console.WriteLine(\"\
    Width: {0}\", width);\n            Console.WriteLine(\"Area: {0}\", GetArea());\n\
    \        }\n    } //end class Rectangle\n    class ExecuteRectangle {\n      \
    \  static void Main(string [] args) {\n            Rectangle r = new Rectangle();\n\
    \            r.length = 4.5;\n            r.width = 3.5;\n            r.Display();\n\
    \            Console.ReadLine();\n        }\n    }\n}\n```\nWhen the above code\
    \ is compiled and executed, it produces the following result:\nLength: 4.5\nWidth:\
    \ 3.5\nArea: 15.75\n\nIn the preceding example, the member variables `length`\
    \ and `width` are declared `public`, so they can be accessed from the function\
    \ `Main()` using an instance of the `Rectangle` class, named `r`. The member function\
    \ `Display()` and `GetArea()` can also access these variables directly without\
    \ using any instance of the class. The member function `Display()` is also declared\
    \ `public`, so it can also be accessed from `Main()` using an instance of the\
    \ `Rectangle` class, named `r`.\n\n# Private Access Specifier\nPrivate access\
    \ specifier allows a class to hide its member variables and member functions from\
    \ other functions and objects. Only functions of the same class can access its\
    \ private members. Even an instance of a class cannot access its private members.\
    \ The following example illustrates this:\n\n```csharp\nusing System;\nnamespace\
    \ RectangleApplication {\n    class Rectangle {\n        //member variables\n\
    \        private double length;\n        private double width;\n        public\
    \ void Acceptdetails() {\n            Console.WriteLine(\"Enter Length: \");\n\
    \            length = Convert.ToDouble(Console.ReadLine());\n            Console.WriteLine(\"\
    Enter Width: \");\n            width = Convert.ToDouble(Console.ReadLine());\n\
    \        }\n        public double GetArea() {\n            return length * width;\n\
    \        }\n        public void Display() {\n            Console.WriteLine(\"\
    Length: {0}\", length);\n            Console.WriteLine(\"Width: {0}\", width);\n\
    \            Console.WriteLine(\"Area: {0}\", GetArea());\n        }\n    } //end\
    \ class Rectangle\n    class ExecuteRectangle {\n        static void Main(string\
    \ [] args) {\n            Rectangle r = new Rectangle();\n            r.Acceptdetails();\n\
    \            r.Display();\n            Console.ReadLine();\n        }\n    }\n\
    }\n```\nWhen the above code is compiled and executed, it produces the following\
    \ result:\nEnter Length: 4.4\nEnter Width: 3.3\nLength: 4.4\nWidth: 3.3\nArea:\
    \ 14.52\n\nIn the preceding example, the member variables `length` and `width`\
    \ are declared `private`, so they cannot be accessed from the function `Main()`.\
    \ The member functions `AcceptDetails()` and `Display()` can access these variables.\
    \ Since the member functions `AcceptDetails()` and `Display()` are declared `public`,\
    \ they can be accessed from `Main()` using an instance of the `Rectangle` class,\
    \ named `r`.\n\n# Protected Access Specifier\nProtected access specifier allows\
    \ a child class to access the member variables and member functions of its base\
    \ class. This way it helps in implementing inheritance. We will discuss this in\
    \ more details in the inheritance chapter.\n\n# Internal Access Specifier\nInternal\
    \ access specifier allows a class to expose its member variables and member functions\
    \ to other functions and objects in the current assembly. In other words, any\
    \ member with internal access specifier can be accessed from any class or method\
    \ defined within the application in which the member is defined. The following\
    \ program illustrates this:\n\n```csharp\nusing System;\nnamespace RectangleApplication\
    \ {\n    class Rectangle {\n        //member variables\n        internal double\
    \ length;\n        internal double width;\n        double GetArea() {\n      \
    \      return length * width;\n        }\n        public void Display() {\n  \
    \          Console.WriteLine(\"Length: {0}\", length);\n            Console.WriteLine(\"\
    Width: {0}\", width);\n            Console.WriteLine(\"Area: {0}\", GetArea());\n\
    \        }\n    } //end class Rectangle\n    class ExecuteRectangle {\n      \
    \  static void Main(string [] args) {\n            Rectangle r = new Rectangle();\n\
    \            r.length = 4.5;\n            r.width = 3.5;\n            r.Display();\n\
    \            Console.ReadLine();\n        }\n    }\n}\n```\nWhen the above code\
    \ is compiled and executed, it produces the following result:\nLength: 4.5\nWidth:\
    \ 3.5\nArea: 15.75\n\nIn the preceding example, notice that the member function\
    \ `GetArea()` is not declared with any access specifier. Then what would be the\
    \ default access specifier of a class member if we don't mention any? It is `private`.\n\
    \n# Protected Internal Access Specifier\nThe protected internal access specifier\
    \ allows a class to hide its member variables and member functions from other\
    \ class objects and functions, except a child class within the same application.\
    \ This is also used while implementing inheritance.\n\n# C# - Methods\nA method\
    \ is a group of statements that together perform a task. Every C# program has\
    \ at least one class with a method named `Main`. To use a method, you need to:\n\
    - Define the method\n- Call the method\n\n## Defining Methods in C#\nWhen you\
    \ define a method, you basically declare the elements of its structure. The syntax\
    \ for defining a method in C# is as follows:\n`<Access Specifier> <Return Type>\
    \ <Method Name>(Parameter List) {Method Body}`\n\nFollowing are the various elements\
    \ of a method:\n- **Access Specifier**: This determines the visibility of a variable\
    \ or a method from another class.\n- **Return type**: A method may return a value.\
    \ The return type is the data type of the value the method returns. If the method\
    \ is not returning any values, then the return type is `void`.\n- **Method name**:\
    \ Method name is a unique identifier and it is case sensitive. It cannot be same\
    \ as any other identifier declared in the class.\n- **Parameter list**: Enclosed\
    \ between parentheses, the parameters are used to pass and receive data from a\
    \ method. The parameter list refers to the type, order, and number of the parameters\
    \ of a method. Parameters are optional; that is, a method may contain no parameters.\n\
    - **Method body**: This contains the set of instructions needed to complete the\
    \ required activity.\n"
