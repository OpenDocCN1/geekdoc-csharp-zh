    \            Box2.setBreadth(13.0);\n            Box2.setHeight(10.0);\n\n   \
    \         // 使用重载的 ToString() 显示盒子：\n            Console.WriteLine(\"Box 1: {0}\"\
    , Box1.ToString());\n            Console.WriteLine(\"Box 2: {0}\", Box2.ToString());\n\
    \n            // 盒子 1 的体积\n            volume = Box1.getVolume();\n          \
    \  Console.WriteLine(\"Volume of Box1 : {0}\", volume);\n\n            // 盒子 2\
    \ 的体积\n            volume = Box2.getVolume();\n            Console.WriteLine(\"\
    Volume of Box2 : {0}\", volume);\n\n            // 按照如下方式相加两个对象：\n           \
