  trans: "\n\n# while 循环\nC# 中的 `while` 循环语句在给定条件为真时，会重复执行目标语句。\n\n### 语法\nC# 中 `while`\
    \ 循环的语法如下：\n```csharp\nwhile(condition) {statement(s);}\n```\n在这里，`statement(s)`\
    \ 可以是一个单独语句，也可以是一个语句块。`condition` 可以是任何表达式，而 `true` 是任何非零值。当条件为真时，循环进行迭代。当条件变为假时，程序控制将传递到紧接在循环之后的行。\n\
    \n### 流程图\n![while loop in C#](img/image3257.jpg)\n在这里，`while` 循环的关键点在于循环可能永远不会运行。当测试\
    \ `condition` 的结果为假时，将跳过循环体，并执行 `while` 循环后的第一个语句。\n\n### 示例\n```csharp\nusing\
    \ System ;\nnamespace Loops {\n    class Program {\n        static void Main (\
    \ string [] args ) {\n            /* 局部变量定义 */\n            int a = 10 ;\n   \
    \         /* while 循环执行 */\n            while ( a < 20 ) {\n                Console\
    \ . WriteLine ( \"value of a: {0}\" , a );\n                a ++;\n          \
    \  }\n            Console . ReadLine ();\n        }\n    }\n}\n```\n当上述代码编译并执行时，将产生以下结果：\n\
    value of a: 10\nvalue of a: 11\nvalue of a: 12\nvalue of a: 13\nvalue of a: 14\n\
    value of a: 15\nvalue of a: 16\nvalue of a: 17\nvalue of a: 18\nvalue of a: 19\n\
    \n# for 循环\n`for` 循环是一种重复控制结构，允许你高效地编写需要执行特定次数的循环。\n\n### 语法\nC# 中 `for` 循环的语法如下：\n\
    ```csharp\nfor ( init; condition; increment ) {statement(s);}\n```\n以下是 `for`\
    \ 循环中的控制流：\n- 首先执行 `init` 步骤，且只执行一次。此步骤允许你声明并初始化任何循环控制变量。只要出现分号，就不强制要求在这里放置语句。\n\
    - 接下来评估 `condition`。如果为真，则执行循环体。如果为假，则不执行循环体，控制流跳转到 `for` 循环之后的紧邻语句。\n- 在执行 `for`\
    \ 循环体后，控制流跳转回 `increment` 语句。该语句允许你更新任何循环控制变量。只要在条件之后出现分号，该语句可以留空。\n- 现在再次评估 `condition`。如果为真，则执行循环并重复该过程（循环体、然后是增量步骤，然后再次测试条件）。在条件变为假后，`for`\
    \ 循环终止。\n\n### 流程图\n![for loop in C#](img/image3342.jpg)\n\n### 示例\n```csharp\n\
    using System ;\nnamespace Loops {\n    class Program {\n        static void Main\
    \ ( string [] args ) {\n            /* for 循环执行 */\n            for ( int a =\
    \ 10 ; a < 20 ; a = a + 1 ) {\n                Console . WriteLine ( \"value of\
    \ a: {0}\" , a );\n            }\n            Console . ReadLine ();\n       \
    \ }\n    }\n}\n```\n当上述代码编译并执行时，将产生以下结果：\nvalue of a: 10\nvalue of a: 11\nvalue\
    \ of a: 12\nvalue of a: 13\nvalue of a: 14\nvalue of a: 15\nvalue of a: 16\nvalue\
    \ of a: 17\nvalue of a: 18\nvalue of a: 19\n\n# do...While 循环\n与在循环开始时测试条件的 `for`\
    \ 和 `while` 循环不同，`do...while` 循环在循环结束时检查其条件。`do...while` 循环类似于 `while` 循环，不同在于\
    \ `do...while` 循环保证至少执行一次。\n\n### 语法\nC# 中 `do...while` 循环的语法如下：\n```csharp\n\
    do {statement(s);} while( condition );\n```\n注意条件表达式出现在循环的末尾，因此循环中的 `statement(s)`\
    \ 在测试条件之前会执行一次。如果条件为真，控制流跳转回 `do`，循环中的 `statement(s)` 再次执行。此过程不断重复直到给定条件变为假。\n\
    \n### 流程图\n![do...while loop in C#](img/image3416.jpg)\n\n### 示例\n```csharp\n\
    using System ;\nnamespace Loops {\n    class Program {\n        static void Main\
    \ ( string [] args ) {\n            /* 局部变量定义 */\n            int a = 10 ;\n \
    \           /* do 循环执行 */\n            do {\n                Console . WriteLine\
    \ ( \"value of a: {0}\" , a );\n                a = a + 1 ;\n            } while\
    \ ( a < 20 );\n            Console . ReadLine ();\n        }\n    }\n}\n```\n\
    当上述代码编译并执行时，将产生以下结果：\nvalue of a: 10\nvalue of a: 11\nvalue of a: 12\nvalue of\
    \ a: 13\nvalue of a: 14\nvalue of a: 15\nvalue of a: 16\nvalue of a: 17\nvalue\
    \ of a: 18\nvalue of a: 19\n\n# 嵌套 for 循环\nC# 允许在一个另一个内部使用循环。本节展示了几个示例来说明这一概念。\n\
    \n### 语法\nC# 中 `嵌套 for 循环`语句的语法为：\n```csharp\nfor ( init; condition; increment\
    \ ) {for ( init; condition; increment ) {statement(s);}statement(s);}\n```\nC#\
    \ 中 `嵌套 while 循环`语句的语法为：\n```csharp\nwhile(condition) {while(condition) {statement(s);}statement(s);}\n\
    ```\nC# 中 `嵌套 do...while 循环`语句的语法为：\n```csharp\ndo {statement(s);do {statement(s);}while(\
    \ condition );}while( condition );\n```\n关于循环嵌套的最后一点是，你可以将任何类型的循环放在任何类型的循环内部。例如，`for`\
    \ 循环可以放在 `while` 循环内部，反之亦然。\n\n### 示例\n以下程序使用嵌套 for 循环寻找 2 到 100 之间的质数：\n```csharp\n\
    using System ;\nnamespace Loops {\n    class Program {\n        static void Main\
    \ ( string [] args ) {\n            /* 局部变量定义 */\n            int i , j ;\n  \
    \          for ( i = 2 ; i < 100 ; i ++) {\n                for ( j = 2 ; j <=\
    \ ( i / j ); j ++)\n                    if (( i % j ) == 0 ) break ; // 如果找到因数，则不是质数\n\
    \                if ( j > ( i / j )) Console . WriteLine ( \"{0} is prime\" ,\
    \ i );\n            }\n            Console . ReadLine ();\n        }\n    }\n\
    }\n```\n当上述代码编译并执行时，将产生以下结果：\n2 is prime\n3 is prime\n5 is prime\n7 is prime\n\
    11 is prime\n13 is prime\n17 is prime\n19 is prime\n23 is prime\n29 is prime\n\
    31 is prime\n37 is prime\n41 is prime\n43 is prime\n47 is prime\n53 is prime\n\
    59 is prime\n61 is prime\n67 is prime\n71 is prime\n73 is prime\n79 is prime\n\
    83 is prime\n89 is prime\n97 is prime\n\n# 循环控制语句\n循环控制语句改变了其正常执行顺序。当执行离开作用范围时，在该作用范围内创建的所有自动对象都会被销毁。C#\
    \ 提供了以下控制语句。\n\n| 序号 | 控制语句及描述 |\n| :--- | :--- |\n| 1 | `break` 语句：终止 `循环` 或\
    \ `switch` 语句，并将执行转移到循环或 switch 之后的后续语句。 |\n| 2 | `continue` 语句：导致循环跳过其主体的剩余部分，并在迭代之前立即重新测试其条件。\
    \ |\n\n### break 语句\nC# 中的 `break` 语句有以下两种用法：\n- 当在循环内部遇到 `break` 语句时，循环立即终止，程序控制从循环后的下一个语句开始恢复。\n\
    - 它可以用于终止 `switch` 语句中的某个 `case`。\n\n"
- fmt: "\nIf you are using nested loops (i.e., one loop inside another loop), the\
    \ `break` statement will stop the execution of the innermost loop and start executing\
    \ the next line of code after the block.\n\n### break statement\n\n#### Syntax\n\
    The syntax for a `break` statement in C# is as follows —\n`break;`\n\n#### Flow\
    \ Diagram\n![c# break statement](image3653.jpg)\n\n#### Example\n```csharp\nusing\
    \ System ;\nnamespace Loops {\nclass Program {\n    static void Main ( string\
    \ [] args ) {\n        /* local variable definition */\n        int a = 10 ;\n\
    \        /* while loop execution */\n        while ( a < 20 ) {\n            Console\
    \ . WriteLine ( \"value of a: {0}\" , a );\n            a ++;\n            if\
    \ ( a > 15 ) {\n                /* terminate the loop using break statement */\n\
    \                break ;\n            }\n        }\n        Console . ReadLine\
    \ ();\n    }\n}\n```\nWhen the above code is compiled and executed, it produces\
    \ the following result —\nvalue of a: 10\nvalue of a: 11\nvalue of a: 12\nvalue\
    \ of a: 13\nvalue of a: 14\nvalue of a: 15\n\n### continue statement\n\nThe `continue`\
    \ statement in C# works somewhat like the `break` statement. Instead of forcing\
    \ termination, however, `continue` forces the next iteration of the loop to take\
    \ place, skipping any code in between.\n\nFor the `for` loop, `continue` statement\
    \ causes the conditional test and increment portions of the loop to execute. For\
    \ the `while` and `do...while` loops, `continue` statement causes the program\
    \ control passes to the conditional tests.\n\n#### Syntax\nThe syntax for a `continue`\
    \ statement in C# is as follows —\n`continue;`\n\n#### Flow Diagram\n![C# continue\
    \ statement](image3723.jpg)\n\n#### Example\n```csharp\nusing System ;\nnamespace\
    \ Loops {\nclass Program {\n    static void Main ( string [] args ) {\n      \
    \  /* local variable definition */\n        int a = 10 ;\n        /* do loop execution\
    \ */\n        do {\n            if ( a == 15 ) {\n                /* skip the\
    \ iteration */\n                a = a + 1 ;\n                continue ;\n    \
    \        }\n            Console . WriteLine ( \"value of a: {0}\" , a );\n   \
    \         a ++;\n        }while ( a < 20 );\n        Console . ReadLine ();\n\
    \    }\n}\n```\nWhen the above code is compiled and executed, it produces the\
    \ following result —\nvalue of a: 10\nvalue of a: 11\nvalue of a: 12\nvalue of\
    \ a: 13\nvalue of a: 14\nvalue of a: 16\nvalue of a: 17\nvalue of a: 18\nvalue\
    \ of a: 19\n\n### Infinite Loop\n\nA loop becomes infinite loop if a condition\
    \ never becomes false. The `for` loop is traditionally used for this purpose.\
    \ Since none of the three expressions that form the for loop are required, you\
    \ can make an endless loop by leaving the conditional expression empty.\n\n####\
    \ Example\n```csharp\nusing System ;\nnamespace Loops {\nclass Program {\n   \
    \ static void Main ( string [] args ) {\n        for (; ; ) {\n            Console\
    \ . WriteLine ( \"Hey! I am Trapped\" );\n        }\n    }\n}\n```\nWhen the conditional\
    \ expression is absent, it is assumed to be true. You may have an initialization\
    \ and increment expression, but programmers more commonly use the `for(;;)` construct\
    \ to signify an infinite loop.\n\n### C# - Encapsulation\n\nEncapsulation is defined\
    \ 'as the process of enclosing one or more items within a physical or logical\
    \ package'. Encapsulation, in object oriented programming methodology, prevents\
    \ access to implementation details. Abstraction and encapsulation are related\
    \ features in object oriented programming. Abstraction allows making relevant\
    \ information visible and encapsulation enables a programmer to implement the\
    \ desired level of abstraction.\n\nEncapsulation is implemented by using access\
    \ specifiers. An `access specifier` defines the scope and visibility of a class\
    \ member. C# supports the following access specifiers —\n\n- Public\n- Private\n\
    - Protected\n- Internal\n- Protected internal\n"
