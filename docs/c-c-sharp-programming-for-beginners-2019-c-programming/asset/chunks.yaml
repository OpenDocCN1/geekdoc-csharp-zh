     to print different data types −using System ;namespace PolymorphismApplication
    {class Printdata {void print ( int i ) {Console . WriteLine ( "Printing int: {0}"
    , i );}void print ( double f ) {Console . WriteLine ( "Printing float: {0}" ,
    f );}void print ( string s ) {Console . WriteLine ( "Printing string: {0}" , s
    );}static void Main ( string [] args ) {Printdata p = new Printdata ();// Call
    print to print integerp . print ( 5 );// Call print to print floatp . print (
    500.263 );// Call print to print stringp . print ( "Hello C++" );Console . ReadKey
    ();}}}When the above code is compiled and executed, it produces the following
    result −Printing int: 5Printing float: 500.263Printing string: Hello C++Dynamic
    Polymorphism:C# allows you to create abstract classes that are used to provide
    partial class implementation of an interface. Implementation is completed when
    a derived class inherits from it. Abstract classes contain abstract methods, which
    are implemented by the derived class. The derived classes have more specialized
    functionality .Here are the rules about abstract classes −


    *   You cannot create an instance of an abstract class


    *   You cannot declare an abstract method outside an abstract class


    *   When a class is declared  sealed , it cannot be inherited, abstract classes
    cannot be declared sealed.


    The following program demonstrates an abstract class −using System ;namespace
    PolymorphismApplication {abstract class Shape {public abstract int area ();}class
    Rectangle :    Shape {private int length ;private int width ;public Rectangle
    ( int a = 0 , int b = 0 ) {length = a ;width = b ;}public override int area ()
    {Console . WriteLine ( "Rectangle class area :" );return ( width * length );}}class
    RectangleTester {static void Main ( string [] args ) {Rectangle r = new Rectangle
    ( 10 , 7 );double a = r . area ();Console . WriteLine ( "Area: {0}" , a );Console
    . ReadKey ();}}}When the above code is compiled and executed, it produces the
    following result −Rectangle class area :Area: 70When you have a function defined
    in a class that you want to be implemented in an inherited class(es), you use virtual
     functions. The virtual functions could be implemented differently in different
    inherited class and the call to these functions will be decided at runtime.Dynamic
    polymorphism is implemented by abstract classes and virtual functions .The following
    program demonstrates this −using System ;namespace PolymorphismApplication {class
    Shape {protected int width , height ;public Shape ( int a = 0 , int b = 0 ) {width
    = a ;height = b ;}public virtual int area () {Console . WriteLine ( "Parent class
    area :" );return 0 ;}}class Rectangle : Shape {public Rectangle ( int a = 0 ,
    int b = 0 ): base ( a , b ) {}public override int area () {Console . WriteLine
    ( "Rectangle class area :" );return ( width * height );}}class Triangle : Shape
    {public Triangle ( int a = 0 , int b = 0 ): base ( a , b ) {}public override int
    area () {Console . WriteLine ( "Triangle class area :" );return ( width * height
    / 2 );}}class Caller {public void CallArea ( Shape sh ) {int a ;a = sh . area
    ();Console . WriteLine ( "Area: {0}" , a );}}   class Tester {static void Main
    ( string [] args ) {Caller c = new Caller ();Rectangle r = new Rectangle ( 10
    , 7 );Triangle t = new Triangle ( 10 , 5 );c . CallArea ( r );c . CallArea ( t
    );Console . ReadKey ();}}}When the above code is compiled and executed, it produces
    the following result −Rectangle class area:Area: 70Triangle class area:Area: 25C#
    - Operator OverloadingYou can redefine or overload most of the built-in operators
    available in C#. Thus a programmer can use operators with user-defined types as
    well. Overloaded operators are functions with special names the keyword operator
     followed by the symbol for the operator being defined. similar to any other function,
    an overloaded operator has a return type and a parameter list.For example, go
    through the following function −public static Box operator + ( Box b , Box c )
    {Box box = new Box ();box . length = b . length + c . length ;box . breadth =
    b . breadth + c . breadth ;box . height = b . height + c . height ;return box
    ;}The above function implements the addition operator (+) for a user-defined class
    Box. It adds the attributes of two Box objects and returns the resultant Box object
    .Implementing the Operator OverloadingThe following program shows the complete
    implementation −using System ;namespace OperatorOvlApplication {class Box {private
    double length ;     // Length of a boxprivate double breadth ;    // Breadth of
    a boxprivate double height ;     // Height of a boxpublic double getVolume ()
    {return length * breadth * height ;}public void setLength ( double len ) {length
    = len ;}public void setBreadth ( double bre ) {breadth = bre ;}public void setHeight
    ( double hei ) {height = hei ;}// Overload + operator to add two Box objects.public
    static Box operator + ( Box b , Box c ) {Box box = new Box ();box . length = b
    . length + c . length ;box . breadth = b . breadth + c . breadth ;box . height
    = b . height + c . height ;return box ;}}class Tester {static void Main ( string
    [] args ) {Box Box1 = new Box ();     // Declare Box1 of type BoxBox Box2 = new
    Box ();     // Declare Box2 of type BoxBox Box3 = new Box ();     // Declare Box3
    of type Boxdouble volume = 0.0 ;      // Store the volume of a box here// box
    1 specificationBox1 . setLength ( 6.0 );Box1 . setBreadth ( 7.0 );Box1 . setHeight
    ( 5.0 );// box 2 specificationBox2 . setLength ( 12.0 );Box2 . setBreadth ( 13.0
    );Box2 . setHeight ( 10.0 );// volume of box 1volume = Box1 . getVolume ();Console
    . WriteLine ( "Volume of Box1 : {0}" , volume );// volume of box 2volume = Box2
    . getVolume ();Console . WriteLine ( "Volume of Box2 : {0}" , volume );// Add
    two object as follows:Box3 = Box1 + Box2 ;// volume of box 3volume = Box3 . getVolume
    ();Console . WriteLine ( "Volume of Box3 : {0}" , volume );Console . ReadKey ();}}}When
    the above code is compiled and executed, it produces the following result −Volume
    of Box1 : 210Volume of Box2 : 1560Volume of Box3 : 5400Overloadable and Non-Overloadable
    Operators:The following table describes the overload ability of the operators
    in C# −


    | Sr.No. | Operators & Description |


    | 1 | +, -, !, ~, ++, --These unary operators take one operand and can be overloaded.
    |


    | 2 | +, -, *, /, %These binary operators take one operand and can be overloaded.
    |


    | 3 | ==, !=, <, >, <=, >=The comparison operators can be overloaded. |


    | 4 | &&, &#124;&#124;The conditional logical operators cannot be overloaded directly.
    |


    | 5 | +=, -=, *=, /=, %=The assignment operators cannot be overloaded. |


    | 6 | =, ., ?:, ->, new, is, sizeof, typeofThese operators cannot be overloaded.
    |'
