  trans: "\n\n我们有 `display()` 函数的三种定义。在这种情况下，重载是通过改变函数接收的参数类型来实现的。在一种实例中，函数接收整数值；在另一个实例中接收浮点数，在最后一个实例中接收字符串。\n\
    \n## 运算符重载\n\n运算符重载是指使用单个运算符来执行各种操作。通过运算符重载，可以在 C# 运算符应用于自定义类型时为其添加额外功能。当操作数中的一个或两个属于用户定义的类时，就是这种情况。\n\
    \n这里是一个演示此种点的示例：\n\n```csharp\nusing system;\n\nnamespace polymorphismapp {\n\
    \    class object {\n        private double width; // the width of the ox\n  \
    \      private double length; // the length of the ox\n        private double\
    \ height; // the height of the ox\n\n        public double calculateVolume() {\n\
    \            return width * length * height;\n        }\n\n        public void\
    \ setLength(double l) {\n            length = l;\n        }\n\n        public\
    \ void setWidth(double w) {\n            width = w;\n        }\n\n        public\
    \ void setHeight(double h) {\n            height = h;\n        }\n\n        //\
