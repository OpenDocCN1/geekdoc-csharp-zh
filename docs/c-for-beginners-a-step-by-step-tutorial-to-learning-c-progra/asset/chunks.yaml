    # 封装与成员函数


    类的成员函数仅仅是在类定义内部具有定义或原型定义的函数，这与其他任何函数的方式相同。这种函数可以在其所属类的任何对象上进行操作，并且它可以访问该对象的所有类成员。


    成员函数仅仅是对象的属性（从设计角度来看），它们被定义为私有（private），以便实现封装的概念。我们只能通过公共成员函数访问此类变量。让我们演示如何在
