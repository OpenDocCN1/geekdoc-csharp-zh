    a pair of apostrophes (e.g. ''i'').

    5. `Float`- this is a data type used for storage of numbers that have decimal
    values in them.


    ### Objects


    Programmers regard objects as the most special type of data in the C# language.
    Basically, objects serve as the parent of other data types within `.net`. This
    data type, which requires the `object` keyword during its declaration, may accept
    any value from other data types. You may think of objects as addresses that point
    to certain parts of your computer’s memory.


    #### Real type – floating points


    In the c# language, “real type” refers to the actual numbers you’ve learned in
    mathematics. A floating-point real data type can either be `float` or `double`.


    1. `Float`- programmers call this subtype “single-precision real integer”. The
    default value of a `float` numer is `0.0f` (the `f` at the end is not case-sensitive).
    The letter `f` indicates that the value is a `float`.

    2. `Double`- programmers use the term “double-precision real integer” when referring
    to this type. Its default value is `0.0d (i.e. The letter `d` at the end is not
    case-sensitive.).# automatically tags real nums as `double` so you don’t really
    need to add `d` at the end of the value.


    #### Real type – decimals


    This programming language supports “decimal arithmetic”, a mathematical approach
    that uses decimal values to represent nums. This approach preserves its accuracy
    regardless of the values it works on. C# uses the `decimal` type to represent
    this kind of real. This data type is 128 bits and is accurate to the 29th decimal
    value. Because of its excellent accuracy, these are used by programmers for financial
    computations (e.g. Payments, interest, etc.).


    #### Integers


    This data type consists of 8 types, which are:


    - `byte`- an byte is a signed integer that is 8 bits long. That means it can contain
    up to 256 values (i.e. ⁸). Additionally, bytes can be either negative or positive.

    - `byte`- this type contains unsigned integers that are 8 bits long. It is almost
    identical to byte. The only difference is that byte can never negative.

    - `short`- these integers are signed and 16-bit.

    - `ushort`- these are signed integers whose length is 16.

    - `int`- this is probably the most popular data type in c#. Programmers use this
    data type because it is perfectly compatible with 32-bit processors and enough
    for typical computations. It is a signed integer whose length is 32.

    - `uint`- this 32-bit integer is unsigned. Thus, it can only be positive.

    - `long`- this integer is 64 bits long. It can be either positive or negative.

    - `ulong`- this is similar to `long` integers. The only difference is that `ulong`
    can only assume positive values.


    Strings


    A string is a set or sequence of characters. C# requires you to use `string` (i.e.
    A keyword) when declaring values belonging to this data type. You have to write
    each string between a pair of quotation marks. This language allows you to perform
    various operations on strings (e.g. Concatenation, character replacement, character
    search, etc.).


