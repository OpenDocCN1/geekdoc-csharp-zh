    \ 2]{ {1, 5}, {2, 6}, {4, 8} };\n    Jaggedarray[1] = new int[2, 2]{ {3, 5}, {4,\
    \ 6} };\n    Jaggedarray[2] = new int[2, 2];\n    Console.readline(jaggedarray[0][1,1]);\n\
    \    Console.readline(jaggedarray[1][1,0]);\n    Console.readline(jaggedarray[1][1,1]);\n\
    \  }\n}\n```\n\nThe code will return the following:\n\n![00123.jpg](images/0123.jpeg)\n\
    \nIn case an additional bracket is added, then this will become an array of array\
    \ of array. This is demonstrated in the following example:\n\n```csharp\nUsing\
    \ system;\n\nPublic class myarray {\n  Public static void main() {\n    Int[][][]\
    \ jaggedarray = new int[2][][] {\n      New int[2][] {\n        New int[3] {2,\
    \ 3, 5},\n        New int[2] {1, 5}\n      },\n      New int[1][] {\n        New\
