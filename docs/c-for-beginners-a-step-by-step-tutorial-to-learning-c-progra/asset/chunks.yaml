  trans: "\n如果存在信息丢失的可能性，请使用 `conversion`。例如，在将浮点值转换为整数值时会发生信息丢失（即小数部分将消失）。在将宽范围类型转换为窄范围类型时，你可能会丢失某些数据（例如\
    \ `Long-to-int` 转换、`double-to-float` 转换等）。要完成此过程，你需要使用 `type` 运算符。请查看下面的示例：\n\n\
    ```\nClass example\n{\n    Static void main()\n    {\n        double yourdouble\
    \ = 2.1d;\n        System.println(yourdouble);\n        long yourlong = (long)yourdouble;\n\
    \        System.println(yourlong);\n        yourdouble = 2e9d;\n        System.println(yourdouble);\n\
    \        int yourint = (int)yourdouble;\n        System.println(yourint);\n  \
    \  }\n}\n```\n\n如果正确编译并执行，该程序将给你以下结果：\n\n![00063.jpg](img/00063.jpeg)\n\n### 隐式转换\n\
    \n只有在不可能发生数据丢失时，你才能执行此类转换。这种转换被称为 `implicit`（隐式），因为它不需要任何运算符。当你将窄范围的值赋值给具有宽范围的变量时，C#\
    \ 编译器将执行隐式转换。\n\n### 字符串转换\n\nC# 允许你将任何数据类型转换为“string”。如果你使用 `+` 且至少有一个非字符串参数，编译器将自动执行此转换过程。在这里，非字符串参数将变为字符串，`+`\
    \ 运算符将产生新值。\n\n隐式类型转换用于执行如从基类到派生类的转换的操作。这些转换是以所谓的“类型安全”的方式进行的。另一种类型的转换是显式的（explicit），它需要强制转换运算符来完成其功能。C#\
    \ 中有 16 种可以作为转换方法的内置类型的不同函数。以下是你应该在 C# 环境中练习并熟悉的一些示例：\n\n* `tochar`-允许你获取一个类型并将其转换为单个\
    \ Unicode 字符\n* `byte`-允许你从一个类型转换并获取一个字节\n* `todetime`-允许你通过转换类型（字符串或整数）获取一个日期时间结构\n\
    * `tofloat`-允许你通过转换一个类型获取一个浮点值\n* `double`-允许你通过转换一个类型获取一个双精度\n* `decimal`-允许从浮点数转换为整数或十进制类型\n\
    * `int64`-允许从一个类型转换为一个 64 位整数\n* `int32`-允许从一个类型转换为一个 32 位整数\n* `int16`-允许从一个类型转换为一个\
    \ 16 位整数\n* `sbyte`-允许从一个类型转换为一个有符号类型\n* `string`-允许从一个类型转换为一个字符串\n* `single`-允许从一个类型转换为一个小的浮点数\n\
    * `uint64`-允许从一个类型转换为一个无符号整数\n* `uint32`-允许从一个类型转换为一个无符号长整数类型\n* `uint16`-允许从一个类型转换为一个无符号整数类型\n\
    * `type`-允许从一个类型转换为一个指定的类型\n\n对于你今天的练习，我鼓励你编写涵盖了上述每一个函数/转换的程序，以便更熟悉它们所包含的内容以及它们如何帮助你的编程。请记住，尽管你的代码可能很长，但你的输出应该始终产生你通过完成编程题想要实现的答案。\n\
    \n## 第 6 章：运算符的需要\n\n在本章中，我们将花一些时间讨论你在 C# 语言内部可以使用运算符。\n\n阅读这些材料后，你将了解这些运算符是如何工作的，以及你如何在源代码中使用它们。这些运算符非常易理解和使用，但这并不意味着它们是没用的；事实上，它们可以帮助确保你的代码执行你要求其完成的任务。如果不使用其中一些运算符，你的程序将缺乏功能且运行不会良好。这些运算符可能易于理解，但它们确实为增强代码的整体能力增加了大量力量。\n\
    \n无论你使用的是哪种类型的编程语言，运算符都是重要的。我们将分别详细介绍不同的运算符，以便你理解每个运算符是如何工作的，以及你如何使用每个运算符来实现各种目的并完成不同的任务。运算符帮助你处理对象和数据类型。它们接受输入并产生结果。C#\
    \ 语言使用特殊字符（例如 `+` 等）作为运算符。\n\nC# 程序员将运算符分为以下几类：\n\n### 赋值运算符\n\n虽然在赋值时可以使用一些运算符，但最常见的是等号。你可以使用的的一些运算符包括：\n\
    \n* `=` 此运算符的功能是允许你执行简单的赋值。它可以进行赋值，例如编写 `int sample = 100` 会告诉程序你想将 100 赋值给名为\
    \ `sample` 的变量。它不对该变量执行任何额外任务。\n* `+=` 这是加法赋值运算符。它的功能是将两个操作数的值相加，然后将和赋值给左侧的操作数。\n\
    * `-=` 程序员经常将其称为“减法”赋值运算符。它的功能是从左侧的值中减去右侧的值，然后将差赋值给左侧的操作数。\n* `*=` 此运算符的功能是乘以每个操作数的值，然后将乘积赋值给左侧的操作数。\n\
    * `/=` 此运算符的功能是除以两个变量，然后将结果赋值给左侧的变量。\n\n"
- fmt: "\nWhen you are working with the assignment operators, make sure that you have\
    \ other operands that belong to the same type of data. If you find that the various\
    \ operands you are using are not compatible, some issues could arise which can\
    \ result in an error in the program if you try to execute it and will require\
    \ additional time and effort to fix.\n\nIn C#, you need to use the equals sign\
    \ (i.e. `=`) to assign values. Here’s the syntax that you need to use when assigning\
    \ a value:\n\n`Name_of_operand = expression, literal or second_operand`\n\nHere\
    \ are some examples:\n\n```csharp\nInt y = 99;\nString hello = \"good morning.\"\
    ;\nChar sample = 'z';\n```\n\nImportant note: C# allows you to cascade (i.e. Use\
    \ several times within a single expression) the assignment operator. That means\
    \ you won’t have to enter multiple equals signs if you are creating variables\
    \ of the same data type. The examples given below will illustrate this rule:\n\
    \n```csharp\nInt d = 1, e = 2, f = 3;\nString hi = \"good morning.\", ye = \"\
    farewell.\", thanks = \"thank you.\";\n```\n\n### Logical Operators\n\nA logical\
    \ (also, known as “boolean”) operator accepts and returns boolean values (i.e.\
    \ True or false). Here are the four logical operators of C#:\n\n*   `&&` – programmers\
    \ refer to this operator as “logical and”. It will give you “true” if both of\
    \ the operands are true.\n*   `^` – this is known as the “exclusive or” operator.\
    \ It will give you true if one of the operands is true.\n*   `||` – this is the\
    \ “logical or” operator. You will get true if at least one of the operators is\
    \ true.\n*   `!` – this operator, known as the “logical negation” operator, reverses\
    \ the value of an operand.\n\nStudy the code to understand the use of these operators(109):\n\
    \n```csharp\nClass test\n{\n    Static void main()\n    {\n        bool x = true,\
    \ y = false;\n        Console.WriteLine(x && y);\n        Console.WriteLine(x\
    \ || y);\n        Console.WriteLine(!x);\n        Console.WriteLine(x ^ y);\n\
    \        // this is an example.\n    }\n}\n```\n\nOnce you have compiled and run\
    \ this code, you will see the following results:\n\n![00022.jpg](images/00022.jpeg)\n\
    \n### Arithmetic Operators\n\nThese operators help you in performing math operations.\
    \ This category consists of the following operators:\n\n*   `+` – use this operator\
    \ to perform addition using two operands together (e.g. `Int x = 1 + 1`)\n*  \
    \ `-` – this operator allows you to perform subtraction in your codes. It deducts\
    \ the value of the right operand from that of the left operand (e.g. `Int x =\
    \ 2 – 1`)\n*   `*` – with this operator, you can multiply the values of two operands\
    \ (e.g. `Int r = 6 * 6`)\n*   `/` – use this operator to divide numbers in your\
    \ codes. divides the value of the left operand by the right operand.\n*   `++`\
    \ – this is known as the “increment operator”. It increases the value of an operand.\
    \ Unlike the ones above, this operator works on a single operand. Also, you may\
    \ write it before the operand (e.g. `99++, ++5`, etc.)\n*   `--` – this operator\
    \ is the exact opposite of the increment operator. You can use it to decrease\
    \ an operand’s value. You may write it after the operand you want to modify.\n\
    *   `%` – this is often called the remainder or commonly known as the ‘modulo,’\
    \ operator. Its function is to divide the left operand by the right and then returns\
    \ the remainder.\n\nThe code given below will show you how these operators work:\n\
    \n```csharp\nClass test\n{\n    Static void main()\n    {\n        int d = 100,\
    \ e = 3;\n        Console.WriteLine(d + e);\n        Console.WriteLine(d - e);\n\
    \        Console.WriteLine(d / e);\n        Console.WriteLine(d * e);\n      \
    \  Console.WriteLine(++d);\n        Console.WriteLine(--e);\n        // this is\
    \ an example.\n    }\n}\n```\n\nOnce you compile and execute that code, you’ll\
    \ see this on your command prompt:\n\n![00124.jpg](images/00124.jpeg)\n\n### Binary\
    \ Operators\n\nThese operators work on binary numbers. In the it world, all of\
    \ the information is expressed as a sequence of zeros and ones. That means you\
    \ need to master binary operators if you want to be a successful programmer.\n\
    \nA binary operator works exactly like a logical one. Actually, you may think\
    \ that binary and logical operators use different inputs but conduct the same\
    \ processes. A logical operator uses boolean values to produce results. A binary\
    \ operator, on the other hand, works on numbers presented as binary digits. Here\
    \ are the binary operators you’ll encounter while C#:\n\n*   `&` – this is called\
    \ “binary and”. It indicates the positions where both operands have “1”.\n*  \
    \ `^` – programmers refer to this operator as “binary exclusive or”. It works\
    \ where operands are different.\n*   `|` – this is the “binary or” operator. It\
    \ indicates the positions where any has “1”.\n*   `~` – this acts as the negation.\
    \ Just like `!`, it reverses the value.\n*   `<<` – this is the “binary left shift”\
    \ operator. It moves bits to the left. This movement depends on the value you\
    \ assign (e.g. `4 << 3`, `4 << 2`).\n\n### Relational Operators\n\nThe next type\
    \ of operators that you can use is the relational operators. These operators are\
    \ very useful because they allow you to compare values. Each of these operators\
    \ gives a boolean. Because of this, these operators are used to create conditional\
    \ statements. We will have a look at some of the relational operators you can\
    \ work with assume e=150 and d=100:\n\n*   `==` – this is the equality operator.\
    \ It checks whether the two operands are equal (e.g. `X == y`). The function of\
    \ this operator is to check the equality of values. If the two values end up equal,\
    \ the operator will tell you it is true. Otherwise, the operator will tell you\
    \ it is false. For example, saying `d == e` would show up as false.\n*   `>` –\
    \ the function of this operator is to check whether the operand on the left is\
    \ greater than the operand the right. If it is, the operator will tell you it\
    \ is true. For example, saying `e > d` would.\n*   `<` – this is actually less\
    \ than an operator, it allows you to check whether the operand on the left side\
    \ is less than the operand on the right side. It will give you “true” if the left-hand\
    \ operand’s value is less than that of the right-hand operand (e.g. `Y < x`).\n"
