    This particular language has roots stemming from a programmer, Anders Hejlsberg,
    who was a member of the development team of .net framework for microsoft. Although
    some people tend to criticize `c#` as being somewhat of a “rip off” of java, you
    will see throughout the course of this learning manual that (if you have a knowledge
    of java that is) there are distinct differences in the content and structure of
    the language that make it different.


    With a design that was formulated for an environment that has the ability to use
    high-level languages and consists of executable code (also referred to as common
    language infrastructure or cli) it appeals to many who are interested in this
    easy-to-learn language.


    It boasts efficiency as one of its objects, so there are quite a few advantages
    to using it. Throughout this book, i will introduce you to how this object and
    component-oriented language can e easily acquired as a new language for you to
    use.


    Along with being a structured language, you can count on efficient results from
    your programming and coding within the `c#` language. I will assist you with optimizing
    your performance, in order to obtain your desired output from the work you put
    into programming and coding in this language.


    Although `c#` was developed using the microsoft platform, the language itself
    is not just limited to it. Another great concept of `c#` is that this versatility
    allows you to take the object-oriented language to different platforms to create
    multidimensional and available programs and software.


    As i am sure you are familiar with other languages, certain aspects of languages
    benefit certain desired results. There are many benefits, that will e covered
    in this guide to learning `c#`, that assist a user with portability, typing, metaprogramming,
    property, memory access and methods and functions—among an array of other positive
    attributes we will discuss and show examples of in the coming chapters.


    This language has only been around official versions since 2002, and therefore
    could e considered a newer programming language. However, do not let that lead
    to you believe it cannot and does not compete with other languages, such as java,
    that have been around a little longer.


    Developers of this language really aimed to improve upon and add different features,
    initially designed specifically for the .net framework now have been expanded,
    and were successful in this with many features—one many tend to like is the syntax
    used. There is a possibility for this language to e used to focus on gameplay.
    It is important to gamers that not only is the game interesting and holds one’s
    attention they also want the experience itself to enjoy As you are already somewhat
    a programmer yourself (or at least appreciate the capabilities of computers),
    after reading this book i expect you will have a great understanding of just hard
    programmers work in order to create the experience you have as an end Although
    i do not think reading this book allow you to create a masterful game (you need
    a lot of practice as well!)—i believe that you will understand concepts to a greater
    degree that are essential when you are dealing with the many components of programming
    and design. Keep in mind throughout the book that you are creating and fine-tuning
    a potentially endless world through coding and programming skills in this language.
    Object-oriented component really helps to reinforce this idea.


    In the coming chapters, you will learn how and why `c#` will e very useful to
    you and how you can easily pick up and become fluent in all the basics within
    less than a month.


    With a standard library that rivals any of the other languages the end of this
    book you will know how to find the source code you may need and execute it to
    produce fairly consistent and exquisite results. Another positive feature of this
    language is the clean conditions, which are favored by many along with windows
    integration that allows you to access one of the most popular operating systems
    with ease.


    As a final note on the very simplistic explanation of what `c#` is in this initial
    chapter, i just want to note a few general concepts of programming and coding
    that are good to keep in mind throughout this process.


