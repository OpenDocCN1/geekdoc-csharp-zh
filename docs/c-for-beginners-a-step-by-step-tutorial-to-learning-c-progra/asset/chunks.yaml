  trans: "\n\n# 使用 for, foreach 循环\n\n你已经知道如何使用 `for loop` 来访问数组的所有元素。`foreach loop`\
    \ 也可以帮助你遍历数组的元素。下面的示例演示了如何使用 `foreach loop` 遍历数组元素：\n\n```csharp\nUsing system;\n\
    \nNamespace arrayapp {\n  Class myarray {\n    Static void main(string[] args)\
    \ {\n      Int [] n = new int[10]; /* n 是一个包含 10 个整数的数组 */\n      //int x, y;\n\
    \      /* 初始化数组 n 的元素 */\n      For (int x = 0; x < 10; x++) {\n        N[ x ]\
    \ = x + 100;\n      }\n      /* 输出所有数组元素的值 */\n      reach (int y in n ) {\n \
    \       Int x = y-100;\n        Console.readline(\"element[{0}] = {1}\", x, y);\n\
    \      }\n      Console.readline();\n    }\n  }\n}\n```\n\n该代码给出了结果：\n\n`for loop`\
    \ 帮助我们向数组填充了 10 个值，第一个元素是 100，最后一个是 109。`foreach loop` 帮助我们从索引 0 直接访问到最后一个索引的所有元素。注意，变量\
    \ `x` 被用于填充数组值，而变量 `y` 用于遍历数组元素。该代码返回了下方的输出：\n\n![00126.jpg](img/00126.jpeg)\n\
    \n## 多维数组\n\nC# 支持多维数组的概念。这类数组也被称为矩形数组。多维数组是以行和列的形式组织的二维序列体。以下是一个多维数组的示例：\n\n\
    ```csharp\nInt[,] array1 = new int[3,2]{\n  {1, 5},\n  {2, 5},\n  {5, 7}\n};\n\
    // or\nInt[,] array1 = { {1, 5}, {2, 5}, {5, 7} };\n```\n\n如你在上面的示例所示，要初始化多维数组，必须根据行数和列数来定义它。`[3,2]`\
    \ 意味着数组将有 3 行 2 列。\n\n要访问多维数组的元素，我们使用两个索引。第一个索引标识行，第二个索引标识列。注意，两个索引都从 0 开始。让我们通过示例来演示这一点：\n\
    \n```csharp\nUsing system;\n\nPulic class myarray {\n  Public static void main()\
    \ {\n    Int[,] array1 = new int[3,2]{\n      {1, 5},\n      {2, 5},\n      {5,\
    \ 7}\n    };\n    Console.readline(array1[0, 0]);\n    Console.readline(array1[0,\
    \ 1]);\n    Console.readline(array1[1, 0]);\n    Console.readline(array1[1, 1]);\n\
    \    Console.readline(array1[2, 0]);\n    Console.readline(array1[2, 1]);\n  }\n\
    }\n```\n\n该代码为我们提供了以下输出：\n\n![00169.jpg](img/0169.jpeg)\n\n这就是我们访问元素的方法。`array1[2,1]`\
    \ 返回数组第 2 行第 1 列的元素。\n\n### 锯齿数组 (Jagged arrays)\n\n锯齿数组简单来说就是数组的数组。这些数组存储的是数组而不是直接的数据类型。要初始化锯齿数组，我们使用方括号\
    \ `[][]`。在第一个括号中，我们指定数组的大小，而在第二个括号中，我们指定要作为值的数组维度。这里有一个显示锯齿数组声明和初始化的示例：\n\n```csharp\n\
    Using system;\n\nPublic class myarray {\n  Public static void main() {\n    Int[][]\
    \ jaggedarray = new int[2][];\n    Jaggedarray[0] = new int[4]{1, 2, 3, 4};\n\
    \    Jaggedarray[1] = new int[3]{5, 6, 7};\n    Console.readline(jaggedarray[0][0]);\n\
    \    Console.readline(jaggedarray[0][2]);\n    Console.readline(jaggedarray[1][1]);\n\
    \  }\n}\n```\n\n我们在上面的代码中声明并初始化了锯齿数组。该代码将给你以下结果：\n\n![00051.jpg](img/0051.jpeg)\n\
    \n锯齿数组也可以将多维数组作为值存储。我们可以在第二个括号中使用 `[,]` 来表示多维。这里是一个示例：\n\n```csharp\nUsing system;\n\
    \nPublic class myarray {\n  Public static void main() {\n    Int[][,] jaggedarray\
    \ = new int[3][];\n    Jaggedarray[0] = new int[3, 2]{ {1, 5}, {2, 6}, {4, 8}\
    \ };\n    Jaggedarray[1] = new int[2, 2]{ {3, 5}, {4, 6} };\n    Jaggedarray[2]\
    \ = new int[2, 2];\n    Console.readline(jaggedarray[0][1,1]);\n    Console.readline(jaggedarray[1][1,0]);\n\
    \    Console.readline(jaggedarray[1][1,1]);\n  }\n}\n```\n\n该代码将返回以下内容：\n\n![00123.jpg](img/0123.jpeg)\n\
    \n如果增加了额外的括号，这将变成数组的数组的数组。这在下面的示例中进行了演示：\n\n```csharp\nUsing system;\n\nPublic\
    \ class myarray {\n  Public static void main() {\n    Int[][][] jaggedarray =\
    \ new int[2][][] {\n      New int[2][] {\n        New int[3] {2, 3, 5},\n    \
    \    New int[2] {1, 5}\n      },\n      New int[1][] {\n        New int[3] {7,\
    \ 6, 8}\n      }\n    };\n    Console.readline(jaggedarray[0][0][0]);\n    Console.readline(jaggedarray[0][1][1]);\n\
    \    Console.readline(jaggedarray[1][0][2]);\n  }\n}\n```\n\n该代码返回以下内容：\n\n![00133.jpg](img/0133.jpeg)\n\
    \n注意我们使用了三个方括号 `[][][]`，这意味着数组的数组的数组。`jaggedarray` 将拥有元素。这些数组也都只有一个维度。\n\n## 第\
    \ 11 章：类 (classes)\n\n类可以被看作对象的蓝图。现实世界中的对象具有形状、速度等特征。例如，`car` 是一个对象。这意味着 `car`\
    \ 是一个类，而每个对象都是 `car` 类型。\n\n在面向对象编程中（不要忘记 C# 是一种面向对象的语言），类拥有字段、属性、方法等。类应该定义数据的类型以及对象应该的功能。\n\
    \n通过类，你可以创建自定义类型，将其他类型的变量以及方法和事件在一起。\n\n在 C# 中，我们使用 `class` 关键字来定义 `class`。这是一个关于它的简单示例：\n\
    \n```csharp\nPublic class testclass {\n  Public string field1 = string.empty;\n\
    \  Public testclass() {\n  }\n  Public void testmethod(int param1, string param2)\
    \ {\n    Console.readline(\"the first parameter is {0}, and second parameter is\
    \ {1}\", Param1, param2);\n  }\n  Public int autoimplementedpropertytest { get;\
