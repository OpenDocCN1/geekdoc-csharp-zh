    \            height = y;\n        }\n        public override int area() {\n  \
    \          Console.WriteLine(\"the area of object2 is:\");\n            return\
    \ width * height / 2;\n        }\n    }\n\n    class caller {\n        public\
    \ void callarea(object obj) {\n            int x;\n            x = obj.area();\n\
    \            Console.WriteLine(\"the area is: {0}\", x);\n        }\n    }\n\n\
    \    class testerclass {\n        static void main(string[] args) {\n        \
    \    caller c = new caller();\n            object1 o1 = new object1(10, 7);\n\
    \            object2 o2 = new object2(10, 5);\n            c.callarea(o1);\n \
    \           c.callarea(o2);\n            Console.ReadKey();\n        }\n    }\n\
    }\n```\n\n该代码返回以下输出：\n\n![00079.jpg](img/00079.jpeg)\n\n## 第 16 章：正则表达式 (134)\n\
    \n正则表达式被解释为可以与输入文本匹配的模式。在 .net 框架中，有一个正则表达式引擎可以用于这种匹配。模式由一个或多个运算符、字符字面量或结构组成。\n\
    \n### Regex 类\n\n这是一个用于表示正则表达式的类。该类带有许多如下函数：\n\n1. `Match(string input)`：方法指定构造函数中指定的正则表达式是否在输入字符串中匹配项。\n\
    2. `Match(string input, int startpos)`：方法指定构造函数中指定的正则表达式是否从输入字符串中的指定位置开始匹配项。\n\
    3. `static Match(string input, int pattern)`：静态方法指定指定的正则表达式是否在输入字符串中匹配项。\n\n"
