    x is less than 10\");\n        }\n        Console.WriteLine(\"the value of x is:\
    \ {}\", x);\n        Console.readline();\n    }\n}\n```\nThe code returns the\
    \ following output:\n![0016.jpg](images/0016.jpeg)\nThe condition was found to\
    \ be true, the value of variable x is less than 10, hence the statement was executed.\
    \ What if the condition was false?\n\n```csharp\nUsing system;\n\nNamespace decisionmaking\
    \ {\nClass ifstatement {\n    Static void main(string[] args) {\n        /* defining\
    \ a local variable */\n        Int x = 15;\n        /* check a boolean condition\
    \ via if */\n        If (x < 10) {\n            /* be printed if the condition\
