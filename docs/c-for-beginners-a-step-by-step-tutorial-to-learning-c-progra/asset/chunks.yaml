    \ length: \");\n            Length = Convert.ToInt32(Console.readline());\n  \
    \          Console.WriteLine(\"enter the width: \");\n            Width = Convert.ToInt32(Console.readline());\n\
    \        }\n        Public void calculatearea() {\n            Return length *\
    \ width;\n        }\n        Public void show() {\n            Console.WriteLine(\"\
    the length of the figure is: {0}\", length);\n            Console.WriteLine(\"\
    the width of the figure is: {0}\", width);\n            Console.WriteLine(\"the\
    \ area of the figure is: {0}\", calculatearea());\n        }\n    }//end the class\
    \ figure\n\n    Class runfigure {\n        Static void main(string[] args) {\n\
    \            Figure f = new figure();\n            F.getdetails();\n         \
    \   F.show();\n            Console.readline();\n        }\n    }\n}\n```\n\n以下是代码的输出：\n\
    \n![00081.jpg](img/00081.jpeg)\n\n类成员变量 `width` 和 `length` 被声明为 `private`，这意味着在创建类实例后，我们可以从\
    \ `main()` 函数访问它们。我们创建了 `figure` 类的实例并将其命名为 `f`。\n\n`calculatearea()` 和 `show()`\
    \ 成员函数能够在不使用类实例的情况下访问这些成员变量。我们也可以在创建 `figure` 类的实例后，从 `main()` 函数访问它们。该实例已被命名为\
    \ `f`。\n\n### public 访问修饰符\n\n使用 `public` 访问修饰符，类能够向其他对象和函数暴露其成员函数和成员变量。任何声明为\
    \ `public` 的类成员都可以从该类的外部访问。考虑以下示例：\n\n```csharp\nUsing system;\n\nNamespace figureapplication\
    \ {\n    Class figure {\n        // the class member variables\n        Public\
