  trans: "\n}\n\n代码返回以下输出：\n\n![00176.jpg](img/00176.jpeg)\n\n# 嵌套 switch\n\n可以在另一个\
    \ `switch` 语句中创建一个 `switch` 语句。这就形成了一个嵌套的 `switch`。这是一个示例：\n\n```csharp\nUsing\
    \ system;\n\nPublic class nestedswitch\n{\n    Public static void main()\n   \
    \ {\n        Int x = 10;\n        Switch (x)\n        {\n            Case 10:\n\
    \                Console.WriteLine(10);\n                Switch (x - 1)\n    \
    \            {\n                    Case 9:\n                        Console.WriteLine(9);\n\
    \                        Switch (x - 2)\n                        {\n         \
    \                   Case 8:\n                                Console.WriteLine(8);\n\
    \                                break;\n                        }\n         \
    \               break;\n                }\n                break;\n          \
    \  Case 20:\n                Console.WriteLine(20);\n                break;\n\
    \            Case 125:\n                Console.WriteLine(25);\n             \
    \   break;\n            Default:\n                Console.WriteLine(30);\n   \
    \             break;\n        }\n    }\n}\n```\n\n输出如下：\n\n# 第 8 章：循环\n\n作为一名程序员，你将使用循环语句来反复运行某些代码块。循环在\
    \ C# 编程中起着重要作用。因此，如果你想在短时间内掌握这门语言，也应该仔细学习这些材料。\n\n## 循环——基础\n\n在创建程序时，你通常需要多次执行代码序列。多次输入相同的代码块会非常疲累。因此，你需要一种快速简单的方法来重复代码。幸运的是，C#\
    \ 语言支持循环语句。\n\n循环是一种重复运行代码片段的工具。你可以使用它运行特定次数的代码，或者在满足给定条件时一直运行。C# 提供了不同类型的循环语句。让我们详细分析每个类型：\n\
    \n### while 循环\n\n这是 C# 中是最简单的循环语句。它的语法如下：\n\n```csharp\nWhile (the_assigned_condition)\n\
    {\n    The_loop’s body;\n}\n```\n\n在此语法中，`the_assigned_condition` 是一个产生布尔值的表达式。该条件决定了\
    \ `body` 运行的次数。而 `body` 是你想要执行的语句（或语句组）。\n\n下图将说明 while 循环的工作原理：\n\n![00178.jpg](img/00178.jpeg)\n\
    \n在处理“while”循环时，C# 程序会检查布尔表达式的值。如果该值为“true”，程序将运行循环体内的所有语句。然后，程序将再次检查布尔表达式以查看其值。如果值仍为\
    \ true，程序将重新运行循环体并返回第一步（即检查表达式的值）。这个过程将一直持续，直到表达式求值为 false 为止。一旦发生这种情况，程序将处理循环正后的代码。\n\
    \n重要提示：如果条件为假，你的 C# 程序将不会运行 while 循环的体。因此，如果你在启动程序时该值为 false，那么你的语句将永远不会执行。接下来的示例将说明\
    \ while 循环是如何运行的：\n\n```csharp\nInt timer = 10;\nWhile (timer >= 0)\n{\n    System.WriteLine(\"\
    time remaining: \" + timer);\n    Timer--;\n}\n```\n\n如果你编译并执行这段代码，你的提示符将打印此内容：\n\
    \n![00163.jpg](img/0163.jpeg)\n\n#### break 运算符\n\n你可以使用 `break`（一种 C# 运算符）来提前退出循环。如果程序员不想等待循环自然结束，他们就会使用此运算符。因为循环一旦遇到\
    \ `break` 就会结束。这种情况会强制程序跳转到循环后的代码。在 C# 中，你只能在循环体内使用此运算符。这意味着 `break` 只有在循环运行时才有效。\n\
    \n### do-while 循环\n\n`do-while` 循环与 `while` 循环几乎相同。这些循环之间的唯一区别是，前者在运行循环体之后分析布尔值。因此，你可以放心，即使布尔表达式为假，你的代码也会运行一次。以下是\
    \ do-while 循环的语法：\n\n```csharp\nDo\n{\n    Statements;\n} while (boolean expression)\n\
    ```\n\ndo-while 循环按照此模式工作：\n\n![00014.jpg](img/0014.jpeg)\n\n程序将执行循环体内的所有语句。然后，它将检查条件（即布尔表达式）。如果条件求值为\
    \ true，程序将再次执行循环体并执行“值检查”。这个过程将一直持续，直到条件变为 false。因此，如果赋值的条件始终求值为 true，你的代码可能会永远运行。\n\
    \n### for 循环\n\n通常，`for` 循环比 do-while 和 `while` 循环复杂。然而，`for` 循环可以帮助你用更少的 C# 代码完成困难的任务。`for`\
    \ 循环的语法为：\n\n```csharp\nFor (initializer; boolean_expression; update)\n{\n   \
    \ The_loop’s body;\n}\n```\n\n一个 `for` 循环有一个 `initializer`（即赋值值）、一个 `boolean_expression`\
    \ 和一个更新计数器的语句。`counter`（初始值）是 `for` 循环最显著的特征。计数器增加直到达到最终值（例如 10）。此外，程序员通常知道 `for`\
    \ 循环将迭代多少次。你可以在单个 `for` 中包含递增和递减变量。在，你可以包含递增和递减变量。\n\n重要提示：`for` 循环的所有部分都是可选的。你可以通过留空来创建一个无限的\
    \ `for` 循环。这是一个示例：\n\n![00137.jpg](img/0137.jpeg)\n\n此时，你已经准备好学习 `for` 循环的不同部分了。\n\
    \n#### initializer\n\n`for` 循环可以拥有一个 `initializer`：\n\n```csharp\nFor (ule sample\
    \ = 1; ...)\n{\n    // 你可以在这里使用 sample。\n}\n// 在这里不能使用 sample。\n```\n\nC# 程序在运行\
    \ `for` 循环之前执行此片段。通常，程序员使用初始化器创建一个计数器（也称为循环变量）并为其分配初始值。该计数器在循环体内是可用且可使用的。\n\n\
    #### boolean_expression\n\n`for` 循环需要一个 `boolean_expression`：\n\n```csharp\nFor\
    \ (...; sample < 5; ...)\n{\n    // 这是循环体。\n}\n```\n\nC# 程序在运行循环体之前评估 `boolean_expression`。如果结果为\
    \ true，程序将执行循环体；否则，相关程序将跳转到在当前循环之后的语句。\n\n#### update 语句\n\n`for` 循环还有一个更新计数器的语句：\n\
    \n```csharp\nFor (...; ...; sample++)\n{\n    // 这是循环体。\n}\n```\n"
- fmt: "\nThis is the final part of a “for” loop. Basically, an update statement updates\
    \ the loop’s counter. Let’s use the code snippet given above:\n\n```c\nfor (int\
    \ sample = 10; sample > 1; sample--)\n{\n    // this is the loop’s body.\n}\n\
    ```\n\nThe program executes this part after running the loop’s body. Keep in mind\
    \ that this statement updates the counter’s value.\n\n### The loop’s body\nThis\
    \ part consists of c# statements. It can utilize the variables you declared in\
    \ the loop’s initializing fragment. Check the example below:\n\n```c\nfor (int\
    \ sample = 10; sample > 1; sample--)\n{\n    Console.WriteLine(sample);\n}\n```\n\
    \n### The continue operator\nIn some cases, you need to stop the active iteration\
    \ without ending the loop itself. You can accomplish this task using the c# operator\
    \ called “continue”. The example given below will illustrate how this operator\
    \ works:\n\n![00049.jpg](images/00049.jpeg)\n\nThis code computes the total of\
    \ all the odd numbers within the range (1 to n), which produce remainders when\
    \ divided by 7.\n\n### The “foreach” loop(116)\nJust recently, c# introduced the\
    \ concept of “foreach” loops (i.e. Extended “for” loops). This loop concept is\
    \ also available in other programming languages such as c, v, c++, php, etc. With\
    \ this programming tool, you can run all of the elements of a list, array, or\
    \ other groups of values. A “foreach” loop takes all of the existing elements\
    \ even in non-indexed data groups.\n\nWhen writing this kind of loop, use the\
    \ following syntax:\n\n```c\nforeach (type name_of_variable in name_of_group)\n\
    {\n    The_statements;\n}\n```\n\nAs you can see, this loop is much simpler than\
    \ a typical “for” loop. A “foreach” loop can help you scan all of the objects\
    \ inside a collection quickly. It’s no surprise that countless programmers use\
    \ this loop in writing their codes.\n\n### The nested for loop\nC# allows you\
    \ to place a “for” loop inside another “for” loop. The loop at the innermost part\
    \ of the code runs the most number of times. The one at the outermost section,\
    \ on the other hand, gets the least number of repetitions. You should use the\
    \ following syntax when “nesting” for loops:\n\n```c\nfor (initializing_fragment,\
    \ condition, update_statement)\n{\n    for (initializing_fragment, condition,\
    \ update_statement)\n    {\n        Statements\n    }\n}\n```\n\nHere, the program\
    \ runs the initial “for” loop, executes its body and triggers the nested loop.\
    \ The program will check the second loop’s condition and execute the codes inside\
    \ it until evaluation comes false. Then, the program will make the necessary adjustments\
    \ on the loops’ counters. The program will repeat the entire process until all\
    \ of the conditions evaluate to false.\n\n## Chapter 9: methods\nThis chapter\
    \ will focus on methods. Here, you’ll learn how to declare and utilize methods\
    \ in your programs. You need to memorize the lessons contained in this chapter\
    \ to be an effective programmer.\n\n### Methods the basics\nFor most programmers,\
    \ methods are core aspects of any program. Methods can solve problems, accept\
    \ user inputs (known as parameters), and produce results. A method is simply a\
    \ group of statements that have been put together to perform a common task. Every\
    \ c# class has at least one method which is the main method. For you to use a\
