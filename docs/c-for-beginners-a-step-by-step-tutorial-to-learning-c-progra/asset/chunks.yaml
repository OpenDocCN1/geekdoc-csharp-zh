    \n### 结构的特征\n\n到目前为止，你已经了解如何使用结构以及它们的一些特性。C# 中的结构与 C 和 C++ 支持的结构有很大区别。C# 结构具有以下特征：\n\
    \n- 结构可以拥有字段、索引器、方法、属性和事件。\n- 结构可以定义构造函数，但没有析构函数。然而，在结构中，我们不允许定义默认构造函数。这是因为它是自动定义的，且无法更改。\n\
    - 结构不能继承另一个结构或类。\n- 通过结构，我们可以实现一个或多个接口。\n- 结构的成员不能被指定为虚（virtual）、抽象（abstract）或保护（protected）。\n\
