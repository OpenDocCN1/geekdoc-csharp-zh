    \ \"hi\" 和 \"learner\" 之间有一个空格。多余的那个已经被替换或删除。\n\n## 第 17 章：异常处理过程 (135)\n\n应用程序在执行过程中通常会遇到错误。错误发生后，程序会抛出一个带有更多有关错误信息的异常。应该处理异常以防止程序崩溃。在\
    \ c# 中，异常使用 4 个主关键字进行处理：\n\n1. Try- 此关键字标识了激活特定异常的代码块。其后紧跟跟一个或多个 catch 块。\n2.\
    \ Catch- 程序应该在程序内部需要处理问题的地方使用处理器捕获异常。catch 是一个关键字，指示异常将在此处捕获。\n3. Finally- finally\
    \ 块用于无论是否抛出异常都执行一组语句。例如，无论是否抛出异常，文件在打开后都必须关闭。\n4. Throw- 异常通常在问题发生后后被抛出。使用 try\
    \ 和 catch 的组合来捕获异常。try/catch 块必须放置在可能引发异常的代码处。此类代码被称为“受保护的代码”，这里是使用这些关键字的语法：\n\
    \n```\ntry {\n    // 抛出异常的语句\n} catch (exception name1) {\n    // 错误处理代码\n} catch\
    \ (exception name2) {\n    // 错误处理代码\n} catch (exception name3) {\n    // 错误处理代码\n\
    } finally {\n    // 要执行的语句\n}\n```\n\n可以使用许多 catch 语句，目标是捕获 try 块中抛出的许多不同的异常。在\
    \ c# 中，异常使用类来表示。`system.exception`充充 c# 中所有异常类的基类，因为所有其他类都直接或间接地派生自它。\n\n### 处理异常\n\
    \n在 c# 中，可以使用 try 和 catch 块来处理异常。通过这些块，我们可以将核心程序语句与处理错误的语句分离。我们可以使用 try、catch\
    \ 和 finally 关键字来处理错误。例如，除法 y 应该抛出一个异常，因为它在数学上是不支持的。让我们创建一些代码来处理这种情况：\n\n```csharp\n\
