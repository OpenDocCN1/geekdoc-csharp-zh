    # 如何正确格式化代码


    格式化代码时需要遵循的某些规则包括：

    * 你可以在类定义内部对方法进行缩进。C# 允许在格式化源代码时使用任意数量的制表符（即按下键盘上的 tab 键后获得的字符）。

    * 你应该在方法定义内部对其内容进行缩进。

    * 将左括号（即 `{`）放置在它所属的类或方法正下方。此外，如果它是该行的唯一字符，将是。

    * 确保右括号（即 `}`）与左括号垂直对齐。

    * 你的类名应该以大写字母开头。

    * 你的变量名应该以小写字母开头。

    * 你的方法名应该以大写字母开头。

    * 写在另一个代码内部的代码需要缩进。


    ## 类名

    在 c# 中，每个程序都有一个或多个类定义。程序员通常将每个类定义存储在与类名对应的单独文件中。此外，这些文件的扩展名应该是 `.cs`。你可以将不同的类编译到一个单独文件中，而不会遇到任何技术问题。然而，导航你的代码将变得很困难。


    ## 关于 c# 的更多信息

    c# 编程语言是高级、现代、多用途且面向对象的。它与 c++、java 等其他语言有一些相似之处。主要区别是 c# 提供了更简单的编程和简化的语法。一个 c#
    程序有一个或多个 `.cs` 文件，其中存储了数据类型和定义。你需要编译这些 `.cs` 文件来获取可执行代码（即以 `.dll` 或 `.exe` 结尾的文件）。例如，如果你编译
    hello 程序，将得到一个名为 `hello.exe` 的可执行文件。


    # 创建 c# 所需的内容

    在使用 c# 编写程序之前，你需要两个重要的东西——文本编辑器（例如记事本）和框架。文本编辑器将帮助你编写和编辑代码。另一方面，框架将帮助你编译和执行程序。


    ### 什么是 .net?

    从技术上来说，.net 是用于开发和运行计算机程序的框架。大多数现代 Windows 系统都有 .net 作为内置框架。因此，如果你使用的是微软的现代操作系统，就不需要在计算机上安装任何软件。如果你使用的是旧版本的
    Windows，你需要先下载框架。你可以访问此[网站](http://microsoft.com) 并获取最新版本的 .net。重要说明：在阅读本书其余部分之前，请确保你的计算机已安装
    .net。否则，你将在编译和执行后面看到的示例程序时遇到问题。


    ### 文本编辑器

    你应该使用文本编辑器来编写、编辑和保存源代码。你可以使用计算机上安装的任何文本编辑器。如果你不想下载额外的程序，可以简单地使用“记事本”（即 Windows
    预装的文本编辑器）。


    ### 编译和执行程序

    你需要包含的操作包括：

    1. 生成一个 `.cs` 文件并将其命名为 `hello.sharp`。

    2. 在该 `.cs` 文件中编写源代码。

    3. 编译代码以获取 `.exe` 文件。

    4. 运行生成的程序。


    打开你的计算机，让我们开始编写代码。重要说明：本书假设你使用的是 Windows 。


    ## 第 3 章：揭秘数据类型

    现在我们来谈论数据以及 c# 中看到的不同类型，我们有三个基本类别：值类型和引用类型。如果你熟悉编程，你一定熟悉与数据相关的不同类型。


    ### 属性

    数据类型具有以下属性：

    * 名称（例如 `Int`、`char`、`bool` 等）

    * 大小（例如 1 字节）

    * 默认值（例如 1、2、3 等）


    ### c# 中的不同数据类型

    C# 支持以下数据类型：

    * `boolean`

    * `字符`

    * `object`

    * `浮点`

    * `decimal`

    * `整数`

    * `string`


    由于这些数据类型预装在 c# 语言中，程序员称之为“原生类型”。


    ### 值类型

    值类型正如其名所示，是由值本身的数据类型。这些术语如 `boolean` 字节或 `int`。在你的虚拟环境中运行的一个良好测试是使用 `sizeof(type)`
    术语获取给定数据类型的大小，将 type 替换为你想要知道的数据类型。值类型的完整列表为 `decimal`、`double`、`bool`、`float`、`char`、`byte`、`long`、`system`、`short`、`uint`、`int`、`ushort`
    和 `ulong`。


    在引用类型数据内部，我们指的是（你可能猜到了！）对数据类型的引用。这些数据类型能够告诉你内存所在的位置。甚至可以有多个引用指向多个变量。这种数据，我们使用
    `string`、`dynamic` 和 `object` 作为关键字来描述引用数据类型。

