    # Destructors


    A destructor refers to a special member function of a class that is run anytime
    an object goes out of scope. A destructor takes the same name as a class ut it
    should be preceded by a tilde (~). A destructor cannot take parameters neither
    can it return a value. A destructor is useful for releasing resources before leaving
    a program. The following example demonstrates how to use a:


    ```csharp

    Using system;


    Namespace constructorapplication {


    Class person {


    Private double height;  // height of the person


    Person() {


    Console.writeline("we are creating an object");

    }


    ~person() { //a destructor


    Console.writeline("we are deleting an object");

    }


    Pulic void setheight( double heig ) {


    Height = heig;

    }


    Pulic double getheight() {


    Return height;

    }


    Static void main(string[] args) {


    Person p = new person();


    // set the height


    P.setheight(7.0);


    Console.writeline("the height of the person is: {0}", p.getheight());


    Console.readkey();


    }


    }

    ```

