    # Encapsulation and member functions


    A member function for a class is simply a function with a definition or prototype
    within the definition of the class in the same way as any other function. Such
    a function can operate on any object of the class in which it is a member, and
    it can access all the class members for the object.


    Member functions are simply the attributes of the object (from a design perspective)
    and they are defined as private so as to implement the concept of encapsulation.
    We can only access such variables using public member functions. Let’s demonstrate
    how we can set and access the various members of a class in c#:


    ```csharp

    Using system;


    Namespace cueapplication {


    Class cue {


    Private double length;  // length of a cue


    Private double readth;  // readth of a cue


    Private double height;  // height of a cue


    Pulic void setlength( double len ) {


    Length = len;


    }


    Pulic void setreadth( double rea ) {


    Readth = rea;

    }


    Pulic void setheight( double heig ) {


    Height = heig;

    }


    Pulic double getvolume() {


    Return length * height;

    }


    Class cuetester {


    Static void main(string[] args) {


    Cue cue1 = new cue();  // declare cue1 of type cue


    Cue cue2 = new cue();


    Double volume;  // declare cue2 of type


    // cue 1 specification


    Cue1.setlength(4.0);


    Cue1.setreadth(6.0);


    Cue1.setheight(8.0);


    // cue 2 specification


    Cue2.setlength(10.0);


    Cue2.setreadth(14.0);


    Cue2.setheight(12.0);


    // volume of cue 1


    Volume = cue1.getvolume();


    Console.writeline("volume of cue1 is: {0}", volume);


    // volume of cue 2


    Volume = cue2.getvolume();


    Console.writeline("volume of cue2 is: {0}", volume);


    Console.readkey();


    }


    }

    ```


