    ## 引言

    尽管学习一门新语言并非易事，但本书的目标是让你尽可能快地上手并理解。其目标是为你提供完整且全面的技能，帮助你记住重要的知识，并引导你在 `c#` 中的编程和实践。为了让你以最高效的学习，我希望你也能进行相应的实践。


    本书将介绍 `c#` 的基础描述，并最终提供一些实用的提示和资源，帮助你应对可能需要的地方。尽管这本书并非仅仅是一本向你介绍编程艺术的入门手册，但对于熟悉其他语言的人来说，它将非常有价值。尽管我为你提供了信息和基础技能，但将这些技能付诸实践取决于你自己。我强烈建议你找到一种严格的习惯来帮助自己，包括研究、学习并在自己的环境中练习以熟悉这些技能。俗话说，你可以把马引到水边，但不能迫它喝水！


    我可以为你提供知识和资源，但合成并使用它们创建你自己的程序和代码取决于你自己。


    对于像 `c#` 这样面向对象且结构化的语言，我认为你会发现它是容易学习且友好的。这种高级语言在某些方面构建并补充了 `c` 和 `java` 语言。然而，即使你是这些语言的大师，这项新任务也有陡峭的学习曲线。对于所有编程语言来说，了解它们在基础和功能层面的运作是有帮助的。在书中，我鼓励你运用你的知识和直觉。


    ## 第一章：什么是 c#

    你来到这里并购买这本书是为了学习如何成为一名 `c#` 程序员。在本书中，你将学习如何在编程项目中应用 `c#` 的基本规则。`C#`（读作 "see sharp"）是一种由微软设计和开发的面向对象的编程语言。


    这是一门相当新的语言，被认为具有很强的功能性和面向对象的特性。尽管 `c#` 绝对不是 `c` 或 `c++` 语言，但这些语言之间确实某些相似之处，拥有其中一种或两种语言的见解或经验被认为是有帮助的。对于所有编程语言来说，了解它们在基础和功能层面的运作是有帮助的。在书中，我鼓励你运用你的知识和直觉。


