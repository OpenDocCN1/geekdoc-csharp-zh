    on the same line as shown below, which is more convenient.


    ```java

    String name = "pirzada"; int age = 35; int weight = 70; bool ismarried = true;

    ```


    You can also, use a mathematical expression.


    ```java

    Int wowexp = (3 + 2) * 4; Console.WriteLine(wowexp);

    ```


    Output:

    20


    The right side is being evaluated and then assigned to the variable on the left.
    Meaning `3+2` is `5` and `5 * 4` is `20`, which will e assigned to the `wowexp`
    variable.


    You can also, assign the same value to multiple different variables all at the
    same time.


    ```java

    Int a, c; a = c = 786; Console.WriteLine(a); Console.WriteLine(); Console.WriteLine(c);

    ```


    Output:

    786

    786

    786


    ### Using type inference


    C# 3.0 introduced the implicitly typed variable with the `var` keyword. Now you
    can declare a local variable without giving an explicit or real type. The variable
    still receives a type at compile time, ut the type is provided by the compiler.


    Actually, the `var` keyword instructs the compiler to infer the type of variable
    from the expression on the right side of the initialization statement. The compiler
    is given the task to determine and assign the suitable type.


    ```java

    Var varialename = variablevalue; // syntax

    ```


    `Var` is optional, and it’s just for convenience.


    Let’s use the same variables as above.


    ```java

    Var name = "pirzada"; var age = 35; var weight = 70; var ismarried = true;

    ```


    Now the variables are implicitly typed local variables, meaning that you don’t
    have to explicitly specify the type. The compiler is tasked to determine and assign
    the suitable type. A string variable is indicated by double quotes, char variable
    is denoted y single quotes, and a `bool` type is denoted by `true` and `false`
    values.


    Suggestion: using `var` is convenient, ut use it only when the type is obvious
    from the right side of the assignment.


    Double is used to denote a literal numer with a decimal point unless you add the
    m/m suffix to indicate a decimal variable or the f/f suffix to indicate float
    variable.


    ```java

    Var value = 24899.45m; var numer = 20.8f;

    ```


    To initialize `numer`, you need to add `f` as a suffix after `20.8` to explicitly
    tell the compiler to change `20.8` to a `float`. Similarly, to initialize `value`,
    you need to add `m` as a suffix to change `24899.45` into a `decimal` type.


    A few rules you need to follow:


    * `var` can only e declared and initialized in a single statement. Otherwise,
    the compiler doesn’t have anything from to infer the type.

    * `var` not supposed to e utilized on fields at class scope.

    * the initializer cannot null and must an expression.

    * multiple implicitly typed variables cannot in the same statement.

    * an object cannot unless a new object is created in the initializer.


    #### Default value expressions


    Default value expressions are especially useful in combination with generic types
    when you don’t know what the default value for the given type will e.


    `default(t)` returns the default value of a type, where `t` is a reference type
    or a value type.


    ```java

    T varialename = default(t); // syntax

    Example:

    Var name = default(string); var age = default(int); var weight = default(int);

    ```


    #### Default literal:


    The default literal is a new feature in c# 7.1 that is used to get the default
    value of the specified type when the statement is executed. This feature works
    for value types as well as reference types. Note: default literal is equivalent
    to `default(t)` where `t` is the inferred type.


    ```java

    String name = default; int age = default; int weight = default; bool ismarried
    = default; Console.WriteLine(name); Console.WriteLine(age); Console.WriteLine(weight);
    Console.WriteLine(ismarried);

    ```


    In the output low a null value is printed as a blank line. Output for default
    literal & default(t):

    00 false


    #### New operator


    Using the `new` operator invokes the default constructor of a value type. This
    allows you to create a variable using the `new` keyword, which automatically sets
    the variable to its default value. Note: all values in c# are an instance of a
    specific type.


    ```java

    Var age = new int(); var ismarried = new bool(); Console.WriteLine(age); Console.WriteLine(ismarried);

    ```


    Output:

    0

    False


    ### Chapter 5: what is type conversion?


    In general, an operator works on arguments that belong to the same type. However,
    the c# language offers a wide range of data types that you can use for certain
    situations. To conduct any process on variables that belong to different types,
    you should convert one of those variables first. In c#, data type conversion can
    e implicit or explicit.


    Each c# expression has a data type. This data type results from the literals,
    variables, values, and structures used inside the expression. Asically, you might
    use an expression whose type is incompatible for the situation. When this happens,
    you’ll get one of these results:


    * the program will give you a compile-time error.

    * the program will perform an automated conversion. That means the program will
    get the right expression.


    Converting “s” type to “t” type allows you to treat “s” while running program.
    So,metimes, this process requires the programmer to validate the type conversion.
    Check the examples:


    * “objects” to “strings” will need validation during the program’s runtime. This
    validation ensures that you really want to use the values as strings.

    * “string” values to “object” doesn’t need any validation because the “string”
    type is a ranch the “object” type. You can convert strings to their parent class
    without losing data or getting any error.

    * you won’t have to perform validation while converting int values to long values.
    The `long` data type covers all of the possible values of the `int` type. That
    means the data can be transformed without any error.

