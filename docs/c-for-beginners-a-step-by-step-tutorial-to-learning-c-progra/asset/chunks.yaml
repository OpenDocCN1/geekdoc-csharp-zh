    # C# 中不同关键字的解析


    关键字是特殊的预定义保留字，每个关键字都分配了唯一的含义。这些关键字可以被分类，以便更好地理解。以下是按类型分类的关键字列表。


    ### 1) 用于类、方法、字段和属性的关键字

    * `abstract`

    * `extern`

    * `internal`

    * `new`

    * `const`

    * `override`

    * `protected`

    * `private`

    * `public`

    * `sealed`

    * `readonly`

    * `static`

    * `virtual`

    * `void`


    ### 2) 用于类型转换的关键字

    * `explicit`

    * `implicit`

    * `as`

    * `is`

    * `operator`

    * `sizeof`

    * `typeof`


    ### 3) 有助于程序流的关键字

    * `if`

    * `else`

    * `for`

    * `foreach`

