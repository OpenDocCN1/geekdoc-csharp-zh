  trans: "\n生命周期从 `system.threading.thread` 类对象的创建开始。一旦任务完成，生命周期就会结束。线程的生命周期中有多种状态。\n\
    \n*   **未启动状态 (unstarted state)**：当创建 `thread` 类的实例时，线程进入未启动状态。\n*   **就绪状态 (ready\
    \ state)**：在程序调用 `start()` 方法之前，线程一直处于此状态。\n*   **不可运行状态 (not runnable state)**：导致线程处于不可运行状态的元素包括：\n\
    \    1. **等待 (Waiting)**：调用 `wait()` 方法使线程等待指定的条件。\n    2. **锁定 (Locked)**：线程被\
    \ I/O 操作锁定。\n    3. **睡眠 (Sleeping)**：调用 `sleep()` 方法将线程置于睡眠模式。\n*   **死亡状态 (dead\
    \ state)**：一旦线程完成执行或被中止，就会进入死亡状态。\n\n# 主线程 (Main thread)\n\n在处理线程工作时，我们使用了 `system.threading.thread`\
    \ 类。主线程在程序开始执行时就会创建。`thread` 类用于创建线程，它们被称为子线程。用户可以通过 `thread` 类的 `currentthread`\
    \ 属性访问主线程。\n\n示例：\n\n```csharp\nUsing system;\n\nNamespace thread\n{\n\nClass\
    \ mainthread\n{\n\nStatic void main(string[] args)\n{\n\nThread t1  =new thread();\n\
    \nT1.name=\"thread1\";\n\nConsole.writeline(\"thread  is:{0}\",t1.name);\n\nConsole.read();\n\
    \n}\n\n}\n\n}\n```\n\n编译并执行代码后，输出为：\n`Thread is: thread1`\n\n# thread 类的属性和方法\n\
    \n### 属性 (146):\n\n*   **isalive**：显示当前线程执行状态的值。\n*   **currentthread**：获取当前运行线程。\n\
    *   **currentcontext**：获取线程执行的当前上下文。\n*   **executioncontext**：`executioncontext`\
    \ 对象包含不同上下文的信息。\n*   **name**：获取或设置线程名称。\n*   **threadstate**：包含当前线程状态的值。\n* \
    \  **priority**：获取或设置线程调度优先级。\n\n### 方法:\n\n*   `public static void beginthreadaffinity()`：主机根据当前的物理操作系统线程去执行指令。\n\
    *   `public void abort()`：在调用该方法的线程中抛出 `threadexception`。\n*   `public void interrupt()`：中断处于\
    \ waits、sleep 或 join 状态的线程。\n*   `public static appdomain getdomain()`：返回一个唯一的应用程序域标识符。\n\
    *   `public static void memorybarrier()`：处理器执行当前线程。指令不能重排序。\n*   `public void\
    \ start()`：启动线程。\n*   `public static object yield()`：让调用线程让执行给另一个准备好运行处理器的线程。\n\
    \n# 创建和管理线程\n\n扩展的 thread 类创建一个线程。扩展的 thread 类调用 `start()` 方法来启动子线程的执行。\n\n示例：\n\
    \n```csharp\nUsing system;\n\nUsing system.threading;\n\nNamespace multiplethread\n\
    {\n\nClass threadprogram\n{\n\nPublic static void callchild()\n{\n\nConsole.writeline(\"\
    start thread\");\n}\n\nStatic void main(string[] args)\n{\n\nThreadstart child1\
    \ =new threadstart(callchild);\n\nConsole.writeline(\"creating child thread\"\
    );\n\nThread child2 =new thread(child1);\n\nChild2.start();\n\nConsole.read();\n\
    \n}\n\n}\n}\n```\n编译并执行代码后，输出为：\n`Start thread`\n`Creating child thread`\n\n#\
    \ 管理线程\n\n当需要暂停线程一段时间以便另一个线程执行时，将使用 `sleep()` 方法。该方法接受一个毫秒为单位的参数。\n\n示例：\n\n```csharp\n\
    Using system;\n\nUsing system.threading;\n\nNamespace threaddemo\n{\n\nClass threadprogram\n\
    {\n\nPublic static void childthread()\n{\n\nTry\n{\n\nConsole.writeline(\"child\
    \ thread started\");\n\nFor(int j = 0; j <= 10; j++)\n\n{\n\nThread.sleep(1000);\n\
    \nConsole.writeline(\"child thread finished\");\n\n}\n\n}\nCatch(threadexception\
    \ e)\n{\n\nConsole.writeline(\"exception caught\");\n}\n\nFinally\n{\n\nConsole.writeline(\"\
    exception is not handled\");\n}\n}\n\nPublic static void main()\n{\n\nThreadstart\
    \ t1 =new threadstart(childthread);\n\nConsole.writeline(\"creating child thread\"\
    );\n\nThread t2 = new thread(t1);\n\nT1.start();\n\n//main thread is stopped\n\
    Thread.sleep(2000);\n\n//child thread aborted\nConsole.writeline(\"aborting child\
    \ thread\");\n\nT2.abort();\n\nConsole.read();\n\n}\n\n}\n```\n因此，输出为：\n`Creating\
