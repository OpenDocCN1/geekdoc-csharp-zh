    \ oj1, object oj2) {\n            object o = new object();\n            o.length\
    \ = oj1.length + oj2.length;\n            o.width = oj1.width + oj2.width;\n \
    \           o.height = oj1.height + oj2.height;\n            return o;\n     \
    \   }\n    }\n\n    class oxtester {\n        static void main(string[] args)\
