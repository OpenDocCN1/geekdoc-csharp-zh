    }\n\n// the derived class\nClass o : object,paintcost {\n    Public int calculatearea()\
    \ {\n        Return (width * height);\n    }\n\n    Public int calculatecost(int\
    \ area) {\n        Return area * 120;\n    }\n}\n\nClass inheritancetester {\n\
    \    Static void main(string[] args) {\n        O = new o();\n        Int area;\n\
    \        .setwidth(5);\n        .setheight(7);\n        Area = .calculatearea();\n\
    \        // show the area of the object\n        Console.writeline(\"the area\
    \ of the object is: {0}\", .calculatearea());\n        Console.writeline(\"the\
    \ total printing cost is: ${0}\", .calculatecost(area));\n        Console.readkey();\n\
    \    }\n}\n\n}\n```\n\nThe code gives the following output:\n\n![00084.jpg](images/00084.jpeg)\n\
    \n## Chapter 15: polymorphism\n\nPolymorphism is a term that means many forms.\
