    \n首先，我鼓励你检查代码是否存在空格或大小写方面的简单错误。有时如果你习惯了用其他语言编写代码，可能会无意中在 C# 中该用分号的地方写了句号，甚至在不该用括号的地方使用了括号。这些是我最令人沮丧的错误类型，通常也是我犯过的错误。基本上，当你遇到一个似乎不断报错的沮丧点时，务必检查你的工作。\n\
