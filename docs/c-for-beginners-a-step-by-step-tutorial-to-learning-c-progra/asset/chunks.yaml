    # Chapter 8: loops\n\nAs a programmer, you’ll use a loop statement to run certain\
    \ code blocks repeatedly. Loops play an important part in C# programming. Hence,\
    \ you should study this material carefully as well if you want to master this\
    \ language in a short while.\n\n## Loops – the basics\n\nWhile creating programs,\
    \ you often need to execute code sequences multiple times. Typing the same blocks\
    \ of code several times can be extremely tiring. Thus, you need to find a quick\
    \ and simple way to repeat codes. Fortunately, the C# language supports loop statements.\n\
    \nA loop is a tool that runs code fragments repeatedly. You can use it to run\
    \ codes for a certain number of times or as long as a given condition is fulfilled.\
    \ C# offers different types of loop statements. Let’s analyze each type in detail:\n\
    \n### The while loop \n\nThis is the simplest loop statement in C#. Its syntax\
    \ is:\n\n```csharp\nWhile (the_assigned_condition)\n{\n    The_loop’s body;\n\
    }\n```\n\nIn this syntax, `the_assigned_condition` is an expression that produces\
    \ a boolean value. This condition dictates how many times the `body` will run.\
    \ The `body`, on the other hand, is the statement (or group of statements) that\
    \ you want to execute.\n\nThe diagram below will illustrate how while loops work:\n\
    \n![00178.jpg](images/00178.jpeg)\n\nWhen working on a “while” loop, a C# program\
    \ checks the value of the boolean expression. If the value is “true”, the program\
    \ will run all of the statements within the loop’s body. Then, the program will\
    \ check the boolean expression to see its value. If the value is still true, the\
    \ program will rerun the loop’s body and go back to the first step (i.e. Check\
    \ the expression’s value). This process will go on until the expression evaluates\
    \ to false. Once this happens, the program will process the code right after the\
    \ loop.\n\nImportant note: your C# program won’t run the while loop’s body if\
    \ the condition is false. Thus, if the value is false when you launched the program,\
    \ your statements will never executed. The following example will illustrate how\
    \ while loops work:\n\n```csharp\nInt timer = 10;\nWhile (timer >= 0)\n{\n   \
    \ System.WriteLine(\"time remaining: \" + timer);\n    Timer--;\n}\n```\n\nIf\
    \ you will compile and execute this code, your prompt will print this:\n\n![00163.jpg](images/0163.jpeg)\n\
    \n#### break operator\n\nYou can use `break` (a C# operator) to exit a loop prematurely.\
    \ Programmers use this operator if they don’t want to wait for the loop’s natural\
    \ termination. As, a loop will end once it encounters a `break`. This situation\
    \ forces the program to jump to the code after the loop. In C#, you can only use\
    \ this operator inside the loop’s body. That means `break` will only work while\
    \ the loop is running.\n\n### The do-while loop\n\nA `do-while` loop is almost\
    \ identical to a `while` loop. The only difference between these loops is that\
    \ the former analyzes the boolean value after running the loop’s body. Thus, you\
    \ can rest assured that your codes will run at least once even if the boolean\
    \ expression is false. Here is the syntax of the do-while loop:\n\n```csharp\n\
    Do\n{\n    Statements;\n} while (boolean expression)\n```\n\nDo-while loops work\
    \ according to this pattern:\n\n![00014.jpg](images/0014.jpeg)\n\nThe program\
    \ will execute all of the statements within the loop’s body. Then, it will check\
    \ the condition (i.e. The boolean expression). If the condition evaluates to true,\
    \ the program will execute the loop’s body again and perform the “value inspection”.\
    \ This process will go on until the condition becomes false. Thus, your codes\
    \ might run forever if your assigned condition always evaluates to true.\n\n###\
    \ The for loop\n\nIn general, `for` loops are more complex than do-while and `while`\
    \ loops. Hoever, `for` loops can help you perform difficult tasks using fewer\
    \ C# codes. The syntax of a `for` loop is:\n\n```csharp\nFor (initializer; boolean_expression;\
    \ update)\n{\n    The_loop’s body;\n}\n```\n\nA `for` loop has an `initializer`\
    \ (i.e. the value of the), a `boolean_expression`, and a statement that updates\
    \ the counter. The `counter` (i.e. initial value) serves as a `for` loop’s most\
    \ distinctive feature. In most cases, the counter increases until it reaches the\
    \ final value (e.g. 10). Also, programmers usually know how many times the `for`\
    \ loop will iterate. You may include ascending and descending variables in a single\
    \ `for`. In, you may include ascending and descending variables.\n\nImportant\
