    在使用变量之前，你需要对其进行命名。变量名充当标识符：它帮助程序定位和指定变量。C# 允许你自由地选择变量名。然而，与任何其他语言一样，C# 对变量名也有一些规则。这些规则如下：


    - 你可以使用下划线（即 `_`）、字母和数字来创建变量名。

    - 你不能用数字开头命名。因此，`firstsample` 是有效的，而 `1stsample` 是无效的。局部变量通常使用驼峰命名法（Camelcase），例如
    `cost`、`orderdetail`、`dateofirth` 和 `firstname`。

    - 在命名变量时不能使用 C# 关键字。这条简单的规则可以防止程序出现编译错误和运行时错误。如果你确实想为变量使用关键字，可以使用 `@` 符号开头名称（例如
    `@oal`、`@int`、`@char` 等）。

    - 变量名应当具有意义或或描述性，既不能太长也不能太短，以便通过观察就能识别变量中存储的信息。

    - 可以包含字母 `a–z` 和 `A–Z`、数字 `0–9` 以及下划线 `_` 字符——不允许其他符号。

    - 不允许空格且不能以数字开头。


    ### 有效名称

    - `cost`, `name`, `order`, `order1`, `_order1`, `income`

    - `order_detail`, `orderdetail`, `dateofirth`, `hourlyrate`, `firstname`, `first_name`,
    `isvalid`


    ### 无效名称

    - `1`（数字）

    - `class`, `while`, `if`, `protected`（关键字）

    - `1order`, `1name`（以数字开头）


    ### 如何声明变量

    你应该在使用变量之前对其进行声明。在声明变量时：


    1. 指定变量的数据类型（例如 `Char`）

    2. 指定变量的名称（例如 `Sample`）

    3. 设置变量的初始值。这一步完全可选的。


    变量声明的格式为：

    `Data_type name = initial_value;`


    以下是一些有效的变量声明示例：


    ```

    Int year = 2000;

    String name = username;

    Char c = test;

    ```


    重要提示：你需要使用分号结束每个 C# 语句。如果你忘记添加哪怕一个分号字符，你的程序都会产生不良或意料之外的结果。


    ### 如何赋值

    与任何其他计算机语言一样，C# 允许你为变量赋值。这个过程被称为“值赋值”，它要求你使用等号。程序员将此符号称为“赋值运算符”。将变量名写在运算符的左侧，然后在另一侧指定你想要赋值的值。请检查以下示例：


    ```

    Test = x;

    username = "john";

    ```


    ### 如何初始化变量

    在编程中，“初始化”是指为新变量赋值的过程。因此，你在声明变量时会设置这个“初始值”。


    #### 变量的默认值

    如果你没有为变量分配任何值，C# 将执行自动初始化（即它将为空变量分配一个默认值）。下面的表格将显示每个数据类型的默认值：


    ![0048.jpg](img/0048.jpg)


    给出的代码将向你展示如何声明变量并赋值。


    ```

    years = 10;

    days = 31;

    pi = 3.14;

    isempty = true;

    sample = x;

    animal = "dog";

    ```


    重要提示：以双正斜杠（即 `//`）开头的行是“注释”。在编程中，注释是添加到代码中以提高可读性的描述性文本。语言编译器忽略这些行。因此，注释不会影响程序的功能。


    #### 创建标识符

    如果你查看微软提供的一些建议，你会发现他们建议在处理变量时使用驼峰命名法（camelCase），并建议在处理方法时使用帕斯卡命名法（PascalCase）。使用驼峰命名法意味着你保持名称的第一个字母为小写。如果你创建一个包含复合词的标识符，你需要确保第二个单词的第一个字母大写：：`paymentComplete`。


    #### 数学

    帕斯卡命名法（PascalCase）风格略有不同。这种符号风格要求你使用大写字母开头第一个单词。序列中所有其他单词的首字母也应该大写。使用帕斯卡命名法的示例包括：


    ```

    WriteLine()

    readline()

    Start()

    main()

    ```


    在命名这些标识符时，你也可以使用数字和下划线。但如果由于某些原因你不能以数字开头这些标识符，你可以写像 `sevenooks` 这样的单词，但不能写成 `7ooks`。现在，这些符号并不是强制要求的，你可以根据心意随意更改。但这是一种规范。


    ### 确定赋值

    C# 强制执行确定性赋值。这意味着你在使用变量之前需要为它初始化值。假设有如下内容：


    ```

    Console.WriteLine(name);

    ```

    错误：使用了未赋值的变量 ‘name’


    如果你尝试使用未声明的变量，你的代码将无法编译。在这种情况下，编译器会告诉你出错了什么。尝试使用未赋值的变量也会导致错误。


    为了给变量初始化值，你只需使用赋值运算符 `=`。变量名位于运算符的左侧，右侧则是如下所示的值：


    ```

    Test = x;

    username = "john";

    ```


    在声明类型变量后，不能用新类型重新声明它，也不能赋值与其声明类型不兼容的值。例如，你不能声明一个 int 然后给它赋值布尔值 true/false。


    ```

    Age = true;

    ```

    错误：无法将类型 ‘bool’ 隐式转换为 ‘int’

