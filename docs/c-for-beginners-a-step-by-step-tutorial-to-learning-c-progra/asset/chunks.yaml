    \ catch\");\n            }\n        }\n        Catch\n        {\n            Console.WriteLine(\"\
    the outer catch\");\n        }\n    }\n}\n\npublic class employee{\n    public\
    \ string employeeename { get; set; }\n}\n```\n\n在上述的示例中，语句 `emp.employeeename`\
    \ 将生成一个 nullreferenceexception，但我们没有处理 nullreferenceexception 或异常类型的 catch 块。外层块将处理此异常。代码返回以下内容：\n\
    \n![00151.jpg](img/00151.jpeg)\n\n# 第 18 章：文件 I/O\n\n文件的特征是名称和目录路径。一旦你打开一个文件，它就变成了一个流。文件通常是为了读取或写入目的而打开的。\n\
    \n流仅仅是经过通信路径的字节序列。流有两种类型：\n\n* 输入流\n* 输出流\n\n输入流帮助我们从文件中读取数据，即读取操作；而输出流帮助我们向文件中写入数据，即写入操作。\n\
    \n## 输入/输出类\n\nC# 为我们提供了许多用于处理文件的类。这些类可以用于访问目录、文件，创建新文件，打开现有文件以及将文件从一个目录移动到另一个目录。这些类定义在\
    \ `system.io` 空间中。让我们讨论其中一些类：\n\n* binaryreader - 此类帮助我们从二进制流中读取原始数据。\n* binarywriter\
    \ - 此类帮助我们以二进制格式写入原始数据。\n* bufferedstream - 此类充当流字节的临时存储器。\n* directory - 此类帮助我们操纵目录的结构。\n\
    * driveinfo - 此类为我们提供有关驱动器的信息。\n* file - 此类用于操作文件。\n* fileinfo - 帮助对文件执行操作。\n\
    * filestream - 用于在文件的任何位置进行写入和读取。\n* memorystream - 帮助访问存储在内存中的数据。\n* path - 用于对路径执行操作。\n\
    * streamreader - 从流中读取字符。\n* streamwriter - 向流中写入字符。\n* stringreader - 从字符串读取。\n\
    * stringwriter - 写入字符串。\n\n### Filestream 类\n\n此类定义在 `system.io` 命名空间中，它帮助我们读取和写入文件。我们也可以用它来关闭文件。为了能够使用此类，你必须创建它的对象。该实例可以用于创建新文件和打开现有文件。以下是创建\
    \ filestream 类实例的方法：\n\n```csharp\nFilestream object = new filestream(file, FileMode,\
    \ FileAccess, FileShare);\n```\n\n例如，假设我们需要读取文件 `names.txt`。我们可以创建一个名为 `fs` 的\
    \ filestream 对象并将其用于此目的。演示如下：\n\n```csharp\nFilestream fs = new filestream(\"\
    names.txt\", FileMode.Open, FileAccess.Read, FileShare.Read);\n```\n\n`FileMode`\
    \ 是一个枚举，定义了可以用于打开文件的许多方法。这些方法包括：\n\n* append - 此方法打开现有文件，然后将光标置于文件末尾，或者如果指定的文件不存在，则创建一个新文件。\n\
    * create - 用于创建新文件。\n* createnew - 指令操作系统创建一个新文件。\n* open - 用于打开现有文件。\n* opencreate\
    \ - 指令操作系统如果文件存在则打开文件，如果不存在则创建一个新文件。（注：文本已清理）\n\n`FileAccess` 是一个枚举，带有许多方法，包括\
    \ `read`、`write` 和 `readwrite`。\n\n`FileShare` 枚举带有以下成员：\n\n* inheritable - 帮助文件句柄在传递继承给子进程时。\n\
    * none - 它禁用当前文件的共享。\n* read - 它打开文件进行读取。\n* readwrite - 打开文件进行读取和写入。\n* write\
    \ - 打开文件进行写入。\n\n`filestream` 类可以像下面所示使用：\n\n```csharp\nusing system.io;\nusing\
    \ system;\n\nnamespace fileapp {\n    Class myprogram {\n        Static void main(string[]\
    \ args) {\n            Filestream fs = new filestream(\"names.dat\", FileMode.Opencreate,\
    \ FileAccess.Write, FileShare.Read);\n            for (int x = 1; x <= 10; x++)\
    \ {\n                fs.write((byte)x);\n            }\n            fs.position\
    \ = 0;\n            for (int x = 0; x <= 10; x++) {\n                Console.write(fs.read());\n\
    \            }\n            fs.close();\n        }\n    }\n}\n```\n\n## 追加文本行\n\
    \n有时，你可能需要向文件追加多行文本。这可以通过调用 `appendalllines()` 方法来实现。这是一个示例：\n\n```csharp\nString\
    \ multiplelines = \"the first line.\" + environment.newline +\n\"the second line.\"\
    \ + environment.newline +\n\"the third line.\";\n// 打开名为 names.txt 的文件并追加上述行。如果文件不存在，将创建一个新的。\n\
    File.appendalllines(\"c:\\myfile.txt\", multiplelines.split(environment.newline.tochararray()).list<string>());\n\
    ```\n\n文件将被打开，并将指定的行追加到文件中。\n\n## 追加字符串\n\n`Fileappendalltext()` 方法允许你仅用一行代码即可向文件中追加字符串。演示如下：\n\
    \n```csharp\n// 打开名为 myfile.txt 的文件并对其追加文本。如果文件不存在，则创建一个新的并打开写入打开。\nFile.appendalltext(\"\
    c:\\myfile.txt\", \"this string will be written into, the file\");\n```\n\n##\
    \ 覆盖文本\n\n"
- fmt: "\nIf you need to overwrite a file, use the `File.WriteAllText()` method. The\
    \ method will delete the text in the file and replace it with the one that you\
    \ specify. This method can be used as demonstrated below:\n\n```cs\n// to open\
    \ the file myfile.txt and write the text into it. If the file does not exist,\
    \ a new one will be created and opened for writing.\n\nFile.WriteAllText(\"c:\\\
    myfile.txt\", \"this text will e used for replacing the current text in the file.\"\
    );\n```\n\nWith the static `File` class, one can perform various operations. This\
    \ is demonstrated below:\n\n```cs\n//check whether the file exists at the specified\
    \ location or not\nbool exists = File.Exists(\"c:\\myfile.txt\"); // it will return\
    \ false\n\n//copy myfile.txt as the new file newfile.txt\nFile.Copy(\"c:\\myfile.txt\"\
    , \"d:\\newfile.txt\");\n\n// check when the file was lastly accessed\nDateTime\
    \ lastAccessTime = File.GetLastAccessTime(\"c:\\myfile.txt\");\n\n//get the last\
    \ time the file was written\nDateTime lastWriteTime = File.GetLastWriteTime(\"\
    c:\\myfile.txt\");\n\n// transfer the file to a new location\nFile.Move(\"c:\\\
    myfile.txt\", \"d:\\myfile.txt\");\n\n//open file and returns filestream for reading\
    \ types from the file\nFileStream fs = File.Open(\"d:\\myfile.txt\", FileMode.OpenCreate);\n\
    \n//open the file and return a reader for reading a string from the file\nStreamReader\
    \ sr = File.OpenText(\"d:\\myfile.txt\");\n\n//delete the file\nFile.Delete(\"\
    c:\\myfile.txt\");\n```\n\nThe above shows that with the static `File` class,\
    \ it becomes easy for us to work with physical files. However, for more flexibility,\
    \ one can use the `FileInfo` class.\n\n### StreamReader class\n\nThis class helps\
    \ us to read data from a text file. This class inherits the `Stream` class. It\
    \ also inherits the `TextReader` class, an abstract class for reading a series\
    \ of characters. The following are the popular methods provided by this class:\n\
    \n* `public override void Close()` - the method closes the `StreamReader` object\
    \ and the stream, then any system resources that were being used by the reader\
    \ are released.\n* `public override int Peek()` - this method will return the\
    \ next character that is available without consuming it.\n* `public override int\
    \ Read()` - this method will read the next character in an input stream then advance\
    \ the position of the character by 1.\n\nLet us demonstrate how we can use this\
    \ class to read from a file named `names.txt`:\n\n```cs\nusing System.IO;\nusing\
    \ System;\n\nnamespace io.application {\n    class program {\n        static void\
    \ main(string[] args) {\n            try {\n                // create a reader\
    \ instance for reading from a file.\n                // the using statement will\
    \ close the reader.\n                using (StreamReader sr = new StreamReader(\"\
    c:/names.txt\")) {\n                    String line;\n                    // read\
    \ the show lines from the file until you reach the end of the file.\n        \
    \            while ((line = sr.ReadLine()) != null) {\n                      \
    \  Console.WriteLine(line);\n                    }\n                }\n      \
    \      } catch (Exception exception) {\n                // inform the user what\
    \ went\n                Console.WriteLine(\"file couldn't read:\");\n        \
    \        Console.WriteLine(exception.message);\n            }\n            Console.ReadKey();\n\
    \        }\n    }\n}\n```\nThe code will read the text written in `names.txt`\
    \ and print it.\n\n### StreamWriter class\n\nThis class inherits the `TextWriter`\
    \ abstract class that represents a capability of writing a series of characters.\
    \ Here are the popular methods for this class:\n\n* `public override void Close()`\
    \ - this method will close the current object of the `writer` as well as the underlying\
    \ stream.\n* `public override void Flush()` - this method will clear buffers for\
    \ current writer and makes any buffered data written to the stream.\n* `public\
    \ virtual void Write(long value)` - this method writes a representation of long\
    \ value into the text stream.\n* `public override void Write(char value)` - for\
    \ writing a character to a stream.\n* `public virtual void Write(decimal value)`\
    \ - this method writes a representation of decimal value to a text stream.\n*\
    \ `public virtual void Write(double value)` - writes a representation of 8-byte\
    \ floating point value into a text stream.\n* `public virtual void Write(int value)`\
    \ - writes a representation of 4-byte signed integer into a text stream.\n* `public\
    \ override void Write(string value)` - for writing a string to a stream.\n* `public\
    \ virtual void WriteLine()` - for writing a line terminator to a text stream.\n\
    \nLet us demonstrate how we can use the `StreamWriter` class to write text data:\n\
    \n```cs\nusing System.IO;\nusing System;\n\nnamespace io.app {\n    class program\
    \ {\n        static void main(string[] args) {\n            String[] students\
    \ = new string[]{\"nicholas samuel\", \"michelle oss\"};\n            using (StreamWriter\
    \ sw = new StreamWriter(\"students.txt\")) {\n                foreach (string\
    \ x in students) {\n                    sw.WriteLine(x);\n                }\n\
    \            }\n            // read and display every line from the file.\n  \
    \          String text = \"\";\n            using (StreamReader sr = new StreamReader(\"\
    students.txt\")) {\n                while ((text = sr.ReadLine()) != null) {\n\
    \                    Console.WriteLine(text);\n                }\n           \
    \ }\n            Console.ReadKey();\n        }\n    }\n}\n```\nThe code will print\
    \ the following result after execution:\n\n![00108.jpg](images/00108.jpeg)\n\n\
    ### BinaryReader class\n\nThis class can be used for reading binary data from\
    \ a file. We should first create a `BinaryReader` object passing an object of\
    \ `FileStream` to its constructor. This class comes with a number of methods including\
    \ the following:\n\n* `public override void Close()` - for closing the `BinaryReader`\
    \ object as well as the underlying stream.\n* `public virtual int Read()` - for\
    \ reading characters from the underlying stream and advancing the stream position.\n\
    * `public virtual bool ReadBoolean()` - reading the next boolean value.\n* `public\
    \ virtual byte[] ReadBinaryArray()` - reading bytes into an array.\n\n### BinaryWriter\
    \ class\n\nThis class helps in writing binary data into a stream. To create a\
    \ `BinaryWriter` object, we pass a `FileStream` to its constructor. This class\
    \ comes with a number of methods including the following:\n\n* `public override\
    \ void Close()` - for closing the `BinaryWriter` object as well as the underlying\
    \ stream.\n* `public override void Flush()` - this method will clear buffers for\
    \ current writer and makes any buffered data written to the device.\n* `public\
    \ virtual void Write(bool value)` - for writing a one-byte boolean value into\
    \ the current stream. 1 represents true while 0 represents false.\n* `public virtual\
    \ void Write(byte value)` - for writing a byte value into the current stream.\n\
    * `public virtual void Write(short value)` - for writing a 2-byte integer value\
    \ into the current stream.\n* `public virtual void Write(int value)` - for writing\
    \ a 4-byte integer value into the current stream.\n* `public virtual void Write(long\
    \ value)` - for writing an 8-byte long value into the current stream.\n* `public\
    \ virtual void Write(float value)` - for writing a 4-byte floating point value\
    \ into the current stream.\n* `public virtual void Write(double value)` - for\
    \ writing an 8-byte floating point value into the current stream.\n* `public virtual\
    \ void Write(char value)` - for writing a character to the current stream.\n*\
    \ `public virtual void Write(string value)` - for writing a string to the current\
    \ stream.\n"
