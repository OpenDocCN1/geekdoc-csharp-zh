    \n事件在类中声明，并通过通过类类或另一个类中的委托与事件处理程序关联。带有事件的类用于发布事件，这被称为发布者类 (publisher class)。接受事件的类被称为订阅者类\
    \ (subscriber class)。这意味着事件依赖于发布者-订阅者模型。\n\n发布者是定义事件和委托的对象。事件与委托之间的关联在该对象中定义。发布者类的实例调用事件，反过来通知其他对象。\n\
