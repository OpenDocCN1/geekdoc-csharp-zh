  trans: "\n\n如果你需要覆盖文件，请使用 `File.WriteAllText()` 方法。该方法将删除文件中的文本并将其替换为你指定的文本。该方法的使用方法如下所示：\n\
    \n```cs\n// 以打开文件 myfile.txt 并将文本写入其中。如果文件不存在，将创建一个新文件并打开进行写入。\n\nFile.WriteAllText(\"\
    c:\\myfile.txt\", \"this text will e used for replacing the current text in the\
    \ file.\");\n```\n\n通过静态类 `File`，可以执行各种操作。下文所示：\n\n```cs\n// 检查指定位置是否存在文件\nbool\
    \ exists = File.Exists(\"c:\\myfile.txt\"); // 它将返回 false\n\n// 将 myfile.txt 复制为新文件\
    \ newfile.txt\nFile.Copy(\"c:\\myfile.txt\", \"d:\\newfile.txt\");\n\n// 检查文件最后一次访问的时间\n\
    DateTime lastAccessTime = File.GetLastAccessTime(\"c:\\myfile.txt\");\n\n// 获取文件最后一次写入的时间\n\
    DateTime lastWriteTime = File.GetLastWriteTime(\"c:\\myfile.txt\");\n\n// 将文件移动到新位置\n\
    File.Move(\"c:\\myfile.txt\", \"d:\\myfile.txt\");\n\n// 打开文件并返回用于从文件中读取类型的 filestream\n\
    FileStream fs = File.Open(\"d:\\myfile.txt\", FileMode.OpenCreate);\n\n// 打开文件并返回一个用于从文件中读取字符串的读者\n\
    StreamReader sr = File.OpenText(\"d:\\myfile.txt\");\n\n// 删除文件\nFile.Delete(\"\
    c:\\myfile.txt\");\n```\n\n上述内容表明，通过静态 `File` 类，我们可以轻松地处理物理文件。然而，为了获得更大的灵活性，可以使用\
    \ `FileInfo` 类。\n\n### StreamReader 类\n\n此类类帮助我们从文本文件中读取数据。该类继承自 `Stream` 类。它还继承了\
    \ `TextReader` 类，该类是一个用于读取一系列字符的抽象类。以下是该类提供的常用方法：\n\n* `public override void Close()`\
    \ - 该方法关闭 `StreamReader` 对象和流，然后释放读取器使用的任何系统资源。\n* `public override int Peek()`\
    \ - 此方法将返回下一个可用的字符而不消耗它。\n* `public override int Read()` - 此方法将读取输入流中的下一个字符，然后将字符位置移动\
    \ 1。\n\n让我们演示如何使用此类类从名为 `names.txt` 的文件中读取：\n\n```cs\nusing System.IO;\nusing\
    \ System;\n\nnamespace io.application {\n    class program {\n        static void\
    \ main(string[] args) {\n            try {\n                // 创建一个读取文件的读取器实例。\n\
    \                // using 语句将关闭读取器。\n                using (StreamReader sr =\
    \ new StreamReader(\"c:/names.txt\")) {\n                    String line;\n  \
    \                  // 从文件中读取行直到文件末尾。\n                    while ((line = sr.ReadLine())\
    \ != null) {\n                        Console.WriteLine(line);\n             \
    \       }\n                }\n            } catch (Exception exception) {\n  \
    \              // 告知用户发生了什么\n                Console.WriteLine(\"file couldn't\
    \ read:\");\n                Console.WriteLine(exception.message);\n         \
    \   }\n            Console.ReadKey();\n        }\n    }\n}\n```\n该代码将读取 `names.txt`\
    \ 中编写的文本并将其打印出来。\n\n### StreamWriter 类\n\n此类继承自 `TextWriter` 抽象类，该类表示写入一系列字符的能力。以下是该类的常用方法：\n\
    \n* `public override void Close()` - 此方法将关闭当前的 `writer` 对象以及底层流。\n* `public override\
    \ void Flush()` - 此方法将清除当前写入器的缓冲区，并将任何缓冲数据写入流中。\n* `public virtual void Write(long\
    \ value)` - 此方法将 long 值的表示形式写入文本流。\n* `public override void Write(char value)`\
    \ - 向流写入一个字符。\n* `public virtual void Write(decimal value)` - 此方法将 decimal 值的表示形式写入文本流。\n\
    * `public virtual void Write(double value)` - 将 8 字节浮点数值的表示形式写入文本流。\n* `public\
    \ virtual void Write(int value)` - 将 4 字节有符号整数的表示形式写入文本流。\n* `public override\
    \ void Write(string value)` - 向流写入一个字符串。\n* `public virtual void WriteLine()`\
    \ - 向文本流写入一个行终止符。\n\n让我们演示如何使用 `StreamWriter` 类写入文本数据：\n\n```cs\nusing System.IO;\n\
    using System;\n\nnamespace io.app {\n    class program {\n        static void\
    \ main(string[] args) {\n            String[] students = new string[]{\"nicholas\
    \ samuel\", \"michelle oss\"};\n            using (StreamWriter sw = new StreamWriter(\"\
    students.txt\")) {\n                foreach (string x in students) {\n       \
    \             sw.WriteLine(x);\n                }\n            }\n           \
    \ // 读取并显示文件中的每一行。\n            String text = \"\";\n            using (StreamReader\
    \ sr = new StreamReader(\"students.txt\")) {\n                while ((text = sr.ReadLine())\
    \ != null) {\n                    Console.WriteLine(text);\n                }\n\
    \            }\n            Console.ReadKey();\n        }\n    }\n}\n```\n该代码执行后将打印以下结果：\n\
