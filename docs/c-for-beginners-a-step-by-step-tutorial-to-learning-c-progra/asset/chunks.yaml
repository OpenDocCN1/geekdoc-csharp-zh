    \ end up getting these operators mixed up with your assignment operator, you will\
    \ probably get an error message, and that program will not work out the way that\
    \ you want.\n\n### Conditional operator\n\nC# users refer to `?` as the conditional\
    \ operator. Basically, this operator uses the result of a boolean expression to\
    \ determine which statement should be processed. This is called “ternary operator”\
    \ because it works on three operands. Here, the first value should be boolean,\
    \ while the remaining values need to belong to the same data type (e.g. Characters,\
    \ strings, numbers, etc.).\n\nThe syntax of this operator is:\n\n`First_operand\
    \ ? Second_operand : third_operand;`\n\nHere’s how it works: if `first_operand`\
    \ is true, the program will work on `second_operand`. If `first_operand` is false,\
    \ however, the program will work on `third_operand`.\n\n## Chapter 7: the conditional\
    \ statements\n\nC# has conditional statements, mostly used for controlling the\
