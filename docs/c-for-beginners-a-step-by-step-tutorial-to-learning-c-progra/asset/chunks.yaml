    你可以像下面所示，在同一行同时结合声明和初始化语句，这样更方便。


    ```java

    String name = "pirzada"; int age = 35; int weight = 70; bool ismarried = true;

    ```


    你也可以使用数学表达式。


    ```java

    Int wowexp = (3 + 2) * 4; Console.WriteLine(wowexp);

    ```


    输出：

    20


    右侧会被求值然后赋值给左侧的变量。这意味着 `3+2` 是 `5`，`5 * 4` 是 `20`，这会被赋值给变量 `wowexp`。




    你也可以同时给多个不同的变量分配相同的值。


    ```java

    Int a, c; a = c = 786; Console.WriteLine(a); Console.WriteLine(); Console.WriteLine(c);

    ```


    输出：

    786

    786

    786


    ### 使用类型推断


    C# 3.0 通过 `var` 关键字引入了隐式类型变量。现在，你可以在不给出显式或真实类型的情况下声明局部变量。该变量在编译时仍然会接收到一个类型，但该类型是由编译器提供的。


    实际上，`var` 关键字指示编译器从初始化语句右侧的表达式推断变量的类型。编译器的任务是确定并分配合适的类型。


    ```java

    Var varialename = variablevalue; // 语法

    ```


    `Var` 是可选的，它只是为了方便。


    让我们使用上面相同的变量。


    ```java

    Var name = "pirzada"; var age = 35; var weight = 70; var ismarried = true;

    ```


    现在这些变量是隐式类型局部变量，意味着你不需要显式指定类型。编译器负责确定并分配合适的类型。字符串变量由双引号表示，字符变量由单引号表示，而 `bool`
    类型则由 `true` 和 `false` 值表示。


    建议：使用 `var` 很方便，但仅当类型从赋值的右侧显而易见时才使用它。


    `Double` 用于表示带有小数点的字面量数字，除非你添加 `m/m` 后缀来表示小数变量，或添加 `f/f` 后缀来表示浮点型变量。


    ```java

    Var value = 24899.45m; var numer = 20.8f;

    ```


    为了初始化 `numer`，你需要在 `20.8` 之后添加 `f` 后缀，显式告诉编译器将 `20.8` 转换为 `float`。同样，为了初始化 `value`，你需要添加
    `m` 后缀将 `24899.45` 转换为 `decimal` 类型。


    你需要遵循以下规则：


    * `var` 只能在单条语句中声明和初始化。否则，编译器将无从何处推断类型。

    * `var` 不应用于类作用范围内的字段。

    * 初始化器不能为 `null` 且必须是一个表达式。

    * 多个隐式类型变量不能在同一语句中。

    * 除非在初始化器中创建了新对象，否则不能使用对象。


    #### 默认值表达式


    当你不知道给定类型的默认值将会何时，默认值表达式在与泛型结合使用时特别有用。


    `default(t)` 返回类型的默认值，其中 `t` 是引用类型或值类型。


    ```java

    T varialename = default(t); // 语法

    示例：

    Var name = default(string); var age = default(int); var weight = default(int);

    ```


    #### 默认字面量：


    默认字面量是 C# 7.1 中的新功能，用于在语句执行时获取指定类型的默认值。此功能适用于值类型，也适用于引用类型。注意：默认字面量等于 `default(t)`，其中
    `t` 是推断出的类型。


    ```java

    String name = default; int age = default; int weight = default; bool ismarried
    = default; Console.WriteLine(name); Console.WriteLine(age); Console.WriteLine(weight);
    Console.WriteLine(ismarried);

    ```


    在输出中，空值将以空行打印。默认字面量和 default(t) 的输出：

    00 false


    #### new 运算符


    使用 `new` 运算符会调用值类型的默认构造函数。这允许你使用 `new` 关键字创建变量，这会自动将变量设置为其默认值。注意：C# 中的所有值都是特定类型的实例。


    ```java

    Var age = new int(); var ismarried = new bool(); Console.WriteLine(age); Console.WriteLine(ismarried);

    ```


    输出：

    0

    False


    ### 第 5 章：什么是类型转换？


    通常，运算符作用于属于相同类型的参数。然而，C# 语言提供了广泛的数据类型，你可以将其用于某些特定情况。要对属于不同类型的变量进行任何处理，你应该先转换其中一个变量。在
    C# 中，数据类型转换可以是隐式的也可以是显式的。


    每个 C# 表达式都有一个数据类型。该数据类型取决于表达式内部使用的字面量、变量、值和结构。基本上，你可能会使用一个类型与情况不兼容的表达式。当发生这种情况时，你将得到以下结果之一：


    * 程序将给你给出一个编译时错误。

    * 程序将执行自动转换。这意味着程序将获得正确的表达式。


    将“s”类型转换为“t”类型允许你在运行程序时处理“s”。因此，有时此过程需要程序员对类型转换进行验证。查看示例：


    * “对象”到“字符串”在程序运行时将需要验证。这种验证确保了你确实想将这些值作为字符串使用。

    * “字符串”值到“对象”不需要任何验证，因为“字符串”类型是“对象”类型的派类。你可以将字符串转换为其父类而不会丢失数据或产生任何错误。

    * 在将 int 值转换为 long 值时，你不需要执行验证。`long` 数据类型涵盖了 `int` 类型的所有可能值。这意味着数据可以在产生任何错误的情况下进行转换。

