    你可能已经有一个喜欢的博主，会在寻找其他语言示例时参考他们——也许可以看看他们订阅的其他用户，看看他们的内容是否对你有所帮助。


    千万不要因为你正处于困境就认为你的整个项目已经结束了。从我的个人经验来告诉你，当此类问题出现时，允许自己充分探索并解决问题，将为你在大脑中创造新路径提供机会，这些路径将在你未来的挑战中大有裨益。回想你在生活或编程经验中解决其他问题的方法，并允许自己思考如何以及为何将这些方法应用于当前处境。


    在了解自己的思维方式和想要实现的目标方面，你就是自己的主宰。尽所能利用你的资源，尽可能地博学——知识和学习的力量是一项非常非凡的技能。


    编程和编码可以被视为一种解决问题的方法，你通过它创建实现特定目的的程序，让自己和他人的生活变得更轻松。始终为你的技能 set 设定一个可以实现的目标，同时不断激励自己学习更多知识，进入能力的下一个水平。


    你可以通过以下参考链接获取有关 c# 语言的更详细信息：


    * [visual studio 应用](https://www.visualstudio.com/downloads/download-visual-studio-vs)
    – 用于创建 c# 程序的 IDE。

    * [c#（编程指南）](https://en.wikipedia.org/wiki/C_Sharp_(programming_language)) – c#
    编程语言概述

    * [c# 编程](https://msdn.microsoft.com/en-us/library/67ef8sbd.aspx) – 关于使用 .net
    framework 的 c# 特性的说明

    * [mono](http://www.mono-project.com/) – 使用该软件可以轻松创建跨平台应用程序。


    ## 结论


    现在这本书已经结束了，你已经拥有了成为一名优秀 c# 程序员和编码员所需的所有信息和技能技能。对我来说，你将这本书作为你技能的基础至关重要。我努力提供了一份我认为既全面又易于理解的指南。没有了像
    c# 这样的语言，我们就无法在个人和商业生活中拥有这些惊叹的技术。


    当你考虑到编程等技术技能为你的生活创造的机遇时，我认为这是一项无价的技能。了解计算机系统的基础知识可以从职业角度为你开启大门，获得更复杂、更高薪的工作。然而，在个人生活中，你可以利用批判性思维和解决问题的能力来提升自己的游戏体验。按照你学习
    c# 的速度，你应该对自己的成就感到非常自信和充实！并不是每个人都能在一个月内学会一门全新的语言，而你通过探索一个新世界简单而轻松地做到了。这是一项你应该感到高兴的成就，并应该真正开始创建你渴望的项目了。作为一种面向对象的语言，我确定你对软件社区的贡献有一些非常棒的新想法。又或许你只是想操作一下你现有的窗口！


    我在书中拆解的描述和章节应该让你能够理解并连接 c# 的不同部分和部分，以至于当你到达最终结论时，能够将知识传递给他人。我希望这门语言向你展示了它是如何鼓励编程的，通过该语言中许多不同途径来定义和分离可能接触（例如类和语句）但不可互换的不同方面。当你习惯了细微差别时，它们可能像是一团令人崩溃的混乱——你越测试自己的技能并对代码示例进行测试，就越能意识到这些技能为你带来的充分影响和优势。感谢你拿起我的书并给它机会教你新知识！我希望让每个主题的基础都成为任何人都可以快速轻松学习的内容。我希望你将其作为未来项目的参考指南，并希望你在书中示例的帮助下已经掌握了材料和概念。我想用我个人经验中认为重要的几句反复强调的格言来结束这本书。在投入使用之前，务必在测试区域测试你的项目。在投入使用之前，务必在测试区域测试你的项目。在投入使用之前，务必在测试区域测试你的项目。


