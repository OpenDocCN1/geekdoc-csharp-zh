    \ we specify the dimension of the array which is to as values. Here is an example\
    \ to show the declaration and initialization of a jagged array:\n\n```csharp\n\
    Using system;\n\nPublic class myarray {\n  Public static void main() {\n    Int[][]\
    \ jaggedarray = new int[2][];\n    Jaggedarray[0] = new int[4]{1, 2, 3, 4};\n\
    \    Jaggedarray[1] = new int[3]{5, 6, 7};\n    Console.readline(jaggedarray[0][0]);\n\
    \    Console.readline(jaggedarray[0][2]);\n    Console.readline(jaggedarray[1][1]);\n\
    \  }\n}\n```\n\nWe have declared and initialized jagged array in the above code.\
    \ The code will give you the following result:\n\n![00051.jpg](images/0051.jpeg)\n\
    \nA jagged array can also store a multidimensional array as a value. We can use\
    \ `[,]` in the second bracket to indicate a multi-dimension. Here is an example:\n\
    \n```csharp\nUsing system;\n\nPublic class myarray {\n  Public static void main()\
