    \n## Chapter 19: delegates\n\nWe can have a function with more than one parameters\
    \ from different data types. However, we may sometimes need to pass a certain\
    \ function as a parameter. How can c# handle the event handler or callback functions?\
    \ This is done via delegates^(142).\n\nA delegate is taken as a pointer to a function.\
    \ It is a reference data type that holds reference of a method. All delegates\
    \ are derived from `System.Delegate` class implicitly. We use delegates to implement\
    \ events and callback methods^(143).\n\n### Declaring a delegate\n\nThe way we\
    \ declare a delegate determine the methods that the delegate can reference. A\
    \ delegate may refer to a method, which has the same signature as the delegate^(144).\
    \ We use the `delegate` keyword to declare a delegate. The following syntax is\
    \ used for the declaration:\n\n`<access modifier> delegate <return type><delegate_name>(<parameters>)`\n\
    \nHere is an example:\n\n```csharp\npublic delegate void display(int value);\n\
    ```\n\nAbove we have declared a `display` delegate. We can use this delegate to\
    \ point to a method with same return type and parameters that have been declared\
    \ with the `display` delegate.\n\nConsider the example given below:\n\n```csharp\n\
    using system;\n\npublic class program {\n    public delegate void display(int\
    \ num);\n    public static void main() {\n        // display delegate points to\
    \ the displaynumer\n        Display displaydel = displaynumer;\n        displaydel(100000);\n\
    \        displaydel(200);\n        // display delegate points to displaymoney\n\
    \        displaydel = displaymoney;\n        displaydel(50000);\n        displaydel(20);\n\
    \    }\n    public static void displaynumer(int x) {\n        Console.WriteLine(\"\
    numer: {0,-12:n0}\",x);\n    }\n    public static void displaymoney(int amount)\
    \ {\n        Console.WriteLine(\"money: {0:c}\", amount);\n    }\n}\n```\n\nThe\
    \ code will print out the following:\n\n![0028.jpg](images/0028.jpeg)\n\nWe have\
    \ created a delegate named `display` that accepts a parameter of type integer\
    \ and returns `void`. With the `main()` method, we have created a variable of\
    \ type `display` and a method named `displaynumer` has been assigned to it. After\
    \ invoking the `display` delegate, the `displaynumer` method will be called; if\
    \ the `display` delegate variable is assigned to `displaymoney`, the `displaymoney`\
    \ method will be invoked. Also, it is possible for us to create a delegate object\
    \ using the `new` keyword. In this case we have to specify the name of the method\
    \ as shown:\n\n```csharp\ndisplaydel = new display(displaynumer);\n```\n\n###\
    \ Invoking a delegate\n\nA delegate is a reference to a method; hence we can invoke\
    \ it simply like a method. When a delegate is invoked, the method that is referred\
    \ to will in turn invoked. There are two ways through we can invoke a delegate:\
    \ using the `()` operator or using `Invoke()` method of delegate. Let us demonstrate\
    \ this using an example:\n\n```csharp\ndisplaydel = displaynumer;\ndisplaydel(5000);\n\
    // or\ndisplaydel.Invoke(10000);\n```\n\nThe two ways that we can use to invoke\
    \ a delegate have shown above.\n\n### Passing a delegate as a parameter\n\nA method\
    \ may have a parameter of delegate type and it can invoke the delegate parameter.\
    \ Here is an example of a delegate parameter:\n\n```csharp\npublic static void\
    \ displayhelper(delegate func, int numto) {\n    func(numto);\n}\n```\n\nIn the\
    \ example given above, the `displayhelper` function has a delegate parameter of\
    \ `display` type and it has been invoked as a function using the statement given\
    \ below:\n\n`func(numto);`\n\nLet us give another example demonstrating how to\
    \ use the `displayhelper` method and a delegate type parameter:\n\n```csharp\n\
    using system;\n\npublic class program {\n    public delegate void display(int\
    \ num);\n    public static void main() {\n        displayhelper(displaynumer,\
    \ 500);\n        displayhelper(displaymoney, 200);\n    }\n    public static void\
    \ displayhelper(delegate func, int numto) {\n        func(numto);\n    }\n   \
    \ public static void displaynumer(int val) {\n        Console.WriteLine(\"numer:\
    \ {0,-12:n0}\",val);\n    }\n    public static void displaymoney(int amount) {\n\
    \        Console.WriteLine(\"money: {0:c}\", amount);\n    }\n}\n```\n\nThe code\
