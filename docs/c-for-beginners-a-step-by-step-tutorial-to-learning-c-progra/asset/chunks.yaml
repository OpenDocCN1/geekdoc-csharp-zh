    ## Introduction

    Although there is nothing easy about learning a new language, the aim of this
    book is to allow you to pick up and understand as quickly as possible. The goal
    of this is to provide you with complete and comprehensive skills that are able
    to help you retain important knowledge and guide your programming and experience
    in `c#`. In order for you to learn in the most efficient manner, I hope that you
    will also do the practice that will reinforce the lessons in this book.


    The book will cover a basic description of what `c#` is, and finally give you
    some helpful hints and resources to reinforce any subjects or skills where you
    may need a little more assistance. This language is one that will mirror some
    components of other programming languages—it is almost invaluable if you are familiar
    with other languages. Although this book is not quite just a beginner’s manual
    that introduces you to the art of programming, it will iterate and acknowledge
    a lot of these skills to help you achieve your maximum programming results in
    the amount of time you can. Keep in mind that this language provides the programmer
    with many abilities, and this book may refer to things in terms of gameplay programming
    I hope you are also familiar with.


    Although I provide you with the information and some basic skills to practice,
    it is up to you to put these skills into practice. I highly recommend you find
    a strict routine to aid you that involves research, study of the material and
    practice in your own virtual environment that familiarizes you with these skills.
    As commonly known, you can guide a horse to the water but you can’t force it to
    drink!


    I can give you the knowledge and resources but it will up to you to take on the
    challenge of synthesizing and using them to create your own programming and codes.


    With an object-oriented and structured language such as `c#`, I think you will
    find it easy to learn and user-friendly. This high-level language builds on and,
    in some ways, complements the languages of `c` and `java`. However, even if you
    are a master of these languages, this new task will have just a steep learning
    curve. As with all programming languages, having knowledge of how they work on
    a basic and functional level is helpful. Throughout this book, I encourage you
    to use your knowledge and instincts in this book.


    ## Chapter 1: what is c#

    You have come and purchased this book to learn how you can become a `c#` programmer.
    Throughout this book, you will learn basic rules of how to apply `c#` within your
    programming projects. `C#` (pronounced as "see sharp") is an object-oriented programming
    language that was designed and developed by Microsoft.


    This is a fairly new language and is considered to be very functional and object-oriented
    in nature. Although `c#` is most certainly not the same language as `c` or `c++`,
    there are definitely some similarities between the languages and it could even
    be considered helpful to have an insight or experience in either or both of those
    languages. As with all programming languages, having knowledge of how they work
    on a basic and functional level is helpful. Throughout this book, I encourage
    you to use your knowledge and instincts in this book.

