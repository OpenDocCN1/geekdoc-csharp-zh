    \ print a value\");\n    }\n\n    private int _value;\n\n    public int value\n\
    \    {\n        get { return _value; }\n        Set { _value = value; }\n    }\n\
    \n    public void displaymoney()\n    {\n        _displayhelper.displaymoney(_value);\n\
    \    }\n\n    public void displaynumer()\n    {\n        _displayhelper.displaynumer(_value);\n\
    \    }\n}\n```\n\n```csharp\npublic class displayhelper\n{\n    //  declare a\
