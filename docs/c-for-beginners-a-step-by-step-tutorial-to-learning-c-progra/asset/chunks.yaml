    \n封装和抽象是面向对象编程中密切相关的特性。抽象的目的是让相关细节对用户可见，而封装的目的是让程序员能够实现所需的抽象级别。\n\n为了实现封装，我们使用访问修饰符。访问修饰符的作用说明类成员的可见性和范围。C#\
    \ 支持不同类型的访问修饰符，它们包括：\n\n- public\n- protected\n- private\n- protected internal\n\
    - internal\n\n### private 访问修饰符\n\n使用 `private` 访问修饰符，类能够向其他对象和函数隐藏其成员和成员变量。只有相似类的函数能够访问其私有成员。类的实例无法访问该类的私有成员。考虑下面的示例：\n\
