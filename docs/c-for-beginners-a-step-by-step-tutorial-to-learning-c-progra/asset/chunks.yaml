  trans: "\n\n当我们使用 C# 时，第一行总是会包含 `using` 语句，尽管大多数情况下你会看到多个以 `using` 为关键字开头的语句。\n\n\
    C# 的下一行将用作 `namespace`（命名空间）的声明。如果你不熟悉，我们可以认为 `namespace` 术语是特定类组或类集合的描述符。\n\n\
    在我们的 hello world 示例中，我们将该短语视为类 `(helloworld)`。紧接命名空间行之后，你将看到类声明。该类将告知你该类的方法。\n\
    \n方法的一个典型特征是单个类中存在多个方法。熟悉给定类的方法非常重要，因为这样你就能更清楚地了解你正在处理的类的行为。在 hello world 示例中，我们只看了一个术语，即\
    \ `main` 方法。\n\n每个类都有一个 `main` 方法，你可以在类声明后的下一行找到它。本质上，当你查看这一行时，可以预期的 `main` 方法会告诉你当代码执行时会发生什么。这一点在\
    \ C# 程序中通常也被称为入口点（entry point）。当你看到后续行行中的 `/*...*/` 时，你看到的是会被实际编译器忽略的代码，而是作为注释添加到程序中的。\n\
    \n我们在此示例中查看的最后两个短语是 `Console.WriteLine(\"hello world\")` 和 `Console.ReadKey()`。这两行告诉系统显示你的消息，并控制程序运行和关闭的方式及时间。这些显然都是程序运行和功能作用的重要部分，你想要确保一些可能影响你编码的关键组件，仅仅是因为你可能会在英语语言中发现类似的语法类型错误。\n\
    \n要运行代码，只需点击运行/执行按钮或按 F5 键，项目就会执行。代码应该返回：\n\n![00140.jpg](img/00140.jpeg)\n\n\
    代码以 `using` 语句开始。该语句的作用是将 `System` 命名空间添加到程序中。C# 程序通常有多个 `using` 语句。\n\n在下一行中，我们有一个\
    \ `namespace` 声明。`namespace` 来说是许多类的集合。在上面，我们有一个 `helloworld` 命名空间，其中包含 `hello`\
    \ 类。\n\n在下一行中，我们有一个类声明。`hello` 类拥有程序将使用的方法和数据。一个类有许多方法。方法的目的是陈述类的行为。然而，我们上面的 `hello`\
    \ 类只有一个方法，即 `main` 方法。\n\n在下一行代码中，我们有 `main` 方法的定义，它标记了所有 C# 程序的入口点。是 `main` 方法说明了执行类后发生了什么。接下来，我们有\
    \ `/*...*/` 行。这是一个注释，C# 编译器将忽略此行。该行仅用于提高人类读者代码的可读性。\n\n接下来是 `Console.WriteLine(...)`。`WriteLine`\
    \ 是属于 `System` 命名空间定义的 `Console` 类的方法。这一行将在屏幕上打印“hello world!”。最后，我们有 `Console.ReadKey();`\
    \ 语句。这一行是为 VS 用户准备的。这一行会让程序等待按键，防止程序从 Visual Studio 启动后屏幕闪过。\n\n除了从 Visual Studio\
    \ 运行程序，你还可以操作系统的命令提示符运行 C# 程序。遵循以下步骤：\n\n* 打开你的文本编辑器，并将上面的代码添加到其中。文本编辑器的一个示例是记事本（Notepad）。\n\
    * 将文件保存为 `helloworld.cs`\n* 启动操作系统的命令提示符，然后导航到你保存文件的目录。\n* 在提示符上输入命令 `csc helloworld.cs`\
    \ 然后按回车键编译代码。\n* 如果代码没有错误，命令提示符将带你进入下一行，然后生成文件 `helloworld.exe`。该文件包含可执行代码。\n\
    * 在提示符上输入 `helloworld` 执行程序。\n* 输出 hello world! 将打印在屏幕上。\n\n你需要确保注意一个细微的区别（如果你熟悉\
    \ Java 的话），类名和程序文件名可以是不同的。此外，C# 是区分大小写的，而且它们不是用句号或其他符号结束句子，而是使用分号 `;` 结束。此外，始终记住\
    \ `main` 方法是程序执行点。\n\n这四个组件对于避免编码时的错误非常重要。\n\n此外，重要的是，在为类命名时，名称中的第一个字符只能是字母而不能是数字。尽管名称不能包含\
    \ C# 关键字。\n\n现在我们将稍微讨论一下 C# 的语法以及如何通过虚拟环境运行该示例。\n\n```\nusing System;\n\nnamespace\
    \ helloworld {\n    class hello {\n        static void main() {\n            /*\
    \ comment */\n            Console.WriteLine(\"hello world\");\n            Console.ReadKey();\n\
    \        }\n    }\n}\n```\n\n"
