  trans: "\n\n本质上，在第一周结束时，你将牢掌握 `c#` 环境、程序结构、基础语法和数据类型、类型转换、变量、常量和操作符。如果你不熟悉所使用的术语或方法，我会尝试对这些术语进行快速、基础的回顾。如果这不能唤起你的记忆，你可能需要通过\
    \ Google 或或其他资源寻找快速的复习。我还想推荐一个免费的交互式 Shell 程序供你尝试——[`www.tutorialspoint.com/compile_csharp_online.php`](https://www.tutorialspoint.com/compile_csharp_online.php)，这应该帮助你完成书中包含的任何训练练习。\n\
    \n## 环境\n\n如所示，`c#` 被开发者设计之初是为了与微软和 .net 框架集成。正如人们所料的，这对你在 `c#` 中发现的环境有很大影响。理解\
    \ `c#` 的重要部分在于理解它们是如何相互作用的。首先，这里是 net framework 的简要概述，帮助你更好地理解它们之间的相互作用。\n\n正如名称后半部分“framework（框架）”所示，net\
    \ framework 是一个可以运行应用程序的平台。net framework 是由微软开发的一个软件开发平台。该框架是为了开发可以在 Windows 平台上运行的应用程序而创建的。第一个版本于\
    \ 2002 年发布，名为 net framework 1.0。从那时起，该框架进行了多次更新以保持最新。\n\n我们可以使用 net framework\
    \ 创建基于 Web 和基于表单的应用程序。我们还可以用它来开发 Web 服务。除了 `c#` 之外，net framework 还支持可视化编程语言。这意味着程序员可以选择使用哪种语言来开发他们的应用程序。\n\
    \n该框架可以帮助你编写三种不同类型的应用程序——Web 服务、Web 应用程序和 Windows 应用程序。当使用该框架应用程序时，实际上它可以被多种编程语言使用，因为它是一个多平台应用程序。从\
    \ Visual Basic、JScript、C++ 到 C#，多种语言都具有框架内相互通信的能力。该框架的另一个伟大特性是广泛的代码库，语言可以利用这些库来实现我们的目的，我们将在文中讨论\
    \ `c#`。\n\n任何语言或框架的伟大之处之一在于，你可以利用一个代码库的潜力。对于 net framework 和 `c#`，有一个巨大的库可以让你访问并利用进行编码。我总是给人们的一条建议是：虽然这些库是极好的资源，但要确保理解编码本身的原理和原因，以确保在出现问题时能够修复它。\n\
    \n微软本身还为用户提供了一个很棒的工具来协助他们的 `c#` 编程开发。该公司甚至免费提供两个优秀的工具，是编写从简单到复杂的任何类型应用程序的优质资源。我推荐的两个名称（因为它们是免费的！）是\n\
    \n如果这些选项不是你感到舒适或喜欢的，你始终可以使用文本编辑器来编写可能需要的源代码。我推荐其他选项，是因为我发现它们比简单的代码编辑器更有帮助。然而，许多人倾向于使用那种方法——这完全取决于你以及你对某个程序的熟悉程度。测试一下，看看哪种方法对你更有效。\n\
    \n你可以从一个名为 microsoft visual studio 的网站下载我提到的两个微软程序。\n\n最后，你还可以在 Linux 或 Mac 上运行\
    \ `c#`，这是跨平台编码的一项伟大能力。然而，为了实现这一点，你显然需要在非微软的框架在你的不同操作系统上运行。我推荐“mono”，它是一个可以在 Linux\
    \ 和 Mac 上使用的开源选项。\n\n掌握了环境的基础知识后，去下载或打开你想要熟悉的程序来开始你的编码过程吧。尝试玩玩软件——或者你可以对你的新知识睡一觉，然后在下一阶段开启你的项目！\n\
    \n## IDE（集成开发环境）\n\nIDE 是一个允许你编写程序的程序。大多数 net 开发者倾向于使用 Visual Studio。这个 IDE 允许你创建和运行应用程序。要使用它，你必须下载并安装它。你可以在\
    \ https://www.visualstudio.com/ 找到它。\n\n## 程序结构和基础语法\n\n现在我们已经了解了一些环境是如何创建的，让我们看看实际结构。当我们观察\
    \ `c#` 是如何构建时，我们看的是组成程序的 7 个基本组件。这些是命名空间声明、类、主方法、注释和表达式。现在，这些在编程和编码方面对你来说是什么样子的？我们为什么不拿这个“hello,\
    \ world”例子并将其拆分成部分来观察它的实际运行呢。\n\n```csharp\nusing system;\n\nnamespace HelloWorldApplication\n\
    {\n    class HelloWorld\n    {\n        static void main(string[] args)\n    \
    \    {\n            /* 我用极妙的 c# 写的第一个程序 */\n            Console.WriteLine(\"hello,\
    \ world\");\n            Console.ReadKey();\n        }\n    }\n}\n```\n\n![00121.jpg](img/00121.jpeg)\n\
    \n所以，希望这看起来对你有些熟悉，尽管你可能并不完全理解其含义，但你知道所有的符号和空格都是重要的。\n\n"
- fmt: "\nWhen we are using C#, the first line is always going to consist of using\
    \ `using`, although most of the time you will see more than one statement with\
    \ the first keyword being `using`.\n\nThe next line in C# will be used as a declaration\
    \ of the `namespace`. In case you are unfamiliar, we should think of the terminology\
    \ of `namespace` as a descriptor of the specific group or collection of classes.\n\
    \nIn our hello world example, we are looking at that phrase as the class `(helloworld)`.\
    \ Following the namespace line, you will come to the class declaration. The class\
    \ is going to inform you of the method of the class.\n\nIt is a typical characteristic\
    \ of methods that there are multiple within one singular class. It is important\
    \ to be familiar with the methods of a given class because you can then be more\
    \ aware of the behavior of the class you are dealing with. In the hello world\
    \ example, we are looking only at one single term, or `main` method.\n\nEach class\
    \ has a `main` method that you can find in the line following the class declaration.\
    \ Essentially, when you are looking at this line you can expect the `main` method\
    \ to tell you what is going to happen when the code is executed. This point is\
    \ often also referred to as the entry point in C# programs. When you see the `/*...*/`\
    \ in the following line, you are looking at code that will be ignored by the actual\
    \ compiler and instead is added in the program under the comments.\n\nThe last\
    \ two phrases we are looking at in this example are `Console.WriteLine(\"hello\
    \ world\")` and `Console.ReadKey()`. These lines are telling the system to both\
    \ display your message and control how and when the program runs and closes. These\
    \ are obviously both important parts of how and why the program would work and\
    \ function and you want to make sure of a couple of key components that could\
    \ affect your coding, just due to similar grammatical type errors you may find\
    \ in the English language.\n\nTo run the code, just click the run/execute button\
    \ or press the F5 key and the project will be executed. The code should return:\n\
    \n![00140.jpg](images/00140.jpeg)\n\nThe code begins with the `using` statement.\
    \ What this statement does is that it adds the `System` namespace into the program.\
    \ C# programs normally have multiple `using` statements.\n\nIn the next line,\
    \ we have a `namespace` declaration. A `namespace` is simply a collection of many\
    \ classes. Above, we have the `helloworld` namespace in which we have the `hello`\
    \ class.\n\nIn the next line, we have the class declaration. The `hello` class\
    \ has methods and data that the program will use. A class has numerous methods.\
    \ The purpose of a method is to state the behavior of a class. However, our `hello`\
    \ class above only has one method, the `main` method.\n\nIn the next line of code\
    \ we have the definition of the `main` method which marks the entry point for\
    \ all C# programs. It is the `main` method that states what happens after execution\
    \ of a class. Next, we have the `/*...*/` line. This is a comment and the C# compiler\
    \ will ignore the line. The line is only meant to increase the readability of\
    \ the code for human readers.\n\nNext we have `Console.WriteLine(...)`. `WriteLine`\
    \ is a method that belongs to the `Console` class that is defined in the `System`\
    \ namespace. This line will print \"hello world!\" on the screen. Lastly, we have\
    \ the `Console.ReadKey();` statement. This line is for VS Net users. The line\
    \ will make the program to wait for a key press and prevent the screen from running\
    \ quickly once the program has been launched from Visual Studio.\n\nOther than\
    \ running the program from Visual Studio, it is possible for you to run a C# program\
    \ from the command prompt of operating system. To do this follow these sequences\
    \ of steps:\n\n* Open your text editor then add the code above to it. An example\
    \ of a text editor is Notepad.\n* Save the file with the name `helloworld.cs`\n\
    * Launch the command prompt of the operating system then navigate to the directory\
    \ you have saved the file.\n* Type the command `csc helloworld.cs` on the prompt\
    \ then press the enter key to compile the code.\n* If the code has no errors,\
    \ the command prompt will take you to the next line then generates the file `helloworld.exe`.\
    \ This file has executable code.\n* Type `helloworld` on the prompt to execute\
    \ the program.\n* The output hello world! Will be printed on the screen.\n\nYou\
    \ want to make sure that you note a subtle difference (if you are familiar with\
    \ Java) that the class name and program file name can be different. Also, C# is\
    \ both case-sensitive and, rather than ending sentences with a period or other\
    \ notation, they are ended using a semicolon. Also, always remember that the `main`\
    \ method is the point at which the program executes.\n\nThese four components\
    \ are important to avoid mistakes when coding.\n\nIn addition to this, it is important\
    \ to remember that when naming a class, the first character in the name can only\
    \ be a letter and not a digit. Although the name cannot contain a C# keyword.\
    \ \n\nNow we will discuss a little out the syntax of C# and how around example\
    \ with the virtual environment.\n\n```\nusing System;\n\nnamespace helloworld\
    \ {\n    class hello {\n        static void main() {\n            /* comment */\n\
    \            Console.WriteLine(\"hello world\");\n            Console.ReadKey();\n\
    \        }\n    }\n}\n```\n"
