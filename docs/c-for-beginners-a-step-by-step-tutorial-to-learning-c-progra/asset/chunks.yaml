    系统会提示你输入两个值，请执行这些操作。你将获得它们在调用方法之前和之后的值。\n\n# 第 10 章：数组世界(123)\n\n我们可以将数组定义为一种特殊的数据类型，它以顺序存储固定数量的值，并使用特殊的语法。所有数组元素必须属于相同的数据类型，例如字符串、整数、双精度浮等。你可以将数组视为存储在连续内存位置中的同类型变量集合。你使用索引来访问数组中的给定元素。\n\
    \n在内存中，最低地址标识数组中的第一个元素，而最高地址标识数组中的最后一个元素。\n\n## 声明数组(125)\n\n在 c# 中，使用以下语法声明数组：\n\
    \n`datatype[] arrayname;`\n\n`datatype` 帮助我们指定存储在数组中的元素的数据类型，不要忘记所有数组元素必须属于相同类型。方括号\
    \ `[]` 帮助说明数组的阶（rank），其中阶表示存储在数组中的大小或元素数量。`arrayname` 表示数组名称。以下是有效的数组声明示例：\n\n\
    - `int[] intarray;` // 可用于存储 int 值\n- `bool[] boolarray;` // 可用于存储 bool 值\n- `string[]\
    \ stringarray;` // 可用于存储字符串值\n- `double[] doublearray;` // 可用于存储 double 值\n- `byte[]\
    \ bytearray;` // 可用于存储 byte 值\n- `employee[] departmentarray; // 可用于存储 employee\
    \ 类的实例\n\n## 初始化\n\n当数组被声明后，并不意味着它已经在内存中初始化了。初始化数组后，可以对其赋值。初始化可以在声明时使用 `new` 关键字完成。当使用此关键字时，会创建一个数组的实例。演示如下：\n\
    \n```csharp\nclass myarray {\n    static void main() {\n        int[] intarray_1\
    \ = new int[4];\n        int[] intarray_2 = new int[4]{10, 20, 30};\n        int[]\
    \ intarray_3 = {10, 20, 30};\n    }\n}\n```\n\n首先，我们声明了一个存储 4 个整数的数组。注意，数组的大小是在方括号内指定的。我们在第二条语句中也做了同样的操作，并将值分配到了大括号\
    \ `{}` 中。在第三条语句中，我们声明了一个数组并在未指定大小的情况下对其赋值了值。\n\n延迟初始化\n\n可以在数组声明后对其初始化。这意味着我们不必同时完成数组的声明和初始化。这里有一个示例：\n\
    \n```csharp\nusing system;\nclass myarray {\n    static void main() {\n      \
    \  string[] array1, array2;\n        array1 = new string[4]{ \"miles\", \"john\"\
    , \"clare\"};\n        array2 = new string[]{\"miles\", \"john\", \"clare\"};\n\
    \        Console.WriteLine(array1.length);\n        Console.WriteLine(array2.length);\n\
    \    }\n}\n```\n\n上述机制被称为延迟初始化。在这种情况下，初始化必须使用 `new` 关键字完成。我们不能仅仅通过给数组赋值来初始化它。下面的示例了一个无效的数组初始化：\n\
    \n```csharp\nstring[] myarray;\nmyapp = {\"miles\", \"john\", \"clare\"};\n```\n\
    \n## 访问数组元素\n\n数组的元素是在初始化期间分配的。然而，我们可以使用单个索引为数组赋值。演示如下：\n\n```csharp\nusing system;\n\
    class myprogram {\n    static void main() {\n        int[] array1 = new int[5];\n\
    \        array1[0] = 1;\n        array1[1] = 2;\n        array1[2] = 3;\n    \
    \    array1[3] = 4;\n        array1[4] = 5;\n        Console.WriteLine(array1[0]);\n\
    \        Console.WriteLine(array1[1]);\n        Console.WriteLine(array1[2]);\n\
    \        Console.WriteLine(array1[3]);\n        Console.WriteLine(array1[4]);\n\
    \    }\n}\n```\n\n代码将返回以下结果：\n\n![00046.jpg](img/0046.jpeg)\n\n对数组值的检索或访问也是通过索引完成的。元素的索引放在括号内。考虑下面的示例：\n\
    \n`array1[0];`\n`array1[1];`\n`array1[2];`\n`array1[3];`\n`array1[4];`\n\n这就是我们如何访问名为\
    \ `array1` 的上方数组的所有元素。\n\n## 使用 for 循环\n\n我们可以使用 `for` 循环访问数组元素。循环将遍历数组元素，同时通过它们的索引访问所需的元素。例如：\n\
    \n```csharp\nusing system;\nnamespace arrayapp {\nclass myarray {\n    static\
    \ void main(string[] args) {\n        int[] n = new int[10]; /* n 是一个 10 个整数的数组\
    \ */\n        int x, y;\n        /* 初始化数组 n 的元素 */\n        for (x = 0; x < 10;\
    \ x++) {\n            n[x] = x + 50;\n        }\n        /* 输出每个数组元素的值 */\n  \
    \      for (y = 0; y < 10; y++) {\n            Console.WriteLine(\"element at\
    \ index[{0}] = {1}\", y, n[y]);\n        }\n    }\n}\n}\n```\n\n"
- fmt: "\n# Using for, foreach loop\n\nYou have known how to use a `for loop` to access\
    \ all the elements of an array. A `foreach loop` can also help you to iterate\
    \ through the elements of an array. The following example demonstrates how to\
    \ use a `foreach loop` to iterate through the elements of an array:\n\n```csharp\n\
    Using system;\n\nNamespace arrayapp {\n  Class myarray {\n    Static void main(string[]\
    \ args) {\n      Int [] n = new int[10]; /* n is an array of 10 integers */\n\
    \      //int x, y;\n      /* initialize the elements of the array n */\n     \
    \ For (int x = 0; x < 10; x++) {\n        N[ x ] = x + 100;\n      }\n      /*\
    \ output the values of all array elements */\n      reach (int y in n ) {\n  \
    \      Int x = y-100;\n        Console.readline(\"element[{0}] = {1}\", x, y);\n\
    \      }\n      Console.readline();\n    }\n  }\n}\n```\n\nThe code gives the\
    \ following result:\n\nThe `for loop` helped us fill 10 values into the array,\
    \ with the first element being 100 and the last one being 109. The `foreach loop`\
    \ helped us access all the elements of the array right from index 0 to the last\
    \ index. Note that the variable `x` has been used for filling the array values\
    \ while the variable `y` has been used for iterating through the elements of the\
    \ array. The code returns the output given below:\n\n![00126.jpg](images/00126.jpeg)\n\
    \n## Multidimensional arrays\n\nThe concept of multidimensional arrays is supported\
    \ in C#. Such arrays are also known as rectangular arrays. A multidimensional\
    \ array is a two-dimensional series organized in the form of rows and columns.\
