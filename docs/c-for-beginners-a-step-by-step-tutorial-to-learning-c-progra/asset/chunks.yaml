  trans: "\n通过继承，程序员可以根据一个类定义另一个类。这使得我们能够重用代码并缩短实现应用程序的时间。\n\n在创建类过程中，程序员不需要创建完全新的成员函数和数据成员，而是指定新类继承已存在类的成员。现有类被称为基类（base\
    \ class），而新类被称为派生类（derived class）。\n\n继承简单来说是“是一种”（is-a）关系的实现。例如，牛是一种哺乳动物。\n\n\
    一个类可以继承自多个类或接口，这意味着它可以从许多基接口或类中继承数据和函数。以下示例演示了基类和派生类的概念：\n\n```csharp\nUsing system;\n\
    \nNamespace inheritanceapp {\n\nClass figure {\n\n    Public void setwidth(int\
    \ wid) {\n        Width = wid;\n    }\n\n    Public void setheight(int heig) {\n\
    \        Height = heig;\n    }\n\n    Protected int width;\n\n    Protected int\
    \ height;\n}\n\n// a derived class\nClass rectangle: figure {\n    Public int\
    \ calculatearea() {\n        Return (width * height);\n    }\n}\n\nClass testinheritance\
    \ {\n    Static void main(string[] args) {\n        Rectangle r = new rectangle();\n\
    \        R.setwidth(6);\n        R.setheight(8);\n        // print the rectangle's\
    \ area.\n        Console.writeline(\"the area is: {0}\", r.calculatearea());\n\
    \        Console.readkey();\n    }\n}\n\n}\n```\n\n代码应返回以下输出：\n\n![00189.jpg](img/00189.jpeg)\n\
    \n我们定义了 `figure` 类，包含两个属性，即 `width` 和 `height`。该类还有两个方法，`setwidth()` 和 `setheight()`。然后我们定义了一个名为\
    \ `rectangle` 的类。注意我们创建此类时所使用的语法：\n\n`Class rectangle: figure {`\n\n使用完整的冒号表示\
    \ `rectangle` 类正在继承 `figure` 类。`rectangle` 类仅有一个方法，即 `calculatearea()` 方法。然而，由于它继承了\
    \ `figure` 类，意味着它拥有 `figure` 类的所有属性，如 `width` 和 `height`。\n\n随后我们创建了 `testinheritance`\
    \ 类。在 `main()` 方法中，创建了 `rectangle` 类的实例并将其命名为 `r`。我们使用该实例来访问在 `rectangle` 和 `figure`\
    \ 类中定义的属性。这就是继承的强大之处！\n\n### 基类初始化\n\n派生类继承基类中定义的方法和变量。这意味着我们应该在创建子类之前创建父类。给出的程序演示了成员列表初始化的继承：\n\
    \n```csharp\nUsing system;\n\nNamespace inheritanceapp {\n\nClass object {\n//\
    \ the member variables\n    Protected double width;\n\n    Protected double length;\n\
    \n    Public object(double len, double wid) {\n        Width = wid;\n        Length\
    \ = len;\n    }\n\n    Public double calculatearea() {\n        Return length\
    \ * width;\n    }\n\n    Public void show() {\n        Base.show();\n        Console.writeline(\"\
    the width of the figure is: {0}\", width);\n        Console.writeline(\"the length\
    \ of the figure is: {0}\", length);\n        Console.writeline(\"the area of the\
    \ figure is: {0}\", calculatearea());\n    }\n}//end class figure\nClass carpet\
    \ : object {\n    Private double cost;\n\n    Public carpet(double len, double\
    \ wid) : base(len, wid) { }\n\n    Public double calculatecost() {\n        Double\
    \ cost;\n        cost = calculatearea() * 120;\n        Return cost;\n    }\n\n\
    \    Public void show() {\n        Base.show();\n        Console.writeline(\"\
    the total cost for the carpet is: {0}\", calculatecost());\n    }\n}\n\nClass\
    \ run {\n    Static void main(string[] args) {\n        Carpet c = new carpet(7.5,\
    \ 9.5);\n        C.show();\n        Console.readline();\n    }\n}\n\n}\n```\n\n\
    代码将返回以下输出：\n\n![00092.jpg](img/00092.jpeg)\n\n### 多重继承\n\nC# 不支持多重继承。但是通过接口，我们可以实现多重继承。考虑以下示例：\n\
    \n```csharp\nUsing system;\n\nNamespace inheritanceapp {\n\nClass object {\n \
    \   Public void setwidth(int wid) {\n        Width = wid;\n    }\n\n    Public\
    \ void setheight(int heig) {\n        Height = heig;\n    }\n\n    Protected int\
    \ width;\n\n    Protected int height;\n}\n\n// paintcost for the base class\n\
    Public interface paintcost {\n    Int calculatecost(int area);\n}\n\n// the derived\
    \ class\nClass o : object,paintcost {\n    Public int calculatearea() {\n    \
    \    Return (width * height);\n    }\n\n    Public int calculatecost(int area)\
    \ {\n        Return area * 120;\n    }\n}\n\nClass inheritancetester {\n    Static\
    \ void main(string[] args) {\n        O = new o();\n        Int area;\n      \
    \  .setwidth(5);\n        .setheight(7);\n        Area = .calculatearea();\n \
    \       // show the area of the object\n        Console.writeline(\"the area of\
    \ the object is: {0}\", .calculatearea());\n        Console.writeline(\"the total\
    \ printing cost is: ${0}\", .calculatecost(area));\n        Console.readkey();\n\
    \    }\n}\n\n}\n```\n\n代码给出以下输出：\n\n![00084.jpg](img/00084.jpeg)\n\n## 第 15 章：多态\n\
    \n多态（Polymorphism）是一个意味着多种形式的术语。在编程中，它表现为“一个接口，多个函数”。多态可以有两种形式：静态或动态。对于静态多态，绑定在编译时确定。它也被称为函数重载。我们可以在同一个作用范围内对同一个函数名有多个定义。这些函数之间的区别在于它们接收的参数类型或数量。函数声明不能通过不同的返回类型来重载。\n"
- fmt: "\nWe have three definitions of the function `display()`. In this case, overloading\
    \ has been implemented by varying the types of parameters taken by the function.\
    \ In one instance, the function is taking an integer value, a float in another\
    \ instance and a string in the last instance.\n\n## Operator Overloading\n\nOperator\
    \ overloading refers to the use of a single operator to perform various operations.\
    \ With operator overloading, additional functionalities can be added to the C#\
    \ operators during their application on user-defined types. This is the case when\
    \ either one or both the operands belong to a user-defined class.\n\nHere is an\
    \ example that demonstrates this:\n\n```csharp\nusing system;\n\nnamespace polymorphismapp\
