    \n## Chapter 13: encapsulation\n\nEncapsulation is the process of enclosing items\
    \ within a logical or physical package. In object-oriented programming, encapsulation\
    \ is used to prevent access to the implementation details.\n\nEncapsulation and\
    \ abstraction are closely related features in object-oriented programming. The\
    \ purpose of abstraction is to make the relevant details visible to users while\
    \ the purpose of encapsulation is to enable a programmer to implement the required\
    \ level of abstraction.\n\nTo implement encapsulation, we use access specifiers.\
    \ The role of an access specifier is to state the visibility and scope of a class\
    \ member. There are different types of access specifiers that are supported in\
    \ c#. They include the following:\n\n- public\n- protected\n- private\n- protected\
    \ internal\n- internal\n\n### Private access specifier\n\nWith a `private` access\
    \ specifier, a class is able to hide its member functions and member variables\
    \ from other objects and functions. Only functions of a similar class are able\
    \ to access its private members. An instance of the class is not able to access\
    \ the private members of the class. Consider the example below:\n\n```csharp\n\
    Using system;\n\nNamespace accession {\n    Class figure {\n        // the class\
    \ member variables\n        Private width;\n        Private length;\n        Public\
    \ void getdetails() {\n            Console.WriteLine(\"enter the length: \");\n\
    \            Length = Convert.ToInt32(Console.readline());\n            Console.WriteLine(\"\
    enter the width: \");\n            Width = Convert.ToInt32(Console.readline());\n\
    \        }\n        Public void calculatearea() {\n            Return length *\
    \ width;\n        }\n        Public void show() {\n            Console.WriteLine(\"\
    the length of the figure is: {0}\", length);\n            Console.WriteLine(\"\
    the width of the figure is: {0}\", width);\n            Console.WriteLine(\"the\
    \ area of the figure is: {0}\", calculatearea());\n        }\n    }//end the class\
    \ figure\n\n    Class runfigure {\n        Static void main(string[] args) {\n\
    \            Figure f = new figure();\n            F.getdetails();\n         \
    \   F.show();\n            Console.readline();\n        }\n    }\n}\n```\n\nThe\
    \ following is the output from the code:\n\n![00081.jpg](images/00081.jpeg)\n\n\
    The class member variables `width` and `length` have been declared as `private`,\
    \ which means that we are able to access them from the `main()` function after\
    \ creating an instance of the class. We have created an instance of the `figure`\
    \ class and given it the name `f`.\n\nThe `calculatearea()` and `show()` member\
    \ functions are also able to access these member variables without using an instance\
    \ of the class. We can also access them from the `main()` function after creating\
    \ an instance of the `figure` class. This instance has been given the name `f`.\n\
    \n### Public access specifier\n\nWith a `public` access specifier, a class is\
    \ able to expose its member functions and member variables to the other objects\
    \ and functions. Any class member declared as `public` can be accessed from outside\
    \ of that class. Consider the following example:\n\n```csharp\nUsing system;\n\
    \nNamespace figureapplication {\n    Class figure {\n        // the class member\
    \ variables\n        Public width;\n        Public length;\n        Public void\
    \ calculatearea() {\n            Return length * width;\n        }\n        Public\
    \ void show() {\n            Console.WriteLine(\"the length of the figure is:\
    \ {0}\", length);\n            Console.WriteLine(\"the width of the figure is:\
    \ {0}\", width);\n            Console.WriteLine(\"the area of the figure is: {0}\"\
    , calculatearea());\n        }\n    }//end the figure class\n\n    Class runfigure\
    \ {\n        Static void main(string[] args) {\n            Figure f = new figure();\n\
    \            F.length = 5.4;\n            F.width = 3.2;\n            F.show();\n\
    \            Console.readline();\n        }\n    }\n}\n```\n\n### Protected access\
    \ specifier\n\nThis `protected` access specifier makes it possible for a child\
    \ class to access the member functions and variables that have been defined in\
    \ the base class. This will be discussed in inheritance.\n\n### Internal access\
    \ specifier\n\nThis `internal` access specifier allows a member to be accessed\
    \ by any code within the same assembly where it is defined.\n"
