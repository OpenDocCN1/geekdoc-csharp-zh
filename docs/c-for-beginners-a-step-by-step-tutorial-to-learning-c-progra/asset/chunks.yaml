    \nIt returns the following:\n\n![00172.jpg](images/00172.jpeg)\n\nThe variable\
    \ that is supplied for the output parameter should e assigned a value. Output\
    \ parameters are very useful when one wants to return values from a method via\
    \ the parameters without assigning initial value to the parameter. The following\
    \ example will help you understand this better:\n\n```csharp\nusing system;\n\n\
    namespace methodapplication {\nclass numerchecker {\n    public void getvalues(out\
    \ int a, out int b) {\n        Console.WriteLine(\"enter in your first value:\
    \ \");\n        a = convert.toInt32(Console.readline());\n        Console.WriteLine(\"\
    enter in your second value: \");\n        b = convert.toInt32(Console.readline());\n\
    \    }\n\n    static void main(string[] args) {\n        numerchecker n = new\
    \ numerchecker();\n        /* defining a local variable */\n        int x, y;\n\
    \        /* call a function to obtain the values */\n        n.getvalues(out x,\
    \ out y);\n        Console.WriteLine(\"after calling the method, the value of\
    \ x is : {0}\", x);\n        Console.WriteLine(\"after calling the method, the\
    \ value of y is : {0}\", y);\n        Console.readline();\n    }\n}\n}\n```\n\n\
    You will be prompted to enter the two values, so do those. You will then be provided\
    \ with their values before and after calling the method.\n\n# Chapter 10: the\
    \ array world(123)\n\nWe can define an array as a special data type that stores\
    \ a fixed number of values in a sequential manner and use of a special syntax.\
    \ All the array elements must belong to the same data type such as a string, integer,\
    \ double etc. You can think of an array as a collection of variables of the same\
    \ type stored in contiguous memory locations. You use an index to get access to\
    \ a given element within an array.\n\nIn the memory, the lowest address identifies\
    \ the first element in the array while the highest address identifies the highest\
    \ element in the array.\n\n## Declaring arrays(125)\n\nThe declaration of arrays\
    \ in c# is done using the following syntax:\n\n`datatype[] arrayname;`\n\nThe\
    \ `datatype` helps us specify the data type of the elements that are stored in\
    \ the array, not forgetting that all the array elements must belong to the same\
    \ data type. The square brackets `[]` help in stating the rank of the array, where\
    \ the rank denotes the size or the number of elements to e stored in the array.\
    \ The `arrayname` denotes the name of the array. The following are valid examples\
    \ of array declarations:\n\n- `int[] intarray;` // may be used for storing int\
    \ values\n- `bool[] boolarray;` // may be used for storing bool values\n- `string[]\
    \ stringarray;` // may be used for storing string values\n- `double[] doublearray;`\
    \ // may be used for storing double values\n- `byte[] bytearray;` // may be used\
    \ for storing byte values\n- `employee[] departmentarray;` // may be used for\
    \ storing instances of employee class\n\n## Initialization\n\nWhen an array has\
    \ been declared, it doesn’t mean that it has already initialized in the memory.\
    \ After initializing an array, it is possible to assign values to it. Initialization\
    \ can be done at the time of its declaration using the `new` keyword. When this\
    \ keyword is used, an instance of the array is created. This is demonstrated below:\n\
    \n```csharp\nclass myarray {\n    static void main() {\n        int[] intarray_1\
    \ = new int[4];\n        int[] intarray_2 = new int[4]{10, 20, 30};\n        int[]\
    \ intarray_3 = {10, 20, 30};\n    }\n}\n```\n\nFirst, we have declared an array\
    \ to store 4 integers. Note that the specification of the array size has done\
    \ within the square brackets. We have also done the same thing in our second statement,\
    \ values have also been assigned to the curly braces `{}`. In the third statement,\
    \ we have declared an array and assigned values to it without specifying its size.\n\
    \nLate initialization\n\nIt is possible to initialize an array after it has been\
    \ declared. This means that it is not a must for us to do declaration and the\
    \ initialization of an array at the same time. Here is an example:\n\n```csharp\n\
    using system;\nclass myarray {\n    static void main() {\n        string[] array1,\
    \ array2;\n        array1 = new string[4]{ \"miles\", \"john\", \"clare\"};\n\
    \        array2 = new string[]{\"miles\", \"john\", \"clare\"};\n        Console.WriteLine(array1.length);\n\
    \        Console.WriteLine(array2.length);\n    }\n}\n```\n\nThe above mechanism\
    \ is known as late initialization. The initialization in this case must be done\
    \ using the `new` keyword. We cannot initialize the array simply assigning values\
    \ to it. The following example shows an invalid initialization of an array:\n\n\
    ```csharp\nstring[] myarray;\nmyapp = {\"miles\", \"john\", \"clare\"};\n```\n\
    \n## Accessing array elements\n\nThe elements of an array were assigned during\
    \ the initialization time. However, it is possible for us to assign values to\
    \ an array using the individual indexes. This is demonstrated below:\n\n```csharp\n\
    using system;\nclass myprogram {\n    static void main() {\n        int[] array1\
    \ = new int[5];\n        array1[0] = 1;\n        array1[1] = 2;\n        array1[2]\
    \ = 3;\n        array1[3] = 4;\n        array1[4] = 5;\n        Console.WriteLine(array1[0]);\n\
    \        Console.WriteLine(array1[1]);\n        Console.WriteLine(array1[2]);\n\
    \        Console.WriteLine(array1[3]);\n        Console.WriteLine(array1[4]);\n\
    \    }\n}\n```\n\nThe code will return the following result:\n\n![00046.jpg](images/0046.jpeg)\n\
    \nThe retrieval or access to the array values is also done using the indexes.\
    \ The index of the element is passed within brackets. Consider the example given\
    \ below:\n\n`array1[0];`\n`array1[1];`\n`array1[2];`\n`array1[3];`\n`array1[4];`\n\
    \nThat is how we can access all the elements of the above array named `array1`.\n\
    \n## Using for loop\n\nWe can use a `for` loop to access the elements of an array.\
    \ The loop will iterate through the elements of the array while accessing the\
    \ required ones via their indices. For example:\n\n```csharp\nusing system;\n\
    namespace arrayapp {\nclass myarray {\n    static void main(string[] args) {\n\
    \        int[] n = new int[10]; /* n is an array of 10 integers */\n        int\
    \ x, y;\n        /* initialize the elements of the array n */\n        for (x\
    \ = 0; x < 10; x++) {\n            n[x] = x + 50;\n        }\n        /* output\
    \ each array element's value */\n        for (y = 0; y < 10; y++) {\n        \
    \    Console.WriteLine(\"element at index[{0}] = {1}\", y, n[y]);\n        }\n\
    \    }\n}\n}\n```\n"
