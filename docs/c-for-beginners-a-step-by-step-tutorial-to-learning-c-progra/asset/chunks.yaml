    \n![00149.jpg](img/00149.jpeg)\n\n## 第 19 章：委托 (delegates)\n\n我们可以拥有具有多个不同数据类型参数的函数。然而，我们有时可能需要将某个函数作为参数传递。c#\
    \ 如何处理事件处理程序或回调函数呢？这是通过委托¹⁴² 实现的。\n\n委托被视为函数的指针。它是一种引用数据类型，持有对方法的引用。所有委托都隐式地继承自\
    \ `System.Delegate` 类。我们使用委托来实现实事件和回调方法¹⁴³。\n\n### 声明委托\n\n我们声明委托的方式决定了委托可以引用的方法。委托可以引用一个方法，该方法的签名与委托相同¹⁴⁴。我们使用\
    \ `delegate` 关键字来声明委托。声明使用以下语法：\n\n`<访问修饰符> delegate <返回类型><委托名称>(<参数>)`\n\n这里是一个示例：\n\
    \n```csharp\npublic delegate void display(int value);\n```\n\n在上面我们声明了一个 `display`\
    \ 委托。我们可以使用此委托指向一个与 `display` 委托声明的具有相同返回类型和参数的方法。\n\n考虑下面给出的示例：\n\n```csharp\n\
    using system;\n\npublic class program {\n    public delegate void display(int\
    \ num);\n    public static void main() {\n        // display 委托指向 displaynumer\n\
    \        Display displaydel = displaynumer;\n        displaydel(100000);\n   \
    \     displaydel(200);\n        // display 委托指向 displaymoney\n        displaydel\
    \ = displaymoney;\n        displaydel(50000);\n        displaydel(20);\n    }\n\
    \    public static void displaynumer(int x) {\n        Console.WriteLine(\"numer:\
    \ {0,-12:n0}\",x);\n    }\n    public static void displaymoney(int amount) {\n\
    \        Console.WriteLine(\"money: {0:c}\", amount);\n    }\n}\n```\n\n代码将打印出以下内容：\n\
    \n![0028.jpg](img/0028.jpeg)\n\n我们创建了一个名为 `display` 的委托，它接受一个整数类型的参数并返回 `void`。通过\
    \ `main()` 方法，我们创建了一个类型为 `display` 的变量，并将名为 `displaynumer` 的方法赋值给它。在调用 `display`\
    \ 委托后，将调用 `displaynumer` 方法；如果 `display` 委托变量被赋值为 `displaymoney`，将调用 `displaymoney`\
    \ 方法。此外，我们可以使用 `new` 关键字创建一个委托对象。在这种情况下，我们需要如所示指定方法的名称：\n\n```csharp\ndisplaydel\
    \ = new display(displaynumer);\n```\n\n### 调用委托\n\n委托是对方法的引用；因此我们可以像调用方法一样调用它。当调用委托时，所引用的方法会被调用。我们有两种调用委托的方法：使用\
    \ `()` 运算符或使用委托的 `Invoke()` 方法。让我们通过示例来演示这一点：\n\n```csharp\ndisplaydel = displaynumer;\n\
    displaydel(5000);\n// 或者\ndisplaydel.Invoke(10000);\n```\n\n上面展示了调用委托的两种方法。\n\n\
    ### 将委托作为参数传递\n\n方法可以有一个委托类型的参数，并且它可以调用该委托参数。这里是一个委托参数的示例：\n\n```csharp\npublic\
    \ static void displayhelper(delegate func, int numto) {\n    func(numto);\n}\n\
    ```\n\n在上面的示例中，`displayhelper` 函数具有一个 `display` 类型的委托参数，并且通过下面的语句将其作为函数调用：\n\n\
    `func(numto);`\n\n让我们再给出一个示例，演示如何使用 `displayhelper` 方法和委托类型参数：\n\n```csharp\n\
    using system;\n\npublic class program {\n    public delegate void display(int\
    \ num);\n    public static void main() {\n        displayhelper(displaynumer,\
    \ 500);\n        displayhelper(displaymoney, 200);\n    }\n    public static void\
    \ displayhelper(delegate func, int numto) {\n        func(numto);\n    }\n   \
    \ public static void displaynumer(int val) {\n        Console.WriteLine(\"numer:\
    \ {0,-12:n0}\",val);\n    }\n    public static void displaymoney(int amount) {\n\
    \        Console.WriteLine(\"money: {0:c}\", amount);\n    }\n}\n```\n\n代码将返回以下输出：\n\
    \n![0097.jpg](img/0097.jpeg)\n\n### 多路委托 (Multicast delegate)\n\n委托可以指向多个函数。任何指向多个函数的委托被称为多路委托。使用\
    \ `+` 运算符向委托对象添加函数，使用 `–` 运算符从委托中移除函数。考虑下面的示例：\n\n```csharp\nusing system;\n\n\
    public class program {\n    public delegate void display(int value);\n    public\
    \ static void main() {\n        display displaydel = displaynumer;\n        displaydel\
    \ += hexadecimal;\n        displaydel += displaymoney;\n        displaydel(1000);\n\
    \        displaydel -= hexadecimal;\n        displaydel(2000);\n    }\n    public\
    \ static void displaynumer(int x) {\n        Console.WriteLine(\"numer: {0,-12:n0}\"\
    ,x);\n    }\n    public static void hexadecimal(int dec) {\n        Console.WriteLine(\"\
    hexadecimal: {0:x}\", dec);\n    }\n    public static void displaymoney(int amount)\
    \ {\n        Console.WriteLine(\"money: {0:c}\", amount);\n    }\n}\n```\n\n在上面的示例中，`displaydel`\
    \ 指向三个方法 `displaynumer`、`hexadecimal` 和 `displaymoney`。这使其成为多路委托。这意味着当调用 `displaydel`\
    \ 时，它将顺序调用所有方法。\n\n## 第 20 章：c# 中的多线程 (multithreading)\n\n线程定义了控制流。线程是操作系统分配的执行的基本单位。线程的执行在程序内部是独立的。\n\
    \n单个进程使用一个线程执行。这种进程被称为单线程进程。一次只能执行一个任务。用户必须等待任务完成才能执行新任务。\n\n为了同时执行多个一个线程，会创建多个线程。创建两个或多个线程的过程被称为多线程¹⁴⁵。\n\
    \n### 线程的生命周期\n\n"
- fmt: "\nThe life cycle begins when the object of `system.threading.thread` class\
    \ is created. The life ends as soon as the task is completed. There are various\
    \ states in the life cycle of a thread.\n\n* **unstarted state**: when the instance\
    \ of the `thread` class is created, the thread enters in unstarted state.\n* **ready\
    \ state**: the thread is in this state until the program calls the `start()` method.\n\
    * **not runnable state**: some of the elements that make a thread not to in a\
    \ runnable state include:\n    1. **Waiting**: the `wait()` method is called to\
    \ make the thread wait for a specified condition.\n    2. **Locked**: the thread\
    \ is locked by an i/o operation.\n    3. **Sleeping**: the `sleep()` method is\
    \ called to put the thread in sleeping mode.\n* **dead state**: once the thread\
    \ completes its execution or aborted, it is placed in a dead state.\n\n# Main\
    \ thread\n\nWhen working with threads, we make use of the `system.threading.thread`\
    \ class. The main thread is created as soon as the program starts execution. The\
    \ `thread` class is used for creating threads. They are known as child threads.\
    \ The user can access the main thread by using the `currentthread` property of\
    \ the `thread` class.\n\nExample:\n\n```csharp\nUsing system;\n\nNamespace thread\n\
    {\n\nClass mainthread\n{\n\nStatic void main(string[] args)\n{\n\nThread t1  =new\
    \ thread();\n\nT1.name=\"thread1\";\n\nConsole.writeline(\"thread  is:{0}\",t1.name);\n\
    \nConsole.read();\n\n}\n\n}\n\n}\n```\n\nOn compiling and executing the code,\
    \ the output is:\n`Thread is: thread1`\n\n# Properties and methods of the thread\
    \ class\n\n### Properties(146):\n\n* **isalive**: the value showing the execution\
    \ status of the current thread \n* **currentthread**: the current running thread\
    \ is retrieved\n* **currentcontext**: the current context in which the thread\
    \ is executing is retrieved\n* **executioncontext**: the `executioncontext` object\
    \ contains information about different contexts\n* **name**: gets or sets the\
    \ name of the thread\n* **threadstate**: the value containing states of the current\
    \ thread\n* **priority**: it gets or sets the value showing the scheduling priority\
    \ of a thread\n\n### Methods:\n\n* `public static void beginthreadaffinity()`:\
    \ the host is to out to execute instructions depending on the current physical\
    \ operating system thread.\n* `public void abort()`: the threadexception is raised\
    \ in the thread on which it is invoked.\n* `public void interrupt()`: the thread\
    \ present in the waitsleepjoin state is interrupted\n* `public static appdomain\
    \ getdomain()`: a unique domain identifier is returned\n* `public static void\
    \ memorybarrier()`: the processor executes the current thread. The instructions\
    \ cannot be reordered. \n* `public void start()`: it starts the thread\n* `public\
    \ static object yield()`: the calling thread to yield execution to another thread\
    \ which is ready to run the processor\n\n# Creating and managing threads\n\nThe\
    \ extended thread class creates a thread. The extended thread class calls the\
    \ `start()` method to start the child thread execution. \n\nExample:\n\n```csharp\n\
    Using system;\n\nUsing system.threading;\n\nNamespace multiplethread\n{\n\nClass\
    \ threadprogram\n{\n\nPublic static void callchild()\n{\n\nConsole.writeline(\"\
    start thread\");\n}\n\nStatic void main(string[] args)\n{\n\nThreadstart child1\
    \ =new threadstart(callchild);\n\nConsole.writeline(\"creating child thread\"\
    );\n\nThread child2 =new thread(child1);\n\nChild2.start();\n\nConsole.read();\n\
    \n}\n\n}\n```\nOn compiling and executing the code, the output is:\n`Start thread`\n\
    `Creating child thread`\n\n# Managing threads\n\nWhen there is a need to pause\
    \ a thread for a period of time that another thread can execute, the `sleep()`\
    \ method is used. The method takes a single argument in milliseconds.\n\nExample:\n\
    \n```csharp\nUsing system;\n\nUsing system.threading;\n\nNamespace threaddemo\n\
    {\n\nClass threadprogram\n{\n\nPublic static void childthread()\n{\n\nTry\n{\n\
    \nConsole.writeline(\"child thread started\");\n\nFor(int j = 0; j <= 10; j++)\n\
    \n{\n\nThread.sleep(1000);\n\nConsole.writeline(\"child thread finished\");\n\n\
    }\n\n}\nCatch(threadexception e)\n{\n\nConsole.writeline(\"exception caught\"\
    );\n}\n\nFinally\n{\n\nConsole.writeline(\"exception is not handled\");\n}\n}\n\
    \nPublic static void main()\n{\n\nThreadstart t1 =new threadstart(childthread);\n\
    \nConsole.writeline(\"creating child thread\");\n\nThread t2 =new thread(t1);\n\
    \nT1.start();\n\n//main thread is stopped\nThread.sleep(2000);\n\n//child thread\
    \ aborted\nConsole.writeline(\"aborting child thread\");\n\nT2.abort();\n\nConsole.read();\n\
    \n}\n\n}\n```\nThus, the output is:\n`Creating child thread`\n`Child thread started`\n\
    `0`\n`1`\n`aborting child thread`\n`Exception caught`\n`Exception is not handled`\n\
    \n# Chapter 21: event\n\nAn event is something that is expected to happen. In\
    \ c#, events are user actions like click, key press, mouse movements or occurrences\
    \ such as system-generated notifications(148). An application should respond to\
    \ events once they occur. A good example is the occurrence of an interrupt. Events\
    \ are used to facilitate inter-communications.\n\nEvents are declared in a class\
    \ and associated with an event handler via delegates in the same class or another\
    \ class. The class with the event is used for publishing the event. Such is known\
    \ as the publisher class. The class accepting the event is known as the subscriber\
    \ class. This means that events rely on a publisher-subscriber model.\n\nThe publisher\
    \ is the object with the definition of the event and the delegate. The association\
    \ between the event and the delegate is defined in this object. An object of the\
    \ publisher class invokes the event which is in turn notified to the other objects.\n\
    \n## Event declaration\n\nFor an event to be declared inside a class, you should\
    \ first declare a delegate type for the event. It is after this that you can declare\
    \ the event using the `event` keyword(149). Here is an example:\n\n```csharp\n\
    public delegate void myevent();\n\npublic event myevent myevent;\n```\n"
