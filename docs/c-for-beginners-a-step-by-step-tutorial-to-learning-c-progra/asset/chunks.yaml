    \           Console.WriteLine(\"the area of the figure is: {0}\", calculatearea());\n\
    \        }\n    }//end the figure class\n\n    Class runfigure {\n        Static\
    \ void main(string[] args) {\n            Figure f = new figure();\n         \
    \   F.length = 5.4;\n            F.width = 3.2;\n            F.show();\n     \
    \       Console.readline();\n        }\n    }\n}\n```\n\n### protected 访问修饰符\n\
    \n这种 `protected` 访问修饰符使得子类能够访问基类中定义的成员函数和变量。这将在继承中讨论。\n\n### internal 访问修饰符\n\n\
    这种 `internal` 访问修饰符允许在定义它的程序集（assembly）内的任何代码访问该成员。\n\n"
- fmt: "\nWith inheritance, it is possible for a programmer to define one class in\
    \ terms of another class. This also makes it possible for us to reuse code and\
    \ shorten the time taken to implement an application.\n\nDuring the creation of\
    \ a class, instead of having to create completely new member functions and data\
    \ members, the programmer is able to designate that the new class inherits the\
    \ members of an already existing class. The base class is the name for the existing\
    \ class while the new class is known as the derived class.\n\nInheritance is simply\
    \ an implementation of is-a relationship. For example, cow is a mammal.\n\nIt\
    \ is possible for a class to inherit from more than one class or interfaces, meaning\
    \ that it can inherit data and functions from many base interfaces or classes.\
    \ The following example demonstrates the concept of the base and derived class:\n\
    \n```csharp\nUsing system;\n\nNamespace inheritanceapp {\n\nClass figure {\n\n\
    \    Public void setwidth(int wid) {\n        Width = wid;\n    }\n\n    Public\
    \ void setheight(int heig) {\n        Height = heig;\n    }\n\n    Protected int\
    \ width;\n\n    Protected int height;\n}\n\n// a derived class\nClass rectangle:\
    \ figure {\n    Public int calculatearea() {\n        Return (width * height);\n\
    \    }\n}\n\nClass testinheritance {\n    Static void main(string[] args) {\n\
    \        Rectangle r = new rectangle();\n        R.setwidth(6);\n        R.setheight(8);\n\
    \        // print the rectangle's area.\n        Console.writeline(\"the area\
    \ is: {0}\", r.calculatearea());\n        Console.readkey();\n    }\n}\n\n}\n\
    ```\n\nThe code should return the following output:\n\n![00189.jpg](images/00189.jpeg)\n\
    \nWe have defined the `figure` class with two properties namely `width` and `height`.\
    \ This class also has two methods, `setwidth()` and `setheight()`. We have then\
    \ defined a class named `rectangle`. Notice the syntax we have used to create\
    \ this class:\n\n`Class rectangle: figure {`\n\nThe use of the full colon signals\
    \ that the `rectangle` class is inheriting the `figure` class. The `rectangle`\
    \ class only has one method, the `calculatearea()` method. However, since it has\
    \ inherited the `figure` class, it means that it has all the properties of the\
    \ `figure` class, like the `width` and the `height`.\n\nWe have then created the\
    \ `testinheritance` class. Within the method `main()`, an instance of the `rectangle`\
    \ class has been created and given it the name `r`. We have used this instance\
    \ to access the properties that have been defined in the `rectangle` and the `figure`\
    \ classes. That is how powerful inheritance is!\n\n### Base class initialization\n\
    \nThe derived class inherits the methods and variables defined in the base class.\
    \ This means that we should create the superclass before creating the subclass.\
    \ Inheritance for initialization of the list of members is demonstrated in the\
    \ program given:\n\n```csharp\nUsing system;\n\nNamespace inheritanceapp {\n\n\
    Class object {\n// the member variables\n    Protected double width;\n\n    Protected\
    \ double length;\n\n    Public object(double len, double wid) {\n        Width\
    \ = wid;\n        Length = len;\n    }\n\n    Public double calculatearea() {\n\
    \        Return length * width;\n    }\n\n    Public void show() {\n        Base.show();\n\
    \        Console.writeline(\"the width of the figure is: {0}\", width);\n    \
    \    Console.writeline(\"the length of the figure is: {0}\", length);\n      \
    \  Console.writeline(\"the area of the figure is: {0}\", calculatearea());\n \
    \   }\n}//end class figure\nClass carpet : object {\n    Private double cost;\n\
    \n    Public carpet(double len, double wid) : base(len, wid) { }\n\n    Public\
    \ double calculatecost() {\n        Double cost;\n        cost = calculatearea()\
    \ * 120;\n        Return cost;\n    }\n\n    Public void show() {\n        Base.show();\n\
    \        Console.writeline(\"the total cost for the carpet is: {0}\", calculatecost());\n\
    \    }\n}\n\nClass run {\n    Static void main(string[] args) {\n        Carpet\
    \ c = new carpet(7.5, 9.5);\n        C.show();\n        Console.readline();\n\
    \    }\n}\n\n}\n```\n\nThe code will return the following output:\n\n![00092.jpg](images/00092.jpeg)\n\
    \n### Multiple inheritance\n\nMultiple inheritance is not supported in c#. However,\
    \ with interfaces, it is possible for us to implement multiple inheritance. Consider\
    \ the following example:\n\n```csharp\nUsing system;\n\nNamespace inheritanceapp\
    \ {\n\nClass object {\n    Public void setwidth(int wid) {\n        Width = wid;\n\
    \    }\n\n    Public void setheight(int heig) {\n        Height = heig;\n    }\n\
    \n    Protected int width;\n\n    Protected int height;\n}\n\n// paintcost for\
