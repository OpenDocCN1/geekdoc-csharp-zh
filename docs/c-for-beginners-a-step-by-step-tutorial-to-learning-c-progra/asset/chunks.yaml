  trans: "\n这是 “for” 循环的最后部分。基本上，更新语句会更新循环的计数器。让我们使用上面的代码片段：\n\n```c\nfor (int sample\
    \ = 10; sample > 1; sample--)\n{\n    // this is the loop’s body.\n}\n```\n\n\
    程序在运行循环体后执行此部分。请记住，该语句会更新计数器的值。\n\n### 循环体\n这部分由 c# 语句组成。它可以利用你在循环初始化部分声明的变量。查看下例所示：\n\
    \n```c\nfor (int sample = 10; sample > 1; sample--)\n{\n    Console.WriteLine(sample);\n\
    }\n```\n\n### continue 运算符\n在某些情况下，你需要停止当前的迭代但不结束循环本身。你可以使用 c# 中名为 “continue”\
    \ 的运算符完成此任务。下面的示例将说明该运算符是如何幅工作的：\n\n![00049.jpg](img/00049.jpeg)\n\n这段代码计算范围（1\
    \ 到 n）内所有被 7 整除有余数的奇数总和。\n\n### “foreach” 循环 (116)\n最近，c# 引入了 “foreach” 循环的概念（即扩展\
    \ “for” 循环）。这种循环概念也存在于其他编程语言中，如 c, v, c++, php 等。通过这个编程工具，你可以运行列表、数组或其他值组中的所有元素。“foreach”\
    \ 循环即使对于非索引数据组，也能获取所有现有的元素。\n\n在编写此类循环时，使用以下语法：\n\n```c\nforeach (type name_of_variable\
    \ in name_of_group)\n{\n    The_statements;\n}\n```\n\n如你所见，这种循环比典型的 “for” 循环简单得多。“foreach”\
    \ 循环可以帮助你快速扫描集合中的所有对象。无数程序员在编写代码时使用这种循环，这并不奇怪。\n\n### 嵌套 for 循环\nC# 允许你将一个 “for”\
    \ 循环放在另一个 “for” 循环内部。代码最内层的循环运行次数最多。而最外层部分的循环重复次数最少。在“嵌套” for 循环时，你应该使用以下语法：\n\
    \n```c\nfor (initializing_fragment, condition, update_statement)\n{\n    for (initializing_fragment,\
    \ condition, update_statement)\n    {\n        Statements\n    }\n}\n```\n\n在这里，程序运行初始的\
    \ “for” 循环，执行其体并触发嵌套循环。程序将检查第二个循环的条件并执行其内部的代码，直到评估为假。然后，程序将对循环计数器进行必要的调整。程序将重复整个过程，直到所有条件都为假。\n\
    \n## 第 9 章：方法\n本章将重点介绍方法。在这里，你将学习如何在程序中声明和利用方法。你需要记忆本章包含的课程才能成为一名有效的程序员。\n\n###\
    \ 方法基础\n对于大多数程序员来说，方法是任何程序的核心方面。方法可以解决问题、接受用户输入（称为参数）并产生结果。方法简单来说是为了执行共同任务而组合在一起的一组语句。每个\
    \ c# 类至少有一个方法，即主方法。要使用方法，你必须先定义它，然后调用它来执行其预期的操作。方法完成代表程序所执行转换的任务。此外，方法是完成实际的区域区域。程序员将方法视为任何计算机程序的基本单元的主要原因。\n\
    \n### 方法提供的优势\n在本节中，你将发现方法提供的主要优势。阅读这些材料后，你将知道为什么在编写程序时应该使用这些工具。\n\n####结构和代码可读性\n\
    编程专家声称，在编写计算机程序时应该使用方法。即使是最简单的方法也可以提高你的 c# 代码的结构和可读性。这里有一个你需要知道的重要事实：程序员花费 20%\
    \ 的时间编写和检查他们的计算机程序。剩下的 80% 时间用于维护和改进软件。显然，如果你的代码具有可读性且结构良好，处理你的程序将变得轻松。\n\n###\
    \ 防止冗余代码\n方法可以帮助你避免程序中的冗余代码。冗余或重复的代码通常会在计算机应用程序中产生不理想的结果。\n\n#### 代码重复之后\n如果你的程序需要多次使用某个代码片段，将该片段转移到\
    \ c# 方法中是一个极好的主意。你可以多次调用方法，这意味着你可以重复代码。\n\n### 声明、实现和调用方法 (17)\n方法定义简单来说是对方法的声明。以下是\
    \ c# 中方法的语法：\n\n`<access_specifier><data_type_of_the_result><name_of_method>(list_of_parameters)`\n\
    {\n    method_body;\n}\n\n此时，你需要知道你可以执行的过程。这些是：\n- **声明**：在此过程中，你把方法链接到程序中。\n\
    - **实现**：这涉及输入代码来完成方法。\n- **调用**：这是调用方法的过程。在这里，你将使用方法解决问题。\n\n### 方法声明\n在 c# 中，你需要在类内部声明方法。此外，不允许“嵌套”方法（即在另一个方法内部编写方法）。此点的完美例子就是使用过多次的\
    \ `main()` 方法。\n\n```c\nclass declaringmethods\n{\n    static void main()\n  \
    \  {\n        Console.WriteLine(\"hi c#!\");\n    }\n}\n```\n"
- fmt: "\nC# doesn’t require you to include parameters in your declarations. That\
    \ means you can leave the parentheses empty (e.g. `Main()`).\n\n## The method’s\
    \ name\n\nYou need to indicate the method’s name during declarations, invocations,\
    \ or implementations. Here are the rules that you need to remember when naming\
    \ your methods:\n\n* make sure that the initial letter is in uppercase.\n* begin\
    \ each word with an uppercase letter (e.g. `Samplemethod`, `newmethod`, `mainline`,\
    \ etc.).\n* use verbs and nouns as names of your methods.\n\n**Important note:**\
    \ the rules discussed above are completely optional. Follow these rules if you\
    \ want to have excellent structure and readability in your C# codes.\n\n## Method\
    \ implementations\n\nDeclaring a method isn’t enough. You also, need to implement\
    \ your methods if you want them to run inside your programs. Programmers use the\
    \ term “body” when referring to the implementation of a method.\n\n### The body\n\
    \nYou’ll find the method’s body inside a pair of curly braces. This body consists\
    \ of commands, expressions, and statements that you want to execute. Thus, the\
    \ body is an important part of any method.\n\n**Important note:** keep in mind\
    \ that you cannot nest methods in C#. Don’t write methods inside other methods.\n\
    \n### Method invocations\n\nAsically, this is the process of running the statements\
    \ within the method’s body. Invoking a method is easy and simple: you just have\
    \ to, indicate its name, add a pair of curly braces, and terminate the line using\
    \ a semicolon. Here’s the syntax that you should use:\n\n`Name_ofmethod();`\n\n\
    The sample code given below will show you how to invoke a method:\n\n```csharp\n\
    Class animals\n{ \n    static void main()\n    {\n        Console.writeline(\"\
    i love dogs.\");\n    }\n}\n```\n\nIf you’ll compile and execute that code, your\
    \ command prompt will print the following message:\n\nI love dogs.\n\n## The places\
    \ where you can invoke a method\n\nC# allows you to invoke methods in the following\
    \ areas:\n\n* inside the program’s main method (i.e. `Main()`).\n* inside another\
    \ method.\n* inside the method’s own body. This technique is called “recursion”.\n\
    \n### Recursive method call(119)\n\nIt is possible for a method to call itself.\
    \ This process is referred to as recursion(120). Consider the factorial example\
    \ given below:\n\n```csharp\nUsing system;\n\nNamespace methodapplication {\n\
    \    Class numerchecker {\n        Pulic int factorial(int x) {\n            /*\
    \ declaring a local variale */\n            Int answer;\n            If (x ==\
    \ 1) {\n                Return 1;\n            } else {\n                Answer\
    \ = factorial(x - 1) * x;\n                Return answer;\n            }\n   \
    \     }\n        Static void main(string[] args) {\n            Numerchecker n\
    \ = new numerchecker();\n            //let's now call the factorial method\n \
    \           Console.WriteLine(\"factorial of 8 is : {0}\", n.factorial(8));\n\
    \            Console.WriteLine(\"factorial of 9 is : {0}\", n.factorial(9));\n\
    \            Console.readline();\n        }\n    }\n}\n```\n\nWe have created\
    \ the function and instance of the class named `n`. The code will return the result\
    \ given below: ![0150.jpg](images/0150.jpeg)\n\nThe code was ale to give us the\
    \ factorial of 8 and 9. Note that the factorial of a number of all the numbers\
    \ except 0. For example, the factorial of 8 is 1*2*3*4*5*6*7*8, which gives 40320\
    \ as shown in the above result.\n\n## Passing parameters to methods(121)\n\nIf\
    \ a method was defined with parameters, then parameters should passed to it during\
    \ the call. Three methods can be used for passing parameters. Let us discuss these\
    \ methods.\n\n### Pass value\n\nThis method involves copying the actual value\
    \ of an argument to the formal parameter. This is the default mechanism of passing\
    \ parameters. With this mechanism, when calling a function, a new location is\
    \ created in the memory for every value parameter. The values for the actual parameters\
    \ are then copied into them. This means that the changes that are made to the\
    \ parameter inside the method will have no effect on the argument.\n\nLet us demonstrate\
    \ this an example:\n\n```csharp\nUsing system;\n\nNamespace methodapplication\
    \ {\n    Class numerchecker {\n        Pulic void swap(int a, int ) {\n      \
    \      Int temp;\n            Temp = a; /* saving the value of a */\n        \
