    # How to format codes properly


    Some rules to follow when formatting your codes include:

    * you may indent methods within the class definition. C# allows you to use any
    number of tab characters (i.e. The character you’ll get after hitting the tab
    key of your keyboard) when formatting source codes.

    * you should indent the method’s contents within its own definition.

    * place the opening brace (i.e. `{`) right under the class or method to which
    it belongs. Also, it would be best if it will the only character on its line.

    * make sure that the closing brace (i.e. `}`) is vertically aligned with the opening
    brace.

    * the names of your class should begin with an uppercase letter.

    * the names of your variables should start with a lowercase letter.

    * the names of your methods should begin with an uppercase letter.

    * indent codes that are written inside another code.


    ## Class names

    In c#, each program has one or more class definitions. Programmers often store
    each class definition inside a separate file that corresponds to the class’s name.
    Also, the extension of these files should be `.cs`. You can compile different
    classes into a single file without experiencing any technical problems. However,
    you’ll have a hard time navigating your codes.


    ## More information about c#

    The c# programming language is advanced, modern, multipurpose, and object-oriented.
    It has some similarities with other languages such as c++, and java. The main
    difference is that c# offers easier programming and simplified syntaxes. A c#
    program has one or more `.cs` files, which hold data types and definitions. You
    need to compile those `.cs` files to get executable codes (i.e. Files that end
    with `.dll` or `.exe`). For instance, if you compile the hello program, you’ll
    get an executable file named `hello.exe`.


    # The things you need to create c#

    Before you can write programs using c#, you need two important things—a text editor
    (e.g. Notepad) and the framework. The text editor will help you in writing and
    editing codes. The framework, on the other hand, will help you in compiling and
    executing programs.


    ### What is .net?

    Technically, .net is a framework designed for the development and execution of
    computer programs. Most of the modern windows systems have .net as a built-in
    framework. Thus, you won’t have to install any software onto your computer if
    you are using microsoft’s modern operating systems. If you are using an old windows,
    you need to download the framework first. You may go to this [site](http://microsoft.com)
    and get the most recent version of .net. Important note: make sure that your computer
    has .net before reading the rest of this book. Otherwise, you’ll have problems
    compiling and executing the sample programs you’ll see later.


    ### Text editors

    You should use a text editor to write, edit, and save source codes. You can use
    any text editor installed on your computer. If you don’t want to download additional
    programs, you may simply use “notepad” (i.e. The pre-installed text editor of
    windows computers).


    ### Compiling and executing programs

    The actions you need to include:

    1. Generate a `.cs` file and name it as `hello.sharp`.

    2. Write the source code inside that `.cs` file.

    3. Compile the code to get a `.exe` file.

    4. Run the resulting program.


    Turn on your computer and let’s start writing some codes. Important note: this
    book assumes that you are using a windows computer.


    ## Chapter 3: demystifying data types

    Now let’s talk about data and the different types you will see in c#, which we
    have three basic categories of. These categories are value and reference types.
    If you are familiar with programming, you are definitely familiar with the different
    types of values that can associated with data types.


    ### Attributes

    Data types have the following attributes: own* name (e.g. `Int`, `char`, `bool`,
    etc.)

    * size (e.g. 1 byte)

    * default value (e.g. 1, 2, 3, etc.)


    ### The different types of data in c#

    C# supports the following data types:

    * `boolean`

    * `characters`

    * `objects`

    * `floating-point`

    * `decimals`

    * `integers`

    * `strings`


    Since these data types are pre-installed into the c# language, programmers refer
    to them as “primitive types”.


    ### Value types of data

    Value types of data are, as the name suggest, data types that consist of the value
    themselves. These are terms like `boolean` byte or `int`. A good test to run within
    your virtual environment is to get the size of a given data type using the term
    `sizeof(type)`, only replace type with the data type you wish to know the size
    of. A complete list of the value data types are `decimal`, `double`, `bool`, `float`,
    `char`, `byte`, `long`, `system`, `short`, `uint`, `int`, `ushort` and `ulong`.


    Within reference type of data, we are looking at (you probably guessed it!) A
    reference to a type of data. These types of data are able to tell you where memory
    is located. There can even be multiple references to multiple variables. This
    type of data, we are looking at `string`, `dynamic` and `object` as our keywords
    to describe the reference data types.

