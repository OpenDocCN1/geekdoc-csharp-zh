    We used the setter methods to set the values of the various attributes of our
    two cues. The getvolume() function has been called to calculate the volumes of
    the two cues.


    # Constructors


    A constructor is simply a special member function of a class that is run anytime
    we create new objects of the class. A constructor assumes the class name and it
    should not have a return type. The following example demonstrates how to use a
    constructor in c#:


    ```csharp

