    , dec);\n    }\n}\n```\n\n`displayhelper` 是一个发布者类，负责发布 `eredisplay` 事件。在每个显示方法之后，它会首先检查\
    \ `eredisplayevent` 是否不为空，如果不为空，则会调用 `eredisplayevent()` 方法。\n\n现在我们需要创建一个订阅者。请考虑下面的类：\n\
