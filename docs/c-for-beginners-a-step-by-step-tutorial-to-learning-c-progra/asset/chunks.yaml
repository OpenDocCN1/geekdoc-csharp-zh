    C# 是一种强类型语言；因此，它要求你在每次声明变量时都要指明数据类型。让我们来探索一些常见的数据类型及其工作原理：


    1. `bool`——这是一种简单的数据类型。它只接受两个值：true（真）或 false（假）。你需要使用 `bool`（即一个 C# 关键字）来声明这种数据类型。布尔值的结果只可能是
    `true` 或 `false`。在 C# 编程语言中，布尔值会被自动设置为 `false`。程序员使用这种数据类型来存储逻辑语句的结果。在使用像 `if`
    语句这样的逻辑运算符时，它非常实用。

    2. `Int`——代表整数。它是一种用于存储不带小数数值的数据类型。它是数字中最流行的数据类型。在 C# 中，根据要存储的数字的大小，整数还有好几种不同的数据类型。

    3. `String`——这用于存储文本，即字符序列。C# 字符串是不可变的，这意味着一旦创建了字符串，你就无法更改它。如果你使用更改字符串的方法，字符串本身不会发生改变，而是会返回一个新的字符串。

    4. `Char`——这用于存储单个字符。你需要使用 `char`（即另一个 C# 关键字）来声明这种类型。在一对单引号内编写你的 `char` 值（例如
    ''i''）。

    5. `Float`——这是一种用于存储带有小数数值的数字的数据类型。


    ### 对象 (Objects)


    程序员将对象视为 C# 语言中是最特殊的数据类型。基本上，对象充当 `.net` 中其他数据类型的父类。这种数据类型在声明时需要 `object` 关键字，它可以接受来自其他数据类型的任何值。你可以将对象视为指向你计算机内存某些部分的地址。


    #### 实数类型 – 浮点 (Real type – floating points)


    在 C# 语言中，“实数类型”指的是你在数学中学过的实际数字。浮点实数类型可以是 `float` 或 `double`。


    1. `Float`——程序员将这种子类型称为“单精度实型”。`float` 数字的默认值为 `0.0f`（末尾的 `f` 不区分大小）。字母 `f` 表示该值是一个
    `float`。

    2. `Double`——程序员在提到这种类型时使用“双精度实型”一术语。它的默认值为 `0.0d`（即末尾的字母 `d` 不区分大小）。系统会自动将实数标记为
    `double`，所以你实际上不需要在值的末尾添加 `d`。


    #### 实数类型 – 小数 (Real type – decimals)


    这种编程语言支持“小数运算”，这是一种使用小数来表示数字的数学方法。这种方法无论处理什么数值都能保持其准确性。C# 使用 `decimal` 类型来表示这种实数。这种数据类型为
    128 位，并精确到小数点后第 29 位。由于其卓越的准确性，程序员使用这些类型进行财务计算（例如：支付、利息等）。


    #### 整数 (Integers)


    这种数据类型由 8 类型组成，它们是：


