    You need to name your variables before using them. The variable’s name serves
    as an identifier: it helps the program in locating and specifying the variable.
    C# allows you to choose variable names freely. However, just like any other language,
    C# has some rules regarding variable names. These rules are as follows:


    - You may use an underscore (i.e. `_`), letters, and numbers to create a variable
    name.

    - You can’t use a number to start the name. Thus, `firstsample` is valid while
    `1stsample` is not. Camelcase for local variables, such as `cost`, `orderdetail`,
    `dateofirth`, and `firstname`.

    - You can’t use C# keywords in naming your variables. This simple rule prevents
    compilation and runtime errors in your programs. If you really want to use keywords
    for your variables, you may begin the name using the `@` symbol (e.g. `@oal`,
    `@int`, `@char`, etc.).

    - A meaningful or descriptive name that is neither too long nor too short to identify
    the information stored in a variable just by looking at it.

    - Can contain the letters `a–z` and `A–Z`, the numbers `0–9`, and the underscore
    `_` character—other symbols are not allowed.

    - No spaces and cannot start with a number.


    ### Valid names

    - `cost`, `name`, `order`, `order1`, `_order1`, `income`

    - `order_detail`, `orderdetail`, `dateofirth`, `hourlyrate`, `firstname`, `first_name`,
    `isvalid`


    ### Invalid names

    - `1` (number)

    - `class`, `while`, `if`, `protected` (keyword)

    - `1order`, `1name` (starts with a number)


    ### How to declare a variable

    You should declare a variable before using it. When declaring a variable:


    1. Specify the variable’s data type (e.g. `Char`)

    2. Specify the variable’s name (e.g. `Sample`)

    3. Set the variable’s initial value. This step is completely optional.


    The format for variable declarations is:

    `Data_type name = initial_value;`


    Here are some samples of valid variable declarations:


    ```

    Int year = 2000;

    String name = username;

    Char c = test;

    ```


    Important note: you need to end each of your C# statements using a semicolon.
    If you’ll forget to add even a single semicolon character, your programs will
    generate undesirable andor unexpected results.


    ### How to assign a value

    Just like any other computer language, C# allows you to assign a value to a variable.
    This process, known as “value assignment”, requires you to use the equals sign.
    Programmers refer to this symbol as the “assignment operator”. Write the variable’s
    name on the left side of the operator. Then, specify the value you want to assign
    on the other side. Check the following examples:


    ```

    Test = x;

    username = "john";

    ```


    ### How to initialize a variable

    In programming, “initialization” is the process of assigning a value to a new
    variable. Thus, you’ll set this “initial value” while declaring a variable.


    #### The default value of a variable

    If you don’t assign any value for variable, C# will perform automated initialization
    (i.e. It will assign a default value to the empty variable). The following tales
    will show you the default value of each data type:


    ![0048.jpg](images/0048.jpg)


    The code given will show you how to declare variables and assign values.


    ```

    years = 10;

    days = 31;

    pi = 3.14;

    isempty = true;

    sample = x;

    animal = "dog";

    ```


    Important note: lines that begin with two forward slashes (i.e. `//`) are “comments”.
    In programming, comments are descriptive text added to the code to improve readability.
    Language compilers ignore these lines. Thus, comments don’t affect the functionality
    of your programs.


    #### Creating an identifier

    If you look through some of the suggestions that come with Microsoft, you will
    find that they recommend that you use camelCase when you are working with variables,
    and it will recommend that you work with PascalCase when you want to work with
    methods. Working with camelCase will mean that you will keep the first letter
    of your name as lowercase. If you are creating an identifier that has a compound
    word then you will make sure that the first letter of your second word will start
    with an uppercase letter: `paymentComplete`.


    #### Mathematics

    The PascalCase style will take things a bit differently. This notation style requires
    you to start the first word using an uppercase letter. The first letter in all
    of the other words in the sequence should also be written in uppercase as well.
    Some examples of using PascalCase include:


    ```

    WriteLine()

    readline()

    Start()

    main()

    ```


    When it comes to naming these identifiers, you can work with numbers and underscores
    as well. But, if for some reason you can’t begin the name of these identifiers
    with a number, you can write out something like sevenooks, but you can’t write
    out ‘7ooks’. Now, these notations are not required, and you can change them around
    as much as you would like. But this is a practice.


    ### Definite assignment

    C# enforces a definite assignment. This means that you need to initialize the
    variable with a value before it. Suppose the following is written:


    ```

    Console.WriteLine(name);

    ```

    Error: use of unassigned variable ‘name’


    If you try to use a variable that hasn’t been declared, your code won’t compile.
    In this case, the compiler will tell you something is wrong. Trying to use a variable
    minus having a value assigned also causes an error.


    In order to initialize the variable with a value, you simply have to use the assignment
    operator `=`. The variable name is located to the left side of the operator and
    on the right side is the value in the following manner:


    ```

    Test = x;

    username = "john";

    ```


    On declaring a variable with a type, it cannot be redeclared with a new type,
    and it cannot be assigned a value that is not compatible with its declared type.
    For example, you cannot declare an int and then assign it a boolean value of true/false.


    ```

    Age = true;

    ```

