- "# C# 入学者指南：从零开始学习 C# 编程逐步步进教程\n\n\n\n\n\n\n\n\n\n\n\n\n\n## 引言\n尽管学习一门新语言并非易事，但本书的目标是让你尽可能快地上手并理解。其目标是为你提供完整且全面的技能，帮助你记住重要的知识，并引导你在\
  \ `c#` 中的编程和实践。为了让你以最高效的学习，我希望你也能进行相应的实践。\n\n本书将介绍 `c#` 的基础描述，并最终提供一些实用的提示和资源，帮助你应对可能需要的地方。尽管这本书并非仅仅是一本向你介绍编程艺术的入门手册，但对于熟悉其他语言的人来说，它将非常有价值。尽管我为你提供了信息和基础技能，但将这些技能付诸实践取决于你自己。我强烈建议你找到一种严格的习惯来帮助自己，包括研究、学习并在自己的环境中练习以熟悉这些技能。俗话说，你可以把马引到水边，但不能迫它喝水！\n\
  \n我可以为你提供知识和资源，但合成并使用它们创建你自己的程序和代码取决于你自己。\n\n对于像 `c#` 这样面向对象且结构化的语言，我认为你会发现它是容易学习且友好的。这种高级语言在某些方面构建并补充了\
  \ `c` 和 `java` 语言。然而，即使你是这些语言的大师，这项新任务也有陡峭的学习曲线。对于所有编程语言来说，了解它们在基础和功能层面的运作是有帮助的。在书中，我鼓励你运用你的知识和直觉。\n\
  \n## 第一章：什么是 c#\n你来到这里并购买这本书是为了学习如何成为一名 `c#` 程序员。在本书中，你将学习如何在编程项目中应用 `c#` 的基本规则。`C#`（读作\
  \ \"see sharp\"）是一种由微软设计和开发的面向对象的编程语言。\n\n这是一门相当新的语言，被认为具有很强的功能性和面向对象的特性。尽管 `c#`\
  \ 绝对不是 `c` 或 `c++` 语言，但这些语言之间确实某些相似之处，拥有其中一种或两种语言的见解或经验被认为是有帮助的。对于所有编程语言来说，了解它们在基础和功能层面的运作是有帮助的。在书中，我鼓励你运用你的知识和直觉。\n\
  \n\n\n\n这种特殊的语言源于程序员安德斯·海尔斯伯格（Anders Hejlsberg），他是微软 .net 框架开发团队的成员。尽管有些人倾向于批评 `c#`\
  \ 是对 Java 的某种“抄袭”，但在本学习手册的课程，你会发现（如果你有 Java 知识的话）该语言的内容和结构上存在明显的区别，这使其与众不同。\n\n\
  它的设计是针对一个能够使用高级语言并由可执行代码组成（也称为通用语言基础设施或 CLI）的环境，因此它吸引了许多对这种易学语言感兴趣的人。\n\n它将效率作为其核心目标之一，因此使用它有许多优势。在本书中，我将向你介绍如何轻松掌握这种面向对象的语言，并将其作为你使用的一门新语言。\n\
  \n作为一种结构化语言，你可以依靠在 `c#` 语言中进行编程和编码来获得高效的结果。我将帮助你优化性能，以便让你投入在该语言中编程和编码的努力能够获得预期的输出。\n\
  \n尽管 `c#` 是使用微软平台开发的，但该语言本身不仅限于它。`c#` 的另一个伟大概念是，这种多功能性允许你将面向对象的语言带到不同的平台，创建多维度且可用的程序和软件。\n\
  \n我确定你熟悉其他语言，语言的某些方面有助于实现某些预期结果。在本学习 `c#` 的指南中将涵盖许多优势，这些优势有助于用户处理可移植性、类型、元编程、属性、内存访问以及方法和函数——以及我们将在后续章节中讨论并展示示例的许多其他积极属性。\n\
  \n这门语言自 2002 年以来才有正式版本，因此可以被认为是一门较新的编程语言。然而，不要让这让你认为它不能且不会与 Java 这样历史稍久一点的语言竞争。\n\
  \n这门语言的开发者确实目标是改进并添加不同的功能，最初专门为 .net 框架设计的许多功能现在得到了扩展，并在许多功能上取得了成功——许多人往往喜欢的是它所使用的语法。这种语言有可能被用于专注于游戏性开发。对于玩家来说，游戏不仅要有趣并吸引人的注意力，他们还希望体验本身是享受的。由于你本身已经算是一个程序员（或者至少欣赏计算机的能力），在读完这本书后，我预计你将非常理解程序员为了创造你作为终端用户所拥有的体验而付出了多少努力。尽管我不认为这本书能让你创造出一个精通的游戏（你还需要大量的练习！）——但我相信你将在更大程度上理解在处理编程和设计的许多组件时至关重要的概念。在整本书中请记住，你正在通过这种语言中的编码和编程技能创建并微调一个可能无尽的世界。面向对象的组件确实有助于强化这一观点。\n\
  \n在接下来的章节中，你将学习 `c#` 如何以及为什么对你非常有用，以及你如何在不到一个月内轻松学会并精通所有基础知识。\n\n凭借一个与其他任何语言竞争的标准库，在本书结束时你将知道如何找到可能需要的源代码并执行它，以产生相当一致且精致的结果。这门语言的另一个优点是环境整洁，这深受许多人的青睐，此外与\
  \ Windows 的集成允许你轻松访问这一最流行的操作系统之一。\n\n关于在本章对 `c#` 是什么非常简单解释的最后一点，我只想说明几个在整个过程中良好的记住的编程和编码通用概念。\n\
  \n首先，请记住计算机没有直觉。这意味着它们将完全按照你指示的执行任务。计算机不会像人类那样从你的代码中推断出信息。当你遇到任何困难时，始终记住这一点。\n\n\
  此外，请记住，间距上的微小错误或错误的字母可能会导致很多头疼。如果你遇到了一个看似无法逾越的僵局——也许你需要快速休息一下，然后回来再次查看你的代码。\n\n\
  有时，当我们盯着屏幕看久了，无法看到自己的错误。\n\n最后，请记住，你不是第一个遇到困难的人，也不会是最后一个。本书的最后一章将是关于有用资源和提示的指南，以解决你在未来学习过程中可能遇到的任何问题。\n\
  \n这本书为你学习 `c#` 设定了预期。我鼓励你完全按照这种方式尝试学习。对你来说，不要在短时间内被过多的内容淹没是非常重要的。\n\n相反，不要让在回到工作之前流逝太长的时间。你可能会忘记那些可能让你抓狂的细微差别。\n\
  \n## 第 2 章：详细概述\n\n由于你是一个初学者，我们希望专注于建立一个坚实的基础，让你对 `c#` 的基础知识有一个全面的认识。\n\n\n\n\n\
  本质上，在第一周结束时，你将牢掌握 `c#` 环境、程序结构、基础语法和数据类型、类型转换、变量、常量和操作符。如果你不熟悉所使用的术语或方法，我会尝试对这些术语进行快速、基础的回顾。如果这不能唤起你的记忆，你可能需要通过\
  \ Google 或或其他资源寻找快速的复习。我还想推荐一个免费的交互式 Shell 程序供你尝试——[`www.tutorialspoint.com/compile_csharp_online.php`](https://www.tutorialspoint.com/compile_csharp_online.php)，这应该帮助你完成书中包含的任何训练练习。\n\
  \n### 环境\n\n如所示，`c#` 被开发者设计之初是为了与微软和 .net 框架集成。正如人们所料的，这对你在 `c#` 中发现的环境有很大影响。理解\
  \ `c#` 的重要部分在于理解它们是如何相互作用的。首先，这里是 net framework 的简要概述，帮助你更好地理解它们之间的相互作用。\n\n正如名称后半部分“framework（框架）”所示，net\
  \ framework 是一个可以运行应用程序的平台。net framework 是由微软开发的一个软件开发平台。该框架是为了开发可以在 Windows 平台上运行的应用程序而创建的。第一个版本于\
  \ 2002 年发布，名为 net framework 1.0。从那时起，该框架进行了多次更新以保持最新。\n\n我们可以使用 net framework 创建基于\
  \ Web 和基于表单的应用程序。我们还可以用它来开发 Web 服务。除了 `c#` 之外，net framework 还支持可视化编程语言。这意味着程序员可以选择使用哪种语言来开发他们的应用程序。\n\
  \n该框架可以帮助你编写三种不同类型的应用程序——Web 服务、Web 应用程序和 Windows 应用程序。当使用该框架应用程序时，实际上它可以被多种编程语言使用，因为它是一个多平台应用程序。从\
  \ Visual Basic、JScript、C++ 到 C#，多种语言都具有框架内相互通信的能力。该框架的另一个伟大特性是广泛的代码库，语言可以利用这些库来实现我们的目的，我们将在文中讨论\
  \ `c#`。\n\n任何语言或框架的伟大之处之一在于，你可以利用一个代码库的潜力。对于 net framework 和 `c#`，有一个巨大的库可以让你访问并利用进行编码。我总是给人们的一条建议是：虽然这些库是极好的资源，但要确保理解编码本身的原理和原因，以确保在出现问题时能够修复它。\n\
  \n微软本身还为用户提供了一个很棒的工具来协助他们的 `c#` 编程开发。该公司甚至免费提供两个优秀的工具，是编写从简单到复杂的任何类型应用程序的优质资源。我推荐的两个名称（因为它们是免费的！）是\n\
  \n如果这些选项不是你感到舒适或喜欢的，你始终可以使用文本编辑器来编写可能需要的源代码。我推荐其他选项，是因为我发现它们比简单的代码编辑器更有帮助。然而，许多人倾向于使用那种方法——这完全取决于你以及你对某个程序的熟悉程度。测试一下，看看哪种方法对你更有效。\n\
  \n你可以从一个名为 microsoft visual studio 的网站下载我提到的两个微软程序。\n\n最后，你还可以在 Linux 或 Mac 上运行\
  \ `c#`，这是跨平台编码的一项伟大能力。然而，为了实现这一点，你显然需要在非微软的框架在你的不同操作系统上运行。我推荐“mono”，它是一个可以在 Linux\
  \ 和 Mac 上使用的开源选项。\n\n掌握了环境的基础知识后，去下载或打开你想要熟悉的程序来开始你的编码过程吧。尝试玩玩软件——或者你可以对你的新知识睡一觉，然后在下一阶段开启你的项目！\n\
  \n### IDE（集成开发环境）\n\nIDE 是一个允许你编写程序的程序。大多数 net 开发者倾向于使用 Visual Studio。这个 IDE 允许你创建和运行应用程序。要使用它，你必须下载并安装它。你可以在\
  \ https://www.visualstudio.com/ 找到它。\n\n### 程序结构和基础语法\n\n现在我们已经了解了一些环境是如何创建的，让我们看看实际结构。当我们观察\
  \ `c#` 是如何构建时，我们看的是组成程序的 7 个基本组件。这些是命名空间声明、类、主方法、注释和表达式。现在，这些在编程和编码方面对你来说是什么样子的？我们为什么不拿这个“hello,\
  \ world”例子并将其拆分成部分来观察它的实际运行呢。\n\n```csharp\nusing system;\n\nnamespace HelloWorldApplication\n\
  {\n    class HelloWorld\n    {\n        static void main(string[] args)\n      \
  \  {\n            /* 我用极妙的 c# 写的第一个程序 */\n            Console.WriteLine(\"hello,\
  \ world\");\n            Console.ReadKey();\n        }\n    }\n}\n```\n\n![00121.jpg](img/00121.jpeg)\n\
  \n所以，希望这看起来对你有些熟悉，尽管你可能并不完全理解其含义，但你知道所有的符号和空格都是重要的。\n\n\n\n\n\n当我们使用 C# 时，第一行总是会包含\
  \ `using` 语句，尽管大多数情况下你会看到多个以 `using` 为关键字开头的语句。\n\nC# 的下一行将用作 `namespace`（命名空间）的声明。如果你不熟悉，我们可以认为\
  \ `namespace` 术语是特定类组或类集合的描述符。\n\n在我们的 hello world 示例中，我们将该短语视为类 `(helloworld)`。紧接命名空间行之后，你将看到类声明。该类将告知你该类的方法。\n\
  \n方法的一个典型特征是单个类中存在多个方法。熟悉给定类的方法非常重要，因为这样你就能更清楚地了解你正在处理的类的行为。在 hello world 示例中，我们只看了一个术语，即\
  \ `main` 方法。\n\n每个类都有一个 `main` 方法，你可以在类声明后的下一行找到它。本质上，当你查看这一行时，可以预期的 `main` 方法会告诉你当代码执行时会发生什么。这一点在\
  \ C# 程序中通常也被称为入口点（entry point）。当你看到后续行行中的 `/*...*/` 时，你看到的是会被实际编译器忽略的代码，而是作为注释添加到程序中的。\n\
  \n我们在此示例中查看的最后两个短语是 `Console.WriteLine(\"hello world\")` 和 `Console.ReadKey()`。这两行告诉系统显示你的消息，并控制程序运行和关闭的方式及时间。这些显然都是程序运行和功能作用的重要部分，你想要确保一些可能影响你编码的关键组件，仅仅是因为你可能会在英语语言中发现类似的语法类型错误。\n\
  \n要运行代码，只需点击运行/执行按钮或按 F5 键，项目就会执行。代码应该返回：\n\n![00140.jpg](img/00140.jpeg)\n\n代码以\
  \ `using` 语句开始。该语句的作用是将 `System` 命名空间添加到程序中。C# 程序通常有多个 `using` 语句。\n\n在下一行中，我们有一个\
  \ `namespace` 声明。`namespace` 来说是许多类的集合。在上面，我们有一个 `helloworld` 命名空间，其中包含 `hello`\
  \ 类。\n\n在下一行中，我们有一个类声明。`hello` 类拥有程序将使用的方法和数据。一个类有许多方法。方法的目的是陈述类的行为。然而，我们上面的 `hello`\
  \ 类只有一个方法，即 `main` 方法。\n\n在下一行代码中，我们有 `main` 方法的定义，它标记了所有 C# 程序的入口点。是 `main` 方法说明了执行类后发生了什么。接下来，我们有\
  \ `/*...*/` 行。这是一个注释，C# 编译器将忽略此行。该行仅用于提高人类读者代码的可读性。\n\n接下来是 `Console.WriteLine(...)`。`WriteLine`\
  \ 是属于 `System` 命名空间定义的 `Console` 类的方法。这一行将在屏幕上打印“hello world!”。最后，我们有 `Console.ReadKey();`\
  \ 语句。这一行是为 VS 用户准备的。这一行会让程序等待按键，防止程序从 Visual Studio 启动后屏幕闪过。\n\n除了从 Visual Studio\
  \ 运行程序，你还可以操作系统的命令提示符运行 C# 程序。遵循以下步骤：\n\n* 打开你的文本编辑器，并将上面的代码添加到其中。文本编辑器的一个示例是记事本（Notepad）。\n\
  * 将文件保存为 `helloworld.cs`\n* 启动操作系统的命令提示符，然后导航到你保存文件的目录。\n* 在提示符上输入命令 `csc helloworld.cs`\
  \ 然后按回车键编译代码。\n* 如果代码没有错误，命令提示符将带你进入下一行，然后生成文件 `helloworld.exe`。该文件包含可执行代码。\n* 在提示符上输入\
  \ `helloworld` 执行程序。\n* 输出 hello world! 将打印在屏幕上。\n\n你需要确保注意一个细微的区别（如果你熟悉 Java 的话），类名和程序文件名可以是不同的。此外，C#\
  \ 是区分大小写的，而且它们不是用句号或其他符号结束句子，而是使用分号 `;` 结束。此外，始终记住 `main` 方法是程序执行点。\n\n这四个组件对于避免编码时的错误非常重要。\n\
  \n此外，重要的是，在为类命名时，名称中的第一个字符只能是字母而不能是数字。尽管名称不能包含 C# 关键字。\n\n现在我们将稍微讨论一下 C# 的语法以及如何通过虚拟环境运行该示例。\n\
  \n```\nusing System;\n\nnamespace helloworld {\n    class hello {\n        static\
  \ void main() {\n            /* comment */\n            Console.WriteLine(\"hello\
  \ world\");\n            Console.ReadKey();\n        }\n    }\n}\n```\n\n\n\n\n\
  重要说明：请确保你的所有程序都经过了代码格式化。这样，你就可以保证代码的可读性。\n\n## C# 中不同关键字的解析\n\n关键字是特殊的预定义保留字，每个关键字都分配了唯一的含义。这些关键字可以被分类，以便更好地理解。以下是按类型分类的关键字列表。\n\
  \n### 1) 用于类、方法、字段和属性的关键字\n* `abstract`\n* `extern`\n* `internal`\n* `new`\n* `const`\n\
  * `override`\n* `protected`\n* `private`\n* `public`\n* `sealed`\n* `readonly`\n\
  * `static`\n* `virtual`\n* `void`\n\n### 2) 用于类型转换的关键字\n* `explicit`\n* `implicit`\n\
  * `as`\n* `is`\n* `operator`\n* `sizeof`\n* `typeof`\n\n### 3) 有助于程序流的关键字\n* `if`\n\
  * `else`\n* `for`\n* `foreach`\n* `in`\n* `case`\n* `break`\n* `continue`\n* `return`\n\
  * `while`\n* `goto`\n* `default`\n* `do`\n* `switch`\n\n### 4) 用于内置类型和枚举的关键字\n*\
  \ `bool`\n* `char`\n* `class`\n* `byte`\n* `decimal`\n* `enum`\n* `double`\n* `float`\n\
  * `interface`\n* `long`\n* `int`\n* `object`\n* `uint`\n* `short`\n* `string`\n\
  * `uint`\n* `struct`\n* `ulong`\n* `ushort`\n\n### 5) 用于异常处理的关键字\n* `try`\n* `catch`\n\
  * `throw`\n* `finally`\n* `checked`\n* `unchecked`\n\n### 6) 作为字面量、方法传递参数的关键字\n\
  * `true`\n* `false`\n* `null`\n* `this`\n* `value`\n* `out`\n* `params`\n* `ref`\n\
  \n### 7) 有助于函数指针、对象分配、非托管代码的关键字\n* `delegate`\n* `event`\n* `new`\n* `stackalloc`\n\
  * `unsafe`\n\n## 如何正确格式化代码\n\n格式化代码时需要遵循的某些规则包括：\n* 你可以在类定义内部对方法进行缩进。C# 允许在格式化源代码时使用任意数量的制表符（即按下键盘上的\
  \ tab 键后获得的字符）。\n* 你应该在方法定义内部对其内容进行缩进。\n* 将左括号（即 `{`）放置在它所属的类或方法正下方。此外，如果它是该行的唯一字符，将是。\n\
  * 确保右括号（即 `}`）与左括号垂直对齐。\n* 你的类名应该以大写字母开头。\n* 你的变量名应该以小写字母开头。\n* 你的方法名应该以大写字母开头。\n\
  * 写在另一个代码内部的代码需要缩进。\n\n### 类名\n在 c# 中，每个程序都有一个或多个类定义。程序员通常将每个类定义存储在与类名对应的单独文件中。此外，这些文件的扩展名应该是\
  \ `.cs`。你可以将不同的类编译到一个单独文件中，而不会遇到任何技术问题。然而，导航你的代码将变得很困难。\n\n### 关于 c# 的更多信息\nc# 编程语言是高级、现代、多用途且面向对象的。它与\
  \ c++、java 等其他语言有一些相似之处。主要区别是 c# 提供了更简单的编程和简化的语法。一个 c# 程序有一个或多个 `.cs` 文件，其中存储了数据类型和定义。你需要编译这些\
  \ `.cs` 文件来获取可执行代码（即以 `.dll` 或 `.exe` 结尾的文件）。例如，如果你编译 hello 程序，将得到一个名为 `hello.exe`\
  \ 的可执行文件。\n\n## 创建 c# 所需的内容\n在使用 c# 编写程序之前，你需要两个重要的东西——文本编辑器（例如记事本）和框架。文本编辑器将帮助你编写和编辑代码。另一方面，框架将帮助你编译和执行程序。\n\
  \n### 什么是 .net?\n从技术上来说，.net 是用于开发和运行计算机程序的框架。大多数现代 Windows 系统都有 .net 作为内置框架。因此，如果你使用的是微软的现代操作系统，就不需要在计算机上安装任何软件。如果你使用的是旧版本的\
  \ Windows，你需要先下载框架。你可以访问此[网站](http://microsoft.com) 并获取最新版本的 .net。重要说明：在阅读本书其余部分之前，请确保你的计算机已安装\
  \ .net。否则，你将在编译和执行后面看到的示例程序时遇到问题。\n\n### 文本编辑器\n你应该使用文本编辑器来编写、编辑和保存源代码。你可以使用计算机上安装的任何文本编辑器。如果你不想下载额外的程序，可以简单地使用“记事本”（即\
  \ Windows 预装的文本编辑器）。\n\n### 编译和执行程序\n你需要包含的操作包括：\n1. 生成一个 `.cs` 文件并将其命名为 `hello.sharp`。\n\
  2. 在该 `.cs` 文件中编写源代码。\n3. 编译代码以获取 `.exe` 文件。\n4. 运行生成的程序。\n\n打开你的计算机，让我们开始编写代码。重要说明：本书假设你使用的是\
  \ Windows 。\n\n## 第 3 章：揭秘数据类型\n现在我们来谈论数据以及 c# 中看到的不同类型，我们有三个基本类别：值类型和引用类型。如果你熟悉编程，你一定熟悉与数据相关的不同类型。\n\
  \n### 属性\n数据类型具有以下属性：\n* 名称（例如 `Int`、`char`、`bool` 等）\n* 大小（例如 1 字节）\n* 默认值（例如 1、2、3\
  \ 等）\n\n### c# 中的不同数据类型\nC# 支持以下数据类型：\n* `boolean`\n* `字符`\n* `object`\n* `浮点`\n\
  * `decimal`\n* `整数`\n* `string`\n\n由于这些数据类型预装在 c# 语言中，程序员称之为“原生类型”。\n\n### 值类型\n\
  值类型正如其名所示，是由值本身的数据类型。这些术语如 `boolean` 字节或 `int`。在你的虚拟环境中运行的一个良好测试是使用 `sizeof(type)`\
  \ 术语获取给定数据类型的大小，将 type 替换为你想要知道的数据类型。值类型的完整列表为 `decimal`、`double`、`bool`、`float`、`char`、`byte`、`long`、`system`、`short`、`uint`、`int`、`ushort`\
  \ 和 `ulong`。\n\n在引用类型数据内部，我们指的是（你可能猜到了！）对数据类型的引用。这些数据类型能够告诉你内存所在的位置。甚至可以有多个引用指向多个变量。这种数据，我们使用\
  \ `string`、`dynamic` 和 `object` 作为关键字来描述引用数据类型。\n\n\n\n最后一种数据类型是指向另一个变量的指针，用于将你引导到适当的位置。为了强化你确实知道指针是什么，这里有一个指针变量声明的通用示例——\n\
  \n`var-name`\n\n请在在你自己的字典中尝试操作这些变量，看看对这些变量可以得到什么种输出。在编程和编码中，我认为你应该注意的另一个重要的短语。这是当你使用\
  \ `/unsafe` 命令时用到的术语——\n\n```\ncsc /unsafe darkprog.cs\n```\n\n在上面的示例中，我们指定为不安全的程序是\
  \ `darkprog.cs`。\n\nC# 是一种强类型语言；因此，它要求你在每次声明变量时都要指明数据类型。让我们来探索一些常见的数据类型及其工作原理：\n\
  \n1. `bool`——这是一种简单的数据类型。它只接受两个值：true（真）或 false（假）。你需要使用 `bool`（即一个 C# 关键字）来声明这种数据类型。布尔值的结果只可能是\
  \ `true` 或 `false`。在 C# 编程语言中，布尔值会被自动设置为 `false`。程序员使用这种数据类型来存储逻辑语句的结果。在使用像 `if`\
  \ 语句这样的逻辑运算符时，它非常实用。\n2. `Int`——代表整数。它是一种用于存储不带小数数值的数据类型。它是数字中最流行的数据类型。在 C# 中，根据要存储的数字的大小，整数还有好几种不同的数据类型。\n\
  3. `String`——这用于存储文本，即字符序列。C# 字符串是不可变的，这意味着一旦创建了字符串，你就无法更改它。如果你使用更改字符串的方法，字符串本身不会发生改变，而是会返回一个新的字符串。\n\
  4. `Char`——这用于存储单个字符。你需要使用 `char`（即另一个 C# 关键字）来声明这种类型。在一对单引号内编写你的 `char` 值（例如 'i'）。\n\
  5. `Float`——这是一种用于存储带有小数数值的数字的数据类型。\n\n### 对象 (Objects)\n\n程序员将对象视为 C# 语言中是最特殊的数据类型。基本上，对象充当\
  \ `.net` 中其他数据类型的父类。这种数据类型在声明时需要 `object` 关键字，它可以接受来自其他数据类型的任何值。你可以将对象视为指向你计算机内存某些部分的地址。\n\
  \n### 实数类型 – 浮点 (Real type – floating points)\n\n在 C# 语言中，“实数类型”指的是你在数学中学过的实际数字。浮点实数类型可以是\
  \ `float` 或 `double`。\n\n1. `Float`——程序员将这种子类型称为“单精度实型”。`float` 数字的默认值为 `0.0f`（末尾的\
  \ `f` 不区分大小）。字母 `f` 表示该值是一个 `float`。\n2. `Double`——程序员在提到这种类型时使用“双精度实型”一术语。它的默认值为\
  \ `0.0d`（即末尾的字母 `d` 不区分大小）。系统会自动将实数标记为 `double`，所以你实际上不需要在值的末尾添加 `d`。\n\n### 实数类型\
  \ – 小数 (Real type – decimals)\n\n这种编程语言支持“小数运算”，这是一种使用小数来表示数字的数学方法。这种方法无论处理什么数值都能保持其准确性。C#\
  \ 使用 `decimal` 类型来表示这种实数。这种数据类型为 128 位，并精确到小数点后第 29 位。由于其卓越的准确性，程序员使用这些类型进行财务计算（例如：支付、利息等）。\n\
  \n### 整数 (Integers)\n\n这种数据类型由 8 类型组成，它们是：\n\n- `byte`——字节是一个 8 位的符号整数。这意味着它可以包含多达\
  \ 256 个值（即 ⁸）。此外，字节可以是负数也可以是正数。\n- `byte`——这种类型包含 8 位的无符号整数。它与 `byte` 几乎相同。唯一的区别是\
  \ `byte` 永远不会是负数。\n- `short`——这些整数是 16 位的符号整数。\n- `ushort`——这些是长度为 16 的符号整数。\n-\
  \ `int`——这可能是 C# 中最流行的数据类型。程序员使用这种数据类型是因为它与 32 位处理器完美兼容，并且足够用于计算。它是一个长度为 32 位的符号整数。\n\
  - `uint`——这种 32 位整数是无符号的。因此，它只能是正数。\n- `long`——这种整数长度为 64 位。它可以是正数也可以是负数。\n- `ulong`——这类似于\
  \ `long` 整数。唯一的区别是 `ulong` 只能取正值。\n\n字符串 (Strings)\n\n字符串是字符的集合或序列。C# 要求你在声明属于这种数据类型的值时使用\
  \ `string`（即一个关键字）。你必须在一对双引号之间编写每个字符串。此种语言允许你对字符串执行各种操作（例如：拼接、字符替换、字符搜索等）。\n\n`sizeof()`\
  \ 方法允许我们知道变量或数据类型的大小。大小以字节的形式返回。考虑以下示例：\n\n```system;\n\nNamespace typeapp {\nClass\
  \ inttype {\nStatic void main(string[] args) {\nConsole.WriteLine(\"size of int:\
  \ {0}\", sizeof(int));\nConsole.readline();\n}\n}\n}\n```\n\n该代码应该返回：\n\n![00179.jpg](img/00179.jpeg)\n\
  \n这意味着整数占用 4 字节的空间？\n\n## 第 4 章：使用变量\n\n你可以使用变量来存储、检索和修改更改的数据。作为程序员，你需要使用变量来存储和处理信息。\n\
  \n### 变量的特征\n\n变量具有以下特征：\n\n- 名称（也称为“标识符”）\n- 数据类型\n- 值（即你想要存储的信息）\n\n变量是具有名称的计算机内存区域。它们存储值并允许计算机程序访问其内容。你可以将变量放在栈（即你计算机程序的工作内存）中，或程序的动态内存中。\n\
  \n如何命名变量\n\n\n\n在使用变量之前，你需要对其进行命名。变量名充当标识符：它帮助程序定位和指定变量。C# 允许你自由地选择变量名。然而，与任何其他语言一样，C#\
  \ 对变量名也有一些规则。这些规则如下：\n\n- 你可以使用下划线（即 `_`）、字母和数字来创建变量名。\n- 你不能用数字开头命名。因此，`firstsample`\
  \ 是有效的，而 `1stsample` 是无效的。局部变量通常使用驼峰命名法（Camelcase），例如 `cost`、`orderdetail`、`dateofirth`\
  \ 和 `firstname`。\n- 在命名变量时不能使用 C# 关键字。这条简单的规则可以防止程序出现编译错误和运行时错误。如果你确实想为变量使用关键字，可以使用\
  \ `@` 符号开头名称（例如 `@oal`、`@int`、`@char` 等）。\n- 变量名应当具有意义或或描述性，既不能太长也不能太短，以便通过观察就能识别变量中存储的信息。\n\
  - 可以包含字母 `a–z` 和 `A–Z`、数字 `0–9` 以及下划线 `_` 字符——不允许其他符号。\n- 不允许空格且不能以数字开头。\n\n###\
  \ 有效名称\n- `cost`, `name`, `order`, `order1`, `_order1`, `income`\n- `order_detail`,\
  \ `orderdetail`, `dateofirth`, `hourlyrate`, `firstname`, `first_name`, `isvalid`\n\
  \n### 无效名称\n- `1`（数字）\n- `class`, `while`, `if`, `protected`（关键字）\n- `1order`, `1name`（以数字开头）\n\
  \n### 如何声明变量\n你应该在使用变量之前对其进行声明。在声明变量时：\n\n1. 指定变量的数据类型（例如 `Char`）\n2. 指定变量的名称（例如\
  \ `Sample`）\n3. 设置变量的初始值。这一步完全可选的。\n\n变量声明的格式为：\n`Data_type name = initial_value;`\n\
  \n以下是一些有效的变量声明示例：\n\n```\nInt year = 2000;\nString name = username;\nChar c = test;\n\
  ```\n\n重要提示：你需要使用分号结束每个 C# 语句。如果你忘记添加哪怕一个分号字符，你的程序都会产生不良或意料之外的结果。\n\n### 如何赋值\n\
  与任何其他计算机语言一样，C# 允许你为变量赋值。这个过程被称为“值赋值”，它要求你使用等号。程序员将此符号称为“赋值运算符”。将变量名写在运算符的左侧，然后在另一侧指定你想要赋值的值。请检查以下示例：\n\
  \n```\nTest = x;\nusername = \"john\";\n```\n\n### 如何初始化变量\n在编程中，“初始化”是指为新变量赋值的过程。因此，你在声明变量时会设置这个“初始值”。\n\
  \n### 变量的默认值\n如果你没有为变量分配任何值，C# 将执行自动初始化（即它将为空变量分配一个默认值）。下面的表格将显示每个数据类型的默认值：\n\n\
  ![0048.jpg](img/0048.jpg)\n\n给出的代码将向你展示如何声明变量并赋值。\n\n```\nyears = 10;\ndays = 31;\n\
  pi = 3.14;\nisempty = true;\nsample = x;\nanimal = \"dog\";\n```\n\n重要提示：以双正斜杠（即\
  \ `//`）开头的行是“注释”。在编程中，注释是添加到代码中以提高可读性的描述性文本。语言编译器忽略这些行。因此，注释不会影响程序的功能。\n\n### 创建标识符\n\
  如果你查看微软提供的一些建议，你会发现他们建议在处理变量时使用驼峰命名法（camelCase），并建议在处理方法时使用帕斯卡命名法（PascalCase）。使用驼峰命名法意味着你保持名称的第一个字母为小写。如果你创建一个包含复合词的标识符，你需要确保第二个单词的第一个字母大写：：`paymentComplete`。\n\
  \n### 数学\n帕斯卡命名法（PascalCase）风格略有不同。这种符号风格要求你使用大写字母开头第一个单词。序列中所有其他单词的首字母也应该大写。使用帕斯卡命名法的示例包括：\n\
  \n```\nWriteLine()\nreadline()\nStart()\nmain()\n```\n\n在命名这些标识符时，你也可以使用数字和下划线。但如果由于某些原因你不能以数字开头这些标识符，你可以写像\
  \ `sevenooks` 这样的单词，但不能写成 `7ooks`。现在，这些符号并不是强制要求的，你可以根据心意随意更改。但这是一种规范。\n\n### 确定赋值\n\
  C# 强制执行确定性赋值。这意味着你在使用变量之前需要为它初始化值。假设有如下内容：\n\n```\nConsole.WriteLine(name);\n```\n\
  错误：使用了未赋值的变量 ‘name’\n\n如果你尝试使用未声明的变量，你的代码将无法编译。在这种情况下，编译器会告诉你出错了什么。尝试使用未赋值的变量也会导致错误。\n\
  \n为了给变量初始化值，你只需使用赋值运算符 `=`。变量名位于运算符的左侧，右侧则是如下所示的值：\n\n```\nTest = x;\nusername =\
  \ \"john\";\n```\n\n在声明类型变量后，不能用新类型重新声明它，也不能赋值与其声明类型不兼容的值。例如，你不能声明一个 int 然后给它赋值布尔值\
  \ true/false。\n\n```\nAge = true;\n```\n错误：无法将类型 ‘bool’ 隐式转换为 ‘int’\n```\n\n\n\n\
  你可以像下面所示，在同一行同时结合声明和初始化语句，这样更方便。\n\n```java\nString name = \"pirzada\"; int age\
  \ = 35; int weight = 70; bool ismarried = true;\n```\n\n你也可以使用数学表达式。\n\n```java\n\
  Int wowexp = (3 + 2) * 4; Console.WriteLine(wowexp);\n```\n\n输出：\n20\n\n右侧会被求值然后赋值给左侧的变量。这意味着\
  \ `3+2` 是 `5`，`5 * 4` 是 `20`，这会被赋值给变量 `wowexp`。\n\n\n\n你也可以同时给多个不同的变量分配相同的值。\n\n\
  ```java\nInt a, c; a = c = 786; Console.WriteLine(a); Console.WriteLine(); Console.WriteLine(c);\n\
  ```\n\n输出：\n786\n786\n786\n\n### 使用类型推断\n\nC# 3.0 通过 `var` 关键字引入了隐式类型变量。现在，你可以在不给出显式或真实类型的情况下声明局部变量。该变量在编译时仍然会接收到一个类型，但该类型是由编译器提供的。\n\
  \n实际上，`var` 关键字指示编译器从初始化语句右侧的表达式推断变量的类型。编译器的任务是确定并分配合适的类型。\n\n```java\nVar varialename\
  \ = variablevalue; // 语法\n```\n\n`Var` 是可选的，它只是为了方便。\n\n让我们使用上面相同的变量。\n\n```java\n\
  Var name = \"pirzada\"; var age = 35; var weight = 70; var ismarried = true;\n```\n\
  \n现在这些变量是隐式类型局部变量，意味着你不需要显式指定类型。编译器负责确定并分配合适的类型。字符串变量由双引号表示，字符变量由单引号表示，而 `bool`\
  \ 类型则由 `true` 和 `false` 值表示。\n\n建议：使用 `var` 很方便，但仅当类型从赋值的右侧显而易见时才使用它。\n\n`Double`\
  \ 用于表示带有小数点的字面量数字，除非你添加 `m/m` 后缀来表示小数变量，或添加 `f/f` 后缀来表示浮点型变量。\n\n```java\nVar value\
  \ = 24899.45m; var numer = 20.8f;\n```\n\n为了初始化 `numer`，你需要在 `20.8` 之后添加 `f` 后缀，显式告诉编译器将\
  \ `20.8` 转换为 `float`。同样，为了初始化 `value`，你需要添加 `m` 后缀将 `24899.45` 转换为 `decimal` 类型。\n\
  \n你需要遵循以下规则：\n\n* `var` 只能在单条语句中声明和初始化。否则，编译器将无从何处推断类型。\n* `var` 不应用于类作用范围内的字段。\n\
  * 初始化器不能为 `null` 且必须是一个表达式。\n* 多个隐式类型变量不能在同一语句中。\n* 除非在初始化器中创建了新对象，否则不能使用对象。\n\n\
  ### 默认值表达式\n\n当你不知道给定类型的默认值将会何时，默认值表达式在与泛型结合使用时特别有用。\n\n`default(t)` 返回类型的默认值，其中\
  \ `t` 是引用类型或值类型。\n\n```java\nT varialename = default(t); // 语法\n示例：\nVar name =\
  \ default(string); var age = default(int); var weight = default(int);\n```\n\n###\
  \ 默认字面量：\n\n默认字面量是 C# 7.1 中的新功能，用于在语句执行时获取指定类型的默认值。此功能适用于值类型，也适用于引用类型。注意：默认字面量等于\
  \ `default(t)`，其中 `t` 是推断出的类型。\n\n```java\nString name = default; int age = default;\
  \ int weight = default; bool ismarried = default; Console.WriteLine(name); Console.WriteLine(age);\
  \ Console.WriteLine(weight); Console.WriteLine(ismarried);\n```\n\n在输出中，空值将以空行打印。默认字面量和\
  \ default(t) 的输出：\n00 false\n\n### new 运算符\n\n使用 `new` 运算符会调用值类型的默认构造函数。这允许你使用 `new`\
  \ 关键字创建变量，这会自动将变量设置为其默认值。注意：C# 中的所有值都是特定类型的实例。\n\n```java\nVar age = new int();\
  \ var ismarried = new bool(); Console.WriteLine(age); Console.WriteLine(ismarried);\n\
  ```\n\n输出：\n0\nFalse\n\n## 第 5 章：什么是类型转换？\n\n通常，运算符作用于属于相同类型的参数。然而，C# 语言提供了广泛的数据类型，你可以将其用于某些特定情况。要对属于不同类型的变量进行任何处理，你应该先转换其中一个变量。在\
  \ C# 中，数据类型转换可以是隐式的也可以是显式的。\n\n每个 C# 表达式都有一个数据类型。该数据类型取决于表达式内部使用的字面量、变量、值和结构。基本上，你可能会使用一个类型与情况不兼容的表达式。当发生这种情况时，你将得到以下结果之一：\n\
  \n* 程序将给你给出一个编译时错误。\n* 程序将执行自动转换。这意味着程序将获得正确的表达式。\n\n将“s”类型转换为“t”类型允许你在运行程序时处理“s”。因此，有时此过程需要程序员对类型转换进行验证。查看示例：\n\
  \n* “对象”到“字符串”在程序运行时将需要验证。这种验证确保了你确实想将这些值作为字符串使用。\n* “字符串”值到“对象”不需要任何验证，因为“字符串”类型是“对象”类型的派类。你可以将字符串转换为其父类而不会丢失数据或产生任何错误。\n\
  * 在将 int 值转换为 long 值时，你不需要执行验证。`long` 数据类型涵盖了 `int` 类型的所有可能值。这意味着数据可以在产生任何错误的情况下进行转换。\n\
  \n\n\n如果存在信息丢失的可能性，请使用 `conversion`。例如，在将浮点值转换为整数值时会发生信息丢失（即小数部分将消失）。在将宽范围类型转换为窄范围类型时，你可能会丢失某些数据（例如\
  \ `Long-to-int` 转换、`double-to-float` 转换等）。要完成此过程，你需要使用 `type` 运算符。请查看下面的示例：\n\n\
  ```\nClass example\n{\n    Static void main()\n    {\n        double yourdouble\
  \ = 2.1d;\n        System.println(yourdouble);\n        long yourlong = (long)yourdouble;\n\
  \        System.println(yourlong);\n        yourdouble = 2e9d;\n        System.println(yourdouble);\n\
  \        int yourint = (int)yourdouble;\n        System.println(yourint);\n    }\n\
  }\n```\n\n如果正确编译并执行，该程序将给你以下结果：\n\n![00063.jpg](img/00063.jpeg)\n\n### 隐式转换\n\n\
  只有在不可能发生数据丢失时，你才能执行此类转换。这种转换被称为 `implicit`（隐式），因为它不需要任何运算符。当你将窄范围的值赋值给具有宽范围的变量时，C#\
  \ 编译器将执行隐式转换。\n\n### 字符串转换\n\nC# 允许你将任何数据类型转换为“string”。如果你使用 `+` 且至少有一个非字符串参数，编译器将自动执行此转换过程。在这里，非字符串参数将变为字符串，`+`\
  \ 运算符将产生新值。\n\n隐式类型转换用于执行如从基类到派生类的转换的操作。这些转换是以所谓的“类型安全”的方式进行的。另一种类型的转换是显式的（explicit），它需要强制转换运算符来完成其功能。C#\
  \ 中有 16 种可以作为转换方法的内置类型的不同函数。以下是你应该在 C# 环境中练习并熟悉的一些示例：\n\n* `tochar`-允许你获取一个类型并将其转换为单个\
  \ Unicode 字符\n* `byte`-允许你从一个类型转换并获取一个字节\n* `todetime`-允许你通过转换类型（字符串或整数）获取一个日期时间结构\n\
  * `tofloat`-允许你通过转换一个类型获取一个浮点值\n* `double`-允许你通过转换一个类型获取一个双精度\n* `decimal`-允许从浮点数转换为整数或十进制类型\n\
  * `int64`-允许从一个类型转换为一个 64 位整数\n* `int32`-允许从一个类型转换为一个 32 位整数\n* `int16`-允许从一个类型转换为一个\
  \ 16 位整数\n* `sbyte`-允许从一个类型转换为一个有符号类型\n* `string`-允许从一个类型转换为一个字符串\n* `single`-允许从一个类型转换为一个小的浮点数\n\
  * `uint64`-允许从一个类型转换为一个无符号整数\n* `uint32`-允许从一个类型转换为一个无符号长整数类型\n* `uint16`-允许从一个类型转换为一个无符号整数类型\n\
  * `type`-允许从一个类型转换为一个指定的类型\n\n对于你今天的练习，我鼓励你编写涵盖了上述每一个函数/转换的程序，以便更熟悉它们所包含的内容以及它们如何帮助你的编程。请记住，尽管你的代码可能很长，但你的输出应该始终产生你通过完成编程题想要实现的答案。\n\
  \n## 第 6 章：运算符的需要\n\n在本章中，我们将花一些时间讨论你在 C# 语言内部可以使用运算符。\n\n阅读这些材料后，你将了解这些运算符是如何工作的，以及你如何在源代码中使用它们。这些运算符非常易理解和使用，但这并不意味着它们是没用的；事实上，它们可以帮助确保你的代码执行你要求其完成的任务。如果不使用其中一些运算符，你的程序将缺乏功能且运行不会良好。这些运算符可能易于理解，但它们确实为增强代码的整体能力增加了大量力量。\n\
  \n无论你使用的是哪种类型的编程语言，运算符都是重要的。我们将分别详细介绍不同的运算符，以便你理解每个运算符是如何工作的，以及你如何使用每个运算符来实现各种目的并完成不同的任务。运算符帮助你处理对象和数据类型。它们接受输入并产生结果。C#\
  \ 语言使用特殊字符（例如 `+` 等）作为运算符。\n\nC# 程序员将运算符分为以下几类：\n\n### 赋值运算符\n\n虽然在赋值时可以使用一些运算符，但最常见的是等号。你可以使用的的一些运算符包括：\n\
  \n* `=` 此运算符的功能是允许你执行简单的赋值。它可以进行赋值，例如编写 `int sample = 100` 会告诉程序你想将 100 赋值给名为 `sample`\
  \ 的变量。它不对该变量执行任何额外任务。\n* `+=` 这是加法赋值运算符。它的功能是将两个操作数的值相加，然后将和赋值给左侧的操作数。\n* `-=` 程序员经常将其称为“减法”赋值运算符。它的功能是从左侧的值中减去右侧的值，然后将差赋值给左侧的操作数。\n\
  * `*=` 此运算符的功能是乘以每个操作数的值，然后将乘积赋值给左侧的操作数。\n* `/=` 此运算符的功能是除以两个变量，然后将结果赋值给左侧的变量。\n\
  \n\n\n\n\n当你使用赋值运算符时，请确保你的其他操作数属于相同的数据类型。如果你发现所使用的各种操作数不兼容，可能会出现一些问题，导致在尝试执行程序时发生错误，并且需要额外的时间和精力来修复。\n\
  \n在 C# 中，你需要使用等号（即 `=`）来赋值。以下是你在赋值值时需要使用的语法：\n\n`Name_of_operand = expression, literal\
  \ or second_operand`\n\n这里是一些示例：\n\n```csharp\nInt y = 99;\nString hello = \"good\
  \ morning.\";\nChar sample = 'z';\n```\n\n**重要说明**：C# 允许你对赋值运算符进行级联操作（即在单个表达式中多次使用）。这意味着如果你正在创建相同数据类型的变量，就不需要输入多个等号了。下面的示例将阐明这一规则：\n\
  \n```csharp\nInt d = 1, e = 2, f = 3;\nString hi = \"good morning.\", ye = \"farewell.\"\
  , thanks = \"thank you.\";\n```\n\n### 逻辑运算符\n\n逻辑运算符（也称为“布尔”运算符）接受并返回布尔值（即 True\
  \ 或 false）。以下是 C# 的四个逻辑运算符：\n\n*   `&&` – 程序员将此运算符称为“逻辑与”。如果两个操作数都为真，它将给你返回“true”。\n\
  *   `^` – 这被被称为“异或或”运算符。如果其中一个操作数为真，它将给你返回 true。\n*   `||` – 这是“逻辑或”运算符。只要至少有一个运算符为真，你就会得到\
  \ true。\n*   `!` – 这个运算符被称为“逻辑非”运算符，它会反转操作数的值。\n\n学习以下代码以理解这些运算符的使用(109)：\n\n```csharp\n\
  Class test\n{\n    Static void main()\n    {\n        bool x = true, y = false;\n\
  \        Console.WriteLine(x && y);\n        Console.WriteLine(x || y);\n      \
  \  Console.WriteLine(!x);\n        Console.WriteLine(x ^ y);\n        // this is\
  \ an example.\n    }\n}\n```\n\n一旦你编译并运行这段代码，你将看到以下结果：\n\n![00022.jpg](img/00022.jpeg)\n\
  \n### 算术运算符\n\n这些运算符帮助你执行数学运算。该类别由以下运算符组成：\n\n*   `+` – 使用此运算符对两个操作数进行加法（例如 `Int\
  \ x = 1 + 1`）。\n*   `-` – 此运算符允许你在代码中执行减法。它从左操作数的值中减去右操作数的值（例如 `Int x = 2 – 1`）。\n\
  *   `*` – 使用此运算符，你可以乘以两个操作数的值（例如 `Int r = 6 * 6`）。\n*   `/` – 使用此运算符在代码中进行除法。它将左操作数的值除以右操作数的值。\n\
  *   `++` – 这被称为“递增运算符”。它增加操作数的值。与上述运算符不同，此运算符作用于单个操作数。此外，你也可以写在操作数之前（例如 `99++, ++5`\
  \ 等）。\n*   `--` – 此运算符是递增运算符的相反操作。你可以用它来减少操作数的值。你可以将其写在你想要修改的操作数之后。\n*   `%` – 这通常被称为余数或通俗称为“取模”运算符。它的功能是将左操作数除以右操作数并返回余数。\n\
  \n下面的代码将向你展示这些运算符是如何工作的：\n\n```csharp\nClass test\n{\n    Static void main()\n \
  \   {\n        int d = 100, e = 3;\n        Console.WriteLine(d + e);\n        Console.WriteLine(d\
  \ - e);\n        Console.WriteLine(d / e);\n        Console.WriteLine(d * e);\n\
  \        Console.WriteLine(++d);\n        Console.WriteLine(--e);\n        // this\
  \ is an example.\n    }\n}\n```\n\n一旦你编译并执行该代码，你将在命令行提示符上看到：\n\n![00124.jpg](img/00124.jpeg)\n\
  \n### 二进制运算符\n\n这些运算符作用于二进制数。在 IT 世界，所有的信息都表示为零和一的序列。这意味着如果你想成为一名成功的程序员，就需要掌握二进制运算符。\n\
  \n二进制运算符的工作方式与逻辑运算符完全一样。实际上，你可能会认为二进制运算符和逻辑运算符使用不同的输入但执行相同的处理。逻辑运算符使用布尔值产生结果。而二进制运算符则作用于以二进制位表示的数字。以下是你在\
  \ C# 中会遇到的二进制运算符：\n\n*   `&` – 这被称为“二进制与”。它指示两个操作数都具有“1”的位置。\n*   `^` – 程序员将此运算符称为“二进制异或”。它在操作数不同时起作用。\n\
  *   `|` – 这是“二进制或”运算符。它指示任何一个操作数具有“1”的位置。\n*   `~` – 它充当取反。就像 `!` 一样，它会反转值。\n* \
  \  `<<` – 这是“二进制左移”运算符。它将位向左移动。这种移动取决于你分配的值（例如 `4 << 3`, `4 << 2`）。\n\n### 关系运算符\n\
  \n你可以使用的下一种运算符是关系运算符。这些运算符非常有用，因为它们允许你比较值。每一个此类运算符都给出一个布尔值。正如此，这些运算符被用于创建条件语句。我们将查看一些使用的的关系运算符，假设\
  \ e=150 且 d=100：\n\n*   `==` – 这是相等运算符。它检查两个操作数是否相等（例如 `X == y`）。此运算符的功能是检查值的相等性。如果两个值最终相等，运算符将认为它是\
  \ true。否则，运算符将认为它是 false。例如，写下 `d == e` 结果将显示为 false。\n*   `>` – 此运算符的功能是检查左侧的操作数是否大于右侧的操作数。如果是的话，运算符将认为它是\
  \ true。例如，写下 `e > d` 结果将为真。\n*   `<` – 这实际上是一个小于运算符，它允许你检查左侧的操作数是否小于右侧的操作数。如果左侧操作数的值小于右侧操作数的值，它将给你返回“true”（例如\
  \ `Y < x`）。\n\n\n\n\n\n- `>=` – 使用此运算符，你可以判断左侧操作数的值是否大于或等于右侧操作数的值。该运算符的作用是它会判断左侧操作数的值确实大于或等于右侧的操作数；否则，它会告诉你该语句为假（false）。例如，`e\
  \ >= d` 结果为 true。\n- `<=` – 如果左侧操作数的值小于或等于右侧操作数的值，则此运算符将返回 true。\n- `!=` – 此运算符的功能是允许你测试两个值/操作数之间的不等性。如果两个值不相等，它会告诉你是真的（true）。例如，`e\
  \ != d` 将导致运算符结果为 true。\n\n当你使用这些关系运算符时，务必记住你每次都会得到一个布尔结果。这意味着你得到的答案要么是 `true`，要么是\
  \ `false`。在处理相等运算符时，你还必须检查是否使用了两个等号。如果你不小心将这些运算符与赋值运算符混淆，你可能会收到错误信息，该程序将无法按照你想要的方式运行。\n\
  \n### 条件运算符\n\nC# 用户将 `?` 称为条件运算符。基本上，该运算符使用布尔表达式的结果来确定应该处理哪条语句。这被称为“三元运算符”，因为它作用于三个操作数。在这里，第一个值应该是布尔类型，而其余的值则需要属于相同的数据类型（例如：字符、字符串、数字等）。\n\
  \n该运算符的语法为：\n\n`First_operand ? Second_operand : third_operand;`\n\n其工作原理如下：如果 `first_operand`\
  \ 为 true，程序将处理 `second_operand`。然而，如果 `first_operand` 为 false，程序将处理 `third_operand`。\n\
  \n## 第 7 章：条件语句\n\nC# 拥有条件语句，主要用于控制执行流。条件语句要求程序员指定一个条件或一组条件，以及当发现条件为真时要执行的相应语句。程序员也可以指定当条件不为真时要执行的语句。让我们讨论一下\
  \ C# 支持的各种条件语句。\n\n### If 语句\n\n该语句用于在执行一组语句之前评估布尔表达式。如果条件为真，则执行一组语句，否则将执行另一组语句。以下是其语法：\n\
  \n`If(boolean_expression) { /* 如果 boolean_expression 为真，则执行的语句 */}`\n\n这是一个示例：\n\
  \n```csharp\nUsing system;\n\nNamespace decisionmaking {\nClass ifstatement {\n\
  \    Static void main(string[] args) {\n        /* 定义本地变量 */\n        Int x = 5;\n\
  \        /* 通过 if 检查布尔条件 */\n        If (x < 10) {\n            /* 如果条件为真，则打印 */\n\
  \            Console.WriteLine(\"x is less than 10\");\n        }\n        Console.WriteLine(\"\
  the value of x is: {}\", x);\n        Console.readline();\n    }\n}\n```\n代码返回以下输出：\n\
  ![0016.jpg](img/0016.jpeg)\n条件被发现为真，变量 x 的值小于 10，因此执行了语句。如果条件为假呢？\n\n```csharp\n\
  Using system;\n\nNamespace decisionmaking {\nClass ifstatement {\n    Static void\
  \ main(string[] args) {\n        /* 定义本地变量 */\n        Int x = 15;\n        /* 通过\
  \ if 检查布尔条件 */\n        If (x < 10) {\n            /* 如果条件为真，则打印 */\n          \
  \  Console.WriteLine(\"x is less than 10\");\n        }\n        Console.WriteLine(\"\
  the value of x is: {}\", x);\n        Console.readline();\n    }\n}\n}\n```\n代码返回：\n\
  ![0098.jpg](img/0098.jpeg)\n条件被发现为假，因此执行了其锁之外的语句。\n\n### If-else 语句\n\n这简单来说是 if\
  \ 语句与 else 部分的组合。如果条件为真，则执行 if 部分；当条件为假时，执行 else 部分。这两个部分不能同时执行。该语句的语法如下：\n\n`If(boolean_expression)\n\
  {\n    // 如果条件为真，则执行代码。\n}\nElse\n{\n    // 如果条件为假，则执行代码\n}`\n\n考虑给出的示例：\n\n```csharp\n\
  Using system;\n\nNamespace decisionmaking {\nClass ifelsestatement {\n    Static\
  \ void main(string[] args) {\n        /* 定义本地变量 */\n        Int x = 5;\n       \
  \ /* 检查布尔条件 */\n        If (x < 10) {\n            /* 如果条件为真，将打印以下内容 */\n      \
  \      Console.WriteLine(\"x is less than 10\");\n        } else {\n           \
  \ /* 如果条件为假，将打印以下内容 */\n            Console.WriteLine(\"x is greater than 10\");\n\
  \        }\n        Console.WriteLine(\"the value of x is: {}\", x);\n        Console.readline();\n\
  \    }\n}\n```\n代码返回：\n![0015.jpg](img/0015.jpeg)\n条件结果为真，因此执行了锁内部的语句。如果条件为假呢？\n\
  \n```csharp\nUsing system;\n\nNamespace decisionmaking {\nClass ifelsestatement\
  \ {\n    Static void main(string[] args) {\n        /* 定义本地变量 */\n        Int x\
  \ = 15;\n        /* 检查布尔条件 */\n        If (x < 10) {\n            /* 如果条件为真，将打印以下内容\
  \ */\n            Console.WriteLine(\"x is less than 10\");\n        } else {\n\
  \            /* 如果条件为假，将打印以下内容 */\n            Console.WriteLine(\"x is greater\
  \ than 10\");\n        }\n        Console.WriteLine(\"the value of x is: {}\", x);\n\
  \        Console.readline();\n    }\n}\n```\n代码给出：\n![0036.jpg](img/0036.jpeg)\n\
  条件结果为假，因此执行了 else 锁内部的语句。\n\n### Else…if 语句\n\n在某些情况下，我们可能需要检查多个条件。在这种情况下，我们可以使用\
  \ else if 语句。它采用以下语法：\n\n`If(boolean_expression a)\n{\n    // 如果条件 a 为真，则执行代码。\n\
  }\nElse if(boolean_expression b)\n{\n    // 如果条件 b 为真，则执行。\n}\nElse if(boolean_expression\
  \ c)\n{\n    // 如果条件 c 为真，则执行。\n} else\n{\n    // 如果上述所有条件均为假，则执行。\n}`\n\n这是一个示例：\n\
  \n```csharp\nUsing system;\n\nNamespace decisionmaking {\nClass elseifstatement\
  \ {\n    Static void main(string[] args) {\n        /* 定义本地变量 */\n        Int x\
  \ = 5;\n        /* 检查布尔条件 */\n        If (x == 1) {\n```\n\n\n\n\n```csharp\n/*\
  \  如果条件为真，打印此语句 */\n\nConsole.WriteLine(\"value of x is 1\");\n\n} Else if (x ==\
  \ 2) {\n\n    /*  如果 if else if 条件为真，则打印此语句*/\n    Console.WriteLine(\"value of\
  \ x is 2\");\n\n} Else if (x == 3) {\n\n    /*  如果 if else if 条件为真，则打印此语句  */\n\
  \    Console.WriteLine(\"value of x is 3\");\n\n} else {\n\n    /*  如果以上条件都不为真，则打印此语句\
  \  */\n    Console.WriteLine(\"all conditions are false\");\n}\n\nConsole.WriteLine(\"\
  exact value of x is: {0}\", x);\n\nConsole.readline();\n\n}\n\n}\n}\n\n代码输出以下结果：\n\
