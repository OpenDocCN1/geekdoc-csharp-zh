  \n![00144.jpg](img/00144.jpeg)\n\n### Switch 语句 (111)\n\n该语句与使用多个 if 语句相同。它的创建包含一组可能性的列表、每种可能性对应的操作，以及一个在任何选项都不求值为真时执行的默认部分。以下是该语句的语法：\n\
  \n```csharp\nSwitch(expression)\n{\n    Case <value_1>\n        // 代码\n        Break;\n\
  \    Case <value_2>\n        // 代码\n        Break;\n    Case <value_n>\n       \
  \ // 代码\n        Break;\n    Default\n        // 代码\n}\n```\n\n这里是一个示例：\n\n```csharp\n\
  Using system;\n\nPublic class switchstatement {\n\n    Static void main(string[]\
