  \                break;\n            Default:\n                Console.WriteLine(30);\n\
  \                break;\n        }\n    }\n}\n```\n\n输出如下：\n\n## 第 8 章：循环\n\n作为一名程序员，你将使用循环语句来反复运行某些代码块。循环在\
  \ C# 编程中起着重要作用。因此，如果你想在短时间内掌握这门语言，也应该仔细学习这些材料。\n\n## 循环——基础\n\n在创建程序时，你通常需要多次执行代码序列。多次输入相同的代码块会非常疲累。因此，你需要一种快速简单的方法来重复代码。幸运的是，C#\
  \ 语言支持循环语句。\n\n循环是一种重复运行代码片段的工具。你可以使用它运行特定次数的代码，或者在满足给定条件时一直运行。C# 提供了不同类型的循环语句。让我们详细分析每个类型：\n\
  \n### while 循环\n\n这是 C# 中是最简单的循环语句。它的语法如下：\n\n```csharp\nWhile (the_assigned_condition)\n\
  {\n    The_loop’s body;\n}\n```\n\n在此语法中，`the_assigned_condition` 是一个产生布尔值的表达式。该条件决定了\
  \ `body` 运行的次数。而 `body` 是你想要执行的语句（或语句组）。\n\n下图将说明 while 循环的工作原理：\n\n![00178.jpg](img/00178.jpeg)\n\
  \n在处理“while”循环时，C# 程序会检查布尔表达式的值。如果该值为“true”，程序将运行循环体内的所有语句。然后，程序将再次检查布尔表达式以查看其值。如果值仍为\
  \ true，程序将重新运行循环体并返回第一步（即检查表达式的值）。这个过程将一直持续，直到表达式求值为 false 为止。一旦发生这种情况，程序将处理循环正后的代码。\n\
  \n重要提示：如果条件为假，你的 C# 程序将不会运行 while 循环的体。因此，如果你在启动程序时该值为 false，那么你的语句将永远不会执行。接下来的示例将说明\
  \ while 循环是如何运行的：\n\n```csharp\nInt timer = 10;\nWhile (timer >= 0)\n{\n    System.WriteLine(\"\
  time remaining: \" + timer);\n    Timer--;\n}\n```\n\n如果你编译并执行这段代码，你的提示符将打印此内容：\n\
  \n![00163.jpg](img/0163.jpeg)\n\n### break 运算符\n\n你可以使用 `break`（一种 C# 运算符）来提前退出循环。如果程序员不想等待循环自然结束，他们就会使用此运算符。因为循环一旦遇到\
  \ `break` 就会结束。这种情况会强制程序跳转到循环后的代码。在 C# 中，你只能在循环体内使用此运算符。这意味着 `break` 只有在循环运行时才有效。\n\
  \n### do-while 循环\n\n`do-while` 循环与 `while` 循环几乎相同。这些循环之间的唯一区别是，前者在运行循环体之后分析布尔值。因此，你可以放心，即使布尔表达式为假，你的代码也会运行一次。以下是\
  \ do-while 循环的语法：\n\n```csharp\nDo\n{\n    Statements;\n} while (boolean expression)\n\
  ```\n\ndo-while 循环按照此模式工作：\n\n![00014.jpg](img/0014.jpeg)\n\n程序将执行循环体内的所有语句。然后，它将检查条件（即布尔表达式）。如果条件求值为\
  \ true，程序将再次执行循环体并执行“值检查”。这个过程将一直持续，直到条件变为 false。因此，如果赋值的条件始终求值为 true，你的代码可能会永远运行。\n\
  \n### for 循环\n\n通常，`for` 循环比 do-while 和 `while` 循环复杂。然而，`for` 循环可以帮助你用更少的 C# 代码完成困难的任务。`for`\
  \ 循环的语法为：\n\n```csharp\nFor (initializer; boolean_expression; update)\n{\n    The_loop’s\
  \ body;\n}\n```\n\n一个 `for` 循环有一个 `initializer`（即赋值值）、一个 `boolean_expression` 和一个更新计数器的语句。`counter`（初始值）是\
  \ `for` 循环最显著的特征。计数器增加直到达到最终值（例如 10）。此外，程序员通常知道 `for` 循环将迭代多少次。你可以在单个 `for` 中包含递增和递减变量。在，你可以包含递增和递减变量。\n\
  \n重要提示：`for` 循环的所有部分都是可选的。你可以通过留空来创建一个无限的 `for` 循环。这是一个示例：\n\n![00137.jpg](img/0137.jpeg)\n\
  \n此时，你已经准备好学习 `for` 循环的不同部分了。\n\n### initializer\n\n`for` 循环可以拥有一个 `initializer`：\n\
  \n```csharp\nFor (ule sample = 1; ...)\n{\n    // 你可以在这里使用 sample。\n}\n// 在这里不能使用\
  \ sample。\n```\n\nC# 程序在运行 `for` 循环之前执行此片段。通常，程序员使用初始化器创建一个计数器（也称为循环变量）并为其分配初始值。该计数器在循环体内是可用且可使用的。\n\
  \n### boolean_expression\n\n`for` 循环需要一个 `boolean_expression`：\n\n```csharp\nFor\
  \ (...; sample < 5; ...)\n{\n    // 这是循环体。\n}\n```\n\nC# 程序在运行循环体之前评估 `boolean_expression`。如果结果为\
  \ true，程序将执行循环体；否则，相关程序将跳转到在当前循环之后的语句。\n\n### update 语句\n\n`for` 循环还有一个更新计数器的语句：\n\
  \n```csharp\nFor (...; ...; sample++)\n{\n    // 这是循环体。\n}\n```\n\n\n\n这是 “for”\
  \ 循环的最后部分。基本上，更新语句会更新循环的计数器。让我们使用上面的代码片段：\n\n```c\nfor (int sample = 10; sample\
  \ > 1; sample--)\n{\n    // this is the loop’s body.\n}\n```\n\n程序在运行循环体后执行此部分。请记住，该语句会更新计数器的值。\n\
  \n### 循环体\n这部分由 c# 语句组成。它可以利用你在循环初始化部分声明的变量。查看下例所示：\n\n```c\nfor (int sample = 10;\
  \ sample > 1; sample--)\n{\n    Console.WriteLine(sample);\n}\n```\n\n### continue\
  \ 运算符\n在某些情况下，你需要停止当前的迭代但不结束循环本身。你可以使用 c# 中名为 “continue” 的运算符完成此任务。下面的示例将说明该运算符是如何幅工作的：\n\
  \n![00049.jpg](img/00049.jpeg)\n\n这段代码计算范围（1 到 n）内所有被 7 整除有余数的奇数总和。\n\n### “foreach”\
  \ 循环 (116)\n最近，c# 引入了 “foreach” 循环的概念（即扩展 “for” 循环）。这种循环概念也存在于其他编程语言中，如 c, v, c++,\
  \ php 等。通过这个编程工具，你可以运行列表、数组或其他值组中的所有元素。“foreach” 循环即使对于非索引数据组，也能获取所有现有的元素。\n\n在编写此类循环时，使用以下语法：\n\
  \n```c\nforeach (type name_of_variable in name_of_group)\n{\n    The_statements;\n\
  }\n```\n\n如你所见，这种循环比典型的 “for” 循环简单得多。“foreach” 循环可以帮助你快速扫描集合中的所有对象。无数程序员在编写代码时使用这种循环，这并不奇怪。\n\
  \n### 嵌套 for 循环\nC# 允许你将一个 “for” 循环放在另一个 “for” 循环内部。代码最内层的循环运行次数最多。而最外层部分的循环重复次数最少。在“嵌套”\
  \ for 循环时，你应该使用以下语法：\n\n```c\nfor (initializing_fragment, condition, update_statement)\n\
  {\n    for (initializing_fragment, condition, update_statement)\n    {\n       \
  \ Statements\n    }\n}\n```\n\n在这里，程序运行初始的 “for” 循环，执行其体并触发嵌套循环。程序将检查第二个循环的条件并执行其内部的代码，直到评估为假。然后，程序将对循环计数器进行必要的调整。程序将重复整个过程，直到所有条件都为假。\n\
  \n## 第 9 章：方法\n本章将重点介绍方法。在这里，你将学习如何在程序中声明和利用方法。你需要记忆本章包含的课程才能成为一名有效的程序员。\n\n###\
  \ 方法基础\n对于大多数程序员来说，方法是任何程序的核心方面。方法可以解决问题、接受用户输入（称为参数）并产生结果。方法简单来说是为了执行共同任务而组合在一起的一组语句。每个\
  \ c# 类至少有一个方法，即主方法。要使用方法，你必须先定义它，然后调用它来执行其预期的操作。方法完成代表程序所执行转换的任务。此外，方法是完成实际的区域区域。程序员将方法视为任何计算机程序的基本单元的主要原因。\n\
  \n### 方法提供的优势\n在本节中，你将发现方法提供的主要优势。阅读这些材料后，你将知道为什么在编写程序时应该使用这些工具。\n\n####结构和代码可读性\n\
  编程专家声称，在编写计算机程序时应该使用方法。即使是最简单的方法也可以提高你的 c# 代码的结构和可读性。这里有一个你需要知道的重要事实：程序员花费 20% 的时间编写和检查他们的计算机程序。剩下的\
  \ 80% 时间用于维护和改进软件。显然，如果你的代码具有可读性且结构良好，处理你的程序将变得轻松。\n\n### 防止冗余代码\n方法可以帮助你避免程序中的冗余代码。冗余或重复的代码通常会在计算机应用程序中产生不理想的结果。\n\
  \n### 代码重复之后\n如果你的程序需要多次使用某个代码片段，将该片段转移到 c# 方法中是一个极好的主意。你可以多次调用方法，这意味着你可以重复代码。\n\
  \n### 声明、实现和调用方法 (17)\n方法定义简单来说是对方法的声明。以下是 c# 中方法的语法：\n\n`<access_specifier><data_type_of_the_result><name_of_method>(list_of_parameters)`\n\
  {\n    method_body;\n}\n\n此时，你需要知道你可以执行的过程。这些是：\n- **声明**：在此过程中，你把方法链接到程序中。\n- **实现**：这涉及输入代码来完成方法。\n\
  - **调用**：这是调用方法的过程。在这里，你将使用方法解决问题。\n\n### 方法声明\n在 c# 中，你需要在类内部声明方法。此外，不允许“嵌套”方法（即在另一个方法内部编写方法）。此点的完美例子就是使用过多次的\
  \ `main()` 方法。\n\n```c\nclass declaringmethods\n{\n    static void main()\n    {\n\
  \        Console.WriteLine(\"hi c#!\");\n    }\n}\n```\n\n\n\nC# 不需要要求你在声明中包含参数。这意味着你可以让括号保持为空（例如\
  \ `Main()`）。\n\n### 方法名称\n\n在声明、调用或实现期间，你需要指定方法的名称。这里是你在为方法命名时需要记住的规则：\n\n*   确保首字母大大写。\n\
  *   每个单词的首字母都使用大写字母（例如 `Samplemethod`、`newmethod`、`mainline` 等）。\n*   使用动词和名词作为方法的名称。\n\
  \n**重要说明：** 上述讨论的规则完全是可选的。如果你希望你的 C# 代码具有良好的结构和可读性，请遵循这些规则。\n\n### 方法实现\n\n仅声明方法是不够的。如果你想让方法在程序内部运行，你还需要实现这些方法。程序员在指代方法的实现时使用“方法体”（body）这一术语。\n\
  \n### 方法体\n\n你会在大括号内找到方法体。该方法体由你想要执行的命令、表达式和语句组成。因此，方法体是任何方法的重要部分。\n\n**重要说明：**\
  \ 请记住，你不能在 C# 中嵌套方法。不要在另一个方法内部编写方法。\n\n### 方法调用\n\n基本上，这是运行方法体内语句的过程。调用方法非常简单易用：你只需要指定它的名称，添加一对大括号，并使用分号结束行。以下是你应该使用的语法：\n\
  \n`Name_ofmethod();`\n\n下面提供的示例代码将向你展示如何调用方法：\n\n```csharp\nClass animals\n{ \n\
  \    static void main()\n    {\n        Console.writeline(\"i love dogs.\");\n \
  \   }\n}\n```\n\n如果你编译并执行该代码，你的命令行提示将打印以下消息：\n\nI love dogs.\n\n### 可以调用方法的地方\n\n\
  C# 允许你在以下区域调用方法：\n\n*   程序的主方法内部（即 `Main()`）。\n*   在另一个方法内部。\n*   在方法自己的体内部。这种技术被称为“递归”。\n\
  \n### 递归方法调用(119)\n\n方法调用自己是可能的。这个过程被称为递归(120)。考虑下面给出的阶乘示例：\n\n```csharp\nUsing\
  \ system;\n\nNamespace methodapplication {\n    Class numerchecker {\n        Pulic\
  \ int factorial(int x) {\n            /* declaring a local variale */\n        \
  \    Int answer;\n            If (x == 1) {\n                Return 1;\n       \
  \     } else {\n                Answer = factorial(x - 1) * x;\n               \
  \ Return answer;\n            }\n        }\n        Static void main(string[] args)\
  \ {\n            Numerchecker n = new numerchecker();\n            //let's now call\
  \ the factorial method\n            Console.WriteLine(\"factorial of 8 is : {0}\"\
  , n.factorial(8));\n            Console.WriteLine(\"factorial of 9 is : {0}\", n.factorial(9));\n\
  \            Console.readline();\n        }\n    }\n}\n```\n\n我们创建了名为 `n` 的函数和类实例。代码将返回下面的结果：![0150.jpg](img/0150.jpeg)\n\
  \n代码能够为我们提供 8 和 9 的阶乘。注意，一个数的阶乘是除 0 以外所有数字的积。例如，8 的阶乘是 1*2*3*4*5*6*7*8，如上述结果所示得到\
  \ 40320。\n\n## 向方法传递参数(121)\n\n如果定义方法时带有参数，那么在调用时应向其传递参数。可以使用三种方法传递参数。让我们讨论这些方法。\n\
  \n### 值传递 (Pass value)\n\n这种方法涉及将参数的实际值复制到形式参数中。这是传递参数的默认机制。通过这种机制，在调用函数时，内存中为每个值参数创建一个新位置。将实际参数的值复制到这些位置。这意味着在方法内部对参数进行的更改将对参数没有影响。\n\
  \n让我们通过一个示例来演示：\n\n```csharp\nUsing system;\n\nNamespace methodapplication {\n \
  \   Class numerchecker {\n        Pulic void swap(int a, int ) {\n            Int\
  \ temp;\n            Temp = a; /* saving the value of a */\n            A = ; /*\
  \ putting into */\n            = temp; /* putting temp into */\n        }\n    \
  \    Static void main(string[] args) {\n            Numerchecker n = new numerchecker();\n\
  \            /* defining a local variale */\n            Int x = 10;\n         \
  \   Int y = 20;\n            Console.writeline(\"before swapping, value of x is\
  \ : {0}\", x);\n            Console.writeline(\"before swapping, value of y is :\
  \ {0}\", y);\n            /* let's swap the values calling the function */\n   \
  \         N.swap(x, y);\n            Console.writeline(\"after swapping, value of\
  \ x is : {0}\", x);\n            Console.writeline(\"after swapping, value of y\
  \ is : {0}\", y);\n            Console.readline();\n        }\n    }\n}\n```\n\n\
  代码给出了以下输出：![0095.jpg](img/00095.jpeg)\n\n我们所的是了函数内部的值。然而，上面的输出显示此更改没有生效；因此它没有反映出来。\n\
  \n### 引用传递 (Pass reference)\n\n引用参数引用与参数相同的内存。要声明引用参数，我们使用 `ref` 关键字。\n\n```csharp\n\
  Using system;\n\nNamespace methodapplication {\n    Class numerchecker {\n     \
  \   Pulic void swap(ref int a, ref int ) {\n            Int temp;\n            Temp\
  \ = a; /* saving the value of a */\n            A = ; /* putting into a */\n   \
  \         = temp; /* putting temp into */\n        }\n        Static void main(string[]\
  \ args) {\n            Numerchecker n = new numerchecker();\n            /* defining\
  \ a local variale */\n            Int x = 10;\n            Int y = 20;\n       \
  \     Console.writeline(\"before swapping, value of x is : {0}\", x);\n        \
  \    Console.writeline(\"before swapping, value of y is : {0}\", y);\n         \
  \   /* let's swap the values calling the function */\n            N.swap(ref x,\
  \ ref y);\n            Console.writeline(\"after swapping, value of x is : {0}\"\
  , x);\n            Console.writeline(\"after swapping, value of y is : {0}\", y);\n\
  \            Console.readline();\n        }\n    }\n}\n```\n\n代码返回了以下：![0177.jpg](img/0177.jpeg)\n\
  \n在值传递中，值没有交换。但在这种情况下，值已经交换了，如上所示。上述更改在主函数中得到了反映。\n\n### 输出传递 (Pass output)(122)\n\
  \nreturn 语句可以帮助我们只从函数返回一个值。然而，通过使用输出参数，可以从函数返回两个值。输出参数与引用参数相同，区别在于它们将数据传输到方法外部，而不是方法内部。\n\
  \n这里有一个演示此点的示例：\n\n\n\n\n\n```csharp\npublic void getvalue(out int a) {\n    int\
  \ temp = 20;\n    a = temp;\n}\n\nstatic void main(string[] args) {\n    numerchecker\
  \ n = new numerchecker();\n    /* defining a local variable */\n    int x = 10;\n\
  \    Console.WriteLine(\"before calling the method, value of x : {0}\", x);\n  \
  \  /* call the function to get value */\n    n.getvalue(out x);\n    Console.WriteLine(\"\
  after calling the method, the value of x is : {0}\", x);\n    Console.readline();\n\
  }\n```\n\n它返回以下内容：\n\n![00172.jpg](img/00172.jpeg)\n\n为输出参数提供的变量应该被赋值。当人们想要通过参数从方法返回值而无需为参数分配初始值时，输出参数非常有用。下面的示例将帮助你更好地理解这一点：\n\
  \n```csharp\nusing system;\n\nnamespace methodapplication {\nclass numerchecker\
  \ {\n    public void getvalues(out int a, out int b) {\n        Console.WriteLine(\"\
  enter in your first value: \");\n        a = convert.toInt32(Console.readline());\n\
  \        Console.WriteLine(\"enter in your second value: \");\n        b = convert.toInt32(Console.readline());\n\
  \    }\n\n    static void main(string[] args) {\n        numerchecker n = new numerchecker();\n\
  \        /* defining a local variable */\n        int x, y;\n        /* call a function\
  \ to obtain the values */\n        n.getvalues(out x, out y);\n        Console.WriteLine(\"\
  after calling the method, the value of x is : {0}\", x);\n        Console.WriteLine(\"\
  after calling the method, the value of y is : {0}\", y);\n        Console.readline();\n\
  \    }\n}\n}\n```\n\n系统会提示你输入两个值，请执行这些操作。你将获得它们在调用方法之前和之后的值。\n\n## 第 10 章：数组世界(123)\n\
  \n我们可以将数组定义为一种特殊的数据类型，它以顺序存储固定数量的值，并使用特殊的语法。所有数组元素必须属于相同的数据类型，例如字符串、整数、双精度浮等。你可以将数组视为存储在连续内存位置中的同类型变量集合。你使用索引来访问数组中的给定元素。\n\
  \n在内存中，最低地址标识数组中的第一个元素，而最高地址标识数组中的最后一个元素。\n\n### 声明数组(125)\n\n在 c# 中，使用以下语法声明数组：\n\
  \n`datatype[] arrayname;`\n\n`datatype` 帮助我们指定存储在数组中的元素的数据类型，不要忘记所有数组元素必须属于相同类型。方括号\
  \ `[]` 帮助说明数组的阶（rank），其中阶表示存储在数组中的大小或元素数量。`arrayname` 表示数组名称。以下是有效的数组声明示例：\n\n-\
  \ `int[] intarray;` // 可用于存储 int 值\n- `bool[] boolarray;` // 可用于存储 bool 值\n- `string[]\
  \ stringarray;` // 可用于存储字符串值\n- `double[] doublearray;` // 可用于存储 double 值\n- `byte[]\
  \ bytearray;` // 可用于存储 byte 值\n- `employee[] departmentarray; // 可用于存储 employee\
  \ 类的实例\n\n### 初始化\n\n当数组被声明后，并不意味着它已经在内存中初始化了。初始化数组后，可以对其赋值。初始化可以在声明时使用 `new` 关键字完成。当使用此关键字时，会创建一个数组的实例。演示如下：\n\
  \n```csharp\nclass myarray {\n    static void main() {\n        int[] intarray_1\
  \ = new int[4];\n        int[] intarray_2 = new int[4]{10, 20, 30};\n        int[]\
  \ intarray_3 = {10, 20, 30};\n    }\n}\n```\n\n首先，我们声明了一个存储 4 个整数的数组。注意，数组的大小是在方括号内指定的。我们在第二条语句中也做了同样的操作，并将值分配到了大括号\
  \ `{}` 中。在第三条语句中，我们声明了一个数组并在未指定大小的情况下对其赋值了值。\n\n延迟初始化\n\n可以在数组声明后对其初始化。这意味着我们不必同时完成数组的声明和初始化。这里有一个示例：\n\
  \n```csharp\nusing system;\nclass myarray {\n    static void main() {\n        string[]\
  \ array1, array2;\n        array1 = new string[4]{ \"miles\", \"john\", \"clare\"\
  };\n        array2 = new string[]{\"miles\", \"john\", \"clare\"};\n        Console.WriteLine(array1.length);\n\
  \        Console.WriteLine(array2.length);\n    }\n}\n```\n\n上述机制被称为延迟初始化。在这种情况下，初始化必须使用\
  \ `new` 关键字完成。我们不能仅仅通过给数组赋值来初始化它。下面的示例了一个无效的数组初始化：\n\n```csharp\nstring[] myarray;\n\
  myapp = {\"miles\", \"john\", \"clare\"};\n```\n\n### 访问数组元素\n\n数组的元素是在初始化期间分配的。然而，我们可以使用单个索引为数组赋值。演示如下：\n\
  \n```csharp\nusing system;\nclass myprogram {\n    static void main() {\n      \
  \  int[] array1 = new int[5];\n        array1[0] = 1;\n        array1[1] = 2;\n\
  \        array1[2] = 3;\n        array1[3] = 4;\n        array1[4] = 5;\n      \
  \  Console.WriteLine(array1[0]);\n        Console.WriteLine(array1[1]);\n      \
  \  Console.WriteLine(array1[2]);\n        Console.WriteLine(array1[3]);\n      \
  \  Console.WriteLine(array1[4]);\n    }\n}\n```\n\n代码将返回以下结果：\n\n![00046.jpg](img/0046.jpeg)\n\
  \n对数组值的检索或访问也是通过索引完成的。元素的索引放在括号内。考虑下面的示例：\n\n`array1[0];`\n`array1[1];`\n`array1[2];`\n\
  `array1[3];`\n`array1[4];`\n\n这就是我们如何访问名为 `array1` 的上方数组的所有元素。\n\n### 使用 for 循环\n\
  \n我们可以使用 `for` 循环访问数组元素。循环将遍历数组元素，同时通过它们的索引访问所需的元素。例如：\n\n```csharp\nusing system;\n\
  namespace arrayapp {\nclass myarray {\n    static void main(string[] args) {\n \
  \       int[] n = new int[10]; /* n 是一个 10 个整数的数组 */\n        int x, y;\n      \
  \  /* 初始化数组 n 的元素 */\n        for (x = 0; x < 10; x++) {\n            n[x] = x +\
  \ 50;\n        }\n        /* 输出每个数组元素的值 */\n        for (y = 0; y < 10; y++) {\n\
  \            Console.WriteLine(\"element at index[{0}] = {1}\", y, n[y]);\n    \
  \    }\n    }\n}\n}\n```\n\n\n\n\n\n## 使用 for, foreach 循环\n\n你已经知道如何使用 `for loop`\
  \ 来访问数组的所有元素。`foreach loop` 也可以帮助你遍历数组的元素。下面的示例演示了如何使用 `foreach loop` 遍历数组元素：\n\n\
  ```csharp\nUsing system;\n\nNamespace arrayapp {\n  Class myarray {\n    Static\
  \ void main(string[] args) {\n      Int [] n = new int[10]; /* n 是一个包含 10 个整数的数组\
  \ */\n      //int x, y;\n      /* 初始化数组 n 的元素 */\n      For (int x = 0; x < 10;\
  \ x++) {\n        N[ x ] = x + 100;\n      }\n      /* 输出所有数组元素的值 */\n      reach\
  \ (int y in n ) {\n        Int x = y-100;\n        Console.readline(\"element[{0}]\
  \ = {1}\", x, y);\n      }\n      Console.readline();\n    }\n  }\n}\n```\n\n该代码给出了结果：\n\
  \n`for loop` 帮助我们向数组填充了 10 个值，第一个元素是 100，最后一个是 109。`foreach loop` 帮助我们从索引 0 直接访问到最后一个索引的所有元素。注意，变量\
  \ `x` 被用于填充数组值，而变量 `y` 用于遍历数组元素。该代码返回了下方的输出：\n\n![00126.jpg](img/00126.jpeg)\n\n\
  ### 多维数组\n\nC# 支持多维数组的概念。这类数组也被称为矩形数组。多维数组是以行和列的形式组织的二维序列体。以下是一个多维数组的示例：\n\n```csharp\n\
  Int[,] array1 = new int[3,2]{\n  {1, 5},\n  {2, 5},\n  {5, 7}\n};\n// or\nInt[,]\
  \ array1 = { {1, 5}, {2, 5}, {5, 7} };\n```\n\n如你在上面的示例所示，要初始化多维数组，必须根据行数和列数来定义它。`[3,2]`\
  \ 意味着数组将有 3 行 2 列。\n\n要访问多维数组的元素，我们使用两个索引。第一个索引标识行，第二个索引标识列。注意，两个索引都从 0 开始。让我们通过示例来演示这一点：\n\
  \n```csharp\nUsing system;\n\nPulic class myarray {\n  Public static void main()\
  \ {\n    Int[,] array1 = new int[3,2]{\n      {1, 5},\n      {2, 5},\n      {5,\
  \ 7}\n    };\n    Console.readline(array1[0, 0]);\n    Console.readline(array1[0,\
  \ 1]);\n    Console.readline(array1[1, 0]);\n    Console.readline(array1[1, 1]);\n\
  \    Console.readline(array1[2, 0]);\n    Console.readline(array1[2, 1]);\n  }\n\
  }\n```\n\n该代码为我们提供了以下输出：\n\n![00169.jpg](img/0169.jpeg)\n\n这就是我们访问元素的方法。`array1[2,1]`\
  \ 返回数组第 2 行第 1 列的元素。\n\n### 锯齿数组 (Jagged arrays)\n\n锯齿数组简单来说就是数组的数组。这些数组存储的是数组而不是直接的数据类型。要初始化锯齿数组，我们使用方括号\
  \ `[][]`。在第一个括号中，我们指定数组的大小，而在第二个括号中，我们指定要作为值的数组维度。这里有一个显示锯齿数组声明和初始化的示例：\n\n```csharp\n\
  Using system;\n\nPublic class myarray {\n  Public static void main() {\n    Int[][]\
  \ jaggedarray = new int[2][];\n    Jaggedarray[0] = new int[4]{1, 2, 3, 4};\n  \
  \  Jaggedarray[1] = new int[3]{5, 6, 7};\n    Console.readline(jaggedarray[0][0]);\n\
  \    Console.readline(jaggedarray[0][2]);\n    Console.readline(jaggedarray[1][1]);\n\
  \  }\n}\n```\n\n我们在上面的代码中声明并初始化了锯齿数组。该代码将给你以下结果：\n\n![00051.jpg](img/0051.jpeg)\n\
  \n锯齿数组也可以将多维数组作为值存储。我们可以在第二个括号中使用 `[,]` 来表示多维。这里是一个示例：\n\n```csharp\nUsing system;\n\
  \nPublic class myarray {\n  Public static void main() {\n    Int[][,] jaggedarray\
  \ = new int[3][];\n    Jaggedarray[0] = new int[3, 2]{ {1, 5}, {2, 6}, {4, 8} };\n\
  \    Jaggedarray[1] = new int[2, 2]{ {3, 5}, {4, 6} };\n    Jaggedarray[2] = new\
  \ int[2, 2];\n    Console.readline(jaggedarray[0][1,1]);\n    Console.readline(jaggedarray[1][1,0]);\n\
  \    Console.readline(jaggedarray[1][1,1]);\n  }\n}\n```\n\n该代码将返回以下内容：\n\n![00123.jpg](img/0123.jpeg)\n\
  \n如果增加了额外的括号，这将变成数组的数组的数组。这在下面的示例中进行了演示：\n\n```csharp\nUsing system;\n\nPublic class\
  \ myarray {\n  Public static void main() {\n    Int[][][] jaggedarray = new int[2][][]\
  \ {\n      New int[2][] {\n        New int[3] {2, 3, 5},\n        New int[2] {1,\
  \ 5}\n      },\n      New int[1][] {\n        New int[3] {7, 6, 8}\n      }\n  \
  \  };\n    Console.readline(jaggedarray[0][0][0]);\n    Console.readline(jaggedarray[0][1][1]);\n\
  \    Console.readline(jaggedarray[1][0][2]);\n  }\n}\n```\n\n该代码返回以下内容：\n\n![00133.jpg](img/0133.jpeg)\n\
  \n注意我们使用了三个方括号 `[][][]`，这意味着数组的数组的数组。`jaggedarray` 将拥有元素。这些数组也都只有一个维度。\n\n## 第 11\
  \ 章：类 (classes)\n\n类可以被看作对象的蓝图。现实世界中的对象具有形状、速度等特征。例如，`car` 是一个对象。这意味着 `car` 是一个类，而每个对象都是\
  \ `car` 类型。\n\n在面向对象编程中（不要忘记 C# 是一种面向对象的语言），类拥有字段、属性、方法等。类应该定义数据的类型以及对象应该的功能。\n\n\
  通过类，你可以创建自定义类型，将其他类型的变量以及方法和事件在一起。\n\n在 C# 中，我们使用 `class` 关键字来定义 `class`。这是一个关于它的简单示例：\n\
  \n```csharp\nPublic class testclass {\n  Public string field1 = string.empty;\n\
  \  Public testclass() {\n  }\n  Public void testmethod(int param1, string param2)\
  \ {\n    Console.readline(\"the first parameter is {0}, and second parameter is\
  \ {1}\", Param1, param2);\n  }\n  Public int autoimplementedpropertytest { get;\
  \ set; }\n  Private int propertyvar;\n  Public int propertytest {\n    Get { return\
  \ propertyvar; }\n    Set { propertyvar = value; }\n  }\n}\n```\n\n类前面的 `public`\
