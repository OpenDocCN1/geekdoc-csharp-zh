  \n## 封装与成员函数\n\n类的成员函数仅仅是在类定义内部具有定义或原型定义的函数，这与其他任何函数的方式相同。这种函数可以在其所属类的任何对象上进行操作，并且它可以访问该对象的所有类成员。\n\
  \n成员函数仅仅是对象的属性（从设计角度来看），它们被定义为私有（private），以便实现封装的概念。我们只能通过公共成员函数访问此类变量。让我们演示如何在\
  \ c# 中设置和访问类的各种成员：：\n\n```csharp\nUsing system;\n\nNamespace cueapplication {\n\n\
  Class cue {\n\nPrivate double length;  // length of a cue\n\nPrivate double readth;\
  \  // readth of a cue\n\nPrivate double height;  // height of a cue\n\nPulic void\
  \ setlength( double len ) {\n\nLength = len;\n\n}\n\nPulic void setreadth( double\
  \ rea ) {\n\nReadth = rea;\n}\n\nPulic void setheight( double heig ) {\n\nHeight\
  \ = heig;\n}\n\nPulic double getvolume() {\n\nReturn length * height;\n}\n\nClass\
  \ cuetester {\n\nStatic void main(string[] args) {\n\nCue cue1 = new cue();  //\
  \ declare cue1 of type cue\n\nCue cue2 = new cue();\n\nDouble volume;  // declare\
  \ cue2 of type\n\n// cue 1 specification\n\nCue1.setlength(4.0);\n\nCue1.setreadth(6.0);\n\
  \nCue1.setheight(8.0);\n\n// cue 2 specification\n\nCue2.setlength(10.0);\n\nCue2.setreadth(14.0);\n\
  \nCue2.setheight(12.0);\n\n// volume of cue 1\n\nVolume = cue1.getvolume();\n\n\
  Console.writeline(\"volume of cue1 is: {0}\", volume);\n\n// volume of cue 2\n\n\
  Volume = cue2.getvolume();\n\nConsole.writeline(\"volume of cue2 is: {0}\", volume);\n\
  \nConsole.readkey();\n\n}\n\n}\n```\n\n这里是代码的输出：\n\n![00008.jpg](img/00008.jpeg)\n\
  \n我们使用了 setter 方法（set 方法）来设置两个 cue 的各种属性值。调用了 getvolume() 函数来计算两个 cue 的体积。\n\n##\
  \ 构造函数\n\n构造函数仅仅是类的一种特殊成员函数，每当我们创建类的新对象时就会运行。构造函数采用类名，并且它不应该有返回值。以下示例演示了如何在 c# 中使用构造函数：\n\
  \n```csharp\nUsing system;\n\nNamespace constructorapplication {\n\nClass person\
  \ {\n\nPrivate double height;  // height of the person\n\nPerson() {\n\nConsole.writeline(\"\
  we are creating an object\");\n}\n\nPulic void setheight( double heig ) {\n\nHeight\
  \ = heig;\n}\n\nPulic double getheight() {\n\nReturn height;\n}\n\nStatic void main(string[]\
  \ args) {\n\nPerson p = new person();\n\n// set the person's height\n\nP.setheight(7.0);\n\
  \nConsole.writeline(\"the height of the person is: {0}\", p.getheight());\n\nConsole.readkey();\n\
  \n}\n\n}\n```\n\n代码将返回以下内容：\n\n![00174.jpg](img/00174.jpeg)\n\n默认构造函数没有参数，但可以向构造函数添加参数。这种构造函数被称为参数化构造函数。通过这种技术，可以在创建对象时为对象分配初始值。这里是一个示例：\n\
  \n```csharp\nUsing system;\n\nNamespace constructorapplication {\n\nClass person\
  \ {\n\nPrivate double height;  // height of the person\n\nPerson(double heig) {\
  \  //a parameterized constructor\n\nConsole.writeline(\"we are creating an object,\
  \ height = {0}\", heig);\n\nHeight = heig;\n}\n\nPulic void setheight( double heig\
  \ ) {\n\nHeight = heig;\n}\n\nPulic double getheight() {\n\nReturn height;\n}\n\n\
  Static void main(string[] args) {\n\nPerson p = new person(8.0);\n\n// set the height\n\
  \nConsole.writeline(\"the height of the person is: {0}\", p.getheight());\n\nConsole.readkey();\n\
  \n}\n\n}\n```\n\n以下是输出：\n\n![00078.jpg](img/00078.jpeg)\n\n## 析构函数\n\n析构函数是指类的一种特殊成员函数，每当对象超出作用范围时就会运行。析构函数的名称与类名相同，但前面应该有一个波浪号（~）。析构函数不能接受参数，也不能返回值。析构函数在离开程序之前释放资源非常有用。以下示例演示了如何使用：\n\
  \n```csharp\nUsing system;\n\nNamespace constructorapplication {\n\nClass person\
  \ {\n\nPrivate double height;  // height of the person\n\nPerson() {\n\nConsole.writeline(\"\
  we are creating an object\");\n}\n\n~person() { //a destructor\n\nConsole.writeline(\"\
  we are deleting an object\");\n}\n\nPulic void setheight( double heig ) {\n\nHeight\
  \ = heig;\n}\n\nPulic double getheight() {\n\nReturn height;\n}\n\nStatic void main(string[]\
  \ args) {\n\nPerson p = new person();\n\n// set the person's height\n\nP.setheight(7.0);\n\
  \nConsole.writeline(\"the height of the person is: {0}\", p.getheight());\n\nConsole.readkey();\n\
  \n}\n\n}\n```\n\n\n\n\n`static` 关键字的使用意味着类中仅存在一个实例。当我们我们需要声明常量时使用此关键字，因为可以在不创建实例的情况下通过调用类来获取它们的值。我们可以在类定义或成员函数之外初始化静态变量。静态变量也可以在类定义内部初始化。\n\
  \n让我们通过一个示例来演示静态变量的使用：\n\n```csharp\nUsing system;\n\nNamespace staticapp {\n  \
  \  Class staticvariales {\n        Public static int x;\n\n        Public void count()\
  \ {\n            X++;\n        }\n\n        Public int getx() {\n            Return\
  \ x;\n        }\n    }\n\n    Class statictester {\n        Static void main(string[]\
  \ args) {\n            Staticvariales var1 = new staticvariales();\n           \
  \ Staticvariales var2 = new staticvariales();\n            Var1.count();\n     \
  \       Var1.count();\n            Var1.count();\n            Var2.count();\n  \
  \          Var2.count();\n            Var2.count();\n            Console.WriteLine(\"\
  variable x for var1 is: {0}\", var1.getx());\n            Console.WriteLine(\"variable\
  \ x for vars is: {0}\", var2.getx());\n            Console.readkey();\n        }\n\
  \    }\n}\n```\n\n代码返回以下结果：\n\n![00055.jpg](img/00055.jpeg)\n\n成员函数也可以被声明为静态的。此类函数将能够访问静态变量。静态函数在对象创建之前就已经存在。静态函数的使用如如下示例所示：\n\
  \n```csharp\nUsing system;\n\nNamespace staticappli {\n    Class staticvariale {\n\
  \        Public static int x;\n\n        Public void count() {\n            X++;\n\
  \        }\n\n        Public static int getx() {\n            Return x;\n      \
  \  }\n    }\n\n    Class statictester {\n        Static void main(string[] args)\
  \ {\n            Staticvariale var = new staticvariale();\n            Var.count();\n\
  \            Var.count();\n            Var.count();\n            Console.WriteLine(\"\
  variable x is: {0}\", staticvariale.getx());\n            Console.readkey();\n \
  \       }\n    }\n}\n```\n\n代码将返回以下：\n\n![00045.jpg](img/00045.jpeg)\n\n## 第 12\
  \ 章：结构\n\nC# 中的结构（structure）是一种值类型数据类型。通过结构，你可以使用单个变量持有属于不同数据类型的相关数据。在 C# 中，我们使用\
  \ `struct` 关键字创建结构(128)。\n\n结构用于跟踪记录。一个很好的例子是你需要保留所有级学生或所有公司员工的记录。在存储学生记录的情况下，你可能需要跟踪的一些细节包括姓名、年龄、课程、入学日期、毕业日期、已付费用、余额等、监护人地址和手机号码等。所有这些细节都属于不同的数据类型，这意味着你将需要为每一个细节创建一个变量。然而，使用结构，你可以定义单个变量并将这些细节整合在一起。这里是一个声明结构的示例(29)：\n\
  \n```csharp\nStruct employee {\n    Public string name;\n    Public string department;\n\
  \    Public string title;\n    Public int age;\n    Public double salary;\n};\n\
  ```\n\n要初始化一个结构体，可以选择使用 `new` 关键字也可以不使用。结构体的成员可以如所示进行赋值：\n\n```csharp\nUsing system;\n\
  \nPublic class mystruct {\n    Public static void main() {\n        Employee emp\
  \ = new employee()\n        emp.name = \"nich samuel\";\n        emp.department\
  \ = \"computing\";\n        emp.age = 26;\n        emp.salary = 5000;\n        Console.WriteLine(emp.name);\n\
  \        Console.WriteLine(emp.department);\n        Console.WriteLine(emp.age);\n\
  \        Console.WriteLine(emp.salary);\n    }\n}\n\nPublic struct employee {\n\
  \    Public string name { get; set; }\n    Public string department { get; set;\
  \ }\n    Public string title { get; set; }\n    Public int age { get; set; }\n \
  \   Public double salary { get; set; }\n}\n```\n\n代码给出以下结果：\n\n![00012.jpg](img/00012.jpeg)\n\
  \n名为 `employee` 的结构使用 `struct` 关键字定义。该结构的各种细节都已在其中声明。在类的顶部，我们创建了该结构的一个实例并将其命名为 `emp`。该实例已用于访问结构体的各种属性以显示在屏幕上。注意，结构是一种值类型，这使得它与类对象相比速度更快。这使得它们在编程中非常好用。然而，人们可以更容易地传输类对象而不是结构体。这意味着当需要将数据传输到其他类时，不应使用结构。这里是\
  \ C# 中另一个结构示例：\n\n```csharp\nUsing system;\n\nStruct cars {\n    Public string model;\n\
  \    Public int cc;\n    Public int passengers;\n    Public int year;\n};\n\nPublic\
  \ class carstructure {\n    Public static void main(string[] args) {\n        Cars\
  \ premio; /* declare premio of type car */\n        Cars x6; /* declare x6 of type\
  \ car */\n        /* premio, specification */\n        premio.model = \"salo\";\n\
  \        premio.cc = 1800;\n        premio.passengers = 5;\n        premio.year\
  \ = 2010;\n        /* x6 specification */\n        x6.model = \"salo\";\n      \
  \  x6.cc = 3500;\n        x6.passengers = 5;\n        x6.year = 2012;\n        /*\
  \ print premio, info, */\n        Console.WriteLine(\"premio, model: {0}\", premio.model);\n\
  \        Console.WriteLine(\"premio, cc : {0}\", premio.cc);\n        Console.WriteLine(\"\
  premio, passengers : {0}\", premio.passengers);\n        Console.WriteLine(\"premio,\
  \ year :{0}\", premio.year);\n        /* print x6 info, */\n        Console.WriteLine(\"\
  x6 model: {0}\", x6.model);\n        Console.WriteLine(\"x6 cc: {0}\", x6.cc);\n\
  \        Console.WriteLine(\"x6 passengers: {0}\", x6.passengers);\n        Console.WriteLine(\"\
  x6 year: {0}\", x6.year);\n        Console.readkey();\n    }\n}\n```\n\n代码将返回以下细节：\n\
  \n![00012.jpg](img/00012.jpeg)\n\n### 结构的特征\n\n到目前为止，你已经了解如何使用结构以及它们的一些特性。C# 中的结构与\
  \ C 和 C++ 支持的结构有很大区别。C# 结构具有以下特征：\n\n- 结构可以拥有字段、索引器、方法、属性和事件。\n- 结构可以定义构造函数，但没有析构函数。然而，在结构中，我们不允许定义默认构造函数。这是因为它是自动定义的，且无法更改。\n\
  - 结构不能继承另一个结构或类。\n- 通过结构，我们可以实现一个或多个接口。\n- 结构的成员不能被指定为虚（virtual）、抽象（abstract）或保护（protected）。\n\
  \n\n\n\n\n- 如果我们不使用 `new` 运算符，字段将不会被赋值，并且在对所有字段完成赋值之前，无法使用该对象。\n\n### 结构体 vs 类\n\
  \n以下是结构体（struct）与类（class）之间的差异：\n\n- `struct` 被解释为值类型。另一方面，`class` 被定义为引用类型。\n-\
  \ 结构体不支持继承。类支持。\n- `struct` 不能有默认构造函数。`class` 可以有。\n\n让我们根据上述差异创建一个示例：\n\n```csharp\n\
  Using system;\n\nStruct cars {\n    Private string model;\n    Private int cc;\n\
  \    Private int passengers;\n    Private int year;\n    Public void getvalues(string\
  \ m, int c, int p, int yr) {\n        Model = m;\n        Cc = c;\n        Passengers\
  \ = p;\n        Year = yr;\n    }\n    Public void show() {\n        Console.WriteLine(\"\
  car model : {0}\", model);\n        Console.WriteLine(\"cc : {0}\", cc);\n     \
  \   Console.WriteLine(\"passengers : {0}\", passengers);\n        Console.WriteLine(\"\
  year :{0}\", year);\n    }\n};\n\nPublic class mystructure {\n    Public static\
  \ void main(string[] args) {\n        Cars premio = new cars(); /* declare premio\
  \ of type cars */\n        Cars x6 = new cars(); /* declare x6 of type cars */\n\
  \        /* premio specification */\n        Premio.getvalues(\"salo\", 1800, 5,\
  \ 2012);\n        /* x6 specification */\n        X6.getvalues(\"salo\", 3500, 5,\
  \ 2012);\n        /* print premio info, */\n        Premio.show();\n        /* print\
  \ x6 info, */\n        X6.show();\n        Console.readkey();\n    }\n}\n```\n\n\
  代码在执行后将得到以下输出：\n\n![00038.jpg](img/00038.jpeg)\n\n## 第 13 章：封装\n\n封装是将项目封装在逻辑或物理包中的过程。在面向对象编程中，封装被用于防止对实现细节的访问。\n\
  \n封装和抽象是面向对象编程中密切相关的特性。抽象的目的是让相关细节对用户可见，而封装的目的是让程序员能够实现所需的抽象级别。\n\n为了实现封装，我们使用访问修饰符。访问修饰符的作用说明类成员的可见性和范围。C#\
  \ 支持不同类型的访问修饰符，它们包括：\n\n- public\n- protected\n- private\n- protected internal\n\
  - internal\n\n### private 访问修饰符\n\n使用 `private` 访问修饰符，类能够向其他对象和函数隐藏其成员和成员变量。只有相似类的函数能够访问其私有成员。类的实例无法访问该类的私有成员。考虑下面的示例：\n\
  \n```csharp\nUsing system;\n\nNamespace accession {\n    Class figure {\n      \
  \  // the class member variables\n        Private width;\n        Private length;\n\
  \        Public void getdetails() {\n            Console.WriteLine(\"enter the length:\
  \ \");\n            Length = Convert.ToInt32(Console.readline());\n            Console.WriteLine(\"\
  enter the width: \");\n            Width = Convert.ToInt32(Console.readline());\n\
  \        }\n        Public void calculatearea() {\n            Return length * width;\n\
  \        }\n        Public void show() {\n            Console.WriteLine(\"the length\
  \ of the figure is: {0}\", length);\n            Console.WriteLine(\"the width of\
  \ the figure is: {0}\", width);\n            Console.WriteLine(\"the area of the\
  \ figure is: {0}\", calculatearea());\n        }\n    }//end the class figure\n\n\
  \    Class runfigure {\n        Static void main(string[] args) {\n            Figure\
  \ f = new figure();\n            F.getdetails();\n            F.show();\n      \
  \      Console.readline();\n        }\n    }\n}\n```\n\n以下是代码的输出：\n\n![00081.jpg](img/00081.jpeg)\n\
  \n类成员变量 `width` 和 `length` 被声明为 `private`，这意味着在创建类实例后，我们可以从 `main()` 函数访问它们。我们创建了\
  \ `figure` 类的实例并将其命名为 `f`。\n\n`calculatearea()` 和 `show()` 成员函数能够在不使用类实例的情况下访问这些成员变量。我们也可以在创建\
  \ `figure` 类的实例后，从 `main()` 函数访问它们。该实例已被命名为 `f`。\n\n### public 访问修饰符\n\n使用 `public`\
  \ 访问修饰符，类能够向其他对象和函数暴露其成员函数和成员变量。任何声明为 `public` 的类成员都可以从该类的外部访问。考虑以下示例：\n\n```csharp\n\
  Using system;\n\nNamespace figureapplication {\n    Class figure {\n        // the\
  \ class member variables\n        Public width;\n        Public length;\n      \
  \  Public void calculatearea() {\n            Return length * width;\n        }\n\
  \        Public void show() {\n            Console.WriteLine(\"the length of the\
  \ figure is: {0}\", length);\n            Console.WriteLine(\"the width of the figure\
  \ is: {0}\", width);\n            Console.WriteLine(\"the area of the figure is:\
  \ {0}\", calculatearea());\n        }\n    }//end the figure class\n\n    Class\
  \ runfigure {\n        Static void main(string[] args) {\n            Figure f =\
  \ new figure();\n            F.length = 5.4;\n            F.width = 3.2;\n     \
  \       F.show();\n            Console.readline();\n        }\n    }\n}\n```\n\n\
  ### protected 访问修饰符\n\n这种 `protected` 访问修饰符使得子类能够访问基类中定义的成员函数和变量。这将在继承中讨论。\n\n###\
  \ internal 访问修饰符\n\n这种 `internal` 访问修饰符允许在定义它的程序集（assembly）内的任何代码访问该成员。\n\n\n\n\n\
  通过继承，程序员可以根据一个类定义另一个类。这使得我们能够重用代码并缩短实现应用程序的时间。\n\n在创建类过程中，程序员不需要创建完全新的成员函数和数据成员，而是指定新类继承已存在类的成员。现有类被称为基类（base\
  \ class），而新类被称为派生类（derived class）。\n\n继承简单来说是“是一种”（is-a）关系的实现。例如，牛是一种哺乳动物。\n\n一个类可以继承自多个类或接口，这意味着它可以从许多基接口或类中继承数据和函数。以下示例演示了基类和派生类的概念：\n\
  \n```csharp\nUsing system;\n\nNamespace inheritanceapp {\n\nClass figure {\n\n \
  \   Public void setwidth(int wid) {\n        Width = wid;\n    }\n\n    Public void\
  \ setheight(int heig) {\n        Height = heig;\n    }\n\n    Protected int width;\n\
  \n    Protected int height;\n}\n\n// a derived class\nClass rectangle: figure {\n\
  \    Public int calculatearea() {\n        Return (width * height);\n    }\n}\n\n\
  Class testinheritance {\n    Static void main(string[] args) {\n        Rectangle\
  \ r = new rectangle();\n        R.setwidth(6);\n        R.setheight(8);\n      \
  \  // print the rectangle's area.\n        Console.writeline(\"the area is: {0}\"\
  , r.calculatearea());\n        Console.readkey();\n    }\n}\n\n}\n```\n\n代码应返回以下输出：\n\
  \n![00189.jpg](img/00189.jpeg)\n\n我们定义了 `figure` 类，包含两个属性，即 `width` 和 `height`。该类还有两个方法，`setwidth()`\
  \ 和 `setheight()`。然后我们定义了一个名为 `rectangle` 的类。注意我们创建此类时所使用的语法：\n\n`Class rectangle:\
  \ figure {`\n\n使用完整的冒号表示 `rectangle` 类正在继承 `figure` 类。`rectangle` 类仅有一个方法，即 `calculatearea()`\
  \ 方法。然而，由于它继承了 `figure` 类，意味着它拥有 `figure` 类的所有属性，如 `width` 和 `height`。\n\n随后我们创建了\
  \ `testinheritance` 类。在 `main()` 方法中，创建了 `rectangle` 类的实例并将其命名为 `r`。我们使用该实例来访问在\
  \ `rectangle` 和 `figure` 类中定义的属性。这就是继承的强大之处！\n\n### 基类初始化\n\n派生类继承基类中定义的方法和变量。这意味着我们应该在创建子类之前创建父类。给出的程序演示了成员列表初始化的继承：\n\
  \n```csharp\nUsing system;\n\nNamespace inheritanceapp {\n\nClass object {\n// the\
  \ member variables\n    Protected double width;\n\n    Protected double length;\n\
  \n    Public object(double len, double wid) {\n        Width = wid;\n        Length\
  \ = len;\n    }\n\n    Public double calculatearea() {\n        Return length *\
  \ width;\n    }\n\n    Public void show() {\n        Base.show();\n        Console.writeline(\"\
  the width of the figure is: {0}\", width);\n        Console.writeline(\"the length\
  \ of the figure is: {0}\", length);\n        Console.writeline(\"the area of the\
  \ figure is: {0}\", calculatearea());\n    }\n}//end class figure\nClass carpet\
  \ : object {\n    Private double cost;\n\n    Public carpet(double len, double wid)\
  \ : base(len, wid) { }\n\n    Public double calculatecost() {\n        Double cost;\n\
  \        cost = calculatearea() * 120;\n        Return cost;\n    }\n\n    Public\
  \ void show() {\n        Base.show();\n        Console.writeline(\"the total cost\
  \ for the carpet is: {0}\", calculatecost());\n    }\n}\n\nClass run {\n    Static\
  \ void main(string[] args) {\n        Carpet c = new carpet(7.5, 9.5);\n       \
  \ C.show();\n        Console.readline();\n    }\n}\n\n}\n```\n\n代码将返回以下输出：\n\n![00092.jpg](img/00092.jpeg)\n\
  \n### 多重继承\n\nC# 不支持多重继承。但是通过接口，我们可以实现多重继承。考虑以下示例：\n\n```csharp\nUsing system;\n\
  \nNamespace inheritanceapp {\n\nClass object {\n    Public void setwidth(int wid)\
  \ {\n        Width = wid;\n    }\n\n    Public void setheight(int heig) {\n    \
  \    Height = heig;\n    }\n\n    Protected int width;\n\n    Protected int height;\n\
  }\n\n// paintcost for the base class\nPublic interface paintcost {\n    Int calculatecost(int\
  \ area);\n}\n\n// the derived class\nClass o : object,paintcost {\n    Public int\
  \ calculatearea() {\n        Return (width * height);\n    }\n\n    Public int calculatecost(int\
  \ area) {\n        Return area * 120;\n    }\n}\n\nClass inheritancetester {\n \
  \   Static void main(string[] args) {\n        O = new o();\n        Int area;\n\
  \        .setwidth(5);\n        .setheight(7);\n        Area = .calculatearea();\n\
  \        // show the area of the object\n        Console.writeline(\"the area of\
  \ the object is: {0}\", .calculatearea());\n        Console.writeline(\"the total\
  \ printing cost is: ${0}\", .calculatecost(area));\n        Console.readkey();\n\
  \    }\n}\n\n}\n```\n\n代码给出以下输出：\n\n![00084.jpg](img/00084.jpeg)\n\n## 第 15 章：多态\n\
  \n多态（Polymorphism）是一个意味着多种形式的术语。在编程中，它表现为“一个接口，多个函数”。多态可以有两种形式：静态或动态。对于静态多态，绑定在编译时确定。它也被称为函数重载。我们可以在同一个作用范围内对同一个函数名有多个定义。这些函数之间的区别在于它们接收的参数类型或数量。函数声明不能通过不同的返回类型来重载。\n\
  \n\n\n\n我们有 `display()` 函数的三种定义。在这种情况下，重载是通过改变函数接收的参数类型来实现的。在一种实例中，函数接收整数值；在另一个实例中接收浮点数，在最后一个实例中接收字符串。\n\
  \n## 运算符重载\n\n运算符重载是指使用单个运算符来执行各种操作。通过运算符重载，可以在 C# 运算符应用于自定义类型时为其添加额外功能。当操作数中的一个或两个属于用户定义的类时，就是这种情况。\n\
  \n这里是一个演示此种点的示例：\n\n```csharp\nusing system;\n\nnamespace polymorphismapp {\n  \
  \  class object {\n        private double width; // the width of the ox\n      \
  \  private double length; // the length of the ox\n        private double height;\
  \ // the height of the ox\n\n        public double calculateVolume() {\n       \
  \     return width * length * height;\n        }\n\n        public void setLength(double\
  \ l) {\n            length = l;\n        }\n\n        public void setWidth(double\
  \ w) {\n            width = w;\n        }\n\n        public void setHeight(double\
  \ h) {\n            height = h;\n        }\n\n        // overload the + operator\
  \ to add 2 objects.\n        public static object operator+(object oj1, object oj2)\
  \ {\n            object o = new object();\n            o.length = oj1.length + oj2.length;\n\
  \            o.width = oj1.width + oj2.width;\n            o.height = oj1.height\
  \ + oj2.height;\n            return o;\n        }\n    }\n\n    class oxtester {\n\
  \        static void main(string[] args) {\n            object object1 = new object();\
  \ // declare object1 of type object\n            object object2 = new object();\
  \ // declare object2 of type object\n            object object3 = new object();\
  \ // declare object3 of type object\n            double volume = 0.0; // store volume\
  \ of the object here\n\n            // object 1 dimensions\n            object1.setLength(7.0);\n\
  \            object1.setWidth(8.0);\n            object1.setHeight(10.0);\n\n  \
  \          // object 2 dimensions\n            object2.setLength(6.0);\n       \
  \     object2.setWidth(9.0);\n            object2.setHeight(11.0);\n\n         \
  \   // calculate the volume of object 1\n            volume = object1.calculateVolume();\n\
  \            Console.WriteLine(\"the volume of object1 : {0}\", volume);\n\n   \
  \         // calculate the volume of object 2\n            volume = object2.calculateVolume();\n\
  \            Console.WriteLine(\"the volume of object2 : {0}\", volume);\n\n   \
  \         // add the two objects\n            object3 = object1 + object2;\n\n \
  \           // calculate the volume of object 3\n            volume = object3.calculateVolume();\n\
  \            Console.WriteLine(\"the volume of object3 : {0}\", volume);\n     \
  \       Console.ReadKey();\n        }\n    }\n}\n```\n\n该代码返回以下输出：\n\n![00060.jpg](img/00060.jpeg)\n\
  \n我们重载了 `+` 运算符。该运算符被用于两个数值类型的相加。然而，在上面的示例中，我们使用该运算符将两个对象相加，即 `object1` 和 `object2`。这得到了\
  \ `object3`。`object1` 和 `object2` 是自定义类型，意味着我们使用 `+` 运算符来相自定义类型。注意，虽然在 C# 中可以重载运算符，但并不是所有运算符都可以重载。例如，你不能重载如\
  \ `==`、`!=`、`>=`、`<=`。对于 `&&` 和 `||` 等逻辑运算符，我们不能直接重载它们。\n\n## 多态\n\n在 C# 中，我们可以创建抽象类来实现接口的部分实现。这种完成是在派生类继承后实现的。抽象类具有抽象方法，派生类实现这些方法。然而，派生类具有更专门的功能。注意，你不能创建任何抽象类的实例。如果一个\
  \ C# 类被声明为密封（sealed），意味着该类不能被继承。但是，不允许声明抽象类。这里有一个抽象类的示例：\n\n```csharp\nusing system;\n\
  \nnamespace polymorphismapp {\n    abstract class object {\n        abstract int\
  \ area();\n    }\n\n    class object1 : object {\n        private int width;\n \
  \       private int length;\n        public object1(int x = 0, int y = 0) {\n  \
  \          length = x;\n            width = y;\n        }\n        public override\
  \ int area() {\n            Console.WriteLine(\"the area of object1 is:\");\n  \
  \          return width * length;\n        }\n    }\n\n    class object2 : object\
  \ {\n        public object2(int x = 0, int y = 0) {\n            width = x;\n  \
  \          height = y;\n        }\n        public override int area() {\n      \
  \      Console.WriteLine(\"the area of object2 is:\");\n            return width\
  \ * height / 2;\n        }\n    }\n\n    class caller {\n        public void callarea(object\
  \ obj) {\n            int x;\n            x = obj.area();\n            Console.WriteLine(\"\
  the area is: {0}\", x);\n        }\n    }\n\n    class testerclass {\n        static\
  \ void main(string[] args) {\n            caller c = new caller();\n           \
  \ object1 o1 = new object1(10, 7);\n            object2 o2 = new object2(10, 5);\n\
  \            c.callarea(o1);\n            c.callarea(o2);\n            Console.ReadKey();\n\
  \        }\n    }\n}\n```\n\n该代码返回以下输出：\n\n![00079.jpg](img/00079.jpeg)\n\n## 第\
  \ 16 章：正则表达式 (134)\n\n正则表达式被解释为可以与输入文本匹配的模式。在 .net 框架中，有一个正则表达式引擎可以用于这种匹配。模式由一个或多个运算符、字符字面量或结构组成。\n\
  \n### Regex 类\n\n这是一个用于表示正则表达式的类。该类带有许多如下函数：\n\n1. `Match(string input)`：方法指定构造函数中指定的正则表达式是否在输入字符串中匹配项。\n\
  2. `Match(string input, int startpos)`：方法指定构造函数中指定的正则表达式是否从输入字符串中的指定位置开始匹配项。\n3.\
  \ `static Match(string input, int pattern)`：静态方法指定指定的正则表达式是否在输入字符串中匹配项。\n\n\n\n\n\
  \n## 4. `public Collection.matches(string input, string replacement)` - 这会将输入字符串中的匹配项替换为指定的替换字符串。\n\
  \n## 5. `public string[] split(string input)` - 此函数帮助将输入字符串拆分为子字符串数组，拆分的位置由正则 构造函数中指定的正则表达式模式定义的。\n\
  \n考虑下面给出的示例：\n\n```csharp\nusing system.text.regularexpressions;\nusing system;\n\
  \nnamespace regexpapp {\n    class myprogram {\n        private static void findmatch(string\
  \ input, string exp) {\n            Console.readline(\"the expression is: \" + exp);\n\
  \            Collection mc = regex.matches(input, exp);\n            foreach (match\
  \ x in mc) {\n                Console.readline(x);\n            }\n        }\n\n\
  \        static void main(string[] args) {\n            String s = \"splitting an\
  \ input string into substrings\";\n            Console.readline(\"match words that\
  \ begin with 's': \");\n            Findmatch(s, \"\\s\\s*\");\n            Console.readkey();\n\
  \        }\n    }\n}\n```\n\n匹配后，代码将返回以下内容：\n\n![00113.jpg](img/00113.jpeg)\n\n\
  输出显示从输入字符串中匹配了三个单词。我们正在匹配任何以 s 开头的单词，并发现了其中三个。\n\n考虑下一个给出的示例：\n\n```csharp\nusing\
  \ system.text.regularexpressions;\nusing system;\n\nnamespace regexpapp {\n    class\
  \ myprogram {\n        private static void findmatch(string input, string exp) {\n\
  \            Console.readline(\"the input expression is: \" + exp);\n          \
