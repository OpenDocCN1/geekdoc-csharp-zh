  \n代码返回如下：\n\n![00067.jpg](img/00067.jpeg)\n\n我们在代码中中所做的是替换额外的空格。在 \"hi\" 和 \"learner\"\
  \ 之间有一个空格。多余的那个已经被替换或删除。\n\n## 第 17 章：异常处理过程 (135)\n\n应用程序在执行过程中通常会遇到错误。错误发生后，程序会抛出一个带有更多有关错误信息的异常。应该处理异常以防止程序崩溃。在\
  \ c# 中，异常使用 4 个主关键字进行处理：\n\n1. Try- 此关键字标识了激活特定异常的代码块。其后紧跟跟一个或多个 catch 块。\n2. Catch-\
  \ 程序应该在程序内部需要处理问题的地方使用处理器捕获异常。catch 是一个关键字，指示异常将在此处捕获。\n3. Finally- finally 块用于无论是否抛出异常都执行一组语句。例如，无论是否抛出异常，文件在打开后都必须关闭。\n\
  4. Throw- 异常通常在问题发生后后被抛出。使用 try 和 catch 的组合来捕获异常。try/catch 块必须放置在可能引发异常的代码处。此类代码被称为“受保护的代码”，这里是使用这些关键字的语法：\n\
  \n```\ntry {\n    // 抛出异常的语句\n} catch (exception name1) {\n    // 错误处理代码\n} catch\
  \ (exception name2) {\n    // 错误处理代码\n} catch (exception name3) {\n    // 错误处理代码\n\
  } finally {\n    // 要执行的语句\n}\n```\n\n可以使用许多 catch 语句，目标是捕获 try 块中抛出的许多不同的异常。在 c#\
  \ 中，异常使用类来表示。`system.exception`充充 c# 中所有异常类的基类，因为所有其他类都直接或间接地派生自它。\n\n### 处理异常\n\
  \n在 c# 中，可以使用 try 和 catch 块来处理异常。通过这些块，我们可以将核心程序语句与处理错误的语句分离。我们可以使用 try、catch 和\
  \ finally 关键字来处理错误。例如，除法 y 应该抛出一个异常，因为它在数学上是不支持的。让我们创建一些代码来处理这种情况：\n\n```csharp\n\
  using system;\n\nnamespace exceptionhandlingapp {\n    class divisionclass {\n \
  \       Int answer;\n        divisionclass() {\n            Answer = 0;\n      \
  \  }\n\n        public void division(int x, int y) {\n            try {\n      \
  \          Answer = x / y;\n            } catch (divideyzero,exception exception)\
  \ {\n                Console.readline(\"exception caught: {0}\", exception);\n \
  \           } finally {\n                Console.readline(\"answer: {0}\");\n  \
  \          }\n        }\n\n        static void main(string[] args) {\n         \
  \   divisionclass dc = new divisionclass();\n            Dc.division(12, 0);\n \
  \           Console.readkey();\n        }\n    }\n}\n```\n\n代码应该返回下方的异常：\n\n![0181.jpg](img/0181.jpeg)\n\
  \n我们创建了 `division()` 函数，它接受两个整数参数 x 和 y。然后我们将 12 和 0 传递给该函数，这意味着我们将把 12 除以 0。然而，这产生了一个异常。\n\
  \n### 自定义异常\n\nC# 允许允许程序员定义他们自己的异常。我们从异常类派生出此类自定义异常类。考虑下面给出的示例：\n\n```csharp\nusing\
  \ system;\n\nnamespace exceptionhandlingapp {\n    class temperaturetest {\n   \
  \     static void main(string[] args) {\n            temperatureclass tc = new temperatureclass();\n\
  \            try {\n                Tc.displaytemperature();\n            } catch\
  \ (tempiszero,exception exception) {\n                Console.readline(\"tempiszero,exception:\
  \ {0}\", exception.message);\n            }\n            Console.readkey();\n  \
  \      }\n    }\n}\n\npublic class tempiszero,exception: exception {\n    public\
  \ tempiszero,exception(string msg) : base(msg) {\n    }\n}\n\npublic class temperatureclass\
  \ {\n    int temp = 0;\n    public void displaytemperature() {\n        if (temp\
  \ == 0) {\n            throw (new tempiszero,exception(\"we found zero, temperature\"\
  ));\n        } else {\n            Console.readline(\"temperature is: {0}\", temp);\n\
  \        }\n    }\n}\n```\n\n### 嵌套 try-catch\n\n\n\n\nC# 允许我们创建嵌套的 try-catch 块。在这种情况下，异常将在发生异常的\
  \ try 块之后的 catch 块中捕获。考虑以下示例：\n\n```csharp\nusing system;\n\npublic class nestedtrycatch\n\
  {\n    public static void main()\n    {\n        Employee emp = null;\n        Try\n\
  \        {\n            Try\n            {\n                Emp.employeeename =\
  \ \"\";\n            }\n            Catch\n            {\n                Console.WriteLine(\"\
  the inner catch\");\n            }\n        }\n        Catch\n        {\n      \
  \      Console.WriteLine(\"the outer catch\");\n        }\n    }\n}\n\npublic class\
  \ employee{\n    public string employeeename { get; set; }\n}\n```\n\n代码输出以下内容：\n\
  \n![00053.jpg](img/00053.jpeg)\n\n如果没有具有相应异常类型的内部 catch 块，异常将流向传递到外层 catch 块，直到找到合适的异常过滤器。这是一个示例：\n\
  \n```csharp\nusing system;\n\npublic class nestedtrycatch\n{\n    public static\
  \ void main()\n    {\n        Employee emp = null;\n        Try\n        {\n   \
  \         Try\n            {\n                // 这将抛出一个 nullreferenceexception\n\
  \                Emp.employeeename = \"\";\n            }\n            Catch (invalidoperationexception\
  \ innerexception)\n            {\n                Console.WriteLine(\"the inner\
  \ catch\");\n            }\n        }\n        Catch\n        {\n            Console.WriteLine(\"\
  the outer catch\");\n        }\n    }\n}\n\npublic class employee{\n    public string\
  \ employeeename { get; set; }\n}\n```\n\n在上述的示例中，语句 `emp.employeeename` 将生成一个 nullreferenceexception，但我们没有处理\
  \ nullreferenceexception 或异常类型的 catch 块。外层块将处理此异常。代码返回以下内容：\n\n![00151.jpg](img/00151.jpeg)\n\
  \n## 第 18 章：文件 I/O\n\n文件的特征是名称和目录路径。一旦你打开一个文件，它就变成了一个流。文件通常是为了读取或写入目的而打开的。\n\n流仅仅是经过通信路径的字节序列。流有两种类型：\n\
  \n* 输入流\n* 输出流\n\n输入流帮助我们从文件中读取数据，即读取操作；而输出流帮助我们向文件中写入数据，即写入操作。\n\n### 输入/输出类\n\n\
  C# 为我们提供了许多用于处理文件的类。这些类可以用于访问目录、文件，创建新文件，打开现有文件以及将文件从一个目录移动到另一个目录。这些类定义在 `system.io`\
  \ 空间中。让我们讨论其中一些类：\n\n* binaryreader - 此类帮助我们从二进制流中读取原始数据。\n* binarywriter - 此类帮助我们以二进制格式写入原始数据。\n\
  * bufferedstream - 此类充当流字节的临时存储器。\n* directory - 此类帮助我们操纵目录的结构。\n* driveinfo - 此类为我们提供有关驱动器的信息。\n\
  * file - 此类用于操作文件。\n* fileinfo - 帮助对文件执行操作。\n* filestream - 用于在文件的任何位置进行写入和读取。\n\
  * memorystream - 帮助访问存储在内存中的数据。\n* path - 用于对路径执行操作。\n* streamreader - 从流中读取字符。\n\
  * streamwriter - 向流中写入字符。\n* stringreader - 从字符串读取。\n* stringwriter - 写入字符串。\n\n\
  ### Filestream 类\n\n此类定义在 `system.io` 命名空间中，它帮助我们读取和写入文件。我们也可以用它来关闭文件。为了能够使用此类，你必须创建它的对象。该实例可以用于创建新文件和打开现有文件。以下是创建\
  \ filestream 类实例的方法：\n\n```csharp\nFilestream object = new filestream(file, FileMode,\
  \ FileAccess, FileShare);\n```\n\n例如，假设我们需要读取文件 `names.txt`。我们可以创建一个名为 `fs` 的 filestream\
  \ 对象并将其用于此目的。演示如下：\n\n```csharp\nFilestream fs = new filestream(\"names.txt\", FileMode.Open,\
  \ FileAccess.Read, FileShare.Read);\n```\n\n`FileMode` 是一个枚举，定义了可以用于打开文件的许多方法。这些方法包括：\n\
  \n* append - 此方法打开现有文件，然后将光标置于文件末尾，或者如果指定的文件不存在，则创建一个新文件。\n* create - 用于创建新文件。\n\
  * createnew - 指令操作系统创建一个新文件。\n* open - 用于打开现有文件。\n* opencreate - 指令操作系统如果文件存在则打开文件，如果不存在则创建一个新文件。（注：文本已清理）\n\
  \n`FileAccess` 是一个枚举，带有许多方法，包括 `read`、`write` 和 `readwrite`。\n\n`FileShare` 枚举带有以下成员：\n\
  \n* inheritable - 帮助文件句柄在传递继承给子进程时。\n* none - 它禁用当前文件的共享。\n* read - 它打开文件进行读取。\n\
  * readwrite - 打开文件进行读取和写入。\n* write - 打开文件进行写入。\n\n`filestream` 类可以像下面所示使用：\n\n\
  ```csharp\nusing system.io;\nusing system;\n\nnamespace fileapp {\n    Class myprogram\
  \ {\n        Static void main(string[] args) {\n            Filestream fs = new\
  \ filestream(\"names.dat\", FileMode.Opencreate, FileAccess.Write, FileShare.Read);\n\
  \            for (int x = 1; x <= 10; x++) {\n                fs.write((byte)x);\n\
  \            }\n            fs.position = 0;\n            for (int x = 0; x <= 10;\
  \ x++) {\n                Console.write(fs.read());\n            }\n           \
  \ fs.close();\n        }\n    }\n}\n```\n\n### 追加文本行\n\n有时，你可能需要向文件追加多行文本。这可以通过调用\
  \ `appendalllines()` 方法来实现。这是一个示例：\n\n```csharp\nString multiplelines = \"the first\
  \ line.\" + environment.newline +\n\"the second line.\" + environment.newline +\n\
  \"the third line.\";\n// 打开名为 names.txt 的文件并追加上述行。如果文件不存在，将创建一个新的。\nFile.appendalllines(\"\
  c:\\myfile.txt\", multiplelines.split(environment.newline.tochararray()).list<string>());\n\
  ```\n\n文件将被打开，并将指定的行追加到文件中。\n\n### 追加字符串\n\n`Fileappendalltext()` 方法允许你仅用一行代码即可向文件中追加字符串。演示如下：\n\
  \n```csharp\n// 打开名为 myfile.txt 的文件并对其追加文本。如果文件不存在，则创建一个新的并打开写入打开。\nFile.appendalltext(\"\
  c:\\myfile.txt\", \"this string will be written into, the file\");\n```\n\n### 覆盖文本\n\
  \n\n\n\n\n如果你需要覆盖文件，请使用 `File.WriteAllText()` 方法。该方法将删除文件中的文本并将其替换为你指定的文本。该方法的使用方法如下所示：\n\
  \n```cs\n// 以打开文件 myfile.txt 并将文本写入其中。如果文件不存在，将创建一个新文件并打开进行写入。\n\nFile.WriteAllText(\"\
  c:\\myfile.txt\", \"this text will e used for replacing the current text in the\
  \ file.\");\n```\n\n通过静态类 `File`，可以执行各种操作。下文所示：\n\n```cs\n// 检查指定位置是否存在文件\nbool\
  \ exists = File.Exists(\"c:\\myfile.txt\"); // 它将返回 false\n\n// 将 myfile.txt 复制为新文件\
  \ newfile.txt\nFile.Copy(\"c:\\myfile.txt\", \"d:\\newfile.txt\");\n\n// 检查文件最后一次访问的时间\n\
  DateTime lastAccessTime = File.GetLastAccessTime(\"c:\\myfile.txt\");\n\n// 获取文件最后一次写入的时间\n\
  DateTime lastWriteTime = File.GetLastWriteTime(\"c:\\myfile.txt\");\n\n// 将文件移动到新位置\n\
  File.Move(\"c:\\myfile.txt\", \"d:\\myfile.txt\");\n\n// 打开文件并返回用于从文件中读取类型的 filestream\n\
  FileStream fs = File.Open(\"d:\\myfile.txt\", FileMode.OpenCreate);\n\n// 打开文件并返回一个用于从文件中读取字符串的读者\n\
  StreamReader sr = File.OpenText(\"d:\\myfile.txt\");\n\n// 删除文件\nFile.Delete(\"\
  c:\\myfile.txt\");\n```\n\n上述内容表明，通过静态 `File` 类，我们可以轻松地处理物理文件。然而，为了获得更大的灵活性，可以使用\
  \ `FileInfo` 类。\n\n### StreamReader 类\n\n此类类帮助我们从文本文件中读取数据。该类继承自 `Stream` 类。它还继承了\
  \ `TextReader` 类，该类是一个用于读取一系列字符的抽象类。以下是该类提供的常用方法：\n\n* `public override void Close()`\
  \ - 该方法关闭 `StreamReader` 对象和流，然后释放读取器使用的任何系统资源。\n* `public override int Peek()`\
  \ - 此方法将返回下一个可用的字符而不消耗它。\n* `public override int Read()` - 此方法将读取输入流中的下一个字符，然后将字符位置移动\
  \ 1。\n\n让我们演示如何使用此类类从名为 `names.txt` 的文件中读取：\n\n```cs\nusing System.IO;\nusing System;\n\
  \nnamespace io.application {\n    class program {\n        static void main(string[]\
  \ args) {\n            try {\n                // 创建一个读取文件的读取器实例。\n             \
  \   // using 语句将关闭读取器。\n                using (StreamReader sr = new StreamReader(\"\
  c:/names.txt\")) {\n                    String line;\n                    // 从文件中读取行直到文件末尾。\n\
  \                    while ((line = sr.ReadLine()) != null) {\n                \
  \        Console.WriteLine(line);\n                    }\n                }\n  \
  \          } catch (Exception exception) {\n                // 告知用户发生了什么\n     \
  \           Console.WriteLine(\"file couldn't read:\");\n                Console.WriteLine(exception.message);\n\
  \            }\n            Console.ReadKey();\n        }\n    }\n}\n```\n该代码将读取\
  \ `names.txt` 中编写的文本并将其打印出来。\n\n### StreamWriter 类\n\n此类继承自 `TextWriter` 抽象类，该类表示写入一系列字符的能力。以下是该类的常用方法：\n\
  \n* `public override void Close()` - 此方法将关闭当前的 `writer` 对象以及底层流。\n* `public override\
  \ void Flush()` - 此方法将清除当前写入器的缓冲区，并将任何缓冲数据写入流中。\n* `public virtual void Write(long\
  \ value)` - 此方法将 long 值的表示形式写入文本流。\n* `public override void Write(char value)` -\
  \ 向流写入一个字符。\n* `public virtual void Write(decimal value)` - 此方法将 decimal 值的表示形式写入文本流。\n\
  * `public virtual void Write(double value)` - 将 8 字节浮点数值的表示形式写入文本流。\n* `public virtual\
  \ void Write(int value)` - 将 4 字节有符号整数的表示形式写入文本流。\n* `public override void Write(string\
  \ value)` - 向流写入一个字符串。\n* `public virtual void WriteLine()` - 向文本流写入一个行终止符。\n\n\
  让我们演示如何使用 `StreamWriter` 类写入文本数据：\n\n```cs\nusing System.IO;\nusing System;\n\n\
  namespace io.app {\n    class program {\n        static void main(string[] args)\
  \ {\n            String[] students = new string[]{\"nicholas samuel\", \"michelle\
  \ oss\"};\n            using (StreamWriter sw = new StreamWriter(\"students.txt\"\
  )) {\n                foreach (string x in students) {\n                    sw.WriteLine(x);\n\
  \                }\n            }\n            // 读取并显示文件中的每一行。\n            String\
  \ text = \"\";\n            using (StreamReader sr = new StreamReader(\"students.txt\"\
  )) {\n                while ((text = sr.ReadLine()) != null) {\n               \
  \     Console.WriteLine(text);\n                }\n            }\n            Console.ReadKey();\n\
  \        }\n    }\n}\n```\n该代码执行后将打印以下结果：\n\n![00108.jpg](img/00108.jpeg)\n\n###\
  \ BinaryReader 类\n\n此类用于从文件中读取二进制数据。我们应该先通过构造函数传递 `FileStream` 对象来创建 `BinaryReader`\
  \ 对象。该类包含以下方法：\n\n* `public override void Close()` - 关闭 `BinaryReader` 对象以及底层流。\n\
  * `public virtual int Read()` - 从底层流读取字符并移动流位置。\n* `public virtual bool ReadBoolean()`\
  \ - 读取布尔值。\n* `public virtual byte[] ReadBinaryArray()` - 读取字节到数组。\n\n### BinaryWriter\
  \ 类\n\n此类帮助向流写入二进制数据。我们通过构造函数传递 `FileStream` 来创建 `BinaryWriter` 对象。该类包含以下方法：\n\n\
  * `public override void Close()` - 关闭 `BinaryWriter` 对象以及底层流。\n* `public override\
  \ void Flush()` - 此方法将清除当前写入器的缓冲区，并将任何缓冲数据写入设备。\n* `public virtual void Write(bool\
  \ value)` - 向当前流写入一个字节的布尔值。1 表示真，0 表示假。\n* `public virtual void Write(byte value)`\
  \ - 向当前流写入一个字节值。\n* `public virtual void Write(short value)` - 向当前流写入一个 2 字节整数值。\n\
  * `public virtual void Write(int value)` - 向当前流写入一个 4 字节整数值。\n* `public virtual\
  \ void Write(long value)` - 向当前流写入一个 8 字节长型值。\n* `public virtual void Write(float\
  \ value)` - 向当前流写入一个 4 字节浮点数值。\n* `public virtual void Write(double value)` - 向当前流写入一个\
  \ 8 字节浮点数值。\n* `public virtual void Write(char value)` - 向当前流写入一个字符。\n* `public\
  \ virtual void Write(string value)` - 向当前流写入一个字符串。\n\n\n\n\n```csharp\nConsole.WriteLine(exception.message\
  \ + \"\\n unable to create the file.\");\n\nReturn;\n}\n\n//write to the file\n\
  Try {\n    W.write(x);\n    W.write(d);\n    W.write(l);\n    W.write(st);\n} catch\
  \ (io.exception exception) {\n    Console.WriteLine(exception.message + \"\\n unable\
  \ to write to the file.\");\n    Return;\n}\n\nW.close();\n\n//read from the file\n\
  Try {\n    R = new BinaryReader(new FileStream(\"testdata\", FileMode.Open));\n\
  } catch (io.exception exception) {\n    Console.WriteLine(exception.message + \"\
  \\n unable to open the file.\");\n    Return;\n}\n\nTry {\n    X = r.ReadInt32();\n\
  \    Console.WriteLine(\"integer data: {0}\", x);\n    D = r.ReadDouble();\n   \
  \ Console.WriteLine(\"double data: {0}\", d);\n    L = r.ReadLine();\n    Console.WriteLine(\"\
  boolean data: {0}\", l);\n    St = r.ReadString();\n} catch (io.exception exception)\
  \ {\n    Console.WriteLine(exception.message + \"\\n unable to read from the file.\"\
  );\n    Return;\n}\n\nR.close();\n\nConsole.ReadKey();\n}\n}\n}\n```\n\n代码执行后将得到以下结果：\n\
  \n![00149.jpg](img/00149.jpeg)\n\n## 第 19 章：委托 (delegates)\n\n我们可以拥有具有多个不同数据类型参数的函数。然而，我们有时可能需要将某个函数作为参数传递。c#\
  \ 如何处理事件处理程序或回调函数呢？这是通过委托¹⁴² 实现的。\n\n委托被视为函数的指针。它是一种引用数据类型，持有对方法的引用。所有委托都隐式地继承自\
  \ `System.Delegate` 类。我们使用委托来实现实事件和回调方法¹⁴³。\n\n### 声明委托\n\n我们声明委托的方式决定了委托可以引用的方法。委托可以引用一个方法，该方法的签名与委托相同¹⁴⁴。我们使用\
  \ `delegate` 关键字来声明委托。声明使用以下语法：\n\n`<访问修饰符> delegate <返回类型><委托名称>(<参数>)`\n\n这里是一个示例：\n\
  \n```csharp\npublic delegate void display(int value);\n```\n\n在上面我们声明了一个 `display`\
  \ 委托。我们可以使用此委托指向一个与 `display` 委托声明的具有相同返回类型和参数的方法。\n\n考虑下面给出的示例：\n\n```csharp\n\
  using system;\n\npublic class program {\n    public delegate void display(int num);\n\
  \    public static void main() {\n        // display 委托指向 displaynumer\n       \
  \ Display displaydel = displaynumer;\n        displaydel(100000);\n        displaydel(200);\n\
  \        // display 委托指向 displaymoney\n        displaydel = displaymoney;\n    \
  \    displaydel(50000);\n        displaydel(20);\n    }\n    public static void\
  \ displaynumer(int x) {\n        Console.WriteLine(\"numer: {0,-12:n0}\",x);\n \
  \   }\n    public static void displaymoney(int amount) {\n        Console.WriteLine(\"\
  money: {0:c}\", amount);\n    }\n}\n```\n\n代码将打印出以下内容：\n\n![0028.jpg](img/0028.jpeg)\n\
  \n我们创建了一个名为 `display` 的委托，它接受一个整数类型的参数并返回 `void`。通过 `main()` 方法，我们创建了一个类型为 `display`\
  \ 的变量，并将名为 `displaynumer` 的方法赋值给它。在调用 `display` 委托后，将调用 `displaynumer` 方法；如果 `display`\
  \ 委托变量被赋值为 `displaymoney`，将调用 `displaymoney` 方法。此外，我们可以使用 `new` 关键字创建一个委托对象。在这种情况下，我们需要如所示指定方法的名称：\n\
  \n```csharp\ndisplaydel = new display(displaynumer);\n```\n\n### 调用委托\n\n委托是对方法的引用；因此我们可以像调用方法一样调用它。当调用委托时，所引用的方法会被调用。我们有两种调用委托的方法：使用\
  \ `()` 运算符或使用委托的 `Invoke()` 方法。让我们通过示例来演示这一点：\n\n```csharp\ndisplaydel = displaynumer;\n\
  displaydel(5000);\n// 或者\ndisplaydel.Invoke(10000);\n```\n\n上面展示了调用委托的两种方法。\n\n\
  ### 将委托作为参数传递\n\n方法可以有一个委托类型的参数，并且它可以调用该委托参数。这里是一个委托参数的示例：\n\n```csharp\npublic\
  \ static void displayhelper(delegate func, int numto) {\n    func(numto);\n}\n```\n\
  \n在上面的示例中，`displayhelper` 函数具有一个 `display` 类型的委托参数，并且通过下面的语句将其作为函数调用：\n\n`func(numto);`\n\
  \n让我们再给出一个示例，演示如何使用 `displayhelper` 方法和委托类型参数：\n\n```csharp\nusing system;\n\npublic\
  \ class program {\n    public delegate void display(int num);\n    public static\
  \ void main() {\n        displayhelper(displaynumer, 500);\n        displayhelper(displaymoney,\
  \ 200);\n    }\n    public static void displayhelper(delegate func, int numto) {\n\
  \        func(numto);\n    }\n    public static void displaynumer(int val) {\n \
  \       Console.WriteLine(\"numer: {0,-12:n0}\",val);\n    }\n    public static\
  \ void displaymoney(int amount) {\n        Console.WriteLine(\"money: {0:c}\", amount);\n\
  \    }\n}\n```\n\n代码将返回以下输出：\n\n![0097.jpg](img/0097.jpeg)\n\n### 多路委托 (Multicast\
  \ delegate)\n\n委托可以指向多个函数。任何指向多个函数的委托被称为多路委托。使用 `+` 运算符向委托对象添加函数，使用 `–` 运算符从委托中移除函数。考虑下面的示例：\n\
  \n```csharp\nusing system;\n\npublic class program {\n    public delegate void display(int\
  \ value);\n    public static void main() {\n        display displaydel = displaynumer;\n\
  \        displaydel += hexadecimal;\n        displaydel += displaymoney;\n     \
  \   displaydel(1000);\n        displaydel -= hexadecimal;\n        displaydel(2000);\n\
  \    }\n    public static void displaynumer(int x) {\n        Console.WriteLine(\"\
  numer: {0,-12:n0}\",x);\n    }\n    public static void hexadecimal(int dec) {\n\
  \        Console.WriteLine(\"hexadecimal: {0:x}\", dec);\n    }\n    public static\
  \ void displaymoney(int amount) {\n        Console.WriteLine(\"money: {0:c}\", amount);\n\
  \    }\n}\n```\n\n在上面的示例中，`displaydel` 指向三个方法 `displaynumer`、`hexadecimal` 和 `displaymoney`。这使其成为多路委托。这意味着当调用\
  \ `displaydel` 时，它将顺序调用所有方法。\n\n## 第 20 章：c# 中的多线程 (multithreading)\n\n线程定义了控制流。线程是操作系统分配的执行的基本单位。线程的执行在程序内部是独立的。\n\
  \n单个进程使用一个线程执行。这种进程被称为单线程进程。一次只能执行一个任务。用户必须等待任务完成才能执行新任务。\n\n为了同时执行多个一个线程，会创建多个线程。创建两个或多个线程的过程被称为多线程¹⁴⁵。\n\
  \n### 线程的生命周期\n\n\n\n\n生命周期从 `system.threading.thread` 类对象的创建开始。一旦任务完成，生命周期就会结束。线程的生命周期中有多种状态。\n\
  \n*   **未启动状态 (unstarted state)**：当创建 `thread` 类的实例时，线程进入未启动状态。\n*   **就绪状态 (ready\
  \ state)**：在程序调用 `start()` 方法之前，线程一直处于此状态。\n*   **不可运行状态 (not runnable state)**：导致线程处于不可运行状态的元素包括：\n\
  \    1. **等待 (Waiting)**：调用 `wait()` 方法使线程等待指定的条件。\n    2. **锁定 (Locked)**：线程被 I/O\
  \ 操作锁定。\n    3. **睡眠 (Sleeping)**：调用 `sleep()` 方法将线程置于睡眠模式。\n*   **死亡状态 (dead state)**：一旦线程完成执行或被中止，就会进入死亡状态。\n\
  \n## 主线程 (Main thread)\n\n在处理线程工作时，我们使用了 `system.threading.thread` 类。主线程在程序开始执行时就会创建。`thread`\
  \ 类用于创建线程，它们被称为子线程。用户可以通过 `thread` 类的 `currentthread` 属性访问主线程。\n\n示例：\n\n```csharp\n\
  Using system;\n\nNamespace thread\n{\n\nClass mainthread\n{\n\nStatic void main(string[]\
  \ args)\n{\n\nThread t1  =new thread();\n\nT1.name=\"thread1\";\n\nConsole.writeline(\"\
  thread  is:{0}\",t1.name);\n\nConsole.read();\n\n}\n\n}\n\n}\n```\n\n编译并执行代码后，输出为：\n\
  `Thread is: thread1`\n\n## thread 类的属性和方法\n\n### 属性 (146):\n\n*   **isalive**：显示当前线程执行状态的值。\n\
  *   **currentthread**：获取当前运行线程。\n*   **currentcontext**：获取线程执行的当前上下文。\n*   **executioncontext**：`executioncontext`\
  \ 对象包含不同上下文的信息。\n*   **name**：获取或设置线程名称。\n*   **threadstate**：包含当前线程状态的值。\n*   **priority**：获取或设置线程调度优先级。\n\
  \n### 方法:\n\n*   `public static void beginthreadaffinity()`：主机根据当前的物理操作系统线程去执行指令。\n\
  *   `public void abort()`：在调用该方法的线程中抛出 `threadexception`。\n*   `public void interrupt()`：中断处于\
  \ waits、sleep 或 join 状态的线程。\n*   `public static appdomain getdomain()`：返回一个唯一的应用程序域标识符。\n\
  *   `public static void memorybarrier()`：处理器执行当前线程。指令不能重排序。\n*   `public void start()`：启动线程。\n\
  *   `public static object yield()`：让调用线程让执行给另一个准备好运行处理器的线程。\n\n## 创建和管理线程\n\n扩展的\
  \ thread 类创建一个线程。扩展的 thread 类调用 `start()` 方法来启动子线程的执行。\n\n示例：\n\n```csharp\nUsing\
  \ system;\n\nUsing system.threading;\n\nNamespace multiplethread\n{\n\nClass threadprogram\n\
  {\n\nPublic static void callchild()\n{\n\nConsole.writeline(\"start thread\");\n\
  }\n\nStatic void main(string[] args)\n{\n\nThreadstart child1 =new threadstart(callchild);\n\
  \nConsole.writeline(\"creating child thread\");\n\nThread child2 =new thread(child1);\n\
  \nChild2.start();\n\nConsole.read();\n\n}\n\n}\n}\n```\n编译并执行代码后，输出为：\n`Start thread`\n\
  `Creating child thread`\n\n## 管理线程\n\n当需要暂停线程一段时间以便另一个线程执行时，将使用 `sleep()` 方法。该方法接受一个毫秒为单位的参数。\n\
  \n示例：\n\n```csharp\nUsing system;\n\nUsing system.threading;\n\nNamespace threaddemo\n\
  {\n\nClass threadprogram\n{\n\nPublic static void childthread()\n{\n\nTry\n{\n\n\
  Console.writeline(\"child thread started\");\n\nFor(int j = 0; j <= 10; j++)\n\n\
  {\n\nThread.sleep(1000);\n\nConsole.writeline(\"child thread finished\");\n\n}\n\
  \n}\nCatch(threadexception e)\n{\n\nConsole.writeline(\"exception caught\");\n}\n\
  \nFinally\n{\n\nConsole.writeline(\"exception is not handled\");\n}\n}\n\nPublic\
  \ static void main()\n{\n\nThreadstart t1 =new threadstart(childthread);\n\nConsole.writeline(\"\
  creating child thread\");\n\nThread t2 = new thread(t1);\n\nT1.start();\n\n//main\
  \ thread is stopped\nThread.sleep(2000);\n\n//child thread aborted\nConsole.writeline(\"\
  aborting child thread\");\n\nT2.abort();\n\nConsole.read();\n\n}\n\n}\n```\n因此，输出为：\n\
  `Creating child thread`\n`Child thread started`\n`0`\n`1`\n`aborting child thread`\n\
  `Exception caught`\n`Exception is not handled`\n\n## 第 21 章：事件 (event)\n\n事件是预期会发生的事情。在\
  \ C# 中，事件是用户操作，如点击、按键、鼠标移动，或者如系统生成的通知 (148)。应用程序在事件发生后应对其做出响应。一个很好的例子是中断的发生。事件用于促进进程间的通信。\n\
  \n事件在类中声明，并通过通过类类或另一个类中的委托与事件处理程序关联。带有事件的类用于发布事件，这被称为发布者类 (publisher class)。接受事件的类被称为订阅者类\
  \ (subscriber class)。这意味着事件依赖于发布者-订阅者模型。\n\n发布者是定义事件和委托的对象。事件与委托之间的关联在该对象中定义。发布者类的实例调用事件，反过来通知其他对象。\n\
  \n### 事件声明 (Event declaration)\n\n为了在类内部声明事件，应先为事件声明一个委托类型。在此之后，你可以使用 `event` 关键字声明事件\
  \ (149)。这是一个示例：\n\n```csharp\npublic delegate void myevent();\n\npublic event myevent\
  \ myevent;\n```\n\n\n\n\n```csharp\npublic class displayhelper\n{\n    // declare\
  \ the delegate\n    public delegate void eforeisplay();\n\n    //declare an event\
  \ of type delegate\n    public event eforeisplay eoredisplayevent;\n\n    public\
  \ displayhelper()\n    {\n    }\n\n    public void displaynumer(int x)\n    {\n\
  \        //call the delegate method moving to display\n        if (eredisplayevent\
  \ != null)\n            eredisplayevent();\n\n        Console.WriteLine(\"numer:\
  \ {0,-12:n0}\", x);\n    }\n\n    public void printdecimal(int dec)\n    {\n   \
  \     if (eredisplayevent != null)\n            eredisplayevent();\n\n        Console.WriteLine(\"\
  decimal: {0:g}\", dec);\n    }\n\n    public void displaymoney(int amount)\n   \
  \ {\n        if (eredisplayevent != null)\n            eredisplayevent();\n\n  \
  \      Console.WriteLine(\"money: {0:c}\", amount);\n    }\n\n    public void displaytemperature(int\
  \ x)\n    {\n        if (eredisplayevent != null)\n            eredisplayevent();\n\
  \n        Console.WriteLine(\"temperature: {0,4:n1} f\", x);\n    }\n\n    public\
  \ void displayhexadecimal(int dec)\n    {\n        if (eredisplayevent != null)\n\
  \            eredisplayevent();\n\n        Console.WriteLine(\"hexadecimal: {0:x}\"\
  , dec);\n    }\n}\n```\n\n`displayhelper` 是一个发布者类，负责发布 `eredisplay` 事件。在每个显示方法之后，它会首先检查\
  \ `eredisplayevent` 是否不为空，如果不为空，则会调用 `eredisplayevent()` 方法。\n\n现在我们需要创建一个订阅者。请考虑下面的类：\n\
  \n```csharp\nusing system;\n\npublic class myprogram\n{\n    public static void\
  \ main()\n    {\n        numerclass nc = new numerclass(200);\n        Nc.displaymoney();\n\
  \        Nc.displaynumer();\n    }\n}\n\nclass numerclass\n{\n    private displayhelper\
  \ _displayhelper;\n\n    public numerclass(int x)\n    {\n        _value = x;\n\
  \        _displayhelper = new displayhelper();\n        //subscribe to the eredisplayevent\
  \ event\n        _displayhelper.eredisplayevent += displayhelper_eredisplayevent;\n\
  \    }\n\n    //eredisplayevent handler\n    void displayhelper_eredisplayevent()\n\
  \    {\n        Console.WriteLine(\"eredisplayeventhandler: displayhelper will print\
  \ a value\");\n    }\n\n    private int _value;\n\n    public int value\n    {\n\
  \        get { return _value; }\n        Set { _value = value; }\n    }\n\n    public\
  \ void displaymoney()\n    {\n        _displayhelper.displaymoney(_value);\n   \
  \ }\n\n    public void displaynumer()\n    {\n        _displayhelper.displaynumer(_value);\n\
  \    }\n}\n```\n\n```csharp\npublic class displayhelper\n{\n    //  declare a delegate\n\
