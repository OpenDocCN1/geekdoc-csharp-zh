    # General Introduction


    - This programming language will be case sensitive. This means that `class` and
    `CLASS` will have different meanings to the program.

    - The compiler is going to ignore the white spaces that you create. This includes
    spaces, tabs, and new lines. You can use this whitespace as much as you like to
    help make the program look a little easier to read.

    - `C#` will allow you to choose any name that you want for the programs. You don’t
    need to have the program’s name and the class identifier be the same.

    - You can use `Main()` more than once within the program.

    - When defining the boundaries of a method or a class, make sure to use the curly
    brackets.

    - You can use two types of comments within `C#` to help explain things better.
    Multi-line and single line are fine, as long as you use the right features of
    each.

    - You can always add in an argument or a string to your `Main()` method.


    Using `C#` is one of the best programming languages that you can choose. It is
    great to use with most Windows computer, and it works great with other computers
    as well. It has all the great features that you have come to know and love with
    `Java` and `C++`, but it is much easier to use and can work for beginners without
    all the experience!


    # Variables and Data Types


    With a first glance at using `C#`, you can see that this language is not too scary.
    While some of the other options are meant for more advanced users and can be a
    bit complicated, you will find that this is not always the case when using `C#`.
    So now that you have gotten your feet a bit wet with `C#`, it is time to delve
    in deeper and learn a few more things to make it more fun.


    ## Data Types


    Those who have used `C#` often will choose to divide the programming language
    into two parts; reference types and value types. When you are working with a value
    type, you are going to pass the data over to whichever method you are using. On
    the other hand, when working with a reference type, you should just add the reference
    in with the method as the value will be placed somewhere else. Some of the data
    types that you will find when using the `C#` program include:


    - `Ulong`

    - `Double`

    - `Long`

    - `Float`

    - `Uint`

    - `Int`

    - `Ushort`

    - `Sbyte`

    - `Short`

    - `Byte`

    - `Bool`—when you use this type, the values that you are allowed to store can
    only be two. The values are going to be `false` and `true` so it is good for conditional
    statements and logical expressions.

    - `Decimal`

    - `Char`—this is a data type that is only allowed to have one single character.
    When you are writing the `char` value, you must include it with single quotes
    such as writing out ‘t’ ‘b’ and so on.


    ## Variables


    When you are doing an execution, the computer program is going to store all the
    data for a short amount of time. Programmers will often use the word “variables”
    when they are referring to the locations of memory that will hold this stored
    data. Thus, the variable will have a data type and corresponding value. When you
    are working in the `C#` language, you are able to create a variable using this
    syntax:


    ```

    <data_type> <name_of_variable>

    ```


    The line above will save a part of your computers’ memory in order to hold onto
    the `char` value. The programmer will then be able to access this variable using
    the identifier it was given. For example, if you had listed the above formula
    as `char x`, you could find the variable by going to `x`.


    `C#` also allows you to initialize the variables during declaration. This term
    refers to the process of giving a value to your variable when you are creating
    it. You just need to use your assignment operator, which is `=`, and then indicate
    the value that you are trying to assign here. Some examples of this could be:


    ```

    int year=2015

    bool isItDelicious = false

    char sample = ‘4’

    ```


    You can also declare a few variables for one statement as long as they are of
    the same data type, you just need to separate each of the entries using a comma.
    An example of this is:


    ```

    char ant = ‘a’, bull=’b’, cat=’c’

    ```


    Just like with other programming languages, `C#` will require you to declare your
    variables before you are able to assess them again. `C#` is also going to implement
    a new rule called definite assignment. This means that you will need to initialize
    the local variable before you are able to use it. You basically need to assign
    the initial value of a local variable during the declaration process.


    Something to keep in mind: variables are named this way because the values that
    they are going to store will change every time that the program runs. The values
    are going to change based on what you place into them.


    ## Constants


    Next on the list to understand are constants. These are variable types that will
    prevent the program from changing the initial value. This means that the value
    is going to stay constant, no matter what the user is inputting in the process.
    You will need to use `const` when you want to declare this constant. An example
    of this is:


    ```

    const char LETTER=x;

    ```


    Before you state one of these constants, you need to make sure that you really
    want it that way. The program will not be able to change the value of a constant
    if you’ve already put it in place. This means that you must assign the initial
    value to it right at the variable declaration. For example, you will get an error
    message if you put in the following command:


    ```

    const bool ANSWER;

    ```


    One thing to keep in mind about constants is that most are going to use uppercase
    letters when you are declaring this. Knowing this information can help you to
    read through `C#` code a bit easier and will make it easier to create your own
    in a manner that others will be able to read and understand.


    ## Creating Your Identifier


    If you look through the suggestions from Microsoft, you will find that they recommend
    that you use a Camel notation when you are working with variables and a Pascal
    notation when working with methods. When you are doing a Camel notation, you will
    see that the first letter of the word is lower case. If you are dealing with a
    compound word, the first letter in your second word will start with an uppercase
    letter. Some examples of this include:


    ```

    payment         completePayment

    mathematics      firstClass

    ```


    The Pascal notation will take things a bit differently. This notation style is
    going to ask you to start the first word using an uppercase letter. The first
    letter in all of the other words in the sequence should also be done in uppercase
    as well. Some examples of using the Pascal notation include:


    ```

    WriteLine()      ReadLine()

    Start()          Main()

    ```


    It is also possible to use underscore characters and numbers as well when you
    are creating an identifier. But, you are not allowed to start the identifier using
    a number. You can write `fiveBooks` as an identifier, but you are not allowed
    to write `5Books`.

