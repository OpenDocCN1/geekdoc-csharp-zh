    \ `class`（类）。标识符将帮助你识别程序中需要的方法、变量和类。`FirstProgram` 是你在这种情况下创建的类名。\n\n* 在第三行，你正在定义方法。`Main()`\
    \ 将作为计算机上任何应用程序的起点。无论程序被放置在代码的哪个位置，都会从 `Main()` 方法开始执行。通常在方法之前有两个单词，主要是 `void`\
    \ 和 `static`。在这种情况下，`static` 告诉编译器该方法不会在类中创建对象。使用 `void` 时，你是在告诉编译器 `Main()` 不返回值。\n\
    \n* 在第五行，你将看到代码的最后部分。这是你编写消息的行。名为 `WriteLine()` 方法捕获字符组合（或句子），并在你请求时将其打印到屏幕上。\n\
    \n此外，你可能还注意到那里有大括号，用于告诉计算机代码中存在代码块以帮助区分内容。记住，`C#` 像 `Java` 和 `C` 一样使用分号（`;`）（如上面的代码所示）。\n\
    \n## C# 注释\n\n这种编程语言允许你在代码中留下注释。这将提供关于你添加的代码的更多信息。编译器将忽略这些行，因此你的注释对计算机的输出没有影响。但这可以成为记住你在代码中尝试做什么，或向其他程序员展示你正在工作内容的好方法。\n\
    \n`C#` 允许两种类型的注释。第一种是单行注释。这种注释以两个斜杠开头。你说的话应该尽量少一些，以便将它们保持在一行。如果你超过了一行，你会发现程序会向你发送错误信息。编写这种注释的方法是：\n\
    \n```csharp\nstatic void Main()\n{\n    //I have a pet.\n}\n```\n\n你也可以使用多行注释。有时你无法将注释保持在一行，需要添加不同的内容允许代码跨越两行或更多。幸运的是，`C#`\
    \ 允许你编写这类注释，只要以 `/*` 开始并以 `*/` 结束即可。这是一个示例：\n\n```csharp\nstatic void Main()\n\
    {\n    /*The C# compiler should ignore this line.*/\n}\n```\n\n这使得编写较长的注释变得更容易，以便更详细地解释事情，而不会其出现在你的代码屏幕上。在处理代码时，注释可以是你最好的朋友。它将帮助他人知道应该对代码做什么，例如让他们知道在特定部分的括号内应该放什么，解释你正在用该代码做什么，等等。你应该仔细对待注释，不一定非要在每行代码后都放置注释，但在需要时使用它们可以让事情变得简单。\n\
    \n## C# 需要记住的事项\n\n创建 `C#` 程序时你需要记住的一些事项包括：\n\n* 所有的 `C#` 程序都存在于 `class`（类）内部。\n\
    \n* 你应该使用 `Main()` 开始程序内所有想要执行的操作。\n\n"
