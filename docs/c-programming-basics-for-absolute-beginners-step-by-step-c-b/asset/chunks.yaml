    \ false. own- `!` with this one, you will be able to reverse the value of your\
    \ Boolean variable. For example, if you type in `!d`, you will get a false.\n"
  raw: 'Just like with other programming languages that you may work with, C# has
    operators that will belong in different categories. Let’s take a look at each
    of the categories and how you will handle the operators in each one.


    ## Arithmetic Operators


    These are the operators that will tell your computer program to do an arithmetic
    procedure. This can help the computer know when you need to add things together,
    subtract them, and so much more. The computer can do some of the basics for you
    while making the right signs to show the program what you would like it to do.
    Some of the arithmetic operators that you can use in C# are:


    For these examples let’s assume that x=15 and y=10


    *   “+” this is the addition operator. It is going to add two operands together.
    So you would get x+y=25


    *   “-“ this is the subtraction operator. It is going to allow you to subtract
    the value of the right-hand operand from the left-hand operand. So you would get
    y-x=-5.


    *   “*” this is the one that will tell the computer to multiply the two operands.
    So you could do x*y=150.


    *   “/” this one is the operator that will tell the computer to divide the left-hand
    operand with the right-hand operand. For example y/x.


    *   “%” this is often called the remainder or the modulo operator. It is going
    to divide the left-hand operand by the right operand and then returns the remainder.


    *   “++” this is the increment operator. It is going to increase the value of
    the operand by one. So you would have ++x=16


    *   “—“ programmers will often call this the decrement operator. It is going to
    decrease the value of the operand by one. This means that you will have –x=14.


    One thing to note is that the decrement and the increment operators are considered
    unary, which means that it can only be used on one operand. Also, you can also
    add the operators together before or after using the increment and decrement values.


    Here is an example o a code that has arithmetic operators inside:


    class Example


    {


         // This basic program will show you how arithmetic operators work


         static void Main()


         {


         Int f =3, g = 4;          // This line declares two variables, f and g.


         sampleSum = f+g;          // This will give you 7.


         sampleDifference = g-f          // This will give you 1.


         sampleProduct = f*g;          // This will give you 1.3


         sampleModulo = g%f;          // This will give you 1


         f++          //This will give you 3.


         }


    }


    Using arithmetic operators is pretty simple as it is just going to tell the computer
    to put two numbers together. You have to set up the parameters for what all the
    numbers will equal and the computer can do the rest.


    Adding in the comments can help someone else who is looking at the program figure
    out what you are doing, but you don’t have to add these in if they are pretty
    basic numbers. Sometimes the numbers get a bit more complex so it is good to get
    in the habit of using these comments even on the easy ones so that other programmers,
    and even yourself, will be able to read through them.


    ## Assignment Operators


    Next on the list is assignment operators. This is an operator that will allow
    you to assign a value to your variable. Some of the assignment operators that
    you can choose from when using C# include:


    *   “=” this operator will allow you to perform simple assignment operations.
    It is going to assign the value to a variable that you are working on at that
    time. For example, writing int sample = 100 will tell the program that you want
    to assign 100 to the variable that is called “sample”. It won’t perform any extra
    processes on this variable or on the value involved.


    *   “+=” this is the additive assignment operator. It is going to add up the values
    of your two operands and then will assign the sum to your left-hand operand.


    *   “-=” programmers will often refer to this as the subtractive assignment operator.
    It is going to subtract the value of the operand on the right side from the one
    on the left side and then assign the difference to the left-hand operand.


    *   “*=” this operator will multiply the values of each operand and then will
    assign the product to the left-hand operand.


    *   “/=” this is when you will divide up the two variables and then take the result
    and assign it to the variable on the left.


    One thing to note is that when you use an assignment operator, you will need to
    make sure that both operands do belong to the same type of data. If you find that
    the operands are incompatible, the program may not work properly during runtime
    and you will have to go back through and make the changes.


    ## Relational Operators


    These are the operators that will let you compare the values of your two operands.
    Because of this, they are good when used for conditional statements. Some of the
    relational operators that you may encounter when using the C# language.


    For these, let’s assume that d = 100 and e = 150


    *   “==” this is the operator that you can use to check the equality of two values.
    If the two values end up being equal, the operand will tell you it is true. Otherwise,
    the operand will tell you it is false. For example, saying the d == e would show
    up as false.


    *   “!=” this operator allows you to test the inequality of two values. If the
    values end up not being equal, it will tell you this is true. For example e !=
    d would result in a true.


    *   “>” this operator is used to check whether the operand on the left is greater
    than the operand on the right. If it is, then the operator will tell you it is
    true. For example, saying that e > d would be true.


    *   “<” this is the less than operator, it will allow you to check whether the
    operand on the left side is less than the operand on the right side. If it is,
    you will get it to show up true, such as the formula d < e.


    *   “>=” this is the operand that will say it is true if the value of the operand
    on the left side is greater than, or equal to, the operand on the right side.
    Otherwise it will tell you the statement is false. For example, saying that e
    >=d evaluates as true.


    *   “<=” with this operator, you will get a true if the operand on the left side
    is less than or equal to the operand that is on the right side. For example d
    <= e is true.


    When you are using the relational operator, the result is to get a Boolean value
    each time. This means that you want to get an answer that is either true or false
    each time. You should also check to see if you are using two equal signs any time
    that you are using the equality operator. If you get this mixed up with the assignment
    operator, you are likely to get an error in the program or it just won’t work
    right for you.


    ## Logical Operators


    Another option that you are able to use with operators is logical operators. This
    is sometimes called a Boolean operator because it is going to accept two Boolean
    values in order to produce a brand new Boolean value. Keep in mind that C# will
    allow and support four types of logical operators.


    For this we are going to assume that c = true, d = true, and e = false


    *   “&&” this operator is called logical AND. It will only result in a true if
    both operands are true. For example d && c will evaluate to true.


    *   “||” this is the logical OR. This operator is going to give you a true if
    at least one of your operands is true. For example, c || e will result in true.


    *   “^” this operator is the Logical Exclusive OR and it will result in a true
    if one of the operands is true. If both operands can be false or true, the operator
    will give you a false.


    *   “!” with this one, you will be able to reverse the value of your Boolean variable.
    For example, if you type in !d, you will get a false.'
