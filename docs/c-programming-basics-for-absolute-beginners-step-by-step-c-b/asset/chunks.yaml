  trans: "\n\n一些程序员会将 `||` 和 `&&` 称为短路运算符。这是因为这些符号能够在不检查整个表达式的情况下给出准确的结果。`&&` 就是其中一个例子，因为它需要两个\
    \ `true`，如果第一个操作数是 `false`，它将导致结果为 `false`，无论其余部分是什么，而且它甚至不会去查看剩余部分。这可以稍微加快程序的运行并完成工作。\n\
    \n## 位运算符\n这种类型的运算符的工作方式与逻辑运算符非常相似。区别在于，位运算符将取二进制值来产生布尔结果。由于这种运算符作用于二进制选项（基本上就是由\
    \ 0 和 1 组成的值），它们显示的结果将以 `0` 或 `1` 作为输出。`C#` 语言支持以下位运算符。\n\n为此此，我们假设 `I = 0`，`h\
    \ = 1`，`j = 0` 且 `g = 1`\n\n* `&` 这是一个被称为位与与的运算符。它会在两个操作数都为 `1` 的位置赋值 `1`。例如 `g\
    \ & h` 将给你结果 `1`。\n* `|` 这是位或运算符。当至少有一个操作数为 `1` 时，它会在该位置赋值 `1`。例如，执行 `h | 1` 将给你结果\
    \ `1`。\n* `^` 这是异或运算符，在二进制数据上运行良好。正如同与处理逻辑值一样，这种运算符只会在操作数为 `1` 的区域给你给出 `1`。例如，如果你执行\
    \ `g^j`，你将得到结果 `1`。\n\n这些操作数在开始处理时可能看起来有点棘手，但它们将让你在 `C#` 中工作时需要的某些不同操作变得简单得多。它们使用简单，经过一些练习，你会发现它们比以往任何时候都更容易使用，而且并没有那么复杂。也许可以打开你的文本编辑器，看看这些运算符对你效果如何，通过实验来获得结果！\n\
    \n# 使用的条件语句\n条件语句是 `C#` 语言的另一部分，可以帮助你和其他程序员创建灵活且强大的应用程序。事实上，这种类型的测试被认为是编写任何类型计算机程序非常重要的一部分，这样你就可以写出他人以及你自己都能正确使用的代码。如果你想真正高效并擅长使用\
    \ `C#` 语言，你需要掌握一些条件语句。\n\n## If\n你可以使用的第一个条件语句是 `if` 语句。这是 `C#` 中可以使用的最基本的条件语句之一，它允许计算机根据你放置的某些输入来运行。使用\
    \ `if` 语句的语法包括：\n\n```\nIf (布尔表达式)\n{\n    你想运行的语句/语句\n}\n```\n\n如你所见，这是你可以使用的较简单公式之一，它将根据你尝试运行的语句的长度以及你想在该表达式中拥有的其他条件而改变。`if`\
    \ 语句的一些主要部分包括：\n\n* `if` 关键字——这部分将告诉你的语言编译器你正在组合一个 `if` 语句。\n* 布尔表达式——这是语法中决定程序是否运行体（body）的部分。在使用\
    \ `C#` 时，你不能对这种表达式使用 `char` 和 `int` 值。\n* 你想运行的语句——这是语法的主体，你被允许在内部放置一个或多个语句。如果布尔表达式的结果为\
    \ `true`，程序将执行这些语句。如果结果最终为 `false`，程序将忽略这些语句，并将控制权交给你写的其他语句。\n\n不要让这看起来对你太困惑。这是一个关于所有这些含义的良好示例：\n\
    \n```\nIf (x > 0)\n{\n    Console.Write(\"The value is positive.\");\n}\n```\n\
    \n通过这个示例，只有当你的值大于零时，程序才会打印“The value is positive.”。如果你发现表达式为 `false`，那么程序将忽略语句中的\
    \ `Console.Write` 部分，并移动到程序的下一个部分。\n\n## If Else\n在此基础上是 `if else` 子句，它可以允许你在程序中做很多很棒的事情。`if\
    \ else` 语句应该记住的语法包括：\n\n```\nIf (布尔表达式)\n{\n    如果结果为真，你想运行的语句/语句；\n}\nElse\n\
    {\n    如果结果为假，你想运行的语句/语句；\n}\n```\n\n这种表达式包含五个部分，它确实可以增强你在程序中能够执行的操作，包括根据答案显示两种不同类语句的能力。其中一些部分包括：\n\
    \n* `if` 关键字——通过这个关键字，你是在告诉编译器你将创建一个条件语句。\n* 布尔表达式——你创建的表达式应该产生一个布尔值。如果表达式最终为真，程序将运行你列出的第一个语句。\n\
    * 第一个体——这是你想在布尔表达式最终为真时运行的语句。你可以在这里添加几条语句，只需确保它们都在同一个括号内即可。\n* `else` 关键字——这是一个告诉编译器存在\
    \ `else` 子句的关键字。这是当布尔表达式最终为假时将运行的语句。\n* 第二个体——这与第一个体非常相似。但如果布尔值为假，将运行这一个。\n\n\
    如你所看到的，`if else` 语句将比 `if` 语句更强大。使用 `if` 语句时，如果答案为 `false`，你什么都不会显示，语言中的下一条命令将显示。但通过\
    \ `if else`，无论你得到真答案还是假答案，你都可以选择显示哪个语句，这使得代码变得强大得多。\n\n让我们看看 `if else` 语句在现实是如何工作的。\n\
    \n```\nIf ( x > 0)\n{\n    Console.Write(\"This value is positive.\");\n}\nElse\n\
    {\n    Console.Write(\"The value is less than or equal to zero.\");\n}\n```\n\n\
    在这种语法中，除非布尔表达式最终为假，否则 `else` 子句将保持隐藏。如果过程需要它或值为假，它就在那里；但如果值为真，则将使用第一个语句，而第二个语句将完全被忽略。\n\
    \n`if else` 子句是很多初学者不会使用的。他们认为它太复杂了，不能帮助他们完成工作。他们想坚持只使用 `if` 子句，并假设这是完成工作的最佳选择。但对于那些希望在他们的语句中有更多选项的人，或者希望根据给出的答案显示不同选项的人来说，使用\
    \ `if else` 子句将是你可以使用的最佳选项之一。\n\n它并不难理解。它只是为你提供了比你在其他选择中找到更多的选项。当你花时间尝试 `if` 子句后，确保你习惯\
    \ `if else` 子句，这样你就可以将你的新代码推向全新的水平。\n\n## 嵌套条件语句\n\n"
- fmt: "\nWhen you are using the `C#` language, you will be able to write an `if`\
    \ statement inside of another `if` statement when it is necessary. This is a process\
    \ called nesting and it is used to help you to create complex programs that rely\
    \ on chained conditions. One of the things that you should keep in mind when using\
    \ this option is that you will run into syntax errors and compile time if you\
    \ make a mistake and do the writing part of the nested conditional statements\
    \ the wrong way.\n\nMany experts in `C#` recommend that you should limit your\
    \ nested statements to just three levels. If you go above this amount, you could\
    \ end up with a code that is confusing and complex, making it hard for others\
    \ to read and resulting in more errors in the process.\n\nA good example of a\
    \ code that allows nesting for a conditional statement includes:\n\n```csharp\n\
    Double r = 60;\nDouble s = 70;\nIf (r == s)\n{\n    System.Console.WriteLine(\"\
    These numbers are equal.\");\n}\nElse\n{\n    If (r > s)\n        System.Console.WriteLine(\"\
    The value of the first variable is greater than that of the second one.\");\n\
    }\nElse\n{\n    System.Console.WriteLine(\"The value of the second variable is\
    \ greater than that of the first one.\");\n}\n```\n\nWith this option, you have\
    \ a few different scenarios that come up using the `if else` clause. This allows\
    \ you to have a few different options just up for the command so that the program\
    \ knows what to read out. This can help you to do so much more with the program\
    \ than before, but be careful not to make it too complex or you could end up with\
    \ a mess.\n\n## Switch-Case\n\nThese switch-case statements will execute a code\
    \ according to the expressions’ results. Most programmers with `C#` will use integer\
    \ values when working on this kind of statement. To create one of these statements,\
    \ it is recommended to use the following syntax:\n\n```csharp\nSwitch (value_selector)\n\
    {\n    Case integer1;\n        The statements you want to execute;\n        Break;\n\
    \    Case integer2;\n        The statements you want to execute;\n        Break;\n\
    \    //…\n    Default:\n        The statements you want to execute;\n        Break;\n\
    }\n```\n\nThere are a few parts that you will need to understand in order to really\
    \ get the most out of this syntax. These include:\n\n- The `switch` keyword—this\
    \ is the keyword that will inform the compiler that you want the program to perform\
    \ a switch-case statement.\n- The `value selector`—this is the expression that\
    \ will generate a value. With the `C#`, the value should be compatible with your\
    \ operators. Your program is going to compare this value against the other cases\
    \ that are listed inside your statements.\n- The `case`—the case is going to be\
    \ the label that used by your program when it does comparisons. If the case ends\
    \ up matching the value from the selector, the statement will run. The program\
    \ will check each case until it is fund.\n- The executable statements—these are\
    \ the different statements that you will want to run based on the case that is\
    \ appropriate. It can be a group of statements or a single statement based on\
    \ your needs.\n- `Break` keyword—this is the keyword that will terminate the body\
    \ of a switch structure. You will need to place this keyword after each statement\
    \ that you are trying to create.\n- The `default` clause—this is the mechanism\
    \ that you need in order to end the statement. It is going to run if the selector\
    \ doesn’t match any of the other labels that you put up there. This pretty much\
    \ ensures that the process shows up something if nothing else works out. You can\
    \ make sure that the program will put out an answer no matter what the inputs\
    \ are.\n\nWorking with conditional statements can sometimes be difficult for a\
    \ beginner. You will find that there are so many things that you are able to do\
    \ with these kinds of statements that it can seem a bit intimidating for a lot\
    \ of people. But when you see some of the syntax options and experiment with using\
    \ these options on occasion, you will find that it is easier than you can think\
    \ to do some great options with language programming.\n\nThe important thing to\
    \ remember during this is to use the different sections that are listed above.\
    \ This will help you to ensure that you get all the right parts in order to work\
    \ on the conditional statement. Without the right options, you will find that\
    \ the program will bring out errors signals when you try to run it. When you get\
    \ through with all of these new aspects, you can write a great conditional statement\
    \ that will help you get your program up and running.\n\n# Creating and Using\
    \ Objects\n\nWith this chapter, we are going to focus on two important programming\
    \ concepts, mainly classes and objects. You are going to learn how to access all\
    \ the classes that are present in the `.NET` programming framework as well and\
    \ it has some really valuable information that can make it easier than ever to\
    \ help you become a master of `C#` without all the hassle.\n\n## Classes and Objects\n\
    \nFirst, we are going to talk a bit about objects in this programming language.\
    \ Programming has had a lot of growth over the past few years and all this growth\
    \ has had a huge effect on how programmers are going to create their new computer\
    \ applications. Object Oriented Programming, or `OOP`, is one of the newest and\
    \ biggest ideas that has been developed in the IT world and we are going to spend\
    \ some time learning how `OOP` works so that you can use it to your advantage\
    \ to create some amazing programs with `C#`.\n\n### Object Oriented Programming\n\
    \nThis kind of programming is a style that will rely on objects. `OOP` will provide\
    \ you with a model that is based on how things will work in the real world. When\
    \ you are able to work with objects rather than with abstract ideas, it is easier\
    \ to understand the language and get it to work for you. This approach is going\
    \ to help you to solve the problems that come up in programming using your intuition\
    \ and logic.\n\n### Objects\n\nProgrammers are going to use digital “objects”\
    \ in order to represent physical objects or abstract ideas. While using the `OOP`,\
    \ you should remember that these objects will have two characteristics including:\n\
    \n- State—this is the characteristics that will define the object. These can be\
    \ general or specific.\n- Behavior—this is the characteristics that will declare\
    \ all the actions that an object is able to do.\n\nLet’s take a look at the difference\
    \ between these two characteristics by looking at an actual object—a ball. The\
    \ state of the ball is going to be the size, color, and make of the ball. The\
    \ behavior of the ball could be something like rolling or bouncing.\n\nWith the\
    \ `OOP`, you will be able to combine the information and the techniques to process\
    \ them into one thing. The programming object is going to correspond to the actual\
    \ one and will hold onto the information and the actions.\n\n### Classes\n\nWhen\
    \ using `C#` the classes will define the characteristics of your object. They\
    \ will give you a structure or a model for defining the nature of the object.\
    \ According to some programming experts, the classes are basically the foundation\
    \ of `OOP` and they will be linked closely with the objects. In addition, each\
    \ of the objects that you use will represent one particular class.\n\nLet’s start\
    \ with a class that is called “Toys” and the object that is “Ball.” In this instance,\
    \ the “Ball” is just one instance of the `Toy` class. But the `Toy` class will\
    \ define the behavior and the state of all the toys as well as of the ball.\n\n\
    Classes can add some simplicity to your computer programming. The information\
    \ they will hold onto should be meaningful for anyone who looks at the program,\
    \ not just professional programmers. For example, the class of “Toys” can’t have\
    \ `HTTP` as one of the characteristics since these can’t be linked together.\n\
    \n## Attributes and Behavior\n"
