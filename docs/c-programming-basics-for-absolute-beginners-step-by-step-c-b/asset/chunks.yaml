  trans: "\n在 C# 编程语言中，你无法直接操作对象。这意味着你必须先将对象赋值给一个变量，才能对其进行操作。之后，你可以通过你选择的任何变量来访问和使用该对象。请记住，为了访问对象的方法和属性，你需要指定对象的标识符并使用点运算符（`.`）。\n\
    \n### 关于对象的更多信息\n\n你的 `.NET` 框架中的每个对象都包含两个部分：引用部分和实际部分。实际部分包含有关对象的信息，并存储在计算机操作系统中被称为动态内存的堆（heap）中。另一方面，`.NET`\
    \ 框架的引用部分存在于程序的执行栈（stack）中，该部分用于存放方法参数和局部变量。\n\n如果你想创建一个与对象关联的新变量，你需要确保给它赋值为 `null`。这个关键字会告诉语言编译器该变量目前没有值。\n\
    \n### 组织你的类\n\n在 C# 中保存代码时，你只需要遵循一个规则，即所有类都必须保存为 `.cs` 文件，以便于查找并使类能够正常工作。从技术上讲，你可以将创建的所有类都保存到一个文件中，编译器仍然可以工作而不会报错，但在大多数情况下，最好将它们保存在不同的文件中，以帮助你保持条洁。如果你将所有类都保在一个文件中，有时很难找到你想要的类。\n\
    \n### 使用命名空间 (namespace)\n\n你将熟悉在 C# 中使用 `namespace`。这是一组在逻辑上相互相关的类。它可以包含类、接口、结构体和其他类型的信息。无论它们在内存中的位置如何，你都可以将几个类组合进\
    \ `namespace` 中。\n\n如果你想在创建的代码中使用 `namespace`，请确保添加了 `using` 指令以简化操作。大多数程序员发现，在\
    \ `.cs` 文件的前几行编写这些指令是最容易的，这样可以确保他们不会忘记。在插入指令后，你可以声明你想要使用的命名空间。\n\n### 访问修饰符\n\n\
    C# 支持四种修饰符：`protected`、`private`、`internal` 和 `public`。这些修饰符允许你控制类中元素的可见性。让我们花时间详细讨论每种修饰符，以便你了解哪种适合你。\n\
    \n- `private`——此修饰符会对类进行限制。如果被标记为私有元素，则任何其他类都无法访问它。C# 将此作为修饰符的默认值，因此如果你不决定元素的访问权限，系统将将其设为私有。\n\
    - `public`——如果你希望元素能被其他类访问，你应该选择这种修饰符。这意味着你移除了所有关于对象可见性的限制。\n- `internal`——如果你的元素使用此修饰符，则它将仅对同一项目中的文件可访问。\n\
    - `protected`——此修饰符将阻止用户访问元素。但是，它允许所有后代类访问并使用相关的元素。\n\n根据你想要的功能，每种修饰符的工作方式略有不同。如果你想保持受保护并确保它不被其他类访问，你需要确保使用\
    \ `private` 设置。但如果你希望其他元素和类访问它，你需要将其设置为 `public`。当然，还有一些中间选项选项，可以帮助你确定其他类对此主修饰符有多大的访问权限。\n\
    \n你需要确定哪种适合你的代码。大多数情况下，你会发现 `private` 是默认选项，但你始终可以更改它，以确保修饰符在程序中按预期发挥作用。\n\n###\
    \ 声明类\n\nC# 在类声明方面有一些严格的规则。如果你没有很好地声明类，将会遇到运行时错误和编译时问题。为了确保不出现任何错误，你应该使用以下语法：\n\
    \n`<modifier> <class> <name_of_the_class?>`\n\n你需要在标识符之后直接编写类体，以便操作更简单。类体是包含可执行代码的部分，与其他与其他编程语言一样，你应该将此写在大括号\
    \ `{}` 内部。\n\n### “this” 关键字\n\n你应该学习的另一个关键字是 `this`。这是一个可以帮助你访问类内容的工具。使用该关键字的示例包括：\n\
    \n```csharp\nthis.sampleMethod(); // 使用此语法运行方法。\nthis.sampleField;   // 使用此语法访问特定字段。\n\
    this(8,9);           // 使用此语法触发包含两个参数的构造函数。\n```\n\n### 字段 (Fields)\n\n对象代表物理世界中的事物。为了定义这个对象，你将把精力集中在属性上，这些属性将与程序的目的相关联。你需要借助特殊变量将属性存储在类中。这些被称为字段（fields），它们定义了对象的状态。\n\
    \n#### 声明字段\n\nC# 要求你直接在类体中声明所有字段。以下代码展示了如何声明字段的几个示例：\n\n```csharp\nclass Example\n\
    {\n    double salary;\n    char letter;\n    string yourName;\n}\n```\n\n####\
    \ 字段的作用域\n\n字段的作用域从你开始编写的地方开始，一直持续到类体结束。这为你提供了很多编写你想要的内容的机会。\n\n#### 初始化你的字段\n\
    \nC# 可以轻松设置你创建的任何字段的值。用于设置字段值的语法与用于普通变量的语法非常相似。你应该使用的语法看起来如下：\n\n`<modifier> <type_of_field>\
    \ <name_of_field> = <value>;`\n\n需要注意的是，你应该检查初始值是否与你正在使用的字段兼容。C# 在数据类型所需兼容性的规则方面相当严格，以避免出现错误和运行时问题。请看以下示例：\n\
    \n```csharp\nclass Sample\n{\n    int payment = 5000;\n    char letter = 'x';\n\
    \    string [] instruments = new string[] {\"guitar\", \"drums\"};\n    Vehicles\
    \ myVehicle = new Vehicles();\n}\n```\n\n这将帮助你在程序中组合你需要的字段。你可以进行更改，使该功能与你选择的代码配合得最好。\n\
    \n#### 字段的默认选择\n\n当你从类内部创建对象时，系统都会预留一些内存来存放新对象的字段。系统可以通过设置初始字段或每个字段的值来实现这一点。如果你没有按照你自己的意愿设置这些默认值，`.NET`\
    \ 框架将为你设置这些值。\n"
- fmt: "\nThis is the main difference that occurs between the local variables and\
    \ the fields. The language compiler is going to send you an error message when\
    \ the local valuables don’t have the right value or any value at all. So you need\
    \ to make sure to go through this and get it set up with a value early on or you\
    \ may run into trouble with your project and you will have to go through and make\
    \ the right changes.\n\n### Customizing your default value\n\nWhen you are working\
    \ with the C# language, you will be allowed to set the default values for any\
    \ of your fields. This is a great feature that is going to allow you to make the\
    \ code easier to read and much cleaner compared to some of the other programming\
    \ languages that you will choose. Let’s take a look at some of the fields that\
    \ you saw earlier and see how we can make them customized so they look better\
    \ within the program:\n\n```class\nclass Sample\n{\n    int payment = 0;\n   \
    \ char letter = null;\n    string [] instruments = null;\n    Vehicles myVehicle\
    \ = null;\n}\n```\n\nReadability and cleanliness are two of the most important\
    \ parts that come with using the C# code so you need to find ways to work with\
    \ the code, value, classes, and other parts to compact them and make it look as\
    \ nice as possible without having too much work going on all the time. Working\
    \ with setting your default value can really help you to get this done right.\n\
    \nWorking in programming can be intimidating to some of those who haven’t had\
    \ a chance to work in it, but perhaps they have visions of really complicated\
    \ codes that look like a mess and are too difficult to mess with. The C# code\
    \ is a great language to learn with because it is simple to use and has a lot\
    \ of great features that even a beginner is going to be able to learn about with\
    \ ease.\n\n# Conclusion\n\nThank for making it through to the end of C#: Programming\
    \ Basics for Absolute Beginners, let’s hope it was informative and able to provide\
    \ you with all of the tools you need to achieve your goals whatever it may be.\n\
    \nThe next step is to get started on using C# programming language in your own\
    \ life. This is a great product to use, a programming language that works on most\
    \ computers and is made to be simple to use and read for beginners. We have walked\
    \ you through some of the steps that you need to take to create a program with\
    \ C# and even discussed some of the most important parts of the C# programming\
    \ language so you can really get started on the right track.\n\nWhile many other\
    \ programming languages are great to use and can allow you to do some powerful\
    \ things, some of them are a bit confusing and can scare away someone who is brand\
    \ new to the whole process. But with C#, you will not have this issue. You will\
    \ be able to get started on your first program right away (and we discuss some\
    \ of the options of doing this inside the book) and you will find that programming\
    \ can be a lot of fun and really easy.\n\nWhen you are ready to get started with\
    \ programming and making it work for your needs, make sure to check out this guidebook\
    \ and learn just how easy it is to work with C#.\n\nFinally, if you found this\
    \ book useful in any way, a review on Amazon is always appreciated!\n\n# About\
    \ the Author\n\nNathan Clark is an expert programmer with nearly 20 years of experience\
    \ in the software industry.\n\nWith a master’s degree from MIT, he has worked\
    \ for some of the leading software companies in the United States and built up\
    \ extensive knowledge of software design and development.\n\nNathan and his wife,\
    \ Sarah, started their own development firm in 2009 to be able to take on more\
    \ challenging and creative projects. Today they assist high-caliber clients from\
    \ all over the world.\n\nNathan enjoys sharing his programming knowledge through\
    \ his book series, developing innovative software solutions for their clients\
    \ and watching classic sci-fi movies in his free time.\n\nTo learn programming\
    \ from an expert, look out for more of Nathan’s books in store and online.\n"
