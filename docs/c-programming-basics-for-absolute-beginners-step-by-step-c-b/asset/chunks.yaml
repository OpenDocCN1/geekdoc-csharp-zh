    \ and learn the basics before going on to these other programs. Even if you choose\
    \ to stick with this programming language, you are going to find that it is powerful\
    \ enough to do most of the coding that you want without all the hassle of some\
    \ of the other programs.\n\nWhile you have a lot of choices to make when it comes\
    \ to picking out a coding language that will help you to make some great programs\
    \ while still being simple enough to learn as a beginner, the `C#` is one of the\
    \ best ones you can choose from for all the great benefits and things that you\
    \ can do with it.\n\n## What You Need\n\nLet’s start out with some of the things\
    \ that you will need in order to use this programming language. First, the computer\
    \ you are using should have a `.NET` framework as well as the development kit\
    \ that is used for Windows computers. Most of the modern operating systems from\
    \ Windows, with those starting on Windows Vista and above, will have this framework\
    \ already on the computer so you won’t have to install anything new on your computer.\n\
    \nIf you are working on a computer that doesn’t have the `.NET` framework, you\
    \ are able to download it for free. You just need to visit [www.microsoft.com](http://www.microsoft.com)\
    \ and then search for the framework to get started.\n\nOne thing to note is that\
    \ if you plan to use a Linux, UNIX, or Mac computer, you will need to choose `Mono\
    \ Project` rather than the `.NET` framework. This kit will help you to create\
    \ programs with `C#` on these computers. You can go to [www.monoproject.com](http://www.monoproject.com)\
    \ to get this proper framework.\n\n## Learning the C# Language\n\nWhen it comes\
    \ to using a Windows computer, `C#` is one of the best programming languages you\
    \ can find. It is compatible with the `.NET` framework that is on most modern\
    \ Windows computers and this language is simple, flexible, and still has a lot\
    \ of power with it. If you are new to programming and like the simplicity of using\
    \ Windows products, then the `C#` language is the right one for you.\n\nJust like\
    \ working with the `Java` language, `C#` isn’t going to support any code pointers\
    \ or even multiple inheritances. Rather, it is going to offer type checking and\
    \ memory collection. It also has some of the powerful features that programmers\
    \ like from `C++`, such as overloading, enumerations, and preprocessor directives\
    \ so you can get the simplicity and the power that you are looking for out of\
    \ this program.\n\n## Trying Out Your First Program with C#\n\nThe best way to\
    \ learn some about programming with `C#` is to try writing some of the programs.\
    \ So let’s dive in and get started writing a simple program with this language\
    \ to help you get your feet wet and learn a bit more about this option:\n\n* Launch\
    \ the text editor of your choice. If you are on a Windows computer, `Notepad`\
    \ is a great option. If you are on Linux, `vim` or `vi` are good options to try\
    \ out.\n\n* Type the following code:\n\n```csharp\nclass FirstProgram\n{\n   \
    \ static void Main()\n    {\n        Console.WriteLine(\"Using C# is fun.\");\n\
    \    }\n}\n```\n\n* Now you can access the command prompt and type:\n\n`csc FirstProgram.cs`\n\
    \nAfter you issue this command, the compiler for `C#` will process this file and\
    \ then create a `.exe` file in the same location as your code. For example, if\
    \ you saved the original file on the desktop, you should see a new program come\
    \ up called `FirstProgram.exe` right in the same place. If there is an error in\
    \ the code that you wrote, you will see an error message come up.\n\nNow you can\
    \ run this application by entering `FirstProgram.exe` into the command prompt.\
    \ If everything was done correctly, you should see that the command prompt will\
    \ display the message: “Using C# is fun.”\n\n## Analyzing This Program\n\nAs you\
    \ can see, creating a program on this language is not too complicated. You will\
    \ need to go through a few steps, but you can make the message and the results\
    \ as simple or as complicated as you want. Now that you have had a chance to create\
    \ your `C#` program, it is time to go over what you just did (if you notice there\
    \ were quite a few lines there for just writing out the simple statement) so that\
