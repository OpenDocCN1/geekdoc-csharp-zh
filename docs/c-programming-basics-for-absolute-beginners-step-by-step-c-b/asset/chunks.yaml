    # Introduction


    Congratulations on purchasing `C#: Programming Basics for Absolute Beginners and
    thank you for doing so.


    The following chapters will discuss how to get started with the `C#` programming
    language and how you are going to be able to use this for your own personal programming
    needs. Many people are worried about being able to use a programming language
    in their own lives. It may look complicated or they feel that all the rules and
    moving things around will just make it too hard to handle. But `C#` is a great
    option because it is simple to use, works with Windows devices, as well as several
    others, and you won’t look at the rules and feel confused right from the start.


    This guidebook is going to take the time to look at some of the different aspects
    of `C#` programming and even go through creating a few different codes so that
    you can get some practice. Sometimes getting into the coding process and giving
    it a try while learning, can make things so much easier to understand and avoids
    all the confusion and worry in the process. `C#` is a very easy program to use
    and you are going to love how easy it is to get started with.


    In addition to learning how this code works, you will learn all the other basics
    that come with using `C#` programming language. We will talk about variables,
    constants, comments, and so much more. Whether you just want to get a bit of experience
    with the programming world or you are ready to increase your computer programming
    knowledge and learn something new, `C#` is a great option to get started with
    and you are going to love how easy it is to use. This guidebook will give you
    all the tips that you need to understand this language and to get started right
    away.


    There are plenty of books on this subject on the market, thanks again for choosing
    this one! Every effort was made to ensure it is full of as much useful information
    as possible, please enjoy!


    # The Basics of C#


    When it comes to getting started with programming languages, many people run away
    in fear. Programming is hard and difficult for some people to understand and unless
    you have some experience or have worked with computers before, it is difficult
    to always understand what is going on in the instructions. This chapter will start
    with some of the basics that you need to get down in order to really learn about
    `C#` and how to use this great programming language.


    ## Why Use the C# Language?


    There are a number of programming languages that you can use to make your own
    codes from home. All of them have benefits and negatives that will determine whether
    you want to use them or not. Sometimes it is a matter of how clean the code looks
    and other times it may be based on the type of computer you are using or the program
    that you want to design.


    In this guidebook, we are going to spend some time looking at `C#` and showing
    all the great things that you can do with this programming language. Even as a
    beginner, there are things that you can learn with this program that will make
    the process easy while still providing some of the bells and whistles.


    So why would you choose to go with the `C#` program compared to going with some
    of the other choices such as `Java`, `C++` and `Python`? Here are some of the
    benefits that you should consider:


    - Have lots of functions in the library—if you are just getting starting and want
    to learn how to write out functions, there are a ton of them inside of the `C#`
    library so you will be able to use whenever you need some help. You can place
    these inside the code if you need it, or even make changes to have it work in
    your particular code.

    - Automatic disposal of functions—most programming languages will require you
    to go through and manually delete any item that you don’t want there. This can
    take a lot of time and will waste space on your memory if you don’t take care
    of it enough. But with `C#`, you will find that the program will delete the functions
    and objects that don’t have a value attached to them. This will help you to clear
    out the memory on your computer and saves a lot of time and space on your computer.

    - Easy to work with—`C#` is one of the easiest programs for you to work with.
    While it may not be as simple of a language as `Python`, it is on the easier side
    and you will find that the code is not clunky and you will be able to read through
    it pretty easily once the code is done. There are also options for writing comments
    so you will be able to leave some clarification in the code if someone else needs
    to use it later.

    - Does well with Windows computers as well as others—this programming language
    was originally used in order to work with Windows computers and help you to design
    a program for them. But it also works well with some other systems such as `Mac`,
    `Linux`, and more as long as you download `.NET` on it. Windows has some great
    products that are easy to use, especially for beginners, so you are sure to get
    great results when you get started.

    - Works with `.NET` which helps make it easy—this is a program that already comes
    with the Windows computers, but you can add it to some of the other systems in
    order to make `C#` accessible on these computers as well.

