    \ name and the class identifier be the same.\n\n*   You can use Main() more than\
    \ once within the program.\n\n*   When defining the boundaries of a method or\
    \ a class, make sure to use the curly brackets.\n\n*   You can use two types of\
    \ comments within C# to help explain things better. Multi-line and single line\
    \ are fine, as long as you use the right features of each.\n\n*   You can always\
    \ add in an argument or a string to your Main() method.\n\nUsing C# is one of\
    \ the best programming languages that you can choose. It is great to use with\
    \ most Windows computer, and it works great with other computers as well. It has\
    \ all the great features that you have come to know and love with Java and C++,\
    \ but it is much easier to use and can work for beginners without all the experience!\n\
    \n# \n\nVariables and Data Types\n\nWith a first glance at using C#, you can see\
    \ that this language is not too scary. While some of the other options are meant\
    \ for more advanced users and can be a bit complicated, you will find that this\
    \ is not always the case when using C#. So now that you have gotten your feet\
    \ a bit wet with C#, it is time to delve in deeper and learn a few more things\
    \ to make it more fun.\n\n## Data Types\n\nThose who have used C# often will choose\
    \ to divide the programming language into two parts; reference types and value\
    \ types. When you are working with a value type, you are going to pass the data\
    \ over to whichever method you are using. On the other hand, when working with\
    \ a reference type, you should just add the reference in with the method as the\
    \ value will be placed somewhere else. Some of the data types that you will find\
    \ when using the C# program include:\n\n*   Ulong\n\n*   Double\n\n*   Long\n\n\
    *   Float\n\n*   Uint\n\n*   Int\n\n*   Ushort\n\n*   Sbyte\n\n*   Short\n\n*\
    \   Byte\n\n*   Bool—when you use this type, the values that you are allowed to\
    \ store can only be two. The values are going to be false and true so it is good\
    \ for conditional statements and logical expressions.\n\n*   Decimal\n\n*   Char—this\
    \ is a data type that is only allowed to have one single character. When you are\
    \ writing the char value, you must include it with single quotes such as writing\
    \ out ‘t’ ‘b’ and so on.\n\n## Variables\n\nWhen you are doing an execution, the\
    \ computer program is going to store all the data for a short amount of time.\
    \ Programmers will often use the word “variables” when they are referring to the\
    \ locations of memory that will hold this stored data. Thus, the variable will\
    \ have a data type and corresponding value. When you are working in the C# language,\
    \ you are able to create a variable using this syntax:\n\n<data_type> <name_of_variable>\n\
    \nThe line above will save a part of your computers’ memory in order to hold onto\
    \ the char value. The programmer will then be able to access this variable using\
    \ the identifier it was given. For example, if you had listed the above formula\
    \ as char x, you could find the variable by going to x.\n\nC# also allows you\
    \ to initialize the variables during declaration. This term refers to the process\
    \ of giving a value to your variable when you are creating it.  You just need\
    \ to use your assignment operator, which is =, and then indicate the value that\
    \ you are trying to assign here. Some examples of this could be:\n\nint    year=2015\n\
    \nbool isItDelicious = false\n\nchar sample = ‘4’’\n\nYou can also declare a few\
    \ variables for one statement as long as they are of the same data type, you just\
    \ need to separate each of the entries using a comma. An example of this is:\n\
    \nchar ant = ‘a’, bull=’b’, cat=’c’\n\nJust like with other programming languages,\
    \ C# will require you to declare your variables before you are able to assess\
    \ them again. C# is also going to implement a new rule called definite assignment.\
    \ This means that you will need to initialize the local variable before you are\
    \ able to use it. You basically need to assign the initial value of a local variable\
    \ during the declaration process.\n\nSomething to keep in mind: variables are\
    \ named this way because the values that they are going to store will change every\
    \ time that the program runs. The values are going to change based on what you\
    \ place into them.\n\n## Constants\n\nNext on the list to understand are constants.\
    \ These are variable types that will prevent the program from changing the initial\
    \ value. This means that the value is going to stay constant, no matter what the\
    \ user is inputting in the process. You will need to use “const” when you want\
    \ to declare this constant. An example of this is:\n\nconst char LETTER=x;\n\n\
    Before you state one of these constants, you need to make sure that you really\
    \ want it that way. The program will not be able to change the value of a constant\
    \ if you’ve already put it in place. This means that you must assign the initial\
    \ value to it right at the variable declaration. For example, you will get an\
    \ error message if you put in the following command:\n\nconst bool ANSWER;\n\n\
    One thing to keep in mind about constants is that most are going to use uppercase\
    \ letters when they are declaring this. Knowing this information can help you\
    \ to read through C# code a bit easier and will make it easier to create your\
    \ own in a manner that others will be able to read and understand.\n\n## Creating\
    \ Your Identifier\n\nIf you look through the suggestions from Microsoft, you will\
    \ find that they recommend that you use a Camel notation when you are working\
    \ with variables and a Pascal notation when working with methods. When you are\
    \ doing a Camel notation, you will see that the first letter of the word is lower\
    \ case. If you are dealing with a compound word, the first letter in your second\
    \ word will start with an uppercase letter. Some examples of this include:\n\n\
    payment          completePayment\n\nmathematics          firstClass\n\nThe Pascal\
    \ notation will take things a bit differently. This notation style is going to\
    \ ask you to start the first word using an uppercase letter. The first letter\
    \ in all of the other words in the sequence should also be done in uppercase as\
    \ well. Some examples of using the Pascal notation include:\n\nWriteLine()         \
    \ ReadLine()\n\nStart()          Main()\n\nIt is also possible to use underscore\
    \ characters and numbers as well when you are creating an identifier. But, you\
    \ are not allowed to start the identifier using a number. You can write fiveBooks\
    \ as an identifier, but you are not allowed to write 5Books.\n\nWhile these notations\
    \ aren’t mandatory, you are often advised to use them when you are writing statements\
    \ with C#. This can help you to keep the code pretty clean and makes it easier\
    \ for others to be able to go through and read your source codes later on if they\
    \ need to.\n\nC# has made creating a code pretty easy. You don’t need to worry\
    \ about a lot of complicated rules that come with some of the other codes and\
    \ yet you are still going to get a lot of the power that you are looking for.\
    \ The good news is, we have already looked at some of the most important parts\
    \ that come with using C#, and so far you have even written a code. So now let’s\
    \ take this knowledge and move into some more of the things that you are able\
    \ to do with this great programming language.\n\n# \n\nWorking on the Operators\n\
    \nThe next thing that we will learn about are the operators. The operators are\
    \ going to help your created programs learn how to perform tasks and handle values.\
    \ Without this part of the formula, your computer programs can’t do much and will\
    \ become useless so knowing how to write operators and how they work will make\
    \ a big difference in how your program works for you."
