    \n## 用 C# 尝试你的第一个程序\n\n学习 `C#` 编程最好的方法是尝试编写一些程序。所以，让我们深入吧，用这种语言编写一个简单的程序，帮助你入门并了解更多关于这个选项的信息：\n\
    \n* 启动你选择的文本编辑器。如果你使用的是 Windows 电脑，`Notepad` 是一个很好的选择。如果你在 Linux 上，`vim` 或 `vi`\
    \ 是可以尝试的好选择。\n\n* 输入以下代码：\n\n```csharp\nclass FirstProgram\n{\n    static void\
    \ Main()\n    {\n        Console.WriteLine(\"Using C# is fun.\");\n    }\n}\n\
    ```\n\n* 现在你可以访问命令行提示符并输入：\n\n`csc FirstProgram.cs`\n\n执行此命令后，`C#` 编译器将处理该文件，并在代码相同的位置创建一个\
