    # 简介


    - 这种编程语言是区分大小写的。这意味着 `class` 和 `CLASS` 对程序来说具有不同的含义。

    - 编译器将忽略你创建的空白。这包括空格、制表符和换行符。你可以随心所欲地使用这些空白来帮助程序看起来更易读。

    - `C#` 允许你为程序选择任何你喜欢的名称。你不需要程序的名称和类标识符保持一致。

    - 你可以在程序中多次使用 `Main()`。

    - 在定义方法或类的边界时，请务必使用大括号。

    - 你可以在 `C#` 中使用两种类型的注释来帮助更好地解释内容。多行注释和单行注释都可以的，只要你使用了每种注释正确的功能。

    - 你可以随时向你的 `Main()` 方法中添加参数或字符串。


    使用 `C#` 是你可以选择的最优秀的编程语言之一。它在大多数 Windows 电脑上非常好用，在其他电脑上运行得也很好。它拥有你在 `Java` 和 `C++`
    中熟悉并喜爱的所有优秀特性，但它要用得多，而且即使没有经验的初学者也能胜任！


    # 变量与数据类型


    初看 `C#`，你会发现这种语言并没有那么可怕。虽然其他一些选项是为更高级的用户设计的，可能有点复杂，但你会发现在使用 `C#` 时情况并不总是如此。现在既然你已经初步接触了
    `C#`，是时候深入钻究并学习更多东西来，让它变得更有趣了。


    ## 数据类型


    经常使用 `C#` 的人通常会选择将这种编程语言分为两个部分：引用类型和值类型。当你处理值类型时，你会将数据传递到你正在使用的任何方法。另一方面，当处理引用类型时，你只需要将引用传递给方法，因为值将被放置在其他地方。在使用
    `C#` 程序时你会发现的一些数据类型包括：


    - `Ulong`

    - `Double`

    - `Long`

    - `Float`

    - `Uint`

    - `Int`

    - `Ushort`

    - `Sbyte`

    - `Short`

    - `Byte`

    - `Bool`——当你使用这种类型时，允许存储的值只有两个。这两个值是 `false` 和 `true`，因此非常适合条件语句和逻辑表达式。

    - `Decimal`

    - `Char`——这是一种允许只有一个单个字符的数据类型。当你编写 `char` 值时，必须用单引号将其包含起来，例如写出 ‘t’、‘b’ 等。


    ## 变量


    当你执行操作时，计算机程序会在短时间内存储所有数据。程序员经常使用“变量”一词来指代存储这些存储数据的内存位置。因此，变量将具有一个数据类型和对应的值。在
    `C#` 语言中工作时，你可以使用以下语法创建变量：


    ```

    <data_type> <name_of_variable>

    ```


    上述行将保存你计算机的一部分内存以保留 `char` 值。然后，程序员可以使用它被赋予的标识符来访问该变量。例如，如果你将上述公式列为 `char x`，你就可以通过
    `x` 找到该变量。


    `C#` 还允许你在声明期间初始化变量。这个术语是指在创建变量时给你的变量赋值的过程。你只需要使用你的赋值运算符，即 `=`，然后指示你尝试在这里赋值的值。这里是一些可能的例子：


    ```

    int year=2015

    bool isItDelicious = false

    char sample = ‘4’

    ```


    你也可以为一个语句声明几个变量，只要它们具有相同的数据类型，你只需要用逗号分隔每个条目即可。这样的例子是：


    ```

    char ant = ‘a’, bull=’b’, cat=’c’

    ```


    就像与其他编程语言一样，`C#` 要求你在再次评估变量之前先声明它们。`C#` 还会实施一种称为“确定性赋值”（definite assignment）的新规则。这意味着你在使用局部变量之前需要初始化它。你基本上需要在声明过程中为局部变量分配初始值。


    需要记住的一点：变量之所以这样命名，是因为它们将存储的值在每次程序运行时都会改变。值将根据你放入的内容而改变。


    ## 常量


    接下来要理解的是常量。这些是防止程序更改初始值的变量类型。这意味着无论用户在过程中输入什么，值都将保持不变。当你想要声明此常量时，需要使用 `const`。这里的例子是：


    ```

    const char LETTER=x;

    ```


    在声明这些常量之一之前，你需要确保你确实希望它是那样的。如果你已经设定了它，程序将无法更改常量的值。这意味着你必须在变量声明时立即为其分配初始值。例如，如果你输入以下命令，将得到错误消息：


    ```

    const bool ANSWER;

    ```


    关于常量需要记住的一点是，当你声明它们时，大多数使用大写字母。了解这些信息可以帮助你更轻松地阅读 `C#` 代码，并让你更容易以他人能够阅读和理解的方式创建你自己的代码。


    ## 创建你的标识符


    如果你查看微软的建议，你会发现他们建议在处理变量时使用驼峰命名法（Camel notation），在处理方法时使用帕斯卡命名法（Pascal notation）。当你使用驼峰命名法时，你会发现单词的首字母是小写的。如果你处理的是复合词，第二个单词的第一个字母将以大写字母开头。这里是一些相关的例子：


    ```

    payment         completePayment

    mathematics      firstClass

    ```


    帕斯卡命名法的方式略有不同。这种命名风格要求你使用大写字母开始第一个单词。序列中所有其他单词的首字母也应该大大写。使用帕斯卡命名法的例子包括：


    ```

    WriteLine()      ReadLine()

    Start()          Main()

    ```


    在创建标识符时，也可以使用下划线字符和数字。但是，你不允许使用数字开头标识符。你可以将 `fiveBooks` 作为标识符，但你不能写 `5Books`。


