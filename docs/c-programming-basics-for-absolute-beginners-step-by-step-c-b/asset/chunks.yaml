    \ it is too complicated and won’t help them to get things done. They want to stick\
    \ with just the “if” clause and assume that it is the best option for getting\
    \ things done. But for those who want to have a lot of options with their statements,\
    \ or who want different options to show up depending on the answers that are given,\
    \ using the “if else” clause is going to be one of the best options that you can\
    \ use.\n\nIt isn’t that hard of one to understand. It just provides you some more\
    \ options than you will find with the other choices. After you get some time to\
    \ experiment with the “if” clauses, make sure that you work on getting used to\
    \ the “if else” clauses so that you can bring your new codes to a whole new level.\n\
    \n## Nested Conditional Statements"
