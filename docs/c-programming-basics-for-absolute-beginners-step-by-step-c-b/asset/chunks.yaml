    \n### 调用对象的方法\n\n你需要使用两个运算符，包括调用运算符（invocation operator）和点运算符（dot operator）。如果你选择操作的对象和方法在同一个类中，则不需要使用点运算符，但括号总是强制性的。要调用该方法，你只需要指定标识符，然后紧跟调用运算符即可。你可以在括号内放置参数，也可以为方法添加参数。\n\
    \n当你用 C# 编写程序时，可以为方法添加访问修饰符。C# 支持四种访问修饰符，包括 `private`、`internal`、`protected` 和\
    \ `public`。这些修饰符将帮助你在处理方法时限制调用权限。虽然它们所有修饰符都很重要，但我们将重点关注 `public` 修饰符以及它们将如何让信息（即对象）公开可用。\n\
    \n## 构造函数\n\n构造函数是程序员每次创建新对象时都会运行的方法。构造函数背后的理念是初始化新对象的数据。在使用此方法时，你不会获得任何返回值。此外，构造函数使用的名称与它所属的类相同，这意味着它不会有一个随机的名称供你记忆。在使用\
    \ C# 语言时，你还可以为构造函数分配参数。\n\n### 构造函数的参数\n\nC# 中的构造函数像你在语言中使用的方法一样接受参数。你可以在类中设置几个不同的构造函数，但你应该检查并确保构造函数具有不同类型和数量的参数；这基本上确保了构造函数的唯一性。\n\
    \n记住，每你在类内部创建对象时，构造函数就会运行。如果你有一个类内部包含多个构造函数，你可能会好奇在创建新对象时是哪一个构造函数在运行。C# 能够为你确定正确的构造函数，因此你不需要担心，也不需要手动执行任何操作。\n\
    \n语言编译器将根据你最初设置的参数来选择正确的构造函数，这种原则被称为“最佳匹配”（best match）。这有助于保持条理清晰，并加快程序的编写过程。\n\
    \n使用构造函数的良好示例包括：\n\n```csharp\npublic class Device\n{\n    private string type;\n\
    \    private string size;\n    // 一个没有任何参数的构造函数\n    public Device()\n    {\n\
    \        this.type =”laptop”;\n        this.type = “large”;\n    }\n    // 一个带有两个参数的构造函数\n\
    \    {\n        this.type = type;\n        this.size = size;\n    }\n}\n```\n\n\
    这些 `parameters`（参数）可以帮助程序程序你想做什么。它也让 C# 更容易根据你当前正在的工作判断出你想显示哪个构造函数。\n\n## 静态数据成员\n\
    \n到目前为止，我们一直在研究指示正在使用的对象的状态。这些字段将直接与特定类内部的对象关联。在 OOP 中，你会遇到与类关联的不同特殊类型的字段和方法，而不是与对象本身关联。这被称为“静态数据成员”，因为它不会受对象的影响。它甚至可以在没有任何对象的情况下在类内部运行。\n\
    \n当你编写程序时，你需要花时间使用 `static` 关键字定义静态方法。你可以将其放置在方法的值类型或字段类型中。如果在 C# 中需要，你甚至可以使用这些来创建静态构造函数。对于这种情况，你把\
    \ `static` 关键字直接放在构造函数名称之前。\n\n对象和类是 C# 工作机制的重要部分，它们将帮助你真正实现你想要的代码。上述主题只是你在这个编程语言中使用类和对象可以做的一些很棒的事情，通过一点实验，你会发现，使用这种易于使用的语言，几乎一切都是可能的！\n\
    \n# 在 C# 中定义类\n\n我们在上一个章节中花了一些时间研究类和对象，但在这里我们将更多地研究类并学习如何在 C# 语言中定义这些类。让我们来看看并开始这部分！\n\
    \n## 类的基础\n\n在编程语言中，类定义了程序可以使用的数据和对象类型。对象包含这些实际信息，用以定义其容器的状态。类还可以描述对象的行为。这是对象能够执行的所有行为。在进行\
    \ OOP 时，你应该使用方法来描述对象的行为。\n\n## 类的组件\n\n每个类都包含几个不同的部分，包括：\n\n*   声明（Declaration）——这一行将用于声明类的标识符。\n\
    *   体（Body）——就像方法一样，类将有一个体。你需要在做出声明后立即定义体。体是位于大括号之间的语句或多条语句。示例如下：\n\n```csharp\n\
    class Example\n{\n// 这是“Example”类的体。\n}\n```\n\n*   构造函数（Constructor）——这是允许你创建新对象的部分。示例如下：\n\
    \n```csharp\nPublic Sample()\n{\n//在此处插入你想说的内容。\n}\n```\n\n*   字段（Fields）——这些是在类中声明的变量。字段将包含代表其尝试获取的对象精确状态的值。\n\
    *   属性（Properties）——这部分将描述类的不同属性。许多程序员会直接在所选对象的字段内部编写类属性。\n*   方法（Methods）——方法基本上是一个可执行的具名代码块。它能够完成某些任务，并允许对象获得正确的行为。它还可以执行代码内部存在的正确算法。\n\
    \n接下来的示例将向你展示使用 C# 语言创建类的最佳方法，并包含我们上面讨论过的对类来说重要的所有部分。\n\n```csharp\nclass ZooAnimals\
    \ // 这是类的声明\n{\n    // 这个括号标志着类的开始\n    string animalType // 这一行声明了一个新字段\n   \
    \ public ZooAnimals() // 这一行声明了一个空的构造函数。\n    {\n    }\n    public ZooAnimals(monkey\
    \ animalType) // 这一行为该类创建了另一个构造函数。\n    {\n        this.animalType = animalType;\n\
    \    }\n    string ZooAnimals // 这里，你正在声明一个属性。\n    {\n        get {return animalType;}\n\
    \        set { animalType = value;}\n    }\n    Static void Animal() // 这一行为类声明了一个新方法。\n\
    \    {\n        System.Console.WriteLine(“This is a {0}.” animalType)\n    }\n\
    }\n```\n\n## 对象和类\n\n现在我们了解了一些如何创建和使用类对象，是时候进一步学习这种技术以及它在你编程时将如何工作。\n\n### 自定义类\n\
    \n在你开始使用特定类之前，需要在类内部有一个对象。你可以通过从 `new` 关键字和类内部存在的构造函数开始来实现。\n\n"
- fmt: "In the C# programming language, you are not going to be able to manipulate\
    \ the objects directly. This means that you will have to assign your object to\
    \ a variable before you are able to manipulate it. You can then access and use\
    \ the object through whichever variable you choose to assign the object too. Keep\
    \ in mind that in order to access the methods and the properties of the object,\
    \ you will need to indicate the identifier of the object and use the dot operator.\n\
    \n### More about objects\n\nEach of the objects in your `.NET` framework will\
    \ have two parts, the reference part and the actual part. The actual part is going\
    \ to contain the information about your object and it is stored inside a heap\
    \ that is known as the dynamic memory on the operating system of the computer.\
    \ On the other hand, the reference part of the `.NET` framework is going to exist\
    \ in the execution stack of the program, which is the part that will hold the\
    \ method parameters and the local variables.\n\nIf you want to create a new variable\
    \ that isn’t associated with an object, you need to make sure to give it a value\
    \ of `null`. This keyword is going to tell the language compiler that the variable\
    \ doesn’t have a value at this time.\n\n### Organizing Your Classes\n\nWhen you\
    \ are saving in C#, there is just one rule that you will need to follow and that\
    \ is all the classes need to be saved as `.cs` files to make it easier to find\
    \ and to make the class work. Technically, you are able to save all of the classes\
    \ that you are creating into one file and the compiler will still work without\
    \ any errors, but in most cases it is best to save them in different files to\
    \ help you keep things organized. Sometimes it is hard to find the class that\
    \ you want if you save them all in just one file.\n\n### Using namespace\n\nYou\
    \ are going to want to get familiar with using `namespace` with C#. This is a\
    \ set of classes that will be related in some logical manner. It can include classes,\
    \ interfaces, structures, and other kinds of information. You can combine together\
    \ a few classes into a `namespace` regardless of where they are located in the\
    \ memory.\n\nIf you would like to use a `namespace` on the codes that you are\
    \ creating, make sure that you add a `using` directive to make this easier. Most\
    \ programmers find that it is easiest to write these directives inside the first\
    \ couple of lines in the `.cs` files to make sure they don’t forget about it.\
    \ After you insert the directive, you can declare which namespace you wish to\
    \ use.\n\n### Access Modifiers\n\nC# is able to support four types of modifiers,\
    \ `protected`, `private`, `internal`, and `public`. These modifiers are going\
    \ to allow you to have some control over the visibility of the elements in your\
    \ class. Let’s take some time to discuss each of the modifiers in detail so you\
    \ know which one is right for you.\n\n- `private`—this modifier is going to place\
    \ a restriction on the class. If it tagged as a private element, it is not accessible\
    \ by any of the other classes. The C# will use this as the default for modifiers\
    \ so if you don’t decide what accessibility the element has, the system will make\
    \ it private.\n- `public`—this is the modifier that you should choose if you want\
    \ your element to be accessible with the other classes. This means that you are\
    \ taking away all the limitations in regards to the visibility of the object.\n\
    - `internal`—if your element has this as the modifier, it is going to be accessible\
    \ just to the files that are in the same project.\n- `protected`—this modifier\
    \ is going to prevent a user from accessing the element. However, it will all\
    \ the descendant classes to access and use the elements that are involved.\n\n\
    Each of these modifiers is going to work in a slightly different way based on\
    \ what you want it to do. If you want to keep it protected and ensure that it\
    \ isn’t accessed by the other classes, you will want to make sure that you use\
    \ a `private` setting. But if you would like other elements and classes access\
    \ to it, you will need to make it `public`. And of course, there are options that\
    \ always go in between to help you determine how much access other classes will\
    \ have to this main modifier.\n\nYou will need to determine which one is going\
    \ to be right for your code. Most of the time you will find that `private` is\
    \ going to be the default option, but you can always make the change to ensure\
    \ that your modifiers are doing what they should within the program.\n\n### Declaring\
    \ a Class\n\nC# does have some strict rules when it comes to class declarations.\
    \ You are going to get runtime errors and compile time issues if you don’t do\
    \ a good job with declaring your classes. To ensure that you aren’t getting any\
    \ errors, you should use the following syntax:\n\n`<modifier> <class> <name_of_the_class?>`\n\
    \nYou need to write in the body of the class right after the identifier to keep\
    \ things easier. The body is going to be the part that will contain the executable\
    \ codes so just like with other languages for programming, you should write this\
    \ inside of your curly braces.\n\n### “This” Keyword\n\nAnother keyword that you\
    \ should learn about is the `this` keyword. This is a tool that will help you\
    \ to access the contents of a class. Some examples of using this keyword include:\n\
    \n```csharp\nthis.sampleMethod(); // Use this syntax to run a method.\nthis.sampleField;\
    \   // Use this syntax to access a particular field.\nthis(8,9);           //\
    \ Use this syntax to trigger a constructor that contains two parameters.\n```\n\
    \n### The Fields\n\nThe object is going to represent things that are in the physical\
    \ world. To define this object, you are going to spend your energy concentrating\
    \ on the attributes, which will then be linked to purposes of your program. You\
    \ will need to store the attributes into the class with the help of special variables.\
    \ These will be called fields and they will define the statuses of the object.\n\
    \n#### Declaring a field\n\nC# is going to require you to declare all your fields\
    \ right in the body of the class. The following code will show a few examples\
    \ of how you can declare fields:\n\n```csharp\nclass Example\n{\n    double salary;\n\
    \    char letter;\n    string yourName;\n}\n```\n\n#### The scope of a field\n\
    \nThe scope of your field will begin from the part where you start writing and\
    \ will continue until the body of the class is done. This allows for a lot of\
    \ chances to write out what you would like.\n\n#### Initializing your field\n\n\
    C# makes it easy to set the value of any fields that you create. The syntax that\
    \ you will use to set the value of the fields will be pretty similar to the syntax\
    \ that you use for ordinary variables. The syntax that you should use for these\
    \ looks like this:\n\n`<modifier> <type_of_field> <name_of_field> = <value>;`\n\
    \nSomething to take of is that you should check that the initial value is going\
    \ to be compatible with the field that you are using. C# is kind of strict on\
    \ the rules regarding how compatible the data types need to be in order to avoid\
    \ issues with errors and runtime issues coming up. Take a look at the following\
    \ example:\n\n```csharp\nclass Sample\n{\n    int payment = 5000;\n    char letter\
    \ = 'x';\n    string [] instruments = new string[] {\"guitar\", \"drums\"};\n\
    \    Vehicles myVehicle = new Vehicles();\n}\n```\n\nThis is going to help you\
    \ to put together the field that you would like in the program. You can make changes\
    \ that you would like to make this function work the best with your chosen code.\n\
    \n#### Default Choices with the Field\n\nAny time that you create your object\
    \ inside a class, the system is going to set aside some memory in order to hold\
    \ the fields of the new object. The system will be able to do this by setting\
    \ an initial field or the value of every field. If you don’t go through and set\
    \ this default the way that you want it, the `.NET` framework will work to set\
    \ the values for you.\n"
  raw: 'In the C# programming language, you are not going to be able to manipulate
    the objects directly. This means that you will have to assign your object to a
    variable before you are able to manipulate it. You can then access and use the
    object through whichever variable you choose to assign the object too. Keep in
    mind that in order to access the methods and the properties of the object, you
    will need to indicate the identifier of the object and use the dot operator.


    ### More about objects


    Each of the objects in your .NET framework will have two parts, the reference
    part and the actual part. The actual part is going to contain the information
    about your object and it is stored inside a heap that is known as the dynamic
    memory on the operating system of the computer. On the other hand, the reference
    part of the .NET framework is going to exist in the execution stack of the program,
    which is the part that will hold the method parameters and the local variables.


    If you want to create a new variable that isn’t associated with an object, you
    need to make sure to give it a value of “null”. This keyword is going to tell
    the language compiler that the variable doesn’t have a value at this time.


    ## Organizing Your Classes


    When you are saving in C#, there is just one rule that you will need to follow
    and that is all the classes need to be saved as .cs files to make it easier to
    find and to make the class work. Technically, you are able to save all of the
    classes that you are creating into one file and the compiler will still work without
    any errors, but in most cases it is best to save them in different files to help
    you keep things organized. Sometimes it is hard to find the class that you want
    if you save them all in just one file.


    ### Using namespace


    You are going to want to get familiar with using namespace with C#. This is a
    set of classes that will be related in some logical manner. It can include classes,
    interfaces, structures, and other kinds of information. You can combine together
    a few classes into a namespace regardless of where they are located in the memory.


    If you would like to use a namespace on the codes that you are creating, make
    sure that you add a “using” directive to make this easier. Most programmers find
    that it is easiest to write these directives inside the first couple of lines
    in the .cs files to make sure they don’t forget about it. After you insert the
    directive, you can declare which namespace you wish to use.


    ## Access Modifiers


    C# is able to support four types of modifiers, protected, private, internal, and
    public. These modifiers are going to allow you to have some control over the visibility
    of the elements in your class. Let’s take some time to discuss each of the modifiers
    in detail so you know which one is right for you.


    *   Private—this modifier is going to place a restriction on the class. If it
    tagged as a private element, it is not accessible by any of the other classes.
    The C# will use this as the default for modifiers so if you don’t decide what
    accessibility the element has, the system will make it private.


    *   Public—this is the modifier that you should choose if you want your element
    to be accessible with the other classes. This means that you are taking away all
    the limitations in regards to the visibility of the object.


    *   Internal—if your element has this as the modifier, it is going to be accessible
    just to the files that are in the same project.


    *   Protected—this modifier is going to prevent a user from accessing the element.
    However, it will all the descendant classes to access and use the elements that
    are involved.


    Each of these modifiers is going to work in a slightly different way based on
    what you want it to do. If you want to keep it protected and ensure that it isn’t
    accessed by the other classes, you will want to make sure that you use a private
    setting. But if you would like other elements and classes access to it, you will
    need to make it public. And of course, there are options that always go in between
    to help you determine how much access other classes will have to this main modifier.


    You will need to determine which one is going to be right for your code. Most
    of the time you will find that private is going to be the default option, but
    you can always make the change to ensure that your modifiers are doing what they
    should be within the program.


    ## Declaring a Class


    C# does have some strict rules when it comes to class declarations. You are going
    to get runtime errors and compile time issues if you don’t do a good job with
    declaring your classes. To ensure that you aren’t getting any errors, you should
    use the following syntax:


    <modifier> <class> <name_of_the_class?>


    You need to write in the body of the class right after the identifier to keep
    things easier. The body is going to be the part that will contain the executable
    codes so just like with other languages for programming, you should write this
    inside of your curly braces.


    ## “This” Keyword


    Another keyword that you should learn about is the “this” keyword. This is a tool
    that will help you to access the contents of a class. Some examples of using this
    keyword include:


    this.sampleMethod();          //Use this syntax to run a method.


    this.sampleField:          //Use this syntax to access a particular field.


    this(8,9);          // Use this syntax to trigger a constructor that contains
    two parameters.


    ## The Fields


    The object is going to represent things that are in the physical world. To define
    this object, you are going to spend your energy concentrating on the attributes,
    which will then be linked to purposes of your program on the computer. You will
    need to store the attributes into the class declaration with the help of special
    variables. These will be called fields and they will define the various statuses
    of the object you are working with.


    ### Declaring a field


    C# is going to require you to declare all of your fields right in the body of
    the class. The following code will show a few examples of how you can declare
    fields in your class:


    class Example


    {


         double salary;


         char favoriteLetter;


         string yourName:


    }


    ### The scope of a field


    The scope of your field will begin from the part where you start writing it and
    will continue until the body of the class is done. This allows for a lot of chances
    to write out what you would like to say in the field.


    ### Initializing your field


    C# makes it easy to set the value of any fields that you create. The syntax that
    you will use to set the value of the fields will be pretty similar to the syntax
    that you use for ordinary variables. The syntax that you should use for these
    fields looks like this:


    <modifier> <type_of_field>  <name_of_field>  = <value>;


    Something to take note of is that you should check that the initial value is going
    to be compatible with the field that you are using. C# is kind of strict on the
    rules regarding how compatible the data types need to be in order to avoid issues
    with errors and runtime issues coming up on the screen. Take a look at the following
    example:


    class Sample


    {


         int payment = 5000;


         char letter = ‘x’;


         string [] instruments = new string[] {“guitar”, “drums”};


         Vehicles myVehicle = new Vehicles()


         }


    This is going to help you to put together the field that you would like in the
    program. You can make changes that you would like to make this function work the
    best with your chosen code.


    ## Default Choices with the Field


    Any time that you create your object inside a class, the system is going to set
    aside some memory in order to hold the fields of the new object. The system will
    be able to do this by setting an initial field or the value of every field. If
    you don’t go through and set this default the way that you want it, the .NET framework
    will work to set the values for you.'
