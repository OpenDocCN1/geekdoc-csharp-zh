  trans: "\n正如你可能接触过的其他编程语言一样，C# 也拥有属于不同类别的运算符。让我们来看看每个类别，以及你将如何处理每个类别中的运算符。\n\n##\
    \ 算术运算符\n\n这些是告诉你的计算机程序执行算术过程的运算符。这可以帮助计算机了解你何时需要将内容相加、减去它们等等。计算机可以为你完成一些基础工作，同时通过正确的符号告诉程序你想让它执行的操作。你可以在\
    \ C# 中使用的一些算术运算符包括：\n\n对于这些示例，让我们假设 `x=15` 且 `y=10`\n\n- `+` 这是加法运算符。它将把两个操作数相加。所以你会得到\
    \ `x+y=25`。\n- `-` 这是减法运算符。它允许你从左侧操作数的值中减去右侧操作数的值。所以你会得到 `y-x=-5`。\n- `*` 这个运算符将告诉计算机相乘两个操作数。所以你可以执行\
    \ `x*y=150`。\n- `/` 这个运算符将告诉计算机用左侧操作数除以右侧操作数。例如 `y/x`。- `%` 这通常被称为取余运算符或模运算符。它将左侧操作数除以右侧操作数，然后返回余数。\n\
    - `++` 这是递增运算符。它将操作数的值加一。所以你会得到 `++x=16`。\n- `--` 程序员通常称之为递减运算符。它将操作数的值减一。这意味着你将会得到\
    \ `--x=14`。\n\n需要注意的是，递减和递增运算符被视为一元运算符的，这意味着它们只能用于一个操作数。此外，你也可以在使用递增和递减值之前或之后将运算符相加。\n\
    \n这里是一个包含算术运算符的代码示例：\n\n```c\nclass Example\n{\n    // 这个基础程序将向你展示算术运算符是如何工作的\n\
    \    static void Main()\n    {\n        Int f =3, g = 4;         // 这一行声明了两个变量，f\
    \ 和 g。\n        sampleSum = f+g;        // 这将给你 7。\n        sampleDifference =\
    \ g-f  // 这将给你 1。\n        sampleProduct = f*g;    // 这将给你 1.3\n        sampleModulo\
    \ = g%f;     // 这将给你 1\n        f++                     //这将给你 3。\n    }\n}\n\
    ```\n\n使用算术运算符非常简单，因为它只是告诉计算机将两个数字放在一起。你只需要设置所有数字将等于什么的参数，计算机就可以完成其余的工作。\n\n列表中的下一个是赋值运算符。这种运算符允许你为变量赋值一个值。在使用\
    \ C# 时你可以选择的一些赋值运算符包括：\n\n- `=` 此运算符允许你执行简单的赋值操作。它将一个值赋值给你当前正在操作的变量。例如，编写 `int\
    \ sample = 100` 将告诉程序你想将 100 赋值给名为 `sample` 的变量。它不会对该变量或涉及的值执行任何额外的处理。\n- `+=`\
    \ 这是加法赋值运算符。它将你的两个操作数的值相加，然后将和赋值给你的左侧操作数。\n- `-=` 程序员通常称之为减法赋值运算符。它将左侧操作数的值减去右侧操作数的值，然后将差赋值给左侧操作数。\n\
    - `*=` 此运算符将每个操作数的值相乘，然后将乘积赋值给左侧操作数。\n- `/=` 当你除法这两个变量，然后将结果赋值给左侧的变量。\n\n需要注意的是，当你使用赋值运算符时，你需要确保两个操作数都属于相同的数据类型。如果你发现操作数不兼容，程序在运行时可能无法正常工作，你将不得不回头进行更改。\n\
    \n## 关系运算符\n\n这些是允许你比较两个操作数值的运算符。因为如此，它们非常适合条件语句。这些在使用 C# 时可能会遇到的一些关系运算符。对于这些，让我们假设\
    \ `d=100` 且 `e=150`\n\n- `==` 这是你可以用来检查两个值是否相等的运算符。如果两个值最终相等，运算符将告诉你 true。否则，它将告诉你\
    \ false。例如，`d == e` 将显示为 false。\n- `!=` 此运算符允许你测试两个值是否不等。如果两个值最终不相等，结果将为 true。\
    \ \n- `>` 此运算符用于检查左侧操作数是否大于右侧操作数。如果是，则运算符将告诉你 true。例如，`e > d` 为 true。\n- `<` 这是小于运算符，它允许你检查左侧操作数是否小于右侧操作数。如果是，你将得到\
    \ true 显示，例如公式 `d < e`。\n- `>=` 这是运算符，当左侧的值大于或等于右侧的操作数时，它将说是 true。否则，它将说是 false。例如，`e\
    \ >= d` 的求值结果为 true。\n- `<=` 使用此运算符，如果左侧的操作数小于或等于右侧的操作数，你将得到 true。\n\n当你使用关系运算符时，结果是每次都会得到一个布尔值（Boolean\
    \ value）。这意味着你想要得到一个 true 或 false 的答案。在在使用等等运算符时，还应该检查你是否使用了两个等号。如果你将它与赋值运算符混淆，程序中可能会出现错误。\n\
    \n## 逻辑运算符\n\n你能够使用的运算符的另一种选择是逻辑运算符。这有时被称为布尔运算符，因为它将接受两个布尔值以产生一个新的布尔值。请记住，C# 将允许并支持四种类型的逻辑运算符。\n\
    \n在这里我们假设 `c=true`、`d=true` 且 `e=false`\n\n- `&&` 此运算符称为逻辑与。只有当两个操作数都为 true 时，结果才为\
    \ true。例如，`d && c` 的求值结果为 true。\n- `||` 这是逻辑或。只要你的两个操作数中有一个为 true，此运算符就会给你 true。例如，`c\
    \ || e` 结果为 true。\n- `^` 此运算符是逻辑异或，当其中一个操作数为 true 时，结果将为 true。如果两个操作数都为 false\
    \ 或 true，运算符将给你 false。\n- `!` 使用此运算符，你将能够反转布尔变量的值。例如，如果你输入 `!d`，你将得到 false。\n\n"
- fmt: "\nSome programmers will refer to `||` and `&&` as short circuit operators.\
    \ This is because these signs are able to give accurate results without checking\
    \ the whole expression. An example of this is `&&`, since it will require two\
    \ trues, it will result in a false if the first operand says false, no matter\
    \ what the rest say and it won’t even look at them. This can help to speed up\
    \ the program a bit and get the work done.\n\n## Bitwise Operators\nThis kind\
    \ of operator is going to work pretty similarly to the logical operator. The difference\
    \ is that the bitwise operator will take binary values in order to produce the\
    \ Boolean result. Since this operator is going to work on binary options, basically\
    \ values that are composed of zeros and ones, they are going to show their results\
    \ with either a `0` or a `1` as the output. The `C#` language is able to support\
    \ the following bitwise operators.\n\nFor this, let’s assume that `I = 0`, `h\
    \ = 1`, `j = 0` and `g = 1`\n\n* `&` this is the operator that is known as the\
    \ Bitwise AND. It is going to assign `1` to the positions where both of the operands\
    \ have `1`. For example `g & h` will give you `1`.\n* `|` this is the bitwise\
    \ OR. It is going to assign `1` to the positions when there is at least one of\
    \ the operands with a `1`. For instance, doing `h | 1` will give you a result\
    \ of `1`.\n* `^` this is the exclusive OR that will work well for binary data.\
    \ Just like working with the logical values, this kind of operator is only going\
    \ to give you `1` in the areas that the operand has a `1`. For example, if you\
    \ do `g^j` you will get a result of `1`.\n\nThese operands may seem a little tricky\
    \ to deal with in the beginning, but they are going to make it so much easier\
    \ to do some of the different operations that you need when working in `C#`. They\
    \ are simple to use and after a little bit of practice, you will find that they\
    \ are easier than ever to use and not quite so complicated. Perhaps consider opening\
    \ up your text reader and seeing how well these work for you, experimenting a\
    \ bit to get the results!\n\n# Conditional Statements Used\nConditional statements\
    \ are another part of the `C#` language that can help you and other programmers\
    \ to create flexible and powerful applications. In fact, this kind of testing\
    \ has been considered a very important part of writing any kind of computer program\
    \ so that you can get the code right for others, as well as yourself, to use correctly.\
    \ If you want to be really effective and good at using `C#` language, you need\
    \ to have some mastery with conditional statements.\n\n## If\nThe first conditional\
    \ statement that you can use is the `if` statement. This is one of the most basic\
    \ conditional statements that you can use in `C#` and it is going to allow the\
    \ computer to behave according to certain inputs that you place in. the syntax\
    \ of using the `if` statement includes:\n\n```\nIf (The Boolean expression)\n\
    {\n    The statement/s you want to run\n}\n```\n\nAs you can see, this is one\
    \ of the simpler formulas that you can use and it will be changed based on the\
    \ length of the statement that you are trying to run as well as the other conditions\
    \ that you want to have in this expression. Some of the main parts of the `if`\
    \ statement includes:\n\n* The `if` keyword—this is the part that will tell your\
    \ language compiler that you are putting together an `if` statement.\n* The Boolean\
    \ expression—this is the part of the syntax that will determine if the program\
    \ will run the body or not. You are not able to use the `char` and `int` values\
    \ for this kind of expression when using `C#`.\n* The statement you want to run—this\
    \ is the body of the syntax and you are allowed to have one or more statements\
    \ put inside. The program will be able to execute these statements if the Boolean\
    \ expression results in a `true`. If the result ends up being `false`, the program\
    \ is going to ignore the statements and will pass this control over to the other\
    \ statements that you have written out.\n\nDon’t let this seem too confusing for\
    \ you. Here is a good example of all of this means means:\n\n```\nIf (x > 0)\n\
    {\n    Console.Write(\"The value is positive.\");\n}\n```\n\nWith this example,\
    \ the program is only going to print “The value is positive” only if your value\
    \ is higher than zero. If you find that the expression is false, then the program\
    \ will ignore the `Console.Write` part of the statement and will move on to the\
    \ next part of the program.\n\n## If Else\nBuilding upon this is the `if else`\
    \ clause and can allow you to do a lot of great stuff with this program. A syntax\
    \ that you should remember for the `if else` statement includes:\n\n```\nIf (the\
    \ Boolean expression)\n{\n    The statement/s you want to run if the result is\
    \ true;\n}\nElse\n{\n    The statement/s you want to run if the result is false;\n\
    }\n```\n\nThere are five parts that come with this kind of expression and it can\
    \ really enhance what you are able to do with the program, including the ability\
    \ to have two different classes of statements show up depending on what the answer\
    \ is. Some of the parts include:\n\n* The `if` keyword—with this keyword, you\
    \ are telling the compiler that you are going to make a conditional statement.\n\
    * The Boolean expression—the expression that you are making should result in a\
    \ Boolean value. If the expression ends up being true, the program is going to\
    \ run the first statement that you listed.\n* The first body—this is the statement\
    \ that you want to have run if the Boolean expression ends up being true. You\
    \ can add in a few statements here, just make sure they all fit within the same\
    \ bracket.\n* The `else` keyword—this is the keyword that will tell the compiler\
    \ that there is an `else` clause. This is the statement that is going to run if\
    \ the Boolean expression ends up being false.\n* The second body—this one is pretty\
    \ similar to the first body. But if the Boolean is false, this is the one that\
    \ will run.\n\nAs you can already see, the `if else` statement is going to come\
    \ out more powerful than the if statement. With the if statement, if the answer\
    \ is false, you aren’t going to have anything show up and the next command in\
    \ the language is going to be displayed. But with the `if else` you can pick which\
    \ statement comes up regardless of whether you get a true or false answer, making\
    \ the code much more powerful.\n\nLet’s take a look at how the `if else` statement\
    \ could work in real life.\n\n```\nIf ( x > 0)\n{\n    Console.Write(\"This value\
    \ is positive.\");\n}\nElse\n{\n    Console.Write(\"The value is less than or\
    \ equal to zero.\");\n}\n```\n\nIn this syntax, the `else` clause is going to\
    \ remain hidden unless the Boolean expression ends up being false. It is there\
    \ if the process needs it or the value comes out false, but if the value is true,\
    \ the first statement is going to be used and the second one will be ignored completely.\n\
    \nThe `if else` clause is one that a lot of beginners won’t use. They think that\
    \ it is too complicated and won’t help them to get things done. They want to stick\
    \ with just the `if` clause and assume that it is the best option for getting\
    \ things done. But for those who want to have a lot of options with their statements,\
    \ or who want different options to show up depending on the answers that are given,\
    \ using the `if else` clause is going to be one of the best options that you can\
    \ use.\n\nIt isn’t that hard of one to understand. It just provides you some more\
    \ options than you will find with the other choices. After you get some time to\
    \ experiment with the `if` clauses, make sure that you work on getting used to\
    \ the `if else` clauses so that you can bring your new codes to a whole new level.\n\
    \n## Nested Conditional Statements\n"
