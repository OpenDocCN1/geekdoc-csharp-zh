    {\n    System.Console.WriteLine(\"These numbers are equal.\");\n}\nElse\n{\n \
    \   If (r > s)\n        System.Console.WriteLine(\"The value of the first variable\
    \ is greater than that of the second one.\");\n}\nElse\n{\n    System.Console.WriteLine(\"\
    The value of the second variable is greater than that of the first one.\");\n\
    }\n```\n\n通过这个选项，在使用 `if else` 子句时会产生几种不同的场景。这允许你为命令提供几个不同的选项，以便程序知道应该输出什么。这可以帮助你比以前完成更多工作，但要注意不要让它变得太复杂，否则可能会变得一团糟。\n\
    \n## Switch-Case\n\n这些 switch-case 语句将根据表达式的结果执行代码。大多数使用 `C#` 的程序员在处理此类语句时会使用整数值。要创建其中一个语句，建议使用以下语法：\n\
    \n```csharp\nSwitch (value_selector)\n{\n    Case integer1;\n        The statements\
    \ you want to execute;\n        Break;\n    Case integer2;\n        The statements\
    \ you want to execute;\n        Break;\n    //…\n    Default:\n        The statements\
    \ you want to execute;\n        Break;\n}\n```\n\n为了充分利用这种句法，你需要理解其中的几个部分。这些包括：\n\
    \n- `switch` 关键字——这是通知编译器你想程序执行 switch-case 语句的关键字。\n- `value selector`（值选择器）——这是一个生成值的表达式。在\
    \ `C#` 中，该值应与你的运算符兼容。你的程序将此值与语句内部列出的其他 case 进行比较。\n- `case`（分支）——case 是程序在进行比较时使用的标签。如果\
    \ case 最终与选择器的值匹配，将执行该语句。程序将检查每个 case 直到找到匹配项为止。\n- 可执行语句——这些是你根据合适的 case 想要运行的不同语句。根据你的需求，它可以是一组语句，也可以是单条语句。\n\
    - `Break` 关键字——这是终止 switch 结构体的关键字。你需要在你尝试创建的每个语句之后放置此关键字。\n- `default` 子句——这是你结束语句所需的机制。如果选择器没有匹配到你设置的任何其他标签，它将会运行。这在很大程度上确保了当其他方法都不起作用时过程会显示某些内容。你可以确保无论输入是什么，程序都会给出一个答案。\n\
    \n对于初学者来说，处理条件语句有时是很困难的。你会发现，使用这类语句可以做的事情太多了，以至于对许多人来说可能有些望而生畏。但当你看到一些语法选项并偶尔尝试使用这些选项时，你会发现使用语言编程来实现一些很棒的选择比你想象的要容易得多。\n\
    \n在此过程中，重要的是使用上面列出的不同部分。这将帮助你确保获取了所有正确的部分来处理条件语句。如果没有正确的选项，你会发现当尝试运行程序时，程序会发出错误信号。当你掌握了所有这些新方面后，你就可以编写出出色的条件语句，帮助你的程序运行起来。\n\
    \n# 创建和使用对象\n\n在本章中，我们将关注两个重要的编程概念，主要是类和对象。你还将将学习如何访问 `.NET` 编程框架中存在的所有类，它还包含了一些非常有价值的信息，可以让你比以往任何时候都更容易在没有任何烦恼的情况下成为\
    \ `C#` 大师。\n\n## 类和对象\n\n首先，我们将谈谈这种编程语言中的对象。编程在过去几年里取得了巨大增长，所有这些增长对程序员创建新计算机应用程序产生了巨大影响。面向对象编程（或\
    \ `OOP`）是 IT 领域开发的最新、最大的思想之一，我们将花费一些时间学习 `OOP` 是如何工作的，这样你就可以利用它来用 `C#` 创建一些惊人的程序。\n\
    \n### 面向对象编程\n\n这种编程是一种依赖于对象的风格。`OOP` 将为你提供一个基于现实世界运作方式的模型。当你能够处理对象而不是抽象概念时，更容易理解这种语言并让它为你工作。这种方法将帮助你利用直觉和逻辑来解决编程中出现的问题。\n\
    \n### 对象\n\n程序员将使用数字“对象”来表示物理对象或抽象概念。在使用 `OOP` 时，你应该记住这些对象具有两个特征，包括：\n\n- 状态——这是定义对象的特征。这些可以是通用的，也可以是特定的。\n\
    - 行为——这是声明对象能够执行的所有动作的特征。\n\n让我们通过观察一个实际对象——球来看这两个特征之间的区别。球的状态将是球的大小、颜色和产地。球的行为可能是滚动或弹跃。\n\
    \n通过 `OOP`，你能够将信息和处理信息的技术合为一体。编程对象将与实际对象对应并持有信息和动作。\n\n### 类\n\n在使用 `C#` 时，类将定义你的对象的特征。它们将为你提供一个定义对象本质结构或模型。根据一些编程专家的说法，类基本上是\
    \ `OOP` 的基础，它们与对象紧密相关。此外，你使用的每个对象都代表一个特定的类。\n\n让我们从名为“Toys”（玩具）的类和名为“Ball”（球）的对象开始。在这种情况下，“Ball”只是\
    \ `Toy` 类的一个实例。但 `Toy` 类将定义所有玩具以及球的行为和状态。\n\n类可以为你的计算机编程增加一些简单性。它们所持有的信息对于任何查看程序的人来说都应该是有意义，而不仅仅是专业程序员。例如，“Toys”类不能将\
    \ `HTTP` 作为其特征之一，因为这些无法联系在一起。\n\n## 属性和行为\n\n"
- fmt: "\nYour classes are going to define the behavior of an object, such as the\
    \ actions that the object is able to perform, and the attributes, or the characteristics.\
    \ The attributes are going to appear as different variables in the body of the\
    \ class while the behavior is going to be defined by the different methods inside\
    \ the class.\n\nLet’s apply these to the `Toy` class. When they are applied, you\
    \ will get the color and the size as attributes. For this you are going to use\
    \ the methods `stop()` and `move()`.\n\n## Using Classes in a Program\n\nAt this\
    \ point we have discussed a bit about classes and how they work, but we need to\
    \ get a bit more into how they are going to work within the program and how they\
    \ can make a difference in what you are trying to write out in the code. With\
    \ C#, you should define all of the classes using the keyword `class` to keep things\
    \ simple.\n\nAfter you type in `class`. You will need to indicate the particular\
    \ identifier that you would like to use along with the variables and the methods\
    \ that you would like to place inside this new class. To keep things simple, the\
    \ different parts that you can add into the class in C# language include:\n\n\
    *   Fields—these are any of the variables that will belong to a particular data\
    \ type.\n*   Methods—you can use these methods in order to manipulate the data.\n\
    *   Properties—in this language, the properties are going to enhance how well\
    \ the fields work. The property will provide some extra management abilities for\
    \ the information and give it to the fields.\n\nBelow is an example of the different\
    \ parts that we just discussed so that you can get a good idea of how this would\
    \ work in a programming language. We are going to use `book` in the name of this\
    \ class and give it two properties: size and type.\n\n```cs\nPublic class Book\n\
    {\n    Private string bookType:\n    Private string size;\n\n    Public string\
    \ BookType\n    {\n        Get\n        {\n            Return this. bookType;\n\
    \        }\n        Set\n        {\n            This.bookType = value;\n     \
    \   }\n    }\n\n    Public string Size\n    {\n        Get\n        {\n      \
    \      Return this. size;\n        }\n        Set\n        {\n            this.size\
    \ = value;\n        }\n    }\n\n    public Book()\n    {\n        this.bookType\
    \ = “Dictionary”;\n        this.size = “large”;\n    }\n\n    public book(string\
    \ bookType, string size)\n    {\n        this.bookType = bookType;\n        this.size\
    \ = size;\n    }\n\n    public void Sample()\n    {\n        Console.WriteLine(“\
    \ Is this a {0}, bookType)\n    }\n}\n```\n\nWith this example, the `Book` class\
    \ is able to define two different properties, the book type and the size. These\
    \ properties are able to hide the values inside the fields of the same names and\
    \ the code snippet is going to declare two constructors for generating on the\
    \ `Book` class. This code also created a method called `Sample()`.\n\nYou will\
    \ be able to use this for a number of different things, adding in more characteristics\
    \ if you would like, and it doesn’t have to be limited to books, toys, vehicles,\
    \ or anything else. You can mess around with your text editor a bit to try out\
    \ this formula and change it around with some other classes to make it easier\
    \ to get the program to work for you.\n\n## System Classes\n\nThe C# language\
    \ already has a library that is built into the system. These are going to include\
    \ some default classes like `Console`, `Math`, and `String`. As you use this language,\
    \ you must keep in mind that this library is going to be compatible with any of\
    \ the `.NET` applications that you use.\n\nThe `.NET` framework is nice because\
    \ it already has this preinstalled library that will include various classes inside.\
    \ The classes can be helpful for those who are trying to do some basics in programming\
    \ tasks, like text procession, execution, and networking. They can be helpful\
    \ for the beginner who is just getting started or even someone who has been working\
    \ in the programming language for some time because they are simple and already\
    \ written out.\n\nKeep in mind that these classes are going to hide the logical\
    \ implementation inside. You should focus more on what the classes are able to\
    \ do, not exactly on how they are able to do it. For this reason, the built-in\
    \ classes with C# won’t be viewable to the programmer. Since you should worry\
    \ more about the principle of working on your code rather than all the abstract\
    \ parts, it is important to just use these codes for their general purposes rather\
    \ than worrying about how they work.\n\n## Creating and Using Objects\n\nWe have\
    \ spent some time looking at classes so now it is time to work on creating and\
    \ then using objects in the language. Here are some of the basics that can help\
    \ you to get started:\n\n### Creating an object\n\nTo get started with creating\
    \ an object inside an existing class, you will need to create a `new` keyword.\
    \ Usually, the programmer will assign the new object a variable that will be of\
    \ the same data type as the class of the object. Keep in mind that doing this\
    \ won’t copy the object to the variable, but it will just give the variable a\
    \ reference to the object that got assigned to it. Use the following code to view\
    \ how this would all work:\n\n```cs\nBook someBook = new Book();\n```\n\nThis\
    \ example is going to assign the instance of a `Book` class to the variable called\
    \ `someBook`. This will get the object to go to the right class that is needed.\n\
    \n### Setting the parameters for your new object\n\nC# will allow you to assign\
    \ some parameters for your newly created objects. Let’s take the syntax that you\
    \ did above and make the adjustments for this:\n\n```cs\nBook someBook = new Book(“Biography”,\
    \ “large”);\n```\n\nThis code is going to be good for creating a new object named\
    \ `someBook` and will assign the two different parameters to it as well. With\
    \ this adjustment, the object’s type is not Biography while the size is now large.\n\
    \nWhenever you are using the `new` keyword, the framework of `.NET` is going to\
    \ complete two things:\n\n*   It will reserve some of the memory for this new\
    \ object\n*   It will initialize the object’s data members\n\nThis process is\
    \ going to occur thanks to a method called `constructor`. For the code above,\
    \ the initial parameters are the parameters of the class constructor. This will\
    \ help the object to stay in the right place and give it the characteristics that\
    \ it needs.\n\n### Releasing the object\n\nWhile some of the other programming\
    \ languages that you use will require you to manually destroy objects, this is\
    \ not a requirement with C#. This means that you will be able to release any of\
    \ the memory that is consumed by your objects without having to do manual deletions.\
    \ The `CLR` system that comes with your `.NET` framework will make all this possible.\n\
    \nWith the `CLR` system, the computer will automatically detect and then release\
    \ any objects that don’t have a reference. The memory that was assigned to these\
    \ objects is not available and you can use it for other objects. Overall, this\
    \ makes the system easier to use and can prevent issues and bugs. If you would\
    \ like to release an object, you should take the time to destroy the corresponding\
    \ reference. A good example of this is:\n\n```cs\nsomeBook = null;\n```\n\nThis\
    \ process won’t delete the object, it is just going to remove the reference from\
    \ the object so that the `CLR` can then perform an automated deletion.\n\n###\
    \ Accessing the object’s field\n\nWhen you want to access the field of an object\
    \ with C#, you will need to use the dot operator or `.`. You will simply need\
    \ to indicate the name of the object, place the dot, and then enter the field\
    \ you are looking to access. However, you won’t even need to add in the dot if\
    \ the object you want to work with is just in one class. You have to get into\
    \ the object’s field if you want to assign a new value or extract the value.\n\
    \nFor those who are working with a property, you will need to use the keywords\
    \ `get` and `set`. The `set` keyword is going to allow you to assign the value\
    \ of an object while the `get` keyword is going to help you to extract the value\
    \ out of the object.\n\nHere is an example of a code that uses this information\
    \ to get an object’s property. We are going to create an object called `myBook`\
    \ and then assign the `bookType` as “bible” to make it easier.\n"
