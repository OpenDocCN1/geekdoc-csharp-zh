    # 介绍


    感谢购买《C#：零基础学者编程入门》，并感谢你的支持。


    接下来的章节将讨论如何开始学习 `C#` 语言，以及你将如何利用它来满足你个人的编程需求。很多人担心自己无法在生活中使用编程语言。它看起来可能很复杂，或者他们觉得所有的规则和各种组件的移动会让它变得太难以处理。但
    `C#` 是一个非常好的选择，因为它简单易，可以在 Windows 设备以及其他几种设备上运行，你从一开始就不会因为这些规则而感到困惑。


    本指南将花时间研究 `C#` 编程的各个方面，甚至会编写一些不同的代码以便你进行练习。有时，在学习过程中进入编码流程并尝试一下，会让事情变得更容易理解，并避免整个过程中的所有困惑和担忧。`C#`
    是一个非常易用的程序，你将会爱上它上手的简单。


    除了学习这些代码是如何运行的，你还将学习使用 `C#` 编程语言涉及的所有其他基础知识。我们将讨论变量、常量、注释等更多内容。无论你只是想在编程世界获得一点经验，还是准备好增加你的计算机编程知识并学习新东西，`C#`
    都是一个极好的入门选择，你将爱上它的易用性。本指南将为你提供理解这种语言并立即上手的所有技巧。


    市场上有许多关于这个主题的书，再次感谢你选择这一本！我们已尽一切努力确保它包含尽可能有用的信息，请尽情享受！


    # C# 基础


    在涉及到学习编程语言时，许多人因为恐惧而逃避。编程对某些人来说是困难且难以理解的，除非你有一些经验或以前接触过计算机，否则很难始终理解指令中发生了什么。本章将从你需要掌握基础知识开始，以便真正学习
    `C#` 以及如何使用这门出色的编程语言。


    ## 为什么要使用 C# 语言？


    你有许多编程语言可以用来在家里编写自己的代码。它们都有自己的优缺点，这些因素决定了你是否想要使用它们。有时这取决于代码看起来有多整洁，而有时则可能基于你正在使用的计算机类型或你想要设计的程序。


    在本指南中，我们将花费一些时间研究 `C#`，并展示你用这门编程语言可以做的所有棒的事情。即使是初学者，你也可以通过这个程序学习到一些东西，让过程变得简单，同时又能提供一些华丽的功能。


    那么，为什么选择 `C#` 程序而不是选择 `Java`、`C++` 和 `Python` 等其他选择呢？以下是一些你应该考虑的优点：


    字体 库中有许多函数可用——如果你只是刚开始并想学习如何编写函数，`C#` 库中有大量的函数，因此你需要在帮助时可以使用它们。你可以根据需要将它们放入代码中，甚至对其进行修改以适应你的特定代码。

    - 函数的自动释放——大多数编程语言要求你手动删除任何不需要的项。这可能花费大量时间，如果你处理不当，还会浪费内存空间。但使用 `C#`，你会发现程序会自动删除那些没有关联值的函数和对象。这将帮助你清理计算机内存并节省大量空间。

    - 易于操作——`C#` 是最易用的程序之一。虽然它可能没有 `Python` 那么简单，但它属于容易的一，你会发现代码并不笨拙，一旦代码完成后，你可以轻松地阅读。还有编写注释的选项，如果以后其他人需要使用，可以在代码中留下一些说明。

    - 适用于 Windows 及其他系统——这门编程语言最初是为了配合 Windows 计算机工作并帮助你为它们设计程序。但它也适用于其他系统，如 `Mac`、`Linux`
    等，只要在上面下载了 `.NET`。Windows 有许多易于使用的产品，特别是对于初学者，所以当你开始时一定会会获得良好的结果。

    - 通过 `.NET` 使其变得简单——这是一个 Windows 计算机自带的程序，但你也可以将其添加到其他一些系统中，以便 `C#` 也能在这些计算机上运行。


