    \n现在你可以在命令行提示符中输入 `FirstProgram.exe` 来运行此应用程序。如果一切操作得正确，你应该看到命令行提示符显示消息：“Using\
    \ C# is fun.” \n\n## 分析此程序\n\n如你所见，用这种语言创建程序并不复杂。你需要经过几个步骤，但你可以根据需要让消息和结果变得简单或复杂。现在你已经有了机会创建你的\
