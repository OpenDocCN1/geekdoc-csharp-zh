    \ operand.\n- `*=` this operator will multiply the values of each operand and\
    \ then will assign the product to the left-hand operand.\n- `/=` this is when\
    \ you will divide up the two variables and then take the result and assign it\
    \ to the variable on the left.\n\nOne thing to note is that when you use an assignment\
    \ operator, you will need to make sure that both operands do belong to the same\
    \ type of data. If you find that the operands are incompatible, the program may\
