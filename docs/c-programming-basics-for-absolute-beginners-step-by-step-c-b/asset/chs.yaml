- "# C#：零基础初学者的编程基础（逐步渐进 C# 书籍 1）\n\n\n\n\n\n\n\n\n\n\n\n\n\n# 介绍\n\n感谢购买《C#：零基础学者编程入门》，并感谢你的支持。\n\
  \n接下来的章节将讨论如何开始学习 `C#` 语言，以及你将如何利用它来满足你个人的编程需求。很多人担心自己无法在生活中使用编程语言。它看起来可能很复杂，或者他们觉得所有的规则和各种组件的移动会让它变得太难以处理。但\
  \ `C#` 是一个非常好的选择，因为它简单易，可以在 Windows 设备以及其他几种设备上运行，你从一开始就不会因为这些规则而感到困惑。\n\n本指南将花时间研究\
  \ `C#` 编程的各个方面，甚至会编写一些不同的代码以便你进行练习。有时，在学习过程中进入编码流程并尝试一下，会让事情变得更容易理解，并避免整个过程中的所有困惑和担忧。`C#`\
  \ 是一个非常易用的程序，你将会爱上它上手的简单。\n\n除了学习这些代码是如何运行的，你还将学习使用 `C#` 编程语言涉及的所有其他基础知识。我们将讨论变量、常量、注释等更多内容。无论你只是想在编程世界获得一点经验，还是准备好增加你的计算机编程知识并学习新东西，`C#`\
  \ 都是一个极好的入门选择，你将爱上它的易用性。本指南将为你提供理解这种语言并立即上手的所有技巧。\n\n市场上有许多关于这个主题的书，再次感谢你选择这一本！我们已尽一切努力确保它包含尽可能有用的信息，请尽情享受！\n\
  \n# C# 基础\n\n在涉及到学习编程语言时，许多人因为恐惧而逃避。编程对某些人来说是困难且难以理解的，除非你有一些经验或以前接触过计算机，否则很难始终理解指令中发生了什么。本章将从你需要掌握基础知识开始，以便真正学习\
  \ `C#` 以及如何使用这门出色的编程语言。\n\n## 为什么要使用 C# 语言？\n\n你有许多编程语言可以用来在家里编写自己的代码。它们都有自己的优缺点，这些因素决定了你是否想要使用它们。有时这取决于代码看起来有多整洁，而有时则可能基于你正在使用的计算机类型或你想要设计的程序。\n\
  \n在本指南中，我们将花费一些时间研究 `C#`，并展示你用这门编程语言可以做的所有棒的事情。即使是初学者，你也可以通过这个程序学习到一些东西，让过程变得简单，同时又能提供一些华丽的功能。\n\
  \n那么，为什么选择 `C#` 程序而不是选择 `Java`、`C++` 和 `Python` 等其他选择呢？以下是一些你应该考虑的优点：\n\n字体 库中有许多函数可用——如果你只是刚开始并想学习如何编写函数，`C#`\
  \ 库中有大量的函数，因此你需要在帮助时可以使用它们。你可以根据需要将它们放入代码中，甚至对其进行修改以适应你的特定代码。\n- 函数的自动释放——大多数编程语言要求你手动删除任何不需要的项。这可能花费大量时间，如果你处理不当，还会浪费内存空间。但使用\
  \ `C#`，你会发现程序会自动删除那些没有关联值的函数和对象。这将帮助你清理计算机内存并节省大量空间。\n- 易于操作——`C#` 是最易用的程序之一。虽然它可能没有\
  \ `Python` 那么简单，但它属于容易的一，你会发现代码并不笨拙，一旦代码完成后，你可以轻松地阅读。还有编写注释的选项，如果以后其他人需要使用，可以在代码中留下一些说明。\n\
  - 适用于 Windows 及其他系统——这门编程语言最初是为了配合 Windows 计算机工作并帮助你为它们设计程序。但它也适用于其他系统，如 `Mac`、`Linux`\
  \ 等，只要在上面下载了 `.NET`。Windows 有许多易于使用的产品，特别是对于初学者，所以当你开始时一定会会获得良好的结果。\n- 通过 `.NET`\
  \ 使其变得简单——这是一个 Windows 计算机自带的程序，但你也可以将其添加到其他一些系统中，以便 `C#` 也能在这些计算机上运行。\n\n\n\n\n\
  \n* 类似于 C 和 C++。这使得操作该程序变得非常容易，并且可以在学习其他程序之前先掌握基础知识。即使你决定坚持使用这种编程语言，你会发现它足够强大，可以完成你的大部分编码，而无需像某些其他程序那样繁琐。\n\
  \n在选择一种编程语言时，你有很多选择，既要能帮助你编写出色的程序，又要对初学者来说易于学习。而 `C#` 凭借其提供的巨大优势和可以用它实现的功能，是你可以选择的最佳语言之一。\n\
  \n## 你需要什么\n\n让我们从使用这种编程语言所需的一些内容开始吧。首先，你使用的电脑应该拥有 `.NET` 框架以及用于 Windows 电脑的开发工具包。大多数现代\
  \ Windows 系统（从 Windows Vista 及以上版本）已经预装了该框架，因此你不需要在电脑上安装任何新内容。\n\n如果你在没有 `.NET`\
  \ 框架的电脑上工作，可以免费下载。你只需要访问 [www.microsoft.com](http://www.microsoft.com) 并搜索框架即可开始。\n\
  \n需要注意的一点是，如果你计划使用 Linux、UNIX 或 Mac 电脑，你需要选择 `Mono Project` 而不是 `.NET` 框架。该工具包将帮助你在这些电脑上使用\
  \ `C#` 创建程序。你可以访问 [www.monoproject.com](http://www.monoproject.com) 获取正确的框架。\n\n\
  ## 学习 C# 语言\n\n在使用 Windows 电脑时，`C#` 是你能找到的最佳编程语言之一。它与大多数现代 Windows 电脑上的 `.NET` 框架兼容，而且这种语言简单、灵活且依然强大。如果你是编程新手，并且喜欢\
  \ Windows 产品的简单性，那么 `C#` 语言就是适合你的选择。\n\n就像使用 `Java` 语言一样，`C#` 不支持任何代码指针甚至多重继承。相反，它将提供类型检查和内存收集。它还包含了一些程序员从\
  \ `C++` 中喜欢的强大功能，如重载、枚举和预处理器指令，因此你可以从这个程序中获得你所追求的简单与强大。\n\n## 用 C# 尝试你的第一个程序\n\n\
  学习 `C#` 编程最好的方法是尝试编写一些程序。所以，让我们深入吧，用这种语言编写一个简单的程序，帮助你入门并了解更多关于这个选项的信息：\n\n* 启动你选择的文本编辑器。如果你使用的是\
  \ Windows 电脑，`Notepad` 是一个很好的选择。如果你在 Linux 上，`vim` 或 `vi` 是可以尝试的好选择。\n\n* 输入以下代码：\n\
  \n```csharp\nclass FirstProgram\n{\n    static void Main()\n    {\n        Console.WriteLine(\"\
  Using C# is fun.\");\n    }\n}\n```\n\n* 现在你可以访问命令行提示符并输入：\n\n`csc FirstProgram.cs`\n\
  \n执行此命令后，`C#` 编译器将处理该文件，并在代码相同的位置创建一个 `.exe` 文件。例如，如果你将原始文件保存在桌面上，你应该在同一个地方看到一个名为\
  \ `FirstProgram.exe` 的新程序。如果你编写的代码有错误，你将看到错误信息。\n\n现在你可以在命令行提示符中输入 `FirstProgram.exe`\
  \ 来运行此应用程序。如果一切操作得正确，你应该看到命令行提示符显示消息：“Using C# is fun.” \n\n## 分析此程序\n\n如你所见，用这种语言创建程序并不复杂。你需要经过几个步骤，但你可以根据需要让消息和结果变得简单或复杂。现在你已经有了机会创建你的\
  \ `C#` 程序，是时候回顾一下你刚刚做了什么（如果你注意到仅仅写这句简单的语句就有好几行），这样你以后就能理解这个程序。\n\n* 第一行——这一行由关键字和标识符组成。关键字是一个在语言内部具有特殊功能的单词。通过上面的关键字，你正在为程序创建一个\
  \ `class`（类）。标识符将帮助你识别程序中需要的方法、变量和类。`FirstProgram` 是你在这种情况下创建的类名。\n\n* 在第三行，你正在定义方法。`Main()`\
  \ 将作为计算机上任何应用程序的起点。无论程序被放置在代码的哪个位置，都会从 `Main()` 方法开始执行。通常在方法之前有两个单词，主要是 `void` 和\
  \ `static`。在这种情况下，`static` 告诉编译器该方法不会在类中创建对象。使用 `void` 时，你是在告诉编译器 `Main()` 不返回值。\n\
  \n* 在第五行，你将看到代码的最后部分。这是你编写消息的行。名为 `WriteLine()` 方法捕获字符组合（或句子），并在你请求时将其打印到屏幕上。\n\n\
  此外，你可能还注意到那里有大括号，用于告诉计算机代码中存在代码块以帮助区分内容。记住，`C#` 像 `Java` 和 `C` 一样使用分号（`;`）（如上面的代码所示）。\n\
  \n## C# 注释\n\n这种编程语言允许你在代码中留下注释。这将提供关于你添加的代码的更多信息。编译器将忽略这些行，因此你的注释对计算机的输出没有影响。但这可以成为记住你在代码中尝试做什么，或向其他程序员展示你正在工作内容的好方法。\n\
  \n`C#` 允许两种类型的注释。第一种是单行注释。这种注释以两个斜杠开头。你说的话应该尽量少一些，以便将它们保持在一行。如果你超过了一行，你会发现程序会向你发送错误信息。编写这种注释的方法是：\n\
  \n```csharp\nstatic void Main()\n{\n    //I have a pet.\n}\n```\n\n你也可以使用多行注释。有时你无法将注释保持在一行，需要添加不同的内容允许代码跨越两行或更多。幸运的是，`C#`\
  \ 允许你编写这类注释，只要以 `/*` 开始并以 `*/` 结束即可。这是一个示例：\n\n```csharp\nstatic void Main()\n{\n\
  \    /*The C# compiler should ignore this line.*/\n}\n```\n\n这使得编写较长的注释变得更容易，以便更详细地解释事情，而不会其出现在你的代码屏幕上。在处理代码时，注释可以是你最好的朋友。它将帮助他人知道应该对代码做什么，例如让他们知道在特定部分的括号内应该放什么，解释你正在用该代码做什么，等等。你应该仔细对待注释，不一定非要在每行代码后都放置注释，但在需要时使用它们可以让事情变得简单。\n\
  \n## C# 需要记住的事项\n\n创建 `C#` 程序时你需要记住的一些事项包括：\n\n* 所有的 `C#` 程序都存在于 `class`（类）内部。\n\
  \n* 你应该使用 `Main()` 开始程序内所有想要执行的操作。\n\n\n\n\n\n# 简介\n\n- 这种编程语言是区分大小写的。这意味着 `class`\
  \ 和 `CLASS` 对程序来说具有不同的含义。\n- 编译器将忽略你创建的空白。这包括空格、制表符和换行符。你可以随心所欲地使用这些空白来帮助程序看起来更易读。\n\
  - `C#` 允许你为程序选择任何你喜欢的名称。你不需要程序的名称和类标识符保持一致。\n- 你可以在程序中多次使用 `Main()`。\n- 在定义方法或类的边界时，请务必使用大括号。\n\
  - 你可以在 `C#` 中使用两种类型的注释来帮助更好地解释内容。多行注释和单行注释都可以的，只要你使用了每种注释正确的功能。\n- 你可以随时向你的 `Main()`\
  \ 方法中添加参数或字符串。\n\n使用 `C#` 是你可以选择的最优秀的编程语言之一。它在大多数 Windows 电脑上非常好用，在其他电脑上运行得也很好。它拥有你在\
  \ `Java` 和 `C++` 中熟悉并喜爱的所有优秀特性，但它要用得多，而且即使没有经验的初学者也能胜任！\n\n# 变量与数据类型\n\n初看 `C#`，你会发现这种语言并没有那么可怕。虽然其他一些选项是为更高级的用户设计的，可能有点复杂，但你会发现在使用\
  \ `C#` 时情况并不总是如此。现在既然你已经初步接触了 `C#`，是时候深入钻究并学习更多东西来，让它变得更有趣了。\n\n## 数据类型\n\n经常使用\
  \ `C#` 的人通常会选择将这种编程语言分为两个部分：引用类型和值类型。当你处理值类型时，你会将数据传递到你正在使用的任何方法。另一方面，当处理引用类型时，你只需要将引用传递给方法，因为值将被放置在其他地方。在使用\
  \ `C#` 程序时你会发现的一些数据类型包括：\n\n- `Ulong`\n- `Double`\n- `Long`\n- `Float`\n- `Uint`\n\
  - `Int`\n- `Ushort`\n- `Sbyte`\n- `Short`\n- `Byte`\n- `Bool`——当你使用这种类型时，允许存储的值只有两个。这两个值是\
  \ `false` 和 `true`，因此非常适合条件语句和逻辑表达式。\n- `Decimal`\n- `Char`——这是一种允许只有一个单个字符的数据类型。当你编写\
  \ `char` 值时，必须用单引号将其包含起来，例如写出 ‘t’、‘b’ 等。\n\n## 变量\n\n当你执行操作时，计算机程序会在短时间内存储所有数据。程序员经常使用“变量”一词来指代存储这些存储数据的内存位置。因此，变量将具有一个数据类型和对应的值。在\
  \ `C#` 语言中工作时，你可以使用以下语法创建变量：\n\n```\n<data_type> <name_of_variable>\n```\n\n上述行将保存你计算机的一部分内存以保留\
  \ `char` 值。然后，程序员可以使用它被赋予的标识符来访问该变量。例如，如果你将上述公式列为 `char x`，你就可以通过 `x` 找到该变量。\n\n\
  `C#` 还允许你在声明期间初始化变量。这个术语是指在创建变量时给你的变量赋值的过程。你只需要使用你的赋值运算符，即 `=`，然后指示你尝试在这里赋值的值。这里是一些可能的例子：\n\
  \n```\nint year=2015\nbool isItDelicious = false\nchar sample = ‘4’\n```\n\n你也可以为一个语句声明几个变量，只要它们具有相同的数据类型，你只需要用逗号分隔每个条目即可。这样的例子是：\n\
  \n```\nchar ant = ‘a’, bull=’b’, cat=’c’\n```\n\n就像与其他编程语言一样，`C#` 要求你在再次评估变量之前先声明它们。`C#`\
  \ 还会实施一种称为“确定性赋值”（definite assignment）的新规则。这意味着你在使用局部变量之前需要初始化它。你基本上需要在声明过程中为局部变量分配初始值。\n\
  \n需要记住的一点：变量之所以这样命名，是因为它们将存储的值在每次程序运行时都会改变。值将根据你放入的内容而改变。\n\n## 常量\n\n接下来要理解的是常量。这些是防止程序更改初始值的变量类型。这意味着无论用户在过程中输入什么，值都将保持不变。当你想要声明此常量时，需要使用\
  \ `const`。这里的例子是：\n\n```\nconst char LETTER=x;\n```\n\n在声明这些常量之一之前，你需要确保你确实希望它是那样的。如果你已经设定了它，程序将无法更改常量的值。这意味着你必须在变量声明时立即为其分配初始值。例如，如果你输入以下命令，将得到错误消息：\n\
  \n```\nconst bool ANSWER;\n```\n\n关于常量需要记住的一点是，当你声明它们时，大多数使用大写字母。了解这些信息可以帮助你更轻松地阅读\
  \ `C#` 代码，并让你更容易以他人能够阅读和理解的方式创建你自己的代码。\n\n## 创建你的标识符\n\n如果你查看微软的建议，你会发现他们建议在处理变量时使用驼峰命名法（Camel\
  \ notation），在处理方法时使用帕斯卡命名法（Pascal notation）。当你使用驼峰命名法时，你会发现单词的首字母是小写的。如果你处理的是复合词，第二个单词的第一个字母将以大写字母开头。这里是一些相关的例子：\n\
  \n```\npayment         completePayment\nmathematics      firstClass\n```\n\n帕斯卡命名法的方式略有不同。这种命名风格要求你使用大写字母开始第一个单词。序列中所有其他单词的首字母也应该大大写。使用帕斯卡命名法的例子包括：\n\
  \n```\nWriteLine()      ReadLine()\nStart()          Main()\n```\n\n在创建标识符时，也可以使用下划线字符和数字。但是，你不允许使用数字开头标识符。你可以将\
  \ `fiveBooks` 作为标识符，但你不能写 `5Books`。\n\n\n\n\n正如你可能接触过的其他编程语言一样，C# 也拥有属于不同类别的运算符。让我们来看看每个类别，以及你将如何处理每个类别中的运算符。\n\
  \n## 算术运算符\n\n这些是告诉你的计算机程序执行算术过程的运算符。这可以帮助计算机了解你何时需要将内容相加、减去它们等等。计算机可以为你完成一些基础工作，同时通过正确的符号告诉程序你想让它执行的操作。你可以在\
  \ C# 中使用的一些算术运算符包括：\n\n对于这些示例，让我们假设 `x=15` 且 `y=10`\n\n- `+` 这是加法运算符。它将把两个操作数相加。所以你会得到\
  \ `x+y=25`。\n- `-` 这是减法运算符。它允许你从左侧操作数的值中减去右侧操作数的值。所以你会得到 `y-x=-5`。\n- `*` 这个运算符将告诉计算机相乘两个操作数。所以你可以执行\
  \ `x*y=150`。\n- `/` 这个运算符将告诉计算机用左侧操作数除以右侧操作数。例如 `y/x`。- `%` 这通常被称为取余运算符或模运算符。它将左侧操作数除以右侧操作数，然后返回余数。\n\
  - `++` 这是递增运算符。它将操作数的值加一。所以你会得到 `++x=16`。\n- `--` 程序员通常称之为递减运算符。它将操作数的值减一。这意味着你将会得到\
  \ `--x=14`。\n\n需要注意的是，递减和递增运算符被视为一元运算符的，这意味着它们只能用于一个操作数。此外，你也可以在使用递增和递减值之前或之后将运算符相加。\n\
  \n这里是一个包含算术运算符的代码示例：\n\n```c\nclass Example\n{\n    // 这个基础程序将向你展示算术运算符是如何工作的\n\
  \    static void Main()\n    {\n        Int f =3, g = 4;         // 这一行声明了两个变量，f\
  \ 和 g。\n        sampleSum = f+g;        // 这将给你 7。\n        sampleDifference = g-f\
  \  // 这将给你 1。\n        sampleProduct = f*g;    // 这将给你 1.3\n        sampleModulo\
  \ = g%f;     // 这将给你 1\n        f++                     //这将给你 3。\n    }\n}\n```\n\
  \n使用算术运算符非常简单，因为它只是告诉计算机将两个数字放在一起。你只需要设置所有数字将等于什么的参数，计算机就可以完成其余的工作。\n\n列表中的下一个是赋值运算符。这种运算符允许你为变量赋值一个值。在使用\
  \ C# 时你可以选择的一些赋值运算符包括：\n\n- `=` 此运算符允许你执行简单的赋值操作。它将一个值赋值给你当前正在操作的变量。例如，编写 `int sample\
  \ = 100` 将告诉程序你想将 100 赋值给名为 `sample` 的变量。它不会对该变量或涉及的值执行任何额外的处理。\n- `+=` 这是加法赋值运算符。它将你的两个操作数的值相加，然后将和赋值给你的左侧操作数。\n\
  - `-=` 程序员通常称之为减法赋值运算符。它将左侧操作数的值减去右侧操作数的值，然后将差赋值给左侧操作数。\n- `*=` 此运算符将每个操作数的值相乘，然后将乘积赋值给左侧操作数。\n\
  - `/=` 当你除法这两个变量，然后将结果赋值给左侧的变量。\n\n需要注意的是，当你使用赋值运算符时，你需要确保两个操作数都属于相同的数据类型。如果你发现操作数不兼容，程序在运行时可能无法正常工作，你将不得不回头进行更改。\n\
  \n## 关系运算符\n\n这些是允许你比较两个操作数值的运算符。因为如此，它们非常适合条件语句。这些在使用 C# 时可能会遇到的一些关系运算符。对于这些，让我们假设\
  \ `d=100` 且 `e=150`\n\n- `==` 这是你可以用来检查两个值是否相等的运算符。如果两个值最终相等，运算符将告诉你 true。否则，它将告诉你\
  \ false。例如，`d == e` 将显示为 false。\n- `!=` 此运算符允许你测试两个值是否不等。如果两个值最终不相等，结果将为 true。 \n\
  - `>` 此运算符用于检查左侧操作数是否大于右侧操作数。如果是，则运算符将告诉你 true。例如，`e > d` 为 true。\n- `<` 这是小于运算符，它允许你检查左侧操作数是否小于右侧操作数。如果是，你将得到\
  \ true 显示，例如公式 `d < e`。\n- `>=` 这是运算符，当左侧的值大于或等于右侧的操作数时，它将说是 true。否则，它将说是 false。例如，`e\
  \ >= d` 的求值结果为 true。\n- `<=` 使用此运算符，如果左侧的操作数小于或等于右侧的操作数，你将得到 true。\n\n当你使用关系运算符时，结果是每次都会得到一个布尔值（Boolean\
  \ value）。这意味着你想要得到一个 true 或 false 的答案。在在使用等等运算符时，还应该检查你是否使用了两个等号。如果你将它与赋值运算符混淆，程序中可能会出现错误。\n\
  \n## 逻辑运算符\n\n你能够使用的运算符的另一种选择是逻辑运算符。这有时被称为布尔运算符，因为它将接受两个布尔值以产生一个新的布尔值。请记住，C# 将允许并支持四种类型的逻辑运算符。\n\
  \n在这里我们假设 `c=true`、`d=true` 且 `e=false`\n\n- `&&` 此运算符称为逻辑与。只有当两个操作数都为 true 时，结果才为\
  \ true。例如，`d && c` 的求值结果为 true。\n- `||` 这是逻辑或。只要你的两个操作数中有一个为 true，此运算符就会给你 true。例如，`c\
  \ || e` 结果为 true。\n- `^` 此运算符是逻辑异或，当其中一个操作数为 true 时，结果将为 true。如果两个操作数都为 false 或\
  \ true，运算符将给你 false。\n- `!` 使用此运算符，你将能够反转布尔变量的值。例如，如果你输入 `!d`，你将得到 false。\n\n\n\n\
  \n\n一些程序员会将 `||` 和 `&&` 称为短路运算符。这是因为这些符号能够在不检查整个表达式的情况下给出准确的结果。`&&` 就是其中一个例子，因为它需要两个\
  \ `true`，如果第一个操作数是 `false`，它将导致结果为 `false`，无论其余部分是什么，而且它甚至不会去查看剩余部分。这可以稍微加快程序的运行并完成工作。\n\
  \n## 位运算符\n这种类型的运算符的工作方式与逻辑运算符非常相似。区别在于，位运算符将取二进制值来产生布尔结果。由于这种运算符作用于二进制选项（基本上就是由\
  \ 0 和 1 组成的值），它们显示的结果将以 `0` 或 `1` 作为输出。`C#` 语言支持以下位运算符。\n\n为此此，我们假设 `I = 0`，`h =\
  \ 1`，`j = 0` 且 `g = 1`\n\n* `&` 这是一个被称为位与与的运算符。它会在两个操作数都为 `1` 的位置赋值 `1`。例如 `g &\
  \ h` 将给你结果 `1`。\n* `|` 这是位或运算符。当至少有一个操作数为 `1` 时，它会在该位置赋值 `1`。例如，执行 `h | 1` 将给你结果\
  \ `1`。\n* `^` 这是异或运算符，在二进制数据上运行良好。正如同与处理逻辑值一样，这种运算符只会在操作数为 `1` 的区域给你给出 `1`。例如，如果你执行\
  \ `g^j`，你将得到结果 `1`。\n\n这些操作数在开始处理时可能看起来有点棘手，但它们将让你在 `C#` 中工作时需要的某些不同操作变得简单得多。它们使用简单，经过一些练习，你会发现它们比以往任何时候都更容易使用，而且并没有那么复杂。也许可以打开你的文本编辑器，看看这些运算符对你效果如何，通过实验来获得结果！\n\
  \n# 使用的条件语句\n条件语句是 `C#` 语言的另一部分，可以帮助你和其他程序员创建灵活且强大的应用程序。事实上，这种类型的测试被认为是编写任何类型计算机程序非常重要的一部分，这样你就可以写出他人以及你自己都能正确使用的代码。如果你想真正高效并擅长使用\
  \ `C#` 语言，你需要掌握一些条件语句。\n\n## If\n你可以使用的第一个条件语句是 `if` 语句。这是 `C#` 中可以使用的最基本的条件语句之一，它允许计算机根据你放置的某些输入来运行。使用\
  \ `if` 语句的语法包括：\n\n```\nIf (布尔表达式)\n{\n    你想运行的语句/语句\n}\n```\n\n如你所见，这是你可以使用的较简单公式之一，它将根据你尝试运行的语句的长度以及你想在该表达式中拥有的其他条件而改变。`if`\
  \ 语句的一些主要部分包括：\n\n* `if` 关键字——这部分将告诉你的语言编译器你正在组合一个 `if` 语句。\n* 布尔表达式——这是语法中决定程序是否运行体（body）的部分。在使用\
  \ `C#` 时，你不能对这种表达式使用 `char` 和 `int` 值。\n* 你想运行的语句——这是语法的主体，你被允许在内部放置一个或多个语句。如果布尔表达式的结果为\
  \ `true`，程序将执行这些语句。如果结果最终为 `false`，程序将忽略这些语句，并将控制权交给你写的其他语句。\n\n不要让这看起来对你太困惑。这是一个关于所有这些含义的良好示例：\n\
  \n```\nIf (x > 0)\n{\n    Console.Write(\"The value is positive.\");\n}\n```\n\n\
  通过这个示例，只有当你的值大于零时，程序才会打印“The value is positive.”。如果你发现表达式为 `false`，那么程序将忽略语句中的 `Console.Write`\
  \ 部分，并移动到程序的下一个部分。\n\n## If Else\n在此基础上是 `if else` 子句，它可以允许你在程序中做很多很棒的事情。`if else`\
  \ 语句应该记住的语法包括：\n\n```\nIf (布尔表达式)\n{\n    如果结果为真，你想运行的语句/语句；\n}\nElse\n{\n    如果结果为假，你想运行的语句/语句；\n\
  }\n```\n\n这种表达式包含五个部分，它确实可以增强你在程序中能够执行的操作，包括根据答案显示两种不同类语句的能力。其中一些部分包括：\n\n* `if`\
  \ 关键字——通过这个关键字，你是在告诉编译器你将创建一个条件语句。\n* 布尔表达式——你创建的表达式应该产生一个布尔值。如果表达式最终为真，程序将运行你列出的第一个语句。\n\
  * 第一个体——这是你想在布尔表达式最终为真时运行的语句。你可以在这里添加几条语句，只需确保它们都在同一个括号内即可。\n* `else` 关键字——这是一个告诉编译器存在\
  \ `else` 子句的关键字。这是当布尔表达式最终为假时将运行的语句。\n* 第二个体——这与第一个体非常相似。但如果布尔值为假，将运行这一个。\n\n如你所看到的，`if\
  \ else` 语句将比 `if` 语句更强大。使用 `if` 语句时，如果答案为 `false`，你什么都不会显示，语言中的下一条命令将显示。但通过 `if\
  \ else`，无论你得到真答案还是假答案，你都可以选择显示哪个语句，这使得代码变得强大得多。\n\n让我们看看 `if else` 语句在现实是如何工作的。\n\
  \n```\nIf ( x > 0)\n{\n    Console.Write(\"This value is positive.\");\n}\nElse\n\
  {\n    Console.Write(\"The value is less than or equal to zero.\");\n}\n```\n\n\
  在这种语法中，除非布尔表达式最终为假，否则 `else` 子句将保持隐藏。如果过程需要它或值为假，它就在那里；但如果值为真，则将使用第一个语句，而第二个语句将完全被忽略。\n\
  \n`if else` 子句是很多初学者不会使用的。他们认为它太复杂了，不能帮助他们完成工作。他们想坚持只使用 `if` 子句，并假设这是完成工作的最佳选择。但对于那些希望在他们的语句中有更多选项的人，或者希望根据给出的答案显示不同选项的人来说，使用\
  \ `if else` 子句将是你可以使用的最佳选项之一。\n\n它并不难理解。它只是为你提供了比你在其他选择中找到更多的选项。当你花时间尝试 `if` 子句后，确保你习惯\
  \ `if else` 子句，这样你就可以将你的新代码推向全新的水平。\n\n## 嵌套条件语句\n\n\n\n\n当你使用 `C#` 语言时，可以在必要时另一个\
  \ `if` 语句内部编写一个 `if` 语句。这个过程被称为嵌套，它用于帮助你创建依赖于链式条件的复杂程序。在使用此选项时，你应该记住的一点是，如果你在编写嵌套条件语句时犯了错误，你将会遇到语法错误和编译时错误。\n\
  \n许多 `C#` 专家建议你将嵌套语句限制在三层以内。如果超过了这个数量，你得到的代码可能会是混乱且复杂的，导致他人难以阅读，并在此过程中产生更多错误。\n\n\
  一个允许条件语句嵌套的代码示例如下：\n\n```csharp\nDouble r = 60;\nDouble s = 70;\nIf (r == s)\n{\n\
  \    System.Console.WriteLine(\"These numbers are equal.\");\n}\nElse\n{\n    If\
  \ (r > s)\n        System.Console.WriteLine(\"The value of the first variable is\
  \ greater than that of the second one.\");\n}\nElse\n{\n    System.Console.WriteLine(\"\
  The value of the second variable is greater than that of the first one.\");\n}\n\
  ```\n\n通过这个选项，在使用 `if else` 子句时会产生几种不同的场景。这允许你为命令提供几个不同的选项，以便程序知道应该输出什么。这可以帮助你比以前完成更多工作，但要注意不要让它变得太复杂，否则可能会变得一团糟。\n\
  \n## Switch-Case\n\n这些 switch-case 语句将根据表达式的结果执行代码。大多数使用 `C#` 的程序员在处理此类语句时会使用整数值。要创建其中一个语句，建议使用以下语法：\n\
  \n```csharp\nSwitch (value_selector)\n{\n    Case integer1;\n        The statements\
  \ you want to execute;\n        Break;\n    Case integer2;\n        The statements\
  \ you want to execute;\n        Break;\n    //…\n    Default:\n        The statements\
  \ you want to execute;\n        Break;\n}\n```\n\n为了充分利用这种句法，你需要理解其中的几个部分。这些包括：\n\
  \n- `switch` 关键字——这是通知编译器你想程序执行 switch-case 语句的关键字。\n- `value selector`（值选择器）——这是一个生成值的表达式。在\
  \ `C#` 中，该值应与你的运算符兼容。你的程序将此值与语句内部列出的其他 case 进行比较。\n- `case`（分支）——case 是程序在进行比较时使用的标签。如果\
  \ case 最终与选择器的值匹配，将执行该语句。程序将检查每个 case 直到找到匹配项为止。\n- 可执行语句——这些是你根据合适的 case 想要运行的不同语句。根据你的需求，它可以是一组语句，也可以是单条语句。\n\
  - `Break` 关键字——这是终止 switch 结构体的关键字。你需要在你尝试创建的每个语句之后放置此关键字。\n- `default` 子句——这是你结束语句所需的机制。如果选择器没有匹配到你设置的任何其他标签，它将会运行。这在很大程度上确保了当其他方法都不起作用时过程会显示某些内容。你可以确保无论输入是什么，程序都会给出一个答案。\n\
  \n对于初学者来说，处理条件语句有时是很困难的。你会发现，使用这类语句可以做的事情太多了，以至于对许多人来说可能有些望而生畏。但当你看到一些语法选项并偶尔尝试使用这些选项时，你会发现使用语言编程来实现一些很棒的选择比你想象的要容易得多。\n\
  \n在此过程中，重要的是使用上面列出的不同部分。这将帮助你确保获取了所有正确的部分来处理条件语句。如果没有正确的选项，你会发现当尝试运行程序时，程序会发出错误信号。当你掌握了所有这些新方面后，你就可以编写出出色的条件语句，帮助你的程序运行起来。\n\
  \n## 创建和使用对象\n\n在本章中，我们将关注两个重要的编程概念，主要是类和对象。你还将将学习如何访问 `.NET` 编程框架中存在的所有类，它还包含了一些非常有价值的信息，可以让你比以往任何时候都更容易在没有任何烦恼的情况下成为\
  \ `C#` 大师。\n\n## 类和对象\n\n首先，我们将谈谈这种编程语言中的对象。编程在过去几年里取得了巨大增长，所有这些增长对程序员创建新计算机应用程序产生了巨大影响。面向对象编程（或\
  \ `OOP`）是 IT 领域开发的最新、最大的思想之一，我们将花费一些时间学习 `OOP` 是如何工作的，这样你就可以利用它来用 `C#` 创建一些惊人的程序。\n\
  \n### 面向对象编程\n\n这种编程是一种依赖于对象的风格。`OOP` 将为你提供一个基于现实世界运作方式的模型。当你能够处理对象而不是抽象概念时，更容易理解这种语言并让它为你工作。这种方法将帮助你利用直觉和逻辑来解决编程中出现的问题。\n\
  \n### 对象\n\n程序员将使用数字“对象”来表示物理对象或抽象概念。在使用 `OOP` 时，你应该记住这些对象具有两个特征，包括：\n\n- 状态——这是定义对象的特征。这些可以是通用的，也可以是特定的。\n\
  - 行为——这是声明对象能够执行的所有动作的特征。\n\n让我们通过观察一个实际对象——球来看这两个特征之间的区别。球的状态将是球的大小、颜色和产地。球的行为可能是滚动或弹跃。\n\
  \n通过 `OOP`，你能够将信息和处理信息的技术合为一体。编程对象将与实际对象对应并持有信息和动作。\n\n### 类\n\n在使用 `C#` 时，类将定义你的对象的特征。它们将为你提供一个定义对象本质结构或模型。根据一些编程专家的说法，类基本上是\
  \ `OOP` 的基础，它们与对象紧密相关。此外，你使用的每个对象都代表一个特定的类。\n\n让我们从名为“Toys”（玩具）的类和名为“Ball”（球）的对象开始。在这种情况下，“Ball”只是\
  \ `Toy` 类的一个实例。但 `Toy` 类将定义所有玩具以及球的行为和状态。\n\n类可以为你的计算机编程增加一些简单性。它们所持有的信息对于任何查看程序的人来说都应该是有意义，而不仅仅是专业程序员。例如，“Toys”类不能将\
  \ `HTTP` 作为其特征之一，因为这些无法联系在一起。\n\n## 属性和行为\n\n\n\n\n\n你的类将定义对象的行为，例如对象能够执行的操作，以及属性（或特征）。属性将以不同变量的形式出现在类体中，而行为将通过类内部的不同方法来定义。\n\
  \n让我们将这些概念应用到 `Toy` 类中。当应用它们时，你将获得颜色和大小作为属性。为了这一点，你将使用 `stop()` 和 `move()` 方法。\n\
  \n## 在程序中使用类\n\n到目前，我们已经讨论了一些关于类以及它们如何工作的，但我们需要更深入地了解它们在程序内部是如何运作的，以及它们在你尝试编写代码时能产生什么影响。在\
  \ C# 中，你应该使用 `class` 关键字来定义所有的类，以保持简单。\n\n在输入 `class` 之后，你需要指定想要使用的特定标识符，以及你想要放置在这个新类中的变量和方法。为了保持简单，在\
  \ C# 语言中，你可以添加到类中的不同部分包括：\n\n*   字段（Fields）——这些是任何属于特定数据类型的变量。\n*   方法（Methods）——你可以使用这些方法来操纵数据。\n\
  *   属性（Properties）——在这种语言中，属性将增强字段的工作效果。属性将为信息提供一些额外的管理能力并将其交给字段。\n\n下面是我们刚刚讨论的不同部分的示例，以便你很好地了解这在编程语言中是如何运作的。我们将使用\
  \ `book` 作为此类的名称，并给它两个属性：尺寸和类型。\n\n```cs\nPublic class Book\n{\n    Private string\
  \ bookType:\n    Private string size;\n\n    Public string BookType\n    {\n   \
  \     Get\n        {\n            Return this. bookType;\n        }\n        Set\n\
  \        {\n            This.bookType = value;\n        }\n    }\n\n    Public string\
  \ Size\n    {\n        Get\n        {\n            Return this. size;\n        }\n\
  \        Set\n        {\n            this.size = value;\n        }\n    }\n\n  \
  \  public Book()\n    {\n        this.bookType = “Dictionary”;\n        this.size\
  \ = “large”;\n    }\n\n    public book(string bookType, string size)\n    {\n  \
  \      this.bookType = bookType;\n        this.size = size;\n    }\n\n    public\
  \ void Sample()\n    {\n        Console.WriteLine(“ Is this a {0}, bookType)\n \
  \   }\n}\n```\n\n通过这个示例，`Book` 类能够定义两个不同的属性：书的类型和尺寸。这些属性能够隐藏同名字段内部的值，并且代码段将为生成 `Book`\
  \ 类的实例而声明两个构造函数。这段代码还创建了一个名为 `Sample()` 的方法。\n\n你将能够将此用于许多不同的事情，根据你的需要添加更多特征，而且它不必局限于书籍、玩具、车辆或任何其他。你可以稍微摆弄你的文本编辑器来尝试这个公式，并用其他类对其进行更改，以便让程序更方便地为你工作。\n\
  \n## 系统类\n\nC# 语言已经有了一个内置在系统中的库。这些将包含一些默认类，如 `Console`、`Math` 和 `String`。当你使用这种语言时，必须记住这个库与你使用的任何\
  \ `.NET` 应用程序兼容。\n\n`.NET` 框架之所以很好，因为它已经预装了此库，其中包含了各种类。对于那些正尝试完成一些基础编程任务（如文本处理、执行和网络连接）的人来说，这些类会很有帮助。对于刚起步的初学者甚至对于已经在编程语言领域工作了一段时间的人来说，它们也很有帮助，因为它们简单且已经写好了。\n\
  \n请记住，这些类在内部隐藏了逻辑实现。你应该更多地关注类能够做什么，而不是精确关注它们是如何做到的。由于由于原因，C# 的内置类对程序员是不可见的。由于你应该更多地关注代码运行的原理而不是所有的抽象部分，因此将这些代码仅用于它们的通用目的而不是担心它们是如何工作的是非常重要的。\n\
  \n## 创建和使用对象\n\n我们已经花了一些时间研究类，现在是时候学习在语言中创建并使用对象了。这里是一些可以帮助你入门的基础知识：\n\n### 创建对象\n\
  \n要在现有类内部开始创建对象，你需要创建一个 `new` 关键字。通常，程序员会为新对象分配一个变量，该变量的数据类型与对象的类类型相同。请记住，这样做不会将对象复制到变量中，而是给变量提供指向分配给它的对象的引用。使用以下代码查看这一切是如何运作的：\n\
  \n```cs\nBook someBook = new Book();\n```\n\n这个示例将 `Book` 类的实例分配给名为 `someBook` 的变量。这将使对象进入所需的正确类。\n\
  \n### 为你的新对象设置参数\n\nC# 允许为你新创建的对象分配一些参数。让我们采用你上面的语法并针对此进行调整：\n\n```cs\nBook someBook\
  \ = new Book(“Biography”, “large”);\n```\n\n这段代码将为名为 `someBook` 的对象分配参数。通过这种调整，类型是\
  \ Biography 而尺寸现在是 large。每当你使用 `new` 关键字时，`.NET` 框架将完成两件事：\n\n*   为这个新对象保留内存\n*\
  \   初始化对象的成员\n\n这个过程归功于一个名为 `constructor` 方法。对于上面的代码，初始参数是类的构造函数。这有助于对象处于正确的位置并赋予它所需的特征。\n\
  \n### 释放对象\n\n虽然你使用的某些编程语言要求你手动删除对象，但在 C# 中并非如此。这意味着你能够释放对象消耗的任何内存，而无需手动操作。随框架提供的\
  \ `CLR` 系统将使这一切成为可能。\n\n通过 `CLR` 系统，计算机会自动检测并释放任何没有引用的对象。分配给这些对象的内存将不再可用，你可以将其用于其他对象。总来说来说，这使得系统更容易使用并可以防止问题和错误。如果你想释放对象，应该花时间销毁相应的引用。一个很好的例子是：\n\
  \n```cs\nsomeBook = null;\n```\n\n这个过程不会删除对象，它只是从对象中移除引用，以便 `CLR` 能够执行自动删除。\n\n\
  ### 访问对象的字段\n\n当你想用 C# 访问对象的字段时，你需要使用点运算符 `.`。你只需要指定对象的名称，放置点，然后输入你想要访问的字段。然而，如果你要处理的对象仅在一个类中，你甚至不需要添加点。如果你想分配新值或提取值，你必须进入对象的字段。\n\
  \n对于处理属性的人来说，你需要使用 `get` 和 `set` 关键字。`set` 关键字允许你分配对象的值，而 `get` 关键字将帮助你从对象中提取值。\n\
  \n这里有一个使用这些信息获取对象属性的代码示例。我们将创建一个名为 `myBook` 的对象，然后将 `bookType` 赋值为“bible”以便于操作。\n\
  \n\n\n\n\n```csharp\nClass BookManipulation\n{\n    Static void Main()\n    {\n\
  \        Book myBook = new Book();\n        myBook.bookType = “Bible”;\n       \
  \ System.Console.WriteLine(“This is a {0}.” myBook.bookType);\n    }\n}\n```\n\n\
  ### 调用对象的方法\n\n你需要使用两个运算符，包括调用运算符（invocation operator）和点运算符（dot operator）。如果你选择操作的对象和方法在同一个类中，则不需要使用点运算符，但括号总是强制性的。要调用该方法，你只需要指定标识符，然后紧跟调用运算符即可。你可以在括号内放置参数，也可以为方法添加参数。\n\
  \n当你用 C# 编写程序时，可以为方法添加访问修饰符。C# 支持四种访问修饰符，包括 `private`、`internal`、`protected` 和 `public`。这些修饰符将帮助你在处理方法时限制调用权限。虽然它们所有修饰符都很重要，但我们将重点关注\
  \ `public` 修饰符以及它们将如何让信息（即对象）公开可用。\n\n## 构造函数\n\n构造函数是程序员每次创建新对象时都会运行的方法。构造函数背后的理念是初始化新对象的数据。在使用此方法时，你不会获得任何返回值。此外，构造函数使用的名称与它所属的类相同，这意味着它不会有一个随机的名称供你记忆。在使用\
  \ C# 语言时，你还可以为构造函数分配参数。\n\n### 构造函数的参数\n\nC# 中的构造函数像你在语言中使用的方法一样接受参数。你可以在类中设置几个不同的构造函数，但你应该检查并确保构造函数具有不同类型和数量的参数；这基本上确保了构造函数的唯一性。\n\
  \n记住，每你在类内部创建对象时，构造函数就会运行。如果你有一个类内部包含多个构造函数，你可能会好奇在创建新对象时是哪一个构造函数在运行。C# 能够为你确定正确的构造函数，因此你不需要担心，也不需要手动执行任何操作。\n\
  \n语言编译器将根据你最初设置的参数来选择正确的构造函数，这种原则被称为“最佳匹配”（best match）。这有助于保持条理清晰，并加快程序的编写过程。\n\n\
  使用构造函数的良好示例包括：\n\n```csharp\npublic class Device\n{\n    private string type;\n\
  \    private string size;\n    // 一个没有任何参数的构造函数\n    public Device()\n    {\n  \
  \      this.type =”laptop”;\n        this.type = “large”;\n    }\n    // 一个带有两个参数的构造函数\n\
  \    {\n        this.type = type;\n        this.size = size;\n    }\n}\n```\n\n\
  这些 `parameters`（参数）可以帮助程序程序你想做什么。它也让 C# 更容易根据你当前正在的工作判断出你想显示哪个构造函数。\n\n## 静态数据成员\n\
  \n到目前为止，我们一直在研究指示正在使用的对象的状态。这些字段将直接与特定类内部的对象关联。在 OOP 中，你会遇到与类关联的不同特殊类型的字段和方法，而不是与对象本身关联。这被称为“静态数据成员”，因为它不会受对象的影响。它甚至可以在没有任何对象的情况下在类内部运行。\n\
  \n当你编写程序时，你需要花时间使用 `static` 关键字定义静态方法。你可以将其放置在方法的值类型或字段类型中。如果在 C# 中需要，你甚至可以使用这些来创建静态构造函数。对于这种情况，你把\
  \ `static` 关键字直接放在构造函数名称之前。\n\n对象和类是 C# 工作机制的重要部分，它们将帮助你真正实现你想要的代码。上述主题只是你在这个编程语言中使用类和对象可以做的一些很棒的事情，通过一点实验，你会发现，使用这种易于使用的语言，几乎一切都是可能的！\n\
  \n# 在 C# 中定义类\n\n我们在上一个章节中花了一些时间研究类和对象，但在这里我们将更多地研究类并学习如何在 C# 语言中定义这些类。让我们来看看并开始这部分！\n\
  \n## 类的基础\n\n在编程语言中，类定义了程序可以使用的数据和对象类型。对象包含这些实际信息，用以定义其容器的状态。类还可以描述对象的行为。这是对象能够执行的所有行为。在进行\
  \ OOP 时，你应该使用方法来描述对象的行为。\n\n## 类的组件\n\n每个类都包含几个不同的部分，包括：\n\n*   声明（Declaration）——这一行将用于声明类的标识符。\n\
  *   体（Body）——就像方法一样，类将有一个体。你需要在做出声明后立即定义体。体是位于大括号之间的语句或多条语句。示例如下：\n\n```csharp\n\
  class Example\n{\n// 这是“Example”类的体。\n}\n```\n\n*   构造函数（Constructor）——这是允许你创建新对象的部分。示例如下：\n\
  \n```csharp\nPublic Sample()\n{\n//在此处插入你想说的内容。\n}\n```\n\n*   字段（Fields）——这些是在类中声明的变量。字段将包含代表其尝试获取的对象精确状态的值。\n\
  *   属性（Properties）——这部分将描述类的不同属性。许多程序员会直接在所选对象的字段内部编写类属性。\n*   方法（Methods）——方法基本上是一个可执行的具名代码块。它能够完成某些任务，并允许对象获得正确的行为。它还可以执行代码内部存在的正确算法。\n\
  \n接下来的示例将向你展示使用 C# 语言创建类的最佳方法，并包含我们上面讨论过的对类来说重要的所有部分。\n\n```csharp\nclass ZooAnimals\
  \ // 这是类的声明\n{\n    // 这个括号标志着类的开始\n    string animalType // 这一行声明了一个新字段\n    public\
  \ ZooAnimals() // 这一行声明了一个空的构造函数。\n    {\n    }\n    public ZooAnimals(monkey animalType)\
  \ // 这一行为该类创建了另一个构造函数。\n    {\n        this.animalType = animalType;\n    }\n  \
  \  string ZooAnimals // 这里，你正在声明一个属性。\n    {\n        get {return animalType;}\n\
  \        set { animalType = value;}\n    }\n    Static void Animal() // 这一行为类声明了一个新方法。\n\
  \    {\n        System.Console.WriteLine(“This is a {0}.” animalType)\n    }\n}\n\
  ```\n\n## 对象和类\n\n现在我们了解了一些如何创建和使用类对象，是时候进一步学习这种技术以及它在你编程时将如何工作。\n\n### 自定义类\n\n\
  在你开始使用特定类之前，需要在类内部有一个对象。你可以通过从 `new` 关键字和类内部存在的构造函数开始来实现。\n\n\n\n\n在 C# 编程语言中，你无法直接操作对象。这意味着你必须先将对象赋值给一个变量，才能对其进行操作。之后，你可以通过你选择的任何变量来访问和使用该对象。请记住，为了访问对象的方法和属性，你需要指定对象的标识符并使用点运算符（`.`）。\n\
  \n### 关于对象的更多信息\n\n你的 `.NET` 框架中的每个对象都包含两个部分：引用部分和实际部分。实际部分包含有关对象的信息，并存储在计算机操作系统中被称为动态内存的堆（heap）中。另一方面，`.NET`\
  \ 框架的引用部分存在于程序的执行栈（stack）中，该部分用于存放方法参数和局部变量。\n\n如果你想创建一个与对象关联的新变量，你需要确保给它赋值为 `null`。这个关键字会告诉语言编译器该变量目前没有值。\n\
  \n### 组织你的类\n\n在 C# 中保存代码时，你只需要遵循一个规则，即所有类都必须保存为 `.cs` 文件，以便于查找并使类能够正常工作。从技术上讲，你可以将创建的所有类都保存到一个文件中，编译器仍然可以工作而不会报错，但在大多数情况下，最好将它们保存在不同的文件中，以帮助你保持条洁。如果你将所有类都保在一个文件中，有时很难找到你想要的类。\n\
  \n### 使用命名空间 (namespace)\n\n你将熟悉在 C# 中使用 `namespace`。这是一组在逻辑上相互相关的类。它可以包含类、接口、结构体和其他类型的信息。无论它们在内存中的位置如何，你都可以将几个类组合进\
  \ `namespace` 中。\n\n如果你想在创建的代码中使用 `namespace`，请确保添加了 `using` 指令以简化操作。大多数程序员发现，在\
  \ `.cs` 文件的前几行编写这些指令是最容易的，这样可以确保他们不会忘记。在插入指令后，你可以声明你想要使用的命名空间。\n\n### 访问修饰符\n\n\
  C# 支持四种修饰符：`protected`、`private`、`internal` 和 `public`。这些修饰符允许你控制类中元素的可见性。让我们花时间详细讨论每种修饰符，以便你了解哪种适合你。\n\
  \n- `private`——此修饰符会对类进行限制。如果被标记为私有元素，则任何其他类都无法访问它。C# 将此作为修饰符的默认值，因此如果你不决定元素的访问权限，系统将将其设为私有。\n\
  - `public`——如果你希望元素能被其他类访问，你应该选择这种修饰符。这意味着你移除了所有关于对象可见性的限制。\n- `internal`——如果你的元素使用此修饰符，则它将仅对同一项目中的文件可访问。\n\
  - `protected`——此修饰符将阻止用户访问元素。但是，它允许所有后代类访问并使用相关的元素。\n\n根据你想要的功能，每种修饰符的工作方式略有不同。如果你想保持受保护并确保它不被其他类访问，你需要确保使用\
  \ `private` 设置。但如果你希望其他元素和类访问它，你需要将其设置为 `public`。当然，还有一些中间选项选项，可以帮助你确定其他类对此主修饰符有多大的访问权限。\n\
  \n你需要确定哪种适合你的代码。大多数情况下，你会发现 `private` 是默认选项，但你始终可以更改它，以确保修饰符在程序中按预期发挥作用。\n\n###\
  \ 声明类\n\nC# 在类声明方面有一些严格的规则。如果你没有很好地声明类，将会遇到运行时错误和编译时问题。为了确保不出现任何错误，你应该使用以下语法：\n\n\
  `<modifier> <class> <name_of_the_class?>`\n\n你需要在标识符之后直接编写类体，以便操作更简单。类体是包含可执行代码的部分，与其他与其他编程语言一样，你应该将此写在大括号\
  \ `{}` 内部。\n\n### “this” 关键字\n\n你应该学习的另一个关键字是 `this`。这是一个可以帮助你访问类内容的工具。使用该关键字的示例包括：\n\
  \n```csharp\nthis.sampleMethod(); // 使用此语法运行方法。\nthis.sampleField;   // 使用此语法访问特定字段。\n\
  this(8,9);           // 使用此语法触发包含两个参数的构造函数。\n```\n\n### 字段 (Fields)\n\n对象代表物理世界中的事物。为了定义这个对象，你将把精力集中在属性上，这些属性将与程序的目的相关联。你需要借助特殊变量将属性存储在类中。这些被称为字段（fields），它们定义了对象的状态。\n\
  \n#### 声明字段\n\nC# 要求你直接在类体中声明所有字段。以下代码展示了如何声明字段的几个示例：\n\n```csharp\nclass Example\n\
  {\n    double salary;\n    char letter;\n    string yourName;\n}\n```\n\n#### 字段的作用域\n\
  \n字段的作用域从你开始编写的地方开始，一直持续到类体结束。这为你提供了很多编写你想要的内容的机会。\n\n#### 初始化你的字段\n\nC# 可以轻松设置你创建的任何字段的值。用于设置字段值的语法与用于普通变量的语法非常相似。你应该使用的语法看起来如下：\n\
  \n`<modifier> <type_of_field> <name_of_field> = <value>;`\n\n需要注意的是，你应该检查初始值是否与你正在使用的字段兼容。C#\
  \ 在数据类型所需兼容性的规则方面相当严格，以避免出现错误和运行时问题。请看以下示例：\n\n```csharp\nclass Sample\n{\n    int\
  \ payment = 5000;\n    char letter = 'x';\n    string [] instruments = new string[]\
  \ {\"guitar\", \"drums\"};\n    Vehicles myVehicle = new Vehicles();\n}\n```\n\n\
  这将帮助你在程序中组合你需要的字段。你可以进行更改，使该功能与你选择的代码配合得最好。\n\n#### 字段的默认选择\n\n当你从类内部创建对象时，系统都会预留一些内存来存放新对象的字段。系统可以通过设置初始字段或每个字段的值来实现这一点。如果你没有按照你自己的意愿设置这些默认值，`.NET`\
  \ 框架将为你设置这些值。\n\n\n\n这是局部变量与字段之间主要的区别。当局部变量没有正确的值或根本没有值时，语言编译器将向你发送错误消息。因此，你需要确保检查这一点并尽早为其设置一个值，否则你可能会在项目中遇到麻烦，并且不得不回过头进行正确的修改。\n\
  \n### 自定义你的默认值\n\n在使用 C# 语言工作时，你被允许为任何字段设置默认值。这是一个非常棒的功能，与你可能选择的其他某些编程语言相比，它能让代码更易读、更洁。让我们来看看之前看到的一些字段，看看我们如何对它们进行自定义，以便它们在程序中看起来更好：\n\
  \n```class\nclass Sample\n{\n    int payment = 0;\n    char letter = null;\n   \
  \ string [] instruments = null;\n    Vehicles myVehicle = null;\n}\n```\n\n可读性和整洁是使用\
  \ C# 代码最重要的两个部分之一，因此你需要找到方法处理代码、值、类和其他部分，使它们紧凑并尽可能看起来美观，而又不需要一直进行过多的工作。通过设置默认值，真的可以帮助你正确完成这一点。\n\
  \n对于一些还没有机会接触编程的人来说，编写程序可能是令人生畏的，但也许他们脑海中是那种看起来乱如团且难以上手的复杂代码。C# 是一门非常适合学习的语言，因为它简单易用，并且有很多许多特性，即使是初学者也能轻松学会。\n\
  \n# 结论\n\n感谢你读完《C#：零基础初学者的编程基础》，希望这本书能为你提供有益的信息，并能够为你提供实现你目标所需的所有工具，无论你的目标是什么。\n\
  \n下一步是开始在你的生活中使用 C# 编程语言。这是一个非常棒的工具，一种运行在大多数计算机上的编程语言，设计初衷是为了让初学者易于使用和阅读。我们已经带你走了创建\
  \ C# 程序所需要采取的一些步骤，甚至讨论了 C# 编程语言的一些重要部分，这样你就能真正走上正确的轨道。\n\n虽然许多其他编程语言也非常好用，并允许你实现一些强大的功能，但其中某些语言有点让人困惑，可能会吓跑对整个过程完全陌生的人。但有了\
  \ C#，你将不会遇到这个问题。你可以立即开始编写你的第一个程序（我们在书中讨论了实现这一点的某些选项），你会发现编程可以非常有趣而且真的简单。\n\n当你准备好开始编程并让它满足你的需求时，请务必查阅本指南，了解使用\
  \ C# 是多么简单。\n\n最后，如果你觉得这本书在任何方面对你有帮助，我们将非常感谢你在 Amazon 上留下的评价！\n\n# 关于作者\n\nNathan\
  \ Clark 是一位资深程序员，在软件行业拥有近 20 年的经验。\n\n他拥有麻省理工学院（MIT）的硕士学位，曾在美国一些领先的软件公司工作过，并在软件设计和开发方面积累了丰富的知识。\n\
  \nNathan 和他的妻子 Sarah 在 2009 年创立了自己的开发公司，以便能够承担更具挑战性和创造性的项目。今天，他们为来自世界各地的优质客户提供服务。\n\
  \nNathan 喜欢通过他的书籍分享编程知识，为客户开发创新的软件解决方案，并在空闲时间看经典的科幻电影。\n\n如需向专家那里学习编程，请关注书店和网上 Nathan\
  \ 的更多书籍。\n"
