- "# C# 和 .NET Core 并行编程：从零开始使用 C# 和 .NET Core 3.1 开发多线程应用\n\n\n\n\n\n\n\n\n## 献给\n\
  全球所有正在与这种致命病毒斗争、冒着生命危险拯救人类的热心读者们！向他们致敬！\n\n## 关于作者\n**Rishabh Verma** 是微软认证专业人士，在微软担任高级顾问，帮助客户设计、开发和部署企业级应用程序。他在\
  \ .NET 技术栈上拥有 12 年以上的硬核开发经验。他的兴趣是创建工具、Visual Studio 扩展、代码生成和 .NET Foundation。他的\
  \ LinkedIn 页面为：`https://www.linkedin.com/in/rishabhverma/`。\n\n**Neha Shrivastava**\
  \ 是微软认证专业人士，在微软印度开发中心的 Cloud & AI 组担任软件工程师。她拥有约十年的开发经验，在金融、医疗保健和电子商务领域拥有专长。她的兴趣是\
  \ ASP.NET 栈、Azure 和跨平台开发。她热衷于学习新技术并与最新进展同步。她的 LinkedIn 简介为：`https://www.linkedin.com/in/neha-shrivastava-99a80135/`。\n\
  \n**Ravindra Akella** 在微软担任高级顾问，拥有 13 年以上的软件开发经验。他精通 .NET 和 Web 相关技术，目前的工作涉及从架构到使用\
  \ Azure 及相关技术交付复杂解决方案的端到端产品所有。他是一个精通技术的开发者，热于拥抱新技术。他曾在国际会议上进行过 Azure 及其他技术的演讲和会议。他的\
  \ LinkedIn 简介为：`https://www.linkedin.com/in/ravindra-akella/`。\n\n## 致谢\n当一本书出版时，只有作者和编辑的名字会被提及，但许多无名英雄发挥了同样重要的作用，没有他们，项目无法完成或取得成功。我有很长的一名单英雄需要感谢。衷心感谢架构师们（`Ranjiv\
