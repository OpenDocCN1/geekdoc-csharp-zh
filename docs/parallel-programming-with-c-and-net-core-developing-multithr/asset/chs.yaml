  \ BPB 出版的优秀团队，为我们提供了这个分享学习经验并为社区贡献的机会。 — **Rishabh Verma**\n\n我要以最诚挚的感谢父母（`Smt.\
  \ Archana Shrivastava` 和 `Shri O.P. Shrivastava`）的支持和爱；我的兄弟（`Dr. Utkarsh Shrivastava`）、嫂子（`Dr.\
  \ Samvartika Shrivastava`），以及最后同样重要的，我的丈夫，他也是这本书的合著者 `Rishabh`。他们通过持续的支持和鼓励一直让我坚持下去。\
  \ — **Neha Shrivastava**\n\n我想感谢几位在写书期间给予我持续和进行性支持的人。我非常感谢父母的爱、祈祷、关怀和牺牲；非常感谢我的妻子\
  \ `Srividya` 和儿子 `Vaarush` 的爱、理解、祈祷和完成这本书的持续支持。最后，感谢我的合著者 `Rishabh` 和 BPB Publications\
  \ 的机会。\n\n## 前言\n应用程序开发在过去十年中发生了演变，随着 `Angular`、服务器端 `ASP.NET Core` 等最新技术的出现，消费者的期望也随之提高。软件开发的新格言是“慢即是快”，这意味着性能是应用程序开发中最关键的因素之一。本书的主要目标是帮助读者理解异步编程的重要性以及使用\
  \ `.NET Core` 构建并发应用程序的各种方法。通过这十章，你将学习线程的基础、异步编程、各种同步结构、单元测试方法、调试应用程序以及技巧。\n\n\n\
  *   下载 Windows 必备工具\n*   安装带有 .NET Core 的 Visual Studio 2019\n*   使用 Visual Studio\
  \ 2019 配合 `.NET Core 3.1`\n*   使用 `Perfmon、Procmon、PerfView、JustDecompile、DebugDiag、WinDbg`\n\
  \n*   C# 8 平台依赖\n*   新功能和增强\n*   可空类型 / 非可空类型\n*   异步流\n*   范围和索引 (`System.Index`、`System.Range`)\n\
  *   接口的默认实现\n*   结构体上的只读成员\n*   模式匹配增强（Switch 表达式、递归模式、位置模式）\n*   `Using` 声明\n*\
  \   静态本地函数\n*   `ref` 结构体\n*   空合并赋值\n*   插值字符串\n### 3. .NET Core 3.1\n*   .NET\
  \ Core 版本 API\n*   Windows Desktop 应用程序支持\n*   Windows Desktop MSIX\n*   COM 调用组件\
  \ – Windows Desktop\n*   WinForms 高 DPI\n*   .NET Standard 2.1\n*   C# 8 及其新功能支持\n\
  *   编译和部署（默认执行文件、单执行文件）\n*   程序集\n*   分层编译\n*   ReadyToRun \n*   跨平台/架构限制\n*   运行时/SDK（构建副本、本地工具）\n\
  *   垃圾回收堆\n*   垃圾回收大页（可选）\n*   IEEE 浮点改进\n*   内置 JSON 支持 (`JsonReader`、`JsonWriter`、`Json`)\n\
  *   HTTP/2 支持\n*   加密导入和导出\n### 4. 揭秘线程\n*   为什么需要线程？什么是线程？\n*   `ThreadException`\
  \ 处理\n*   `ThreadPool` 的限制\n*   `ThreadPool` 中的异常\n*   线程池的限制\n*   `ThreadPool`\
  \ 实战\n*   `Task`、`TaskCreationOptions`\n*   使用任务的异常处理\n*   取消、续接\n*   `WhenAll`、`WhenAny`\n\
  *   `Task Scheduler`,`Task Factory`\n\n*   理解术语\n*   并行扩展\n*   任务并行库 (`TPL`)\n*\
  \   数据并行、任务并行\n*   `PLINQ`\n*   并行数据结构\n*   `IEnumerator` 和 `yield return`\n*  \
  \ `async await`（控制流、底层原理）\n*   语言特性（使用 `async await` 的原则、`async await` 的限制）\n* \
  \  CPU（计算）密集对比 I/O 密集工作\n*   死锁、异步流、值\n\n### 6. 线程模式\n*   基于任务的异步模式 (`TAP`)\n* \
  \  CPU 密集对比 I/O 密集\n*   异常处理\n*   取消、进度报告\n*   异步编程模型 (`APM`)\n*   基于事件的异步模式 (`EAP`)\n\
  \n### 7. 同步结构\n*   线程安全\n*   锁结构（互斥、非互斥）\n*   信号结构 (`AutoResetEvent`、`ManualResetEvent`、`Semaphore`、`SemaphoreSlim`、读/写锁、`AutoResetEvent`、`ManualResetEventSlim`、`CountdownEvent`、`Barrier`、`Interlocked`、`Volatile`)\n\
  \n### 8. 并行和异步程序的单元测试\n*   使用 `XUnit`单元测试的基础\n*   实时单元测试\n*   测试异步方法\n*   测试异步方法中的异常\n\
  *   使用模拟 (`Moq`) 测试异步方法\n\n### 9. 调试与故障排除\n*   使用 `Visual Studio 2019` 进行入门调试\n\
  *   多线程应用程序分析\n*   内存转储（收集与分析）\n*   识别高 CPU 问题\n\n### 10. 技巧与窍\n*   线程与 `TPL`\n\
  *   `async await`\n*   `async void` 与 `async Task`\n*   `ConfigureAwait`\n\n---\n\
