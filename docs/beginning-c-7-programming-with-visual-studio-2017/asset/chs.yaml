  \               discardedCards.Add(playCard);\n               WriteLine($\"Discarding:\
  \ {playCard}\");\n               // 为玩家留出空行\n               WriteLine();\n     \
  \          // 检查玩家是否赢得游戏，如果是，则退出\n               // 玩家循环。\n               GameWon\
  \ = players[currentPlayer].HasWon();\n               if (GameWon == true)\n    \
