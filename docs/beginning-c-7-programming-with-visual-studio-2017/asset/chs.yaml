  \ NeckLength {get; set;}\n   public string Name {get; set;}\n} \n```\n\n4. 13.4\
  \ 正或错：如果你声明一个类型为 `var` 的变量，你将能够使用它来持有任何对象类型。\n\n5. 13.5 当你使用匿名类型时，如何比较两个实例以确定它们是否包含相同的数据？\n\
