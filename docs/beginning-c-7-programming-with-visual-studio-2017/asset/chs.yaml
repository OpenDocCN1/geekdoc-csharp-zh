  图 2-10\n\n此外，项目将不再编译。\n\n此窗口帮助你消除代码中的错误，因为它跟踪了你编译项目时需要执行的操作。如果你双击此处显示的错误，光标将跳转到源代码中错误的位置（如果包含错误的源文件尚未打开，则会打开它），这样你就可以快速修复它。代码中的错误位置会出现红色波浪线，因此你可以快速扫描源代码以查看问题所在。\n\
  \n错误位置指定为行号。默认情况下，Visual Studio 文本编辑器不显示行号，但那是非常值得开启的。要这样做，请在“选项”对话框中勾选“行号”复框（通过工具\
