  \           \" (来自派生类的输出)\";\n } \n```\n\n### 练习 3\n\n如果一个方法有返回类型，则可以将其作为表达式的一部分使用：\n\
  \n```cs\nx = Manipulate(y, z); \n```\n\n如果部分方法（partial method）没有提供实现，则它将被编译器同所有使用它的地方一起移除。在前面的代码中，这将导致\
  \ `x` 的结果变得不确定，因为没有可用的 `Manipulate()` 方法的替代方案。可能会是，如果没有这个方法，你只是想直接忽略整行代码，但编译器无法判断这是否是你的意愿。\n\
  \n没有返回类型的方法不会作为表达式的一部分调用，因此编译器移除所有对部分方法调用的引用是安全的。\n\n同样，禁止使用 `out` 参数，因为用作 `out`\
  \ 参数的变量在方法调用之前必须未定义，而在方法调用之后会被定义。移除方法调用将破坏这种行为。\n\n### 练习 4\n\n```cs\nclass MyCopyableClass\n\
