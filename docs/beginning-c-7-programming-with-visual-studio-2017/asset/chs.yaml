  \ |\n| 创建存储账户 | 存储账户可以包含无限数量的容器。存储账户是控制其内部创建的容器访问的机制。 |\n| 使用 C# 创建存储容器 | 存储容器存在于存储账户中，包含任何存在互联网连接的地方都可以访问的\
  \ blob、文件或数据。 |\n| 在 ASP.NET Razor 中引用存储容器 | 可以在 C# 代码中引用存储容器。你使用存储账户名称、容器名称以及你需要访问的\
  \ blob、文件或数据的名称。 |\n\n# 17\n\n高级云编程与部署\n\n## 创建 ASP.NET Web API\n\n*应用程序编程接口* (API)\
  \ 这一计算机编程概念已经存在几十年，通常被描述为包含一组用于构建软件程序的有用函数的模块。\n\n最初，从 Windows 客户端应用程序的角度来看，这些模块是动态链接库（`.dll`），它们揭示了可以通过程序化访问的接口，将内部函数暴露给其他程序。在这样的系统中，当调用程序使用\
  \ API 时，它就依赖于接口的模式。接口的更改会导致调用程序内部出现异常和失败，因为访问接口的当前方法已失效。一旦程序依赖于某个接口，就不应该更改它。如果发生了更改，这种事件通常被称为\
  \ DLL 地狱。关于 DLL 地狱的更多信息，请阅读此文章：`http://www.desaware.com/tech/dllhell.aspx`。\n\n\n\
  \n\n\n有许多选项可以将您的 Web App 部署到 Microsoft Azure 平台。最流行的方法之一是通过本地 Git 仓库或托管在 GitHub\
  \ 上的公共 Git 仓库。本地和公共 Git 仓库提供了版本控制功能，这是一个非常实用的特性。版本控制让开发者和发布经理了解执行了哪些特定更改、何时执行的以及由谁执行的。如果在编译二进制文件或将更改部署到实地环境时出现问题或意外异常，可以很容易找到相关人员进行联系。其他可以集成到\
  \ Microsoft Azure 的部署平台还包括 Visual Studio Team Services、OneDrive 和 Bitbucket 等。\n\
  \n由于上一个“尝试一下”（Try It Out）中的代码是一个未包含在版本控制仓库中的独立项目，因此部署是直接在 IDE 内部进行的（在本例中为 Visual\
  \ Studio 2017）。部署未包含在源代码仓库中的解决方案的其他方法还包括例如：Web Deploy (`msdeploy.exe`) 和 FTP。\n\n\
  完成以下“尝试一下”，将 ASP.NET Web API 部署到 Microsoft Azure Web App。\n\n现在 ASP.NET Web API\
  \ 已经部署完成，任何具有发送 HTTP 请求和解析 JSON 文件能力的客户端都可以调用它。接下来的“尝试一下”提供了您所需的所有指令，学习如何从 ASP.NET\
  \ 网页调用刚刚发布的 ASP.NET Web API。\n\n您可以考虑利用从上一个“尝试一下”中学到的知识，将此 ASP.NET 网站部署到 Microsoft\
  \ Azure 平台。例如，只需右键点击 `Ch17Ex02` 解决方案，选择“发布 Web App”，并按照发布向导操作。随后创建一个名为 `handofcards‐consumer`\
  \ 的 Web App 即可通过 `http://handofcards‐consumer.azurewebsites.net/` 访问。由于 ASP.NET\
  \ Web API 和 Microsoft Azure Blob Container 都可以从世界任何地方通过互联网访问，将 ASP.NET 网站放置在 Azure\
  \ 上将获得相同的结果（获得手牌）。\n\n随着时间的推移，如果消费者或 API 变得流行并开始接收大量请求，在免费模式下运行 Web App 可能会导致资源阈值突破，从而暂停资源可用。这并不是理想的。在下一节中，您将学习如何扩展在\
  \ Microsoft Azure 平台上作为 Web App 运行的 ASP.NET Web API，以便用户和客户可以在需要时访问您的响应式网络资源。\n\n\
  ## 在 MICROSOFT AZURE 上扩展 ASP.NET WEB API\n\n扩展以满足用户需求曾是一项非常枯燥、耗时且昂贵的活动。从历史上看，当公司想要增加服务器容量以支持更多流量时，需要将物理硬件获取、组装并配置到数据中心中心。然后，一旦硬件连接到网络，就会交给应用程序所有者来安装和配置操作系统、所需的组件以及应用程序源代码。执行此类任务所需的时间导致公司安装大量的物理容量来管理峰值期间的使用情况；然而，在非峰值期间，额外的容量将完全得不到使用并闲置，这是一种非常昂贵且非优的资源分配方式。\n\
  \n更好的方法是使用云平台（例如 Microsoft Azure），这些平台提供了在需要资源时优化利用物理资源进行向上扩展、向下收缩和横向扩展的能力。当您需要\
  \ CPU、磁盘空间或内存等物理资源时，您可以向上或横向扩展以满足需求；而当对云托管服务的需求减少时，您可以缩小规模，并节省财务资源用于其他项目和服务。\n\n\
  本章的剩余部分将阐述如何根据 CPU 需求在特定时间段内扩展 ASP.NET Web API。\n\n自动伸缩功能对于管理 Web App 的意外使用峰值和请求非常有用。然而，如果您已经知道客户或用户何时与您的\
  \ Web App 交互，您可以提前计划，并在实际需要之前稍早准备好额外的实例。这样做的好处是，您不需要根据 CPU 使用情况逐渐增加或减少实例，而是可以仅在该特定时间段内立即扩展到所需的\
  \ CPU 数量和内存量。例如，如果您知道营销部门在 10 月份正在开展活动，您可以安排在那个月提供额外的资源。通过让所需的资源就绪并预热，您可以避免在为用户或客户分配资源时出现任何延迟。请执行以下“尝试一下”中描述的步骤以查看。\n\
  \n当您为 Web App 创建扩展计划时，需要名称、开始日期、开始时间、结束日期和结束时间。有了这些信息，Microsoft Azure 平台将管理可用实例的数量，这些实例是在配置的时间段内为您的\
  \ Web App 提供服务的虚拟虚拟机。可以创建许多计划，每个计划都有其自己的实例数量和扩展设置。只需创建计划并保存，在需要时从计划下拉菜单中选择它，资源将如预期变得可用。\n\
