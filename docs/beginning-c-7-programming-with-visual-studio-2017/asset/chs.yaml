  \ |\n\n变量与表达式\n\n### C# 基础语法\n\nC# 代码的外观和感受与 C++ 和 Java 相似。这种语法初看起来可能非常困惑，而且比某些语言更不像书英语。然而，当你沉浸在\
  \ C# 编程的世界时，你会发现所使用的风格是明智的，而且不需要费力就能写出非常有可读性的代码。\n\n与 Python 等其他语言的编译器不同，C# 编译器忽略代码中额外的间距，无论这些间距是由空格、回车还是制表符引起的（统称为空白字符）。这意味着你在格式化代码方面有很大的自由，尽管遵循某些规则可以帮助你的代码更易读。\n\
  \nC# 代码由一系列语句组成，每条语句都以分号结束。由于忽略空白，多个语句可以出现在同一行，但为了可读性，通常会在分号后添加回车，以避免同一行出现多个语句。然而，使用跨多行代码的语句是完全可以的（也是常见的）。\n\
  \nC# 是一种块结构语言，这意味着语句是代码块的一部分。这些块由大括号（`{` 和 `}`）定义，可以包含任何数量的语句，也可以没有任何。注意大括号字符不需要分号。\n\
  \n例如，一个简单的 C# 代码块可以采取以下形式：\n\n```\n {\n\n   <code line 1, statement 1>;\n\n   <code\
  \ line 2, statement 2>\n\n       <code line 3, statement 2>;\n\n} \n```\n\n\n\n\n\
  # 缩进\n\n这里的 `<code line x, statement y>` 部分并不是真实的 C# 代码；这段文字仅用作占位符，代表将放置 C# 语句的地方。在这种情况下，代码的第二行和第三行属于同一个语句，因为第二行末尾没有分号。对第三行代码进行缩进可以让你更容易识别出它实际上是第二行的延续。\n\
  \n下面的简单示例使用了 `indentation`（缩进）来明确 C# 代码。这实际上是标准做法，事实上 Visual Studio 默认就会自动为你完成这一点。通常情况下，每个代码块都有自己的缩进层级，意味着它向右偏移的程度。代码块之间可以相互嵌套（即代码块可以包含其他代码块），在这种情况下，嵌套的代码块将进一步缩进：\n\
  \n```\n {\n\n   <code line 1>;\n\n   {\n\n      <code line 2>;\n\n      <code line\
  \ 3>;\n\n   }\n\n   <code line 4>;\n\n} \n```\n\n此外，作为前几行代码的延续行通常也会进一步缩进，正如第一个代码示例中的第三行代码那样。\n\
  \n当然，这种风格并不是强制性的。然而，如果你不使用它，你会很快发现在翻阅这本书的过程中，情况会变得非常混乱！\n\n# 注释\n\n`Comments`（注释）是你在\
  \ C# 代码中经常看到的其他内容。严格来说，注释完全不是 C# 代码，但它们很乐意与代码并存共处。注释是自解释其义的：它们允许你向代码中添加描述性文本——使用纯英语（或法语、德语、蒙古语等）——而这些文本会被编译器忽略。当你开始处理冗长的代码段时，添加一些关于你具体在做什么的提醒是非常用的，例如“这行代码向用户请求一个数字”（this\
  \ line of code asks the user for a number 或“这段代码由 Bob 编写”。\n\nC# 提供了两种方法来实现这一功能。你可以在注释的开始和结束处放置标记，也可以使用一个表示“此行剩余的所有内容都是注释”的标记。后一种方法是前面提到的关于\
  \ C# 编译器忽略换行符规则的例外，但它是一个特例。\n\n要使用第一种方法标记注释，你可以在注释的开头使用 `/*` 字符，在结束处使用 `*/` 字符。这些可以出现在单行中，也可以出现在不同的行，在这种情况下，中间的所有行都是注释的一部分。你可以在注释体中不能输入的字符是\
  \ `*/` ，因为这会被解释为结束标记。例如，以下内容都是正确的：\n\n```\n /* This is a comment */\n\n/* And so…\n\
  \n               … is this! */ \n```\n\n然而，以下内容会导致问题：\n\n```\n /* Comments often\
  \ end with \"*/\" characters */ \n```\n\n在这里，注释的结尾（`\"*/` 之后的字符）将被解释为 C# 代码，并会导致错误。\n\
  \n另一种注释方法是以 `//` 开始注释。之后，你可以编写任何你喜欢的的内容——只要你保持在一行内！以下内容是正确的：\n\n```\n // This is\
  \ a different sort of comment. \n```\n\n然而，以下内容会失败，因为第二行被解释为 C# 代码：\n\n```\n //\
  \ So is this,\n\n   but this bit isn't. \n```\n\n这种类型的注释对于记录语句非常有用，因为两者都可以放在同一行内：\n\
  \n```\n <A statement>;         // Explanation of statement \n```\n\n前面提到过注释 C# 代码有两种方法，但\
  \ C# 中还有第三种类型的注释——尽管严格来说这是 `//` 语法的扩展。你可以使用以三个 `/` 符号开头而不是两个的单行注释，如下所示：\n\n```\n\
  \ /// A special comment \n```\n\n在正常情况下，它们会被编译器忽略——就像其他注释一样——但你可以配置 Visual Studio\
  \ 在项目编译时提取这些注释后的文本，并创建一个特殊格式的文本文件。然后你可以使用它来创建文档。为了使这些文档被创建，注释必须遵循此处描述的 XML 文档注释规则：[`https://docs.microsoft.com/en-us/dotnet/csharp/programming-guide/xmldoc/xml-documentation-comments`](https://docs.microsoft.com/en-us/dotnet/csharp/programming-guide/xmldoc/xml-documentation-comments)\
  \ —— 本书未涵盖该主题，但如果你有空闲，非常值得学习。\n\n关于 C# 代码有一个 `very` 重要的点，它是 `case sensitive`（区分大小写的）。与其他语言不同，你必须使用完全正确的大小输入代码，因为使用大写字母代替小写字母会导致项目无法编译。例如，考虑下面这行取自\
  \ 第 2 章 的代码：\n\n```\n Console.WriteLine(\"The first app in Beginning C# Programming!\"\
  ); \n```\n\n这段代码被 C# 编译器理解，因为 `Console.WriteLine()` 命令的大小写是正确的。然而，以下任何一行代码都无法工作：\n\
  \n```\n console.WriteLine(\"The first app in Beginning C# Programming!\");\n\nCONSOLE.WRITELINE(\"\
  The first app in Beginning C# Programming!\");\n\nConsole.Writeline(\"The first\
  \ app in Beginning C# Programming!\"); \n```\n\n在这里，使用的大小写是错误的，所以 C# 编译器不知道你想做什么。幸运的是，正如你很快发现的，Visual\
  \ Studio 在输入代码方面非常有帮助，大多数时候它知道（在它的能力范围内）你想做什么。\n\n## 基础 C# 结构\n\n在这里，我们将更仔细地查看 第\
  \ 2 章 中的控制台示例（`Console1`）并拆解其结构。以下是代码：\n\n```\n using System;\n\nusing System.Collections.Generic;\n\
  \nusing System.Linq;\n\nusing System.Text;\n\nusing System.Threading.Tasks;\n\n\
  namespace ConsoleApplication1\n\n{\n\n   class Program\n\n   {\n\n      static void\
  \ Main(string[] args)\n\n      {\n\n         // Output text to the screen.\n\n \
  \        Console.WriteLine(\"The first app in Beginning C# Programming!\");\n\n\
  \         Console.ReadKey();\n\n      }\n\n   }\n\n}\n```\n\n你可以立即看到上一节讨论的所有语法元素都在这里——分号、大括号和注释，以及适当的缩进。\n\
  \n目前最重要的代码部分是：\n\n```\n static void Main(string[] args)\n\n{\n\n   // Output text\
  \ to the screen.\n\n   Console.WriteLine(\"The first app in Beginning C# Programming!\"\
  );\n\n   Console.ReadKey();\n\n} \n```\n\n这就是在你运行控制台应用程序时执行的代码。嗯，更准确地说，在大括号内的代码块被执行了。注释行正如之前提到的不起任何作用；它只是为了清晰。另外两行代码分别向控制窗口输出某些文本并等待响应，尽管目前你不需要担心具体的机制。\n\
  \n注意如何实现上一章所示的代码大纲功能，尽管这是一个 Windows 应用程序，因为这是一个非常有用的功能。你可以使用 `#region` 和 `#endregion`\
  \ 关键字来实现这一点，它们定义了可以展开和折叠的代码区域的开始和结束。例如，你可以这样修改 `ConsoleApplication1` 生成的代码：\n\n\
  ```\n #region Using directives\n\nusing System;\n\nusing System.Collections.Generic;\n\
  \nusing System.Linq;\n\nusing System.Text;\n\nusing System.Threading.Tasks;\n\n\
  #endregion \n```\n\n这允许你将这些代码折叠为单行，并在以后想查看细节时再次展开。这里包含的 `using` 语句以及正下方的 `namespace`\
  \ 语句将在本章末尾进行解释。\n\n\n\n\n目前，先不要担心示例中的其他代码，因为前几个章节的目的是解释基础 C# 语法，因此应用程序执行到调用 `Console.WriteLine()`\
  \ 这一点的具体方法并不重要。稍后，这些额外代码的意义将会变得明确。\n\n## 变量 (VARIABLES)\n\n如前所述，变量涉及数据存储。从本质上，你可以将计算机内存中的变量想象成放在架子上的盒子。你可以把东西放在盒子里并再次取出，或者你也可以直接向盒子内部查看里面是否有任何东西。变量也是如此；你可以将数据放入其中，并根据需要将其取出或查看。\n\
  \n尽管计算机中的所有数据实际上都是同一种东西（一系列 0 和 1 的序列），但变量有不同的“风味”，被称为 `types`（类型）。再次使用盒子的类比，盒子的有不同的形状和大小，因此某些物品只能放入某些盒子里。这种类型系统背后的逻辑是，不同类型的数据可能需要不同的处理方法，通过将变量限制为单个类型，你可以避免混淆它们。例如，将组成数字图片的\
  \ 0 和 1 序列视为音频文件并没有太大意义。\n\n要使用变量，你必须对它们进行`declare`（声明）。这意味着你必须为它们分配一个 `name`（名称）和一个\
  \ `type`（类型）。声明变量后，你就可以将它们作为你声明要包含的数据类型的存储单元。\n\n用于声明变量的 C# 语法仅指定了类型和变量名：\n\n```\n\
  <type> <name>; \n```\n\n如果你尝试使用一个未声明的变量，你的代码将无法编译，但在这种情况下，编译器会准确告诉你问题所在，所以这并不是真的一个灾难性的错误。尝试在不给变量赋值的情况下使用变量也会导致错误，但同样，编译器会检测到。\n\
  \n## 简单类型 (Simple Types)\n\n简单类型包括数字和布尔（真或假）值等类型，它们构成了你应用程序的基础构建块。与复杂类型不同，简单类型不能拥有子项或属性。可用的简单类型大部分是数值，这初看起来似乎有点奇怪——难道你只需要一种类型来存储一个数字吗？\n\
  \n之所以有这么多数值类型，是因为在计算机内存中将数字存储为 0 和 1 序列的机制。对于整数值，你只需要取数量的 `bits`（可以是 0 或 1 的单个数字）并以二进制格式表示你的数字。存储\
  \ `N` 位的变量允许你表示 0 到 (2^N − 1) 之间的任何数字。超过此值的任何数字都太大，无法放入此变量。\n\n例如，假设你有一个可以存储两个位的变量。因此，整数与表示这些整数的位之间的映射如下：\n\
  \n```\n0 = 00\n1 = 01\n2 = 10\n3 = 11 \n```\n\n为了存储更多数字，你需要更多的位（例如，三位允许你存储从 0 到\
  \ 7 的数字）。\n\n该系统的不可避免的结果是，你需要无限数量位才能存储每一个想象中的数字，这无法放入你可靠的 PC 中。即使对于每个数字都有可用的位，将所有这些位用于一个例如只需要存储\
  \ 0 到 10 之间数字的变量也显然不是高效的（因为会浪费存储）。四位在这里足够了，允许你在相同的内存空间内存储该范围内的更多值。\n\n相反，可以使用不同的整数类型来存储不同范围的数字，它们占用不同数量的内存（多达\
  \ 64 位）。这些类型在 表 3-1 中所示。\n\n| TYPE | ALIAS FOR | ALLOWED VALUES |\n| --- | --- |\
  \ --- |\n| `sbyte` | `System.SByte` | −128 到 127 之间的整数 |\n| `byte` | `System.Byte`\
  \ | 0 到 255 之间的整数 |\n| `short` | `System.Int16` | −32768 到 32767 之间的整数 |\n| `ushort`\
  \ | `System.UInt16` | 0 到 65535 之间的整数 |\n| `int` | `System.Int32` | −2147483648\
  \ 到 2147483647 之间的整数 |\n| `uint` | `System.UInt32` | 0 到 4294967295 之间的整数 |\n| `long`\
  \ | `System.Int64` | −9223372036854775808 到 9223372036854775807 之间的整数 |\n| `ulong`\
  \ | `System.UInt64` | 0 到 18446744073709551615 之间的整数 |\n\n**表 3-1 ：整数类型**\n\n某些变量名前的\
