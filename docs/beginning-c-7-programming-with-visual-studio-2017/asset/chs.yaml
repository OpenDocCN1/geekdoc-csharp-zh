  \ |\n\n# 第五部分\n\n### 附加技术\n\n* 第 24 章：Windows Communication Foundation\n* 第 25 章：通用应用\n\
  \n# 24 Windows Communication Foundation\n\n## 什么是 WCF？\n\n`WCF` 是一项允许你创建服务的技术，你可以跨进程、机器和网络边界访问这些服务。你可以使用这些服务在多个应用程序之间共享功能、暴露数据源或抽象复杂的进程。\n\
  \n`WCF` 服务提供的功能封装为由服务暴露的单个方法。每个方法——或者在 WCF 术语中称为每个*操作*（operation）——都有一个用于与之交换数据的端点（endpoint）。这种数据交换由一个或多个协议定义，取决于你用于连接到服务的网络以及你的特定需求。\n\
  \n在 WCF 中，端点可以有多个*绑定*（bindings），每个绑定都指定了一种通信方式。绑定还可以指定额外信息，例如与端点通信必须满足哪些安全要求。例如，绑定可能要求用户名和密码验证或\
  \ Windows 用户帐户令牌。当你连接到端点时，该绑定所使用的协议可能会影响你使用的地址，正如你很快将看到的。\n\n一旦你连接到端点，就可以使用简单对象访问协议（`SOAP`）或表述状态转换（`REST`）消息与其进行通信。你使用的消息格式取决于你正在使用的操作以及向该操作发送（以及从其接收）消息所需的数据结构。WCF\
  \ 使用*合约*（contracts）来指定这一切。你可以通过与服务的元数据交换来发现合约。服务发现的一种常用格式是 Web 服务描述语言（`WSDL`），它最初用于\
  \ Web 服务，尽管 WCF 服务也可以通过其他方式进行描述。\n\n当你确定了想要使用的服务和端点，并且知道使用哪种绑定以及需要遵守哪些合约后，你就可以像访问本地定义的对象一样轻松与\
  \ WCF 服务通信。与 WCF 服务的通信可以是简单的单向事务、请求/响应消息，或可以从通信通道任一端发起的双工通信。你也可以根据需要使用消息负载优化技术，例如消息传输优化机制（`MTOM`）来封装数据。\n\
  \nWCF 服务本身可能运行在托管它的计算机上的多个不同进程之一。与始终运行在信息服务（`IIS`）中的 Web 服务不同，你可以选择适合你情况的主机。你可以使用\
  \ `IIS` 托管 WCF 服务，但也可以使用 Windows 服务或可执行文件。\n\nWCF 框架的设计允许你自定义在本节中读到的关于几乎所有内容。然而，这是一个高级主题，你在本章中将使用\
  \ .NET 4.7 提供的默认技术。\n\nWCF 概念\n\n本节将详细介绍 WCF 的以下方面：\n\n* WCF 通信协议\n* 地址、端点和绑定\n\
  * 合约\n* 消息模式\n* 行为\n* 托管\n\n### WCF 通信协议\n\n如所述，你可以通过多种传输协议与 WCF 服务进行通信。事实上，.NET\
  \ 4.7 框架定义了五种：\n\n* **HTTP** —允许从任何地方与 WCF 服务通信，包括跨互联网。你可以使用 `HTTP` 通信创建 WCF Web\
  \ 服务。\n\n\n\n\n\n*   **TCP** —如果你正确配置了防火墙，它可以允许你通过本地网络或跨互联网与 WCF 服务进行通信。`TCP` 比\
  \ `HTTP` 更高效且具有更多功能，但其配置可能更复杂。\n*   **UDP** —用户数据报协议与 `TCP` 类似，它们都允许通过本地网络或互联网进行通信，但其实现方式略有不同。这种实现方式的结果之一是服务可以同时向多个客户端广播消息。\n\
  *   **Named pipe**（命名管道）—允许你与与调用代码在同一台机器但位于独立进程中的 WCF 服务进行通信。\n*   **MSMQ** —微软消息队列是一种队列技术，它允许应用程序发送的消息通过队列路由到达目的地。`MSMQ`\
  \ 是一种可靠的消息传递技术，它能确保发送到队列的消息能够到达该队列。`MSMQ` 本身是异步的，因此只有当队列中排在前面的消息处理完毕并且有可用的处理服务时，队列中的消息才会被处理。\n\
  \n这些协议通常允许你建立安全连接。例如，你可以使用 `HTTPS` 协议在跨互联网上建立 TLS 连接。`TCP` 通过使用 Windows 安全框架为本地网络安全提供了广泛的可能性。`UDP`\
  \ 不支持安全性。\n\n为了连接到 WCF 服务，你必须知道它位于何处。在实践中，这意味着需要知道端点的地址。\n\n### 地址、端点和绑定\n\n你为服务选择的地址类型取决于你所使用的协议。服务地址按照本章中描述的三种协议（不涵盖\
  \ `MSMQ`）的格式格式化如下：\n\n*   **HTTP** —`HTTP` 协议的地址是熟悉的 `http://<server>:<port>/<service>`\
  \ 格式的 URL。对于 `TLS` 连接，你也可以使用 `https://<server>:<port>/<service>`。如果你在 `IIS` 中托管服务，`<service>`\
  \ 将是一个带有 `.svc` 扩展名的文件。`IIS` 地址可能比此示例包含更多的子目录——即在 `.svc` 文件之前有更多由 `/` 字符分隔的节。\n\
  *   **TCP** —`TCP` 的地址格式为 `net.tcp://<server>:<port>/<service>`。\n*   **UDP** —`UDP`\
  \ 的地址格式为 `soap.udp://<server>:<port>/<service>`。组播通信需要特定的 `<server>` 值，但这超出了本章的范围。\n\
  *   **Named pipe** —命名管道连接的地址类似，但没有端口号。它们的格式为 `net.pipe://<server>/<service>`。\n\
  \n服务的地址是一个基础地址，你可以使用它来创建表示操作的端点的地址。例如，你可能在 `net.tcp://<server>:<port>/<service>/operation1`\
  \ 有有一个操作。\n\n假设你创建了一个只有一个操作的 WCF 服务，该操作对此处列出的所有三种协议都有绑定。你可能会使用以下基础地址：\n\n```\nhttp://www.mydomain.com/services/amazingservices/mygreatservice.svc\n\
  net.tcp://myhugeserver:8080/mygreatservice\nnet.pipe://localhost/mygreatservice\
  \ \n```\n\n然后你可能对操作使用以下地址：\n\n```\nhttp://www.mydomain.com/services/amazingservices/mygreatservice.svc/greatop\n\
  net.tcp://myhugeserver:8080/mygreatservice/greatop\nnet.pipe://localhost/mygreatservice/greatop\
  \ \n```\n\n自 `.NET` 4 以来，已经可以使用操作的默认端点，而无需显式配置它们。这简化了配置，特别是在你想使用像前面示例这样的标准端点地址时。\n\
  \n如前所述，绑定指定的不仅是操作将要使用的传输协议。你还可以使用它们来指定通过传输协议进行通信的安全性要求、端点的事务能力、消息编码等许多内容。\n\n由于绑定提供了如此高度的灵活性，`.NET`\
  \ 框架提供了一些你可以使用的预定义绑定。你也可以将这些绑定作为起点，对它们进行微调，以获得你确切需要的绑定类型——在一定程度上是可以的。预定义绑定具有某些你必须遵守的能力。每种绑定类型由\
  \ `System.ServiceModel` 命名空间中的一个类表示。表 24-1 列出了最常用的绑定以及关于它们的一些基本信息。\n\n| **绑定** |\
  \ **描述** |\n| --- | --- |\n| `BasicHttpBinding` | 最简单的 `HTTP` 绑定，也是 Web 服务使用的默认绑定。它具有有限的安全能力且不支持事务。\
  \ |\n| `WSHttpBinding` | 更高级的 `HTTP` 绑定形式，能够使用 `WSE` 中引入的所有额外功能。 |\n| `WSDualHttpBinding`\
  \ | 扩展了 `WSHttpBinding` 功能，包含双向通信能力。通过双向通信，服务器除了普通的消息交换外，还可以与客户端发起通信。 |\n| `WSFederationHttpBinding`\
  \ | 扩展了 `WSHttpBinding` 功能，包含联邦能力。联邦允许第三方实现单点登录和其他专利安全措施。这是一个本章未涵盖的高级主题。 |\n| `NetTcpBinding`\
  \ | 用于 `TCP` 通信，并允许你配置安全、事务等。 |\n| `NetNamedPipeBinding` | 用于命名管道通信，并允许你配置安全、事务等。\
  \ |\n| `NetMsmqBinding` | 用于 `MSMQ`，本章未涵盖。 |\n| `NetPeerTcpBinding` | 用于点对点绑定，本章未涵盖。\
  \ |\n| `WebHttpBinding` | 用于使用 `HTTP` 请求而非 SOAP 消息的 Web 服务。 |\n| `UdpBinding` |\
  \ 允许绑定到 `UDP` 协议。 |\n\n表 24-1 绑定类型\n\n如前所述，许多绑定类具有你可以用于配置的相似属性。例如，它们具有你可以用于配置超时值的属性。你将在稍后查看代码时了解更多。\n\
  \n端点根据所使用的协议有默认绑定。这些默认值见表 24-2](#text00031.html_c24-tbl-0002)。\n\n| **协议** | **默认绑定**\
  \ |\n| --- | --- |\n| `HTTP` | `BasicHttpBinding` |\n| `TCP` | `NetTcpBinding` |\n\
  | `UDP` | `UdpBinding` |\n| `Named pipe` | `NetNamedPipeBinding` |\n\n表 24-2 NET\
  \ 默认绑定\n\n### 合约\n\n合约定义了 WCF 服务如何使用。可以定义几种类型的合约：\n\n*   **服务合约**—包含有关服务及其所暴露的操作的通用信息。这包括服务在定义\
  \ SOAP 消息架构时使用的命名空间，以避免与其他服务的可能冲突。 |\n*   **操作合约**—定义了操作如何使用。这包括操作方法的参数和返回类型，以及其他信息，例如方法是否将返回响应消息。\
  \ |\n*   **消息合约**—允许你自定义 SOAP 消息内部信息的格式——例如，数据是否应该包含在 SOAP 头部或 SOAP 消息正文中。这在创建必须与旧系统集成的\
  \ WCF 服务时非常有用。 |\n*   **故障合约**—定义了操作可以的故障。当你使用 .NET 客户端时，故障会导致异常，你可以以正常方式捕获并处理它们。\
  \ |\n\n\n\n\n\n**数据合约** —如果你将复杂类型（如用户定义的结构体和对象）作为操作的参数或返回类型，则必须为这些类型定义数据合约。数据合约根据类型通过属性暴露的数据来定义类型。\n\
  \n你通常通过使用特性（attributes）为服务类和方法添加合约，你将在本章稍后的部分看到。\n\n## 消息模式\n\n在上一节中，你已经看到操作合约可以定义操作是否返回结果。你还读到了关于通过\
  \ `WSDualHttpBinding` 绑定实现的双工通信。这些都是消息模式的形式，共分为三种类型：\n\n*   **请求/响应消息传递** —交换消息的“普通”方式，其中发送到服务的每条消息都会导致向客户端发回一个响应。这并不意味着客户端必须等待响应，因为你可以像往常那样异步地调用操作。\n\
  *   **单向（或半工）消息传递** —消息从客户端发送到 WCF 操作，但不会发送任何响应。\n*   **双向（或全工）消息传递** —一种更高级的方案，其中客户端实际上充当服务器也充当客户端，而服务器也充当客户端也充当服务器。一旦建立，双工消息传递允许客户端和服务器互相发送消息，且这些消息可能没有响应。\n\
  \n你将在本章稍后看到这些消息模式在实践中是如何使用的。\n\n## 行为\n\n行为是为服务和操作应用额外配置的一种。通过向服务添加行为，你可以控制它如何被托管进程实例化和使用、它如何参与事务、服务中如何处理多线程问题等。操作行为可以控制操作执行期间是否使用身份模拟（impersonation）、单个操作如何影响事务以及更多。\n\
  \n你可以在各个级别指定默认行为，这样就不需要为每个服务和操作指定每个行为的每个方面。相反，你可以提供默认值并在必要时覆盖设置，从而减少所需的配置量。\n\n\
  ## 托管\n\n在本章的介绍中，你学习了 WCF 服务可以托管在多个不同的环境中。你的选项如下：\n\n*   **Web 服务器** —IIS 托管的 WCF\
  \ 服务是 WCF 提供的最接近纯 Web 服务。然而，你可以在 WCF 服务中使用高级功能和安全特性，这些特性在 Web 服务中实现起来困难。你还可以与 IIS\
  \ 功能（如 IIS 安全）集成。\n*   **可执行文件** —你可以在 .NET 中创建的任何类型的应用程序中托管 WCF 服务，例如控制台应用程序、Windows\
  \ Forms 应用程序和 WPF 应用程序。\n*   **Windows 服务** —你可以在 Windows 服务中托管 WCF 服务，并利用 Windows\
  \ 服务提供的有用功能，例如自动启动和故障恢复。\n*   **Windows 激活服务 (WAS)** —WAS 专为托管 WCF 服务而设计，它基本上是 IIS\
  \ 的简单版本，可以在无法使用 IIS 的地方使用。\n\n上述列表中的两个选项（IIS 和 WAS）为 WCF 服务提供了有用的功能，如激活、进程回收和对象池化。如果你使用另外两个托管选项之一，则称\
  \ WCF 服务为 `self-hosted`（自托管）。你可能会为了测试目的偶尔自托管服务，但创建自托管的生产级服务可能有非常充分的理由。例如，你可能处于无法在运行服务的计算机上安装\
  \ Web 服务器的情况。如果服务运行在域控制器上，或者你组织的本地策略简单禁止运行 IIS，就会出现这种情况。在这种情况下，你可以将服务托管在 Windows\
  \ 服务中，效果完全一样。\n\n## WCF 编程\n\n现在你已经涵盖了所有基础知识，是时候开始编写代码了。在本节中，你将从查看一个简单的 Web 服务器托管\
  \ WCF 服务和一个控制台应用程序客户端开始。在查看创建的代码结构后，你将学习 WCF 服务和客户端应用程序的基本结构。然后，你将更详细地查看一些关键主题：\n\
  \n*   定义 WCF 服务合约\n*   自托管 WCF 服务\n\n在接下来的“尝试一下”（Try It Out）中，你将创建一个简单的 WCF 服务，它暴露两个方法，并创建一个用于这些方法的客户端。\n\
  \n### WCF 测试客户端\n\n在之前的“尝试一下”中，你同时创建了服务和客户端，以查看基本 WCF 架构是如何工作的以及如何实现 WCF 服务的配置。但在实践中，你想使用的客户端应用程序可能是复杂的，正确测试服务可能会很困难。\n\
  \n为了方便开发 WCF 服务，Visual Studio 提供了一个测试工具，你可以用来确保你的 WCF 操作正常运行。该工具会自动配置以与你的 WCF 服务项目配合，因此如果你运行项目，工具就会出现。你只需要确保要测试的服务（即\
  \ `.svc` 文件）被设置为 WCF 服务项目的启动页即可。\n\n该工具允许你调用服务操作并以其他方式检查服务。接下来的“尝试一下”说明了这一点。\n\n\
  ### 定义 WCF 服务合约\n\n之前的示例显示了 WCF 基础结构如何通过类、接口和特性的组合，方便你为 WCF 服务定义合约。本节将对这种技术进行更深入的探讨。\n\
  \n#### 数据合约\n\n要为服务定义数据合约，需要在类定义上应用 `DataContractAttribute` 特性。该特性位于 `System.Runtime.Serialization`\
  \ 命名空间。你可以使用 表 24-3 所示的属性来配置此特性。\n\n| 属性 | 描述 |\n| --- | --- |\n| `Name` | 使用与类定义不同的名称命名数据合约。该名称将用于\
  \ SOAP 消息和从服务定义的客户端数据对象。 |\n| `Namespace` | 定义数据合约在 SOAP 消息中使用的命名空间。 |\n| `IsReference`\
  \ | 影响对象的序列化。如果设置为 `true`，则如果被多次引用，只需序列化一次，这在某些情况下非常重要。默认值为 `false`。 |\n\n**表 24-3\
  \ : DataContractAttribute 属性**\n\n当你需要与现有的 SOAP 消息格式进行互操作时（与其他合约的类似命名的属性一样），Name\
  \ 和 Namespace 属性是有用的，但否则你可能不需要它们。\n\n数据合约的每个类成员必须使用 `DataMemberAttribute` 特性，该特性也位于\
  \ `System.Runtime.Serialization` 命名空间。表 24-4 列出了此特性的属性。\n\n| 属性 | 描述 |\n| --- |\
  \ --- |\n| `Name` | 指定序列化时数据成员的名称（默认值为成员名称）。 |\n| `IsRequired` | 指定成员是否在 SOAP 消息中必须存在。\
  \ |\n| `Order` | 指定序列化或反序列化成员顺序的整数值，如果一个成员必须在另一个成员之前存在，则可能是需要的。较小的 `Order` 成员先被处理。\
  \ |\n| `EmitDefaultValue` | 将此设置为 `false`，则如果成员的值是成员的默认值，则不会将其包含在 SOAP 消息中。 |\n\n\
  **表 24-4 : DataMemberAttribute 属性**\n\n\n\n\n服务合约通过在接口定义上应用 `System.ServiceModel.ServiceContractAttribute`\
  \ 属性来定义。你可以通过表 24-5 所示的属性来自定义服务合约。\n\n| 属性 | 描述 |\n| --- | --- |\n| `Name` | 指定在\
  \ WSDL 的 `<portType>` 元素中定义的服务合约名称。 |\n| `Namespace` | 定义 WSDL 中 `<portType>` 元素使用的服务合约命名空间。\
  \ |\n| `ConfigurationName` | 在配置文件中使用的服务合约名称。 |\n| `HasProtectionLevel` | 决定服务使用的消息是否具有显式定义的保护级别。保护级别允许你对消息进行签名，或同时进行签名和加密。\
  \ |\n| `ProtectionLevel` | 用于消息保护的保护级别。 |\n| `SessionMode` | 决定是否为消息启用会话（sessions）。如果你使用会话，就可以确保发送到服务不同端点的消息是相关联的——也就是说，它们使用同一个服务实例，因此可以共享状态等。\
  \ |\n| `CallbackContract` | 对于双工消息（duplex messaging），客户端像服务一样也暴露一个合约。这是因为，如前所述，双工通信中的客户端也充当服务器的角色。此属性允许你指定客户端使用的合约。\
  \ |\n\n**表 24-5：** ServiceContractAttribute 属性\n\n### 操作合约 (Operation Contracts)\n\
  \n在定义服务合约的接口内部，你通过应用 `System.ServiceModel.OperationContractAttribute` 属性将成员定义为操作。该属性具有表\
  \ 24-6 中描述的属性。\n\n| 属性 | 描述 |\n| --- | --- |\n| `Name` | 指定服务操作的名称。默认值是成员名称。 |\n\
  | `IsOneWay` | 指定操作是否返回响应复。如果你将其设置为 `true`，则客户端将不会等待操作完成就继续后续执行。 |\n| `AsyncPattern`\
  \ | 如果设置为 `true`，则操作被实现为两个方法，你可以使用这两个方法来异步调用操作：`Begin<methodName>()` 和 `End<methodName>()`。\
  \ |\n| `HasProtectionLevel` | 参见上一节。 |\n| `ProtectionLevel` | 参见上一节。 |\n| `IsInitiating`\
  \ | 如果使用了会话，则此属性决定调用此操作是否可以启动新会话。 |\n| `IsTerminating` | 如果使用了会话，则此属性决定调用此操作是否终止当前会话。\
  \ |\n| `Action` | 如果你使用寻址（WCF 服务的一种高级功能），则操作有一个关联的操作名称，你可以通过此属性指定它。 |\n| `ReplyAction`\
  \ | 与 `Action` 类似，但指定的是操作响应的名称。 |\n\n**表 24-6：** OperationContractAttribute 属性\n\
  \n### 消息合约 (Message Contracts)\n\n之前的示例没有使用消息合约规范。如果你使用这些规范，则通过定义一个表示消息的类，并在该类上应用\
  \ `MessageContractAttribute` 属性来实现。然后，你对该类的成员应用 `MessageBodyMemberAttribute`、`MessageHeaderAttribute`\
  \ 或 `MessageHeaderArrayAttribute` 属性。所有这些属性都在 `System.ServiceModel` 命名空间中。除非你需要对\
  \ WCF 服务使用的 SOAP 消息进行极高级的控制，否则你可能不想这样做，因此此处不提供细节。\n\n### 故障合约 (Fault Contracts)\n\
  \n如果你有一个特定的异常类型（例如自定义异常），并希望它对客户端应用程序可用，那么你可以在可能生成此异常的操作上应用 `System.ServiceModel.FaultContractAttribute`\
  \ 属性。\n\n### 自托管 WCF 服务 (Self-Hosted WCF Services)\n\n到本章为止，你已经看到了托管在 Web 服务器中的\
  \ WCF 服务。这使你能够跨越互联网进行通信，但对于局域网通信，这并不是最高效。首先，你需要在托管服务的计算机上准备一个 Web 服务器。此外，你应用程序的架构可能导致拥有一个独立的\
  \ WCF 服务并不是理想的。\n\n相反，你可能想要使用自托管 WCF 服务。自托管 WCF 服务存在于你创建的进程中，而不是特制的托管应用程序（如 Web\
  \ 服务器）的进程中。这意味着，例如，你可以使用控制台应用程序或 Windows 应用程序来托管你的服务。\n\n要自托管 WCF 服务，你使用 `System.ServiceModel.ServiceHost`\
  \ 类。你使用要托管的服务类型或服务类的实例来实例化此类。你可以通过属性或方法来配置服务主机，或者（这是最巧妙的部分）通过配置文件来配置。事实上，主机进程（如\
  \ Web 服务器）使用 `ServiceHost` 实例来执行托管。自托管的区别在于，你直接与该类交互。然而，你放在宿主机应用程序的 `app.config`\
  \ 文件`<system.serviceModel>` 部分的配置，使用的语法与你在本章中看到的配置部分完全相同。\n\n你可以通过你喜欢的任何协议暴露自托管服务，尽管在此类应用程序中，你通常会使用\
  \ TCP 或命名管道（named pipe）绑定。\n\n如果你想托管一个名为 `MyService` 的服务，可以使用如下代码创建 `ServiceHost`\
  \ 实例：\n\n```\nServiceHost host = new ServiceHost(typeof(MyService));\n```\n\n如果你想托管一个名为\
  \ `myServiceObject` 的 `MyService` 实例，可以使用如下代码创建 `ServiceHost`：\n\n```\nMyService\
  \ myServiceObject = new MyService();\nServiceHost host = new ServiceHost(myServiceObject);\n\
  ```\n\n在创建 `ServiceHost` 实例后，你可以通过属性配置服务及其端点。或者，如果你将配置放在 `.config` 文件中，`ServiceHost`\
  \ 将自动完成配置。\n\n在配置好 `ServiceHost` 实例后，使用 `ServiceHost.Open()` 方法开始托管服务。同样，通过 `ServiceHost.Close()`\
  \ 方法停止托管。当你首次托管绑定 TCP 服务时，如果启用了防火墙，可能会收到 Windows 防火墙的警告，因为它会阻止 TCP 端口。你需要开放 TCP\
  \ 端口以便服务开始监听。\n\n在下面的尝试中，你将使用自托管技术将 WPF 应用程序的一些功能通过 WCF 服务暴露。\n\n## 练习 (EXERCICES)\n\
  \n1. 24.1 下列哪些应用程序可以托管 WCF 服务？\n    1. Web 应用程序\n    2. Windows Forms 应用程序\n   \
  \ 3. Windows 服务\n    4. COM+ 应用程序\n    5. 控制台应用程序\n\n2. 24.2 如果你想与 WCF 服务交换类型为 `MyClass`\
  \ 的参数，你应该实现合约？需要哪些属性？\n\n3. 24.3 如果你在 Web 应用程序中托管 WCF 服务，基础端点将使用什么扩展名？\n\n4. 24.4\
  \ 当自托管 WCF 服务时，必须通过设置属性和调用 `ServiceHost` 类的方法来配置服务。对或错？\n\n5. 24.5 为服务合约 `IMusicPlayer`\
  \ 提供代码，其中定义了 `Play()`、`Stop()` 和 `GetTrackInformation()` 操作。在适当的地方使用单向方法。为了让该服务工作，你可能还需要定义哪些合约？\n\
  \n\n\n\n\n练习题可以在附录中找到。\n\n## 本章学习的知识\n\n| 主题 | 核心概念 |\n| --- | --- |\n| WCF 基础 |\
  \ WCF 为创建和与远程服务通信提供了一个框架。它结合了 Web 服务和远程架构的元素以及新新技术来实现这一目标。 |\n| 通信协议 | 你可以使用任何一种协议（包括\
  \ HTTP 和 TCP）与 WCF 服务进行通信。这意味着你可以使用位于客户端应用程序本地的服务，也可以使用跨越机器或网络边界的服务。要实现这一点，你需要通过与所需的协议和功能相应的绑定（binding）访问服务的特定端点。你可以通过行为（behaviors）来控制这些功能，例如使用会话状态或暴露元数据。.NET\
  \ 包含了许多默认设置，使得定义简单服务变得非常容易。 |\n| 通信负载 | 通常，对 WCF 服务的调用和响应被编码为 SOAP 消息。不过也有其他替代方案，例如纯\
  \ HTTP 消息，如果你需要，你也可以从开始定义自己的负载类型。 |\n| 托管 | WCF 服务可能托管在 IIS 或 Windows 服务中，也可以是自托管（self-hosted）。使用\
  \ IIS 等宿主机可以让你利用宿主机内置的功能，包括安全性和应用程序池。自托管更加灵活，但可能需要更多的配置和编码。 |\n| 合约 | 你通过契约（contracts）定义\
  \ WCF 服务与客户端代码之间的接口。服务本身及其公开的任何操作通过服务契约和操作契约定义。数据类型通过数据契约定义。通过消息契约（message contracts）和故障契约（fault\
  \ contracts）实现对通信的进一步定制。 |\n| 客户端应用程序 | 客户端应用程序通过代理类（proxy class）与 WCF 服务通信。代理类实现了服务的契约接口，对该接口操作方法的任何调用都会重定向到服务。你可以使用“添加服务引用”工具生成代理类，也可以通过通道工厂方法（channel\
  \ factory methods）以编程方式创建。为了使通信成功，客户端必须配置为与服务配置匹配。 |\n\n# 25 通用应用\n\n## 入门\n编写通用应用在开始之前需要完成几个初始步骤。在\
  \ Visual Studio 的上一个版本中，你需要获取 Windows 8 开发者许可，并且该许可需要经常续签。对于 Windows 10，开发时不再需要它，尽管你仍然需要一个商店账户来发布应用程序。在开发应用时，你只需将你的\
  \ Windows 10 设备注册用于开发。\n\n在开始编写 Windows 通用应用之前，你必须在设备上启用开发功能，除非已安装，否则你必须安装 Universal\
  \ Windows 应用开发工具。\n\n当你在 Visual Studio 中打开创建 Windows 通用应用的解决方案时，可能会弹出如图 25-1 所示的对话框提示启用开发者模式。看到此对话框时，点击链接“开发者设置”，选择“开发者模式”选项，然后对你正在选择安全性较低的的警告点击是。\n\
  \n![截图说明显示了在 Visual Studio 中通过创建 Windows 通用应用的对话框启用开发者模式的步骤。](img/Image00284.jpg)\n\
  \n图 25-1\n\n你可能没有安装 Universal Windows 应用开发工具。要安装，你必须重新运行 Visual Studio Installer。你可以从开始菜单并输入\
  \ `Visual Studio Installer` 来操作。当显示已安装列表时，点击“修改”，然后勾选“Windows 通用平台开发”选项，最后再次点击“修改”以安装所选选项。\n\
  \n## Windows 通用应用\n传统应用程序（如你在书中之前编写的 WPF 桌面游戏）针对单一设备类型，如 PC。随着通用 Windows 平台（UWP）的引入，微软使得编写能够在多个设备上运行的单一应用成为可能，并付出了大量精力使此类应用的开发对开发者来说成为一种愉快的体验。\n\
  \n开发在大量异构设备上运行的应用的主要挑战在于，你无法预知屏幕有多大，或者用户将如何与设备交互。如果你简单地将书中之前的 Karli Card WPF 应用压缩到平板电脑屏幕尺寸，它看起来会非常糟糕。另一个方面是平板电脑用户希望你的应用能够调整屏幕方向。在本章中，我们将引入响应式\
  \ UI 和适应触发器的概念来解决这些问题。\n\n通用应用通过 Windows Store 部署，这为应用程序带来了了自己的挑战。为了让你的应用进入商店，你必须经过相当严格的测试过程并通过微软设置的多项要求。在本章的最后部分，我们将检查这一过程，以便你准备好发布自己的应用。\n\
  \n## 应用程序概念与设计\n应用程序在平板电脑和 Windows 桌面上的显示方式存在巨大差异。自 Windows 95 引入以来，运行在 Windows\
  \ 桌面上的应用程序设计很大程度上没有变化，尽管有了更好的图形。其设计特点具有一个带有标题栏的窗口，右上三个用于最大化、最小化和关闭应用程序的按钮，以及显示内容的按钮、单选按钮、复选框等。随\
  \ Windows 8 引入的应用生成方式略有不同。它们设计为用于触摸而非鼠标和键盘，可能具有也可能没有标题栏，并且可以旋转以适应其所在设备的方向，这仅举例。\n\
  \n微软为 UWP 应用发布了一份相当详尽的设计指南，你应该关注这份指南，即使你不必时刻遵守它。尽管应用将运行在多样化的设备上，但它们有一些你应该注意的共同特征，让我们来看看其中一些特征，并比较\
  \ Windows Store 应用与桌面应用程序的匹配情况。\n\n### 屏幕方向\n所有 Windows 应用程序都应该能够优雅调整大小。特别重要的一个方面是，手持设备可以在三维空间移动。你的用户期望你的应用随屏幕方向而移动。因此，如果用户翻转平板电脑，你的应用应该跟随移动。\n\
  \n### 菜单和工具栏\n经典的桌面应用使用菜单和工具栏在视图之间进行导航。通用应用也可以这样做，但它们更有可能使用工具栏而不是菜单。桌面应用通常一直显示菜单和工具栏的视觉组件，但通用应用通常会选择不这样做，以在较小的屏幕上节省宝贵的空间。\n\
  \n与其强迫用户通过菜单查看你应用程序的复杂性，应用样式会向用户展示应用程序，他们可以在需要时激活菜单。当菜单显示时，它应该是简单的，只包含主要选项。在何处以及何时显示菜单由你决定。\n\
  \n### 磁贴和徽标\n\n\n\n\nWindows 使用称为 `live tiles`（实时磁贴）的功能在开始菜单和页面显示应用程序。名称中的“实时”二字源于磁贴可以根据应用程序的当前内容或状态发生变化。例如，你将看到照片应用在开始菜单上轮播你的照片、邮件客户端显示未读邮件数量、游戏显示上次保存的截图等。这种可能性几乎是无尽的。\n\
  \n对于你的应用程序来说，提供一个良好的磁贴比为桌面应用程序提供一个良好的图标更重要，尽管后者也非常重要。磁贴嵌入在应用程序的清单（manifest）中，正如你将在在本章稍后部分看到的，使用\
  \ `Visual Studio` 可以很容易地包含它们。\n\n`badge`（徽章）是磁贴的小尺寸版本，Windows 可以在锁定屏幕和其他情况下使用它。除非你的应用会在锁定屏幕上显示通知，否则你不需要为应用提供徽章。\n\
  \n## 应用生命周期\n\n经典的 Windows 桌面应用程序可以通过点击标题栏右上角的按钮来关闭，但通用应用（Universal apps）通常不显示标题栏，那么你该如何关闭它们呢？通常情况下，你不需要关闭应用程序。每当通用应用失去焦点时，它就会被挂起并完全停止使用处理器资源。这使得许多应用程序看起来是在同时运行，而实际上它们只是处于挂起状态。一旦应用程序失去焦点，Windows\
  \ 就会自动进行挂起。作为用户，这并不是你察察觉的事情，但作为应用开发者，这是一个必须知道并处理的重要事实。\n\n## 锁定屏幕应用\n\n某些应用程序在失去焦点时应该保持运行。这类应用的示例包括\
  \ GPS 导航和音频流媒体应用。用户期望这些类型的应用程序在他们开始开车或开始使用其他应用时也能继续运行。如果你的应用程序需要在后台持续运行，你必须将其声明为锁定屏幕应用，并提供在锁定屏幕上显示通知的信息。\n\
  \n## 应用开发\n\n当你开始开发 Windows 通用应用时，在编程和 UI 语言方面你有许多选择。本书使用了 `C#` 和 `XAML`，但其他可能性包括使用\
  \ `JavaScript` 和 `HTML5`、`C++` 和 `DirectX` 或 `Visual Basic` 和 `XAML`。\n\n用于创建通用应用用户界面的\
  \ `XAML` 与 `WPF` 使用的 `XAML` 不完全相同，但它们足够接近，你应该能够舒服地使用它。你熟悉的许多控件在通用应用中也存在，尽管它们的外观往往与\
  \ Windows 桌面版本略有不同。还有许多针对触控优化的控件。\n\n### 自适应显示\n\n自适应显示是指能够响应用户操作而变化的显示器，例如平板电脑侧向放置或窗口大小变化。你的应用程序应该能够在用户将平板电脑侧向放置时，优雅地从竖屏模式切换到横屏模式，并在所有设备上运行良好且显示正常。\n\
  \n当你创建一个新的 Windows 通用应用项目时，首先注意到的是设计器中显示的页面看起来相当小。这是因为该项目默认使用针对 13.5 英 ` `Surface\
  \ Book` 显示器优化的视图。你可以使用图 25-2 所示的 `Device Preview` 面板对其进行更改。你还可以使用此面板将布局从竖屏更改为横屏。\n\
  \n![显示 Device Preview 面板布局的截图说明。](img/Image00285.jpg)\n\n图 25-2\n\n表现良好的应用程序能够在\
  \ `Device Preview` 面板所示的许多（如果不是所有）形式良好的良好地显示自己。考虑到列表中的范围从 4 英的物联网（IoT）设备到 84 英寸的\
  \ `Surface Hub`，这是一项艰巨的任务。幸运的是，`Visual Studio` 和 `UWP` 框架将为你提供帮助。当你从下拉列表中更改分辨率（或屏幕尺寸）时，`Visual\
  \ Studio` 会调整你的应用程序大小，你将立即看到页面的样子。此外，工具箱中还包含了帮助为应用程序创建自适应设计的控件，你可以利用它们轻松创建出能够良好转换的\
  \ UI。\n\n#### 相对面板 (Relative Panel)\n\n在第 14 章和第 15 章中，你使用了 `Grid` 和 `StackPanel`\
  \ 控件创建一个在静态显示上运行良好的 UI。但在必须针对许多显示尺寸的世界里，你需要一种能够更好地为你移动控件的东西。这就是 `RelativePanel`\
  \ 控件的作用。\n\n相对面板允许你指定控件之间的相对位置。正如你预期的，你可以将控件放置在其他控件的左侧、右侧、上方或下方，还可以进行一些很棒的小技巧。可以将一个控件相对于另一个控件的左侧、右侧或中心（无论是水平还是垂直方向），并将控件的边缘与面板的边缘对齐。这意味着不再需要通过调整像素来让两个控件在显示器上完美对齐了。\n\
  \n#### 自适应触发器 (Adaptive Triggers)\n\n自适应触发器是 `Visual State Manager`（视觉状态管理器）的新特性。使用这些触发器，你可以根据显示器的大小更改应用程序的布局。与相对面板结合时，这是一个非常强大的功能，它以非常直接的方式让你构建\
  \ Web 世界所说的响应式 UI，而微软将其称为自适应显示。在下一个尝试练习中，你将使用 `RelativePanel` 创建一个随变化的显示。\n\n####\
  \ FlipView\n\n`FlipView` 是一种在手持设备上运行良好的的小控件。它允许用户左右滑动来显示内容。它通常用于一次显示一张图像，并允许用户使用滑动手在图像之间移动。\n\
  \n默认情况下，`FlipView` 允许用户左右滑动来移动内容，但可以更改为上下移动。使用鼠标时，滚动按钮同样有效。下一个尝试练习将演示如何使用 `FlipView`\
  \ 显示本地设备上 `Pictures` 文件夹的内容。\n\n### 沙箱应用 (Sandboxed Apps)\n\n在此处，值得后退一步查看 Windows\
  \ 通用平台 .NET 框架的一些局限性。在移动设备上运行的应用程序对其运行的操作系统访问有限，这意味着某些类型的应用程序是你无法编写的。例如，如果你需要直接访问文件系统来访问\
  \ Windows 系统文件，你必须编写经典的桌面应用程序。\n\n当你使用 `C#` 编写通用应用时，你会发现限制因素在于应用程序引用的 .NET 框架，其中常见的命名空间和类完全缺失，或者可用方法比以前少。如果你打开\
  \ `Visual Studio`，创建一个新的空白应用，然后展开 `References`（引用）节点，你会发现引用与 Windows 桌面应用程序非常不同。有一个\
  \ `analyzers`（分析器）的引用，它们用于帮助监控应用程序的各个方面：对 `.NET Core for UWP` 的引用，以及对 `Universal\
  \ Windows` 的引用。\n\n\n\nWindows 通用应用（Universal apps）的沙箱机制，以及它们在进入 Windows Store 之前必须经过的过程，意味着用户很少需要担心通过商店下载恶意应用。显然，确实有人会尝试绕过这一点，用户绝不应该掉以警惕；然而，通过\
  \ Windows Store 应用在 Windows 计算机上放置恶意程序，比通过普通的下载和安装要困难得多。\n\n## 磁盘访问\n\n桌面应用程序几乎可以随心所欲访问磁盘，但也有少数例外。其中一个例外是，它们通常被禁止写入\
  \ `Program Files` 文件夹和其他系统文件夹。Windows 通用应用只能直接访问磁盘上的几个非常特定的位置。这些位置包括安装应用所在的文件夹、与应用相关的\
  \ `AppData` 文件夹，以及如 `Documents` 文件夹等特殊文件夹。在 .NET Core Framework 中，对文件和文件夹的访问也发生了移动，以确保开发者不会意外写入受限的位置。\n\
  \n为了让用户控制文件的存储和读取位置，Windows 为你提供了三个文件选择器（File Picker）合约：`FolderOpenPicker`、`FileOpenPicker`\
  \ 和 `FileSavePicker`。你可以从你的程序中使用这些选择器类来获取对本地磁盘的安全访问。\n\n正如你之前看到的，你还可以使用 `KnownFolders`\
  \ 类来访问设备上的资源。当你想要读取或写入用户必须授予应用访问权限才能打开的位置时，你应该使用 `KnownFolders` 类。\n\n## 序列化、流与异步编程\n\
  \n在第 14 章中，你使用了 `[Serializable]` 属性允许类被序列化。UWP 的 .NET Core 不包含此属性，但你可以使用名为 `[DataContract]`\
  \ 的类似属性。`DataContract` 属性配合 `DataContractSerializer` 类使用来序列化类的内容。为了将序列化内容写入或读取磁盘，你需要使用某些文件访问类型，但与普通的\
  \ .NET 不同，你不能直接创建它们。相反，你使用文件选择器创建流对象，然后可以使用这些对象配合 `DataContractSerializer` 来保存和加载文件。\n\
  \n下一个“尝试一下”（Try It Out）演示了如何使用 `FileOpenPicker` 和 `FileSavePicker` 创建的流配合 `DataContractSerializer`，来加载和保存数据模型的\
  \ XML 表示。\n\n## 页面间的导航\n\n在应用内页面之间的导航与 Web 应用程序的导航方式类似。你可以调用 `Navigate` 方法从一个页面跳转到另一个页面；可以通过调用\
  \ `Back` 方法返回。接下来的“尝试一下”演示了如何使用三个基础页面在应用页面之间进行移动。\n\n## CommandBar 控件\n\n`CommandBar`\
  \ 为用户提供了与桌面应用程序中工具栏相似的功能，但你应该让它们简单得多，通常将一个栏目中的可用选项限制在八项更少。\n\n你可以同时显示多个 `CommandBar`，但请记住这会让用户界面变得杂乱，你不应该仅仅为了显示更多选项而显示多个栏。另一方面，如果你想提供多种类型的导航，同时显示顶部和底部的栏有时是有益的。\n\
  \nVisual Studio 附带了 `CommandBar` 控件，这使得创建这种控件变得非常容易。接下来的“尝试一下”创建了一个带有若干标准项目的应用栏（App\
  \ Bar）。\n\n## 状态管理\n\n与桌面应用程序不同，应用必须预期随时可能被挂起。这发生在用户切换到另一个应用或回到桌面时，这是所有应用都必须处理的常见场景。当应用被挂起时，Windows\
  \ 将保存你的变量和数据结构的值，并在应用恢复时恢复它们。然而，你的应用可能被挂起长时间，所以如果你有随时间变化的数据（例如新闻馈），那么你应该在应用恢复时刷新这些数据。\n\
  \n当应用被挂起时，你还应该考虑保存任何在应用调用之间需要持久化的数据，因为如果应用随后被 Windows 或用户终止，你将没有机会这样做。\n\n当你的应用即将被挂起时，系统会发送\
  \ `Suspending` 事件，你应该处理该事件。当应用重新恢复运行时，它将接收一个 `Resuming` 事件。通过处理这两个事件并保存应用状态，你可以让应用恢复到挂起前的状态，用户不会察觉到任何异常。\n\
  \n## Windows Store 应用的通用元素\n\n所有 Windows Store 应用都应该提供它们自己的磁贴（Tiles）和徽章（Badges）。磁贴让你的应用在\
  \ Windows 的开始屏幕上呈现出来，并允许你显示有关应用的信息。徽章允许 Windows 在锁定界面上显示一个代表你应用的小图标。\n\n磁贴非常重要，因为用户往往是反复无常的，倾向于根据应用展示自己的程度来做决定。此外，磁贴应该是易于识别的；如果你让用户在一堆磁贴中寻找一个消失在其他磁贴中的磁贴，等他们最终找到时，心情可能已经不好了。\n\
  \nWindows Store 应用中有许多可能的磁贴尺寸，如果你的应用针对许多不同的显示尺寸，你应该为所有建议的尺寸提供定制的磁贴，或者至少提供缩放良好的磁贴。如果你不提供正确尺寸的磁贴，Windows\
  \ 将把你提供的的内容缩放到到正确尺寸，这通常看起来很糟糕。因此，对于专业应用，请确保为每种预期的磁贴尺寸定制磁贴。\n\n徽章比磁贴小（24 × 24 像素），用于\
  \ Windows 在锁定界面上显示应用。如果你为应用设置了徽章图像，还必须开启锁定界面通知。徽章也可以缩放，因此请提供所有尺寸。\n\n启动屏幕在应用加载时显示；由于这通常只需要几秒钟，它们不应该太复杂，也不向用户提供任何信息，除了标识哪个应用正在启动。启动屏幕至少为\
  \ 620 × 300 像素，但你可以通过使图像透明来使其变小。再次，应该提供缩放版本。\n\n最后，你应该提供一个恰为 50 × 50 像素的“包图标”（Package\
  \ Logo），当然还有它的缩放版本，它将在 Windows Store 中显示。\n\n磁贴、徽章和图标嵌入在应用的包文件中，可以在 Visual Studio\
  \ 的清单包编辑器中轻松编辑。如果你下载了本书的代码，可以使用代码中提供的磁贴和徽章（在 `Assets` 文件夹中），否则你可以在画图或类似的应用程序中快速创建图像。在接下来的“尝试一下”中，你为\
  \ Windows 通用应用添加磁贴、图标和启动屏幕图像。\n\n## WINDOW STORE\n\n创建应用后，你可能想发布给公众，方法是使用 Windows\
  \ Store。\n\n### 打包应用\n\n当你指定图片查看器需要访问图片库以及为应用添加磁贴时，你已经见过 `package.appxmanifest`\
  \ 文件的某些内容。当你准备好为应用商店打包应用时，你必须返回此文件并设置许多其他值。\n\n\n\n\n在打包应用之前，你应该检查六个标签页中的每一个来配置\
  \ `package.appxmanifest` 并考虑你拥有的每一个选项：\n\n- **应用程序 (Application):** 给你的应用起个好名字！除了商店图标外，这可能是潜在用户看到你应用的最早内容，因此起一个通用的名称是没有效果的。尝试选择一个有趣的且指示应用用途名称。\n\
  - **视觉资产 (Visual Assets):** 在上一个示例中，你为应用添加了磁片。你应该确保 `Visual Assets` 标签页上的每个类别至少有一张图像。\n\
  - **功能 (Capabilities):** 在此标签页上，你可以指定应用所需的各项功能。注意，如果你的应用需要看起来不合理的功能，用户将用怀疑眼光看待它。例如，如果你需要访问设备上的聊天消息，最好有一个正当理由；否则这可能被视为违反隐私。大多数应用不应超过几个功能，但你必须选择所有你用到的功能。如果你没有准确指定你的需求，应用在尝试访问资源时将收到拒绝访问的异常。\n\
  - **声明 (Declarations):** 在 `Declarations` 标签页上，你可以将应用注册为服务的提供者。例如，如果你的应用作为搜索提供者工作，你可以将此声明添加到应用并指定所需的属性。\n\
  - **内容 URI (Content URIs):** 如果你的应用导航到远程页面，它对系统的访问将受到限制。你可以使用 `Content URIs` 让网页访问设备位置和剪贴板。\n\
  - **打包 (Packaging):** 在此标签页上，你可以设置包的属性，包括开发者/发布者名称、应用版本以及用于对包签名的证书。\n\n### 创建包\n\
  \n一旦你在 `appxmanifest` 中指定了所有需要的内容，就可以准备打包你的应用了。你可以直接在 Visual Studio 中通过“创建应用包 (Create\
  \ App Packages)”向导来完成。在向导的几步之后，你将被要求登录商店账户。如果你没有，就必须创建一个。你必须拥有商店账户才能发布到应用商店并获得你的应用付费。在向导的某个点，你将看到“选择并配置包\
  \ (Select and Configure Packages)”页面。在这里，重要的是选择所有三个目标架构（x86、x64 和 ARM），以便允许应用部署到最广泛的设备上。在最后一页，你将获得有关如何验证应用已准备好提交到“启动应用认证套件”的的选项。如果检测到任何问题，你必须修复它们并重新运行“创建应用包”向导。如果你的应用通过了检查，就可以上传它。\n\
