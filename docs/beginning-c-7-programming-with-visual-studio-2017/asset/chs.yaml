  \      // 游戏结束，记录胜利玩家。\n         return currentPlayer;\n      } \n```\n\n图 13-8\
  \ 显示了正在进行的游戏。\n\n![显示正在进行游戏的截图说明。](img/Image00159.jpg)\n\n**图 13-8**\n\n作为最后一个练习，仔细观察\
  \ `Player.HasWon()` 中的代码。你能想到一种方法可以让这段代码更高效吗，也许不需要在每次调用此方法时都检查玩家手牌中的每张牌？\n\n## 特性（Attributes）\n\
  \n本节简要介绍为消耗创建的类型的代码提供额外信息的有用方法：特性（attributes）。特性允许你用信息标记代码段，这些信息可以从外部读取，并以多种方式使用来影响类型的使用。这通常被称为装饰代码。你可以在本章节的\
  \ `CustomAttributes\\Program.cs` 中找到该部分的代码。\n\n例如，假设你创建一个类有一个非常简单的方法。实际上，它简单到你对逐单调试它并不感兴趣。不幸的是——而且让你非常困恼——在调试代码时你一直在这样做。在这种情况下，可以给该方法添加一个特性，告诉\
  \ Visual Studio 在调试时不要进入该代码；相反，Visual Studio 应该跳过它并进入下一个语句。代码如下：\n\n```csharp\n\
  \ [DebuggerStepThrough]\n\npublic void DullMethod() { … }\n```\n\n\n\n\n当你以这种方式添加属性时，编译器会创建属性类的实例并将其与类方法相关联。某些属性可以通过构造函数参数或属性进行自定义，在添加属性时可以指定这些内容，例如：\n\
  \n```cpp\n [DoesInterestingThings(1000, WhatDoesItDo = \"voodoo\")]\n\npublic class\
  \ DecoratedClass {} \n```\n\n此属性向 `DoesInterestingThingsAttribute` 的构造函数传递了值为 `1000`\
  \ 的值，并将一个名为 `WhatDoesItDo` 的属性值设置为字符串 `\"voodoo\"`。\n\n## 读取属性\n\n为了读取属性值，你必须使用一种名为\
  \ `reflection`（反射）的技术。这是一种相当高级的技术，它允许你在运行时动态地检查类型信息，甚至可以在不知道这些对象具体是什么的情况下创建对象并调用方法。本书将不会详细介绍这项技术，但为了使用属性，你确实需要了解一些基础知识。有关此项技术的更多信息，请访问\
  \ [`https://docs.microsoft.com/en‐us/dotnet/framework/reflection‐and‐codedom/reflection`](https://docs.microsoft.com/en-us/dotnet/framework/reflection-and-codedom/reflection)。\n\
  \n本质上，反射涉及使用存储在 `Type` 对象中的信息（你已经在本书的多个地方见过它们）以及 `System.Reflection` 命名空间中的类型来处理类型信息。你已经学会了如何使用\
  \ `typeof` 操作符从类获取类型信息，以及使用 `GetType()` 方法从对象实例获取类型信息。通过反射，你可以继续从 `Type` 对象中查询成员信息。然后你可以从类或其各种成员中获取属性信息。\n\
  \n执行此操作最简单的方法——也是你在书中会看到的唯一方法——是使用 `Type.GetCustomAttributes()` 方法。该方法最多接受两个参数，并返回一个\
  \ `object` 实例数组，每个实例都是一个属性实例。首先，你可以可选地传递你感兴趣的属性类型或多个类型（任何其他属性都将被忽略）。如果你省略了此参数，则将返回所有属性。其次，你必须传递一个布尔值，指示是只查看类本身，还是查看该类及其派生的所有基类。\n\
  \n例如，以下代码将列出名为 `DecoratedClass` 的类的属性：\n\n```cpp\n Type classType = typeof(DecoratedClass);\n\
  \nobject[] customAttributes = classType.GetCustomAttributes(true);\n\nforeach (object\
  \ customAttribute in customAttributes)\n\n{\n\n   WriteLine($\"Attribute of type\
  \ {customAttribute} found.\");\n\n} \n```\n\n一旦你通过这种方式找到了属性，就可以对该属性执行任何适当的操作。这正是\
  \ Visual Studio 在遇到之前讨论的 `DebuggerStepThroughAttribute` 属性时所做的。\n\n## 创建属性\n\n你可以简单通过派自\
  \ `System.Attribute` 类来创建自己的属性。有时，你不需要做其他任何操作，因为如果代码只关心属性的存在与否，就不需要额外信息。然而，如果你希望属性是可自定义的，可以提供非默认构造函数和/或可写属性。\n\
  \n你还需要对你的属性决定两件事：它可以被应用于什么种类型的目标（类、属性等），以及它是否可以多次应用于同一个目标。你通过一个应用到你属性上的属性来指定这些信息（这具有某种“禅意”的正确感！），称为\
  \ `AttributeUsageAttribute`。该属性有一个类型为 `AttributeTargets` 的构造函数参数，这是一个枚举，允许你使用 `|`\
  \ 运算符组合其值。它还存在名为 `AllowMultiple` 的布尔属性，用于指定该属性是否可以多次应用。\n\n例如，以下代码指定了一个可以（一次）应用于类或属性的属性：\n\
  \n```cpp\n [AttributeUsage(AttributeTargets.Class | AttributeTargets.Method,\n\n\
  \                AllowMultiple = false)]\n\nclass DoesInterestingThingsAttribute\
  \ : Attribute\n\n{\n\n   public DoesInterestingThingsAttribute(int howManyTimes)\n\
  \n   {\n\n      HowManyTimes = howManyTimes;\n\n   }\n\n   public string WhatDoesItDo\
  \ { get; set; }\n\n   public int HowManyTimes { get; private set; }\n\n} \n```\n\
  \n这个属性 `DoesInterestingThingsAttribute` 可以像在早前的代码段中那样：\n\n```cpp\n [DoesInterestingThings(1000,\
  \ WhatDoesItDo = \"voodoo\")]\n\npublic class DecoratedClass {} \n```\n\n并且通过修改上一节中的代码，你可以访问该属性的属性值：\n\
  \n```cpp\n Type classType = typeof(DecoratedClass);\n\nobject[] customAttributes\
  \ = classType.GetCustomAttributes(true);\n\nforeach (object customAttribute in customAttributes)\n\
  \n{\n\n   WriteLine($\"Attribute of type {customAttribute} found.\");\n\n   DoesInterestingThingsAttribute\
  \ interestingAttribute =\n\n      customAttribute as DoesInterestingThingsAttribute;\n\
  \n   if (interestingAttribute != null)\n\n   {\n\n      WriteLine($\"This class\
  \ does {interestingAttribute.WhatDoesItDo} x \" +\n\n                $\" {interestingAttribute.HowManyTimes}!\"\
  );\n\n   }\n\n} \n```\n\n将本节的所有内容结合起来并使用此代码，将得到图 13-9 所示的结果。\n\n![显示使用代码 AttributeUsage(AttributeTargets.Class)\
  \ 结果的插图](img/Image00160.jpg)\n\n图 13-9 属性非常有用，并且遍布于 .NET 应用——特别是 WPF 和 Universal\
  \ 应用。你将在本书的剩余部分遇到它们。\n\n## 初始化器\n\n到为止，你已经学会了各种方式实例化和初始化对象。这通常要求你在类定义中添加代码以启用初始化，或者通过单独的语句进行初始化。你还学会了如何创建各种类型的集合类，包括泛型集合类。同样，你可能注意到没有简单的方法可以将创建集合与向集合添加项结合起来。对象初始化器提供了一种通过结合实例化和初始化来简化代码的方法。集合初始化器为你提供了一种简单、优雅的语法来到位创建并填充集合。本节将解释如何使用这两个功能。\n\
  \n### 对象初始化器\n\n考虑以下简单的类定义：\n\n```cpp\n public class Animal\n\n{\n\n   public string\
  \ Name { get; set; }\n\n   public int Age { get; set; }\n\n   public double Weight\
  \ { get; set; }\n\n} \n```\n\n该类具有使用第 10 章所示自动属性语法定义的三个属性。如果你想实例化并初始化该类的对象实例，必须执行多个语句：\n\
  \n```cpp\n Animal animal = new Animal();\n\nanimal. Name = \"Benjamin\";\n\nanimal.\
  \ Age = 42;\n\nanimal. Weight = 185.4;\n```\n\n此代码使用了 C# 编译器在类定义中未包含构造函数的情况下提供的默认参数构造函数。为了简化这种初始化，你可以提供相应的非默认构造函数：\n\
  \n```cpp\n public class Animal\n\n{\n\n   public Animal(string name, int age, double\
  \ weight)\n\n   {\n\n       Name = name;\n\n       Age = age;\n\n       Weight =\
  \ weight;\n\n   }\n\n   …\n\n} \n```\n\n这使得你能够编写结合实例化与初始化的代码：\n\n```cpp\n Animal\
  \  animal = new Animal(\"Noa\", 5, 45.2); \n```\n\n\n\n这种方法可以运行，尽管它强制要求使用该类的代码使用此构造函数，这会导致之前使用无参数构造函数的代码无法运行。在很多情况下，特别是当类必须是可序列化的，有必要提供一个无参数构造函数：\n\
  \n```\npublic class Animal\n{\n   public Animal() {}\n   …\n} \n```\n\n现在你处于一种可以以你喜欢的方式实例化并初始化\
  \ `Animal` 类的情况下。然而，你在初始类定义中添加了几行代码，这些代码除了为这种灵活性提供基础结构支持外，并没有做什么什么。\n\n引入`对象初始化器`（object\
  \ initializers），这是一种无需向类中添加代码（例如此处介绍的构造函数）即可实例化和初始化对象的方法。当你实例化对象时，可以使用名称/值对对你想要初始化的每个公共访问的属性或字段提供值。其语法如下：\n\
  \n```\n<\nClassName\n> <\nvariableName\n> = new <\nClassName\n>\n{\n   <\npropertyOrField1\n\
  > = <\nvalue1\n>,\n\n\n   <\npropertyOrField2\n> = <\nvalue2\n>,\n\n   …\n\n   <\n\
  propertyOrFieldN\n> = <\nvalueN\n>\n}; \n```\n\n例如，你可以如下重写之前显示的代码（该代码实例化并初始化了一个\
  \ `Animal` 类型的对象）：\n\n```\nAnimal animal = new Animal\n{\n    Name = \"Lea\",\n\
  \   Age = 11,\n   Weight = 30.2\n}; \n```\n\n通常你可以将这样的代码放在单行中，而不会严重降低可读性。\n\n当你使用对象初始化器时，不需要显式地调用类的构造函数。如果你省略了构造函数的括号（如之前的代码所示），会自动调用默认无参数构造函数。这发生在初始化器设置任何参数值之前，允许你根据需要为默认构造函数中的参数提供默认值。或者，你可以调用特定的构造函数。同样，此构造函数首先被调用，因此在构造函数中进行的任何公共属性初始化可能会被你在初始化器中提供的值所覆盖。你必须能够访问所使用的构造函数（如果没有显式指定，则使用默认的），对象初始化器才能工作。\n\
  \n如果你想要用对象初始化器初始化的属性之一比示例中使用的简单类型更复杂，那么你可能会发现自己在使用`嵌套对象初始化器`。这简单意味着使用你已经看到的相同语法：\n\
  \n```\nAnimal animal = new Animal\n{\n    Name = \"Rual\",\n    Age = \"76\",\n\
  \    Weight = 172.7,\n   Origin = new Farm\n   {\n      Name = \"Circle Perk Ranch\"\
  ,\n      Location = \"Ann Road\",\n      Rating = 15\n   }\n}; \n```\n\n在这里，初始化了一个类型为\
  \ `Farm`（此处未显示）的属性 `Origin`。代码对 `Origin` 属性的三个属性——`Name`、`Location` 和 `Rating`分别使用了\
  \ `string`、`string` 和 `int` 类型的值。这种初始化使用了嵌套对象初始化器。\n\n注意，对象初始化器并不是非默认构造函数的替代品。实例化对象时可以使用对象初始化器设置属性和字段值，并不意味着你总是知道需要初始化什么状态。通过构造函数，你可以精确指定对象运行所需的哪些值，然后立即执行响应于这些值的代码。\n\
  \n此外，在之前的示例中，使用嵌套对象初始化器和使用构造函数之间还有另一个（虽然相当微妙）的区别。这种区别在于对象创建的顺序。使用嵌套初始化器时，顶层对象（`Animal`）首先创建。接下来，创建嵌套对象（`Farm`）并将其赋值给属性\
  \ `Origin`。如果你使用构造函数，将反转这种构造顺序并将 `Fram` 实例传递给 `Animal` 的构造函数。在这个简单的示例中，没有实际区别，但在某些情况下，可能是重要的。\n\
  \n### 集合初始化器\n\n第 5 章描述了如何使用以下语法使用值初始化数组：\n\n```\nint[] myIntArray = new int[5]\
  \ { 5, 9, 10, 2, 99 }; \n```\n\n这是结合数组实例化和初始化的快速快速方便的方法。集合初始化器简单地将此语法扩展到集合：\n\n\
  ```\nList<int> myIntCollection = new List<int> { 5, 9, 10, 2, 99 }; \n```\n\n通过结合对象和集合初始化器，可以使用简单优雅的代码来配置集合。而不是像这样的代码：\n\
  \n```\nList<Animal> animals = new List<Animal>();\n\nanimals.Add(new Animal(\"Donna\"\
  , 73, 116));\n\nanimals.Add(new Animal(\"Mary\", 49, 132));\n\nanimals.Add(new Animal(\"\
  Andrea\", 46, 109.1)); \n```\n\n你可以使用以下代码：\n\n```\nList<Animal> moreAnimals = new\
  \ List<Animal>\n{\n   new Animal\n   {\n       Name = \"Donna\",\n       Age = 73,\n\
  \       Weight = 116\n   },\n   new Animal\n   {\n      Name  = \"Mary\",\n    \
  \  Age   = 49,\n      Weight  = 132\n   },\n   new Animal\n   {\n      Name = \"\
  Andrea\",\n      Age = 46,\n      Weight = 109.1\n   }\n};\n```\n\n\n\n\n在此段代码中，`myArray`\
  \ 的类型是隐式的 `int[]`。当你以这种方式隐式定义数组时，初始化器中使用的数组元素必须是以下类型之一：\n\n- 全为相同类型\n- 全为相同引用类型或\
  \ `null`\n- 所有可以隐式转换为单一种类型的元素\n\n如果应用了最后一条规则，那么元素可以转换的类型就称为数组元素的 `best`（最佳）类型。如果对于这个“最佳类型”可能是什么存在任何歧义——即存在两个或多个所有元素都可以隐式转换的类型——那么你的代码将无法编译。相反，你将收到一个错误，指示没有可用的最佳类型，如下所示：\n\
  \n```\n var myArray = new[] { 4, \"not an int\", 2 }; \n```\n\n另请注意，数值值永远不会被解释为可空类型，因此以下代码将无法编译：\n\
  \n```\n var myArray = new[] { 4, null, 2 }; \n```\n\n然而，你可以使用标准数组初始化器来使其工作：\n\n\
  ```\n var myArray = new int?[] { 4, null, 2 }; \n```\n\n最后一点：标识符 `var` 禁止用于类名的标识符。这意味着，例如，如果你的代码在作用域内有一个名为\
  \ `var` 的类（在同一个命名空间或在引用的命名空间中），那么你就不能使用 `var` 关键字进行隐式类型。\n\n类型推断本身并不是特别有用，因为在这一节中看到的代码中，它只是让事情变得复杂了。使用\
  \ `var` 使得更难一眼看出给定变量的类型。然而，正如你将在本章稍后部分看到的，推断类型的概念重要的，因为它是其他技术的基础。下一个主题匿名类型，是一个对推断类型至关重要的主题。\n\
  \n## 匿名类型 (Anonymous Types)\n\n在编程一段时间后，你可能会发现，特别是在数据库应用程序中，你花费了大量时间创建简单、单调的类来表示数据。拥有一系列除了暴露属性外什么都不做的类并不罕见。本章较早之前展示的\
  \ `Animal` 类就是一个完美的例子：\n\n```\n public class Animal\n{\n   public string Name {\
  \ get; set; }\n   public int Age { get; set; }\n   public double Weight { get; set;\
  \ }\n} \n```\n\n这个类什么都不做——它仅仅存储了结构化数据。在数据库或电子表格术语中，你可以将此类认为代表表格中的某行。能够持有此类类实例的集合类将是表格或电子表格中多行的表示。\n\
  \n这是类的一种完全可以用法，但为这些类编写代码可能会变得单调，而且对底层数据模式的任何修改都要求你添加、删除或修改定义类的代码。\n\n匿名类型是简化这种编程模型的方法。匿名类型背后的想法是，与其定义这些简单的数据存储类型，你不如使用\
  \ C# 编译器根据你想要存储在它们中的数据自动创建类型。\n\n上述的 `Animal` 类型可以如下所示实例化：\n\n```\n Animal  animal\
  \ = new Animal\n{\n    Name = \"Benjamin\",\n    Age = 42,\n    Weight = 185.4\n\
  }; \n```\n\n或者，你可以使用匿名类型，如下面的代码所示：\n\n```\n var\n  animal = new\n{\n    Name = \"\
  Lea\",\n    Age = 11,\n    Weight = 30.2\n}; \n```\n\n这里有两个区别。首先，使用了 `var` 关键字。那是因为匿名类型没有你可以你可以使用的标识符。在内部它们确实有一个标识符，正如你稍后看到的，但它在你的代码中是不可用的。其次，在\
  \ `new` 关键字之后没有指定类型名。这就是编译器知道你想要使用匿名类型的方式。\n\nIDE 检测到匿名类型定义并相应地更新 IntelliSense。通过前面的声明，你可以看到匿名类型，如\
  \ 图 13-14 所示。\n\n![截图插图，显示 IDE 检测到匿名类型定义并相应地更新 IntelliSense。](img/Image00165.jpg)\n\
  \n图 13-14\n\n在这里，在内部，变量 `animal` 的类型是 `'a`。显然，你不能在代码中使用这种类型——它甚至不是一个合法的标识符名称。`'`\
  \ 仅仅是用于 IntelliSense 中表示匿名类型的符号。IntelliSense 还允许你检查匿名类型的成员，如 图 13-15 所示。\n\n![截图插图，显示\
  \ IntelliSense 也允许你检查匿名类型的成员。](img/Image00166.jpg)\n\n图 13-15\n\n注意，这里显示的属性被定义为只读属性。这意味着，如果你想能够更改数据存储对象中属性的值，你就不能使用匿名类型。\n\
  \n匿名类型的其他成员实现如下：\n\n## 动态查找 (Dynamic Lookup)\n\n如前所述，`var` 关键字本身并不是一种类型，因此它并没有破坏“强类型”方法论。然而，从\
  \ C# 4 开始，情况变得不那么了。C# 4 引入了动态变量的概念，正如其名称所示，它们不是固定的。\n\n动态查找的主要动力是在许多情况下你会希望使用 C#\
  \ 操作由其他语言创建的对象。这包括与旧技术如组件对象模型 (COM)，以及处理 JavaScript、Python 和 Ruby 等动态语言。在深入讨论实现之前，过去使用\
  \ C# 访问这些对象的方法涉及笨拙的语法。例如，假设你有一个从 JavaScript 获取的具有添加两个数字的方法的对象。在没有动态查找的情况下，调用此方法的代码可能如下：\n\
  \n```\n ScriptObject jsObj = SomeMethodThatGetsObject();\n\nint sum = Convert.ToInt32(jsObj.Invoke(\"\
  Add\", 2, 3));\n```\n\n`ScriptObject` 类型（不深入介绍）提供了访问 JavaScript 对象的方法，但即使这样也无法让你执行：\n\
  \n```\n int sum = jsObj.Add(2, 3); \n```\n\n动态查找改变了一切——允许你编写像上面的代码。然而，正如你将在后面的章节看到的，这种力量是有代价的。\n\
  \n动态查找帮助你的另一种情况是在处理未知类型的 C# 对象时。这听起来可能是一个奇怪的情况，但它发生的频率比你想象的要多。在编写可以处理任何接收输入的泛型代码时，这也是一种重要的能力。处理这种情况的“旧”方法被称为反射，它涉及使用类型信息来访问类型和成员。使用反射访问方法等成员的语法与前面访问\
  \ JavaScript 对象的语法非常相似。\n\n在底层，动态查找由动态语言运行时 (DLR) 支持。它是 .NET 4.7 的一部分，就像 CLR 一样。关于\
  \ DLR 的准确描述以及它如何使互操作变得更容易超出本书的范围；在这里你更感兴趣如何在 C# 中使用它。你可以在这里阅读更多关于 DLD 的信息：`https://docs.microsoft.com/en-us/dotnet/framework/reflection-and-codedom/dynamic-language-runtime-overview`。\n\
  \n### dynamic 类型 (dynamic Type)\n\nC# 4 引入了 `dynamic` 关键字，你可以用它来定义变量，如下例所示：\n\n\
  ```\n dynamic myDynamicVar; \n```\n\n\n\n\n与早期引入的 `var` 关键字不同，确实存在一种 `dynamic` 类型，因此在声明\
  \ `myDynamicVar` 时不需要初始化它的值。\n\n一旦你有了动态变量，就可以访问它的成员（此处未显示获取变量值的代码）：\n\n```\nmyDynamicVar.DoSomething(\"\
  With this!\"); \n```\n\n无论 `myDynamicVar` 包含什么值，这段代码都能通过编译。然而，如果请求的成员不存在，那么在执行这段代码时，你将得到一个类型为\
  \ `RuntimeBinderException` 的异常。\n\n实际上，你通过此类代码所做的是提供了一个应该在运行时应用的“配方”。在需要的地方，程序将检查\
  \ `myDynamicVar` 的值，并找到并调用一个带有单个字符串参数的名为 `DoSomething()` 的方法。\n\n用例子可以很好地说明这一点。\n\
  \n这里可以学到的教训是，动态类型非常强大，但有一个需要学习的警告。如果你使用强类型而不是动态类型，这类异常是完全可以避免的。对于你编写的大多数 C# 代码，请避免\
  \ `dynamic` 关键字。然而，如果出现了需要使用它的情况，就尽管使用并爱它吧——并请过去那些没有这种强大工具可用的可怜程序员们想一下。\n\n## 高级方法参数\n\
  \nC# 4 扩展了定义和使用方法参数时的可行性。这主要是为了响应在使用外部定义的接口（例如 Microsoft Office 编程模型）时出现的特定问题。在这里，某些方法暴露了大量的参数，其中许多参数对于每次调用都不是必需的。在过去，这意味着需要一种指定缺失参数的方法，或者代码中会出现很多空值：\n\
  \n```\nRemoteCall(var1, var2, null, null, null, null, null); \n```\n\n在这段代码中，完全不清楚这些\
  \ `null` 值指的是什么，或者它们它们为什么被省略了。\n\n也许，在一个理想的世界里，这个 `RemoteCall()` 方法会有多个重载，其中一个只只需要两个参数的重载如下所示：\n\
  \n```\nRemoteCall(var1, var2); \n```\n\n然而，这将需要更多具有不同参数组合的方法，这本身就会导致更多问题（需要维护的代码更多、代码复杂性增加等）。\n\
  \nVisual Basic 等语言已经以不同的方式处理了这种情况，即允许命名参数和可选参数。从第 4 版本开始，这在 C# 中变得可行，展示了所有 .NET\
  \ 语言进化趋同的一种方式。\n\n在接下来的章节中，你将看到如何使用这些参数类型。\n\n### 可选参数\n\n通常当你调用方法时，你会为特定参数传递相同的值。例如，可以是一个布尔值，它可能控制方法操作的非本质部分。具体来说，考虑以下方法定义：\n\
  \n```\npublic List<string> GetWords(string sentence, bool capitalizeWords)\n{\n\
  \   …\n} \n```\n\n无论传递给 `capitalizeWords` 参数的值是什么，该方法都会返回一个 `string` 值列表，其中每个值都是输入句子中的一个单词。根据该方法的使用方式，你可能偶尔对返回的单词列表大写（可能你正在格式化像本节标题这样的标题，“可选参数”）。但在大多数情况下，你可能不想这样做，因此大多数调用如下：\n\
  \n```\nList<string> words = GetWords(sentence, false); \n```\n\n为了使这成为“默认”行为，你可能如下声明第二个方法：\n\
  \n```c\npublic List<string> GetWords(string sentence) => GetWords(sentence, false);\
  \ \n```\n\n该方法调用第二个方法，并为 `capitalizeWords` 传递一个 `false` 值。\n\n这样做没有错，但你可能可以想象在在使用更多参数的情况下，情况会变得多么复杂。\n\
  \n另一种方案是将 `capitalizeWords` 参数变为`可选参数`。这涉及到在方法定义中将该参数定义为可选，通过提供一个在未提供值时将使用的默认值来实现，如下：\n\
  \n```c\npublic List<string> GetWords(string sentence, bool capitalizeWords = false)\n\
  {\n   …\n} \n```\n\n如果你这样定义一个方法，那么你就可以提供一个或两个参数，其中只有当你让 `capitalizeWords` 为 `true`\
  \ 时，第二个参数才是必需的。\n\n#### 可选参数值\n\n如上一节所述，方法定义通过以下语法定义可选参数：\n\n```\n<parameterType>\
  \ <parameterName> = <defaultValue>\n```\n\n对于`<defaultValue>` 默认值的使用存在限制。默认值必须是字面量值、常量值或类型的默认值。因此，以下内容将无法通过编译：\n\
  \n```c\npublic bool CapitalizationDefault;\n\npublic List<string> GetWords(string\
  \ sentence,\n   bool capitalizeWords = CapitalizationDefault\n)\n{\n   …\n} \n```\n\
  \n为了使此生效，`CapitalizationDefault` 值必须被定义为常量：\n\n```c\npublic const bool CapitalizationDefault\
  \ = false\n; \n```\n\n这样做是否有意义取决于具体情况；在大多数情况下，你可能像上一节那样提供字面量值会更好。\n\n#### OptionalAttribute\
  \ 特性\n\n作为前几节描述语法的替代方案，你可以使用 `OptionalAttribute` 特性如下定义可选参数：\n\n```\n[Optional]\
  \ <parameterType> <parameterName>\n```\n\n该特性位于 `System.Runtime.InteropServices`\
  \ 命名空间。注意，如果你使用这种语法，则无法为参数提供默认值。\n\n#### 可选参数顺序\n\n当你使用可选值时，它们必须出现在方法参数列表的末尾。没有默认值的参数不能出现在任何带有默认值的参数之后。\n\
  \n因此，以下代码是非法的：\n\n```c\npublic List<string> GetWords(bool capitalizeWords = false,\
  \ string sentence)\n{\n   …\n}\n```\n\n在这里，`sentence` 是必需参数，因此必须出现在 `capitalizeWords`\
  \ 参数之前。\n\n### 命名参数\n\n当你使用可选参数时，你可能会发现处于这样一种情况：特定方法有多个可选参数。那么，在想象范围内，可以设想出你只想向例如第三个可选参数传递值的情况。仅使用上一节的语法，在不提供第一个和第二个可选参数值的情况下无法这样做。\n\
  \n`命名参数` 允许你指定任何想要的参数。这不需要对你的方法定义做任何特殊处理；它是你在调用方法时使用的一种技术。语法如下：\n\n```\nMyMethod(\n\
  \   <param1Name>: <param1Value>,\n   …\n   <paramNName>: <paramNValue>\n);\n```\n\
  \n参数名称是方法定义中使用的名称。\n\n你可以通过这种方式指定任意数量的参数，只要命名参数存在即可，并且可以任何顺序进行。命名参数也可以是可选。\n\n如果你愿意，你可以在方法调用中对部分参数使用命名参数。这在方法签名中具有多个可选参数但仍包含某些必需参数时特别有用。你可能先指定必需参数，然后以命名的可选参数结束。例如：\n\
  \n```\nMyMethod(\n   requiredParameter1Value,\n   optionalParameter5: optionalParameter5Value);\
  \ \n```\n\n\n\n如果你将命名参数和位置参数混合使用，请注意你必须在命名参数之前包含所有的位置参数。不过，如果你愿意在整个过程中都使用命名参数，你也可以使用不同的顺序，如下例所示：\n\
  \n```c\n MyMethod(\n\n   optionalParameter5: optionalParameter5Value,\n\n   requiredParameter1:\
  \ requiredParameter1Value); \n```\n\n如果你这样做，你必须包含所有必需参数的值。\n\n在接下来的“尝试一下”中，你将看到如何使用命名参数和可选参数。\n\
  \n# LAMBDA 表达式\n\n`Lambda expressions`（Lambda 表达式）是一种你可以用来简化 C# 编程某些方面的结构，特别是当与\
  \ LINQ 结合时。它们起初可能很难理解，主要是因为它们的用法非常灵活。Lambda 表达式与其他 C# 语言特征（如匿名方法）结合时非常有用。在不看 LINQ（该主题在书的稍后部分才会讨论）的情况下，匿名方法是研究该主题的最佳切入点。让我们从快速复习开始。\n\
  \n## 匿名方法回顾\n\n在本章之前的内容中，你学习了匿名方法——即你内联提供的方法，而在其他情况下需要一个委托类型变量。当你向事件添加事件处理程序时，事件序列如下：\n\
  \n1. 定义一个事件处理程序方法，其返回类型和参数与你想要订阅的事件所需的委托类型匹配。\n2. 声明一个用于事件的委托类型变量。\n3. 将委托变量初始化为指向事件处理程序方法的委托类型实例。\n\
  4. 将委托变量添加到该事件的订阅者列表中。\n\n在实践中，情况比这要简单一点，因为你通常不会费力使用变量来存储委托——你会在订阅事件时直接使用委托的实例。\n\
  \n在你之前使用以下代码时情况此类此：\n\n```c\n Timer myTimer = new Timer(100);\n\nmyTimer.Elapsed\
  \ += new ElapsedEventHandler(WriteChar); \n```\n\n这段代码订阅了 `Timer` 对象的 `Elapsed`\
  \ 事件。该事件使用 `ElapsedEventHandler` 委托类型，该类型通过方法标识符 `WriteChar` 实例化。结果是，当 `Timer` 触发\
  \ `Elapsed` 事件时，会调用 `WriteChar()` 方法。传递给 `WriteChar()` 的参数取决于 `ElapsedEventHandler`\
  \ 委托定义的参数类型，以及 `Timer` 中触发事件的代码所传递的值。\n\n事实上，C# 编译器可以通过方法组语法用更少的代码实现相同的结果：\n\n```c\n\
  \ myTimer.Elapsed += WriteChar; \n```\n\nC# 编译器知道 `Elapsed` 事件所需的委托类型，因此它可以填充空白处。但是，你应该谨慎地使用这种语法，因为它可能会让你的代码更难读，并让你无法确切地知道发生了什么。当你使用匿名方法时，之前显示的事件序列被简化为单个步骤：\n\
  \n1. 使用一个内联的匿名方法，该方法与订阅事件所需的委托的返回类型和参数匹配，以订阅该事件。\n\n内联匿名方法通过使用 `delegate` 关键字定义：\n\
  \n```csharp\n myTimer.Elapsed +=\n\n   delegate(object source, ElapsedEventArgs\
  \ e)\n\n   {\n\n      WriteLine(\"Event handler called after {0} milliseconds.\"\
  ,\n\n         (source as Timer).Interval);\n\n   }; \n```\n\n这段代码的工作效果与单独使用事件处理程序一样好。主要的区别是，这里使用的匿名方法实际上对你代码的其他部分隐藏了。例如，你无法在应用程序的其他地方复用此事件处理程序。此外，这里使用的语法（如果找个更好的描述的话）有点笨拙。`delegate`\
  \ 关键字立即让人困惑，因为它实际上被重载了——你既将其用于匿名方法，又用于定义委托类型。\n\n## 用于匿名方法的 Lambda 表达式\n\n这引入了 Lambda\
  \ 表达式。Lambda 表达式简化匿名方法语法的一种方式。事实上，它们不仅如此，但本节目前将保持简单。使用 Lambda 表达式，你可以按照如下方式重写上一节末尾的代码：\n\
  \n```csharp\n myTimer.Elapsed += (source, e) => WriteLine(\"Event handler called\
  \ after \" +\n\n                      $\"{(source as Timer).Interval} milliseconds.\"\
  ); \n```\n\n初看之下，这看起来……嗯，有点令人费惑（除非你熟悉如 Lisp 或 Haskell 之类的函数式编程语言）。然而，如果你仔细观察，就可以看到（至少推断出）它是如何工作的，以及它与它所替换的匿名方法有什么联系。Lambda\
  \ 表达式由三部分组成：\n\n*   括号中的一组（未类型化的）参数列表\n*   `=>` 运算符\n*   一个 C# 语句\n\n参数的类型是从文中推断的，使用了本章前面“匿名类型”部分中所示的逻辑。`=>`\
  \ 运算符简单地将参数列表与表达式体隔开。当调用 Lambda 表达式时会执行表达式体。\n\n编译器获取此 Lambda 表达式并创建一个工作方式与上一节中匿名方法完全相同的匿名方法。事实上，它将被编译成相同或相似的公共中间语言\
  \ (CIL) 代码。\n\n接下来的“尝试一下”阐明了 Lambda 表达式中发生了什么。最后一个 Lambda 表达式涉及更多计算，但并不比其他的更复杂。Lambda\
  \ 表达式的语法允许你执行更复杂的操作，正如你很快就会看到的。\n\n## Lambda 表达式参数\n\n在目前为止你看到的代码中，Lambda 表达式使用了类型推断来确定传递的参数类型。事实上，这并不是强制的；如果你愿意，可以定义类型。例如，你可以使用以下表达式：\n\
  \n```csharp\n (int paramA, int paramB) => paramA + paramB\n```\n\n这种做法的优点是增加了代码的可读性，尽管你在简洁性和灵活性上有所损失。你可以使用之前“尝试一下”中的隐式类型\
  \ Lambda 表达式用于其他数值类型，例如 `long` 变量。\n\n注意，你不能在同一个 Lambda 表达式中使用隐式和显式参数类型。以下 Lambda\
  \ 表达式将无法编译，因为 `paramA` 是显式类型的而 `paramB` 是隐式的：\n\n```csharp\n (int paramA, paramB)\
  \ => paramA + paramB\n```\n\nLambda 表达式中的参数列表始终由逗号分隔的隐式参数或所有显式类型参数组成。如果你只有一个隐式类型参数，则可以省略括号；否则，它们是参数列表的一部分，如之前所示。例如，你可以将以下内容作为单参数隐式类型\
  \ Lambda 表达式：\n\n```csharp\n param1 => param1 * param1 \n```\n\n你还可以定义没有参数的 Lambda\
  \ 表达式。这通过使用空括号 `()` 表示：\n\n```csharp\n () => Math.PI \n```\n\n这适用于不需要参数但返回 `double`\
  \ 值的地方。\n\n## Lambda 表达式语句体\n\n在你目前为止的所有代码中，Lambda 表达式的语句体都使用单个表达式。你还看到这个单个表达式被解释为\
  \ Lambda 表达式的返回值，例如，你可以将表达式 `paramA` `+` `paramB` 作为返回类型为 `int` 的委托的 Lambda 表达式语句体（假设\
  \ `paramA` 和 `paramB` 都被隐式或显式类型化为 `int` 值，正如示例代码中所示）。\n\n\n\n\n\n之前的示例显示了返回类型为 `void`\
  \ 的委托对语句体中使用的代码没有那么苛刻：\n\n```\n myTimer.Elapsed += (source, e) => WriteLine(\"Event\
  \ handler called after \" + \n\n                   $\"{(source as Timer).Interval}\
  \ milliseconds.\"); \n```\n\n在这里，该语句不会产生任何结果值，因此它只是简单地执行，而没有任何返回值被用于任何地方。\n\n鉴于\
  \ lambda 表达式可以被视为匿名方法语法的扩展，你可能不会惊讶于发现你也可以将多个语句作为 lambda 表达式的语句体。要做到这一点，你只需要提供一个用大括号括起来的代码块，这与\
  \ C# 中其他必须提供多行代码的情况非常相似：\n\n```\n (param1, param2) =>\n\n{\n\n   // 多个语句就绪！\n\n\
  } \n```\n\n如果你将 lambda 表达式与具有非 `void` 返回类型的委托类型结合使用，那么你必须使用 `return` 关键字返回一个值，就像其他其他方法一样：\n\
  \n```\n (param1, param2) =>\n\n{\n\n   // 多个语句就绪！\n\n   return returnValue;\n\n\
  } \n```\n\n例如，你之前已经看到过如何重写“尝试一试”中的以下代码：\n\n```\n PerformOperations((paramA, paramB)\
  \ => paramA + paramB); \n```\n\n作为：\n\n```\n PerformOperations(delegate(int paramA,\
  \ int paramB)\n\n            {\n\n               return paramA + paramB;\n\n   \
  \         }); \n```\n\n或者，你也可以如下所示重写代码：\n\n```\n PerformOperations((paramA, paramB)\
  \ =>\n\n            {\n\n               return paramA + paramB;\n\n            });\
  \ \n```\n\n这更符合原始代码的习惯，因为它保持了 `paramA` 和 `paramB` 参数的隐式类型。\n\n在大多数情况下，lambda 表达式在与单个表达式配合使用时最为有用且无疑是最优雅。说实话，如果你需要多个语句，定义一个独立的非匿名方法来代替\
  \ lambda 表达式可能会让代码读起来更好；这也能让你的代码更具重用性。\n\n## 作为委托和表达式树的 Lambda 表达式\n\n你见过 lambda\
  \ 表达式与匿名方法之间的一些区别，lambda 方法具有更高的灵活性——例如，隐式类型参数。此时，值得注意另一个关键区别，尽管它的影响直到书中后面学习 LINQ\
  \ 时才会显现。\n\n你可以通过两种方式来解释 lambda 表达式。第一种方式是你在本章中一直看到的，即将其视为委托。也就是说，你可以将 lambda 表达式赋值给委托类型变量，就像你在上一个“尝试一试”中做的那样。\n\
  \n通常情况下，你可以将带有八个参数的 lambda 表达式表示为以下泛型类型之一，它们都定义在 `System` 命名空间中：\n\n* `Action` 用于没有参数且返回类型为\
  \ `void` 的 lambda 表达式\n* `Action<>` 用于最多八个参数且返回类型为 `void` 的 lambda 表达式\n* `Func<>`\
  \ 用于最多八个参数且返回类型非 `void` 的 lambda 表达式\n\n`Action<>` 有最多八个泛型参数，每个参数对应一个，而 `Func<>`\
  \ 有最多九个泛型参数，用于最多八个参数和一个返回类型。在 `Func<>` 中，返回类型始终是列表的最后一个。\n\n例如，你之前看到的这个 lambda 表达式：\n\
  \n```\n (int paramA, int paramB) => paramA + paramB \n```\n\n该表达式可以表示为类型为 `Func<int,\
  \ int, int>` 的委托，因为它有两个参数且返回类型都是 `int` 类型。请注意，在许多情况下，你可以使用这些泛型委托类型而不是定义自己的。例如，你可以用它们来代替你在上一个“尝试一试”中定义的\
  \ `TwoIntegerOperationDelegate` 委托。\n\n解释 lambda 表达式的第二种方式是作为表达式树。表达式树是 lambda 表达式的抽象表示；因此，它不能直接执行。相反，你可以使用表达式树通过程序分析\
  \ lambda 表达式，并根据 lambda 表达式执行操作。\n\n这显然是一个复杂的课题。然而，表达式树对于你以后在书中学的 LINQ 功能至关重要。举一个具体的例子，LINQ\
  \ 框架包含一个名为 `Expression<>` 的泛型类，可以用它来封装 lambda 表达式。该类的用途之一是将你在 C# 中编写的 lambda 表达式转换为相应的\
  \ SQL 脚本表示，以便在数据库中直接执行。当你以后遇到此功能时，你将更好地理解发生了什么，因为你现在对 C# 语言提供的核心概念有了透彻的基础。\n\n##\
  \ Lambda 表达式与集合\n\n现在你已经学习了 `Func<>` 泛型委托，你就可以理解 `System.Linq` 命名空间为数组类型提供的一些扩展方法（你可能在编码期间的某些时刻在\
  \ IntelliSense 中看到它们）。例如，有一个名为 `Aggregate()` 的扩展方法，它具有以下三个重载：\n\n```\n public static\
  \ TSource Aggregate<TSource>(\n\n   this IEnumerable<TSource> source,\n\n   Func<TSource,\
  \ TSource, TSource> func);\n\npublic static TAccumulate Aggregate<TSource, TAccumulate>(\n\
  \n   this IEnumerable<TSource> source,\n\n   TAccumulate seed,\n\n   Func<TAccumulate,\
  \ TSource, TAccumulate> func);\n\npublic static TResult Aggregate<TSource, TAccumulate,\
  \ TResult>(\n\n   this IEnumerable<TSource> source,\n\n   TAccumulate seed,\n\n\
  \   Func<TAccumulate, TSource, TAccumulate> func,\n\n   Func<TAccumulate, TResult>\
  \ resultSelector);\n```\n\n与之前的扩展方法一样，这乍看起来很难懂，但如果你将其拆解就可以很容易理解。IntelliSense 告诉你：\n\
  \n```\n 对序列应用累加函数。 \n```\n\n这意味着累加函数（你可以以 lambda 表达式的形式提供）将应用于集合中的每个元素。此累加函数必须有两个参数和一个返回值。一个输入是当前元素；另一个输入是种子值、集合中的第一个值，或者上一次评估的结果。\n\
  \n在三个重载中最简单的一个只有一个泛型类型规范，它可以从实例的类型推断出来。例如，在以下代码中泛型类型规范将是 `int`（累加函数暂留空）：\n\n```\n\
  \ int[] myIntArray = { 2, 6, 3 };\n\nint result = myIntArray.Aggregate(…); \n```\n\
  \n这相当于：\n\n```\n int[] myIntArray = { 2, 6, 3 };\n\nint result = myIntArray.Aggregate<int>\n\
  \n(…); \n```\n\n这里需要的 lambda 表达式可以从扩展方法的规范推断出来。因为代码中 `TSource` 类型是 `int`，所以你必须为\
  \ `Func<int, int, int>` 提供一个 lambda 表达式。例如，你可以使用之前见过的：\n\n```\n int[] myIntArray\
  \ = { 2, 6, 3 };\n\nint result = myIntArray.Aggregate((paramA, paramB) => paramA\
  \ + paramB); \n```\n\n此调用会导致 lambda 表达式被调用两次，第一次是 `paramA` 为 2  `paramB` 为 6，第二次是\
  \ `paramA` 为 8（上一次计算的结果）且 `paramB` 为 3。赋值给变量 `result` 的结果将是 `int` 值 `11`——数组中所有元素的和。\n\
  \n\n\n\n\n`Aggregate()` 扩展方法的另外两个重载与之类似，但它们允许你执行稍微复杂的处理。接下来的简短“尝试运行”（Try It Out）就说明了这一点。\n\
  \n这个示例并没有完成什么了不起，但它演示了你如何使用涉及泛型类型参数、集合以及看似复杂的语法的扩展方法。你将在书的后续部分看到更多此类。\n\n## 练习题\n\
  \n1. 13.1 为事件处理程序编写代码，该程序使用通用的 `(object sender, EventArgs e)` 语法，并能够接受本章之前代码所示的\
  \ `Timer.Elapsed` 事件或 `Connection.MessageArrived` 事件。处理程序应该输出一个字符串，指定接收到了哪种类型的事件，并根据发生的事件，输出\
  \ `MessageArrivedEventArgs` 参数的 `Message` 属性或 `ElapsedEventArgs` 参数的 `SignalTime`\
  \ 属性。\n\n2. 13.2 修改纸牌游戏示例，以检查流行牌牌拉米（rummy）中更有趣的胜利条件。这意味着如果玩家手中的牌包含两组“set”（sets），其中一组包含三张牌，另一组包含四张牌，则该玩家获胜。一组（set）定义为同花色的牌序列（例如\
  \ 3H, 4H, 5H, 6H）或几张具有相同点数的牌（例如 2H, 2D, 2S）。\n\n3. 13.3 为什么你不能对以下类使用对象初始化器？在修改此类类以启用对象初始化器后，给出一个代码示例，说明如何一步实例化并初始化该类：\n\
  \n```cs\npublic class Giraffe\n{\n   public Giraffe(double neckLength, string name)\n\
