  \ C# 语法，因此应用程序执行到调用 `Console.WriteLine()` 这一点的具体方法并不重要。稍后，这些额外代码的意义将会变得明确。\n\n##\
  \ 变量 (VARIABLES)\n\n如前所述，变量涉及数据存储。从本质上，你可以将计算机内存中的变量想象成放在架子上的盒子。你可以把东西放在盒子里并再次取出，或者你也可以直接向盒子内部查看里面是否有任何东西。变量也是如此；你可以将数据放入其中，并根据需要将其取出或查看。\n\
  \n尽管计算机中的所有数据实际上都是同一种东西（一系列 0 和 1 的序列），但变量有不同的“风味”，被称为 `types`（类型）。再次使用盒子的类比，盒子的有不同的形状和大小，因此某些物品只能放入某些盒子里。这种类型系统背后的逻辑是，不同类型的数据可能需要不同的处理方法，通过将变量限制为单个类型，你可以避免混淆它们。例如，将组成数字图片的\
  \ 0 和 1 序列视为音频文件并没有太大意义。\n\n要使用变量，你必须对它们进行`declare`（声明）。这意味着你必须为它们分配一个 `name`（名称）和一个\
  \ `type`（类型）。声明变量后，你就可以将它们作为你声明要包含的数据类型的存储单元。\n\n用于声明变量的 C# 语法仅指定了类型和变量名：\n\n```\n\
  <type> <name>; \n```\n\n如果你尝试使用一个未声明的变量，你的代码将无法编译，但在这种情况下，编译器会准确告诉你问题所在，所以这并不是真的一个灾难性的错误。尝试在不给变量赋值的情况下使用变量也会导致错误，但同样，编译器会检测到。\n\
  \n## 简单类型 (Simple Types)\n\n简单类型包括数字和布尔（真或假）值等类型，它们构成了你应用程序的基础构建块。与复杂类型不同，简单类型不能拥有子项或属性。可用的简单类型大部分是数值，这初看起来似乎有点奇怪——难道你只需要一种类型来存储一个数字吗？\n\
  \n之所以有这么多数值类型，是因为在计算机内存中将数字存储为 0 和 1 序列的机制。对于整数值，你只需要取数量的 `bits`（可以是 0 或 1 的单个数字）并以二进制格式表示你的数字。存储\
  \ `N` 位的变量允许你表示 0 到 (2^N – 1) 之间的任何数字。超过此值的任何数字都太大，无法放入此变量。\n\n例如，假设你有一个可以存储两个位的变量。因此，整数与表示这些整数的位之间的映射如下：\n\
  \n```\n0 = 00\n1 = 01\n2 = 10\n3 = 11 \n```\n\n为了存储更多数字，你需要更多的位（例如，三位允许你存储从 0 到\
  \ 7 的数字）。\n\n该系统的不可避免的结果是，你需要无限数量位才能存储每一个想象中的数字，这无法放入你可靠的 PC 中。即使对于每个数字都有可用的位，将所有这些位用于一个例如只需要存储\
  \ 0 到 10 之间数字的变量也显然不是高效的（因为会浪费存储）。四位在这里足够了，允许你在相同的内存空间内存储该范围内的更多值。\n\n相反，可以使用不同的整数类型来存储不同范围的数字，它们占用不同数量的内存（多达\
  \ 64 位）。这些类型在 表 3-1 中所示。\n\n| TYPE | ALIAS FOR | ALLOWED VALUES |\n| --- | --- |\
  \ --- |\n| `sbyte` | `System.SByte` | −128 到 127 之间的整数 |\n| `byte` | `System.Byte`\
  \ | 0 到 255 之间的整数 |\n| `short` | `System.Int16` | −32768 到 32767 之间的整数 |\n| `ushort`\
  \ | `System.UInt16` | 0 到 65535 之间的整数 |\n| `int` | `System.Int32` | −2147483648\
  \ 到 2147483647 之间的整数 |\n| `uint` | `System.UInt32` | 0 到 4294967295 之间的整数 |\n| `long`\
  \ | `System.Int64` | −9223372036854775808 到 9223372036854775807 之间的整数 |\n| `ulong`\
  \ | `System.UInt64` | 0 到 18446744073709551615 之间的整数 |\n\n**表 3-1 ：整数类型**\n\n某些变量名前的\
  \ `u` 字符是 `unsigned`（无符号）的缩写，意味着你不能在这些类型的变量中存储负数。\n\n（此处省略了大量重复的句子，以遵循指令不重复输出原文的要求）\n\
