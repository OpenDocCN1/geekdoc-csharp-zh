  \ Studio`。\n\n## 第 2 章：编写程序\n\n.NET Framework 的设计使得它可以从任何语言使用，包括 C#（本书的主题）以及 C++、F#、JScript、Visual\
  \ Basic，甚至如 COBOL 等较旧的语言。为了实现这一点，这些语言的 .NET 特定版本也相继问世，并且不断发布中。这些语言不仅可以访问 .NET Framework，还可以相互通信。C#\
  \ 开发者可以使用 Visual Basic 程序员编写的代码，反之亦然。\n\n## 第 3 章：变量与表达式\n\n## 第 4 章：流程控制\n\n##\
  \ 第 5 章：更多\n\n## 第 6 章：函数\n\n## 第 7 章：调试与错误处理\n\n## 第 8 章：面向对象编程\n\n## 第 9 章：类\n\
  \n## 第 10 章：成员\n\n## 第 11 章：集合\n\n## 第 12 章：泛型\n\n## 第 13 章：技术\n\n## 什么是 .NET Framework？\n\
  \n.NET Framework（现版本为 4.7）是微软创建的一个革命性平台。关于它最有趣的一点是它是模糊且局限的。首先，请注意它并不只在 Windows 上开发应用程序。尽管微软发布的\
  \ .NET Framework 运行在 Windows Mobile 上，但也可以找到可以在其他系统运行的替代版本。其中一个例子是 Mono，它是 .NET\
  \ Framework 的开源版本（包含一个 C# 编译器），运行在多个系统上。Mono 是 .NET 生态系统中非常重要的一个部分，特别是对于使用 Xamarin\
  \ 创建客户端应用程序。微软还创建了一个名为 .NET Core 的跨平台开源库（[`https://github.com/dotnet/core`](https://github.com/dotnet/core)），他们希望这会对\
  \ Mono 和 .NET Core 产生积极影响。两个生态系统的程序员可以使用对方的示例来提高性能、安全性和语言范围。\n\n此外，.NET Framework\
  \ 的定义对可能的应用程序类型没有限制。.NET Framework 允许创建桌面应用程序、Windows Store (UWP) 应用程序、云/Web 应用程序、Web\
  \ API 以及你想的任何其他类型。值得注意的是，Web、云和 Web API 根据定义就是多平台应用程序，因为任何带有浏览器的系统都可以访问它们。\n\n.NET\
  \ Framework 的设计使得它可以从任何语言使用，包括 C#（本书的主题）以及 C++、F#、JScript、Visual Basic，甚至如 COBOL\
  \ 等较旧的语言。为了实现这一点，这些语言的 .NET 特定版本也相继问世，并且不断发布中。语言列表请参阅 [`https://msdn.microsoft.com/enacetus/library/ee822860(v=vs.100).aspx`](https://msdn.microsoft.com/en-us/library/ee822860(v=vs.100).aspx)。这些语言不仅可以访问\
  \ .NET Framework，还可以相互通信。C# 开发者可以使用 Visual Basic 程序员编写的代码，反之亦然。\n\n### .NET Framework\
  \ 中包含什么？\n\n\n\n\n.NET Framework 主要由一个巨大的代码库组成，你可以从你的客户端或服务器端语言（如 `C#`）出发，使用面向对象编程（OOP）技术来使用它。该库被划分为不同的模块——你根据想要实现的结果使用它的部分内容。例如，一个模块包含构建\
  \ Windows 应用程序的构建块，另一个用于网络编程，还有一个用于 Web 开发。某些模块又被细分为更具体的子模块，例如，在 Web 开发模块中有一个用于构建\
  \ Web 模块。\n\n其意图是让不同的操作系统根据其特性支持这些模块的某些或全部。例如，智能手机虽然包含了对所有基础 .NET 功能的支持，但可能不需要某些更冷门的模块。\n\
  \n.NET Framework 库的某部分定义了一些基础的 `types`（类型）。`type` 是数据的表示，指定其中一些最基础的类型（例如“32 位有符号整数”）有助于使用\
  \ .NET Framework 的语言之间的互操作性。这被称为 `通用类型系统`（CTS）。\n\n除了提供此库外，.NET Framework 还包含了 .NET\
  \ `通用语言运行时`（CLR），它负责执行所有使用 .NET 库开发的应用程序。\n\n## .NET Standard 和 .NET Core\n\n当 .NET\
  \ Framework 最初创建时，尽管它被设计为在多个平台上运行，但当时还没有业界接受的开源分支概念。如今，通常在 GitHub 上，一个项目可以被分支并进行定制以运行在多个平台上。例如，.NET\
  \ Compact Framework 和 .NET Micro Framework 是 .NET Framework 的分支，就像 .NET Core，它被创建为跨平台代码开发的最优解决方案。这些\
  \ .NET Framework “变体”或“垂直领域”都有特定的需求和目标，这些需求触发了……（此处根据原文逻辑保持完整翻译）\n\n.NET Framework\
