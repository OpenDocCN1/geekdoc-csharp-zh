  \ 样式 (Styles) | 你可以使用样式为 XAML 元素创建样式，这些样式可以在许多元素上复用。样式允许你设置元素的属性。当你将元素的 `Style`\
  \ 属性指向你定义的样式时，该元素的属性将使用你在 `Style` 属性中指定的值。 |\n| 模板 (Templates) | 模板用于定义控件的内容。通过使用模板，你可以更改标准控件的显示方式。你还可以用它们来构建复杂的自定义控件。\
  \ |\n| 用户控件 (User controls) | 用户控件用于创建可以在你自己的项目中轻松复用的代码和 XAML。这些代码和 XAML 也可以导出以供其他项目使用。\
  \ |\n\n# 第三部分\n\n云与跨平台编程\n\n* 第 16 章：基础云编程\n* 第 17 章：高级云编程与部署\n* 第 18 章：.NET Standard\
  \ 和 .NET Core\n* 第 19 章：ASP.NET 和 ASP.NET Core\n\n# 16\n\n基础云编程\n\n## 云、云计算与云优化技术栈\n\
  \n开始创建完全或部分运行在云端的应用程序只是时间问题。这不再是“是否”会发生，而是“何时”会发生的问题。决定程序中的哪些组件运行在云端、云的类型以及云服务模型，需要进行一些调查、理解和规划。首先，你需要明确什么是云。云简单来说运行在数据中心内部的大量商品化计算机硬件，它们可以运行程序并存储大量数据。其区别在于弹性（elasticity），即动态地向上扩展（例如增加\
  \ CPU 和内存）和/或向外扩展（例如增加虚拟服务器实例的数量）的能力，然后以看似极小或毫不费力的缩回。这与当前的 IT 运营格局有巨大区别，在当前格局中，差异化的计算机资源通常在公司的一个区域部分或完全未被使用，而在其他区域又严重缺乏计算机资源。云通过在你需要时提供计算机资源的访问解决了这个问题，当你不需要时，这些资源会被提供给其他人。云提供了根据需要访问计算机资源的途径，当你不需要时，这些资源会被交给别人。对于开发者来说，云是一个部署程序并将其推向世界的地方。如果程序流行，你无需花费精力配置硬件。现在让我们详细探讨云类型和云服务模型。常见的云类型有公有云、私有云和混合云，见图\
  \ 16-1。\n\n* **公有云 (Public cloud)** 是由 Microsoft Azure、Amazon AWS、Rackspace 或 IBM\
  \ Cloud 等供应商提供的共享硬件和基础设施。这种云类型适用于需要管理用户波动的企业。\n\n* **私有云 (Private cloud)** 是存在于本地或外地的专用硬件和基础设施。这种云类型适用于需要更高数据安全性或政府合规性的大型公司。\n\
  \n* **混合云 (Hybrid cloud)** 是公有云和私有云类型的组合，由你选择哪些部分运行在私有云，哪些运行在公有云。这种理想方案适用于在私有云中运行关键业务程序，并在公有云中运行非敏感的突发任务。\n\
  \n![描述常见云类型的图示：公有云、私有云和混合云。](img/Image00191.jpg)\n\n图 16-1\n\n云服务的数量在不断增加，但常见的云模型如下文要点所示，并在图\
  \ 16-2。\n\n![描述一些常见云服务模型的图示。](img/Image00192.jpg)\n\n图 16-2\n\n* **基础设施即服务 (IaaS)**\
  \ ——你负责从操作系统向上的内容。你不需要负责硬件或网络基础设施；但是，你负责操作系统补丁和第三方依赖库。\n\n* **平台即服务 (PaaS)** ——你仅负责运行在所选操作系统及其依赖项上的程序。你不需要负责操作系统维护、硬件或网络基础设施。\n\
  \n* **软件即服务 (SaaS)** ——一种通过设备访问并使用的软件程序或服务。例如 O365、Salesforce、OneDrive 或 Box，所有这些都可以任何有互联网连接的地方访问，且不需要在客户端安装软件即可运行。你只负责运行在平台上的软件，而不负责其他任何。\n\
  \n\n\n\n回顾云的扩展性作为其最有利的优势之一，不仅平台需要能够扩展，云程序也需要，这非常重要。例如，代码是否依赖于后端资源、数据库、读取或打开文件，或解析大型数据对象？云程序中的这些功能性操作可能会降低其扩展能力，从而对吞吐量的支持较低。请确保你的云程序管理了执行长耗运行方法的代码路径，并可能将它们放入离线处理机制中。\n\
  \n云优化堆栈（the cloud optimized stack）是一个概念，指的是能够处理高吞吐量、占用资源较小、能够在同一服务器上与其他应用程序并存运行并且支持跨平台的代码。`small\
  \ footprint`（小 footprint）指的是仅在你的云程序中打包存在依赖项的组件，使部署尺寸尽可能小。考虑云程序是否需要整个 `.NET Framework`\
  \ 才能运行。如果不需要，与其打包整个 `.NET Framework`，不如仅包含运行云程序所需的库，然后将云程序编译为自包含应用程序以支持并存执行。云程序可以与任何其他云程序一起运行，因为它在二进制包内部包含了所需的依赖项。最后，通过使用\
  \ `Mono`、`.NET Core` 或 `ASP.NET Core` 的开源版本，云程序可以被、编译并部署到 Microsoft 以外的操作系统——例如\
  \ `Mac OS X`、`iOS` 或 `Linux`。\n\n# 云模式与最佳实践\n\n在云中，短暂的延迟增加或停机是预料之中的，你的代码必须对此做好准备，并包含逻辑以从这些平台异常中成功恢复。如果你以前一直是为现场或本地程序执行而编写代码，那么这是一个重大的思维转变。你需要忘记许多你所知道的关于异常处理的知识，并学会接受失败，创建你的代码来从此类失败中恢复。\n\
  \n在上一节中，如可移植性（portability）、可扩展性（scalability）和韧性（resiliency）等术语已经在将这些概念集成到计划运行在云中的程序背景下提到。但\
  \ `portability`在这里具体意味着什么？如果一个程序可以在多个平台（例如 `Windows`、`Linux` 和 `Mac OS X`）上移动或执行，它就是移植的。以某些\
  \ `ASP.NET Core` 功能为例，它们构建在新的开源技术堆栈上，为开发者提供了选项，可以将代码编译为可以在任何一个平台上运行的二进制文件。传统上，使用\
  \ `ASP.NET` 并以 `C#` 为背景编写程序的开发者会在 `Windows` 服务器上使用 `Internet Information Server\
  \ (IIS)` 运行它。然而，从以云为核心的角度来看，你的程序及其所有依赖项从一个虚拟机移动到另一个虚拟机而无需人工或程序化干预的能力，是这种情况下最相关的移植性形式。记住，云中的失败是预料之中的，运行你程序的虚拟机\
  \ (`VM`) 可以在任何时候被擦除，然后在另一个 `VM` 上重新构建。因此，你的程序需要具有移植性并能够从此类事件中恢复。\n\n`Scalability`\
  \ 意味着你的代码在多个客户使用时有良好的响应。例如，如果你每分钟有 1,500 次请求，如果请求在 1 秒内完成并响应，那么大约是每秒 25 个并发请求。然而，如果你每分钟有\
  \ 15,000 次请求，这意味着每秒有 250 个并发请求。`Resiliency` 指你的程序对服务故障的响应和恢复能力。从历史上看，IT 基础设施一直关注故障预防。然而，在云中运行程序需要这种转变，即接受失败并明确面向恢复。\n\
  \n以下是几个对扩展性有用的模式：\n\n- `Command and Responsibility Segregation (CQRS)` 模式：这涉及读取操作与修改操作的分离。\n\
  - `Materialized View`（物化视图）模式：为特定查询创建视图。\n- `Sharding`（分片）模式：将你的数据拆分为多个水平分片。\n-\
  \ `Valet Key`（管家钥匙）模式：赋予客户端直接访问数据存储的权限。\n\n以下是几个有助于将韧性嵌入你的云程序的模式：\n\n- `Circuit\
  \ Breaker`（断路器）模式：这是一种感知远程服务状态的代码设计，只有在服务可用时才会尝试建立连接。这避免了在服务不可用时尝试请求并浪费 CPU 周期。\n\
  - `Health Endpoint Monitoring`（健康端点监控）模式：通过实现端点监控来检查云端应用程序在功能上是可用的。\n- `Retry`（重试）模式：在瞬态异常或失败后重试请求。该模式在给定时间内重试多次，并在超过重试尝试阈值时停止。\n\
  - `Throttling`（节流）模式：管理云程序的消耗，以满足 SLA 并保持程序功能正常。使用本节中描述的一个或多个模式将有助于你的云迁移更加成功。所讨论的模式通过提高程序的可扩展性和韧性增强了程序的可用性。\n\
  \n## 使用 MICROSOFT AZURE C# 库创建存储容器\n\n尽管有许多云提供商，但本章和下一章示例中使用的云提供商是微软。微软提供的云平台称为\
  \ `Azure`。Azure 有许多不同类型的功能。例如，IaaS 产品称为 `Azure VM`，PaaS 产品称为 `Azure Cloud Services`。此外，微软还有用于数据库的\
  \ `SQL Azure`、用于用户验证的 `Azure Active Directory` 以及用于存储 blob 的 `Azure Storage` 等。\n\
  \n以下两个练习将介绍 Azure 存储账户和 Azure 存储容器的。一旦创建，使用 `Microsoft Azure Storage SDK for .NET`\
  \ 将 52 张扑牌图像存储在容器中。然后在接下一节中，你将创建一个 `ASP.NET 4.7 Web Application` 来访问存储在 Azure 存储容器中的图像。然后遵循书籍的书牌游戏主题，`ASP.NET\
  \ 4.7 Web Site` 将发出一副牌。\n\n\n\n\n既然 Microsoft Azure 存储账户和容器已经创建并加载了 52 张扑克牌的图像，你可以创建一个\
  \ ASP.NET 网站来引用该 Microsoft Azure 存储容器。\n\n## 创建一个使用存储容器的 ASP.NET 4.7 网站\n\n到为止，还没有对什么是\
  \ Web 应用程序进行过深入的检查，也没有对 ASP.NET 的基本方面进行过讨论。本节将对这些技术视角提供一些见解。\n\nWeb 应用程序会导致 Web\
  \ 服务器向客户端发送 HTML 代码。这些代码显示在 Microsoft Edge 或 Google Chrome 等网络浏览器中。当用户在浏览器中输入 URL\
  \ 字符串时，会向 Web 服务器发送一个 HTTP 请求。该 HTTP 请求包含所请求的文件名，以及其他信息，例如标识应用程序的字符串、客户端支持的语言以及属于请求的额外数据。Web\
  \ 服务器返回一个包含 HTML 代码的 HTTP 响应，网络浏览器会解释这些代码并向用户显示文本框、按钮和列表。\n\nASP.NET 是一种使用服务器端代码动态创建网页的技术。这些网页的开发方式与客户端\
  \ Windows 程序有许多相似之处。你不需要直接处理 HTTP 请求和响应，也不需要手动创建 HTML 代码发送给客户端，而是可以使用 `TextBox`、`Label`、`ComboBox`\
  \ 和 `Calendar` 等控件，它们会自动生成 HTML 代码。\n\n在客户端系统上使用 ASP.NET Web 应用程序只需要简单的网络浏览器。你可以使用\
  \ Internet Explorer、Edge、Chrome、Firefox 或任何支持 HTML 的网络浏览器。客户端系统不需要安装 .NET。\n\n在服务器系统中，需要\
  \ ASP.NET 运行时。如果你系统上安装了 Internet 信息服务 (IIS)，在安装 .NET Framework 时，ASP.NET 运行时就会在服务器上配置好。在开发期间，不需要处理\
  \ Internet 信息服务，因为 Visual Studio 提供了了自己的 ASP.NET Web 开发服务器，你可以用它来测试和调试应用程序。\n\n\
  要理解 ASP.NET 运行时是如何运作的，请考虑来自浏览器的典型 Web 请求（参见图 16-11）。客户端向服务器请求一个文件，例如 `default.aspx`\
  \ 或 `default.cshtml`。ASP.NET Web 表单页面通常具有 `.aspx` 文件扩展名（ASP.NET MVC 没有特定的文件扩展名），而\
  \ `.cshtml` 用于基于 Razor 的网站。由于这些文件扩展名已在 IIS 中注册或被 ASP.NET Web 开发服务器识别，ASP.NET 运行时和\
  \ ASP.NET 工作进程便介入其中。IIS 工作进程名为 `w3wp.exe`，它是 Web 服务器上你的应用程序的宿主机。当对 `default.cshtml`\
  \ 文件进行第一次请求时，ASP.NET 解析器启动，编译器将该文件连与 `.cshtml` 文件相关的 C# 代码一起编译创建一个程序集。然后，.NET 运行时的\
  \ JIT 编译器将程序集编译为原生代码。接着 `Page` 对象被销毁。不过，程序集会被保留用于后续请求，因此没有再次编译程序集。\n\n![来自浏览器的典型\
  \ Web 请求示意图](img/Image00201.jpg)\n\n**图 16-11**\n\n现在你已经对 Web 应用程序和 ASP.NET 有了基本的了解，请执行以下\
  \ Try It Out（尝试一下）中的步骤。\n\n## 练习题\n\n1. 16.1 为了玩纸牌游戏，你需要在浏览器和服务器之间传递哪些信息？\n2. 16.2\
  \ 由于 Web 应用程序是无状态的，请描述一些存储这些信息的方法，以便将其包含在 Web 请求中。\n\n练习题答案可以在附录中找到。\n\n## ![image](img/Image00002.gif)\
  \ 本章所学\n\n| 主题 | 核心概念 |\n| --- | --- |\n| 定义云 | 云是一种用于运行程序的廉用化计算机硬件构成的弹性结构。这些程序运行在混合云、公有云或私有云类型的\
