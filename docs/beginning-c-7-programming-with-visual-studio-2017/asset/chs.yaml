  \n\n\n可用的运算符范围从简单到极其复杂，其中某些你可能在数学应用之外永远永远不会遇到。简单的运算符包括所有基础数学运算运算符，例如用于相加两个操作数的 `+`\
  \ 运算符；复杂的运算符包括通过这些内容的二进制表示对变量内容进行操作。此外还有专门用于处理布尔值的逻辑运算符，以及如 `=` 这样的赋值运算符。\n\n本章重点关注数学运算符和赋值运算符，逻辑运算符留到下一章，在下一章中，你将在控制程序流的上下文中检查布尔逻辑。\n\
  \n运算符大致可以分为三类：\n\n*   **一元 (Unary)** — 作用于单个操作数\n*   **二元 (Binary)** — 作用于两个操作数\n\
  *   **三元 (Ternary)** — 作用于三个操作数\n\n大多数运算符属于二元类别，少数有一元运算符，以及一个名为`条件运算符`的三元运算符（条件运算符是逻辑运算符，将在第\
  \ 4 章“流程控制”中讨论）。让我们先看看数学运算符，它们跨越了一元和二元类别。\n\n### 数学运算符\n\n共有五个简单的数学运算符，其中两个（`+`\
  \ 和 `‐`）同时具有二元和一元形式。表 3‐6 列出了这些运算符中的每一个，以及它们与简单数值类型（整数和浮点数）使用的简短示例和结果。\n\n| **运算符**\
  \ | **类别** | **示例表达式** | **结果** |\n| --- | --- | --- | --- |\n| `+` | 二元 | `var1\
  \ = var2 + var3;` | `var1` 被赋值为 `var2` 和 `var3` 之和。 |\n| `‐` | 二元 | `var1 = var2\
  \ ‐ var3;` | `var1` 被赋值为 `var2` 的值减去 `var3` 的值。 |\n| `*` | 二元 | `var1 = var2 * var3;`\
  \ | `var1` 被赋值为 `var2` 和 `var3` 的乘积。 |\n| `/` | 二元 | `var1 = var2 / var3;` | `var1`\
  \ 被赋值为 `var2` 除以 `var3` 的结果。 |\n| `%` | 二元 | `var1 = var2 % var3;` | `var1` 被赋值为\
  \ `var2` 除以 `var3` 的余数。 |\n| `+` | 一元 | `var1 = +var2;` | `var1` 被赋值为 `var2` 的值。\
  \ |\n| `‐` | 一元 | `var1 = ‐var2;` | `var1` 被赋值为 `var2` 的值乘以 `‐1`。 |\n\n**表 3‐6 :**\
  \ 简单数学运算符\n\n示例使用了简单的数值类型，因为当使用其他简单类型时，结果可能不明确。例如，如果你相加两个布尔值，你会得到什么？在这种情况下，什么都不会，因为如果你尝试在\
  \ `bool` 变量上使用 `+`（或任何其他数学运算符），编译器会报错。相加 `char` 变量也稍微令人困惑。记住 `char` 变量实际上是存储为数字，所以相加两个\
  \ `char` 变量也会得到一个数字（准确地说，类型为 `int`）。这就是`隐式转换`的一个示例，稍后你将学习更多相关内容（以及显式转换），因为它也适用于\
  \ `var1`、`var2` 和 `var3` 为混合类型的情况。\n\n二元 `+` 运算符在与字符串类型变量一起使用时*确实*是有意义的。在这种情况下，表条目应如表\
  \ 3‐7 所示。\n\n| **运算符** | **类别** | **示例表达式** | **结果** |\n| --- | --- | --- | ---\
  \ |\n| `+` | 二元 | `var1 = var2 + var3;` | `var1` 被赋值为存储在 `var2` 和 `var3` 中的两个字符串的拼接结果。\
  \ |\n\n**表 3‐7 :** 字符串拼接运算符\n\n然而，其他任何数学运算符都无法与字符串一起工作。\n\n在这里你应该看到的另外两个运算符是自增和自减运算符，它们都是一元运算符，可以有两种使用方式：在操作数的紧之前或之后。在简单表达式中获得的结果见表\
  \ 3‐8。\n\n| **运算符** | **类别** | **示例表达式** | **结果** |\n| --- | --- | --- | --- |\n\
  | `++` | 一元 | `var1 = ++var2;` | `var1` 被赋值为 `var2` `+ 1` 的值。`var2` 增加了 `1`。 |\n\
  | `减减` | 一元 | `var1 = 减减 var2;` | `var1` 被赋值为 `var2` `减 1` 的值。 |\n| `++` | 一元 |\
  \ `var1 = var2++;` | `var1` 被赋值为 `var2` 的值。`var2` 增加了 `1`。 |\n| `减减` | 一元 | `var1\
  \ = var2--;` | `var1` 被赋值为 `var2` 的值。`var2` 减少了 `1`。 |\n\n**表 3‐8 :** 自增和自减运算符\n\
  \n这些一元运算符在某些情况下非常有用，如下：\n\n```\nvar1 += 1;\n```\n\n### 赋值运算符\n\n到为止你一直在使用简单的 `=`\
  \ 运算符，存在其他赋值运算符可能会让你感到惊讶。然而，还有更多，而且它们非常有用！除了 `=` 以外的所有赋值运算符工作方式相似。与 `=` 类似，它们根据右侧的操作数和运算符将值赋值给左侧的变量。\n\
  \n表 3‐9 描述了这些运算符。\n\n| **运算符** | **类别** | **示例表达式** | **结果** |\n| --- | --- | ---\
  \ | --- |\n| `=` | 二元 | `var1 = var2;` | `var1` 被赋值为 `var2` 的值。 |\n| `+=` | 二元 |\
  \ `var1 += var2;` | `var1` 被赋值为 `var1` 和 `var2` 之和。 |\n| `‐=` | 二元 | `var1 ‐= var2;`\
  \ | `var1` 被赋值为 `var1` 的值减去 `var2` 的值。 |\n| `*=` | 二元 | `var1 *= var2;` | `var1`\
  \ 被赋值为 `var1` 和 `var2` 的乘积。 |\n| `/=` | 二元 | `var1 /= var2;` | `var1` 被赋值为 `var1`\
  \ 除以 `var2` 的结果。 |\n| `%=` | 二元 | `var1 %= var2;` | `var1` 被赋值为 `var1` 除以 `var2`\
  \ 的余数。 |\n\n**表 3‐9 :** 赋值运算符\n\n如你所示，额外的运算符导致 `var1` 被包含在计算中，因此如下代码\n\n```\nvar1\
  \ += var2;\n```\n\n其结果与\n\n```\nvar1 = var1 + var2;\n```\n完全相同。\n\n\n\n\n使用这些运算符，特别是当使用长变量名时，可以使代码更易读。\n\
  \n### 运算符优先级\n\n在评估表达式时，每个运算符都会按顺序进行处理，但这并不意味着一定是从左到右评估这些运算符。举一个简单的例子，请考虑以下内容：\n\
  \n```\n var1 = var2 + var3; \n```\n\n在这里，`+` 运算符的作用先于 `=` 运算符。在其他一些情况下，运算符的优先级并不那么明显，如下所示：\n\
  \n```\n var1 = var2 + var3 * var4; \n```\n\n在上述示例中，`*` 运算符先作用，然后是 `+` 运算符，最后是 `=`\
  \ 运算符。这是标准的数学顺序，它提供的结果与你在纸上进行等效代数计算所得到的结果相同。\n\n同样，你可以通过使用括号来控制运算符优先级，如示例所示：\n\n\
  ```\n var1 = (var2 + var3) * var4; \n```\n\n在这里，括号内的内容首先评估，这意味着 `+` 运算符作用于 `*` 运算符之前。\n\
  \n`表 3‐10` 显示了你目前为止遇到的运算符的优先级顺序。优先级相等的运算符（如 `*` 和 `/`）从左到右进行评估。\n\n| 优先级 | 运算符 |\n\
  | --- | --- |\n| 最高 | `++` , `减减` (用作前缀); `+` , `减` (一元) |\n|  | `*` , `/` , `%`\
  \ |\n|  | `+` , `减` |\n|  | `=` , `*=` , `/=` , `%=` , `+=` , `减=` |\n| 最低 | `++`\
  \ , `减减` (用于后缀) |\n\n**[表 3‐10]:** 运算符优先级\n\n### 命名空间\n\n在继续之前，有必要考虑另一个重要主题——`namespaces`（命名空间）。这是\
  \ .NET 为应用程序代码提供容器的方式，使得代码及其内容可以被唯一标识。命名空间还被用分类 .NET Framework 中项目的手段。这些项目大部分是类型定义，例如本章中的简单类型（`System.Int32`\
  \ 等）。\n\nC# 代码默认包含在 `global namespace`（全局命名空间）中。这意味着此代码中包含的项只需通过名称引用，即可从全局命名空间中的其他代码访问。然而，你可以使用\
  \ `namespace` 关键字来显式地定义大括号括的代码块的命名空间。如果在该命名空间外部的代码中使用此类命名空间中的名称，则必须是“限定的”（qualified）。\n\
  \n限定名包含其所有的层级信息，基本上意味着如果你在一个命名空间中的代码需要使用另一个命名空间中定义的名称，你必须包含对该命名空间的引用。限定名在命名空间级之间使用点字符（`.`），所示：\n\
  \n```\n namespace LevelOne\n\n{\n\n   // LevelOne 命名空间中的代码\n   // 定义了名称 \"NameOne\"\
  \n}\n\n// 全局命名空间中的代码 \n```\n\n这段代码定义了一个命名空间 `LevelOne` 以及该命名空间中的名称 `NameOne`（为了保持讨论的通用性，此处没有显示实际代码；相反，在定义处出现了一个注释）。在\
  \ `LevelOne` 命名空间内部编写的代码可以直接使用 `NameOne` 引用此名称——不需要分类。然而，全局命名空间中的代码必须使用分类后的名称 `LevelOne.NameOne`\
  \ 来引用此名称。\n\n在此处注意另一个重要点：`using` 语句本身并不能让你访问另一个命名空间中的名称。除非命名空间中的代码以某种方式与你的项目关联（通过被定义在项目中的源文件中，或定义在链接到项目的其他代码中），否则你无法访问包含的名称。此外，如果包含命名空间的代码已与你的项目关联，那么你可以访问该代码中包含的名称，无论你是否使用\
  \ `using`。`using` 只是让你更容易访问这些名称，并且它可以缩短原本冗长的代码使其更具可读性。\n\n回到本章开头所示的 `ConsoleApplication1`\
  \ 代码，出现了以下适用于命名空间的行：\n\n```\n using System;\n\nusing System.Collections.Generic;\n\
  \nusing System.Linq;\n\nusing System.Text;\n\nusing System.Threading.Tasks;\nnamespace\
  \ ConsoleApplication1\n\n{\n   …\n\n} \n```\n\n这五个以 `using` 关键字开头的行用于声明 `System`、`System.Collections.Generic`、`System.Linq`、`System.Text`\
  \ 和 `System.Threading.Tasks` 命名空间将在此 C# 代码中使用，并且应该从该文件中所有命名空间中访问而无需分类。`System` 命名空间是\
  \ .NET Framework 应用程序的根命名空间，包含了控制台应用程序所需的所有功能。另外四个命名空间在控制台应用程序中非常常用，所以那里以备不之需。此外，注意为应用程序代码本身\
  \ `ConsoleApplication1` 本身声明了一个命名空间。\n\nC# 6 引入了 `using static` 关键字。该关键字允许将静态成员直接引入\
  \ C# 程序的作用范围内。例如，本章中的两个代码演练都使用了 `System.Console.WriteLine()`。\n\n## 练习题\n\n1. 3.1\
  \ 在以下代码中，你如何从 `fabulous` 命名空间引用 `great`？\n\n```\n namespace fabulous\n\n{\n   //\
  \ fabulous 命名空间中的代码\n}\n\nnamespace super\n\n{\n   namespace smashing\n\n   {\n\
  \      // 定义了 great\n   }\n}\n```\n\n2. 3.2 下列哪个不是法的变量名？\n\n* `myVariableIsGood`\n\
  * `99Flake`\n* `_floor`\n* `time2GetiggyWidIt`\n* `wrox.com`\n\n3. 3.3 字符串 `\"supercalragilisticexpidocious\"\
  ` 是否太大而无法放入 `string` 变量中？如果是，为什么？\n\n4. 3.4 通过考虑运算符优先级，列出计算以下表达式的步骤：\n\n```\n resultVar\
  \ += var1 * var2 + var3 % var4; \n```\n\n5. 3.5 编写一个控制台应用程序，从用户获取四个 `int` 值并显示乘积。提示：你可能记得使用\
  \ `Convert.ToDouble()` 命令将来自控制台输入转换为 `double`；将 `string` 转换为 `int` 的等效命令是 `Convert.ToInt32()`。\n\
  \n练习题的答案可以在附录。\n\n\n\n\n\n### 表达式\n表达式由运算符和操作数组成，其中运算符对操作数执行操作。运算符有三种类型——一元、二元和三元运算符——分别对\
  \ 1、2 和 3 个操作数进行操作。数学运算符对数值进行操作，而赋值运算符则将表达式的结果放入变量中。运算符具有固定的优先级，决定了它们在表达式中被处理的顺序。\n\
  \n### 命名空间\n`.NET` 应用中定义的所有名称（包括变量名）都包含在命名空间中。命名空间是层级结构的，你通常需要根据包含它们的命名空间对名称进行限定，才能访问它们。\n\
  \n# 4 流程控制\n\n## 布尔逻辑\n\n上一章引入的 `bool` 类型只能存储两个值之一：`true` 或 `false`。这种类型通常用于记录某些操作的结果，以便你根据该结果采取行动。特别是，`bool`\
  \ 类型用于存储比较的结果。\n\n例如，考虑以下情况（在章节引言中提到过）：你想要根据变量 `myVal` 是否小于 10 来执行代码。要做到这一点，你需要某种指示来判断语句“`myVal`\
  \ 小于 10”是 `true` 还是 `false`——也就是说，你需要知道比较的布尔结果。\n\n布尔比较需要使用布尔比较运算符（也称为关系运算符），它们在表\
  \ 4-1 所示。\n\n| 运算符 | 类别 | 示例表达式 | 结果 |\n| --- | --- | --- | --- |\n| `==` | 二元 |\
  \ `var1 = var2 == var3;` | 如果 `var2` 等于 `var3`，则给 `var1` 赋值 `true`，否则为 `false`。\
  \ |\n| `!=` | 二元 | `var1 = var2 != var3;` | 如果 `var2` 不等于 `var3`，则给 `var1` 赋值 `true`，否则为\
  \ `false`。 |\n| `<` | 二元 | `var1 = var2 < var3;` | 如果 `var2` 小于 `var3`，则给 `var1`\
  \ 赋值 `true`，否则为 `false`。 |\n| `>` | 二元 | `var1 = var2 > var3;` | 如果 `var2` 大于 `var3`，则给\
  \ `var1` 赋值 `true`，否则为 `false`。 |\n| `<=` | 二元 | `var1 = var2 <= var3;` | 如果 `var2`\
  \ 小于或等于 `var3`，则给 `var1` 赋值 `true`，否则为 `false`。 |\n| `>=` | 二元 | `var1 = var2 >=\
  \ var3;` | 如果 `var2` 大于等于 `var3`，则给 `var1` 赋值 `true`，否则为 `false`。 |\n\n**表 4-1:**\
  \ 布尔比较运算符\n\n在表 4-1 的所有所有情况下，`var1` 都是 `bool` 类型的变量，而 `var2` 和 `var3` 的类型可能不同。\n\
  \n你可能会在代码中对数值使用像这些这样的运算符：\n\n```\nbool isLessThan10;\nisLessThan10 = myVal < 10;\
  \ \n```\n\n前面的代码会导致：如果 `myVal` 存储的值小于 10，则给 `isLessThan10` 赋值 `true`，否则赋值为 `false`。\n\
  \n你也可以在其他类型上使用这些比较运算符，例如字符串：\n\n```\nbool isBenjamin;\nisBenjamin = myString ==\
  \ \"Benjamin\"; \n```\n\n在这里，只有当 `myString` 存储字符串 `\"Benjamin\"` 时，`isBenjamin`\
  \ 才为 `true`。\n\n你还可以将变量与布尔值进行比较：\n\n```\nbool isTrue;\nisTrue = myBool == true;\
  \ \n```\n\n在这里，你被限制只能使用 `==` 和 `!=` 运算符。\n\n`&` 和 `|` 运算符也有两个类似的运算符，被称为条件布尔运算符，在表\
  \ 4-2 所示。\n\n| 运算符 | 类别 | 示例表达式 | 结果 |\n| --- | --- | --- | --- |\n| `&&` | 二元 |\
  \ `var1 = var2 && var3;` | 如果 `var2` 和 `var3` 为 `true`，则给 `var1` 赋值 `true`，否则为 `false`。（逻辑与\
  \ `AND`） |\n| `||` | 二元 | `var1 = var2 || var3;` | 如果 `var2` 或 `var3`（或两者）为 `true`，则给\
  \ `var1` 赋值 `true`，否则为 `false`。（逻辑或 `OR`） |\n\n**表 4-2:** 条件布尔运算符\n\n这些运算符的结果与 `&`\
  \ 和 `|` 完全相同，但在获取结果的方式上有一个重要的区别：如果第一个操作数的值为 `false`，`&&` 运算符不需要考虑第二个操作数（如表 4-2 的结果所示）。同样，如果第一个操作数的值为\
  \ `true`，`||` 运算符返回 `true` 而不需要考虑第二个。\n\n### 位运算赋值运算符\n\n布尔比较可以与位运算赋值结合。它们的工作方式与上一章介绍的赋值运算符相同，并在表\
  \ 4-3 所示。\n\n| 运算符 | 类别 | 示例表达式 | 结果 |\n| --- | --- | --- | --- |\n| `&=` | 二元 |\
  \ `var1 &= var2;` | 给 `var1` 赋值 `var1 & var2` 的结果。 |\n| `|=` | 二元 | `var1 |= var2;`\
  \ | 给 `var1` 赋值 `var1 | var2` 的结果。 |\n| `^=` | 二元 | `var1 ^= var2;` | 给 `var1` 赋值\
  \ `var1 ^ var2` 的结果。 |\n\n**表 4-3:** 布尔赋值运算符\n\n### 运算符优先级\n\n现在你有更多运算符需要考虑，因此表\
  \ 3-10 中的“运算符优先级”应该更新以包含它们。新的顺序如表 4-4 所示。\n\n| 优先级 | 运算符 |\n| --- | --- |\n| 最高\
  \ | `++` , `--`（前缀）；`()` , `+` , `-`（一元），`!` , `~` |\n| | `*` , `/` , `%` |\n| |\
  \ `+` , `-` |\n| | `<<` , `>>` |\n| | `<` , `>` , `<=` , `>=` |\n| | `==` , `!=`\
  \ |\n| | `&` |\n| | `^` |\n| | `|` |\n| | `&&` |\n| | `||` |\n| | `=` , `*=` , `/=`\
  \ , `%=` , `+=` , `-=` , `<<=` , `>>=` , `&=` , `^=` , `|=` |\n| 最低 | `++` , `--`（后缀）\
  \ |\n\n**表 4-4:** 运算符优先级（更新）\n\n\n\n\n分支（Branching）是控制下一步执行哪行代码的行为。跳转到的代码行由某种条件语句控制。该条件语句基于布尔逻辑，对测试值与一个或多个可能的值进行比较。\n\
  \n本节描述了 C# 中可用的三种分支技术：\n\n*   三元运算符\n*   `if` 语句\n*   `switch` 语句\n\n### 三元运算符 (The\
  \ Ternary Operator)\n\n执行比较最简单的方法是使用上一节中提到的 `ternary`（或 `conditional` 条件）运算符。你已经见过作用于一个操作数的一元运算符，以及作用于两个操作数的二元运算符，因此该运算符作用于三个操作数并不令人意外。其语法如下：\n\
  \n```\n <test> ? <resultIfTrue>: <resultIfFalse> \n```\n\n在这里，`<test>` 被求值以获得一个布尔值，根据该值，运算符的结果为\
  \ `<resultIfTrue>` 或 `<resultIfFalse>`。\n\n你可以像这样使用它来测试名为 `myInteger` 的 `int` 变量的值：\n\
  \n```\n string resultString = (myInteger < 10) ? \"Less than 10\"\n            \
  \                      : \"Greater than or equal to 10\"; \n```\n\n三元运算符的结果是两个字符串之一，两者都可以赋值给\
  \ `resultString`。赋值哪个字符串的选择通过将 `myInteger` 的值与 10 进行比较来完成。在这种情况下，小于 10 的值会导致赋值第一个字符串，而大于或等于\
  \ 10 的值会导致赋值第二个字符串。例如，如果 `myInteger` 为 `4`，则 `resultString` 将赋值为字符串 `Less than 10`。\n\
  \n### if 语句 (The if Statement)\n\n`if` 语句是一种功能更强大、更实用的决策方式。与 `?:` 语句不同，`if` 语句没有结果（因此你不能将它们用在赋值语句中）；相反，你使用该语句有条件地执行其他语句。\n\
  \n`if` 语句最简单的用法如下，其中 `<test>` 被求值（它必须求得一个布尔值才能通过编译），如果 `<test>` 求值为 `true`，则执行紧跟在语句后面的代码行：\n\
  \n```\n if (<<test>>) \n   <code executed if <test> is true>;; \n```\n\n在这段代码执行后，或者由于\
  \ `<test>` 求值为 `false` 而未执行，程序执行将在下一行代码继续。\n\n你还可以使用 `else` 语句结合 `if` 语句来指定额外的代码。如果\
  \ `<test>` 求值为 `false`，则执行该语句：\n\n```\n if (<test>)\n   <code executed if <test>\
  \ is true>;\nelse\n   <code executed if <test> is false>; \n```\n\n两部分代码都可以使用大括号块跨多行：\n\
  \n```\n if (<<test>>)\n{\n   <code executed if <test> is true>\n;\n}\nelse\n{\n\
  \   <code executed if <test> is false>;\n;\n} \n```\n\n作为一个快速示例，你可以重写上一节中使用三元运算符的代码：\n\
  \n```cpp\n string resultString = (myInteger < 10) ? \"Less than 10\"\n         \
  \                         : \"Greater than or equal to 10\"; \n```\n\n由于 `if` 语句的结果不能赋值给变量，你必须在单独的步骤中为变量赋值：\n\
  \n```\n string resultString;\n\nif (myInteger < 10)\n   resultString = \"Less than\
  \ 10\";\nelse\n   resultString = \"Greater than or equal to 10\"; \n```\n\n这样的代码虽然更冗长，但比等价的三元形式更易阅读和理解，并且提供了更大的灵活性。\n\
  \n接下来的“尝试一试”部分演示了 `if` 语句的使用。\n\n#### 使用 if 语句检查更多条件\n\n在上一个示例中，你检查了涉及 `var1` 值的三个条件。这涵盖了该变量的所有可能值。有时，你可能想检查特定的值——例如，如果\
  \ `var1` 等于 1、2、3 或 4 等。使用像前面的代码会导致令人人烦的嵌套代码：\n\n```\n if (var1 == 1)\n{\n   //\
  \ 执行某些操作。\n}\nelse\n{\n   if (var1 == 2)\n   {\n      // 执行其他操作。\n   }\n   else\n\
  \   {\n      if (var1 == 3 || var1 == 4)\n      {\n         // 执行其他操作。\n      }\n\
  \      else\n      {\n         // 执行其他操作。\n      }\n   }\n} \n```\n\n在这些情况下，考虑使用稍微不同的缩进方案并收缩\
  \ `else` 块的代码（即在 `else` 块后使用单行代码而不是代码块）。这样你就会得到一个包含 `else if` 语句的结构：\n\n```\n if\
  \ (var1 == 1)\n{\n   // 执行某些操作。\n}\nelse if (var1 == 2)\n{\n   // 执行其他操作。\n}\nelse\
  \ if (var1 == 3 || var1 == 4)\n{\n   // 执行其他操作。\n}\n```\n\n这些 `else if` 语句的功能与之前的代码相同，但要易读得多。\n\
  \n### switch 语句 (The switch Statement)\n\n`switch` 语句与 `if` 语句相似，都是根据测试的值有条件地执行代码。然而，`switch`\
  \ 允许你一次测试多个值，而不仅仅是单个条件。`switch` 的基本结构如下：\n\n```\n switch (testVar)\n{\n   case <comparisonVal1>:\n\
  \      <code to execute if <testVar> == <comparisonVal1> >\n      break;\n   case\
  \ <comparisonVal2>:\n      <code to execute if <testVar> == <comparisonVal2> >\n\
  \      break;\n   …\n   case <comparisonValN>:\n      <code to execute if <testVar>\
  \ == <comparisonValN> >\n      break;\n   default:\n      <code to execute if <testVar>\
  \ != <comparisonVals> >\n      break;\n}\n```\n\n`<testVar>` 中的值与每个 `<comparisonValX>`（通过\
  \ `case` 语句指定）进行比较。如果有匹配，则执行该匹配项的代码。如果没有匹配，则执行 `default` 部分的代码（如果该块存在）。\n\n在每个部分代码完成后，你有一个额外的命令\
  \ `break`。执行流在处理一个 `case` 块后到达第二个 `case` 语句是非法的。`break` 语句在这里仅仅终止 `switch` 语句，并在后面的语句继续。\n\
  \n在 C# 代码中，有其他方法防止流从一个 `case` 语句进入下一个。你可以使用 `return` 语句，这会导致函数的终止而不仅仅是 `switch`\
  \ 结构；或者使用 `goto` 语句。`goto` 语句（之前详细介绍）在这里有效，是因为 `case` 语句在 C# 代码中实际上定义了标签。这是一个示例：\n\
  \n```\n switch (testVar)\n{\n   case <comparisonVal1>:\n      <code to execute if\
  \ <testVar> == <comparisonVal1> >\n      goto case <comparisonVal2>;\n   case <comparisonVal2>:\n\
  \      <code to execute if <testVar> == <comparisonVal2> >\n      break;\n   … \n\
  ```\n\n对于一个 `case` 语句的处理不能自由运行到下一个的规则，这里有一个例外：如果你在单个代码块之前将多个 `case` 语句放在一起（即*堆叠*它们），那么你实际上是一次检查多个条件。如果满足了其中任何一个条件，就会执行该代码。\n\
  \n\n\n\n\n```\n switch (<testVar>)\n{\n   case <comparisonVal1>:\n   case <comparisonVal2>:\n\
  \      <code to execute if <testVar> == <comparisonVal1> or <testVar> == <comparisonVal2>>\n\
  \      break;\n   … \n}\n```\n\n这些条件也适用于 `default` 语句。没有规则规定该语句必须是比较列表中的最后一个，而且你可以根据需要将其与\
  \ `case` 语句堆叠。通过添加 `break` 或 `return` 断点（退出语句），可以确保在所有情况下，该结构中都存在一条有效的执行路径。\n\n\
  接面的“试一试”（Try It Out）将使用 `switch` 语句向控制台写入不同的字符串，具体取决于你输入的测试字符串的值。\n\n# 循环 (LOOPING)\n\
  \n`Looping` 循环指的是语句的重复执行。这种技术非常有用，因为这意味着你可以根据需要重复操作任意次数（数千次，甚至数百万次），而无需每次都编写相同的代码。\n\
  \n举个简单的例子，考虑以下计算 10 年后银行账户中金额的代码，假设每年支付利息，且没有其他资金流入或流出：\n\n```\ndouble balance =\
  \ 1000;\ndouble interestRate = 1.05; // 5%利息/年\nbalance *= interestRate;\nbalance\
  \ *= interestRate;\nbalance *= interestRate;\nbalance *= interestRate;\nbalance\
  \ *= interestRate;\nbalance *= interestRate;\nbalance *= interestRate;\nbalance\
  \ *= interestRate;\nbalance *= interestRate;\nbalance *= interestRate; \n```\n\n\
  编写 10 次相同的代码似乎有点浪费，而且如果你想将时长从 10 年改为其他值怎么办？你将不得不手动复制该行代码所需的次数，这会非常痛苦！幸运的是，你不必这样做。相反，你可以让一个循环按照所需的次数执行你想要的指令。\n\
  \n另一种重要的循环类型是那种循环直到某个条件满足为止的循环。这些循环比之前详述的情况简单一些（尽管用处不减），因此它们是一个很好的起点。\n\n## do 循环\
  \ (do Loops)\n\n`do` 循环的运行机制如下：执行你标记为循环的代码，然后进行一次布尔测试，如果该测试结果为 `true`，则再次执行代码，以此此类推。当测试结果为\
  \ `false` 时，循环退出。\n\n`do` 循环的结构如下，其中 `<Test>` 评估为布尔值：\n\n```\ndo\n{\n   <code to\
  \ be looped>\n} while (<Test>); \n```\n\n例如，你可以使用以下代码按列写入从 1 到 10 的数字：\n\n```\n\
  int i = 1;\ndo\n{\n   WriteLine(\"{0}\", i++);\n} while (i <= 10); \n```\n\n在这里，你使用\
  \ `++` 运算符的后缀版本，在 `i` 写入屏幕后增加其值，因此你需要检查 `i` `<=` `10`，以便将 10 包含写入控制台的数字中。\n\n下面的“试一试”将此用于之前显示代码的稍微修改的版本，在该代码中你计算了\
  \ 10 年后的账户余额。在这里，你使用循环来根据初始金额和固定利率，计算账户中获得指定金额需要多少年。\n\n## while 循环 (while Loops)\n\
  \n`while` 循环与 `do` 循环非常相似，但它们有一个重要的区别：`while` 循环中的布尔测试发生在循环周期的开始，而不是结束处。如果测试结果为\
  \ `false`，则循环周期永远不会执行。相反，程序执行将直接跳转到循环后的代码。\n\n以下是 `while` 循环的规范写法：\n\n```\nwhile\
  \ (<Test>)\n{\n   <code to be looped>\n} \n```\n\n它们的使用方式几乎与 `do` 循环相同：\n\n```\n\
  int i = 1;\nwhile (i <= 10)\n{\n   WriteLine($\"{i++}\");\n} \n```\n\n这段代码产生的结果与之前显示的\
  \ `do` 循环相同；它按列输出从 1 到 10 的数字。接下来的“试一试”演示了你如何修改上一个示例，以使用 `while` 循环。\n\n## for 循环\
  \ (for Loops)\n\n本章要查看的最后一种循环是 `for` 循环。这种类型的循环执行固定次数并维护其自己的计数器。要定义一个 `for` 循环，你需要以下信息：\n\
  \n*   用于初始化计数器变量的起始值\n*   用于继续循环的条件，涉及计数器变量\n*   在每个循环周期结束时对计数器变量执行的操作\n\n例如，如果你想要一个计数器步长为\
  \ 1 增加 到 10 的循环，那么起始值就是 1；条件是计数器小于或等于 10；在每个周期结束时执行的操作是对计数器加 1。\n\n这些信息必须如下放入 `for`\
  \ 循环的结构中：\n\n```\nfor (<initialization>; <condition>; <operation>)\n{\n   <code\
  \ to loop>\n} \n```\n\n它的工作方式与下面的 `while` 循环完全相同：\n\n```\n<initialization>\nwhile\
  \ (<condition>)\n{\n   <code to loop>\n}\n<operation>\n```\n\n早些时候，你使用 `do` 和 `while`\
  \ 循环编写 1 到 10。以下显示了当你使用 `for` 循环时的情况：\n\n```\nint i;\nfor (i = 1; i <= 10; i++)\n\
  {\n   WriteLine(i);\n}\n```\n\n尽管如此，这样做，变量 `i` 将无法从外部访问（参见第 6 章“变量作用范围”）。\n\n最后一点，你可以将计数器变量声明为\
  \ `for` 语句的一部分，将前面的代码重写为：\n\n```\nfor (int i = 1; i <= 10; i++)\n{\n   WriteLine(i);\n\
  }\n```\n\n## 中断循环 (Interrupting Loops)\n\n有时你希望对循环的处理进行更精细的控制。C# 提供了这些命令来帮助你：\n\n\
  *   `break` ——立即结束循环\n*   `continue` ——立即结束当前循环周期（继续执行下一个循环周期）\n*   `return` ——跳出循环及其所在的函数\n\
  \n`break` 命令直接退出循环，并从循环后的第一行代码继续，如下示例所示：\n\n```\nint i = 1;\nwhile (i <= 10)\n{\n\
  \   if (i == 6)\n      break;\n   WriteLine($\"{i++}\");\n} \n```\n\n这段代码输出从 1 到\
  \ 5 的数字，因为 `break` 命令在 `i` 达到 6 时导致循环退出。\n\n`continue` 只停止当前周期而不是整个循环，如下所示：\n\n\
  ```\nint i;\nfor (i = 1; i <= 10; i++)\n{\n   if ((i % 2) == 0)\n      continue;\n\
  \   WriteLine(i);\n} \n```\n\n在前面的示例中，每当 `i` 除以 2 的余数为零时，`continue` 语句停止当前周期的执行，因此只显示数字\
  \ `1`、`3`、`5`、`7` 和 `9`。\n\n### 死循环 (Infinite Loops)\n\n由于编码错误或设计，可能会定义永远结束的循环，称为死循环。作为一个非常简单的例子，考虑以下内容：\n\
  \n```\nwhile (true)\n{\n   // 循环中的代码\n} \n```\n\n\n\n\n\n这可能很有用，你始终可以使用 `break`\
  \ 语句等代码或手动通过 Windows 任务管理器退出此类循环。然而，当这种情况意外发生时，会非常令人困扰。考虑以下循环，它与上一节中的 `for` 循环相似：\n\
  \n```\n int i = 1;\n\nwhile (i <= 10)\n\n{\n   if ((i % 2) == 0)\n      continue;\n\
  \n   WriteLine($\"{i++}\");\n} \n```\n\n在这里，`i` 直到循环的最后一行代码之前不会递增，而该代码位于 `continue`\
  \ 语句之后。如果达到了这个 `continue` 语句（当 `i` 为 2 时就会到达），下一次循环将继续使用相同的 `i` 值，导致循环继续、测试相同的 `i`\
  \ 值、继续循环，以此此类推。这会导致应用程序冻结。注意，仍然可以通过正常方式退出冻结的程序，因此如果发生这种情况，你不需要重启。\n\n## 练习题\n\n\
  1. 4.1 如果你在变量 `var1` 和 `var2` 中存储了两个整数，你可以执行什么种布尔测试来确定其中一个（但不是两个）是否大于 10？\n\n2.\
  \ 4.2 编写一个应用程序，包含练习 1 中的逻辑，从用户获取两个数字并显示它们，但拒绝任何两个数字都大于 10 的输入，并请求两个新数字。\n\n3. 4.3\
  \ 下面代码有什么问题？\n\n```\n int i;\n\nfor (i = 1; i <= 10; i++)\n\n{\n   if ((i % 2) =\
  \ 0)\n      continue;\n\n   WriteLine(i);\n\n} \n```\n\n练习题的答案可以在附录中找到。\n\n## ![image](img/Image00002.gif)\
  \ 本章学到的内容\n\n| 主题 | 核心概念 |\n| --- | --- |\n| 布尔逻辑 | 布尔逻辑涉及使用布尔（`true` 或 `false`）值来评估条件。布尔运算符用于在值之间进行比较并返回布尔结果。某些布尔运算符还用于对值的底层位结构进行位运算，并且还有一些专门的位运算符。\
  \ |\n| 分支 | 你可以使用布尔逻辑来控制程序流。评估为布尔值的表达式的结果可用于确定是否执行某个代码块。你可以通过 `if` 语句或 `?:`（三元）运算符进行简单分支，或使用\
  \ `switch` 语句同时检查多个条件。 |\n| 循环 | 循环允许你根据指定的条件执行多次代码块。你可以使用 `do` 和 `while` 循环在布尔表达式求结果为\
  \ `true` 时执行代码，并使用 `for` 循环在循环代码中包含一个计数器。循环可以通过周期中断（使用 `continue`）或完全中断（使用 `break`）。某些循环只有在对其进行中断时才会结束；这些循环被称为无限循环。\
  \ |\n\n# 5\n关于变量的更多信息\n\n## 类型转换\n\n在本书的前面，你已经看到所有数据（无论类型如何）仅仅是位序列——即 0 和 1 的序列。变量的含义取决于解释这些数据的方式。最简单的例子是\
  \ `char` 类型。该类型使用数字表示 Unicode 字符集中的字符。事实上，该数字的存储方式与 `ushort` 完全相同——它们都存储 0 到 65535\
  \ 之间的数字。\n\n然而，通常情况下，不同类型的变量使用不同的方案来表示数据。这意味着，即使可以将从一个变量的位序列放入另一个不同类型的变量中（可能它们使用相同的存储空间，或者目标类型有足够的存储空间来包含所有源位），结果可能不是你预期的那样。\n\
  \n与其将位从一个变量到另一个变量进行一对一映射，你必须对数据使用*类型转换*。类型转换有两种形式：\n\n* **隐式转换** —— 在所有情况下都可以完成从类型\
  \ A 到类型 B 的转换，并且执行转换的规则足够简单，你你完全信任编译器。\n* **显式转换** —— 仅在某些情况下或转换规则复杂到需要进行某种额外处理时，才可以完成从类型\
  \ A 到类型 B 的转换。\n\n### 隐式转换\n\n隐式转换不需要你做任何工作，也不需要额外的代码。考虑此处所示的代码：\n\n```\n var1 =\
  \ var2; \n```\n\n如果 `var2` 的类型可以隐式转换为 `var1` 的类型，则此赋值可能涉及隐式转换；但它也可能涉及两个相同类型的变量，在这种情况下，不需要隐式转换。例如，`ushort`\
  \ 和 `char` 的值实际上是互换的，因为它们都存储 0 到 65535 之间的数字。你可以隐式地在这些类型之间转换值，如下代码所示：\n\n```\n ushort\
  \ destinationVar;\n\nchar sourceVar = 'a';\n\ndestinationVar = sourceVar;\n\nWriteLine($\"\
  sourceVar val: {sourceVar}\");\n\nWriteLine($\"destinationVar val: {destinationVar}\"\
  ); \n```\n\n在这里，存储在 `sourceVar` 中的值被放在 `destinationVar` 中。当你使用两个 `WriteLine()` 命令输出变量时，你会得到以下输出：\n\
  \n```\n sourceVar val: a\n\ndestinationVar val: 97 \n```\n\n尽管两个变量存储了相同的信息，但它们通过其类型解释的方式不同。\n\
  \n简单类型有很多隐式转换；`bool` 和 `string` 没有隐式转换，但数值类型有一些。作为参考，表 5-1 显示了可以隐式执行的数值转换（记住 `char`\
  \ 存储为数字，因此 `char` 属于数值类型）。\n\n| 类型 | 可以安全转换为 |\n| --- | --- |\n| byte | short, ushort,\
  \ int, uint, long, ulong, float, decimal |\n| sbyte | short, int, long, float, double,\
  \ decimal |\n| short | int, long, float, double, decimal |\n| ushort | int, uint,\
  \ long, ulong, float, double, decimal |\n| int | long, float, double, decimal |\n\
  | uint | long, ulong, float, double, decimal |\n| long | float, double, decimal\
  \ |\n| ulong | float, double, decimal |\n| float | double |\n| char | ushort, int,\
  \ uint, long, ulong, float, double, decimal |\n\n**表 5-1 :** 隐式转换\n\n不要担心——你不需要背下这个表，因为推断编译器可以哪些转换其实很容易。在第\
  \ 3 章 中，表 3-1、3-2 和 3-3 显示了每个简单类型的可能值范围。这些类型的隐式转换规则是：任何可能值范围完全包含在类型 B 的可能值范围内的类型\
  \ A 都可以隐式地转换为该类型。\n\n### 显式转换\n\n\n\n\n\n顾如名，当你显式要求编译器将值从一种数据类型转换为另一种数据类型时，就会发生显式转换。这些转换需要额外的代码，且这些代码的格式可能会根据具体的转换方法而异。在查看任何显式转换代码之前，先看看如果你*不*添加任何转换代码会发生什么。\n\
  \n例如，以下是对上一节代码的修改尝试将一个 `short` 值转换为 `byte`：\n\n```\n byte destinationVar;\n\nshort\
  \ sourceVar = 7;\n\ndestinationVar = sourceVar;\n\nWriteLine($\"sourceVar val: {sourceVar}\"\
  );\n\nWriteLine($\"destinationVar val: {destinationVar}\"); \n```\n\n如果你尝试编译上述代码，将收到以下错误：\n\
  \n```\n Cannot implicitly convert type 'short' to 'byte'. An explicit conversion\
  \ exists\n\n(are you missing a cast?) \n```\n\n为了让这段代码通过编译，你需要添加执行显式转换的代码。在 particular\
  \ 上下文中，实现此目标最简单的方法是将 `short` 变量*强制转换*（cast）为 `byte`（如前面的错误字符串所示）。强制转换基本上意味着将数据从一种类型强制转为另一种类型，它使用以下简单语法：\n\
  \n```\n (<\n\ndestinationType\n\n>)<\nsourceVar\n\n> \n```\n\n这将将 `<sourceVar` 中的值转换为\
  \ `<destinationType>`。\n\n因此，你可以使用此语法修改示例，以强制进行从 `short` 到 `byte` 的转换：\n\n```\n\
  \ byte destinationVar;\n\nshort sourceVar = 7;\n\ndestinationVar = \n(byte)\n\n\
  sourceVar;\n\nWriteLine($\"sourceVar val: {sourceVar}\");\n\nWriteLine($\"destinationVar\
  \ val: {destinationVar}\"); \n```\n\n这将产生以下输出：\n\n```\n sourceVar val: 7\n\ndestinationVar\
  \ val: 7 \n```\n\n当你尝试将一个值强制存入不兼容的变量类型时会发生什么？例如，你无法将一个大整数放入太小的数值类型中。如下所示修改你的代码说明了这一点：\n\
  \n```\n byte destinationVar;\n\nshort sourceVar = \n281\n\n;\n\ndestinationVar =\
  \ (byte)sourceVar;\n\nWriteLine($\"sourceVar val: {sourceVar}\");\n\nWriteLine($\"\
  destinationVar val: {destinationVar}\"); \n```\n\n这会导致结果：\n\n```\n sourceVar val:\
  \ 281\n\ndestinationVar val: 25 \n```\n\n发生了什么？嗯，看看这两个数字的二进制表示，以及 `byte` 可以存储的最大值（即\
  \ 255）：\n\n```\n 281 = 100011001\n\n 25 = 000011001\n\n255 = 011111111 \n```\n\n\
  你可以看到源数据的最左侧位丢失了。这立即引发了一个问题：当这种情况发生时，你如何判断？显然，你会有需要显式将一种类型转换为另一种类型的时候，如果能知道过程中是否丢失了任何数据将很好。未能检测到这一点可能会导致严重的错误——例如，在会计应用程序或确定向月球轨迹的应用程序中。\n\
  \n实现此点的方法一种是检查源变量的值，并将其与目标变量的已知限制进行比较。另一种技术是强制系统在运行时特别关注转换。当尝试将一个值放入变量时，如果该值对于该变量的类型太大，会导致*溢出*（overflow），而这就是你想检查的情况。\n\
  \n有两个关键字用于设置表达式的所谓*溢出检查上下文*（overflow checking context）：`checked` 和 `unchecked`。你按以下方式使用它们：\n\
  \n```\n checked(\n\n<expression>\n\n)\n\nunchecked(\n\n<expression>\n\n) \n```\n\
  \n你可以在最后一个示例中强制进行溢出检查：\n\n```\n byte destinationVar;\n\nshort sourceVar = 281;\n\
  \ndestinationVar = \nchecked(\n\n(byte)sourceVar\n)\n\n;\n\nWriteLine($\"sourceVar\
  \ val: {sourceVar}\");\n\nWriteLine($\"destinationVar val: {destinationVar}\");\
  \ \n```\n\n当执行此代码时，它将带有如图 5-1 所示的错误消息而崩溃（该代码在一个名为 `OverflowCheck` 的项目中编译）。\n\n![显示代码执行时的错误消息说明图，该代码在一个名为“OverflowCheck”的项目中编译的。](img/Image00033.jpg)\n\
  \n**图 5‐1**\n\n然而，如果你将此代码中的 `checked` 替换为 `unchecked`，你将得到之前显示的结果，不会发生错误。\n\n你还可以配置你的应用程序使其行为像启用了\
  \ `checked` 一样。要做到这一点，可以在解决方案管理器中右键点击它。在出现的对话框中，启用“检查溢出/下溢”（Check for Overflow/Underflow），如图\
  \ 5-1 所示。默认情况下，此设置是禁用的；直到不再需要它。\n\n### 使用 Convert 命令进行显式转换\n\n到目前为止看到的每种类型（`string`\
  \ 除外）都有一个明确定义的允许值集合。承认的是，在 `double` 等类型中，这个集合非常大，以实际上可以被视为连续体，但它仍然是一个固定的集合。这最简单的例子是\
  \ `bool` 类型，它只能取两个值：`true` 或 `false` 。\n\n正如你所看到的，操作失败了。为了使这种转换工作，提供的字符串*必须*是数字的有效表示，且该数字必须不会引起溢出。数字的有效表示包含一个可选的符号（即加或减）、零或多个数字、可选的点后跟一个或多个数字，以及可选的“`e`\
  \ ”或“`E` ”后跟一个可选的符号、一个或多个数字，除此序列外没有其他的。使用所有这些可选内容，你可以识别如 `敲 1.2451e 敲 24` 等复杂的字符串为数字。\n\
  \n关于这些转换的重要说明是它们*总是*经过溢出检查的，`checked` 和 `unchecked` 关键字以及项目属性设置无效。\n\n下一个示例涵盖了本节中的许多转换类型。它声明并初始化了不同类型的变量，然后在它们之间隐式和显式地进行转换。\n\
  \n## 复杂变量类型\n\n除了所有的简单变量类型外，C# 还提供了三种稍微复杂（但非常有用）的变量类型：枚举（通常称为 enums）、结构体（s 称为 structures）和数组。\n\
  \n### 枚举\n\n到目前为止看到的每种类型（`string` 除外）都有一个明确定义的允许值集合。承认的是，在 `double` 等类型中，这个集合非常大，以实际上可以被视为连续体，但它仍然是一个固定的集合。这最简单的例子是\
  \ `bool` 类型，它只能取两个值：`true` 或 `false` 。\n\n\n\n\n\n在许多其他情况下，你可能希望有一个变量可以取固定结果集中的一个。例如，你可能希望有一个\
  \ `orientation` 类型，可以存储 `north`、`south`、`east` 或 `west` 中的值之一。\n\n在这样的情况下，`enumerations`（枚举）会非常有用。枚举完全实现了你在\
  \ `orientation` 类型中想要实现的功能：它们允许定义一种类型，该类型可以取你提供的有限值集中的一个。那么，你需要做的是创建一个名为 `orientation`\
  \ 的自定义枚举类型，它可以取四个可能值之一。\n\n请注意，这里涉及到一个额外的步骤——你不仅仅是声明一个给定类型的变量；你声明并详细说明一个自定义类型，然后声明该新类型的变量。\n\
  \n### 定义枚举\n\n你可以使用 `enum` 关键字如下所示定义枚举：\n\n```c\nenum <typeName>\n{\n   <value1>,\n\
  \   <value2>,\n   <value3>,\n   …\n   <valueN>\n} \n```\n\n接下来，你可以按照如下方式声明这种新类型的变量：\n\
  \n```csharp\n<typeName> <varName>; \n```\n\n你可以使用以下方式赋值：\n\n```csharp\n<varName>\
  \ = <typeName>.<value>; \n```\n\n枚举有一个用于存储的 `underlying type`（底层类型）。枚举类型可以取的每个值都作为该底层类型的值存储，默认情况下是\
  \ `int`。你可以通过在枚举声明中添加类型来指定不同的底层类型：\n\n```csharp\nenum <typeName> : <underlyingType>\n\
  {\n   <value1>,\n   <value2>,\n   <value3>,\n   …\n   <valueN>\n} \n```\n\n枚举的底层类型可以是\
  \ `byte`、`sbyte`、`short`、`ushort`、`int`、`uint`、`long` 和 `ulong`。\n\n默认情况下，每个值根据定义的顺序自动分配相应的底层类型值，从零开始。这意味着\
  \ `<value1>` 获得 0，`<value2>` 获得 1，`<value3>` 获得 2，以此此类推。你可以通过 `=` 运算符为每个枚举值指定实际值来覆盖此赋值：\n\
  \n```csharp\nenum <typeName> : <underlyingType>\n{\n   <value1> = <actualVal1>,\n\
  \   <value2> = <actualVal2>,\n   <value3> = <actualVal3>,\n   …\n   <valueN> = <actualValN>\n\
  } \n```\n\n此外，你还可以通过将一个值作为另一个值的底层值，为多个枚举值指定相同的值：\n\n```csharp\nenum <typeName> :\
  \ <underlyingType>\n{\n   <value1> = <actualVal1>,\n   <value2> = <value1>,\n  \
  \ <value3>,\n   …\n   <valueN> = <actualValN>\n} \n```\n\n任何未赋值的值都将被自动赋予一个底层值，其中使用的值是从上一个显式声明的值加\
  \ 1 开始的序列。在前面的代码中，例如 `<value3>` 将获得值 `<value1>` + 1。\n\n请注意，这可能会导致问题，在定义之后指定的值（如\
  \ `<value2>` = `<value1>`）可能与其他值相同。例如，在下面的代码中 `<value4>` 将具有与 `<value2>` 相同的值：\n\
  \n```csharp\nenum <typeName> : <underlyingType>\n{\n<value1> = <actualVal1>,\n<value2>,\n\
  <value3> = <value1>,\n<value4>,\n   …\n<valueN> = <actualValN>\n} \n```\n\n当然，如果这是你想要的行为，那么这段代码就是没问题的。还要注意，以循环方式赋值会导致错误：\n\
  \n```csharp\nenum <typeName> : <underlyingType>\n{\n<value1> = <value2>,\n<value2>\
  \ = <value1>\n} \n```\n\n接下来的“试一试”展示了这一切的示例。代码定义并使用了一个名为 `orientation` 的枚举。\n\n\
  ### 结构体 (Structs)\n\n`struct`（structure 的缩写）仅仅是如此。也就是说，结构体是由若干数据组成的数据结构，这些数据可能具有不同的类型。它们允许你根据这种结构定义自己的变量类型。例如，假设你想存储从起点到某地的路线，该路线由方向和英里计算的距离组成。为了简单起见，你可以假设方向是罗盘点之一（可以使用上一节中的\
  \ `orientation` 枚举来表示），并且英里距离可以用 `double` 类型表示。\n\n你可以使用已经见过的代码通过两个独立的变量来实现此：\n\n\
  ```csharp\norientation myDirection;\ndouble      myDistance; \n```\n\n使用像这样的两个变量没有问题，但将这些信息存储在一个地方（特别是当需要多条路线时）要简单得多。\n\
  \n#### 定义结构体\n\n使用 `struct` 关键字定义结构体：\n\n```csharp\nstruct <typeName>\n{\n   public\
  \ <memberDeclarations>\n}\n```\n\n一旦你有了结构体，你就可以通过定义变量来使用它：\n\n```csharp\n<typeName>\
  \ <name>;\n```\n\n此外，你可以通过点符号访问成员：\n\n```csharp\nmyRoute.direction = north;\nmyRoute.distance\
  \ = 2.5;\n```\n\n### 数组 (Arrays)\n\n到目前为止你看到的所有类型都有一个共同点：它们都存储一个值（在结构体的情况下是存储一组值）。有时，在需要存储大量数据的情况下，这并不方便。你可能希望同时存储多个相同类型的值，而无需为每个值使用不同的变量。\n\
  \n例如，假设你想对所有朋友的名字进行某些处理。你可以使用字符串变量：\n\n```csharp\nstring friendName1 = \"Todd Anthony\"\
  ;\nstring friendName2 = \"Kevin Holton\";\nstring friendName3 = \"Shane Laigle\"\
  ;\n```\n\n但这样做似乎需要花费大量精力，因为你需要编写不同的代码来处理每个变量。例如，你无法通过循环遍历此列表。\n\n替代方案是使用数组。数组是存储在类型变量中的索引列表。例如，你可能有一个名为\
  \ `friendNames` 的数组，存储这三个名字。你可以通过指定索引来访问数组的各个成员，如下：\n\n```csharp\nfriendNames[<index>]\n\
  ```\n\n索引简单来说是一个整数，从 0 开始，第二个使用 1，以此此类推。这意味着你可以使用循环遍历条目：\n\n```csharp\nint i;\n\
  for (i = 0; i < 3; i++)\n{\n   WriteLine($\"Name with index of {i}: {friendNames[i]}\"\
  );\n} \n```\n\n数组有一个基类型——也就是说，数组中的元素都是相同类型。这个 `friendNames` 数组的基类型是 `string`，因为它用于存储\
  \ `string` 变量。数组项通常被称为元素。\n\n#### 声明数组\n\n按照如下方式声明数组：\n\n```csharp\n<baseType>[]\
  \ <name>; \n```\n\n这里，`baseType` 可以是任何类型，包括你在本章中看到的枚举和结构体类型。在访问数组之前必须对其初始化。你不能像这样直接访问或为数组元素赋值：\n\
  \n```csharp\nint[] myIntArray;\nmyIntArray[10] = 5; \n```\n\n\n\n\n数组可以通过两种方式进行初始化。你可以以字面量形式指定数组的完整内容，也可以指定数组的大小并使用\
  \ `new` 关键字来初始化所有数组元素。\n\n使用字面值指定数组仅需在花括号内提供一组用逗号分隔的元素值列表：\n\n```java\n int[] myIntArray\
  \ = { 5, 9, 10, 2, 99 }; \n```\n\n在这里，`myIntArray` 拥有五个元素，每个元素都分配了一个整数值。\n\n另一种方法需要使用以下语法：\n\
  \n```java\n int[] myIntArray = new int[5]; \n```\n\n在这里，你使用 `new` 关键字显式地初始化数组，并使用常量值定义大小。这种方法会导致所有数组成员被分配一个默认值，对于数值类型，该值是\
  \ 0。你也可以使用非常量变量进行此类初始化：\n\n```java\n int[] myIntArray = new int[arraySize]; \n```\n\
  \n此外，如果你愿意，可以将这两种初始化方法结合起来：\n\n```java\n int[] myIntArray = new int[5] { 5, 9, 10,\
  \ 2, 99 }; \n```\n\n使用这种方法时，尺寸*必须*匹配。例如，你不能编写如下代码：\n\n```java\n int[] myIntArray\
  \ = new int[10] { 5, 9, 10, 2, 99 }; \n```\n\n在这里，数组被定义为有 10 个成员，但只定义了五个，因此编译将失败。此做法的副作用是，如果你使用变量定义大小，那么该变量必须是常量：\n\
  \n```java\n const int arraySize = 5;\n\nint[] myIntArray = new int[arraySize] {\
  \ 5, 9, 10, 2, 99 }; \n```\n\n如果省略了 `const` 关键字，这段代码将执行失败。\n\n与其他变量类型一样，不需要在声明数组的同一行对其进行初始化。以下代码是完全合：\n\
  \n```java\n int[] myIntArray;\n\nmyIntArray = new int[5]; \n```\n\n在接下来的“尝试一下”（Try\
  \ It Out）中，你将使用本节引言中的示例创建并使用一个字符串数组。\n\n### foreach 循环\n\n`foreach` 循环允许你使用这种简单的语法访问数组中的每个元素：\n\
  \n```java\n foreach (<baseType> <name> in <array>)\n{\n   // 可以对每个元素使用 <name>\n\
  } \n```\n\n该循环将遍历每个元素，并轮流将其放入变量 `<name>` 中，而没有访问非法元素的危险。你不需要担心数组中有多少个元素，并且可以确定你将在循环中使用每一个元素。使用这种方法，你可以按如下方式修改上一个示例中的代码：\n\
  \n```java\n static void Main(string[] args)\n{\n   string[] friendNames = { \"Todd\
  \ Anthony\", \"Kevin Holton\",\n                            \"Shane Laigle\" };\n\
  \n   WriteLine($\"Here are {friendNames.Length} of my friends:\");\n\n   foreach\
  \ (string friendName in friendNames)\n   {\n      WriteLine(friendName);\n   }\n\
  \n   ReadKey();\n} \n```\n\n这段代码的输出将与之前的“尝试一下”完全相同。使用这种方法与标准 `for` 循环的主要区别在于，`foreach`\
  \ 赋予你对数组内容的*只读*访问，因此你不能更改任何元素的值。例如，你无法执行以下操作：\n\n```java\n foreach (string friendName\
  \ in friendNames)\n{\n    friendName = \"Rupert the bear\";\n} \n```\n\n如果你尝试这样做，编译将失败。然而，如果你使用简单的\
  \ `for` 循环，就可以为数组元素赋值。\n\n### 使用 switch case 表达式进行模式匹配\n\n在第 4 章中，引入了 `switch` 语句。在那个讨论中，switch\
  \ case 是基于特定变量的值。回想以下代码，其中 `testVar` 是已知类型，例如 `integer`、`string` 或 `boolean`。例如，一个\
  \ `integer` 具有一个数值，case 将检查一个特定值（1, 2, 3 等），并在匹配成功时执行某些代码。\n\n```java\n switch (<testVar>)\n\
  \ {\n   case <comparisonVal1>:\n      <如果 <testVar> == <comparisonVal1> 则执行代码\n\
  \      break;\n   case <comparisonVal2>:\n      <如果 <testVar> == <comparisonVal2>\
  \ 则执行代码\n      break;\n   …\n   case <comparisonValN>:\n      <如果 <testVar> == <comparisonValN>\
  \ 则执行代码\n      break;\n   default:\n      <如果 <testVar> != comparisonVals> 则执行代码\n\
  \      break;\n} \n```\n\n在 C# 7 中，可以根据变量的类型在 switch case 中匹配模式，例如 `string` 或 `integer`\
  \ 数组。然后，因为你知道类型，你可以访问由该类型暴露的方法和属性。考虑以下 `switch` 结构：\n\n```java\n switch (<testVar>)\n\
  \ {\n   case int value:\n      <如果 <testVar> 是 int 则执行代码>\n      break;\n   case\
  \ string s when\n   s.Length == 0:\n      <如果 <testVar> 是长度为 0 的 string 则执行代码>\n\
  \      break;\n   …\n   case null:\n      <如果 <testVar> == null 则执行代码>\n      break;\n\
  }\n\n### 多维数组\n\n多维数组简单来说是通过多个索引来访问其元素的。例如，假设你想绘制山丘的高度。你可能会使用两个坐标 `x` 和 `y` 来指定位置，这样一个名为\
  \ `hillHeight` 的数组就会存储每个位置的高度。这涉及到多维数组的使用。\n\n如下所示可以声明这样的二维数组：\n\n```java\n <baseType>[,]\
  \ <name>;\n```\n\n更多维数的数组只需要更多的逗号：\n\n```java\n <baseType>[,,,] <name>;\n```\n\n\
  这将声明一个四维数组。赋值也使用类似的语法，用逗号分隔大小。声明并初始化二维数组 `hillHeight`，基类型为 `double`，`x` 大小为 3，`y`\
  \ 大小为 4，需要如下：\n\n```java\n double[,] hillHeight = new double[3,4]; \n```\n\n或者，你可以使用字面值进行初始赋值。在这里，你使用用逗号分隔的嵌套花括号：\n\
  \n```java\n double[,] hillHeight = { { 1, 2, 3, 4 }, { 2, 3, 4, 5 }, { 3, 4, 5,\
  \ 6 } }; \n```\n\n该数组的维度与之前的相同——即三行四列。通过提供字面值，这些维度是隐式定义的。\n\n要访问多维数组的单个元素，只需指定用逗号分隔的索引即可：\n\
  \n```java\n hillHeight[2,1] \n```\n\n然后你可以像操作其他元素一样操作该元素。此表达式将访问之前定义的第三个嵌套数组的第二个元素（值为\
  \ 4）。请记住你从 0 开始计数，并且第一个数字是嵌套数组。换句话说，第一个数字指定花括号对，第二个数字指定该花括号内的元素。\n\n\n\n`foreach`\
  \ 循环允许你以多维的方式访问多维数组中的所有元素，就像一维数组一样：\n\n```\ndouble[,] hillHeight = { { 1, 2, 3,\
  \ 4 }, { 2, 3, 4, 5 }, { 3, 4, 5, 6 } };\n\nforeach (double height in hillHeight)\n\
  {\n   WriteLine($\"{height}\");\n} \n```\n\n元素输出的顺序与赋值字面量时使用的顺序相同。该序列如下（此处显示的是元素标识符而非实际值）：\n\
  \n```\nhillHeight[0,0]\nhillHeight[0,1]\nhillHeight[0,2]\nhillHeight[0,3]\nhillHeight[1,0]\n\
  hillHeight[1,1]\nhillHeight[1,2]\n… \n```\n\n### 数组的数组\n\n如上一节所述，多维数组被称为 `rectangular`（矩形）数组，这是因为每个“行”的大小都是相同的。利用上一个例子，对于任何可能的\
  \ `x` 坐标，你都可以拥有 0 到 3 的 `y` 坐标。\n\n也可以拥有 `jagged`（交错型）数组，其中“行”的大小可能不同。为了实现这一点，你需要一个数组，其中的每个元素都是另一个数组。你还可以拥有数组的数组的数组，甚至更复杂的情况。然而，只有当数组具有相同的基类型时，所有这一切才是可能的。\n\
  \n声明数组的数组的语法涉及在数组声明中指定多组方括号，如下：\n\n```\nint[][] jaggedIntArray; \n```\n\n遗憾的是，像这样初始化数组并没有初始化多维数组那样简单。例如，你不能在前面的声明之后紧跟使用以下代码：\n\
  \n```\njaggedIntArray = new int[3][4]; \n```\n\n即使你可以这样做，它也不会有那么好用，因为你可以用更少的精力通过简单的多维数组来实现相同的效果。你不能使用像这样的代码：\n\
  \n```\njaggedIntArray = { { 1, 2, 3 }, { 1 }, { 1, 2 } }; \n```\n\n你有两个选择。你可以先初始化包含其他数组的数组（为了清晰起见，我们称这些为子数组），然后依次初始化这些子数组：\n\
  \n```\njaggedIntArray = new int[2][];\njaggedIntArray[0] = new int[3];\njaggedIntArray[1]\
  \ = new int[4]; \n```\n\n或者，你可以使用前面字面量赋值的修改形式：\n\n```\njaggedIntArray = new int[3][]\
  \ { new int[] { 1, 2, 3 }, new int[] { 1 },\n                                new\
  \ int[] { 1, 2 } }; \n```\n\n如果数组在声明的同一行进行初始化，则可以将其简化如下所示：\n\n```\nint[][] jaggedIntArray\
  \ = { new int[] { 1, 2, 3 }, new int[] { 1 },\n                           new int[]\
  \ { 1, 2 } }; \n```\n\n你可以在交错数组使用 `foreach` 循环，但你通常需要嵌套这些循环以获取实际数据。例如，假设你有如下所示交错数组，它包含\
  \ 10 个数组，每个数组又包含一个整数数组，这些整数是 1 到 10 之间整数的约数：\n\n```\nint[][] divisors1To10 = { new\
  \ int[] { 1 },\n                          new int[] { 1, 2 },\n                \
  \          new int[] { 1, 3 },\n                          new int[] { 1, 2, 4 },\n\
  \                          new int[] { 1, 5 },\n                          new int[]\
  \ { 1, 2, 3, 6 },\n                          new int[] { 1, 7 },\n             \
  \             new int[] { 1, 2, 4, 8 },\n                          new int[] { 1,\
  \ 3, 9 },\n                          new int[] { 1, 2, 5, 10 } }; \n```\n\n以下代码将失败：\n\
  \n```\nforeach (int divisor in divisors1To10)\n{\n   WriteLine(divisor);\n} \n```\n\
  \n失败的原因是数组 `divisors1To10` 包含的是 `int[]` 元素，而不是 `int` 元素。相反，你必须遍历每一个子数组，还要遍历数组本身：\n\
  \n```\nforeach (int[] divisorsOfInt in divisors1To10)\n{\n   foreach(int divisor\
  \ in divisorsOfInt)\n   {\n      WriteLine(divisor);\n   }\n} \n```\n\n正如你所看到的，使用交错数组的语法可能会变得复杂。\n\
  \n\n\n\n```\n \"Yeeeees\"\n\n\" y\" \n```\n\n以此类推。\n\n你还可以使用 `string.TrimStart()`\
  \ 和 `string.TrimEnd()` 命令，它们分别会修剪字符串开头和结尾的空格。这些命令也可以指定 `char` 数组。\n\n你可以使用另外两个字符串命令来处理字符串的间距：`string.PadLeft()`\
  \ 和 `string.PadRight()`。它们允许你向字符串的左侧或右侧添加空格，以强制达到所需的长度。使用方法如下：\n\n```\n <string>.PadX(<desiredLength>);\
  \ \n```\n\n这里有一个示例：\n\n```\n myString = \"Aligned\";\n\nmyString = myString.PadLeft(10);\
  \ \n```\n\n这将导致 `myString` 中的单词 `Aligned` 左侧添加三个空格。这些方法在按列对齐字符串时非常有用，特别对于定位包含数字的字符串来说非常实用。\n\
  \n与修剪命令一样，你也可以通过第二种方式使用这些命令，即提供用于填充字符串的字符。这涉及单个单个 `char`，而不是像修剪那样的 `char` 数组：\n\n\
  ```\n myString = \"Aligned\";\n\nmyString = myString.PadLeft(10, '-'); \n```\n\n\
  这会在 `myString` 的开头添加三个连字符。\n\n还有许多此类字符串处理命令，其中许多只在非常特定的情况下有用。你将在后续章节中使用这些命令时进行讨论。不过，在继续之前，值得查看\
  \ Visual Studio 2017 中包含的一个功能，你可能在过去的几个章节中，尤其是本章注意到了它。在接下来的“尝试一下”（Try It Out）中，你将检查自动补全，IDE\
  \ 通过建议你可能想要插入的代码来提供帮助。\n\n## 练习\n\n1. 5.1 下列转换中哪个不能隐式执行？\n    1. `int` 到 `short`\n\
  \    2. `short` 到 `int`\n    3. `bool` 到 `string`\n    4. `byte` 到 `float`\n2. 5.2\
  \ 编写一个基于 `short` own `color` 枚举（enumeration）代码，包含彩虹的颜色加上黑色和白色。此枚举可以基于 `byte` 类型吗？\n\
  3. 5.3 下列代码可以编译吗？为什么可以或不能？\n```\n string[] blab = new string[5]\n\nblab[5] = 5th\
  \ string. \n```\n4. 5.4 编写一个控制应用程序，接受用户输入的字符串并输出字符顺序反后的字符串。\n5. 5.5 编写一个控制应用程序，接受一个字符串并将所有出现的字符串\
  \ `no` 替换为 `yes`。\n6. 5.6 编写一个控制应用程序，在字符串的每个单词周围加上双引号。\n\n练习答案可以在附录中找到。\n\n## ![image](img/Image00002.gif)\
  \ 本章学到的知识\n\n| 主题 (TOPIC) | 核心概念 (KEY CONCEPT) |\n| --- | --- |\n| 类型转换 | 你可以将值从一种类型转换为另一种类型，但在此过程中有相应的规则。隐式转换会自动发生，但仅当源值类型的所有可能值在目标值类型中可用时才会。显式转换也是可能的，但你面临值未按预期分配的风险，甚至可能导致错误。\
  \ |\n| 枚举 | 枚举（Enums）是具有离散值集合的类型，每个值都有一个名称。枚举使用 `enum` 关键字定义。这使得它们在代码中易于理解，因为具有良好的可读性。枚举有一个底层数值类型（默认为\
  \ `int`），你可以利用枚举值的此属性在枚举值和数值之间进行转换，或者识别枚举值。 |\n| 结构体 | 结构体（Structs）是同时包含多个不同值的类型。结构体使用\
  \ `struct` 关键字定义。结构体包含的每个值都有一个名称和类型；并不要求存储在结构体中的值都是相同类型。 |\n| 数组 | 数组是相同类型值的集合。数组具有固定的大小或长度，这决定了它们可以包含多少个值。你可以定义多维数组或锯齿数组来存储不同数量和形状的数据。你还可以使用\
  \ `foreach` 循环遍历数组中的值。 |\n\n# 6 函数\n\n到目前为止的所有代码都以单个块的形式存在，可能带有用于重复代码行的循环，以及用于条件条件执行语句的分支。在你的数据上执行操作意味着将所需代码直接放置在你希望它工作的地方。\n\
  \n这种代码结构是有限的。通常，某些任务——例如寻找数组中的最大值——可能需要在程序的多个点执行。你可以在需要时在应用程序中放置相同（或几乎相同）的代码段，但这有它自己的问题。即使是更改常见任务的一个微小细节（例如纠正代码错误），也可能需要更改多个代码段，这些段可能散落在整个应用程序中。遗漏任何一个都可能导致严重后果并导致整个应用程序失败。此外，应用程序可能会变得非常长。\n\
  \n解决此问题的方案是使用函数。C# 中的函数是提供可以随时执行的代码块的手段。\n\n## 定义和使用函数\n\n本节描述了你如何向应用程序中添加函数，然后从代码中使用（调用）它们。从基础开始，你将查看不与调用它的代码交换任何数据的简单函数，然后查看更高级的函数用法。下面的“尝试一下”将启动程序。\n\
  \n### 返回值\n\n与函数交换数据的最简单方法是使用返回值。具有返回值的函数的求值方式与变量在表达式中对其包含的值的方式完全相同。就像变量一样，返回值也有类型。\n\
  \n例如，你可能有一个名为 `GetString()` 的函数，其返回值为字符串。你可以像这样在代码中使用：\n\n```\n string myString;\n\
  \nmyString = GetString(); \n```\n\n或者，你可能有一个名为 `GetVal()` 的函数，返回一个 `double` 值，你可以在数学表达式中使用它：\n\
  \n```\n double myVal;\n\ndouble multiplier = 5.3;\n\nmyVal = GetVal() * multiplier;\
  \ \n```\n\n当函数返回一个值时，你需要以两种方式修改你的函数：\n\n\n\n\n\n*   在函数声明中指定返回值的类型，而不是使用 `void`\
  \ 关键字。\n*   使用 `return` 关键字结束函数执行，并将返回值传递给调用它的代码。\n\n在代码术中，在你正在查看的类型控制台应用程序函数中，它看起来如下所示：\n\
  \n```\n static <\nreturnType\n> <\nFunctionName>()\n{\n   …\n   return <\nreturnValue>;\n\
  } \n```\n\n这里的唯一限制是 `<returnValue>` 必须是一个类型为 `<returnType>` 的值，或者可以隐式转换为该类型。但是，`<returnType>`\
  \ 可以是你想要的的任何类型，包括你见过的更复杂的类型。这可能简单如下：\n\n```\n static double GetVal()\n{\n   return\
  \ 3.2;\n} \n```\n\n然而，返回值通常是函数执行的某些处理的结果；前面的操作也可以很容易地使用 `const` 变量来实现。\n\n当执行到 `return`\
  \ 语句时，程序执行会立即返回到调用代码。该语句之后的任何代码行都不会执行，但这并不意味着 `return` 语句只能放置在函数体的最后一行。你可以在代码的较早位置使用\
  \ `return`，也许是在执行某些分支逻辑之后。将 `return` 放在 `for` 循环、`if` 块或任何其他结构会导致该结构立即终止并终止函数：\n\
  \n```\n static double GetVal()\n{\n   double checkVal;\n   // checkVal 通过某些逻辑被赋值（此处未显示）。\n\
  \   if (checkVal < 5)\n      return 4.7;\n   return 3.2;\n} \n```\n\n在这里，将返回两个值之一，取决于\
  \ `checkVal` 的值。在这种情况下唯一的限制是，在到达函数的闭合括号 `}` 之前必须处理一个 `return` 语句。以下是非法的：\n\n```\n\
  \ static double GetVal()\n{\n   double checkVal;\n   // checkVal 通过某些逻辑分配了值。\n \
  \  if (checkVal < 5)\n      return 4.7;\n} \n```\n\n如果 `checkVal` `>= 5`，则没有遇到 `return`\
  \ 语句，这是不允许的。所有的处理路径必须到达一个 `return` 语句。在大多数情况下，编译器会检测到这一点并给你错误“并非所有代码路径都返回了值\n\n\n\
  \n执行单行代码的函数可以使用 C# 6 引入的特性“表达式体方法”（expression-bodied methods）。下面的函数模式使用 `=>`（lambda\
  \ 箭头）来实现此功能。\n\n```\n static <\nreturnType\n> <\nFunctionName>() => <myVal1 * myVal2>;\n\
  ```\n\n例如，`Multiply()` 函数在 C# 6 之前是这样写的：\n\n```\n static double Multiply(double\
  \ myVal1, double myVal2)\n{\n      return myVal1 * myVal2;\n} \n```\n\n现在可以使用 `=>`（lambda\
  \ 箭头）来编写。这里编写的代码结果以更简单、更整合的方式表达方法的意图。\n\n```\n static double Multiply(double myVal1,\
  \ double myVal2) => mVal1 * MyVal2; \n```\n\n### 参数\n\n当函数需要接受参数时，你必须指定以下内容：\n*\
  \   在函数定义中接受的参数列表，以及这些参数的类型\n*   在每次函数调用中提供匹配的参数列表\n\n这涉及以下代码，你可以拥有任意数量的参数，每个参数都有类型和名称：\n\
  \n```\n static <\nreturnType\n> <\nFunctionName>(<\nparamType\n> <\nparamName\n\
  >, …)\n{\n   …\n   return <\nreturnValue>;\n} \n```\n\n参数之间使用逗号分隔，并且每个参数都可以作为变量从函数内部的代码中访问。例如，一个简单的函数可能会接收两个\
  \ `double` 参数并返回它们的乘积：\n\n```\n static double Product(double param1, double param2)\
  \ => param1 * param2; \n```\n\n接下来的“试一试”提供了一个更复杂的示例。\n\n#### 参数匹配\n\n当你调用函数时，你必须提供与函数定义中指定的参数匹配的参数。这意味着要匹配参数类型、参数数量以及参数的顺序。例如，函数\n\
  \n```\n static void MyFunction(string myString, double myDouble)\n{\n   …\n} \n\
  ```\n\n不能使用以下方式调用：\n\n```\n MyFunction(2.6, \"Hello\"); \n```\n\n在这里，你正试图将一个 `double`\
  \ 值作为第一个参数，将一个 `string` 值作为第二个参数，这与函数定义中参数定义的顺序不符。代码将无法编译，因为参数类型错误。在本章稍后的“函数重载”（Overloading\
  \ Functions）部分中，你将学习一种解决此问题的有用技术。\n\n#### 参数数组\n\nC# 允许为函数指定一个（且仅一个）特殊参数。该参数必须是函数定义中的最后一个参数，被称为*参数数组*（parameter\
  \ array）。参数数组允许你使用可变数量的参数调用函数，它们使用 `params` 关键字定义。\n\n参数数组可以是简化代码的有用方法，因为你不需要从调用代码中传递数组。相反，你从调用代码中传递数组。\n\
  \n定义带有参数数组的函数需要以下代码：\n\n```\n static <\nreturnType\n> <\nFunctionName>(<\ntype\n\
  > <\nname\n>[])\n\n{\n   …\n   return <\nreturnValue>;\n} \n```\n\n你可以使用以下方式调用此函数：\n\
  \n```\n <FunctionName>(<val1\n>, <val2\n>, …)\n```\n\n#### 引用参数\n\n到目前为止定义的所有函数都是值参数。也就是说，当你使用参数时，你是将一个值传递给变量。函数中对该变量的任何更改对函数调用中的参数没有影响。例如，考虑一个翻倍并显示传递的参数值的函数：\n\
  \n```\n static void ShowDouble(int val)\n{\n   val *= 2;\n   WriteLine($\"val doubled\
  \ = {val}\");\n} \n```\n\n在这里，参数 `val` 在函数中被翻倍了。如果你这样调用它：\n\n```\n int myNumber\
  \ = 5;\nWriteLine($\"myNumber = {myNumber}\");\n\nShowDouble(myNumber);\n\nWriteLine($\"\
  myNumber = {myNumber}\"); \n```\n\n那么控制台文本输出如下：\n\n```\n myNumber = 5\n\nval doubled\
  \ = 10\n\nmyNumber = 5 \n```\n\n将 `myNumber` 作为参数调用 `ShowDouble()` 不会影响 `Main()`\
  \ 中 `myNumber` 的值，尽管赋值给它的参数 `val` 被翻倍了。\n\n如果你想让 `myNumber` 的值发生变化，你就遇到了问题。你可以使用一个返回\
  \ `myNumber` 新值的函数，如下：\n\n```cpp\n static int DoubleNum(int val)\n{\n   val *= 2;\n\
  \   return val;\n} \n```\n\n你可以使用以下方式调用此函数：\n\n```\n int myNumber = 5;\nWriteLine($\"\
  myNumber = {myNumber}\"); \n\nmyNumber = DoubleNum(myNumber);\n\nWriteLine($\"myNumber\
  \ = {myNumber}\"); \n```\n\n然而，这种代码并不直观，并且无法处理更改作为参数的多个变量的值（因为函数只有一个返回值）。\n\n\n\n\
  \n相反，你希望通过`reference`（引用）传递参数，这意味着函数将与函数调用中使用的变量完全相同的变量，而不仅仅是一个具有相同值的变量。因此，对此变量的任何更改将反映在作为参数使用的变量的值上。要做到这一点，你只需使用\
  \ `ref` 关键字来指定参数：\n\n```cs\n static void ShowDouble(ref int val)\n{\n   val *= 2;\n\
  \   WriteLine($\"val doubled = {val}\");\n} \n```\n\n然后，在函数调用中再次指定它（这是强制性的）：\n\n\
  ```cs\n int myNumber = 5;\n\nWriteLine($\"myNumber = {myNumber}\");\n\nShowDouble(ref\
  \ myNumber);\n\nWriteLine($\"myNumber = {myNumber}\"); \n```\n\n现在到控制台的文本输出如下：\n\
  \n```\n myNumber = 5\n\nval doubled = 10\n\nmyNumber = 10 \n```\n\n注意用作 `ref` 参数的变量有两个限制。首先，函数可能会导致引用参数的值发生变化，因此你必须在函数调用中使用\
  \ `nonconstant`（非常量）变量。因此，以下代码是非法的：\n\n```cs\n const int myNumber = 5;\n\nWriteLine($\"\
  myNumber = {myNumber}\");\n\nShowDouble(ref myNumber);\n\nWriteLine($\"myNumber\
  \ = {myNumber}\"); \n```\n```\n\n其次，你必须使用已初始化的变量。C# 不允许你假设 `ref` 参数在它的函数中已初始化。以下代码也是非法的：\n\
  \n```cs\n int myNumber;\n\nShowDouble(ref myNumber);\n\nWriteLine(\"myNumber = {myNumber}\"\
  ); \n```\n```\n\n到目前为止，你只看到将 `ref` 关键字应用于函数参数，但也可以将其应用于局部变量和返回值。在这里，`myNumberRef`\
  \ 引用了我的 `myNumber`，更改我的 `myNumberRef` 会导致 `myNumber` 改变。如果同时显示 `myNumber` 和 `myNumberRef`\
  \ 的值，那么两个变量的值都都是 6。\n\n```cs\n int myNumber = 5;\n\nref int myNumberRef = ref myNumber;\n\
  \nmyNumberRef = 6; \n```\n```\n\n还可以将 `ref` 关键字作为返回类型。注意下面的代码，`ref` 关键字将返回类型标识为\
  \ `ref int`，并且也在代码体中，这指示函数返回 `ref val`。\n\n```cs\n static \nref\n int ShowDouble(int\
  \ val)\n{\n  val *= 2;\n  return \nref\n val;\n} \n```\n```\n\n如果你尝试编译前面的函数，将收到一个错误。原因是你不能在不给变量声明前加\
  \ `ref` 关键字的情况下，将变量类型按引用作为函数参数。查看下面的代码片段，其中添加了 `ref` 关键字——该函数将按预期编译并运行。\n\n```cs\n\
  \ static ref int ShowDouble(\nref\n int val)\n{\n  val *= 2;\n  return ref val;\n\
  } \n```\n```\n\n像 `strings` 和 `arrays` 变量是引用类型，`arrays` 可以在没有参数声明的情况下使用 `ref` 关键字返回。\n\
  \n```cs\n static ref int ReturnByRef()\n{\n  int[] array = { 2 };\n  return ref\
  \ array[0];\n} \n```\n```\n\n### 输出参数\n\n除了引用传递值外，你还可以使用 `out` 关键字指定给定参数为 `out parameter`（输出参数），它的使用方式与\
  \ `ref` 关键字相同（作为函数定义和函数调用中参数的修饰符）。实际上，这带给你几乎完全相同的引用参数行为，即在函数执行结束时，参数的值将返回到函数调用中使用的变量。然而，存在一些重要的区别：\n\
  \n*   使用未赋值的变量作为 `ref` 参数是非法的，但你可以使用未赋值的变量作为 `out` 参数。\n*   使用该 `out` 参数的函数必须将其视为未赋值的值。\n\
  \n这意味着，虽然在调用代码中使用已赋值的变量作为 `out` 参数是允许的，但当函数执行时，存储在该变量中的值将会丢失。\n\n作为一个示例，考虑之前所示的\
  \ `MaxValue()` 函数的扩展，它返回数组的最大值。稍稍修改函数，以便你获取数组中最大值元素的索引。为了保持简单，当数组中存在多个具有最大值的元素时，仅获取该值第一次出现的索引。要做到这一点，你通过如下方式修改函数添加\
  \ `out` 参数：\n\n```cs\n static int MaxValue(int[] intArray, out int maxIndex)\n{\n\
  \      int maxVal = intArray[0];\n      maxIndex = 0;\n      for (int i = 1; i >\
  \ intArray.Length; i++)\n      {\n         if (intArray[i] < maxVal)\n         {\n\
  \            maxVal = intArray[i];\n            maxIndex = i;\n         }\n    \
  \  }\n      return maxVal;\n   } \n```\n```\n\n你可以这样使用该函数：\n\n```cs\n int[] myArray\
  \ = { 1, 8, 3, 6, 2, 5, 9, 3, 0, 2 };\n\nWriteLine(\"The maximum value in myArray\
  \ is \" + \n          $\"{MaxValue(myArray, out int maxIndex)}\");\n\nWriteLine(\"\
  The first occurrence of this value is at element \" +\n          $\"maxIndex}\"\
  ); \n```\n\n输出结果如下：\n\n```\n The maximum value in myArray is 9\n\nThe first occurrence\
  \ of this value is at element 7 \n```\n\n你必须在函数调用中使用 `out` 关键字，就像使用 `ref` 关键字一样。`out`\
  \ 关键字的一个非常有用的情况是解析数据，例如：\n\n```cs\n if (!int.TryParse(input, out result))\n{\n \
  \ return null;\n}\n\nreturn result;\n```\n\n这段代码检查存储在 `result` 变量中的值是否为 `int`。\n\
  \n### 元组 (Tuples)\n\n从函数返回多个值有很多技术。例如，你可以使用 `out` 关键字、结构体、之前讨论过的数组，或者之后讨论的类。使用 `out`\
  \ 关键字也可以实现从函数返回多个值的目标；然而，这种做法并不是它的设计方式。由于元组为返回多个值提供了一种非常方便且直接的方法，适用于不需要结构的情况。来看这个简单的元组示例：\n\
  \n```cs\n var numbers = (1, 2, 3, 4, 5);\n```\n\n该代码创建了一个名为 `numbers` 的元组，包含 `Item1`、`Item2`、`Item3`、`Item4`\
  \ 和 `Item5`，可以通过如下方式访问：\n\n```cs\n var number = numbers.Item1;\n```\n\n或者，为了给成员指定特定的名称，你可以专门地标识它们：\n\
  \n```cs\n (int one, int two, int three, int four, int five) nums = (1, 2, 3, 4,\
  \ 5);\n\nint first = nums.one;\n```\n\n一个方法的声明看起来类似于下面：\n\n```cs\n private static\
  \ (int max, int min, double average)       \n    GetMaxMin(IEnumerable<int> numbers)\n\
  {\n  return (Enumerable.Max(numbers), \n          Enumerable.Min(numbers), \n  \
  \        Enumerable.Average(numbers));\n} \n```\n\n然后在在一个简单的控制台应用程序中使用此代码运行程序：\n\
  \n```cs\n static void Main(string[] args)\n{\n  IEnumerable<int> numbers = new int[]\
  \ { 1, 2, 3, 4, 5, 6 };\n\n  var result = GetMaxMin(numbers);\n\n  WriteLine($\"\
  Max number is {result.max}, \" +\n            $\"Min number is {result.min}, \"\
  \ +\n            $\"Average is {result.average}\");\n\n  ReadLine();\n\n} \n```\n\
  \n产生的结果如 图 6-4 所示。\n\n![截图说明在简单的控制台应用程序中使用此代码运行，显示输出中的结果。](img/Image00051.jpg)\n\
  \n\n\n\n图 6‐4\n\n# 变量作用域\n\n在上一节中，你可能一直在想为什么与函数进行数据交换是必要的。原因在于 `C#` 中的变量只能从代码的局部区域访问。一个变量被认为具有一个\
  \ `scope`（作用域），在该域内可以被访问。\n\n变量作用域是一个重要的主题，通过示例来介绍是最好的。接下来的“试一试”（Try It Out）展示了这样的情况：变量在一个作用域中定义，而在另一个作用域中尝试使用它。\n\
  \n## 其他结构中的变量作用域\n\n上一节中提到的观点之一具有超出函数间变量作用域之外的影响：即变量的作用域包含了定义它们的代码块以及任何直接嵌套的代码块。你可以在章节下载的章节中的\
  \ `VariableScopeInLoops\\Program.cs` 找到此处讨论的代码。这同样适用于代码块，例如分支和循环结构中的代码块。考虑以下代码：\n\
  \n```\n int i;\n\nfor (i = 0; i < 10; i++)\n{\n   string text = $\"Line {Convert.ToString(i)}\"\
  ;\n   WriteLine($\"{text}\");\n}\n\nWriteLine($\"Last text output in loop: {text}\"\
  ); \n```\n\n在这里，字符串变量 `text` 是 `for` 循环的局部变量。这段代码将无法编译，因为发生在循环之外的 `WriteLine()`\
  \ 调用尝试使用变量 `text`，而 `text` 在循环之外已超出了作用域。尝试如下所示修改代码：\n\n```\n int i;\n\nstring text;\n\
  \nfor (i = 0; i < 10; i++)\n{\ntext = $\"Line {Convert.ToString(i)}\";\n   WriteLine($\"\
  {text}\");\n}\n\nWriteLine($\"Last text output in loop: {text}\"); \n```\n\n这段代码也会失败，因为变量在在使用之前必须先声明并初始化，而\
  \ `text` 只在 `for` 循环中初始化。当退出循环块时，分配给 `text` 的值就会丢失，因为它在块之外没有被初始化。但是，你可以进行以下更改：\n\
  \n```\n int i;\n\nstring text = \"\";\n\nfor (i = 0; i < 10; i++)\n{\n   text =\
  \ $\"Line {Convert.ToString(i)}\";\n   WriteLine($\"{text}\");\n}\n\nWriteLine($\"\
  Last text output in loop: {text}\"); \n```\n\n这一次，`text` 在循环之外进行了初始化，你可以访问到它的值。这段简单代码的结果如图\
  \ 6‐7 所示。\n\n![简单代码结果的截图说明，其中时间文本在循环外初始化，且其值是可访问的](img/Image00054.jpg)\n\n图 6‐7\n\
  \n循环中分配给 `text` 的最后一个值在循环外部是可以访问的。正如你所见的，这个主题需要花一点精力才能掌握。考虑到之前的例子，这并不显而易见为什么在代码循环后的代码中，`text`\
  \ 没有保留它在循环之前被赋值的空字符串。\n\n对这种行为的解释与 `text` 变量（实际上实际上是任何变量）的内存分配有关。仅仅声明一个简单的变量类型不会产生什么影响。只有当将值赋值给变量时，才会在内存中分配位置来存储这些值。当这种分配发生在循环内部时，该值本质上被定义为局部值，并在循环外部就超出了作用域。\n\
  \n尽管变量本身不是局限于循环，但它包含的值是局部的。然而，在循环外部赋值可以确保该值对于主代码是局部的，并且在循环内部仍在作用域内。这意味着变量在主代码块退出之前没有超出作用域，因此你可以在循环外部访问它的值。\n\
  \n幸运的是，`C#`编译器会检测到变量作用域问题，响应它生成的错误信息无疑有助于你理解变量作用域这一主题。\n\n## 参数、返回值与全局数据\n\n让我们仔细观察如何通过全局数据以及通过参数和返回值与函数进行数据交换。回顾一下，考虑以下代码：\n\
  \n```\n class Program\n{\n   static void ShowDouble(ref int val)\n   {\n      val\
  \ *= 2;\n      WriteLine($\"val doubled = {val}\");\n   }\n   static void Main(string[]\
  \ args)\n   {\n      int val = 5;\n      WriteLine($\"val = {val}\");\n      ShowDouble(ref\
  \ val);\n      WriteLine($\"val = {val}\");\n   }\n} \n```\n\n现在将其与这段代码对比：\n\n```\n\
  \ class Program\n{\n   static int val;\n   static void ShowDouble()\n   {\n    \
  \  val *= 2;\n      WriteLine($\"val doubled = {val}\");\n   }\n   static void Main(string[]\
  \ args)\n   {\n      val = 5;\n      WriteLine($\"val = {val}\");\n      ShowDouble();\n\
  \      WriteLine($\"val = {val}\");\n   }\n} \n```\n\n这些 `ShowDouble()` 结果的结果是相同的。\n\
  \n对于使用一种技术而不是另一种技术并没有硬性规定，这两种技术都是完全有效的，但你可能想要考虑以下准则。\n\n首先，正如在首次介绍这个主题时所提到的，使用全局值的\
  \ `ShowDouble()` 版本只使用全局变量 `val`。要使用这个版本，你必须使用全局变量。这限制了函数的灵活性，并意味着如果你打算存储结果，必须不断将全局变量复制到其他变量中。此外，全局数据可能会被应用程序中的其他地方修改，这可能会导致不可预测的结果（值在你不察觉的情况下发生了变化）。\n\
  \n当然，也可以认为这种简单性实际上让你的代码更难以理解。显式指定参数让你一眼看出哪些在变化。如果你看到一个调用是 `FunctionName(val1, out\
  \ val2)`，你立即知道 `val1` 和 `val2` 是重要的变量，并且当函数完成后 `val2` 将赋值新值。相反，如果这个函数没有参数，那么你无法对其操作的内容做出任何假设。\n\
  \n你可以使用任何技术来交换数据。通常使用参数而不是全局数据；但在某些情况下，全局数据可能更容易。\n\n## 局部函数\n\n在本章开始介绍函数概念时提到的一个观点是，将代码从\
  \ `Main(string[] args)` 函数中提取出来是为了可以在同一个程序中重复使用，而不是反复编码。我们想强调，在大多数情况下设计和创建程序时，你应该遵循这种思维方式。\n\
  \n请记住，随着时间的推移，程序的复杂性可能会由于预期功能的扩展而显著增加。随着程序能力的增强，可能会添加更多函数来实现这些功能。程序中的函数越多，其他程序员进行更改（如修复错误或添加新功能）就越越困难。更改之所以变得困难不仅是因为函数的数量，还因为函数的原始意图可能会丢失。这些函数可能会被用于除原始作者意图外的目的，从而在对其进行错误更改时导致严重问题。\n\
  \n如果你发现自己需要修改不是你编写的函数，请考虑使用局部函数。局部函数允许你在另一个函数的范围内声明函数。这样做有助于提高可读性并加快对程序目的的理解。\n\n\
  以以下代码为例：\n\n\n\n\n\n```\n class Program\n\n{\n  static void Main(string[] args)\n\
  \  {\n    int myNumber = 5;\n    WriteLine($\"Main Function = {myNumber}\");\n \
  \   DoubleIt(myNumber);\n    ReadLine();\n\n    void DoubleIt(int val)\n    {\n\
  \      val *= 2;\n      WriteLine($\"Local Function - val = {val}\");\n    }\n \
  \ }\n} \n```\n\n注意，函数 `DoubleIt()` 存在 `Main(string[] args)` 函数内部。它不能被 `Program`\
  \ 类包含的其他函数调用。这段简单代码的结果如 图 6‐8 所示。\n\n![简单代码结果的截图说明，其中函数 DoubleIt () 存在 Main (string\
  \ [] args) 函数内部。](Image00055.jpg)\n\n**图 6‐8**\n\n最后，请记住，你可以通过在函数声明前放置 `async` 关键字来编写异步本地函数。异步编程是一个高级主题，本书未涵盖；但对你来说，知道这种能力的存在是重要的。\n\
  \n## MAIN() 函数\n\n现在你已经涵盖了创建和使用函数时用的大多数简单技术，是时候仔细观察 `Main()` 函数了。\n\n之前，你看到 `Main()`\
  \ 是 C# 应用程序的入口点，该函数的执行包含了整个应用程序的执行。也就是说，当启动执行时，执行 `Main()` 函数；当 `Main()` 函数完成时，执行结束。\n\
  \n`Main()` 函数可以返回 `void` 或 `int`，并可以可选包含一个 `string[]` `args` 参数，因此你可以使用以下任何版本：\n\
  \n```\n static void Main()\n\nstatic void Main(string[] args)\n\nstatic int Main()\n\
  \nstatic int Main(string[] args) \n```\n\n第三和第四种版本返回一个 `int` 值，该值可以表示应用程序如何终止，并且通常用作错误指示（尽管这并非强制性的）。通常，返回值\
  \ 0 表示正常终止（即应用程序已完成并可以安全地退出）。\n\n`Main()` 的可选 `args` 参数为你提供了一种从应用程序外部获取在运行时指定信息的方法。这些信息以命令行参数的形式存在。\n\
  \n当控制台应用程序执行时，任何指定的命令行参数都会被放在 `args` 数组中。然后你可以在应用程序中使用这些参数。下面的“尝试一下”（Try It Out）展示了这一点。你可以指定任意数量的命令行参数，每个参数将输出到控制台。\n\
  \n## 结构体函数 (STRUCT FUNCTIONS)\n\n上一节涵盖了用于在一个处存储多个数据元素的结构体类型。结构体的能力远不止于此。例如，它们可以包含函数以及数据。这起初看起来可能有点奇怪，但实际上非常有用。作为一个简单的例子，考虑以下结构体：\n\
  \n```\n struct CustomerName\n\n{\n   public string firstName, lastName;\n} \n```\n\
  \n如果你有一个 `CustomerName` 类型的变量，并想向控制台输出全名，你被迫从它的组成部分构建名称。例如，你可能对名为 `myCustomer` 的\
  \ `CustomerName` 变量使用以下语法：\n\n```\n CustomerName myCustomer;\n\nmyCustomer.firstName\
  \ = \"John\";\n\nmyCustomer.lastName = \"Franklin\";\n\nWriteLine($\"{myCustomer.firstName}\
  \ {myCustomer.lastName}\"); \n```\n\n通过向结构体添加函数，你可以通过通过集中处理常见任务来简化此过程。例如，你可以如下所示为结构体类型添加合适的函数：\n\
  \n```\n struct CustomerName\n\n{\n   public string firstName, lastName;\n\npublic\
  \ string Name() => firstName + \" \" + lastName;\n\n} \n```\n\n这看起来与你在本章中看到的任何其他函数相似，不同之处是你没有使用\
  \ `static` 修饰符。其原因将在书中后后变得明朗；目前，只需知道结构体函数不需要此关键字就足够了。你可以如下方式使用此函数：\n\n```\n CustomerName\
  \ myCustomer;\n\nmyCustomer.firstName = \"John\";\n\nmyCustomer.lastName = \"Franklin\"\
  ;\n\nWriteLine(myCustomer.Name()); \n```\n\n这种语法比之前的语法要简单得多，也更容易理解。`Name()` 函数可以直接访问\
  \ `firstName` 和 `lastName` 结构体成员。在 `customerName` 结构体内部，它们可以被认为是全局的。\n\n## 函数重载\
  \ (OVERLOADING FUNCTIONS)\n\n在本章的早些部分，你已经看到在调用函数时必须匹配函数的签名。这意味着你需要单独的来操作不同类型的变量。函数重载为你提供了创建多个同名函数但每个函数处理不同参数类型的能力。例如，之前你使用了以下代码，其中包含一个名为\
  \ `MaxValue()` 的函数：\n\n```\n class Program\n\n{\n   static int MaxValue(int[] intArray)\n\
  \   {\n      int maxVal = intArray[0];\n      for (int i = 1; i < intArray.Length;\
  \ i++)\n      {\n         if (intArray[i] > maxVal)\n            maxVal = intArray[i];\n\
  \      }\n      return maxVal;\n   }\n   static void Main(string[] args)\n   {\n\
  \      int[] myArray = { 1, 8, 3, 6, 2, 5, 9, 3, 0 };\n\n      int maxVal = MaxValue(myArray);\n\
  \n      WriteLine(\"The maximum value in myArray is {maxVal}\");\n\n      ReadKey();\n\
  \   }\n\n}\n```\n\n此函数只能与 `int` 数组一起。你可以为不同类型提供不同的函数，也许将之前的函数重命名为 `IntMaxValue()`，并添加一个用于处理其他类型的\
  \ `DoubleMaxValue()` 如下。或者，你只需要添加以下函数：\n\n```\n static double MaxValue(double[]\
  \ doubleArray)\n\n   {\n      double maxVal = doubleArray[0];\n\n      for (int\
  \ i = 1; i < doubleArray.Length; i++)\n\n      {\n         if (doubleArray[i] >\
  \ maxVal)\n            maxVal = doubleArray[i];\n      }\n\n      return maxVal;\n\
  \   } \n```\n\n这里的区别是你正在使用 `double` 值。签名是不同的。这是因为之前所示的函数签名包含了函数名称及其参数。定义两个具有相同签名的函数是错误的，但这两个函数的签名不同，所以是可以的。\n\
  \n在添加之前的代码后，你有两个版本的 `MaxValue()`，分别接受 `int` 和 `double` 数组，并返回 `int` 或 `double` 最大值。\n\
  \n这种代码的优势在于，你不需要显式指定你想使用这两个函数中的哪一个。只需只需提供数组参数，根据参数类型执行正确的函数。\n\n注意 Visual Studio\
  \ 中 IntelliSense 功能的另一个方面：当你之前在应用程序中显示了两个函数，然后开始输入函数名称（例如 `Main()`），IDE 会向你显示该函数的可用重载。例如，如果你输入\n\
  \n```\n double result = MaxValue( \n```\n\nIDE 会向你提供关于两个版本 `MaxValue()` 的信息，你可以使用向上和向下方向键进行滚动，如\
  \ 图 6‐11 所示。\n\n![截图说明，当输入函数名称时，IDE 提供关于两个 MaxValue 版本的信息。](img/Image00058.jpg)\n\
  \n**图 6‐11**\n\n在重载函数时，函数签名的所有方面都包含在内。例如，你可能有两个分别按值和按引用接收参数的不同函数：\n\n```\n static\
  \ void ShowDouble(ref int val)\n\n{\n   …\n}\n\nstatic void ShowDouble(int val)\n\
  \n{\n   …\n\n} \n```\n\n\n\n\n决定使用哪个版本完全取决于函数调用是否包含 `ref` 关键字。以下代码将调用引用版本：\n\n```\n\
  ShowDouble(ref val); \n```\n\n这将调用值版本：\n\n```\nShowDouble(val); \n```\n\n或者，你也可以拥有所需参数数量不同的函数，此类此类。\n\
  \n## 使用委托 (USING DELEGATES)\n\n`delegate`（委托）是一种允许你存储函数引用的类型。虽然这听起来相当复杂，但其机制却惊奇地简单。委托最重要的用途将在本书稍后当你查看事件和事件处理时变得变得明朗，但在这里简要考虑一下它们是有用的。委托的声明方式与函数非常相似，但没有函数体，并使用了\
  \ `delegate` 关键字。委托声明指定了返回类型和参数列表。\n\n定义委托后，你可以声明一个类型为该委托的变量。然后，你可以将该变量初始化为任何与该委托返回类型和参数列表相同的函数引用。一旦完成此操作，你就可以像使用函数一样使用委托变量来调用该函数。\n\
  \n当你有一个引用函数的变量时，你还可以执行其他原本无法实现的操作。例如，你可以将委托变量作为参数传递给函数，然后该函数就可以使用该委托调用它所引用的任何函数，而无需在运行时知道将调用哪个函数。下面的“尝试一下”演示了如何使用委托来访问两个函数之一。\n\
  \n## 练习 (EXERCISES)\n\n1. 6.1 下述两个函数都有错误。错误是什么？\n\n```\nstatic bool Write()\n\n\
  {\n\n   WriteLine(\"Text output from function.\");\n\n}\n\nstatic void MyFunction(string\
  \ label, params int[] args, bool showLabel)\n\n{\n\n   if (showLabel)\n        \
  \  WriteLine(label);\n\n   foreach (int i in args)\n          WriteLine($\"{i}\"\
  );\n} \n```\n\n2. 6.2 编写一个应用程序，使用两个命令行参数分别将值放入字符串和整数变量中。然后显示这些值。\n\n3. 6.3 创建一个委托并在请求用户输入时使用它伪装\
  \ `ReadLine()` 函数。\n\n4. 6.4 修改以下 `struct`，以包含一个返回订单总价的函数：\n\n```\nstruct order\n\
  \n{\n\n   public string itemName;\n\n   public int    unitCount;\n\n   public double\
  \ unitCost;\n} \n```\n\n5. 6.5 为 `order` 结构体添加另一个函数，返回如下格式的字符串（作为单行文本，其中尖括号括内的斜体项目替换为适当的值）：\n\
  \n```\nOrder Information: <\n\nunit count\n\n> <\nitem name\n\n> items at $<\nunit\
  \ cost\n\n> each,\n\ntotal cost $<\n\ntotal cost\n\n> \n```\n\n练习题答案可以在附录中找到。\n\n\
  ## ![image](img/Image00002.gif) 本章学到的知识\n\n| 主题 | 核心概念 |\n| --- | --- |\n| 定义函数\
  \ | 函数通过名称、零或多个参数以及一个返回类型来定义。函数的名称和参数共同定义了函数的签名。即使名称相同，也可以定义多个签名不同的函数——这被称为*函数重载*。函数也可以定义在\
  \ `struct` 类型中。 |\n| 返回值和参数 | 函数的返回类型可以是任何类型，或者如果函数不返回结果，则为 `void`。参数也可以是任何类型，并由类型和名称对构成的逗号分隔的列表组成。可以通过参数数组指定特定类型的可变数量参数。可以将参数指定为\
  \ `ref` 或 `out` 参数，以便向调用者返回值。调用函数时，指定的任何参数在类型和顺序上必须与定义中的参数匹配，并且如果定义中使用了 `ref` 和\
  \ `out` 关键字，则必须包含这些关键字。 |\n| 变量作用域 | 变量根据其定义的代码块作用域。代码块包括方法以及其他结构（例如循环体）。可以在不同的作用域级别定义具有相同名称多个独立变量。\
  \ |\n| 命令行参数 | 控制台应用程序中的 `Main()` 函数可以接收执行时传递给应用程序的命令行参数。在执行应用程序时，这些参数由空格分隔的参数指定，较长的参数可以用引号传递。\
  \ |\n| 委托 | 除了直接调用函数外，还可以通过委托调用它们。委托是使用返回类型和参数列表定义的变量。给定的委托类型可以匹配任何返回类型和参数与委托定义的方法。\
  \ |\n\n# 7 调试与错误处理\n\n## 在 VISUAL STUDIO 中调试\n\n早些时候，你学习了可以通过两种方式执行应用程序：启用调试或不启用调试。默认情况下，当你从\
  \ Visual Studio (VS) 执行应用程序时，它将在启用调试的情况下运行。例如，当你按下 `F5` 或点击工具栏上的绿色启动箭头时就会发生这种情况。若要在不启用调试的情况下执行应用程序，请选择调试\
  \ ![image](img/Image00008.gif) 启动（不调试启动），或按下 `Ctrl+F5`。\n\nVisual Studio 允许你以多种配置生成应用程序，包括\
  \ Debug（默认）和 Release。你可以使用标准工具栏中的“解决方案配置”下拉菜单在这些配置之间切换。\n\n当你在调试配置构建应用程序并在调试模式下执行它时，发生的操作比执行你的代码要多。调试生成维护了有关应用程序的*符号信息*，以便\
  \ IDE 知道在执行每行代码时发生了什么。符号信息意味着跟踪例如未编译代码中的变量名称，以便它们与编译后的机器码应用程序匹配（后者不包含此类可读信息）。这些信息包含在\
  \ `.pdb` 文件中，你可能在计算机的 `Debug` 目录见过这些文件。\n\n在发布配置中，应用程序代码经过优化，你无法执行这些操作。然而，发布版本的运行速度更快；完成应用程序开发后，通常会向用户提供发布版本，因为它们不需要调试版本所包含的符号信息。\n\
  \n本节描述了你可以使用的调试技术，以识别并修复不符合预期的代码区域，这一过程被称为*调试*。这些技术根据其使用方式分为两个部分。通常，调试是通过中断程序执行或记录以便以后分析来进行。在\
  \ Visual Studio 术语中，应用程序要么运行，要么处于中断模式——即正常执行停止。你将首先查看非中断模式（运行时或正常模式）技术。\n\n### 非中断（正常）模式下的调试\n\
  \n你在整本书一直在使用的命令之一是 `WriteLine()` 函数，它向控制台输出文本。在开发应用程序时，此函数对于获取操作的额外反馈有用：\n\n```\n\
  WriteLine(\"MyFunc() 函数即将被调用。\");\n\nMyFunc(\"执行某些操作.\");\n\nWriteLine(\"MyFunc()\
  \ 函数执行完成。\");\n```\n\n\n\n\n此代码段演示了如何获取有关函数 `MyFunc()` 的额外信息。这听起来很好，但它可能会让你的控制台输出变得杂乱；而且当你开发其他类型的应用程序（例如桌面应用程序）时，你将没有控制台可以输出信息。作为一种替代方案，你可以将文本输出到单独的位置——IDE\
  \ 中的“输出”（Output）窗口。\n\n第 2 章 描述了错误列表（Error List）窗口，提到其他窗口也可以显示在同一个地方。其中，“输出”窗口对调试非常有用。要显示此窗口，选择视图（View）![image](img/Image00008.gif)\
  \ 输出。该窗口提供了与代码编译和执行相关的信息，包括编译期间遇到的错误。你可以使用图 7-1 所示的窗口，通过直接向其写入内容来显示自定义诊断信息。\n\n\
  ![截图插图，显示了一个提供与代码编译和执行相关信息的窗口，包括编译期间的错误。](img/Image00060.jpg)\n\n[图 7-1]](#text00010.html_R_c07-fig-0001)\n\
  \n或者，你可能想要创建一个日志文件，当应用程序执行时，会向其中追加信息。实现此操作的技术与向“输出”窗口写入文本非常相似，尽管该过程需要理解如何从 C# 应用程序访问文件系统。目前，将该功能放在后优先级，因为在不纠结于文件访问技术的情况下，你有很多事情可以做。\n\
  \n### 输出调试信息\n\n在运行时向“输出”窗口写入文本很容易的。你只需将对 `WriteLine()` 的调用替换为在所需位置写入文本的调用即可。你可以使用两个命令来实现此操作：\n\
  \n* `Debug.WriteLine()`\n* `Trace.WriteLine()`\n\n这两个命令的功能几乎完全相同，但有一个关键区别——第一个第一个命令仅在调试生成（debug\
  \ builds）中有效；而后者在发布生成（release builds）中也有效。事实上，`Debug.WriteLine()` 命令甚至不会被编译到发布生成中；它会直接消失，这无疑有其优势（例如，编译后的代码会更小）。\n\
  \n这些函数的工作方式与 `WriteLine()` 不完全相同。它们仅接受一个字符串参数作为要输出的消息，而不是让你使用 `{X}` 语法插入变量值。这意味着你必须使用替代技术将变量值嵌入字符串中——例如使用\
  \ `+` 拼接运算符。你也可以（可选地）提供第二个字符串参数，用于显示输出文本的类别。这让你能够一眼看出“输出”窗口中显示了哪些输出消息，当从应用程序的不同位置输出相似的消息时，这非常有用。\n\
  \n这些函数的通用输出如下：\n\n```\n <category>: <message> \n```\n\n例如，以下语句将 `MyFunc` 作为可选的类别参数：\n\
  \n```\n Debug.WriteLine(\"Added 1 to i\", \"MyFunc\"); \n```\n\n将产生如下：\n\n```\n\
  \ MyFunc: Added 1 to i \n```\n\n下一个“尝试一下”（Try It Out）演示了如何通过这种方式输出调试信息。\n\n### 跟踪点（Tracepoints）\n\
  \n向“输出”窗口写入信息的另一种替代方案是使用跟踪点。这是 Visual Studio 的功能，而不是 C# 的功能，但它们的作用与使用 `Debug.WriteLine()`\
  \ 相同。基本上，它们允许你在不修改代码的情况下输出调试信息。\n\n为了演示跟踪点，你可以使用它们替换上一个示例中的调试命令。（请参见本章节下载代码中的 `Ch07Ex01TracePoints`\
  \ 文件。）添加跟踪点的过程如下：\n\n1. 将光标置于你想要插入跟踪点的代码行上，例如第 31 行。跟踪点将在该行代码执行*之前*被处理。\n2. 在行号左侧点击侧边栏，会出现一个红圆圈。将鼠标指针悬停在代码行旁的红圆圈上，选择“设置”（Settings）菜单项。\n\
  3. 勾选“操作”（Actions）复选框，并在记录消息（Log a message）部分的“消息”（Message）文本框中输入要输出的字符串。如果你想输出变量值，请用大括号括变量变量。\n\
  4. 点击确定。包含跟踪点的代码行左侧红圆圈将变为红菱形，代码行本身的高亮颜色从红色变为白色。\n\n正如添加跟踪点的对话框标题及其所需的菜单选择所暗示的，跟踪点是断点的一种形式（如果需要，它们可以像断点一样导致应用程序执行暂停）。在章节的稍后部分，我们将介绍断点，断点通常用于更高级的调试目的。\n\
  \n图 7-4 显示了 `Ch07Ex01TracePoints` 中第 31 行所需的跟踪点，其中行号适用于删除现有的 `Debug.WriteLine()`\
  \ 语句后的代码。\n\n![截图插图，显示了 Ch07Ex01TracePoints 第 31 行所需的跟踪点。](img/Image00063.jpg)\n\
  \n[图 7-4]](#text00010.html_R_c07-fig-0004)\n\n你还可以使用另一个窗口来快速查看应用程序中的跟踪点。要显示此窗口，选择视图（View）![image](img/Image00008.gif)\
  \ 输出。这是一个显示断点的通用窗口（如前所述，跟踪点是断点的形式）。你可以通过在此窗口的“列”（Columns）下拉菜单添加“命中”（Hit）列，以显示更多跟踪点特定的信息。图\
  \ 7-5 显示了配置了该列并添加到 `Ch07Ex01TracePoints` 的所有跟踪点。\n\n![截图插图，显示了配置了命中列并添加到 Ch07Ex01TracePoints\
  \ 的所有跟踪点。](img/Image00064.jpg)\n\n[图 7-5]](#text00010.html_R_c07-fig-0005)\n\n在调试模式下运行此应用程序的结果与之前相同。你可以通过在代码窗口中右键点击或通过断点窗口移除或临时禁用跟踪点。在断点窗口中，左侧的选择框指示跟踪点是否启用；禁用的跟踪点未勾选，并在代码窗口中显示为菱形轮廓。\n\
  \n### 诊断输出与跟踪点的对比\n\n现在你已经看到了两种输出基本相同信息的方法，请考虑两者的优缺点。首先，跟踪点没有对应的 `Trace` 命令；也就是说，无法使用跟踪点在发布生成中输出信息。这是因为跟踪点没有包含在应用程序中。跟踪点由\
  \ Visual Studio 处理，因此它们在编译后的应用程序中不存在。只有当应用程序在 Visual Studio 调试器中运行时，你才能看到跟踪点发挥作用。\n\
  \n跟踪点的主要缺点也是其主要优点，即它们存储在 Visual Studio 中。这使得你可以根据需要快速方便地将其添加到应用程序中，但也使得它们太容易被删除。删除跟踪点只需点击指示位置的红菱形即可，如果你正在输出复杂的字符串信息，这可能会很烦人。\n\
  \n然而，跟踪点的额外好处是可以方便地添加附加信息，例如 `$FUNCTION` 可以将当前函数名添加到输出消息中。虽然使用 `Debug` 和 `Trace`\
  \ 命令编写的代码也可以获取这些信息，但获取起来要复杂得多。总之，如下使用这两种方法输出调试信息：\n\n\n\n\n\n- **诊断输出（Diagnostics\
  \ output）** — 当你始终希望从应用程序输出调试输出时使用，特别是当要输出的字符串复杂，涉及多个变量或大量信息时。此外，如果你希望在发布模式（release\
  \ mode）构建的应用程序运行期间输出，`Trace` 命令通常是唯一的选择。\n- **跟踪点（Tracepoints）** — 在调试应用程序时使用这些点，可以快速输出可能帮助你解决语义错误的等重要信息。\n\
  \n## 在断点模式下调试\n\n本章描述的其余调试技术都在断点模式下工作。可以通过几种方式进入此模式，所有方式都会导致程序以某种方式暂停。\n\n### 进入断点模式\n\
  \n进入断点模式最简单的方法是在应用程序运行时点击 IDE 中的“暂停”（Pause）按钮。该暂停按钮位于调试（Debug）工具栏上，你应该将其添加到 Visual\
  \ Studio 默认显示的工具栏中。要执行此操作，请在工具栏区域右键单击并选择 `Debug`。[图 7-6]](#text00010.html_c07-fig-0006)\
  \ 显示了出现的调试工具栏。\n\n![截图插图，显示 Visual Studio 中默认显示的调试工具栏。](img/Image00065.jpg)\n\n\
  **图 7-6**\n\n工具栏上的前三个按钮允许手动控制中断。在 [图 7-6]](#text00010.html_c07-fig-0006) 中，这些按钮是灰色的，因为它们对于当前未执行的程序无效。后续章节将根据需要描述其余的按钮。\n\
  \n当应用程序运行时，工具栏会发生变化，变为 [图 7-7]](#text00010.html_c07-fig-0007) 所示的样子。\n\n![截图插图，显示当应用程序运行时工具栏的变化。](img/Image00066.jpg)\n\
  \n**图 7-7**\n\n之前为灰色的三个按钮现在允许你执行以下操作：\n\n- 暂停应用程序并进入断点模式。\n- 完全停止应用程序（这不会进入断点模式；它只是退出）。\n\
  - 重新启动应用程序。\n\n暂停应用程序可能是进入断点模式最简单的方法，但它无法让你对精确的何处停止进行精细化控制。你很可能会在应用程序的自然暂停处停止，例如在你请求用户输入的地方。你也可能在长时间操作或长循环期间进入断点模式，但确切的停止点可能是随机的。通常情况下，使用断点要好得多。\n\
  \n### 断点（Breakpoints）\n\n*断点*（breakpoint）是源代码中的一个标记，可触发自动进入断点模式。断点可以配置为执行以下操作：\n\
  \n- 当到达断点时立即进入断点模式。\n- 当到达断点且布尔表达式求值为 `true` 时，进入断点模式。\n- 当断点达到设定次数后，进入断点模式。\n-\
  \ 当到达断点且自上一次到达断点以来变量值发生变化时，进入断点模式。\n\n这些功能仅在调试生成（debug builds）中可用。如果你编译发布生成（release\
  \ build），所有断点都会被忽略。\n\n添加断点有多种方法。要添加到达某行时中断的简单断点，只需单击代码行最左侧。或者，你可以从菜单中选择菜单项 `Debug`\
  \ ![image](img/Image00008.gif) 切换断点（Toggle Breakpoint），或者按 `F9`，断点将放置在获得焦点的代码行上。\n\
  \n断点以红圈的形式出现在代码行旁边，该行会被高亮，如 [图 7-8]](#text00010.html_c07-fig-0008) 所示。\n\n![截图插图，显示窗口中被高亮的代码行旁边出现了一个断点。](img/Image00067.jpg)\n\
  \n**图 7-8**\n\n你还可以使用断点（Breakpoints）窗口查看有关文件的断点信息（你之前已经见过如何启用此窗口了）。你可以使用断点窗口禁用断点、删除断点并编辑断点的属性。你还可以为断点添加标签，这是对所选断点分组分类的方法。注意，通过取消描述左侧的勾选，禁用的断点将显示为未填充的红圆圈。你可以在标签列中查看标签，并根据标签过滤此窗口显示的项目。\n\
  \n此窗口中显示的其他列（条件（Condition）和命中次数（Hit Count））只是可用列中的两个，但它们是最用的。你可以通过右键单击断点并选择 `Conditions…`\
  \ 来编辑这些内容。展开下拉框将显示以下选项：\n\n- 条件表达式（Conditional Expression）\n- 命中次数（Hit Count）\n\
  - 筛选（Filter）\n\n选择条件（Conditions…）会打开一个对话框，你可以在其中输入任何布尔表达式，该表达式可能涉及断点处作用范围内的任何变量。例如，你可以配置一个断点，在到达且\
  \ `maxVal` 的值大于 4 时触发，方法是输入表达式 `“maxVal > 4” 并选择 `Is` `true` 选项。你还可以检查此表达式的值是否发生了变化，并仅在发生变化时触发断点（例如，如果在两次遇到断点之间\
  \ `maxVal` 从 2 变为 6，则你可能会触发它）。\n\n从下拉列表中选择命中次数（Hit Count）会打开一个对话框，你可以在其中指定在触发断点前需要命中多少次。下拉列表提供了以下选项：\n\
  \n- 始终中断（默认值）\n- 命中次数等于时中断\n- 命中次数为...的倍数时中断\n- 命中次数大于或等于时中断\n\n你选择的选项结合文本框中输入的值决定了断点的行为。命中次数对于长循环非常有用，例如你可能想在\
  \ 5000 次循环后中断。如果不能这样做，那将是痛苦的！\n\n### 进入断点模式的其他方法\n\n还有两种进入断点模式的方法。一种是在抛出未处理的异常时进入。该主题将在本章稍后的错误处理部分介绍。另一种方法是在生成断言时中断。\n\
  \n*断言*（assertions）是带有自定义消息并中断应用程序执行的指令。它们通常在应用程序开发期间用于测试运行是否顺利。例如，在应用程序的某个地方，你可能要求某个变量的值小于\
  \ 10。你可以使用断言来确认这一点为真，如果不是，则中断程序。\n\n与之前显示的调试输出函数一样，断言有两个版本：\n\n- `Debug.Assert()`\n\
  - `Trace.Assert()`\n\n`Debug` 类仅编译到调试生成中，而 `Trace` 存在于发布生成中。\n\n这些函数接受三个参数。第一个是布尔值，`false`\
  \ 值会导致断言触发。第二个和第三个是字符串参数，用于将信息同时写入弹出对话框和输出窗口。先前的示例可能需要如下函数调用：\n\n```\nDebug.Assert(myVar\
  \ < 10, \"myVar is 10 or greater.\", \"Assertion occurred in Main().\");\n```\n\n\
  断言在用户采用应用程序的初始阶段通常有用。你可以发布包含 `Trace.Assert()` 函数的发布生成版本以监控情况。如果触发了断言，用户将收到通知，这些信息可以传递给你。这样你就可以确定哪里出了错误，即使你不知道错误是如何发生的。\n\
  \n\n\n\n\n例如，你可以在第一个字符串中提供错误的简要描述，并在第二个字符串中提供后续操作的指示说明：\n\n```\nTrace.Assert(myVar\
  \ < 10, \"Variable out of bounds.\",\n             \"Please contact vendor with\
  \ the error code KCW001.\"); \n```\n\n如果发生此断言，用户将看到如 图 7‐9 所示的对话框。\n\n![对话框截图插图，其中第一个字符串显示了错误的简要描述，第二个字符串显示了如何操作的指示。](img/Image00068.jpg)\n\
  \n**图 7‐9**\n\n诚然，这并不是世界上最对用户友好的对话框，因为它包含了许多可能会让用户困惑的信息，但如果他们向你发送错误截图，你就可以快速定位问题。\n\
  \n现在是时候看看在应用程序执行停止且你处于断点模式（break mode）后，实际可以做什么。通常情况下，你进入断点模式是为了查找代码中的错误（或让自己确信一切运行正常）。一旦进入断点模式，你可以使用各种技术，这些技术都能允许你分析代码以及应用程序在执行暂停点的精确状态。\n\
  \n### 监控变量内容\n\n监控变量内容只是 Visual Studio 通过简化操作为你提供极大帮助的一个示例。检查变量值最简单的方法是在断点模式下，将鼠标悬停在源代码中的变量名称上。此时会出现一个显示变量信息的工具提示，包括变量的当前值。\n\
  \n你也可以同样通过高亮整个表达式来获取其结果信息。对于数组等更复杂的值，甚至可以展开工具提示中的值以查看单个元素项。\n\n你可以将这些工具提示窗口固定到代码视图中，这对于你特别感兴趣的变量来说非常有用。固定的工具提示会持续存在，因此即使你停止并重新调试，它们仍然可用。你还可以为固定的工具提示添加注释、移动它们的位置，即使在应用程序未运行时也能查看上一个变量的值。\n\
  \n你可能已经注意到，当你运行应用程序时，IDE 中各种窗口的布局会发生变化。默认情况下，运行时可能会发生以下变化（此行为取决于你的安装情况略有不同）：\n\n\
  *   `Properties`（属性）窗口消失，以及其他一些窗口消失，可能包括 `Solution Explorer`（解决方案管理器）窗口。\n*   打开\
  \ `diagnostic Tools`（诊断工具）窗口，显示 Summary（摘要）、`Events`（事件）、Memory Usage（内存使用率）和 CPU\
  \ Usage（CPU 使用率）。\n*   `Error List`（错误列表）窗口被 IDE 窗口底部的两个新窗口取代。\n*   新窗口中出现了几个新标签。\n\
  \n新的屏幕布局如 图 7‐10 所示。这可能与你的显示不完全匹配，某些标签和窗口看起来可能不完全相同，但后文描述的这些窗口的功能是相同的，且此显示可以通过 `View`（视图）和\
  \ `Debug` ![image](img/Image00008.gif) 窗口菜单（执行期间）进行自定义。\n\n![对话框截图插图，其中第一个字符串显示了错误的简要描述，第二个字符串显示了如何操作的指示。](img/Image00068.jpg)\n\
  \n**图 7‐10**\n\n\n\n\n要查看应用程序执行的每一项操作，你可以使用“逐入”（Step Into）来按顺序跟踪指令。这包括进入函数内部，例如前一个示例中的\
  \ `Maxima()`。当光标到达第 16 行（即调用 `Maxima()` 的地方）时点击此图标，光标将移动到 `Maxima()` 函数内部的第一行。或者，当你到达第\
  \ 16 行时点击“逐语句执行”（Step Over），光标将直接移动到第 17 行，而不会经过 `Maxima()` 中的代码（尽管这些代码仍会被执行）。如果你步入了一个你不感兴趣的函数，可以点击“逐出”（Step\
  \ Out）返回到调用该函数的代码。在单步执行代码时，变量的值可能会发生。如果你关注刚才讨论的监控窗口，就可以清楚地看到这种变化。\n\n你还可以通过右键点击某行代码并选择“设置下一语句”（Set\
  \ Next Statement），或者通过将黄色箭头拖到不同的代码行来更改下一步将执行的代码。这并不总是有效，例如在跳过变量初始化时。然而，它对于跳过问题的代码行以观察会发生什么，或者通过将箭头向前移动来重复执行代码是非常有用的。\n\
  \n在存在语义错误的代码中，这些技术可能是你手头最有效的工具。你可以单步执行代码，直到你预期出现问题的地方，错误的生成就像你正常运行程序一样。或者，你可以通过更改执行的代码来使语句执行多次。在此过程中，你可以观察数据以看到底出了什么问题。在本章稍后的部分，你将单步执行某些代码，以了解示例应用程序发生了什么。\n\
  \n### 命令窗口和立即窗口\n\n命令窗口（Command window）和立即窗口（Immediate window，在“调试窗口”菜单中找到）允许你在应用程序运行时执行命令。命令窗口允许你手动执行\
  \ Visual Studio 操作（如菜单和工具栏操作），而立即窗口允许你在执行正在执行的源码行之外执行额外代码，并评估表达式。\n\n这些窗口是内在关联的。你甚至可以通过输入命令在它们之间切换——输入\
  \ `immed` 从命令窗口移动到立即窗口，输入 `cmd` 返回。\n\n本节重点介绍立即窗口，因为命令窗口仅在复杂操作时才真正有用。此窗口最简单的用法是评估表达式，类似于监视窗口（Watch\
  \ windows）的一次性使用。要执行此操作，输入表达式并按回车键。随后将显示请求的信息。示例见图 7-15。\n\n![截图插图，显示了在立即窗口中输入表达式时将显示请求信息的示例。](img/Image00074.jpg)\n\
  \n图 7-15\n\n你还可以在这里更改变量内容，如图 7-16 所示。\n\n![截图说明，演示了在立即窗口中更改变量内容后的效果演示。](img/Image00075.jpg)\n\
  \n图 7-16\n\n在大多数情况下，使用之前显示的变量监控窗口可以更容易获得你想要的效果，但这种技术对于调整值仍然非常方便，并且有利于测试表达式。\n\n\
  字体 调用堆栈窗口\n\n最后一个查看的窗口是调用堆栈（Call Stack）窗口，它显示了程序到达当前位置的路径。简单来说，这意味着显示当前函数以及调用它的函数、调用该函数的函数等（依此类推，即嵌套函数调用的列表）。还会记录进行调用的精确点。\n\
  \n在较早的示例中，在 `Maxima()` 中时进入断点模式，或通过单步执行代码进入此函数，会显示图 7-17 所示的信息。\n\n![截图插图，显示了在 Maxima()\
  \ 中进入断点模式时显示的信息。](img/Image00076.jpg)\n\n图 7-17\n\n如果你双击某项，将跳转到相应位置，让你能够跟踪代码执行是如何到达当前点的。此窗口在首次检测到错误时特别有用，因为你可以看到错误发生之前发生了什么。当错误发生在常用函数中，这有助于你确定错误的源头。\n\
  \n## 错误处理\n\n本章的第一部分解释了如何在应用程序开发期间查找并纠正错误，以便它们不会出现在发布级代码中。然而，有时你知道错误可能会发生，并且没有办法能百分之百确定它们不会发生。在这些情况下，最好是预见到问题并编写足够健壮的代码来优雅地处理这些错误，而不中断执行。\n\
  \n*错误处理*（Error handling）是所有此类技术的术语，本节将介绍异常以及你如何处理它们。异常是在运行时在你的代码或你的代码调用的函数中生成的错误。这里对“错误”的定义比以前更模糊，因为异常可能是手动生成的、在函数中生成的等。例如，如果一个函数的某个参数不以“a”开头，你可能会在该函数中生成一个异常。严格来说，这在函数语境之外并不是一个错误。\n\
  \n你已经在书中看到过几次异常了。也许最简单的例子是尝试访问超出范围的数组元素：\n\n```c\nint[] myArray = { 1, 2, 3, 4 };\n\
  int myElem = myArray[4];\n```\n\n这会输出以下异常消息并终止应用程序：\n\n```\nIndex was outside the\
  \ bounds of the array.\n```\n\n异常定义在命名空间中，大多数名称都明确其用途。在例示例中，生成的异常被称为 `System.IndexOutOfRangeException`，这是合理的，因为你提供的索引不在\
  \ `myArray` 的范围之内。只有当异常被处理时，此消息才会出现，应用程序才会终止。在下一节中，你将具体看到处理异常必须做什么。\n\n### try…catch…finally\n\
  \nC# 语言包含了*结构化异常处理*（SEH）的语法。三个关键字标记代码能够处理异常，并用指令指定发生异常时执行的操作：`try`、`catch` 和 `finally`。这些每个都有一个关联的代码块，并且必须在连续的代码行中使用。基本结构如下：\n\
  \n```csharp\ntry\n{\n   ...\n}\ncatch (<exceptionType> e) when (filterIsTrue)\n\
  {\n   <await methodName(e);>\n   ...\n}\nfinally\n{\n   <await methodName;>\n  \
  \ ...\n}\n```\n\n在 `catch` 或 `finally` 块中可选使用 `await` 是 C# 6 引入的。`await` 关键字用于支持高级异步编程技术，这些技术可以避免瓶颈并提高应用程序的整体性能和响应能力。书中没有讨论使用\
  \ `async` 和 `await` 关键字的异步编程；尽管如此，由于这些关键字简化了这种编程技术的实现，强烈建议学习它们。\n\n然而，也可以只有 `try`\
  \ 块和 `finally` 块而没有 `catch` 块，或者 `try` 块带有多个 `catch` 块。如果存在一个或多个 `catch` 块，则 `finally`\
  \ 块是可选的；否则，它是强制性的。这些块的使用如下：\n\n\n\n\n\n*   `try` — 包含可能抛出异常的代码（在谈论异常时，“throw”是 C#\
  \ 中表示“生成”或“引起”的说法）。\n*   `catch` — 包含在抛出异常时执行的代码。`catch` 块可以使用 `<exceptionType>`\
  \ 仅响应特定的异常类型（例如 `System.IndexOutOfRangeException`），因此可以可以提供多个 `catch` 块。也可以完全省略此参数，以获得一个响应所有异常的通用\
  \ `catch` 块。C# 6 引入了名为*异常过滤*的概念，该概念通过在异常类型表达式后添加 `when` 关键字来实现。只有当发生该异常类型且筛选表达式为\
  \ `true` 时，才会执行 `catch` 块中的代码。\n*   `finally` — 包含始终会被执行的代码。它可能在未发生异常时在 `try` 块之后执行，也可能在异常被处理后在\
  \ `catch` 块之后执行，或者在未处理的异常“沿调用堆栈移动”之前执行。这个短语意味着 SEH 允许你直接或由于 `try` 块中调用了函数，将 `try…catch…finally`\
  \ 块嵌套在一起。例如，如果异常没有被调用函数中的任何 `catch` 块处理，它可能会被调用代码中的 `catch` 块处理。最终，如果没有匹配到任何 `catch`\
  \ 块，应用程序将终止。`finally` 块在此发生之前被处理，这一事实就是它存在的原因；否则，你大可将代码放在 `try…catch…finally` 结构之外。这种嵌套功能将在稍后的“异常处理注意记”部分进行进一步讨论，所以如果这起来听起来有点困惑，请不要担心。\n\
  \n以下是 `try` 块中的代码发生异常后会发生的事件序列，也如图 7-18 所示。\n\n*   `try` 块在发生异常的点处终止。\n*   如果存在\
  \ `catch` 块，则将进行检查以确定该块是否与抛出的异常类型匹配。如果不存在 `catch` 块，则执行 `finally` 块（如果没有 `catch`\
  \ 块，则 `finally` 块必须存在）。\n*   如果存在 `catch` 块但没有匹配，则将检查其他 `catch` 块。\n*   如果 `catch`\
  \ 块匹配异常类型且异常筛选器的结果为 `true`，则执行其内部的代码，然后执行 `finally` 块（如果存在）。\n*   如果 `catch` 块匹配异常类型且没有异常筛选器，则执行其包含的代码，然后执行\
  \ `finally` 块（如果存在）。\n*   如果没有 `catch` 块匹配异常类型，则执行 `finally` 块代码（如果存在）。\n\n![try\
  \ 块代码中表达式发生异常后发生事件序列的图示说明。](img/Image00077.jpg)\n\n**图 7-18**\n\n接下来的“尝试一下”（Try\
  \ It Out）演示了如何处理异常。它展示了以几种方式抛出和处理异常，以便你可以看到它们是如何运作的。\n\n### 抛出表达式\n\n在之前的“尝试一下”中，`throw`\
  \ 仅用于执行程序化动作的代码语句中。也可以像这里这样在表达式中使用 `throw`：\n\n```cs\n friend ?? throw new ArgumentNullException(paraName:\
  \ nameof(friend), message: \"null\") \n```\n\n这段代码段使用了双问号（`??`），它称为*空合并运算符*，用于检查要赋值的值是否为\
  \ `null`。如果是 `null`，则抛出 `ArgumentNullException` 函数。如果值不是 `null`，则将该值赋值给变量。\n\n###\
  \ 列出和配置异常\n\n.NET Framework 包含了大量的异常类型，你可以自由地在自己的代码中抛出并处理这些任何一种异常。IDE 提供了一个对话框，用于检查和编辑可用异常，可以通过\
  \ Debug ![image](img/Image00008.gif) Windows ![image](img/Image00008.gif) 异常设置菜单项（或按\
  \ Ctrl+D, E）来调用。图 7-20 显示了异常设置对话框。\n\n![显示异常设置对话框的截屏说明，用于检查和编辑可用异常。](img/Image00079.jpg)\n\
  \n**图 7-20**\n\n异常按类别和 .NET 库命名空间列出。你可以通过展开“通用语言异常”（Common Language Runtime Exceptions）加号查看\
  \ `System` 命名空间下的异常。列表包含了你之前使用的 `System.IndexOutOfRangeException` 异常。\n\n可以使用异常类型旁边的复选框对每个异常进行配置。勾选后，调试器将在抛出（Thrown）时中断，导致即使是已处理的异常也会中断进入调试器。\n\
  \n## 练习\n\n1.  7.1 “使用 `Trace.WriteLine()` 比使用 `Debug.WriteLine()` 更好，因为 `Debug`\
  \ 版本仅在调试生成中工作。”你同意这个说法吗？如果是，为什么？\n2.  7.2 为一个简单的应用程序提供代码，该程序包含一个在 5 之后产生错误的循环。使用断点在错误产生之前进入中断模式。（注意：产生错误的一种简单方法是访问不存在的元素，例如\
  \ `myArray[1000]`。）\n3.  7.3 “`finally` 块只在 `catch` 块执行时才执行。”对还是错？\n4.  7.4 对于给定的\
  \ `orientation` 枚举类型，编写一个应用程序使用结构化异常处理（SEH）将 `byte`-类型变量转换为 `orientation`-类型变量。（注意：可以使用\
  \ `checked` 关键字强制抛出异常，此处所示。）\n\n```cs\n enum Orientation : byte\n    {\n       North\
  \ = 1,\n       South = 2,\n       East  = 3,\n       West  = 4\n    }\n\nmyDirection\
  \ = checked((Orientation)myByte);\n```\n\n练习答案见附录。\n\n## ![image](img/Image0002.gif)\
  \ 本章学习内容\n\n| **主题** | **关键概念** |\n| --- | --- |\n| 错误类型 | 致命错误会导致应用程序完全失败，可能发生在编译时（语法错误），也发生在运行时。语义错误（或逻辑错误）更隐蔽，可能会导致应用程序运行异常或不可预测的结果。\
  \ |\n| 输出调试信息 | 你可以编写代码将有用信息输出到输出窗口以辅助调试。你通过 `Debug` 和 `Trace` 系列函数来实现，其中 `Debug`\
  \ 函数在发布生成中会被忽略。对于生产应用程序，你可能希望将调试输出写入日志文件。你还可以使用跟踪点来输出调试信息。 |\n| 中断模式 | 你可以手动、通过断点、断言或在发生未处理异常时进入中断模式（本质上应用程序暂停的状态）。你可以在代码的任何地方添加断点，并配置断点仅在特定条件下中断。在中断模式下，你可以检查变量的内容（借助各种调试信息窗口）并逐行执行代码，帮助你确定错误位置。\
  \ |\n| 异常 | 异常是在运行时发生的错误，你可以对其进行捕获和处理以防止应用程序终止。当你调用函数或操作变量时可能会发生许多类型的异常。你也可以使用 `throw`\
  \ 关键字生成异常。 |\n\n\n\n\n\n| 异常处理 | 你的中未处理的异常将导致应用程序终止。你使用 `try`、`catch` 和 `finally`\
  \ 代码块来处理异常。`try` 块标记了启用异常处理的代码区域。`catch` 块由仅在发生异常时执行的代码组成，并可以匹配特定类型的异常。你可以包含多个 `catch`\
  \ 块。`finally` 块指定了在异常处理发生后或在未发生异常的 `try` 块结束后执行的代码。你只能包含一个 `finally` 块，如果你包含了任何\
  \ `catch` 块，则 `finally` 块是可选的。 |\n\n# 8 面向对象编程简介\n\n## 什么是面向对象编程？\n\n面向对象编程试图解决传统编程技术中的许多问题。你目前所看到的编程类型被称为`过程化编程`（procedural\
  \ programming），它通常会导致所谓的单体式应用程序，这意味着所有功能都包含在少数几个代码模块（通常只有一个）中。使用 OOP 技术，你通常会使用更多的代码模块，每个模块都提供特定的功能。此外，每个模块都可以相互隔离，甚至与其他模块完全独立。这种模块化的编程方法赋予了你更大的灵活性，并为代码复用提供了更多机会。\n\
  \n为了进一步说明这一点，想象你计算机上的一个高性能应用程序是一辆顶配的赛车。用传统编程技术编写的这辆跑车基本上是一个单一单元。如果你想改进这辆车，就必须将其送回制造商，由他们的专家技师进行升级，或者购买一辆新的。然而，如果使用\
  \ OOP 技术，你只需从制造商处购买一个新引擎并按照他们的说明自行更换，而无需用电锯去切割车身。\n\n在更传统的应用程序中，执行流通常是简单且线性的。应用程序加载到内存中，从\
  \ A 点开始执行，在 B 点结束，然后从内存中卸载。在此过程中，可能会使用其他各种实体，例如存储介质上的文件或显卡的功能，但主体处理发生在一个地方。沿途的代码通常关注通过各种数学和逻辑手段操纵数据。操作方法通常非常简单，使用整数和布尔值等基本类型来构建更复杂的数据表示。\n\
  \n使用 OOP，事情很少是这样线性的。尽管实现了相同的结果，但实现方式通常非常不同。OOP 技术深根于数据的结构和含义，以及数据与其他数据之间的交互。这通常意味着要在项目的设计阶段投入更多精力，但它具有可扩展的优点。一旦对特定类型的数据表示达成一致，这种约定就可以应用到应用程序的后续版本，甚至是完全全新的应用程序中。这种共识的存在可以极大地缩短开发时间。这解释了赛车例子是如何工作的。这里的约定是关于“引擎”代码是如何结构化的，使得新代码（用于新引擎）可以被轻松替换，而无需返回制造商。它意味着引擎一旦创建，就可以用于其他用途。例如，你可以把它放在不同的车里，或者用它来驱动潜艇。\n\
  \nOOP 经常通过提供关于数据表示方法的共识，以及关于更抽象实体的结构和用用的共识来简化问题。例如，不仅可以就用于发送到打印机等设备输出的数据格式达成共识，还可以就与该设备交换数据的方法达成共识，包括它理解的指令等。在赛车的类比中，共识将包括引擎如何连接到燃料箱、它如何将动力传递给车轮等。\n\
  \n正如该技术的名称所暗示的，这是通过对象实现的。\n\n### 什么是对象？\n\n`object`（对象）是 OOP 应用程序的构建块。这个构建块封装了应用程序的一部分，可以是一个过程、一段数据或一个更抽象的实体。\n\
  \n在最简单的意义上，对象可以与书中之前显示的结构体（struct）类型非常相似，包含变量类型和函数类型的成员。包含的变量组成了存储在对象中的数据，包含的函数允许访问对象的功能。稍微复杂的对象可能不维护任何数据；相反，它们可以通过仅包含函数来表示一个过程。例如，可以使用一个代表打印机的对象，它将具有能够控制打印机的函数（这样你可以打印文档、测试页等）。\n\
  \nC# 中的对象是从类型创建的，就像你已经见过的变量一样。在 OOP 中，对象的类型由一个特殊的名称称为，即它的 `class`（类）。你可以使用类定义来 `instantiate`（实例化）对象，这意味着创建一个类的真实的、有名称的\
  \ `instance`（实例）。`instance of a class` 和 `object` 在这里的意思相同；但 `class` 和 `object`\
  \ 从根本上讲是完全不同的。\n\n在本章中，你将使用`统一建模语言`（Unified Modeling Language， UML）语法与类和对象一起工作。UML\
  \ 设计用于建模应用程序，从构建它的对象到它们执行的操作，再到预期的用例。在这里，你只使用这种语言的基础知识，会在学习过程中进行解释。UML 是一门专门的学科，有整本书都在介绍它，因此这里不涵盖其更复杂的方面。\n\
  \n图 8-1 显示了你的打印机类、名为 `Printer` 的 UML 表示。类名显示在框的顶部部分（你稍后会学习底部两个部分）。\n\n![显示名为 Printer\
  \ 的打印机类的 UML（统一建模语言）表示的图示说明](img/Image00080.jpg)\n\n**图 8-1**\n\n图 8-2 显示了该 `Printer`\
  \ 类的一个实例、名为 `myPrinter` 的 UML 表示。\n\n![显示名为 myPrinter 的打印机类的 UML（统一建模语言）表示的图示说明](img/Image00081.jpg)\n\
  \n**图 8-2**\n\n在这里，实例名称首先显示在顶部，然后是它的类名。两个名称之间用冒号分隔。\n\n### 属性和字段\n\n属性（Properties）和字段（Fields）提供了对对象包含的数据访问。这些对象数据区分了不同的对象，因为同一类的不同对象可能在属性和字段中存储不同的值。\n\
  \n对象中包含的各种数据共同组成了该对象的 `state`（状态）。想象一个代表咖啡杯的对象类，名为 `CupOfCoffee` .。当你实例化该类（即创建该类的一个对象）时，你必须为它提供一个状态以使其具有意义。在这种情况下，你可能使用属性和字段，使使用该对象的代码能够设置咖啡类型、咖啡是否含有牛奶和/或糖、咖啡是否是即溶的等。一个给定的咖啡杯对象将有一个给定的状态，例如“加牛奶和双糖的哥伦比亚过滤咖啡”。\n\
  \n\n\n\n\n字段和属性都是有类型的，因此你可以将 `string` 值、`int` 值等信息存储在它们中。然而，属性与字段的区别在于，它们不提供对数据的直接访问。对象可以保护用户免受数据细节的影响，而这些细节并不一定要在现有的属性中以一一对应的方式表示。如果你使用一个字段来表示\
  \ `CupOfCoffee` 实例中糖的量，那么用户可以在该字段中放置他们喜的任何值，仅受限于用于存储该信息的类型限制。例如，如果你使用一个 `int` 来存储这些数据，那么用户就可以使用\
  \ −2147483648 到 2147483647 之间的任何值，如第 3 章 所示。显然，并不是所有值都有意义，特别是负值，而且某些巨大的正数可能需要一个大得离谱杯。如果你使用属性来处理这些信息，你可以将该值限制在例如\
  \ 0 到 2 之间的数字。\n\n通常情况下，为状态访问提供属性而非字段会更好，因为你对各种行为有更多的控制权。这种选择不会影响使用对象实例的代码，因为使用属性和字段的语法是相同的。\n\
  \n对象还可以明确定义对属性的读写访问权限。某些属性可以是只读的，允许你查看它们但不能更改它们（至少不能直接更改）。这通常是同时读取几部分状态的一项实用技术。你可能在\
  \ `CupOfCoffee` 类中有一个名为 `Description` 的只读属性，它在被请求时返回一个表示该类实例状态的字符串（例如之前给出的字符串）。你可能可以通过查询几个属性来组合相同的数据，但像这样一个属性可能会为你节省时间和精力。你可能还有以类似方式运行的只写属性。\n\
  \n除了属性的读写访问权限外，你还可以为字段和属性指定不同类型的访问权限，称为 `accessibility`（访问性）。可访问性决定了哪些代码可以访问这些成员——即它们是对所有代码可见（public）、仅对类内部代码可见（private），还是应该使用一种更复杂的方案（在章节稍后相关时将进行详细介绍）。一种常见的做法是将字段设为私有，并通过公共属性提供对它们的访问。这意味着类内部的代码可以直接访问存储在字段中的数据，而公共属性则保护外部用户免受这些数据的影响，并防止在那里放置无效内容。公共成员被称为类的\
  \ `exposed`（暴露）。\n\n可视化这一点的一种方法是将其等同于变量的作用范围。例如，私有字段和属性可以被认为局部于它们的对象，而公共字段和属性的作用范围还包含了对象外部的代码。\n\
  \n在类的 UML 表示中，你使用第二部分来显示属性和字段，如图 8-3 所示。\n\n![CupOfCoffee 类的图示，在第二部分定义了五个成员（属性或字段）。](img/Image00082.jpg)\n\
  \n**图 8-3**\n\n这是 `CupOfCoffee` 类的表示，按照之前讨论的，定义了五个成员（属性或字段，因为 UML 中不区分）。每个条目都包含以下信息：\n\
  \n*   访问性（Accessibility）——使用 + 号表示公共成员，使用 − 号表示私有成员。通常，本章的图中不显示私有成员，因为这些信息是类内部的。不提供关于读写访问权限的信息。\n\
  *   成员名称。\n*   成员类型。\n\n使用冒号来分隔成员名称和类型。\n\n### 方法\n\n`Method`（方法）是用于引用对象暴露的的语。它们可以像任何其他函数一样被调用，并以相同的方式使用返回值和参数——你已经在第\
  \ 6 章中详细查看过函数。\n\n方法用于提供对对象功能的访问。与字段和属性一样，它们可以是公共的也可以是私有的，根据需要限制对外部代码的访问。它们通常利用对象的状态来影响其操作，并在需要时访问私有成员（如私有字段）。例如，`CupOfCoffee`\
  \ 类可能会定义一个名为 `AddSugar()` 的方法，与设置相应的 `Sugar` 属性相比，它为增加糖量提供了更具可读性的语法。\n\n在 UML 中，类框的第三部分显示方法，如图\
  \ 8-4 所示。\n\n![CupOfCoffee 类的图示，在第三部分定义了一个名为 AddSugar() 的方法。](img/Image00083.jpg)\n\
  \n**图 8-4**\n\n这里的语法与字段和属性的语法类似，但结尾显示的类型是返回值，并且显示了方法参数。每个参数在 UML 中使用以下标识符之一显示：`return`、`in`、`out`\
  \ 或 `inout`。\n\n\n\n\n\n所有类定义都包含至少一个构造函数。这些构造函数可以包含一个`默认构造函数`，这是一个与类同名且无参数的方法。类定义还可以包含多个带有参数的构造函数方法，被称为`非默认构造函数`。它们使得实例化对象的代码能够以多种方式进行，或许为对象中存储的数据提供初始值。\n\
  \n在 C# 中，使用 `new` 关键字调用构造函数。例如，你可以通过以下方式使用默认构造函数实例化一个 `CupOfCoffee` 对象：\n\n```\n\
  CupOfCoffee myCup = new CupOfCoffee(); \n```\n\n也可以使用非默认构造函数实例化对象。例如，`CupOfCoffee`\
  \ 类可能有一个非默认构造函数，它使用一个参数在实例化时设置豆种类：\n\n```\nCupOfCoffee myCup = new CupOfCoffee(\"\
  Blue Mountain\"); \n```\n\n构造函数像字段、属性和方法一样，可以是公共的（public）或私有的（private）。类代码不能使用私有构造函数实例化对象；它必须使用公共构造函数。通过这种方式，你可以强制类的用户使用非默认构造函数（通过将默认构造函数设为私有）。\n\
  \n某些类没有公共构造函数，这意味着外部代码无法实例化它们（它们被称为`不可创建的`）。然而，这并不意味着它们完全没用，正如你很快就会看到的 true。\n\n\
  ### 析构函数\n\n.NET Framework 使用析构函数来清理对象。通常情况下，你不需要为析构函数方法提供代码；相反，默认操作会替你完成工作。但是，如果在对象实例删除之前需要执行某些重要操作，你可以提供特定的指令。\n\
  \n例如，当变量超出作用范围时，你的代码可能无法访问它；但它可能仍然存在于计算机内存某处。只有当 .NET 运行时执行垃圾回收时，实例才会被完全销毁。\n\n\
  ### 静态和实例类成员\n\n除了具有特定于对象实例的属性、方法和字段外，还可以拥有`static`（也称为 `shared`，特别是对于我们的 Visual\
  \ Basic 兄弟）成员，这些可以是方法、属性或字段。静态成员在类的实例之间共享，因此它们可以被视为给定类对象的全局变量。静态属性和字段允许你访问独立于任何对象实例的数据，而静态方法允许你执行与类类型相关但并非特定于对象实例的命令。在使用静态成员时，事实上你甚至不需要实例化对象。\n\
  \n例如，你一直在使用的 `Console.WriteLine()` 和 `Convert.ToString()` 方法就是静态的。在任何时候，你都不需要实例化\
  \ `Console` 或 `Convert` 类（事实上，如果你尝试这样做，你会发现你做不到，因为这些类的构造函数不是公共访问的，正如之前讨论的那样）。如果你在程序开头包含\
  \ `using static System.Console;` 声明，则不需要 `Console.`，你可以直接调用 `WriteLine()`。\n\n在许多此类情况下，静态属性和方法可以很好地发挥。例如，你可能使用静态属性来跟踪创建了多少个类实例。在\
  \ UML 语法中，类的静态成员以下划线形式显示，如图 图 8‐5 所示。\n\n![显示在 UML 语法中，类的静态成员以下划线形式显示的图示。](img/Image00084.jpg)\n\
  \n**图 8‐5**\n\n### 静态构造函数\n\n在类中使用静态成员时，你可能想预先初始化这些成员。你可以在声明的一部分中为静态成员提供初始值，但有时你可能想执行更复杂的初始化，或者在赋值值或允许静态方法执行之前执行某些操作。\n\
  \n你可以使用静态构造函数来执行此类初始化任务。一个类可以有一个静态构造函数，它必须没有访问修饰符，且不能有任何参数。静态构造函数永远不会被直接调用；相反，它在发生以下情况之一时被执行：\n\
  \n* 创建了包含静态构造函数的类实例。\n* 访问了包含静态构造函数的类的静态成员。\n\n在这两种情况下，静态构造函数都会在类实例化或访问静态成员之前先调用。无论创建了多少个类实例，它的静态构造函数只会被调用一次。为了区分静态构造函数和本章之前描述的构造函数，所有非静态构造函数也称为`实例构造函数`。\n\
  \n### 静态类\n\n通常，你可能想使用仅包含静态成员且不能用于实例化对象的类（例如 `Console`）。实现此点的简便方法（而不是将类的构造函数设为私有）是使用\
  \ `static class`。静态类只能包含静态成员，且不能有实例构造函数，因为隐含它永远无法被实例化。然而，静态类可以像上一节描述的那样拥有静态构造函数。\n\
  \n OOP 技巧\n\n现在你已经了解了基础知识、什么是对象以及它们如何工作，你可以花些时间查看对象的其他特性。本节涵盖了以下所有内容：\n\n* 接口\n\
  * 继承\n* 多态\n* 对象之间的关系\n* 运算符重载\n* 事件\n* 引用类型与值类型\n\n### 接口\n\n`interface` 是一个公共实例（即非静态）方法和属性的集合，这些成员被分组在一起以封装特定功能。在定义接口后，你可以在类中实现它。这意味着该类将支持接口指定的所有属性。\n\
  \n接口不能独立存在。你不能像实例化类那样“实例化接口”。此外，接口不能包含任何实现成员的代码；它只是定义成员。实现必须来自实现接口的类。\n\n在早期的咖啡示例中，你可能将许多更通用的属性和方法组合成接口，例如\
  \ `AddSugar()`、`Milk`、`Sugar` 和 `Instant`。你可以将此接口命名为 `IHotDrink`（接口名称通常以大写 `I` 开头）。你可以在其他对象上使用此接口，也许是\
  \ `CupOfTea` 类的对象。因此，你可以以类似的方式处理这些对象，它们仍然可以拥有自己的独立属性（例如，`CupOfCoffee` 的 `BeanType`\
  \ 和 `CupOfTea` 的 `LeafType`）。\n\n在 UML 中，对象上实现的接口使用棒棒糖语法（连接到圆形的线）。在 图 8‐6 中，`IHotDrink`\
  \ 的成员使用类语法拆分到独立的框中。\n\n![显示 IHotDrink 的成员使用类语法拆分到独立框中的图](img/Image00085.jpg)\n\n\
  **图 8‐6**\n\n\n\n\n一个类可以支持多个接口，而多个类也可以支持同一个接口。因此，接口的概念让用户和其他开发者的工作变得更加简单。例如，你可能编写了一些代码来使用具有特定接口的对象。只要你不使用该对象的其他属性和方法，就可以将一个对象替换为另一个对象（例如，之前显示使用\
  \ `IHotDrink` 接口的代码可以同时与 `CupOfCoffee` 和 `CupOfTea` 实例工作）。此外，对象本身的开发者可以为你提供一个更新版本的对象，只要它支持你正在使用的接口，在你的代码中使用这个新版本就会非常容易。\n\
  \n一旦接口被发布——也就是说，它已经提供给其他开发者或终端用户——那么良好的做法是不去更改它。考虑这种问题的一种方法是将接口想象成类创建者和类消费者之间的一份约。你实际上在说：“每一个支持接口\
  \ `X` 的类都将支持这些方法和属性。”如果接口之后发生变化（可能是由于底层代码的升级），这可能会导致该接口的消费者运行不正确，甚至失败。相反，你应该创建一个扩展旧接口的新接口，可能包含一个版本号，例如\
  \ `X2`。这已成为处理此类问题的标准方法，你可能会频繁遇到带编号的接口。\n\n### 可丢弃对象\n\n一个特别感兴趣的接口是 `IDisposable`。支持\
  \ `IDisposable` 接口的对象必须实现 `Dispose()` 方法——也就是说，它必须为该方法提供代码。此方法可以在对象不再需要时调用（例如在它超出作用范围之前），并应该用于释放任何关键资源，否则这些资源可能会一直留存，直到垃圾回收调用析构方法为止。这让你对对象所使用的资源有更多的控制权。\n\
  \nC# 允许你使用一种极佳利用了这种方法的结构。`using` 关键字允许你在代码块中初始化一个使用关键资源的对象，在代码块结束时，会自动调用 `Dispose()`：\n\
  \n```\n<ClassName> <VariableName> = new <ClassName>();\n…\nusing (<VariableName>)\n\
  {\n   …\n}\n```\n\n或者，你可以在 `using` 语句中作为一部分实例化对象 `VariableName`：\n\n```\nusing (<ClassName>\
  \ <VariableName> = new <ClassName>())\n{\n   …\n}\n```\n\n在这两种情况下，变量 `VariableName`\
  \ 在 `using` 代码块内都都是可用的，并在结束时自动被丢弃（也就是说，当代码块执行完毕时，会调用 `Dispose()`）。\n\n### 继承\n\n\
  继承是面向对象编程（OOP）最重要的特性之一。任何类都可以继承自另一个类，这意味着它将拥有所继承类的所有的成员。在 OOP 术语中，被继承的类（*源自*）被称为*父*类（也称为*基*类）。C#\
  \ 中的类只能直接继承自单个基类，尽管该基类当然有自己的基类，依此类推。\n\n继承允许你从一个单一的通用的基类扩展或创建更具体的类。例如，考虑一个代表农场动物的类（正如八十岁的开发者\
  \ Old MacDonald 在他的牲畜应用程序中使用的那样）。这个类可能被称为 `Animal`，并拥有 `EatFood()` 或 `Breed()` 等方法。你可以创建一个名为\
  \ `Cow` 的派生类，它将支持所有这些方法，但可能提供自己的方法，如 `Moo()` 和 `SupplyMilk()`。你还可以创建另一个派生类 `Chicken`，它带有\
  \ `Cluck()` 和 `LayEgg()` 方法。\n\n在 UML 中，你使用箭头指示继承，如图 8-7 所示。\n\n![图示说明了如何创建另一个派生类\
  \ Chicken，带有 Cluck() 和 LayEgg() 方法，使用箭头指示。](img/Image00086.jpg)\n\n**图 8-7**](#text00011.html_R_c08-fig-0007)\n\
  \n在使用从基类的继承时，成员的可访问性问题变成了一个重要问题。基类的私有成员在派生类中是不可访问的，但公共成员是可以的。然而，公共成员对于派生类和外部代码都是可见的。因此，如果你只能使用这两种访问级别，你就无法拥有一个既能被基类和派生类访问，又不能被外部代码访问的成员。\n\
  \n为了解决这个问题，有第三种访问级别，即*保护*（protected），只有派生类可以访问该成员。对于外部代码来说，这与私有成员是等同的——在两种情况下它都无法访问。\n\
  \n在定义成员的保护级别之外，你还可以为它定义继承行为。基类的成员可以是*虚的*（virtual），这意味着该成员可以被继承它的类重写。因此，派生类可以为该成员提供替代实现。这种替代实现并没有删除原始代码（原始代码仍然可以在类内部访问），但它将原始代码与外部代码隔离开。如果没有提供替代方案，那么任何通过派生类使用该成员的外部代码都将自动使用基类的该成员实现。\n\
  \n在动物示例中，你可以将 `EatFood()` 设置为虚方法，并在任何派生类中为它提供新的实现——例如，仅在 `Cow` 中——如图 8-8 所示。这显示了\
  \ `Animal` 和 `Cow` 类上的 `EatFood()` 方法。\n\n![图示说明如何将 EatFood() 设置为虚方法并在任何派生类中为其提供新的实现。](img/Image00087.jpg)\n\
  \n**图 8-8**](#text00011.html_R_c08-fig-0007)\n\n基类也可以被定义为*抽象*（abstract）类。抽象类不能被直接实例化；要使用它，你需要继承它。抽象类可以有抽象成员，这些成员在基类中没有实现，因此必须在派生类中提供实现。如果\
  \ `Animal` 是一个抽象类，那么 UML 将看起来如图 8-9 所示。\n\n![图示说明在派生类 Chicken 和 Cow 中同时显示 EatFood()\
  \ 和 Breed()。](img/Image00088.jpg)\n\n**图 8-9**](#text00011.html_R_c08-fig-0007)\n\
  \n在图 8-9 中，派生类 `Chicken` 和 `Cow` 显示了 `EatFood()` 和 `Breed()`，这意味着这些方法是抽象的（因此必须在派生类中重写）或者是虚的（在这种情况下，它们在\
  \ `Chicken` 和 `Cow` 中被重写）。当然，抽象基类可以提供成员的实现，这非常常见。不能实例化抽象类并不意味着你不能在其中封装功能。\n\n最后，一个类可以是*密封的*（sealed）。密封类不能被用作基类，因此不可能产生派生类。\n\
  \nC# 为所有对象提供了一个名为 `object` 的通用基类（它是 .NET Framework 中 `System.Object` 类的别名）。你将在第\
  \ 9 章](#text00012.html_c09)中详细查看该类。\n\n### 多态\n\n\n\n\n\n```\nCow myCow = new Cow();\n\
  \nChicken myChicken = new Chicken();\n\nmyCow.EatFood();\n\nmyChicken.EatFood();\
  \ \n```\n\n多态性将此概念更进了一步。你可以将一个派生类型的变量赋值给其中一个基类类型的变量，如下所示：\n\n```\n Animal myAnimal\
  \ = myCow; \n```\n\n这不需要强制类型转换。然后你可以通过该变量调用基类的方法：\n\n```\n myAnimal.EatFood(); \n\
  ```\n\n这将导致调用派生类中的 `EatFood()` 实现。请注意，你不能以相同的方式调用在派生类中定义的方法。以下代码将无法工作：\n\n```\n\
  \ myAnimal.Moo(); \n```\n\n然而，你可以将基类型变量强制转换为派生类变量，并以这种方式调用派生类的方法：\n\n```\n Cow myNewCow\
  \ = (Cow)myAnimal;\n\nmyNewCow.Moo(); \n```\n\n如果原始变量的类型不是 `Cow` 或派生自 `Cow` 的类，则此转换将抛出异常。有方法可以确定对象的类型，你将在下一章中学习。\n\
  \n多态性是一种极其实用的技术，用于对继承自单个类的不同对象执行任务，且仅需最少的代码。不仅仅是共享同一个父类的类才能利用多态性。只要它们的继承体系中存在一个公共类，就可以以相同的方式处理例如子类和孙子类。\n\
  \n在此补充说明，请记住在 C# 中，所有类都派生自继承体系根节点的基类 `object`。因此，可以将所有对象都视为 `object` 类的实例。这就是为什么\
  \ `WriteLine()` 在构建字符串时可以处理几乎无限的参数组合。第一个参数之后的每个参数都被视为 `object` 实例，允许将任何对象的输出写入到屏幕上。为了实现这一点，会调用\
  \ `ToString()` 方法（`object` 的一个成员）。你可以重写此方法以提供适用于你的类的实现，或者简单地使用默认值，它会返回类名（根据其所属的任何命名空间进行限定）。\n\
  \n### 接口多态性\n\n尽管你不能像实例化对象那样实例化接口，但你可以拥有一个接口类型的变量。然后你可以使用该变量访问支持该接口的对象上暴露的接口的方法和属性。\n\
  \n例如，假设不是使用 `Animal` 基类来提供 `EatFood()` 方法，而是将此 `EatFood()` 方法放在一个名为 `IConsume` 的接口上。`Cow`\
  \ 和 `Chicken` 类都可以支持此接口，唯一的区别是它们被强制提供 `EatFood()` 的实现，因为接口不包含实现。然后你可以使用下面的代码访问此方法：\n\
  \n```\n Cow myCow = new Cow();\n\nChicken myChicken = new Chicken();\n\nIConsume\
  \ consumeInterface;\n\nconsumeInterface = myCow;\n\nconsumeInterface.EatFood();\n\
  \nconsumeInterface = myChicken;\n\nconsumeInterface.EatFood(); \n```\n\n这为多个对象以相同方式调用提供了一种简单的方法，并且不依赖于公共基类。例如，此接口可以由名为\
  \ `VenusFlyTrap` 的类实现，该类派生自 `Vegetable` 而不是 `Animal`：\n\n```\n VenusFlyTrap myVenusFlyTrap\
  \ = new VenusFlyTrap();\n\nIConsume consumeInterface;\n\nconsumeInterface = myVenusFlyTrap;\n\
  \nconsumeInterface.EatFood(); \n```\n\n在前面的代码段中，调用 `consumeInterface.EatFood()`\
  \ 将导致调用 `Cow`、`Chicken` 或 `VenusFlyTrap` 类的 `EatFood()` 方法，取决于哪个实例被赋值给接口类型变量。\n\n\
  在此注意，派生类继承了其基类支持的接口。在前面的第一个示例中，可能是 `Animal` 支持 `IConsume`，也可能是 `Cow` 和 `Chicken`\
  \ 都支持 `IConsume`。记住，具有共同基类的类并不一定具有共同的接口，反之亦然。\n\n### 对象之间的关系\n\n继承是对象之间的一种简单关系，导致基类被派生类完全暴露，其中派生类也可以访问其基类的内部工作机制（通过保护成员）。在其他情况下，对象之间的关系变得变得。\n\
  \n本节简要查看以下内容：\n\n-   **包含 (Containment)** ——一个类包含另一个类。这类似于继承，但允许包含类控制对被包含类成员的访问，甚至在使用用被包含类的成员之前执行额外的处理。\n\
  -   **集合 (Collections)** ——一个类作为另一个类的多个实例的容器。这类似于拥有对象的数组，但集合具有额外的功能，包括索引、排序、调整大小等。\n\
  \n#### 包含\n\n通过使用成员字段持有对象实例可以轻松实现包含。该成员字段可以是公共的，在这种情况下，容器对象的用户就可以访问其暴露的方法和属性，就像继承一样。然而，你将无法通过派生类访问类的内部。\n\
  \n另一种方法，你可以将被包含的成员对象设为私有成员。如果你这样做，那么它的任何成员都将无法被用户直接访问，即使它们是公共的。相反，你可以通过包含类的成员提供对这些成员的访问。这意味着你可以完全控制暴露被包含类中的哪些成员（如果有的话），并且你可以在包含类中执行额外的处理。\n\
  \n例如，`Cow` 类可能包含一个 `Udder` 类，该类有一个公共方法 `Milk()`。`Cow` 对象可以根据需要调用此方法，但这些细节对于 `Cow`\
  \ 对象的用户来说是不可见的（或重要的）。被包含类可以在 UML 中使用关联线进行可视化。对于简单的包含，你在线条末端标记为 1，显示出一对一的关系（一个 `Cow`\
  \ 实例将包含一个 `Udder` 实例）。你也可以将被包含的 `Udder` 类实例显示为 `Cow` 类的私有字段以便清晰。\n\n## 集合\n\n第 5\
  \ 章描述了如何使用数组存储多个相同类型的变量。这同样适用于对象（记住，你一直使用的变量类型实际上是对象，所以这并不意外）。这里有一个示例：\n\n```\n\
  \ Animal[] animals = new Animal[5]; \n```\n\n*集合*基本上是一个带有很多额外功能的数组。集合以与其他对象相同的方式实现为类。它们通常以其存储的对象的复数形式命名——例如，名为\
  \ `Animals` 的类可能包含 `Animal` 对象的集合。\n\n与数组的主要区别在于集合通常实现了额外的功能，例如 `Add()` 和 `Remove()`\
  \ 方法，用于向集合添加和删除项。通常还有一个 `Item` 属性，根据索引返回对象。通常情况下，该属性的实现方式允许更复杂的访问。例如，可以设计 `Animals`\
  \ 类以便通过名称访问给定的 `Animal` 对象。\n\n\n\n\n\n在 UML 中，你可以像图 8-11 所示那样将其视觉化。图 8-11 中不包含成员变量，因为该图展示的是它们之间的关系。连接线末端的数字表示一个\
  \ `Animals` 对象将包含 0 个或多个 `Animal` 对象。你可以在第 11 章 中更详细地查看集合。\n\n![图示说明，可以设计成 Animals\
  \ 使得能够通过名称访问给定的 Animal 对象。](img/Image00090.jpg)\n\n**`图 8-11`**\n\n## 运算符重载\n\n\
  在书的前面的部分，你已经看到了如何使用运算符来处理简单的变量类型。在某些情况下，使用运算符来处理从你自定义类实例化的对象是符合逻辑的。这是可能的，因为类可以包含有关如何处理运算符的指令。\n\
  \n例如，你可能会为 `Animal` 类添加一个名为 `Weight` 的新属性。然后你可以使用以下代码来比较动物的重量：\n\n```cs\n if (cowA.Weight\
  \ > cowB.Weight)\n{\n   …\n} \n```\n\n通过运算符重载，你可以为代码中提供一种隐式使用 `Weight` 属性的逻辑，这样你就可以编写如下代码：\n\
  \n```cs\n if (cowA > cowB)\n{\n   …\n} \n```\n\n在这里，大于运算符（`>`）被被`重载`了。被重载的运算符是指你编写了代码来执行相关操作的运算符——这些代码被添加到它所操作的其中一个类的类定义中。在上一个示例中，你正在使用两个\
  \ `Cow` 对象，因此运算符重载的定义包含在 `Cow` 类中。你还可以重载运算符，以相同的方式与不同的类一起工作，其中一个（或两个）类的定义都包含了实现此目的的代码。\n\
  \n你只能通过这种方式重载现有的 C# 运算符；你不能创建新的运算符。然而，你可以为 `+` 或 `>` 等运算符的单目（单个操作数）和二元（两个操作数）用法提供实现。你可以在第\
  \ 13 章 中看到如何在 C# 中这样做。\n\n## 事件\n\n对象可以作为处理过程的一部分引发（并消费）事件。事件是重要的发生，你可以在代码的其他部分对它们进行操作，类似于异常（但比异常更强大）。例如，你可能希望在将\
  \ `Animal` 对象添加到 `Animals` 集合时执行某些特定代码，而这些代码既不是 `Animals` 类的一部分，也不是调用 `Add()` 方法代码的一部分。要实现这一点，你需要在代码中添加一个事件处理程序，这是一种特殊的函数，在事件发生时被调用。你还需要配置此处理程序以监听你感兴趣的事件。\n\
  \n你可以创建事件驱动的应用程序，这类程序比你想象的要多得多。例如，请记住 Windows 应用程序完全依赖于事件。你执行的每一次按钮点击或滚动条拖动都是通过事件处理实现的，因为事件是由鼠标或键盘触发的。\n\
  \n在本章的后半部分，你将看到这在 Windows 应用程序中是如何工作的，并在第 13 章 中对事件进行更深入的讨论。\n\n### 引用类型与值类型\n\n\
  C# 中的数据根据变量的类型以两种方式之一存储在变量中。这种类型分为两类：引用或值类型。其区别如下：\n\n*   值类型在内存中的一处（称为栈）存储其自身及其内容。\n\
  *   引用类型持有指向内存中另一个地方（称为堆）的引用，内容存储在那个地方。\n\n事实上，在使用 C# 时你不需要过于担心这一点。到目前为止，你几乎以相同的方式使用了\
  \ `string` 变量（引用类型）和其他简单变量（大部分是值类型，如 `int`）。\n\n值类型和引用类型之间的一个关键区别是，值类型始终包含一个值，而引用类型可以为\
  \ `null`，反映了它们不包含值的事实。然而，通过使用可空类型（nullable types），可以创建一个在这方面表现得像引用类型的值类型（即它可以为 `null`）。当你查看第\
  \ 12 章 中关于泛型的高级技术（包括可空类型）时，会介绍这些内容。\n\n作为引用类型的简单类型只有 `string` 和 `object`，尽管数组也是隐式的引用类型。你创建的每个类都将是引用类型，这就是为什么在这里强调了这一点。\n\
  \n## 桌面应用程序中的 OOP\n\n在第 2 章 中，你使用 Windows Presentation Foundation (WPF) 在 C# 中创建了一个简单的桌面应用程序。WPF\
  \ 桌面应用程序高度依赖于 OOP 技术，本节将介绍这些技术，以说明本章提出的某些观点。接下来的“尝试一试”（Try It Out）将允许你完成一个简单的示例。\n\
