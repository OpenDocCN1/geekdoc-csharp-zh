  \n### IComparable 和 IComparer 接口\n\n`IComparable` 和 `IComparer` 接口是 .NET Framework\
  \ 中比较对象的标准方式。接口之间的区别如下：\n\n*    `IComparable` 在被比较对象的类中实现，允许该对象与另一个对象之间进行比较。\n*\
  \   `IComparer` 在单独类中实现，允许任何两个对象之间进行比较。\n\n通常，你通过使用 `IComparable` 为类提供默认比较代码，并通过其他类进行非默认比较。\n\
  \n`IComparable` 暴露了单方法 `CompareTo()`，该方法接受一个对象。例如，你可以这样实现它，以便能够向它传递一个 `Person` 对象，并判断该人物比当前人物大还是小。事实上，此方法返回一个\
  \ `int`，因此你也可以确定第二个人大多少或小多少：\n\n```\n if (person1.CompareTo(person2) == 0)\n{\n\
  \   WriteLine(\"Same age\");\n}\nelse if (person1.CompareTo(person2) > 0)\n{\n \
  \  WriteLine(\"person 1 is Older\");\n}\nelse\n{\n   WriteLine(\"person1 is Younger\"\
  );\n} \n```\n\n`IComparer` 暴露了单方法 `Compare()`，它接受两个对象并返回整数结果，就像 `CompareTo()` 一样。通过支持\
  \ `IComparer` 的对象，你可以使用如下代码：\n\n```\n if (personComparer.Compare(person1, person2)\
  \ == 0)\n{\n   WriteLine(\"Same age\");\n}\nelse if (personComparer.Compare(person1,\
  \ person2) > 0)\n{\n   WriteLine(\"person 1 is Older\");\n}\nelse\n{\n   WriteLine(\"\
  person1 is Younger\");\n} \n```\n\n在两种情况下，提供方法的参数类型都是 `System.Object`。这意味着你可以将一个对象与任何类型的另一个对象进行比较，因此你通常需要在返回结果之前执行某些类型比较，如果使用了错误的类型，甚至可能抛出异常。\n\
  \n.NET Framework 在位于 `System.Collections` 命名空间的 `Comparer` 类中包含了 `IComparer` 接口的默认实现。该类能够对简单类型进行特定文化的比较，也可以对支持\
  \ `IComparable` 接口的任何类型进行比较。例如，你可以使用以下代码使用它：\n\n```\n string firstString = \"First\
  \ String\";\nstring secondString = \"Second String\";\nWriteLine($\"Comparing '{firstString}'\
  \ and '{secondString}', \" +\n         $\"result: {Comparer.Default.Compare(firstString,\
  \ secondString)}\");\n\nint firstNumber = 35;\nint secondNumber = 23;\nWriteLine($\"\
  Comparing '{firstNumber}' and '{ secondNumber }', \" +\n         $\"result: {Comparer.Default.Compare(firstNumber,\
  \ secondNumber)}\");\n```\n\n如下：\n\n```\n Comparing 'First String' and 'Second String',\
  \ result: -1\n\nComparing '35' and '23', result: 1\n```\n\n使用 `Comparer` 的规则如下：\n\
  \n*   传递给方法的参数将被检查是否支持 `IComparable`。\n*   空值是允许的，并且被解释为小于任何对象。\n*   字符串根据当前文化进行处理。要根据不同的文化处理字符串，必须实例化\
  \ `Comparer` 类，这允许你传递指定文化的 `CultureInfo` 对象。\n*   字符串以区分大小的方式进行处理。要以不区分大小的方式处理，你需要使用\
  \ `InsensitiveComparer` 类，它的工作方式完全相同。\n\n#### 集合排序\n\n许多集合类允许排序，可以通过对象之间的默认比较或自定义方法。`ArrayList`\
  \ 就是一个例子。它包含 `Sort()` 方法，可以不带参数使用（此时使用默认比较），也可以传递一个 `IComparer` 接口使用。\n\n当你有一个填充了简单类型（如整数或字符串）的\
  \ `ArrayList` 时，默认比较器即可。对于你自己的类，你必须在类定义中实现 `IComparable` 或者创建一个支持 `IComparer` 的独立类。\n\
  \n注意，`System.Collections` 命名中的某些类（包括 `CollectionBase`）没有暴露排序方法。如果你想对派自该类的集合进行排序，你需要更多工作，并排序内部的\
  \ `List` 集合。\n\n下面的 Try It 展示了如何使用默认和非默认比较器进行排序。\n\n## 转换\n\n到目前为止，每当你需要将一种类型转换为另一种类型时，都使用了强制类型转换，但这并不是唯一的方法。正如\
  \ `int` 可以在计算中隐式地转换为 `long` 或 `double` 一样，你也可以定义你创建的类如何转换为其他类（隐式或显式）。为了实现这一点，你重载转换运算符，就像本章早期重载其他运算符的那样。你将在本节的第一部分了解到。你还将看到另一个非常有用的运算符\
  \ `as` 运算符，在使用引用类型时，它通常比强制转换更好。\n\n### 重载转换运算符\n\n\n\n\n正如前面所示，除了重载数学和逻辑运算符外，你还可以定义类型之间的隐式和显式转换。如果你想在没有关系的类型之间进行转换——例如，它们之间没有继承关系也没有共同的接口——这种转换就是必要的。\n\
  \n假设你在 `ConvClass1` 和 `ConvClass2` 之间定义了一个隐式转换。这意味着你可以编写如下代码：\n\n```\nConvClass1\
  \ op1 = new ConvClass1();\n\nConvClass2 op2 = op1; \n```\n\n或者，你可以定义一个显式转换：\n\n\
  ```\nConvClass1 op1 = new ConvClass1();\n\nConvClass2 op2 = (ConvClass2)op1; \n\
  ```\n\n作为一个示例，考虑以下代码：\n\n```\n public class ConvClass1\n{\n   public int val;\n\n\
  \   public static implicit operator ConvClass2(ConvClass1 op1)\n   {\n      ConvClass2\
  \ returnVal = new ConvClass2();\n      returnVal.val = op1.val;\n      return returnVal;\n\
  \   }\n}\n\npublic class ConvClass2\n{\n   public double val;\n\n   public static\
  \ explicit operator ConvClass1(ConvClass2 op1)\n   {\n      ConvClass1 returnVal\
  \ = new ConvClass1();\n      checked {returnVal.val = (int)op1.val;};\n      return\
  \ returnVal;\n   }\n} \n```\n\n在这里，`ConvClass1` 包含一个 `int` 值，而 `ConvClass2` 包含一个\
  \ `double` 值。由于 `int` 值可以隐式地转换为 `double` 值，因此你可以在 `ConvClass1` 和 `ConvClass2` 之间定义隐式转换。然而，反则不然，你应该将\
  \ `ConvClass2` 到 `ConvClass1` 之间的转换运算符定义为显式。\n\n你使用所示的 `implicit` 和 `explicit` 关键字来指定这一点。使用这些类，以下代码是正常的：\n\
  \n```\nConvClass1 op1 = new ConvClass1();\n\nop1.val = 3;\n\nConvClass2 op2 = op1;\
  \ \n```\n\n然而，另一个方向的转换需要以下显式强制转换：\n\n```\nConvClass2 op1 = new ConvClass2();\n\n\
  op1.val = 3e15;\n\nConvClass1 op2 = (ConvClass1)op1; \n```\n\n由于你在显式转换中使用了 `checked`\
  \ 关键字，上述代码中将得到一个异常，因为 `op1` 的 `val` 属性太大，无法放入 `op2` 的 `val` 属性中。\n\n### `as` 运算符\n\
  \n`as` 运算符使用以下语法将类型转换为指定的引用类型：\n\n```\noperand\n\n> as type\n\n>\n```\n\n这只有在某些情况下才是可能的：\n\
  \n* 如果 `<operand>` 类型为 `<type>`\n* 如果 `<operand>` 可以隐式转换为类型 `<type>`\n* 如果 `<operand>`\
  \ 可以装箱为类型 `<type>`\n\n如果无法从 `<operand>` 到 `<type>` 转换，则表达式的结果将为 `null`。\n\n通过显式转换可以实现基类到派生类的转换，但它并不总是有效。考虑前一个示例中的两个类\
  \ `ClassA` 和 `ClassD`，其中 `ClassD` 继承自 `ClassA`：\n\n```\n class ClassA : IMyInterface\
  \ {}\n\n   class ClassD : ClassA {} \n```\n\n以下代码使用 `as` 运算符将存储在 `obj1` 中的 `ClassA`\
  \ 实例转换为 `ClassD` 类型：\n\n```\nClassA obj1 = new ClassA();\n\nClassD obj2 = obj1 as\
  \ ClassD; \n```\n\n这将导致 `obj2` 为 `null`。\n\n然而，通过多态性可以将 `ClassD` 实例存储在 `ClassA`\
  \ 类型变量中。以下代码说明了这一点，使用 `as` 运算符将包含 `ClassD` 类型实例的 `ClassA` 类型变量转换为 `ClassD` 类型：\n\
  \n```\nClassD obj1 = new ClassD();\n\nClassA obj2 = obj1;\n\nClassD obj3 = obj2\
  \ as ClassD; \n```\n\n这一次，结果是 `obj3` 最终包含指向与 `obj1` 对象的引用，而不是 `null`。\n\n此功能使得 `as`\
  \ 运算符非常有用，因为以下代码（使用简单的强制转换）会导致抛出异常：\n\n```\nClassA obj1 = new ClassA();\n\nClassD\
  \ obj2 = (ClassD)obj1; \n```\n\n此代码的 `as` 等效写法将为 `obj2` 分配 `null` 值——不会抛出异常。这意味着如下代码（使用本章稍早开发的两个类，`Animal`\
  \ 和派自 `Animal` 的类 `Cow`）在 C# 应用中非常常见：\n\n```\npublic void MilkCow(Animal myAnimal)\n\
  {\n   Cow myCow = myAnimal as Cow;\n\n   if (myCow != null)\n   {\n      myCow.Milk();\n\
  \   }\n   else\n   {\n     WriteLine($\"{myAnimal.Name} isn't a cow, and so can't\
  \ be milked.\");\n   }\n} \n```\n\n## 练习\n\n1. 11.1 创建一个带有 `int` 索引的 `Person` 集合。\n\
  ```\nclass Person\n{\n   private string name;\n   private int age;\n\n   public\
  \ string Name\n   {\n      get { return name; }\n      set { name = value; }\n \
  \  }\n} \n```\n\n2. 11.2 扩展 `Person` 类，使得重载 `>`、`<`、`` 和 `<=` 运算符。\n```\nclass Person\n\
  {\n   private string name;\n   private int age;\n\n   public string Name\n   {\n\
  \      get { return name; }\n      set { name = value; }\n   }\n\n   public int\
  \ Age\n   {\n      get { return age; }\n      set { age = value; }\n   }\n} \n```\n\
  \n3. 11.3 在 `Person` 类上实现 `IComparable` 以比较 `Age` 属性。\n```\nclass Person : IComparable\n\
  {\n   private string name;\n   private int age;\n\n   public string Name\n   {\n\
  \      get { return name; }\n      set { name = value; }\n   }\n\n   public int\
  \ Age\n   {\n      get { return age; }\n      set { age = value; }\n   }\n\n   public\
  \ int CompareTo(object obj)\n   {\n      return age.CompareTo((Person)obj).age);\n\
  \   }\n}\n```\n\n4. 11.4 在 `Person` 类上实现 `ICloneable` 以提供深拷贝。\n\n5. 11.5 在 `People`\
  \ 类中添加一个迭代器，以便在 `foreach` 循环中获取年龄：\n```\nforeach (int age in myPeople.Ages)\n{\n\
  \   // 显示年龄。\n}\n```\n\n\n\n为了最好地说明泛型是什么以及它们为什么有用，请回想上一章节中的集合类。你已经看到了基本集合如何被包含在如\
  \ `ArrayList` 等类中，但此类集合会因为缺乏类型而产生困扰。这要求你将 `object` 项强制转换为集合中实际存储的任何类型。由于任何继承自 `Object`\
  \ 的类型（即实际上任何类型）都可以存储在 `ArrayList` 中，因此你必须小心。假设某些类型都包含在集合中可能会抛出异常并导致代码崩溃。你已经学习了一些处理这种问题的技术，包括检查对象类型所需的代码。\n\
  \n然而，你发现更好的解决方案是使用强类型集合。通过派生自 `CollectionBase` 并提供自己的方法来添加、删除和其他方式访问成员，你可以将成员限制为派生自特定类型或支持某些接口的成员。这时你就会遇到一个问题：每当你创建一个需要存放在集合中的新类时，你必须执行以下操作之一：\n\
  \n* 使用你已经创建的可以包含新类型项的集合类。\n* 创建一个新的可以容纳新类型项的集合类，并实现所有需要的方法。\n\n通常情况下，对于新类型你需要额外的功能，因此大多数时候你需要一个新的集合类。因此，编写集合类会花费相当的时间！相反，泛型类让代码编写变得简单得多。泛型类是围绕你在实例化期间提供的任何类型或多个类型构建的，这使得你能够几乎不费力地对对象进行强类型处理。在集合的范围内，创建一个“某种类型的集合”就像口说出来一样简单——并且可以通过一行代码实现。与其使用如下代码：\n\
  \n```\nCollectionClass items = new CollectionClass();\nitems.Add(new ItemClass());\n\
  ```\n\n你可以使用这种：\n\n```\nCollectionClass<ItemClass> items = new CollectionClass<ItemClass>();\n\
  items.Add(new ItemClass());\n```\n\n尖括号语法是将类型参数传递给泛型类型的方法。在前面的代码中，将 `CollectionClass<ItemClass>`\
  \ 视为 `ItemClass` 类型的 `CollectionClass`。你当然将在章节的晚些部分更详细地检查这种语法。泛型主题不仅限于集合，但它们特别适用于这一领域，正如你将在章节稍些时候查看\
  \ `System.Collections.Generic` 命名空间时看到的。通过创建泛型类，你可以生成签名可以强类型为任何你所需的类型的方法，甚至考虑到类型可以是值类型或引用类型，并在这些情况发生时进行单独处理。你甚至可以限制仅使用部分类型，通过将实例化泛型类时使用的类型限制为支持给定接口或派生自特定类型的类型。此外，你不仅限于泛型类——你可以创建泛型接口、泛型方法（可以在非泛型类上定义），甚至是泛型委托。这一切都为你的代码增添了极大的灵活性，明智地使用泛型可以节省数小时开发时间。\n\
  \n你可能在想这一切是如何实现的。通常情况下，当你创建一个类时，它会被编译成一种你可以在代码中使用的类型。你可能认为，当你创建一个泛型类时，它必须被编译成大量的类型，以便你对其进行实例化。幸运的是，事实并非如此——考虑到\
  \ .NET 中存在无限可能的类，这样更好。在后台，.NET 运行时允许在你需要时动态生成泛型类。一个给定的 `B` 类型泛型类 `A` 在你通过实例化它来请求它之前是不存在的。\n\
  \n## 使用泛型\n\n在查看如何创建自己的泛型类型之前，查看 .NET Framework 提供的类型是值得的。这些包括 `System.Collections.Generic`\
  \ 命名空间中的类型，你在代码中多次看到这个命名空间，因为控制台应用程序默认包含了它。你还没有使用过该命名空间中的任何类型，但情况即将就会改变。本节介绍了此命名空间中的类型以及你如何使用它们来创建强类型集合并改进你现有集合的功能。\n\
  \n首先，你将看到另一个更简单的泛型类型，它解决了值类型的一个小问题：可空类型。\n\n### 可空类型\n\n在早的章节中，你看到值类型（包括大多数基本类型，如\
  \ `int` 和 `double` 以及所有结构体）与引用类型（`string` 和任何类）的区别之一是，它们必须包含一个值。相反，泛型类让代码编写变得简单得多。泛型类是围绕你在实例化期间提供的任何类型或多个类型构建的，这使得你能够几乎不费力地对对象进行强类型处理。在集合的范围内，创建一个“类型\
  \ `T` 的集合”就像口说出来一样简单——并且可以通过一行代码实现。与其使用如下代码：\n\n```\nCollectionClass items = new\
  \ CollectionClass();\nitems.Add(new ItemClass());\n```\n\n你可以使用这种：\n\n```\nCollectionClass<ItemClass>\
  \ items = new CollectionClass<ItemClass>();\nitems.Add(new ItemClass());\n```\n\n\
  尖括号语法是将类型参数传递给泛型类型的方法。在前面的代码中，将 `CollectionClass<ItemClass>` 视为 `ItemClass` 类型的\
  \ `CollectionClass`。你当然将在章节的晚些部分更详细地检查这种语法。\n\n泛型主题不仅限于集合，但它们特别适用于这一领域，正如你将在章节稍些时候查看\
  \ `System.Collections.Generic` 命名空间时看到的。通过创建泛型类，你可以生成签名可以强类型为任何你所需的类型的方法，甚至考虑到类型可以是值类型或引用类型，并在这些情况发生时进行单独处理。你甚至可以限制仅使用部分类型，通过将实例化泛型类时使用的类型限制为支持给定接口或派生自特定类型。此外，你不仅限于泛型类——你可以创建泛型接口、泛型方法（可以在非泛型类上定义），甚至是泛型委托。这一切都为你的代码增添了极大的灵活性，明智地使用泛型可以节省数小时开发时间。\n\
  \n你可能在想这一切是如何实现的。通常情况下，当你创建一个类时，它会被编译成一种你可以在代码中使用的类型。你可能认为，当你创建一个泛型类时，它必须被编译成大量的类型，以便你对其进行实例化。幸运的是，事实并非如此——考虑到\
  \ .NET 中存在无限可能的类，这样更好。在后台，.NET 运行时允许在你需要时动态生成泛型类。一个给定的 `B` 类型泛型类 `A` 在你通过实例化它来请求它之前是不存在的。\n\
  \n可空类型解决了值类型的一个小问题。在早的章节中，你看到值类型（包括大多数基本类型，如 `int` 和 `double` 以及所有结构体）与引用类型（`string`\
  \ 和任何类）的区别之一是，它们必须包含一个值。相反，泛型类让代码编写变得简单得多。泛型类是围绕你在实例化期间提供的任何类型或多个类型构建的，这使得你能够几乎不费力地对对象进行强类型处理。在集合的范围内，创建一个“类型\
  \ `T` 的集合”就像口说出来一样简单——并且可以通过一行代码实现。与其使用如下代码：\n\n```\nCollectionClass items = new\
  \ CollectionClass();\nitems.Add(new ItemClass());\n```\n\n你可以使用这种：\n\n```\nCollectionClass<ItemClass>\
  \ items = new CollectionClass<ItemClass>();\nitems.Add(new ItemClass());\n```\n\n\
  尖括号语法是将类型参数传递给泛型类型的方法。在前面的代码中，将 `CollectionClass<ItemClass>` 视为 `ItemClass` 类型的\
  \ `CollectionClass`。你当然将在章节的晚些部分更详细地检查这种语法。\n\n泛型主题不仅限于集合，但它们特别适用于这一领域，正如你将在章节稍些时候查看\
  \ `System.Collections.Generic` 命名空间时看到的。通过创建泛型类，你可以生成签名可以强类型为任何你所需的类型的方法，甚至考虑到类型可以是值类型或引用类型，并在这些情况发生时进行单独处理。你甚至可以限制仅使用部分类型，通过将实例化泛型类时使用的类型限制为支持给定接口或派生自特定类型。此外，你不仅限于泛型类——你可以创建泛型接口、泛型方法（可以在非泛型类上定义），甚至是泛型委托。这一切都为你的代码增添了极大的灵活性，明智地使用泛型可以节省数小时开发时间。\n\
  \n对于简单类型，如 `int` ，你可以使用 `+` , `\\-` 等等运算符来处理值。对于可空类型等价物，没有区别：可空类型中包含的值会被隐式转换为所需的类型，并使用相应的运算符。这也适用于你已经提供的运算符的结构体：\n\
  \n```csharp\nint? op1 = 5;\nint? result = op1 * 2;\n```\n\n\n\n要使此生效，你必须执行显式转换或通过\
  \ `Value` 属性访问值，这需要如下代码：\n\n```\n int? op1 = 5;\n\nint result = (int)op1 * 2; \n\
  ```\n\n或者：\n\n```\n int? op1 = 5;\n\nint result = op1.Value * 2; \n```\n\n只要 `op1`\
  \ 有值，这种方法就能正常工作——如果它是 `null`，你将得到一个类型为 `System.InvalidOperationException` 的异常。\n\
  \n引发了一个明显的问题：当涉及两个可空类型的运算符求值中，其中一个或两个值为 `null` 时会发生什么？例如下面代码中的 `op1`：\n\n```\n int?\
  \ op1 = null;\n\nint? op2 = 5;\n\nint? result = op1 * op2; \n```\n\n答案是，对于除 `bool?`\
  \ 以外的所有简单可空类型，操作的结果都是 `null`，你可以将其解释为“无法计算”。对于结构体，你可以定义自己的运算符来处理这种情况（如本章后文所示），而对于\
  \ `bool?`，定义了用于 `&` 和 `|` 的运算符，可能会导致非 `null` 返回值。表格中的结果在逻辑上是完全合理的——如果有足够的信息不需要知道其中一个操作数的值就能算出计算结果，那么该操作数是否为\
  \ `null` 并不重要。\n\n## ?? 运算符\n\n为了进一步减少处理可空类型所需的代码量，并让你更容易处理可能为 `null` 的变量，你可以使用\
  \ `??` 运算符。它被称为空合并运算符，是一个二元运算符，允许你为可能评估为 `null` 的表达式提供备用值。如果第一个操作数不是 `null`，则运算符求值为第一个操作数；如果第一个操作数为\
  \ `null`，则求值为第二个操作数。从功能上讲，以下两个表达式是等的：\n\n```\n op1 ?? op2\n\nop1 == null ? op2 :\
  \ op1 \n```\n\n在这段代码中，`op1` 可以是任何可空表达式，包括引用类型以及更重要的是，一个可空类型。这意味着你可以使用 `??` 运算符在可空类型为\
  \ `null` 时提供使用的默认值，如下所示：\n\n```\n int? op1 = null;\n\nint result = op1 * 2 ?? 5;\
  \ \n```\n\n因为在这个示例中 `op1` 是 `null`，所以 `op1` `*` `2` 也是 `null`。然而，`??` 运算符检测到了这一点并将\
  \ `5` 赋值给 `result`。重要的是，请注意，将结果放入 `int` 类型变量 `result` 中不需要显式转换。`??` 运算符已经为你处理了这一转换。或者，你可以顺利地将\
  \ `??` 求值的结果传递给 `int?`：\n\n```\n int? result = op1 * 2 ?? 5; \n```\n\n这种行为使得 `??`\
  \ 运算符在处理可空变量时成为一个非常多用的工具，并且是一种在不使用 `if` 结构中的代码块或经常令人困惑的三元运算符的情况下提供默认值的方便方法。\n\n\
  ## ?. 运算符\n\n该运算符通常被称为 Elvis 运算符或空条件运算符，有助于克服由繁琐的空检查引起的代码歧义。例如，如果你想获取特定客户的订单计数，你需要在设置计数值之前检查是否为空：\n\
  \n```\n int count = 0;\n\nif (customer.orders ! = null)\n\n{\n  count = customer.orders.Count();\n\
  \n} \n```\n\n如果你只是编写这段代码且该客户没有订单（即为 `null`），则会抛出 `System.ArgumentNullException`\
  \ 异常：\n\n```\n int count = customer.orders.Count(); \n```\n\n使用 `?.` 运算符会导致 `int?\
  \ count` 被设置为 `null` 而不是发生异常。\n\n```\n int? count = customer.orders?.Count(); \n\
  ```\n\n将上一节讨论过的空合并运算符 `??` 与空条件运算符 `?.` 结合使用，就可以在结果为 `null` 时设置默认值。\n\n```\n int?\
  \ count = customer.orders?.Count() ?? 0; \n```\n\n空条件运算符的另一个用途是触发事件。事件将在[第 13 章]中详细讨论。触发事件最常见的方法是使用这种代码模式：\n\
  \n```\n var onChanged = OnChanged;\n\nif (onChanged != null)\n\n{\n  onChanged(this,\
  \ args);\n\n} \n```\n\n这种模式不是线程安全的，因为有人可能在完成空检查后立即取消最后一个事件处理器。当这种情况发生时，会抛出异常并导致应用程序崩溃。可以通过以下方式避免这种情况：在检查之前复制代理引用（如之前的代码段所示\
  \ `var onChanged = onChanged;`），或者如下所示使用空条件运算符：\n\n```\n OnChanged?.Invoke(this,\
  \ args); \n```\n\n如[第 11 章]中所述，使用 `?.` 运算符结合 `==` 运算符重载在 `C:\\BeginningCSharp7\\\
  Chapter12\\Ch12CardLib\\Card.cs` 类中检查空值，以防止在使用该方法时抛出异常。例如：\n\n```\n public bool\
  \ operator ==(card1, card2)\n\n        => (card1.suit) && (card2.rank);\n```\n\n\
  ## 使用可空类型\n\n使用以下内容进行：\n\n### System.Collections.Generic 命名空间\n\n在目前几乎每个应用程序中，你都看到了以下命名空间：\n\
  \n```\nusing System;\n\nusing System.Collections.Generic;\n\nusing System.Linq;\n\
  \nusing System.Text;\n\nusing System.Threading.Tasks;\n\nusing static Console;\n\
  ```\n\n*   `System` 命名空间包含了 .NET 使用的大部分基本类型。\n*   `System.Collections.Generic` 命名空间包含用于集合的泛型类型，通常与\
  \ `using` 语句一起使用。\n*   你将在以后学习 `System.Linq` 命名空间。\n*   `System.Text` 命名空间包括与字符串处理编码相关的类型。\n\
  *   `System.Threading.Tasks` 命名空间包含帮助你编写异步代码的类型，本书未涵盖。\n*   `using static Console`\
  \ 在编写控制台应用程序时非常有用。手动添加后，你就不需要反复编写 `WriteLine()` 和 `ReadLine()`。\n\n现在我们将查看这些类型，它们保证能让你的工作变得更容易。它们让你能够毫不费力地创建强类型类。例如，表\
  \ 12-1](#text0015.html_c12-tbl-0001) 列出了 `System.Collections.Generic` 命名空间中在本节介绍的两种类型。该命名空间中的更多类型将在本章晚些部分介绍。\n\
  \n| 类型 |  |\n| --- | --- |\n| `List<T>` | `T` 类型对象的集合 |\n| `Dictionary<K, V>` |\
  \ 与 `K` 类型键关联的 `V` 类型项集合 |\n\n### List<T>\n\n与其派生自 `CollectionBase` 类并如上章那样实现所需的方法，直接使用\
  \ `List<T>` 泛型集合类型可能会更快更简单。这里额外的好处是许多你通常需要实现的方法（如 `Add()`）已经为你实现了。\n\n创建一个 `T` 类型对象的集合需要以下代码：\n\
  \n```\n List<T> myCollection = new List<T>(); \n```\n\n\n\n就是这样。你不需要定义任何类、实现任何方法或进行任何其他操作。你还可以通过向构造函数传递一个\
  \ `List<T>` 对象来为集合设置初始项目列表。`List<T>` 还具有一个 `Item` 属性，允许类似于数组的访问：\n\n```\n T itemAtIndex2\
  \ = myCollectionOfT[2]; \n```\n\n该类还支持其他几个方法，但这些已经足够你入门了。接下来的“尝试一下”（Try It Out）演示了如何在实践中使用\
  \ `List<T>`。\n\n### 排序和搜索泛型列表\n\n排序泛型列表与排序任何其他列表非常相似。最后一章描述了如何使用 `IComparer` 和 `IComparable`\
  \ 接口来比较两个对象，从而对该类型对象的列表进行排序。这里的区别在于，你可以使用泛型接口 `IComparer<T>` 和 `IComparable<T>`，它们暴露了略有不同的、特定类型的方法。表\
  \ 12-2 解释了这些差异。\n\n| 泛型方法 | 非泛型方法 | 差异 |\n| --- | --- | --- |\n| `Int IComparable<T>.CompareTo(T\
  \ otherObj)` | `int IComparable.CompareTo(object otherObj)` | 泛型版本中是强类型的。 |\n| `Bool\
  \ IComparable<T>.Equals(T otherObj)` | N/A | 非泛型接口上不存在；可以使用继承的 `object.Equals()`\
  \ 代替。 |\n| `Int IComparer<T>.Compare(T objectA, T objectB)` | `int IComparer.Compare(object\
  \ objectA, object objectB)` | 泛型版本中是强类型的。 |\n| `Bool IComparer<T>.Equals(T objectA,\
  \ T objectB)` | N/A | 非泛型接口上不存在；可以使用继承的 `object.Equals()` 代替。 |\n| `Int IComparer<T>.GetHashCode(T\
  \ objectA)` | N/A | 非泛型接口上不存在；可以使用继承的 `object.GetHashCode()` 代替。 |\n\n**表 12-2 :**\
  \ 使用泛型类型进行排序\n\n要对 `List<T>` 进行排序，你可以为被排序的类型提供 `IComparable<T>` 接口，或者提供一个 `IComparer<T>`\
  \ 接口。或者，你可以提供一个泛型委托作为排序方法。从观察代码如何工作的角度来看，这要有趣得多，因为实现这里描述的接口并不比实现它们的非泛型对应版本更费精力。\n\
  \n通俗来说，排序列表只需要一个比较两个 `T` 类型对象的方法；而搜索列表则只需要一个检查 `T` 类型对象以确定其是否符合某些标准的方法。定义此类方法是一件简单的事，为了帮助你，你可以使用两种泛型委托类型：\n\
  \n* `Comparison<T>` — 用于排序方法的委托类型，具有以下返回类型和参数：\n\n```\n int method(T objectA, T\
  \ objectB) \n```\n\n* `Predicate<T>` — 用于搜索方法的委托类型，具有以下返回类型和参数：\n\n```\n bool method(T\
  \ targetObject) \n```\n\n你可以定义任意数量的此类方法，并使用它们“插拔”到 `List<T>` 的搜索和排序方法中。接下来的“尝试一下”演示了这种技术。\n\
  \n### Dictionary<K, V>\n\n`Dictionary<K, V>` 类型允许你定义一个键值对集合。与你在本章中看到的其他泛型集合类型不同，此类需要实例化两个类型：代表集合中每个项目的键类型和值类型。\n\
  \n一旦实例化了 `Dictionary<K, V>` 对象，你就可以对它执行许多与继承自 `DictionaryBase` 的类相似的操作，但已经内置了类型安全的方法和属性。例如，你可以使用强类型的\
  \ `Add()` 方法添加键值对：\n\n```\n Dictionary<string, int> things = new Dictionary<string,\
  \ int>();\n\nthings.Add(\"Green Things\", 29);\n\nthings.Add(\"Blue Things\", 94);\n\
  \nthings.Add(\"Yellow Things\", 34);\n\nthings.Add(\"Red Things\", 52);\n\nthings.Add(\"\
  Brown Things\", 27); \n```\n\n不使用 `Add()` 方法添加键值对同样可以实现，而且看起来更优雅一点：\n\n```\n Dictionary<string,\
  \ int> things = new Dictionary<string, int>(){\n\n    {\"Green Things\", 29},\n\n\
  \    {\"Blue Things\", 94},\n\n    {\"Yellow Things\", 34},\n\n    {\"Red Things\"\
  , 52},\n\n    {\"Brown Things\", 27}\n\n}; \n```\n\n通过使用 `Keys` 和 `Values` 属性遍历集合中的键和值：\n\
  \n```\n foreach (string key in things.Keys)\n\n{\n\n   WriteLine(key);\n}\n\nforeach\
  \ (int value in things.Values)\n\n{\n   WriteLine(value);\n} \n```\n\n此外，通过获取每个项目作为\
  \ `KeyValuePair<K, V>` 实例来遍历集合中的项目，就像你在最后一章中使用 `DictionaryEntry` 对象一样：\n\n```\n\
  \ foreach (KeyValuePair<K, V> thing in things)\n\n{\n\n   WriteLine($\"{thing.Key}\
  \ = {thing.Value}\");\n}\n```\n\n关于 `Dictionary<K, V>` 需要注意的一点是键必须是唯一的。尝试添加相同键的项目将导致抛出\
  \ `ArgumentException`。\n\n\n\n\n你现在已经学习了足够的泛型知识，可以创建自己的泛型了。你已经看到了很多涉及泛型类型的代码，并练习了使用泛型语法。本节将介绍内容的定义：\n\
  \n*   泛型类\n*   泛型接口\n*   泛型方法\n*   泛型委托\n\n你还将学习以下更高级的技术，用于处理定义泛型类型时出现的问题：\n\n*\
  \   `default` 关键字\n*   类型约束\n*   继承自泛型类\n*   泛型操作符\n\n### 定义泛型类\n\n要创建一个泛型类，只需在类定义中包含角括号语法即可：\n\
  \n```\n class MyGenericClass<T> { … } \n```\n\n在这里，`T` 可以是你喜欢的任何标识符，遵循通常的 C# 命名规则（例如不以数字开头等）。不过，通常你可以直接使用\
  \ `T`。泛型类在定义中可以包含任意数量的类型参数，用逗号分隔：\n\n```\n class MyGenericClass<T1, T2, T3> { …\
  \ } \n```\n\n一旦定义了这些类型，你就可以像使用其他类型一样在类定义中使用它们。你可以将它们用作成员变量的类型、属性或方法等成员的返回类型，以及方法参数的参数类型：\n\
  \n```\n class MyGenericClass<T1, T2, T3>\n{\n   private T1 innerT1Object;\n   public\
  \ MyGenericClass(T1 item)\n   {\n      innerT1Object = item;\n   }\n   public T1\
  \ InnerT1Object\n   {\n      get { return innerT1Object; }\n   }\n} \n```\n\n在这里，可以将类型为\
  \ `T1` 的对象传递给构造函数，并通过属性 `InnerT1Object` 对该对象进行只读访问。注意，你几乎无法对传递类的类型做出任何假设。例如，下面的代码将无法编译：\n\
  \n```\n class MyGenericClass<T1, T2, T3>\n{\n   private T1 innerT1Object;\n   public\
  \ MyGenericClass()\n   {\n      innerT1Object = new T1();\n   }\n   public T1 InnerT1Object\n\
  \   {\n      get { return innerT1Object; }\n   }\n} \n```\n\n因为你不知道 `T1` 是什么，所以无法使用它的任何构造函数——它可能根本没有构造函数，或者可能没有公开访问的默认构造函数。在没有涉及本节后所示技术的更复杂代码的情况下，你只能对\
  \ `T1` 做出以下假设：你可以将其视为一个继承自 `System.Object` 或可以装箱为 `System.Object` 的类型。\n\n显然，这意味着你实际上无法对该类型的实例或提供给泛型类\
  \ `MyGenericClass` 的任何其他类型执行任何非常有趣的操作。如果不使用 `reflection`（一种用于在运行时检查类型的高级技术，反射将在第\
  \ 13 章 中讨论），你仅局限于编写比以下代码不复杂的代码：\n\n```\n public string GetAllTypesAsString()\n \
  \  {\n      return \"T1 = \" + typeof(T1).ToString()\n         + \", T2 = \" + typeof(T2).ToString()\n\
  \         + \", T3 = \" + typeof(T3).ToString();\n   } \n```\n\n你还可以做多做一些事情，特别是在集合方面，因为处理对象组是一个非常简单的过程，不需要对对象类型做出任何假设——这也是为什么你在本章中看到的泛型集合类存在的良好理由。\n\
  \n你需要注意的另一个限制是，只有在将提供给泛型类型的值与 `null` 进行比较时，才允许使用操作符 `==` 或 `!=`。也就是说，下面的代码运行运行良好：\n\
  \n```\n public bool Compare(T1 op1, T1 op2)\n   {\n      if (op1 != null && op2\
  \ != null)\n      {\n         return true;\n      }\n      else\n      {\n     \
  \    return false;\n      }\n   } \n```\n\n在这里，如果 `T1` 是值类型，则始终被假设为非 `null`，因此前面的代码\
  \ `Compare` 将始终返回 `true`。然而，尝试比较两个参数 `op1` 和 `op2` 将无法编译：\n\n```\n public bool Compare(T1\
  \ op1, T1 op2)\n   {\n      if (op1 == op2)\n      {\n         return true;\n  \
  \    }\n      else\n      {\n         return false;\n      }\n   } \n```\n\n这是因为这段代码假设\
  \ `T1` 支持 `==` 操作符。简而言之，为了对泛型执行任何有趣的操作，你需要更多地了解类中使用的类型。\n\n#### default 关键字\n\n\
  关于用于创建泛型类实例的类型，你可能想知道的最基础之一是它们是引用类型还是值类型。如果不知道这一点，你甚至无法通过这样的代码分配 `null` 值：\n\n```\n\
  \ public MyGenericClass()\n   {\n      innerT1Object = null;\n   } \n```\n\n如果 `T1`\
  \ 是值类型，那么 `innerT1Object` 就不能为 `null`，所以这段代码无法编译。幸运的是，这个问题已经得到了解决，产生了 `default`\
  \ 关键字的新用法。它的用法如下：\n\n```\n public MyGenericClass()\n   {\n      innerT1Object =\
  \ default(T1);\n   } \n```\n\n#### 类型约束\n\n你到目前为止使用的类型被称为无界类型，因为对它们可以做什么的内容没有设置任何限制。通过约束类型，可以将类型限制为继承自特定类型的类型。有多种方法可以实现这一点。例如，你可以将类型限制为继承自\
  \ `Animal` 的类型。回到之前使用的 `Animal` 和 `Cow` 类，这段代码是可以运行的：\n\n```\n MyGenericClass<Cow>\
  \ = new MyGenericClass<Cow>();\n```\n\n以下代码将无法编译：\n\n```\n MyGenericClass<string>\
  \ = new MyGenericClass<string>();\n```\n\n在你的类定义中，这是通过 `where` 关键字实现的：\n\n```\n\
  \ class MyGenericClass<T> where T : constraint { … } \n```\n\n在这里，`constraint` 定义了约束是什么。你可以通过逗号分隔来以这种方式提供多个约束：\n\
  \n```\n class MyGenericClass<T> where T : constraint1, constraint2 { … } \n```\n\
  \n你可以通过使用多个 `where` 语句对泛型类所需的任何或所有类型定义约束：\n\n```\n class MyGenericClass<T1, T2>\
  \ where T1 : constraint1 where T2 : constraint2 { … } \n```\n\n你使用的任何约束都必须出现在继承说明符之后：\n\
  \n```\n class MyGenericClass<T1, T2> : MyBaseClass, IMyInterface where T1 : constraint1\
  \ where T2 : constraint2 { … } \n```\n\n\n\n\n| `new()` | 类型必须具有公共的、无参数的构造函数。 |\
  \ 在一个需要实例化类型为 `T` 的变量的类，可能在构造函数 |\n\n**表 12-3:** 泛型类型约束\n\n可以通过基类约束将一个类型参数作为另一个参数的约束，如下所示：\n\
  \n```cs\n class MyGenericClass<T1, T2> where T2 : T1\n\n { … } \n```\n\n在这里，`T2`\
  \ 必须与 `T1` 相同类型，或者继承自 `T1`。这被称为*裸类型约束*（naked type constraint），意味着一个泛型类型参数被用作另一个参数的约束。\n\
  \n如下所示，循环类型约束是禁止允许的：\n\n```cs\n class MyGenericClass<T1, T2> where T2 : T1 where\
  \ T1 : T2\n\n { … } \n```\n\n这段代码将无法编译。在接下来的“尝试一下”（Try It Out）中，你将定义并使用一个使用了前面章节所示\
  \ `Animal` 系列类的泛型类。\n\n### 继承泛型类\n\n前一个示例中的 `Farm<T>` 类，以及在本章中看到的其他几个类，都继承自一个泛型类型。在\
  \ `Farm<T>` 的情况下，该类型是一个接口：`IEnumerable<T>`。在这里，`Farm<T>` 提供的 `T` 约束导致了 `IEnumerable<T>`\
  \ 中使用的 `T` 的额外约束。这对于约束原本无边界的类型是一种有用的技术。但是，你需要遵循一些规则。\n\n首先，你不能“取消”继承的类型中已受约束的类型。换句话说，在你继承的类型使用的类型\
  \ `T`，其约束至少要与在该类型中的约束一样多。例如，以下代码是好的：\n\n```cs\n class SuperFarm<T> : Farm<T>\n\n\
  \      where T : SuperCow {} \n```\n\n这之所以有效，是因为 `T` 在 `Farm<T>` 中被约束为 `Animal`，而将其约束为\
  \ `SuperCow` 是将 `T` 约束为这些值的子集。然而，以下代码将无法编译：\n\n```cs\n class SuperFarm<T> : Farm<T>\n\
  \n      where T : struct\n\n{} \n```\n\n在这里，你可以明确说提供给 `SuperFarm<T>` 的类型 `T` 无法转换为\
  \ `Farm<T>` 可用的 `T`，因此代码将无法编译。\n\n即使约束是超集的情况也存在相同的问题：\n\n```cs\n class SuperFarm<T>\
  \ : Farm<T>\n\n      where T : class\n\n{} \n```\n\n尽管 `Farm<T>` 允许像 `Animal` 这样的类型，其他满足类约束的类型在\
  \ `Farm<T>` 中是不被允许的。同样，编译将失败。此规则适用于本章前面显示的所有约束类型。\n\n另外注意，如果你继承自一个泛型类型，你必须提供所有所需的类型信息，要么以所示泛型类型参数的形式，要么显式地提供。这同样适用于继承泛型类型的非泛型类，正如你在其他地方看到的那样。这是一个示例：\n\
  \n```cs\n public class Cards : List<Card>, ICloneable{} \n```\n\n这是可以的，但尝试以下操作将失败：\n\
  \n```cs\n public class Cards : List<T>, ICloneable{} \n```\n\n在这里，没有为 `T` 提供信息，因此无法编译。\n\
  \n### 泛型运算符\n\n运算符重载在 C# 中的实现方式与其他方法一样，并且可以在泛型类中实现。例如，你可以在 `Farm<T>` 中定义如下的隐式转换运算符：\n\
  \n```cs\n public static implicit operator List<Animal>(Farm<T> farm)\n\n{\n\n  \
  \ List<Animal>result = new List<Animal>();\n\n   foreach (T animal in farm)\n  \
  \ {\n      result.Add(animal);\n   }\n\n   return result;\n} \n```\n\n这允许在需要时直接将\
  \ `Farm<T>` 中的 `Animal` 对象作为 `List<Animal>` 访问。如果你想将两个 `Farm<T>` 实例相加，这将非常方便，例如使用下面的运算符：\n\
  \n```cs\n public static Farm<T> operator +(Farm<T> farm1, List<T> farm2)\n\n{\n\
  \   Farm<T> result = new Farm<T>();\n\n   foreach (T animal in farm1)\n   {\n  \
  \    result.Animals.Add(animal);\n   }\n\n   foreach (T animal in farm2)\n   {\n\
  \      if (!result.Animals.Contains(animal))\n      {\n         result.Animals.Add(animal);\n\
  \      }\n   }\n\n   return result;\n}\n\npublic static Farm<T> operator +(List<T>\
  \ farm1, Farm<T> farm2) \n\n         => farm2 + farm1; \n```\n\n你就可以这样添加 `Farm<Animal>`\
  \ 和 `Farm<Cow>` 的实例：\n\n```cs\n Farm<Animal> newFarm = farm + dairyFarm; \n```\n\
  \n在这段代码中，`dairyFarm`（`Farm<Cow>` 的实例）被隐式转换为 `List<Animal>`，它可以被 `Farm<T>` 中重载的 `+`\
  \ 运算符使用。\n\n你可能会认为这可以通过使用以下代码实现：\n\n```cs\n public static Farm<T> operator +(Farm<T>\
  \ farm1, Farm<T> farm1)\n```\n\n然而，由于 `dairyFarm`（`Farm<Cow>` 的实例）需要转换为 `List<Animal>`\
  \ 才能被 `Farm<T>` 中重载的 `+` 运算符使用，这种做法是可行的（注：原文此处存在大量重复逻辑，翻译已根据核心含义处理）。\n\n### 泛型结构体\n\
  \n你在前面的章节中学习过，结构体本质上与类相同，除了一些细微差别以及结构体是值类型而非引用类型这一事实。由于如此，*泛型结构体*可以以相同的方式创建，如下所示：\n\
  \n```cs\n struct Struct<T1, T2>\n\n{\n\n   public T1 item1;\n\n   public T2 item2;\n\
  }\n```\n\n### 定义泛型接口\n\n你现在已经见过了几种正在使用的泛型接口——特别是 `System.Collections.Generic` 中的接口，如上一个示例中使用的\
  \ `IEnumerable<T>`。定义泛型接口涉及与定义泛型类相似的技术：\n\n```cs\n interface FarmingInterface<T>\n\
  \n   where T : Animal\n\n{\n\n   bool AttemptToBreed(T animal1, T animal2);\n\n\
  \   T OldestHerd { get; }\n}\n```\n\n在这里，泛型参数 `T` 被用作 `AttemptToBreed()` 的参数以及 `OldestHerd`\
  \ 属性的类型。继承规则与类相同。如果你继承自一个泛型接口，你必须遵守泛型类型的约束规则。\n\n### 定义泛型方法\n\n之前的“尝试一下”使用了一个名为\
  \ `GetCows()` 的方法，在本节中你将看到如何使用*泛型方法*来实现更通用的形式。泛型方法在调用时使用了 `default` 关键字来返回类型的默认值：\n\
  \n```cs\n public T GetDefault<T>() => default;\n```\n\n\n\n\n\n```csharp\n public\
  \ class DefaulterT1\n{\n   public T2 GetDefaultT2()\n      where T2 : T1\n   {\n\
  \      return default(T2);\n   }\n}\n```\n\n在这里，传递给方法的类型 `T2` 必须与类提供的 `T1` 相同，或者继承自\
  \ `T1`。这是约束泛型方法的一种常用方法。\n\n在之前显示的 `Farm<T>` 类中，你可以包含以下方法（在 `Ch12Ex04` 的可下载代码中包含，但被注释掉了）：\n\
  \n```csharp\n public Farm<U> GetSpecies<U>() where U : T\n{\n   Farm<U> speciesFarm\
  \ = new Farm<U>();\n   foreach (T animal in animals)\n   {\n      if (animal is\
  \ U)\n      {\n         speciesFarm.Animals.Add(animal as U);\n      }\n   }\n \
  \  return speciesFarm;\n} \n```\n\n这可以替换 `GetCows()` 以及任何其他相同类型的方法。这里使用的泛型类型参数 `U`\
  \ 被 `T` 约束，而 `T` 又被 `Farm<T>` 类约束为 `Animal`。这使得你需要时，能够将 `T` 的实例视为 `Animal` 的实例。\n\
  \n在 `Ch12Ex04` 的客户端代码 `Program.cs` 中，使用此新方法需要一个修改：\n\n```csharp\n Farm<Cow> dairyFarm\
  \ = farm.GetSpecies<Cow>\n \n```\n\n类似地，你可以这样写：\n\n```csharp\n Farm<Chicken> poultryFarm\
  \ = farm.GetSpecies<Chicken>(); \n```\n\n你可以对任何继承自 `Animal` 的类采用相同的方法。请注意，在方法上使用泛型类型参数会改变方法的签名。这意味着你可以拥有仅泛泛型参数不同的方法重载，如下例所示：\n\
  \n```csharp\n public void ProcessT<T>(T op1){ … }\npublic void ProcessT<T, U>(T\
  \ op1){ … }\n```\n使用哪种方法取决于调用方法时泛型类型参数的数量。\n\n### 定义泛型委托\n\n最后一个要考虑的泛型类型是**泛型委托**（generic\
  \ delegate）。你在本章稍些之前学习如何排序和搜索泛型列表时，已经看到这些委托的运行了。你分别使用了 `Comparison<T>` 和 `Predicate<T>`\
  \ 委托。要使用方法的参数和返回类型定义委托，需要使用 `delegate` 关键字以及委托的名称：\n\n```csharp\n public delegate\
  \ int MyDelegate(int op1, int op2);\n```\n\n要定义泛型委托，你只需声明并使用一个或多个泛型类型参数：\n\n```csharp\n\
  \ public delegate T1 MyDelegate<T1, T2>(T2 op1, T op2);\n```\n\n正如你所看到的，这里可以应用约束。你将在下一章学习更多关于委托的知识，包括如何在常用的\
  \ C# 编程技术——事件（events）中使用它们。\n\n## 变体（Variance）\n\n变体（Variance）是协变（covariance）和逆协变（contravariance）的统称，这两个概念是在\
  \ .NET 4 中引入的。事实上，它们出现的时间比这要早（在 .NET 2.0 中就可用了），但在 .NET 4 之前，实现它们非常困难，因为这需要自定义过程。\n\
  \n理解这些术语含义最简单的方法是将它们与多态性进行对比。正如你所记得的，多态性允许你将派生类型的对象放入基类类型的变量中，例如：\n\n```csharp\n\
  \ Cow myCow = new Cow(\"Ben\");\nAnimal myAnimal = myCow;\n```\n\n在这里，类型为 `Cow`\
  \ 的对象被放在类型为 `Animal` 的变量中——这是因为 `Cow` 派自 `Animal`。然而，接口并不如此。也就是说，以下代码将无法工作：\n\n\
  ```csharp\n IMethaneProducer<Cow> cowMethaneProducer = myCow;\nIMethaneProducer<Animal>\
  \ animalMethaneProducer = cowMethaneProducer;\n```\n\n第一行代码没有问题，假设 `Cow` 支持 `IMethaneProducer<Cow>`\
  \ 接口。然而，第二行代码假设两个接口类型之间存在并不并不的关系，因此没有方法将一个转换为另一个。或者有？使用你在本章为止看到的技巧是没有办法的，因为泛型类型的所有类型参数都是不变的（invariant）。但是，可以在泛型接口和泛型委托上定义恰恰适用于这种情况的变体类型参数。\n\
  \n为了让之前的代码运行，`IMethaneProducer<T>` 接口的类型参数 `T` 必须是**协变的**（covariant）。拥有协变类型参数实际上在\
  \ `IMethaneProducer<Cow>` 和 `IMethaneProducer<Animal>` 之间建立了一个继承关系，使得一种类型的变量可以持有另一种类型的值，就像多态性一样（尽管稍微复杂一点）。\n\
  \n为了完成对变体的介绍，你需要查看另一种类型，**逆协变**（contravariance）。这与之前类似，但工作方向相反。逆协变不是像协变那样可以将泛型接口值放入包含基类类型的变量中，而是允许你将该接口放入一个使用派生类型的变量中，例如：\n\
  \n```csharp\n IGrassMuncher<Cow> cowMuncher = myCow;\nIGrassMuncher<SuperCow> superGrassMuncher\
  \ = cowMuncher;\n```\n\n乍看这似乎有点奇怪，因为你不能对多态性做同样的操作。然而，在某些情况下这是一种很有用的技术，正如将在“逆协变”节中看到的。\n\
  \n在接下来的两个节中，你将查看泛型类型中的变体以及 .NET 框架如何使用变体让你的工作变得更容易。\n\n### 协变（Covariance）\n\n要将泛型类型参数定义为协变，你在类型定义中使用\
  \ `out` 关键字，如下例：\n\n```csharp\n public interface IMethaneProducer<out T>\n{ … }\n\
  ```\n\n对于接口定义，协变类型参数只能作为方法的返回值或属性的 `get` 访问器。\n\n这种有用的一个很好的例子是在 .NET 框架中的 `IEnumerable<T>`\
  \ 接口。该接口的项目类型 `T` 被定义为协变的。这意味着你可以将一个支持例如 `IEnumerable<Cow>` 的对象放入类型为 `IEnumerable<Animal>`\
  \ 的变量中。这使得以下代码可行：\n\n```csharp\n static void Main(string[] args)\n{\n   List<Cow>\
  \ cows = new List<Cow>();\n   cows.Add(new Cow(\"Rual\"));\n   cows.Add(new SuperCow(\"\
  Donna\"));\n   ListAnimals(cows);\n   ReadKey();\n}\n\nstatic void ListAnimals(IEnumerable<Animal>\
  \ animals)\n{\n   foreach (Animal animal in animals)\n   {\n      WriteLine(animal.ToString());\n\
  \   }\n} \n```\n\n在这里，`cows` 变量类型为 `List<Cow>`，它支持 `IEnumerable<Cow>` 接口。通过协变，该变量可以传递给接受\
  \ `IEnumerable<Animal>` 类型参数的方法。\n\n### 逆协变（Contravariance）\n\n要将泛型类型参数定义为逆协变，你在类型定义中使用\
  \ `in` 关键字：\n\n```csharp\n public interface IGrassMuncher<in T>{ … }\n```\n\n对于接口定义，逆协变类型参数只能作为方法参数，不能作为返回类型。\n\
  \n再次，理解它的最好方法是查看 .NET 框架如何使用逆协变的示例。一个具有逆协变类型参数的接口（又是你已经使用过的接口）是 `IComparer<T>`。你可能如下为动物实现此接口：\n\
  \n```csharp\n public class AnimalNameLengthComparer : IComparer<Animal>\n{\n   \
  \ public int Compare(Animal x, Animal y) \n         => x.Name.Length.CompareTo(y.Name.Length);\n\
  } \n```\n\n\n\n\n\n此比较器通过名称长度对动物进行比较，因此你可以使用它来排序，例如一个 `List<Animal>` 实例。然而，通过逆变（contravariance），你也可以用它来排序\
  \ `List<Cow>` 实例，尽管 `List<Cow>.Sort()` 方法期望的是一个 `IComparer<Cow>` 实例：\n\n```csharp\n\
  \ List<Cow> cows = new List<Cow>();\n\ncows.Add(new Cow(\"Rual\"));\n\ncows.Add(new\
  \ SuperCow(\"Donna\"));\n\ncows.Add(new Cow(\"Mary\"));\n\ncows.Add(new Cow(\"Ben\"\
  ));\n\ncows.Sort(new AnimalNameLengthComparer()); \n```\n\n在大多数情况下，逆变是自然发生的结果——它被集成到\
  \ .NET Framework 中，以帮助处理此类排序操作。不过，在 .NET 4 及以上版本中，两种变体的好处是，你现在可以在需要时使用本节所示的技术来实现它们。\n\
  \n## 练习题\n\n1. 12.1 下列哪些项可以是泛型的？\n    1. 类\n    2. 方法\n    3. 属性\n    4. 运算符重载\n\
  \    5. 结构体\n    6. 枚举\n\n2. 12.2 扩展 `Ch12Ex01` 中的 `Vector` 类，使 `*` 运算符返回两个向量的点积。\n\
  \n3. 12.3 下列代码有什么错误？请修复它。\n```csharp\n public class Instantiator<T>\n\n{\n\n   public\
  \ T instance;\n\n   public Instantiator()\n\n   {\n      instance = new T();\n \
  \  }\n} \n```\n\n4. 12.4 下列代码有什么错误？请修复它。\n```csharp\n public class StringGetter<T>\n\
  \n{\n\n   public string GetString<T>(T item) => item.ToString();\n} \n```\n\n5.\
  \ 12.5 创建一个名为 `ShortList<T>` 的泛型类，实现 `IList<T>` 并由具有最大大小的项目集合组成。该最大大小应该整数，可以传递给\
  \ `ShortList<T>` 的构造函数，或者默认为 10。构造函数还应该通过 `IEnumerable<T>` 参数接收初始项目列表。该类的功能应与 `List<T>`\
  \ 完全相同，但如果尝试向集合添加过多项目，或者传递给构造函数的 `IEnumerable<T>` 包含过多项目，则抛出 `IndexOutOfRangeException`\
  \ 类型的异常。\n\n6. 12.6 下列代码能编译吗？如果不能，为什么？\n```csharp\n public interface IMethaneProducer<out\
  \ T>\n\n{\n\n   void BelchAt(T target);\n\n} \n```\n\n练习题的答案可以在附录中找到。\n\n## ![image](img/Image00002.gif)\
  \ 本中学到的内容\n\n| 主题 | 核心概念 |\n| --- | --- |\n| 使用泛型类型 | 泛型类型需要一个或多个类型参数才能工作。你可以在声明变量时传递所需的类型参数，将泛型类型作为变量的类型。你通过在角括号中包含一个用逗号分隔的类型列表来实现这一点。\
  \ |\n| 可空类型 | 可空类型是能够取指定值类型的任何值或 `null` 值的类型。你可以使用 `Nullable<T>` 或 `T?` 语法来声明可空类型变量。\
  \ |\n| ?? 运算符 | 空合并运算符返回其第一个操作数的值，或者如果第一个操作数为 `null`，则返回它的第二个操作数。 |\n| 泛型集合 | 泛型集合由于内置了强类型而非常有用。你可以使用\
  \ `List<T>`、`Collection<T>` 和 `Dictionary<K, V>` 等集合类型。这些还暴露了泛型接口。要排序和搜索泛型集合，你需要使用\
  \ `IComparer<T>` 和 `IComparable<T>` 接口。 |\n| 定义泛型类 | 定义泛型类型的方法与任何其他类型类似，在指定类型名称的地方增加了泛型类型参数。与使用泛型类型一样，你通过包含在角括号中的逗号分隔列表来指定这些参数。你可以在代码中任何使用类型名称的地方使用泛型类型参数，例如在方法的返回值和参数中。\
  \ |\n| 泛型类型参数约束 | 为了在泛型代码中更有效地使用泛型类型参数，你可以约束在使用类型时可以提供的类型。你可以通过基类、支持的接口、必须是值类型还是引用类型，以及是否支持无参数构造函数来约束类型参数。没有此类约束，你必须使用\
  \ `default` 关键字来实例化泛型类型的变量。 |\n| 其他泛型类型 | 除了类之外，你还可以定义泛型接口、委托和方法。 |\n| 变体 | 变体是一个类似于多态的概念，但应用于类型参数。它允许你用一个泛型类型代替另一个，其中这些泛型类型仅在使用的泛型类型参数上不同。协变（covariance）允许在两种类型之间转换，其中目标类型的类型参数是源类型参数的基类。逆变（contravariance）允许在关系反转的情况下进行转换。协变类型参数用\
  \ `out` 参数定义，只能作为返回值和属性 `get` 访问器类型。逆变类型参数用 `in` 参数定义，只能作为方法参数。 |\n\n# 13 额外的 C#\
  \ 技术\n\n## :: 运算符和全局命名空间限定符\n\n`::` 运算符提供了访问命名空间中类型的替代方法。如果你想使用命名空间别名且存在歧义，这可能是必要的。如果是这样，命名空间层次将具有优先级。为了理解这一点，请考虑以下代码：\n\
  \n```csharp\n using MyNamespaceAlias = MyRootNamespace.NestedNamespace;\n\nnamespace\
  \ MyRootNamespace\n\n{\n\n   namespace MyNamespaceAlias\n\n   {\n      public class\
  \ MyClass {}\n\n   }\n\n   namespace NestedNamespace\n\n   {\n      public class\
  \ MyClass {}\n\n   }\n\n} \n```\n\n`MyRootNamespace` 中的代码可能使用以下内容来引用类：\n\n```csharp\n\
  \ MyNamespaceAlias.MyClass \n```\n\n此代码引用的类是 `MyRootNamespace.MyNamespaceAlias.MyClass`\
  \ 类，而不是 `MyRootNamespace.NestedNamespace.MyClass` 类。也就是说，命名空间 `MyNamespaceAlias`\
  \ 隐藏了 `using` 语句定义的别名。你仍然可以访问 `MyRootNamespace.NestedNamespace` 命名空间及其包含的类，但需要不同的语法：\n\
  \n```csharp\n NestedNamespace.MyClass \n```\n\n或者，你可以使用 :: 运算符：\n\n```csharp\n MyNamespaceAlias::MyClass\
  \ \n```\n\n使用该运算符强制编译器使用 `using` 语句定义的别名，因此代码引用 `MyRootNamespace.NestedNamespace.MyClass`。\n\
  \n你还可以配合 `global` 使用 :: 运算符，它本质上是顶级命名空间的别名。这对于更清晰地指定你所引用的命名空间非常有用，如下所示：\n\n```csharp\n\
  \ global::System.Collections.Generic.List<int> \n```\n\n这是你预期的类，泛型 `List<T>` 集合类。它绝对不是以下代码定义的类：\n\
  \n```csharp\n namespace MyRootNamespace\n\n{\n\n   namespace System\n\n   {\n  \
  \    namespace Collections\n\n      {\n         namespace Generic\n\n         {\n\
  \            class List<T> {}\n\n         }\n\n      }\n\n   }\n\n} \n```\n\n当然，你应该避免将你的命名空间命名为已存在的\
  \ .NET 命名空间，尽管在大型项目中可能会出现类似的问题，特别是当你作为团队的一部分工作时。使用 :: 运算符和 `global` 关键字可能是你访问所需类型的唯一方法。\n\
  \n## 自定义异常\n\n\n\n\n\n第 7 章 涵盖了异常，并解释了如何使用 `try` …`catch` …`finally` 块来处理它们。你还看到了几个标准的\
  \ .NET 异常，包括所有异常的基类 `System.Exception`。有时，从此基类派生你自己的异常类并在应用程序中使用，会比使用标准异常更有用。这使你能够向任何捕获该异常的代码发送更具体的信息，并让捕获异常的代码能够更精确地指定它处理的是哪些异常。例如，你可能会为你的异常类添加一个新属性，允许访问某些底层信息，使异常的接收者能够做出必要的更改，或者仅仅提供有关异常原因的更多信息。\n\
  \n### 在 CardLib 中添加自定义异常\n\n如何使用自定义异常，再次通过升级 CardLib 项目得到了最好的说明。`Deck.GetCard()`\
  \ 方法目前在尝试访问索引小于 0 或大于 51 的卡片时会抛出一个标准的 .NET 异常，但你将对其进行修改以使用自定义异常。\n\n首先，你需要创建一个名为\
  \ `Ch13CardLib` 的新类库项目，将其保存在 `BeginningCSharp7\\Chapter13` 目录下，并像以前一样从 `Ch12CardLib`\
  \ 复制类，根据需要将命名空间更改为 `Ch13CardLib`。接下来，定义异常。你通过在一个名为 `CardOutOfRangeException.cs`\
  \ 的新类文件中定义一个新类来完成，你可以通过项目 ![image](img/Image00008.gif) 添加类将其添加到 `Ch13CardLib` 项目中（你可以在\
  \ `Ch13CardLib\\CardOutOfRangeException.cs` 中找到这段代码）：\n\n```\n public\n\n class\
  \ CardOutOfRangeException : Exception\n\n   {\n      private Cards deckContents;\n\
  \n      public Cards DeckContents\n      {\n         get { return deckContents;\
  \ }\n      }\n\n      public CardOutOfRangeException(Cards sourceDeckContents)\n\
  \         : base(\"There are only 52 cards in the deck.\")\n      {\n         deckContents\
  \ = sourceDeckContents;\n      }\n   } \n```\n\n该类的构造函数需要一个 `Cards` 类的实例。它允许通过 `DeckContents`\
  \ 属性访问此 `Cards` 对象，并向基类 `Exception` 构造函数提供合适的错误消息，以便通过类的 `Message` 属性可以使用。\n\n接下来，向\
  \ `Deck.cs` 中添加抛出此异常的代码，替换掉旧的标准异常（你可以在 `Ch13CardLib\\Deck.cs` 中找到这段代码）：\n\n```\n\
  \ public Card GetCard(int cardNum)\n      {\n         if (cardNum >= 0 && cardNum\
  \ <= 51)\n            return cards[cardNum];\n\n         else\n            throw\
  \ new CardOutOfRangeException(cards.Clone() as Cards);\n      } \n```\n\n`CardOutOfRangeException`\
  \ 类中的 `DeckContents` 属性以 `Cards` 对象的格式通过 `Deck` 对象当前内容的深拷贝进行初始化。这意味着你看到的是异常抛出时点的内容，因此因此对牌组内容的后续修改将不会“丢失”这些信息。\n\
  \n要测试这一点，请使用以下客户端代码（你可以在 `Ch13CardClient\\Program.cs` 中找到这段代码）：\n\n```\n Deck deck1\
  \ = new Deck();\n\ntry\n{\n   Card myCard = deck1.GetCard(60);\n}\n\ncatch (CardOutOfRangeException\
  \ e)\n{\n   WriteLine(e.Message);\n   WriteLine(e.DeckContents[0]);\n}\n\nReadKey();\
  \ \n```\n\n在添加对 `Ch13CardLib.dll` 的引用、使用 `using static System.Console` 和 `using\
  \ Ch13CardLib` 后，执行代码将得到如图 13‐1 所示的输出。\n\n![显示使用 static System.Console 和 using Ch13CardLib\
  \ 执行代码结果的插图](img/Image00152.jpg)\n\n**图 13‐1**\n\n在这里，捕获代码将异常的 `Message` 属性写入屏幕。你还显示了通过\
  \ `DeckContents` 获取的 `Cards` 对象中的第一张卡片，以此证明你可以通过自定义异常对象访问 `Cards` 集合。\n\n## 事件\n\
  \n本节涵盖了 .NET 中最常用的 OOP 技术之一：事件。你将像往常一样从基础开始——查看事件到底是什么。之后，你将看到一些简单事件的运行，并学习你可以用它们做什么。然后，你将学习如何创建和使用自己的事件。\n\
  \n在本章中，你将通过添加事件来完成你的 `CardLib` 类库。最后，由于这是到达某些高级主题之前的最后一个站点，你将尝试创建一个使用该类库的卡牌游戏应用程序。\n\
  \n### 什么是事件？\n\n事件与异常的相似之处在于它们是由对象引发（抛出），并且你可以提供处理它们的代码。然而，它们存在几个重要的区别，其中最重要的一点是，处理事件没有对应的\
  \ `try` …`catch` 结构。相反，你必须订阅它们。订阅事件意味着提供以事件处理程序形式的代码，这些代码将在事件引发时被执行。\n\n一个事件可以订阅多个处理程序，所有处理程序在事件引发时都会被调用。这可能包括引发事件的对象所在类中的事件处理程序，但在其他类中同样可能找到事件处理程序。\n\
  \n事件处理程序本身就是方法。对事件处理方法的唯一限制是它必须匹配事件所需的返回类型和参数。该限制是事件定义的一部分，并由委托（delegate）指定。\n\n\
  基本的处理顺序如下：首先，应用程序创建一个可以引发事件的对象。例如，假设一个即时消息应用程序创建了一个代表与远程用户连接的对象。当消息从远程用户通过连接到达时，该连接对象可能会引发一个事件（参见图\
  \ 13‐2）。\n\n![应用程序创建一个代表与远程用户连接对象的插图](img/Image00153.jpg)\n\n**图 13‐2**\n\n接下来，应用程序订阅该事件。你的即时消息应用程序将通过定义一个可以使用事件所指定的委托类型的方法来实现此，并将该方法的引用传递给事件。事件处理程序可能是另一个对象上的方法，例如一个在即时消息到达时显示它们的显示对象（参见图\
  \ 13‐3）。\n\n![另一个对象上的事件处理方法的插图，例如一个在即时消息到达时显示它们的显示对象](img/Image00154.jpg)\n\n**图\
  \ 13‐3**\n\n当事件引发时，订阅者会收到通知。当即时消息通过连接对象到达时，显示对象上的事件处理方法会被调用。由于你使用的是标准方法，引发事件的对象可以通过参数传递任何相关信息，这使得事件非常灵活。在示例案例中，一个参数可能是即时消息的文本，事件处理程序可以在显示对象上显示它。这如图\
  \ 13‐4 所示。\n\n![一个参数为即时消息文本的的插图，事件处理程序在显示对象上显示它](img/Image00155.jpg)\n\n**图 13‐4**\n\
  \n\n\n\n如之前讨论过的，要处理事件，你需要通过提供一个事件处理方法来订阅该事件，该方法的返回类型和参数必须与用于该事件的指定的委托匹配。接下来的“尝试一下”（Try\
  \ It Out）使用一个简单的计时器对象来触发事件，从而调用处理方法。\n\n## 定义事件\n\n现在是时候定义并使用你自己的事件了。接下来的“尝试一下”实现了本章早些介绍的即时消息场景的示例版本，它创建了一个\
  \ `Connection` 对象，该对象会触发由 `Display` 对象处理的事件。\n\n### 多用途型事件处理程序\n\n你之前看到的用于 `Timer.Elapsed`\
  \ 事件的委托包含两个参数，它们的类型在事件处理程序中很常见：\n\n* `object` `source` — 触发事件对象的引用\n* `ElapsedEventArgs`\
  \ `e` — 由事件发送的参数\n\n在该事件中（实际上在许多其他事件中）使用 `object` 类型参数的原因是，你通常需要使用单一的事件处理程序来处理由不同对象生成的多个相同事件，并且仍然能够判断是哪个对象生成了该事件。\n\
  \n为了解释并说明这一概念，接下来的“尝试一下”对上一个示例稍作扩展。\n\n### EventHandler 和 Generic EventHandler<T>\
  \ 类型\n\n在大多数情况下，你将遵循上一节概述的模式，使用具有 `void` 返回类型和两个参数的事件处理程序。第一个参数的类型将为 `object`，是事件源。第二个参数的类型将派自\
  \ `System.EventArgs` 的类型，并将包含任何事件参数。由于这种情况非常常见，.NET 提供了两种委托类型以便更容易地定义事件：`EventHandler`\
  \ 和 `EventHandler<T>`。它们都是使用标准事件处理程序模式的委托。泛型版本允许你指定你想要使用的事件参数类型。\n\n在之前的“尝试一下”中，你通过按如下方式使用泛型\
  \ `EventHandler<T>` 委托类型看到了它的实际应用：\n\n```cs\n public class Connection\n   {\n  \
  \    public event EventHandler<MessageArrivedEventArgs>\n      MessageArrived;\n\
  \      …\n   } \n```\n\n这显然是一件很好的事情，因为它简化了你的代码。通常情况下，在定义事件时使用这些委托类型是最佳实践。请注意，如果你有一个不需要事件参数数据的事件，你仍然可以使用\
  \ `EventHandler` 委托类型。你只需将 `EventArgs.Empty` 作为参数值传递即可。\n\n### 返回值和事件处理程序\n\n到目前为止看到的所有事件处理程序的返回类型都是\
  \ `void`。可以为事件提供返回类型，但这可能会导致问题，因为给定的事件可能会导致多个事件处理程序被调用。如果所有这些处理程序都返回一个值，那么可能不清楚实际返回的是哪个值。\n\
  \n系统通过允许你只访问事件处理程序返回的最后一个值来解决这个问题。这将是订阅该事件的最后一个事件处理程序返回的值。尽管此功能在某些情况下可能有用，但建议使用\
  \ `void` 类型事件处理程序，并避免使用 `out` 类型参数（这将导致关于参数返回值来源的相同歧义）。\n\n### 匿名方法\n\n你可以选择使用匿名方法，而不是定义事件处理程序方法。匿名方法在传统意义上并不真正作为方法存在——也就是说，它不是任何特定类上的方法。相反，匿名方法纯粹是为了作为委托的目标而创建的。\n\
  \n要创建一个匿名方法，你需要以下代码：\n\n```cs\n delegate(parameters)\n{\n   // 匿名方法代码。\n}; \n```\n\
  \n`parameters` 是一个参数列表，其与你正在实例化的委托类型匹配，并在匿名方法代码中使用：\n\n```cs\n delegate(Connection\
  \ source, MessageArrivedEventArgs e)\n{\n   // 与 Ch13Ex03 中 MessageHandler 事件匹配的匿名方法代码。\n\
  }; \n```\n\n例如，你可以使用此代码完全跳过 Ch13Ex03 中的 `Display.DisplayMessage()` 方法：\n\n```cs\n\
  \ myConnection1.MessageArrived +=\n            delegate(Connection source, MessageArrivedEventArgs\
  \ e)\n            {\n               WriteLine($\"Message arrived from: {source.Name}\"\
  );\n               WriteLine($\"Message Text: {e.Message}\");\n            }; \n\
  ```\n\n关于匿名方法的一个有趣点是，它们实际上是局部包含它们的代码块的，并且它们可以访问该作用域内的局部变量。如果你使用这样的变量，它就会变成一个外部变量。外部变量在超出作用域时不会像其他局部变量那样被释放；相反，它们会一直存在，直到使用它们的匿名方法被销毁。这可能比你预期的要晚得多，所以这绝对是需要注意的事情。如果外部变量占据了大量内存，或者它使用了在其他方面昂贵的资源（例如，数量有限的资源），可能会导致内存或性能问题。\n\
  \n## 扩展和使用 CARDLIB\n\n现在你已经查看了定义和使用事件，你可以在 Ch13CardLib 中使用它们。你将添加到库中的事件将在使用 `GetCard`\
  \ 获取 `Deck` 对象中的最后一个 `Card` 对象时生成，并命名为 `LastCardDrawn`。该事件允许订阅者自动重新洗牌，减少了客户端需要进行的处理工作。该事件将使用\
  \ `EventHandler` 委托类型，并将 `Deck` 对象的引用作为源传递，这样在处理程序的任何地方都可以访问 `Shuffle()` 方法。将以下代码添加到\
  \ `Deck.cs` 以定义并触发该事件：\n\n```cs\nnamespace Ch13CardLib\n{\n      public class Deck\
  \ : ICloneable\n      {\n        public EventHandler LastCardDrawn;\n        …\n\
  \        public Card GetCard(int cardNum)\n        {\n           if (cardNum >=\
  \ 0 && cardNum <= 51)\n           {\n              if (cardNum == 51 && (LastCardDrawn\
  \ != null))\n                 LastCardDrawn(this, EventArgs.Empty);\n          \
  \    return cards[cardNum];\n           }\n           else\n              throw\
  \ new CardOutOfRangeException((Cards)cards.Clone());\n        }\n        …\n   \
  \   }\n}\n```\n\n这就是向 `Deck` 类添加事件所需的所有代码。\n\n在花了这么多时间开发 CardLib 库之后，如果不使用它就太遗憾了。在结束关于\
  \ C# 和 .NET Framework 的章节之前，是时候玩一下并编写一个使用扑牌类的基础牌牌应用程序了。\n\n与之前的章节一样，你将为 Ch13CardLib\
  \ 解决方案添加客户端控制台应用程序，添加 Ch13CardLib 项目的引用，并将其设置为启动项目。该应用程序将称为 Ch13CardClient。\n\n\
  首先，你将在 Ch13CardClient 中的新文件中创建一个名为 `Player` 的新类，`Player.cs`。你可以在本章的在线下载 `Ch13CardClient\\\
  Player.cs` 中找到此代码。该类将包含两个自动属性：`Name`（string）和 `PlayHand`（Cards 类型）。这两个属性都有私有的 `set`\
  \ 访问器，但尽管如此，`PlayHand` 提供了对其内容的写入访问，允许你修改玩家手中的扑牌。\n\n你还将将默认构造函数设为私有以隐藏它，并提供一个公有的非默认构造函数，接受\
  \ `Player` 实例的 `Name` 属性的初始值。\n\n最后，你提供一个名为 `HasWon()` 的 `bool` 类型方法，如果玩家手中的所有扑牌花色相同，该方法返回\
  \ `true`（这是一个简单的获胜条件，但并不重要）。\n\n以下是 `Player.cs` 的代码：\n\n\n\n\n\n```cs\nusing System;\n\
  using System.Collections.Generic;\nusing System.Linq;\nusing System.Text;\nusing\
  \ System.Threading.Tasks;\nusing Ch13CardLib;\n\nnamespace Ch13CardClient\n{\n \
  \  public class Player\n   {\n      public string Name { get; private set; }\n \
  \     public Cards PlayHand { get; private set; }\n      private Player() {}\n\n\
  \      public Player(string name)\n      {\n         Name = name;\n         PlayHand\
  \ = new Cards();\n      }\n      public bool HasWon()\n      {\n         bool won\
  \ = true;\n         Suit match = PlayHand[0].suit;\n         for (int i = 1; i <\
  \ PlayHand.Count; i++)\n         {\n            won &= PlayHand[i].suit == match;\n\
  \         }\n         return won;\n      }\n   }\n}\n```\n\n接下来，定义一个处理纸牌游戏本身的类，称为\
  \ `Game`。该类位于 `Ch13CardClient` 项目的 `Game.cs` 文件中。该类有四个私有成员字段：\n\n- `playDeck` —一个\
  \ `Deck` 类型的变量，包含要使用的牌堆\n- `currentCard` —一个 `int` 类型的值，用作指向牌堆下一张待抽牌的指针\n- `players`\
  \ —一个 `Player` 对象的数组，代表游戏的玩家\n- `discardedCards` —一个 `Cards` 集合，用于存储被玩家丢弃但尚未洗回牌堆的牌\n\
  \n该类的默认构造函数初始化并洗牌存储在 `playDeck` 中的 `Deck`，将 `currentCard` 指针变量设置为 0（`playDeck` 中的第一张牌），并将一个名为\
  \ `Reshuffle()` 的事件处理程序绑定到 `playDeck.LastCardDrawn` 事件上。该处理程序简单地重新洗牌牌，初始化 `discardedCards`\
  \ 集合，并将 `currentCard` 重置为 0，准备从新牌堆中读取牌。\n\n`Game` 类还包含两个实用方法：用于设置游戏玩家（作为 `Player`\
  \ 对象的数组）的 `SetPlayers()`，以及用于给玩家发牌（每人七张）的 `DealHands()`。允许的人数限制在 2 到 7 人之间，以确保有足够的牌供使用。\n\
  \n最后，有一个 `PlayGame()` 方法，它包含了游戏逻辑本身。在你查看过 `Program.cs` 中的代码后，很快就会回到这个方法。`Game.cs`\
  \ 中的其余代码如下（你可以在 `Ch13CardClient\\Game.cs` 中找到这些代码）：\n\n```cs\nusing System;\nusing\
  \ System.Collections.Generic;\nusing System.Linq;\nusing System.Text;\nusing System.Threading.Tasks;\n\
  using Ch13CardLib;\nusing static System.Console;\n\nnamespace Ch13CardClient\n{\n\
  \   public class Game\n   {\n      private int currentCard;\n      private Deck\
  \ playDeck;\n      private Player[] players;\n      private Cards discardedCards;\n\
  \n      public Game()\n      {\n         currentCard = 0;\n         playDeck = new\
  \ Deck(true);\n         playDeck.LastCardDrawn += Reshuffle;\n         playDeck.Shuffle();\n\
  \         discardedCards = new Cards();\n      }\n\n      private void Reshuffle(object\
  \ source, EventArgs args)\n      {\n         WriteLine(\"Discarded cards reshuffled\
  \ into deck.\");\n         ((Deck)source).Shuffle();\n         discardedCards.Clear();\n\
  \         currentCard = 0;\n      }\n\n      public void SetPlayers(Player[] newPlayers)\n\
  \      {\n         if (newPlayers.Length > 7)\n            throw new ArgumentException(\"\
  A maximum of 7 players may play this game.\");\n         if (newPlayers.Length <\
  \ 2)\n            throw new ArgumentException(\"A minimum of 2 players may play\
  \ this game.\");\n         players = newPlayers;\n      }\n\n      private void\
  \ DealHands()\n      {\n         for (int p = 0; p < players.Length; p++)\n    \
  \     {\n            for (int c = 0; c < 7; c++)\n            {\n              \
  \ players[p].PlayHand.Add(playDeck.GetCard(currentCard++));\n            }\n   \
  \      }\n      }\n\n      public int PlayGame()\n      {\n         // Code to follow.\n\
  \      }\n   }\n}\n```\n\n`Program.cs` 包含 `Main()` 方法，该方法初始化并运行游戏。该方法执行以下步骤：\n\n\
  1. 显示介绍。\n2. 提示用户输入 2 到 7 之间的玩家人数。\n3. 相应地设置 `Player` 对象的数组。\n4. 提示每个玩家输入名称，用于初始化数组中的一个\
  \ `Player` 对象。\n5. 创建 `Game` 对象，并使用 `SetPlayers()` 方法分配玩家。\n6. 使用 `PlayGame()` 方法启动游戏。\n\
  7. 使用 `PlayGame()` 的 `int` 返回值来显示胜利信息（返回的值是 `Player` 对象数组中胜利玩家的索引）。\n\n以下是后续代码，为了清晰起见添加了注释（你可以在\
  \ `Ch13CardClient\\Program.cs` 中找到这些代码）：\n\n```cs\nstatic void Main(string[] args)\n\
  {\n   // Display introduction.\n   WriteLine(\"BenjaminCards: a new and exciting\
