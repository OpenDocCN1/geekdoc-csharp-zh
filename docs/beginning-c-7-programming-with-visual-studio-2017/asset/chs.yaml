  \ `name`。 | `//element/name` |\n| 选择符合某个值标准的节点——在此情况下，元素名为 `Hydrogen` 的元素。 | `//element[name='Hydrogen']`\
  \ |\n| 选择符合属性标准的节点——在此情况下，`Type` 属性为 `Noble Gas`。 | `//element[@Type='Noble Gas']`\
