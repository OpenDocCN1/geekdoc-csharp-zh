  \   return \"\";\n   }\n   string[] inputStringAsArray = inputString.Split(' ');\n\
  \   StringBuilder sb = new StringBuilder();\n   for (int i = 0; i < inputStringAsArray.Length;\
  \ i++)\n   {\n      if (inputStringAsArray[i].Length > 0)\n      {\n         sb.AppendFormat(\"\
  {0}\",\n            inputStringAsArray[i].Substring(\n                   0, 1).ToUpper());\n\
  \      }\n   }\n   return sb.ToString();\n} \n```\n\n7. 13.7 你将如何确保问题 4 中的扩展方法对你的客户端代码可用？\n\
  \n8. 13.8 重写此处所示 `ToAcronym()` 方法为单条语句。代码应确保单词之间包含多个空格的字符串不会引起错误。提示：你需要使用 `?:` 三元运算符、`string.Aggregate<string,\
  \ string>()` 扩展方法以及 Lambda 表达式来实现这一目标。\n\n练习题的答案可以在附录中找到。\n\n## 本章学到的知识\n\n| 主题\
  \ | 核心概念 |\n| --- | --- |\n| 命名空间限定 | 为了避免命名空间限定中的产生歧义，你可以使用 `::` 运算符强制编译器使用你创建的别名。你还可以使用\
  \ `global` 命名空间作为顶层命名空间的别名。 |\n| 自定义异常 | 你可以通过派生根 `Exception` 类来创建自己的异常类。这非常有帮助，因为这让你对捕获特定异常具有更大的控制权，并允许你自定义异常中包含的数据以便有效处理。\
  \ |\n| 事件处理 | 许多类暴露了事件，当代码中发生某些触发器时就会触发。你可以为这些事件编写处理程序，在触发点执行代码。这种双向通信是响应式代码的极佳机制，并防止你不得不编写原本可能复杂、迂的代码来轮询对象的更改。\
  \ |\n| 事件定义 | 你可以定义自己的事件类型，这涉及创建一个命名事件以及一个用于该事件任何处理程序的委托类型。你可以使用无返回值的标准委托类型以及派自\
  \ `System.EventArgs` 的自定义事件参数来允许多用途的事件处理程序。你还可以使用 `EventHandler` 和 `EventHandler<T>`\
  \ 委托类型来用更简单的定义事件。 |\n| 匿名方法 | 通常，为了让代码更具读性，你可以使用匿名方法代替完整的事件处理程序方法。这意味着在添加事件处理程序的地方，内联定义事件触发时要执行的代码。你通过\
  \ `delegate` 关键字实现这一点。 |\n| 特性 (Attributes) | 有时，可能因为你使用的框架要求要求，或者因为你自己的选择，你会在代码中使用特性。你可以使用\
  \ `[AttributeName]` 语法为类、方法和其他成员添加特性，并可以通过派生自 `System.Attribute` 来创建你自己的特性。你可以通过反射读取特性值。\
  \ |\n| 初始化器 | 你可以使用初始化器在创建对象或集合的同时对其进行初始化。这两种初始化器都由大括号包围的代码组成。对象初始化器允许通过提供逗号分隔的属性/值对来设置属性值。集合初始化器仅需要一个逗号分隔的值列表。当你使用对象初始化器时，还可以使用非默认构造函数。\
  \ |\n| 类型推断 | `var` 关键字允许你在声明变量时省略其类型。然而，只有在类型可以在编译时确定时，这才是可能的。使用 `var` 不会破坏 C#\
  \ 的强类型方法，因为声明为 `var` 的变量只有一个可能的类型。 |\n| 匿名类型 | 对于许多用于数据存储的简单类型，不需要定义类型。相反，你可以使用匿名类型，其成员从用法推断。你使用对象初始化器语法定义匿名类型，设置的每个属性都被定义为只读属性。\
  \ |\n| 动态查找 | 使用 `dynamic` 关键字定义一个动态类型变量，它可以持有任何值。然后你可以用标准的属性或方法语法访问所包含值的成员，这些成员仅在运行时进行检查。如果在运行时尝试访问不存在的成员，将抛出异常。这种动态类型极大简化了访问非\
  \ .NET 类型或在编译时无法获取类型信息的 .NET 类型所需的语法。然而，使用动态类型时必须谨慎，因为你失去了编译时的代码检查。你可以通过实现 `IDynamicMetaObjectProvider`\
  \ 接口来控制动态查找的行为。 |\n| 可选方法参数 | 通常，你可以定义一个带有许多参数的方法，其中许多参数很少使用。为了不强制客户端代码指定很少用参数的值，你可能会提供多个方法重载。或者，你可以将这些参数定义为可选的（并为未指定的参数提供默认值）。调用你方法的客户端代码可以只指定所需的参数。\
  \ |\n\n\n\n\n\n| 命名方法参数 | 客户端可以通过位置或名称（或两者的混合，其中位置参数必须先指定）来指定方法的参数值。命名参数可以按任何顺序指定。这与可选参数结合使用时特别为有用。\
  \ |\n| Lambda 表达式 | Lambda 表达式本质上是定义匿名方法的简写方式，尽管它们还具有如隐式类型等额外功能。你通过用逗号分隔的参数列表（如果无参数，则使用空括号）、`=>`\
  \ 运算符和一个表达式来定义 Lambda 表达式。该表达式可以是用大括号括起来的代码块。具有最多八个参数和可选返回类型的 Lambda 表达式可以使用 `Action`、`Action<>`\
  \ 和 `Func<>` 委托类型表示。许多用于集合的 LINQ 扩展方法使用了 Lambda 表达式参数。 |\n\n# 第二部分：Windows 编程\n\n\
  * 第 14 章：基础桌面编程\n* 第 15 章：高级桌面编程\n\n# 14 基础桌面编程\n\n## XAML\n\nXAML 是一种使用 XML 语法的语言，能够以声明性和分层次的方式将控件添加到用户界面中。也就是说，你可以以\
  \ XML 元素的形式添加控件，并使用 XML 属性指定控件属性。你还可以拥有包含其他控件的控件，这对于布局和功能都是至关重要的。\n\nXAML 的设计考虑了如今强大的显卡，因此它允许你通过\
  \ DirectX 使用这些显卡所提供的所有高级功能。以下列出了其中一些能力：\n\n* 浮点坐标和矢量图形，用以提供可以进行缩放、旋转或其他变换且不会损失质量的布局\n\
  * 用于高级渲染的 2D 和 3D 能力\n* 高级字体字体处理和渲染\n* 用于 UI 对象的实色、渐变和纹理填充，并带有可选的透明度\n* 可用于各种情况的动画故事板，包括用户触发的事件（如点击按钮）\n\
  * 你可以用于动态设置控件样式的重用资源\n\n### 关注点分离\n\n维护多年编写的 Windows 应用程序时存在一个问题，即它们往往将生成用户界面的代码与根据用户操作执行的代码混合在一起。这使得多个开发者和设计师很难在同一个项目上共同工作。WPF\
  \ 通过两种方式解决了这个问题。首先，通过使用 XAML 描述 GUI 而不是 C#，GUI 变得与平台无关，你实际上可以在不编写任何代码的情况下渲染 XAML。其次，这意味着将\
  \ C# 代码放置在与 GUI 代码不同的文件中感觉上很自然。Visual Studio 利用了所谓的 `code-behind`（代码后置）文件，这些文件是与\
  \ XAML 文件动态链接的 C# 文件。\n\n由于 GUI 与代码分离了，因此可以为设计 GUI 创建定制的应用程序，而这正是微软所做的。Visual for\
  \ Visual Studio 的设计工具 Blend 是设计师在为 WPF 创建 GUI 时使用的首选工具。该工具可以加载与 Visual Studio 相同的项目，但\
  \ Visual Studio 更多地针对开发者而非设计师，而 Blend 则恰恰相反。这意味着在拥有设计师和开发人员的大型项目中，每个人都可以在同一个项目上共同工作，使用他们偏好的工具，而不必担心无意中影响他人。\n\
  \n### 实践中的 XAML\n\n如前所述，XAML 是 XML，这意味着只要文件较小，就可以立即看到它描述的内容。看这个小示例，看看你是否能看出它是做什么的：\n\
  \n```xml\n <Window x:Class=\"Ch14Ex01.MainWindow\"\n        xmlns=\"http://schemas.microsoft.com/winfx/2006/xaml/presentation\"\
  \n        xmlns_x=\"http://schemas.microsoft.com/winfx/2006/xaml\"\n        xmlns_d=\"\
  http://schemas.microsoft.com/expression/blend/2008\"\n        xmlns_mc=\"http://schemas.openxmlformats.org/markup-compatibility/2006\"\
  \n        xmlns_local=\"clr-namespace:WpfApp1\"\n        mc:Ignorable=\"d\"\n  \
  \      Title=\"Hello World\" Height=\"350\" Width=\"525\">\n    <Grid>\n       \
  \ <Button Content=\"Hello World\" \n            HorizontalAlignment=\"Left\" \n\
  \            Margin=\"220,151,0,0\" \n            VerticalAlignment=\"Top\" \n \
  \           Width=\"75\"/>\n    </Grid>\n</Window> \n```\n\n此示例中的 XAML 创建了一个带有单个按钮的窗口。窗口和按钮都显示文本\
  \ `Hello World`。XML 允许你将标签放在另一个标签内部，只要你正确关闭它们即可。当元素在 XAML 中放在另一个元素内部时，该元素就变成了包含元素的内容，这意味着\
  \ `Button` 也可以这样写：\n\n```xml\n <Button HorizontalAlignment=\"Left\" \n         \
  \   Margin=\"220,151,0,0\" \n            VerticalAlignment=\"Top\" \n          \
  \  Width=\"75\">\n      Hello World\n    </Button> \n```\n\n在这里，`Button` 的 `Content`\
  \ 属性被删除了，文本现在是 `Button` 控件的子节点。`Content` 在 XAML 中可以是几乎任何内容，这在示例中也得到了证明：`Button`\
  \ 元素是 `Grid` 元素的内容，而 `Grid` 又是 `Window` 元素的内容。\n\n大多数（如果不是所有）控件都可以拥有内容，并且对于更改内置控件的外观，限制非常少。第\
  \ 15 章 将详细探讨这一点。\n\n### 命名空间\n\n上例中的 `Window` 元素是 XAML 文件的根元素。该元素通常包含若干命名空间声明。默认情况下，Visual\
  \ Studio 设计器包含了你应该了解两个命名空间：[`http://schemas.microsoft.com/winfx/2006/xaml/presentation`](http://schemas.microsoft.com/winfx/2006/xaml/presentation)\
  \ 和 [`http://schemas.microsoft.com/winfx/2006/xaml`](http://schemas.microsoft.com/winfx/2006/xaml)。第一个是\
  \ WPF 的默认命名空间，声明了许多用于创建用户界面的控件。第二个是 XAML 语言本身。命名空间不需要声明在根标签上，但这样做可以确保在整个 XAML 文件中都能访问它们的内容，因此很少需要移动这些声明。\n\
  \n在 Visual Studio 中创建新窗口时，演示命名空间总是声明为默认，语言命名空间为 `xmlns_x`。正如 `Window`、`Button` 和\
  \ `Grid` 标签所示，这确保了你不需要为添加的控件添加前缀，但你指定的语言元素必须带有前缀。你经常看到的最后一个命名空间是系统命名空间：`xmlns_sys=\"\
  clr-namespace:System;assembly=mscorlib\"`。此命名空间允许你在 XAML 中使用 .NET Framework 的内置类型。通过这种方式，你编写的标记可以显式声明你正在创建的元素的类型。例如，你可以在标记中声明一个数组并说明数组成员是字符串：\n\
  \n```xml\n <Window.Resources>\n    <ResourceDictionary>\n      <x:Array Type=\"\
  sys:String\" x:Key=\"localArray\">\n        <sys:String>Benjamin Perkins</sys:String>\n\
  \        <sys:String>Jacob Vibe Hammer</sys:String>\n        <sys:String>Job D.\
  \ Reid</sys:String>\n      </x:Array>\n    </ResourceDictionary>\n  </Window.Resources>\
  \ \n```\n\n#### 代码后置文件\n\n\n\n\n\n虽然 XAML 是一种声明用户界面的强大方式，但它并不是编程语言。每当你想要执行比演示之外的操作时，你就需要\
  \ `C#`。虽然可以将 `C#` 代码直接嵌入到 XAML 中，但绝不建议将代码和标记混合使用，而且你不会在书中看到这种做法。你将会经常看到的是“后置代码文件”（code-behind\
  \ files）的使用。这些文件是普通的 `C#` 文件，具有与 XAML 文件相同的名称，并带有 `.cs` 扩展名。尽管你可以随心所欲为它们命名，但最好遵循这种命名约定。当你会在应用程序中创建一个新窗口时，Visual\
  \ Studio 会自动创建后置代码文件，因为它期望你向窗口添加代码。它还向 XAML 中的 `Window` 标签中添加了 `x:Class` 属性：\n\n\
  ```\n <Window x:Class=\"Ch14Ex01.MainWindow\" \n```\n\n这告诉编译器，它可以在不是某个特定文件，而是在类\
  \ `Ch14Ex01.MainWindow` 中找到该窗口的代码。由于你只能指定完全限定的类名，而不能指定该类所在的程序集，因此无法将后置代码文件放在定义 XAML\
  \ 的项目之外。Visual Studio 将后置代码文件放在与 XAML 文件相同的目录中，因此在 Visual Studio 中工作时你不需要担心这个问题。\n\
  \n# 演练场\n\n现在你已经了了关于 WPF 如何构建的知识，可以开始动手操作了，是时候查看编辑器了。首先通过选择文件 ![image](img/Image00008.gif)\
  \ 新 ![image](img/Image00008.gif) 项目创建一个新的 WPF 项目。从“新建项目”对话框中，导航到 Visual C#` 下的 Windows\
  \ Classic Desktop 节点，并选择项目模板 WPF App (.Net Framework)。图 14-1 显示了选择了模板的新建项目对话框。\n\
  \n![显示选择了项目模板 WPF App (.Net Framework) 的新建项目对话框的插图。](img/Image00173.jpg)\n\n**图\
  \ 14-1**\n\n为了能够在后续示例中复用此示例，请将项目命名为 `Ch14Ex01`。\n\nVisual Studio 现在显示一个空窗口和周围的多个面板。屏幕大部分被分为两个部分。上半部分称为设计视图（Design\
  \ View），显示你正在设计的窗口的所见即所得（WYSIWYG）表示；下部分称为 XAML 视图（XAML View），显示相同窗口的文本表示。\n\n在设计视图的右侧，你可以看到在之前的项目中过的解决方案管理器（Solution\
  \ Explorer），以及一个属性面板，该面板显示设计视图和 XAML 视图中当前选中项的信息。值得注意的是，属性面板、XAML 视图和设计视图中的选择始终是同步的，因此如果你在\
  \ XAML 视图中移动光标，你会看到另外两个视图中的选择发生变化。\n\n设计视图左侧折叠着许多面板，其中一个是工具箱（Toolbox）。本章将向你展示如何使用工具箱面板中的许多控件为卡牌游戏创建对话框，因此点击右上角的图针将其展开并固定。。顺便，也展开面板中的\
  \ Common WPF Controls 节点。你将在本章中使用这里显示的大多数控件。\n\n## WPF 控件\n\n控件将预包代码和可以复用的 GUI 结合，以创建更复杂的应用程序。它们可以定义默认的绘制方式以及一组标准行为。某些控件，例如\
  \ `Label`、`Button` 和 `TextBox` 控件很容易识别，并且已经在 Windows 应用程序中使用了约 20 年。其他控件，如 `Canvas`\
  \ 和 `StackPanel`，则不显示任何内容，仅帮助你组织 GUI。\n\n开箱即用的控件看起来完全符合你对标准 Windows 应用中控件的预期，并使用当前的\
  \ Windows 主题来绘制自身。所有这一切都是高度可定制的，只需点击几次你就可以完全更改控件的显示方式。这种自定义是通过使用控件上定义的属性完成的。WPF\
  \ 使用你以前见过的普通属性，并添加了一种名为“依赖属性”（dependency property）的新类型属性。这些将在第 15 章中详细介绍，但目前只需知道\
  \ WPF 的许多属性不仅仅是获取和设置一个值就了；例如，它们能够通知观察者变化。\n\n除了定义内容在屏幕上的外观外，控件还定义了标准行为，例如点击按钮和在列表中选择内容的能力。你可以通过“处理”控件定义的事件来更改用户对控件执行操作时发生的情况。你何时以及如何实现事件处理器将根据应用程序和控件的不同而异，但通常来说，你始终会处理按钮的\
  \ `Click` 事件；对于 `ListBox` 控件，你通常需要对用户更改选择做出反应，因此应该处理 `SelectionChanged` 事件。在其他控件（如\
  \ `Label` 或 `TextBlock` 控件）上，你很少实现任何事件。\n\n你可以通过多种方式向窗口中添加控件，但最常见的方法是从工具箱将它们拖到设计视图或\
  \ XAML 视图中。在接下来的“尝试一试”中，你将完成一个简单的示例。\n\n## 属性\n\n如所述，所有控件都有许多用于操作行为的属性。其中一些很容易理解，例如\
  \ `height` 和 `width`，而另一些则那么直观，例如 `RenderTransform`。所有属性都可以属性面板、直接在 XAML 中或通过操作控件进行设置。接下来的“尝试一试”演示了如何在设计视图中设置属性。\n\
  \n### 依赖属性\n\n用户在对话框执行的操作（例如从列表中选择内容）通常应该会导致其他控件变化并更新。大多数情况下，普通的 .NET 属性只是简单的 l\
  \ 和 setter，不具备通知其他控件变化的能力。进入依赖属性。`dependency property` 是在 WPF 属性系统中注册的属性，允许允许扩展功能。这些扩展功能包括但不限于属性变化通知。具体来说：\n\
  \n* 你可以使用样式更改依赖属性的值。\n* 你可以使用资源或数据绑定设置依赖属性的值。\n* 你可以在动画中更改依赖属性的值。\n* 你可以在 XAML 中分层设置依赖属性——即父元素设置的依赖属性值可以作为子元素相同依赖属性的默认值。\n\
  * 你可以使用定义的编码模式配置属性值更改。\n* 你可以配置相关属性集，使其对其中一个属性的变化做出响应。这被称为“强制”（coercion）。更改的属性被认为在强制其他属性的值。\n\
  * 你可以为依赖属性应用元数据以指定其他行为特性。例如，你可以指定如果给定属性发生变化，可能会重新排列用户界面。\n\n在实践中，由于依赖属性的实现方式，你可能发现它们与普通属性没有太大区别。但当你创建自己的控件时，你会很快发现如果使用普通的\
  \ .NET 属性，许多功能突然消失了。\n\n第 15 章 展示了你如何实现新的依赖属性。\n\n\n\n\n\n### 附加属性 (Attached Properties)\n\
  \n*附加属性*（attached property）是一种供定义属性的类的实例的每个子对象使用的属性。例如，正如你在本章稍后看到的，你在之前的示例中使用的 `Grid`\
  \ 允许你定义列和行来对 `Grid` 的子控件进行排序。然后，每个子控件可以使用附加属性 `Column` 和 `Row` 来指定它在网格中的位置：\n\n\
  ```\n <Grid HorizontalAlignment=\"Left\" Height=\"167\" VerticalAlignment=\"Top\"\
  \ Width=\"290\">\n\n  <Button Content=\"Button\" HorizontalAlignment=\"Left\" Margin=\"\
  10,10,0,0\" \n\nVerticalAlignment=\"Top\" Width=\"75\" Grid.Column=\"0\" Grid.Row=\"\
  0\"\n\nHeight=\"22\"/>\n\n…\n\n  </Grid> \n```\n\n在这里，附加属性是通过父元素的名称、一个句点符号以及附加属性的名称来引用的。\n\
  \n在 WPF 中，附加属性有多种用途。当你之后在“控件布局（Control Layout）”部分查看如何定位控件时，你会看到很多附加属性。你将学习容器控件如何定义附加属性，从而允许子控件定义（例如）它们停靠在容器的哪些边缘。\n\
  \n### 事件 (Events)\n\n在第 13 章中，你学习了事件以及如何使用它们。本节涵盖了特定类型的事件——特别是由 WPF 控件生成的事件，并引入了*路由事件（routed\
  \ events）*，这些事件通常与用户操作相关。例如，当用户点击按钮时，该按钮会生成一个事件，指示它发生了什么。处理事件是程序员为该按钮提供某些功能的手段。\n\
  \n你处理的许多事件都是由你在书中使用的的大多数控件暴露的。这包括诸如 `LostFocus` 和 `MouseEnter` 等事件。这是因为事件本身继承自 `Control`\
  \ 或 `ContentControl` 等基类。其他事件（如 `DatePicker` 的 `CalendarOpened` 事件）更具特定性，仅位于专用控件上。一些最常用的事件列在表\
  \ 14-1 中。\n\n| 事件 (EVENT) | 说明 (DESCRIPTION) |\n| --- | --- |\n| `Click` | 当控件被点击时发生。在某些情况下，当用户按下\
  \ Enter 键或空格键也会发生此事件。 |\n| `Drop` | 在拖放操作完成时发生——也就是说，当一个对象被拖到控件上方且用户释放鼠标键时发生。 |\n\
  | `DragEnter` | 当正在拖拽的对象进入控件的边界时发生。 |\n| `DragLeave` | 当正在拖拽的对象离开控件的边界时发生。 |\n|\
  \ `DragOver` | 当一个对象被拖到控件上方时发生。 |\n| `KeyDown` | 当控件拥有焦点时按下按键时发生。此事件始终在 `KeyPress`\
  \ 和 `KeyUp` 之前发生。 |\n| `KeyUp` | 当控件拥有焦点时释放按键时发生。此事件始终在 `KeyDown` 事件之后发生。 |\n| `GotFocus`\
  \ | 当控件接收焦点时发生。不要使用此事件对控件进行验证。请使用 `Validating` 和 `Validated`。 |\n| `LostFocus` |\
  \ 当控件失去焦点时发生。不要使用此事件对控件进行验证。请使用 `Validating` 和 `Validated`。 |\n| `MouseDoubleClick`\
  \ | 当控件被双击时发生。 |\n| `MouseDown` | 当鼠标指针位于控件上并按下鼠标键时发生。这与 `Click` 事件不同，因为 `MouseDown`\
  \ 在按键按下时立即发生，且在释放*之前*发生。 |\n| `MouseMove` | 当鼠标在控件上移动时持续发生。 |\n| `MouseUp` | 当鼠标指针位于控件上并释放鼠标键时发生。\
  \ |\n\n**表 14-1 :** 常用控件事件\n\n你将在本章的示例中看到这些许多事件。\n\n### 处理事件 (Handling Events)\n\
  \n添加事件处理程序有两种基本方法。一种方法是使用属性（Properties）窗口中的事件（Events）列表，如图 14-3\n\n**图 14-3**\n\n\
  要为特定事件添加处理程序，可以输入事件名称并按回车，或者在事件列表中双击事件名称的右侧。这会将事件添加到 XAML 标签中。处理该事件的方法签名将添加到 C#\
  \ 后置代码文件中。\n\n```\n <Button x:Name=\"rotatedButton\" Content=\"2nd Button\" Width=\"\
  75\" \n\n            Height=\"22\" FontWeight=\"Bold\" Margin=\"218,138,224,159\"\
  \ \n\n            RenderTransformOrigin=\"0.5,0.5\" \n\n            Click=\"rotatedButton\"\
  >\n\n      …\n\n    </Button>\n\nprivate void rotatedButton_Click(object sender,\
  \ RoutedEventArgs e)\n\n    {\n\n```\n\n\n\n\n\n当你创建一个命令（command）时，你必须实现代码来回答“此代码当前是否可以给用户”这个问题。这意味着当命令与按钮关联时，该按钮可以询问命令它是否可以执行，并据此设置自身的状态。\n\
  \n命令的实现比事件要复杂得多，因此在第 15 章 之前不会看到它们的应用，在该章它们将与菜单项一起使用。在下一个“尝试一下”（Try It Out）中，你将为本章较早的示例添加事件处理程序，以演示路由事件。\n\
  \n## 控制类型\n\nWPF 有许多控件供选择。我们感兴趣的两种类型是内容控件（Content controls）和项控件（Items controls）。内容控件（例如\
  \ `Button` 控件）有一个 `Content` 属性，该属性可以设置为任何其他控件。这意味着你可以指定控件的显示方式，但你必须在内容中直接指定零或恰好一个控件。尽管如此，你可以指定一个项控件，项控件是一种允许你插入多个控件作为内容的控件。项控件的一个示例是\
  \ `Grid` 控件。在创建用户界面时，你不断在组合这两种类型的控件。\n\n除了内容控件和项控件，还有许多其他类型的控件不允许你将其他控件作为其内容。其中一个例子是\
  \ `Image` 控件，用于显示图像。改变这种行为将违背该控件的用途。\n\n## 控件布局\n\n到本章为止，你已经使用 `Grid` 元素布局了一些控件，主要是因为这是创建新\
  \ WPF 时默认提供的控件。然而，你还没有检查该类的完整功能，也没有学习过用于实现替代布局的其他布局容器。本节将更详细地查看控件布局，因为它是 WPF 的基本概念。\n\
  \n### 基础布局概念\n\n在 WPF 中，你使用布局控件来协助窗口上项的布局。这类控件有很多，但在开始使用它们之前，你应该了解一些基本概念以及 Visual\
  \ Studio 提供的视觉辅助。\n\n### 堆叠顺序（Stack Order）\n\n当容器控件包含多个子控件时，它们按照特定的堆叠顺序进行绘制。你可能已经从绘图软件包中熟悉这个概念。考虑堆叠顺序的最佳方式是想象每个控件都包含在一块玻璃板中，而容器包含了这些玻璃板堆。因此，容器的外观就是当你从顶部向下看这些玻璃层时所看到的内容。容器包含的控件相互重叠，所以你看到的内容取决于玻璃板的顺序。如果一个控件位于堆栈的较高位置，那么它将是你重叠区域看到的控件。位于堆栈下方的控件可能会被上方的控件部分或完全隐藏。\n\
  \n这也会影响用鼠标点击窗口时的击击测试（hit testing）。在考虑重叠控件时，目标控件始终是堆栈中位于顶部的那个。控件的堆叠顺序由它们在容器子项列表中出现的顺序决定。容器中的第一个子控件放置在堆栈的最底层，最后一个子控件放在最顶层。第一个和最后一个控件之间的子控件被放在越来越高的层上。控件的堆叠顺序对你可以在\
  \ WPF 中使用的某些布局控件具有额外的影响，你很快就会看到。\n\n### 对齐方式、外边距（Margin）、内边距（Padding）和尺寸\n\n早期的示例使用了\
  \ `Margin`、`HorizontalAlignment` 和 `VerticalAlignment` 属性在 `Grid` 容器中定位控件，但没有详细介绍它们的用法。你还看到过如何使用\
  \ `Height` 和 `Width` 来指定尺寸。这些属性以及你尚未查看过的 `Padding`，对所有布局控件（或大部分控件，正如你所看到的）都是有用的，但方式不同。不同的布局控件还可以为这些属性设置默认值。你将在后续章节中通过示例看到很多，但在那之前，涵盖基础知识是值得的。\n\
  \n两个对齐属性 `HorizontalAlignment` 和 `VerticalAlignment` 决定了控件的对齐方式。`HorizontalAlignment`\
  \ 可以设置为 `Left`、`Right`、`Center` 或 `Stretch`。`Left` 和 `Right` 倾向将控件放在容器的左边缘或右边缘，`Center`\
  \ 将控件放在中间，而 `Stretch` 改变控件的宽度使其边缘到达容器的侧面。`VerticalAlignment` 类似，其值为 `Top`、`Bottom`、`Center`\
  \ 或 `Stretch`。\n\n`Margin` 和 `Padding` 分别指定控件边缘周围和边缘内部的空白。早期的示例使用 `Margin` 相对窗口边缘定位控件。这之所以有效，是因为当\
  \ `HorizontalAlignment` 设置为 `Left` 且 `VerticalAlignment` 设置为 `Top` 时，控件紧贴左上角定位，而\
  \ `Margin` 在控件边缘插入了一个间隙。`Padding` 的用法类似，但它是将控件的内容与其边缘隔开。这对于 `Border` 特别有用，正如你将在下一节看到的。`Padding`\
  \ 和 `Margin` 都可以分四部分（形式为 `leftAmount`、`topAmount`、`rightAmount`、`bottomAmount`）或单个值（`Thickness`\
  \ 值）指定。\n\n稍后你会看到 `Height` 和 `Width` 经常由其他属性控制。例如，当 `HorizontalAlignment` 设置为 `Stretch`\
  \ 时，控件的 `Width` 属性会随着容器宽度的变化而变化。\n\n### Border\n\n`Border` 控件是一个简单且实用的容器控件。它持有单个子控件，而不是你稍后看到的多个子控件。该子控件将调整为完全填充\
  \ `Border` 控件。这看起来可能并不特别，但请记住可以使用 `Margin` 和 `Padding` 属性在容器内定位 `Border`，并在 `Border`\
  \ 边缘内定位其内容。你还可以设置 `Border` 的 `Background` 属性使其可见。你很快就会看到该控件的操作。\n\n### 视觉调试工具\n\n\
  当你以调试模式运行 WPF 应用时，Visual Studio 在窗口顶部中心覆盖一个小的 4 点菜单。四个菜单项中的三个用于切换调试功能的开启和关闭，最后一项打开活动视觉树（Live\
  \ Visual Tree）。下一个“尝试一下”延续之前的示例并演示这些视觉工具。\n\n## 布局面板\n\n所有内容布局控件都派自抽象类 `Panel`。该类仅定义了一个可以包含派自\
  \ `UIElement` 对象的容器。所有 WPF 控件都派自 `UIElement`。你不能直接使用 `Panel` 类进行布局，但如果你需要可以从它派生。或者，你可以使用派自\
  \ `Panel` 的布局控件。表 14-2 描述了常用的面板。\n\n| 面板 | 描述 |\n| :--- | :--- |\n| `Canvas` | 该控件允许你以任何方式定位子控件。它对子控件的定位不加任何限制，也不提供任何定位帮助。\
  \ |\n| `DockPanel` | 该控件允许你将子控件停靠在其四个边缘之一。最后一个子控件填充剩余空间。 |\n\n\n\n\n\n| `Grid` |\
  \ 此控件允许对子控件进行灵活布局。你可以将此控件的布局分为行和列，从而允许你在此网格布局中对齐控件。 |\n| `StackPanel` | 此控件按顺序的水平或垂直布局对其子控件进行定位。\
  \ |\n| `WrapPanel` | 此控件与 `StackPanel` 一样，按顺序的水平或垂直布局对其子控件进行定位，但它不是将控件放置在单行或单列中，而是根据可用空间将子元素换行到多行或多列。\
  \ |\n\n## 表格 14‐2 ：常用布局面板\n\n### Canvas\n\n`Canvas` 控件提供了对控件定位的完全自由。关于 `Canvas`\
  \ 的另一点是，与子元素使用的 `HorizontalAligment` 和 `VerticalAlignment` 属性对这些元素的定位没有任何影响。\n\n\
  你可以像在前面的示例中那样使用 `Margin` 在 `Canvas` 中为元素定位，但更好的方法是使用 `Canvas` 类暴露的附加属性 `Canvas.Left`、`Canvas.Top`、`Canvas.Right`\
  \ 和 `Canvas.Bottom`：\n\n```\n <Canvas…>\n\n  <Button Canvas.Top=\"10\" Canvas.Left=\"\
  10\"…>Button1</Button>\n\n</Canvas> \n```\n\n上述代码定位了一个 `Button`，使其顶边缘距离 `Canvas`\
  \ 的顶边缘 10 像素，左边缘距离 `Canvas` 的左边缘 10 像素。注意，`Top` 和 `Left` 属性优于 `Bottom` 和 `Right`。例如，如果你同时指定了\
  \ `Top` 和 `Bottom`，则 `Bottom` 属性会被忽略。\n\n图 14‐4 显示了置于 `Canvas` 控件中的两个 `Rectangle`\
  \ 控件，窗口被调整为两种尺寸。\n\n![截图插图，显示置于 Canvas 控件中的两个 Rectangle 控件，窗口已调整为两种尺寸。](img/Image00176.jpg)\n\
  \n####图 14‐4\n\n一个 `Rectangle` 相对于左上角定位，另一个相对于右下角定位。当你调整窗口大小时，这些相对位置会保持不变。你还可以看到\
  \ `Rectangle` 控件堆叠顺序的重要性。右下角的 `Rectangle` 在堆叠顺序中的位置更高，因此当它们重叠时，看到的是这个控件。\n\n此示例的代码如下（你可以在下载的代码\
  \ `LayoutExamples\\Canvas.xaml` 中找到它）：\n\n```\n <Window x:Class=\"LayoutExamples.Canvas\"\
  \n\n        xmlns=\"http://schemas.microsoft.com/winfx/2006/xaml/presentation\"\n\
  \n        xmlns_x=\"http://schemas.microsoft.com/winfx/2006/xaml\"\n\n        xmlns_d=\"\
  http://schemas.microsoft.com/expression/blend/2008\"\n\n        xmlns_mc=\"http://schemas.openxmlformats.org/markup-compatibility/2006\"\
  \n\n        xmlns_local=\"clr-namespace:LayoutExamples\"\n\n        mc:Ignorable=\"\
  d\"\n\n        Title=\"Canvas\" Height=\"300\" Width=\"300\">\n\n    <Canvas Background=\"\
  AliceBlue\">\n\n        <Rectangle Canvas.Left=\"50\" Canvas.Top=\"50\" Height=\"\
  40\" Width=\"100\"\n\n    Stroke=\"Black\" Fill=\"Chocolate\"/>\n\n        <Rectangle\
  \ Canvas.Right=\"50\" Canvas.Bottom=\"50\" Height=\"40\" Width=\"100\"\n\n    Stroke=\"\
  Black\" Fill=\"Bisque\"/>\n\n    </Canvas>\n\n</Window> \n```\n\n### DockPanel\n\
  \n`DockPanel` 控件正如其名，允许你将控件停靠在它的一个边缘上。这种布局对你来说应该是熟悉的，即使你以前从未停下来注意到它。例如，Word 中的 `Ribbon`\
  \ 控件保持在 Word 窗口顶部，或者 Visual Studio 中的各种窗口是如何定位的。在 Visual Studio 中，你还可以通过拖动窗口来更改其停靠位置。\n\
  \n`DockPanel` 拥有一个子控件可以用来指定控件停靠边缘的单一附加属性：`DockPanel.Dock`。你可以将此属性设置为 `Left`、`Top`、`Right`\
  \ 或 `Bottom`。\n\n`DockPanel` 中控件的堆叠顺序极其重要，因为每当你将一个控件停靠到边缘时，你都会减少后续子控件的可用空间。例如，你可能会将一个工具栏停靠在\
  \ `DockPanel` 的顶部，然后将第二个工具栏停靠在 `DockPanel` 的左侧。第一个控件将跨整个 `DockPanel` 显示区域的顶部，但第二个控件将仅从第一个工具栏的底部延伸到\
  \ `DockPanel` 的底部（沿左边缘）。\n\n你指定的最后一个子控件（通常）将填充在所有之前的子控件定位后剩余的区域。（你可以控制这种行为，这就是为什么该表述是限定的。）\n\
  \n当你在 `DockPanel` 中定位控件时，控件占据的区域可能小于 `DockPanel` 留给该控件的区域。例如，如果你停靠一个 `Width` 为 `100`、`Height`\
  \ 为 `100` 的 `Button`。\n\n\n\n\n2. 第二个 `Border` 控件也停靠在 `DockPanel` 的顶部，占据显示区域顶部额外的\
  \ 55 像素。此 `Border` 控件还包含一个 `Width` 属性，这导致边框仅占据 `DockPanel` 宽度的一部分。它是居中位置的，因为 `DockPanel`\
  \ 中 `HorizonalAlignment` 的默认值为 `Center`。\n\n3. 第三个 `Border` 控件停靠在 `DockPanel` 的左侧，占据显示区域左侧的\
  \ 210 像素。\n\n4. 第四个 `Border` 控件停靠在 `DockPanel` 的底部，占据 30 像素加上它所包含的 `Label` 控件的高度（无论该高度是多少）。此高度由\
  \ `Border` 控件的 `Margin`、`Padding` 和内容决定，因为它没有被显式指定。由于 `Border` 控件的 `HorizontalAlignment`\
  \ 为 `Right`，因此它被锁定在 `DockPanel` 的右下角。\n\n5. 第五个也是最后一个 `Border` 控件填充了剩余空间。\n\n运行此示例并尝试调整内容大小。请注意，控件在堆叠顺序中的位置越靠前，空间优先级越高。通过缩小窗口，第五个\
  \ `Border` 控件可能会完全被堆叠顺序中靠前的控件遮挡。使用 `DockPanel` 控件布局时要小心避免这种情况，也许可以通过为窗口设置最小尺寸来实现。\n\
  \n### StackPanel\n\n你可以将 `StackPanel` 视为 `DockPanel` 的精简版本，其中子控件停靠的边缘对于这些控件来说是固定的。这些控件之间的另一个区别是，`StackPanel`\
  \ 的最后一个子控件不会填充剩余空间。然而，控件默认会扩展到 `StackPanel` 控件的边缘。\n\n控件堆叠的方向由三个属性决定。`Orientation`\
  \ 可以设置为 `Horizontal` 或 `Vertical`，并且可以使用 `HorizontalAlignment` 和 `VerticalAlignment`\
  \ 来确定控件堆栈是放置在 `StackPanel` 的顶部、底部、左侧还是右侧边缘。你甚至可以使用所使用的对齐属性的 `Center` 值，让堆叠的控件在 `StackPanel`\
  \ 的中心堆叠。\n\n图 14-6 显示了两个 `StackPanel` 控件，每个都包含三个按钮。顶部的 `StackPanel` 的 `Orientation`\
  \ 属性设置为 `Horizontal`，底部的 `Orientation` 设置为 `Vertical`。\n\n![截图说明，显示两个 StackPanel\
  \ 控件，每个都包含三个按钮。](img/Image00178.jpg)\n\n图 14-6\n\n此处使用的代码如下（你可以在下载的代码 `LayoutExamples\\\
  StackPanels.xaml` 中找到它）：\n\n```\n <Window x:Class=\"LayoutExamples.StackPanels\"\
  \n        xmlns=\"http://schemas.microsoft.com/winfx/2006/xaml/presentation\"\n\
  \        xmlns_x=\"http://schemas.microsoft.com/winfx/2006/xaml\"\n        xmlns_d=\"\
  http://schemas.microsoft.com/expression/blend/2008\"\n        xmlns_mc=\"http://schemas.openxmlformats.org/markup-compatibility/2006\"\
  \n        xmlns_local=\"clr-namespace:LayoutExamples\"\n        mc:Ignorable=\"\
  d\"\n        Title=\"StackPanels\" Height=\"300\" Width=\"300\">\n    <Grid>\n \
  \       <StackPanel HorizontalAlignment=\"Left\" Height=\"128\" VerticalAlignment=\"\
  Top\"\n                Width=\"284\" Orientation=\"Horizontal\">\n            <Button\
  \ Content=\"Button\" Height=\"128\" VerticalAlignment=\"Top\" \n               \
  \     Width=\"75\"/>\n            <Button Content=\"Button\" Height=\"128\" VerticalAlignment=\"\
  Top\" \n                    Width=\"75\"/>\n            <Button Content=\"Button\"\
  \ Height=\"128\" VerticalAlignment=\"Top\" \n                    Width=\"75\"/>\n\
  \        </StackPanel>\n        <StackPanel HorizontalAlignment=\"Left\" Height=\"\
  128\" VerticalAlignment=\"Top\"\n                Width=\"284\" Margin=\"0,128,0,0\"\
  \ Orientation=\"Vertical\">\n            <Button Content=\"Button\" HorizontalAlignment=\"\
  Left\" Width=\"284\"/>\n            <Button Content=\"Button\" HorizontalAlignment=\"\
  Left\" Width=\"284\"/>\n            <Button Content=\"Button\" HorizontalAlignment=\"\
  Left\" Width=\"284\"/>\n        </StackPanel>\n    </Grid>\n</Window> \n```\n\n\
  ### WrapPanel\n\n`WrapPanel` 本质上是 `StackPanel` 的扩展版本；“放不下”的控件会被移动到额外的行（或列）。图 14-7\
  \ 显示了一个包含多个形状的 `WrapPanel` 控件，窗口已调整为两种大小。\n\n![截图说明，显示一个包含多个形状的 WrapPanel 控件，窗口已调整为两种大小。](img/Image00179.jpg)\n\
  \n图 14-7\n\n实现此效果的代码显示在此处（你可以在下载的代码 `LayoutExamples\\WrapPanel.xaml` 中找到它）：\n\n\
  ```\n <Window x:Class=\"LayoutExamples.WrapPanel\"\n        xmlns=\"http://schemas.microsoft.com/winfx/2006/xaml/presentation\"\
  \n        xmlns_x=\"http://schemas.microsoft.com/winfx/2006/xaml\"\n        xmlns_d=\"\
  http://schemas.microsoft.com/expression/blend/2008\"\n        xmlns_mc=\"http://schemas.openxmlformats.org/markup-compatibility/2006\"\
  \n        xmlns_local=\"clr-namespace:LayoutExamples\"\n        mc:Ignorable=\"\
  d\"\n        Title=\"WrapPanel\" Height=\"92\" Width=\"260\">\n    <WrapPanel Background=\"\
  AliceBlue\">\n        <Rectangle Fill=\"#000000\" Height=\"50\" Width=\"50\"/>\n\
  \        <Rectangle Fill=\"#111111\" Height=\"50\" Width=\"50\"/>\n        <Rectangle\
  \ Fill=\"#222222\" Height=\"50\" Width=\"50\"/>\n        <Rectangle Fill=\"#FFFF\"\
  \ Height=\"50\" Width=\"50\"/>\n    </WrapPanel>\n</Window>\n```\n\n`WrapPanel`\
  \ 控件是创建允许用户控制内容布局的好方法。\n\n### Grid\n\n`Grid` 控件可以有多个行和列，你可以使用它们来布局控件。在本章中你多次使用了\
  \ `Grid` 控件，但在所有情况下使用的都是单行单列的 `Grid`。要添加更多行和列，你必须使用 `RowDefinitions` 和 `ColumnDefinitions`\
  \ 属性，它们分别是 `RowDefinition` 和 `ColumnDefinition` 对象的集合，并使用属性元素语法指定：\n\n```\n <Grid>\n\
  \  <Grid.RowDefinitions>\n    <RowDefinition/>\n    <RowDefinition/>\n  </Grid.RowDefinitions>\n\
  \  <Grid.ColumnDefinitions>\n    <ColumnDefinition/>\n    <ColumnDefinition/>\n\
  \  </Grid.ColumnDefinitions>\n</Grid>\n```\n\n此代码定义了一个具有两行两列的 `Grid` 控件。注意这里不需要额外信息；使用此代码，每行每列都会随着\
  \ `Grid` 的调整而动态调整大小。每行将占据 Grid 高的三分之一，每列将占据宽的一半。你可以通过将 `Grid.ShowGridlines` 属性设置为\
  \ `true` 来在单元格之间显示线条。\n\n你可以使用 `Width`、`Height`、`MinWidth`、`MaxWidth`、`MinHeight`和`MaxHeight`属性来控制调整。例如，设置列的\
  \ `Width` 属性可以确保该列保持该宽度。你也可以将列的 `Width` 属性设置为 `*`，这意味着“在计算所有其他列宽度之后填充剩余空间”。这实际上是默认值。当你有多个列的\
  \ `Width` 为 `*` 时，剩余空间将平均地分配在它们之间。`*` 值也可以用于行的 `Height` 属性。`Height` 和 `Width` 的另一个可能值是\
  \ `Auto`，它根据内容对行或列进行调整。你还可以使用 `GridSplitter` 控件来允许用户通过点击和拖动来自定义行和列的尺寸。\n\n\n\n\n\
  `Grid` 控件的子控件可以使用附加的 `Grid.Column` 和 `Grid.Row` 属性来指定它们所所在的单元格。这两个属性的默认值均为 `0`，因此如果你省略了它们，子控件将放置在左角的单元格中。子控件还可以使用\
  \ `Grid.ColumnSpan` 和 `Grid.RowSpan` 跨越表格中的多个单元格，其中左上角的单元格由 `Grid.Column` 和 `Grid.Row`\
  \ 指定。\n\n在下面的“尝试一下”（Try It Out）中，你将使用 `Grid` 的属性来创建行和列，并使用 `GridSplitter` 在运行时更改这些属性。\n\
  \n# 游戏客户端\n\n现在你已经了解了使用 WPF 和 Visual Studio 的基础知识，是时候开始使用控件来创建一些实用的东西了。本章的剩余部分以及第\
  \ 15 章专门用于为你在之前的章节中开发的卡牌游戏编写一个游戏客户端。你将使用很多控件，甚至还会自己编写一个。\n\n在本章中，你将编写游戏的辅助对话框——这包括“关于”（About）、“选项”（Options）和“新游戏”（New\
  \ Game）窗口。\n\n## 关于窗口\n\n“关于”窗口（有时被称为“关于”框）用于显示有关应用程序开发者和应用程序本身的信息。某些“关于”窗口非常复杂，例如\
  \ Microsoft Office 和 Visual Studio 中的窗口，它们会显示版本和许可信息。“关于”窗口通常可以从“帮助”菜单访问，那里通常是列表中的最后一项。\n\
  \n图 14-9 显示了即将创建的完成对话框的截图。\n\n![即将创建的完成对话框截图示意图。](img/Image00181.jpg)\n\n[`图 14-9]](#text00018.html_R_c14-fig-0009)\n\
  \n### 设计用户界面\n\n“关于”窗口不是用户会经常看到的东西。事实上，它通常位于“帮助”菜单中的结是因为，当用户需要查找应用程序版本信息或在出现问题时知道联系谁时，它经常会被用到。但这也意味着用户访问该窗口是有特定目的的，如果你在应用程序中包含了这样的窗口，你应该将其视为重要的部分。\n\
  \n每当你设计应用程序时，都应该努力保持视觉效果和感受尽可能的一致。这意味着你应该坚持使用几种选定的颜色，并在应用程序的处处使用相同的控件样式。在 Karli\
  \ Cards 的情况下，你将使用三种主颜色——红、黑、白。\n\n如果你查看图 14-9，你会发现窗口的左上角被 Wrox Press 的标志占据了。你之前没有使用过图像，但为你的应用程序添加一些精选图像可以使用户界面看起来更专业。\n\
  \n### Image 控件\n\n`Image` 是一个非常简单的控件，可以产生极佳的效果。它允许你显示单张图像并根据需要调整图像的大小。该控件暴露两个属性，如表\
  \ 14-3 所示。\n\n| **属性** | **描述** |\n| --- | --- |\n| `Source` | 使用此属性指定图像的位置。这可以是磁盘上的位置，也可以是网络上的某个地方。正如你在第\
  \ 15 章中所看到的，也可以创建一个静态资源并将其作为源。 |\n| `Stretch` | 实际上，拥有一个大小完全符合你要求的图像是非常稀见的，有时随着应用程序窗口的调整，图像的大小也必须改变。你可以使用此属性来控制图像的行为。四种可能性：`None`——图像不调整大小。`Fill`——图像调整大小以填充整个空间。这可能会导致图像变形。`Uniform`——图像保持其宽高比，如果填充可用空间会改变宽高比，则不填充。`UniformToFill`——图像保持其宽高比并填充可用空间。如果保持比例意味着图像某些部分对于可用空间过大，则图像会被裁剪以适应。\
  \ |\n\n[`表 14-3]](#text00018.html_R_c14-tbl-0003) : Image 控件属性\n\n### Label 控件\n\
  \n你已经在之前的示例中见过这种最简单的控件了。它向用户显示简单的文本信息，在某些情况下传达有关快捷键的信息。该控件使用 `Content` 属性来显示文本。`Label`\
  \ 控件在单行上显示文本。如果你在字母前加上下划线字符“_”，该字母将变为下划线，然后就可以使用带前缀的字母和 Alt 直接访问控件。例如，`_Name` 会为紧跟在标签\
  \ 后的任何控件分配快捷键 Alt+N。\n\n### TextBlock 控件\n\n与 `Label` 类似，此控件显示带有任何复杂格式的简单文本。与 `Label`\
  \ 不同，`TextBlock` 控件能够显示多行。即使文本无法放入空间，`TextBlock` 也会显示。在这种情况下 `TextBlock` 不提供任何滚动条，但在需要时它可以包装在一个方便的视图中：`ScrollViewer`。\n\
  \n### Button 控件\n\n像 `Label` 控件一样，你已经见过很多 `Button` 控件。该控件随处可见，且易于识别。更改这种行为可能会导致糟糕的界面。\n\
  \n默认情况下，按钮显示单行短文本，但你可以使用 `Content` 属性显示简单文本，或嵌入 `Image` 控件来显示图像。你可以在下载的代码 `Ch14Ex01.ImageButton.xaml`\
  \ 中找到这些代码：\n\n```\n<Button HorizontalAlignment=\"Left\" VerticalAlignment=\"Top\"\
  \ Width=\"75\" Margin=\"10\">\n  <StackPanel Orientation=\"Horizontal\">\n    <Image\
  \ Source=\".\\Images\\Delete_black_32.png\" Stretch=\"UniformToFill\" Width=\"16\"\
  \ Height=\"16\"/>\n    <TextBlock>Delete</TextBlock>\n  </StackPanel>\n</Button>\n\
  ```\n\n图 14-10 显示了带有文本和图像的删除按钮。\n\n[`图 14-10]](#text00018.html_R_c14-fig-0010)\n\
  \n### 选项窗口\n\n你将创建的下一个窗口是窗口。此窗口允许玩家设置若干改变游戏的参数。它还将允许你使用一些尚未使用的控件：`CheckBox`、`RadioButton`、`ComboBox`、`TextBox`\
  \ 和 `TabControl` 控件。\n\n图 14-11 显示了选择了第一个标签的窗口。乍一看窗口看起来和“关于”窗口非常相似，但在这个窗口上有更多工作要要做。\n\
  \n![显示选择了第一个标签的选项窗口示意图。](img/Image00183.jpg)\n\n[`图 14-11]](#text00018.html_R_c14-fig-0011)\n\
  \n#### TextBox 控件\n\n\n\n\n\n在本章之前的内容中，你已经使用了 `Label` 和 `TextBlock` 控件。这些控件专门为向用户显示文本而设计。`TextBox`\
  \ 控件允许用户向应用程序中输入文本。虽然它也可以显示文本，除非允许用户编辑显示的文本，否则你不应将其用于此目的。如果你决定要使用文本框显示文本，请务必将它的\
  \ `IsEnabled` 属性设置为 `false`，以防止用户进行编辑。\n\n你可以通过表 14‐4 所示的若干属性来控制文本在 `TextBox` 中的显示和输入方式。\n\
  \n| **属性** | **描述** |\n| --- | --- |\n| `Text` | 当前在 `TextBox` 控件中显示的文本。 |\n| `IsEnabled`\
  \ | 当此设置为 `true` 时，用户可以编辑 `TextBox` 中的文本。当设置为 `false` 时，文本显示为灰色，用户无法获取该控件的焦点。 |\n\
  | `TextWrapping` | 有时，你希望 `TextBox` 只显示单行文本。在这种情况下，你可以将此属性设置为 `NoWrap`。这是默认值。如果你希望文本在多行中显示，可以将其设置为\
  \ `Wrap` 或 `WrapWithOverflow`。`Wrap` 会导致超出框边缘的文本移动到下一行。`WrapWithOverflow` 在某些情况下，如果无法确定合适的断行点，将允许非常长的单词超出边缘。\
  \ |\n| `VerticalScrollBarVisibility` | 如果你的 `TextBox` 允许用户输入多行文本，那么用户可能会输入在框下边缘以下消失的文本。在这种情况下，显示滚动条是一个好主意。如果你希望仅在文本过长无法完全显示时才出现滚动条，请将其设置为\
  \ `Auto`。将其设置为 `Visible` 则始终显示，将其设置为 `Hidden` 或 `Disabled` 则永远不显示滚动条。 |\n| `AcceptsReturn`\
  \ | 此属性控制如何向控件中输入文本。如果你将其设置为 `false`（默认值），用户无法通过回车键换行。 |\n\n**表 14‐4**：TextBox 属性\n\
  \n### CheckBox 控件\n\n`CheckBoxes` 为用户提供了可以选择或取消选择的选项。如果你想向用户提供一个可以开启或关闭的选项，或者希望用户对问题回答“是”或“否”，就应该使用\
  \ `CheckBox`。例如，在“选项”对话框中，你希望用户回答以决定他们是否与电脑对战。为此，使用了带有“与电脑对战”文本的 `CheckBox`。\n\n\
  `CheckBox` 被设计为单个实体使用，不受视图中其他 `CheckBoxes` 的影响。你有时会看到 `CheckBoxes` 以将它们链接在一起的方式使用，使得选择其中一个会导致另一个被取消选择，但并不是该控件的意图用法。如果你需要此功能，应该使用下一节中描述的\
  \ `RadioButton`。\n\n`CheckBoxes` 还可以显示第三种状态，称为“不确定”（indeterminate），用于表示无法回答“是/否”的答案。当\
  \ `CheckBox` 用于显示有关其他事物的信息时，这种状态很常见。例如，`CheckBoxes` 有时用于指示树视图（Tree View）中的所有子节点是否都被选中。在这种情况下，如果所有节点都被选中，则\
  \ `CheckBox` 将选中；如果一个都没有选中，则将取消选中；如果选中了部分而非全部，则处于不确定状态。\n\n表 14‐5 列出了常用于控制 `CheckBox`\
  \ 控件的属性。\n\n| **属性** | **描述** |\n| --- | --- |\n| `Content` | `CheckBox` 是一个 `Content`\
  \ 控件，因此其显示可以被高度自定义。向 `Content` 属性添加文本将产生默认视图。 |\n| `IsThreeState` | 用于指示控件是否可以有两个或三个状态。默认值为\
  \ `false`，意味着只有两个可能的值。 |\n| `IsChecked` | 该值为 `true` 或 `false`。默认情况下，将其设置为 `true`\
  \ 会显示勾选标记。如果 `IsThreeState` 为 `true`，则可能是 `null`，表示状态是不定的。 |\n\n**表 14‐5**：CheckBox\
  \ 属性\n\n### RadioButton 控件\n\n`RadioButtons` 与其他 `RadioButtons` 使用，允许用户在多个选项之间进行选择，且任何时候只能选择一个。当你希望用户回答一个可能值非常有限的问题时，应该使用\
  \ `RadioButtons`。如果有四个或五个可能的选择，你应该考虑使用 `ListBox` 或 `ComboBox` 代替。在很快后你创建的“选项”窗口中，用户可以选择电脑选手的技能水平。有三个选项：笨（Dumb）、好（Good）和作弊（Cheats）。在任何时刻都只能选择其中一个。\n\
  \n当在同一视图中显示多个 `RadioButton` 时，它们默认会相互感知，一旦选择了其中任何一个，其他的就会取消选择。\n\n你可以通过表 14‐6 中列出的属性来控制\
  \ `RadioButtons`。\n\n| **属性** | **描述** |\n| --- | --- |\n| `Content` | `RadioButtons`\
  \ 是 `Content` 控件，因此可以修改显示。默认情况下，在 `Content` 中输入文本。 |\n| `IsChecked` | 该值为 `true`\
  \ 或 `false`。如果 `IsThreeState` 为 `true`，则可能是 `null`，表示状态是不定的。 |\n| `GroupName` |\
  \ 控件所属组的名称。默认情况下为空，任何没有 `GroupName` 的 `RadioButtons` 被视为同一组。 |\n\n**表 14‐6**：RadioButton\
  \ 属性\n\n### ComboBox 控件\n\n与 `RadioButton` 和 `CheckBox` 控件一样，`ComboBoxes` 允许用户选择一个选项。然而，`ComboBoxes`\
  \ 在两个方面与其他两者本质不同：\n\n* `ComboBoxes` 在下拉列表中显示可能的选择。\n* 可以允许用户输入新值。\n\n`ComboBoxes`\
  \ 通常用于显示长列表，例如国家或州名，但它们可以用于许多目的。在“选项”对话框中，使用 `ComboBox` 来显示一个用户可以从中选择人数的列表。虽然这完全可以使用\
  \ `RadioButtons` 完成，但使用 `ComboBox` 可以节省视图空间。\n\n`ComboBox` 可以更改为顶部带有 `TextBox` 的显示方式，允许用户输入他们认为缺失的任何值。本章的一个练习要求你在“选项”对话框中添加一个\
  \ `ComboBox`，用户可以从中输入他们的姓名，也可以从列表中选择。\n\n这两个属性——`IsReadOnly` 和 `IsEditable` 对控件的行为非常重要，它们共同工作，为用户提供了四种使用键盘选择\
  \ `ComboBox` 值的可能方式（见表 14이터7）：\n\n| | **ISREADONLY IS TRUE** | **ISREADONLY IS FALSE**\
  \ |\n| --- | --- | --- |\n| `IsEditable` 为 `true` | `TextBox` 显示但控件对按键按下没有反应。如果从列表中选择了项，则可以在\
  \ `TextBox` 中选中该文本。 | `TextBox` 显示且用户可以输入她想要的任何内容。如果输入的内容在列表中，则会被选中。控件在用户输入时将显示最匹配项。\
  \ |\n\n\n\n\n\n| `IsEditable` 为 `false` | 当 `IsEditable` 为 `false` 时，`IsReadOnly`\
  \ 不再起作用，因为 `TextBox` 不显示。当控件被选中时，用户可以通过输入来从列表中选择值，但无法输入不在列表中的值。 |\n\n**表 14‐7:**\
  \ IsReadOnly 和 IsEditable 的组合\n\n`ComboBox` 是一个项目项（Items）控件，这意味着你可以向它添加多个项目项。表 14‐8\
  \ 显示了 `ComboBox` 控件的额外属性。\n\n| COMBOBOX 属性 | 描述 |\n| --- | --- |\n| `Text` | `Text`\
  \ 属性表示在 `ComboBox` 头部显示的文本。它是列表中的一个元素，或者是用户输入的新文本。 |\n| `SelectedIndex` | 表示列表中选中项的索引。如果该值为\
  \ –1，则表示没有选择。如果用户输入了不在列表中的内容，也是如此。 |\n| `SelectedItem` | 表示列表的实际项目，而不仅仅是索引或文本。如果没有选中任何内容或用户输入了新内容，则返回\
  \ `null`。 |\n\n**表 14‐8:** 其他 ComboBox 属性\n\n#### TabControl（选项卡控件）\n\n`TabControl`\
  \ 与本节介绍的其他控件完全不同。它是一种布局控件，用于将控件分组在可以通过点击选择的页面上。\n\n当你希望在单个窗口中显示大量信息，但不想让视图过于混乱时，就会使用选项卡控件。在这种情况下，你应该将信息划分为相关项目的组，并为每个组创建一个单独的页面。通常情况下，你不应该允许一个页面上的控件影响另一个页面上的控件。即使你这样做，用户也不会察觉到另一个页面上发生了变化，并在设置在他们不知情的情况下发生变化时会感到困惑。\n\
  \n默认情况下，每个页面由 `TabItems` 组成，而这些项 默认由单个 `Grid` 控件填充，但你可以根据需要将 `Grid` 更改为任何其他控件。在每个选项卡上，你可以布局\
  \ UI，并通过选择 `TabItems` 在不同选项卡之间切换。每个 `TabItem` 都有一个 `Header`，用于显示选项卡本身。它可以被用作 `Content`\
  \ 控件，这意味着你可以自定义标题的显示方式，使其不仅仅是文本。\n\n#### 在选项窗口中处理事件\n\n到目前为止，窗口看起来很正常，用户甚至可以对其进行一些操作，尽管更改设置时不会发生任何事情。用户期望他们选择的选项会被应用程序存储并使用。你可以通过存储窗口中控件的值来实现这一点，但这样做并不灵活，而且会将应用程序数据与\
  \ GUI 混合，这不是一个好主意。相反，你应该创建一个类来存储用户所做的。\n\n在接下来的“尝试一下”（Try It Out）中，你为选项窗口添加了事件处理器，这些处理器会在用户与控件交互时执行。\n\
  \n### 数据绑定\n\n数据绑定是一种以声明式方式将控件与数据连接的方法。在选项窗口中，你已经处理了 `RadioButtons` 的 `Checked`\
  \ 事件，以便设置 `GameOptions` 类中 `ComputerSkillLevel` 属性的值。这种方法运行良好，可以使用代码和事件处理来设置窗口中的所有值，但很多情况下，直接将控件的属性绑定到数据更好。\n\
  \n一个绑定由四个部分组成：\n\n* 绑定目标（binding target），指定使用绑定的对象\n* 目标属性（target property），指定要设置的属性\n\
  * 绑定源（binding source），指定绑定使用的对象\n* 源属性（source property），指定持有数据的属性\n\n你不总是显式设置所有这些元素；特别是绑定目标，通常通过你对控件上的属性设置绑定这一事实隐式地指定。\n\
  \n为了使绑定生效，始终设置绑定源，但可以通过多种方式设置。在接下来的章节和第 15 章中，你将看到从源绑定数据的几种方法。\n\n#### DataContext（数据上下文）\n\
  \n`DataContext` 控件定义了一个数据源，可以用于元素所有子元素的数据绑定。你通常会有一个类的实例，持有视图中使用的大部分数据。如果是这样，你可以将窗口的\
  \ `DataContext` 设置为该对象的实例，从而能够在视图中绑定该类的属性。这在“到外部对象的动态绑定”部分中得到了演示。\n\n#### 绑定到本地对象\n\
  \n只要编译器能够找到该对象，你就可以绑定到任何拥有所需数据的 .NET 对象。如果找到的对象在相同的上下文中（即使用该对象的相同 XAML 块中），你可以通过设置绑定的\
  \ `ElementName` 属性来指定绑定源。看看选项窗口中更改后的 `ComboBox`：\n\n```\n <ComboBox HorizontalAlignment=\"\
  Left\" Margin=\"196,58,0,0\" VerticalAlignment=\"Top\" \nWidth=\"86\" Name=\"numberOfComboBox\"\
  \ SelectedIndex=\"0\" \nIsEnabled=\"{Binding ElementName=playAgainstCheck, Path=IsChecked}\"\
  />\n```\n\n\n\n\n\n你现在距离完成游戏中的所有支持窗口仅差一个窗口了。创建游戏面板之前的最后一个窗口是玩家可以在其中添加新玩家，并选择参与新游戏的玩家的窗口。此窗口将使用\
  \ `ListBox` 来显示玩家名称。\n\n`ListBoxes` 和 `ComboBoxes` 经常可以用于相同的目的，但 `ComboBox` 通常只允许你选择单个条目，而\
  \ `ListBoxes` 往往允许用户选择多个项目。另一个关键区别是，`ListBox` 以始终展开的列表形式显示其内容。这意味着它占据了窗口上更多的空间，但它允许用户即刻看到所有可用选项。\n\
  \n表 14‐9 列出了 `ListBox` 控件的几个特别有趣的属性。\n\n| 属性 | 描述 |\n| --- | --- |\n| `SelectionMode`\
  \ | 此属性控制用户如何从列表中选择项目。有三种可能的值：`Single`，允许用户只选择一个项目；`Multiple`，允许用户在不按 Ctrl 键的情况下选择多个项目；`Extended`，允许用户通过按住\
  \ Shift 键选择多个连续项目，通过按住 Ctrl 键选择非连续项目。 |\n| `SelectedItem` | 获取或设置第一个选中的项目，如果未选中任何内容则返回\
  \ null。即使选择了多个项目，也只返回第一个项目。 |\n| `SelectedItems` | 获取包含当前已选中项目的列表。 |\n| `SelectedIndex`\
  \ | 类似于 `SelectedItem`，但它返回的是索引而不是项目本身，并在未选中任何内容时返回 -1。 |\n\n**表 14‐9 ：趣味的 ListBox\
  \ 属性**\n\n在下一个“尝试一下（Try It Out）”中，你将创建一个当用户想要开始新游戏时显示的窗口。\n\n## 练习题\n\n1. 14.1 `TextBlock`\
  \ 控件可以显示大量文本，但如果文本超出了视口，该控件并不提供任何滚动文本的方法。通过将 `TextBlock` 与另一个控件结合，创建一个包含大量文本的 `TextBlock`\
  \ 窗口，该文本是可以滚动的，并且只有在文本超出视口时滚动条才会出现。\n\n2. 14.2 `Slider` 和 `Progress` 控件有一些共同点，例如最小值、最大值和当前值。仅在\
  \ `ProgressBar` 上使用数据绑定，创建一个带有滑块和进度条的窗口，其中 `Slider` 控件控制进度条的最小值、最大值和当前值。\n\n3. 14.3\
  \ 将上一个问题中的 `ProgressBar` 改为从窗口的左下角到右上角对角线显示。\n\n4. 14.4 创建名为 `PersistentSlider`\
  \ 的新类，并包含三个属性：`MinValue`、`MaxValue` 和 `CurrentValue`。该类必须参与数据绑定，且所有属性都能够通知已绑定的控件更改。\n\
  \n   1. 在前两个练习中创建的窗口的代码后台（code-behind）中，创建一个 `PersistentSlider` 类型的新字段，并用一些默认值初始化它。\n\
  \n   2. 在构造函数中，将实例绑定到窗口的数据源。\n\n   3. 将滑块的 `Minimum`、`Maximum` 和 `Value` 属性绑定到数据源。练习题的答案可以在附录中找到。\n\
  \n## ![image](img/Image00002.gif) 本章学到的知识\n\n| 核心概念 | 描述 |\n| --- | --- |\n| XAML\
  \ | XAML 是一种使用 XML 语法的语言，能够以声明、层次的方式将控件添加到用户界面。 |\n| 数据绑定 | 你可以使用数据绑定将控件的属性连接到其他控件的值。你还可以定义资源，并在视图外部类中定义的代码作为数据源，用于属性值和控件内容。`DataContexts`\
  \ 可指定现有对象实例的绑定源，从而允许你绑定到应用程序其他部分创建的实例。 |\n| 路由事件 | 路由事件是 WPF 中使用的特殊事件。它们有两种形式：冒泡（bubbling）和隧道（tunneling）。冒泡事件首先在激活它的控件上触发，然后通过视图树向上冒泡到根元素。隧道事件则相反移动，从根元素移动到用户激活的控件。通过将事件参数的\
  \ `Handled` 属性设置为 `true`可以停止冒泡或隧道事件。 |\n| INotifyPropertyChanged | `INotifyPropertyChanged`\
  \ 接口由 WPF 视图使用的类实现。当类的属性设置器被调用时，它们会触发 `PropertyChanged` 事件，并带有发生值改变的属性名称。任何绑定到触发事件的属性的控件属性都会收到更改通知并相应更新自身。\
  \ |\n| ObservableCollections | `ObservableCollection` 是一种集合，它等实现了 `INotifyPropertyChanged`\
  \ 接口。当你想要为 WPF 视图提供列表类型的属性或值进行数据绑定时，请使用这种特殊集合。 |\n| 内容控件 | 内容控件在其内容中可以包含单个控件。此类控件的示例是\
  \ `Button`。此控件可以是 `Grid` 或 `StackPanel`； |\n| 项目控件 | 项目控件在其内容中可以包含一个控件列表。此类控件的示例是\
  \ `ListBox`。 |\n| 布局控件 | 你学习了使用多个控件帮助创建视图：1. `Canvas` 允许对控件进行显式定位，但除此之外几乎没有。2. `StackPanel`\
  \ 水平或垂直方向堆叠控件。3. `WrapPanel` 根据面板的方向堆叠控件并将其换到下一行或下一列。4. `DockPanel` 允许你将控件停靠在边缘或填充内容。5.\
  \ `Grid` 允许你定义行和列，并使用这些来定位控件。 |\n| UI 控件 | UI 控件在视图上显示自己，通常使用布局控件来引导它们的位置。这些控件用于：1.\
  \ `Label` 控件显示短文本。2. `TextBlock` 控件显示可能需要多行的文本。3. `TextBox` 控件允许用户提供文本输入。4. `Button`\
  \ 控件允许用户执行单个操作。5. `Image` 控件用于显示图像。6. `CheckBoxes` 让用户回答是/否问题，例如“对战电脑？”。7. `RadioButtons`\
  \ 让用户从多个选项中恰好选择一个。8. `ComboBoxes` 显示一个下拉项目列表，用户可以从中选择单个项目。该控件还可以显示 `TextBox`，让用户输入新选项。9.\
  \ `ListBox` 控件显示项目列表。10. `TabControls` 允许你将控件分组在页面上。 |\n\n\n\n\n\nWPF 控件有一个名为 `Style`\
  \ 的属性（继承自 `FrameworkElement`），该属性可以设置为 `Style` 类的实例。`Style` 类非常复杂，并能够高级的样式功能，但其核心是一组\
  \ `Setter` 对象的集合。每个 `Setter` 对象负责根据其 `Property` 属性（要设置的属性名称）和 `Value` 属性（要设置的该属性的值）来设置某个属性的值。你可以将在\
  \ `Property` 中使用的名称完全限定到控件类型（例如 `Button.Foreground`），或者你也可以设置 `Style` 对象的 `TargetType`\
  \ 属性（例如 `Button`），以便它能够解析属性名称。\n\n以下代码展示了如何使用 `Style` 对象来设置 `Button` 控件的 `Foreground`\
  \ 属性：\n\n```xml\n <Button>\n  Click me!\n  <Button.Style>\n    <Style TargetType=\"\
  Button\">\n      <Setter Property=\"Foreground\">\n        <Setter.Value>\n    \
  \      <SolidColorBrush Color=\"Purple\"/>\n        </Setter.Value>\n      </Setter>\n\
  \    </Style>\n  </Button.Style>\n</Button>\n```\n\n显然，在这种情况下，直接用通常的方法设置按钮的 `Foreground`\
  \ 属性要简单得多。当你将样式转换为资源时，样式会变得有用得多，因为资源是可以重用的。\n\n### 模板 (Templates)\n\n控件是使用模板构建的，你可以自定义模板。模板由一组用于构建控件显示的控件层次结构组成，其中可能包含一个用于按钮等显示内容的控件\
  \ `ContentPresenter`。\n\n控件的模板存储在它的 `Template` 属性中，该属性是 `ControlTemplate` 类的实例。`ControlTemplate`\
  \ 类包含 `TargetType` 属性，你可以将其设置为你正在定义模板的控件类型。\n\n通常，你通过使用样式来为类设置模板。这仅涉及以如下方式提供用于 `Template`\
  \ 属性的控件：\n\n```xml\n <Button>\n  Click me!\n  <Button.Style>\n    <Style TargetType=\"\
  Button\">\n      <Setter Property=\"Template\">\n        <Setter.Value>\n      \
  \    <ControlTemplate TargetType=\"Button\">\n            …\n          </ControlTemplate>\n\
  \        </Setter.Value>\n      </Setter>\n    </Style>\n  </Button.Style>\n</Button>\n\
  ```\n\n某些控件可能需要多个模板。例如，`CheckBox` 控件使用一个模板用于复选框（`CheckBox.Template`），使用另一个模板在复选框旁边输出文本（`CheckBox.ContentTemplate`）。\n\
  \n允许你更改控件内容的模板可以通过在你想输出内容的位置包含 `ContentPresenter` 来实现。\n\n在上一章中，你开发了三个外观和感觉相似的对话框。这些对话框的共同元素之一是头部，你在那里更改了每个对话框中标签的文本。你可以将该头部定义为标签，在下一个“尝试一下”中，你将开发一个新的\
  \ `Label` 样式并使用它来替换四个对话框中的头部。\n\n### 触发器 (Triggers)\n\nWPF 中的事件可以包含各种事物，包括按钮点击、应用程序启动和关闭事件等。WPF\
  \ 使用几种类型的触发器来提供事件等功能，所有这些都继承自基类 `TriggerBase`。其中一种触发器是 `EventTrigger` 类，它包含一个动作集合，每个动作都是一个派生自基类\
  \ `TriggerAction`的对象。这些动作在触发器激活时执行。\n\n你可以使用 `EventTrigger` 通过 `BeginStoryboard`\
  \ 动作触发动画，使用 `ControllableStoryboardAction` 操作故事板，并使用 `SoundPlayerAction` 触发音效。\n\
  \n每个控件都有一个 `Triggers` 属性，你可以用它直接在该控件上定义触发器。你也可以在层次结构的更上层定义触发器——例如，在 `Window` 对象上。你在为控件样式时最常用的触发器类型是\
  \ `Trigger`（尽管你仍然会使用 `EventTrigger` 来触发控件动画）。`Trigger` 类用于响应其他属性的变化来设置属性，在在 `Style`\
  \ 对象中使用时特别有用。\n\n触发器对象的配置如下：\n\n- 要定义 `Trigger` 对象监控哪个属性，你使用 `Trigger.Property`\
  \ 属性。\n- 要定义 `Trigger` 对象在何时激活，你设置 `Trigger.Value` 属性。\n- 要定义 `Trigger` 采取的动作，你将\
  \ `Trigger.Setters` 属性 设置为 `Setter` 对象的集合。\n\n这里提到的 `Setter` 对象与你之前在“样式”部分看到的对象完全相同。\n\
  \n以下代码展示了你在 `Style` 对象中使用 `Trigger`：\n\n```xml\n <Style TargetType=\"Button\">\n\
  \  <Style.Triggers>\n    <Trigger Property=\"IsMouseOver\" Value=\"true\">\n   \
  \   <Setter Property=\"Foreground\" Value=\"Yellow\"/>\n    </Trigger>\n  </Style.Triggers>\n\
  </Style>\n```\n\n此代码当 `Button.IsMouseOver` 属性为 `true` 时，将 `Button` 控件的 `Foreground`\
  \ 属性更改为 `Yellow`。`IsMouseOver` 是几个非常有用的属性之一，你可以作为快捷方式查找有关控件和控件状态的信息。正如其名称所示，如果鼠标悬停在控件上，它为\
  \ `true`。这允许你为鼠标悬停编写代码。其他类似属性包括 `IsFocused`（用于判断控件是否具有焦点）、`IsHitTestVisible`（指示是否可以点击控件，即它是否被更上层的控件遮挡）以及\
  \ `IsPressed`（指示按钮是否被按下）。最后一种属性仅适用于继承自 `ButtonBase` 的按钮，而其他属性适用于所有控件。\n\n你还可以通过使用\
  \ `ControlTemplate.Triggers` 属性来实现很多功能，它允许你创建包含触发器的控件模板。这就是默认 `Button` 模板能够响应鼠标悬停、点击和焦点变化的方式。这也是你自己实现此类功能时必须修改的内容。\n\
  \n### 动画 (Animations)\n\n动画是通过使用故事板（storyboards）创建的。定义复杂动画的最佳方法是使用 Expression Blend\
  \ 等设计师。然而，你也可以通过直接编辑 XAML 代码和 C# 代码来定义它们。\n\nWPF 中的动画是通过名为 `Storyboard` 的对象定义的。使用故事板，你可以对属性进行动画——例如按钮的背景颜色。非常重要的一点是，你可以以这种方式动画几乎任何属性，而不仅仅是影响控件显示的属性。\n\
  \n故事板可以单独定义在 `Resource Dictionary` 中，也可以通过事件触发器的 `BeginStoryboard` 属性定义在控件内部。在故事板内部，你定义一个或多个动画或时间线。\n\
  \n在上一节中，你使用触发器在鼠标悬停在控件上时设置 `Button` 控件的前景色值。查看以下代码，它使用了故事板而不是触发器：\n\n\n\n\n\n```xml\n\
  \ <Button Content=\"Animation\" HorizontalAlignment=\"Left\" Margin=\"197,63,0,0\"\
  \ \n                                VerticalAlignment=\"Top\" Width=\"75\">\n  \
  \          <Button.Triggers>\n                <EventTrigger RoutedEvent=\"Button.MouseEnter\"\
  >\n                    <BeginStoryboard>\n                        <Storyboard>\n\
  \                            <ColorAnimation To=\"Yellow\" \n                  \
  \                  Storyboard.TargetProperty=\"(Button.Foreground)\n           \
  \                                              .(SolidColorBrush.Color)\"\n    \
  \                                FillBehavior=\"HoldEnd\" \n                   \
  \                 Duration=\"0:0:1\" AutoReverse=\"False\"/>\n                 \
  \       </Storyboard>\n                    </BeginStoryboard>\n                </EventTrigger>\n\
  \                <EventTrigger RoutedEvent=\"Button.MouseLeave\">\n            \
  \        <BeginStoryboard>\n                        <Storyboard>\n             \
  \               <ColorAnimation To=\"Black\" \n                                \
  \    Storyboard.TargetProperty=\"(Button.Foreground)\n                         \
  \                                .(SolidColorBrush.Color)\"\n                  \
  \                  FillBehavior=\"HoldEnd\" \n                                 \
  \   Duration=\"0:0:1\"/>\n                        </Storyboard>\n              \
  \      </BeginStoryboard>\n                </EventTrigger>\n            </Button.Triggers>\n\
  \        </Button> \n```\n\n`Button` 包含两个触发器，一个用于 `MouseEnter`，另一个用于 `MouseLeave`。每个触发器都包含一个\
  \ `ColorAnimation`，分别将文本的前景色颜色改为黄色和黑色。直接使用 `Trigger` 设置 `Foreground` 属性与使用 storyboard\
  \ 之间的区别在于细节：使用 storyboard 你可以获得一个持续 1 秒的平滑过渡效果，而当你直接设置属性时，它是瞬间发生的。这两者都是非常有价值的工具，并且应该在适当的情况下使用——过多的动画可能会让用户讨厌，但几个恰当的动画可以让应用程序看起来非常惊艳。\n\
  \n# WPF 用户控件\n\n图形卡牌游戏的一个关键特性是……卡牌。显然，你不会在 WPF 自带的标准控件中找到一个“扑克牌”控件，因此你必须自己创建它。\n\
  \nWPF 提供了一组在许多情况下都非常有用的控件。然而，与所有的 .NET 开发框架一样，它也允许你扩展这些功能。具体来说，你可以通过派生自 WPF 类层次结构中的类来创建自己的控件。\n\
  \n你可以派生的最实用的控件之一是 `UserControl`。该类为你提供了你可能需要的 WPF 控件所需的所有基本功能，并使你的控件能够无缝地接入现有的 WPF\
  \ 控件套件。你希望通过 WPF 控件实现的所有内容——例如动画、样式和模板——都可以通过用户控件来实现。\n\n你可以通过项目 ![image](img/Image00008.gif)\
  \ “添加用户控件”菜单项将用户控件添加到项目中。这为你提供了一个空白的画布（实际上，实际上是一个空白的 `Grid`）来开始工作。用户控件使用 XAML 中的顶层\
  \ `UserControl` 元素定义，后台代码中的类派生自 `System.Windows.Controls.UserControl` 类。\n\n一旦你向项目添加了用户控件，你就可以添加控件来布局视觉外观，并使用后台代码来配置控件。完成这些操作后，你可以在整个应用程序中使用它，甚至可以在其他应用程序中复用它。\n\
  \n创建用户控件时需要知道的关键点之一是实现实现依赖属性（dependency properties）。第 14 章 简要讨论过这种属性，现在你已经越来越接近编写自己的控件了，是时候查看一下它们了。\n\
  \n## 实现依赖属性\n\n你可以将依赖属性添加到任何继承自 `System.Windows.DependencyObject` 的类中。该类位于 WPF 中许多类的继承层次中，包括所有的控件和\
  \ `UserControl`。\n\n要在类中实现依赖属性，你需要在类定义中添加一个类型为 `System.Windows.DependencyProperty`\
  \ 的公共静态成员。该成员的名称由你决定，但最佳实践是遵循命名约定 `<PropertyName>Property`：\n\n```\n public static\
  \ DependencyProperty MyStringProperty; \n```\n\n该属性被定义为静态的看起来可能很奇怪，因为你最终得到的是一个可以为类的每个实例唯一定义的属性。WPF\
  \ 属性框架会为你跟踪这些事项，所以你暂时不需要担心这个问题。\n\n你添加的成员必须使用静态的 `DependencyProperty.Register()`\
  \ 方法进行配置：\n\n```\n public static DependencyProperty MyStringProperty =\n   DependencyProperty.Register(…);\
  \ \n```\n\n该方法接受三个到五个参数，如表 15-1 所示（这些参数按顺序显示，前三个参数是强制性的）。\n\n| 参数 | 用法 |\n| ---\
  \ | --- |\n| `string name` | 属性的名称 |\n| `Type propertyType` | 属性的类型 |\n| `Type ownerType`\
  \ | 包含属性的类类型 |\n| `PropertyMetadata` `typeMetadata` | 额外的属性设置：属性的默认值以及用于属性更改通知和强制的回调方法\
  \ |\n| `ValidateValueCallback` `validateValueCallback` | 用于验证属性值的回调方法 |\n\n**表 15-1\
  \ :** Register( ) 方法的参数\n\n例如，你可以使用以下三个参数注册 `MyStringProperty` 依赖属性：\n\n```\n public\
  \ class MyClass : DependencyObject\n{\n   public static DependencyProperty MyStringProperty\
  \ =DependencyProperty.Register(\n      \"MyString\",\n      typeof(string),\n  \
  \    typeof(MyClass));\n} \n```\n\n你还可以包含一个 .NET 属性来直接访问依赖属性（尽管这并不是强制的，你很快就会看到）。然而，由于依赖属性被定义为静态成员，你不能使用与普通属性相同的语法。要访问依赖属性的值，你必须使用从\
  \ `DependencyObject` 继承的方法，如下：\n\n```\n public string MyString\n    {\n        get\
  \ { return (string)GetValue(MyStringProperty); }\n        set { SetValue(MyStringProperty,\
  \ value); }\n    } \n```\n\n在这里，`GetValue()` 和 `SetValue()` 方法分别获取和设置当前实例的 `MyStringProperty`\
  \ 属性的值。这两个方法是公共的，因此客户端代码可以直接使用它们操作依赖属性值。这就是为什么添加 .NET 属性来访问依赖属性不是强制的。\n\n如果你想为属性设置元数据，则必须使用派生自\
  \ `PropertyMetadata` 的对象，例如 `FrameworkPropertyMetadata`，并将此实例作为第四个参数传递给 `Register()`。`FrameworkPropertyMetadata`\
  \ 构造函数有 11 种重载，它们接受一个或多个表 15-2 所示的参数。\n\n| 参数类型 | 用法 |\n| --- | --- |\n| `object`\
  \ `defaultValue` | 属性的默认值。 |\n\n\n\n\n\n| `FrameworkPropertyMetadataOptions` `flags`\
  \ | 标志位（来自 `FrameworkPropertyMetadataOptions` 枚举）的组合，用于指定属性的额外元数据。例如，你可能使用 `AffectsArrange`\
  \ 来声明属性的更改可能会影响控件布局。这将导致属性发生变化时，窗口的布局引擎重新计算控件布局。请参考 MSDN 文档获取此处可用完整列表。 |\n| `PropertyChangedCallback`\
  \ `propertyChangedCallback` | 当属性值更改时使用的回调方法。 |\n| `CoerceValueCallback` `coerceValueCallback`\
  \ | 当属性值被强制转换（coerced）时使用的回调方法。 |\n| `bool` `isAnimationProhibited` | 指定此属性是否可以通过动画更改。\
  \ |\n| `UpdateSourceTrigger` `defaultUpdateSourceTrigger` | 当属性值进行数据绑定时，此属性根据 `UpdateSourceTrigger`\
  \ 枚举中的值决定更新数据源的时机。默认值为 `PropertyChanged`，这意味着只要属性发生变化，绑定源就会更新。这并不总是合适的——例如，`TextBox.Text`\
  \ 属性在此属性上使用了 `LostFocus` 值。这确保了绑定源不会过早更新。你也可以使用 `Explicit` 值来指定仅在请求时（通过调用派自 `DependencyObject`\
  \ 的类的 `UpdateSource()` 方法）才更新绑定源。 |\n\n**表 15-2：** FrameworkPropertyMetadata 构造函数的重载\n\
  \n使用 `FrameworkPropertyMetadata` 的简单示例是用它来设置属性的默认值：\n\n```\n public static DependencyProperty\
  \ MyStringProperty =\n\n         DependencyProperty.Register(\n\n         \"MyString\"\
  ,\n         typeof(string),\n         typeof(MyClass),\n         new FrameworkPropertyMetadata(\"\
  Default value\"));\n```\n\n到目前为止，你已经学习了三个指定的回调方法，分别用于属性更改通知、属性强制转换和属性值验证。这些回调与依赖属性本身一样，必须全部实现为公共静态方法。每个回调都有特定的返回类型和参数列表，你必须在回调方法中使用它们。\n\
  \n现在是时候回到正轨，继续开发 Karli Cards 的游戏客户端了。在接下来的“尝试一下”（Try It Out）中，你将创建一个可以表示应用程序中扑克牌的用户控件。\n\
  \n## 主窗口\n\n应用程序的主窗口是玩游戏的地方，因此它上只有几个控件。你将在这一部分构建游戏，但在开始之前，有几件事需要完成。你需要为游戏客户端窗口添加菜单，并将你已经构建的窗口绑定到菜单项。\n\
  \n### 菜单控件（Menu Control）\n\n大多数应用程序都包含某种类型的菜单和工具栏。两者都是实现同一目的的手段：为应用程序内容提供方便的导航。工具栏通常包含菜单提供的相同条目的子集，可以被视为菜单项的快捷方式。\n\
  \nVisual Studio 同时带了 `Menu` 和 `Toolbar` 控件。这里的示例展示了 `Menu` 控件的使用，但使用 `Toolbar` 的方法非常相似。\n\
  \n默认情况下，菜单项显示为水平条，你可以从中弹出一个项目列表。该控件是一个 `Items` 控件，因此更改内容中所包含的默认项目；但你通常会以某种形式使用 `MenuItems`，如下例所示。每个\
  \ `MenuItem` 都可以包含其他菜单项，你可以通过相互相互嵌套 `MenuItems` 来构建复杂的菜单，但你应该尽量保持菜单结构尽可能简单。\n\n\
  你可以使用多个属性来控制 `MenuItem` 的显示方式（参见 表 15-3）。\n\n| 属性 | 说明 |\n| --- | --- |\n| `Icon`\
  \ | 在控件左侧显示图标 |\n| `IsCheckable` | 在控件左侧显示一个 `CheckBox` |\n| `IsChecked` | 获取或设置\
  \ `MenuItem` 上 `CheckBox` 的值 |\n\n**表 15-3：** 显示 MenuItem 属性\n\n### 带有菜单的路由命令（Routed\
  \ Commands with Menus）\n\n*路由命令*之前在 第 14 章中简要讨论过，但现在你将第一次看到它们的实际运行。回想，这些命令类似于事件，因为它们在用户执行操作时会执行代码，并且可以返回一个指示它们在任何给定何时可以执行的状态。\n\
  \n你可能想要使用路由命令而不是事件的至少有三个原因：\n\n1. 引起事件发生的动作可以从应用程序的多个位置触发。\n2. UI 元素应仅在特定条件下可访问，例如，如果没有可保存的内容，则保存按钮应处于禁用。\n\
  3. 你想将处理事件的代码与后台代码文件（code-behind file）分离。\n\n如果这些场景中有任何符合你的需求，请考虑使用路由命令。在游戏的情况下，菜单中的某些项也可能从工具栏可用。此外，“保存”操作应该只在游戏进行时可用，并且它可能同时从菜单和工具栏可用。\n\
  \n# 整合一切（PUTTING IT ALL TOGETHER）\n\n在游戏开发的目前阶段，你已经有两个对话框、一个卡牌库和一个为游戏提供空白区域的主窗口。这仍然留下了大量工作，但基础已经打好，现在是开始编写游戏了。\n\
  \n### 重构领域模型（Domain Model）\n\n如所述，领域模型是描述游戏对象的代码。目前，你在 CardLib 中拥有了这些描述游戏对象的类：\n\
  \n* `Card`\n* `Deck`\n* `Rank`\n* `Suit`\n\n除了这些类之外，游戏还需要 `Player` 和 `ComputerPlayer`\
  \ 类，因此你将添加这些类。你还需要稍微修改 `Card` 和 `Deck` 类，以便它们在 Windows 应用程序中运行得更好。\n\n### 视图模型（ViewModel）\n\
  \n视图模型的目的是持有显示它的视图的状态。在 Karli Cards 的案例中，这意味着你已经有一个视图模型类：`GameOptions` 类。该类持有 `Options`\
  \ 和 `StartGame` 窗口的状态。目前，你无法从选项中获取选定的玩家，因此你必须添加该功能。游戏客户端窗口缺少视图模型，所以这是下一个任务。\n\n\
  执行游戏的视图模型必须反映游戏运行时的所有部分。游戏部分包括：\n\n* 当前玩家从中抽牌的牌组\n* 当前玩家可以选取而非抽牌来获取的一张牌\n* 当前玩家\n\
  * 参与的玩家数量\n\n视图模型还应该能够通知观察者更改，这意味着需要再次实现 `INotifyPropertyChanged`。\n\n除了这些能力之外，视图模型还应该提供一种启动新游戏的方法。你将通过为菜单创建一个新的路由命令来实现。该命令在视图模型中创建，但从视图中调用。\n\
  \n### 完成游戏\n\n\n\n\n\n你现在有了一个完整的游戏，但你无法运行它，因为游戏客户端中没有显示任何内容。为了让游戏运行，你需要两个额外的用户控件，它们将通过停靠面板（dock\
  \ panel）放置在游戏客户端上。\n\n这两个用户控件分别称为 `CardsInHand`（显示玩家的手牌）和 `GameDecks`（显示主牌堆和可用卡牌）。\n\
  \n## 练习\n\n1. 15.1 当前的游戏客户端存在一个问题。在“选项”（Options）对话框中，你可以设置计算机的技能水平。问题在于，单选按钮在下次打开“选项”对话框时不会更新以反映之前的选择。这部分部分是因为没有代码尝试更新它们，另一部分是因为没有从\
  \ `ComputerSkillLevel` 来的值转换器。请通过创建一个新的值转换器并设置 `IsChecked` 绑定（而不是使用当前使用的 `Checked`\
  \ 事件）来修复这个问题。\n\n   提示：你必须使用 `Converter` 绑定中的 `ConverterParameter` 部分。\n\n2. 15.2\
  \ 计算机在作弊，因此你可能也想允许玩家进行作弊。在“选项”对话框中，为计算机创建一个“使用开牌玩”的选项。\n\n3. 15.3 在游戏客户端底部创建一个状态栏，显示游戏的当前状态。练习答案可以在附录中找到。\n\
