  练习答案可以在附录中找到。\n\n![image](img/Image0002.gif) 本章所学\n\n| **主题** | **核心概念** |\n| ---\
  \ | --- |\n| 对象和类 | 对象是 OOP 应用程序的构建模块。类是用于实例化对象的类型定义。对象可以包含数据并暴露其他代码可以使用的操作。数据可以通过属性对外部代码可见，操作可以通过方法对外部代码可见。属性和方法统称为类成员。属性可以允许读取、写入或两者都有。类成员可以是公共（对所有代码可见）或私有（仅对类定义内部的代码可见）。在\
  \ .NET 中，一切都是对象。 |\n| 对象生命周期 | 对象通过调用其构造函数来实例化。当对象不再需要时，通过执行其析构函数来销毁。为了清理对象，通常需要手动释放它。\
  \ | | 实例成员仅对类的实例可用。静态成员仅直接通过类定义可用，与实例无关。 |\n| 接口 | 接口是可以在类上实现的公共属性和方法的集合。实例类型变量可以赋值任何实现了该接口的类的对象值。此时，只有接口定义的成员可以通过该变量访问。\
  \ |\n\n\n\n\n\n| 继承 (Inheritance) | 继承允许一个类定义派自另一个类。一个类继承自其父类的成员，且只能有一个父类。子类无法访问父类中的私有成员，但可以定义保护成员，这些成员仅在该类内部或派生自该类的类可用。子类可以重写在父类中定义为虚方法的成员。所有类都有一个以\
  \ `System.Object` 结尾的继承链，它在 C# 中有一个别名为 `object`。 |\n| 多态 (Polymorphism) | 从派生类实例化的所有对象都可以被视为其父类的实例。\
  \ | |\n| 对象关系和特性 | 对象可以包含其他对象，也可以表示其他对象的集合。为了在表达式中操作对象，你通常需要通过运算符重载来定义运算符如何与对象交互。对象可以暴露由于某些内部过程触发的事件，客户端代码可以通过提供事件处理器来响应这些事件。\
  \ |\n\n# 9 定义类\n\n## C# 中的类定义\n\nC# 使用 `class` 关键字来定义类：\n\n```\n\n class MyClass\n\
  {\n   // 类成员。\n} \n```\n\n这段代码定义了一个名为 `MyClass` 的类。一旦定义了类，你就可以在项目中可以访问该定义的任何地方实例化它。默认情况下，类被声明为\
  \ `internal`，这意味着只有当前项目中的代码可以访问它们。你可以使用 `internal` 访问修饰符关键字显式地指定（尽管你不必这样做）：\n\n\
  ```\n internal class MyClass\n{\n   // 类成员。\n} \n```\n\n或者，你可以指定该类是公共的（public），并且也应该被其他项目中的代码访问。为此，你使用\
  \ `public` 关键字：\n\n```\n public class MyClass\n{\n   // 类成员。\n} \n```\n\n除了这两个访问修饰符关键字外，你还可以指定该类是\
  \ `abstract`（抽象的，不能实例化，只能被继承，且可以有抽象成员）或 `sealed`（密封的，不能被继承）。要实现这一点，你使用这两个互斥关键字之一：`abstract`\
  \ 或 `sealed`。抽象类的声明如下：\n\n```\n public abstract class MyClass\n{\n   // 类成员，可以是抽象的。\n\
  } \n```\n\n在这里，`MyClass` 是一个公共抽象类，而内部抽象类也是可能的。\n\n密封类的声明如下：\n\n```\n public sealed\
  \ class MyClass\n{\n   // 类成员。\n} \n```\n\n与抽象类一样，密封类可以是公共的或内部的。\n\n继承也可以在类定义中指定。你只需要在类名后跟一个冒号，然后是基类名：\n\
  \n```\n public class MyClass : MyBase\n{\n   // 类成员。\n} \n```\n\n在 C# 类定义中只允许一个基类；如果你继承自一个抽象类，你必须实现所有继承的抽象成员（除非该派生类也是抽象的）。\n\
  \n编译器不允许派生类的访问权限高于其基类。这意味着 `internal` 类可以继承 `public` 基类，但 `public` 类不能继承 `internal`\
  \ 基类。这段代码是合：\n\n```\n public class MyBase\n{\n   // 类成员。\n}\n\ninternal class MyClass\
  \ : MyBase\n{\n   // 类成员。\n} \n```\n\n以下代码将无法编译：\n\n```\n internal class MyBase\n\
  {\n   // 类成员。\n}\n\npublic class MyClass : MyBase\n{\n   // 类成员。\n} \n```\n\n如果没有使用基类，则类仅继承自基类\
  \ `System.Object`（它在 C# 中别名为 `object`）。最终，所有类在继承层次结构的根部都是 `System.Object`。你稍后会更详细地查看这个基础类。\n\
  \n除了以此方式指定基类外，你还可以在冒号字符之后指定支持的接口。如果指定了基类，它必须是冒号后的第一个项，之后再指定接口。如果没有指定基类，则直接在冒号后指定接口。必须使用逗号来分隔基类名（如果有）和接口名称。\n\
  \n例如，你可以按照如下方式为 `MyClass` 添加一个接口：\n\n```\n public class MyClass : IMyInterface\n\
  {\n   // 类成员。\n} \n```\n\n在任何支持该接口的类中，必须实现所有接口成员，尽管如果你不想对给定的接口成员执行任何操作，可以提供一个“空”实现（不含功能代码），并且你可以在抽象类中将接口成员实现为抽象的。\n\
  \n以下声明是无效的，因为基类 `MyBase` 不是继承列表中的第一项：\n\n```\n public class MyClass : IMyInterface,\
  \ MyBase\n{\n   // 类成员。\n} \n```\n\n指定基类和接口的正确方式如下：\n\n```\n public class MyClass\
  \ : MyBase, IMyInterface\n{\n   // 类成员。\n} \n```\n\n记住，多个接口是可能的，所以以下内容也是有效的：\n\n\
  ```\n public class MyClass : MyBase, IMyInterface, IMySecondInterface\n{\n   //\
  \ 类成员。\n} \n```\n\n表 9-1 显示了类定义允许的访问修饰符组合。\n\n| **修饰符** | **描述** |\n| --- | ---\
  \ |\n| 无或 `internal` | 仅在当前项目内可见。 |\n| `public` | 处处可访问。 |\n| `abstract` 或 `internal`\
  \ | 仅在当前项目内可见，不能实例化，只能继承。 |\n| `public` `abstract` | 处处可访问，不能实例化，只能继承。 |\n| `sealed`\
  \ 或 `internal` | 仅在当前项目内可见，不能实例化，只能继承。 |\n| `public` `sealed` | 处处可访问，不能实例化，只能继承。\
  \ |\n\n**表 9-1](#text00012.html_R09-0001)**：类定义的访问修饰符\n\n### 接口定义\n\n接口的声明方式与类相似，但使用\
  \ `interface` 关键字而不是 `class`：\n\n```\n interface IMyInterface\n{\n   // 接口成员。\n\
  } \n```\n\n访问修饰符关键字 `public` 和 `internal` 的用法相同；与类一样，接口默认是内部的。要使接口公开可见，你必须使用 `public`\
  \ 关键字：\n\n```\n public interface IMyInterface\n{\n   // 接口成员。\n} \n```\n\n不允许使用\
  \ `abstract` 和 `sealed` 关键字，因为这两个修饰符在接口范围内没有意义（它们不包含实现，因此无法直接实例化，且必须是可继承的才有用）。\n\
  \n接口的指定方式与类继承相似。这里的主要区别是可以使用多个基接口，如下：\n\n```\n interface IMyInterface : IMyBaseInterface,\
  \ IMyBaseInterface2\n{\n   // 接口成员。\n}\n```\n\n接口不是类，因此不继承自 `System.Object`。然而，`System.Object`\
  \ 的成员可以通过接口类型变量可用，纯粹是为了方便。此外，正如讨论过的，无法以与类的方式实例化接口。下面的“尝试一下”提供了一些类定义的示例，以及使用它们的代码。\n\
  \n## SYSTEM.OBJECT\n\n由于所有类都继承自 `System.Object`，因此所有类都可以访问该类的保护和公共成员。因此，值得查看一下那里提供的内容。`System.Object`\
  \ 包含了表 9-2 中描述的方法。\n\n| **方法** | **返回类型** | **虚方法** | **静态** | **描述** |\n| --- |\
  \ --- | --- | --- | --- |\n\n\n\n\n\n| 方法 | 返回类型 | 虚拟 | 重写 | 描述 |\n| :--- | :---\
  \ | :--- | :--- | :--- |\n| `Object()` | 无 | 否 | 否 | `System.Object` 类型的构造函数。由派生类型的构造函数自动调用。\
  \ |\n| `~Object()`（也称为 `Finalize()`——参见下一节） | 无 | 否 | 否 | `System.Object` 类型的析构函数。由派生类型的析构函数自动调用；不能手动调用。\
  \ |\n| `Equals(object)` | `bool` | 是 | 否 | 比较调用此方法的对象与另一个对象，如果它们相等则返回 `true`。默认实现检查\
  \ `object` 参数是否引用的是同一个对象（因为对象是引用类型）。如果你想以不同的方式比较对象（例如，比较两个对象的状态），可以重写此方法。 |\n| `Equals(object,\
  \ object)` | `bool` | 否 | 是 | 比较传递的两个对象并检查它们是否相等。此检查是使用 `Equals(object)` 方法进行的。如果两个对象都是空引用，则此方法返回\
  \ `true`。 |\n| `ReferenceEquals(object, object)` | `bool` | 否 | 是 | 比较传递的两个对象并检查它们是否引用同一个实例。\
  \ |\n| `ToString()` | `string` | 是 | 否 | 返回与对象实例相对应的字符串。默认情况下，这是类类型的全限定名，但可以重写它以提供适用于该类类型的实现。\
  \ |\n| `MemberwiseClone()` | `object` | 否 | 否 | 通过创建新对象实例并复制成员来复制对象。这种成员复制不会产生这些成员的新实例。新对象的任何引用类型成员都指向与原始类相同的对象。此方法是受保护的，因此只能在类内部或派生类中使用。\
  \ |\n| `GetType()` | `System.Type` | 否 | 否 | 以 `System.Type` 对象的形式返回对象的类型。 |\n|\
  \ `GetHashCode()` | `int` | 是 | 否 | 在需要的地方作为对象的哈希函数使用。哈希函数返回一个以某种压缩形式标识对象状态的值。 |\n\
  \n**表 9-2:** System.Object 的方法\n\n这些是 .NET Framework 中对象类型必须支持的基本方法，尽管你可能永远不会使用其中某些（或者你只在特殊情况下使用它们，例如\
  \ `GetHashCode()`）。\n\n当你使用多态时，`GetType()` 非常有用，因为它允许你根据对象的类型对其执行不同的操作，而不是像通常那样对所有对象执行相同的操作。例如，如果你有一个接受\
  \ `object` 类型参数的函数（这意味着你可以向它传递几乎任何内容），当遇到某些对象时，你可能会执行额外的任务。通过结合 `GetType()` 和 `typeof`（一种将类名转换为\
  \ `System.Type` 对象的 C# 运算符），你可以执行如下所示的比较：\n\n```csharp\nif (myObj.GetType() == typeof(MyComplexClass))\n\
  {\n   // myObj 是 MyComplexClass 类的实例。\n}\n```\n\n返回的 `System.Type` 对象的能力远比此多得多，但这里仅涵盖了这一点。重写\
  \ `ToString()` 方法也非常有用，特别是当对象的内容可以用单个人类可读的字符串轻松表示时的情况。你将在随后的章节中反复看到这些 `System.Object`\
  \ 方法，因此你将根据需要学习更多细节。\n\n## 构造函数和析构函数\n\n在 C# 中定义类时，通常没有必要定义相关的构造函数和析构函数，因为如果你没有提供它们，编译器在构建代码时会自动为你添加它们。然而，如果需要，你可以提供自己的构造函数，以便分别对你的对象进行初始化和清理。\n\
  \n你可以使用以下语法为类添加简单的构造函数：\n\n```csharp\nclass MyClass\n{\n   public MyClass()\n  \
  \ {\n      // 构造函数代码。\n   }\n}\n```\n\n此构造函数的名称与包含它的类名相同，没有参数（使其成为该类的默认构造函数），并且是公共的，因此可以使用此构造函数实例化类对象（有关此点的更多信息请参阅第\
  \ 8 章）。\n\n你还可以使用私有的默认构造函数，它通常用于仅包含静态成员的类。将构造函数设置为私有意味着无法使用该构造函数创建此类的实例（它是不可创建的——再次，参见第\
  \ 8 章的讨论）：\n\n```csharp\nclass MyClass\n{\n   private MyClass()\n   {\n      //\
  \ 构造函数代码。\n   }\n}\n```\n\n最后，你可以以类似的方式为你的类添加非默认构造函数，只需提供参数即可：\n\n```csharp\nclass\
  \ MyClass\n{\n   public MyClass()\n   {\n      // 默认构造函数代码。\n   }\n   public MyClass(int\
  \ myInt)\n   {\n      // 非默认构造函数代码（使用 myInt）。\n   }\n}\n```\n\n你可以提供无限数量的构造函数（直到内存耗尽或没有不同的参数集，所以可能“几乎无限”更合适）。\n\
  \n析构函数的声明语法略有不同。.NET 中使用的析构函数（由 `System.Object` 类提供）称为 `Finalize()`，但这不是你用于声明析构函数的名称。你不是重写\
  \ `Finalize()`，而是使用以下代码：\n\n```csharp\nclass MyClass\n{\n   ~MyClass()\n   {\n \
  \     // 析构函数体。\n   }\n}\n```\n\n因此，类的析构函数通过类名声明（与构造函数相同），但带有波浪号 (`~`)。析构函数代码在垃圾回收时执行，以便你释放资源。在调用析构函数后，也会调用基类的析构函数，包括对\
  \ `System.Object` 根类 `Finalize()` 的调用。这种技术使得 .NET Framework 能够确保这种情况发生，因为重写 `Finalize()`\
  \ 将需要显式执行基类调用，这可能是危险的（你将在下一章学习）。\n\n### 构造函数执行顺序\n\n如果你在类的构造函数中执行多个任务，将这些代码集中在一个处可能会很有帮助，这与第\
  \ 6 章所示将代码拆分为函数的效果相同。你可以使用方法来实现此（参见第 10 章），但 C# 提供了一个非常好的替代方案。你可以配置任何构造函数在执行自己的代码之前调用另一个构造函数。\n\
  \n首先，你只需要仔细观察实例化类实例时默认发生了什么。除了前面提到的有助于初始化代码的集中化之外，这本身也值得了解。在开发过程中，对象的行为往往由于构造函数调用错误而不符合预期——通常是由于你的类继承层次中的某个基类实例化不正确，或者没有向基类构造函数提供适当的信息。理解对象生命周期这一阶段发生了什么，可以让你更容易解决这类问题。\n\
  \n要实例化派生类，必须先实例化其基类。要实例化该基类，其自身的基类也必须被实例化，一直追溯到 `System.Object`（所有类的根）。结果，无论你使用哪个构造函数实例化类，`System.Object.Object()`\
  \ 总是第一个被调用的。\n\n\n\n\n无论你在派生类中使用哪种构造函数（默认构造函数或非默认构造函数），除非另有指定，否则都将使用基类的默认构造函数。（稍后我们将看到如何更改此行为。）这里有一个短的示例说明了执行顺序。考虑以下对象层次：\n\
  \n```cs\n public class MyBaseClass\n{\n   public MyBaseClass()\n   {\n   }\n   public\
  \ MyBaseClass(int i)\n   {\n   }\n}\n\npublic class MyDerivedClass : MyBaseClass\n\
  {\n   public MyDerivedClass()\n   {\n   }\n   public MyDerivedClass(int i)\n   {\n\
  \   }\n   public MyDerivedClass(int i, int j)\n   {\n   }\n} \n```\n\n你可以按照如下方式实例化\
  \ `MyDerivedClass`：\n\n```cs\n MyDerivedClass myObj = new MyDerivedClass(); \n```\n\
  \n在这种情况下，将发生以下事件序列：\n\n* 执行 `System.Object.Object()` 构造函数。\n* 执行 `MyBaseClass.MyBaseClass()`\
  \ 构造函数。\n* 执行 `MyDerivedClass.MyDerivedClass()` 构造函数。\n\n或者，你可以使用以下代码：\n\n```cs\n\
  \ MyDerivedClass myObj = new MyDerivedClass(4); \n```\n\n序列如下：\n\n* 执行 `System.Object.Object()`\
  \ 构造函数。\n* 执行 `MyBaseClass.MyBaseClass()` 构造函数。\n* 执行 `MyDerivedClass.MyDerivedClass(int\
  \ i)` 构造函数。\n\n最后，你可以使用这个：\n\n```cs\n MyDerivedClass myObj = new MyDerivedClass(4,\
  \ 8); \n```\n\n结果是以下序列：\n\n* 执行 `System.Object.Object()` 构造函数。\n* 执行 `MyBaseClass.MyBaseClass()`\
  \ 构造函数。\n* 执行 `MyDerivedClass.MyDerivedClass(int i, int j)` 构造函数。\n\n这套系统在大多数情况下运行良好良好，但有时你可能希望对发生的事件有更多的控制权。例如，在最后一个实例化示例中，你可能希望拥有以下序列：\n\
  \n* 执行 `System.Object.Object()` 构造函数。\n* 执行 `MyBaseClass.MyBaseClass(int i)` 构造函数。\n\
  * 执行 `MyDerivedClass.MyDerivedClass(int i, int j)` 构造函数。\n\n使用此序列，你可以将使用 `int i`\
  \ 参数的代码放在 `MyBaseClass(int i)` 中，这意味着 `MyDerivedClass(int i, int j)` 构造函数需要的工作会更少——它只需要处理\
  \ `int j` 参数。（这假设 `int i` 参数在两种情况下具有相同的含义，这并不总是如此的；但在实践中，通过这种安排，通常是这样的。）如果你需要，C#\
  \ 允许你指定这种种行为。\n\n要做到这一点，你可以使用*构造函数初始化器*，它由放置在方法定义中冒号后面的代码组成。例如，你可以在派生类的构造函数定义中指定使用的基类构造函数，如下：\n\
  \n```cs\n public class MyDerivedClass : MyBaseClass\n{\n   …\n   public MyDerivedClass(int\
  \ i, int j) : base(i)\n   {\n   }\n} \n```\n\n`base` 关键字引导 .NET 实例化过程使用具有指定参数的基类构造函数。在这里，你使用的是单个\
  \ `int` 参数（其值是传递给 `MyDerivedClass` 构造函数的参数 `i` 的值），因此将使用 `MyBaseClass(int i)`。这样做意味着将不会调用\
  \ `MyBaseClass`，为你提供了此示例之前列出的事件序列——这正是你想要的。\n\n你还可以使用此关键字为基类构造函数指定字面量，或许使用 `MyDerivedClass`\
  \ 的默认构造函数来调用 `MyBaseClass` 的非默认构造函数：\n\n```cs\n public class MyDerivedClass : MyBaseClass\n\
  {\n   public MyDerivedClass() : base(5)\n   {\n   }\n   …\n} \n```\n\n这为你提供了以下序列：\n\
  \n* 执行 `System.Object.Object()` 构造函数。\n* 执行 `MyBaseClass.MyBaseClass(int i)` 构造函数。\n\
  * 执行 `MyDerivedClass.MyDerivedClass()` 构造函数。\n\n除了这个 `base` 关键字，你还可以使用另一个关键字作为构造函数初始化器：`this`。该关键字指示\
  \ .NET 实例化过程在调用指定的构造函数之前使用当前类上的非默认构造函数：\n\n```cs\n public class MyDerivedClass :\
  \ MyBaseClass\n{\n   public MyDerivedClass() : this(5, 6)\n   {\n   }\n   …\n  \
  \ public MyDerivedClass(int i, int j) : base(i)\n   {\n   }\n} \n```\n\n在这里，使用 `MyDerivedClass.MyDerivedClass()`\
  \ 构造函数为你提供了以下序列：\n\n* 执行 `System.Object.Object()` 构造函数。\n* 执行 `MyBaseClass.MyBaseClass(int\
  \ i)` 构造函数。\n* 执行 `MyDerivedClass.MyDerivedClass(int i, int j)` 构造函数。 (注：此处原文存在大量重复段落，翻译已按逻辑精简并处理)\n\
  \n这套系统在大多数情况下运行良好良好，但有时你可能希望对发生的事件有更多的控制权。例如，在最后一个实例化示例中，你可能希望拥有以下序列：\n\n* 执行 `System.Object.Object()`\
  \ 构造函数。\n* 执行 `MyBaseClass.MyBaseClass(int i)` 构造函数。\n* 执行 `MyDerivedClass.MyDerivedClass(int\
  \ i, int j)` 构造函数。\n\n使用此序列，你可以将使用 `int i` 参数的代码放在 `MyBaseClass(int i)` 中，这意味着 `MyDerivedClass(int\
  \ i, int j)` 构造函数需要的工作会更少——它只需要处理 `int j` 参数。（这假设 `int i` 参数在两种情况下具有相同的含义，这并不总是如此的；但在实践中，通过这种安排，通常是这样的。）如果你需要，C#\
  \ 允许你指定这种种行为。\n\n要做到这一点，你可以使用*构造函数初始化器*，它由放置在方法定义中冒号后面的代码组成。例如，你可以在派生类的构造函数定义中指定使用的基类构造函数，如下：\n\
  \n```cs\n public class MyDerivedClass : MyBaseClass\n{\n   …\n   public MyDerivedClass(int\
  \ i, int j) : base(i)\n   {\n   }\n} \n```\n\n`base` 关键字引导 .NET 实例化过程使用具有指定参数的基类构造函数。在这里，你使用的是单个\
  \ `int` 参数（其值是传递给 `MyDerivedClass` 构造函数的参数 `i` 的值），因此将使用 `MyBaseClass(int i)`。这样做意味着将不会调用\
  \ `MyBaseClass`，为你提供了此示例之前列出的事件序列——这正是你想要的。\n\n你还可以使用此关键字为基类构造函数指定字面量，或许使用 `MyDerivedClass`\
  \ 的默认构造函数来调用 `MyBaseClass` 的非默认构造函数：\n\n```cs\n public class MyDerivedClass : MyBaseClass\n\
  {\n   public MyDerivedClass() : base(5)\n   {\n   }\n   …\n} \n```\n\n这为你提供了以下序列：\n\
  \n* 执行 `System.Object.Object()` 构造函数。\n* 执行 `MyBaseClass.MyBaseClass(int i)` 构造函数。\n\
  * 执行 `MyDerivedClass.MyDerivedClass()` 构造函数。\n\n除了这个 `base` 关键字，你还可以使用另一个关键字作为构造函数初始化器：`this`。该关键字指示\
  \ .NET 实例化过程在调用指定的构造函数之前使用当前类上的非默认构造函数：\n\n```cs\n public class MyDerivedClass :\
  \ MyBaseClass\n{\n   public MyDerivedClass() : this(5, 6)\n   {\n   }\n   …\n  \
  \ public MyDerivedClass(int i, int j) : base(i)\n   {\n   }\n} \n```\n\n## VISUAL\
  \ STUDIO 中的工具\n\n由于面向对象（OOP）是 .NET 框架的一个基本方面，Visual Studio 提供了一些工具来辅助 OOP 开发。\n\n\
  ### 类视图 (Class View)\n\n窗口分为两个主要部分；底部部分显示类型的成员。注意类视图显示了应用程序的层次结构，并让你一目看出类的特征。\n\n\
  可以通过 `视图 > 类视图` 或按下 `Ctrl+Alt+C` 打开类视图。\n\n在类视图中，你可以看到解决方案中所有的类，以及接口、结构体和枚举。你可以展开每个类以查看其成员，如方法、属性和事件。双击成员将跳转到其定义处。你还可以右键点击成员以访问各种命令，例如“查找所有引用”。\n\
  \n此处可以使用许多符号，包括下表所示的符号：\n\n| **图标** | **含义** | **图标** | **含义** | **图标** | **含义**\
  \ |\n| --- | --- | --- | --- | --- | --- |\n| | 项目 | 属性 | 事件 | | |\n| | 命名空间 | 字段\
  \ | 委托 | | |\n| | 类 | 结构体 | 程序集 | | |\n| | 接口 | 方法 | | | |\n| | 枚举 | 枚举项 | | | |\n\
  \n**[表 9-3]:** 类视图图标\n\n其中一些符号用于类以外的类型定义，例如枚举和结构体类型。\n\n\n\n\n部分条目下方可能会带有其他符号，表示其访问级别（公共条目不显示符号）。这些条目列在\
  \ 表 9-4 中。\n\n| **图标** | **含义** | **图标** | **含义** | **图标** | **含义** |\n| --- | ---\
  \ | --- | --- | --- | --- |\n| ![No art work is provided.](img/Image00111.jpg) |\
  \ 私有 | ![No art work is provided.](img/Image00112.jpg) | 受保护 | ![No art work is\
  \ provided.](img/Image00113.jpg) | 内部 |\n\n表 9-4 ：**附加类视图图标**\n\n它不使用任何符号来表示抽象、密封或虚拟条目。\n\
  \n除了在这里查看这些信息外，你还可以访问其中许多项目的相关代码。双击某项，或右键点击并选择 `Go To Definition`（转到定义），将直接带你进入项目中定义该项的代码（如果可用）。如果代码不可用（例如无法访问的基类型中的代码，如\
  \ `System.Object`），你可以选择 `Browse Definition`（浏览定义），这将带你进入对象浏览器（Object Browser）视图（在下一节中描述）。\n\
  \n图 9-3 中出现的另一个条目是“项目引用”（Project References）。这让你能够看到你的项目引用了哪些程序集，在这种情况下，它包括 `mscorlib`\
  \ 和 `System` 中的核心 .NET 类型、`System.Data` 中的数据访问类型以及 `System.Xml` 中的 XML 操作类型。这里的引用可以展开，显示出这些程序集所包含的命名空间和类型。\n\
  \n你可以通过右键点击某项并选择 `Find All References`（查找所有引用）来查找代码中类型和成员的出现位置；搜索结果列表显示在 `Find Symbol\
  \ Results`窗口中，该窗口以标签页的形式出现在 `Error List`（错误列表）显示区域的底部。你还可以使用类视图窗口重命名项。如果你这样做，系统将允许你重命名代码中任何位置该项的引用。这意味着你不再为类名的拼写错误找借口了，因为你可以随随地更改它们！\n\
  \n此外，你可以通过名为 `Call Hierarchy`（调用层次结构）的视图导航代码，可以通过类视图窗口中的 `View Call Hierarchy`（查看调用层次结构）右键菜单访问。此功能对于查看类成员之间如何交互非常有帮助，你将在下一章学习它。\n\
  \n### 对象浏览器 (Object Browser)\n\n对象浏览器是类视图窗口的扩展版本，允许你查看项目可用的其他类，甚至是外部类。你可以自动进入它（例如在上一节中提到的情况下），也可以通过\
  \ `View ![image](img/Image00008.gif) Object Browser`（查看对象浏览器）手动进入。该视图出现在主窗口中，你可以像使用类视图窗口一样进行浏览。\n\
  \n此窗口提供了与类视图相同的信息，但显示了更多的 .NET 类型。当选择某项时，你会在第三个窗口中获得有关它的信息，如 图 9-4 所示。\n\n![Screenshot\
  \ illustration showing how when an item is selected, one also gets information about\
  \ it in a third window.](img/Image00114.jpg)\n\n**图 9-4**\n\n在这里，选中了 `Console` 类的\
  \ `ReadKey()` 方法。（`Console` 位于 `mscorlib` 程序集的 `System` 命名空间中。）右下角的信息窗口显示了该方法的签名、该方法所属的类以及方法功能的摘要。当你探索\
  \ .NET 类型，或者只是想回想起特定类可以做什么时，这些信息会非常有用。\n\n此外，你可以在自己创建的类型中使用此信息窗口。对 Ch09Ex01 中之前创建的代码进行以下更改：\n\
  \n```\n /// <summary>\n\n   /// 此类包含我的程序！\n\n   /// </summary>\n\n   class Program\n\
  \   {\n      static void Main(string[] args)\n      {\n         MyComplexClass myObj\
  \ = new MyComplexClass();\n         WriteLine(myObj.ToString());\n         ReadKey();\n\
  \      }\n   } \n```\n\n返回对象浏览器并导航到项目 Ch09Ex01 中的 `Program` 类。摘要反映在信息窗口中。这是一个 XML\
  \ 文档的示例，本书没有涵盖这个主题，但当你有空时它非常值得学习。\n\n### 添加类 (Adding Classes)\n\nVisual Studio 包含了可以加速某些常用任务的工具，其中一些适用于面向对象编程（OOP）。这些工具之一的新建项向导（Add\
  \ New Item Wizard）允许你以最少的输入量向项目添加新类。\n\n可以通过项目 ![image](img/Image00008.gif) Add\
  \ New Item…（新建项…）菜单项，或在解决方案管理器窗口中右键点击项目并选择相应的项来访问此工具。无论何种方式，都会出现对话框，让你选择要添加的项。要添加类，在模板窗口中选择\
  \ `Class` 项（如 图 9-5 所示），为包含该类的文件提供文件名，然后点击添加。创建的类将根据你提供的文件名命名。\n\n![Screenshot illustration\
  \ instructing to provide a filename for the file that will contain the class, and\
  \ then click Add.](img/Image00115.jpg)\n\n**图 9-5**\n\n在本章早之前的“尝试一下”（Try It Out）中，你手动向\
  \ `Program.cs` 文件添加了类定义。通常情况下，将类保持在单独的文件中更容易跟踪。当 Ch09Ex01 项目打开状态时，在添加项对话框中输入信息，将在\
  \ `MyNewClass.cs` 中生成以下代码：\n\n```\nusing System;\n\nusing System.Collections.Generic;\n\
  \nusing System.Linq;\n\nusing System.Text;\n\nusing System.Threading.Tasks;\n\n\
  namespace Ch09Ex01\n\n{\n   class MyNewClass\n   {\n\n   }\n\n}\n```\n\n此类 `MyNewClass`\
  \ 定义在与入口点类 `Program` 相同的命名空间中，因此你可以像定义在同一文件中一样在代码中使用它。如代码所示，为你生成的类不包含构造函数。记住，如果类定义没有包含构造函数，那么编译器会在编译代码时添加一个默认构造函数。\n\
  \n### 类图 (Class Diagrams)\n\nVisual Studio 的一个你尚未查看过的强大功能是根据代码生成类图并使用它们修改项目的功能。Visual\
  \ Studio 中的类图编辑器允许你轻松生成代码的类 UML 图。你将在下面的“尝试一下”中通过为早先创建的 Ch09Ex01 项目生成类图来看到这一功能。\n\
  \n## 类库项目 (Class Library Projects)\n\n除了将类放在项目中的单独文件中外，你还可以将它们放在完全独立的项目中。一个仅包含类（以及其他相关类型定义，但没有入口点）的项目被称为*类库*。\n\
  \n类库项目编译为 `.dll` 程序集，你可以通过从其他项目添加引用来访问其内容（这些项目可能属于同一个解决方案，但不必是）。这扩展了对象所提供的封装性，因为类库可以在不影响使用它们项目的情况下修订和更新。这意味着你可以轻松升级由类提供的服务（这可能会影响多个客户端应用程序）。\n\
  \n下面的“尝试一下”提供了一个类库项目以及一个使用其包含的类的独立项目示例。\n\n\n\n\n\n本章演示了你如何创建接口和抽象类（目前不包含成员——你将在第\
  \ 10 章 中遇到它们）。这两种类型在许多方面都是相似的，因此了解何时应该使用其中一种技术而非另一种是非常有用的。\n\n### 相似点与区别\n\n首先是相似点：抽象类和接口都可以包含供派生类继承的成员。接口和抽象类都不能直接实例化，但可以声明这些类型的变量。如果你这样做，就可以使用多态性将继承自这些类型的对象赋值给这些类型的变量。在两种情况下，你都可以通过这些变量使用这些类型的成员，尽管你无法直接访问派生对象中的其他成员。\n\
  \n现在来看区别：派生类只能继承自单个基类，这意味着只能直接继承一个抽象类（尽管继承链中可能包含多个抽象类）。相反，类可以使用任意数量的接口，但这并不会产生巨大差异——通过这两种方法中的任何一种都可以实现相似的结果。这只是使用接口处理问题的方式略有不同。\n\
  \n抽象类可以同时拥有`抽象成员`（这些成员没有代码体，除非派生类本身也是抽象的，否则必须在派生类中实现）和`非抽象成员`（这些成员拥有代码体，并且可以是虚的，以便它们在派生类中被重写）。相反，`接口成员`必须在使用接口的类中实现——它们不拥有代码体。此外，接口成员定义上是公共的（因为它们旨在供外部使用），但抽象类的成员也可以是私有的（只要它们不是抽象的）、受保护的、内部的或受保护的内部的（其中受保护的内部的成员仅可以从应用程序内部的代码或从派生类访问）。此外，接口不能包含字段、构造函数、析构函数、静态成员或常量。\n\
  \n### 实际示例\n\n例如，考虑一个表示火车的对象族。基类 `Train` 包含了火车的的核心定义，例如轮距和引擎类型（可以是蒸汽式、柴油式等）。然而，该类是抽象的，因为不存在所谓的“通用型”火车。要创建一个“真实的”火车，你需要添加特定于火车的特征。例如，你派生了如\
  \ `PassengerTrain`（客车）、`FreightTrain`（货运火车）和 `424DoubleBogey` 等类，如图 9-11\n\n**图\
  \ 9-11**\n\n一组汽车对象也可以以相同的方式定义，具有一个抽象基类 `Car` 和诸如 `Compact`（紧凑型）、`SUV` 和 `PickUp`（皮卡）等派生类。`Car`\
  \ 和 `Train` 甚至可以派自一个共同的基类，例如 `Vehicle`（车辆）。这在图 9-12\n\n**图 9-12**\n\n层次结构中较低的某些类可以因为其目的而共享特征，而不仅仅是因为它们派自什么。例如，`PassengerTrain`、`Compact`、`SUV`\
  \ 和 `Pickup` 都能运载乘客，因此它们可能拥有一个 `IPassengerCarrier` 接口。`FreightTrain` 和 `Pickup`\
  \ 能够运载重物，因此它们可能都拥有一个 `IHeavyLoadCarrier` 接口。这在图 9-13 中有所插图。\n\n![PassengerTrain、FreightTrain、Compact、SUV\
  \ 和 Pickup 的示意图，显示它们可能拥有 IHeavyLoadCarrier 接口（此处原文应涵盖多个接口）。](img/Image00123.jpg)\n\
  \n**图 9-13**\n\n通过在分配具体细节之前这样拆解对象系统，你可以清楚地看到在什么情况下应该使用抽象类而不是接口，反之亦然。这个示例的结果无法仅使用接口或仅使用抽象继承来实现。\n\
  \n## 结构类型\n\n第 8 章提到结构和类非常相似，但结构是值类型，而类是引用类型。这对你来说实际上意味着什么？嗯，查看此问题的简单方法是通过示例，例如下面的“试一试”（Try\
  \ It Out）。\n\n## 浅拷贝与深拷贝\n\n通过值而不是引用将对象从一个变量复制到另一个（即像处理结构一样复制它们）可能是非常复杂的。因为单个对象可以包含指向许多其他对象的引用（例如字段成员等），可能会涉及大量的处理。简单地将每个成员从一个对象复制到另一个对象可能不起行，因为这些成员中的某些本身就是引用类型。.NET\
  \ Framework 考虑到了这一点。你可以通过继承自 `System.Object` 的 `MemberwiseClone()` 方法创建一个对象的简单拷贝，其中每个成员都被复制到新对象中。这是一个受保护的方法，但很容易在对象上定义一个公共方法来调用它。这种复制方法被称为浅拷贝，因为新对象中的引用成员指向相同的对象，这在许多情况下是不理想的。如果你想通过复制值而不是引用来创建成员的新实例，你需要执行深拷贝。有一个接口可以让你标准地进行深拷贝：`ICloneable`。如果你使用此接口，就必须实现它包含的唯一方法\
  \ `Clone()`。该方法返回 `System.Object` 类型。你可以使用任何喜欢的处理方式来获取此对象，这意味着如果这种行为不是强制性的，许多人建议避免它。相反，他们建议实现自己的深拷贝方法。你可以在第\
  \ 11 章中详细查看此接口。\n\n## 练习\n\n1.  9.1 下面代码有什么问题？\n\n    ```cpp\n    public sealed\
  \ class MyClass\n    {\n       // 类成员。\n    }\n    public class myDerivedClass :\
  \ MyClass\n    {\n       // 类成员。\n    }\n    ```\n\n2.  9.2 如何定义抽象类？\n\n3.  9.3\
  \ 为什么抽象类仍然有用？如何使用它们的功能？\n\n4.  9.4 在名为 Vehicles 的类项目中编写代码，实现本章之前讨论的 `Vehicle` 对象族。有九个对象和两个需要实现的接口。\n\
  \n5.  9.5 创建名为 Traffic 的控制台应用程序项目，引用 `Vehicles.dll`（由问题 4 创建）。包含一个接受任何 `IPassengerCarrier`\
  \ 接口对象的函数 `AddPassenger`。为了证明代码有效，使用每个支持此接口的对象实例调用此函数，对每个实例调用继承自 `System.Object`\
  \ 的 `ToString` 方法并将结果写入屏幕。\n\n\n\n\n\n| 类和接口定义 | 类使用 `class` 关键字定义，接口使用 `interface`\
  \ 关键字定义。你可以使用 `public` 和 `internal` 关键字来定义类和接口的访问性，并可以将类定义为 `abstract` 或 `sealed`\
  \ 以控制继承。父类和接口在类或接口名称后的冒号后面通过用逗号分隔的列表中指定。类定义中只能指定一个父类，且它必须是列表中的第一项。 |\n| 构造函数和析构函数\
  \ | 类默认带有默认构造函数和析构函数的实现，你很少需要自己提供析构函数。你可以使用访问性修饰、类名以及任何所需的参数来定义构造函数。基类的构造函数会在派生类的构造函数之前执行，你可以通过\
  \ `this` 和 `base` 构造函数初始化关键字在类内部控制执行顺序。 |\n| 类库 | 你可以创建仅包含类定义的类库项目。这些项目无法直接执行；必须通过可执行应用程序中的客户端代码来访问。Visual\
  \ Studio 提供了各种工具来创建、修改和检查类。 |\n\n| 类族 | 类可以分组为具有共同行为或共享共同特征的类族。你可以通过继承一个共享的基类（可以是抽象的）或通过实现接口来实现。\
  \ |\n| 结构体定义 | 结构体（struct）的定义方式与类非常相似，但记住结构体是值类型，而类是引用类型。 |\n| 对象复制 | 当你复制一个对象时，必须小心复制它可能包含的任何对象，而不是简单地复制这些对象的引用。复制引用被称为浅拷贝，而完全复制被称为深拷贝。你可以使用\
  \ `ICloneable` 接口作为框架，在类定义中提供深拷贝能力。 |\n\n# 10 定义类成员\n\n## 成员定义\n\n在类定义内部，你为类的所有成员提供定义，包括字段、方法和属性。所有成员都有它们自己的访问性级别，在所有情况下都由以下关键字之一定义：\n\
  \n- `public` — 成员可以从任何代码访问。\n- `private` — 成员只能从属于该类部分的代码访问（如果不使用关键字，则为默认值）。\n-\
  \ `internal` — 成员只能从定义它们所在的程序集（项目）内部的代码访问。\n- `protected` — 成员只能从属于该类或其派生类的代码访问。\n\
  \n后两个关键字可以组合，因此 `protected internal` 成员也是可能的。这些成员只能从项目内的类派生类（更准确地说，是程序集内）访问。\n\n\
  字段、方法和属性也可以使用 `static` 关键字声明，这意味着它们是类拥有的静态成员，而不是对象实例的，正如第 8 章 中讨论的那样。\n\n### 定义字段\n\
  \n字段使用标准的变量声明格式（带有可选的初始化）以及之前过的过的饰符来定义：\n\n```cs\n class MyClass\n{\n    public\
  \ int MyInt;\n} \n```\n\n字段还可以使用 `readonly` 关键字，这意味着该字段只能在构造函数执行期间或通过初始赋值赋值：\n\n\
  ```cs\n class MyClass\n{\n   public readonly\n   int MyInt = 17;\n} \n```\n\n正如章节引言中提到的，字段可以使用\
  \ `static` 关键字声明为静态的：\n\n```cs\n class MyClass\n{\n   public static int MyInt;\n\
  } \n```\n\n静态字段通过定义它们的类进行访问（上一个示例中的 `MyClass.MyInt`），而不是通过该类的对象实例。你可以使用 `const`\
  \ 关键字创建一个常量值。`const` 成员在定义上是静态的，所以你不需要使用 `static` 饰符（事实上，这样做 是一个错误）。\n\n### 定义方法\n\
  \n方法使用标准的函数格式，加上访问性和可选的 `static` 饰符，如下例所示：\n\n```cs\n class MyClass\n{\n    public\
  \ string GetString() => \"Here is a string.\\n\";\n} \n```\n\n请记住，如果你使用 `static`\
  \ 关键字，那么该方法只能通过类访问，而不能通过对象实例访问。你还可以在方法定义中使用以下关键字：\n\n- `virtual` — 方法可以被重写。\n- `abstract`\
  \ — 方法在非抽象的派生类中必须被重写（仅在抽象类中允许）。\n- `override` — 方法重写基类方法（如果正在重写一个方法，则必须使用它）。\n-\
  \ `extern` — 方法定义在别处。\n\n这里有一个方法重写的示例：\n\n```cs\n public class MyBaseClass\n{\n\
  \   public virtual void DoSomething()\n   {\n      // 基类实现。\n   }\n}\n\npublic class\
  \ MyDerivedClass : MyBaseClass\n{\n   public override\n   void DoSomething()\n \
  \  {\n      // 派生类实现，重写了基类实现。\n   }\n} \n```\n\n如果使用了 `override`，也可以使用 `sealed`\
  \ 来指定派生类中不能对此方法进行任何进一步修改——即该方法不能被派生类重写。这里是一个示例：\n\n```cs\n public class MyDerivedClass\
  \ : MyBaseClass\n{\n   public override sealed\n   void DoSomething()\n   {\n   \
  \   // 派生类实现，重写了基类实现。\n   }\n} \n```\n\n使用 `extern` 允许你在项目外部提供方法的实现，但这是一个此处未涵盖的高级主题。\n\
  \n### 定义属性\n\n属性的定义方式与字段类似，但它们包含更多。正如已经讨论的，属性比字段更复杂，因为它们可以在修改状态之前执行额外的处理——而且，它们可能根本不修改状态。它们通过拥有两个函数形式块来实现这一点：一个用于获取属性的值，另一个用于设置属性的值。\n\
  \n这些块也被称为访问器，分别使用 `get` 和 `set` 关键字定义，并用于控制属性的访问级别。你可以省略这两个块中的任何一个来创建只读或只写属性（省略\
  \ `get` 块将提供只写访问，而省略 `set` 块将提供只读访问）。当然，这只适用于外部代码，因为类内部其他代码将具有与这些块相同的数据访问。你还可以在访问器上包含访问性修饰符——例如，将\
  \ `get` 块设为 public 而将 `set` 块设为 protected。你必须包含这些块中的至少一个才能获得有效的属性（而且让我们面对现实吧，一个不能读不能更改的属性将没有任何用处）。\n\
  \n属性的基本结构由标准的访问修饰关键字（`public`、`private` 等）组成，随后是类型名称、属性名称，以及包含属性处理的一个或两个 `get` 和\
  \ `set` 块组成：\n\n```cs\n public int MyIntProp\n{\n   get\n   {\n      // 属性 get 代码。\n\
  \   }\n   set\n   {\n      // 属性 set 代码。\n   }\n} \n```\n\n定义的第一行是与字段定义非常相似的部分。区别在于行尾没有分号；取而代之的是包含嵌套\
  \ `get` 和 `set` 块的代码块。\n\n`get` 块必须具有与属性类型相同的返回值。简单属性通常与一个控制该字段访问的私有字段相关联，在这种情况下，`get`\
  \ 块可以直接返回字段的值：\n\n\n\n\n\n```csharp\n // 属性使用的字段。\n\nprivate int myInt;\n\n// 属性。\n\
  \npublic int MyIntProp\n\n{\n\n   get { \nreturn myInt;\n\n }\n   set { // 属性设置代码。\
  \ }\n\n} \n```\n\n由于访问级别的限制，类外部的代码无法直接访问此 `myInt` 字段（它是 `private` 私有的）。相反，外部代码必须使用属性来访问该字段。`set`\
  \ 函数也以类似的方式为字段赋值。在这里，你可以使用关键字 `value` 来引用从属性用户处收到的值：\n\n```csharp\n // 属性使用的字段。\n\
  \nprivate int myInt;\n\n// 属性。\n\npublic int MyIntProp\n\n{\n\n   get { return myInt;\
  \ }\n\n   set { \nmyInt = value;\n\n }\n\n} \n```\n\n`value` 等于一个与属性相同类型的值，因此如果属性使用的类型与字段相同，那么在类似的情况下，你永远不需要担心类型转换。为了在整数允许\
  \ `null` 的情况下提供默认值，这种表达式体成员函数模式效果非常好：\n\n```csharp\n private int? myInt;\n\npublic\
  \ int? MyIntProp\n\n{\n\n   get { return myInt; }\n\n   set { \nmyInt = value ??\
  \ 0;\n\n }\n\n} \n```\n\n这个简单的属性的作用仅仅是屏蔽对 `myInt` 字段的直接访问。当你对过程施加更多控制时，属性的真正威力就显现出来了。例如，你可以如下所示实现你的\
  \ `set` 块：\n\n```csharp\n set\n\n   {\n\n      if (value >= 0 && value <= 10)\n\
  \         myInt = value;\n\n   } \n```\n\n在这里，只有当赋值给属性的值在 `0` 和 `10` 之间时，你才会修改 `myInt`。在这种情况下，你有一个重要的设计选择要做出。如果使用了无效值，你该怎么办？你有四种选择：\n\
  \n* 什么都不做（如前面的代码）。\n* 给字段分配一个默认值。\n* 继续执行，仿佛没有发生错误一样，但记录该事件以供以后分析。\n* 抛出异常。\n\n\
  通常，后两个选项是优的。在它们之间决定取决于类将如何被使用，以及应该给类用户分配多少控制权。抛出异常赋予了用户相当的控制权，并让他们知道发生了什么，以便他们做出适当的响应。你可以使用\
  \ `System` 命名空间中的标准异常之一：\n\n```csharp\n set\n\n   {\n\n      if (value >= 0 && value\
  \ <= 10)\n         myInt = value;\n\n      else\n         throw (new ArgumentOutOfRangeException(\"\
  MyIntProp\", value,\n\n                   \"MyIntProp 必须分配 0 到 10 之间的值。\"));\n\n\
  \   } \n```\n\n使用 `throw` 创建的异常可以使用使用该属性的代码中的 `try…catch…finally` 逻辑进行处理，正如你在第 7\
  \ 章中所示。\n\n记录数据（可能是到文本文件或 `Event Log`）可能是很有，例如在问题真的不应该出现的生产代码中。它允许开发者检查性能，并在必要时调试现有代码。\n\
  \n属性可以像方法一样使用 `virtual`、`override` 和 `abstract` 关键字，这是字段是无法实现的。最后，如前面提到的，访问器可以有自己的访问级别，如下所示：\n\
  \n```csharp\n // 属性使用的字段。\n\nprivate int myInt;\n\n// 属性。\n\npublic int MyIntProp\n\
  \n{\n\n   get { return myInt; }\n\n   protected set\n\n { myInt = value; }\n\n}\
  \ \n```\n\n在这里，只有类内部或派生类的代码可以使用 `set` 访问器。\n\n允许访问器的访问级别取决于属性的访问级别，禁止让访问器的访问级别比其所属的属性更高级。这意味着\
  \ `private` 属性不能包含其访问器的任何访问级别修饰符，而公共属性可以在其访问器上使用所有修饰符。\n\nC# 6 引入了一种名为“表达式体属性”的功能。与之前在第\
  \ 6 章中讨论的表达式体方法类似，该功能将属性的范围减少到一行代码。例如，返回对值进行单行数学计算的属性可以使用 lambda 箭头后跟方程。\n\n```csharp\n\
  \ // 属性使用的字段。\n\nprivate int myDoubledInt = 5;\n\n// 属性。\n\npublic int MyDoubledIntProp\
  \ => (myDoubledInt * 2); \n```\n\n接下来的“尝试一下”（Try It Out）允许你实验定义和使用字段、方法和属性。\n\n\
  ### 元组解构\n\n在第 6 章中你学习了元组，它们对于从函数返回多个结果非常有用。当不需要使用复杂的对象（如 `class`、`structure` 或\
  \ `array`）时，使用 `tuple` 是处理这种情况的有效方法。这里是一个元组的简单示例：\n\n```csharp\n var numbers = (1,\
  \ 2, 3, 4, 5); \n```\n\n定义一个返回多个结果的函数：\n\n```csharp\n private static (int max, int\
  \ min, double average)       \n\n    GetMaxMin(IEnumerable<int> numbers) {\n…\n\
  } \n```\n\n当你的代码使用 `GetMaxMin()` 函数时，结果必须由代码解析以显示。（再次查看第 6 章如果你需要该特定方法。）但是，如果你实现了元组解构，则不需要代码来解析结果。元组解构通过向任何你需要的类添加名为\
  \ `Deconstruct()` 的函数来实现。例如，检查下面的类：\n\n```csharp\n public class Location\n\n{\n\
  \  public Location(double latitude, double longitude)\n      => (Latitude, Longitude);\n\
  \n  public double Latitude { get; }\n\n  public double Longitude { get; }\n\n  public\
  \ void Deconstruct(out double latitude, out double longitude)\n     => (latitude,\
  \ longitude) = (Latitude, Longitude);\n}\n```\n\n表达式体构造函数接收两个 `double` 类型的变量（`latitude`\
  \ 和 `longitude`），并在初始化 `Location` 类时设置属性 `Latitude` 和 `Longitude` 的值。你可以通过将元组赋值给\
  \ `Location` 来访问字段：\n\n```csharp\n var location = new Location(48.137154, 11.576124);\n\
  \n(double latitude, double longitude) = location;\n```\n\n这样就可以引用结果，而无需解析。\n\n###\
  \ 重构成员\n\n在添加属性时，非常有用的技巧是从字段生成属性的能力。这是*重构*的一个示例，它意味着使用工具修改代码，而不是手动修改。这可以通过在类图或代码视图中右键点击成员来完成。\n\
  \n例如，如果 `MyClass` 类包含此字段：\n\n```csharp\n public string myString; \n```\n\n你可以右键点击该字段并选择“快速操作和重构”……（Ctrl+.。）这将弹出如图\
  \ 10-2 所示的对话框。\n\n![显示接受默认选项将修改 MyClass 类代码的对话框屏幕截图](img/Image00126.jpg)\n\n**图\
  \ 10-2\n\n接受默认选项将 `MyClass` 代码修改如下：\n\n```csharp\n public string myString;\n\npublic\
  \ string MyString\n\n{\n\n   get => myString;\n\n   set => myString = value;\n}\n\
  \nprivate string myString; \n```\n\n在这里，`myString` 字段的访问级别已更改为 `private`，并且创建了一个名为\
  \ `MyString` 的公共属性并与 `myString` 链接。显然，减少单调为字段创建属性的时间是一个巨大的优势！\n\n\n\n\n属性是访问对象状态的首选方式，因为它们保护外部代码不受对象内部数据存储实现的影响。它们还允许你对内部数据的访问方式具有更大的控制力，正如你在本章的代码中多次看到的那样。然而，你通常会以非常标准的方式定义属性——即，你将有一个私有成员，通过一个公共属性直接访问它。这种代码几乎总是与上一节中的代码相似，而之前的代码是由\
  \ Visual Studio 重构工具自动生成的。\n\n重构在输入方面确实可以提高速度，但 C# 还有另一个“箱底锏”：自动属性（automatic properties）。通过`automatic\
  \ property`，你使用简化的语法声明属性，而 C# 编译器会为你填补空白。具体来说，编译器会声明一个用于存储的私有字段，并在属性的 `get` 和 `set`\
  \ 块中使用该字段——而你无需担心细节。\n\n使用以下代码结构来定义自动属性：\n\n```\n public int MyIntProp\n{\n   get;\n\
  \   set;\n} \n```\n\n你甚至可以在单行代码上定义自动属性以节省空间，而不会显著降低属性的可读性：\n\n```\n public int MyIntProp\
  \ { get; set; } \n```\n\n你按照通常的方式定义属性的访问性、类型和名称，但你不需要为 `get` 或 `set` 块提供任何实现。相反，编译器提供了这些块（以及底层字段）的实现。\n\
  \n当你使用自动属性时，你只能通过属性访问其数据，而不能通过其底层私有字段访问。这是因为你无法不知道私有字段名称的情况下无法访问它，而该名称是在编译期间定义的。然而，这并不是真正的限制，因为直接使用属性名称是可以的。自动属性的唯一限制是它们必须同时包含\
  \ `get` 和 `set` 访问器——你无法通过这种方式定义只读或只写的属性。但是，你可以更改这些访问器的访问性。例如，这意味着你可以按照如下方式创建一个外部只读属性：\n\
  \n```\n public int MyIntProp { get; private set; } \n```\n\n在这里，你只能从类定义中的代码访问 `MyIntProp`\
  \ 的值。\n\nC# 6 引入了两个与自动属性相关的的新概念，称为只读器自动属性（getter‐only auto‐properties）和自动属性初始化器（initializers\
  \ for auto‐properties）。在 C# 6 之前，自动属性需要设置器，这限制了不可变数据类型的使用。不可变数据类型的简单定义是，它一旦被创建就不会改变状态，最著名的不可变类型是\
  \ `System.String`。使用不可变数据类型有许多好处，例如简化并发编程和线程同步。\n\n并发编程和线程同步是高级主题，本书将不再进一步讨论；然而，了解只读器自动属性是非常重要的。它们通过使用以下语法创建，注意不再需要设置器了：\n\
  \n```\n public int MyIntProp { get; } \n```\n\n自动属性的初始化功能通过以下方式实现，这与字段声明的方式相似：\n\
  \n```\n public int MyIntProp { get; } = 9; \n```\n\n## 附加类成员主题\n\n现在你准备好查看一些更高级的成员主题。本节将处理以下内容：\n\
  \n* 隐藏基类方法\n* 调用被重写或隐藏的基类方法\n* 使用嵌套类型定义\n\n### 隐藏基类方法\n\n当你从基类继承一个（非抽象的）成员时，你也继承了一个实现。如果被继承的成员是虚的（virtual），你就可以使用\
  \ `override` 关键字重写该实现。无论被继承的成员是否为虚的，如果你愿意，可以 `hide`（隐藏）该实现。这在某些情况下有用，例如当一个公共继承成员的作用并不符合你的预期时。\n\
  \n你可以简单使用如下代码来实现：\n\n```\n public class MyBaseClass\n{\n   public void DoSomething()\n\
  \   {\n      // 基类实现。\n   }\n}\n\npublic class MyDerivedClass : MyBaseClass\n{\n\
  \   public void DoSomething()\n   {\n      // 生派类实现，隐藏了基类实现。\n   }\n} \n```\n\n\
  尽管这段代码运行正常，但它会产生一个警告，说明你正在隐藏基类成员。该警告给了你机会在意外隐藏了想要使用的成员时纠正它。如果你确实想隐藏该成员，可以使用 `new`\
  \ 关键字显式指示这是你想这么做的：\n\n```\n public class MyDerivedClass : MyBaseClass\n{\n   new\n\
  \ public void DoSomething()\n   {\n      // 生派类实现，隐藏了基类实现。\n   }\n} \n```\n\n这种工作方式完全相同，但不会显示警告。此时，值得注意隐藏和重写基类成员之间的区别。考虑以下代码：\n\
  \n```\n public class MyBaseClass\n{\n   public virtual void DoSomething() => WriteLine(\"\
  Base imp\");\n}\n\npublic class MyDerivedClass : MyBaseClass\n{\n   public override\
  \ void DoSomething() => WriteLine(\"Derived imp\");\n} \n```\n\n在这里，重写的方法替换了基类中的实现，使得后续代码即使通过基类类型（使用多态）调用也会使用新版本：\n\
  \n```\n MyDerivedClass myObj = new MyDerivedClass();\nMyBaseClass myBaseObj;\nmyBaseObj\
  \ = myObj;\nmyBaseObj.DoSomething(); \n```\n\n这将导致以下输出：\n\n```\n Derived imp \n\
  ```\n\n或者，你可以隐藏基类方法：\n\n```\n public class MyBaseClass\n{\n   public virtual void\
  \ DoSomething() => WriteLine(\"Base imp\");\n}\n\npublic class MyDerivedClass :\
  \ MyBaseClass\n{\n   new\n public void DoSomething() => WriteLine(\"Derived imp\"\
  );\n} \n```\n\n基类方法不需要是虚的也可以正常工作，但效果完全相同，且前面的代码只需要修改一行。对于虚或非虚基类方法，结果如下：\n\n```\n\
  \ Base imp \n```\n\n虽然类实现被隐藏了，你仍然可以通过基类访问它。\n\n### 调用被重写或隐藏的基类方法\n\n无论你是重写还是隐藏成员，你都可以从派生类访问基类。在许多情况下这都是很有用的，例如：\n\
  \n* 当你想向派生类的用户隐藏继承的公共成员，但仍希望在类内部访问其功能\n* 当你想在继承的虚成员的基础上添加实现，而不是简单地用新的重写实现来替换\n\n\
  要实现这一点，你使用 `base` 关键字，它指向派生类包含的基类实现（与在最后一章中控制构造函数时的用法类似）：\n\n```\n public class\
  \ MyBaseClass\n{\n   public virtual void DoSomething()\n   {\n      // 基类实现。\n \
  \  }\n}\n\npublic class MyDerivedClass : MyBaseClass\n{\n   public override void\
  \ DoSomething()\n   {\n      // 生派类实现，扩展了基类实现。\n      base.DoSomething();\n    \
  \  // 更多生派类实现。\n   }\n} \n```\n\n#### 代码执行了 `MyBaseClass` 包含的 `DoSomething()` 版本，这是在\
  \ `MyDerivedClass` 包含的 `DoSomething()` 版本内部执行的。由于 `base` 使用对象实例工作，因此在静态成员中使用它是错误的。\n\
  \n#### this 关键字\n\n\n\n\n\n除了在上一章中使用 `base` 之外，你还使用了 `this` 关键字。与 `base` 一样，`this`\
  \ 可以在类成员内部使用，并且像 `base` 一样，`this` 指的是对象实例，尽管它是当前对象实例（这意味着你不能在静态成员中使用此 关键字，因为静态成员不是对象实例的一部分）。\n\
  \n`this` 关键字最有用的功能是将当前对象实例的引用传递给方法，如下例所示：\n\n```\n public void doSomething()\n\n\
  \   {\n      MyTargetClass myObj = new MyTargetClass();\n      myObj.DoSomethingWith(this);\n\
  \   } \n```\n\n在这里，实例化的 `MyTargetClass` 实例（`myObj`）有一个名为 `DoSomethingWith()` 的方法，它接受一个与包含上述方法的类兼容的类型参数。该参数类型可能是此类类型、该类派生的类类型、该类实现的接口，或者（当然地）`System.Object`。\n\
  \n`this` 关键字的另一个常见用途是使用它来限定本地类型成员，例如：\n\n```\n public class MyClass\n\n{\n   private\
  \ int someData;\n   public int SomeData => this.someData;\n} \n```\n\n许多开发者喜欢这种语法，它可以与任何成员类型配合使用，因为一眼一眼就能看出你引用的是成员而不是局部变量。\n\
  \n### 使用嵌套类型定义\n\n你可以在命名空间中定义类等类型，也可以在其他类内部定义它们。然后，你可以对定义使用全范围的访问级别修饰符，而不仅仅是 `public`\
  \ 和 `internal`，并且可以使用 `new` 关键字来隐藏继承自基类的类型定义。例如，以下定义 `MyClass` 的代码还定义定义了一个名为 `MyNestedClass`\
  \ 的嵌套类：\n\n```\n public class MyClass\n\n{\n   public class MyNestedClass\n\n  \
  \ {\n      public int NestedClassField;\n   }\n} \n```\n\n要从 `MyClass` 外部实例化 `MyNestedClass`，你必须限定名称，如下：\n\
  \n```\n MyClass.MyNestedClass myObj = new MyClass.MyNestedClass(); \n```\n\n然而，你可能无法这样做，例如，如果嵌套类被声明为\
  \ `private`。此功能存在的一个原因是为了定义仅对包含类私有的类，以便命名空间中的其他代码无法访问它们。另一个原因是嵌套类可以访问其包含类的私有和保护成员。下一个“尝试一下”（Try\
  \ it Out）将探讨这一特性。\n\n## 接口实现\n\n本节更详细地介绍了如何定义和实现接口。在上一章中，你学习了接口的定义方式与类类似，使用如下代码：\n\
  \n```\n interface IMyInterface\n\n{\n   // 接口成员。\n} \n```\n\n接口成员的定义方式类似于类成员，但有几个重要的区别：\n\
  \n* 不允许访问修饰符（`public`、`private`、`protected` 或 `internal`——所有接口成员都是隐式的 `public`。\n\
  * 接口成员不能包含代码体。\n* 接口不能定义字段成员。\n* 接口成员不能使用 `static`、`virtual`、`abstract` 或 `sealed`\
  \ 关键字定义。\n* 禁止类型定义成员。\n\n然而，如果你想隐藏继承自基接口的成员，可以使用 `new` 关键字定义成员：\n\n```\n interface\
  \ IMyBaseInterface\n\n{\n   void DoSomething();\n}\n\ninterface IMyDerivedInterface\
  \ : IMyBaseInterface\n\n{\n   new void DoSomething();\n} \n```\n\n这种工作方式与隐藏继承的类成员完全相同。\n\
  \n接口中定义的属性定义了允许该属性的一个或两个访问代码块——`get` 和 `set`，如下所示：\n\n```\n interface IMyInterface\n\
  \n{\n   int MyInt { get; set; }\n} \n```\n\n在这里，`int` 属性 `MyInt` 同时具有 `get` 和 `set`\
  \ 访问器。对于访问限制更严格的属性，可以省略其中任何一个。\n\n接口不指定属性数据应如何存储。例如，接口不能指定可能用于存储属性数据的字段。最后，接口像类一样可以定义为类的成员（但不能作为其他接口的成员，因为接口不能包含类型定义）。\n\
  \n### 在类实现接口\n\n实现接口的类必须包含该接口所有成员的实现，这些实现必须匹配指定的签名（包括匹配指定的 `get` 和 `set` 块），并且必须是\
  \ `public` 的，如下所示：\n\n```\n public interface IMyInterface\n\n{\n   void DoSomething();\n\
  \   void DoSomethingElse();\n}\n\npublic class MyClass : IMyInterface\n\n{\n   public\
  \ void DoSomething() {}\n   public void DoSomethingElse() {}\n} \n```\n\n可以使用 `virtual`\
  \ 或 `abstract` 关键字实现接口成员，但不能使用 `static` 或 `const`。接口成员也可以在基类上实现：\n\n```\n public\
  \ interface IMyInterface\n\n{\n   void DoSomething();\n   void DoSomethingElse();\n\
  }\n\npublic class MyBaseClass\n\n{\n   public void DoSomething()\n {}\n}\n\npublic\
  \ class MyDerivedClass : MyBaseClass, IMyInterface\n\n{\n   public void DoSomethingElse()\
  \ {}\n} \n```\n\n继承自实现了给定接口的基类意味着该接口被派生类隐式支持。这里有一个示例：\n\n```\n public interface\
  \ IMyInterface\n\n{\n   void DoSomething();\n   void DoSomethingElse();\n}\n\npublic\
  \ class MyBaseClass\n\n{\n   public virtual void DoSomething() {}\n   public virtual\
  \ void DoSomethingElse() {}\n}\n\npublic class MyDerivedClass : MyBaseClass\n\n\
  {\n   public override void DoSomething() {}\n} \n```\n\n显然，将实现定义为 `virtual` 是非常有用的，这样派生类就可以替换而不是隐藏它。如果你使用\
  \ `new` 关键字隐藏基类成员而不是以此这种方式重写，那么即使通过接口访问派生类，`IMyInterface.DoSomething()` 也始终指向基类版本。\n\
  \n#### 显式接口成员实现\n\n接口也可以由类*显式*实现。如果你这样做，该成员只能通过接口访问，不能通过类访问*隐式*成员（你在上一节代码中使用的）可以通过任何方式访问。\n\
  \n例如，如果 `MyClass` 类隐式地实现了 `IMyInterface` 的 `DoSomething()` 方法（如前面的示例所示），那么以下代码是有效的：\n\
  \n```\n MyClass myObj = new MyClass();\nmyObj.DoSomething(); \n```\n\n这种方式也是有效的：\n\
  \n```\n MyClass myObj = new MyClass();\nIMyInterface myInt = myObj;\nmyInt.DoSomething();\
  \ \n```\n\n或者，如果 `MyDerivedClass` 显式地实现 `DoSomething()`，则只有后一种技术是允许的。这样做的代码如下：\n\
  \n```\n public class MyClass : IMyInterface\n\n{\n   void IMyInterface.DoSomething()\
  \ {}\n   public void DoSomethingElse() {}\n} \n```\n\n在这里，`DoSomething()` 是显式实现的，而\
  \ `DoSomethingElse()` 是隐式实现的。只有后者可以通过 `MyClass` 的对象实例直接访问。\n\n#### 额外的属性访问器\n\n\n\
  \n\n之前你已经了解到，如果你实现了一个包含属性的接口，则必须实现匹配的 `get/set` 访问器。这并不是严格的——你可以在类的属性上添加一个 `get`\
  \ 块，而定义该属性的接口仅包含一个 `set` 块，反之亦然。然而，这只有在隐式实现接口时才是可能的。此外，在大多数情况下，你可能希望使用访问修饰符来添加访问器，该修饰符比接口中定义的访问器修饰符更严格。由于接口定义的访问器根据定义是公共的（public），这意味着你将添加非公共的访问器。这里有一个有一个示例：\n\
  \n```sharp\n public interface IMyInterface\n\n{\n\n   int MyIntProperty { get\n\
  ; }\n}\n\npublic class MyBaseClass : IMyInterface\n\n{\n\n   public int MyIntProperty\
  \ { get; protected set\n\n; }\n} \n```\n\n如果你将额外的访问器定义为 `public`，那么能够访问实现接口类的代码就可以访问它。然而，只能访问接口的代码将无法访问它。\n\
  \n## 部分类定义 (PARTIAL CLASS DEFINITIONS)\n\n当你创建一个具有大量某种类型成员的类时，代码可能会变得非常混乱，代码文件可能会变得非常长。一种可以帮助的技巧是使用代码大纲（outline）。通过在代码中定义区域（regions），你可以折叠和展开部分以使代码更易读。例如，你可能定义了一个如下类：\n\
  \n```sharp\n public class MyClass\n\n{\n\n   #region Fields\n\n   private int myInt;\n\
  \n   #endregion\n\n   #region Constructor\n\n   public MyClass() { myInt = 99; }\n\
  \n   #endregion\n\n   #region Properties\n\n   public int MyInt\n\n   {\n\n    \
  \  get { return myInt; }\n      set { myInt = value; }\n   }\n\n   #endregion\n\n\
  \   #region Methods\n\n   public void DoSomething()\n\n   {\n\n      // Do something..\n\
  \n   }\n\n   #endregion\n} \n```\n\n在这里，你可以展开和收叠类的字段、属性、构造函数和方法，让你能够专注于你感兴趣的内容。甚至可以这样嵌套区域，因此某些区域只在包含它们的区域被展开时才可见。\n\
  \n使用区域的替代方案是使用`partial class definitions`（部分类定义）。简单来说，你使用部分类定义将类的定义拆分到多个文件中。例如，你可以将字段、属性和构造函数放在一个文件中，将方法放在另一个文件中。要做到这一点，你只需要在包含部分定义的每个文件的类中使用\
  \ `partial` 关键字，如下所示：\n\n```sharp\n public partial\n\nclass MyClass {  …} \n```\n\
  \n如果你使用部分类定义，`partial` 关键字必须出现在每个包含部分定义的文件的中的此位置。\n\n例如，在名为 `MainWindow` 的类中的 WPF\
  \ 窗口，代码同时存储在 `MainWindow.xaml.cs` 和 `MainWindow.g.i.cs` 中（如果在“解决方案管理器”窗口中选择了“显示所有文件”，并深入到\
  \ `obj\\Debug` 文件夹，就可以看到它们）。这让你能够专注于表单的功能，而不必担心你的代码被你并不真正感兴趣的信息所堆满。\n\n关于部分类的最后一点：应用于其中一个部分类部分的接口将应用于整个类，这意味着以下定义：\n\
  \n```sharp\n public partial class MyClass : IMyInterface1 {  … }\n\npublic partial\
  \ class MyClass : IMyInterface2 {  … } \n```\n\n等同于：\n\n```sharp\n public class\
  \ MyClass : IMyInterface1, IMyInterface2 { … } \n```\n\n部分类定义可以在单个部分类定义中包含基类，也可以包含多个部分类定义。然而，如果在多个定义中指定了基类，则它必须是*同一个*基类；请记住\
  \ C# 中的类只能继承自单个基类。\n\n## 部分方法定义 (PARTIAL METHOD DEFINITIONS)\n\n部分类还可以定义部分方法。部分方法定义在一个部分类定义中，但没有方法方法体，并在另一个部分类定义中实现。在两个地方都使用了\
  \ `partial` 关键字：\n\n```sharp\n public partial class MyClass\n\n{\n\n   partial void\
  \ MyPartialMethod()\n;\n}\n\npublic partial class MyClass\n\n{\n\n   partial void\
  \ MyPartialMethod()\n\n   {\n\n      // Method implementation\n\n   }\n} \n```\n\
  \n部分方法也可以是静态的（static），但它们始终是私有的（private）且不能有返回值。它们使用的任何参数不能是 `out` 参数，尽管可以是 `ref`\
  \ 参数。它们还不能使用 `virtual`、`abstract`、`override`、`new`、`sealed` 或 `extern` 修饰符。\n\n\
  鉴于这些限制，部分方法的用途并不显而易见。事实上，它们在代码编译而非使用方面是重要的。请考虑以下代码：\n\n```sharp\n public partial\
  \ class MyClass\n\n{\n\n   partial void DoSomethingElse();\n\n   public void DoSomething()\n\
  \n   {\n\n      WriteLine(\"DoSomething() execution started.\");\n\n      DoSomethingElse();\n\
  \n      WriteLine(\"DoSomething() execution finished.\");\n\n   }\n\n}\n\npublic\
  \ partial class MyClass\n\n{\n\n   partial void DoSomethingElse() =>\n      WriteLine(\"\
  DoSomethingElse() called.\")\n;\n} \n```\n\n在这里，部分方法 `DoSomethingElse()` 在第一个部分类定义中被定义和调用，并在第二个定义中实现。当从控制台应用程序调用\
  \ `DoSomething()` 时，输出将如你所预期：\n\n```text\n DoSomething() execution started.\n\n\
  \ DoSomethingElse() called.\n\n DoSomething() execution finished.\n```\n\n如果你完全删除了第二个部分类定义或部分方法实现（或者将其注释掉），输出将如下：\n\
  \n```text\n DoSomething() execution started.\n\n DoSomething() execution finished.\n\
  ```\n\n## 示例应用程序 (EXAMPLE APPLICATION)\n\n为了说明你到为止使用的某些技巧，在本节中，你将开发一个类模块，你可以在后续章节中对其进行构建和使用。该类模块包含两个类：\n\
  \n*   `Card` ——代表一张标准扑牌，具有黑花、方片、红心或梅花花色，以及位于 A 到 K 之间的等级\n*   `Deck` ——代表一副完整的 52\
  \ 张牌牌组，可以通过牌组中的位置访问牌，并具有洗牌牌组的能力\n\n你还将开发一个简单的客户端来确保一切运行正常，但你还没有在完整的牌游戏中使用牌组。\n\n\
  ### 规划应用程序 (Planning the Application)\n\n此应用程序的类库 `Ch10CardLib` 将包含你的类。然而，在编写任何代码之前，你应该规划类所需的结构和功能。\n\
  \n#### 扑牌类 (The Card Class)\n\n\n\n\n`Card` 类本质上是一个两个只读字段的容器：`suit`（花色）和 `rank`（点数）。将字段设为只读是因为“空白”卡牌是没有意义的，而且卡牌一旦创建就不应该被更改。为了方便这一点，你将默认构造函数设为私有，并提供一个替代构造函数，根据提供的花色和点数来构建卡牌。\n\
  \n除此之外，`Card` 类将重写 `System.Object` 的 `ToString()` 方法，这样你就可以轻松获取表示卡牌的可读字符串。为了让操作更简单，你将为两个字段\
  \ `suit` 和 `rank` 提供枚举。\n\n`Card` 类如图图 10-4 所示。\n\n![Card 类的图示，它本质上是一个两个只读字段：suit\
  \ 和 rank 的容器。](img/Image00128.jpg)\n\n**图 10-4**\n\n### Deck 类\n\n`Deck` 类将维护 52\
  \ 个 `Card` 对象。你可以使用一个简单的数组类型来实现。该数组不会被直接访问，因为对 `Card` 对象的访问是通过 `GetCard()` 方法实现的，该方法返回给定索引的\
  \ `Card` 对象。该类还应该暴露一个 `Shuffle()` 方法来重新排列数组中的卡牌。`Deck` 类如图图 10-5 所示。\n\n![Deck 类的图示，它暴露了一个\
  \ Shuffle() 方法来重新排列数组中的卡牌。](img/Image00129.jpg)\n\n**图 10-5**\n\n## 编写类库\n\n为了本示例的目的，假设你已经足够熟悉\
  \ IDE，可以跳过标准的“尝试一试”（Try It Out）格式，因此不再显式列出步骤，因为这些是你已经使用过许多次的步骤。这里的重点是详细查看代码。尽管如此，文中包含了一些提示，以确保你不会在此过程中遇到任何问题。\n\
  \n你的类和枚举将包含在一个名为 `Ch10CardLib` 的类库项目中。该项目将包含四个 `.cs` 文件：`Card.cs`（包含 `Card` 类定义）、`Deck.cs`（包含\
  \ `Deck` 类定义）以及 `Suit.cs` 和 `Rank.cs` 文件（包含枚举）。\n\n你可以使用 Visual Studio 类图工具来组合其中的许多代码。\n\
  \n要开始之前，你需要执行以下操作：\n\n1. 创建一个名为 `Ch10CardLib` 的新类库项目，并将其保存到目录 `C:\\BeginningCSharp7\\\
  Chapter10` 中。\n2. 从项目中删除 `Class1.cs`。\n3. 使用解决方案资源管理器窗口打开项目的类图（右键点击项目，然后点击查看 ![image](img/Image00008.gif)\
  \ 类图）。类图在开始时应该是空的，因为项目不包含任何类。这会在项目中心创建一个名为 `ClassDiagram1.cd` 的文件以供以后使用。\n\n###\
  \ 添加 Suit 和 Rank 枚举\n\n在打开 `ClassDiagram1.cd` 文件后，通过从工具箱将一个枚举（Enum）拖入类图中来添加枚举，然后在出现的“新建枚举”对话框中填充内容。例如，对于\
  \ `Suit` 枚举，如图图 10-6 所示填充对话框。\n\n![为 Suit 枚举出现的“新建枚举”对话框截图说明。](img/Image00130.jpg)\n\
  \n**图 10-6**\n\n接下来，使用“类详情”窗口添加枚举的成员（右键点击 `ClassDiagram1.cd` 文件中刚添加的 `Suit` 枚举 ![image](img/Image00008.gif)\
  \ 类）。图 10-7 显示了所需的数值。\n\n![使用类详情窗口添加枚举成员后，所需数值的截图说明。](img/Image00131.jpg)\n\n**图\
  \ 10-7**\n\n以相同的方式从工具箱添加 `Rank` 枚举。所需的数值如图图 10-8 所示。\n\n![使用类详情窗口从工具箱添加 Rank 枚举后，所需数值的截图说明。](img/Image00132.jpg)\n\
  \n**图 10-8**\n\n你可以在代码文件 `Suit.cs` 和 `Rank.cs` 中找到这两个枚举生成的代码。你可以在 `Suit.cs` 中找到此示例的完整代码：\n\
  \n```csharp\npublic enum Suit\n{\n   Club,\n   Diamond,\n   Heart,\n   Spade\n}\n\
  ```\n\n你可以在 `Rank.cs` 中找到此示例的完整代码：\n\n```csharp\npublic enum Rank\n{\n   Ace,\n\
  \   Deuce,\n   Three,\n   Four,\n   Five,\n   Six,\n   Seven,\n   Eight,\n   Nine,\n\
  \   Ten,\n   Jack,\n   Queen,\n   King\n}\n```\n\n或者，修改 `Card.cs` 中的类代码如下（在 `Ch10CardLib`\
  \ 命名空间下）：\n\n```csharp\npublic class Card\n{\n   public readonly Suit suit;\n  \
  \ public readonly Rank rank;\n\n   public Card(Suit newSuit, Rank newRank)\n   {\n\
  \      suit = newSuit;\n      rank = newRank;\n   }\n\n   private Card() {}\n\n\
  \   public override string ToString() => \"The \" + rank + \" of \" + suit + \"\
  s\";\n}\n```\n\n### 添加 Card 类\n\n你需要结合类设计器 类。在类图中添加类的方法是将相应的项拖入图中并将新类命名为 `Card`。使用“类详情”窗口添加字段\
  \ `rank` 和 `suit`，然后使用“属性”窗口将“常量”设置为 `readonly`。你还需要添加两个构造函数——一个私有默认构造函数，以及一个接受参数\
  \ `newSuit` 和 `newRank`（类型分别为 Suit 和 Rank）的公共构造函数。最后，你重写 `ToString()`，这需要在“属性”窗口中将“继承修改程序”更改为\
  \ `override`。\n\n图 10-9 显示了类详情窗口和 Card 类的所有信息。（你可以在 `Ch10CardLib\\Card.cs` 中找到这些代码）。\n\
  \n![类详情窗口和 Card 类所有信息的截图说明。](img/Image00133.jpg)\n\n**图 10-9**\n\n`Deck` 类需要使用类图定义以下成员：\n\
  \n*   类型为 `Card[]` 的私有字段 `cards`\n*   公共默认构造函数\n*   公共方法 `GetCard()`，它接受一个名为 `cardNum`\
  \ 的 `int` 参数并返回 `Card` 类型的对象\n*   公共方法 `Shuffle()`，它不接受参数并返回 `void`\n\n当添加这些成员后，`Deck`\
  \ 类的类详情窗口将如图图 10-10 所示。\n\n\n\n\n\n![通过在类图中添加成员和类型，显示 Deck 类详细信息窗口外观的屏幕插图。](img/Image00134.jpg)\n\
  \n`图 10‐10`\n\n为了让图表更加清晰，你可以显示已添加的成员和类型之间的关系。在类图中，依次右键点击以下每个项，并从菜单中选择 `Show as Association`（显示为关联）：\n\
  \n*   `Deck` 中的 `cards`\n*   `Card` 中的 `suit`\n*   `Card` 中的 `rank`\n\n完成后，图表的外观应该像像图\
  \ 10‐11 所示。\n\n![显示已添加成员和类型之间关系的图表屏幕插图。](img/Image00135.jpg)\n\n`图 10‐11`\n\n接下来，修改\
  \ `Deck.cs` 中的代码（如果你没有使用类设计器，则必须先使用此处所示的代码添加此类）。你可以在 `Ch10CardLib\\Deck.cs` 中找到这些代码。首先，你实现构造函数，它只是在\
  \ `cards` 字段中创建并分配 52 张牌片。你遍历两个枚举的所有组合，使用每个组合来创建一个牌片。这导致 `cards` 初始包含一个有序的牌片列表：\n\
  \n```\nusing System;\nusing System.Collections.Generic;\nusing System.Linq;\nusing\
  \ System.Text;\nusing System.Threading.Tasks;\nnamespace Ch10CardLib\n{\n   public\
  \ class Deck\n   {\n      private Card[] cards;\n\n      public Deck()\n      {\n\
  \         cards = new Card[52];\n         for (int suitVal = 0; suitVal < 4; suitVal++)\n\
  \         {\n            for (int rankVal = 1; rankVal < 14; rankVal++)\n      \
  \      {\n               cards[suitVal * 13 + rankVal ‐1] = new Card((Suit)suitVal,\n\
  \                                                            (Rank)rankVal);\n \
  \           }\n         }\n      }\n   }\n}\n```\n\n接下来，实现 `GetCard()` 方法，它要么返回请求索引的\
  \ `Card` 对象，要么像之前所示抛出异常：\n\n```\npublic Card GetCard(int cardNum)\n{\n   if (cardNum\
  \ >= 0 && cardNum <= 51)\n      return cards[cardNum];\n   else\n      throw (new\
  \ System.ArgumentOutOfRangeException(\"cardNum\", cardNum,\n         \"Value must\
  \ be between 0 and 51.\"));\n} \n```\n\n最后，你实现 `Shuffle()` 方法。该方法的工作原理是创建一个临时牌片数组，并将牌片从现有\
  \ `cards` 数组随机复制到此数组中。函数的主体是一个从 0 计数到 51 的循环。在每次循环中，你使用 .NET Framework 中的 `System.Random`\
  \ 类实例生成一个 `0` 到 `51` 之间的随机数。一旦实例化，该类的对象就会使用 `Next(X)` 方法生成 `0` 到 `X` 之间的随机数。当你得到一个随机数时，只需将其作为临时数组中\
  \ `Card` 对象的索引，并从 `cards` 数组中从中复制牌片。\n\n为了记录已分配的牌片，你还有一个一个 `bool` 变量数组，并在复制每张牌片时将其赋值为\
  \ `true`。在你生成随机数时，你会检查此数组，以查看你是否已经将牌片复制到随机数指定的临时数组位置。如果是这样，你只需生成另一个。\n\n这并不是处理此问题的最高方法，因为在找到可以复制牌片的空位之前，会生成许多随机数。但是它是行得通的，非常简单，而且\
  \ C# 代码的执行速度非常快，你几乎察觉不到延迟。代码如下：\n\n```\npublic void Shuffle()\n{\n   Card[] newDeck\
  \ = new Card[52];\n   bool[] assigned = new bool[52];\n   Random sourceGen = new\
  \ Random();\n   for (int i = 0; i < 52; i++)\n   {\n      int destCard = 0;\n  \
  \    bool foundCard = false;\n      while (foundCard == false)\n      {\n      \
  \   destCard = sourceGen.Next(52);\n         if (assigned[destCard] == false)\n\
  \            foundCard = true;\n      }\n      assigned[destCard] = true;\n    \
  \  newDeck[destCard] = cards[i];\n   }\n   newDeck.CopyTo(cards, 0);\n}\n}\n}\n\
  ```\n\n该方法的最后一行使用 `System.Array` 类的 `CopyTo()` 方法（每当你创建一个数组时都会使用它）将 `newDeck` 中的每张牌片复制回\
  \ `cards`。这意味着你正在相同的 `cards` 对象中使用相同的一组 `Card` 对象，而不是创建任何新实例。如果你改用 `cards = newDeck`，那么你将用另一个对象替换由\
  \ `cards` 引用的实例。如果代码在其他地方保留了对原始 `cards` 实例的引用，可能会导致问题——因为原始实例将不会被洗牌！\n\n类库代码到此完成。\n\
  \n### 类库的客户端应用程序\n\n为了保持简单，你可以向解决方案添加一个控制台应用程序。要这样做，右键点击解决方案并 `Add` 新项目。新的控制台 (.NET\
  \ Framework) 项目名为 `Ch10Client`。\n\n为了使用你创建的类库，为 `Ch10CardLib` 项目添加引用。你可以在 Manager\
  \ 框的 `Projects` 选项卡中操作。由于这是你创建的第二个项目，你还需要指定它是启动项目，即点击运行时执行的项目。只需右键点击项目名称并选择 `Set\
  \ as Startup Project` 。\n\n接下来，添加使用你新类的代码。这不需要特殊操作，以下代码即可（你可以在 `Ch10Client\\Program.cs`\
  \ 中找到这些代码）：\n\n```\nusing System;\nusing System.Collections.Generic;\nusing System.Linq;\n\
  using System.Text;\nusing System.Threading.Tasks;\nusing static System.Console;\n\
  using Ch10CardLib;\nnamespace Ch10Client\n{\n   class Program\n   {\n      static\
  \ void Main(string[] args)\n      {\n         Deck myDeck = new Deck();\n      \
  \   myDeck.Shuffle();\n         for (int i = 0; i < 52; i++)\n         {\n     \
  \       Card tempCard = myDeck.GetCard(i);\n            Write(tempCard.ToString());\n\
  \            if (i != 51)\n               Write(\", \");\n            else\n   \
  \            WriteLine();\n         }\n         ReadKey();\n      }\n   }\n}\n```\n\
  \n`图 10‐11`\n\n![控制台项目的引用器框屏幕插图。](img/Image00136.jpg)\n\n`图 10‐12`\n\n选择项目并点击 `OK`\
  \ 添加引用。\n\n[图 10‐13] 显示了如果你运行此应用程序将得到的结果。\n\n`图 10‐13`\n\n![运行使用 Ch10Client\\Program.cs\
  \ 代码应用程序后的结果屏幕插图。](img/Image00137.jpg)\n\n这是牌中 52 张牌片的随机排列。你将在后面的章节中继续开发和使用此类库。\n\
  \n## 调用层次结构窗口\n\n现在是快速查看 Visual Studio 另一个功能的时机：调用层次结构（Call Hierarchy）窗口。该窗口允许你对代码进行查询，以发现你的方法是从哪里调用的，以及它们与其他方法之间的关系。用一个示例来说说明是最好的方法。\n\
  \n\n\n\n\n打开上一节中的示例应用程序，打开 `Deck.cs` 代码文件。找到 `Shuffle()` 方法，右键点击它，并选择“查看调用层次结构”（View\
  \ Call Hierarchy）菜单项。出现的窗口如图图 10-14](#text00013.html_c10-fig-0014）所示（其中展开了某些区域）。\n\
  \n![调用层次结构窗口外观插图，其中展开了某些区域。](img/Image00138.jpg)\n\n**图 10-14**](#text00013.html_R_c10-fig-0014)\n\
  \n从 `Shuffle()` 方法开始，你可以深入窗口中的树形视图，找到调用该方法的所有代码，以及该方法执行的所有调用。例如，高亮的方法 `Next(int)`\
  \ 被 `Shuffle()` 运行，因此它出现在“来自 Shuffle 的调用”（Calls From ‘Shuffle’）部分。当你点击某个调用时，可以在右侧看到该调用的代码行及其位置。你可以双击位置立即跳转到被引用的代码行。\n\
  \n此窗口在调试或重构代码时非常有用，因为它能让你目了然地看到不同代码段之间的关系。\n\n## 练习\n\n1. 10.1 编写代码定义一个基类 `MyClass`，其中包含虚拟方法\
  \ `GetString()`。该方法应返回存储在保护字段 `myString` 中的字符串，该字段可以通过只写公共属性 `ContainedString` 访问。\n\
  2. 10.2 从 `MyClass` 派生一个类 `MyDerivedClass`。重写 `GetString()` 方法以使用基方法的实现返回基类的字符串，但在返回的字符串后添加文本“(output\
  \ from derived class)”。\n3. 10.3 部分方法定义必须使用 `void` 返回类型。请提供其原因的原因。\n4. 10.4 编写一个名为\
  \ `MyCopyableClass` 的类，能够使用 `GetCopy()` 方法返回自身的副本。该方法应使用继承自 `System.Object` 的 `MemberwiseClone()`\
  \ 方法。为类添加一个简单的属性，并编写使用该类的客户端代码以确认一切运行正常。\n5. 10.5 为 `Ch10CardLib` 库编写一个控制台客户端，一次性从洗过的\
  \ `Deck` 对象中抽取五张牌。如果五张牌都是同一花色，则客户端应在屏幕上显示牌名以及文本 `Flush`！否则，它应在处理 50 张牌后退出并显示文本 `No\
  \ flush`。\n\n练习答案可以在附录中找到。\n\n## 本章所学 (Image00002.gif)\n\n| 主题 | 核心概念 |\n| --- |\
  \ --- |\n| 成员定义 | 你可以在类中定义字段、方法和属性成员。字段通过访问级别、名称和类型来定义。方法通过访问级别、返回类型、名称和参数来定义。属性通过访问级别、名称以及一个\
  \ `get` 和/或 `set` 访问器来定义。单个属性访问器可以有自己的访问级别，但其访问权限必须低于属性整体的访问权限。 |\n| 成员隐藏与重写 | 属性和方法可以在基类中定义为\
  \ `abstract`（抽象）或 `virtual`（虚）以定义继承。衍生类必须实现抽象成员，并可以使用 `override` 关键字重写虚成员。它们还可以使用\
  \ `new` 关键字提供新的实现，并使用 `sealed` 关键字防止对 `virtual` 成员的进一步重写。可以使用 `base` 关键字调用基实现。 |\n\
  | 接口实现 | 实现接口的类必须实现该接口定义的所有成员且必须为公共。你可以隐式或显式地实现接口，其中显式实现仅通过接口引用可用。 |\n| 部分定义 | 你可以使用\
  \ `partial` 关键字将类定义拆分多个代码文件中。你还可以使用 `partial` 关键字创建部分方法。部分方法具有某些限制，包括没有返回值或 `out`\
  \ 参数，并且在未提供实现时不会被编译。 |\n\n# 11 集合、比较与转换\n\n## 集合\n\n在第 5 章中，你学习了如何使用数组来创建包含数量对象或值的变体类型。然而，数组有其局限性。最大的限制是，数组一旦创建，大小就是固定的，因此你无法在不创建新数组的情况下向现有数组的末尾添加新项。这通常意味着操作数组的语法可能会变得非常复杂。OOP（面向对象编程）技术允许你创建在内部执行许多此类操作的类，从而简化了使用项目列表或数组的代码。\n\
  \nC# 中的数组被实现为 `System.Array` 类的实例，它们只是被称为*集合类*（collection classes）的一种类型。集合类通常用于维护对象列表，并且它们可能比简单数组提供更多的功能。许多功能是通过实现来自\
  \ `System.Collections` 命名空间的接口来实现的，从而标准化了集合语法。该命名空间还包含其他一些有趣的内容，例如以 `System.Array`\
  \ 其他方式实现这些接口的类。\n\n由于集合的功能（包括通过 `[index]` 语法访问集合项等基本功能）可以通过接口可用，因此你不仅限于使用如 `System.Array`\
  \ 等基础集合类。相反，你可以创建自己的自定义集合类。这些类可以针对你想要枚举的对象（即你想要维护的对象）更具特定性。这样做的优点之一（正如你将看到的）是自定义集合类可以是*强类型*的。也就是说，当你从集合中提取项时，不需要将其转换为正确的类型。另一个优势是可以暴露专门的方法。例如，在牌组示例中，你可以添加一个方法来获取特定的\
  \ `Card` 项。\n\n`System.Collections` 命名空间中的几个接口提供了基本的集合功能：\n\n* `IEnumerable` —提供遍历集合中项的能力\n\
  * `ICollection` —提供获取集合项数以及将项复制到数组的能力（继承自 `IEnumerable`）\n* `IList` —提供集合的项列表，以及访问这些项和其他与列表相关的一些基本能力（继承自\
  \ `IEnumerable` 和 `ICollection`）\n* `IDictionary` —类似于 `IList`，但提供了一个通过键值而不是索引访问的项列表（继承自\
  \ `IEnumerable` 和 `ICollection`）\n\n`System.Array` 类实现了 `IList`、`ICollection` 和\
  \ `IEnumerable`。然而，它不支持 `IList` 的某些更高级的功能，并且它通过固定大小表示项列表。\n\n### 使用集合\n\n`System.Collections`\
  \ 命名空间中的类之一 `System.Collections.ArrayList` 同样实现了 `IList`、`ICollection` 和 `IEnumerable`，但其实现方式比\
  \ `System.Array` 更复杂。数组的大小是固定的（你不能添加或删除元素），而该类可以用于表示变变长度的项目列表。为了让你更好地感受这种高级集合的可能，下面的“尝试一下”（Try\
  \ It Out）使用了该类，以及一个简单的数组。\n\n### 定义集合\n\n\n\n\n既然你已经知道了使用更高级的集合类可以实现的功能，现在是时候学习如何创建自己的强类型集合了。实现此目标的方法是手动实现所需的方法，但这可能是一个耗时且复杂的过程。或者，你可以从一个类派生你的集合，例如\
  \ `System.Collections.CollectionBase`，这是一个抽象类，它为你提供了大部分集合的实现。强烈建议使用这种选项。\n\n`CollectionBase`\
  \ 类暴露了 `IEnumerable`、`ICollection` 和 `IList` 接口，但仅提供了部分必要的实现——特别是 `IList` 的 `Clear()`\
  \ 和 `RemoveAt()` 方法，以及 `ICollection` 的 `Count` 属性。如果你想使用提供的功能，就需要自己实现所有其他内容。\n\n\
  为了方便实现，`CollectionBase` 提供了两个受保护属性，允许访问存储的对象本身。你可以使用 `List`，它通过 `IList` 接口让你访问项目；以及\
  \ `InnerList`，它是用于存储项的 `ArrayList` 对象。\n\n例如，存储 `Animal` 对象的集合类的基础定义可以如下所示（稍后你会看到一个更完整的实现）：\n\
  \n```\n public class Animals : CollectionBase\n\n{\n\n   public void Add(Animal\
  \ newAnimal) => List.Add(newAnimal);\n\n   public void Remove(Animal oldAnimal)\
  \ => List.Remove(oldAnimal);\n\n   public Animals() {}\n\n} \n```\n\n在这里，`Add()`\
  \ 和 `Remove()` 被实现为强类型方法，它们使用用于访问项目的 `IList` 接口的标准 `Add()` 方法。现在暴露的方法将仅适用于 `Animal`\
  \ 类或派生自 `Animal` 的类，这与之前显示的 `ArrayList` 实现不同，后者可以处理任何对象。\n\n`CollectionBase` 类允许你在派生的集合上使用\
  \ `foreach` 语法。例如，你可以使用如下代码：\n\n```\nWriteLine(\"Using custom collection class Animals:\"\
  );\n\nAnimals animalCollection = new Animals();\n\nanimalCollection.Add(new Cow(\"\
  Lea\"));\n\nforeach (Animal myAnimal in animalCollection)\n{\n   WriteLine($\"New\
  \ { myAnimal.ToString()} object added to custom \" +\n             $\"collection,\
  \ Name = {myAnimal.Name}\");\n} \n```\n\n然而，你无法执行以下操作：\n\n```\nanimalCollection[0].Feed();\
  \ \n```\n\n要通过这种方式通过索引访问项，你需要使用索引器。\n\n### 索引器\n\n索引器（`indexer`）是一种特殊的属性，你可以将其添加到类中以提供类似数组的访问。事实上，你可以通过索引器提供更复杂的访问，因为你可以随意地使用方括号语法定义并使用复杂的参数类型。然而，为项目实现简单的数字索引是最常用的用法。\n\
  \n你可以按照如下方式为 `Animal` 对象的 `Animals` 集合添加索引器：\n\n```\n public class Animals : CollectionBase\n\
  \n   {\n\n      …\n\n      public Animal this[int animalIndex]\n\n      {\n    \
  \     get { return (Animal)List[animalIndex]; }\n         Set { List[animalIndex]\
  \ = value; }\n      }\n   } \n```\n\n`this` 关键字与方括号中的参数一起使用，但在其他方面索引器看起来与其他任何属性非常相似。这种语法是逻辑性的，因为你通过使用对象名称后跟方括号中的索引参数来访问索引器（例如，`MyAnimals[0]`）。\n\
  \n索引器代码使用了 `List` 属性上的索引器（即在 `CollectionBase` 中提供访问存储项的 `ArrayList` 的 `IList` 接口）：\n\
  \n```\n return (Animal)List[animalIndex]; \n```\n\n这里必须进行显式转换，因为 `IList.List` 属性返回一个\
  \ `System.Object` 对象。这里需要注意的重要点是你为此索引器定义了一个类型。这就是当你使用此索引器访问项时将获得的类型。这种强类型特性意味着你可以编写如下代码：\n\
  \n```\nanimalCollection[0].Feed(); \n```\n\n而不是：\n\n```\n((Animal)animalCollection[0]).Feed();\
  \ \n```\n\n这是强类型自定义集合的另一个方便功能。在接下来的“尝试一试”（Try It Out）中，你将扩展之前的“尝试一试”以付诸实践。\n\n###\
  \ 为 CardLib 添加 Cards 集合\n\n在上一章中，你创建了一个名为 `Ch10CardLib` 的类库项目，其中包含一个代表扑牌的 `Card`\
  \ 类和一个代表一扑牌的 `Deck` 类——即 `Card` 类的集合。该集合最初是实现为简单数组的。\n\n在本章中，你将向此库添加一个新类，并重命名为 `Ch11CardLib`。这个新类\
  \ `Cards` 将是 `Card` 对象的自定义集合，将带给你在本章前面描述的所有优势。在 `C:\\BeginningCSharp7\\Chapter11`\
  \ 目录下创建一个名为 `Ch11CardLib` 的新类库。接下来，删除自动生成的 `Class1.cs` 文件；选择项目；添加现有项；从 `C:\\BeginningCSharp7\\\
  Chapter10\\Ch10CardLib` 目录选择 `Card.cs`、`Deck.cs`、`Suit.cs` 和 `Rank.cs` 文件；并将这些文件添加到你的项目中。与第\
  \ 10 章引入的项目上一版本一样，这些更改将不使用标准的“尝试一试”格式呈现。\n\n本章的可下载代码包含一个 `Ch11CardLib` 文件夹，其中包含了各种扩展所需的所有代码。正如此，你可能会注意到一些未包含在示例中的额外代码，但这不会影响它的工作。\n\
  \n 如果想直接跳转到代码，可以打开本章下载代码中包含的项目版本。通常你会发现代码被注释掉了；但是，当你到达相关示例时，可以取消你想要实验的部分。\n\n如果你决定创建此项目，添加一个名为\
  \ `Cards` 的新类并按如下方式修改 `Cards.cs` 中的代码：\n\n```\nusing System;\nusing System.Collections;\n\
  using System.Collections.Generic;\nusing System.Linq;\nusing System.Text;\nusing\
  \ System.Threading.Tasks;\n\nnamespace Ch11CardLib\n{\n   public class Cards : CollectionBase\n\
  \   {\n      public void Add(Card newCard) => List.Add(newCard);\n      public void\
  \ Remove(Card oldCard) => List.Remove(oldCard);\n\n      public Card this[int cardIndex]\n\
  \      {\n         get { return (Card)List[cardIndex]; }\n         set { List[cardIndex]\
  \ = value; }\n      }\n\n      /// <summary>\n      /// 将卡实例拷贝到另一个 Cards\n     \
  \ /// 实例实用方法——用于 Deck.Shuffle()。此实现假设\n      /// 源和集合的大小相同。\n      /// </summary>\n\
  \      public void CopyTo(Cards targetCards)\n      {\n         for (int index =\
  \ 0; index < this.Count; index++)\n         {\n            targetCards[index] =\
  \ this[index];\n         }\n      }\n\n      /// <summary>\n      /// 检查 Cards 集合是否包含特定的牌。\n\
  \      /// 这调用了集合 ArrayList 的 Contains() 方法，\n      /// 你通过 InnerList 属性访问它。\n \
  \     /// </summary>\n      public bool Contains(Card card) => InnerList.Contains(card);\n\
  \   }\n} \n```\n\n接下来，修改 `Deck.cs` 以使用这个新集合，而不是数组：\n\n\n\n\n\n```cs\n using System;\n\
  \nusing System.Collections.Generic;\n\nusing System.Linq;\n\nusing System.Text;\n\
  \nnamespace Ch11CardLib\n{\n   public class Deck\n   {\n      private Cards cards\
  \ = new Cards();\n      public Deck()\n      {\n         // Line of code removed\
  \ here\n         for (int suitVal = 0; suitVal < 4; suitVal++)\n         {\n   \
  \         for (int rankVal = 1; rankVal < 14; rankVal++)\n            {\n      \
  \         cards.Add(new Card((Suit)suitVal, (Rank)rankVal));\n            }\n  \
  \       }\n      }\n      public Card GetCard(int cardNum)\n      {\n         if\
  \ (cardNum >= 0 && cardNum <= 51)\n            return cards[cardNum];\n        \
  \ else\n            throw (new System.ArgumentOutOfRangeException(\"cardNum\", cardNum,\n\
  \                   \"Value must be between 0 and 51.\"));\n      }\n      public\
  \ void Shuffle()\n      {\n         Cards newDeck = new Cards();\n         bool[]\
  \ assigned = new bool[52];\n         Random sourceGen = new Random();\n        \
  \ for (int i = 0; i < 52; i++)\n         {\n            int sourceCard = 0;\n  \
  \          bool foundCard = false;\n            while (foundCard == false)\n   \
  \         {\n               sourceCard = sourceGen.Next(52);\n               if\
  \ (assigned[sourceCard] == false)\n                  foundCard = true;\n       \
  \     }\n            assigned[sourceCard] = true;\n            newDeck.Add(cards[sourceCard]);\n\
  \         }\n         newDeck.CopyTo(cards);\n      }\n   }\n} \n```\n\n这里不需要很大的改动。大部分修改涉及更改洗牌逻辑，以允许从\
  \ `cards` 中的随机索引添加到新 `Cards` 集合 `newDeck` 的开头，而不是从 `cards` 的顺序位置添加到 `newDeck` 的随机索引。\n\
  \n`Ch10CardLib` 解决方案的客户端控制台应用程序 `Ch10CardClient` 可以使用这个新库，并获得与之前相同的结果，因为 `Deck`\
  \ 的方法签名没有更改。然而，该类库的客户端现在可以使用 `Cards` 集合类，而不是依赖 `Card` 对象的数组——例如，在纸牌游戏应用程序中定义手。\n\
  \n### 键值集合和 IDictionary\n\n除了实现 `IList` 接口外，集合也可以实现类似的 `IDictionary` 接口，该接口允许通过键值（例如字符串名称）而不是索引对项进行索引。这同样通过索引器（indexer）来实现，尽管这里使用的索引器参数是与存储项关联的键，而不是\
  \ `int` 索引，这可以使集合变得友好得多。\n\n与索引集合一样，你可以使用一个基类来简化 `IDictionary` 接口的实现：`DictionaryBase`。该类还实现了\
  \ `IEnumerable` 和 `ICollection`，提供了任何集合都相同的基本集合操作能力。\n\n`DictionaryBase` 与 `CollectionBase`\
  \ 一样实现了通过其支持的接口获得的部分（并非全部）成员。与 `CollectionBase` 类似，`Clear` 和 `Count` 成员被实现了，但没有实现\
  \ `RemoveAt()`，因为它是 `IList` 接口上的方法，没有出现在 `IDictionary` 接口上。然而，`IDictionary` 确实有一个\
  \ `Remove()` 方法，这是你在基于 `DictionaryBase` 定义自定义集合类时应该实现的方法之一。\n\n下面的代码显示了 `Animals`\
  \ 类的另一种版本，这次派生自 `DictionaryBase`。包含了 `Add()`、`Remove()` 和通过键访问的索引器的实现：\n\n```cs\n\
  \ public class Animals : DictionaryBase\n{\n   public void Add(string newID, Animal\
  \ newAnimal) =>\n       Dictionary.Add(newID, newAnimal);\n   public void Remove(string\
  \ animalID) => \n       Dictionary.Remove(animalID);\n   public Animals() {}\n\n\
  \   public Animal this[string animalID]\n   {\n      get { return (Animal)Dictionary[animalID];\
  \ }\n      set { Dictionary[animalID] = value; }\n   }\n} \n```\n\n这些成员之间的差异如下：\n\
  \n- `Add()`——接收两个参数（一个键和一个值）并一起存储。字典集合有一个继承自 `DictionaryBase` 的名为 `Dictionary` 的成员，它是一个\
  \ `IDictionary` 接口。该接口有自己的 `Add()` 方法，接收两个对象参数。你的实现接收一个字符串值作为键，并将一个 `Animal` 对象作为数据与此键一同存储。\n\
  - `Remove()`——接收一个键参数，而不是对象引用。具有指定键值的项将被移除。\n- `索引器`——使用字符串键值而不是索引，通过继承的 `Dictionary`\
  \ 成员访问存储的项。同样，这里需要进行类型转换。\n\n基于 `DictionaryBase` 的集合与基于 `CollectionBase` 的集合之间的另一个区别是\
  \ `foreach` 的工作方式有不同。上一节中的集合允许你直接从集合中提取 `Animal` 对象。对派生自 `DictionaryBase` 的类使用 `foreach`\
  \ 会给你 `DictionaryEntry` 结构体，这是另一个在 `System.Collections` 命名空间中定义的类型。\n\n\n\n\n无论代码块是什么，它的返回类型都是受到限制的。可能与预期相反，这种返回类型与正在枚举的对象类型不同。例如，在一个表示\
  \ `Animal` 对象集合的类中，迭代器块的返回类型不能是 `Animal`。两种可能的返回类型是之前提到的接口类型：`IEnumerable` 或 `IEnumerator`。你如下所示使用这些类型：\n\
  \n*   要迭代一个类，使用名为 `GetEnumerator()` 的方法，其返回类型为 `IEnumerator`。\n*   要迭代类的成员（例如方法），使用\
  \ `IEnumerable`。\n\n在迭代器块内部，你通过使用 `yield` 关键字来选择用于 `foreach` 循环的值。该操作的语法如下：\n\n\
  ```\n yield return value\n\n>;; \n```\n\n这些信息就足够构建一个非常简单的示例了，如下（你可以在 `SimpleIterators\\\
  Program.cs` 中找到此代码）：\n\n```\n public static IEnumerable SimpleList()\n\n      {\n\
  \n         yield return \"string 1\";\n\n         yield return \"string 2\";\n\n\
  \         yield return \"string 3\";\n\n      }\n\n      static void Main(string[]\
  \ args)\n\n      {\n\n         foreach (string item in SimpleList())\n\n       \
  \     WriteLine(item);\n\n         ReadKey();\n\n      } \n```\n\n在这里，静态方法 `SimpleList()`\
  \ 是迭代器块。因为它是一个方法，所以你使用的返回类型是 `IEnumerable`。`SimpleList()` 使用 `yield` 关键字为它的 `foreach`\
  \ 块提供三个值，每个值都会写入屏幕。结果显示在图 11-3 中。\n\n![使用返回类型为 IEnumerable 的结果的截图插图。SimpleList()\
  \ 使用 yield 关键字提供三个值，每个值都会写入屏幕。](img/Image0014.jpg)\n\n**图 11-3**\n\n显然，这个迭代器并不是特别实用的，但它展示了其实际工作原理，以及实现可以有多简单。查看代码，你可能会好奇代码是如何知道要返回\
  \ `string` 类型项的。事实上，它并没有；它返回的是 `object` 类型的值。如你所知，`object` 是所有类型的基类，因此你可以从 `yield`\
  \ 语句返回任何内容。\n\n然而，编译器足够智能，你可以在 `foreach` 循环的上下文中将返回的值解释为任何你类型。在这里，代码请求 `string`\
  \ 类型的值，因此你得到的是用于处理的值。如果你更改了其中一条 `yield` 行使其返回（例如）一个整数，你将在 `foreach` 循环中得到一个类型转换异常（bad\
  \ cast exception）。\n\n关于迭代器还有一点：你可以使用以下语句中断向 `foreach` 循环返回信息：\n\n```\n yield break;\
  \ \n```\n\n当在迭代器中遇到此语句时，迭代器处理将立即终止，使用它的 `foreach` 循环也会停止。\n\n现在是时候来看一个更复杂且更有实用的示例了！在本次“尝试一下”中，你将实现一个获取质数的迭代器。\n\
  \n### 迭代器与集合\n\n之前曾向你承诺解释如何使用迭代器来遍历字典类型集合中存储的对象，而无需处理 `DictionaryItem` 对象。在本文的可下载代码中，你会在\
  \ `DictionaryAnimals` 文件夹中找到下一个项目的代码。回集合类 `Animals`：\n\n```\n public class Animals\
  \ : DictionaryBase\n\n{\n\n   public void Add(string newID, Animal newAnimal) =>\n\
  \n       Dictionary.Add(newID, newAnimal);\n\n   public void Remove(string animalID)\
  \ => \n\n       Dictionary.Remove(animalID);\n\n   public Animal this[string animalID]\n\
  \n   {\n      get { return (Animal)Dictionary[animalID]; }\n      set { Dictionary[animalID]\
  \ = value; }\n   }\n\n} \n```\n\n你可以将这个简单的迭代器添加到代码中以获得所需的行为：\n\n```\n public new\
  \ IEnumerator GetEnumerator()\n\n      {\n\n         foreach (object animal in Dictionary.Values)\n\
  \            yield return (Animal)animal;\n\n      } \n```\n\n现在你可以使用以下代码来遍历集合中的\
  \ `Animal` 对象：\n\n```\n foreach (Animal myAnimal in animalCollection)\n\n      \
  \   {\n\n            WriteLine($\"New {myAnimal.ToString()} object added to \" +\n\
  \n                      $\" custom collection, Name = {myAnimal.Name}\");\n\n  \
  \       } \n```\n\n### 深度拷贝\n\n第 9 章 描述了如何通过 `System.Object.MemberwiseClone()` 保护方法执行浅拷贝，可以使用此处所示的\
  \ `GetCopy()` 方法：\n\n```\n public class Cloner\n\n{\n\n   public int Val;\n\n  \
  \ public Cloner(int newVal) => Val = newVal;\n\n   public object GetCopy() => MemberwiseClone();\n\
  \n} \n```\n\n假设你有的字段是引用类型而非值类型（例如，对象）：\n\n```\n public class Content\n\n{\n\n  \
  \ public int Val;\n}\n\npublic class Cloner\n\n{\n   public Content MyContent =\
  \ new Content();\n   public Cloner(int newVal) => MyContent.Val = newVal;\n\n  \
  \ public object GetCopy() => MemberwiseClone();\n\n}\n```\n*(注：原文后续部分存在大量重复的碎片代码，已按要求停止输出。)*\n\
  \n\n\n你可以通过使用 `ICloneable` 接口实现复制 `Card`、`Cards` 和 `Deck` 对象的能力来付诸实践这在某些卡牌游戏中可能很有用，因为你并不一定希望两个牌组都引用同一组\
  \ `Card` 引用，尽管你可能设想让一个牌组的牌牌顺序与另一个相同。\n\n在 `Ch11CardLib` 中为 `Card` 类实现克隆功能很简单，因为浅拷贝就足够了（`Card`\
  \ 只包含字段形式的值类型数据）。首先对 `class` 定义进行以下更改：\n\n```cpp\n public class Card : ICloneable\n\
  \   {\n      public object Clone() => MemberwiseClone(); \n```\n\n这种 `ICloneable`\
  \ 的实现只是浅拷贝。目前没有规则规定 `Clone()` 方法中应该发生什么，但这对于你的目的来说足够了。\n\n接下来，在 `Cards` 集合类上实现 `ICloneable`。这要稍微复杂一些，因为涉及到克隆原始集合中的每个\
  \ `Card` 对象——所以你需要进行深拷贝：\n\n```cpp\n public class Cards : CollectionBase, ICloneable\n\
  \   {\n      public object Clone()\n      {\n         Cards newCards = new Cards();\n\
  \         foreach (Card sourceCard in List)\n         {\n            newCards.Add((Card)sourceCard.Clone());\n\
  \         }\n         return newCards;\n      } \n```\n\n最后，在 `Deck` 类上实现 `ICloneable`。注意这里有一个小问题：`Ch11CardLib`\
  \ 中的 `Deck` 类没有办法修改它包含的牌，除非进行洗牌。例如，无法修改 `Deck` 实例以获得特定的牌序。为了解决这个问题，为 `Deck` 类定义一个新的私有构造函数，允许在实例化\
  \ `Deck` 对象时传入一个特定的 `Cards` 集合。以下是在该类中实现克隆的代码：\n\n```cpp\n public class Deck : ICloneable\n\
  \   {\n      public object Clone()\n      {\n         Deck newDeck = new Deck(cards.Clone()\
  \ as Cards);\n         return newDeck;\n      }\n      private Deck(Cards newCards)\
  \ => cards = newCards; \n```\n\n再次，你可以用一些简单的客户端代码来测试这一点。和之前一样，将此代码放在客户端项目的 `Main()`\
  \ 方法中进行测试（你可以在该章节的在线下载 `Ch11CardClient\\Program.cs` 中找到这段代码）：\n\n```cpp\n Deck deck1\
  \ = new Deck();\nDeck deck2 = (Deck)deck1.Clone();\nWriteLine($\"The first card\
  \ in the original deck is: {deck1.GetCard(0)}\");\nWriteLine($\"The first card in\
  \ the cloned deck is: {deck2.GetCard(0)}\");\ndeck1.Shuffle();\nWriteLine(\"Original\
  \ deck shuffled.\");\nWriteLine($\"The first card in the original deck is: {deck1.GetCard(0)}\"\
  );\nWriteLine($\"The first card in the cloned deck is: {deck2.GetCard(0)}\");\n\
  ReadKey(); \n```\n\n输出将与 图 11-5 所示的类似。\n\n![将代码 Ch11CardClient\\Program.cs 放在客户端项目的\
  \ Main() 方法中测试的输出插图](img/Image00143.jpg)\n\n**图 11-5**\n\n## 比较\n\n本节涵盖了对象之间的两种类型的比较：\n\
  \n*   类型比较\n*   值比较\n\n类型比较——即确定一个对象是什么，或者它继承自什么——在 C# 编程的所有领域都非常重要。通常当你传递一个对象时（例如传递给一个方法），接下来的发生的情况取决于对象的类型。你已经在本章及之前的章节中简要见过这一点，但在这里你将看到一些更实用的技巧。\n\
  \n值比较也是你经常看到的内容，至少对于简单类型是这样。当比较对象的值时，情况会变得复杂一些。首先，你必须定义什么是比较，以及诸如 `>` 等运算符在你的类语境下意味着什么。这在集合中尤为重要，因为你可能想要根据某些条件（也许按字母顺序或根据更复杂的算法）对对象进行排序。\n\
  \n### 类型比较\n\n在比较对象时，你通常需要知道它们的类型，这允许你判断是否可以进行值比较。在第 9 章中，你看到了 `GetType()` 方法，所有类都继承自\
  \ `System.Object`，以及如何结合 `typeof()` 运算符使用该方法来确定（并根据类型采取操作）对象类型：\n\n```cpp\n if (myObj.GetType()\
  \ == typeof(MyComplexClass))\n{\n   // myObj 是 MyComplexClass 类的实例。\n} \n```\n\n\
  你还见过 `ToString()` 的默认实现（同样继承自 `System.Object`），它将为你提供对象类型的字符串表示。你也可以比较这些字符串，尽管实现这一目标的方法相当混乱。\n\
  \n本节演示了一种方便的简便方法：`is` 运算符。该运算符允许代码具有更高的可读性，并且正如你将看到的，它具有检查基基的优势。在查看 `is` 运算符之前，你需要了解装箱（boxing）和拆箱（unboxing）。\n\
  \n### 装箱与拆箱\n\n在第 8 章中你学习了引用类型和值类型之间的区别。装箱是将值类型转换为 `object` 的。拆箱则是相反的转换。例如，假设你有如下结构体：\n\
  \n```cpp\n struct MyStruct\n{\n   public int Val;\n}\n```\n\n你可以将结构体装箱为 `object`\
  \ 类型变量：\n\n```cpp\n MyStruct valType1 = new MyStruct();\nvalType1.Val = 5;\nobject\
  \ refType = valType1; \n```\n\n通过这种方式装箱的对象包含值类型变量的副本，而不是对原始值类型的引用。你可以通过修改原始结构体并拆箱对象中的结构体来验证这一点：\n\
  \n```cpp\n valType1.Val = 6;\nMyStruct valType2 = (MyStruct)refType;\nWriteLine($\"\
  valType2.Val = {valType2.Val}\");\n```\n\n这段代码输出：\n\n```\n valType2.Val = 5\n```\n\
  \n当你将引用类型赋值给对象时，你会得到不同的行为。你可以通过将 `MyStruct` 改为类来观察（尽管这个类的名称并不合适）：\n\n```cpp\n class\
  \ MyStruct\n{\n   public int Val;\n}\n```\n\n使用之前的客户端代码（再次忽略错误的变量命名），你会得到以下输出：\n\
  \n```\n valType2.Val = 6\n```\n\n你也可以将值类型装箱为接口类型，只要它们实现了该接口。例如，假设 `MyStruct` 类型实现了如下\
  \ `IMyInterface` 接口：\n\n```cpp\n interface IMyInterface {}\nstruct MyStruct : IMyInterface\n\
  {\n   public int Val;\n}\n```\n\n然后你可以将结构体装箱为 `IMyInterface` 类型：\n\n```cpp\n MyStruct\
  \ valType1 = new MyStruct();\nIMyInterface refType = valType1; \n```\n\n你可以使用正常的强制转换语法对其拆箱：\n\
  \n```cpp\n MyStruct ValType2 = (MyStruct)refType; \n```\n\n\n\n\n你可能在想实际上为什么要这样做。装箱（boxing）极其有用的原因有两个非常理由。首先，它允许你在项类型为\
  \ `object` 的集合（例如 `ArrayList`）中使用值类型。其次，它是一种内部机制，允许你对值类型（如 `int` 和结构体 `structs`）调用\
  \ `object` 级别的方法。\n\n值得注意的是，在访问值类型的内容之前，必须先进行拆箱（unboxing）。\n\n## is 运算符\n\n尽管顾名其义，但\
  \ `is` 运算符并不是用来判断对象是否为特定类型的方法。相反，`is` 运算符允许你检查对象是否是某个给定类型，或者`可以转换为`该类型。如果是这种情况，则该运算符的结果为\
  \ `true`。\n\n之前的示例展示了 `Cow`（牛）和 `Chicken`（鸡）类，它们都继承自 `Animal`。使用 `is` 运算符与 `Animal`\
  \ 类型进行对象比较，对于这三种类型中的所有对象都会返回 `true`，而不仅仅是 `Animal`。这是你通过之前显示的 `GetType()` 方法和 `typeof()`\
  \ 运算符很难实现的。\n\n`is` 运算符的语法如下：\n\n```\noperand\n\n> is type\n\n> \n```\n\n此表达式的可能结果如下：\n\
  \n- 如果 `<type>` 是类类型，当 `<operand>` 是该类型、继承自该类型或可以被装箱为该类型时，结果为 `true`。\n- 如果 `<type>`\
  \ 是接口类型，当 `<operand>` 是该类型或实现该接口的类型时，结果为 `true`。\n- 如果 `<type>` 是值类型，当 `<operand>`\
  \ 是该类型或是可以被拆箱为该类型的类型时，结果为 `true`。\n\n接下来的“尝试一试”展示了这在实践中是如何运作的。\n\n### 使用 is 运算符进行模式匹配\n\
  \n模式表达式\n\n回想 第 4 章，在该章引入了 `switch` 语句，并在 第 5 章中它被扩展以包含支持基于变量类型（`string`、`int` 等）进行匹配的\
  \ case。一旦确定了类型，你就可以访问其属性和方法来进一步缩小匹配范围。\n\n`switch case` 方法是更优雅的模式匹配方式，因为 `is` 运算符通常实现了许多\
  \ `if…else if…` 语句。随着你想要模式匹配的场景扩大，语句可能会变得很深很很长，导致代码的可读性降低。如果真的发生了那种情况，请记住替代方案是 `switch\
  \ case` 模式匹配功能。然而，对于较小的代码段，`is` 运算符是匹配模式和过滤你的数据集的一种非常有效且强大的策略。参考以下代码：\n\n```\nobject[]\
  \ data = { 1.6180, null, new Cow(\"Rual\"), new Chicken(\"Lea\"), \"none\" };\n\n\
  foreach (var item in data)\n{\n  if (item is 1.6180) WriteLine(\"The Golden Ratio\"\
  );\n  else if (item is null) WriteLine(\"The value is null\");\n  else if (item\
  \ is Cow co) WriteLine($\"The cow is named {co.Name}.\");\n  else if (item is Chicken\
  \ ch) WriteLine(\"The chicken is named\" + $\" {ch.Name} and {ch.RunInCircles()}\"\
  );\n  else if (item is var catcher) WriteLine(\"Catch all for\" + $\" {catcher.GetType().Name});\
  \ \n} \n```\n\n存储在 `data` 变量中的对象包含几种不同的类型。通过 `foreach` 语句遍历 `object[]` 数组，你可以使用\
  \ `is` 运算符检查变量的类型，并在匹配时采取适当的操作。第一个模式匹配是针对 1.6180，这是一个常量值，是 `const pattern`（常量模式）的示例，第二个模式匹配中的\
  \ `null` 也是如此。在匹配常量时，可以使用 `==` 运算符实现相同；然而，`is` 运算符更容易理解且更友好。\n\n`data` 变量中的最后两个对象类型为\
  \ `Cow` 和 `Chicken`。`type pattern`（类型模式）在模式匹配时分配一个指定类型的新变量。例如，当匹配到 `Chicken` 时，会创建一个新的\
  \ `ch` 变量，其中包含 `Chicken` 对象，允许程序员访问 `Chicken` 类中包含的属性和方法（例如属性 `name` 和方法 `RunInCircles()`）。\n\
  \n最后，你可以使用 `var pattern`（变量模式）来捕获代码路径中没有匹配之前任何 `if…else if…` 语句的所有场景。然后使用 `catcher`\
  \ 变量通过 `GetType().Name` 属性获取变量类型。\n\n### 值比较\n\n考虑两个代表人的 `Person` 对象，每个对象都有一个整数属性\
  \ `Age`。你可能想比较它们看看哪个人的年龄更大。你可以简单地使用以下代码：\n\n```\nif (person1.Age > person2.Age)\n\
  {\n   …\n} \n```\n\n这可以正常工作，但也有其他方案。你可能更倾向于使用如下语法：\n\n```\nif (person1 > person2)\n\
  {\n   …\n}\n```\n\n## 运算符重载\n\n运算符重载允许在你设计的类中使用标准运算符，如 `+`、`>` 等。这被称为“重载”，因为你为这些运算符提供了自己的实现，就像你通过提供不同的参数来重载方法一样。\n\
  \n运算符重载非常有用，因为你可以在运算符的实现中执行任何你处理，这可能不像像 `+` 那样仅仅意味着“两个操作数相加”。稍后我们将在一个章节中看到一个很好的示例，在那里你将为比较运算符提供实现，以比较两张牌并查看谁在回合（一种牌游戏过程）中胜出。\n\
  \n因为许多牌类游戏的回取决于牌的花色，所以这并不比比较牌上的数字简单。如果第二张出的牌与第一张牌的花色不同，则第一张牌胜，无论点数如何。你可以通过考虑操作数的顺序来实现这一点。你还可以考虑将牌，即将牌胜过其他花色，即使它不是先出的花色。这意味着计算\
  \ `card1 > card2` 为 `true`（即如果 `card1` 先出，`card1` 将胜过 `card2`）并不一定意味着 `card2 > card1`\
  \ 为 `false`。如果 `card1` 和 `card2` 都不是将牌且属于不同的花色，那么两个比较结果都为 `true`。\n\n不过，首先让我们看看运算符重载的基本语法。可以通过向类添加运算符类型成员（必须是静态的）来重载运算符。某些运算符有多种用途（例如\
  \ `-` 具有一元和二元功能），因此你还需要指定正在处理的几个操作数以及这些操作数的类型。通常情况下，操作数的类型与定义运算符的类类型相同，尽管也可以定义处理混合类型的的运算符，正如你很快就会看到的。\n\
  \n作为一个示例，考虑简单的类型 `AddClass1`，其定义如下：\n\n```\npublic class AddClass1\n{\n   public\
  \ int val;\n} \n```\n\n\n\n\n这只是对 `int` 值的一个封装，但它说明了相关原理。使用此类类，下面的代码将无法编译：\n\n```\n\
  \ AddClass1 op1 = new AddClass1();\nop1.val = 5;\n AddClass1 op2 = new AddClass1();\n\
  op2.val = 5;\n AddClass1 op3 = op1 + op2; \n```\n\n你收到的错误信息是 `+` 运算符不能应用于 `AddClass1`\
  \ 类型的操作数。这是因为你还没有定义要执行的操作。像下面的代码可以运行，但它不会给你可能想要的结果：\n\n```\n AddClass1 op1 = new\
  \ AddClass1();\nop1.val = 5;\n AddClass1 op2 = new AddClass1();\nop2.val = 5;\n\
  \ bool op3 = op1 == op2; \n```\n\n在这里，`op1` 和 `op2` 使用 `==` 二元运算符进行比较，以确定它们是否引用同一个对象，而不是验证它们的值是否相等。在前面的代码中，`op3`\
  \ 将为 `false`，尽管 `op1.val` 和 `op2.val` 是相同的。\n\n要重载 `+` 运算符，请使用以下代码：\n\n```cs\n public\
  \ class AddClass1\n{\n   public int val;\n   public static AddClass1 operator +(AddClass1\
  \ op1, AddClass1 op2)\n   {\n      AddClass1 returnVal = new AddClass1();\n    \
  \  returnVal.val = op1.val + op2.val;\n      return returnVal;\n   }\n} \n```\n\n\
  你可以看到，运算符重载看起来非常标准的 `static` 方法声明，区别在于它们使用 `operator` 关键字和运算符本身，而不是方法名。你现在可以像上一个例子一样成功在该类中使用\
  \ `+` 运算符：\n\n```\n AddClass1 op3 = op1 + op2; \n```\n\n重载所有二元运算符遵循相同的模式。一元运算符看起来相似，但只有一个参数：\n\
  \n```cs\n public class AddClass1\n{\n   public int val;\n   public static AddClass1\
  \ operator +(AddClass1 op1, AddClass1 op2)\n   {\n      AddClass1 returnVal = new\
  \ AddClass1();\n      returnVal.val = op1.val + op2.val;\n      return returnVal;\n\
  \   }\n   public static AddClass1 operator ‐(AddClass1 op1)\n   {\n      AddClass1\
  \ returnVal = new AddClass1();\n      returnVal.val = ‐op1.val;\n      return returnVal;\n\
  \   }\n} \n```\n\n这两个运算符都作用于与类相同类型的操作数，并且其返回值也是该类型。然而，请考虑以下类定义：\n\n```cs\n public\
  \ class AddClass1\n{\n   public int val;\n   public static AddClass3 operator +(AddClass1\
  \ op1, AddClass2 op2)\n   {\n      AddClass3 returnVal = new AddClass3();\n    \
  \  returnVal.val = op1.val + op2.val;\n      return returnVal;\n   }\n}\npublic\
  \ class AddClass2\n{\n   public int val;\n}\npublic class AddClass3\n{\n   public\
  \ int val;\n} \n```\n\n这将允许以下代码运行：\n\n```\n AddClass1 op1 = new AddClass1();\nop1.val\
  \ = 5;\n AddClass2 op2 = new AddClass2();\nop2.val = 5;\n AddClass3 op3 = op1 +\
  \ op2; \n```\n\n在适当的情况下，你可以这样混合类型。但请注意，如果你向 `AddClass2` 添加了相同的运算符，那么前面的代码将会失败，因为对于使用哪种运算符将产生歧义。因此，你应该小心不要在多个类中添加具有相同签名的运算符。\n\
  \n此外，如果你混合了类型，操作数的提供顺序必须与运算符重载参数的顺序一致。如果你尝试以错误的顺序使用重载的运算符，该操作将失败。例如，你不能这样使用运算符：\n\
  \n```\n AddClass3 op3 = op2 + op1; \n```\n\n除非当然，你提供了另一个参数反转的重载版本：\n\n```cs\n public\
  \ static AddClass3 operator +(AddClass2 op1, AddClass1 op2)\n{\n   AddClass3 returnVal\
  \ = new AddClass3();\n   returnVal.val = op1.val + op2.val;\n   return returnVal;\n\
  } \n```\n\n以下运算符可以被重载：\n\n- **一元运算符** — `+`, `磅`, `!`, `~`, `++`, `磅磅`, `true`,\
  \ `false`\n- **二元运算符** — `+`, `磅`, `*`, `/`, `%`, `&`, `|`, `^`, `<<`, `>>`\n- **比较运算符**\
  \ — `==`, `!=`, `<`, `>`, `<=`, `>=`\n\n你不能重载赋值运算符（例如 `+=`），但这些运算符使用它们简单的对对应运算符（如\
  \ `+`），所以你不需要担心这个。重载 `+` 意味着 `+=` 将按预期运行。`==` 赋值运算符不能重载，因为它是一个比较运算符。\n\n\n\n现在你将再次升级\
  \ `Ch11CardLib` 项目，为 `Card` 类添加运算符重载。你仍然可以在本章节代码下载包的 `Ch11CardLib` 文件夹中找到后续这些类的代码。不过首先，你将为\
  \ `Card` 类添加额外的字段，以支持王牌以及将将牌视为大大的选项。你将这些字段设置为静态（static），因为当它们被设置时，它们适用于所有的 `Card`\
  \ 对象：\n\n```csharp\n public class Card\n   {\n      /// <summary>\n      /// 王牌使用的标记。如果为\
  \ true，王牌的价值高于\n      /// 其他花色的牌。\n      /// </summary>\n      public static bool\
  \ useTrumps = false;\n\n      /// <summary>\n      /// 当 useTrumps 为 true 时，使用的王牌色。\n\
  \      /// </summary>\n      public static Suit trump = Suit.Club;\n\n      ///\
  \ <summary>\n      /// 决定 A 是大于 K 还是小于 2 (deuces) 的标记。\n      /// </summary>\n \
  \     public static bool isAceHigh = true; \n```\n\n这些规则适用于应用程序中每个 `Deck` 里的所有 `Card`\
  \ 对象。不可能拥有两套牌，它们各自包含的牌遵循不同的规则。不过对于这个类库来说没关系，因为你可以安全地假设，如果一个应用程序想要使用不同的规则，它可以自己维护这些规则，例如在切换牌组时设置\
  \ `Card` 的静态成员。\n\n由于你已经这样做了，在 `Deck` 类中多添加几个构造函数以初始化具有独特特征的牌组是值得的：\n\n```csharp\n\
  \ /// <summary>\n      /// 非默认构造函数。允许将 A 设置为大。\n      /// </summary>\n      public\
  \ Deck(bool isAceHigh) : this()\n      {\n         Card.isAceHigh = isAceHigh;\n\
  \      }\n\n      /// <summary>\n      /// 非默认构造函数。允许使用王牌色。\n      /// </summary>\n\
  \      public Deck(bool useTrumps, Suit trump) : this()\n      {\n         Card.useTrumps\
  \ = useTrumps;\n         Card.trump = trump;\n      }\n\n      /// <summary>\n \
  \     /// 非默认构造函数。允许将 A 设置为大并使用王牌色。\n      /// </summary>\n      public Deck(bool\
  \ isAceHigh, bool useTrumps, Suit trump) : this()\n      {\n         Card.isAceHigh\
  \ = isAceHigh;\n         Card.useTrumps = useTrumps;\n         Card.trump = trump;\n\
  \      } \n```\n\n这些构造函数都是通过使用第 9 章所示的 `: this()` 语法定义的，因此在所有情况下，默认构造函数都会在非构造函数之前调用，从而初始化牌组。\n\
  \n现在为 `Card` 类添加你的运算符重载（以及建议的重写）：\n\n```csharp\n public static bool operator ==(Card\
  \ card1, Card card2)\n         => (card1?.suit == card2?.suit) && (card1?.rank ==\
  \ card2?.rank);\n\n      public static bool operator !=(Card card1, Card card2)\n\
  \             => !(card1 == card2);\n\n      public override bool Equals(object\
  \ card) => this == (Card)card;\n\n      public override int GetHashCode()\n    \
  \                  => 13 * (int)suit + (int)rank;\n\n      public static bool operator\
  \ >(Card card1, Card card2)\n      {\n         if (card1.suit == card2.suit)\n \
  \        {\n            if (isAceHigh)\n            {\n               if (card1.rank\
  \ == Rank.Ace)\n               {\n                  if (card2.rank == Rank.Ace)\n\
  \                     return false;\n                  else\n                  \
  \   return true;\n               }\n               else\n               {\n    \
  \              if (card2.rank == Rank.Ace)\n                     return false;\n\
  \                  else\n                     return (card1.rank > card2?.rank);\n\
  \               }\n            }\n            else\n            {\n            \
  \   return (card1.rank > card2.rank);\n            }\n         }\n         else\n\
  \         {\n            if (useTrumps && (card2.suit == Card.trump))\n        \
  \       return false;\n            else\n               return true;\n         }\n\
  \      }\n\n      public static bool operator <(Card card1, Card card2)\n      \
  \       => !(card1 >= card2);\n\n      public static bool operator >=(Card card1,\
  \ Card card2)\n      {\n         if (card1.suit == card2.suit)\n         {\n   \
  \         if (isAceHigh)\n            {\n               if (card1.rank == Rank.Ace)\n\
  \               {\n                  return true;\n               }\n          \
  \     else\n               {\n                  if (card2.rank == Rank.Ace)\n  \
  \                   return false;\n                  else\n                    \
  \ return (card1.rank >= card2.rank);\n               }\n            }\n        \
  \    else\n            {\n               return (card1.rank >= card2.rank);\n  \
  \          }\n         }\n         else\n         {\n            if (useTrumps &&\
  \ (card2.suit == Card.trump))\n               return false;\n            else\n\
  \               return true;\n         }\n      }\n\n      public static bool operator\
  \ <=(Card card1, Card card2)\n             => !(card1 > card2); \n```\n\n这里没什么特别需要注意的，也许\
  \ `>` 和 `>=` 重载运算符的代码稍微有点长。如果你单步执行 `>` 的代码，你可以看到它是如何工作的，以及为什么这些步骤是必要的。\n\n你正在比较两张牌，`card1`\
  \ 和 `card2`，其中假设 `card1` 是先放在桌上的第一张。正如之前讨论的，当你使用王牌时，这一点变得非常重要，因为王牌会胜过非王牌，即使非王牌的点数更高。当然，如果两张牌的花色相同，那么花色是否为王牌色就无关紧了，所以这是你做的第一次比较：\n\
  \n```csharp\n public static bool operator >(Card card1, Card card2)\n{\n   if (card1.suit\
  \ == card2.suit)\n   { \n```\n\n如果静态标记 `isAceHigh` 为 `true`，那么你不能直接通过在 `Rank` 枚举中的值来比较牌的点数，因为在在该枚举中，A\
  \ 的点值为 `1`，这小于所有其他点数的值。相反，请使用以下步骤：\n\n- 如果第一张牌是 A，那么检查第二张牌是否也是 A。如果是，那么第一张牌就不会大于第二张。如果第二张不是\
  \ A，那么第一张牌获胜：\n```csharp\n     if (isAceHigh)\n\n                {\n           \
  \        if (card1.rank == Rank.Ace)\n                   {\n                   \
  \   return false;\n                      else\n                         return true;\n\
  \                   } \n```\n\n- 如果第一张牌不是 A，那么你还需要检查第二张牌是否是 A。如果是，那么第二张牌获胜；否则，你可以比较点数，因为你已经不需要担心\
  \ A 的问题：\n```csharp\n     else\n\n                   {\n                      if\
  \ (card2.rank == Rank.Ace)\n                         return false;\n           \
  \           else\n                         return (card1.rank > card2?.rank);\n\
  \                   }\n\n                } \n```\n\n- 如果 A 不是大，那么只需要比较点数即可：\n```csharp\n\
  \     else\n\n                {\n                   return (card1.rank > card2.rank);\n\
  \                } \n```\n\n代码的剩余部分涉及 `card1` 和 `card2` 花色不同的情况。在这里，静态的 `useTrumps`\
  \ 标记非常重要。如果该标记为 `true` 且 `card2` 是王牌色，那么你可以断定 `card1` 不是王牌（因为两张牌的花色不同）；而王牌总是获胜，所以\
  \ `card2` 是较大的牌：\n```csharp\n else\n   {\n      if (useTrumps && (card2.suit ==\
  \ Card.trump))\n         return false; \n```\n\n如果 `card2` 不是王牌（或者 `useTrumps` 为\
  \ `false` ），那么 `card1` 获胜，因为它是先放在桌上的那张：\n```csharp\n else\n         return true;\n\
  \n   }\n\n} \n```\n\n只有一个另一个运算符（`>=` ）使用了与此类似的代码，其他运算符非常简单，因此没有必要对它们进行更多详细的介绍。\n\
  \n\n\n\n以下简单的客户端代码测试了这些运算符。只需将其置于客户端项目的 `Main()` 方法中进行测试，就像之前在 `CardLib` 示例中显示的客户端代码一样（你可以在\
