  \ 和 .NET Core\n\n## 跨平台基础和关键术语\n\n跨平台程序是指运行在多个操作系统上的程序，操作系统例如 Microsoft Windows、Android、Mac\
  \ OS 和 Linux。目标是程序编写一次，在支持的操作系统上编译，并在部署时，代码在每个目标操作系统上的执行、性能和行为都是相同的。在历史上，这很难实现，即使使用\
  \ Mono 或 Java 这样的开源库也是如此，并且如所述，使用完整的 .NET Framework 并不可行。许多复杂性源于跨平台代码与操作系统服务（如磁盘\
  \ I/O、安全协议和网络访问）交互的方式。\n\n当程序员开始投入更多精力编写可以轻松跨平台的 C# 代码时，请考虑这些许多必须掌握的概念和术语，以建立坚实的基础。这些关键术语在表\
  \ 18-1 中标识并描述。\n\n| 关键术语 | 描述 |\n| --- | --- |\n| 硬件平台 | X86、64 位、Itanium、ARM 等\
  \ |\n| 软件平台 | 操作系统：Windows、Linux、Android、Mac OS、iOS 等 |\n\n\n\n\n\n| 术语 | 说明 |\n\
  | :--- | :--- |\n| 跨平台 (Cross platform) | 编写代码，并在编译为目标平台后运行在任何支持的硬件和软件平台组合上 |\n\
  | 生态系统 (Ecosystem) | 社区资源、开发工具和运行时软件的结合 |\n| 栈 (Stack) | 用于构建和运行程序的硬件、软件和生态系统的组合（例如：Windows\
  \ 栈、Linux 栈等） |\n| API | 应用程序编程接口（API），暴露类、委托、枚举、接口和结构以供其他程序调用 |\n| 程序集 (Assembly)\
  \ | 一个 `.dll` 文件，暴露可供其他程序集或可执行文件使用的 API |\n| 标准 (Standard) | API 的正式规范或契约 |\n| 垂直领域\
  \ (Verticals) | Windows Forms、ASP.NET、WPF、UWP 等；通常称为应用模型 |\n| 框架/库 (Framework/library)\
  \ | 以程序集形式存在的、用于创建特定垂直领域程序的 API 包容性集合 |\n| 开源 (Open Source) | 由软件开发者开源社区编写并支持的框架和代码库。这些库可以根据特定开源库的许可证进行使用\
  \ |\n| GitHub | 一个在线开源代码托管平台，用于共享、更新和分叉公开以及受社区支持的代码 |\n| 分叉 (Forking) | 也称为 `branch`（分支），但也暗示了开发社区的分裂。它是现有源代码库的副本，用于开始新的独立开发。例如，.NET\
  \ Core 是 .NET Framework 的一个分支 |\n| 版本 (Version) | 框架的每个版本都包含新的或增强的 API 以及可能的错误修复\
  \ |\n| 语义化版本控制 (Semantic versioning) | 一种描述此格式变化规模和类型的概念：`[MAJOR].[MINOR].[PATCH]`。如果\
  \ `MAJOR` 数字发生变化，其对版本的影响比 `MINOR` 变化更大 |\n| 目标框架 (Target framework) | 程序所依赖的 API\
  \ 集合，例如：`dotnet-sdk-2.0.4-win10-x64` |\n| TFM | 目标框架标识符（TFM）是目标框架的简缩版本，例如：`netstandard2.0`\
  \ 或 `netcoreapp2.0`。TFM 通常用于将程序指向特定的框架版本 |\n| 依赖 (Dependencies) | 程序编译或完成任务所需的特定程序集组\
  \ |\n| 元数据 (Metadata) | 提供有关其他数据的数据，例如：创建日期、作者和文件大小 |\n| 包 (Package) | 一组程序集和元数据\
  \ |\n| 元包 (Metapackages) | 一组相互依赖的包，但其本身没有库或程序集 |\n| NuGet | 用于 .NET 的包管理器，帮助开发者创建和消费包\
  \ |\n| BCL | 基类库（BCL）是类、接口和值类型的常用集合。例如，`System.*` 指令中的类、接口、方法和值类型 |\n| PCL | 可迁移类库（PCL）是一种可以在许多\
  \ .NET 垂直领域中运行而无需重新编译的类库 |\n| 运行时 (Runtime) | 托管语言运行时（CLR）。CLR 管理内存分配（垃圾回收）、编译和执行\
  \ |\n| CoreCLR | 与 CLR 相同，但可以跨平台运行。它是 .NET Core 的公共语言运行时引擎 |\n| CoreFX | .NET Core\
  \ 的 `System.*` 命名空间，它们对运行时有强依赖关系 |\n| CoreRT | 类似于 CoreCLR 的运行时，但不包含 JIT 编译器。程序以\
  \ AOT 方式编译（参见 .NET Native），在此期间所有不必要的代码和元数据都会被移除 |\n| .NET Native | 创建经 AOT 编译的原生代码，通常用于\
  \ UWP 开发 |\n\n**[表 18-1]:** 跨平台关键术语\n\n在充分理解这些关键术语后，是时候进入名为 .NET Standard 和 .NET\
  \ Core 的微软新跨平台库和框架的世界了。\n\n## 什么是 .NET STANDARD，为什么需要它？\n\n如图 18-1 所示，开发者和公司可以针对许多垂直领域或应用模型来目标化程序的运行环境。例如，Windows\
  \ Forms、ASP.NET 和 WPF 基于完整的 .NET Framework，而 Windows Phone 利用 .NET Compact Framework，通用\
  \ Windows 应用程序（Universal Windows Apps）则基于 .NET Native 库。\n\n![一张显示 .NET Compact\
  \ Framework、.NET Core、.NET Microframework 等的图示说明。](img/Image00218.jpg)\n\n**图 18-1**\n\
  \n图 18-1 所示的 .NET Compact Framework、.NET Core、.NET Microframework 等都包含了某种类型的基类库（BCL）能力，这些能力是从完整的\
  \ .NET Framework 分叉而来的。\n\n以 .NET Microframework 分支为例。该分支带有精简的 BCL，专门设计用于在小型物联网（IoT）设备的限制内运行，因为在这些硬件平台上，完整的\
  \ .NET Framework 占用空间实在太大了，无法成为一个可行的库。该框架版本对于这些小型设备来说消耗了太多的驱动器和内存空间。该分支的创建减少了尺寸和内存需求，使其能够在该平台上适配并运行。为了减小\
  \ .NET Microframework 的尺寸，完整 .NET Framework 中常见的某些功能被删除了。这些最小化和/修改的功能需要开发者学习该框架垂直领域\
  \ BCL 的细微差别。每个应用模型都有略有不同的需求，这就是从 .NET Framework 分叉出大多数分支的原因。\n\n当开发者想要一个程序既能在 Windows\
  \ PC、Windows Phone 上运行，又能作为通用 Windows 应用程序运行时时，在历史上，需要为这三个垂直领域中的每一个领域准备多个项目和源代码。如前所述，在大多数情况下，不同垂直\
  \ BCL 在功能实现上的差异是独特的，特别是在安全、网络、远程调用、反射和文件访问等方面。这要求开发者学习、开发和支持每个垂直领域的 BCL 限制，这也为公司增加了额外成本。这些成本是由于需要对同一个程序的多个版本进行开发、测试、部署和支持产生的。\n\
  \n同样注意图 18-1，每个应用模型使用的每个 .NET Framework 运行时（Compact、Micro、Silverlight、Core 等）对于在目标领域和平台上成功运行程序都是必要的。当开发者决定针对某个领域时，会在\
  \ Visual Studio 创建解决方案和项目时选择目标框架。因此，每个垂直领域将在自己的运行时或虚拟机中执行，并必须针对目标应用模型进行编译、部署相关组件，并使用\
  \ .NET Framework 支持的语言进行编程。在针对 .NET Standard 类库时，情况也是如此。\n\n### 共享项目、PCL 和 .NET\
  \ Standard\n\n\n\n\n\n在 .NET Standard 和可移植类库（PCL）之前（这两者将在后文中进行描述），存在*共享项目*（shared\
  \ projects），在这些项目中，通常使用 `#if`、`#else` 和 `#endif` 指令来标识代码运行的软件或硬件平台，然后为该平台加载正确的程序集。例如，下面的代码段检查了平台是否为\
  \ .NET Framework 4.0。如果是，则使用对 `System.Net` 的引用；如果不是，则引用 `System.Net.Http`。（该代码确实假设了没有早于\
  \ 4.0 的 .NET Framework 版本。）在代码或类文件的后续部分，开发者必须再次检查平台依赖项并调用这些类中的方法以实现程序目标，例如使用 `WebClient()`\
  \ 或 `HttpClient()` 方法。这些方法处理出站或入的 HTTP 请求和响应。这两个方法根据所加载的 .NET Framework 版本具有不同的实现方式。\n\
  \n```\n#if NET40\n\n   using System.Net;\n\n#else\n\n   using System.Net.Http;\n\
  \n   using System.Threading.Tasks;\n\n#endif \n```\n\n除了软件运行时验证外，开发者还可以使用这些指令（`#if`、`#else`\
  \ 和 `#endif`）来确定不同的硬件平台并根据结果加载特定的二进制文件。\n\n```\n#if PLATFORM_X64\n\n   [DllImport(\"\
  BLIB64.dll\", CallingConvention=CallingConvention.Cdecl)]\n\n#else\n\n   [DllImport(\"\
  BLIB32.dll\", CallingConvention=CallingConvention.Cdecl)]\n\n#endif \n```\n\n使用\
  \ `#if`、`#else` 和 `#endif` 指令提供跨平台支持从来不是一种可靠、可扩展、可维护或易于支持的方法。程序最终产生了许多代码路径，当软件或硬件组件更改时，需要大量的更新和复杂的测试程序。随着对多个垂直领域和平台目标的需求增加，迫切需要一种跨平台支持的新解决方案。由于这种需求，可移植类库（PCL）的概念应而生。PCL\
  \ 在很大程度上解决了扩展性、维护、测试和支持性问题。在创建 PCL 时，开发者可以从目标垂直列表中进行选择（参见图 18-2），并且工具（例如 Visual\
  \ Studio）会为每个不同的应用程序模型生成特定 BCL 中的 API。注意，你还可以安装额外的目标，如 Xamarin、Unity 以及其他支持的全功能\
  \ .NET Framework 版本。\n\n![截图插图显示，创建 PCL 时，开发者可以从目标垂直列表中进行选择，工具（Visual Studio）会生成\
  \ API。](img/Image00219.jpg)\n\n**图 18-2**\n\n如果你留在 Windows 堆栈和生态系统中，PCL 运行得良好。问题在于\
  \ Windows 操作系统具有该操作系统独有的功能。其中一个此类功能就是注册表，其他操作系统要么没有注册表，要么具有类似但又不同的功能，以至于无法与为读取和写入\
  \ Windows 注册表设计的 PCL 。此外，Windows 实现反射的方式与其他操作系统不同，并且在应用程序域（即 `AppDomain`）方面具有不同的概念。`AppDomain`\
  \ 是进程内部的一个隔离层。因此，使用 PCL 确实有助于解决为多个 Windows 垂直领域进行开发的问题，但无法实现完全的软件和硬件跨平台支持。\n\n解决方案是结合\
  \ .NET Core 创建 .NET Standard 库。（有关 .NET Core 的详情请参见下一节）。.NET Standard 是一组 .NET API，旨在用于所有\
  \ .NET 垂直领域。如图 18-3 所示，它替换了每个分支或框架垂直领域的各种 BCL 特有的实现细节。.NET Standard 类库统一了所有 .NET\
  \ Framework 垂直领域的 BCL。\n\n![结合 .NET Core 创建 .NET Standard 库的图解插图。](img/Image00220.jpg)\n\
  \n**图 18-3**\n\n与 PCL 类似，在创建类期间，程序员选择要目标的 .NET Framework 分支（Compact、Micro、Silverlight、Core\
  \ 等），而在创建 .NET Standard 类库时，选择的是 .NET Standard 目标版本。正如在接下来的“引用和目标目标框架”节中详细讨论的那样，程序员根据所需的目标框架选择\
  \ .NET Standard 的版本，版本越高，应用程序模型可以运行的平台数量就越少。\n\n最后，.NET Standard 1.0 暴露的 API 很少；但随着\
  \ .NET Standard 2.0 的发布，API 的数量达到了约 33,000 个。你可以将 API 视为 .NET Framework 命名空间内的方法。支持的命名空间及其内部可用\
  \ API 数量的要概述见表 18-2。\n\n| **命名空间** | **#API 数量** |\n| --- | --- |\n| `System` |\
  \ 1,087 |\n| `System.Collections` | 292 |\n| `System.Data` | 1,399 |\n| `System.IO`\
  \ | 275 |\n| `System.Net` | 1,271 |\n| `System.Security.Authentication` | 11 |\n\
  | `System.Web` | 32 |\n| `System.XML` | 1,011 |\n\n**表 18-2** : .NET Standard 2.0\
  \ 命名空间与计数\n\n有关 .NET Standard 2.0 可用的 API 详细列表，请查看此页面：[`https://github.com/dotnet/standard/blob/versions/netstandard2.md`](https://github.com/dotnet/standard/blob/versions/netstandard2.md)。.NET\
  \ Standard 类库的目的以及行业向更大跨平台支持的演进历史现在应该明确。但仍然是面向 Windows 的，这就是框架出现的地方。\n\n## 引用和目标目标框架\n\
  \n决定实现哪个版本的 .NET Standard 的关键因素是类库必须运行在哪些平台上。意识到如表 18-3 所示，选择的 .NET Standard 版本越高，可用的\
  \ API（表 18-2）就越多，但因此运行的平台越少。\n\n| **框架** | | | | | |\n| --- | --- | --- | --- |\
  \ --- |\n| .NET Standard | 1.1 | 1.2 | 1.4 | 1.5 | 2.0 |\n| .NET Core | 1.0 | 1.0\
  \ | 1.0 | 1.0 | 2.0 |\n| .NET Framework (.NET Core 2.0) | 4.5 | 4.5.1 | 4.6.1 |\
  \ 4.6.1 | 4.6.1 |\n| Mono | 4.6 | 4.6 | 4.6 | 4.6 | 5.4 |\n| Xamarin.iOS | 10 |\
  \ 10 | 10 | 10 | 10.14 |\n| Xamarin.Android | 7.0 | 7.0 | 7.0 | 7.0 | 8.0 |\n| UWP\
  \ | 10 | 10 | 10 | vNext | vNext |\n\n**表 18-3** : .NET Standard 支持版本摘要\n\n设想你的\
  \ .NET Standard 类库需要运行，目标是 .NET Core 1.0、.NET Framework 4.5.1 和 Xamarin.Android\
  \ 7.0 框架。在这种情况下，.NET Standard 类库必须目标 .NET Standard 版本 1.2，因为该版本支持所有这些框架。考虑所有之前的框架保持相同，但排除\
  \ 4.6.1 的 .NET Framework。因此，.NET Standard 类库应该目标版本 1.4。如果 .NET Framework 需要关注版本\
  \ 4.5，请知道 4.5 的功能存在于 4.6.1 中；因此不需要向下兼容，因为 API 已汇编到新版本中。\n\n\n\n\n\n不同 .NET Standard\
  \ 版本之间的公开 API 差异巨大。如表 18‐2 所示，`cross platform`意味着代码编写一次，即可在任何支持的硬件和软件平台上运行。然而，必须针对特定的硬件和软件平台，为这些特定平台编译代码并包含特定的运行时。但是，代码只需要编写一次。如图\
  \ 18‐5 所示，可以下载 Windows (x64)、Windows (x86)、MacOS 和 Linux 的 .NET Core 2.0 SDK。\n\n\
  要为 Windows、MacOS 或 Linux 使用 .NET Core SDK，你需要一台运行这些操作系统之一的计算机，以及一个支持 .NET Core SDK\
  \ 以供你的代码使用的 IDE。一个用于 .NET Core 开发非常流行的 IDE 是 Visual Studio Code，可以从 `https://code.visualstudio.com`\
  \ 下载（参见图 18‐6）。Visual Studio Code 具有强大的调试功能并支持 IntelliSense。\n\n![截图插图显示一个用于 .NET\
  \ Core 开发非常流行的 IDE 是 Visual Studio Code，可以从 https://code.visualstudio.com 下载](img/Image00223.jpg)\n\
  \n**图 18‐6**\n\n书中目前为止的练习使用了 Visual Studio Community。由于这是一本针对微软的书籍，将继续使用 Visual\
  \ Studio Community，因为练习是在运行 Windows 操作系统系统的计算机上执行的。但请不要，在 Windows 计算机上使用针对 windows\
  \ 目标并使用 .NET Core 框架编写的代码，可以在 Mac 或 Linux 机器上编译并在那里执行。\n\n有一个已经讨论过但值得再次提到的话题是：特定操作系统的特性（例如存在于\
  \ `System.IO` 命名空间中的特性）必须针对为目标操作系统编译的 `System.IO.dll` 进行编译。因此，如果你在 Linux 计算机上的 Visual\
  \ Studio Code 中创建一个项目并包含 `System.IO` 命名空间，它将是 Linux OS 运行所需的那个。在本节稍后介绍的 NuGet 将帮助确保你的项目获取正确的平台版本二进制文件。\n\
  \n## 开源\n\n.NET Core 框架的源代码位于 `https://github.com/dotnet/core`。任何开发者（或任何能阅读代码的人）都可以查看它并具体了解它的功能。此外，个人可以与其他协作，搜索、识别甚至修复代码中的错误或问题。注意，完整的\
  \ .NET Framework 的源代码可以在 `http://referencesource.microsoft.com` 找到，但它不是开源的，因此无法对其进行分支，也无法构建/编译该完整框架的版本。不要假设你需要克隆或下载\
  \ .NET Core GitHub 仓库并进行构建和编译来使用它。如之前提到的（参考图 18‐5），可以下载并安装微软创建的稳定编译版本。\n\n如果在 .NET\
  \ Core 源代码中发现缺少方法或类，或者你的应用程序为了优化运行所需的某些内容——这就是开源的酷之处——你可以添加它。在创建分支（fork）时，添加代码优化并让社区知道已完成。如果优化被接受，它就可以放入主分支并包含在下一个版本中。如果优化未被接受，也可以编译并构建一个该版本。最后，通过使\
  \ .NET Core 开源，微软真正地参与了开发者社区，他们他们贡献和促进职业发展的绝佳机会。\n\n## 针对云进行优化\n\n回想第 16 章，该章节讨论了云优化栈。定义云优化堆栈的属性有：\n\
  \n- 可移植性 (Portability)\n- 可扩展性 (Scalability)\n- 大小且紧凑\n- 模块化（并排执行）\n- 韧性 (Resiliency)\n\
  \n.NET Core 具有可移植性并且它是完全跨平台的。当编译 .NET Core 程序时，只有运行所需的所需的二进制文件会被封装到程序集或可执行文件中，使其非常容易在额外的硬件上复制和运行。因为代码是完整的\
  \ .NET Framework 的分支，这是一个经过时间考验和高度工程化的程序语言库，所以代码对瞬时故障具有韧性。.NET Core 库和运行时的尺寸及速度也经过了优化，考虑到在云端客户是根据使用量（即消耗）付费，这非常重要。因此，如果程序占用空间小且运行快，所需的计算能力就越少，成本就会降低。\n\
  \n## 性能\n\n与完整的 .NET Framework 相比，.NET Core 提供了许多性能改进。许多优化想法源自开源社区。现在，开发者不再需要绕过性能问题，而是可以查看导致缓慢的源代码并对其优化。检查\
  \ COREFX 和 CORECLR GitHub 仓库中包含“performance”的请求，你会发现数千处更改。某些示例如表 18‐4 所示。\n\n| **命名空间\
  \ / 模块** | **性能提升** |\n| --- | --- |\n| `System.Runtime.Serialization` | 12x |\n\
  | `System.Security.Cryptography` | 2x |\n| `System.IO.Compression` | 4x |\n| `System.Linq`\
  \ | up to 30x |\n| `System.Collections.Concurrent.CollectionBag<T>` | 30% |\n| `System.Collections.Generic.List<T>`\
  \ | 25% |\n| `System.Collections.Generic.SortedSet<T>` | 600x |\n| `System.Collections.Generic.Queue<T>`\
  \ | 2x |\n| `System.Text.RegularExpressions` | 25% |\n\n\n\n\n\n# 表格 18‐4 : .NET\
  \ Core 相对于 .NET Framework 的性能改进\n\n已经进行了许多优化，随着更多的开发者和公司采用并贡献，该库将继续变得越来越好。访问 [`https://blogs.msdn.microsoft.com/dotnet/2017/06/07/performance‐improvements‐in‐net‐core/`](https://blogs.msdn.microsoft.com/dotnet/2017/06/07/performance&#8208;improvements&#8208;in&#8208;net&#8208;core/)\
  \ 查看关于 .NET Core 性能改进的讨论。\n\n## 模块化设计\n\n创建一个新的 .NET Core 2.0 项目时（将在接下来的“尝试一下”中完成），项目将包含一组“标准”依赖项，当您展开依赖项（Dependencies）![image](img/Image00008.gif)\
  \ SDK ![image](img/Image00008.gif) `Microsoft.NetCore.App` 时可以看到这些项，如图 18‐7 所示。尽管项目包含超过\
  \ 100 个程序集，但在编译时，只有程序运行所需且被引用的程序会被包含在程序集或可执行文件中。\n\n![一个新的 .NET Core 2.0 项目的截图说明，当我们展开依赖项\
  \ ⭮展开 SDK ⭮展开 Microsoft.NetCore.App 时，它包含一组“标准”依赖项。](img/Image00224.jpg)\n\n**图\
  \ 18‐7**\n\n.NET Core 通过一组 NuGet 包交付。这些“标准”或默认项目程序集的存在是为了支持某些场景，例如，开发者的计算机没有连接互联网，因此无法下载和安装基本的\
  \ NuGet 包。然而，这些默认程序集确保了在创建 .NET Core 2.0 项目后，在推进工作上出现阻碍。\n\n在接下来的“尝试一下”中，您将创建一个控制台应用程序\
  \ (.NET Core) 并使用 NuGet 添加一个不属于默认项目程序集的 .NET Core 包。\n\n使用具指定的程序集和版本号通过 NuGet 安装包是\
  \ .NET Core 具有模块化的原因。这种模块化设计对下一节讨论的应用程序部署和框架更新功能具有巨大影响。\n\n## 自包含部署模型\n\n完整的 .NET\
  \ Framework 最常见的是安装在运行开发者创建的程序的计算机或服务器上。这样做的好处是框架只需安装一次，所有应用程序都可以根据需要引用并使用该框架，从而节省本地存储空间。然而，当所有应用程序都引用相同的框架程序集且执行了意外的更新时，可能会发生不利的情况，导致某些代码功能失效。\n\
  \n在完整版 .NET Framework 的范围内，有两种可区分的升级类型：并存升级（side-by-side）和就地升级（in-place）。并存升级是主版本的更改。例如，安装\
  \ .NET Framework 2.0 和 .NET Framework 4.0 将支持目标为 2.0 或 4.0 的程序。当对 CLR 和框架组件有重大修改或优化时，这种情况很常见。如果安装了目标为\
  \ .NET Framework 2.0 和 .NET Framework 4.0 的程序，受影响的风险很小，因为它是并存安装。相比之下，就地升级（例如从 .NET\
  \ Framework 4.5 升级到 .NET Framework 4.6.2）可能包含对 `mscorlib.dll` 以及其他 .NET 程序集的更改，这些程序集会在目标为\
  \ .NET Framework 4.x 的程序运行时被运行。\n\n.NET Core 通过“自包含”解决了这个问题，这也被称为 `application local\
  \ frameworks`（应用程序本地框架）。这意味着程序内部引用的程序集已包含在模块或可执行文件中，在部署时，程序拥有运行所需的所有程序集（运行时环境、编译器和引用的框架组件）。程序不再依赖于在机器范围内安装的任何\
  \ .NET Framework，而且对机器范围内的并存或就地 .NET Framework 版本的任何修改都不会对 .NET Core 程序产生影响。最后，由于程序集很小且紧凑（即针对云进行了优化），它们消耗的本地存储空间有限。\n\
  \n这意味着作为开发者和公司，一旦产品发布，就可以非常有信心地程序永远不会因为计算机或服务器上的框架升级而停止工作。在历史上，当发生破坏性升级时，开发者和 IT\
  \ 支持人员会被召集到升级会议中以在危机状态下解决此问题。这在企业中是非常复杂的情况，因为小组、团队和流程通常需要许多协议和批准才能对生产环境进行更改。通常做法是，开发完成后，代码的所有权将转移给支持部门，这正是复杂性和审批产生的基础。这些限制使得情况变得更具挑战性。\n\
  \n然而，当选择 .NET Core 作为框架时，这种危机模式的情况将不再发生。相反，升级仅在应用程序级别进行，在那里可以提前进行充分的开发、集成和性能测试。如果在开发周期中升级到新程序集版本时出现问题，开发者和公司就可以决定采取哪些行动。在开发环境中，决定升级代码以支持新版本，或回滚到升级之前运行良好的版本，要容易得多。\n\
  \n## 构建和打包 .NET Standard 类库\n\n.NET Standard 类库是一个可以在许多不同应用程序领域运行的 BCL。在接下来的“尝试一下”中，你将创建一个包含发牌所需类别的\
  \ .NET Standard 类库。\n\n在接下来的“尝试一下”中，你将打包上一个节创建的 .NET Standard 类库。该包将在第 19 章中通过 .NET\
  \ Core 应用程序进行消费。\n\n\n\n\n微软创建了一个名为 `API Portability Analyzer` 的工具。该工具会分析程序及其程序集，然后生成一份报告，识别出程序中任何不属于当前\
  \ `.NET Core` 框架的 API。你可以从 [`https://github.com/Microsoft/dotnet‐apiport/](https://github.com/Microsoft/dotnet-apiport/)\
  \ 下载该工具。该报告可以作为代码迁移到 `.NET Core` 的起点。\n\n从 `.NET Framework` 迁移到 `.NET Core` 时需要考虑的其他几点包括：\n\
  \n*   识别任何第三方依赖项\n*   了解哪些功能不可用\n*   升级当前的 `.NET Framework` 目标版本\n*   为程序选择目标平台\n\
  \n### 识别第三方依赖\n\n如前所述，`.NET Core` 框架支持跨平台（Windows、Linux、MacOS）以及跨多个芯片组（x64、x86、ARM）运行。`.NET\
  \ Core` 程序集被设计为针对这些目标进行编译时，可以在这些平台上运行并工作。然而，这并不意味着项目中所包含的所有程序集都是如此。第三方包可能仅支持在 32\
  \ 位（x86）进程模式下运行，或者没有可在 Linux 操作系统上运行的包。在这种情况下，开发者必须找到替代方案，或者联系第三方询问是否有提供此类支持的计划。\n\
  \n### 了解哪些功能不可用\n\n如果第三方程序集利用了 Windows 操作系统特定的技术，如 `AppDomains`、`Remoting`、`File\
  \ Access` 等，那么所包含的第三方程序集将无法按预期工作。这里有一份不支持的 API 列表：[`https://github.com/dotnet/corefx/wiki/ApiCompat`](https://github.com/dotnet/corefx/wiki/ApiCompat)。通过对比此列表并审查\
  \ `.NET Framework` 程序中包含的代码，你可以更深入地了解迁移到 `.NET Core` 的工作量可行性，并意识到跨平台运行的收益。\n\n###\
  \ 升级当前的 .NET Framework 目标\n\n除了将开发 IDE 升级到至少 `Visual Studio 2017` 之外，计划迁移到 .NET\
  \ Core 的个人或团队应额外考虑针对最高支持的 .NET Framework 版本。目前，在 `.NET Core 1.1` SDK 中运行时，`.NET\
  \ Core` 支持的最高 `.NET Framework` 版本是 `.NET Framework 4.6.2`。对于 `.NET Core 2.0`，最高支持版本是\
  \ `4.6.1`。请参见表 18‐3 的摘要，或在此查看完整列表：[`https://docs.microsoft.com/en‐us/dotnet/standard/net‐standard`](https://docs.microsoft.com/en-us/dotnet/standard/net-standard)。\n\
  \n通过这种方式升级可以确保程序中至少大部分代码对于之前的 .NET Framework 目标都有支持的 .NET Core API。如果由于某些原因，原始程序中的\
  \ API 在 .NET Core 项目中不存在，有以下选项：\n\n*   参考前一节“了解哪些功能不可用”。\n*   确认 `ApiPort` 报告中已识别出该\
  \ API。\n*   保留当前的框架版本，直到该 API 被添加。回想 表 18‐3。\n\n### 为程序选择目标平台\n\nASP.NET 是一种使用服务器端代码动态创建网页的技术。这些网页的开发方式与客户端程序有许多相似之处。与其直接处理\
  \ HTTP 请求和响应并手动创建 HTML 代码发送到客户端，不如使用 ASP.NET 控件（如 `TextBox`、`Label`、`ComboBox` 和\
  \ `Calendar`），它们会自动创建 HTML 代码。\n\n\n\n\n在解决方案架构师或程序员决定运行其程序的最佳平台是网站之后，下一个问题是目标应该是哪种版本的\
  \ ASP.NET。微软 Web 开发平台的第一代是 Active Server Pages，简称 ASP。`ASP` 使用了包含在 `.asp` 文件中的类似于剃刀（razor-like）的语法，并且通常包含一个使用\
  \ `Service.CreateObject()` 进行初始化的嵌入 VB COM 对象，用于提供通过 API 暴露方法的引用。尽管 `ASP` 仍然是一项支持的技术，但它不会被推荐用于创建新的基于\
  \ Web 的程序的应用程序类型。\n\n当 `.NET Framework` 在 21 世纪初创建时，`ASP` 的自然演进是在更新 `ASP` `ASP`\
  \ 时利用该框架，并将其重命名为 `ASP.NET`。主要的变化是表示层（`.aspx` 文件）与业务逻辑层（`.aspx.cs` 或 `aspx.vb` 文件）的分离，通常被称为“代码后代码”（code-behind）。代码后代码支持的语言是\
  \ `C#` 和 `VB.NET`，`ASP.NET` 模型被称为 Web Forms（Web 表单）。`ASP.NET Web Forms` 过去是且现在仍然是针对\
  \ `IIS` 和 Windows Server 操作系统创建功能丰富且高度复杂的应用程序的有效且完全支持的技术。在多年的工程和功能改进中，人们明显感觉到 `ASP.NET\
  \ Web Forms` 显得有些沉重。“沉重”的具体含义将在稍后进行描述，但这种“沉重”的标签导致了新 `ASP.NET` 版本的开发，它被称为 `ASP.NET\
  \ MVC`。\n\n`ASP.NET MVC` 中的 `MVC` 代表模型-视图-控制器（Model-View-Controller）。如前，`ASP.NET\
  \ Web Forms` 将 `ASP` 代码分为两个不同的层：表示层和业务逻辑层。现在，`MVC` 将其拆分为第三层，这三层分别是：\n\n* `Model`\
  \ 模型——业务层\n* `View` 视图——表示层\n* `Controller` 控制器——输入控制层\n\n`ASP.NET MVC` 是 `ASP.NET\
  \ Web Form` 模型的逻辑迭代，但请注意 `ASP.NET MVC` 在设计、支持概念和实践方面显著不同。某些具有 `ASP.NET Web Form`\
  \ 背景的程序员可能从一开始就认为这些变化具有挑战性，但在深入研究并使用该模型后，清晰性开始扎根。本章中详细讨论每个 `ASP.NET` 版本的章节将更多介绍。\n\
  \n`ASP.NET` 家族最新添加的成员是 `ASP.NET Core`，它与 `.NET Core` 对齐正如 `ASP.NET` 对齐 `.NET Framework`。`ASP.NET\
  \ Core` 与 `.NET Core` 一样是一个开源框架和平台，可以针对 Microsoft Windows 以外的操作系统，例如 `Linux` 和 `MacOS`。`ASP.NET\
  \ Core` 支持 Web 应用程序和 Web 应用程序（模型-视图-控制器）项目类型。`ASP.NET Core Web Applications` 与 `ASP.NET\
  \ Web Pages` 版本类似，为小型网站的程序员提供了更简单、不那么复杂的实现；而 `ASP.NET Core Web Applications (MVC)`\
  \ 为跨平台运行 Web 应用程序提供了完整的 `MVC` 能力。\n\n总结来说，`ASP.NET Web API` 就像一个暴露 API 的 `.dll`。它没有表示层，只有调用暴露的\
  \ API 方法并传递所需参数的能力。API 方法调的结果是一个数据字符串，在 `ASP.NET Web API` 的上下文中，该字符串是 JSON 格式。调用客户端然后需要解析并以可用格式呈现\
  \ JSON 数据。现在已经描述了微软 Web 框架的进展和演变，请继续阅读以了解为什么要使用一个而不是另一个。\n\n### ASP.NET Web Forms\n\
  \n选择 `ASP.NET Web Forms` 而不是其他框架的原因是 Web Forms：\n\n* 最适合中小型开发团队和项目\n* 适用于需要在 HTTP\
  \ 上维护会话和状态的 Web 应用程序\n* 基于一组非常主动的请求管道事件\n\n与其它 `ASP.NET` 版本相比，`ASP.NET Web Forms`\
  \ 是快速开发和部署功能丰富且高性能 Web 应用程序的最佳且最简单的方法。表示逻辑与业务逻辑的分离与前端、用户界面开发人员和编码人员的目标技能集非常契合。这是最优的，因为团队可以由专家并行处理项目的各个方面进行工作。\n\
  \n`ASP.NET Web Forms` 通常因为一个名为 `viewstate` 的功能而被认为是“沉重的”。`viewstate` 是 `ASP.NET\
  \ Web Form` 中维护状态的一种方式。例如，考虑一个需要完成一系列页面并提交以放置订单的 Web 应用程序。如果客户端在过程某个点点击了后退按钮，`viewstate`\
  \ 是如何用原始输入的值重新填充以前表单内容的。`viewstate` 功能的问题在于它可能被滥用（即过度使用），导致页面大小极大，并在客户端和服务器之间往返。此外，`viewstate`\
  \ 默认对 `Page` 启用，而不是仅对需要维护状态的 页面控件启用。\n\n避免 `viewstate` 问题的最佳方法是通过将 `EnableViewState`\
  \ 属性设置为 `false` 在 `Page` 级别禁用它。如果你仍然需要在 `TextBox` 上维护状态（例如），请使用以下代码段专门启用它。此外，监控\
  \ `.aspx` 文件的尺寸以确保它们不会变得太大。\n\n```\n<asp:TextBox EnableViewState=\"true\" ID=\"\
  Name\" runat=\"server\"/>\n```\n\n没有会话是不可能维护状态的。维护状态源于客户端/服务器计算时代，那时计算机和服务器之间的连接是持久的。HTTP\
  \ 协议与无状态同义，最适合处理静态（即非动态）内容。\n\n`ASP.NET Web Forms` 是动态的，因为代码后文件（例如 `Default.aspx.cs`）中的\
  \ `C#` 代码在文件被请求时执行。传递给浏览器的 HTML 可能会根据执行的 `C#` 代码根据客户端的唯一输入而变化。HTML 也根据存储在会话 Cookie\
  \ 中的内容对每个客户端有所不同。ASP.NET Web Form 程序员使用以下语法将信息存储在会话中：\n\n```\nSession[\"username\"\
  ] = TextBoxUID.Text;\n```\n\n随后可以在随后的 HTTP 请求中使用以下代码访问名为 `username` 的会话变量：\n\n```\n\
  var username = Session[\"username\"];\n```\n\n最后，`ASP.NET Web Forms` 执行中的事件，例如 `BeginRequest`、`AuthenticateRequest`、`Init`、`Load`、`ProcessRequest`\
  \ 和 `EndRequest` 非常直观。这很重要，因为当程序员想要对客户端采取某些特殊操作或在请求之前清理任何数据时，很容易找到放置代码的位置。\n\n###\
  \ ASP.NET MVC\n\n选择 `ASP.NET MVC` 而不是其他应用程序类型的原因是：\n\n* 非常适合较大、更复杂的 Web 应用程序\n*\
  \ 与 `Entity Framework (EF)` 和模型绑定紧密结合\n* 深度集成测试驱动开发 (TDD)\n\n正如之前提到的，`ASP.NET Web\
  \ Forms` 被拆分为两个独立的模块，`ASP.NET MVC` 被拆分为三个：模型、视图和控制器（参见图 19-2）。有助于 `ASP.NET Web Forms`\
  \ 的相同原因同样有助于 `ASP.NET MVC`。组件的分离允许大型团队根据专业化分工并并行处理应用程序，从而带来更快的开发周期。\n\n\n\n\n\n\
  ![ASP.NET MVC 分为三个模块：模型（Model）、视图（View）和控制器（Controller）的示意图。](img/Image00233.jpg)\n\
  \n图 19-2\n\nEntity Framework (`EF`) 是一种对象关系映射（ORM）技术，在第 23 章中进行了讨论，它与 ASP.NET MVC\
  \ 架构和模型绑定紧密耦合。ORM，因此包括 `EF`，让开发者能够以面向对象的方式设计数据库。例如，如果一个 ASP.NET MVC 旨在存储关于人的信息，那么像下面的\
  \ `Person` 类就可以存储和检索这些信息。\n\n```c\n public class Person\n{\n  public string Name\
  \ { get; set; }\n  public int Age { get; set; }\n} \n```\n\n一旦设计了数据模型，开发者就可以将模型部署到数据库（如\
  \ `SQL Server`）中并生成数据结构。数据库表、主键和外键是根据 C# 类中的描述生成的。在 Visual Studio 中创建 ASP.NET MVC\
  \ 时，默认解决方案的一部分是一个名为 `Models` 的文件夹。这是 C# 类表示数据库表的地方。这些类用于将从数据库获取的数据存储在内存中，以便由从视图更新的控制器进行修改。在默认的\
  \ ASP.NET MVC 应用中，每个模型对应的还会有名为 `Controllers` 和 `Views` 的文件夹。\n\n控制器是开发者放置代码的地方，通过\
  \ `EF` 逻辑和绑定的 `Model` 对象（如 `Person`）来创建、读取、更新或删除数据库内容。控制器也是执行所需的任何业务逻辑、身份验证或任何其他活动的地方。视图是表现层，它将从客户端触发并在控制器中使用面向对象模型执行的动作输出结果呈现给客户端。\n\
  \nASP.NET MVC 与测试驱动开发技术深度集成，与 ASP.NET Web Forms 相比，进行单元测试要简单得多。如图 19-3 所示，当你创建一个\
  \ ASP.NET 应用时，有一个复选框可以选择，选择后的结果是创建一个专门用于程序单元测试的第二个项目。\n\n![选择复选框的示意图，创建 ASP.NET\
  \ 应用时会创建一个第二个项目。](img/Image00234.jpg)\n\n图 19-3\n\n通过将测试代码放在 `Tests` 项目中，可以将 `IIS`、数据库和外部类等依赖项从测试用例中抽象出来。这是一个重要且非常有益的特性，因为生产实例之间的数据通常不同，且运行\
  \ `IIS` 的服务器构建可能在生产环境和测试环境之间产生不一致的行为。移除这些依赖项——无论依赖状态如何，仅测试控制器内的逻辑——可以提高测试的速度和效率。这是因为开发者不需要将所有依赖项都保持在有效且稳定的测试状态（这非常耗时），而是只需确保测试场景能够成功完成即可。\n\
  \nASP.NET MVC 使用无扩展名的 URL：请求中不放置特定的文件名。ASP.NET Web Form 应用请求 `.aspx` 文件，但 ASP.NET\
  \ MVC 并非如此。ASP.NET MVC 使用路由的概念，使用 URL 段而不是文件名将请求路由到正确的控制器和视图。例如，对 `/Home/About`\
  \ 的请求将执行名为 `HomeController` 的控制器中的 `About()` 方法，该控制器位于 `Controllers` 文件夹中。`About()`\
  \ 方法的结果将位于 `Views\\Home` 目录下的 `About.cshtml` 视图呈现给客户端。\n\n### ASP.NET Web API\n\n\
  选择 ASP.NET Web API 的优点与 ASP.NET MVC 应用类似，即应用类型与 `EF` 紧密耦合，深度集成到 TDD 概念中，并且适用于大型复杂的\
  \ Web 应用。主要区别在于 ASP.NET Web API 的 Visual Studio 项目中没有视图组件或 `Views` 文件夹。这根据第 17 章中描述的\
  \ API 概念来说是完全合理的，即客户端调用 API 暴露的方法，该方法返回某些数据。客户端负责消费、响应和/或展示 API 的结果，结果通常为 JSON 格式。\n\
  \n### ASP.NET Core\n\n.NET Core 和 .NET Standard 的优点在第 18 章中进行了讨论。.NET Core 实现的优势也存在于\
  \ ASP.NET Core 应用类型中。以下是这些优势的示例：\n\n*   ASP.NET Core 跨平台运行。\n*   ASP.NET Core 不依赖于\
  \ `IIS`。\n*   ASP.NET Core 不依赖于完整的 .NET Framework。\n*   ASP.NET Core 针对云进行了优化，性能更高。\n\
  \n与 .NET Core 一，ASP.NET Core 可以在 Microsoft Windows 以外的操作系统上运行，如 `MacOS` 和 `Linux`。历史上，谈论任何\
  \ ASP.NET 应用类型时，它无疑与互联网信息服务 (`IIS`) 绑定。ASP.NET Core 包含一个名为 `Kestrel` 的新 Web 服务器，在“创建\
  \ ASP.NET Core 应用”部分有更详细的描述。ASP.NET Core 不需要也不依赖完整的 .NET Framework。相反，像 .NET Core\
  \ 一样，它只包含执行功能所需的程序集。\n\nRPS 性能测试是在相同的操作系统（Windows Server 2012）、相同的内存大小、CPU 速度和网卡上进行的。因此，性能差异归功于该应用类型特有的优化和执行效率。表\
  \ 19-1\n\n| 技术栈 | 每秒请求数 (RPS) |\n| :--- | :--- |\n| ASP.NET Web Forms 4.6 | 57,000\
  \ |\n| ASP.NET Core Kestrel | 310,000 |\n| Node.js | 105,000 |\n\n**表 19-1](#text00024.html_R_c19-tbl-0001):\
  \ 基于 Kestrel 的 ASP.NET Core\n\n### ASP.NET Web Site 与 ASP.NET Web 应用项目类型\n\n如图 19-4\
  \ 所示，一个新的 ASP.NET 应用有两种类型：项目（Projects）和站点（Web Sites）。\n\n![创建 ASP.NET 应用时有两种类型：项目和站点的截图示意图。](img/Image00235.jpg)\n\
  \n图 19-4\n\n它们之间的差异如表 19-2 所示。\n\n| 差异 | 项目 (Projects) | 站点 (Web Sites) |\n| :---\
  \ | :--- | :--- |\n| 文件结构 | C# 项目有一个 `.csproj` 文件，其中包含运行程序所需的文件列表和程序集引用。 | C# 创建的\
  \ Web 站点没有 `.csproj` 文件。目录结构中的所有文件都包含在站点中。 |\n| 编译 | 后置代码文件被编译成单个程序集（`.dll`）。 |\
  \ 源代码在首次被请求时动态编译。通常会产生多个程序集（`.dll`）。 |\n\n\n\n\n\n| Deployment | 程序汇集（`.dll`）、`.aspx`\
  \ 和 `.ascx` 文件被部署到运行应用程序的 Web 服务器。 | Web 应用程序源码副本被部署到 Web 服务器（`.aspx`, `.ascx` 和\
  \ `aspx.cs`）。 |\n\n**表 19-2 :** 项目（Projects）与站点（Web Sites）之间的差异\n\n### 文件结构\n\n\
  ASP.NET 项目的 `.csproj`（项目文件）提供了从项目中移除无需包含文件的功能，但该文件不会被永久删除。文件被从项目中排除但未被删除。如果需要进行部署但某些文件尚未准备就绪，这将非常有帮助。此外，正如你在上一章中所学的，项目文件用于存储关于用于创建\
  \ `NuGet` 程序包的 `.NET Standard` 类的信息。在 Web 站点（Web Sites）的上下文中，如果没有 `.csproj` 文件，站点目录结构内的所有文件都被视为解决方案的一部分。\n\
  \n### 编译\n\n在部署之前编译好 Web 应用程序项目，可以节省部署后第一次请求时编译 `.aspx` 文件及其后置代码（code-behind）的时间。虽然可以使用\
  \ `NGEN` 对 Web 站点进行预编译，但那种部署前的活动比简单手动发起第一次请求以让 `ASP.NET Runtime` 编译 ASP.NET 文件要复杂得多。\n\
  \n当编译后的程序集或 ASP.NET 项目加载到内存中时，整个 Web 应用程序都会消耗内存。相反，只有被请求的 Web 站点文件会被编译并加载到内存中。因此，随着时间的推移，一个实际上只使用少数页面的项目消耗的内存会比\
  \ Web 站点多，因为如前，只有被请求的文件会被编译并加载到内存中。当客户为云平台上的资源消耗付费时，这是一个重要的概念。\n\n### 部署\n\n当部署\
  \ Web 站点时，后置代码（`.aspx.cs`）中的源码以纯文本形式部署，并且是人类可读的。只要 Web 站点部署的位置是安全的，这就不是问题，但某些开发者或企业可能并不希望这样做。相反，对于项目来说，没有人类可读的代码部署到服务器上，因为它们都被编译成了程序集（`.dll`）。\n\
  \n此外，如果在作为 ASP.NET Web 应用程序项目部分的编译后程序集（`.dll`）加载到 `ASP.NET Runtime` 之后对项目进行更改，必须停止\
  \ `ASP.NET Runtime` 进程并从内存中卸载，更改才能对使用该站点的客户端生效。如果进程拥有程序集的句柄，则无法进行更改，因此必须停止以释放句柄。Web\
  \ 站点的情况不同，其 `.aspx` 文件是由 `ASP.NET Runtime` 编译的。ThisNow the the............... is\
  \ compiled to the the.................................. the ASP..。在阅读本节后，你将对以下内容有良好的理解：\n\
  \n*   输入验证\n*   状态管理\n*   身份验证\n\n### 服务器控件\n\n在本节中，你将学习有关控件。表 19-3 列出并描述了以下控件：\n\
  \n| **控件** | **HTML** | **描述** |\n| --- | --- | --- |\n| `Label` | `<span>` | 返回一个\
  \ `span`。 |\n| `TextBox` | `<input type=\"text\">` | 返回 `input`。 |\n| `Button` |\
  \ `<input type=\"submit\">` | 返回 `input`。 |\n| `HyperLink` | `<a>` | 创建锚点标签。 |\n\
  | `DropDownList` | `<select>` | 返回 `select`。 |\n| `CheckBox` | `<input type=\"checkbox\"\
  >` | 返回 `input`。 |\n| `RadioButton` | `<input type=\"radio\">` | 返回 `input`。 |\n\
  | `Image` | `<img>` | 返回 `img` 以显示文件。 |\n\n### 输入验证\n\n当用户输入数据时，应该检查其有效性。检查可以在客户端和服务器端进行。你可以使用\
  \ JavaScript 在客户端检查数据。然而，如果使用 JavaScript 在客户端检查数据，也应该在服务器端进行检查，因为你永远无法完全信任客户端。浏览器可以禁用\
  \ JavaScript，黑客可以使用不同的函数。在客户端检查数据可以获得更好的性能，因为在数据通过之前不会发生与服务器的往返。\n\n使用 ASP.NET，你不需要自己编写验证函数。存在许多验证控件，可以同时创建客户端和服务器端的验证。下面的示例了与文本框\
  \ `player1TextBox` 关联的 `RequiredFieldValidator` 验证控件。\n\n```\n<asp:TextBox ID=\"\
  player1TextBox\" runat=\"server\"></asp:TextBox>\n\n<asp:RequiredFieldValidator\
  \ ID=\"RequiredFieldValidator1\" runat=\"server\"\n    ErrorMessage=\"Enter a name\
  \ for player 1\" ControlToValidate=\"player1TextBox\">\n</asp:RequiredFieldValidator>\n\
  ```\n\n表 19-4 列出并描述：\n\n| **控件** | **描述** |\n| --- | --- |\n| `RequiredFieldValidator`\
  \ | 指定被验证控件的输入是必填的。 |\n| `RangeValidator` | 定义用户允许输入的最小值和最大值。 |\n\n\n\n\n\n| `CompareValidator`\
  \ | 比较多个值（如密码）。此验证器不仅支持比较两个值是否相等，还可以通过 `Operator` 属性设置附加选项。`Operator` 属性的类型为 `ValidationCompareOperator`，定义了枚举值，如\
  \ `Equal`、`NotEqual`、`GreaterThan` 和 `DataTypeCheck`。使用 `DataTypeCheck`，可以对输入值进行检查，以确定其是否为特定的数据类型，例如，正确的日期输入。\
  \ |\n\n表 19-4 ：ASP.NET 验证控件示例\n\n### 状态管理\n\nHTTP 协议是无状态的。从客户端到服务器发起的连接在每次请求后都会关闭。然而，通常我们需要从一个页面到另一个页面记住一些客户端信息。有几种方法可以实现这一点。\n\
  \n保持状态各种方法之间的主要区别在于状态存储在客户端还是服务器上。表 19-5 显示了状态管理技术的概述以及状态的有效时间。\n\n| **状态类型** |\
  \ **客户端或服务器资源** | **有效时间** |\n| --- | --- | --- |\n| 视图 (View State) | 客户端 | 仅限单个页面内。\
  \ |\n| Cookie | 客户端 | 临时 Cookie 在浏览器关闭时删除；持久 Cookie 存储在客户端系统的磁盘上。 |\n| 会话 (Session)\
  \ | 服务器 | Session 状态与浏览器会话关联。Session 会超时失效（默认为 20 分钟）。 |\n| 应用 (Application) | 服务器\
  \ | 应用状态在所有客户端之间共享。该状态一直有效到服务器重启。 |\n| 缓存 (Cache) | 服务器 | 与应用状态类似，缓存是共享的。开发者控制缓存何时失效。\
  \ |\n\n表 19-5 ：ASP.NET Web Forms 状态管理技术\n\n### 身份验证与授权\n\n为了保护网站安全，使用身份验证来验证用户是否有有效登录，而授权则确认通过身份验证的用户可以使用该资源。Web\
  \ 常用的身份验证技术是 Forms 和 Windows 身份验证。Windows 身份验证利用 Windows 账户和 IIS 来验证用户，而 Forms 则需要一个包含用户访问信息的数据库。\n\
  \nASP.NET 有许多用于用户身份验证的类。在 ASP.NET 中，可以使用许多安全控件，如 `Login` 和 `PasswordRecovery`。这些控件使用了\
  \ `Membership API`。通过 `Membership API`，可以创建和删除用户、验证登录信息或获取有关当前登录用户的信息。`Membership\
  \ API` 使用成员提供程序（membership provider）。从 ASP.NET 4.5 开始，存在不同的提供程序来访问 Access 数据库、SQL\
  \ Server 数据库或活动目录（Active Directory）中的用户。也可以创建自定义提供程序来访问 XML 文件或任何自定义存储器。\n\n在接下来的“尝试一下”（Try\
  \ It Out）中，你将创建一个 ASP.NET Web Forms 应用程序为两名玩家分发扑牌。\n\nASP.NET Web Forms 仍然是快速创建功能完备、资源丰富的\
  \ Web 应用程序的有效选项。这种版本的 ASP.NET 应用程序使用 .NET Framework 的完整版本，这意味着应用程序将仅运行在 Microsoft\
  \ Windows 平台上。如果 Web 应用程序需要在多个操作系统上运行，那么 ASP.NET Core（将在下一节中讨论）可能是更好的选择。\n\n## 创建\
  \ ASP.NET CORE WEB 应用程序\n\n本节讨论了许多 ASP.NET Core 概念。本节最重要的概念是 ASP.NET Core 可以跨平台运行。与\
  \ .NET Core 应用程序一样，ASP.NET Core 网站除了 Microsoft Windows 之外，还 Linux 和 MacOS 上运行。因此，如果\
  \ Web 应用程序需要跨平台运行，这就是开发的 ASP.NET 版本。然而，如果 Web 应用程序的目标仅是在 Microsoft Windows 上运行，则你应该考虑使用\
  \ ASP.NET Web Forms 或 ASP.NET MVC。在编写时，ASP.NET Core 是 ASP.NET 最新的版本，但并非所有功能都包含在二进制文件中。这在未来将会发生变化。\n\
  \n你将在本节中学习以下 ASP.NET Core 特有内容：\n\n* IIS 和 Kestrel\n* Razor 语法\n* 输入验证\n* 状态管理\n\
  * 身份验证与授权\n* 依赖注入\n\n### IIS 和 Kestrel\n\n到目前为止，当开发者谈论 ASP.NET 版本时，人们认为 Web 应用程序将运行在带有\
  \ Internet 信息服务（IIS）的 Microsoft Windows 服务器上，IIS 是由微软开发的 Web 服务器，用于响应客户端的 HTTP 和\
  \ HTTPS 请求。然而，由于 IIS 无法在 Linux 或 MacOS 上运行，因此需要一种方法让 IIS 将请求发送到可以在这些操作系统运行的 Web\
  \ 服务器。答案是使用 `Kestrel`，这是一个 ASP.NET Core 项目包含的新型跨平台 Web 服务器。\n\n如图 19-8\n\n**图 19-8**\n\
  \n除了 IIS 之外，Apache 和 Nginx 也是可以在目标操作系统（如 Windows、MacOS）上运行的 Web 服务器。ASP.NET Core\
  \ 不需要特定的 Web 服务器即可运行，因为 Kestrel 本身就是一个 Web 服务器。以这种方式运行通常被称为自托管（self-hosting），如第\
  \ 16 章所述。\n\n### Razor 语法\n\n在为 ASP.NET Core 应用程序创建 Razor 页面时，可以使用 HTML 渲染功能代替 Web\
  \ Forms 的服务器控件。在页面中引用变量时，传统的标记语法是 `<%= %>`。Razor 的改进是使用 `@` 符号表示代码的起点或设置变量引用。例如，`@Html.Hidden`。\n\
  \n`Html` 对象提供了 `System.Web.Mvc.HtmlHelper` 类的构造函数、属性、字段和方法的引用。表 19-6 列出了从 Razor\
  \ 页面可以访问的一些 `HtmlHelper` 方法。HTML 输出与 ASP.NET Web Forms 服务器控件的输出非常相似。\n\n| **控件**\
  \ | **HTML** | **描述** |\n| --- | --- | --- |\n| `Html.Label` | `<label>` | 返回包含文本的\
  \ `label` 元素。 |\n| `Html.TextBox` | `<input type=` `text` `>` | 返回 HTML `<input\
  \ type=` `text` `>`，用户可以在其中输入值。 |\n| `Html.ActionLink` | `<a href>` | 创建引用 Web 页面的简单锚标签。\
  \ |\n| `Html.DropDownList` | `<select>` | 创建 `select` 标签，用户可以看到一个项目并通过点击下拉列表从多个项目列表中选择一个。\
  \ |\n| `Html.CheckBox` | `<input type=` `checkbox` `>` | 返回类型为 `check box` 的 `input`\
  \ 元素，显示一个可以选中或取消选择的按钮。 |\n\n\n\n\n\n| `Html.RadioButton` | `<input type=\"radio\"\
  >` | 返回一个类型为 `radio` 的 `input` ` 元素。对于单选按钮，一组中只能选择一个按钮。 |\n\n**表 19-6：** Razor HtmlHelper\
  \ 方法示例\n\n还有许多其他未包含在此表中的 `HtmlHelper` 方法。\n\n### 输入验证 (Input Validation)\n\nASP.NET\
  \ Core 应用程序的验证是通过存在于 `System.ComponentModel.DataAnnotations` 命名空间中的验证属性配置的。验证器在特定模型的类定义中配置。\n\
  \n```cs\n public class Player\n\n{\n    [StringLength(20, MinimumLength = 3)]\n\
  \    [Required]\n    public string Name { get; set; }\n} \n```\n\n当向绑定了定义的 `Player`\
  \ 模型的页面发送请求时，ASP.NET Core 运行时会生成 jQuery 客户端验证语法。然后，如果用户尝试提交一个没有 `Name` 值的表单，验证将在客户端进行并渲染错误。\n\
  \n表 19-7 列出并描述了一些 ASP.NET Core 数据注解验证属性。\n\n| **控制项** | **描述** |\n| --- | --- |\n\
  | `Required` | 表示该属性是必需的。 |\n| `StringLength` | 定义用户必须遵守的最大值和可选的最小值。 |\n| `Range`\
  \ | 对于数值字段，可以设置最大值最小值。 |\n| `EmailAddress` | 确认输入的值是电子邮件地址。 |\n| `DataType` | 确认输入的值是特定类型，如\
  \ `Date` 或 `Currency` `` 。 |\n| `RegularExpression` | 确认输入的值符合正则表达式语法。 |\n\n**表\
  \ 19-7：** ASP.NET Core 验证属性示例\n\n### 状态管理 (State Management)\n\n如前所述，HTTP 协议是无状态的，这意味着一旦服务器成功响应请求，就不会存储任何关于发送请求的客户端的信息。每次请求后，连接都会关闭并被遗忘。然而，在管理来自客户端的多个请求时，经常需要对客户端的某些信息进行持久化和重用。与其他\
  \ ASP.NET 版本一样，在使用 HTTP 时有几种方法可以实现状态信息管理。表 19-8 显示了状态管理技术的概述以及状态的有效时间。\n\n| **状态类型**\
  \ | **客户端或服务器资源** | **有效时间** |\n| --- | --- | --- |\n| TempData | 服务器 | 一旦数据被应用程序读取就会删除。\
  \ |\n| Query strings | 双方 | 作为 URL 元素在客户端和服务器之间传递，仅在单次请求期间可用。 |\n| Cookie | 客户端\
  \ | 临时 Cookie 在浏览器关闭时被删除；持久 Cookie 存储在客户端系统的磁盘上。 |\n| `HttpContext.Items` | 双方 |\
  \ 在客户端和服务器之间传递，存储在 `HttpContext` 对象中，仅在单次请求期间可用。 |\n| Cache | 服务器 | 与应用程序状态类似，缓存是共享的。然而，当缓存应该失效时，有更好的控制。\
  \ |\n| Session | 服务器 | 会话状态与浏览器会话相关。会话通过可配置的超时设置失效。 |\n| Application | 服务器 | 应用程序状态在所有客户端之间共享。该状态一直有效服务器重启。\
  \ |\n\n**表 19-8：** ASP.NET Core 状态管理技术\n\n### 身份验证与授权 (Authentication and Authorization)\n\
  \n由于 ASP.NET Core 并不关注单一操作系统，身份验证和授权协议也必须跨平台。最流行的开源身份提供程序是 OWIN 和 OAuth。OWIN（代表\
  \ Open Web Interface for .NET）本身并不是一种身份提供程序；但它通常与 Katana 相关，而 Katana 是的。OWIN 是一项规范，详细说明了\
  \ Web 服务器和 Web 应用程序如何相互解耦。OWIN 消除了 ASP.NET Core 对 IIS 的依赖，并帮助通过 Kestrel 将自托管概念成为现实。Katana\
  \ NuGet 包包含了实现如 Windows 和 Forms 等许多类型验证所需的库。\n\nOAuth 是由微软、Facebook、Twitter、Google\
  \ 等公司暴露的接口，供 Web 应用程序进行身份验证。运行在移动设备或浏览器中的应用程序通常会提示客户端使用 Facebook 或 Microsoft 凭据访问网站。在这些情况下，使用的是\
  \ OAuth 协议。用于 ASP.NET Core Web 应用程序实现 OAuth 的类和方法位于 `AspNet.Security.OAuth.Providers`\
  \ 命名空间中。\n\n*身份验证*（Authentication）确认个人确实是他们所称身份的过程。通常当有人创建一个新账户时，它与电子邮件地址和密码关联。验证电子邮件会发送到提供的邮箱，一旦点击即可完成注册。从那时起使用该电子邮件和密码访问资源将验证其确实是创建账户的人。该过程的另一部分是授权。*授权*（Authorization）是定义授权人员可以访问哪些功能或内容的过程。这通常被称为*声明*（claims）。\n\
  \n在最简单的形式中，某些源代码会检查声明的存在，例如对某个方法，如果声明存在，则可以调用。\n\n```cs\npolicy.RequireClaim(\"\
  DealerID\");\n```\n\n这显示了也可以以键值对的形式表示提供更细粒度的访问。\n\n```cs\npolicy.RequireClaim(\"\
  1\", \"2\", \"3\", \"4\", \"5\");\n```\n\n### 依赖注入 (Dependency Injection)\n\n依赖注入\
  \ (DI) 是一个非常高级的主题，但由于它是 ASP.NET Core 构建的基础概念，所以这里会涉及到。关于 DI 的基本点是避免使用 `new` 关键字。\n\
  \n```cs\nPlayer[] players = new Player[2];\n```\n\n避免 `new` 的原因是它将程序永久地与其引用的类绑定。当类需要修改的可能性很小时，某些情况下使用关键字是可以接受的。替代方案是实现接口，这在\
  \ 第 9 章、第 10 章 和 第 12 章 中讨论过。接口松地耦合或解耦了消费者和提供者，其中程序是消费者而类是提供者。如下代码片段所示，在不使用 `new`\
  \ 关键字的情况下创建 `Player`。\n\n```cs\npublic interface ICardGameClient\n{\n    void Player(string\
  \ Name);\n}\n\npublic class PlaySomeCards\n{\n    private readonly ICardGameClient\
  \ _cardGameClient;\n\n    public PlaySomeCards(ICardGameClient cardGameClient)\n\
  \    {\n        _cardGameClient = cardGameClient;\n    }\n\n    public void PlayHand\n\
  \    {\n        _cardGameClient.Player(\"Benjamin\");\n    }\n}\n```\n\n依赖注入通过被称为工厂或容器的方法更了一了一。ASP.NET\
  \ Core 默认支持 DI 并配置在 `Startup.cs` 文件中，该文件是随 ASP.NET Core Web 应用程序创建的。该文件包含一个名为 `ConfigureServices()`\
  \ 的方法，是配置提供者的地方。\n\n```cs\npublic void ConfigureServices(IServiceCollection services)\n\
  {\n    services.AddMvc();\n    services.AddDbContext<ClassName>(options => ...);\n\
  \    services.AddIdentity<ClassName1, ClassName2>()...\n    ...\n}\n```\n\n\n\n\n\
  \n在 `ConfigureServices()` 方法中配置的服务提供程序会在程序内运行的代码请求 `className` 时提供该类名。\n\n在接下来的“尝试一试”练习中，你将在\
  \ ASP.NET Core 中创建一个 Razor Page，为两个玩家分发扑牌。\n\n## ![image](img/Image00002.gif) 本章你学到的内容\n\
  \n| **主题** | **核心概念** |\n| --- | --- |\n| ASP.NET 变体 | 有许多 ASP.NET 类型，每种都有特定的使用场景和优势。\
  \ |\n| 项目与 Web 网站 | 项目（Projects）被编译为 `.dll` 并部署，而 Web 网站（Web Sites）部署源代码并在首次被请求时进行编译。\
  \ |\n| 服务器控件和 HtmlHelper | Web 服务器控件是服务器端控件，用于为 ASP.NET Web Forms 生成 HTML 代码。`HtmlHelper`\
  \ 类提供了在 Razor 页面中创建 `Label`、`Textbox` 等对象的方法。 |\n| 使用验证控件和数据注解程序验证用户输入 | ASP.NET\
  \ 提供了多种验证控件，可以轻松在客户端和服务器端验证用户输入。出于性能考虑，在客户端进行验证，但由于 Web 客户端永远不可信，因此必须在服务器端进行验证。\
  \ |\n| 状态管理 | 在 Web 应用程序中，必须考虑存储状态的地方。可以使用 cookie 或视图状态（view state）存储在客户端，可以使用会话（session）、缓存和应用程序对象存储在服务器。\
  \ |\n| 身份验证与授权 | 身份验证确定客户端是否确实为其所称身份的过程。授权为已验证身份的客户端提供访问的功能和服务。 |\n| Kestrel | Kestrel\
  \ 是一种新的 Web 服务器，可以自托管 ASP.NET Core Web 应用程序并跨平台运行。 |\n| 依赖注入 (DI) | DI 解除了消费者和提供者之间的耦合。\
  \ |\n\n# 第四部分\n\n## 数据访问\n\n* 第 20 章：文件\n* 第 21 章：XML 和 JSON\n* 第 22 章：LINQ\n* 第\
  \ 23 章：数据库\n\n# 20\n\n## 文件\n\n### 输入和输出的文件类\n\n读取和写入文件是获取进入 C# 程序数据（`input`）以及将数据传出程序（`output`）的基本方式。由于文件被用于输入输出，因此文件类包含在\
  \ `System.IO` 命名空间中（`IO` 是 Input/Output 的缩写）。\n\n`System.IO` 包含了用于从文件读取和写入数据的类，你可以在\
  \ C# 应用程序中引用此命名空间，以便在无需完全限定类型名的情况下访问这些类。\n\n本章涵盖的类已在表 20-1 中描述。\n\n| **类** | **描述**\
  \ |\n| --- | --- |\n| `File` | 静态工具类，公开了许多用于移动、复制和删除文件的静态方法。 |\n| `Directory` |\
  \ 静态工具类，公开了许多用于移动、复制和删除目录的静态方法。 |\n| `Path` | 用于处理路径名称的工具类。 |\n| `FileInfo` | 代表磁盘上的物理文件，并具有操作该文件的方法。对于任何对文件的读取和写入，必须创建一个\
  \ `Stream` 对象。 |\n| `DirectoryInfo` | 代表磁盘上的物理目录，并具有操作该目录的方法。 |\n| `FileSystemInfo`\
  \ | 作为 `FileInfo` 和 `DirectoryInfo` 的基类，使其能够通过多态同时处理文件和目录。 |\n| `FileSystemWatcher`\
  \ | 你在本章中检查的最先进的类。它用于监控文件和目录，并公开了当这些位置发生变化时你的应用程序可以捕获的事件。 |\n\n**表 20-1 ：文件系统访问类**\n\
  \n你还将查看 `System.IO.Compression` 命名空间，它允许你从压缩文件中读取和写入（`.ZIP` 扩展）。特别是，你将查看以下两个流类：\n\
  \n* `DeflateStream` — 代表一种流，数据在写入时自动压缩，在读取时自动解压缩。压缩通过 Deflate 算法实现。\n* `GZipStream`\
  \ — 代表一种流，数据在写入时自动压缩，在读取时自动解压缩。压缩通过 GZIP (GNU Zip) 算法实现。\n\n#### 文件和目录类\n\n`File`\
  \ 和 `Directory` 工具类公开了许多静态方法，用于操作令人惊讶的……和目录。这些方法使得移动文件、查询和更新属性以及创建 `FileStream`\
  \ 对象成为可能。正如你在第 8 章中所学习的那样，可以在类上调用静态方法，而无需创建它们的实例。\n\n`File` 类的一些最常用的静态方法如表 20-2\
  \ 所示。\n\n| **方法** | **描述** |\n| --- | --- |\n| `Copy()` | 从源位置复制文件到目标位置。 |\n| `Create()`\
  \ | 在指定位置创建文件。 |\n| `Delete()` | 删除文件。 |\n| `Open()` | 在指定路径返回一个 `FileStream` 对象。\
  \ |\n| `Move()` | 将文件移动到新位置。你可以为新位置的文件指定不同的名称。 |\n\n**表 20-2 ：文件的静态方法**\n\n`Directory`\
  \ 类的一些实用静态方法如表 20-3 所示。\n\n| **方法** | **描述** |\n| --- | --- |\n| `CreateDirectory()`\
  \ | 在指定路径创建目录。 |\n| `Delete()` | 删除目录及其内部的所有文件。 |\n| `GetDirectories()` | 返回表示指定目录下的目录名的\
  \ `string` 数组。 |\n| `EnumerateDirectories()` | 类似于 `GetDirectories()`，但返回目录名的 `IEnumerable<string>`。\
  \ |\n| `GetFiles()` | 返回表示指定目录内文件名的 `string` 数组。 |\n| `EnumerateFiles()` | 类似于 `GetFiles()`，但返回文件名的\
  \ `IEnumerable<string>`。 |\n| `GetFileSystemEntries()` | 返回表示指定目录内文件和目录名称的 `string`\
  \ 数组。 |\n| `EnumerateFileSystemEntries()` | 类似于 `GetFileSystemEntries()`，但返回文件和目录名的\
  \ `IEnumerable<string>`。 |\n| `Move()` | 将指定的目录移动到新位置。你可以为新位置的文件夹指定新名称。 |\n\n**表\
  \ 20-3 ：目录的静态方法**\n\n当存在大量文件或目录时，三个 `Enumerate``Xxx()` 方法比对应的 `Get``Xxx()` 方法性能更好。\n\
  \n### FileInfo 类\n\n与 `File` 类不同，`FileInfo` 类不是静态的，也没有静态方法。该类只有在实例化时才有用。`FileInfo`\
  \ 对象代表磁盘或网络位置上的文件，你可以通过提供文件路径来创建一个：\n\n```\n FileInfo aFile = new FileInfo(@\"C:\\\
  Log.txt\");\n```\n\n你也可以将目录名称传递给 `FileInfo` 构造函数，尽管在实际操作中这并不有用。这样做会导致 `FileInfo`\
  \ 的基类 `FileSystemInfo` 初始化所有的目录信息，但任何专门针对文件的 `FileInfo` 方法或属性都将无法工作。\n\n\n\n\n\n\
  `FileInfo` 类公开的许多方法与 `File` 类的方法相似，但由于 `File` 是一个静态类，它每次调用方法时都需要一个字符串参数来指定文件位置。因此，以下调用实现的是相同的功能：\n\
  \n```\nFileInfo aFile = new FileInfo(\"Data.txt\");\n\nif (aFile.Exists)\n   WriteLine(\"\
  File Exists\");\n\nif (File.Exists(\"Data.txt\"))\n   WriteLine(\"File Exists\"\
  ); \n```\n\n在这段代码中，程序会检查文件 `Data.txt` 是否存在。请注意，这里没有指定目录信息，这意味着唯一被检查的位置是当前的*工作目录*。该目录是包含调用此代码的应用程序的目录。你将在稍后在“路径名称和相对路径”章节中详细查看这一点。\n\
  \n`FileInfo` 的大多数方法都以这种方式镜像了 `File` 类的方法。在大多数情况下，使用哪种技术并不重要，尽管以下标准可以帮助你判断哪种更合适：\n\
  \n- 如果你只进行单次方法调用，那么使用静态 `File` 类上的方法是有意义的——单次调用会更快，因为 .NET Framework 不需要经过实例化新对象然后调用方法的过程。\n\
  - 如果你的应用程序正在对文件执行若干项操作，那么实例化一个 `FileInfo` 对象并使用其方法更有意义——这节省了时间，因为该对象已经引用了文件系统上的正确文件，而静态类每次都必须查找它。\n\
  \n`FileInfo` 类还公开了与底层文件相关的属性，其中某些属性可以进行操作以更新文件。这些属性中的许多继承自 `FileSystemInfo`，因此同时适用于\
  \ `FileInfo` 和 `DirectoryInfo` 类。`FileSystemInfo` 的属性如表 20-4 所示。\n\n| 属性 | 说明 |\n\
  | --- | --- |\n| `Attributes` | 使用 `FileAttributes` 枚举获取或设置当前文件或目录的属性。 |\n| `CreationTime`,\
  \ `CreationTimeUtc` | 获取或设置当前文件的创建日期和时间，提供协调世界时 (UTC) 和非 UTC 版本。 |\n| `Extension`\
  \ | 获取文件的扩展名。此属性是只读的。 |\n| `Exists` | 确定文件是否存在。这是一个只读抽象属性，在 `FileInfo` 和 `DirectoryInfo`\
  \ 中被重写。 |\n| `FullName` | 获取文件的完整路径。此属性是只读的。 |\n| `LastAccessTime`, `LastAccessTimeUtc`\
  \ | 获取或设置当前文件的最后访问日期和时间，提供 UTC 和非 UTC 版本。 |\n| `LastWriteTime`, `LastWriteTimeUtc`\
  \ | 获取或设置当前文件的最后写入日期和时间，提供 UTC 和非 UTC 版本。 |\n| `Name` | 获取文件的完整路径。这是一个只读抽象属性，在 `FileInfo`\
  \ 和 `DirectoryInfo` 中被重写。 |\n\n**表 20-4 :** FileSystemInfo 属性\n\n`FileInfo` 特有的属性如表\
  \ 20-5 所示。\n\n| 属性 | 说明 |\n| --- | --- |\n| `Directory` | 获取表示包含当前文件目录的 `DirectoryInfo`\
  \ 对象。此属性是只读的。 |\n| `DirectoryName` | 返回文件所在目录的路径。此属性是只读的。 |\n| `IsReadOnly` | 文件只读属性的快捷方式。此属性也可以通过\
  \ `Attributes` 访问。 |\n| `Length` | 以字节获取文件的大小，作为 `long` 值返回。此属性是只读的。 |\n\n**表 20-5\
  \ :** FileInfo 属性\n\n### DirectoryInfo 类\n\n`DirectoryInfo` 类的工作方式与 `FileInfo` 类完全相同。它是一个表示机器上单个目录的实例化对象。与\
  \ `FileInfo` 类一样，许多方法调用在 `Directory` 和 `DirectoryInfo` 之间重复。选择使用 `File` 还是 `FileInfo`\
  \ 方法的指南也适用于 `DirectoryInfo` 方法：\n\n- 如果你进行单次调用，请使用静态 `Directory` 类。\n- 如果你进行一系列调用，请使用实例\
  \ `DirectoryInfo` 对象。\n\n`DirectoryInfo` 类大部分属性继承自 `FileSystemInfo`，`FileInfo` 也是如此，尽管这些属性作用于目录而非文件。还有两个\
  \ `DirectoryInfo` 特有的属性，如表 20-6 所示。\n\n| 属性 | 说明 |\n| --- | --- |\n| `Parent` |\
  \ 获取表示包含当前目录的目录的 `DirectoryInfo` 对象。此属性是只读的。 |\n| `Root` | 获取表示当前卷根目录的 `DirectoryInfo`\
  \ 对象——例如 `C:\\` 目录。此属性是只读的。 |\n\n**表 20-6 :** DirectoryInfo 类特有的属性\n\n### 路径名称和相对路径\n\
  \n在 .NET 代码中指定路径名称时，可以使用绝对路径或相对路径。*绝对*路径名称显式指定文件或目录——例如 `C:\\Work\\LogFile.txt`。相对名称相对于起始位置。通过使用相对名称，不需要指定驱动器或已知位置。你之前已经见过这一点，即当前目录就是起点。例如，如果你的应用程序运行在\
  \ `C:\\Development\\FileDemo` 目录并使用相对路径 `LogFile.txt`，那么该文件就在那里。\n\n如前所示，工作目录最初被设置为应用程序运行的目录。当你使用\
  \ Visual Studio 进行开发时，这意味着应用程序位于你创建的项目文件夹的几层之下。它通常位于 `ProjectName\\bin\\Debug`。因此，要访问项目根文件夹中的文件，你需要通过\
  \ `..\\` 向上移动两个目录。\n\n### 流 (STREAMS)\n\nNET Framework 中的所有输入输出都涉及*流*（streams）的使用。流是*串行设备*的抽象表示。串行设备是指以线性方式存储和/或访问数据的设备，即一次一个字节，按顺序进行。这种设备可以是磁盘文件、网络通道、内存位置或任何支持线性读取、写入或两者的对象。通过保持设备抽象化，流的底层目标/源可以被隐藏。这种抽象级别使得代码可以重用，并允许你编写更通用的例程，因为你不需要担心数据传输实际发生的细节。因此，当应用程序从文件输入流、网络输入流或任何其他流读取数据时，相似的代码可以进行传输和重用。\n\
  \n\n\n\n\n流可以代表几乎任何源，例如键盘、物理磁盘文件、网络位置、打印机，甚至是另一个程序，但本章侧重于读取和写入磁盘文件。应用于读取/写入磁盘文件的概念适用于大多数设备，因此你将对流有一个基本的理解，并学习一种可以应用于许多情况的可靠方法。\n\
  \n### 用于流的类\n\n用于流的类包含在相同的 `System.IO` 命名空间中，还有 `File` 和 `Directory` 类。这些类在表 20‐7\
  \ 中列出。\n\n| 类 | 描述 |\n| --- | --- |\n| `FileStream` | 表示一个可以写入、读取或二者兼顾的文件。该文件可以以异步或同步方式进行写入和读取。\
  \ |\n| `StreamReader` | 从流中读取字符数据，可以使用 `FileStream` 作为基类创建。 |\n| `StreamWriter`\
  \ | 向流写入字符数据，可以使用 `FileStream` 作为基类创建。 |\n\n**表 20‐7:** 流类\n\n现在让我们来看看如何使用这些类中的每一个。\n\
  \n### FileStream 对象\n\n`FileStream` 对象表示指向磁盘或网络路径上文件的流。虽然该类确实暴露了从文件向文件读写字节的方法，但大多数情况下你会使用\
  \ `StreamReader` 或 `StreamWriter` 来执行这些功能。这是因为 `FileStream` 类操作的是字节和字节数组，而 `Stream`\
  \ 类操作的是字符数据。字符数据更容易处理，但某些操作（例如随机文件访问，即访问文件中间某点的数据）只能通过 `FileStream` 对象完成。你将在本章稍后学习更多内容。\n\
  \n创建 `FileStream` 对象有多种方法。构造函数有许多不同的重载，但最简单的只需要两个参数：文件名和 `FileMode` 枚举值：\n\n```\n\
  FileStream aFile = new FileStream(filename, FileMode.<Member>);\n```\n\n`FileMode`\
  \ 枚举有几个成员，指定如何打开或创建文件。你很快就会看到这些可能性。另一个常用的构造函数如下：\n\n```\nFileStream aFile = new\
  \ FileStream(filename, FileMode.<Member>, FileAccess.<Member>);\n```\n\n第三个参数是 `FileAccess`\
  \ 枚举的成员，是指定流目的的方法。`FileAccess` 枚举的成员在表 20‐8 所示。\n\n| 成员 | 描述 |\n| --- | --- |\n\
  | `Read` | 仅用于读取打开文件 |\n| `Write` | 仅用于写入打开文件 |\n| `ReadWrite` | 以读写方式打开文件 |\n\n\
  **表 20‐8:** FileAccess 枚举成员\n\n尝试执行 FileAccess 枚举成员指定以外的操作将抛出异常。此属性通常用于根据用户的授权级别来更改用户对文件的访问。\n\
  \n在不使用 `FileAccess` 枚举参数的 `FileStream` 构造函数版本中，使用默认值，即 `FileAccess.ReadWrite`。\n\
  \n`FileMode` 枚举成员在表 20‐9 所示。使用这些值值时实际发生的情况取决于指定的文件名是否指向存在的文件。注意，此表中的条目指的是流在创建时所指向的文件位置，你将在下一节中学习更多相关内容。除非另有说明，否则流指向文件的开头。\n\
  \n| 成员 | 文件存在时的行为 | 文件不存在时的行为 |\n| --- | --- | --- |\n| `Append` | 打开文件，并将流位于文件末尾。只能与\
  \ `FileAccess.Write` 配合使用。 | 创建新文件。只能与 `FileAccess.Write` 配合使用。 |\n| `Create` |\
  \ 销毁文件，并在原位置创建一个新文件。 | 创建新文件。 |\n| `CreateNew` | 抛出异常。 | 创建新文件。 |\n| `Open` | 打开文件，流位于文件开头。\
  \ | 抛出异常。 |\n| `OpenOrCreate` | 打开文件，流位于文件开头。 | 创建新文件。 |\n| `Truncate` | 打开并擦除文件。流位于文件开头。保留原始文件的创建日期。\
  \ | 抛出异常。 |\n\n**表 20‐9:** FileMode 枚举成员\n\n`File` 和 `FileInfo` 类都暴露了 `OpenRead()`\
  \ 和 `OpenWrite()` 方法。（注：原文此处存在大量重复，翻译已根据核心意图整合）。`File` 和 `FileInfo` 类都暴露了 `OpenRead()`\
  \ 和 `OpenWrite()` 方法。`File` 和 `FileInfo` 类都暴露了 `OpenRead()` 和 `OpenWrite()` 方法……（注：原文存在重复问题，将继续核心内容）。\n\
  \n### 文件位置 (File Position)\n\n`FileStream` 类维护一个内部文件指针，指向文件中下一次读取或写入操作发生的位置。在大多数情况下，当打开文件时，它指向文件开头，但此指针可以被修改。这允许应用程序在文件的任何位置进行读取或写入，从而实现文件的随机访问。在处理大文件时这可以节省大量时间。\n\
  \n实现此功能的方法是 `Seek()` 方法，它接受两个参数。第一个参数指定移动文件指针的距离（单位为字节）。第二个参数指定从哪里开始计数，形式为 `SeekOrigin`\
  \ 枚举的值。`SeekOrigin` 枚举包含三个值：`Begin`、`Current` 和 `End`。\n\n例如，以下行将文件指针移动到文件的第八个字节，从文件的第一个字节开始：\n\
  \n```\naFile.Seek(8, SeekOrigin.Begin);\n```\n\n下一行将从当前位置向前移动文件指针两个字节。如果紧接上一行执行此操作，那么文件指针现在指向文件的第十个字节：\n\
  \n```\naFile.Seek(2, SeekOrigin.Current);\n```\n\n当你从文件读取或写入内容时，文件指针也会发生。读取 10 个字节后，文件指针将指向第\
  \ 10 个字节之后的字节。\n\n你还可以指定负的偏移位置，可以与 `SeekOrigin.End` 枚举值结合，跳转到文件附近。以下跳转到文件末尾数第五个字节：\n\
  \n```\naFile.Seek(-5, SeekOrigin.End);\n```\n\n以这种方式访问的文件有时被称为“随机访问文件”，因为应用程序可以访问文件的任何位置。稍后描述的\
  \ `StreamReader` 和 `StreamWriter` 类按顺序访问文件，不允许你以这种方式操作文件指针。\n\n\n\n\n使用 `FileStream`\
  \ 类读取数据并不像使用 `StreamReader` 类那样简单，你将在本章稍后部分介绍 `StreamReader`。这是因为 `FileStream` 类专门处理原始字节。处理原始字节的操作使得\
  \ `FileStream` 类适用于任何类型的数据文件，不仅仅是文本文件。通过读取字节数据，`FileStream` 对象可以用于读取图像或声音文件等。这种灵活性的代价是，你无法像使用\
  \ `StreamReader` 类那样直接使用 `FileStream` 将数据读取到字符串中。然而，几个转换类可以很方便地将字节数组转换为字符数组，反之亦然。\n\
  \n`FileStream.Read()` 方法是访问 `FileStream` 对象所指向文件数据的主要手段。该方法从文件中读取数据，然后将这些数据写入 `byte`\
  \ 数组中。它有三个参数，第一个是传入的 `byte` 数组，用于接收来自 `FileStream` 对象的数据。第二个参数是 `byte` 数组中开始写入数据的位置——这通常为零，以便从数组的开头开始写入文件数据。最后一个参数指定了要从文件中读取多少字节。\n\
  \n接下来的“尝试一试”（Try It Out）演示了如何从随机访问文件中读取数据。你将读取的文件实际上是你为示例创建的类文件。\n\n## 写入数据\n\n\
  向随机访问文件写入数据的过程非常相似；必须创建一个字节数组。实现此最简单的方法是首先构建你想要写入文件的字符数组。接下来，使用 `Encoder` 对象将其转换为字节数组，就像你之前使用\
  \ `Decoder` 对象一样。最后，调用 `Write()` 方法将数组发送到文件。\n\n接下来的“尝试一试”是一个演示如何执行此操作的简单示例。\n\n\
  ## StreamWriter 对象\n\n与字节数组一起工作并不是大多数人认为很有趣的事——在用用过 `FileStream` 对象后，你可能会怀疑是否有更简单的方法。不要担心，一旦你有了\
  \ `FileStream` 对象，你通常会创建一个 `StreamWriter` 或 `StreamReader`，并使用它们的方法来操作文件。如果你不需要将文件指针更改到任意位置的能力，这些类将使文件操作变得容易易得多。\n\
  \n`StreamWriter` 类允许你向文件写入字符和字符串，由该类为你处理底层的转换并将数据写入 `FileStream` 对象。\n\n创建 `StreamWriter`\
  \ 对象有许多方法。如果你已经有了一个 `FileStream` 对象，则可以使用它来创建 `StreamWriter`：\n\n```\nFileStream\
  \ aFile = new FileStream(\"Log.txt\", FileMode.CreateNew);\nStreamWriter sw = new\
  \ StreamWriter(aFile); \n```\n\n也可以直接从文件创建 `StreamWriter` 对象：\n\n```\nStreamWriter\
  \ sw = new StreamWriter(\"Log.txt\", true); \n```\n\n此构造函数接受文件名以及一个指定是追加到文件还是创建新新文件的布尔值：\n\
  \n* 如果将其设置为 `false`，则会创建一个新文件，或者截断现有文件并将其打开。\n* 如果将其设置为 `true`，则会打开文件并保留数据。如果没有文件，则创建一个新文件。\n\
  \n与创建 `FileStream` 对象不同，创建 `StreamWriter` 并不会为你提供类似范围的选项——除了用于追加或创建新文件的布尔值外，你没有像使用\
  \ `FileStream` 类那样指定 `FileMode` 属性的选项。你也没有设置 `FileAccess` 属性的选项，因此你始终对文件拥有读/写权限。要使用任何高级参数，你必须先在\
  \ `FileStream` 构造函数中指定它们，然后从 `FileStream` 对象创建 `StreamWriter`，就像你在接下来的“尝试一试”中所做的那样。\n\
  \n## StreamReader 对象\n\n输入流用于从外部源读取数据。通常情况下，这将磁盘或网络位置上的文件，但请记住，该源可以是任何可以发送数据的源，例如网络应用程序甚至\
  \ `Console`。\n\n`StreamReader` 类将将将用于从文件读取数据的类。和 `StreamWriter` 类一样，这是一个通用类，可以与任何流配合。在接下来的“尝试一试”中，你再次围绕一个\
  \ `FileStream` 对象构造它，使其指向正确的文件。\n\n`StreamReader` 对象的创建方式与 `StreamWriter` 对象非常相似。创建它的最常用方法是使用之前创建的\
  \ `FileStream` 对象：\n\n```\nFileStream aFile = new FileStream(\"Log.txt\", FileMode.Open);\n\
  StreamReader sr = new StreamReader(aFile); \n```\n\n像 `StreamWriter` 一样，`StreamReader`\
  \ 类也可以从包含特定文件路径的字符串直接创建：\n\n```\nStreamReader sr = new StreamReader(\"Log.txt\"\
  ); \n```\n\n### 读取数据\n\n`ReadLine()` 方法并不是你访问文件中数据的唯一方法。`StreamReader` 类有许多读取数据的方法。\n\
  \n最简单的读取方法是 `Read()`。它将流中的下一个字符作为正整数值返回，如果已到达末尾则返回 `-1`。可以使用 `Convert` 工具类将此值转换为字符。在前面的示例中，程序的主要部分可以重写如下：\n\
  \n```\nStreamReader sr = new StreamReader(aFile);\nint charCode;\ncharCode = sr.Read();\n\
  while(charCode != -1)\n{\n   Write(Convert.ToChar(charCode));\n   charCode = sr.Read();\n\
  }\nsr.Close();\n```\n\n对于较小文件，非常方便的方法是 `ReadToEnd()`。它读取整个文件并将其作为字符串返回。在这种情况下，之前的应用程序可以简化为：\n\
  \n```\nStreamReader sr = new StreamReader(aFile);\nline = sr.ReadToEnd();\nWriteLine(line);\n\
  sr.Close();\n```\n\n虽然这看起来简单方便，但要小心。通过将所有数据读取到字符串中，你强制要求数据存在于内存中。取决于数据文件的大小，这可能是无法接受的。如果数据文件巨大，最好将数据留在文件中，并使用\
  \ `StreamReader` 的方法进行访问。\n\n另一种处理大文件的方法（在 .NET 4 中引入）是使用静态的 `File.ReadLines()`\
  \ 方法。事实上，`File` 有许多静态方法可以用于简化读写文件数据，但这种方法特别有趣，因为它返回一个 `IEnumerable<string>` 集合。你可以遍历此集合中的字符串来逐行读取文件。使用此方法，你可以将之前的示例重写为：\n\
  \n```\nforeach (string alternativeLine in File.ReadLines(\"Log.txt\"))\n   WriteLine(alternativeLine);\n\
  ```\n\n正如你所看到的，.NET 有多种方法实现相同的结果——即从文件中读取数据。选择最适合你的技术。\n\n### 异步文件访问\n\n有时——例如当你一次性执行大量文件访问操作或处理非常大的文件时——读取写入文件系统数据可能是缓慢的。如果是这样，你可能希望在等待时执行其他操作。这对于桌面应用程序尤为重要，因为你希望在后台执行工作时，应用程序对用户保持响应。\n\
  \n\n\n\n为了方便起，.NET 4.5 引入了处理流的异步方法。这适用于 `FileStream` 类，也适用于 `StreamReader` 和 `StreamWriter`。如果你浏览过这些类的定义，你可能会注意到一些以后缀\
  \ `Async` 结尾的方法——例如，`StreamReader` 有一个名为 `ReadLineAsync()` 的方法，它是 `ReadLine()` 的异步版本。这些方法设计用于基于任务的异步编程模型（task-based\
  \ asynchronous programming model）。\n\n异步编程是一种高级技术，本书中没有对其进行详细介绍。然而，如果你对异步文件系统访问感兴趣，那么这里就是你的学习起点。你可能还想阅读\
  \ Christian Nagel 编写的 *Professional C# 7.0 and .NET Core 2.0*（Wrox, 2018）以获取更多细节。\n\
  \n## 读取和写入压缩文件\n\n通常在处理文件时，磁盘上会占用大量的空间。这对于图形和声音文件来说尤为如此。你可能遇到过可以让你压缩和解压缩文件的实用程序，这些工具在你想要移动文件或通过电子邮件发送它们时非常合用。`System.IO.Compression`\
  \ 命名空间包含了若干类，让你能够通过代码压缩文件，可以使用 GZIP 或 Deflate 算法——这两种算法都是公开的且供任何人免费使用的。\n\n不过，压缩文件不仅仅是压缩本身那么简单。你可能已经过商业应用程序如何将多个文件放在单个压缩文件中，这通常被称为*归档*（archive）。`System.IO.Compression`\
  \ 命名空间中存在可以实现类似功能的类。然而，为了保持本书的简单性，你将只查看一种场景：将文本数据保存到压缩文件中。你可能无法在外部实用程序访问此文件，但该文件会比其未压缩的副本小得多！\n\
  \n你在这里将看到的 `System.IO.Compression` 命名空间中的两个压缩流类 `DeflateStream` 和 `GZipStream` 的工作方式非常相似。在这两种情况下，你都用一个现有流来初始化它们，对于文件来说，这将是一个\
  \ `FileStream` 对象。之后，你可以像使用其他流一样将它们与 `StreamReader` 和 `StreamWriter` 使用。你只需要额外指定该流是用于压缩（保存文件）还是解压缩（加载文件），以便该类知道如何处理通过它的数据。下面的示例可以很好地说明这一点。\n\
  \n## 监控文件系统\n\n有时，应用程序必须执行不仅仅是向文件系统读写文件的操作。例如，知道文件或目录何时被修改可能非常重要。.NET Framework\
  \ 能够轻松创建执行此类操作自定义应用程序。\n\n帮助你实现此点的类是 `FileSystemWatcher` 类。它暴露了你的应用程序可以捕的多个事件。这使得你的应用程序能够响应文件系统事件。\n\
  \n使用 `FileSystemWatcher` 的基本非常简单。首先，你必须设置若干属性，指定监控哪里、监控什么，以及何时应该引发你的应用程序将处理的事件。然后，你给它提供自定义事件处理程序的地址，以便在发生重大事件时调用这些处理程序。最后，你开启它并等待事件发生。\n\
  \n在启用 `FileSystemWatcher` 对象之前必须设置的属性如表 20-10 所示。\n\n| **属性** | **描述** |\n| ---\
  \ | --- |\n| `Path` | 必须设置为要监控的文件位置或目录。 |\n| `NotifyFilter` | `NotifyFilters` 枚举值的组合，用于指定在监控的文件内关注什么。这些代表了被监控的文件或文件夹的属性。如果指定的任何属性发生变化，就会引发事件。可能的枚举值有\
  \ `Attributes`、`CreationTime`、`DirectoryName`、`FileName`、`LastAccess`、`LastWrite`、`Security`\
  \ 和 `Size`。注意，这些值可以使用二进制 `OR` 运算符进行组合。 |\n| `Filter` | 指定要监控哪些文件的过滤器——例如 `*.txt`。\
  \ |\n\n**表 20-10 :** FileSystemWatcher 属性\n\n一旦设置好这些，你必须为四个事件编写事件处理程序：`Changed`、`Created`、`Deleted`\
  \ 和 `Renamed`。如第 13 章所示，这只需创建你自己的方法并将其分配给对象的事件。通过将你自己的事件处理程序分配给这些方法，当事件触发时，你的方法就会被调用。当匹配\
  \ `Path`、`NotifyFilter` 和 `Filter` 属性的文件或目录被修改时，每个事件都会触发。\n\n一旦设置了属性和事件，将 `EnableRaisingEvents`\
  \ 属性设置为 `true` 以开始监控。在接下来的“尝试一下”（Try It Out）中，你将在简单的客户端应用程序中使用 `FileSystemWatcher`\
  \ 来跟踪你选择的目录。\n\n## 练习\n\n1. 20.1 哪个命名空间允许应用程序处理文件？\n2. 20.2 在什么情况下你会使用 `FileStream`\
  \ 对象写入文件而不是使用 `StreamWriter` 对象？\n3. 20.3 `StreamReader` 类的哪些方法允许你从文件中读取数据，其中一个的作用是什么？\n\
  4. 20.4 你会使用哪个类使用 Deflate 算法压缩流？\n5. 20.5 `FileSystemWatcher` 类暴露了哪些事件，它们的作用是什么？\n\
  6. 20.6 修改你在本章构建的 FileWatch 应用，添加开启和关闭文件监控的功能。\n\n练习题答案见附录。\n\n## 本章学到的知识\n\n| **主题**\
  \ | **核心概念** |\n| --- | --- |\n| 流 | 流是串行设备的抽象表示，你可以一次一个字节地对其读取或写入。文件是此类设备的一种示例。有两种类型的流——输入流和输出流——分别用于读取和写入设备。\
  \ |\n| 文件类 | .NET Framework 中有许多抽象文件系统的类，包括通过静态方法处理文件和目录的 `File` 和 `Directory`，以及可以实例化以表示特定文件和目录的\
  \ `FileInfo` 和 `DirectoryInfo`。后者类对在对文件和目录执行多次操作时非常有用，因为这些类不需要为每个方法调用提供路径。 |\n|\
  \ 文件路径 | 文件和目录路径可以是绝对的或相对的。绝对路径提供了从包含它的驱动器根开始的完整描述；父目录之间使用反斜杠分隔。相对目录类似，但它们从文件系统中的定义点开始，例如应用程序运行的目录（工作目录）。为了导航文件系统，你通常使用\
  \ `..` 父目录别名。 |\n| FileStream 对象 | `FileStream` 对象提供了对文件内容的访问，用于读写。它在字节级别访问文件数据，因此并不总是访问文件数据的最佳选择。`FileStream`\
  \ 实例维护文件中的位置字节索引，以便你能够遍历文件内容。以这种方式在任何点访问文件被称为*随机访问*（random access）。 |\n\n\n\n\n\n\
  | 对流进行读写操作 | 读写文件数据的更简单方法是结合使用 `StreamReader`、`StreamWriter` 类和 `FileStream`。这些类允许你读取和写入字符和字符串数据，而不是处理字节。这些类型暴露了处理字符串的熟悉方法，包括\
  \ `ReadLine()` 和 `WriteLine()`。由于它们处理的是字符串数据，这些类使得处理逗号分隔的文件变得容易（这是结构化数据的常用方式）。 |\n\
  | 压缩文件 | 你可以使用 `DeflateStream` 和 `GZipStream` 压缩流类来在文件之间读写压缩数据。这些类处理字节数据的方式与 `FileStream`\
  \ 非常相似，但与 `FileStream` 一样，你可以通过 `StreamReader` 和 `StreamWriter` 类访问数据以简化你的代码。 |\n\
  \n| 监控文件系统 | 你可以使用 `FileSystemWatcher` 类来监控文件系统数据的更改。你可以同时监控文件和目录，并在需要时提供过滤器以仅修改具有特定文件扩展的文件。`FileSystemWatcher`\
  \ 实例通过触发事件来通知你更改，你可以在代码中处理这些事件。 |\n\n# 21 XML 和 JSON\n\n## XML 基础知识\n\n可扩展标记语言 (XML)\
  \ 是一种 `data language`，它是以简单的文本格式存储数据的方法，这种格式可以被人类和几乎任何计算机读取。它是一种 W3C 标准格式，类似于 HTML（[`www.w3.org/XML`](http://www.w3.org/XML)）。它已被微软在\
  \ .NET Framework 和其他微软产品完全采用。即使是新版本的 Microsoft Office 引入的文档格式也是基于 XML 的，尽管 Office\
  \ 应用程序本身并不是 .NET 应用程序。\n\nXML 的细节可能非常复杂，所以你不会在这里查看每一个细节。幸运的是，大多数任务并不需要详细的 XML 知识，因为\
  \ Visual Studio 通常会处理大部分工作——你很少需要手动编写 XML 文档。如果你想深入深入学习 XML，可以阅读如 Joe Fawcett、Danny\
  \ Ayers 和 Liam Quin 编写的 *Beginning XML* (Wrox, 2012)，或许多在线教程之一，例如 [`www.xmlnews.org/docs/xml‐basics.html`](http://www.xmlnews.xmlnews.org/docs/xml-basics.html)\
  \ 或 [`http://www.w3schools.com/xml/`](http://www.w3schools.com/xml/)。\n\n基本格式非常简单，如下例所示，该示例显示了共享书籍信息的\
  \ XML 格式。\n\n```xml\n <book>\n    <title>Beginning Visual C# 7</title>\n    <author>Benjamin\
  \ Perkins et al</author>\n    <code>458685</code>\n  </book> \n```\n\n在此示例中，每本书都有一个标题、一个\
  \ `author` 和一个标识书籍的唯一 `code`。每本书的数据都包含在一个 book `element` 中，该元素以 `<book>` `tag` 开始并以\
  \ `</book>` 结束标签结束。标题、作者和代码值存储在 book 元素内部的嵌套元素中。\n\n可选情况下，元素在标签内部还可以拥有 `attributes`。如果书籍代码是\
  \ book 元素的属性而不是它自己的元素，你将看到 book 元素以如下内容开头：`<book code=458685>`。为了简单起见，我们在本章的示例中坚持使用元素。通常情况下，属性和元素都被称为\
  \ `nodes`，就像图的节点一样。\n\n## JSON 基础知识\n\n开发 C# 应用程序时可能会另一种数据语言是 JSON。JSON 代表 JavaScript\
  \ 对象表示法（JavaScript Object Notation）。像 XML 一样，它也是一种标准（[`www.json.org`](http://www.json.org)），但从名称可以看出，它源自\
  \ JavaScript 语言而不是 C#。虽然不像 XML 那样用于整个 .NET，但它是从 Web 服务和网络浏览器传输数据的常用格式。\n\nJSON 也有非常简单的格式。之前在\
  \ XML 中显示的相同书籍数据现在以 JSON 格式呈现在这里：\n\n```json\n {\"book\":[{\"title\":\"Beginning\
  \ Visual C# 2017\",\n          \"author\":\"Benamin Perkins et al\",\n         \
  \ \"code\":\"458685\"}] \n```\n\n与之前的 XML 示例一样，我们看到了具有相同标题、作者和唯一代码的书籍。JSON 使用大括号\
  \ `{}` 来分隔数据块，使用方括号 `[]` 来分隔数组，类似于 C#、JavaScript 和其他类 C 语言使用大括号表示代码块、方括号表示数组的方式。\n\
  \nJSON 是比 XML 更紧凑的格式，但对人类来说更难读，尤其是当大括号和方括号在复杂数据中深度嵌套时。\n\n## XML 模式 (SCHEMAS)\n\n\
  XML 文档可以由 `schema` 描述，这是另一个 XML 文件，描述了特定文档中允许哪些元素和属性。你可以根据模式对 XML 文档进行 `validate`（验证），确保你的程序不会遇到未准备好处理的数据。C#\
  \ 使用的标准模式 XML 格式是 XSD（XML 模式定义）。\n\n图 21‐1 包含了 Visual Studio 识别的模式长列表（你可以通过选择 Visual\
  \ Studio 菜单中的 XML ![image](img/Image00008.gif) Schemas… 来查看此列表）。然而，Visual Studio\
  \ 不会自动记住你使用过的模式。如果你反复使用某个模式且不想每次都浏览它，可以将其复制到以下位置：`C:\\Program Files (x86)\\Microsoft\
  \ Visual Studio\\2017\\Community\\Xml\\Schemas`。复制到该位置的模式将出现在 Schemas 对话框中。\n\n\
  ![Visual Studio 识别的模式长列表截图](img/Image00251.jpg)\n**图 21‐1**](#text00027.html_R_001)\n\
  \n你可以从 XML 文件创建 XML 模式，然后使用该模式进行验证。\n\n## XML 文档对象模型\n\nXML 文档对象模型（XML DOM）是一组用于以直观方式访问和操作\
  \ XML 的类。DOM 可能不是读取 XML 最快的方法，但一旦你理解了类与 XML 元素之间的关系，就会发现它非常好用。\n\n组成 DOM 的类可以在 `System.Xml`\
  \ 命名空间中找到。该命名空间有几个类，但本章重点关注能够轻松操作 XML 的少数类。这些类描述在表 21‐1 中。\n\n| 类 | 描述 |\n| ---\
  \ | --- |\n| `XmlNode` | 代表文档树中的单个节点。它是本章所示许多类的基。如果此节点代表 XML 文档的根，你可以从它导航到文档的任何位置。\
  \ |\n| `XmlDocument` | 扩展了 `XmlNode` 类，但通常是你使用 XML 的第一个对象。这是因为该类用于从磁盘或其他地方加载和保存数据。\
  \ |\n| `XmlElement` | 代表 XML 文档中的单个元素。`XmlElement` 派自 `XmlLinkedNode`，后者又派自 `XmlNode`。\
  \ |\n| `XmlAttribute` | 代表单个属性。与 `XmlDocument` 类一样，它派自 `XmlNode` 类。 |\n| `XmlText`\
  \ | 代表起始标签和结束标签之间的文本。 |\n| `XmlComment` | 代表一种特殊的节点，除了向读者提供文档部分的信息外，不被视为文档的一部分。\
  \ |\n| `XmlNodeList` | 代表节点集合。 |\n\n**[表 21-1]:** 常见 DOM 类\n\n### XmlDocument 类\n\
  \n\n\n\n通常，你的应用程序对 XML 做的第一件事就是从磁盘读取它。如 表 21-1 所示，这是 `XmlDocument` 类的领域。你可以将 `XmlDocument`\
  \ 视为磁盘上文件的内存表示。一旦你使用 `XmlDocument` 类将文件加载到内存中，你就可以从它获取文档的根节点并开始读取和操作 XML：\n\n```xml\n\
  using System.Xml;\n\n.\n\n.\n\n.\n\nXmlDocument document = new XmlDocument();\n\n\
  document.Load(@\"C:\\BeginningCSharp7\\Chapter21\\XML and Schema\\books.xml\");\
  \ \n```\n\n这两行代码创建了 `XmlDocument` 类的一个新实例，并将 `books.xml` 文件加载到其中。\n\n记住，`XmlDocument`\
  \ 类位于 `System.Xml` 命名空间中，你应该在代码开头的 `using` 部分插入 `using System.Xml;`。\n\n除了加载和保存\
  \ XML 之外，`XmlDocument` 类还负责维护 XML 结构本身。因此，你会在该类中找到许多用于创建、修改和删除树中节点的方法。你很快就会看到其中一些方法，但为了正确演示这些方法，你需要更多地了解另一个类：`XmlElement`。\n\
  \n### XmlElement 类\n\n现在文档已经加载到内存中，你想对它进行一些操作。你在前面的代码中创建的 `XmlDocument` 实例的 `DocumentElement`\
  \ 属性返回一个 `XmlElement` 实例，代表 `XmlDocument` 的根元素。这个元素很重要，因为它让你访问文档中的每一比特信息：\n\n```xml\n\
  XmlDocument document = new XmlDocument();\n\ndocument.Load(@\"C:\\BeginningCSharp7\\\
  Chapter21\\\nXML and Schema\\books.xml\");\n\nXmlElement element = document.DocumentElement;\
  \ \n```\n\n获取文档的根元素后，你就可以使用这些信息了。`XmlElement` 类包含了操作树的节点和属性的方法和属性。让我们先检查导航 XML 元素的属性，如\
  \ 表 21-2 所示。\n\n| **属性** | **描述** |\n| --- | --- |\n| `FirstChild` | 返回此元素之后的第一个子元素。如果你还记得本章早前的\
  \ `books.xml` 文件，文档的根节点名为“books”，其后的下一个节点是“book”。那么在那个文档中，根节点“books”的第一个子节点就是“book”。`<books>\
  \ 根节点` `<book> FirstChild` `FirstChild` 返回一个 `XmlNode` 对象，你应该检查返回节点的类型，因为它可能始终是\
  \ `XmlElement` 实例。在书籍示例中，`Title` 元素的子节点实际上是一个代表文本 `Beginning Visual C#` 的 `XmlText`\
  \ 节点。 |\n| `LastChild` | 运行方式与 `FirstChild` 属性完全相同，但它返回当前节点的最后一个子节点。在书籍示例中，“books”节点的最后一个子节点仍然是一个“book”节点，但它将是代表“Beginning\
  \ XML”书籍的节点。`<books> 根节点` `<book> FirstChild` `<title>Beginning Visual C# 2017</title>`\
  \ `<author>Benjamin Perkins et al</author>` `<code>458685</code>` `</book>` `<book>\
  \ LastChild` `<title>Beginning XML</title>` `<author>Joe Fawcett et al</author>`\
  \ `<code>162132</code>` `</book>` `</books>` |\n| `ParentNode` | 返回当前节点的父节点。在书籍示例中，“books”节点是两个“book”节点的父节点。\
  \ |\n| `NextSibling` | 与 `FirstChild` 和 `LastChild` 属性返回当前节点的叶子节点不同，`NextSibling`\
  \ 节点返回具有相同父节点的下一个节点。在书籍示例中，这意味着获取 `title` 元素的 `NextSibling` 将返回 `author` 元素，对该元素调用\
  \ `NextSibling` 将返回 `code` 元素。 |\n| `HasChildNodes` | 允许检查当前元素是否具有子元素，而无需实际从 `FirstChild`\
  \ 获取值并与 `null` 进行比较。 |\n\n**表 21-2 :** XmlElement 属性\n\n使用 表 21-2 中的五个属性，可以遍历整个\
  \ `XmlDocument`，如下面的“尝试一下”所示。\n\n### 修改节点的值\n\n在检查如何更改节点的值之前，重要的是节点的值很少是简单的东西。事实上，你会发现，尽管所有派生自\
  \ `XmlNode` 的类都包含一个名为 `Value` 的属性，但它很少向你返回对你有用的信息。 |\n\n\n\n\n# 插入新节点\n\n现在你已经看到可以在\
  \ XML 文档中移动，甚至获取元素的值，让我们来检查如何通过向你一直使用的 `books` 文档添加节点来更改文档的结构。\n\n要在列表中插入新元素，你需要检查\
  \ `XmlDocument` 和 `XmlNode` 类上的新方法，这些方法在表 21-4 所示。`XmlDocument` 类具有允许你创建新的 `XmlNode`\
  \ 和 `XmlElement` 实例的方法，这很棒，因为这两个类都只有受保护构造函数，这意味着你不能直接使用 `new` 创建其中任何一个类的实例。\n\n\
  | 方法 | 描述 |\n| --- | --- |\n| `CreateNode` | 创建任何类型的节点。该方法有三个重载，其中两个允许你创建在 `XmlNodeType`\
  \ 枚举中找到的类型的节点，另一个允许你以字符串的形式指定要使用的节点类型。除非你非常确定要指定枚举之外的节点类型，否则请使用枚举的两个重载。该方法返回 `XmlNode`\
  \ 实例，然后可以显式地转换为相应的类型。 |\n| `CreateElement` | `CreateNode` 的版本，仅创建 `XmlElement` 类型的节点。\
  \ |\n| `CreateAttribute` | `CreateNode` 的版本，仅创建 `XmlAttribute` 类型的节点。 |\n| `CreateTextNode`\
  \ | 创建——是的，你猜对了——`XmlTextNode` 类型的节点。 |\n| `CreateComment` | 此处包含此方法是为了突出可以创建的节点类型的多样性。此方法不会创建一个实际上作为\
  \ XML 文档所表示的数据部分的节点，而是为了任何可能需要读取数据的肉眼准备的注释。在应用程序中读取文档时，也可以获取注释。 |\n\n**表 21-4：**\
  \ 创建节点的方法\n\n表 21-4 中的方法都用于用于创建节点本身，但在调用任何一个方法后，在它们变得有用之前，你必须对它们进行一些处理。在创建后，节点不包含任何额外信息，而且尚未插入到文档中。要执行其中任何操作，你应该使用在任何派自\
  \ `XmlNode` 的类（包括 `XmlDocument` 和 `XmlElement`）上的方法，这些方法在表 21-5 中描述。\n\n| 方法 | 描述\
  \ |\n| --- | --- |\n| `AppendChild` | 向 `XmlNode` 类型或派生类型的节点添加子节点。请记住，你添加的节点将出现在调用方法的节点的节点列表的底部。如果你不在乎子节点的顺序，那没问题；如果你在乎，请按正确的顺序添加节点。\
  \ |\n| `InsertAfter` | 精确控制你想插入新节点的位置。该方法接受两个参数——第一个是新节点，第二个是新节点应该插入在其之后的节点。 |\n\
  | `InsertBefore` | 工作方式与 `InsertAfter` 完全相同，只是新节点被插入在你提供的作为引用的节点之前。 |\n\n**表 21-5：**\
  \ 插入节点的方法\n\n在接下来的“尝试一试”中，你将在之前的示例的基础上在 `books.xml` 文档中插入一个书籍节点。示例中还没有用于清理文档的代码（目前），所以如果你运行它几次，最后可能会得到许多完全相同的节点。\n\
  \n## 删除节点\n\n现在你已经了解了如何创建新节点，剩下的就是学习如何删除它们。所有派自 `XmlNode` 的类都包含两个方法，如表 21-6 所示，这些方法允许你从文档中删除节点。\n\
  \n| 方法 | 描述 |\n| --- | --- |\n| `RemoveAll` | 移除调用该方法的节点上的所有子节点。稍不明显的是，它还会移除该节点上的所有属性，因为这些属性也被视为子节点。\
  \ |\n| `RemoveChild` | 移除调用该方法的节点上的单个子节点。该方法返回从文档中移除的节点，但如果你改变了主意，可以重新插入它。 |\n\n\
  **表 21-6：** 删除节点的方法\n\n接下来的简短“尝试一试”扩展了你在过去两个示例中创建的应用程序，包含了删除节点的功能。目前，它只找到书籍节点的最后一个实例并将其删除。\n\
  \n## 选择节点\n\n现在你已经知道如何在 XML 文档中来回移动，如何操作文档的值，如何创建新节点，以及如何再次删除它们。本节仅剩一件事：如何在不需要遍历整个树的情况下选择节点。\n\
  \n`XmlNode` 类包含两个方法，在表 21-7 中描述：`SelectSingleNode` 和 `SelectNodes` 使用一种特殊的查询语言 XPath\
  \ 来从文档中选择节点，无需遍历它。\n\n| 方法 | 描述 |\n| --- | --- |\n| `SelectSingleNode` | 选择单个节点。如果你的查询获取了多个节点，将返回第一个节点。\
  \ |\n| `SelectNodes` | 以 `XmlNodeList` 类的形式返回节点集合。 |\n\n**表 21-7：** 选择节点的方法\n\n\
  ## 将 XML 转换为 JSON\n\n我们在本章的介绍中提到了 JSON 数据语言。C# 系统对 JSON 的支持有限，但你可以使用第三方 JSON 库来处理\
  \ JSON 并将其转换为 XML，反之亦然，进行类似的操作。通过 Visual Studio NuGet 包管理器可以使用的一种库是 Newtonsoft JSON\
  \ (json.net)。\n\n接下来的简短“尝试一试”扩展了你在之前的示例中创建的应用程序，包含了将 XML 转换为 JSON 的功能。\n\n## 使用\
