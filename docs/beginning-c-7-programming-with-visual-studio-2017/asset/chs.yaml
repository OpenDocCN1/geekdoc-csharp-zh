  \ XPath 可以用于任何格式良好的 XML 文档，但你在创建查询时必须知道文档的结构，这意味着只要文档符合相同的 Schema，查询就能在文档上工作。 |\n\
  \n# 22 LINQ\n\n## LINQ TO XML\n\nLINQ to XML 是 XML 的另一组类，它允许对 XML 数据使用 LINQ，即使你没有使用\
  \ LINQ 也能让某些 XML 操作变得简单。我们将查看 LINQ to XML 优于上一章引入的 XML DOM（文档模型）的特定情况。\n\n### LINQ\
  \ to XML 函数构造\n\n虽然你可以用 XML DOM 在代码中创建 XML 文档，但 LINQ to XML 提供了一种更简单的创建 XML 文档的方法，称为“函数构造”。在函数构造中，构造调用以自然反映\
  \ XML 文档结构的方式嵌套。在接下来的“尝试”中，你使用函数构造创建一个包含客户和订单简单 XML 文档。\n\n### 处理 XML 片段\n\n与 XML\
  \ DOM 不同，LINQ to XML 处理 XML 片段（部分或不完整的 XML 文档）的方式与完整 XML 文档非常相似。处理片段时，只需使用 `XElement`\
  \ 作为顶级 XML 对象，而不是 `XDocument`。在接下来的“尝试”中，像处理 XML 文档一样加载、保存并操作 XML 元素及其子节点。\n\n##\
  \ LINQ 提供\n\nLINQ to XML 只是 LINQ 提供的一个示例。Visual Studio 2017 和 .NET Framework 4.7\
  \ 带有许多内置的 LINQ 提供，为不同类型的数据提供查询解决方案：\n\n* **LINQ to Objects** —— 对任何种内存对象（如数组、列表和其他集合类型）提供查询。上一章中的所有示例都使用\
  \ LINQ to Objects。\n* **LINQ to XML** —— 如你所看到的，它与其他 LINQ 类型相同的语法和通用机制提供 XML 文档的创建和操作。\n\
  * **LINQ to Entities** —— Entity Framework 是 .NET 中最新的数据类，微软推荐用于新开发。\n* **LINQ to\
  \ Data Set** —— `DataSet` 对象是在 .NET Framework 第一版本引入的。这种 LINQ 类型可以轻松查询遗留的 .NET 数据。\n\
  * **LINQ to SQL** —— 这种替代的 LINQ 接口已被 LINQ to Entities 取代。\n* **PLINQ** —— PLINQ（或并行\
  \ LINQ）使用并行编程库扩展了 LINQ to Objects，该库可以将查询拆分并在多核处理器上同时执行。\n* **LINQ to JSON** ——\
  \ 包含在上一章使用的 Newtonsoft 包中，该库与其他 LINQ 类型相同的语法和通用机制支持创建和操作 JSON 文档。\n\n由于有许多 LINQ\
  \ 类型，在入门书中涵盖所有类型是不可能的，但你将看到的语法和方法适用于所有类型。让我们来看使用 LINQ to Objects 提供者的 LINQ 查询语法。\n\
  \n## LINQ 查询语法\n\n在接下来的“尝试”中，你使用 LINQ 创建一个查询，在简单的内存对象数组中查找某些数据并将其打印到控制台。\n\n###\
  \ 使用 var 关键字为结果声明变量\n\nLINQ 查询从声明一个存储查询结果变量开始，这通常通过声明带有 `var` 关键字的变量来实现：\n\n```\n\
  var queryResult =\n```\n\n`var` 是 C# 中的一个关键字，用于声明一种通用变量类型，非常适合用于存储 LINQ 查询的结果。`var`\
  \ 关键字告诉 C# 编译器根据查询推断结果的类型。这样，你就不需要提前声明 LINQ 查询将返回什么类型的对象——编译器会处理。如果查询可以返回多个项，那么它看起来就像查询数据源中对象的集合（技术上它不是集合，只是看起来如此）。\n\
  \n顺便说一下，`queryResult` 这个名称是随意的——你可以为结果命名任何名称。它可以是 `namesBeginningWithS` 或程序中任何其他合理的名称。\n\
  \n### 指定数据源：from 子句\n\n\n\n\n\nLINQ 查询的下一部分是 `from` 子句，它指定了你正在查询的数据：\n\n```\n from\
  \ n in names \n```\n\n在这种情况下，你的数据源是 `names`，即之前声明的字符串数组。变量 `n` 只是数据源中单个元素的占位符，类似于\
  \ `foreach` 语句后面的变量名。通过指定 `from`，你表示你将对集合的子集进行*查询（query）**，而不是遍历所有元素。\n\n提到迭代，LINQ\
  \ 数据源必须是*可枚举的（enumerable）**——也就是说，它必须是一个数组或项的集合，你可以从中选取一个或多个元素进行迭代。\n\n数据源不能是一个单个值或对象，例如单个\
  \ `int` 变量。你已经有了这样一个单项了，所以对它进行查询没有意义！\n\n### 指定条件：where 子句\n\n在 LINQ 查询的后续部分，你使用\
  \ `where` 子句来指定查询的条件，它的形式如下：\n\n```\n where n.StartsWith(\"S\") \n```\n\n任何可以应用于数据源中项的布尔（真或假）表达式都可以指定在\
  \ `where` 子句中。实际上，`where` 子句是可选的，甚至可以省略，但在几乎所有情况下，你都会希望指定一个 `where` 条件，将结果限制为你需要的数据。`where`\
  \ 子句在 LINQ 中被称为*限制运算符（restriction operator）*，因为它限制了查询的结果。\n\n在这里，你指定名称字符串以字母 S 开，但你也可以指定字符串的任何属性——例如，长度大于\
  \ 10（`where n.Length > 10`）或包含 Q（`where n.Contains(\"Q\")`）。\n\n### 选择项：select 子句\n\
  \n最后，`select` 子句指定哪些项出现在结果集中。`select` 子句的形式如下：\n\n```\n select n \n```\n\n`select`\
  \ 子句是必须，因为你必须指定查询中的哪些项出现在结果集中。对于这组数据来说，这并不十分意思，因为结果集的每个元素只有一个项，即名称。你将看到一些结果集中包含复杂对象的示例，那时\
  \ `select` 子句的用处将更加明显，但首先你需要完成这个示例。\n\n### 结束示例：使用 foreach 循环\n\n现在你打印查询的结果。与用数据源的数组类似，这种\
  \ LINQ 查询的结果也是*可枚举的（enumerable）*，这意味着你可以使用 `foreach` 语句遍历结果：\n\n```\n WriteLine(\"\
  Names beginning with S:\");\n\nforeach (var item in queryResults) {\n\n       WriteLine(item);\n\
  \n} \n```\n\n在这种情况下，你匹配了五个名称——Smith、Smythe、Small、Singh 和 Samba——所以你在 `foreach` 循环中显示这些内容。\n\
  \n### 延迟查询执行\n\n你可能在想 `foreach` 循环实际上并不是 LINQ 本身的一部分——它只是在遍历你的结果。虽然 `foreach` 结构本身不是\
  \ LINQ 的一部分，但它确实是你代码中实际执行 LINQ 查询的部分！查询结果变量的赋值只是保存了一个执行查询的计划；在 LINQ 中，在访问结果之前，数据本身不会被检索。这被称为*延迟查询执行（deferred\
  \ query execution）*或查询的*延迟求值（lazy evaluation）*。对于任何产生结果序列（即列表）的查询，执行将被延迟。\n\n回到代码。你已经打印结果；现在是结束程序了：\n\
  \n```\n Write(\"Program finished, press Enter/Return to continue:\");\n\nReadLine();\
  \ \n```\n\n这些行仅确保控制台程序的结果留在屏幕上，直到你按下键，即使你按下的是 F5 而不是 Ctrl+F5。你将在大多数其他 LINQ 示例中使用这种结构。\n\
  \n## LINQ 方法语法\n\n在 LINQ 中，实现同一功能有多种方法，这在编程中很常见。如前所述，上一个示例是使用 LINQ*查询语法（query syntax）*编写的；在下一个示例中，你将使用\
  \ LINQ 的*方法语法（method syntax）*编写相同的程序（也称为*显式语法（explicit syntax）*，但此处使用方法语法）。\n\n\
  ### LINQ 扩展方法\n\nLINQ 实现为针对集合、数组、查询结果以及任何实现 `IEnumerable<T>` 接口对象的扩展方法。你可以通过 Visual\
  \ Studio 的 IntelliSense 功能查看这些方法。例如，在 Visual Studio 2017 中，打开你完成的 `FirstLINQquery`\
  \ 程序中的 `Program.cs` 文件，并在它下方输入一个对 `names` 数组的新引用：\n\n```\n string[] names = { \"\
  Alonso\", \"Zheng\", \"Smith\", \"Jones\", \"Smythe\", \"Small\",\n\n\"Ruiz\", \"\
  Hsieh\", \"Jorgenson\", \"Ilyich\", \"Singh\", \"Samba\", \"Fatimah\" };\n\nnames.\
  \ \n```\n\n正当你输入 `names` 后面的点时，你将看到 Visual Studio IntelliSense 功能列出 `names` 可用的方法。\n\
  \n`Where<T>` 方法和大多数其他可用方法都是扩展方法（如 `Where<T>` 方法右侧出现的文档所示，它以 `extension` 开头）。你可以通过注释掉顶部的\
  \ `using System.Linq` 指令来确认它们是 LINQ 扩展方法。\n\n### 查询语法与方法语法\n\n查询语法是 LINQ 编程的优选方式，因为它通常更易读，且对于常用查询来说更简单。然而，对方法方法的的基本理解很重要，因为某些\
  \ LINQ 功能在查询语法中不可用，或者在方法语法中使用更方便。在本章中，你将主要使用查询语法，但在需要的地方会指出方法语法。\n\n### Lambda 表达式\n\
  \nLambda 表达式是一种为你的 LINQ 查询即时创建方法的简单方法。它使用 `=>` 运算符，声明了方法的参数，紧接着是方法逻辑，全部写在一行内！\n\n\
  例如，考虑这个 Lambda 表达式：\n\n`n => n < 0`\n\n这声明了一个名为 `n` 的单参数方法。当 `n` 小于 0 时，方法返回 *true*，否则返回\
  \ *false*。这非常简单。你不需要命名方法，不需要写 return 语句，也不需要用大括号包裹任何代码。\n\n返回这样的真假值对于 LINQ Lambda\
  \ 中的方法是典型的，但并不一定要这样做。例如，这里创建一个返回两个变量之和方法的 Lambda。此 Lambda 使用多个参数：\n\n`(a, b) =>\
  \ a + b`\n\n这声明了一个有两个名为 `a` 和 `b` 的参数的方法。方法逻辑返回 `a` 和 `b` 之和。你不需要声明 `a` 和 `b` 的类型。它们可以是\
  \ int、double 或 string。C# 编译器会自动推断类型。\n\n最后，考虑这个 Lambda 表达式：\n\n`n => n.StartsWith(\"\
  S\")`\n\n如果 `n` 以字母 S 开头，该方法返回 *true*，否则返回 *false*。在实际程序中尝试这个代码，以便更清楚地看到它。\n\n##\
  \ 查询结果排序\n\n\n\n\n\n一旦你使用 `where` 子句（或调用 `Where()` 方法）定位了某些感兴趣的数据，LINQ 就可以轻松地对结果数据进行进一步处理——例如重新排序结果。在接下来的“尝试”（Try\
  \ It Out）中，你将对第一次查询的结果按字母顺序进行排序。\n\n## 理解 ORDERBY 子句\n\n`orderby` 子句如下所示：\n\n```\n\
  \ orderby n \n```\n\n与 `where` 子句一样，`orderby` 子句是可选的。只需添加一行，你就可以对任何任意查询的结果进行排序；否则，这至少需要几行额外的代码，并且可能还需要额外的方法或集合来存储重排序后的结果，这取决于你选择实现的排序算法。如果需要对多种类型进行排序，你必须为每种类型实现一组排序方法。使用\
  \ LINQ，你不需要担心任何这些；只需在查询语句中添加一个额外的子句即可。\n\n默认情况下，`orderby` 按按升序排列（A 到 Z），但你只需通过添加\
  \ `descending` 关键字即可指定降序排列（从 Z 到 A）：\n\n```\n orderby n descending \n```\n\n这将示例结果排序如下：\n\
  \n```\n Smythe\n\nSmith\n\nSmall\n\nSingh\n\nSamba \n```\n\n此外，你可以按任何任意表达式排序，而无需重写查询；例如，要按名称的最后一个字母而不是普通的字母顺序排序，你只需将\
  \ `orderby` 子句更改为：\n\n```\n orderby n.Substring(n.Length - 1) \n```\n\n这将产生以下输出：\n\
  \n```\n Samba\n\nSmythe\n\nSmith\n\nSingh\n\nSmall \n```\n\n## 查询大型数据集\n\n你可能会说，这些\
  \ LINQ 语法固然很好，但意义何在？通过查看原始数组就能清楚地看到预期的结果，那么为什么要费这种劲去查询一个一眼就能看出来的东西呢？正如前面提到的，有时查询结果并不那么显而易见。在接下来的“尝试”中，你创建了一个非常大的数字数组并使用\
  \ LINQ 对其进行查询。\n\n## 使用聚合运算符\n\n通常，查询返回的结果比你预期的要多。例如，如果你将刚刚创建的大数字查询程序的条件更改为列出大于\
  \ 1,000 的数字，而不是小于 1,000 的数字，那么查询结果将多到数字不会停止打印！\n\n幸运的是，LINQ 提供了一组聚合运算符，使你无需遍历所有结果即可分析查询结果。表\
  \ 22-1 显示了用于数值结果（如大数字查询）的最常用聚合运算符。如果你用过 SQL 等数据库查询语言，这些对你来说可能熟悉。\n\n| 运算符 | 说明 |\n\
  | --- | --- |\n| `Count()` | 结果计数 |\n| `Min()` | 结果中的最小值 |\n| `Max()` | 结果中的值 |\n\
  | `Average()` | 数值结果的平均值 |\n| `Sum()` | 所有数值结果的总和 |\n\n**表 22-1 :** 数值结果的聚合运算符\n\
  \n还有更多的聚合运算符，例如 `Aggregate()`，用于以任意方式执行代码，允许你编写自己的聚合函数。然而，这些是针对高级用户的，因此超出了本书的范围。\n\
  \n在接下来的“尝试”中，你修改大数字查询，并使用聚合运算符通过 LINQ 探索大数字查询大于版本的结果集。\n\n## 使用 SELECT DISTINCT\
  \ 查询\n\n熟悉 SQL 数据查询语言的人会认出另一种查询类型是 `SELECT DISTINCT` 查询，在其中，你搜索数据中的唯一值——也就是说，查询会从结果集中移除任何重复值。这在处理查询时是一个很常见的需求。\n\
  \n假设你需要找到之前示例中使用的客户数据中的不同地区（regions）。在你刚刚使用的数据中没有单独的地区列表，因此你需要从客户列表本身找到唯一的、不重复的地区列表。LINQ\
  \ 提供了一个 `Distinct()` 方法，可以轻松地找到这些数据。你将在接下来的“尝试”中使用它。\n\n## 按多级排序\n\n现在你正在处理具有多个属性的对象，你可能会想象出一种情况：仅通过单个字段对查询结果排序是不够的。如果你想查询客户并按地区按字母顺序排序结果，然后在地区内部按国家或城市名称按字母顺序排序呢？LINQ\
  \ 让这变得非常简单，正如你在接下来的“尝试”中所看到的。\n\n## 使用分组查询\n\n分组查询将数据分为组，并允许你按组进行排序、计算聚合和比较。这些通常是业务背景下最有趣的查询（那些真正驱动决策的查询）。例如，你可能想按国家或地区比较销售情况，以决定在哪里开设另一家商店或雇用更多员工。你将在下一个“尝试”中完成操作。\n\
  \n## 使用连接\n\n像你刚刚创建的 `customers` 和 `orders` 列表这样具有共享键字段（ID）的数据集允许 `join` 查询，通过单个查询查询两个列表中的相关数据，并通过键字段将结果连接在一起。这与\
  \ SQL 查询语言中的 `JOIN` 类似。\n\n## 练习\n\n1. 22.1 修改示例示例 `BeginningCSharp722_QuerySyntax`\
  \ 以降序排序。\n2. 22.2 修改大数字示例 `BeginningCSharp722_LargeQuery` 中的 `GenerateOfNumbers()`\
  \ 方法以创建不同的结果集。\n3. 22.3 在大数字示例 `BeginningCSharp722_LargeQuery` 中添加 `orderby` 子句以观察其对性能的影响。\n\
  4. 22.4 修改大数字示例 `BeginningCSharp722_LargeQuery` 中的查询条件以选择更大或更小的子集。这如何影响性能？\n5. 22.5\
  \ 修改方法语法示例 `BeginningCSharp722_MethodSyntax` 以完全消除 `where` 子句。它生成了多少输出？\n6. 22.6\
  \ 为示例示例 `BeginningCSharp722_QuerySyntax` 添加聚合运算符。该数值结果集可以使用哪些聚合运算符？\n\n练习答案见附录。\n\
  \n## 本章学到的知识\n\n| 主题 | 核心概念 |\n| --- | --- |\n| 什么是 LINQ 以及何时使用 | LINQ 是内置在 C# 中的查询语言。使用\
  \ LINQ 从对象集合、XML 或数据库查询数据。 |\n| LINQ 查询的组成 | LINQ 查询包含 `from`、`where`、`select` 和\
  \ `orderby` 子句。 |\n| 如何获取 LINQ 查询的结果 | 使用 `foreach` 语句遍历 LINQ 查询的结果。 |\n| 延迟执行 |\
  \ LINQ 查询执行被延迟到 `foreach` 语句执行。 |\n| 方法语法和查询语法 | 大多数 LINQ 查询使用查询语法，需要时使用方法查询。对于任何给查询，查询语法或方法语法将产生相同的结果。\
  \ |\n| Lambda 表达式 | Lambda 表达式允许你在使用方法语法进行 LINQ 查询时临时声明一个方法。 |\n| 聚合运算符 | 使用 LINQ\
  \ 聚合运算符获取有关大型数据集的信息，而无需遍历每个结果。 |\n| 分组查询 | 使用分组查询将数据分为组，然后按组排序、计算聚合和比较。 |\n\n\n\n\
  \n\n| 排序 (Ordering) | 使用 `orderby` 算符对查询结果进行排序。 |\n| 联 (Joins) | 使用 `join` 算符在单次查询中查询多个集合中的相关数据。\
  \ |\n\n# 23 数据库\n\n## 使用数据库\n\n就本书而言，`database` 是一个持久的、结构化的存储库。有许多种不同的数据库，但你在存储和查询业务数据时最常见的类型是`关系型数据库`，例如\
  \ Microsoft SQL Server 和 Oracle。关系型数据库使用 SQL 数据库语言（`SQL` 代表结构化查询语言）来查询和操作其数据。传统上，处理此类数据库需要至少了解一些\
  \ SQL，要么在你的编程语言中嵌入 SQL 语句，要么向 SQL 东方数据库类库中的 API 调用或方法传递包含 SQL 语句的字符串。\n\n听起来很复杂，对吧？好消息是，通过\
  \ Visual Studio 2017，你可以使用 `Code First` 方法在 C# 中创建对象，将它们存储在数据库中，并使用 `LINQ` 查询这些对象，而无需使用\
  \ SQL 等其他语言。\n\n## 安装 SQL SERVER EXPRESS\n\n为了运行本章所示的示例，你必须安装 Microsoft SQL Server\
  \ Express，这是 Microsoft SQL Server 的免费轻量版本。你将使用 SQL Server Express 的 `LocalDB` 选项，它允许\
  \ Visual Studio 2017 直接创建和打开数据库文件，无需连接到单独的服务器。\n\n带有 LocalDB 的 SQL Server Express\
  \ 支持完整版 Microsoft SQL Server 相同的 SQL 语法，因此它是初学者学习的合适版本。通过此链接下载 SQL Server express：`https://www.microsoft.com/sql-server/sql-server-editions-express`。\n\
  \n## ENTITY FRAMEWORK\n\n支持 Code First 的 .NET 类库是最新版本的`Entity Framework`。名称源于名为`实体-关系`（entity-relationship）的数据库概念，在该模型中，`实体`\
  \ 是数据对象的抽象概念（例如客户），它在关系型数据库中与其他实体（如订单和产品）相关（例如，客户为产品下了订单）。\n\n`Entity Framework`\
  \ 将你程序中的 C# 对象映射到关系型数据库中的实体。这被称为`对象-关系映射`（object-relational mapping）。`对象-关系映射`是将代码将\
  \ C# 中的类、对象和属性映射到构成关系型数据库的表、行和列的代码。手动创建这些映射代码是枯燥且耗时的，但 `Entity Framework` 让这一切变得简单！\n\
  \n`Entity Framework` 构建在 `ADO.NET` 之上，它是 .NET 内置的底层数据访问库。`ADO.NET` 需要一些 SQL 知识，但幸运的是\
  \ `Entity Framework` 也为你处理了这些问题，让你专注于你的 C# 代码。\n\n## CODE FIRST 数据库\n\n在接下来的“尝试一下”中，你将使用\
  \ Entity Framework 通过 Code First 方法在数据库中创建一些对象，然后使用 LINQ to Entities 查询你创建的这些。\n\
  \n## 但我的数据库在哪里？\n\n但等一下，你说。你创建的数据库在哪里呢？你从未指定过文件名或文件夹位置——这一切都是魔法！你可以在 Visual Studio\
  \ 2017 的服务器资源管理器中查看数据库。前往 工具 ![image](img/Image00008.gif) 连接到数据库。`Entity Framework`\
  \ 将在你计算机上找到的第一个本地 SQL Server 实例中创建一个数据库。\n\n如果你之前计算机上没有任何任何数据库，Visual Studio 2017\
  \ 会为你创建一个名为 `(localdb)\\MSSQLLocalDB` 的本地 SQL Server 实例。连接到此类数据库类型时，在服务器名称字段中输入\
  \ `(localdb)\\MSSQLLocalDB`，如图 23-8\n\n**图 23-8**\n\n包含你数据的数据库将被命名为 `BeginningCSharp7_23_1_CodeFirstDatabase.BookContext`，前提是你完全按照章节所示的内容输入了示例名称。在稍等连接后，它将出现在“选择或输入数据库名称”字段中。\n\
  \n现在你可以点击确定，数据库将出现在 Visual Studio 2017 的服务器资源管理器“数据连接”窗口中，如图 23-9\n\n**图 23-9**\n\
  \n从这里起你可以直接探索数据库。例如，你可以右键点击 Books 表并选择“显示表数据”，以查看你输入的数据，如图 23-10\n\n**图 23-10**\n\
  \n## 导航数据库关系\n\n`Entity Framework` 最强大的方面之一是它能够自动创建 LINQ 对象来帮助关系。\n\n在接下来的“尝试一下”中，你为\
  \ `Book` 类添加了两个类以创建一个简单的书店报告。新类是 `Store` 和 `Stock`，用于表示库存。这些类及其关系如图 23-11\n\n**图\
  \ 23-11**\n\n每个 `Store` 有一个名称、地址和一个由一个或多个 `Stock` 对象组成的集合，对应每个不同的书籍。`Store` 和 `Stock`\
  \ 之间的关系是一对多。每个 `Stock` 记录对应唯一一个 `Book`。`Stock` 和 `Book` 之间的关系是一对一。你需要库存记录，是因为一家书店可能有三本特定的书，而另一家书店可能有六本。\n\
  \n你会发现通过 Code First，你只需要创建 C# 对象和集合，`Entity Framework` 就会为你创建数据库结构，并让你轻松导航数据库对象之间的关系。\n\
  \n## 处理迁移\n\n在开发过程中，你会改变主意。你会为其中一个属性想一个更好的名称，或者意识到你需要一个新的类或关系。如果你通过 `Entity Framework`\
  \ 更改连接到数据库的类，将遇到如图 23-14 所示的 `Invalid Operation Exception`。\n\n![截图说明，通过 Entity\
  \ Framework 更改连接到数据库的类时遇到 Invalid OperationException](img/Image00272.jpg)\n\n**图\
  \ 23-14**\n\n保持数据库与更改后的类同步是复杂的，但同样 `Entity Framework` 提供了一项功能使其变得相对简单。正如错误消息所示，你需要在程序中添加\
  \ Code First 迁移包。\n\n要执行此操作，前往 工具 ![image](img/Image00008.gif) NuGet 包管理器 ![image](img/Image00008.gif)\
  \ 包管理器控制台。这将弹出一个命令行窗口，如图 23-15 所示。\n\n\n\n\n\n![截图说明，通过向程序中添加 Code First Migrations\
  \ 程序包并进入工具 &#10154 NuGet 包管理器&#10154 程序包控制台来打开命令窗口。](img/Image00273.jpg)\n\n图 23‐15\n\
  \n要启用数据库自动迁移到更新后的类结构，请在程序包管理器控制台的 `PM>` 提示符处输入此命令：\n\n```\nEnable-Migrations –EnableAutomaticMigrations\n\
  ```\n\n这将为你的项目添加一个 `Migrations` 类，如图 23‐16 所示。\n\n![截图说明，显示向项目添加 Migrations 类的下一步操作。](img/Image00274.jpg)\n\
  \n图 23‐16\n\n`Entity Framework` 将比较数据库的时间戳与你的程序，并在数据库与你的类不同步时向你发出。要更新数据库，只需在程序包管理器控制台的\
  \ `PM>` 提示符处输入此命令：\n\n```\nUpdate-Database -Force\n```\n\n## 从现有数据库创建并查询 XML\n\n\
  在最后一个示例中，你将结合所学的关于 `LINQ`、数据库和 `XML` 的所有知识。\n\n`XML` 通常用于客户端和服务器机器之间，或多层应用程序中不同“层”之间的数据通信。在数据库中查询某些数据，然后根据这些数据生成\
  \ `XML` 文档或片段并传递给另一层是非常常见的。\n\n在接下来的“尝试一下”（Try It Out）中，你将创建一个查询来查找上一个示例数据库中的某些数据，使用\
  \ `LINQ to Entities` 查询数据，然后使用 `LINQ to XML` 类将数据转换为 `XML`。这是数据库优先（Database First）编程的示例，而不是代码优先（Code\
  \ First）编程——后者是你获取一个现有数据库并从中生成 C# 对象。\n\n## 练习题\n\n1. **23.1** 修改第一个示例 `BeginningCSharp7_23_1_CodeFirstDatabase`，提示用户输入标题和作者，并将用户输入的数据存储到数据库中。\n\
