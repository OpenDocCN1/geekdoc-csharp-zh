  \n这看起来可能有很多内容需要吸收，但很快就能熟悉。你从构建第一个示例项目开始，这涉及许多上述的 Visual Studio 元素。\n\n## 控制台应用程序\n\
  \n你在书中经常使用控制台应用程序，特别是在开头，因此接下来的“尝试”提供了创建一个简单程序的步骤指南。\n\n### 解决方案管理器\n\n默认情况下，解决方案管理器停靠在屏幕的右上角。与其他窗口一样，你可以将其移动到任何地方，或者通过点击图钉图标将其设置为自动隐藏。解决方案管理器与另一个名为“类视图”的有用窗口共享空间，你可以通过视图\
  \ ![image](img/Image00008.gif) 类视图显示它。图 2‐8 显示了这两个窗口，所有节点已展开（当窗口停靠时，可以通过点击窗口底部的标签在它们之间切换）。\n\
  \n![解决方案管理器和另一个名为类视图的有用窗口的屏幕说明插图。](img/Image00015.jpg)\n\n**图 2‐8**\n\n此解决方案视图显示构成\
  \ `ConsoleApplication1` 项目的文件。添加代码的文件 `Program.cs` 与另一个代码文件 `AssemblyInfo.cs` 以及几个引用一起显示。\n\
  \n你目前不需要担心 `AssemblyInfo.cs` 文件。它包含了一些你目前还不关注的项目额外信息。\n\n\n\n\n你可以通过双击 `.cs` 文件、右键点击它们并选择“查看代码”（View\
  \ Code），或者选择它们并点击窗口顶部出现的工具栏按钮，来更改主窗口中显示的代码。你还可以在此处对文件进行其他操作，例如重命名它们或从项目中删除它们。其他文件类型也会出现在这里，例如项目资源（资源是项目使用的文件，但可能不是\
  \ C# 文件，例如位图图像和声音文件）。同样，你可以通过相同的界面对它们进行操作。\n\n你还可以展开 `Program.cs` 等代码项以查看其内容。这种对代码结构的概述是一个非常有用的工具；它它还允许你直接导航到代码文件的特定部分，而无需打开代码文件并滚动到你想要的部分。\n\
  \n`References`（引用）条目包含了你在项目中使用的 .NET 库列表。你稍后会查看此内容；目前标准引用就可以了。类视图（Class View）通过显示你创建的代码结构，提供了项目的另一种视图。你将在本书的后后部分回到这里；现在使用解决方案管理器（Solution\
  \ Explorer）的显示是合适的。当你点击这些窗口中的文件或其他图标时，请注意属性（Properties）窗口（显示在 图 2-9 中）的内容会发生变化。\n\
  \n![截图说明，显示了点击两个窗口中的文件或其他图标时，属性窗口的内容。](img/Image00016.jpg)\n\n图 2-9\n\n### 属性窗口\n\
  \n属性窗口（如果尚未显示，请选择视图 ![image](img/Image00008.gif) 查看 属性窗口）显示了关于你在上方窗口中所选的任何内容的附加信息。例如，当选中项目中的\
  \ `Program.cs` 文件时，会显示如 图 2-9 所示的视图。此窗口还会显示其他所选项的信息，例如用户界面组件（如在本章的“桌面应用程序”部分所示）。\n\
