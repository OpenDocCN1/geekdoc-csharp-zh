  \ 817\n\n\n\n\n804. 818\n805. 819\n806. 820\n\n# 使用 Visual Studio® 2017 开始 C# 7\
  \ 编程\n\nBenjamin Perkins\nJacob Vibe Hammer\nJon D. Reid\n\n![Wiley Logo](img/Image00001.gif)\n\
  \n# 引言\n\n**当微软在 2000 年 7 月发布第一个版本的 .NET Framework 时，C# 语言正式向世界面。** 自此以后，它的热度一飞猛升，可以说已成为使用\
  \ .NET Framework 的桌面、Web、云端和跨平台开发者的首选语言。C# 的魅力部分源于其清晰的语法，这种语法源自 C/C++，但简化了一些以前让某些程序员望而却步的问题。尽管进行了这些简化，C#\
  \ 仍然保留了 C++ 的强大，现在没有理由不转向 C# 了。这门语言并不困难，而且是学习基础编程技术的极佳工具。这种易用性结合 .NET Framework\
  \ 的功能，使 C# 成为开启编程生涯的卓越选择。\n\nC# 的最新版本是 C# 7（包含在 .NET Framework 4.7 版本中），它在现有成功的基础上增加了更多更具吸引力的特性。最新版本的\
  \ Visual Studio（Visual Studio 2017）和 Visual Studio Code 2017 开发工具系列也带来了许多调整和改进，让你的生活更加轻松，并极大提高你的效率。\n\
  \n本书旨在教你学习 C# 编程的所有方面，包括语言本身、桌面、云端和跨平台编程、数据源的使用，以及一些新的高级技术。你还将了解 Visual Studio 2017\
  \ 的功能，以及该产品辅助你应用程序开发的所有方式。\n\n本书以友好的、导师式的风格编写，每一章都建立在前一章的基础上，并尽力让你在无痛的情况下接触高级技术。在任何时候，技术术语都不会凭空出现而打击你继续学习的积极性；每个概念都会根据需要进行引入和讨论。技术术语保持在最低限，但在必要时也会在语文中进行适当的定义和布局。\n\
  \n本书的作者都是各自领域的专家，并且对 C# 语言和 .NET Framework 充满热情。你在任何地方都找不到比他们更合适的人来带领你，并在他们的指导下培养你从原理到高级技术的对\
  \ C# 的理解。除了书中提供的基础知识外，书中还充满了实用的提示、技巧、练习和完整的示例代码（可以在本书的网页 [`www.wrox.com`](http://www.wrox.com)\
  \ 和 [`https://github.com/benperk/BeginningCSharp7`](https://github.com/benperk/BeginningCSharp7)\
  \ 下载），随着你职业生涯的发展，你会发现自己会反复参考这些内容。\n\n我们毫不吝啬地传递这些知识，并希望你能利用它们成为你能成为的最优秀的程序员。祝你好运，一切顺意！\n\
  \n## 本书的读者\n\n本书适合所有想要学习使用 .NET Framework 使用 C# 编写程序的人。它适合那些想通过学习一种简洁、现代、优雅的编程语言来尝试编程的绝对初学者。但它也适合熟悉其他编程语言并想要探索\
  \ .NET 平台的人，以及想要尝试微软 .NET 旗舰语言的现有 .NET 开发者。\n\n## 本书涵盖的内容\n\n早期章节涵盖了语言本身，假设没有之前的编程经验。如果你以前用其他语言编写过程序，这些章节中的大部分内容对你来说是熟悉的。C#\
  \ 语法的许多方面与其他语言共享，许多结构在几乎所有编程语言中都是通用的（例如循环和分支结构）。然而，即使你是一个丰富的程序员，通过阅读这些章节来学习这些技术如何应用于\
  \ C#，你也将获益匪浅。\n\n如果你是编程新手，应该从头开始，在那里你将学习基础编程概念，并熟悉 C# 以及支撑它的 .NET 平台。如果你是 .NET Framework\
  \ 新手但知道如何编程，你应该阅读第 1 章，然后浏览接下来的几章，再继续学习 C# 语言的应用。如果你知道编程但以前没有接触过面向对象的编程语言，你应该从第\
  \ 8 章开始阅读往后的章节。\n\n或者，如果你已经熟悉 C# 语言，你可能想关注处理最新 .NET Framework 和 C# 语言进展的章节，特别是关于集合、泛型和\
  \ C# 语言增强的章节（第 11 章和第 12 章）。\n\n本书的章节编写具有双重目的：可以按顺序阅读提供完整的 C# 语言教程，也可以根据需要作为参考资料查阅。\n\
  \n除了核心内容外，从第 3 章开始，大多数章节末尾还包含了一些练习，你可以通过完成这些练习来确保自己理解了材料。练习从简单的单选题或判断题到需要你构建应用程序的复杂练习不等。所有练习的答案都提供附录录。你也可以在书中\
  \ [wrox.com](http://wrox.com/) 获取这些练习。\n\n本书还配合 C# 7 和 .NET 4.7 的发布投入了大量的关注。每一章都经过了修订，删除了不相关的内容并增加了新内容。所有代码已针对最新的开发工具进行了测试，所有截图均在\
  \ Windows 10 中重新拍摄，以提供最新的窗口和对话框。本版本的新亮点包括：\n\n## 本书的结构\n\n本书分为几个部分：\n\n*   **引言**——本书的目的和内容概览\n\
  *   **C# 语言**——涵盖 C# 语言的所有方面，从基础到面向对象的技术\n*   **Windows 编程**——使用 Windows Presentation\
  \ Foundation (WPF) 编写和部署桌面应用程序\n*   **云端和跨平台编程**——云端和跨平台应用程序开发与部署，包括 Web API 的创建和消费\n\
  *   **数据访问**——如何在应用程序中使用数据，包括存储在硬盘文件、XML 格式和数据库中的数据\n*   **其他技术**——使用 C# 和 .NET\
  \ Framework 的某些额外方法，包括 Windows Communication Foundation (WCF) 和通用 Windows 应用程序\n\
  \n以下部分介绍了书中五个主要部分的章节。\n\n### C# 语言（第 1 章 至 第 13 章））\n\n第 1 章 向你介绍了 C# 以及它如何融入 .NET\
  \ 领域。你将学习在该环境中编程的基础知识，以及 Visual Studio 2017 (VS) 如何配合。\n\n\n\n\n\n第 2 章 将带你开始编写\
  \ C# 应用程序。你将学习 C# 的语法，并通过示例命令行应用程序和 Windows 应用程序来使用这种语言。这些示例展示了上手并运行程序是多么快速和简单，而且在此过程中，你将熟悉\
  \ Visual Studio 开发环境以及你在整书本书中将用到的基础窗口和工具。\n\n接下来，你将学习更多关于 C# 语言的基础知识。在第 3 章中，你将学习什么是变量以及如何操作它们。在第\
  \ 4 章中，你将通过流程控制（循环和分支）增强应用程序的结构，并在第 5 章中，你将看到一些更的变量类型，例如数组。在第 6 章中，你将开始以函数的形式封装代码，这使得执行重复操作变得简单得多，并让你的代码更具读性。\n\
  \n在第 7 章开始时，你已经掌握了 C# 语言的基础知识，并将专注于应用程序的调试。这涉及查看应用程序执行时输出的跟踪信息，以及如何使用 Visual Studio\
  \ 强大的调试环境来捕获错误并引导你找到解决方案。\n\n从第 8 章开始，你将学习面向对象编程（OOP），首先了解这一术语的含义，并回答那个永恒的问题：“什么是对象？”OOP\
  \ 初看起来看起来非常困难。第 8 章的整章内容都致力于揭开它的神秘面纱并解释它如此伟大，在章节末尾之前，你实际上不会处理太多的 C# 代码。\n\n在第 9\
  \ 章中一切都发生了变化，你把理论付诸实践，开始在你的 C# 应用程序中使用 OOP。这才是 C# 真正的威力所在。你将从学习如何定义类和接口开始，然后在第 10\
  \ 章中转向类成员（包括字段、属性和方法）。在该章末尾，你将开始组装一个纸牌游戏应用程序，该程序将跨多个章节开发，并将有助于说明 OOP。\n\n一旦你学会了\
  \ OOP 在 C# 中如何工作，第 11 章将转向常见的 OOP 场景，包括处理对象集合以及比较和转换对象。第 12 章探讨了 C# 中在 .NET 2.0\
  \ 中引入的一项非常有用的功能：泛型，它允许你创建非常灵活的类。接下来，第 13 章通过一些额外技术继续讨论 C# 语言和 OOP，特别是事件，这在例如 Windows\
  \ 编程中变得非常重要重要。第 13 章通过关注随语言版本 3.0、4、5 和 6 引入的 C# 语言特征总结了基础知识。\n\n### Windows 编程\
  \ (第 14 章 – 第 15 章)\n\n第 14 章首先向你介绍什么是 Windows 编程，并查看如何在 Visual Studio 中实现它。它关注\
  \ WPF，这种工具可以让你以图形化的方式构建桌面应用程序，并以最少的精力和时间组装高级应用程序。你将从 WPF 编程的基础开始，在本章以及第 15 章中完善你的知识，后者将阐述你如何在应用程序中使用\
  \ .NET Framework 提供的丰富控件。\n\n### 云端与跨平台编程 (第 16 章 – 第 19 章)\n\n第 16 章首先介绍什么是 Windows\
  \ 编程，并查看如何在 Visual Studio 中实现它。它关注 WPF，这种工具可以让你以图形化的方式构建桌面应用程序，并以最少的精力和时间组装高级应用程序。你将从\
  \ WPF 编程的基础开始，在本章以及第 15 章中完善你的知识，后者将阐述你如何在应用程序中使用 .NET Framework 提供的丰富控件。\n\n第 16\
  \ 章开始介绍什么是 Windows 编程，并查看如何在 Visual Studio 中实现它。它关注 WPF，这种工具可以让你以图形化的方式构建桌面应用程序，并以最少的精力和时间组装高级应用程序。你将从\
