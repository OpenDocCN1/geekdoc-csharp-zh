  \ the text.)\n\n**浮点数类型 (Floating-Point Types)**\n\n除了数值类型外，还有三种简单类型可用。这些类型：`float`、`double`\
  \ 和 `decimal`。它们显示在 表 3-2\n\n| TYPE | ALIAS FOR | ALLOWED VALUES |\n| --- | ---\
  \ | --- |\n| `char` | `System.Char` | 单个 Unicode 字符，存储为 0 到 65535 整数 |\n| `bool`\
  \ | `System.Boolean` | 布尔值，`true` 或 `false` |\n| `string` | `System.String` | 字符序列\
  \ |\n\n## 变量命名 (Variable Naming)\n\n如上一节所述，你不能随意选择任何字符序列作为变量名。这听起来可能没那么糟糕，然而，因为你仍然拥有一个非常灵活的命名系统。\n\
  \n基础变量命名规则如下：\n\n*   变量名的第一个字符必须是字母、下划线字符(`_`) 或 `@` 符号 (`@`)。\n*   后续字符可以是字母、下划线字符或数字。\n\
  \n例如，以下变量名是合规的：\n\n```\nmyBigVar\n\nVAR1\n\n_test \n```\n\n\n\n但是，这些并不是：\n\n```\n\
  \ 99BottlesOfBeer\n\nNamespace\n\nIt's-All-Over \n```\n\n### 字面量 (Literal Values)\n\
  \n之前的“尝试运行”了两个字面量的示例：一个整数（`17`）和一个字符串（`\"myInteger\\\" is\"`）。其他变量类型也有相关的字面量，如表\
  \ 3‐4 所示。其中许多涉及 `suffixes`（后缀），你通过在字面量的末尾添加一系列字符来指定所需的类型。某些字面量具有多种类型，这些由编译器在编译时根据其上下文确定（如表\
  \ 3‐4 所示）。\n\n| **类型(s)** | **类别** | **后缀** | **示例/允许值** |\n| --- | --- | --- |\
  \ --- |\n| `bool` | 布尔 | 无 | `True` 或 `false` |\n| `int` , `uint` , `long` , `ulong`\
  \ | 整数 | 无 | `100` |\n| `uint` , `ulong` | 整数 | `u` 或 `U` | `100U` |\n| `long` ,\
  \ `ulong` | 整数 | `l` 或 `L` | `100L` |\n| `ulong` | 整数 | `ul` , `uL` , `Ul` , `UL`\
  \ , `lu` , `lU` , `Lu` , 或 `LU` | `100UL` |\n| `float` | 实数 | `f` 或 `F` | `1.5F`\
  \ |\n| `double` | 实数 | 无, `d` , 或 `D` | `1.5` |\n| `decimal` | 实数 | `m` 或 `M` |\
  \ `1.5M` |\n| `char` | 字符 | 无 | `'a'` ， 或转义序列 |\n| `string` | 字符串 | 无 | `\"a…a\"\
  ` ， 可能包含转义序列 |\n\n**表 3‐4 :** 字面量\n\n#### 二进制字面量和数字分隔符\n\n无论编程语法变得多么复杂或精密，计算机只以两种状态运行：0\
  \ 和 1，也称为二进制（2 进制）。如果你愿意，可以将你的所有程序编写为 0 和 1 的序列，然后运行该程序。虽然这样做不可行也不建议，但通过这样做，你减轻了解释器将程序从例如\
  \ C#、十进制（10 进制）、八进制（8 进制）或十六进制（16 进制）转换的负担。这样做并没有太大收益或价值，因此要意识到今天使用二进制仅保留给需要它的非常特定的场景。例如，你可能需要以二进制、十六进制或\
  \ ASCII 格式向第三方代码包传递值。在大多数情况下，除非需要这些字面量，否则你应该使用像 C# 这样的编程语言编码。\n\n要深入理解何时、何、如何以及以及使用这些字面量，需要深的技术知识以及对半字节（nibbles）、位（bits）、字节（bytes）、字符（characters）、字（words）、二进制（bin）、十六进制（hex）、八进制（octal）等的历史理解。与其深入探讨关于“为什么”的历史问题和专业级关于“如何”的讨论，目前只需要知道，例如，你可以使用二进制字面量作为一种优雅的方式，将值存储用于模式匹配和比较的常量，以及用于实现位掩码。如后续代码行中的二进制与十六进制的示例所示，你可以看到二进制数从右向左旋转了一个位。十六进制值没有模式，这使得更难快速判断代码的意图可能。\n\
  \n```\n int[] binaryPhases = [ 0b00110001, 0b01100010, 0b11000100, 0b10001001 ];\n\
  \nint[] hexPhases    = [ 0x31, 0x62, 0xC4, 0x89 ]; \n```\n\n现在你有了一些背景，而不是太快太深地进入模式匹配和位掩码，本节的剩余部分将专门关注\
  \ C# 7 的二进制字面量和数字分隔符。在读完这本书并获得编码经验后，你可以自己阅读更多关于二进制模式匹配和位掩码的内容以增加你的知识。\n\n为了更好地理解\
  \ C# 7 的二进制字面量特性，参考以下代码：\n\n```\n int[] numbers = [ 1, 2, 4, 8, 16 ]; \n```\n\n\
  在 C# 7 中，添加到 `numbers` 数组中的值可以直接以二进制形式编写，如下所示。\n\n```\n int[] numbers = [ 0b0001,\
  \ 0b0010, 0b00100, 0b0001000, 0b00010000 ]; \n```\n\n就像前缀为 `0x` 的十六进制一样，编译器将识别任何以\
