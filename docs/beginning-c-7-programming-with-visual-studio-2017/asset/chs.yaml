  \     choice = Convert.ToInt32(input);\n         if ((choice >= 2) && (choice <=\
  \ 7))\n            inputOK = true;\n      }\n      catch\n      {\n         // Ignore\
  \ failed conversions, just continue prompting.\n      }\n   } while (inputOK ==\
  \ false);\n\n   // Initialize array of Player objects.\n   Player[] players = new\
  \ Player[choice];\n\n   // Get player names.\n   for (int p = 0; p < players.Length;\
  \ p++)\n   {\n      WriteLine($\"Player {p + 1}, enter your name:\");\n      string\
