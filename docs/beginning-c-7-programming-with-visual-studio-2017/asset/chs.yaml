  \ .NET Framework 的语言之间的互操作性。这被称为 `通用类型系统`（CTS）。\n\n除了提供此库外，.NET Framework 还包含了 .NET\
  \ `通用语言运行时`（CLR），它负责执行所有使用 .NET 库开发的应用程序。\n\n## .NET Standard 和 .NET Core\n\n当 .NET\
  \ Framework 最初创建时，尽管它被设计为在多个平台上运行，但当时还没有业界接受的开源分支概念。如今，通常在 GitHub 上，一个项目可以被分支并进行定制以运行在多个平台上。例如，.NET\
  \ Compact Framework 和 .NET Micro Framework 是 .NET Framework 的分支，就像 .NET Core，它被创建为跨平台代码开发的最优解决方案。这些\
  \ .NET Framework “变体”或“垂直领域”都有特定的需求和目标。\n\n*(由于提供的文本从此处开始出现大量重复段落，根据“不要重复输出原文”的指令，后续重复内容将不再列出。)*\n\
  \n\n\n从 .NET Framework 的角度来看，你并不一定想将运行应用程序所需的所有内容都放在一个地方。你可能会编写某些执行多个应用程序所需任务的代码。在这种情况下，将可重用的代码放置在所有应用程序都可以访问的地方通常很有用。在\
  \ .NET Framework 中，这就是 `global assembly cache`（全局程序集缓存 GAC）。将代码放入 GAC 非常简单——只需将包含代码的程序集放在包含此缓存的目录中。\n\
  \n### 托管代码\n在你将代码编译为 `CIL` 并且 JIT 编译器将其编译为原生代码后，`CLR/CoreCLR` 的作用并没有此结束。使用 .NET\
  \ Framework 和 .NET Core 编写的代码在执行时是 `managed`（托管的）（这一阶段通常被称为 `runtime`，运行时）。这意味着\
  \ `CLR/CoreCLR` 会通过管理内存、处理安全、允许跨语言调试等来维护你的应用程序。相比之下，不运行在 `CLR/CoreCLR` 控制下的应用程序被称为\
  \ `unmanaged`（非托管的），并且可以使用 `C++` 等某些语言来编写此类应用程序，例如，访问操作系统的底层函数。然而，在 `C#` 中，你只能编写运行在托管环境中代码。你将利用\
  \ `CLR/CoreCLR` 的托管功能，并允许 `.NET` 本身处理与操作系统的任何交互。\n\n### 垃圾回收\n托管代码最重要的特性之一是 `garbage\
  \ collection`（垃圾回收）概念。这是 .NET 确保在应用程序不再使用时完全释放其所用内存的方法。在 `.NET` 之前，这主要是程序员的责任，代码中的几个简单错误就可能导致大块内存由于被分配到内存中的错误位置而神秘地消失。这通常意味着你的计算机速度逐渐变慢，然后导致系统崩溃。\n\
  \n`.NET` 垃圾回收通过定期检查计算机的内存并移除其中不再需要的任何来工作。这没有固定的时间范围；它可能每秒发生数千次，每隔几秒一次，或者随时发生，但你可以放心它一定会发生。\n\
  \n这对程序员来说有一些影响。因为这项工作是在不可预测的时间为你完成的，所以在设计应用程序时必须考虑到这一点。运行需要大量内存的代码应该自己进行清理，而不是等待垃圾回收的发生，但这听起来并没有那么复杂。\n\
  \n### 整合\n在继续之前，让我们总结一下之前讨论过的创建 .NET 应用程序所需的步骤：\n\n1. 使用 .NET 兼容语言（如 `C#`）编写应用程序代码（参见图\
  \ 1-1）。\n\n2. 将该代码编译为 `CIL`，并存储在程序集中（参见图 1-2）。\n\n3. 当执行此代码时（如果是可执行文件则独立运行，或者当从其他代码调用它时），它必须首先使用\
  \ JIT 编译器将其编译为原生代码（参见图 1-3）。\n\n4. 原生代码在托管 `CLR/CoreCLR` 的上下文中执行，与其他任何正在运行的应用程序或进程一起，如图\
  \ 1-4 所示。\n\n![使用 .NET 兼容语言（如 C#）编写的应用程序代码的图示](img/Image00003.jpg)\n\n**图 1-1**\n\
  \n![编译为 CIL 的 C# 应用程序代码图示，存储在程序集中](img/Image00004.jpg)\n\n**图 1-2**\n\n![使用 JIT\
  \ 编译编译为原生代码的图示](img/Image00005.jpg)\n\n**图 1-3**\n\n![在托管 CLR/CoreCLR（通用语言运行时）上下文中执行的原生代码图示](img/Image00006.jpg)\n\
  \n**图 1-4**\n\n### 链接\n注意关于此过程的另一点。第 2 步中编译为 `CIL` 的 `C#` 代码不需要包含在单个文件中。可以将应用程序代码分散在多个源代码文件中，然后将它们编译成单个程序集。这一极其有用的过程被称为\
  \ `linking`（链接）。需要这样做是因为处理几个较小文件比处理一个巨大的文件容易得多。你可以将逻辑相关的代码分离到单独的文件中以便对其进行独立开发，并在完成后几乎可以忘记它。这也使得在需要时易于找到特定的代码段，并允许开发团队将编程负担划分为可管理的块，以便个人可以“签出”代码段进行工作，而不会冒着损坏其他满意的部分或其他人正在编写部分的风险。\n\
  \n## 什么是 C#？\n如前所述，`C#` 是你可以用来创建运行在 .NET 上的应用程序的语言之一。`C#` 是 .NET 开发中可用语言之一，但它无疑是最好的。它的优势在于是从一开始就为\
  \ .NET Framework 设计的唯一语言，也是移植到其他操作系统的 .NET 版本的主要语言。\n\n### 你可以用 C# 编写的应用程序\n\n\n\
  \n\n\n如前所述，.NET Framework 对可能实现的应用程序类型没有限制。C# 使用该框架，因此对可能的应用程序也没有任何限制。（然而，目前使用 .NET\
  \ Core 只能编写控制台应用程序和 ASP.NET 应用程序。）不过，这里是几种较为常见的应用程序类型：\n\n* `Desktop applications`（桌面应用程序）——如\
  \ Microsoft Office 等类的应用程序，它们具有熟悉的 Windows 外观和视觉体验。通过使用 .NET Framework 的 Windows\
  \ Presentation Foundation (`WPF`) 模块，这使得这一切变得简单。该模块是一个包含 `controls`（如按钮、工具栏、菜单等）的库，你可以使用它们来构建\
  \ Windows 用户界面 (UI)。\n* `Windows Store applications`（Windows 商店应用）——Windows 8 引入了一种新类型的应用程序，称为\
  \ Windows 商店应用。这种类型的应用程序主要为触摸设备设计，通常全屏运行，杂干扰极少，并强调简洁。你可以通过多种方式创建这些应用程序，包括 `WPF`。\n\
  * `Cloud/Web applications`（云/Web 应用）——.NET Framework 和 .NET Core 包含一个名为 `ASP.NET`\
  \ 的强大系统，用于动态生成 Web 内容，实现个性化、安全等许多功能。此外，这些应用程序可以在云端托管和访问，例如在 Microsoft Azure 平台上。\n\
  * `Web APIs`（Web API）——用于构建 RESTful HTTP 服务的理想框架，支持各种客户端，包括移动设备和浏览器。\n* `WCF services`（WCF\
  \ 服务）——一种创建多功能分布式应用程序的方法。使用 `WCF`，你可以在本地网络或 Internet 上交换几乎任何数据，无论用于创建服务或其所在的系统使用的是哪种语言，都使用相同的简单语法。\n\
  \n这些类型中的任何一种都可能需要某种形式的数据库访问，可以通过 .NET Framework 的 `ADO.NET`（活动数据对象 .NET）部分、通过 `Entity\
  \ Framework` 或通过 C# 的 `LINQ`（集成查询）能力来实现。对于需要数据库访问的 .NET Core 应用程序，你将使用 `Entity Framework\
  \ Core` 库。还可以利用许多其他资源，例如创建网络组件的工具、输出图形、执行复杂的数学任务的工具等。\n\n### 书中的 C#\n\n本书的第一部分涉及\
  \ `C#` 语言的语法和用法，不过并不强调 .NET Framework 或 .NET Core。这是必要的，因为在没有坚实的 `C#` 编程基础的情况下，你无法使用\
  \ .NET Framework 或 .NET Core。事实上，你将从更简单的内容开始，并在涵盖基础知识后再将复杂的 `OOP`（面向对象编程）话题留给你。这些内容是从原理开始教授的，假设没有任何编程知识。\n\
  \n之后，你就可以准备好开发更复杂（但更有用）的应用程序了。第二部分处理 Windows 编程，第三部分探索云和跨平台编程，第四部分检查数据访问（针对 ORM\
  \ 数据库概念、文件系统和 XML 数据）以及 `LINQ`。本书的第五部分将介绍 `WCF` 和 Windows 商店应用程序编程。\n\n## VISUAL\
  \ STUDIO 2017\n\n在书中，你使用 `Visual Studio 2017` 开发工具进行所有的 `C#` 编程，从简单的命令行应用程序到更复杂的项目类型。开发工具或集成开发环境\
  \ (IDE)，如 `Visual Studio`，对于开发 `C#` 应用程序并非必需的，但它能让事情变得简单得多。你可以（如果愿意）在基础文本编辑器（如无处不在的\
  \ `Notepad` 应用程序）中操作 `C#` 源代码文件，并使用 .NET Framework 和 .NET Core 部分的命令行编译器将代码编译成程序集。然而，既然有\
  \ IDE 的力量来帮助，何必这么做呢？\n\n### Visual Studio 2017 产品\n\n微软提供了多个版本的 `Visual Studio`，例如：\n\
  \n* `Visual Studio Code`\n* `Visual Studio Community`\n* `Visual Studio Professional`\n\
  * `Visual Studio Enterprise`\n\n`Visual Studio Code` 和 `Community` 可以在 `https://www.visualstudio.com/en-us/downloads/download-visual-studio-vs`\
  \ 免费获取。`Professional` 和 `Enterprise` 版本具有额外的功能，并且需要付费。\n\n各种 `Visual Studio` 产品允许你创建可能需要的几乎任何\
  \ `C#` 应用程序。`Visual Studio Code` 是一个简单但强大的代码编辑器，运行在 Windows、Linux 和 iOS 上。与 `Visual\
  \ Studio Code` 不同，`Visual Studio Community` 保留了与 `Professional` 和 `Enterprise` 相同的外观和体验。微软在\
  \ `Visual Studio Community` 中提供了许多与 `Professional` 和 `Enterprise` 版本相同的功能；但是，缺少了一些显著功能，例如深度调试能力和代码优化工具。不过，缺失的功能并没有多到让你无法使用\
  \ `Community` 来完成本书的章节。`Visual Studio Community 2017` 是用于完成书中示例的 IDE 版本。\n\n###\
  \ 解决方案 (Solutions)\n\n当你使用 `Visual Studio` 开发应用程序时，你是通过创建 `solutions`（解决方案）来实现的。在\
  \ `Visual Studio` 术语中，解决方案不仅仅是一个应用程序。解决方案包含 `projects`（项目），可能是 `WPF` 项目、`Cloud/Web\
  \ Application` 项目、`ASP.NET Core` 项目等。由于解决方案可以包含多个项目，你可以将相关的代码组合在一起，即使它们最终会编译到硬盘上不同位置的多个程序集。\n\
  \n这非常有用，因为你能够在使用该代码的应用程序的同时处理共享代码（可能放置在 `GAC` 中）。当只使用一个开发环境时，调试代码容易得多，因为你可以调试多个模块中的指令。\n\
