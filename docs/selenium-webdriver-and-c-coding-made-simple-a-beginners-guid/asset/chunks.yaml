    \n1.  **保持页面类短小**：每个页面类应只包含特定于该页面的方法和定位器。如果一个页面变得过大，请考虑将其拆分为更小的页面类。\n2.  **避免重复**：避免在多个页面类中重复定义定位器和方法。相反，可以创建一个包含共享定位器和方法的通用基页面类。\n\
