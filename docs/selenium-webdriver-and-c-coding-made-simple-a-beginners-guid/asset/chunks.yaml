    In this example, we have annotated the `testLogin` method with `@Parameters` and
    provided two parameters (`username` and `password`). TestNG will pass the values
    of these parameters when executing the test method.


    ### 7.4.3 TestNG Reports


    TestNG generates detailed HTML reports that provide insights into test execution,
    including the number of test cases passed, failed, and skipped, execution times,
    and stack traces for failed test cases. These reports are useful for analyzing
    test results and identifying issues quickly.


    The default TestNG report is generated in the `test-output` folder of the project
    directory. You can customize the report by adding listeners or using third-party
    reporting plugins.


    ## 7.5 TestNG Annotations and Execution Order


    TestNG provides a set of annotations that allow you to control the order of test
    method execution and set up pre- and post-conditions. Understanding the execution
    order is crucial for ensuring the tests are executed as expected.


    Here is the execution order of some commonly used TestNG annotations:


    1\. `@BeforeSuite`: This method runs before all tests in the test suite.


    2\. `@BeforeTest`: This method runs before all tests in a `<test>` tag in the
    test suite.


    3\. `@BeforeClass`: This method runs before the first test method in the test
    class.


    4\. `@BeforeMethod`: This method runs before each test method in the test class.


    5\. `@Test`: This annotation marks a method as a test case.


    6\. `@AfterMethod`: This method runs after each test method in the test class.


    7\. `@AfterClass`: This method runs after the last test method in the test class.


    8\. `@AfterTest`: This method runs after all tests in a `<test>` tag in the test
    suite.


    9\. `@AfterSuite`: This method runs after all tests in the test suite.


    ## 7.6 TestNG Assertions


    TestNG provides a wide range of assertion methods for validating the expected
    outcomes of test cases. These assertion methods are available in the `Assert`
    class, which is part of the TestNG framework.


    Example:


    ```java


    import org.testng.Assert;


    import org.testng.annotations.Test;


    public class TestNGExample {


    @Test


    public void testAddition() {


    int result = add(2, 3);


    Assert.assertEquals(result, 5, "Addition failed!");


    }


    public int add(int a, int b) {


    return a + b;


    }


    }


    ```


    In this example, we use the `assertEquals()` method from the `Assert` class to
    validate the result of the `add()` method. If the assertion fails, TestNG will
    mark the test case as failed and provide a descriptive message.


    ## 7.7 TestNG Data Providers


    TestNG allows you to use data providers to supply test data to test methods. A
    data provider is a method that returns a two-dimensional array of test data.


    Example:


    ```java


    import org.testng.annotations.DataProvider;


    import org.testng.annotations.Test;


    public class TestNGExample {


    @Test(dataProvider = "loginData")


    public void testLogin(String username, String password) {


    // Code to perform login test with the provided username and password


    }


    @DataProvider(name = "loginData")


    public Object[][] provideLoginData() {


    return new Object[][] {


    {"user1", "pass123"},


    {"user2", "pass456"},


    {"user3", "pass789"}


    };


    }


    }


    ```


    In this example, we use the `@DataProvider` annotation to define a data provider
    method `provideLoginData()` that returns a two-dimensional array of test data.
    The `testLogin()` method is then annotated with `@Test(dataProvider = "loginData")`,
    indicating that it will use the data provided by the `loginData` data provider.


    ## 7.8 Conclusion


    In this chapter, we explored testing with TestNG, a powerful testing framework
    for Java. TestNG provides a rich set of features that enhance test management
    and reporting capabilities, making it a popular choice for automated testing with
    Selenium WebDriver.


    We learned how to set up TestNG, create test cases, and organize them into test
    suites. We also looked at various TestNG features such as test groups, parameters,
    and data providers, which enable us to execute tests efficiently and handle different
    scenarios.


    With


    TestNG, testers can easily execute test cases, analyze test results, and generate
    detailed reports. This chapter provides a solid foundation for utilizing TestNG
    effectively in your Selenium WebDriver test automation projects.


    # # Chapter 8: Data-Driven Testing with Selenium WebDriver


    In Chapter 7, we explored testing with TestNG, which allowed us to organize and
    manage test cases effectively. In this chapter, we will delve into data-driven
    testing with Selenium WebDriver. Data-driven testing is a powerful technique that
    enables us to run the same test script with multiple sets of test data, allowing
    us to validate application behavior under various scenarios.


    ## 8.1 What is Data-Driven Testing?


    Data-driven testing is an approach in which test cases are designed to execute
    with different sets of input data. Instead of hardcoding test data within the
    test script, data-driven testing involves externalizing test data into separate
    data sources such as CSV files, Excel sheets, databases, or JSON files. The test
    script then retrieves this data during runtime and executes the same test steps
    with each dataset.


    Data-driven testing is beneficial for various reasons:


    1\. Reusability: Test scripts can be reused with different datasets, reducing
    the need for writing repetitive test code.


    2\. Scalability: Adding or modifying test data becomes easier, allowing the test
    suite to scale effortlessly.


    3\. Test Coverage: Data-driven testing increases test coverage by validating the
    application against various input scenarios.


    4\. Maintenance: Updating test data is separated from test script maintenance,
    making it easier to maintain and manage the test suite.


    ## 8.2 Implementing Data-Driven Testing with Selenium WebDriver


    To implement data-driven testing with Selenium WebDriver, we need to follow these
    steps:


    1\. Prepare the Test Data: Externalize the test data into a suitable data source
    such as a CSV file, Excel sheet, database, or JSON file.


    2\. Read Test Data: In the test script, read the test data from the chosen data
    source.


    3\. Iterate and Execute: Use loops or iterations to execute the test steps with
    each set of test data.


    4\. Report and Analyze: Collect the test results and generate a comprehensive
    test report.


