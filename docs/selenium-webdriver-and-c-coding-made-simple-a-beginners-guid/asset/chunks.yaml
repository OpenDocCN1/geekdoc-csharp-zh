    \ encapsulation. Encapsulation allows us to hide the internal details of a class\
    \ and provide controlled access to its members.\n\n# Chapter 9: Encapsulation:\
    \ Protecting Data and Behavior\n\nIn this chapter, we will explore the concept\
    \ of encapsulation in `C#`. Encapsulation is one of the fundamental principles\
    \ of object-oriented programming that allows us to bundle data and related behavior\
    \ into a single unit called a `class`. It provides a way to protect data from\
    \ direct external access and ensures controlled access through methods.\n\n##\
    \ 9.1 Introduction to Encapsulation\n\nEncapsulation is the process of hiding\
    \ the internal details of a class and providing controlled access to its members.\
    \ It allows us to create a boundary around the class, protecting its data and\
    \ behavior from unauthorized access and modifications.\n\nBy encapsulating data\
    \ and behavior together, we can create more robust and maintainable code. Encapsulation\
    \ promotes code reusability, modularity, and data integrity.\n\n## 9.2 Access\
    \ Modifiers\n\nAccess modifiers in `C#` control the visibility and accessibility\
    \ of types and members. They play a crucial role in encapsulation by defining\
    \ the level of access to the class members.\n\nThe four access modifiers in `C#`\
    \ are:\n\n- `public`: The member is accessible from any code.\n- `private`: The\
    \ member is only accessible within the containing class.\n- `protected`: The member\
    \ is accessible within the containing class and its derived classes.\n- `internal`:\
    \ The member is accessible within the same assembly (project).\n\nBy using access\
    \ modifiers effectively, we can enforce encapsulation and control the visibility\
    \ of class members.\n\n## 9.3 Properties\n\nProperties are a mechanism in `C#`\
    \ that provide controlled access to the encapsulated data of a class. They allow\
