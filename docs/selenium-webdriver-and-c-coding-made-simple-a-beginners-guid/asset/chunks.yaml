  raw: 'In this chapter, we explored the concept of variables and learned about the
    various data types available in C#. We discovered how to declare variables, assign
    values to them, and initialize them. Additionally, we covered variable naming
    rules, concatenation of variables and strings, working with constants, type conversion,
    and the type inference feature.


    Understanding variables and data types is fundamental in programming, as they
    allow us to store and manipulate data effectively. In the next chapter, we will
    explore control structures, which enable us to make decisions and control the
    flow of our programs.


    # Chapter 3: Control Structures: Making Decisions and Repeating Actions


    In this chapter, we will delve into control structures in C#. Control structures
    allow us to make decisions and repeat actions based on certain conditions. By
    utilizing control structures, we can control the flow of our programs and make
    them more dynamic and responsive.


    # 3.1 Conditional Statements: Making Decisions


    Conditional statements allow us to execute different blocks of code based on certain
    conditions. In C#, we have the following conditional statements:


    # 3.1.1 If Statement


    The `if` statement is used to execute a block of code if a specified condition
    is true. Here''s an example:


    ```csharp


    int age = 25;


    if (age >= 18)


    {


    Console.WriteLine("You are eligible to vote!");


    }


    ```


    In this example, the `if` statement checks if the `age` is greater than or equal
    to 18\. If the condition is true, the message "You are eligible to vote!" will
    be displayed.


    # 3.1.2 If-Else Statement


    The `if-else` statement allows us to execute different code blocks based on the
    condition. If the condition is true, the code within the `if` block is executed.
    Otherwise, the code within the `else` block is executed. Here''s an example:


    ```csharp


    int temperature = 25;


    if (temperature > 30)


    {


    Console.WriteLine("It''s hot outside!");


    }


    else


    {


    Console.WriteLine("It''s not too hot today.");


    }


    ```


    In this example, if the temperature is greater than 30, the message "It''s hot
    outside!" will be displayed. Otherwise, the message "It''s not too hot today."
    will be displayed.


    # 3.1.3 If-Else If Statement


    The `if-else if` statement allows us to check multiple conditions and execute
    different code blocks accordingly. Here''s an example:


    ```csharp


    int score = 85;


    if (score >= 90)


    {


    Console.WriteLine("Excellent!");


    }


    else if (score >= 80)


    {


    Console.WriteLine("Good job!");


    }


    else if (score >= 70)


    {


    Console.WriteLine("Keep it up!");


    }


    else


    {


    Console.WriteLine("You can do better!");


    }


    ```


    In this example, depending on the value of the `score` variable, a corresponding
    message will be displayed.


    # 3.2 Looping Structures: Repeating Actions


    Looping structures allow us to repeat a set of statements multiple times. In C#,
    we have the following looping structures:


    # 3.2.1 For Loop


    The `for` loop is used when we know the number of iterations in advance. It consists
    of three parts: initialization, condition, and iteration. Here''s an example:


    ```csharp


    for (int i = 1; i <= 5; i++)


    {


    Console.WriteLine("Iteration: " + i);


    }


    ```


    In this example, the loop will iterate five times, displaying the message "Iteration:
    1" to "Iteration: 5".


    # 3.2.2 While Loop


    The `while` loop is used when we want to repeat a block of code while a condition
    is true. Here''s an example:


    ```csharp


    int count = 0;


    while (count < 5)


    {


    Console.WriteLine("Count: " + count);


    count++;


    }


    ```


    In this example, the loop will iterate as long as the `count` variable is less
    than 5, displaying the current count value.


    # 3.2.3 Do-While Loop


    The `do-while` loop is similar to the `while` loop, but it executes the code block
    at least once before checking the condition. Here''s an example:


    ```csharp


    int count = 0;


    do


    {


    Console.WriteLine("Count: " + count);


    count++;


    } while (count < 5);


    ```


    In this example, the code block will be executed once, and then the condition
    `count < 5` will be checked. If the condition is true, the loop will continue
    to execute, displaying the current count value.


    # 3.3 Control Structures: Nesting and Flow Control


    Control structures can be nested within each other to create more complex logic.
    By combining conditional statements and looping structures, we can create powerful
    algorithms to solve a wide range of problems.


    Additionally, we can control the flow of our programs using control statements
    like `break` and `continue`. The `break` statement is used to exit a loop prematurely,
    while the `continue` statement is used to skip the current iteration and move
    to the next one.


    3.4 Summary


    In this chapter, we explored control structures in C#. We learned about conditional
    statements like `if`, `if-else`, and `if-else if`, which allow us to make decisions
    based on conditions. We also examined looping structures like `for`, `while`,
    and `do-while`, which enable us to repeat actions. We discovered how to nest control
    structures and control the flow of our programs using statements like `break`
    and `continue`.


    By using control structures effectively, we can write programs that can adapt
    to different situations and perform tasks more efficiently. In the next chapter,
    we will delve into arrays, which provide a way to store and manipulate collections
    of data.


    # Chapter 4: Arrays: Storing and Manipulating Collections of Data


    In this chapter, we will explore the concept of arrays in C#. Arrays allow us
    to store multiple values of the same type in a single variable. We will learn
    how to declare, initialize, access, and manipulate arrays to efficiently handle
    collections of data.


    # 4.1 Introduction to Arrays


    An array is a data structure that stores a fixed-size sequence of elements of
    the same type. Each element in an array is identified by an index, starting from
    0\. Arrays provide a convenient way to work with collections of data, such as
    a list of numbers, names, or any other type of information.


    # 4.2 Declaring and Initializing Arrays


    To declare an array in C#, we need to specify the type of elements it will hold,
    followed by the array name and square brackets. Here''s an example:


    ```csharp


    int[] numbers;


    ```


    In this example, we declared an array named `numbers` that will hold integers.
    However, at this point, the array is uninitialized and does not contain any elements.


    To initialize an array, we can use the `new` keyword followed by the type and
    the desired size of the array. Here''s an example:


    ```csharp


    int[] numbers = new int[5];


    ```


    In this case, we initialized the `numbers` array with a size of 5. The elements
    of the array are initially set to their default values (0 for integers).


    Alternatively, we can initialize an array with specific values at the time of
    declaration using an array initializer. Here''s an example:


    ```csharp


    int[] numbers = { 1, 2, 3, 4, 5 };


    ```


    In this example, we declared and initialized the `numbers` array with the values
    1, 2, 3, 4, and 5.


    # 4.3 Accessing Array Elements


    Array elements can be accessed using their indices. The index represents the position
    of an element within the array. The first element has an index of 0, the second
    element has an index of 1, and so on. Here''s an example:


    ```csharp


    int[] numbers = { 1, 2, 3, 4, 5 };


    Console.WriteLine(numbers[0]); // Output: 1


    Console.WriteLine(numbers[2]); // Output: 3


    ```


    In this example, we accessed the first element of the `numbers` array (index 0)
    and the third element (index 2) using square brackets notation.


    # 4.4 Modifying Array Elements


    Array elements can be modified by assigning a new value to a specific index. Here''s
    an example:


    ```csharp


    int[] numbers = { 1, 2, 3, 4, 5 };


    numbers[1] = 10;


    Console.WriteLine(numbers[1]); // Output: 10


    ```


    In this example, we modified the second element of the `numbers` array (index
    1) by assigning it the value 10.


