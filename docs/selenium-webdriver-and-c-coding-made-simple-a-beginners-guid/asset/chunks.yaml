    // Execute test steps with the current dataset


    executeTest(username, password);


    }


    // Close CSV parser and reader


    csvParser.close();


    reader.close();


    } catch (IOException e) {


    e.printStackTrace();


    }


    }


    public static void executeTest(String username, String password) {


    // Code to initialize WebDriver, navigate to the login page, and perform login
    test


    // Use ''username'' and ''password'' in your test steps


    // Close the WebDriver and perform cleanup after the test


    }


    }


    ```


    In this example, we use Apache Commons CSV to read data from the "testdata.csv"
    file. Each record in the CSV file represents a set of test data containing a username
    and password. We then iterate through each record and call the `executeTest()`
    method with the current dataset.


    ## 8.4 Data-Driven Testing with Excel Sheets


    Excel sheets are another popular option for data-driven testing with Selenium
    WebDriver. Apache POI is a commonly used library for working with Excel files
    in Java.


    ### 8.4.1 Example Excel Sheet


    Suppose we have an Excel sheet named "testdata.xlsx" with the following content:


    | username | password |


    |----------|----------|


    | user1    | pass123  |


    | user2    | pass456  |


    | user3    | pass789  |


    ### 8.4.2 Reading Excel Data


    Let''s use Apache POI to read data from the Excel sheet in our Selenium WebDriver
    test script.


    Example:


    ```java


    import org.apache.poi.ss.usermodel.*;


    import java.io.File;


    import java.io.FileInputStream;


    import java.io.IOException;


    public class DataDrivenTest {


    public static void main(String[] args) {


    try {


    // Load Excel file


    FileInputStream fis = new FileInputStream(new File("testdata.xlsx"));


    Workbook workbook = WorkbookFactory.create(fis);


    Sheet sheet = workbook.getSheetAt(0);


    // Iterate through each row in the Excel sheet (excluding header row)


    for (int rowNum = 1; rowNum <= sheet.getLastRowNum(); rowNum++) {


    Row row = sheet.getRow(rowNum);


    String username = row.getCell(0).getStringCellValue();


    String password = row.getCell(1).getStringCellValue();


    // Execute test steps with the current dataset


    executeTest(username, password);


    }


    // Close workbook and file input stream


    workbook.close();


    fis.close();


    } catch (IOException e) {


    e.printStackTrace();


    }


    }


    public static void executeTest(String username, String password) {


    // Code to initialize WebDriver, navigate to the login page, and perform login
    test


    // Use ''username'' and ''password'' in your test steps


    // Close the WebDriver and perform cleanup after the test


    }


    }


    ```


    In this example, we use Apache POI to read data from the "testdata.xlsx" Excel
    sheet. We iterate through each row in the sheet, excluding the header row, and
    call the `executeTest()` method with the current dataset.


    ## 8.5 Data-Driven Testing with Databases


    In real-world scenarios, test data is often stored in databases. Selenium WebDriver
    can interact with databases using JDBC (Java Database Connectivity) to perform
    data-driven testing.


    To read data from a database, we need to establish a connection, execute SQL queries,
    and retrieve the results.


    Example:


    ```java


    import java.sql.*;


    public class DataDrivenTest {


    public static void main(String[] args) {


    try {


    // Establish database connection


    Connection conn = DriverManager.getConnection("jdbc:mysql://localhost:3306/testdb",
    "username", "password");


    Statement stmt = conn.createStatement();


    // Execute SQL query and retrieve data


    ResultSet resultSet = stmt.executeQuery("SELECT * FROM users");


    // Iterate through the result set


    while (resultSet.next()) {


    String username = resultSet.getString("username");


    String password = resultSet.getString("password");


    // Execute test steps with the current dataset


    executeTest(username, password);


    }


    // Close database connection and result set


    resultSet.close


    ();


    stmt.close();


    conn.close();


    } catch (SQLException e) {


    e.printStackTrace();


    }


    }


    public static void executeTest(String username, String password) {


    // Code to initialize WebDriver, navigate to the login page, and perform login
    test


    // Use ''username'' and ''password'' in your test steps


    // Close the WebDriver and perform cleanup after the test


    }


    }


    ```


    In this example, we use JDBC to connect to the database, execute the SQL query
    to retrieve the test data from the "users" table, and call the `executeTest()`
    method with each dataset.


    ## 8.6 Data-Driven Testing with JSON Files


    JSON (JavaScript Object Notation) files are a lightweight and human-readable data
    interchange format. They are widely used for configuration files and data storage.
    To perform data-driven testing with Selenium WebDriver using JSON files, we can
    use libraries such as Jackson or Gson.


    ### 8.6.1 Example JSON File


    Suppose we have a JSON file named "testdata.json" with the following content:


    ```json


    [


    {


    "username": "user1",


    "password": "pass123"


    },


    {


    "username": "user2",


    "password": "pass456"


    },


    {


    "username": "user3",


    "password": "pass789"


    }


    ]


    ```


    ### 8.6.2 Reading JSON Data


    Let''s use Jackson to read data from the JSON file in our Selenium WebDriver test
    script.


    Example:


    ```java


    import com.fasterxml.jackson.databind.JsonNode;


    import com.fasterxml.jackson.databind.ObjectMapper;


    import java.io.File;


    import java.io.IOException;


    public class DataDrivenTest {


    public static void main(String[] args) {


    try {


    // Load JSON file


    File jsonFile = new File("testdata.json");


    ObjectMapper objectMapper = new ObjectMapper();


    JsonNode jsonData = objectMapper.readTree(jsonFile);


    // Iterate through each JSON object


    for (JsonNode jsonNode : jsonData) {


    String username = jsonNode.get("username").asText();


    String password = jsonNode.get("password").asText();


    // Execute test steps with the current dataset


    executeTest(username, password);


    }


    } catch (IOException e) {


    e.printStackTrace();


    }


    }


    public static void executeTest(String username, String password) {


    // Code to initialize WebDriver, navigate to the login page, and perform login
    test


    // Use ''username'' and ''password'' in your test steps


    // Close the WebDriver and perform cleanup after the test


    }


    }


    ```


    In this example, we use Jackson to read data from the "testdata.json" file. We
    iterate through each JSON object and call the `executeTest()` method with the
    current dataset.


    ## 8.7 Conclusion


    Data-driven testing is a powerful technique that allows us to execute the same
    test script with multiple sets of test data. By externalizing test data into separate
    data sources such as CSV files, Excel sheets, databases, or JSON files, we can
    increase test coverage, reusability, and scalability of our test suites.'
