    ## 11.2 Performing Mouse Actions


    ### 11.2.1 Mouse Hover


    Mouse hover is a common interaction in web applications, where moving the mouse
    over an element triggers additional information or actions. The `moveToElement()`
    method of the Actions class is used to perform a mouse hover.


    Example:


    ```java


    import org.openqa.selenium.By;


    import org.openqa.selenium.WebDriver;


    import org.openqa.selenium.WebElement;


    import org.openqa.selenium.chrome.ChromeDriver;


    import org.openqa.selenium.interactions.Actions;


    public class MouseHoverExample {


    public static void main(String[] args) {


    // Set the path to ChromeDriver executable


    System.setProperty("webdriver.chrome.driver", "path/to/chromedriver");


    // Create ChromeDriver instance


    WebDriver driver = new ChromeDriver();


    // Navigate to the website


    driver.get("https://www.example.com");


    // Find the element to hover over


    WebElement elementToHover = driver.findElement(By.id("hoverElement"));


    // Create Actions class instance


    Actions actions = new Actions(driver);


    // Perform mouse hover


    actions.moveToElement(elementToHover).perform();


    // Close the browser


    driver.quit();


    }


    }


    ```


    In this example, we move the mouse pointer to the element with the ID "hoverElement"
    using the `moveToElement()` method of the Actions class.


    ### 11.2.2 Drag-and-Drop


    Drag-and-drop is another common interaction in web applications, allowing users
    to move elements from one location to another. The Actions class provides the
    `dragAndDrop()` method to perform drag-and-drop operations.


    Example:


    ```java


    import org.openqa.selenium.By;


    import org.openqa.selenium.WebDriver;


    import org.openqa.selenium.WebElement;


    import org.openqa.selenium.chrome.ChromeDriver;


    import org.openqa.selenium.interactions.Actions;


    public class DragAndDropExample {


    public static void main(String[] args) {


    // Set the path to ChromeDriver executable


    System.setProperty("webdriver.chrome.driver", "path/to/chromedriver");


    // Create ChromeDriver instance


    WebDriver driver = new ChromeDriver();


    // Navigate to the website


    driver.get("https://www.example.com");


    // Find the source element to drag


    WebElement sourceElement = driver.findElement(By.id("sourceElement"));


    // Find the target element to drop


    WebElement targetElement = driver.findElement(By.id("targetElement"));


    // Create Actions class instance


    Actions actions = new Actions(driver);


    // Perform drag-and-drop


    actions.dragAndDrop(sourceElement, targetElement).perform();


    // Close the browser


    driver.quit();


    }


    }


    ```


    In this example, we drag the "sourceElement" and drop it onto the "targetElement"
    using the `dragAndDrop()` method of the Actions class.


    ### 11.2.3 Mouse Right-Click


    The Actions class also allows us to perform right-click (context-click) operations
    using the `contextClick()` method.


