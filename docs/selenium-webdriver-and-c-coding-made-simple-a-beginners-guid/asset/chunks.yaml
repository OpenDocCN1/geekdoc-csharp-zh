    \ We switch the WebDriver's focus to the prompt pop-up, retrieve the prompt message\
    \ using `getText()`, use `sendKeys()` to send input to the pop-up, and then use\
    \ `accept()` to accept the prompt or `dismiss()` to cancel it.\n\n### 10.3 Conclusion\n\
    \nHandling browser cookies and pop-ups is crucial for maintaining user sessions,\
    \ personalization, and interacting with various website elements during test execution.\
    \ Selenium WebDriver provides robust capabilities to manage cookies and interact\
    \ with different types of pop-ups, making it a powerful tool for automated testing.\n\
    \nIn this chapter, we learned how to retrieve, add, and delete cookies in the\
    \ browser session. We also explored how to handle different types of pop-ups,\
    \ including alerts, confirmations, and prompts.\n\n# Chapter 11: Advanced Interactions\
    \ with Actions Class\n\nIn Chapter 10, we explored handling browser cookies and\
    \ pop-ups in Selenium WebDriver, essential for maintaining user sessions and interacting\
    \ with various website elements. In this chapter, we will dive into advanced interactions\
    \ using the `Actions` class in Selenium WebDriver. The `Actions` class enables\
    \ us to perform complex user interactions like drag-and-drop, hover, double-click,\
    \ and more, which are not possible with simple WebDriver commands.\n\n## 11.1\
    \ Introduction to the Actions Class\n\nThe `Actions` class in Selenium WebDriver\
    \ is a specialized class that allows us to perform advanced user interactions\
    \ on web elements. It provides a set of methods to simulate keyboard and mouse\
    \ actions that go beyond basic clicks and typing. The `Actions` class is especially\
    \ useful when dealing with web applications that have complex user interfaces\
    \ and require intricate interactions.\n\nTo use the `Actions` class, we need to\
    \ import it from the `org.openqa.selenium.interactions` package.\n\n```java\n\
    import org.openqa.selenium.interactions.Actions;\n```\n\n## 11.2 Performing Mouse\
    \ Actions\n\n### 11.2.1 Mouse Hover\n\nMouse hover is a common interaction in\
    \ web applications, where moving the mouse over an element triggers additional\
    \ information or actions. The `moveToElement()` method of the `Actions` class\
    \ is used to perform a mouse hover.\n\nExample:\n\n```java\nimport org.openqa.selenium.By;\n\
    import org.openqa.selenium.WebDriver;\nimport org.openqa.selenium.WebElement;\n\
    import org.openqa.selenium.chrome.ChromeDriver;\nimport org.openqa.selenium.interactions.Actions;\n\
    \npublic class MouseHoverExample {\n    public static void main(String[] args)\
    \ {\n        // Set the path to ChromeDriver executable\n        System.setProperty(\"\
    webdriver.chrome.driver\", \"path/to/chromedriver\");\n        // Create ChromeDriver\
    \ instance\n        WebDriver driver = new ChromeDriver();\n        // Navigate\
    \ to the website\n        driver.get(\"https://www.example.com\");\n        //\
    \ Find the element to hover over\n        WebElement elementToHover = driver.findElement(By.id(\"\
    hoverElement\"));\n        // Create Actions instance\n        Actions actions\
    \ = new Actions(driver);\n        // Perform mouse hover\n        actions.moveToElement(elementToHover).perform();\n\
    \        // Close the browser\n        driver.quit();\n    }\n}\n```\n\nIn this\
    \ example, we move the mouse pointer to the element with the ID `hoverElement`\
    \ using the `moveToElement()` method.\n\n### 11.2.2 Drag-and-Drop\n\nDrag-and-drop\
    \ is another common interaction in web applications, allowing users to move elements\
    \ from one location to another. The `Actions` class provides the `dragAndDrop()`\
    \ method to perform drag-and-drop operations.\n\nExample:\n\n```java\nimport org.openqa.selenium.By;\n\
    import org.openqa.selenium.WebDriver;\nimport org.openqa.selenium.WebElement;\n\
    import org.openqa.selenium.chrome.ChromeDriver;\nimport org.openqa.selenium.interactions.Actions;\n\
    \npublic class DragAndDropExample {\n    public static void main(String[] args)\
    \ {\n        // Set the path to ChromeDriver executable\n        System.setProperty(\"\
    webdriver.chrome.driver\", \"path/to/chromedriver\");\n        // Create ChromeDriver\
    \ instance\n        WebDriver driver = new ChromeDriver();\n        // Navigate\
    \ to the website\n        driver.get(\"https://www.example.com\");\n        //\
    \ Find the source element to drag\n        WebElement sourceElement = driver.findElement(By.id(\"\
    sourceElement\"));\n        // Find the target element to drop\n        WebElement\
    \ targetElement = driver.findElement(By.id(\"targetElement\"));\n        // Create\
    \ Actions instance\n        Actions actions = new Actions(driver);\n        //\
    \ Perform drag-and-drop\n        actions.dragAndDrop(sourceElement, targetElement).perform();\n\
    \        // Close the browser\n        driver.quit();\n    }\n}\n```\n\nIn this\
    \ example, we drag the `sourceElement` and drop it onto the `targetElement` using\
    \ the `dragAndDrop()` method of the `Actions` class.\n\n### 11.2.3 Mouse Right-Click\n\
    \nThe `Actions` class also allows us to perform right-click (context-click) operations\
    \ using the `contextClick()` method.\n"
