- fmt: '

    In Chapter 4, we explored waits and synchronization techniques to handle dynamic
    elements effectively. In this chapter, we will focus on working with windows,
    tabs, and alerts in Selenium WebDriver. Web applications often involve multiple
    windows or tabs, as well as occasional alerts, which require special handling
    to interact with them during automation testing.


    ## 5.1 Working with Windows and Tabs


    When a web application opens a new window or tab, Selenium WebDriver needs to
    switch the focus to that window or tab to interact with its elements. WebDriver
    provides methods to manage multiple windows and tabs efficiently.


    ### 5.1.1 Handling New Windows


    To handle a new window that opens in a web application, we use the `window_handles`
    attribute to switch the focus to the new window.


    Example:


    ```python

    from selenium import webdriver


    driver = webdriver.Chrome()


    driver.get("https://www.example.com")


    # Click a link that opens a new window


    new_window_link = driver.find_element_by_link_text("Open New Window")


    new_window_link.click()


    # Get the window handles after the new window opens


    window_handles = driver.window_handles


    # Switch to the new window


    driver.switch_to.window(window_handles[1])

    ```


    In this example, after clicking the "Open New Window" link, the script gets the
    window handles of both the original window and the new window. The script then
    switches the focus to the new window using `driver.switch_to.window()`.


    ### 5.1.2 Handling New Tabs


    Handling new tabs is similar to handling new windows. We use the same methods
    to switch the focus to the new tab.


    Example:


    ```python

    from selenium import webdriver


    driver = webdriver.Chrome()


    driver.get("https://www.example.com")


    # Open a new tab using JavaScript


    driver.execute_script("window.open(''https://www.example.com/newtab'', ''_blank'');")


    # Get the window handles after the new tab opens


    window_handles = driver.window_handles


    # Switch to the new tab


    driver.switch_to.window(window_handles[1])

    ```


    In this example, we use `driver.execute_script()` to open a new tab using JavaScript.
    The script then gets the window handles of both the original tab and the new tab,
    and finally, switches the focus to the new tab using `driver.switch_to.window()`.


    ### 5.1.3 Switching Back to the Original Window or Tab


    After interacting with elements in a new window or tab, we often need to switch
    back to the original window or tab to continue with the script execution.


    Example:


    ```python

    from selenium import webdriver


    driver = webdriver.Chrome()


    driver.get("https://www.example.com")


    # Click a link that opens a new window


    new_window_link = driver.find_element_by_link_text("Open New Window")


    new_window_link.click()


    # Get the window handles after the new window opens


    window_handles = driver.window_handles


    # Switch to the new window


    driver.switch_to.window(window_handles[1])


    # Perform actions in the new window


    # Switch back to the original window


    driver.switch_to.window(window_handles[0])

    ```


    In this example, the script performs actions in the new window and then switches
    back to the original window using `driver.switch_to.window()`.


    ## 5.2 Working with Alerts


    Alerts, also known as dialog boxes or pop-ups, are frequently used in web applications
    to display messages or prompt the user for input. Selenium WebDriver provides
    methods to handle these alerts during automation testing.


    ### 5.2.1 Accepting and Dismissing Alerts


    To interact with alerts, we use the `switch_to.alert` method to switch the focus
    to the alert and then use the `accept()` method to accept the alert or the `dismiss()`
    method to dismiss it.


    Example:


    ```python

    from selenium import webdriver


    driver = webdriver.Chrome()


    driver.get("https://www.example.com")


    # Click a button that triggers an alert


    trigger_alert_button = driver.find_element_by_id("trigger-alert-button")


    trigger_alert_button.click()


    # Switch to the alert and accept it


    alert = driver.switch_to.alert


    alert.accept()

    ```


    In this example, after clicking the "trigger-alert-button," the script switches
    the focus to the alert using `driver.switch_to.alert` and then accepts the alert
    using `alert.accept()`.


    ### 5.2.2 Entering Text in Prompts


    Prompts are a type of alert that allows users to enter text. To handle prompts,
    we use the `send_keys()` method after switching the focus to the alert.


    Example:


    ```python

    from selenium import webdriver


    driver = webdriver.Chrome()


    driver.get("https://www.example.com")


    # Click a button that triggers a prompt


    trigger_prompt_button = driver.find_element_by_id("trigger-prompt-button")


    trigger_prompt_button.click()


    # Switch to the prompt and enter text


    alert = driver.switch_to.alert


    alert.send_keys("Hello, Selenium!")


    alert.accept()

    ```


    In this example, after clicking the "trigger-prompt-button," the script switches
    the focus to the prompt using `driver.switch_to.alert`, enters text using `alert.send_keys()`,
    and then accepts the prompt using `alert.accept()`.


    ## 5.3 Conclusion


    In this chapter, we learned how to work with windows, tabs, and alerts in Selenium
    WebDriver. Managing multiple windows and tabs is crucial for web applications
    that open new windows or tabs during user interactions. Selenium WebDriver provides
    methods to handle these situations efficiently, enabling testers to interact with
    elements in different windows or tabs seamlessly.


    Handling alerts is essential for scenarios where web applications display messages
    or prompt users for input. Selenium WebDriver provides methods to accept or dismiss
    alerts and enter text in prompts, ensuring that automation scripts can handle
    these dialog boxes effectively.


    By mastering window, tab, and alert handling in Selenium WebDriver, testers can
    create comprehensive and robust automation scripts that accurately simulate real
    user interactions in web applications.


    # Chapter 6: Working with Frames and iframes


    In Chapter 5, we learned how to handle windows, tabs, and alerts in Selenium WebDriver.
    In this chapter, we will explore working with frames and iframes, which are commonly
    used in web applications to divide a web page into multiple sections or embed
    external content. Properly handling frames and iframes is essential to interact
    with elements within them during automation testing.


    ## 6.1 Understanding Frames and iframes


    Frames and iframes are HTML elements that allow web developers to create multiple
    sections within a single web page. Frames are primarily used for dividing a page
    into separate sections, each containing its own HTML. On the other hand, iframes
    are used to embed external content or web pages within the main web page.


    When a web page contains frames or iframes, the content within them is treated
    as separate documents by the browser. Selenium WebDriver needs to switch the focus
    to the desired frame or iframe to interact with the elements.


    ## 6.2 Handling Frames in Selenium WebDriver


    To interact with elements within a frame, we need to switch the WebDriver''s focus
    to that frame. Selenium WebDriver provides the `switch_to.frame()` method to achieve
    this.


    ### 6.2.1 Handling Frames by Index


    Frames on a web page are indexed starting from 0, and we can switch to a frame
    by specifying its index.


    Example:


    Suppose we have a web page with two frames:


    ```html

    <iframe src="frame1.html"></iframe>

    <iframe src="frame2.html"></iframe>

    ```


    To switch to the second frame, we can use the following Selenium WebDriver code:


    ```python

    from selenium import webdriver


    driver = webdriver.Chrome()


    driver.get("https://www.example.com")


    # Switch to the second frame (index 1)


    driver.switch_to.frame(1)

    ```


    ### 6.2.2 Handling Frames by Name or ID


    Frames can have a `name` or `id` attribute, allowing us to switch to them using
    their names or IDs.


    Example:


    Suppose we have a web page with a frame with the name "myframe":


    ```html

    <iframe src="frame.html" name="myframe"></iframe>

    ```

