    We can switch to iframes by specifying their index, name, or ID, just like frames.


    Example:


    Suppose we have a web page with an iframe with the name "myiframe":


    ```html


    <iframe src="iframe.html" name="myiframe"></iframe>


    ```


    To switch to the iframe with the name "myiframe," we can use the following Selenium
    WebDriver code:


    ```python


    from selenium import webdriver


    driver = webdriver.Chrome()


    driver.get("https://www.example.com")


    # Switch to the iframe by its name


    driver.switch_to.frame("myiframe")


    ```


    ### 6.3.2 Switching Back to the Default Content


    As with frames, after interacting with elements inside an iframe, we need to switch
    the focus back to the default content of the main web page.


    Example:


    ```python


    from selenium import webdriver


    driver = webdriver.Chrome()


    driver.get("https://www.example.com")


    # Switch to the iframe


    driver.switch_to.frame("myiframe")


    # Perform actions in the iframe


    # Switch back to the default content


    driver.switch_to.default_content()


    ```


    ## 6.4 Conclusion


    In this chapter, we explored how to work with frames and iframes in Selenium WebDriver.
    Frames and iframes are commonly used in web applications to divide a page into
    multiple sections or embed external content. To interact with elements within
    frames and iframes, Selenium WebDriver provides the `switch_to.frame()` method.


    Handling frames and iframes is essential for creating comprehensive and robust
    automation scripts that can accurately interact with elements within different
    sections of a web page.


    # # Chapter 7: Testing with TestNG


    In Chapter 6, we explored how to work with frames and iframes in Selenium WebDriver.
    In this chapter, we will delve into testing with TestNG, a powerful testing framework
    for Java that enhances test management and reporting capabilities. TestNG provides
    a rich set of features for organizing, configuring, and executing test cases,
    making it a popular choice for automated testing with Selenium WebDriver.


    ## 7.1 Introduction to TestNG


    TestNG is inspired by JUnit and NUnit but introduces several new features to improve
    test flexibility and organization. It is designed to handle all types of testing,
    including unit, integration, and end-to-end testing. With TestNG, you can write
    and manage test cases effectively, group them logically, and generate detailed
    test reports.


    TestNG is widely used in the Java ecosystem and is well-integrated with various
    build tools and Continuous Integration (CI) systems like Maven, Gradle, and Jenkins.


    ## 7.2 Setting Up TestNG


    Before we can use TestNG in our Selenium WebDriver project, we need to set it
    up by adding the TestNG library to our project''s build path.


    ### 7.2.1 Using Maven


    If you''re using Maven as your build tool, you can add the TestNG dependency to
    your `pom.xml` file:


    ```xml


    <dependencies>


    <!-- Other dependencies -->


    <dependency>


    <groupId>org.testng</groupId>


    <artifactId>testng</artifactId>


    <version>7.0.0</version> <!-- Replace with the latest version -->


    </dependency>


    </dependencies>


    ```


    ### 7.2.2 Using Gradle


    If you''re using Gradle, you can add the TestNG dependency to your `build.gradle`
    file:


    ```groovy


    dependencies {


    // Other dependencies


    testImplementation ''org.testng:testng:7.0.0'' // Replace with the latest version


    }


    ```


    Once you''ve set up TestNG, you''re ready to create and execute test cases using
    this powerful framework.


    ## 7.3 Creating TestNG Test Cases


    TestNG organizes test cases into classes and methods, making it easy to group
    and manage test scenarios. To create a TestNG test case, follow these steps:


    ### 7.3.1 Annotate Test Methods


    In TestNG, you annotate test methods using specific annotations to define their
    behavior. The most commonly used annotations are:


    - `@Test`: Marks a method as a test case.


    - `@BeforeMethod`: Marks a method to run before each test method.


    - `@AfterMethod`: Marks a method to run after each test method.


    - `@BeforeClass`: Marks a method to run before the first test method in the class.


    - `@AfterClass`: Marks a method to run after the last test method in the class.


    - `@BeforeSuite`: Marks a method to run before all test methods in the suite.


    - `@AfterSuite`: Marks a method to run after all test methods in the suite.


    Example:


    ```java


    import org.testng.annotations.Test;


    public class TestNGExample {


    @BeforeMethod


    public void setUp() {


    // Code to set up WebDriver and navigate to the web application


    }


    @Test


    public void testLogin() {


    // Code to perform login test


    }


    @Test


    public void testRegistration() {


    // Code to perform registration test


    }


    @AfterMethod


    public void tearDown() {


    // Code to close the WebDriver and perform cleanup


    }


    }


    ```


    In this example, we have a TestNG test class with two test methods (`testLogin`,
    `testRegistration`) and two methods marked with `@BeforeMethod` and `@AfterMethod`,
    which will be executed before and after each test method, respectively.


    ### 7.3.2 Test Suites


    TestNG allows you to group related test classes into test suites. Test suites
    are XML files that define which test classes to include in the test run. This
    feature enables you to execute multiple test classes in a specific order or parallel.


    Example `testng.xml`:


    ```xml


    <!DOCTYPE suite SYSTEM "http://testng.org/testng-1.0.dtd">


    <suite name="Test Suite">


    <test name="Login Test">


    <classes>


    <class name="com.example.TestNGExample"/>


    <class name="com.example.LoginTest"/>


    </classes>


    </test>


    </suite>


    ```


    In this example, we define a test suite named "Test Suite" with a test named "Login
    Test" that includes two test classes (`TestNGExample` and `LoginTest`). TestNG
    will execute the test methods from these classes based on the configuration in
    the test suite.


    ### 7.3.3 Running TestNG Tests


    To run TestNG tests, you can use various methods:


    #### Using TestNG XML Suite


    You can run TestNG tests using the XML suite file we created earlier:


    ```java


    import org.testng.TestNG;


    public class TestNGRunner {


    public static void main(String[] args) {


    TestNG testng


    = new TestNG();


    testng.setTestSuites(Arrays.asList("testng.xml"));


    testng.run();


    }


    }


    ```


    #### Using Maven


    If you''re using Maven, you can run TestNG tests with the following command:


    ```


    mvn test


    ```'
