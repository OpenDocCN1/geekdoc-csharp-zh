    In C#, we can access the length of an array using the `Length` property. Here''s
    an example:


    ```csharp


    int[] numbers = { 1, 2, 3, 4, 5 };


    Console.WriteLine(numbers.Length); // Output: 5


    ```


    In this example, we retrieved the length of the `numbers` array, which is 5.


    It''s important to note that array indices range from 0 to length-1. Accessing
    an element outside this range will result in an `IndexOutOfRangeException` at
    runtime.


    # 4.6 Iterating over Arrays


    To process each element in an array, we can use loops, such as the `for` loop
    or the `foreach` loop.


    # 4.6.1 For Loop


    The `for` loop is commonly used to iterate over arrays. We can use the array''s
    length property to determine the number of iterations. Here''s an example:


    ```csharp


    int[] numbers = { 1, 2, 3, 4, 5 };


    for (int i = 0; i < numbers.Length; i++)


    {


    Console.WriteLine(numbers[i]);


    }


    ```


    In this example, we used a `for` loop to iterate over each element in the `numbers`
    array. The loop variable `i` represents the index of the current element.


    # 4.6.2 Foreach Loop


    The `foreach` loop simplifies the process of iterating over arrays by automatically
    handling the indexing. Here''s an example:


    ```csharp


    int[] numbers = { 1, 2, 3, 4, 5 };


    foreach (int number in numbers)


    {


    Console.WriteLine(number);


    }


    ```


    In this example, the `foreach` loop iterates over each element in the `numbers`
    array and assigns it to the `number` variable. We can directly access and process
    each element without explicitly using indices.


    # 4.7 Multidimensional Arrays


    C# also supports multidimensional arrays, which are arrays with multiple dimensions
    or axes. The most common type is a two-dimensional array, often represented as
    a matrix or grid. Here''s an example:


    ```csharp


    int[,] matrix = new int[3, 3]


    {


    { 1, 2, 3 },


    { 4, 5, 6 },


    { 7, 8, 9 }


    };


    ```


    In this example, we declared and initialized a two-dimensional array named `matrix`.
    It contains 3 rows and 3 columns.


    To access elements in a multidimensional array, we need to specify the indices
    for each dimension. Here''s an example:


    ```csharp


    int[,] matrix = new int[3, 3]


    {


    { 1, 2, 3 },


    { 4, 5, 6 },


    { 7, 8, 9 }


    };


    Console.WriteLine(matrix[1, 2]); // Output: 6


    ```


    In this example, we accessed the element at the second row (index 1) and the third
    column (index 2) of the `matrix` array.


    4.8 Summary


    In this chapter, we explored arrays in C#. We learned how to declare, initialize,
    access, and modify array elements. We also discussed the concepts of array length
    and bounds, as well as iterating over arrays using `for` and `foreach` loops.
    Additionally, we briefly introduced multidimensional arrays.


    Arrays provide a powerful way to store and manipulate collections of data. They
    are widely used in various programming scenarios. In the next chapter, we will
