  trans: "\n\n在本章中，我们探索了 C# 中的方法。我们学习了如何声明方法、指定返回类型、传递参数以及利用返回值。我们看到了 `void` 方法如何执行操作、带参数的方法如何接受输入，以及带返回值的方法如何产生结果。我们还讨论了方法重载，它允许我们拥有多个同名但参数列表不同的方法。\n\
    \n方法是组织和封装代码的强大工具，促进了代码的可重用性和模块化。通过有效利用方法，我们可以创建更具维护性和更高效的程序。在下一章中，我们将深入研究面向对象编程的概念，包括类和对象，它们是\
    \ C# 编程的基础。\n\n# 第 6 章：面向对象编程：类与对象\n\n在本节章中，我们将探索 C# 中面向对象编程（OOP）的基本概念。我们将学习类、对象、属性和方法，这些都是\
    \ OOP 的构建块。理解这些概念将使我们能够创建健壮且可扩展的应用程序。\n\n## 6.1 面向对象编程简介\n\n面向对象编程（OOP）是一种编程范式，侧重于将代码组织成可重用且自包含的对象。对象是类的实例，代表了创建对象的蓝图或模板。OOP\
    \ 提供了封装、继承和多态等概念，允许我们创建模块化且易于维护的代码。\n\n## 6.2 类：对象的蓝图\n\n类是一种用户定义的数据类型，将数据和行为封装在单个单元中。它充当创建对象的蓝图或模板。在\
    \ C# 中，我们使用 `class` 关键字定义类。这里有一个示例：\n\n```csharp\npublic class Person\n{\n   \
    \ // 类成员放在这里\n}\n```\n\n在这个示例中，我们定义了一个名为 `Person` 的类。该类封装了人的特征和行为。\n\n## 6.3 对象：类的实例\n\
    \n对象是类的实例。它代表一个特定的实体或概念。我们根据类定义的蓝图创建对象。这里有一个示例：\n\n```csharp\nPerson person1 =\
    \ new Person();\nPerson person2 = new Person();\n```\n\n在这个示例中，我们根据 `Person` 类创建了两个对象，`person1`\
    \ 和 `person2`。每个对象都有自己的一组数据，并可以执行类定义的操作。\n\n## 6.4 属性：访问和修改数据\n\n属性是类的成员，允许我们访问和修改其数据。它们提供了一种封装数据并控制其访问性的方法。属性具有\
    \ getter（get）和可选的 setter（set），分别用于检索和赋值值。这里有一个示例：\n\n```csharp\npublic class Person\n\
    {\n    public string Name { get; set; }\n    public int Age { get; set; }\n}\n\
    ```\n\n在这个示例中，`Person` 类有两个属性，`Name` 和 `Age`，代表人的名字和年龄。`get` 访问器检索值，而 `set` 访问器允许我们分配新值。\n\
    \n要访问和修改属性，我们使用点表示法。这里有一个示例：\n\n```csharp\nPerson person = new Person();\nperson.Name\
    \ = \"John\";\nperson.Age = 25;\nConsole.WriteLine(person.Name); // 输出: John\n\
    Console.WriteLine(person.Age); // 输出: 25\n```\n\n在这个示例中，我们创建了一个名为 `person` 的 `Person`\
    \ 对象，并给它的 `Name` 和 `Age` 属性赋值了。然后我们访问并显示了这些值。\n\n## 6.5 方法：定义行为\n\n方法是类的成员，定义了对象可以执行的行为或操作。它们封装了一块代码，当方法被调用时执行这些代码。这里有一个示例：\n\
    \n```csharp\npublic class Person\n{\n    public string Name { get; set; }\n  \
    \  public int Age { get; set; }\n    public void SayHello()\n    {\n        Console.WriteLine(\"\
    Hello, my name is \" + Name + \"!\");\n    }\n}\n```\n\n在这个示例中，`Person` 类有一个名为\
    \ `SayHello()` 的方法，它输出一个包含人名的问候信息。\n\n要调用方法，我们使用点表示法。这里有一个示例：\n\n```csharp\nPerson\
    \ person = new Person();\nperson.Name = \" John\";\nperson.SayHello(); // 输出:\
    \ Hello, my name is John!\n```\n\n在这个示例中，我们创建了一个名为 `person` 的 `Person` 对象，并给它的\
    \ `Name` 属性分配了名字 \"John\"。然后我们调用了 `SayHello()` 方法，将问候信息打印到控制台。\n\n## 6.6 构造函数：初始化对象\n\
    \n构造函数是在创建对象时被调用的特殊方法。它用于初始化对象的状态并设置其初始值。在 C# 中，构造函数的名称与类名相同。这里有一个示例：\n\n```csharp\n\
    public class Person\n{\n    public string Name { get; set; }\n    public int Age\
    \ { get; set; }\n    public Person(string name, int age)\n    {\n        Name\
    \ = name;\n        Age = age;\n    }\n    public void SayHello()\n    {\n    \
    \    Console.WriteLine(\"Hello, my name is \" + Name + \"!\");\n    }\n}\n```\n\
    \n在这个示例中，`Person` 类有一个接受两个参数`name` 和 `age`）的构造函数，用于初始化 `Name` 和 `Age` 属性。\n\n\
    要使用构造函数创建对象，我们在创建对象时传递所需的值。这里有一个示例：\n\n```csharp\nPerson person = new Person(\"\
    John\", 25);\nperson.SayHello(); // 输出: Hello, my name is John!\n```\n\n在这个示例中，我们使用构造函数创建了名为\
    \ `person` 的 `Person` 对象，并传递了 \"John\" 和 25。\n\n## 6.7 总结\n\n在本节章中，我们探索了 C# 中面向对象编程的核心概念。我们学习了类（作为创建对象的蓝图）和对象（类的实例）。我们讨论了属性（提供数据访问）和方法（定义类行为）。我们还涵盖了构造函数（初始化对象状态）。\n\
    \n面向对象编程通过将数据和行为封装在类中，允许我们创建模块化的代码。通过利用类、对象、属性和方法，我们可以构建健壮且可扩展的应用程序。在下一章中，我们将引入继承，这是一种在面向对象编程中强大的机制。\n\
    \n# 第 7 章：继承：重用和扩展类\n\n在本章中，我们将探索 C# 中面向对象编程的继承概念。继承允许我们根据现有类创建新类，实现代码重用并扩展功能。我们将学习基类、派生类、继承层次结构以及它们带来的优势。\n\
    \n## 7.1 继承简介\n\n继承是面向对象编程中的一种基本概念，允许我们根据现有类（基类）创建新类（派生类）。派生类继承基类的属性和方法，还可以添加新的成员或覆盖现有的成员。这促进了代码重用、模块化和扩展性。\n\
    \n## 7.2 基类与派生类\n\n继承涉及两类类：基类和派生类。基类是为派生类提供基础的现有类。派生类是继承自基类的新类，获取其成员。\n\n要创建派生类，我们使用\
    \ `:` 符号后跟基类的名称。这里有一个示例：\n\n```csharp\npublic class BaseClass\n{\n    // 基类成员\n\
    }\npublic class DerivedClass : BaseClass\n{\n    // 派生类成员\n}\n```\n\n在这个示例中，我们有一个名为\
    \ `BaseClass` 的基类和一个继承自 `BaseClass` 的派生类 `DerivedClass`。\n\n## 7.3 继承成员\n\n"
- fmt: "\nWhen a class inherits from a base class, it automatically inherits all the\
    \ public and protected members of the base class. This includes properties, methods,\
    \ fields, and events. The derived class can access and use these inherited members\
    \ as if they were defined within the derived class itself.\n\n```csharp\npublic\
    \ class BaseClass\n{\n    public void BaseMethod()\n    {\n        // Base class\
    \ method implementation\n    }\n}\n\npublic class DerivedClass : BaseClass\n{\n\
    \    public void DerivedMethod()\n    {\n        // Derived class method implementation\n\
    \    }\n}\n\nDerivedClass derivedObj = new DerivedClass();\nderivedObj.BaseMethod();\
    \    // Accessing inherited method\nderivedObj.DerivedMethod(); // Accessing derived\
    \ class method\n```\n\nIn this example, the `DerivedClass` inherits the `BaseMethod()`\
    \ from the `BaseClass` and can use it directly. It also defines its own `DerivedMethod()`.\n\
