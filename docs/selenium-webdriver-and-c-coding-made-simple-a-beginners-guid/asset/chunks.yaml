    ## 11.4 Chaining Actions


    One of the powerful features of the Actions class is the ability to chain multiple
    actions together using the `build()` and `perform()` methods. This allows us to
    create complex interactions involving multiple actions.


    Example:


    ```java


    import org.openqa.selenium.By;


    import org.openqa.selenium.Keys;


    import org.openqa.selenium.WebDriver;


    import org.openqa.selenium.WebElement;


    import org.openqa.selenium.chrome.ChromeDriver;


    import org.openqa.selenium.interactions.Actions;


    public class ChainingActionsExample {


    public static void main(String[] args) {


    // Set the path to ChromeDriver executable


    System.setProperty("webdriver.chrome.driver", "path/to/chromedriver");


    // Create ChromeDriver instance


    WebDriver driver = new ChromeDriver();


    // Navigate to the website


    driver.get("https://www.example.com");


    // Find the input field to type into


    WebElement inputField = driver.findElement(By.id("inputField"));


    // Create Actions class instance


    Actions actions = new Actions(driver);


    // Chain multiple actions - click, type text, and press Enter


    actions.click(inputField)


    .sendKeys("Hello, World!")


    .sendKeys(Keys.ENTER)


    .build()


    .perform();


    // Close the browser


    driver.quit();


    }


    }


    ```


    In this example, we chain multiple actions together: clicking the input field,
    typing "Hello, World!", and pressing the Enter key. We use the `build()` method
    to compile the actions into a single action sequence, then `perform()` to execute
    them.


