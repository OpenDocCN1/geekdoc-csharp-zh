  \ 方法。\n\n## 第 19 章\n\n## 文件输入输出\n\n### 关键技能与概念\n\n![Image](img/00002.jpeg) 写入和读取纯文本\n\
  ![Image](img/00002.jpeg) 写入和读取二进制数据\n![Image](img/00002.jpeg) 读取缓冲二进制数据\n![Image](img/00002.jpeg)\
  \ 随机访问二进制数据\n\n* * *\n\n本章将简单介绍如何写入和读取文件内容。所介绍的技术取决于数据格式、可访问性和性能要求。\n\n### 写入和读取纯文本\n\
  \n你可能希望从你的许多应用程序中读取和写入人类可读的文本。你这样做的原因可能包括：记录活动日志、从扁文件初始化应用程序组件、在不使用数据库的情况下管理简单但持久的数据，以及创建甚至读取带有分隔符格式的电子表格数据。C#\
  \ 提供了 `System.IO` 命名空间中的 `StreamWriter` 和 `StreamReader` 类来提供帮助。\n\n***注意***\n\n\
  在整个讨论过程中，你会注意到多次提到数据流（data streams）。数据流就像连接到数据源的河流。数据通过流向目的地。数据在到达目的地时，可能已经被转换为另一种格式。\n\
  \n#### StreamWriter\n\n`StreamWriter` 类提供了向文件写入文本的方法。以这种方式写入的文件可以使用微软记事本等简单的文本编辑器进行读取。要初始化\
  \ `StreamWriter` 对象，可以通过构造函数参数指定文件路径，如下所示。你还可以在一个构造函数重载中包含一个布尔参数，以指示你是希望将数据追加到现有文件还是覆盖文件内容。每当创建\
  \ `StreamWriter` 对象时，如果路径指定的文件不存在，则创建一个新文件。\n\n![image](img/00405.jpeg)\n\n***注意***\n\
  \n默认情况下，文件被写入与应用程序可执行文件相同的目录。此默认位置通常是你的项目文件夹 `bin\\Debug` 目录的上一级。文件路径中的子字符串 `\"\
  ../\"` 意味着移动到目录。\n\n`StreamWriter` 类的 `Write()` 方法输出文本，同时将文件指针保留在文件的同一行。相比之下，`WriteLine()`\
  \ 方法输出文本并移动到文件的新行。此示例使用 `WriteLine()` 和 `Write()` 方法向文件输出内容：\n\n![image](img/00406.jpeg)\n\
  \n```csharp\nsw.WriteLine(\"I say hello.\");\nsw.Write(\"You say goodbye.\");\n\
  ```\n\n或者，且最好是，你可以将 `StreamWriter` 对象放在 `using` 语句中。使用 `using` 块，你不需要手动关闭 `StreamWriter`\
  \ 实例：\n\n```csharp\nsw.Close();\n```\n\n![image](img/00407.jpeg)\n\n* * *\n\n* *\
  \ *\n\n**示例 19-1** 输出到文本文件\n\n* * *\n\n此示例演示了如何使用 `StreamWriter` 类向文件输出逗号分隔的值，可以使用文本编辑器或电子表格应用程序读取。\n\
  \n![image](img/00408.jpeg)\n\n运行应用程序，名为 `Budget.csv` 的文件被写入与项目代码文件相同的目录。该文件夹是 `bin\\\
  Debug` 目录的父目录。生成的文件包含可读文本，因此可以使用微软记事本打开。此外，由于文件扩展名为 `.csv` 且文件内容为逗号分隔的值，可以使用微软 Excel\
  \ 或任何免费电子表格应用程序查看内容（参见图 19-1）。\n\n![image](img/00409.jpeg)\n\n* * *\n\n**图 19-1**\
  \ 在微软 Excel 中查看 .csv 文件\n\n* * *\n\n#### StreamReader\n\n除了向外部文件写入文本，你可能还希望能够从外部文件读取文本到应用程序中。`StreamReader`\
  \ 类提供了这些方法，并且易使用。创建 `StreamReader` 对象时，文件位置作为构造函数的字符串参数指定。\n\n![image](img/00410.jpeg)\n\
  \n为了对象的 `ReadLine()` 方法读取单行文本并将文件指针移动到下一行的开头。如果需要，你还可以使用 `Read()` 方法逐个读取字符。`EndOfStream`\
  \ 布尔属性指示是否到达文件末尾。此示例显示了读取器如何遍历文件并一次读取一行内容，直到文件结束：\n\n![image](img/00411.jpeg)\n\n\
  在完成从文本文件的读取后，必须调用 `StreamReader` 对象的 `Close()` 方法以释放文件，以便在需要时供另一个进程使用。\n\n```csharp\n\
  sr.Close();\n```\n\n类似于 `StreamWriter` 类，你可能考虑将 `StreamReader` 对象声明放置在 `using` 语句中。一旦程序离开\
  \ `using` 块，`StreamReader` 对象将被关闭，文件将被释放。\n\n\n\n\n\n* * *\n\n## 示例 19-2 从文件中读取文本\n\
