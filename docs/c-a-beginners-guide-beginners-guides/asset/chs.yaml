  \n## 第 21 章\n\n## JSON 处理\n\n### 关键技能与概念\n\n![Image](img/00002.jpeg) JSON 简介\n\n\
  ![Image](img/00002.jpeg) 创建动态 JSON 对象\n\n![Image](img/00002.jpeg) 动态解析\n\n![Image](img/00002.jpeg)\
  \ 序列化\n\n![Image](img/00002.jpeg) 反序列化\n\nJSON 是一种人类可读的文本格式，主要用于在 Web 上传输数据。由于 JSON\
  \ 主要用于 Web 技术，因此处理 JSON 的主题非常重要。\n\n### JSON 简介\n\nJSON 代表 JavaScript Object Notation（JavaScript\
  \ 对象表示），但 JSON 是 JavaScript 的子集。JSON 格式由键值对组成，其中键是字符串，值可以是数字、字符串、布尔值、数组或对象。JSON\
  \ 对象用大括号括（见图 21-1）。\n\n![image](img/00477.jpeg)\n\n***注意***\n\n图 21-1 JSON 示例\n\n\
  ### Json.NET\n\n本书用于管理 JSON 的库是 `Json.NET`，它允许使用 C# 进行创建、解析和转换。\n\n### 示例 21-1 将\
  \ Json.NET 添加到你的项目\n\n要在项目中包含 Json.NET，你可以使用 NuGet 包管理器。NuGet 是 .NET 项目中包含第三方库的常用接口。要这样做，选择`工具\
  \ | NuGet 包管理器 | 管理解决方案包`。在右侧搜索框中输入 `Json.Net` 并按回车。然后，选中列表并点击安装按钮。完成这些步骤后，`Newtonsoft.Json`\
  \ 列表将出现在引用目录中。\n\n![image](img/00478.jpeg)\n\n图 21-2 NuGet \n\n### 创建动态 JSON 对象\n\
  \n通过 Json.NET，你可以使用 `JObject` 类动态创建 JSON 对象。`JObject` 类是灵活的，因为它允许你创建和查询 JSON，而无需将\
  \ JSON 容器转换为 .NET 类型。\n\n#### 动态类型\n\n在创建 `JObject` 实例时，为对象使用 `dynamic` 类型，这样就可以灵活修改\
  \ JSON 结构而不必担心转换为 .NET 类型。`dynamic` 类型告诉编译器对象的类型在运行时未知。在 JSON 对象上使用 `dynamic` 类型允许你随时根据需要添加属性或数组。\n\
  \n***提示***\n\n由于你的 JSON 对象是用字符串数据创建的，Visual Studio 中的 `Jobject` 实例提供的没有其他 .NET 类型那样的自动补全或错误检查支持。因此，在处理\
  \ JSON 对象时，你需要格外注意属性名称是否正确。\n\n这是一个示例 `dynamic` JSON 对象声明：\n\n```csharp\ndynamic\
  \ registrant = new JObject();\n```\n\n要创建对象并添加属性，`Add()` 方法接收属性名和值对作为参数：\n\n```csharp\n\
  registrant.Add(\"FirstName\", \"Ben\");\nregistrant.Add(\"LastName\", \"Wu\");\n\
  ```\n\n从这些指令生成的数据为：\n\n```json\n{ \"FirstName\": \"Ben\",\n  \"LastName\": \"Wu\"\
  \ }\n```\n\n\n\n\n如果你愿意，可以不使用 `Add()` 方法，而是直接创建属性名称并为它们赋值，而无需在之前正式声明该属性：\n\n```csharp\n\
  dynamic registrant = new JObject();\nregistrant.FirstName = “Ben”;\nregistrant.LastName\
  \ = “Wu”;\n```\n\n### 创建 JSON 数组\n\n#### 创建数组\n\n可以使用 `JArray` 类创建具有相似类型 JSON 对象的数组。此指令声明了一个名为\
  \ `camps` 的数组：\n\n```csharp\ndynamic camps = new JArray();\n```\n\n一旦声明了数组，就可以使用\
  \ `JArray()` 类的 `Add()` 方法创建对象、初始化并将它们追加到数组中：\n\n![image](img/00479.jpeg)\n\n然后，可以通过简单的赋值将数组附加到父\
  \ `JObject` 实例上。在这种情况下，动态创建了一个 `Camps` 属性，并将 `camps` 数组引用赋值给它：\n\n```csharp\nregistrant.Camps\
  \ = camps;\n```\n\n在数组被赋值给父对象属性后，仍然可以通过父对象的引用和数组属性的 `Add()` 方法向数组中添加新对象：\n\n![image](img/00480.jpeg)\n\
  \n通过前面的系列指令生成的 JSON 数组通过属性名 `Camps` 进行引用：\n\n![image](img/00481.jpeg)\n\n***\n\n\
