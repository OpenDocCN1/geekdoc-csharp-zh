- "# C# 入门指南\n\n\n## 关于作者\n\n`Pat McGee`（位于不列颠伦比亚省温哥华）是不列颠伦比亚理工学院的软件开发讲师和课程开发人员。McGee\
  \ 曾是一名游戏程序员，合著过关于 Microsoft XNA Game Studio 的书籍，并获得了微软 DirectX 和 XNA 的特级专业人士（MVP）奖。你可以通过\
  \ [`HandsOnCoding.net`](http://HandsOnCoding.net) 联系作者。\n\n### 关于技术编辑\n\n`Adam Barney`\
  \ 是一个极客。在四年级时用送报纸赚的钱买了一台 Commodore 64 后，他从未停止过学习计算机以及如何让这些愚笨的机器完成酷炫的事情。Adam 现在是微软\
  \ MVP (C#) 和 ASPInsider，在内布拉斯加州的林肯市经营着自己的独立咨询公司 Barney Consulting。\n\n# ![图像](img/00001.jpeg)\n\
