  \ 元素\n![image](img/00002.jpeg) XML 序列化与反序列化\n\n***\n\n本章讨论了如何使用 Visual Studio 和\
  \ C# 创建、读取、更新、写入和验证 XML。你可能已经熟悉 XML（可扩展标记语言），但以你还没有用过它或需要快速复习，本章的第一部分提供了 XML 的简要介绍，同时描述了支持和自动化\
  \ XML 开发的 Visual Studio 特性。\n\n### XML 简介\n\nXML 是一种平台无关的、自描述的易于阅读的语言，它允许你创建一个标记系统，以便以可读的文本格式标记、存储和传输数据。即便即使你以前没有工作过\
  \ XML，由于描述性标记，你可能仍然可以读取并理解文档中的数据（参见示例 20-1）。如今，XML 经常用于格式化软件配置文件，仍然是 Web 数据传输常用格式之一。很有可能如果你是\
  \ C# 开发的新手，你将不会经常处理 XML。然而，当你开始作为 C# 开发者向 Windows、移动或 Web 开发领域扩展时，你可能需要处理 XML，因此你会希望了解这个主题。\n\
  \n***\n\n### 示例 20-1 创建 XML 文件\n\n***\n\n这是一个存储美国州数据的 XML 文档示例。要创建该文件，请在记事本中输入内容并保存为\
  \ `us_states.xml`。你将在未来的示例中使用此文件。\n\n注意：XML 注释以 `<!--` 开始，以 `-->` 结束。\n\n![image](img/00426.jpeg)\n\
  \n***\n\n#### 元素和属性\n\nXML 文档是由一系列称为 `elements`（元素）标签创建的。这些元素包含在角括号中。元素还可以有许多称为\
  \ `attributes` 的属性。属性位于起始标签内部。为了帮助理解这些部分的位置，图 20-1 显示了元素的编写方式。\n\n![image](img/00427.jpeg)\n\
  \n***\n\n**图 20-1 元素与属性**\n\n#### 元素层次结构\n\nXML 文档中的元素通常用家庭层级结构描述，其中根元素是顶层。嵌套元素是子元素。同一层级的元素是兄弟元素。位于下方两级的元素是孙元素。\n\
  \n#### 将 XML 文添加到 Visual Studio 项目\n\n将 XML 文件添加到项目的步骤与添加任何代码文件的步骤相似。\n\n***\n\n\
