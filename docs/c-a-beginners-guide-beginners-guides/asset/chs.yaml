  \ `Store` `branch` 关联。\n\n## 第 18 章\n\n## 传统数据库开发\n\n### 关键技能与概念\n\n![Image](img/0001.jpeg)\
  \ 用于管理数据库数据的 .NET 类\n\n![Image](img/0002.jpeg) 在 C# 中引用你的连接字符串\n\n![Image](img/0003.jpeg)\
  \ 使用 SqlDataAdapter 进行内存型数据库管理\n\n![Image](img/0004.jpeg) 使用 SqlDataReader 流式处理数据\n\
  \n### SQL\n\n\n\n存储过程是用 SQL 编写的例程，带有可选参数并封装了 SQL。这些例程在按名称调用时执行。存储过程在数据库服务器上创建、存储和执行。由于数据库供应商的不同，存储过程的语法可能会有显著差异。由于存储过程不在\
  \ C# 库的范畴之内，本书将不会详细讨论存储过程，但本章和 LINQ 章节将展示如何从 C# 代码执行存储过程。\n\n## 用于管理数据库数据的 .NET\
  \ 类\n\n在讨论从代码进行实际数据库操作之前，当你从代码中执行 SQL 时，你会希望了解三个 C# 类，它们为你提供了动态结构来管理数据库内容：\n\n![Image](img/00002.jpeg)\
  \ DataTable\n\n![Image](img/00002.jpeg) DataColumn\n\n![Image](img/00002.jpeg) DataRow\n\
  \n这三个类包含在 `System.Data` 命名空间中。\n\n### DataTable\n\nC# `DataTable` 类存储从数据库查询返回的数据。该类在\
  \ .NET 开发者中非常流行，因为它很容易与多个支持数据驱动应用程序开发的 C# 库集成。`DataTable` 对象的结构是在设计时通过数据列结构定义的，或者从数据库查询结果自动生成。在声明\
  \ `DataTable` 对象时，可以使用默认构造函数：\n\n```\nDataTable dt = new DataTable();\n```\n\n###\
  \ DataColumn\n\n要手动定义列，可以使用 `DataTable` 对象的 `Columns` 集合的 `Add()` 方法。`Columns` 集合存储\
  \ `DataColumn` 对象。`DataColumn` 类提供了不同的选项来定义列类型和名称。以下是向 `DataTable` 对象添加列的两种常用重载：\n\
  \n![image](img/00370.jpeg)\n\n在定义表的列时，你需要按照它们在数据表中从左到右出现的顺序来添加它们。\n\n![image](img/00371.jpeg)\n\
  \n你添加的第一个列会自动分配索引值 0。第二个列的索引为 1，第三列的索引为 2，依此类推。\n\n### DataRow\n\n在定义了 `DataTable`\
  \ 的列之后，可以使用 `Rows` 集合的 `Add()` 方法向表填充数据。提供给 `Add()` 方法的值的类型和顺序必须与相应的 `DataTable`\
  \ 对象列顺序和类型定义匹配（如果适用）：\n\n```\ndt.Rows.Add(1, “Manager”, 65000m);\ndt.Rows.Add(2,\
  \ “Staff”, 45000m);\n```\n\n可以使用 `foreach` 循环顺序访问表的行：\n\n```\nforeach (DataRow row\
  \ in dt.Rows) {\n}\n```\n\n`DataTable` 的每一行也可以用数字索引进行访问：\n\n![image](img/00372.jpeg)\n\
  \n你可以使用行和列的数字索引来引用行中的每个单元格：\n\n![image](img/00373.jpeg)\n\n或者使用 `DataRow` 对象对列进行命名引用：\n\
  \n![image](img/00374.jpeg)\n\n**示例 18-1** 配合数据表、数据列和行进行操作\n\n此示例中的代码显示了如何定义一个包含不同工作角色薪资信息的\
  \ `DataTable`。`DataTable` 行中列中的数据使用嵌套的 `foreach` 循环、数字索引和命名引用进行显示：\n\n![image](img/00375.jpeg)\n\
  \n当程序运行时，在定义表并向其添加数据后，`DataTable` 的行值将被打印三次，每次都使用不同的引用方法：\n\n```\n1 Manager 65000\n\
  2 Staff 45000\n1 Manager 65000\n2 Staff 45000\n1 Manager 65000\n2 Staff 45000\n\
  ```\n\n### 尝试本 18-1 构建和使用你自己的 DataTable\n\n这是一个练习在 `DataTable` 对象中处理数据的机会。\n\n**1**.\
  \ 编写一个小型程序，声明一个 `DataTable` 对象来存储下表中的银行账户数据：\n\n![image](img/00376.jpeg)\n\n**2**.\
  \ 在此新 `DataTable` 对象中存储数据后，使用循环遍历 `DataTable` 并使用命名引用显示每行的内容。\n\n## 在 C# 中引用你的连接字符串\n\
  \n第 13 章 讨论了如何在 App.config 文件中创建连接字符串。当你从 C# 代码处理数据库内容时，你需要在 C# 代码中引用此连接字符串。要从 App.config\
  \ 文件在 C# 代码中检索连接字符串，可以使用 `ConfigurationManager` 类的 `ConnectionStrings` 属性：\n\n![image](img/00377.jpeg)\n\
  \n`ConnectionStrings` 属性引用存储在 App .config 文件中的 `connectionStrings` 元素内某个 `add` 元素的名称属性值\
  \ `MyConnection`。\n\n***注意***\n\n有关如何构建名为 `MyConnection` 的连接字符串的信息，请参考 示例 13-1。\n\
  \n`ConfigurationManager` 类通过 `System.Configuration` 命名空间可用。然而，此 `System.Configuration`\
  \ 命名空间未包含在默认控制台中。如果你想使用此库，必须手动将其添加到项目中。接下来将解释如何执行此操作的步骤。\n\n**示例 18-2** 添加 System.Configuration\
