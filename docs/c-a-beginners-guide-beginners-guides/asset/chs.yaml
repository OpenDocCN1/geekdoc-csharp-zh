  此方法返回：\n\n![Image](img/00002.jpeg) - 如果原始 `TimeSpan` 值小于参数值，则返回 -1。\n\n![Image](img/00002.jpeg)\
  \ - 如果原始 `TimeSpan` 值等于参数值，则返回 0。\n\n![Image](img/00002.jpeg) - 如果原始 `TimeSpan`\
  \ 值大于参数值，则返回 1。\n\n在下面的示例中，将存储 1 天 13 小时的 `TimeSpan` 对象与存储 1 天的 `TimeSpan` 对象进行比较。由于第一个对象更大，`CompareTo()`\
  \ 的结果为 1。\n\n![image](img/00143.jpeg)\n\n* * *\n\n* * *\n\n### 尝试一下 7-1 TimeSpan\
