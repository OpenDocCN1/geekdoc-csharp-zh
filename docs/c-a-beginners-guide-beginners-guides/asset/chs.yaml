  \ 要关闭程序，按 `F5` 恢复执行让其运行完成。在提示时按 `ENTER`。\n\n![Image](img/00013.jpeg)\n\n#### 监视窗口\n\
  \n监视窗口（Watch window）允许你在断点处停止时自定义变量列表及其对应的值。监视窗口与局部窗口不同，因为它同时显示局部变量和类级变量。监视窗口只能在运行时查看。监视窗口默认不显示。要启动它并创建列表，首先在断点处停止程序，然后在变量名上点击右键并从弹出菜单中选择\
  \ `Add Watch`（添加监视）。窗口如图 1-7 底部中间所示。你可以通过右键点击项目并选择 `Delete Watch`（删除监视）从监视列表中删除项目。\n\
  \n（注：此处原文中存在大量重复的 NOTE 段落，已根据要求去重，仅保留核心逻辑）\n\n\n\n\n对于非常大的程序，由于必须先执行数百或数千行代码才能创建可能发生错误的条件，有时要确定错误发生的位置可能非常困难。例如，变量值可能会超出有效范围。通过单步执行代码来寻找此错误可能是不可行的，因为可能需要执行数千条指令才能找到那个偏离正常的值。在开发过程中如果遇到这种情况，你可能考虑将输出写入到日志文件中，以跟踪数据值的变化，这样你就可以以正常速度运行应用程序。\n\
  \nC# 允许你使用 `StreamWriter` 类快速将文本输出到文件，该类定义在 `System.IO` 命名空间中。创建 `StreamWriter`\
  \ 对象有多种方法。我们将使用的语法（所示）通过两个参数来定义该对象。第一个参数是表示文件位置的字符串。第二个参数是一个 `Boolean` 值，指示该对象是覆盖现有文件还是在现有文件的任何数据之后追加输出：\n\
  \n```csharp\nStreamWriter streamWriter = new StreamWriter(string fileLocation, bool\
  \ append);\n```\n\n当创建 `StreamWriter` 对象时，如果指定位置不存在文件，则会创建一个。\n\n## 示例 1-2 日志数据\n\
  \n此示例程序在项目代码文件存储的相同目录下生成一个简单的日志文件。当发生错误时，会在文件中写入错误信息。\n\n![Image](img/00017.jpeg)\n\
  \n当你运行项目时，你会发现代码所在的目录下生成了一个名为 `log.txt` 的文本文件。每当你运行程序时，使用记事本等文本编辑器查看日志文件时，都会看到额外一行显示“Here\
