  \ 文件，你会发现佛罗里达元素已被移除。\n\n***\n\n### XML 序列化与反序列化\n\nXML 序列化是将对象或对象列表转换为 XML 的过程。XML\
  \ 反序列化则将其转换回来。如果你正在将数据库内容或其他数据转换为 XML 及其反之，那么自动化这些过程将特别有用。\n\n#### 序列化\n\n让我们先来看下序列化。`XmlSerializer`\
  \ 类包含了用于将 C# 数据对象转换为 XML 的方法。当声明 `XmlSerializer` 对象时，需要指定类或 `List` 类型：\n\n```csharp\n\
  XmlSerializer serializer = new XmlSerializer(typeof(ClassName)); \nXmlSerializer\
  \ serializer = new XmlSerializer(typeof(List));\n```\n\n`Serialize()` 方法接收写入器和数据对象作为参数。此示例使用了\
  \ `StringWriter`。\n\n```csharp\nXmlSerializer serializer = new XmlSerializer(typeof(ClassName));\
  \ \nStringWriter sw = new StringWriter();\nserializer.Serialize(sw, obj);\n```\n\
  \n一旦 `StringWriter` 对象被填充，你可以将其转换为 `XElement` 对象：\n\n```csharp\nXElement element\
  \ = XElement.Parse(sw.ToString());\n```\n\n***\n\n***\n\n**示例 20-9** 将对象转换为 XML\n\
  \n***\n\n此序列化示例显示了从 `Employee` 对象生成 XML 的完整视图：\n\n![image](img/00461.jpeg)\n\n当你运行此程序时，类对象被转换为\
  \ XML，窗口显示如下：\n\n![image](img/00462.jpeg)\n\n这里有一个提示——你会发现生成的 XML 生成包含指向根元素的命名空间引用\
  \ `xmlns:xsi` 以及默认架构 `xmlns:xsd`。若要在 示例 20-9 中移除这些引用，请将\n\n```csharp\nserializer.Serialize(sw,\
  \ employee);\n```\n\n替换为\n\n```csharp\nXmlSerializerNames ns = new XmlSerializerNames();\n\
  ns.Add(\"\");\nserializer.Serialize(sw, employee, ns);\n```\n\n***\n\n#### 自定义 XML\
  \ 序列化\n\n默认情况下，在序列化期间，所有 C# 数据对象的属性都被转换为元素。同样默认，所有自动生成的 XML 元素名称与类属性名称相同。这种自动化非常有帮助，但你可能需要控制序列化过程，将某些数据存储为\
  \ XML 属性而不是元素。或者，你可能需要自定义 XML 元素和属性名称。为此，可以使用 C# 属性。要自定义 XML 元素，可以在类属性前加上 `XmlElement`\
  \ 属性，它像一个以方括号结尾的标签。`XmlElement` 属性接收所需的元素名称作为参数：\n\n![image](img/00463.jpeg)\n\n\
