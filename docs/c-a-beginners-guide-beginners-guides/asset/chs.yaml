  ### 局部类 (Partial Classes)\n\n根据设计，默认的 C# 类必须在一个文件中声明。然而，部分类（partial class）允许你在多个文件中定义你的类。部分类简化了大型类的代码组织。Windows\
  \ Forms 和 Web Forms 项目中的许多自动生成的代码文件使用部分类来向开发者暴露表单的本质结构，而在其他文件中隐藏更复杂的细节。\n\n部分类在类声明中、`class`\
  \ 关键字之前使用 `partial` 关键字进行声明。在名为 `ClassName1.cs` 的文件中，类声明可能如下所示：\n\n```cs\npublic\
  \ partial class ClassName { }\n```\n\n在另一个名为 `ClassName2.cs` 的文件中，你可以拥有相同的类声明，以继续定义\
  \ `ClassName` 类：\n\n```cs\npublic partial class ClassName { }\n```\n\n* * *\n\n\
