  \ 属性提取有关时间间隔的信息。首先，总时间被拆分为天、小时、分钟和秒组件。然后，`TimeSpan` 对象的总时长以不同的单位显示，包括总天数、总小时数、总分钟和总秒数。\n\
  \n![image](img/00138.jpeg)\n\n![image](img/00139.jpeg)\n\n输出显示了此时间间隔的不同值：\n\n![image](img/00140.jpeg)\n\
  \n![Image](img/00013.jpeg)\n\n### TimeSpan 计算\n\n`TimeSpan` 类型还提供了许多用于对时间间隔进行计算的选项。我们将查看添加、减少和比较时间间隔的简单但常用的方法。\n\
  \n#### TimeSpan 添加\n\n`TimeSpan` 类型的 `Add()` 方法将一个 `TimeSpan` 对象加上另一个并返回一个 `TimeSpan`\
  \ 对象：\n\n```\nTimeSpan Add(TimeSpan ts);\n```\n\n在下面的代码示例中，将一个存储 1 天 13 小时的 `TimeSpan`\
