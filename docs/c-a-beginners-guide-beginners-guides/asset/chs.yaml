  \n## 继承的构造函数重载\n\n在创建派生对象时，默认会调用基类的无参数构造函数。然而，你可能想调用带有参数集的基类构造函数。你甚至可能想向基类传递一组与派生类使用的不同的参数。在向基类传递参数列表时，这些参数将附加在子类头部，并在后跟\
  \ `base` 关键字和参数列表。在以下示例中，从 `Charity` 调用带有两个参数的 `Organization`构造函数：\n\n![image](img/0195.jpeg)\n\
  \n* * *\n\n* * *\n\n## **示例 9-2** 向构造函数传递参数\n\n* * *\n\n此示例演示了向名为 `Organization`\
  \ 的基类从 `Charity` 类传递参数的不同方法。基类构造函数接收两个参数：\n\n```\npublic Organization(string name,\
  \ string taxCode) {}\n```\n\n两个 `Charity` 构造函数之一将常量和一个参数值传递给基类构造函数：\n\n```\nconst\
  \ string TAXATION_CODE = \"Unassigned\";\npublic Charity(string name) : base(name,\
  \ TAXATION_CODE) {}\n```\n\n另一个 `Charity` 构造函数将它的两个参数值都传递给基类构造函数：\n\n```\npublic\
  \ Charity(string name, string taxCode) : base(name, taxCode) {}\n```\n\n两个不同的 `Charity`\
  \ 构造函数提供了初始化 `Charity` 对象的两种方式：\n\n![image](img/0196.jpeg)\n\n这里是完整的示例：\n\n![image](img/0197.jpeg)\n\
  \n![image](img/0198.jpeg)\n\n此示例生成的输出显示了 `Organization` 类的基类构造函数在子类构造函数执行之前执行：\n\
  \n```\n* Base constructor *\n* Child Constructor A *\nOrganization Name: Unicef\n\
  Tax code: Unassigned\n* Base constructor *\n* Child Constructor B *\nOrganization\
  \ Name: United Way\nTax code: TAX-FREE GIVING\n```\n\n### 虚拟继承\n\n当基类方法、变量和属性或其他成员带有\
  \ `virtual` 修饰符时，可以在父类中实现，也可以在子类中重写。子类实现中的 `override` 优先级更高并替换父类行为。虚拟重写还提供了使用 `base`\
  \ 关键字调用基实现的选项。\n\n#### 声明虚拟方法\n\n父类中实现并在子类中重写的方法在父类中用 `virtual` 关键字标记：\n\n```\n\
  public virtual void ShowStartBalance() {}\n```\n\n#### 重写虚拟方法\n\n\n\n\n\n在子类中声明虚拟方法的备选实现时，需要使用\
  \ `override` 关键字。作为选项，可以使用 `base` 关键字调用相同方法的父类实现：\n\n![image](img/00199.jpeg)\n\n\
  #### 声明虚拟属性\n\n父类中的虚拟属性声明允许在父类中进行实现，且该实现可以被子类重写。在此声明中需要使用 `virtual` 关键字：\n\n```csharp\n\
  protected virtual decimal StartBalance { set; get; }\n```\n\n#### 重写虚拟属性\n\n只要使用\
  \ `override` 关键字进行声明，子类就可以重写虚拟属性。你还可以选择使用 `base` 关键字引用父类属性：\n\n![image](img/00200.jpeg)\n\
  \n***注意*** \n\n在子类中定义方法、属性或数据成员时，你可以省略 `override` 关键字。但是，如果你从该子类派派生一个新类，你将无法实现新的重写。\n\
  \n***\n\n**示例 9-3** 虚拟继承\n\n***\n\n此示例展示了创建一个名为 `Account` 的父类，以及两个名为 `Checking`\
  \ 和 `Savings` 的派生类。该 `Account` 类包含 `ShowStartBalance()` 方法的虚拟声明，该方法在名为 `Checking`\
  \ 的子类中被重写。`Account` 声明还包含一个名为 `StartBalance` 的 `set` 访问器的虚拟声明。`StartBalance` 属性在\
  \ `Checking` 类中被重写。\n\n![image](img/00201.jpeg)\n\n输出验证了 `Account` 类的子对象使用相同的数据初始化，但由于子类层级的定制，它们的行为不同：\n\
  \n```\nSavings balance is $55.00\nChecking balance is $44.60\n```\n\n![Image](img/00013.jpeg)\n\
  \n### 抽象继承\n\n抽象是另一种用于实现继承的方法，用以强制派生类中代码的一致性。声明为抽象的方法和属性不能在声明它们的类中实现，但必须在子类中实现。如果一个类至少有一个抽象属性或方法声明，则该类也必须声明为\
  \ `abstract` 关键字。\n\n#### 声明抽象类\n\n要在你的类中声明一个或多个抽象方法或属性，类本身必须声明为抽象类：\n\n![image](img/00202.jpeg)\n\
  \n***注意*** \n\n在声明抽象类时，重要的是记住你不能直接创建抽象类的实例。此外，你可以在你的抽象类中包含虚拟方法和属性。\n\n#### 声明抽象方法\n\
  \n由于抽象方法在基类中不实现任何代码，你通常可以使用一行代码来声明抽象方法。父类内部的方法声明必须包含 `abstract` 关键字：\n\n```csharp\n\
  protected abstract void AssignPromotions();\n```\n\n#### 重写抽象方法\n\n抽象方法仅在派生类内部包含可执行的代码。为了在派生类中实现抽象方法，你必须在实现中包含\
  \ `override` 关键字：\n\n```csharp\nprotected override void AssignPromotions() { }\n\
  ```\n\n#### 声明抽象属性\n\n抽象属性没有实现。它们用 `abstract` 关键字表示：\n\n```csharp\npublic abstract\
  \ string DepartmentName { get; protected set; }\n```\n\n#### 重写抽象属性\n\n一旦声明了抽象属性，就可以在派生类中实现该属性。注意\
  \ `override` 关键字的存在：\n\n```csharp\npublic override string DepartmentName { get;\
  \ protected set; }\n```\n\n***\n\n**示例 9-4** 抽象继承\n\n***\n\n此示例检查了一个类层次结构，该结构通过派自\
  \ `Department` 类的 `Fashion` 类建立。在代码中，`Department`类的抽象声明允许声明抽象属性 `DepartmentName`\
  \ 和抽象方法 `AssignPromotions()`。`Fashion` 类随后提供了 `DepartmentName` 和 `AssignPromotions()`\
  \ 的所需实现。\n\n![image](img/00203.jpeg)\n\n![image](img/00204.jpeg)\n\n程序的输出生成自抽象 `Department`\
  \ 类 `DisplayPromotions()` 方法的实现：\n\n![image](img/00205.jpeg)\n\n![Image](img/00013.jpeg)\n\
  \n### 虚拟与抽象的比较\n\n为了帮助总结虚拟与抽象声明之间的差异，表 9-1 提供了并排对比。\n\n![image](img/00206.jpeg)\n\
  \n**表 9-1** 虚拟与抽象声明的比较\n\n***\n\n## 尝试 9-2 抽象练习\n\n***\n\n此练习提供了实践机会，以观察设置为启用虚拟继承的类与强制抽象继承的类之间的差异。\n\
  \n**1**. 尝试运行以下程序：\n\n    ![image](img/00207.jpeg)\n\n    输出是\n\n    ![image](img/00208.jpeg)\n\
  \n**2**. 修改程序，首先将 `Person` 类设为抽象。注意，在进行此更改后，程序不再编译，因为无法创建抽象类的实例。\n\n**3**. 从 `Person`\
  \ 类中删除构造函数，因为无法实例化抽象类。\n\n**4**. 将 `FirstName` 和 `LastName` 属性设为抽象。同样，将 `PersonalData()`\
  \ 方法设为抽象。\n\n**5**. 创建一个名为 `Visitor` 的新子类，继承自 `Person`。\n\n**6**. 在 `Visitor` 类中实现\
  \ `FirstName` 和 `LastName` 属性以及 `PersonalData()` 方法。然后添加一个 `Person` 构造函数，接收姓名参数并将值存储在相应的属性中。\n\
  \n**7**. 调整你的代码以生成与原始程序相同的输出。\n\n![Image](img/00023.jpeg)\n\n### 多态\n\n当你需要管理一组相关对象但在设计时不确定它们的类型时，可以使用多态。`多态`\
  \ 是一种技术，允许你声明一个特定类型的变量，该变量可以分配任何派生类的实例。换句话说，多态允许你声明一个通用对象，并在以后变为特定。在共享父类代码和子类代码中，多态将相关的派生类型视为具有共享成员的集合。\n\
  \n***\n\n**示例 9-5** 多态\n\n***\n\n此示例展示了多态的实现，首先声明了一个 `Mammal` 对象数组。随后，数组的每个元素都用\
  \ `Mammal`、`Lion` 或 `Bear` 类实例进行初始化。实际上，创建了一个通用父类对象，它可以变为不同的哺乳动物类型。一旦用不同类型的哺乳动物初始化元素，`foreach`\
  \ 循环就会遍历对象并显示它们的类型。\n\n![image](img/00209.jpeg)\n\n重写的 `DisplayMammalType()` 显示了\
  \ `Bear` 和 `Lion` 类的哺乳动物类型。第三个元素的类型通过 `Mammal` 类中 `DisplayMammalType()` 方法的虚拟实现显示：\n\
  \n```\nI am a Lion!\nI am a Bear!\nI am a Mammal!\n```\n\n![Image](img/00013.jpeg)\n\
  \n***\n\n**示例 9-6** 实用多态\n\n***\n\n此示例展示了一个更具说服力的使用继承和多态的场景。在这种情况下，名为 `ShipOrder`\
