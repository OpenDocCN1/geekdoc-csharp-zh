  ![Image](img/00002.jpeg) 使用 Visual Studio 浏览数据库内容\n\n***\n\n作为一名 C# 开发人员，你很可能在职业生涯早期某个阶段需要在代码中处理数据库内容。为了帮助你准备数据驱动的\
  \ C# 开发，本章将重点介绍项目设置和环境，而不是代码。无论你处理数据库的经验如何（无论丰富还是没有），本章都提供了关于如何使用 Visual Studio\
  \ 工具访问数据库内容的有用信息。\n\n### 为本书访问数据库资源\n\n为了支持本书对数据驱动内容的关注，本书在所有需要数据库内容的示例章节中均使用名为\
  \ `FoodStore` 的数据库。对于几乎或没有经验、或者没有安装 Microsoft SQL Server 的读者，可以使用 `FoodStore.mdf`\
  \ 文件中包含的数据库，该文件包含在本书下载包的 `FoodStoreDatabase` 目录中。对于已安装 Microsoft SQL Server 的经验丰富的数据库开发人员，SQL\
  \ 脚本也包含在代码下载包中 `FoodStore` 目录下的 `FoodStore.sql` 文件中。此外，对于经验丰富的开发人员，附录中包含了显示此数据库所有表的实体关系图。\n\
  \n### 创建数据库连接字符串\n\n要从 C# 应用程序与数据库通信，需要位置、名称和身份验证参数。这些数据库参数包含在数据库连接字符串中。\n\n***提示***\n\
  \n确定连接字符串参数并不是一项非常有挑战性的任务，但当连接字符串组装错误时，此问题可能很难检测。因此，尽可能使用 Visual Studio 中的向导来生成连接字符串，将帮助你确保其配置正确。\n\
  \n对于本书中的所有数据库演示，你可以选择两种数据库类型之一：\n\n![Image](img/00002.jpeg) Microsoft SQL Server\
  \ 数据库文件（也称为 `.mdf` 文件）。建议数据库初学者使用 `FoodStore.mdf` 文件。\n\n![Image](img/00002.jpeg)\
  \ 独立的 Microsoft SQL Server 安装。仅建议已安装免费的 Express 版或付费版 Microsoft SQL Server 的高级数据库用户使用这种独立的\
  \ SQL Server 安装。\n\n无论你从这两个选项中选择哪一个，使用任一数据源类型对于本书中的所有代码示例都是完全可以的。\n\n***\n\n***\n\
  \n**示例 13-1** 为数据库开发初学者创建连接字符串\n\n***\n\n示例中的步骤显示了如何添加数据库文件的引用。在这种情况下，你将创建一个对 `FoodStore.mdf`\
  \ 数据库文件的引用。此示例建议数据库开发初学者或未单独安装 Microsoft SQL Server 的高级数据库用户使用。\n\n`FoodStore.mdf`\
