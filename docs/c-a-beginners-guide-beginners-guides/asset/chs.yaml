  \ 类型的 `Subtract()` 方法计算 `TimeSpan` 值之间的差，并以 `TimeSpan` 格式返回差：\n\n```\nTimeSpan Subtract(TimeSpan\
  \ ts);\n```\n\n在接下来的代码示例中，从存储 1 天 13 小时的 `TimeSpan` 对象中减去存储 1 天的 `TimeSpan` 对象，得到\
  \ 13 小时的差：\n\n![image](img/00142.jpeg)\n\n### TimeSpan 比较\n\n`CompareTo()` 方法将一个\
