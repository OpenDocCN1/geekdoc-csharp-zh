  \ 之前初始的 `annualFoodCost` 为 $10,000。\n\n## 第 5 章 条件结构与循环\n\n### 核心技能与概念\n\n![Image](img/00002.jpeg)\
  \ 控制结构\n\n![Image](img/00002.jpeg) 比较运算符\n\n![Image](img/00002.jpeg) 条件结构\n\n![Image](img/00002.jpeg)\
  \ 循环\n\n本章介绍了两种主要的控制结构：条件结构和循环。条件结构允许对代码执行进行决策。循环结构允许代码的重复性执行。\n\n### 控制结构\n\n条件结构和循环都是控制结构，因为它们依赖于表达式进行执行。条件表达式求求值为真或假。例如，如果表达式为真（例如\
  \ `x` 的值大于 5），则执行控制结构包含的代码：\n\n![image](img/0079.jpeg)\n\n#### 缩进与对齐\n\n每个控制结构通常以一个包含表达式的头部开始。虽然有例外，但通常情况下要执行的代码块紧随控制结构头部。该代码块包含在起始\
  \ { 和结束 } 大括号中。大括号内的代码进行缩进并左对齐。\n\n通常，起始大括号放在控制结构头部之后的行，如下：\n\n![image](img/0080.jpeg)\n\
  \n为了节省空间，大括号可以放在与控制结构头部同一行，如下所示：\n\n![image](img/0081.jpeg)\n\n当控制结构块中只有一行代码时，大括号是可选的，如下：\n\
  \n![image](img/0082.jpeg)\n\n> 为了帮助保持代码的可读性并易于调试，在编写代码时最好对你的控制结构使用正确的缩进和对齐。你的同事也会对此有要求。\n\
  \n#### 嵌套\n\n可以将控制结构放在控制结构内部，这种做法被称为嵌套。在这种情况下，条件语句被放在另一个条件语句内部：\n\n![image](img/0083.jpeg)\n\
  \n### 比较运算符\n\n为了实现条件结构和循环，比较运算符允许你创建用于两种结构类型的布尔表达式。条件表达式生成真或假的结果，允许程序决定是否执行条件块或循环块中的代码。在本节中，我们将检查常见的比较运算符。\n\
  \n#### 等于与不等于运算符\n\n等于运算符 `=` 用于确定两个相同数据类型的操作数是否相等。等于运算符使用两个等号，因为只使用一个等号会被解释为赋值。换，`c\
  \ = d` 将 `d` 的值赋值给 `c`。然而，`c = = d` 表示正在进行比较。\n\n\n\n\n要判断两个相同数据类型的操作数是否不等，请使用不等于运算符\
  \ `!=`。感叹号 `!` 是否定运算符，通常称为 `not`。在真（true）表达式之前放置 `!` 会使其变为假（false）。由于负负得正，在假（false）表达式之前放置\
  \ `!` 会使其变为真（true）。表 5-1](#part0013.html_ch5tab1)显示了等于和不等于运算符在布尔表达式中的用法。\n\n![image](img/00084.jpeg)\n\
  \n**表 5-1** 等于和不等于运算符\n\n## 小于和大于运算符\n\nC# 使用小于（`<`）、大于（`>`）、小于等于（`<=`）和大于等于（`>=`）运算符比较相同数据类型的值。小于和大于表达式的结果始终为真或为假。例如，`5\
  \ > 4` 始终为真，而 `5.0f >= 6.0f` 始终为假。表 5-2 列出了这四个小于和大于表达式并提供了每个表达式的示例。\n\n![image](img/00085.jpeg)\n\
  \n**表 5-2** 小于和大于运算符\n\n## AND 和 OR 运算符\n\n逻辑与（AND）和逻辑或（OR）运算符允许你创建复合条件表达式。逻辑 AND\
  \ 运算符用双安培符 `&&` 表示。逻辑 OR 运算符使用双管道 `||` 符号。对于逻辑 AND，运算符两侧的每个条件都必须为真，最终结果才为真。对于逻辑\
  \ OR，运算符两侧任一侧至少有一个条件为真，整个表达式才为真。表 5-3](#part0013.html_ch5tab3)展示了每个类型运算符的示例。\n\n\
  ![image](img/00086.jpeg)\n\n**表 5-3** 逻辑 AND 和逻辑 OR 运算符\n\n现在让我们来看看比较运算符如何与条件结构配合以实现决策逻辑。\n\
  \n### 条件结构\n\n条件结构允许你通过使用条件表达式选择并执行不同的代码分支。即使是最复杂的决策系统和算法也依赖这些简单但至关重要的结构。每当条件结构中的条件表达式为真时，执行随后的代码块，然后程序退出条件序列。三类条件结构是：\n\
  \n![Image](img/00002.jpeg) If-else 语句\n\n![Image](img/00002.jpeg) 条件运算符\n\n![Image](img/00002.jpeg)\
  \ Switch \n\n#### If-Else 语句\n\nif-else 语句是最常用的条件结构。if-else 语句实际上是一系列组合在一起的条件表达式。在序列中找到第一个真条件表达式后，将执行随后的代码块。一旦代码块执行完毕，程序立即退出条件序列，因此不再对序列中的其他表达式进行求值。该条件序列可能使用\
  \ `if`、`else if` 和 `else` 结构。这些结构组合在一起类似于此示例代码中的结构：\n\n![image](img/00087.jpeg)\n\
  \n为了更好地理解这一点，让我们检查 if-else 序列中三种可能的分支类型：\n\n![Image](img/00002.jpeg) **if** `if`\
  \ 语句包含 if-else 语句中的第一个条件表达式。一个序列中只能存在一个 `if` 语句，并且对于任何序列或单独存在，它都是强制性的。当 `if` 语句为真时，执行下方的代码块。\n\
  \n![Image](img/00002.jpeg) **else if** `else if` 语句是可选的，并且必须跟在起始的 `if` 语句之后。`else\
  \ if` 提供了另一个条件表达式，以及当表达式为真时执行的备选代码块。if-else 序列中可以存在多个 `else if` 语句。\n\n![Image](img/00002.jpeg)\
  \ **else** `else` 语句是当 if-else 序列中之前的任何条件都不为真时的默认选择。只允许一个 `else` 条件，且它必须位于条件序列的末尾。\n\
