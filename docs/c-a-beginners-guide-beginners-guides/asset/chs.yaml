  \n## 第 10 章泛型类型与集合\n\n### 关键技能与概念\n\n![image](img/00002.jpeg) 泛型类型\n\n![image](img/00002.jpeg)\
  \ List 集合\n\n![image](img/00002.jpeg) ArrayList 集合\n\n![image](img/00002.jpeg) KeyValuePair\
  \ 类型\n\n![image](img/00002.jpeg) Dictionary 集合\n\n![image](img/00002.jpeg) Hashtable\
  \ 集合\n\n本章主要关注如何使用 `List`、`ArrayList`、`Dictionary` 和 `Hashtable` 集合管理大量对象。本章涵盖的所有集合类型都是动态调整大小，可以在运行时添加或删除项。每个集合类都提供了实用的方法用于在集合中添加和查找特定项。\n\
  \n在深入研究集合之前，我们将介绍泛型。了解泛型对于理解 `List` 和 `Dictionary` 如何在初始化时强制统一类型是必要的。\n\n### 泛型类型\
  \ (Generic Types)\n\n泛型类和结构是在定义数据类型之前类型安全的模板。泛型模板提供的巨大优势是它们可以使用不同的数据类型重用。\n\n####\
  \ 声明泛型模板\n\n泛型类或结构声明与普通类或结构声明相似。然而，泛型声明在类名随后的左右角括号内包含至少一个泛型类型参数。\n\n包含一个泛型类型声明的类头部如下所示：\n\
  \n```cs\nclass QuizQuestion <T> {}\n```\n\n\n\n\n与之类似，一个具有两个泛型类型的类标头可能如下所示：\n\n\
  ```cs\nclass QuizQuestion <T,U> {}\n```\n\n需要记住的一个关键点是，`T` 和 `U` 可以是任何类型，且模板并不关心\
  \ `T` 或 `U` 是什么类型。`QuizQuestion` 的声明用于一个操作类型为 `T` 或 `U` 的对象的类，无论对象的具体类型为何。\n\n####\
  \ 泛型构造函数\n\n定义泛型类或结构体时，也可以实现为接收泛型类型的参数作为可选选项：\n\n```csharp\npublic QuizQuestion(string\
  \ question, T answer) {\n}\n```\n\n### 声明和初始化泛型类或结构体的对象\n\n要声明泛型类或结构体的对象，请提供模板名称、类型参数以及对象的名称。在初始化泛型类或结构体的对象时，你在\
  \ `new` 关键字和带参数的构造函数之后的角括号中定义要实现的实际数据类型。\n\n这里是一个定义泛型类型的 `QuizQuestion` 类对象的示例。从类和构造函数的声明开始。类声明在角括号内包含了类型参数，并且\
  \ `QuizQuestion` 构造函数接收一个泛型类型的参数：\n\n![Image](img/00218.jpeg)\n\n在声明泛型类型 `QuizQuestion`\
  \ 类的对象时，此处的数据类型在角括号内被设置为整数。由于在此对象声明使用了整数，因此在初始化对象时，可以将整数值传递给构造函数：\n\n```cs\nQuizQuestion<int>\
  \ questionA = new QuizQuestion<int> (\"How many teeth do sharks use in a lifetime?\"\
  , 30000);\n```\n\n这是另一个有效的 `QuizQuestion` 对象声明，它使用字符串定义泛型类型，以便以字符串格式存储答案：\n\n![Image](img/00219.jpeg)\n\
  \n#### 泛型方法\n\n除了接收泛型类型的参数外，方法还可以被设计为返回泛型类型的值：\n\n```csharp\nT GetAnswer() {}\n\
  ```\n\n#### 泛型属性\n\n属性也可以以泛型的格式定义：\n\n```csharp\nT Answer { get; private set; }\n\
  ```\n\n#### 泛型变量\n\n泛型类或结构体中的变量可以使用泛型格式声明。泛型变量可以在类或结构体级别、方法头以及方法内部声明：\n\n```csharp\n\
  T answerVariable;\n```\n\n* *\n\n* *\n\n### 示例 10-1 泛型类介绍\n\n* * *\n\n此示例展示了一个泛型\
  \ `QuizQuestion` 类，它能以不同的数据格式存储测验问题和答案。类型参数 `T` 定义了类内部使用的泛型数据类型。第一个 `QuizQuestion`\
  \ 对象将整数分配给泛型类型。第二个 `QuizQuestion` 对象将字符串分配给泛型类型。\n\n![Image](img/00220.jpeg)\n\n\
  该示例的输出显示了不同数据类型的答案，其中第一个答案是整数类型，第二个答案是字符串类型：\n\n![Image](img/00221.jpeg)\n\n![Image](img/00013.jpeg)\n\
  \n* * *\n\n* *\n\n### 示例 10-2 多个泛型类型参数\n\n* * *\n\n此示例展示了 `QuizQuestion` 类如何实现两个泛型类型。在此情况下，`QuizQuestion`\
  \ 类管理一个问题和两个具有不同数据类型的多项选择响应。通常情况下，C# 开发者会将第一个类型参数声明为 `T`。下一个泛型类型用 `U` 表示。\n\n![Image](img/00222.jpeg)\n\
  \n当你运行它时，输出显示了用整数和字符串类型实现的答案：\n\n`(a) is a System.Int32`\n\n`(b) is a System.String`\n\
  \n`Approximately how many shark species exist?`\n\n`a) 350`\n\n`b) None of the above.`\n\
  \n![Image](img/00013.jpeg)\n\n* * *\n\n* *\n\n### 尝试此 10-1 泛型类型练习\n\n* * *\n\n此练习为你提供了一个练习使用泛型类型的机会。以下是步骤：\n\
  \n**1**. 修改示例 10-2，使得 `QuizQuestion` 类接受三个类型参数，并管理具有三个不同类型响应的问题。\n\n**2**. 修改 `QuizQuestion`\
  \ 类以及 `Main()` 内部的问题声明，使得运行程序的输出变为：\n\n`(a) is a System.String`\n\n`(b) is a System.String`\n\
  \n`(c) is a System.String`\n\n`Circle the responses which are true.`\n\n`a) Sharks\
  \ are the only fish that have eyelids.`\n\n`b) Starfish and jellyfish are not fish.`\n\
  \n`c) Somebody who studies fish is an ichthyologist.`\n\n![Image](img/00023.jpeg)\n\
  \n现在我们已经涵盖了泛型类型，让我们将这些知识应用于集合上。\n\n### List 集合\n\n`List` 集合是动态分配的、类型安全的集合，实现了泛型类型。它们包含相同类型的对象或继承自同一基类的对象。恰恰，`List`\
  \ 类包含在 `System.Collections.Generic` 命名空间中。其中 `T` 是存储在列表中的数据类型，该集合的声明语法如下：\n\n```csharp\n\
  List<T> collection = new List<T>();\n```\n\n`List` 类实现了 `IEnumerable` 接口，允许你遍历集合。我们将在第\
  \ 12 章中讨论接口。\n\n#### List 方法\n\n`List` 类提供了方便的方法来添加、检索和删除数据。由于 `List` 类是泛型的，它并不关心类型。\n\
  \n```csharp\nvoid Add(T item);\nvoid Insert(int index, T item);\nvoid InsertRange(int\
  \ index, IEnumerable<T> collection);\nbool Remove(T item);\nvoid RemoveRange(int\
  \ index, int count);\nvoid RemoveAt(int index);\nvoid Clear();\n```\n\n* *\n\n###\
  \ 示例 10-3 List 介绍\n\n* * *\n\n此示例演示了向 `List` 集合添加和删除名称的方法。在此情况下，列表用字符串类型定义。\n\n\
  ![Image](img/00223.jpeg)\n\n在向列表添加并删除项后，使用 `foreach` 循环显示集合项：\n\n`Al, Bob, Cal,\
  \ Dora, Ed,`\n\n`Bob, Cal, Ed,`\n\n![Image](img/00013.jpeg)\n\n* * *\n\n* *\n\n\
  ### 尝试此 10-2 List 集合练习\n\n* * *\n\n此练习提供了练习使用 `List` 集合和 `List` 方法的机会。\n\n**1**.\
  \ 编写一个具有整数列表的程序。\n\n**2**. 按照以下方式添加、显示、插入和删除 `List` 项，以精确生成以下输出：\n\n`Adding items:`\n\
  \n`1, 8`\n\n`*** Inserting one item:`\n\n`1, 2, 8`\n\n`*** Inserting range of items:`\n\
  \n`1, 2, 3, 4, 5, 6, 7, 8`\n\n`*** Removing range of two items:`\n\n`1, 4, 5, 6,\
  \ 7, 8`\n\n`*** Removing item by object:`\n\n`1, 4, 5, 6, 8`\n\n`*** Removing item\
  \ by index:`\n\n`4, 5, 6, 8`\n\n`The first item is 4`\n\n`*** Clearing all items:`\n\
  \n* *\n\n### 示例 10-4 具有多态性的 List\n\n\n\n\n\n此示例使用 `List` 集合来存储一组银行账户对象。由于 `List`\
  \ 类型是使用 `Account` 基类定义的，因此该列表实现了多态，因为它还可以管理在运行时添加或删除的任何该基类的派生类对象。在这种情况下，`Savings`\
  \ 和 `Checking` 对象被存储在用 `Account` 基类初始化的 `List` 集合中。\n\n![Image](img/00224.jpeg)\n\
  \n此示例的输出通过遍历列表并使用位置索引引用每个对象来显示：\n\n`This is a Checking object.`\n\n`This is a Savings\
  \ object.`\n\n此示例的对象是以 `Checking` 和 `Savings` 实例的形式进入列表的，但取出的对象类型是 `Account`。只要你通过\
  \ `Account` 类中定义的方法和属性访问列表中的对象，操作就是安全的。你可以将每个对象强制转换为它们所实现的的类，但列表及其用户只能看到 `Account`\
  \ 对象。\n\n![Image](img/00013.jpeg)\n\n### ArrayList 集合\n\n`ArrayList` 类在许多方面与 `List`\
  \ 类相似。然而，`ArrayList` 类可以存储多个无关数据类型的对象。要在代码中启用 `ArrayList` 类，你必须引用 `System.Collections`\
  \ 命名空间。`ArrayList` 类实现了 `IList` 接口以管理非泛型对象，因此集合中的对象可以是任何数据类型。`IList` 扩展了 `IEnumerable`\
  \ 接口，因此 `ArrayList` 也允许对对其对象进行迭代。\n\n由于任何类型的对象都可以放入 `ArrayList` 集合中，因此 `ArrayList`\
  \ 的定义中没有泛型类型：\n\n`ArrayList errands = new ArrayList();`\n\n### 确定对象类型\n\n由于 `ArrayList`\
  \ 集合可以存储任何类型，因此在从集合中检索项目时，你通常需要确定每个对象的数据格式。在确定格式时，所有的 `ArrayList` 集合项都可以存储为 `Object`\
  \ 类的对象。`Object` 类支持 C# 中的所有类。所有对象类型都有一个 `GetType()` 方法，用于返回对象的数据类型。当将特定的类类型作为参数传递时，此数据类型可以与\
  \ `typeof` 运算符的返回值进行比较。\n\n以下示例显示了对名为 `errands` 的 `ArrayList` 进行迭代。如果对象属于 `GroceryItem`\
  \ 类，则将其强制转换为 `GroceryItem` 类型的对象。然后可以使用 `GroceryItem` 对象访问其类的方法和属性。\n\n![Image](img/00225.jpeg)\n\
  \n#### ArrayList 方法\n\n与 `List` 集合一样，`ArrayList` 集合提供了许多相似的方法，能够方便地添加、插入和删除项目。`Add()`\
  \ 方法可以将任何类型的对象添加到 `ArrayList` 集合中，即使集合中也存在无关类型的对象：\n\n```\nvoid Add(object item);\n\
  ```\n\n`Insert()` 方法在指定的索引位置处添加任何类型的新对象：\n\n```\nvoid Insert(int index, object item);\n\
  ```\n\n`InsertRange()` 方法将实现 `ICollection` 接口的任何集合在指定的索引位置插入到 `ArrayList` 集合中。你可以使用\
  \ `InsertRange()` 将 `List` 集合或数组添加到 `ArrayList` 集合中：\n\n```\nvoid InsertRange(int\
  \ index, ICollection collection);\n```\n\n`Remove()` 方法通过值从 `ArrayList` 集合中删除任何项：\n\
  \n```\nbool Remove(object item);\n```\n\n`RemoveRange()` 可以从指定的索引位置开始从集合中删除指定数量的对象：\n\
  \n```\nvoid RemoveRange(int index, int count);\n```\n\n`RemoveAt()` 从 `ArrayList`\
  \ 集合的特定位置删除项：\n\n```\nvoid RemoveAt(int index);\n```\n\n`Clear()` 从 `ArrayList`\
  \ 集合中移除所有项：\n\n```\nvoid Clear();\n```\n\n### 示例 10-5 ArrayList 简介\n\n此示例演示了如何实现\
  \ `ArrayList` 集合来管理每日待办事项列表。该列表目前存储字符串数据和 `GroceryItem` 格式，但它可以存储任何数据类型的对象。\n\n\
  ![Image](img/00226.jpeg)\n\n输出中显示了两个版本的待办事项列表。第一个版本在添加所有项目后显示。第二个版本在集合中删除了两个项目后显示。显示输出的方法根据集合中每个项目的对象类型进行选择。`GroceryItem`\
  \ 对象的 `Description` 和 `Quantity` 属性通过对象的 `Display()` 方法写入控制台。当 `ArrayList` 项仅为字符串时，它直接写入控制台。\n\
  \n![Image](img/00227.jpeg)\n\n![Image](img/00013.jpeg)\n\n### KeyValuePair 类型\n\n\
  现在你已经了解了不同集合类型的灵活性，让我们检查 `KeyValuePair` 类型，它为大型集合提供了额外的搜索选项。`KeyValuePair` 类型是一个结构体，用于存储引用键和相应的值。\n\
  \n键和值的数据类型在 `KeyValuePair` 使用尖括号内的 `TKey` 和 `TValue` 类型参数初始化时定义。`KeyValuePair` 结构体的实际值作为参数传递给\
  \ `KeyValuePair` 构造函数：\n\n```\nKeyValuePair<TKey, TValue> kvp = new KeyValuePair<TKey,\
  \ TValue>(key, value);\n```\n\n一旦定义了 `KeyValuePair` 对象，你就可以通过 `Key` 属性引用键：\n\n`keyValuePair.Key`\n\
  \n你也可以通过 `Value` 属性引用值：\n\n`keyValuePair.Value`\n\n### 示例 10-6 KeyValuePair 简介\n\
  \n此示例显示了如何创建一个 `KeyValuePair` 项来引用希腊和罗马神话人物。该结构体包含了用于键的标识符和用于值的神话对象：\n\n![Image](img/0228.jpeg)\n\
  \n此示例并不实用，但它展示了如何创建并访问 `KeyValuePair` 结构体的属性：\n\n![Image](img/0229.jpeg)\n\n当你运行程序时，输出显示了\
  \ `KeyValuePair` 的 `Key` 和 `Value` 属性：\n\n![Image](img/0230.jpeg)\n\n![Image](img/00013.jpeg)\n\
  \n### Dictionary 集合\n\n本节介绍了利用 `KeyValuePair` 提供的增强搜索的 `Dictionary` 集合。`Dictionary`\
  \ 集合是类型安全的，支持 `KeyValuePair` 对象的存储、检索和删除。`Dictionary` 类位于 `System.Collections.Generic`\
  \ 命名空间。声明并初始化 `Dictionary` 对象时，参数 `TKey` 和 `TValue` 定义了键和值的数据类型：\n\n```\nDictionary<TKey,\
  \ TValue> dictionary = new Dictionary<TKey, TValue>();\n```\n\n这是一个管理驾驶证认证的对象定义，使用\
  \ `char` 类型作为键，`string` 类型作为值：\n\n```\nDictionary<char, string> certifications =\
  \ new Dictionary<char, string>();\n```\n\n#### Dictionary 方法\n\n`Dictionary` 集合提供了许多有用的方法，用于添加、更新和删除\
  \ `KeyValuePair` 项。`Add()` 方法向集合添加 `KeyValuePair` 项。第一个参数包含 `TKey` 类型的键，第二个参数包含\
  \ `TValue` 类型的值：\n\n```\nvoid Add(TKey key, TValue value);\n```\n\n`ContainsKey()`\
  \ 方法检查 `Dictionary` 集合以确定键是否存在，并根据搜索结果返回真或假尔值。`ContainsKey()` 方法使用搜索项的键作为参数：\n\n\
  ```\nbool ContainsKey(TKey key);\n```\n\n`TryGetValue()` 根据传递的键对 `Dictionary` 执行搜索。该方法返回真或假尔值，取决于搜索结果。如果找到了键，则关联的值将存储在第二个参数中：\n\
  \n```\nbool TryGetValue(TKey key, out TValue value);\n```\n\n\n\n\n\n`Remove()`\
  \ 方法删除 `Dictionary` 集合中的项：\n\n```cs\nbool Remove(TKey key);\n```\n\n`Clear()` 从\
  \ `Dictionary` 集合移除所有项：\n\n```cs\nvoid Clear();\n```\n\n### 遍历字典项\n\n在向字典中添加项后，你可以遍历\
  \ `KeyValuePair` 对象的集合。如果你有：\n\n```csharp\nDictionary<char, string> certifications\
  \ = new Dictionary<char, string>();\n```\n\n并且要添加如下项：\n\n```csharp\ncertifications.Add('P’,\
  \ “Passenger transport”);\n```\n\n你可以如下循环遍历所有的 `KeyValuePair` 对象：\n\n```csharp\n\
  foreach(KeyValuePair<char, string> cert in certifications) Console.WriteLine(“Key:\
  \ ” + cert.Key + “ Value: ” + cert.Value);\n```\n\n### 示例 10-7 字典简介\n\n此示例演示了存储驾驶执证书的\
  \ `Dictionary` 的创建和管理。许可证证书类型使用 `char` 类型的键进行引用。许可证值是一个描述许可证的 `string`。\n\n![Image](img/00231.jpeg)\n\
  \n输出如下：\n\n![Image](img/00232.jpeg)\n\n![Image](img/00013.jpeg)\n\n### Hashtable\
  \ 集合\n\n`Hashtable` 类与 `Dictionary` 类相似，但 `Hashtable` 集合可以管理不同类型的 `KeyValuePair`\
  \ 对象。因此，`Hashtable` 构造函数不需要为键或值声明数据类型：\n\n```cs\nHashtable hashTable = new Hashtable();\n\
  ```\n\n`Hashtable` 类位于 `System.Collections` 命名空间中。\n\n#### Hashtable 方法\n\n`Hashtable`\
  \ 类的 `Add()` 方法添加字典项，其中任何值和任何类型的键都可以添加到集合中：\n\n```cs\nvoid Add(object key, object\
  \ value);\n```\n\n`ContainsKey()` 方法通过键检查 `Hashtable` 对象是否存在：\n\n```cs\nbool ContainsKey(object\
  \ key);\n```\n\n`ContainsValue()` 方法通过特定值检查特定值的 `Hashtable` 对象是否存在：\n\n```cs\nbool\
  \ ContainsValue(object value);\n```\n\n`Remove()` 方法通过键删除集合中的对象：\n\n```cs\nvoid\
  \ Remove(object key);\n```\n\n`Clear()` 从 `Hashtable` 集合移除所有对象：\n\n```cs\nvoid Clear();\n\
  ```\n\n### 遍历 Hashtable 项\n\n在遍历 `Hashtable` 项时，可以使用 `DictionaryEntry` 结构体来隔离集合中的每个项。然后可以使用\
  \ `GetType()` 方法来确定 `Key` 和 `Value` 属性的数据类型。一旦确定了 `Dictionary` 对象类型，就可以通过强制转换将转换为所需的格式：\n\
  \n![Image](img/00233.jpeg)\n\n### 示例 10-8 Hashtable 简介\n\n此示例练习了使用 `Hashtable` 类来存储和管理字母和数字成绩：\n\
