  \ 的二进制文件，并将数据存储其中，然后读取文件内容，将其转换回可用的格式并显示在控制台中：\n\n```\nTrue\nA\n1.1\n2.2\n3.3\n\
  4\nHello\n```\n\n此示例在源文件相同的目录下创建 `MyBinaryFile.dat`。如果你使用记事本打开文件，你会发现内容是不可读的二进制格式。\n\
  \n* *\n\n* *\n\n### 尝试 19-2 写入和读取二进制数据\n\n为了确保二进制写入读取技术确实有效，请尝试此练习。\n\n**1**. 从示例\
  \ 19-3 开始，修改代码以二进制格式写入名字“James”和姓“Bond”以及编号 7。\n\n**2**. 调整代码读取这些内容并显示在控制窗口中。\n\n\
  * * *\n\n### 读取缓冲二进制数据\n\n当你需要从网络或大文件检索大量数据时，可能会导致运行应用程序的系统内存过载。为了高效读取大量数据，你可以分块检索这些数据。每当检索一个块时，它都会被加载到缓冲区中存储。`FileStream`\
  \ 类的 `Read()` 方法将原始数据加载到缓冲区：\n\n```\nint Read(byte[] buffer, int bufferOffset, int\
  \ totalBytesToRetrieve);\n```\n\n将文件分块进行缓冲时，你可以确定文件大小，这可以通过 `FileStream` 对象的 `Length`\
  \ 属性轻松获取：\n\n```\nint fileStream.Length;\n```\n\n考虑到这些结构，一个迭代读取 4 字节块缓冲数据的例程可能如下：\n\
  \n![image](img/00420.jpeg)\n\n![image](img/00421.jpeg)\n\n* * *\n\n## 示例 19-4 从缓冲区读取二进制数据\n\
  \n* * *\n\n此示例展示了从缓冲区读取数据的完整应用程序。为了启用此示例，将创建一个包含整数的二进制文件。该二进制文件的段被读取到字节数组中，然后由应用程序转换为整数并显示在控制窗口中：\n\
  \n![image](img/00422.jpeg)\n\n![image](img/00423.jpeg)\n\n当你运行程序时，在文件被读取并转换回整数格式后，你可以在控制台中看到内容：\n\
  \n```\n1, 2, 3, 4, 5, 6, 7, 2, 1,\n```\n\n\n\n\n\n# 二进制访问\n\n有时你只想读取二进制文件的部分内容，特别是当文件很大时。你可以通过\
  \ `FileStream` 类的 `Seek()` 方法访问文件中所需的所需的起始位置，该方法会移动文件指针的位置。`Seek()` 接收两个参数。第一个 `Seek()`\
  \ 参数设置文件指针的字节偏移量（offset）。第二个 `Seek()` 参数接收一个 `SeekOrigin` 枚举值作为参数。`SeekOrigin` 枚举用于在根据偏移量进行调整之前设置文件指针的初始起始点。`SeekOrigin`\
  \ 的枚举值范围包括从 `SeekOrigin.Begin`（从从开始偏移量处开始读取）到 `SeekOrigin.Current`（从当前文件位置偏移量处开始读取），再到\
  \ `SeekOrigin.End`（从文件末尾负偏移量处开始读取）。你用于随机访问文件中某部分的代码可能如下所示：\n\n![image](img/00424.jpeg)\n\
