  \ `mfg` 值打印到控制台窗口。\n\n## 第 16 章\n\n## LINQ to Entities：基于方法的语法\n\n### 核心技能与概念\n\n\
  ![Image](img/00002.jpeg) Lambda 语法\n\n![Image](img/00002.jpeg) 读取查询\n\n![Image](img/00002.jpeg)\
  \ 插入、更新和删除对象\n\n本章介绍了如何使用基于方法的语法，通过 Entity Framework 执行 LINQ 命令以进行数据库管理。这种语法通过扩展方法启用。扩展方法的方法为编写\
  \ LINQ 命令提供了一种替代方案，而不是使用查询语法（查询语法在 第 15 章 中介绍过）。\n\n### 引用 FoodStore 数据库\n\n与 第\
  \ 15 章 一样，为了构建本章中的任何代码示例，请从创建一个引用 `FoodStore` 数据库且具有实体数据模型的新控制台应用程序开始。然后，将 `Main()`\
  \ 方法内部的代码替换为与当前示例相关的代码。有关如何设置项目的参考，请参阅 第 14 章，“示例 14-1：向你的项目添加 ADO.NET 实体数据模型”。请记住，如果你在使用\
  \ `.mdf` 数据库文件，除非 `FoodStore.mdf` 文件的“复制到目录”属性设置为“如果较新”，否则对数据的更改（包括添加、更新和删除）将不会保存到数据库。\n\
  \n此外，为了确保代码运行正常，独立于代码检查数据是一个良好的习惯。要这样做，请参阅 第 13 章，“示例 13-3：使用 Visual Studio 浏览数据库内容”。还要记住，如果你将数据库文件作为数据源，请连接到应用程序复制到\
  \ bin 文件夹的数据库文件，以检查项目使用的相同数据。\n\n### Lambda 语法\n\n基于方法的语法通过 `System.Linq` 命名空间提供的扩展方法启用。这些扩展方法接收匿名函数作为参数。正如\
  \ 第 11 章 所示，匿名函数体使用 Lambda 语法定义输入参数和操作。图 16-1 显示了一个使用扩展方法定义的 LINQ 命令示例。Lambda 运算符\
  \ `=>` 意味着“通过”。Lambda 语句的输入参数在 Lambda 运算符的左侧，表达式在右侧。参数和表达式共同定义了匿名函数。\n\n![image](img/00331.jpeg)\n\
  \n**图 16-1** Lambda 语法\n\n图 16-1 中 Lambda 语句的输入参数类型是推断的。换句话说，编译器可以确定 Lambda 表达式中的参数数据类型。对于图\
  \ 16-1，输入参数是一个 `Product` 对象。编译器知道参数是 `Product` 对象，是因为 `Where()` 扩展方法正在操作 `Products`\
  \ `DbSet`。\n\n### 读取查询\n\n在讨论如何使用扩展方法之前，让我们查看 `Select()` 方法，因为它是查询数据库最基础的方法之一。`Select()`\
  \ 方法方法可定义 LINQ 查询返回的数据集的列。\n\n**示例 16-1** 使用 `Select()` 方法定义查询列\n\n此示例实现了 `Select()`\
  \ 以从 `Products` 实体中检索 `name` 和 `vendor` 值。与本章中的所有示例一样，为了使用新的控制台应用程序构建此示例，请添加引用 `FoodStore`\
  \ 数据库中所有表的实体数据模型（EDM）。然后将此代码放在 `Main()` 方法中。\n\n![image](img/00332.jpeg)\n\n运行此程序时，将从\
  \ `Product` 表的每一行获取 `name` 和 `vendor` 值：\n\n`Cake Mix - Sysco`\n`Cookie Dough -\
  \ Sysco`\n\n`Orange Juice - GFS`\n\n`Cookie Dough - GFS`\n\n`Carrots - GFS`\n\n\
  作为对比，值得注意的是，你可以将之前的基于方法的查询替换为以下查询语法以达到相同的结果：\n\n#### 过滤\n\n`Where()` 扩展方法允许你通过返回真或假值的表达式来限制或过滤查询行。`Where()`\
  \ 方法通常放在 `Select()` 方法之前。\n\n**示例 16-2** 应用 Where 过滤器\n\n此示例中的 `Where()` 方法使用 Lambda\
  \ 表达式检索价格在 $1.00 到 $1.99 之间的所有产品：\n\n![image](img/00334.jpeg)\n\n运行程序时显示的数据在 `Where()`\
  \ 方法设置的价格范围内：\n\n`1.25`\n`1.45`\n`19`\n`1.01`\n\n### 尝试 16-1 基础扩展方法\n\n此练习让你练习编写基于方法的语法。\n\
  \n1. 创建引用 `FoodStore` 数据库的控制台应用程序。\n2. 使用 `Select()` 和 `Where()` 扩展方法，创建一个程序，从 `FoodStore`\
  \ 数据库的 `Store` 表选择并显示位于 BC 地区商店的 `branch`、`region` 和 `building_name` 列值。\n3. 使用服务器资源管理器/数据库资源管理器浏览\
  \ `FoodStore` 数据库中 `Store` 表的数据，以检查程序输出显示的结果（参见 第 13 章）。\n\n#### 使用值集合过滤\n\n来自 `System.Linq`\
  \ 命名空间的 `Contains()` 方法允许针对预定义的数组和项目列表进行过滤。集合和数组类型都暴露了 `Contains()` 方法。`Contains()`\
  \ 方法可以放在 `Where()` 方法内部。`Where()` 方法接收匿名函数。\n\n**示例 16-3** 使用集合过滤\n\n此示例使用 `Contains()`\
  \ 方法选择西雅哥或温哥华分支的所有发票号码。在这种情况下，`Where()` 方法接收一个推断 `Invoice` 对象作为输入参数的匿名函数，并在表达式中使用布尔\
  \ `Contains()` 方法。\n\n![image](img/00336.jpeg)\n\n运行程序时，显示的发票数据局限于温哥华和西雅哥分支：\n\n\
  `1001 Vancouver`\n`1002 Vancouver`\n`1005 Seattle`\n\n\n\n\n\n在搜索时，可能希望将查询结果限制为列值的某个部分字符集。例如，你可能想找到一个以“V”或可能的“Van”开头的姓氏。扩展方法对于字符串比较非常强大，因为可以使用许多其他\
  \ C# 方法来解析和隔离搜索结果。作为建议，第 6 章中介绍的 `StartsWith()`、`IndexOf()` 和 `IsMatch()` 方法对于在\
  \ `Where()` 扩展方法内部过滤查询结果非常有帮助。如果需要，可以使用 `ToUpper()` 和 `ToLower()` 方法来管理大小写敏感。\n\n\
  * * *\n* *\n\n#### 示例 16-4 使用字符串比较方法进行过滤\n\n* * *\n\n此示例演示了如何实现查询，以检索以“C”开头或包含“Juice”单词的品名称。在此示例中，使用\
  \ `StartsWith()` 方法检查字符串的第一个元素，并使用 `Contains()` 方法来搜索字符串中任何位置是否存在特定模式。\n\n![image](img/00337.jpeg)\n\
