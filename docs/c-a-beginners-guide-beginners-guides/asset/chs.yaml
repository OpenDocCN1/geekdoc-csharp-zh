  Balance: $26,020,870.00\n```\n![Image](img/00013.jpeg)\n\n## 命名空间 (Namespaces)\n\
  \n命名空间是类的逻辑分组。命名分组也被*代码库*。按照惯例，当你创建自己的命名空间时，命名空间的所有类都存储在项目的命名空间文件夹中。每个文件与类同名，文件夹与命名空间同名。当在类文件的顶部包含\
  \ `using` 指令时，命名空间的所有公共类都可以被引用。\n\n命名空间防止冲突（也称为*命名空间冲突*），冲突发生在不同库的类具有相同名称的情况下。\n\
