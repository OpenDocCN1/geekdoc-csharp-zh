  \n* * *\n\n### 方法重载 (Method Overloads)\n\n方法重载允许你创建相同的方法，只要每个方法具有独特的参数类型组合。当这些方法执行相似的例程时，重载可以让你的代码对阅读者更加友好。\n\
  \n* * *\n\n* * *\n示例 4-2 方法重载\n\n\n\n\n\n此示例展示了如何通过两个名为 `DisplayContact()` 的方法应用方法重载。`DisplayContact()`\
  \ 的两个版本都会显示地址信息。根据是否提供了传真机号码，调用不同版本的 `DisplayContact()` 方法。为了避免代码重复，接收传真号码的重载方法会调用另一个\
  \ `DisplayContact()` 重载方法来执行例的初始部分：\n\n![Image](img/00072.jpeg)\n\n运行程序时，将以专业的格式显示带有传真号码和不带传真号码的组织信息：\n\
  \n`Banana Republic Women 735 State Street Santa Barbara, CA 93101 Legal Aid Society\
  \ 1223 West Sixth Street Cleveland, OH 44113 fax: 216-586-3220`\n\n![Image](img/00013.jpeg)\n\
  \n## 按值和按引用传递参数\n\n参数可以通过两种方式传递给方法：按值传递或按引用传递。当按值传递参数时，方法内部对参数的更改对调用指令中的原始值没有影响。当按引用传递参数时，方法内部对参数的更改也会影响调用指令中的原始值。\n\
  \n#### 按值传递参数\n\n当参数按值传递给方法时，会创建变量的副本。方法内部对变量副本的更改不会影响方法外的原始变量值。在第 2 章中，我们讨论了不同数据类型如何分类为值类型或引用类型。默认情况下，声明为值类型格式的参数也是按值传递给方法的。换句话说，float、integer\
  \ 和 decimal 类型参数的原始值不会因为方法的改变而改变。\n\n#### 按引用传递参数\n\n按引用将参数传递给方法时，会将数据值的起始地址传递给方法。方法内部对该对象所引用的值进行的任何更改也会应用到方法外部的对象值上。数组或类实例等具有复杂数据类型的变量是按引用传递的。\n\
  \n***注意***\n\n字符串格式是在按值或按引用传递时需要考虑的特殊情况。字符串是引用类型，通过按引用传递给方法。然而，字符串是*不可变*的，这意味着它不能被更改。方法内部对字符串的任何赋值或修改实际上都会创建一个新字符串，并传回给调用指令。换句话说，字符串是引用类型且按引用传递，但其默认行为看起来就像字符串是按值传递给方法。\n\
  \n**示例 4-3** 按值传递与按引用传递\n\n此示例展示了按值或按引用传递时参数值受影响情况的对比。在此示例中，声明了一个价格数组。数组的单个元素按值传递给\
  \ `AddTax()` 方法。在 `AddTax()` 内部对副本进行的更改不会影响执行调用处的数组值。当数组按引用传递给 `Inflate()` 方法时，方法内部的通胀调整会影响调用指令中的原始数组。\n\
  \n![Image](img/00073.jpeg)\n\n此示例的后续输出显示了 `AddTax()` 方法如何影响数组值，因为单个数组元素是按值传递给它的。然而，`Inflate()`\
  \ 方法影响了原始数组值，因为数组是按引用传递的。\n\n`Value in calling method: $9.99`\n`After tax: $10.69`\n\
  `Value in calling method: $9.99`\n`After inflation: $10.09`\n`Value in calling method:\
  \ $10.09`\n\n![Image](img/00013.jpeg)\n\n### 显式按引用传递参数\n\n可以显式地将内置的 C# 类型按引用传递给方法。如果你需要在方法中一次修改多个变量，则可能需要这样做。\n\
  \n在每个显式按引用传递的参数之前也需要一个 `ref` 关键字：\n\n`AdjustForInflation(ref house, ref salary);`\n\
  \n**示例 4-4** 显式按引用传递参数\n\n此示例展示了如何显式地按引用传递两个参数，以便它们都能通过通胀增长进行更新：\n\n![Image](img/00074.jpeg)\n\
  \n显示的结果证实了，当显式按引用接收时，原始参数在方法内部经过了通胀处理：\n\n![Image](img/00075.jpeg)\n![Image](img/00013.jpeg)\n\
  \n### 按引用传递未初始化的变量\n\n通常，每当你按值或按引用传递参数时，它必须已经初始化。然而，当参数声明中包含 `out` 关键字时，可以将未初始化的变量按引用传递给方法：使用\
  \ `out` 关键字时也可以传递已初始化的变量。带有变量引用的方法可以初始化该变量或覆盖它。这里有一个包含 `out` 关键字的示例方法头：\n\n`static\
  \ void GetAccrualRate(out double interest, double years);`\n\n像之前定义的这种将变量传递给方法的指令也用\
  \ `out` 关键字标记了该变量：\n\n`GetAccrualRate(out accrualRate, TOTAL_YEARS);`\n\n**示例 4-5**\
  \ 按引用传递未初始化的变量\n\n这是一个完整示例，展示了变量 `accrualRate` 的声明，然后将其未初始的状态传递给方法：\n\n![Image](img/00076.jpeg)\n\
  \n`GetAccrualRate()` 方法的输出显示如下：\n\n`Accrual rate: 1.276281625`\n\n![Image](img/00013.jpeg)\n\
  \n### 作用域\n\n变量或对象的作用域描述了可以访问它们的代码区域。作用域通常被称为可见性，因为程序只在变量处于作用范围内识别它们。\n\n#### 类作用域\n\
  \n类作用域定义了在类级别声明的变量和对象的访问权限。这些变量和对象可以在类中的任何地方进行编辑或读取。如果类中的多个方法必须引用该项，则类级声明是非常方便的。然而，类作用域比局部作用域更容易出错，因为只要实例存在，类级项就可以在任何地方被修改。\n\
  \n#### 方法作用域\n\n在方法内部声明的变量和对象仅在方法内部可以编辑和读取。方法级的变量对象识别被称为方法作用域。在方法内部声明的变量或对象的寿命比类级变量和对象的寿命短得多。方法级项从它们在方法中定义开始一直到方法退出。每再次调用方法时，方法中的局部变量必须重新初始化。换句话说，局部变量对象在每次访问方法时诞生，并在方法退出时消失。\n\
  \n#### 块作用域\n\n块作用域是方法作用域更精细的作用域。块作用域是指在条件结构或循环内部声明的变量或对象的访问权限。我们将在第 5 章](#part0013.html_ch5)中讨论这些结构。在代码块内部声明的变量或对象在定义它的块之外是无法识别的。将变量或对象的生存限制在代码块内可以防止在方法其他地方被意外篡改，从而增强算法的健壮性。块作用域也让你的代码更易读，因为变量或对象是在它们被使用的地方声明的。\n\
  \n\n\n\n理想情况下，读取或编辑的可用范围应该尽可能局部化，以防止可能导致错误的非预期更改。局部化还将使你的代码更具可读性，因为变量在它们使用的区域内进行声明和使用。\n\
  \n#### 变量优先级\n\n你可以在方法内部声明一个与类级别变量同名同类型的变量。局部变量始终具有更高优先级。因此，每当你引用既存在于本地又存在于类级别的变量名时，使用的都是局部变量。\n\
  \n### 示例 4-6 作用域与优先级\n\n此示例展示了更局部的作用域如何优于类级别作用域。当从方法打印数据时，如果变量同时在类级别和方法级别声明，则输出方法级变量的值。当从代码块中打印数据时，如果变量在类级别和块级别声明，则打印块级别的值。当在只有类级别变量可访问的情况下进行数据打印时，则只会输出类级别变量的值。\n\
  \n![Image](img/00077.jpeg)\n\n输出显示，作用域最局部变量总是会被打印：\n\n![Image](img/00078.jpeg)\n\
