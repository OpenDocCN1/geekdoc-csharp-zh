  \ conditions not present.`\n\n![Image](img/00013.jpeg)\n\n## Switch 语句\n\n`switch`\
  \ 是另一种条件结构，它提供一组 `case` 值，以确定执行哪个代码块。`switch` 结构以一个头部开始，其中传入了一个参数。然后，该参数值将与 `switch`\
  \ 内部相同数据类型的 `case` 值进行顺序比较。如果 `case` 值与 `switch` 部的参数值匹配，程序将进入该代码块。当遇到 `break` 语句时，程序退出\
  \ `switch` 结构。你还可以在 `switch` 结构的末尾包含一个 `default` 条件，以便在没有其他 case 匹配时选择指令。\n\n以下示例显示了带有\
  \ `tornadoRating` 参数的 `switch` 头部。该参数值与列表中的 `case` 值进行匹配。对于此示例，只有一个 `case`，其值为 `F1`。当没有其他\
  \ case 匹配参数时，将选择 `default` `case`。\n\n![image](img/00091.jpeg)\n\n## 示例 5-4 Switch\
  \ 语句\n\n这个完整示例使用简单的 `switch` 来分配并显示有关龙卷风的统计数据。注意 `case` 是缩进的，每个 `case` 的代码也同样缩进。每个\
  \ `case` 的代码都以 `break` 语句结束。\n\n![image](img/00092.jpeg)\n\n在观察输出时，你可以发现 F5 级龙卷风选择了默认选项，因为该选项没有统计数据：\n\
  \n`* Statistics for F2 tornado*`\n\n`Minimum wind speed: 112`\n\n`* Statistics for\
  \ F5 tornado*`\n\n`Information not available.`\n\n![Image](img/00013.jpeg)\n\n###\
  \ 循环\n\n如前所述，循环是在条件保持为真时重复执行代码块的结构。循环极快地执行数千甚至数百万条指令的能力，为处理数据、创建动画以及执行需要自动化的重复任务提供了强大的灵活性。本章介绍了四种最常见的\
  \ C# 循环：\n\n![Image](img/00002.jpeg) `for` 循环\n\n![Image](img/00002.jpeg) `while`\
  \ 循环\n\n![Image](img/00002.jpeg) `do while` 循环\n\n![Image](img/00002.jpeg) `foreach`\
  \ 循环\n\n#### For 循环\n\n`for` 循环是常见的循环类型之一。这些循环以一个`header` 开始，该头部包含三条指令：\n\n![Image](img/00002.jpeg)\
  \ 第一条指令设置计数器的初始值。为了将计数器的范围限制在循环内，计数器通常在头部的第一条指令中进行声明和初始化。第一条指令仅在程序进入循环时执行一次。\n\n\
  ![Image](img/00002.jpeg) 循环头部的第二条指令是一个条件表达式，会在循环的每次迭代中进行求值——如果为真，则执行循环代码块中的指令。\n\
  \n![Image](img/00002.jpeg) `for` 循环的第三条指令修改计数器变量，通常是递增或递减。从第二次循环迭代开始，第三条指令在评估条件表达式之前执行，以决定是否再次执行代码块。\n\
  \n**提示**\n\n通常，`for` 循环中的计数器被命名为 `i`，代表 index（索引）。这种做法起初看起来可能与始终使用描述性变量名的习惯相矛盾。然而，变量名\
  \ `i` 是一个被广泛接受的简写。如果嵌套循环也使用计数器，它们通常被分配字母表中的连续字母作为名称，例如 `j` 和 `k`。\n\n由 `for` 循环执行的代码嵌套在大括号和右括号之间，并左对齐：\n\
  \n![image](img/00093.jpeg)\n\n## 示例 5-5 For 循环\n\n此示例展示了如何使用 `for` 循环遍历数组的所有元素并将它们打印到控制台：\n\
  \n![image](img/00094.jpeg)\n\n运行程序时，会获取并打印数组元素，并将计数器作为数组引用：\n\n`Element[0] = a`\n\
  \n`Element[1] = b`\n\n`Element[2] = c`\n\n`Element[3] = d`\n\n![Image](img/00013.jpeg)\n\
