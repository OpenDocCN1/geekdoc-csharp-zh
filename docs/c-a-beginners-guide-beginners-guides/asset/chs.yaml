  #### 条件（三元）运算符\n\n条件运算符可以根据简单条件表达式的结果返回不同的值。条件运算符有时被称为三元运算符。三元运算符提供了 if-else 块的简写替代方案。实现条件运算符时，在条件表达式为真的赋值值之前放置一个问号\
  \ `?`。该赋值语句后面跟着一个冒号 `:`，以及用于条件表达式为假时的赋值值。在以下用中，当 `windSpeed` 超过最小值时，`message` 被赋值为“Wind\
  \ Alert!”；否则，`message` 被赋值为“Safe!”：\n\n```csharp\n// 如果风速大于最小值，赋值“Wind Alert!”。否则\n\
  // 赋值“Safe!”.\nstring message = windSpeed >= TORNADO_MIN ? “Wind Alert!” : “Safe!”\n\
  ```\n\n***CAUTION   ***\n\n\n\n\n\n条件运算符提供了方便的简写语法。然而，这种紧凑的格式在调试时有时难以阅读和追踪。如果你在调试条件运算符时遇到困难，可以尝试拆分指令并使用\
  \ `if-else` 语句来实现相同的结果。\n\n## 示例 5-3 条件（三元）运算符\n\n此示例展示了条件运算符的完整实现，用于在风速大于或等于每小时\
