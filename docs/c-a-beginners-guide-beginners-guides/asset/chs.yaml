  \n## 第 3 章\n\n## 数值运算符与程序\n\n### 关键技能与概念\n\n![Image](img/00002.jpeg) 基础计算\n![Image](img/00002.jpeg)\
  \ 递增运算符\n![Image](img/00002.jpeg) 递减运算符\n![Image](img/00002.jpeg) 递减运算符\n\n本章简介绍了简单的运算符和方法。虽然数值运算符看起来微不足道，但理解这些主题对于编程逻辑至关重要。\n\
  \n### 基础计算\n\n让我们首先检查大多数计算中遇到的运算符和方法。\n\n#### 加法\n加法使用 `+` 运算符。如你所期的，加法通过将两个操作数放在\
  \ `+` 运算符两侧来执行。此外，复合运算符 `+=` 将左侧变量重新赋值为其初始值加上右操作数。\n\n![Image](img/00047.jpeg)\n\
  \n#### 减法\n减法需要 `–` 运算符。显然，在等式中，你可以从 `–` 运算符左侧的操作数减去右侧的操作数。赋值运算符 `-=` 将变量重新赋值为其原始值减去右操作数。\n\
  \n![Image](img/00048.jpeg)\n\n#### 乘法\n乘法运算符用 `*` 表示。你可以通过将每个数字放在 `*` 运算符两侧来计算两个数的乘积。赋值运算符\
  \ `*=` 将左侧变量重新赋值为其值乘以右操作数。\n\n![Image](img/00049.jpeg)\n\n#### 除法\n除法运算符为 `/`。除法通过将分子放在\
  \ `/` 的左侧、将分母放在右侧来执行。`/=` 组合将左侧变量重新赋值为其值除以右操作数。\n\n![Image](img/00050.jpeg)\n\n\
  #### 余数\n模运算运算符 `%` 用于计算除法过程中的余数。也可以使用复合 `%=` 实现自赋值。\n\n![Image](img/00051.jpeg)\n\
  \n#### 幂\n.NET Framework 的 `System` 命名空间提供了 `Math` 类，它提供了高级计算的方法。为了自动化幂运算，`Math`\
  \ 类提供了一个 `Pow()` 方法，接收基值和指数作为参数。`Pow()` 方法将结果作为 `double` 类型返回。此示例展示了如何使用 `Pow()`\
  \ 计算 3 的次方：\n\n```csharp\ndouble result = Math.Pow(3, 2); // 9\n```\n\n#### 平方根\n\
  `Math` 类提供了 `Sqrt()` 方法计算平方根。\n\n![Image](img/00052.jpeg)\n\n### 递增运算符\n\n递增运算符\
  \ `++` 将数值类型变量加 1。运算符放在变量之前还是之后决定了变量何时更新。理解此运算符的工作原理对于成为熟练程序员至关重要，因为它是大多数主流编程语言的基础特性。我们在第\
  \ 5 章讨论 *for* 循环时，递增运算符的重要性将显而易见。\n\n#### 前递增表达式\n\n将 `++` 运算符放在数值变量之前创建一个递增表达式。前递增表达式在指令执行时会立即将变量值加\
  \ 1：\n\n```csharp\nint number = 5;\nConsole.WriteLine(++number); // 显示 6\n```\n\n\
  \n\n\n将 `++` 运算符放在数值变量之后，会创建一个后自增表达式。后自增表达式会在在该指令执行后的下一行将变量的值加 1：\n\n![Image](img/00053.jpeg)\n\
  \n### 尝试此 3-1 运算符练习\n\n此练习提供了一个观察运算符 `+`、`+=` 和 `++`（包括前自增和后自增表达式）之间差异的机会。\n\n1.\
  \ 在一个新的控制台应用程序中声明一个整数变量并将其初始化为值 `7`。\n2. 结合 `+`、`+=` 以及 `++` 前置/后自增运算符，编写四条指令来使变量值增加\
  \ `1`。每条指令增加变量的方式必须与程序中的所有其他指令都是独一无的。\n3. 设计你的程序，使生成的输出如下所示：\n`Original value: 7`\n\
  `Incremented value: 8`\n`Incremented value: 9`\n`Value during post-increment: 10`\n\
  `Incremented value: 11`\n\n![Image](img/00023.jpeg)\n\n### 递减运算符\n\n递减运算符 `--` 将变量值减小\
  \ `1`。与自增运算符类似，递减运算符放在变量之前或之后决定了变量何时实际被递减。\n\n#### 前递减表达式\n\n当递减运算符放在数值变量之前时，值会立即减少\
  \ `1`：\n\n```\nint number = 5;\nConsole.WriteLine(--number); // 显示 4\n```\n\n####\
  \ 后递减表达式\n\n当递减运算符放在数值变量之后时，值会在后递减指令的下一行进行递减：\n\n```csharp\nint number = 5;\nConsole.WriteLine(number--);\
  \ // 显示 5\nConsole.WriteLine(number); // 显示 4\n```\n\n在进行加、减、乘、除的同时重新赋值变量值时，始终使用复合赋值、前/后自增表达式或前/后递减表达式。与编写长手写形式相比，编写\
  \ `+=`、`-=`、`*=`、`/=`、`++` 或 `--` 更容易编写。使用复合赋值的表达式效率更高，因为被重新赋值的变量只需要评估一次。任何阅读你的代码并看到如\
  \ `x = x + 1` 这类长表达式的经验人士都可能将其解释为缺乏经验的标志。\n\n### 随机化\n\n你有时需要生成随机数。随机数生成用于实现安全程序、随机化游戏以及为对象创建唯一标识符。执行随机化的简单方法之一是使用来自\
  \ `System` 命名空间的 `Random` 类。\n\n#### 默认 Random 构造函数\n\n默认的 `Random` 构造函数根据系统时钟生成数字。通过\
  \ `Random` 类的新实例创建一个随机变量。由于随机变量是用系统时钟实例化的，快速创建多个 `Random` 对象可能会产生不随机的重复数字序列。然而，如果使用一个\
  \ `Random` 对象实例在时间推移过程中创建许多随机数，则使用默认的 `Random` 构造函数是可以接受的。\n\n##### 生成随机数\n\n`Random`\
  \ 类存在三种方法可以生成随机整数：\n\n1. 不带参数的 `Next()` 方法生成一个大于或等于 `0` 且小于 `2,147,483,647` 的整数：\n\
