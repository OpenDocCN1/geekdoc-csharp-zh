  \ Dough”出现了两次。\n\n\n\n\n`ObjectQuery` 实例提供了聚合扩展方法，用于为您的查询计算摘要信息。常用的聚合方法包括 `Count()`、`Sum()`、`Max()`、`Min()`\
  \ 和 `Average()`。\n\n## 示例 15-12 简单摘要\n\n此示例展示了聚合扩展方法如何为查询提供摘要数据的简化视图：\n\n![image](img/00323.jpeg)\n\
  \n如预期的，运行代码时会显示关于所有 `Product` 价格的摘要详情：\n\n![image](img/00324.jpeg)\n\n> **注意**：由于摘要信息是在执行聚合时生成的，因此聚合查询只能检索摘要列和指定的分组列。\n\
  \n## 分组摘要\n\n通常情况下，你可能希望对分组数据进行摘要。例如，你可能想显示每个供应商的销售商品数量，或者显示每个地区的商店总数。当使用 LINQ 执行聚合时，唯一标识每个组行的列被称为\
  \ `key`（键）。为了启用分组，检索到的列值被存储在一个临时聚合表中。然后就可以对关联表的每行执行摘要。\n\n在分组时，大多数聚合扩展方法使用 lambda\
  \ 表达式作为参数来识别其要汇总的列。这些聚合方法将在 第 16 章 中进行详细解释。\n\n## 示例 15-13 分组摘要\n\n此示例展示了如何生成查询以检索所有在\
  \ `Product` 表中列出项目超过一个的制造商。为了查看这种安排方式，你会注意到在此示例中，分组列在别名之前指定了 `group` 关键字，在实际列引用之前指定了\
  \ `by` 关键字。在同一个子句中，`into` 关键字指定了一个用于存储摘要查询的对象。`group`-`by`-`into` 子句位于 `where` 子句和\
  \ `from` 子句之间。另外请注意在 `select` 子句中，通过引用 `summary` 对象的 `Key` 属性选取了 `group` 列。分组摘要也从\
  \ `select` 子句中的聚合对象进行赋值。\n\n![image](img/00325.jpeg)\n\n对于我们的示例，结果显示只有 Duncan Hines\
  \ 这样一个制造商在 `Product` 表中列出了一个以上的项目：\n\n`Duncan Hines: 2`\n\n## 添加对象\n\n在使用实体数据模型（Entity\
  \ Data Model）时，如果你向数据库表插入一行数据，你实际上是在向集合添加一个对象。每个实体的 `DbSet` 集合提供了一个 `Add()` 方法来将对象插入表中。使用\
  \ LINQ to Entities 向表插入数据后，必须调用 `DbContext` 类的 `SaveChanges()` 方法将数据提交到数据库。\n\n\
  ## 示例 15-14 添加对象\n\n示例中的代码声明并初始化了一个 `Product` 对象来存储有关薯条的信息。在初始化 `Product` 对象后，`Products`\
  \ `DbSet` 的 `Add()` 方法将数据插入数据库。然后，通过 `SaveChanges()` 方法将数据提交到数据库。数据库只允许具有唯一 `productID`\
  \ 值的 `Product` 对象，因此当尝试插入具有重复 `productID` 的对象时，try-catch 块可以防止程序崩溃。\n\n![image](img/00326.jpeg)\n\
  \n当运行运行程序时，新的 `Product` 对象被插入到数据库表中。在查询数据库时，“French Fries”现在出现在列表中：\n\n`ID: 1 -\
  \ Cake Mix`\n`ID: 2 - Cookie Dough`\n`ID: 3 - Orange Juice`\n`ID: 4 - Cookie Dough`\n\
  `ID: 5 - Carrots`\n`ID: 6 - French Fries`\n\n## 更新对象\n\n当使用 Entity Framework 更新数据行中的某个值时，你实际上是在更新对象的属性，因为实体的每一行都是该实体的一个对象。在修改实体实例的属性后，可以调用\
  \ `SaveChanges()` 将更改提交到数据库。\n\n## 示例 15-15 更新对象\n\n以下代码显示了如何更新薯条的价格。首先获取对象，如果找到了该对象，则调整\
  \ `price` 属性，并通过调用 `SaveChanges()` 保存更改。在运行程序之前，如果你通过服务器资源管理器（Server Explorer/Database\
  \ Explorer）浏览数据，你会发现更新前的价格为 $3.33。\n\n![image](img/00327.jpeg)\n\n更新后，价格变为 $4.88：\n\
  \n`Cake Mix $2.99`\n`Cookie Dough $1.25`\n`Orange Juice $4.25`\n`Cookie Dough $1.45`\n\
  `Carrots $1.01`\n`French Fries $4.88`\n\n## 删除对象\n\n当使用 LINQ to Entities 删除数据行时，你实际上是从实体中删除一个对象。每个\
  \ `DbSet` 都有一个 `Remove()` 方法用于从其集合中删除对象。要将删除提交到数据库，必须使用 `DbContext` 对象调用 `SaveChanges()`。\n\
