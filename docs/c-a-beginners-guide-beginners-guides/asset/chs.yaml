  \n## 第 12 章\n\n## 接口\n\n### 关键技能与概念\n\n![Image](img/00002.jpeg)   接口语法\n\n![Image](img/00002.jpeg)\
  \   接口层级\n\n![Image](img/00002.jpeg)   泛接口\n\n![Image](img/00002.jpeg)   现有的 .NET\
  \ 接口\n\n* * *\n\n接口声明了必须在类或结构体中实现的公共数据成员和方法。接口类似于抽象类，因为接口也不允许基类实现。那么，为什么要费力创建一个接口来强制执行公共成员的实现呢？类可以实现多个接口，但只能继承自一个基类。当然，接口也有助于实施良好的面向对象设计。理解接口还将帮助你理解\
  \ C# 中非常重要的数据结构，如集合和 LINQ。你可能还需要在自己的项目中使用接口来强制一系列类具有一致的访问权限。\n\n### 接口语法\n\n接口的声明默认是内部的，但接口可以显式地声明为公有。接口成员不能声明访问修饰符，因为接口成员始终是公共的。虽然存在其他约定，但大多数\
  \ C# 开发者会使用以 `I` 开头的 PascalCase 命名。这里是一个典型的接口声明：\n\n![Image](img/00252.jpeg)\n\n\
  要在类中包含接口实现，冒号和接口名称位于类头之后：\n\n```class Employee : IPerson {}\n```\n\n虽然类只能继承一个类，但类可以实现多个接口。当类实现多个接口时，接口列表用逗号分隔并出现在类头的右侧：\n\
  \n```\nclass Parcel : IMexico, IJapan\n```\n\n* * *\n\n* * *\n\n### 示例 12-1 接口介绍\n\
  \n* * *\n\n此演示展示了一个接口，要求 `Employee` 类包含 `LastName` 和 `FirstName` 属性以及一个 `GetFullName()`\
  \ 方法：\n\n![Image](img/00253.jpeg)\n\n输出是可以预测的。显示的文本是 `IPerson` 接口要求的 `GetFullName()`\
  \ 方法返回的：\n\n```\nFull Name: Grumbus Treele\n```\n\n![Image](img/00013.jpeg)\n\n\
  * * *\n\n* * *\n\n### 测试 12-1 接口练习\n\n* * *\n\n本练习提供了在类中使用接口实现接口的机会。\n\n**1**. 从示例\
