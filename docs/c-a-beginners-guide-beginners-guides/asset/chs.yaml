  \n## 第二部分\n\n## 面向对象\n\n## 第 8 章\n\n## 通过面向对象实现封装\n\n### 关键技能与概念\n\n![Image](img/00002.jpeg)\
  \ 封装\n\n![Image](img/00002.jpeg) 类\n\n![Image](img/00002.jpeg) 静态\n\n![Image](img/00002.jpeg)\
  \ 结构体\n\n![Image](img/00002.jpeg) 命名空间\n\n![Image](img/00002.jpeg) 部分类\n\n* * *\n\
  \n在 C# 和大多数现代语言中，面向对象设计是一种非常流行的方法，它影响着各个方面。之前的章节介绍了支持面向对象编程的 C# 结构，但我们尚未深入如何使用这种样式进行封装。封装指的是将相关的逻辑和数据成员分组，因为它允许我们编写模块化、易读、可重用且可测试的代码。设计良好的封装单元可以很好地工作，同时管理自己的逻辑。\n\
  \n### 封装\n\n封装通过良好的类和结构体来实现。类和结构体实际上是定义方法和数据结构的蓝图。内部定义的称为成员。该蓝图随后用于生成对象。对象实例是类或结构体的实现，每个实例存储独立的数据集。\n\
  \n#### 访问权限\n\n可以为类或结构体的成员分配不同的访问级别，以隐藏内部逻辑和数据，或授予特定结构的访问权限。常见的访问级别有*私有的 (private)*、*保护的\
  \ (protected)* 和*公共的 (public)*。\n\n### Private\n\n具有私有访问权限的数据结构和方法只能在类内部使用。在未指定的情况下，类成员的默认访问级别是私有的。\n\
  \n### Protected\n\n具有保护访问权限的成员可以在类内部或从继承自父类的子类中访问。结构体不能继承其他结构体，因此它们对数据成员或方法没有保护访问级别。\n\
  \n***注意***\n\n继承将在第 9 章中详细讨论。\n\n### Public\n\n将变量、数据结构或方法声明为公共允许此对象的用户引用该成员。在下面的类声明中，存储在类级别的变量是私有的，因此无法在类外部直接访问。然而，公共方法\
  \ `DisplayLocation()`可以被类对象访问，以显示对象内部存储的数据。\n\n![image](img/00154.jpeg)\n\n####\
  \ 类\n\n类是定义方法和数据集的蓝图。它们对成员进行封装和限制访问的能力使其成为良好软件的基基石。类是引用类型，因为它们存储的是数据的地址引用。\n\n\n\
  \n\n\n在本节中，为了专注于类（classes），我们将对象称为“类的对象”，而不是“结构体的对象”。对象是类或结构体的 `instance`（实例）。如果说一个类是一张蓝图，那么对象实例就是根据该蓝图建造的建筑。类可以拥有多个对象实例。你使用类名来声明该类类型的对象。然后你可以使用\
  \ `new` 关键字后跟构造函数的引用来初始化对象。构造函数是一个用于初始化类实例的特殊方法。以下是一条指令示例（来自接下来的示例 8-1），它声明并初始化了一个名为\
  \ `empireStateBldg` 的对象，该对象是 `Location` 类的对象：\n\n```c\n// Declare 对象并使用 Location()\
  \ 构造函数初始化它。\nLocation empireStateBldg = new Location(350, ” 5th Avenue”);\n```\n\
  \n对象促进了封装，因为每个实例都引用了特定的数据集。私有数据成员和方法可以被对象访问，但外部的调用者无法访问。然而，公共方法和数据成员对象本身及其用户是可以访问的。同时，对象的内部逻辑对程序的其余部分是隐藏的。正如你稍后看到的，示例\
  \ 8-1 中的 `Location` 类包含以下公共 `DisplayLocation()` 方法，以便 `empireStateBldg` 对象能够对其提供外部引用：\n\
  \n```csharp\nempireStateBldg.DisplayLocation();\n```\n\n##### 类声明\n\n类使用 `class`\
  \ 关键字后跟类名进行声明。大多数 C# 开发人员为类名分配帕斯卡命名法（PascalCase），这些通常是名词或以描述类的名词开头的单词组合。类中的所有代码都包含在类头之后的后的合大括号内。\n\
  \n**注意**\n\n默认情况下，类声明是 `internal`（内部的），因此你不需要指定它的访问级别。具有 `internal` 访问修饰符的类意味着它对其他结构公开可见，但仅限于当前命名空间内。\n\
  \n这是一个可以作为 `Location` 类有效类声明的框架：\n\n```csharp\nclass Location {\n}\n```\n\n类通常写在与类名相同的独立代码文件中。例如，名为\
  \ `AccountManager` 的类通常存储在名为 `AccountManager.cs` 的代码文件中。不过，为了保持书中代码示例的紧凑，通常会将多个类放在一个文件中。然而，对于较大的程序，通用的做法是将每个类放在单独的文件中。\n\
  \n### 关键字 This\n\n关键字 `this` 可用于在方法内部显式地引用类级作用域内的成员。。接下来的示例 8-1 显示了使用 `this` 关键字来引用类级中名为\
  \ `streetNumber` 和 `streetName` 的变量：\n\n![image](img/00155.jpeg)\n\n##### 构造函数\n\
  \n构造函数是类的第一个方法，在创建实例时被调用以初始化对象。在创建对象期间，构造函数位于 `new` 关键字之后。构造函数与其他方法不同，之处在于构造函数与类名相同，且没有返回类型。构造函数就像是建造对象的施工队。以下是\
  \ `Location` 类的声明，其中包含一个 `Location` 构造函数：\n\n![image](img/00156.jpeg)\n\n在创建对象期间，构造函数位于\
  \ `new` 关键字之后。例如，在创建 `Location` 类的对象时，如果 `Location` 构造函数重载接收了街道号码和名称，它就可以在创建类的新实例时初始化街道号码和名称：\n\
  \n```csharp\nLocation empireStateBldg = new Location(350, “5th Avenue”);\n```\n\n\
  #### 默认构造函数\n\n类可以实现一个没有参数的默认构造函数。当类中不存在构造函数时，会自动提供默认构造函数，因此在这种情况下你不需要包含它：\n\n```csharp\n\
  class Location {\n}\n```\n\n使用此类声明，可以在不指定任何参数的情况下创建此 `Location` 类的对象：\n\n```csharp\n\
  Location apolloTheater = new Location();\n```\n\n但在类中，如果你想包含任何初始化逻辑，你也可以添加一个没有参数的默认构造函数。\n\
  \n以下是一个显示 `Location` 类在默认构造函数中实现逻辑的示例：\n\n![image](img/00157.jpeg)\n\n**示例 8-1**\
  \ 对象创建\n\n为了了解类的基本组件是如何组合在一起的，让我们查看一个声明并实现名为 `Location` 的类的完整程序。该类用于创建两个独立的对象。一个对象存储帝国大大厦的街道地址信息，另一个存储共和国广场的街道地址信息。在代码中，类级数据成员是私有的，因此它们在对象内部可见，但对对象用户不可。第一个对象通过一个接收\
  \ `streetNumber` 和 `streetName` 参数的构造函数重载创建。在构造函数内部，这些值被赋值给同名的类级变量。第二个对象通过默认构造函数创建。第二个对象使用名为\
  \ `SetLocation()` 的公共方法将 `streetNumber` 和 `streetName` 数据传递给类。`DisplayLocation()`\
  \ 方法也是公共的，因此两个对象都可以引用它来显示存储在每个实例中的数据。\n\n![image](img/00158.jpeg)\n\n`Location`\
  \ 对象调用者无法引用其中包含的私有数据，因此我们不能写：\n\n```csharp\nConsole.WriteLine(republicPlaza.streetName);\
  \ // 不允许。\n```\n\n然而，`Location` 对象的调用者可以访问 `DisplayLocation()` 等公共成员，因此我们可以写：\n\n\
  ```csharp\nrepublicPlaza.DisplayLocation(); // 允许。\n```\n\n`350 5th Avenue`\n\n\
  `9 Raffles Place`\n\n![Image](img/00013.jpeg)\n\n### 尝试 8-1 类创建、构造函数和访问器练习\n\n此练习提供了在不同访问级别下进行类创建和实现的机会。以下是尝试的步骤：\n\
  \n1. 在一个新的控制台项目中，创建一个名为 `City` 的新类。\n2. 设置 `City` 构造函数，使用 `name` 和 `population`\
  \ 参数值初始化 `City` 对象，然后将这些值存储在 `City` 类的私有变量中。\n3. 创建名为 `GetCity()` 的公共方法，返回 `City`\
  \ 类中的城市名称。\n4. 同时，创建一个名为 `GetPopulation()` 的公共方法，返回存储在 `City` 类中的人口值。\n5. 在 `Main()`\
  \ 方法中，创建 `City` 的实例并使用相应的 `City` 方法返回的值显示城市名称和人口。\n\n![Image](img/0023.jpeg)\n\n\
  #### 属性\n\n属性在类或结构体级别存储、读取和写入数据值。本节在类的上下文中讨论属性。属性类似于类级变量，但可以使用更灵活的方式和更少的代码来管理属性值的访问级别。属性名通常使用帕斯卡命名法（PascalCase），因此这是书中采用的约定。\n\
  \n#### Get 和 Set 访问器\n\n属性通过 `get` 访问器读取，通过 `set` 访问器写入。这些 get 和 set 访问器类似于方法。许多语言没有属性，因此通常创建用于写入和读取类级变量的方法，以尽可能地封装类数据。然而，C#\
  \ 开发人员的首选方案是使用属性而不是类级变量来提高代码的可读性和效率。\n\n\n\n\n\n在声明属性时，可以同时定义 `get` 和 `set` 访问器，其访问级别与左侧定义的访问级别相同。在以下示例中，`get`\
  \ 和 `set` 访问器默认是私有的，因为该属性被声明为 `private`：\n\n```\nprivate string FirstName { get;\
  \ set; }\n```\n\n但是，可以声明一个 `get` 访问器的访问级别与 `set` 访问器不同的属性。然而，`set` 和 `get` 访问器的访问权限不能高于属性本身。在例例中，`Birthday`\
  \ 属性具有公共的 `get` 访问器和私有的 `set` 访问器：\n\n```\npublic DateTime Birthday { get; private\
  \ set; } // 正确\n```\n\n下一个示例是无效的声明，因为 `get` 访问器的权限高于属性：\n\n```cs\nprivate DateTime\
  \ Birthday { public get; private set; } // 错误\n```\n\n带有 `get` 和 `set` 访问器的自动属性允许我们避免编写模板代码。但是，两个访问器都可以包含额外的逻辑。`return`\
  \ 语句可以嵌套在 `get` 访问器下以生成属性值。`value` 关键字可以用于 `set` 访问器的指令中将数据赋值给属性：\n\n![image](img/0159.jpeg)\n\
  \n访问器中也可以包含多行代码。这是一个 `FullName` 属性的 `get` 访问器示例，它使用了多个指令来生成值：\n\n![image](img/0160.jpeg)\n\
  \n* * *\n\n* * *\n\n## 示例 8-2 属性\n\n* * *\n\n此示例演示了如何创建一个 `Person` 类，其 `Birthday`\
  \ 属性的 `set` 和 `get` 访问器具有不同的访问级别。示例中的 `FirstName` 和 `LastName` 属性仅供私有读写，但公共的 `FullName`\
  \ 属性使名称可用。\n\n![image](img/0161.jpeg)\n\n![image](img/0162.jpeg)\n\n运行此程序时，可以使用对象显示存储在类属性中的数据：\n\
  \n```\nBartolomeo Ammann 151/06/18\n```\n\n![Image](img/00013.jpeg)\n\n#### 析构函数\n\
  \n析构函数是每当对象实例销毁时调用的方法，用于释放对象占用的内存。默认情况下析构函数存在，因此你不需要在类中包含它。析构函数没有参数，每个类允许一个析构函数。如果你希望在类实例销毁时执行自定义例程，可以在类中包含析构函数。手动声明的析构函数以波浪号\
  \ `~` 后跟类名：\n\n![image](img/0163.jpeg)\n\n无法直接调用析构函数。当类实例设置为 `null` 时，对象实际上失去了引用，但对象留在内存中。为了清理内存，垃圾回收会在\
  \ .NET Framework 管理的另一个系统线程上运行。你可以调用 `GC.Collect()` 命令强制垃圾回收在应用程序关闭之前清理对象使用的内存。\n\
  \n***注意***\n\n通常，你应该避免在代码中调用垃圾回收，因为这会导致性能问题。\n\n* * *\n\n* * *\n\n## 示例 8-3 析构函数\n\
  \n* * *\n\n* * *\n\n尽管你通常不会调用 `GC.Collect()`，但此示例为类实现了一个手动创建的析构函数以演示其工作原理。当你运行应用程序时，你会发现当对象设置为\
  \ `null` 时，析构函数并没有立即调用。\n\n![image](img/0164.jpeg)\n\n当启动应用程序时，没有任何输出。但当你按下 Enter\
  \ 停止应用程序后，如果你仔细观察，可能会在应用程序关闭前看到析构函数打印的以下输出：\n\n```\n*Removing instance.*\n*Removing\
  \ instance.*\n*Removing instance.*\n```\n\n接下来，在停止程序后，取消 `GC.Collect()` 指令的注释并再次运行应用程序。在按下\
  \ Enter 退出应用程序之前，由于垃圾回收在 `personB` 设置 `null` 后立即调用，析构函数打印了 `personB` 的 `firstName`\
  \ 和 `lastName` 值：\n\n```\n*Removing instance.*\n```\n\n然后，按下 Enter 停止应用程序运行。如果你仔细观察，可能会在应用程序关闭时看到以下输出：\n\
  \n```\n*Removing instance.*\n```\n\n![Image](img/00013.jpeg)\n\n### 静态结构\n\n在这一章节之前，所有的类、方法和类级变量都声明为\
  \ `static`。类、方法或数据成员的 `static` 修饰符意味着在没有对象实例的情况下进行访问。静态结构对整个应用程序可见，因此被称为“共享的（shared）”。共享结构提供了在程序中任何地方无需实例化即可访问的便利性。静态结构很有用，但要谨慎使用，因为它们不是特定用户会话的，而且没有实例化时提供的功能那样封装。\n\
  \n你可能会发现静态结构有助于构建整个应用程序通用的构造，例如用于显示通用错误消息或存储程序中多个类使用的常量值。\n\n#### 声明静态结构\n\n静态结构使用\
  \ `static` 关键字声明。\n\n### 静态数据成员\n\n静态数据成员存在于实例化类和静态类中。在声明静态变量或属性时，`static` 修饰符位于访问修饰符（如果有）之后，变量或属性类型之前：\n\
  \n![image](img/0165.jpeg)\n\n静态数据成员不需要对象。你只需要引用类名和数据成员。对于该示例，你可以通过此指令引用数据成员：\n\n\
  ```\nLocation.BranchLocation;\n```\n\n### 静态方法\n\n静态方法存在于实例化类或静态类中。在方法头中，`static`\
  \ 修饰符位于返回类型之前，访问修饰符之后（如果有）：\n\n![image](img/0166.jpeg)\n\n无法从静态方法中直接访问类的非静态字段，因此以下示例是无效的：\n\
  \n![image](img/0167.jpeg)\n\n同样，无法从静态方法调用非静态方法，因此此示例也是无效的：\n\n![image](img/0168.jpeg)\n\
  \n### 静态类\n\n只要类是静态的，就无法被实例化。由于无法用静态类创建对象，静态类没有实例构造函数。要声明静态类，将 `static` 修饰符放在 `class`\
  \ 关键字之前：\n\n```\nstatic class Location {\n}\n```\n\n\n\n\n此练习为你提供了一个尝试静态结构的机会。由于整个练习过程中都会静态结构，因此需要注意的是：在练习过程中没有使用任何类实例。\n\
