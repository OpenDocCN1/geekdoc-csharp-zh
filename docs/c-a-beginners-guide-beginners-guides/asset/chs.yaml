  \n![Image](img/00002.jpeg) 方法语法\n![Image](img/00002.jpeg) 方法重载\n![Image](img/00002.jpeg)\
  \ 按值和按引用传递参数\n![Image](img/00002.jpeg) 范围\n\n随着程序规模的扩大，你将需要指令组织成称为方法（methods）的例程。方法将功能相关的指令组合在一起。方法还允许代码重用并防止代码重复，因为每个方法都可以根据需要执行多次。开发者通常会使用动词或以动词开头的词组来声明方法名，以描述该方法的用途。方法内的所有指令必须符合该名称所描述的单一目的。通过命名良好的方法，可以一眼查看代码并理解其功能。最终，方法的许多优势使你的代码阅读者更加友好，并且更不容易出错。\n\
  \n### 方法语法\n\n为了检查方法语法，让我们看看定义方法的结构（参考图 4-1）：\n\n![Image](img/00002.jpeg) **头部 (Header)**\
  \ 方法头部，也称为方法签名（signature），是方法的第一行。它至少包含方法名、返回类型和参数列表。\n\n![Image](img/00002.jpeg)\
  \ **名称 (Name)** 方法使用描述其功能的动词或词组命名。大多数 C# 开发者让所有方法名以大写字母开头，如果名称中如果有后续单词，则每个后续单词也以大写字母开头。这种用于方法的常用的\
  \ PascalCase 命名风格也用于本书。\n\n![Image](img/00002.jpeg) **返回值 (Return value)** 方法通常执行某个例程，并将数据返回给调用该方法的代码行。该数据值就是返回值。`return`\
  \ 关键字后跟数据引用将终止方法的执行并将数据传回给调用指令。\n\n![Image](img/00002.jpeg) **返回类型 (Return type)**\
  \ 方法的返回类型声明了方法返回给调用指令的数据类型。\n\n![Image](img/00002.jpeg) **Void 类型 (Void type)**\
  \ 如果方法不向调用指令返回数据，则方法的返回类型被赋值为 `void` 类型。\n\n![Image](img/00002.jpeg) **参数 (Parameters)**\
  \ 参数是在方法头部内部声明的变量。当存在一个或多个方法参数时，调用指令必须按照方法头部中声明的相同顺序向方法传递变量值或传递方法的引用。传递到头部中参数声明中的值称为参数（arguments）。\n\
  \n![Image](img/00002.jpeg) **静态修饰符 (Static modifier)** 到目前为止，书中讨论的所有方法都使用了静态修饰符，如图\
  \ 4-1 所示。静态方法只能在没有对象引用的情况下调用其他静态方法。当我们开始创建自定义对象和类型时，将在第 8 章中开始省略静态修饰符。在此之前，我们需要静态修饰符。\n\
  \n![Image](img/00002.jpeg) **图 4-1** 方法结构\n\n* * *\n注意：如果你是编程初学者，仍然不确定如何以及何时使用 static，这是正常的。详情请见第\
  \ 8 章。\n\n#### 调用方法\n\n要执行一个方法，你必须调用该方法。要调用方法，你必须输入方法名并在括号内包含参数。这里是一个接收 float 类型的\
