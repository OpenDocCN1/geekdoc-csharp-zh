  \n![image](img/00112.jpeg)\n\n#### StartsWith()\n\n字符串类提供了 `StartsWith()` 方法来确定字符串是否以特定字符开头。`StartsWith()`\
  \ 方法在找到匹配项时会返回一个 *true* 值：\n\n```csharp\nbool StartsWith(string value);\n```\n\n\
  例如，你可能想查看所有以“Agl”开头的姓：\n\n![image](img/00113.jpeg)\n\n#### Contains()\n\n字符串类的 `Contains()`\
  \ 方法返回布尔值，以确认字符串中是否存在特定的字符集：\n\n```csharp\nbool Contains(string value);\n```\n\n\
  在此示例中，`Contains()`帮助搜索包含“Ja”的姓：\n\n![image](img/00114.jpeg)\n\n## 字符串编辑\n\n在为存储或演示格式数据时，你可能想要编辑你的字符串。正如你预期的，C#\
  \ 提供了帮助。字符串可以被修剪和连接。它们的大小写可以调整。字符串的部分可以被替换、插入和删除。\n\n### Trim()（修剪）\n\n处理来自未知来源的字符串输入时，可能需要去除前后空格。内容前后有空格的字符串值与没有填充的字符串不等等。也就是说：\n\
  \n```text\n“ ABC ” != “ABC”\n```\n\n你可能不想存储这些额外的填充。`Trim()` 方法方便地移除字符字符串两侧的空格：\n\
  \n![image](img/00115.jpeg)\n\n### Concatenation（拼接）\n\n有时你可能需要组合字符串。连接字符串的过程被称为拼接。附加字符串的一种简单方法是使用\
  \ + 运算符将字符串添加到现有字符串的右侧。在此代码示例中，名和姓被拼接以创建一个全名：\n\n![image](img/00116.jpeg)\n\n\n\n\
  \n\n## 调整大小写\n\nC# 的字符串比较是区分大小写的。例如，\n\n`“ABC” != “abc”`\n\n除了密码验证等过程需要区分大小写的字符串比较外，你可能还会遇到必须以特定大小写存储或显示不同大小写字母的情况。为了处理大小写转换，C#\
  \ 字符串对象提供了 `ToUpper()` 和 `ToLower()` 方法来转换你的字母字符。`ToUpper()` 将字母字符串转换为大大写，而 `ToLower()`\
  \ 则将字母字符串转换为小写：\n\n```csharp\nconst string ALPHABET = “AbCdEfGhIjKlMnOpQrStUvWxYz”;\n\
  Console.WriteLine(ALPHABET.ToUpper()); // 输出 ABCDEFGHIJKLMNOPQRSTUVWXYZ\nConsole.WriteLine(ALPHABET.ToLower());\
  \ // 输出 abcdefghijklmnopqrstuvwxyz\n```\n\n## Replace()\n\n为了帮助字符串格式化和编辑，字符串对象提供了\
  \ `Replace()` 方法，可以将一个子字符串的所有实例替换为另一个：\n\n```csharp\nstring Replace(string oldValue,\
  \ string newValue);\n```\n\n此示例使用 `Replace()` 将所有的 New Jersey 替换为 NJ：\n\n```csharp\n\
  string location = “Retro Fitness,Secaucus,New Jersey”;\n// 分配 “Retro Fitness,Secaucus,NJ’\n\
  location = location.Replace(“New Jersey”, “NJ”);\n```\n\n## Insert()\n\n在格式化字符串输入输出时，你可能需要在字符串中间插入额外数据。字符串对象提供了\
  \ `Insert()` 方法，将一组字符插入到现有字符串的特定位置：\n\n```csharp\nstring Insert(int startIndex,\
  \ string value);\n```\n\n这里将星期添加到了城镇活动公告中：\n\n![image](img/00117.jpeg)\n\n## Remove()\n\
  \n要从字符串中删除范围内的字符，你可以使用 `Remove()` 方法：\n\n```csharp\nstring Remove(int startIndex,\
  \ int count);\n```\n\n在此示例中，`Remove()` 从选定中提取句子：\n\n```csharp\nstring answer = “e)\
  \ All of the above.”;\n// 分配 “All of the above.”\nanswer = answer.Remove(0, 3);\n\
  ```\n\n## 转义序列\n\n转义序列是字符组合，用于表示操作、非打印字符以及特殊字符，如单引号、双引号、文件路径、换行符、回车符、制表符、退格键等。转义序列以反斜杠开头。表\
  \ 6-1 列出了 C# 中可转义序列。\n\n![image](img/00118.jpeg)\n\n**表 6-1** 可的 C# 转义序列\n\n在转义序列以外的字符串组合中使用反斜杠会导致错误。例如，此文件路径声明会导致错误：\n\
  \n```csharp\nstring filePath = “C:\\CSharp\\log.txt”; // 会导致错误\n```\n\n由于转义序列 `\\\
  \\` 代表转义的反斜杠，你可以使用以下字符串声明来定义文件路径：\n\n```csharp\nstring filePath = “C:\\\\CSharp\\\
  \\log.txt”; // 等效转义序列\n```\n\n## 字面量字符串字量\n\n字面量字符串字量声明防止转义序列的处理。要定义字面量字符串字量，以 `@`\
  \ 符号开头字符串声明。使用上一节的文件路径定义示例，如果你在字符串前加上 `@` 符号，就可以保持原始格式的所有文本：\n\n```csharp\nstring\
  \ filePath = @“C:\\CSharp\\log.txt”; // 字面量字符串字量\n```\n\n## 正则表达式\n\n正则表达式是用于字符串中进行模式匹配的字符序列。正则表达式通常用于验证文本输入，以确保数据符合预期格式。大多数现代编程语言都支持正则表达式，因为它们提供了如此简洁且高效的模式搜索。C#\
  \ 正则表达式库定义在 `System.Text.RegularExpressions` 命名空间中。通过此库中的 `Regex` 类可以启用解析和验证。在初始化\
  \ `Regex` 对象以验证字符串时，会将正则表达式模式作为参数传递：\n\n```csharp\nRegex regex = new Regex(string\
  \ regularExpression);\n```\n\n`Regex` 对象提供了 `IsMatch()` 方法来验证字符串：\n\n```csharp\n\
  bool match = regex.IsMatch(string input);\n```\n\n### 基础表达式\n\n如果你以前从未用过正则表达式，它们可能会望而生畏，所以让我们通过只检查三个正则表达式运算符来逐步接触这个话题。\n\
  \n## Starts With\n\n正则表达式运算符 `^` 确保字符串以右侧的字符集开头。正则表达式 “^Chapter” 验证 “Chapter 10”\
  \ 的字符串值：\n\n![image](img/00119.jpeg)\n\n同一个正则表达式在字符串值为 “Preface” 时会生成虚假结果：\n\n![image](img/00120.jpeg)\n\
  \n## Ends With\n\n带有运算符 `$` 的正则表达式确保字符串以特定的字符集结尾。模式 `Brazil$` 验证以 “Brazil”结尾的字符串，例如\
  \ “San Paulo, Brazil”：\n\n![image](img/00121.jpeg)\n\n另一方面，此正则表达式不验证以 “Peru”结尾的字符串：\n\
  \n![image](img/00122.jpeg)\n\n## Or\n\n管道符号 `|` 在正则表达式中表示“或”（OR）运算符。在使用 `|` 进行验证时，至少需要该运算符两侧的一个字符集才能匹配成功。正则表达式模式\
  \ “Apples|Pears|Lemons” 验证任何包含 “Apples”、“Pears”或“Lemons”的字符串。在这种情况下，正则表达式 “Apples|Pears|Lemons”\
  \ 验证字符串 “Red Apples”：\n\n![image](img/00123.jpeg)\n\n\n\n\n2.  创建一个正则表达式来验证诸如 Jane\
  \ Chen、Ron Terencio 或 Raj Bains 这样的全名。假设每个名字和姓氏都以大字母开头，且名称中的所有其他字符必须是小写字母。每个全名仅包含一个名和一个姓。中间没有连字符。名和姓之间用一个空格分隔。\n\
  \n![Image](img/00013.jpeg)\n\n* * *\n\n* * *\n\n### 示例 6-4 复杂的正则表达式\n\n* * *\n\n\
  本示例演示了如何构建一个复杂的正则表达式来验证不同的电话号码格式。该正则表达式\n\n`^(\\([0-9]{3}\\)\\s?|[0-9]{3}[-\\.\\\
  s]?)[0-9]{3}[-\\.\\s]?[0-9]{4}$`\n\n可以验证\n\n`(201) 867-5309, 201-867-5309, 201.867.5309,\
  \ 2018675309 and (201)867-5309`\n\n除了模式和输入定义外，后续示例中的代码与之前的示例完全相同：\n\n![image](img/00131.jpeg)\n\
  \n运行此示例时，输出确认了电话号码通过了正则表达式的验证：\n\n`Pattern: ^(\\([0-9]{3}\\)\\s?|[0-9]{3}[-\\.\\\
  s]?)[0-9]{3}[-\\.\\s]?[0-9]{4}$`\n\n`PASS: (201) 867-5309`\n\n![Image](img/00013.jpeg)\n\
  \n线上有许多免费工具可以帮助自动化构建复杂正则表达式的过程。你可能会找到你喜欢的工具，但通常在有效使用它们之前，你仍然需要理解正则表达式是如何工作的。电话号码和电子邮件地址等常见模式通常也可以通过\
  \ Web 上的快速搜索找到。如果你在网上寻求帮助，只需确保你的工具或模式符合 C# 规范，因为其他语言实现正则表达式的方式非常相似但略有不同。如果你在尝试验证字符串时真的遇到了瓶颈，你可能会发现其他不使用正则表达式的方法来解析字符串以完成任务。另一方面，正则表达式对于自动化验证过程非常有帮助，特别是在\
  \ Web 开发中，因此花费额外精力研究如何使用它们通常是值得的。\n\n### 将字符串转换为其他格式\n\n在处理表单和其他数据源时，你可能会遇到需要将字符串数据转换为数值、日期或布尔（Boolean）格式的情况。将字符串转换为其他数据类型有两种方法：\n\
  \n![Image](img/00002.jpeg) `Convert` 类提供了易于使用的方法将字符串转换为简单的数据类型。\n\n![Image](img/00002.jpeg)\
  \ `TryParse()` 方法也允许将字符串值转换为其他数据格式。`TryParse()` 还提供了额外的错误检查，以防止转换为无效的数据类型。\n\n####\
  \ Convert\n\n引用 `Convert` 类允许你访问将字符串参数转换为其他数据类型的方法。这里有七个快速示例，演示了如何将字符串转换为 decimal、float、double、int、long、`DateTime`\
  \ 和 bool 格式：\n\n![image](img/00132.jpeg)\n\n#### TryParse()\n\n所有简单的 C# 数据类型对象都暴露了\
  \ `TryParse()` 方法来将字符串转换为其他数据类型。与 `Convert` 类相比，`TryParse()` 更加优雅地处理字符串转换，因为 `TryParse()`\
  \ 还能判断是否可以转换。当转换不可用时，`TryParse()` 返回 false，程序将继续执行下一行而不会产生任何运行时错误。例如，使用 `Convert`\
  \ 类时，此指令会导致运行时错误：\n\n```\nConvert.ToInt32(“hello”);\n```\n\n`TryParse()` 方法则尝试转换字符串并在失败时返回\
  \ false：\n\n![image](img/00133.jpeg)\n\n转换的结果存储在 `out` 参数中。这里有一些示例演示了如何将字符串转换为 decimal、float、double、int、long、`DateTime`\
  \ 和 Boolean：\n\n![image](img/00134.jpeg)\n\n**注意**\n\n转换为 DateTime 的其他技巧将在第 7 章中介绍。\n\
