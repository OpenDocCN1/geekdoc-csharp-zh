  \n### 技能与概念\n\n![Image](img/00002.jpeg) 委托\n\n![Image](img/00002.jpeg) 匿名函数\n\n\
  ![Image](img/00002.jpeg) 事件\n\n本章讨论委托和匿名函数，以及这些概念如何应用于事件。\n\n***注意***\n\n委托和匿名函数的讨论有助于理解\
  \ LINQ 扩展方法，这些方法将在第 16 章和 17 章中介绍。\n\n事件为类发布通知提供了一种机制。事件可以用于传递类状态的变化、通知订阅类发生的操作（如鼠标点击和按键），或者指示文件已完成加载等。\n\
  \n委托允许我们将方法的引用传递给另一个类。在事件的情况下，我们将订阅类的回调方法引用传递给发布类。当事件发生时，发布类将通过委托调用回调。\n\n由于一次提到了许多新概念，如果你现在感到有些压力是可以理解的，因此本章将花时间妥解释这里介绍的每个主题。\n\
  \n### 委托\n\n委托是一种 C# 类型，表示可以在对象之间传递的方法引用。\n\n#### 委托语法\n\n委托声明看起来非常像方法签名，但委托声明以\
  \ `delegate` 关键字开始：\n\n```cs\npublic delegate void Writer(string output);\n```\n\
  \n分配给委托实例的方法返回类型和参数类型序列也与委托的返回类型和参数类型序列匹配：\n\n![Image](img/00238.jpeg)\n\n\n\n\n\
  当委托和方法的类型匹配时，你可以通过将目标方法作为参数传递来初始化委托实例：\n\n```\nOutput.Writer writer = new Output.Writer(output.Display);\n\
  ```\n\n### 示例 11-1 简单委托\n\n此代码示例在 `Output` 类中声明了一个名为 `Writer()` 的委托。然后，通过引用 `Program`\
  \ 类中的 `Display()` 方法来初始化 `Writer()` 委托。随后，使用该委托对象，通过其当前引用的方法帮助在窗口中显示某些输出内容。\n\n\
  **注意**\n\n这个示例实际上并不实用，但它提供了一个关于如何声明、初始化和实现委托以调用不同方法的简单视角。\n\n![Image](img/00239.jpeg)\n\
  \n运行此程序，生成的输出将通过委托引用打印。在调用该方法时，不需要提及方法名或类名：\n\n```\nHello\n```\n\n![Image](img/00013.jpeg)\n\
  \n### 尝试此 11-1 委托练习\n\n委托的语言和结构起初可能难以理解，因此为了帮助学习，这里有一个创建和实现简单委托的练习。虽然并不十分实用，但为了保持练习简单，你将创建一个委托，通过调用一个方法来执行磅到公斤的转换。\n\
  \n1. 创建一个新的控制台应用程序。\n2. 在自动生成的 `Program` 类之后添加此新类和委托声明：\n   ![Image](img/00240.jpeg)\n\
  3. 在 `Program` 类内部创建 `Kilograms` 委托的实例。\n4. 向委托实例传递一个方法引用。所引用的方法体需要根据以下公式返回以公斤为单位质量：\n\
  \   ```\nkg = pounds * 0.4535f;\n```\n5. 使用委托实例计算两磅重量的总质量（千克）。\n6. 将委托方法返回的结果输出到窗口中。\n\
  \n![Image](img/00023.jpeg)\n\n#### 匿名函数\n\n匿名函数是你通过委托帮助定义的内联表达式。因此，你不再是向委托传递具名方法引用，而是将一个代码块分配给委托。这个匿名函数可以在运行时定义或重新定义。\n\
  \n匿名函数体通常最多只有几行，因此它们的程序通常很短。匿名函数体的 `return` 语句是可选的。匿名函数头部可以用两种不同的方式声明：\n\n![Image](img/00002.jpeg)\
  \ 使用正式委托声明\n![Image](img/00002.jpeg) 使用 `Func<T, TResult>` 委托\n\n#### 带有委托的匿名函数\n\
  \n创建匿名函数的一种方法是使用委托。你可以通过以下委托类型声明定义匿名函数的返回类型和参数类型：\n\n```\ndelegate float Average(int\
  \ x, int y);\n```\n\n### Lambda 语法\n\n在声明匿名函数的参数和返回类型后，你可以使用 Lambda 语法分配或重新分配函数体。Lambda\
  \ 运算符 `=>` 将左侧的函数参数与右侧的表达式分开。注意左侧的参数 `(int x, y)` 委托的签名。\n\n![Image](img/00241.jpeg)\n\
  \n参数数据类型可以从匿名函数作用域内引用的对象推断出来。`return` 语句是可选的。由于这一点，之前所示的匿名函数体可以简化为：\n\n```\nAverage\
  \ average = (x, y) => (x + y) / 2.0f;\n```\n\n一旦分配了匿名函数的体，就可以提供所需参数值的调用语句来调用该函数：\n\
  \n```\nConsole.WriteLine(average(9, 2).ToString(“N1”));\n```\n\n### 示例 11-2 带有委托的匿名函数\n\
  \n此示例定义了一个委托类型，该类型可以引用接收两个整数参数并返回 float 类型的方法。在这种情况下，该方法用于引用一个匿名方法，该方法计算两个整数参数的平均值。\n\
  \n![Image](img/00242.jpeg)\n\n为两个体分别调用匿名函数的结果提供了相同的结果：\n\n```\n5.5\n5.5\n```\n\n\
  ![Image](img/00013.jpeg)\n\n### 尝试此 11-2 委托和匿名函数练习\n\n此练习提供了练习使用委托和匿名函数的机会。\n\n\
  1. 创建一个新的控制台应用程序。\n2. 在类级别添加以下代码以声明委托：\n   ```\n   delegate void ShowOutput(string\
  \ message);\n```\n3. 在 `Main()` 内部声明 `ShowOutput()` 委托的实例。\n4. 为委托实例分配一个体，将存储在 `message`\
  \ 中的值打印到窗口中。\n5. 使用你的委托实例调用匿名函数，以便窗口的输出为：\n   ```\noutput(“Hello world from anonymous\
  \ function!”);\n```\n\n![Image](img/00023.jpeg)\n\n#### 带有 Func<T,TResult> 委托的匿名函数\n\
  \n与其使用委托声明定义匿名函数，不如使用 `Func<T, TResult>` 委托声明匿名函数。`Func<T, TResult>` 委托通过 `System`\
  \ 命名空间可用。`T` 代表泛型输入数据类型，`TResult` 代表泛型返回类型。函数参数类型定义在左侧：\n\n```\nFunc<int, int, float>\
  \ average;\n```\n\n声明完成后，可以使用 Lambda 语法进行匿名方法赋值：\n\n![Image](img/00243.jpeg)\n\n\
  由于参数类型是推断的且 `return` 语句是可选的，匿名方法赋值可以简化为：\n\n```\naverage = (x, y) => (x + y)/2.0f;\n\
  ```\n\n与原始委托一样，最后你可以通过调用 `Func<T, TResult>` 委托来调用匿名函数：\n\n```\nConsole.WriteLine(average(9,\
  \ 2).ToString(“N1”));\n```\n\n### 示例 11-3 使用 System.Func<T,TResult> 的匿名函数声明\n\n\
  此示例展示了 `Func<T, TResult>` 委托匿名函数的完整声明和实现。匿名函数被定义为接收两个整数参数并返回 float 值。分配并调用匿名函数体。创建一个创建一个函数体，不需要声明参数类型或包含\
  \ `return` 语句。将其更简单的函数体分配给匿名函数委托。\n\n![Image](img/00244.jpeg)\n\n使用 `Func<T, TResult>`\
  \ 委托语法调用相同匿名方法的输出与示例 11-2 中使用普通委托生成的结果相同：\n\n```\n5.5\n5.5\n```\n\n![Image](img/00013.jpeg)\n\
  \n### 事件\n\n事件只是类可以引发/发布的通知——它们可以是任何内容。事件是由于外部操作（如鼠标点击）或内部操作（如读取文件的开始、结束、错误或程序的任何关键部分）引起的状态变化。定义、引发并发布事件通知的类称为事件发布者。请求事件通知的类称为事件订阅者。\n\
  \n#### 事件声明语法\n\n要声明事件，你必须首先声明一个委托，该委托代表事件引发时将调用的方法。然后，使用 `event` 关键字使用委托类型声明事件。\n\
  \n![Image](img/00245.jpeg)\n\n\n\n\n#### 订阅事件\n\n订阅事件的过程通常被称为“挂钩”（hooking up）事件。当将发布类的对象挂钩到某个事件上时，订阅类中的本地回调方法会通过\
  \ `+=` 运算符被赋值给事件委托。需要注意的是，回调函数的签名必须与早先声明的委托签名相匹配。\n\n![Image](img/00246.jpeg)\n\n\
  #### 触发事件\n\n发布类可以在其例程过程中的任何需要的时间触发事件。如果发布类中的委托指向订阅类中的任何回调方法，它就会调用这些方法。\n\n![Image](img/00247.jpeg)\n\
  \n#### 取消订阅事件\n\n从事件通知中取消订阅的过程被称为“取消挂钩”（unhooking）事件。要实现这一点，使用 `-=` 运算符从事件委托中解除回调方法的引用：\n\
  \n```\npublisher.BeginOutput -= StartOutputCallback;\n```\n\n* * *\n\n* * *\n\n\
  ### 示例 11-4 事件\n\n* * *\n\n此示例展示了发布和订阅事件所需的的完整视图。基本上，`Publisher` 类在向控制台输出文本之前触发一个事件。`Publisher`\
  \ 类在向控制台输出文本后也会触发一个事件。每当事件触发时，都会向 `Subscriber` 类发送通知。\n\n在这种情况下，名为 `Publisher` 的发布类声明了一个名为\
  \ `BeginOutput` 的事件，该事件在其 `Display()` 方法开始时立即触发。订阅类通过宿主中的 `OnBeginOutput()` 方法接收事件通知，该方法调用了\
  \ `Subscriber` 类的 `StartOutputCallback()` 方法。`Publisher` 还声明了一个名为 `EndOutput` 的事件，该事件在\
  \ `Display()` 方法的最末尾触发。`Subscriber` 类通过 `EndOutputCallback()` 方法接收 `EndOutput` 事件的通知。`Publisher`\
  \ 类的对象在初始化后挂钩到事件，并设置对 `Subscriber` 类中回调方法的引用。\n\n![Image](img/00248.jpeg)\n\n运行程序时，在从\
  \ `Display()` 方法触发事件之前之后，`Subscriber` 类的回调方法中都会收到来自 `Publisher` 类的通知。当 `Publisher`\
  \ 对象不再订阅这些事件时，`Subscriber` 类中的回调方法将不再收到通知：\n\n![Image](img/00249.jpeg)\n\n![Image](img/00013.jpeg)\n\
