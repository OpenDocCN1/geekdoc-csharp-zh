  \n## 第 15 章\n\n## LINQ to Entities：查询语法\n\n### 关键技能与概念\n\n![image](img/00018.jpeg)\
  \ 读取查询\n![image](img/00018.jpeg) 添加对象\n![image](img/00018.jpeg) 更新对象\n![image](img/00018.jpeg)\
  \ 删除对象\n\n* * *\n\n本章讨论了如何使用 LINQ to Entities 实现查询语法来查询和管理数据。具体来说，本章的 LINQ 命令允许你对数据进行筛选、排序、分组、汇总、插入、更新。实际上可以使用\
  \ LINQ 读取数组、`List` 集合或任何类型的内容。LINQ to Entities 是 LINQ 的变体，允许你通过 Entity Framework\
  \ 查询数据库对象。使用 Entity Framework 的 LINQ 是使用 LINQ 的常用方式之一，但 LINQ 是查询其他类型的灵活工具。一旦熟悉了\
  \ LINQ to Entities，你会发现转换到其他 LINQ 形式很容易。本章重点关注查询语法，它是 LINQ 的主要语法形式之一。查询语法看起来非常像处理数据的结构化查询语言，但与\
  \ SQL 非常不同。\n\n* * *\n\n### 引用 FoodStore 数据库\n\n要构建本章中的任何代码示例，请创建一个引用 `FoodStore`\
  \ 数据库实体数据模型的新控制台应用程序。然后将 `Main()` 方法内部的代码替换为当前示例关联的代码。有关如何设置项目的参考，请参见第 14 章，“示例\
  \ 14-1](#part0025.html_ch14exp1):向项目添加 ADO.NET 实体数据模型”。请记住，如果你使用的是 .mdf 数据库文件，除非\
  \ `FoodStore.mdf` 文件的“复制到输出目录”属性设置为“较新”，否则数据的更改（包括添加、更新和删除）将不会保存到数据库中。\n\n\n\n\n\
  \nLINQ 查询语法与我们目前处理过的 C# 代码完全不同。它允许在我们原本相当简洁的 C# 语法中，嵌入一小部分高度详尽、表达力强且符合自然语言的表达式。起初切换到查询语法可能会感到有些不适应。如果你是一名丰富的\
  \ SQL 开发者，你可能会认为查询语法看起来非常像 SQL，但这是一把双刃剑，因为关键字的放置顺序与 SQL 有何不同。请准备好在编写 C# 代码的方式上进行细小的调整。\n\
  \n### 读取查询\n\nLINQ 允许我们查询不同类型的对象。启用这些操作的类和方法属于 `System.Linq` 命名空间。对于任何读取查询，`from`\
  \ 关键字开始查询定义，`select` 关键字结束查询。`in` 关键字位于包含数据的集合之前。在使用 Entity Framework 时，你通过 `DbContext`\
  \ 对象引用该集合。为了引用集合中的每个实例，查询语法使用别名，别名可以是任何名称。通常，C# 开发者会使用集合的第一个字母作为别名。在查询任何集合时，别名都可以引用被查询对象的属性。\n\
  \n#### 引用对象的属性\n\n此示例定义了一个查询，用于从 `Product` 表的所有行提取所有列值：\n\n![image](img/00304.jpeg)\n\
  \n为了减少数据开销，只需从每个对象中选择你需要的属性值。当使用 `var` 定义隐式声明一个具有唯一列集的集合时，你实际上是在定义一个`匿名类型`。在接下来的示例中，使用别名仅从数据库中\
  \ `Product` 表的每行中选择 `name` 和 `vendor` 列值。同时注意，在定义要检索的列时，`new` 关键字和左括号开始该序列。检索到的列值之间用逗号分隔，并以右括号结束该序列。\n\
  \n![image](img/00305.jpeg)\n\n使用上述两个查询定义中的任何一个，你都可以遍历查询结果以显示所选列的值：\n\n![image](img/00306.jpeg)\n\
  \n#### 分配自定义属性名\n\n在定义查询时，你可以选择为列声明自定义属性名。在这种情况下，声明了 `ProductName` 和 `Supplier`\
  \ 属性来表示 `Product` 实体类的 `name` 和 `vendor` 属性：\n\n![image](img/00307.jpeg)\n\n当查询使用自定义属性名时，稍后可以通过查询对象引用它们：\n\
  \n![image](img/00308.jpeg)\n\n* * *\n\n* * *\n\n**示例 15-1** 选择对象的特定列\n\n* * *\n\n\
