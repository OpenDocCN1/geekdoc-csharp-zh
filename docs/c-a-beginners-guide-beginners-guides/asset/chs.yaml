  \n![image](img/00413.jpeg)\n\n* * *\n\n* *\n\n### 尝试 19-1 写入、读取和提取文本数据\n\n这是一个亲眼观察写入和读取文本数据有多简单的机会，这些数据也可以使用电子表格应用程序查看。\n\
  \n**1**. 从一个新的控制台应用程序开始，将以下文本内容写入名为 `Sales.csv` 的文件：\n\n`Monthly Sales,Amount`\n\
  \n`August,23333.25`\n\n`September,18323.22`\n\n`October,13344.23`\n\n**2**. 写入后，关闭你的\
  \ `StreamWriter` 对象以释放文件。\n\n**3**. 使用 `StreamReader` 类打开文件进行读取。\n\n**4**. 在读取每行时，将内容拆分为数组。\n\
  \n**5**. 将数值转换为小数对象并保留累加和。\n\n**6**. 一旦从读回应用程序的数据中计算出该值，就输出八月、九月和十月的销售额总和。\n\n**7**.\
  \ 检查并确保可以使用 Microsoft Excel 等电子表格应用程序打开 `Sales.csv` 文件。\n\n* * *\n\n### 写入和读取二进制数据\n\
  \n二进制数据是数字编码的数据。你无法使用简单的文本编辑器读取此类内容。然而，二进制格式比原始文本更对机器友好，因为你的计算机系统更容易对其读取、存储、传输和修改。此外，由于二进制数据是以字节为单位衡量的，二进制格式为直接访问数据的任何部分提供了极大的灵活性。除了这些效率外，二进制格式还允许你创建自己的专有文件类型，你可以针对性能和存储空间对其进行优化。现在让我们来看看\
  \ `System.IO` 命名空间中的库如何帮助你管理二进制内容。\n\n#### FileMode\n\n每当打开文件进行读取或写入时，使用 `FileMode`\
  \ 枚举作为参数来描述流如何被使用。表 19-1 描述了不同的 `FileMode` 枚举。\n\n![image](img/00414.jpeg)\n\n**表\
  \ 19-1** FileMode 枚举\n\n#### BinaryWriter\n\n如下所示，`BinaryWriter` 对象使用 `File.Open()`\
  \ 方法返回的 `FileStream` 实例进行初始化。`File.Open()` 方法接收文件路径和 `FileMode` 枚举作为参数。一旦初始化，`BinaryWriter`\
  \ 类会在写入输出时自动完成将任何简单数据类型的值转换为二进制格式的过程。\n\n![image](img/00415.jpeg)\n\n再次，当 `BinaryWriter`\
  \ 声明在 `using` 语句内部时，程序会在离开代码块后释放该对象。如果声明不在 `using` 语句内部，则需要调用 `BinaryWriter` 对象的\
  \ `Close()` 方法来释放文件，以便供另一个进程使用：\n\n```\nwriter.Close();\n```\n\n#### BinaryReader\n\
  \n对于二进制输入，你可以使用 `BinaryReader` 类。该类的对象使用 `File.Open()` 方法返回的 `FileStream` 对象进行初始化：\n\
  \n![image](img/00416.jpeg)\n\n如果你知道文件中数据段的位置和格式，`BinaryReader` 类提供了几种方法来读取二进制数据并将其转换为所需的类型（参见表\
  \ 19-2）。\n\n![image](img/00417.jpeg)\n\n**表 19-2** BinaryReader 方法\n\n在此示例中，`ReadDecimal()`\
  \ 方法读取一个二进制值并将其转换为小数对象：\n\n```\ndecimal balance = reader.ReadDecimal();\n```\n\n\
  当离开 `using` 块时，`BinaryReader` 对象被销毁，文件被释放，以便供另一个进程使用。\n\n* * *\n\n* *\n\n## 示例 19-3\
  \ 顺序写入和读取二进制数据\n\n* * *\n\n为了查看这些类如何与二进制内容协同工作，此示例演示了如何顺序向文件写入和读取已知简单类型的二进制值：\n\n\
