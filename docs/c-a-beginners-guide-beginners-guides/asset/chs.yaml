  \n![image](img/00210.jpeg)\n\n![image](img/00211.jpeg)\n\n\n\n此示例的输出通过基类中的共享代码显示，但根据使用的载体不同，子类应用了不同的属性：\n\
  \n![image](img/00212.jpeg)\n\n![Image](img/00013.jpeg)\n\n### 密封修饰符 (Sealed Modifiers)\n\
  \n为了进一步自定义继承结构，可以使用 `sealed` 修饰符来设置类、方法、属性或字段的派生终点。\n\n#### 密封类\n\n在类声明前加上 `sealed`\
  \ 修饰符，表示没有类可以继承自它。例如，如果我们密封一个 `SalesRep` 类：\n\n![image](img/00213.jpeg)\n\n那么将无法从\
  \ `SalesRep` 类派生出新类：\n\n```cs\npublic class RegionalRep : SalesRep { } // 不允许。\n\
  ```\n\n#### 密封成员\n\n在类成员（如方法）前加上 `seal` 关键字，表示子类不能重写此实现。在这种情况下，`ShowTitle()` 方法被密封了：\n\
  \n![image](img/00214.jpeg)\n\n由于 `ShowTitle()` 在 `Employee` 类中是密封的，因此在子类无法重写该方法：\n\
