  \n**8**. 当停在 图 1-8 的第 11 行时，本地窗口中出现了哪些变量和对应值？\n\n## 第 2 章：变量、常量、数组和枚举\n\n### 关键技能与概念\n\
  \n![Image](img/00002.jpeg) 数据类型\n![Image](img/00002.jpeg) 变量\n![Image](img/00002.jpeg)\
  \ 常数\n![Image](img/00002.jpeg) 数组\n![Image](img/00002.jpeg) 枚举\n\n在管理数据时，考虑哪种数据结构对任务最有效是非常重要的。C#\
  \ 提供了许多用于管理应用程序内数据的结构。本章讨论了变量、常量、数组和枚举，这些是管理数据的一些简单的 C# 结构。\n\n![Image](img/00002.jpeg)\
  \ **变量** 变量是对存储数据的唯一命名引用。变量值可以在运行时更改。\n\n![Image](img/00002.jpeg) **常量** 常数是对值的唯一命名引用。常量值在声明常量时赋值后不能更改。\n\
  \n![Image](img/00002.jpeg) **数组** 数组存储相同数据类型的多个值。\n\n![Image](img/00002.jpeg) **枚举**\
  \ 枚举是命名常量的集合。这种类型提供了一组常量。\n\n### 数据类型\n\n在选择数据结构时，你始终需要考虑数据的格式。这种格式被称为数据类型。C# 是一种强类型语言。这意味着一旦使用给定类型定义了数据结构，就无法持有不同类型的值。例如，C#\
  \ 不允许你在设计为仅数字的引用中存储字母值。\n\nC# 库有许多预定义的数据类型。表 2-1 显示了一些流行的数据类型。\n\n![image](img/00019.jpeg)\n\
  **表 2-1** 常用数据类型\n\n#### 数值字面量\n\n在查看表 2-1 时，注意某些数值数据类型也有后缀，称为数值字面量。这些数值字面量有助于区分数据类型。后缀也可以大写，但通常使用小写。\n\
  \n为了演示如何使用后缀，这里是声明和初始化浮点变量的有效和无效指令：\n\n![Image](img/00020.jpeg)\n\n注意，分数数值需要后缀 `f`\
  \ 来区分它们为浮点类型。整数可以赋值给浮点类型，因为浮点类型足够容纳任何整数。\n\n类似地，这里是声明和初始化小数变量的有效和无效指令：\n\n![Image](img/00021.jpeg)\n\
  \n注意整数可以赋值给小数类型，因为小数格式足够容纳任何整数。另一方面，小数值的格式必须通过数值字面量 `m` 明确，然后才能将数字赋值给小数变量。\n\n###\
  \ 变量\n\n正如本章开头提到的，变量是对存储数据的唯一命名引用。变量值可以在运行时更改。\n\n#### 变量类型\n\n存在两种变量：\n\n![Image](img/00002.jpeg)\
  \ **值类型** 值类型变量存储 C# 库中预定义的简单类型，例如整数、浮点和小数类型。值类型变量引用存储数据的内存位置。\n\n![Image](img/00002.jpeg)\
  \ **引用类型** 引用使用类或数据集合创建的自定义对象的变量是引用类型变量。引用类型变量引用包含数据起始地址的内存位置。\n\n#### 变量语法\n\n\
  变量通过数据类型后跟变量名称来声明。变量在首次赋值时初始化。\n\n变量可以单独声明并在稍后初始化：\n\n```csharp\nint totalOutlets;\
  \ // 声明变量。\ntotalOutlets = 4; // 初始化变量。\n```\n\n变量也可以在同一行内声明并初始化：\n\n```csharp\n\
  int totalOutlets = 4;\n```\n\n\n\n\n\n```cs\nint totalOutlets = 4;\n```\n\n### 变量名\n\
  \n变量名使用一个单词或单词组合来描述变量的数据。通常，变量名采用 `camelCase`（驼峰命名法），这意味着名称的首字母是小写，在第一个单词之后，变量名中的每个后续单词都以大写字母开头。该名称中的所有其他字母均为小写，且变量名中不允许包含空格。只有一个单词的\
  \ `camelCase` 变量名全为小写。\n\n**注意**\n\n当变量的访问级别为私有（private）或受保护（protected）时，大多数 C#\
  \ 开发者会使用 `camelCase` 命名。按照相同的标准，如果变量的访问级别为公共（public），则变量名采用 `PascalCase`（帕斯卡命名法），这意味着名称中的每个单词的首字母都是大写字母，而所有其他字母均为小写。不过，通常不会创建公共访问级别的变量。我们将在第\
  \ 8 章中讨论私有、受保护和公共访问级别。\n\n**示例 2-1** 数据类型与变量\n\n此示例展示了如何声明、初始化和使用变量来管理内存中数据的引用。要创建此程序，请创建一个新的控制台应用程序（如第\
  \ 1 章所述），并将 `Program.cs` 中现 C# 代码替换为以下代码：\n\n![Image](img/00022.jpeg)\n\n当运行此程序时，输出显示了每个变量引用的值：\n\
  \n```\nVenus 是唯一一个顺时针旋转的行星。\nTotal moons = 0\nVenusian windspeed = 450 miles/hr.\n\
  ```\n\n### 常量\n\n与变量类似，常量是对值的唯一命名引用。然而，常量与变量不同，因为常量值在初始化后无法更改。由于常量值是固定的，常量引用可以防止程序过程中出现意外的数据篡改。此外，常量名称为数据值提供了易于阅读的引用。\n\
  \n#### 常量语法\n\n常量的声明和初始化方式与变量相似。然而，为了确保常量值在运行时保持不变，常量声明之前要使用关键字 `const`：\n\n```cs\n\
  const string FUN_FACT = “Facts about Venus”;\n```\n\n#### 常量命名\n\n为了保持命名标准的致性，大多数\
  \ C# 开发者使用全大写字母编写常量名。常量名由一个单词或一组单词组成。如果常量名使用了多个单词，通常单词之间用下划线分隔。\n\n**提示**\n\n每当你的代码中使用任意的固定数字时，请将这些值存储在常量中。常量结构将阻止对原始数字的意外更改。常量的描述性名称也有助于说明代码。\n\
  \n### 尝试此 2-1 变量与常量结构练习\n\n练习使用变量和常量结构的操作。此练习提供了一种观察这两种结构之间差异的简单方法。\n\n1. 从示例 2-1\
