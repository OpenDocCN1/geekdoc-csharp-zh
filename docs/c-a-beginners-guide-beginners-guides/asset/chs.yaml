  \ 动态解析\n\n有时，将 JSON 映射到 .NET 类型非常耗时，特别是当你正在处理大型 JSON 流且只需要其中一一小部分数据时。`dynamic` 类型允许你将\
  \ JSON 存储为对象，并对其进行查询，而无需承担主要转换的开销。可以使用 `Newtonsoft.Json.Linq` 空间下的 `JObject.Parse()`\
  \ 方法将 JSON 字符串作为参数初始化动态对象：\n\n```csharp\ndynamic jsonObject = JObject.Parse(strJson);\n\
  ```\n\n#### 引用属性\n\n使用 `dynamic` 类型，你可以通过名称访问 JSON 对象的名称属性：\n\n```csharp\nstring\
  \ FirstName = jsonObject.FirstName;\n```\n\n#### 引用数组\n\n为了简化解析，你还可以从大得多的 JSON 对象中提取嵌套数组。在这里，`Camps`\
  \ 数组从一个较大的 JSON 结构被提取到一个独立的 `dynamic` 对象中：\n\n```csharp\ndynamic camps = jsonObject.Camps;\n\
  ```\n\n在分离数组数据后，你可以使用 `foreach` 循环遍历数组中的每个对象：\n\n![image](img/00484.jpeg)\n\n正如你预期的，数组被赋予了一个\
  \ `Count` 属性，JSON 对象及其在数组中的属性也可以通过数字索引进行引用：\n\n![image](img/00485.jpeg)\n\n***\n\
