  \n![image](img/00310.jpeg)\n\n* * *\n\n* * *\n\n### 尝试 15-1 使用查询语法读取数据\n\n这是一个练习使用查询语法从数据库读取数据的练习。\n\
  \n**1**. 修改示例 15-1 的解决方案，仅检索并显示 `Store` 表中的 `branch` 和 `region` 列数据。但这次，定义你自己的名为\
  \ `Branch` 和 `Region` 的自定义属性名。\n\n**2**. 为了验证你的 C# 代码检索的数据是否正确，请使用服务器资源管理器/数据库资源管理器检查\
  \ `FoodStore` 数据库中 `Store` 表存在的数据（参考第 13 章中的示例 13-3），并发现表中存在的任何额外列。\n\n**3**. 调整你的代码以检索并显示\
  \ `Store` 表额外列的数据。在调整查询时，使用别名发现 `Store` 的属性。\n\n* * *\n\n#### 延迟加载与即时加载\n\n正如第 14\
  \ 章提到的，隐式查询使用 `var` 关键字定义。对于隐式查询，编译器可以推断集合类型。还需要记住，这些隐式查询使用`IQueryable`接口，这意味着它们是延迟加载的。当查询被延迟加载时，数据在需要时才会被实际检索。换句话说，执行是延迟的。通常延迟加载是有益的，因为它允许你分步构建查询。\n\
  \n你可以通过将查询转换为 `List` 来强制即时数据加载（称为预加载）。以下查询在声明时立即加载：\n\n```csharp\nList<Product>\
  \ query = context.Products.ToList();\n```\n\n在下一个案例中，即时加载发生在调用 `ToList()` 时：\n\n\
  ![image](img/00311.jpeg)\n\n#### 过滤\n\n从大集合中检索行时，你通常不需要所有的行。为了减少应用程序与数据库服务器之间的网络流量，最好通过查询上的过滤器来消除不需要的行。过滤器实际上是一个评估为真或假结果的条件语句。只有满足过滤器的行会被选中。\n\
  \n### 基本过滤\n\n查询语法提供了 `where` 关键字，用于从集合选择对象时实现识别所需行的。`where` 子句位于 `from` 子句之后、`select`\
  \ 子句之前。复合条件可以存在 `where` 子句中，使用 `&&` 表示与条件，使用 `||` 表示或条件。\n\n* * *\n\n* * *\n\n**示例\
  \ 15-3** 应用 Where 过滤器\n\n* * *\n\n此示例展示了如何使用 LINQ 中的 `where` 关键字来选择价格大于 0.99 且小于\
  \ 2.00 的 `Product` 对象的数据：\n\n![image](img/00312.jpeg)\n\n运行此程序时，`where` 过滤器确保只有在价格于\
  \ 0.99 到 2.00 之间才选择行：\n\n`Cookie Dough - $1.25`\n\n`Cookie Dough - $1.45`\n\n`Carrots\
  \ - $1.01`\n\n* * *\n\n#### 使用值集合过滤\n\n当使用数组或 `List` 等集合中的匹配值过滤查询数据行时，集合对象提供了 `Contains()`\
  \ 方法，返回布尔结果，以指示查询的属性在指定集合中具有匹配值。\n\n* * *\n\n* * *\n\n**示例 15-4**    使用值集合过滤\n\n\
  \n\n\n此示例显示了如何检索 `name` 值为“Cookie Dough”（饼干面团）或“Cake Mix”（蛋糕混合料）的 `Product` 对象。“Cookie\
