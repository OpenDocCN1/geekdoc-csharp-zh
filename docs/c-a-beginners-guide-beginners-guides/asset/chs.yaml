  \ `j` 的循环内部。带有 `k` 的循环嵌套在带有 `i` 的循环内部。（注：此节的原文与标准文档相比似乎有一些重复/乱码内容，但我保留了提供的核心逻辑和变量）。\n\
  \n![image](img/0095.jpeg)\n\n### 尝试一下 5-2 嵌套循环\n\n这个练习让你练习 `for` 循环。\n\n1. 编写一个使用计数器\
  \ `i`、`j` 和 `k` 的 `for` 循环程序。带有 `j` 的循环嵌套在带有 `i` 的循环内部。带有 `k` 的循环嵌套在带有 `j` 的循环内部。\n\
  2. 设计你的程序生成以下输出：\n\n`i=0 j=0 k=0`\n`i=0 j=0 k=1`\n`i=0 j=1 k=0`\n`i=0 j=1 k=1`\n\
  `i=1 j=0 k=0`\n`i=1 j=0 k=1`\n`i=1 j=1 k=0`\n`i=1 j=1 k=1`\n\n![Image](img/00023.jpeg)\n\
  \n#### While 循环\n\n`while` 循环在条件为真时重复其指令块。`while` 关键字开始头部。头部内部有一个条件表达式。只要条件表达式为真，就会执行循环块内的代码。循环块内的指令一直重复直到条件表达式为假。\n\
  \n![image](img/0096.jpeg)\n\n## 示例 5-7 While 循环\n\n此示例展示了如何将 `while` 循环实际应用来计算银行余额，直到总余额低于零：\n\
  \n![image](img/0097.jpeg)\n\n没有存款，且初始余额较低。随着时间的推移，服务费超过了利息，账户余额低于零：\n\n`End of Month\
  \ 1: Balance = 39.79`\n\n`End of Month 2: Balance = 29.52`\n\n`End of Month 3: Balance\
  \ = 19.19`\n\n`End of Month 4: Balance = 8.80`\n\n`End of Month 5: Balance = -1.65`\n\
  \n![Image](img/00013.jpeg)\n\n#### Do While 循环\n\n`do-while` 循环与 `while` 循环相似。然而，`do\
  \ while` 循环至少执行一次，因为条件表达式是在最后评估的。`do` 关键字开始此循环。循环以 `while` 关键字和括号条件表达式结束。\n\n![image](img/00098.jpeg)\n\
  \n## 示例 5-8 Do While 循环\n\n此示例与示例 5-7 有何不同，因为它允许程序即使余额为零也至少执行一次 `do while` 循环块内的代码：\n\
  \n![image](img/00099.jpeg)\n\n\n\n\n\n即使余额为零，循环也会执行一次以扣除第一个月的服务费，然后终止：\n\n`End of\
  \ Month 1: Balance = -10.50`\n\n![Image](img/00013.jpeg)\n\n#### Foreach 循环\n\n\
  `foreach` 循环允许你遍历一组类型相似的对象集合。`foreach` 关键字开始循环头部。头部中的声明声明定义了一个临时变量，用于存储集合中的一个项目。临时变量之后紧跟\
  \ `in` 关键字和集合引用。\n\n![image](img/00100.jpeg)\n\n* * *\n\n* * *\n\n**示例 5-9** Foreach\
  \ 循环\n\n* * *\n\n由于数组实际上是一组类型相似的对象集合，因此你可以使用 `foreach` 循环来遍历存储在其中的值。此示例展示了如何使用 `foreach`\
  \ 循环来遍历一个名称数组：\n\n![image](img/00101.jpeg)\n\n正如运行程序时预期的，数组中的每个名称都显示在单独的一行：\n\n\
  `Jane.`\n\n`Brad.`\n\n`Kara.`\n\n![Image](img/00013.jpeg)\n\n### 比较循环类型\n\n有多种循环类型供选择，让我们考虑每种类型的优势：\n\
  \n![Image](img/00002.jpeg) `for` 循环允许对具有枚举索引的集合（如数组）进行方便的迭代。\n\n![Image](img/00002.jpeg)\
  \ `while` 循环在迭代之前必须检查非数值或复杂条件时，重复执行代码块。\n\n![Image](img/00002.jpeg) `do while` 循环与\
  \ `while` 循环具有相同的优势，但 `do while` 循环确保循环至少迭代一次。\n\n![Image](img/00002.jpeg) `foreach`\
  \ 循环可以遍历任何类型的集合。\n\n#### Break 语句\n\n当遇到 `Break` 语句时，会强制程序退出当前循环。所有的 C# 循环类型都允许\
  \ `break` 语句。\n\n* * *\n\n* * *\n\n**示例 5-10** Break 语句\n\n* * *\n\n在此示例中，菜单提示程序用户按\
  \ 1 继续运行程序或按 2 退出。菜单选项和指令由循环驱动。当用户输入 2 时，`break` 语句强制程序退出循环。\n\n![image](img/00102.jpeg)\n\
  \n这里是一些示例输出。用户在第一次迭代中选择继续运行程序。在第二次迭代中，用户选择 2 退出。\n\n`** Menu **`\n\n`1\\. Keep running\
  \ this program.`\n`2\\. Quit.`\n`1`\n`You have chosen to keep running.`\n\n`** Menu\
  \ **`\n\n`1\\. Keep running this program.`\n`2\\. Quit.`\n`2`\n\n`The program has\
  \ been terminated.`\n\n![Image](img/00013.jpeg)\n\n#### Continue 语句\n\n`continue`\
  \ 语句允许你跳过循环块中的所有剩余指令，返回循环顶部。\n\n* * *\n\n* * *\n\n**示例 5-11** Continue 语句\n\n* *\
  \ *\n\n此示例模拟了一个简化的 21 点游戏，玩家可以不断抽取随机扑牌，扑牌的值在 1 到 11 之间。游戏的目标是让牌牌总和尽可能接近 21 而不超过。程序每当迭代一次循环时，就会生成并打印一个随机扑牌值。如果抽到的牌值总和小于或等于\
