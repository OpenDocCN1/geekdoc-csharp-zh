  \ `FoodStore` 目录下。`FoodStore.mdf` 文件和 `FoodStore.logf` 文件保留在一起。\n\n要添加对数据库文件的引用，首先在解决方案资源管理器中右键点击项目名称，点击“属性”，并选择左侧的“设置”选项卡。如果此项目不包含设置文件，点击此处创建一个。在“设置”面板中，在“类型”列下，选择“字符串”选项。在“范围”下，选择“应用程序”。应用程序。\
  \ (.........\n\n\n\n\n\n本示例解释了如何创建数据库连接字符串，以引用存储在 Microsoft SQL Server 中的数据库。\n\n\
  **注意**\n\n如果您已经完成了示例 13-1，可以跳过本示例。本示例仅适用于希望使用当前安装的 Microsoft SQL Server 而不是数据库文件的高级数据库用户。\n\
  \n如果您已安装了 Microsoft SQL Server，可以使用它来托管数据库，而不是使用数据库文件。首先，创建一个名为 `FoodStore` 的数据库，然后运行位于\
  \ `FoodStore.sql` 的脚本，该脚本随本书下载提供。要开始此示例，请创建一个新的控制台应用程序。然后，在“解决方案管理器”中右键点击项目节点并选择“属性\
  \ (Properties)”。在项目窗口中，选择“设置 (Settings)”选项卡。您可能会看到一个面板，其中带有“此项目不包含默认设置文件。点击此处创建一个”的超链接消息。如果是，请点击该超链接。现在将显示“设置”视图，如图\
  \ 13-4 所示。\n\n![image](img/00279.jpeg)\n\n**图 13-4** 从项目设置面板设置连接字符串\n\n在“设置”面板中，将“类型\
