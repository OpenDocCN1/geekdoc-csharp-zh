  \n\n\n日期、时间以及时间转换并不十分困难，乍看似乎很无害，但用户对各种不同格式的需求有时会具有挑战性。本章介绍了用于处理日期和时间值的常用 C# 结构和方法。除了讨论格式化选项外，这里涵盖了用于计算和比较日期时间单位的属性和方法。在考虑到在早晨、下午、不同长度的月份、年份和闰年之间转换所需的所有调整时，你将希望利用\
  \ C# 库来管理时间间隔、日期和时间。了解 C# 库如何帮助解析或计算日期和时间值是非常重要的，因为这些例程可能具有挑战性。\n\n处理日期和时间所需的两个主要\
  \ C# 类型是 `TimeSpan` 类型和 `DateTime` 类型。这两个 C# 类型都通过 `System` 命名空间可用。\n\n### TimeSpan\
  \ 语法\n\n`TimeSpan` 类型存储和管理从刻（ticks）到毫秒再到天的不同时间块的时间间隔组件。虽然 `TimeSpan` 对象不存储或管理日期，但在计算日期之间的时间间隔时，它们特别有用。要初始化一个\
  \ `TimeSpan` 对象，你可以分配从毫秒到天的单位组合：\n\n![image](img/00136.jpeg)\n\n#### TimeSpan 属性\n\
  \n`TimeSpan` 类型提供了属性来提供其存储的时间间隔信息。`TimeSpan` 类型的属性及其作用总结在 表 7-1 中。\n\n![image](img/00137.jpeg)\n\
  \n**表 7-1** TimeSpan 属性\n\n***注意***\n\n我们将在书中不使用 `Ticks` 属性。虽然刻通常用于数据驱动的编程，但它们对于在动画对象的程序中跟踪时间很有帮助。\n\
