  \ 19-4 的解决方案开始，并将 `ReadBinaryData()` 方法替换为此版本：\n\n![image](img/00425.jpeg)\n\n注意起始偏移量为\
  \ 8 字节，读取了 16 字节。由于每个整数长度为 4 字节，这意味着读取了第三、第四、第五和第六个整数。运行程序时显示的输出验证了这一点：\n\n```\n\
  3, 4, 5, 6,\n```\n\n***\n\n### 第 19 章自测\n\n![image](img/00018.jpeg)\n\n***\n\n以下问题旨在帮助加强你对本章涵盖概念的理解。答案可以在随附的在线附录\
