  \ SqlDataAdapter 类管理存储过程\n\n本节讨论了如何从你的代码在数据库上执行存储过程。当使用 `SqlDataAdapter` 类直接从代码运行存储过程时，需要以前讨论过的所有准备\
  \ `SqlDataAdapter` 对象的步骤。然而，需要额外的配置来管理存储过程。\n\n### 设置 CommandType 属性\n\n`SqlDataAdapter`\
  \ 类的 `CommandType` 属性定义了查询类型。默认情况下，`SqlDataAdapter` 对象被设置为执行原始 SQL 字符串。但在执行存储过程执行时，必须将\
  \ `SqlDataAdapter` 对象的 `CommandType` 属性设置为 `CommandType.StoredProcedure`：\n\n```\n\
  sqlDataAdapter.SelectCommand.CommandType = CommandType.StoredProcedure;\n```\n\n\
  ### 初始化过程参数\n\n当存储过程具有参数时，`SqlParameter` 类定义了存储过程参数：\n\n![image](img/00383.jpeg)\n\
  \n使用 `Parameters.Add()` 方法附加 `SqlParameter` 对象：\n\n![image](img/00384.jpeg)\n\n\
  **示例 18-4** 使用 SqlDataAdapter 类执行存储过程\n\n此示例显示了如何执行 `FoodStore` 数据库中已包含的原始 SQL 和两个存储过程。首先，让我们检查示例中使用的两个存储过程的\
