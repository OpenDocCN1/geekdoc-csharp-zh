  当类实现两个或多个具有相同成员的接口时，每个特定的成员实现必须通过接口显式访问，而不是通过类。\n\n***提示***\n\n大多数情况下，开发者隐式地使用接口，如本章前一节所示。然而，在这里讨论显式接口是为了以备你需要时。\n\
