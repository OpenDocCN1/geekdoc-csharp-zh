  \n![Image](img/00013.jpeg)\n\n## 示例 8-5：静态修饰符的应用\n\n此示例提供了更实用的视角，展示了如何使用静态修饰符管理应用程序中所有类共用的程序。在这种情况下，静态类\
  \ `App` 托管了显示错误消息和显示公司标题的方法。\n\n![image](img/00172.jpeg)\n![image](img/00173.jpeg)\n\
  \n显示界面有一个允许用户输入选择的菜单。当用户做出选择并按下 ENTER 时，应用程序会做出相应的响应。用于显示菜单标题和错误消息的方法是静态的，因此它们可以从程序的任何地方调用，而无需其类的实例：\n\
  \n```\n** Hamley’s Toys London England **\n1\\. Keep shopping\n2\\. Quit\n1\n...shopping.\n\
  ** Hamley’s Toys London England **\n1\\. Keep shopping\n2\\. Quit\nABC\nInput error.\
  \ Please try again.\n** Hamley’s Toys London England **\n1\\. Keep shopping\n2\\\
  . Quit\n2\nThank you for shopping with us.\n```\n![Image](img/00013.jpeg)\n\n###\
  \ 结构体 (Structs)\n\n正如章节开头提到的，`struct` 是一个封装了数据成员和方法的蓝图。`struct` 用于创建对象，以独立的数据实例来实现逻辑。通过这种方式，结构体与类非常相似。一眼看上去，结构体甚至和类是一样的。虽然类和结构体之间有许多相似之处，但存在一些细微但重要的区别。通常，C#\
  \ 开发者会倾向于使用类而不是结构体，但理解它们的工作原理是有帮助的。类和结构体之间最重要的区别之一是 `struct` 是值类型。结构体更适合管理规模不大的复杂数据集。\n\
  \n结构体可以拥有变量、属性、方法和构造函数。`struct` 的成员也可以是静态，但 `struct` 声明不能是静态的。结构体可以有构造函数，但没有默认构造函数。结构体不能继承其他结构体。类和结构体之间的区别可能有些复杂，因此表\
  \ 8-1 总结了这些差异。\n\n![image](img/00174.jpeg)\n\n**表 8-1** 类与结构体的对比\n\n## 示例 8-6：结构体\n\
  \n此示例演示了创建一个 `struct`，它实现了一个变量、一个属性、两个方法和一个用于管理信息的构造函数：\n\n![image](img/00175.jpeg)\n\
