  \n### 隐式接口实现 (Implicit Interface Implementation)\n\n当实现接口的类对象未指定接口时，接口的使用是隐式的。示例\
  \ 12-1 演示了接口的隐式使用。\n\n此外，如果一个类实现了多个接口，且这些接口需要相同的成员，则类可以实现一个成员来满足每个接口。在实现类中，成员不需要加接口引用前缀，且该成员必须是公共的。\n\
  \n![Image](img/00259.jpeg)\n\n在这里对象的接口是隐式的：\n\n![Image](img/00260.jpeg)\n\n### 接口层级\
  \ (Interface Hierarchies)\n\n接口可以扩展另一个接口以创建接口层级。这种扩展接口的能力为接口层级上的代码共享提供了更大的灵活性。实现接口层级的类或结构体必须实现嵌套接口层级中声明的所有方法。在本示例中，`IEmployee`\
  \ 接口扩展了 `IPerson` 接口：\n\n![Image](img/00261.jpeg)\n\n当类实现接口时，它必须实现接口层级中定义的所有成员：\n\
  \n![Image](img/00262.jpeg)\n\n* * *\n\n* * *\n\n**示例 12-3** 接口层级\n\n* * *\n\n此示例展示了类如何实现扩展\
  \ `IPerson` 接口的 `IEmployee` 接口。`IPerson` 接口要求 `FirstName` 和 `LastName` 属性。`IEmployee`\
  \ 接口要求 `EmployeeID` 属性和 `DisplayEmployeeData()` 方法。实现 `IEmployee` 接口的类必须实现层级中的所有成员。\n\
