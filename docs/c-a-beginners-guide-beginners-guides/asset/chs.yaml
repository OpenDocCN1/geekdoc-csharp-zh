  \ 特性 (Attributes)\n\n### 核心技能与概念\n\n![Image](img/00002.jpeg) .NET Framework 特性\n\
  ![Image](img/00002.jpeg) 创建和实现自定义特性\n![Image](img/00002.jpeg) 反射介绍\n![Image](img/00002.jpeg)\
  \ 查询特性目标\n\n特性（Attributes）是声明性标签，允许你将称为元数据（`metadata`）的信息与类、结构体、类型、属性、方法和其他成员关联。在开始学习\
  \ C# 时，你可能不需要频繁使用特性，但当你进入 Windows 和 Web 开发时，很可能需要它们。\n\n***提示***\n\n特性主题对于 ASP.NET\
  \ 和 Windows 平台的 C# 开发者来说是一个重要课题。然而，为了简化学习，如果你是 C# 新手，可以考虑快速略读本章，以便对特性和反射有一个初步认识，从而快速过渡到对\
  \ C# 学习早期更重要的的话题。\n\n特性存储关于结构的元数据。与特性相关的行为是独立于特性本身应用的。在程序运行期间的任何时候，都可以使用反射（reflection）技术查询与特定特性关联的结构。\n\
  \n### .NET Framework 特性\n\n为了理解特性是如何工作的，了解如何创建你自己的自定义特性会有帮助。不过，你可能并不经常创建自定义特性。你更有可能使用通过\
  \ .NET Framework 提供的预定义特性。本节不会列出所有可用特性，但会展示几个简单的特性，以便你了解它们的工作原理。\n\n在接下来的示例中，在类声明上方包含了一个名为\
  \ `Help` 的自定义特性，用于描述该类。类描述被传递给 `Help` 特性的参数，类版本被赋值给特性的 `Version` 属性。\n\n```csharp\n\
  [Help(\"This class manages client contact information.\", Version = “1.3\")]\nclass\
  \ Address { }\n```\n\n这里是另一个示例，它使用了 .NET Framework 中的 `XmlElement` 和 `XmlAttribute`\
  \ 特性来规定类属性转换为 XML 的方式：\n\n![image](img/00497.jpeg)\n\n如果这些属性存储了 Otto Frederick Rohwedder\
  \ 发明的第一台切片面包机专利的数据，那么生成的 XML 元素和属性名称将使用特性参数值而非属性名：\n\n![image](img/00498.jpeg)\n\
  \n在这里必须记住，特性存储的是元数据。转换行为是由独立于这些特性运行的程序实现的。特性可以与无限范围的行为关联，这些行为通常与特性分开编写。\n\n### 尝试一试\
  \ 22-1 实现特性练习\n\n此练习展示了 .NET Framework `System` 命名空间提供的 `Obsolete` 特性的实现。`Obsolete`\
  \ 特性可以放在结构上方，以警告开发者该结构已弃用，并且存在更现代替代方案。运行 Visual Studio 的程序会查询代码编辑器中的 `Obsolete`\
  \ 特性，并在标记结构被使用的地方显示警告或错误消息。`Obsolete` 特性接收一个用于 `message` 输入的字符串参数和一个布尔 `error` 参数，用于指示在错误列表中显示错误消息还是警告消息：\n\
  \n```csharp\nconst bool SHOW_AS_ERROR = true; // !SHOW_AS_ERROR 表示显示为警告。[Obsolete(\"\
  Use Console.WriteLine() instead.\", !SHOW_AS_ERROR)]\n```\n\n为了在 Visual Studio 中观察\
  \ `Obsolete` 特性如何工作，请尝试以下步骤：\n\n**1**. 创建一个新的控制台应用程序。\n\n**2**. 将 `Program.cs` 中的代码替换为图\
  \ 22-1 所示的代码。\n\n![image](img/00499.jpeg)\n\n* * *\n\n图 22-1 Obsolete 警告\n\n**3**.\
  \ 注意错误列表中的警告指示了结构被使用的位置。代码行下方有绿色波浪线下划。同样注意传递给特性的 `message` 参数的文本出现在错误列表中。由于触发了警告，代码仍然可以编译和运行。\n\
  \n**4**. 移除特性 `error` 参数中的非（NOT）运算符以传递 `true` 值。进行此更改后，注意出现了一个错误。错误中的代码行现在下方有红色波浪线。如所料，代码无法编译。\n\
  \n* * *\n\n### 创建和实现自定义特性\n\n为了进一步理解特性是如何工作的，让我们检查从头到尾创建并实现特性。\n\n记住，你可能更多地使用 .NET\
  \ Framework 定义的特性而不是创建自己的。你可能希望创建自定义特性，但这种情况并不常见。如果你不确定是否应该创建特性，可能通过其他方式实现该功能更好。\n\
  \n#### 继承 Attribute 类\n\n自定义特性被声明为继承自 `Attribute` 的类。在派生类内部，可以声明带有参数和属性的重载构造函数，以存储特性实例的元数据：\n\
  \n![image](img/00500.jpeg)\n\n#### 可选 AttributeUsage 特性\n\n在特性类声明上方，你可以包含一个可选的 `AttributeUsage`\
  \ 特性，以限制特性的实现方式和位置。要指定可以使用特性的结构类型，`AttributeTargets` 枚允许选择表 22-1 列出的任何结构。\n\n![image](img/00501.jpeg)\n\
  \n表 22-1 特性目标枚举\n\n布尔参数 `AllowMultiple` 决定是否可以在同一个特性声明中应用多个实例。布尔标志 `Inherited` 指明特性是否应用于派生类。以下是一个自定义特性类的声明示例，与之前的示例类似，但这次包含了可选的\
  \ `AttributeUsage` 特性：\n\n![image](img/00502.jpeg)\n\n#### 实现自定义特性\n\n要应用特性，在目标结构声明上方使用方括号列出特性。如果特性允许，还会包含参数值和属性。\n\
  \n\n\n\n\n有很多不同的方法可以查询属性元数据。无论如何，如果你实现了自定义属性，你将希望确定你的类型包含了哪些属性。\n\n### Type 类 (The\
  \ Type Class)\n\n来自 `System` 命名空间的 `Type` 类是用于提取数据类型信息的主类。任何数据类型的 `Type` 实例都可以通过对象的\
  \ `GetType()` 方法获取：\n\n![image](img/00504.jpeg)\n\n当类型名作为参数传递时，也可以使用 `typeof` 运算符来检索\
  \ `Type` 实例：\n\n```csharp\nType classType = typeof(ClassName);\n```\n\n### GetCustomAttributes()\n\
  \n可以通过 `Type` 对象的 `GetCustomAttributes()` 方法获取用在类型中的使用的属性。`GetCustomAttributes()`\
  \ 方法接收一个 `Type` 对象作为参数，并接收一个布尔参数，用于指定是否在父类中搜索该属性。对于属性和事件，`inherit` 参数会被忽略。\n\n```csharp\n\
  var attributes = classType.GetCustomAttributes(Type attributeType,bool inherit);\n\
  ```\n\n一旦获取了属性列表，就可以使用 `foreach` 循环遍历每个 `Attribute` 实例：\n\n```csharp\nforeach(Attribute\
  \ attribute in attributes) { }\n```\n\n***\n\n**示例 22-1** 检查属性\n\n此示例展示了如何声明、包含和查询一个名为\
  \ `Help` 的自定义属性，该属性存储了类的详细信息和版本信息。属性查询通过调用 `GetCustomAttributes()` 运行。检索了应用于 `StartApp`\
  \ 和 `EndApp` 类中的所有 `Help` 属性，并显示了每个属性的属性值。\n\n![image](img/00505.jpeg)\n\n由于 `Help`\
  \ 属性被 `StartApp` 和 `EndApp` 类型应用，因此在运行程序时会显示两组 `Detail` 和 `Version` 属性：\n\n```\n\
  Contains setup methods. Version: Undefined Contains shutdown methods. Version: 1.0\n\
  ```\n\n***\n\n### 尝试一试 22-2 实现和查询自定义属性\n\n这个练习提供了一个创建和查询自定义属性的实践机会。\n\n1. 为示例 22-1\
  \ 中的 `Help` 属性类添加一个 `Author` 属性。\n2. 调整 `Help` 属性类，以便你能够为 `Programmer` 属性赋值。\n3.\
  \ 修改每个应用 `Help` 属性的地方，将你的名字设置为 `Programmer` 属性的值。\n4. 调整代码，使得当在查询 `Type` 对象时发现 `Help`\
  \ 属性时，`Programmer` 属性值会与 `Detail` 和 `Version` 属性一起显示。\n\n***\n\n### 反射简介 (Reflection\
  \ Introduction)\n\n搜索属性是有用的，但你还需要了解这些属性所针对的成员。你可以使用反射来获取这些信息。`Reflection` 是一种允许你获取数据类型元数据的技术。元数据可以包含关于类型成员的信息，可能包括构造函数、方法、枚举、属性、事件和变量。\n\
  \n***注意***\n\n反射可以用于调用类型成员，但本书将不会涵盖这一主题。\n\n在反射过程中，关于数据类型的信息主要从 `Type` 对象中获取。有很多可用的方法可以收集有关\
  \ `Type` 对象的信息。表 22-2 突出了获取成员信息的常用 `Type` 方法。`Type` 方法的返回类型通过 `System.Reflection`\
  \ 命名空间可用。\n\n![image](img/00506.jpeg)\n\n**表 22-2** Type 方法\n\n***\n\n**示例 22-2**\
  \ 从类型对象获取元数据\n\n此示例展示了如何使用反射提取关于 `StartApp` 类内部结构的信息。`System.Type` 方法 `GetFields()`、`GetProperties()`、`GetConstructors()`、`GetMethods()`\
  \ 和 `GetMembers()` 被用来检索这些相关结构。检索后，将显示检索到的集中每个成员的 `Name` 属性。\n\n![image](img/00507.jpeg)\n\
  \n输出显示了 `GetFields()`、`GetProperties()`、`GetConstructors()`、`GetMethods()` 和 `GetMembers()`\
  \ 方法如何从 `StartApp` 类型中提取不同的结构。注意，`GetMembers()` 将所有字段、属性、构造函数和方法结合在一起，因为每一个都是成员。`ToString()`、`Equals()`、`GetHashCode()`\
  \ 和 `GetType()` 方法存在，是因为它们是任何 C# 对象固有的。\n\n```\n* 字段数据 *\nclassLevelVariable\n*\
  \ 属性数据 *\nStarted\n* 构造函数数据 *\n.ctor\n* 方法数据 *\nget_Started\nset_Started\nShowStartTime\n\
  ToString\nEquals\nGetHashCode\nGetType\n* 成员数据 *\nget_Started\nset_Started\nShowStartTime\n\
  ToString\nEquals\nGetHashCode\nGetType\n.ctor\nStarted\nclassLevelVariable\n```\n\
