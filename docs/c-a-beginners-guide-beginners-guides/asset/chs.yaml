  ## 使用 LINQ 进行连接查询\n\n### 关键技能与概念\n\n![Image](img/0002.jpeg) 关系型数据库理论入门\n![Image](img/0002.jpeg)\
  \ 导航属性\n![Image](img/0002.jpeg) 等值连接\n![Image](img/0002.jpeg) 外连接\n![Image](img/0002.jpeg)\
  \ 连接两个及以上的集合\n![Image](img/0002.jpeg) 桥接多对多关系\n\n* * *\n\n本章的目标是提供执行主要类型连接所需的控制。。在使用\
  \ LINQ to Entities 时，你通常需要从多个表中查询值。结合来自多个表的相关行的查询被称为连接。这里介绍的方法是根据灵活性简单性而选择的。\n\n\
  ### 引用数据库\n\n与之前的章节一样，为了构建任何代码示例，从一个具有引用 FoodStore 数据库的实体数据模型的新控制台应用程序开始。将 `Main()`\
  \ 的代码替换为\n\n```csharp\nstring[] manufacturers = new string[] { “Florida Orange”,\
  \ “California Orange”, “California Gold” };\nvar mfgQuery = manufacturers.Where(m\
  \ => m.Contains(“Orange”));\n```\n\n然后，使用基于方法的句法编写 LINQ 查询，从 `Manufacturer` 表中选择\
  \ `mfg` 和 `mfgDiscount` 值，其中 `mfg` 名称存在于 `mfgQuery` 结果集中。\n\n\n\n\n由多个列组成的主键被称为\
  \ `composite key`（复合键）。使用多个列的组合来创建主键只有当这些列的组合符合 `minimal form`（最小形式）时才是有效的，这意味着复合键的所有列都必须用于创建唯一标识符。考虑一种情况，你存储了不同建筑内房间的信息。房间号和建筑名称的组合可以唯一标识每个房间，因此这两列可以组合形成主键。这个复合主键处于最小形式，因为它没有多余的数据，且两列都是创建唯一标识符所必需的。考虑另一种情况，开发者想在复合主键中使用社会安全号码（SSN）和姓氏。SSN\
  \ 本身已经是一个唯一标识符，因此在键中包含姓氏是多余或冗余的。由于创建唯一标识符不需要姓氏，这种列的组合不符合最小形式，不能作为主键。相反，SSN 本身符合最小形式，并是作为主键的有效候选者。\n\
  \n## 外键\n\n`foreign key`（外键）是一个表中的列或多个列的组合，它引用另一个表中的主键。表中的若干行可能包含相同的外键值。外键列也可以为\
  \ null。在处理 `FoodStore` 数据库时，`branch` 列唯一标识 `Store` 表中的每一行，因此它是 `Store` 表的主键。相比之下，`Invoice`\
  \ 表的 `branch` 列是 `Store` 表中 `branch` 列的外键。\n\n图 17-1 显示了 `FoodStore` 实体数据模型概念视图的一部分。`Store`\
  \ 表的主键通过 `branch` 列旁边的键符号进行标识。`branch` 列也出现在 `Invoice` 表中，因为它是一个匹配 `Store` 表主键的外键。\n\
  \n![image](img/00345.jpeg)\n\n* *\n\n**图 17-1** Store 和 Invoice 实体关联\n\n## 基数\n\n\
  在编写查询时，确定从一个表到另一个表的实例数量是非常重要的。`Cardinality`（基数）是一种描述从一个表或实体到另一个表或实体的总实例的表示法。数量基数表示法汇总在\
  \ 表 17-1 中。\n\n![image](img/00346.jpeg)\n\n**表 17-1** 基数表示法\n\n要观察基数如何应用于数据库图，请查看\
  \ 图 17-1，该图显示了实体数据模型概念视图的一个部分。`Store` 实体旁边的 `0..1` 符号与 `Invoice` 实体旁边的 `*` 符号组合表示一个商店可以有许多发票。这种表示法还表示发票只能为零个或一个商店生成。由于一张发票属于\
  \ `0..1` 个商店，这意味着可以先创建发票，稍后分配给商店。你可能还会注意到 `Invoice` 和 `Store` 表通过 `branch` 列关联，其中\
  \ `branch` 是 `Store` 表的主键，而 `branch` 是 `Invoice` 表的外键。父表在关系中托管主键，因此对于这种情况来说，`Store`\
  \ 表是父表。父表可以有很多子表，因此在这种情况下，`Invoice` 实体是子表，因为一个商店可以有许多发票。\n\n为了进一步从关系或关联的角度检查基数，请查看\
  \ 图 17-2，该图显示了实体之间三种不同的关联。在检查 `Building` 和 `Store` 之间的关联时，基数明确了一个 `Building` 可以有零个或多个\
  \ `Store` 实例。然而，一个 `Store` 必须存在于一个 `Building` 中。由于一个建筑有很多商店，我们可以说 `Building` 表是父表，`Store`\
  \ 表是子表。\n\n![image](img/00347.jpeg)\n\n* *\n\n**图 17-2** 关联类型\n\n图 17-2 中 `Product`\
  \ 和 `Invoice` 实体之间关系的关联和基数描述了一种完全不同的关系。一个 `Product` 可以列在许多发票上，一个 `Invoice` 对象可以列出许多产品。这是一种多对多的关系。在关系数据库设计中实际上是不允许多对多的关系的。为了避免这种情况，会在两个父表之间插入第三张表。这第三张表通常有不同的名称，例如桥表（bridge\
  \ table）、交叉表（junction table）或链接表（link table）。附录 中 图 A-1 实体关系图中的 `ProductInvoice`\
  \ 表就是缓解多对多关系的桥表示例。\n\n图 17-2 中的第三种关联描述了 `Person` 和 `SecurityCode` 对象之间的关系。对于这个例子，一个\
  \ `Person` 可能拥有零个安全代码或一个安全代码。当从反方向读取此关联时，我们也可以说每个安全代码只属于一个人。你可能会建议将安全代码存储在 `Person`\
  \ 表中，这是一个可行的可能性。\n\n## 导航属性\n\n在编写连接表的 LINQ 查询时，你将需要导航属性（navigation properties）。导航属性暴露在实体数据模型中，以便轻松引用另一个实体。正如你之前在\
  \ 图 17-1 中所示，`Store` 实体列出了 `Building`、`Employees`、`Invoices` 和 `PurchaseOrders`\
  \ 的 `DbSet` 导航属性。同样，`Invoice` 实体列出了 `Store`、`ProductInvoice` 和 `Products` 的集合。导航属性提供了简单的语法替代方案，当我们在本章节后面讨论多对多关系时，它们将证明是一项重要的功能。\n\
  \n### 尝试 17-1 测试你的数据库知识\n\n此练习让你练习使用关系数据库理论。请使用 图 17-3 回答以下问题：\n\n![image](img/00348.jpeg)\n\
  \n* *\n\n**图 17-3** Building 和 Store 实体关联\n\n1. 如果存在，请标识 `Building` 实体主键的属性或属性。\n\
  2. 如果存在，请标识 `Store` 实体主键的属性或属性。\n3. 如果存在，请标识创建 `Building` 实体外键的属性或属性。\n4. 如果存在，请标识创建\
  \ `Store` 表外键的属性或属性。\n5. 一个建筑可以包含多少商店？\n6. 一个商店可以关联多少建筑？\n7. 每个表可以指定多少个主键？\n8. 标识\
  \ `Store` 实体的导航属性。\n9. 标识 `Building` 实体的导航属性。\n\n## 等值连接\n\n在本章开始时，提到了 *join*（连接）术语来描述相关数据集行的组合。`equal\
  \ join`（等值连接）也称为 `inner join`（内连接），是最常见的连接类型。等值连接从两个具有匹配的主键和外键值的表的行中检索数据。\n\n####\
  \ 使用查询语法的等值连接\n\n\n\n\n有几种不同的方法可以使用 LINQ 查询语法执行等值连接（equal joins）。为了简单和灵活，我倾向于为每个\
  \ `DbSet` 使用两个独立的 `from` 子句，同时在 `where` 子句中定义连接列。每个 `DbSet` 在查询中列出的顺序并不重要——无论顺序如何，查询结果都是相同的。\n\
  \n***\n\n## 示例 17-1 使用查询语法的内连接\n\n此示例执行内连接以显示与每个 `Store` 关联的所有 `invoiceNum` 值，以及相关的商店分支和地区数据。要构建此示例，像本章中的所有示例一样，创建一个新的控制台应用程序并添加一个引用\
  \ `FoodStore` 数据库中所有表的 EDM。然后，在 `Main()` 方法中添加以下代码：\n\n![image](img/00349.jpeg)\n\
  \n输出显示了所有关联商店分支及其发票号：\n\n`Vancouver - BC - 1001`\n`Vancouver - BC - 1002`\n`Kamloops\
  \ - BC - 1003`\n`Mission - BC - 1004`\n`Seattle - WA - 1005`\n\n如果你使用服务器资源管理器/数据库管理器检查\
  \ `Store` 表数据，你会发现 `Store` 表存在一个名为“Richmond”的 `branch` 值，但它没有出现在此示例的输出中。“Richmond”未出现在输出中，是因为没有与该分支关联的发票。同样，如果你检查\
  \ `Invoice` 表数据，你会发现存在一张 1006 号发票，但它没有出现在此示例的输出中。发票 1006 未出现在输出中，是因为没有为它分配 `branch`\
  \ 值。\n\n***\n\n### 基于方法的语法的等值连接\n\n使用基于方法的语法执行等值（内）连接时，`DbSet` 提供了一个此用的 `Join()`\
  \ 扩展方法。在 `Join()` 方法内部，你定义了关联的 `DbSet` 以及关联列。最后一个参数定义了查询组合的实体：应用 `Join()` 方法后，随后的扩展方法可以访问表示已连接实体的对象。\n\
  \n***\n\n## 示例 17-2 使用扩展方法的内连接\n\n此示例中的查询在 `Invoice` 和 `Store` 表之间通过 `branch` 列执行等值连接。还添加了\
  \ `Where()` 扩展方法以仅选择来自 Vancouver 的分支。\n\n![image](img/00350.jpeg)\n\n运行程序时，数据集通过等值连接（其中分支为\
  \ Vancouver）包含了来自 `Invoice` 表和 `Store` 表的两个列：\n\n`Invoice 1001: Vancouver, BC`\n\
  `Invoice 1002: Vancouver, BC`\n\n***\n\n### 使用导航属性的等值连接\n\n到本书为止，在两个相邻实体之间执行等值连接的查询语法和基于方法的语法均正常工作，无论实体在查询中的顺序如何。这种语法在多对一或一对多的关系中任何方向上都能精确工作。然而，与其以这种方式执行连接，你可以使用另一个实体中仅有一个匹配行的实体的导航属性。例如，在\
  \ `FoodStore` 数据库中，一个 `Store` 对象与许多 `Invoice` 对象关联，但每个 `Invoice` 对象只关联一个 `Store`\
  \ 对象（参见图 17-1）。由于 `Invoice` 对象只关联到 `Store` 实体的一个实例，因此可以使用 `Invoice` 实体的 `Store`\
  \ 导航属性执行等值连接。\n\n***注意***\n\n在两个具有导航属性的实体之间执行等值连接时，请务必检查连接列中的空值；否则，引用父对象的导航属性将为\
  \ null。此额外步骤可以防止在尝试访问空导航属性的数据时发生错误。\n\n***\n\n## 示例 17-3 使用查询语法和导航属性的等值连接\n\n此演示展示了如何使用查询语法通过\
  \ `Invoices` `DbSet` 的 `Store` 导航属性从 `Invoice` 和 `Store` 表检索值：\n\n![image](img/00351.jpeg)\n\
  \n输出显示了 `Store` 和 `Invoice` 表中存在匹配 `branch` 列值的所有相关的 `branch`、`region` 和 `invoiceNum`\
  \ 数据。输出显示了从示例 17-1 查询中获得的相同行数据。\n\n***\n\n## 示例 17-4 使用基于方法的语法和导航属性的等值连接\n\n此示例在使用\
  \ `Invoices` 数据集的导航属性的同时，执行与示例 17-3 完全相同的查询。然而，这次使用基于方法的语法来实现查询。\n\n![image](img/00352.jpeg)\n\
  \n运行此示例的输出与示例 17-1 和示例 17-3 中生成的输出相同。\n\n***\n\n### 尝试 17-2 与等值连接\n\n此练习提供了一个同时使用查询语法和基于方法的语法创建简单连接的机会。\n\
  \n1. 创建一个引用 `FoodStore` 数据库的实体模型的控制台应用程序。\n2. 使用查询语法在 `Employee` 和 `Store` 表之间创建内连接。显示\
  \ `Store` 表的 `branch` 列以及 `Employee` 表的 `first_name` 和 `last_name` 列。\n3. 使用基于方法的语法实现与步骤\
  \ 2 相同的结果。\n4. 添加使用导航属性执行与步骤 2 相同的代码。\n\n***\n\n### 复合键的等值连接\n\n当主键由多个列创建时，它被称为*复合键*。连接复合键比连接单列稍微复杂。\n\
  \n#### 使用查询语法的复合键等值连接\n\n在使用查询语法执行具有复合键的实体之间的内连接时，一种方法是为每个实体包含 `from` 子句，并将连接列放在\
  \ `where` 子句中。\n\n*** 示例 17-5 使用查询语法的多列连接\n\n此示例展示了如何通过连接 `building_name` 和 `unit_num`\
  \ 列从 `Store` 和 `Building` 实体检索值：\n\n![image](img/00353.jpeg)\n\n运行此代码的输出显示了存在匹配键的\
  \ `Building` 和 `Store` 列值。此外注意，“Richmond”商店不存在，City Center 的单元 2381 也不存在，因为这些项目没有匹配的键。\n\
  \n`Branch: Kamloops, BC`\n`Building: Vineyard Estates, unit #180, capacity: 20400`\n\
  `Branch: Mission, BC`\n`Building: Peaceful Place, unit #226, capacity: 18000`\n\
  `Branch: Seattle, WA`\n`Building: Fairlane Square, unit #17235, capacity: 45000`\n\
  `Branch: Vancouver, BC`\n`Building: City Center, unit #2380, capacity: 40000`\n\n\
  ***\n\n#### 使用基于方法的语法的复合键等值连接\n\n在使用扩展方法执行复合键连接时，一个 `DbSet` 的 `SelectMany()` 扩展方法接收对连接列进行过滤的另一个实体\
  \ `DbSet`。\n\n*** 示例 17-6 使用扩展方法的多列连接\n\n此示例展示了如何使用 `SelectMany()` 方法执行多列连接以从 `Store`\
  \ 和 `Building` 表检索数据：\n\n![image](img/00354.jpeg)\n\n运行此代码的输出与示例 17-5 中使用查询语法执行相同连接的输出相同。\n\
  \n***\n\n#### 使用导航属性的复合键等值连接\n\n\n\n\n要实现多列等值连接的导航属性，等值连接查询中使用的 `DbSet` 必须是那个在相邻实体中仅有一个匹配实例的实体。\n\
  \n**示例 17-7** 带有导航属性的复合键等值连接\n\n此示例展示了如何使用基于方法的语法在 `Store` 和 `Building` 表之间执行等值连接。在这种情况下，为了连接来自每个表的数据，需要匹配每个表中相同的\
  \ `building_name` 和 `unit_num` 值。由于一个 `Store` 对象只与一个 `Building` 实例关联，因此必须使用 `Stores`\
  \ `DbSet` 的 `Building` 导航属性从 `Building` 表中检索数据。\n\n![image](img/00355.jpeg)\n\n\
  运行此示例的输出与 示例 17-5 和 示例 17-6 中生成的输出相同。\n\n## 外连接 (Outer Joins)\n\n外连接（outer join）是两个数据表之间的连接，其中至少一个表的所有行都会被选中，无论在另一个表中是否存在匹配项。数据库开发者通常将特定类型的外连接描述为左连接、右连接和全外连接。LINQ\
  \ 对这些连接类型没有进行直接区分，但它们在 LINQ 中是可能的，因此在这里进行了描述。\n\n### 左外连接 (Left Outer Joins)\n\n\
  左外连接从左表选择所有所需的列和行。每当找到相关的行时，左外连接会包含右表的列值。如果不存在匹配的右表行，则用 null 值代替。\n\n图 17-4 中的韦恩图提供了左外连接的视化总结。无论右表中是否存在匹配的键，左表的所有行都会被选中。由于左表的所有行都被选中，因此左表是深色的。右表中被选中的匹配行通过左表和右表的交集表示。\n\
  \n![image](img/00356.jpeg)\n\n**图 17-4** 左外连接选中的行\n\n#### 使用 LINQ 执行左外连接\n\n可以使用多种技术执行左外连接查询。为了简单起见，我混合使用了查询语法和扩展方法来执行此类查询。\n\
  \n**示例 17-8** 左外连接\n\n以下代码示例展示了如何在 `branch` 列上在 `Store` 和 `Invoice` 表之间执行左连接。`Store`\
  \ 实体被视为左实体。查询检索每个商店的信息，无论其是否拥有发票。由于 `Store` 实体被视为左表，它被放置在第一个 `from` 子句中，该子句请求此表的所有行。第二个\
  \ `from` 子句在主键和外键列之间存在匹配项的地方从右表检索行。在第二个 `from` 子句后附加了 `DefaultIfEmpty()` 扩展方法，以便在右表中未找到匹配项时允许空值的存在。在\
  \ `select` 子句中，每当遇到空数据时，条件操作符会将右表的 `invoiceNum` 值赋值为 0。\n\n![image](img/00357.jpeg)\n\
  \n如预期的，显示的数据集显示了来自 `Store` 表的所有列值，无论该商店是否有发票。对于此示例，“Richmond”的发票被分配了值 0，因为“Richmond”分店没有发票。\n\
  \n`Kamloops - BC - 1003`\n`Mission - BC - 1004`\n`Richmond - BC - 0`\n`Seattle -\
  \ WA - 1005`\n`Vancouver - BC - 1001`\n`Vancouver - BC - 1002`\n\n### 右外连接 (Right\
  \ Outer Joins)\n\n右外连接检索右表的所有行以及左表的任何匹配行。无论左表中是否存在匹配项，都会从右表中检索行。图 17-5 中的韦恩图显示右表是深色的，因为从该表中选取了所有行。左表中被选中的行通过左表和右表的交集表示。\n\
  \n![image](img/00358.jpeg)\n\n**图 17-5** 右外连接选中的行\n\n#### 使用 LINQ 执行右外连接\n\n尽管 LINQ\
  \ 不允许你直接区分左连接和右连接，但通过将右表视为外表，可以使用 LINQ 间接执行右连接。在这种情况下，必须对内部表进行空值处理。换句话说，此查询的执行方式与左连接相同，只是查询中表的顺序反过来了。\n\
  \n**示例 17-9** 右外连接\n\n此示例演示了 `FoodStore` 数据库中 `Invoice` 和 `Store` 实体之间的右外连接，其中 `Invoice`\
  \ 表被视为右实体。因此，`Invoice` 实体是与 `Stores` `DbSet` 连接时的外表。当 `Store` 实体的列值为空时，必须对其调整。\n\
  \n与 示例 17-8 比较时，你会发现查询结构基本上相同，只是 `DbSet` 的位置反过来了。此外，空值处理现在是针对 `Store` 列而不是 `Invoice`\
  \ 列的。\n\n![image](img/00359.jpeg)\n\n运行程序时，外表 `Invoice` 的所有行都被选中，并在发现匹配项时从 `Store`\
  \ 中检索值：\n\n`Vancouver - BC - 1001`\n`Vancouver - BC - 1002`\n`Kamloops - BC - 1003`\n\
  `Mission - BC - 1004`\n`Seattle - WA - 1005`\n`null - null - 1006`\n\n## 全外连接 (Full\
  \ Outer Joins)\n\n全外连接从连接的两个关联表中检索列，无论是否存在主键-外键匹配。图 17-6 中的韦恩图显示两个表的所有行都被选中。\n\n\
  ![image](img/00360.jpeg)\n\n**图 17-6** 全外连接选中的行\n\n#### 使用 LINQ 执行全外连接\n\nLINQ to\
  \ Entities 中没有全外连接运算符。然而，你可以通过对同一两个表的左、右外连接进行并集来实现全外连接。\n\n**示例 17-10** 全外连接\n\n\
  此示例演示了 LINQ 查询语法如何在 `Store` 和 `Invoice` 表之间执行全外连接。简单来说，最终查询实际上是 `Stores` 的外连接通过与\
  \ `Invoices` 的外连接合并而成的。\n\n![image](img/00361.jpeg)\n\n当你运行这段代码时，结果显示了来自两个表的所有行的数据。注意当相邻表中不存在键时，是如何分配空值和零的。\n\
  \n`Kamloops - BC - 1003`\n`Mission - BC - 1004`\n`null - null - 1006`\n`Richmond\
  \ - BC - 0`\n`Seattle - WA - 1005`\n`Vancouver - BC - 1001`\n`Vancouver - BC - 1002`\n\
  \n### 在一个查询中连接多个集合\n\n在一个查询中连接多个集合时，为了简单起见，有时一次连接两个相邻集合更为容易。连接两个集合的结果可以被视为单个 `ObjectQuery`\
  \ 实例，之后可以与另一个 `ObjectQuery` 实例连接。你可能会尝试在一个单一查询定义中组合多个表，但如果在推导逻辑时查询变得过于复杂，请考虑将其拆分。由于延迟执行，一系列累积连接的最终\
  \ `ObjectQuery` 将包含生成一个高效命令所需的所有信息。\n\n**示例 17-11** 在一个查询中连接多个集合\n\n\n\n\n\n此示例演示了如何显示所有项目列表中包含橙汁的发票的产品详情和发票详情。为了收集所有这些信息，需要对\
  \ `Products`、`ProductInvoiceWithQuantities` 和 `Invoices` 集合进行连接。为了帮助将构建查询的过程拆分为不同的子查询，此查询是以累积的方式生成的。第一个查询是\
  \ `Product` 表和 `ProductInvoiceWithQuantity` 表之间的内连接。第二个查询是第一个查询与 `Invoice` 表之间的内连接。你可能更倾向于编写一个连接所有实体的单条查询，但此演示展示了如何拆分逻辑，以防你可能将逻辑拆分为更通通的步骤。\n\
  \n![image](img/00362.jpeg)\n\n最终查询的结果显示了来自所有三个表的数据，用于汇总任何包含橙汁销售额的发票的产品和发票信息：\n\n\
  ![image](img/00363.jpeg)\n\n* * *\n\n### 桥接多对多关系\n\n我们目前为止所查询的表之间的关系涉及表之间的连接，其中一个实体与另一个实体的多个实例关联。然而，可能存在多对多的关系。在图\
  \ 17-7 中，注意 `Invoice` 和 `Product` 实体之间存在多对多的关系。在 `Invoice` 和 `Product` 实体之间的关联线末端表示多多的基数符号\
  \ `*` 所在的位置，你可以识别出这种关系。\n\n![image](img/00364.jpeg)\n\n* * *\n\n**图 17-7** 多对多关系\n\
  \n很清楚，一个产品可以出现在许多发票上，而一张发票可以有许多产品。然而，关系型数据库设计不允许存在多对多的关系，因为它们不允许表行之间存在唯一定义的关系。解决此问题是在存在多对多关系的地方，在两个父实体之间创建一个表。此子表包含链接到父实体主键的外键。正如本章前面部分提到的，这个新表通常被称为桥表（bridge\
  \ table）、连接表（junction table）或链接表（link table）。图 17-7 实际上显示了一个名为 `ProductInvoiceWithQuantity`\
  \ 的桥表。该表出现在实体数据模型（Entity Data Model）的逻辑视图中，因为它有一个唯一的 `quantity` 属性，而该属性在任何一个父表中都没有出现。然而，如果你使用\
  \ Server Explorer/Database Explorer 浏览数据库表，你会发现还有一个 `ProductInvoice` 表，它同时也用作 `Invoice`\
  \ 和 `Product` 表的桥梁（参见图 17-8）。\n\n![image](img/00365.jpeg)\n\n* * *\n\n**图 17-8**在\
  \ Server Explorer/Database Explorer 中查看桥表\n\n***注意***\n\n通常，实体之间只存在一个桥表。但在前面的示例中，特意在\
  \ `Product` 和 `Invoice` 表之间添加了两个桥表，以演示具有唯一列的表与仅由父实体外键组成的表之间的区别。\n\n`ProductInvoice`\
  \ 中的复合主键由引用父表主键的外键组成，该表中没有其他唯一列。当桥表中没有唯一列时，该实体将不会出现在实体数据模型中。这为我们编写 LINQ 命令的方式带来了了挑战。\n\
  \n#### 查询桥表对象\n\n即使连接表没有出现在实体数据模型中，导航属性（navigation properties）也允许我们在从数据库读取数据时访问桥接数据。\n\
  \n* * *\n\n* *\n\n**示例 17-12** 查询桥接表对象\n\n* * *\n\n此示例演示了如何使用导航属性为订购了蛋糕粉（cake mix）的发票显示相应的发票和产品详情。\n\
  \n如之前在图 17-7 中所示，连接 `Invoice` 和 `Product` 表的 `ProductInvoice` 表不在实体数据模型中。然而，如果你使用\
  \ Server Explorer/Database Explorer 工具，你会发现表确实存在。要显示特定 `Invoice` 对象的产品详情（此时 `Product`\
  \ 和 `Invoice` 表之间存在桥接），可以使用 `Products` `DbSet` 的 `Invoices` 导航属性来引用数据。在本示例的查询中，有两个\
  \ `from` 子句。第二个 `from` 子句使用 `Products` `DBSet` 的别名来引用 `Invoices` 导航属性。别名 `i` 被分配给\
  \ `Invoices` 导航属性，然后就可以引用 `Invoice` 表的列。\n\n![image](img/00366.jpeg)\n\n最终结果显示了通过\
  \ `ProductInvoice` 表桥接的 `Product` 和 `Invoice` 表的列值：\n\n```\n1, 1001, Vancouver,\
  \ Cake Mix\n1, 1004, Mission, Cake Mix\n```\n\n* * *\n\n#### 插入桥表对象\n\n当向未在实体数据模型中公开的桥表添加行时，你必须先获取每个父表对应对象的对象引用。然后，通过其中一个对象，你可以将另一个父表的\
  \ `DbSet` 作为导航属性进行引用。导航属性的 `Add()` 方法将关联对象作为参数插入，以创建链接表条目。\n\n* * *\n\n* *\n\n**示例\
  \ 17-13** 插入桥表对象\n\n* * *\n\n此示例演示了如何向 `ProductInvoice` 表添加一个 `productID` = 4 且\
  \ `invoiceNum` = 1004 的桥表条目。换句话说，它取了一个现有的产品并将其添加到现有的发票。首先，获取 `Product` 和 `Invoice`\
  \ 表的关联父对象。在运行示例之前，为了确认此条目不存在，请从 Server Explorer/Database Explorer 查看 `ProductInvoice`\
  \ 表的内容（参见第 13 章，示例 13-3）。\n\n![image](img/00367.jpeg)\n\n运行此程序时，一个 `invoiceNum`\
  \ 值为 1000 且 `productID` 为 4 的新条目在添加到数据库后将会出现：\n\n```\ninvoiceNum: 1004 productID:\
  \ 1\ninvoiceNum: 1004 productID: 2\ninvoiceNum: 1004 productID: 3\ninvoiceNum: 1004\
  \ productID: 4\n```\n\n此时，你可能想通过在 Server Explorer/Database Explorer 浏览数据来确认该条目确实已保存到数据库。请记住，如果你使用的是数据库文件，只有当\
  \ `FoodStore.mdf` 文件的“Copy to Output Directory”（复制到输出目录）属性设置为“Copy if newer”（如果较新则复制）时，更改才会被保存。为了确保你浏览的是正确的数据库副本，你的\
  \ Server Explorer/Database Explorer 连接需要引用复制到项目 bin 文件夹的数据库文件。\n\n另外请注意，在使用此示例的\
  \ `Add()` 方法时，你可以反转对象和导航属性的顺序以执行相同的对象插入。例如，你可以将\n\n```\ninvoice.Products.Add(product);\n\
  ```\n\n替换为\n\n```\nproduct.Invoices.Add(invoice);\n```\n\n***提示***\n\n在使用导航属性向链接表添加对象时，该对象不需要已经存在于父表中。在示例\
  \ 17-13 中，你可以创建并初始化一个新的 Product 对象。然后，你可以使用指令 `invoice.Products.Add(product)` 将此新对象同时添加到\
  \ Product 实体和 ProductInvoice 表中。\n\n\n\n\n\n要从桥表中删除未在实体数据模型（Entity Data Model）中公开的项，你必须先获取父对象的引用。对象导航属性的\
  \ `Remove()` 方法接收关联对象作为参数。通过 `SaveChanges()` 方法将事务提交到数据库。\n\n***\n\n**示例 17-14**\
  \ 删除桥表对象\n\n***\n\n在此示例中，代码删除了 `invoiceNum` 值为 1004 且 `productID` 为 4 的 `ProductInvoice`\
  \ 条目。该删除操作基本上是将此项从发票中移除，但并不会删除发票或实际产品。\n\n![image](img/00368.jpeg)\n\n运行程序时，你会发现发票号为\
  \ 1004 产品号为 4 的桥表项不再存在：\n\n`invoice: 1004 productID: 1`\n\n`invoice: 1004 productID:\
  \ 2`\n\n`invoice: 1004 productID: 3`\n\n使用 `Remove()` 方法时，可以反转对象的顺序以产生相同的结果。要删除桥表条目，可以将指令\n\
  \n```\ninvoice.Products.Remove(product);\n```\n\n替换为\n\n```\nproduct.Products.Remove(invoice);\n\
  ```\n\n如果你使用服务器资源管理器（Server Explorer）/数据库资源管理器（Database Explorer）浏览 `ProductInvoice`\
  \ 表，你会发现 `invoiceNum` 为 1004 且 `productID` 为 4 的条目已不存在。\n\n***\n\n***\n\n#### ![Image](img/00018.jpeg)\
