  ![image](img/00390.jpeg)\n\n接下来，将 `Program.cs` 中的生成代码替换为以下代码以引用 `DataAccessLayer`\
  \ 命名空间：\n\n![image](img/00391.jpeg)\n\n当你运行程序时，每个命令的输出显示在窗口中：\n\n```\n1, Cake Mix,\
  \ Duncan Hines, Sysco, 2.9900,\n2, Cookie Dough, Duncan Hines, Sysco, 1.2500,\n\
  3, Orange Juice, Florida Orange, GFS, 4.2500,\n4, Cookie Dough, Pillsbury, GFS,\
  \ 1.4500,\n5, Carrots, Hot House, GFS, 1.0100,\n```\n\n### 使用 SqlDataReader 类流式处理数据\n\
  \n当 C# 应用程序运行大型数据库查询时，你可能倾向或需要使用 `SqlDataReader` 类而不是 `SqlDataAdapter` 类。与 `SqlDataAdapter`\
  \ 类一样，`SqlDataReader` 类也是 `System.Data.SqlClient` 命名空间的一部分。然而，`SqlDataReader` 对象逐行执行数据库查询，因此对内存的需求较小。这种逐行读取的过程被称为*流式处理*。使用\
  \ `SqlDataReader` 类进行流式处理允许你以单向的方式读取数据，因此与 `SqlDataAdapter` 类相比，你无法同样灵活地导航数据集。`SqlDataReader`\
  \ 类的另一个挑战是，打开、使用和关闭连接需要额外的工作，而 `SqlDataAdapter` 类则自动处理了这些这些步骤。\n\n\n\n\n使用 `SqlDataReader`\
  \ 类时，你必须手动管理数据库连接。此任务使用 `SqlConnection` 类来完成。要初始化 `SqlConnection` 对象，请将连接字符串作为参数传递给构造函数，如下所示。一旦初始化了\
  \ `SqlConnection` 对象，在运行查询之前必须调用 `SqlConnection` 对象的 `Open()` 方法。\n\n![image](img/00392.jpeg)\n\
  \n### 初始化命令\n\n`SqlDataReader` 类使用 `SqlCommand` 类来执行原始 SQL 和存储过程。当与 `SqlDataReader`\
  \ 类配合使用时，`SqlCommand` 对象以 SQL 字符串或存储过程名称以及 `SqlConnection` 对象作为参数进行初始化：\n\n```\n\
  SqlCommand sqlCommand = new SqlCommand(“spGetAllProducts”, sqlConnection);\n```\n\
  \n### 使用 SqlDataReader 类检索数据\n\n在使用打开的数据库连接初始化 `SqlCommand` 对象后，调用 `SqlCommand`\
  \ 对象的 `ExecuteReader()` 方法返回一个 `SqlDataReader` 对象：\n\n```\nSqlDataReader reader\
  \ = sqlCommand.ExecuteReader();\n```\n\n`SqlDataReader` 对象的 `Read()` 方法允许对命令返回的数据行进行迭代。在第一个示例中，使用列名引用查询的每列：\n\
  \n![image](img/00393.jpeg)\n\n在下一个示例中，使用数字索引引用数据集的每列：\n\n![image](img/00394.jpeg)\n\
  \n### 关闭 SqlDataReader 和 SqlConnection 对象\n\n一旦完成 `SqlDataReader` 对象的读取，请调用其 `Close()`\
  \ 方法以释放该对象访问的资源。同样，在读取完成后，由于相同的原因，调用 `SqlConnection` 对象的 `Close()` 方法。\n\n![image](img/00395.jpeg)\n\
  \n* * *\n\n* * *\n\n**示例 18-5** 使用 SqlDataReader 类执行 SQL\n\n* * *\n\n这是一个使用 `SqlDataReader`\
  \ 类流数据的简单示例。`SqlDataReader` 对象首先使用打开的 `SqlConnection` 对象和 SQL 字符串“SELECT * FROM\
  \ Product”作为参数初始化。然后，`SqlDataReader` 对象将 SQL 查询发送到数据库执行。该 SQL 查询告诉数据库选择 `Product`\
  \ 表中所有行的所有值。读取器在打印其中包含的列之前，先从数据库中检索行数据。为了帮助检测数据连接或查询执行过程中可能出现的任何问题，使用了 `try-catch`\
  \ 块来捕获错误并防止程序崩溃。\n\n要开始此示例，请从示例 18-2 的解决方案开始。将 `Program.cs` 中的所有代码替换为如下：\n\n![image](img/00396.jpeg)\n\
  \n![image](img/00397.jpeg)\n\n在使用 `SqlDataReader` 对象检索每行后，将打印来自 `Product` 表的列值：\n\
  \n```\nID: 1 Name: Cake Mix Price: $2.99\nID: 2 Name: Cookie Dough Price: $1.25\n\
  ID: 3 Name: Orange Juice Price: $4.25\nID: 4 Name: Cookie Dough Price: $1.45\nID:\
  \ 5 Name: Carrots Price: $1.01\n```\n\n* * *\n\n### 使用 SqlDataReader 类管理存储过程\n\n\
  除了本章已讨论的初始化 `SqlDataReader` 对象的步骤外，本节中还需要额外的步骤来准备 `SqlDataReader` 对象以运行存储过程。\n\n\
  `CommandType` 属性定义查询类型。默认情况下，`SqlCommand` 对象执行 SQL 字符串。然而，为了准备 `SqlCommand` 对象以执行存储过程，你必须将\
  \ `CommandType` 属性设置为 `CommandType.StoredProcedure`：\n\n```\nsqlCommand.CommandType\
  \ = CommandType.StoredProcedure;\n```\n\n在带参数执行存储过程时，`SqlParameter` 类允许你定义存储过程参数以存储参数名称和相应的参数值：\n\
  \n```\nSqlParameter sqlParameter = new SqlParameter(paramName, paramValue));\n```\n\
  \n要定义 `SqlDataReader` 对象运行具有一个或多个参数的存储过程，使用 `Parameters.Add()` 方法将每个 `SqlParameter`\
  \ 对象附加到 `SqlCommand` 对象上：\n\n```\nsqlCommand.Parameters.Add(new SqlParameter(parameterName,\
  \ parameterValue));\n```\n\n然后通过 `SqlCommand` 对象的 `ExecuteReader()` 方法生成读取器：\n\n\
  ```\nSqlDataReader sqlDataReader = sqlCommand.ExecuteReader();\n```\n\n* * *\n\n\
