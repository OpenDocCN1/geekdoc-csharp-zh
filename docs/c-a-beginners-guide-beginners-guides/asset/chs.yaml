  \ Jeff Parker, Brian Pidcock, Marilyn Stevenson\n\n# 引言\n本书提供了一种使用 `C#` 和 `.NET\
  \ Framework` 学习面向对象编程的简单分步骤方法，同时为读者数据驱动开发做好准备。内容全面且简洁，你可以快速学习。150 多个示例提供了清晰的参考，帮助你轻松掌握这些材料。为了获得实践经验，书中的\
  \ 150 多个自测试题提供了额外的练习，以巩固你对所学材料的理解。书中还穿插了额外的 46 个练习，帮助你在讨论最相关概念时专注于它们。\n\n书中对基于 `LINQ`\
  \ 的数据库开发和传统的数据库开发进行了全面涵盖，以便你能够执行任何数据驱动开发者所需的完整范围查询和连接。此外，对文件输入/输出、`XML` 处理和 `JSON`\
  \ 处理的额外涵盖，也提供了你使用 `C#` 处理替代数据源所需的知识。\n\n这本书对于新程序员来说非常棒，因为它从零开始介绍主题，不需要先前的经验。此外，努力学习\
  \ `C#` 的经验丰富的程序员将获得他们所需的简洁语言概述，以便开始在 `ASP.NET`、`Windows` 或任何基于 `C#` 的平台上开发数据驱动应用。\n\
  \n### 本书涵盖的内容\n本书涵盖了开发和调试的 `Visual Studio` 介绍、`C#` 编程基础、坚实的面向对象编程基础、集合和高级 `C#` 结构、用于数据库开发的\
  \ `LINQ` 以及传统的数据库开发，以及文件、`XML` 和 `JSON` 处理。\n\n为了充分利用本书的内容，请按顺序阅读，并尽可能在 `Visual\
  \ Studio` 中尝试所有示例。`Visual Studio` 是编写、编辑和运行 `C#` 应用程序所需的软件。如果你没有付费版本，`Visual Studio\
  \ 2013 Express for Desktop` 是免费的，只要你有 `Windows 7` 或更高版本，就可以运行书中的所有示例。\n\n此外，为了在每章的讨论过程中提高理解，请在遇到\
  \ `Try This` 练习时完成它们。这些练习提供了对当前演示主题的操作实践。为了进一步增加对每个主题的知识，请完成章节末的自测试题。\n\n### 本书的数字资源\n\
  每个章节末自测试题的所有解答均可在以下地址下载的在线 `appendix`：\n\n`www.mhprofessional.com/computingdownload`\n\
  \n此外，你将找到所有示例的代码以及 `FoodStore` 数据库的 `SQL` 和 `.mdf` 文件。此 `FoodStore` 数据库用于第 13 章到第\
  \ 18 章包含的数据驱动示例和练习。（书中包含的附录显示了 `FoodStore` 数据库的实体关系图和概念视图。）\n\n### 本书是如何组织 get？\n\
  书中的主题按顺序组织，以一种全面但不过于具挑战性的方式快速建立你的知识。\n\n`Part I` 涵盖了编程基础。第 1 章引入了代码编辑器和调试器，并提供了练习使用这些工具的练习。然后，第\
  \ 2 章继续进行基础的编程学习，涉及变量、常量、枚举和数组。在第 3 章中，通过数学运算符进一步扩展了变量的使用。第 4 章展示了如何用方法组织和分组指令。为了实现更复杂和迭代的逻辑，第\
  \ 5 章讨论了条件结构和循环。第 6 章研究了如何创建、格式化、搜索和从文本字符串中提取有用信息的这一主题。然后，第 7 章展示了如何对日期和时间进行格式化、解析、比较和计算差异。\n\
  \n\n\n\n在探索了编程基础之后，将在第二部分“面向对象编程”中介绍面向对象的结构。第二部分从第 8 章开始，解释类、结构体、构造函数、属性以及带有访问修饰符的封装。一旦你掌握了这些知识，第\
  \ 9 章](#part0018.html_ch9)将解释如何通过继承来扩展类和结构体。第 10 章将讨论如何使用泛型进一步扩展对象。第 10 章随后将转向解释如何使用各种类型的集合来同时管理多个对象。\n\
  \n第三部分“高级结构”引入了更多控制类封装和扩展性的技术。第 11 章解释了委托和匿名函数如何实现类内部的事件处理。对委托和匿名函数的介绍也是为了让你为之后在第\
  \ 16 章中讨论 LINQ 扩展方法的工作做好准备。接下来，第 12 章](#part0022.html_ch12)介绍了如何使用接口设计类。接口主题对于以后解释如何使用\
  \ LINQ to Entities 优化查询非常有帮助。\n\n第四部分“数据驱动开发”探索了管理数据库和数据替代方案的各种方法。为了初步准备，第 13 章](#part0024.html_ch13)讨论了如何连接到数据库以及如何使用\
  \ Microsoft Visual Studio 检查其中的数据。然后，为了准备在数据库中使用 LINQ，第 14 章](#part0025.html_ch14)引入了\
  \ Entity Framework 将你的 C# 代码与数据库连接起来。在设置好 Entity Framework 后，第 15 章](#part0026.html_ch15)和第\
  \ 16 章](#part0027.html_ch16)都涵盖了使用查询语法和基于方法的语法的 LINQ to Entities，以便从你的 C# 代码管理数据库内容。然后，第\
  \ 17 章](#part0028.html_ch17)解释了如何执行涉及多个表列的真正挑战性的查询。当你不想让 LINQ 管理数据库内容时，第 18 章](#part0029.html_ch18)解释了如何从代码执行原始\
  \ SQL 脚本和存储过程。启用文件输入输出的各种方法将在第 19 章](#part0030.html_ch19)中涵盖。接下来将讨论替代数据源。第 20 章](#part0031.html_ch20)涵盖了\
  \ XML，第 21 章](#part0032.html_ch21)涵盖了 JSON。\n\n第五部分“独立主题”通过涵盖你作为 C# 开发者以后可能会看到的结构来解决遗留问题。第\
  \ 22 章](#part0034.html_ch22)讨论了属性的创建和使用。当你进行 Windows 或 Web 开发的 C# 开发时，你会想要了解属性。第\
  \ 23 章](#part0035.html_ch23)解释了运算符重载。你可能在大多数业务应用中不会使用运算符重载，但在游戏开发或任何应用向量数学的应用程序中你可能想要使用它。第五部分中的两个章节现在对你可能没用，但如果你以后需要良好的参考，它们很容易上手。\n\
  \n并且，如前面提到的，附录显示了 `FoodStore` 数据库的实体关系图和概念视图。\n\n# 第一部分\n\n## 编程基础\n\n## 第 1 章\n\
  \n### C# 编码与调试简介\n\n### 关键技能与概念\n\n![Image](img/00002.jpeg) C# 简史\n\n![Image](img/00002.jpeg)\
  \ 理解基础代码术语\n\n![Image](img/00002.jpeg) 编写并运行程序\n\n![Image](img/00002.jpeg) 使用集成开发环境\n\
  \n![Image](img/00002.jpeg) 结合调试技术\n\n***此时你一定已经迫待要开始编码了——我也是！为了做准备，在简述 C# 历史之后，我们将从代码术语的讨论开始。然后，我们将编写并运行一些简单的程序，同时熟悉开发环境和调试工具。当本章完成后，你将准备好沉浸在书中剩下的代码中。\n\
  \n### C# 简史\n\nC#，读音为 `C sharp`，是一种多用途语言，可用于开发控制台、Windows、Web 和移动应用程序。C# 首次作为 Microsoft\
  \ .NET Framework 的一部分，该框架在 2000 年 7 月的微软专业开发者会议上发布并演示。C# 在 2002 年随着 .NET 1.0 的正式发布成为了一项官方语言规范。C#\
  \ 之所以流行归功于它在不同 Windows 平台上的易用性、组织良好的面向对象方法论，以及当今大多数软件开发人员熟悉的 C 风格语法。\n\nC# 是一种通过\
  \ .NET Framework 启用的编程语言。.NET Framework 是创建、构建和运行 Windows 应用程序的常用环境和工具集。.NET Framework\
  \ 还包含了为所有语言提供功能的类库。框架内的其他语言包括 Basic .NET (`VB.NET`) 和托管 C++。\n\n### 理解代码术语\n\n在开始讨论\
  \ C# 作为一种编程语言之前，让我们定义一些基础结构：\n\n![Image](img/00002.jpeg) **变量**：变量是对存储数据的具名引用。变量名通常是描述存储内容的名词。命名良好的变量有助于叙述你的代码。\n\
  \n![Image](img/00002.jpeg) **方法**：方法是执行例行的指令组。方法名通常是描述动作的动词。方法通过实现代码复用来使程序更容易阅读和调试。\n\
  \n![Image](img/00002.jpeg) **类**：类是提供相关方法、数据和其他构造的模板。类被用于创建对象。\n\n![Image](img/00002.jpeg)\
  \ **命名空间**：命名空间是类的逻辑分组。在代码文件顶部引用命名空间（使用 `using` 语句）可以在文件中使用它们的类。除了使用 .NET Framework\
  \ 提供的命名空间，你经常想要创建自己的命名空间。在书中每个示例中，你都会引用至少一个 .NET Framework 库。通常会引用 `System` 命名空间以访问\
  \ `Console` 类，从而向控制台输出内容。命名空间还防止了类名相同时发生的冲突。当多个类具有相同名称时，使用类的命名空间与类名结合来标识它。\n\n###\
  \ 注释\n\n除了确保对变量、方法、类和命名空间使用正确的命名外，你有时想要添加注释来叙述你的代码。注释对任何阅读代码的人可见。注释不会包含在可执行应用程序中。在\
  \ C# 中编写注释有三种方式：\n\n![Image](img/00002.jpeg) 单行注释：单行注释由两个正斜杠 `//` 前导。例如：\n\n```csharp\n\
  // 关于代码结构的注释写在这里。\n```\n\n![Image](img/00002.jpeg) 多行注释：多行注释以 `/*` 开始，以 `*/` 结束，如下所示。这种注释样式可用于叙述性段落。\n\
  \n```csharp\n/* 关于代码\n结构信息写在这里。 */\n```\n\n\n\n\n![Image](img/00002.jpeg)\n\n**XML\
  \ 标签注释** XML 标签注释在每行的开头以三个正斜杠 `///` 引导。这种注释样式允许通过 Microsoft Visual Studio 中开启的转换功能，为你应用程序中的代码块自动生成\
  \ HTML 文档。XML 标签注释还提供了描述代码块的工具提示（tooltip）。九个主要的注释标签是 `<remarks>``<summary>``<example>``<exception>``<param>``<permission>``<returns>``<seealso>`和`<include>`。XML\
  \ 标签注释可以位于方法之前，用于提供方法的参数摘要并列出返回类型。示例下：\n\n```\n/// <summary>\n/// 方法描述写在这里。\n///\
  \ </summary>\n/// <param name=\"varName\">参数描述。</param>\n/// <returns>返回值描述。</returns>\n\
  ```\n\n### 语法\n语法定义了编程语言结构正确性的规则集。在编写代码时，除了注释，每个分号、大括号、括号、单词和字母大小都必须准确。不正确的语法会导致你的代码无法编译为可执行程序。\n\
  \n#### 缩进\n需要使用左大括号和右大括号来包裹类、方法等结构。为了可读性并按照惯例，在每对大括号内对代码进行缩进并左对齐必要的。结构内部的结构也必须进行缩进和左对齐：\n\
  \n![Image](img/00003.jpeg)\n\n书中的材料通常实现了一种常见的代码缩进变体，通过将左大括号放在循环头、方法头或类头的末尾，以便用更少的行呈现代码指令：\n\
  \n![Image](img/00004.jpeg)\n\n### 编写和运行程序\n当你编写代码时，你正在编写人类可读的指令。C# 被认为是一种高级别语言，因为其指令集对用户友好。\n\
  \n#### 编写和编辑你的代码\n通常，你可能会在某个版本的 Microsoft Visual Studio 中编写和编辑 C# 代码，因为它集成了多个不同的工具，帮助你编辑、管理和编译你的代码解决方案。*解决方案*（solution）是项目的集合。一个解决方案中可以包含多个项目，但书中的解决方案始终只包含一个项目。图\
  \ 1-1 显示了 Visual Studio 集成开发环境 (IDE) 中的解决方案，其中包含一个名为 `ConsoleApplication1` 的项目。默认情况下，代码编辑器位于左侧的大区域。解决方案资源管理器（Solution\
  \ Explorer）位于右侧。解决方案资源管理器提供了代码文件和其他资源的方便查看和导航。此外，在图 1-1 的右下角，你可以看到属性窗口。属性窗口提供了项目中所选任何文件或资源的属性摘要。在这种情况下，属性窗口显示了在解决方案资源管理器中选中的\
  \ `Program.cs` 文件的文件和路径。IDE 底部还存在错误列表窗口（Error List），见图 1-1。错误列表窗口显示任何阻止你的代码运行的错误。此窗口将在本章稍后的调试技术部分进行更详细讨论。\n\
  \n![image](img/00005.jpeg)\n\n**图 1-1** Visual Studio 集成开发环境\n\n***注意***\n\n在开始开始\
  \ 第二部分 之前，所有在类级别声明的类、方法和变量必须使用 `static` 修饰符声明。在方法内部声明的变量是非静态的。`static` 修饰符将在第 8\
  \ 章 中解释。\n\n#### 程序编译和执行\n当你完成 C# 指令的编写后，需要在运行程序之前对其进行编译。当你编译 C# 代码时，你实际上是将指令转换为在\
  \ Windows 上运行的字节码风格格式。\n\n### 尝试一下 1-1 创建你的第一个 C# 程序\n本节提供了第一次练习编写代码以及使用 Visual\
  \ Studio 编译和运行代码的机会。在引导过程中，你将编写一个向控制台窗口打印“Hello world!”的程序。\n\n1.  从开始菜单启动 Microsoft\
  \ Visual Studio。\n\n**2**. 一旦 Visual Studio 打开，选择文件 | 新建 | 项目。在打开的新项目对话框中，展开模板（Templates）节点，并在左侧选择\
  \ Visual C# 节点。从那里开始，从新项目对话框中心出现的列表中选择控制台应用程序（Console Application），如图 1-2 所示。\n\n\
  ![image](img/00006.jpeg)\n\n**图 1-2** 创建控制台应用程序\n\n***注意***\n\n书中的所有示例都在控制台应用程序项目环境中运行。在未说明的情况下，作为示例展示的代码属于\
  \ `Program.cs` 文件。\n\n**3**. 一旦项目创建，双击右侧解决方案资源管理器面板中的 `Program.cs` 文件以查看代码。将 `Program.cs`\
  \ 的内容替换为图 1-1 中显示的编写好的指令。不需要注释。\n\n***警告***\n\n**4**. 编写代码后，编译并运行程序。要做到这一点，可以点击位于\
  \ Visual Studio 工具栏上标记为“启动”（Start）的绿色箭头按钮（参考图 1-1），或者按 F5。运行程序将启动控制台窗口并显示“Hello\
  \ world!”的消息（见图 1-3）。\n\n![image](img/00007.jpeg)\n\n**图 1-3** 控制台程序的输出\n\n**5**.\
  \ 你可以在控制台中中按回车，或者在 Visual Studio 中按 SHIFT+F5 来终止程序。\n\n### 使用集成开发环境\n当你已经使用 Visual\
  \ Studio 编写、编译并运行了第一个程序后，本节涵盖了管理项目的基本知识。\n\n#### 创建控制台应用程序项目\n创建控制台应用程序的步骤与你创建第一个\
  \ C# 程序时的步骤相同。启动 Visual Studio，选择文件 | 新建 | 项目，并在模板节点下选择 Visual C#。从那里，从新项目对话框中心选择控制台应用程序（参考图\
  \ 1-2）。\n\n#### 编译和运行程序\n编译程序是将 C# 人类可读指令转换为可执行字节码格式的过程。要在 Visual Studio 中编译并运行程序，选择调试\
  \ | 调试或按 F5 键。或者，直接点击 Visual Studio 工具栏上的启动按钮，如之前的图 1-1 所示。\n\n\n\n\n\n默认情况下，从 Visual\
  \ Studio 编译代码会自动保存任何代码更改。若要在查看每个代码文件时一次保存一个文件，请选择 `文件 | 保存` 或按 `CTRL-S`。此外，要保存解决方案中的所有代码和资源更改，请选择\
  \ `文件 | 保存全部` 或按 `CTRL-SHIFT-S`。\n\n## 退出解决方案\n\n当应用程序未运行时，你可以通过导航到 `文件 | 退出` 来退出\
  \ Visual Studio 环境。\n\n## 打开解决方案\n\n要打开包含你的某个代码项的 Visual Studio 解决方案，请导航到存储该项目的文件夹并双击解决方案文件。每当你创建一个控制台应用程序时，系统都会生成解决方案文件。解决方案文件具有\
  \ `.sln` 扩展名。双击解决方案文件将启动包含该代码项目并在 Visual Studio。当 Visual Studio 运行时，你可以从 `文件 | 打开`\
  \ 菜单打开解决方案。你也可以使用 Visual Studio 的快捷键 `CTRL-O` 启动“打开文件”对话框，并用它导航到 `.sln` 文件。\n\n\
  ## 重命名代码文件\n\n要重命名代码文件，在解决方案资源管理器中右键点击代码文件名，然后从下拉列表中选择`重命名`。系统会提示你为代码文件输入新名称。或者，在选中文件状态下，按\
  \ `F2` 并在提示时重命名它。\n\n## 重命名代码结构\n\n重命名变量、方法、类和命名空间是开发中非常重要的一部分部分。良好的程序员高度依赖于变量、方法和类的适当命名来准确描述代码的工作原理。由于代码开发的迭代性质，你通常会在声明结构后很久以后才会为这些结构想出更好的名称。由于这些原因，你可能会在想出更好的名称时，同时使用“查找和替换”对话框和“重命名”对话框来重命名你的变量、方法和类。\n\
  \n## 查找和替换对话框\n\n要启动查找和替换对话框，请选择 `编辑 | 查找和替换 | 在文件中替换` 或使用键盘快捷键 `CTRL-SHIFT-H`。图\
  \ 1-4 显示了用于将名为 `output` 的变量重命名为 `temperature` 的对话框设置。根据你在“查找范围”下拉菜单中选择的选项，你可以将更改应用到单个引用、某个代码块（如方法）、整个代码页面或整个解决方案。如果你是一次应用一个更改，则必须点击`替换`。点击`替换`将应用更改并将光标移动到下一个匹配搜索标准的引用。如果你不想更改当前选中的文本，请点击`查找下一个`以将光标移动到下一个引用。在替换文本的同时搜索整个解决方案时，你还可以点击`跳过文件`以避免对当前文件进行进一步更改。要将更改应用到定义范围内的所有引用，请点击`全部替换`。\n\
  \n![image](img/00008.jpeg)\n\n**图 1-4** 查找和替换对话框\n\n有时，你可能不知道必须定位的结构的大小写或完整拼写，但你知道部分拼写。在这些情况下，你可以通过切换`区分大小写`和`匹配全单词`复选框来调整搜索。为了获得额外的搜索灵活性，你还可以勾选`正则表达式`复选框，在“查找内容”区域根据正则表达式进行搜索。正则表达式定义了匹配模式，并在第\
  \ 6 章](#part0014.html_ch6)中进行了讨论。\n\n## 使用重命名对话框进行重构\n\n重命名对话框提供了一种在程序上下文中重命名代码结构的集中方式。例如，使用查找和替换对话框重命名命名空间可能会直接地更改命名空间名称、程序集引用、注释和其他类似命名的结构。相反，重命名对话框提供了更相关的选项，仅更改指向它的代码引用。要启动重命名对话框，右键点击要重命名的文本，然后选择`重构\
  \ | 重命名`。快捷键 `CTRL-R-R` 也会启动包含选中文本的重命名对话框。你也可以通过`编辑 | 重构 | 重命名` 来打开此对话框。图 1-5 显示了在“新名称”字段中带有待重命名文本的重命名对话框。\n\
  \n![image](img/00009.jpeg)\n\n**图 1-5** 使用重命名对话框进行重构\n\n## 调试技术\n\n调试是消除错误的过程。为了有效地调试，你必须能够结合多种不同的技术来跟踪代码中的\
  \ bug。有时，你需要在跟踪 bug 的工作中发挥创意，因此熟悉许多调试技术将证明是非常有价值的。\n\n理解 IDE 如何帮助你调试代码将使你作为开发者的效率大大提高。某些错误可以在运行之前被捕获，但其他错误只有在程序运行时才会明显。对于\
  \ C# 开发人员，Visual Studio 提供了一系列丰富的工具，帮助在这两种情况下识别和理解错误。\n\n### 错误和警告\n\n编译之前捕获的错误会导致你的代码无法编译。在\
  \ Visual Studio 中，编译之前捕获的错误用红色波浪线标记。\n\n另一方面，警告识别代码中可疑或冗余的部分。警告通常标识不再使用的变量，以便你可以删除它们以清理代码。通常最好在警告出现时处理所有警告，但如有需要，你可以跳过它们。在\
  \ Visual Studio 的代码页面上，警告用绿色波浪线表示。\n\n图 1-6 中第 6 行的红色波浪线突出了一个缺少分号的错误。图 1-6 中第 5\
  \ 行的绿色波浪线警告变量已声明但未使用。错误和警告汇总在图 1-6 底部的“错误列表”窗口中。错误列表窗口默认显示，但如果未显示，你可以通过`视图 | 错误列表`或按`CTRL-W-E`来打开它。\n\
  \n![image](img/00010.jpeg)\n\n**图 1-6** 查看错误和警告\n\n提示：关键错误列在错误列表的顶部，因此调试时先修复它们。通过双击错误列表中的错误描述，可以导航到错误所在的行。\n\
  \n### 断点\n\n断点允许你在选择的指令处停止程序。当你在代码的断点处停止程序时，你可以检查该点的变量值，或者从该点逐行执行代码。图 1-7 中，断点设置在第\
  \ 9 行和第 13 行。\n\n![image](img/00011.jpeg)\n\n**图 1-7** 时查看本地变量和调用堆\n\n要设置断点，请点击程序停止指令旁边的灰色边距（也称为*行间*）。你可以通过将光标放置在要停止程序的指令旁边并按\
  \ `F9` 来设置或清除断点。在断点位置切换 `F9` 会清除或设置断点。当你运行程序时，它将在断点处停止，直到你采取进一步操作。\n\n#### 继续程序执行\n\
  \n当你的程序停止或正在逐行执行代码时，可以通过按 `F5` 返回正常的程序执行。你也可以通过选择`调试 | 继续` 来恢复程序执行，或者点击工具栏上的“继续”按钮。\n\
  \n#### 提示框\n\n当程序在断点处停止时，你可以将光标悬停在变量引用上，以查看显示变量值的工具提示。当你的光标悬停在一个存储多个值的复杂变量上时，通常你可以展开工具提示以显示每个值。\n\
  \n\n\n\n### 进入方法\n\n在单步执行代码时，你可以按 `F11` 或选择 `Debug | Step Into`（调试 | 进入）从调用指令进入一个方法。要继续运行程序，按\
  \ `F5`。例如，在图 1-7 的第 13 行断点处，你需要按 `F11` 进入 `ShowSum()` 方法。\n\n#### 逐过方法\n\n在调试会期间，你不想浪费时间去单步执行那些已知运行正常的方法。你可以在调用指令处按\
  \ `F10` 或选择 `Debug | Step Over`（调试 | 逐过），跳过已验证或无关的方法，或者是框架中定义的方法。要继续运行程序，按 `F5`。在图\
  \ 1-7 中，程序首先停止在第 13 行。为了避免步入 `ShowSum()` 方法，按 `F10` 可以让你跳过调用指令，从而移动到第 14 行。\n\n\
  **提示**\n\n为了加快调试时检查变量和例程的速度，你最好记住进入和逐过代码的快捷键。这里有一个记忆技巧：首先，记住这两个例程都是通过 `F10` 和 `F11`\
  \ 键触发的。要记住 `F10` 用于 Step Over（逐过），可以将 `0` 想象成 Over 中的字母“O”。要记住 `F11` 用于 Step Into（进入），可以将\
  \ `1` 想象成 Into 中的字母“I”。\n\n#### 调用堆栈窗口\n\n调试时，如果一个方法可以从多个位置被调用，你可能想知道它是哪里被调用的。或者，你可能想知道在出错指令之前访问的方法序列。调用栈（Call\
  \ Stack）窗口显示调用指令的位置，并按访问顺序显示最近访问的方法。调用栈窗口仅在程序运行时显示。要在调试期间查看调用栈窗口，选择 `Debug | Windows\
  \ | Call Stack`（调试 | 窗口 | 调用堆栈）或按 `ALT-F7`。Visual Studio 的调用栈显示位于图 1-7 的右下角。\n\n\
  #### 局部窗口\n\n在单步执行代码时，局部窗口（Locals window）会自动显示方法中局部声明的所有变量的当前值。默认情况下，局部窗口位于开发环境的左下方，如图\
  \ 1-7 所示。如果你没有看到局部窗口，可以在程序停止在断点时通过选择 `Debug | Windows | Locals`（调试 | 窗口 | 局部）或按\
  \ `ALT-F4` 来启动它。\n\n### 尝试 1-2 检查你的代码\n\n此练习提供了以下方面的练习：\n\n- ![Image](img/00002.jpeg)\
