  \ `0` 到 `999999998`：\n![Image](img/00055.jpeg)\n3. 带有两个参数的 `Next()` 方法生成一个介于包含性最小值和排斥上限之间的整数。对于以下情况，使用\
  \ `100,000,000` 作为最小值、`999,999,999` 作为上限，可能生成的数字可以包括从 `100,000,000` 到 `999,999,998`\
  \ 的任何数字：\n![Image](img/00056.jpeg)\n\n#### 生成随机双精度点数\n\n`Random` 类的 `NextDouble()`\
