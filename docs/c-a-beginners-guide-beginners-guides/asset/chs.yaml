  \ 表每列的数据库属性。\n\n# 第 14 章\n\n# Entity Framework (实体框架)\n\n### 核心技能与概念\n\n![Image](img/00002.jpeg)\
  \  实体数据模型\n\n![Image](img/00002.jpeg)  使用实体数据模型查询数据库对象\n\n![Image](img/00002.jpeg)\
  \  更新实体数据模型\n\n![Image](img/00002.jpeg)  LINQ to Entities 简介\n\nMicrosoft Entity\
  \ Framework (EF) 是一个框架，它可以为你的 C# 代码自动生成面向对象的数据访问层，以便与数据库通信。像 EF 这样的框架被称为对象关系映射框架，或\
  \ ORM 框架。\n\n### 实体数据模型\n\nEntity Framework 的核心是 Microsoft ADO.NET 实体数据模型，简称 EDM。EDM\
  \ 是你的数据库对象的面向对象代码表示。Visual Studio 中有一个向导，可以实现将 EDM 添加到你的代码项目中的过程。当需要连接到多个数据库时，可以向项目添加多个实体数据模型。不过，在整本书中，你每个项目只需要添加一个\
  \ EDM。\n\n#### 向你的代码项目添加实体数据模型\n\n如果你指定要包含实体数据模型，则会在你的 C# 项目中自动创建它。一旦生成，EDM 就包含映射到数据库中所选数据对象的类。本节描述了如何向你的代码项目添加实体数据模型。\n\
  \n**示例 14-1** 向你的项目添加 ADO.NET 实体数据模型\n\n首先，创建一个新的控制台应用程序。接下来，在解决方案管理器（Solution Explorer）中，右键点击项目节点并选择“添加\
  \ | 新项”。在“添加新项”对话框中（如图 14-1 所示），展开 Visual C# ”文件夹，选择“数据”，然后选择“ADO.NET 实体数据模型”。根据需要更改\
  \ `*.edmx` 名称，并点击“添加”启动实体数据模型向导。\n\n![image](img/00285.jpeg)\n\n**图 14-1** 向项目添加\
  \ ADO.NET 实体数据模型\n\n在向导首次出现的“选择模型内容”屏幕中，选择“从数据库选择 EF  设计器”并点击“下一步”。然后，为了构建数据库连接字符串，点击“新建连接”按钮。在“连接属性”对话框中提供所有所需信息（如图\
  \ 14-2 所示），并点击“测试连接”以确保你的输入正确。在第 13 章中，示例 13-1 为数据库初学者提供了如何完成此对话框的详细说明，而示例 13-2\
  \ 为如果你在 Microsoft SQL Server 中托管了 `FoodStore` 数据库则提供了详细说明。两个示例都适用。\n\n![image](img/00286.jpeg)\n\
  \n**图 14-2** 连接属性对话框\n\n当你点击“确定”接受数据库连接属性后，“选择数据连接”屏幕会再次出现，但这次显示的是新生成的连接字符串。确保勾选了“在\
  \ App.Config 中保存实体连接设置”，这样你的实体数据模型就可以在那里引用数据库连接（参见图 14-3\n\n**图 14-3** 选择你的数据连接\n\
  \n当你准备好使用此连接时，点击“下一步”。出现“选择对象和设置”屏幕（参见图 14-4）。此屏幕允许你选择要在你的 EDM 中引用的表、视图和存储过程。\n\n\
  ![image](img/00288.jpeg)\n\n**图 14-4** 选择数据库对象\n\n***注意***\n\n向实体数据模型添加表时，除非它具有主键（主键是表中每行的唯一标识符），否则它不会出现在概念视图。\n\
  \n默认情况下，“复数或单数对象名称”复选框被选中。对于本示例，保持勾选，因为在命名 EDM 对象时复数更为常见。然后点击“完成”为你的数据模型生成 .NET\
  \ 类。\n\n一旦向导为你的数据模型生成了类，你的代码项目中将出现数据模型的概念视图，如图 14-5 所示。\n\n![image](img/00289.jpeg)\n\
  \n**图 14-5** 数据模型的概念视图\n\n除了概念视图外，当实体数据模型生成后，你会在项目中看到 EDM。图 14-6 显示了解决方案管理器中的 `Model1.edmx`\
  \ 引用。展开 `*.edmx` 节点会显示表示数据库对象的 C# 文件。\n\n![image](img/00290.jpeg)\n\n**图 14-6**\
  \ 实体数据模型项目引用\n\n一旦向项目添加了 EDM，如果你使用的是数据库文件，`.mdf` 文件也将出现在解决方案管理器中，如图 14-6 所示。如果你在添加、更新或删除数据时使用数据库文件来保存更改，你必须将\
  \ `FoodStore.mdf` 文件的“复制到输出目录”属性设置为“如果较新则复制”。否则，当应用程序再次运行时，数据的更改将被原始数据库文件覆盖。你可以在解决方案管理器中右键点击\
  \ `.mdf` 文件时出现的下拉菜单中找到“复制到输出目录”设置（参见图 14-7）。\n\n![image](img/00291.jpeg)\n\n**图\
  \ 14-7** 复制到输出目录设置\n\n\n\n\n当 `Copy To Output Directory`（复制输出目录）属性设置为“Copy if newer”（较新时复制）时，实际上创建了一个最新版本数据库文件的副本。当应用程序运行时，数据库文件的副本创建在项目的\
  \ `Debug\\bin` 文件夹中。`Debug\\bin` 文件夹中创建的数据库文件在每次应用程序运行时都会作为数据源，直到解决方案管理器（Solution\
  \ Explorer）中引用的数据库文件被替换。因此，当你设置服务器资源管理器（Server Explorer）/数据库管理器（Database Explorer）工具来查看数据的更改时，你需要引用\
  \ `Debug\\bin` 文件夹内部引用的数据库文件。\n\n### 使用实体数据模型查询数据库对象\n\n向项目中添加实体数据模型（EDM）时，会生成几个类以支持从你的代码项目中进行数据库管理。\n\
  \n#### DbContext\n\n每个实体数据模型都提供一个 `DbContext` 类，也称为数据库上下文，用于引用数据库。`DbContext` 实例管理针对\
  \ EDM 的数据库命令的执行。`DbContext` 类实例分配的默认名称是数据库名称后跟上 `Entities` 单词。例如，当为名为 `FoodStore`\
  \ 的数据库创建实体数据模型时，ADO.NET Entity Framework 会自动生成一个 `FoodStoreEntities` 类来引用数据库：\n\n\
  ```\nFoodStoreEntities context = new FoodStoreEntities();\n```\n\n#### Entities\n\
  \n实体是在创建 EDM 时生成的类，代表数据库表。数据库表是一种在预定义的列集合中存储数据行的结构。实体类的属性代表相关表的列。生成的实体名称和属性与数据库中的表名和列名相对应。表中的每一行都可以通过相应实体类的一个对象来被引用。\n\
  \n#### DbSet\n\n`DbSet` 是一个泛型类，用于管理实体集合的创建、读取、更新和删除操作。`DbSet` 类只能通过 `DbContext`\
  \ 类的实例作为属性访问。`DbSet` 通过 `System.Data.Entity` 命名空间可用。默认情况下，EDM 在创建关联的 `DbSet` 名称时会将每个实体引用的名称变为复数形式。例如，包含\
  \ `Product` 实体的 EDM 会在 `DbContext` 类内部定义一个名为 `Products` 的 `DbSet` 属性：\n\n```\nvar\
  \ products = context.Products;\n```\n\n当你的项目引用了 `FoodStore` 数据库的实体数据模型时，你实际上拥有了一系列类，这些类在创建\
  \ EDM 时生成，代表每个数据库表、视图和存储过程。\n\n#### 查询实体\n\n现在我们已经涵盖了实体数据模型的一些主要结构和代码组件，我们可以观察它们如何协同工作以简化基础数据库查询。\n\
  \n***\n\n**示例 14-2** 查询实体\n\n***\n\n尝试通过 Entity Framework 从 `Product` 表的所有行选择数据来测试你的\
  \ EDM。要构建此项目，请从 示例 14-1 的解决方案开始。然后将 `Program.cs` 中 `Main()` 方法内部的所有代码替换为以下代码。此代码首先定义了一个引用\
  \ `FoodStore` 数据库的 `DbContext` 对象。然后使用 `var` 关键字隐式定义了一个产品列表。编译器知道要创建一个产品列表，因为变量被赋值了通过\
  \ `DbContext` 对象检索的 `Products DbSet`。与每个 `Product` 实体对象关联的属性取自 `Product` 表列的名称和类型。这些属性实际上在生成\
  \ EDM 时就为 `Product` 实体设置完毕。当需要数据时，Entity Framework 会生成 SQL 并将其发送到数据库以获取数据。此代码有效地检索了\
  \ `Product` 表中的所有行并返回给应用程序，然后由应用程序显示数据。\n\n![image](img/00292.jpeg)\n\n当你运行代码时，输出显示了\
  \ `Products` 列表中所有对象的属性值：\n\n```\n1: Cake Mix - Sysco - $2.99\n2: Cookie Dough -\
  \ Sysco - $1.25\n3: Orange Juice - GFS - $4.25\n4: Cookie Dough - GFS - $1.45\n\
  5: Carrots - GFS - $1.01\n```\n\n如你所见，借助 EDM 查询数据是非常简单的。\n\n***\n\n### 尝试一做 14-1\
  \ 使用实体数据模型查询实体\n\n这是一个实验实体数据模型的机会。\n\n**1**。从 示例 14-2 的解决方案开始，修改查询以便你可以检索 `Employee`\
  \ 表的所有行。\n\n**2**。更改 `foreach` 循环内部的代码，以显示 `employee_id`、`last_name` 和 `first_name`\
  \ 属性的值。\n\n**3**。运行项目以测试你的代码。\n\n**4**。检查并确保你的代码检索的数据是正确的。你可以独立于代码，通过服务器资源管理器/数据库管理器浏览\
  \ `Employee` 表来完成此操作（参见第 13 章中的示例 13-3）。\n\n***\n\n**示例 14-3** 使用实体数据模型查询存储过程\n\n\
  ***\n\n使用 Entity Framework 时，运行存储过程所需的步骤与查询表所需的步骤相似。此示例显示了如何使用实体数据模型执行存储过程 `spProductDetail`\
  \ 并显示结果。\n\n******注意：包含关于存储过程的讨论是为经验丰富的数据库开发人员提供的。然而，如果你是数据库开发的学者，可以跳过此示例，因为它不会影响对书中其他部分的理解。***\n\
  \n该存储过程使用以下脚本输入 `FoodStore` 数据库：\n\n![image](img/00293.jpeg)\n\n接下来，使用 示例 14-1 的解决方案，将\
  \ `Program.cs` 中 `Main()` 方法内部的现有代码替换为以下代码。你会发现，与查询实体类似，使用 `DbContext` 对象通过名称引用存储过程。然而，在引用存储过程时，你同时传入所需的参数。访问返回行的属性就像引用结果集的列一样。\n\
  \n![image](img/00294.jpeg)\n\n当你运行应用程序时，检索的数据验证了 `spProductDetail` 已使用参数值 `Cookie\
  \ Dough` 和 `GFS` 执行执行：\n\n```\nCookie Dough $1.45 GFS\n```\n\n***\n\n### 更新实体数据模型\n\
  \n当你同时开发数据库和 C# 代码项目时，将需要更新实体数据模型以反映更改。如果你向数据库添加了新表或其他数据对象而不更改现有数据库对象的结构，你可以从模型浏览器更新\
  \ EDM。你可以通过右键点击概念视图或模型浏览器，然后选择“从数据库更新模型”来启动向导对话框。向导对话框会显示任何添加到 EDM 的对象。从那里，选择你想放入\
  \ EDM 的新对象（参见图 14-8），然后点击“完成”来添加它们。\n\n![image](img/00295.jpeg)\n\n***\n\n**图 14-8**\
  \ 在向导中添加新的数据库表\n\n***\n\n***提示：由于在数据库更改后 EDM 中可能存在过时的实体关联或列，请考虑删除现有的 EDM 并添加新版本的\
  \ EDM。为了保持简单，在大多数情况下我建议完全替换 EDM，如下所示。***\n\n#### 替换实体数据模型\n\n\n\n\n如果你对数据库中的实体进行了重大更改，更新\
  \ EDM（实体数据模型）最简单的方法之一是删除现有的 EDM 并重新添加它。在替换 EDM 时，如果你没有从配置文件中正确删除现有的连接信息，可能会导致产生一个与原始名称不同的新数据库上下文。例如，如果原始数据库上下文命名为\
  \ `FoodStoreEntities` 且在你的项目中仍被引用，那么在添加新的 EDM 时，新的数据库上下文将被命名为 `FoodStoreEntities1`。在这种情况下，现有的\
  \ C# 代码对 `FoodStoreEntities` 的引用将抛错误，因为原始类已不存在。\n\n为了避免添加一个名称与代码中当前引用的名称不同的 EDM，请执行以下两个步骤：\n\
  \n1. 在添加新 EDM 之前，删除项目配置文件 `connectionStrings` 元素中定义的连接字符串。\n2. 保存配置文件。\n\n图 14-9\
  \ 显示了 `add` 元素中名为 `FoodStoreEntities` 的连接字符串。在代码项目中删除并重新添加新的 EDM 之前，必须移除该 `add`\
  \ 元素并保存配置文件。\n\n![image](img/00296.jpeg)\n\n* * *\n\n**图 14-9** App.config 文件中对\
  \ FoodStoreEntities 的引用\n\n### LINQ to Entities 简介\n\nLINQ to Entities 允许你编写通过 Entity\
  \ Framework 执行的高级数据库查询。集成查询（LINQ）是 C# 的一个分支，用于编写添加、更新、查询和删除对象的命令。你可以使用 LINQ 查询几乎任何类型的集合和列表，但在使用实体数据模型执行数据库查询时，它尤为重要。存在两种类型的\
  \ LINQ 语法：\n\n![Image](img/00002.jpeg) 查询语法（参考第 15 章）\n\n![Image](img/00002.jpeg)\
  \ Lambda（基于方法的）语法（参考第 16 章）\n\n当你从应用程序执行用 LINQ 编写的数据库指令时，最终查询会被转换为命令树。然后，Entity\
  \ Framework 将命令树转换为 SQL 并发送到数据库服务器。你用于定义查询的接口决定了查询执行的时机。\n\n#### 懒性加载与延迟执行\n\n查询可以被定义为在应用程序需要结果之前不执行。以这种方式定义的查询被称为*懒性加载*（lazy\
  \ loading）。懒性加载允许你在将命令发送到数据库服务器之前，增量地构建查询。有关每个懒性加载查询的信息存储在 `ObjectQuery` 类的单独实例中。一旦你之后尝试访问结果集中的值，第一条尝试访问数据的指令将触发生成并发送\
  \ SQL 到数据库服务器执行的过程。这种发送数据库命令的延迟被称为*延迟执行*（deferred execution）。\n\n使用 `IEnumerable`\
  \ 接口和 `IQueryable` 接口（后者继承自 `IEnumerable`）定义的查询是是懒性加载的。`IEnumerable` 接口来自 `System.Collections.Generic`\
  \ 命名空间，而 `IQueryable` 接口来自 `System.Linq` 命名空间。使用隐式类型 `var` 定义的查询使用的是 `IQueryable`\
  \ 接口，因此这些查询也是懒性加载的。以下三个声明定义了 `Product` 对象的懒加载集合。当使用 `var` 时，`results` 的隐式类型是 `Product`\
  \ 对象的集合，因为编译器知道给它赋值的是 `DbSet<Product>` 类型：\n\n```\nvar results = context.Products;\n\
  IEnumerable<Product> results = context.Products;\nIQueryable<Product> results =\
  \ context.Products;\n```\n\n示例 14-2 中声明的查询是懒加载的，因为它在 `foreach` 循环需要数据之前并不会执行：\n\n\
  ![image](img/00297.jpeg)\n\n#### 立即（激进式）数据加载\n\n有时，你可能需要预加载极大的对象，以避免在需要数据时出现突然的性能影响。强制查询立即执行的一种方法是通过\
  \ `IList` 接口。`IList` 接口继承自 `IEnumerable` 接口，因此它也定义在 `System.Collections.Generic`\
  \ 命名空间中。\n\nEDM 中的每个 `DbSet` 属性都有一个 `ToList()` 方法，返回一个包含定义实体所有行的强类型 `List` 集合。当\
  \ `DbContext` 实例引用带有 `ToList()` 扩展方法的 `DbSet` 时，你实际上是在强制将结果放入实现 `IList` 接口的集合中。以下定义显示了使用\
  \ `Products` `DbSet` 对 `IList` 的显式和隐式实现：\n\n```\nIList<Product> results = context.Products.ToList();\
  \ // 显式。\nList<Product> results = context.Products.ToList(); // 隐式。\n```\n\n由于 `IList`\
  \ 和 `List` 集合不是懒加载的，这些集合在查询初始化时就会从数据库填充数据。使用 `ToList()` 方法的行为（即使对于懒加载查询）也会立即触发数据加载，因为它强制将集合转换为\
  \ `List`：\n\n```\nIEnumerable<Product> productList = context.Products.ToList();\n\
  ```\n\n#### LINQPad\n\n为了直观地演示懒加载、延迟执行和数据立即加载的区别，我们将使用一个名为 LINQPad 的优秀工具。\n\n* *\
  \ *\n\n**示例 14-4** 使用 LINQPad 观察查询执行\n\n* * *\n\n为了实地演示懒加载、延迟执行和数据立即加载的区别，我们将使用一个名为\
  \ LINQPad 的优秀工具。现在你有了 LINQPad，可以使用它来观察不同查询的执行情况。\n\n要添加连接，启动 LINQPad，并在左角选择 Add\
  \ Connection。在弹出的 Choose Data Context 对话框中，选择 `Default (LINQ To SQL)` 然后点击 Next。在\
  \ LINQPad Connection 对话框中，在 Database Area 选择 Attach Database File 按钮。然后点击 Browse\
  \ 链接导航到 `FoodStore.mdf` 文件。在 Specify New Existing Database 下拉菜单中选择 FoodStore 数据库。确保取消\
  \ Capitalize Property Names 选项，以便 LINQPad 能够识别与数据库指定的大小写相同的表属性。然后点击 OK 完成数据连接添加。图\
  \ 14-10 显示所需的连接选项。\n\n![image](img/00298.jpeg)\n\n* * *\n\n**图 14-10** 在 LINQPad\
  \ 中创建数据连接\n\n\n\n\n你可以通过点击 LINQPad 中的 SQL 来查看生成并发送到数据库的 SQL，如图 14-12 所示。当你看到 SQL\
  \ 时，说明查询已经执行。\n\n![image](img/00300.jpeg)\n\n* * *\n\n**图 14-12** 从 LINQPad 查看在数据库中执行的\
  \ SQL\n\n如果你通过删除 `foreach` 循环来修改代码并再次执行查询，你会发现没有显示任何数据。同样，在这些更改之后，也不存在任何 SQL（参见图\
  \ 14-13）。这是因为隐式的 `var` 类型使用了 `IQueryable` 接口，它创建了查询但在需要数据之前不会运行它。\n\n![image](img/00301.jpeg)\n\
  \n* * *\n\n**图 14-13** 在 LINQPad 中观察懒加载的查询\n\n当你对 `Products` `DbSet` 引用 `ToList()`\
  \ 方法时，情况发生了变化。如图 14-14 所示，数据被立即加载，这可以通过生成的 SQL 看出。`ToList()` 方法基本上是强制查询使用 `IList`\
  \ 接口，从而触发了发送到数据库执行的 SQL 生成。\n\n![image](img/00302.jpeg)\n\n* * *\n\n**图 14-14**\
  \ 在 LINQPad 中的立即数据加载\n\n### 尝试此 14-2 使用 LINQPad 观察查询差异\n\n这里你有机会使用 LINQPad 观察不同的接口如何决定通过\
  \ Entity Framework 运行数据库查询的方式以及何时。\n\n**1**. 配置 LINQPad 并连接到 `FoodStore` 数据库，在语言下拉菜单中选择\
  \ C# Program。\n\n**2**. 在 `Main()` 内部输入以下代码：\n```\nIEnumerable<Employee> employees\
  \ = Employees;\n```\n\n**3**. 点击 SQL 标签页，你会发现运行查询时没有生成任何 SQL。\n\n**4**. 将 `Main()`\
  \ 内部的代码替换为以下代码：\n![image](img/00303.jpeg)\n\n**5**. 执行查询。在结果（Results）视图中，你会看到 `Employee`\
  \ 表中的名字。在 SQL 视图中，你将看到生成并在数据库上执行的 SQL。由于该查询被定义为懒加载查询，执行会被推迟到需要数据为止。\n\n**6**. 将\
  \ `Main()` 方法中的所有代码替换为以下代码：\n```\nList<Employee> employees = Employees.ToList();\n\
  ```\n\n**7**. 执行此最新的查询。注意在结果视图中没有显示任何数据，因为没有将数据写入控制台的指令。然而，在 SQL 视图中，你会注意到生成了 SQL\
  \ 并发送到了数据库。这是因为最新的查询使用了 `IList` 接口，它在与 Entity Framework 配合使用时会强制立即加载。\n\n* * *\n\
