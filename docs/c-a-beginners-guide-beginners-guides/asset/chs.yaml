  \ `Products` `DbSet`。该别名还允许我们通过名称选择集合中每个 `Product` 对象的列。\n\n与本章中的所有示例一样，为了构建此示例，请从创建一个新的控制台应用程序开始。接下来，添加一个引用\
  \ `FoodStore` 数据库所有表的实体数据模型。然后，将 `Main()` 方法中的代码替换为以下内容：\n\n![image](img/00309.jpeg)\n\
  \n运行此程序的输出显示了 `Product` 表中每行的每个 `name` 列和 `vendor` 列的值：\n\n`Cake Mix - Sysco`\n\n\
  `Cookie Dough - Sysco`\n\n`Orange Juice - GFS`\n\n`Cookie Dough - GFS`\n\n`Carrots\
  \ - GFS`\n\n* * *\n\n* * *\n\n* * *\n\n**示例 15-2** 选择对象的所有列\n\n* * *\n\n此示例生成的输出与示例\
  \ 15-1 相同，但在这种情况下，检索了集合中每行的所有列值。读取的某些列数据未被使用，因此你可以说此版本的查询效率低于示例 15-1 中的查询。不过与示例\
