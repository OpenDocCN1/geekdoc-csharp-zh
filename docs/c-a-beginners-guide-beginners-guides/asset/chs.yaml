  \n## 第 23 章\n\n## 运算符重载\n\n### 关键技能与概念\n\n![Image](img/00002.jpeg) 运算符重载介绍\n\n![Image](img/00002.jpeg)\
  \ 运算符重载方法要求\n\n![Image](img/00002.jpeg) 可以被重载的运算符\n\n***\n\n本章讨论了一种名为运算符重载的技术，用于为复杂对象的数学运算提供简写语法。运算符重载更多地出现在应用高级数学的库中，例如游戏或图形程序编程。如果你正在编写业务应用程序，可能不太会开发运算符重载，但有时也有此需要。尽管如此，在任何种类型的应用程序中，你都可能使用带有预定义运算符重载的库，因此了解它们是如何开发和应用是有帮助的。\n\
  \n### 运算符重载介绍\n\n运算符重载提供了一种简便的方法，使用复杂对象实现如 `+`、`–`、`*` 或 `/` 等运算符。\n\n在开始学习语法细节之前，这里有一个\
  \ + 运算符重载的示例，它用于将两个 `Budget` 对象的 `Revenue` 和 `Expenses` 属性相加：\n\n![Image](img/00513.jpeg)\n\
  \n通过这个 `+` 重载，你现在有了一种快速添加 `Budget` 对象属性值的方法：\n\n```\nBudget combined = retailBudget\
  \ + onlineBudget;\n```\n\n计算两个属性集合的总和并不算惊艳，但当必须同时调整多个属性时，重载的运算符可能会非常有帮助。\n\n###\
  \ 运算符重载方法要求\n\n关于运算符重载方法存在一些准则。运算符重载方法必须：\n\n- 是公共的 (public) (![Image](img/00002.jpeg))\n\
  - 是静态的 (static) (![Image](img/00002.jpeg))\n- 位于其操作的结构体或类中 (![Image](img/00002.jpeg))\n\
  - 接收至少一个与其操作的类或结构体类型相同的参数 (![Image](img/00002.jpeg))\n\n### 可以被重载的运算符\n\n并不是所有运算符都可以重载。下表显示了可以被重载的常用运算符。\n\
  \n![Image](img/00514.jpeg)\n\n***注意*** 当你实现如 `true`、`false`、`==`、`!=`、`<`、`>`、<=\
  \ 或 `>= 等布尔运算符时，必须同时存在对应的 true 和 false 等效重载。例如，如果你创建一个 `>` 运算符重载，你也需要有一个 `<` 运算符重载。\n\
  \n***\n\n**示例 23-1** Budget 对象的运算符重载\n\n***\n\n此示例使用 `+` 运算符生成 `Budget` 类中 `Expenses`\
  \ 和 `Revenue` 属性的组合总和。它还包含了 `true` 运算符的重载，用于检查 `Expenses` 和 `Revenue` 属性值是否都为零。由于\
  \ `true` 运算符是一个布尔运算符，`Budget` 类中必须包含一个 `false` 运算符重载以满足编译要求。\n\n![Image](img/00515.jpeg)\n\
  \n以下输出显示零售和在线预算的收入和支出总和，以及通过 `+` 运算符重载帮助提供的组合总和。一个非空但收入和支出均为零的 `Budget` 对象在 `true`\
  \ 运算符重载的帮助下显示为空。\n\n![Image](img/00516.jpeg)\n\n***\n\n***\n\n### 尝试练习 23-1 创建并使用\
  \ * 运算符重载\n\n这是一个让你尝试编写重载语法的机会。\n\n**1**. 从示例 23-1 开始，为 `Budget` 类添加一个 `*` 运算符重载，除了接收一个\
  \ `Budget` 对象作为参数外，还接收一个名为 `inflation` 的小数参数。\n\n**2**. 在新运算符重载的体中添加代码，使用参数值膨 `Revenue`\
  \ 和 `Expenses` 属性。然后将调整后的 `Budget` 对象返回给调用指令。\n\n**3**. 在 `Main()` 方法中，在 `ReadLine()`\
  \ 指令之前，测试你的新重载，将组合对象的属性增加 10%。你可以使用以下指令：\n\n```\ncombined *= 1.1m;\ncombined.ShowBudget(\"\
  Inflated Budget:\");\n```\n\n**4**. 显示使用 `*` 运算符为组合对象生成的新 `Revenue` 和 `Expenses`\
