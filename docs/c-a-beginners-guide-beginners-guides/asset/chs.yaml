  \n```cs\ndouble y = 10;\n```\n\n### 数组\n\n我们目前为止讨论的变量结构只引用一个数据值。然而，有时你需要更复杂的结构来管理更大的数据集。存储和访问多个值的基本结构之一是数组。数组存储多个相同数据类型的值。\n\
  \n#### 数组语法\n\n数组中的每个值都存储在数组的 `element`（元素）中。数组的元素通过 `index`（索引）顺序引用。数组通常是一维的，但根据需要，它们也可以有多个维度。对于一维数组，每个元素都通过唯一的索引引用。默认情况下，一维数组的第一个元素的索引为\
  \ `0`。后续的所有元素通过递增的索引引用。此指令声明了一个字符串数组并在其中存储了三个值：\n\n```cs\nstring[] planets = { \"\
