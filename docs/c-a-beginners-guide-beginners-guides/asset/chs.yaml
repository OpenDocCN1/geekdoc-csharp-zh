  \n## 反序列化\n\n反序列化是将 XML 转换为 C# 数据对象或 C# 对象列表的过程。反序列化过程实际上比序列化更简单，因为你可以使用 LINQ 查询\
  \ XML，直接以所需的格式检索数据。以下是一个查询示例，它从 XML 文档中提取 `Employee` 对象并将其存储在列表中。查询的每一行都提取所需的 XML\
  \ 内容并存储在对象的属性中。注意与之前过的 LINQ 符号表示略有不同。在 `Select()` 扩展方法中定义列时，`new Employee()` 短语确保了查询的每一行都转换为一个\
