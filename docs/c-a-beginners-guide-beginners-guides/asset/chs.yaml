  \n`McCain`\n\n`Pillsbury`\n\n`Sysco`\n\n* * *\n\n#### 聚合摘要查询\n\n聚合查询是生成表格摘要的数据库查询。用于生成摘要的常用扩展方法包括\
  \ `Average()`、`Count()`、`Max()`、`Min()` 和 `Sum()`。摘要查询返回的数据行通过 `GroupBy()` 方法中指定的分组列进行分类。每个分组列随后可以在\
