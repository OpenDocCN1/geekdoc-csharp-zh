  \ 将为查询分配一个 null 值。\n\n**提示**\n\n如果你在编写复杂查询时遇到困难，请将查询拆分成简单的步骤。由于 `IQueryable` 接口在定义时并不执行查询，因此可以在定义查询来生成发送到数据库的请求。这可以减少减少发送到应用程序的请求。\n\
  \n**示例 15-10** 子查询\n\n此示例显示了如何使用 `Distinct()` 扩展方法获取唯一产品列表：\n\n![image](img/00319.jpeg)\n\
