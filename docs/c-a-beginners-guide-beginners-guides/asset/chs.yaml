  \ 循环遍历数组，将存储在数组中的值打印到窗口。\n\n\n\n\n\n数据驱动开发的一个重要部分是将文本输入和输出转换为专业且有意义的数据。在考虑安全性的同时，确保应用程序处理的文本符合预期的格式也同样重要。虽然字符串处理看似微不足道，但能够解析和修改字符串输入与输出是任何数据驱动开发者的核心技能。为了帮助这项工作，C#\
  \ 语言提供了一个丰富的库来管理文本字符串。本章将展示 C# 中一些最常见且重要的字符串操作例程。\n\n## 数值格式指定符\n\nC# 提供了许多方便的选项以用户友好的格式显示数值数据。为了启用数值格式化，`float`、`decimal`、`integer`\
  \ 和 `double` 等 C# 类型提供了 `ToString()` 方法，并带有控制数值数据如何显示为文本的选项。`ToString()` 方法由所有对象提供——数值数据类型仅提供了实用的重载。\n\
  \n#### 原始文本\n\n在不带参数的情况下，`ToString()` 方法将数字转换为原始文本：\n\n```csharp\ndouble num = 123456.789d;\n\
  Console.WriteLine(num.ToString()); // 输出 123456.789\n```\n\n#### 四舍五入\n\n在 `ToString()`\
  \ 方法中传递带有小数点后跟零的字符串参数作为占位符，会将数字四舍五入到与占位符相同的总位数。仅在 `ToString()` 方法中传递“0”作为参数会将数字四舍五入，以便显示最接近的整数值：\n\
  \n![image](img/00106.jpeg)\n\n### 带千位分隔符的四舍五入\n\n在 `ToString()` 方法中字母“N”后跟数字将输出带有千位分隔符的数字，并将四舍五入到\
  \ *n* 位：\n\n```csharp\ndouble num = 123456.789d;\nConsole.WriteLine(num.ToString(\"\
  N2\")); // 输出 123,456.79\n```\n\n### 显示本地货币\n\n要以本地货币格式输出数字，向 `ToString()` 方法传递字母“C”：\n\
  \n```csharp\ndouble num = 123456.789d;\nConsole.WriteLine(num.ToString(\"C\"));\
  \ // 输出 $123,456.79\n```\n\n### 字符串解析\n\n解析字符串允许你提取有关字符串中不同部分的数据。C# 提供了许多方法来帮助发现字符串中的重要信息。\n\
  \n#### 长度\n\n字符串对象的 `Length` 属性返回字符串的字符计数：\n\n```csharp\nstring stringVarName =\
  \ \"some text\";\nint stringLength = stringVarName.Length; // 赋值 9\n```\n\n**示例\
  \ 6-1** 字符串长度\n\n字符串类型可以被字符字符数组——每个字符都是 `char` 类型的值，并且可以通过索引进行引用。借助字符串对象的 `Length`\
  \ 属性，此代码示例使用循环逐个地引用并打印字符串中的每个字符：\n\n![image](img/00107.jpeg)\n\n输出显示了字符串的单个字符以及字符串中的字符总数：\n\
  \n```text\n原始字符串的长度: 18\nMaurine Shambarger\n字母计数为: 18\n```\n\n![Image](img/00013.jpeg)\n\
  \n#### IndexOf()\n\n为了找到特定字符 set 的起始位置，`IndexOf()` 方法返回子字符串在字符串对象中首次出现的位置索引。当未找到子字符串的出现项时，`IndexOf()`\
  \ 方法返回 -1。下面列出的两个重载为您在搜索字符串中的字符组合时提供了灵活性。列出的第一个 `IndexOf()` 方法接收搜索字符串值作为参数。第二个 `IndexOf()`\
  \ 方法接收搜索字符串和搜索的起始位置。\n\n```csharp\nint IndexOf(string value);\nint IndexOf(string\
  \ value, int startIndex);\n```\n\n在此示例中，`IndexOf()` 定位了字符串中每个逗号的位置：\n\n![image](img/00108.jpeg)\n\
  \n#### LastIndexOf()\n\n`LastIndexOf()` 方法返回搜索字符串最后一次出现的位置。当未找到所需的子字符串时，`LastIndexOf()`\
  \ 返回 -1。\n\n```csharp\nint LastIndexOf(string value);\n```\n\n在此示例中，返回了最后一个逗号的位置：\n\
  \n![image](img/00109.jpeg)\n\n### Substring（子字符串）\n\n在解析内容时，你可能只想提取字符串的某部分。当提供了了子字符串的起始位置和长度时，`Substring()`\
  \ 方法可以提取字符串的一部分：\n\n```csharp\nstring Substring(int characterStartPosition, int\
  \ substringLength);\n```\n\n在接下来的示例中，`Substring()` 方法从格式化字符串中提取城市名，该格式始终在冒号和空格后开始城市名。城市名后面总是跟着一个逗号。`IndexOf()`\
  \ 方法定位了城市数据的起始和结束位置，以便可以使用 `Substring()` 方法进行读取。\n\n![image](img/00110.jpeg)\n\n\
  ### Split()（分割）\n\n在管理包含在字符分隔字符串中的数据时，你可以选择创建一个带有字符串内容的数组。`Split()` 方法将用常用字符分隔的字符串部分存储到数组中。用作分隔符的字符被称为\
  \ *delimiter*（分隔符）。\n\n```csharp\nstring[] stringArray = stringObject.Split(char\
  \ charValue);\n```\n\n`Split()` 方法使用逗号分隔符作为参数将位置组件分离成字符串数组：\n\n![image](img/00111.jpeg)\n\
  \n## 尝试练习 字符串格式化与解析\n\n此练习提供了指定符和解析的练习。\n\n1. 写一个程序声明以下字符串：`Name: Spencer Balance:\
