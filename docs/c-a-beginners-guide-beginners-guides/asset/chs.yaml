  \ 命名空间的引用\n\n完成后，你将在项目的引用文件夹中看到 `System.Configuration`（参见图 18-2）。\n\n![image](img/00379.jpeg)\n\
  \n**图 18-2** System.Configuration 引用\n\n\n\n\n由 `SqlDataAdapter` 对象管理的 SQL 查询和存储过程查询通过\
  \ `SelectCommand` 属性进行引用。你有多种选项可以设置和获取 `SelectCommand` 属性，以调节查询的运行方式。你可以像下面所示分配对象的\
  \ `SelectCommand.CommandTimeout` 属性（以秒为单位），以定义应用程序在查询期间等待数据库响应的总时间。如果数据库在此时间内未做出响应，适配器将终止查询并抛出错误。默认时间为\
  \ 30 秒，但可以将该时间设置为不同的整数值。\n\n```\nint CommandTimeout { get; set; }\n```\n\n**示例 18-3**\
