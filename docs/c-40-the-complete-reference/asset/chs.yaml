- "# C# 4.0：完全参考\n\n\n\n![](img/0071741178_ci_std.jpg)\n\n\n## 关于作者\n\n**Herbert Schildt**\
  \ 是 `C#`、`C++`、`C` 和 `Java` 领域的领先权威。他的编程书籍全球销量数百万，并被翻译成所有主要外语。他是多本畅销书的作者，包括 `Java:\
  \ The Complete Reference`、`C++: The Complete Reference` 和 `C: The Complete Reference`\
  \ 等。尽管他对计算的各个方面都感兴趣，但主要重点是计算机语言，包括编译器、解释器和机器人控制语言。他对于语言标准化也有浓厚的兴趣。Schildt 拥有伊利诺伊大学的硕士和本科学位。可以通过他的咨询办公室电话\
  \ (217) 586-4683 与他联系。他的网站为 **[www.HerbSchildt.com](http://www.HerbSchildt.com)**。\n\
  \n## 关于技术编辑\n\n**Michael Howard** 是微软可信计算 (TwC) 组安全工程团队的主安全计划经理，负责管理全公司的安全设计、编程和测试技术。Howard\
  \ 是安全开发生命周期 (SDL) 的架构师，该流程旨在提高微软软件的安全性。\n\nHoward 于 1992 年在微软新西兰办公室开始其职业生涯，在前两年在产品支持服务团队负责\
  \ `Windows` 和编译器工作，随后在微软咨询服务部门工作，在那里为客户提供安全基础设施支持，并协助定制解决方案的设计和软件开发。1997 年，Howard\
  \ 移居美国，在 `Windows` 部门负责 `Internet Information Services`（微软的下一代网络服务器）工作，直到在 2000\
  \ 年担任目前的职位。\n\nHoward 是 `IEEE Security & Privacy` 杂志的编辑，安全相关会议的频繁演讲者，并定期发表关于安全编码和设计的文章。Howard\
  \ 是六本安全类书籍的合著者，包括获奖著作 `Writing Secure Code`、`24 Deadly Sins of Software Security`、`The\
  \ Security Development Lifecycle` 以及他最近出版的 `Writing Secure Code for Windows Vista.`。\n\
  \n\nHerbert Schildt\n\n![Image](img/pub.jpg)\n\n![Image](img/logob.jpg)\n\n\n\n\n\
  \n\n\n\n\n\n\n# 索引\n\n# 特谢\n\n特别感谢 Michael Howard 提供卓越的技术编辑。他的见解、建议和指导具有巨大的价值。\n\
  \n# 前言\n\n我们程序员是一群挑剔的群体，总是寻找改进程序性能、效率和可移植性的方法。我们对所使用的工具也有很大要求，特别是在涉及编程语言时。编程语言有很多，但只有极少数是出色的。一个出色的编程语言必须是强大且灵活的。它的语法必须简洁而清晰。它必须在方便我们创建正确代码的同时不阻碍我们。它必须支持前沿特性，而不是追随潮流的死胡同。最后，一个出色的编程语言还必须具备几乎无形的特质：当我们使用它时，感觉是恰当的。C#\
  \ 就是这样一种语言。\n\n微软为了支持其 `.NET Framework` 而创建了 C#，它建立在丰富的编程遗产之上。它的首席架构师是长期的编程大师 Anders\
  \ Hejlsberg。C# 直接源自世界上最成功的两种计算机语言：C 和 C++。它从 C 处继承了语法、许多关键字以及大多数操作符。它在 C++ 定义的对象模型基础上进行了构建和改进。C#\
  \ 也与另一个非常成功的语言 Java 紧密相关。\n\nC# 和 Java 拥有共同的祖先，但在许多重要方面有所不同，它们更像是堂兄弟。两者都支持分布式编程，并且都使用中间代码来实现安全性和可移植性，但细节上有所不同。它们都提供了大量的运行时错误检查、安全保障和托管执行，但细节上再次各不相同。然而，与\
  \ Java 不同的是，C# 还允许你访问指针——这是 C++ 支持的特性。因此，C# 结合了 C++ 的原生力量和 Java 的类型安全。此外，力量与安全之间的权衡经过了仔细平衡，并且几乎是透明的。\n\
  \n在整个计算史中，编程语言不断演变，以适应计算环境的变化、计算机语言理论的进步以及思考和处理编程工作的新方法。C# 也不例外。在不断的精炼、适应和创新过程中，C#\
  \ 展现了其快速响应程序员不断变化的需求的能力。这一事实通过自 2000 年发布 1.0 版本以来添加到 C# 的许多新特性得到了证明。考虑以下内容。\n\n\
  C# 的第一个重大修订是 2.0 版本。它添加了几个特性，让程序员更容易编写出更具健壮性、可靠且灵活的代码。毫无疑问，2.0 版本最重要的添加是泛型。通过使用泛型，在\
  \ C# 中创建类型安全、可重用的代码成为可能。因此，泛型的引入从根本上扩展了该语言的力量和范围。\n\n第二次重大修订是 3.0 版本。毫不夸张地说，3.0\
  \ 版本添加的特性重新定义了 C# 的核心，并在此过程中提高了计算机语言开发的基准。在它的许多创新特性中，有两个脱颖而出：LINQ 和 lambda 表达式。LINQ\
  \ 代表语言集成查询，允许你使用 C# 语言的元素来创建数据库风格的查询。Lambda 表达式实现了一种使用 `=>` lambda 运算符的函数式语法，且 lambda\
  \ 表达式经常用在 LINQ 表达式中。\n\n第三次重大修订是 C# 4.0，这也是本书所描述的版本。它在之前版本的基础上通过提供许多新特性来简化了常见的编程任务。例如，它添加了命名参数和可选参数。这些使得某些类型的方法调用更加方便。它添加了\
  \ `dynamic` 关键字，便于在运行时获取数据类型的情况下（例如在 COM 接口或使用反射时）使用 C#。C# 已支持的协变和逆变特性已扩展到可用于类型参数。通过对\
  \ `.NET Framework`（C# 的库）的增强，通过任务并行库（TPL）和并行 LINQ（PLINQ）提供了对并行编程的支持。这些子系统使得创建能够自动扩展以更好地利用多核计算机的代码变得简单。因此，随着\
  \ 4.0 的发布，C# 已准备好利用高性能计算平台的优势。\n\n由于能够快速适应编程领域不断变化的需求，C# 一直保持着充满活力和创新的语言。因此，它定义了现代计算中最强大、功能最丰富的语言之一。它也是任何程序员都无法忽视的语言。本书旨在帮助你精通它。\n\
  \n## 内部内容\n\n本书描述了 C# 4.0。它分为两部分。`第一部分` 对 C# 语言进行了全面讨论，包括关键字、语法和版本 4.0 添加的特性。`第一部分`\
  \ 还讨论了 I/O、文件处理、反射和预处理器。\n\n`第二部分` 探索了类库。这个库巨大！由于空间限制，无法在一本书中涵盖整个 .NET 库。相反，`第二部分`\
  \ 专注于包含 `System` 命名空间的核心库。涵盖了集合、多线程、任务并行库和 PLINQ。这些是几乎 C# 程序员都会使用的库部分。\n\n## 适合所有程序员的书\n\
  \n本书不需要任何编程经验。如果你已经熟悉 C++ 或 Java，你将进步非常快，因为 C# 与这些语言有许多共同点。如果你没有任何编程经验，仍然可以从本书学习\
  \ C#，但你需要仔细研究每一章中的示例。\n\n## 所需软件\n\n要编译和运行 C# 4.0 程序，必须使用 Visual Studio 2010 或更高版本。\n\
  \n## 不要忘记：网上的代码\n\n记住，书书中所有程序的源代码可以在网络上的 [www.mhprofessional.com](http://www.mhprofessional.com)\
  \ 免费获取。\n\n## 深入学习\n\n*C# 4.0: The Complete Reference* 是你进入 Herb Schildt 系列编程书籍的大门。这里是其他你可能感兴趣的书。\n\
  \n要学习 Java 编程，我们推荐以下书籍：\n\n*Java: The Complete Reference*\n*Java: A Beginner’s Guide*\n\
  *Swing: A Beginner’s Guide*\n*The Art of Java*\n*Herb Schildt’s Java Programming\
  \ Cookbook*\n\n要学习 C++，这些书籍对你非常有帮助：\n\n*C++: The Complete Reference*\n*C++: A Beginner’s\
  \ Guide*\n*C++ From the Ground Up*\n*STL Programming From the Ground Up*\n*The Art\
  \ of C++*\n*Herb Schildt’s C++ Programming Cookbook*\n\n如果你想更多关于作为现代编程基础的 C 语言，以下标题将引起你的兴趣：\n\
  \n\n\n\n\n*C 语言完全参考*\n\n当你需要可靠且快速的答案时，请参考编程领域的公认权威 Herbert Schildt。\n\n# 第一部分 C#\
  \ 语言\n\n第 1 部分 讨论了 C# 语言的元素，包括其关键字、语法和运算符。书中还描述了若干基础 C# 技术，例如使用 I/O 和反射，这些技术与 C#\
  \ 语言紧密相关。\n\n## [第 1 章]C#的诞生](#ch01.html_ch01)\n\n## [第 2 章]C#概述](#ch02.html_ch02)\n\
