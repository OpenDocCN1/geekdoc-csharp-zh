  位或可用于开启位。任何操作数中任一个为 1 的位都会导致变量中对应的位被设置为 1。例如\n\n![Image](img/t0078-01.jpg)\n\n你可以利用\
  \ OR 将之前显示的 make-even 程序改为 make-odd 程序，如下所示：\n\n```csharp\n// 使用位或运算使数字变为奇数。\nusing\
  \ System;\nclass MakeOdd {\n    static void Main() {\n        ushort num;\n    \
  \    ushort i;\n        for(i = 1; i <= 10; i++) {\n            num = i;\n     \
  \       Console.WriteLine(\"num: \" + num);\n            num = (ushort) (num | 1);\n\
  \        }\n    }\n}\n```\n\n\n\n\n\n```csharp\n        Console.WriteLine(\"num\
  \ after turning on bit zero: \" + num + \"\\n\");\n    }\n}\n}\n```\n\n该程序的输出所示：\n\
  num: 1\nnum after turning on bit zero: 1\nnum: 2\nnum after turning on bit zero:\
  \ 3\nnum: 3\nnum after turning on bit zero: 3\nnum: 4\nnum after turning on bit\
  \ zero: 5\nnum: 5\nnum after turning on bit zero: 5\nnum: 6\nnum after turning on\
  \ bit zero: 7\nnum: 7\nnum after turning on bit zero: 7\nnum: 8\nnum after turning\
  \ on bit zero: 9\nnum: 9\nnum after turning on bit zero: 9\nnum: 10\nnum after turning\
  \ on bit zero: 11\n```\n\n该程序通过将每个数字与值 `1` 进行按位或（OR）来工作，因为 `1` 是二进制中只有第 0 位被置 1\
  \ 的值。当此值与任何其他值进行按位或时，产生的结果的低位为 1，而所有其他位保持不变。因此，偶值将增加 1，变成奇数。\n\n异或（exclusive OR，通常缩写为\
  \ XOR）仅当比较的位不同时会将某位置为 1，如图所示：\n\n![Image](img/t0079-01.jpg)\n\nXOR 运算符有一个有趣的属性，在许多情况下都有用。当某个值\
  \ `X` 与另一个值 `Y` 进行异或后，然后将该结果再次与 `Y` 进行异或时，就会产生 `X`。也就是说，给定序列\n\n```csharp\nR1 =\
  \ X ^ Y;\nR2 = R1 ^ Y;\n```\n\n`R2` 的值与 `X` 相同。因此，使用相同值进行两次异或序列的结果会产生原始值。XOR 的这一特性可以用于创建一个简单的加密算法，其中某个整数作为密钥，通过异或消息中的字符来同时对消息进行加密和解码。加密时，第一次应用异或操作产生密文。解码时，第二次应用异或操作，产生明文。当然，这种加密算法没有实际价值，因为它极易被破解。\n\
  \n```csharp\n// 演示 XOR。\nusing System;\n\nclass Encode {\n  static void Main() {\n\
  \    char ch1 = 'H';\n    char ch2 = 'i';\n    char ch3 = '!';\n    int key = 88;\n\
  \    Console.WriteLine(\"Original message: \" + ch1 + ch2 + ch3);\n    // 加密消息。\n\
  \    ch1 = (char) (ch1 ^ key);\n    ch2 = (char) (ch2 ^ key);\n    ch3 = (char)\
  \ (ch3 ^ key);\n    Console.WriteLine(\"Encoded message: \" + ch1 + ch2 + ch3);\n\
  \    // 解码消息。\n    ch1 = (char) (ch1 ^ key);\n    ch2 = (char) (ch2 ^ key);\n  \
  \  ch3 = (char) (ch3 ^ key);\n    Console.WriteLine(\"Decoded message: \" + ch1\
  \ + ch2 + ch3);\n  }\n}\n```\n\n这里是输出：\nOriginal message: Hi!\nEncoded message:\
  \ q1y\nDecoded message: Hi!\n\n如你所见，使用相同密钥进行两次异或的结果产生了解码后的明文。（记住，这种简单的加密算法不适用于任何现实世界，因为它从本质上是不安全的。）\n\
  \n一元按取反（NOT）运算符会反转操作数所有位的状态。例如，如果某个名为 `A` 的整数位模式为 `1001 0110`，那么 `~A` 产生的结果位模式为\
  \ `0110 1001`。以下程序通过显示一个数字及其取反数来演示 NOT 运算符：\n\n```csharp\n// 演示按位取反。\nusing System;\n\
  \nclass NotDemo {\n  static void Main() {\n    byte b = -34;\n    for(int t=28;\
  \ t > 0; t = t/2) {\n      if((b & t) != 0) Console.Write(\"1 \");\n      if((b\
  \ & t) == 0) Console.Write(\"0 \");\n    }\n    Console.WriteLine();\n    // 反转所有位\n\
  \    b = (byte)~b;\n    for(int t=28; t > 0; t = t/2) {\n      if((b & t) != 0)\
  \ Console.Write(\"1 \");\n      if((b & t) == 0) Console.Write(\"0 \");\n    }\n\
  \  }\n}\n```\n\n这里是输出：\n1011110\n00100001\n\n### 移位运算符\n\n在 C# 中，可以将组成整数值的位向左或向右移位指定的位数。C#\
