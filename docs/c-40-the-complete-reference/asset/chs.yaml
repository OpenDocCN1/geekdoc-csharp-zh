  \ != 0) || (op2.z != 0)) )\n    return new ThreeD(1, 1, 1);\n  else\n    return\
  \ new ThreeD(0, 0, 0);\n}\n\n// 为短路求值重载 & 运算符。\npublic static ThreeD operator&(ThreeD\
  \ op1, ThreeD op2)\n{\n  if((op1.x != 0) && (op1.y != 0) && (op1.z != 0)) &\n  \
  \    ((op2.x != 0) && (op2.y != 0) && (op2.z != 0)) )\n    return new ThreeD(1,\
  \ 1, 1);\n  else\n    return new ThreeD(0, 0, 0);\n}\n```\n\n首先注意两者返回的都是一个 `ThreeD`\
  \ 类型的对象。注意此对象是如何生成的。如果操作结果为真，则创建并返回一个 `ThreeD` 对象（至少有一个坐标非零的对象）。如果结果为假，则创建并返回一个假对象。因此，在如下语句中：\n\
  \n```csharp\nif(a & b) Console.WriteLine(\"a & b is true.\");\nelse Console.WriteLine(\"\
  a & b is false.\");\n```\n\n`a & b` 的结果是一个 `ThreeD` 对象，在在这种情况下它是真的。由于定义了 `true`\
  \ 和 `false` 运算符，此结果对象将接受 `true` 运算符的处理，并返回一个 `bool` 结果。在这种情况下，`if` 执行成功。\n\n由于遵循了必要的规则，短路运算符现在已适用于\
  \ `ThreeD` 对象。它们的工作原理如下：第一个操作数通过 `operator true`（针对 `||`）或 `operator false`（针对 `&&`）进行测试。如果它能确定结果，则不会评估相应的\
  \ `&` 或 `|`。否则，将使用重载的 `&` 或 `|` 来确定结果。例如，考虑程序中的这条语句：\n\n```csharp\nif(a || c) Console.WriteLine(\"\
  a || c is true.\");\n```\n\n`true` 运算符被应用于 `a`。由于在这种情况下 `a` 为真，因此没有必要继续操作。\n\n，，\
