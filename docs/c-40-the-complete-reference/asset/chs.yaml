  \ 和 `t`符日期和符`符符。符位符 `d`、`f`、`g`、`M`、`s` 和 `t`符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符符\n\
  \    译文：\n\n[content]\nDate and time formatting is handled through format specifiers.\
  \ The format specifiers for date and time are shown in Table 22-7. Because the specific\
  \ date and time representation may vary from country and by language, the precise\
  \ representation generated will be influenced by the cultural settings.\n\n![Image](img/t0726-01.jpg)\n\
  \n**TABLE 22-7** The Date and Time Format Specifiers\n\nHere is a program that demonstrates\
  \ the date and time format specifiers:\n\n```csharp\n// Format time and date information.\n\
  \nusing System;\n\nclass TimeAndDateFormatDemo {\n  static void Main() {\n    DateTime\
  \ dt = DateTime.Now; // obtain current time\n    Console.WriteLine(\"d format: {0:d}\"\
  , dt);\n    Console.WriteLine(\"D format: {0:D}\", dt);\n    Console.WriteLine(\"\
  t format: {0:t}\", dt);\n    Console.WriteLine(\"T format: {0:T}\", dt);\n    Console.WriteLine(\"\
  f format: {0:f}\", dt);\n    Console.WriteLine(\"F format: {0:F}\", dt);\n    Console.WriteLine(\"\
  g format: {0:g}\", dt);\n    Console.WriteLine(\"G format: {0:G}\", dt);\n    Console.WriteLine(\"\
  m format: {0:m}\", dt);\n    Console.WriteLine(\"M format: {0:M}\", dt);\n    Console.WriteLine(\"\
  o format: {0:o}\", dt);\n    Console.WriteLine(\"O format: {0:O}\", dt);\n    Console.WriteLine(\"\
  r format: {0:r}\", dt);\n    Console.WriteLine(\"R format: {0:R}\", dt);\n    Console.WriteLine(\"\
  s format: {0:s}\", dt);\n    Console.WriteLine(\"u format: {0:u}\", dt);\n    Console.WriteLine(\"\
  U format: {0:U}\", dt);\n    Console.WriteLine(\"y format: {0:y}\", dt);\n    Console.WriteLine(\"\
  Y format: {0:Y}\", dt);\n  }\n}\n```\n\nSample output is shown here:\n\nd format:\
  \ 2/11/2010\nD format: Thursday, February 11, 2010\nt format: 11:21 AM\nT format:\
  \ 11:21:23 AM\nf format: Thursday, February 11, 2010 11:21 AM\nF format: Thursday,\
  \ February 11, 2010 11:21:23 AM\ng format: 2/11/2010 11:21 AM\nG format: 2/11/2010\
  \ 11:21:23 AM\nm format: February 11\nM format: February 11\no format: 2010-02-11T11:21:23.3768153-06:00\n\
  O format: 2010-02-11T11:21:23.3768153-06:00\nr format: Thu, 11 Feb 2010 11:21:23\
  \ GMT\nR format: Thu, 11 Feb 2010 11:21:23 GMT\ns format: 2010-02-11T11:21:23\n\
  u format: 2010-02-11 11:21:23Z\nU format: Thursday, February 11, 2010 5:21:23 PM\n\
  y format: February, 2010\nY format: February, 2010\n\nThe next program creates a\
  \ very simple clock. The time is updated once second. At the top of each hour, the\
  \ computer’s bell is sounded. It uses the `ToString()` method of `DateTime` to obtain\
  \ formatted time. If the top of the hour has been reached, the alert character `\\\
  a` is appended to the formatted time, ringing the bell.\n\n```csharp\n// A simple\
  \ clock.\nusing System;\nclass SimpleClock {\n  static void Main() {\n    string\
  \ t;\n    int seconds;\n    DateTime dt = DateTime.Now;\n    seconds = dt.Second;\n\
  \    for(;;) {\n      dt = DateTime.Now;\n      // update time if seconds change\n\
  \      if(seconds != dt.Second) {\n        seconds = dt.Second;\n        t = dt.ToString(\"\
  T\");\n        if(dt.Minute == 0 && dt.Second == 0)\n          t = t + \"\\a\";\
  \ // ring bell at top of hour\n        Console.WriteLine(t);\n      }\n    }\n \
  \ }\n}\n```\n\n##### Creating a Custom Date and Time Format\n\nAlthough the standard\
  \ date and time specifiers will apply to the vast majority of situations, you can\
  \ create your own custom formats. The process is similar to creating custom formats\
  \ for the numeric types, described earlier. In essence, you simply create an example\
  \ (picture) of what you want the date and time information to look like. To create\
  \ a custom date and time format, you will use one or more of the placeholders shown\
  \ in Table 22-8.\n\nIf you examine Table 22-8, you will see that the placeholders\
  \ `d`, `f`, `g`, `M`, `s`, and `t`\n\n\n\n\n```csharp\nenum Direction { North, South,\
  \ East, West }\n\n[Flags] enum Status { Ready=0x1, OffLine=0x2, Waiting=0x4, TransmitOK=0x8,\
  \ RecieveOK=0x10, OnLine=0x20 }\n\nstatic void Main() {\n    Direction d = Direction.West;\n\
  \    Console.WriteLine(\"{0:G}\", d);\n    Console.WriteLine(\"{0:F}\", d);\n  \
  \  Console.WriteLine(\"{0:D}\", d);\n    Console.WriteLine(\"{0:X}\", d);\n    Status\
  \ s = Status.Ready | Status.TransmitOK;\n    Console.WriteLine(\"{0:G}\", s);\n\
  \    Console.WriteLine(\"{0:F}\", s);\n    Console.WriteLine(\"{0:D}\", s);\n  \
  \  Console.WriteLine(\"{0:X}\", s);\n}\n}\n```\n\n输出所示：\n\nWest\nWest\n3\n00000003\n\
  Ready, TransmitOK\nReady, TransmitOK\n9\n00000009\n\n### 第 23 章\n\n多线程编程，第一部分\n\n\
  尽管 C# 包含许多令人兴奋的特性，但它最强大的特性之一就是对`多线程编程`的内置支持。多线程程序包含两个或多个可以并发运行的部分。此类程序的每个部分被称为一个\
  \ `thread`（线程），每个 `thread` 都定义了一个独立的执行路径。因此，多线程是多任务处理的一种特殊形式。\n\n多线程编程依赖于 C# 语言定义的特性以及\
  \ .NET Framework 中类定义的特性组合。由于 C# 内置了多线程支持，其他语言中与多线程相关的许多问题被降至最低或消除。正如你所看到的，C# 对多线程的支持既简洁又易理解。\n\
  \n随着 .NET Framework `4.0` 版本的发布，增加了两个与多线程应用程序相关的重要特性。第一个是`任务并行库`（Task Parallel Library，简称\
  \ `TPL`），另一个是`并行 LINQ`（Parallel LINQ，简称 `PLINQ`）。等等，`TPL` 和 `PLINQ` 是事实标准。它们都提供了并行编程的支持，并且都可以利用多处理器（多核）计算机。此外，`TPL`\
  \ 简化了多线程程序的创建和管理。正因如此，基于 `TPL` 的多线程现在是大多数情况下多线程的推荐方法。然而，出于几个原因，对原始多线程子系统的实战知识仍然非常重要。首先，有大量的预存（遗留）代码使用了原始方法。如果你将处理或维护这些代码，你需要知道原始线程系统是如何运行的。其次，基于\
  \ `TPL` 的代码可能仍使用原始线程系统的元素，特别是它的同步功能。第三，尽管 `TPL` 基于一个名为 `task`（任务）的抽象，但它仍然隐式地依赖于这里描述的\
  \ `threads` 和`基于线程的`特性。因此，要充分理解并利用 `TPL`，对本章的内容有深入理解。\n\n最后，必须说明多线程是一个非常大的课题。详细介绍它已超出了本书的范围。本章及后续章节将介绍该主题的概述，并展示了几种基本技术。因此，它作为这一重要主题的介绍，并提供了一个你可以在此基础上构建的基础。\n\
  \n#### 多线程基础\n\n多任务处理有两种本质不同的类型：`基于进程的`（process-based）和`基于线程的`（thread-based）。理解两者之间的区别至关重要。一个\
  \ `process`（进程）本质上是一个正在执行的程序。因此，`基于进程的多任务处理`允许你的计算机并发运行两个或多个程序。例如，基于进程的多任务处理允许你在使用电子表格或浏览互联网的同时运行一个文字处理器。在`基于进程的多任务处理`中，`program`（程序）是调度程序可以分发的最小代码单元。\n\
  \n一个 `thread`（线程）是一个可分派的可执行代码单元。该名称源于“执行线程”（thread of execution）的概念。在`基于线程的`多任务环境中，所有的\
  \ `processes` 至少包含一个 `thread`，但它们也可以有更多。这意味着一个程序可以同时执行两个或多个任务。例如，文本编辑器可以在打印的同时对文本进行格式化，只要这两个动作是由两个独立的\
  \ `threads` 执行的。\n\n`基于进程的`和`基于线程的`多任务处理之间的区别可以总结如下：`基于进程的多任务处理`处理程序的并发执行。`基于线程的多任务处理`处理同一个程序片段的并发执行。\n\
  \n多线程的主要优势是它能让你编写出非常高效的程序，因为它让你能够利用大多数程序中存在的空闲时间。正如你可能知道的那样，`I/O` 设备比 `CPU` 慢得多。\n\
  \n一个 `thread` 可以处于几种状态之一：`running`（运行）、`ready to run`（就绪）、`suspended`（挂起）、`blocked`（阻塞）或\
  \ `terminated`（终止）。\n\n.NET Framework 定义了两种线程：`foreground`（前台）和`background`（后台）。默认情况下，当你创建一个线程时，它是`foreground`线程，但你可以将其更改为`background`线程。前台和后台线程唯一的区别是，当所有`foreground\
  \ threads` 停止时，`background thread` 将自动终止。\n\n随着基于线程的多任务处理，还需要一种名为`synchronization`（同步）的特殊特性，它允许以某些定义的方式协调线程的执行。C#\
  \ 有一个专门用于同步的完整子系统，其关键特性在这里也有描述。\n\n所有的 `processes` 至少有一个执行 `thread`，它通常被称为 `main\
  \ thread`（主线程），因为它是程序启动时执行的那个线程。因此，`main thread` 是书中之前所有示例程序一直在使用的线程。从 `main thread`，你可以创建其他线程。\n\
  \n#### Thread 类\n\n多线程系统构建在 `Thread` 类之上，它封装了一个执行线程。`Thread` 类是 `sealed`（密封的），这意味着它不能被继承。`Thread`\
  \ 类定义了许多方法和属性来帮助管理线程。在本章中，将检查其中最常用的成员。\n\n##### 创建和启动线程\n\n创建和启动线程有多种方法。本节描述了基本机制。各种选项将在本章稍后部分描述。\n\
  \n要创建一个线程，请实例化 `Thread` 类型对象，它是定义在 `System.Threading` 中的一个类。简单的 `Thread` 构造函数所示：\n\
  \n```csharp\npublic Thread(ThreadStart start*)\n```\n\n\n\n\n在这里，`start` 指定了用于开始线程执行的方法。换句话说，它指定了线程的入口点。`ThreadStart`\
  \ 是 .NET Framework 定义的一个委托，如下所示：\n\n```csharp\npublic delegate void ThreadStart(\
  \ )\n```\n\n因此，你的入口点方法必须具有 `void` 返回类型且不接受任何参数。\n\n一旦创建，新线程在调用其 `Start()` 方法之前将不会开始运行，该方法由\
  \ `Thread` 定义。`Start()` 方法有两种形式。这里使用的使用的是：\n\n```csharp\npublic void Start( )\n\
  ```\n\n一旦启动，线程将一直运行，直到入口点方法返回。因此，当线程的入口点方法返回时，线程会自动停止。如果你尝试对一个已经启动的线程调用 `Start()`，将抛出\
  \ `ThreadStateException`。\n\n这里创建一个新线程并启动其运行的示例：\n\n```csharp\n// 创建一个执行线程。\nusing\
  \ System;\nusing System.Threading;\n\nclass MyThread {\n  public int Count;\n  string\
  \ thrdName;\npublic MyThread(string name) {\n    Count = 0;\n    thrdName = name;\n\
  \  }\n  // 线程的入口点。\n  public void Run() {\n      Console.WriteLine(thrdName + \"\
  \ starting.\");\n  do {\n      Thread.Sleep(500);\n      Console.WriteLine(\"In\
  \ \" + thrdName + \", Count is \" + Count);\n      Count++;\n    } while(Count <\
  \ 10);\nConsole.WriteLine(thrdName + \" terminating.\");\n  }\n}\n\nclass MultiThread\
  \ {\n  static void Main() {\n    Console.WriteLine(\"Main thread starting.\");\n\
  \    // 首先，构造一个 MyThread 对象。\n    MyThread mt = new MyThread(\"Child #1\");\n  \
  \  // 然后，从该对象构造一个线程。\n    Thread newThrd = new Thread(mt.Run);\n    // 最后，启动线程的执行。\n\
  \    newThrd.Start();\n    do {\n      Console.Write(\".\");\n      Thread.Sleep(100);\n\
  \    }   while (mt.Count != 10);\n    Console.WriteLine(\"Main thread ending.\"\
  );\n}\n}\n```\n\n让我们仔细观察这个程序。`MyThread` 定义了一个将用于创建第二个执行线程的类。在它的 `Run()` 方法内部，建立了一个从\
  \ 0 计数到 9 的循环。注意对 `Sleep()` 的调用，它是 `Thread` 定义的一个 `static` 方法。`Sleep()` 方法会导致调用它的线程挂起执行指定的毫秒数。程序使用的形式如下所示：\n\
  \n```csharp\npublic static void Sleep(int millisecondsTimeout)\n```\n\n挂起的毫秒数在 `millisecondsTimeout`\
  \ 中指定。如果 `millisecondsTimeout` 为零，则仅挂起调用线程以允许等待的线程执行。\n\n在 `Main()` 内部，通过以下语句序列创建了一个新的\
  \ `Thread` 对象：\n\n```csharp\n// 首先，构造一个 MyThread 对象。\nMyThread mt = new MyThread(\"\
  Child #1\");\n// 然后，从该对象构造一个线程。\nThread newThrd = new Thread(mt.Run);\n// 最后，启动线程的执行。\n\
  newThrd.Start();\n```\n\n正如注释所示，首先创建了一个 `MyThread` 对象。然后通过传递 `mt.Run()` 方法作为入口点，用于构造一个\
  \ `Thread` 对象。最后，通过调用 `Start()` 启动新线程的执行。这导致 `mt.Run()` 在它自己的线程开始执行。调用 `Start()`\
  \ 后，主线程的执行返回到 `Main()`，并进入 `Main()` 的 `do` 循环。两个线程继续运行并共享 CPU，直到它们的循环结束。此程序产生的输出如下（你看到的精确输出可能会因为你的环境、操作系统和任务负载的差异而有所不同）：\n\
  \nMain thread starting.\nChild #1 starting.\nIn Child #1, Count is 0\nIn Child #1,\
  \ Count is 1\nIn Child #1, Count is 2\nIn Child #1, Count is 3\nIn Child #1, Count\
  \ is 4\nIn Child #1, Count is 5\nIn Child #1, Count is 6\nIn Child #1, Count is\
  \ 7\nIn Child #1, Count is 8\nIn Child #1, Count is 9\nChild #1 terminating.\nMain\
  \ thread ending.\n\n在多线程程序中，你通常希望主线程最后一个完成。从技术上讲，程序会一直运行直到其所有的前台线程（foreground threads）完成。因此，让主线程最后结束并不是要求的。然而，这是一种良好的做法，因为它清晰地定义了程序的终点。前面的程序通过在\
  \ `Main()` 的 `do` 循环中检查 `Count` 的值、当 `Count` 等于 10 时停止以及通过调用 `Sleep()` 来尝试确保主线程将结束。然而，这并不是完美的方法。在本章稍后的部分，你将看到一个线程等待另一个线程更好的方法。\n\
  \n### 简单改进\n\n虽然前面的程序是完全有效的，但简单的改进会使其更高效。首先，可以让线程在被创建时立即开始执行。在 `MyThread` 的情况下，这是通过\
  \ `MyThread` 的构造函数内部实例化 `Thread` 对象来实现的。其次，`MyThread` 不需要存储线程名称，因为 `Thread` 定义了一个可以用于此目的的属性\
  \ `Name`。这种定义如下：\n\n```csharp\npublic string Name { get; set; }\n```\n\n由于 `Name`\
  \ 是一个读写属性，你可以用它设置或获取线程名称。这是前面的程序的改进版本：\n\n```csharp\n// 另一种启动线程的方式。\nusing System;\n\
  using System.Threading;\n\nclass MyThread {\n  public int Count;\n  public Thread\
  \ Thrd;\n  public MyThread(string name) {\n    Count = 0;\n    Thrd = new Thread(this.Run);\n\
  \    Thrd.Name = name; // 设置线程名称\n    Thrd.Start(); // 启动线程\n  }\n  // 线程的入口点。\n\
  \  void Run() {\n    Console.WriteLine(Thrd.Name + \" starting.\");\n    do {\n\
  \      Thread.Sleep(500);\n      Console.WriteLine(\"In \" + Thrd.Name + \", Count\
  \ is \" + Count);\n      Count++;\n    } while(Count < 10);\n    Console.WriteLine(Thrd.Name\
  \ + \" terminating.\");\n  }\n}\n\nclass MultiThread {\n  static void Main() {\n\
  \    Console.WriteLine(\"Main thread starting.\");\n    // 首先，构造一个 MyThread 对象。\n\
  \    MyThread mt = new MyThread(\"Child #1\");\n    do {\n      Console.Write(\"\
  .\");\n      Thread.Sleep(100);\n    } while (mt.Count != 10);\n    Console.WriteLine(\"\
  Main thread ending.\");\n  }\n}\n```\n\n此版本的输出与之前相同。注意线程对象存储在 `MyThread` 中。\n\n\
  ### 创建线程\n\n之前的示例只创建了一个线程。然而，你的程序可以产生它需要的多个线程。例如，下面的程序创建了三个线程：\n\n```csharp\n//\
  \ 创建多个执行线程。\nusing System;\nusing System.Threading;\n\nclass MyThread {\n  public\
  \ int Count;\n  public Thread Thrd;\n  public MyThread(string name) {\n    Count\
  \ = 0;\n    Thrd = new Thread(this.Run);\n    Thrd.Name = name;\n    Thrd.Start();\n\
  \  }\n  // 线程的入口点。\n  void Run() {\n    Console.WriteLine(Thrd.Name + \" starting.\"\
  );\n    do {\n      Thread.Sleep(500);\n      Console.WriteLine(\"In \" + Thrd.Name\
  \ + \", Count is \" + Count);\n      Count++;\n    } while(Count < 10);\n    Console.WriteLine(Thrd.Name\
  \ + \" terminating.\");\n  }\n}\n\nclass MoreThreads {\n  static void Main() {\n\
  \    Console.WriteLine(\"Main thread starting.\");\n    // 构造三个线程。\n    MyThread\
  \ mt1 = new MyThread(\"Child #1\");\n    MyThread mt2 = new MyThread(\"Child #2\"\
  );\n    MyThread mt3 = new MyThread(\"Child #3\");\n    do {\n      Console.Write(\"\
  .\");\n      Thread.Sleep(100);\n    } while (mt1.Count < 10 || mt2.Count < 10 ||\
  \ mt3.Count < 10);\n    Console.WriteLine(\"Main thread ending.\");\n  }\n}\n```\n\
  \n此程序的样本输出如所示：\n\nMain thread starting.\n\n\n\n\n.子 #1 启动。\n子 #2 启动。\n子 #3 启动。\n\
  ....在子 #1 中，Count 为 0\n在子 #2 中，Count 为 0\n在子 #3 中，Count 为 0\n..... 在子 #1 中，Count\
  \ 为 1\n在子 #2 中，Count 为 1\n在子 #3 中，Count 为 1\n..... 在子 #1 中，Count 为 2\n在子 #2 中，Count\
  \ 为 2\n在子 #3 中，Count 为 2\n..... 在子 #1 中，Count 为 3\n在子 #2 中，Count 为 3\n在子 #3 中，Count\
  \ 为 3\n..... 在子 #1 中，Count 为 4\n在子 #2 中，Count 为 4\n在子 #3 中，Count 为 4\n..... 在子 #1\
  \ 中，Count 为 5\n在子 #2 中，Count 为 5\n在子 #3 中，Count 为 5\n..... 在子 #1 中，Count 为 6\n在子\
  \ #2 中，Count 为 6\n在子 #3 中，Count 为 6\n..... 在子 #1 中，Count 为 7\n在子 #2 中，Count 为 7\n\
  在子 #3 中，Count 为 7\n..... 在子 #1 中，Count 为 8\n在子 #2 中，Count 为 8\n在子 #3 中，Count 为 8\n\
  ..... 在子 #1 中，Count 为 9\n子 #1 终止。\n在子 #2 中，Count 为 9\n子 #2 终止。\n在子 #3 中，Count 为\
  \ 9\n子 #3 终止。\n主线程结束。\n\n如你所见，一旦启动，所有三个子线程都会共享 CPU。同样，由于系统配置、操作系统和其他环境因素的差异，当你运行程序时，看到的输出可能与此处显示的略有不同。\n\
  \n### 确定线程何时结束\n\n通常，知道线程何时结束是很有用的。在之前的示例中，这是通过观察 `Count` 变量来实现的——这算不是一个令人满意的或通用的解决方案。幸运的是，`Thread`\
  \ 提供了两种方法可以判断线程是否已经结束。首先，你可以查询线程的只读属性 `IsAlive`。它的定义如下：\n\n```csharp\npublic bool\
  \ IsAlive { get; }\n```\n\n如果调用该属性线程仍在运行，`IsAlive` 返回 `true`。否则返回 `false`。要尝试使用\
  \ `IsAlive`，请将此版本的 `MoreThreads` 替换之前程序中的版本：\n\n```csharp\n// 使用 IsAlive 等待线程结束。\n\
  class MoreThreads {\n  static void Main() {\n    Console.WriteLine(\"Main thread\
  \ starting.\");\n      // 构建三个线程。\n    MyThread mt1 = new MyThread(\"Child #1\"\
  );\n    MyThread mt2 = new MyThread(\"Child #2\");\n    MyThread mt3 = new MyThread(\"\
  Child #3\");\n    do {\n      Console.Write(\".\");\n      Thread.Sleep(100);\n\
  \    } while (mt1.Thrd.IsAlive &&\n              mt2.Thrd.IsAlive &&\n         \
  \     mt3.Thrd.IsAlive);\n    Console.WriteLine(\"Main thread ending.\");\n  }\n\
  }\n```\n\n此版本的输出与之前相同。唯一的区别是它使用 `IsAlive` 来等待子线程。\n\n等待线程完成的另一种方法是调用 `Join()`。其最简单的格式所示：\n\
  \n```csharp\npublic void Join()\n```\n\n`Join()` 会等待直到调用它的线程完成。它的名称源于调用线程等待指定的线程加入它（joins）的概念。如果线程尚未启动，将抛出\
  \ `ThreadStateException`。`Join()` 的其他形式允许你指定等待指定线程终止的最大时间。这是一个使用 `Join()` 确保主线程是最后一个停止的程序：\n\
  \n```csharp\n// 使用 Join\nusing System;\nusing System.Threading;\nclass MyThread\
  \ {\n  public int Count;\n  public Thread Thrd;\n  public MyThread(string name)\
  \ {\n    Count = 0;\n    Thrd = new Thread(this.Run);\n    Thrd.Name = name;\n \
  \ }\n  // 线程入口\n  void Run() {\n    Console.WriteLine(Thrd.Name + \" starting.\"\
  );\n    do {\n      Thread.Sleep(500);\n      Console.WriteLine(\"In \" + Thrd.Name\
  \ + \", Count is \" + Count);\n      Count++;\n    } while (Count < 10);\n    Console.WriteLine(Thrd.Name\
  \ + \" terminating.\");\n  }\n}\n\n// 使用 Join\nclass JoinThreads {\n  static void\
  \ Main() {\n    Console.WriteLine(\"Main thread starting.\");\n      // 构建三个线程。\n\
  \    MyThread mt1 = new MyThread(\"Child #1\");\n    MyThread mt2 = new MyThread(\"\
  Child #2\");\n    MyThread mt3 = new MyThread(\"Child #3\");\n    mt1.Thrd.Start();\n\
  \    mt2.Thrd.Start();\n    mt3.Thrd.Start();\n    mt1.Thrd.Join();\n    mt2.Thrd.Join();\n\
  \    mt3.Thrd.Join();\n    Console.WriteLine(\"Main thread ending.\");\n  }\n}\n\
  ```\n\n此程序的示例输出所示：\n\n```\n主线程开始。\n子 #1 启动。\n子 #2 启动。\n子 #3 启动。\n....\n在子 #1 中，Count\
  \ 为 0\n在子 #2 中，Count 为 0\n在子 #3 中，Count 为 0\n.....\n在子 #1 中，Count 为 1\n在子 #2 中，Count\
  \ 为 1\n在子 #3 中，Count 为 1\n.....\n在子 #1 中，Count 为 2\n在子 #2 中，Count 为 2\n在子 #3 中，Count\
  \ 为 2\n.....\n在子 #1 中，Count 为 3\n在子 #2 中，Count 为 3\n在子 #3 中，Count 为 3\n.....\n在子\
  \ #1 中，Count 为 4\n在子 #2 中，Count 为 4\n在子 #3 中，Count 为 4\n.....\n在子 #1 中，Count 为 5\n\
  在子 #2 中，Count 为 5\n在子 #3 中，Count 为 5\n.....\n在子 #1 中，Count 为 6\n在子 #2 中，Count 为\
  \ 6\n在子 #3 中，Count 为 6\n.....\n在子 #1 中，Count 为 7\n在子 #2 中，Count 为 7\n在子 #3 中，Count\
  \ 为 7\n.....\n在子 #1 中，Count 为 8\n在子 #2 中，Count 为 8\n在子 #3 中，Count 为 8\n.....\n在子\
  \ #1 中，Count 为 9\n子 #1 终止。\n在子 #2 中，Count 为 9\n子 #2 终止。\n在子 #3 中，Count 为 9\n子 #3\
  \ 终止。\n主线程结束。\n```\n\n如你所见，一旦启动，所有三个子线程都会共享 CPU。同样，由于系统配置、操作系统和其他环境因素的差异，当你运行程序时，看到的输出可能与此处显示的略有不同。\n\
