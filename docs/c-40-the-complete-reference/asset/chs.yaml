  \n\n\n\n在 C# 中，`literals`（字面量）是指以人类可读表示的固定值。例如，数字 `100` 就是一个字面量。大部分情况下，字面量的用法是非常直观的，因此之前的所有的示例程序都以某种形式使用了它们。现在是时候正式地对它们进行解释了。\n\
  \nC# 字面量可以是任何简单类型。每个字面量的表示方式取决于它的类型。如前所述，字符字面量包含在单引号之间。例如，`‘a’`和`‘%’`都是字符字面量。\n\n\
  ### 数字字面量\n\n整数字面量指定为不包含小数部分的数字。例如，`10`和`–100`是整数字面量。浮点字面量需要使用小数点以及数字的小数部分。例如，`11.123`是一个浮点字面量。C#\
  \ 还允许你对浮点数使用科学计数法。\n\n由于 C# 是一种强类型语言，字面量也有类型。自然地，这引出了以下问题：数字字面量的类型是什么？例如，`12`、`123987`或`0.23`的类型是什么？幸运的是，C#\
  \ 指定了一些易于遵循的规则来回答这些问题。\n\n首先，对于整数字面量，字面量的类型是容纳它的最小整数类型，从`int`开始。因此，整数字面量的类型为`int`、`uint`、`long`或`ulong`之一，具体取决于它的值。其次，浮点字面量的类型为`double`。\n\
  \n如果 C# 的默认类型不是你想要的字面量类型，你可以通过包含后缀来显式指定其类型。要指定`long`字面量，请附加`l`或`L`。例如，`12`是`int`，但`12L`是`long`。要指定无符号整数值，附加`u`或`U`。因此，`100`是`int`，但`100U`是`uint`。要指定无符号长整数，使用`ul`或`UL`。例如，`984375UL`的类型为`ulong`。\n\
  \n要指定`float`字面量，在常量后附加`F`或`f`。例如，`10.19F`的类型为`float`。虽然是多余的，但你可以通过附加`D`或`d`来指定`double`字面量。（正如提到的，浮点字面量默认为`double`。）\n\
  \n要指定`decimal`字面量，在其值后跟随`m`或`M`。例如，`9.95M`是一个`decimal`字面量。\n\n虽然整数字面量默认创建一个`int`、`uint`、`long`或`ulong`值，但只要赋值的值可以用目标类型表示，它们仍然可以赋值给类型为`byte`、`sbyte`、`short`或`ushort`的变量。\n\
  \n#### 十进制字面量\n\n你可能知道，在编程中使用，基于 16 而不是 10 的数字系统更方便。16 进制系统被称为`hexadecimal`（十六进制），使用数字`0`到`9`加上字母`A`到`F`，分别代表\
  \ 10、11、12、13、14 和 15。例如，十六进制数字`10`在十进制中是`16`。由于十六进制使用频繁，C#允许你以十六进制格式指定整数字面量。十六进制字面量必须以`0x`开头（一个\
  \ 0 后面跟一个`x`）。以下是一些示例：\n\n```\ncount = 0xFF; // 十进制的 255\nincr = 0x1a;  // 十进制的\
  \ 26\n```\n\n#### 字符转义序列\n\n将字符字面量包含在单引号中对于大多数打印字符有效，但少数字符（如回车）在使用文本编辑器时会产生特殊问题。此外，其他某些字符（如单引号和双引号）在\
  \ C#中有特殊含义，因此你不能直接使用它们。出于这些原因，C#提供了特殊的`escape sequences`（转义序列），有时称为`反斜字符常量`，见表 3-2。这些序列用于代替它们所代表的字符。\n\
  \n例如，这给`ch`赋值了制表符：\n\n```\nch = '\\t';\n```\n\n下一个示例给`ch`赋值了单引号：\n\n```\nch = '\\\
  '';\n```\n\n![Image](img/t0049-01.jpg)\n\n**表 3-2** 字符转义序列\n\n#### 字符串字面量\n\nC#支持另一种类型的字面量：`string`（字符串）。字符串字面量是用双引号包含的字符集。例如，\n\
  \n`\"this is a test\"`\n\n是一个字符串。你已经在之前的示例程序的许多`WriteLine()`语句中见过字符串的示例。\n\n除了普通字符外，字符串字面量还可以包含上述的一个或多个转义序列。例如，考虑以下程序。它使用了`\\\
  n`和`\\t`转义序列。\n\n```c\n// 在字符串中演示转义序列。\nusing System;\n\nclass StrDemo {\n  static\
  \ void Main() {\n    Console.WriteLine(\"Line One\\nLine Two\");\n  }\n}\n```\n\n\
  #### 逐字字符串字面量\n\n逐字字符串字面量（verbatim string literals）的优势是，可以在程序中指定的输出与它在屏幕上显示的完全一致。然而，在多行的情况下，换行会破坏程序的缩进。由于这个原因，书中的程序将有限地使用逐字字符串字面量。尽管如此，它们在许多格式情况下仍然是一个极好的优势。\n\
  \n最后一点：不要混淆字符串和字符。字符字面量（如'X'）表示单个`char`类型的字母。包含单个字母的字符串（如\"X\"仍然是一个字符串。\n\n####\
  \ 变量详细介绍\n\n变量使用以下形式的语句声明：\n\n`type var-name;`\n\n其中`type`是变量的数据类型，`var-name`是它的名称。你可以声明任何有效类型的变量，包括刚刚描述的值类型。理解变量的能力由其类型决定是非常重要的。例如，`bool`类型的变量不能用于存储浮点值。此外，变量的类型在其生命周期内不能更改。例如，一个`int`变量不能变成一个`char`变量。\n\
  \n\n\n\nC# 中的所有变量在使用之前都必须声明。作为一个一般规则，这是非常有必要的，因为编译器在正确编译任何使用该变量的语句之前，必须知道该变量包含什么类型的数据。这还让编译器能够执行严格的类型检查。\n\
  \nC# 定义了几种不同类型的变量。我们一直在使用的类型被称为`局部变量`，因为它们是在方法内部声明的。\n\n### 初始化变量\n\n给变量赋值的一种方法是通过赋值语句，正如你已经看到的那样。另一种方法是在声明变量时给它一个初始值。要做到这一点，请在变量名后跟一个等号和要被赋值的值。初始化的通用形式所示：\n\
  \n`type var-name` = `value;`\n\n在这里，`value` 是在创建变量时赋予变量的值。该值必须与指定的类型兼容。\n\n以下是一些示例：\n\
  \n```text\nint count = 10; // 给 count 赋一个 10 的初始值\nchar ch = 'X';  //用字母 X 初始化 ch\n\
  float f = 1.2F; // f 初始化为 1.2\n```\n\n当使用由逗号分隔的列表声明两个或多个相同类型的变量时，你可以为其中一个或多个变量提供初始值。例如：\n\
  \n```text\nint a, b = 8, c = 19, d; // b 和 c 有初始化\n```\n\n在这种情况下，只有 `b` 和 `c` 被初始化了。\n\
  \n### 动态初始化\n\n前面的示例仅使用了常量作为初始化器，但 C# 允许动态初始化变量，使用在变量声明处有效的任何表达式。例如，这里有一个短程序，它根据直角三角形两个对角边的长度计算斜边长度。\n\
  \n```csharp\n// 动态初始化。\nusing System;\n\nclass DynInit {\n  static void Main() {\n\
  \    // 边长。\n    double s1 = 4.0;\n    double s2 = 5.0;\n    // 动态初始化 hypot。\n \
  \   double hypot = Math.Sqrt( (s1 * s1) + (s2 * s2) );\n    Console.Write(\"Hypotenuse\
  \ of triangle with sides \" +\n                   s1 + \" by \" + s2 + \" is \"\
  );\n    Console.WriteLine(\"{0:#.###}.\", hypot);\n  }\n}\n```\n\n这是输出结果：\n\nHypotenuse\
  \ of triangle with sides 4 by 5 is 6.403.\n\n在这里，声明了三个局部变量——`s1`、`s2` 和 `hypot`。前两个\
  \ `s1` 和 `s2` 由常量初始化。然而，`hypot` 被动态初始化为斜边的长度。请注意，初始化涉及调用 `Math.Sqrt()`。正如所解释的，你可以使用在初始化点有效的任何表达式。由于在此时点调用\
  \ `Math.Sqrt()`（或任何其他库方法）是有效的，因此它可以被用于 `hypot` 的初始化。这里的关键点是，初始化表达式可以使用初始化时有效的任何元素，包括对方法的调用、其他变量的引用或字字面量的引用。\n\
  \n### 隐式类型变量\n\n正如所解释，在 C# 中所有变量都必须声明。通常，一个声明包含变量的类型（如 `int` 或 `bool`），紧接着是变量名。然而，从\
  \ C# 3.0 开始，可以让编译器根据用于初始化局部变量的值来确定该变量的类型。这被称为`隐式类型变量`。\n\n隐式类型变量使用关键字 `var` 声明，并且必须被初始化。编译器使用初始化器的类型来确定变量的类型。这里有一个示例：\n\
  \n```csharp\nvar e = 2.7183;\n```\n\n由于 `e` 使用一个浮点字面量（其默认类型为 `double`）进行初始化，因此 `e`\
  \ 的类型是 `double`。如果 `e` 是这样声明的：\n\n```csharp\nvar e = 2.7183F;\n```\n\n那么 `e` 的类型将是\
  \ `float`。\n\n下面的程序演示了隐式类型变量。它重构了上一节所示的程序，使得所有变量都是隐式类型。\n\n```csharp\n// 演示隐式类型变量。\n\
  using System;\nclass ImplicitlyTypedVar {\n  static void Main() {\n    // 现在这些是隐式类型变量。它们\n\
  \    // 的类型是 double，因为它们的初始化表达式是 double 类型。\n    var s1 = 4.0;\n    var s2 = 5.0;\n\
  \    // 现在，hypot 是隐式类型的。它的类型是 double\n    // 因为 Sqrt() 的返回值是 double。\n    var hypot\
  \ = Math.Sqrt( (s1 * s1) + (s2 * s2) );\n    Console.Write(\"Hypotenuse of triangle\
  \ with sides \" +\n                   s1 + \" by \" + s2 + \" is \");\n    Console.WriteLine(\"\
  {0:#.###}.\", hypot);\n    // 下述语句将无法编译，因为\n    // s1 是 double，不能分配一个小数值。\n    //\
  \ s1 = 12.2M; // 错误！\n  }\n}\n```\n\n输出与之前相同。重要的一点是，隐式类型变量仍然是强类型变量。注意程序中这行被注释掉的代码：\n\
  \n```csharp\n// s1 = 12.2M; // 错误！\n```\n\n这种赋值是无效的。\n\n\n\n\n```csharp\n// 演示块范围。\n\
  \nusing System;\n\nclass ScopeDemo {\n  static void Main() {\n    int x; // Main()\
  \ 内的所有代码均可见\n    x = 10;\n    if(x == 10) { // 开始新作用域\n      int y = 20; // 仅对此块可见\n\
  \      // x 和 y 在此处均可见\n      Console.WriteLine(\"x and y: \" + x + \" \" + y);\n\
  \      x = y * 2;\n    }\n    // y = 100; // 错误！此处不可见 y。\n    // x 在此处仍然可见\n   \
  \ Console.WriteLine(\"x is \" + x);\n  }\n}\n```\n\n如注释所示，变量 `x` 在 `Main()` 作用域的开始处声明，并且可以在\
  \ `Main()` 中后续的所有代码中访问。在 `if` 块内部，声明了 `y`。由于一个块定义了一个作用域，`y` 仅对该块内部的其他代码可见。这就是为什么在它的块外部，`y\
  \ = 100;` 这一行被注释掉的原因。如果你移除开头的注释符号，将会发生编译错误，因为 `y` 在其块外部不可见。在 `if` 块内部，可以使用 `x`，因为块内部的代码（即嵌套作用域）可以访问由外层作用域声明的变量。\n\
  \n在块内部，可以在任何点声明变量，但它们仅在声明之后才有效。因此，如果你在方法的开始处定义一个变量，它对该方法内的所有代码都可用。相反，如果你在块的末尾声明变量，那么它实际上是没用的，因为没有代码可以访问它。\n\
  \n如果变量声明包含初始化器，那么该变量在每次进入声明它的块时都会被重新初始化。例如，考虑以下程序：\n\n```csharp\n// 演示变量的生命周期。\n\
  \nusing System;\n\nclass VarInitDemo {\n  static void Main() {\n    int x;\n   \
  \ for(x = 0; x < 3; x++) {\n      int y = -1; // 每次进入块时 y 都会被初始化\n      Console.WriteLine(\"\
  y is: \" + y); // 这始终打印 -1\n      y = 100;\n      Console.WriteLine(\"y is now:\
  \ \" + y);\n    }\n  }\n}\n```\n\n该程序生成的输出所示：\n\n```\ny is: -1\ny is now: 100\n\
  y is: -1\ny is now: 100\ny is: -1\ny is now: 100\n```\n\n你可以看到，每次进入内部 `for` 循环时，`y`\
  \ 都会被重新初始化为 –1。尽管随后被赋值为值 100，但这个值丢失了。\n\nC# 的作用域规则中有一个可能会让你惊讶的特性：尽管块可以嵌套，但在内部作用域中声明的任何变量都不能与外层作用域声明的变量具有相同的名称。例如，以下程序尝试声明两个同名的独立变量，将无法通过编译。\n\
  \n```csharp\n/*\n   此程序尝试在内部作用域中声明一个\n   其名称与外层作用域中定义的变量相同的变量。\n   *** 此程序将无法编译。\
  \ ***\n*/\nusing System;\nclass NestVar {\n  static void Main() {\n    int count;\n\
  \    for(count = 0; count < 10; count = count+1) {\n      Console.WriteLine(\"This\
  \ is count: \" + count);\n      int count; // 非法\n      for(count = 0; count < 2;\
  \ count++)\n        Console.WriteLine(\"This program is in!\");\n    }\n  }\n}\n\
  ```\n\n如果你来自 C/C++ 背景，那么你就知道对内部作用域中声明的变量的名称没有限制。因此，在 C/C++ 中，在外层 `for` 循环的块内声明 `count`\
  \ 是完全有效的。然而，在 C/C++ 中，这种声明会隐藏外层变量。C# 的设计者认为这种类型名称隐藏可能会很容易导致编程错误，因此禁止了它。\n\n### 类型转换与强制转换\n\
  \n在编程中，将一种类型的变量赋值给另一种类型是常见的。例如，你可能想将一个 `int` 值赋值给 `float` 变量，如下所示：\n\n```csharp\n\
  int i;\nfloat f;\ni = 10;\nf = i; // 将 int 赋值给 float\n```\n\n当赋值中混合了兼容类型时，右侧的值会被转换为左侧的类型。因此，在前面的片段中，`i`\
  \ 中的值被转换为 `float` 然后赋值给 `f`。然而，由于 C# 严格的类型检查，并不是所有类型都是兼容的，因此并不是所有的类型转换都是隐式允许的。例如，`bool`\
  \ 和 `int` 是不兼容。幸运的是，仍然可以使用强制转换（cast）在不兼容类型之间获取转换。强制转换执行显式的类型转换。这里将介绍自动转换和强制转换。\n\
  \n#### 自动转换\n\n当将一种数据类型赋值给另一种类型的变量时，如果满足以下条件，将自动发生隐式类型转换：\n\n- 两种类型是兼容的。\n- 目标类型的范围大于源类型。\n\
  \n当这两个条件满足时，就会发生扩展转换（widening conversion）。例如，`int` 类型始终足够容纳所有的 `byte` 值，且 `int`\
  \ 和 `byte` 都是兼容的。\n\n\n\n\n\n```c\nchar ch;\nuint u;\nshort s;\nlong l;\nx = 10.0;\n\
  y = 3.0;\n// 将 double 转换为 int，丢失小数部分。\ni = (int) (x / y);\nConsole.WriteLine(\"\
  Integer outcome of x / y: \" + i);\nConsole.WriteLine();\n// 将 int 转换为 byte，没有数据丢失。\n\
  i = 255;\nb = (byte) i;\nConsole.WriteLine(\"b after assigning 255: \" + b + \"\
  \ -- no data lost.\");\n// 将 int 转换为 byte，数据丢失。\ni = 257;\nb = (byte) i;\nConsole.WriteLine(\"\
  b after assigning 257: \" + b + \" -- data lost.\");\nConsole.WriteLine();\n// 将\
  \ uint 转换为 short，没有数据丢失。\nu = 32000;\ns = (short) u;\nConsole.WriteLine(\"s after\
  \ assigning 32000: \" +s + \" -- no data lost.\");\n// 将 uint 转换为 short，数据丢失。\n\
  u = 64000;\ns = (short) u;\nConsole.WriteLine(\"s after assigning 64000: \" +s +\
  \ \" -- data lost.\");\nConsole.WriteLine();\n// 将 long 转换为 uint，没有数据丢失。\nl = 64000;\n\
  u = (uint) l;\nConsole.WriteLine(\"u after assigning 64000: \" + u + \" -- no data\
  \ lost.\");\n// 将 long 转换为 uint，数据丢失。\nl = -12;\nu = (uint) l;\nConsole.WriteLine(\"\
  u after assigning -12: \" + u + \" -- data lost.\");\nConsole.WriteLine();\n// 将\
  \ int 转换为 char。\nb = 88; // X 的 ASCII 码\nch = (char) b;\nConsole.WriteLine(\"ch\
  \ after assigning 88: \" + ch);\n```\n\n程序的输出如下：\nInteger outcome of x / y: 3\n\
  b after assigning 255: 255 -- no data lost.\nb after assigning 257: 1 -- data lost.\n\
  s after assigning 32000: 32000 -- no data lost.\ns after assigning 64000: -35536\
  \ -- data lost.\nu after assigning 64000: 64000 -- no data lost.\nu after assigning\
  \ -12: 4294967284 -- data lost.\nch after assigning 88: X\n\n让我们来看每一次赋值。将 `(x /\
  \ y)` 转换为 `int` 会导致小数部分被截断，从而导致信息丢失。当给 `b` 赋值为 `255` 时，没有发生信息丢失，因为 `byte` 可以容纳值\
  \ `255`。然而，当尝试给 `b` 赋值 `257` 时，会发生信息丢失，因为 `257` 超过了 `byte` 的范围。在这两种情况下都需要强制类型转换，因为没有从\
  \ `int` 到 `byte` 的隐式转换。\n\n当通过 `uint` 变量 `u` 给 `short` 变量 `s` 赋值 `32000` 时，没有数据丢失，因为\
  \ `short` 可以容纳值 `32000`。但在下一次赋值中，`u` 的值为 `64000`，这超出了 `short` 的范围，导致了数据丢失。在这两种情况下都需要强制类型转换，因为没有从\
  \ `uint` 到 `short` 的隐式转换。\n\n接下来，通过 `long` 变量 `l` 给 `u` 赋值 `64000`。在这种情况下，没有数据丢失，因为\
  \ `64000` 在 `uint` 的范围内。然而，当将值 `-12` 赋值给 `u` 时，数据丢失了，因为 `uint` 无法存储负数。在这两种情况下都需要强制转换，因为没有从\
  \ `long` 到 `uint` 的隐式转换。最后，将 `byte` 值赋值给 `char` 时虽然没有信息丢失，但需要进行强制转换。\n\n#### 表达式中的类型转换\n\
  \n类型转换不仅发生在赋值过程中，也会发生在表达式内部。在表达式中，你可以自由地混合两种或多种不同类型的数据，只要它们是兼容的。例如，你可以在表达式中混合 `short`\
  \ 和 `long`，因为它们都是数值类型。当表达式中混合了不同类型的数据时，它们会按操作逐个转换为相同的类型。\n\n这些转换通过使用 C# 的类型提升规则来实现。以下是这些规则为二元操作定义的算法：\n\
  \n- 如果一个操作数是 `decimal`，则另一个操作数被提升为 `decimal`（除非它是 `float` 或 `double` 类型，在这种情况下会导致错误）。\n\
  - 否则如果一个操作数是 `double`，则第二个被提升为 `double`。\n- 否则如果一个操作数是 `float`，则第二个被提升为 `float`。\n\
  - 否则如果一个操作数是 `ulong`，则第二个被提升为 `ulong`（除非它是 `sbyte`、`short`、`int` 或 `long` 类型，在这种情况下会导致错误）。\n\
  - 否则如果一个操作数是 `long`，则第二个被提升为 `long`。\n- 否则如果一个操作数是 `uint` 且第二个是 `sbyte`、`short`\
  \ 或 `int` 类型，两者都被提升为 `long`。\n- 否则如果一个操作数是 `uint`，则第二个被提升为 `uint`。\n- 否则，两个操作数都被提升为\
  \ `int`。\n\n关于类型提升规则有几点重要的说明。首先，并不是所有类型都可以在表达式中混合。具体来说，从 `float` 或 `double` 到 `decimal`\
  \ 没有隐式转换，无法将 `ulong` 与任何符号整数类型混合。混合这些类型需要使用强制转换。\n\n其次，特别注意最后一条规则。它规定，如果前面的规则都不适用，则所有其他操作数都被提升为\
  \ `int`。因此，在表达式中，所有的 `char`、`sbyte`、`byte`、`ushort` 和 `short` 值在计算时都会提升为 `int`。这被称为整数提升。这意味着所有算术操作的结果都不会小于\
  \ `int`。\n\n重要的是要理解类型提升仅适用于表达式求值时所操作的值。例如，如果一个 `byte` 变量在表达式内部被提升为 `int`，那么在表达式外部它仍然是\
  \ `byte`。\n\n然而，类型提升可能会导致意想不到的结果。例如，当算术操作涉及两个 `byte` 值时，会发生以下序列：首先，`byte` 操作数被提升为\
  \ `int`。然后执行操作，产生一个 `int` 结果。因此，涉及两个 `byte` 值的操作结果将是 `int`。这可能不是你预期的。考虑以下程序：\n\n\
  ```csharp\n// 一个提升带来的惊喜！\nusing System;\n\nclass PromDemo {\n    static void Main()\
  \ {\n        byte b;\n        b = 10;\n        b = (byte) (b * b); // 需要强制转换!!\n\
  \        Console.WriteLine(\"b: \"+b);\n    }\n}\n```\n\n\n\n\n强制转换可以应用于较长表达式的特定部分。这让你能够对表达式求值时类型转换发生的方式进行精粒度的控制。例如，考虑以下程序。它显示了\
  \ 1 到 10 的数字的平方根。它还分别显示了每个结果的整数部分和小数部分。为了这一点，它使用强制转换将 `Math.Sqrt()` 的结果转换为 `int`。\n\
  \n```csharp\n// 在表达式中使用强制转换。\n\nusing System;\n\nclass CastExpr {\n  static void\
  \ Main() {\n    double n;\n      for(n = 1.0; n <= 10; n++) {\n        Console.WriteLine(\"\
  The square root of {0} is {1}\",\n                          n, Math.Sqrt(n));\n\
  \        Console.WriteLine(\"Whole number part: {0}\" ,\n                      \
  \    (int) Math.Sqrt(n));\n        Console.WriteLine(\"Fractional part: {0}\",\n\
  \                          Math.Sqrt(n) - (int) Math.Sqrt(n) );\n        Console.WriteLine();\n\
  \    }\n  }\n}\n```\n\n以下是程序的输出结果：\n\nThe square root of 1 is 1\nWhole number part:\
  \ 1\nFractional part: 0\nThe square root of 2 is 1.4142135623731\nWhole number part:\
  \ 1\nFractional part: 0.414213562373095\nThe square root of 3 is 1.73205080756888\n\
  Whole number part: 1\nFractional part: 0.732050807568877\nThe square root of 4 is\
  \ 2\nWhole number part: 2\nFractional part: 0\nThe square root of 5 is 2.23606797749979\n\
  Whole number part: 2\nFractional part: 0.23606797749979\nThe square root of 6 is\
  \ 2.44948974278318\nWhole number part: 2\nFractional part: 0.449489742783178\nThe\
  \ square root of 7 is 2.64575131106459\nWhole number part: 2\nFractional part: 0.645751311064591\n\
  The square root of 8 is 2.82842712474619\nWhole number part: 2\nFractional part:\
  \ 0.82842712474619\nThe square root of 9 is 3\nWhole number part: 3\nFractional\
  \ part: 0\nThe square root of 10 is 3.16227766016838\nWhole number part: 3\nFractional\
  \ part: 0.16227766016838\n\n如输出所示，将 `Math.Sqrt()` 强制转换为 `int` 会得到该数值的整数部分。在表达式中\n\
  \n`Math.Sqrt(n) - (int) Math.Sqrt(n)`\n\n强制转换为 `int` 获取整数部分，然后将其从完整值中减去，从而得到小数部分。因此，表达式的结果类型为\
  \ `double`。只有第二次对 `Math.Sqrt()` 调用被强制转换为 `int`。\n\n### 第 4 章 运算符\n\nC# 提供了一系列丰富的运算符，允许程序员对表达式的构建和求值进行详细的控制。C#\
  \ 的大多数运算符属于以下几类：算术、位运算和逻辑。本章将检查这些运算符。还讨论了赋值运算符和 `?` 运算符。C# 还定义了其他几种运算符，用于处理特殊情况，例如数组索引、成员访问和\
  \ lambda 运算符。这些特殊运算符将在本书的后后部分，在描述它们适用的功能时进行介绍。\n\n#### 算术运算符\n\nC# 定义了以下算术运算符：\n\
  \n这些运算符可以应用于任何内置数据类型。虽然算术运算符的操作对所有读者来说都是为人知的，但少数特殊情况需要解释。首先，记住 `/` 应用于整数时，任何余数都会被截断；例如，`10/3`\
  \ 等于 `3`。你可以使用模运算符 `%` 来获取此除法的余数。`%` 也称为取余运算符。它产生整数除法的余数。例如，`10 % 3` 为 `1`。在 C#\
  \ 中，`%` 可以同时应用于整数和浮点类型。因此，`10.0 % 3.0` 也是 `1`。这与 C++ 不同，C++ 允许对整数类型进行模运算。下面的程序演示了模运算符。\n\
  \n```csharp\n// 展示 % 运算符。\nusing System;\n\nclass ModDemo {\n  static void Main()\
  \ {\n    int iresult, irem;\n    double dresult, drem;\n    iresult = 10 / 3;\n\
  \    irem = 10 % 3;\n    dresult = 10.0 / 3.0;\n    drem = 10.0 % 3.0;\n    Console.WriteLine(\"\
  Result and remainder of 10 / 3: \" + iresult + \" \" + irem);\n    Console.WriteLine(\"\
  Result and remainder of 10.0 / 3.0: \" + dresult + \" \" + drem);\n  }\n}\n```\n\
  （注：由于提供的原文文本在结尾截断，此处翻译已根据提供的文本内容完成）\n\n\n\n不要被它吓到。虽然初看之下连续两个两个运算符看起来有些不安，但编译器会处理好一切。只需记住，这个表达式简单地将增加后的\
  \ `x` 的值加到 `y` 的值。\n\n## 关系运算符和逻辑运算符\n\n在*关系运算符*和*逻辑运算符*术语中，*关系*指的是值与值之间可能的关系，而*逻辑*指的是真（true）和假（false）值连接的方式。由于关系运算符产生真或假的结果，它们通常与逻辑运算符配合使用。因此，我们在这里将它们放在一起讨论。\n\
  \n关系运算符如下：\n\n![Image](img/t0069-01.jpg)\n\n逻辑运算符所示：\n\n![Image](img/t0069-02.jpg)\n\
  \n关系运算符和逻辑运算符的结果是一个 `bool` 类型的值。\n\n通常情况下，可以使用 `==` 和 `!=` 比较对象的相等性或不相等性。然而，比较运算符\
  \ `<`, `>`、`<=` 或 `>=`只能应用于支持顺序关系的类型。因此，所有的关系运算符都可以应用于所有数值类型。但是，`bool` 类型的值只能进行相等或不相等比较，因为\
  \ `true` 和 `false` 值是没有顺序的。例如，`true > false` 在 C# 中是没有意义的。\n\n对于逻辑运算符，操作数必须是 `bool`\
  \ 类型，且逻辑操作的结果也是 `bool` 类型。逻辑运算符 `&`、`|`、`^` 和 `!` 根据下面的真值表支持基本的逻辑与（AND）、或（OR）、异或（XOR）和非（NOT）：\n\
  \n![Image](img/t0070-01.jpg)\n\n如表所示，当当且仅有一个操作数为真时，异或操作的结果为真。\n\n以下是一个演示若干关系运算符和逻辑运算符的程序：\n\
  \n```csharp\n// Demo 关系运算符和逻辑运算符。\nusing System;\n\nclass RelLogOps {\n  static\
  \ void Main() {\n    int i, j;\n    bool b1, b2;\n    i = 10;\n    j = 11;\n   \
  \ if(i<j) Console.WriteLine(\"i<j\");\n    if(i <= j) Console.WriteLine(\"i <= j\"\
  );\n    if(i != j) Console.WriteLine(\"i != j\");\n    if(i == j) Console.WriteLine(\"\
  this won't execute\");\n    if(i >= j) Console.WriteLine(\"this won't execute\"\
  );\n    if(i > j) Console.WriteLine(\"this won't execute\");\n    b1 = true;\n \
  \   b2 = false;\n    if(b1&b2) Console.WriteLine(\"this won't execute\");\n    if(!(b1&b2))\
  \ Console.WriteLine(\"!(b1&b2) is true\");\n    if(b1 | b2) Console.WriteLine(\"\
  b1 | b2 is true\");\n    if(b1 ^ b2) Console.WriteLine(\"b1 ^ b2 is true\");\n \
  \ }\n}\n```\n\n程序的输出所示：\n```\ni < j\ni <= j\ni != j\n!(b1 & b2) is true\nb1 | b2\
  \ is true\nb1 ^ b2 is true\n```\n\nC# 提供的逻辑运算符执行了最常用的逻辑操作。然而，形式逻辑的规则还定义了其他几种操作。这些其他逻辑操作可以使用\
  \ C# 支持的逻辑运算符来构建。因此，C# 提供了一套足以构建任何其他逻辑操作的逻辑运算符。例如，另一种逻辑操作是*蕴含*（implication）。蕴含是一个二元操作，仅当左侧操作数为真而右侧操作数为假时结果才为假。（蕴含操作反映了真不能推假的思想。）因此，蕴含运算符的真值表所示：\n\
  \n![Image](img/t0071-01.jpg)\n\n蕴含操作可以使用 `!` 和 `|` 运算符的组合构建，如下：\n\n`!p | q`\n\n\
  以下程序演示了这种实现：\n\n```csharp\n// 在 C# 中创建一个蕴含运算符。\nusing System;\n\nclass Implication\
  \ {\n  static void Main() {\n    bool p=false, q=false;\n    int i, j;\n    for(i\
  \ = 0; i < 2; i++) {\n      for(j = 0; j < 2; j++) {\n        if(i==0) p = true;\n\
  \        if(i==1) p = false;\n        if(j==0) q = true;\n        if(j==1) q = false;\n\
  \        Console.WriteLine(\"p is \" + p + \", q is \" + q);\n        if(!p | q)\
  \ Console.WriteLine(p + \" implies \" + q + \" is true\");\n      }\n    }\n  }\n\
  }\n```\n\n输出所示：\n```\np is true, q is true\ntrue implies true is true\np is true,\
  \ q is false\np is false, q is true\nfalse implies true is true\n... (截断)\n```\n\
  \n## 短路逻辑运算符\n\nC# 提供了其与和或运算符的*短路*版本，可用于生成更高效的代码。为了理解为什么，请考虑以下内容。在与逻辑操作中，如果第一个操作数为假，那么无论第二个操作数是什么，结果都是假。在或逻辑操作中，如果第一个操作数为真，那么无论第二个操作数的值如何，操作的结果都是真。因此，在这两种情况下不需要评估第二个操作数。短路与运算符是\
  \ `&&`，短路或运算符是 `||`。正如前面提到的，它们的对应版本是 `&` 和 `|`。通过不评估第二个操作数，节省了时间并生成了更高效的代码。\n\n\
  以下程序演示了短路与运算符。为了防止除以零错误，`if` 语句首先检查 `d` 是否为零。如果是，短路与会在该处停止，不执行模运算。\n\n```csharp\n\
  // 演示短路运算符。\nusing System;\n\nclass SCops {\n  static void Main() {\n    int n,\
  \ d;\n    n = 10;\n    d = 2;\n    if(d != 0 && (n % d) == 0)\n      Console.WriteLine(d\
  \ + \" is a factor of \" + n);\n    d = 0; // 现在将 d 置为零\n    // 因为 d 为零，第二个操作数不被评估。\n\
  \    if(d != 0 && (n % d) == 0)\n      Console.WriteLine(d + \" is a factor of \"\
  \ + n);\n    // 现在，在不使用短路运算符的情况下尝试。\n    // 这会导致除以零错误。\n    if(d != 0 & (n % d)\
  \ == 0)\n      Console.WriteLine(d + \" is a factor of \" + n);\n  }\n}\n```\n[/content]\n\
  \n由于短路运算符在某些情况下比它们的对应版本更高效，你可能会疑惑为什么 C# 仍然提供普通的与和或运算符。答案是，在某些情况下，由于副作用，你会希望评估与或或操作的两个操作数。考虑以下：\n\
  \n```csharp\n// 副作用可能是重要的。\nusing System;\n\nclass SideEffects {\n  static void\
  \ Main() {\n    int i;\n    bool someCondition = false;\n    i = 0;\n    //在这里，即使\
  \ if 语句失败，i 仍然被增加了了。\n    if(someCondition & (++i < 100))\n      Console.WriteLine(\"\
  this won't be displayed\");\n    Console.WriteLine(\"if statement executed: \" +\
  \ i); // 显示 1\n\n    // 在这种情况下，i 没有增加，因为短路\n    // 运算符跳过了自增。\n    if(someCondition\
  \ && (++i < 100))\n      Console.WriteLine(\"this won't be displayed\");\n    Console.WriteLine(\"\
  if statement executed: \" + i); // 仍然是 1 !!\n  }\n}\n```\n\n\n\n\n首先，注意 `bool` 变量\
  \ `someCondition` 初始化为 `false`。接下来，检查每个 `if` 语句。如注释所示，在第一个 `if` 语句中，尽管 `someCondition`\
  \ 为 `false`，`i` 仍然自增。当使用 `&` 时（如在第一个 `if` 语句中那样），无论 `&` 左侧的表达式值如何，右侧表达式都会求值。然而，在第二个\
  \ `if` 语句中，使用了短路运算符。在这种情况下，变量 `i` 不自增，因为左操作数 `someCondition` 为 `false`，这导致右侧表达式被跳过。这里的教训是，如果你的代码期望\
  \ AND 或 OR 操作的右操作数被求值，那么你必须使用 C# 中这些操作的非短路形式。\n\n另一点：短路 AND 也称为`条件与`（conditional\
  \ AND），而短路 OR 也称为`条件或`（conditional OR）。\n\n## 赋值运算符\n\n`赋值运算符`是单等号 `=`。赋值运算符在 C#\
  \ 中的工作方式与其他计算机语言非常相似。它具有如下通用形式：\n\n```\nvar-name = expression;\n```\n\n在这里，`var-name`\
  \ 的类型必须与 `expression` 的类型兼容。\n\n赋值运算符确实有一个你可能不熟悉的有趣属性：它允许你创建赋值链。例如，考虑这段代码：\n\n```csharp\n\
  int x, y, z;\nx = y = z = 100; //将 x, y, 和 z 设置为 100\n```\n\n这段代码使用单个语句将变量 `x`、`y`\
  \ 和 `z` 设置为 100。这之所以有效是因为 `=` 是一个产生被赋值值的运算符。因此，`z = 100` 的值为 100，然后被赋值给 `y`，随后再赋值给\
  \ `x`。使用“赋值链”是将一组变量设置为相同值的一种简单方法。\n\n## 复合赋值\n\nC# 提供了特殊的复合赋值运算符，简化了某些赋值语句的编写。让我们从一个示例开始。这里显示的赋值语句：\n\
  \n```csharp\nx = x + 10;\n```\n\n可以使用复合赋值写为：\n\n```csharp\nx += 10;\n```\n\n运算符对\
  \ `+=` 编译器将 `x` 赋值为 `x` 加上 10 的值。\n\n这是另一个示例。语句\n\n```csharp\nx = x - 100;\n```\n\
  \n等同于\n\n```csharp\nx -= 100;\n```\n\n这两个语句都将 `x` 赋值为 `x` 减去 100 的值。\n\n许多二进制运算符（即需要两个操作数的运算符）都有复合赋值运算符。简写的通用形式为：\n\
  \n```\nvar-name op = expression;\n```\n\n因此，算术和逻辑赋值运算符有：\n\n![Image](img/t0074-01.jpg)\n\
  \n由于复合赋值语句比其非复合等价语句短，复合赋值运算符有时称为`简写赋值`shorthand assignment）运算符。\n\n复合赋值运算符有两个优点。首先，它们比“全写”等价物更紧凑。其次，它们可以产生更高效的可执行代码（因为左操作数只求值一次）。由于这些原因，你经常会在专业编写的\
  \ C# 程序中使用复合赋值运算符。\n\n## 位运算符\n\nC# 提供了一组`位`（bitwise）运算符，扩展了 C# 可以应用的问题类型。位运算符直接作用于操作数的位。它们仅针对整数操作数定义。它们不能用在\
  \ `bool`、`float` 或 `double` 上。\n\n它们被称为`位`运算符是因为它们用于测试、设置或位移组成整数值的位。除了其他用途外，位运算对于各种系统级编程任务都非常重要，例如分析来自设备的状态信息。表\
  \ 4-1 列出了位运算符。\n\n### 位与、或、异或和非运算符\n\n位运算符 AND、OR、XOR 和 NOT 分别为 `&`、`|`、`^` 和 `~`。它们执行与之前描述的布尔逻辑等价操作相同。区别在于位运算符是按位工作的。下表显示了使用\
  \ 1 和 0 执行每个操作的结果：\n\n![Image](img/t0075-01.jpg)\n\n从其最常用的用法来说，你可以将位与 视为一种关闭位的方法。也就是说，两个操作数中任一个为\
  \ 0 的位都会导致结果中对应的位被设置为 0。例如\n\n![Image](img/t0075-02.jpg)\n\n![Image](img/t0075-03.jpg)\n\
  \n**表 4-1** 位运算符\n\n以下程序通过使用 `&` 将奇数转换为偶数来演示位与。它通过关闭位零来实现。例如，数字 9 的低位字节二进制为 0000\
  \ 1001。当位零被关闭时，该数字变为 8，即二进制的 0000 1000。\n\n```csharp\n// 使用位与运算使数字变为偶数。\nusing System;\n\
  class MakeEven {\n    static void Main() {\n        ushort num;\n        ushort\
  \ i;\n        for(i = 1; i <= 10; i++) {\n            num = i;\n            Console.WriteLine(\"\
  num: \" + num);\n            num = (ushort)(num & 0xFFFE);\n            Console.WriteLine(\"\
  num turning off bit zero: \" + num + \"\\n\");\n        }\n    }\n}\n```\n\n该程序的输出为：\n\
  num: 1\nnum turning off bit zero: 0\nnum: 2\nnum turning off bit zero: 2\nnum: 3\n\
  num turning off bit zero: 2\nnum: 4\nnum turning off bit zero: 4\nnum: 5\nnum turning\
  \ off bit zero: 4\nnum: 6\nnum turning off bit zero: 6\nnum: 7\nnum turning off\
  \ bit zero: 6\nnum: 8\nnum turning off bit zero: 8\nnum: 9\nnum turning off bit\
  \ zero: 8\nnum: 10\nnum turning off bit zero: 10\n\n在 AND 语句中使用的值 `0xFFFE` 是二进制的\
  \ 1111 1111 1111 1110。因此，`z = 100` 的值是 100，然后被赋值给 `y`，随后再赋值给 `x`。使用“赋值链”是将一组变量设置为相同值的一种简单方法。\n\
