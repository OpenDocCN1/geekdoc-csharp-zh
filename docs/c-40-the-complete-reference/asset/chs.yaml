  \ TValue>>`、`ISerializable` 和 `SerializationCallback`。（后两个接口支持列表的序列化）。字典是动态的，根据需要增长。`Dictionary<TKey,\
  \ TValue>` 提供了许多构造函数。以下是示例：\n\n```csharp\npublic Dictionary( )\npublic Dictionary(IDictionary<TKey,\
