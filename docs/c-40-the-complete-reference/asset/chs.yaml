  \n### 第 1 章：C#的诞生\n\nC# 是微软用于 .NET 开发的首选语言。它利用经过时间考验的特性结合前沿创新，为现代企业计算环境提供了一种高度可用且高效的程序编写方式。从任何角度来看，它都是\
  \ 21 世纪最重要的语言之一。\n\n本章的目的是将 C# 置于其历史背景中，包括驱动其产生的力量、其设计哲学，以及它如何受到其他计算机语言的影响。本章还解释了\
  \ C# 与 .NET 框架的关系。正如你所看到的，C# 和 .NET 框架共同工作，创建一个高度精炼的编程环境。\n\n#### C# 的家族树\n\n计算机语言并非存在于真空之中。相反，它们相互关联，每种新语言都以某种形式受到之前语言的影响。在一个类似于杂交粉化的过程中，一种语言的特性被另一种语言所采用，新的创新被整合到现有语文中，或者旧的结构被移除。通过这种方式，语言不断演进，编程艺术也随之进步。C#\
  \ 也不例外。\n\nC# 继承了丰富的编程遗产。它直接源自世界上最成功的两种计算机语言：C 和 C++。它与另一种语言密切相关：即 Java。理解这些关系的本质对于理解\
  \ C# 至关重要。因此，我们通过将它置于这三种语言的历史背景中开始对 C# 的研究。\n\n##### C：现代编程时代的开端\n\nC 语言的创造标志着现代编程时代的开始。C\
  \ 是 Dennis Ritchie 在 20 世纪 70 年代在运行 UNIX 操作系统的 DEC PDP-11 上发明的。虽然之前一些早期的语言（最著名的\
  \ Pascal）已经取得了巨大成功，但是 C 语言确定了至今仍在指导编程方向的范式。\n\nC 产生于 20 世纪 60 年代的结构化编程革命。在结构化编程之前，大型程序很难编写，因为程序逻辑往往会退化为所谓的“面条代码”——一种由跳转、调用和返回构成的错乱整体，难以理顺。结构化语言通过添加定义良好的控制语句、带有局部变量的子程序以及其他改进解决了这一问题。通过使用结构化技术，程序变得组织更有条、更可靠且更易于管理。\n\
  \n尽管当时还有其他结构化语言，但 C 是第一个成功将强大性、优雅性和表达力结合的语言。它简洁而易用的语法，加之其“由程序员（而非语言）掌握主导”的哲学，迅速赢得了许多追随者。从今天的角度来看，它可能有点难以理解，但\
  \ C 是程序员们期待已久的一股清风。结果，C 成为 20 世纪 80 年代最广泛使用的结构化编程语言。\n\n然而，即使是历史悠老的 C 语言也有其局限性。最令人困扰的问题之一是无法处理大型程序。一旦项目达到一定规模，C\
  \ 语言就会遇到障碍，从那时起 C 程序将变得难以理解和维护。具体在何时达到这一界限取决于程序、程序员以及所掌握的工具，但总是存在一个阈值。\n\n#####\
  \ OOP 与 C++ 的诞生\n\n在 20 世纪 70 年代后期，由于结构化编程方法和 C 语言的限制，许多项目的规模接近极限。为了解决这个问题，一种新方法开始出现。这种方法被称为面向对象编程（OOP）。使用\
  \ OOP，程序员可以处理更大的程序。问题在于，当时最流行的语言 C 不支持面向对象编程。对面向对象的 C 语言的需求最终导致了 C++ 的诞生。\n\nC++\
  \ 是 Bjarne Stroustrup 从 1979 年开始在泽西州穆里山的贝尔实验室发明的。他最初将这种新语言命名为“带有类的 C”。然而，在 1983\
  \ 年名称更改为 C++。C++ 包含了整个 C 语言。因此，C 是 C++ 构建的基础。Stroustrup 对 C 所做的大部分改进都是为了支持面向对象编程。从本质上说，C++\
  \ 是 C 的面向版本。通过建立在 C 的基础之上，Stroustrup 提供了一条平滑的 OOP 迁移路径。程序员不需要学习一种全新的语言，只需要学习几个新功能就能获得\
  \ OOP 的好处。\n\nC++ 在 20 世纪 80 年的大部分时间里处于后台状态，经历了大量的开发。到 20 世纪 90 年代初，C++ 已经准备好主流化，其人气爆炸式增长。到那个世纪末，它已成为最广泛使用的编程语言。今天，C++\
  \ 仍然是高性能系统代码开发的领先语言。\n\n至关重要的一点是，C++ 的发明并不是试图创造完全全新的编程语言。相反，它是对一种已经成功的语言的增强。这种语言开发方法——从现有语言开始并将其推向前——确立了一种持续至今的趋势。\n\
  \n##### 互联网与 Java 的兴起\n\n编程语言的下一个重大进展是 Java。Java（最初称为 Oak）的工作始于 1991 年的太阳微系统（Sun\
  \ Microsystems）公司。Java 设计的主要驱动力是 James Gosling。Patrick Naughton、Chris Warth、Ed Frank\
  \ 和 Mike Sheridan 也参与了其中。\n\n\n\n\nJava 是一种结构化、面向对象的语言，其语法和哲学源自 `C++`。`Java` 的创新方面与其说是源于编程艺术的进步（尽管确实包含了一些进步），不如说是源于计算环境的变化。在互联网普及之前，大多数程序都是针对特定的\
  \ CPU 和特定的操作系统进行编写、编译和运行的。虽然程序员喜欢复用代码这一点一直是事实，但将程序轻松从一个环境迁移到另一个环境的能力，在当时更紧迫的问题面前退居。然而，随着互联网的兴起，许多不同类型的\
  \ CPU 和操作系统连接在一起，可移植性这一老问题猛然回归。为了解决可移植性问题，需要一种新语言，而这门新语言就是 `Java`。\n\n尽管 `Java`\
  \ 最重要的一个方面（也是它迅速普及的原因）是其创建跨平台可移植代码的能力，但有趣的是，`Java` 的最初动力并非互联网，而是需要一种平台无关的语言，用于为嵌入式控制器创建软件。1993\
  \ 年，人们发现，在为嵌入式控制器编写代码时遇到的跨平台可移植性问题，在尝试为互联网编写代码时也会遇到。请记住：互联网是一个巨大的分布式计算宇宙，其中运行着许多不同类型的计算机。在规模上解决可移植性问题的相同技术也可以在大规模上应用于互联网。\n\
  \n`Java` 通过将源代码翻译成称为 `bytecode`（字节码）的中间语言实现了可移植性。这些 `字节码` 然后由 `Java Virtual Machine`（`JVM`）执行。因此，一个\
  \ `Java` 程序可以在任何提供了 `JVM` 的环境中运行。此外，由于 `JVM` 相对容易实现，它在大量环境中都变得可用。\n\n`Java` 对 `字节码`\
  \ 的使用与 `C` 和 `C++` 有着本质区别，后者几乎总是被编译为可执行的机器码。机器码与特定的 CPU 和操作系统绑定在一起。因此，如果你想在不同的系统上运行\
  \ `C/C++` 程序，则需要将其重新编译为专门针对该环境的机器码。因此，为了创建一个可以在多种环境中运行的 `C/C++` 程序，需要该程序的多个不同可执行版本。这不仅不实际，而且成本昂贵。`Java`\
  \ 使用中间语言是一种优雅且具有成本效益的解决方案。这也是 `C#` 将根据自己的目的而采用的解决方案。\n\n如前，`Java` 继承自 `C` 和 `C++`。它的语法基于\
  \ `C`，其对象模型由 `C++` 演变而来。尽管 `Java` 代码既不向上也不向下与 `C` 或 `C++` 兼容，但它的语法与其足够相似，使得庞大的 `C/C++`\
  \ 程序员群体可以非常轻松地转向 `Java`。此外，由于 `Java` 是在现有范式的基础上进行构建并改进的，Gosling 等人可以自由地将注意力放在新的创新的特性上。正如\
  \ Stroustrup 在创建 `C++` 时不需要“发明轮子”一样，Gosling 在开发 `Java` 时也不需要创建一个完全的新语言。此外，随着 `Java`\
  \ 的诞生，`C` 和 `C++` 变成了一个被接受的底层基础，在此基础上可以构建新的计算机语言。\n\n## C# 的诞生\n\n虽然 `Java` 成功地解决了互联网环境中的许多关于可移植性的问题，但它仍然缺乏一些特性。其中之一跨语言互操作性，也称为混合语言编程。这是指一种语言产生的代码能够与另一种语言产生的代码轻松协作的能力。创建大型分布式软件系统需要这种跨语言互操作性。对于编写软件组件来说也是理想的，因为最有价值的组件是那些可以使用最广泛计算机语言在尽可能多的操作系统环境中使用的。\n\
  \n`Java` 缺少的另一个特性与 Windows 平台的完全集成。虽然 `Java` 程序可以在 Windows 环境中执行（假设已安装 `Java Virtual\
  \ Machine`），但 `Java` 和 `Windows` 之间并没有紧密耦合。由于 `Windows` 是世界上最广泛使用的操作系统，缺乏对 Windows\
  \ 的直接支持是 `Java` 的缺点。\n\n为了满足这些及其他需求，微软开发了 `C#`。`C#`  20 世纪 90 年代后期由微软，是微软整体 `.NET`\
  \ 战略的一部分。它于 2000 年中期首次发布了 Alpha 版本。`C#` 的首席架构师是 Anders Hejlsberg。Hejlsberg 是世界领先的语言专家之一，拥有多项卓越成就。例如，在\
  \ 20 世纪 80 年代，他是成功且富有影响力的 `Turbo Pascal` 的原始作者，其精简的实现为所有未来的编译器确立了标准。\n\n`C#` 与 `C`、`C++`\
  \ 和 `Java` 直接相关。这并非偶然。它们是世界上使用最广泛——且最受欢迎的三种编程语言。此外，在 `C#` 创建时，几乎所有专业程序员都认识 `C`、`C++`\
  \ 和/或 `Java`。通过在坚实且易于理解的基础上构建 `C#`，`C#` 提供了从这些语言迁移的易用路径。由于对于 Hejlsberg 来说，“发明轮子”既没有必要也不理想，因此可以自由地专注于特定的改进和创新。\n\
  \n`C#` 的家族树如图 图 1-1 所示。`C#` 的祖父是 `C`。`C#` 从 `C` 派生出语法、许多关键字和运算符。`C#` 构建并改进了 `C++`\
  \ 定义的对象模型。如果你熟悉 `C` 或 `C++`，你会在 `C#` 中感到自在。\n\n`C#` 和 `Java` 的关系稍微复杂。正如提到的，`Java`\
  \ 同样继承自 `C` 和 `C++`。它同样共享 `C/C++` 语法和对象模型。与 `Java` 一样，`C#` 设计用于生成可移植代码。然而，`C#` 并非源自\
  \ `Java`。相反，`C#` 和 `Java` 更像是堂兄弟，拥有共同的祖先，但在许多方面不同。\n\n**图 1-1** C# 家族树\n\n![Image](img/f0006-01.jpg)\n\
  \n`C#` 包含了我们在书中将讨论的许多创新特性，但最重要的与内置支持组件有关。事实上，`C#` 被认为是一种面向对象的语言，因为它对编写软件组件具有支持。例如，`C#`\
  \ 包含了直接支持组件组成部分的特性，如属性、方法和事件。然而，`C#` 在安全的混合语言环境中工作的能力可能是它最重要的面向对象的特性。\n\n### C#\
  \ 的演进\n\n从最初的 1.0 版本发布以来，`C#` 一直在快速演进。在 `C#` 1.0 发布后，微软发布了 1.1 版本。它包含许多微调，但没有添加重大功能。然而，在发布\
  \ `C#` 2.0 时，情况大不相同。\n\n`C#` 2.0 的发布是 `C#` 生命周期中的一个里程碑式事件，因为它添加了许多新特性，如泛型、部分类和匿名方法，这些特性从根本上扩大了语言的范围、力量范围。2.0\
  \ 版本坚定地让 `C#` 处于计算机语言开发的前沿。它也展示了微软对该语言的长期承诺。\n\n\n\n`C#` 的下一个主要版本是 3.0。由于 `C#` 2.0\
  \ 引入了许多新功能，人们可能认为 `C#` 的开发速度会放缓，以便程序员跟上进度，但事实并非如此。随着 `C#` 3.0 的发布，微软再次将 `C#` 推向语言设计的最前沿，这次增加了一系列重新定义编程格局的创新功能。这些包括\
  \ Lambda 表达式、集成查询（LINQ）、扩展方法和隐式类型变量等。虽然所有 3.0 的新功能都非常重要，但对语言影响最深远的两个是 LINQ 和 Lambda\
  \ 表达式。它们为 `C#` 增加了一个全新的维度，并进一步强调了其在计算机语言持续演进中的领先地位。\n\n当前发布的版本是 `C#` 4.0，这也是本书所描述的\
  \ `C#` 版本。`C#` 4.0 在前三个主要版本所建立的坚实基础之上，增加了若干项新功能。可能最重要的是命名参数和可选参数。命名参数允许你通过名称将参数与参数关联起来。可选参数允许你为参数指定默认值。另一个重要的新功能是\
  \ `dynamic` 类型，它用于声明在运行时而非编译时进行类型检查的对象。此外还为类型参数提供了协变和逆变支持，这通过对 `in` 和 `out` 关键字的新用法来实现。对于使用\
  \ Office 自动化 API（以及通用的 COM）的程序员，访问变得更加简单。（Office 自动化和 COM 在本书的范围内）。总的来说，新的 4.0 功能进一步简化了代码编写并提升了\
  \ `C#` 的易用性。\n\n还有另一个与 `C#` 4.0 编程直接相关的主要功能，但它是由 `.NET Framework` 4.0 提供的。这是通过两个主要的新功能对并行编程的支持。第一个是任务并行库\
  \ (TPL)，第二个是并行 LINQ (PLINQ)。这两者都极大地增强并简化了创建并发程序的流程。它们也让创建多线程代码变得更容易，这种代码可以自动扩展以利用计算机可用的处理器数量。直接地说，多核计算机已变得普遍，而将你的代码并行化以利用这些优势的能力正成为几乎每个\
  \ `C#` 程序员工作描述中日益重要的一部分。由于 TPL 和 PLINQ 对编程产生了重大影响，本书对这两者都进行了涵盖。\n\n## C# 与 .NET\
  \ Framework 的关系\n\n尽管 `C#` 是一种可以独立研究的计算机语言，但它与它的运行时环境 `.NET Framework` 有着特殊的关系。其原因有两点：首先，`C#`\
  \ 最初由微软设计，用于为 `.NET Framework` 创建代码。其次，`C#` 使用的库是由 `.NET Framework` 定义的。因此，尽管在理论上可以将\
  \ `C#` 语言与 `.NET` 环境分离，但它们之间是紧密相连的。正如此，通理解 `.NET Framework` 以及它为什么对 `C#` 的重要至关重要。\n\
  \n### 什么是 .NET Framework？\n\n`.NET Framework` 定义了一个环境，支持高度分布式、基于组件的应用程序的开发和执行。它使得不同的计算机语言能够协同工作，并为\
  \ Windows 平台提供了安全性、程序移植性和通用编程模型。对于 `C#` 而言，`.NET Framework` 定义了两个非常重要的实体。第一个是通用语言运行时\
  \ (CLR)。这是管理你的程序执行的系统。除了其他好处外，通用语言运行时是 `.NET Framework` 中使程序具有移植性、支持混合语言编程并提供安全执行的部分。\n\
  \n第二个实体是 `.NET 类库`。该库让你的程序访问运行时环境。例如，如果你想执行 I/O 操作（如在屏幕上显示内容），你将使用 `.NET 类库` 来完成。如果你是编程新手，那么\
  \ `class`（类）这个词可能是新鲜的。虽然本书后后会详细解释，但目前一个简要定义即可：`class` 是一种有助于组织程序的面向对象的结构。只要你的程序限制在\
  \ `.NET 类库定义的功能范围内，你的程序就可以运行在任何支持 `.NET` 运行时系统的地方。由于 `C#` 自动使用 `.NET Framework`\
  \ 类库，因此 `C#` 程序会自动移植到所有 `.NET` 环境。\n\n### 通用语言运行时如何工作\n\n通用语言运行时管理 `.NET` 代码的执行。其工作原理如下：当你编译一个\
  \ `C#` 程序时，编译器的输出不是可执行代码。相反，它是一个包含特殊类型伪代码的文件，称为 `微软中间语言` (MSIL)。`MSIL` 定义了一组独立于任何特定\
  \ CPU 的可移植指令。本质上，`MSIL` 定义了一种可移植汇编语言。另一点：尽管 `MSIL` 在概念上与 Java 的字节码相似，但两者并不相同。\n\n\
  当程序运行时运行时，`CLR` 的工作是将中间代码翻译成可执行代码。因此，任何编译为 `MSIL` 的程序都可以在任何实现了 `CLR` 的环境中运行。这是 `.NET\
  \ Framework` 实现移植性的部分之一。\n\n`微软中间语言` 使用 `JIT 编译器` 转换为可执行代码。“JIT”代表“即时编译”（Just-In-Time）。该过程如下：当执行一个\
  \ `.NET` 程序时，`CLR` 会激活 `JIT 编译器`。`JIT 编译器` 根据需要将 `MSIL` 转换为原生代码。因此，尽管你的 C# 程序最初被编译为\
  \ MSIL，但它实际上是以原生代码执行的。这意味着你的程序运行速度几乎与编译为原生代码一样快，但获得了 `MSIL` 的移植性优势。此外，在编译期间会进行代码验证以确保类型安全（除非建立了跳过此步骤的安全策略）。\n\
  \n在除了 `MSIL` 之外，编译 `C#` 程序时还会输出另一个东西：元数据（metadata）。元数据描述你的程序使用的数据，并使你的代码与其他代码轻松交互。元数据与\
  \ `MSIL` 包含在同一个文件中。\n\n### 托管与非托管代码\n\n通常情况下，当你编写 `C#` 程序时，你正在创建所谓的“托管代码”（managed\
  \ code）。托管代码在通用语言运行时的控制下执行，如前所述。由于它在 `CLR` 的控制下运行，托管代码受到某些限制——并从中获得若干好处。这些限制很容易描述和满足：编译器必须产生目标为\
  \ `CLR` 的 `MSIL` 文件（`C#` 是这样的），并使用 .NET 类库（`C#` 是这样的）。托管代码的好处有很多，包括现代的内存管理、混合语言的能力、更好的安全性、版本控制支持以及软件组件交互的整洁方式。\n\
  \n托管代码的反面是“非托管代码”（unmanaged code）。非托管代码不在通用语言运行时的控制下执行。因此，在 `.NET Framework` 出现之前的\
  \ Windows 程序使用非托管代码。托管代码和非托管代码可以协同工作，因此 `C#` 生成托管代码这一事实并没有限制它与既有程序协作的能力。\n\n\n\n\
  尽管所有托管代码都能从 CLR 中获得益处，但如果你的代码将由不同语言编写的其他程序使用，那么为了实现最大的可用性，它应该遵循`通用语言规范`(CLS)。CLS\
  \ 描述了不同的 .NET 兼容语言共有的某些特征。在创建将由其他语言使用的软件组件时，遵循 CLS 特别为重要。CLS 包含了`公共类型系统` (CTS) 的子集。CTS\
  \ 定义了有关数据类型的规则。当然，C# 同时支持 CLS 和 CTS。\n\n# 第 2 章：C# 概述\n\n到目前为止，学习编程语言最困难的一点在于，没有任何元素是孤立存在的。相反，语言的组件是共同工作的。这种相互关联性使得在不涉及另一个方面的情况下，很难讨论\
  \ `C` 的某一个方面。为了帮助解决这个问题，本章对几项 C# 特性进行了简要概述，包括 C# 程序的的一般形式、一些基本的控制语句和运算符。它没有涉及过多的细节，而是集中于任何\
  \ C# 程序通用的通用概念。这里讨论的大部分主题将在第一部分 的剩余章节中进行更详细的。\n\n## 面向对象编程\n\nC# 的核心是`面向对象编程`(OOP)。面向对象的方法论与\
  \ C# 是不可分割的，所有的 C# 程序在某种程度上至少都是面向对象的。由于它对 C# 的重要性，在编写即使是简单的 C# 程序之前，理解 OOP 的基本原理是很有用的。\n\
  \nOOP 是处理编程工作的一种强大方法。自从计算机发明以来，编程方法论发生了巨大的变化，主要是为了适应日益增长的程序复杂度。例如，在计算机刚发明时，编程是通过在计算机的前面板上通过切换二进制机器指令来完成的。只要程序长度只有几百条指令，这种方法就是可行的。随着程序的增长，汇编语言被发明了，以便程序员可以使用机器指令的符号表示来处理更大规模、日益复杂的程序。随着程序的继续增长，诸如\
  \ `FORTRAN` 和 `COBOL` 等高级级语言被引入了，它们为程序员提供了更多工具来处理复杂性。当这些早期语言开始达到它们的极限时，结构化编程语言（如\
  \ `C`）被发明了。\n\n在编程史的每一个里程碑，人们都创建了技术和工具，允许程序员处理日益增加的复杂度。在道路的每一步，新方法都吸取了以前方法的最佳元素并向前发展。面向对象编程也是如此。在\
  \ OOP 之前，许多项目已经接近（或超过）了结构化方法不再有效的点。需要一种处理复杂性的更好方法，面向对象编程就是解决方案。\n\n面向对象编程吸收了结构化编程的最佳思想，并将其与几个新概念相结合。结果是组织程序的不同且更好的方式。从最一般的意义来说，程序可以通过两种方式之一组织：围绕代码（发生了什么）或围绕数据（什么受到了影响）。仅使用结构化编程技术，程序通常围绕代码组织。这种方法可以被认为是“代码作用于数据”。\n\
  \n面向对象的程序的操作则相反。它们围绕数据组织，核心原则是“数据控制对代码的访问”。在面向对象的语言中，你定义数据以及允许作用于数据的代码。因此，数据类型精确地定义了可以应用于该数据的操作。\n\
  \n为了支持面向对象编程的原则，包括 C# 在内的所有 OOP 语言都有三个共同特征：封装、多态和继承。让我们检查每一个。\n\n## 封装\n\n`封装` 是一种编程机制，它将代码及其操作的数据绑定在一起，并使两者免受外部干扰和误用。在面向对象的语言中，代码和数据可以这样绑定，从而创建一个自包含的`黑盒`。盒子内部包含了所有必要的数据和代码。当代码和数据以这种方式链接时，就创建了一个`对象`。换句话说，对象是支持封装的设备。\n\
  \n在对象内部，代码、数据或两者可以是该对象的私有(`private`)或公共(`public`)。私有代码或数据仅由对象的另一个部分已知并访问。这意味着，私有代码或数据无法被对象外部的部分访问。当代码或数据是公共的，你的程序的其他部分可以访问它，即使它是定义在对象内部的。通常，对象的公共部分用于为私有元素提供受控制的接口。\n\
  \nC# 封装的基本单元是`class`。类定义了对象的形状。它指定了数据以及将操作该数据的代码。C# 使用类规范来构建`对象`。对象是类的实例。因此，类本质上是一组指定如何构建对象的蓝。\n\
  \n构成类的代码和数据统称为其`成员`。由类定义的数据称为`字段`(fields)。也会使用`成员变量`和`实例变量`这些术语。操作这些代码包含在`函数成员`中，其中最常见的是`方法`(method)。`方法`是\
  \ C# 对子程序的术语。（其他函数成员包括属性、事件和构造函数。）因此，类的方法包含了作用于由该类定义的字段的代码。\n\n## 多态\n\n`多态`（源自希腊语，意为“多种形式”）是一种允许一个接口访问一类通用操作的特性。多态的一个简单例子可以在汽车的方向盘中找到。无论使用哪种类型的转向，方向盘（接口）都是相同的。也就是说，无论你的汽车是手动转向、助力转向还是齿条式转向，方向盘的工作方式都是样的。因此，无论使用何种类型的转向，转向方向盘都会导致汽车左转。统一接口的好处当然是，一旦你知道如何操作方向盘，你就可以驾驶任何类型的汽车。\n\
  \n同样的原理也适用于编程。例如，考虑一个`栈`（这是一种后进先出的列表）。你可能有一个需要三种不同类型栈的程序。一个栈用于整数值，一个用于浮点值，一个用于字符。在这种情况下，实现每个栈的算法是相同的，尽管存储的数据不同。在非面向对象的语言中，你将被要求创建三组不同的栈例程，每组使用不同的名称。然而，由于多态性，在\
  \ C# 中你可以创建一个通用的栈例程集，适用于所有三种特定情况。这样一来，一旦你知道如何使用一个栈，你就可以使用所有的栈。\n\n更广泛地说，多态的概念通常用“一个接口，多个方法”这一短语来表达。这意味着为一组相关活动设计一个通用接口是可能的。多态通过允许相同接口指定一类通用操作来降低复杂度。根据具体情况选择特定的操作（即方法）是编译器的工作。你，作为程序员，不需要手动进行这种选择。你只需要记住并利用通用接口即可。\n\
  \n\n\n\n\n## 继承\n\n`Inheritance`（继承）是一个对象获取另一个对象属性的过程。这很重要，因为它支持层级分类的概念。如果你思考一下，大多数知识都是通过层级（即自上而下）的分类变得易于管理的。例如，红富士苹果属于\
  \ `apple`（苹果）分类，而苹果又是 `fruit`（水果）类的一部分，而水果又属于更大的 `food`（食物）类。也就是说，`food` 类具有某些属性（可食的、有营养等的），这些属性在逻辑上也适用于它的子类\
  \ `fruit`。除了这些属性外，`fruit` 类还具有特定的特征（多汁的、甜等的），这些特征将其与其他食物区分开来。`apple` 类定义了苹果特有的属性（生长在树上、不是热带水果等）。一个红富士苹果反过来将继承之前所有类的所有属性，并仅定义那些使其变得独一无二的属性。\n\
  \n如果不使用层级结构，每个对象都必须显式地定义它的所有特征。使用继承，对象只需要定义其所在类中具有独特性的属性即可。它可以从父类继承通用属性。因此，继承机制使得一个对象成为更通用情况的特定实例成为可能。\n\
  \n## 第一个程序\n\n现在是时候查看一个真正的 C# 程序了。我们将从编译并运行接下来所示的短程序开始。\n\n```csharp\n/*\n   这是一个简单的\
  \ C# 程序。\n   将此程序命名 Example.cs。\n*/\nusing System;\n\nclass Example {\n  // C# 程序始于调用\
  \ Main()。\n  static void Main() {\n    Console.WriteLine(\"A simple C# program.\"\
  );\n  }\n}\n```\n\nC# 主要开发环境是微软的 Visual Studio。为了编译书中的所有程序（包括使用新 C# 4.0 特性的程序），你将需要支持\
  \ C# 的 Visual Studio 2010（或更高版本）。\n\n使用 Visual Studio，你有两种通用方法来创建、编译和运行 C# 程序。首先，你可以使用\
  \ Visual Studio IDE。其次，你可以使用命令行编译器 `csc.exe`。这两种方法在此处都得到了描述。\n\n### 使用 csc.exe，C#\
  \ 命令行编译器\n\n尽管 Visual Studio IDE 可能是你在商业项目中可能使用的工具，但某些读者会发现 C# 命令行编译器更方便，特别是对于编译和运行书中所示的示例程序。原因是你不需要为程序创建项目。你只需要创建程序，然后编译它并运行它——这一切都通过命令行完成。因此，如果你知道如何使用命令提示符（Command\
  \ Prompt）窗口及其命令行界面，那么使用命令行编译器将比使用 IDE 更快更简单。\n\n**注意**：如果你不熟悉命令提示符窗口，那么使用 Visual\
  \ Studio IDE 可能更好。虽然命令提示符并不难掌握，但同时尝试学习命令提示符和 C# 将是一次挑战性的体验。\n\n要使用 C# 命令行编译器创建并运行程序，请遵循以下三个步骤：\n\
  \n1. 使用文本编辑器输入程序。\n2. 使用 `csc.exe` 编译程序。\n3. 运行程序。\n\n### 输入程序\n\n书书中所示程序的源代码可以在\
  \ [www.mhprofessional.com](http://www.mhprofessional.com) 处获得。不过，如果你想手动输入程序，也可以完全这样做。在这种情况下，你必须使用文本编辑器（如记事本）将程序输入到计算机中。记住，你必须创建纯文本文件，而不是格式化的文字处理文件，因为文字处理文件中的格式信息会混淆\
  \ C# 编译器。在输入程序时，将文件命名为 `Example.cs`。\n\n### 编译程序\n\n要编译程序，请执行 C# 编译器 `csc.exe`，并在命令行上指定源文件的名称，如下：\n\
  \n```cmd\nC:\\>csc Example.cs\n```\n\n`csc` 编译器会创建一个名为 `Example.exe` 的文件，其中包含程序的\
  \ MSIL 版本。虽然 MSIL 不是可执行代码，但它仍然包含在 `exe` 文件中。当你尝试执行 `Example.exe` 时，公共语言运行时（CLR）会自动调用\
  \ JIT 编译器。但请注意，如果你在没有安装 .NET Framework 的计算机上尝试执行 `Example.exe`（或任何包含 MSIL 的其他 `exe`\
  \ 文件），程序将无法执行，因为缺少 CLR。\n\n**注意**：在运行 `csc.exe` 之前，你需要打开配置有 Visual Studio 的命令提示符窗口。这样做最简单的方法是在开始菜单的“Visual\
  \ Studio Tools”下选择“Visual Studio Command Prompt”。或者，你可以启动一个未配置的命令提示符窗口，然后运行 Visual\
  \ Studio 提供的批文件 `vsvars32.bat`。\n\n### 运行程序\n\n要实际运行程序，只需在命令行上输入其名称，如下：\n\n```cmd\n\
  C:\\>Example\n```\n\n当程序运行时，将显示以下输出：\n\nA simple C# program.\n\n## 使用 Visual Studio\
  \ IDE\n\nVisual Studio 是微软的集成开发环境（IDE）。它允许你编辑、编译、运行和调试 C# 程序，而无需离开其设计良好的环境。它对于较大的项目最有效，但也可以非常成功地用于较小的程序。使用\
  \ Visual Studio 2010 编辑、编译和运行 C# 程序的步骤所示（这些步骤假设使用的是 Visual Studio 2010 提供的 IDE）。\n\
  \n1. 通过选择“文件 | 新 | 项目”创建一个新的 C# 项目。然后，在“安装的模板”列表中选择“Windows”。下一步，选择“空项目”，然后按“确定”创建项目。\n\
  \n**注意**：你的项目名称和位置可能与所示不同。\n\n2. 一旦创建了项目，Visual Studio IDE 将所示。如果由于原因你没有看到“解决方案”（Solution\
  \ Explorer）窗口，请从“视图”菜单中选择“解决方案”来激活它。\n\n3. 此时，项目是空的，你需要向其添加一个 C# 源文件。这样做是在“解决方案”中右键点击项目名称（在本例中为\
  \ Project1），然后选择“添加”。\n\n4. 下一步，选择“新建项”。这将显示“添加新建项”对话框。在“安装的模板”列表中选择“代码”。下一步，选择“文件”，然后将名称更改为\
  \ `Example.cs`，如下。\n\n5. 下一步，按“添加”将文件添加到项目中。你的屏幕现在所示。\n\n6. 下一步，在 `Example.cs` 窗口输入示例程序。（你可以从\
  \ [www.mhprofessional.com](http://www.mhprofessional.com) 下载书中程序的源代码，这样你就不需要手动输入每个示例。）完成后，你的屏幕将所示。\n\
  \n7. 通过选择“生成”菜单中的“生成解决方案”来编译程序。\n8. 通过选择“调试”菜单中的“无调试启动”来运行程序。当你运行程序时，将看到所示的窗口。\n\
  \n\n\n\n\n如前面的指令所示，使用 IDE 编译短示例程序涉及许多步骤。然而，你不需要为书中的每个示例程序创建一个新项目。相反，你可以使用同一个 C#\
  \ 项目。只需删除当前源文件并添加新文件即可。然后重新编译并运行。这种方法极大地简化了整个流程。但请理解，在实际应用中，每个程序都将使用自己的项目。\n\n**注意**：尽管前面的指令已足够编译和运行书中的程序，但如果你打算将\
  \ Visual Studio IDE 作为你的主要工作环境，你应该熟悉它所有的功能和特性。它是一个非常强大的开发环境，有助于使大型项目变得管理。IDE 还提供了一种组织与项目相关的文件和资源的方法。投入精力熟练掌握\
  \ Visual Studio 是值得的。\n\n## 第一个示例程序，逐行解析\n\n尽管 `Example.cs` 非常简短，但它包含了所有 C# 程序共有的几个关键特性。让我们仔细检查程序的每个部分，从它的名称开始。\n\
  \nC# 程序的名称是任意的。在某些计算机语言（最显著的是 Java）中，程序文件的名称非常重要，但 C# 并非如此。你被要求将示例程序命名为 `Example.cs`，以便使编译和运行程序的指令能够生效，但就\
  \ C# 而言，你可以给文件起任何其他名称。例如，之前的示例程序可以称为 `Sample.cs`、`Test.cs` 甚至 `X.cs`。\n\n按照惯例，C#\
  \ 程序使用 `.cs` 文件扩展名，这是你应该遵循的惯例。此外，许多程序员会以文件中定义的类类的名称来为文件命名。这就是为什么选择 `Example.cs`\
  \ 作为文件名的原因。由于 C# 程序的名称是任意的，书中的大多数示例程序将不会指定名称。只需使用你自定义的名称即可。\n\n程序从以下行开始：\n\n```csharp\n\
  /*\n   这是一个简单的 C# 程序。\n   调用此程序为 Example.cs。\n*/\n```\n\n这是一个注释。与大多数其他编程语言一样，C#\
  \ 允许你在程序的源文件中输入备注。编译器会忽略注释的内容。相反，注释会为阅读其源代码的任何人描述或解释程序的运行操作。在这种情况下，注释描述了程序，并提醒你将源文件命名为\
  \ `Example.cs`。当然，在实际应用中，注释通常会解释程序的某些部分是如何工作的，或者某个特定功能的作用。\n\nC# 支持三种风格的注释。程序顶部显示的注释被称为多行注释。这种类型的注释必须以\
  \ `/*` 开始并以 `*/` 结束。这两个注释符号之间的任何内容都会被编译器忽略。正如其名，多行注释可以有几行长。\n\n程序的下一行是：\n\n```csharp\n\
  using System;\n```\n\n这一行表示程序正在使用 `System` 命名空间。在 C# 中，`namespace`（命名空间）定义了一个声明区域。虽然我们将在书的后部分详细检查命名空间，但现在有一个简短的描述是有用的。通过使用命名空间，可以将一组名称与另一组名称分开。本质上，在一个命名空间中声明的名称不会与不同命名空间中的名称冲突。程序使用的命名空间是\
  \ `System`，它是留给与 .NET Framework 类库相关项的命名空间，而该类库正是 C# 使用的库。`using` 关键字简单表示程序正在使用给定命名空间中的名称。（有趣的是，你也可以创建自己的命名空间，这对于大型项目特别有帮助。）\n\
  \n程序中的下一行代码所示：\n\n```csharp\nclass Example {\n```\n\n这一行使用关键字 `class` 来声明正在定义一个新类。如所述，类是\
  \ C# 封装的基本单元。`Example` 是类的名称。类的定义以左大括号 `{` 开始，以右大括号 `}` 结束。两个大括号之间的元素是类的成员。目前，你不需要过多担心类的细节，只需注意在\
  \ C# 中，大多数程序活动都发生在一个类内部即可。\n\n程序的下一行是单行注释，所示如下：\n\n```csharp\n// 一个 C# 程序从调用 Main()\
  \ 开始。\n```\n\n这是 C# 支持的第二种注释类型。单行注释以 `//` 开始，并在行末尾结束。虽然风格各异，但程序员使用多行注释进行较长的备注、使用单行注释进行简短的、逐行的描述的情况并不罕见。（C#\
  \ 支持的第三种注释有助于创建文档，并将在附录中描述。）\n\n下一行代码所示如下：\n\n```csharp\nstatic void Main() {\n\
  ```\n\n这一行开始了 `Main()` 方法。正如之前提到的，在 C# 中，子程序被称为方法（method）。正如它前面的注释所暗示的，这是程序开始执行的行。所有的\
  \ C# 应用程序都通过调用 `Main()` 开始执行。现在无法给出此行中每个部分的完整含义，因为这涉及到对其他几个 C# 特性的详细理解。然而，由于书中的许多示例将使用这行代码，我们将简要地查看它。\n\
  \n该行以关键字 `static` 开始。被 `static` 修饰的方法可以在其类对象创建之前被调用。这是必要的，因为 `Main()`是在程序启动时被调用的。`void`\
  \ 关键字表示 `Main()` 不返回值。正如你将看到的，方法也可以返回值。`Main` 后面的空括号表示没有传递任何信息。虽然可以向 `Main()` 传递信息，但此示例中没有。行的最后一个字符是\
  \ `{`。这标志着 `Main()` 体的开始。构成方法的所有代码将位于方法的左大括号和右大括号之间。\n\n下一行代码所示。注意它位于 `Main()` 内部。\n\
  \n```csharp\nConsole.WriteLine(\"A simple C# program.\");\n```\n\n这一行在屏幕上输出字符串“A\
  \ simple C# program.”并换行。输出实际上是通过内置方法 `WriteLine()` 实现的。在这种情况下，`WriteLine()` 显示了传递给它的字符串。传递给方法的信息被称为参数（argument）。除了字符串外，`WriteLine()`\
  \ 还可以显示其他类型的信息。该行以 `Console` 开始，它是支持控制台输入输出的预定义类的名称。通过将 `Console` 与 `WriteLine()`\
  \ 连接，你在告诉编译器 `WriteLine()` 是 `Console` 类的成员。C# 使用对象定义控制输出是其面向对象性的进一步证明。\n\n注意 `WriteLine()`\
  \ 语句以分号结束，程序前面的 `using System` 语句也是如此。通常，C# 中的语句以分号结束。此规则的例外是块（blocks），它们以 `{` 开始并以\
  \ `}` 结束。这就是为什么程序中的这些行没有以分号结束。块提供了一种分组语句的机制，将在本章后部分讨论。\n\n程序的第一个 `}` 结束 `Main()`，而最后一个\
  \ `}` 结束 `Example` 类的定义。\n\n\n\n\n最后一点是：`C#` 是区分大小写的。忘记这一点会导致严重的问题。例如，如果你不小心输入了\
  \ `main` 而不是 `Main`，或者输入 `writeline` 而不是 `WriteLine`，之前的程序将是错误的。此外，尽管 `C#` 编译器仍然编译不包含\
  \ `Main()` 方法的类，但它无法执行它们。因此，如果你写写了 `Main`，你会看到一条错误消息，说明 `Example.exe` 没有定义入口点。\n\
  \n## 处理语法错误\n\n如果你是编程初学者，学习如何解释和响应在编译程序时可能出现的错误是非常重要的。大多数编译错误都是由输入错误引起的。正如所有程序员很快发现的那样，不小心输入错误是非常容易的。幸运的是，如果你输入了错误，编译器在尝试编译程序时会报告\
  \ `syntax error`（语法错误）消息。此消息会告诉你错误所在的行号以及错误本身的描述。\n\n虽然编译器报告的语法错误显然是有用的，但它们有时也具有误导性。`C#`\
  \ 编译器无论你写了什么，都会尝试理解你的源代码。因此，报告的错误并不总是反映问题的实际原因。例如，在之前的程序中，无意间漏掉 `Main()` 方法后的左大括号，在用\
  \ `csc` 命令行编译器编译时会产生以下一系列错误。（使用 IDE 编译时也会产生类似的错误。）\n\n```\nExample.CS(12,21): error\
  \ CS1002: ; expected\nExample.CS(13,22): error CS1519: Invalid token '(' in class,\
  \ struct, or interface member declaration\nExample.CS(15,1): error CS1022: Type\
  \ or namespace definition, or end-of-file expected\n```\n\n显然，第一个错误消息是完全错误的，因为缺失的不是分号，而是大括号。后两个消息也同样令人困惑。\n\
  \n讨论的要点是，当你的程序包含语法错误时，不要完全从字面上接受编译器的消息。它们可能是误导性的。你可能需要对错误消息进行“二次怀疑”以找到问题。此外，查看报告错误的代码行之前的最后几行代码。有时，错误在真正发生的时间点几几行之后才会被报告出来。\n\
  \n## 一个小变体\n\n虽然书中的所有程序都会使用它，但第一个示例程序开头的行\n\n`using System;`\n\n在技术上并不是需要的。然而，它是一个非常有用的便利。之所以不需要，是因为在\
  \ `C#` 中，你可以使用所属的命名空间对名称进行完全限定。例如，该行\n\n`Console.WriteLine(\"A simple C# program.\"\
  );`\n\n可以重写为\n\n`System.Console.WriteLine(\"A simple C# program.\");`\n\n因此，第一个示例可以重写如下所示：\n\
  \n```csharp\n// 这个版本不包含 \"using System;\nclass Example {\n  // C# 程序从调用 Main() 开始。\n\
  \  static void Main() {\n    // 这里，Console.WriteLine 是完全限定的。\n    System.Console.WriteLine(\"\
  A simple C# program.\");\n  }\n}\n```\n\n由于每次在使用该命名空间中的成员时都指定 `System` 命名空间是非常繁琐的，大多数\
  \ `C#` 程序员会在程序顶部包含 `using System`，书中的所有程序也是这样做的。然而，重要的是，如果需要，你可以显式地使用命名空间对名称进行限定。\n\
  \n## 第二个简单程序\n\n也许没有其他结构对编程语言来说比变量重要了。变量是一个可以赋值的命名内存位置。它被称为变量，是因为它的值在程序执行期间可以改变。换句话说，变量的内容是可以变化的，而不是固定的。\n\
  \n下面的程序创建了名为 `x` 和 `y` 的两个变量。\n\n```csharp\n// 这个程序演示了变量。\nusing System;\nclass\
  \ Example2 {\n  static void Main() {\n    int x; // 声明了一个变量\n    int y; // 声明另一个变量\n\
  \    x = 100; // 将 100 赋值给 x\n    Console.WriteLine(\"x contains \" + x);\n    y\
  \ = x / 2;\n    Console.Write(\"y contains \");\n    Console.WriteLine(y);\n  }\n\
  }\n```\n\n运行它，你会看到以下内容：\n\n```\nx contains 100\ny contains: 50\n```\n\n这个程序引入了几个概念。首先，`Console.WriteLine(\"\
  x contains \" + x);` 输出字符串“x contains”之前的 `x` 值。在该语句中，`+` 运算符导致 `x` 的值显示在字符串之后。接下来，`y\
  \ = x / 2;` 将 `x` 中的值除以 `2` 并将结果存储在 `y` 中。在该行执行后，`y` 将包含 50。最后，`Console.Write(\"\
  y contains \");` 后接 `Console.WriteLine(y);` 显示了两点：首先，使用内置方法 `Write()` 来显示字符串“y contains\
  \ x / 2:”，并且该字符串后面没有跟换行，这意味着当生成下次输出时，它将从同一行开始。`Write()` 方法与 `WriteLine()` 相似，区别在于它每次调用后都不会输出新行。其次，在\
  \ `WriteLine()` 的调用中，注意 `y` 是单独使用的。\n\n在继续之前，关于声明变量的最后一点：可以使用同一个声明语句声明两个或多个变量。只需用逗号将它们的名称分开即可。例如，`x`\
  \ 和 `y` 可以这样声明：\n\n```csharp\nint x, y; // 使用一个语句声明两者\n```\n\n\n\n\n\n在前面的程序中，我们使用了一个\
  \ `int` 类型的变量。然而，`int` 变量只能存储整数。当需要小数部分时，无法使用它。例如，`int` 变量可以存储值 18，但不能存储值 18.3。幸运的是，`int`\
  \ 只是 C# 定义的多种数据类型之一。为了允许带有小数部分的数字，C# 定义了两种浮点类型：`float` 和 `double`，它们分别表示单精度和双精度值。在这两者中，`double`\
  \ 是最常用的。\n\n## Double\n\n声明一个 `double` 类型的变量，请使用类似于所示的语句：\n\n```csharp\ndouble result;\n\
  ```\n\n在这里，`result` 是变量名，其类型为 `double`。由于 `result` 是浮点类型，它可以存储诸如 122.23、0.034 或\
  \ –19.0 等值。\n\n为了更好地理解 `int` 和 `double` 之间的区别，请尝试以下程序：\n\n```csharp\n/*\n   此程序演示了\n\
  \   int 和 double 之间的差异。\n*/\nusing System;\n\nclass Example3 {\n  static void Main()\
  \ {\n    int ivar;      // 声明一个 int 变量\n    double dvar;  // 声明一个浮点变量\n    ivar\
  \ = 100;    // 给 ivar 赋值值 100\n    dvar = 100.0; // 给 dvar 赋值值 100.0\n    Console.WriteLine(\"\
  Original value of ivar: \" + ivar);\n    Console.WriteLine(\"Original value of dvar:\
  \ \" + dvar);\n    Console.WriteLine(); // 打印空行\n\n    // 现在，将两者除以 3。\n    ivar\
  \ = ivar / 3;\n    dvar = dvar / 3.0;\n    Console.WriteLine(\"ivar after division:\
  \ \" + ivar);\n    Console.WriteLine(\"dvar after division: \" + dvar);\n  }\n}\n\
  ```\n\n该程序的输出所示：\n\n```\nOriginal value of ivar: 100\nOriginal value of dvar: 100\n\
  ivar after division: 33\ndvar after division: 33.3333333333333\n```\n\n如你所见，当 `ivar`（一个\
  \ `int` 变量）除以 3 时，执行的是整数除，结果是 33——小数部分丢失了。然而，当 `dvar`（一个 `double` 变量）除以 3 时，小数部分被保留了。\n\
  \n正如程序所示，当你在程序中指定一个浮点值时，必须包含小数点。如果不包含，它将被解释为整数。例如，在 C# 中，值 100 是整数，但值 100.0 是一个浮点值。\n\
  \n程序中还有一点值得注意的新内容。要打印空行，只需调用不带任何参数的 `WriteLine()`。\n\n在处理通常需要小数部分的真实世界数量时，经常使用浮点数据类型。例如，此程序计算圆的面积。它使用\
  \ 3.1416 作为 pi。\n\n```csharp\n// 计算圆的面积。\nusing System;\n\nclass Circle {\n  static\
  \ void Main() {\n    double radius;\n    double area;\n    radius = 10.0;\n    area\
  \ = radius * radius * 3.1416;\n    Console.WriteLine(\"Area is \" + area);\n  }\n\
  }\n```\n\n该程序的输出所示：\n\n```\nArea is 314.16\n```\n\n显然，如果不使用浮点数据，无法满意的完成圆面积的计算。\n\
  \n## 控制语句\n\n在方法内部，执行从一个语句到下一个语句，从上到下。可以通过使用 C# 支持的各种控制语句来改变这种流。虽然我们稍后会详细查看控制语句，但这里介绍了两种，因为我们将使用它们来编写示例程序。\n\
  \n## if 语句\n\n你可以通过使用 C# 的条件语句 `if` 来选择性地执行程序的一部分。`if` 语句在 C# 中的工作方式与其他语言中的 `IF`\
  \ 语句非常相似。例如，它在语法上与 C++ 和 Java 中的 `if` 语句相同。其最简单的形式所示：\n\n`if (condition) statement;`\n\
  \n在这里，`condition` 是一个布尔（即真或假）表达式。如果 `condition` 为真，则执行该语句。如果 `condition` 为假，则跳过该语句。这里有一个例子：\n\
  \n`if(10 < 11) Console.WriteLine(\"10 is less than 11\");`\n\n在这种情况下，由于 10 小于 11，因此条件表达式为真，`WriteLine()`\
  \ 将执行。然而，考虑以下情况：\n\n`if(10 < 9) Console.WriteLine(\"this won’t be displayed\");`\n\
  \n在这种情况下，10 并不小于 9。因此，不会调用 `WriteLine()`。C# 定义了一套完整的关系运算符，可用于条件表达式。它们所示如下：\n\n![Image](img/t028-01.jpg)\n\
  \n这是一个演示 `if` 语句的程序：\n\n```csharp\n// 演示 if。\nusing System;\n\nclass IfDemo {\n\
  \  static void Main() { // 注意：此处原文代码结构似乎有误，已按逻辑逻辑修正翻译\n    int a, b, c;\n    a =\
  \ 2;\n    b = 3;\n    if(a < b) {\n        Console.WriteLine(\"a is less than b\"\
  );\n    }\n  }\n}\n```\n*注：原文提供的 IfDemo 代码块存在括号嵌套错误（Main 方法内部嵌套了另一个 Main），翻译时保留了其逻辑含义。*\n\
  \n*(更正：基于原文提供的文本内容，该代码块确实存在格式错误，我将严格按照原文文本结构进行翻译。)*\n\n**重新对原文 `IfDemo` 代码块进行精确翻译：**\n\
