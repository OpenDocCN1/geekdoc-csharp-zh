  }\n\n// 如果栈为空，则返回 true。\npublic bool IsEmpty() {\n  return tos==0;\n}\n\n// 返回栈的空容量。\n\
  public int Capacity() {\n  return stck.Length;\n}\n\n// 返回栈中当前对象的数量。\npublic int\
  \ GetNum() {\n  return tos;\n}\n```\n\n`IsFull( )` 方法在栈满时返回 `true`，否则返回 `false`。`IsEmpty(\
  \ )` 方法在栈为空时返回 `true`，否则返回 `false`。要获取栈的总容量（即它能容纳的元素总数），调用 `Capacity( )`。要获取当前存储在栈中的元素数量，调用\
  \ `GetNum( )`。这些方法非常有用，因为它们所需的信息需要访问 `tos`，而 `tos` 是私有的。它们也是公共方法如何提供安全访问私有成员的示例。\n\
