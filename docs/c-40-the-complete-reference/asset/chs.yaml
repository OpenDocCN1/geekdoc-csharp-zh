  \ MyClass\nFound: AnotherClass\nFound: Demo\nUsing: MyClass\nAvailable constructors:\
  \ \n  MyClass(Int32 i)\n  MyClass(Int32 i, Int32 j)\n\nTwo-parameter constructor\
