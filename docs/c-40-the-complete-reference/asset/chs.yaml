  \n#### 方法的引用\n\n到目前为止，书中的示例一直使用值类型（如 `int` 或 `double`）作为方法的参数。然而，使用引用类型作为参数是既正确又常见的。这样做允许将对象传递给方法。例如，考虑以下程序：\n\
  \n```csharp\n// 引用可以传递给方法。\nusing System;\nclass MyClass {\n  int alpha, beta;\n\
  \  public MyClass(int i, int j) {\n    alpha = i;\n    beta = j;\n  }\n  // 如果 ob\
  \ 包含与调用对象相同的值，则返回 true。\n  public bool SameAs(MyClass ob) {\n    if((ob.alpha ==\
  \ alpha) & (ob.beta == beta))\n      return true;\n    else return false;\n  }\n\
  \  // 拷贝 os。\n  public void Copy(MyClass ob) {\n    alpha = ob.alpha;\n    beta\
  \ = ob.beta;\n  }\n  public void Show() {\n    Console.WriteLine(\"alpha: {0}, beta:\
  \ {1}\",\n                      alpha, beta);\n  }\n}\n\nclass PassOb {\n  static\
  \ void Main() {\n    MyClass ob1 = new MyClass(4, 5);\n    MyClass ob2 = new MyClass(6,\
  \ 7);\n    Console.Write(\"ob1: \");\n    ob1.Show();\n    Console.Write(\"ob2:\
  \ \");\n    ob2.Show();\n    if(ob1.SameAs(ob2))\n      Console.WriteLine(\"ob1\
  \ and ob2 have the same values.\");\n    else\n      Console.WriteLine(\"ob1 and\
  \ ob2 have different values.\");\n    Console.WriteLine();\n    // 现在，让 ob1 成为 ob2\
  \ 的拷贝。\n    ob1.Copy(ob2);\n  }\n}\n```\n\n该程序的输出如下：\n```\nPush A through J onto\
  \ stk1.\nstk1 is full.\nContents of stk1: JIHEDBA\nstk1 is empty.\nAgain push A\
  \ through J onto stk1.\nNow, pop chars from stk1 and push them onto stk2.\nContents\
  \ of stk2: ABCDEFGHIJ\nPut 5 characters on stk3.\nCapacity of stk3: 10\nNumber of\
  \ objects in stk3: 5\n```\n\n\n\n\n```csharp\n    Console.Write(\"ob1 after copy:\
  \ \");\n\n    ob1.Show();\n\n    if(ob1.SameAs(ob2))\n      Console.WriteLine(\"\
  ob1 and ob2 have the same values.\");\n    else\n      Console.WriteLine(\"ob1 and\
  \ ob2 have different values.\");\n}\n}\n```\n\n此程序生成以下输出：\nob1: alpha: 4, beta:\
  \ 5\nob2: alpha: 6, beta: 7\nob1 and ob2 have different values.\nob1 after copy:\
  \ alpha: 6, beta: 7\nob1 and ob2 have the same values.\n\n`SameAs()` 和 `Copy()`\
  \ 方法均接受一个 `MyClass` 类型的引用作为参数。`SameAs()` 方法将调用对象中 `alpha` 和 `beta` 的值与通过 `ob` 传递的对象中\
  \ `alpha` 和 `beta` 的值进行比较。只有当这两个对象的这些实例变量包含相同的值时，该方法才返回 `true`。`Copy()` 方法将 `ob`\
  \ 所引用对象中 `alpha` 和 `beta` 的值赋值给调用对象中的 `alpha` 和 `beta`。如示例所示，在语法上，引用类型传递给方法的方式与值类型相同。\n\
  \n### 参数是如何传递的\n\n如前面的示例所示，将对象引用传递给方法是一项简单的任务。然而，示例中并没有显示出一些细微差别。在某些情况下，传递引用类型的效果将与传递值类型时的体验不同。为了了解原因，让我们回顾一下参数传递给子程序的两种方式。\n\
  \n第一种方式是*按值传递*（call-by-value）。该方法将参数的*值**复制*到子程序的形式参数中。因此，对子程序参数所做的更改对调用时使用的参数没有影响。传递参数的第二种方式是*按引用传递*（call-by-reference）。在这种方法中，参数的*引用*（而不是参数的值）被传递给参数。在子程序内部，该引用被用于访问调用中指定的实际参数。这意味着对参数的更改将影响用于调用子程序时使用的参数。\n\
  \n默认情况下，C# 使用按值传递，这意味着会创建参数的副本并将其交给接收参数。因此，当您传递值类型（如 `int` 或 `double`）时，接收参数的参数上发生的变化对方法外部没有影响。例如，请考虑以下程序：\n\
  \n```csharp\n// 值类型按值传递。\n\nusing System;\nclass Test {\n  /* 此方法对调用时使用的参数\n   \
  \  产生任何更改。 */\n  public void NoChange(int i, int j) {\n    i = i + j;\n    j = -j;\n\
  \  }\n}\n\nclass CallByValue {\n  static void Main() {\n      Test ob = new Test();\n\
  \      int a = 15, b = 20;\n      Console.WriteLine(\"a and b before call: \" +\n\
  \                          a + \" \" + b);\n      ob.NoChange(a, b);\n      Console.WriteLine(\"\
  a and b after call: \" +\n                          a + \" \" + b);\n  }\n}\n```\n\
  \n此程序的输出所示：\na and b before call: 15 20\na and b after call: 15 20\n\n如你所见，`NoChange()`\
  \ 内部发生的操作对调用时使用的 `a` 和 `b` 的值没有影响。再次，这是因为 `a` 和 `b` 值的*副本*被给了 `i` 和 `j`，但 `a` 和\
  \ `b` 与 `i` 和 `j` 是独立的。因此，给 `i` 赋值一个新值不会影响 `a`。\n\n当你将引用传递给方法时，情况有点复杂。在这种情况下，引用本身仍然是按值传递的。因此，会创建引用的副本，对参数的更改不会影响参数（例如，让参数指向新对象不会改变参数所引用的对象）。但是——这非常重要——*对参数所引用对象所做的更改**将*影响参数所引用的对象。让我们看看为什么。\n\
  \n回想一下当你创建一个类类型的变量时，你只是创建了一个指向对象的引用。因此，当你将此引用传递给方法时，接收它的参数将与参数所引用的指向同一个对象。因此，参数和参数都将指向同一个对象。这意味着传递给方法的对象实际上是按引用传递的。因此，方法内部对对象的更改确实会影响参数。例如，请考虑以下程序：\n\
  \n```csharp\n// 对象按引用传递。\nusing System;\nclass Test {\n  public int a, b;\n  public\
  \ Test(int i, int j) {\n    a = i;\n    b = j;\n  }\n  /* 传递对象。现在，调用中使用对象\n    \
  \ 中的 ob.a 和 ob.b 将改变。 */\n  public void Change(Test ob) {\n    ob.a = ob.a + ob.b;\n\
  \    ob.b = -ob.b;\n  }\n}\n\nclass CallByRef {\n  static void Main() {\n    Test\
  \ ob = new Test(15, 20);\n    Console.WriteLine(\"ob.a and b before call: \" +\n\
  \                      ob.a + \" \" + ob.b);\n    ob.Change(ob);\n    Console.WriteLine(\"\
  ob.a and b after call: \" +\n                      ob.a + \" \" + ob.b);\n  }\n\
  }\n```\n\n此程序生成以下输出：\nob.a and b before call: 15 20\nob.a and b after call: 35 -20\n\
  \n如你所见，在这种情况下，`Change()` 内部的操作影响了作为参数的对象。\n\n[/content]\n\n[content]\n\n### ref\
  \ 和 out 参数\n\n正如刚才解释的，值类型（如 `int` 或 `char`）按值传递给方法的。这意味着接收值类型的参数的更改不会影响调用时的实际参数。然而，你可以改变这种行为。通过使用\
  \ `ref` 和 `out` 关键字，可以按引用传递任何值类型。这样做允许方法更改调用时使用的参数。\n\n在深入研究 `ref` 和 `out` 的使用机制之前，了解你可能想要按引用传递值类型是有用的。总的来说，有两个原因：允许方法修改参数的内容，或者允许方法返回多个值。让我们详细查看每个原因。\n\
  \n通常，你可能希望方法能够操作传递给它的实际参数。这种操作的典型示例是交换两个参数值的 `Swap()` 方法。由于值类型是按值传递的，使用 C# 默认的按值传递参数的机制无法编写一个交换两个\
  \ `int` 的值的方法。`ref` 修饰符解决了这个问题。\n\n### 使用 ref\n\n`ref` 参数修饰符导致 C# 创建按引用调用，而不是按值调用。`ref`\
  \ 修饰符在方法定义和调用时都要指定。让我们从一个简单的示例开始。以下程序创建了一个名为 `Sqr()` 的方法，它直接返回其整数参数的平方。注意 `ref`\
  \ 的使用和位置。\n\n```csharp\n// 按引用传递值类型。\nusing System;\nclass RefTest {\n```\n\n\n\n\
  \n\n```csharp\n// 此方法更改其参数。注意这里的使用了 ref。\npublic void Sqr(ref int i) {\n  i = i\
  \ * i;\n}\n\nclass RefDemo {\n  static void Main() {\n    RefTest ob = new RefTest();\n\
  \    int a = 10;\n    Console.WriteLine(\"a before call: \" + a);\n    ob.Sqr(ref\
  \ a); // 注意这里的使用了 ref\n    Console.WriteLine(\"a after call: \" + a);\n  }\n}\n\
  ```\n\n注意，`ref` 位于方法中整个参数声明之前，并且在调用方法时位于参数之前。该程序的输出（如下所示）证实了参数 `a` 的值确实被 `Sqr()`\
  \ 修改了：\n\na before call: 10  \na after call: 100\n\n```\n\n使用 `ref`，现在可以编写一个交换其两个值类型参数值的方法。例如，这里有一个程序，包含一个名为\
  \ `Swap()` 的方法，该方法交换调用它时传入的两个整数参数的值：\n\n```csharp\n// 交换两个值。\nusing System;\nclass\
  \ ValueSwap {\n  // 此方法现在更改其参数。\n  public void Swap(ref int a, ref int b) {\n  \
  \  int t;\n    t = a;\n    a = b;\n    b = t;\n  }\n}\n\nclass ValueSwapDemo {\n\
  \  static void Main() {\n    ValueSwap ob = new ValueSwap();\n    int x = 10, y\
  \ = 20;\n    Console.WriteLine(\"x and y before call: \" + x + \" \" + y);\n   \
  \ ob.Swap(ref x, ref y);\n    Console.WriteLine(\"x and y after call: \" + x + \"\
  \ \" + y);\n  }\n}\n```\n\n该程序的输出显示在这里：\n\nx and y before call: 10 20  \nx and y\
  \ after call: 20 10\n\n关于 `ref` 有一个重要的一点需要理解：通过 `ref` 传递的参数在调用之前必须赋值。这是因为接收此类参数的方法假设该参数引用的是一个有效值。因此，使用\
  \ `ref` 时，你不能使用方法来给参数赋初始值。\n\n### 使用 out\n\n有时你希望使用引用参数来从方法接收一个值，而不是传入一个值。例如，你可能有一个方法执行某些功能（如打开网络套接字），并在并在引用参数中返回成功/失败代码。在这种情况下，没有信息要传递给方法，但有信息要传回。这种场景的问题是，`ref`\
  \ 参数在调用之前必须初始化为一个值。因此，使用 `ref` 参数将需要给参数赋一个虚拟值，仅仅是为了满足这一约束。幸运的是，C# 提供了一个更好的替代方案：`out`\
  \ 参数。\n\n`out` 参数与 `ref` 参数相似，但有一个例外：它只能用于将值从方法传出。在调用方法之前，没有必要为作为 `out` 参数的变量赋初始值（或者说这样做没有用处）。方法会给该变量赋一个值。此外，在方法内部，`out`\
  \ 参数被认为是*未赋值的*；也就是说，假设假设它没有初始值。这意味着方法*必须*在方法结束之前为该参数赋一个值。因此，在调用方法后，`out` 参数将包含一个值。\n\
  \n这里是一个使用 `out` 参数的示例。在 `Decompose` 类中，`GetParts()` 方法将浮点数分解为整数部分和小数部分。注意每个组件是如何返回给调用者的。\n\
  \n```csharp\n// 使用 out。\nusing System;\nclass Decompose {\n  /* 将浮点值分解为整数部分和小数部分。\
  \ */\n  public int GetParts(double n, out double frac) {\n    int whole;\n    whole\
  \ = (int)n;\n    frac = n - whole; // 通过 frac 传小数\n    return whole; // 返回整数部分\n\
  \  }\n}\n\nclass UseOut {\n  static void Main() {\n    Decompose ob = new Decompose();\n\
  \    int i;\n    double f;\n    i = ob.GetParts(10.25, out f);\n    Console.WriteLine(\"\
  Integer portion is \" + i);\n    Console.WriteLine(\"Fractional part is \" + f);\n\
  \  }\n}\n```\n\n程序的输出输出是：\n\nInteger portion is 10  \nFractional part is 0.25\n\n\
  `GetParts()` 方法返回了两个信息。首先，`n` 的整数部分作为 `GetParts()` 的返回值返回。其次，`n` 的小数部分通过 `out` 参数\
  \ `frac` 传回。正如此示例所示，使用 `out`，方法可以返回两个值。\n\n当然，你并不局限于只使用 `out` 参数。方法可以通过 `out` 参数返回任意数量的信息。这里有一个使用两个\
  \ `out` 参数的示例。`HasComFactor()` 方法执行两个功能：首先，它判断两个整数是否有公因子（除 1 以外的）。如果有，则返回 `true`，否则返回\
  \ `false`。第二，如果它们有公因子，`HasComFactor()` 在 `out` 参数中返回最小和最大公因子。\n\n```csharp\n// 使用两个\
  \ out 参数。\nusing System;\nclass Num {\n  /* 确定两个整数是否有公因子（除 1 以外）。\n     如果有，则返回\
  \ true，否则返回 false。\n     如果有，则通过 out 参数返回最小和最大公因子。 */\n  public bool HasComFactor(int\
  \ x, int y, out int least, out int greatest) {\n    int i;\n    least = 0;\n   \
  \ greatest = 0;\n    for (i = 2; i <= x && i <= y; i++) {\n      if (x % i == 0\
  \ && y % i == 0) {\n        if (least == 0) {\n          least = i;\n        }\n\
  \        greatest = i;\n      }\n    }\n    if (least != 0) {\n      return true;\n\
  \    } else {\n      return false;\n    }\n  }\n}\n\nclass DemoOut {\n  static void\
  \ Main() {\n    Num ob = new Num();\n    int lcf, gcf;\n    if (ob.HasComFactor(23,\
  \ 105, out lcf, out gcf)) {\n      Console.WriteLine(\"Lcf of 23 and 105 is \" +\
  \ lcf);\n      Console.WriteLine(\"Gcf of 23 and 105 is \" + gcf);\n    } else {\n\
  \      Console.WriteLine(\"No common factor for 35 and 1.\");\n    }\n  }\n}\n```\n\
  \n\n\n\n\n```csharp\nConsole.Write(\"y after call: \");\n\ny.Show();\n  }\n}\n```\n\
  \n此程序的输出显示在此：\n\nx before call: a: 1, b: 2\ny before call: a: 3, b: 4\nx after call:\
  \ a: 3, b: 4\ny after call: a: 1, b: 2\n\n在此示例中，`Swap()` 方法交换了 `Swap()` 的两个参数所引的对象。在调用\
  \ `Swap()` 之前，`x` 指向一个包含值 1 和 2 的对象，`y` 指向一个包含值 3 和 4 的对象。调用 `Swap()` 之后，`x` 指向包含值\
  \ 3 和 4 的对象，而 `y` 指向包含值 1 和 2 的对象。如果没有使用 `ref` 参数，那么 `Swap()` 内部的交换对 `Swap()` 外部没有影响。你可能通过从\
  \ `Swap()` 中删除 `ref` 来证明这一点。\n\n### 使用可数量参数\n\n当你创建一个方法时，通常会预先知道传递给它的参数数量，但情况并不总是如此。有时，你想要创建一个可以传递任意数量参数的方法。例如，考虑一个寻找一组值中最小值的方法。此类方法可能接收两个值、三个值或四个值，以此类推。在所有情况下，你都希望该方法返回最小值。这种方法无法使用普通参数来创建。相反，你必须使用一种代表任意数量参数的特殊类型参数。这是通过创建一个\
  \ `params` 参数来实现的。\n\n`params` 修饰符用于声明数组参数，该参数能够接收零或多个参数。数组中的元素个数将等于传递给方法的参数个数。然后你的程序通过访问数组来获取参数。\n\
  \n这里是一个使用 `params` 创建名为 `MinVal()` 方法的示例，该方法返回一组值中的最小值：\n\n```csharp\n// 演示 params.\n\
  \nusing System;\n\nclass Min {\n  public int MinVal(params int[] nums) {\n    int\
  \ m;\n    if(nums.Length == 0) {\n      Console.WriteLine(\"Error: no arguments.\"\
  );\n      return 0;\n    }\n    m = nums[0];\n    for(int i=1; i < nums.Length;\
  \ i++)\n      if(nums[i] < m) m = nums[i];\n    return m;\n  }\n}\n\nclass ParamsDemo\
  \ {\n  static void Main() {\n    Min ob = new Min();\n    int min;\n    int a =\
  \ 10, b = 20;\n    // 使用 2 个值调用。\n    min = ob.MinVal(a, b);\n    Console.WriteLine(\"\
  Minimum is \" + min);\n    // 使用 3 个值调用。\n    min = ob.MinVal(a, b, -1);\n    Console.WriteLine(\"\
  Minimum is \" + min);\n    // 使用 5 个值调用。\n    min = ob.MinVal(18, 23, 3, 14, 25);\n\
  \    Console.WriteLine(\"Minimum is \" + min);\n    // 也可以用 int 数组调用。\n    int[]\
  \ args = { 45, 67, 34, 9, 112, 8 };\n    min = ob.MinVal(args);\n    Console.WriteLine(\"\
  Minimum is \" + min);\n  }\n}\n```\n\n程序的输出为：\nMinimum is 10\nMinimum is -1\nMinimum\
  \ is 8\n\n每当调用 `MinVal()` 时，参数都会通过 `nums` 数组传递给它。数组的长度等于元素的数量。因此，你可以使用 `MinVal()`\
  \ 来寻找任意数量值的最小值。注意最后一次对 `MinVal()` 调用。它不是逐个传递值，而是传递了一个数组。这是完全合法的。当创建 `params` 参数时，它既接受变长参数列表，也接受包含这些参数的数组。尽管你可以向\
  \ `params` 参数传递任意数量的参数，但它们必须都是与指定数组兼容的类型。例如，像这样调用 `MinVal()`：\n`min = ob.MinVal(1,\
  \ 2.2);` 是非法的，因为没有从 `double` 到 `int` 的自动转换，而 `nums` 在 `MinVal()` 中的类型是整数。\n\n在使用\
  \ `params` 时，你需要注意边界条件，因为 `params` 参数可以接受任意数量的参数——甚至是零个！例如，像这里这样调用 `MinVal()` 在语法上是有效的：\n\
  `min = ob.MinVal();` // 无参数\n`min = ob.MinVal(3);` // 1 个参数\n\n这就是为什么在 `MinVal()`\
  \ 中有一个检查，在尝试访问该元素之前确认 `nums` 数组中至少有一个元素。如果没有这个检查，当在没有参数的情况下调用 `MinVal()` 时，将导致运行时异常（异常在第\
  \ 13 章中描述）。此外，`MinVal()` 中的代码编写方式允许带一个参数调用 `MinVal()`。在这种情况下，将返回该唯一的参数。\n\n方法可以既有普通参数，也可以有变长参数。例如，在下面的程序中，`ShowArgs()`\
  \ 方法接收一个 `string` 参数，然后是一个 `params` 参数：\n\n```csharp\n// 使用 params 参数的类。\nusing\
  \ System;\n\nclass MyClass {\n  public void ShowArgs(string msg, params int[] nums)\
  \ {\n    Console.Write(msg + \": \");\n    foreach(int i in nums)\n      Console.Write(i\
  \ + \" \");\n    Console.WriteLine();\n  }\n}\n\nclass Params2 {\n  static void\
  \ Main() {\n    MyClass ob = new MyClass();\n    ob.ShowArgs(\"Here are some integers\"\
  , 1, 2, 3, 4);\n    ob.ShowArgs(\"Here are more\", 17, 20);\n  }\n}\n```\n\n此程序的输出如下：\n\
  Here are some integers: 1 2 3 4 \nHere are more: 17 20\n\n### 返回对象\n\n方法可以返回任何数据类型，包括类类型。例如，下面的\
  \ `Rect` 类包含一个 `Enlarge()` 方法，它可以创建一个与调用矩形按比例放大的矩形：\n\n```csharp\n// 返回一个对象。\nusing\
  \ System;\n\nclass Rect {\n  int width;\n  int height;\n  public Rect(int w, int\
  \ h) {\n    width = w;\n    height = h;\n  }\n  public int Area() {\n    return\
  \ width * height;\n  }\n  public void Show() {\n    Console.WriteLine(width + \"\
  \ \" + height);\n  }\n  /* 返回比调用矩形大倍数的矩形。 */\n  public Rect Enlarge(int factor)\
  \ {\n    return new Rect(width * factor, height * factor);\n  }\n}\n\nclass RetObj\
  \ {\n  static void Main() {\n    Rect r1 = new Rect(4, 5);\n    Console.Write(\"\
  Dimensions of r1: \");\n    r1.Show();\n    Console.WriteLine(\"Area of r1: \" +\
  \ r1.Area());\n    // 创建比 r1 大一倍的矩形。\n    Rect r2 = r1.Enlarge(2);\n    Console.Write(\"\
  Dimensions of r2: \");\n    r2.Show();\n    Console.WriteLine(\"Area of r2: \" +\
  \ r2.Area());\n  }\n}\n```\n\n输出为：\nDimensions of r1: 4 5\nArea of r1: 20\nDimensions\
  \ of r2: 8 10\nArea of r2: 80\n\n当对象由方法返回时，它将一直存在直到不再有它的引用。那时，它将受到垃圾回收。因此，对象不会因为创建它的方法而被销毁。\n\
  \n对象返回类型的一种应用是类工厂。类工厂是一种用于构造类对象的方法。在某些情况下，出于安全考虑或由于对象构造取决于某些外部因素，你可能不想让类的用户访问类的构造函数。在这种情况下，使用类工厂来构造对象。这里有一个简单的示例：\n\
  \n```csharp\n// 使用类工厂。\nusing System;\n\nclass MyClass {\n  int a, b; // 私有\n  //\
  \ 为 MyClass 创建一个类工厂。\n  public MyClass Factory(int i, int j) {\n    MyClass t =\
  \ new MyClass();\n    t.a = i;\n    t.b = j;\n    return t; // 返回一个对象\n  }\n  public\
  \ void Show() {\n```\n\n\n\n\n\n```csharp\nConsole.WriteLine(\"a and b: \" + a +\
  \ \" \" + b);\n\n  }\n\n}\n\nclass MakeObjects {\n\n  static void Main() {\n   \
  \ MyClass ob = new MyClass();\n    int i, j;\n    // 使用工厂生成对象。\n    for(i=0, j=10;\
  \ i < 10; i++, j--) {\n      MyClass anotherOb = ob.Factory(i, j); // 创建一个对象\n \
  \     anotherOb.Show();\n    }\n    Console.WriteLine();\n  }\n}\n```\n\n输出如下：\n\
  \n```text\na and b: 0 10\na and b: 1 9\na and b: 2 8\na and b: 3 7\na and b: 4 6\n\
  a and b: 5 5\na and b: 6 4\na and b: 7 3\na and b: 8 2\na and b: 9 1\n```\n\n让我们仔细观察这个例子。`MyClass`\
  \ 没有定义构造函数，因此只有默认构造函数可用。因此，无法使用构造函数来设置 `a` 和 `b` 的值。然而，类工厂 `Factory()` 可以创建对象并为\
  \ `a` 和 `b` 赋值。此外，由于 `a` 和 `b` 是私有的，使用 `Factory()` 是设置这些值的唯一方法。\n\n在 `Main()` 方法中，实例化了一个\
  \ `MyClass` 对象，并在 `for` 循环中使用其工厂方法创建了其他十对象。创建对象的代码行所示：\n\n```csharp\nMyClass anotherOb\
  \ = ob.Factory(i, j); // 获取一个对象\n```\n\n在每次迭代中，都会创建一个名为 `anotherOb` 的对象引用，并将其分配为工厂构造的对象的引用。在循环的每次迭代结束时，`anotherOb`\
  \ 将超出作用域，它所引用的对象将被回收。\n\n### 返回数组\n\n由于 C# 中的数组被实现为对象，因此方法也可以返回数组。（这与 C++ 不同，C++\
  \ 中的数组不能作为有效的返回类型。）例如，在下面的程序中，`FindFactors()` 方法返回一个包含其传入参数因子的数组：\n\n```csharp\n\
  // 返回一个数组。\nusing System;\nclass Factor {\n  /* 返回一个包含 num 因子的数组。\n     返回时，numfactors\
  \ 将包含找到的因子数量。 */\n  public int[] FindFactors(int num, out int numfactors) {\n  \
  \  int[] facts = new int[80]; // 大小 80 是任意的\n    int i, j;\n    // 寻找因子并将其放入 facts\
  \ 数组。\n    for(i=2, j=0; i < num/2 + 1; i++)\n      if( (num%i)==0 ) {\n       \
  \ facts[j] = i;\n        j++;\n      }\n    numfactors = j;\n    return facts;\n\
  \  }\n}\n\nclass FindFactors {\n  static void Main() {\n    Factor f = new Factor();\n\
  \    int numfactors;\n    int[] factors;\n    factors = f.FindFactors(1000, out\
  \ numfactors);\n    Console.WriteLine(\"Factors for 1000 are: \");\n    for(int\
  \ i=0; i < numfactors; i++)\n      Console.Write(factors[i] + \" \");\n    Console.WriteLine();\n\
  \  }\n}\n```\n\n输出如下\n\n```text\nFactors for 1000 are: 2 4 5 8 10 20 25 40 50 100\
  \ \n```\n\n在 `Factor` 类中，`FindFactors()` 的声明如下：`public int[] FindFactors(int num,\
  \ out int numfactors)`。注意 `int[]` 数组返回类型是如何指定的。这种语法可以进行泛化。每当一个方法返回数组时，都以类似的方式指定它，并根据需要调整类型。例如，接下来的代码声明了一个返回\
  \ `double` 二维数组的方法 `someMeth()`：`public double[,] someMeth()`。\n\n### 方法重载\n\n在\
  \ C# 中，在同一个类中的两个或多个方法只要它们的参数声明是不同的，就可以共享相同的名称。在这种情况下，这些方法被称为*重载的*（overloaded），而该过程被称为*方法重载*（method\
  \ overloading）。方法重载是 C# 实现多态的方式之一。通常，要重载方法，只需声明它的不同版本。编译器会处理其余工作。你必须遵守一个限制：每个重载方法的参数类型或数量必须不同。仅两个方法在返回类型上不同是不够的。它们必须在参数的类型或数量上不同。（在所有情况下，返回类型无法提供让\
  \ C# 决定使用哪种方法的足够信息。）当然，重载方法在返回类型上也可以有所不同。当调用重载方法时，执行的方法版本是参数与参数相匹配的版本。这里有一个说明方法重载的简单示例：\n\
  \n```csharp\nusing System;\nclass Overload {\n  public void Demo() {\n    Console.WriteLine(\"\
  No parameters\");\n  }\n  // 为一个整数参数重载 OlDemo。\n  public void OlDemo(int a) {\n\
  \    Console.WriteLine(\"One parameter: \" + a);\n  }\n  // 为两个整数参数重载 OlDemo。\n\
  \  public int OlDemo(int a, int b) {\n    Console.WriteLine(\"Two parameters: \"\
  \ + a); // 注：此处原文逻辑似乎有缺失，按结构翻译\n    return a + b;\n  }\n  // 为两个 double 参数重载 OlDemo。\n\
  \  public double OlDemo(double a, double b) {\n    Console.WriteLine(\"Two parameters:\
  \ \" + a);\n    return a + b;\n  }\n}\n\nclass OverloadDemo {\n  static void Main()\
  \ {\n    Overload ob = new Overload();\n    int resI;\n    double resD;\n    //\
  \ 调用所有的 OlDemo 版本。\n    ob.Demo();\n    Console.WriteLine();\n    ob.OlDemo(2);\n\
  \    Console.WriteLine();\n    resI = ob.OlDemo(4, 6);\n    Console.WriteLine();\n\
  \    resD = ob.OlDemo(1.1, 2.2);\n    Console.WriteLine();\n  }\n}\n```\n\n该程序产生以下输出：\n\
  \n```text\nNo parameters\n\nOne parameter: 2\n\nTwo parameters: 4\nTwo parameters:\
  \ 1.1\n3.32\n```\n\n如你所见，`OlDemo()` 被重载了四次。第一个版本不接受参数；第二个接受一个整数参数；第三个接受两个整数参数；第四个接受两个\
  \ double 参数。前两个版本返回 `void`，而后两个返回一个值。这是完全有效的，但正如所解释的，重载不受方法返回类型的影响。因此，尝试使用以下两个版本的\
  \ `Demo()` 仍然会导致错误：\n\n```csharp\n// Demo(int) 是可以的。\npublic void Demo(int a) {\n\
  \  Console.WriteLine(\"One parameter: \" + a);\n}\n/* 即使返回不同，两个 Demo(int) 是不可行的\
  \ */\npublic int Demo(int a) {\n  Console.WriteLine(\"One parameter: \" + a);\n\
  \  return a;\n}\n```\n\n正如注释所示，返回类型的差异不足以进行重载。正如你在第三章中所记得，C# 提供了某些隐式（即自动）类型转换。这些转换也适用于重载方法的参数。例如，考虑以下内容：\n\
  \n```csharp\nusing System;\nclass Overload2 {\n  public void Meth(int x) {\n   \
  \ Console.WriteLine(\"Inside Meth(int): \" + x);\n  }\n  public void Meth(double\
  \ x) {\n    Console.WriteLine(\"Inside Meth(double): \" + x);\n  }\n}\n\nclass TypeConv\
  \ {\n  static void Main() {\n    Overload2 ob = new Overload2();\n    int i = 10;\n\
  \    double d = 10.1;\n    byte b = 99;\n    short s = 10;\n    float f = 11.5F;\n\
  \    ob.Meth(i); // 调用 ob.Meth(int)\n    ob.Meth(d); // 调用 ob.Meth(double)\n   \
  \ ob.Meth(b); // 调用 ob.Meth(int) -- 类型转换\n    ob.Meth(s); // 调用 ob.Meth(int) --\
  \ 类型转换\n    ob.Meth(f); // 调用 ob.Meth(double) -- 类型转换\n  }\n}\n```\n\n该程序的输出为：\n\
  \n```text\nInside Meth(int): 10\nInside Meth(double): 10.1\nInside Meth(int): 99\n\
  Inside Meth(int): 10\nInside Meth(double): 11.5\n```\n\n\n\n\n在此示例中，只定义了两个版本的 `MyMeth()`：一个带有\
  \ `int` 参数，另一个带有 `double` 参数。然而，完全可以向 `MyMeth()` 传递 `byte`、`short` 或 `float` 类型的值。在\
  \ `byte` 和 `short` 的情况下，C# 会自动将它们转换为 `int`。因此，调用了 `MyMeth(int)`。在 `float` 的情况下，该值被转换为\
  \ `double` 并调用了 `MyMeth(double)`。\n\n然而，重要的一点是，隐式转换仅在参数和参数之间没有精确的类型匹配时才适用。例如，这里是在之前的程序基础上增加了一个指定\
  \ `byte` 参数的 `MyMeth()` 版本：\n\n```csharp\n// 添加 MyMeth(byte).\n\nusing System;\n\
  \nclass Overload2 {\n  public void MyMeth(byte x) {\n    Console.WriteLine(\"Inside\
  \ MyMeth(byte): \" + x);\n  }\n\n  public void MyMeth(int x) {\n    Console.WriteLine(\"\
  Inside MyMeth(int): \" + x);\n  }\n\n  public void MyMeth(double x) {\n    Console.WriteLine(\"\
  Inside MyMeth(double): \" + x);\n  }\n}\n\nclass TypeConv {\n  static void Main()\
  \ {\n    Overload2 ob = new Overload2();\n    int i = 10;\n    double d = 10.1;\n\
  \    byte b = 99;\n    short s = 10;\n    float f = 11.5F;\n    ob.MyMeth(i); //\
  \ 调用 ob.MyMeth(int)\n    ob.MyMeth(d); // 调用 ob.MyMeth(double)\n    ob.MyMeth(b);\
  \ // 调用 ob.MyMeth(byte) -- 现在不再进行类型转换\n    ob.MyMeth(s); // 调用 ob.MyMeth(int) --\
  \ 类型转换\n    ob.MyMeth(f); // 调用 ob.MyMeth(double) -- 类型转换\n  }\n}\n```\n\n现在当运行该程序时，将产生以下输出：\n\
  ```\nInside MyMeth(int): 10\nInside MyMeth(double): 10.1\nInside MyMeth(byte): 99\n\
  Inside MyMeth(int): 10\nInside MyMeth(double): 11.5\n```\n\n在这一版本中，由于存在一个接受 `byte`\
  \ 参数的 `MyMeth()` 版本，当使用 `byte` 参数调用 `MyMeth()` 时，会调用 `MyMeth(byte)`，且不会发生到 `int`\
  \ 的自动转换。`ref` 和 `out` 均参与重载解析。例如，以下定义了两个不同且独立的方法：\n\n```csharp\npublic void MyMeth(int\
  \ x) {\n  Console.WriteLine(\"Inside MyMeth(int): \" + x);\n}\n\npublic void MyMeth(ref\
  \ int x) {\n  Console.WriteLine(\"Inside MyMeth(ref int): \" + x);\n}\n```\n\n因此，`ob.MyMeth(i)`\
  \ 调用了 `MyMeth(int x)`，而 `ob.MyMeth(ref i)` 调用了 `MyMeth(ref int x)`。尽管 `ref` 和 `out`\
  \ 参与重载解析，但仅凭两者的区别是不够的。例如，这两个版本的 `MyMeth()` 是无效的：\n\n```csharp\n// 错误！\npublic void\
  \ MyMeth(out int x) { //...\npublic void MyMeth(ref int x) { //...\n```\n\n在这种情况下，编译器无法仅仅通过两个版本的\
  \ `MyMeth()` 进行区分，因为其中一个使用了 `out int` 参数，而另一个使用了 `ref int` 参数。\n\n方法重载支持多态，因为它是\
  \ C# 实现“一个接口，多个方法”范式的方法之一。要理解这一点，请考虑以下内容。在不支持重载的语言中，每个方法必须赋予一个唯一的名称。然而，你通常可能想要为不同类型的数据实现相同的方法。考虑绝对值函数。在不支持重载的语言中，该函数通常有三个或更多版本，每个版本的名称略有不同。例如，在\
  \ C 语言中，函数 `abs()` 返回整数的绝对值，`labs()` 返回长整数的绝对值，而 `fabs()` 返回浮点数的绝对值。\n\n由于 C 不支持重载，每个函数必须有自己唯一的名称，尽管这三个本质上是在做相同的事情。这使得情况在概念上比实际情况更复杂。尽管每个函数的底层概念是相同的，你仍然有三个名称需要记忆。这种情况在\
  \ C# 中不会发生，因为每个绝对值方法可以使用相同的名称。事实上，.NET Framework 类库包含一个名为 `Abs()` 的绝对值方法。该方法由 `System.Math`\
  \ 类重载，以处理各种数值类型。C# 根据参数的类型决定调用哪个版本的 `Abs()`。\n\n重载的一个主要价值是它允许通过通用名称来访问相关方法。因此，`Abs`\
  \ 名称代表了正在执行的*通用操作*。为特定情况选择正确的*特定*版本则留给编译器处理。你，作为程序员，只需要记住正在执行的通用操作即可。通过多态的应用，多个名称被减少为了一个。尽管这个示例非常简单，但如果你扩展这个概念，就可以看到重载如何帮助管理更大的复杂性。\n\
  \n当你重载一个方法时，该方法的每个版本都可以执行你期望的任何活动。没有规则规定重载方法必须相互关联。然而，从风格的角度来看，方法重载意味着它们之间存在某种关系。\n\
  \n##构造函数 (Constructors)\n\n类似于方法，构造函数也可以重载。这允许你以多种方式创建对象。例如，考虑以下程序，它展示了重载的构造函数：\n\
  \n```csharp\n// 用于字符的栈类。\n\nusing System;\n\nclass Stack {\n  // 这些成员是私有的。\n  char[]\
  \ stck; // 保存栈\n  int tos;      // 栈顶索引\n\n  // 根据给定的大小构造空栈。\n  public Stack(int\
  \ size) {\n    stck = new char[size]; // 为栈分配内存\n    tos = 0;\n  }\n}\n```\n\n重载构造函数的最常见原因之一是允许一个对象初始化另一个对象。例如，这里是早期\
  \ `Stack` 类的增强版本，它允许从另一个栈构造栈：\n\n```csharp\n// 用于字符的栈类。\n\nusing System;\n\nclass\
  \ Stack {\n  // 这些成员是私有的。\n  char[] stck; // 保存栈\n  int tos;      // 栈顶索引\n\n  //\
  \ 根据给定的大小构造空栈。\n  public Stack(int size) {\n    stck = new char[size]; // 为栈分配内存\n\
  \    tos = 0;\n  }\n}\n```\n(注：由于提供的原始文本最后部分出现了重复内容，此处已按要求完成翻译，确保不重复)\n\n\n\n\n\
  ```csharp\n // 从一个栈构造一个栈。\n  public Stack(Stack ob) {\n    // 为栈分配内存。\n    stck\
  \ = new char[ob.stck.Length];\n    // 将元素拷贝到新栈中。\n    for(int i=0; i < ob.tos; i++)\n\
  \      stck[i] = ob.stck[i];\n    // 设置新栈的栈顶（tos）。\n    tos = ob.tos;\n  }\n\n \
  \ // 将字符推入栈中。\n  public void Push(char ch) {\n    if(tos==stck.Length) {\n     \
  \ Console.WriteLine(\" -- 栈满了.\");\n      return;\n    }\n    stck[tos] = ch;\n\
  \    tos++;\n  }\n\n  // 从栈中弹出字符。\n  public char Pop() {\n    if(tos==0) {\n   \
  \   Console.WriteLine(\" -- 栈为空.\");\n      return (char) 0;\n    }\n    tos--;\n\
  \    return stck[tos];\n  }\n\n  // 如果栈满了则返回 true。\n  public bool IsFull() {\n \
  \   return tos==stck.Length;\n  }\n\n  // 如果栈为空则返回 true。\n  public bool IsEmpty()\
  \ {\n    return tos==0;\n  }\n\n  // 返回栈的空容量。\n  public int Capacity() {\n    return\
  \ stck.Length;\n  }\n\n  // 返回栈中当前对象的数量。\n  public int GetNum() {\n    return tos;\n\
  \  }\n}\n\n// 演示 Stack 类。\nclass StackDemo {\n  static void Main() {\n    Stack\
  \ stk1 = new Stack(10);\n    char ch;\n    int i;\n    // 将一些字符放入 stk1。\n    Console.WriteLine(\"\
  将 A 到 J 推入 stk1.\");\n      for(i=0; !stk1.IsFull(); i++)\n        stk1.Push((char)\
  \ ('A' + i));\n    // 创建 stk1 的副本。\n      Stack stk2 = new Stack(stk1);\n    //\
  \ 显示 stk1 的内容。\n    Console.Write(\"stk1 的内容: \");\n      while( !stk1.IsEmpty()\
  \ ) {\n        ch = stk1.Pop();\n        Console.Write(ch);\n      }\n    Console.WriteLine();\n\
  \    Console.Write(\"stk2 的内容: \");\n    while (!stk2.IsEmpty() ) {\n      ch =\
  \ stk2.Pop();\n      Console.Write(ch);\n    }\n    Console.WriteLine(\"\\n\");\n\
  \  }\n}\n```\n\n输出所示：\n将 A 到 J 推入 stk1。\nstk1 的内容: JIHGFEDBA\nstk2 的内容: JIHGFEDBA\n\
  \n在 `StackDemo` 中，第一个栈 `stk1` 被构造并填充了字符。然后使用该栈来构造了第二个栈 `stk2`。这导致了以下 `Stack` 构造函数的执行：\n\
  \n```csharp\n// 从一个栈构造一个栈。\npublic Stack(Stack ob) {\n  // 为栈分配内存。\n  stck = new\
  \ char[ob.stck.Length];\n  // 将元素拷贝到新栈中。\n  for(int i=0; i < ob.tos; i++)\n    stck[i]\
  \ = ob.stck[i];\n  // 设置新栈的栈顶（tos）。\n  tos = ob.tos;\n}\n```\n\n在这个构造函数内部，分配了一个足够长的数组来容纳\
  \ `ob` 中的元素。然后，将 `ob` 数组的内容拷贝到新数组中，并适当设置了 `tos`。构造函数完成后，新栈和原始栈是相互独立的但内容相同。\n\n#####\
  \ 通过此方法调用重载构造函数\n\n在处理重载构造函数时，有时让一个构造函数调用另一个构造函数是有帮助的。在 C# 中，这是通过 `this` 关键字的另一种形式实现的。通用形式所示所示：\n\
  \n```csharp\nconstructor-name(parameter-list1): this(parameter-list2) {\n  // ...\
  \ 构造函数体，可以为空\n}\n```\n\n当构造函数执行时，首先执行的是通过 `parameter-list2` 匹配参数列表的重载构造函数。然后，如果原始构造函数内部有任何语句，将执行它们。这里是一个示例：\n\
  \n```csharp\n// 演示通过 this 调用构造函数。\nusing System;\nclass XYCoord {\n  public int\
  \ x, y;\n  public XYCoord() : this(0, 0) {\n    Console.WriteLine(\"Inside XYCoord()\"\
  );\n  }\n  public XYCoord(XYCoord obj) : this(obj.x, obj.y) {\n    Console.WriteLine(\"\
  Inside XYCoord(obj)\");\n  }\n  public XYCoord(int i, int j) {\n    Console.WriteLine(\"\
  Inside XYCoord(int, int)\");\n    x = i;\n    y = j;\n  }\n}\nclass OverloadConsDemo\
  \ {\n  static void Main() {\n    XYCoord t1 = new XYCoord();\n    XYCoord t2 = new\
  \ XYCoord(8, 9);\n    XYCoord t3 = new XYCoord(t2);\n    Console.WriteLine(\"t1.x,\
  \ t1.y: \" + t1.x + \", \" + t1.y);\n    Console.WriteLine(\"t2.x, t2.y: \" + t2.x\
  \ + \", \" + t2.y);\n    Console.WriteLine(\"t3.x, t3.y: \" + t3.x + \", \" + t3.y);\n\
  \  }\n}\n```\n\n程序的输出所示：\nInside XYCoord(int, int)\nInside XYCoord()\nInside XYCoord(int,\
  \ int)\nInside XYCoord(obj)\nt1.x, t1.y: 0, 0\nt2.x, t2.y: 8, 9\nt3.x, t3.y: 8,\
  \ 9\n\n首先执行的是 `XYCoord(int, int)`。这初始化了 `x` 和 `y`。这样做的一个好处是它可以避免代码重复。\n\n#### 对象初始化器\n\
  \n*对象初始化器*提供了创建对象的另一种方式。（关于属性的讨论请参见第 10 章。）由于对象初始化器可以与命名类一起，这里引入了初始化的基础。让我们从一个简单的示例开始：\n\
  \n```csharp\n// 对象初始化器的简单示例。\nusing System;\nclass MyClass {\n  public int Count;\n\
  \  public string Str;\n}\nclass ObjInitDemo {\n  static void Main() {\n    // 使用对象初始化器构造\
  \ MyClass 对象。\n    MyClass obj = new MyClass { Count = 100, Str = \"Testing\" };\n\
  \    Console.WriteLine(obj.Count + \" \" + obj.Str);\n  }\n}\n```\n\n这产生了输出：\n100\
  \ Testing\n\n如输出所示，`obj.Count` 的值被初始化为 100，`obj.Str` 的值被初始化为 \"Testing\"。注意，`MyClass`\
  \ 没有定义任何显式构造函数，也没有使用标准的构造函数语法。\n\n重要的是，初始化器的顺序并不重要。例如，`obj` 可以像所示所示进行初始化：\n\n\n\n\
  \n在此语句中，`Str` 的初始化在 `Count` 的初始化之前。在程序中，情况恰恰相反。然而，无论哪种情况，结果都是相同的。\n\n以下是对象初始化语法的通用形式：\n\
  \n```\nnew *class-name* { *name* = *expr*, *name* = *expr*, *name* = *expr*, ...\
  \ }\n```\n\n在这里，`name` 指定字段或属性的名称，该字段是 `class-name` 的一个可访问成员。当然，由 `expr` 指定的初始化表达式的类型必须与字段或属性的类型兼容。\n\
  \n虽然你可以对具名类使用对象初始化器（例如示例中的 `MyClass`），但你通常不会这样做。通常情况下，在处理具名类时，你将使用普通的构造函数调用语法。如所述，对象初始化器最适用于由\
  \ LINQ 表达式生成的匿名类型。\n\n### 可选参数\n\nC# 4.0 引入了一项新功能，增加了调用方法时指定参数方式的灵活性。这项功能被称为**可选参数**，它允许你为方法的参数定义默认值。如果在调用方法时没有指定与该参数相对应的参数，将使用此默认值。因此，为此类参数指定参数是可选的。可选参数可以简化对某些参数适用默认参数的方法调用。它们也可以用作方法重载的“简写”形式。\n\
  \n通过创建 `optional parameter.*`，可以启用可选参数。要做到这一点，只需使用类似于变量初始化的语法为参数指定默认值即可。该默认值必须是一个常量表达式。例如，考虑此方法声明：\n\
  \n```\nstatic void OptArgMeth(int alpha, int beta=10, int gamma = 20) {\n```\n\n\
  在这里，声明了两个可选参数。它们是 `beta` 和 `gamma`。在这种情况下，`beta` 的默认值为 10，`gamma` 的默认值为 20。如果在调用方法时没有为这些参数指定参数，则将使用这些默认值。注意，`alpha`\
  \ 不是可选参数。相反，它是一个普通参数，并且始终需要为它提供参数。\n\n假设了上述对 `OptArgMeth()` 的声明，可以通过以下方式调用它：\n\n\
  ```cs\n// 显式传递所有参数。\nOptArgMeth(1, 2, 3);\n\n// 让 gamma 使用默认值。\nOptArgMeth(1, 2);\n\
  \n// 让 beta 和 gamma 都使用默认值。\nOptArgMeth(1);\n```\n\n第一次调用将值 1 传递给 `alpha`，2 传递给\
  \ `beta`，3 传递给 `gamma`。因此，所有三个参数都是显式指定的，没有使用默认值。第二次调用将值 1 传递给 `alpha`，2 传递给 `beta`，但让\
  \ `gamma` 默认为 20。第三次调用将 1 传递给 `alpha`，并让 `beta` 和 `gamma` 都使用默认值。需要理解的是，在任何情况下，`beta`\
  \ 可能可能没有 `gamma` 使用默认。一旦第一个参数使用默认值，所有剩余参数也必须使用默认值。\n\n以下程序展示了上述的整个过程：\n\n```cs\n\
  // 展示可选参数。\nusing System;\n\nclass OptionArgDemo {\n  static void OptArgMeth(int\
  \ alpha, int beta=10, int gamma = 20) {\n    Console.WriteLine(\"Here is alpha,\
  \ beta, and gamma: \" +\n                      alpha + \" \" + beta + \" \" + gamma);\n\
  \  }\n  static void Main() {\n    // 显式传递所有参数。\n    OptArgMeth(1, 2, 3);\n    //\
  \ 让 gamma 使用默认值。\n    OptArgMeth(1, 2);\n    // 让 beta 和 gamma 都使用默认值。\n    OptArgMeth(1);\n\
  \  }\n}\n```\n\n此处显示的输出确认了默认参数的使用：\n```\nHere is alpha, beta, and gamma: 1 2 3\n\
  Here is alpha, beta, and gamma: 1 2 20\nHere is alpha, beta, and gamma: 1 10 20\n\
  ```\n\n如输出所示，当未指定参数时，将使用其默认值。\n\n重要的一点是所有可选参数必须出现在必需参数的右侧。例如，以下声明是无效的：\n\n```cs\n\
  int Sample(string name = \"user\", int userId) // 错误\n```\n\n要修复这个问题，你必须在 `name`\
  \ 之前声明 `userId`。一旦开始声明可选参数，下面的也是错误的：\n\n```cs\nint Sample(int userId, string name\
  \ = \"user\") // 错误\n```\n\n因为 `name` 是可选的，`userId` 必须放在前面。\n\n### 可选参数与重载\n\n在某些情况下，可选参数可以作为方法重载的替代方案。为了理解为什么，再次考虑\
  \ `OptArgMeth()` 方法。在 C# 增加可选参数之前，你将创建三个版本来实现相同的功能：\n\n```cs\nstatic void OptArgMeth(int\
  \ alpha)\nstatic void OptArgMeth(int alpha, int beta)\nstatic void OptArgMeth(int\
  \ alpha, int beta, int gamma)\n```\n\n这些重载允许使用一个、两个或三个参数调用该方法。（方法体必须为每个版本提供相应的逻辑。）虽然使用重载来实现\
  \ `OptArgMeth()` 并没有错，但使用可选参数是更好的方法。当然，并非所有情况都适用于这种方法。\n\n### 可选参数与歧义\n\n使用可选参数时可能产生的问题是歧义。当具有可选参数的方法被重载时，就会发生这种情况。在某些情况下，编译器可能无法确定调用哪个版本。例如，考虑\
  \ `OptArgMeth()` 的两个版本：\n\n```cs\nstatic void OptArgMeth(int alpha, int beta=10,\
  \ int gamma = 20) {\n  Console.WriteLine(\"Here is alpha, beta, and gamma: \" +\n\
  \                    alpha + \" \" + beta + \" \" + gamma);\n}\n\nstatic void OptArgMeth(int\
  \ alpha, double beta=10.0, double gamma = 20.0) {\n  Console.WriteLine(\"Here is\
  \ alpha, beta, and gamma: \" +\n                    alpha + \" \" + beta + \" \"\
  \ + gamma);\n}\n```\n\n注意这两个版本之间的唯一区别是可选参数 `beta` 和 `gamma` 的类型。在第一个版本中，它们的类型是 `int`。在第二个版本中，类型是\
  \ `double`。给定这两个重载，对 `OptArgMeth()` 的以下调用是歧义的：\n\n```cs\nOptArgMeth(1); // 错误！歧义\n\
  ```\n\n此调用具有歧义性，因为编译器不知道应该使用 `beta` 和 `gamma` 为 `int` 的版本，还是它们为 `double` 的版本。\n\n\
  通常情况下，由于在重载允许可选参数的方法时歧义可能是一个因素，因此必须考虑此类重载的影响。在某些情况下，你可能需要避免使用可选参数，以避免导致你的方法无法按预期方式使用的歧义。\n\
  \n##### **可选参数的实际示例**\n\n\n\n\n为了更直观地说明可选参数如何简化对某些类型方法的调用，请考虑以下程序。它声明了一个名为 `Display()`\
  \ 的方法，用于显示字符串。该字符串可以完整显示，也可以只显示部分部分。\n\n```csharp\n// 使用可选参数来简化对方法的调用。\n\nusing\
  \ System;\n\nclass UseOptArgs {\n  // 显示字符串的部分或全部。\n  static void Display(string\
  \ str, int start = 0, int stop = -1) {\n    if(stop < 0)\n      stop = str.Length;\n\
  \    // 检查超出范围的情况。\n    if(stop > str.Length | start > stop | start < 0)\n     \
  \ return;\n    for(int i=start; i < stop; i++)\n        Console.Write(str[i]);\n\
  \    Console.WriteLine();\n  }\n\n  static void Main() {\n    Display(\"this is\
  \ a test\");\n    Display(\"this is a test\", 10);\n    Display(\"this is a test\"\
  , 5, 12);\n  }\n}\n```\n\n输出所示：\n\n```\nthis is a test\ntest\nis a te te\n```\n\n\
  仔细观察 `Display()` 方法。要显示的字符串通过第一个参数传递。该参数是必须的。第二个和第三个参数是可选的。可选参数指定了要显示的字符串部分的起始和结束索引。如果没有给\
  \ `stop` 赋值，它的默认值为 –1，这表示停止点是字符串的末尾。如果没有给 `start` 赋值，它的默认值为 0。因此，如果两个可选参数都不存在，则将完整显示字符串。否则，将显示字符串指定的区域。这意味着，如果你用一个参数调用\
  \ `Display()`（即要显示的字符串），则将完整显示字符串。如果你用两个参数调用 `Display()`，则将显示从 `start` 开始到字符串末尾的字符。如果三个参数都传递了，则将显示字符串从\
  \ `start` 到 `stop` 的部分。\n\n尽管这个示例非常简单，但它确实展示了可选参数提供的核心优势。它允许你仅指定使用时所需要的参数。默认值不需要显式传递。\n\
  \n在继续之前，必须强调重要的一点。虽然可选参数在用得当时是一个强大的工具，但它们也可能被误用。可选参数的目的是让方法能够以高效、易用的方式执行任务，同时保持相当大的灵活性。为此，所有可选参数的默认值都应该便于方法的正常使用。如果不是如此，可选参数的使用可能会破坏你的代码结构并误导他人。最后，可选参数的默认值不应该造成任何危害。换句话说，无意中使用可选参数不应产生不可逆的负面后果。例如，忘记指定参数不应导致重要数据文件被删除！\n\
  \n### 命名参数\n\n另一个与向方法传递参数相关的特性是命名参数。命名参数是 C# 4.0 引入的。如你所知，通常情况下，在向方法传递参数时，参数的顺序必须与方法中定义的参数顺序匹配。换句话说，参数在参数列表中的位置决定了它被赋值给哪一个参数。命名参数消除了这一限制。使用命名参数，你可以指定参数所应用的参数名称。使用这种方法，参数的顺序就不重要了。因此，命名参数有点像之前描述的对象初始化器，尽管语法有所不同。\n\
  \n要通过名称指定参数，请使用以下语法：\n\n`param-name: value`\n\n在这里，`param-name` 指定了传递给 `value` 的参数名称。当然，`param-name`\
  \ 必须指定被调用方法的有效有效参数名。\n\n这是一个演示命名参数的简单示例。它创建了一个名为 `IsFactor()` 的方法，如果第一个参数可以被第二个参数整除，则返回真值。\n\
  \n```csharp\n// 使用命名参数。\n\nusing System;\n\nclass NamedArgsDemo {\n  // 确定一个值是否能被另一个值整除。\n\
  \  static bool IsFactor(int val, int divisor) {\n    if((val % divisor) == 0) return\
  \ true;\n    return false;\n  }\n  static void Main() {\n    // 以下显示了调用 IsFactor()\
  \ 的各种方式。\n    // 使用位置参数调用。\n    if(IsFactor(10, 2))\n      Console.WriteLine(\"\
  2 is factor of 10.\");\n    // 使用命名参数调用。\n    if(IsFactor(val: 10, divisor: 2))\n\
  \      Console.WriteLine(\"2 is factor of 10.\");\n    // 使用命名参数时，顺序不重要。\n    if(IsFactor(divisor:\
  \ 2, val: 10))\n      Console.WriteLine(\"2 is factor of 10.\");\n    // 同时使用位置参数和命名参数。\n\
  \    if(IsFactor(10, divisor: 2))\n      Console.WriteLine(\"2 is factor of 10.\"\
  );\n  }\n}\n```\n\n输出所示：\n\n```\n2 is factor of 10.\n2 is factor of 10.\n2 is factor\
  \ of 10.\n2 is factor of 10.\n```\n\n如输出所示，每次调用 `IsFactor()` 方法都会产生相同的结果。\n\n除了演示命名参数语法的用法外，程序还展示了命名参数的两个重要方面。首先，指定参数的顺序并不重要。例如，这两个调用是等效的：\n\
  \n`IsFactor(val: 10, divisor: 2)`\n`IsFactor(divisor: 2, val: 10)`\n\n顺序无关是命名参数的主要优势。这意味着你不需要记住（甚至不需要）被调用方法的参数顺序。例如，在处理\
  \ COM 接口时这很有帮助。其次，请注意，如果在同一个调用中混合使用位置参数和命名参数，所有位置参数必须位于命名参数之前。正如这个对 `IsFactor()`\
  \ 的调用所示：\n\n`IsFactor(10, divisor: 2)`\n\n命名参数还可以与可选参数结合使用。例如，假设使用上一节中的 `Display()`\
  \ 方法，以下是使用命名参数调用的一些方式：\n\n```csharp\n// 通过命名指定所有参数。\nDisplay(stop: 10, str: \"this\
  \ is a test\", start: 0);\n// 让 start 使用默认。\nDisplay(stop: 10, str: \"this is a\
  \ test\");\n// 通过位置指定字符串，通过命名指定 stop，\n// 让 start 使用默认。\nDisplay(\"this is a test\"\
  , stop: 10);\n```\n\n通常，命名参数和可选参数的结合更容易调用具有许多参数的方法。由于命名参数语法比通常的位置语法更冗长，大多数情况下你会希望使用位置参数来调用方法。但在适用于命名参数的情况下，可以非常有效地使用它们。\n\
  \n***注意**：除了方法，命名和可选参数还可以用于构造函数、索引器和委托。\n\n到为止，你一直在使用 `Main()` 的形式。然而，它有多个重载形式。某些形式可以返回值，某些形式可以接收参数。这里将对它们进行逐一检查。\n\
  \n#### Main() 的返回值\n\n当程序结束时，你可以通过从 `Main()` 返回值给调用进程（通常是操作系统）。为了这样做，你可以使用这种形式的\
  \ `Main()`：\n\n`static int Main()`\n\n注意，这个版本的 `Main()` 没有声明为 `void`，而是返回 `int`\
  \ 类型。通常，Main()` 的返回值表示程序是正常结束还是由于异常情况结束。根据惯例，返回零通常表示正常终止。所有其他值都表示发生了某种错误。\n\n\n\n\
  \n许多程序接受所谓的 `command-line`（命令行）参数。命令行参数是在程序执行时，直接跟在命令行中程序名后面的信息。对于 C# 程序，这些参数随后会被传递给\
  \ `Main()` 方法。要接收这些参数，你必须使用以下 `Main()` 形式之一：\n\n```csharp\nstatic void Main(string[]\
  \ args)\n```\n\n```csharp\nstatic int Main(string[] args)\n```\n\n第一种形式返回 `void`；第二种形式可以用于返回一个整数值，如前一节所述。对于这两种形式，命令行参数都以字符串的形式存储在传递给\
  \ `Main()` 的 `string` 数组中。`args` 数组的长度等于命令行参数的数量，该数量可能为。\n\n例如，下面的程序将显示调用它时传入的所有命令行参数：\n\
  \n```csharp\n// 显示所有命令行信息。\nusing System;\n\nclass CLDemo {\n  static void Main(string[]\
  \ args) {\n    Console.WriteLine(\"There are \" + args.Length +\n              \
  \        \" command-line arguments.\");\n    Console.WriteLine(\"They are: \");\n\
  \    for(int i=0; i < args.Length; i++)\n      Console.WriteLine(args[i]);\n  }\n\
  }\n```\n\n如果像这样执行 `CLDemo`：\n\n`CLDemo one two three`\n\n你将看到以下输出：\n\n```text\n\
  There are 3 command-line arguments.\nThey are:\none\ntwo\nthree\n```\n\n为了理解命令行参数的使用方法，请考虑下一个程序。它使用一个简单的替换密码来编码或解码消息。要编码或解码的消息在命令行中指定。该密码非常简单：编码一个单词时，每个字母增加\
  \ 1。因此，A 变成 B，以此此类推。解码时，每个字母减 1。当然，这种密码没有实际价值，因为它太容易破解了。但它确实为孩子们提供了一种乐趣的消遣。\n\n\
  ```csharp\n// 使用简单的替换密码编码或解码消息。\nusing System;\n\nclass Cipher {\n  static int Main(string[]\
  \ args) {\n    // 检查是否存在参数。\n    if(args.Length < 2) {\n      Console.WriteLine(\"\
  Usage: encode/decode word1 [word2...wordN]\");\n      return 1; // 返回失败代码\n    }\n\
  \    // 如果存在参数，第一个参数必须是 encode 或 decode。\n    if(args[0] != \"encode\" & args[0]\
  \ != \"decode\") {\n      Console.WriteLine(\"First arg must be encode or decode.\"\
  );\n      return 1; // 返回失败代码\n    }\n    // 编码或解码消息。\n    for(int n=1; n < args.Length;\
  \ n++) {\n      for(int i=0; i < args[n].Length; i++) {\n        if(args[0] == \"\
  encode\")\n          Console.Write((char) (args[n][i] + 1) );\n        else\n  \
  \        Console.Write((char) (args[n][i] - 1) );\n      }\n      Console.Write(\"\
  \ \");\n    }\n    Console.WriteLine();\n    return 0;\n  }\n}\n```\n\n要使用该程序，请指定\
  \ `encode` 或 `decode` 命令，后跟上你想加密或解密的短语。假设程序名为 `Cipher`，以下是两个示例运行：\n\n`Cipher encode\
  \ one two`\n`Cipher decode one two`\n\n这个程序中有两个有趣的地方。首先，注意程序在继续执行之前是如何检查是否存在命令行参数的。这非常重要并且可以泛化。当程序依赖于一个或多个命令行参数时，它必须始终确认已提供正确的参数。未能这样做可能会导致功能故障。此外，由于第一个命令行参数必须是\
  \ `encode` 或 `decode`，程序在继续之前也会检查这一点。其次，注意程序是如何返回终止代码的。如果不存在所需的行，则返回 1，表示异常终止。否则，当程序结束时，返回\
  \ 0。\n\n### 递归\n\n在 C# 中，方法可以调用其自身。这个过程被称为 `recursion`（递归），调用自身的方法被称为递归方法。总的来说，递归是用它自身来定义某物的过程，与循环定义有些相似。递归方法的关键组件是它包含一条执行对自身调用的语句。递归是一种强大的控制机制。递归的经典例子是数字的阶乘。数字\
  \ `N` 的阶乘是 1 到 `N` 之间所有整数的乘积。例如，3 的阶乘是 `1×2×3`，即 6。下面的程序展示了计算数字阶乘的递归方法。为了比较，还包含了一个非递归的等效实现。\n\
  \n```csharp\n// 递归的简单示例。\nusing System;\n\nclass Factorial {\n  // 这是一个递归方法。\n \
  \ public int FactR(int n) {\n    int result;\n    if(n==1) return 1;\n    result\
  \ = FactR(n-1) * n;\n    return result;\n  }\n  // 这是一个迭代等效实现。\n  public int FactI(int\
  \ n) {\n    int t, result;\n    result = 1;\n    for(t=1; t <= n; t++) result *=\
  \ t;\n    return result;\n  }\n}\n\nclass Recursion {\n  static void Main() {\n\
  \    Factorial f = new Factorial();\n    Console.WriteLine(\"Factorials using recursive\
  \ method.\");\n    Console.WriteLine(\"Factorial of 3 is \" + f.FactR(3));\n   \
  \ Console.WriteLine(\"Factorial of 4 is \" + f.FactR(4));\n    Console.WriteLine(\"\
  Factorial of 5 is \" + f.FactR(5));\n    Console.WriteLine();\n    Console.WriteLine(\"\
  Factorials using iterative method.\");\n    Console.WriteLine(\"Factorial of 3 is\
  \ \" + f.FactI(3));\n    Console.WriteLine(\"Factorial of 4 is \" + f.FactI(4));\n\
  \    Console.WriteLine(\"Factorial of 5 is \" + f.FactI(5));\n  }\n}\n```\n\n该程序的输出在此：\n\
  \n```text\nFactorials using recursive method.\nFactorial of 3 is 6\nFactorial of\
  \ 4 is 24\nFactorial of 5 is 120\nFactorials using iterative method.\nFactorial\
  \ of 3 is 6\nFactorial of 4 is 24\nFactorial of 5 is 120\n```\n\n非递归方法 `FactI()`\
  \ 的操作显而易懂。它从 1 开始循环并逐步乘以每个数字。\n\n递归 `FactR()` 的操作要复杂一些。当调用 `FactR()` 的参数为 1 时，方法返回\
  \ 1；否则，它返回 `FactR(n-1)*n`。为了计算这个表达式，会调用 `FactR(n-1)`。这个过程不断重复，直到 `n` 等于 1，调用开始返回。你可能会发现如果在\
  \ `FactR()` 中插入 `WriteLine()` 显示每次调用的递归深度以及中间结果会趣。当方法调用自身时，会在栈上分配新的局部变量和参数，并从开始执行方法代码。递归调用不会创建方法的副本。只有参数是新的。随着每次递归调返回，旧的局部变量和参数从栈中移除，执行在方法内的调用处继续。递归方法可以被说是在伸出又收回。另一个递归的例子。`DisplayRev()`\
  \ 方法使用递归来反向显示其字符串参数。\n\n```csharp\n// 使用递归反向显示字符串。\nusing System;\n\nclass RevStr\
  \ {\n  // 反向显示字符串。\n  public void DisplayRev(string str) {\n    if(str.Length >\
  \ 0)\n      DisplayRev(str.Substring(1, str.Length-1));\n    else\n      return;\n\
  \    Console.Write(str[0]);\n  }\n}\n\nclass RevStrDemo {\n  static void Main()\
  \ {\n    string s = \"this is a test\";\n    RevStr rsOb = new RevStr();\n    Console.WriteLine(\"\
  Original string: \" + s);\n    Console.Write(\"Reversed string: \");\n    rsOb.DisplayRev(s);\n\
  \    Console.WriteLine();\n  }\n}\n```\n\n这里的输出是：\n\n```text\nOriginal string: this\
  \ is a test\nReversed string: tset a si siht\n```\n\n\n\n\n每次调用 `DisplayRev() `\
  \ 时，它首先检查 `str` 的长度是否大于零。如果是，它将递归调用 `DisplayRev() `，并传入一个由 `str` 减其第一个字符组成的新字符串。此过程会重复进行，直到传递一个长度为零的字符串。这会导致递归调用开始回溯。在回溯过程中，每次调用中\
  \ `str` 的第一个字符会被打印出来。这导致字符串以反序显示。\n\n许多例程的递归版本执行速度可能比等等的迭代版本慢一点，因为增加了额外的方法调用开销。对方法进行过多的递归调用可能会导致堆栈溢出（stack\
  \ overrun）。由于参数和局部变量的存储在堆栈上，且每次新调用都会创建这些变量的新副本，因此栈可能会被耗尽。如果发生这种情况，`CLR` 将抛出异常。然而，除非递归例程失控运行，否则你可能不需要担心这个问题。\n\
  \n递归的主要优势是某些类型的算法用递归实现可以比迭代实现更清晰、更简单。例如，快速排序算法很难用迭代的方式实现。此外，某些问题（特别是与 AI 相关的问题）似乎更适合递归解决方案。\n\
  \n在编写递归方法时，你必须在某处有一个条件语句（如 `if`），以强制方法在不执行递归调的情况下返回。如果你不这样做，一旦调用了该方法，它将永远不会返回。这种错误在开发递归方法时非常常见。要多使用\
  \ `WriteLine() ` 语句，以便你可以观察发生的情况，并在发现自己犯错时终止执行。\n\n# 理解静态 (static)\n\n有时你可能想要定义一个类成员，该成员可以独立于该类的任何对象而使用。通常，类成员必须通过其类的对象来访问，但也可以创建一个可以单独使用、而无需引用特定实例的成员。要创建这样的成员，在它的声明之前加上\
  \ `static` 关键字。当成员被声明为 `static` 时，可以在该类的任何对象创建之前访问它，且无需引用任何对象。你可以将方法和变量都声明为 `static`。`static`成员最常见的例子是\
  \ `Main()`，它被声明为 `static` 是因为它在你的程序启动时必须由操作系统调用。\n\n在类外部，要使用 `static` 成员，你必须指定其类名后跟点运算符。不需要创建对象。事实上，`static`\
  \ 成员无法通过对象引用访问。它必须通过其类名访问。例如，如果你想给名为 `Timer` 类中名为 `count` 的 `static` 变量赋值 10，请使用此行代码：\n\
  \n```\nTimer.count = 10;\n```\n\n这种格式类似于通过对象访问普通实例变量的格式，区别在于使用了类名。`static` 方法可以以相同的方式调用——通过对类名使用点运算符。\n\
  \n声明为 `static` 的变量本质上是全局变量。当声明该类的对象时，不会创建 `static` 变量的副本。相反，该类的所有实例共享同一个 `static`\
  \ 变量。`static` 变量在其类使用之前就会初始化。如果没有指定显式初始化器，它对于数值类型初始化为零，对于引用类型初始化为 `null`，对于 `bool`\
  \ 类型的变量初始化为 `false`。因此，`static` 变量始终有一个值。\n\n`static` 方法与普通方法的区别在于，`static` 方法可以通过其类名调用，而无需创建该类的任何实例。你已经见过这个的例子了：`Sqrt()\
  \ ` 方法，它是 C# `System.Math` 类中的一个 `static` 方法。\n\n这是一个声明了 `static` 变量和 `static` 方法的示例：\n\
  \n```csharp\n// 使用 static。\n\nusing System;\n\nclass StaticDemo {\n  // 一个静态变量。\n\
  \  public static int Val = 100;\n\n  // 一个静态方法。\n  public static int ValDiv2() {\n\
  \    return Val/2;\n  }\n}\n\nclass SDemo {\n  static void Main() {\n    Console.WriteLine(\"\
  Initial value of StaticDemo.Val is \"\n                      + StaticDemo.Val);\n\
  \    StaticDemo.Val = 8;\n    Console.WriteLine(\"StaticDemo.Val is \" + StaticDemo.Val);\n\
  \    Console.WriteLine(\"StaticDemo.ValDiv2(): \" +\n                      StaticDemo.ValDiv2());\n\
  \  }\n}\n```\n\n输出是：\n```\nInitial value of StaticDemo.Val is 100\nStaticDemo.Val\
  \ is 8\nStaticDemo.ValDiv2(): 4\n```\n\n`static` 方法与普通方法的区别在于，`static` 方法可以通过其类名调用，而无需创建该类的任何实例。你已经见过这个的例子了：`Sqrt()\
  \ ` 方法，它是 C# `System.Math` 类中的一个 `static` 方法。\n\n`static` 方法有以下几项限制：\n- `static`\
  \ 方法没有 `this` 引用。因此，`static` 方法只能调用其类中的其他 `static` 方法。\n- 类似的限制也适用于数据；`static` 方法无法访问实例变量，因为没有对象。例如，在下面的类中，`static`\
  \ 方法 `Val()` 是非法的：\n\n```csharp\nclass Error {\n  int Denom = 3; // 实例变量\n  static\
  \ int Val = 10; // 静态变量\n\n  static int Val() {\n    return Denom; // 错误！Denom 是实例变量\n\
  \  }\n}\n```\n\n然而，`static` 方法可以访问 `static` 变量，因为它于任何对象：\n\n```csharp\nclass NotError\
  \ {\n  int Denom = 3; // 实例变量\n  static int Val = 10; // 静态变量\n\n  static int Val()\
  \ {\n    return Val; // 正确！Val 是静态变量\n  }\n}\n```\n\n在这种情况下，尝试从 `static` 方法调用非静态（即实例）方法会导致编译时错误：\n\
  \n```csharp\nclass AnotherError {\n  void NonStaticMeth() {\n    Console.WriteLine(\"\
  Inside NonStaticMeth().\");\n  }\n\n  static void staticMeth() {\n    NonStaticMeth();\
  \ // 错误\n  }\n}\n```\n\n重要的是要理解，`static` 方法如果通过该类的对象进行操作，则*可以*调用该类的实例方法并访问实例变量。只是它不能在没有对象限定的情况下使用实例变量或方法。例如，这段片段是完全有效的：\n\
  \n```csharp\nclass MyClass {\n  void NonStaticMeth() {\n    Console.WriteLine(\"\
  Inside NonStaticMeth().\");\n  }\n\n  public static void staticMeth(MyClass ob)\
  \ {\n    ob.NonStaticMeth(); // 这是正确的\n  }\n}\n```\n\n在这里，`NonStaticMeth()` 是通过\
  \ `ob` 被 `staticMeth()` 用的，`ob` 是 `MyClass` 的对象。\n\n由于 `static` 字段独立于特定对象，当你需要维护适用于整个类的信息时，它们是非常用的。这里是这种情况的一个示例。它使用一个\
  \ `static` 字段来维护现有对象的计数。\n\n```csharp\n// 使用静态字段计算实例。\n\nusing System;\n\nclass\
  \ CountInst {\n  static int count = 0;\n\n  // 在创建对象时增加计数。\n  public CountInst()\
  \ {\n    count++;\n  }\n}\n```\n\n\n\n\n```csharp\npublic CountInst() {\n    count++;\n\
  \  }\n\n  // 对象销毁时递减计数。\n  ~CountInst() {\n    count--;\n  }\n\n  public static\
  \ int GetCount() {\n    return count;\n  }\n}\n\nclass CountDemo {\n  static void\
  \ Main() {\n    CountInst ob;\n    for(int i=0; i < 10; i++) {\n      ob = new CountInst();\n\
  \      Console.WriteLine(\"Current count: \" + CountInst.GetCount());\n    }\n \
  \ }\n}\n```\n\n输出如下：\n\n```\nCurrent count: 1\nCurrent count: 2\nCurrent count:\
  \ 3\nCurrent count: 4\nCurrent count: 5\nCurrent count: 6\nCurrent count: 7\nCurrent\
  \ count: 8\nCurrent count: 9\nCurrent count: 10\n```\n\n每当创建一个 `CountInst` 类型的对象时，`static`\
  \ 字段 `count` 就会增加。每当回收一个对象时，`count` 就会减小。因此，`count` 始终包含当前存在的对象的数量。这只能通过使用 `static`\
  \ 字段实现。实例变量无法维护计数，因为计数与整个类有关，而不是特定的实例。\n\n这里是另一个使用 `static` 的示例。在本章前面，你已经看到如何使用类工厂来创建对象。在那个示例中，类工厂是一个非\
  \ `static` 方法，这意味着它只能通过对象引用来调用。这意味着需要创建一个该类的默认对象，以便调用工厂方法。然而，实现类工厂的更好方法是使用 `static`\
  \ 方法，这允许在不创建不必要的对象的情况下调用类工厂。以下是反映此改进的重写类工厂示例：\n\n```csharp\n// 使用静态类工厂。\nusing System;\n\
  \nclass MyClass {\n  int a, b;\n  //为 MyClass 创建类工厂。\n  static public MyClass Factory(int\
  \ i, int j) {\n    MyClass t = new MyClass();\n    t.a = i;\n    t.b = j;\n    return\
  \ t; // 返回一个对象\n  }\n  public void Show() {\n    Console.WriteLine(\"a and b: \"\
  \ + a + \" \" + b);\n  }\n}\n\nclass MakeObjects {\n  static void Main() {\n   \
  \ int i, j;\n    // 使用工厂生成对象。\n    for(i=0, j=10; i < 10; i++, j--) {\n      MyClass\
  \ ob = MyClass.Factory(i, j); // 获取一个对象\n      ob.Show();\n    }\n    Console.WriteLine();\n\
  \  }\n}\n```\n\n在这个版本中，`Factory()` 在这行代码中是通过其类名调用的：\n\n```csharp\nMyClass ob = MyClass.Factory(i,\
  \ j); // 获取一个对象\n```\n\n在使用工厂之前不需要创建 `MyClass` 对象。\n\n### 静态构造函数\n\n构造函数也可以指定为 `static`。`static`\
  \ 构造函数通常用于初始化适用于类而非实例的特征。因此，它被用于在创建该类的任何对象之前初始化类的方面。这里是一个简单的示例：\n\n```csharp\n//\
  \ 使用静态构造函数。\nusing System;\n\nclass Cons {\n  public static int alpha;\n  public\
  \ int beta;\n  // 静态构造函数。\n  static Cons() {\n    alpha = 99;\n    Console.WriteLine(\"\
  Inside static constructor.\");\n  }\n  // 实例构造函数。\n  public Cons() {\n    beta =\
  \ 100;\n    Console.WriteLine(\"Inside instance constructor.\");\n  }\n}\n\nclass\
  \ ConsDemo {\n  static void Main() {\n    Cons ob = new Cons();\n    Console.WriteLine(\"\
  Cons.alpha: \" + Cons.alpha);\n    Console.WriteLine(\"ob.beta: \" + ob.beta);\n\
  \  }\n}\n```\n\n输出如下：\n```\nInside static constructor.\nInside instance constructor.\n\
  Cons.alpha: 99\nob.beta: 100\n```\n\n注意，`static` 构造函数在实例构造函数之前自动调用（当类第一次被加载时）。这可以推广。在所有情况下，`static`\
  \ 构造函数都会任何实例之前执行。此外，`static` 构造函数不能有访问修符（因此它们使用默认值），并且不能由你的程序调用。\n\n### 静态类\n\n\
  类可以声明为 `static`。`static` 类有两个特征。第一，不能创建 `static` 类的对象。第二，`static` 类必须只包含 `static`\
  \ 成员。通过修改类声明并使用 `static` 关键字可以创建 `static` 类，所示：\n\n```csharp\nstatic class name\
  \ // ...\n```\n\n在类内部，所有成员必须显式指定为 `static`。将类设为 `static` 不会自动使其成员也变为 `static`。`static`\
  \ 类有两个主要用途。第一，在创建扩展方法时需要 `static` 类。扩展方法主要与 LINQ 相关，扩展方法的讨论可以在第 19 章找到。第二，`static`\
  \ 类用于包含一组 `static` 方法。此种用途在这里演示。下面的示例使用一个名为 `NumericFn` 的 `static` 类来存储一组对数值操作的\
  \ `static` 方法。由于 `NumericFn` 的所有成员都是 `static` 的，该类也可以声明为 `static`，这防止了它被实例化。因此，`NumericFn`\
  \ 起到了逻辑上组织方法的作用。\n\n\n\n```csharp\n// 演示静态类。\nusing System;\n\nstatic class NumericFn\
  \ {\n  // 返回数值的倒数。\n  static double Reciprocal(double num) { // 返回数值的倒数。\n    return\
  \ 1/num;\n  }\n  // 返回数值的小数部分。\n  static double FracPart(double num) { // 返回数值的小数部分。\n\
  \    return num - (int)num;\n  }\n  // 如果 num 为偶数。\n  static bool IsEven(double\
  \ num) { // 如果 num 为偶数。\n    return (num % 2) == 0;\n  }\n  // 如果 num 为奇数。\n  static\
  \ bool IsOdd(double num) { // 如果 num 为奇数。\n    return !IsEven(num);\n  }\n}\n\n\
  class StaticClassDemo {\n  static void Main() {\n    Console.WriteLine(\"Reciprocal\
  \ of 5 is \" + NumericFn.Reciprocal(5.0));\n    Console.WriteLine(\"Fractional part\
  \ of 4.234 is \" + NumericFn.FracPart(4.234));\n    if(NumericFn.IsEven(10)) {\n\
  \      Console.WriteLine(\"10 is even.\");\n    }\n    if(NumericFn.IsOdd(5)) {\n\
  \      Console.WriteLine(\"5 is odd.\");\n    }\n    // 下面的尝试创建 NumericFn 的实例\n\
  \    // 将错误。\n    // NumericFn ob = new NumericFn(); // 错误！\n  }\n}\n```\n\n该程序的输出如下：\n\
  ```\nReciprocal of 5 is 0.2\nFractional part of 4.234 is 0.234\n10 is even.\n5 is\
  \ odd.\n```\n\n注意程序中的最后一行被注释掉了。因为 `NumericFn` 是一个 `static` 类，任何创建对象的尝试都会导致错误。尝试给\
  \ `NumericFn` 提供非 `static` 成员也将是一个错误。\n\n### 第 9 章：运算符重载\n\nC# 允许你相对于你创建的类定义运算符的含义。这一过程被称为*运算符重载*。通过重载运算符，你将它的用法扩展到你的类中。运算符的效果完全在你的控制之下，并且根据不同的类而异。例如，一个定义链表的类可能会使用\
  \ `+` 运算符将对象添加到列表中。实现栈的类可能会使用 `+` 将对象推入栈中。另一个类可能会以完全不同的方式使用 `+` 运算符。\n\n当运算符被重载时，它的原始含义并没有丢失。它只是相对于特定类添加了一个新操作。因此，例如重载\
  \ `+` 来处理链表，并不会改变其相对于整数（即加法）的含义。\n\n\n\n\n运算符重载的一个主要优势是它允许你无缝地将新类类型集成到你的编程环境中。这种`类型可扩展性`是\
  \ `C#` 这种面向对象语言强大性的重要部分。一旦为类定义了运算符，你就可以使用标准的 C# 表达式语法对该类的对象进行操作。你甚至可以在涉及其他数据类型的表达式中使用该对象。运算符重载是\
  \ `C#` 最强大的特性之一。\n\n## 运算符重载基础\n\n运算符重载与方法重载密切相关。要重载一个运算符，请使用 `operator` 关键字来定义一个\
  \ `operator method`（运算符方法），该方法定义了运算符相对于其类的操作。\n\n`operator` 方法有两种形式：一种用于一元运算符，另一种用于二运算符。每种形式的通用形式所示：\n\
  \n```csharp\n// 重载一元运算符的通用形式\npublic static ret-type operator op(param-type operand)\n\
  {\n  // operations\n}\n\n// 重载二运算符的通用形式\npublic static ret-type operator op(param-type1\
  \ operand1, param-type1 operand2)\n{\n  // operations\n}\n```\n\n在这里，你正在重载的运算符（例如\
  \ `+` 或 `-`）被替换为 `op`。`ret-type` 指定了指定操作返回的值类型。虽然它可以是你选择的任何类型，但返回值通常与被重载运算符的类具有相同的类型。这种相关性便于在表达式中使用重载的运算符。对于一元运算符，操作数通过\
  \ `operand` 传入。对于二运算符，操作数通过 `operand1` 和 `operand2` 传入。注意，`operator` 方法必须同时是 `public`\
  \ 且 `static` 的。\n\n对于一元运算符，操作数的类型必须与定义运算符的类类型相同。对于二运算符，操作数中至少有一个必须与该类类型相同。因此，你不能为尚未创建的对象重载任何\
  \ C# 运算符。例如，你不能为 `int` 或 `string` 重新定义 `+`。\n\n另一点：运算符参数不能使用 `ref` 或 `out` 修饰符。\n\
  \n## 重载二运算符\n\n为了了解运算符重载是如何工作的，让我们从一个重载了两个二运算符（`+` 和 `-`）的示例开始。以下程序创建了一个名为 `ThreeD`\
  \ 的类，它维护对象在三维空间中的坐标。重载的 `+` 将一个 `ThreeD` 对象的各个坐标加到另一个对象上。重载的 `-` 将一个对象的坐标减去另一个对象的坐标。\n\
  \n```csharp\n// 运算符重载的示例。\nusing System;\n\n// 三维坐标类。\nclass ThreeD {\n  int x,\
  \ y, z; // 3-D 坐标\n  public ThreeD() { x = y = z = 0; }\n  public ThreeD(int i,\
  \ int j, int k) { x = i; y = j; z = k; }\n\n  // 重载二+.\n  public static ThreeD operator\
  \ +(ThreeD op1, ThreeD op2)\n  {\n    ThreeD result = new ThreeD();\n    /* 将两个点的坐标相加\n\
  \       并返回结果。 */\n    result.x = op1.x + op2.x; // 这些是整数加法\n    result.y = op1.y\
  \ + op2.y; //  + 保留了其原始\n    result.z = op1.z + op2.z; // 相对于它们而言。\n    return result;\n\
  \  }\n\n  // 重载二-.\n  public static ThreeD operator -(ThreeD op1, ThreeD op2)\n\
  \  {\n    ThreeD result = new ThreeD();\n    /* 注意操作数的顺序。op1 是左\n       操作数，op2\
  \ 是右操作。 */\n    result.x = op1.x - op2.x; // 这些是整数减法\n    result.y = op1.y - op2.y;\n\
  \    result.z = op1.z - op2.z;\n    return result;\n  }\n  // 显示 X, Y, Z 坐标。\n \
  \ public void Show() {\n    Console.WriteLine(x + \", \" + y + \", \" + z);\n  }\n\
  }\n\nclass ThreeDemo {\n  static void Main() {\n    ThreeD a = new ThreeD(1, 2,\
  \ 3);\n    ThreeD b = new ThreeD(10, 10, 10);\n    ThreeD c;\n    Console.Write(\"\
  Here is a: \");\n    a.Show();\n    Console.WriteLine();\n    Console.Write(\"Here\
  \ is b: \");\n    b.Show();\n    Console.WriteLine();\n    c = a + b; // 将 a 和 b\
  \ 相加\n    Console.Write(\"Result of a + b: \");\n    c.Show();\n    Console.WriteLine();\n\
  \    c = a + b + c; // 将 a, b, 和 c 相加\n    Console.Write(\"Result of a + b + c:\
  \ \");\n    c.Show();\n    Console.WriteLine();\n    c = c - a; // 减去 a\n    Console.Write(\"\
  Result of c - a: \");\n    c.Show();\n    Console.WriteLine();\n    c = c - b; //\
  \ 减去 b\n    Console.Write(\"Result of c - b: \");\n    c.Show();\n    Console.WriteLine();\n\
  \  }\n}\n```\n\n该程序产生以下输出：\n```\nHere is a: 1, 2, 3\nHere is b: 10, 10, 10\nResult\
  \ of a + b: 11, 12, 13\nResult of a + b + c: 22, 24, 26\nResult of c - a: 21, 22,\
  \ 23\nResult of c - b: 11, 12, 13\n```\n\n\n\n在 C# 中，重载 `++` 和 `--` 非常简单；只需返回递增或递减后的值，而不要更改调用的对象即可。C#\
  \ 会自动为你处理这些操作，并考虑前缀形式和后缀形式之间的区别。例如，这里是 `ThreeD` 类的一个 `operator++( )` 方法：\n\n```csharp\n\
  // 重载一元运算符 //.\npublic static ThreeD operator ++(ThreeD op)\n{\n  ThreeD result\
  \ = new ThreeD();\n  // 返回递增后的结果。\n  result.x = op.x + 1;\n  result.y = op.y + 1;\n\
  \  result.z = op.z + 1;\n  return result;\n}\n```\n\n以下是上述示例程序的扩展版本，它演示了一元运算符 `--`\
  \ 和 `++` 运算符：\n\n```csharp\n// 更多的运算符重载。\nusing System;\n\n// 一个三维坐标类。\nclass ThreeD\
  \ {\n  int x, y, z; // 3D 坐标\n  public ThreeD() { x = y = z = 0; }\n  public ThreeD(int\
  \ i, int j, int k) { x = i; y = j; z = k; }\n\n  // 重载二元运算符 +。\n  public static\
  \ ThreeD operator +(ThreeD op1, ThreeD op2)\n  {\n    ThreeD result = new ThreeD();\n\
  \    /* 这将两个点的坐标相加\n       并返回结果。 */\n    result.x = op1.x + op2.x;\n    result.y\
  \ = op1.y + op2.y;\n    result.z = op1.z + op2.z;\n    return result;\n  }\n\n \
  \ // 重载二元运算符 -。\n  public static ThreeD operator -(ThreeD op1, ThreeD op2)\n  {\n\
  \    ThreeD result = new ThreeD();\n     注意 注意操作数的顺序。op1 是左操作数\n       op2 是右操作数。\
  \ */\n    result.x = op1.x - op2.x;\n    result.y = op1.y - op2.y;\n    result.z\
  \ = op1.z - op2.z;\n    return result;\n  }\n\n  // 重载一元运算符 -。\n  public static\
  \ ThreeD operator -(ThreeD op)\n  {\n    ThreeD result = new ThreeD();\n    result.x\
  \ = -op.x;\n    result.y = -op.y;\n    result.z = -op.z;\n    return result;\n \
  \ }\n\n  // 重载一元运算符 ++。\n  public static ThreeD operator ++(ThreeD op)\n  {\n  \
  \  ThreeD result = new ThreeD();\n    // 返回递增后的结果。\n    result.x = op.x + 1;\n \
  \   result.y = op.y + 1;\n    result.z = op.z + 1;\n    return result;\n  }\n\n\
  \  // 显示 X, Y, Z 坐标。\n  public void Show()\n  {\n    Console.WriteLine(x + \",\"\
  \ + y + \",\" + z);\n  }\n}\n\nclass ThreeDemo {\n  static void Main() {\n    ThreeD\
  \ a = new ThreeD(1, 2, 3);\n    ThreeD b = new ThreeD(10, 10, 10);\n    ThreeD c\
  \ = new ThreeD();\n    Console.Write(\"Here is a: \");\n    a.Show();\n    Console.WriteLine();\n\
  \    Console.Write(\"Here is b: \");\n    b.Show();\n    Console.WriteLine();\n\
  \    c = a + b; // 将 a 和 b 相加\n    Console.Write(\"Result of a + b: \");\n    c.Show();\n\
  \    Console.WriteLine();\n    c = a + b + c; // 将 a, b, 和 c 相加\n    Console.Write(\"\
  Result of a + b + c: \");\n    c.Show();\n    Console.WriteLine();\n    c = c -\
  \ a; // 减去 a\n    Console.Write(\"Result of c - a: \");\n    c.Show();\n    Console.WriteLine();\n\
  \    c = c - b; // 减去 b\n    Console.Write(\"Result of c - b: \");\n    c.Show();\n\
  \    Console.WriteLine();\n    c = -a; // 将 -a 赋值给 c\n    Console.Write(\"Result\
  \ of -a: \");\n    c.Show();\n    Console.WriteLine();\n    c = a++; // 后置增 a\n\
  \    Console.WriteLine(\"Given c = a++\");\n    Console.Write(\"c is: \");\n   \
  \ c.Show();\n    Console.Write(\"a is: \");\n    a.Show();\n    // 将 a 重置为 1, 2,\
  \ 3\n    a = new ThreeD(1, 2, 3);\n    Console.Write(\"\\nResetting a to \");\n\
  \    a.Show();\n    c = ++a; // 前置增 a\n    Console.WriteLine(\"\\nGiven c = ++a\"\
  );\n    Console.Write(\"c is: \");\n    c.Show();\n    Console.Write(\"a is: \"\
  );\n    a.Show();\n  }\n}\n```\n\n程序的输出如下：\n```\nHere is a: 1, 2, 3\nHere is b:\
  \ 10, 10, 10\nResult of a + b: 11, 12, 13\nResult of a + b + c: 22, 24, 26\nResult\
  \ of c - a: 21, 22, 23\nResult of c - b: 11, 12, 13\nResult of -a: -1, -2, -3\n\
  Given c = a++\nc is: 1, 2, 3\na is: 2, 3, 4\nResetting a to \n1, 2, 3\nGiven c =\
  \ ++a\nc is: 2, 3, 4\na is: 2, 3, 4\n```\n\n\n\n原因是整数参数是第二个参数，即右侧操作数，但前面的语句将整数参数放在了左侧。为了允许这两种形式的语句，你将再次重载\
  \ `+` 运算符。这个版本的第一个参数类型必须为 `int`，第二个参数类型必须为 `ThreeD`。`operator+()` 方法的一个版本用于处理 `ThreeD`\
  \ + 整数，另一个版本处理整数 + `ThreeD`。通过这种方式重载 `+`（或任何其他二元运算符），允许内置类型出现在运算符的左侧或右侧。以下是按描述重载了\
  \ `+` 运算符的 `ThreeD` 版本：\n\n```cs\n// 为 ThreeD + ThreeD, ThreeD + int 和 int + ThreeD\
  \ 重载 + 运算符。\n\nusing System;\n\n// 一个三维坐标类。\nclass ThreeD {\n  int x, y, z; // 3-D\
  \ 坐标\n  public ThreeD() { x = y = z = 0; }\n  public ThreeD(int i, int j, int k)\
  \ { x = i; y = j; z = k; }\n\n  // 为 ThreeD + ThreeD 重载二元运算符 +。\n  public static\
  \ ThreeD operator +(ThreeD op1, ThreeD op2) {\n    ThreeD result = new ThreeD();\n\
  \    /* 这将两个点的坐标相加\n       并返回结果。 */\n    result.x = op1.x + op2.x;\n    result.y\
  \ = op1.y + op2.y;\n    result.z = op1.z + op2.z;\n    return result;\n  }\n\n \
  \ // 为 ThreeD + int 重载二元运算符 +。\n  public static ThreeD operator +(ThreeD op1, int\
  \ op2) {\n    ThreeD result = new ThreeD();\n    result.x = op1.x + op2;\n    result.y\
  \ = op1.y + op2;\n    result.z = op1.z + op2;\n    return result;\n  }\n\n  // 为\
  \ int + ThreeD 重载二元运算符 +。\n  public static ThreeD operator +(int op1, ThreeD op2)\
  \ {\n    ThreeD result = new ThreeD();\n    result.x = op2.x + op1;\n    result.y\
  \ = op2.y + op1;\n    result.z = op2.z + op1;\n    return result;\n  }\n\n  // 显示\
  \ X, Y, Z 坐标。\n  public void Show() {\n    Console.WriteLine(x + \", \" + y + \"\
  , \" + z);\n  }\n}\n\nclass ThreeDDemo {\n  static void Main() {\n    ThreeD a =\
  \ new ThreeD(1, 2, 3);\n    ThreeD b = new ThreeD(10, 10, 10);\n    ThreeD c = new\
  \ ThreeD();\n    Console.Write(\"Here is a: \");\n    a.Show();\n    Console.WriteLine();\n\
  \    Console.Write(\"Here is b: \");\n    b.Show();\n    Console.WriteLine();\n\
  \    c = a + b; // ThreeD + ThreeD\n    Console.Write(\"Result of a + b: \");\n\
  \    c.Show();\n    Console.WriteLine();\n    c = b + 10; // ThreeD + int\n    Console.Write(\"\
  Result of b + 10: \");\n    c.Show();\n    Console.WriteLine();\n    c = 15 + b;\
  \ // int + ThreeD\n    Console.Write(\"Result of 15 + b: \");\n    c.Show();\n \
  \ }\n}\n```\n\n该程序的输出如下：\nHere is a: 1, 2, 3\nHere is b: 10, 10, 10\nResult of a\
  \ + b: 11, 12, 13\nResult of b + 10: 20, 20, 20\nResult of 15 + b: 25, 25, 25\n\n\
  #### 重载关系运算符\n\n关系运算符（如 `==` 或 `<`）也可以被重载，且过程非常直观。通常，重载后的关系运算符返回一个 `true` 或 `false`\
  \ 值。这符合这些运算符的正常用法，并允许将重载关系运算符用于条件表达式中。如果你返回不同的类型，将极大地限制运算符的实用性。\n\n这是一个 `ThreeD`\
