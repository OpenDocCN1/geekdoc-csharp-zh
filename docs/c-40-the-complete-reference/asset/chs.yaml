  \    Console.Write(\"Here is b: \");\n    b.Show();\n    Console.Write(\"Here is\
  \ c: \");\n    c.Show();\n    Console.WriteLine();\n    if(!a) Console.WriteLine(\"\
  a is false.\");\n    if(!b) Console.WriteLine(\"b is false.\");\n    if(!c) Console.WriteLine(\"\
  c is false.\");\n    Console.WriteLine();\n    if(a & b) Console.WriteLine(\"a &\
  \ b is true.\");\n    else Console.WriteLine(\"a & b is false.\");\n    if(a & c)\
  \ Console.WriteLine(\"a & c is true.\");\n    else Console.WriteLine(\"a & c is\
  \ false.\");\n    if(a | b) Console.WriteLine(\"a | b is true.\");\n    else Console.WriteLine(\"\
  a | b is false.\");\n    if(a | c) Console.WriteLine(\"a | c is true.\");\n    else\
  \ Console.WriteLine(\"a | c is false.\");\n  }\n}\n```\n\n程序的输出是：\n```\nHere is\
