  \ backwards: E D C B A \nRemoving 2 elements.\nNumber of elements: 3\nContents after\
  \ deletion: B D \nContents after addition to end: B D X Y Z\n\n此程序中最需要注意的是，可以通过跟随由\
  \ `Next` 和 `Previous` 属性提供的链接来正向和反向遍历列表。双向链表的双向属性在数据库等应用中尤为重要，因为这些应用需要在列表中两个方向上移动。\n\
  \n### Dictionary<TKey, TValue> 类\n\n`Dictionary<TKey, TValue>` 类存储键/值对。在字典中，通过其键访问值。在这方面，它与非泛型的\
