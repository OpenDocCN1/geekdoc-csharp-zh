  \ `if` 语句和 `for` 循环的翻译：**\n\n## for 循环\n\n你可以通过创建循环来重复执行一段代码。C# 提供了强大的循环结构。我们在这里查看的是\
  \ `for` 循环。与 `if` 语句一样，C# 的 `for` 循环与其在 C、C++ 和 Java 中的对应物相似。`for` 循环的最简单形式所示：\n\
  \n`for (initialization; condition; iteration) statement;`\n\n在最常见的形式中，循环的 `initialization`\
  \ 部分为循环变量设置初始值。`condition` 是测试循环变量的布尔表达式。如果结果为真，循环继续迭代。如果为假，循环终止。`iteration` 表达式决定了每次迭代时如何更改循环变量。这是一个演示\
  \ `for` 循环的短程序：\n\n```csharp\n// 演示 for 循环。\nusing System;\n\nclass ForDemo {\n\
  \  static void Main() {\n    int count;\n    for (count = 0; count < 5; count =\
  \ count + 1) {\n      Console.WriteLine(\"This is count: \" + count);\n    }\n \
  \   Console.WriteLine(\"Done!\");\n  }\n}\n```\n\n该程序的输出所示：\n\n```\nThis is count:\
  \ 0\nThis is count: 1\nThis is count: 2\nThis is count: 3\nThis is count: 4\nDone!\n\
  ```\n\n在这个示例中，`count` 是循环控制变量。它在 `for` 的初始化部分被设置为零。在每次迭代（包括第一次）开始时，执行条件测试 `count\
  \ < 5`。如果该测试的结果为真，则执行 `WriteLine()` 语句。接下来，执行循环的迭代部分，将 `count` 加 1。\n\n\n\n\n原因是\
  \ C# 包含一个用于执行此操作的特殊递增运算符。该递增运算符为 `++`（即两个连续的加号）。递增运算符将其操作数加  1。通过使用递增运算符，前面的语句可以写成这样：\n\
  \n```\ncount++;\n```\n\n因此，前一个程序中的 `for` 循环通常会写成这样：\n\n```c\nfor(count = 0; count\
  \ < 5; count++)\n```\n\n你可能想尝试一下。正如你将看到的，循环的运行方式与之前完全相同。\n\nC# 还提供了一个递减运算符，指定为 `--`。该运算符将其操作数减\
  \  1。\n\n## 使用代码块\n\nC# 的另一个关键元素是`代码块`（code block）。代码块是语句的组合。这是通过将语句包含在左括号 `{` 和右括号\
  \ `}` 之间实现的。一旦创建了代码块，它就变成了一个逻辑单元，可以用任何可以使用单个语句的地方。例如，一个块可以作为 `if` 和 `for` 语句的目标。考虑这个\
  \ `if` 语句：\n\n```\nif(w < h) {\n  v = w * h;\n  w = 0;\n}\n```\n\n在这里，如果 `w` 小于\
  \ `h`，则块内的两个语句都将被执行。因此，块内的两个语句形成了一个逻辑单元，一个语句无法在另一个语句不执行的情况下执行。这里的关键点是，每当你需要逻辑上连接两个或多个语句时，都可以通过创建一个块来实现。代码块允许以更清晰、更高效的方式实现许多算法。\n\
  \n这是一个使用代码块防止除以零的程序：\n\n```c\n// 展示一个代码块。\nusing System;\nclass BlockDemo {\n  static\
  \ void Main() {\n    int i, j, d;\n    i = 5;\n    j = 10;\n    // 这个 if 的目标是一个代码块。\n\
  \    if(i != 0) {\n      Console.WriteLine(\"i does not equal zero\");\n      d\
  \ = j / i;\n      Console.WriteLine(\"j / i is \" + d);\n    }\n  }\n}\n```\n\n\
  该程序生成的输出所示：\n\n```\ni does not equal zero\nj / i is 2\n```\n\n在这种情况下，`if` 语句的目标是一个代码块，而不仅仅是单个语句。如果控制\
  \ `if` 的条件为真（在此例中如此），块内的三个语句将执行执行。尝试将 `i` 设置为零并观察结果。\n\n这里是另一个示例。它使用代码块计算从 1 到 10\
  \ 的数字的和和积。\n\n```c\n// 计算从 1 到 10 的数字的和和积。\nusing System;\nclass ProdSum {\n  static\
  \ void Main() {\n    int prod;\n    int sum;\n    int i;\n    sum = 0;\n    prod\
  \ = 1;\n    for(i=1; i <= 10; i++) {\n      sum = sum + i;\n      prod = prod *\
  \ i;\n    }\n    Console.WriteLine(\"Sum is \" + sum);\n    Console.WriteLine(\"\
  Product is \" + prod);\n  }\n}\n```\n\n输出所示：\n\n```\nSum is 55\nProduct is 3628800\n\
  ```\n\n在这里，块使得一个循环能够同时计算和和积。如果不使用块，则需要两个独立的 `for` 循环。\n\n最后一点：代码块不会引入任何运行时效率的降低。换句话说，`{`\
  \ 和 `}` 在程序执行期间不会消耗任何额外时间。事实上，由于代码块能够简化（并阐明）某些算法的编写，使用代码块通常会导致速度和效率的提高。\n\n## 分号、位置与缩进\n\
  \n在 C# 中，分号表示语句的结束。也就是说，每个单独的语句都必须以分号结尾。如你所知，块是一组被左、右括号包围的逻辑连接的语句。块不以分号结束。由于块是语句的组，因此用右括号来表示块的结束是有意义的。\n\
  \nC# 不将行尾识别为语句的结束——只有分号会终止语句。出于这个原因，你将语句放在一行的任何位置并不重要。例如，对于 C# 来说，\n\n```csharp\n\
  x = y;\ny = y + 1;\nConsole.WriteLine(x + y);\n```\n\n等同于\n\n```csharp\nx = y; y\
  \ = y + 1; Console.WriteLine(x + y);\n```\n\n此外，语句的单个元素也可以放在单独的行上。以这种方式折断长行通常用于提高程序的可读性。它还可以帮助防止长行自动换行。例如：\n\
  \n```csharp\nx = y +\ny = z +\nConsole.WriteLine(\"This is a long line of output\"\
  \n);\n```\n\n你可能在之前的示例中注意到某些语句经过了缩进。C# 是一种自由格式的语言，这意味着你将语句放置的相对位置并不重要。然而，多年来，已经形成了一种通用且被接受的缩进风格。本书遵循这种风格，也建议你也这样做。使用这种风格，在每个左括号后缩进一级，在每个右括号后向外回退一级。某些语句鼓励进行一些额外的缩进；这些将在稍后介绍。\n\
  \n## C# 关键字\n\n在基础上，计算机语言由其关键字定义，因为它们决定了语言的功能。C# 定义了两个类型的关键字：`保留关键字`（reserved）和`上下文关键字`（contextual）。保留关键字不能作为变量、类或方法的名字。它们只能作为关键字使用。“保留字”或“保留标识符”等术语也被使用。目前\
  \ C# 4.0 定义了 77 个保留关键字。它们见表 2-1。\n\nC# 4.0 定义了 18 个上下文关键字，它们在特定的上下文中具有特殊含义。在这些上下文中，它们充当关键字。在这些上下文之外，它们可以作为元素的名称，例如变量名。因此，技术上并不是保留的。但作为一般原则，你应该将上下文关键字视为保留并避免将其用于其他用途。将上下文关键字作为其他元素的名称可能会引起混淆，并被许多程序员认为是不良习惯。上下文关键字见表\
  \ 2-2。\n\n## 标识符\n\n在 C# 中，标识符是分配给方法、变量或其他用户定义项目的名称。标识符可以是一个或多个字符。标识符可以是字母或下划线开头。后续可以是字母、数字或下划线。下划线可以增强变量名的可读性，如\
  \ `line_count`。然而，包含两个连续下划线的标识符（如 `max__value`）是编译器保留的。大小写敏感，对于 C# 来说，`myvar` 和\
  \ `MyVar` 是不同的名称。以下是一些可标识符的示例：记住，标识符不能以数字开头。因此，例如 `12x` 是无效的。良好的编程规范要求你选择能够反映所命名项目含义或用法的标识符。\n\
  \n虽然你不能将任何 C# 保留关键字作为标识符，但 C# 允许你在关键字前面加一个 `@`，使其成为合法的标识符。例如，`@for` 是一个有效的标识符。在这种情况下，标识符实际上是\
  \ `for`，而 `@` 被忽略了。这是一个使用 `@` 标识符的程序：\n\n```c\n// 展示一个 @ 标识符。\nusing System;\nclass\
  \ IdTest {\n  static void Main() {\n    int @if; // 将 if 作为标识符\n    for(@if = 0;\
  \ @if < 10; @if++)\n      Console.WriteLine(\"@if is \" + @if);\n  }\n}\n```\n\n\
  \n\n\n此处显示的输出证明 `@if` 被正确解释为一个标识符：\n\n```\n@if is 0\n@if is 1\n@if is 2\n@if is\
  \ 3\n@if is 4\n@if is 5\n@if is 6\n@if is 7\n@if is 8\n@if is 9\n```\n\n坦率地说，除非出于特殊目的，否则不建议使用带有\
  \ `@` 限定的关键字作为标识符。此外，`@` 可以位于任何标识符之前，但这被认为是一种坏习惯。\n\n## .NET Framework 类库\n\n本章所示示例程序使用了两个内置方法：`WriteLine()`\
  \ 和 `Write()`。正如前面提到的，这些方法是 `Console` 类的成员，该类属于 `System` 命名空间，而该命名空间是由 .NET Framework\
  \ 类库定义的。正如在本章前面的部分解释的，C# 环境依赖 .NET Framework 类库来为 I/O、字符串处理、网络和 GUI 等功能提供支持。因此，C#\
  \ 环境整体是 C# 语言本身加上 .NET 标准类的结合。正如你将看到的，类库提供了许多任何 C# 程序中都包含的功能。事实上，成为 C# 程序员的一部分部分就是学习使用这些标准类。在整个第一部分中，描述了\
  \ .NET 库类和方法的各种元素。第二部分详细检查了 .NET 库的部分。\n\n## 第 3 章：数据类型、字面量和变量\n\n本章研究了 C# 的三个基本元素：数据类型、字面量和变量。通常，语言提供的数据类型决定了语言可以解决的问题类型。正如你预期的，C#\
  \ 提供了丰富的内置数据类型，这使得 C# 适用于广泛的应用。你可以创建任何这些类型的变量，并为每种类型指定常量，这些在 C# 语言中被称为*字面量*（literals）。\n\
  \n### 为什么数据类型很重要\n\n数据类型在 C# 中特别重要，因为它是一种强类型语言。这意味着根据一般规则，所有操作都由编译器进行类型兼容性检查。非法操作将无法通过编译。因此，强类型检查有助于防止错误并增强可靠性。为了实现强类型检查，所有变量、表达式和值都有类型。例如，不存在“无类型”变量的概念。此外，值的类型决定了允许对其执行哪些操作。在一种类型上允许的操作在另一种类型上可能是不允许的。\n\
  \n> **注意** C# 4.0 了一种名为 `dynamic` 的新数据类型，它导致类型检查延迟到运行时，而不是在编译时发生。因此，`dynamic` 类型是\
  \ C# 正常编译时类型检查的例外。`dynamic` 类型将在第 17 章中讨论。\n\n### C# 的类型\n\nC# 包含两类内置数据类型：*值类型*（value\
  \ types）和*引用类型*（reference types）。两种类型的区别在于变量包含的内容。对于值类型，变量持有实际值，例如 3.1416 或 212。对于引用类型，变量持有指向该值的引用。最常用的引用类型是类，关于类和引用类型的讨论推迟到书的后部分。这里描述了值类型。\n\
  \nC# 的核心是表 3-1 所示的 13 种值类型。它们统称为*简单类型*（simple types）。它们之所以被称为简单类型是因为它们由单个值组成。（换句话说，它们不是两个或多个值的组合。）它们构成了\
  \ C# 类型系统的基础，提供了程序运行的基础性、低级数据元素。简单类型有时也被称为*原始类型*（primitive types）。\n\n![Image](img/t0038-01.jpg)\n\
  \n**表 3-1** C# 值类型\n\nC# 严格规定了每种值类型的范围和行为。由于可移植性的要求，C# 在这方面是不妥协的。例如，`int` 在所有执行环境中都是相同的。不需要为了适应特定平台而重写代码。虽然严格规定值类型的大小可能会在某些环境中导致轻微的性能损失，但为了实现可移植性，这是必要的。\n\
  \n> **注意** 除了简单类型外，C# 还定义了另外三类值类型。这些是枚举、结构体和可空类型，它们都将在书的后半部分进行了描述。\n\n### 整数\n\n\
  C# 定义了九种整数类型：`char`、`byte`、`sbyte`、`short`、`ushort`、`int`、`uint`、`long` 和 `ulong`。然而，`char`\
  \ 类型主要用于表示字符，将在本章后面讨论。剩余的八种整数类型用于数值计算。它们的位宽和范围所示：\n\n![Image](img/t0038-02.jpg)\n\
  \n如表所示，C# 定义了各种整数类型的有符号和无符号版本。有符号整数和无符号整数的区别在于整数高位字的解释方式。如果指定了有符号整数，则 C# 编译器将整数的高位解释为符号。如果符号位为\
  \ 0，则该数为正；如果为 1，则该数为负。负数始终使用*补码*（two’s complement）表示。\n\n有符号整数对于许多算法都很，但它们的范围只有无符号亲戚的一半。例如，作为\
  \ `short`，最大值是 32,767；作为 `ushort`，最大值是 65,535。\n\n可能最常用的整数类型是 `int`。`int` 类型变量通常用于控制循环、索引数组以及通用数学计算。你需要一个范围大于\
  \ `int` 的整数时，你有许多选择。对于大的有符号值，使用 `long`。对于大的无符号值，使用 `ulong`。\n\n```csharp\n// 计算到太阳的距离。由于此值很大，程序使用\
  \ long 来存储它。\nusing System;\nclass Inches {\n    static void Main() {\n        long\
  \ inches;\n        long miles;\n        miles = 93000000; // 太阳的 93,000,000 英里\n\
  \        // 每英里有 5280 英尺，每英尺有 12 英寸。\n        inches = miles * 5280 * 12;\n    \
  \    Console.WriteLine(\"Distance to the sun: \" + inches + \" inches.\");\n   \
  \ }\n}\n```\n\n这是程序的输出：\n```\n589248000000 inches\n```\n\n显然，结果无法存储在 `int` 或 `uint`\
  \ 变量中。\n\n最小的整数类型是 `byte` 和 `sbyte`。`byte` 类型是 0 到 255 之间的无符号值。`byte` 类型在处理原始二进制数据（例如某些设备产生的字节流）时特别有用。对于小的有符号整数，使用\
  \ `sbyte`。这里有一个使用 `byte` 类型变量控制 `for` 循环以产生数字 100 之和的示例。\n\n```csharp\n// 使用 byte。\n\
  using System;\nclass Use_byte {\n    static void Main() {\n        byte x;\n   \
  \     int sum;\n        sum = 0;\n        for(x = 1; x <= 100; x++)\n          \
  \  sum = sum + x;\n        Console.WriteLine(\"Summation of 100 is \" + sum);\n\
  \    }\n}\n```\n\n程序的输出是：\n```\nSummation of 100 is 5050\n```\n\n\n\n\n由于 `for`\
  \ 循环仅从 0 运行到 100，这完全在 `byte` 的范围内，因此没有需要使用更大类型的变量来控制它。\n\n当你需要一个比 `byte` 或 `sbyte`\
  \ 大但比 `int` 或 `uint` 小的整数时，请使用 `short` 或 `ushort`。\n\n### 浮点类型\n\n浮点类型可以表示带有小数部分的数字。浮点类型有两种：`float`\
  \ 和 `double`，它们分别表示单精度和双精度数字。`float` 类型宽度为 32 位，近似范围为 1.5E–45 到 3.4E+38。`double`\
  \ 类型宽度为 64 位，近似范围为 5E–324 到 1.7E+308。\n\n在这两种类型中，`double` 是最常用的。其中一个原因是，C# 类库（即\
  \ .NET Framework 库）中的许多数学函数都使用 `double` 值。例如，`Sqrt()` 方法（由库类 `System.Math` 定义）返回一个\
  \ `double` 值，该值是其 `double` 参数的平方根。在这里，`Sqrt()` 用于根据给定的圆面积计算圆半径：\n\n```csharp\n//\
  \ 给定面积计算圆的半径。\n\nusing System;\n\nclass FindRadius {\n  static void Main() {\n \
  \   Double r;\n    Double area;\n    area = 10.0;\n    r = Math.Sqrt(area / 3.1416);\n\
  \    Console.WriteLine(\"Radius is \" + r);\n  }\n}\n```\n\n程序的输出显示在此：\n\nRadius\
  \ is 1.78412203012729\n\n关于前述示例的另一点。如提到的，`Sqrt()` 是 `Math` 类的成员。注意 `Sqrt()` 是如何调用的；它的前面是名称\
  \ `Math`。这与 `Console` 位于 `WriteLine()` 的方式类似。虽然并不是所有的标准方法都是通过先指定类名来调用的，但有几个是这样的，正如下一个示例所示。\n\
  \n以下程序演示了 C# 的几个三角函数，这些函数也是 C# 数学库的一部分。它们也对 `double` 数据进行操作。该程序显示了从 0.1 到 1.0 的角度（以弧度测量）的正弦、余弦和正切。\n\
  \n```csharp\n// 演示 Math.Sin(), Math.Cos(), 和 Math.Tan().\n\nusing System;\n\nclass\
  \ Trigonometry {\n  static void Main() {\n    Double theta; // 弧度角\n    for(theta\
  \ = 0.1; theta <= 1.0; theta = theta + 0.1) {\n      Console.WriteLine(\"Sine of\
  \ \" + theta + \"  is \" +\n                          Math.Sin(theta));\n      Console.WriteLine(\"\
  Cosine of \" + theta + \"  is \" +\n                          Math.Cos(theta));\n\
  \      Console.WriteLine(\"Tangent of \" + theta + \"  is \" +\n               \
  \           Math.Tan(theta));\n      Console.WriteLine();\n    }\n  }\n}\n```\n\n\
  这里是程序的输出部分：\n\nSine of 0.1  is 0.0998334166468282\nCosine of 0.1  is 0.995004165278026\n\
  Tangent of 0.1  is 0.10033467208541\nSine of 0.2  is 0.19869330795061\nCosine of\
  \ 0.2  is 0.98006657784124\nTangent of 0.2  is 0.20271003550863\nSine of 0.3  is\
  \ 0.29552020666134\nCosine of 0.3  is 0.95533648125606\nTangent of 0.3  is 0.30933624960923\n\
  \n为了计算正弦、余弦和正切，使用了标准库方法 `Math.Sin()`、`Math.Cos()` 和 `Math.Tan()`。像 `Math.Sqrt()`\
  \ 一样，三角方法是通过 `double` 参数进行调用的，并返回一个 `double` 结果。角度必须以弧度指定。\n\n### decimal 类型\n\n\
  也许 C# 中最有趣的数值类型是 `decimal`，它旨在用于货币计算。`decimal` 类型利用 128 位来表示 1E–28 到 7.9E+28 范围内的值。如你所知，普通的浮点算术在应用于小数值时会产生各种舍入误差。`decimal`\
  \ 类型消除了这些误差，并可以精确表示多达 28 位小数（某些情况下为 29 位）。这种不产生舍入误差的情况下表示值的能力使其对于涉及金钱的计算特别有用。这是一个在财务计算中使用\
  \ `decimal` 类型的程序。该程序根据原价和折扣百分比计算折后的价格。\n\n```csharp\n// 使用 decimal 类型计算折扣。\nusing\
  \ System;\n\nclass UseDecimal {\n  static void Main() {\n    decimal price;\n  \
  \  decimal discount;\n    decimal discounted_price;\n    price = 100.0m;\n    discount\
  \ = 0.2m;\n    discounted_price = price * (1 - discount);\n    Console.WriteLine(\"\
  Discounted price is: \" + discounted_price);\n  }\n}\n```\n\n\n\n`bool` 类型表示真/假值。C#\
  \ 使用保留字 `true` 和 `false` 定义了 `true` 和 `false` 的值。因此，类型为 `bool` 的变量或表达式将是这两个值之一。此外，`bool`\
  \ 和整数值之间没有定义任何转换。例如，`1` 不会转换为 `true`，`0` 也不会转换为 `false`。\n\n下面是一个演示 `bool` 类型的程序：\n\
  \n```csharp\n// 演示 bool 值。\n\nusing System;\n\nclass BoolDemo {\n  static void Main()\
  \ {\n    bool b;\n    b = false;\n    Console.WriteLine(\"b is \" + b);\n    b =\
  \ true;\n    Console.WriteLine(\"b is \" + b);\n    // 一个 bool 值可以控制 if 语句。\n  \
  \  if(b) Console.WriteLine(\"This is executed.\");\n    b = false;\n    if(b) Console.WriteLine(\"\
  This is not executed.\");\n    // 关系运算符的结果是一个 bool 值。\n    Console.WriteLine(\"\
  10 > 9 is \" + (10 > 9));\n  }\n}\n```\n\n该程序生成的输出所示：\n\n```\nb is False\nb is True\n\
  This is executed.\n10 > 9 is True\n```\n\n关于这个程序有三个值得注意的点。首先，如你所见，当 `bool` 值由 `WriteLine()`\
  \ 输出时，会显示“True”或“False”。其次，`bool` 变量的值本身就足以控制 `if` 语句。不需要编写像这样的 `if` 语句：\n\n`if(b\
  \ == true) ...`\n\n第三，关系运算符（如 `<`）的结果是一个 `bool` 值。这就是为什么表达式 `10 > 9` 显示值“True”的原因。此外，`10\
  \ > 9` 外围的额外括号是必要的，因为 `+` 运算符的优先级高于 `>`。\n\n### 一些输出选项\n\n到目前为止，当使用 `WriteLine()`\
  \ 语句输出数据时，它是使用默认格式显示的。然而，.NET Framework 定义了一种复杂的格式化机制，可以让你对数据的显示方式进行详细控制。虽然本书的稍后部分会详细介绍格式化\
  \ I/O，但现在介绍一些格式选项是有用的。通过使用这些选项，你将能够指定值通过 `WriteLine()` 语句输出时的外观。这样做可以让你产生更具吸引力的输出。请记住，格式化机制支持的功能比这里描述的要得多。\n\
  \n在输出数据列表时，你一直在使用加号分隔列表的每个部分，如下所示：\n\n```csharp\nConsole.WriteLine(\"You ordered\
  \ \" + 2 + \" items at $\" + 3 + \" each.\");\n```\n\n虽然这种方式非常方便，但用这样输出数值信息并不能对该信息的出现方式进行任何控制。例如，对于浮点值，你无法控制显示的的小位数。考虑以下语句：\n\
  \n```csharp\nConsole.WriteLine(\"Here is 10/3: \" + 10.0/3.0);\n```\n\n它生成了如下输出：\n\
  \n```\nHere is 10/3: 3.33333333333333\n```\n\n虽然这对于某些目的可能是可以的，但显示这么多小数对于其他情况可能是不恰的。例如，在财务计算中，你通常希望显示两位小数。\n\
  \n为了控制数值数据的格式化，你需要使用 `WriteLine()` 的第二形式，如下所示，它允许你嵌入格式化信息：\n\n`WriteLine(\"*format\
  \ string*\", *arg0*, *arg1*, ..., *argN*)`\n\n在这个版本中，`WriteLine()` 的参数用逗号分隔，而不是用\
  \ `+` 号。`format string` 包含两个项目：按原样显示的普通打印字符和格式占位符。格式占位符采用这种通用形式：\n\n`{*argnum*,\
  \ *width*: *fmt*}`\n\n在这里，`argnum` 指定要显示的参数的编号（从 0 开始）。字段的最小宽度由 `width,` 指定，格式由\
  \ `fmt` 指定。`width` 和 `fmt` 是可选的。\n\n在执行期间，当在格式字符串中遇到格式占位符时，根据 `argnum,` 指定的相应参数将被替换并显示。因此，格式规范在格式字符串中的位置决定了其匹配数据将显示的位置。`width`\
  \ 和 `fmt` 都是可选的。因此，在最简单的形式下，格式占位符指示显示哪个参数。例如，`{0}` 表示 `arg0`，`{1}` 指定 `arg1`，依此类推。让我们从一个简单的示例开始。该语句\n\
  \n```csharp\nConsole.WriteLine(\"February has {0} or {1} days.\", 28, 29);\n```\n\
  \n产生以下输出：\n\n```\nFebruary has 28 or 29 days.\n```\n\n如你所示，值 28 被替换为 `{0}`，29 被替换为\
  \ `{1}`。因此，格式占位符标识了后续参数（在本例中为 28 和 29）在字符串中显示的位置。此外，注意额外的值是用逗号分隔的，而不是 `+` 号。这里是上述语句的变体，它指定了最小字段：\n\
  \n```csharp\nConsole.WriteLine(\"February has {0,10} or {1,5} days.\", 28, 29);\n\
  ```\n\n```\nFebruary has        28 or     29 days.\n```\n\n如你所见，值 28 被替换为 `{0}`，29\
  \ 被替换为 `{1}`。因此，格式占位符标识了后续参数（在本例中为 28 和 29）在字符串中显示的位置。此外，注意额外额外是用逗号分隔的，而不是 `+` 号\
  \ 号这里是上述语句的变体，它指定了最小字段：\n\n```csharp\nConsole.WriteLine(\"February has {0,10} or\
  \ {1,5} days.\", 28, 29);\n```\n\n```\nFebruary has        28 or     29 days.\n\
  ```\n\n如你所见，值 28 被替换为 `{0}`，29 被替换为 `{1}`。因此，格式占位符标识了后续参数（在本例中为 28 和 29）在字符串中显示的位置。此外，注意额外的值是用逗号分隔的，而不是\
  \ `+` 号。\n\n（抱歉，在之前的翻译过程中出现了部分文本重复和逻辑错误，我已为您重新整理并生成了完整且符合格式的译文：）\n\n[content]\n\
  `bool` 类型表示真/假值。C# 使用保留字 `true` 和 `false` 定义了 `true` 和 `false` 的值。因此，类型为 `bool`\
