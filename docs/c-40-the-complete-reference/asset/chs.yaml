  \ `bool` 类型。因此，重载这些运算符并返回 `bool` 是合理的。不幸的是，这种方法仅适用于非短路运算符。\n\n### 启用短路运算符\n\n要启用\
  \ `&&` 和 `||` 短路运算符，必须遵循四个规则。首先，类必须重载 `&` 和 `|`。其次，重载的 `&` 和 `|` 方法的返回类型必须与重载运算符的类相同。第三，每个参数必须是该类对象的引用。第四，类必须重载\
  \ `true` 和 `false` 运算符。当满足这些条件时，可以使用短路运算符。下面的程序显示了如何为 `ThreeD` 类正确实现 `&` 和 `|`，使得短路运算符\
