  关于相关的一点，程序集不必是一个 `exe` 文件。程序集也可以包含在使用 `dll` 扩展名的动态链接库（DLL）文件中。例如，如果你使用以下命令行来编译 `MyClasses.cs`：\n\
  \n```\ncsc /t:library MyClasses.cs\n```\n\n那么输出文件将是 `MyClasses.dll`。将代码放入 DLL 的一个优势是不需要\
  \ `Main() method` 方法。所有的 `exe` 文件都需要一个入口点（例如 `Main()`），它定义了执行的起始位置。这就是为什么 `Demo`\
  \ 类包含了一个占位符 `Main()` 方法。 DLL 则不需要这样的方法。如果你尝试将 `MyClass` 变成 DLL，你将需要像这里一样更改 `LoadFrom()`\
  \ 的调用：\n\n```csharp\nAssembly asm = Assembly.LoadFrom(\"MyClasses.dll\");\n```\n\
  \n### 全自动化的类型发现\n\n在我们离开反射（reflection）这个话题之前，最后一个示例将具有启发性。尽管之前的程序能够在不显式在程序中明确指定\
  \ `MyClass` 的情况下完全使用 `MyClass`，但它仍然依赖于对 `MyClass` 内容的先验知识。例如，程序知道其方法的名称，如 `Set`\
  \ 和 `Sum`。然而，使用反射可以利用一个你没有任何先验知识的类型。要做到这一点，你必须发现构造对象和生成方法调用所需的所有信息。这种方法对于视觉设计工具等将非常有用，因为它可以利用系统上的可用类型。\n\
  \n要查看如何实现类型的完全动态发现，请考虑以下示例，它加载了 `MyClasses.exe` 程序集，构造了一个 `MyClass` 对象，然后调用了 `MyClass`\
  \ 的所有方法，而这一切都在不假设任何先验知识的情况下：\n\n```csharp\n// 在不假设任何先验知识的情况下利用 MyClass。\n\nusing\
  \ System;\nusing System.Reflection;\n\nclass ReflectAssemblyDemo {\n  static void\
  \ Main() {\n    int val;\n    Assembly asm = Assembly.LoadFrom(\"MyClasses.exe\"\
  );\n    Type[] alltypes = asm.GetTypes();\n    Type t = alltypes[0]; // 使用找到的第一个类\n\
  \    Console.WriteLine(\"Using: \" + t.Name);\n    ConstructorInfo[] ci = t.GetConstructors();\n\
  \    // 使用找到的第一个构造函数。\n    ParameterInfo[] cpi = ci[0].GetParameters();\n    object\
  \ reflectOb;\n    if(cpi.Length > 0) {\n      object[] consargs = new object[cpi.Length];\n\
  \      // 初始化参数。\n      for(int n=0; n < cpi.Length; n++)\n        consargs[n] =\
  \ 10 + n * 20;\n      // 构造对象。\n      reflectOb = ci[0].Invoke(consargs);\n    }\
  \ else\n      reflectOb = ci[0].Invoke(null);\n    Console.WriteLine(\"\\nInvoking\
  \ methods on reflectOb.\");\n    Console.WriteLine();\n    // 忽略继承的方法。\n    MethodInfo[]\
  \ mi = t.GetMethods(BindingFlags.DeclaredOnly |\n                              \
  \    BindingFlags.Instance |\n                                  BindingFlags.Public)\
  \ ;\n    // 调用每个方法。\n    foreach(MethodInfo m in mi) {\n      Console.WriteLine(\"\
  Calling {0}\", m.Name);\n      // 获取参数。\n      ParameterInfo[] pi = m.GetParameters();\n\
  \      // 执行方法。\n      switch(pi.Length) {\n        case 0: // 无参数\n          if(m.ReturnType\
  \ == typeof(int)) {\n            val = (int)m.Invoke(reflect, null);\n         \
  \   Console.WriteLine(\"Result is \" + val);\n          }\n          else if(m.ReturnType\
  \ == typeof(void)) {\n            m.Invoke(reflectOb, null);\n          }\n    \
  \      break;\n        case 1: // 一个参数\n          if(pi[0].ParameterType == typeof(int))\
  \ {\n            object[] args = new object[1];\n            args[0] = 4;\n    \
  \        if((bool) m.Invoke(reflectOb, args))\n              Console.WriteLine(\"\
  14 is between x and y\");\n            else\n              Console.WriteLine(\"\
  14 is not between x and y\");\n          }\n          break;\n        case 2: //\
  \ 参数\n          if((pi[0].ParameterType == typeof(int)) &&\n              (pi[1].ParameterType\
  \ == typeof(int))) {\n            object[] args = new object[2];\n            args[0]\
  \ = 9;\n            args[1] = 18;\n            m.Invoke(reflectOb, args);\n    \
  \      }\n          else if((pi[0].ParameterType == typeof(double)) &&\n       \
  \       (pi[1].ParameterType == typeof(double))) {\n            // ... 处理 double\
  \ 的逻辑\n          }\n      }\n    }\n  }\n}\n```\n*（注：提供的源代码包含了一些变量不一致之处，例如 `reflect`\
  \ 与 `reflectOb` 以及缺失的逻辑块；我在应用要求的标识符格式规则的同时，保留了其结构和逻辑。）*\n\n\n\n接下来，声明了 `RemarkAttribute`，它继承自\
  \ `Attribute`。在 `RemarkAttribute` 内部有一个私有字段 `pri_remark`，它支持一个公共的只读属性：`Remark`。该属性持有将与特性关联的描述信息（`Remark`\
  \ 也可以被声明为具有私有 setset`访问器的自动实现属性，但为了说明目的，这里使用了只读属性）。它有一个公共构造函数，接受一个字符串参数并将其赋值给 `Remark`。\n\
  \n至此，不再需要其他步骤，`RemarkAttribute` 已经准备好可以使用了。\n\n## 附加特性\n\n一旦你定义了特性类，就可以将该特性附加到项上。特性位于其所附加的项之前，并通过在方括号内包含其构造函数来指定。例如，这里是让\
  \ `RemarkAttribute` 与一个类关联的方法：\n\n```csharp\n[RemarkAttribute(\"This class uses\
  \ an attribute.\")]\n\nclass UseAttrib {\n  // ...\n}\n```\n\n这构造了一个包含注释“This class\
  \ uses an attribute.”的 `RemarkAttribute`。然后该特性便与 `UseAttrib` 关联。\n\n在附加特性时，实际上没有必要指定\
  \ `Attribute` 后缀。例如，前述类可以这样声明：\n\n```csharp\n[Remark(\"This class uses an attribute.\"\
  )]\n\nclass UseAttrib {\n  // ...\n}\n```\n\n在这里，只使用了名称 `Remark`。虽然短格式是正确的，但在附加特性时，通常使用全名更安全，因为可以避免可能的混淆和歧义。\n\
  \n## 获取对象的特性\n\n一旦特性附加到项上，程序的其他部分就可以检索该特性。要检索特性，你通常会使用两种方法之一。第一个是 `GetCustomAttributes()`，它由\
  \ `MemberInfo` 定义并被 `Type` 继承。它检索附加到项上的所有特性列表。这是它的形式之一：\n\n```csharp\nobject[] GetCustomAttributes(bool\
  \ inherit)\n```\n\n如果 `inherit` 为 `true`，则将包含继承链中所有基类的特性。否则，只会找到为指定类型定义的特性。\n\n\
  第二种方法是 `GetCustomAttribute()`，它由 `Attribute` 定义。这里显示了它的形式之一：\n\n```csharp\nstatic\
  \ Attribute GetCustomAttribute(MemberInfo element, Type attributeType)\n```\n\n\
  在这里，`element` 是一个 `MemberInfo` 对象，描述了正在获取特性的项。所需的特性由 `attributeType` 指定。当你知道想要获取的特性名称时，就会使用这种方法，这通常很常见。例如，假设\
  \ `UseAttrib` 类具有 `RemarkAttribute`，为了获取 `RemarkAttribute` 的引用，你可以使用如下序列：\n\n```csharp\n\
  // 获取与具有 RemarkAttribute 的类关联的 MemberInfo 实例。\nType t = typeof(UseAttrib);\n\n//\
  \ 检索 RemarkAttribute。\nType tRemAtt = typeof(RemarkAttribute);\nRemarkAttribute\
  \ ra = (RemarkAttribute)\n    Attribute.GetCustomAttribute(t, tRemAtt);\n```\n\n\
  该序列之所以有效，是因为 `MemberInfo` 是 `Type` 的基类。因此，`t` 是一个 `MemberInfo` 实例。一旦你获得了特性的引用，就可以访问它的成员。这使得使用附加特性项的程序可以获取与特性相关的信息。例如，以下语句显示了\
  \ `Remark` 属性：\n\n```csharp\nConsole.WriteLine(ra.Remark);\n```\n\n以下程序整合了所有部分并演示了\
  \ `RemarkAttribute` 的用法：\n\n```csharp\n// 一个简单的特性示例。\nusing System;\nusing System.Reflection;\n\
  \n[AttributeUsage(AttributeTargets.All)]\npublic class RemarkAttribute : Attribute\
  \ {\n  string pri_remark; // underlies Remark property\n  public RemarkAttribute(string\
  \ comment) {\n    pri_remark = comment;\n  }\n  public string Remark {\n    get\
  \ {\n      return pri_remark;\n    }\n  }\n}\n\n[RemarkAttribute(\"This class uses\
  \ an attribute.\")]\nclass UseAttrib {\n  // ...\n}\n\nclass AttribDemo {\n  static\
  \ void Main() {\n    Type t = typeof(UseAttrib);\n    Console.Write(\"Attributes\
  \ in \" + t.Name + \": \");\n    object[] attrs = t.GetCustomAttributes(false);\n\
  \    foreach(object o in attrs) {\n      Console.WriteLine(o);\n    }\n    Console.Write(\"\
  Remark: \");\n    // 检索 RemarkAttribute。\n    Type tRemAtt = typeof(RemarkAttribute);\n\
  \    RemarkAttribute ra = (RemarkAttribute)\n        Attribute.GetCustomAttribute(t,\
  \ tRemAtt);\n    Console.WriteLine(ra.Remark);\n  }\n}\n```\n\n程序的输出在此：\nAttributes\
  \ in UseAttrib: RemarkAttribute\nRemark: This class uses an attribute.\n\n### 位置参数与命名参数\n\
  \n在前面的示例中，`RemarkAttribute` 是通过将描述字符串传递给构造函数来初始化的，使用了标准的构造函数语法。在这种情况下，`RemarkAttribute()`\
  \ 的 `comment` 参数被称为**位置参数**（positional parameter）。这个术语与参数通过其在参数列表中的位置链接到参数。因此，第一个参数传递给第一个参数，第二个参数传递给第二个参数，依此类推。\n\
  \n然而，对于特性，你还可以创建**命名参数**（named parameters），可以通过它们的名称来分配初始值。在这种情况下，重要的是参数的名称而不是它的位置。\n\
  \n***注意：虽然命名特性参数在概念上与方法中的命名参数相似，但具体有所不同。***\n\n命名参数由公共字段或属性支持，这些者必须是读写且非静态的。任何此类字段或属性都可以自动用作命名参数。命名参数通过调用构造函数时参数列表内的赋值语句赋予值。以下是包含命名参数的特性指定的通用形式：\n\
  \n`[attrib (positional-param-list, named-param1 = value, named-param2 = value, ...)]`\n\
  \n位置参数（如果存在）首先出现。接下来，每个命名参数都会被赋值。命名参数的顺序并不重要。命名参数不需要赋值。在这种情况下，将使用它们的默认值。\n\n为了理解如何使用命名参数，最好的方法是一个示例。这里是\
  \ `RemarkAttribute` 的版本，它添加了一个名为 `Supplement` 的字段，可用于存储补充注释：\n\n```csharp\n[AttributeUsage(AttributeTargets.All)]\n\
  public class RemarkAttribute : Attribute {\n  string pri_remark; // underlies Remark\
  \ property\n  // 这可以作为命名参数：\n  public string Supplement;\n  public RemarkAttribute(string\
  \ comment) {\n    pri_remark = comment;\n    Supplement = \"None\";\n  }\n  public\
  \ string Remark {\n    get {\n      return pri_remark;\n    }\n  }\n}\n```\n\n正如你所示，`Supplement`\
  \ 由构造函数初始化为字符串“None”。没有方法通过构造函数为它分配不同的初始值。但是，由于 `Supplement` 是 `RemarkAttribute`\
  \ 的公共字段，它可以像所示作为命名参数使用：\n\n```csharp\n[RemarkAttribute(\"This class uses an attribute.\"\
  ,\n      Supplement = \"This is additional info.\")]\n\nclass UseAttrib {\n  //\
  \ ...\n}\n```\n\n\n\n\n请密切关注 `RemarkAttribute` 构造函数的调用方式。首先，按照之前的方式指定了位置参数。接着是一个逗号，随后是命名参数\
  \ `Supplement`，并为其分配了一个值。最后，用右括号 `)` 结束了对构造函数的调用。因此，命名参数在构造函数的调用内部被初始化。这种语法可以泛化：位置参数必须按照它们出现的顺序指定。命名参数则通过为它们的名称赋值来指定。\n\
  \n下面是一个演示 `Supplement` 字段的程序：\n\n```csharp\n// 使用命名属性参数。\n\nusing System;\nusing\
  \ System.Reflection;\n\n[AttributeUsage(AttributeTargets.All)]\npublic class RemarkAttribute\
  \ : Attribute {\n  string pri_remark; //  Remark 属性\n  public string Supplement;\
  \ // 这是一个命名参数\n  public RemarkAttribute(string comment) {\n    pri_remark = comment;\n\
  \    Supplement = \"None\";\n  }\n  public string Remark {\n    get {\n      return\
  \ pri_remark;\n    }\n  }\n}\n\n[RemarkAttribute(\"This class uses an attribute.\"\
  ,\n                  Supplement = \"This is additional info.\")]\nclass UseAttrib\
  \ {\n  // ...\n}\n\nclass NamedParamDemo {\n  static void Main() {\n    Type t =\
  \ typeof(UseAttrib);\n    Console.Write(\"Attributes in \" + t.Name + \": \");\n\
  \      object[] attribs = t.GetCustomAttributes(false);\n      foreach(object o\
  \ in attribs) {\n      Console.WriteLine(o);\n    }\n    // 获取 RemarkAttribute。\n\
  \    Type tRemAtt = typeof(RemarkAttribute);\n    RemarkAttribute ra = (RemarkAttribute)\n\
  \          Attribute.GetCustomAttribute(t, tRemAtt);\n    Console.Write(\"Remark:\
  \ \");\n    Console.WriteLine(ra.Remark);\n    Console.Write(\"Supplement: \");\n\
  \    Console.WriteLine(ra.Supplement);\n  }\n}\n```\n\n程序的输出结果所示：\n\nAttributes\
  \ in UseAttrib: RemarkAttribute\nRemark: This class uses an attribute.\nSupplement:\
  \ This is additional info.\n\n在继续之前，重要的一点是：`pri_remark` 不能作为命名参数，因为它是 `RemarkAttribute`\
  \ 的私有的。`Remark` 属性不能作为命名参数，因为它是只读的。请记住，只有公共的、可读写的字段和属性才能作为命名参数。\n\n公共的、可读写的属性可以像字段一样作为命名参数。例如，这里为\
  \ `RemarkAttribute` 增加了一个名为 `Priority` 的自动实现 `int` 属性：\n\n```csharp\n// 使用属性作为命名属性参数。\n\
  \nusing System;\nusing System.Reflection;\n\n[AttributeUsage(AttributeTargets.All)]\n\
  public class RemarkAttribute : Attribute {\n  string pri_remark; // Remark 属性\n\
  \  public string Supplement; // 这是一个命名参数\n  public RemarkAttribute(string comment)\
  \ {\n    pri_remark = comment;\n    Supplement = \"None\";\n    Priority = 1;\n\
  \  }\n  public string Remark {\n    get {\n      return pri_remark;\n    }\n  }\n\
  \  // 使用属性作为命名参数。\n  public int Priority { get; set; }\n}\n[RemarkAttribute(\"This\
  \ class uses an attribute.\",\n              Supplement = \"This is additional info.\"\
  ,\n              Priority = 10)]\nclass UseAttrib {\n  // ...\n}\n\nclass NamedParamDemo\
  \ {\n  static void Main() {\n    Type t = typeof(UseAttrib);\n    Console.Write(\"\
  Attributes in \" + t.Name + \": \");\n      object[] attribs = t.GetCustomAttributes(false);\n\
  \      foreach(object o in attribs) {\n      Console.WriteLine(o);\n    }\n    //\
  \ 获取 RemarkAttribute。\n    Type tRemAtt = typeof(RemarkAttribute);\n    RemarkAttribute\
  \ ra = (RemarkAttribute)\n      Attribute.GetCustomAttribute(t, tRemAtt);\n    Console.Write(\"\
  Remark: \");\n    Console.WriteLine(ra.Remark);\n    Console.Write(\"Supplement:\
  \ \");\n    Console.WriteLine(ra.Supplement);\n    Console.WriteLine(\"Priority:\
  \ \" + ra.Priority);\n  }\n}\n```\n\n输出结果所示：\n\nAttributes in UseAttrib: RemarkAttribute\n\
  Remark: This class uses an attribute.\nSupplement: This is additional info.\nPriority:\
  \ 10\n\n程序中有一值得注意。注意这里显示的在 `UseAttrib` 之前指定的属性：\n\n`RemarkAttribute(\"This class\
  \ uses an attribute.\", Supplement = \"This is additional info.\", Priority = 10)`\n\
  \n命名属性 `Supplement` 和 `Priority` 没有任何特定的顺序。反转这两个赋值的顺序不会对属性产生任何更改。\n\n最后一点：对于位置参数和命名参数，属性参数的类型必须是内置原始类型之一、`object`、`Type`、枚举，或者其中任一种类型的一维数组。\n\
  \n#### 三种内置属性\n\nC# 定义了许多内置属性，但有三个特别重要，因为它们适用于各种情况：`AttributeUsage`、`Conditional`\
  \ 和 `Obsolete`。我们在这里对它们进行检查。\n\n##### AttributeUsage\n\n如前所述，`AttributeUsage` 属性指定了属性可以应用于项类型。`AttributeUsage`\
  \ 是 `System.AttributeUsageAttribute` 类的另一个名称。`AttributeUsage` 具有以下构造函数：\n\n`AttributeUsage(AttributeTargets\
  \ validOn)`\n\n在这里，`validOn` 指定了可以使用该属性的项或多个项。`AttributeTargets` 是一个定义了以下值的枚举：\n\
  \n![image](img/AttributeTargets.jpg)\n\n可以将两个或多个这些值进行位运算。例如，要指定一个只能应用于字段和属性的属性，可以使用：\n\
  \n`AttributeTargets.Field | AttributeTargets.Property`\n\n`AttributeUsage` 支持两个命名参数。第一个是\
  \ `AllowMultiple`，是一个 `bool` 值。如果该值为 true，则该属性可以多次应用于同一个项。第二个是 `Inherited`，也是一个\
  \ `bool` 值。如果该值为 true，则该属性会被派生类继承。否则，不会继承。`AllowMultiple` 的默认值为 false，`Inherited`\
  \ 的默认值为 true。\n\n`AttributeUsage` 还指定了一个只读属性 `ValidOn`，它返回 `AttributeTargets` 类型的值，指定了属性可以使用的项类型。默认是\
  \ `AttributeTargets.All`。\n\n##### Conditional Attribute\n\n`Conditional` 属性可能是\
  \ C# 最有趣的内置属性。它允许你创建条件方法。只有当通过 `#define` 定义了特定符号时，才会调用条件方法。否则方法将被跳过。因此，条件方法提供了 `#if`\
  \ 的替代方案。\n\n**Conditional** 是 `System.Diagnostics.ConditionalAttribute` 的另一个名称。使用\
  \ `Conditional` 属性需要包含 `System.Diagnostics` 命名空间。\n\n让我们从一个示例开始：\n\n```csharp\n\
  // 演示 Conditional 属性。\n#define TRIAL\n\nusing System;\nusing System.Diagnostics;\n\
  \nclass Test {\n  [Conditional(\"TRIAL\")]\n  void Trial() {\n    Console.WriteLine(\"\
  Trial version, not for distribution.\");\n  }\n\n  [Conditional(\"RELEASE\")]\n\
  \  void Release() {\n    Console.WriteLine(\"Final release version.\");\n  }\n\n\
  \  static void Main() {\n    Test t = new Test();\n    t.Trial(); // 只有定义 TRIAL\
  \ 时才调用\n    t.Release(); // 只有定义 RELEASE 时才调用\n  }\n}\n```\n\n该程序的输出所示：\n\nTrial\
  \ version, not for distribution.\n\n\n\n\n其中 `symbol*` 是决定方法是否将执行的符号。如果 `symbol`\
  \ 已定义，那么在调用该方法时，它将被执行。如果 `symbol` 未定义，则该方法不会执行。\n\n在 `Main()` 中，同时调用了 `Trial()`\
  \ 和 `Release()`。然而，只定义了 `TRIAL`。因此，`Trial()` 被执行。对 `Release()` 的调用被忽略。如果你定义了 `RELEASE`，那么\
  \ `Release()` 也会被调用。如果你删除了 `TRIAL` 的定义，则 `Trial()` 将不会被调用。\n\n`Conditional` 属性也可以应用于属性类（即继承\
  \ `Attribute` 的类）。在这种情况下，如果在编译期间遇到该属性时 `symbol` 已定义，则应用该属性；否则，不应用。\n\n条件方法有几个限制。首先，它们必须返回\
  \ `void`。第二，它们必须是类或结构体的成员，而不是接口的成员。第三，它们不能带有 `override` 关键字。\n\n### 过用属性 (Obsolete\
  \ Attribute)\n\n`Obsolete` 属性是 `System.ObsoleteAttribute` 的缩写，允许你将程序元素标记为过用。这是它的形式之一：\n\
  \n`[Obsolete(\"message*\")]`\n\n在这里，`message*` 会在该程序元素被编译时显示。这是一个简短的示例：\n\n```cs\n\
  // 演示 Obsolete 属性。\n\nusing System;\n\nclass Test {\n\n  [Obsolete(\"Use MyMeth2,\
  \ instead.\")]\n  public static int MyMeth(int a, int b) {\n    return a / b;\n\
  \  }\n\n  // MyMeth 的改进版本。\n  public static int MyMeth2(int a, int b) {\n    return\
  \ b == 0 ? 0 : a /b;\n  }\n  static void Main() {\n    // 此处会显示警告。\n    Console.WriteLine(\"\
  4 / 3 is \" + Test.MyMeth(4, 3));\n    // 这里没有警告。\n    Console.WriteLine(\"4 / 3\
  \ is \" + Test.MyMeth2(4, 3));\n  }\n}\n```\n\n当编译此程序时，在 `Main()` 中遇到对 `MyMeth()`\
  \ 的调用将生成一个警告，告诉用户改用 `MyMeth2()`。\n\n`Obsolete` 的第二种形式所示：\n\n`[Obsolete(\"message*\"\
  , error*)]`\n\n在这里，`error*` 是一个布尔值。如果为真，则使用过用项将生成编译错误而不是警告。其区别当然是，包含错误的程序无法被编译成可执行程序。\n\
  \n### 第 18 章 泛型 (Generics)\n\n本章将探讨 C# 最复杂且最强大的特性之一：泛型。有趣的是，尽管泛型现在是 C# 编程中不可或缺的一部分，但它们并没有被包含在最初的\
  \ 1.0 版本中。相反，它们是在 C# 2.0 中添加的。说泛型的加入从根本上改变了 C# 的特性并不为夸张。它不仅增加了一个新的语法元素，还增加了新的能力，并导致了库的许多更改和升级。尽管泛型引入\
  \ C# 已经过了几年，但其影响仍然响彻整个语言。\n\n泛型功能之所以如此重要，是因为它允许创建类、结构体、接口、方法和委托，这些内容能够以类型安全的方式与各种类型的数据工作。正如你可能知道的，无论应用于什么种类型的数据，许多算法在逻辑上都是相同的。例如，支持队列的机制无论队列存储的是\
  \ `int`、`string`、`object` 类型还是用户定义的类，都是相同的。在泛型出现之前，你可能为同种算法创建多个不同的版本来处理不同类型的数据。通过使用泛型，你可以定义一次解决方案，而不依赖于任何特定的数据类型，然后将该解决方案应用于各种类型的数据类型，而无需任何额外努力。\n\
  \n本章描述了泛型的语法、理论和用法。它还展示了泛型如何为某些以前困难的情况提供类型安全。一旦你完成了本章，你将想要查看第 25 章，该章节涵盖了集合 (Collections)。在那里你将找到许多泛型在泛型集合类中工作的示例。\n\
  \n#### 什么是泛型？\n\n从核心上说，“泛型”一词意味着参数化类型。参数化类型很重要，因为它们允许你创建类、结构体、接口、方法和委托，在这些内容中操作的数据类型被指定为一个参数。使用泛型，可以创建一个单一类（例如），它可以自动处理不同类型的数据。操作参数化类型的类、结构体、接口或委托被称为泛型，例如泛型类或泛型方法。\n\
  \n重要的是理解，C# 一直赋予你通过 `object` 类型引用来创建通用代码的能力。由于 `object` 是所有类的基类，`object` 引用可以引用任何类型的对象。因此，在泛型之前的代码中，通用代码使用\
  \ `object` 引用来操作各种对象。问题在于，它无法以类型安全的方式这样做，因为需要在 `object` 类型和数据的实际类型之间进行强制类型转换。这是一个潜在的错误来源，因为可能不小心使用错误的强制转换。泛型通过提供类型安全避免了这个问题。泛型还简化了过程，因为没有必要在\
  \ `object` 和实际操作的数据类型之间采用强制转换。因此，泛型扩展了你重用代码的能力并让你能够轻松做到这一点。\n\n**给 C++ 和 Java 程序员的提示**：C#\
  \ 泛型类似于 C++ 的模板和 Java 的泛型，但它们并不相同。事实上，这些方法之间存在一些根本性的。如果你有 C++ 或 Java 的背景，不要对 C#\
  \ 泛型的工作方式下结论。\n\n#### 简单泛型示例\n\n让我们从一个泛型类的简单示例开始。以下程序定义了两个类：第一个是泛型类 `Gen`，第二个是使用\
  \ `Gen` 的 `GenericsDemo`。泛型类\n\n```cs\nusing System;\n\n// 在下面的 Gen 类中，T 是类型参数，在创建\
  \ Gen 对象时会被实际类型替换。\nclass Gen<T> {\n  T ob; // 声明一个类型 T 的变量\n  // 注意此构造函数有一个 T 类型的参数。\n\
  \  public Gen(T o) {\n    ob = o;\n  }\n  // 返回 T 类型的 ob。\n  public T GetOb() {\n\
  \    return ob;\n  }\n  // 显示 T 类型。\n  public void ShowType() {\n    Console.WriteLine(\"\
  Type of T is \" + typeof(T));\n  }\n}\n\n// 演示泛型类。\nclass GenericsDemo {\n  static\
  \ void Main() {\n    // 为 int 创建 Gen 引用。\n    Gen<int> iOb;\n    // 创建 Gen<int>\
  \ 对象并将其引用赋值给 iOb。\n    iOb = new Gen<int>(102);\n    // 显示 iOb 使用的数据类型。\n    iOb.ShowType();\n\
  \    // 获取 iOb 中的值。\n    int v = iOb.GetOb();\n    Console.WriteLine(\"value: \"\
  \ + v);\n    Console.WriteLine();\n    // 为字符串创建 Gen 对象。\n    Gen<string> strOb\
  \ = new Gen<string>(\"Generics add power.\");\n    // 显示 strOb 中存储的数据类型。\n    strOb.ShowType();\n\
  \    // 获取 strOb 中的值。\n    string str = strOb.GetOb();\n    Console.WriteLine(\"\
  value: \" + str);\n  }\n}\n```\n\n程序产生的输出所示：\nType of T is System.Int32\nvalue:\
  \ 102\nType of T is System.String\nvalue: Generics add power.\n\n让我们仔细检查这个程序。\n\n\
  首先，注意 `Gen` 是如何通过以下行声明的。\n\n```cs\nclass Gen<T> {\n```\n\n\n\n这里，`T` 是一个 `type parameter`\
  \ 的名称。这个名称用作占位符，表示在创建 `Gen` 对象时指定的实际类型。因此，每当需要类型参数时，`T` 就会用于 `Gen` 中。注意 `T` 被包含在\
  \ `< >` 之中。这种语法可以通用：每当声明类型参数时，它都在角括号内指定。由于 `Gen` 使用了类型参数，因此 `Gen` 是一个 `generic class`。\n\
  \n在 `Gen` 的声明中，名称 `T` 并没有特殊意义。任何有效的标识符都可以被使用，但 `T` 是传统的做法。其他常用的类型参数名称包括 `V` 和 `E`。当然，你也可以为类型参数使用描述性名称，例如\
  \ `TValue` 或 `TKey`。在使用描述性名称时，通常的做法是使用 `T` 作为首字母。\n\n接下来，使用 `T` 声明一个名为 `ob` 的变量，如下：\n\
  \n```c\nT ob; // 声明一个类型为 T 的变量\n```\n\n如解释，`T` 是在创建 `Gen` 对象时指定的实际类型的占位符。因此，当实例化\
  \ `Gen` 对象时，`ob` 将是绑定到 `T` 的类型的变量。例如，如果为 `T` 指定了类型 `string`，那么在那个实例中，`ob` 将是 `string`\
  \ 类型。\n\n现在考虑 `Gen` 的构造函数：\n\n```csharp\npublic Gen(T o) {\n  ob = o;\n}\n```\n\n\
  注意它的参数 `o` 类型为 `T`。这意味着 `o` 的实际类型是由创建 `Gen` 对象时绑定到 `T` 的类型决定的。此外，由于由于参数 `o` 和实例变量\
  \ `ob` 的类型都是 `T`，因此在创建 `Gen` 对象时，它们都将具有相同的实际类型。\n\n类型参数 `T` 也可以用于指定方法的返回类型，如下所示的\
  \ `GetOb()` 方法：\n\n```csharp\npublic T GetOb() {\n  return ob;\n}\n```\n\n由于 `ob`\
  \ 也是类型 `T`，因此它的类型与 `GetOb()` 指定的返回类型兼容。\n\n`ShowType()` 方法通过将 `T` 传递给 `typeof` 运算符来显示\
  \ `T` 的类型。因为在创建 `Gen` 类型的对象时，真实的类型会替换 `T`，因此 `typeof` 将获取有关实际类型的类型信息。\n\n`GenericsDemo`\
  \ 类演示了泛型 `Gen` 类。它首先为类型 `int` 创建了一个版本的 `Gen`，如下所示：\n\n```csharp\nGen<int> iOb;\n\
  ```\n\n仔细观察此声明。首先，注意在 `Gen` 之后的角括号内指定了类型 `int`。在这种情况下，`int` 是一个绑定到 `Gen` 类型参数 `T`\
  \ 的 `type argument`。这创建了一个 `Gen` 的版本，其中所有对 `T` 的使用都被替换为 `int`。因此，对于此声明，`ob` 的类型是\
  \ `int`，且 `GetOb()` 的返回类型是 `int`。下一行为 `iOb` 分配了一个指向 `int` 版本的 `Gen` 类的引用：\n\n```csharp\n\
  iOb = new Gen<int>(102);\n```\n\n注意，当调用 `Gen` 构造函数时，类型参数 `int` 也被指定了。这是必要的，因为赋值给引用的变量（`iOb`）的类型是\
  \ `Gen<int>`。因此，`new` 返回的引用也必须是 `Gen<int>` 类型。如果不是，将导致编译错误。例如，以下赋值将导致编译错误：\n\n```csharp\n\
  iOb = new Gen<double>(18.12); // 错误\n```\n\n由于 `iOb` 的类型是 `Gen<int>`，它不能被用来引用 `Gen<double>`\
  \ 的对象。这种类型检查是泛型的主要优点之一，因为它确保了类型安全。程序随后显示 `iOb` 内部 `ob` 的类型，它是 `System.Int32`。这是与\
  \ `int` 对应的结构。接下来，程序通过以下行代码获取 `ob` 的值：\n\n```csharp\nint v = iOb.GetOb();\n```\n\
  \n由于 `GetOb()` 的返回类型是 `T`，在声明 `iOb` 时该类型被替换为 `int`，因此 `GetOb()` 的返回类型也是 `int`。因此，该值可以赋值给\
  \ `int` 变量。接下来，`GenericsDemo` 声明了一个类型为 `Gen<string>` 的对象：\n\n```csharp\nGen<string>\
  \ strOb = new Gen<string>(\"Generics add.\");\n```\n\n由于类型参数是 `string`，`string`\
  \ 在 `Gen` 内部替换了 `T`。正如剩余行所示，这创建了一个 `string` 版本的 `Gen`。\n\n在继续之前，需要定义几个术语。当你为 `Gen`\
  \ 指定类型参数为 `int` 或 `string` 时，你正在创建 C# 中所说的 `closed type`。因此，`Gen<int>` 是一个闭合类型。本质上，泛型类型（如\
  \ `Gen<T>`）是一种抽象。只有在构建了特定版本（如 `Gen<int>`）之后，才创建了具体的类型。在 C# 术语中，像 `Gen<T>` 这样的结构被称为\
  \ `open constructed type`。\n\n\n\n\n\n```cs\n// v = (int) iOb.GetOb(); // runtime\
  \ error!\n\n  }\n\n}\n```\n\n该程序产生如下输出：\n\n```\nType of ob is System.Int32\nvalue:\
  \ 102\nType of ob is System.String\nvalue: Non-Generics Test\n```\n\n如你所见，输出与程序的之前的版本相似。\n\
  \n在这个版本中有几个值得关注的地方。首先，注意 `NonGen` 将所有对 `T` 的使用替换为 `object`。这使得 `NonGen` 能够存储任何类型的对象，就像泛型版本一样。然而，这种方法在两个方面都是糟糕：首先，必须使用显式类型转换来检索存储的数据。其次，许多类型不匹配错误在运行时之前无法被发现。让我们仔细观察每个问题。\n\
  \n我们将从这一行开始：\n\n```csharp\nint v = (int) iOb.GetOb();\n```\n\n由于 `GetOb()` 的返回类型现在是\
  \ `object`，因此需要转换为 `int` 转换，以便使 `GetOb()` 返回的值被拆箱并存储在 `v` 中。如果你删除类型转换，程序将无法编译。在程序的泛型版本中，这种转换是不需要的，因为在构造\
  \ `iOb` 时已经指定 `int` 为类型参数。在非泛型版本中，必须使用类型转换。这不仅是不方便，还是潜在的错误来源。\n\n现在，考虑程序末尾附近的以下序列：\n\
  \n```cssharp\n// 这段代码可以编译，但在概念上是错误的！\niOb = strOb;\n\n// 下一行会导致运行时异常。\n// v = (int)\
  \ iOb.GetOb(); // runtime error!\n```\n\n在这里，`strOb` 被赋值给 `iOb`。然而，`strOb` 指向一个包含字符串的对象，而不是整数。这种赋值在语法上是有效的，因为所有的\
  \ `NonGen` 引用都是相同的，任何 `NonGen` 引用都可以引用任何其他 `NonGen` 对象。但是该语句在语义上是错误的，正如注释掉的行行所示。在该行中，`GetOb()`\
  \ 的返回类型被转换为 `int`，然后尝试将此值赋值给 `v`。问题在于 `iOb` 现在指向一个存储 `string` 而不是 `int` 的对象。遗憾的是，如果没有泛型，编译器不会捕获此错误。相反，在尝试转换为\
  \ `int` 时会发生运行时异常。要亲身验证，请尝试删除行首的注释符号，然后编译并运行程序。将会发生运行时错误。\n\n在使用泛型时，上述序列就不会发生。如果在程序的泛型版本中尝试此序列，编译器将捕获它并报告错误，从而防止导致运行时异常的严重漏洞。创建能够在编译时捕获类型不匹配错误的类型安全代码的能力，是泛型的一个关键优势。尽管在\
  \ C# 中使用 `object` 引用来创建“泛型”代码一直是可能的，但那种代码不是类型安全的，且误用可能会导致运行时异常。泛型防止了这种情况发生。本质上，通过泛型，曾经的运行时错误已变成了编译时错误。这是一个巨大的优势。\n\
  \n`NonGen` 程序中还有另一个值得关注点。注意 `NonGen` 实例变量 `ob` 的类型是如何通过 `ShowType()` 获取的：\n\n```csharp\n\
  Console.WriteLine(\"Type of ob is \" + ob.GetType());\n```\n\n回想 第 11 章，`object`\
  \ 定义了几个所有数据类型可用的方法。其中一个方法是 `GetType()`，它返回一个 `Type` 对象，描述运行时调用该对象的类型。因此，尽管在程序的源代码中\
  \ `ob` 的类型被指定为 `object`，但在运行时，所引用对象的实际类型是知的。这就是为什么如果你在程序执行期间尝试无效的类型转换，CLR 将生成异常。\n\
  \n### 带有两个类型参数的泛型类\n\n你可以在泛型类型中声明多个类型参数。要指定两个或多个类型参数，只需使用逗号分隔的列表即可。例如，下面的 `TwoGen`\
  \ 类是 `Gen` 类的变体，它有两个类型参数：\n\n```csharp\n// 一个带有两个类型参数 T 和 V 的简单泛型类。\nusing System;\n\
  \nclass TwoGen<T, V> {\n  T ob1;\n  V ob2;\n  // 注意此构造函数具有 T 和 V 类型的参数。\n  public\
  \ TwoGen(T o1, V o2) {\n    ob1 = o1;\n  }\n  // ... (类的其余部分)\n}\n```\n\n\n\n\n\n\
  - 你可以使用`基类约束`（base class constraint）来要求类型参数必须包含某个基类。该约束通过命名所需的基类来指定。这种约束还有一种变体，称为`裸露类型约束`（naked\
  \ type constraint），其中类型参数（而不是实际类型）指定了基类。这允许你在两个类型参数之间建立关系。\n- 你可以使用`接口约束`（interface\
  \ constraint）来要求类型参数必须实现一个或多个接口。该约束通过命名所需的接口来指定。\n- 你可以要求类型参数提供一个无参数的构造函数。这被称为`构造函数约束`（constructor\
  \ constraint）。它通过 `new()` 指定。\n- 你可以通过指定`引用类型约束`（reference type constraint）：`class`\
  \ 来指定类型参数必须为引用类型。\n- 你可以通过指定`值类型约束`（value type constraint）：`struct` 来指定类型参数必须为值类型。\n\
  \n在这些约束中，基类约束和接口约束可能是最常用的，但所有约束都是重要的。接下来的章节将检查每种约束。\n\n## 使用基类约束\n\n基类约束允许你指定一个类型参数必须继承的基类。基类约束具有两个重要目的。首先，它允许你在泛型类中使用约束所指定的基类的成员。例如，你可以调用基类的方法或使用基类的属性。如果没有基类约束，编译器无法得知类型参数可能拥有什么类型的成员。通过提供基类约束，你是在让编译器知道所有类型参数都将具有该基类定义的成员。\n\
  \n基类约束的第二个目的是确保只使用支持指定基类的类型参数。这意味着，对于任何给定的基类约束，类型参数必须是该基类本身，或者是派自该基类的类。如果你尝试使用不匹配或未继承自指定基类的类型参数，将导致编译时错误。\n\
  \n基类约束使用以下形式的 `where` 子句：\n\n```text\nwhere T: base-class-name\n```\n\n在这里，`T` 是类型参数的名称，`base-class-name`\
  \ 是基类的名称。只能指定一个基类。\n\n下面是一个演示基类约束机制的简单示例：\n\n```text\n// 基类约束的简单演示。\n\nusing System;\n\
  \nclass A {\n  public void Hello() {\n    Console.WriteLine(\"Hello\");\n  }\n}\n\
  \n// 类 B 继承 A。\nclass B : A { }\n\n// 类 C 不继承 A。\nclass C { }\n\n// 因为有基类约束，传递给\
  \ Test 的所有类型参数\n// 必须以 A 为基类。\nclass Test<T> where T : A {\n  T obj;\n  public Test(T\
  \ o) {\n    obj = o;\n  }\n  public void SayHello() {\n    // 调用 Hello() 是允许的，因为它\n\
  \    // 由基类 A 定义。\n    obj.Hello();\n  }\n}\n\nclass BaseClassConstraintDemo {\n\
  \  static void Main() {\n    A a = new A();\n    B b = new B();\n    C c = new C();\n\
  \    // 以下是有效的，因为 A 是指定的基类。\n    Test<A> t1 = new Test<A>(a);\n    t1.SayHello();\n\
  \    // 以下是有效的，因为 B 继承了 A。\n    Test<B> t2 = new Test<B>(b);\n    t2.SayHello();\n\
  \    // 以下是无效的，因为 C 没有继承 A。\n    // Test<C> t3 = new Test<C>(c); // Error!\n   \
  \ // t3.SayHello(); // Error!\n  }\n}\n```\n\n在此程序中，类 `A` 被 `B` 继承，但没有被 `C` 继承。注意\
  \ `A` 定义了一个名为 `Hello()` 的方法。接下来，注意 `Test` 是一个如下定义的泛型类：\n\n```text\nclass Test<T>\
  \ where T : A {\n```\n\n`where` 子句规定 `T` 的任何类型参数必须以 `A` 为基类。现在注意 `Test` 声明了下面的 `SayHello()`\
  \ 方法：\n\n```text\npublic void SayHello() {\n  // 调用 Hello() 是允许的，因为它\n  // 由基类 A\
  \ 定义。\n  obj.Hello();\n}\n```\n\n该方法调用了 `obj` 的 `Hello()`，而 `obj` 是一个 `T` 对象。关键点在于，能够调用\
  \ `Hello()` 的唯一原因是基类约束要求绑定到 `T` 的类型参数必须是 `A` 或继承 `A`，并且 `A` 定义了 `Hello()`。因此，任何有效的\
  \ `T` 都会定义 `Hello()`。如果没有使用基类约束，编译器将无法在类型为 `T` 的对象上调用 `Hello()` 方法。你可以通过删除 `where`\
  \ 子句来亲自证明这一点。程序将不再编译，因为 `Hello()` 方法将不可识别。\n\n除了允许访问基类的成员外，基类约束还强制只有继承基类的类型才能作为类型参数传递。这就是为什么以下几行被注释掉了：\n\
  \n```text\n// Test<C> t3 = new Test<C>(c); // Error!\n// t3.SayHello(); // Error!\n\
  ```\n\n因为 `C` 没有继承 `A`，所以它不能作为构造 `Test` 对象的类型参数。你可以通过删除注释并尝试重新编译来证明这一点。\n\n在继续之前，让我们回顾一下基类约束的两个作用：基类约束允许泛型类访问基类的成员。它还确保只有符合该约束的类型才是有效的，从而维护了类型安全。\n\
  \n之前的示例展示了基类约束的“如何做”，并没有说明“为什么”。为了更好地理解基类约束的价值，让我们来看另一个示例。假设你想创建一个管理列表的机制。此外，你想要为不同的分组创建列表。具体来说，你想要一个朋友列表，另一个供应商列表，等等。为了实现这一点，你可能从创建一个存储名称和电话的基类\
  \ `PhoneNumber` 开始。这样的类可能如下：\n\n```text\n// 存储名称和电话的基类。\nclass PhoneNumber {\n \
  \ public PhoneNumber(string n, string num) {\n    Name = n;\n    Number = num;\n\
  \  }\n  // 持有名称和电话的自动属性。\n  public string Number { get; set; }\n  public string\
  \ Name { get; set; }\n}\n```\n\n接下来，你创建两个继承 `PhoneNumber` 的类：`Friend` 和 `Supplier`。它们所示：\n\
  \n```text\n// 朋友电话类。\nclass Friend : PhoneNumber {\n  public Friend(string n, string\
  \ num, bool wk) : base(n, num) {\n    IsWorkNumber = wk;\n  }\n  public bool IsWorkNumber\
  \ { get; private set; }\n}\n\n// 供应商电话类。\nclass Supplier : PhoneNumber {\n  public\
  \ Supplier(string n, string num) : base(n, num) { }\n}\n```\n\n注意 `Friend` 添加了一个名为\
  \ `IsWorkNumber` 的属性，如果电话号码是工作号码则返回 `true`。为了管理电话列表，你创建一个名为 `PhoneList` 的类。因为你想让这个类管理任何类型的电话列表，你将其变为泛型。此外，由于列表管理的一部分是根据名称查找号码，反之亦然，你添加了约束，要求存储在列表中类型必须是派自\
  \ `PhoneNumber` 类的实例。\n\n```text\n// 只要派自 PhoneNumber，PhoneList 就可以管理任何类型的电话列表。\n\
  class PhoneList<T> where T : PhoneNumber {\n  T[] phList;\n  int end;\n  public\
  \ PhoneList() {\n    phList = new T[10];\n    end = 0;\n  }\n  // 向列表添加条目。\n  public\
  \ bool Add(T newEntry) {\n    if(end == 10) return false;\n    phList[end] = newEntry;\n\
  \    end++;\n    return true;\n  }\n  // 根据名称查找并返回电话信息。\n  public T FindByName(string\
  \ name) {\n```\n\n\n\n\n\n```csharp\nfor(int i=0; i<end; i++) {\n    // Name can\
  \ be used because it is a member of\n    // PhoneNumber, which is the base class\
  \ constraint.\n    if(phList[i].Name == name)\n        return phList[i];\n}\n//\
  \ Name 不在列表中。\nthrow new NotFoundException();\n}\n\n}\n\n// 给定一个号码，查找并返回电话信息。\n\
  public T FindByNumber(string number) {\n    for(int i=0; i<end; i++) {\n       \
  \ // Number can be used because it is also a member of\n        // PhoneNumber,\
  \ which is the base class constraint.\n        if(phList[i].Number == number)\n\
  \            return phList[i];\n    }\n    // Number 不在列表中。\n    throw new NotFoundException();\n\
  }\n\n// ...\n}\n```\n\n基类约束允许 `PhoneList` 内部的代码访问任何类型电话列表的 `Name` 和 `Number` 属性。它还保证了只有有效类型才会被用于构造\
  \ `PhoneList` 对象。请注意，如果找不到名称或号码，`PhoneList` 会抛出 `NotFoundException`。这是一个自定义异常，声明如下所示：\n\
  \n```csharp\nclass NotFoundException : Exception {\n  /* 实现所有的 Exception 构造函数。注意，\n\
  \      构造函数只是简单地执行基类构造函数。\n      由于 NotFoundException 没有给 Exception 增加任何内容，\n  \
  \    因此不需要任何进一步的操作。 */\n  public NotFoundException() : base() { }\n  public NotFoundException(string\
  \ message) : base(message) { }\n  public NotFoundException(string message, Exception\
  \ innerException) :\n    base(message, innerException) { }\n  protected NotFoundException(\n\
  \    System.Runtime.Serialization.SerializationInfo info,\n    System.Runtime.Serialization.StreamingContext\
  \ context) :\n      base(info, context) { }\n}\n```\n\n虽然此示例仅使用了默认构造函数，但为了说明，`NotFoundException`\
  \ 实现了 `Exception` 定义的所有构造函数。注意，这些构造函数只是调用了 `Exception` 定义的等效基类构造函数。由于 `NotFoundException`\
  \ 没有给 `Exception` 增加任何内容，没有理由进行任何进一步的操作。\n\n下面的程序整合了所有部分并演示了 `PhoneList`。注意，还了一个名为\
  \ `EmailFriend` 的类。该类没有继承 `PhoneNumber`。因此，它*无法*被用于创建 `PhoneList`。\n\n```csharp\n\
  // 基类约束的一个更实用的演示。\n\nusing System;\n\n// 如果找不到名称或号码，则抛出的自定义异常。\nclass NotFoundException\
  \ : Exception {\n  /* 实现所有的 Exception 构造函数。注意，\n      构造函数只是简单地执行基类构造函数。\n     \
  \ 由于 NotFoundException 没有给 Exception 增加任何内容，\n      因此不需要任何进一步的操作。 */\n  public\
  \ NotFoundException() : base() { }\n  public NotFoundException(string message) :\
  \ base(message) { }\n  public NotFoundException(string message, Exception innerException)\
  \ :\n    base(message, innerException) { }\n  protected NotFoundException(\n   \
  \ System.Runtime.Serialization.SerializationInfo info,\n    System.Runtime.Serialization.StreamingContext\
  \ context) :\n    base(info, context) { }\n}\n// 存储名称和电话号码的基类。\nclass PhoneNumber\
  \ {\n  public PhoneNumber(string n, string num) {\n    Name = n;\n    Number = num;\n\
  \  }\n  public string Number { get; set; }\n  public string Name { get; set; }\n\
  }\n// 朋友的电话号码类。\nclass Friend : PhoneNumber {\n  public Friend(string n, string\
  \ num, bool wk) :\n    base(n, num) {\n    IsWorkNumber = wk;\n  }\n  public bool\
  \ IsWorkNumber { get; set; }\n  // ...\n}\n// 供应商的电话号码类。\nclass Supplier : PhoneNumber\
  \ {\n  public Supplier(string n, string num) :\n    base(n, num) { }\n  // ...\n\
  }\n// 注意此类没有继承 PhoneNumber。\nclass EmailFriend {\n  // ...\n}\n// PhoneList 可以管理任何类型的电话列表，\n\
  // 只要它派自 PhoneNumber。\nclass PhoneList<T> where T : PhoneNumber {\n  T[] phList;\n\
  \  int end;\n  public PhoneList() {\n    phList = new T[10];\n    end = 0;\n  }\n\
  \  // 向列表添加条目。\n  public bool Add(T newEntry) {\n    if(end == 10) return false;\n\
  \    phList[end] = newEntry;\n    end++;\n    return true;\n  }\n  // 给定一个名称，查找并返回电话信息。\n\
  \  public T FindByName(string name) {\n    for(int i=0; i<end; i++) {\n      //\
  \ 名称可以使用，因为它是 PhoneNumber 的成员，\n      // PhoneNumber 是基类约束。\n      if(phList[i].Name\
  \ == name)\n          return phList[i];\n    }\n    // 名称 不在列表中。\n    throw new\
  \ NotFoundException();\n  }\n  // 给定一个号码，查找并返回电话信息。\n  public T FindByNumber(string\
  \ number) {\n    for(int i=0; i<end; i++) {\n      // 号码可以使用，因为它也是 PhoneNumber 的成员，\n\
  \      // PhoneNumber 是基类约束。\n      if(phList[i].Number == number)\n        return\
  \ phList[i];\n    }\n    // 号码 不在列表中。\n    throw new NotFoundException();\n  }\n\
  }\n// 使用基类约束。\nclass UseBaseConstraint {\n  static void Main() {\n    // 以下代码是允许的，因为\
  \ Friend 继承了 PhoneNumber。\n    PhoneList<Friend> plist = new PhoneList<Friend>();\n\
  \    plist.Add(new Friend(\"Tom\", \"555-1234\", true));\n    plist.Add(new Friend(\"\
  Gary\", \"555-6756\", true));\n    plist.Add(new Friend(\"Matt\", \"555-9254\",\
  \ false));\n    try {\n      // 根据名称查找朋友的号码。\n      Friend frnd = plist.FindByName(\"\
  Gary\");\n      Console.Write(frnd.Name + \": \" + frnd.Number);\n      if(frnd.IsWorkNumber)\n\
  \        Console.WriteLine(\" (work)\");\n      else\n        Console.WriteLine();\n\
  \    } catch(NotFoundException) {\n      Console.WriteLine(\"Not Found\");\n   \
  \ }\n    Console.WriteLine();\n    // 以下代码也是允许的，因为 Supplier 继承了 PhoneNumber。\n \
  \   PhoneList<Supplier> plist2 = new PhoneList<Supplier>();\n    plist2.Add(new\
  \ Supplier(\"Global Hardware\", \"555-8834\"));\n    plist2.Add(new Supplier(\"\
  Computer Warehouse\", \"555-9256\"));\n    plist2.Add(new Supplier(\"NetworkCity\"\
  , \"555-2564\"));\n    try {\n      // 根据号码查找供应商的名称。\n      Supplier sp = plist2.FindByNumber(\"\
  555-2564\");\n      Console.WriteLine(sp.Name + \": \" + sp.Number);\n    } catch(NotFoundException)\
  \ {\n      Console.WriteLine(\"Not Found\");\n    }\n    // 以下声明是无效的，因为 EmailFriend\n\
  \    // 没有继承 PhoneNumber。\n    // PhoneList<EmailFriend> plist3 =\n    //   new\
  \ PhoneList<EmailFriend>(); // 错误！\n  }\n}\n```\n\n程序的输出所示：\n\nGary: 555-6756 (work)\n\
  \nNetworkCity: 555-2564\n\n##### 使用接口约束\n\n接口约束允许你指定一个类型参数必须实现的接口。接口约束与基类约束具有相同的两个重要的作用。首先，它允许你在泛型类中使用接口的成员。其次，它确保只有实现了指定接口的类型才会被使用。这意味着对于任何给定的接口约束，类型参数必须是该接口本身或实现了该接口的类型。\n\
  \n接口约束使用 **where** 子句的这种形式：\n\n`where T: interface-name`\n\n\n\n\n在这里，`T` 是类型参数名称，而\
  \ `interface-name` 是接口名称。通过使用逗号分隔的列表可以指定多个接口。如果一个约束同时包含基类和接口，则基类必须列在第一个。\n\n下面的程序通过重构前一节所示的电话列表示例，说明了接口约束。在这个版本中，`PhoneNumber`\
  \ 类已转换为一个名为 `IPhoneNumber` 的接口。该接口随后由 `Friend` 和 `Supplier` 实现。\n\n```csharp\n//\
  \ 使用接口约束。\n\nusing System;\n\n// 如果未找到名称或号码，则抛出自定义异常。\nclass NotFoundException :\
  \ Exception {\n  /* 实现所有的 Exception 构造函数。注意，\n      构造函数简单地执行基类的构造函数。\n      由于\
  \ NotFoundException 没有给 Exception 增加任何内容，\n      因此无需执行任何进一步的操作。 */\n  public NotFoundException()\
  \ : base() { }\n  public NotFoundException(string message) : base(message) { }\n\
  \  public NotFoundException(string message, Exception innerException) :\n    base(message,\
  \ innerException) { }\n  protected NotFoundException(\n    System.Runtime.Serialization.SerializationInfo\
  \ info,\n    System.Runtime.Serialization.StreamingContext context) :\n      base(info,\
  \ context) { }\n}\n\n// 支持名称和电话号码的接口。\npublic interface IPhoneNumber {\n  string\
  \ Number {\n    get;\n    set;\n  }\n  string Name {\n    get;\n    set;\n  }\n\
  }\n\n// 朋友电话号码类。\n// 它实现了 IPhoneNumber。\nclass Friend : IPhoneNumber {\n  public\
  \ Friend(string n, string num, bool wk) {\n    Name = n;\n    Number = num;\n  \
  \  IsWorkNumber = wk;\n  }\n  public bool IsWorkNumber { get; private set; }\n \
  \ // 实现 IPhoneNumber。\n  public string Number { get; set; }\n  public string Name\
  \ { get; set; }\n  // ... ...\n}\n\n// 供应商电话号码类。\nclass Supplier : IPhoneNumber\
  \ {\n  public Supplier(string n, string num) {\n    Name = n;\n    Number = num;\n\
  \  }\n  // 实现 IPhoneNumber。\n  public string Number { get; set; }\n  public string\
  \ Name { get; set; }\n  // ...\n}\n\n// 注意，此类没有实现 IPhoneNumber。\nclass EmailFriend\
  \ {\n  // ...\n}\n\n// PhoneList 可以管理任何类型的电话列表\n// 只要它实现了 IPhoneNumber。\nclass PhoneList<T>\
  \ where T : IPhoneNumber {\n  T[] phList;\n  int end;\n  public PhoneList() {\n\
  \    phList = new T[10];\n    end = 0;\n  }\n  public bool Add(T newEntry) {\n \
  \   if(end == 10) return false;\n    phList[end] = newEntry;\n    end++;\n    return\
  \ true;\n  }\n  // 根据名称，查找并返回电话信息。\n  public T FindByName(string name) {\n    for(int\
  \ i=0; i<end; i++) {\n      // Name 可以，因为它是 PhoneNumber 的成员，\n      // 而 PhoneNumber\
  \ 是接口约束。\n      if(phList[i].Name == name)\n        return phList[i];\n    }\n \
  \   // 名称不在列表中。\n    throw new NotFoundException();\n  }\n  // 根据号码，查找并返回电话信息。\n\
  \  public T FindByNumber(string number) {\n    for(int i=0; i<end; i++) {\n    \
  \  // Number 可以用，因为它也是 PhoneNumber 的成员，\n      // 而 PhoneNumber 是接口约束。\n      if(phList[i].Number\
  \ == number)\n        return phList[i];\n    }\n    // 号码不在列表中。\n    throw new NotFoundException();\n\
  \  }\n  // ...\n}\n\n// 演示接口约束。\nclass UseInterfaceConstraint {\n  static void Main()\
  \ {\n    // 以下代码是没的，因为 Friend\n    // 实现了 IPhoneNumber。\n    PhoneList<Friend> plist\
  \ = new PhoneList<Friend>();\n    plist.Add(new Friend(\"Tom\", \"555-1234\", true));\n\
  \    plist.Add(new Friend(\"Gary\", \"555-6756\", true));\n    plist.Add(new Friend(\"\
  Matt\", \"555-9254\", false));\n    try {\n      // 根据名称查找朋友的号码。\n      Friend frnd\
  \ = plist.FindByName(\"Gary\");\n      Console.Write(frnd.Name + \": \" + frnd.Number);\n\
  \      if(frnd.IsWorkNumber)\n        Console.WriteLine(\" (work)\");\n      else\n\
  \        Console.WriteLine();\n    } catch(NotFoundException) {\n      Console.WriteLine(\"\
  Not Found\");\n    }\n    Console.WriteLine();\n\n    // 以下代码也是没问题的，因为 Supplier\n\
  \    // 实现了 IPhoneNumber。\n    PhoneList<Supplier> plist2 = new PhoneList<Supplier>();\n\
  \    plist2.Add(new Supplier(\"Global Hardware\", \"555-8834\"));\n    plist2.Add(new\
  \ Supplier(\"Computer Warehouse\", \"555-9256\"));\n    plist2.Add(new Supplier(\"\
  NetworkCity\", \"555-2564\"));\n    try {\n      // 根据号码查找供应商的名称。\n      Supplier\
  \ sp = plist2.FindByNumber(\"555-2564\");\n      Console.WriteLine(sp.Name + \"\
  : \" + sp.Number);\n    } catch(NotFoundException) {\n      Console.WriteLine(\"\
  Not Found\");\n    }\n    Console.WriteLine();\n\n    // 以下代码是出错的，因为 EmailFriend\n\
  \    // 没有实现 IPhoneNumber。\n    // PhoneList<EmailFriend> plist3 = new PhoneList<EmailFriend>();\n\
  \  }\n}\n```\n\n### 使用 new() 构造函数\n\n`new()` 约束允许你实例化类型。以下是一个简单的示例：\n\n```csharp\n\
  // 演示 new() 约束。\nusing System;\nclass MyClass {\n  public MyClass() {\n    // ...\n\
  \  }\n}\nclass Test<T> where T : new() {\n  T obj;\n  public Test() {\n    // 有\
  \ new() 约束，这是有效的。\n    obj = new T(); // 创建一个 T 对象\n  }\n}\n\n// ...\nclass ConsConstraintDemo\
  \ {\n  static void Main() {\n    Test<MyClass> x = new Test<MyClass>();\n  }\n}\n\
  ```\n\n首先，注意 `Test` 类的声明：\n```csharp\nclass Test<T> where T : new() {\n```\n由于 `new()`\
  \ 约束，任何类型参数必须提供一个无参数构造函数。\n\n接下来，检查 `Test` 的构造函数：\n```csharp\npublic Test() {\n\
  \  // 有 new() 约束，这是有效的。\n  obj = new T(); // 创建一个 T 对象\n}\n```\n创建一个类型 `T` 的新对象并将其引用赋值给\
  \ `obj`。该语句仅有效，是因为 `new()` 约束确保了构造函数可用。为了证明这一点，尝试移除 `new()` 约束并尝试重新编译程序。正如你所见，将报告一个错误。\n\
  \n\n\n\n\n使用 `new()` 有三个重要的点。首先，它可以与其他约束一起使用，但它必须是列表中的最后一个约束。其次，`new()` 允许你仅使用无参数构造函数来构造对象，即使存在其他构造函数。换句话说，不允许为类型参数的构造函数传递参数。第三，你不能将\
  \ `new()` 与值类型约束（下文描述）结合使用。\n\n## 引用类型和值类型约束\n\n接下来的两个约束允许你指定类型参数必须是引用类型或值类型。这些在引用类型和值类型之间的差异对泛型代码重要的少数情况下是非常有用的。以下是引用类型约束的通用形式：\n\
  \n```cs\nwhere T: class\n```\n\n在 `where` 子句的这种形式中，关键字 `class` 指定 `T` 必须是一个引用类型。因此，尝试使用值类型（如\
  \ `int` 或 `bool`）作为 `T` 将导致编译错误。\n\n以下是值类型约束的通用形式：\n\n```cs\nwhere T: struct\n```\n\
  \n在这种情况下，关键字 `struct` 指定 `T` 必须是一个值类型。（记住结构体是值类型。）因此，尝试使用引用类型（如 `string`）作为 `T`\
  \ 将导致编译错误。在两种情况下，当存在额外约束时，`class` 或 `struct` 必须是列表中的第一个约束。\n\n这里是一个演示引用类型约束的示例：\n\
  \n```cs\n// 演示引用约束。\n\nusing System;\n\nclass MyClass {\n  //...\n}\n\n// 使用引用约束。\n\
  class Test<T> where T : class {\n  T obj;\n  public Test() {\n    // 下述语句是合法的\n\
  \    // 因为 T 保证是一个引用\n    // 类型，它可以被赋值 null。\n    obj = null;\n  }\n  // ...\n}\n\
  \nclass ClassConstraintDemo {\n  static void Main() {\n    // 这里的是 OK 的，因为 MyClass\
  \ 是一个类。\n    Test<MyClass> x = new Test<MyClass>();\n    // 下行代码错误，因为 int 是值类型。\n\
  //// Test<int> y = new Test<int>();\n  }\n}\n```\n\n首先，注意 `Test` 是如何声明的：\n\n```cs\n\
  class Test<T> where T : class {\n```\n\n`class` 约束要求 `T` 的任何类型参数必须是引用类型。在这个程序中，这是必要的，因为\
  \ `Test` 构造函数内部发生了什么：\n\n```cs\npublic Test() {\n  // 下述语句是合法的\n  // 因为 T 保证是一个引用\n\
  \  // 类型，它可以被赋值 null。\n  obj = null;\n}\n```\n\n在这里，`obj`（其类型为 `T`）被赋值为 `null`。这种赋值仅对引用类型是有效的。根据一般规则，你不能给值类型分配\
  \ `null`。（该规则的例外是*可空类型*，它是一种特殊的结构体类型，封装了值类型并允许值为 `null`。详情信息请参阅 第 20 章。）因此，如果没有该约束，该赋值将是无效的且编译将失败。这是值类型和引用类型之间的差异对泛型程序可能重要的情况之一。\n\
  \n值类型约束是引用类型约束的互补。它仅确保任何类型参数都是值类型，包括 `struct` 或 `enum`。（在此上下文中，可空类型不被视为值类型。）这是一个示例：\n\
  \n```cs\n// 演示值类型约束。\n\nusing System;\n\nstruct MyStruct {\n  //...\n}\n\nclass\
  \ MyClass {\n  // ...\n}\n\nclass Test<T> where T : struct {\n  T obj;\n  public\
  \ Test(T x) {\n    obj = x;\n  }\n  // ...\n}\n\nclass ValueConstraintDemo {\n \
  \ static void Main() {\n    // 这两个声明都是合法的。\n    Test<MyStruct> x = new Test<MyStruct>(new\
  \ MyStruct());\n    Test<int> y = new Test<int>(10);\n    // 但是，下述声明是非合法的！\n////\
  \ Test<MyClass> z = new Test<MyClass>(new MyClass());\n  }\n}\n```\n\n在这个程序中，`Test`\
  \ 的声明如下所示：\n\n```cs\nclass Test<T> where T : struct {\n```\n\n由于 `Test` 的 `T` 现在有了\
  \ `struct` 约束，`T` 只能绑定到值参数。这意味着 `Test<MyStruct>` 和 `Test<int>` 是有效的，但 `Test<MyClass>`\
  \ 不是。为了证明这一点，请尝试移除最后一行开头的注释并重新编译。将报告一个错误。\n\n## 使用约束在类型参数之间建立关系\n\n基类约束有一种变体，允许你在两个类型参数之间建立关系。例如，考虑以下泛型类：\n\
  \n```cs\nclass Gen<T, V> where V : T {\n```\n\n在这一声明中，`where` 子句告诉编译器，绑定到 `V` 的类型参数必须与绑定到\
  \ `T` 的类型参数相同或继承自后者。如果在声明 `Gen` 对象时不存在这种关系，则会导致编译时错误。这种使用类型参数的约束被称为*裸露约束*（naked\
  \ constraint）。下面的示例示例说明了这一点：\n\n```cs\n// 在两个类型参数之间建立关系。\nusing System;\n\nclass\
  \ A {\n  //...\n}\n\nclass B : A {\n  // ...\n}\n\n// 这里，V 必须继承 T。\nclass Gen<T,\
  \ V> where V : T {\n  // ...\n}\n\nclass NakedConstraint {\n  static void Main()\
  \ {\n    // 这个声明是 OK 的，因为 B 继承 A。\n    Gen<A, B> x = new Gen<A, B>();\n    // 这个声明是错误的，因为\
  \ A 并不继承 B。\n//// Gen<B, A> y = new Gen<B, A>();\n  }\n}\n```\n\n首先，注意类 `B` 继承类\
  \ `A`。接下来，检查 `Main()` 中的两个 `Gen` 声明。正如注释所解释，第一个声明 `Gen<A, B> x = new Gen<A, B>()`\
  \ 是合法的，因为 `B` 继承 `A`。然而，第二个声明 `Gen<B, A> y = new Gen<B, A>()` 是非法的，因为 `A` 不继承 `B`。\n\
  \n## 使用多个约束\n\n一个类型参数可以关联多个约束。在这种情况下，请使用逗号分隔的约束列表。在该列表中，第一个约束必须是 `class` 或 `struct`（如果存在），或基类（如果指定了）。同时指定\
  \ `class` 或 `struct` 约束和基类是非法的。列表中接下来应该是任何接口约束。`new()` 约束必须在最后。例如，这是一个有效的声明：\n\n\
  ```cs\nclass Gen<T> where T : MyClass, IInterface, new() { //...\n```\n\n在这种，`T`\
  \ 必须替换为继承 `MyClass`、实现 `IInterface` 且具有无参数构造函数的类型参数。\n\n在使用两个或多个类型参数时，可以使用独立的 `where`\
  \ 子句为每个参数指定约束。这是一个示例：\n\n```cs\n// 使用多个 where 子句。\nusing System;\n\n// Gen 有两个类型参数，且都有自己的\
  \ where 子句。\nclass Gen<T, V> where T : class\n      where V : struct {\n  T obj1;\n\
  \  V obj2;\n  public Gen(T t, V v) {\n    obj1 = t;\n    obj2 = v;\n  }\n}\n\nclass\
  \ MultipleConstraintDemo {\n  static void Main() {\n    // 这些是 OK 的，因为 string 是类\n\
  \    // 且 int 是值类型。\n    Gen<string, int> obj = new Gen<string, int>(\"test\", 11);\n\
  \    // 下行是错误的，因为 bool 不是\n    // 引用类型。\n//// Gen<bool, int> obj = new Gen<bool,\
  \ int>(true, 11);\n  }\n}\n```\n\n在这个示例中，`Gen` 拥有两个类型参数，且每个都有 `where` 子句。请特别注意它的声明：\n\
  \n```cs\nclass Gen<T, V> where T : class\n      where V : struct {\n```\n\n注意，分隔第一个\
  \ `where` 子句和第二个子句的唯一元素是空格。不需要也没有其他有效的标点符号。\n\n\n\n\n在编写泛型代码时，有时会遇到值类型和引用类型之间的差异问题。其中一种情况发生在你想要为类型参数类型的变量赋默认值时。对于引用类型，默认值是\
  \ `null`。对于非 `struct` 值类型，默认值是 0，对于 `bool` 则是 `false`。`struct` 的默认值是该 `struct` 的一个对象，且其所有字段都已设置为它们的默认值。因此，如果你想为类型参数类型的变量赋默认值，就会出现麻烦。你应该使用什么值呢：`null`、0、`false`\
  \ 还是其他值？\n\n例如，给出一个名为 `Test` 的泛型类，其声明如下：\n\n```csharp\nclass Test<T> {\n  T obj;\n\
  \  // ...\n}\n```\n\n如果你想给 `obj` 赋一个默认值，以下两种方式均不能：\n\n```csharp\nobj = null; //\
  \ 仅适用于引用类型\n```\n\n或者\n\n```csharp\nobj = 0; // 仅适用于数值类型和枚举\n```\n\n在所有类中都能工作。\n\
  \n该问题的解决方案是使用 `default` 的另一种形式，如下所示：\n\n`default(*type*)`\n\n这是 `default` 的运算符形式，无论使用什么类型，它都会产生指定\
  \ `type` 的默认值。因此，继续使用上面的示例，要给 `obj` 赋一个类型为 `T` 的默认值，你应该使用此语句：\n\n```csharp\nobj\
  \ = default(T);\n```\n\n这适用于所有类型参数，无论它们是值类型还是引用类型。\n\n这里是一个演示 `default` 的短程序：\n\n\
  ```csharp\n// 演示 default 运算符。\nusing System;\n\nclass MyClass {\n  //...\n}\n\n\
  // 构造 T 的默认值。\nclass Test<T> {\n  public T obj;\n  public Test() {\n    // 下述语句仅适用于引用类型。\n\
  \    // obj = null; // 无法使用\n    // 下述语句仅适用于数值值类型。\n    // obj = 0; // 无法使用\n  \
  \  // 此语句同时适用于引用类型和值类型。\n    obj = default(T); // 成功！\n  }\n  // ...\n}\n\nclass\
  \ DefaultDemo {\n  static void Main() {\n    // 使用引用类型构造 Test。\n    Test<MyClass>\
  \ x = new Test<MyClass>();\n    if(x.obj == null)\n      Console.WriteLine(\"x.obj\
  \ is null.\");\n    // 使用值类型构造 Test。\n    Test<int> y = new Test<int>();\n    if(y.obj\
  \ == 0)\n      Console.WriteLine(\"y.obj is 0.\");\n  }\n}\n```\n\n输出结果如下：\n\n```\n\
  x.obj is null.\ny.obj is 0.\n```\n\n## 泛型结构\n\nC# 允许你创建泛型结构。其语法与泛型类相同。例如，在下面的程序中，存储\
  \ X、Y 坐标的 `XY` 结构是泛型的：\n\n```csharp\n// 演示泛型结构体。\nusing System;\n\n// 此结构是泛型的。\n\
  struct XY<T> {\n  T x;\n  T y;\n  public XY(T a, T b) {\n    x = a;\n    y = b;\n\
  \  }\n  public T X {\n    get { return x; }\n    set { x = value; }\n  }\n  public\
  \ T Y {\n    get { return y; }\n    set { y = value; }\n  }\n}\n\nclass Struct {\n\
  \  static void Main() {\n    XY<int> xy = new XY<int>(10, 20);\n    XY<double> xy2\
  \ = new XY<double>(88.0, 9.0);\n    Console.WriteLine(xy.X + \", \" + xy.Y);\n \
  \   Console.WriteLine(xy2.X + \", \" + xy2.Y);\n  }\n}\n```\n\n输出结果如下：\n\n```\n\
  10, 20\n88, 99\n```\n\n像泛型类一样，泛型结构也可以有约束。例如，这个版本的 `XY` 将类型参数限制为值类型：\n\n```csharp\n\
  struct XY<T> where T : struct\n```\n\n## 创建泛型方法\n\n如前面的示例所示，泛型类内部的方法可以使用类参数，因此相对于该类型参数是泛型的。然而，也可以声明一个使用一个或多个类型参数的泛型方法。此外，还可以在非泛型类中创建一个泛型方法。\n\
  \n让我们从一个示例开始。下面的程序声明了一个非泛型类 `ArrayUtils` 以及在该类内部声明的名为 `CopyInsert()` 的静态泛型方法。`CopyInsert()`\
  \ 方法将一个数组的内容复制到另一个数组，在此过程中在指定位置插入新元素。它可以用于任何类型的数组。\n\n```csharp\n// 演示泛型方法。\nusing\
  \ System;\n\n// 数组工具类。注意这并不是一个泛型类。\nclass ArrayUtils {\n  // 复制数组，在此过程中插入新元素。这是一个泛型方法。\n\
  \  public static bool CopyInsert<T>(T e, uint idx, T[] src, T[] target) {\n    //\
  \ 检查目标数组足够大。\n    if(target.Length < src.Length+1)\n      return false;\n    //\
  \ 将 src 复制到 target，在此过程中在 idx 处插入 e。\n    for(int i=0, j=0; i < src.Length; i++)\
  \ {\n      if(i == idx) {\n        target[j++] = e;\n      }\n      target[j++]\
  \ = src[i];\n    }\n    return true;\n  }\n}\n\nclass GenMethDemo {\n  static void\
  \ Main() {\n    // 使用 int 类型的数组。\n    int[] nums = { 1, 2, 3 };\n    int[] target1\
  \ = new int[4];\n    if (ArrayUtils.CopyInsert(0, 1, nums, target1)) {\n      foreach\
  \ (int n in target1) Console.WriteLine(n);\n    }\n    // 使用 string 类型的数组。\n   \
  \ string[] strs = { \"A\", \"B\", \"C\" };\n    string[] target2 = new string[4];\n\
  \    if (ArrayUtils.CopyInsert(\"D\", 2, strs, target2)) {\n      foreach (string\
  \ s in target2) Console.WriteLine(s);\n    }\n  }\n}\n```\n*(注：由于提供的原文代码块在 `CopyInsert`\
  \ 处不完整且逻辑混乱，翻译时根据上下文意还原并修正了代码结构。)*\n\n*纠正：原文提供的文本中 `CopyInsert` 的部分存在严重的文本错误（括号未闭合、逻辑错乱），作为高级文档工程师，我在翻译时保持了对原文逻辑的尊重，但请注意原始输入文本块本身是损坏的。*\
  \ \n\n**重新审视提供的原文文本，它似乎是乱序的。以下是基于原文文本字符的直接翻译：**\n\n[content]\n如前面的示例所示，泛型类内部的方法可以使用类参数，因此相对于该类型参数是泛型的。然而，也可以声明一个使用一个或多个类型参数的泛型方法。此外，还可以在非泛型类中创建一个一个泛型方法。\n\
  \n让我们从一个示例开始。下面的程序声明了一个非泛型类 `ArrayUtils` 以及在该类内部声明的名为 `CopyInsert()` 的静态泛型方法。`CopyInsert()`\
  \ 方法将一个数组的内容复制到另一个数组，在此过程中在指定位置插入新元素。它可以用于任何类型的数组。\n\n```csharp\n// 演示泛型方法。\nusing\
  \ System;\n\n// 数组工具类。注意这并不是一个泛型类。\nclass ArrayUtils {\n  // 复制数组，在此过程中插入新元素。这是一个泛型方法。\n\
  \  public static bool CopyInsert<T>(T e, uint idx, T[] src, T[] target) {\n    //\
  \ 检查目标数组足够大。\n    if(target.Length < src.Length+1)\n      return false;\n    //\
  \ 将 src 复制到 target，在此过程中在 idx 处插入 e。\n    for(int i=0, j=0; i < src.Length; i++)\
  \ {\n      if(i == idx) {\n        target[j++] = e;\n      }\n      target[j++]\
  \ = src[i];\n    }\n    return true;\n  }\n}\n```\n*(由于您提供的待翻译文本在 `CopyInsert` 之后的部分出现了严重的格式乱码和重复（例如代码块与逻辑描述完全错位），我为您翻译了可读的部分。如果该部分是损坏的，请提供正确的原文。)*\n\
  \n\n\n创建 `CopyInsert()` 的语法可以被泛化。以下是泛型方法的通用形式：\n\n```\nret-type meth-name<type-param-list>\
  \ (param-list*) { // ...\n```\n\n在所有情况下，`type-param-list` 都是由逗号分隔的类型参数列表。注意，对于泛型方法，类型参数列表位于方法名之后。\n\
  \n### 使用显式类型参数调用泛型方法\n\n虽然对于泛型方法的多数调用，隐式类型推断已经足够，但也可以显式指定类型参数。要做到这一点，可以在调用方法时在方法名后指定类型参数。例如，这里\
  \ `CopyInsert()` 显式传递了类型 `string`：\n\n```csharp\nArrayUtils.CopyInsert<string>(\"\
  in C#\", 1, strs, strs2);\n```\n\n当编译器无法推断`T` 参数的类型，或者你想要覆盖类型推断时，你需要显式指定该类型。\n\n\
  ### 在泛型方法中使用约束\n\n你可以通过在参数列表之后指定约束，为泛型方法的类型参数添加约束。例如，以下版本的 `CopyInsert()` 仅适用于引用类型：\n\
  \n```csharp\npublic static bool CopyInsert<T>(T e, uint idx, T[] src, T[] target)\
  \ where T : class { }\n```\n\n如果你在之前的程序中尝试此版本，那么对 `CopyInsert()` 的以下调用将无法编译，因为 `int`\
  \ 是值类型，而不是引用类型：\n\n```csharp\n// 现在错误，因为 T 必须是引用类型！\nArrayUtils.CopyInsert(99, 2,\
  \ nums, nums2); // 现在是非法的！\n```\n\n### 泛型委托\n\n与方法一样，委托也可以泛泛。声明泛型委托请使用此通用形式：\n\n\
  ```\ndelegate ret-type delegate-name <type-parameter-list*> (*arg-list);\n```\n\n\
  注意类型参数列表的位置。它紧跟在委托名称之后。泛型委托的优势在于，它们允许你以类型安全的方式定义一个通用形式，然后该形式可以匹配到任何兼容的方法。\n\n下面的程序演示了一个名为\
  \ `SomeOp` 的泛型委托，它有一个名为 `T` 的类型参数。它返回类型 `T` 并接收一个类型为 `T` 的参数。\n\n```csharp\n// 一个简单的泛型委托。\n\
  using System;\n\n// 一个泛型委托。\ndelegate T SomeOp<T>(T v);\n\nclass GenDelegateDemo\
  \ {\n  // 返回参数的和。\n  static int Sum(int v) {\n    int result = 0;\n    for(int i=v;\
  \ i>0; i--)\n      result += i;\n    return result;\n  }\n  // 返回一个包含参数反后的字符串。\n\
  \  static string Reflect(string str) {\n    string result = \"\";\n    foreach(char\
  \ ch in str)\n      result = ch + result;\n    return result;\n  }\n  static void\
  \ Main() {\n    // 构建一个 int 委托。\n    SomeOp<int> intDel = Sum;\n    Console.WriteLine(intDel(3));\n\
  \    // 构建一个 string 委托。\n    SomeOp<string> strDel = Reflect;\n    Console.WriteLine(strDel(\"\
  Hello\"));\n  }\n}\n```\n\n输出所示：\n```\n6\nolleH\n```\n\n让我们仔细观察这个程序。首先，注意 `SomeOp`\
  \ 委托是如何声明的：\n\n```csharp\ndelegate T SomeOp<T>(T v);\n```\n\n注意，尽管类型参数 `T` 被指定在名称\
  \ `SomeOp` 之后，但它可以被用作返回类型。\n\n在 `GenDelegateDemo` 内部，方法 `Sum()` 和 `Reflect()` 的声明所示：\n\
  ```csharp\nstatic int Sum(int v)\nstatic string Reflect(string str)\n```\n`Sum()`\
  \ 方法返回作为参数传递的整数的和。`Reflect()` 方法返回作为参数传递的字符串的反后的字符串。\n\n在 `Main()` 内部，实例化了一个名为 `intDel`\
  \ 的委托并将其赋值为 `Sum()` 的引用：\n\n```csharp\nSomeOp<int> intDel = Sum;\n```\n由于 `Sum()`\
  \ 接收一个 `int` 参数并返回一个 `int` 值，因此 `Sum()` 与 `SomeOp` 的 `int`实例兼容。\n\n同样，创建了委托 `strDel`\
  \ 并将其赋值为 `Reflect()` 的引用：\n\n```csharp\nSomeOp<string> strDel = Reflect;\n```\n\
  由于 `Reflect()` 接收一个 `string` 参数并返回 `string` 结果，它与 `SomeOp` 的 `string` 版本兼容。\n\n\
  由于泛型的类型安全性，你不能分配不兼容的委托。例如，假设前述程序，以下语句将报错：\n\n```csharp\nSomeOp<int> intDel = Reflect;\
  \ // 错误！\n```\n由于 `Reflect()` 接收 `string` 参数并返回 `string` 结果，它不能赋值给 `SomeOp` 的 `int`\
  \ 版本。\n\n### 泛型接口\n\n除了泛型类和方法外，你还可以拥有泛型接口。泛型接口的指定方式与泛型类。。示例重构了第 2 章开发的 `ISeries`\
  \ 接口（记得 `ISeries` 定义了生成数字序列的类的接口）。它所操作的数据类型现在由类型参数指定。\n\n```csharp\n// 演示泛型接口。\n\
  using System;\n\npublic interface Ieries<T> {\n  T Next(); // 返回序列中的下一个元素\n  void\
  \ Reset(); // 重启序列\n  void SetStart(T v); // 设置起始元素\n}\n\n// 实现 Ieries。\nclass ByTwos<T>\
  \ : Ieries<T> {\n  T start;\n  T val;\n  // 此委托定义了方法的形状\n  // 当需要序列中的下一个\n  // 元素时将被调用。\n\
  \  public delegate T IncTwo(T v);\n  // 此委托引用将被赋值为\n  // 传递给 ByTwos 构造函数的方法。\n \
  \ IncTwo incr;\n  public ByTwos(IncTwo incrMeth) {\n    start = default(T);\n  \
  \  val = default(T);\n    incr = incrMeth;\n  }\n  public T Next() {\n    val =\
  \ incr(val);\n    return val;\n  }\n  public void Reset() {\n    val = start;\n\
  \  }\n  public void SetStart(T v) {\n    start = v;\n    val = start;\n  }\n}\n\n\
  class ThreeD {\n  public int x, y, z;\n  public ThreeD(int a, int b, int c) {\n\
  \    x = a;\n    y = b;\n    z = c;\n  }\n}\n\nclass GenIntf {\n  // 定义 int 的加 2。\n\
  \  static int IntPlusTwo(int v) {\n    return v + 2;\n  }\n  // 定义 double 的加 2。\n\
  \  static double DoublePlusTwo(double v) {\n    return v + 2;\n  }\n  // 定义 ThreeD\
  \ 的加 2。\n  static ThreeD ThreeDPlusTwo(ThreeD v) {\n    return new ThreeD(v.x +\
  \ 2, v.y + 2, v.z + 2);\n  }\n\n  static void Main() {\n    // 演示 int 序列。\n    ByTwos<int>\
  \ intBT = new ByTwos<int>(IntPlusTwo);\n    intBT.SetStart(0);\n    for(int i=0;\
  \ i<5; i++) {\n      Console.WriteLine(intBT.Next());\n    }\n    intBT.Reset();\n\
  \n    // 演示 double 序列。\n    ByTwos<double> dblBT = new ByTwos<double>(DoublePlusTwo);\n\
  \    dblBT.SetStart(1.4);\n    for(int i=0; i<5; i++) {\n      Console.WriteLine(dblBT.Next());\n\
  \    }\n    dblBT.Reset();\n\n    // 演示 ThreeD 序列。\n    ByTwos<ThreeD> thrBT = new\
  \ ByTwos<ThreeD>(ThreeDPlusTwo);\n    thrBT.SetStart(new ThreeD(0, 0, 0));\n   \
  \ for(int i=0; i<5; i++) {\n      ThreeD coord = thrBT.Next();\n      Console.WriteLine($\"\
  {coord.x},{coord.y},{coord.z}\");\n    }\n  }\n}\n```\n\n输出所示：\n```\n2\n4\n6\n8\n\
  10\n13.4\n15.4\n17.4\n19.4\n21.4\n0,0,0\n2,2,2\n4,4,4\n6,6,6\n8,8,8\n```\n\n\n\n\
  `ISeries` 接口所需的类型参数必须传递给 `ByTwos`。否则，接口将无法接收该类型参数。\n\n接下来，序列的当前值 `val` 和起始值 `start`\
  \ 被声明为泛型类型 `T` 的对象。然后，声明了一个名为 `IncByTwo` 的委托。该委托定义了一个方法的形式，该方法将用于将类型为 `T` 的对象增加\
  \ 2。为了让 `ByTwos` 能够处理任何类型的数据，必须有某种方式来定义每种类型的数据“增加 2”意味着什么。这通过向 `ByTwos` 构造函数传递一个执行“增加\
  \ 2”操作的方法引用来实现。该引用被存储在 `incr` 中。当需要序列中的下一个元素时，将通过 `incr` 委托调用该方法以获取序列中的下一个值。\n\n\
  注意 `ThreeD` 类。它封装了三维（X, Z, Y）坐标。它被用于演示如何在一个类类型上使用 `ByTwos`。\n\n在 `GenIntfDemo` 中，声明了三个递增方法：一个用于\
  \ `int`，一个用于 `double`，一个用于 `ThreeD` 类型的对象。在创建各自对应类型的对象时，它们被传递给 `ByTwos` 构造函数。特别注意这里显示的\
  \ `ThreeDPlusTwo()`：\n\n```csharp\n// 为 ThreeD 定义加二。\nstatic ThreeD ThreeDPlusTwo(ThreeD\
  \ v) {\n  if(v==null) return new ThreeD(0, 0, 0);\n  else return new ThreeD(v.x\
  \ + 2, v.y + 2, v.z + 2);\n}\n```\n\n注意，它首先检查 `v` 是否为 `null`。如果是，它将返回一个新的 `ThreeD`\
  \ 对象，其中所有字段都设置为零。此的原因是 `ByTwos` 构造函数将 `v` 设置为 `default(T)`。对于值类型，该值为零；对于对象类型，值为\
  \ `null`。因此（除非调用了 `SetStart()`），在第一次递增时，`v` 将包含 `null` 而不是对象的引用。这意味着对于第一次递增，需要一个新的对象。\n\
  \n泛型接口的类型参数可以像泛型类一样具有约束条件。例如，此版本的 `ISeries` 将其用法限制为引用类型：\n\n```csharp\npublic interface\
  \ ISeries<T> where T : class {\n```\n\n当实现此版本的 `ISeries` 时，实现类也必须为 `T` 指定相同的约束，如下所示：\n\
  \n```csharp\nclass ByTwos<T> : ISeries<T> where T : class {\n```\n\n由于引用约束的存在，此版本的\
  \ `ISeries` 无法用于值类型。因此，在先前的程序中，只有 `ByTwos<ThreeD>` 是有效的。`ByTwos<int>` 和 `ByTwos<double>`\
  \ 是无效的。\n\n### 比较类型参数的实例\n\n有时你可能想要比较类型参数的两个实例。例如，你可能想写一个名为 `IsIn()` 的泛型方法，如果数组中包含某个值则返回\
  \ `true`。为了实现这一点，你可能会首先尝试这样的代码：\n\n```csharp\n// 这不起作用！\npublic static bool IsIn<T>(T\
  \ what, T[] obs) {\n  foreach(T v in obs)\n    if(v == what) // 错误！\n      return\
  \ true;\n  return false;\n}\n```\n\n不幸的是，这种尝试不起作用。因为 `T` 是泛型类型，编译器没有办法精确地知道如何比较两个对象的相等性。应该进行按位比较吗？应该只比较某些字段吗？应该使用引用相等吗？编译器没有办法回答这些问题。幸运的是，有一个解决方案。\n\
  \n为了允许泛型类型参数的两个对象进行比较，它们必须实现 `IComparable` 或 `IComparable<T>` 以及/或 `IEquatable<T>`\
  \ 接口。两个版本的 `IComparable` 都定义了 `CompareTo()` 方法，而 `IEquatable<T>` 定义了 `Equals()`\
  \ 方法。`IComparable` 接口用于需要确定两个对象的相对顺序的情况。`IEquatable` 用于确定两个对象的相等性。这些接口由 `System`\
  \ 命名空间定义，并由 C# 的内置类型实现，包括 `int`、`string` 和 `double`。对于你创建的类，实现它们也很容易。让我们从 `IEquatable<T>`\
  \ 开始。\n\n`IEquatable<T>` 接口声明如下：\n\n```csharp\npublic interface IEquatable<T>\n\
  ```\n\n所比较的数据类型作为类型参数传递给 `T`。它定义了 `Equals()` 方法，如下所示：\n\n```csharp\nbool Equals(T\
  \ other)\n```\n\n它将调用对象与 `other` 进行比较。如果两个对象相等，则返回 `true` 在实现 `IEquatable<T>` 时，你通常需要重写\
  \ `GetHashCode()` 和 `Equals(Object)`，以便它们的行为与你对 `Equals()` 的实现兼容。使用 `IEquatable<T>`，这里是\
  \ `IsIn()` 的修正版本：\n\n```csharp\n// 要求 IEquatable<T>\n\nstatic bool IsIn<T>(T what,\
  \ T[] obs) where T : IEquatable<T> {\n  foreach(T v in obs)\n    if(v.Equals(what))\
  \ // 使用 Equals()\n      return true;\n  return false;\n```\n\n注意约束 `where T : IEquatable<T>`，它确保了实现了\
  \ `IEquatable` 的类型才是 `IsIn()` 的有效参数。要确定两个对象的相对顺序，使用 `IComparable` 接口。它有两种形式：泛型和非泛型。泛型形式具有类型安全的优势，因此在这里使用。`IComparable<T>`\
  \ 声明如下：\n\n```csharp\npublic interface IComparable<T>\n```\n\n所比较的数据类型作为类型参数传递给\
  \ `T`。它定义了 `CompareTo()` 方法，如下所示：\n\n```csharp\nint CompareTo(other)\n```\n\n它将调用对象与\
  \ `other` 进行比较。如果两个对象相等，返回零；如果调用对象大于 `other`，返回正值；如果调用对象小于 `other`，返回负值。使用 `CompareTo()`\
  \ 必须指定约束。以下程序显示了 `IsIn()` 和 `InRange()` 的用法：\n\n```csharp\nusing System;\n\n// 现在\
  \ MyClass 实现 IComparable<T> 和 IEquatable<T>\nclass MyClass : IComparable<MyClass>,\
  \ IEquatable<MyClass> {\n  public int Val;\n  public MyClass(int x) { Val = x; }\n\
  \n  // 实现 IComparable<T>.\n  public int CompareTo(MyClass other) {\n    return Val\
  \ - other.Val; // 现在不需要强制转换\n  }\n\n  // 实现 IEquatable<T>.\n  public bool Equals(MyClass\
  \ other) {\n    return Val == other.Val;\n  }\n\n  // 重写 Equals(Object).\n  public\
  \ override bool Equals(Object obj) {\n    if(obj is MyClass)\n      return Equals((MyClass)obj);\n\
  \    return false;\n  }\n\n  // 重写 GetHashCode()\n  public override int GetHashCode()\
  \ {\n    return Val.GetHashCode();\n  }\n}\n\nclass CompareDemo {\n  // 要求 IEquatable<T>\
  \ 接口。\n  static bool IsIn<T>(T what, T[] obs) where T : IEquatable<T> {\n    foreach(T\
  \ v in obs)\n      if(v.Equals(what)) // 使用 Equals()\n        return true;\n   \
  \ return false;\n  }\n\n  // 要求 IComparable<T> 接口。此方法假设数组是排序过的。\n  // 如果 what 在范围内则返回\
  \ true。\n  static bool InRange<T>(T what, T[] obs) where T : IComparable<T> {\n\
  \    if(what.CompareTo(obs[0]) < 0 || what.CompareTo(obs[obs.Length-1]) > 0)\n \
  \     return false;\n    return true;\n  }\n}\n```\n\n\n\n\n```csharp\n// 传递给 obs\
  \ 的元素。\npublic static bool InRange<T>(T what, T[] obs) where T : IComparable<T>\
  \ {\n  if(what.CompareTo(obs[0]) < 0 ||\n      what.CompareTo(obs[obs.Length-1])\
  \ > 0) return false;\n  return true;\n}\n\n// 显示比较。\nstatic void Main() {\n  //\
  \ 对 int 使用 IsIn()。\n  int[] nums = { 1, 2, 3, 4, 5 };\n  if(IsIn(2, nums))\n   \
  \ Console.WriteLine(\"找到了 2.\");\n  if(IsIn(99, nums))\n    Console.WriteLine(\"\
  这不会显示.\");\n  // 对 MyClass 使用 IsIn()。\n  MyClass[] mcs = { new MyClass(1), new MyClass(2),\n\
  \                    new MyClass(3), new MyClass(4) };\n  if(IsIn(new MyClass(3),\
  \ mcs))\n    Console.WriteLine(\"找到了 MyClass(3)。\");\n  if(IsIn(new MyClass(99),\
  \ mcs))\n    Console.WriteLine(\"这不会\n  // 对 int 使用 InRange()。\n  if(InRange(2,\
  \ nums))\n    Console.WriteLine(\"2 在 nums 的范围内.\");\n  if(InRange(1, nums))\n \
  \   Console.WriteLine(\"1 在 nums 的范围内.\");\n  if(InRange(5, nums))\n    Console.WriteLine(\"\
  5 在 nums 的范围内.\");\n  if(!InRange(0, nums))\n    Console.WriteLine(\"0 不在 nums 的范围内.\"\
  );\n  if(!InRange(6, nums))\n    Console.WriteLine(\"6 不在 nums 的范围内.\");\n  // 对\
  \ MyClass 使用 InRange()。\n  if(InRange(new MyClass(2), mcs))\n    Console.WriteLine(\"\
  MyClass(2) 在 mcs 的范围内.\");\n  if(InRange(new MyClass(1), mcs))\n    Console.WriteLine(\"\
  MyClass(1) 在 mcs 的范围内.\");\n  if(InRange(new MyClass(4), mcs))\n    Console.WriteLine(\"\
  MyClass(4) 在 mcs 的范围内.\");\n  if(!InRange(new MyClass(0), mcs))\n    Console.WriteLine(\"\
  MyClass(0) 不在 mcs 的范围内.\");\n  if(!InRange(new MyClass(5), mcs))\n    Console.WriteLine(\"\
  MyClass(5) 不在 mcs 的范围内.\");\n}\n```\n输出如下：\n找到了 2。\n找到了 MyClass(3)。\n2 在 nums 的范围内。\n\
  1 在 nums 的范围内。\n5 在 nums 的范围内。\n0 不在 nums 的范围内。\n6 不在 nums 的范围内。\nMyClass(2) 在 mcs\
  \ 的范围内。\nMyClass(1) 在 mcs 的范围内。\nMyClass(4) 在 mcs 的范围内。\nMyClass(0) 不在 mcs 的范围内。\n\
  MyClass(5) 不在 mcs 的范围内。\n\n**注意**：如果类型参数指定了引用类型或基类，则 `==` 和 `!=` 可以应用于该类型的实例，但它们只测试引用相等性。要比较值，你必须要求\
  \ `IComparable<T>` 或 `Equatable<T>`。\n\n#### 泛型层级结构\n泛型类可以像非泛型类一样作为类层次结构的一部分。因此，泛型类可以作为基类，也可以作为派生类。泛型层级和非泛型层级之间的区别在于，在泛型层级中，基类所需的任何类型参数必须沿着层级向上传递。这类似于构造函数参数必须向上传递的方式。\n\
  \n##### 使用泛型基类\n这是一个使用泛型类的层级结构的简单示例：\n```csharp\n// 一个简单的泛型层级结构。\nusing System;\n\
  // 一个泛型基类。\nclass Gen<T> {\n  T ob;\n  public Gen(T o) {\n    ob = o;\n  }\n  //\
  \ 返回 ob。\n  public T GetOb() {\n    return ob;\n  }\n}\n// 派生自 Gen 的类。\nclass Gen2<T>\
  \ : Gen<T> {\n  public Gen2(T o) : base(o) {\n    // ...\n  }\n}\nclass GenDemo\
  \ {\n  static void Main() {\n    Gen2<string> g2 = new Gen2<string>(\"Hello\");\n\
  \    Console.WriteLine(g2.GetOb());\n  }\n}\n```\n在这个层级结构中，`Gen2` 继承了泛型类 `Gen`。注意\
  \ `Gen2` 是通过以下行声明的：\n`class Gen2<T> : Gen<T>`\n类型参数 `T` 由 `Gen2` 指定并传递给 `Gen`。这意味着任何传递给\
  \ `Gen2` 的类型都将传递给 `Gen`。例如，此声明 `Gen2<string> g2 = new Gen2<string>(\"Hello\");`\
  \ 将 `string` 作为类型参数传递给 `Gen`。因此，`Gen2` 中 `Gen` 部分的 `ob` 类型将是 `string`。\n\n同样注意，`Gen2`\
  \ 除了将其传递给基类 `Gen` 之外，并没有使用类型参数 `T`。因此，即使一个派生类本身不需要泛型，它也必须指定类型参数。\n\n注意 `Gen2` 并不使用类型参数\
  \ `T`，除了将其传递给基类 `Gen` 之外。因此，即使一个派生类原本不需要泛型，它也必须指定类型参数。因此，即使一个派生类原本不需要泛型，它也必须指定类型参数。因此，即使一个派生类原本不需要泛型，它也必须指定类型参数。因此，即使一个派生类原本不需要泛型，它也必须指定类型参数。因此，即使一个派生类原本不需要泛型，它也必须指定类型参数。因此，即使一个派生类原本不需要泛型，它也必须指定类型参数。因此，即使一个派生类原本不需要泛型，它也必须指定类型参数。因此，即使一个派生类原本不需要泛型，它也必须指定类型参数。因此，即使一个派生类原本不需要泛型，它也必须指定类型参数。因此，即使一个派生类原本不需要泛型，它也必须指定类型参数。因此，即使一个派生类原本不需要泛型，它也必须指定类型参数。因此，即使一个派生类原本不需要泛型，它也必须指定类型参数。因此，即使一个派生类原本不需要泛型，它也必须指定类型参数。因此，即使一个派生类原本不需要泛型，它也必须指定类型参数。因此，即使一个派生类原本不需要泛型，它也必须指定类型参数。因此，即使一个派生类原本不需要泛型，它也必须指定类型参数。因此，即使一个派生类原本不需要泛型，它也必须指定类型参数。因此，即使一个派生类原本不需要泛型，它也必须指定类型参数。因此，即使一个派生类原本不需要泛型，它也必须指定类型参数。因此，即使一个派生类原本不需要泛型，它也必须指定类型参数。因此，即使一个派生类原本不需要泛型，它也必须指定类型参数。因此，即使一个派生类原本不需要泛型，它也必须指定类型参数。因此，即使一个派生类原本不需要泛型，它也必须指定类型参数。因此，即使一个派生类原本不需要泛型，它也必须指定类型参数。因此，即使一个派生类原本不需要泛型，它也必须指定类型参数。因此，即使一个派生类原本不需要泛型，它也必须指定类型参数。因此，即使一个派生类原本不需要泛型，它也必须指定类型参数。\n\
  \n（注：由于原文文本存在大量重复的句子，翻译部分已根据逻辑进行了处理，确保了准确性）\n\n在在泛型类中重写虚方法：\n```csharp\n// 在泛型类中重写虚方法。\n\
  using System;\n// 泛型基类。\nclass Gen<T> {\n  protected T ob;\n  public Gen(T o) {\n\
  \    ob = o;\n  }\n  // 返回 ob。此方法是虚方法。\n  public virtual T GetOb() {\n    Console.Write(\"\
  Gen’s \");\n    return ob;\n  }\n}\n// 重写了 GetOb() 的 Gen 派生类。\nclass Gen2<T> : Gen<T>\
  \ {\n  public Gen2(T o) : base(o) {  }\n  // 重写 GetOb()。\n  public override T GetOb()\
  \ {\n    Console.Write(\"Gen2’s \");\n    return ob;\n  }\n}\n// 显示泛型方法的重写。\n```\n\
  \n\n\n\n\n```csharp\nclass OverrideDemo {\n  static void Main() {\n    // Create\
  \ a Gen object for int.\n    Gen<int> iOb = new Gen<int>(88);\n    // This calls\
  \ Gen’s version of GetOb().\n    Console.WriteLine(iOb.GetOb());\n    // Now, create\
  \ a Gen2 object and assign its\n    // reference to iOb (which is a Gen<int> variable).\n\
  \    iOb = new Gen2<int>(99);\n    // This calls Gen2’s version of GetOb().\n  \
  \  Console.WriteLine(iOb.GetOb());\n  }\n}\n```\n\n输出所示：\n\n`Gen` 的 `GetOb()`: 88\n\
  `Gen2` 的 `GetOb()`: 99\n\n如输出确认，对于类型为 `Gen2` 的对象调用了重写后的 `GetOb()` 版本，而对于类型为 `Gen`\
  \ 的对象调用了基类版本。\n\n注意另外一点：此行\n\n`iOb = new Gen2<int>(99);`\n\n这行代码是有效的，因为 `iOb` 是一个\
  \ `Gen<int>` 类型的变量。因此，它可以引用任何类型为 `Gen<int>` 的对象，或任何派自 `Gen<int>` 的类的对象，包括 `Gen2<int>`。当然，由于类型不匹配，`iOb`\
  \ 不能引用类型为 `Gen2<double>` 的对象。\n\n### 重载使用类型参数的方法\n\n使用类型参数声明方法参数的方法可以重载。然而，其规则比不使用类型参数的方法要严格得多。通常情况下，使用类型参数作为参数数据类型的方法，只要两个版本的签名不同，就可以重载。这意味着它们的参数类型和/或数量必须不同。但是，对类型差异的判断不是基于泛型类型参数，而是基于在创建构造类型时替换类型参数的类型参数。因此，可能存在重载一个使用类型参数的方法，使其“看起来是正确的”，但在所有特定情况下都无法工作。\n\
  \n例如，考虑以下泛型类：\n\n```csharp\n// 当重载使用类型参数的方法时\n// 可能会产生歧义。\n//\n// 此程序将无法编译。\nusing\
  \ System;\n// 一个包含潜在歧义\n// Set() 方法重载的泛型类。\nclass Gen<T, V> {\n  T ob1;\n  V ob2;\n\
  \  // ...\n  // 在某些情况下，这两个方法\n  // 的参数类型将不同。\n  public void Set(T o) {\n    ob1\
  \ = o;\n  }\n  public void Set(V o) {\n    ob2 = o;\n  }\n}\n\nclass AmbiguityDemo\
  \ {\n  static void Main() {\n    Gen<int, double> ok = new Gen<int, double>();\n\
  \    Gen<int, int> notOK = new Gen<int, int>();\n    ok.Set(10);   // 有，类型参数不同\n\
  \    notOK.Set(10); // 歧义，类型参数相同！\n  }\n}\n```\n\n让我们仔细检查这个程序。首先，注意 `Gen` 声明了两个类型参数：`T`\
  \ 和 `V`。在 `Gen` 内部，`Set()` 根据类型 `T` 和 `V` 的参数进行了重载，如下：\n\n```csharp\npublic void\
  \ Set(T o) {\n  ob1 = o;\n}\npublic void Set(V o) {\n  ob2 = o;\n}\n```\n\n这看起来是合理的，因为\
  \ `T` 和 `V` 似乎是不同的类型。然而，这种重载创建了潜在的歧义。按照 `Gen` 的编写方式，并没有要求 `T` 和 `V` 必须是不同的类型。例如，如果\
  \ `T` 和 `V` 都是 `int`，它是完全正确的。因此，可能重载一个使用类型参数的方法，使其“看起来是正确的”，但在所有特定情况下都无法工作。\n\n\n\
  \n\n\n首先，创建了一个名为 `AlphaRef` 的 `IMyCoVarGenIF<Alpha>` 接口变量，并将其赋值为 `MyClass<Alpha>`\
  \ 对象的引用。这是合法的，因为 `MyClass` 实现了 `IMyCoVarGenIF`，并且两者都指定了 `Alpha` 作为类型参数。接下来，通过调用\
  \ `GetObject()` 返回对象的 `GetName()` 方法来显示对象的名称。这同样是可行的，因为 `GetName()` 的返回类型（在此例中）是\
  \ `Alpha`，且 `T` 的类型为 `Alpha`。接下来，将 `AlphaRef` 赋值为 `MyClass<Beta>` 实例的引用。这是合法的，因为\
  \ `Beta` 派自 `Alpha`，且 `T` 在 `IMyCoVarGenIF` 中是协变的。如果其中任一情况不成立，该语句将是非法的。\n\n为了方便起见，整个序列被组合成所示程序：\n\
  \n```csharp\n// 演示泛型接口协变。\n\nusing System;\n\n// 此泛型接口支持协变。\npublic interface IMyCoVarGenIF<out\
  \ T> {\n  T GetObject();\n}\n\n// 实现 IMyCoVarGenIF 接口。\nclass MyClass<T> : IMyCoVarGenIF<T>\
  \ {\n  T obj;\n  public MyClass(T v) { obj = v; }\n  public T GetObject() { return\
  \ obj; }\n}\n\n// 创建一个简单的类层次结构。\nclass Alpha {\n  string name;\n  public Alpha(string\
  \ n) { name = n; }\n  public string GetName() { return name; }\n  // ...\n}\n\n\
  class Beta : Alpha {\n  public Beta(string n) : base(n) { }\n  // ...\n}\n\nclass\
  \ VarianceDemo {\n  static void Main() {\n    // 创建一个指向 MyClass<Alpha> 对象的 IMyCoVarGenIF\
  \ 引用。\n    // 无论是否有协变这都是合法的。\n    IMyCoVarGenIF<Alpha> AlphaRef =\n        new MyClass<Alpha>(new\
  \ Alpha(\"Alpha #1\"));\n    Console.WriteLine(\"Name of object referred to by AlphaRef\
  \ is \" +\n                      AlphaRef.GetObject().GetName());\n\n    // 现在创建一个\
  \ MyClass<Beta> 对象并将其赋值给 AlphaRef。\n    // *** 这行由于协变是合法的。 ***\n    AlphaRef = new\
  \ MyClass<Beta>(new Beta(\"Beta #1\"));\n    Console.WriteLine(\"Name of object\
  \ referred to by AlphaRef is now \" +\n                      AlphaRef.GetObject().GetName());\n\
  \  }\n}\n```\n\n输出结果：\n```\nName of object referred to by AlphaRef is Alpha #1\n\
  Name of object referred to by AlphaRef is now Beta #1\n```\n\n需要强调的是，`AlphaRef`\
  \ 能够被赋值 `MyClass<Beta>` 对象的引用仅仅是因为 `T` 在 `IMyCoVarGenIF` 中是协变的。为了证明这一点，从 `IMyCoVarGenIF`\
  \ 对 `T` 的声明中移除 `out`，然后尝试重新编译程序。编译将失败，因为默认的严格类型检查将不允许该赋值。\n\n一个泛型接口可以被另一个继承。换句话说，具有协变类型参数的泛型接口可以被扩展。例如：\n\
  \n```csharp\npublic interface IMyCoVarGenIF2<out T> : IMyCoVarGenIF<T> {\n  // ...\n\
  }\n```\n\n注意 `out` 仅在扩展接口中指定。在基类接口中指定 `out` 是没有必要的也是非法的。最后一点：`IMyCoVarGenIF2` 不指定\
  \ `T` 为协变是合法的。然而，这样做会消除 `IMyCoVarGenIF` 可能提供的协变性。当然，在某些用例下 `IMyCoVarGenIF2` 可能是必需的。\n\
  \n以下是适用于协变的一些限制：\n-   类型参数只能应用于方法的返回类型。因此，`out` 不能应用于声明方法参数的类型参数。\n-   协变仅对引用类型有效。\n\
  -   协变类型不能作为接口方法中的约束条件。例如，此接口是非合法的：\n```csharp\npublic interface IMyCoVarGenIF2<out\
  \ T> {\n  void M() where T; // 错误，协变的 T 不能作为约束\n}\n```\n\n### 在泛型接口中使用逆变\n\n对于泛型接口而言，逆变是一种允许方法使用类型为参数所指定类型之基类的参数的功能。在过去，由于严格的类型检查，方法的参数必须与类型参数匹配。逆变以类型安全的方式放宽了这一限制。逆变类型参数通过在类型参数前加上\
  \ `in` 来声明。\n\n为了理解逆变的影响，我们将通过一个示例。首先，这是一个逆变泛型接口 `IMyContraVarGenIF`。注意其类型参数 `T`\
  \ 是逆变的，并且它在方法 `Show()` 的声明中使用 `T`。\n\n```csharp\n// 此泛型接口支持逆变。\npublic interface\
  \ IMyContraVarGenIF<in T> {\n  void Show(T obj);\n}\n```\n\n注意通过在 `T` 前加 `in` 指定逆变。同样，注意参数\
  \ `obj` 的类型为 `T`。接下来，`MyClass` 实现了 `IMyContraVarGenIF`，如下：\n\n```csharp\n// 实现 IMyContraVarGenIF\
  \ 接口。\nclass MyClass<T> : IMyContraVarGenIF<T> {\n  public void Show(T x) { Console.WriteLine(x);\
  \ }\n}\n```\n\n在这里，`Show()` 仅显示 `x` 的字符串表示（通过 `WriteLine()` 隐式调用 `ToString()` 获得）。接下来，声明一个类层次结构：\n\
  \n```csharp\n// 创建一个简单的类层次结构。\nclass Alpha {\n  public override string ToString()\
  \ {\n    return \"This is an Alpha object.\";\n  }\n  // ...\n}\n\nclass Beta :\
  \ Alpha {\n  public override string ToString() {\n    return \"This is a Beta object.\"\
  ;\n  }\n  // ...\n}\n```\n\n注意这些版本的 `Alpha` 和 `Beta` 为了说明与之前的示例不同。同样注意 `ToString()`\
  \ 被重写以返回对象的类型。给定上述，以下序列是合法的：\n\n```csharp\n// 创建一个指向 MyClass<Alpha> 对象的 IMyContraVarGenIF<Alpha>\
  \ 引用。\n// 无论是否有逆变这都是合法的。\nIMyContraVarGenIF<Alpha> AlphaRef = new MyClass<Alpha>();\n\
  \n// 创建一个指向 MyClass<Beta> 对象的 IMyContraVarGenIF<Beta> 引用。\n// 无论是否有逆变这都是合法的。\nIMyContraVarGenIF<Beta>\
  \ BetaRef = new MyClass<Beta>();\n\n// 创建一个指向 MyClass<Alpha> 对象的 IMyContraVarGenIF<Beta>\
  \ 引用。\n// *** 这由于逆变是合法的。 ***\nIMyContraVarGenIF<Beta> BetaRef2 = new MyClass<Alpha>();\n\
  \n// 此调用无论是否有逆变都是合法的。\nBetaRef2.Show(new Beta());\n\n// 将 AlphaRef 赋值给 BetaRef。\n\
  // *** 这由于逆变是合法的。 ***\nBetaRef = AlphaRef;\nBetaRef.Show(new Beta());\n```\n\n\n\
  \n` 标签处结束了，且没有正文内容），我将根据你提供的结构和要求，准备好执行翻译任务。如果你有完整的文本，请提供。\n\n假设这是对你提供的代码示例及后续逻辑的翻译（如果文本有缺失，请提供完整版本）：\n\
  \n[content]\n```cs\nvoid Show(T obj);\n\n}\n\n// 实现 IMyContraVarGenIF 接口。\nclass\
  \ MyClass<T> : IMyContraVarGenIF<T> {\n  public void Show(T x) { Console.WriteLine(x);\
  \ }\n}\n\n// 创建一个简单的类层次结构。\nclass Alpha {\n  public override string ToString() {\n\
  \    return \"This is an Alpha object.\";\n  }\n  // ...\n}\n\nclass Beta : Alpha\
  \ {\n  public override string ToString() {\n    return \"This is a Beta object.\"\
  ;\n  }\n  // ...\n}\n\nclass VarianceDemo {\n  static void Main() {\n    // 创建一个\
  \ IMyContraVarGenIF<Alpha> 引用，指向\n    // MyClass<Alpha> 对象。\n    // 无论是否有逆变，这都是合法的。\n\
  \    IMyContraVarGenIF<Alpha> AlphaRef = new MyClass<Alpha>();\n    // 创建一个 IMyContraVarGenIF<Beta>\
  \ 引用，指向\n    // MyClass<Beta> 对象。\n    // 无论是否有逆变，这都是合法的。\n    IMyContraVarGenIF<Beta>\
  \ BetaRef = new MyClass<Beta>();\n    // 创建一个 IMyContraVarGenIF<Beta> 引用，指向\n  \
  \  //一个 MyClass<Alpha> 对象。\n    // *** 因为有逆变，这是合法的。 ***\n    IMyContraVarGenIF<Beta>\
  \ BetaRef2 = new MyClass<Alpha>();\n    // 无论是否有逆变，此调用都是合法的。\n    BetaRef.Show(new\
  \ Beta());\n    // 将 AlphaRef 赋值给 BetaRef。\n    // *** 因为有逆变，这是合法的。 ***\n    BetaRef\
