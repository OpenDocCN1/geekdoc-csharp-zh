  \n### Stack<T> 类\n\n`Stack<T>` 是非泛型 `Stack` 类的泛型等价物。`Stack<T>` 支持后进先出的栈。它实现了 `ICollection`、`IEnumerable`\
  \ 以及 `IEnumerable<T>` 接口。`Stack<T>` 直接实现了 `ICollection<T>` 定义的 `Clear()`、`Contains()`\
  \ 和 `CopyTo()` 方法。（不支持 `Add()` 和 `Remove()` 方法，也不支持 `IsReadOnly` 属性。）\n\n`Stack<T>`\
  \ 是一个动态集合，根据需要增长以容纳它必须存储的元素。它定义了以下构造函数：\n\n```csharp\npublic Stack()\npublic Stack(int\
  \ capacity)\npublic Stack(IEnumerable<T> collection)\n```\n\n\n\n\n第一种形式创建一个具有默认初始容量的空栈。第二种形式创建一个初始容量由\
  \ `capacity` 指定的空栈。第三种形式创建一个包含由 `collection` 指定的集合中元素的栈。\n\n除了它所实现的接口所定义的方法外（以及它独立实现的\
  \ `ICollection<T>` 所定义的那些方法），`Stack<T>` 还定义了 表 25-20 所示的方法。`Stack<T>` 的工作方式与其非泛型对应版本完全相同。要将对象推入栈顶，调用\
  \ `Push()`。要移除并返回栈顶元素，调用 `Pop()`。你可以使用 `Peek()` 返回但并不移除栈顶对象。如果在调用的栈为空时调用 `Pop()`\
  \ 或 `Peek()`，则会抛出 `InvalidOperationException`。\n\n![Image](img/t0864-01.jpg)\n\n\
  **表 25-20** `Stack<T>` 定义的方法\n\n以下程序演示了 `Stack<T>`：\n\n```csharp\n// Demonstrate\
  \ the Stack<T> class.\nusing System;\nusing System.Collections.Generic;\nclass GenStackDemo\
  \ {\n  static void Main() {\n    Stack<string> st = new Stack<string>();\n    st.Push(\"\
  One\");\n    st.Push(\"Two\");\n    st.Push(\"Three\");\n    st.Push(\"Four\");\n\
  \    st.Push(\"Five\");\n    while(st.Count > 0) {\n      string str = st.Pop();\n\
  \      Console.Write(str + \" \");\n    }\n    Console.WriteLine();\n  }\n}\n```\n\
  \n输出所示：\nFive Four Three Two One\n\n### Queue<T> 类\n\n`Queue<T>` 是非泛型 `Queue` 类的泛型等效类。它支持先进先出的列表。`Queue<T>`\
  \ 实现了 `ICollection`、`IEnumerable` 和 `IEnumerable<T>` 接口。`Queue<T>` 直接实现了 `ICollection<T>`\
  \ 定义的 `Clear()`、`Contains()` 和 `CopyTo()` 方法。（不支持 `Add()` 和 `Remove()` 方法，也不支持 `IsReadOnly`\
  \ 属性。）`Queue <T>` 是一个动态集合，会根据需要增长以容纳它必须存储的元素。它定义了以下构造函数：\n\n```csharp\npublic Queue(\
  \ )\npublic Queue(int capacity)\npublic Queue(IEnumerable<T> collection)\n```\n\n\
  第一种形式创建一个具有默认初始容量的空队列。第二种形式创建一个初始容量由 `capacity` 指定的空队列。第三种形式创建一个包含由 `collection`\
  \ 指定的集合中元素的队列。\n\n除了它所实现的接口所定义的方法外（以及它独立实现的 `ICollection<T>` 所定义的那些方法），`Queue<T>`\
  \ 定义了 表 25-21 所示的方法。`Queue<T>` 的工作方式与其非泛型对应版本完全相同。要将对象放入队列，调用 `Enqueue()`。要移除并返回队列前面的对象，调用\
  \ `Dequeue()`。你可以使用 `Peek()` 返回但不移除下一个对象。如果在调用的队列为空时调用 `Dequeue()` 或 `Peek()`，则会抛出\
  \ `InvalidOperationException`。\n\n![Image](img/t0866-01.jpg)\n\n**表 25-21** `Queue<T>`\
