  \ 显示 X, Y, Z 坐标。\n  public void Show()\n  {\n    Console.WriteLine(x + \", \" +\
  \ y + \", \" + z);\n  }\n}\n```\n\n\n\n\n由于您提供的原始文本似乎是一个不完整的代码片段（结尾在 `}` 处且逻辑有断层），我根据您提供的格式要求，对代码块中的注释部分进行了翻译，并保持了所有\
