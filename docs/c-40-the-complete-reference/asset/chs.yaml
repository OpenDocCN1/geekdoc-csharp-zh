  \n### 数组类\n\n`System` 中一个非常实用的类是 `Array`。`Array` 是 C# 中所有数组的基类。因此，它的方法可以应用于任何内置类型的数组或你创建的数组。`Array`\
  \ 定义了如 表 21-11 所示的属性。它定义了如 表 21-12 所示的属性。`Array` 实现了以下接口：`ICloneable`、`ICollection`、`IEnumerable`、`IComparable`\
  \ 和 `IList`。除 `ICloneable` 之外，这些都位于 `System` 命名空间。`Array` 的方法使用 `IComparer` 类型的参数。`IComparer`\
  \ 接口定义了 `Compare()` 方法，如 第 24 章 所示。`IComparer<T>` 定义了泛型 `Compare()` 方法，与其非泛型方法相同：当\
  \ `x` 大于 `y` 时返回正数，当 `x` 小于 `y` 时返回负数，当两者相等时返回 0。\n\n#### 排序与搜索\n\n你经常需要对数组的内容进行排序。为了处理这一点，`Array`\
  \ 支持丰富的排序方法。使用 `Sort()`，你可以对整个数组、数组中的某个范围或包含键值对的数组进行排序。一旦数组经过排序，就可以使用 `BinarySearch()`\
  \ 对其进行高效搜索。这里是一个演示 `int` 数组使用 `Sort()` 和 `BinarySearch()` 方法的程序：\n\n```csharp\n\
  // Sort an array and search for a value.\nusing System;\n\nclass SortDemo {\n  static\
  \ void Main() {\n    int[] nums = { 5, 4, 6, 3, 14, 9, 8, 17, 1, 24, -1, 0 };\n\
  \    // 显示原始顺序。\n    Console.Write(\"Original order:\");\n    foreach(int i in nums)\n\
  \      Console.Write(i + \"\");\n    Console.WriteLine();\n    // 排序数组。\n    Array.Sort(nums);\n\
  \    // 显示排序后的顺序。\n    Console.Write(\"Sorted order:  \");\n    foreach(int i in\
  \ nums)\n      Console.Write(i + \"\");\n    Console.WriteLine();\n    // 搜索 14。\n\
  \    int idx = Array.BinarySearch(nums, 14);\n    Console.WriteLine(\"Index of 14\
  \ is \" + idx);\n  }\n}\n```\n\n输出所示：\n\n```\nOriginal order:5 4 6 3 14 9 8 17 1\
  \ 24 -1 0\nSorted order:  -1 0 1 3 4 5 6 8 9 14 17 24\nIndex of 14 is 9\n```\n\n\
  \n\n在前面的示例中，该数组的元素类型为 `int`，这是一种值类型。`Array` 定义的所有方法都对所有内置值类型自动可用。然而，对于对象引用的数组，情况可能并非如此。要对对象引用数组进行排序或搜索，对象的类类型必须实现\
  \ `IComparable` 或 `IComparable<T>` 之一。如果类没有实现这些接口之一，则在尝试排序或搜索数组时会发生运行时异常。幸运的是，`IComparable`\
  \ 和 `IComparable<T>` 都易于实现。\n\n### IComparable\n`IComparable` 只定义了一个方法：\n\n```csharp\n\
  int CompareTo(object obj)\n```\n\n该方法将调用者对象与 `obj` 中的值进行比较。如果调用者对象大于 `obj`，则返回大于零的值；如果两个对象相等，返回零；如果调用者对象小于\
  \ `obj`，则返回小于零的值。\n\n### IComparable<T>\n`IComparable<T>` 是 `IComparable` 的泛型版本。它定义了\
  \ `CompareTo()` 的泛型版本：\n\n```csharp\nint CompareTo(T other)\n```\n\n`CompareTo()`\
  \ 的泛型版本与非泛型版本一样。它将调用者对象与 `other` 中的值进行比较。如果调用者对象大于 `other`，则返回大于零；如果两个对象相等，返回零；如果调用者对象小于\
  \ `other`，则返回小于零。使用 `IComparable<T>` 的优势是类型安全，因为所操作的数据类型被显式指定。不需要将正在比较的对象从 `object`\
  \ 强制转换为所需的类型。以下示例说明了如何对用户定义类数组进行排序和搜索：\n\n```csharp\n// 排序和搜索对象数组。\nusing System;\n\
  \nclass MyClass : IComparable<MyClass> {\n  public int i;\n  public MyClass(int\
  \ x) { i = x; }\n  // 实现 IComparable<MyClass>.\n  public int CompareTo(MyClass v)\
  \ {\n    return i - v.i;\n  }\n}\n\nclass SortDemo {\n  static void Main() {\n \
  \   MyClass[] nums = new MyClass[5];\n    nums[0] = new MyClass(5);\n    nums[1]\
  \ = new MyClass(2);\n    nums[2] = MyClass(3);\n    nums[3] = new MyClass(4);\n\
  \    nums[4] = new MyClass(1);\n    // 显示原始顺序。\n    Console.Write(\"Original order:\
  \ \");\n    foreach(MyClass o in nums)\n      Console.Write(o.i + \"\");\n    Console.WriteLine();\n\
  \    // 对数组排序。\n    Array.Sort(nums);\n    // 显示排序后的顺序。\n    Console.Write(\"Sorted\
  \ order: \");\n    foreach(MyClass o in nums)\n      Console.Write(o.i + \"\");\n\
  \    Console.WriteLine();\n    // 查找 MyClass(2)。\n    MyClass x = new MyClass(2);\n\
  \    int idx = Array.BinarySearch(nums, x);\n    Console.WriteLine(\"Index of MyClass(2)\
  \ is \" + idx);\n  }\n}\n```\n\n输出显示此处：\nOriginal order: 5 2 3 4 1\nSorted order:\
  \   1 2 3 4 5\nIndex of MyClass(2) is 1\n\n在对字符串数组进行排序或搜索时，你可能需要显式指定如何比较这些字符串。例如，如果数组使用一种文化设置进行排序，并在另一个设置下进行搜索，则可能需要显式指定比较方法以避免错误。或者，你可能想使用与当前设置不同的文化设置对字符串数组进行排序。为了处理这些（以及其他）情况，你可以将\
  \ `StringComparer` 实例传递给 `Sort()` 和 `BinarySearch()` 多个重载支持的 `IComparer` 参数。\n\n\
  ***注意** 请参见第 2 章中关于字符串比较问题的讨论。`StringComparer` 声明在 `System` 命名空间中，与其他接口一样，它实现了 `IComparer`\
  \ 和 `IComparer<T>` 接口。因此，可以将 `StringComparer` 实例作为参数传递给 `IComparer` 参数。`StringComparer`\
  \ 定义了几个只读属性，返回 `StringComparer` 实例并支持各种类型的字符串比较。它们显示在此：![Image](img/t675-01.jpg)\n\
  \n通过显式传递 `StringComparer`，你可以明确地确定排序或搜索将如何完成。例如，以下代码使用 `StringComparer.Ordinal`\
  \ 对字符串数组进行排序和搜索：\n\n```csharp\nstring[] strs = { \"xyz\", \"one\", \"beta\", \"\
  Alpha\" };\n// ...\nArray.Sort(strs, StringComparer.Ordinal);\nint idx = Array.BinarySearch(strs,\
  \ \"beta\", StringComparer.Ordinal);\n```\n\n### 反转数组\n有时反转数组的内容是有用的。例如，你可能想将一个已经按升序排序的数组改为降序排列。反转数组是简单的：只需调用\
  \ `Reverse()` 即可。使用 `Reverse()`，你可以反转整个或部分数组。以下程序演示了这一过程：\n\n```csharp\n// 反转数组。\n\
  using System;\nclass ReverseDemo {\n  static void Main() {\n    int[] nums = { 1,\
  \ 2, 3, 4, 5 };\n    // 显示原始顺序。\n    Console.Write(\"Original order: \");\n    foreach(int\
  \ i in nums)\n      Console.Write(i + \"\");\n    Console.WriteLine();\n    // 反转数组。\n\
  \    Array.Reverse(nums);\n    // 显示反转后的顺序。\n    Console.Write(\"Reversed order:\
  \ \");\n    foreach(int i in nums)\n      Console.Write(i + \"\");\n    Console.WriteLine();\n\
  \  }\n}\n```\n*注：此处原文代码逻辑似乎漏掉了 Array.Reverse(nums) 调用，但根据上下文描述翻译应保持逻辑一致。*\n\n输出显示此处：\n\
  Original order: 1 2 3 4 5\nReversed order: 5 4 3 2 1\n\n### 复制数组\n将一个数组全部或部分复制到另一个数组是有用的。例如，你可能想将一个数组复制到另一个已经存在的数组中。要复制数组，请使用\
  \ `Copy()`。以下程序演示了这一操作：\n\n```csharp\n// 复制数组。\nusing System;\nclass CopyDemo {\n\
  \  static void Main() {\n    int[] source = { 1, 2, 3, 4, 5 };\n    int[] target\
  \ = { 11, 12, 13, 14, 15 };\n    // 显示源。\n    Console.Write(\"source:\");\n    foreach(int\
  \ i in source)\n      Console.Write(i + \"\");\n    Console.WriteLine();\n    //\
  \ 显示原始目标。\n    Console.Write(\"Original contents of target:\");\n    foreach(int\
  \ i in target)\n      Console.Write(i + \"\");\n    Console.WriteLine();\n    //\
  \ 复制整个数组。\n    Array.Copy(source, target, source.Length);\n    // 显示复制后的目标。\n  \
  \  Console.Write(\"target after copy:\");\n    foreach(int i in target)\n      Console.Write(i\
  \ + \"\");\n    Console.WriteLine();\n  }\n}\n```\n\n输出显示此处：\nsource: 1 2 3 4 5\n\
  Original contents of target: 11 12 13 14 15\ntarget after copy: 1 2 3 4 5\n\n###\
  \ 使用谓词 (Predicate)\n*谓词* 是一种 `System.Predicate` 类型的委托，根据某些条件返回真或假。它的定义如下所示：\n\n\
  ```csharp\npublic delegate bool Predicate<in T> (T obj)\n```\n\n将用于测试条件的对象传入 `obj`。如果\
  \ `obj` 满足该条件，谓词必须返回真；否则，必须返回假。谓词被 `Array` 中的多个方法使用，包括 `Exists()`、`Find()`、`FindIndex()`\
  \ 和 `FindAll()`。\n\n以下程序演示了如何使用谓词判断整数数组是否包含负值。如果找到了负值，程序将获取数组中的第一个负值。为了完成这一点，程序使用了\
  \ `Exists()` 和 `Find()`。\n\n```csharp\n// 演示谓词委托。\nusing System;\nclass PredDemo\
  \ {\n  // 谓词方法。\n  public static bool IsNegative(int v) {\n    return v < 0;\n \
  \ }\n  static void Main() {\n    int[] nums = { 1, 2, -3, 4, -5 };\n    // 检查是否存在负值。\n\
  \    if (Array.Exists(nums, IsNegative)) {\n      Console.WriteLine(\"Array contains\
  \ a negative value.\");\n    }\n    // 查找第一个负值。\n    int result = Array.Find(nums,\
  \ IsNegative);\n    Console.WriteLine(\"First negative value is \" + result);\n\
  \  }\n}\n```\n\n\n\n\n```csharp\n  static bool IsNeg(int v) {\n    if(v < 0) return\
  \ true;\n    return false;\n  }  static void Main() {\n    int[] nums = { 1, 4,\
  \ -1, 5, -9 };\n    Console.Write(\"Contents of nums:\");\n    foreach(int i in\
  \ nums)\n      Console.Write(i + \"\");\n    Console.WriteLine();\n    // First\
  \ see if nums contains a negative value.\n    if(Array.Exists(nums, PredDemo.IsNeg))\
  \ {\n      Console.WriteLine(\"nums contains a negative value.\");\n      // Now,\
  \ find first negative value.\n      int x = Array.Find(nums, PredDemo.IsNeg);\n\
  \      Console.WriteLine(\"First negative value is : \" + x);\n    }\n    else\n\
  \      Console.WriteLine(\"nums contains no negative values.\");\n  }\n}\n```\n\n\
  输出所示：\n\nContents of nums: 1 4 -1 5 -9\n\nnums contains a negative value.\n\nFirst\
  \ negative value is : -1\n\n在程序中，传递给 `Exists()` 和 `Find()` 的谓词方法是 `IsNeg()`。注意 `IsNeg()`\
  \ 的声明如下：\n\n```csharp\nstatic bool IsNeg(int v) {\n```\n\n`Exists()` 和 `Find()`\
  \ 方法会自动将数组元素（按顺序）传递给 `v`。因此，每调用一次 `IsNeg()`，`v` 就会包含数组中的下一个元素。\n\n### 使用 Action\n\
  \n`Action` 委托被 `Array.ForEach()` 用于对数组的每个元素执行操作。`Action` 有多种形式，每种形式接受不同数量的类型参数。这里用到的是：\n\
  \n```csharp\npublic delegate void Action<in T> (T *obj*)\n```\n\n要执行操作的对象通过 `obj*`\
  \ 传递。当与 `ForEach()` 使用时，数组的每个元素会轮流传递给 `obj`。因此，通过使用 `ForEach()` 和 `Action`，你可以在一个语句中对整个数组执行操作。\n\
  \n下面的程序演示了 `ForEach()` 和 `Action` 的用法。它首先创建一个 `MyClass` 对象的数组，然后使用 `Show()` 方法显示值。接下来，它使用\
  \ `Neg()` 对值取反。最后，它再次使用 `Show()` 显示取反后的值。这些操作都是通过调用 `ForEach()` 完成的。\n\n```csharp\n\
  // Demonstrate an Action.\n\nusing System;\n\nclass MyClass {\n  public int i;\n\
  \  public MyClass(int x) { i = x; }\n}\n\nclass ActionDemo {\n  // An Action 方法。\n\
  \  // 它显示传递给的值。\n  static void Show(MyClass o) {\n    Console.Write(o.i + \"\");\n\
  \  }\n  // 另一个 Action 方法。\n  // 它将传递的值取反。\n  static void Neg(MyClass o) {\n    o.i\
  \ = -o.i;\n  }\n  static void Main() {\n    MyClass[] nums = new MyClass[5];\n \
  \   nums[0] = new MyClass(5);\n    nums[1] = new MyClass(2);\n    nums[2] = new\
  \ MyClass(3);\n    nums[3] = new MyClass(4);\n    nums[4] = new MyClass(1);\n  \
  \  Console.Write(\"Contents of nums:\");\n    // 使用 action 显示值。\n    Array.ForEach(nums,\
  \ ActionDemo.Show);\n    Console.WriteLine();\n    // 使用 action 取反值。\n    Array.ForEach(nums,\
  \ ActionDemo.Neg);\n    Console.Write(\"Contents of nums negated:\");\n    // 再次使用\
  \ action 将值取反。\n    Array.ForEach(nums, ActionDemo.Show);\n    Console.WriteLine();\n\
  \  }\n}\n```\n\nContents of nums: 5 2 3 4 1\n\nContents of nums negated: -5 -2 -3\
  \ -4 -1\n\n### BitConverter\n\n在编程中，通常需要将内置数据类型转换为字节数组。例如，某些硬件可能需要一个整数值，但该值必须逐字节发送。反向情况也经常发生。有时数据以有序字节序列的形式接收，需要转换为内置类型之一。无论你的转换需求如何，.NET\
  \ 均提供了 `BitConverter` 类来满足这些需求。\n\n`BitConverter` 是一个 `static` 类。它包含了表 21-13 所示的方法。它定义了以下字段：\n\
  \n```csharp\npublic static readonly bool IsLittleEndian\n```\n\n如果当前环境以低位字节在前、高位字节在后的方式存储字，则该字段为\
  \ `true`。这被称为“小端”（little-endian）格式。如果当前环境以高位字节在前、低位字节在后的方式存储字，则 `IsLittleEndian`\
  \ 为 `false`。这被称为“大端”（big-endian）格式。基于 Pentium 的机器使用小端格式。\n\n### 使用 Random 生成随机数\n\
  \n要生成伪随机数序列，你需要使用 `Random` 类。随机数序列在各种情况下都有用，包括模拟和建模。序列的起点由 `seed` 值决定，该值可以由 `Random`\
  \ 自动提供，也可以显式指定。\n\n`Random` 定义了这两个构造函数：\n\n```csharp\npublic Random( )\npublic Random(int\
  \ Seed*)\n```\n\n第一个版本创建一个使用系统时间计算种子值的 `Random` 对象。第二个使用 `Seed` 的值作为种子。`Random`\
  \ 定义了表 21-14 所示的方法。\n\n这里是一个通过创建一对电脑骰子演示 `Random` 的程序：\n\n```csharp\n// An automated\
  \ pair of dice.\n\nusing System;\n\nclass RandDice {\n  static void Main() {\n \
  \   Random ran = new Random();\n    Console.Write(ran.Next(1, 7) + \"\");\n    Console.WriteLine(ran.Next(1,\
  \ 7));\n  }\n}\n```\n\n以下是三次示例运行：\n\n5 2\n\n4 4\n\n1 6\n\n该程序的工作原理首先创建一个 `Random`\
  \ 对象。然后请求两个位于 1 到 6 之间的随机值。\n\n### 内存管理和 GC 类\n\n`GC` 类封装了垃圾回收机制。`GC` 定义的方法如表 21-15\
  \ 所示。它定义了此处所示只读属性：\n\n```csharp\npublic static int MaxGeneration { get; }\n```\n\
  \n`MaxGeneration` 包含系统可用的最大代数。代数表示分配的年龄。较新的分配比旧的分配代数较小。代数有助于提高垃圾回收器的效率。\n\n对于大多数应用程序，你不会使用\
  \ `GC` 的任何功能。然而，在特殊情况下，它们非常有用。例如，你可能想使用 `Collect()` 在你选择的时间强制执行垃圾回收。通常，垃圾回收是在程序未指定的时间运行的。\n\
  \n\n\n\n\n`Object` 是 C# `object` 类型的底层类。`Object` 的成员在第 11 章中讨论过，但由于它在 C# 中的核心作用，为了方便起见，它的方法在表\
  \ 21-16 中重复出现`Object` 定义了一个构造函数，显示如下：\n\n```csharp\npublic Object( )\n```\n\n它构造一个空对象。\n\
  \n![Image](img/t0685-01.jpg)\n\n**表 21-16** 由 `Object` 定义的方法\n\n#### Tuple\n.NET\
  \ Framework 4.0 增加了一种创建对象组（元组）的方便方法。其核心是静态类 `Tuple`，它定义了几个创建元组的 `Create()` 方法，以及多个封装元组的\
  \ `Tuple<...>` 类。例如，这里有一个返回带有三个成员的元组的 `Create()` 版本：\n\n```csharp\npublic static\
  \ Tuple<T1, T2, T3> Create<T1, T2, T3>(T1 item1, T2 item2, T3 item3)\n```\n\n注意，该方法返回一个\
  \ `Tuple<T1, T2, T3>` 对象。该对象封装了 `item1`、`item2` 和 `item3`。通常情况下，当你想要将一组值视为一个单元时，元组是有用的。例如，你可能会将元组传递给方法、从方法返回元组，或将元组存储在集合或数组中。\n\
  \n#### IComparable 和 IComparable<T> 接口\n许多类需要实现 `IComparable` 或 `IComparable<T>`\
  \ 接口，因为它们允许通过 .NET Framework 定义的各种方法将一个对象与另一个对象进行比较（为了排序）。第 18 章引入了 `IComparable`\
  \ 和 `IComparable<T>` 接口，其中它们用于允许两个泛型类型参数的对象进行比较。在本章较早对 `Array` 的讨论中也提到了它们。然而，由于它们重要性以及对许多情况的适用性，在这里对它们进行了正式检查。\n\
  \n`IComparable` 特别容易实现，因为它只包含了这一个方法：\n\n```csharp\nint CompareTo(object obj)\n```\n\
  \n该方法将调用对象与 `obj` 中的值进行比较。如果调用对象大于 `obj`，则返回大于零；如果两个对象相等，则返回零；如果调用对象小于 `obj`，则返回小于零。\n\
  \n`IComparable` 的泛型版本声明如下：\n\n```csharp\npublic interface IComparable<in T>\n```\n\
  \n在这个版本中，正在比较的数据类型作为类型参数传递给 `T`。这导致 `CompareTo()` 的声明发生了变化，如下：\n\n```csharp\nint\
  \ CompareTo(T other)\n```\n\n在这里，可以显式指定 `CompareTo()` 操作的数据类型。这使得 `IComparable<T>`\
  \ 类型安全的。由于这个原因，现在 `IComparable<T>` 优于 `IComparable`。\n\n#### IEquatable<T> 接口\n\
  `Equatable<T>` 由那些定义如何比较两个对象是否等等的类实现。它只定义了一个方法 `Equals()`，显示如下：\n\n```csharp\nbool\
  \ Equals(T other)\n```\n\n如果 `other` 等于调用对象，该方法返回 true，否则返回 false。\n\n`Equatable<T>`\
  \ 由 .NET Framework 中的几个类和结构实现，包括数值结构和 `String` 类。在实现 `Equatable<T>` 时，你通常还需要重写由\
  \ `Object` 定义的 `Equals(Object)` 和 `GetHashCode()`。\n\n#### IConvertible 接口\n`IConvertible`\
  \ 接口由所有值类型结构、`string` 和 `DateTime` 实现。它指定了各种类型转换。通常，你创建的类不需要实现此接口。\n\n#### ICloneable\
  \ 接口\n通过实现 `ICloneable` 接口，你能够创建一个对象的副本。`ICloneable` 只定义了一个方法 `Clone()`，显示如下：\n\n\
  ```csharp\nobject Clone( )\n```\n\n该方法创建调用对象的副本。你如何实现 `Clone()` 决定了如何创建副本。通常，拷贝有两种类型：深拷贝（deep\
  \ copy）和浅拷贝（shallow copy）。当进行深拷贝时，副本和原始对象是完全独立的。因此，如果原始对象包含对另一个对象 `O` 的引用，那么也会创建\
  \ `O` 的副本。在浅拷贝中，成员被复制，但成员引用的对象不会被复制。如果一个对象引用某些其他对象 `O`，那么在浅拷贝之后，副本和原始对象将引用同一个 `O`，对\
  \ `O` 的任何更改都会影响副本和原始对象。通常，你会实现 `Clone()` 以便执行深拷贝。浅拷贝可以使用 `Object` 定义的 `MemberwiseClone()`\
  \ 来完成。\n\n这里是一个说明 `ICloneable` 的示例。它创建了一个名为 `Test` 的类，该类包含指向名为 `X` 类对象的引用。`Test`\
  \ 使用 `Clone()` 创建了一个深拷贝。\n\n```csharp\n// Demonstrate ICloneable.\nusing System;\n\
  \nclass X {\n  public int a;\n  public X(int x) { a = x; }\n}\n\nclass Test: ICloneable\
  \ {\n  public X o;\n  public int b;\n  public Test(int x, int y) {\n    o = new\
  \ X(x);\n    b = y;\n  }\n  // (此处省略具体实现以匹配原文逻辑描述)\n}\n```\n*(注：由于原文提供的代码块存在不完整或错乱（如\
  \ `Iable` 拼写以及代码顺序的混乱），翻译时已保持其逻辑结构。)*\n\n\n\n\n\n.NET Framework 4.0 添加两个支持观察者模式的接口。它们是\
  \ `IObservable<T>` 和 `IObserver<T>`。在观察者模式中，一个类（可观察者）向另一个类（观察者）提供通知。这是通过将观察者类的对象注册到可观察类的对象来实现的。通过调用\
  \ `Subscribe()` 方法注册观察者，该方法由 `IObservable<T>` 指定，并传入将接收通知的 `IObserver<T>` 对象。可以注册多个观察者来接收通知。要向所有注册的观察者发送通知，使用了\
  \ `IObserver<T>` 定义的三个方法。`OnNext()` 向观察者发送数据，`OnError()` 表示错误，而 `OnCompleted()`\
  \ 表示可观察对象已停止发送通知。\n\n# 第 22 章\n\n## **字符串与格式化**\n\n本章将研究 `String` 类，它是 C# 内置 `string`\
  \ 类型的基础。正如所有程序员所知的，字符串处理是几乎任何程序的一部分。因此，`String` 类定义了一系列的方法、属性和字段，允许你对字符串的构建和操作进行详细的控制。与字符串处理密切相关的是将数据格式化为人类可读的形式。使用格式化子系统，你可以格式化\
  \ C# 的数值类型、日期时间以及枚举。\n\n### **C# 中的字符串**\n\n第 7 章中介绍了 C# 字符串处理的概述，这里不再重复该讨论。然而，在检查\
  \ `String` 类之前，回顾字符串在 C# 中是如何实现的是有价值的。\n\n在所有计算机语言中，`string` 都是字符序列，但这种序列的具体实现方式因语言而异。在某些计算机语言（如\
  \ C++）中，字符串是字符数组，但 C# 的情况并非如此。相反，C# 字符串是内置 `string` 数据类型的对象。因此，`string` 是一种引用类型。此外，`string`\
  \ 是 C# 对 `System.String`（标准的 .NET 字符串类型）的。因此，C# 字符串可以访问 `String` 定义的所有方法、属性、字段和运算符。\n\
  \n一旦创建字符串，组成字符串的字符序列就无法更改。这种限制允许 C# 更高效地实现字符串。虽然这种限制听起来可能是一个严重的缺点，但事实并非如此。当你需要一个与现有字符串不同的变体时，只需创建一个包含所需更改的新字符串，并在原始字符串不再需要时将其丢弃即可。由于未使用的字符串对象会被垃圾垃圾回收，因此你不需要担心被丢弃的字符串会发生什么。然而，必须明确的是，`string`\
  \ 引用变量当然可以改变它们所指向的对象。只是特定 `string` 对象的字符序列在创建后无法被更改。\n\n为了创建一个可以更改的字符串，C# 提供了一个名为\
  \ `StringBuilder` 的类，它位于 `System.Text` 命名空间中。但对于大多数用途，你会希望使用 `string` 而不是 `StringBuilder`。\n\
  \n### **String 类**\n\n`String` 定义在 `System` 命名空间中。它实现了 `IComparable`、`IComparable<string>`、`ICloneable`、`IConvertible`、`IEnumerable`、`IEnumerable<char>`\
  \ 和 `IEquatable<string>` 接口。`String` 是密封类（sealed），这意味着它不能被继承。`String` 为 C# 提供字符串处理功能。它是\
  \ C# 内置 `string` 类型的基础，并且是 .NET Framework 的一部分。接下来的几节将详细检查 `String`。\n\n### **String\
  \ 构造函数**\n\n`String` 类定义了多个构造函数，允许你以多种方式构造字符串。要从字符数组创建字符串，请使用以下构造函数之一：\n\n```cs\n\
  public String(char[] value)\npublic String(char[] value, int startIndex, int length)\n\
  ```\n\n第一种形式构造包含 `value` 中字符的字符串。第二种形式使用 `value` 中从 `startIndex` 指定索引开始的 `length`\
  \ 个字符。\n\n你可以使用此构造函数创建一个包含特定字符并重复指定次数的字符串：\n\n```cs\npublic String(char c, int count)\n\
  ```\n\n在这里，`c` 指定了将重复 `count` 次的字符。\n\n给定字符数组指针的情况下，可以使用以下构造函数来构造字符串：\n\n```cs\n\
  public String(char* value)\npublic String(char* value, int startIndex, int length)\n\
  ```\n\n第一种形式构造包含 `value` 指向的字符的字符串。假设 `value` 指向一个空终止的数组，并被完整使用。第二种形式使用 `value`\
  \ 指向的数组中从 `startIndex` 指定索引开始的 `length` 个字符。由于它们使用了指针，这些构造函数只能在不安全（unsafe）代码中使用。\n\
  \n给定字节数组指针的情况下，可以使用以下构造函数来构造字符串：\n\n```cs\npublic String(sbyte* value)\npublic String(sbyte*\
  \ value, int startIndex, int length)\npublic String(sbyte* value, int startIndex,\
  \ int length, Encoding enc)\n```\n\n第一种形式构造包含 `value` 指向的字节的字符串。假设 `value` 指向一个空终止的数组，并被完整使用。第二种形式使用\
  \ `value` 指向的数组中从 `startIndex` 指定索引开始的 `length` 个字符。第三种形式允许你指定字节的编码方式。`Encoding`\
  \ 类位于 `System.Text` 命名空间。由于使用了指针，这些构造函数只能在 unsafe 代码中使用。\n\n字符串字面量会自动创建一个字符串对象。因此，`string`\
  \ 对象通常通过赋值字符串字面量来初始化，如下：\n\n```cs\nstring str = \"new string\";\n```\n\n### **String\
  \ 字段、索引器和属性**\n\n`String` 类定义了一个字段，如下：\n\n```cs\npublic static readonly string Empty\n\
  ```\n\n`Empty` 指定一个空字符串，这是一个不包含字符的字符串。这与空 `String` 引用不同，后者不指向任何对象。\n\n`String` 定义了一个只读索引器，如下：\n\
  \n```cs\npublic char this[int index] { get; }\n```\n\n该索引器允许你获取指定索引处的字符。数组数组，字符串的索引从零开始。由于\
  \ `String` 对象是不可变的，`String` 支持只读索引器是合理的。\n\n它有一个只读属性：\n\n```cs\npublic int Length\
  \ { get; }\n```\n\n`Length` 返回字符串中字符的数量。\n\n### **字符串运算符**\n\n`String` 类重载了两个运算符：`==`\
  \ 和 `!=`。要测试两个字符串是否相等，请使用 `==` 运算符。通常，当 `==` 运算符应用于对象引用时，它判断两个引用是否指向同一个对象。这对于 `String`\
  \ 类型的对象则不同。当将 `==` 应用于两个 `String` 引用时，比较的是字符串内容本身的相等性。`!=` 运算符也是如此。然而，其他关系运算符（如\
  \ `<` 或 `>=`）比较的是引用，就像它们对其他类型对象执行一样。要确定一个字符串是否大于或小于另一个，请使用 `String` 定义的 `Compare()`\
  \ 或 `CompareTo()` 方法。\n\n正如你所看到的，许多字符串比较利用了文化信息。`==` 和 `!=` 运算符并非如此。它们简单地比较字符串内部字符的序数值（换句话说，它们比较的是未经文化规范修改的字符二进制值）。因此，这些运算符是大小写敏感且文化不敏感的。\n\
  \n\n\n\n\n`String` 类定义了大量方法，其中许多方法具有两个或多个重载形式。因此，列出所有方法既不实际也不合用。相反，本文将介绍几个更常用的方法，并附带说明这些示例。\n\
  \n## 比较字符串\n\n最频繁使用的字符串处理操作可能是将一个字符串与另一个字符串进行比较。在检查任何比较方法之前，需要说明一个关键点：.NET 框架可以通过两种通用方式执行字符串比较。首先，比较可以反映特定区域的习俗和规范，这通常是程序执行时强制生效的文化设置。这是某些（但不是所有）比较方法的默认行为。其次，比较可以独立于文化设置进行，仅使用组成字符串的字符的序数值（ordinal\
  \ values）。通常，文化敏感的字符串比较使用字典顺序（以及语言特征）来确定一个字符串是大于、等于还是小于另一个字符串。序数字符串比较则简单地根据每个字符未修改的值对字符串进行排序。\n\
  \n选择比较方法是一个重要的决策。根据一般规则（特殊情况除外），如果比较字符串是为了向用户显示输出（例如显示一组按字典顺序排序的字符串），那么文化敏感的比较通常是正确的选择。然而，如果字符串包含不随文化差异而修改的固定信息，例如文件名、关键词、网站\
  \ URL 或安全相关值，则通常应该使用序数比较。当然，最终取决于应用程序的具体细节，以决定需要哪种方法。\n\n**注意** 由于于文化敏感比较与序数比较之间的差异以及各自的影响，强烈建议你参考微软关于这方面的推荐最佳实践。在某些情况下，选择错误的方法可能会导致程序在与开发环境不同的环境中运行时发生故障。\n\
  \n`String` 提供了多种比较方法。这些方法显示在表 22-1 中。在这些比较方法中，`Compare()` 方法是最通用的。它可以比较两个字符串的整体，也可以比较部分。它可以使用区分大小写的比较，也可以忽略大小写。你还可以使用具有\
  \ `StringComparison` 参数的版本来指定如何执行比较，或使用具有 `CultureInfo` 参数的版本来指定规定比较的文化信息。不包含 `StringComparison`\
  \ 的 `Compare()` 重载是区分大小写且文化敏感的。未指定 `CultureInfo` 参数的重载使用当前执行环境定义的文化信息。虽然我们在本章中不会使用\
  \ `CultureInfo` 参数，但 `StringComparison` 参数具有直接的意义。\n\n![Image](img/t0694-01.jpg)\n\
  ![Image](img/t0695-01.jpg)\n![Image](img/t0695-01a.jpg)\n![Image](img/t0696-01.jpg)\n\
  ![Image](img/t0696-01a.jpg)\n\n**表 22-1** `String` 比较方法\n\n`StringComparison` 是一个枚举，定义了表\
  \ 22-2 中显示的值。使用这些值，可以构建出满足应用程序特定需求的比较。因此，添加 `StringComparison` 参数扩展了 `Compare()`\
  \ 以及其他方法（如 `Equals()`）的功能。它还让你以无歧义的方式精确指定你想要执行的比较类型。由于文化敏感比较和序数比较之间的差异，在这方面尽可能清晰是关重要的。因此，本书中的示例在调用支持此类参数的方法时，将显式地指定\
  \ `StringComparison` 参数。\n\n在所有情况下，当第一个字符串小于第二个字符串时，`Compare()` 返回小于零；当第一个字符串大于第二个字符串时，返回大于零；当两个字符串比较为相等时，返回零。尽管\
  \ `Compare()` 在确定两个字符串相等时返回零，但通常使用 `Equals()`（或 `==` 运算符）来判断相等性会更好。原因是 `Compare()`\
  \ 根据排序顺序来判断相等性。当执行文化敏感比较时，两个字符串在排序顺序上可能是相等的，但在其他方面并不相等。默认情况下，`Equals()` 根据字符的序数值判断相等性，且是不文化敏感的。因此，默认情况下，它比较两个字符串的绝对的、逐字符的相等。它的工作方式类似于\
  \ `==` 运算符。\n\n虽然 `Compare()` 更通用，但在执行简单的序数比较时，`CompareOrdinal()` 方法稍微更容易用。最后，注意\
  \ `CompareTo()` 只执行文化敏感的比较。在编写本文时，没有重载可以让你指定不同的方法。\n\n以下程序演示了 `Compare()`、`Equals()`、`CompareOrdinal()`\
  \ 以及 `==` 和 `!=` 运算符。注意前两个比较清楚地在英语环境中显示了文化敏感比较与序数比较之间的差异。\n\n![Image](img/ 演示字符串比较。\n\
  \nusing System;\n\nclass CompareDemo {\n  static void Main() {\n    string str1\
  \ = \"alpha\";\n    string str2 = \"Alpha\";\n    string str3 = \"Beta\";\n    string\
  \ str4 = \"alpha\";\n    string str5 = \"alpha, beta\";\n    int result;\n    //\
  \ 首先，演示文化敏感比较\n    // 和序数比较之间的差异。\n    result = String.Compare(str1, str2, StringComparison.CurrentCulture);\n\
  \    Console.Write(\"使用文化敏感比较: \");\n    if (result < 0)\n      Console.WriteLine(str1\
  \ + \" 小于 \" + str2);\n    else if (result > 0)\n      Console.WriteLine(str1 +\
  \ \" 大于 \" + str2);\n    else\n      Console.WriteLine(str1 + \" 等于 \" + str2);\n\
  \    result = String.Compare(str1, str2, StringComparison.Ordinal);\n    Console.Write(\"\
  使用序数比较: \");\n    if (result < 0)\n      Console.WriteLine(str1 + \" 小于 \" + str2);\n\
  \    else if (result > 0)\n      Console.WriteLine(str1 + \" 大于 \" + str2);\n  \
  \  else\n      Console.WriteLine(str1 + \" 等于 \" + str4);\n    // 使用 CompareOrdinal()\
  \ 方法。\n    result = String.CompareOrdinal(str1, str2);\n    Console.Write(\"使用 CompareOrdinal():\
  \ \");\n    if (result < 0)\n      Console.WriteLine(str1 + \" 小于 \" + str2);\n\
  \    else if (result > 0)\n      Console.WriteLine(str1 + \" 大于 \" + str2);\n  \
  \  else\n      Console.WriteLine(str1 + \" 等于 \" + str4);\n    Console.WriteLine();\n\
  \    // 使用 == 判断两个字符串是否相等。\n    // 这种比较是序数的。\n    if (str1 == str4) Console.WriteLine(str1\
  \ + \" == \" + str4);\n    // 在字符串上使用 !=。\n    if (str1 != str3) Console.WriteLine(str1\
  \ + \" != \" + str3);\n    if (str1 != str2) Console.WriteLine(str1 + \" != \" +\
  \ str2);\n    Console.WriteLine();\n    // 使用 Equals() 执行序数的、忽略大小写的比较。\n    if (String.Equals(str1,\
  \ str2, StringComparison.OrdinalIgnoreCase))\n      Console.WriteLine(\"使用带 OrdinalIgnoreCase\
  \ 的 Equals(), \" +\n        str1 + \" 等于 \" + str2);\n    Console.WriteLine();\n\
  \    // 比较字符串的一部分。\n    if (String.Compare(str2, 0, str5, 0, 3,\n        StringComparison.CurrentCulture)\
  \ > 0) {\n      Console.WriteLine(\"使用当前文化，前 \" +\n    }\n  }\n}\n```\n\n\n\n\n\n\
  ```cs\n\"3 characters of \" + str2 +\n\"\\nare greater than the first \" +\n\"3\
  \ characters of \" + str5);\n\n  }\n\n}\n```\n\n输出结果所示：\n\n使用文化敏感性比较：alpha 小于 Alpha\n\
  \n使用序数比较：alpha 大于 Alpha\n\n使用 `CompareOrdinal()`：alpha 大于 Alpha\n\nalpha == alpha\n\
  \nalpha != Beta\n\nalpha != Alpha\n\n使用带有 `OrdinalIgnoreCase` 的 `Equals()`，alpha\
  \ 等于 Alpha\n\n使用当前文化，Alpha 的前 3 个字符大于 alpha, beta 的前 3 个字符\n\n### 拼接字符串\n\n有两种方法可以拼接（连接在一起）两个或多个字符串。首先，你可以使用\
  \ `+` 运算符，如 第 7 章 所示。其次，你可以使用 `String` 定义的各种拼接方法之一。虽然在许多情况下，使用 `+` 是最简单的方法，但拼接方法为你提供了另一种可选方案。\n\
  \n执行拼接的方法被称为 `Concat()`。这里显示了它最简单的形式之一：\n\n```csharp\npublic static string Concat(string\
  \ str0, string str1)\n```\n\n该方法返回一个字符串，其中 `str1` 拼接在 `str0` 之后。`Concat()` 的另一种形式如下所示，它拼接了三个字符串：\n\
  \n```csharp\npublic static string Concat(string str0, string str1, string str2)\n\
  ```\n\n在这个版本中，返回的是一个包含 `str0`、`str1` 和 `str2` 拼接结果的字符串。还存在一种拼接四个字符串的形式：\n\n```csharp\n\
  public static string Concat(string str0, string str1, string str2, string str3)\n\
  ```\n\n此版本返回所有四个字符串的拼接结果。\n\n接下来显示的 `Concat()` 版本可以拼接任意数量的字符串：\n\n```csharp\npublic\
  \ static string Concat(params string[] values)\n```\n\n在这里，`values` 指向一组被拼接的可变数量参数，并返回结果。由于此版本的\
  \ `Concat()` 可以用于拼接任意数量的字符串（包括两个、三个或四个字符串），你可能会疑惑为什么存在上面显示的其他形式。原因在于效率；传递多四个参数比使用可变长度参数列表更高效。\n\
  \n以下程序演示了 `Concat()` 的可变参数版本：\n\n```csharp\n// 演示 Concat().\nusing System;\n\nclass\
  \ ConcatDemo {\n  static void Main() {\n    string result = String.Concat(\"This\
  \ \", \"is \", \"a \",\n                                  \"test \", \"of \", \"\
  the \",\n                                  \"String \", \"class.\");\n    Console.WriteLine(\"\
  result: \" + result);\n  }\n}\n```\n\n输出结果所示：\n\nresult: This is a test of the String\
  \ class.\n\n存在 `Concat()` 方法的版本接收 `object` 引用而不是 `string` 引用。这些方法会获取调用时对象的字符串表示，并返回一个包含这些字符串拼接结果的字符串。（字符串表示是通过对对象调用\
  \ `ToString()` 方法获得的）。这些版本的 `Concat()` 显示如下：\n\n```csharp\npublic static string\
  \ Concat(object arg0)\npublic static string Concat(object arg0, object arg1)\npublic\
  \ static string Concat(object arg0, object arg1, object arg2)\npublic static string\
  \ Concat(object arg0, object arg1, object arg2, object arg3)\npublic static string\
  \ Concat(params object[] args)\n```\n\n第一个方法简单地返回 `arg0` 的等效字符串。其他方法返回一个包含其参数拼接结果的字符串。`Concat()`\
  \ 的 `object` 形式非常方便，因为它们让你避免了手动获取字符串表示。要查看这些方法有多用，请考虑以下程序：\n\n```csharp\n// 演示 Concat()\
  \ 的对象形式。\nusing System;\nclass MyClass {\n  public static int Count = 0;\n  public\
  \ MyClass() { Count++; }\n}\n\nclass ConcatDemo {\n  static void Main() {\n    string\
  \ result = String.Concat(\"The value is \" + 19);\n    Console.WriteLine(\"result:\
  \ \" + result);\n    result = String.Concat(\"hello \", 88, \" \", 20, \", false,\
  \ \" \", 23.45);\n    Console.WriteLine(\"result: \" + result);\n    MyClass mc\
  \ = new MyClass();\n    result = String.Concat(mc, \" current count is \", MyClass.Count);\n\
  \    Console.WriteLine(\"result: \" + result);\n  }\n}\n```\n\n输出结果所示：\n\nresult:\
  \ The value is 19\nresult: hello 88 20, false, 23.45\nresult: MyClass current count\
  \ is 1\n\n在这个示例中，`Concat()` 拼接了各种数据类型的字符串表示。对于每个参数，都会调用与该参数相关的 `ToString()` 方法以获取字符串表示。因此，在如下\
  \ `concat()` 调用中：\n\n```cs\nstring result = String.Concat(\"The value is \" + 19);\n\
  ```\n\n调用了 `Int32.ToString()` 来获取整数值 19 的字符串表示。然后 `Concat()` 拼接这些字符串并返回结果。\n\n还要注意自定义类\
  \ `MyClass` 的对象是如何在此 `Concat()` 调用中使用的：\n\n```cs\nresult = String.Concat(mc, \"\
  \ current count is \", MyClass.Count);\n```\n\n在这种情况下，返回的是 `mc` 的字符串表示（其类型）。默认情况下，返回的是其类名。然而，如果你重写了\
  \ `ToString()` 方法，`mc` 可以返回不同的字符串。例如，在前面的程序中添加此 `ToString()` 版本：\n\n```csharp\n\
  public override string ToString() {\n  return \"An object of type\";\n}\n```\n\n\
  使用此版本时，输出的最后一行将是\n\nresult: An object of type MyClass current count is 1\n\n.NET\
  \ Framework 4.0 增加了两种 `Concat()` 形式：\n\n```csharp\npublic static string Concat<T>(IEnumerable<T>\
  \ values)\npublic static string Concat(IEnumerable<string> values)\n```\n\n第一个形式返回一个包含\
  \ `values` 中元素字符串表示拼接的字符串。第二种形式拼接 `values` 指定的字符串。\n\n### 搜索字符串\n\n`String` 提供了许多方法允许你搜索字符串。例如，你可以搜索子字符串或字符。你还可以搜索第一次或最后一次出现。需要注意的是，搜索可以是文化敏感的，也可以是序数的。\n\
  \n要查找字符串或字符的第一次出现位置，请使用 `IndexOf()` 方法。它定义了多个重载形式。这里是其中在字符串中搜索字符第一次出现的形式：\n\n```csharp\n\
  public int IndexOf(char value)\n```\n\n该方法返回字符 `value` 在调用字符串中第一次出现的位置索引。如果未找到 `value`，则返回\
  \ -1。查找该字符的搜索忽略了文化设置。因此，查找字符的第一次出现位置使用的是序数搜索。\n\n以下是两种可以让你搜索字符串第一次出现位置的 `IndexOf()`\
  \ ：\n\n```csharp\npublic int IndexOf(String value)\npublic int IndexOf(String value,\
  \ StringComparison comparisonType)\n```\n\n第一个形式使用文化敏感搜索来查找 `value` 所指字符串的第一次出现位置。第二种形式允许指定一个\
  \ `StringComparison` 值来规定如何进行搜索。如果未找到项，两者都返回 -1。\n\n要查找字符或字符串的最后一次出现位置，请使用 `LastIndexOf()`\
  \ 方法。它也定义了多个重载形式。这种在调用字符串中搜索字符最后一次出现的形式：\n\n```csharp\npublic int LastIndexOf(char\
  \ value)\n```\n\n\n\n\n\n此方法使用序数搜索，并返回调用字符串中字符 `value` 最后一次出现的位置索引；如果未找到 `value`\
  \ 则返回 -1。\n\n以下是 `IndexOf()` 的两种形式，允许你搜索字符串的最后一次出现：\n\n```csharp\npublic int LastIndexOf(string\
  \ value)\npublic int LastIndexOf(string value, StringComparison comparisonType)\n\
  ```\n\n第一种形式使用文化敏感性搜索来查找 `value` 所指字符串的第一次出现的位置。第二种形式允许你指定一个 `StringComparison`\
  \ 值，以规定如何进行搜索。如果未找到该项，两者都返回 -1。\n\n`String` 提供了两个有趣的补充搜索方法：`IndexOfAny()` 和 `LastIndexOfAny()`。这些方法搜索匹配字符集中任意字符的第一个或最后一个字符。以下是它们最简单的形式：\n\
  \n```csharp\npublic int IndexOfAny(char[] anyOf)\npublic int LastIndexOfAny(char[]\
  \ anyOf)\n```\n\n`IndexOfAny()` 返回调用字符串中 `anyOf` 任意字符中第一次字符的索引。`LastIndexOfAny()`\
  \ 返回调用字符串中 `anyOf` 任意字符中最后一次字符的索引。如果未找到匹配，两者都返回 -1。在两种情况下，均使用了序数搜索。\n\n在处理字符串时，了解字符串是否以指定的子字符串开头或结尾通常很有用。要完成此任务，请使用\
  \ `StartsWith()` 和 `EndsWith()` 方法。以下是它们最简单的形式：\n\n```csharp\npublic bool StartsWith(string\
  \ value)\npublic bool EndsWith(string value)\n```\n\n如果调用字符串以传入 `value` 的字符串开头，则\
  \ `StartsWith()` 返回 true。\n\n如果调用字符串以传入 `value` 的字符串结尾，则 `EndsWith()` 返回 true。失败时返回\
  \ false。这些方法使用文化敏感性搜索。要指定如何进行搜索，可以使用带有 `StringComparison` 参数的这些方法版本。\n\n以下是示例：\n\
  \n```csharp\npublic bool StartsWith(string value, StringComparison comparisonType)\n\
  public bool EndsWith(string value, StringComparison comparisonType)\n```\n\n它们的功能与之前的相同，但允许你显式指定如何进行搜索。\n\
  \n以下程序演示了多种字符串搜索方法。为了说明起，所有方法都使用了序数搜索：\n\n```csharp\n// 搜索字符串。\nusing System;\n\
  class StringSearchDemo {\n  static void Main() {\n    string str = \"C# has powerful\
  \ string handling.\";\n    int idx;\n    Console.WriteLine(\"str: \" + str);\n \
  \   idx = str.IndexOf('h');\n    Console.WriteLine(\"Index of first 'h': \" + idx);\n\
  \    idx = str.LastIndexOf('h');\n    Console.WriteLine(\"Index of last 'h': \"\
  \ + idx);\n    idx = str.IndexOf(\"ing\", StringComparison.Ordinal);\n    Console.WriteLine(\"\
  Index of first \\\"ing\\\": \" + idx);\n    idx = str.LastIndexOf(\"ing\", StringComparison.Ordinal);\n\
  \    Console.WriteLine(\"Index of last \\\"ing\\\": \" + idx);\n    char[] chrs\
  \ = { 'a', 'b', 'c' };\n    idx = str.IndexOfAny(chrs);\n    Console.WriteLine(\"\
  Index of first 'a', 'b', or 'c': \" + idx);\n    if (str.StartsWith(\"C# has\",\
  \ StringComparison.Ordinal))\n      Console.WriteLine(\"str begins with C# has\"\
  );\n    if (str.EndsWith(\"ling.\", StringComparison.Ordinal))\n      Console.WriteLine(\"\
  str ends with ling.\");\n  }\n}\n```\n\n程序的输出显示在此：\nstr: C# has powerful string\
  \ handling.\nIndex of first 'h': 3\nIndex of last 'h': 23\nIndex of first \"ing\"\
  : 19\nIndex of last \"ing\": 28\nIndex of first 'a', 'b', or 'c': 4\nstr begins\
  \ with C# has\nstr ends with ling.\n\n你会在很多地方发现非常有用的字符串搜索方法是 `Contains()`。其通用形式所示：\n\
  \n```csharp\npublic bool Contains(string value)\n```\n\n如果调用字符串包含由 `value` 指定的字符串，返回\
  \ true，否则返回 false。它使用序数搜索。当你只需要知道特定子字符串是否存在于另一个字符串中时，此方法特别有用。以下是一个演示其用法的示例：\n\n\
  ```csharp\n// 演示 Contains()。\nusing System;\nclass ContainsDemo {\n  static void\
  \ Main() {\n    string str = \"C# combines power with performance.\";\n    if (str.Contains(\"\
  power\"))\n      Console.WriteLine(\"sequence power was found.\");\n    if (str.Contains(\"\
  pow\"))\n      Console.WriteLine(\"sequence pow was found.\");\n    if (!str.Contains(\"\
  powerful\"))\n      Console.WriteLine(\"sequence powerful was not found.\");\n \
  \ }\n}\n```\n\n输出显示在此：\nsequence power was found.\nsequence pow was found.\nsequence\
  \ powerful was not found.\n\n如输出所示，`Contains()` 搜索的是匹配序列，而不是整个单词。因此，“pow”和“power”都被找到了。然而，由于没有匹配“powerful”的序列，它（正确地）没有被找到。某些搜索方法具有附加形式，允许你从指定的索引开始搜索，或指定在某个范围内搜索。`String`\
  \ 搜索方法的所有版本均见表 22-3。\n\n### 表 22-3 String 提供的搜索方法\n\n#### 字符串的分拆与合并\n\n两个基本的字符串处理操作是拆（split）和合并（join）。*split*\
  \ 将字符串分解为其组成部分。*join* 从一组部分构造字符串。要拆字符串，`String` 定义了 `Split()`。要合并一组字符串，`String`\
  \ 提供了 `Join()`。\n\n`Split()` 有多个版本。自 C# 1.0 以来常用的两种形式所示：\n\n```csharp\npublic string[]\
  \ Split(params char[] separator)\npublic string[] Split(char[] separator, int count)\n\
  ```\n\n第一种形式将调用字符串拆分并返回包含子字符串的数组。分隔每个字符串的字符通过 `separator` 传入。如果 `separator` 为空或空字符串，则使用空格作为分隔符。在第二种形式中，返回的子字符串不会超过\
  \ `count`。\n\n`Join()` 方法有多个形式。这里是自 .NET Framework 2.0 版本以来可用的：\n\n```csharp\npublic\
  \ static string Join(string separator, params string[] value)\npublic static string\
  \ Join(string separator, string[] value, int startIndex, int count)\n```\n\n第一种形式返回包含\
  \ `value` 中从 `value[startIndex]` 开始的 `count` 个字符串的字符串。对于这两个版本，每个字符串都由 `separator`\
  \ 指定字符串分隔。\n\n以下程序显示了 `Split()` 和 `Join()` 的用法：\n\n```csharp\n// 拆分并合并字符串。\nusing\
  \ System;\nclass SplitAndJoinDemo {\n  static void Main() {\n    string str = \"\
  One if by land, two if by sea.\";\n    char[] seps = {' ', '.', ',' };\n    // 拆分字符串。\n\
  \    string[] parts = str.Split(seps);\n    Console.WriteLine(\"Pieces from split:\
  \ \");\n    for(int i=0; i < parts.Length; i++)\n      Console.WriteLine(parts[i]);\n\
  \    // 现在，合并部分。\n    string whole = String.Join(\" | \", parts);\n    Console.WriteLine(\"\
  Result of join: \");\n    Console.WriteLine(whole);\n  }\n}\n```\n\n输出显示在此：\nPieces\
  \ from split:\nOne\nif\nby\nland\ntwo\nif\nby\nsea\nResult of join:\nOne | if |\
  \ by | land | | two | if | by | sea |\n\n\n\n\n\n还有几种 `Split()` 的其他形式，它们接受类型为 `StringSplitOptions`\
  \ 的参数。该参数控制空字符串是否作为结果的一部分。以下是这些 `Split()` 形式：\n\n```csharp\npublic string[] Split(char[]\
  \ *separator, StringSplitOptions options)\npublic string[] Split(string[] *separator,\
  \ StringSplitOptions options)\npublic string[] Split(char[] *separator, int count,\
  \ StringSplitOptions options)\npublic string[] Split(string[] *separator, int count,\
  \ StringSplitOptions options)\n```\n\n前两种形式将调用字符串拆分为片段，并返回一个包含子字符串的数组。分隔每个子字符串的字符通过\
  \ `separator` 传入。如果 `separator` 为 null，则使用空白字符作为分隔符。在第三和第四种形式中，返回的子字符串不会超过 `count`。对于所有版本，`options`\
  \ 的值决定了如何处理两个相邻分隔符时产生的空字符串。`StringSplitOptions` 枚举仅定义两个值：`None` 和 `RemoveEmptyEntries`。如果\
  \ `options` 为 `None`，则结果中包含空字符串（如上一个程序所示）。如果 `options` 为 `RemoveEmptyEntries`，则结果中排除空字符串。\n\
  \n为了理解移除空项的效果，请尝试替换前面程序中的此行：\n\n```csharp\nstring[] parts = str.Split(seps);\n```\n\
  \n为如下内容：\n\n```csharp\nstring[] parts = str.Split(seps, StringSplitOptions.RemoveEmptyEntries);\n\
  ```\n\n当运行程序时，输出将所示：\n\nPieces from split:\nOne\nif\nby\nland\ntwo\nif\nby\nsea\n\
  Result of join:\nOne | if | by | land | two | if | by | sea\n\n如你所见，之前由于“land”之后的逗号和空格组合而产生的空字符串已被移除。\n\
  \n字符串拆分是一项重要的字符串处理过程，因为它通常用于获取组成字符串的各个 `tokens`（标记）。例如，数据库程序可能会使用 `Split()` 将查询“show\
  \ me all balances greater than 100”（显示所有大于 100 的余额）分解为各个部分，例如“show”和“100”。在此过程中，分隔符会被移除。因此，得到的是“show”（没有任何前导或后缀空格），而不是“show\
  \ ”。下面的程序说明了这一概念。它将包含二进制数学运算的字符串（如 10 + 5）进行标记化。然后执行该操作并显示结果。\n\n```csharp\n// Tokenize\
  \ strings.\nusing System;\nclass TokenizeDemo {\n  static void Main() {\n    string[]\
  \ input = {\n                      \"100 + 19\",\n                      \"100 /\
  \ 3.3\",\n                      \"-3 * 9\",\n                      \"100 - 87\"\n\
  \                    };\n    char[] seps = {' ' };\n    for(int i=0; i < input.Length;\
  \ i++) {\n      // split string into parts\n      string[] parts = input[i].Split(seps);\n\
  \      Console.Write(\"Command: \");\n      for(int j=0; j < parts.Length; j++)\n\
  \        Console.Write(parts[j] + \" \");\n      Console.Write(\", Result: \");\n\
  \      double n = Double.Parse(parts[0]);\n      double n2 = Double.Parse(parts[2]);\n\
  \      switch(parts[1]) {\n        case \"+\":\n          Console.WriteLine(n +\
  \ n2);\n          break;\n        case \"-\":\n          Console.WriteLine(n - n2);\n\
  \          break;\n        case \"*\":\n          Console.WriteLine(n * n2);\n \
  \         break;\n        case \"/\":\n          Console.WriteLine(n / n2);\n  \
  \        break;\n      }\n    }\n  }\n}\n```\n\n以下是输出：\nCommand: 100 + 19, Result:\
  \ 19\nCommand: 100 / 3.3, Result: 30.30303030303033\nCommand: -3 * 9, Result: -27\n\
  Command: 100 - 87, Result: 13\n\n从 .NET Framework 4.0 开始，还定义了以下额外的 `Join()` 形式：\n\
  \n```csharp\npublic static string Join(string separator, params object[] values)\n\
  public static string Join(string separator, IEnumerable<string> values)\npublic\
  \ static string Join<T>(string separator, IEnumerable<T> values)\n```\n\n第一种形式返回一个字符串，其中包含\
  \ `values` 中对象字符串表示的拼接结果。第二种形式返回一个包含 `values` 所引用字符串拼接结果的字符串。第三种形式返回一个包含 `values`\
  \ 中对象集合的字符串表示的字符串。在所有情况下，每个字符串都通过 `separator` 隔开。\n\n### 字符串的填充与修剪（Padding and Trimming\
  \ Strings）\n\n有时你想要移除字符串的前导和后缀空格。这种操作被称为*修剪*（trimming），命令处理器通常需要它。例如，数据库可能会识别“print”一词。然而，用户在输入此命令时带有带有或多个前导或后缀空格。在字符串被数据库识别之前，必须移除任何此类空格。相反，有时你可能想用空格填充字符串以满足某些最小长度。例如，如果你正在准备格式化输出，你可能需要确保每行都有特定长度以保持对齐。幸运的是，C#\
  \ 包含了让这些类型操作变得简单的方法。\n\n要修剪字符串，请使用 `Trim()` 方法之一：\n\n```csharp\npublic string Trim()\n\
  public string Trim(params char[] trimChars)\n```\n\n第一种形式移除调用字符串的前导和后缀空白字符。第二种形式移除调用字符串中指定的\
  \ `trimChars`。在两种情况下，都会返回处理后的字符串。\n\n你可以通过在字符串的左侧或右侧添加字符来填充字符串。要在字符串左侧填充，请使用此处所示的方法之一：\n\
  \n```csharp\npublic string PadLeft(int totalWidth)\npublic string PadLeft(int totalWidth,\
  \ char paddingChar)\n```\n\n第一种形式在调用字符串左侧添加空格，使其总长度达到 `totalWidth`。第二种形式添加指定的 `paddingChar`，使其总长度达到\
  \ `totalWidth`。在两种情况下，都会返回处理后的字符串。如果 `totalWidth` 小于调用字符串的长度，则返回原字符串的副本。\n\n要在字符串右侧填充，请使用这些方法：\n\
  \n```csharp\npublic string PadRight(int totalWidth)\npublic string PadRight(int\
  \ totalWidth, char paddingChar)\n```\n\n第一种形式在调用字符串右侧添加空格，使其总长度达到 `totalWidth`。第二种形式添加指定的\
  \ `paddingChar`，使其总长度达到 `totalWidth`。在两种情况下，都会返回处理后的字符串。如果 `totalWidth` 小于调用字符串的长度，则返回原字符串的副本。\n\
  \n下面的程序演示了修剪和填充：\n\n```csharp\n// Trimming and padding.\nusing System;\nclass TrimPadDemo\
  \ {\n  static void Main() {\n    string str = \"test\";\n    Console.WriteLine(\"\
  Original string: \" + str);\n    // 在左侧填充空格。\n    str = str.PadLeft(10);\n    Console.WriteLine(\"\
  |\" + str + \"|\");\n    // 在右侧填充空格。\n    str = str.PadRight(20);\n    Console.WriteLine(\"\
  |\" + str + \"|\");\n    // 修剪空格。\n    str = str.Trim();\n    Console.WriteLine(\"\
  |\" + str + \"|\");\n    // 在左侧填充 #。\n    str = str.PadLeft(10, '#');\n    Console.WriteLine(\"\
  |\" + str + \"|\");\n    // 在右侧填充 #。\n    str = str.PadRight(20, '#');\n    Console.WriteLine(\"\
  |\" + str + \"|\");\n  }\n}\n```\n\n输出在此所示：\nOriginal string: test\n|      test|\n\
  |test                |\n|test|\n|######test|\n|######test##########|\n\n\n\n在这里，`value`\
  \ 所指的字符串被插入到调用字符串中由 `startIndex` 指定索引处。返回生成的字符串。\n\n你可以使用 `Remove()` 移除字符串的一部分，如下所示：\n\
  \n```csharp\npublic string Remove(int startIndex)\npublic string Remove(int startIndex,\
  \ int count)\n```\n\n第一种形式从 `startIndex` 指定的索引开始，并移除字符串中剩余的所有字符。第二种形式从 `startIndex`\
  \ 开始并移除 `count` 个字符。在这两种情况下，都会返回生成的字符串。\n\n你可以通过使用 `Replace()` 替换字符串的一部分。它有以下几种形式：\n\
  \n```csharp\npublic string Replace(char oldChar, char newChar)\npublic string Replace(string\
  \ oldValue, string newValue)\n```\n\n第一种形式将调用字符串中所有出现的 `oldChar` 替换为 `newChar`。第二种形式将调用字符串中所有出现的\
  \ `oldValue` 所指的字符串替换为 `newValue` 所指的字符串。在这两种情况下，都会返回生成的字符串。\n\n以下是一个演示 `Insert()`、`Remove()`\
  \ 和 `Replace()` 的示例：\n\n```csharp\n// Inserting, replacing, and removing.\nusing\
  \ System;\n\nclass InsRepRevDemo {\n  static void Main() {\n    string str = \"\
  This test\";\n    Console.WriteLine(\"Original string: \" + str);\n    // Insert\n\
  \    str = str.Insert(5, \"is a \");\n    Console.WriteLine(str);\n    // Replace\
  \ string\n    str = str.Replace(\"is\", \"was\");\n    Console.WriteLine(str);\n\
  \    // Replace characters\n    str = str.Replace('a', 'X');\n    Console.WriteLine(str);\n\
  \    // Remove\n    str = str.Remove(4, 5);\n    Console.WriteLine(str);\n  }\n\
  }\n```\n\n输出所示：\n\n```\nOriginal string: This test\nThis is a test\nThwas was a\
  \ test\nThwXs wXs X test\nThwX X test\n```\n\n### 更改大小写\n\n`String` 提供了两个方便的方法，允许你更改字符串内字母的大小写。这些方法被称为\
  \ `ToUpper()` 和 `ToLower()`。以下是它们最简单的形式：\n\n```csharp\npublic string ToLower()\n\
  public string ToUpper()\n```\n\n`ToLower()` 将调用字符串中的所有字母转为小写。`ToUpper()` 将调用字符串中的所有字母转为大写。返回生成的字符串。对于两者，转换都是文化敏感的（culture-sensitive）。这些方法的某些版本允许你指定文化设置，以决定这些方法如何执行转换。在此所示：\n\
  \n```csharp\npublic string ToLower(CultureInfo culture)\npublic string ToUpper(CultureInfo\
  \ culture)\n```\n\n使用这些形式可以避免你的源代码中关于在更改大小写时想要遵循哪些规则产生歧义，这些是推荐使用的形式。\n\n此外可用的方法还有\
  \ `ToUpperInvariant()` 和 `ToLowerInvariant()`如下：\n\n```csharp\npublic string ToUpperInvariant()\n\
  public string ToLowerInvariant()\n```\n\n这些方法的作用与 `ToUpper()` 和 `ToLower()` 类似，但它们使用不变文化（invariant\
  \ culture）来执行大写或小写的转换。\n\n### 使用 Substring() 方法\n\n你可以通过 `Substring()` 方法获取字符串的一部分。它有两种两种形式：\n\
  \n```csharp\npublic string Substring(int startIndex)\npublic string Substring(int\
  \ startIndex, int length)\n```\n\n在第一种形式中，子字符串从 `startIndex` 指定的索引开始，一直到调用字符串的末尾。在第二种形式中，子字符串从\
  \ `startIndex` 开始，持续 `length` 个字符。在每情况下，都会返回子字符串。\n\n以下程序演示了 `Substring()` 方法：\n\
  \n```csharp\n// Use Substring().\nusing System;\n\nclass SubstringDemo {\n  static\
  \ void Main() {\n    string str = \"ABCDEFGHIJKLMNOPQRSTUVWXYZ\";\n    Console.WriteLine(\"\
  str: \" + str);\n    Console.Write(\"str.Substring(15): \");\n    string substr\
  \ = str.Substring(15);\n    Console.WriteLine(substr);\n    Console.Write(\"str.Substring(0,\
  \ 15): \");\n    substr = str.Substring(0, 15);\n    Console.WriteLine(substr);\n\
  \  }\n}\n```\n\n以下输出为：\n\n```\nstr: ABCDEFGHIJKLMNOPQRSTUVWXYZ\nstr.Substring(15):\
  \ PQRSTUVWXYZ\nstr.Substring(0, 15): ABCDEFGHIJKLMNO\n```\n\n### 字符串方法\n\n在这里，`value`\
  \ 所指的字符串被插入到调用字符串中由 `startIndex` 指定索引处。返回生成的字符串。\n\n### 格式化概述\n\n格式化由两个组件控制：*格式说明符*（format\
  \ specifiers）和*格式提供程序*（format providers）。值的字符串表示所需的形式通过格式说明符进行控制。\n\n### 格式化\n\n\
  要对数据进行格式化，请在支持格式化的方法调用中包含格式说明符。\n\n\n\n\n在执行过程中，当在格式字符串中遇到格式项时，将根据 `argnum` 指定相应的参数进行替换并显示。因此，格式项在格式字符串中的位置决定了其匹配数据显示的位置。而参数编号则决定了将对哪个参数进行格式化。\n\
  \n如果存在 `fmt`，则将使用指定的格式显示数据。否则，将使用默认格式。如果存在 `width`，则输出将用空格进行填充，以确保达到最小字段宽度。如果 `width`\
  \ 为正数，则输出右对齐；如果 `width` 为负数，则输出左对齐。\n\n本章的剩余部分将详细介绍格式化和格式说明符。\n\n### 数值格式说明符\n\n\
  针对数值数据定义了多种格式说明符。它们显示在表 22-4 中。每个格式说明符都可以包含一个可选的精度说明符。例如，要将一个值表示为带有两位小数的定点值，请使用\
  \ `F2`。\n\n如所述，某些格式说明符的精确效果取决于文化设置。例如，货币说明符 `C` 会自动以所选文化的货币格式显示值。对于大多数用户来说，默认的文化信息与其区域设置和语言匹配。因此，可以使用相同的格式说明符，而不必担心程序执行时的文化背景。\n\
  \n![Image](img/t0717-01.jpg)\n\n**表 22-4** 数值格式说明符\n\n以下是一个演示若干数值格式说明符的程序：\n\n```c\n\
  // Demonstrate various format specifiers.\nusing System;\n\nclass FormatDemo {\n\
  \  static void Main() {\n    double v = 17688.65849;\n    double v2 = 0.15;\n  \
  \  int x = 21;\n    Console.WriteLine(\"{0:F2}\", v);\n    Console.WriteLine(\"\
  {0:N5}\", v);\n    Console.WriteLine(\"{0:e}\", v);\n    Console.WriteLine(\"{0:r}\"\
  , v);\n    Console.WriteLine(\"{0:p}\", v2);\n    Console.WriteLine(\"{0:X}\", x);\n\
  \    Console.WriteLine(\"{0:D12}\", x);\n    Console.WriteLine(\"{0:C}\", 189.99);\n\
  \  }\n}\n```\n\n输出所示：\n```\n17688.66\n17,688.65849\n1.76886e+004\n17688.65849\n\
  15.00%\n15000000021\n$189.99\n```\n注意几种格式中精度说明符的效果。\n\n### 理解参数编号\n\n重要的一点是，与格式项关联的参数是由参数编号决定的，而不是参数的位置。这意味着在同一个\
  \ `WriteLine()` 调用中，同一个参数可以输出多次。这还意味着参数的显示顺序可以与它们在参数列表中指定的顺序不同。例如，考虑以下程序：\n\n```csharp\n\
  using System;\n\nclass Format2 {\n  static void Main() {\n    // Format the same\
  \ argument three different ways:\n    Console.WriteLine(\"{0:F2} {0:F3} {0:e}\"\
  , 10.2345);\n    // Display arguments in non-sequential order.\n    Console.WriteLine(\"\
  {2:d} {0:d} {1:d}\", 1, 2, 3);\n  }\n}\n```\n\n输出所示：\n```\n10.23 10.235 1.02345e+01\n\
  3 1 2\n```\n在第一个 `WriteLine()` 语句中，同一个参数 `10.2345` 以三种不同的方式进行了格式化。这是可能的，因为每个格式说明符都引用了第一个（也是唯一的）参数。在第二个\
  \ `WriteLine()` 语句中，三个参数按非顺序顺序显示。记住，并没有规则规定格式说明符必须按顺序使用参数。任何格式说明符都可以引用任何参数。\n\n\
  #### 使用 `String.Format()` 和 `ToString()` 格式化数据\n\n虽然将格式命令嵌入 `WriteLine()` 中是格式化输出的一种方便方法，但有时你可能想要创建一个包含格式化数据的字符串，而不是立即显示该字符串。这样做可以让你预先对数据进行格式化，稍后将其输出到你选择的设备上。这在\
  \ GUI 环境（如 Windows）中特别有用，因为那里很少使用基于控制的 I/O，或者用于为网页准备输出。\n\n通常情况下，有两种方法获取值的格式化字符串。一种方法是使用\
  \ `String.Format()`。另一种方法是将格式说明符传递给内置数值类型的 `ToString()` 方法。这里将检查这两种方法。\n\n#####\
  \ 使用 `String.Format()` 格式化值\n\n你可以通过调用 `String` 定义的任一 `Format()` 方法获取格式化值。它们显示在表\
  \ 22-5 中。`Format()` 的工作原理类似于 `WriteLine()`，不同之处它返回一个格式化字符串，而不是将其输出到控制台。\n\n![Image](img/t0719-01.jpg)\n\
  \n**表 22-5** `Format()` 方法\n\n这里是将之前的格式演示程序重写为使用 `String.Format()`。它产生的输出与之前的版本相同。\n\
  \n```csharp\n// Use String.Format() to format a value.\nusing System;\n\nclass FormatDemo\
  \ {\n  static void Main() {\n    double v = 17688.65849;\n    double v2 = 0.15;\n\
  \    int x = 21;\n    string str = String.Format(\"{0:F2}\", v);\n    Console.WriteLine(str);\n\
  \    str = String.Format(\"{0:N5}\", v);\n    Console.WriteLine(str);\n    str =\
  \ String.Format(\"{0:e}\", v);\n    Console.WriteLine(str);\n    str = String.Format(\"\
  {0:r}\", v);\n    Console.WriteLine(str);\n    str = String.Format(\"{0:p}\", v2);\n\
  \    Console.WriteLine(str);\n    str = String.Format(\"{0:X}\", x);\n    Console.WriteLine(str);\n\
  \    str = String.Format(\"{0:D12}\", x);\n    Console.WriteLine(str);\n    str\
  \ = String.Format(\"{0:C}\", 189.99);\n    Console.WriteLine(str);\n  }\n}\n```\n\
  \n与 `WriteLine()` 类似，`String.Format()` 允许在普通文本中嵌入格式说明符，你可以使用多个值。例如，考虑以下程序，它显示了 1\
  \ 到 10 的累加和和乘积：\n\n```csharp\nusing System;\n\nclass FormatDemo {\n  static void\
  \ Main() {\n    int i;\n    int sum = 0;\n    int prod = 1;\n    string str;\n \
  \   // Display the running sum and product of numbers 1 through 10.\n    for (i\
  \ = 1; i <= 10; i++) {\n      sum += i;\n      prod *= i;\n      str = String.Format(\"\
  Sum: {0,3} Product: {1,8}\", sum, prod);\n      Console.WriteLine(str);\n    }\n\
  \  }\n}\n```\n\n特别注意此语句：\n```csharp\nstr = String.Format(\"Sum: {0,3} Product: {1,8}\"\
  , sum, prod);\n```\n此 `Format()` 调用包含两个格式项，一个针对 **sum**，另一个针对 **prod**。注意参数编号指定的方式与使用\
  \ `WriteLine()` 时一样。\n\n##### 使用 `ToString()` 格式化数据\n\n对于所有内置的数值结构类型（如 `Int32` 或\
  \ `Double`），你都可以使用 `ToString()` 获取值的格式化字符串表示。为了这样做，你将使用 `ToString()` 的这种通用形式：\n\n\
  `ToString(*format string*)`\n\n它根据传入的 *format string* 中的格式说明符，返回调用对象的字符串表示。例如，以下程序通过使用\
  \ C 格式说明符创建值 189.99 的货币表示：\n\n```csharp\nstring str = 189.99.ToString(\"C\");\n\
  ```\n\n\n\n\n\n这里是对之前格式化程序的重写，它使用 `ToString()` 来获取格式化后的字符串。产生的输出与之前的版本相同。\n\n```csharp\n\
  // 使用 ToString() 来格式化值。\nusing System;\n\nclass ToStringDemo {\n  static void Main()\
  \ {\n    double v = 17688.65849;\n    double v2 = 0.15;\n    int x = 21;\n    string\
  \ str = v.ToString(\"F2\");\n    Console.WriteLine(str);\n    str = v.ToString(\"\
  N5\");\n    Console.WriteLine(str);\n    str = v.ToString(\"e\");\n    Console.WriteLine(str);\n\
  \    str = v.ToString(\"r\");\n    Console.WriteLine(str);\n    str = v2.ToString(\"\
  p\");\n    Console.WriteLine(str);\n    str = x.ToString(\"X\");\n    Console.WriteLine(str);\n\
  \    str = x.ToString(\"D12\");\n    Console.WriteLine(str);\n    str = 189.99.ToString(\"\
  C\");\n    Console.WriteLine(str);\n  }\n}\n```\n\n## 创建自定义数值格式\n\n虽然预定义的数值格式占位符非常有用，但\
  \ C# 赋予了你定义自己的、自定义的格式的能力，这种功能有时被称为*图片格式*（picture format）。*图片格式*这个术语源于这样一个事实：你通过指定一个示例（即一张“图片”）来描述你希望输出的样式，从而创建一个自定义格式。这种方法在第一部分中简要提到过。在这里对其进行了详细研究。\n\
  \n### 自定义格式占位符字符\n\n当你创建自定义格式时，你通过创建一个你想要数据显示的形式的示例（或图片）来指定该格式。为了做到这一点，你使用表 22-6\
  \ 所示的字符作为占位符。我们将逐对每个字符进行检查。\n\n![Image](img/t0723-01.jpg)\n\n**表 22-6** 自定义格式占位符字符\n\
  \n点指定了小数点的位置。\n\n`#` 占位符指定数字位置。`#` 可以出现在小数点的左侧或右侧，也可以单独出现。当一个或多个 `#` 出现在小数点的右侧时，它们指定了要显示的小位数。如果有必要，值将进行四舍五入。当\
  \ `#` 出现在小数点的左侧时，它指定了该值整数部分的数字位置。如果有必要，将添加前导零。如果值的整数部分数字多于 `#` 的数量，则将显示整个整数部分。在任何情况下，值的整数部分都不会被截断。如果没有小数点，则\
  \ `#` 会导致值被四舍五入为其整数值。不重要的零值（例如末尾零）将不会显示。然而，这导致了一个有些奇怪的特性，因为如果被格式化的值零，那么诸如 `#.##`\
  \ 这样的格式将什么都不显示。要输出零值，请使用下一个描述的 `0` 占位符。\n\n`0` 占位符会导致添加前导或尾随 `0`，以确保存在最小数量的数字。它可以用于小数点的左侧和右侧。例如，\n\
  \n```csharp\nConsole.WriteLine(\"{0:00##.#00}\", 21.3);\n```\n\n显示此输出：\n\n`0021.300`\n\
  \n包含更多数字的值将在小数点的左侧完整显示，并在右侧进行四舍五入。\n\n你可以通过指定一个在 `#` 序列中嵌入逗号的模式来在大数字中插入逗号。例如，这个：\n\
  \n```csharp\nConsole.WriteLine(\"{0:#,###.#}\", 3421.3);\n```\n\n显示\n\n`3,421.3.`\n\
  \n没有必要为每个位置指定每个逗号。指定一个逗号会导致它从左侧起每第三位数字插入到值中。例如，\n\n```csharp\nConsole.WriteLine(\"\
  {0:#,###.#}\", 8763421.3);\n```\n\n产生此输出：\n\n`8,763,421.3.`\n\n逗号有第二种含义。当它们出现在小数点的直接左侧时，它们充当缩放因子。每个逗号会导致值除以\
  \ 1,000。例如，\n\n```csharp\nConsole.WriteLine(\"Value in thousands: {0:#,###,.#}\"\
  , 8763421.3);\n```\n\n产生此输出：\n\n`Value in thousands: 8,763.4`\n\n如输出所示，值按千进行了缩放。\n\
  \n除了占位符外，自定义格式指定符还可以包含其他字符。任何其他字符都直接通过，以它们在指定符中出现的形式出现。例如，这个 `WriteLine()` 语句：\n\
  \n```csharp\nConsole.WriteLine(\"Fuel efficiency is {0:##.#}\", 21.3);\n```\n\n\
  产生此输出：\n\n`Fuel efficiency is 21.3 mpg`\n\n有时你还可以使用转义序列，例如 `\\t` 或 `\\n`。`E` 和 `e`\
  \ 占位符会导致值以科学计数法显示。`E` 或 `e` 后面必须跟随至少一个 `0`，也可以有多个。`0` 表示将显示的小位数。小数部分将进行四舍五入以适应格式。\n\
  \n\n\n\n日期和时间的格式通过格式指定符进行处理。日期和时间的格式指定符如表 22-7 所示。由于特定的日期和时间表示可能因国家和语言而异，因此生成的精确表示将受到文化设置的影响。\n\
  \n![Image](img/t0726-01.jpg)\n\n**表 22-7** 日期和时间格式指定符\n\n下面的程序演示了日期和时间的格式指定符：\n\n\
  ```csharp\n// 格式化日期时间信息。\n\nusing System;\n\nclass TimeAndDateFormatDemo {\n  static\
  \ void Main() {\n    DateTime dt = DateTime.Now; // 获取当前时间\n    Console.WriteLine(\"\
  d format: {0:d}\", dt);\n    Console.WriteLine(\"D format: {0:D}\", dt);\n    Console.WriteLine(\"\
  t format: {0:t}\", dt);\n    Console.WriteLine(\"T format: {0:T}\", dt);\n    Console.WriteLine(\"\
  f format: {0:f}\", dt);\n    Console.WriteLine(\"F format: {0:F}\", dt);\n    Console.WriteLine(\"\
  g format: {0:g}\", dt);\n    Console.WriteLine(\"G format: {0:G}\", dt);\n    Console.WriteLine(\"\
  m format: {0:m}\", dt);\n    Console.WriteLine(\"M format: {0:M}\", dt);\n    Console.WriteLine(\"\
  o format: {0:o}\", dt);\n    Console.WriteLine(\"O format: {0:O}\", dt);\n    Console.WriteLine(\"\
  r format: {0:r}\", dt);\n    Console.WriteLine(\"R format: {0:R}\", dt);\n    Console.WriteLine(\"\
  s format: {0:s}\", dt);\n    Console.WriteLine(\"u format: {0:u}\", dt);\n    Console.WriteLine(\"\
  U format: {0:U}\", dt);\n    Console.WriteLine(\"y format: {0:y}\", dt);\n    Console.WriteLine(\"\
  Y format: {0:Y}\", dt);\n  }\n}\n```\n\n示例输出所示：\n\nd format: 2/11/2010\nD format:\
  \ Thursday, February 11, 2010\nt format: 11:21 AM\nT format: 11:21:23 AM\nf format:\
  \ Thursday, February 11, 2010 11:21 AM\nF format: Thursday, February 11, 2010 11:21:23\
  \ AM\ng format: 2/11/2010 11:21 AM\nG format: 2/11/2010 11:21:23 AM\nm format: February\
  \ 11\nM format: February 11\no format: 2010-02-11T11:21:23.3768153-06:00\nO format:\
  \ 2010-02-11T11:21:23.3768153-06:00\nr format: Thu, 11 Feb 2010 11:21:23 GMT\nR\
  \ format: Thu, 11 Feb 2010 11:21:23 GMT\ns format: 2010-02-11T11:21:23\nu format:\
  \ 2010-02-11 11:21:23Z\nU format: Thursday, February 11, 2010 5:21:23 PM\ny format:\
  \ February, 2010\nY format: February, 2010\n\n下一个程序创建了一个简单的时钟。时间每秒更新一次。在每个小时的开头，电脑会响铃。它使用\
  \ `DateTime` 的 `ToString()` 方法来获取格式化时间。如果到了整点，则会在格式化时间后附加警报字符 `\\a`，从而使铃声。\n\n```csharp\n\
  // 一个简单的时钟。\nusing System;\nclass SimpleClock {\n  static void Main() {\n    string\
  \ t;\n    int seconds;\n    DateTime dt = DateTime.Now;\n    seconds = dt.Second;\n\
  \    for(;;) {\n      dt = DateTime.Now;\n      // 如果秒变化，则更新时间\n      if(seconds\
  \ != dt.Second) {\n        seconds = dt.Second;\n        t = dt.ToString(\"T\");\n\
  \        if(dt.Minute == 0 && dt.Second == 0)\n          t = t + \"\\a\"; // 在整点时响铃\n\
  \        Console.WriteLine(t);\n      }\n    }\n  }\n}\n```\n\n##### 创建自定义日期和时间格式\n\
