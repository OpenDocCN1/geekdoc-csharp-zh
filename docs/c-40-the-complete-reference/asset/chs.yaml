  \ 支持的字段\n\n### Char\n\n对应 `char` 类型的结构是 `Char`。它非常有用，因为它提供了许多允许处理和分类字符的方法。例如，你可以通过\
  \ `ToUpper()` 将小写字符转换为大写。你可以通过 `IsDigit()` 判断一个字符是否为数字。\n\n\n\n\n\n`Char` 定义的方法如\
  \ 表 21-9 所示。注意，某些方法，例如 `ConvertFromUtf32()` 和 `ConvertToUtf32()`，使你能够同时处理 UTF-16\
  \ 和 UTF-32 Unicode 字符。在过去，所有的 Unicode 字符都可以用 16 位表示，这正是 `char` 的大小。然而，几年前 Unicode\
  \ 字符集扩展了，现在需要超过 16 位空间。每个 Unicode 字符都由一个 `code point`（代码点）表示。代码点的编码方式取决于所使用的 Unicode\
  \ 转换格式 ((UTF))）。在 UTF-16 中，最常见的代码点需要一个 16 位的值，但某些需要两个 16 位的值。当需要两个 16 位的值时，会使用两个\
  \ `char` 值来表示。第一个字符被称为 `high surrogate`（高代理项），第二个被称为 `low surrogate`（低代理项）。在 UTF-32\
  \ 中，每个代码点都使用一个 32 位的值。`Char` 提供了 UTF-16 和 UTF-32 之间必要的转换。\n\n关于 `Char` 方法的另一点：`ToUpper()`\
  \ 和 `ToLower()` 的默认形式使用当前的文化设置来确定如何将字符转换为大写或小写。在编写本文时，推荐的风格是使用带有 `CultureInfo` 参数的这些方法的另一种形式来显式指定文化设置。`CultureInfo`\
  \ 位于 `System.Globalization` 中。你可以传递属性 `CultureInfo.CurrentCulture` 来指定当前文化。\n\n\
  `Char` 定义了以下字段：\n\n```csharp\npublic const char MaxValue\npublic const char MinValue\n\
  ```\n\n这些字段代表 `char` 变量可以存储的最大值和最小值。\n\n`Char` 实现以下接口：`IComparable`、`IComparable<char>`、`IConvertible`\
  \ 和 `IEquatable<char>`。\n\n![Image](img/t0658-01.jpg)\n![Image](img/t0658-01a.jpg)\n\
  ![Image](img/t0659-01.jpg)\n![Image](img/t0659-01a.jpg)\n![Image](img/t0660-01.jpg)\n\
  ![Image](img/t0660-01a.jpg)\n\n**表 21-9** `Char` 定义的方法\n\n以下是一个演示了 `Char` 定义的若干方法的程序：\n\
  \n```csharp\n// Demonstrate several Char methods.\nusing System;\nusing System.Globalization;\n\
  \nclass CharDemo {\n  static void Main() {\n    string str = \"This is a test. $23\"\
  ;\n    int i;\n    for(i=0; i < str.Length; i++) {\n      Console.Write(str[i] +\
  \ \" is\");\n      if(Char.IsDigit(str[i]))\n        Console.Write(\" digit\");\n\
  \      if(Char.IsLetter(str[i]))\n        Console.Write(\" letter\");\n      if(Char.IsLower(str[i]))\n\
  \        Console.Write(\" lowercase\");\n      if(Char.IsUpper(str[i]))\n      \
  \  Console.Write(\" uppercase\");\n      if(Char.IsSymbol(str[i]))\n        Console.Write(\"\
  \ symbol\");\n      if(Char.IsSeparator(str[i]))\n        Console.Write(\" separator\"\
  );\n      if(Char.IsWhiteSpace(str[i]))\n        Console.Write(\" whitespace\");\n\
  \      if(Char.IsPunctuation(str[i]))\n        Console.Write(\" punctuation\");\n\
  \      Console.WriteLine();\n    }\n    Console.WriteLine(\"Original: \" + str);\n\
  \    // Convert to uppercase.\n    string newstr = \"\";\n    for(i=0; i < str.Length;\
  \ i++)\n      newstr += Char.ToUpper(str[i], CultureInfo.CurrentCulture);\n    Console.WriteLine(\"\
  Uppercased: \" + newstr);\n  }\n}\n```\n\n输出结果所示：\n\n```\nT is letter uppercase\n\
  h is letter lowercase\ni is letter lowercase\ns is letter lowercase\n  is separator\
  \ whitespace\ni is letter lowercase\ns is letter lowercase\n  is separator whitespace\n\
  a is letter lowercase\n  is separator whitespace\nt is letter lowercase\ne is letter\
  \ lowercase\nt is letter lowercase\n. is punctuation\n  is separator whitespace\n\
  $ is symbol\n2 is digit\n3 is digit\nOriginal: This is a test. $23\nUppercased:\
  \ THIS IS A TEST. $23\n```\n\n### 布尔结构体\n\n`Boolean` 结构体支持 `bool` 数据类型。`Boolean`\
