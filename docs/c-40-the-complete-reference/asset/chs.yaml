  \ 章所知，程序集带有它包含的类、结构体等的类型信息。反射 API（Reflection API）允许你加载程序集、发现有关它的信息，并创建其任何公开可用类型的实例。使用这种机制，程序可以搜索其环境，利用可能在编译时无需显式定义该功能即可获得的功能性。这是一个极其强大且令人兴奋的概念。例如，你可以想象一个充当“类型浏览器”的程序，显示系统上可用的类型。另一个应用可以是设计工具，让你能够视觉化地“连线”一个由系统支持的各种类型组成的程序。由于关于类型的所有信息都是可发现的，因此反射的应用方式没有固有的限制。\n\
  \n要获取有关程序集的信息，你首先需要创建一个 `Assembly` 对象。`Assembly` 类没有定义公共构造函数。相反，通过调用它的其中一个方法可以获取\
  \ `Assembly` 对象。我们将使用的是 `LoadFrom()` 方法，它根据指定的文件名加载程序集。我们将使用的格式所示：\n\n```csharp\n\
  static Assembly LoadFrom(string assemblyFile)\n```\n\n在这里，`assemblyFile` 指定了程序集的文件名。\n\
  \n一旦获取了 `Assembly` 对象，你就可以通过对其调用 `GetTypes()` 方法来发现它定义的类型。其通用格式如下：\n\n```csharp\n\
  Type[] GetTypes()\n```\n\n它返回一个包含程序集中的类型数组。\n\n为了演示程序集中的类型发现，你需要两个文件。第一个文件将包含一组类，这些类将被第二个文件发现。首先，创建一个名为\
  \ `MyClasses.cs` 的文件，包含以下内容：\n\n```csharp\n// 一个包含三个类的文件。将此文件命名为 MyClasses.cs。\n\
  \nusing System;\n\nclass MyClass {\n  int x;\n  int y;\n  public MyClass(int i)\
  \ {\n    Console.WriteLine(\"Constructing MyClass(int). \");\n    x = y = i;\n \
  \   Show();\n  }\n  public MyClass(int i, int j) {\n    Console.WriteLine(\"Constructing\
  \ MyClass(int, int). \");\n      x = i;\n      y = j;\n      Show();\n  }\n  public\
  \ int Sum() {\n    return x+y;\n  }\n  public bool IsBetween(int i) {\n    if((x\
  \ < i) && (i < y)) return true;\n    else return false;\n  }\n  public void Set(int\
  \ a, int b) {\n    Console.Write(\"Inside Set(int, int). \");\n      x = a;\n  \
  \    y = b;\n      Show();\n  }\n  // Over 载 Set.\n  public void Set(double a, double\
  \ b) {\n    Console.Write(\"Inside Set(double, double). \");\n      x = (int) a;\n\
  \      y = (int) b;\n      Show();\n  }\n  public void Show() {\n    Console.WriteLine(\"\
  Values are x: {0}, y: {1}\", x, y);\n  }\n}\n\nclass AnotherClass {\n  string msg;\n\
  \  public AnotherClass(string str) {\n    msg = str;\n  }\n  public void Show()\
  \ {\n    Console.WriteLine(msg);\n  }\n}\n\nclass Demo {\n  static void Main() {\n\
  \    Console.WriteLine(\"This is a placeholder.\");\n  }\n}\n```\n\n该文件包含了 `MyClass`，我们在之前的示例中已使用过。它添加了第二个名为\
  \ `AnotherClass` 的类和第三个名为 `Demo` 的类。因此，此程序产生的程序集将包含三个类。接下来，编译此文件以生成 `MyClasses.exe`\
  \ 文件。这就是将被查询的程序集。此处显示了发现 `MyClasses.exe` 信息的程序。此时输入 /* 使用反射定位程序集、确定类型并创建对象。 */ \n\
