  \ new ThreeD(0, 0, 0);\n  }\n  // 重载 !.\n  public static bool operator !(ThreeD\
  \ op)\n  {\n    if((op.x != 0) || (op.y != 0) || (op.z != 0))\n      return false;\n\
  \    else return true;\n  }\n  // 重载 true.\n  public static bool operator true(ThreeD\
