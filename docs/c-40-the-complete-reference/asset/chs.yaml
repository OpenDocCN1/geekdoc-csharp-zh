  \    // fs.Length = 10; // 错误！\n  }\n}\n```\n\n##### **自动实现属性**\n\n从 C# 3.0 开始，可以在不显式定义属性管理的变量的情况下实现非常简单的属性。相反，你可以让编译器自动提供底层变量。这被称为*自动实现属性*。它具有以下通用形式：\n\
  \n`类型 名称 { get; set; }`\n\n在这里，*类型* 指定属性的类型，*名称* 指定名称。注意 `get` 和 `set` 后面紧跟着分号。自动实现属性的访问器没有正体。这种语法告诉编译器自动创建一个存储值的存储位置（有时称为*后备字段*）。该变量没有名称，你无法直接访问它。相反，它只能通过属性访问。\n\
  \n以下是使用自动实现属性声明名为 `UserCount` 的属性的方法：\n\n`public int UserCount { get; set; }`\n\n\
  \n\n\n\n与普通属性不同，自动实现属性不能是只读或只写的。在所有情况下，都必须同时指定 `get` 和 `set`。然而，正如本章后部分“在访问器上使用访问修饰符”所解释的那样，你可以通过将\
  \ `get` 或 `set` 声明为 `private` 来实现相同的效果。\n\n尽管自动实现属性提供了便利性，但它们的使用限于限于那些不需要对备份字段（backing\
  \ field）的获取或设置控制的情况。请记住，你无法直接访问备份字段。这意味着没有办法限制自动实现属性可以拥有的值。因此，自动实现属性只是让属性名称作为字段本身的代理。然而，有时这正是你所想要的。此外，在属性被用于向第三方暴露功能（可能通过设计工具）的情况下，它们也可能非常有用。\n\
  \n## 在属性上使用对象初始化器\n\n正如在第 8 章中讨论的，*对象初始化器*为创建对象时提供了显式调用构造函数的替代方案。当使用对象初始化器时，你为想要初始化的字段和/或属性指定初始值。此外，属性或字段的对象初始化器语法是相同的。例如，这里是来自第\
  \ 8 章的对象初始化器演示程序，经过重新编写以展示在属性上使用对象初始化器。回想第 8 章中版本使用的是字段。此版本程序与第 8 章中所示程序的唯一区别是 `Count`\
  \ 和 `Str` 已从字段转换为属性。对象初始化器的语法保持不变。\n\n```csharp\n 在属性上使用对象初始化器。\n\nusing System;\n\
  \nclass MyClass {\n  // 这些现在是属性。\n  public int Count { get; set; }\n  public string\
  \ Str { get; set; }\n}\n\nclass ObjInitDemo {\n  static void Main() {\n    // 使用对象初始化器构造\
  \ MyClass 对象。\n    MyClass obj = new MyClass { Count = 100, Str = \"Testing\" };\n\
  \    Console.WriteLine(obj.Count + \" \" + obj.Str);\n  }\n}\n```\n\n如你所示，属性 `Count`\
  \ 和 `Str` 是通过对象初始化器表达式设置的。输出与第 8 章中程序产生的相同，并在此显示：\n\n100 Testing\n\n正如第 8 章所解释的，当处理由\
  \ LINQ 表达式生成的匿名类型时，对象初始化器语法最用。大多数其他情况下，你将使用普通的构造器语法。\n\n## 属性限制\n\n属性有一些重要的限制。首先，因为属性没有定义存储位置，因此它不能作为\
  \ `ref` 或 `out` 参数传递给方法。其次，你不能重载属性。（你*可以*拥有两个都访问同一个变量的不同属性，但这通常是不寻常的。）最后，当调用 `get`\
  \ 访问器时，属性不应更改底层变量的状态。虽然编译器没有强制执行这一规则，但违反它在语义上是错误的。`get` 操作应该是非侵入性的。\n\n### 在访问器上使用访问修饰符\n\
  \n默认情况下，`set` 和 `get` 访问器的可访问性与它们所属的索引器或属性具有相同的访问权限。例如，如果属性声明为 `public`，那么默认情况下\
  \ `get` 和 `set` 访问器也是公共的。然而，可以为 `set` 或 `get` 它们自己的访问修饰符，例如 `private`。在所有情况下，访问器的访问修饰符必须比其属性或索引器的访问规范更严格。\n\
  \n有很多原因你可能想要限制访问器的可访问性。例如，你可能希望允许任何人获取属性的值，但只允许该类的成员设置属性。要实现这一点，将 `set` 访问器声明为 `private`。例如，这里有一个名为\
  \ `MyProp` 的属性，其 `set` 访问器被指定为 `private`。\n\n```csharp\n 在访问器上使用访问修饰符。\n\nusing\
  \ System;\n\nclass PropAccess {\n  int prop; // 由 MyProp 管理的字段\n  public PropAccess()\
  \ { prop = 0; }\n  /* 这是支持访问\n      私有实例变量 prop 的属性。它允许\n      任何代码获取 prop 的值，但只有\n\
  \      类成员可以设置 prop 的值。 */\n  public int MyProp {\n    get {\n      return prop;\n\
  \    }\n    private set { // 现在是私有的\n      prop = value;\n    }\n  }\n  // 此类成员增加\
  \ MyProp 的值。\n  public void IncrProp() {\n    MyProp++; // OK，在同一个类中。\n  }\n}\n\
  // 展示访问器修饰符。\nclass PropAccessDemo {\n  static void Main() {\n    PropAccess ob\
  \ = new PropAccess();\n    Console.WriteLine(\"MyProp 的原始值: \" + ob.MyProp); //\
  \ ob.MyProp = 100; // 无法访问\n    ob.IncrProp();\n    Console.WriteLine(\"增加后 MyProp\
  \ 的值: \" + ob.MyProp);\n  }\n}\n```\n\n在 `PropAccess` 类中，`set` 访问器被指定为 `private`。这意味着它可以被其他成员访问，例如\
  \ `IncrProp`。这就是为什么在 `PropAccess` 外部无法赋值。由于 `set` 访问器被声明为 `private`，它只能被类内部访问。\n\
  \n（注：原文提供的文本在后半部分出现了严重的逻辑错乱/重复，翻译已根据上下文进行了修正和对齐。由于原始文本中存在大量重复和乱序的句子，上述译文确保了技术逻辑的连贯性。）\n\
  \n\n\n```csharp\n// Demo 改进后的 fail-soft 数组\n\nclass FinalFSDemo {\n  static void\
  \ Main() {\n    FailSoftArray fs = new FailSoftArray(5);\n    // 使用 Error 属性\n \
  \   for(int i=0; i < fs.Length + 1; i++) {\n      fs[i] = i*10;\n      if(fs.Error)\n\
  \        Console.WriteLine(\"Error with index \" + i);\n    }\n  }\n}\n```\n\n这个版本的\
  \ `FailSoftArray` 工作原理与之前的版本相同，但它不再包含显式声明的底层字段。\n\n以下在使用访问器（accessors）配合访问修饰符时需要遵循的限制。首先，只能修改\
  \ `set` 或 `get` 访问器，不能两者都修改。此外，访问修饰符必须比属性或索引器的访问级别具有更高的严格性。最后，在接口内部声明访问器或实现接口指定的访问器时，不能使用访问修饰符。（接口的详细描述请参见第\
  \ 12 章。）\n\n### 使用索引器和属性\n\n尽管前面的示例演示了索引器和属性的基本机制，但它们尚未展示出全部威力。为了结束本章，我们开发了一个名为\
  \ `RangeArray` 的类，它使用索引器和属性创建了一种数组类型，其中数组的索引范围由程序员决定。\n\n如你所知，在 C# 中，所有数组都从零开始索引。然而，某些应用受益于允许从任意点开始索引的数组。例如，在某些情况下，数组从\
  \ 1 开始索引可能会更方便。在另一种情况下，允许负索引可能是有益的，例如一个从 –5 运行 5 的数组。这里开发的 `RangeArray` 类允许此类以及其他类型的索引。\n\
  \n使用 `RangeArray`，你可以编写如下代码：\n\n```csharp\nRangeArray ra = new RangeArray(-5, 10);\
  \ // 索引从 -5 到 10 的数组\nfor(int i=-5; i <= 10; i++) ra[i] = i; // 索引从 -5 到 10\n```\n\
  \n正如你所猜到的，第一行构造了一个从 –5 到 10（包含边界）的 `RangeArray`。第一个参数指定起始索引。第二个参数指定结束索引。一旦 `ra`\
  \ 构造完成，就可以从 –5 到 10 进行索引。\n\n这里展示了整个 `RangeArray` 类，以及演示该数组的 `RangeArrayDemo`。按照在此处的实现方式，`RangeArray`\
  \ 支持 `int` 类型的数组，但根据需要，你可以更改数据类型。\n\n```csharp\n/* 创建一个可以指定范围的数组类。\n   RangeArray\
  \ 类允许索引从除 0 以外的\n   某些值开始。当你创建一个 RangeArray 时，\n   指定起始和结束索引。允许\n   负索引。例如，你可以创建\n\
  \   索引从 -5 到 5、1 到 10 或 50 到 56 的数组。 */\n\nusing System;\nclass RangeArray {\n \
  \ // 私有数据\n  int[] a; // 指向底层数组的引用\n  int lowerBound; // 最小索引\n  int upperBound;\
  \ // 极大索引\n\n  // 自动实现的、只读 Length 属性\n  public int Length { get; private set; }\n\
  \n  // 自动实现的、只读 Error 属性\n  public bool Error { get; private set; }\n\n  // 给定大小构造数组\n\
  \  public RangeArray(int low, int high) {\n    high++;\n    if(high <= low) {\n\
  \      Console.WriteLine(\"Invalid Indices\");\n      high = 1; // 为了安全创建一个最小数组\n\
  \      low = 0;\n    }\n    a = new int[high - low];\n    Length = high - low;\n\
  \    lowerBound = low;\n    upperBound = --high;\n  }\n\n  // 这是 RangeArray 的索引器\n\
  \  public int this[int index] {\n    // 这是 get 访问器\n    get {\n      if(ok(index))\
  \ {\n        Error = false;\n        return a[index - lowerBound];\n      } else\
  \ {\n        Error = true;\n        return 0;\n      }\n    }\n    // 这是 set 访问器\n\
  \    set {\n      if(ok(index)) {\n        a[index - lowerBound] = value;\n    \
  \    Error = false;\n      }\n      else Error = true;\n    }\n  }\n\n  // 如果索引在边界内，则返回\
  \ true\n  private bool ok(int index) {\n    if(index >= lowerBound && index <= upperBound)\
  \ return true;\n    return false;\n  }\n}\n\n// 演示索引范围数组\nclass RangeArrayDemo {\n\
  \  static void Main() {\n    RangeArray ra = new RangeArray(-5, 5);\n    RangeArray\
  \ ra2 = new RangeArray(1, 10);\n    RangeArray ra3 = new RangeArray(-20, -12);\n\
  \    // 演示 ra\n    Console.WriteLine(\"Length of ra: \" + ra.Length);\n    for(int\
  \ i=-5; i <= 5; i++) ra[i] = i;\n    Console.Write(\"Contents of ra: \");\n    for(int\
  \ i=-5; i <= 5; i++) Console.Write(ra[i] + \" \");\n    Console.WriteLine(\"\\n\"\
  );\n\n    // 演示 ra2\n    Console.WriteLine(\"Length of ra2: \" + ra2.Length);\n\
  \    for(int i=1; i <= 10; i++) ra2[i] = i;\n    Console.Write(\"Contents of ra2:\
  \ \");\n    for(int i=1; i <= 10; i++) Console.Write(ra2[i] + \" \");\n    Console.WriteLine(\"\
  \\n\");\n\n    // 演示 ra3\n    Console.WriteLine(\"Length of ra3: \" + ra3.Length);\n\
  \    for(int i=-20; i <= -12; i++) ra3[i] = i;\n    Console.Write(\"Contents of\
  \ ra3: \");\n    for(int i=-20; i <= -12; i++) Console.Write(ra3[i] + \" \");\n\
  \    Console.WriteLine(\"\\n\");\n  }\n}\n```\n\n\n\n\n\n此索引器与 `FailSoftArray` 使用的类似，但有一个重要的区别。请注意索引\
  \ `a` 的表达式。它是：\n\n`index - lowerBound`\n\n该表达式将传入的 `index` 转换为适用于 `a` 的从零开始的索引。无论\
  \ `lowerBound` 是正数、负数还是零，该表达式都有效。\n\n这里展示了 `ok()` 方法：\n\n```csharp\n// 如果 index\
  \ 在范围内，则返回 true。\nprivate bool ok(int index) {\n  if(index >= lowerBound & index\
  \ <= upperBound) return true;\n  return false;\n}\n```\n\n它与 `FailSoftArray` 使用的类似，不同之处在于通过与\
  \ `lowerBound` 和 `upperBound` 中的值进行比较来检查范围。\n\n`RangeArray` 展示了通过使用索引器和属性创建的一种自定义数组类型。当然，还有其他几种。例如，你可以创建根据需要扩展和收缩的动态数组、关联数组和稀疏数组。你可能想尝试作为一个练习，创建其中一种类型的数组。\n\
  \n# 第 11 章 继承\n\n继承是面向对象编程三大基本原则之一，因为它允许创建层次分类。通过使用继承，你可以创建一个通用类，定义一组相关项共有的特征。该类随后可以被其他更具体的类继承，每个类都添加了其特有的内容。\n\
  \n在 C# 语言中，被继承的类被称为 `基类`（base class）。进行继承的类被称为 `派生类`（derived class）。因此，派生类是基类的特化版本。它继承了基类定义的所有变量、方法、属性和索引器，并添加了自己的独特元素。\n\
  \n## 继承基础\n\nC# 支持继承，允许一个类在其声明中包含另一个类。这是通过在声明派生类时指定基类来实现的。让我们从一个示例开始。以下名为 `TwoDShape`\
  \ 的类存储了二维对象（如方形、矩形、三角形等）的宽度和高度。\n\n```csharp\n// 用于二维对象的类。\nclass TwoDShape {\n\
  \  public double Width;\n  public double Height;\n  public void ShowDim() {\n  \
  \  Console.WriteLine(\"Width and height are \" +\n                      Width +\
  \ \" and \" + Height);\n  }\n}\n```\n\n`TwoDShape` 可以作为描述特定类型二维对象的类的基类（即作为起点）。例如，接接程序使用\
  \ `TwoDShape` 派生出一个名为 `Triangle` 的类。请密切注意 `Triangle` 的声明方式。\n\n```csharp\n// 一个简单的类层次结构。\n\
  using System;\n\n// 用于二维对象的类。\nclass TwoDShape {\n  public double Width;\n  public\
  \ double Height;\n  public void ShowDim() {\n    Console.WriteLine(\"Width and height\
  \ are \" +\n                      Width + \" and \" + Height);\n  }\n}\n\n// Triangle\
  \ 派生自 TwoDShape。\nclass Triangle : TwoDShape {\n  public string Style; // 三角形的样式\n\
  \  // 返回三角形的面积。\n  public double Area() {\n    return Width * Height / 2;\n  }\n\
  \  // 显示三角形的样式。\n  public void ShowStyle() {\n    Console.WriteLine(\"Triangle is\
  \ \" + Style);\n  }\n}\n\nclass Shapes {\n  static void Main() {\n    Triangle t1\
  \ = new Triangle();\n    Triangle t2 = new Triangle();\n    t1.Width = 4.0;\n  \
  \  t1.Height = 4.0;\n    t1.Style = \"isosceles\";\n    t2.Width = 8.0;\n    t2.Height\
  \ = 12.0;\n    t2.Style = \"right\";\n    Console.WriteLine(\"Info for t1: \");\n\
  \    t1.ShowStyle();\n    t1.ShowDim();\n    Console.WriteLine(\"Area is \" + t1.Area());\n\
  \    Console.WriteLine(\"Info for t2: \");\n    t2.ShowStyle();\n    t2.ShowDim();\n\
  \    Console.WriteLine(\"Area is \" + t2.Area());\n  }\n}\n```\n\n该程序的输出所示：\n```\n\
  Info for t1:\nTriangle is isosceles\nWidth and height are 4 and 4\nArea is 8\nInfo\
  \ for t2:\nTriangle is right\nWidth and height are 8 and 12\nArea is 48\n```\n\n\
  `Triangle` 类创建了一种特定类型的 `TwoDShape`，在本例中是一个三角形。`Triangle` 类包含了 `TwoDShape` 的所有内容，并添加了字段\
  \ `Style`、方法 `Area()` 和方法 `ShowStyle()`。注意 `Triangle` 继承 `TwoDShape` 时使用的语法：\n\n\
  ```csharp\nclass Triangle : TwoDShape {\n```\n\n这种语法可以泛化。每当一个类继承另一个类时，基类跟在派生类的后面，并用冒号分隔。在\
  \ C# 中，继承类的语法非常简单且易于使用。由于 `Triangle` 包含了其基类 `TwoDShape` 的所有成员，它可以在 `Area()` 内部访问\
  \ `Width` 和 `Height`。此外，在 `Main()` 内部，如果 `t1` 和 `t2` 是 `Triangle` 的一部分，它们可以直接引用\
  \ `Width` 和 `Height`。图 11-1 描绘了 `TwoDShape` 如何被纳入 `Triangle` 中。\n\n尽管 `TwoDShape`\
  \ 是 `Triangle` 的基类，但它本身也是独立的类。作为派生类的基类并不意味着该基类不能单独使用。例如，以下代码是完全有效的：\n\n```csharp\n\
  TwoDShape shape = new TwoDShape();\nshape.Width = 10;\nshape.Height = 20;\nshape.ShowDim();\n\
  ```\n\n当然，`TwoDShape` 对象无法感知任何派生它的类。\n\n![Image](img/f279-01.jpg)\n\n**图 11-1**\
  \ `Triangle` 类的概念图\n\n继承基类的类通用形式所示：\n\n```csharp\nclass derived-class-name: base-class-name\
  \ {\n// 类体\n}\n```\n\n继承的一个主要优势是，一旦你创建了一个定义一组对象公共属性的基类，就可以用它创建许多更具体的派生类。每个派生类都可以精确地定制自己的分类。例如，这里另一个派生自\
  \ `TwoDShape` 的类，它封装了矩形：\n\n```csharp\n// 用于矩形的 TwoDShape 派生类。\nclass Rectangle\
  \ : TwoDShape {\n  // 如果矩形是正方形，则返回 true。\n  public bool IsSquare() {\n    if(Width\
  \ == Height) return true;\n    return false;\n  }\n  // 返回矩形的面积。\n  public double\
  \ Area() {\n    return Width * Height;\n  }\n}\n```\n\n`Rectangle` 类包含了 `TwoDShape`，并添加了方法\
  \ `IsSquare()`（判断矩形是否为正方形）和 `Area()`（计算矩形面积）。\n\n## 成员访问与继承\n\n正如第 8 章所解释的，类的成员通常声明为私有，以防止其未经授权的使用或篡改。继承类*不会*推翻私有访问限制。因此，尽管派生类包含了其基类的所有成员，它也无法访问基类中私有的成员。例如，如下所示，如果将\
  \ `TwoDShape` 中的 `Width` 和 `Height` 设为私有，那么 `Triangle` 将无法访问它们：\n\n```csharp\n//\
  \ 私有成员是不可继承的。\n// 此示例将无法编译。\n```\n\n\n\n\n\n```csharp\nusing System;\n\n// A class\
  \ for two-dimensional objects.\nclass TwoDShape {\n  double Width; // now private\n\
  \  double Height; // now private\n  public void ShowDim() {\n    Console.WriteLine(\"\
  Width and height are \" +\n                      Width + \" and \" + Height);\n\
  \  }\n}\n\n// Triangle is derived from TwoDShape.\nclass Triangle : TwoDShape {\n\
  \  public string Style; // style of triangle\n  // Return area of triangle.\n  public\
  \ double Area() {\n    return Width * Height / 2; // Error, can't access private\
  \ member\n  }\n  // Display a triangle's style.\n  public void ShowStyle() {\n \
  \   Console.WriteLine(\"Triangle is \" + Style);\n  }\n}\n```\n\n`Triangle` 类无法编译，因为在\
  \ `Area()` 方法内部使用 `Width` 和 `Height` 是非法的。由于 `Width` 和 `Height` 现在是私有的（private），它们只能由类其他成员访问。派生类无法访问它们。\n\
  \n*记住：私有类成员对于该类仍然是私有的。它对类外部的任何代码（包括派生类）都是不可。*\n\n起初，你可能会认为派生类无法访问基类的私有成员是一项严重的限制，因为这会阻止在许多情况下使用私有成员。然而，事实并非如此；C#\
  \ 提供了多种解决方案。一种是使用 `protected` 成员，将在下一节中描述。另一种是使用公共属性（public properties）来提供对私有数据的访问。\n\
  \n正如上一章所解释，属性允许你管理对实例变量的访问。例如，你可以对它的值实施强制约束，或者将变量设为只读。通过将属性设为公共但将其底层变量声明为私有，派生类仍然可以使用属性，但不能直接访问底层变量。\n\
  \n这里是 `TwoDShape` 类的重写，它将 `Width` 和 `Height` 变为属性。在此过程中，它确保了 `Width` 和 `Height`\
  \ 的值将是正数。这允许你使用笛卡平面上任何象限的形状坐标来指定 `Width` 和 `Height`，而无需先获取它们的绝对值。\n\n使用公共属性来设置和获取私有成员。\n\
  \n```csharp\nusing System;\n\n// A class for two-dimensional objects.\nclass TwoDShape\
  \ {\n  double pri_width; // now private\n  double pri_height; // now private\n \
  \ // Properties for width and height.\n  public double Width {\n    get { return\
  \ pri_width; }\n    set { pri_width = value < 0 ? -value : value; }\n  }\n  public\
  \ double Height {\n    get { return pri_height; }\n    set { pri_height = value\
  \ < 0 ? -value : value; }\n  }\n  public void ShowDim() {\n    Console.WriteLine(\"\
  Width and height are \" +\n                      Width + \" and \" + Height);\n\
  \  }\n}\n\n// A derived class of TwoDShape for triangles.\nclass Triangle : TwoDShape\
  \ {\n  public string Style; // style of triangle\n  // Return area of triangle.\n\
  \  public double Area() {\n    return Width * Height / 2;\n  }\n  // Display a triangle's\
  \ style.\n  public void ShowStyle() {\n    Console.WriteLine(\"Triangle is \" +\
  \ Style);\n  }\n}\n\nclass Shapes2 {\n  static void Main() {\n    Triangle t1 =\
  \ new Triangle();\n    Triangle t2 = new Triangle();\n    t1.Width = 4.0;\n    t1.Height\
  \ = 4.0;\n    t1.Style = \"isosceles\";\n    t2.Width = 8.0;\n    t2.Height = 12.0;\n\
  \    t2.Style = \"right\";\n    Console.WriteLine(\"Info for t1: \");\n    t1.ShowStyle();\n\
  \    t1.ShowDim();\n    Console.WriteLine(\"Area is \" + t1.Area());\n    Console.WriteLine();\n\
  \    Console.WriteLine(\"Info for t2: \");\n    t2.ShowStyle();\n    t2.ShowDim();\n\
  \    Console.WriteLine(\"Area is \" + t2.Area());\n  }\n}\n```\n\n在这个版本中，属性 `Width`\
  \ 和 `Height` 提供了对私有成员 `pri_width` 和 `pri_height` 的访问，这些成员实际上存储了值。因此，尽管 `pri_width`\
  \ 和 `pri_height` 对于 `TwoDShape` 是私有的，但它们的值仍然可以通过相应的公共属性进行设置和获取。\n\n在引用基类和派生类时，有时会使用\
  \ `superclass`（父类）和 `subclass`（子类）术语。这些术语来自 Java 编程。Java 中的 superclass 在 C# 中称为\
  \ base class（基类）。Java 中的 subclass 在 C# 中称为 derived class（派生类）。你会听到这两组术语应用于任种语言的类，但本书将继续使用标准的\
  \ C# 术语。C++ 也使用基类/派生类的术语。\n\n### 使用 Protected 访问\n\n正如刚刚解释的，基类的私有成员对派生类是不可见的。这似乎意味着如果你想让派生类访问基类中的某些成员，该成员必须是公共的。当然，将成员设为公共也会使其对所有其他代码可用，这可能不是我们想要的。幸运的是，这种推论是不正确的，因为\
  \ C# 允许你创建 `protected` 成员。受保护成员在类层次结构内部是公共的，但在该层次结构之外是私有的。\n\n通过使用 `protected` 访问修饰符创建保护成员。当类的成员被声明为\
  \ `protected` 时，除一个重要的例外外，该成员是私有的。例外发生在保护成员被继承时。在这种情况下，基类的保护成员变成了派生类的保护成员。\n\n这是一个使用\
  \ `protected` 的简单示例：\n\n```csharp\nusing System;\n\nclass B {\n  protected int i,\
  \ j;\n  public void Set(int a, int b) {\n    i = a;\n    j = b;\n  }\n  public void\
  \ Show() {\n    Console.WriteLine(i + \" \" + j);\n  }\n}\n\nclass D : B {\n  int\
  \ k; // private\n  public void Setk(int a, int b) {\n    i = a;\n    j = b;\n  \
  \  k = i + j;\n  }\n  public void Showk() {\n    Console.WriteLine(k);\n  }\n}\n\
  \nclass ProtectedDemo {\n  static void Main() {\n    D ob = new D();\n    ob.Setk(2,\
  \ 3);\n    ob.Show();\n    ob.Showk();\n  }\n}\n```\n\n\n\n\n\n在层级结构中，基类和派生类都可以拥有自己的构造函数。这引发了一个重要的问题：由哪个构造函数负责构建派生类对象？是基类中的、派生类中的，还是两者都负责？答案是：基类的构造函数负责构建对象的基类部分，而派生类的构造函数负责构建派生类部分。这是合理的，因为基类并不知道也无法访问派生类中的任何元素。因此，它们的构造过程必须分开。之前的示例依赖于\
  \ C# 自动创建的默认构造函数，所以这不是问题。然而，在实践中，大多数类都会定义构造函数。在这里你将看到如何处理这种情况。\n\n当只有派生类定义了构造函数时，过程非常简单：直接构造派生类对象即可。对象的基类部分将使用其默认构造函数自动构造。例如，这里有一个了构造函数的\
  \ `Triangle` 修改版本。它还将将 `Style` 设置为私有，因为它现在由构造函数进行设置。\n\n```csharp\n// Add a constructor\
  \ to Triangle.\n\nusing System;\n\n// 一个用于二维对象的类。\nclass TwoDShape {\n  double pri_width;\n\
  \  double pri_height;\n\n  // 宽度和高度属性。\n  public double Width {\n      get { return\
  \ pri_width; }\n      set { pri_width = value < 0 ? -value : value; }\n  }\n  public\
  \ double Height {\n      get { return pri_height; }\n      set { pri_height = value\
  \ < 0 ? -value : value; }\n  }\n  public void ShowDim() {\n    Console.WriteLine(\"\
  Width and height are \" +\n                      Width + \" and \" + Height);\n\
  \  }\n}\n\n// 用于三角形的 TwoDShape 派生类。\nclass Triangle : TwoDShape {\n  string Style;\n\
  \  // 构造函数。\n  public Triangle(string s, double w, double h) {\n    Width = w; //\
  \ 初始化基类\n    Height = h; // 初始化基类\n    Style = s; // 初始化派生类\n  }\n  // 返回三角形面积。\n\
  \  public double Area() {\n    return Width * Height / 2;\n  }\n  // 显示三角形的样式。\n\
  \  public void ShowStyle() {\n    Console.WriteLine(\"Triangle is \" + Style);\n\
  \  }\n}\n\nclass Shapes3 {\n  static void Main() {\n    Triangle t1 = new Triangle(\"\
  isosceles\", 4.0, 4.0);\n    Triangle t2 = new Triangle(\"right\", 8.0, 12.0);\n\
  \    Console.WriteLine(\"Info for t1: \");\n    t1.ShowStyle();\n    t1.ShowDim();\n\
  \    Console.WriteLine(\"Area is \" + t1.Area());\n    Console.WriteLine();\n  \
  \  Console.WriteLine(\"Info for t2: \");\n    t2.ShowStyle();\n    t2.ShowDim();\n\
  \    Console.WriteLine(\"Area is \" + t2.Area());\n  }\n}\n```\n\n`Triangle` 的构造函数初始化了它继承的\
  \ `TwoDShape` 成员以及它自己的 `Style` 字段。\n\n### 调用基构造函数\n\n当基类和派生类都定义了构造函数时，过程变得有点复杂，因为基类和派生类的构造函数都必须执行。在这种情况下，你必须使用\
  \ C# 的另一个关键字——`base`，它有两个用途。第一个用途是调用基构造函数。第二个用途是访问被派生类成员隐藏的基类成员。这里我们将介绍它的第一个用途。\n\
  \n派生类可以使用派生类声明的扩展形式以及 `base` 关键字来调用其基类中定义的构造函数。这种扩展声明的一般形式所示所示：\n\n```csharp\nderived-constructor(parameter-list):\
  \ base(arg-list) {\n// 构造函数体\n}\n```\n\n在这里处，`arg-list` 指定了基类所需的任何参数。注意冒号的位置。要查看\
  \ `base` 如何使用，请考虑后续程序中 `TwoDShape` 的版本。它定义了一个初始化 `Width` 和 `Height` 属性的构造函数。随后，该构造函数被\
  \ `Triangle` 构造函数调用。\n\n```csharp\n// 为 TwoDShape 添加构造函数。\nusing System;\n\nclass\
  \ TwoDShape {\n  double pri_width;\n  double pri_height;\n\n  // 默认构造函数。\n  public\
  \ TwoDShape() {\n    Width = Height = 0.0;\n  }\n\n  // TwoDShape 的构造函数。\n  public\
  \ TwoDShape(double w, double h) {\n    Width = w;\n    Height = h;\n  }\n\n  //\
  \ 构造等宽等高的对象。\n  public TwoDShape(double x) {\n    Width = Height = x;\n  }\n\n \
  \ // 宽度和高度属性。\n  public double Width {\n      get { return pri_width; }\n      set\
  \ { pri_width = value < 0 ? -value : value; }\n  }\n  public double Height {\n \
  \     get { return pri_height; }\n      set { pri_height = value < 0 ? -value :\
  \ value; }\n  }\n  public void ShowDim() {\n    Console.WriteLine(\"Width and height\
  \ are \" +\n                      Width + \" and \" + Height);\n  }\n}\n\n// 用于三角形的\
  \ TwoDShape 派生类。\nclass Triangle : TwoDShape {\n  string Style;\n  /* 默认构造函数。这会自动调用\n\
  \     TwoDShape 的默认构造函数。 */\n  public Triangle() {\n    Style = \"null\";\n  }\n\
  \  // 带有三个参数的构造函数。\n  public Triangle(string s, double w, double h) : base(w, h)\
  \ {\n    Style = s;\n  }\n  // 构造等腰三角形。\n  public Triangle(double x) : base(x) {\n\
  \    Style = \"isosceles\";\n  }\n  // 返回三角形面积。\n  public double Area() {\n    return\
  \ Width * Height / 2;\n  }\n}\n```\n\n注意 `Triangle` 构造函数现在声明为：\n`Triangle(string\
  \ s, double w, double h) : base(w, h)`\n\n在这个版本中，`Triangle()` 调用 `base` 并传递参数 `w`\
  \ 和 `h`。这导致 `TwoDShape()` 构造函数被调用，从而初始化了 `Width` 和 `Height`。`Triangle` 不再自己初始化这些值；它只需要初始化唯一的\
  \ `Style`。这使得 `TwoDShape` 能够自由选择任何方式来构造其对象。此外，`TwoDShape` 可以添加现有派生类无知的功能，从而防止现有代码崩溃。\n\
  \n\n\n\n```csharp\n  // 显示三角形的样式。\n  public void ShowStyle() {\n    Console.WriteLine(\"\
  Triangle is \" + Style);\n  }\n}\n\nclass Shapes5 {\n  static void Main() {\n  \
  \  Triangle t1 = new Triangle();\n    Triangle t2 = new Triangle(\"right\", 8.0,\
  \ 12.0);\n    Triangle t3 = new Triangle(4.0);\n    t1 = t2;\n    Console.WriteLine(\"\
  Info for t1: \");\n    t1.ShowStyle();\n    t1.ShowDim();\n    Console.WriteLine(\"\
  Area is \" + t1.Area());\n    Console.WriteLine();\n    Console.WriteLine(\"Info\
  \ for t2: \");\n    t2.ShowStyle();\n    t2.ShowDim();\n    Console.WriteLine(\"\
  Area is \" + t2.Area());\n    Console.WriteLine();\n    Console.WriteLine(\"Info\
  \ for t3: \");\n    t3.ShowStyle();\n    t3.ShowDim();\n    Console.WriteLine(\"\
  Area is \" + t3.Area());\n    Console.WriteLine();\n  }\n}\n```\n\n此版本的输出如下：\n\n\
  Info for t1:\nTriangle is right\nWidth and height are 8 and 12\nArea is 48\n\nInfo\
  \ for t2:\nTriangle is right\nWidth and height are 8 and 12\nArea is 48\n\nInfo\
  \ for t3:\nTriangle is isosceles\nWidth and height are 4 and 4\nArea is 8\n\n让我们回顾一下\
  \ `base` 背后的核心概念。当派生类指定一个 `base` 子句时，它是在调用其直接基类的构造函数。因此，`base` 始终引用调用类正上方的直接基类。这在多多级层次结构中也是如此。你通过将参数指定为\
  \ `base` 的参数来向基类构造函数传递参数。如果不存在 `base` 子句，则会自动调用基类的默认构造函数。\n\n### 继承与名称隐蔽（Inheritance\
  \ and Name Hiding）\n\n派生类可以定义一个与其基类中成员名称相同的成员。当这种情况发生时，基类中的成员在派生类中被隐藏。虽然这在 C# 中技术上并不是一个错误，但编译器会发出警告信息。此警告提醒你名称正被隐藏。如果你的意图是隐藏基类成员，那么为了防止此警告，必须在派生类成员前加上\
  \ `new` 关键字。请注意，这种 `new` 的用法与其在创建对象实例时的用法是分开且不同的。\n\n以下是名称隐蔽的示例：\n\n```csharp\n\
  // 一个与继承相关的名称隐蔽示例。\nusing System;\n\nclass A {\n  public int i = 0;\n}\n\n// 创建派生类。\n\
  class B : A {\n  new int i; // 这个 i 隐藏了 A 中的 i\n  public B(int b) {\n    i = b;\
  \ // B 中的 i\n  }\n  public void Show() {\n    Console.WriteLine(\"i in derived class:\
  \ \" + i);\n  }\n}\n\nclass NameHiding {\n  static void Main() {\n    B ob = new\
  \ B(2);\n    ob.Show();\n  }\n}\n```\n\n首先，注意这一行中对 `new` 的使用：\n\n```csharp\nnew\
  \ int i; // 这个 i 隐藏了 A 中的 i\n```\n\n本质上，它告诉编译器你知道正在创建一个名为 `i` 的新变量，该变量隐藏了类 `A` 中的\
  \ `i`。如果你省略了 `new`，就会生成警告。该程序产生的输出是：\n\ni in derived class: 2\n\n由于 `B` 定义了自己的实例变量\
  \ `i`，它隐藏了 `A` 中的 `i`。因此，当对类型为 `B` 的对象调用 `Show()` 时，显示的是 `B` 定义的 `i` 值，而不是 `A` 中的。\n\
  \n### 使用 base 访问隐藏名称\n\n`base` 有第二种形式，作用类似于 `this`，区别在于它始终引用它被使用的基类。这种用法的通用形式为：`base.member`。在这里，`member`\
  \ 可以是方法也可以是实例变量。这种形式的 `base` 最适用于派生类的成员被相同名称隐藏的情况。考虑上一个示例中类的这个版本：\n\n```csharp\n\
  // 使用 base 克服隐蔽。\nusing System;\n\nclass A {\n  public int i = 0;\n}\n\n// 创建派生类。\n\
  class B : A {\n  new int i; // 这个 i 隐藏了 A 中的 i\n  public B(int a, int b) {\n   \
  \ base.i = a; // 这覆盖了 A 中的 i\n    i = b; // B 中的 i\n  }\n  public void Show() {\n\
  \    // 这显示 A 中的 i。\n    Console.WriteLine(\"i in base class: \" + base.i);\n  \
  \  // 这显示 B 中的 i。\n    Console.WriteLine(\"i in derived class: \" + i);\n  }\n}\n\
  \nclass UncoverName {\n  static void Main() {\n    B ob = new B(1, 2);\n    ob.Show();\n\
  \  }\n}\n```\n\n此程序显示如下：\n\ni in base class: 1\ni in derived class: 2\n\n尽管 `B`\
  \ 中的实例变量 `i` 隐藏了 `A` 中的 `i`，但 `base` 允许访问基类中定义的 `i`。隐藏的方法也可以通过使用 `base` 来调用。例如，在下面的代码中，类\
  \ `B` 继承自 `A`，`A` 和 `B` 都声明了名为 `Show()` 的方法。在 `B` 的 `Show()` 内部，通过 `base` 可以调用 `A`\
  \ 定义的 `Show()`。\n\n```csharp\n// 调用隐藏方法。\nusing System;\n\nclass A {\n  public int\
  \ i = 0;\n}\n\n// 创建派生类。\nclass B : A {\n  new int i; // 这个 i 隐藏了 A 中的 i\n  public\
  \ B(int a, int b) {\n    base.i = a; // 这覆盖了 A 中的 i\n    i = b; // B 中的 i\n  }\n\
  \  public void Show() {\n    // 这显示 A 中的 i。\n    Console.WriteLine(\"i in base class:\
  \ \" + base.i);\n    // 这显示 B 中的 i。\n    Console.WriteLine(\"i in derived class:\
  \ \" + i);\n  }\n}\n\nclass UncoverName {\n  static void Main() {\n    B ob = new\
  \ B(1, 2);\n    ob.Show();\n  }\n}\n```\n\n输出显示如下：\n\ni in base class: 1\ni in derived\
  \ class: 2\n\n正如你所见，`base.Show()` 调用了 `Show()`。一点：`new` 在此程序中告诉编译器正在声明一个名为 `Show()`\
  \ 的新方法。\n\n### 创建多级层次结构\n\n到为止，我们一直在使用只包含基类和一个派生类的简单层次结构。然而，你可以构建包含任意数量层次的层次结构。例如，给定类\
  \ `A`、`B` 和 `C`，`C` 继承自 `B`，`B` 继承自 `A`。在这种情况下，每个类都继承所有的成员。为了看到多级层次结构如何有用，请考虑以下程序：\n\
  \n```csharp\n// 多级层次结构。\nusing System;\n\nclass TwoDShape {\n  double pri_width;\n\
  \  double pri_height;\n  // 默认构造函数。\n  public TwoDShape() {\n    pri_width = pri_height\
  \ = 0.0;\n  }\n  // TwoDShape 的构造函数。\n  public TwoDShape(double w, double h) {\n\
  \    pri_width = w;\n    pri_height = h;\n  }\n  // Width 和 Height 的属性。\n  public\
  \ double Width {\n    get { return pri_width; }\n    set { pri_width = value < 0\
  \ ? -value : value; }\n  }\n  public double Height {\n    get { return pri_height;\
  \ }\n    set { pri_height = value < 0 ? -value : value; }\n  }\n  public void ShowDim()\
  \ {\n    Console.WriteLine(\"Width and height are \" + Width + \" and \" + Height);\n\
  \  }\n}\n\n// 用于三角形的 TwoDShape 派生类。\nclass Triangle : TwoDShape {\n  string Style;\
  \ // private\n  /* 默认构造函数。这调用了 TwoDShape 的默认构造函数。 */\n  public Triangle() {\n  \
  \  Style = \"null\";\n  }\n  // 构造函数。\n  public Triangle(string s, double w, double\
  \ h) : base(w, h) {\n    Style = s;\n  }\n}\n```\n\n\n\n\n```csharp\n// Construct\
  \ an isosceles triangle.\n\npublic Triangle(double x) : base(x) {\n  Style = \"\
  isosceles\";\n}\n\n// Return area of triangle.\npublic double Area() {\n  return\
  \ Width * Height / 2;\n}\n\n// Display a triangle's style.\npublic void ShowStyle()\
  \ {\n  Console.WriteLine(\"Triangle is \" + Style);\n}\n}\n\n// Extend Triangle.\n\
  class ColorTriangle : Triangle {\n  string color;\n  public ColorTriangle(string\
  \ c, string s,\n             double w, double h) : base(s, w, h) {\n    color =\
  \ c;\n  }\n  // Display the color.\n  public void ShowColor() {\n    Console.WriteLine(\"\
  Color is \" + color);\n  }\n}\n\nclass Shapes6 {\n  static void Main() {\n    ColorTriangle\
  \ t1 =\n      new ColorTriangle(\"Blue\", \"right\", 8.0, 12.0);\n    ColorTriangle\
  \ t2 =\n      new ColorTriangle(\"Red\", \"isosceles\", 2.0, 2.0);\n    Console.WriteLine(\"\
  Info for t1: \");\n    t1.ShowStyle();\n    t1.ShowDim();\n    t1.ShowColor();\n\
  \    Console.WriteLine(\"Area is \" + t1.Area());\n    Console.WriteLine();\n  \
  \  Console.WriteLine(\"Info for t2: \");\n    t2.ShowStyle();\n    t2.ShowDim();\n\
  \    t2.ShowColor();\n    Console.WriteLine(\"Area is \" + t2.Area());\n  }\n}\n\
  ```\n\n该程序的输出所示：\n\n```\nInfo for t1:\nTriangle is right\nWidth and height are 8\
  \ and 12\nColor is Blue\nArea is 48\nInfo for t2:\nTriangle is isosceles\nWidth\
  \ and height are 2 and 2\nColor is Red\nArea is 2\n```\n\n由于继承的存在，`ColorTriangle`\
  \ 可以利用之前定义的 `Triangle` 和 `TwoDShape` 类，仅添加其自身特定应用所需要的额外信息即可。这就是继承的价值之一；它允许代码的重用。\n\
  \n此示例说明了另一个重要点：`base` 总是引用最近的基类类中的构造函数。`ColorTriangle` 中的 `base` 调用了 `Triangle`\
  \ 中的构造函数。`Triangle` 中的 `base` 调用了 `TwoDShape` 中的构造函数。在类层次结构中，如果基类构造函数需要参数，则所有派生类必须将这些参数“向上传递”。无论派生类本身是否需要自己的参数，这一点都是成立的。\n\
  \n### 构造函数何时被调用？\n\n在上述关于继承和类层次结构的讨论中，你可能产生了一个重要的问题：当创建一个派生类对象时，首先执行谁的构造函数？是派生类中的，还是基类定义的？例如，给定一个名为\
  \ `B` 的派生类和一个名为 `A` 的基类，是 `A` 的构造函数在 `B` 之前调用，还是反之？答案是，在类层次结构中，构造函数按照派生顺序从基类到派生类调用。此外，无论是否使用\
  \ `base`，顺序都是相同的。如果不使用 `base`，将执行每个基类的默认（无参数）构造函数。下面的程序说明了构造函数的执行顺序：\n\n```csharp\n\
  // 演示构造函数何时被调用。\n\nusing System;\n\n// 创建一个基类。\nclass A {\n  public A() {\n    Console.WriteLine(\"\
  Constructing A.\");\n  }\n}\n// 创建一个派自 A 的类。\nclass B : A {\n  public B() {\n  \
  \  Console.WriteLine(\"Constructing B.\");\n  }\n}\n// 创建一个派自 B 的类。\nclass C : B\
  \ {\n  public C() {\n    Console.WriteLine(\"Constructing C.\");\n  }\n}\nclass\
  \ OrderOfConstruction {\n  static void Main() {\n    C c = new C();\n  }\n}\n```\n\
  \n该程序的输出为：\n\n```\nConstructing A.\nConstructing B.\nConstructing C.\n```\n\n如你所示，构造函数按派生顺序调用。如果你仔细考虑，构造函数按照派生顺序执行是有意义的。因为基类并不知道任何派生类，它需要执行的初始化与派生类执行的任何操作是分开的，并且可能是前提条件。因此，它必须执行。\n\
  \n### 基类引用与派生对象\n\n如你所知，C# 是一种强类型语言。除了适用于值类型的标准转换和自动提升外，类型兼容性是严格强制的。因此，一个类型的引用变量通常不能指向另一个类的对象。例如，考虑以下程序，它声明了两个在组成上完全相同的类：\n\
  \n```csharp\n// 此程序将无法编译。\nclass X {\n  int a;\n  public X(int i) { a = i; }\n}\n\
  class Y {\n  int a;\n  public Y(int i) { a = i; }\n}\nclass IncompatibleRef {\n\
  \  static void Main() {\n    X x = new X(10);\n    X x2;\n    Y y = new Y(5);\n\
  \    x2 = x; // OK，类型均相同\n    x2 = y; // 错误，类型不相同\n  }\n}\n```\n\n在这里，即使类 `X` 和类\
  \ `Y` 在物理上是相同的，也不无法将类型 `Y` 的引用赋值给类型 `X` 的变量，因为它们具有不同的类型。因此，这行代码是错误的，会导致类型不匹配：\n\n\
  `x2 = y; // 错误，类型不相同`\n\n通常情况下，对象引用只能引用其类型。然而，对于 C# 的严格强制有一个重要的例外。基类的引用变量可以被赋值源自该基类的任何派生类的引用。这是合法的，因为派生类型的实例封装了基类型的实例。因此，基类引用可以引用它。这里有一个示例：\n\
  \n```csharp\n// 基类引用可以引用派生类对象。\nusing System;\nclass X {\n  public int a;\n  public\
  \ X(int i) { a = i; }\n}\nclass Y : X {\n  public int b;\n  public Y(int i, int\
  \ j) : base(j) { b = i; }\n}\nclass BaseRef {\n  static void Main() {\n    X x =\
  \ new X(10);\n    X x2;\n    Y y = new Y(5, 6);\n    x2 = x; // OK，类型均相同\n    Console.WriteLine(\"\
  x2.a: \" + x2.a);\n    x2 = y; // OK，因为 Y 派自 X\n    x2.a = 19; // OK\n    x2.b =\
  \ 27; // 错误，X 没有 b\n  }\n}\n```\n\n理解这一点很重要：引用变量的类型（而不是它所引用对象的类型）决定了可以访问哪些成员。也就是说，将派生类的引用赋值给基类变量时，你只能访问由基类定义的对象的部分。这就是为什么即使\
  \ `x2` 指向一个 `Y` 对象，它无法访问 `b`。尽管先前的讨论可能看起来有些深奥，但它确实有一些实际应用。其中一个在此处描述，另一个将在本章稍后介绍虚方法时讨论。\n\
  \n\n\n\n\n```csharp\n // 构建具有相等宽度和高度的对象。\n  public TwoDShape(double x) {\n    Width\
  \ = Height = x;\n  }\n\n  // 构造 TwoDShape 对象的拷贝。\n  public TwoDShape(TwoDShape ob)\
  \ {\n    Width = ob.Width;\n    Height = ob.Height;\n  }\n\n  // Width 和 Height\
  \ 的属性。\n  public double Width {\n    get { return pri_width; }\n    set { pri_width\
  \ = value < 0 ? -value : value; }\n  }\n\n  public double Height {\n    get { return\
  \ pri_height; }\n    set { pri_height = value < 0 ? -value : value; }\n  }\n\n \
  \ public void ShowDim() {\n    Console.WriteLine(\"Width and height are \" +\n \
  \                     Width + \" and \" + Height);\n  }\n}\n\n// Triangle 是 TwoDShape\
  \ 的生类。\nclass Triangle : TwoDShape {\n  string Style;\n  // 默认构造函数。\n  public Triangle()\
  \ {\n    Style = \"null\";\n  }\n  // Triangle 的构造函数。\n  public Triangle(string\
  \ s, double w, double h) : base(w, h) {\n    Style = s;\n  }\n  // 构建等腰三角形。\n  public\
  \ Triangle(double x) : base(x) {\n    Style = \"isosceles\";\n  }\n  // 构造 Triangle\
  \ 对象的拷贝。\n  public Triangle(Triangle ob) : base(ob) {\n    Style = ob.Style;\n \
  \ }\n  // 返回三角形面积。\n  public double Area() {\n    return Width * Height / 2;\n \
  \ }\n  // 显示三角形的样式。\n  public void ShowStyle() {\n    Console.WriteLine(\"Triangle\
  \ is \" + Style);\n  }\n}\n\nclass Shapes7 {\n  static void Main() {\n    Triangle\
  \ t1 = new Triangle(\"right\", 8.0, 12.0);\n    //  t1 的拷贝。\n    Triangle t2 = new\
  \ Triangle(t1);\n    Console.WriteLine(\"Info for t1: \");\n    t1.ShowStyle();\n\
  \    t1.ShowDim();\n    Console.WriteLine(\"Area is \" + t1.Area());\n    Console.WriteLine();\n\
  \    Console.WriteLine(\"Info for t2: \");\n    t2.ShowStyle();\n    t2.ShowDim();\n\
  \    Console.WriteLine(\"Area is \" + t2.Area());\n  }\n}\n```\n\n在这个程序中，`t2` 是从\
  \ `t1` 构造而来的，并且是完全相同的。输出所示：\n\n```\nInfo for t1:\nTriangle is right\nWidth and height\
  \ are 8 and 12\nArea is 48\nInfo for t2:\nTriangle is right\nWidth and height are\
  \ 8 and 12\nArea is 48\n```\n\n请特别注意这个 `Triangle` 构造函数：\n```csharp\npublic Triangle(Triangle\
  \ ob) : base(ob) {\n  Style = ob.Style;\n}\n```\n它接收一个 `Triangle` 类型的对象，并将该对象（通过\
  \ `base`）传递给这个 `TwoDShape` 构造函数：\n```csharp\npublic TwoDShape(TwoDShape ob) {\n\
  \  Width = ob.Width;\n  Height = ob.Height;\n}\n```\n关键点是 `TwoDShape()` 期望的是一个 `TwoDShape`\
  \ 对象。然而，`Triangle()` 传递的是一个 `Triangle` 对象。正如所解释的，这之所以可行是因为基类引用可以指向派生类。因此，向 `TwoDShape()`\
  \ 传递指向派自 `TwoDShape` 的类的对象的引用是完全可以的。因为 `TwoDShape()` 构造函数只初始化派生类中属于 `TwoDShape`\
  \ 成员的部分，因此该对象可能包含派生类添加的其他成员并不重要。\n\n### 虚方法与重写\n\n`virtual` 方法（虚方法）是在基类中被声明为 `virtual`\
  \ 的方法。虚方法的定义特征是它可以在一个或多个派生类中重新定义。因此，每个派生类都可以拥有它自己的虚方法版本。虚方法的有趣之处在于当通过基类引用调用时会发生什么。在这种情况下，C#\
  \ 根据引用所指向对象的类型来决定调用哪个版本的方法——并且这种确定是在运行时完成的。因此，当引用不同的对象时，会执行不同版本的虚方法。换句话说，是所引用的对象的类型（而不是引用的类型）决定了将执行哪个版本的虚方法。因此，如果基类包含一个虚方法，并且类派自该基类，那么当通过基类引用指向不同类型的对象时，就可以执行不同版本的虚方法。\n\
  \n你在基类内部通过在方法声明前加上关键字 `virtual` 来将方法声明为虚方法。当虚方法被派生类重新定义时，会使用 `override` 修饰符。因此，在派生类内部重新定义虚方法的过程就是方法重写。在重写方法时，重写方法的名称、返回类型和签名必须与被重写的虚方法相同。此外，虚方法不能指定为\
  \ `static` 或 `abstract`（本章稍后会讨论）。\n\n方法重写构成了 C# 最强大概念之一的基础：动态方法分发（dynamic method\
  \ dispatch）。动态方法分发是在运行时而非编译时解析对被重写方法进行调用的机制。动态方法分发非常重要，因为这是 C# 实现运行时多态的方式。\n\n这是一个说明虚方法和重写的示例：\n\
  \n```csharp\n// 虚方法。\nusing System;\nclass Base {\n  // 在基类中创建虚方法。\n  public virtual\
  \ void Who() {\n    Console.WriteLine(\"Who() in Base\");\n  }\n}\n\nclass Derived1\
  \ : Base {\n  // 在派生类中重写 Who。\n  public override void Who() {\n    Console.WriteLine(\"\
  Who() in Derived1\");\n  }\n}\n\nclass Derived2 : Base {\n  // 在另一个派生类中重写 Who。\n\
  \  public override void Who() {\n    Console.WriteLine(\"Who() in Derived2\");\n\
  \  }\n}\n\nclass OverrideDemo {\n  static void Main() {\n    Base baseOb = new Base();\n\
  \    Derived1 dOb1 = new Derived1();\n    Derived2 dOb2 = new Derived2();\n    Base\
  \ baseRef; // 基类引用\n    baseRef = baseOb;\n    baseRef.Who();\n    baseRef = dOb1;\n\
  \    baseRef.Who();\n    baseRef = dOb2;\n    baseRef.Who();\n  }\n}\n```\n\n该程序的输出所示：\n\
  \n```\nWho() in Base\nWho() in Derived1\nWho() in Derived2\n```\n\n如果派生类没有提供其虚方法的版本，则将使用基类中的版本。例如：\n\
  \n```csharp\nusing System;\nclass Base {\n  // 在基类中创建虚方法。\n  public virtual void\
  \ Who() {\n    Console.WriteLine(\"Who() in Base\");\n  }\n}\n\nclass Derived1 :\
  \ Base {\n  // 在派生类中重写 Who。\n  public override void Who() {\n    Console.WriteLine(\"\
  Who() in Derived1\");\n  }\n}\n\nclass Derived2 : Base {\n  // 该类没有重写 Who。\n}\n\n\
  class NoOverrideDemo {\n  static void Main() {\n    Base baseOb = new Base();\n\
  \    Derived1 dOb1 = new Derived1();\n    Derived2 dOb2 = new Derived2();\n    Base\
  \ baseRef; // 基类引用\n    baseRef = baseOb;\n    baseRef.Who();\n    baseRef = dOb1;\n\
  \    baseRef.Who();\n    baseRef = dOb2;\n    baseRef.Who(); // 调用 Base 的 Who()\n\
  \  }\n}\n```\n\n该程序的输出为：\n\n```\nWho() in Base\nWho() in Derived1\nWho() in Base\n\
  ```\n\n\n\n\n\n在多级层次结构的情况中，如果派生类没有重写虚方法，那么在向上移动层次结构时，遇到的第一个方法重写将是执行的。例如：\n\n```csharp\n\
  /* 在多级层次结构中，在向上移动层次结构时找到第一个\n   虚方法的重写是将被执行的。 */\nusing System;\n\nclass Base {\n\
  \  // 在基类中创建虚方法。\n  public virtual void Who() {\n    Console.WriteLine(\"Who() in\
  \ Base\");\n  }\n}\n\nclass Derived1 : Base {\n  // 在派生类中重写 Who()。\n  public override\
  \ void Who() {\n    Console.WriteLine(\"Who() in Derived1)\");\n  }\n}\n\nclass\
  \ Derived2 : Derived1 {\n  // 此类也没有重写 Who()。\n}\n\nclass Derived3 : Derived2 {\n\
  \  // 此类没有重写 Who()。\n}\n\nclass NoOverrideDemo2 {\n  static void Main() {\n    Derived3\
  \ dOb = new Derived3();\n    Base baseRef; // 基类引用\n    baseRef = dOb;\n    baseRef.Who();\
  \ // 调用 Derived1 的 Who()\n  }\n}\n```\n\n输出所示：\n\nWho() in Derived1\n\n在这里，`Derived3`\
  \ 继承自 `Derived2`，继承自 `Derived1`，后者继承自 `Base`。正如输出验证的，由于 `Derived3` 或 `Derived2`\
  \ 都没有重写 `Who()`，因此执行的是 `Derived1` 中 `Who()` 的重写，因为它是找到的 `Who()` 版本。\n\n另一点：属性也可以通过\
  \ `virtual` 关键字进行修改并使用 `override` 进行重写。索引器也是如此。\n\n### 为什么要重写方法？\n重写方法允许 C# 支持运行时多态。多态对于面向对象编程至关重要，原因在于：它允许通用类指定所有派生类都通用的方法，同时允许派生类定义这些方法中部分或所有方法的特定实现。重写方法是\
  \ C# 实现多态中“一个接口，多个方法”方面的另一种方式。\n\n成功应用多态的关键之一是理解基类和派生类形成了一个从低特化化到高特化化的层次结构。如果使用当，基类提供了派生类可以直接使用的所有元素。通过虚方法，它还定义了派生类可以自己实现的方法。这为派生类提供了灵活性，同时仍然强制了统一的接口。因此，通过将继承与重写方法相结合，基类可以定义所有派生类都使用的方法的通用形式。\n\
  \n### 应用虚方法\n为了更好地理解虚方法的威力，我们将它们应用于 `TwoDShape` 类。在之前的示例中，每个派生自 `TwoDShape` 的类都定义了一个名为\
  \ `Area()` 的方法。这表明将 `Area()` 为 `TwoDShape` 类的虚方法更好，允许每个派生类重写它，从而为类封装的形状类型定义计算面积的方法。以下程序实现了这一点。为了方便起见，它还为\
  \ `TwoDShape` 添加了 `name` 属性（这使得演示类更容易）。\n\n```csharp\n// 使用虚方法和多态。\nusing System;\n\
  \nclass TwoDShape {\n  double pri_width;\n  double pri_height;\n  // 默认构造函数。\n \
  \ public TwoDShape() {\n    Width = Height = 0.0;\n    name = \"null\";\n  }\n \
  \ // 参数化构造函数。\n  public TwoDShape(double w, double h, string n) {\n    Width = w;\n\
  \    Height = h;\n    name = n;\n  }\n  // 构造等宽等高的对象。\n  public TwoDShape(double\
  \ x, string n) {\n    Width = Height = x;\n    name = n;\n  }\n  // 构造 TwoDShape\
  \ 对象的拷贝。\n  public TwoDShape(TwoDShape ob) {\n    Width = obj.Width;\n    Height\
  \ = obj.Height;\n    name = obj.name;\n  }\n  // 宽度和高度的属性。\n  public double Width\
  \ {\n    get { return pri_width; }\n    set { pri_width = value < 0 ? -value : value;\
  \ }\n  }\n  public double Height {\n    get { return pri_height; }\n    set { pri_height\
  \ = value < 0 ? -value : value; }\n  }\n  public string name { get; set; }\n  public\
  \ void ShowDim() {\n    Console.WriteLine(\"Width and height are \" + Width + \"\
  \ and \" + Height);\n  }\n  public virtual double Area() {\n    Console.WriteLine(\"\
  Area() must be overridden\");\n    return 0.0;\n  }\n}\n// 用于三角形的 TwoDShape 派生类。\n\
  class Triangle : TwoDShape {\n  string Style;\n  // 默认构造函数。\n  public Triangle()\
  \ {\n    Style = \"null\";\n  }\n  // Triangle 的构造函数。\n  public Triangle(string\
  \ s, double w, double h) : base(w, h, \"triangle\") {\n    Style = s;\n  }\n  //\
  \ 构造等腰三角形。\n  public Triangle(double x) : base(x, \"triangle\") {\n    Style = \"\
  isosceles\";\n  }\n  // 构造 Triangle 对象的拷贝。\n  public Triangle(Triangle ob) : base(ob)\
  \ {\n    Style = ob.Style;\n  }\n  // 为 Triangle 重写 Area()。\n  public override double\
  \ Area() {\n    return Width * Height / 2;\n  }\n  // 显示三角形的样式。\n  public void ShowStyle()\
  \ {\n    Console.WriteLine(\"Triangle is \" + Style);\n  }\n}\n```\n\n\n\n\n有时你可能想要创建一个基类，它仅定义一个供所有派生类共享的通用形式，而将细节留给每个派生类去填充。此类类确定了派生类必须实现的方法的性质，但它本身并不提供其中一个或多个方法的实现。这种情况发生的一种方式是：基类无法为某个方法创建有意义的实现。在在前一个示例中使用的\
  \ `TwoDShape` 版本就是如此。`Area()` 的定义仅仅是一个占位符。它不会计算并显示任何类型对象的面积。\n\n在你创建自己的类库时，你会发现，一个方法在其基类的语文中没有有意义的定义，这并不罕见。你可以通过两种方式来处理这种情况。一种方法（如上一个示例所示）是简单地让它报告警告消息。虽然这种方法在某些情况下（例如调试）可能很有用，但它通常并不合适。你可能拥有某些必须由派生类重写的方法，以便使派生类具有任何意义。考虑\
  \ `Triangle` 类。如果未定义 `Area()`，则它是不完整的。在这种情况下，你需要某种方法来确保派生类确实重写了所有必要的方法。C# 解决这个方法的方案是*抽象方法*（abstract\
  \ method）。\n\n### 抽象方法\n\n抽象方法通过指定 `abstract` 类型修饰符创建。抽象方法不包含方法体，因此它不由基类实现。因此，派生类必须重写它——它不能简单地使用基类中定义的版本。正如你可能猜到的，抽象方法自动是虚的（virtual），因此没有需要使用\
  \ `virtual` 修饰符的时候。事实上，同时使用 `virtual` 和 `abstract` 是一个错误。\n\n要声明抽象方法，请使用此通用形式：\n\
  \n```csharp\nabstract type name(parameter-list*);\n```\n\n如你所见，这里没有方法体。`abstract`\
  \ 修饰符只能用于实例方法。它不能应用于 `static` 方法。属性和索引器也可以是抽象的。\n\n包含一个或多个抽象方法的类也必须声明为抽象类，方法是在其\
  \ `class` 声明之前加上 `abstract` 标识符。由于抽象类没有定义完整的实现，因此不能有抽象类的对象。因此，尝试使用 `new` 创建抽象类的对象将导致编译错误。\n\
  \n当派生类继承抽象类时，它必须实现基类中的所有抽象方法。如果不是，则派生类也必须被指定为 `abstract`。因此，`abstract` 属性会一直继承，直到实现完整的实现为止。\n\
  \n使用抽象类，你可以改进 `TwoDShape` 类。由于未定义的二维图形没有面积的意义概念，上述程序的后续版本在 `TwoDShape` 内部将 `Area()`\
  \ 声明为 `abstract`，并将 `TwoDShape` 声明为 `abstract`。这意味着所有派生自 `TwoDShape` 的类都重写 `Area()`。\n\
  \n```csharp\n// 创建一个抽象类。\n\nusing System;\n\nabstract class TwoDShape {\n  double\
  \ pri_width;\n  double pri_height;\n\n  // 默认构造函数。\n  public TwoDShape() {\n   \
  \ Width = Height = 0.0;\n    name = \"null\";\n  }\n\n  // 参数构造函数。\n  public TwoDShape(double\
  \ w, double h, string n) {\n    Width = w;\n    Height = h;\n    name = n;\n  }\n\
  \n  // 构建具有等宽等高的对象。\n  public TwoDShape(double x, string n) {\n    Width = Height\
  \ = x;\n    name = n;\n  }\n\n  // 构建一个 TwoDShape 对象的拷贝。\n  public TwoDShape(TwoDShape\
  \ ob) {\n    Width = ob.Width;\n    Height = ob.Height;\n    name = ob.name;\n \
  \ }\n\n  // Width 和 Height 的属性。\n  public double Width {\n    get { return pri_width;\
  \ }\n    set { pri_width = value < 0 ? -value : value; }\n  }\n  public double Height\
  \ {\n    get { return pri_height; }\n    set { pri_height = value < 0 ? -value :\
  \ value; }\n  }\n  public string name { get; set; }\n  public void ShowDim() {\n\
  \    Console.WriteLine(\"Width and height are \" + Width + \" \" + Height);\n  }\n\
  \  // 现在，Area() 是抽象的。\n  public abstract double Area();\n}\n\n// 针对三角形的 TwoDShape\
  \ 派生类。\nclass Triangle : TwoDShape {\n  string Style;\n  // 默认构造函数。\n  public Triangle()\
  \ {\n    Style = \"null\";\n  }\n  // Triangle 的构造函数。\n  public Triangle(string\
  \ s, double w, double h) : base(w, h, \"triangle\") {\n    Style = s;\n  }\n  //\
  \ 构建等腰三角形。\n  public Triangle(double x) : base(x, \"triangle\") {\n    Style = \"\
  isosceles\";\n  }\n  // 构建一个 Triangle 对象的拷贝。\n  public Triangle(Triangle ob) : base(ob)\
  \ {\n    Style = ob.Style;\n  }\n  // 为 Triangle 重写 Area()。\n  public override double\
  \ Area() {\n    return Width * Height / 2;\n  }\n  // 显示三角形的样式。\n  public void ShowStyle()\
  \ {\n    Console.WriteLine(\"Triangle is \" + Style);\n  }\n}\n\n// 针对矩形的 TwoDShape\
  \ 派生类。\nclass Rectangle : TwoDShape {\n  string Style;\n  // 默认构造函数。\n  public Rectangle()\
  \ {\n    Style = \"null\";\n  }\n  // Rectangle 的构造函数。\n  public Rectangle(string\
  \ s, double w, double h) : base(w, h, \"rectangle\") {\n    Style = s;\n  }\n  //\
  \ 构建正方形。\n  public Rectangle(double x) : base(x, \"rectangle\") {\n    Style = \"\
  square\";\n  }\n  // 构建一个 Rectangle 对象的拷贝。\n  public Rectangle(Rectangle ob) : base(ob)\
  \ {\n    Style = ob.Style;\n  }\n  // 为 Rectangle 重写 Area()。\n  public override\
  \ double Area() {\n    return Width * Height;\n  }\n  // 显示矩形的样式。\n  public void\
  \ ShowStyle() {\n    Console.WriteLine(\"Rectangle is \" + Style);\n  }\n}\n\nclass\
  \ AbsShape {\n  static void Main() {\n    TwoDShape[] shapes = new TwoDShape[4];\n\
  \    shapes[0] = new Triangle(\"right\", 8.0, 12.0);\n    shapes[1] = new Rectangle(10);\n\
  \    shapes[2] = new Rectangle(10, 4);\n    shapes[3] = new Triangle(7.0);\n   \
  \ for(int i=0; i < shapes.Length; i++) {\n      Console.WriteLine(\"object is \"\
  \ + shapes[i].name);\n      Console.WriteLine(\"Area is \" + shapes[i].Area());\n\
  \      Console.WriteLine();\n    }\n  }\n}\n```\n\n正如程序所示，所有派生类*必须*重写 `Area()`（或者也声明为\
  \ `abstract`）。为了向自己证明这一点，请尝试创建一个没有重写 `Area()` 的派生类。你会收到一个编译错误。\n\n另外一点：注意 `TwoDShape`\
  \ 仍然包含了 `ShowDim()` 方法，并且它没有被 `abstract` 修改。抽象类包含具体方法是完全允许的——而且非常常见，派生类可以自由地使用这些方法。只有声明为\
  \ `abstract` 的方法才必须由派生类重写。\n\n#### **使用 sealed 防止继承**\n\n尽管继承既强大又有用，但有时你可能想要阻止它。例如，你可能有一个类封装了某些特殊硬件设备的初始化序列，例如医疗监视器。在这种情况下，你不希望使用该类的用户能够更改监视器的方式，以免错误设置设备。无论原因如何，在\
  \ C# 中，使用 `sealed` 关键字可以轻松防止一个类被继承。\n\n要防止一个类被继承，请在其声明之前加上 `sealed`。正如你预期的那样，将一个类同时声明为\
  \ `abstract` 和 `sealed` 是非法的，因为抽象类本身是不完整的，它依赖于它的派生类来提供完整的实现。\n\n这是一个 **sealed**\
  \ 类的示例：\n\n\n\n\n\n```csharp\nsealed class A {\n  // ...\n}\n\n// 以下类是非合法的。\nclass\
  \ B : A { // 错误！不能继承类 A\n  // ...\n}\n```\n\n正如注释所示，让 `B` 继承 `A` 是非法的，因为 `A` 被声明为\
  \ `sealed`（密封）。\n\n另一点：`sealed` 也可以用于虚方法以防止进一步的重写。例如，假设有一个基类叫 `B`，派生类叫 `D`。在 `B`\
  \ 中声明为 `virtual` 的方法可以被 `D` 声明为 `sealed`。这将防止任何继承 `D` 的类重写该方法。以下示例说明了这种情况：\n\n```csharp\n\
  class B {\n  public virtual void MyMethod() { /* ... */ }\n}\n\nclass D : B {\n\
  \  // 这密封了 MyMethod() 并防止进一步的重写。\n  sealed public override void MyMethod() { /*\
  \ ... */ }\n}\n\nclass X : D {\n  // 错误！MyMethod() 被密封了！\n  public override void\
  \ MyMethod() { /* ... */ }\n}\n```\n\n因为 `MyMethod()` 被 `D` 密封，所以它不能被 `X` 重写。\n\n\
  ### object 类\n\nC# 定义了一个名为 `object` 的特殊类，它是所有其他类的隐式基类，也适用于所有其他类型（包括值类型）。句话说，所有其他类型都派生自\
  \ `object`。这意味着类型为 `object` 的引用变量可以指向任何其他类型的对象。此外，由于数组被实现为对象，`object` 类型的变量也可以指向任何数组。从技术上讲，C#\
  \ 中的名称 `object` 只是 `System.Object` 的另一个名称，它是 .NET Framework 类库的一部分。\n\n`object`\
  \ 类定义了表 11-1 所示的方法，这意味着这些方法在每个对象中都是可用的。\n\n这些方法中的一些需要额外的解释。默认情况下，`Equals(object)`\
  \ 方法判断调用对象是否与参数所指的对象是同一个对象。（也就是说，它判断两个引用是否相同）。如果对象相同，则返回 `true`，否则返回 `false`。你可以在自己创建的类中重写此方法。这样做允许你定义相对于某个类的等效性。例如，你可以定义\
  \ `Equals(object)`，使其通过比较两个对象的内容来判断是否相等。\n\n`GetHashCode()` 方法返回一个与调用对象相关的哈希值。任何使用哈希作为访问存储对象手段的算法都需要哈希值。需要注意的是，`GetHashCode()`\
  \ 的默认实现对于所有用途可能是不够的。\n\n正如第 9 章中提到的，如果你重载了 `==` 运算符，那么你通常需要重写 `Equals(object)` 和\
  \ `GetHashCode()`，因为在大多数情况下，你希望 `==` 运算符和 `Equals(object)` 方法的功能相同。当重写了 `Equals()`\
  \ 时，你通常也需要重写 `GetHashCode()`，以确保这两个方法保持兼容。\n\n`ToString()` 方法返回一个包含被调用对象描述信息的的字符串。此外，当使用\
  \ `WriteLine()` 输出对象时，该方法会被自动调用。许多类都重写了此方法。这样做允许它们为所创建的特定类型对象定制描述。例如：\n\n![Image](img/t0314-01.jpg)\n\
  \n**表 11-1** `object` 类的方法\n\n```csharp\n// Demonstrate ToString()\nusing System;\n\
  \nclass MyClass {\n  static int count = 0;\n  int id;\n  public MyClass() {\n  \
  \  id = count;\n    count++;\n  }\n  public override string ToString() {\n    return\
  \ \"MyClass object#\" + id;\n  }\n}\n\nclass Test {\n  static void Main() {\n  \
  \  MyClass ob1 = new MyClass();\n    MyClass ob2 = new MyClass();\n    MyClass ob3\
  \ = new MyClass();\n    Console.WriteLine(ob1);\n    Console.WriteLine(ob2);\n \
  \   Console.WriteLine(ob3);\n  }\n}\n```\n程序的输出在此处：\nMyClass object #0\nMyClass\
  \ object #1\nMyClass object #2\n\n### 装箱与拆箱\n\n如前解释，所有的 C# 类型（包括值类型）都派生自 `object`。因此，类型为\
  \ `object` 的引用可以指向任何其他类型。当 `object` 引用指向一个值类型时，会发生被称为“装箱”（boxing）的过程。装箱会导致值类型的值被存储在对象实例中。因此，值类型被“装箱”在对象内部。该对象就可以像任何其他对象一样使用。在所有情况下，装箱都会发生。你只需要给\
  \ `object` 引用赋一个值即可，C# 会处理其余工作。\n\n“拆箱”（Unboxing）是从装箱对象中提取值的过程。此操作通过从 `object` 引用显式转换为其对应的值类型来完成。尝试将一个对象拆箱为不同的类型会导致运行时错误。这里有一个简单的示例，说明了装箱和拆箱：\n\
  \n```csharp\n// 一个简单的装箱/拆箱示例\nusing System;\n\nclass BoxingDemo {\n  static void\
  \ Main() {\n    int x;\n    object obj;\n    x = 10;\n    obj = x; // 将 x 装箱为对象\n\
  \    int y = (int)obj; // 将 obj 拆箱为 int\n    Console.WriteLine(y);\n  }\n}\n```\n\
  此程序显示值 10。注意当 `x` 赋值给 `obj` 时，发生了装箱。\n\n另一个更有趣装箱示例。在这种情况下，`int` 值被传递给 `Sqr()` 方法。\n\
  \n```csharp\n// 在传递值时发生装箱\nusing System;\n\nclass BoxingDemo {\n  static void Main()\
  \ {\n    int x;\n    x = 10;\n    Console.WriteLine(\"is x: \" + x);\n    Console.WriteLine(Sqr(x));\n\
  \  }\n  static int Sqr(object o) {\n    return (int)o * (int)o;\n  }\n}\n```\n输出在此处：\n\
  is x: 10\nis squared: 100\n\n装箱和拆箱允许 C# 类型系统完全统一。由于所有类型都派生自 `object`，任何类型的引用都可以赋值给\
  \ `object` 变量。例如，考虑以下令人惊讶的程序：\n\n```csharp\n// 装箱使得可以在值上调用方法\nusing System;\n\n\
  class MethOnValue {\n  static void Main() {\n    Console.WriteLine(10.ToString());\n\
  \  }\n}\n```\n此程序显示 10。原因是 `ToString()` 方法返回了被调用对象的描述。\n\n\n\n\n\n正如此程序所示，由于 `object`\
  \ 引用可以持有指向任何其他类型数据的引用，因此可以使用 `object` 引用来引用任何类型的数据。因此，程序中所使用的 `object` 数组可以存储任何类型的数据。扩展这一概念，可以很容易看到你如何构建一个类，例如存储\
  \ `object` 引用的栈（stack）类。这将使得栈能够存储任何类型的数据。\n\n尽管 `object` 的通用类型功能非常强大，并在某些情况下可以非常有效地使用，但如果认为应该使用\
  \ `object` 来规避 C# 有的强类型检查，那是错误的。通常，当你需要存储一个 `int` 时，请使用 `int` 变量；当你需要存储一个 `string`\
  \ 时，请使用 `string` 引用；此类推。\n\n更重要的是，从 2.0 版本开始，C# 程序员可以使用真正的泛型（generic types）。（泛型在第\
  \ 18 章;\n  ret-type method-name2(param-list);\n  // ...\n  ret-type method-nameN(param-list);\n\
  }\n```\n\n接口的名称由 `name.` 指定。方法仅使用其返回类型和签名声明。它们本质上是抽象方法。正如所解释，在接口中，没有方法可以有实现。因此，每个包含接口的类必须实现所有方法。在接口中，方法是隐式的\
  \ `public`，且不允许使用显式的访问修饰符。\n\n这是一个接口的示例。它指定了一个生成系列数字的类的接口。\n\n```csharp\npublic\
  \ interface ISeries {\n  int GetNext(); // 返回序列中的下一个数字\n  void Reset(); // 重启\n\
  \  void SetStart(int x); // 设置起始值\n}\n```\n\n此接口的名称是 `ISeries`。虽然前缀 `I` 必须，但许多程序员会在接口前加上\
  \ `I` 以将其与类区分开。`ISeries` 被声明为 `public`，以便程序中的任何类都能实现它。\n\n除了方法之外，接口还可以指定属性、索引器和事件。事件在第\
  \ 15 章中进行了描述，我们在这里只关注方法、属性和索引器。接口不能拥有数据成员。它们不能定义构造函数、析构函数或运算符方法。此外，没有成员可以声明为 `static`。\n\
  \n### 实现接口\n\n一旦定义了接口，一个或多个类就可以实现该接口。要实现接口，在类名之后指定接口名称，这与指定基类的方式完全相同。实现接口的类的通用形式所示：\n\
  \n```java\nclass class-name: interface-name {\n  // 类体\n}\n```\n\n正在实现的接口名称是 `interface-name`。当一个类实现一个接口时，它必须实现整个接口。它不能挑选实现哪些部分，例如，一个类可以实现多个接口。一个类可以继承基类，也可以实现多个接口。在这种情况下，基类的名称必须位于逗号分隔列表之前。实现接口的方法必须声明为\
  \ `public`。这是因为接口内部的方法是隐式公共，所以它们的返回类型和签名必须与接口匹配。这是一个名为 `Byos` 的类，它生成一组比上一个数字大的序列。\n\
  \n```csharp\nclass Byos : ISeries {\n  int start;\n  int val;\n  public Byos() {\n\
  \    start = 0;\n    val = 0;\n  }\n  public int GetNext() {\n    val += 2;\n  \
  \  return val;\n  }\n  public void Reset() {\n    val = start;\n  }\n  public void\
  \ SetStart(int x) {\n    start = x;\n    val = start;\n  }\n}\n```\n\n你可以看到，`Byos`\
  \ 实现 `ISeries` 定义的所有方法。正如所解释的，这是必要的，因为类无法创建接口的部分实现。这是一个演示 `ISeries` 接口的类：\n\n```csharp\n\
  using System;\n\nclass SeriesDemo {\n  static void Main() {\n    Byos ob = new Byos();\n\
  \    for(int i = 0; i < 5; i++) {\n      Console.WriteLine(\"Next value is \" +\
  \ ob.GetNext());\n    }\n    Console.WriteLine(\"\\nResetting\");\n    ob.Reset();\n\
  \    for(int i = 0; i < 5; i++) {\n      Console.WriteLine(\"Next value is \" +\
  \ ob.GetNext());\n    }\n    Console.WriteLine(\"\\nStarting at 100\");\n    ob.SetStart(100);\n\
  \    for(int i = 0; i < 5; i++) {\n      Console.WriteLine(\"Next value is \" +\
  \ ob.GetNext());\n    }\n  }\n}\n```\n\n\n\n\n要编译 `SeriesDemo`，你必须在编译时包含包含 `ISeries`、`ByTwos`\
  \ 和 `SeriesDemo` 的文件。编译器会自动编译这三个文件以创建最终的可执行文件。例如，如果你将这些文件命名为 `ISeries.cs`、`ByTwos.cs`\
  \ 和 `SeriesDemo.cs`，那么可以使用以下命令行编译该程序：\n\n```bash\ncsc SeriesDemo.cs ISeries.cs ByTwos.cs\n\
  ```\n\n如果你正在使用 Visual Studio IDE，只需将所有三个文件添加到你的 C# 项目中。另一点：将这三个类放在同一个文件中也是完全有效的。\n\
  \n该程序的输出显示所示：\n\n```\nNext value is 2\nNext value is 4\nNext value is 6\nNext value\
  \ is 8\nNext value is 10\nResetting\nNext value is 2\nNext value is 4\nNext value\
  \ is 6\nNext value is 8\nNext value is 10\nStarting at 100\nNext value is 102\n\
  Next value is 104\nNext value is 106\nNext value is 108\nNext value is 110\n```\n\
  \n实现接口的类定义它们自己的额外成员是被允许的也是常见的。例如，以下 `ByTwos` 的版本增加了 `GetPrevious()` 方法，该方法返回上一个值：\n\
  \n```csharp\n// 实现 ISeries 并添加 GetPrevious()\nclass ByTwos: ISeries {\n  int start;\n\
  \  int val;\n  int prev;\n  public ByTwos() {\n    start = 0;\n    val = 0;\n  \
  \  prev = -2;\n  }\n  public int GetNext() {\n    prev = val;\n    val += 2;\n \
  \   return val;\n  }\n  public void Reset() {\n    val = start;\n    prev = start\
  \ - 2;\n  }\n  public void SetStart(int x) {\n    start = x;\n    val = start;\n\
  \    prev = val - 2;\n  }\n  // Ieries 未指定的方法。\n  public int GetPrevious() {\n \
  \   return prev;\n  }\n}\n```\n\n注意到，添加 `GetPrevious()` 需要对 `ISeries` 定义的方法的实现进行更改。然而，由于这些方法的接口保持不变，这种更改是无缝的，不会破坏现有的代码。这是接口的优势之一。\n\
  \n正如所解释的，任意数量的类都可以实现一个接口。例如，这里有一个名为 `Primes` 的类生成质数序列。注意它对 `ISeries` 的实现与 `ByTwos`\
  \ 提供的本质不同。\n\n```csharp\n// 使用 ISeries 实现质数序列。\nclass Primes: ISeries {\n  int start;\n\
  \  int val;\n  public Primes() {\n    start = 2;\n    val = 2;\n  }\n  public int\
  \ GetNext() {\n    int i, j;\n    bool isprime;\n    val++;\n    for(i = val; i\
  \ < 1000000; i++) {\n      isprime = true;\n      for(j = 2; j <= i/j; j++) {\n\
  \        if((i%j)==0) {\n          isprime = false;\n          break;\n        }\n\
  \      }\n      if(isprime) {\n        val = i;\n        break;\n      }\n    }\n\
  \    return val;\n  }\n  public void Reset() {\n    val = start;\n  }\n  public\
  \ void SetStart(int x) {\n    start = x;\n    val = start;\n  }\n}\n```\n\n关键在于，尽管\
  \ `ByTwos` 和 `Primes` 生成无关的数字序列，但它们都实现了 `ISeries`。正如所解释的，接口对实现不做任何规定，因此每个类都可以自由地按照自己的方式实现接口。\n\
  \n### 使用接口引用\n\n你可能会惊讶地发现，你可以声明一个接口类型的引用变量。换句话说，你可以创建一个接口引用。这样的变量可以引用任何实现了其接口的对象。当你从接口引用上调用方法时，执行的是该对象实现的方法版本。这个过程类似于使用基类引用来访问派生类，如第\
  \ 1 节所述。\n\n下面的示例说明了接口引用的用法。它使用同一个接口变量来调用 `ByTwos` 和 `Primes` 对象的方法。为了清晰起见，它显示了程序的所有部分，并将它们组合成一个文件。\n\
  \n```csharp\n// 演示接口引用。\nusing System;\n// 定义接口。\npublic interface ISeries {\n \
  \ int GetNext(); // 返回序列中的下一个数\n  void Reset(); // 重置\n  void SetStart(int x); //\
  \ 设置起始值\n}\n// 使用 ISeries 实现每个值都比前一个值大 2 的序列。\nclass ByTwos: ISeries {\n  int start;\n\
  \  int val;\n  public ByTwos() {\n    start = 0;\n    val = 0;\n  }\n  public int\
  \ GetNext() {\n    val += 2;\n    return val;\n  }\n  public void Reset() {\n  \
  \  val = start;\n  }\n  public void SetStart(int x) {\n    start = x;\n    val =\
  \ start;\n  }\n}\n\n// 使用 ISeries 实现质数序列。\nclass Primes: ISeries {\n  int start;\n\
  \  int val;\n  public Primes() {\n    start = 2;\n    val = 2;\n  }\n  public int\
  \ GetNext() {\n    int i, j;\n    bool isprime;\n    val++;\n    for(i = val; i\
  \ < 1000000; i++) {\n      isprime = true;\n      for(j = 2; j <= i/j; j++) {\n\
  \        if((i%j)==0) {\n          isprime = false;\n          break;\n        }\n\
  \      }\n      if(isprime) {\n        val = i;\n        break;\n      }\n    }\n\
  \    return val;\n  }\n  public void Reset() {\n    val = start;\n  }\n  public\
  \ void SetStart(int x) {\n    start = x;\n    val = start;\n  }\n}\n\nclass SeriesDemo\
  \ {\n  static void Main() {\n    ISeries ob;\n    ByTwos twoOb = new ByTwos();\n\
  \    ISeries primeOb = new Primes();\n\n    for (int i = 0; i < 5; i++) {\n    \
  \  ob = twoOb;\n      Console.WriteLine(\"Next value is \" + ob.GetNext());\n  \
  \  }\n\n    Console.WriteLine(\"Resetting\");\n    ob.Reset();\n\n    for (int i\
  \ = 0; i < 5; i++) {\n      ob = twoOb;\n      Console.WriteLine(\"Next value is\
  \ \" + ob.GetNext());\n    }\n\n    Console.WriteLine(\"Starting at 100\");\n  \
  \  ob = primeOb;\n    ob.SetStart(100);\n    for (int i = 0; i < 5; i++) {\n   \
  \   Console.WriteLine(\"Next value is \" + ob.GetNext());\n    }\n  }\n}\n```\n\n\
  \n\n\n```csharp\n// 展示一个接口属性。\n\nclass SeriesDemo3 {\n  static void Main() {\n \
  \   ByTwos ob = new ByTwos();\n    // 通过属性访问序列。\n    for(int i=0; i < 5; i++)\n\
  \      Console.WriteLine(\"Next value is \" + ob.Next);\n    Console.WriteLine(\"\
  \\nStarting at 21\");\n    ob.Next = 21;\n    for(int i=0; i < 5; i++)\n      Console.WriteLine(\"\
  Next value is \" + ob.Next);\n  }\n}\n```\n\n该程序的输出所示：\n```\nNext value is 2\nNext\
  \ value is 4\nNext value is 6\nNext value is 8\nNext value is 10\nStarting at 21\n\
  Next value is 23\nNext value is 25\nNext value is 27\nNext value is 29\nNext value\
  \ is 31\n```\n\n### 接口索引器\n\n接口可以指定一个索引器。在接口中声明的简单一维索引器具有如下通用形式：\n\n```csharp\n\
  // 接口索引器\nelement-type this[int index] {\n  get;\n  set;\n}\n```\n\n与之前一样，只读或只写索引器分别只存在\
  \ `get` 或 `set`。此外，在 `interface` 中声明索引器时，访问器上不允许使用访问修饰符。\n\n这里是 `ISeries` 的另一个版本，它添加了一个只读索引器，用于返回序列中的第\
  \ $i$ 个元素。\n\n```csharp\n// 在接口中添加索引器。\nusing System;\npublic interface ISeries\
  \ {\n  // 接口属性。\n  int Next {\n    get; // 返回序列中的下一个数字\n    set; // 设置下一个数字\n  }\n\
  \  // 接口索引器。\n  int this[int index] {\n    get; // 返回序列中的指定数字\n  }\n}\n\n// 实现 ISeries。\n\
  class ByTwos: ISeries {\n  int val;\n  public ByTwos() {\n    val = 0;\n  }\n  //\
  \ 使用属性获取或设置值。\n  public int Next {\n    get {\n      val += 2;\n      return val;\n\
  \    }\n    set {\n      val = value;\n    }\n  }\n  // 使用索引获取值。\n  public int this[int\
  \ index] {\n    get {\n      val = 0;\n      for(int i=0; i < index; i++)\n    \
  \    val += 2;\n      return val;\n    }\n  }\n}\n\n// 展示一个接口索引器。\nclass SeriesDemo4\
  \ {\n  static void Main() {\n    ByTwos ob = new ByTwos();\n    // 通过属性访问序列。\n \
  \   for(int i=0; i < 5; i++)\n      Console.WriteLine(\"Next value is \" + ob.Next);\n\
  \    Console.WriteLine(\"\\nStarting at 21\");\n    ob.Next = 21;\n    for(int i=0;\
  \ i < 5; i++)\n      Console.WriteLine(\"Next value is \" + ob.Next);\n    Console.WriteLine(\"\
  \\nResetting to 0\");\n    ob.Next = 0;\n    // 通过索引器访问序列。\n    for(int i=0; i <\
  \ 5; i++)\n      Console.WriteLine(\"Next value is \" + ob[i]);\n  }\n}\n```\n\n\
  该程序的输出为：\n```\nNext value is 2\nNext value is 4\nNext value is 6\nNext value is\
  \ 8\nNext value is 10\nStarting at 21\nNext value is 23\nNext value is 25\nNext\
  \ value is 27\nNext value is 29\nNext value is 31\nResetting to 0\nNext value is\
  \ 0\nNext value is 4\nNext value is 6\nNext value is 8\n```\n\n### 接口可以被继承\n\n一个接口可以继承另一个接口。语法与类相同。当类实现一个继承另一个接口的接口时，它必须为接口链中的所有成员提供实现。这里是一个示例：\n\
  \n```csharp\n// 一个接口可以继承另一个接口。\nusing System;\npublic interface IA {\n  void Meth1();\n\
  \  void Meth2();\n}\n// IB 现在包含了 Meth1() 和 Meth2() -- 它增加了 Meth3()。\npublic interface\
  \ IB : IA {\n  void Meth3();\n}\n\n// 此类必须实现 IA 和 IB 的所有成员。\nclass MyClass : IB\
  \ {\n  public void Meth1() {\n    Console.WriteLine(\"Meth1().\");\n  }\n  public\
  \ void Meth2() {\n    Console.WriteLine(\"Meth2().\");\n  }\n  public void Meth3()\
  \ {\n    Console.WriteLine(\"Meth3().\");\n  }\n}\n\nclass IFExtend {\n  static\
  \ void Main() {\n    MyClass ob = new MyClass();\n    ob.Meth1();\n    ob.Meth2();\n\
  \    ob.Meth3();\n  }\n}\n```\n\n作为一个实验，你可以尝试移除 `MyClass` 中对 `Meth1()` 的实现。这将导致编译时错误。如之前所述，任何实现接口的类必须实现该接口定义的所有方法，包括从其他接口继承的任何方法。\n\
  \n### 接口继承中的名称隐藏\n\n当一个接口继承另一个接口时，可能在派生接口中声明一个成员，从而隐藏基接口中定义的成员。\n\n### 显式实现\n\n\
  当一个类实现多个具有相同方法签名的接口时，可以通过**显式实现**来消除歧义。显式实现方法名称前加上接口名称（例如 `接口名.方法名`）。这种方法在类中是私有的，必须通过接口引用来调用。\n\
  \n例如：\n\n```csharp\n// 显式实现接口成员。\nusing System;\ninterface IEven {\n  bool IsOdd(int\
  \ x);\n  bool IsEven(int x);\n}\nclass MyClass : IEven {\n  // 显式实现。注意此成员默认是私有的。\n\
  \  bool IEven.IsOdd(int x) {\n    if((x%2) != 0) return true;\n    else return false;\n\
  \  }\n  // 普通实现。\n  public bool IsEven(int x) {\n    IEven o = this; // 对象的接口引用\n\
  \    return !o.IsOdd(x);\n  }\n}\n\nclass Demo {\n  static void Main() {\n    MyClass\
  \ ob = new MyClass();\n    bool result;\n    result = ob.IsEven(4);\n    if(result)\
  \ Console.WriteLine(\"4 is even.\");\n    // result = ob.IsOdd(4); // 错误，IsOdd 未暴露。\n\
  \    // 但是，这是可以的。它创建了 MyClass 对象的 IEven 引用\n    // 然后通过该引用调用 IsOdd()。\n    IEven\
  \ iRef = (IEven)ob;\n    result = iRef.IsOdd(3);\n    if(result) Console.WriteLine(\"\
  3 is odd.\");\n  }\n}\n```\n\n\n\n\n\n```sharp\n    return x + x;\n\n  }\n\n  int\
  \ IMyIF_B.Meth(int x) {\n    return x * x;\n  }\n\n  // 通过接口引用调用 Meth()。\n  public\
  \ int MethA(int x){\n    IMyIF_A a_ob;\n    a_ob = this;\n    return a_ob.Meth(x);\
  \ // 调用 IMyIF_A\n  }\n\n  public int MethB(int x){\n    IMyIF_B b_ob;\n    b_ob\
  \ = this;\n    return b_ob.Meth(x); // 调用 IMyIF_B\n  }\n}\n\nclass FQIFNames {\n\
  \n  static void Main() {\n    MyClass ob = new MyClass();\n    Console.Write(\"\
  Calling IMyIF_A.Meth(): \");\n    Console.WriteLine(ob.MethA(3));\n    Console.Write(\"\
  Calling IMyIF_B.Meth(): \");\n    Console.WriteLine(ob.MethB(3));\n  }\n}\n```\n\
  \n该程序的输出输出所示：\n\nCalling IMyIF_A.Meth(): 6\n\nCalling IMyIF_B.Meth(): 9\n\n观察该程序，首先注意到\
  \ `Meth()` 在 `IMyIF_A` 和 `IMyIF_B` 中具有相同的签名。因此，当 `MyClass` 实现这两个接口时，它显式地分别实现了每一个接口，并在此过程中完全限定了其方法的全名。由于调用显式实现方法的唯一方法是通过接口引用，因此\
  \ `MyClass` 在 `MethA()` 和 `MethB()` 内部创建了两个这样的引用，一个用于 `IMyIF_A`，另一个用于 `IMyIF_B`。然后它调用这些方法，这些方法再次调用接口方法，从而消除了歧义。\n\
  \n### 在接口和抽象类之间进行选择\n\nC# 编程中具挑战性的部分之一是在想要描述功能而非实现时，知道何时该创建接口，何时该使用抽象类。通用规则是：当你能够根据“它做了什么”来完全描述该概念，而不需要指定“它是如何做的”时，你就应该使用接口。如果你需要包含某些实现细节，那么你就需要用抽象类来表示你的概念。\n\
  \n### .NET 标准接口\n\n.NET Framework 定义了大量 C# 程序可以使用的接口。例如，`System.IComparable` 定义了\
  \ `CompareTo()` 方法，它允许在需要排序关系时对对象进行比较。接口还是集合类（Collections classes）的重要部分，集合类为对象组提供了各种类型的存储（如栈和队列）。例如，`System.Collections.ICollection`\
  \ 定义了集合的功能。`System.Collections.IEnumerator` 提供了一种遍历集合中元素的方法。这些以及许多其他接口在第二部分 中有所描述。\n\
  \n### 结构体 (Structures)\n\n如你所知，类是引用类型。这意味着类对象是通过引用访问的。这与直接访问的值类型（value types）不同。然而，有时能够像值类型那样直接访问对象是非常有用的。其原因之一是效率考虑。通过引用访问类对象会给每次访问增加开销。它还会消耗空间。对于非常小的对象，这段额外的空间可能是显著的。为了解决这些问题，C#\
  \ 提供了结构体（structure）。一个*结构体*类似于类，但它是值类型，而不是引用类型。\n\n结构体使用 `struct` 关键字声明，在语法上与类相似。下面是\
  \ `struct` 的通用形式：\n\n```struct\nstruct name: interfaces {\n\n// 成员声明\n\n}\n```\n\
  \n结构体的名称由 `name` 指定。\n\n结构体不能继承其他结构体或类，也不能作为其他结构体或类的基类。（然而，所有结构体都隐式继承 `System.ValueType`，而它继承自\
  \ `object`。）但是，结构体可以实现一个或多个接口。这些接口在结构体名称之后使用逗号分隔的列表指定。与类一样，结构体成员包括方法、字段、索引器、属性、运算符方法和事件。结构体也可以定义构造函数，但不能定义析构函数。然而，你不能为结构体定义默认（无参数）构造函数。这是因为所有结构体自动定义默认构造函数，且这个默认构造函数是更改的。默认构造函数将结构体的字段初始化为默认值。由于结构体不支持继承，因此结构体成员不能指定为\
  \ `abstract`、`virtual` 或 `protected`。\n\n可以使用像类一样使用 `new` 创建结构体对象，但这不是强制的。当使用 `new`\
  \ 时，会调用指定的构造函数。当不使用 `new` 时，对象仍然会被创建，但没有被初始化。因此，你需要手动执行任何初始化。这里有一个使用结构体存储有关书籍信息的示例：\n\
  \n```csharp\n// 演示结构体。\nusing System;\n\n// 定义一个结构体。\nstruct Book {\n  public string\
  \ Author;\n  public string Title;\n  public int Copyright;\n  public Book(string\
  \ a, string t, int c) {\n    Author = a;\n    Title = t;\n    Copyright = c;\n \
  \ }\n}\n\n// 演示 Book 结构体。\nclass Struct {\n  static void Main() {\n    Book book1\
  \ = new Book(\"Herb Schildt\", \"C# 4.0: The Complete Reference\", 2010); // 显式构造函数\n\
  \    Book book2 = new Book(); // 默认构造函数\n    Book book3; // 无构造函数\n  }\n}\n```\n\
  *(注：原文示例中 `new Book()` 在 C# 中如果定义了显式构造函数将无法获得默认构造函数，此处保留原文逻辑翻译)*\n\n*修正：根据原文代码逻辑\
  \ `Book book2 = new Book();` 假设在上下文中允许或为示例意图。*\n\n(重新翻译原文代码块注释以保持一致)\n\n```csharp\n\
  // 演示结构体。\nusing System;\n\n// 定义一个结构体。\nstruct Book {\n  public string Author;\n\
  \  public string Title;\n  public int Copyright;\n  public Book(string a, string\
  \ t, int c) {\n    Author = a;\n    Title = t;\n    Copyright = c;\n  }\n}\n\n//\
  \ 演示 Book 结构体。\nclass Struct {\n  static void Main() {\n    Book book1 = new Book(\"\
  Herb Schildt\", \"C# 4.0: The Complete Reference\", 2010); // 显式构造函数\n    Book book2\
  \ = new Book(); // 默认构造函数\n    Book book3; // 无构造函数\n  }\n}\n```\n*(由于用户提供的原始文本在\
  \ `Main` 方法结束处似乎截断了，以下将基于已提供的文本片段进行翻译)*\n\n*(此处由于用户提供的原始文本在 `Main` 方法结束处似乎截断，以下将基于已提供的文本片段进行翻译)*\n\
  \n该程序的输出所示：\n\n[content]\n*(此处为原文未提供的完整代码逻辑推断，以下仅对用户给出的文本进行翻译)*\n\n```csharp\n//\
  \ 拷贝结构体。\nusing System;\n\n// 定义一个结构体。\nstruct MyStruct {\n  public int x;\n}\n\n\
  // 演示结构体赋值。\nclass StructAssignment {\n  static void Main() {\n    MyStruct a;\n\
  \    MyStruct b;\n    a.x = 10;\n    b.x = 20;\n    Console.WriteLine(\"a.x {0},\
  \ b.x {1}\", a.x, b.x);\n    a = b;\n    b.x = 30;\n    Console.WriteLine(\"a.x\
  \ {0}, b.x {1}\", a.x, b.x);\n  }\n}\n```\n\n输出如下所示：\n\na.x 10, b.x 20\na.x 20,\
  \ b.x 30\n\n\n\n\n\n结构变量 `a` 和 `b` 仍然是分离且不同的。也就是说，`a` 除了包含 `b` 值的拷贝之外，并不以任何方式引用或关联到\
  \ `b`。如果 `a` 和 `b` 是类引用，情况就不如此了。例如，这里是程序的 `class` 版本：\n\n```cpp\n// Use a class.\n\
  using System;\n\n// Now a class.\nclass MyClass {\n  public int x;\n}\n\n// Now\
  \ show a class object assignment.\nclass ClassAssignment {\n  static void Main()\
  \ {\n    MyClass a = new MyClass();\n    MyClass b = new MyClass();\n    a.x = 10;\n\
  \    b.x = 20;\n    Console.WriteLine(\"a.x {0}, b.x {1}\", a.x, b.x);\n    a =\
  \ b;\n    b.x = 30;\n    Console.WriteLine(\"a.x {0}, b.x {1}\", a.x, b.x);\n  }\n\
  }\n```\n\n该版本的输出所示：\n\na.x 10, b.x 20\na.x 30, b.x 30\n\n如你所见，在将 `b` 赋值给 `a` 后，两个变量都指向同一个对象——最初由\
  \ `b` 指向的那个。\n\n### 为什么使用结构体？\n\n此时你可能会疑惑为什么 C# 包含了 `struct`，因为它似乎是一个功能较弱的 `class`\
  \ 版本。答案在于效率和性能。因为结构体是值类型，它们直接被操作，而不是通过引用。因此，`struct` 不需要单独的引用变量。这意味着在某些情况下使用的内存更少。此外，由于\
  \ `struct` 是直接访问的，它不会受到访问类对象时固有的性能损失。由于类是引用类型，所有对类对象的访问都是通过引用进行的。这种间接性为每次访问增加了开销。结构体不会产生这种开销。通常，如果你只需要简单地存储一组相关数据，但不需要继承，也不需要通过引用操作这些数据，那么\
  \ `struct` 可以是一个更高效的选择。\n\n这是另一个示例，展示了如何在实践中应用结构体。它模拟了一个电子商务交易记录。每个交易都包含一个包头，其中包含包号和包的长度。接着是账号和交易金额。因为包头是一个自包含的信息单元，所以它被组织为一个结构体。该结构体可以被用于创建交易记录或其他任何类型的信息包。\n\
  \n```cpp\n// Structures are good when grouping small amounts of data.\nusing System;\n\
  \n// Define a packet structure.\nstruct PacketHeader {\n  public uint PackNum; //\
  \ packet number\n  public ushort PackLen; // length of packet\n}\n\n// Use PacketHeader\
  \ to create an e-commerce transaction record.\nclass Transaction {\n  static uint\
  \ transacNum = 0;\n  PacketHeader ph;  // incorporate PacketHeader into Transaction\n\
  \  string accountNum;\n  double amount;\n  public Transaction(string acc, double\
  \ val) {\n    // create packet header\n    ph.PackNum = transacNum++;\n    ph.PackLen\
  \ = 512;  // arbitrary length\n    accountNum = acc;\n    amount = val;\n  }\n \
  \ // Simulate a transaction.\n  public void sendTransaction() {\n    Console.WriteLine(\"\
  Packet #: \" + ph.PackNum +\n                      \", Length: \" + ph.PackLen +\n\
  \                      \", Account #: \" + accountNum +\n                      \"\
  , Amount: \" + amount);\n  }\n}\n// Demonstrate Packet.\nclass PacketDemo {\n  static\
  \ void Main() {\n    Transaction t = new Transaction(\"31243\", -100.12);\n    Transaction\
  \ t2 = new Transaction(\"AB655\", 345.25);\n    Transaction t3 = new Transaction(\"\
  8475-09\", 9800.00);\n    t.sendTransaction();\n    t2.sendTransaction();\n    t3.sendTransaction();\n\
  \  }\n}\n```\n\n程序的输出在这里：\n\nPacket #: 0, Length: 512, Account #: 31243, Amount:\
  \ -100.12\nPacket #: 1, Length: 512, Account #: AB655, Amount: 345.25\nPacket #:\
  \ 2, Length: 512, Account #: 8475-09, Amount: 9800.00\n\n`PacketHeader` 是 `struct`\
  \ 的良好选择，因为它只包含少量数据，并且没有使用继承或包含方法。作为结构体，`PacketHeader` 不产生引用的开销。因此，任何类型的交易记录都可以使用\
  \ `PacketHeader` 而不会影响其效率。\n\n有一点点在于，C++ 拥有结构体并使用 `struct` 关键字。然而，C# 和 C++ 的结构体是不相同的。在\
  \ C++ 中，`struct` 定义了一个类类型。因此，在 C++ 中，`struct` 和 `class` 几乎是等等的（区别在于它们成员的默认访问权限，`class`\
  \ 是私有的，而 `struct` 是公有的）。在 C# 中，`struct` 定义了一个值类型，而 `class` 定义了一个引用类型。\n\n### 枚举\n\
