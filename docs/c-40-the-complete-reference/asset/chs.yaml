  \ 和 `||`。在这些运算符中，只有 `&`、`|` 和 `!` 可以被重载。通过遵循某些规则，仍然可以获得 `&&` 和 `||` 的处。这里将检查每种情况。\n\
  \n### 重载运算符的简单方法\n\n让我们从简单的情况开始。如果你不使用短路运算符，那么你可以像你认为的那样重载 `&` 和 `|`，返回一个 `bool`\
  \ 结果。重载的 `!` 也会返回一个 `bool` 结果。这里有一个为 `ThreeD` 类型重载 `!`、`&` 和 `|` 逻辑运算符的示例。和一样，每个示例都假设至少有一个坐标非零，`ThreeD`\
  \ 对象即为真。如果所有坐标均为零，则对象即为假。\n\n```csharp\n// 一种重载 ThreeD 的 !, |, & 的简单方法\nusing System;\n\
  \n// 三维坐标类。\nclass ThreeD {\n  int x, y, z; // 3-D 坐标\n  public ThreeD() { x = y\
  \ = z = 0; }\n  public ThreeD(int i, int j, int k) { x = i; y = j; z = k; }\n  //\
  \ 重载 |.\n  public static bool operator |(ThreeD op1, ThreeD op2)\n  {\n    if ((op1.x\
  \ != 0) || (op1.y != 0) || (op1.z != 0)) |\n        ((op2.x != 0) || (op2.y != 0)\
  \ || (op2.z != 0)) )\n      return true;\n    else\n      return false;\n  }\n \
  \ // 重载 &.\n  public static bool operator &(ThreeD op1, ThreeD op2)\n  {\n    if(\
  \ ((op1.x != 0) && (op1.y != 0) && (op1.z != 0)) &\n        ((op2.x != 0) && (op2.y\
  \ != 0) && (op2.z != 0)) )\n      return true;\n    else\n      return false;\n\
  \  }\n  // 重载 !.\n  public static bool operator !(ThreeD op)\n  {\n    if((op.x\
  \ != 0) || (op.y != 0) || (op.z != 0))\n      return false;\n    else return true;\n\
  \  }\n  // 显示 X, Y, Z 坐标。\n  public void Show()\n  {\n    Console.WriteLine(x +\
  \ \", \" + y + \", \" + z);\n  }\n}\n\nclass LogicalOp {\n  static void Main() {\n\
