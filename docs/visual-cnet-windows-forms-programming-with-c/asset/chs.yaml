- "# Visual C#.NET：C# Windows Forms 编程\n\n\n\n![](img/rsrc7.jpg)\n\n\n\n\n# 引言\n\n\
  ## 什么是 C#\n今天的世界充斥着各种资源和用途的编程语言。C# 无疑也是如此。它是一种现代的面向对象的编程语言，由 Anders Helsberg 在 2000\
  \ 年在微软开发。C# 通常被视为一种混合体，它吸取了 C 和 C++ 的优点来创建一种现代语言；其目标是将 C++ 的计算能力与 Basic 编程的易用性相结合。\n\
  \n## 为什么创建 C-Sharp\n你可能会想，在已经存在 Java 这样具有相似用途的其它软件实体的情况下，为什么还要创建一个新语言呢？事实上，它最初是作为\
  \ Java 的竞争对手而建立的；Sun 公司（后被 Oracle 收购）不想对 Java 进行任何更改，因此微软选择创建自己的语言。总来说，C# 具有与 Java\
  \ 相似的特征。C# 自诞生以来增长得非常快，这当然无疑归功于微软的广泛支持，帮助它在今天占据了一席之地。\n\n## “C#”术语的起源是什么？\nC# 这个术语源于\
  \ `#` 符号，它表示单点递增。这也许是编程世界和音乐世界带来的富有创造力的语言！C# 在英语中通常读作“C Sharp”。\n\n## C# 的主要用途\n\
  事实上，简而言之，几乎无不利！你可以使用 C# 创建 Windows 应用程序、客户端/服务器应用程序、数据库应用程序等……它们多样的用途可以归类为：\n\n\
  ### Windows 应用程序开发\n考虑到 Windows 上的 .NET 支持，C# 现在是每位开发者构建 Windows 应用程序的首选。Windows\
  \ 的新版本（Windows 8 / Windows 10）极大地促进了这种采用，绝大多数第三方应用程序是在 Windows Store 中用 C# 编写的。虽然\
  \ Windows Store 没有获得像 App Store 和 Google Play 那样的成功和名誉，但无疑将塑造 Windows 应用程序分发的未来，因此\
  \ C# 在 Windows 上有光的前景。\n\n### 通常通过以下方式创建 Web 应用：\n- WebForms（包含在内的 .NET Web 框架的一部分）\n\
  - MVC（一种用于开发 Web 应用的架构风格）\n\n### 移动设备和智能手机\n提到智能手机，C# 正在不断增长。`Xamarin` 在这一领域领先，为所有主要的移动平台提供工具，以及许多其他关于如何使用\
  \ C# 开发手机的有用资源。微软在移动设备上支持 C# 也有悠久的历史；它最近发布了 Visual Studio 2013 的更新，支持为桌面和 Windows\
  \ 同时开发的通用应用程序。\n\n### 游戏\nC# 广泛用于使用 `Unity` 游戏引擎创建游戏，它是目前最流行的游戏引擎，世界上超过三分之一的顶级游戏由它制作，用它创建的游戏有近\
  \ 7.7 亿活跃用户。Unity 也应用于虚拟现实，90% 的三星 Gear 设备和 53% 的 Oculus VR 游戏都是用它开发的。C# 是创建这些应用程序的非常流行的工具，因此为任何希望进入游戏制作世界的程序员或任何对虚拟现实感兴趣的人提供了极佳的选择。C#\
  \ 足够灵活，可以运行 TCP/IP 服务器和树莓派。\n\n## C# 特性\n- 易于学习，但处理复杂任务！\n- C# 有许多让学习变得更容易特性。\n\
  - C# 的结构当然非常有表现力，但简单且易学习。\n- C# 的构造简化了 C++ 的许多复杂性。\n- C# 相对易读。\n- 此外，C# 处理了设备的大多数复杂细节，这样你就可以专注于编程目的而不是担心小细节。\n\
  - C# 也是一种静态编写的语言，因此代码在转换为应用程序之前会经过检查，这使得更容易发现错误，对初学者可能特别有用。\n\n# 第一章：#C 编程语言快速指南\n\
  \nC# 是一种优雅的面向对象的编程语言，具有类型安全的数据类型，允许开发者构建运行在 .NET 框架上的安全、健壮应用程序。\n\n## 数据类型 类型和变量\n\
  ### 语法\n```csharp\n// 单行注释以两个斜杠开头，如下\n/// * 多行注释放置在上方标签和下方标签之间\n/// /此 xml 注释用于生成外部文档或在\
  \ IDE 集成开发环境中提供特定上下文的帮助。\n/// <param name = \"firstParam\">记录参数函数，它是此注释的 firstParam\
  \ 参数 </param>\n/// <returns> 关于 /returns> 函数返回值的信息\n// public void MethodOrClassOrOtherWithParsableHelp\
  \ (string firstParam) {}\n```\n### 指定此代码将将使用的命名空间\n下面的命名空间都是 .NET Framework 类的一部分。\n\
  \n### 框架类库\n```csharp\nusing System;\nusing System.Collections.Generic;\nusing System.Dynamic;\n\
  using System.Linq;\nusing System.Net;\nusing System.Threading.Tasks;\nusing System.IO;\n\
  using System.Data.Entity;\n```\n此命名空间未包含在标准库中：为了使用上面的库，你需要添加 NuGet 包管理器的引用，可以执行：`Install-Package`。\n\
  \n### 命名空间\n命名空间定义字段将代码组织成包或模块。为了在另一个代码中使用下面定义的命名空间，我们添加 `Learning.CSharp` 语句。每个\
  \ `cs` 文件必须至少包含一个与文件名相同的 `class`。\n\n```csharp\nnamespace Learning.CSharp\npublic\
  \ class LearnCSharp\n{\n// 基础用语：如果你已经在 Java 或 C++ 中写过代码，可以跳过到“有趣的特性”\npublic static\
  \ void Syntax ()\n{\n// 写入一个新行，使用 Console.WriteLine\nConsole.WriteLine (\"Hello\"\
  );\n// 在同一行写入语句\nConsole.WriteLine (\"Integer:\" + 3.14 +\"Boolean:\" + true);\n\
  }\n```\n\n## 历史和配置\n### 数据结构\n类型和变量\n定义变量为 `<type> <name>`\n\n- **byte**: 整数（正或负），8\
  \ 位（-128 到 127）。`byte foo = 100;`\n- **Byte**: 仅正数数字，8 位（0 到 255）。`byte foo = 100;`\n\
  - **Short**: 16 位整数或自然数，范围 -32768 到 32767。`short foo = 10000;`\n- **ushort**: 范围\
  \ 0 到 65535。`ushort foo = 10000;`\n- **int**: 整数，32 位长度（-2147483648 到 2147483647）。`int\
  \ foo = 1;`\n- **uint**: 无符号整数，32 位长度（0 到 4294967295）。`uint foo = 1;`\n- **Long**:\
  \ 整数，64 位长度（-9223372036854775808 到 9223372036854775807）。`long foo = 100000L;`\n\
  - **ulong**: 无符号整数，64 位长度（0 到 18446744073709551615）。`ulong foo = 10000L;`\n- **Double**:\
  \ 64 位浮点精度。`double foo = 123.4;`\n- **Float**: 32 位浮点。`float foo = 23.4f;`\n- **Decimal**:\
  \ 128 位数据类型，精度高于浮点类型，适用于财务和货币账户。`decimal foo = 150.3m;`\n- **Boolean**: 真假。`bool\
  \ foo = true;`\n- **Char**: 代表 Unicode 的 16 位数据类型。`char foo = 'A';`\n- **Strings**:\
  \ 引用类型。`string foo = \"\\\"quotes and add \\n and \\t\";`\n\n### 字面字符串\n可以在字符串前面使用\
  \ `@` 符号来转义字符串中的所有字符。\n```csharp\nstring path = \"C:\\\\Users\\\\Desktop\";\nstring\
  \ verbatimPath = @\"C:\\Users\\Desktop\";\nConsole.WriteLine(path == verbatimPath);\
  \ // => true\n```\n你可以使用 `@` 符号分行分布字符串来转义“位置”。\n```csharp\nstring bazString = @\"\
  Here's some stuff\non a new line! Wow!\";\n```\n使用 `const` 关键字使变量静态且不可编辑，并在编译时计算静态值。\n\
  ```csharp\nconst int HoursWorkPerWeek = 90;\n```\n\n### 列表\n矩阵 - 第一个元素从 0 开始，在定义时必须定义矩阵大小。\n\
  ```csharp\n<datatype> [] <name> = new <datatype>[<array size>]\n```\n示例中的 `intArray`\
  \ 矩阵包含 10 个数字：\n```csharp\nint[] intArray = new int[10];\n```\n另一种定义和配置数组的方法：\n\
  ```csharp\nint[] y = {9000, 1000, 1337};\n```\n排列数组元素 - 访问一个元素：\n```csharp\nConsole.WriteLine\
  \ (\"intArray @ 0:\" + intArray[0]);\n```\n数组是可调整的。\n```csharp\nintArray[1] = 1;\n\
  ```\n列表比数组使用更多，是因为它们的灵活性，列表的定义如下：\n```csharp\nList<datatype> <name> = new List<datatype>()\n\
  List<int> list = new List<int>{9000, 1000, 1337}; // 指定初始值\n```\n列表没有初始值，在访问项目之前必须先添加值：\n\
  ```csharp\nlist.Add(1);\nConsole.WriteLine(\"list @ 0:\" + list[0]);\n```\n\n###\
  \ 因子\n运算符：\n```csharp\nint i1 = 1, i2 = 2; // 一次定义多个变量的简写\n```\n清晰计算：\n```csharp\n\
  Console.WriteLine(i1 + i2 - 7); // => 3\n```\n取模运算：\n```csharp\nConsole.WriteLine(\"\
  1 % 3\"); // => 2\n```\n比较因子：\n```csharp\nConsole.WriteLine(\"3 == 2\"); // => false\n\
  Console.WriteLine(\"3 != 2\"); // => true\nConsole.WriteLine(\"3 > 2\"); // => true\n\
  Console.WriteLine(\"3 <= 2\"); // => false\nConsole.WriteLine(\"3 >= 2\"); // =>\
  \ true\nConsole.WriteLine(\"3 < 2\"); // => false\n```\n位比较运算符：\n`~`: 取反码因子（如果位为\
  \ 0 则转为 1）\n`>>`: 右移\n`<<`: 左移\n`&`: “与”因子\n`^`: 逻辑异或因子\n`|`: 包含“或”\n\n增减：\n```csharp\n\
  int i = 0;\nConsole.WriteLine(\"\\n-> 增 / 减\");\nConsole.WriteLine(i++); // 输出 \"\
  0\", i = 1; 增后\nConsole.WriteLine(+i); // 输出 \"2\", i = 2; 增前\nConsole.WriteLine(i--);\
  \ // 输出 \"2\", i = 1; 减后\nConsole.WriteLine(--i); // 输出 \"0\", i = 0; 减前\n```\n\n\
  ### 控制结构\n```csharp\nConsole.WriteLine(\"\\n-> Control 结构\");\nint j = 10;\nif (j\
  \ == 10)\n{\n    Console.WriteLine (\"printed\");\n}\nelse if (j > 10)\n{\n    Console.WriteLine(\"\
  t\");\n}\nelse\n{\n    Console.WriteLine(\"\");\n}\n```\n三元因子\n```csharp\nint toCompare\
  \ = 17;\nstring isTrue = toCompare == 17 ? \"True\" : \"False\";\n```\n\n### For\
  \ Each\nforeach 循环用于遍历任何聚合类型（数组、列表、字典……），在 .NET 框架内实现。\n```csharp\nforeach (char\
  \ character in \"Hello World\".ToCharArray())\n{// 遍历字符串中的所有字符\n}\n```\n\n### Switch\
  \ 指令\nSwitch 适用于 byte、char 和 int 类型，也适用于 Enum 类型（下方）。\n```csharp\nint month = 3;\n\
  string monthString;\nswitch (month)\n{\ncase 1:\n    monthString = \"January\";\n\
  \    break;\ncase 2:\n    monthString = \"February\";\n    break;\ncase 3:\n   \
  \ monthString = \"March\";\n    break;\n// 在每个 case 中可以执行多个过程，但如果不加 break 指令，将进入下一个\
  \ case（如果你想这样做，需要添加 goto statement）\ncase 6:\ncase 7:\ncase 8:\n    monthString\
  \ = \"Summer time !!\";\n    break;\ndefault:\n    monthString = \"Some other month\"\
  ;\n    break;\n}\n```\n\n## 数据转换\n字符串整数\n如果转换失败会出现 `Exception`\n```csharp\nint.Parse\
  \ (\"123\"); // 获取字符串 \"123\" 的数字版本\n```\n使用 `TryParse` 函数转换类型时，转换值是类型的初始值。数字的情况下，初始值为\
  \ 0。\n```csharp\nint tryInt;\nif (int.TryParse (\"123\", out tryInt)) // 函数返回布尔值\n\
  \    Console.WriteLine (tryInt); // 123\n```\n将数字转换为字符串\n`Convert` 类包含许多方法以便转换：\n\
  ```csharp\nConvert.ToString(123);\n```\n\n## 变体\n代数数据类型\n数字 15 获取 `int` 类型的值\n```csharp\n\
  long x = (int)15;\n```\n\n## 有趣的特性\n### 关键字 “yield”\n`yield` 的使用表示该的函数具有重复属性（即函数可以与\
  \ `foreach` 循环一起使用）\n```csharp\npublic static IEnumerable<int> YieldCounter(int\
  \ limit = 10)\n{\n    for (var i = 0; i < limit; i++)\n        yield return i;\n\
  }\n```\n`yield return` 在同一个函数中使用多次\n```csharp\npublic static IEnumerable<int> ManyCounter()\n\
  {\n    yield return 0;\n    yield return 1;\n    yield return 2;\n    yield return\
  \ 3;\n}\n```\n你也可以使用“yield break”停止重复，下一个函数返回 0 到 limit 之间一半的值。\n```csharp\npublic\
  \ static IEnumerable<int> YieldCounterWithBreak(int limit = 10)\n{\n    for (var\
  \ i = 0; i < limit; i++)\n    {\n        if (i > limit / 2) yield break;\n     \
  \   yield return i;\n    }\n}\n```\n\n### 可选事务\n方法签名(3, 1, 3, \"Some\", \"Extra\"\
  , \"Strings\")\n```csharp\nMethod signatures(3, another: 3); // 直接设置参数值，超过了可选参数\n\
  ```\n\n### 浮点种类\n调用上面定义的 SetDefault 函数\n```csharp\nvar phonebook = new Dictionary\
  \ <string, string> () {{\"Sarah\", \"212 555 5555\"} // 向地址簿添加地址\n```\n```csharp\n\
  Console.WriteLine (SetDefault <string, string>(phonebook, \"Sarah\")); // No Phone\n\
  ```\n你可以选择 TKey 和 TValue，因为它们可以自动推断。\n```csharp\nConsole.WriteLine (SetDefault (phonebook,\
  \ \"Sarah\")); // 212 555 555\n```\n\n### 处理错误\n```csharp\ntry\n{\n    var fun =\
  \ Penny.CreateWithGears(6); // 将执行，因为 CreateGears 会导致异常\n}\ncatch (Exception ex)\
  \ // 捕获所有异常\n{\n    Console.WriteLine(\"It hit\", ex); // 堆栈跟踪\n}\nfinally // 在\
  \ try 或 catch 后执行\n{\n}\n```\n\n### 资源管理\n```csharp\nusing (StreamWriter writer\
  \ = new StreamWriter(\"log.txt\"))\n{\n    writer.WriteLine(\"Nothing here\");\n\
  } // 所有资源在后丢弃\n\n### 并行编程\n使用 Parallel \n```csharp\nvar words = new List<string>{\"\
  dog\", \"cat\", \"pony\"};\nParallel.ForEach(words, new ParallelOptions {DegreeOfParallelism\
  \ = 4}, word =>\n{\n    Console.WriteLine(word);\n});\n```\n运行此代码会导致每个线程在不同的时间完成。\n\
  \n### LINQ\n将数据链接到 `IQueryable<T>` 对象：`LinqToSql` 关联数据库，`LinqToXml` 关联 XML 文档。\n\
  ```csharp\nvar db = new Repository();\n```\n实现是延迟的，当处理数据库时很好。\n```csharp\nvar filter\
  \ = db.Where(b => b.HasTags); // 搜索\nvar query = filter.OrderBy(b => b.Name).Select(b\
  \ => b.Name); // 仍然运行，但只有当你传递它们时才会获得结果\n```\n```csharp\nforeach (string bike in\
  \ query)\n    Console.WriteLine(result);\n```\n\n## 委托和事件\n### 委托是到 `Increment`\
  \ 函数的引用\n为了引用函数，我们通过定义具有相同签名的委托开始，返回类型为 `int`。\n```csharp\npublic delegate int IncrementDelegate();\n\
  ```\n 事件也可以用于触发委托\n创建一个授权类型的事件\n```csharp\npublic static event IncrementDelegate\
  \ MyEvent;\nstatic void Main(string[] args)\n{\n    // 通过实例化委托来传递传递\n    IncrementDelegate\
  \ inc = new IncrementDelegate(Increment);\n    // 组合 inc 将执行 Increment 三次\n    Console.WriteLine(inc());\
  \ // => 1\n\n    // 使用委托注册事件\n    MyEvent += new IncrementDelegate(Increment);\n\
  \    MyEvent += new IncrementDelegate(Increment);\n    // 触发事件，这是事件中共享的所有授权的执行\n\
  \    Console.WriteLine(MyEvent()); // => 6\n}\n\n## 第二章：NET Framework\n\n### 关于本章\n\
  .NET Framework 是 .NET 框架。从微软最流行的框架从 2000 年底的 beta 到现在的 4.6，已经有了显著改进，使得与其工作的编程语言得到了提升。.NET\
  \ Framework 是应用程序依赖的核心实体。它提供了此类应用程序访问文件、操作数据库和其他基本任务的方法。.NET Framework 从一开始就被设计为运行在任何操作系统或可用硬件上。尽管微软只在\
  \ Windows 上支持此框架，但已有尝试通过开源 mono 项目将其迁移到 Linux。Xamarin 在不到一个月前被微软收购。足够知道框架由两个主要部分组成：通用运行时\
  \ (CLR)-框架类库被称为 FCL。\n\n### 框架的主要部分\n我们将简单介绍 .NET Framework 的两个主要部分以及 C# 编译器。\n\n\
  ### 通用执行环境\n它是运行 dotnet 语言编写程序的环境，并通过将它们与你正在工作的硬件隔离来为这些程序形成孵化器。你可以将其与 Java 虚拟机比较。CLR\
  \ 默认适用于大多数 Windows 操作系统（变体），如 Windows XP、Windows 7、Windows 8、Windows 10、Windows\
  \ Phone。\n\n### FCL 框架类库\n这个巨大的库包含数千个类，允许我们完成脑海中的任何任务。从正则表达式到网络通信，到 HTTP 等流行的网络协议，FCL\
  \ 反而由几个子库组成。一个库帮助我们开发 Windows 应用程序，另一个允许我们使用 ASP.NET 技术开发 Web 应用程序，根据你的业务需求选择你需要的。FCL\
  \ 库还包含一个名为基类库（BCL）的子库。该库包含与使用其它库创建的所有应用程序工作的的基础类，无论其类型如何。\n\n### C# 编译器\n为了实现我们用\
  \ C# 编写的程序，我们需要一个 C# 编译器。这个翻译器默认包含在框架中。翻译器将 C# 代码转换为名为微软中间语言 (MSIL) 的语言编写的代码。这是一种低级中间语言，类似于汇编语言。事实上，CLR\
  \ 将执行在 MSIL 中的指令。CLR 不需要知道编写 MSIL 的编程语言，这是允许程序员在任何支持 dotnet 的编程语言中编写的主要特性。只要有 MSIL\
  \ 兼容的解释器就没有问题。见以下插图：![](img/src.jpg)\n\n### 程序如何使用 CLR 执行\n（上方提供了详细解释）\n\n### 结论\n\
  （上方提供了详细结论）\n\n## 第三章：从 C# 开始\n\n## 第一个程序\n### 添加整数的简单程序\n```csharp\nusing System;\n\
  namespace HelloWorld\n{\n    class Program\n    {\n        static void Main(string[]\
  \ args)\n        {\n            Console.WriteLine (\"Hello World!\");\n        }\n\
  \    }\n}\n```\n\n### 添加数字的优化程序\n```csharp\nusing System;\nnamespace SumTwoNumbers\n\
  {\n    class Program\n    {\n        static void Main(string[] args)\n        {\n\
  \            int a;\n            int b;\n            int c;\n            a = 3;\n\
  \            b = 4;\n            c = a + b;\n            Console.WriteLine (\"3\
  \ plus 4 equals:\" + c.ToString());\n        }\n    }\n```\n\n## 第四章：Lambda 表达式和查询\n\
  \n### Lambda 表达式\nLambda 表达式 允许你在同一行编写代码\n```csharp\nFunc<int, int> square = (x)\
  \ => x * x; // 返回值\nConsole.WriteLine(square(3)); // 9\n```\n\n### 查询\n利用 Linq 必须添加\
  \ `System.Linq`。理解 Linq 的最佳方法是通过一个简单的应用程序示例，在 `Lesson15_01` 程序中：\n```csharp\nclass\
  \ Student\n{\n    public int Id { get; set; }\n    public string FirstName { get;\
  \ set; }\n    public string LastName { get; set; }\n    public int Mark { get; set;\
  \ }\n}\n```\n\n## 第五章：使用和处理事件\n\n### 事件与委托的关系\n委托是到 `Increment` 函数的引用，通过定义具有相同签名的委托开始，它不接受任何数据并返回一个\
  \ `int` 类型的结果。\n```csharp\npublic delegate int IncrementDelegate();\n```\n 事件也可以用于触发委托\n\
  创建一个授权类型的事件\n```csharp\npublic static event IncrementDelegate MyEvent;\n```\n\n\
  ### 匿名方法\n匿名函数是一种显著缩短代码的功能。从名字上看，这样的函数没有名字，但只有一个包含执行代码的对象。\n```csharp\nMyEvent +=\
  \ delegate (string message)\n{\n    Console.WriteLine(message);\n};\n```\n\n## 第六章：面向对象编程\n\
  \nC# 是纯面向对象编程语言。你在 C# 中看到的每一个都是对象。\n\n## 面向对象编程\n本节有点理论，但正确理解它对于使用 C# 编程至关重要。现实来说，本节是对这个重要且巨大主题的一种非常简单的方法，并不能被视为面向对象编程的参考。阅读本节后，你将获得区分类和对象的必要知识，并理解它们的关系，此外理解封装的基本原理以理解什么是什么是。听听这个故事：我们遵循所谓的人类类别，这个类别定义了每个人应该拥有的优点。例如，每个人都有名字、身高、眼睛颜色和一个与任何其他人区分的独特指纹。类定义了这些属性，对象拥有这些属性对应的一组值。例如，人类可能是快乐的，身高\
  \ 180 厘米，黑色，自己的自己的纹我们。这些这些这些属性，类定义这些属性，对象拥有这些属性。此外，类还定义了人类特定的行为或动作，例如步行、跑步和笑。通常每个人都以敏感的方式表达这些行为。我们都有不同的笑。\n\
  \n## 封装\n封装是面向对象编程的基本原理，是这个概念出现的原因之一。该原则规定我们不应该熟悉对象的内部工作机制。我们关心的是使用对象来实现所需的目的，无论细节如何。考虑以下示例：当我们开车并想增加速度时，我们只需踩踏板。我不认为有人对压力背后的机械机制感兴趣。汽车封装了速度背后的内部细节。示例中的汽车是对象。速度增加是行为方法。另一个我们在走过车站和休息室时经常看到的例子是热饮机。站在机器前，我们投入钱，然后按下特定的按钮获取我们想要的热饮。通常我们不在按下按钮时不关心内部细节。机器封装了准备过程的内部细节。如果机器被修改以改变制作热饮的方式使其更好更好喝，它永远不会影响操作机器。我们只在品尝饮料后才会注意到这种调整。\n\
  \n"
