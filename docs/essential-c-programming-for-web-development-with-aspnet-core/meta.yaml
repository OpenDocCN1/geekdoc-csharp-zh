  mdcn: "\n# 身份验证：核实用户身份\n\n身份验证是确认用户所声称身份的过程。在我们的博客应用中，我们将主要关注用户名/密码身份验证，即用户提供凭据以登录其账户。ASP.NET\
    \ Core Identity 简化了此过程的实现，提供了用户注册、登录、密码哈希和账户管理的内置机制。\n\n# 关键身份验证组件\n\n-   **注册：**\
    \ 实现一个注册表单，用户可以通过提供电子邮件地址、用户名和密码来创建新账户。确保执行强密码策略以增强安全性。\n-   **登录：** 创建一个登录表单，用户可以输入凭据以访问其现有账户。利用\
    \ ASP.NET Core Identity 的 `SignInManager` 来处理身份验证过程和管理用户会话。\n-   **注销：** 提供注销机制，允许用户安全地结束会话并清除任何身份验证令牌或\
