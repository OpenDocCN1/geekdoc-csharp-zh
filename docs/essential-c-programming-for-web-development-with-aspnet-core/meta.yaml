    \n授权与身份验证相辅相成，它根据用户身份及其被分配的角色或权限，决定用户在应用程序内允许执行哪些操作。ASP.NET Core 提供了多种实现授权的机制：\n\
    \n-   **基于角色的授权：** 使用 `[Authorize(Roles = \"...\")]` 特性，根据用户角色限制对特定控制器操作或 Razor\
