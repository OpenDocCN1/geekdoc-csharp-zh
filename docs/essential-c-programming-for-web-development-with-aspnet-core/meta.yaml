    \ 请求的路由。\n\n## 控制器：处理请求并生成响应\n\n控制器是 ASP.NET Core 3 MVC 应用程序中处理请求的核心。它们封装了处理传入请求、与模型交互以及生成适当响应的逻辑。每个控制器都是一个继承自\
    \ `Controller` 基类的 C# 类，并包含响应特定路由的操作方法。\n\n### Action 方法\n\nAction 方法是控制器中处理传入请求的公共方法。它们通常执行以下任务：\n\
