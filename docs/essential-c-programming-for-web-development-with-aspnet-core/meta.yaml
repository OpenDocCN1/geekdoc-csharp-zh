  md: '# # Chapter 6: Building APIs with ASP.NET Core 3


    # ## RESTful API Design Principles


    In today''s interconnected digital landscape, APIs (Application Programming Interfaces)
    play a crucial role in enabling communication and data exchange between disparate
    systems and services. REST (Representational State Transfer) has emerged as the
    dominant architectural style for designing web APIs, offering a set of principles
    and constraints that promote simplicity, scalability, and maintainability. In
    this section, we''ll delve into the core tenets of RESTful API design, exploring
    their essence, benefits, and practical implementation within the context of ASP.NET
    Core 3.


    # ### Understanding REST


    At its core, REST is an architectural style that leverages the underlying principles
    of the HTTP protocol to create a standardized and intuitive way for systems to
    interact over the web. It emphasizes a client-server model, where clients send
    requests to servers to access and manipulate resources, and servers respond with
    representations of those resources.


    # ### Core Principles of REST


    +   - **Client-Server Architecture:** REST enforces a clear separation between
    the client (the consumer of the API) and the server (the provider of the API).
    This separation promotes independent evolution and scalability of both components.

    - **Statelessness:** Each request from the client to the server must contain all
    the information necessary to understand and process the request. The server doesn''t
    maintain any client context between requests, simplifying implementation and enabling
    horizontal scaling.

    - **Cacheability:** Responses from the server can be explicitly or implicitly
    labeled as cacheable or non-cacheable, allowing clients to store responses locally
    and reuse them for subsequent requests, improving performance and reducing network
    traffic.'
  merge: -1
  pgno: 84
- img_proc: true
  md: "+   - **Layered System**: REST allows for the layering of system components,\
    \ where each layer interacts only with adjacent layers, promoting modularity and\
    \ encapsulation.\n- **Uniform Interface**: REST defines a set of standard HTTP\
    \ methods (GET, POST, PUT, PATCH, DELETE) to perform operations on resources,\
    \ providing a consistent and predictable interface for clients.\n- **Code on Demand\
    \ (Optional)**: Servers can optionally extend the functionality of clients by\
    \ transferring executable code, such as JavaScript, to be executed on the client-side.\n\
    \n# **REST in Practice: Key Design Considerations**\n\nWhen designing RESTful\
    \ APIs, adhering to these key considerations ensures clarity, consistency, and\
    \ ease of use:\n\n+   - **Resource-Oriented**: Design your API around resources,\
    \ which represent the key entities or data objects in your system. Use nouns to\
    \ represent resources in your URLs (e.g., `/products`, `/orders`) and HTTP methods\
    \ to perform actions on those resources.\n- **HTTP Verbs**: Leverage the standard\
    \ HTTP verbs to represent the intended action on a resource:\n    - **GET**: Retrieve\
    \ a representation of a resource.\n    - **POST**: Create a new resource.\n  \
    \  - **PUT**: Update or replace an existing resource.\n    - **PATCH**: Partially\
    \ modify an existing resource.\n    - **DELETE**: Delete a resource.\n- **Status\
    \ Codes**: Utilize appropriate HTTP status codes to indicate the outcome of a\
    \ request:\n    - **2xx (Success)**: The request was successfully processed.\n\
    \    - **4xx (Client Error)**: The request contains errors or invalid data.\n\
    \    - **5xx (Server Error)**: An error occurred on the server while processing\
    \ the request."
