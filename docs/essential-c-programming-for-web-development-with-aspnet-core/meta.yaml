    \ `DbContext` 中的相应 `DbSet` 来实现。\n\n让我们用一个创建新产品的例子来说明：\n\n```csharp\nusing (var\
    \ context = new ApplicationDbContext())\n{\n    var newProduct = new Product\n\
    \    {\n        Name = \"New Product\",\n        Price = 99.99m,\n        Description\
    \ = \"A brand new product\"\n    };\n\n    context.Products.Add(newProduct);\n\
    \    context.SaveChanges();\n}\n```\n\n在这个代码片段中，我们创建了一个新的 `Product` 对象，设置其属性，将其添加到\
    \ `Products` DbSet，然后调用 `SaveChanges()` 将更改持久化到数据库。\n\n## 读取：检索数据\n\n`Read` 操作涉及从数据库获取数据。EF\
    \ Core 提供了丰富的查询功能集，包括 LINQ 支持，以根据各种条件检索数据。\n\n让我们看看如何从数据库中检索所有产品：\n\n```csharp\n\
    using (var context = new ApplicationDbContext())\n{\n    var products = context.Products.ToList();\n\
    \n    foreach (var product in products)\n    {\n        Console.WriteLine($\"\
    {product.Name} - ${product.Price}\");\n    }\n}\n```\n\n在这个例子中，我们使用 `context.Products.ToList()`\
    \ 从数据库检索所有产品，然后遍历它们以打印其名称和价格。\n\n## 更新：修改现有数据\n\n`Update` 操作涉及修改数据库中的现有记录。在 EF\
    \ Core 中，您通常检索要更新的实体，修改其属性，然后调用 `SaveChanges()` 来持久化更改。\n\n让我们更新特定产品的价格：\n\n```csharp\n\
    using (var context = new ApplicationDbContext())\n{\n    var productToUpdate =\
    \ context.Products.Find(1); // 检索 Id = 1 的产品\n\n    if (productToUpdate != null)\n\
    \    {\n        productToUpdate.Price = 129.99m;\n        context.SaveChanges();\n\
    \    }\n}\n```\n\n在这段代码中，我们使用 `context.Products.Find(1)` 检索 ID 为 1 的产品。如果找到该产品，我们更新其价格并调用\
    \ `SaveChanges()` 将更改保存到数据库。\n\n## 删除：移除记录\n\n`Delete` 操作涉及从数据库中移除记录。在 EF Core\
    \ 中，您通常检索要删除的实体，然后在相应的 `DbSet` 上调用 `Remove()` 方法，接着调用 `SaveChanges()` 来持久化删除操作。\n\
    \n让我们删除一个特定的产品：\n\n```csharp\nusing (var context = new ApplicationDbContext())\n\
    {\n    var productToDelete = context.Products.Find(1); // 检索 Id = 1 的产品\n\n  \
    \  if (productToDelete != null)\n    {\n        context.Products.Remove(productToDelete);\n\
    \        context.SaveChanges();\n    }\n}\n```\n\n在这段代码中，我们检索 ID 为 1 的产品，如果找到，则从\
    \ `Products` `DbSet` 中移除它，并调用 `SaveChanges()` 从数据库中删除它。\n\n## CRUD 操作的最佳实践\n\n\
    - **验证用户输入：** 在执行 CRUD 操作之前，始终验证用户输入，以确保数据完整性并防止潜在的安全漏洞。\n- **处理并发：** 实施适当的并发管理策略，以避免多个用户或进程同时尝试修改相同数据时发生冲突。\n\
    - **使用事务：** 对于涉及多个数据库更改的操作，考虑使用事务以确保数据一致性和原子性。\n- **优化查询：** 编写高效的查询，仅检索必要的数据并利用索引以提高性能。\n\
    - **优雅地处理异常：** 预期并处理潜在的数据库异常，向用户提供信息丰富的反馈。\n\n在本节中，我们探讨了 Entity Framework Core\
    \ 上下文中的基本 CRUD 操作（创建、读取、更新、删除）。我们学习了如何在您的 ASP.NET Core 3 应用程序中无缝执行这些操作，确保数据完整性、安全性和平滑的用户体验。掌握了这些知识，您现在就可以构建动态的、数据驱动的\
    \ Web 应用程序，使用户能够与存储在数据库中的信息进行交互和管理。\n\n## 数据验证与安全\n\n在 Web 应用程序领域，数据验证和安全至关重要。用户输入虽然是交互所必需的，但如果处理不当，也可能成为漏洞的来源。恶意行为者可以利用未经验证的输入来注入有害代码、破坏敏感数据或破坏应用程序的功能。在本节中，我们将深入探讨\
    \ ASP.NET Core 3 和 Entity Framework Core 上下文中数据验证和安全的关键方面，为您提供构建稳健且有弹性的应用程序所需的知识和工具，以抵御潜在的威胁。\n\
    \n**数据验证：确保数据完整性**\n\n数据验证是确保用户输入符合预期格式、范围或其他约束的过程。它是第一道防线，防止无效或恶意数据进入您的系统。ASP.NET\
    \ Core 3 提供了一套全面的工具和技术，用于在客户端和服务器端实施数据验证。\n\n**客户端验证**\n\n客户端验证利用 HTML5 属性和 JavaScript，在用户与表单交互时提供即时反馈。它有助于及早发现错误，改善用户体验并减少到服务器的往返次数。\n\
    \n- **HTML5 属性：** HTML5 引入了几个内置的验证属性，如 `required`、`minlength`、`maxlength`、`pattern`\
    \ 和 `type`，可在 HTML 标记中直接进行基本验证。\n- **JavaScript 验证库：** 对于更复杂的验证场景，您可以使用 JavaScript\
    \ 验证库（如 jQuery Validate 或 Validate.js）来执行自定义验证逻辑并提供丰富的错误消息。\n\n## 服务器端验证\n\n虽然客户端验证对用户体验很有价值，但始终执行服务器端验证也至关重要。恶意用户可以绕过客户端检查，因此服务器端验证是应用程序的最终保障。\n\
    \n- **模型验证：** ASP.NET Core 3 将模型验证与 MVC 无缝集成，允许您使用模型属性上的数据注解属性定义验证规则。这些属性（如 `Required`、`StringLength`、`Range`\
    \ 和 `RegularExpression`）会在数据提交到控制器时自动触发验证检查。\n- **自定义验证：** 对于更复杂的验证场景，您可以创建自定义验证属性或直接在控制器操作方法中实现验证逻辑。\n\
    \n## 安全最佳实践\n\n除了数据验证，遵守安全最佳实践对于保护您的应用程序及其用户也至关重要。让我们强调几个关键原则：\n\n- **输入清理：**\
    \ 始终清理用户输入，以防止跨站脚本（XSS）攻击，即恶意脚本被注入到您的应用程序中。在将潜在有害字符（如 `<`、`>` 和 `&`）渲染到输出之前，对其进行编码或转义。\n\
    - **参数化查询：** 与数据库交互时，使用参数化查询或存储过程来防止 SQL 注入攻击，即恶意 SQL 代码被注入到您的查询中。\n"
