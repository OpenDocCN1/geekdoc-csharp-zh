    To access elements, you use their index, just like with arrays:


    ```

    string first_name = names[0]; // Accesses the first element ("Alice")

    ```


    Lists also offer a variety of other methods for manipulating and working with
    their elements, such as `Insert()`, `Remove()`, `Contains()`, and `Count`.


    # Other Collections


    C# provides a wide array of other collection types, each designed for specific
    purposes:


    +   - `Dictionary<TKey, TValue>`: Stores key-value pairs, allowing you to efficiently
    retrieve values based on their associated keys.

    - `HashSet<T>`: Stores a collection of unique elements, ensuring that no duplicates
    exist.

    - `Queue<T>`: Implements a first-in, first-out (FIFO) collection, useful for scenarios
    like task scheduling.

    - `Stack<T>`: Implements a last-in, first-out (LIFO) collection, often used for
    parsing expressions or implementing undo/redo functionality.


    # Choosing the Right Collection


    Selecting the appropriate collection type depends on your specific requirements:


    +   - If you need a fixed-size collection of elements of the same type, an array
    might be suitable.

    - If you need a dynamic collection that can grow or shrink, a list is a good choice.

    - If you need to efficiently retrieve values based on keys, a dictionary is ideal.'
