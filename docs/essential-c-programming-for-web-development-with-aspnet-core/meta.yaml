- md: "## Chapter 4: Building Your First Web Application\n\nProject Setup and Configuration\n\
    \nEmbarking on the journey of building your first web application with ASP.NET\
    \ Core 3 is an exciting endeavor. In this section, we'll guide you through the\
    \ essential steps of project setup and configuration, ensuring you have a solid\
    \ foundation to start crafting your web masterpiece. We'll explore the tools,\
    \ templates, and settings that empower you to create a functional and well-structured\
    \ ASP.NET Core 3 project, setting the stage for your exploration of web development\
    \ concepts and techniques.\n\n### Creating a New ASP.NET Core 3 Project\n\nThe\
    \ first step in building your web application is to create a new project using\
    \ the .NET CLI (Command-Line Interface) or your preferred development environment,\
    \ such as Visual Studio. Let's outline the process using the .NET CLI:\n\n1. Open\
    \ your terminal or command prompt.\n2. Navigate to the directory where you want\
    \ to create your project.\n3. Execute the following command:\n\n```\nBash\ndotnet\
    \ new webapp -o MyFirstWebApplication\n```\n\nThis command creates a new ASP.NET\
    \ Core 3 web application project named \"MyFirstWebApplication\" using the default\
    \ \"webapp\" template. The `-o` option specifies the output directory for the\
    \ project.\n\n### Exploring the Project Structure\n\nOnce the project is created,\
    \ let's take a moment to explore its structure. Navigate to the \"MyFirstWebApplication\"\
    \ directory and examine its contents. You'll find familiar folders like Controllers,\
    \ Models, and Views, along with essential files such as `Program.cs` and `Startup.cs`.\
    \ We'll delve into the details of these components in subsequent sections.\n\n\
    ### Configuring the Startup Class\n\nThe `Startup` class plays a crucial role\
    \ in configuring your ASP.NET Core 3 application. It contains two key methods:\
    \ `ConfigureServices` and `Configure`.\n\n- `ConfigureServices`: This method is\
    \ responsible for registering services with the application's dependency injection\
    \ container. Services are components that provide specific functionalities, such\
    \ as database access, logging, or authentication.\n- `Configure`: This method\
    \ defines the application's request processing pipeline, specifying how incoming\
    \ requests are handled and transformed into responses. It's where you configure\
    \ middleware components, such as routing, authentication, and static file serving.\n\
    \n### Essential Configurations\n\nLet's explore some essential configurations\
    \ you'll typically perform in the `Startup` class:\n\n#### 1. Configure MVC:\n\
    \n```c#\npublic void ConfigureServices(IServiceCollection services)\n{\n    services.AddControllersWithViews();\
    \ // Add support for MVC controllers and views\n}\n```\n\n#### 2. Configure Routing:\n\
    \n```c#\npublic void Configure(IApplicationBuilder app, IWebHostEnvironment env)\n\
    {\n    // ... other configurations\n\n    app.UseRouting(); // Enable routing\n\
    \n    app.UseEndpoints(endpoints =>\n    {\n        endpoints.MapControllerRoute(\n\
    \            name: \"default\",\n            pattern: \"{controller=Home}/{action=Index}/{id?}\"\
    );\n    });\n\n    // ... other configurations\n}\n```\n\nThis configures the\
    \ default routing convention, mapping requests to controllers and actions based\
    \ on their names.\n\n#### 3. Configure Static Files:\n\n```c#\npublic void Configure(IApplicationBuilder\
    \ app, IWebHostEnvironment env)\n{\n    // ... other configurations\n\n    app.UseStaticFiles();\
    \ // Enable serving static files from the wwwroot folder\n\n    // ... other configurations\n\
    }\n```\n\nThis enables serving static files, such as CSS, JavaScript, and images,\
    \ from the `wwwroot` folder.\n\n### Additional Configurations\n\nDepending on\
    \ your application's requirements, you might also configure other aspects, such\
    \ as:\n\n- **Database connections**: Using Entity Framework Core or other data\
    \ access technologies.\n- **Authentication and authorization**: Implementing user\
    \ login and access control mechanisms.\n- **Error handling**: Defining custom\
    \ error pages and handling exceptions gracefully.\n- **Logging**: Configuring\
    \ logging providers and log levels to capture diagnostic information.\n\n### Running\
    \ Your Application\n\nOnce you've completed the project setup and configuration,\
    \ you can run your application using the .NET CLI or your development environment.\
    \ The application will typically launch in your default browser, allowing you\
    \ to interact with its initial interface and start exploring its functionalities.\n\
    \nIn this section, we've walked through the essential steps of project setup and\
    \ configuration for your first ASP.NET Core 3 web application. We've explored\
    \ the project structure, the `Startup` class, and key configurations that enable\
    \ MVC, routing, and static file serving. By mastering these foundational elements,\
    \ you're now equipped to create a functional ASP.NET Core 3 project and embark\
    \ on the exciting journey of building your web application.\n\n### Creating Controllers\
    \ and Views\n\nWith your ASP.NET Core 3 project set up and configured, it's time\
    \ to start adding the core components that will handle user requests and render\
    \ dynamic content. Controllers and views work in tandem to achieve this, with\
    \ controllers orchestrating the flow of data and views presenting it in a visually\
    \ appealing and interactive manner. In this section, we'll guide you through the\
    \ process of creating controllers and views, breathing life into your application\
    \ and laying the groundwork for building compelling user experiences.\n\n### Creating\
    \ Your First Controller\n\nControllers are the heart of request handling in ASP.NET\
    \ Core 3 MVC applications. They encapsulate the logic for processing incoming\
    \ requests, interacting with the model, and generating appropriate responses.\
    \ Let's create a simple controller named `HomeController`:\n\n1. Right-click on\
    \ the `Controllers` folder in your project.\n2. Select \"Add\" -> \"Controller...\"\
    .\n3. Choose \"MVC Controller - Empty\" from the template list.\n4. Name the controller\
    \ `HomeController` and click \"Add.\"\n\nThis will create a new C# file named\
    \ `HomeController.cs` within the `Controllers` folder.\n\n### Adding an Action\
    \ Method\n\nLet's add an action method named `Index` to the `HomeController`:\n\
    \n```c#\nusing Microsoft.AspNetCore.Mvc;\n\nnamespace MyFirstWebApplication.Controllers\n\
    {\n    public class HomeController : Controller\n    {\n        public IActionResult\
    \ Index()\n        {\n            return View();\n        }\n    }\n}\n```\n\n\
    The `Index` action method returns a `ViewResult`, indicating that it will render\
    \ a view.\n\n### Creating the Corresponding View\n\nNow, let's create the view\
    \ that will be rendered by the `Index` action method:\n\n1. Right-click on the\
    \ `Views` folder and create a new folder named `Home`.\n2. Right-click on the\
    \ `Home` folder and select \"Add\" -> \"View...\".\n3. Name the view `Index` and\
    \ select the \"Empty (without model)\" template.\n4. Click \"Add.\"\n\nThis will\
    \ create a new Razor view file named `Index.cshtml` within the `Views/Home` folder.\n\
    \n### Adding Content to the View\n\nLet's add some basic content to the `Index.cshtml`\
    \ view:\n\n```razor\n@{\n    ViewData[\"Title\"] = \"Home Page\";\n}\n\n<h1>Welcome\
    \ to My First Web Application!</h1>\n<p>This is the home page of your application.</p>\n\
    ```\n\nThe `ViewData[\"Title\"]` line sets the title of the page, which can be\
    \ used in the layout or displayed in the browser's title bar.\n\n### Running the\
    \ Application\n\nNow, let's run your application and navigate to the root URL\
    \ (`/`). You should see the \"Welcome to My First Web Application!\" message rendered\
    \ in your browser, indicating that the `HomeController`'s `Index` action method\
    \ successfully rendered the `Index.cshtml` view.\n\n### Passing Data to the View\n\
    \nControllers can pass data to views using the `ViewData` dictionary or by strongly\
    \ typing the view model. Let's modify the `Index` action method to pass a message\
    \ to the view:\n\n```c#\npublic IActionResult Index()\n{\n    ViewData[\"Message\"\
    ] = \"Hello from the controller!\";\n    return View();\n}\n```\n\nAnd update\
    \ the `Index.cshtml` view to display the message:\n\n```razor\n<h1>Welcome to\
    \ My First Web Application!</h1>\n<p>This is the home page of your application.</p>\n\
    <p>@ViewData[\"Message\"]</p>\n```"
  mdcn: "\n## 第4章：构建你的第一个 Web 应用程序\n\n项目设置与配置\n\n踏上使用 ASP.NET Core 3 构建第一个 Web 应用程序的旅程令人兴奋。在本节中，我们将指导你完成项目设置和配置的关键步骤，确保你为开始构建你的\
    \ Web 杰作打下坚实的基础。我们将探索能够让你创建一个功能完备且结构良好的 ASP.NET Core 3 项目的工具、模板和设置，为你探索 Web 开发概念和技术奠定基础。\n\
    \n### 创建新的 ASP.NET Core 3 项目\n\n构建 Web 应用程序的第一步是使用 .NET CLI（命令行界面）或你偏好的开发环境（如\
    \ Visual Studio）创建一个新项目。让我们概述使用 .NET CLI 的流程：\n\n1.  打开你的终端或命令提示符。\n2.  导航到你想要创建项目的目录。\n\
    3.  执行以下命令：\n\n```\nBash\ndotnet new webapp -o MyFirstWebApplication\n```\n\n\
    此命令使用默认的 \"webapp\" 模板创建一个名为 \"MyFirstWebApplication\" 的新 ASP.NET Core 3 Web 应用程序项目。`-o`\
    \ 选项指定项目的输出目录。\n\n### 探索项目结构\n\n项目创建后，让我们花点时间探索其结构。导航到 \"MyFirstWebApplication\"\
    \ 目录并检查其内容。你会找到熟悉的文件夹，如 Controllers、Models 和 Views，以及诸如 `Program.cs` 和 `Startup.cs`\
    \ 等关键文件。我们将在后续章节中深入探讨这些组件的细节。\n\n### 配置 Startup 类\n\n`Startup` 类在配置你的 ASP.NET\
    \ Core 3 应用程序中起着至关重要的作用。它包含两个关键方法：`ConfigureServices` 和 `Configure`。\n\n- `ConfigureServices`：此方法负责向应用程序的依赖注入容器注册服务。服务是提供特定功能的组件，例如数据库访问、日志记录或身份验证。\n\
    - `Configure`：此方法定义应用程序的请求处理管道，指定如何处理传入请求并将其转换为响应。这是你配置中间件组件的地方，例如路由、身份验证和静态文件服务。\n\
    \n### 基本配置\n\n让我们探讨一些通常在 `Startup` 类中执行的基本配置：\n\n#### 1. 配置 MVC：\n\n```c#\npublic\
    \ void ConfigureServices(IServiceCollection services)\n{\n    services.AddControllersWithViews();\
    \ // 添加对 MVC 控制器和视图的支持\n}\n```\n\n#### 2. 配置路由：\n\n```c#\npublic void Configure(IApplicationBuilder\
    \ app, IWebHostEnvironment env)\n{\n    // ... 其他配置\n\n    app.UseRouting(); //\
    \ 启用路由\n\n    app.UseEndpoints(endpoints =>\n    {\n        endpoints.MapControllerRoute(\n\
    \            name: \"default\",\n            pattern: \"{controller=Home}/{action=Index}/{id?}\"\
    );\n    });\n\n    // ... 其他配置\n}\n```\n\n这将配置默认的路由约定，根据控制器和操作的名称将请求映射到对应的控制器和操作。\n\
    \n#### 3. 配置静态文件：\n\n```c#\npublic void Configure(IApplicationBuilder app, IWebHostEnvironment\
    \ env)\n{\n    // ... 其他配置\n\n    app.UseStaticFiles(); // 启用从 wwwroot 文件夹提供静态文件服务\n\
    \n    // ... 其他配置\n}\n```\n\n这使得可以从 `wwwroot` 文件夹提供 CSS、JavaScript 和图像等静态文件。\n\
    \n### 附加配置\n\n根据你的应用程序需求，你可能还需要配置其他方面，例如：\n\n- **数据库连接**：使用 Entity Framework Core\
    \ 或其他数据访问技术。\n- **身份验证和授权**：实现用户登录和访问控制机制。\n- **错误处理**：定义自定义错误页面并优雅地处理异常。\n- **日志记录**：配置日志提供程序和日志级别以捕获诊断信息。\n\
    \n### 运行你的应用程序\n\n完成项目设置和配置后，你可以使用 .NET CLI 或你的开发环境运行应用程序。应用程序通常会在你的默认浏览器中启动，让你可以与其初始界面交互并开始探索其功能。\n\
    \n在本节中，我们已经完成了为你的第一个 ASP.NET Core 3 Web 应用程序进行项目设置和配置的关键步骤。我们探索了项目结构、`Startup`\
    \ 类以及启用 MVC、路由和静态文件服务的关键配置。通过掌握这些基础元素，你现在已具备创建功能完备的 ASP.NET Core 3 项目的条件，并可以踏上构建\
    \ Web 应用程序的激动人心的旅程。\n\n### 创建控制器和视图\n\n你的 ASP.NET Core 3 项目已设置和配置完毕，现在是时候开始添加处理用户请求和呈现动态内容的核心组件了。控制器和视图协同工作来实现这一点，控制器协调数据流，而视图则以视觉上吸引人且交互式的方式呈现数据。在本节中，我们将指导你完成创建控制器和视图的过程，为你的应用程序注入活力，并为构建引人入胜的用户体验奠定基础。\n\
    \n### 创建你的第一个控制器\n\n控制器是 ASP.NET Core 3 MVC 应用程序中请求处理的核心。它们封装了处理传入请求、与模型交互和生成适当响应的逻辑。让我们创建一个简单的名为\
    \ `HomeController` 的控制器：\n\n1.  在你的项目中，右键单击 `Controllers` 文件夹。\n2.  选择 \"添加\"\
    \ -> \"控制器...\"。\n3.  从模板列表中选择 \"MVC 控制器 - 空\"。\n4.  将控制器命名为 `HomeController`\
    \ 并点击 \"添加\"。\n\n这将在 `Controllers` 文件夹内创建一个名为 `HomeController.cs` 的新 C# 文件。\n\n\
    ### 添加操作方法\n\n让我们向 `HomeController` 添加一个名为 `Index` 的操作方法：\n\n```c#\nusing Microsoft.AspNetCore.Mvc;\n\
    \nnamespace MyFirstWebApplication.Controllers\n{\n    public class HomeController\
    \ : Controller\n    {\n        public IActionResult Index()\n        {\n     \
    \       return View();\n        }\n    }\n}\n```\n\n`Index` 操作方法返回一个 `ViewResult`，表明它将呈现一个视图。\n\
    \n### 创建对应的视图\n\n现在，让我们创建将被 `Index` 操作方法呈现的视图：\n\n1.  右键单击 `Views` 文件夹并创建一个名为\
    \ `Home` 的新文件夹。\n2.  右键单击 `Home` 文件夹并选择 \"添加\" -> \"视图...\"。\n3.  将视图命名为 `Index`\
    \ 并选择 \"空（不含模型）\" 模板。\n4.  点击 \"添加\"。\n\n这将在 `Views/Home` 文件夹内创建一个名为 `Index.cshtml`\
    \ 的新 Razor 视图文件。\n\n### 向视图添加内容\n\n让我们向 `Index.cshtml` 视图添加一些基本内容：\n\n```razor\n\
    @{\n    ViewData[\"Title\"] = \"Home Page\";\n}\n\n<h1>Welcome to My First Web\
    \ Application!</h1>\n<p>This is the home page of your application.</p>\n```\n\n\
    `ViewData[\"Title\"]` 这一行设置了页面的标题，该标题可以在布局中使用，也可以显示在浏览器的标题栏中。\n\n### 运行应用程序\n\n\
    现在，让我们运行你的应用程序并导航到根 URL (`/`)。你应该会在浏览器中看到 \"Welcome to My First Web Application!\"\
    \ 消息被渲染出来，这表明 `HomeController` 的 `Index` 操作方法成功呈现了 `Index.cshtml` 视图。\n\n### 向视图传递数据\n\
    \n控制器可以使用 `ViewData` 字典或通过强类型视图模型将数据传递给视图。让我们修改 `Index` 操作方法以向视图传递一条消息：\n\n```c#\n\
    public IActionResult Index()\n{\n    ViewData[\"Message\"] = \"Hello from the\
    \ controller!\";\n    return View();\n}\n```\n\n并更新 `Index.cshtml` 视图以显示该消息：\n\
    \n```razor\n<h1>Welcome to My First Web Application!</h1>\n<p>This is the home\
    \ page of your application.</p>\n<p>@ViewData[\"Message\"]</p>\n```\n"
