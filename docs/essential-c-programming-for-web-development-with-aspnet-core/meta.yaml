    \n在本节中，我们探讨了 ASP.NET Core 3 应用程序中数据验证和安全的关键方面。我们学习了如何实现客户端和服务器端验证，以确保数据完整性并防范恶意输入。我们还强调了关键的安全最佳实践，重点关注输入清理、参数化查询、认证、授权和安全配置的重要性。掌握了这些知识，您现在就能够构建不仅功能完善、用户友好，而且健壮安全的\
    \ Web 应用程序，保护您的数据和用户免受潜在威胁。\n\n## 第 6 章：使用 ASP.NET Core 3 构建 API\n\n### RESTful\
    \ API 设计原则\n\n在当今互联互通的数字环境中，API（应用程序编程接口）在实现不同系统和服务之间的通信与数据交换方面发挥着至关重要的作用。REST（表述性状态转移）已成为设计\
    \ Web API 的主流架构风格，它提供了一套促进简单性、可扩展性和可维护性的原则和约束。在本节中，我们将深入探讨 RESTful API 设计的核心准则，探究其本质、优势以及在\
    \ ASP.NET Core 3 上下文中的实际实现。\n\n### 理解 REST\n\n从本质上讲，REST 是一种架构风格，它利用 HTTP 协议的基本原理，为系统在\
    \ Web 上的交互创建了一种标准化和直观的方式。它强调客户端-服务器模型，客户端向服务器发送请求以访问和操作资源，服务器则用这些资源的表述进行响应。\n\n\
    ### REST 的核心原则\n\n- **客户端-服务器架构：** REST 强制执行客户端（API 的消费者）和服务器（API 的提供者）之间的清晰分离。这种分离促进了两个组件的独立演进和可扩展性。\n\
    - **无状态性：** 客户端到服务器的每个请求都必须包含理解及处理该请求所需的全部信息。服务器在请求之间不保留任何客户端上下文，这简化了实现并支持水平扩展。\n\
    - **可缓存性：** 服务器的响应可以被显式或隐式标记为可缓存或不可缓存，允许客户端在本地存储响应并在后续请求中重用，从而提高性能并减少网络流量。\n-\
    \ **分层系统：** REST 允许系统组件分层，每层只与相邻层交互，促进了模块化和封装。\n- **统一接口：** REST 定义了一组标准的 HTTP\
    \ 方法（GET、POST、PUT、PATCH、DELETE）来对资源执行操作，为客户端提供了一致且可预测的接口。\n- **按需代码（可选）：** 服务器可以通过传输可执行代码（例如\
    \ JavaScript）来可选地扩展客户端的功能，这些代码将在客户端执行。\n\n### **REST 实践：关键设计考量**\n\n在设计 RESTful\
    \ API 时，遵守以下关键考量可确保清晰性、一致性和易用性：\n\n- **以资源为中心：** 围绕资源设计您的 API，资源代表您系统中的关键实体或数据对象。在\
    \ URL 中使用名词表示资源（例如，`/products`，`/orders`），并使用 HTTP 方法对这些资源执行操作。\n- **HTTP 动词：**\
    \ 利用标准的 HTTP 动词来表示对资源的预期操作：\n    - **GET：** 获取资源的表述。\n    - **POST：** 创建一个新资源。\n\
    \    - **PUT：** 更新或替换一个现有资源。\n    - **PATCH：** 部分修改一个现有资源。\n    - **DELETE：**\
    \ 删除一个资源。\n- **状态码：** 使用适当的 HTTP 状态码来指示请求的结果：\n    - **2xx（成功）：** 请求已被成功处理。\n\
    \    - **4xx（客户端错误）：** 请求包含错误或无效数据。\n    - **5xx（服务器错误）：** 处理请求时服务器发生错误。\n- **内容协商：**\
    \ 支持多种数据格式，例如 JSON 或 XML，允许客户端在请求的 `Accept` 头中指定其首选格式。\n- **HATEOAS（超媒体作为应用状态引擎）：**\
    \ 在响应中包含超媒体链接，以指导客户端如何与您的 API 交互，促进可发现性和自我文档化。\n\n### 使用 ASP.NET Core 3 构建 RESTful\
    \ API\n\nASP.NET Core 3 提供了一个用于构建 RESTful API 的健壮框架。让我们来看一个 API 控制器的简单示例：\n\n\
    ```csharp\n[ApiController]\n[Route(\"api/[controller]\")]\npublic class ProductsController\
    \ : ControllerBase\n{\n    [HttpGet]\n    public IEnumerable<Product> Get()\n\
    \    {\n        // ... retrieve all products\n    }\n\n    [HttpGet(\"{id}\")]\n\
    \    public IActionResult Get(int id)\n    {\n        // ... retrieve product\
    \ by id\n    }\n\n    [HttpPost]\n    public IActionResult Post([FromBody] Product\
    \ product)\n    {\n        // ... create a new product\n    }\n\n    // ... other\
    \ actions (Put, Patch, Delete)\n}\n```\n\n此控制器定义了用于检索所有产品（GET /api/products）、通过\
    \ ID 检索特定产品（GET /api/products/{id}）以及创建新产品（POST /api/products）的端点。`[ApiController]`\
    \ 特性启用了 API 控制器特有的功能，例如自动模型验证和绑定源推断。\n\n在本节中，我们探讨了 RESTful API 设计的基本原理及其在 ASP.NET\
    \ Core 3 中的实际实现。我们见证了 REST 如何利用 HTTP 的力量为 Web 服务创建标准化和直观的接口，促进简单性、可扩展性和可维护性。掌握了这些知识，您现在就能够设计和构建健壮且结构良好的\
    \ API，这些 API 可以与其他系统和服务无缝集成，扩展您的应用程序的覆盖范围和能力。\n\n### 创建 API 控制器\n\n在 Web API 的世界中，控制器充当客户端请求与应用程序底层逻辑之间的中介。它们负责接收传入的请求、处理数据、与模型交互以及生成适当的响应。ASP.NET\
    \ Core 3 提供了专用的 `ApiController` 特性和一组约定，简化了构建 RESTful API 控制器的过程，使其更加简洁、高效，并专注于数据交换。在本节中，我们将深入探讨在\
    \ ASP.NET Core 3 中创建 API 控制器的复杂细节，探索其结构、操作方法、特性路由以及构建设计良好且可维护 API 的最佳实践。\n\n**`ApiController`\
    \ 特性**\n\n`[ApiController]` 特性是 ASP.NET Core 3 中 API 控制器的一个关键区分点。当应用于控制器类时，它启用了几个专为\
    \ API 开发量身定制的功能：\n\n- **自动 HTTP 400 响应：** 如果模型验证失败，控制器会自动返回一个 HTTP 400（错误请求）响应，其中包含验证错误的详细信息。\n\
    - **特性路由要求：** API 控制器中的操作方法必须使用特性路由特性（例如，`[HttpGet]`、`[HttpPost]` 等）进行修饰，以定义它们的路由。\n\
    - **绑定源推断：** 框架根据操作方法参数的特性和 HTTP 请求方法来推断其绑定源。例如，标记为 `[FromBody]` 的参数从请求正文绑定，而没有特性的参数则从查询字符串或路由值绑定。\n\
    \n### 操作方法和特性路由\n\nAPI 控制器中的操作方法负责处理特定的 HTTP 请求并生成相应的响应。它们通常使用特性路由特性进行修饰，以定义它们的路由和处理的\
    \ HTTP 方法。\n\n让我们看一个带有操作方法的 API 控制器示例：\n\n```csharp\n[ApiController]\n[Route(\"\
    api/[controller]\")]\npublic class ProductsController : ControllerBase\n{\n  \
    \  [HttpGet]\n    public IEnumerable<Product> GetAllProducts()\n    {\n      \
    \  // ... retrieve all products from the database\n    }\n\n    [HttpGet(\"{id}\"\
    )]\n    public ActionResult<Product> GetProductById(int id)\n    {\n        //\
    \ ... retrieve product by id from the database\n```\n"
