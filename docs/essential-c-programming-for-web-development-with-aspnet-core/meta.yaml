    Console.WriteLine("The square of " + number + " is " + squaredNumber);

    ```


    In this code snippet, we call the Square function, passing the value of the number
    variable as an argument. The function calculates the square and returns the result,
    which we store in the squaredNumber variable. Finally, we print the result to
    the console.


    # Parameters and Arguments


    Parameters act as placeholders for the values you pass to a function or method
    when you call it. Arguments, on the other hand, are the actual values you provide
    during the function call.


    +   - **Pass by Value:** In C#, parameters are typically passed by value, meaning
    a copy of the argument''s value is made and passed to the function. Any modifications
    made to the parameter within the function don''t affect the original argument.

    - **Pass by Reference:** You can also pass parameters by reference using the `ref`
    or `out` keywords. In this case, the function receives a reference to the original
    argument, allowing it to modify the argument''s value directly.


    # Return Values


    Functions and methods can return values to the caller, providing a way to communicate
    results or computed data. The `return` statement is used to specify the value
    to be returned.


