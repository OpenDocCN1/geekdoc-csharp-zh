    \n路由是根据预定义模式，将传入的 HTTP 请求与特定控制器 Action 方法进行匹配的过程。它充当交通指挥员，将请求引导至其在应用程序中的预定目的地。ASP.NET\
    \ Core 3 提供了一个灵活而强大的路由系统，允许你使用约定、特性或两者结合来定义路由。\n\n### 基于约定的路由\n\n基于约定的路由依赖于预定义模式将请求映射到控制器和操作。默认约定是根据控制器名称将请求映射到控制器（例如，`/Home`\
    \ 映射到 `HomeController`），并根据 HTTP 动词和操作名称将请求映射到操作（例如，对 `/Home/Index` 的 GET 请求映射到\
    \ `HomeController` 中的 `Index` 操作方法）。\n\n### 基于特性的路由\n\n基于特性的路由允许你使用控制器操作方法上的特性来显式定义路由。这提供了更大的控制力和灵活性，尤其是在默认约定不足的情况下。\n\
    \n```csharp\n[Route(\"api/[controller]\")]\npublic class ProductsController :\
    \ Controller\n{\n    [HttpGet(\"{id}\")]\n    public IActionResult GetProduct(int\
