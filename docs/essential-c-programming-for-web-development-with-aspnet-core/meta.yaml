    \ (Increment)\n- **--** (Decrement)\n- **?:** (Conditional operator - a shorthand\
    \ for if-else)\n\n## Operator Precedence\n\nWhen an expression involves multiple\
    \ operators, C# follows a specific order of precedence to evaluate them. It's\
    \ essential to understand this order to ensure your code behaves as expected.\
    \ You can use parentheses to override the default precedence and control the order\
    \ of evaluation.\n\nIn this chapter, we've explored the fundamental building blocks\
    \ of C# programming: variables, data types, and operators. We've learned how to\
    \ declare variables, assign values to them, and choose the right data types for\
    \ different scenarios. We've also delved into the world of operators, discovering\
    \ how to perform various operations on data. Armed with this knowledge, you're\
    \ now ready to embark on the exciting journey of building web applications with\
    \ ASP.NET Core 3.\n\n## Control Flow (if, else, switch, loops)\n\nIn the realm\
    \ of programming, control flow statements empower us to guide the execution of\
    \ our code, making decisions, repeating actions, and handling various scenarios\
    \ with finesse. C# provides a robust set of control flow constructs, including\
    \ `if`, `else`, `switch`, and loops, allowing us to create dynamic and adaptable\
    \ programs. In this section, we'll delve into these constructs, unraveling their\
    \ intricacies and demonstrating their practical applications.\n\n### `if`, `else`,\
    \ and `else if`: Making Decisions\n\nThe `if` statement is the cornerstone of\
    \ decision-making in C#. It allows us to execute a block of code only if a certain\
    \ condition is met. Here's the basic syntax:\n\n```csharp\nif (condition)\n{\n\
    \    // Code to execute if the condition is true\n}\n```\n\nLet's illustrate with\
    \ an example:\n\n```csharp\nint age = 25;\nif (age >= 18)\n{\n    Console.WriteLine(\"\
    You are eligible to vote.\");\n}\n```\n\nIn this snippet, the code within the\
    \ `if` block will be executed only if the value of the `age` variable is greater\
    \ than or equal to 18.\nWe can enhance our decision-making capabilities by incorporating\
    \ the `else` statement, which provides an alternative code path to execute if\
    \ the original condition is false:\n\n```csharp\nif (age >= 18)\n{\n    Console.WriteLine(\"\
    You are eligible to vote.\");\n}\nelse\n{\n    // Code to execute if the condition\
    \ is false\n    Console.WriteLine(\"You are not yet eligible to vote.\");\n}\n\
    ```\n\nNow, if the `age` is less than 18, the code within the `else` block will\
    \ be executed.\n\nFor scenarios involving multiple conditions, we can employ the\
    \ `else if` statement:\n\n```csharp\nif (age >= 65)\n{\n    Console.WriteLine(\"\
    You are eligible for senior citizen benefits.\");\n}\nelse if (age >= 18)\n{\n\
    \    Console.WriteLine(\"You are eligible to vote.\");\n}\nelse\n{\n    Console.WriteLine(\"\
    You are not yet eligible to vote.\");\n}\n```\n\nIn this expanded example, we\
    \ check for multiple age ranges and provide appropriate messages based on the\
    \ conditions.\n\n### **switch**: **Handling Multiple Cases**\n\nThe `switch` statement\
    \ offers a concise way to handle multiple cases based on the value of an expression.\
    \ It's particularly useful when you have a series of discrete values to compare\
    \ against. Let's see it in action:\n\n```csharp\nint dayOfWeek = 3; // Assuming\
    \ 1 represents Monday, 2 represents Tuesday, and so on\nswitch (dayOfWeek)\n{\n\
    \    case 1:\n        Console.WriteLine(\"It's Monday.\");\n        break;\n \
    \   case 2:\n        Console.WriteLine(\"It's Tuesday.\");\n        break;\n \
    \   case 3:\n        Console.WriteLine(\"It's Wednesday.\");\n        break;\n\
    \    // ... other cases\n    default:\n        Console.WriteLine(\"Invalid day\
    \ of the week.\");\n        break;\n}\n```\n\nIn this example, the `switch` statement\
    \ evaluates the value of `dayOfWeek` and executes the corresponding `case` block.\
    \ The `break` statement is crucial to prevent fall-through, ensuring that only\
    \ the intended code block is executed. The `default` case acts as a catch-all\
    \ for any value that doesn't match the specified cases.\n\n### Loops: Repeating\
    \ Actions\n\nLoops are indispensable for performing repetitive tasks in programming.\
    \ C# offers several types of loops, each suited for different scenarios:\n\n####\
    \ 1. for Loop\n\nThe for loop is ideal when you know the number of iterations\
    \ in advance. It consists of three parts: initialization, condition, and iteration.\n\
    \n```csharp\nfor (int i = 0; i < 5; i++)\n{\n    Console.WriteLine(\"Iteration:\
    \ \" + i);\n}\n```\n\nThis loop will execute five times, printing the iteration\
    \ number in each cycle.\n\n#### 2. while Loop\n\nThe while loop continues to execute\
    \ as long as a specified condition remains true.\n\n```csharp\nint count = 0;\n\
    \nwhile (count < 10)\n{\n    Console.WriteLine(\"Count: \" + count);\n    count++;\n\
    }\n```\n\nThis loop will increment the count variable and print its value until\
    \ it reaches 10."
