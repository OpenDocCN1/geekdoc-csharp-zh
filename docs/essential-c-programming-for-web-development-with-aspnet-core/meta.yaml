- md: "## 3. do-while Loop\n\nThe do-while loop is similar to the while loop, but\
    \ it guarantees that the code block within the loop will execute at least once,\
    \ even if the condition is initially false.\n\n```c#\nint number = 0;\n\ndo\n\
    {\n    Console.WriteLine(\"Number: \" + number);\n    number++;\n} while (number\
    \ < 5);\n```\n\nThis loop will print the value of number and increment it until\
    \ it reaches 5.\n\n## 4. foreach Loop\n\nThe foreach loop is designed for iterating\
    \ over collections, such as arrays and lists.\n\n```c#\nstring[] fruits = { \"\
    apple\", \"banana\", \"orange\" };\n\nforeach (string fruit in fruits)\n{\n  \
    \  Console.WriteLine(fruit);\n}\n```\n\nThis loop will iterate through the `fruits`\
    \ array and print each fruit.\n\nIn this section, we've explored the essential\
    \ control flow constructs in C#: `if`, `else`, `switch`, and loops. We've seen\
    \ how these constructs enable us to make decisions, handle multiple cases, and\
    \ repeat actions, adding dynamism and flexibility to our programs. Armed with\
    \ this knowledge, you're now equipped to craft C# code that navigates complex\
    \ scenarios and adapts to diverse inputs.\n\n# Functions and Methods\n\nFunctions\
    \ and methods are the workhorses of programming, allowing us to package reusable\
    \ blocks of code into self-contained units. They promote modularity, code reusability,\
    \ and maintainability, making our programs more organized and efficient. In C#,\
    \ functions and methods are essentially the same, with the term \"method\" typically\
    \ used when referring to functions defined within classes. In this section, we'll\
    \ delve into the world of functions and methods, exploring their syntax, parameters,\
    \ return values, and their pivotal role in structuring C# programs.\n\n## Defining\
    \ Functions and Methods\n\nThe general syntax for defining a function or method\
    \ in C# is as follows:\n\n```c#\naccess_modifier return_type function_name(parameters)\n\
    {\n    // Code to be executed\n    return value; // If the function has a return\
    \ type\n}\n```\n\nLet's break down the components of this syntax:\n\n- `access_modifier`:\
    \ Specifies the accessibility of the function or method (e.g., `public`, `private`,\
    \ `protected`).\n- `return_type`: Defines the data type of the value the function\
    \ will return. If the function doesn't return a value, use the keyword `void`.\n\
    - `function_name`: The name you give to your function or method, following C#'s\
    \ naming conventions.\n- `parameters`: A comma-separated list of variables that\
    \ the function or method accepts as input.\n- `// Code to be executed`: The actual\
    \ code that performs the function's or method's intended task.\n- `return value;`:\
    \ The value returned by the function, if applicable.\n\n## Example: A Simple Function\n\
    \nLet's create a simple function that calculates the square of a number:\n\n```c#\n\
    public static int Square(int number)\n{\n    int result = number * number;\n \
    \   return result;\n}\n```\n\nIn this example, the function `Square` takes an\
    \ integer `number` as input, calculates its square, and returns the result as\
    \ an integer. The `public static` modifiers indicate that this function is accessible\
    \ from anywhere in the program and doesn't require an object instance to be called.\n\
    \n## Calling Functions and Methods\n\nTo utilize the functionality encapsulated\
    \ within a function or method, you need to call it, providing the necessary arguments\
    \ if any.\n\n```c#\nint number = 5;\nint squaredNumber = Square(number);\nConsole.WriteLine(\"\
    The square of \" + number + \" is \" + squaredNumber);\n```\n\nIn this code snippet,\
    \ we call the Square function, passing the value of the number variable as an\
    \ argument. The function calculates the square and returns the result, which we\
    \ store in the squaredNumber variable. Finally, we print the result to the console.\n\
    \n## Parameters and Arguments\n\nParameters act as placeholders for the values\
    \ you pass to a function or method when you call it. Arguments, on the other hand,\
    \ are the actual values you provide during the function call.\n\n- **Pass by Value:**\
    \ In C#, parameters are typically passed by value, meaning a copy of the argument's\
    \ value is made and passed to the function. Any modifications made to the parameter\
    \ within the function don't affect the original argument.\n- **Pass by Reference:**\
    \ You can also pass parameters by reference using the `ref` or `out` keywords.\
    \ In this case, the function receives a reference to the original argument, allowing\
    \ it to modify the argument's value directly.\n\n## Return Values\n\nFunctions\
    \ and methods can return values to the caller, providing a way to communicate\
    \ results or computed data. The `return` statement is used to specify the value\
    \ to be returned.\n\n## Overloading Functions and Methods\n\nC# allows you to\
    \ define multiple functions or methods with the same name, as long as they have\
    \ different parameter lists. This is called function or method overloading and\
    \ provides flexibility in how you design your code.\n\nIn this section, we've\
    \ explored the world of functions and methods in C#, learning how to define them,\
    \ call them, and leverage their power to encapsulate reusable code. We've also\
    \ examined parameters, return values, and function overloading, gaining insights\
    \ into the versatility and efficiency they bring to C# programming. Armed with\
    \ this knowledge, you're now equipped to structure your code more effectively,\
    \ promote reusability, and build robust web applications with ASP.NET Core 3.\n\
    \n# Object-Oriented Programming (Classes, Objects, Inheritance, Polymorphism)\n\
    \nObject-oriented programming (OOP) is a powerful paradigm that revolutionizes\
    \ the way we design and structure our code. It empowers us to model real-world\
    \ entities as objects, encapsulating their data and behaviors within self-contained\
    \ units. OOP promotes modularity, code reusability, and maintainability, making\
    \ it a cornerstone of modern software development. In this section, we'll embark\
    \ on a journey through the core tenets of OOP in C#, exploring classes, objects,\
    \ inheritance, and polymorphism, and witnessing how they enable us to create elegant\
    \ and adaptable programs.\n\n## Classes: The Blueprints for Objects\n\nIn the\
    \ realm of OOP, a class serves as a blueprint or template for creating objects.\
    \ It defines the structure and behavior that objects of that class will possess.\
    \ Think of it as a cookie cutter, where each cookie represents an object created\
    \ from the same mold.\n\nHere's the general syntax for defining a class in C#:\n\
    \n```c#\nclass ClassName\n{\n    // Fields (data members)\n    // Properties (accessors\
    \ for fields)\n    // Methods (functions associated with the class)\n    // Constructors\
    \ (special methods for object creation)\n}\n```\n\nLet's illustrate with an example:\n\
    \n```c#\nclass Car\n{\n    // Fields\n    public string Make;\n    public string\
    \ Model;\n    public int Year;\n\n    // Constructor\n    public Car(string make,\
    \ string model, int year)\n    {\n        Make = make;\n        Model = model;\n\
    \        Year = year;\n    }\n\n    // Method\n    public void StartEngine()\n\
    \    {\n        Console.WriteLine(\"Engine started!\");\n    }\n}\n```\n\nIn this\
    \ example, we define a `Car` class with fields to store the make, model, and year\
    \ of a car. We also include a constructor to initialize these fields when a new\
    \ `Car` object is created, and a method `StartEngine` to simulate starting the\
    \ car's engine.\n\n## Objects: Instances of Classes\n\nAn object is a concrete\
    \ instance of a class, representing a specific entity in your program. It's like\
    \ a particular car created from the `Car` blueprint, with its own unique set of\
    \ values for the make, model, and year.\n\nTo create an object in C#, you use\
    \ the `new` keyword followed by the class name and any necessary arguments for\
    \ the constructor:\n\n```c#\nCar myCar = new Car(\"Toyota\", \"Camry\", 2023);\n\
    ```\n\nThis line of code creates a new `Car` object named `myCar` with the specified\
    \ make, model, and year.\n\n## Accessing Members of an Object\n\nOnce you have\
    \ an object, you can access its fields, properties, and methods using the dot\
    \ ( . ) operator:\n\n```c#\nConsole.WriteLine(myCar.Make); // Output: Toyota\n\
    myCar.StartEngine(); // Output: Engine started!\n```\n\n## Inheritance: Building\
    \ Hierarchies of Classes"
  mdcn: "\n## 3. do-while 循环\n\ndo-while 循环与 while 循环类似，但它确保循环内的代码块至少会执行一次，即使条件最初为\
    \ false。\n\n```c#\nint number = 0;\n\ndo\n{\n    Console.WriteLine(\"Number: \"\
    \ + number);\n    number++;\n} while (number < 5);\n```\n\n此循环将打印 number 的值并递增，直到它达到\
    \ 5。\n\n## 4. foreach 循环\n\nforeach 循环专为遍历集合而设计，例如数组和列表。\n\n```c#\nstring[] fruits\
    \ = { \"apple\", \"banana\", \"orange\" };\n\nforeach (string fruit in fruits)\n\
    {\n    Console.WriteLine(fruit);\n}\n```\n\n此循环将遍历 `fruits` 数组并打印每个水果。\n\n在本节中，我们探讨了\
    \ C# 中的基本控制流结构：`if`、`else`、`switch` 和循环。我们已经看到这些结构如何使我们能够做出决策、处理多种情况并重复操作，为我们的程序增添了动态性和灵活性。掌握了这些知识，你现在就能够编写\
    \ C# 代码来处理复杂场景并适应各种输入。\n\n# 函数和方法\n\n函数和方法是编程的主力，允许我们将可重用的代码块打包成独立的单元。它们促进了模块化、代码重用和可维护性，使我们的程序更加有序和高效。在\
    \ C# 中，函数和方法本质上是相同的，通常在指代类中定义的函数时使用“方法”一词。在本节中，我们将深入探讨函数和方法的世界，研究它们的语法、参数、返回值以及它们在构建\
    \ C# 程序中的关键作用。\n\n## 定义函数和方法\n\n在 C# 中定义函数或方法的通用语法如下：\n\n```c#\naccess_modifier\
    \ return_type function_name(parameters)\n{\n    // 要执行的代码\n    return value; //\
    \ 如果函数有返回类型\n}\n```\n\n让我们分解此语法的各个组成部分：\n\n- `access_modifier`：指定函数或方法的可访问性（例如，`public`、`private`、`protected`）。\n\
    - `return_type`：定义函数将返回的值的数据类型。如果函数不返回值，请使用关键字 `void`。\n- `function_name`：你为函数或方法命名的名称，遵循\
    \ C# 的命名约定。\n- `parameters`：函数或方法接受为输入的变量的逗号分隔列表。\n- `// 要执行的代码`：实际执行函数或方法预定任务的代码。\n\
    - `return value;`：函数返回的值（如果适用）。\n\n## 示例：一个简单的函数\n\n让我们创建一个计算数字平方的简单函数：\n\n```c#\n\
    public static int Square(int number)\n{\n    int result = number * number;\n \
    \   return result;\n}\n```\n\n在此示例中，函数 `Square` 接受一个整数 `number` 作为输入，计算其平方，并将结果作为整数返回。`public\
    \ static` 修饰符表明此函数可从程序中的任何位置访问，并且调用时不需要对象实例。\n\n## 调用函数和方法\n\n要利用封装在函数或方法中的功能，你需要调用它，并在必要时提供必要的参数。\n\
    \n```c#\nint number = 5;\nint squaredNumber = Square(number);\nConsole.WriteLine(\"\
    The square of \" + number + \" is \" + squaredNumber);\n```\n\n在此代码片段中，我们调用 Square\
    \ 函数，将 number 变量的值作为参数传递。该函数计算平方并返回结果，我们将其存储在 squaredNumber 变量中。最后，我们将结果打印到控制台。\n\
    \n## 参数和实参\n\n参数充当调用函数或方法时传递的值的占位符。另一方面，实参是你在函数调用时提供的实际值。\n\n- **按值传递：** 在 C#\
    \ 中，参数通常按值传递，这意味着会创建实参值的副本并传递给函数。函数内对参数所做的任何修改都不会影响原始实参。\n- **按引用传递：** 你也可以使用\
    \ `ref` 或 `out` 关键字按引用传递参数。在这种情况下，函数接收原始实参的引用，允许其直接修改实参的值。\n\n## 返回值\n\n函数和方法可以向调用者返回值，提供一种交流结果或计算数据的方式。`return`\
    \ 语句用于指定要返回的值。\n\n## 重载函数和方法\n\nC# 允许你定义多个同名的函数或方法，只要它们具有不同的参数列表。这称为函数或方法重载，为你的代码设计提供了灵活性。\n\
    \n在本节中，我们探讨了 C# 中函数和方法的世界，学习了如何定义它们、调用它们，以及利用它们的力量来封装可重用的代码。我们还研究了参数、返回值和函数重载，深入了解了它们为\
    \ C# 编程带来的多功能性和效率。掌握了这些知识，你现在就能够更有效地构建代码、促进重用，并使用 ASP.NET Core 3 构建健壮的 Web 应用程序。\n\
    \n# 面向对象编程（类、对象、继承、多态）\n\n面向对象编程（OOP）是一种强大的范式，彻底改变了我们设计和构建代码的方式。它使我们能够将现实世界的实体建模为对象，将它们的数据和行为封装在独立的单元中。OOP\
    \ 促进了模块化、代码重用和可维护性，使其成为现代软件开发的基石。在本节中，我们将开启一段探索 C# 中 OOP 核心原则的旅程，研究类、对象、继承和多态，并见证它们如何使我们能够创建优雅且适应性强的程序。\n\
    \n## 类：对象的蓝图\n\n在 OOP 的领域中，类充当创建对象的蓝图或模板。它定义了该类对象将具有的结构和行为。可以将其视为饼干模具，每个饼干都代表从相同模具创建的对象。\n\
    \n以下是在 C# 中定义类的通用语法：\n\n```c#\nclass ClassName\n{\n    // 字段（数据成员）\n    // 属性（字段的访问器）\n\
    \    // 方法（与类关联的函数）\n    // 构造函数（用于对象创建的特殊方法）\n}\n```\n\n让我们用一个例子来说明：\n\n```c#\n\
    class Car\n{\n    // 字段\n    public string Make;\n    public string Model;\n \
    \   public int Year;\n\n    // 构造函数\n    public Car(string make, string model,\
    \ int year)\n    {\n        Make = make;\n        Model = model;\n        Year\
    \ = year;\n    }\n\n    // 方法\n    public void StartEngine()\n    {\n        Console.WriteLine(\"\
    Engine started!\");\n    }\n}\n```\n\n在此示例中，我们定义了一个 `Car` 类，其中包含用于存储汽车品牌、型号和年份的字段。我们还包括一个构造函数，用于在创建新的\
    \ `Car` 对象时初始化这些字段，以及一个 `StartEngine` 方法来模拟启动汽车引擎。\n\n## 对象：类的实例\n\n对象是类的具体实例，代表程序中的特定实体。它就像是从\
    \ `Car` 蓝图创建的特定汽车，拥有自己独特的一组品牌、型号和年份值。\n\n要在 C# 中创建一个对象，你需要使用 `new` 关键字，后跟类名和构造函数所需的任何参数：\n\
    \n```c#\nCar myCar = new Car(\"Toyota\", \"Camry\", 2023);\n```\n\n这行代码创建了一个名为\
    \ `myCar` 的新 `Car` 对象，指定了品牌、型号和年份。\n\n## 访问对象的成员\n\n一旦你有一个对象，你就可以使用点（ . ）运算符访问其字段、属性和方法：\n\
    \n```c#\nConsole.WriteLine(myCar.Make); // 输出: Toyota\nmyCar.StartEngine(); //\
    \ 输出: Engine started!\n```\n\n## 继承：构建类层次结构\n"
