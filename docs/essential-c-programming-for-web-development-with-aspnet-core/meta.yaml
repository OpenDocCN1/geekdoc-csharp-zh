    \nRazor 是一种标记语法，允许你在 HTML 标记中嵌入服务器端 C# 代码，从而实现动态内容生成并与应用程序的数据进行无缝交互。它提供了一种简洁直观的方式来表达视图的表示逻辑，使其更易于维护和适应。\n\
    \n### Razor 语法的主要特点\n\n-   **@ 符号：** @ 符号是进入 Razor 视图中 C# 代码的入口。它表示 C# 表达式或代码块的开始。\n\
    -   **代码块：** 你可以在 { ... } 花括号中包含多行 C# 代码。\n-   **表达式：** 你可以使用 @(...) 语法直接将 C#\
    \ 表达式嵌入 HTML 标记中。表达式的值将在输出中呈现。\n-   **变量和数据访问：** 你可以使用 Model 属性或视图内定义的其他变量来访问从控制器传递的数据。\n\
    -   **控制流和循环：** Razor 支持 C# 控制流语句（例如 if、else、switch、for、foreach）和循环，允许你有条件地渲染内容或迭代集合。\n\
    -   **辅助器和标签辅助器：** Razor 提供了内置的 HTML 辅助器和标签辅助器，简化了常见任务，例如生成表单元素、链接和验证消息。\n\n###\
    \ 使用 Razor 制作视图\n\n让我们看一个简单的 Razor 视图示例，用于显示产品列表：\n\n```html\n@model IEnumerable<Product>\n\
    \n<h2>Products</h2>\n\n<ul>\n    @foreach (var product in Model)\n    {\n    \
    \    <li>@product.Name - $@product.Price</li>\n    }\n</ul>\n```\n\n在此视图中，`@model`\
    \ 指令指定了从控制器期望的数据类型（`IEnumerable<Product>` 集合）。`foreach` 循环遍历 `Model` 中的产品，并为每个产品呈现一个列表项，显示产品的名称和价格。\n\
    \n### 布局页和部分视图\n\nRazor 还支持布局页和部分视图，促进代码重用和模块化：\n\n-   **布局页：** 布局页为多个视图提供公共结构和共享元素，例如页眉、页脚和导航菜单。\n\
    -   **部分视图：** 部分视图封装可重用的标记部分，可以包含在多个视图中，减少冗余并提高可维护性。\n\n### 视图组件\n\n视图组件是自包含的\
    \ Razor 标记和代码单元，可以从视图或布局页中调用。它们适用于封装复杂的 UI 元素，或渲染需要超出标准视图所提供功能的额外逻辑的动态内容。\n\n\
    在本节中，我们探索了 ASP.NET Core 3 中视图和 Razor 语法的世界。我们学习了 Razor 如何通过将 HTML 标记与 C# 代码无缝融合，赋予我们创建动态和交互式用户界面的能力。我们还介绍了布局页、部分视图和视图组件，见证了它们如何促进视图中的代码重用和模块化。掌握了这些知识，你现在就能够制作引人入胜且用户友好的界面，让你的\
    \ Web 应用程序栩栩如生。在下一节中，我们将把重点转向使用 ASP.NET Core 3 构建第一个 Web 应用程序的实践方面，指导你\n"
