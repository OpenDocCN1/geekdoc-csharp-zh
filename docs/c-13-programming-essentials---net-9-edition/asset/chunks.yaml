    \ 是循环正在迭代的对象。例如，它可以是一个字符串或数值值组成的数组（关于集合的主题将在“在 C# 中创建 2D、3D 和交错数组” 章节中进行更详细的介绍）。\n\
    \n例如，考虑以下 `foreach` 循环结构：\n\n```csharp\nstring[] myColors = [\"red\", \"green\"\
    , \"yellow\", \"orange\", \"blue\"];\n\nforeach (string color in myColors)\n{\n\
    \    Console.WriteLine(\"{0} \", color);\n}\n```\n\n循环开始时，声明当前项将被赋值给命名为 `color`\
    \ 的常量。然后，我们告诉该语句它将遍历 `myColors` 集合中的所有元素。循环体向控制台面板发送消息，指示分配给 `color` 常量的当前值。\n\
    \n正如我们将在“在 C# 中创建 2D、3D 和交错数组” 章节中所看到的，`foreach` 循环在处理数组和字典等集合时特别有益。\n\n### 11.9\
    \ 知识测试\n\n点击下方链接或扫描二维码，以测试你对 C# 循环的知识和理解：\n\n[`www.answertopia.com/3xzv`](https://www.answertopia.com/3xzv)\n\
    \n![img](img/c_-for-loop.png)\n\n### 11.10 总结\n\n循环控制流是大多数编程语言中的一种基本特性，用于执行必须运行多次的任务。在本章中，我们涵盖了\
    \ C# 的 `for` 和 `foreach` 语句，以及如何利用它们来执行指定次数的任务。此外，我们还探索了嵌套循环，并解释了如何使用 `break`\
    \ 和 `continue` 语句来管理循环行为。\n\n## 12. 使用 do 和 while 语句进行 C# 循环\n\n在涵盖了使用 C# `for`\
    \ 语句构建循环的主题后，本章旨在介绍另外两种循环选项：`while` 和 `do ... while` 结构。\n\n上一节描述的 C# `for` 循环在预先知道程序中特定任务需要重复多少次时效果良好。然而，在某些情况下，代码需要重复执行直到满足特定条件，而无法得知需要重复多少次才能满足标准。虽然可以使用包含\
    \ `break` 语句的 `for` 循环来实现这一点，但 C# 提供了 `while` 循环这种更优的方案（这是 C# 从 C 编程语言中继承的又一种结构）。\n\
    \n### 12.1 C# while 循环\n\n本质上，`while` 循环会重复一组任务，直到满足特定条件。`while` 循环的语法定义如下：\n\n\
    ```csharp\nwhile (<condition>) {\n    // C# statements go here\n}\n```\n\n在上面的示例中，`<condition>`\
    \ 是一个返回 true 或 false 的表达式，而 `// C# statements go here` 注释表示在条件表达式持续求值为 true 时执行的\
    \ C# 代码。例如：\n\n```csharp\nint myCount = 0;\nwhile ( myCount < 100 ) {\n    myCount++;\n\
    }\nConsole.WriteLine($\"myCount = {myCount}\");\n```\n\n在上面的示例中，`while` 表达式将评估\
    \ `myCount` 变量是否小于 100。如果它已经大于 100，则括号中的代码将被跳过，循环退出且不执行任何任务。\n\n另一方面，如果 `myCount`\
    \ 不大于 100，则括号中的代码将被执行，循环返回 `while` 语句并重复对 `myCount` 进行评估。这个过程一直重复，直到 `myCount`\
    \ 的值超过 100，此时循环退出。\n\n### 12.2 C# do … while 循环\n\n将 `do … while` 循环视为反转的 `while`\
    \ 循环通常很有帮助。`while` 循环在执行循环体中的代码之前评估表达式。如果表达式在第一次检查时求值为 false，则代码不会执行。相反，`do …\
    \ while` 循环用于适用于情况，即你知道循环体中的代码始终需要至少执行一次。例如，你可能希望继续遍历数组中的项，直到找到特定的项。你知道你至少必须检查数组中的第一个项才有机会找到你需要的条目。`do\
    \ … while` 循环的语法如下：\n\n```csharp\ndo {\n    // C# statements here\n} while (<conditional\
    \ expression>);\n```\n\n在下方的 `do … while` 示例中，循环将持续到变量名为 `i` 的值等于 0：\n\n```csharp\n\
    int i = 10;\ndo {\n    i--;\n    Console.WriteLine($\"i = {i}\");\n} while (i\
    \ > 0);\n```\n\n### 12.3 退出循环\n\n与 `for` 循环一样，也可以通过 `break` 语句从 `while` 或 `do`\
    \ 循环中退出。\n\n### 12.4 continue 语句\n\n`continue` 语句会跳过循环中的剩余代码并返回到循环顶部。\n\n在下面的示例中，只有当\
    \ `i` 为偶数（即能被 2 整除无余数）时才会调用 `WriteLine()` 方法：\n\n```csharp\nint i = 1;\nwhile\
    \ (i < 20) {\n    i++;\n    if ((i % 2) != 0)\n        continue;\n    Console.WriteLine(\"\
    i = \" + i);\n}\n```\n\n上述示例中的 `continue` 语句会在 `i` 不能被 2 整除无余数时跳过 `WriteLine()`\
    \ 调用。如果触发了 `continue` 语句，执行将跳转到循环顶部（直到 `i` 超过 19）。\n\n### 12.5 知识测试\n\n点击下方链接或扫描二维码，以测试你对\
    \ C# do-while 循环的知识和理解：\n\n[`www.answertopia.com/3xzv`](https://www.answertopia.com/3xzv)\n\
    \n![img](img/c_-do-while.png)\n\n### 12.6 总结\n\nC# `do` 和 `while` 语句是强大的工具，用于重复执行任务直到满足特定条件，例如算运算达到结果或数据到达网络端口。独立使用时，`while`\
    \ 循环在执行第一次迭代之前检查是否满足条件，从而允许跳过整个循环。另一方面，`do ... while` 循环在你知道在满足条件之前至少需要执行循环代码时非常有用。两种循环都支持\
    \ `break` 和 `continue` 语句。\n\n## 13. C# 对象面向编程简介\n\n到目前为止，我们学习了 C# 编程的基础知识，例如变量类型和控制流。虽然使用这些技术可以编写功能性程序，但要成为一名熟练的\
    \ C# 程序员很多要做。C# 本质上是一种面向对象的编程语言，因此，任何 C# 程序员都被期望使用该语言创建面向对象的应用。\n\nC# 为开发面向对象的应用提供了广泛支持。本章将介绍面向对象编程的基本概念，并解释其与应用开发相关的概念。\n\
    \n### 13.1 什么是对象？\n\n对象是一个自包含的功能模块，可以作为软件应用程序的构建块被轻松使用和重复使用。\n"
