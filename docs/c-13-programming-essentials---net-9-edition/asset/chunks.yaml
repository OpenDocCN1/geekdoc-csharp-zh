    13.2 What is a class?


    A class is like a blueprint or an architect’s drawing that describes what an object
    will look like when it is created. It defines the methods that the object will
    have and the variables that it will contain. Essentially, a class determines the
    attributes and behavior of an object.


    13.3 Creating the ObjectDemo project


    Launch VS Code, and open your “C# Essentials” workspace folder. Press Cmd-Shift-P
    to display the Command Palette and select the .NET: New Project... command, as
