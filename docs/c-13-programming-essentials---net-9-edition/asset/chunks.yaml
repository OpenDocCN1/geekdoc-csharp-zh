    \ && motorTemp > 102)\n{\n\n}\n```\n\n## 23.6 使用 finally 块\n\n`finally` 块的作用是指定在\
    \ `try-catch` 语句结束之前执行的代码，它通常用于执行清理任务，例如：\n\n```csharp\ntry\n{\n    VoltageCheck(501);\n\
    }\ncatch (Exception ex)\n{\n    Console.WriteLine(exception.Message);\n}\nfinally\n\
    {\n    Console.WriteLine(\"Resetting system.\");\n}\n```\n\n## 23.7 使用 try-finally\
    \ 语句\n\n从之前的经验中，我们知道未处理的异常会导致运行中的应用程序崩溃，但尚未解释异常在哪里可以被捕获和处理。本章为止涵盖的示例暗示了异常必须在发生的地方使用\
    \ `try-catch 语句` 进行处理。然而，在实践中，情况并非如此。在详细探讨此主题之前，将运行中应用程序的执行路径视为方法调用的层次结构会有帮助，从代表顶层的\
    \ `Main()` 方法开始。\n\n考虑一种场景：`Main()` 方法调用 `Method A`，该方法转调用方法 `B` 和 `C`。`Method\
    \ C` 然后调用 `Method D`，依此类推。这种方法的调用层次结构被称为调用树或调用层次结构。以图表形式，我们的理论调用层次结构可能如下面的图 23-1\
    \ 所示：\n\n![img](img/method_hierarchy.png)\n\n图 23-1\n\n假设在 `Method D` 中抛出一个异常。该异常将沿着调用层次结构向上传播，直到异常被处理。如果异常在未被捕获的情况下到达\
    \ `Main()` 方法，应用程序将崩溃。这意味着即使异常是在 `Method D` 中抛出的，我们也可以在任何直接祖先方法中（包括 `Main()`）处理它，以防止应用程序崩溃。\n\
    \n为了亲身体验这一点，请在 `Main()` 和 `VoltageCheck()` 方法之间添加一个名为 `StartMotor()` 的中间方法，并移除\
    \ `try-catch` 语句：\n\n```csharp\nnamespace ExceptionDemo\n{\n    internal class\
    \ Program\n    {\n        static void Main(string[] args)\n        {\n       \
    \     StartMotor();\n        }\n        private static void StartMotor()\n   \
    \     {\n            VoltageCheck(501);\n            Console.WriteLine(\"Clean\
    \ up after check.\");\n        }\n        private static void VoltageCheck(int\
    \ voltage)\n        {\n            if (voltage > 500)\n            {\n       \
    \         throw new ArgumentOutOfRangeException(nameof(voltage),\n           \
    \     \"Voltage exceeds safety parameters.\");\n            }\n            else\n\
    \            {\n                Console.WriteLine(\"Safe Voltage\");\n       \
    \     }\n        }\n    }\n}\n```\n\n由于异常在三个方法中均未被捕获，应用程序在运行时将崩溃。然而，我们可以通过向 `VoltageCheck()`、`StartMotor()`\
    \ 或 `Main()` 添加 `try-catch` 语句来捕获该错误。对于此示例，在 `Main()` 方法内部使用 `try-catch` 语句调用\
    \ `StartMotor()`：\n\n```csharp\nstatic void Main(string[] args)\n{\n    try\n\
    \    {\n        StartMotor();\n    }\n    catch (Exception ex) {\n        Console.WriteLine(ex.Message);\n\
    \    }\n}\n```\n\n重新运行应用程序并确认异常已向上传播到 `Main()` 方法并被捕获和处理：\n\n`Voltage exceeds\
    \ safety parameters. (Parameter 'voltage')`\n\n注意，上述控制台输出没有在电压检查后执行清理操作。按照目前的实现，`StartMotor()`\
    \ 将无法感知电压检查抛出了异常，`StartMotor()` 中 `VoltageCheck()` 之后的任何代码都将被跳过，控制权将立即返回 `Main()`。然而，假设\
    \ `StartMotor` 需要无论是否抛出异常都在电压检查后执行清理。我们可以使用 `try-finally` 语句来实现这种行为：\n\n```csharp\n\
    private static void StartMotor()\n{\n    try\n    {\n        VoltageCheck(501);\n\
    \    }\n    finally\n    {\n        Console.WriteLine(\"Clean up whether or not\
    \ voltage is safe.\");\n    }\n}\n```\n\n再次编译并运行应用程序，验证即使在抛出异常也会执行清理：\n\n`Clean\
    \ up whether or not voltage is safe.`\n`Voltage exceeds safety parameters. (Parameter\
    \ 'voltage')`\n\n## 23.8 重新抛出异常\n\n有时异常需要在调用层次结构的多个层级上捕获。这是通过在捕获异常后重新抛出异常来实现的，以便它继续在层次结构中向上传递。如下所示，异常在\
    \ catch 体中使用 `throw` 语句进行重新抛出：\n\n```csharp\nstatic void Main(string[] args)\n\
    {\n    try\n    {\n        StartMotor();\n    }\n    catch (Exception ex) {\n\
    \        Console.WriteLine(\"Caught in Main() \" + ex.Message);\n    }\n}\n\n\
    private static void StartMotor()\n{\n    try\n    {\n        VoltageCheck(501);\n\
    \    }\n    catch (Exception ex)\n    {\n        Console.WriteLine(\"Caught in\
    \ StartMotor \" + ex.Message);\n        throw;\n    }\n    finally\n    {\n  \
    \      Console.WriteLine(\"Clean up whether or not voltage is safe.\");\n    }\n\
    }\n```\n\n运行应用程序并检查控制台，以验证重新抛出有效，且异常被两个方法捕获：\n\n`StartMotor(): Voltage exceeds\
    \ safety parameters. (Parameter 'voltage')`\n`Clean up whether or not voltage\
    \ is safe.`\n`Main(): Voltage exceeds safety parameters. (Parameter 'voltage')`\n\
    \n## 23.9 创建自定义类型\n\n到目前为止，本章使用了内置异常类型来演示如何抛出和捕获异常。然而，有时创建自定义异常比使用内置类型更有意义。自定义类型派生自\
    \ `Exception` 类，并且类型名称应以“Exception”结尾。下面的代码声明了一个自定义异常：\n\n```csharp\npublic class\
    \ HighVoltageException : Exception\n{\n    public HighVoltageException()\n   \
    \ {\n    }\n    public HighVoltageException(string message)\n    {\n        base(message);\n\
    \    }\n    public HighVoltageException(string message, Exception inner)\n   \
    \ {\n        base(message, inner);\n    }\n}\n```\n\n一旦声明，就可以如下抛出异常：\n\n`throw\
    \ new HighVoltageException(\"Voltage exceeds safety parameters.\");`\n\n`HighVoltageException`\
    \ 类型不包含属性，因此可以使用消息字符串创建实例：\n\n`throw new HighVoltageException(\"Voltage exceeds\
    \ safety parameters.\");`\n\n我们还可以扩展类型定义，以记录异常发生时的电压水平：\n\n```csharp\npublic class\
    \ HighVoltageException : Exception\n{\n    public int Volts;\n    public HighVoltageException()\n\
    \    {\n    }\n    public HighVoltageException(string message)\n    {\n      \
    \  base(message);\n    }\n    public HighVoltageException(string message, Exception\
    \ inner)\n    {\n        base(message, inner);\n    }\n    public HighVoltageException(string\
    \ message, int Volts)\n    {\n        base(message);\n        this.Volts = Volts;\n\
    \    }\n}\n```\n\n现在，`HighVoltageException` 实例可以使用消息字符串和触发异常的电压值创建：\n\n```csharp\n\
    private static void VoltageCheck(int voltage)\n{\n    if (voltage > 500)\n   \
    \ {\n        throw new HighVoltageException(\"Voltage exceeds safety parameters.\"\
    ,\n        voltage);\n    }\n    else\n    {\n        Console.WriteLine(\"Safe\
    \ Voltage\");\n    }\n}\n```\n\n异常属性可以像访问 `message` 属性一样在 catch 块内部访问。在下面的示例中，`Volts`\
    \ 属性包含在通知文本，并根据电压水平做出决策：\n\n```csharp\ntry\n{\n    StartMotor();\n}\ncatch (HighVoltageException\
    \ ex)\n{\n    Console.WriteLine(ex.Message);\n    Console.Write(\"Current voltage:\
    \ {ex.Volts}\");\n    if (ex.Volts < 510)\n    {\n        // 等待重试\n    }\n   \
    \ else\n    {\n        // 关键。关闭系统\n    }\n}\n```\n\n## 23.10 进行知识测试\n\n点击下方链接或扫描二维码测试你对\
    \ C# 异常处理的知识和理解：\n\n[`www.answertopia.com/hy8t`](https://www.answertopia.com/hy8t)\n\
    \n![img](img/c_-exceptions.png) \n\n## 23.11 总结\n\n"
- fmt: "\nException handling in C# ensures that programs deal with errors effectively\
    \ by allowing code to catch, handle, and respond to problems without crashing.\
    \ Exceptions are “thrown” when a method encounters an error that prevents it from\
    \ proceeding. Each exception has a specific type which provides information about\
    \ the nature of the error. In addition to predefined exception types like `ArgumentOutOfRangeException`,\
    \ custom exception types can be created when more specific error details are needed.\
    \ Throwing an exception stops the normal flow of execution and transfers control\
    \ to exception-handling code.\n\nExceptions are handled using `try-catch` blocks.\
    \ The code that may throw an exception is placed inside the `try` block, while\
    \ the `catch` block contains code to handle the exception if one is thrown. The\
    \ `catch` block can access details about the exception, and in cases where multiple\
    \ types of exceptions may occur, specific exception types can be handled separately\
    \ using filtering. The `finally` block can also be used to execute code, such\
    \ as cleaning up resources, whether or not an exception occurs.\n\n# 24. Asynchronous\
    \ Programming in C#\n\nAsynchronous programming allows software to execute multiple\
    \ tasks simultaneously. This means tasks like downloading images or processing\
    \ large amounts of data can be completed faster than if performed sequentially.\
    \ Multi-tasking also provides a smoother user experience by allowing time-consuming\
    \ operations to be performed in the background without impacting the app’s responsiveness.\n\
    \nIn this chapter, we will explore the asynchronous features of C# and explain\
    \ how they can be used to incorporate multi-tasking support into your projects.\n\
    \n## 24.1 An overview of threads\n\nThreads are a fundamental feature of modern\
    \ CPUs and are essential for multitasking in operating systems. While CPUs can\
    \ handle numerous threads, the actual number of threads that can run in parallel\
    \ at a given time is limited by the number of CPU cores, typically ranging from\
    \ 4 to 16 cores depending on the CPU model. When the number of threads exceeds\
    \ the available CPU cores, the operating system uses thread scheduling to determine\
    \ how these threads are shared among the available cores.\n\nThreads are like\
    \ small processes that run within a main process. They allow for the appearance\
    \ of parallel execution within applications and managing them directly in code\
    \ can be a complex and unpredictable process. The great thing about the asynchronous\
    \ features of C#, however, is that they use threads behind the scenes, handling\
    \ all the complexity for you.\n\n## 24.2 The main thread\n\nWhen an app is first\
    \ started, the runtime system will typically create a single thread in which the\
    \ app will run by default. Any code within an app that performs a time-consuming\
    \ task using the main thread will cause the entire application to appear to lock\
    \ up until the task is completed. This can be avoided by launching the tasks to\
    \ be performed in separate threads, allowing the main thread to continue unhindered\
    \ with other tasks.\n\n## 24.3 Asynchronous programming in C#\n\nAsynchronous\
    \ support in C# is provided by the `Task` Asynchronous Programming model (TAP),\
    \ which allows parallel execution to be performed safely and in a way that is\
    \ logical and easy to both write and understand. In other words, asynchronous\
    \ C# code is written sequentially from top to bottom in much the same way as synchronous,\
    \ making it easy to understand the logic flow.\n\nThis chapter introduces C# asynchronous\
    \ programming, providing in-depth coverage of key concepts and techniques for\
    \ efficient parallel execution.\n\n## 24.4 Creating the AsyncDemo project\n\n\
    Launch VS Code, open your “C# Essentials” workspace folder, and create a new .NET\
    \ Console App project named `AsyncDemo`.\n\n## 24.5 Synchronous code\n\nBefore\
    \ exploring asynchronous programming, we will first look at an example of synchronous\
    \ code execution. Begin by opening the `Program.cs` file and modifying it as follows:\n\
    \n```csharp\nnamespace AsyncDemo\n{\n    internal class Program\n    {\n     \
    \   static void Main(string[] args)\n        {\n        }\n        private static\
    \ string ProcessFile(string filename) {\n            Console.WriteLine($\"Start\
    \ {filename} at {DateTime.Now}\");\n            Task.Delay(6000).Wait();\n   \
    \         return filename;\n        }\n    }\n}\n```\n\nThe `ProcessFile()` method\
    \ outputs a starting timestamp before calling the `Task.Delay()` and `Wait()`\
    \ methods to simulate a 6-second file processing task that blocks the current\
    \ thread. After the delay, the method returns the name of the completed file.\n\
    \nNext, we want to call `ProcessFile()` multiple times from the `Main()` method.\
    \ In doing so, we will also output start timestamps and use the C# `Stopwatch`\
    \ diagnostic class to record the total execution time of the method calls:\n\n\
    ```csharp\nusing System.Diagnostics;\n\nnamespace AsyncDemo\n{\n    internal class\
    \ Program\n    {\n        static void Main(string[] args)\n        {\n       \
    \     Stopwatch stopwatch = Stopwatch.StartNew();\n            Console.WriteLine(\"\
    \\n=== Before async task calls ===\\n\");\n            string filename1 = ProcessFile(\"\
    file1.txt\");\n            Console.WriteLine($\"End {filename1} at {DateTime.Now}\\\
    n\");\n            string filename2 = ProcessFile(\"file2.txt\");\n          \
    \  Console.WriteLine($\"End {filename2} at {DateTime.Now}\\n\");\n           \
    \ string filename3 = ProcessFile(\"file3.txt\");\n            Console.WriteLine($\"\
    End {filename3} at {DateTime.Now}\\n\");\n            Console.WriteLine(\"===\
    \ After async tasks calls ===\\n\");\n            stopwatch.Stop();\n        \
    \    TimeSpan timeSpan = stopwatch.Elapsed;\n            Console.WriteLine($\"\
    Elapsed time: {timeSpan.Seconds} seconds\");\n        }\n    }\n}\n```\n\nRun\
    \ the app and check the console output resembles the following:\n\n```\nStart\
    \ file1.txt at 9/24/2024 1:05:04 PM\nEnd file1.txt at 9/24/2024 1:05:10 PM\nStart\
    \ file2.txt at 9/24/2024 1:05:10 PM\nEnd file2.txt at 9/24/2024 1:05:16 PM\nStart\
    \ file3.txt at 9/24/2024 1:05:16 PM\nEnd file3.txt at 9/24/2024 1:05:22 PM\nElapsed\
    \ time: 18 seconds\n```\n\nAs we can see from the above output, the three calls\
    \ to the `ProcessFile()` method were executed sequentially resulting in a combined\
    \ processing time of 18 seconds. Converting `ProcessFile()` to an asynchronous\
    \ method should reduce the total time to 6 seconds. Before we make this change,\
    \ however, we first need to introduce the `Task` class.\n\n## 24.6 Understanding\
    \ the C# Task class\n\nAsynchronous operations in C# are represented by `Task`\
    \ objects. As we saw earlier, we can directly call static `Task` methods such\
    \ as `Delay()`, for example:\n\n```csharp\nTask.Delay(6000);\n```\n\nThe above\
    \ code will start an asynchronous 6-second delay. In other words, although the\
    \ delay will be performed, it will occur in the background, and any subsequent\
    \ code after the call will execute immediately. To make the execution block the\
    \ current thread we called the `Wait()` method of the `Task` to prevent further\
    \ execution until after the delay:\n\n```csharp\nTask.Delay(6000).Wait();\n```\n\
    \nAs we will see in the remainder of this chapter, any asynchronous operation\
    \ that we initiate will have a `Task` object associated with it that will allow\
    \ us to manage the background execution.\n\n## 24.7 Declaring asynchronous methods\n\
    \nAsynchronous execution can be applied to methods, lambdas, and anonymous functions\
    \ and are declared using the `async` keyword and specifying a `Task` return type.\
    \ C# naming convention also recommends, but does not require, that the method\
    \ name ends in `Async`. Given these requirements, we can modify our `ProcessFile()`\
    \ method as follows:\n\n```csharp\nprivate static async Task<string> ProcessFile(string\
    \ filename)\n{\n    Console.WriteLine($\"Start {filename} at {DateTime.Now}\"\
    );\n    await Task.Delay(6000).Wait();\n    return filename;\n}\n```\n\nWe have\
    \ declared that the method is asynchronous and returns a `Task` object containing\
    \ a string result parameter (in this case the file name).\n\nNote that because\
    \ we are now working within an `async` method, we have switched from calling the\
    \ `Wait()` method of the `Task` object to using the `await` operator.\n\n## 24.8\
    \ Introducing the await operator\n"
