    \ meetingAppt = new(2024, 4, 9, 14, 30, 0);\n\nDateTime newAppt = meetingAppt.AddDays(5);\n\
    \nConsole.WriteLine(newAppt.ToString());\n\nOutput:\n\n4/14/2024 2:30:00 PM\n\n\
    To subtract from a date and time, pass through a negative value to the appropriate\
    \ method. For example, we can subtract ten months from our example object as follows:\n\
    \nDateTime meetingAppt = new(2024, 4, 9, 14, 30, 0);\n\nDateTime newAppt = meetingAppt.AddMonths(-10);\n\
    \nConsole.WriteLine(newAppt.ToString());\n\nOutput:\n\n6/9/2023 2:30:00 PM\n\n\
    32.5 Retrieving parts of a date and time\n\nDates and times comprise distinct\
    \ and separate values, namely the day, month, year, hours, minutes, seconds, and\
    \ milliseconds. The C# DateTime object stores each value as a separate property\
    \ within the object, allowing each to be accessed individually. For example, the\
    \ following code sample extracts each value and displays it in the console:\n\n\
    DateTime meetingAppt = new(2024, 4, 9, 14, 30, 0);\n\nConsole.WriteLine(meetingAppt.Day);\n\
    \nConsole.WriteLine(meetingAppt.Month);\n\nConsole.WriteLine(meetingAppt.Year);\n\
    \nConsole.WriteLine(meetingAppt.Hour);\n\nConsole.WriteLine(meetingAppt.Minute);\n\
    \nConsole.WriteLine(meetingAppt.Second);\n\nConsole.WriteLine(meetingAppt.Millisecond);\n\
    \nOutput:\n\n9\n\n4"
