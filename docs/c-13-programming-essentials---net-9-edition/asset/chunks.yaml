  trans: "\n位按或（OR）也会对两个二进制序列进行逐位比较。与按与（AND）操作不同，如果第一个操作数或第二个操作数中有一个 1，则或操作就会在结果中放置\
    \ 1。该运算符由单个竖线字符（`|`）表示。使用我们的示例数字，结果如下：\n\n```text\n10101011 OR\n00000011\n========\n\
    10101011\n```\n\n如果我们在 C# 示例中执行此操作，结果将为 171：\n\n```csharp\nint x = 171;\nint y\
    \ = 3;\nint z = x | y;\nConsole.WriteLine($\"Result is {z}\");\n```\n\n### 8.12.4\
    \ 位按异或\n\n位按异或（通常称为互斥或，由脱字符字符 `^` 表示）执行的任务与或操作相似，不同之处在于，如果两个数字中一个或另一个对应的位位置为 1，则在结果中放置\
    \ 1。如果两个位置均为 1 或均为 0，则结果中的相应位将设置为 0。例如：\n\n```text\n10101011 XOR\n00000011\n========\n\
    10101000\n```\n\n在这种情况下，结果为 10101000，转换为十进制为 168。为了验证这一点，我们可以再次尝试一些 C# 代码：\n\n\
    ```csharp\nint x = 171;\nint y = 3;\nint z = x ^ y;\nConsole.WriteLine($\"Result\
    \ is {z}\");\n```\n\n### 8.12.5 位左移\n\n位左移将二进制数中的每个位向左移动指定的位数。将一个整数向左移动一位的效果是该值翻倍。\n\
    \n随着位向左移动，空出的最右侧（低位）位置将填充 0。还要注意，一旦最左侧（高位）的位移出了包含该值的变量的大小范围，这些高位就会被丢弃：\n\n```text\n\
    10101011 Left Shift one bit\n========\n101010110\n```\n\n在 C# 中，位左移运算符由序列 `<<`\
    \ 表示，后面跟着要移动的位数。例如，向左移动 1 位：\n\n```csharp\nint x = 171;\nint z = x << 1;\nConsole.WriteLine($\"\
    Result is {z}\");\n```\n\n编译并执行上述代码后，将显示一条消息，说明结果为 342，这转换为二进制等同于 101010110。\n\
    \n### 8.12.6 位右移\n\n位右移正如你预期的那样，与左移相同，只是移动的方向相反。将一个整数向右移动一位的效果是该值减半。\n\n请注意，由于我们是在向右移动，无论使用什么存储结果的数据类型，都没有机会保留最低位。因此，低位会被丢弃。空出的高位位置是用\
    \ 0 还是 1 填充，取决于用于指示正负数的符号位是否被设置。\n\n```text\n10101011 Right Shift one bit\n========\n\
    01010101\n```\n\n位右移由字符序列 `>>` 后面跟移位计数表示：\n\n```csharp\nint x = 171;\nint z =\
    \ x >> 1;\nConsole.WriteLine($\"Result is {z}\");\n```\n\n执行上述代码时，将报告移位结果为 85，这等于二进制\
    \ 01010101。\n\n### 8.13 复合位运算符\n\n与算术运算符一样，每个位运算符都有一个对应的复合运算符，允许使用单个运算符完成操作和赋值：\n\
    \n| 运算符 | 描述 |\n| :--- | :--- |\n| `x &= y` | 对 x 和 y 执行位与操作并将结果赋值给 x |\n| `x\
    \ |= y` | 对 x 和 y 执行位或操作并将结果赋值给 x |\n| `x ^= y` | 对 x 和 y 执行位异或操作并将结果赋值给 x ||\n\
    | `x <<= n` | 将 x 向左移动 n 位并将结果赋值给 x |\n| `x >>= n` | 将 x 向右移动 n 位并将结果赋值给 x |\n\
    \n表 8-5\n\n### 8.14 知识测试\n\n点击下方的链接或扫描二维码来测试你对 C# 运算符和表达式的知识和理解：\n\n[`www.answertopia.com/qo99`](https://www.answertopia.com/qo99)\n\
    \n![img](img/c_-operators.png) \n\n### 8.15 总结\n\n在 C# 编程中，运算符和表达式用于处理和评估变量与常量。这可以简单到使用表达式中的加法运算符两个两个数字并将结果存储在变量中，也可以复杂的执行位操作。运算符有几类，我们在本章中涵盖了每种类型。\n\
    \n# 9. C# 条件控制流\n\n任何软件代码的基石都是控制流逻辑，它决定了哪些代码应该执行，哪些不应该执行。本章介绍了 C# 提供的条件控制流结构。\n\
    \n## 9.1 循环与条件控制流\n\n无论使用何种编程语言，应用开发都涉及逻辑。编程艺术很大程度上编写根据一个或多个标准做出决策的代码。这些决策决定了哪些代码被执行、执行频率，以及哪些代码在程序运行时被跳过。这通常被称为控制流，因为它控制了流。\n\
    \n## 9.2 使用 if 语句\n\nif 语句是 C# 提供的控制流选项中最基础的。if 语句的基本语法如下：\n\n```csharp\nif (boolean\
    \ expression) {\n    // 当表达式求为真时执行的 C# 代码\n}\n```\n\n## 9.3 使用 if … else … 语句\n\
    \nif 语句的另一种变体允许我们在 if 语句中的表达式评估为假时指定要执行的代码，使用如下语法：\n\n```csharp\nif (boolean expression)\
    \ {\n    // 当表达式为真时执行的代码\n} else {\n    // 当表达式为假时执行的代码\n}\n```\n\n## 9.4 使用 if\
    \ … else if … 语句\n\n到为止，我们查看了根据单个逻辑表达式结果做出决策的 if 语句。有时，必须根据多个不同的标准做出决策。为了这个目的，可以使用\
    \ if … else if … 结构，其语法如下：\n\n```csharp\nif (boolean expression) {\n```\n"
