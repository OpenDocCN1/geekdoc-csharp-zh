    \n![img](image/c_-lists.png) \n\n## 27.14 Summary\n\nC# Collection Classes provide\
    \ advanced mechanisms for grouping objects, with `List<T>` being a key class that\
    \ allows for dynamic resizing. Lists can be created, modified, and queried using\
    \ methods like `Add()`, `Remove()`, `Contains()`, and `IndexOf()`. Additionally,\
    \ lists can be sorted, cleared, and their properties like `Count` and `Capacity`\
    \ can be accessed to obtain information about the list content.\n\n## 28. C# Dictionary\
    \ Collections\n\nC# dictionaries allow data to be stored and managed as key-value\
    \ pairs. Dictionaries fulfill a similar purpose to arrays and lists, except each\
    \ item in a dictionary has a unique key.\n\n### 28.1 Creating the DictionaryDemo\n\
    \nLaunch VS Code, open your “C# Essentials” folder and create a .NET Console project\
    \ named DictionaryDemo. Once you have created the project, open `Program.cs` file\
    \ and use it to try out the examples in this chapter.\n\n### 28.2 Dictionary initialization\n\
    \nA dictionary is a data type designed to hold multiple values in a unordered\
    \ collection. Each item in a dictionary consists of a key and an associated value.\n\
    \nAn empty dictionary may be created using the following syntax:\n\n```csharp\n\
    Dictionary<key-type, value-type> name = new Dictionary<key-type, value-type>();\n\
    ```\n\nThe following code, for example, creates an empty dictionary using an `int`\
    \ for the key and a `string` for the values:\n\n```csharp\nDictionary<int, string>\
    \ movies = new Dictionary<int, string>();\n```\n\nAlternatively, you can use implicit\
    \ typing using the `var` keyword:\n\n```csharp\nvar movies = new Dictionary<int,\
    \ string>();\n```\n\nA new dictionary may be initialized with a collection of\
    \ values using a collection initializer with the following syntax (note that we\
    \ are once again using implicit typing):\n\n```csharp\nvar name = new Dictionary<key-type,\
    \ value-type>()\n{\n    { key1, value1 },\n    { key2, value2 },\n    { key3,\
    \ value3 }\n};\n```\n\nThe following code creates a new dictionary initialized\
    \ with key-value pairs in the form of strings acting as keys for corresponding\
    \ movie titles:\n\n```csharp\nvar movies = new Dictionary<string, string>()\n\
    {\n    { \"DRA-1212\", \"The Godfather\" },\n    { \"WAR-4433\", \"Apocalypse\
    \ Now\" },\n    { \"COM-5465\", \"The Terminal\" },\n    { \"CLA-1659\", \"Casablanca\"\
    \ }\n};\n```\n\nIn the above instance, the C# compiler will use implicit typing\
    \ to decide that both the key and value elements of the dictionary are of string\
    \ and prevent values or keys of other types from being inserted into the dictionary.\n\
    \n### 28.3 Dictionary item count\n\nA count of the items in a dictionary can be\
    \ obtained by accessing the dictionary’s `Count` property:\n\n```csharp\nvar movies\
    \ = new Dictionary<string, string>()\n{\n    { \"DRA-1212\", \"The Godfather\"\
    \ },\n    { \"WAR-4433\", \"Apocalypse Now\" },\n    { \"COM-5465\", \"The Terminal\"\
    \ },\n    { \"CLA-1659\", \"Casablanca\" }\n};\n\nConsole.WriteLine($\"Count =\
    \ {movies.Count}\");\n```\nOutput:\nCount = 4\n\n### 28.4 Dictionary iteration\n\
    \nAs with arrays and lists, you can iterate through all entries in a dictionary\
    \ using `foreach` looping syntax. The following code, for example, iterates through\
    \ all of the entries in the movies dictionary, outputting both the key and value\
    \ for each entry:\n\n```csharp\nforeach (var entry in movies)\n{\n    Console.WriteLine($\"\
    {entry.Key}: {entry.Value}\");\n}\n```\n"
