    \ `ref` 修饰符通过引用传递变量，如下所示：\n\n```csharp\n// Demo.cs\npublic class Demo {\n    //\
    \ ...\n    public void DoSomething(ref int myVar) {\n        myVar = 10;\n   \
    \ }\n}\n```\n\n```csharp\n// Program.cs\nConsole.WriteLine($\"Before method call\
    \ myVar = {myVar}\");\ndemo.DoSomething(ref myVar);\nConsole.WriteLine($\"After\
    \ method call myVar = {myVar}\");\n```\n\n运行应用程序的输出显示，在方法调用后，赋值给 `myVar` 的值从 20\
    \ 变为 10：\n\nBefore method call myVar = 20\nAfter method call myVar = 10\n\n调用方法时的另一个可用修改符是\
    \ `out` 关键字。使用 `ref` 修饰符时，方法内部是否更改变量值是可选的。若要强制在方法内部更改变量，请使用 `out` 修饰符代替 `ref`。\n\
    \n`out` 修饰符通常用于在变量传递传递时为 null 时，强制方法初始化该变量。例如：\n\n```csharp\n// Demo.cs\n// ...\n\
    public void DoSomething(out string myVar) {\n    myVar = \"Hello\";\n}\n```\n\n\
    ```csharp\n// Program.cs\nstring myVar;\nDemo demo = new();\ndemo.DoSomething(out\
    \ myVar);\nConsole.WriteLine($\"After method call myVar = {myVar}\");\n```\n\n\
    最后一个介绍的修饰符是 `in` 修饰符。该修饰符同样通过引用将变量发送到方法，但防止从方法内部更改该引用。例如，下面的代码更改将产生语法错误，因为 `myVar`\
    \ 现在是一个只读变量：\n\n```csharp\n// Demo.cs\n// ...\npublic void DoSomething(in string\
