  trans: "\n\n# 16.4 传递多个参数\n\n我们早期的 lambda 示例只使用了一个输入参数。如果你需要向 lambda 传递多个参数，可以通过将它们封装在括号\
    \ `()` 中来实现。例如：\n\n```csharp\ndelegate string MultiLambda(string s, int i, double\
    \ d);\n\nstatic void Main(string[] args)\n{\n    MultiLambda sample = (s, i, d)\
    \ => $\"Product = {s}, Count = {i}, Price = ${d}\" ;\n    Console.WriteLine(sample(\"\
    HDMI Cable\", 5, 20.99));\n}\n```\n\n当程序运行时，产品属性将如下所示显示：\n\nProduct = HDMI Cable,\
    \ Count = 5, Price = $20.99\n\n# 16.5 不传递参数\n\n另一种方法，不接受任何参数的 lambda 使用空括号声明：\n\
    \n```csharp\ndelegate string SayHello();\n\nstatic void Main(string[] args)\n\
    {\n    SayHello hello = () => \"Hello\";\n    Console.WriteLine(hello());\n}\n\
    ```\n\n# 16.6 本地函数\n\n本地函数在许多方面与 lambda 表达式相似，但也有一些重要的区别。本地函数是在其他方法内部声明的命名方法。与私有方法一样，本地函数在包含方法的作用范围之外无法访问，且不需要赋值给委托变量。\n\
    \n本地函数的声明方式与任何其他 C# 方法相同。例如，以下是我们的 `StringConverter` lambda 的本地函数等效写法：\n\n```csharp\n\
    string converter(string s)\n{\n    return s.ToLower();\n}\n```\n\n由于 `converter`\
    \ 函数只包含一个表达式，我们可以使用 `=>` 运算符简化该语句：\n\n```csharp\nstring converter(string s) =>\
    \ s.ToLower();\n```\n\n与匿名方法和 lambda 不同，本地函数可以直接访问包含它的方法的作用范围内的局部变量和值。\n\n# 16.7\
    \ 创建 LocalFunctions 项目\n\n为了尝试本地函数，请在 VS Code 中创建一个新的 .NET 控制台应用程序项目，并将其命名为 `LocalFunctions`。项目创建后，编辑\
    \ `Program.cs` 文件，使其内容如下：\n\n```csharp\nnamespace LocalFunctions\n{\n    internal\
    \ class Program\n    {\n        static void Main(string[] args)\n        {\n \
    \           ConvertToEuros(10.00);\n        }\n\n        private static void ConvertToEuros(double\
    \ value)\n        {\n            var exchangeRate = 0.5;\n            double USDToEuro(double\
    \ dollars) => exchangeRate * dollars;\n            var result = USDToEuro(value);\n\
    \            Console.WriteLine(result);\n        }\n    }\n}\n```\n\n`ConvertToEuros()`\
    \ 方法接受一个美元金额并返回相应的欧元金额。在此方法内部，我们声明了一个名为 `USDToEuro()` 的本地函数，它将美元参数值乘以局部 `exchangeRate`\
    \ 变量并返回结果：\n\n```csharp\ndouble USDToEuro(double dollars) => exchangeRate * dollars;\n\
    ```\n\n此示例中需要注意的关键点是，本地函数可以同时访问值参数和局部 `exchangeRate` 变量，而这两者在 lambda 表达式中都是无法直接访问的。\n\
    \n# 16.8 递归本地函数\n\n本地函数也可以递归调用（换句话说，本地函数可以直接或间接地调用自己）。计算数字的阶乘是递归的一个经典示例。以下代码声明了一个名为\
    \ `FindFactorial()` 的方法，其中包含一个名为 `Factorial()` 的本地函数，该函数通过递归调用自己来识别数字的阶乘：\n\n\
    ```csharp\nprivate static int FindFactorial(int value)\n{\n    int Factorial(int\
    \ number)\n    {\n        // 基础情况\n        if (number == 0)\n        {\n     \
    \       return 1;\n        }\n        // 递归情况\n        return number * Factorial(number\
    \ - 1);\n    }\n    return Factorial(value);\n}\n```\n\n将上述方法添加到 `Program.cs`\
    \ 文件并在 `Main()` 方法中如下调用它：\n\n```csharp\nstatic void Main(string[] args)\n{\n \
    \   for (int i=1; i<10; i++)\n    {\n        var factorial = FindFactorial(i);\n\
    \        Console.WriteLine($\"{i}! = {factorial}\");\n    }\n}\n```\n\n当程序运行时，它将生成以下输出：\n\
    \n1! = 1\n2! = 2\n3! = 6\n4! = 24\n5! = 120\n6! = 720\n7! = 5040\n8! = 40320\n\
    9! = 362880\n\n# 16.9 Lambda 对比本地函数\n\n通常情况下，在 lambda 和本地函数之间进行选择取决于个人的编码风格，尽管使用本地函数有一些优势，例如直接访问局部变量和递归。本地函数被认为比\
    \ lambda 更高效，因为它们不需要分配委托。\n\n值得注意的是当在 VS Code 中编写 lambda 时，编辑器通常会建议将其转换为本地函数，这暗示了微软对此问题的观点：\n\
    \n![img](img/local_function_recommendation.png)\n\n图 16-1\n\n# 16.10 知识测试\n\n\
    点击下方链接或扫描二维码以测试你对 C# 本地函数和 lambda 的知识与理解：\n\n[`www.answertopia.com/v233`](https://www.answertopia.com/v233)\n\
    \n![img](img/c_-methods.png) \n\n# 16.11 总结\n\n本章探讨了匿名方法、lambda 和本地函数如何让你编写简洁且可重用的\
    \ C# 代码，这些代码可以在方法之间传递。lambda 产生的代码比匿名方法更简洁，而本地函数具有简洁性、直接访问局部变量和递归的优势。\n\n# 17.\
    \ C# 继承\n\n在“C# 面向对象编程导引”中，我们涵盖了面向对象编程的基本概念，并并通过了一个使用 C# 创建新类的示例。在那个示例中，我们的新类并没有显式派自基类（尽管所有的\
    \ C# 类最终都派自 `System.Object`）。本章将深入探讨 C# 中的继承和子类概念。\n\n## 17.1 什么是继承？\n\n继承的概念为编程引入了现实世界的视角。它允许定义一个类的特征，然后让其他类派自该类。派生类继承父类的所有特征，并添加自己的特征。\n\
    \n通过派生类，我们创建了通常被称为类层次结构。层次结构顶端的类被称为基类，派生类被称为子类。任意数量的类都可以派自类。然而，一个派生类只能继承一个类。因此，C#\
    \ 是一种单继承语言。类并不非要派自基类。例如，子类也可以从另一个子类继承。\n\n## 17.2 C# 继承示例\n\n与大多数编程概念一样，C# 中的继承主题通过示例说明最好。在“C#\
    \ 面向对象编程导引”章节中，我们创建了一个包含 `BankAccount` 类的 `ObjectDemo` 项目。我们将使用这个示例来演示 C# 继承。\n\
    \n启动 VS Code，打开你的 C# 工作空间文件夹并使用资源管理器找到 `ObjectDemo` 项目中的 `BankAccount.cs` 文件，如下方的图\
    \ 17-1 所示：\n\n![img](img/inheritance_file_in.png)\n\n图 17-1\n\n项目加载到 VS Code 后，编辑\
    \ `BankAccount.cs` 文件并为类添加额外的字段和属性以存储账户余额：\n\n```csharp\nnamespace ObjectDemo;\n\
    \npublic class BankAccount\n{\n    private string _accountName;\n    private int\
    \ _accountNumber;\n    private double _accountBalance;\n\n    public BankAccount(string\
    \ accountName, int accountNumber ,\n    double accountBalance )\n    {\n     \
    \   _accountName = accountName;\n        _accountNumber = accountNumber;\n   \
    \     _accountBalance = accountBalance;\n    }\n\n    public double AccountBalance\n\
    \    {\n        get => _accountBalance;\n        set => _accountBalance = value;\n\
    \    }\n\n    public void DisplayName()\n    {\n        Console.WriteLine($\"\
    Customer name is {AccountName}\");\n    }\n}\n```\n\n"
- fmt: "\nThis class does an excellent job of defining characteristics common to any\
    \ type of bank account, such as account holder name, account number, and current\
    \ balance. Imagine, however, that our banking program needs to support several\
    \ specific types of bank accounts. For example, the bank might offer its customers\
    \ an interest-bearing savings account. A savings account will have all the characteristics\
    \ of our `BankAccount` class but would also need a way to store the prevailing\
    \ interest rate. One option would be to create a brand new class from the ground\
    \ up called `SavingsAccount`, which duplicates everything we have in our `BankAccount`\
    \ class, plus extra members needed for a savings account. An alternative and more\
    \ efficient method is to derive a `SavingsAccount` class from the `BankAccount`\
    \ class and then add the extra functionality into this subclass.\n\n### 17.3 Creating\
    \ a subclass in C#\n\nNow that we have ascertained that we need to create a subclass\
    \ of our `BankAccount` class, we can look at how to achieve this. Subclasses are\
    \ declared the same way as any other class, except that the class name is followed\
    \ by a colon (`:`) and the name of the class from which it is to inherit.\n\n\
    With this in mind we can begin by using the Solution Explorer to add a new Class\
    \ file to the project.\n\nUsing the Solution Explorer, hover the mouse pointer\
    \ over the `ObjectDemo` project entry and click the new file button. In the file\
    \ template palette, select the `Class` entry and name the new class `SavingsAccount`\
    \ before pressing the Enter key to create the file. When the new file loads into\
    \ the editor, modify the class declaration to subclass from `BankAccount`:\n\n\
    ```csharp\nnamespace ObjectDemo;\n\npublic class SavingsAccount : BankAccount\n\
    \n{\n\n}\n```\n\nWe have now created a subclass of `BankAccount` called `SavingsAccount`,\
    \ but at this point, the `SavingsAccount` class is no different than its parent\
    \ class. Next, we need to add a constructor and some new members to add the behavior\
    \ we need:\n\n```csharp\npublic class SavingsAccount : BankAccount\n{\n\n    private\
    \ double _interestRate;\n\n    public SavingsAccount(string accountName, int accountNumber,\n\
    \    double accountBalance, double interestRate)\n    : base(accountName, accountNumber,\
    \ accountBalance)\n    {\n        _interestRate = interestRate;\n    }\n\n   \
    \ public double InterestRate\n    {\n        get => _interestRate;\n        set\
    \ => _interestRate = value;\n    }\n\n    public double MonthlyInterest()\n  \
    \  {\n        return (_interestRate * AccountBalance) / 12;\n    }\n}\n```\n\n\
    We now have a new class called `SavingsAccount`, which inherits all the members\
    \ of the `BankAccount` class and adds some members of its own. In particular,\
    \ we have added a new data member called `InterestRate`, which will store the\
    \ interest rate paid on the account together with a new method to calculate the\
    \ monthly interest.\n\n### 17.4 Passing arguments to the base class constructor\n\
    \nOf particular significance is the constructor in the `SavingsAccount` declaration.\
    \ In the `BankAccount` base class, we have a constructor that accepts account\
    \ name, number, and balance parameters. In the `SavingsAccount` subclass, we must\
    \ also accept the interest rate value. The `: base()` code instructs C# to handle\
    \ the name, number, and balance parameters using the constructor from the base\
    \ `BankAccount` class, leaving the interest rate for the `SavingsAccount` constructor:\n\
    \n```csharp\npublic SavingsAccount(string accountName, int accountNumber,\ndouble\
    \ accountBalance, double interestRate)\n: base(accountName, accountNumber, accountBalance)\n\
    ```\n\nWith our `SavingsAccount` subclass complete, we can use it in our project.\
    \ Edit the `Program.cs` file and modify it as follows:\n\n```csharp\nusing ObjectDemo;\n\
    \nSavingsAccount account = new(accountName: \"John Smith\", accountNumber: 12312,\
    \ accountBalance: 1000.99, interestRate: 0.05);\n\nConsole.WriteLine($\"Interest\
    \ earned this month = { account.MonthlyInterest()}\");\n\naccount.DisplayName();\n\
    ```\n\nWhen it runs, the app will display the following output in the console:\n\
    \nInterest earned this month = 4.17079166666667\nCustomer name is John Smith\n\
    \n### 17.5 Overriding inherited methods\n\nWhen using inheritance, it is not unusual\
    \ to find a method in the parent class that almost does what you need but requires\
    \ modification to provide the precise functionality you require. One option in\
    \ this scenario would be to ignore the inherited method and write a new method\
    \ with an entirely new name. A better option is to `override` the inherited method\
    \ and write a new version in the subclass.\n\nBefore proceeding with an example,\
    \ three rules must be obeyed when overriding a method:\n\n1. The overriding method\
    \ in the subclass must take the same number and types of parameters as the overridden\
    \ method in the parent class.\n2. The new method must have the same return type\
    \ as the parent method.\n3. The method declaration in the base class must be declared\
    \ using `virtual`, `abstract`, or `override` modifiers.\n\nThe topics of abstract\
    \ and virtual class members will be covered in the next chapter.\n\nIn our `BankAccount`\
    \ class, we have a method named `DisplayName()`, which displays the account holder’s\
    \ name. In our `SavingsAccount` subclass, we might also want to output the current\
    \ interest rate assigned to the account. To achieve this, the first step is to\
    \ declare the method in the `BankAccount` class as being `virtual`:\n\n```csharp\n\
    public class BankAccount\n{\n// ... existing code ...\n    virtual public void\
    \ DisplayName()\n    {\n        Console.WriteLine($\"Customer name is {AccountName}\"\
    );\n    }\n// ... existing code ...\n}\n```\n\nNext, we declare a new version\
    \ of the `DisplayBalance()` method in our `SavingsAccount` subclass, prefixed\
    \ with the `override` modifier:\n\n```csharp\npublic class SavingsAccount : BankAccount\n\
    {\n// ... existing code ...\n    public override void DisplayName()\n    {\n \
    \       Console.WriteLine($\"Customer name is {AccountName}\");\n        Console.WriteLine($\"\
    Account is earning {InterestRate}%\");\n    }\n}\n```\n\nNow, when we call the\
    \ `DisplayName()` method on an instance of `SavingsAccount`, we get information\
    \ about the interest rate:\n\nInterest earned this month = 4.17079166666667\n\
    Customer name is John Smith\nAccount is earning 0.05%\n\nIt is also possible to\
    \ call the overridden method in the base class from within a subclass. For example,\
    \ the `DisplayName()` method of the base class could be called to display the\
    \ account holder’s name before the interest rate is displayed, thereby eliminating\
    \ code duplication. Using dot notation, we can call the method on `base` object\
    \ as follows:\n\n```csharp\npublic override void DisplayName()\n{\n    base.DisplayName();\n\
    \    Console.WriteLine($\"Account is earning {InterestRate}%\");\n}\n```\n\n###\
    \ 17.6 Take the knowledge test\n\nClick the link below or scan the QR code to\
    \ test your knowledge and understanding of C# inheritance:\n\n[https://www.answertopia.com/mdqq](https://www.answertopia.com/mdqq)\n\
    \n![img](image/c_-inheritance.png)\n\n### 17.7 Summary\n\nIn C#, inheritance is\
    \ a programming concept that allows new classes to be created from existing classes\
    \ and extended to add new functionality. This means that when an existing class\
    \ provides some, but not all, of the functionality required by a programmer, that\
    \ class can be used as the basis for a new subclass. By doing so, the new subclass\
    \ will inherit all the parent class’s capabilities and can be extended further.\n\
    \n# 18 C# Abstract Classes\n\nIn the preceding chapters, we have examined object-oriented\
    \ programming in C# and the concept of class inheritance. This chapter will introduce\
    \ abstract classes.\n\n## 18.1 What is a C# abstract class?\n\nIn the examples\
    \ we have looked at so far in this book, we have created classes that could be\
    \ both instantiated as objects and used as a base class from which to derive classes.\
    \ Often, a base class is not intended to be instantiated and is provided solely\
    \ as an outline or template for subclasses. Such a class is known as an abstract\
    \ class.\n\n## 18.2 Abstract members\n"
