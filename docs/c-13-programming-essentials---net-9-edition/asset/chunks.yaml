  trans: "\n该类非常出色地定义了任何银行账户共有的特征，例如账户持有人姓名、账户号码和当前余额。然而，假设我们的银行程序需要支持几种特定类型的银行账户。例如，银行可能会为客户提供一种有息的储蓄账户。储蓄账户将拥有我们的\
    \ `BankAccount` 类的所有特征，但还需要一种存储当前利率的方法。一种方案是从零开始创建一个名为 `SavingsAccount` 的全新新类，这会复制我们在\
    \ `BankAccount` 类中的所有内容，并加上储蓄账户所需的额外成员。另一种更高效的方法是从 `BankAccount` 类派生出一个 `SavingsAccount`\
    \ 类，然后向此子类中添加额外功能。\n\n### 17.3 在 C# 中创建子类\n\n现在我们已经确定需要为我们的 `BankAccount` 类创建一个子类，我们就可以查看如何实现这一目标。子类的声明方式与其他任何类相同，区别在于类名后面紧跟一个冒号（`:`）以及它要继承的基类名。\n\
    \n考虑到这一点，我们可以开始使用解决方案管理器（Solution Explorer）向项目添加一个新的类文件。\n\n使用解决方案管理器，将鼠标指针悬停在\
    \ `ObjectDemo` 项目条目上，并点击新建文件按钮。在文件模板调板中，选择 `Class` 条目，并在按下回车键创建文件之前将新类命名为 `SavingsAccount`。当新文件加载到编辑器时，修改类声明以继承自\
    \ `BankAccount`：\n\n```csharp\nnamespace ObjectDemo;\n\npublic class SavingsAccount\
    \ : BankAccount\n\n{\n\n}\n```\n\n我们现在创建了一个名为 `SavingsAccount` 的 `BankAccount`\
    \ 子类，但在此时，`SavingsAccount` 类与它的父类并没有区别。接，，我们需要添加一个构造函数和一些新成员来添加我们所需的行为：\n\n```csharp\n\
    public class SavingsAccount : BankAccount\n{\n\n    private double _interestRate;\n\
    \n    public SavingsAccount(string accountName, int accountNumber,\n    double\
    \ accountBalance, double interestRate)\n    : base(accountName, accountNumber,\
    \ accountBalance)\n    {\n        _interestRate = interestRate;\n    }\n\n   \
    \ public double InterestRate\n    {\n        get => _interestRate;\n        set\
    \ => _interestRate = value;\n    }\n\n    public double MonthlyInterest()\n  \
    \  {\n        return (_interestRate * AccountBalance) / 12;\n    }\n}\n```\n\n\
    我们现在有一个名为 `SavingsAccount` 的新类，它继承了 `BankAccount` 类的所有成员，并添加了一些它自己的成员。特别是，我们添加了一个名为\
    \ `InterestRate` 的新数据成员，它将存储账户支付的利率，以及一个计算每月利息的新方法。\n\n### 17.4 向基类构造函数传递参数\n\n\
    具有特别重要意义的是 `SavingsAccount` 声明中的构造函数。在 `BankAccount` 基类中，我们有一个接受账户名称、编号和余额参数的构造函数。在\
    \ `SavingsAccount` 子类中，我们也必须接受利率值。`: base()` 代码指示 C# 使用基类 `BankAccount` 的构造函数来处理名称、编号和余额参数，将利率留给\
    \ `SavingsAccount` 构造函数：\n\n```csharp\npublic SavingsAccount(string accountName,\
    \ int accountNumber,\ndouble accountBalance, double interestRate)\n: base(accountName,\
    \ accountNumber, accountBalance)\n```\n\n完成 `SavingsAccount` 子类后，我们就可以在项目中使用它。编辑\
    \ `Program.cs` 文件并按如下方式修改：\n\n```csharp\nusing ObjectDemo;\n\nSavingsAccount account\
    \ = new(accountName: \"John Smith\", accountNumber: 12312, accountBalance: 1000.99,\
    \ interestRate: 0.05);\n\nConsole.WriteLine($\"Interest earned this month = {\
    \ account.MonthlyInterest()}\");\n\naccount.DisplayName();\n```\n\n运行时，应用程序将在控制台中显示以下输出：\n\
    \nInterest earned this month = 4.17079166666667\nCustomer name is John Smith\n\
    \n### 17.5 重写继承的方法\n\n在使用继承时，发现一个一个几乎可以实现你的需求但需要修改以提供你所要求的精确功能的父类方法并不稀奇。在这种情况下，一种方案是忽略被继承的方法并编写一个具有完全新名称的方法。更好的选择是\
    \ `override` 被继承的方法，并在子类中编写一个新版本。\n\n在继续示例之前，重写方法时必须遵守三条规则：\n\n1. 子类中的重写方法 get\
    \ 参数的数量和类型必须与父类中的被重写方法相同。\n2. 新方法必须与父方法具有相同的返回类型。\n3. 基类中的方法声明必须使用 `virtual`、`abstract`\
    \ 或 `override` 修饰符声明。\n\n抽象和虚类成员的主题将在下一章介绍。\n\n在我们的 `BankAccount` 类中，我们有一个名为 `DisplayName()`\
    \ 的方法，用于显示账户持有人的姓名。在我们的 `SavingsAccount` 子类中，我们可能还想输出分配给账户的当前利率。为了实现这一点，第一步是在\
    \ `BankAccount` 类中将方法声明为 `virtual`：\n\n```csharp\npublic class BankAccount\n{\n\
    // ... existing code ...\n    virtual public void DisplayName()\n    {\n     \
    \   Console.WriteLine($\"Customer name is {AccountName}\");\n    }\n// ... existing\
    \ code ...\n}\n```\n\n接下来，我们在 `SavingsAccount` 子类中声明 `DisplayBalance()` 方法的新版本，并带有\
    \ `override` 前缀：\n\n```csharp\npublic class SavingsAccount : BankAccount\n{\n\
    // ... existing code ...\n    public override void DisplayName()\n    {\n    \
    \    Console.WriteLine($\"Customer name is {AccountName}\");\n        Console.WriteLine($\"\
    Account is earning {InterestRate}%\");\n    }\n}\n```\n\n当我们对 `SavingsAccount`\
    \ 实例调用 `DisplayName()` 方法时，我们将获得利率信息：\n\nInterest earned this month = 4.17079166666667\n\
    Customer name is John Smith\nAccount is earning 0.05%\n\n也可以在子类内部调用基类中的重写方法。例如，可以调用基类的\
    \ `DisplayName()` 方法来显示账户持有人的姓名，从而消除代码重复。使用点符号，我们可以这样调用 `base` 对象的方法：\n\n```csharp\n\
    public override void DisplayName()\n{\n    base.DisplayName();\n    Console.WriteLine($\"\
    Account is earning {InterestRate}%\");\n}\n```\n\n### 17.6 完成知识测试\n\n点击下方链接或扫描二维码测试你对继承的理解：\n\
    \n[`www.answertopia.com/mdqq`](https://www.answertopia.com/mdqq)\n\n![img](img/c_-inheritance.png)\n\
    \n### 17.7 总结\n\n在 C# 中，继承是一种编程概念，允许从现有类创建新类并扩展以新功能。这意味着当现有类提供了部分而非全部所需的功能时，该类可以作为创建新子类的基础。这样做，新子类将继承父类的所有功能，并可以进一步扩展。\n\
    \n# 18 C# 抽象类\n\n在前面的章节中，我们研究了 C# 中的面向对象编程和类继承。本章将介绍抽象类。\n\n## 18.1 什么是 C# 抽象类？\n\
    \n在本书为止的示例中，我们创建了既可以实例化为对象，也可以作为派生类的基类的类。通常，基类并不打算被实例化，仅作为子类的大纲或模板提供。此类类被称为抽象类。\n\
    \n## 18.2 抽象成员\n"
- fmt: "\nA C# `abstract class` contains abstract members, which define what a subclass\
    \ must contain. These abstract members declare that a member of a particular type\
    \ is required; it does not implement the member. Implementation of abstract members\
    \ takes place within the derived class. A subclass that derives from an abstract\
    \ class and fails to implement abstract methods will generate syntax errors.\n\
    \n### 18.3 Declaring a C# abstract class\n\nIn addition to using the `class` modifier,\
    \ as we have seen in previous examples, abstract classes must also be declared\
    \ using the `abstract` modifier:\n\n```csharp\npublic abstract class Talk {\n\n\
    }\n```\n\nAbstract class member methods and properties are also declared using\
    \ the `abstract` keyword. For example, to declare an abstract method in our `Talk`\
    \ class, the following code is required:\n\n```csharp\npublic abstract class Talk\
    \ {\n    public abstract void Speak();\n}\n```\n\nWe now have an abstract class\
    \ with an abstract method named `Speak()`. Note that this declaration only states\
    \ that any class derived from the `Talk` base class must implement a method called\
    \ `Speak()` which returns no value (i.e., it is declared as `void`) and has no\
    \ parameters. It does not, however, implement the method.\n\n### 18.4 Deriving\
    \ from an abstract class\n\nTo subclass from an abstract class, we write code\
    \ as follows:\n\n```csharp\npublic class SayHello : Talk {\n\n}\n```\n\nWe now\
    \ have a class named `SayHello`, which is derived from the abstract `Talk` class.\
    \ The next step is to implement the abstract `Speak()` method. When implementing\
    \ abstract members in a derived class, the `override` modifier must be used. For\
    \ example:\n\n```csharp\npublic override void Speak() {\n    Console.WriteLine(\"\
    Hello!\");\n}\n```\n\nWe now have a subclass derived from the `Talk` abstract\
    \ class, which implements the abstract `Speak()` method.\n\n### 18.5 Creating\
    \ the AbstractClassDemo project\n\nWith the basics of abstract classes covered,\
    \ we can put this knowledge to use in an example project. Begin by creating a\
    \ new .NET Console App project in VS Code named `AbstractClassDemo`.\n\nUsing\
    \ the Solution Explorer, add a new `Class` to the `AbstractClassDemo` project\
    \ named `Talk`.\n\nEdit the `Talk.cs` file to declare the `Talk` class as abstract\
    \ and to add the abstract `Speak()` method as follows:\n\n```csharp\nnamespace\
    \ AbstractClassDemo;\n\npublic abstract class Talk\n{\n    public abstract void\
    \ Speak();\n}\n```\n\nNext, we need to add the second class which will be subclassed\
    \ from the `Talk` class. Repeat the above steps to add a class file to the project,\
    \ this time naming the file `SayHello.cs`. Once the file has been added, make\
    \ the following changes to subclass from `Talk` and implement the `Speak()` method:\n\
    \n```csharp\nnamespace AbstractClassDemo\n{\n    internal class SayHello : Talk\n\
    \    {\n        public override void Speak()\n        {\n            Console.WriteLine(\"\
    Hello!\");\n        }\n    }\n}\n```\n\nFinally, modify the `Program.cs` file\
    \ to use the new classes:\n\n```csharp\nusing AbstractClassDemo;\n\nSayHello demo\
    \ = new();\n\ndemo.Speak();\n```\n\nRun the app to confirm that the “Hello!” message\
    \ is displayed in the console.\n\n### 18.6 Abstract vs. virtual members\n\nSo\
    \ far, we have only looked at abstract class members. As discussed above, an `abstract\
    \ member` is not implemented in the base class and must be implemented in derived\
    \ classes for the class to compile.\n\nAnother type of member is a `virtual member`.\
    \ A member defined as `virtual` must be implemented in the base class but may\
    \ optionally be overridden in the derived class if different behavior is required.\
    \ Virtual members are declared using the `virtual` modifier in the base class.\n\
    \nFor example, modify the `Talk` class to include a virtual member named `Goodbye()`\
    \ as follows:\n\n```csharp\nnamespace AbstractClassDemo;\n\npublic abstract class\
    \ Talk\n{\n    public abstract void Speak();\n    public virtual void Goodbye()\n\
    \    {\n        Console.WriteLine(\"Talk class says goodbye!\");\n    }\n}\n```\n\
    \nNext, make the following change in the `Program.cs` file to call the `Goodbye()`\
    \ method:\n\n```csharp\nSayHello demo = new();\n\ndemo.Speak();\n\ndemo.Goodbye();\n\
    ```\n\nWhen the app runs, output will be generated by both the `Speak()` and `Goodbye()`\
    \ methods as follows:\n\nHello!\nTalk class says goodbye!\n\nSuppose we decide\
    \ that the default `Goodbye()` method provided by the `Talk` class is not suitable\
    \ for the requirements of the `SayHello` subclass. In that case, we can implement\
    \ our own version of the method using the `override` modifier:\n\n```csharp\n\
    public class SayHello : Talk\n{\n    public override void Speak() {\n        Console.WriteLine(\"\
    Hello!\");\n    }\n    public override void Goodbye() {\n        Console.WriteLine(\"\
    SayHello class says goodbye!\");\n    }\n}\n```\n\nWhen the code executes, the\
    \ `Goodbye()` method in the subclass is called instead of the virtual version\
    \ in the `Talk` class:\n\nHello!\nSayHello class says goodbye!\n\nAs with non-abstract\
    \ classes, a subclass may call the base class implementation of a virtual method.\
    \ For example, the subclass version of the `Goodbye()` method could be modified\
    \ to also call the overridden base class `Goodbye()` method as follows:\n\n```csharp\n\
    public class SayHello : Talk\n{\n    public override void Speak() {\n        Console.WriteLine(\"\
    Hello!\");\n    }\n    public override void Goodbye() {\n        base.Goodbye();\n\
    \        Console.WriteLine(\"SayHello class says goodbye!\");\n    }\n}\n```\n\
    \nWhen the `Goodbye()` method is called output from both variations will be displayed:\n\
    \nHello!\nTalk class says goodbye!\nSayHello class says goodbye!\n\n### 18.7 Take\
    \ the knowledge test\n\nClick the link below or scan the QR code to test your\
    \ knowledge and understanding of C# abstract classes:\n\nhttps://www.answertopia.com/76b9\n\
    \n![img](image/c_-abstract.png) \n\n### 18.8 Summary\n\nAbstract classes are base\
    \ classes that cannot be directly instantiated as objects. Instead, they provide\
    \ a template that defines the requirements that subclasses must meet. The members\
    \ of an abstract class can be declared `abstract` or `virtual`. `Abstract members`\
    \ do not contain any implementation in the abstract class and must be overridden\
    \ and implemented in derived classes. On the other hand, `virtual members` provide\
    \ a fallback implementation within the abstract class to be used when the member\
    \ is not overridden.\n\n# 19. C# Interfaces\n\nIn this chapter, we will explain\
    \ C# interfaces, how to write your own, and how to make other classes comply with\
    \ one.\n\n### 19.1 Understanding C# interfaces\n\nBy default, there are no specific\
    \ rules to which a C# class must conform as long as the class is syntactically\
    \ correct. In some situations, however, a class must meet specific criteria to\
    \ work with other classes. This is particularly common when writing classes that\
    \ need to work with other libraries. An `interface` is a set of rules that define\
    \ the minimum requirements that a class must meet. An interface is declared using\
    \ the `interface` keyword and defines the methods and properties that a class\
    \ must contain to be in conformance. When a class adopts an interface but does\
    \ not meet all the interface requirements, errors will be reported stating that\
    \ the class fails to conform to the interface. Unlike abstract classes, an interface\
    \ does not contain implementations.\n\n### 19.2 Declaring an interface\n\nInterfaces\
    \ are declared much like other classes except that we use `interface` keyword\
    \ instead of `class` in the declaration. Consider the following interface declaration.\
    \ Any classes that adopt this interface must include a method named `Demo()`.\n\
    \nNote that the convention is to prefix interface names with `I` to differentiate\
    \ them from non-interface classes.\n\nUnlike abstract classes, an interface must\
    \ not contain implementations of its members. The following, for example, is not\
    \ a valid interface:\n\n```csharp\ninterface IDemoInterface\n{\n    void DemoMethod()\
    \ {\n        Console.WriteLine(\"Hello\");\n    }\n}\n```\n\nThe above code will\
    \ generate the following syntax error:\n\nError CS8701 Target runtime doesn't\
    \ support default interface implementation.\n\nTo comply with the `IDemoInterface`\
    \ interface, a class must include a `DemoMethod()` implementation matching the\
    \ interface method signature. For example:\n\n```csharp\npublic class DemoClass\
    \ : IDemoInterface\n{\n    public void DemoMethod() {\n        // Code here\n\
    \    }\n}\n```\n"
