    \n```csharp\ndelegate string SayHello();\n\nstatic void Main(string[] args)\n\
    {\n    SayHello hello = () => \"Hello\";\n    Console.WriteLine(hello());\n}\n\
    ```\n\n# 16.6 Local functions\n\nLocal functions are similar in many ways to lambda\
    \ expressions with some important differences. Local functions are named methods\
    \ that are declared within other methods. Like private methods, local functions\
    \ are not accessible outside the scope of the containing method and do not need\
    \ to be assigned to delegate variables.\n\nLocal functions are declared in the\
    \ same way as any other C# method. For example, the following is the local function\
    \ equivalent of our `StringConverter` lambda:\n\n```csharp\nstring converter(string\
    \ s)\n{\n    return s.ToLower();\n}\n```\n\nSince the `converter` function only\
    \ contains a single expression, we can abbreviate the statement using the `=>`\
    \ operator:\n\n```csharp\nstring converter(string s) => s.ToLower();\n```\n\n\
    Unlike anonymous methods and lambdas, local functions have direct access to the\
    \ local variables and values within the containing method’s scope.\n\n# 16.7 Creating\
    \ the LocalFunctions project\n\nTo try out local functions, create a new .NET\
    \ Console App project in VS Code, and name it `LocalFunctions`. Once the project\
    \ has been created, edit the `Program.cs` file so that it reads as follows:\n\n\
    ```csharp\nnamespace LocalFunctions\n{\n    internal class Program\n    {\n  \
    \      static void Main(string[] args)\n        {\n            ConvertToEuros(10.00);\n\
    \        }\n\n        private static void ConvertToEuros(double value)\n     \
    \   {\n            var exchangeRate = 0.5;\n            double USDToEuro(double\
    \ dollars) => exchangeRate * dollars;\n            var result = USDToEuro(value);\n\
    \            Console.WriteLine(result);\n        }\n    }\n}\n```\n\nThe `ConvertToEuros()`\
    \ method accepts a dollar amount and returns the equivalent in euros. Within this\
    \ method, we have declared a local function called `USDToEuro()` which multiplies\
    \ the dollar parameter value by the local exchangeRate variable and returns the\
    \ result:\n\n```csharp\ndouble USDToEuro(double dollars) => exchangeRate * dollars;\n\
    ```\n\nA key point to note in this example is that the local function has access\
    \ to both the value parameter and the local `exchangeRate` variable, neither of\
    \ which would have been directly available to a lambda expression.\n\n# 16.8 Recursive\
    \ local functions\n\nLocal functions can also be called recursively (in other\
    \ words, a local function can call itself either directly or indirectly). Calculating\
    \ the factorial of a number is a classic example of recursion. The following code\
    \ declares a method named `FindFactorial()` containing a local function named\
    \ `Factorial()` which calls itself recursively to identify the factorial of a\
    \ number:\n\n```csharp\nprivate static int FindFactorial(int value)\n{\n    int\
    \ Factorial(int number)\n    {\n        // Base case\n        if (number == 0)\n\
    \        {\n            return 1;\n        }\n        // Recursive case\n    \
    \    return number * Factorial(number - 1);\n    }\n    return Factorial(value);\n\
    }\n```\n\nAdd the above method to the `Program.cs` file and call it from the `Main()`\
    \ method as follows:\n\n```csharp\nstatic void Main(string[] args)\n{\n    for\
    \ (int i=1; i<10; i++)\n    {\n        var factorial = FindFactorial(i);\n   \
    \     Console.WriteLine($\"{i}! = {factorial}\");\n    }\n}\n```\n\nWhen the app\
    \ runs, it will generate the following output:\n\n1! = 1\n2! = 2\n3! = 6\n4! =\
    \ 24\n5! = 120\n6! = 720\n7! = 5040\n8! = 40320\n9! = 362880\n\n# 16.9 Lambdas\
    \ vs. local functions\n\nIn general, the choice between lambdas and local functions\
    \ is a matter of personal coding style, though there are some advantages to using\
    \ local functions such as direct access to local variables and recursion. Local\
    \ functions are also considered to be more efficient than lambdas because they\
    \ do not require the allocation of a delegate.\n\nIt is worth noting that when\
    \ you write a lambda in VS Code, the editor will often suggest that you convert\
    \ it to a local function, which hints at Microsoft’s opinion on the matter:\n\n\
    ![img](image/local_function_recommendation.png)\n\nFigure 16-1\n\n# 16.10 Take\
    \ the knowledge test\n\nClick the link below or scan the QR code to test your\
    \ knowledge and understanding of C# local functions and lambdas:\n\n[https://www.answertopia.com/v233](https://www.answertopia.com/v233)\n\
    \n![img](image/c_-methods.png) \n\n# 16.11 Summary\n\nThis chapter explored how\
    \ anonymous methods, lambdas, and local functions enable you to write concise\
    \ and reusable C# code that can be passed between methods. Lambdas result in more\
    \ concise code than anonymous methods, while local functions have the advantage\
    \ of conciseness, direct access to local variables, and recursion.\n\n# 17. C#\
    \ Inheritance\n\nIn [“An Introduction to C# Object-Oriented Programming”](#Object_Orientated_Programming.xhtml__idAnchor159)\
    \ we covered the basic concepts of object-oriented programming and worked through\
    \ an example of creating a new class using C#. In that example, our new class\
    \ was not explicitly derived from a base class (though all C# classes are ultimately\
    \ derived from `System.Object`). This chapter will delve into the concepts of\
    \ inheritance and subclassing in C#.\n\n## 17.1 What is inheritance?\n\nThe concept\
    \ of inheritance brings a real-world perspective to programming. It allows a class\
    \ to be defined with a number of characteristics and then other classes to be\
    \ derived from that class. The derived class inherits all of the features of the\
    \ parent class and adds some of its own.\n\nBy deriving classes, we create what\
    \ is often referred to as a class hierarchy. The class at the top of the hierarchy\
    \ is known as the base class, and the derived classes are called subclasses. Any\
    \ number of classes may be derived from a class. However, a derived class can\
    \ only inherit from one class. As such, C# is known as a single inheritance language.\
    \ Classes need not only be derived from a base class. For example, a subclass\
    \ can also be inherited from another subclass.\n\n## 17.2 A C# inheritance example\n\
    \nAs with most programming concepts, the subject of inheritance in C# is best\
    \ illustrated with an example. In the [“An Introduction to C# Object-Oriented\
    \ Programming”](#Object_Orientated_Programming.xhtml__idAnchor159) chapter, we\
    \ created a project called `ObjectDemo` containing a `BankAccount` class. We will\
    \ use this example to demonstrate C# inheritance.\n\nLaunch VS Code, open your\
    \ C# Essentials workspace folder and use the Explorer panel to locate the `BankAccount.cs`\
    \ file within the `ObjectDemo` project, as shown in [Figure 17-1](#Inheritance.xhtml__idAnchor226)\
    \ below:\n\n![img](image/inheritance_file_in.png)\n\nFigure 17-1\n\nOnce the project\
    \ has loaded into VS Code, edit the `BankAccount.cs` file and add an additional\
    \ field and property to the class to store the account balance:\n\n```csharp\n\
    namespace ObjectDemo;\n\npublic class BankAccount\n{\n    private string _accountName;\n\
    \    private int _accountNumber;\n    private double _accountBalance;\n\n    public\
    \ BankAccount(string accountName, int accountNumber ,\n    double accountBalance\
    \ )\n    {\n        _accountName = accountName;\n        _accountNumber = accountNumber;\n\
    \        _accountBalance = accountBalance;\n    }\n\n    public double AccountBalance\n\
    \    {\n        get => _accountBalance;\n        set => _accountBalance = value;\n\
    \    }\n\n    public void DisplayName()\n    {\n        Console.WriteLine($\"\
    Customer name is {AccountName}\");\n    }\n}\n```\n"
