    \ The `Add()` method, however, only adds items to the end of a list. Sometimes\
    \ it is necessary to insert a new item at a specific location in a list. The `Insert()`\
    \ method is provided for this particular purpose.\n\n`Insert()` takes two arguments,\
    \ an integer indicating the index location of the insertion and the item to be\
    \ inserted at that location. For example, to insert an item at location 2 in our\
    \ example list:\n\n```csharp\nList<string> colorList = [\"Red\", \"Green\", \"\
    Yellow\", \"Purple\", \"Orange\"];\n\ncolorList.Insert(2, \"White\");\n\nforeach\
    \ (string color in colorList)\n{\n    Console.Write($\"{color} \");\n}\n```\n\
    Output:\nRed Green White Yellow Purple Orange\n\n## 27.9 Sorting lists in C#\n\
    \nThere is no way to tell C# to automatically sort a list as items are added.\
    \ The items in a list can be sorted into order by calling the `Sort()` method:\n\
    \n```csharp\nList<string> colorList = [\"Red\", \"Green\", \"Yellow\", \"Purple\"\
    , \"Orange\"];\n\ncolorList.Sort();\n\nforeach (string color in colorList)\n{\n\
    \    Console.Write($\"{color} \");\n}\n```\nOutput:\nGreen Orange Purple Red Yellow\n\
    \nThe above example uses the C# default comparison delegate to organize the new\
    \ list order. Although beyond the scope of this book, it is worth knowing that\
    \ for more advanced requirements, you can create your own comparison delegate.\n\
    \n## 27.10 Finding items in a C# list\n\nSeveral methods are provided with the\
    \ `List` class for finding items. The most basic method is the `Contains()` method\
    \ which, when called on a list object, returns `true` if the specified item is\
    \ located in the list, or `false` if it is not.\n\nThe `IndexOf()` method returns\
    \ the index value of a matching item in a list. For example, the following code\
    \ sample will output a `true` result indicating the presence of “Red” and the\
    \ value 2, which is the index position of the “Yellow” string:\n\n```csharp\n\
    List<string> colorList = [\"Red\", \"Green\", \"Yellow\", \"Purple\", \"Orange\"\
    ];\n\nConsole.WriteLine(colorList.Contains(\"Red\"));\nConsole.WriteLine(colorList.IndexOf(\"\
    Yellow\"));\n```\nOutput:\nTrue\n2\n\nIf the item is not found in the list, a\
    \ value of `-1` is returned by the `IndexOf()` method.\n\nThe `LastIndexOf()`\
    \ method returns the index value of the last item in the list to match the specified\
    \ item. This is particularly useful when a list contains duplicate items:\n\n\
    ```csharp\nList<string> colorList = [\"Red\", \"Green\", \"Yellow\", \"Purple\"\
    , \"Red\"];\n\nConsole.WriteLine(colorList.LastIndexOf(\"Red\"));\n```\nOutput:\n\
    4\n\n## 27.11 Obtaining information about a list\n\nTwo properties of the `List<T>`\
    \ class are helpful in obtaining information about a list object. For example,\
    \ the `Capacity` property can identify how many items a collection can store without\
    \ resizing.\n\nThe `Count` property, however, identifies how many items are currently\
    \ stored in the list. In general, the `Capacity` value will match or exceed the\
    \ current `Count`:\n\n```csharp\nList<string> colorList = [\"Red\", \"Green\"\
    , \"Yellow\", \"Purple\", \"Orange\"];\n\nConsole.WriteLine($\"Count = {colorList.Count}\"\
    );\nConsole.WriteLine($\"Capacity = {colorList.Capacity}\");\n```\nOutput:\nCount\
    \ = 5\nCapacity = 5\n\nIn instances where a gap exists between `Count` and `Capacity`\
    \ you can remove excess capacity with a call the `TrimExcess()` method:\n\n```csharp\n\
    colorList.TrimExcess();\n```\n\n## 27.12 Clearing C# lists\n\nYou can remove all\
    \ of the items in a list by making a call to the `Clear()` method.\n\nThe `Clear()`\
    \ method removes the items from the list and sets the `Count` property to zero.\
    \ The `Capacity` property, however, remains unchanged after the list has been\
    \ cleared. To remove the capacity of a list, follow the `Clear()` method call\
    \ with a call to `TrimExcess()`:\n\n```csharp\nList<string> colorList = [\"Red\"\
    , \"Green\", \"Yellow\", \"Purple\", \"Orange\"];\n\nConsole.WriteLine($\"Count\
    \ = {colorList.Count}\");\nConsole.WriteLine($\"Capacity = {colorList.Capacity}\"\
    );\n\ncolorList.Clear();\n\nConsole.WriteLine($\"Count = {colorList.Count}\");\n\
    Console.WriteLine($\"Capacity = {colorList.Capacity}\");\n\ncolorList.TrimExcess();\n\
    \nConsole.WriteLine($\"Count = {colorList.Count}\");\nConsole.WriteLine($\"Capacity\
    \ = {colorList.Capacity}\");\n```\nOutput:\nCount = 5\nCapacity = 5\nCount = 0\n\
    Capacity = 5\nCount = 0\nCapacity = 0\n\n## 27.13 Take the knowledge test\n\n\
    Click the link below or scan the QR code to test your knowledge and understanding\
