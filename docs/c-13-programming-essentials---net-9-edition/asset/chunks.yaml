    Java gained rapid acceptance, and for a time, Microsoft began its Java “embrace
    and extend” campaign. Sun was happy for Microsoft to embrace Java but reached
    for their lawyers when they realized that the “extend” part was a plan for Microsoft
    to introduce their own proprietary version of the language. Politics ensued, and
    Microsoft eventually walked away from Java. Soon after, Microsoft started talking
    about something called `.NET`, followed by a programming language called `C#`.


    ## 2.2 What exactly is C#?


    “What does all this history have to do with C#?” I hear you ask. The origins of
    the `C#` programming syntax can be traced back to `C` and `C++`. If you are already
    familiar with `C` or `C++` (or even `Kotlin` or `Swift`, for the matter), then
    you have a big head start in learning `C#`. The same can be said of syntax similarities
    between `Java`, `C`, `C++`, and `C#` syntax. In addition, `C#` also inherits many
    of the benefits of `Java` in terms of memory handling (better known as garbage
    collection) and an intermediate byte code that negates the need to recompile an
    application for each target hardware platform. `C#` is also accompanied by a vast
    framework of libraries designed to provide the programmer with ready-made solutions
    to almost every imaginable scenario.


    Despite these similarities, there are differences between the `Java` and `C#`
    infrastructures. Therefore, the next chapter will provide an overview of the `C#`
    infrastructure.


    ## 2.3 Who is using C#?


    Although some significant new programming languages have been released since the
    introduction of `C#` (such as `Swift` and `Kotlin`), `C#` is still evolving as
    a language and has a vast and growing user base.


    At the time of writing, for example, `C#` was ranked on the `TIOBE Index` in 5th
    place among the top 50 most widely used programming languages (eclipsed only by
    `C`, `Java`, `Python`, and `C++`).


    `C#` is used to develop desktop, mobile, and server applications, as well as web-based
    applications and services. It is the programming language of choice on all Microsoft
    platforms and is used to program within the `Unity` Real-Time Development Platform.


    ## 2.4 Take the knowledge test


    Click the link below or scan the QR code to test your knowledge and understanding
    of the history of `C#`:


    [https://www.answertopia.com/qoe2](https://www.answertopia.com/qoe2)


    ![img](image/c_-history.png)


    ## 2.5 Summary


    `C#` is a programming language created by Microsoft that combines elements from
    other popular languages like `C`, `C++`, and `Java`. It’s designed to make programming
    simpler and more efficient with features like memory management to reduce errors
    and intermediate byte code for compatibility across platforms. `C#` is used for
    desktop, mobile, server, web, and game development and is among the top 10 most
    widely used programming languages.


    ## 3. C# Infrastructure


    This chapter will introduce the infrastructure on which the `C#` language is built.
    By the end of the chapter, you will have a clear understanding of what acronyms
    such as `CLI`, `CLR`, `VES`, `JIT`, and `.NET` mean.


    ### 3.1 The Common Language Infrastructure ( CLI)


    `C#` is an object-oriented programming language. It is essentially a standard
    defining what constitutes valid syntax. On its own, `C#` is of little use because
    it depends upon the Common Language Infrastructure (`CLI`) for the compilation
    and execution of applications. The `CLI`, in turn, is a standard that defines
    specifications for the following components:


    - Virtual Execution System (`VES`)

    - Common Intermediate Language (`CIL`)

    - Common Type System (`CTS`)

    - Common Language Specification (`CLS`)

    - Framework


    In the remainder of this chapter, we will examine each `CLI` component to understand
    how the `CLI` environment fits together.


    ### 3.2 Common Intermediate Language ( CIL)


    Unlike the `C` and `C++` compilers, which compile the source code to machine code
    understood by the target microprocessor, the `C#` compiler compiles to an intermediate
    byte code format known as the Common Intermediate Language (`CIL`). This code
    can be executed on any system with a `CLI`-compliant Virtual Execution System
    (`VES`). Therefore, there is no need to compile an application for every target
    platform.


    The word “Common” in Common Intermediate Language is used because this format
    is common to more than just the `C#` programming language. In fact, any programming
    language may target the `CIL`, allowing libraries and code modules from different
    languages to execute together in the same application. Typical languages for which
    `CIL` compilation is available include `Visual Basic`, `COBOL`, `PowerShell`,
    `Python`, and `C++`.


    ### 3.3 Virtual Execution System ( VES)


    The `VES` (referred to as the runtime) is the environment in which the `CIL` byte
    code is executed. The `VES` reads the byte code generated by the `C#` compiler
    and uses a Just in Time (`JIT`) compiler to compile the byte code down to the
    native machine code of the processor on which it is running. While executing,
    this code does so in conjunction with a runtime agent, which manages the execution
    process. As a result, this executing code is known as managed code, and the process
    handles issues such as garbage collection (to handle memory allocation and de-allocation),
    memory access, and type safety to ensure that the code does not do anything it
    is not supposed to do.


    A term often used in connection with the `VES` is the Common Language Runtime
    (`CLR`). The `CLR` is officially the name given to Microsoft’s implementation
    of the `VES` component of the `CLI` specification.


    It is worth noting that the `JIT` process can introduce a startup delay in the
    execution of an application. One option available with `.NET` to avoid this problem
    is pre-compiling `CLI` byte code to native machine code using the `NGen` compiler.
    However, because the `NGen` compilation must occur on the target processor architecture,
    this step is often performed when the user installs the application.


    ### 3.4 Common Type System ( CTS) & Common Language Specification ( CLS)


    As mentioned previously, several different languages target the `CLI`, allowing,
    for example, code from `C#` sources to interact with code from `Visual Basic`.
    However, to achieve this feat, each language must have the same concept of how
    data are stored in memory. The `CTS`, therefore, defines how a `CLI`-compatible
    language must view the bit patterns of values and the layout and behavior of objects
    to ensure interoperability.


    The `CLS` is a subset of the `CTS` aimed at creating interoperable libraries.


    ### 3.5 The Framework (Base Class and Framework Libraries)


    The `CLI` specifies a set of base classes that must be available to execute `CLI`
    code, otherwise known as the Base Class Library (`BCL`). The `BCL` contains Application
    Programming Interfaces (`APIs`) that enable executing `CIL` code to interact with
    the runtime environment and the underlying operating system.


    Beyond the basics, there is also the `.NET` Framework Class Library (`FCL`). This
    Microsoft library contains APIs for creating graphical user interfaces, database
    applications, web access, and more.


    ### 3.6 Implementations of the CLI


    Microsoft’s implementation of the `CLI` stack is called `.NET`. Initially only
    available on Windows systems, Microsoft repackaged `.NET` in 2014 as an open-source,
    cross-platform development platform available on Windows, Linux, and macOS.


    Another implementation Microsoft provides is Shared Source Common Language Infrastructure
    (`SSCLI`). `SSCLI`, however, is primarily a learning tool and, as such, is licensed
    under terms that prohibit use as the basis of commercial applications.


    Finally, if you would like to develop apps for iOS and Android using `C#`, there
    is also the `.NET MAUI` implementation.


    ### 3.7 Take the knowledge test


    Click the link below or scan the QR code to test your knowledge and understanding
    of `C#` Infrastructure:


    [https://www.answertopia.com/kbxm](https://www.answertopia.com/kbxm)


    ![img](image/c_-infrastructure.png)


    ### 3.8 Summary

