  trans: "\n\n用于 C# 开发扩展是 `C# Dev Kit`，在开始编写代码之前我们需要安装它。要安装此扩展，点击侧边栏上的扩展按钮（在下方的图 4-6\
    \ 中标记为 A），然后在搜索框（B）中输入“C# Dev Kit”。在扩展列表中找到 `C# Dev Kit` 项并点击安装（Install）按钮（C）来添加该扩展：\n\
    \n![img](img/vs_code_c__dev_kit.png)\n\n图 4-6\n\n在用 C# 编程时，另一个有用的扩展是 `IntelliCode\
    \ for C# Dev Kit`。该扩展利用 AI 在你向编辑器输入内容时提供代码补全建议，它是提高生产力和识别改进代码的方法的宝贵工具。点击标记为 D\
    \ 的安装按钮，为你的 VS Code 配置添加 `IntelliCode` 支持。\n\n完成上述步骤后，Visual Studio Code 已已完成安装和配置，你已准备好开始\
    \ C# 编程了。\n\n## 4.8 知识测试\n\n点击下方链接或扫描二维码以测试你对 Visual Studio Code 安装的知识和理解：\n\n\
    [`www.answertopia.com/iyjz`](https://www.answertopia.com/iyjz)\n\n![img](img/c_-installation.png)\
    \ \n\n## 4.9 总结\n\nVisual Studio Code 是一个适用于 Windows、macOS 和 Linux 的免费代码编辑环境，结合\
    \ `C# Dev Kit` 扩展，它提供了学习 C# 所需的一切。要安装 Visual Studio Code，请从官方网站下载并按照你操作系统的安装说明进行操作。安装\
    \ Visual Studio Code 后，安装 `.NET SDK` 和 `C# Dev Kit` 扩展以启用 C# 开发。\n\n## 5. Visual\
    \ Studio Code 导览\n\n现在我们已经安装了 VS Code，在开始编写 C# 代码之前，我们学习如何使用它。在本章中，我们将对 VS Code\
    \ 进行导览，并涵盖其关键功能的基本用法。虽然对 VS Code 的每个方面进行深入概述超出了本章的范围，但目标是提供从容开始编辑 C# 代码所需的技能。\n\
    \n### 5.1 工作区、项目和解决方案\n\n当你开始使用 VS Code 时，执行的第一件事是创建一个工作区。工作区是一个包含一个或多个其他文件夹的文件夹。当你打开工作区时，也会打开它的子文件夹。`workspace`（工作区）和\
    \ `folder`（文件夹）术语在 VS Code 的文档和菜单中通用的。例如，当你在 VS Code 中选择“打开文件夹”选项时，你正在打开一个工作区。\n\
    \n在 VS Code 中处理 C# 和 `.NET` 时，每个工作区子文件夹通常包含一个项目。每个项目代表你正在开发的独立应用程序、库或服务，并包含构建它的所有源代码和配置设置。\n\
    \n当你在 VS Code 中创建第一个 C# 项目时，系统会要求创建或选择一个文件夹来包含新项目。你选择的文件夹将是该项目所在的工作区。\n\n除了新项目和工作区外，VS\
    \ Code 还会创建一个解决方案文件。解决方案文件引用工作区内的所有项目。在 VS Code 中，你将使用 `Solution Explorer`（解决方案管理器）来管理工作区中的项目，并执行诸如向现有项目添加新类或文件夹等任务。\n\
    \n### 5.2 VS Code 主窗口\n\n一旦你创建了第一个项目，你就需要熟悉构成 VS Code 用户界面的各种元素。图 5-1 显示了一个打开了包含多个项目的\
    \ VS Code 会话。主窗口的关键区域如下：\n\nA - Activity Bar（活动栏）——活动栏包含用于显示主侧边栏、搜索项目文件、连接 Git\
    \ 源代码仓库、运行和调试代码、浏览和安装扩展以及运行测试的按钮。还有登录微软账户和访问设置的选项。\n\nB - Primary Sidebar（主侧边栏）——主侧边栏分为三个部分。顶部是\
    \ `Explorer`（资源管理器）视图，列出当前工作区内的所有文件夹和文件。从列表中选择文件将其加载到编辑器（F）。\n\nC - Outline（大纲）——主侧边栏的\
    \ `outline` 部分显示当前选中源文件的分级结构，包括符号、类、方法和属性。\n\nD - Timeline（时间线）——主侧边栏的时间面板列出了最近执行的操作，如保存、创建或删除项目文件。\n\
    \nE - Solution Explorer（解决方案管理器）——此面板列出当前解决方案文件中引用的文件和文件夹，并允许执行创建新类等任务。\n\nF -\
    \ Editor（编辑器）——编辑器是你编写和编辑 C# 代码的地方。VS Code 支持并排和分屏编辑模式，多个文件可以同时打开并可见。浮动编辑器窗口也可以从主窗口中分离。\n\
    \nG—Panel（面板）——面板包含多个标签，用于显示调试消息、问题报告（例如代码中的语法错误）以及用于与运行的应用交互的终端。\n\nH - Status\
    \ Bar（状态栏）——状态栏包含指示编辑器光标行和列位置、当前编程语言、警报通知以及错误和警告统计的字段。\n\nI - Run Button（运行按钮）——编译并运行当前项目应用，在面板\
    \ (G) 中显示输出。\n\nJ - File Tabs（文件标签）——当打开多个文件时，每个文件都由文件标签栏中的一个标签表示。\n\n![img](img/vs_code_main_window.png)\n\
    \n图 5-1\n\n### 5.3 命令面板\n\n`Command Palette`（命令面板）是在 VS Code 内执行任务的中心点，包括各种多样的任务，如创建和清理项目。图\
    \ 5-2 显示了一个典型的命令面板：\n\n![img](img/vs_code_command_palette.png)\n\n图 5-2\n\n通过\
    \ `Ctrl-Shift-P`（macOS 上为 `Cmd-Shift-P`）在 VS Code 任何处显示命令面板。\n\n### 5.4 分屏编辑器窗口\n\
    \n编辑多个文件时，并排查看文件通常很有帮助。要将文件拆分为单独的编辑器面板，右键点击文件标签并选择上、下、左或右 `Split`（分屏）选项，如下所示：\n\
    \n![img](img/vs_code_split.png)\n\n图 5-3\n\n要在浮动编辑器窗口中打开文件，重复上述步骤并选择 `Move into\
    \ New Window`（移动到新窗口）选项。\n\n编辑大型源文件时，同时查看和编辑文件的不同区域可能很有用。要这样做，右键点击文件标签并选择 `Split\
    \ in Group`（分组）。会出现一个包含相同代码文件的新编辑器面板，你可以滚动到不同的文件部分。你做的任何编辑都将在两个编辑器面板中反映。\n\n"
- fmt: "\n[https://www.answertopia.com/ix12](https://www.answertopia.com/ix12)\n\n\
    ![img](image/c_-vs-code.png)\n\n# 5.8 Summary\n\nIn this chapter, we have learned\
    \ that VS Code organizes projects into workspaces, each containing one or more\
    \ projects. The user interface includes the activity bar, primary sidebar, solution\
    \ explorer, editor, and status bar. Most tasks outside general code editing are\
    \ performed through the Command Palette. Zen mode hides distracting elements for\
    \ focused coding, and the editor can be split to view and edit multiple files\
    \ or different areas of the same file simultaneously.\n\n# 6. Creating an Example\
    \ C# App in VS Code\n\nThe preceding chapters of this book have explained how\
    \ to configure a C# development environment using Visual Studio Code and explored\
    \ the tool’s main features. Before moving on to slightly more advanced topics,\
    \ now is a good time to validate that everything is installed and functioning\
    \ correctly. The best way to achieve this is to create a C# app and compile and\
    \ run it. This chapter will cover creating a C# console application project using\
    \ VS Code.\n\n## 6.1 Creating the SampleApp project\n\nTo begin, launch VS Code\
    \ and display the Command Palette (`Ctrl-Shift-P` or `Cmd-Shift-P`). When the\
    \ palette appears, locate and select the `.NET: New Project...` option.\n\n![img](image/vs_code_command_palette1.png)\n\
    \nFigure 6-1\n\nAt this point, VS Code will ask us to select a project type. All\
    \ the projects in this book will be console-based apps, so select the `Console\
    \ App` project template option highlighted in [Figure 6-2](#Sample_App.xhtml__idTextAnchor067)\
    \ :\n\n![img](image/vs_code_command_palette_console_app.png)\n\nFigure 6-2\n\n\
    Once the project template has been selected, VS Code will display a file browser\
    \ dialog. You will recall from the previous chapter that VS Code projects are\
    \ stored in workspace folders. Since this is the first project we will create\
    \ in VS Code, we will also need a workspace to contain it and the projects created\
    \ in later chapters. Within the file browser, navigate to a suitable location\
    \ on your file system and create a new folder named “C# Essentials” to serve as\
    \ the workspace. Open the new folder to return to the Command Palette, name the\
    \ project `SampleApp`, and press the Enter key:\n\n![img](image/vs_code_project_name.png)\n\
    \nFigure 6-3\n\nFinally, the Command Palette will seek confirmation that you wish\
    \ to create the project in the designated workspace folder:\n\n![img](image/vs_code_create_project_confirmation.png)\n\
    \nFigure 6-4\n\nReview the workspace path, then press Enter to create the project.\n\
    \n## 6.2 Reviewing the SampleApp project\n\nNow that we have created our first\
    \ C# project, we can use the Explorer panel to review the files and folders that\
    \ VS Code generated for us. If the Explorer is not already visible, select it\
    \ using the action bar button indicated in [Figure 6-5](#Sample_App.xhtml__idTextAnchor071)\
    \ :\n\n![img](image/vs_code_explorer_button.png)\n\nFigure 6-5\n\nThe Explorer\
    \ lists our “C# Essentials” workspace and the `SampleApp` project folder. The\
    \ arrows to the left of the workspace and project folder names (highlighted in\
    \ [Figure 6-6](#Sample_App.xhtml__idTextAnchor072) ) are called disclosure arrows\
    \ and are used to show and hide the folder contents:\n\n![img](image/vs_code_disclosure_arrows.png)\n\
    \nFigure 6-6\n\nClick the disclosure arrow next to the `SampleApp` folder to view\
    \ the files contained within the project:\n\n![img](image/vs_code_sample_app_files.png)\n\
    \nFigure 6-7\n\nThe two subfolders, named `bin` and `obj`, are used by VS Code\
    \ when the app is compiled and run, and the `SampleApp.csproj` file stores the\
    \ project’s configuration settings. Select the `SampleApp.csproj` file to view\
    \ its contents in the editor panel.\n\nIn addition to the workspace and project\
    \ folder, VS Code has created a solution file named `C# Essentials.sln`, which\
    \ contains references to the workspace projects. While selecting the solution\
    \ file will display the content in the editor panel, a better option is to use\
    \ the Solution Explorer as shown below:\n\n![img](image/vs_code_sample_app_solution_explorer.png)\n\
    \nFigure 6-8\n\nVS Code also generated a file named `Program.cs`, where we will\
    \ begin writing code.\n\n## 6.3 Writing the app code\n\nThe `Program.cs` file\
    \ represents the entry point into the app code when it runs. In other words, when\
    \ we compile and run the app, the first lines of code to be executed will be those\
    \ contained in the `Program.cs` file. Select the file to load it into the editor,\
    \ where it will read as follows:\n\n```csharp\n// See https://aka.ms/new-console-template\
    \ for more information\n\nConsole.WriteLine(\"Hello, World!\");\n```\n\nThe first\
    \ line is a comment informing us that the file uses the new console template.\
    \ This template is particularly significant, as we will see later in the chapter.\
    \ For now, we are more interested in the second line:\n\n```csharp\nConsole.WriteLine(\"\
    Hello, World!\");\n```\n\nThe above line of code uses the `WriteLine()` method\
    \ of the built-in `Console` class to display a message in the terminal window.\
    \ To try out this code, click the run button shown in [Figure 6-9](#Sample_App.xhtml__idTextAnchor076)\
    \ :\n\n![img](image/vs_code_run_button.png)\n\nFigure 6-9\n\nWhen the build process\
    \ begins, refer to the Terminal in the bottom panel where, in addition to the\
    \ diagnostic output, the “Hello, World!” output will appear:\n\n![img](image/sample_app_first_run.png)\n\
    \nFigure 6-10\n\nThe Terminal panel is a fully interactive environment. You can\
    \ run commands just as you would in a Command Prompt on Windows or a terminal\
    \ window.\n\nEdit the `Program.cs` file and add the following lines:\n\n```csharp\n\
    Console.Write(\"Please enter your name: \");\n\nvar username = Console.ReadLine();\n\
    \nConsole.WriteLine($\"Hi {username}. Welcome to C#!\");\n```\n\nThe call to `ReadLine()`\
    \ method waits for keyboard input and assigns typed text to a variable called\
    \ `username`:\n\n```\nHello, World!\nPlease enter your name: John Smith\nHi John\
    \ Smith, Welcome to C#!\n```\n\n## 6.4 Top-level statements and the Main method\n\
    \nThe above example may be puzzling to those familiar with other programming languages\
    \ in that we could write and execute code without any surrounding structure or\
    \ “instructions”. Languages such as C# usually require additional information,\
    \ such as a class name and directives to import framework dependencies. For example,\
    \ our `Program.cs` file makes calls to methods belonging to the `Console` class,\
    \ which, in turn, belongs to the `System` namespace, but we did not need to import\
    \ that namespace into our code for it to run.\n\nAnother common requirement is\
    \ to specify which code is the starting point for execution. Many programming\
    \ languages have a special main function or method containing those initial lines\
    \ of code. So if other languages have these requirements, why doesn’t C#?\n\n\
    The answer is that C# has these requirements, but VS Code automatically generates\
    \ these so-called top-level statements for us in the background. This is what\
    \ the new console template comment in the `Program.cs` file was referring to.\
    \ Although we only have four lines of code in our app, the actual code that gets\
    \ compiled will resemble the following:\n\n```csharp\nusing System;\n\nnamespace\
    \ SampleApp\n{\n    internal class Program\n    {\n        static void Main(string[]\
    \ args)\n        {\n            Console.Write(\"Please enter your name: \");\n\
    \n            var username = Console.ReadLine();\n\n            Console.WriteLine($\"\
    Hi {username}. Welcome to C#!\");\n        }\n    }\n}\n```\n\nThe `using` directive\
    \ in the above code tells the compiler to import the `System` namespace because\
    \ the code in the file depends on it. Next, the `internal class` is wrapped in\
    \ a namespace declaration called `SampleApp`. C# code contains classes, variables,\
    \ and methods, all of which are assigned names. Namespaces allow application code\
    \ to be organized so that the names in one workspace do not conflict with the\
    \ same names in other workspaces. Anything declared outside of a namespace is\
    \ part of the global namespace.\n"
