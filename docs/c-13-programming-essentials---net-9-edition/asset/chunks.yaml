  trans: "\n`string.Compare()` 方法提供了另一种比较字符串的方法，尽管该方法具有一些实用的额外功能。此方法接受两个要比较的字符串作为参数，并返回一个整数值，表示字符串之间排序顺序之间的关系。结果为\
    \ 0 表示字符串匹配。小于 0 的值表示第一个字符串在排序顺序上于第二个字符串。最后，大于 0 的结果表示第二个字符串在排序顺序上于第一个字符串：\n\n\
    ```cs\nstring myString1 = \"Bananas are yellow.\";\nstring myString2 = \"Oranges\
    \ are orange.\";\nvar result = string.Compare(myString1, myString2);\n\nif (result\
    \ == 0)\n{\n    Console.WriteLine(\"Strings match.\");\n}\nelse if (result < 0)\n\
    {\n    Console.WriteLine(\"myString1 precedes myString2 in sort order.\");\n}\n\
    else if (result > 0)\n{\n    Console.WriteLine(\"myString2 precedes myString1\
    \ in sort order.\");\n}\n```\n输出:\nmyString1 precedes myString2 in sort order.\n\
    \n### 30.8 更改字符串的大小\n\n可以使用 `ToUpper()` 和 `ToLower()` 方法更改字符串中字符的大小写。这两个方法都返回一个修改后的字符串，而不是更改实际字符串。例如：\n\
    \n```cs\nstring myString = \"Hello World\";\nstring newString;\nnewString = myString.ToUpper();\n\
    Console.WriteLine(newString);\nnewString = myString.ToLower();\nConsole.WriteLine(newString);\n\
    ```\n输出:\nHELLO WORLD\nhello world\n\n### 30.9 将字符串拆分为多个部分\n\n可以使用 `Split()` 方法将字符串拆分为多个部分。`Split()`\
    \ 接受一个字符作为分隔符，以识别字符串要拆分点。方法调用返回一个包含字符串各个部分的数组。例如，以下代码使用逗号字符作为分隔符拆分字符串。结果放在名为 `myColors`\
    \ 的数组中，然后使用 `foreach` 循环从数组中读取每个项并显示它：\n\n```cs\nstring myString = \"Red, Green,\
    \ Blue, Yellow, Pink, Purple\";\nstring[] myColors = myString.Split(',');\nforeach\
    \ (string color in myColors)\n{\n    Console.WriteLine(color);\n}\n```\n输出:\n\
    Red Green Blue Yellow Pink Purple\n\n正如我们看到的，`Split()` 方法按照要求拆分了字符串，但我们有一个问题，空格仍然存在。幸运的是，C#\
    \ 提供了一个方法来处理这个问题。\n\n### 30.10 修剪和填充字符串\n\n可以使用 `Trim()` 方法从字符串中删除不需要的开头和结尾空格。调用时，此方法返回字符串的修改版本，删除了开头和结尾的空格：\n\
    \n```cs\nstring myString = \" hello \";\nConsole.WriteLine(\"[\" + myString +\
    \ \"]\");\nConsole.WriteLine(\"[\" + myString.Trim() + \"]\");\n```\n输出:\n[ hello\
    \ ]\n[hello]\n\n如果你只需要删除开头或结尾的空格，请分别使用 `TrimStart()` 或 `TrimEnd()` 方法。\n\n修剪方法的反向是\
    \ `PadLeft()` 和 `PadRight()` 方法。这些方法允许向字符串添加开头或结尾字符。方法接受的参数是字符串要填充的总字符数以及填充字符：\n\
    \n```cs\nstring myString = \"hello\";\nstring newString;\nnewString = myString.PadLeft(10,\
    \ ' ');\nnewString = newString.PadRight(20, '*');\nConsole.WriteLine(\"[\" + newString\
    \ + \"]\");\n```\n输出:\n[ hello**********]\n\n### 30.11 字符串替换\n\n可以使用 `Replace()`\
    \ 方法替换字符串的部分。此方法接受要替换的字符串部分和替换字符串作为参数，并返回一个反映更改的新字符串。`Replace()` 方法将替换字符串的所有实例：\n\
    \n```cs\nstring myString = \"Hello World\";\nstring newString;\nConsole.WriteLine(myString);\n\
    newString = myString.Replace(\"Hello\", \"Goodbye\");\nConsole.WriteLine(newString);\n\
    ```\n输出:\nHello World\nGoodbye World\n\n### 30.12 接受知识测试\n\n点击下方链接或扫描二维码以测试你对\
    \ C# 字符串的知识和理解：\n\n[`www.answertopia.com/nppx`](https://www.answertopia.com/nppx)\n\
    \n![img](img/c_-strings.png)\n\n### 30.13 总结\n\nC# 字符串是用于人机交互的字符集合。可以使用字面量、`new`\
    \ 关键字或隐式类型创建字符串。可以使用 `Length()`、`ToCharArray()` 和 `Concat()` 等方法进行操作，并使用 `foreach`\
    \ 循环进行迭代。\n\nC# 提供了各种比较字符串的方法，包括 `Equals()` 和 `Compare()` 等等性运算符。`ToUpper()` 和\
    \ `ToLower()` 方法可以更改字符串大小，而 `Split()` 将字符串拆分为部分。`Trim()` 删除开头和结尾空格，而 `PadLeft()`\
    \ 和 `PadRight()` 在字符串的开头或结尾添加字符。\n\n# 31. C# 字符串格式化\n\n除了上一节概述的各种字符串处理函数外，string\
    \ 类还提供了 `Format()` 方法。\n\nC# 字符串 `Format()` 方法的主要目的是提供一种在具有额外格式控制的情况下，向字符串中插入字符串、数值或布尔值的方法。\n\
    \n### 31.1 Format 方法的语法\n\nstring 字符串 `Format()` 方法的通用语法如下：\n\n`string.Format(\"\
    格式字符串\", arg1, arg2, ...)`\n\n格式字符串是用于填充值的字符串。在该字符串内部，占位符指示了值的位置。占位符的形式为包裹数字的\
    \ `{}`。紧跟格式字符串后面的是逗号分隔的参数列表。每个占位符都必须有一个参数。\n\n### 31.2 创建 StringFormat 项目\n\n\
    启动 VS Code，打开你的“C# Essentials”文件夹，并创建一个名为 `StringFormat` 的新 .NET 应用程序。\n\n创建项目后，打开\
    \ `Program.cs` 文件并使用它尝试本章节中的示例。\n\n### 31.3 简单的字符串格式化示例\n\n以下代码示例演示了 `Format()`\
    \ 方法的直接用法：\n\n```cs\nstring newString;\nnewString = string.Format(\"There are\
    \ {0} cats in my {1} and no {2}\", 2, \"house\", \"dogs\");\nConsole.WriteLine(newString);\n\
    ```\n输出:\nThere are 2 cats in my house and no dogs\n\n让我们快速回顾上述示例中的 `Format()`\
    \ 方法调用。格式字符串包含三个占位符：`{0}`、`{1}` 和 `{2}`。格式字符串后面是用于每个占位符的参数。因此，例如 `{0}` 被第一个参数（数字\
    \ 2）替换，`{1}` 被第二个参数（字符串“house”）替换。如果你回想“变量和常量”章节，可能会疑惑这与我们在书中多次使用的字符串插值技术相比如何。正如下面所示，C#\
    \ 字符串格式化在与格式控制结合时变得更有用。\n\n### 31.4 使用格式控制\n\n到目前为止，我们只替换了占位符的参数，但没有在显示之前更改参数的格式。这本质上指示\
    \ `Format()` 方法在显示字符串时使用默认格式。`Format()` 方法最强大的方面之一是在占位符内部格式控制来控制输出格式。\n\n格式控制出现在占位符的大括号\
    \ `{}` 内部。带有格式控制的占位符格式如下：\n\n`{n:controlx}`\n\n在上述语法中，`n` 是占位符数字，`control` 是应用于参数的特殊格式控制序列。可选数字\
    \ `x` 进一步格式化某些控制类型的输出。\n\n### 31.5 简单的格式控制示例\n\n以下示例使用了 `X` 格式控制，它用于以十六进制格式显示数字：\n\
    \n"
- fmt: '

    ```csharp

    var newString = string.Format("The number {0} in Hexadecimal is {0:X}.", 432);


    Console.WriteLine (newString);

    ```

    Output:

    The number 432 in Hexadecimal is 1B0\.


    The above example displays argument 0 (432) in two formats. The first is the default
    decimal format, while the second uses the `X` format control to display the argument
    as a hexadecimal number.


    The string `Format()` method provides a wide range of format controls which we
    will explore below.


    ## 31.6 C# string `Format()` format controls


    The following table lists format controls supported by the C# `string.Format()`
    method together with examples of each control:


    | Control | Type | Description | Example |

    | :--- | :--- | :--- | :--- |

    | C | Currency | Displays number prefixed with the currency symbol appropriate
    to the current locale | `{0:C}` of 432.00 outputs $432.00 |

    | D | Decimal | Displays numbers in decimal form with optional padding | `{0:D4}`
    of 432 outputs 00432 |

    | E | Exponential | Displays number in scientific form with optional value for
    the fractional part | `{0:E5}` of 432.32 outputs 4.32320E+002 |

    | F | Fixed | Displays the number, including the specified number of decimal digits
    | `{0:F3}` of 432.324343 outputs 432.324 |

    | N | Number | Converts a number to a human-friendly format by inserting commas
    and rounding to the nearest 100th | `{0:N}` of 123432.324343 outputs 123,432.32
    |

    | X | Hexadecimal | Converts a number to hexadecimal | `{0:X}` of 432 outputs
    1B0 |

    | 0:0… | Zero Padding | Adds zeros to pad argument | `{0:0000.00}` of 43.1 outputs
    0043.10 |

    | 0:0#… | Space Padding | Adds spaces to pad argument | `{0:####.##}` of 43.1
    outputs 43.1 |

    | % | Percentage | Multiplies the argument by 100 and appends a percentage sign
    | `{0:00.00%}` of .432 outputs 43.20% |


    Table 31-1


    Before moving on to the next chapter, run the following code to see some of these
    format controls in action:


    ```csharp

    var newString = string.Format("The number {0} fixed to 2 decimal places is {0:F2}.",
    109.78799);


    Console.WriteLine (newString);


    newString = string.Format("The number {0} using human friendly formatting is {0:N}.",
    1023429.78799);


    Console.WriteLine (newString);


    newString = string.Format("The number {0} using exponential formatting is {0:E6}.",
    32423.24232);


    Console.WriteLine (newString);


    newString = string.Format("The number {0} as a percentage to 3 decinal places
    is {0:00.000%}.", 0.24232);


    Console.WriteLine (newString);

    ```

    Output:

    The number 109.78799 fixed to 2 decimal places is 109.79\.

    The number 1023429.78799 using human friendly formatting is 1,023,429.79\.

    The number 32423.24232 using exponential formatting is 3.242324E+004\.

    The number 0.24232 as a percentage to 3 decinal places is 24.232%.


