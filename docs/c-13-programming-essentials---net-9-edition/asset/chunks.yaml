- fmt: '

    The Common Language Infrastructure (`CLI`) provides a standardized environment
    for executing C# code. It includes the Common Intermediate Language (`CIL`), Virtual
    Execution System (`VES`), Common Type System (`CTS`), and Common Language Specification
    (`CLS`). The `CLI` enables interoperability between different programming languages
    and provides a base class library for executing `CIL` code.


    In addition, the .NET Framework Class Library offers a vast collection of pre-built
    functions and classes for creating diverse applications and includes APIs for
    file I/O, networking, database access, and user interface design.


    # 4. Installing Visual Studio Code, C# and .NET 9


    To begin programming in C#, we will need an environment to write, edit, compile,
    and run our code. There are many options, but for this book, we need a solution
    that is free to use and available to all readers, regardless of whether they are
    learning C# on macOS, Windows, or Linux systems. A popular tool, and the one we
    will be installing in this chapter, is Visual Studio Code. Developed by Microsoft,
    Visual Studio Code is a feature-rich, intuitive code editing environment, which,
    when combined with the `C# Dev Kit` extension, provides everything we need to
    learn C#.


    ## 4.1 Installing the .NET 9 SDK


    In addition to installing Visual Studio Code, we will also need to install the
    .NET 9 SDK prior to compiling C# programs. While there are several ways to install
    .NET, we will use a technique that involves downloading and install the SDK independently
    from Visual Studio Code.


    The .NET 9 SDK installation steps are specific to the operating system you are
    using as outlined below.


    ### 4.1.1 Installing .NET 9 on Windows


    The .NET 9 SDK is available for Windows systems running on x86, x64, and Arm64
    processor architectures. Using the following link, download the latest .NET 9
    `Installer` package that matches your system:


    [https://dotnet.microsoft.com/en-us/download/dotnet/9.0](https://dotnet.microsoft.com/en-us/download/dotnet/9.0)


    Once you have downloaded the installer, launch it and follow the setup wizard
    to complete the installation:


    ![img](image/dotnet_installer_windows.png)


    Figure 4-1


    ### 4.1.2 Installing .NET 9 on macOS


    The macOS edition of the .NET 9 SDK is available or Intel and Apple Silicon systems.
    To begin the installation, open a browser window, navigate to the following URL,
    and download the `Installer` that matches your processor architecture:


    [https://dotnet.microsoft.com/en-us/download/dotnet/9.0](https://dotnet.microsoft.com/en-us/download/dotnet/9.0)


    After downloading the Installer package, launch it and follow the steps to complete
    the installation:


    ![img](image/dotnet_installer_macos.png)


    Figure 4-2


    ### 4.1.3 Installing .NET 9 on Red Hat Linux-based distributions


    The best way to install the .NET 9 SDK on Linux distributions derived from Red
    Hat Enterprise Linux will depend on when you are reading this. At the time of
    writing, .Net 9 was still at the release candidate stage. It is possible that
    by the time you read this, .NET 9 will have been officially released. To find
    out, open a `Terminal` window and run the following command:


    ```bash

    sudo sudo dnf install dotnet-sdk-9.0

    ```


    If the installation request reports that there is no match for `dotnet-sdk-9.0`,
    skip to the [“Installing .Net 9 from the Linux binaries”](#Installing_Visual_Code.xhtml__idTextAnchor035)
    section below to perform the installation. Otherwise, press ‘y’ to complete the
    installation.


    ### 4.1.4 Installing the .NET 9 on Debian/Ubuntu distributions


    The installation steps for Debian and Ubuntu systems will, once again, depend
    on the release status of the .NET 9 SDK. Begin by running the following common
    in a `Terminal` window:


    ```bash

    sudo apt-get install dotnet-sdk-9.0

    ```


    If the installation request reports that the `dotnet-sdk-9.0` package could not
    be found, skip to the next section to perform the installation. Otherwise, press
    ‘y’ to complete the installation.


    ### 4.1.5 Installing .Net 9 from the Linux binaries


    If .NET 9 has not yet been officially released, the installation will need to
    be performed using the release candidate SDK binaries. Return to the .NET 9 download
    page and locate and download the binary that matches your CPU as highlighted in
    [Figure 4-3](#Installing_Visual_Code.xhtml__idTextAnchor036) :


    ![img](image/dotnet_linux_binaries.png)


    Figure 4-3


    Within a `Terminal` window, create a directory into which you would like to install
    .NET 9\. Next, run the following commands (which assume you chose `$HOME/dotnet9`
    as your installation directory):


    ```bash

    cd $HOME/dotnet9

    tar xvfz <path to downloaded binary archive>

    ```


    After unpacking the .NET package, modify your `$HOME/.bashrc` file to export the
    `DOTNET_ROOT` environment variable and to add the .NET 9 SDK to your path:


    ```bash

    export DOTNET_ROOT=$HOME/dotnet9

    export PATH=$PATH:$HOME/dotnet9

    ```


    Open a new `Terminal` window and run the following command to verify the installation:


    ```bash

    dotnet --version

    9.0.100-rc.1.24452.12

    ```


    ## 4.2 Downloading Visual Studio Code


    The first step in installing Visual Studio Code (often abbreviated to `VS Code`)
    is downloading it. Downloads for Windows, macOS, and Linux are available from
    the following web page:


    [https://code.visualstudio.com/Download](https://code.visualstudio.com/Download)


    ## 4.3 Installing on Windows


    Visual Studio Code for Windows is available for Arm and Intel-based systems. Once
    you have downloaded the installer, launch it and follow the setup wizard to complete
    the installation. You can use the default settings unless you have specific requirements.


    ## 4.4 Installing on macOS


    Visual Studio Code is available for Apple Silicon and Intel-based systems and
    is provided as a ZIP archive containing versions for both types. Once you have
    downloaded the file, double-click on it to extract the Visual Code package, then
    open a second `Finder` window and drag the package to your `Applications` folder.
    For convenience, take this opportunity to drag Visual Studio Code to the Dock
    as shown in [Figure 4-4](#Installing_Visual_Code.xhtml__idTextAnchor041) below:


    ![img](image/vs_code_add_to_dock.png)


    Figure 4-4


    ## 4.5 Installing on Linux


    VS Code installation packages are available for several Linux distributions including
    Debian, Ubuntu, SUSE, and most Red Hat Linux-based platforms with support for
    x64, Arm32, and Arm64 processor architectures.


    The steps to install VS Code will depend on which distribution you are running
    as outlined below:


    ### 4.5.1 Debian/Ubuntu


    Visual Code for Debian and Ubuntu is provided as a `.deb` package. To complete
    the installation, open a `Terminal` window, change directory to the location of
    the downloaded package, and run the following command (where `<filename>.deb`
    is the name of the package):


    ```bash

    sudo dpkg -i <filename>.deb

    ```


    ### 4.5.2 Red Hat-based distributions


    VS Code is installed on Red Hat-based systems including RHEL, CentOS, Fedora,
    AlmaLinux, and Rocky Linux using a Red Hat Package Manager (`.rpm`) file. To install
    VS Code, open a terminal window, change directory to the location of the downloaded
    package, and run the following command (where `<filename>.rpm` is the name of
    the package):


    ```bash

    sudo rpm -ihv <filename>.rpm

    ```


    After the installation completes, VS Code may be launched either by searching
    for the app in the desktop environment or via the command line by running the
    `code` executable.


    ## 4.6 Customizing Visual Studio Code


    When VS Code runs for the first time, the screen shown in [Figure 4-5](#Installing_Visual_Code.xhtml__idTextAnchor046)
    will appear. By default, the user interface will use the Dark Modern theme. If
    you prefer a different theme, make a selection from the option marked A below,
    or click the `Browse Color Themes` button (B) to browse the entire list:


    ![img](image/vs_code_color_themes.png)


    Figure 4-5


