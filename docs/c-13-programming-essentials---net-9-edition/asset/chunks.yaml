    7.10 String data type


    Previously, we looked at storing individual characters in a char variable. While
    this works for storing a single letter, number, or Unicode scalar, it is of little
    use for storing entire words or sentences. For this purpose, the string variable
    type is supported by C#. Constants or variables of type string can store a string
    of any number of characters.


    String literal values are surrounded by double quotes ("). For example:


    string myString = "This is string is literal.";


    7.11 Verbatim string literals


    A regular string value will interpret special characters. The following code,
    for example, consists of a string containing multiple special characters:


    string myString = "This is some text\n\n\tand this is some more.";


    As shown above, the only way to make the text span multiple lines is to use the
    \n escape character when using a standard string literal. The following code,
    for example, will not compile:


    string myString = "This is some text


    and this is some more.";


    A string literal must be declared as a verbatim string literal type for it to
    be interpreted precisely as written.


    Verbatim string literals ignore the special meaning of escape characters and can
    span multiple lines. To declare a string literal as verbatim, prefix the declaration
    with the ‘@’ character. For example, this allows literals such as the following
    to be expressed:


    string myString = @"Hi Team,


    The file located at ''C:\Users\demo\newdata.txt''


    uses the \t sequence to insert tabs into text.


    Best regards'
