    {\n\nwriter.Write(\"Test data\");\n\nwriter.Write(false);\n\nwriter.Write(3.57);\n\
    \nwriter.Write(33);\n\nwriter.Write('W');\n\n}\n\nWhen reading from a binary stream,\
    \ the appropriate BinaryReader method must be called to match the data type as\
    \ follows:\n\nusing (BinaryReader reader = new(File.Open(\"Binary.dat\", FileMode.Open)))\n\
    \n{\n\nConsole.WriteLine(\"String = \" + reader.ReadString());\n\nConsole.WriteLine(\"\
    Boolean = \" + reader.ReadBoolean());\n\nConsole.WriteLine(\"Double = \" + reader.ReadDouble());\n\
    \nConsole.WriteLine(\"Int = \" + reader.ReadInt32());\n\nConsole.WriteLine(\"\
    Char = \" + reader.ReadChar());\n\n}\n\nWhen it runs, the above code will generate\
    \ the following output:\n\nString = Test data\n\nBoolean = False\n\nDouble = 3.57\n\
    \nInt = 33\n\nChar = W\n\n29.15 Take the knowledge test\n\nClick the link below\
    \ or scan the QR code to test your knowledge and understanding of C# dictionary\
    \ collections:\n\n[https://www.answertopia.com/65dc](https://www.answertopia.com/65dc)\n\
    \n![img](image/c_-files.png) \n\n29.16 Summary\n\nThis chapter explored file and\
    \ directory handling in C# using classes from the System.IO namespace. We covered\
    \ creating, deleting, navigating, and working with files and directories, including\
    \ checking for existence, changing the current working directory, and handling\
    \ exceptions. The File class provides static methods for working with files, while\
    \ the FileInfo class offers non-static methods for the same purpose. We also looked\
    \ at more complex file handling using the StreamReader, StreamWriter, BinaryReader,\
    \ and BinaryWriter classes.\n\n30\\. C# Strings"
