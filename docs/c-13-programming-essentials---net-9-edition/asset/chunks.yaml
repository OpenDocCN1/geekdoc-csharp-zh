    John Smith\", 53211, true);\n```\n\n### 13.14 C# primary constructors\n\nWhen\
    \ a constructor’s sole purpose is to assign provided parameters to properties\
    \ with no additional actions, a primary constructor is recommended. Primary constructors\
    \ are declared by placing the parameters after the class name and assigning them\
    \ to the private variables. For example:\n\n```csharp\npublic class BankAccount\
    \ (string accountName, int accountNumber)\n{\n    private string _accountName\
    \ = accountName ;\n    private int _accountNumber = accountNumber ;\n\n    //\
    \ Constructor\n    public BankAccount(string accountName, int accountNumber)\n\
    \    {\n        _accountName = accountName;\n        _accountNumber = accountNumber;\n\
    \    }\n}\n```\n\n### 13.15 C# finalizers\n\nFinalizers are used to clean up any\
    \ resources a class object uses when the object is destroyed. Unlike constructors,\
    \ which can be triggered from code using the `new` keyword, there is no way to\
    \ explicitly call a finalizer (for example, there is no `delete` equivalent to\
    \ the `new` keyword). Instead, the finalizer will be called when the runtime system\
    \ decides the object instance is no longer needed. All the programmer can be sure\
    \ is that the finalizer will be called at some time between when the code no longer\
    \ needs the object and the point that the application terminates.\n\nFinalizers\
    \ are defined in the same way as constructors, with the exception that they cannot\
    \ be public and the name is preceded by the tilde character (`~`):\n\n```csharp\n\
    // Finalizer\n~BankAccount() {\n    // Code to perform clean-up\n}\n```\n\n###\
    \ 13.16 The “this” keyword\n\nWhen constructing classes in C#, you may encounter\
    \ situations where a property that is local to a method or the name assigned to\
    \ the method parameter conflicts with a class property. This is particularly common\
    \ when using public fields within class declarations.\n\nTake, for example, the\
    \ following sample class in which the parameter names for the initializer match\
    \ those of the public fields:\n\n```csharp\nclass DemoClass\n{\n    public string\
    \ name;\n    public int age;\n    public DemoClass(string name, int age)\n   \
    \ {\n        name = name;\n        age = age;\n    }\n}\n```\n\nThe following\
    \ code creates a `DemoClass` instance and initializes it with `name` and `age`\
    \ values:\n\n```csharp\nDemoClass demo = new(\"Mark\", 37);\nConsole.WriteLine($\"\
    {demo.name} is {demo.age} is years old.\");\n```\n\nWhen the above code runs,\
    \ there will be no `name` and the `age` will be 0 even though `age` was set to\
    \ 37 when the class instance was created. In addition, the compiler will issue\
    \ a warning which reads:\n\n`warning CS1717: Assignment made to same variable;\
    \ did you mean to assign something else?`\n\nThe problem here is that the compiler\
    \ doesn’t know which `name` and `age` variables are being referenced in the following\
    \ initializer code:\n\n```csharp\npublic DemoClass(string name, int age) {\n \
    \   name = name;\n    age = age;\n}\n```\n\nTo resolve this problem, we need a\
    \ way to tell the compiler that the method parameter values are to be assigned\
    \ to the corresponding public field values. We can do this using the `this` keyword.\
    \ In this context, the `this` keyword represents the current class instance. To\
    \ differentiate the conflicting `name` and `age` variables, we need to use the\
    \ `this` keyword as follows:\n\n```csharp\npublic DemoClass(string name, int age)\
    \ {\n    this. name = name;\n    this. age = age;\n}\n```\n\nNow we not only no\
    \ longer see the compiler’s warning messages but see Mark’s name and correct age.\n\
