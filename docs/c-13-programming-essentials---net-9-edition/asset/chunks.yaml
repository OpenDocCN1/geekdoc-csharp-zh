    \ 文件存储了项目的配置设置。选择 `SampleApp.csproj` 文件在编辑器面板中查看其内容。\n\n除了工作区和项目文件夹外，VS Code 还创建了一个名为\
    \ `C# Essentials.sln` 的解决方案文件，它包含了对工作区项目的引用。虽然选择解决方案文件会在编辑器面板中显示内容，但更好的选项是使用所示的解决方案管理器：\n\
    \n![img](img/vs_code_sample_app_solution_explorer.png)\n\n图 6-8\n\nVS Code 还生成了一个名为\
    \ `Program.cs` 的文件，我们将从这里开始编写代码。\n\n## 6.3 编写应用代码\n\n`Program.cs` 文件代表应用运行时的入口点。换句话说，当我们编译并运行应用时，执行的第一行代码将是包含\
    \ `Program.cs` 文件中的代码。选择该文件将其加载到编辑器中，其内容如下：\n\n```csharp\n// See https://aka.ms/new-console-template\
    \ for more information\n\nConsole.WriteLine(\"Hello, World!\");\n```\n\n第一行是注释，告知我们文件使用了新的控制台模板。该模板非常重要，正如我们在本章稍晚部分将看到的。现在，我们对第二行更感兴趣：\n\
    \n```csharp\nConsole.WriteLine(\"Hello, World!\");\n```\n\n上述代码行使用内置 `Console`\
    \ 类的 `WriteLine()` 方法在终端窗口中显示消息。要尝试此代码，请点击图 6-9 中显示的运行按钮：\n\n![img](img/vs_code_run_button.png)\n\
    \n图 6-9\n\n当构建开始时，除了诊断输出，终端还会显示“Hello, World!”\n\n![img](img/sample_app_first_run.png)\n\
    \n图 6-10\n\n终端面板是一个完全交互的环境。你可以像在 Windows 命令提示符或终端中一样运行命令。编辑 `Program.cs` 文件并添加以下行：\n\
    \n```csharp\nConsole.Write(\"Please enter your name: \");\n\nvar username = Console.ReadLine();\n\
    \nConsole.WriteLine($\"Hi {username}. Welcome to C#!\");\n```\n\n调用 `ReadLine()`\
    \ 方法将等待键盘输入并将输入的文本分配给变量 `username`：\n\n```\nHello, World!\nPlease enter your name:\
    \ John Smith\nHi John Smith, Welcome to C#!\n\n## 6.4 顶层语句与 Main 方法\n\n对于熟悉其他编程语言的人来说，上面的示例可能会困惑，因为我们可以在没有任何结构或“指令”的情况下编写并执行代码。像\
    \ C# 这样的语言通常需要额外信息，例如类名和导入依赖的指令。例如，我们的 `Program.cs` 文件调用属于 `Console` 类的方法。另一个常见要求是指定执行的起点。许多编程语言都有特殊的\
    \ main 函数或方法来包含这些初始代码。既然其他语言有这些要求，为什么 C# 没有呢？\n\n答案是 C# 确实有这些要求，但 VS Code 在后台自动为我们生成了所谓的顶层语句（top-level\
    \ statements）。这就是 `Program.cs` 文件中新控制台模板注释所指的。尽管我们的应用中只有四行代码，但实际编译的代码将类似于：\n\n\
    ```csharp\nusing System;\n\nnamespace SampleApp\n{\n    internal class Program\n\
    \    {\n        static void Main(string[] args)\n        {\n            Console.Write(\"\
    Please enter your name: \");\n\n            var username = Console.ReadLine();\n\
    \n            Console.WriteLine($\"Hi {username}. Welcome to C#!\");\n       \
    \ }\n    }\n}\n```\n\n上述代码中的 `using` 指令告诉编译器导入 `System` 命名空间，因为文件中的代码依赖于它。接下来，`internal\
    \ class` 被封装在一个名为 `SampleApp` 的命名空间声明中。C# 代码包含类、变量和方法，所有它们都分配了名称。命名空间允许对应用程序代码进行组织，使一个工作区的名称不会与其他工作区的相同名称冲突。在命名空间之外声明的任何内容都是全局命名空间的一部分。\n\
    \n"
