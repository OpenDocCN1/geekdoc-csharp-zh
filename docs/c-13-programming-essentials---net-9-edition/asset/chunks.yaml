  trans: "\n\n运行项目并检查终端中是否有以下输出：\n\nKia Sorento\nAlfa Romeo GTV6\nChevy Spark\nFord\
    \ Explorer\nToyota Celica\n\n## 29.11 删除、复制和移动文件\n\n使用 `File` 类的 `Delete()` 方法可以删除现有文件（`FileInfo`\
    \ 类也提供了类似的选项），调用时传递要删除的文件路径，例如：\n\n```cs\nFile.Delete(\"/Temp/SomeFile.txt\");\n\
    ```\n\n如需将现有文件复制到新文件，请按照如下方式使用 `File.Copy()` 方法：\n\n```cs\nFile.Copy(\"File1.txt\"\
    , \"/Temp/File2.txt\");\n```\n\n`File.Move()` 方法将文件从一个位置移动到另一个位置，包括重命名文件的选项。以下代码在目录之间移动了文件：\n\
    \n```cs\nFile.Move(\"MyFile.txt\", \"/Documents/MyFile.txt\");\n```\n\n在接下来的示例中，`Move()`\
    \ 被用于重命名当前工作目录下的文件：\n\n```cs\nFile.Move(\"oldfilename.txt\", \"newfilename.txt\"\
    );\n```\n\n## 29.12 使用流进行文件 I/O\n\n`File` 类提供了一种以文本块或行向文件写入内容的简单方法。然而，对于更复杂的需求，我们需要使用流。\n\
    \n`StreamReader` 和 `StreamWriter` 类与 `File` 类相比，读写文件具有更高的灵活性和控制力，并且更适合处理大文件。\n\
    \n`Stream` 类允许我们按行或按字符读写文本。例如，以下代码使用 `StreamWriter` 的 `Write()` 和 `WriteLine()`\
    \ 方法分别向流中写入单个字符和行：\n\n```cs\nusing (StreamWriter writer = new(\"MyFile.txt\"))\n\
    {\n    writer.Write('A');\n    writer.Write('B');\n    writer.Write('C');\n  \
    \  writer.WriteLine(\"DEFGHIJKLMNOP\");\n    writer.WriteLine(\"QRSTUVWXYZ\");\n\
    }\n```\n\n注意上述代码中 `using` 语句的使用。`StreamReader` 和 `StreamWriter` 在创建时会分配资源，工作完成后需要释放这些资源。`using`\
    \ 语句确保在完成时调用对应对象的 `Dispose()` 方法以释放分配的资源。或者，必须在流实例上调用 `Dispose()`：\n\n```cs\n\
    writer.Dispose();\n```\n\n```\n以下代码使用 `StreamReader` 的 `ReadLine()` 方法逐行读取 `MyFile.txt`\
    \ 文件的内容：\n\n```cs\nusing (StreamReader reader = new(\"MyFile.txt\"))\n{\n    string\
    \ line;\n    while ((line = reader.ReadLine()) != null)\n    {\n        Console.WriteLine(line);\n\
    \    }\n}\n```\n\n我们可以使用 `StreamReader` 的 `Read()` 方法从文件中读取字符范围。`Read()` 方法有多个重载，允许以不同的方式调用它。例如，以下代码读取并显示了\
    \ `MyFile.txt` 文件中的第一个字符：\n\n```cs\nConsole.WriteLine($\"Char = {(char)reader.Read()}\"\
    );\n```\n\n输出：\nChar = A\n\n`StreamReader` 实例保留一个指向文件中当前位置的指针。上述代码不仅读取了文件的第一个字符，还更新了指针以引用下一个位置。因此，第二次读取操作将返回字符\
    \ ‘B’。\n\n为了避免读取到文件末尾的风险，我们可以使用 `StreamReader` 的 `Peek()` 方法在不读取的情况下查看下一个字符。当\
    \ `Peek()` 返回 -1 时，我们知道当前字符是最后一个：\n\n```cs\nwhile (reader.Peek() >= 0) {\n   \
    \ Console.WriteLine($\"Char = {(char)reader.Read()}\");\n}\n```\n\n`Read()` 方法还可以使用以下语法从指定的索引位置读取指定数量的字符：\n\
    \n`Read( <char array> , <index> , <count> )`\n\n在上述语法中，`<index>` 参数是相对于当前流位置的偏移量，而不是从流的开始。例如，如果流指针当前为\
    \ 2，且传递给 `Read()` 的索引值为 3，则字符将从位置 5 开始读取。\n\n以下代码示例从当前位置开始每三个字符分块读取文件：\n\n```cs\n\
    using (StreamReader reader = new(\"MyFile.txt\"))\n{\n    char[] charBuffer;\n\
    \    while (reader.Peek() >= 0)\n    {\n        charBuffer = new char[3];\n  \
    \      reader.Read(charBuffer, 0, 3);\n        Console.WriteLine(charBuffer);\n\
    \    }\n}\n```\n\n执行上述代码后，将生成以下输出：\n\nABC\nDEF\nGHI\nJKL\nMNO\nP\nQ\nRST\nUVW\n\
    XYZ\n\n在字母 ‘O’ 之后模式被中断，但请记住，这是我们从 `Write()` 切换到 `WriteLine()` 的地方，在 ‘P’ 和 ‘Q’\
    \ 之间引入了换行。\n\n在处理流时，我们可以通过访问读取器的 `BaseStream.Length` 属性获取流的长度：\n\n```cs\nvar length\
    \ = reader. BaseStream.Length;\n```\n\n这在读取整个流时初始化字符缓冲区有用：\n\n```cs\nchar[] charBuffer;\n\
    var length = reader.BaseStream.Length;\nwhile (reader.Peek() >= 0)\n{\n    charBuffer\
    \ = new char[ length ];\n    reader.Read(charBuffer, 0, length);\n    Console.WriteLine(charBuffer);\n\
    }\n```\n\n另一种技术是使用 `ReadToEnd()` 方法获取从当前位置到结束的流内容：\n\n```cs\nstring contents =\
    \ reader.ReadToEnd();\n```\n\n## 29.13 异步文件处理\n\n除了介绍过的同步方法外，`File` 和 `Stream`\
    \ 类还包含异步方法，它们在处理大文件时特别有用。以下是这些异步方法的示例：\n\n- `File.WriteAllLinesAsync()`\n- `File.ReadAllLinesAsync()`\n\
    - `File.WriteAllTextAsync()`\n- `File.ReadAllTextAsync()`\n- `StreamReader.ReadAsync()`\n\
    - `StreamReader.BlockAsync()`\n- `StreamReader.ReadLineAsync()`\n- `StreamReader.ReadToEndAsync()`\n\
    - `StreamWriter.WriteAsync()`\n- `StreamWriter.WriteLineAsync()`\n\n这些方法与同步方法语法相似，但必须带有\
    \ `await` 关键字的上下文中调用。\n\n## 29.14 处理二进制流\n\n在此为止，我们仅处理文本文件。对于二进制文件处理，C# 提供了 `BinaryReader`\
    \ 和 `BinaryWriter` 类。以下示例将字符串、布尔、双精度、整数和字符值写入二进制文件：\n\n```cs\nusing (BinaryWriter\
    \ writer = new(File.Open(\"Binary.dat\", FileMode.Create)))\n{\n    writer.Write(\"\
    Test data\");\n    writer.Write(false);\n    writer.Write(3.57);\n    writer.Write(33);\n\
    \    writer.Write('W');\n}\n```\n\n从二进制流读取数据时，必须按照如下方式调用相应的 `BinaryReader` 方法以匹配数据类型：\n\
    \n```cs\nusing (BinaryReader reader = new(File.Open(\"Binary.dat\", FileMode.Open)))\n\
    {\n    Console.WriteLine(\"String = \" + reader.ReadString());\n    Console.WriteLine(\"\
    Boolean = \" + reader.ReadBoolean());\n    Console.WriteLine(\"Double = \" + reader.ReadDouble());\n\
    \    Console.WriteLine(\"Int = \" + reader.ReadInt32());\n    Console.WriteLine(\"\
    Char = \" + reader.ReadChar());\n}\n```\n\n运行后，上述代码将生成以下输出：\n\nString = Test data\n\
    Boolean = False\nDouble = 3.57\nInt = 33\nChar = W\n\n## 29.15 知识测试\n\n点击下方链接或扫描二维码来测试你对\
    \ C# 字典集合的知识和理解：\n\n[`www.answertopia.com/65dc`](https://www.answertopia.com/65dc)\n\
    \n![img](img/c_-files.png)\n\n## 29.16 总结\n\n本章探讨了使用 System.IO 命名空间中的类在 C# 中进行文件和目录处理。我们涵盖了创建、删除、导航以及处理文件和目录，包括检查存在性、更改当前工作目录以及处理异常。`File`\
    \ 类提供了处理文件的静态方法，而 `FileInfo` 类提供了相同目的的非静态方法。我们还查看了使用 `StreamReader`、`StreamWriter`、`BinaryReader`\
    \ 和 `BinaryWriter` 类进行更复杂的文件处理。\n"
- fmt: "\nStrings are collections of characters that are grouped together to form\
    \ words or sentences. If it wasn’t for humans, computers would probably never\
    \ have anything to do with strings. The fact is, however, that one of the primary\
    \ jobs of a computer is to accept data from and present data to humans. For this\
    \ reason, it is highly likely that any C# program is going to involve a considerable\
    \ amount of code specifically designed to work with data in the form of strings.\n\
    \n## 30.1 Creating the StringsDemo Project\n\nLaunch `VS Code`, open your “C#\
    \ Essentials” workspace folder, and create a new `.NET Console App` project named\
    \ `StringsDemo`.\n\nAfter creating the project, open the `Program.cs` file and\
    \ use it to try out the examples in the rest of this chapter.\n\n## 30.2 Creating\
    \ strings in C#\n\nStrings consist of sequences of characters contained in a string\
    \ object. A string object may be created using a number of different mechanisms.\n\
    \nA string may be declared but not initialized as follows:\n\n```csharp\nstring\
    \ myString;\n```\n\nAlternatively, you can assign a literal value to a string\
    \ in C# using the assignment operator:\n\n```csharp\nstring myString = \"Hello\
    \ World\";\n```\n\nIt is, of course, also possible to declare a string using implicit\
    \ typing:\n\n```csharp\nvar myString = \"Hello World\";\n```\n\nSimilarly, a new\
    \ string may be created using the `new` keyword and passing through the literal\
    \ value to the constructor:\n\n```csharp\nstring myString = new(\"Hello World\"\
    );\n```\n\nString literals are placed within double quotes (as shown above). If\
    \ the string itself contains double quotes, the escape character (`\\`) should\
    \ precede the double-quote characters:\n\n```csharp\nConsole.WriteLine(\"He shouted\
    \ \\\"Can you hear me?\\\"\");\n```\n\nOutput:\n```\nHe shouted \"Can you hear\
    \ me?\"\n```\n\nYou can also instruct C# to treat all the characters in a string\
    \ verbatim by prefixing the string with the `@` character. When using `@` notation,\
    \ everything between the double quotes is treated as a raw string, regardless\
    \ of whether new lines, carriage returns, backslashes, etc., are present in the\
    \ text. For example:\n\n```csharp\nConsole.WriteLine(@\"You can put a backslash\
    \ \\ here\n\nand a new line\n\nand tabs work too.\n\nYou can also put in sequences\
    \ that would normally be seen as escape sequences like \\n and \\t.\");\n```\n\
    \nOutput:\n```\nYou can put a backslash \\ here\n\nand a new line\n\nand tabs\
    \ work too.\n\nYou can also put in sequences that would normally be seen as escape\
    \ sequences like \\n and \\t.\n```\n\nIf you are familiar with the `herodoc` function\
    \ of other programming languages, you will quickly notice that this is essentially\
    \ the C# equivalent.\n\n## 30.3 Obtaining the length of a C# string\n\nIf you\
    \ need to identify the length of a C# string, you can do so by accessing the `Length`\
    \ property of the string object:\n\n```csharp\nstring myString = \"Hello World\"\
    ;\nConsole.WriteLine($\"myString length = {myString.Length}\");\n```\n\nOutput:\n\
    ```\nmyString length = 11\n```\n\n## 30.4 Treating strings as arrays\n\nIt is\
    \ possible to access individual characters in a string by treating the string\
    \ as an array (arrays were covered in [“Creating 2D, 3D, and Jagged Arrays in\
    \ C#”](#Arrays.xhtml__idTextAnchor317) ).\n\nBy specifying the index value using\
    \ subscripting syntax (`[]`), you can access individual characters in a string\
    \ (keeping in mind that the first character is at index position 0):\n\n```csharp\n\
    string myString = \"Hello World\";\nConsole.WriteLine(myString[0]);\n```\n\n##\
    \ 30.5 String iteration\n\nGiven that we can iterate over any collection, we can\
    \ use a `foreach` loop to iterate through each character of a string:\n\n```csharp\n\
    string myString = \"Hello World\";\nforeach (char c in myString)\n{\n    Console.WriteLine(c);\n\
    }\n```\n\nOutput:\n```\nH\ne\nl\nl\no\nW\no\nr\nl\nd\n```\n\n## 30.6 Concatenating\
    \ strings\n\nStrings may be joined together simply by the addition operator (`+`).\
    \ We can, therefore, combine strings as follows:\n\n```csharp\nstring myString\
    \ = \"Hello World.\";\nConsole.WriteLine(myString + \" How are you?\");\n```\n\
    \nOutput:\n```\nHello World. How are you?\n```\n\nAlternatively, you can concatenate\
    \ strings using the `Concat()` instance method of the `string` class. This method\
    \ takes two strings as arguments and returns a new string:\n\n```csharp\nstring\
    \ myString1 = \"If at first you don’t succeed, \";\nstring myString2 = \"try,\
    \ again.\";\nstring myString3 = string.Concat(myString1, myString2);\nConsole.WriteLine(myString3);\n\
    ```\n\nOutput:\n```\nIf at first you don’t succeed, try, again.\n```\n\n## 30.7\
    \ Comparing strings\n\nC# provides several options if you need to compare one\
    \ string with another. The most common option is to use the equality operator,\
    \ as demonstrated in the example below:\n\n```csharp\nstring myString1 = \"Hello\
    \ World\";\nstring myString2 = \"Hello World\";\nif (myString1 == myString2)\n\
    {\n    Console.WriteLine(\"The strings match.\");\n}\nelse\n{\n    Console.WriteLine(\"\
    They not match.\");\n}\n```\n\nOutput:\n```\nThe strings match\n```\n\nYou can\
    \ also compare strings in a similar way using the `Equals()` method. This method\
    \ takes two strings to be compared and returns a Boolean result indicating whether\
    \ the strings match:\n\n```csharp\nstring myString1 = \"Hello world\";\nstring\
    \ myString2 = \"Hello world\";\nif (string.Equals(myString1, myString2))\n{\n\
    \    Console.WriteLine(\"The strings match.\");\n}\nelse\n{\n    Console.WriteLine(\"\
    The strings do not match.\");\n}\n```\n\nOutput:\n```\nThe strings match\n```\n\
    \nIn the above example, we passed both strings through the `Equals()` method.\
    \ The `Equals()` method can also be called on a string literal or string object\
    \ to achieve the same result:\n\n```csharp\nstring myString1 = \"Hello world\"\
    ;\nstring myString2 = \"Hello world\";\nif (myString1.Equals(myString2, StringComparison.Ordinal))\n\
    {\n    Console.WriteLine(\"The strings match.\");\n}\nelse\n{\n    Console.WriteLine(\"\
    The strings do not match.\");\n}\n```\n\nOutput:\n```\nThe strings match\n```\n\
    \nSo far, all of the comparisons we have explored performed a case-sensitive comparison.\
    \ When calling the `Equals()` method, you can also pass through a comparison type\
    \ parameter. The type must be taken from the C# `StringComparison` enumeration,\
    \ which, among values for performing culture-sensitive comparison settings, includes\
    \ the `OrdinalIgnoreCase` value for case-insensitive comparisons:\n\n```csharp\n\
    string myString1 = \"HELLO WORLD\";\nstring myString2 = \"Hello world\";\nif (string.Equals(myString1,\
    \ myString2, StringComparison.OrdinalIgnoreCase))\n{\n    Console.WriteLine(\"\
    The strings match.\");\n}\nelse\n{\n    Console.WriteLine(\"The strings do not\
    \ match.\");\n}\n```\n\nOutput:\n```\nThe strings match\n```\n\nThe same approach\
    \ also works when calling the `Equals()` method directly on a string literal or\
    \ object:\n\n```csharp\nvar result = \"My String\".Equals(\"my string\", StringComparison.OrdinalIgnoreCase);\n\
    ```\n"
  raw: 'Strings are collections of characters that are grouped together to form words
    or sentences. If it wasn’t for humans, computers would probably never have anything
    to do with strings. The fact is, however, that one of the primary jobs of a computer
    is to accept data from and present data to humans. For this reason, it is highly
    likely that any C# program is going to involve a considerable amount of code specifically
    designed to work with data in the form of strings.


    30.1 Creating the StringsDemo Project


    Launch VS Code, open your “C# Essentials” workspace folder, and create a new .NET
    Console App project named StringsDemo.


    After creating the project, open the Program.cs file and use it to try out the
    examples in the rest of this chapter.


    30.2 Creating strings in C#


    Strings consist of sequences of characters contained in a string object. A string
    object may be created using a number of different mechanisms.


    A string may be declared but not initialized as follows:


    string myString;


    Alternatively, you can assign a literal value to a string in C# using the assignment
    operator:


    string myString = "Hello World";


    It is, of course, also possible to declare a string using implicit typing:


    var myString = "Hello World";


    Similarly, a new string may be created using the new keyword and passing through
    the literal value to the constructor:


    string myString = new("Hello World");


    String literals are placed within double quotes (as shown above). If the string
    itself contains double quotes, the escape character (\) should precede the double-quote
    characters:


    Console.WriteLine("He shouted \"Can you hear me?\"");


    Output:


    He shouted "Can you hear me?"


    You can also instruct C# to treat all the characters in a string verbatim by prefixing
    the string with the @ character. When using @ notation, everything between the
    double quotes is treated as a raw string, regardless of whether new lines, carriage
    returns, backslashes, etc., are present in the text. For example:


    Console.WriteLine(@"You can put a backslash \ here


    and a new line


    and tabs work too.


    You can also put in sequences that would normally be seen as escape sequences
    like \n and \t.");


    Output:


    You can put a backslash \ here


    and a new line


    and tabs work too.


    You can also put in sequences that would normally be seen as escape sequences
    like \n and \t.


    If you are familiar with the heredoc function of other programming languages,
    you will quickly notice that this is essentially the C# equivalent.


    30.3 Obtaining the length of a C# string


    If you need to identify the length of a C# string, you can do so by accessing
    the Length property of the string object:


    string myString = "Hello World";


    Console.WriteLine($"myString length = {myString.Length}");


    Output:


    myString length = 11


    30.4 Treating strings as arrays


    It is possible to access individual characters in a string by treating the string
    as an array (arrays were covered in [“Creating 2D, 3D, and Jagged Arrays in C#”](#Arrays.xhtml__idTextAnchor317)
    ).


    By specifying the index value using subscripting syntax ([]), you can access individual
    characters in a string (keeping in mind that the first character is at index position
    0):


    string myString = "Hello World";


    Console.WriteLine(myString[0]);


    Console.WriteLine(myString[2]);


    Console.WriteLine(myString[4]);


    Output:


    H


    l


    o


    It is important to note that strings are immutable (in other words, while an entirely
    new string literal may be assigned to the variable, you cannot change the individual
    characters in a string). To experience this limitation, try running the following
    code:


    string myString = "Hello World";


    myString[5] = ''-'';


    When attempting to run the above code, you will have received an error from the
    compiler stating the following:


    Property or indexer ''string.this[int]'' cannot be assigned to -- it is read only


    It is also possible to convert a string to an array of characters by making a
    call to the string object’s ToCharArray() method as follows:


    string myString = "Hello World";


    char[] charArray = myString.ToCharArray();


    foreach (char c in charArray) {


    Console.WriteLine(c);


    }


    Output:


    H


    e


    l


    l


    o


    W


    o


    r


    l


    d


    30.5 String character iteration


    Given that we can treat each character in an array as an array element, it should
    not surprise you to learn that we can iterate through the characters of a string
    using a foreach loop as follows:


    string myString = "Hello World";


    foreach (char c in myString) {


    Console.WriteLine(c);


    }


    Output:


    G


    o


    o


    d


    b


    y


    e


    W


    o


    r


    l


    d


    30.6 Concatenating strings


    Strings may be concatenated (i.e., joined together) simply by adding them together
    using the addition operator (+).


    We can, therefore, combine two strings as follows:


    string myString = "Hello World.";


    Console.WriteLine(myString + " How are you?");


    Output:


    Hello World. How are you?


    Alternatively, you can concatenate strings using the Concat() instance method
    of the string class. This method takes two strings to be joined as arguments and
    returns a new string containing the union of the two strings:


    string myString1 = "If at first you don’t succeed, ";


    string myString2 = "try, try again.";


    string myString3 = string.Concat(myString1, myString2);


    Console.WriteLine(myString3);


    Output:


    If at first you don’t succeed, try, try again.


    30.7 Comparing strings


    C# provides several options if you need to compare one string with another. The
    most common option is to use the equality operator, as demonstrated in the example
    below:


    string myString1 = "Hello World";


    string myString2 = "Hello World";


    if (myString1 == myString2)


    {


    Console.WriteLine("The strings match.");


    }


    else


    {


    Console.WriteLine("They strings not match.");


    }


    Output:


    The strings match


    You can also compare strings in a similar way using the string.Equals() instance
    method. This method takes as arguments two strings to be compared and returns
    a Boolean result indicating whether or not the strings match:


    string myString1 = "Hello world";


    string myString2 = "Hello world";


    if (string.Equals(myString1, myString2))


    {


    Console.WriteLine("The strings match.");


    }


    else


    {


    Console.WriteLine("The strings do not match.");


    }


    Output:


    The strings match.


    In the above example, we passed both strings through to the Equals() method when
    performing the comparison. The Equals() method can also be called on a string
    literal or string object to achieve the same result:


    string myString1 = "Hello world";


    string myString2 = "Hello world";


    if (myString1.Equals(myString2, StringComparison.Ordinal))


    {


    Console.WriteLine("The strings match.");


    }


    else


    {


    Console.WriteLine("The strings do not match.");


    }


    Output:


    The strings match.


    So far, all of the comparisons we have explored have performed a case-sensitive
    comparison. When calling the Equals() method, you can also pass through a comparison
    type parameter. The type must be taken from the C# StringComparison enumeration,
    which, among values for performing culture-sensitive comparison settings, includes
    the OrdinalIgnoreCase value for case-insensitive comparisons:


    string myString1 = "HELLO WORLD";


    string myString2 = "Hello world";


    if (string.Equals(myString1, myString2, StringComparison.OrdinalIgnoreCase))


    {


    Console.WriteLine("The strings match.");


    }


    else


    {


    Console.WriteLine("The strings do not match.");


    }


    Output:


    The strings match.


    The same approach also works when calling the Equals() method directly on a string
    literal or object:


    var result = "My String".Equals("my string", StringComparison.OrdinalIgnoreCase);'
