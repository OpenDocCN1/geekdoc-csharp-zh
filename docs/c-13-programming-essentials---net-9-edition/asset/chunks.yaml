    \ and subclassing in the way that classes do. In other words, it is not possible\
    \ for one structure to inherit from another structure. Unlike classes, structures\
    \ also cannot contain a finalizer method. Structure members cannot be specified\
    \ as abstract, virtual, or protected. Structures can, however, implement interfaces.\n\
    \n20.5 Read-only structures\n\nStructures can be declared as being read-only using\
    \ the readonly modifier. When declared in this way, all data members of the structure\
    \ must also be declared as being read-only. In the case of field members, this\
    \ requires the use of the readonly modifier. Properties, on the other hand, must\
    \ either be declared as readonly or use the init-only accessors (a topic covered\
    \ in the chapter entitled [“An Introduction to C# Object-Oriented Programming”](#Object_Orientated_Programming.xhtml__idTextAnchor159)\
    \ ).\n\nThe following structure, for example, includes both a read-only field\
    \ and an init-only property:\n\nnamespace StructureDemo;\n\npublic readonly struct\
    \ SampleStruct(string name)\n\n{\n\nprivate readonly string _name = name;\n\n\
    public string Name {\n\nget => _name;\n\n}\n\npublic string BuildHelloMsg() {\n\
    \nreturn \"Hello \" + _name;\n\n}\n\n}\n\n20.6 Take the knowledge test\n\nClick\
    \ the link below or scan the QR code to test your knowledge and understanding\
    \ of C# structures:\n\n[https://www.answertopia.com/i5tf](https://www.answertopia.com/i5tf)\n\
    \n![img](image/c_-structures.png) \n\n20.7 Summary\n\nC# structures and classes\
    \ provide a mechanism for creating instances that define properties, store values,\
    \ and define methods. Although the two mechanisms appear similar, significant\
    \ behavioral differences exist, especially when structure and class instances\
    \ are copied or passed to a method. Classes are categorized as reference-type\
    \ instances, while structures are value-type. When a structure instance is copied\
    \ or passed, an entirely new copy of the instance is created containing its own\
    \ data. On the other hand, class instances are passed and copied by reference,\
    \ with each reference pointing to the same class instance. Other features unique\
    \ to classes include support for inheritance and finalizers.\n\n21\\. C# Tuple\
    \ Type\n\nIn the [“C# Methods”](#Methods.xhtml__idTextAnchor183) chapter, we learned\
    \ how to create methods in C# that can pass arguments and return results. This\
    \ chapter will focus on the C# tuple type and understand how it combines collections\
    \ of values into a single entity. Once created, a tuple can be passed from one\
    \ method to another while allowing methods to return multiple results in a single\
    \ return value. Tuples can be created with minimal coding and can store data of\
    \ any type. Additionally, the values stored within a tuple are not required to\
    \ be the same type.\n\n21.1 Creating the TupleDemo project\n\nTo try out the C#\
    \ tuple type, launch VS Code, open your “C# Essentials” workspace folder and create\
    \ a new .NET Console App project named TupleDemo.\n\n21.2 Declaring a Tuple\n\n\
    When we declare a tuple we need to provide it with the values to be stored and,\
    \ optionally, the corresponding value types. The syntax for declaring a tuple\
    \ is as follows:\n\n(<type1>, <type2>, ...) <tuplename> = (<value1>, <value2>,\
    \ ...)\n\nFor example, modify the Program.cs file as follows, to add the top-level\
    \ statements, the Main() method, and a method named GetProductData() that contains\
    \ a tuple declaration:\n\nnamespace TupleDemo\n\n{\n\ninternal class Program\n\
    \n{\n\nstatic void Main(string[] args)\n\n{\n\nGetProductData();\n\n}\n\nprivate\
    \ static void GetProductData()\n\n{\n\n(int, string, double) myTuple = (10, \"\
    Refrigerator\", 432.43);\n\n}\n\n}\n\n}\n\nIf you prefer not to declare the type\
    \ of each tuple value, the var keyword may be used to tell the compiler to infer\
    \ the value types:\n\nvar myTuple = (10, \"Refrigerator\", 432.43);\n\n21.3 Accessing\
    \ tuple values\n\nThe elements of a tuple can be accessed using several different\
    \ techniques. A specific tuple value may be accessed using dot notation to access\
    \ Item<n> where <n> is the number of the item (with the first value being at position\
    \ 1). The code below, for example, extracts item 2 from the tuple, assigns it\
    \ to a variable and writes it to the console:\n\nprivate static void GetProductData()\n\
    \n{\n\nvar myTuple = (10, \"Refrigerator\", 432.43);\n\nvar item2 = myTuple.Item2;\n\
    \nConsole.WriteLine(item2);\n\n}\n\nAn alternative to accessing tuple elements\
    \ by item number is to use field names.\n\n21.4 Tuple field names\n\nWhen creating\
    \ a tuple, you can assign a name to each value. The names assigned to the values\
    \ stored in a tuple can then be used when you reference those values in code,\
    \ for example:\n\n(int Count, string Product, double Price) myTuple = (10, \"\
    Refrigerator\", 432.43);\n\nWhen using type inference to initialize a tuple, the\
    \ field names are placed before each value:\n\nvar myTuple = (Count: 10, Product:\
    \ \"Refrigerator\", Price: 432.43);\n\nOnce field names have been assigned, the\
    \ corresponding values are accessed using dot notation, as demonstrated in the\
    \ code changes below:\n\nprivate static void GetProductData()\n\n{\n\nvar myTuple\
    \ = (Count: 10, Product: \"Refrigerator\", Price: 432.43);\n\nConsole.WriteLine($\"\
    myTuple Price = { myTuple.Price}\");\n\nConsole.WriteLine($\"myTuple Product =\
    \ { myTuple.Product}\");\n\nConsole.WriteLine($\"myTuple Quantity = { myTuple.Count}\"\
    );\n\n}"
