    \ of C# methods:\n[https://www.answertopia.com/r67i](https://www.answertopia.com/r67i)\n\
    \n![img](image/c_-methods.png)\n\n### 14.13 Summary\nC# methods are self-contained\
    \ units of code that perform a specific task. They help structure code and facilitate\
    \ code reuse. This chapter discussed C# methods and explained how to create and\
    \ invoke them. We also described how to add parameters to a method and differentiate\
    \ between named and optional arguments. Finally, we learned when to use the `in`,\
    \ `out`, and `ref` parameter modifiers and the difference between passing arguments\
    \ to a method by value and reference.\n\n# 15. C# Delegates\nThis chapter will\
    \ continue exploring C# methods by introducing the concepts of C# delegates, including\
    \ what they are and how to use them.\n\n### 15.1 What is a delegate?\nBefore we\
    \ start exploring C# delegates, it helps to understand the concept of method signatures.\
    \ When a method is declared, the parameters it accepts and the result type it\
    \ returns make up the method’s signature. The signature of the following method\
    \ indicates that it accepts a string value as a parameter and returns an integer:\n\
    \n```csharp\npublic int GetLength(string value) {\n    // ...\n}\n```\n\nThe following\
    \ method performs an entirely different task but has the identical signature as\
    \ the above `GetLength()` method:\n\n```csharp\npublic int CustomerCount(string\
    \ customer) {\n    // ...\n}\n```\n\nA C# delegate is a variable that stores a\
    \ reference to a method. If you are familiar with C or C++ programming, delegates\
    \ are similar to function pointers. Once declared, the delegate can be changed\
    \ to point to any method that matches the delegate’s method signature.\n\n###\
    \ 15.2 Declaring a delegate\nDelegates are declared using the `delegate` keyword\
    \ and the following syntax:\n`delegate <returntype> <delegatename> (<parameters>);`\n\
    \nTo declare a delegate that matches our two example methods (a string parameter\
    \ and an integer return type), we would write the following:\n\n```csharp\npublic\
    \ delegate string MyDelegate (string s);\n```\n\n### 15.3 Using delegates\nWith\
    \ a delegate declared, we can use it to store references to methods. Delegate\
    \ instances are created using the `new` keyword, passing through the method to\
    \ be referenced, for example:\n\n```csharp\npublic delegate string MyDelegate\
    \ (string s);\n\nMyDelegate delegate1 = new MyDelegate(GetLength);\nMyDelegate\
    \ delegate2 = new MyDelegate(CustomerCount);\n```\n\nIn the above code, we have\
    \ created two delegate instances, each pointing to one of our example methods.\
    \ Once declared, these can be called just like any other method:\n\n```csharp\n\
    var strlen = delegate1(\"This is some text\");\nvar count = delegate2(\"Robert\
    \ Addison\");\n```\n\n### 15.4 Creating the DelegateDemo project\nLaunch VS Code,\
    \ open your “C# Essentials” workspace folder, and create a new .NET Console App\
    \ project named `DelegateDemo`.\n\n### 15.5 A C# delegate example\nIn this example,\
    \ we will create a delegate called `StringConverter`. Begin by editing the `Program.cs`\
    \ file as follows:\n\n```csharp\nnamespace DelegateDemo\n{\n    internal class\
    \ Program\n    {\n        delegate string StringConverter(string value);\n\n \
    \       static string LowerCase(string value)\n        {\n            Console.Write(\"\
    Converting to lowercase > \");\n            return value.ToLower();\n        }\n\
    \n        static string UpperCase(string value)\n        {\n            Console.Write(\"\
    Converting to uppercase > \");\n            return value.ToUpper();\n        }\n\
    \n        static void Main(string[] args)\n        {\n        }\n    }\n}\n```\n\
    \nThe above changes declare a delegate named `StringConverter` that can be used\
    \ to reference any method that accepts and returns a string value. Next, we declared\
    \ two methods matching this signature, `LowerCase()` and `UpperCase()`. The next\
    \ step is to add code the `Main()` method to use these delegates:\n\n```csharp\n\
    static void Main(string[] args)\n{\n    StringConverter converter1 = new(LowerCase);\n\
    \    StringConverter converter2 = new(UpperCase);\n\n    var lower = converter1(\"\
    This is some TEXT\");\n    Console.WriteLine(lower);\n\n    var upper = converter2(\"\
    tHis IS sOmE TExt\");\n    Console.WriteLine(upper);\n}\n```\n\nThe `Main()` method\
    \ creates two delegate instances, each referencing one of the methods. These methods\
    \ are then called via the delegates, and the resulting strings are displayed in\
    \ the console:\n\nConverting to lowercase > this is some text\nConverting to uppercase\
    \ > THIS SOME TEXT\n\nSince the delegate is a variable, a different method may\
    \ be assigned at any time. In the above example, `converter1` and `converter2`\
    \ are single delegates in that they reference one method each. It is also possible\
    \ to create multicast delegates.\n\n### 15.6 Multicast delegates\nA multicast\
    \ delegate contains more than one delegate, allowing it to reference multiple\
    \ methods. Multicast delegates are created by combining existing delegates using\
    \ the `+` operator.\n\nThe following changes to our `Main()` method create a delegate\
    \ named `multicast` comprising both `converter1` and `converter2`:\n\n```csharp\n\
    static void Main(string[] args)\n{\n    StringConverter converter1 = new(LowerCase);\n\
    \    StringConverter converter2 = new(UpperCase);\n\n    StringConverter multicast\
    \ = converter1 + converter2;\n\n    var result = multicast(\"This is some TEXT\"\
    );\n    Console.WriteLine(result);\n}\n```\n\nWhen the code is executed, we will\
    \ see from the console output that both the `LowerCase()` and `UpperCase()` methods\
    \ were called via the single multicast delegate call:\n\nConverting to lowercase\
    \ > Converting to uppercase > THIS IS SOME TEXT\n\nDelegates can be removed from\
    \ a multicast delegate using the `-=` operator. The following changes adapt the\
    \ above example to remove `converter2` from multicast after the first call:\n\n\
    ```csharp\nstatic void Main(string[] args)\n{\n    StringConverter converter1\
    \ = new(LowerCase);\n    StringConverter converter2 = new(UpperCase);\n\n    StringConverter\
    \ multicast = converter1 + converter2;\n\n    var result = multicast(\"This is\
    \ some TEXT\");\n    Console.WriteLine(result);\n\n    multicast -= converter2;\n\
    \n    result = multicast(\"AfTeR reMovAL oF converter2\");\n    Console.WriteLine(result);\n\
    }\n```\n"
