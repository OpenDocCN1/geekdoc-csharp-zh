    \n### 13.18 Summary\n\nObject-oriented programming languages like C# promote the\
    \ creation of classes to encourage code reuse and data encapsulation. In this\
    \ chapter, we have covered the fundamental concepts of classes and instances within\
    \ C# and explained concepts such as class members, constructors, finalizers, properties,\
    \ fields, and methods.\n\n# 14. C# Methods\n\nThe previous chapter began the introduction\
    \ to object-oriented programming in C# and included the use of methods declared\
    \ within classes. This chapter will explore C# methods in more detail, including\
    \ how they are declared and called, passing arguments, and returning results.\
    \ The topic of passing arguments by reference and value will also be explained.\n\
    \nC# methods are vital to writing well-structured and efficient code. They provide\
    \ a way to organize programs while avoiding code repetition. In this chapter,\
    \ we will examine how methods are declared and used within C#.\n\n### 14.1 What\
    \ is a method?\n\nA method is a named block of code that can be called upon to\
    \ perform a specific task. It can be passed data on which to perform the task\
    \ and return results to the code that called it. For example, if a particular\
    \ arithmetic calculation needs to be performed in a C# program, the code to perform\
    \ the arithmetic can be placed in a method. The method can be programmed to accept\
    \ the values on which the arithmetic is to be performed (referred to as parameters)\
    \ and return results.\n\n### 14.2 Methods vs. functions\n\nYou may have heard\
    \ about or used functions if you are familiar with other programming languages.\
    \ Generally, functions are declared the same way as methods and fulfill the same\
    \ purpose. The difference is that methods must be declared within a class, while\
    \ functions are declared outside a class. In terms of C#, it is only possible\
    \ to declare methods within a class, and the concept of functions does not exist.\n\
    \n### 14.3 Parameter or argument?\n\nThe terms parameter and argument are often\
    \ used interchangeably when discussing methods. However, there is a subtle difference.\
    \ The values a method can accept when it is called are parameters. When the method\
    \ is called and passed those values, they are referred to as arguments.\n\n###\
    \ 14.4 How to declare a C# function\n\nA C# function is declared using the following\
    \ syntax:\n\n```csharp\n<access> <return type> <method name>(<para type> <para\
    \ name>, <para type> <para name>, ...){\n    // Method code\n}\n```\n\nExplanations\
    \ of the various fields of the function declaration are as follows:\n\n- `<access>`:\
    \ Defines the level of access to the method from other parts of the code. Valid\
    \ values are `public`, `private`, or `protected`, as explained in the previous\
    \ chapter.\n- `<return type>`: The data type of the result returned by the function.\
    \ If the function does not return a result, then this is set to `void`.\n- `<method\
    \ name>`: The name assigned to the method. This is the name by which the method\
    \ will be referenced when it is called from within the application code.\n- `<para\
    \ type>`: The type of the corresponding parameter.\n- `<para name>`: The name\
    \ by which the parameter is referenced in the method code.\n- `Method code`: The\
    \ code statements of the method that perform the work.\n\nAs an example, the following\
    \ method takes no parameters, returns no result, and displays a message:\n\n```csharp\n\
    public void sayHello() {\n    Console.WriteLine(\"Hello\");\n}\n```\n\nThe following\
    \ sample function, on the other hand, takes an `int` and a `string` as parameters\
    \ and returns a `string` result:\n\n```csharp\npublic string BuildMessage(string\
    \ name, int count) {\n    return($\"{name}, you are customer number {count}\"\
    );\n}\n```\n\n### 14.5 Creating the MethodDemo project\n"
