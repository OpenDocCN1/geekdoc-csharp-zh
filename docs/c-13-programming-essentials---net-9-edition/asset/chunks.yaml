  trans: "\n\n启动 VS Code，打开你的“C# Essentials”工作区文件夹，并创建一个名为 `FileDemo` 的新 .NET 控制台项目。一旦项目准备就，打开\
    \ `Program.cs` 文件并使用它来尝试本章节其余的代码示例。\n\n## 29.4 当前工作目录\n\n应用程序的初始当前工作目录是启动它的目录，可以使用\
    \ `Directory` 类进行识别。编辑 `Program.cs` 文件并使用静态方法 `Directory.GetCurrentDirectory()`，如下所示：\n\
    \n```csharp\nstring currentDirectory = Directory.GetCurrentDirectory();\nConsole.WriteLine(currentDirectory);\n\
    ```\n\n点击运行按钮并检查终端输出，其中将显示当前目录。例如：\n\n`/Users/neilsmyth/Documents/Books/C#_13/C#\
    \ Essentials/FileDemo`\n\n## 29.5 检查目录是否存在\n\n`Directory` 和 `DirectoryInfo` 类都提供了一种识别指定路径是否存在目录的方法。以下代码检查名为\
    \ `MyFiles` 的目录是否存在。请注意，由于我们没有在路径开头加上“/”或“\\”，该目录名是相对于当前工作目录的：\n\n```csharp\n\
    if (Directory.Exists(\"MyFiles\"))\n{\n    Console.WriteLine(\"Directory Exists.\"\
    );\n}\nelse\n{\n    Console.WriteLine(\"Directory does not exist.\");\n}\n```\n\
    \n通过创建一个初始化目录路径的 `DirectoryInfo` 实例并访问其 `Exists` 属性也可以实现相同的结果：\n\n```csharp\n\
    DirectoryInfo dirInfo = new(\"MyFiles\");\nif ( dirInfo.Exists )\n{\n    Console.WriteLine(\"\
    Directory Exists.\");\n}\nelse\n{\n    Console.WriteLine(\"Directory does not\
    \ exist.\");\n}\n```\n\n## 29.6 创建目录\n\n识别出目录不存在后，下一步是创建它。在 C# 中使用 `Directory.CreateDirectory()`\
    \ 静态方法或 `DirectoryInfo` 对象的 `Create()` 方法来创建目录，例如：\n\n```csharp\nif (Directory.Exists(\"\
    MyFiles\"))\n{\n    Console.WriteLine(\"Directory Exists.\");\n}\nelse\n{\n  \
    \  Console.WriteLine(\"Directory does not exist - creating...\");\n    Directory.CreateDirectory(\"\
    MyFiles\");\n}\n\nDirectoryInfo dirInfo = new(\"MyFiles\");\nif (dirInfo.Exists)\n\
    {\n    Console.WriteLine(\"Directory Exists.\");\n}\nelse\n{\n    Console.WriteLine(\"\
    Directory does not exist - creating...\");\n    dirInfo.Create();\n}\n```\n\n\
    当代码运行时，第一个语句将检测到目录不存在并创建它，第二个语句将报告该目录现在存在：\n\n```\nDirectory does not exist -\
    \ creating...\nDirectory Exists.\n```\n\n## 29.7 删除目录\n\n使用 `Directory` 类的 `Delete()`\
    \ 方法删除现有的目录，并将要删除的目录路径作为参数传递，例如：\n\n```csharp\nDirectory.Delete(\"/Temp/Images\"\
    );\n```\n\n如果目录包含文件或其他子目录，上述方法调用将触发 I/O 异常，表示目录非为空。要覆盖此异常并删除该目录及其所有文件和子目录，请如下所示传递一个布尔值\
    \ `true`：\n\n```csharp\nDirectory.Delete(\"/Temp/Images\", true);\n```\n\n## 29.8\
    \ 修改当前工作目录\n\n通过调用 `Directory.SetCurrentDirectory()` 方法并传递目标目录作为参数可以更改当前工作目录。与所有目录相关的操作一样，提供的路径可以是绝对路径或相对路径。将以下行添加到\
    \ `Program.cs` 文件中将目录更改到 `MyFiles` 文件夹：\n\n```csharp\nDirectory.SetCurrentDirectory(\"\
    MyFiles\");\nConsole.WriteLine(Directory.GetCurrentDirectory());\n```\n\n运行代码并确认当前目录已更改为\
    \ `MyFiles` 子目录，例如：\n\n`/Users/neilsmyth/Dropbox/Documents/Books/C#_13/C# Essentials/FileDemo/MyFiles`\n\
    \n## 29.9 处理文件和目录异常\n\n在 C# 中处理文件和目录时，重要的是许多操作都有抛出异常的可能。例如，考虑上述更改当前工作目录的代码。该示例之所以有效，是因为我们检查了\
    \ `MyFiles` 目录是否存在，并在必要时创建了它。然而，如果目录不存在，结果将不同。要查看此效果，请向项目添加以下代码：\n\n```csharp\n\
    Directory.SetCurrentDirectory(\"MyFiles1\");\n```\n\n点击运行按钮，此时程序将带有以下未处理的 `DirectoryNotFoundException`\
    \ 错误终止：\n\n```\nUnhandled exception. System.IO.DirectoryNotFoundException: Could\
    \ not find a part of the path '/temp/MyFiles1'.\nat Interop.ThrowExceptionForIoErrno(ErrorInfo\
    \ errorInfo, String path, Boolean isDirError)\n```\n\n为了避免未处理的异常，必须对文件和目录的处理进行防御性编码（例如，在引用之前检查目录或文件是否存在），或者在类似下面的\
    \ try-catch 语句中执行：\n\n```csharp\ntry\n{\n    Directory.SetCurrentDirectory(\"\
    MyFiles1\");\n}\ncatch (Exception ex)\n{\n    Console.WriteLine($\"{ex.Message}\"\
    );\n}\n```\n\n## 29.10 使用 File 类处理文件\n\n在涵盖 C# 目录处理的基础之后，是时候查看文件操作了。`System.IO.File`\
    \ 类提供了一系列处理文件的静态方法，包括创建、删除、复制、读取和写入。`FileInfo` 类提供了对等的方法。\n\n### 29.10.1 检查文件是否存在\n\
    \n与目录一样，我们可以通过调用 `File.Exists()` 方法来检查指定路径是否存在文件：\n\n```csharp\nif (File.Exists(\"\
    /tmp/MyFile.txt\"))\n{\n}\n```\n\n### 29.10.2 创建并打开文件\n\n我们还可以使用 `File.Open()`\
    \ 方法结合 `FileMode` 值来创建和打开文件：\n\n```csharp\nvar myFile = File.Open(<path>, FileMode.<mode>);\n\
    ```\n\n打开文件可以使用以下模式：\n- `Append`：如果文件存在则打开它，否则则创建一个新的。随后的写入操作将追加到文件内容之后。\n- `Create`：创建一个新文件，如果已存在则覆盖它。\n\
    - `CreateNew`：尝试创建一个新文件，如果文件已存在则抛出异常。\n- `Open`：打开已存在的文件，如果不存在则抛出异常。\n- `OpenOrCreate`：如果文件存在则打开，否则创建一个新文件。\n\
    - `Truncate`：打开现有文件并将其截断为零长度。\n\n要创建一个新文件并在已存在时覆盖它，可以使用以下代码：\n\n```csharp\nFile.Open(\"\
    MyFile.txt\", FileMode.Create);\n```\n\n### 29.10.3 使用 File 类读取和写入\n\n`WriteAllText()`\
    \ 方法将字符串写入指定的文件。如果文件已存在，它将被覆盖，否则将创建一个文件。相反，`ReadAllText()` 方法读取指定文件的内容并作为字符串值返回。以下代码向名为\
    \ `MyFile.txt` 的文件写入字符串后进行读取：\n\n```csharp\nFile.WriteAllText(\"MyFile.txt\",\
    \ \"Hello, this is some text.\");\nstring content = File.ReadAllText(\"MyFile.txt\"\
    );\nConsole.WriteLine($\"content = {content}\");\n```\n\n当代码执行时，终端将显示：\n\n```\n\
    content = Hello, this is some text.\n```\n\n向现有文件追加文本，我们调用 `AppendAllText()` 方法如下：\n\
    \n```csharp\nFile.WriteAllText(\"MyFile.txt\", \"Hello, this is some text.\");\n\
    File.AppendAllText(\"MyFile.txt\", \" This is more text.\");\nstring content =\
    \ File.ReadAllText(\"MyFile.txt\");\nConsole.WriteLine($\"content = {content}\"\
    );\n```\n\n结果终端输出如下：\n\n```\ncontent = Hello, this is some text. This is more\
    \ text.\n```\n\n要一次性向文件写入多行文本，请将行放在列表集合中并传递给 `WriteAllLines()` 方法：\n\n```csharp\n\
    List<string> textList = [\"Kia Sorento\", \"Alfa Romeo GTV6\", \"Chevy Spark\"\
    , \"Ford Explorer\", \"Toyota Celica\"];\nFile.WriteAllLines(\"MyFile.txt\", textList);\n\
    ```\n\n`ReadAllLines()` 方法读取文件的内容并将行作为字符串数组返回：\n\n```csharp\nstring[] readList\
    \ = File.ReadAllLines(\"MyFile.txt\");\nforeach (string line in readList) {\n\
    \    Console.WriteLine(line);\n}\n```\n\n"
- fmt: "\nRun the project and check for the following output in the terminal:\n\n\
    Kia Sorento\nAlfa Romeo GTV6\nChevy Spark\nFord Explorer\nToyota Celica\n\n##\
    \ 29.11 Deleting, copying, and moving files\n\nExisting files are deleted using\
    \ the `Delete()` method of the `File` class (similar options are available in\
    \ the `FileInfo` class), passing through the path of the file to be deleted, for\
    \ example:\n\n```cs\nFile.Delete(\"/Temp/SomeFile.txt\");\n```\n\nTo copy an existing\
    \ file to a new file use the `File.Copy()` method as follows:\n\n```cs\nFile.Copy(\"\
    File1.txt\", \"/Temp/File2.txt\");\n```\n\nThe `File.Move()` method moves a file\
    \ from one location to another, including the option to rename the file. The following\
    \ code moves a file between directories:\n\n```cs\nFile.Move(\"MyFile.txt\", \"\
    /Documents/MyFile.txt\");\n```\n\nIn the following example, `Move()` is used to\
    \ rename a file in the current working directory:\n\n```cs\nFile.Move(\"oldfilename.txt\"\
    , \"newfilename.txt\");\n```\n\n## 29.12 File I/O with streams\n\nThe `File` class\
    \ provides a simple way to write content to files as blocks or lines of text.\
    \ For more complex requirements, however, we need to use streams.\n\nThe `StreamReader`\
    \ and `StreamWriter` classes are used to read from and write to files with greater\
    \ flexibility and control compared to the `File` class and are also better suited\
    \ for working with large files.\n\nThe `Stream` classes allow us to read and write\
    \ text by line or character. The following code, for example, uses the `StreamWriter`\
    \ `Write()` and `WriteLine()` methods to write individual characters and lines\
    \ to the stream, respectively:\n\n```cs\nusing (StreamWriter writer = new(\"MyFile.txt\"\
    ))\n{\n    writer.Write('A');\n    writer.Write('B');\n    writer.Write('C');\n\
    \    writer.WriteLine(\"DEFGHIJKLMNOP\");\n    writer.WriteLine(\"QRSTUVWXYZ\"\
    );\n}\n```\n\nNote the use of the `using` statement in the above code. `StreamReader`\
    \ and `StreamWriter` allocate resources when they are created which need to be\
    \ released when the work is complete. The `using` statement ensures the `Dispose()`\
    \ method is called on the corresponding object on completion to free the allocated\
    \ resources. Alternatively, the `Dispose()` must be called on the stream instance:\n\
    \n```cs\nwriter.Dispose();\n```\n\nThe following code reads the content of the\
    \ `MyFile.txt` file line by line using the `StreamReader` `ReadLine()` method:\n\
    \n```cs\nusing (StreamReader reader = new(\"MyFile.txt\"))\n{\n    string line;\n\
    \    while ((line = reader.ReadLine()) != null)\n    {\n        Console.WriteLine(line);\n\
    \    }\n}\n```\n\nWe can use the `StreamReader` `Read()` method to read ranges\
    \ of characters from a file. The `Read()` method has several overrides that allow\
    \ it to be called in different ways. The following code, for example, reads and\
    \ displays the first character from our `MyFile.txt` file:\n\n```cs\nConsole.WriteLine($\"\
    Char = {(char)reader.Read()}\");\n```\n\nOutput:\nChar = A\n\n`StreamReader` instances\
    \ retain a pointer indicating the current position in the file. The above code\
    \ not only reads the first character from the file but also updates the pointer\
    \ to reference the next position. A second read operation, therefore, would return\
    \ the ‘B’ character.\n\nTo avoid the risk of reading beyond the end of a file,\
    \ we can use the `StreamReader` `Peek()` method to see the next character without\
    \ reading it. When `Peek()` returns -1 we know that the current character is the\
    \ last:\n\n```cs\nwhile (reader.Peek() >= 0) {\n    Console.WriteLine($\"Char\
    \ = {(char)reader.Read()}\");\n}\n```\n\nThe `Read()` method, can also read a\
    \ specified number of characters from a given index position using the following\
    \ syntax:\n\n`Read( <char array> , <index> , <count> )`\n\nIn the above syntax,\
    \ the `<index>` parameter is an offset relative to the current stream position,\
    \ not from the start of the stream. For example, if the stream pointer is currently\
    \ 2 and `Read()` is passed an index value of 3, the characters will be read starting\
    \ at position 5.\n\nThe following code example reads from the file in blocks of\
    \ three characters, starting from the current position:\n\n```cs\nusing (StreamReader\
    \ reader = new(\"MyFile.txt\"))\n{\n    char[] charBuffer;\n    while (reader.Peek()\
    \ >= 0)\n    {\n        charBuffer = new char[3];\n        reader.Read(charBuffer,\
    \ 0, 3);\n        Console.WriteLine(charBuffer);\n    }\n}\n```\n\nWhen executed,\
    \ the above code will generate the following output:\n\nABC\nDEF\nGHI\nJKL\nMNO\n\
    P\nQ\nRST\nUVW\nXYZ\n\nThe pattern is disrupted after the letter ‘O’, but keep\
    \ in mind that this is where we switched from `Write()` to `WriteLine()`, which\
    \ introduced a newline between the ‘P’ and ‘Q’.\n\nWhen working with streams,\
    \ we can obtain the stream length by accessing the reader’s `BaseStream.Length`\
    \ property:\n\n```cs\nvar length = reader. BaseStream.Length;\n```\n\nThis is\
    \ useful for initializing the character buffer when reading the entire stream:\n\
    \n```cs\nchar[] charBuffer;\nvar length = reader.BaseStream.Length;\nwhile (reader.Peek()\
    \ >= 0)\n{\n    charBuffer = new char[ length ];\n    reader.Read(charBuffer,\
    \ 0, ( int)length );\n    Console.WriteLine(charBuffer);\n}\n```\n\nAnother technique\
    \ for reading until the end of the stream is to use the `ToEnd()` method, which\
    \ returns a string value containing the stream’s content from the current position\
    \ to the end:\n\n```cs\nstring contents = reader.ReadToEnd();\n```\n\n## 29.13\
    \ Asynchronous file handling\n\nIn addition to the synchronous methods covered\
    \ so far, the `File` and `Stream` classes include asynchronous equivalents which\
    \ are particularly helpful when working with large files. The following are some\
    \ examples of these asynchronous methods:\n\n- `File.WriteAllLinesAsync()`\n-\
    \ `File.ReadAllLinesAsync()`\n- `File.WriteAllTextAsync()`\n- `File.ReadAllTextAsync()`\n\
    - `StreamReader.ReadAsync()`\n- `StreamReader.BlockAsync()`\n- `StreamReader.ReadLineAsync()`\n\
    - `StreamReader.ReadToEndAsync()`\n- `StreamWriter.WriteAsync()`\n- `StreamWriter.WriteLineAsync()`\n\
    \nThese methods are syntactically similar to the synchronous equivalents but must\
    \ be called from async contexts using the `await` keyword.\n\n## 29.14 Working\
    \ with binary streams\n\nSo far in this chapter, we have worked exclusively with\
    \ text-based files. For binary file handling, C# provides `BinaryReader` and `BinaryWriter`\
    \ classes. The following example writes string, boolean, double, integer, and\
    \ char values to a binary file:\n\n```cs\nusing (BinaryWriter writer = new(File.Open(\"\
    Binary.dat\", FileMode.Create)))\n{\n    writer.Write(\"Test data\");\n    writer.Write(false);\n\
    \    writer.Write(3.57);\n    writer.Write(33);\n    writer.Write('W');\n}\n```\n\
    \nWhen reading from a binary stream, the appropriate `BinaryReader` method must\
    \ be called to match the data type as follows:\n\n```cs\nusing (BinaryReader reader\
    \ = new(File.Open(\"Binary.dat\", FileMode.Open)))\n{\n    Console.WriteLine(\"\
    String = \" + reader.ReadString());\n    Console.WriteLine(\"Boolean = \" + reader.ReadBoolean());\n\
    \    Console.WriteLine(\"Double = \" + reader.ReadDouble());\n    Console.WriteLine(\"\
    Int = \" + reader.ReadInt32());\n    Console.WriteLine(\"Char = \" + reader.ReadChar());\n\
    }\n```\n\nWhen it runs, the above code will generate the following output:\n\n\
    String = Test data\nBoolean = False\nDouble = 3.57\nInt = 33\nChar = W\n\n## 29.15\
    \ Take the knowledge test\n\nClick the link below or scan the QR code to test\
    \ your knowledge and understanding of C# dictionary collections:\n\n[https://www.answertopia.com/65dc](https://www.answertopia.com/65dc)\n\
    \n![img](image/c_-files.png)\n\n## 29.16 Summary\n\nThis chapter explored file\
    \ and directory handling in C# using classes from the System.IO namespace. We\
    \ covered creating, deleting, navigating, and working with files and directories,\
    \ including checking for existence, changing the current working directory, and\
    \ handling exceptions. The `File` class provides static methods for working with\
    \ files, while the `FileInfo` class offers non-static methods for the same purpose.\
    \ We also looked at more complex file handling using the `StreamReader`, `StreamWriter`,\
    \ `BinaryReader`, and `BinaryWriter` classes.\n"
