  trans: "\n\n在本章中，我们探索了 C# 命名空间，并学习了如何使用它们组织项目代码以及避免命名冲突。命名空间使用 `namespace` 关键字声明，并使用点符号进行访问。文件范围命名空间（File-scoped\
    \ namespaces）允许将整个源文件指定为属于同一个命名空间。\n\n# 23. C# 异常处理\n\n在一个完美的世界里，C# 代码永远不会遇到错误。由于我们并不在一个完美的世界中，因此无法保证在代码执行期间不会发生错误（通常称为异常）。因此，确保代码能够优雅地处理任何可能出现的异常至关重要。\n\
    \n本章将介绍如何使用 C# 进行异常处理，引入了异常类型、异常是如何抛出的、以及如何使用 `try-catch` 语句来处理异常等主题。\n\n## 23.1\
    \ 理解异常处理\n\n无论你的 C# 代码设计和实现得多么细致，总会有应用程序无法控制的情况。例如，依赖活动网络连接的应用程序无法控制连接的丢失。然而，应用程序可以做到的是健壮的异常处理，例如向用户显示消息，或者静默尝试重新建立丢失的网络连接。\n\
    \nC# 中的异常处理涉及两个主要方面：在方法内未实现预期结果时触发（或抛出）异常，以及在另一个方法抛出异常后对其并处理。\n\n当异常抛出时，它具有特定的异常类型，该类型可以用于识别异常的性质并决定最合适的操作。在代码中抛出异常时，你可以使用内置异常类型，也可以创建并抛出派自\
    \ `System.Exception` 类的自定义异常类型。\n\n在学习 C 异常处理时，请记住，除了在程序中实现必要的抛出异常的代码外，C# 和 .NET\
    \ 框架中的许多 API 方法也会抛出必须在程序代码中处理的异常。未能这样做通常会导致运行时异常并导致应用程序崩溃。\n\n## 23.2 创建 ExceptionDemo\
    \ 项目\n\n启动 VS Code，打开你的“C# Essentials”工作空间文件夹，并创建一个名为 `ExceptionDemo` 的新 .NET\
    \ 控制台应用程序项目。项目准备完成后，按如下方式修改 `Program.cs` 文件：\n\n```csharp\nnamespace ExceptionDemo\n\
    {\n    internal class Program\n    {\n        static void Main(string[] args)\n\
    \        {\n        }\n    }\n}\n```\n\n该项目是一个控制电动机的假设应用程序。在通电诊断期间，应用程序读取当前电压，如果超过\
    \ 500 伏特，则防止电机启动。在 `Program.cs` 文件中，添加一个执行电压检查的方法，并在 `Main()` 方法中调用它：\n\n```csharp\n\
    namespace ExceptionDemo\n{\n    internal class Program\n    {\n        static\
    \ void Main(string[] args)\n        {\n            VoltageCheck(501);\n      \
    \  }\n\n        private static void VoltageCheck(int voltage)\n        {\n   \
    \         if (voltage > 500)\n            {\n                Console.WriteLine(\"\
    Voltage overload.\");\n            }\n            else\n            {\n      \
    \          Console.WriteLine(\"Voltage is safe.\");\n            }\n        }\n\
    \    }\n}\n```\n\n运行应用程序并检查控制台中是否出现了电压过载消息：\n\n```\nVoltage overload.\n```\n\n\
    电压过载是一个严重问题，因此我们希望不仅仅是显示一条消息并希望用户不要直接启动电机。相反，我们希望强制应用程序采取预防措施。为了做到这一点，我们将抛出一个异常。\n\
    \n## 23.3 抛出异常\n\n抛出异常的第一步是选择异常类型。如前所述，异常可以使用许多内置类型之一或你创建的自定义类型抛出。我们将在章的晚些部分介绍自定义异常类型，因此现在我们将使用\
    \ `ArgumentOutOfRangeException` 类型。当传递给方法的参数超出接受范围时，通常会抛出此异常类型（在我们的案例中，超过 500\
    \ 伏特的电压读数）。\n\n接下来，创建并初始化异常类型的实例。所有异常类型都必须用一个解释问题原因的消息进行初始化。某些类型（包括 `ArgumentOutOfRangeException`）还需要引起异常的参数名称（在我们的案例中，为\
    \ `voltage`）。有了这些信息，我们可以如下创建一个新异常：\n\n`ArgumentOutOfRangeException voltageException\
    \ = new(nameof(voltage), \"Voltage exceeds safety parameters.\");`\n\n使用 `throw`\
    \ 语句后异常对象来抛出异常，如下：\n\n```csharp\nthrow voltageException;\n```\n\n在上面的示例中，我们分两个步骤创建和抛出异常。然而，这一序列操作通常在单次操作中完成：\n\
    \n`throw new ArgumentOutOfRangeException(nameof(voltage), \"Voltage exceeds safety\
    \ parameters.\");`\n\n按如下方式修改 `VoltageCheck()` 方法以抛出异常：\n\n```csharp\nprivate\
    \ static void VoltageCheck(int voltage)\n{\n    if (voltage > 500)\n    {\n  \
    \      throw new ArgumentOutOfRangeException(nameof(voltage), \"Voltage exceeds\
    \ safety parameters.\");\n    }\n    else\n    {\n        Console.WriteLine(\"\
    Safe Voltage\");\n    }\n}\n```\n\n参考控制台，那里将出现以下输出：\n\n```\nUnhandled exception.\
    \ System.ArgumentOutOfRangeException: Voltage exceeds safety parameters. (Parameter\
    \ 'voltage')\nat ExceptionDemo.Program.VoltageCheck(Int32 voltage) in Program.cs:line\
    \ 16\nat ExceptionDemo.Program.Main(String[] args) in Program.cs:line 8\n```\n\
    \n此消息告诉我们应用程序由于未处理的异常而终止。此消息包含了异常类型、消息以及引起异常的参数名称。\n\n我们现在需要添加额外的代码来处理抛出的异常。\n\
    \n## 23.4 处理异常\n\nC# 中的异常使用 `try-catch` 语句处理。为了防止应用程序在抛出异常时崩溃，我们必须对 `Main` 方法进行如下更改：\n\
    \n```csharp\nstatic void Main(string[] args)\n{\n    try\n    {\n        VoltageCheck(501);\n\
    \    }\n    catch\n    {\n        Console.WriteLine(\"Voltage too high - disconnecting\
    \ power\");\n    }\n}\n```\n\n当应用程序运行时，`try-catch` 语句将处理异常并允许应用程序采取修正措施。可以在 catch\
    \ 块体中访问异常对象，从而获取消息：\n\n```csharp\ntry\n{\n    VoltageCheck(501);\n}\ncatch (ArgumentOutOfRangeException\
    \ ex)\n{\n    Console.WriteLine(ex.Message);\n}\n```\n\n到为止，我们实现了处理单一异常类型的代码。然而，try\
    \ 块体内部可能会抛多种异常类型。通过访问异常对象，我们可以识别异常类型并采取特定类型的操作。例如：\n\n```csharp\ncatch (Exception\
    \ ex)\n{\n    if (ex is ArgumentOutOfRangeException)\n    {\n        Console.WriteLine(ex.Message);\n\
    \    }\n    else if (ex is NullReferenceException)\n    {\n        Console.WriteLine(ex.Message);\n\
    \    }\n}\n```\n\n## 23.5 使用 关键字创建异常过滤器\n\n在上面的示例中，我们使用 `if ... else if` 语句根据捕获异常的类型采取不同的操作。`when`\
    \ 关键字提供了一种高级过滤选项，用于控制 catch 块是否符合特定规则。在 catch 块中使用 `when` 的语法如下：\n\n```csharp\n\
    try\n{\n}\ncatch (<exception>) when (<boolean expression>)\n{\n}\n```\n\ncatch\
    \ 块中的代码只有在 `when` 关键字后的逻辑表达式为真时才会执行。这对于在一个 catch 块中捕获多种异常类型特别有用。例如，以下代码仅在匹配给定类型之一时捕获异常：\n\
    \n```csharp\ncatch (Exception ex) when (ex is ArgumentOutOfRangeException || ex\
    \ is ArgumentException)\n```\n\n异常过滤器可以包含任何逻辑逻辑表达式，无论是否带有类型匹配。以下 catch 块仅在异常类型为\
    \ `ArgumentException` 且 `motorTemp` 变量超过 102 时才会执行：\n\n```csharp\ntry\n{\n   \
    \ VoltageCheck(501);\n}\ncatch (Exception ex) when (ex is ArgumentException &&\
    \ motorTemp > 102)\n{\n}\n```\n\n"
- fmt: "\n```csharp\ncatch (Exception ex) when (ex is ArgumentOutOfRangeException\
    \ && motorTemp > 102)\n{\n\n}\n```\n\n## 23.6 Using finally blocks\n\nThe purpose\
    \ of the `finally` block is to specify code to be executed just before a `try-catch`\
    \ statement finishes and is typically used to perform clean-up tasks, for example:\n\
    \n```csharp\ntry\n{\n    VoltageCheck(501);\n}\ncatch (Exception ex)\n{\n    Console.WriteLine(exception.Message);\n\
    }\nfinally\n{\n    Console.WriteLine(\"Resetting system.\");\n}\n```\n\n## 23.7\
    \ Using the try-finally Statement\n\nFrom previous experience, we know that an\
    \ unhandled exception will cause a running app to crash, but have yet to explain\
    \ where exceptions can be caught and handled. The examples covered in this chapter\
    \ so far have implied that exceptions must be handled at the point that they occur\
    \ using a `try-catch statement. In practice, however, this is not the case. Before\
    \ exploring this topic in more detail it helps to view the execution path of a\
    \ running app as a hierarchy of method calls, starting with the `Main()` method\
    \ representing the top level.\n\nConsider a scenario where the `Main()` method\
    \ calls `Method A` which, in turn, calls methods `B` and `C`. `Method C` then\
    \ calls `Method D`, and so on. This hierarchy of method calls is referred to as\
    \ a call tree or call hierarchy . In diagram form, our theoretical call hierarchy\
    \ might appear as shown in [Figure 23-1](#Exception_Handling.xhtml__idTextAnchor297)\
    \ below:\n\n![img](image/method_hierarchy.png)\n\nFigure 23-1\n\nSuppose an exception\
    \ is thrown in `Method D`. This exception will propagate up through the call hierarchy\
    \ until the exception is handled. If the exception reaches the `Main()` method\
    \ without being caught, the app will crash. This means that even though the exception\
    \ was thrown in `Method D`, we can handle it in any direct ancestor method up\
    \ to and including `Main()` to prevent the app from crashing.\n\nTo experience\
    \ this firsthand, add an interim method named `StartMotor()` between the `Main()`\
    \ and `VoltageCheck()` methods and remove the `try-catch` statement:\n\n```csharp\n\
    namespace ExceptionDemo\n{\n    internal class Program\n    {\n        static\
    \ void Main(string[] args)\n        {\n            StartMotor();\n        }\n\
    \        private static void StartMotor()\n        {\n            VoltageCheck(501);\n\
    \            Console.WriteLine(\"Clean up after check.\");\n        }\n      \
    \  private static void VoltageCheck(int voltage)\n        {\n            if (voltage\
    \ > 500)\n            {\n                throw new ArgumentOutOfRangeException(nameof(voltage),\n\
    \                \"Voltage exceeds safety parameters.\");\n            }\n   \
    \         else\n            {\n                Console.WriteLine(\"Safe Voltage\"\
    );\n            }\n        }\n    }\n}\n```\n\nSince the exception is not caught\
    \ in any of the three methods, the app will crash when it runs. We can, however,\
    \ catch the error by adding a `try-catch` statement to `VoltageCheck()`, `StartMotor()`\
    \ or `Main()`. For this example, use a `try-catch` statement to call `StartMotor()`\
    \ from within the `Main()` method:\n\n```csharp\nstatic void Main(string[] args)\n\
    {\n    try\n    {\n        StartMotor();\n    }\n    catch (Exception ex) {\n\
    \        Console.WriteLine(ex.Message);\n    }\n}\n```\n\nRerun the app and confirm\
    \ that the exception propagated up to the `Main()` method and was caught and handled:\n\
    \n`Voltage exceeds safety parameters. (Parameter 'voltage')`\n\nNote that the\
    \ above console output does not perform the cleanup operation after the voltage\
    \ check. As currently implemented, `StartMotor()` will be unaware that the voltage\
    \ check threw an exception and any code in `StartMotor()` after the `VoltageCheck()`\
    \ will be skipped and control returned immediately to `Main()`. Suppose, however,\
    \ that `StartMotor` needs to perform the cleanup after the voltage check, regardless\
    \ of whether an exception was thrown. We can achieve this behavior using a `try-finally`\
    \ statement:\n\n```csharp\nprivate static void StartMotor()\n{\n    try\n    {\n\
    \        VoltageCheck(501);\n    }\n    finally\n    {\n        Console.WriteLine(\"\
    Clean up whether or not voltage is safe.\");\n    }\n}\n```\n\nCompile and run\
    \ the app once more and verify that the cleanup occurs even when the exception\
    \ is thrown:\n\n`Clean up whether or not voltage is safe.`\n`Voltage exceeds safety\
    \ parameters. (Parameter 'voltage')`\n\n## 23.8 Re-throwing exceptions\n\nSometimes\
    \ an exception needs to be caught at multiple levels of the call hierarchy. This\
    \ is achieved by re-throwing the exception after it has been caught so that it\
    \ continues to pass upward in the hierarchy. Exceptions are re-thrown using the\
    \ `throw` statement in the catch body as outlined below:\n\n```csharp\nstatic\
    \ void Main(string[] args)\n{\n    try\n    {\n        StartMotor();\n    }\n\
    \    catch (Exception ex) {\n        Console.WriteLine(\"Caught in Main() \" +\
    \ ex.Message);\n    }\n}\n\nprivate static void StartMotor()\n{\n    try\n   \
    \ {\n        VoltageCheck(501);\n    }\n    catch (Exception ex)\n    {\n    \
    \    Console.WriteLine(\"Caught in StartMotor \" + ex.Message);\n        throw;\n\
    \    }\n    finally\n    {\n        Console.WriteLine(\"Clean up whether or not\
    \ voltage is safe.\");\n    }\n}\n```\n\nRun the app and check the console to\
    \ verify that the re-throw worked and that the exception was caught by both methods:\n\
    \n`StartMotor(): Voltage exceeds safety parameters. (Parameter 'voltage')`\n`Clean\
    \ up whether or not voltage is safe.`\n`Main(): Voltage exceeds safety parameters.\
    \ (Parameter 'voltage')`\n\n## 23.9 Creating custom exception types\n\nSo far,\
    \ this chapter has used built-in exception types to demonstrate how to throw and\
    \ catch exceptions in C#. However, it will sometimes make more sense to create\
    \ a custom exception type than using one of the predefined types. Custom types\
    \ are derived from the `Exception` class and should include three constructors\
    \ and parameters if required. The type name should also end in “Exception”. The\
    \ following code declares a custom exception type for high-voltage errors in our\
    \ example app:\n\n```csharp\npublic class HighVoltageException : Exception\n{\n\
    \    public HighVoltageException()\n    {\n    }\n    public HighVoltageException(string\
    \ message)\n    : base(message)\n    {\n    }\n    public HighVoltageException(string\
    \ message, Exception inner)\n    : base(message, inner)\n    {\n    }\n}\n```\n\
    \nOnce declared, the exception can be thrown as follows:\n\n`throw new HighVoltageException(\"\
    Voltage exceeds safety parameters.\");`\n\nThe `HighVoltageException` type does\
    \ not contain properties, so an instance can be created with only the message\
    \ string:\n\n`throw new HighVoltageException(\"Voltage exceeds safety parameters.\"\
    );`\n\nWe can also extend the type declaration to include a property to record\
    \ the voltage level when the exception occurred:\n\n```csharp\npublic class HighVoltageException\
    \ : Exception\n{\n    public int Volts;\n    public HighVoltageException()\n \
    \   {\n    }\n    public HighVoltageException(string message)\n    : base(message)\n\
    \    {\n    }\n    public HighVoltageException(string message, Exception inner)\n\
    \    : base(message, inner)\n    {\n    }\n    public HighVoltageException(string\
    \ message, int Volts)\n    : base(message)\n    {\n        this.Volts = Volts;\n\
    \    }\n}\n```\n\nA `HighVoltageException` instance can now be created with a\
    \ message string and the voltage value that triggered the exception:\n\n```csharp\n\
    private static void VoltageCheck(int voltage)\n{\n    if (voltage > 500)\n   \
    \ {\n        throw new HighVoltageException(\"Voltage exceeds safety parameters.\"\
    ,\n        voltage);\n    }\n    else\n    {\n        Console.WriteLine(\"Safe\
    \ Voltage\");\n    }\n}\n```\n\nException properties can be accessed from within\
    \ catch blocks in the same way as the `message` property. In the following example,\
    \ the `Volts` property is included in the notification text and used to make a\
    \ decision based on the voltage level:\n\n```csharp\ntry\n{\n    StartMotor();\n\
    }\ncatch (HighVoltageException ex)\n{\n    Console.WriteLine(ex.Message);\n  \
    \  Console.Write(\"Current voltage: {ex.Volts}\");\n    if (ex.Volts < 510)\n\
    \    {\n        // Wait and retry\n    }\n    else\n    {\n        // Critical.\
    \ Shutdown system\n    }\n}\n```\n\n## 23.10 Take the knowledge test\n\nClick\
    \ the link below or scan the QR code to test your knowledge and understanding\
    \ of C# exception handling:\n\n[https://www.answertopia.com/hy8t](https://www.answertopia.com/hy8t)\n\
    \n![img](image/c_-exceptions.png) \n\n## 23.11 Summary\n"
