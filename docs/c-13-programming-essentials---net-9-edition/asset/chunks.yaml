  trans: "\n\n一个 C# `abstract class`（抽象类）包含抽象成员，这些成员定义了子类必须包含的内容。这些抽象成员声明了特定类型的成员，但并不实现该成员。抽象成员的实现在派生类中进行。派生自抽象类但未能实现抽象方法的子类将产生语法错误。\n\
    \n### 18.3 声明 C# 抽象类\n\n除了使用 `class` 修饰符外（正如我们在之前的示例中看到的），抽象类还必须使用 `abstract`\
    \ 修饰符进行声明：\n\n```csharp\npublic abstract class Talk {\n\n}\n```\n\n 抽象类的成员方法和属性也使用\
    \ `abstract` 关键字声明。例如，若要在我们的 `Talk` 类中声明一个抽象方法，需要以下代码：\n\n```csharp\npublic abstract\
    \ class Talk {\n    public abstract void Speak();\n}\n```\n\n我们现在有一个具有名为 `Speak()`\
    \ 的抽象方法的抽象类。请注意，该声明仅表示任何派生自 `Talk` 基类的类必须实现一个名为 `Speak()` 的方法，该方法没有返回值（即声明为 `void`）且没有参数。然而，它并没有实现该方法。\n\
    \n### 18.4 从抽象类派生\n\n要从抽象类派生子类，我们编写代码如下：\n\n```csharp\npublic class SayHello :\
    \ Talk {\n\n}\n```\n\n我们现在有一个名为 `SayHello` 的类，它派生自抽象的 `Talk` 类。下一步是实现抽象的 `Speak()`\
    \ 方法。在派生类中实现抽象成员时，必须使用 `override` 修饰符。例如：\n\n```csharp\npublic override void Speak()\
    \ {\n    Console.WriteLine(\"Hello!\");\n}\n```\n\n我们现在有一个派生自 `Talk` 抽象类的子类，它实现了抽象的\
    \ `Speak()` 方法。\n\n### 18.5 创建 AbstractClassDemo 项目\n\n在涵盖了抽象类的基础知识后，我们可以在示例项目中使用这些知识。首先，在\
    \ VS Code 中创建一个名为 `AbstractClassDemo` 的新 .NET 控制台应用程序项目。\n\n使用解决方案资源管理器（Solution\
    \ Explorer），向 `AbstractClassDemo` 项目添加一个名为 `Talk` 的新 `Class`。\n\n编辑 `Talk.cs`\
    \ 文件，将 `Talk` 类声明为抽象类，并如下如下添加抽象的 `Speak()` 方法：\n\n```csharp\nnamespace AbstractClassDemo;\n\
    \npublic abstract class Talk\n{\n    public abstract void Speak();\n}\n```\n\n\
    接下来，我们需要添加第二个派生自 `Talk` 类的类。重复上述步骤向项目添加一个类文件，这次将文件命名为 `SayHello.cs`。文件添加后，进行以下更改以派生自\
    \ `Talk` 的子类并实现 `Speak()` 方法：\n\n```csharp\nnamespace AbstractClassDemo\n{\n \
    \   internal class SayHello : Talk\n    {\n        public override void Speak()\n\
    \        {\n            Console.WriteLine(\"Hello!\");\n        }\n    }\n}\n\
    ```\n\n最后，修改 `Program.cs` 文件以使用这些新类：\n\n```csharp\nusing AbstractClassDemo;\n\n\
    SayHello demo = new();\n\ndemo.Speak();\n```\n\n运行程序以确认控制台中显示了“Hello!”消息。\n\n\
    ### 18.6 抽象成员与虚成员\n\n到目前为止，我们只查看了抽象类成员。如上所述，`abstract member`（抽象成员）在基类中没有实现，必须在派生类中实现该类才能编译。\n\
    \n另一种类型的成员是 `virtual member`（虚成员）。定义为 `virtual` 的成员必须在基类中实现，但如果需要不同的行为，可以在派生类中可选地进行重写。虚成员在基类中使用\
    \ `virtual` 修饰符声明。\n\n例如，修改 `Talk` 类以包含一个名为 `Goodbye()` 的虚成员，如下：\n\n```csharp\n\
    namespace AbstractClassDemo;\n\npublic abstract class Talk\n{\n    public abstract\
    \ void Speak();\n    public virtual void Goodbye()\n    {\n        Console.WriteLine(\"\
    Talk class says goodbye!\");\n    }\n}\n```\n\n接下来，在 `Program.cs` 文件中进行以下更改以调用\
    \ `Goodbye()` 方法：\n\n```csharp\nSayHello demo = new();\n\ndemo.Speak();\n\ndemo.Goodbye();\n\
    ```\n\n当程序运行时，`Speak()` 和 `Goodbye()` 方法将生成如下输出：\n\nHello!\nTalk class says goodbye!\n\
    \n假设我们决定 `Talk` 类提供的默认 `Goodbye()` 方法不符合 `SayHello` 子类的需求。在这种情况下，我们可以使用 `override`\
    \ 修饰符实现我们自己的方法版本：\n\n```csharp\npublic class SayHello : Talk\n{\n    public override\
    \ void Speak() {\n        Console.WriteLine(\"Hello!\");\n    }\n    public override\
    \ void Goodbye() {\n        Console.WriteLine(\"SayHello class says goodbye!\"\
    );\n    }\n}\n```\n\n当代码执行时，调用的是子类中的 `Goodbye()` 方法而不是 `Talk` 类中的虚版本：\n\nHello!\n\
    Say class says goodbye!\n\n与非抽象类一样，子类也可以调用虚方法的基类实现。例如，子类版本的 `Goodbye()` 方法可以修改为也调用被重写的基类\
    \ `Goodbye()` 方法，如下文所示：\n\n```csharp\npublic class SayHello : Talk\n{\n    public\
    \ override void Speak() {\n        Console.WriteLine(\"Hello!\");\n    }\n   \
    \ public override void Goodbye() {\n        base.Goodbye();\n        Console.WriteLine(\"\
    SayHello class says goodbye!\");\n    }\n}\n```\n\n当调用 `Goodbye()` 方法时，将显示两种变体的输出：\n\
    \nHello!\nTalk class says goodbye!\nSayHello class says goodbye!\n\n### 18.7 测试知识\n\
    \n点击下方链接或扫描二维码以测试你对 C# 抽象类的理解：\n\nhttps://www.answertopia.com/76b9\n\n![img](img/abstract.png)\n\
    \n### 18.8 总结\n\n抽象类是不能直接实例化基类。相反，它们提供了一个子类必须满足的模板。抽象类的成员可以声明为 `abstract` 或 `virtual`。`abstract\
    \ members` 在抽象类中不包含任何实现，必须在派生类中重写。而 `virtual members` 在抽象类中提供了回退实现，以便在未重写时使用。\n\
    \n# 19. C# 接口\n\n在本章中，我们将解释 C# 接口、如何编写自己的接口以及如何让其他类遵循。\n\n### 19.1 理解 C# 接口\n\n\
    默认情况下，只要语法正确，C# 类没有特定的遵循的规则。然而，在某些情况下，类必须满足特定标准才能与其他协作。这在编写需要与其他库协作的类时非常常见。`interface`（接口）是类必须满足的规则集。接口使用\
    \ `interface` 关键字声明，定义了类必须包含的方法和属性。当类采用接口但不满足所有要求时，将报告错误，说明类未符合接口。与抽象类不同，接口不包含实现。\n\
    \n### 19.2 声明接口\n\n接口的声明方式与其他类非常相似，只是在声明中使用 `interface` 关键字代替 `class`。考虑以下接口声明。任何采用此接口的类必须包含一个名为\
    \ `Demo()` 的方法。\n\n注意习惯是用 `I` 前缀命名接口，以区分非接口类。\n\n与抽象类不同，接口不得包含其成员的实现。例如，以下不是有效的接口：\n\
    \n```csharp\ninterface IDemoInterface\n{\n    void DemoMethod() {\n        Console.WriteLine(\"\
    Hello\");\n    }\n}\n```\n\n上述代码将产生以下语法错误：\n\nError CS8701 Target runtime doesn't\
    \ support default interface implementation.\n\n为了符合 `IDemoInterface` 接口，类必须包含\
    \ `DemoMethod()` 实现。例如：\n\n```csharp\npublic class DemoClass : IDemoInterface\n\
    {\n    public void DemoMethod() {\n        // 在此处编写代码\n    }\n}\n```\n"
