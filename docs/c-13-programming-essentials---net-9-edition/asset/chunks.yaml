    ## 2. 编程语言与 C# 的历史


    `C#` 是为了让计算机编程对人类来说尽可能简单高效的这一永无止境追求的一部分。虽然将 `C#` 描述为另一种面向对象的编程语言很容易，但事实是，`C#`
    是整个开发和执行基础设施不可或缺的一部分。这些初始章节的主要目标是概述 `C#` 语言及其所依赖的基础设施。


    ### 2.1 编程语言的历史


    编程的问题在于，计算机完全用数字（准确来说是 0 和 1）思考，这被称为机器码，而人类使用单词进行交流。在早期，程序员直接将机器码输入计算机进行编程。正如你所想象的，这是一个耗时且容易出错的过程。下一次演进是将简短的人类可读命令与相应的机器码相关联。例如，程序员可以输入
    `MOV` 命令将值从一个微处理器寄存器转移到另一个。这些命令随后由一个名为`汇编器` (`assembler`) 的软件翻译成机器码，从而赋予这种命令语法“汇编语言”的名字。


    接下来是一系列高级语言，旨在让人类更容易编写程序。这些程序使用人类可读的语法编写，然后由`编译器` (`compiler`) 编译为机器码，或者代表处理器由`解释器`
    (`interpreter`) 解析。此类语言包括 `BASIC`、`COBOL`、`Pascal` 和 `Fortran`。另一种语言是 `C`，它于 20
    世纪 60 年代末和 70 年代初在 `AT&T Bell 实验室` 创建。随后，在 20 世纪 70 年代末和 80 年代初，开始研究 `C` 语言的面向对象方法，并催生了一种新的、面向对象的
    `C` 变体，被称为 `C++`。


    然而，故事仍在继续。`C++` 的问题在于太容易犯编程错误。例如，`C++` 会非常乐意地允许程序员编写代码错误，导致缓冲区溢出、内存位置被任意覆盖，并引入内存泄漏，导致应用程序膨胀到耗尽系统上的整个物理内存和交换空间。在使用
    `C`、`C++` 以及所有其他编译语言时遇到的另一个问题是，源代码必须为每种处理器类型重新编译，这使得应用程序从一个硬件平台迁移到另一个平台变得困难。


    为了解决 `C` 和 `C++` 的缺点，`太阳太阳公司` (`Sun Microsystems`) 在 20 世纪 90 年代开始研究一种新的语言和执行环境。结果被称为
    `Java`。Java 包含一种去除了 `C++` 许多陷阱的编程语言、一种可移植的中间字节码格式、一个执行字节码并处理内存管理等问题的运行时环境（称为`虚拟机`
    `virtual machine`），以及一套提供开发企业级应用程序所需全部功能的庞大库（如网络、文件处理、数据库访问、图形等）。


