    \ 语句控制程序的执行流。虽然这些语句结构在测试有限数量的条件时效果良好，但在处理大量可能的条件时，它们会迅速变得难以处理。C# 继承了 C 语言语言的 `switch`\
    \ 语句。\n\n在本章中，我们将详细探讨 `switch` 语句。\n\n### 10.1 为什么要使用 switch 语句？\n\n对于少数几个逻辑值评估，`if`\
    \ ... `else if` ... 结构是完全足够的。遗憾的是，任何多于两个或三个可能的场景都会迅速让这种结构变得既耗时又难以阅读。例如，请考虑以下代码示例。该程序使用\
    \ `if` ... `else if` ... 语句根据型号名称识别汽车制造商：\n\n```csharp\nstring carModel = \"Corolla\"\
    ;\nstring carManufacturer;\n\nif ((String.Compare(carModel, \"Patriot\") == 0)\
    \ ||\n(String.Compare(carModel, \"Liberty\") == 0) ||\n(String.Compare(carModel,\
    \ \"Wrangler\") == 0)) {\n    carManufacturer = \"Jeep\";\n}\nelse if (String.Compare(carModel,\
    \ \"Focus\") == 0) {\n    carManufacturer = \"Ford\";\n}\nelse if (String.Compare(carModel,\
    \ \"Corolla\") == 0) {\n    carManufacturer = \"Toyota\";\n} else {\n    carManufacturer\
    \ = \"unknown\";\n}\n\nConsole.WriteLine($\"Manufacturer is {carManufacturer}\"\
    );\n```\n\n虽然代码量不大，但它已经开始变得有些难以阅读，并且编写时间比需要的要长。然而，想象一下，如果我们测试的不是 3 个汽车型号，而是 10\
    \ 个或 20 个。显然，需要一个更直接的解决方案，而那个解决方案就是 `switch` 语句。\n\n### 10.2 使用 switch 语句\n\n\
    C# `switch` 语句的语法如下：\n\n```csharp\nswitch (value){\n    case constant:\n     \
    \   statements\n        break/jump\n    case constant:\n        statements\n \
    \       break/jump\n    default:\n        statements\n        break/jump\n}\n\
    ```\n\n在创建基于 `switch` 的上述 `if` ... `else if` ... 结构之前，我们需要对该语法进行一些解释。\n\n在上面的语法大纲中，`value`\
    \ 代表一个值或返回一个值的表达式。这是 `switch` 操作的值。以我们的示例为例，这将代表汽车型号的字符串。\n\n每个可能的匹配都需要一个 `case`\
    \ 语句，后面紧跟一个常量值（再次使用我们的示例，这将是汽车型号）。每个 `case` 常量的类型必须与主 `value` 的类型相同。`case` 行之后是当该值匹配\
    \ `case` 常量时要执行的 C# 语句。\n\n语句之后是可选的 `break`、`goto` 或 `continue` 语句。这些语句在找到匹配项时跳出\
    \ `switch` 语句，跳转到代码中的特定位置，或者跳过循环中的任何剩余代码并开始下一次迭代。\n\n最后，结构中的 `default:` 部分定义了当没有\
    \ `case` 语句与 `value` 匹配时应该发生什么。\n\n### 10.3 switch 语句示例\n\n在牢上述信息的基础上，我们现在可以构建一个\
    \ `switch` 语句，它提供的功能与我们之前那个有些繁琐的 `if` ... `else if` ... 结构相同：\n\n```csharp\nstring\
    \ carModel = \"Corolla\";\nstring carManufacturer;\n\nswitch (carModel) {\n  \
    \  case \"Patriot\":\n    case \"Liberty\":\n    case \"Wrangler\":\n        carManufacturer\
    \ = \"Jeep\";\n        break;\n    case \"Focus\":\n        carManufacturer =\
    \ \"Ford\";\n        break;\n    case \"Corolla\":\n        carManufacturer =\
    \ \"Toyota\";\n        break;\n    default:\n        carManufacturer = \"unknown\"\
    ;\n        break;\n}\n\nConsole.WriteLine($\"Manufacturer is {carManufacturer}\"\
    );\n```\n\n### 10.4 解释示例\n\n在上面的示例中，赋值给变量 `carModel` 的字符串被用作 `switch` 语句的主变量。就像\
    \ Jeep 制造商一样，`case` 语句可以分组，位于单组语句之前。\n\n`default` 选项在没有任何 `case` 语句与汽车字符串匹配时，将\
    \ `carManufacturer` 字符串设置为“unknown”。\n\n### 10.5 使用 switch 表达式\n\n使用 `switch`\
    \ 语句节省了我们的输入工作并使代码更容易阅读，但 C# 允许我们使用 `switch` 表达式进一步简化代码，其语法如下：\n\n```csharp\n\
    result = value switch\n{\n    constant1 => statements,\n    constant2 => statements,\n\
    \    constant3 or constant4 => statements,\n    constant5 and constant6 or constant7\
    \ => statements,\n    _ => default_statement\n};\n```\n\n使用 `switch` 表达式，我们的示例可以简化如下：\n\
    \n```csharp\nstring carModel = \"Corolla\";\nstring carManufacturer;\n\ncarManufacturer\
    \ = carModel switch\n{\n    \"Patriot\" or \"Liberty\" or \"Wrangler\" => \"Jeep\"\
    ,\n    \"Focus\" => \"Ford\",\n    \"Corolla\" => \"Toyota\",\n    _ => \"unknown\"\
    \n};\n\nConsole.WriteLine($\"Manufacturer is {carManufacturer}\");\n```\n\n###\
    \ 10.6 在 C# switch 语句中使用 goto\n\n在原始示例中，我们使用 `break` 语句退出 `switch` 语句。结果是将执行点移动到\
    \ `switch` 语句之后的语句。遗憾的是，当必须执行 `default` 语句时就会产生了一个问题。为了满足这一需求，我们将示例代码中的 `break`\
    \ 语句替换为 `goto default` 语句：\n\n```csharp\nstring carModel = \"Corolla\";\nstring\
    \ carManufacturer = \"unknown\";\n\nswitch (carModel) {\n    case \"Patriot\"\
    :\n    case \"Liberty\":\n    case \"Wrangler\":\n        carManufacturer = \"\
    Jeep\";\n        goto default;\n    case \"Focus\":\n        carManufacturer =\
    \ \"Ford\";\n        goto default;\n    case \"Corolla\":\n        carManufacturer\
    \ = \"Toyota\";\n        goto default;\n    default:\n        Console.WriteLine($\"\
    The {carModel} is manufactured by {carManufacturer}\");\n        break;\n}\n```\n\
    \n虽然 `goto` 语句也可以用于跳转到 C# 代码中的标记位置，但强烈建议不要这种这样使用它。上述的用法是像 C# 这样现代面向对象语言中使用 `goto`\
    \ 语句的唯一接受的用法。正如任何资深程序员都会告诉你的那样，如果你发现自己处于只有通过 `goto` 语句才能实现某些目标的境地，那么你需要重新思考并重构你的代码，使其不再需要\
    \ `goto`。\n\n## 10.7 在 C# switch 语句中使用 continue\n\n"
- fmt: "\nAnother alternative to the `break` statement is the `continue` statement.\
    \ Suppose the `switch` statement is part of a loop. In that case, the `continue`\
    \ statement will cause execution to return immediately to the beginning of the\
    \ loop, bypassing any subsequent code yet to be executed in the current loop iteration.\n\
    \nThe use of the `continue` statement in loops will be covered in the [“C# Looping\
    \ with the for Statement”](#Looping_with_for.xhtml__idTextAnchor139) chapter.\n\
    \n## 10.8 Take the knowledge test\n\nClick the link below or scan the QR code\
    \ to test your knowledge and understanding of the C# `switch` statement:\n\n[https://www.answertopia.com/k4uy](https://www.answertopia.com/k4uy)\n\
    \n![img](image/c_-switch.png)\n\n## 10.9 Summary\n\nThe `if-else` statement is\
    \ a reliable way to make decisions when there are only a few possible outcomes.\
    \ However, when many potential outcomes result from an evaluation, this approach\
    \ can become cumbersome. In such cases, the `switch` statement is a better option\
    \ for implementing flow control logic in C#. A `switch` statement may be further\
    \ simplified in many situations using a `switch` expression.\n\n## 11. C# Looping\
    \ with the for Statement\n\nThis chapter will continue looking at control flow\
    \ in C# code. In the preceding chapters, we have examined using logical expressions\
    \ to decide what C# code should be executed. Another aspect of control flow entails\
    \ the definition of loops. Loops are sequences of C# statements that execute repeatedly\
    \ until a specified conditions are met.\n\n### 11.1 Why use loops?\n\nIt is generally\
    \ common knowledge that computers are great at performing repetitive tasks an\
    \ infinite number of times and doing so very quickly. It is also common knowledge\
    \ that computers really don’t do anything unless someone programs them to tell\
    \ them what to do. Loop statements are the primary mechanism for telling a computer\
    \ that a sequence of tasks needs to be repeated a specific number of times. Suppose,\
    \ for example, that you need to add a number to itself ten times. One way to do\
    \ this might be to write the following C# code:\n\n```csharp\nlong j = 1;\nj +=\
    \ j;\nj += j;\nj += j;\nj += j;\nj += j;\nj += j;\nj += j;\nj += j;\nj += j;\n\
    j += j;\n```\n\nWhile somewhat cumbersome, this does work. What would happen if\
    \ you needed to perform this task 100 or even 10,000 times? Writing C# code to\
    \ perform this as above would be prohibitive. Such a scenario is precisely what\
    \ the `for` loop is intended to handle.\n\nThe syntax of a C# `for` loop is as\
    \ follows:\n\n```csharp\nfor ( <initializer>; <conditional expression’>; <loop\
    \ expression> )\n{\n    statements to be executed\n}\n```\n\nThe `<initializer>`\
    \ element initializes a counter variable. Traditionally, the variable `i` is used\
    \ for this purpose. For example:\n\n```csharp\ni = 0;\n```\n\nThe code above sets\
    \ the counter to variable `i` and sets it to zero. Note that if the counter variable\
    \ has not been previously declared, it may be declared as part of the `for` statement:\n\
    \n```csharp\nint i = 0;\n```\n\nThe conditional expression specifies the test\
    \ to verify whether the loop has performed the required number of iterations.\
    \ For example, if we want to loop 100 times:\n\n```csharp\ni < 100;\n```\n\nFinally,\
    \ the loop expression specifies the action to perform on the counter variable.\
    \ For example, to increment by 1:\n\n```csharp\ni++;\n```\n\nThe body of statements\
    \ to be executed on each iteration of the loop is contained within the code block\
    \ defined by the opening (`{`) and closing (`}`) braces.\n\nBy bringing this all\
    \ together, we can create a `for` loop to perform the task outlined in the earlier\
    \ example:\n\n```csharp\nlong j = 1;\nfor (int i=0; i<50; i++) {\n    j += j;\n\
    \    Console.WriteLine(\"j = \" + j);\n}\n```\n\n### 11.2 C# loop variable scope\n\
    \nA key point to note in creating loops is that any variables defined within the\
    \ body of a loop are only visible to code within the loop. This is a concept known\
    \ as scope. If, for example, a variable `myCounter` is defined within the body\
    \ of a `for` loop, that variable ceases to exist once the loop terminates:\n\n\
    ```csharp\n// variable myCounter does not yet exist\nfor (int i = 0; i < 10; i++)\n\
    {\n    int myCounter = 0; //myCounter variable created in scope of for loop\n\
    \    myCounter += i;\n}\n// after loop exit variable myCounter is now out of scope\
    \ and ceases to exist\n```\n\n### 11.3 Creating an infinite for loop\n\nA `for`\
    \ loop, which will execute an infinite number of times, may be constructed using\
    \ `for(;;)` syntax. For example, the following code sample will output “Hello\
    \ from C#” until the program is manually terminated by the user (or the computer\
    \ is turned off or rebooted):\n\n```csharp\nfor (;;) {\n    Console.WriteLine(\"\
    Hello from C#\");\n}\n```\n\nIf you try the above example in VS Code and find\
    \ yourself in an infinite loop, you can stop execution using the stop button highlighted\
    \ in [Figure 11-1](#Looping_with_for.xhtml__idTextAnchor144) below:\n\n![img](image/vs_code_stop_button.png)\n\
    \nFigure 11-1\n\n### 11.4 Breaking out of a for loop\n\nHaving created a loop,\
    \ you might want to break out of it under certain conditions before the completion\
    \ criteria have been met (particularly if you have created an infinite loop).\
    \ One such example might involve continually checking for activity on a network\
    \ socket. Once the activity has been detected, it will be necessary to break out\
    \ of the monitoring loop and perform some other task.\n\nTo break out of a loop,\
    \ C# provides the `break` statement, which breaks out of the current loop. For\
    \ example:\n\n```csharp\nint j = 10;\nfor (int i = 0; i < 50; i++) {\n    j +=\
    \ j;\n    Console.WriteLine(\"j = \" + j);\n    if (j > 100)\n        break;\n\
    }\n```\n\nIn the above example, the loop will continue until `j` exceeds 100.\n\
    \n### 11.5 Nested for loops\n\nSo far, we have looked at only a single level of\
    \ for. It is also possible to nest for loops where loops reside inside loops.\
    \ For example:\n\n```csharp\nfor (int i = 0; i < 100; i++) {\n    Console.WriteLine(\"\
    i = \" + i);\n    for (int j = 0; j < 10; j++) {\n        Console.WriteLine(\"\
    j = \" + j);\n    }\n}\n```\n\nThe above example will loop 100 times, displaying\
    \ `i` on each iteration. In addition, each of those iterations will loop 10 times,\
    \ displaying `j`.\n\n### 11.6 Breaking from nested loops\n\nAn important point\
    \ to be aware of when breaking out of a nested loop is that the `break` only exits\
    \ from the current level. For example, the following C# code example will exit\
    \ from the current loop when `j` equals 5:\n\n```csharp\nfor (int i = 0; i < 100;\
    \ i++) {\n    Console.WriteLine(\"i = \" + i);\n    for (int j = 0; j < 10; j++)\
    \ {\n        if (j == 5)\n            break;\n        Console.WriteLine(\"j =\
    \ \" + j);\n    }\n}\n```\n\n### 11.7 Continuing for loops\n\nAnother helpful\
    \ statement for use in loops is the `continue` statement. When the execution process\
    \ finds a `continue` statement in any loop, it skips all remaining code in the\
    \ loop’s body and begins execution again from the top of the loop. Using this\
    \ technique, we can, for example, construct a `for` loop that outputs only even\
    \ numbers between 1 and 9:\n\n```csharp\nfor (int i = 1; i < 10; i++) {\n    if\
    \ ((i % 2) != 0)\n        continue;\n    Console.WriteLine($\"i = {i}\");\n}\n\
    ```\n\n### 11.8 The C# foreach statement\n\nThe `foreach` loop is used to iterate\
    \ over a sequence of items in a collection and provides a simple-to-use looping\
    \ option.\n\nThe syntax of the `foreach` loop is as follows:\n\n```csharp\nforeach\
    \ <name> in <collection> {\n    // code to be executed\n}\n```\n"
