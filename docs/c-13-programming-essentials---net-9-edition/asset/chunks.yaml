    \ above to display the Add New File palette as shown in [Figure 19-3](#Interfaces.xhtml__idTextAnchor248)\
    \ . Within the palette, select the `Interface` option:\n\n![img](image/new_interface_file.png)\n\
    \nFigure 19-3\n\nWhen prompted, name the interface `IMessageBuilder` before pressing\
    \ `Enter` to create the file. The new file will automatically load into the editor,\
    \ where it will read as follows:\n\n```csharp\nnamespace InterfaceDemo;\n\npublic\
    \ interface IMessageBuilder\n\n{\n\n}\n```\n\nModify the interface declaration\
    \ to add an interface member named `ShowMessage()`:\n\n```csharp\nnamespace InterfaceDemo;\n\
    \npublic interface IMessageBuilder\n{\nvoid ShowMessage();\n}\n```\n\nAny class\
    \ that adopts the `IMessageBuilder` interface must include a `ShowMessage()` member.\
    \ Use the `Solutions Explorer` to add a Class file to the project named `MyMessageBuilder`\
    \ and modify it to implement the `IMessageBuilder` interface as follows:\n\n```csharp\n\
    namespace InterfaceDemo;\n\npublic class MyMessageBuilder : IMessageBuilder\n\n\
    {\n\n}\n```\n\nAfter the above change has been made, the editor will report the\
    \ following error:\n\n`'MyMessageBuilder' does not implement interface member\
    \ 'IMessageBuilder.ShowMessage()``The `MyMessageBuilder` class generates this\
    \ error because it does not contain an implementation of the `ShowMessage()` method\
    \ as required by the `IMessageBuilder` interface. To conform to the interface,\
    \ we need to implement the `ShowMessage()` method:\n\n```csharp\nnamespace InterfaceDemo;\n\
    \npublic class MyMessageBuilder : IMessageBuilder\n\n{\n\npublic void ShowMessage()\n\
    \n{\n\n}\n\n}\n```\n\n# 19.5 Interface data members\n\nInterfaces can include\
    \ data members in addition to methods. An important rule when working with interfaces\
    \ is that variables must be declared as properties and cannot be declared as fields\
    \ or constants (for a reminder of the differences between fields and properties,\
    \ refer back to the [“An Introduction to C# Object-Oriented Programming”](#Object_Orientated_Programming.xhtml__idTextAnchor159)\
    \ chapter). The following declaration, therefore, will generate a syntax error:\n\
    \n```csharp\npublic interface IMessageBuilder\n\n{\n\nstring myMessage; // Fields\
    \ are invalid in interfaces\n\nvoid ShowMessage();\n}\n```\n\nInstead, the variable\
    \ needs to be declared as a property:\n\n```csharp\npublic interface IMessageBuilder\n\
    \n{\n\nstring MyMessage { get; set; }\n\nvoid ShowMessage();\n}\n```\n\nNote that\
    \ `get` and `set` accessor methods are declared but not implemented in the above\
    \ interface. As interface methods, the implementation is performed in the conforming\
    \ class declaration.\n\nNow that the `IMessageBuilder` is defined, let's implement\
    \ it in the `MyMessageBuilder` class:\n\n```csharp\npublic class MyMessageBuilder\
    \ : IMessageBuilder\n{\n    private string _myMessage;\n\n    public string MyMessage\n\
    \    {\n        get => _myMessage;\n        set => _myMessage = value;\n    }\n\
    \n    public void ShowMessage()\n    {\n        Console.WriteLine(_myMessage);\n\
    \    }\n}\n```\n\nNow, we can use the interface in `Program.cs`:\n\n```csharp\n\
    using InterfaceDemo;\n\nclass Program\n{\n    static void Main()\n    {\n    \
    \    IMessageBuilder builder = new MyMessageBuilder();\n        builder.MyMessage\
    \ = \"Hello from Interface!\";\n        builder.ShowMessage();\n    }\n}\n```\n\
    \n# 19.6 Take the interface\n\nRun the application to verify the output.\n\n#\
    \ 19.7 Summary\n\nThis chapter covered how to create and implement interfaces\
    \ in C#. We learned that interfaces define a contract that classes must follow,\
    \ and that variables in interfaces must be properties rather than fields.\n"
  raw: "19.3 Creating the InterfaceDemo project\n\nWith the basics of C# interfaces\
    \ covered, we can put this knowledge to use in an example project. Begin by creating\
    \ a new .NET Console App project in VS Code named InterfaceDemo.\n\n19.4 Adding\
    \ a C# interface file\n\nThe next step is to use the Solution Explorer to add\
    \ a new interface file to our project. The Solution Explorer is located at the\
    \ bottom of the Explorer panel as shown in [Figure 19-1](#Interfaces.xhtml__idTextAnchor246)\
    \ :\n\n![img](image/interface_solution_explorer.png)\n\nFigure 19-1\n\nWithin\
    \ the Solution Explorer, hover the mouse pointer over the InterfaceDemo entry\
    \ to display the new file and folder buttons:\n\n![img](image/interface_solution_explorer_buttons.png)\n\
    \nFigure 19-2\n\nClick the new file button indicated by the arrow in [Figure 19-2](#Interfaces.xhtml__idTextAnchor247)\
    \ above to display the Add New File palette as shown in [Figure 19-3](#Interfaces.xhtml__idTextAnchor248)\
    \ . Within the palette, select the Interface option:\n\n![img](image/new_interface_file.png)\n\
    \nFigure 19-3\n\nWhen prompted, name the interface IMessageBuilder before pressing\
    \ Enter to create the file. The new file will automatically load into the editor,\
    \ where it will read as follows:\n\nnamespace InterfaceDemo;\n\npublic interface\
    \ IMessageBuilder\n\n{\n\n}\n\nModify the interface declaration to add an interface\
    \ member named ShowMessage():\n\nnamespace InterfaceDemo;\n\npublic interface\
    \ IMessageBuilder\n\n{\n\nvoid ShowMessage();\n\n}\n\nAny class that adopts the\
    \ IMessageBuilder interface must include a ShowMessage() member. Use the Solutions\
    \ Explorer to add a Class file to the project named MyMessageBuilder and modify\
    \ it to implement the IMessageBuilder interface as follows:\n\nnamespace InterfaceDemo;\n\
    \npublic class MyMessageBuilder : IMessageBuilder\n\n{\n\n}\n\nAfter the above\
    \ change has been made, the editor will report the following error:\n\n'MyMessageBuilder'\
    \ does not implement interface member 'IMessageBuilder.ShowMessage()'\n\nThe MyMessageBuilder\
    \ class generates this error because it does not contain an implementation of\
    \ the ShowMessage() method as required by the IMessageBuilder interface. To conform\
    \ to the interface, we need to implement the ShowMessage() method:\n\nnamespace\
    \ InterfaceDemo;\n\npublic class MyMessageBuilder : IMessageBuilder\n\n{\n\npublic\
    \ void ShowMessage()\n\n{\n\n}\n\n}\n\n19.5 Interface data members\n\nInterfaces\
    \ can include data members in addition to methods. An important rule when working\
    \ with interfaces is that variables must be declared as properties and cannot\
    \ be declared as fields or constants (for a reminder of the differences between\
    \ fields and properties, refer back to the [“An Introduction to C# Object-Oriented\
    \ Programming”](#Object_Orientated_Programming.xhtml__idTextAnchor159) chapter).\
    \ The following declaration, therefore, will generate a syntax error:\n\npublic\
    \ interface IMessageBuilder\n\n{\n\nstring myMessage; // Fields are invalid in\
    \ interfaces\n\nvoid ShowMessage();\n\n}\n\nInstead, the variable needs to be\
    \ declared as a property:\n\npublic interface IMessageBuilder\n\n{\n\nstring MyMessage\
    \ { get; set; }\n\nvoid ShowMessage();\n\n}\n\nNote that get and set accessor\
    \ methods are declared but not implemented in the above interface. As interface\
    \ methods, the implementation is performed in the conforming class declaration.\n\
    \nNow that the IMessageBuilder interface requires a string property named MyMessage,\
    \ we need to modify the MyMessageBuilder class accordingly:\n\npublic class MyMessageBuilder\
    \ : IMessageBuilder\n\n{\n\nprivate string _myMessage = \"\";\n\npublic string\
    \ MyMessage\n\n{\n\nget => _myMessage;\n\nset => _myMessage = value;\n\n}\n\n\
    public void ShowMessage()\n\n{\n\nConsole.WriteLine(_myMessage);\n\n}\n\n}\n\n\
    Next, modify the Program.cs file to create the MyMessageBuilder object and call\
    \ the ShowMessage() method:\n\nusing InterfaceDemo;\n\nMyMessageBuilder msgBuilder\
    \ = new()\n\n{\n\nMyMessage = \"Interface Demo\"\n\n};\n\nmsgBuilder.ShowMessage();\n\
    \nFinally, build and run the app to test that the message is displayed.\n\n19.6\
    \ Take the knowledge test\n\nClick the link below or scan the QR code to test\
    \ your knowledge and understanding of C# Interfaces:\n\n[https://www.answertopia.com/2tw1](https://www.answertopia.com/2tw1)\n\
    \n![img](image/c_-interfaces.png) \n\n19.7 Summary\n\nC# interfaces define minimum\
    \ requirements for classes, ensuring compatibility with other libraries. To conform\
    \ with an interface, classes must implement matching interface methods and properties.\
    \ Interfaces can include data members, which must be declared as properties.\n\
    \n20\\. C# Structures\n\nHaving covered C# classes in the preceding chapters,\
    \ this chapter will introduce the use of structures in C#. Although at first glance\
    \ structures and classes look similar, there are some important differences that\
    \ need to be understood when deciding which to use. This chapter will outline\
    \ how to declare and use structures, explore the differences between structures\
    \ and classes and introduce the concepts of value and reference types.\n\n20.1\
    \ An overview of C# structures\n\nAs with classes, structures form the basis of\
    \ object-oriented programming and provide a way to encapsulate data and functionality\
    \ into reusable instances. Structure declarations resemble classes with the exception\
    \ that the struct keyword is used in place of the class keyword. The following\
    \ code, for example, declares a simple structure consisting of a String variable,\
    \ initializer, and method:\n\npublic struct SampleStruct(string name)\n\n{\n\n\
    private string _name = name;\n\npublic string Name {\n\nget => _name;\n\nset =>\
    \ _name = value;\n\n}\n\npublic string BuildHelloMsg() {\n\nreturn \"Hello \"\
    \ + _name;\n\n}\n\n}\n\nConsider the above structure declaration in comparison\
    \ to the equivalent class declaration:\n\npublic class SampleClass(string name)\n\
    \n{\n\nprivate string _name = name;\n\npublic string Name {\n\nget => _name;\n\
    \nset => _name = value;\n\n}\n\npublic string BuildHelloMsg() {\n\nreturn \"Hello\
    \ \" + _name;\n\n}\n\n}\n\nOther than the use of the struct keyword instead of\
    \ class, the two declarations are identical. Instances of each type are also created\
    \ using the same syntax:\n\nSampleStruct demoStruct = new(name: \"Alex\");\n\n\
    SampleClass demoClass = new(name: \"Anna\");\n\nGiven the commonality between\
    \ classes and structures, it is important to gain an understanding of how the\
    \ two differ. Before exploring the most significant difference it is first necessary\
    \ to understand the concepts of value types and reference types.\n\n20.2 Creating\
    \ the StructureDemo project\n\nLaunch VS Code, open your “C# Essentials” workspace\
    \ folder and create a new .NET Console App project named StructureDemo.\n\n20.3\
    \ Value types vs. reference types\n\nWhile on the surface structures and classes\
    \ look alike, major differences in behavior occur when structure and class instances\
    \ are copied or passed as arguments to methods. This occurs because structure\
    \ instances are value type while class instances are reference type .\n\nWhen\
    \ a structure instance is copied or passed to a method, an actual copy of the\
    \ instance is created, together with any data contained within the instance. This\
    \ means that the copy has its own version of the data which is unconnected with\
    \ the original structure instance. In effect, this means that there can be multiple\
    \ copies of a structure instance within a running app, each with its own local\
    \ copy of the associated data. A change to one instance has no impact on any other\
    \ instances.\n\nIn contrast, when a class instance is copied or passed as an argument,\
    \ the only thing duplicated or passed is a reference to the location in memory\
    \ where that class instance resides. Any changes made to the instance using those\
    \ references will be performed on the same instance. In other words, there is\
    \ only one class instance but multiple references pointing to it. A change to\
    \ the instance data using any one of those references changes the data for all\
    \ other references.\n\n20.4 Adding the Struct declaration"
