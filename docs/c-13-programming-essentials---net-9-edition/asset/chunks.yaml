    \ at 9/25/2024 9:53:58 AM\nEnd file3.txt at 9/25/2024 9:54:04 AM\n=== After async\
    \ tasks calls ===\nElapsed time: 18 seconds\n```\n\n### Asynchronous calls from\
    \ synchronous functions\n\n如之前提到的，异步方法期望在异步上下文中调用。然而，通过调用 `Task.Run()` 方法可以在同步上下文中启动异步任务。假设我们有一个同步方法\
    \ `SyncMethod()`，我们需要从中调用异步方法并尝试如下操作：\n\n```csharp\nprivate static void SyncMethod()\n\
    {\n    await AsyncMethod();\n}\n```\n\n上述代码会在编辑器中产生以下错误提示：\n\n'await' 算符只能在异步方法中使用。考虑标记此方法为\
    \ 'async' 修饰符并更改其返回类型为 'Task'。\n\n我们唯一的选择是将 `SyncMethod()` 改为异步方法，或者使用 `Task.Run()`\
    \ 方法启动任务。假设将 `SyncMethod()` 声明为异步方法不可行，在这种情况下，代码需要更改如下：\n\n```csharp\nprivate\
    \ static void SyncMethod()\n{\n    Task.Run(async () => {\n        await AsyncMethod();\n\
    \    });\n}\n```\n\n### Canceling asynchronous tasks\n\n活跃的异步任务可以随时使用 `CancellationTokenSource`\
    \ 类进行取消。`CancellationTokenSource` 实例包含一个唯一的 `CancellationToken` 对象，用于向运行的任务发送取消请求。为\
    \ `AsyncDemo` 项目添加取消支持，首先对 `Main()` 方法进行以下更改：\n\n```csharp\nstatic async Task\
    \ Main(string[] args)\n{\n    var tokenSource = new CancellationTokenSource();\n\
    \    var cancellationToken = tokenSource.Token;\n    // ...\n}\n```\n\n现在我们有了取消令牌，需要对\
    \ `ProcessFileAsync()` 方法进行一些更改，以便将其传递给执行 6 秒延迟的任务：\n\n```csharp\nprivate static\
    \ async Task<string> ProcessFileAsync(string filename ,\n    CancellationToken\
    \ cancellationToken )\n{\n    Console.WriteLine($\"Start {filename} at {DateTime.Now}\"\
    );\n    await Task.Delay(6000 , cancellationToken );\n    return filename;\n}\n\
    ```\n"
- fmt: "\nBefore we can add code to send a cancellation request, some additional steps\
    \ are required. As currently written, the app will crash when the task is canceled\
    \ with console output that will read in part:\n\n```\nUnhandled exception. System.AggregateException:\
    \ One or more errors occurred. (A task was canceled.)\n---> System.Threading.Tasks.TaskCanceledException:\
    \ A task was canceled.\nat System.Threading.Tasks.Task.GetExceptions(Boolean includeTaskCanceledExceptions)\n\
    ```\n\nThe problem here is that when a task is canceled it triggers an exception\
    \ which, if not handled correctly by the app, will result in a crash. The solution\
    \ to this is to configure the token to throw an `OperationCanceledException` error\
    \ when the task is canceled, and then use a `try-catch` statement to gracefully\
    \ handle the exception:\n\n```csharp\nprivate static async Task<string> ProcessFileAsync(string\
    \ filename, CancellationToken cancellationToken)\n{\n    Console.WriteLine($\"\
    Start {filename} at {DateTime.Now}\");\n    try\n    {\n        cancellationToken.ThrowIfCancellationRequested();\n\
    \        await Task.Delay(6000, cancellationToken);\n    }\n    catch (OperationCanceledException)\n\
    \    {\n        Console.WriteLine($\"{filename} processing cancelled\");\n   \
    \ }\n    return filename;\n}\n```\n\nIn the above example, we just output a message\
    \ indicating the task has been canceled, but in a real-world app, this is where\
    \ steps can be taken to clean up, such as removing temporary files or closing\
    \ network connections.\n\nThe final step is to provide a way for the user to cancel\
    \ the async tasks. We do this by calling the `Cancel()` method of the `CancellationTokenSource`\
    \ object:\n\n```csharp\ntokenSource.Cancel();\n```\n\nTo demonstrate canceling\
    \ the file tasks, we will add code after tasks have been launched to cancel the\
    \ tasks when a key is pressed as follows:\n\n```csharp\nstatic async Task Main(string[]\
    \ args)\n{\n    var tokenSource = new CancellationTokenSource();\n    var cancellationToken\
    \ = tokenSource.Token;\n    Console.WriteLine(\"\\n=== After async tasks ===\\\
    n\");\n    Console.Write(\"Press any key to cancel\");\n    Console.ReadKey();\n\
    \    tokenSource.Cancel();\n    Task.WaitAll(task1, task2, task3);\n}\n```\n\n\
    ## Summary\n\nAsynchronous programming in C# uses the `Task` class and `await`\
    \ operator to run tasks in parallel, improving performance and responsiveness.\
    \ The `await` operator suspends execution until a task is completed, allowing\
    \ other code to run. By converting synchronous methods to asynchronous ones, multiple\
    \ tasks can be executed simultaneously, reducing overall time. To achieve concurrent\
    \ execution, store `Task` objects returned by async methods and await their results\
    \ later. Cancellation of asynchronous tasks can be implemented using the `Cancel()`\
    \ method of the `CancellationTokenSource` object. When canceling tasks, appropriate\
    \ steps should be taken to handle exceptions to prevent the app from crashing.\n\
    \n## 25 Creating 2D, 3D, and Jagged Arrays in C#\n\nArrays are certainly not unique\
    \ to C#. In fact, just about other programming and scripting language preceding\
    \ the introduction of C# provided support for arrays. An array allows a collection\
    \ of values of the same type to be stored and accessed via a single variable.\
    \ Each item is accessed in the array through the use of an array index.\n\nC#\
    \ arrays, while useful, have some limitations. Perhaps the most significant limitation\
    \ is the fact that once an array has been created, it cannot be made larger or\
    \ smaller to accommodate more or fewer values. More dynamic and flexible collection\
    \ storage will be covered starting with the chapter titled \"List Collections\"\
    .\n\n### 25.1 Creating arrays in C#\n\nA C# array may be created in several different\
    \ ways. One way is to declare an array without initializing it with any values.\
    \ The syntax for this is follows:\n\n`type[] arrayname;`\n\nIn the above example,\
    \ `type` represents the type of data to be stored in the array (for example, `string`,\
    \ `int`, `decimal` etc.). The square brackets `[]` indicate that this is the declaration\
    \ for an array, and `arrayname` is the name by which the array is to referred.\n\
    \nFor example, we can declare an array of strings called `myColors` as follows:\n\
    \n```csharp\nstring[] myColors;\n```\n\nIn this example, we have declared the\
    \ array but not assigned any values to it. To assign values after an array has\
    \ been declared, use the following syntax:\n\n```csharp\nstring[] myColors;\n\
    myColors = new string[] {\"red\", \"green\", \"yellow\", \"orange\", \"blue\"\
    };\n```\n\nAn array may also be initialized in the declaration line simply by\
    \ placing the comma-separated list of values after the declaration:\n\n```csharp\n\
    string[] myColors = new string[] {\"red\", \"green\", \"yellow\", \"orange\",\
    \ \"blue\"};\n```\n\nAnother option is to declare the size of the array when it\
    \ is created. For example, to declare an array of size 5, place the size value\
    \ within the square brackets of the `new` statement:\n\n```csharp\nstring[] myColors\
    \ = new string[5];\n```\n\nThis will reserve the space required for the full array\
    \ without actually placing any values into the array. The array elements may be\
    \ initialized at creation as follows (note that the number of elements must match\
    \ the size specified):\n\n```csharp\nstring[] myColors = new string[5] {\"red\"\
    , \"green\", \"yellow\", \"orange\", \"blue\"};\n```\n\n### 25.2 Declaring multidimensional\
    \ arrays\n\nMultidimensional arrays are declared by placing commas within the\
    \ square brackets. For example, to declare a two-dimensional array:\n\n```csharp\n\
    char[,] my2Darray;\n```\n\nThe single comma `,` in the above syntax indicates\
    \ to C# that this is to a two-dimensional array. A two-dimensional array is initialized\
    \ as follows:\n\n```csharp\nchar[,] my2Darray =\n{\n    {'a', 'b', 'c'},\n   \
    \ {'c', 'd', 'e'},\n    {'c', 'd', 'e'}\n};\n```\n\nThis creates a multidimensional\
    \ array containing three rows and three columns.\n\nWhen the array was declared\
    \ above, the task of inferring the array dimensions was left to the C# compiler.\
    \ These dimensions may also be specified when the array is declared using the\
    \ `new` statement, for example:\n\n```csharp\nchar[,] my2Darray = new char[3,3]\n\
    {\n    {'a', 'b', 'c'},\n    {'c', 'd', 'e'},\n    {'c', 'd', 'e'}\n};\n```\n\n\
    The following, on the other hand, declares a three-dimensional array:\n\n```csharp\n\
    int[,,] my3Darray;\n```\n\nThe following code will initialize the three-dimensional\
    \ array:\n\n```csharp\nchar[,,] my3Darray =\n{\n    {\n        {'a', 'b', 'c'},\n\
    \        {'c', 'd', 'e'}\n    },\n    {\n        {'f', 'g', 'h'},\n        {'i',\
    \ 'j', 'k'}\n    }\n};\n```\n\nA three-dimensional array is essentially an array\
    \ where each element is a two-dimensional array. In the above declaration, the\
    \ array consists of two arrays, each of which contains a two-dimensional array,\
    \ each containing three elements. This translates to an array with three dimensions\
    \ of 2, 2, and 3.\n\nIt is also possible to specify the dimensions when the array\
    \ is declared as follows:\n\n```csharp\nchar[,,] my3Darray2 = new char[2,2,3]\n\
    {\n    {\n        {'a', 'b', 'c'},\n        {'c', 'd', 'e'}\n    },\n    {\n \
    \       {'f', 'g', 'h'},\n        {'i', 'j', 'k'}\n    }\n};\n```\n\n### 25.3\
    \ Declaring jagged arrays\n"
  raw: "Before we can add code to send a cancellation request, some additional steps\
    \ are required. As currently written, the app will crash when the task is canceled\
    \ with console output that will read in part:\n\nUnhandled exception. System.AggregateException:\
    \ One or more errors occurred. (A task was canceled.)\n\n---> System.Threading.Tasks.TaskCanceledException:\
    \ A task was canceled.\n\nat System.Threading.Tasks.Task.GetExceptions(Boolean\
    \ includeTaskCanceledExceptions)\n\nThe problem here is that when a task is canceled\
    \ it triggers an exception which, if not handled correctly by the app, will result\
    \ in a crash. The solution to this is to configure the token to throw an OperationCanceledException\
    \ error when the task is canceled, and then use a try-catch statement to gracefully\
    \ handle the exception:\n\nprivate static async Task<string> ProcessFileAsync(string\
    \ filename, CancellationToken cancellationToken)\n\n{\n\nConsole.WriteLine($\"\
    Start {filename} at {DateTime.Now}\");\n\ntry\n\n{\n\ncancellationToken.ThrowIfCancellationRequested();\n\
    \nawait Task.Delay(6000, cancellationToken);\n\n}\n\ncatch (OperationCanceledException)\n\
    \n{\n\nConsole.WriteLine($\"{filename} processing cancelled\");\n\n}\n\nreturn\
    \ filename;\n\n}\n\nIn the above example, we just output a message indicating\
    \ the task has been canceled, but in a real-world app, this is where steps can\
    \ be taken to clean up, such as removing temporary files or closing network connections.\n\
    \nThe final step is to provide a way for the user to cancel the async tasks. We\
    \ do this by calling the Cancel() method of the CancellationTokenSource object:\n\
    \ntokenSource.Cancel();\n\nTo demonstrate canceling the file processing tasks,\
    \ we will add code after the tasks have been launched to cancel the tasks when\
    \ a key is pressed as follows:\n\nstatic async Task Main(string[] args)\n\n{\n\
    \nvar tokenSource = new CancellationTokenSource();\n\nvar cancellationToken =\
    \ tokenSource.Token;\n\n.\n\n.\n\nConsole.WriteLine(\"\\n=== After async tasks\
    \ calls ===\\n\");\n\nConsole.Write(\"Press any key to cancel\");\n\nConsole.ReadKey();\n\
    \ntokenSource.Cancel();\n\nTask.WaitAll(task1, task2, task3);\n\n.\n\n.\n\nRerun\
    \ the app, click in the console window, and tap any key within 6 seconds to cancel\
    \ the tasks. The console output should indicate that the cancellation exception\
    \ was handled cleanly and that the tasks were canceled before completing their\
    \ work:\n\n=== Before async task calls ===\n\nStart file1.txt at 9/26/2024 2:15:04 PM\n\
    \nStart file2.txt at 9/26/2024 2:15:04 PM\n\nStart file3.txt at 9/26/2024 2:15:04 PM\n\
    \n=== After async tasks calls ===\n\nPress any key to cancel\n\nfile3.txt processing\
    \ canceled\n\nfile2.txt processing canceled\n\nfile1.txt processing canceled\n\
    \nEnd file1.txt at 9/26/2024 2:15:06 PM\n\nEnd file2.txt at 9/26/2024 2:15:06 PM\n\
    \nEnd file3.txt at 9/26/2024 2:15:06 PM\n\nElapsed time: 1 seconds\n\n24.11 Take\
    \ the knowledge test\n\nClick the link below or scan the QR code to test your\
    \ knowledge and understanding of C# asynchronous programming:\n\n[https://www.answertopia.com/akfm](https://www.answertopia.com/akfm)\n\
    \n![img](image/c_-async.png) \n\n24.12 Summary\n\nAsynchronous programming in\
    \ C# uses the Task class and await operator to run tasks in parallel, improving\
    \ performance and responsiveness. The await operator suspends execution until\
    \ a task is completed, allowing other code to run concurrently. By converting\
    \ synchronous methods to asynchronous ones, multiple tasks can be executed simultaneously,\
    \ reducing overall execution time.\n\nTo achieve concurrent execution, store Task\
    \ objects returned by async methods and await their results later. Cancellation\
    \ of asynchronous tasks can be implemented using the Cancel() method of the CancellationTokenSource\
    \ object. When canceling tasks, appropriate steps should be taken to handle exceptions\
    \ to prevent the app from crashing.\n\n25\\. Creating 2D, 3D, and Jagged Arrays\
    \ in C#\n\nArrays are certainly not unique to C#. In fact, just about every other\
    \ programming and scripting language preceding the introduction of C# provided\
    \ support for arrays. An array allows a collection of values of the same type\
    \ to be stored and accessed via a single variable. Each item is accessed in the\
    \ array variable through the use of an array index.\n\nC# arrays, while useful,\
    \ have some limitations. Perhaps the most significant limitation is the fact that\
    \ once an array has been created, it cannot be made larger or smaller to accommodate\
    \ more or fewer values. More dynamic and flexible collection storage capabilities\
    \ will be covered starting with the chapter titled [“C# List Collections”](#List_Collections.xhtml__idTextAnchor335)\
    \ .\n\n25.1 Creating arrays in C#\n\nA C# array may be created in several different\
    \ ways. One way is to declare an array without initializing it with any values.\
    \ The syntax for this is as follows:\n\ntype[] arrayname;\n\nIn the above example,\
    \ type represents the type of data to be stored in the array (for example, string,\
    \ int, decimal etc). The square brackets ([]) indicate that this is the declaration\
    \ for an array, and arrayname is the name by which the array is to be referred.\n\
    \nFor example, we can declare an array of strings called myColors as follows:\n\
    \nstring[] myColors;\n\nIn this example, we have declared the array but not assigned\
    \ any values to it. To assign values after an array has been declared, use the\
    \ following syntax:\n\nstring[] myColors;\n\nmyColors = [\"red\", \"green\", \"\
    yellow\", \"orange\", \"blue\"];\n\nAn array may also be initialized in the declaration\
    \ line simply by placing the comma-separated list of values after the declaration:\n\
    \nstring[] myColors = [\"red\", \"green\", \"yellow\", \"orange\", \"blue\"];\n\
    \nAnother option is to declare the size of the array when it is created. For example,\
    \ to declare an array of size 5, place the size value within the square brackets\
    \ of the new statement:\n\nstring[] myColors = new string[5];\n\nThis will reserve\
    \ the space required for the full array without actually placing any values into\
    \ the array. The array elements may be initialized at creation as follows (note\
    \ that the number of elements must match the size specified):\n\nstring[] myColors\
    \ = new string[5] { \"red\", \"green\", \"yellow\", \"orange\", \"blue\" };\n\n\
    25.2 Declaring multidimensional arrays\n\nMultidimensional arrays are declared\
    \ by placing commas within the square brackets. For example, to declare a two-dimensional\
    \ array:\n\nchar[,] my2Darray;\n\nThe single comma (,) in the above syntax indicates\
    \ to C# that this is to a two-dimensional array. A two-dimensional array is initialized\
    \ as follows:\n\nchar[,] my2Darray =\n\n{\n\n{'a', 'b', 'c'},\n\n{'c', 'd', 'e'},\n\
    \n{'c', 'd', 'e'}\n\n};\n\nThis creates a multidimensional array containing three\
    \ rows and three columns.\n\nWhen the array was declared above, the task of inferring\
    \ the array dimensions was left to the C# compiler. These dimensions may also\
    \ be specified when the array is declared using the new statement, for example:\n\
    \nchar[,] my2Darray = new char[3,3]\n\n{\n\n{'a', 'b', 'c'},\n\n{'c', 'd', 'e'},\n\
    \n{'c', 'd', 'e'}\n\n};\n\nThe following, on the other hand, declares a three-dimensional\
    \ array:\n\nint[,,] my3Darray;\n\nThe following code will initialize the three-dimensional\
    \ array:\n\nchar[,,] my3Darray =\n\n{\n\n{\n\n{ 'a', 'b', 'c' },\n\n{ 'c', 'd',\
    \ 'e' }\n\n},\n\n{\n\n{ 'f', 'g', 'h' },\n\n{ 'i', 'j', 'k' }\n\n}\n\n};\n\nA\
    \ three-dimensional array is essentially an array where each element is a two-dimensional\
    \ array. In the above declaration, the array consists of two arrays, each of which\
    \ contains a two-dimensional array, each containing three elements. This translates\
    \ to an array with three dimensions of 2, 2, and 3\\.\n\nIt is also possible to\
    \ specify the dimensions when the array is declared as follows:\n\nchar[,,] my3Darray2\
    \ = new char[2,2,3]\n\n{\n\n{\n\n{ 'a', 'b', 'c' },\n\n{ 'c', 'd', 'e' }\n\n},\n\
    \n{\n\n{ 'f', 'g', 'h' },\n\n{ 'i', 'j', 'k' }\n\n}\n\n};\n\n25.3 Declaring jagged\
    \ arrays"
