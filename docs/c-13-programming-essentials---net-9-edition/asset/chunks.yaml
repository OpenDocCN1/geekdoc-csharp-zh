  trans: "\n\n在我们添加用于发送取消请求的代码之前，需要一些额外的步骤。按照目前的写法，当任务被取消时，应用程序将会崩溃，控制台输出部分如下：\n\n\
    ```\nUnhandled exception. System.AggregateException: One or more errors occurred.\
    \ (A task was canceled.)\n---> System.Threading.Tasks.TaskCanceledException: A\
    \ task was canceled.\nat System.Threading.Tasks.Task.GetExceptions(Boolean includeTaskCanceledExceptions)\n\
    ```\n\n这里的问题在于，当任务被取消时，会触发一个异常，如果应用程序没有正确处理该异常，就会导致崩溃。解决方案是配置令牌在任务取消时抛出 `OperationCanceledException`\
    \ 错误，然后使用 `try-catch` 语句来优雅地处理该异常：\n\n```csharp\nprivate static async Task<string>\
    \ ProcessFileAsync(string filename, CancellationToken cancellationToken)\n{\n\
    \    Console.WriteLine($\"Start {filename} at {DateTime.Now}\");\n    try\n  \
    \  {\n        cancellationToken.ThrowIfCancellationRequested();\n        await\
    \ Task.Delay(6000, cancellationToken);\n    }\n    catch (OperationCanceledException)\n\
    \    {\n        Console.WriteLine($\"{filename} processing cancelled\");\n   \
    \ }\n    return filename;\n}\n```\n\n在上面的示例中，我们只是输出了一条表示任务已取消的消息，但在实际应用中，可以在此步骤采取清理措施，例如删除临时文件或关闭网络连接。\n\
    \n最后一步是为用户提供一种取消异步任务的方法。我们通过调用 `CancellationTokenSource` 对象的 `Cancel()` 方法来实现：\n\
    \n```csharp\ntokenSource.Cancel();\n```\n\n为了演示取消文件任务，我们将在任务启动后添加代码，以便在按下按键时取消任务，如下：\n\
    \n```csharp\nstatic async Task Main(string[] args)\n{\n    var tokenSource = new\
    \ CancellationTokenSource();\n    var cancellationToken = tokenSource.Token;\n\
    \    Console.WriteLine(\"\\n=== After async tasks ===\\n\");\n    Console.Write(\"\
    Press any key to cancel\");\n    Console.ReadKey();\n    tokenSource.Cancel();\n\
    \    Task.WaitAll(task1, task2, task3);\n}\n```\n\n## 总结\n\nC# 中的异步编程使用 `Task`\
    \ 类和 `await` 操作符来并行运行任务，从而提高性能和响应能力。`await` 操作符会挂起执行，直到任务完成，允许其他代码运行。通过将同步方法转换为异步方法，可以同时执行多个任务，缩短总时间。要实现并发执行，请存储异步方法返回的\
    \ `Task` 对象并在稍后等待它们的结果。异步任务的取消可以使用 `CancellationTokenSource` 对象的 `Cancel()` 方法实现。在取消任务时，应该采取适当步骤处理异常，以防止应用程序崩溃。\n\
    \n## 25 在 C# 中创建 2D、3D 和交错数组\n\n数组显然并不是 C# 特有的。事实上，在 C# 引入之前，几乎所有的其他编程和脚本语言都提供了对数组的支持。数组允许通过单个变量存储并访问相同类型的值的集合。数组中的每个项都通过数组索引进行访问。\n\
    \nC# 数组虽然很有用，但存在一些局限性。也许最重要的局限性是，一旦创建了数组，就无法扩大或缩小它以容纳更多或更少的值。更动态、灵活的集合存储将从“列表集合”（List\
    \ Collections）章节开始介绍。\n\n### 25.1 在 C# 中创建数组\n\n可以用几种不同的方式创建 C# 数组。一种方法是声明数组但不使用任何值对其初始化。其语法如下：\n\
    \n`type[] arrayname;`\n\n在上面的示例中，`type` 表示存储在数组中的数据类型（例如 `string`、`int`、`decimal`\
    \ 等）。方括号 `[]` 表示这是数组的声明，`arrayname` 是引用该数组的名称。\n\n例如，我们可以这样声明一个名为 `myColors` 的字符串数组：\n\
    \n```csharp\nstring[] myColors;\n```\n\n在这个示例中，我们声明了数组但没有给它分配任何值。在声明数组后分配值，请使用以下语法：\n\
    \n```csharp\nstring[] myColors;\nmyColors = new string[] {\"red\", \"green\",\
    \ \"yellow\", \"orange\", \"blue\"};\n```\n\n也可以在声明行中通过通过在声明后放置逗号分隔的值列表来初始化数组：\n\
    \n```csharp\nstring[] myColors = new string[] {\"red\", \"green\", \"yellow\"\
    , \"orange\", \"blue\"};\n```\n\n另一个选项是在创建数组时指定大小。例如，要声明一个大小为 5 的数组，请在 `new` 语句的方括号内放置大小值：\n\
    \n```csharp\nstring[] myColors = new string[5];\n```\n\n这将为完整数组保留空间，而不会实际向数组中放置任何值。数组元素可以在创建时如下所示初始化（注意元素数量必须与指定的尺寸匹配）：\n\
    \n```csharp\nstring[] myColors = new string[5] {\"red\", \"green\", \"yellow\"\
    , \"orange\", \"blue\"};\n```\n\n### 25.2 声明多维数组\n\n多维数组通过在方括号内放置逗号来声明。例如，声明一个二维数组：\n\
    \n```csharp\nchar[,] my2Darray;\n```\n\n上述语法中的单个逗号 `,` 告诉 C# 这是一个二维数组。二维数组的初始化方式如下：\n\
    \n```csharp\nchar[,] my2Darray =\n{\n    {'a', 'b', 'c'},\n    {'c', 'd', 'e'},\n\
    \    {'c', 'd', 'e'}\n};\n```\n\n这创建了一个包含三行三列的多维数组。\n\n在上面声明数组时，推断数组维度的任务交给了 C#\
    \ 编译器。在用 `new` 语句声明数组时，也可以指定这些维度，例如：\n\n```csharp\nchar[,] my2Darray = new char[3,3]\n\
    {\n    {'a', 'b', 'c'},\n    {'c', 'd', 'e'},\n    {'c', 'd', 'e'}\n};\n```\n\n\
    另一方面，下面的代码声明了一个三维数组：\n\n```csharp\nint[,,] my3Darray;\n```\n\n以下代码将初始化三维数组：\n\n\
    ```csharp\nchar[,,] my3Darray =\n{\n    {\n        {'a', 'b', 'c'},\n        {'c',\
    \ 'd', 'e'}\n    },\n    {\n        {'f', 'g', 'h'},\n        {'i', 'j', 'k'}\n\
    \    }\n};\n```\n\n三维数组本质上是一个每个元素都是二维数组的数组。在上面的声明中，数组由两个数组组成，每个数组包含一个二维数组，每个二维数组包含三个元素。这翻译为一个维度为\
    \ 2、2 和 3 的数组。\n\n也可以在如下所示声明数组时指定维度：\n\n```csharp\nchar[,,] my3Darray2 = new char[2,2,3]\n\
    {\n    {\n        {'a', 'b', 'c'},\n        {'c', 'd', 'e'}\n    },\n    {\n \
    \       {'f', 'g', 'h'},\n        {'i', 'j', 'k'}\n    }\n};\n```\n\n### 25.3\
    \ 声明交错数组\n\n"
- fmt: "\nA jagged array is an array where each element is itself an array. The term\
    \ jagged is used in this context because the array elements can be of different\
    \ lengths. A jagged array can be thought of as a 2D array where each array can\
    \ have a different number of elements.\n\nThe following is an example of a declaration\
    \ for a jagged array designed to hold two-dimensional arrays of variable sizes:\n\
    \n```csharp\nchar[][] myJaggedArray;\n```\n\nThe following code declares and initializes\
    \ the same jagged array:\n\n```csharp\nchar[][] myJaggedArray = [\n    ['a', 'b',\
    \ 'c', 'd', 'e'],\n    ['f', 'g', 'h', 'i'],\n    ['j', 'j'],\n    ['k', 'l',\
    \ 'm', 'n', 'o', 'p', 'q', 'r']\n];\n```\n\n### 25.4 Take the knowledge test\n\
    \nClick the link below or scan the QR code to test your knowledge and understanding\
    \ of C# arrays:\n\n[https://www.answertopia.com/e6ca](https://www.answertopia.com/e6ca)\n\
    \n![img](image/c_-arrays.png)\n\n### 25.5 Summary\n\nC# arrays allow collections\
    \ of values of the same type, with each item accessed through an index. Multidimensional\
    \ arrays are declared with commas within square brackets, while jagged arrays\
    \ are arrays of arrays with varying lengths.\n\n## 26. Accessing and Sorting C#\
    \ Array Elements\n\nThe previous chapter explained how to create 2-dimensional,\
    \ 3-dimensional, and jagged arrays in C#. In this chapter, we will explore how\
    \ to access, remove, and sort the elements of an array.\n\n#### 26.1 Creating\
    \ the ArrayDemo Project\n\nLaunch VS Code, open your “C# Essentials” workspace\
    \ folder and create a new .NET Console App project named `ArrayDemo`.\n\nOnce\
    \ you have created the project, open the `Program.cs` file and use it to try out\
    \ the examples in the rest of this chapter.\n\n#### 26.2 Getting the number of\
    \ dimensions of an array\n\nThe number of dimensions of an array can be obtained\
    \ via the `Rank` property of the array. For example:\n\n```csharp\nchar[,] my2Darray\
    \ = new char[3,3]\n{\n    {'a', 'b', 'c'},\n    {'c', 'd', 'e'},\n    {'c', 'd',\
    \ 'e'}\n};\n\nchar[,,] my3Darray = new char[2,2,3]\n{\n    {\n        { 'a', 'b',\
    \ 'c' },\n        { 'c', 'd', 'e' }\n    },\n    {\n        { 'f', 'g', 'h' },\n\
    \        { 'i', 'j', 'k' }\n    }\n};\n\nConsole.WriteLine($\"Dimensions in my2Darray\
    \ = {my2Darray.Rank}\");\nConsole.WriteLine($\"Dimensions in my3Darray = {my3Darray.Rank}\"\
    );\n```\n\nOutput:\n```\nDimensions in my2Darray = 2\nDimensions in my3Darray\
    \ = 3\n```\n\n#### 26.3 Accessing array elements\n\nOnce values have been stored\
    \ in an array, it is highly likely that these values will need to be accessed\
    \ at some later point in the C# code. This is achieved using the array accessor\
    \ notation combined with the index into the array of the desired value. The array\
    \ accessor is simply the array name followed by square brackets (`[]`). Within\
    \ the square brackets is placed a number representing the index into the array\
    \ of the desired value (keeping in mind that the first array element in C# is\
    \ index 0). For example, to access the second element of our `myColors` array,\
    \ the following notation would be used:\n\n```csharp\nstring[] myColors = {\"\
    red\", \"green\", \"yellow\", \"orange\", \"blue\"};\nConsole.WriteLine($\"Element\
    \ at index 1 = {myColors[1]}\");\n```\n\nWhen executed, the above code will output\
    \ the word “green” since this is the string contained at index position 1 in the\
    \ array.\n\nSimilarly, the value at a particular index position in an array may\
    \ be changed using the accessor notation combined with the assignment operator\
    \ (`=). For example, to change the value of the first item in the array:\n\n```csharp\n\
    string[] myColors = [\"red\", \"green\", \"yellow\", \"orange\", \"blue\"];\n\
    myColors[0] = \"violet\";\nConsole.WriteLine($\"Element at index 0 = {myColors[0]}\"\
    );\n```\n\nValues in a multidimensional array may be accessed by specifying the\
    \ index values for each dimension separated by commas. For example, to access\
    \ the first element of the first array of our `my2Darray` the following accessor\
    \ would be used (keeping in mind that arrays start at index position 0):\n\n```csharp\n\
    char element = my2Darray[0,0];\n```\n\nThe following code demonstrates accessing\
    \ a variety of elements, both in 2D and 3D arrays:\n\n```csharp\nchar[,] my2Darray\
    \ = new char[3,3]\n{\n    {'a', 'b', 'c'},\n    {'d', 'e', 'f'},\n    {'g', 'h',\
    \ 'i'}\n};\n\nchar[,,] my3Darray =\n{\n    {\n        { 'a', 'b', 'c' },\n   \
    \     { 'd', 'e', 'f' }\n    },\n    {\n        { 'g', 'h', 'i' },\n        {\
    \ 'j', 'k', 'l' }\n    }\n};\n\n// Output first element of first array in my2Darray\n\
    Console.WriteLine($\"{my2Darray[0,0]}\");\n// Output last element of last array\
    \ in my2Darray\nConsole.WriteLine($\"{my2Darray[2,2]}\");\n// Output 2nd element\
    \ of 2nd array in 1st 2D array of my3Darray\nConsole.WriteLine($\"{my3Darray[0,1,1]}\"\
    );\n// Output 3rd element of 2nd array in 1st 2D array of my3Darray\nConsole.WriteLine($\"\
    {my3Darray[0,1,2]}\"); // Note: based on logic of indices\n```\n\n#### 26.4 Array\
    \ iteration\n\nThe easiest way to iterate through an array is to use the `foreach`\
    \ statement. For example, iterates through all items in an array:\n\n```csharp\n\
    string[] myColors = [\"red\", \"green\", \"yellow\", \"orange\", \"blue\"];\n\
    foreach (string color in myColors)\n{\n    Console.Write(\"{0} \", color);\n}\n\
    ```\n\nOutput:\n```\nred yellow yellow orange blue\n```\n\nYou can use useforeach`\
    \ to iterate through multidimensional arrays. The following example, we through\
    \ through-dimensionaldimensional\n\n\n\n```cchar\nchar,, my my =Darray =\n\n\n\
    \n{\n    {\n        { 'a', 'b', 'c' },\n        { 'd', 'e' }\n    },\n    {\n\
    \        { 'f', 'g', 'h' },\n        { 'i', 'j', 'k' }\n    }\n};\n\nforeach (char\
    \ letter in my3Darray)\n{\n    Console.Write(\"{0} \", letter);\n}\n```\n\nOutput:\n\
    ```\na b c d e f h\n k\n\n#### 26.5 Working with ranges\n\nThe C# range (`..`)\
    \ and index from end (`^`) operators are particularly useful for accessing subsets\
    \ of array. Ranges are constructed using the following syntax where `x` and `y`\
    \ represent the beginning and end values, respectively: `x..y`. When working with\
    \ ranges, it is important to remember that range `x..y` encompasses all numbers\
    \ from `x` up to, not including, `y`. The range `5..8`, therefore, specifies the\
    \ positions 5, 6, and 7.\n\nOne-sided range operators specify a range that can\
    \ extend as far as possible in a specified direction until the natural beginning\
    \ or end of the range is reached (or until some other condition is met). A one-sided\
    \ range is declared by omitting the number from one side of the range, for example:\
    \ `x..` or `..y`. A range to specify two elements in an array starting with position\
    \ 2 through the last could be declared as follows: `2..`. Similarly, to specify\
    \ a range that begins with the first element and ends with the element at position\
    \ 5, the range would be specified as `..6`. The following example extracts items\
    \ 4 through 6 and assigns them to a new array named `words`:\n\n```csharp\nstring[]\
    \ sentence = [\"The\", \"best\", \"way\", \"to\", \"predict\", \"the\", \"future\"\
    , \"is\", \"to\", \"invent\", \"it\"];\nstring[] words = sentence[4..7];\n```\n\
    \nSimilarly, we can use the following range syntax to extract words starting at\
    \ element 0 and ending at element 4:\n\n```csharp\nstring[] words = sentence[..5];\n\
    ```\n\nWe can also combine the index operator with the range operator to perform\
    \ operations similar to the following which extracts elements starting at position\
    \ 1 until the second from last element of the array:\n\n```csharp\nstring[] words\
    \ = sentence[1..^2];\n```\n\nTry the following code to see the above examples\
    \ in action:\n\n```csharp\nstring[] sentence = [\"The\", \"best\", \"way\", \"\
    to\", \"predict\", \"the\", \"future\", \"is\", \"to\", \"invent\", \"it\"];\n\
    string[] subset1 = sentence[^7..^4];\nstring[] subset2 = sentence[..^2];\nstring[]\
    \ subset3 = sentence[3..^3];\n\nforeach (string word in subset1)\n{\n    Console.Write(\"\
    {0} \", word);\n}\nConsole.WriteLine(\"\\n\");\n\nforeach (string word in subset2)\n\
    {\n    Console.Write(\"{0} \", word);\n}\nConsole.WriteLine(\"\\n\");\n\nforeach\
    \ (string word in subset3)\n{\n    Console.Write(\"{0} \", word);\n}\nConsole.WriteLine(\"\
    \\n\");\n```\n\nWhen the above code runs, it will generate the following output:\n\
    ```\npredict the future\nThe best way to predict the future is to\nto predict\
    \ the future is\n```\n\n#### 26.6 C# index from end operator\n"
