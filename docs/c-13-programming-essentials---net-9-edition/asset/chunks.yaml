    \ 类来演示 C# 面向对象编程的概念。第一步是使用 `Solution Explorer` 向项目添加一个新的类文件。`Solution Explorer`\
    \ 位于 `Explorer` 面板的底部，如图 13-5 所示：\n\n![img](img/vs_code_solution_explorer.png)\n\
    图 13-5\n\n在 `Solution Explorer` 中，将鼠标指针悬停在 `ObjectDemo` 条目上以显示新文件和文件夹按钮：\n\n![img](img/vs_code_solution_explorer_add_file.png)\n\
    图 13-6\n\n点击 `Add New File...` 按钮将显示 `Add New File` 面板，如图 13-7 所示。在面板中，选择 `Class`\
    \ 选项：\n\n![img](img/vs_code_solution_explorer_new_class.png)\n图 13-7\n\n在提示时，将类命名为\
    \ `BankAccount` 然后按 `Enter` 创建文件。新文件将自动加载到编辑器中，内容如下：\n\n```csharp\nusing System;\n\
    \nnamespace ObjectDemo;\n\npublic class BankAccount\n{\n}\n```\n\n## 13.5 访问修饰符\n\
    \n当 VS Code 生成我们的 `BankAccount` 类时，它使用了 `public` 访问修饰符。访问修饰符控制类是否可以从项目的其他代码访问，并可以应用于\
    \ C# 中的多种类型，包括类、方法、成员、属性和字段。C# 支持以下访问修饰符：\n\n- `public` - 访问没有限制。\n- `protected`\
    \ - 仅可以在包含类或该类的派生类内部访问。\n- `private` - 仅可以在包含类内部访问。\n- `file` - 仅在包含的源文件中可用。\n\
    - `internal` - 仅允许类所在的程序集（通常是构成编译后可执行文件或库的代码）内的代码访问。\n- `protected internal` -\
    \ 允许当前程序集内或包含类的派生类访问。\n- `private protected` - 仅允许包含类或当前程序集内的派生类访问。\n\n## 13.6\
    \ 创建 C# 类成员\n\n类成员、字段或属性本质上是嵌入在类中的变量和方法（方法的概念在本章稍后介绍）。成员可以是 `public`、`private`\
    \ 或 `protected`。\n\n`public` 成员可以从对象外部访问，并在派自当前类的类中可见。`private` 成员只能由类中包含的方法访问，派生类无法访问。`protected`\
    \ 类仅对派生类可用。\n\n这是数据封装的关键。面向对象编程规范规定，数据应该封装在类中，并且仅通过类的方法（通常称为 `getters` 和 `setters`）进行访问和设置。\n\
    \n在实现数据封装时，理解 C# 类声明中字段和属性的区别非常重要。\n\n## 13.7 字段 vs 属性\n\n直接声明为变量的类成员称为 `field`。例如，在下面的类中，`firstname`\
    \ 变量被声明为字段：\n\n```csharp\npublic class MyClass {\n    public string firstname\
    \ = \"\"; // 这是一个字段\n}\n```\n\n这被称为 `public field`。当这样声明时，类外部的代码可以直接访问并更改此变量。\n\
    \n然而，面向对象编程指南建议字段通常应保护免受直接访问（称为 `private fields`）。在 C# 中，这通过声明一个 `property` 实现，该属性反过来提供了对底层字段的访问。\n\
    \n属性具有一个名称并声明特殊的 `get` 和 `set` 方法（称为访问器方法），使用以下语法访问底层字段：\n\n```csharp\npublic\
    \ string <property name> {\n    get {\n        return <field name>;\n    }\n \
    \   set {\n        <field name> = value;\n    }\n}\n```\n\n`get` 方法的代码返回赋值给字段的值。另一方面，`set`\
    \ 方法接收一个名为 `value` 的变量。\n\n声明访问器的更简洁的方法是使用 lambda 运算符 (`=>`) 来分配 get 和 set 表达式（Lambda\
    \ 主题将在匿名方法、Lambda 和本地函数章节中介绍）：\n\n```csharp\npublic string <property name> {\n\
    \    get => <field name>;\n    set => <field name> = value;\n}\n```\n\n使用上述方法，我们可以这样简化\
    \ MyClass 示例：\n\n```csharp\npublic class MyClass {\n    private string _firstname\
    \ = \"\";\n    public string FirstName {\n        get => _firstname;\n       \
    \ set => _firstname = value;\n    }\n}\n```\n\n是否将所有字段封装在属性中而不提供公共字段，取决于你遵循面向对象编程规范的程度。你在微软的\
    \ C# 参考文档中也能看到这两种示例。\n\n## 13.8 为 BankAccount 类添加成员\n\n我们现在可以扩展 `BankAccount`\
    \ 类，添加存储账户名称和的字段。根据数据封装的概念，我们将这些字段设为私有并使用属性提供访问：\n\n```csharp\n.\nnamespace ObjectDemo;\n\
    \npublic class BankAccount\n{\n    private string _accountName = \"\";\n    private\
    \ int _accountNumber = 0;\n\n    public string AccountName {\n        get => _accountName;\n\
    \        set => _accountName = value;\n    }\n\n    public int AccountNumber {\n\
    \        get => _accountNumber;\n        set => _accountNumber = value;\n    }\n\
    }\n```\n\n## 13.9 静态、只读和常量数据成员\n\n除了我们目前过的的数据成员类型外，C# 还支持几种额外的成员类型。\n\n"
