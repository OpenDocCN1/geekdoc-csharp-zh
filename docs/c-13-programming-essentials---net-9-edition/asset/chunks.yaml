    \n## 9.6 Summary\n\nThe term `control flow` describes the logic that dictates\
    \ the execution path through an application’s source code as it runs. This chapter\
    \ has examined conditional control flow and explored how the `if` and `else` statements\
    \ are used to implement this type of flow logic.\n\n## 10. The C# switch Statement\n\
    \nIn this chapter, we will introduce the C# `switch` statement and demonstrate\
    \ why it is a better alternative to complicated `if` ... `else if` ... statements.\n\
    \nIn the previous chapter, we looked at controlling program execution flow using\
    \ the `if` and `else` statements. While these statement constructs work well for\
    \ testing a limited number of conditions, they quickly become unwieldy when dealing\
    \ with more significant numbers of possible conditions. C# has inherited the `switch`\
    \ statement from the C programming language.\n\nIn this chapter, we will explore\
    \ the `switch` statement in detail.\n\n### 10.1 Why use the switch statement?\n\
    \nFor a few logical value evaluations, the `if` ... `else if` ... construct is\
    \ perfectly adequate. Unfortunately, any more than two or three possible scenarios\
    \ can quickly make such a construct both time-consuming to write and difficult\
    \ to read. As a case in point, consider the following code example. The program\
    \ uses `if` ... `else if` ... statements to identify the manufacturer of a car\
    \ based on the model name:\n\n```csharp\nstring carModel = \"Corolla\";\nstring\
    \ carManufacturer;\n\nif ((String.Compare(carModel, \"Patriot\") == 0) ||\n(String.Compare(carModel,\
    \ \"Liberty\") == 0) ||\n(String.Compare(carModel, \"Wrangler\") == 0)) {\n  \
    \  carManufacturer = \"Jeep\";\n}\nelse if (String.Compare(carModel, \"Focus\"\
    ) == 0) {\n    carManufacturer = \"Ford\";\n}\nelse if (String.Compare(carModel,\
    \ \"Corolla\") == 0) {\n    carManufacturer = \"Toyota\";\n} else {\n    carManufacturer\
    \ = \"unknown\";\n}\n\nConsole.WriteLine($\"Manufacturer is {carManufacturer}\"\
    );\n```\n\nWhile the code is not excessive, it is already starting to become somewhat\
    \ hard to read and takes more time to write than necessary. Imagine, however,\
    \ if instead of 3 car models, we had to test for 10 or 20 models. Clearly, a more\
    \ straightforward solution is needed, and that solution is the `switch` statement.\n\
    \n### 10.2 Using the switch statement\n\nThe syntax for a C# `switch` statement\
    \ is as follows:\n\n```csharp\nswitch (value){\n    case constant:\n        statements\n\
    \        break/jump\n    case constant:\n        statements\n        break/jump\n\
    \    default:\n        statements\n        break/jump\n}\n```\n\nThis syntax needs\
    \ some explanation before we create a switch-based version of the above `if` ...\
    \ `else if` ... construct.\n\nIn the above syntax outline, `value` represents\
    \ either a value or an expression that returns a value. This is the value against\
    \ which the `switch` operates. Using our example, this would be the string representing\
    \ the car model.\n\nA `case` statement is required for each possible match, followed\
    \ by a constant value (once again, using our example, this would be the car models).\
    \ Each `case` constant must be of the same type as the governing `value`. Following\
    \ the `case` line are the C# statements to be executed if the value matches the\
    \ `case` constant.\n\nAfter the statements comes an optional `break`, `goto`,\
    \ or `continue` statement. These statements break out of the `switch` statement\
    \ when a match is found, jump to a specific location in the code, or skip any\
    \ remaining code in a loop and begin the next iteration.\n\nFinally, the `default:`\
    \ section of the construct defines what should happen if none of the `case` statements\
    \ present a match to the `value`.\n\n### 10.3 A switch statement example\n\nWith\
    \ the above information in mind, we may now construct a `switch` statement that\
    \ provides the same functionality as our previous and somewhat unwieldy `if` ...\
    \ `else if` ... construct:\n\n```csharp\nstring carModel = \"Corolla\";\nstring\
    \ carManufacturer;\n\nswitch (carModel) {\n    case \"Patriot\":\n    case \"\
    Liberty\":\n    case \"Wrangler\":\n        carManufacturer = \"Jeep\";\n    \
    \    break;\n    case \"Focus\":\n        carManufacturer = \"Ford\";\n      \
    \  break;\n    case \"Corolla\":\n        carManufacturer = \"Toyota\";\n    \
    \    break;\n    default:\n        carManufacturer = \"unknown\";\n        break;\n\
    }\n\nConsole.WriteLine($\"Manufacturer is {carManufacturer}\");\n```\n\n### 10.4\
    \ Explaining the example\n\nIn the above example, the string assigned to the `carModel`\
    \ variable is used as the governing variable in the `switch` statement. As with\
    \ the Jeep manufacturer, `case` statements may be grouped, preceding a single\
    \ set of statements.\n\nThe `default` option sets the `carManufacturer` string\
    \ to “unknown” if none of the `case` statements match the car string.\n\n### 10.5\
    \ Using switch expressions\n\nUsing a `switch` statement has saved us some typing\
    \ and made the code easier to read, but C# allows us to further simplify the code\
    \ using `switch` expressions, the syntax for which is as follows:\n\n```csharp\n\
    result = value switch\n{\n    constant1 => statements,\n    constant2 => statements,\n\
    \    constant3 or constant4 => statements,\n    constant5 and constant6 or constant7\
    \ => statements,\n    _ => default_statement\n};\n```\n\nUsing a `switch` expression,\
    \ our example can be simplified as follows:\n\n```csharp\nstring carModel = \"\
    Corolla\";\nstring carManufacturer;\n\ncarManufacturer = carModel switch\n{\n\
    \    \"Patriot\" or \"Liberty\" or \"Wrangler\" => \"Jeep\",\n    \"Focus\" =>\
    \ \"Ford\",\n    \"Corolla\" => \"Toyota\",\n    _ => \"unknown\"\n};\n\nConsole.WriteLine($\"\
    Manufacturer is {carManufacturer}\");\n```\n\n### 10.6 Using goto in a C# switch\
    \ statement\n\nIn our original example, we used the `break` statement to exit\
    \ out of the `switch` statement. The result of this is to move the point of program\
    \ execution to the statements immediately following the `switch` statement. Unfortunately,\
    \ this presents a problem when the `default` statements must be executed. To address\
    \ this requirement, we can replace the `break` statements in our example code\
    \ with a `goto default` statement:\n\n```csharp\nstring carModel = \"Corolla\"\
    ;\nstring carManufacturer = \"unknown\";\n\nswitch (carModel) {\n    case \"Patriot\"\
    :\n    case \"Liberty\":\n    case \"Wrangler\":\n        carManufacturer = \"\
    Jeep\";\n        goto default;\n    case \"Focus\":\n        carManufacturer =\
    \ \"Ford\";\n        goto default;\n    case \"Corolla\":\n        carManufacturer\
    \ = \"Toyota\";\n        goto default;\n    default:\n        Console.WriteLine($\"\
    The {carModel} is manufactured by {carManufacturer}\");\n        break;\n}\n```\n\
    \nWhile the `goto` statement could also be used to jump to a labeled location\
    \ in our C# code, using it in this way is strongly discouraged. The above-mentioned\
    \ use is the only acceptable use of the `goto` statement in a modern object-oriented\
    \ language such as C#. As any veteran programmer will tell you, if you find yourself\
    \ in a position where a `goto` statement is your only way of achieving something,\
    \ you need to re-think and re-structure your code so that you no longer need the\
    \ `goto`.\n\n## 10.7 Using continue in a C# switch statement\n"
