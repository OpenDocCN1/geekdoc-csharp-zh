  trans: "\n\n命名空间（Namespaces）允许将应用程序代码组织在独立的范围内（称为空间），以便一个命名空间中的名称不会与其他命名空间中的相同名称冲突。在没有特定命名空间的情况下，如上方的声明属于全局命名空间的成员，如下方的图\
    \ 22-1 所示：\n\n![img](img/name_conflict.png)\n\n图 22-1 \n\n除了重命名其中一个类之外，解决 `ClassA`\
    \ 命名冲突的唯一方法是将一个或两个类移动到不同的命名空间中。在本章的剩余部分中，我们将创建一个项目来解决上述问题，并更详细地探索命名空间。\n\n## 22.3\
    \ 创建 NamespaceDemo 项目\n\n启动 `VS Code`，打开你的“C# Essentials”工作空间文件夹，创建一个名为 `NamespaceDemo`\
    \ 的新 `.NET` 控制台应用程序项目。\n\n在资源生成器（Explorer）面板中找到该新项目，编辑 `Program.cs` 文件，并将现有代码替换为以下内容：\n\
    \n```csharp\nclass ClassA {\n    public static void OpenFile() {\n        Console.WriteLine(\"\
    First ClassA OpenFile()\");\n    }\n}\n\nclass ClassA {\n    public static void\
    \ OpenFile() {\n        Console.WriteLine(\"Second ClassA OpenFile()\");\n   \
    \ }\n}\n\nnamespace SampleApp\n{\n    internal class Program\n    {\n        static\
    \ void Main(string[] args)\n        {\n        }\n    }\n}\n```\n\n此时，编辑器将在第二个\
    \ `ClassA` 声明处报告以下语法错误：\n\n命名空间 '<global namespace>' 已经包含对 'ClassA' 的定义\n\n这告诉我们两个类都位于相同的命名空间（在本例中为全局命名空间），并且具有冲突的名称。为了解决这个问题，我们需要创建另一个命名空间。\n\
    \n## 22.4 声明命名空间\n\n命名空间使用 `namespace` 关键字声明，后跟一个名称和封装命名空间成员的大括号。为了解决命名冲突，我们可以将第二个\
    \ `ClassA` 声明放在单独的命名空间中，而将第一个留在全局命名空间中：\n\n```csharp\nclass ClassA {\n    public\
    \ static void OpenFile() {\n        Console.WriteLine(\"ClassA OpenFile()\");\n\
    \    }\n}\n\nnamespace DemoSpace\n{\n    class ClassA {\n        public static\
    \ void OpenFile() {\n            Console.WriteLine(\"Second ClassA OpenFile()\"\
    );\n        }\n    }\n}\n```\n\n进行上述更改后，重复定义的错误应该会被解决：\n\n![img](img/name_conflict_resolved.png)\n\
    \n图 22-2 \n\n单个源文件可以包含多个命名空间。修改示例以包含两个命名空间，如下：\n\n```csharp\nnamespace DemoSpaceOne\n\
    {\n    class ClassA {\n        public static void OpenFile() {\n            Console.WriteLine(\"\
    First ClassA OpenFile()\");\n        }\n    }\n}\n\nnamespace DemoSpaceTwo\n{\n\
    \    class ClassA {\n        public static void OpenFile() {\n            Console.WriteLine(\"\
    Second ClassA OpenFile()\");\n        }\n    }\n}\n```\n\n通过此更改，我们的项目现在包含了三个命名空间（除了调用\
    \ `Console.WriteLine()`所需的 `System` 命名空间外）：`DemoSpaceOne`、`DemoSpaceTwo` 和全局命名空间：\n\
    \n![img](img/multiple_namespaces.png)\n\n图 22-3 \n\n## 22.5 访问命名空间成员\n\n由于两个 `ClassA`\
    \ 定义包含在不同的命名空间中，我们需要一种方法来告诉编译器我们正在访问哪个类。使用点表示法（dot notation），我们可以通过引用相应的命名空间来区分类。如下修改\
    \ `Main()` 方法，以调用每个 `ClassA` 实现的 `OpenFile()` 方法：\n\n```csharp\nnamespace SampleApp\n\
    {\n    internal class Program\n    {\n        static void Main(string[] args)\n\
    \        {\n            DemoSpaceOne.ClassA.OpenFile();\n            DemoSpaceTwo.ClassA.OpenFile();\n\
    \        }\n    }\n}\n```\n\n"
- fmt: "\nIn this chapter, we have explored C# namespaces and learned how they are\
    \ used to organize project code and avoid naming conflicts. Namespaces are declared\
    \ using the `namespace` keyword and accessed using dot notation. File-scoped namespaces\
    \ allow entire source files to be designated as belonging to the same namespace.\n\
    \n# 23. C# Exception Handling\n\nIn a perfect world, C# code would never encounter\
    \ an error. Since we don’t live in a perfect world, it’s impossible to guarantee\
    \ that an error (more commonly referred to as an exception) won’t occur while\
    \ your code is executing. Therefore, it’s crucial to ensure the code gracefully\
    \ handles any exceptions that may arise.\n\nThis chapter covers exception handling\
    \ using C#, introducing topics like exception types, how exceptions are thrown,\
    \ and how to handle them using `try-catch` statements.\n\n## 23.1 Understanding\
    \ exception handling\n\nNo matter how meticulously your C# code is designed and\
    \ implemented, there will always be situations beyond the app’s control. For instance,\
    \ an app relying on an active network connection can’t control the loss of that\
    \ connection. What the app can do, however, is implement robust exception handling,\
    \ like displaying a message to the user, or silently attempting to re-establish\
    \ the lost network connection.\n\nException handling in C# involves two main aspects:\
    \ triggering (or throwing) an exception when desired results aren’t achieved within\
    \ a method and catching and handling the exception after it’s thrown by another\
    \ method.\n\nWhen an exception is thrown, it has a specific exception type that\
    \ can be used to identify the nature of the exception and decide on the most appropriate\
    \ course of action. When throwing exceptions in your code, you can use the built-in\
    \ exception types, or create and throw custom exception types derived from the\
    \ `System.Exception` class.\n\nWhile learning about exception handling in C, remember\
    \ that in addition to implementing code in your app to throw exceptions when necessary,\
    \ many API methods in the C# and .NET frameworks also throw exceptions that must\
    \ be handled within your app’s code. Failure to do so typically results in a runtime\
    \ exception and your app crashing.\n\n## 23.2 Creating the ExceptionDemo project\n\
    \nLaunch VS Code, open your “C# Essentials” workspace folder, and create a new\
    \ .NET Console App project named `ExceptionDemo`. Once the project is ready, modify\
    \ the `Program.cs` file as follows:\n\n```csharp\nnamespace ExceptionDemo\n{\n\
    \    internal class Program\n    {\n        static void Main(string[] args)\n\
    \        {\n        }\n    }\n}\n```\n\nThe project is a hypothetical app that\
    \ controls an electric motor. During the power-on diagnostics, the app reads the\
    \ current voltage and prevents the motor from starting if it exceeds 500 volts.\
    \ Remaining in the `Program.cs` file, add a method to perform the voltage check\
    \ and call it from the `Main()` method:\n\n```csharp\nnamespace ExceptionDemo\n\
    {\n    internal class Program\n    {\n        static void Main(string[] args)\n\
    \        {\n            VoltageCheck(501);\n        }\n\n        private static\
    \ void VoltageCheck(int voltage)\n        {\n            if (voltage > 500)\n\
    \            {\n                Console.WriteLine(\"Voltage overload.\");\n  \
    \          }\n            else\n            {\n                Console.WriteLine(\"\
    Voltage is safe.\");\n            }\n        }\n    }\n}\n```\n\nRun the app and\
    \ check that the voltage overload message appears in the console:\n\n```\nVoltage\
    \ overload.\n```\n\nA voltage overload is a serious issue, so we want to do more\
    \ than display a message and hope the user doesn’t just start the motor. Instead,\
    \ we want to force the app to take preventative measures. To do this, we will\
    \ throw an exception.\n\n## 23.3 Throwing exceptions\n\nThe first step in throwing\
    \ an exception is to choose an exception type. As we mentioned previously, exceptions\
    \ can be thrown using one of the many built-in types or a custom type you have\
    \ created. We will cover custom exception types later in the chapter, so for now,\
    \ we will use the `ArgumentOutOfRangeException` type. This exception type is typically\
    \ thrown when an argument passed to a method is outside an acceptable range (in\
    \ our case, a voltage reading exceeding 500 volts).\n\nNext, an instance of the\
    \ exception type is created and initialized. All exception types must be initialized\
    \ with a message explaining the cause of the problem. Some types, including `ArgumentOutOfRangeException`,\
    \ also require the name of the parameter that caused the exception (in our case,\
    \ the `voltage`). With this information, we can create a new exception as follows:\n\
    \n`ArgumentOutOfRangeException voltageException = new(nameof(voltage), \"Voltage\
    \ exceeds safety parameters.\");`\n\nExceptions are thrown using the `throw` statement\
    \ followed by the exception object, as follows:\n\n```csharp\nthrow voltageException;\n\
    ```\n\nIn the above examples, we have created and thrown the exception as separate\
    \ steps. This sequence is, however, typically performed in a single operation:\n\
    \n`throw new ArgumentOutOfRangeException(nameof(voltage), \"Voltage exceeds safety\
    \ parameters.\");`\n\nModify the `VoltageCheck()` method to throw an exception\
    \ as follows:\n\n```csharp\nprivate static void VoltageCheck(int voltage)\n{\n\
    \    if (voltage > 500)\n    {\n        throw new ArgumentOutOfRangeException(nameof(voltage),\
    \ \"Voltage exceeds safety parameters.\");\n    }\n    else\n    {\n        Console.WriteLine(\"\
    Safe Voltage\");\n    }\n}\n```\n\nRefer to the console, where the following output\
    \ will appear:\n\n```\nUnhandled exception. System.ArgumentOutOfRangeException:\
    \ Voltage exceeds safety parameters. (Parameter 'voltage')\nat ExceptionDemo.Program.VoltageCheck(Int32\
    \ voltage) in Program.cs:line 16\nat ExceptionDemo.Program.Main(String[] args)\
    \ in Program.cs:line 8\n```\n\nThis message tells us the app was terminated due\
    \ to an unhandled exception. The error includes the exception type, the message,\
    \ and the name of the parameter that caused the exception.\n\nWe now need to add\
    \ additional code to handle the exception when it is thrown.\n\n## 23.4 Handling\
    \ exceptions\n\nExceptions in C# are handled using `try-catch` statements. To\
    \ prevent our app from crashing when the exception is thrown, we must make the\
    \ following changes to the `Main()` method:\n\n```csharp\nstatic void Main(string[]\
    \ args)\n{\n    try\n    {\n        VoltageCheck(501);\n    }\n    catch\n   \
    \ {\n        Console.WriteLine(\"Voltage too high - disconnecting power\");\n\
    \    }\n}\n```\n\nWhen the app runs, the `try-catch` statement will handle the\
    \ exception and allow the app to take corrective action.\n\nIt is also possible\
    \ to access the exception object within the body of the catch block, providing\
    \ access to the message:\n\n```csharp\ntry\n{\n    VoltageCheck(501);\n}\ncatch\
    \ (ArgumentOutOfRangeException ex)\n{\n    Console.WriteLine(ex.Message);\n}\n\
    ```\n\nSo far, we have implemented code to handle a single exception type. The\
    \ code within the body of the `try` block may, however, throw a variety of exception\
    \ types. By accessing the exception object, we can identify the exception type\
    \ and take type-specific actions. For example:\n\n```csharp\ncatch (Exception\
    \ ex)\n{\n    if (ex is ArgumentOutOfRangeException)\n    {\n        Console.WriteLine(ex.Message);\n\
    \    }\n    else if (ex is NullReferenceException)\n    {\n        Console.WriteLine(ex.Message);\n\
    \    }\n}\n```\n\n## 23.5 Creating exception filters with the “when” keyword\n\
    \nIn the above example, we used an `if ... else if` statement to take different\
    \ actions depending on the type of the caught exception. The `when` keyword provides\
    \ a higher-level filtering option to control whether a catch block meets specific\
    \ rules. The syntax for using `when` in a catch block is as follows:\n\n```csharp\n\
    try\n{\n}\ncatch (<exception>) when (<boolean expression>)\n{\n}\n```\n\nThe code\
    \ within the catch block will only execute if the Boolean expression after the\
    \ `when` keyword evaluates to true. This is particularly useful for catching more\
    \ than one exception type within a single catch block. The following code, for\
    \ example, will only catch the exception if it matches either of the given types:\n\
    \n```csharp\ncatch (Exception ex) when (ex is ArgumentOutOfRangeException || ex\
    \ is ArgumentException)\n```\n\nException filters can contain any Boolean logical\
    \ expression, with or without exception type matching. The following catch block\
    \ will only execute if the exception type is `ArgumentException` and the `motorTemp`\
    \ variable exceeds 102:\n\n```csharp\ntry\n{\n    VoltageCheck(501);\n}\ncatch\
    \ (Exception ex) when (ex is ArgumentException && motorTemp > 102)\n{\n}\n```\n"
