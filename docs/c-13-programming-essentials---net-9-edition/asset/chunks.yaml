    \ }\n};\n\nforeach (var movie in movies) {\n    var key = movie.Key;\n    var\
    \ value = movie.Value;\n    Console.WriteLine($\"{key} - {value}\");\n}\n```\n\
    **输出:**\n```text\nDRA-1212 - The Godfather\nWAR-4433 - Apocalypse Now\nCOM-5465\
    \ - The Terminal\nCLA-1659 - Casablanca\n```\n\n正如我们在上面的代码中所看到的，字典中的每个条目都具有 `Key`\
    \ 和 `Value` 属性。在这种情况下，我们使用了这些属性来提取每个字典条目的键和电影标题。\n\n## 28.5 添加和删除字典条目\n\n可以通过通过调用实例的\
    \ `Add()` 方法并传递键/值对，向现有字典中添加新条目：\n\n```csharp\nvar movies = new Dictionary<string,\
    \ string>()\n{\n    { \"DRA-1212\", \"The Godfather\" },\n    { \"WAR-4433\",\
    \ \"Apocalypse Now\" },\n    { \"COM-5465\", \"The Terminal\" },\n    { \"CLA-1659\"\
    , \"Casablanca\" }\n};\n\nmovies.Add(\"SCI-2323\", \"Prometheus\");\nConsole.WriteLine(movies[\"\
    SCI-2323\"]);\n```\n**输出:**\n```text\nPrometheus\n```\n\n你可以通过调用 `Remove()` 方法并引用与要删除条目匹配的键从字典中删除条目：\n\
    \n```csharp\nvar movies = new Dictionary<string, string>()\n{\n    { \"DRA-1212\"\
    , \"The Godfather\" },\n    { \"WAR-4433\", \"Apocalypse Now\" },\n    { \"COM-5465\"\
    , \"The Terminal\" },\n    { \"CLA-1659\", \"Casablanca\" }\n};\n\nmovies.Remove(\"\
    WAR-4433\");\n\nforeach (var movie in movies) {\n    var key = movie.Key;\n  \
    \  var value = movie.Value;\n    Console.WriteLine($\"{key} - {value}\");\n}\n\
    ```\n**输出:**\n```text\nDRA-1212 - The Godfather\nCOM-5465 - The Terminal\nCLA-1659\
    \ - Casablanca\n```\n\n## 28.6 访问和更新字典项\n\n可以使用键下标语法通过引用相应的值来访问或修改特定值。以下代码引用了已知在\
    \ `movies` 字典中的键，并输出关联的值（在本例中是标题为“The Terminal”的电影）：\n\n```csharp\nvar movies\
    \ = new Dictionary<string, string>()\n{\n    { \"DRA-1212\", \"The Godfather\"\
    \ },\n    { \"WAR-4433\", \"Apocalypse Now\" },\n    { \"COM-5465\", \"The Terminal\"\
    \ },\n    { \"CLA-1659\", \"Casablanca\" }\n};\n\nConsole.WriteLine(movies[\"\
    COM-5465\"]);\n```\n**输出:**\n```text\nThe Terminal\n```\n\n在更新与指定键关联的值时，也可以使用键进行索引，例如，将同一部电影的标题从“The\
    \ Terminal”更改为“Caddyshack”：\n\n```csharp\nvar movies = new Dictionary<string,\
    \ string>()\n{\n    { \"DRA-1212\", \"The Godfather\" },\n    { \"WAR-4433\",\
    \ \"Apocalypse Now\" },\n    { \"COM-5465\", \"The Terminal\" },\n    { \"CLA-1659\"\
    , \"Casablanca\" }\n};\n\nmovies[\"COM-5465\"] = \"Caddyshack\";\nConsole.WriteLine(movies[\"\
    COM-5465\"]);\n```\n**输出:**\n```text\nCaddyshack\n```\n\n## 28.7 检查键或值是否存在\n\n\
    可以通过调用 `ContainsKey()` 方法搜索字典以查找其是否包含特定键。在向字典添加新条目之前，你可能想要调用此方法以确保键尚未被使用，以避免运行时异常错误。\n\
    \n你还可以通过调用 `ContainsValue()` 方法检查字典中是否存在特定值。以下示例演示了这两种方法：\n\n```csharp\nvar movies\
    \ = new Dictionary<string, string>()\n{\n    { \"DRA-1212\", \"The Godfather\"\
    \ },\n    { \"WAR-4433\", \"Apocalypse Now\" },\n    { \"COM-5465\", \"The Terminal\"\
    \ },\n    { \"CLA-1659\", \"Casablanca\" }\n};\n\nif (movies.ContainsKey(\"CLA-1659\"\
    )) {\n    Console.WriteLine(\"Key exists in dictionary\");\n}\n\nif (movies.ContainsValue(\"\
    The Godfather\")) {\n    Console.WriteLine(\"Title exists in dictionary\");\n\
    }\n```\n**输出:**\n```text\nKey exists in dictionary\nTitle exists in dictionary\n\
    ```\n\n## 28.8 参加知识测试\n\n点击下方的链接或扫描二维码来测试你对 C# 字典集合的知识和理解：\n\n[`www.answertopia.com/mdz6`](https://www.answertopia.com/mdz6)\n\
    \n![img](img/c_-dictionaries.png)\n\n## 28.9 总结\n\nC# 字典存储键值对，允许高效的数据管理。它们可以使用集合进行初始化。\n\
    \n# 29. C# 文件和目录\n\n在本章中，我们将探索如何在使用 C# 中处理文件和目录，使用 `System.IO` 命名空间提供的类。\n\n##\
    \ 29.1 介绍 System.IO\n\n当我们在 C# 中处理文件和目录时，使用 `System.IO` 命名空间提供的类。完成本章后，你将能够使用如下：\n\
    \n- `Path`: 管理路径字符串、构建新路径以及获取现有路径的信息。\n- `Directory`: 创建、删除和导航目录结构。\n- `DirectoryInfo`:\
    \ 类似于 `Directory` 的非静态方法，使用目录初始化实例化。\n- `File`: 创建、复制和打开文件。\n- `FileInfo`: 类似于\
    \ `File` 的非静态方法，使用文件路径初始化实例。\n- `StreamReader`/StreamWriter`: 提供 `File` 和 `FileInfo`\
    \ 更灵活的文件读取和写入方案。这些类用于处理文本文件。\n- `BinaryReader`/BinaryWriter`: 与 `StreamReader`\
    \ 和 `StreamWriter` 功能相同，但用于处理二进制数据。\n\n## 29.2 理解 C# 中的路径\n\n路径由字符串值表示，根据操作系统而有所不同。在\
    \ Windows 系统上，每个路径组件都用反斜杠 `\\` 分隔，并通常以驱动器字母开头。使用标准 UNIX 规范的系统（macOS、Linux、iOS、Android\
    \ 等）使用正斜杠 `/` 来分隔组件。\n\n当程序启动时，工作目录是启动程序所在的目录。可以使用 `Directory` 和 `DirectoryInfo`\
    \ 方法更改应用程序的工作目录。\n\n文件顶层目录称为根目录，由 `/` 或 `\\` 分隔符表示。以 `/` 或 `\\` 开头的路径被称为绝对路径，因为它们指定了相对于根目录的文件位置。例如，`/home/demo`\
    \ 和 `C:\\Temp\\Files` 是绝对路径。\n\n不以斜杠开头的路径被解释为相对于当前工作目录。因此，如果工作目录是 `C:\\Users\\\
    Demo` 而路径是 `Documents\\Letters`，那么该路径被认为等同于完整路径 `C:\\Users\\Demo\\Documents\\\
    Letters`。\n\nWindows 风格的路径存在问题，因为反斜杠字符在 C# 字符串中表示转义序列。因此，以下路径会导致语法错误：\n\n```csharp\n\
    \"C:\\Users\\Demo\\Desktop\\Profile.txt\"\n```\n\n一种方案是如下转义反斜杠：\n\n```csharp\n\
    \"C:\\\\Users\\\\Demo\\\\Desktop\\\\Profile.txt\"\n```\n\n或者，Windows 路径可以使用字符串字面量表示：\n\
    \n```csharp\n@\"C:\\Users\\Demo\\Desktop\\Profile.txt\"\n```\n\n## 29.3 创建 FileDemo\
    \ 项目\n\n"
- fmt: "\nLaunch VS Code, open your “C# Essentials” workspace folder, and create a\
    \ new .NET Console App project named `FileDemo`. Once the project is ready, open\
    \ the `Program.cs` file and use it to try out the code examples in the rest of\
    \ the chapter.\n\n## 29.4 Current working directory\n\nThe initial current working\
    \ directory of an app is the directory from which it was launched and can be identified\
    \ using the `Directory` class. Edit the `Program.cs` file and use the static `Directory.GetCurrentDirectory()`\
    \ method, as follows:\n\n```csharp\nstring currentDirectory = Directory.GetCurrentDirectory();\n\
    Console.WriteLine(currentDirectory);\n```\n\nClick the run button and check the\
    \ terminal output where the current directory will be displayed. For example:\n\
    \n`/Users/neilsmyth/Documents/Books/C#_13/C# Essentials/FileDemo`\n\n## 29.5 Checking\
    \ if a directory exists\n\nBoth the `Directory` and `DirectoryInfo` classes provide\
    \ a way to identify if a directory exists at a specified path. The following code\
    \ checks for the existence of a directory named `MyFiles`. Note that since we\
    \ are not prefixing the path with ‘/’ or ‘\\’, the directory name is relative\
    \ to the current working directory:\n\n```csharp\nif (Directory.Exists(\"MyFiles\"\
    ))\n{\n    Console.WriteLine(\"Directory Exists.\");\n}\nelse\n{\n    Console.WriteLine(\"\
    Directory does not exist.\");\n}\n```\n\nThe same result can be achieved by creating\
    \ a `DirectoryInfo` instance initialized with the directory path and accessing\
    \ the `Exists` property:\n\n```csharp\nDirectoryInfo dirInfo = new(\"MyFiles\"\
    );\nif ( dirInfo.Exists )\n{\n    Console.WriteLine(\"Directory Exists.\");\n\
    }\nelse\n{\n    Console.WriteLine(\"Directory does not exist.\");\n}\n```\n\n\
    ## 29.6 Creating a Directory\n\nHaving identified that the directory does not\
    \ exist, the next step is to create it. Directories are created in C# using the\
    \ `Directory.CreateDirectory()` static method, or the `Create()` method of a `DirectoryInfo`\
    \ object, for example:\n\n```csharp\nif (Directory.Exists(\"MyFiles\"))\n{\n \
    \   Console.WriteLine(\"Directory Exists.\");\n}\nelse\n{\n    Console.WriteLine(\"\
    Directory does not exist - creating...\");\n    Directory.CreateDirectory(\"MyFiles\"\
    );\n}\n\nDirectoryInfo dirInfo = new(\"MyFiles\");\nif (dirInfo.Exists)\n{\n \
    \   Console.WriteLine(\"Directory Exists.\");\n}\nelse\n{\n    Console.WriteLine(\"\
    Directory does not exist - creating...\");\n    dirInfo.Create();\n}\n```\n\n\
    When the code runs, the first statement will detect that the directory does not\
    \ exist and create it, the second statement will report that the directory now\
    \ exists:\n\n```\nDirectory does not exist - creating...\nDirectory Exists.\n\
    ```\n\n## 29.7 Deleting a Directory\n\nExisting directories are deleted using\
    \ the `Delete()` method of the `Directory` class, passing through as an argument\
    \ the path of the directory to be deleted, for example:\n\n```csharp\nDirectory.Delete(\"\
    /Temp/Images\");\n```\n\nIf the directory contains files or other sub-directories,\
    \ the above method call will trigger an I/O exception indicating that the directory\
    \ is not empty. To override this exception and delete the directory and all its\
    \ files and subdirectories, pass it a Boolean `true` value as follows:\n\n```csharp\n\
    Directory.Delete(\"/Temp/Images\", true);\n```\n\n## 29.8 Changing the current\
    \ working directory\n\nThe current working directory can be changed by calling\
    \ the `Directory.SetCurrentDirectory()` method and passing it the destination\
    \ directory as an argument. As with all directory-related operations, the provided\
    \ path can be absolute or relative. Add the following lines to the `Program.cs`\
    \ file to change directory to the `MyFiles` folder:\n\n```csharp\nDirectory.SetCurrentDirectory(\"\
    MyFiles\");\nConsole.WriteLine(Directory.GetCurrentDirectory());\n```\n\nRun the\
    \ code and confirm that the current directory has changed to the `MyFiles` subdirectory,\
    \ for example:\n\n`/Users/neilsmyth/Dropbox/Documents/Books/C#_13/C# Essentials/FileDemo/MyFiles`\n\
    \n## 29.9 Handling File and Directory Exceptions\n\nWhen working with files and\
    \ directories in C#, it is important to note that many operations have the potential\
    \ to throw exceptions. Consider, for example, the above code to change the current\
    \ working directory. The example works because we had checked for the existence\
    \ of the `MyFiles` directory, and created it if necessary. The result, however,\
    \ would have been different if the directory did not exist. To see this in action,\
    \ add the following code to the project:\n\n```csharp\nDirectory.SetCurrentDirectory(\"\
    MyFiles1\");\n```\n\nClick the run button, at which point the program will terminate\
    \ with the following unhandled `DirectoryNotFoundException` error:\n\n```\nUnhandled\
    \ exception. System.IO.DirectoryNotFoundException: Could not find a part of the\
    \ path '/temp/MyFiles1'.\nat Interop.ThrowExceptionForIoErrno(ErrorInfo errorInfo,\
    \ String path, Boolean isDirError)\n```\n\nTo avoid unhandled exceptions, file\
    \ and directory handling must be coded defensively (for example checking a directory\
    \ or file exists before referencing it) or performed within try-catch statements\
    \ similar to the following:\n\n```csharp\ntry\n{\n    Directory.SetCurrentDirectory(\"\
    MyFiles1\");\n}\ncatch (Exception ex)\n{\n    Console.WriteLine($\"{ex.Message}\"\
    );\n}\n```\n\n## 29.10 File handling using the File class\n\nWith the basics of\
    \ directory handling in C# covered, it is time to look at working with files.\
    \ The `System.IO.File` class provides a range of static methods for working with\
    \ files, including creation, deletion, copying, reading, and writing. Equivalent\
    \ methods are provided by the `FileInfo` class.\n\n### 29.10.1 Checking if a file\
    \ exists\n\nAs with directories, we can check for the presence of a file at a\
    \ specified path by calling the `File.Exists()` method:\n\n```csharp\nif (File.Exists(\"\
    /tmp/MyFile.txt\"))\n{\n}\n```\n\n### 29.10.2 Creating and opening files\n\nWe\
    \ can also create and open files using the `File.Open()` method combined with\
    \ a `FileMode` value:\n\n```csharp\nvar myFile = File.Open(<path>, FileMode.<mode>);\n\
    ```\n\nThe following modes are available when opening files:\n- `Append`: Opens\
    \ the file if it exists, or creates a new one if it does not. Subsequent write\
    \ operations are appended to the file content.\n- `Create`: Creates a new file,\
    \ or overwrites it if already exists.\n- `CreateNew`: Attempts to create a new\
    \ file and throws an exception if the file already exists.\n- `Open`: Opens an\
    \ existing file and throws an exception if it doesn’t exist.\n- `OpenOrCreate`:\
    \ If the file exists it is opened, otherwise a new file is created.\n- `Truncate`:\
    \ Opens an existing file and truncates it to zero length.\n\nTo create a new file,\
    \ overwriting it if already exists, we can use the following code:\n\n```csharp\n\
    File.Open(\"MyFile.txt\", FileMode.Create);\n```\n\n### 29.10.3 Reading and writing\
    \ using the File class\n\nThe `WriteAllText()` method writes a string to a specified\
    \ file. If the file already exists, it will be overwritten with the new content,\
    \ otherwise, a new file will be created. Conversely, the `ReadAllText()` method\
    \ will read the content of a specified file and return it as a string value. The\
    \ following code writes a string to a file named `MyFile.txt` before reading it\
    \ back:\n\n```csharp\nFile.WriteAllText(\"MyFile.txt\", \"Hello, this is some\
    \ text.\");\nstring content = File.ReadAllText(\"MyFile.txt\");\nConsole.WriteLine($\"\
    content = {content}\");\n```\n\nWhen the code executes, the following will appear\
    \ in the terminal:\n\n```\ncontent = Hello, this is some text.\n```\n\nTo append\
    \ text to an existing file, we call the `AppendAllText()` method as follows:\n\
    \n```csharp\nFile.WriteAllText(\"MyFile.txt\", \"Hello, this is some text.\");\n\
    File.AppendAllText(\"MyFile.txt\", \" This is more text.\");\nstring content =\
    \ File.ReadAllText(\"MyFile.txt\");\nConsole.WriteLine($\"content = {content}\"\
    );\n```\n\nThe resulting terminal output will read as follows:\n\n```\ncontent\
    \ = Hello, this is some text. This is more text.\n```\n\nTo write multiple lines\
    \ of text to a file in a single operation, place the lines in a list collection\
    \ and pass it to the `WriteAllLines()` method:\n\n```csharp\nList<string> textList\
    \ = [\"Kia Sorento\", \"Alfa Romeo GTV6\", \"Chevy Spark\", \"Ford Explorer\"\
    , \"Toyota Celica\"];\nFile.WriteAllLines(\"MyFile.txt\", textList);\n```\n\n\
    The `ReadAllLines()` method reads the entire content of a file and returns the\
    \ lines of text as a string array:\n\n```csharp\nstring[] readList = File.ReadAllLines(\"\
    MyFile.txt\");\nforeach (string line in readList) {\n    Console.WriteLine(line);\n\
    }\n```\n"
