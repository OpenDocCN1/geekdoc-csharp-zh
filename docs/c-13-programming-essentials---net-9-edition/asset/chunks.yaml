    Java 迅速获得了认可，在一段时间内，微软开始了其 Java “拥抱并扩展”活动。Sun 公司乐于微软拥抱 Java，但当他们意识到“扩展”部分是微软引入其自己的专有语言版本的计划时，他们出动了律师。随后引发了政治斗争，微软最终放弃了
    Java。不久后，微软开始讨论一种被称为 `.NET` 的东西，随后是门名为 `C#` 的编程语言。


    ## 2.2 C# 到底是什么？


    我听见你们在问：“这些历史与 C# 有什么关系？”。`C#` 编程语法的起源可以追溯到 `C` 和 `C++`。如果你已经熟悉 `C` 或 `C++`（事实上，甚至是
    `Kotlin` 或 `Swift`），那么在学习 `C#` 时就具有了巨大的优势。`Java`、`C`、`C++` 和 `C#` 语法之间的相似性也是如此。此外，`C#`
    还继承了 `Java` 在内存处理（更广为人知的垃圾回收）和中间字节码方面的许多优势，后者消除了为每个目标硬件平台重新编译应用程序的需求。`C#` 还伴随着庞大的库框架，旨在为程序员提供几乎可以想象的所有场景的现成解决方案。


    尽管有这些相似之处，`Java` 和 `C#` 的基础设施之间仍然存在差异。因此，下一章将提供 `C#` 基础设施的概述。


    ## 2.3 谁在使用 C#？


    尽管自 `C#` 推出以来已经发布了一些新的编程语言（如 `Swift` 和 `Kotlin`），但 `C#` 作为一种语言仍在不断进化，并拥有庞大且不断增长的用户群。


    例如，在写作期间，`C#` 在 `TIOBE Index` 中位列 50 常用编程语言的第 5 位（仅次于 `C`、`Java`、`Python` 和 `C++`）。


    `C#` 用于开发桌面、移动和服务器应用程序，以及基于 Web 的应用程序和服务。它是所有微软平台上的首选编程语言，并用于 `Unity` 实时开发平台中的编程。


    ## 2.4 接受知识测试


    点击下方的链接或扫描二维码以测试你对 `C#` 历史的认知和理解：


    [`www.answertopia.com/qoe2`](https://www.answertopia.com/qoe2)


    ![img](img/c_-history.png)


    ## 2.5 总结


    `C#` 是由微软创建的一种编程语言，结合了其他流行语言（如 `C`、`C++` 和 `Java`）的元素。它的设计旨在通过内存管理以减少错误以及跨平台兼容的中间字节码等特性，使编程更简单、更高效。`C#`
    用于桌面、移动、服务器、Web 和游戏开发，是全球前十大最常用的编程语言之一。


    ## 3. C# 基础设施


    本章将介绍构建 `C#` 语言的基础设施。在本章结束时，你将清晰地理解 `CLI`、`CLR`、`VES`、`JIT` 和 `.NET` 等缩字的含义。


    ### 3.1 通用语言基础设施 ( CLI)


    `C#` 是一种面向对象的编程语言。它本质上是一个定义什么是有效语法的标准。`C#` 本身作用不大，因为它依赖于通用语言基础设施 (`CLI`) 来编译和执行应用程序。`CLI`
    反而是一个定义了以下组件规范的标准：


    - 虚拟执行系统 (`VES`)

    - 通用中间语言 (`CIL`)

    - 通用类型系统 (`CTS`)

    - 通用语言规范 (`CLS`)

    - 框架


    在本章的剩余部分中，我们将检查每个 `CLI` 组件，以理解 `CLI` 环境是如何结合的。


    ### 3.2 通用中间语言 ( CIL)


    与 `C` 和 `C++` 编译器不同（它们将源代码编译为目标微处理器可以理解的机器码），`C#` 编译器将代码编译为一种名为通用中间语言 (`CIL`)
    的中间字节码格式。这种代码可以在任何具有符合 `CLI` 标准的虚拟执行系统 (`VES`) 的系统上运行。因此，无需为每个目标平台编译应用程序。


    通用中间语言中的“通用（Common）”一词，是因为这种格式不仅适用于 `C#` 编程语言。事实上，任何编程语言都可以目标为 `CIL`，允许来自不同语言的库和代码模块在同一个应用程序中共同执行。提供
    `CIL` 编译的典型语言包括 `Visual Basic`、`COBOL`、`PowerShell`、`Python` 和 `C++`。


    ### 3.3 虚拟执行系统 ( VES)


    `VES`（称为运行时）是执行 `CIL` 字节码的环境。`VES` 读取由 `C#` 编译器生成的字节码，并使用即时 (`JIT`) 编译器将字节码编译为运行其上的处理器的原生机器码。在执行期间，这些代码会与运行时代理协作工作，由该代理管理执行过程。结果，这些执行代码被称为托管代码（managed
    code），该过程处理诸如垃圾回收（处理内存分配和释放）、内存访问和类型安全等问题，以确保代码不会执行任何不该执行的事情。


    通常与 `VES` 结合使用的术语是通用语言运行时 (`CLR`)。`CLR` 是微软对 `VES` 组件实现的官方名称。

