    \ `Count` 和 `Capacity` 等属性以获取列表内容的信息。\n\n## 28. C# Dictionary 集合\n\nC# 字典允许以键值对的形式存储和管理数据。字典的作用与数组和列表类似，不同的是字典中的每个项都有唯一的键。\n\
