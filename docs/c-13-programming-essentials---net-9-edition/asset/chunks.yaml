    ## 6.6 Summary


    In this chapter, we created a new workspace containing a `.NET` Console app project
    and explored the files that make up a typical project before writing, compiling,
    and running C# code. The chapter also introduced the concept of namespaces and
    explained how top-level statements and the `Main()` method are automatically generated
    by VS Code.


    # 7. C# Variables and Constants


    To gain proficiency in any programming language, you need to learn the basics.
    One of the most fundamental aspects of programming is using variables and constants.
    Even advanced programs such as high-end video games and enterprise commerce applications
    utilize variables in some form.


    This chapter will cover everything a C# programmer needs to know about variables
    and constants.


    ### 7.1 What is a C# variable?


    Variables are locations in computer memory that are reserved for storing the data
    used by an application. Each variable is given a name by the programmer and assigned
    a value. The name assigned to the variable may then be used in the C# code to
    access the value assigned to the variable. This access can involve either reading
    the variable’s value or changing the value. It is, of course, the ability to change
    the value of variables that gives them the name variable.


    ### 7.2 Type annotations and implicit typing


    C# is categorized as a type-safe programming language. This essentially means
    that once a variable’s data type has been identified, that variable cannot subsequently
    be used to store data of any other type without inducing a compilation error.
    This contrasts with loosely typed programming languages, where a variable, once
    declared, can subsequently be used to store other data types.


    There are two ways in which the type variable will be identified. One approach
    is to use a type annotation when the variable or constant is declared in the code.
    This is achieved by preceding the variable name with the type declaration. The
    following line of code, for example, declares a variable named `userCount` as
    being of type `int` (integer):


    ```cs

    int userCount = 10;

    ```


    When using type annotation, a value may be assigned to the variable after it has
    been declared:


    ```cs

    int userCount;

    userCount = 10;

    ```


    As an alternative to type annotation in a declaration, the C# compiler can use
    implicit typing to identify the variable type. When relying on implicit typing,
    the compiler looks to see what type of value is assigned to the variable when
    it is initialized and uses that as the type. To instruct the compiler to use implicit
    typing, you must precede the variable name with the `var` keyword.


    Consider, for example, the following variable declarations:


    ```cs

    var signalStrength = 22;

    var companyName = "My Company";

    ```


    While compiling the above lines of code, C# will infer that the `signalStrength`
    variable is of type `int` and that `companyName` is of type `string`.


    When a variable is declared using implicit typing, it must be assigned a value
    at the point of declaration. The following, for example, is not valid C# syntax:


    ```cs

    var bookTitle;

    bookTitle = "C# 13 Essentials - .NET 9 Edition";

    ```


    A new value may be assigned to a variable at any point after it has been declared:


    ```cs

    int interestRate = 5; //Declare the variable and initialize it to 5

    interestRate = 10; // variable now equals 10

    ```


    ### 7.3 What is a C# constant?


    A constant is similar to a variable, providing a named location in memory to store
    a data value. Constants differ in one significant way: once a value has been assigned
    to a constant, it cannot subsequently be changed.


    Constants are particularly useful if a value is used repeatedly throughout the
    application code. Rather than using the value each time, it makes the code easier
    to read if the value is first assigned to a constant, which is then referenced
    in the code. For example, it might not be clear to someone reading your C# code
    why you used the value 5 in an expression. If, instead of the value 5, you use
    a constant named `interestRate`, the purpose of the value becomes much more apparent.
    Constants also have the advantage that if the programmer needs to change a widely
    used value, it only needs to be changed once in the constant declaration and not
    each time it is referenced.


    Constants are declared using the `const` keyword and have a type, a name, and
    a value:


    ```cs

    const int interestRate = 10;

    ```


    Note that a constant must be initialized at the point that it is declared. For
    example, the following code will fail to compile because it declares a constant
    without assigning a value:


    ```cs

    const int interestRate; // Invalid - a constant must be initialized at creation

    ```


    Now that we have described C# variables and constants, we can examine the different
    types available to us as C# programmers beginning with numerical data types.


    ### 7.4 Integer types


    A widely used data type is the integer. C# provides several integer types based
    on number size and whether the integers are signed (positive or negative) or unsigned
    (positive only). All the integer variable types have one thing in common: they
    may only be used to store whole numbers.


    The following table lists the various C# integer types, details of the number
    of bytes of physical memory consumed by each type, and the acceptable value ranges.


    | Type | Size in bytes | Value range |

    | --- | --- | --- |

    | byte | 1 byte | 0 to 255 |

    | sbyte | 1 byte | -128 to 127 |

    | short | 2 bytes | -32,768 to 32,767 |

    | ushort | 2 bytes | 0 to 65,535 |

    | int | 4 bytes | -2,147,483,648 to 2,147,483,647 |

    | uint | 4 bytes | 0 to 4,294,967,295 |

    | long | 8 bytes | -9,223,372,036,854,775,808 to 9,223,372,036,854,775,807 |

    | ulong | 8 bytes | 0 to 18,446,744,073,709,551,615 |


    The following code demonstrates some of these types:


    ```cs

    int myInt = 20102;

    byte myByte = 23;

    sbyte mySbyte = 127;

    ```


    All C# numerical data types contain bounds properties that can be accessed to
    identify that particular type’s minimum and maximum values. The following code,
    for example, outputs to the console the minimum and maximum bounds for some of
    the integer types:


    ```cs

    Console.WriteLine("byte Min Value = " + byte.MinValue);

    Console.WriteLine("byte Max Value = " + byte.MaxValue);

    Console.WriteLine("short Min Value = " + short.MinValue);

    Console.WriteLine("short Max Value = " + short.MaxValue);

    Console.WriteLine("int Min Value = " + int.MinValue);

    Console.WriteLine("int Max Value = " + int.MaxValue);

    Console.WriteLine("uint Min Value = " + uint.MinValue);

    Console.WriteLine("uint Max Value = " + uint.MaxValue);

    Console.WriteLine("long Min Value = " + long.MinValue);

    Console.WriteLine("long Max Value = " + long.MaxValue);

    ```


    The above code will generate the following output:


    byte Min Value = 0

    byte Max Value = 255

    short Min Value = -32768

    short Max Value = 32767

    int Min Value = -2147483648

    int Max Value = 2147483647

    uint Min Value = 0

    uint Max Value = 4294967295

    long Min Value = -9223372036854775808

    long Max Value = 9223372036854775807


    ### 7.5 Floating-point Variables


    Integers are fine for dealing with whole numbers but of little use when there
    are numbers after the decimal point. Such numbers may be stored in `float` or
    `double` variable types. The default type for such numbers is `double`. The following
    table shows the two types with comparisons of the number ranges supported and
    the number of significant digits in each case:

