    \ \n\n8.15 Summary\n\nIn C# programming, operators and expressions manipulate\
    \ and evaluate variables and constants. This can be as simple as adding two numbers\
    \ using the addition operator in an expression and storing the result in a variable\
    \ or as complex as performing bitwise operations. There are several categories\
    \ of operators, each of which we have covered in this chapter.\n\n9\\. C# Conditional\
    \ Control Flow\n\nThe cornerstone of any software code is the control flow logic,\
    \ which decides which code should be executed and which should not. This chapter\
    \ covers the conditional control flow constructs provided by C#.\n\n9.1 Looping\
    \ vs. conditional control flow\n\nRegardless of the programming language used,\
    \ application development involves applying logic. Much of the art of programming\
    \ involves writing code that makes decisions based on one or more criteria. Such\
    \ decisions define which code gets executed, how often, and which code gets bypassed\
    \ when the program runs. This is often called control flow since it controls the\
    \ program execution flow. Control flow typically falls into the categories of\
    \ looping control flow (how often code is executed) and conditional control flow\
    \ (whether code is executed). This chapter provides an introductory overview of\
    \ both types of control flow in C#.\n\nEarlier in the book, we used logical expressions\
    \ in C# to determine whether something is true or false. Much of the art of programming\
    \ involves writing code that makes decisions based on one or more criteria. Such\
    \ decisions define which code gets executed and which gets bypassed when running\
    \ the program.\n\nIn previous chapters, the if statement has been used in some\
    \ examples. In this chapter, we will look at if statements in more detail.\n\n\
    9.2 Using the if statement\n\nThe if statement is the most basic of the control\
    \ flow options available to the C# programmer. Programmers familiar with C, C++,\
    \ or Java will immediately be comfortable using C# if statements.\n\nThe basic\
    \ syntax of the C# if statement is as follows:\n\nif (boolean expression) {\n\n\
    // C# code to be performed when the expression evaluates to true here\n\n}\n\n\
    If the boolean expression evaluates to true, then the code in the statement’s\
    \ body is executed. The body of the statement is enclosed in braces ({}). If,\
    \ on the other hand, the expression is evaluated as false, the code in the body\
    \ of the statement is skipped.\n\nFor example, if a decision needs to be made\
    \ depending on whether one value is greater than another:\n\nint x = 10;\n\nif\
    \ ( x > 9 ) {\n\nConsole.WriteLine(\"x is greater than 9!\");\n\n}\n\nClearly,\
    \ x is greater than 9, causing the message to appear.\n\nNote: If the body contains\
    \ only one statement, the enclosing braces ({}) may be omitted. These must be\
    \ added once more than one statement is included in the body.\n\n9.3 Using if\
    \ … else … statements\n\nThe next variation of the if statement allows us to specify\
    \ some code to execute if the expression in the if statement is evaluated as false\
    \ using the following syntax:\n\nif (boolean expression) {\n\n// Code to be executed\
    \ if the expression is true\n\n} else {\n\n// Code to be executed if the expression\
    \ is false\n\n}\n\nUsing the above syntax, we can now extend our previous example\
    \ to display a different message if the comparison expression evaluates to be\
    \ false:\n\nint x = 8;\n\nif ( x > 9 ) {\n\nConsole.WriteLine(\"x is greater than\
    \ 9!\");\n\n} else {\n\nConsole.WriteLine(\"x is less than 9!\");\n\n}\n\nIn this\
    \ case, the second WriteLine() statement would execute if the value of x was less\
    \ than 9\\.\n\nAs with the standalone if statement, the braces ({}) are optional\
    \ if the body only contains one statement. The following is, therefore, valid\
    \ code:\n\nint x = 8;\n\nif ( x > 9 ) {\n\nConsole.WriteLine(\"x is greater than\
    \ 9!\");\n\n} else {\n\nConsole.WriteLine(\"x is less than 9!\");\n\n}\n\n9.4\
