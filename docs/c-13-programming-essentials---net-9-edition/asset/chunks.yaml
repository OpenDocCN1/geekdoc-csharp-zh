    \ entities such as class declarations, methods, and variables are visible and\
    \ accessible to code that resides outside the current scope. We touched on scope\
    \ briefly when looking at C# looping. For example, variables declared within a\
    \ body of a for loop belong only to the loop’s scope and do not exist before or\
    \ after the loop executes:\n\n// variable myCounter does not yet exist\n\nfor\
    \ (int i = 0; i < 10; i++)\n\n{\n\nint myCounter = 0; //myCounter variable created\
    \ in scope of for loop\n\nmyCounter += i;\n\n}\n\n// after loop exit variable\
    \ myCounter is now out of scope and ceases to exist\n\nSimilarly, class methods\
    \ and properties reside in the scope of the class in which they are declared and\
    \ can only be accessed by referencing the containing class. In the following example,\
    \ we can only access the IncrementCounter() method by referencing MyClass:\n\n\
    class MyClass\n\n{\n\nstatic int myCountr = 0;\n\npublic static void IncrementCounter()\
    \ {\n\nmyCounter++;\n\n}\n\n}\n\nMyClass.IncrementCounter();\n\nScope allows us\
    \ to declare classes and structures without worrying that a method name in one\
    \ class might conflict with a method in another class. For example, the identical\
    \ method names in the following classes do not conflict because they belong to\
    \ separate scopes:\n\nclass MyClass\n\n{\n\nstatic int myCounter = 0;\n\npublic\
    \ static void IncrementCounter() {\n\nmyCounter++;\n\n}\n\n}\n\nclass MyOtherClass\n\
    \n{\n\nstatic int myCounter = 0;\n\npublic static void IncrementCounter() {\n\n\
    myCounter++;\n\n}\n\n}\n\nA problem arises, however, when entities like classes\
    \ and structures themselves have conflicting names. If both of the above classes\
    \ were named MyClass, the code would generate a syntax error because they are\
    \ declared within the same scope. The solution to this is to use namespaces.\n\
    \n22.2 An overview of namespaces\n\nMuch like classes and structures, namespaces\
    \ provide an additional layer of organization within C# code. As we have seen,\
    \ a C# project contains classes and structures containing members, spread across\
    \ multiple source code files.\n\nParticularly within large projects with complex\
    \ code bases, there is a possibility that names that are not declared within the\
    \ scope of class or structure will conflict with each other, either in the code\
    \ you have written or between your code and the built-in .NET classes and structures.\
    \ The following code, for example, will trigger a syntax error because the class\
    \ names conflict:\n\nclass ClassA\n\n{\n\npublic static void OpenFile() {\n\n\
    Console.WriteLine(\"Class A OpenFile()\");\n\n}\n\n}\n\nclass ClassA\n\n{\n\n\
    public static void OpenFile()\n\n{\n\nConsole.WriteLine(\"Class A OpenFile()\"\
    );\n\n}\n\n}"
