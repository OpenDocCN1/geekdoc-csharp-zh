    \ and workspace, VS Code will also create a solution file. The solution file references\
    \ all of the projects within the workspace. Within VS Code, you will use the Solution\
    \ Explorer to manage the projects in your workspace and perform tasks such as\
    \ adding new classes or folders to an existing project.\n\n5.2 The VS Code main\
    \ window\n\nOnce you have created your first project, you will need to familiarize\
    \ yourself with various elements that make up the VS Code user interface. [Figure\
    \ 5-1](#VS_Code_Overview.xhtml__idTextAnchor055) shows a VS Code session with\
    \ an open workspace containing multiple projects. The key areas of the main window\
    \ are as follows:\n\nA - Activity Bar - The activity bar contains buttons to display\
    \ the primary sidebar, search project files, connect to Git source code repositories,\
    \ run and debug code, browse and install extensions, and run tests. Options are\
    \ also available to log into your Microsoft account and access settings.\n\nB\
    \ - Primary Sidebar - The primary sidebar is divided into three sections. The\
    \ top section is the Explorer view, which lists all folders and files within the\
    \ current workspace. Selecting a file from the list loads it into the editor (F).\n\
    \nC - Outline - The outline section of the primary sidebar displays the hierarchical\
    \ structure of the currently selected source file, including symbols, classes,\
    \ methods, and properties.\n\nD - Timeline - The primary sidebar timeline panel\
    \ lists recently performed activities such as saving, creating, or deleting project\
    \ files.\n\nE - Solution Explorer - This panel lists the files and folders referenced\
    \ in the current solution file and allows tasks such as creating new classes to\
    \ be performed.\n\nF - Editor - The editor is where you will write and edit C#\
    \ code. VS Code supports side-by-side and split editing modes where multiple files\
    \ are open and visible simultaneously. Floating editor windows can also be detached\
    \ from the main window.\n\nG—Panel —The Panel includes tabs to display debug messages,\
    \ problem reports, such as syntax errors in your code, and a terminal for interacting\
    \ with your running apps.\n\nH - Status Bar -The status bar includes fields indicating\
    \ the editor’s cursor line and column position, the current programming language,\
    \ alert notifications, and error and warning statistics.\n\nI - Run Button - Compiles\
    \ and runs the current project app, displaying output in the Panel (G).\n\nJ -\
    \ File Tabs - When multiple files are open, each file is represented by a tab\
    \ in the File Tabs bar.\n\n![img](image/vs_code_main_window.png)\n\nFigure 5-1\n\
    \n5.3 The Command Palette\n\nThe Command Palette is the central point for performing\
    \ tasks within VS Code, including tasks as diverse as creating and cleaning projects,\
    \ configuring keyboard shortcuts, and generating reports. [Figure 5-2](#VS_Code_Overview.xhtml__idTextAnchor057)\
    \ shows a typical Command Palette:\n\n![img](image/vs_code_command_palette.png)\n\
    \nFigure 5-2\n\nDisplay the Command Palette from anywhere in VS Code by pressing\
    \ Ctrl-Shift-P (Cmd-Shift-P on macOS).\n\n5.4 Splitting the editor window\n\n\
    When editing multiple files, it often helps to see the files side-by-side as you\
    \ work. To split a file into a separate editor panel, right-click on the corresponding\
    \ tab in the Files Tab bar and select the up, down, left, or right Split option\
    \ as illustrated below:\n\n![img](image/vs_code_editor_spit.png)\n\nFigure 5-3\n\
    \nTo open a file in a floating editor window, repeat the above step and select\
    \ the Move into New Window menu option.\n\nWhen editing large source files, it\
    \ can be helpful to view and edit different areas of the same file simultaneously.\
    \ To do this, right-click on the file tab and select the Split in Group menu option.\
    \ A new editor panel containing the same code file will appear, and you can scroll\
    \ to different file sections. Any edits that you make will be reflected in both\
    \ editor panels.\n\n5.5 Zen mode\n\nThe VS Code user interface can sometimes appear\
    \ cluttered, particularly when the primary panel and console are displayed. To\
    \ help you focus on writing code, VS Code offers Zen mode. In Zen mode, VS Code\
    \ fills the entire screen, and only the current editing panels are visible. To\
    \ enter Zen mode, select the View -> Appearance -> Zen Mode menu option or type\
    \ Ctrl-K followed by Z (Cmd-K Z in macOS). Exit Zen mode by tapping the Esc key.\n\
    \n5.6 Learning with the Editor Playground\n\nThe VS Code Editor Playground ( [Figure\
    \ 5-4](#VS_Code_Overview.xhtml__idTextAnchor062) ) provides an interactive environment\
    \ in which to learn and experiment with the features of the code editor. Select\
    \ the VS Code Help -> Editor Playground menu option to display the playground,\
    \ then follow the provided steps to interact with features including multi-cursor\
    \ editing, formatting, and IntelliSense.\n\n![img](image/vs_code_playground.png)\n\
    \nFigure 5-4\n\n5.7 Take the knowledge test\n\nClick the link below or scan the\
    \ QR code to test your knowledge and understanding of the basics of Visual Studio\
    \ Code:"
