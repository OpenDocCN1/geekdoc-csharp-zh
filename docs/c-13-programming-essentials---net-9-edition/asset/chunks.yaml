    ## 7.12 String interpolation


    Strings may also be constructed using combinations of strings, variables, constants,
    expressions, and function calls using string interpolation.


    Interpolation involves embedding items into a string by prefixing the literal
    declaration with a `$` character and wrapping the item as follows where `{item}`
    is a constant or variable name, a function call, or even an expression such as
    a mathematical calculation:


    ```csharp

    int count = 10;


    string message = $"The current count is {count}";

    ```


    The following code, for example, creates a new string variable using string interpolation
    to embed content from a variety of sources before outputting it to the console:


    ```csharp

    string userName = "John";


    int inboxCount = 25;


    int maxCount = 100;


    var message = $"{userName} has {inboxCount} messages. Message capacity remaining
    is {maxCount - inboxCount}.";


    Console.WriteLine(message);

    ```


    Running the above example code will generate the following:


    John has 25 messages. Message capacity remaining is 75\.


    If you need to wrap content in braces (`{}`) without it being interpreted as interpolated
    values, use double braces (`{{}}`) as follows:


    ```csharp

    string userName = "John";


    var message = $"{userName} reported seeing error code 10 {{low battery}}.";


    Console.WriteLine(message);

    ```


    On execution of the above code, the following text will appear:


    John reported seeing error code 10 {low battery}.


    Interpolation may also be used within verbatim string literals by prefixing the
    string with either `$@` or `@$`:


    ```csharp

    string userName = "John";


    int inboxCount = 25;


    int maxCount = 100;


    var message = $@"{userName} has {inboxCount} messages.


    Message capacity remaining is {maxCount - inboxCount}.";


    Console.WriteLine(message);

    ```


    The above code will generate the following output:


    John has 25 messages.


    Message capacity remaining is 75\.


    Note that Interpolated string literals can only be assigned to variables. An attempt
    to assign an interpolated string to a constant will result in a compiler error.


    ## 7.13 Type casting


    C# code works with many types, both provided by the language and many you will
    create yourself. This chapter explains how types may be related to each other
    while exploring the concepts of implicit and explicit type casting and obtaining
    an object’s type.


    As previously outlined, C# is a strongly typed language, meaning that once a variable
    has been declared as a particular type, it cannot subsequently be changed to a
    different type. This also restricts the type of value that can be assigned to
    the variable. It is not, for example, possible to assign a string value to an
    `int` variable.


    Under some circumstances, however, assigning a value of one type to a variable
    of another type is possible. This involves the use of implicit and explicit casting.


    ### 7.13.1 Implicit casting


    In instances where it is safe to do so without data loss, C# will allow you to
    assign a value from one type of variable to another simply using the assignment
    operator. For example, since a `long` variable is quite capable of storing any
    value that can be stored in an `int` variable, an assignment such as the following
    is perfectly valid:


    ```csharp

    int myInteger = 20;


    long myLong;


    myLong = myInteger;

    ```


    This technique is called implicit casting since the casting from `int` to `long`
    is implied by the value type rather than explicitly declared within the code.


    There are, however, limits to implicit casting. It is impossible, for example,
    to assign a `long` to an `int` using implicit casting because a `long` can store
    significantly larger numbers than an `int` (an `int` is 4 bytes in length versus
    8 bytes for a `long`). Attempting to squeeze a `long` into an `int` variable would
    inevitably result in lost data. For this reason, the C# compiler will flag such
    an attempt as an error, and the code will fail to compile, as demonstrated below:


    ```csharp

    long myLong = 1381292100921;


    int myInteger;


    myInteger = myLong;

    ```


    When the compiler encounters the above code, it will declare the following syntax
    error:


    Cannot implicitly convert type ''long'' to ''int''. An explicit conversion exists
    (are you missing a cast?)


    As the error message indicates, it may be possible to perform this operation using
    an explicit cast.


    ### 7.13.2 Explicit casting


    While the compiler may prevent an implicit cast, it is possible that you, as the
    programmer, know that even though a variable is a `long` type, it will never contain
    a value greater than an `int` variable can store. In this case, you might legitimately
    want to assign the value stored in a `long` variable to an `int` variable. This
    can be achieved by using an explicit cast to convert the `long` value to an `int`.


    Explicit casts are performed by placing the variable type to which you wish to
    convert in parentheses (`()`) before the name of the variable you want to convert
    from. The following code, for example, casts a `long` value to an `int` during
    an assignment operation:


    ```csharp

    long myLong = 138129210;


    int myInteger;


    myInteger = (int) myLong;

    ```


    Care should be taken when using explicit casts. If the value being cast is greater
    than the storage capacity of the destination variable, the value will change without
    warning. For example, consider the following modification of the above example:


    ```csharp

    long myLong = 138129210212;


    int myInteger;


    myInteger = (int) myLong;


    Console.WriteLine($"myLong = {myLong}");


    Console.WriteLine($"myInteger = {myInteger}");

    ```


    The output from the above code illustrates that the value assigned to myInt no
    longer matches that assigned to myLong:


    myLong = 138129210212


    myInteger = 690256740


    In this case, the myLong value exceeds the int data type’s capacity, causing the
    value to change. A bug of this nature may be difficult to locate in a complex
    development project.


    Similarly, assigning a floating-point value to a variable that only stores whole
    numbers will result in the loss of the fractional part of the original value.


    Note that casting is only possible on numerical data types. It is not, therefore,
    possible to perform casts on string, bool, or char data types.


    ### 7.13.3 Identifying variable’s type


    Identifying a variable’s type in C# is also possible by calling the variable’s
    `GetType()` method. The following code, for example, outputs the types of the
    `myVar1` and `myVar2` variables:


    ```csharp

    string myVar1 = "Hello";


    double myVar2 = 123123.12;


    Console.WriteLine(myVar1.GetType());


    Console.WriteLine(myVar2.GetType());

    ```


    The above string literal will appear as follows when the code executes:


    System.String


    System.Double


