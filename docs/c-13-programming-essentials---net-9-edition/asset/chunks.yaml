  trans: "\n为了演示引用类型和值类型的实际用法，请使用解决方案（Solution Explorer）向 `StructureDemo` 项目添加一个名为\
    \ `SampleStruct` 的新结构体（Struct）。按照通常步骤添加文件，这次在文件模板面板中如图 20-1\n\n图 20-1\n\n文件创建后，将其修改为如下内容：\n\
    \n```csharp\nnamespace StructureDemo;\n\npublic struct SampleStruct(string name)\n\
    {\n    private string _name = name;\n\n    public string Name {\n        get =>\
    \ _name;\n        set => _name = value;\n    }\n\n    public string BuildHelloMsg()\
    \ {\n        return \"Hello \" + _name;\n    }\n}\n```\n\n接下来，编辑 `Program.cs`\
    \ 文件以创建 `SampleStruct` 实例并调用 `BuildHelloMsg()` 方法：\n\n```csharp\nusing StructureDemo;\n\
    \nSampleStruct myStruct1 = new(name: \"Mark\");\n\nConsole.WriteLine(myStruct1.BuildHelloMsg());\n\
    ```\n\n当代码执行时，将显示消息“Hello Mark”。现在更改代码以创建 `myStruct1` 实例的副本，更改名称属性，并在消息中显示每个实例的名称：\n\
    \n```csharp\nSampleStruct myStruct1 = new(name: \"Mark\");\n\nSampleStruct myStruct2\
    \ = myStruct1;\n\nmyStruct2.Name = \"David\";\n\nConsole.WriteLine(myStruct1.BuildHelloMsg());\n\
    \nConsole.WriteLine(myStruct2.BuildHelloMsg());\n```\n\n执行时，输出将如下：\n\nHello Mark\n\
    \nHello David\n\n显然，名称的更改仅应用于 `myStruct2`，因为这是 `myStruct1` 的一个实际副本，包含它自己的数据副本，如如下所示：\n\
    \n![img](img/csharp_reference_type.png)\n\n图 20-2\n\n为了将此行为与相应的类（Class）进行对比，请向项目添加一个名为\
    \ `SampleClass` 的类，并如下方式实现：\n\n```csharp\nnamespace StructureDemo;\n\npublic class\
    \ SampleClass(string name)\n{\n    private string _name = name;\n\n    public\
    \ string Name {\n        get => _name;\n        set => _name = value;\n    }\n\
    \n    public string BuildHelloMsg() {\n        return \"Hello \" + _name;\n  \
    \  }\n}\n```\n\n将类添加到项目后，修改 `Program.cs` 文件以重复结构体示例中的操作：\n\n```csharp\nSampleClass\
    \ myClass1 = new(name: \"Mark\");\n\nSampleClass myClass2 = myClass1;\n\nmyClass2.Name\
    \ = \"David\";\n\nConsole.WriteLine(myClass1.BuildHelloMsg());\n\nConsole.WriteLine(myClass2.BuildHelloMsg());\n\
    ```\n\n当此代码执行时，将生成以下输出：\n\nHello David\n\nHello David\n\n在这种情况下，名称属性的更改反映在 `myClass1`\
    \ 和 `myClass2` 中中，因为它们都是指向同一个类实例的引用，如下图所示：\n\n![img](img/csharp_struct.png)\n\n\
    图 20-3\n\n除了这些值类型和引用类型的区别外，结构体不支持像类那样的继承和子类。换句话说，一个结构体无法继承另一个结构体。与类不同，结构体还可以包含析构函数方法。结构体成员不能指定为\
    \ `abstract`、`virtual` 或 `protected`。\n\n## 21. 元组类型\n\n在本章中，我们将探索如何使用元组来存储多个值。\n\
    \n### 21.1 创建 TupleDemo\n要尝试 C# 元组，请创建一个新的 TupleDemo 项目。\n\n### 21.2 声明元组\n当我们声明元组时，需要提供值（可选的）。声明元组的语法如下：`<type1>,\
    \ <type2>, ...`。例如，按如下修改 `Program.cs` 以添加顶层语句：\n\n```csharp\nnamespace TupleDemo\n\
    {\n    internal class Program\n    {\n        static void Main(string[] args)\n\
    \        {\n            GetData();\n        }\n\n        private static void GetData()\n\
    \        {\n            (int, string, double) myTuple = (10, \"Refrigerator\"\
    , 432.43);\n        }\n    }\n}\n```\n\n如果你不想声明每个元组的类型，可以使用 `var` 关键字告诉编译器推断值：\n\
    \n```csharp\nvar myTuple = (10, \"Refrigerator\", 432.43);\n```\n\n### 21.3 访问元组值\n\
    可以使用几种不同的技术访问元组的元素。可以使用点符号法通过 `Item<n>` 访问特定的元组值，其中 `<n>` 是项的编号（第一个值是 1）。例如，下面的代码从元组中提取第\
    \ 2 个项，将其分配给变量并写入控制台：\n\n```csharp\nprivate static void GetData()\n{\n    var\
    \ myTuple = (10, \"Refrigerator\", 432.43);\n    var item2 = myTuple.Item2;\n\
    \    Console.WriteLine(item2);\n}\n```\n\n### 21.4 元组字段名\n在创建元组时，可以为每个值分配一个名称。当在代码中引用这些值时，可以使用分配给存储在元组中的值这些名称，例如：\n\
    \n```csharp\n(int Count, string Product, double Price) myTuple = (10, \"Refrigerator\"\
    , 432.43);\n```\n\n当使用类型推断初始化元组时，字段名将放在每个值之前：\n\n```csharp\nvar myTuple = (Count:\
    \ 10, Product: \"Refrigerator\", Price: 432.43);\n```\n"
- fmt: "\nThe following output will appear in the console when the app runs:\n\n```\n\
    myTuple Price = 432.43\nmyTuple Product = Refrigerator\nmyTuple Quantity = 10\n\
    ```\n\n### 21.5 Returning tuples from methods\n\nTuples are particularly useful\
    \ for returning multiple results from a method. For example, suppose that instead\
    \ of displaying product information, we need our `GetProductData()` method to\
    \ return the data. To achieve this, the type of each tuple value needs to be included\
    \ in the method return type declaration as follows:\n\n```csharp\nprivate static\
    \ (int, string, double) GetProductData()\n{\n    .\n    .\n}\n```\n\nWhen returning\
    \ the tuple from within the method, we can return an existing tuple as follows:\n\
    \n```csharp\nprivate static (int, string, double) GetProductData()\n{\n    var\
    \ myTuple = (Count: 10, Product: \"Refrigerator\", Price: 432.43);\n    return\
    \ myTuple;\n}\n```\n\nAlternatively, the individual values can be returned by\
    \ placing them in parentheses after the return statement:\n\n```csharp\nprivate\
    \ static (int, string, double) GetProductData()\n{\n    return (10, \"Refrigerator\"\
    , 432.43) ;\n}\n```\n\nWhen called, the returned tuple can be assigned to a variable,\
    \ and the individual values accessed using dot notation:\n\n```csharp\nstatic\
    \ void Main(string[] args)\n{\n    var myTuple = GetProductData();\n    Console.WriteLine($\"\
    myTuple Price = {myTuple.Item1}\");\n    Console.WriteLine($\"myTuple Product\
    \ = {myTuple.Item2}\");\n    Console.WriteLine($\"myTuple Quantity = {myTuple.Item3}\"\
    );\n}\n```\n\nIf you prefer to use field names instead of the `Item<n>` default\
    \ names, one option is to include the field names and types as follows:\n\n```csharp\n\
    static void Main(string[] args)\n{\n    (int Count, string Product, double Price)\
    \ myTuple = GetProductData();\n    Console.WriteLine($\"myTuple Price = {myTuple\
    \ .Price }\");\n    Console.WriteLine($\"myTuple Product = {myTuple .Product }\"\
    );\n    Console.WriteLine($\"myTuple Quantity = {myTuple .Count }\");\n}\n```\n\
    \nBy far, the most convenient way to assign each tuple value to a named variable\
    \ is to use type inference. The following code, for example, assigns the three\
    \ values in the tuple returned by `GetProductData()` to variables named `count`,\
    \ `product`, and `price`:\n\n```csharp\nvar (count, product, price) = GetProductData();\n\
    ```\n\nUsing this approach, we can now access the variables directly without needing\
    \ first to extract them from the tuple:\n\n```csharp\nstatic void Main(string[]\
    \ args)\n{\n    var (count, product, price) = GetProductData();\n    Console.WriteLine($\"\
    Price = { price }\");\n    Console.WriteLine($\"Product = { product }\");\n  \
    \  Console.WriteLine($\"Quantity = { count }\");\n}\n```\n\n### 21.6 Tuples as\
    \ method parameters\n\nIn addition to returning tuple results from methods, you\
    \ can also pass tuples to methods. A method designed to accept our example tuple\
    \ as an argument could be declared as follows:\n\n```csharp\npublic static void\
    \ DisplayProductData((int, string, double) productTuple)\n{\n}\n```\n\nAlternatively,\
    \ the tuple values may be assigned field names:\n\n```csharp\npublic static void\
    \ DisplayProductData((int count, string description,\ndouble price) productTuple)\n\
    {\n}\n```\n\nOnce the method is declared, we can pass it a tuple in several ways.\
    \ One option is to pass through the literal value to the method:\n\n```csharp\n\
    DisplayProductData((20, \"Water filter\", 29.99));\n```\n\nAnother option is,\
    \ of course, to create a tuple object and pass it to the method:\n\n```csharp\n\
    var myTuple = (20, \"Water filter\", 29.99);\nDisplayProductData(myTuple);\n```\n\
    \nModify the `Program.cs` file to add the `DisplayProductData()` method and to\
    \ pass it a tuple argument:\n\n```csharp\nstatic void Main(string[] args)\n{\n\
    \    var myTuple = GetProductData();\n    DisplayProductData(myTuple);\n}\n\n\
    public static void DisplayProductData((int, string, double) productTuple)\n{\n\
    \    var (count, product, price) = productTuple;\n    Console.WriteLine($\"Price\
    \ = {price}\");\n    Console.WriteLine($\"Product = {product}\");\n    Console.WriteLine($\"\
    Quantity = {count}\");\n}\n```\n\nRun the app and verify that the product information\
    \ is displayed in the console.\n\n### 21.7 Take the knowledge test\n\nClick the\
    \ link below or scan the QR code to test your knowledge and understanding of the\
    \ C# Tuple type:\n\n[https://www.answertopia.com/pxci](https://www.answertopia.com/pxci)\n\
    \n![img](image/c_-tuple.png) \n\n### 21.8 Summary\n\nC# tuples allow us to temporarily\
    \ group multiple values into a single entity. Once declared, a tuple can be used\
    \ to return groups of result values from a method or to pass multiple parameter\
    \ values between methods within a single argument. Tuples support most C# data\
    \ types, including custom objects, and their items do not have to be of matching\
    \ types. We can access tuple items by item number and field name or assign them\
    \ directly to named variables.\n\n# 22. C# Namespaces\n\nIn the preceding chapters,\
    \ we have covered object-oriented C# programming in detail. We have learned how\
    \ code is structured using classes and structures that result in well-organized\
    \ re-usable code. In many of the code examples used so far, we have seen namespace\
    \ declarations. Now that we understand object-oriented programming, we are ready\
    \ to find out what namespaces are, why they exist, and how to use them.\n\n###\
    \ 22.1 Understanding scope\n\nBefore we talk about namespaces, we first need to\
    \ understand the concept of scope as it relates to programming languages. Scope\
    \ defines whether entities such as class declarations, methods, and variables\
    \ are visible and accessible to code. We touched on scope briefly when looking\
    \ at C# looping. For example, variables declared within a body of a loop belong\
    \ only to the scope and do not exist before or after the loop:\n\n```csharp\n\
    // variable myCounter does yet exist\nfor (int i = 0; i < 10; i++)\n{\n    int\
    \ myCounter = 0; //myCounter created in scope of loop\n    myCounter += i;\n}\n\
    // after loop exit variable myCounter is out of scope and ceases to exist\n```\n\
    \nSimilarly, class methods and properties reside in the scope of the class in\
    \ which they are declared and can only be accessed by referencing the class. In\
    \ the following example, we can only access the `IncrementCounter()` method by\
    \ referencing `MyClass`:\n\n```csharp\nclass MyClass\n{\n    static int myCounter\
    \ = 0;\n    public static void IncrementCounter() {\n        myCounter++;\n  \
    \  }\n}\n\nMyClass.IncrementCounter();\n```\n\nScope allows us to declare classes\
    \ and structures without worrying that a method name in one class might conflict\
    \ with a method in another class. For example, the identical method names in the\
    \ following classes do not conflict because they belong to separate scopes:\n\n\
    ```csharp\nclass MyClass\n{\n    static int myCounter = 0;\n    public static\
    \ void IncrementCounter() {\n        myCounter++;\n    }\n}\n\nclass MyOtherClass\n\
    {\n    static int myCounter = 0;\n    public static void IncrementCounter() {\n\
    \        myCounter++;\n    }\n}\n```\n\nA problem arises, however, when entities\
    \ like classes and structures themselves have conflicting names. If both of the\
    \ above classes were named `MyClass`, the code would generate a syntax error because\
    \ they are declared within the same scope. The solution to this is to use namespaces.\n\
    \n### 22.2 An overview of namespaces\n\nMuch like classes and structures, namespaces\
    \ provide an additional layer of organization within C# code. As we have seen,\
    \ a C# project contains classes and structures containing members, spread across\
    \ multiple source code files.\n\nParticularly within large projects with complex\
    \ code bases, there is a possibility that names that are not declared within the\
    \ scope of class or structure will conflict with each other, either in the code\
    \ you have written or between your code and the built-in .NET classes and structures.\
    \ The following code, for example, will trigger a syntax error because the class\
    \ names conflict:\n\n```csharp\nclass ClassA\n{\n    public static void OpenFile()\
    \ {\n        Console.WriteLine(\"Class A OpenFile()\");\n    }\n}\n\nclass ClassA\n\
    {\n    public static void OpenFile()\n    {\n        Console.WriteLine(\"Class\
    \ A OpenFile()\");\n    }\n}\n```\n"
