    \n## 27.10 在 C# 列表中查找项\n\n`List` 类提供了多种方法来查找查找项。最基本的方法是 `Contains()` 方法，当在列表对象上调用该方法时，如果指定的项位于列表中，则返回\
    \ `true`，否则返回 `false`。\n\n`IndexOf()` 方法返回列表中匹配项的索引值。例如，以下代码示例将输出 `true` 结果（表示存在“Red”）以及值\
    \ `2`（这是字符串“Yellow”的索引位置）：\n\n```csharp\nList<string> colorList = [\"Red\", \"\
    Green\", \"Yellow\", \"Purple\", \"Orange\"];\n\nConsole.WriteLine(colorList.Contains(\"\
    Red\"));\nConsole.WriteLine(colorList.IndexOf(\"Yellow\"));\n```\nOutput:\nTrue\n\
    2\n\n如果在列表中未找到项，`IndexOf()` 方法将返回值 `-1`。\n\n`LastIndexOf()` 方法返回列表中匹配指定项的最后一个项的索引值。当列表包含重复项时，这种方法特别有用：\n\
    \n```csharp\nList<string> colorList = [\"Red\", \"Green\", \"Yellow\", \"Purple\"\
    , \"Red\"];\n\nConsole.WriteLine(colorList.LastIndexOf(\"Red\"));\n```\nOutput:\n\
    4\n\n## 27.11 获取列表信息\n\n`List<T>` 类的两个属性对于获取列表对象的信息很有帮助。例如，`Capacity` 属性可以识别集合在不调整大小的情况下可以存储多少项。\n\
    \n然而，`Count` 属性识别列表中当前存储了多少项。通常情况下，`Capacity` 值将匹配或超过当前的 `Count`：\n\n```csharp\n\
    List<string> colorList = [\"Red\", \"Green\", \"Yellow\", \"Purple\", \"Orange\"\
    ];\n\nConsole.WriteLine($\"Count = {colorList.Count}\");\nConsole.WriteLine($\"\
    Capacity = {colorList.Capacity}\");\n```\nOutput:\nCount = 5\nCapacity = 5\n\n\
    在 `Count` 和 `Capacity` 之间存在差距的情况下，可以通过调用 `TrimExcess()` 方法移除多余的容量：\n\n```csharp\n\
    colorList.TrimExcess();\n```\n\n## 27.12 清空 C# 列表\n\n你可以通过调用 `Clear()` 方法移除列表中的所有项。\n\
    \n`Clear()` 方法从列表中删除项并将 `Count` 属性设置为零。然而，在列表清空后，`Capacity` 属性保持不变。要移除列表的容量，请在调用\
    \ `Clear()` 方法后调用 `TrimExcess()`：\n\n```csharp\nList<string> colorList = [\"Red\"\
    , \"Green\", \"Yellow\", \"Purple\", \"Orange\"];\n\nConsole.WriteLine($\"Count\
    \ = {colorList.Count}\");\nConsole.WriteLine($\"Capacity = {colorList.Capacity}\"\
    );\n\ncolorList.Clear();\n\nConsole.WriteLine($\"Count = {colorList.Count}\");\n\
    Console.WriteLine($\"Capacity = {colorList.Capacity}\");\n\ncolorList.TrimExcess();\n\
    \nConsole.WriteLine($\"Count = {colorList.Count}\");\nConsole.WriteLine($\"Capacity\
    \ = {colorList.Capacity}\");\n```\nOutput:\nCount = 5\nCapacity = 5\nCount = 0\n\
    Capacity = 5\nCount = 0\nCapacity = 0\n\n## 27.13 知识测试\n\n点击下面的链接或扫描二维码以测试你对 C#\
