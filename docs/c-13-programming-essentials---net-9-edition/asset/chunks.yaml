    ### 15.7 Passing a delegate to a method


    C# delegates have some useful capabilities, one of which is the ability to be
    passed as arguments to other methods.


    If you need a method to accept a delegate as a parameter, declare the parameter
    type accordingly in the method signature. Suppose we need to write a method that
    takes as parameters an instance of our `StringConverter` delegate and a string
    to be converted. Such a method could be declared as follows:


    ```csharp

    public static void DisplayText(StringConverter converter)

    {

    // Code to display text here

    }

    ```


    Make the following changes to fully implement the `DisplayText()` method and call
    it from the `Main()` method:


    ```csharp

    namespace DelegateDemo

    {


    internal class Program

    {


    delegate string StringConverter(string value);


    .

    .


    static void DisplayText(StringConverter converter, string text)

    {


    string result = converter(text);

    Console.WriteLine($"Converted text = {result}");

    }


    static void Main(string[] args)

    {


    StringConverter converter1 = new(LowerCase);

    StringConverter converter2 = new(UpperCase);


    .

    .


    DisplayText(converter1, "This IS a teST.");

    }


    }

    }

    ```


    When the code executes, the following output will appear in the console indicating
    that the delegate was successfully passed to the `DisplayText()` method:


    Converting to lowercase > Converted text = this is a test.


    ### 15.8 Take the knowledge test


    Click the link below or scan the QR code to test your knowledge and understanding
    of C# delegates:


    [https://www.answertopia.com/zcfz](https://www.answertopia.com/zcfz)


    ![img](image/c_-delegates.png)


    ### 15.9 Summary


    C# delegates allow us to store references to methods as variables, where the method’s
    signature dictates the variable type. A method’s signature is defined by a combination
    of the parameters it accepts and the type of result it returns. Once a delegate
    has been declared, it will have the capabilities of many other data types. In
    particular, delegates allow methods to be passed as arguments to other methods
    or even returned as a method result. Delegates can contain a single method (single
    cast) or be combined to create multicast delegates.


    ### 16. C# Anonymous Methods, Lambdas, and Local Functions


    In this chapter, you will learn how to use anonymous methods, lambdas, and local
    functions in C# to write flexible, concise, and reusable code.


    #### 16.1 Anonymous methods


    Anonymous methods are declared using the `delegate` keyword. Unlike traditional
    delegates, however, anonymous methods do not reference existing named methods.
    Instead, the code to be executed is assigned directly to the delegate (a concept
    referred to as inline). When declaring an anonymous method, you will use the following
    syntax:


    `delegate <returntype> <delegatename> (<parameters>);`


    The differences appear when you assign the code to be executed. The syntax for
    assigning a block of code to be executed by an anonymous method is as follows:


    `<delegate_type> <delegate_name> = delegate(<parameters>) {

    // Code to be executed

    };`


    Using this syntax and taking our `LowerCase()` method code as an example, we would
    write code as follows:


    ```csharp

    delegate string StringConverter(string value);

    StringConverter converter = delegate(string value)

    {


    Console.Write("Converting to lowercase > ");

    return value.ToLower();

    };

    ```


    #### 16.2 Creating the LambdaDemo project


    To see the above anonymous method declaration in action, launch VS Code, open
    your “C# Essentials” workspace folder and create a new .NET Console App project
    named `LambdaDemo`. Next, modify the `Program.cs` file as follows:


    ```csharp

    namespace LambdaDemo

    {


    internal class Program

    {


    delegate string StringConverter(string value);


    static void Main(string[] args)

    {


    StringConverter converter = delegate (string value)

    {


    Console.Write("Inline conversion to lowercase > ");

    return value.ToLower();

    };


    }


    }

    }

    ```


    The above code declares the `StringConverter` delegate, creates an instance named
    `converter`, and assigns to it an anonymous method that converts the string argument
    to lowercase. All that remains is to call the `converter` and display the result:


    ```csharp

    static void Main(string[] args)

    {


    StringConverter converter = delegate (string value)

    {


    Console.Write("Inline conversion to lowercase > ");

    return value.ToLower();

    };


    var result = converter("This is some TEXT");

    Console.WriteLine(result);

    }

    ```


    When the above code executes, the following output will appear in the console:


    Inline conversion to lowercase > this is some text


    As with standard delegates, you can also pass anonymous methods as arguments to
    other methods using the syntax outlined in the previous chapter, for example:


    ```csharp

    namespace LambdaDemo

    {


    internal class Program

    {


    delegate string StringConverter(string value);


    static void DisplayText(StringConverter converter, string text)

    {


    string result = converter(text);

    Console.WriteLine($"Converted text = { result}");

    }


    static void Main(string[] args)

    {


    StringConverter converter = delegate (string value)

    {


    Console.Write("Inline conversion to lowercase > ");

    return value.ToLower();

    };


    DisplayText(converter, "This IS a teST.");

    }


    }


    }

    ```


    Running the above code will produce the following output:


    Inline conversion to lowercase > Converted text = this is a test.


    #### 16.3 Lambdas


    You can think of lambdas as anonymous methods that allow code to be written more
    concisely. As with delegates and anonymous methods, you will first need to declare
    a variable of delegate to store the lambda and to define the return value and
    parameter types using the following, now familiar, syntax: `delegate <returntype>
    <delegatename> (<parameters>);`


    Lambdas are declared using the `=>` operator. The left side of the operator lists
    the input parameters, and the right side consists of an expression or code block
    containing the code to be executed. C# supports the following types of lambda:


    - Expression lambda: The lambda body contains a single expression.

    - Statement lambda: The lambda body contains a statement block containing multiple
    statements.


    The syntax for an expression lambda reads as follows:


    `(input-parameters) => expression`


    When passing a single parameter to a lambda, the parentheses placed around the
    input parameters in the above syntax are optional. A statement lambda, on the
    other hand, uses the following syntax:


    `(input-parameters) => { <statements> };`


    To appreciate the concise nature of lambdas, consider the following slightly modified
    anonymous method declaration from our `Program.cs` file:


    ```csharp

    delegate string StringConverter(string s);


    .

    .


    StringConverter converter = delegate (string s)

    {


    return s.ToLower();

    };

    ```


    Using a lambda, we can implement the same behavior as follows:


    ```csharp

    .

    .

    internal class Program

    {


    delegate string StringConverter(string s);


    static void Main(string[] args)

    {


    StringConverter converter = s => s.ToLower();


    var result = converter("LAMBDA Demo");

    Console.WriteLine(result);

    }


    }

    ```


    Before using a lambda, we started with the following code:


    ```csharp

    delegate(string s)

    {


    return s.ToLower();

    };

    ```


    Using a lambda has allowed us to reduce the original code to the following:


    `s => s.ToLower()`


    In the above lambda example, the left side of the lambda operator indicates that
    a single parameter named `s` is being passed through to the expression on the
    right. Notice that we did not need to declare that `s` is of type `string`. This
    is because we have already declared the type in the delegate variable declaration.
    The expression simply returns the value after converting it to lowercase. Having
    declared the lambda, we call it just like an anonymous method:


    ```csharp

    var result = converter("LAMBDA Demo");

    ```

