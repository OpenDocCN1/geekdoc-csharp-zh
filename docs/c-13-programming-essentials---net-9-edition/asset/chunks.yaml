    \ 成员应声明为 `static`，因为它被该类的所有对象实例共享。静态成员使用 `static` 关键字进行声明。例如：\n\n```csharp\npublic\
    \ class BankAccount\n{\n    private static int interestRate;\n}\n```\n\n静态成员通过类来访问，而不是通过对象。例如，我们可以通过如下引用\
    \ `BankAccount` 类来更改所有对象实例的 `interestRate` 成员：\n\n```csharp\nBankAccount.interestRate\
    \ = 10;\n```\n\n对于不可修改的数据成员，C# 提供了 `const` 和 `readonly` 关键字。这两者都实现了相同的目标，即防止分配给数据成员的值在声明后被更改。`const`\
    \ 或 `readonly` 成员的值必须在创建时进行赋值：\n\n```csharp\npublic readonly int daysInWeek =\
    \ 7;\n```\n\n### 13.10 从 C# 类实例化对象\n\n从类的“蓝图”创建对象被称为实例化。第一步是创建一个所需对象类型的对象变量。然后，使用\
    \ `new` 关键字创建对象的实例并将其赋值给对象变量：\n\n```csharp\nBankAccount custAccount;\ncustAccount\
    \ = new BankAccount();\n```\n\n也可以在一个语句中声明对象变量并分配对象：\n\n```csharp\nBankAccount\
    \ custAccount = new BankAccount();\n```\n\n或者，由于我们已经声明 `custAccount` 的类型为 `BankAccount`，我们可以让编译器推断我们正在请求一个新的\
    \ `BankAccount` 实例，如下所示：\n\n```csharp\nBankAccount custAccount = new();\n```\n\
    \n编辑 `Program.cs` 文件并添加以下代码：\n\n```csharp\nusing ObjectDemo;\nBankAccount custAccount\
    \ = new();\n```\n\n在创建了 `BankAccount` 类实例后，下一步是学习如何访问类的成员。\n\n### 13.11 访问 C#\
