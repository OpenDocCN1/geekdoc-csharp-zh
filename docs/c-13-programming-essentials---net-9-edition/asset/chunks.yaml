    \ 表示数组中的倒数第二个项，依此类推。索引 `⁰` 已被设置为数组中项目总数：\n\n```csharp\nstring[] myArray = {\n\
    \    \"item 1\", // <-- ⁷ - 倒数第 7 个\n    \"item 2\", // <-- ⁶\n    \"item 3\"\
    , // <-- ⁵\n    \"item 4\", // <-- ⁴\n    \"item 5\", // <-- ³\n    \"item 6\"\
    , // <-- ²\n    \"item 7\" // <-- ¹ - 最后一个项\n    // ⁰ = 数组长度\n};\n```\n\n以下代码演示了在处理范围和数组时如何使用索引操作符：\n\
    \n```csharp\nstring[] sentence = {\"The\", \"best\", \"way\", \"to\", \"predict\"\
    , \"the\", \"future\", \"is\", \"to\", \"invent\", \"it\"};\n\nstring[] subset1\
    \ = sentence[⁷..⁴];\nstring[] subset2 = sentence[..²];\nstring[] subset3 = sentence[3..³];\n\
    \nforeach (string word in subset1)\n{\n    Console.Write(\"{0} \", word);\n}\n\
    Console.WriteLine(\"\\n\");\n\nforeach (string word in subset2)\n{\n    Console.Write(\"\
    {0} \", word);\n}\nConsole.WriteLine(\"\\n\");\n\nforeach (string word in subset3)\n\
    {\n    Console.Write(\"{0} \", word);\n}\n```\n\n输出：\n```\npredict the future\n\
    The best way to predict the future is to\nto predict the future is\n```\n\n##\
    \ 26.7 排序 C# 数组\n\nC# 数组是 `Array` 包的一部分，该包还包含了一些用于排序和重排数组的实用方法。\n\n如果你需要对数组进行排序，可以将将其传递给\
    \ `Array.Sort()` 方法，如下：\n\n```csharp\nstring[] myColors = [ \"red\", \"green\"\
    , \"yellow\", \"orange\", \"blue\" ];\nConsole.WriteLine(\"Before Sort\");\nforeach\
    \ (string color in myColors)\n{\n    Console.Write(\"{0} \", color);\n}\nArray.Sort(myColors);\n\
    Console.WriteLine(\"\\n\\nAfter Sort\");\nforeach (string color in myColors)\n\
    {\n    Console.Write(\"{0} \", color);\n}\n```\n\n输出：\n```\nBefore Sort\nred green\
    \ yellow orange blue\nAfter Sort\nblue green orange red yellow\n```\n\n你也可以使用\
    \ `Array.Reverse()` 方法反转数组中元素的顺序：\n\n```csharp\nstring[] myColors = [\"red\",\
    \ \"green\", \"yellow\", \"orange\", \"blue\"];\nArray.Reverse(myColors);\nforeach\
    \ (string color in myColors)\n{\n    Console.Write(\"{0} \", color);\n}\n```\n\
    \n输出：\n```\nblue orange yellow green red\n```\n\n## 26.8 清空 C# 数组\n\n可以使用 `Array.Clear()`\
    \ 方法清空数组中的值。该方法将数组中的每个项重置为该类型的默认值（`Boolean` 值为 `false`，数值型项目为 `0`，字符串为 `null`）。清空数组元素的语法如下：\n\
    \n`Array.Clear(<array>, <start index>, <count>);`\n\n在上述语法中，`<array>` 是要清空的数组，`<start\
    \ index>` 是从数组哪个位置开始清空，`<count>` 是要清空的元素数量。\n\n以下示例从项目 1 开始清空了三个元素：\n\n```csharp\n\
    string[] myColors = [\"red\", \"green\", \"yellow\", \"orange\", \"blue\"];\n\
    Array.Clear(myColors, 1, 3);\nforeach (string color in myColors)\n{\n    Console.Write(\"\
    {0} \", color);\n}\n```\n\n当运行上述代码时，数组中将只剩下蓝色和红色元素。\n\n## 26.9 参加知识测试\n\n点击下方链接或扫描二维码，以测试你对\
    \ C# 数组管理的知识和理解：\n\n[`www.answertopia.com/ty5r`](https://www.answertopia.com/ty5r)\n\
    \n![img](img/c_-array-handling.png)\n\n## 26.10 总结\n\n本章探讨了 C# 数组中元素的访问、删除和排序。它演示了如何使用\
    \ `Rank` 属性确定维度数量，如何使用数组访问器符号访问元素，以及如何使用 `foreach` 循环遍历数组。此外，还涵盖了使用范围和从末开始索引运算符提取元素子集，以及使用\
    \ `Array.Sort()`、`Array.Reverse()` 和 `Array.Clear()` 方法分别进行排序、反转和清空数组。\n\n## 27.\
    \ C# List 集合\n\n在之前的章节中，我们学习了 C# 数组。虽然数组对很多任务有用，但在功能和灵活性方面开始显得过时。C# 集合类提供了更高级的机制来收集对象组。\n\
    \n### 27.1 创建 CollectionDemo 项目\n\n启动 VS Code，打开你的“C# Essentials”工作区文件夹并创建一个名为\
    \ `CollectionDemo` 的新 .NET 控制台应用程序项目。\n\n创建项目后，打开 `Program.cs` 文件并使用它尝试本章其余示例。\n\
    \n## 27.2 介绍 C# 集合类\n\nC# 集合类专门为对象分组并对其执行任务而设计。C# 提供了多种集合类，我们将在接下来的几个章节中查看一些关键类。\n\
    \n### 27.3 使用 `List<T>` 创建 C# 列表集合\n\n`List<T>` 类的属性与 C# 数组非常相似。该类相对于数组的一个关键优势是，它可以随着存储对象数量的变化而增长或收缩。\n\
    \n创建 `List<T>` 的语法如下：\n\n```csharp\nList<type> name = new List<type>();\n```\n\
    \n或者，你可以使用集合初始化器：\n\n```csharp\nList<type> name = [<item1>, <item2>, ...];\n```\n\
    \n### 27.4 向列表添加项\n\n一旦创建了 List 实例，你就可以调用多个方法对其执行任务。其中一个方法是 `Add()` 方法，如其名，它用于向列表添加项：\n\
    \n```csharp\nList<string> colorList = [];\ncolorList.Add(\"Red\");\ncolorList.Add(\"\
    Green\");\ncolorList.Add(\"Yellow\");\ncolorList.Add(\"Purple\");\ncolorList.Add(\"\
    Orange\");\n```\n\n`Add()` 方法将新项附加到列表末尾。若要在特定索引处插入新项，你需要使用稍后介绍的 `Insert()` 方法。\n\
    \n### 27.5 使用多个值初始化列表\n\n在上面的示例中，我们创建了一个空列表，然后使用 `Add()` 方法逐个添加项。但如果你需要初始化一个包含大量值的列表，可能会发现使用集合初始化器更高效：\n\
    \n```csharp\nList<string> colorList = [\"Red\", \"Green\", \"Yellow\", \"Purple\"\
    , \"Orange\"];\n```\n\n### 27.6 访问列表项\n\n可以使用项目的索引值访问列表中的单个项（注意第一个项是 0，第二个是 1，依此类推）。索引值放在列表名称后的方括号中。例如，要访问\
    \ `colorList` 对象中的第二个项：\n\n```csharp\nList<string> colorList = [\"Red\", \"Green\"\
    , \"Yellow\", \"Purple\", \"Orange\"];\nConsole.WriteLine(colorList[1]);\n```\n\
    \n输出：\nGreen\n\n列表项的值也可以同样结合索引和赋值运算符 (`=`) 来进行更改。例如，要将黄色改为靛蓝，代码如下：\n\n```csharp\n\
    List<string> colorList = [\"Red\", \"Green\", \"Yellow\", \"Purple\", \"Orange\"\
    ];\nConsole.WriteLine($\"Color before = {colorList[2]}\");\ncolorList[2] = \"\
    Indigo\";\nConsole.WriteLine($\"Color after = {colorList[2]}\");\n```\n\n输出：\n\
    Color before = Yellow\nColor after = Indigo\n\n与数组一样，你也可以构建 `foreach` 循环来列出列表中的所有项。例如：\n\
    \n```csharp\nList<string> colorList = [\"Red\", \"Green\", \"Yellow\", \"Purple\"\
    , \"Orange\"];\nforeach (string color in colorList)\n{\n    Console.Write($\"\
    {color} \");\n}\n```\n\n输出：\nRed Green Yellow Purple Orange\n\n## 27.7 从列表中移除项\n\
    \n可以使用 `Remove()` 方法从列表中移除项。该方法接受要移除的项的值作为参数。例如，要从 `colorList` 对象中移除“Orange”字符串，我们可以编写以下代码：\n\
    \n```csharp\nList<string> colorList = [\"Red\", \"Green\", \"Yellow\", \"Purple\"\
    , \"Orange\"];\ncolorList.Remove(\"Orange\");\n```\n\n"
