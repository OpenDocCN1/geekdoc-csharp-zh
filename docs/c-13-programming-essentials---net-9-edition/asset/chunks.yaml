  trans: "\n锯齿数组（Jagged array）是一种每个元素本身也是数组的数组。在这种语境下，使用“锯齿”一词是因为数组元素的长度可以是不同的。锯齿数组可以被看作是一个二维数组，其中每个子数组可以具有不同数量的元素。\n\
    \n以下是一个设计用于存储变长度二维数组的锯齿数组声明示例：\n\n```csharp\nchar[][] myJaggedArray;\n```\n\n\
    以下代码声明并初始化了同一个锯齿数组：\n\n```csharp\nchar[][] myJaggedArray = [\n    ['a', 'b', 'c',\
    \ 'd', 'e'],\n    ['f', 'g', 'h', 'i'],\n    ['j', 'j'],\n    ['k', 'l', 'm',\
    \ 'n', 'o', 'p', 'q', 'r']\n];\n```\n\n### 25.4 参加知识测试\n\n点击下方的链接或扫描二维码，以测试你对\
    \ C# 数组的知识和理解：\n\n[`www.answertopia.com/e6ca`](https://www.answertopia.com/e6ca)\n\
    \n![img](img/c_-arrays.png)\n\n### 25.5 总结\n\nC# 数组允许存储相同类型的值集合，每个项通过索引访问。多维数组在方括号内用逗号声明，而锯齿数组是长度不一的数组的数组。\n\
    \n## 26. 访问和排序 C# 数组元素\n\n上一章解释了如何在 C# 中创建二维、三维数组和锯齿数组。在本章中，我们将探索如何访问、删除和排序数组的元素。\n\
    \n#### 26.1 创建 ArrayDemo 项目\n\n启动 VS Code，打开你的“C# Essentials”工作空间文件夹，并创建一个名为 `ArrayDemo`\
    \ 的新 .NET 控制台应用程序项目。\n\n创建项目后，打开 `Program.cs` 文件，并使用它来尝试本章其余部分的示例。\n\n#### 26.2\
    \ 获取数组的维度数\n\n数组的维度可以通过数组的 `Rank` 属性获取。例如：\n\n```csharp\nchar[,] my2Darray = new\
    \ char[3,3]\n{\n    {'a', 'b', 'c'},\n    {'c', 'd', 'e'},\n    {'c', 'd', 'e'}\n\
    };\n\nchar[,,] my3Darray = new char[2,2,3]\n{\n    {\n        { 'a', 'b', 'c'\
    \ },\n        { 'c', 'd', 'e' }\n    },\n    {\n        { 'f', 'g', 'h' },\n \
    \       { 'i', 'j', 'k' }\n    }\n};\n\nConsole.WriteLine($\"Dimensions in my2Darray\
    \ = {my2Darray.Rank}\");\nConsole.WriteLine($\"Dimensions in my3Darray = {my3Darray.Rank}\"\
    );\n```\n\n输出：\n```\nDimensions in my2Darray = 2\nDimensions in my3Darray = 3\n\
    ```\n\n#### 26.3 访问数组元素\n\n一旦值存储在数组中，很有可能在 C# 代码的后续某处需要访问这些值。这是通过使用数组访问器符号结合目标值数组的索引来实现的。数组访问器简单是数组名后跟方括号（`[]`）。方括号内放置一个代表目标值数组索引的数字（请记住\
    \ C# 中第一个数组元素的索引为 0）。例如，要访问我们的 `myColors` 数组的第二个元素，将使用以下符号：\n\n```csharp\nstring[]\
    \ myColors = {\"red\", \"green\", \"yellow\", \"orange\", \"blue\"};\nConsole.WriteLine($\"\
    Element at index 1 = {myColors[1]}\");\n```\n\n执行上述代码时，将输出单词“green”，因为这是数组中索引位置\
    \ 1 处包含的字符串。\n\n同样，可以使用访问器符号结合赋值运算符（`=`）来更改数组中特定索引位置的值。例如，要更改数组第一个项的值：\n\n```csharp\n\
    string[] myColors = [\"red\", \"green\", \"yellow\", \"orange\", \"blue\"];\n\
    myColors[0] = \"violet\";\nConsole.WriteLine($\"Element at index 0 = {myColors[0]}\"\
    );\n```\n\n多维数组中的值可以通过指定指定并用逗号分隔的每个维度的索引值来访问。例如，要访问我们的 `my2Darray` 中第一个数组的第一个元素，将使用以下访问器（请记住数组从索引位置\
    \ 0 开始）：\n\n```csharp\nchar element = my2Darray[0,0];\n```\n\n以下代码演示了如何访问二维和三维数组中的各种元素：\n\
    \n```csharp\nchar[,] my2Darray = new char[3,3]\n{\n    {'a', 'b', 'c'},\n    {'d',\
    \ 'e', 'f'},\n    {'g', 'h', 'i'}\n};\n\nchar[,,] my3Darray =\n{\n    {\n    \
    \    { 'a', 'b', 'c' },\n        { 'd', 'e', 'f' }\n    },\n    {\n        { 'g',\
    \ 'h', 'i' },\n        { 'j', 'k', 'l' }\n    }\n};\n\n// 输出 my2Darray 中第一个数组的第一个元素\n\
    Console.WriteLine($\"{my2Darray[0,0]}\");\n// 输出 my2Darray 中第一个数组的第二个元素\nConsole.WriteLine($\"\
    {my2Darray[0,1]}\");\n// 输出 my2Darray 中第一个数组的第三个元素\nConsole.WriteLine($\"{my2Darray[0,2]}\"\
    );\n// 输出 my2Darray 中第二个数组的第一个元素\nConsole.WriteLine($\"{my2Darray[1,0]}\");\n\
    // 输出 my2Darray 中第二个数组的第二个元素\nConsole.WriteLine($\"{my2Darray[1,1]}\");\n// 输出\
    \ my2Darray 中第二个数组的第三个元素\nConsole.WriteLine($\"{my2Darray[1,2]}\");\n// 输出 my2Darray\
    \ 中第三个数组的第一个元素\nConsole.WriteLine($\"{my2Darray[2,0]}\");\n// 输出 my2Darray 中第三个数组的第二个元素\n\
    Console.WriteLine($\"{my2Darray[2,1]}\");\n// 输出 my2Darray 中第三个数组的第三个元素\nConsole.WriteLine($\"\
    {my2Darray[2,2]}\");\n\n// 输出 my3Darray 中第一个数组的第一个元素的第一个元素\nConsole.WriteLine($\"\
    {my3Darray[0,0,0]}\");\n// 输出 my3Darray 中第一个数组的第一个元素的第二个元素\nConsole.WriteLine($\"\
    {my3Darray[0,0,1]}\");\n// 输出 my3Darray 中第一个数组的第一个元素的第三个元素\nConsole.WriteLine($\"\
    {my3Darray[0,0,2]}\");\n// 输出 my3Darray 中第一个数组的第二个元素的第一个元素\nConsole.WriteLine($\"\
    {my3Darray[0,1,0]}\");\n// 输出 my3Darray 中第一个数组的第二个元素的第二个元素\nConsole.WriteLine($\"\
    {my3Darray[0,1,1]}\");\n// 输出 my3Darray 中第一个数组的第二个元素的第三个元素\nConsole.WriteLine($\"\
    {my3Darray[0,1,2]}\");\n// 输出 my3Darray 中第二个数组的第一个元素的第一个元素\nConsole.WriteLine($\"\
    {my3Darray[1,0,0]}\");\n// 输出 my3Darray 中第二个数组的第一个元素的第二个元素\nConsole.WriteLine($\"\
    {my3Darray[1,0,1]}\");\n// 输出 my3Darray 中第二个数组的第一个元素的第三个元素\nConsole.WriteLine($\"\
    {my3Darray[1,0,2]}\");\n// 输出 my3Darray 中第二个数组的第二个元素的第一个元素\nConsole.WriteLine($\"\
    {my3Darray[1,1,0]}\");\n// 输出 my3Darray 中第二个数组的第二个元素的第二个元素\nConsole.WriteLine($\"\
    {my3Darray[1,1,1]}\");\n// 输出 my3Darray 中第二个数组的第二个元素的第三个元素\nConsole.WriteLine($\"\
    {my3Darray[1,1,2]}\");\n```\n\n#### 26.4 数组迭代\n\n可以使用 `foreach` 语句来遍历数组。例如，遍历\
    \ `myColors`：\n\n```csharp\nstring[] myColors = [\"red\", \"green\", \"yellow\"\
    , \"orange\", \"blue\"];\nforeach (string color in myColors)\n{\n    Console.WriteLine(color);\n\
    }\n```\n\n输出：\n```\nred\ngreen\nyellow\norange\nblue\n```\n\n也可以使用 `for` 循环来遍历数组，通过索引访问项：\n\
    \n```csharp\nstring[] myColors = [\"red\", \"green\", \"yellow\", \"orange\",\
    \ \"blue\"];\nfor (int i = 0; i < myColors.Length; i++)\n{\n    Console.WriteLine(myColors[i]);\n\
    }\n```\n\n输出同样：\n```\nred\ngreen\nyellow\norange\nblue\n```\n\n#### 26.5 范围\n\n\
    范围运算符（`..`）和索引运算符（`^`）对于访问数组子集非常有用。单向范围运算符可以指定向某个方向延伸，直到到达范围的起始或结束（或者满足某个其他条件）。单向范围通过省略范围的一侧数字来声明，例如：`..`\
    \ 或 `^`。\n\n要指定从位置 2 开始到最后一个元素的范围，可以声明为 `2..`：\n\n```csharp\nstring[] sentence\
    \ = [\"The\", \"best\", \"way\", \"to\", \"predict\", \"the\", \"future\", \"\
    is\", \"to\", \"invent\", \"it\"];\nstring[] subset = sentence[2..];\n```\n\n\
    同样，要指定从第一个元素开始到位置 5 元素的范围，范围将是 `..5`：\n\n```csharp\nstring[] sentence = [\"The\"\
    , \"best\", \"way\", \"to\", \"predict\", \"the\", \"future\", \"is\", \"to\"\
    , \"invent\", \"it\"];\nstring[] subset = sentence[..5];\n```\n\n我们还可以将索引运算符与范围运算符结合，执行类似于下面提取从位置\
    \ 1 到倒数第二个元素的操作：\n\n```csharp\nstring[] sentence = [\"The\", \"best\", \"way\"\
    , \"to\", \"predict\", \"the\", \"future\", \"is\", \"to\", \"invent\", \"it\"\
    ];\nstring[] subset = sentence[1..²];\n```\n\n尝试运行以下代码查看上述示例的效果：\n\n```csharp\n\
    string[] sentence = [\"The\", \"best\", \"way\", \"to\", \"predict\", \"the\"\
