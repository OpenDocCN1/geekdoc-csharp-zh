    \ voltage)\n\n{\n\nif (voltage > 500)\n\n{\n\nthrow new HighVoltageException(\"\
    Voltage exceeds safety parameters.\" ,\n\nvoltage );\n\n}\n\nelse\n\n{\n\nConsole.WriteLine(\"\
    Safe Voltage\");\n\n}\n\n}\n\nException properties can be accessed from within\
