  trans: "\n字符串是字符的集合，它们组合在一起形成单词或句子。然而，如果没有人类，计算机可能永远与字符串没有任何关系。但事实是，计算机的主要工作之一就是接受人类提供的数据并向人类展示数据。出于这个原因，任何\
    \ C# 程序都可能涉及大量专门设计用于处理字符串格式数据的代码。\n\n## 30.1 创建 StringsDemo 项目\n\n启动 `VS Code`，打开你的“C#\
    \ Essentials”工作空间文件夹，创建一个名为 `StringsDemo` 的新 `.NET Console App` 项目。\n\n创建项目后，打开\
    \ `Program.cs` 文件并使用它来尝试本章其余部分的示例。\n\n## 30.2 在 C# 中创建字符串\n\n字符串由包含在字符串对象中的字符序列组成。可以使用多种不同的机制创建字符串对象。\n\
    \n可以按照如下方式声明字符串但不进行初始化：\n\n```csharp\nstring myString;\n```\n\n或者，你可以使用赋值运算符在\
    \ C# 中为字符串分配字面量值：\n\n```csharp\nstring myString = \"Hello World\";\n```\n\n当然，你也可以使用隐式类型来声明字符串：\n\
    \n```csharp\nvar myString = \"Hello World\";\n```\n\n同样，可以使用 `new` 关键字并将字面量值传递给构造函数创建一个新字符串：\n\
    \n```csharp\nstring myString = new(\"Hello World\");\n```\n\n字符串字面量置于双引号内（如所示）。如果字符串本身包含双引号，则转义字符（`\\\
    `）应位于双引号字符之前：\n\n```csharp\nConsole.WriteLine(\"He shouted \\\"Can you hear me\\\
    \"\");\n```\n\n输出：\n```\nHe shouted \"Can you hear me?\"\n```\n\n你还可以通过在字符串前加上\
    \ `@` 字符来指示 C# 将字符串中的所有字符视为字面量。当使用 `@` 符号时，双引号之间的所有内容都被视为原始字符串，无论文本中是否存在换行符、回车、反斜杠等。例如：\n\
    \n```csharp\nConsole.WriteLine(@\"You can put a backslash \\ here\n\nand a new\
    \ line\n\nand tabs work too.\n\nYou can also put in sequences that would normally\
    \ be seen as escape sequences like \\n and \\t.\");\n```\n\n输出：\n```\nYou can\
    \ put a backslash \\ here\n\nand a new line\n\nand tabs work too.\n\nYou can also\
    \ put in sequences that would normally be seen as escape sequences like \\n and\
    \ \\t.\n```\n\n如果你熟悉其他编程语言的 `herodoc` 函数，你会很快发现这本质上是 C# 的实现。\n\n## 30.3 获取 C#\
    \ 字符串的长度\n\n如果你需要识别 C# 字符串的长度，可以通过访问字符串对象的 `Length` 属性来实现：\n\n```csharp\nstring\
    \ myString = \"Hello World\";\nConsole.WriteLine($\"myString length = {myString.Length}\"\
    );\n```\n\n输出：\n```\nmyString length = 11\n```\n\n## 30.4 将字符串视为数组\n\n可以通过将字符串视为数组来访问字符串中的单个字符（数组在“在\
    \ C# 中创建 2D、3D 和交错数组” 中介绍过）。\n\n通过使用下标语法（`[]`）指定索引值，你可以访问字符串中的单个字符（记住第一个字符索引位置为\
    \ 0）：\n\n```csharp\nstring myString = \"Hello World\";\nConsole.WriteLine(myString[0]);\n\
    ```\n\n## 30.5 字符串迭代\n\n我们可以遍历任何集合，因此可以使用 `foreach` 循环遍历字符串的每个字符：\n\n```csharp\n\
    string myString = \"Hello World\";\nforeach (char c in myString)\n{\n    Console.WriteLine(c);\n\
    }\n```\n\n输出：\n```\nH\ne\nl\nl\no\nW\no\nr\nl\nd\n```\n\n## 30.6 字符串拼接\n\n可以使用简单的加法运算符（`+`）连接字符串。因此，我们可以如下方式组合字符串：\n\
    \n```csharp\nstring myString = \"Hello World.\";\nConsole.WriteLine(myString +\
    \ \" How are you?\");\n```\n\n输出：\n```\nHello World. How are you?\n```\n\n或者，你可以使用\
    \ `string` 类的 `Concat()` 方法来拼接字符串。该方法接受两个字符串作为参数并返回一个新字符串：\n\n```csharp\nstring\
    \ myString1 = \"If at first you don’t succeed, \";\nstring myString2 = \"try,\
    \ again.\";\nstring myString3 = string.Concat(myString1, myString2);\nConsole.WriteLine(myString3);\n\
    ```\n\n输出：\n```\nIf at first you don’t succeed, try, again.\n```\n\n## 30.7 比较字符串\n\
    \n如果你需要将一个字符串与另一个字符串比较，C# 提供了几种选项。最常用的选项是使用相等运算符，如下例所示：\n\n```csharp\nstring myString1\
    \ = \"Hello World\";\nstring myString2 = \"Hello World\";\nif (myString1 == myString2)\n\
    {\n    Console.WriteLine(\"The strings match.\");\n}\nelse\n{\n    Console.WriteLine(\"\
    They not match.\");\n}\n```\n\n输出：\n```\nThe strings match\n```\n\n你也可以使用 `Equals()`\
    \ 方法以类似的方式比较字符串。该方法接受两个比较的字符串并返回指示字符串是否匹配的布尔值：\n\n```csharp\nstring myString1\
    \ = \"Hello world\";\nstring myString2 = \"Hello world\";\nif (string.Equals(myString1,\
    \ myString2))\n{\n    Console.WriteLine(\"The strings match.\");\n}\nelse\n{\n\
    \    Console.WriteLine(\"The strings do not match.\");\n}\n```\n\n输出：\n```\nThe\
    \ strings match\n```\n\n在上面的示例中，我们将两个字符串都传递给了 `Equals()` 方法。`Equals()` 方法也可以在字符串字面量或对象上调用以获得相同的结果：\n\
    \n```csharp\nstring myString1 = \"Hello world\";\nstring myString2 = \"Hello world\"\
    ;\nif (myString1.Equals(myString2, StringComparison.Ordinal))\n{\n    Console.WriteLine(\"\
    The strings match.\");\n}\nelse\n{\n    Console.WriteLine(\"The strings do not\
    \ match.\");\n}\n```\n\n输出：\n```\nThe strings match\n```\n\n到为止，我们探索的所有比较都是区分大小大小的。在调用\
    \ `Equals()` 方法时，你还可以传递一个比较类型参数。该类型必须来自 C# 的 `StringComparison` 枚举，它在执行文化敏感比较设置的值之外，还包含了用于区分大小写比较的\
    \ `OrdinalIgnoreCase` 值：\n\n```csharp\nstring myString1 = \"HELLO WORLD\";\nstring\
    \ myString2 = \"Hello world\";\nif (string.Equals(myString1, myString2, StringComparison.OrdinalIgnoreCase))\n\
    {\n    Console.WriteLine(\"The strings match.\");\n}\nelse\n{\n    Console.WriteLine(\"\
    The strings do not match.\");\n}\n```\n\n输出：\n```\nThe strings match\n```\n\n\
    当直接在字符串字面量或对象上调用 `Equals()` 方法时，同样的方法有效：\n\n```csharp\nvar result = \"My String\"\
    .Equals(\"my string\", StringComparison.OrdinalIgnoreCase);\n```\n"
- fmt: "\nThe `string.Compare()` method provides yet another way to compare strings,\
    \ though this method has some useful additional features. This method accepts\
    \ as arguments the two strings to be compared and returns an integer value indicating\
    \ how the strings relate to each other in relation to sort order. A result of\
    \ 0 indicates that the strings match. A value of less than 0 indicates that the\
    \ first string precedes the second string in the sort order. Finally, a result\
    \ of greater than 0 indicates the second string precedes the first in the sort\
    \ order:\n\n```cs\nstring myString1 = \"Bananas are yellow.\";\nstring myString2\
    \ = \"Oranges are orange.\";\nvar result = string.Compare(myString1, myString2);\n\
    \nif (result == 0)\n{\n    Console.WriteLine(\"Strings match.\");\n}\nelse if\
    \ (result < 0)\n{\n    Console.WriteLine(\"myString1 precedes myString2 in sort\
    \ order.\");\n}\nelse if (result > 0)\n{\n    Console.WriteLine(\"myString2 precedes\
    \ myString1 in sort order.\");\n}\n```\nOutput:\nmyString1 precedes myString2\
    \ in sort order.\n\n### 30.8 Changing string case\n\nThe case of the characters\
    \ in a string may be changed using the `ToUpper()` and `ToLower()` methods. Both\
    \ of these methods return a modified string rather than changing the actual string.\
    \ For example:\n\n```cs\nstring myString = \"Hello World\";\nstring newString;\n\
    newString = myString.ToUpper();\nConsole.WriteLine(newString);\nnewString = myString.ToLower();\n\
    Console.WriteLine(newString);\n```\nOutput:\nHELLO WORLD\nhello world\n\n### 30.9\
    \ Splitting a string into multiple parts\n\nA string may be separated into multiple\
    \ parts using the `Split()` method. `Split()` takes as an argument the character\
    \ to use as the delimiter to identify the points at which the string is to be\
    \ split. Returned from the method call is an array containing the individual parts\
    \ of the string. For example, the following code splits a string up using the\
    \ comma character as the delimiter. The results are placed in an array called\
    \ `myColors` and a `foreach` loop then reads each item from the array and displays\
    \ it:\n\n```cs\nstring myString = \"Red, Green, Blue, Yellow, Pink, Purple\";\n\
    string[] myColors = myString.Split(',');\nforeach (string color in myColors)\n\
    {\n    Console.WriteLine(color);\n}\n```\nOutput:\nRed Green Blue Yellow Pink\
    \ Purple\n\nAs we can see, the `Split()` method broke the string up as requested,\
    \ but we have a problem in that the spaces are still present. Fortunately, C#\
    \ provides a method to handle this.\n\n### 30.10 Trimming and padding strings\n\
    \nUnwanted leading and trailing spaces can be removed from a string using the\
    \ `Trim()` method. When called, this method returns a modified version of the\
    \ string with both leading and trailing spaces removed:\n\n```cs\nstring myString\
    \ = \" hello \";\nConsole.WriteLine(\"[\" + myString + \"]\");\nConsole.WriteLine(\"\
    [\" + myString.Trim() + \"]\");\n```\nOutput:\n[ hello ]\n[hello]\n\nIf you only\
    \ need to remove leading or trailing spaces, use either the `TrimStart()` or `TrimEnd()`\
    \ method respectively.\n\nThe inverse of the trim methods are the `PadLeft()`\
    \ and `PadRight()` methods. These methods allow leading or trailing characters\
    \ to be added to a string. The methods take as arguments the total number of characters\
    \ to which the string is to be padded and the padding character:\n\n```cs\nstring\
    \ myString = \"hello\";\nstring newString;\nnewString = myString.PadLeft(10, '\
    \ ');\nnewString = newString.PadRight(20, '*');\nConsole.WriteLine(\"[\" + newString\
    \ + \"]\");\n```\nOutput:\n[ hello**********]\n\n### 30.11 String replacement\n\
    \nParts of a string may be replaced using the `Replace()` method. This method\
    \ takes the part of the string to be replaced and the replacement string as arguments\
    \ and returns a new string reflecting the change. The `Replace()` method will\
    \ replace all instances of the string:\n\n```cs\nstring myString = \"Hello World\"\
    ;\nstring newString;\nConsole.WriteLine(myString);\nnewString = myString.Replace(\"\
    Hello\", \"Goodbye\");\nConsole.WriteLine(newString);\n```\nOutput:\nHello World\n\
    Goodbye World\n\n### 30.12 Take the knowledge test\n\nClick the link below or\
    \ scan the QR code to test your knowledge and understanding of C# strings:\n\n\
    [https://www.answertopia.com/nppx](https://www.answertopia.com/nppx)\n\n![img](image/c_-strings.png)\n\
    \n### 30.13 Summary\n\nC# strings are collections of characters used for human-computer\
    \ interaction. Strings can be created using literals, `new` keyword, or implicit\
    \ typing. They can be manipulated using methods like `Length()`, `ToCharArray()`,\
    \ and `Concat()`, and iterated over using `foreach` loops.\n\nC# provides various\
    \ methods for comparing strings, including equality operators like `Equals()`,\
    \ and `Compare()`. The `ToUpper()` and `ToLower()` methods can change string case,\
    \ while `Split()` separates strings into parts. `Trim()` removes leading and trailing\
    \ spaces, while `PadLeft()` and `PadRight()` add characters to the beginning or\
    \ end of a string.\n\n# 31. C# String Formatting\n\nIn addition to the wide selection\
    \ of string manipulation functions outlined in the previous chapter, the string\
    \ class also provides the `Format()` method.\n\nThe primary purpose of the C#\
    \ string `Format()` method is to provide a way of inserting string, numerical,\
    \ or boolean values into a string with additional formatting control.\n\n### 31.1\
    \ The Syntax of the string Format() method\n\nThe general syntax of the `string\
    \ Format()` method is as follows:\n\n`string.Format(\"format string\", arg1, arg2,\
    \ .... );`\n\nThe format string is the string into which the values will be placed.\
    \ Within this string are placeholders that indicate the location of each value\
    \ within the string. Placeholders take the form of braces `{}` surrounding a number\
    \ indicating the corresponding argument to be substituted for the placeholder.\
    \ Following on from the format string is a comma-separated list of arguments.\
    \ There must be an argument for each of the placeholders.\n\n### 31.2 Creating\
    \ the StringFormatDemo project\n\nLaunch VS Code, open your “C# Essentials” workspace\
    \ folder, and create a new .NET Console App project named `StringFormatDemo`.\n\
    \nAfter creating the project, open the `Program.cs` file and use it to try out\
    \ the examples in the rest of this chapter.\n\n### 31.3 A simple string formatting\
    \ example\n\nThe following code example demonstrates a straightforward use of\
    \ the `string Format()` method:\n\n```cs\nstring newString;\nnewString = string.Format(\"\
    There are {0} cats in my {1} and no {2}\", 2, \"house\", \"dogs\");\nConsole.WriteLine\
    \ (newString);\n```\nOutput:\nThere are 2 cats in my house and no dogs\n\nLet’s\
    \ quickly review the `string Format()` method call in the above example. The format\
    \ string contains three placeholders indicated by `{0}`, `{1}`, and `{2}`. Following\
    \ the format string are the arguments to be used in each placeholder. So, for\
    \ example, `{0}` is replaced by the first argument (the number 2), the `{1}` by\
    \ the second argument (the string “house”), and so on.\n\nIf you cast your mind\
    \ back to the “C# Variables and Constants” chapter, you will probably wonder how\
    \ this compares to the string interpolation technique we have used countless times\
    \ the book. As we will see below, C# string formatting becomes more useful when\
    \ combined with format controls.\n\n### 31.4 Using format controls\n\nSo far,\
    \ we have only substituted arguments for placeholders, but we have not changed\
    \ the format of the arguments before they are displayed. This essentially instructs\
    \ the `Format()` method to use the default formatting for each argument when displaying\
    \ the string. Perhaps the most powerful aspect of the `Format()` method is the\
    \ ability to use format controls within the placeholders to control the output\
    \ format.\n\nFormat controls appear inside the braces `{}` of the placeholders.\
    \ The format of a placeholder with a format control is as follows:\n\n`{n:controlx}`\n\
    \nIn the above syntax, `n` is the placeholder number and `control` is the special\
    \ format control sequence to be applied to the argument. The `x` optional number\
    \ further formats the output for certain control types.\n\n### 31.5 A simple format\
    \ control example\n\nThe following example uses the `X` format control, which\
    \ is used to display a number using hexadecimal format:\n"
