  trans: "\n\n当应用程序运行时，控制台中将出现以下输出：\n\n```\nmyTuple Price = 432.43\nmyTuple Product\
    \ = Refrigerator\nmyTuple Quantity = 10\n```\n\n### 21.5 从方法中返回元组\n\n元组（Tuples）对于从方法返回多个结果特别有用。例如，假设我们不需要显示产品信息，而是需要\
    \ `GetProductData()` 方法返回数据。为了实现这一点，需要将每个元组值的类型包含在方法的返回类型声明中，如下所示：\n\n```csharp\n\
    private static (int, string, double) GetProductData()\n{\n    .\n    .\n}\n```\n\
    \n在方法内部返回元组时，我们可以如下返回一个已存在的元组：\n\n```csharp\nprivate static (int, string, double)\
    \ GetProductData()\n{\n    var myTuple = (Count: 10, Product: \"Refrigerator\"\
    , Price: 432.43);\n    return myTuple;\n}\n```\n\n或者，也可以通过将单独值放在 `return` 语句后的括号中来返回它们：\n\
    \n```csharp\nprivate static (int, string, double) GetProductData()\n{\n    return\
    \ (10, \"Refrigerator\", 432.43) ;\n}\n```\n\n调用时，返回的元组可以赋值给变量，并使用点表示法访问单独的值：\n\
    \n```csharp\nstatic void Main(string[] args)\n{\n    var myTuple = GetProductData();\n\
    \    Console.WriteLine($\"myTuple Price = {myTuple.Item1}\");\n    Console.WriteLine($\"\
    myTuple Product = {myTuple.Item2}\");\n    Console.WriteLine($\"myTuple Quantity\
    \ = {myTuple.Item3}\");\n}\n```\n\n如果你倾向于使用字段名而不是 `Item<n>` 默认名称，一种方法是如下所示包含字段名和类型：\n\
    \n```csharp\nstatic void Main(string[] args)\n{\n    (int Count, string Product,\
    \ double Price) myTuple = GetProductData();\n    Console.WriteLine($\"myTuple\
    \ Price = {myTuple .Price }\");\n    Console.WriteLine($\"myTuple Product = {myTuple\
    \ .Product }\");\n    Console.WriteLine($\"myTuple Quantity = {myTuple .Count\
    \ }\");\n}\n```\n\n到目前为止，将每个元组值分配给命名变量的最方便方法是使用类型推断。例如，以下代码将 `GetProductData()`\
    \ 返回的元组中的三个值赋值给名为 `count`、`product` 和 `price` 的变量：\n\n```csharp\nvar (count, product,\
    \ price) = GetProductData();\n```\n\n使用这种方法，我们现在可以直接访问变量，而不需要先从元组中提取它们：\n\n```csharp\n\
    static void Main(string[] args)\n{\n    var (count, product, price) = GetProductData();\n\
    \    Console.WriteLine($\"Price = { price }\");\n    Console.WriteLine($\"Product\
    \ = { product }\");\n    Console.WriteLine($\"Quantity = { count }\");\n}\n```\n\
    \n### 21.6 元组作为方法参数\n\n除了从方法返回元组结果外，你还可以将元组传递给方法。设计用于接收示例元组作为参数的方法可以声明如下：\n\n\
    ```csharp\npublic static void DisplayProductData((int, string, double) productTuple)\n\
    {\n}\n```\n\n或者，可以为元组值分配字段名：\n\n```csharp\npublic static void DisplayProductData((int\
    \ count, string description,\ndouble price) productTuple)\n{\n}\n```\n\n一旦声明了方法，我们就可以通过多种方式传递元组。一种方法是将字面量值传递给方法：\n\
    \n```csharp\nDisplayProductData((20, \"Water filter\", 29.99));\n```\n\n另一个选项当然是创建一个元组对象并将其传递给方法：\n\
    \n```csharp\nvar myTuple = (20, \"Water filter\", 29.99);\nDisplayProductData(myTuple);\n\
    ```\n\n修改 `Program.cs` 文件以添加 `DisplayProductData()` 方法并向其传递元组参数：\n\n```csharp\n\
    static void Main(string[] args)\n{\n    var myTuple = GetProductData();\n    DisplayProductData(myTuple);\n\
    }\n\npublic static void DisplayProductData((int, string, double) productTuple)\n\
    {\n    var (count, product, price) = productTuple;\n    Console.WriteLine($\"\
    Price = {price}\");\n    Console.WriteLine($\"Product = {product}\");\n    Console.WriteLine($\"\
    Quantity = {count}\");\n}\n```\n\n运行应用程序并验证控制台中是否显示了产品信息。\n\n### 21.7 知识测试\n\n\
    点击下面的链接或扫描二维码以测试你对 C# Tuple 类型的知识和理解：\n\n[`www.answertopia.com/pxci`](https://www.answertopia.com/pxci)\n\
    \n![img](img/c_-tuple.png)\n\n### 21.8 总结\n\n元组允许我们在类中临时组合值。元组允许从方法返回多个结果。元组允许在方法之间传递值。元组允许作为参数使用。元组允许在\
    \ C# 中结构化数据。\n\n# 22. 命名空间 (Namespaces)\n\n在之前的章节中，我们详细讨论了类和结构。现在我们已经学习了面向对象编程，准备好了解命名空间是什么、它们为什么存在以及如何使用它们。\n\
    \n### 22.1 理解作用域 (Scope)\n\n在讨论命名空间之前，我们首先需要理解作用域（scope）的概念。作用域定义了如类、方法和变量等实体是否可见。我们在讨论\
    \ C# 循环时简要提到过作用域。例如，在循环体内定义的变量仅属于该循环：\n\n```csharp\nfor (int i = 0; i < 10; i++)\n\
    {\n    int myCounter = 0; // 在循环作用域内创建\n    myCounter += i;\n}\n// 循环结束后 myCounter\
    \ 不存在\n```\n\n同样，类方法和属性位于它们所属类的作用域内，可以通过引用类来访问。在下面的示例中，我们可以通过引用 `MyClass` 来访问\
    \ `IncrementCounter()` 方法：\n\n```csharp\nclass MyClass\n{\n    static int myCounter\
    \ = 0;\n    public static void IncrementCounter() {\n        myCounter++;\n  \
    \  }\n}\n\nMyClass.IncrementCounter();\n```\n\n作用域允许我们声明类和结构，而不必担心某个类中的方法与另一个类的方法冲突。例如，以下类中的相同方法名不会发生冲突，因为它们属于不同的作用域：\n\
    \n```csharp\nclass MyClass\n{\n    static int myCounter = 0;\n    public static\
    \ void IncrementCounter() {\n        myCounter++;\n    }\n}\n\nclass MyOtherClass\n\
    {\n    static int myCounter = 0;\n    public static void IncrementCounter() {\n\
    \        myCounter++;\n    }\n}\n```\n\n然而，当类和结构本身发生命名冲突时，问题出现了。如果上面的两个类都命名为 `MyClass`，代码将产生语法错误。解决此问题的方法是使用命名空间。\n\
    \n### 22.2 命名空间概述\n\n类似于类和结构，命名空间为 C# 代码提供了额外的组织层。正如我们所见，C# 项目包含类和结构，分布在多个文件中。\n\
    \n特别是在具有复杂代码库的大项目中，在类或结构作用域之外定义的名称可能会相互发生冲突，无论是在你编写的代码中，还是在你的代码与内置 .NET 类和结构之间。例如，以下代码将因为类名冲突而触发语法错误：\n\
    \n```csharp\nclass ClassA\n{\n    public static void OpenFile() {\n        Console.WriteLine(\"\
    Class A OpenFile()\");\n    }\n}\n\nclass ClassA\n{\n    public static void OpenFile()\n\
    \    {\n        Console.WriteLine(\"Class A OpenFile()\");\n    }\n}\n```\n"
- fmt: "\nNamespaces allow application code to be organized into separate scopes (called\
    \ spaces) so that the names in one namespace do not conflict with the same names\
    \ in another. In the absence of a specific namespace, declarations such as those\
    \ above are members of the global namespace, as illustrated in [Figure 22-1](#Namespaces.xhtml__idTextAnchor277)\
    \ below:\n\n![img](image/name_conflict.png)\n\nFigure 22-1\n\nAside from renaming\
    \ one of the classes, the only way to resolve the `ClassA` naming conflict is\
    \ to move one or both classes into separate namespaces. In the rest of this chapter,\
    \ we will create a project to resolve the above problem and explore namespaces\
    \ in more detail.\n\n## 22.3 Creating the NamespaceDemo project\n\nLaunch `VS\
    \ Code`, open your “C# Essentials” workspace folder, and create a new `.NET` Console\
    \ App project named `NamespaceDemo`.\n\nLocate the new project in the Explorer\
    \ panel, edit the `Program.cs` file, and replace the existing code with the following:\n\
    \n```csharp\nclass ClassA {\n    public static void OpenFile() {\n        Console.WriteLine(\"\
    First ClassA OpenFile()\");\n    }\n}\n\nclass ClassA {\n    public static void\
    \ OpenFile() {\n        Console.WriteLine(\"Second ClassA OpenFile()\");\n   \
    \ }\n}\n\nnamespace SampleApp\n{\n    internal class Program\n    {\n        static\
    \ void Main(string[] args)\n        {\n        }\n    }\n}\n```\n\nAt this point,\
    \ the editor will report the following syntax error in the second `ClassA` declaration:\n\
    \nThe namespace '<global namespace>' already contains a definition for 'ClassA'`\n\
    \nThis tells us that both classes reside in the same namespace (in this case the\
    \ global namespace) and have conflicting names. To resolve this we need to create\
    \ another namespace.\n\n## 22.4 Declaring namespaces\n\nNamespaces are declared\
    \ using the `namespace` keyword followed by a name and braces encapsulating the\
    \ namespace members. To resolve the naming conflict, we can place the second `ClassA`\
    \ declaration into a separate namespace, leaving the first in the global namespace:\n\
    \n```csharp\nclass ClassA {\n    public static void OpenFile() {\n        Console.WriteLine(\"\
    ClassA OpenFile()\");\n    }\n}\n\nnamespace DemoSpace\n{\n    class ClassA {\n\
    \        public static void OpenFile() {\n            Console.WriteLine(\"Second\
    \ ClassA OpenFile()\");\n        }\n    }\n}\n```\n\nAfter making the above changes,\
    \ the duplicate definition error should be resolved:\n\n![img](image/name_conflict_resolved.png)\n\
    \nFigure 22-2\n\nA single source file can contain multiple namespaces. Modify\
    \ the example to include two namespaces as follows:\n\n```csharp\nnamespace DemoSpaceOne\n\
    {\n    class ClassA {\n        public static void OpenFile() {\n            Console.WriteLine(\"\
    First ClassA OpenFile()\");\n        }\n    }\n}\n\nnamespace DemoSpaceTwo\n{\n\
    \    class ClassA {\n        public static void OpenFile() {\n            Console.WriteLine(\"\
    Second ClassA OpenFile()\");\n        }\n    }\n}\n```\n\nWith this change, our\
    \ project now contains three namespaces (in addition to the `System` namespace\
    \ required for the `Console.WriteLine()` calls): `DemoSpaceOne`, `DemoSpaceTwo`,\
    \ and the global namespace:\n\n![img](image/multiple_namespaces.png)\n\nFigure\
    \ 22-3\n\n## 22.5 Accessing namespace members\n\nWith the two `ClassA` definitions\
    \ contained within separate namespaces, we need a way to tell the compiler which\
    \ class we are accessing. Using dot notation, we can differentiate the classes\
    \ by referencing the corresponding namespace. Modify the `Main()` method as follows\
    \ to call the `OpenFile()` method belonging to each `ClassA` implementation:\n\
    \n```csharp\nnamespace SampleApp\n{\n    internal class Program\n    {\n     \
    \   static void Main(string[] args)\n        {\n            DemoSpaceOne.ClassA.OpenFile();\n\
    \            DemoSpaceTwo.ClassA.OpenFile();\n        }\n    }\n}\n```\n\nCompile\
    \ and run the app and verify that the output listed below appears in the Terminal:\n\
    \nFirst ClassA OpenFile()\nSecond ClassA OpenFile()\n\n## 22.6 Namespaces and\
    \ the “using” keyword\n\nAn alternative to dot notation is the `using` keyword\
    \ which tells the compiler which namespace to use by default in the absence of\
    \ an explicit namespace declaration. For example, the following changes will default\
    \ to `DemoSpaceTwo` when no namespace is specified in the `Main()` method:\n\n\
    ```csharp\nusing DemoSpaceTwo;\n\nnamespace DemoSpaceOne\n{\n}\n\nnamespace DemoSpaceTwo\n\
    {\n}\n\nnamespace SampleApp\n{\n    internal class Program\n    {\n        static\
    \ void Main(string[] args)\n        {\n            ClassA.OpenFile();\n      \
    \  }\n    }\n}\n```\n\nWhen the app runs, the `ClassA.OpenFile()` method belonging\
    \ to the `DemoSpaceTwo` namespace will be called:\n\nSecond ClassA OpenFile()\n\
    \nTo access the `DemoSpaceOne` `OpenFile()` method, however, we must still override\
    \ the default namespace specified by the `using` statement as follows:\n\n```csharp\n\
    using DemoSpaceTwo;\n\nstatic void Main(string[] args)\n{\n    ClassA.OpenFile()\
    \ // Defaults to DemoSpaceTwo\n    DemoSpaceOne.ClassA.OpenFile(); // Explicitly\
    \ selects DemoSpaceOne\n}\n```\n\n## 22.7 Nested namespaces\n\nNamespaces can\
    \ be declared within other namespaces to create a nested hierarchy. To experience\
    \ nested namespaces, add the following namespace declaration to the `Program.cs`\
    \ file:\n\n```csharp\nnamespace DemoOne\n{\n    namespace DemoTwo\n    {\n   \
    \     namespace DemoThree\n        {\n            class ClassC {\n           \
    \     public static string message = \"DemoThree message\";\n            }\n \
    \       }\n    }\n}\n```\n\nTo access the `message` field we need to reference\
    \ each of the containing namespaces:\n\n```csharp\nstatic void Main(string[] args)\n\
    {\n    var message = DemoOne.DemoTwo.DemoThree.ClassC.message;\n    Console.WriteLine(message);\n\
    }\n```\n\nWhen the app runs, the output will now `DemoThree` message.\n\n## 22.8\
    \ Aliases and the namespace alias operator\n\nC# allows the `using` keyword to\
    \ assign aliases to namespace references. Using this technique, we can assign\
    \ an alias to our nested namespace as follows:\n\n```csharp\nusing DemoSpaceTwo;\n\
    using MyAlias = DemoOne.DemoTwo.DemoThree;\n```\n\nTo access `ClassC` using the\
    \ alias, we use the alias operator (`::`):\n\n```csharp\nstatic void Main(string[]\
    \ args)\n{\n    ClassA.OpenFile();\n    DemoSpaceOne.ClassA.OpenFile();\n    var\
    \ message = MyAlias::ClassC.message;\n    Console.WriteLine(message);\n}\n```\n\
    \nNote that the alias declaration has not overridden the `using DemoSpaceTwo`\
    \ statement and we are still able to access the `OpenFile()` method without referencing\
    \ the namespace.\n\nThe alias operator can also be used to explicitly access objects\
    \ in the global namespace. Consider the following code sample of a class that\
    \ is declared both in the global namespace and within a custom namespace:\n\n\
    ```csharp\nclass MyString {\n    public static string text = \"Global string\"\
    ;\n}\n\nnamespace SampleApp {\n    class MyString {\n        public static string\
    \ text = \"Local string\";\n    }\n\n    internal class Program\n    {\n     \
    \   static void Main(string[] args)\n        {\n            Console.WriteLine(MyString.text);\n\
    \        }\n    }\n}\n```\n\nWhen the above code executes, the text from the local\
    \ `MyString` class will be displayed. To access the global class, we can use the\
    \ alias operator to specify the global namespace:\n\n```csharp\nstatic void Main(string[]\
    \ args)\n{\n    Console.WriteLine(MyString.text);\n    Console.WriteLine(global::MyString.text);\n\
    }\n```\n\n## 22.9 File scoped namespaces\n\nIf the entire contents of a source\
    \ file is to belong to the same namespace, a file scoped declaration can be used.\
    \ In the following code, `ClassA` and `ClassB` are both declared within the `FileScopeSpace`\
    \ namespace:\n\n```csharp\nnamespace FileScopeSpace;\n\nclass ClassA {\n    public\
    \ static void OpenFile() {\n        Console.WriteLine(\"Class A OpenFile()\");\n\
    \    }\n}\n\nclass ClassB {\n    public static void OpenFile() {\n        Console.WriteLine(\"\
    Class B OpenFile()\");\n    }\n}\n```\n\nFile scoped namespaces cannot include\
    \ other namespaces. The following, therefore, is invalid syntax:\n\n```csharp\n\
    namespace FileScopeSpace;\n\nclass ClassA {\n    public static void OpenFile()\
    \ {\n        Console.WriteLine(\"Class A OpenFile()\");\n    }\n}\n\nnamespace\
    \ SpaceOne // Invalid namespace declaration\n{\n    class ClassB {\n        public\
    \ static void OpenFile() {\n            Console.WriteLine(\"Class B OpenFile()\"\
    );\n        }\n    }\n}\n```\n\n## 22.10 Take the knowledge test\n\nClick the\
    \ link below or scan the QR code to test your knowledge and understanding of C#\
    \ namespaces:\n\n[https://www.answertopia.com/bkx3](https://www.answertopia.com/bkx3)\n\
    \n![img](image/c_-namespaces.png) \n\n## 22.11 Summary\n"
