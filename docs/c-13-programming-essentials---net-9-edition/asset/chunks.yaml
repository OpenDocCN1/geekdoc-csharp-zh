    \n通过我们的 `AsyncDemo` 示例，我们知道 `Main()` 方法连续调用了三次文件处理方法，并且每次调用都必须等待上一个调用完成后才能执行执行。这种处理多个文件的方式不仅效率低下，而且在三次调用之后的代码在最后一次调用完成之前任何一个都无法执行，这在本质上锁定了应用程序。在大多数情况下，当\
    \ `Main()` 方法等待 `ProcessFileAsync()` 方法返回结果时，可能还有其他可以执行的任务，例如处理其他数据、为用户提供状态更新以及响应用户输入。\n\
    \n使用 `Task` 对象和 `await`，我们可以并行运行三个文件处理操作，并并在等待异步调用结果的同时允许 `Main()` 方法中的其他代码运行。\n\
