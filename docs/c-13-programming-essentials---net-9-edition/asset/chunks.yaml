    \ is typically prefixed by a drive letter (`C:\\Users\\Demo`). Systems that use\
    \ the standard UNIX convention (macOS, Linux, iOS, Android, etc.) use the forward\
    \ slash (`/`) to separate components (`/Users/Demo/Desktop`).\n\nWhen a program\
    \ starts, the current working directory is the directory from which the app was\
