    ## 7.12 字符串插值 (String interpolation)


    还可以使用字符串插值通过字符串、变量、常量、表达式和函数调组合构建字符串。


    插值通过在字面量声明前加上 `$` 字符并将项目包裹如下所示 `{item}` 来将其嵌入字符串中，其中 `{item}` 是常量或变量名、函数调用，甚至是像数学计算这样的表达式：


    ```csharp

    int count = 10;


    string message = $"The current count is {count}";

    ```


    例如，下面的代码使用字符串插值创建一个新的字符串变量，嵌入来自各种来源的内容，然后输出到控制台：


    ```csharp

    string userName = "John";


    int inboxCount = 25;


    int maxCount = 100;


    var message = $"{userName} has {inboxCount} messages. Message capacity remaining
    is {maxCount - inboxCount}.";


    Console.WriteLine(message);

    ```


    运行上面的示例代码将生成以下：


    John has 25 messages. Message capacity remaining is 75.


    如果你需要在大括号 (`{}`) 中包裹内容而不使其被解释为插值值，请如下所示使用双大括号 (`{{}}`）：


    ```csharp

    string userName = "John";


    var message = $"{userName} reported seeing error code 10 {{low battery}}.";


    Console.WriteLine(message);

    ```


    执行上述代码后，将出现以下文本：


    John reported seeing error code 10 {low battery}.


    插值也可以在逐义字符串字面量中使用，通过在字符串前加上 `$@` 或 `@$` 来实现：


    ```csharp

    string userName = "John";


    int inboxCount = 25;


    int maxCount = 100;


    var message = $@"{userName} has {inboxCount} messages.


    Message capacity remaining is {maxCount - inboxCount}.";


    Console.WriteLine(message);

    ```


    上述代码将生成以下输出：


    John has 25 messages.


    Message capacity remaining is 75.


    注意，插值字符串字面量只能赋值给变量。尝试将插值字符串赋值给常量将导致编译器错误。


    ## 7.13 类型转换 (Type casting)


    C# 代码与许多类型工作，包括由语言提供的类型以及许多由你自己创建的类型。本章解释了类型之间如何相互关联，同时探索了隐式和显式类型转换的概念，并获取对象的类型。


    如前所述，C# 是一种强类型语言，这意味着一旦变量被声明为特定类型，随后无法更改为不同的类型。这也限制了可以赋值给变量的值类型。例如，无法将字符串值赋值给
    `int` 变量。


    然而，在某些情况下，将一种类型的值赋值给另一种类型的变量是可能的。这涉及隐式转换和显式转换的使用。


    ### 7.13.1 隐式转换 (Implicit casting)


    在不丢失数据的情况下安全操作的情况下，C# 允许你仅通过使用赋值运算符将一种类型的变量值赋值给另一种。例如，由于 `long` 变量完全能够存储 `int`
    变量可以存储的任何值，因此如下赋值是完全有效的：


    ```csharp

    int myInteger = 20;


    long myLong;


    myLong = myInteger;

    ```


    这种技术被称为隐式转换，因为从 `int` 到 `long` 的转换是由值类型暗示的，而不是在代码中显式声明的。


    然而，隐式转换是有限制的。例如，无法隐式转换将 `long` 赋值给 `int`，因为 `long` 可以存储的数字比 `int` 大得多（`int` 长度为
    4 字节，而 `long` 为 8 字节）。尝试将 `long` 挤入 `int` 变量将不可避免地导致数据丢失。由于此原因，C# 编译器会将此类尝试标记为错误，代码将无法编译，如下所示：


    ```csharp

    long myLong = 1381292100921;


    int myInteger;


    myInteger = myLong;

    ```


    当编译器遇到上述代码时，它将声明以下语法错误：


    Cannot implicitly convert type ''long'' to ''int''. ( (你是否缺少了转换?)


    如错误消息所示，可以使用显式转换执行此操作。


    ### 7.13.2 显式转换 (Explicit casting)


    虽然编译器可能会阻止隐式转换，但你作为程序员，可能知道尽管变量是 `long` 类型，但它永远不会包含大于 `int` 变量可以存储的值。在这种情况下，你可能正当想要将存储在
    `long` 变量中的值赋值给 `int` 变量。这可以通过使用显式转换将 `long` 值转换为 `int` 来实现。


    显式转换通过将你想要转换的变量类型放在括号 `()` 中并放在要转换变量名称之前来实现。例如，下面的代码在赋值操作期间将 `long` 值转换为 `int`：


    ```csharp

    long myLong = 138129210;


    int myInteger;


    myInteger = (int) myLong;

    ```


    在使用显式转换时应小心。如果转换的值超过了目标变量的容量，值将会改变且没有警告。例如，考虑上述示例的修改：


    ```csharp

    long myLong = 1381292100921;


    int myInteger;


    myInteger = (int) myLong;


    Console.WriteLine($"myLong = {myLong}");


    Console.WriteLine($"myInteger = {myInteger}");

    ```


    上述代码的输出显示 myInt 的值不再匹配 myLong：


    myLong = 1381292100921


    myInteger = 690256740


    这种错误在复杂的项目中可能难以定位。同样，将浮点值赋值给存储整数的变量将导致原始值的小数部分丢失。


    注意，转换仅适用于数值数据类型。因此，无法对字符串、bool 或 char 数据类型执行转换。


    ### 7.13.3 识别变量类型


    在 C# 中通过调用变量的 `GetType()` 方法也可以识别变量的类型。例如，下面的代码输出了 `myVar1` 和 `myVar2` 变量的类型：


    ```csharp

    string myVar1 = "Hello";


    double myVar2 = 123123.12;


    Console.WriteLine(myVar1.GetType());


    Console.WriteLine(myVar2.GetType());

    ```


    当代码执行时，上述字符串字面量将如下：


    System.String


    System.Double


