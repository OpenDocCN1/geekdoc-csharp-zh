    通用语言体系 (`CLI`) 为执行 C# 代码提供了一个标准化的环境。它包含了通用中间语言 (`CIL`)、虚拟执行系统 (`VES`)、通用类型系统 (`CTS`)
    以及通用语言规范 (`CLS`)。`CLI` 能够实现不同编程语言之间的互操作性，并为执行 `CIL` 代码提供了基础类库。


    此外，.NET Framework 类库提供了大量预定义的函数和类，用于创建多样化的应用程序，并包含了用于文件 I/O、网络、数据库访问和用户界面设计的 API。


    # 4. 安装 Visual Studio Code、C# 和 .NET 9


    要开始使用 C# 编程，我们需要一个环境来编写、编辑、编译和运行代码。有许多选择，但对于本书来说，我们需要一个免费使用且对所有读者都提供的解决方案，无论他们是在
    macOS、Windows 还是 Linux 系统上学习 C#。一个流行的工具，也是我们将在本章中安装的工具，是 Visual Studio Code。Visual
    Studio Code 由微软开发，是一个功能丰富、直观的代码编辑环境，与 `C# Dev Kit` 扩展结合时，可以提供学习 C# 所需的一切内容。


    ## 4.1 安装 .NET 9 SDK


    除了安装 Visual Studio Code 之外，在编译 C# 程序之前，还需要安装 .NET 9 SDK。虽然安装 .NET 有多种方法，但我们将使用一种独立于
    Visual Studio Code 下载并安装 SDK 的技术。


    .NET 9 SDK 的安装步骤取决于你所使用的操作系统，下文所示。


    ### 4.1.1 在 Windows 上安装 .NET 9


    .NET 9 SDK 适用于运行 x86、x64 和 Arm64 处理器架构的 Windows 系统。使用以下链接下载与你的系统匹配的最新 .NET 9 `Installer`
    包：


    [`dotnet.microsoft.com/en-us/download/dotnet/9.0`](https://dotnet.microsoft.com/en-us/download/dotnet/9.0)


    下载安装程序后，启动并按照设置向导完成安装：


    ![img](img/dotnet_installer_windows.png)


    图 4-1


    ### 4.1.2 在 macOS 上安装 .NET 9


    macOS 版本的 .NET 9 SDK 适用于 Intel 和 Apple Silicon 系统。要开始安装，请打开浏览器窗口，导航到以下 URL，并下载与你的处理器架构匹配的
    `Installer`：


    [`dotnet.microsoft.com/en-us/download/dotnet/9.0`](https://dotnet.microsoft.com/en-us/download/dotnet/9.0)


    下载安装程序包后，启动它并按照步骤完成安装：


    ![img](img/dotnet_installer_macos.png)


    图 4-2


    ### 4.1.3 在基于 Red Hat Linux 的发行版上安装 .NET 9


    在源自 Red Hat Enterprise Linux 的 Linux 发行版上安装 .NET 9 SDK 的方法取决于你阅读此内容的时间。在编写时，.Net
    9 仍处于发行候选（release candidate）阶段。当你读到这里时，.NET 9 可能已经正式发布。要确认这一点，请打开 `Terminal` 窗口并运行以下命令：


    ```bash

    sudo dnf install dotnet-sdk-9.0

    ```


    如果安装请求报告没有 `dotnet-sdk-9.0` 的匹配项，请跳到下方的“从 Linux 二进制文件安装 .Net 9”部分进行安装。否则，按 ‘y’
    完成安装。


    ### 4.1.4 在 Debian/Ubuntu 发行版上安装 .NET 9


    Debian 和 Ubuntu 系统的安装步骤再次取决于 .NET 9 SDK 的发布状态。首先在 `Terminal` 窗口中运行以下常用命令：


    ```bash

    sudo apt-get install dotnet-sdk-9.0

    ```


    如果安装请求报告找不到 `dotnet-sdk-9.0` 包，请跳到下一节进行安装。否则，按 ‘y’ 完成安装。


    ### 4.1.5 从 Linux 二进制文件安装 .Net 9


    如果 .NET 9 尚未正式发布，则需要使用发行候选 SDK 二进制文件进行安装。返回 .NET 9 下载页面，找到并下载如图 4-3 所示与你 CPU 匹配的二进制文件：


    ![img](img/dotnet_linux_binaries.png)


    图 4-3


    在 `Terminal` 窗口中，创建一个你想要安装 .NET 9 的目录。接下来，运行以下命令（假设你选择了 `$HOME/dotnet9` 作为你的安装目录）：


    ```bash

    cd $HOME/dotnet9

    tar xvfz <path to downloaded binary archive>

    ```


    解压 .NET 包后，修改你的 `$HOME/.bashrc` 文件以导出 `DOTNET_ROOT` 环境变量并将 .NET 9 SDK 添加到你的路径中：


    ```bash

    export DOTNET_ROOT=$HOME/dotnet9

    export PATH=$PATH:$HOME/dotnet9

    ```


    打开一个新的 `Terminal` 窗口并运行以下命令验证安装情况：


    ```bash

    dotnet --version

    9.0.100-rc.1.24452.12

    ```


    ## 4.2 下载 Visual Studio Code


    安装 Visual Studio Code 的第一步是下载它。Windows、macOS 和 Linux 的下载可以通过以下网页获取：


    [`code.visualstudio.com/download`](https://code.visualstudio.com/download)


    ## 4.3 在 Windows 上安装 Visual Studio Code


    Windows 版 Visual Studio Code 适用于 Arm 和 Intel 系统。下载安装程序后，启动它并按照设置向导完成安装。除非你有特殊需求，否则可以使用默认设置。


    ## 4.4 在 macOS 上安装 Visual Studio Code


    macOS 版 Visual Studio Code 适用于 Apple Silicon 和 Intel 系统，以 ZIP 存档的形式提供。下载文件后，双击解压
    Code 包，然后打开 `Finder` 窗口将其拖入 `Applications` 文件夹。为了方便，可以将 Visual Studio Code 如下图
    4-4](#Installing_Visual_Code.xhtml__idTextAnchor041) 所示添加到 Dock：


    ![img](img/vs_code_add_dock.png)


    图 4-4


    ## 4.5 在 Linux 上安装


    VS Code 安装包适用于多种 Linux 发行版，包括 Debian、Ubuntu、SUSE 以及大多数基于 Red Hat 的平台，支持 x64、Arm32
    和 Arm64 处理器架构。


    安装 VS Code 的步骤取决于你运行发行版，下文所示：


    ### 4.5.1 Debian/Ubuntu


    Debian 和 Ubuntu 版 Code 以 `.deb` 包的形式提供。要完成安装，打开 `Terminal` 窗口，进入下载包所在的目录，并运行以下命令（其中
    `<filename>.deb` 为包名）：


    ```bash

    sudo dpkg -i <filename>.deb

    ```


    ### 4.5.2 Red Hat 系发行版


    VS Code 在包括 RHEL、CentOS、Fedora、AlmaLinux 和 Rocky Linux 在 Red Hat 系系统中使用 Red Hat
    包管理器 (`.rpm`) 文件。要安装 VS Code，打开终端窗口，进入下载包所在的目录，并运行以下命令（其中 `<filename>.rpm` 为包名）：


    ```bash

    sudo rpm -ihv <filename>.rpm

    ```


    安装完成后，可以通过桌面环境搜索应用程序，或者通过命令行运行 `code` 可执行文件来启动 Visual Studio Code。


    ## 4.6 添加 C# Dev Kit 扩展


