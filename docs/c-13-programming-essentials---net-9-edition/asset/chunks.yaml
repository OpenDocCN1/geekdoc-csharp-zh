    \n```csharp\nbool result;\nint x = 10;\nint y = 20;\nresult = x < y;\n```\n\n\
    显然，10 小于 20，导致 `x < y` 表达式的求值结果为真。下表列出了 C# 比较运算符的完整集合：\n\n| 运算符 | 说明 |\n| ---\
    \ | --- |\n| `x == y` | 如果 x 等于 y，则返回 true |\n| `x > y` | 如果 x 大于 y，则返回 true |\n\
    | `x >= y` | 如果 x 大于或等于 y，则返回 true |\n| `x < y` | 如果 x 小于 y，则返回 true |\n| `x <=\
    \ y` | 如果 x 小于或等于 y，则返回 true |\n| `x != y` | 如果 x 不等于 y，则返回 true |\n\n表 8-4\n\n\
    ## 8.8 布尔逻辑运算符\n\n另一组返回布尔真和假值的运算符是 C# 布尔逻辑运算符。这些运算符既返回布尔结果，又接受布尔值作为操作数。关键的运算符有\
    \ NOT (`!`)、AND (`&&`)、OR (`||`) 和 XOR (`^`)。\n\nNOT (`!`) 运算符反转布尔变量的当前值或表达式的结果。例如，如果一个名为\
    \ `flag` 的变量当前为真，则在变量前加一个 `!` 字符将把该值反转为假：\n\n```csharp\nbool flag = true; //变量为真\n\
    bool secondFlag;\nsecondFlag = !flag; // secondFlag 设置为假\n```\n\nOR (`||`) 运算符如果其两个操作数中的一个求值为真，则返回真。否则，返回假。例如，以下代码的求值为真，因为\
    \ OR 运算符两边的表达式中至少有一个为真：\n\n```csharp\nif ((10 < 20) || (20 < 10))\n    Console.WriteLine(\"\
    Expression is true\");\n```\n\n输出：\nExpression is true\n\nAND (`&&`) 运算符只有当两个操作数都求值为真时才返回真。接下去的示例将返回假，因为两个操作数表达式中只有一个求值为真：\n\
    \n```csharp\nint x = 10;\nint y = 20;\n\nif ((x < 20) && (y < 10))\n    Console.WriteLine(\"\
    Expression is true\");\nelse\n    Console.WriteLine(\"Expression is false\");\n\
    ```\n\n输出：\nExpression is false\n\nXOR (`^`) 运算符如果两个操作数中的一个（且仅一个）求值为真，则返回真。例如，接过的示例将返回真，因为只有一个运算符求值为真：\n\
    \n```csharp\nint x = 10;\nint y = 20;\n\nif ((x < 20) ^ (y < 10))\n    Console.WriteLine(\"\
    Expression is true\");\nelse\n    Console.WriteLine(\"Expression is false\");\n\
    ```\n\n输出：\nExpression is true\n\n如果两个操作数都求值为真或都为假，则表达式将返回假。\n\n## 8.9 范围和索引运算符\n\
    \nC# 范围 (`..`) 和索引索引 (`^`) 运算符允许你声明值范围，这在处理数组等集合时非常有价值。标题为 “访问和排序 C# 数组元素` 的章节将涵盖这两个运算符。\n\
    \n## 8.10 三元运算符\n\nC# 三元运算符提供了一种做出决策的快捷方法。三元运算符的语法如下：\n\n`[condition] ? [true\
    \ expression] : [false expression]`\n\n其工作原理是 `[condition]` 被替换为一个返回真或假的表达式。如果结果结果为真，则求值替换\
    \ `[true expression]` 的表达式。相反，如果结果为假，则求值 `[false expression]`。让我们来看实际操作：\n\n```csharp\n\
    int x = 10;\nint y = 20;\nConsole.WriteLine( x > y ? x : y );\n```\n\n输出：\n20\n\
    \n上面的真表达式和假表达式简单地输出最大值。在实践中，它可以是任何有效表达式。例如，下面的修改为每个结果指定了要显示的字符串值：\n\n```csharp\n\
    int x = 10;\nint y = 20;\nConsole.WriteLine(x > y ? \"x is larger\" : \"y is larger\"\
    );\n```\n\n输出：\ny is larger\n\n## 8.11 空合并运算符\n\n空合并运算符 (`??`) 允许在操作数具有 null 值时使用默认值。使用此运算符的语法如下：\n\
    \n`<operand> ?? <default operand>`\n\n如果左侧操作数不为 null，则返回操作数的值；否则，表达式返回默认操作数的值。\n\
    \n接下去的示例将输出读取“Welcome back”的文本，因为操作数为 null 值：\n\n```csharp\nstring customerName\
    \ = null;\nstring recipient = customerName ?? \"Customer\";\nConsole.WriteLine($\"\
    Welcome back, {recipient}\");\n```\n\n输出：\nWelcome back, Customer\n\nC# 还包含空合并赋值运算符\
    \ (`??=`），其语法如下：\n\n`<operand1> ??= <operand2>`\n\n如果左侧操作数不为 null，则返回操作数的值；否则，表达式返回默认值。\n\
    \n```csharp\nstring customerName = null;\ncustomerName ??= \"Customer\";\n// customerName\
    \ 现在是 Customer\n```\n\n## 8.12 位运算符\n\n如前所述，处理器以二进制方式工作。这些本质上是 1 和 0 的流。因此，我们偶尔处于这一层。我们作为程序员在这个领域发现新新意。其他作者对该主题的描述比我们好得多。出于练习目的，我们将使用\
    \ 8 位值。首先，十进制数字 171 用二进制表示为：\n\n10101011\n\n其次，数字 3 用二进制序列表示：\n\n00000011\n\n\
    现在我们有了两个二进制数字，可以开始查看：\n\n### 8.12.1 位非\n\n位非用波浪号 (`~`) 字符表示，其效果是反转数字中的所有位。换句话说，所有的\
    \ 0 变成 1，所有的 1 变成 0。以我们的示例数字 3 为，位非操作的结果如下：\n\n00000011 NOT\n========\n11111100\n\
    \n因此，以下 C# 代码的结果为 -4：\n\n```csharp\nint y = 3;\nint z = ~y;\nConsole.WriteLine($\"\
    Result is {z}\");\n```\n\n### 8.12.2 位与\n\n位与用单个符号 (`&`) 表示。它对两个数字进行按位比较。两个数字的二进制序列中任何对应的位置如果都是\
    \ 1，则会在结果数字的相同位置产生一个 1。如果任何一个位包含 0，则结果中会出现 0。以我们的两个示例数字为例，将如下所示：\n\n10101011 AND\n\
    00000011\n========\n00000011\n\n我们可以看到，两个数字都有 1 的位置只有最后两个。如果我们在 C# 代码中执行此操作，那么我们应该发现结果是\
    \ 3 (00000011)：\n\n```csharp\nint x = 171;\nint y = 3;\nint z = x & y;\nConsole.WriteLine($\"\
    Result is {z}\");\n```\n\n"
- fmt: "\nThe bitwise OR also performs a bit by bit comparison of two binary sequences.\
    \ Unlike the AND operation, the OR places a 1 in the result if there is a 1 in\
    \ the first or second operand. The operator is represented by a single vertical\
    \ bar character (`|`). Using our example numbers, the result will be as follows:\n\
    \n```text\n10101011 OR\n00000011\n========\n10101011\n```\n\nIf we perform this\
    \ operation in a C# example the result will be 171:\n\n```csharp\nint x = 171;\n\
    int y = 3;\nint z = x | y;\nConsole.WriteLine($\"Result is {z}\");\n```\n\n###\
    \ 8.12.4 Bitwise XOR\n\nThe bitwise XOR (commonly referred to as exclusive OR\
    \ and represented by the caret `^` character) performs a similar task to the OR\
    \ operation except that a 1 is placed in the result if one or other corresponding\
    \ bit positions in the two numbers is 1. If both positions are a 1 or a 0 then\
    \ the corresponding bit in the result is set to a 0. For example:\n\n```text\n\
    10101011 XOR\n00000011\n========\n10101000\n```\n\nThe result in this case is\
    \ 10101000 which converts to 168 in decimal. To verify this we can, once again,\
    \ try some C# code:\n\n```csharp\nint x = 171;\nint y = 3;\nint z = x ^ y;\nConsole.WriteLine($\"\
    Result is {z}\");\n```\n\n### 8.12.5 Bitwise Left Shift\n\nThe bitwise left shift\
    \ moves each bit in a binary number a specified number of positions to the left.\
    \ Shifting an integer one position to the left has the effect of doubling the\
    \ value.\n\nAs the bits are shifted to the left, zeros are placed in the vacated\
    \ right most (low order) positions. Note also that once the left most (high order)\
    \ bits are shifted beyond the size of the variable containing the value, those\
    \ high order bits are discarded:\n\n```text\n10101011 Left Shift one bit\n========\n\
    101010110\n```\n\nIn C# the bitwise left shift operator is represented by the\
    \ `<<` sequence, followed by the number of bit positions to be shifted. For example,\
    \ to shift left by 1 bit:\n\n```csharp\nint x = 171;\nint z = x << 1;\nConsole.WriteLine($\"\
    Result is {z}\");\n```\n\nWhen compiled and executed, the above code will display\
    \ a message stating that the result is 342 which, when converted to binary, equates\
    \ to 101010110.\n\n### 8.12.6 Bitwise Right Shift\n\nA bitwise right shift is,\
    \ as you might expect, the same as a left except that the shift takes place in\
    \ the opposite direction. Shifting an integer one position to the right has the\
    \ effect of halving the value.\n\nNote that since we are shifting to the right\
    \ there is no opportunity to retain the lower most bits regardless of the data\
    \ type used to contain the result. As a result, the low order bits are discarded.\
    \ Whether or not the vacated high order bit positions are replaced with zeros\
    \ or ones depends on whether the sign bit used to indicate positive and negative\
    \ numbers is set or not.\n\n```text\n10101011 Right Shift one bit\n========\n\
    01010101\n```\n\nThe bitwise right shift is represented by the `>>` character\
    \ sequence followed by the shift count:\n\n```csharp\nint x = 171;\nint z = x\
    \ >> 1;\nConsole.WriteLine($\"Result is {z}\");\n```\n\nWhen executed, the above\
    \ code will report the result of the shift as being 85, which equates to binary\
    \ 01010101.\n\n### 8.13 Compound Bitwise Operators\n\nAs with the arithmetic operators,\
    \ each bitwise operator has a corresponding compound operator that allows the\
    \ operation and assignment to be performed using a single operator:\n\n| Operator\
    \ | Description |\n| :--- | :--- |\n| `x &= y` | Perform a bitwise AND of x and\
    \ y and assign result to x |\n| `x |= y` | Perform a bitwise OR of x and y and\
    \ assign result to x |\n| `x ^= y` | Perform a bitwise XOR of x and y and assign\
    \ result to x |\n| `x <<= n` | Shift x left by n places and assign result to x\
    \ |\n| `x >>= n` | Shift x right by n places and assign result to x |\n\nTable\
    \ 8-5\n\n### 8.14 Take the knowledge test\n\nClick the link below or scan the\
    \ QR code to test your knowledge and understanding of C# operators and expressions:\n\
    \n[https://www.answertopia.com/qo99](https://www.answertopia.com/qo99)\n\n![img](image/c_-operators.png)\
    \ \n\n### 8.15 Summary\n\nIn C# programming, operators and expressions manipulate\
    \ and evaluate variables and constants. This can be as simple as adding two numbers\
    \ using the addition operator in an expression and storing the result in a variable\
    \ or as complex as performing bitwise operations. There are several categories\
    \ of operators, each of which we have covered in this chapter.\n\n# 9. C# Conditional\
    \ Control Flow\n\nThe cornerstone of any software code is the control flow logic,\
    \ which decides which code should be executed and which should not. This chapter\
    \ covers the conditional control flow constructs provided by C#.\n\n## 9.1 Looping\
    \ vs. conditional control flow\n\nRegardless of the programming language used,\
    \ application development involves applying logic. Much of the art of programming\
    \ involves writing code that makes decisions based on one or more criteria. Such\
    \ decisions define which code gets executed, how often, and which code gets bypassed\
    \ when the program runs. This is often called control flow since it controls control\
    \ flow.\n\n## 9.2 Using the if statement\n\nThe if statement is the most basic\
    \ of control flow options available to C#. The basic syntax of the if statement\
    \ is as follows:\n\n```csharp\nif (boolean expression) {\n    // C# code to be\
    \ performed when the expression evaluates to true\n}\n```\n\n## 9.3 Using if …\
    \ else … statements\n\nThe next variation of the if statement allows us to specify\
    \ some code to execute if the expression in the if statement is evaluated as false\
    \ using the following syntax:\n\n```csharp\nif (boolean expression) {\n    //\
    \ Code to be executed if the expression is true\n} else {\n    // Code to be executed\
    \ if the expression is false\n}\n```\n\n## 9.4 Using if … else if … statements\n\
    \nSo far, we have looked at if statements that make decisions based on the result\
    \ of a single logical expression. Sometimes, it becomes necessary to make decisions\
    \ based on several different criteria. For this purpose, we can use the if … else\
    \ if … construct, the syntax for which is as follows:\n\n```csharp\nif (boolean\
    \ expression) {\n```\n"
