    Console.WriteLine($\"{demo.name} is {demo.age} is years old.\");\n```\n\n当上述代码运行时，将没有\
    \ `name` 的值，且 `age` 将为 0，尽管在创建类实例时 `age` 被设置为 37。此外，编译器将发出如下所示的警告：\n\n`warning\
    \ CS1717: Assignment made to same variable; did you mean to assign something else?`\n\
    \n这里的问题在于，编译器不知道在下面的初始化代码中引用了哪个 `name` 和 `age` 变量：\n\n```csharp\npublic DemoClass(string\
    \ name, int age) {\n    name = name;\n    age = age;\n}\n```\n\n为了解决这个问题，我们需要一种方法告诉编译器方法参数值要赋值给对应的公共字段值。我们可以使用\
    \ `this` 关键字来实现。在此上下文中，`this` 关键字代表当前类实例。为了区分冲突的 `name` 和 `age` 变量，我们需要如下使用 `this`\
    \ 关键字：\n\n```csharp\npublic DemoClass(string name, int age) {\n    this. name\
    \ = name;\n    this. age = age;\n}\n```\n\n现在我们不仅不再看到编译器的警告信息，还能看到 Mark 的名字和正确的年龄。\n\
    \n### 13.17 知识测试\n\n点击下方链接或扫描二维码以测试你对 C# 面对象编程的知识和理解：\n\n[`www.answertopia.com/cnbw`](https://www.answertopia.com/cnbw)\n\
    \n![img](img/c_-oop.png)\n\n### 13.18 总结\n\n像 C# 这样的面向对象的语言促进类的创建以鼓励代码复用和数据封装。在本章中，我们涵盖了\
    \ C# 类和实例的基础概念，并解释了类成员、构造函数、终结器、属性、字段和方法等概念。\n\n# 14. C# 方法\n\n上一章开始介绍 C# 中的面向对象编程，并包含了在类内部声明的方法的使用。本章将更详细地探索\
    \ C# 方法，包括它们如何声明和调用、传递参数以及返回结果。还将解释按引用传递和按值传递参数的主题。\n\nC# 方法对于编写结构良好且高效的代码至关重要。它们提供了一种组织程序的方法，同时避免了代码重复。在本章，我们将研究在\
    \ C# 中如何声明和使用方法。\n\n### 14.1 什么是方法？\n\n方法是一个命名的代码块，可以被调用以执行特定任务。它可以接收用于执行任务的数据，并将结果返回给调用它的代码。例如，如果\
    \ C# 程序中需要执行某个特定的算术计算，可以将执行该算术计算的代码放在方法中。该方法可以设计为接受执行算术计算的值（称为参数）并返回结果。\n\n###\
    \ 14.2 方法与函数\n\n如果你熟悉其他编程语言，你可能听过或使用过函数。通常，函数的声明方式与方法相同，并实现相同的功能。区别在于方法必须在类内部声明，而函数在类外部声明。在\
    \ C# 中，只能在类内部声明方法，函数的概念不存在。\n\n### 14.3 参数还是实参？\n\n在讨论方法时，参数（parameter）和实参（argument）这两个术语经常通用。然而，它们存在细微的区别。方法在被调用时可以接收的值是参数。当方法被调用并传递这些值时，它们被称为实参。\n\
    \n### 14.4 如何声明 C# 函数\n\nC# 函数使用以下语法声明：\n\n```csharp\n<access> <return type> <method\
    \ name>(<para type> <para name>, ...){\n    // 方法代码\n}\n```\n\n函数声明各个字段的解释如下：\n\
    \n- `<access>`：定义了从代码其他部分对该的访问级别。有效值为上一章中解释过的 `public`、`private` 或 `protected`。\n\
    - `<return type>`：函数返回的结果的数据类型。如果函数不返回结果，则设置为 `void`。\n- `<method name>`：分配给方法的名称。这是在应用程序代码内部调用方法时引用该方法的名称。\n\
    - `<para type>`：对应参数的类型。\n- `<para name>`：在方法代码中引用参数的名称。\n- `Method code`：执行工作的方法语句。\n\
    \n例如，下面的方法没有参数，不返回结果，并显示一条消息：\n\n```csharp\npublic void sayHello() {\n    Console.WriteLine(\"\
    Hello\");\n}\n```\n\n另一方面，下面的示例函数接受一个 `int` 和一个 `string` 作为参数，并返回一个 `string` 结果：\n\
    \n```csharp\npublic string BuildMessage(string name, int count) {\n    return($\"\
    {name}, you are customer number {count}\");\n}\n```\n\n### 14.5 创建 MethodDemo\
    \ 项目\n\n"
- fmt: "\nLaunch VS Code, open your “C# Essentials” workspace folder and create a\
    \ new .NET Console App project named `MethodDemo`.\n\n## 14.6 Declaring a C# class\
    \ file\n\nFollowing the steps in the [“An Introduction to C# Object-Oriented Programming”](#Object_Orientated_Programming.xhtml__idTextAnchor159)\
    \ chapter, use the Solutions Explorer to add a new class file named `Demo` to\
    \ the `MethodDemo` project. Once you have added the class file, modify it as follows\
    \ to add a method:\n\n```csharp\nusing System;\n\nnamespace MethodDemo;\n\npublic\
    \ class Demo\n{\n    public void SayHello()\n    {\n        Console.WriteLine(\"\
    Hello\");\n    }\n}\n```\n\n## 14.7 Calling a C# method\n\nOnce declared, C# methods\
    \ are called on class instances using dot notation using the following syntax:\n\
    \n`<instance>.<function name>(<arg1>, <arg2>, ... )`\n\nEach argument passed through\
    \ to a method must match the parameters the method is configured to accept. For\
    \ example, to call the above example method named `SayHello()`, which takes no\
    \ parameters and returns no value, we need to modify the `Program.cs` file as\
    \ follows:\n\n```csharp\nusing MethodDemo;\n\nDemo demo = new();\n\ndemo.SayHello();\n\
    ```\n\nWhen the app runs, the “Hello” message will appear in the terminal.\n\n\
    ## 14.8 Handling return values\n\nThe `SayHello()` method definition included\
    \ the `void` keyword to indicate that it did not return a result value. Next,\
    \ add a method named `BuildMessage()` to the `Demo` class which accepts two parameters\
    \ and returns a string result as follows:\n\n```csharp\npublic class Demo\n{\n\
    \    public void SayHello()\n    {\n        Console.WriteLine(\"Hello\");\n  \
    \  }\n\n    public string BuildMessage(string name, int count)\n    {\n      \
    \  return ($\"Hello {name}, you are visitor number {count}.\");\n    }\n}\n```\n\
    \nIn the above code, we placed parentheses around the return value as follows:\n\
    \n`return ($\"Hello {name}, you are visitor number { count}\");`\n\nThese parentheses\
    \ are optional, so the following is also a valid use of the return statement:\n\
    \n`return $\"Hello {name}, you are visitor number {count}.\";`\n\nReturn to the\
    \ `Program.cs` file and add code to call the new method:\n\n```csharp\nDemo demo\
    \ = new();\n\nstring message = demo.BuildMessage(\"Bill\", 10);\n\nConsole.WriteLine(message);\n\
    ```\n\nIn the above example, we created a new variable named `message` and used\
    \ the assignment operator (`=`) to store the method’s result before writing it\
    \ to the console. When the app runs, the following output should appear in the\
    \ terminal:\n\n`Hello Bill, you are visitor number 10\\.`\n\n## 14.9 Passing arguments\
    \ to a method\n\nSeveral options are available when calling a method that is expecting\
    \ arguments. One option, as demonstrated above, is to pass the arguments in the\
    \ order in which they are declared in the method declaration:\n\n`string message\
    \ = demo.BuildMessage(\"Bill Gates\", 10);`\n\nWhen calling a method in this way,\
    \ the arguments must be passed in the order in which the parameters are declared\
    \ in the method. Passing arguments to a method using this technique can also make\
    \ it difficult to understand the purpose of each argument. Both of these issues\
    \ can be resolved using named arguments.\n\n### 14.9.1 Named arguments\n\nUsing\
    \ named arguments involves referencing the parameter names assigned in the method\
    \ declaration when making calls. For example:\n\n`demo.BuildMessage(name: \"Steve\"\
    , count: 30);`\n\nSince ordering is not important when using named arguments,\
    \ the following is also a valid call:\n\n`demo.BuildMessage(count: 30, name: \"\
    Steve\");`\n\nMake the following changes to the `Program.cs` file to see named\
    \ arguments in action:\n\n```csharp\nDemo demo = new();\n\nstring message = demo.BuildMessage(name:\
    \ \"Bill\", count: 10);\n\nConsole.WriteLine(message);\n\nmessage = demo.BuildMessage(count:\
    \ 30, name: \"Steve\");\n\nConsole.WriteLine(message);\n```\n\nAs demonstrated\
    \ in the code above, the ordering of the arguments no longer matters when making\
    \ the method call. It is also easier to understand the purpose of each argument\
    \ being passed to the method.\n\n### 14.9.2 Optional arguments\n\nC# arguments\
    \ can be made optional by designating a default parameter value to be used if\
    \ the value is not provided as an argument when the method is called. This involves\
    \ assigning the default value to the parameter when the method is declared. When\
    \ working with optional arguments, the only requirement is to place the optional\
    \ parameters after any mandatory parameters in the method declaration.\n\nModify\
    \ the `BuildMessage()` method as follows so that the string “Customer” is used\
    \ as the default if a customer name is not provided when the method is called:\n\
    \n```csharp\npublic class Demo\n{\n    public void SayHello()\n    {\n       \
    \ Console.WriteLine(\"Hello\");\n    }\n\n    public string BuildMessage( int\
    \ count, string name = \"Customer\" )\n    {\n        return $\"Hello {name},\
    \ you are visitor number {count}.\";\n    }\n}\n```\n\nAfter making the change\
    \ to the method, try calling it without a name argument:\n\n```csharp\nDemo demo\
    \ = new();\n\nstring message = demo.BuildMessage( count: 10 );\n\nConsole.WriteLine(message);\n\
    ```\n\nWhen the app runs, the following output will appear with “Customer” substituted\
    \ for the name:\n\n`Hello Customer, you are visitor number 10\\.`\n\n## 14.10\
    \ Handling variable numbers of arguments\n\nSo far we have looked at method examples\
    \ that accept a fixed number of arguments when called. C# also provides a way\
    \ to configure a method to accept a variable number of arguments. This involves\
    \ placing the arguments in a `List` collection and handling it using the `params`\
    \ keyword. The C# `List` class allows multiple items to be grouped within a single\
    \ object and will be covered in the [“C# List Collections”](#List_Collections.xhtml__idTextAnchor335)\
    \ chapter. Suppose that we need a method that will accept an unspecified number\
    \ of string arguments. Using the `params` keyword, we could declare the method\
    \ as follows:\n\n```csharp\npublic void GreetGuests( params List<string> guests)\n\
    {\n    foreach (var guest in guests) {\n        Console.WriteLine($\"Welcome,\
    \ {guest}\");\n    }\n}\n```\n\nWhen we call the `GreetGuests()` method, we can\
    \ pass it `List` instance containing any number of guest names without making\
    \ changes to the `GreetGuests()` method:\n\n```csharp\nList<string> names = [\"\
    John\", \"Paul\", \"George\"];\ndemo.GreetGuests(names);\n\nnames = [\"Mark\"\
    , \"Robert\"];\ndemo.GreetGuests(names);\n```\n\nA `params` parameter can be combined\
    \ with other method parameters, for example:\n\n```csharp\npublic void GreetGuests(\
    \ int groupId, params List<string> guests)\n{\n    .\n}\n```\n\nA method can accept\
    \ only one `params` argument, which must be positioned at the end of the parameter\
    \ list.\n\n## 14.11 C# in, out, and ref parameter modifiers\n\nWhen an argument\
    \ is passed to a method, it is passed as a value . Suppose the code contains an\
    \ `int` variable named `myVar`, to which the value 10 is assigned. The `myVar`\
    \ variable is then passed to a method named `DoSomething()`. In this scenario,\
    \ only a copy of the value 10 is passed to the method with no connection to the\
    \ original `myVar` variable. Consequently, any changes to the value from within\
    \ the method will not be reflected in the original variable.\n\nAdd the following\
    \ method to the `Demo` class to demonstrate this effect in action:\n\n```csharp\n\
    public class Demo\n{\n    .\n    public void DoSomething(int myVar) {\n      \
    \  myVar = 10;\n    }\n}\n```\n\nNext, modify the `Program.cs` file as follows:\n\
    \n```csharp\nint myVar = 20;\nDemo demo = new();\nConsole.WriteLine($\"Before\
    \ method call myVar = {myVar}\");\n\ndemo.DoSomething(myVar);\n\nConsole.WriteLine($\"\
    After method call myVar = {myVar}\");\n```\n\nThe code above declares a variable\
    \ and assigns it a value of 20\\. Before calling the method, the current value\
    \ of `myVar` is displayed. The variable is then passed as an argument to the `DoSomething()`\
    \ method, where it is assigned a value of 10\\. When the `DoSomething()` method\
    \ returns, the value assigned to the `myVar` variable is output again.\n\nRun\
    \ the app and verify the value assigned to the `myVar` variable was not changed\
    \ by the `DoSomething()` method:\n\n`Before method call myVar = 20`\n`After method\
    \ call myVar = 20`\n\nTo allow the value assigned to the variable to be changed\
    \ within the method, we need to pass the variable by reference .\n"
