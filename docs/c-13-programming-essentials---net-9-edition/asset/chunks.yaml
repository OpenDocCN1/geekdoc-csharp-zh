    \ as shown below:\n\n![img](image/vs_code_sample_app_solution_explorer.png)\n\n\
    Figure 6-8\n\nVS Code also generated a file named Program.cs , where we will begin\
    \ writing code.\n\n6.3 Writing the app code\n\nThe Program.cs file represents\
    \ the entry point into the app code when it runs. In other words, when we compile\
    \ and run the app, the first lines of code to be executed will be those contained\
    \ in the Program.cs file. Select the file to load it into the editor, where it\
    \ will read as follows:\n\n// See https://aka.ms/new-console-template for more\
    \ information\n\nConsole.WriteLine(\"Hello, World!\");\n\nThe first line is a\
    \ comment informing us that the file uses the new console template. This template\
    \ is particularly significant, as we will see later in the chapter. For now, we\
    \ are more interested in the second line:\n\nConsole.WriteLine(\"Hello, World!\"\
    );\n\nThe above line of code uses the WriteLine() method of the built-in Console\
    \ class to display a message in the terminal window. To try out this code, click\
    \ the run button shown in [Figure 6-9](#Sample_App.xhtml__idTextAnchor076) :\n\
    \n![img](image/vs_code_run_button.png)\n\nFigure 6-9\n\nWhen the build process\
    \ begins, refer to the Terminal in the bottom panel where, in addition to the\
    \ diagnostic output, the “Hello, World!” output will appear:\n\n![img](image/sample_app_first_run.png)\n\
    \nFigure 6-10\n\nThe Terminal panel is a fully interactive environment. You can\
    \ run commands just as you would in a Command Prompt on Windows or a terminal\
    \ window on macOS or Linux.\n\nEdit the Program.cs file and add the following\
    \ lines:\n\nConsole.Write(\"Please enter your name: \");\n\nvar username = Console.ReadLine();\n\
    \nConsole.WriteLine($\"Hi {username}. Welcome to C#!\");\n\nThe call to the ReadLine()\
    \ method waits for keyboard input and assigns typed text to a variable called\
    \ username :\n\nHello, World!\n\nPlease enter your name: John Smith\n\nHi John\
    \ Smith, Welcome to C#!\n\n6.4 Top-level statements and the Main method\n\nThe\
    \ above example may be puzzling to those familiar with other programming languages\
    \ in that we could write lines and execute code without any surrounding code structure\
    \ or “instructions” to the compiler. Languages such as C# usually require additional\
    \ information, such as a class name and directives to import framework dependencies.\
    \ For example, our Program.cs file makes calls to methods belonging to the Console\
    \ class, which, in turn, belongs to the System namespace, but we did not need\
    \ to import that namespace into our code for it to run.\n\nAnother common requirement\
    \ is to specify which code is the starting point for execution. Many programming\
    \ languages have a special main function or method containing those initial lines\
    \ of code. So if other programming languages have these requirements, why doesn’t\
    \ C#?\n\nThe answer is that C# has these requirements, but VS Code automatically\
    \ generates these so-called top-level statements for us in the background. This\
    \ is what the new console template comment in the Program.cs file was referring\
    \ to. Although we only have four lines of code in our app, the actual code that\
    \ gets compiled will resemble the following:\n\nusing System;\n\nnamespace SampleApp\n\
    \n{\n\ninternal class Program\n\n{\n\nstatic void Main(string[] args)\n\n{\n\n\
    Console.Write(\"Please enter your name: \");\n\nvar username = Console.ReadLine();\n\
    \nConsole.WriteLine($\"Hi {username}. Welcome to C#!\");\n\n}\n\n}\n\n}\n\nThe\
    \ using directive in the above code tells the compiler to import the System namespace\
    \ because the code in the file depends on it. Next, the internal class is wrapped\
    \ in a namespace declaration called SampleApp. C# code contains classes, variables,\
    \ and methods, all of which are assigned names. Namespaces allow application code\
    \ to be organized so that the names in one workspace do not conflict with the\
    \ same names in other workspaces. Anything declared outside of a namespace is\
    \ part of the global namespace .\n\nWithin the SampleApp namespace, a Program\
    \ class is declared to contain the Main() method, which, in turn, contains the\
    \ app code."
