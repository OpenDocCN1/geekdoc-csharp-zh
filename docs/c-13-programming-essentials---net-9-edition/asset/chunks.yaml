    \n# 5.8 总结\n\n在本章中，我们学习了 VS Code 将项目组织为工作区，每个工作区包含一个或多个项目。用户界面包括活动栏、主侧边栏、解决方案管理器、编辑器和状态栏。大多数通用代码编辑之外的任务都可以通过命令面板（Command\
    \ Palette）完成。禅模式会隐藏干扰元素以户专注于编码，编辑器可以拆分以同时查看和编辑多个文件或同一文件的不同区域。\n\n# 6. 在 VS Code\
    \ 中创建一个 C# 应用\n\n本书的前几个章节解释了如何使用 Visual Studio Code 配置 C# 开发环境，并探索了该工具的主要功能。在进入稍微高级的话题之前，现在是验证一切是否已安装并运行良好的好机。实现这一点的最佳方法是创建一个\
    \ C# 应用并编译、运行它。本章将介绍如何使用 VS Code 创建 C# 控制台应用程序项目。\n\n## 6.1 创建 SampleApp 项目\n\n\
    首先，启动 VS Code 并显示命令面板（`Ctrl-Shift-P` 或 `Cmd-Shift-P`）。当面板出现时，找到并选择 `.NET: New\
    \ Project...` 选项。\n\n![img](img/vs_code_command_palette1.png)\n\n图 6-1\n\n此时，VS\
    \ Code 将要求我们选择项目类型。书中的所有项目都将基于控制台的应用，因此请选择图 6-2 中显示的 `Console App` 项目模板选项：\n\n\
    ![img](img/vs_code_command_palette_console_app.png)\n\n图 6-2\n\n一旦选择了项目模板，VS Code\
    \ 将显示文件浏览器对话框。你可能记得上一章提到，VS Code 项目存储在工作区文件夹中。由于这是我们在 VS Code 中创建的第一个项目，我们还需要一个工作区来包含它以及后续章节中创建的项目。在文件浏览器中，导航到文件系统上的合适位置，并创建一个名为“C#\
    \ Essentials”的新文件夹作为工作区。打开新文件夹以返回命令面板，将项目命名为 `SampleApp`，并按回车键：\n\n![img](img/vs_code_project_name.png)\n\
    \n图 6-3\n\n最后，命令面板将寻求确认你是否希望在指定的工作区文件夹中创建项目：\n\n![img](img/vs_code_create_project_confirmation.png)\n\
    \n图 6-4\n\n检查工作区路径，然后按回车键创建项目。\n\n## 6.2 检查 SampleApp 项目\n\n现在我们已经创建了第一个 C# 项目，可以使用资源管理器（Explorer）面板来查看\
    \ VS Code 为我们生成的文件和文件夹。如果资源管理器尚未可见，请使用图 6-5 中所示的操作栏按钮选择它：\n\n![img](img/vs_code_explorer_button.png)\n\
    \n图 6-5\n\n资源管理器列出了我们的“C# Essentials”工作区和 `SampleApp` 项目文件夹。工作区和项目文件夹名称左侧的箭头（在图\
    \ 6-6 中高亮）被称为展开箭头（disclosure arrows），用于显示和隐藏文件夹内容：\n\n![img](img/vs_code_disclosure_arrows.png)\n\
    \n图 6-6\n\n点击 `SampleApp` 文件夹旁边的展开箭头以查看项目包含的文件：\n\n![img](img/vs_code_sample_app_files.png)\n\
