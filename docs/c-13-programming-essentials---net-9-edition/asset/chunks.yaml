  trans: "\n\n`break` 语句的另一种替代方案是 `continue` 语句。假设 `switch` 语句是循环的一部分。在这种情况下，`continue`\
    \ 语句将导致执行立即返回到循环开头，跳过当前循环迭代中尚未执行的任何后续代码。\n\n在循环中使用 `continue` 语句的详细内容将在“使用 for\
    \ 语句进行 C# 循环”章节中介绍。\n\n## 10.8 知识测试\n\n点击下方链接或扫描二维码，以测试你对 C# `switch` 语句的知识和理解程度：\n\
    \n[`www.answertopia.com/k4uy`](https://www.answertopia.com/k4uy)\n\n![img](img/c_-switch.png)\n\
    \n## 10.9 总结\n\n当只有少数可能的结果时，`if-else` 语句是做出决策的可靠方法。然而，当一个评估结果会产生许多潜在的结果时，这种方法可能会变得繁琐。在这种情况下，`switch`\
    \ 语句是 C# 中实现流控制逻辑的更好选择。在许多情况下，可以使用 `switch` 表达式进一步简化 `switch` 语句。\n\n## 11. 使用\
    \ for 语句进行 C# 循环\n\n本章将继续研究 C# 代码中的控制流。在前面的章节中，我们检查了使用逻辑表达式来决定执行哪些 C# 代码。控制流的另一个方面涉及循环的定义。循环是\
    \ C# 语句的序列，会重复执行直到满足指定的条件。\n\n### 11.1 为什么要使用循环？\n\n通常我们知道，计算机非常擅长无限次地执行重复任务，而且速度非常快。另一个常识是，除非有人编程告诉计算机需要做什么，否则计算机什么都不做。循环语句是告诉计算机某项任务需要重复特定次数的主要机制。例如，假设你需要将一个数字自加十次。实现此点的一种方法可能是编写以下\
    \ C# 代码：\n\n```csharp\nlong j = 1;\nj += j;\nj += j;\nj += j;\nj += j;\nj += j;\n\
    j += j;\nj += j;\nj += j;\nj += j;\nj += j;\n```\n\n虽然这样做有些繁琐，但确实有效。如果你需要执行此任务\
    \ 100 次甚至 10,000 次会发生什么？像上面那样编写 C# 代码来执行将是不现实的。这种场景正是 `for` 循环旨在处理的。\n\nC# `for`\
    \ 循环的语法如下：\n\n```csharp\nfor ( <初始化器>; <条件表达式>; <循环表达式> )\n{\n    要执行的语句\n}\n\
    ```\n\n`<初始化器>`元素初始化了一个计数器变量。传统上，使用变量 `i` 用于此目的。例如：\n\n```csharp\ni = 0;\n```\n\
    \n上述代码将计数器设置为变量 `i` 并将其设置为零。注意，如果计数器变量之前没有声明，可以在 `for` 语句中进行声明：\n\n```csharp\n\
    int i = 0;\n```\n\n条件表达式指定了测试内容，用以验证循环是否执行了所需的迭代次数。例如，如果我们想让循环 100 次：\n\n```csharp\n\
    i < 100;\n```\n\n最后，循环表达式指定了在计数器变量上执行的操作。例如，加 1：\n\n```csharp\ni++;\n```\n\n在循环每次迭代中要执行的语句体包含在由左括号（`{`）和右括号（`}`）定义的代码块中。\n\
    \n通过这一切，我们可以创建一个 `for` 循环来执行前面示例中概述的任务：\n\n```csharp\nlong j = 1;\nfor (int i=0;\
    \ i<50; i++) {\n    j += j;\n    Console.WriteLine(\"j = \" + j);\n}\n```\n\n\
    ### 11.2 C# 循环变量作用域\n\n创建循环时需要注意的关键点是，在循环体内定义的任何变量对循环内的代码都是可见的。这是一个作用域的概念。例如，如果变量\
    \ `myCounter` 定义在 `for` 循环的体内，那么一旦循环终止，该变量就会消失：\n\n```csharp\n// 变量 myCounter\
    \ 不存在\nfor (int i = 0; i < 10; i++)\n{\n    int myCounter = 0; // 在 for 循环的作用域内创建变量\
    \ myCounter\n    myCounter += i;\n}\n// 循环退出后变量 myCounter 现在离开了作用域并消失\n```\n\n\
    ### 11.3 创建无限 for 循环\n\n可以使用 `for(;;)` 语法构建执行无限次数的 `for` 循环。例如，以下代码示例将不断输出“Hello\
    \ from C#”，直到用户手动终止程序（或计算机关闭或重启）：\n\n```csharp\nfor (;;) {\n    Console.WriteLine(\"\
    Hello from C#\");\n}\n```\n\n如果你在 VS Code 中尝试上面的示例并发现自己陷入了无限循环，可以使用下方图 11-1 中突出显示的停止按钮停止执行：\n\
    \n![img](img/vs_code_stop_button.png)\n\n图 11-1\n\n### 11.4 跳出 for 循环\n\n创建循环后，你可能需要在满足满足前跳出循环。C#\
    \ 提供了 `break` 语句来跳出循环。例如，以下代码示例会在 `j` 超过 100 时跳出当前循环：\n\n```csharp\nlong j = 10;\n\
    for (int i = 0; i < 50; i++) {\n    j += j;\n    Console.WriteLine(\"j = \" +\
    \ j);\n    if (j > 100)\n        break;\n}\n```\n\n### 11.5 嵌套 for 循环\n\n到目前，我们只查看了单层\
    \ `for`。也可以嵌套循环，让循环位于循环内部。例如：\n\n```csharp\nfor (int i = 0; i < 100; i++) {\n\
    \    Console.WriteLine(\"i = \" + i);\n    for (int j = 0; j < 10; j++) {\n  \
    \      Console.WriteLine(\"j = \" + j);\n    }\n}\n```\n\n上述示例将循环 100 次，每次显示 `i`。此外，这些每次迭代都会循环\
    \ 10 次，显示 `j`。\n\n### 11.6 从嵌套循环中跳出\n\n退出嵌套循环时需要注意的一个重要点是，`break` 只退出当前层。例如，以下代码示例会在\
    \ `j` 等于 5 时退出当前循环：\n\n```csharp\nfor (int i = 0; i < 100; i++) {\n    Console.WriteLine(\"\
    i = \" + i);\n    for (int j = 0; j < 10; j++) {\n        if (j == 5)\n      \
    \      break;\n        Console.WriteLine(\"j = \" + j);\n    }\n}\n```\n\n###\
    \ 11.7 继续 for 循环\n\n另一个用于循环的有用语句是 `continue` 语句。当执行过程在任何循环中遇到 `continue` 语句时，它会跳过循环体的剩余代码并从循环顶部重新开始执行。使用这种技术，我们可以例如构造一个\
    \ `for` 循环输出 1 到 9 之间的偶数：\n\n```csharp\nfor (int i = 1; i < 10; i++) {\n    if\
    \ ((i % 2) != 0)\n        continue;\n    Console.WriteLine($\"i = {i}\");\n}\n\
    ```\n\n### 11.8 C# foreach 语句\n\n`foreach` 循环用于迭代集合中的项序列，并提供了一种简单的循环选项。\n\n`foreach`\
    \ 循环的语法如下：\n\n```csharp\nforeach <name> in <collection> {\n    // 要执行的代码\n}\n\
    ```\n\n"
- fmt: "\nIn this syntax, `<name>` is the name for a constant containing the current\
    \ item from the object through which the loop is iterating. The code in the loop’s\
    \ body will typically use this constant name to reference the current item in\
    \ the loop cycle. The `<collection>` is the object through which the loop is iterating.\
    \ This could, for example, be an array of string or numeric values (the topic\
    \ of collections will be covered in greater detail in the chapter entitled [“Creating\
    \ 2D, 3D, and Jagged Arrays in C#”](#Arrays.xhtml__idTextAnchor317) ).\n\nConsider,\
    \ for example, the following `foreach` loop construct:\n\n```csharp\nstring[]\
    \ myColors = [\"red\", \"green\", \"yellow\", \"orange\", \"blue\"];\n\nforeach\
    \ (string color in myColors)\n{\n    Console.WriteLine(\"{0} \", color);\n}\n\
    ```\n\nThe loop begins by stating that the current item will be assigned to a\
    \ constant named `color`. We then tell the statement that it is to iterate through\
    \ all the elements in the `myColors` collection. The loop’s body sends a message\
    \ to the console panel indicating the current value assigned to the `color` constant.\n\
    \nAs we will see in the [“Creating 2D, 3D, and Jagged Arrays in C#”](#Arrays.xhtml__idTextAnchor317)\
    \ chapter, the `foreach` loop is particularly beneficial when working with collections\
    \ such as arrays and dictionaries.\n\n### 11.9 Take the knowledge test\n\nClick\
    \ the link below or scan the QR code to test your knowledge and understanding\
    \ of C# looping:\n\n[https://www.answertopia.com/3xzv](https://www.answertopia.com/3xzv)\n\
    \n![img](image/c_-for-loop.png)\n\n### 11.10 Summary\n\nLooping control flow is\
    \ a fundamental feature found in most programming languages used to perform tasks\
    \ that must be executed multiple times. In this chapter, we have covered the C#\
    \ `for` and `foreach` statements and how they are utilized to execute tasks a\
    \ specified number of times. Additionally, we have explored nested loops and explained\
    \ how to manage loop behavior using the `break` and `continue` statements.\n\n\
    ## 12. C# Looping with do and while Statements\n\nWith the topic of constructing\
    \ loops using the C# `for` statement covered, this chapter aims to introduce two\
    \ more looping options: the `while` and `do ... while` constructs.\n\nThe C# `for`\
    \ loop described in the previous chapter works well when you know in advance how\
    \ many times a particular task needs to be repeated in a program. However, there\
    \ will be instances where code needs to be repeated until a specific condition\
    \ is met, with no way of knowing how many repetitions will be needed to meet those\
    \ criteria. While it is possible to achieve this with a `for` loop containing\
    \ a `break` statement, C# provides a better alternative in the form of the `while`\
    \ loop (yet another construct inherited by C# from the C Programming Language).\n\
    \n### 12.1 The C# while loop\n\nEssentially, the `while` loop repeats a set of\
    \ tasks until a specified condition is met. The `while` loop syntax is defined\
    \ as follows:\n\n```csharp\nwhile (<condition>) {\n    // C# statements go here\n\
    }\n```\n\nIn the above example, `<condition>` is an expression that will return\
    \ either true or false, and the `// C# statements go here` comment represents\
    \ the C# code to be executed while the condition expression continues to evaluate\
    \ to true. For example:\n\n```csharp\nint myCount = 0;\nwhile ( myCount < 100\
    \ ) {\n    myCount++;\n}\nConsole.WriteLine($\"myCount = {myCount}\");\n```\n\n\
    In the above example, the `while` expression will evaluate whether the `myCount`\
    \ variable is less than 100. If it is already greater than 100, the code in the\
    \ braces is skipped, and the loop exits without performing any tasks.\n\nIf, on\
    \ the other hand, `myCount` is not greater than 100, the code in the braces is\
    \ executed, and the loop returns to the `while` statement and repeats the evaluation\
    \ of `myCount`. This process repeats until the value of `myCount` exceeds 100,\
    \ at which point the loop exits.\n\n### 12.2 C# do … while loops\n\nIt is often\
    \ helpful to think of the `do … while` loop as an inverted `while` loop. The `while`\
    \ loop evaluates an expression before executing the code in the loop’s body. The\
    \ code is not executed if the expression evaluates to false on the first check.\
    \ The `do … while` loop, on the other hand, is provided for situations where you\
    \ know that the code contained in the loop’s body will always need to be executed\
    \ at least once. For example, you may want to keep stepping through the items\
    \ in an array until a specific item is found. You know that you have to at least\
    \ check the first item in the array to have any hope of finding the entry you\
    \ need. The syntax for the `do … while` loop is as follows:\n\n```csharp\ndo {\n\
    \    // C# statements here\n} while (<conditional expression>);\n```\n\nIn the\
    \ `do … while` example below, the loop will continue until the value of a variable\
    \ named `i` equals 0:\n\n```csharp\nint i = 10;\ndo {\n    i--;\n    Console.WriteLine($\"\
    i = {i}\");\n} while (i > 0);\n```\n\n### 12.3 Breaking from loops\n\nAs with\
    \ the `for` loop, it is also possible to exit from a `while` or `do ... while`\
    \ loop at any time using the `break` statement. When the execution path encounters\
    \ a `while` statement, the looping will stop, and execution will proceed to the\
    \ code immediately following the loop. In the following example, the loop is coded\
    \ to exit when the value of `i` matches the value of `j`:\n\n```csharp\nint i\
    \ = 0;\nint j = 5;\nwhile (i < 100)\n{\n    i++;\n    Console.WriteLine($\"i =\
    \ {i}\");\n    if (i == j)\n        break;\n}\n```\n\nAs with breaking from `for`\
    \ loops, it is essential to note that in the case of nested `while` and `do` loops,\
    \ the `break` statement only exits the current loop.\n\n### 12.4 The continue\
    \ statement\n\nThe `continue` statement skips all remaining code in a loop and\
    \ returns execution to the top of the loop.\n\nIn the following example, the `WriteLine()`\
    \ method is only called when the value of `i` is an even number (i.e., divisible\
    \ by 2 with no remainder):\n\n```csharp\nint i = 1;\nwhile (i < 20) {\n    i++;\n\
    \    if ((i % 2) != 0)\n        continue;\n    Console.WriteLine(\"i = \" + i);\n\
    }\n```\n\nThe `continue` statement in the above example will skip the `WriteLine()`\
    \ call unless `i` can be divided by 2 with no remainder. If the `continue` statement\
    \ is triggered, execution will skip to the top of the loop (until the value of\
    \ `i` exceeds 19).\n\n### 12.5 Take the knowledge test\n\nClick the link below\
    \ or scan the QR code to test your knowledge and understanding of C# do-while\
    \ looping:\n\n[https://www.answertopia.com/3xzv](https://www.answertopia.com/3xzv)\n\
    \n![img](image/c_-do-while.png)\n\n### 12.6 Summary\n\nThe C# `do` and `while`\
    \ statements are versatile tools for performing a task repeatedly until a specific\
    \ condition is met, such as an arithmetic operation achieving the desired outcome\
    \ or data arriving on a network port. When used independently, the `while` loop\
    \ checks if the criteria have been met before executing the first iteration, thus\
    \ allowing the loop to be skipped entirely. On the other hand, the `do ... while`\
    \ loop is helpful when you know that the loop code needs to be executed at least\
    \ once before the completion criteria can be met. Both loops support the `break`\
    \ and `continue` statements.\n\n## 13. An Introduction to C# Object-Oriented Programming\n\
    \nSo far in this course, we have looked at the basics of programming in C#, such\
    \ as variable types and control flow. Although writing a functional program using\
    \ these techniques would be possible, there is much more to becoming a proficient\
    \ C# programmer. C# is, above all, an object-oriented programming language, and\
    \ as such, any C# programmer will be expected to create object-oriented applications\
    \ using this language.\n\nC# provides extensive support for developing object-oriented\
    \ applications. This chapter will introduce the basic concepts involved in object-oriented\
    \ programming and then explain the concept as it relates to application development.\n\
    \n### 13.1 What is an object?\n\nAn object is a self-contained module of functionality\
    \ that can be easily used and re-used as the building blocks for a software application.\n"
