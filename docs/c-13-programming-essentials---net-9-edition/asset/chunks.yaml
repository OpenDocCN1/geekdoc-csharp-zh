  trans: "\n\n# 19.3 创建 InterfaceDemo 项目\n\n在学习了 C# 接口的基础知识后，我们可以将这些知识应用于示例项目中。首先，在\
    \ VS Code 中创建一个名为 `InterfaceDemo` 的新 .NET 控制台应用程序项目。\n\n# 19.4 添加 C# 接口文件\n\n\
    下一步是使用 `Solution Explorer`（解决方案管理器）向项目添加一个新的接口文件。`Solution Explorer` 位于资源管理器面板的底部，如图图\
    \ 19-1 所示所示：\n\n![img](img/interface_solution_explorer.png)\n\n图 19-1\n\n在 `Solution\
    \ Explorer` 中，将鼠标指针悬停在 `InterfaceDemo` 条目上，显示新文件和文件夹按钮：\n\n![img](img/interface_solution_explorer_buttons.png)\n\
    \n图 19-2\n\n点击上方图 19-2 中箭头所示的新文件按钮，显示如图 19-3 所示的“添加新文件”调板。在调板中，选择 `Interface`选项：\n\
    \n![img](img/new_interface_file.png)\n\n图 19-3\n\n在提示出现时，将接口命名为 `IMessageBuilder`，然后按\
    \ `Enter` 键创建文件。新文件将自动加载到编辑器，内容如下：\n\n```csharp\nnamespace InterfaceDemo;\n\n\
    public interface IMessageBuilder\n\n{\n\n}\n```\n\n修改接口声明，添加一个名为 `ShowMessage()`\
    \ 的接口成员：\n\n```csharp\nnamespace InterfaceDemo;\n\npublic interface IMessageBuilder\n\
    {\nvoid ShowMessage();\n}\n```\n\n任何采用 `IMessageBuilder` 接口的类必须包含 `ShowMessage()`\
    \ 成员。使用 `Solution Explorer` 向项目添加一个名为 `MyMessageBuilder` 的类文件，并将其修改为实现 `IMessageBuilder`\
    \ 接口如下：\n\n```csharp\nnamespace InterfaceDemo;\n\npublic class MyMessageBuilder\
    \ : IMessageBuilder\n\n{\n\n}\n```\n\n完成上述更改后，编辑器将报告以下错误：\n\n`'MyMessageBuilder'\
    \ does not implement interface member 'IMessageBuilder.ShowMessage()'` `MyMessageBuilder`\
    \ 类产生此错误是因为它没有包含 `IMessageBuilder` 接口要求的 `ShowMessage()` 方法实现。为了符合接口，我们需要实现 `ShowMessage()`\
    \ 方法：\n\n```csharp\nnamespace InterfaceDemo;\n\npublic class MyMessageBuilder\
    \ : IMessageBuilder\n\n{\n\npublic void ShowMessage()\n\n{\n\n}\n\n}\n```\n\n\
    # 19.5 接口数据成员\n\n接口除了方法外，还可以包含数据成员。处理接口时的一个重要规则是变量必须声明为属性，而不能声明为字段或常量（关于字段和属性之间差异的提醒，请参阅“C#\
    \ 面对象编程简介”章节）。因此，以下声明将产生语法错误：\n\n```csharp\npublic interface IMessageBuilder\n\
    \n{\n\nstring myMessage; // 接口中字段是的\n\nvoid ShowMessage();\n}\n```\n\n相反，变量需要声明为属性：\n\
    \n```csharp\npublic interface IMessageBuilder\n\n{\n\nstring MyMessage { get;\
    \ set; }\n\nvoid ShowMessage();\n}\n```\n\n注意，上述接口中声明了 `get` 和 `set` 访问器方法，但并未实现。作为接口方法，其实实现在符合要求的类声明中进行的。\n\
    \n现在已经定义了 `IMessageBuilder`，让我们在 `MyMessageBuilder` 类中实现它：\n\n```csharp\npublic\
    \ class MyMessageBuilder : IMessageBuilder\n{\n    private string _myMessage;\n\
    \n    public string MyMessage\n    {\n        get => _myMessage;\n        set\
    \ => _myMessage = value;\n    }\n\n    public void ShowMessage()\n    {\n    \
    \    Console.WriteLine(_myMessage);\n    }\n}\n```\n\n现在，我们可以在 `Program.cs` 中使用接口：\n\
    \n```csharp\nusing InterfaceDemo;\n\nclass Program\n{\n    static void Main()\n\
    \    {\n        IMessageBuilder builder = new MyMessageBuilder();\n        builder.MyMessage\
    \ = \"Hello from Interface!\";\n        builder.ShowMessage();\n    }\n}\n```\n\
    \n# 19.6 使用接口\n\n运行应用程序以验证输出。\n\n# 19.7 总结\n\n本章介绍了如何在 C# 中创建和实现接口。我们了解到接口定义了类必须遵循的合同，并且接口中的变量必须是属性而不是字段。\n\
    \n"
- fmt: "\nTo demonstrate reference and value types in action, use the Solution Explorer\
    \ to add a new Struct named `SampleStruct` to the `StructureDemo` project. Follow\
    \ the usual steps to add the file, this time selecting the Strut option from the\
    \ file template panel as highlighted in [Figure 20-1](#Structures.xhtml__idTextAnchor258)\
    \ :\n\n![img](image/vs_code_new_struct.png)\n\nFigure 20-1\n\nOnce the file has\
    \ been created, modify it to read as follows:\n\n```csharp\nnamespace StructureDemo;\n\
    \npublic struct SampleStruct(string name)\n{\n    private string _name = name;\n\
    \n    public string Name {\n        get => _name;\n        set => _name = value;\n\
    \    }\n\n    public string BuildHelloMsg() {\n        return \"Hello \" + _name;\n\
    \    }\n}\n```\n\nNext, edit the `Program.cs` file to create a `SampleStruct`\
    \ instance and call the `BuildHelloMsg()` method:\n\n```csharp\nusing StructureDemo;\n\
    \nSampleStruct myStruct1 = new(name: \"Mark\");\n\nConsole.WriteLine(myStruct1.BuildHelloMsg());\n\
    ```\n\nWhen the code executes, the message “Hello Mark” will be displayed. Now\
    \ change the code so that a copy of the `myStruct1` instance is made, the name\
    \ property is changed, and the names from each instance are displayed in the message:\n\
    \n```csharp\nSampleStruct myStruct1 = new(name: \"Mark\");\n\nSampleStruct myStruct2\
    \ = myStruct1;\n\nmyStruct2.Name = \"David\";\n\nConsole.WriteLine(myStruct1.BuildHelloMsg());\n\
    \nConsole.WriteLine(myStruct2.BuildHelloMsg());\n```\n\nWhen executed, the output\
    \ will read as follows:\n\nHello Mark\n\nHello David\n\nClearly, the change of\
    \ name only applied to `myStruct2` since this is an actual copy of `myStruct1`\
    \ containing its own copy of the data as shown in the following figure:\n\n![img](image/csharp_reference_type.png)\n\
    \nFigure 20-2\n\nTo contrast this behavior with an equivalent class, add a Class\
    \ named `SampleClass` to the project, and implement it as follows:\n\n```csharp\n\
    namespace StructureDemo;\n\npublic class SampleClass(string name)\n{\n    private\
    \ string _name = name;\n\n    public string Name {\n        get => _name;\n  \
    \      set => _name = value;\n    }\n\n    public string BuildHelloMsg() {\n \
    \       return \"Hello \" + _name;\n    }\n}\n```\n\nWith the class added to the\
    \ project, modify the `Program.cs` file to repeat the operations performed in\
    \ the structure example:\n\n```csharp\nSampleClass myClass1 = new(name: \"Mark\"\
    );\n\nSampleClass myClass2 = myClass1;\n\nmyClass2.Name = \"David\";\n\nConsole.WriteLine(myClass1.BuildHelloMsg());\n\
    \nConsole.WriteLine(myClass2.BuildHelloMsg());\n```\n\nWhen this code executes,\
    \ the following output will be generated:\n\nHello David\n\nHello David\n\nIn\
    \ this case, the name property change is reflected for both `myClass1` and `myClass2`\
    \ because both are references pointing to the same class instance as illustrated\
    \ in the figure below:\n\n![img](image/csharp_struct.png)\n\nFigure 20-3\n\nIn\
    \ addition to these value and reference type differences, structures do not support\
    \ inheritance and subclassing in the way that classes do. In other words, it is\
    \ not possible for one structure to inherit from another structure. Unlike classes,\
    \ structures also cannot contain a finalizer method. Structure members cannot\
    \ be specified as `abstract`, `virtual`, or `protected`.\n\n## 21. Tuple Type\n\
    \nIn this chapter, we explore how to use tuples to store multiple values.\n\n\
    ### 21.1 Creating the TupleDemo\nTo try out C# tuples, create a new TupleDemo\
    \ project.\n\n### 21.2 Declaring a Tuple\nWhen we declare a tuple, we need to\
    \ provide values, optionally. The syntax for declaring a tuple is as follows:\
    \ `<type1>, <type2>, ...`. For example, modify the `Program.cs` as follows, to\
    \ add top-level statements:\n\n```csharp\nnamespace TupleDemo\n{\n    internal\
    \ class Program\n    {\n        static void Main(string[] args)\n        {\n \
    \           GetData();\n        }\n\n        private static void GetData()\n \
    \       {\n            (int, string, double) myTuple = (10, \"Refrigerator\",\
    \ 432.43);\n        }\n    }\n}\n```\n\nIf you prefer not to declare the type\
    \ of each tuple, the `var` keyword may be used to tell the compiler to infer the\
    \ value:\n\n```csharp\nvar myTuple = (10, \"Refrigerator\", 432.43);\n```\n\n\
    ### 21.3 Accessing tuple values\nThe elements of a tuple can be accessed using\
    \ several different techniques. A specific tuple value may be accessed using dot\
    \ notation to access `Item<n>` where `<n>` is the number of the item (with the\
    \ first value being at 1). The code below, for example, extracts item 2 from the\
    \ tuple, assigns it to a variable and writes it to the console:\n\n```csharp\n\
    private static void GetData()\n{\n    var myTuple = (10, \"Refrigerator\", 432.43);\n\
    \    var item2 = myTuple.Item2;\n    Console.WriteLine(item2);\n}\n```\n\n###\
    \ 21.4 Tuple field names\nWhen creating a tuple, you can assign a name to each\
    \ value. The names assigned to the values stored in a tuple can then be used when\
    \ you reference those values in code, for example:\n\n```csharp\n(int Count, string\
    \ Product, double Price) myTuple = (10, \"Refrigerator\", 432.43);\n```\n\nWhen\
    \ using type inference to initialize a tuple, the field names are placed before\
    \ each value:\n\n```csharp\nvar myTuple = (Count: 10, Product: \"Refrigerator\"\
    , Price: 432.43);\n```\n"
