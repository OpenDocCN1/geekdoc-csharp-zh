    ## 7.15 总结


    本章通过探索数据类型并提供声明常量和变量的概述开始介绍 C#。它还介绍了类型安全和推断、特殊字符以及字符串插值等概念。最后，本章解释了隐式转换和显式转换之间的区别。


    ## 8. C# 运算符和表达式


    本章涵盖了在 C# 中编程时使用运算符创建表达式，包括算术运算符和赋值运算符。涵盖的主题还运算符优先级、逻辑运算符和三元运算符。


