  trans: "\n\n启动 VS Code，打开你的 “C# Essentials”工作空间文件夹并创建一个名为 `MethodDemo` 的新 .NET 控制台应用程序。\n\
    \n## 14.6 声明 C# 类文件\n\n遵循 C# 面向对象编程简介 章节中的步骤，使用解决方案管理器（Solutions Explorer）向 `MethodDemo`\
    \ 项目中添加一个名为 `Demo` 的新类文件。添加类文件后，对其进行如下修改以添加一个方法：\n\n```csharp\nusing System;\n\
    \nnamespace MethodDemo;\n\npublic class Demo\n{\n    public void SayHello()\n\
    \    {\n        Console.WriteLine(\"Hello\");\n    }\n}\n```\n\n## 14.7 调用 C#\
    \ 方法\n\n一旦声明，C# 方法就可以使用点符号法（dot notation）在类实例上调用，语法如下：\n\n`<instance>.<function\
    \ name>(<arg1>, <arg2>, ... )`\n\n传递给方法的每个参数必须与该方法配置为接受的参数匹配。例如，要调用上述名为 `SayHello()`\
    \ 的示例方法（该方法没有参数也没有返回值），我们需要对 `Program.cs` 文件进行如下修改：\n\n```csharp\nusing MethodDemo;\n\
    \nDemo demo = new();\n\ndemo.SayHello();\n```\n\n当应用程序运行时，“Hello”消息将显示在终端中。\n\n\
    ## 14.8 处理返回值\n\n`SayHello()` 方法的定义包含了 `void` 关键字，表示它不返回结果值。接下来，在 `Demo` 类中添加一个名为\
    \ `BuildMessage()` 的方法，该方法接受两个参数并返回一个字符串结果，如下：\n\n```csharp\npublic class Demo\n\
    {\n    public void SayHello()\n    {\n        Console.WriteLine(\"Hello\");\n\
    \    }\n\n    public string BuildMessage(string name, int count)\n    {\n    \
    \    return ($\"Hello {name}, you are visitor number {count}.\");\n    }\n}\n\
    ```\n\n在上述代码中，我们如下所示对返回值包裹了括号：\n\n`return ($\"Hello {name}, you are visitor number\
    \ { count}\");`\n\n这些括号是可选的，因此以下也是 `return` 语句的有效用法：\n\n`return $\"Hello {name},\
    \ you are visitor number {count}.\";`\n\n返回 `Program.cs` 文件并添加代码来调用新方法：\n\n```csharp\n\
    Demo demo = new();\n\nstring message = demo.BuildMessage(\"Bill\", 10);\n\nConsole.WriteLine(message);\n\
    ```\n\n在上面的示例中，我们创建了一个名为 `message` 的新变量，并使用赋值运算符（`=`）在将结果写入控制台之前存储方法的结果。当应用程序运行时，终端中应该出现以下输出：\n\
    \n`Hello Bill, you are visitor number 10\\.`\n\n## 14.9 向方法传递参数\n\n在调用期望参数的方法时，有多种选项可用。其中一个选项（如上所示）是按照参数在方法声明中声明的顺序传递参数：\n\
    \n`string message = demo.BuildMessage(\"Bill Gates\", 10);`\n\n以这种方式调用方法时，参数必须按照参数在方法中声明的顺序进行传递。使用这种技术向方法传递参数也可能难以理解每个参数的用途。这两个问题都可以使用命名参数（named\
    \ arguments）来解决。\n\n### 14.9.1 命名参数\n\n使用命名参数涉及在调用时引用在方法声明中分配的参数名。例如：\n\n`demo.BuildMessage(name:\
    \ \"Steve\", count: 30);`\n\n由于在使用命名参数时顺序并不重要，因此以下也是一个有效的调用：\n\n`demo.BuildMessage(count:\
    \ 30, name: \"Steve\");`\n\n对 `Program.cs` 文件进行以下更改以查看命名参数的作用：\n\n```csharp\n\
    Demo demo = new();\n\nstring message = demo.BuildMessage(name: \"Bill\", count:\
    \ 10);\n\nConsole.WriteLine(message);\n\nmessage = demo.BuildMessage(count: 30,\
    \ name: \"Steve\");\n\nConsole.WriteLine(message);\n```\n\n如上面的代码所示，在调用方法时参数的顺序不再重要。同时，理解传递给方法的每个参数的用途也变得更加容易。\n\
    \n### 14.9.2 可选参数\n\n通过指定一个默认参数值，可以使 C# 参数变为可选的，如果在调用方法时未提供参数值，则将使用该值。这涉及到在声明方法时为参数分配默认值。在使用可选参数时，唯一的要求是在方法声明中将可选参数放在任何强制性参数之后。\n\
    \n对 `BuildMessage()` 方法进行如下修改，以便在调用方法时未提供客户名称时，使用字符串“Customer”作为默认：\n\n```csharp\n\
    public class Demo\n{\n    public void SayHello()\n    {\n        Console.WriteLine(\"\
    Hello\");\n    }\n\n    public string BuildMessage( int count, string name = \"\
    Customer\" )\n    {\n        return $\"Hello {name}, you are visitor number {count}.\"\
    ;\n    }\n}\n```\n\n对方法进行修改后，尝试在传递名称参数的情况下调用它：\n\n```csharp\nDemo demo = new();\n\
    \nstring message = demo.BuildMessage( count: 10 );\n\nConsole.WriteLine(message);\n\
    ```\n\n当应用程序运行时，将出现以下输出，其中“Customer”替换了名称：\n\n`Hello Customer, you are visitor\
    \ number 10\\.`\n\n## 14.10 处理可数量的参数\n\n到为止，我们查看了接受固定数量参数的方法。C# 还提供了一种方法让方法接受可数量的参数。这涉及到使用\
    \ `params` 关键字将参数分组在单个对象中，这在 C# List 章节中有所讨论。假设我们需要一个接受未指定数量字符串的方法。使用 `params`\
    \ 关键字，我们可以如下声明方法：\n\n```csharp\npublic void GreetGuests( params List<string> guests)\n\
    {\n    foreach (var guest in guests) {\n        Console.WriteLine($\"Welcome,\
    \ {guest}\");\n    }\n}\n```\n\n当我们调用 `GreetGuests()` 方法时，可以传递包含任何数量名称的 `List`\
    \ 实例：\n\n```csharp\nList<string> names = [\"John\", \"Paul\", \"George\"];\ndemo.GreetGuests(names);\n\
    \nnames = [\"Mark\", \"Robert\"];\ndemo.GreetGuests(names);\n```\n\n`params` 参数可以与其他方法参数结合，例如：\n\
    \n```csharp\npublic void GreetGuests( int groupId, params List<string> guests)\n\
    {\n    .\n}\n```\n\n方法只能接受一个 `params` 参数，它必须位于参数列表的末尾。\n\n## 14.11 C# in, out,\
    \ 和 ref 修饰符\n\n当传递参数给方法时，它是按值传递的。假设代码包含一个名为 `myVar` 的 `int` 变量，并为其分配值 10。随后 `myVar`\
    \ 变量被传递给名为 `DoSomething()` 的方法。在这种情况下，传递的是值 10 的拷贝，与原始的 `myVar` 变量没有连接。因此，方法内部对值的更改不会反映在原始变量中。\n\
    \n向 `Demo` 类添加以下方法以演示这种效果：\n\n```csharp\npublic class Demo\n{\n    .\n    public\
    \ void DoSomething(int myVar) {\n        myVar = 10;\n    }\n}\n```\n\n接下来，对 `Program.cs`\
    \ 文件进行如下修改：\n\n```csharp\nint myVar = 20;\nDemo demo = new();\nConsole.WriteLine($\"\
    Before method call myVar = {myVar}\");\n\ndemo.DoSomething(myVar);\n\nConsole.WriteLine($\"\
    After method call myVar = {myVar}\");\n```\n\n上面的代码声明了一个变量并赋值 20。在调用方法之前，显示了 `myVar`\
    \ 的当前值。该变量作为参数传递给 `DoSomething()` 方法，在其中被赋值为 10。当 `DoSomething()` 方法返回时，再次输出分配给\
    \ `myVar` 变量的值。\n\n运行程序并验证分配给 `myVar` 变量的值未被 `DoSomething()` 方法更改：\n\n`Before\
    \ method call myVar = 20`\n`After method call myVar = 20`\n\n为了允许在方法内部更改分配给变量的值，我们需要按引用传递变量。\n\
    \n"
- fmt: "\nPassing by reference means that instead of passing the underlying value,\
    \ we are passing a reference to the location in memory where the variable stores\
    \ its value. Any changes made within the method will be made to the variable’s\
    \ value.\n\nA variable is passed by reference using the `ref` modifier both when\
    \ declaring the parameter in the method and when calling the method, as shown\
    \ below:\n\n```csharp\n// Demo.cs\npublic class Demo {\n    // ...\n    public\
    \ void DoSomething(ref int myVar) {\n        myVar = 10;\n    }\n}\n```\n\n```csharp\n\
    // Program.cs\nConsole.WriteLine($\"Before method call myVar = {myVar}\");\ndemo.DoSomething(ref\
    \ myVar);\nConsole.WriteLine($\"After method call myVar = {myVar}\");\n```\n\n\
    The output from running the app shows that the value assigned to `myVar` changes\
    \ from 20 to 10 after the method call:\n\nBefore method call myVar = 20\nAfter\
    \ method call myVar = 10\n\nAnother modifier available when calling methods is\
    \ the `out` keyword. Whether the variable value is changed within the method is\
    \ optional when using the `ref` modifier. To force the change to the variable\
    \ within the method, use the `out` modifier instead of the `ref`.\n\nThe `out`\
    \ modifier is generally used to force the method to initialize a variable when\
    \ it is null at the point it is passed. For example:\n\n```csharp\n// Demo.cs\n\
    // ...\npublic void DoSomething(out string myVar) {\n    myVar = \"Hello\";\n\
    }\n```\n\n```csharp\n// Program.cs\nstring myVar;\nDemo demo = new();\ndemo.DoSomething(out\
    \ myVar);\nConsole.WriteLine($\"After method call myVar = {myVar}\");\n```\n\n\
    The final modifier to be covered is the `in` modifier. This modifier also sends\
    \ the variable to the method by reference but prevents that reference from being\
    \ changed from within the method. The following code change, for example, will\
    \ generate a syntax error because `myVar` is now a read-only variable:\n\n```csharp\n\
    // Demo.cs\n// ...\npublic void DoSomething(in string myVar) {\n    myVar = \"\
    Hello\"; // Syntax error - readonly variable\n}\n```\n\n```csharp\n// Program.cs\n\
    // ...\ndemo.DoSomething(in myVar);\n// ...\n```\n\n### 14.12 Take the knowledge\
