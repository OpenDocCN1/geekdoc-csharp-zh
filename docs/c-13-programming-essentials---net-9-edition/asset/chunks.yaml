    \n异常使用 `try-catch` 块进行处理。可能抛出异常的代码放置在 `try` 块中，而 `catch` 块包含在抛出异常时处理该异常的代码。`catch`\
    \ 块可以访问异常的详细信息，在可能发生多种类型异常的情况下，可以使用过滤单独处理特定的异常类型。`finally` 块也可以用于执行代码（例如清理资源），无论是否发生异常执行。\n\
    \n# 24. C# 中的异步编程\n\n异步编程允许软件同时执行多个任务。这意味着像下载图像或处理大量数据之类的任务的完成速度比顺序执行更快。多任务处理还允许耗时操作在后台执行，而不影响应用程序的响应能力，从而提供更流畅的用户体验。\n\
    \n在本章中，我们将探索 C# 的异步特性，并解释如何使用它们将多任务支持整合到您的项目中。\n\n## 24.1 线程概述\n\n线程是现代 CPU 的基本特性，对于操作系统中的多任务处理至关重要。虽然\
    \ CPU 可以处理许多线程，但在给定时间内可以并行运行的实际数量受限于 CPU 核心数，通常取决于 CPU 型号，在 4 到 16 个核心之间。当线程数超过可用\
    \ CPU 核心数时，操作系统会使用线程调度来决定这些线程如何在可用核心之间共享。\n\n线程类似于运行在主进程中的小型进程。它们允许应用程序内部出现并行执行的现象，而直接在代码中管理它们可能是一个复杂且不可预测的过程。然而，C#\
    \ 异步特性的伟大之处在于它们在后台使用线程，并为您处理了所有的复杂性。\n\n## 24.2 主线程\n\n当应用程序首次启动时，运行时系统通常会创建一个线程，应用程序默认在该线程中运行。应用程序中任何使用主线程执行耗时任务的代码都会导致整个应用程序看起来像锁定了，直到任务完成。可以通过将要执行的任务启动在单独的线程中避免这一点，允许主线程不受阻地继续执行其他任务。\n\
    \n## 24.3 C# 中的异步编程\n\nC# 的异步支持由 `Task` 异步编程模型 (TAP) 提供，该模型允许以安全、逻辑且易于编写和理解的方式执行并行。换句话说，异步\
    \ C# 代码按从到下的顺序编写，与同步代码非常相似，使得逻辑流易于理解。\n\n本章介绍了 C# 异步编程，深入涵盖了高效并行执行的关键概念和技术。\n\n\
    ## 24.4 创建 AsyncDemo 项目\n\n启动 VS Code，打开您的“C# Essentials”工作空间文件夹，并创建一个名为 `AsyncDemo`\
    \ 的 .NET 控制台应用项目。\n\n## 24.5 同步代码\n\n在探索异步编程之前，我们将首先看一个同步代码执行的示例。首先打开 `Program.cs`\
    \ 文件并进行如下修改：\n\n```csharp\nnamespace AsyncDemo\n{\n    internal class Program\n\
    \    {\n        static void Main(string[] args)\n        {\n        }\n      \
    \  private static string ProcessFile(string filename) {\n            Console.WriteLine($\"\
    Start {filename} at {DateTime.Now}\");\n            Task.Delay(6000).Wait();\n\
    \            return filename;\n        }\n    }\n}\n```\n\n`ProcessFile()` 方法在调用\
    \ `Task.Delay()` 和 `Wait()` 方法之前输出一个开始时间戳，以模拟阻塞当前线程的 6 秒文件处理任务。延迟后，该方法返回完成文件的名称。\n\
    \n接下来，我们想在 `Main()` 方法中多次调用 `ProcessFile()`。这样做，我们还将输出开始时间戳，并使用 C# `Stopwatch`\
    \ 诊断类记录方法调用的总执行时间：\n\n```csharp\nusing System.Diagnostics;\n\nnamespace AsyncDemo\n\
    {\n    internal class Program\n    {\n        static void Main(string[] args)\n\
    \        {\n            Stopwatch stopwatch = Stopwatch.StartNew();\n        \
    \    Console.WriteLine(\"\\n=== Before async task calls ===\\n\");\n         \
    \   string filename1 = ProcessFile(\"file1.txt\");\n            Console.WriteLine($\"\
    End {filename1} at {DateTime.Now}\\n\");\n            string filename2 = ProcessFile(\"\
    file2.txt\");\n            Console.WriteLine($\"End {filename2} at {DateTime.Now}\\\
    n\");\n            string filename3 = ProcessFile(\"file3.txt\");\n          \
    \  Console.WriteLine($\"End {filename3} at {DateTime.Now}\\n\");\n           \
    \ Console.WriteLine(\"=== After async tasks calls ===\\n\");\n            stopwatch.Stop();\n\
    \            TimeSpan timeSpan = stopwatch.Elapsed;\n            Console.WriteLine($\"\
    Elapsed time: {timeSpan.Seconds} seconds\");\n        }\n    }\n}\n```\n\n运行程序并检查控制台输出是否如下：\n\
    \n```\nStart file1.txt at 9/24/2024 1:05:04 PM\nEnd file1.txt at 9/24/2024 1:05:10\
    \ PM\nStart file2.txt at 9/24/2024 1:05:10 PM\nEnd file2.txt at 9/24/2024 1:05:16\
    \ PM\nStart file3.txt at 9/24/2024 1:05:16 PM\nEnd file3.txt at 9/24/2024 1:05:22\
    \ PM\n=== After async tasks calls ===\n\nElapsed time: 18 seconds\n```\n\n从上面的输出可以看出，对\
    \ `ProcessFile()` 方法的调用是顺序执行的，导致总时间为 18 秒。将 `ProcessFile()` 转换为异步方法可以将此时间缩短到 6\
    \ 秒。但在在此修改之前，我们首先需要引入 `Task` 类。\n\n## 24.6 理解 C# Task 类\n\nC# 中的异步操作由 `Task` 对象表示。正如我们之前看到的，我们可以直接调用静态\
    \ `Task` 方法，例如：\n\n```csharp\nTask.Delay(6000);\n```\n\n上述代码将启动一个异步 6 秒延迟。换句话说，尽管执行了延迟，但会在后台进行，调用后的任何代码将立即执行。为了让执行阻塞当前线程，我们调用\
    \ `Task` 的 `Wait()` 方法以在延迟之后继续执行：\n\n```csharp\nTask.Delay(6000).Wait();\n```\n\
    \n正如我们在本章剩余部分所示，启动的任何异步操作都会关联一个 `Task` 对象，允许我们管理后台执行。\n\n## 24.7 声明异步方法\n\n异步执行可以应用于方法、Lambda\
    \ 表达式和匿名函数，通过 `async` 关键字并指定 `Task` 返回类型进行声明。C# 命名规范还建议（但不要求）方法名以 `Async` 结尾。根据这些要求，我们可以如下修改\
    \ `ProcessFile()` 方法：\n\n```csharp\nprivate static async Task<string> ProcessFile(string\
    \ filename)\n{\n    Console.WriteLine($\"Start {filename} at {DateTime.Now}\"\
    );\n    await Task.Delay(6000).Wait();\n    return filename;\n}\n```\n\n我们已经声明该方法是异步的，并返回一个包含字符串结果参数（在此例中为文件名）的\
    \ `Task` 对象。\n\n注意由于由于现在在 `async` 方法中工作，我们已经从调用 `Task` 对象的 `Wait()` 方法切换到使用 `await`\
    \ 运算符。\n\n## 24.8 引入 await 运算符\n\n"
- fmt: "\nThe foundations of C# asynchronous execution are the `Task` class and the\
    \ `await` operator. The `await` operator tells the system to suspend the execution\
    \ of the calling method until a corresponding asynchronous operation completes\
    \ and returns.\n\nUsing our `AsyncDemo` example, we know that the `Main()` method\
    \ makes three consecutive calls to the file processing method and that each call\
    \ has to wait until the previous one completes before it can execute. In addition\
    \ to being an inefficient way to process multiple files, none of the code after\
    \ the three calls can execute until the last one completes, essentially locking\
    \ up the app. In all likelihood, there are other tasks the `Main()` method could\
    \ be performing while waiting for the results to be returned from the `ProcessFileAsync()`\
    \ method calls, such as processing other data, providing status updates to the\
    \ user, and responding to user input.\n\nUsing `Task` objects and `await`, we\
    \ can run three file processing operations in parallel and also allow other code\
    \ in the `Main()` method to run while we wait for the results from the asynchronous\
    \ calls.\n\nAs a first step, we will demonstrate why asynchronous execution requires\
    \ both a `Task` object and the `await` operator. A point to note first, however,\
    \ is that async methods can generally only be called from within the scope of\
    \ other async methods (though, as we will see later in the chapter, the `Task`\
    \ object can be used to provide a bridge between synchronous and asynchronous\
    \ code). With this in mind, make the following changes to declare `Main()` as\
    \ an asynchronous method:\n\n```csharp\nstatic async Task Main(string[] args)\n\
    {\n    Stopwatch stopwatch = Stopwatch.StartNew();\n    // ...\n}\n```\n\nNext,\
    \ modify the asynchronous calls to use the `await` operator as shown below:\n\n\
    ```csharp\nstatic async Task Main(string[] args)\n{\n    Stopwatch stopwatch =\
    \ Stopwatch.StartNew();\n    Console.WriteLine(\"\\n=== Before async task calls\
    \ ===\\n\");\n    string filename1 = await ProcessFileAsync(\"file1.txt\");\n\
    \    Console.WriteLine($\"End {filename1} at {DateTime.Now}\\n\");\n    string\
    \ filename2 = await ProcessFileAsync(\"file2.txt\");\n    Console.WriteLine($\"\
    End {filename2} at {DateTime.Now}\\n\");\n    string filename3 = await ProcessFileAsync(\"\
    file3.txt\");\n    Console.WriteLine($\"End {filename3} at {DateTime.Now}\");\n\
    \    Console.WriteLine(\"\\n=== After async tasks calls ===\\n\");\n    stopwatch.Stop();\n\
    \    TimeSpan timeSpan = stopwatch.Elapsed;\n    Console.WriteLine($\"Elapsed\
    \ time: {timeSpan.Seconds} seconds\\n\");\n}\n```\n\nOnce the modifications are\
    \ complete, run the app and check the console output, which resembles the following:\n\
    \n```\n=== Before async task calls ===\nStart file1.txt at 9/25/2024 9:53:46 AM\n\
    End file1.txt at 9/25/2024 9:53:52 AM\nStart file2.txt at 9/25/2024 9:53:52 AM\n\
    End file2.txt at 9/25/2024 9:53:58 AM\nStart file3.txt at 9/25/2024 9:53:58 AM\n\
    End file3.txt at 9/25/2024 9:54:04 AM\n=== After async tasks calls ===\nElapsed\
    \ time: 18 seconds\n```\n\nAlthough we have made the file processing method asynchronous\
    \ and used the `await` operator, the console output shows that the tasks are still\
    \ being performed sequentially. By assigning the result from the `await` operation\
    \ directly to the `string` variables we have committed ourselves to waiting until\
    \ the result is returned, thereby forcing the code to execute synchronously.\n\
    \nTo resolve this, we need to implement the following execution flow:\n\n1. App\
    \ launches.\n2. `Main()` calls async methods.\n3. `Main()` continues to execute\
    \ while async tasks run in the background.\n4. After completing other work, `Main()`\
    \ suspends while awaiting results from async tasks.\n5. Async tasks complete and\
    \ return results.\n6. `Main()` resumes execution.\n\nThe challenge is to obtain\
    \ references to the async tasks that can be used later to await the results. We\
    \ achieve this by storing the `Task` objects returned by the async methods and\
    \ using them later in the code to await the results. To see this in action, make\
    \ the following changes to the `Main()` method:\n\n```csharp\nstatic async Task\
    \ Main(string[] args)\n{\n    Stopwatch stopwatch = Stopwatch.StartNew();\n  \
    \  Console.WriteLine(\"\\n=== Before async task calls ===\\n\");\n    Task<string>\
    \ task1 = ProcessFileAsync(\"file1.txt\");\n    Task<string> task2 = ProcessFileAsync(\"\
    file2.txt\");\n    Task<string> task3 = ProcessFileAsync(\"file3.txt\");\n   \
    \ Console.WriteLine(\"=== After async tasks calls ===\\n\");\n    string filename1\
    \ = await task1;\n    Console.WriteLine($\"End {filename1} at {DateTime.Now}\"\
    );\n    string filename2 = await task2;\n    Console.WriteLine($\"End {filename2}\
    \ at {DateTime.Now}\");\n    string filename3 = await task3;\n    Console.WriteLine($\"\
    End {filename3} at {DateTime.Now}\\n\");\n    stopwatch.Stop();\n    TimeSpan\
    \ timeSpan = stopwatch.Elapsed;\n    Console.WriteLine($\"Elapsed time: {timeSpan.Seconds}\
    \ seconds\");\n}\n```\n\nRerun the app and check the console output:\n\n```\n\
    === Before async task calls ===\nStart file1.txt at 9/25/2024 1:59:16 PM\nStart\
    \ file2.txt at 9/25/2024 1:59:16 PM\nStart file3.txt at 9/25/2024 1:59:16 PM\n\
    === After async tasks calls ===\nEnd file1.txt at 9/25/2024 1:59:22 PM\nEnd file2.txt\
    \ at 9/25/2024 1:59:22 PM\nEnd file3.txt at 9/25/2024 1:59:22 PM\nElapsed time:\
    \ 6 seconds\n```\n\nThe first point to note from the above output is that the\
    \ total execution time has dropped to 6 seconds from 18 seconds because the async\
    \ tasks were executed concurrently. As an alternative to waiting for each task\
    \ to complete individually, we can pass them to the `Task.WaitAll()` method and\
    \ obtain the return values via the `Result` property of the respective `Task`\
    \ objects:\n\n```csharp\nstatic async Task Main(string[] args)\n{\n    // ...\n\
    \    Console.WriteLine(\"=== After async tasks calls ===\\n\");\n    Task.WaitAll(task1,\
    \ task2, task3);\n    Console.WriteLine($\"End {task1.Result} at {DateTime.Now}\"\
    );\n    Console.WriteLine($\"End {task2.Result} at {DateTime.Now}\");\n    Console.WriteLine($\"\
    End {task3.Result} at {DateTime.Now}\");\n    // ...\n}\n```\n\n### Asynchronous\
    \ calls from synchronous functions\n\nAs previously mentioned, async methods are\
    \ expected to be called from within an asynchronous context. It is, however, possible\
    \ to start async tasks from a synchronous context by calling the `Task.Run()`\
    \ method. Suppose we have a synchronous method named `SyncMethod()` from which\
    \ we need to call an async method and attempt to do so as follows:\n\n```csharp\n\
    private static void SyncMethod()\n{\n    await AsyncMethod();\n}\n```\n\nThe above\
    \ code will result in the following error notification in the code editor:\n\n\
    The 'await' operator can only be used within an async method. Consider marking\
    \ this method with the 'async' modifier and changing its return type to 'Task'.\n\
    \nThe only options we have are to make `SyncMethod()` an async method or start\
    \ the task using the `Task.Run()` method. Assuming that declaring `SyncMethod()`\
    \ as an async method is not a viable option, in this case, the code will need\
    \ to be changed as follows:\n\n```csharp\nprivate static void SyncMethod()\n{\n\
    \    Task.Run(async () => {\n        await AsyncMethod();\n    });\n}\n```\n\n\
    ### Canceling asynchronous tasks\n\nActive asynchronous tasks can be canceled\
    \ at any time using the `CancellationTokenSource` class. A `CancellationTokenSource`\
    \ instance contains a unique `CancellationToken` object that is used to send cancellation\
    \ requests to running tasks. To add cancellation support to the `AsyncDemo` project,\
    \ begin with the following changes to the `Main()` method:\n\n```csharp\nstatic\
    \ async Task Main(string[] args)\n{\n    var tokenSource = new CancellationTokenSource();\n\
    \    var cancellationToken = tokenSource.Token;\n    // ...\n}\n```\n\nNow that\
    \ we have a cancellation token, some changes need to be made to the `ProcessFileAsync()`\
    \ method so that it can be passed to the `Task` that performs the 6-second delay:\n\
    \n```csharp\nprivate static async Task<string> ProcessFileAsync(string filename\
    \ ,\n    CancellationToken cancellationToken )\n{\n    Console.WriteLine($\"Start\
    \ {filename} at {DateTime.Now}\");\n    await Task.Delay(6000 , cancellationToken\
    \ );\n    return filename;\n}\n```\n"
