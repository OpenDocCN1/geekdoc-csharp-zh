    \n}\n\n}\n\n}\n\nWhen the app runs, the ClassA.OpenFile() method belonging to\
    \ the DemoSpaceTwo namespace will be called:\n\nSecond ClassA OpenFile()\n\nTo\
    \ access the DemoSpaceOne OpenFile() method, however, we must still override the\
    \ default namespace specified by the using statement as follows:\n\nusing DemoSpaceTwo;\n\
    \nstatic void Main(string[] args)\n\n{\n\nClassA.OpenFile() // Defaults to DemoSpaceTwo\n\
    \nDemoSpaceOne.ClassA.OpenFile(); // Explicitly selects DemoSpaceOne\n\n}\n\n\
    22.7 Nested namespaces\n\nNamespaces can be declared within other namespaces to\
    \ create a nested hierarchy. To experience nested namespaces, add the following\
    \ namespace declaration to the Program.cs file:\n\nnamespace DemoOne\n\n{\n\n\
    namespace DemoTwo\n\n{\n\nnamespace DemoThree\n\n{\n\nclass ClassC\n\n{\n\npublic\
    \ static string message = \"DemoThree message\";\n\n}\n\n}\n\n}\n\n}\n\nTo access\
    \ the message field we need to reference each of the containing namespaces:\n\n\
    static void Main(string[] args)\n\n{\n\nvar message = DemoOne.DemoTwo.DemoThree.ClassC.message;\n\
    \nConsole.WriteLine(message);\n\n}\n\nWhen the app runs, the output will now DemoThree\
    \ message.\n\n22.8 Aliases and the namespace alias operator\n\nC# allows the using\
    \ keyword to assign aliases to namespace references. Using this technique, we\
    \ can assign an alias to our nested namespace as follows:\n\nusing DemoSpaceTwo;\n\
    \nusing MyAlias = DemoOne.DemoTwo.DemoThree;\n\n.\n\n.\n\nTo access ClassC using\
    \ the alias, we use the alias operator (::):\n\nstatic void Main(string[] args)\n\
    \n{\n\nClassA.OpenFile();\n\nDemoSpaceOne.ClassA.OpenFile();\n\nvar message =\
    \ MyAlias:: ClassC.message;\n\nConsole.WriteLine(message);\n\n}\n\nNote that the\
    \ alias declaration has not overridden the “using DemoSpaceTwo” statement and\
    \ we are still able to access the OpenFile() method from the second ClassA without\
    \ referencing the namespace:\n\nClassA.OpenFile();\n\nThe alias operator can also\
    \ be used to explicitly access objects in the global namespace. Consider the following\
    \ code sample consisting of a class that is declared both in the global namespace\
    \ and within a class in a custom namespace:\n\nclass MyString\n\n{\n\npublic static\
    \ string text = \"Global string\";\n\n}\n\nnamespace SampleApp\n\n{\n\nclass MyString\n\
    \n{\n\npublic static string text = \"Local string\";\n\n}\n\ninternal class Program\n\
    \n{\n\nstatic void Main(string[] args)\n\n{\n\nConsole.WriteLine(MyString.text);\n\
    \n}\n\n}\n\n}\n\nWhen the above code executes, the text from the local MyString\
    \ class will be displayed. To access the global class, we can use the alias operator\
    \ to specify the global namespace:\n\nstatic void Main(string[] args)\n\n{\n\n\
    Console.WriteLine(MyString.text);\n\nConsole.WriteLine(global::MyString.text);\n\
    \n}\n\n22.9 File scoped namespaces\n\nIf the entire contents of a source file\
    \ is to belong to the same namespace, a file scoped declaration can be used. In\
    \ the following code, ClassA and ClassB are both declared within the FileScopeSpace\
    \ namespace:\n\nnamespace FileScopeSpace;\n\nclass ClassA\n\n{\n\npublic static\
    \ void OpenFile()\n\n{\n\nConsole.WriteLine(\"Class A OpenFile()\");\n\n}\n\n\
    }\n\nclass ClassB\n\n{\n\npublic static void OpenFile()\n\n{\n\nConsole.WriteLine(\"\
    Class B OpenFile()\");\n\n}\n\n}\n\nFile scoped namespaces cannot include other\
    \ namespaces. The following, therefore, is invalid syntax:\n\nnamespace FileScopeSpace;\n\
    \nclass ClassA\n\n{\n\npublic static void OpenFile()\n\n{\n\nConsole.WriteLine(\"\
    Class A OpenFile()\");\n\n}\n\n}\n\nnamespace SpaceOne // Invalid namespace declaration\n\
    \n{\n\nclass ClassB\n\n{\n\npublic static void OpenFile()\n\n{\n\nConsole.WriteLine(\"\
    Class B OpenFile()\");\n\n}\n\n}\n\n}\n\n22.10 Take the knowledge test\n\nClick\
    \ the link below or scan the QR code to test your knowledge and understanding\
    \ of C# namespaces:\n\n[https://www.answertopia.com/bkx3](https://www.answertopia.com/bkx3)\n\
    \n![img](image/c_-namespaces.png) \n\n22.11 Summary"
