    ## 32.6 知识测试


    点击下方的链接或扫描二维码，以测试你对 C# 日期和时间的知识与理解：


    [`www.answertopia.com/ants`](https://www.answertopia.com/ants)


    ![img](img/c_-dates.png)


    ## 32.7 总结


    在本章中，我们学习了 C# `DateTime` 对象，它用于在 C# 中处理日期和时间。我们讨论了如何通过指定日期或包含时间值来创建 `DateTime`
    对象。我们还查看了如何使用 `Today` 和 `Now` 属性访问当前日期和时间。此外，我们探索了 `DateTime` 对象提供的用于操作日期时间的各种方法，例如增加或减去天、月、年和其他时间单位。最后，我们涵盖了如何使用
    `DateTime` 属性提取日、月、年、小时和分钟等单独组件，这允许对日期和时间的特定元素进行操作。


