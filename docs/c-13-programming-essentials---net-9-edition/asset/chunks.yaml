    14.6 Declaring a C# class file


    Following the steps in the [“An Introduction to C# Object-Oriented Programming”](#Object_Orientated_Programming.xhtml__idTextAnchor159)
    chapter, use the Solutions Explorer to add a new class file named Demo to the
    MethodDemo project. Once you have added the class file, modify it as follows to
    add a method:


    using System;


    namespace MethodDemo;


    public class Demo


    {


    public void SayHello()


    {


    Console.WriteLine("Hello");


    }


    }


    14.7 Calling a C# method


    Once declared, C# methods are called on class instances using dot notation using
    the following syntax:


    <instance>.<function name>(<arg1>, <arg2>, ... )


    Each argument passed through to a method must match the parameters the method
    is configured to accept. For example, to call the above example method named SayHello(),
    which takes no parameters and returns no value, we need to modify the Program.cs
    file as follows:


    using MethodDemo;


    Demo demo = new();


    demo.SayHello();


    When the app runs, the “Hello” message will appear in the terminal.


    14.8 Handling return values


    The SayHello() method definition included the void keyword to indicate that it
    did not return a result value. Next, add a method named BuildMessage() to the
    Demo class which accepts two parameters and returns a string result as follows:


    public class Demo


    {


    public void SayHello()


    {


    Console.WriteLine("Hello");


    }


    public string BuildMessage(string name, int count)


    {


    return ($"Hello {name}, you are visitor number {count}.");


    }


    }


    In the above code, we placed parentheses around the return value as follows:


    return ($"Hello {name}, you are visitor number { count}");


    These parentheses are optional, so the following is also a valid use of the return
    statement:


    return $"Hello {name}, you are visitor number {count}.";


    Return to the Program.cs file and add code to call the new method:


    Demo demo = new();


    string message = demo.BuildMessage("Bill", 10);


    Console.WriteLine(message);


    In the above example, we created a new variable named message and used the assignment
    operator (=) to store the method’s result before writing it to the console. When
    the app runs, the following output should appear in the terminal:


    Hello Bill, you are visitor number 10\.


    14.9 Passing arguments to a method


    Several options are available when calling a method that is expecting arguments.
    One option, as demonstrated above, is to pass the arguments in the order in which
    they are declared in the method declaration:


    string message = demo.BuildMessage("Bill Gates", 10);


    When calling a method in this way, the arguments must be passed in the order in
    which the parameters are declared in the method. Passing arguments to a method
    using this technique can also make it difficult to understand the purpose of each
    argument. Both of these issues can be resolved using named arguments.


    14.9.1 Named arguments


    Using named arguments involves referencing the parameter names assigned in the
    method declaration when making calls. For example:


    demo.BuildMessage(name: "Steve", count: 30);


    Since ordering is not important when using named arguments, the following is also
    a valid call:


    demo.BuildMessage(count: 30, name: "Steve");


    Make the following changes to the Program.cs file to see named arguments in action:


    Demo demo = new();


    string message = demo.BuildMessage(name: "Bill", count: 10);


    Console.WriteLine(message);


    message = demo.BuildMessage(count: 30, name: "Steve");


    Console.WriteLine(message);


    As demonstrated in the code above, the ordering of the arguments no longer matters
    when making the method call. It is also easier to understand the purpose of each
    argument being passed to the method.


    14.9.2 Optional arguments


    C# arguments can be made optional by designating a default parameter value to
    be used if the value is not provided as an argument when the method is called.
    This involves assigning the default value to the parameter when the method is
    declared. When working with optional arguments, the only requirement is to place
    the optional parameters after any mandatory parameters in the method declaration.


    Modify the BuildMessage() method as follows so that the string “Customer” is used
    as the default if a customer name is not provided when the method is called:


    public class Demo


    {


    public void SayHello()


    {


    Console.WriteLine("Hello");


    }


    public string BuildMessage( int count, string name = "Customer" )


    {


    return $"Hello {name}, you are visitor number {count}.";


    }


    }


    After making the change to the method, try calling it without a name argument:


    Demo demo = new();


    string message = demo.BuildMessage( count: 10 );


    Console.WriteLine(message);


    When the app runs, the following output will appear with “Customer” substituted
    for the name:


    Hello Customer, you are visitor number 10\.


    14.10 Handling variable numbers of arguments


    So far we have looked at method examples that accept a fixed number of arguments
    when called. C# also provides a way to configure a method to accept a variable
    number of arguments. This involves placing the arguments in a List collection
    and handling it using the params keyword. The C# List class allows multiple items
    to be grouped within a single object and will be covered in the [“C# List Collections”](#List_Collections.xhtml__idTextAnchor335)
    chapter. Suppose that we need a method that will accept an unspecified number
    of string arguments. Using the params keyword, we could declare the method as
    follows:


    public void GreetGuests( params List<string> guests)


    {


    foreach (var guest in guests) {


    Console.WriteLine($"Welcome, {guest}");


    }


    }


    When we call the GreetGuests() method, we can pass it a List instance containing
    any number of guest names without making changes to the GreetGuests() method:


    List<string> names = ["John", "Paul", "George"];


    demo.GreetGuests(names);


    names = ["Mark", "Robert"];


    demo.GreetGuests(names);


    A params parameter can be combined with other method parameters, for example:


    public void GreetGuests( int groupId, params List<string> guests)


    {


    .


    .


    }


    A method can accept only one params argument, which must be positioned at the
    end of the parameter list.


    14.11 C# in, out, and ref parameter modifiers


    When an argument is passed to a method, it is passed as a value . Suppose the
    code contains an int variable named myVar , to which the value 10 is assigned.
    The myVar variable is then passed to a method named DoSomething(). In this scenario,
    only a copy of the value 10 is passed to the method with no connection to the
    original myV ar variable. Consequently, any changes to the value from within the
    method will not be reflected in the original variable.


    Add the following method to the Demo class to demonstrate this effect in action:


    public class Demo {


    .


    .


    public void DoSomething(int myVar) {


    myVar = 10;


    }


    }


    Next, modify the Program.cs file as follows:


    int myVar = 20;


    Demo demo = new();


    Console.WriteLine($"Before method call myVar = {myVar}");


    demo.DoSomething(myVar);


    Console.WriteLine($"After method call myVar = {myVar}");


    The code above declares a variable and assigns it a value of 20\. Before calling
    the method, the current value of myV ar is displayed. The variable is then passed
    as an argument to the DoSomething() method, where it is assigned a value of 10\.
    When the DoSomething() method returns, the value assigned to the myV ar variable
    is output again.


    Run the app and verify the value assigned to the myVar variable was not changed
    by the DoSomething() method:


    Before method call myVar = 20


    After method call myVar = 20


    To allow the value assigned to the variable to be changed within the method, we
    need to pass the variable by reference .'
